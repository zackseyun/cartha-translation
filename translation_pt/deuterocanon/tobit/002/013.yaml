  yaml_path: translation/deuterocanon/tobit/002/013.yaml
  text: But when she came to me[a], she began to cry out, and I said to her, “Where is the young goat from? Is it stolen? Give it back to its owners, for it is not lawful to eat what is stolen.”
translation:
  language: pt
  text: 'Mas, quando ela veio até mim, começou a gritar. Então eu lhe disse: “De onde veio este cabrito? Será que foi roubado? Devolva-o aos donos, pois não é lícito comer coisa roubada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο κράζειν
  choice: começou a gritar
  rationale: A construção indica o início de uma fala em voz alta. “Gritar” preserva a intensidade sem definir se a emoção era raiva, aflição ou protesto.
- source_word: Πόθεν τὸ ἔριφον;
  choice: De onde veio este cabrito?
  rationale: πόθεν pergunta pela procedência, e ἔριφον designa um bode jovem. “Cabrito” é claro, natural e exato em português.
- source_word: μὴ κλεμμάιον ἐστίν;
  choice: Será que foi roubado?
  rationale: A pergunta com μή manifesta suspeita e espera uma resposta negativa, sem afirmar diretamente que o animal foi roubado. “Será que” reproduz essa nuance de modo natural.
- source_word: ἀπόδος αὐτὸ τοῖς κυρίοις
  choice: Devolva-o aos donos
  rationale: ἀπόδος ordena a restituição, e κυρίοις refere-se aqui aos proprietários do animal, não a senhores em sentido social ou teológico.
- source_word: θεμιτὸν
  choice: lícito
  rationale: O termo expressa aquilo que é permitido segundo norma, costume ou lei. “Lícito” conserva a força moral e jurídica da objeção.
- source_word: φαγεῖν κλεψιμαῖον
  choice: comer coisa roubada
  rationale: A expressão abrange aquilo que foi furtado ou roubado. “Coisa roubada” mantém essa generalidade e soa natural no contexto.
theological_decisions:
- issue: Força moral e jurídica de θεμιτὸν na objeção de Tobit
  choice: pois não é lícito comer coisa roubada
  alternative: pois não é certo comer o que foi roubado
  rationale: “Lícito” preserva o caráter normativo da declaração, sem vinculá-la indevidamente a um sistema jurídico posterior ou a uma tradição confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide a fala em frases naturais. “Então” explicita apenas a progressão narrativa já presente na coordenação grega, sem acrescentar conteúdo interpretativo. Não se incluiu nota para ἔριφον porque “cabrito” já designa com clareza um bode jovem em português.
