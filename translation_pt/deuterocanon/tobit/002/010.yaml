base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/010.yaml
  text: And I did not know that sparrows were in the wall[a]; and while my eyes were open, the sparrows dropped warm dung into my eyes, and white films formed on my eyes. Then I went to physicians, but they did not help me[b]. But Achiacharus supported me until I went to Elymais.
translation:
  language: pt
  text: Eu não sabia que havia pardais no muro[a]. Enquanto meus olhos estavam abertos, os pardais deixaram cair excremento quente nos meus olhos, e formaram-se películas brancas nos meus olhos. Fui então procurar médicos, mas eles não me ajudaram[b]. Aicar, porém, sustentou-me até que eu fosse para a Elimaida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aves pequenas”; o grego pode referir-se mais genericamente a pequenas aves, embora “pardais” seja o sentido mais provável.
    reason: lexical_alternative
  - marker: b
    text: O grego diz que se formaram “películas brancas” ou “opacidades brancas” nos olhos. Isso costuma ser entendido como uma condição semelhante à catarata, mas o texto não apresenta um diagnóstico médico preciso.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: pardais
  rationale: O diminutivo grego pode designar pardais ou, de modo mais amplo, aves pequenas. “Pardais” é o sentido mais provável e mantém a identificação tradicional, enquanto a nota registra a alternativa.
- source_word: ἐν τῷ τοίχῳ
  choice: no muro
  rationale: Reproduz de perto a localização expressa pelo grego, sem interpretar que as aves estavam no telhado ou especificamente numa fresta.
- source_word: ἀνεῳγότων
  choice: enquanto eu estava com os olhos abertos
  rationale: Expressa de maneira natural em português o valor temporal do genitivo absoluto.
- source_word: ἀφώδευσαν ... θερμὰ
  choice: deixaram cair excremento quente
  rationale: Mantém o sentido concreto e pouco eufemístico do verbo, mas com formulação corrente e digna em português.
- source_word: λευκώματα
  choice: películas brancas
  rationale: Descreve as opacidades visíveis sem impor um diagnóstico médico moderno, como catarata.
- source_word: ἰατρούς
  choice: médicos
  rationale: É a designação moderna, clara e direta para os profissionais procurados por Tobit.
- source_word: οὐκ ὠφέλησάν με
  choice: não me ajudaram
  rationale: Equivalência idiomática clara para a afirmação de que os médicos não lhe trouxeram benefício.
- source_word: ἔτρεφέν με
  choice: sustentou-me
  rationale: Abrange tanto alimentar quanto prover o necessário durante a incapacidade de Tobit, sem restringir indevidamente o sentido.
- source_word: Ἀχειαχάρος
  choice: Aicar
  rationale: Forma portuguesa tradicional e legível do nome, correspondente ao grego Ἀχειαχάρος.
- source_word: Ἐλυμαΐδα
  choice: Elimaida
  rationale: Transliteração portuguesa natural do topônimo grego, com acentuação coerente com o uso em português.
theological_decisions:
- issue: Descrição médica da cegueira de Tobit
  choice: Traduzir λευκώματα descritivamente como “películas brancas”.
  alternative: “cataratas”, “manchas brancas” ou “opacidades”
  rationale: O texto relata uma alteração branca nos olhos, mas não fornece base suficiente para um diagnóstico médico moderno específico. A tradução preserva essa indeterminação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A narração em primeira pessoa e a sequência direta do grego foram preservadas; termos médicos excessivamente técnicos e diagnósticos interpretativos foram evitados.
