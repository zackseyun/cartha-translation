base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/008.yaml
  text: And the neighbors were mocking[a], saying, “He is no longer afraid of being put to death over this matter; he ran away, and look, he is burying the dead again.”
translation:
  language: pt
  text: 'E os vizinhos zombavam dele[a], dizendo: “Ele já não tem medo de ser morto por causa disso! Fugiu, e vejam: está enterrando os mortos outra vez.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Outras tradições textuais de Tobit apresentam aqui um conteúdo muito diferente. A retrotradução hebraica indireta traz Ana falando dos atos de bondade e justiça de Tobit, que não o ajudaram em sua aflição e desonra, em vez de descrever os vizinhos zombando dele por enterrar os mortos.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ πλησίον
  choice: os vizinhos
  rationale: O adjetivo substantivado no plural designa as pessoas próximas; “os vizinhos” é natural em português e se ajusta ao contexto.
- source_word: ἐνέγελων
  choice: zombavam dele
  rationale: O imperfeito indica escárnio contínuo ou repetido; “zombavam” preserva esse aspecto e explicita naturalmente em português o alvo da zombaria.
- source_word: Οὐκέτι φοβεῖται
  choice: Ele já não tem medo
  rationale: “Já não” expressa οὐκέτι com clareza, enquanto “tem medo” reproduz de modo corrente o sentido do verbo.
- source_word: φονευθῆναι
  choice: de ser morto
  rationale: Mantém a voz passiva e evita especificar execução oficial ou assassinato, distinção que o grego não torna explícita.
- source_word: περὶ τοῦ πράγματος τούτου
  choice: por causa disso
  rationale: No contexto, a expressão aponta para o motivo do risco de morte; a formulação é idiomática sem acrescentar precisão indevida.
- source_word: ἀπέδρα
  choice: Fugiu
  rationale: O aoristo remete à fuga anterior de Tobit; “fugiu” é conciso, vívido e adequado ao tom de provocação.
- source_word: καὶ ἰδοὺ
  choice: e vejam
  rationale: O imperativo plural harmoniza com os vários falantes e preserva a função de ἰδού de chamar a atenção, em linguagem portuguesa atual.
- source_word: πάλιν
  choice: outra vez
  rationale: Expressa diretamente a repetição da ação e soa natural na fala zombeteira.
- source_word: θάπτει τοὺς νεκρούς
  choice: está enterrando os mortos
  rationale: A construção progressiva corresponde ao presente retratado como ação em curso após “vejam”.
theological_decisions:
- issue: Relação entre o testemunho grego e a tradição semítica indireta
  choice: O texto principal segue o grego, no qual os vizinhos zombam de Tobit por voltar a enterrar os mortos.
  alternative: A retrotradução hebraica indireta apresenta Ana censurando Tobit e dizendo que seus atos de bondade e justiça não o ajudaram em sua aflição e desonra.
  rationale: O grego de Swete é a fonte primária indicada e possui alta confiança. O hebraico citado é uma retrotradução moderna de um manuscrito aramaico, não um testemunho hebraico antigo, por isso não deve substituir o grego; sua divergência substancial, porém, merece nota textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta conserva o tom de escárnio e a vivacidade do grego sem recorrer a formas arcaicas.
