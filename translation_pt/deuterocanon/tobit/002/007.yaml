translation:
  language: pt
  text: E chorei. Quando o sol se pôs, fui, cavei e o sepultei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσα
  choice: chorei
  rationale: Expressa diretamente o aoristo de κλαίω, preservando a força emotiva sem especificar um luto ritual.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: quando o sol se pôs
  rationale: Reproduz de modo natural a oração temporal e a ação concluída do pôr do sol antes do sepultamento.
- source_word: ᾠχόμην
  choice: fui
  rationale: Verte com simplicidade o movimento indicado pelo verbo, sem acrescentar destino ou motivo não expressos.
- source_word: ὀρύξας
  choice: cavei
  rationale: Mantém o sentido literal do particípio, sem explicitar «uma cova», objeto apenas inferido pelo contexto.
- source_word: ἔθαψα αὐτόν
  choice: o sepultei
  rationale: É uma tradução corrente e digna de θάπτω com o pronome masculino explícito no grego.
