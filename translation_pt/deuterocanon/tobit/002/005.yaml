base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/005.yaml
  text: And when I returned[b][a], I washed myself and ate my bread in sorrow.
translation:
  language: pt
  text: Depois que voltei, lavei-me[a] e comi o meu pão[b] com tristeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “lavei-me”. Pelo contexto, provavelmente se trata da lavagem após a impureza causada pelo contato com um morto; a tradição semítica paralela torna mais explícito esse contexto de pureza.
    reason: cultural_note
  - marker: b
    text: Ou “a minha refeição”. O grego diz literalmente “o meu pão”, expressão que também pode designar o alimento em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψας
  choice: Depois que voltei
  rationale: O particípio aoristo indica uma ação anterior aos verbos principais. A formulação expressa com naturalidade a sequência temporal.
- source_word: ἐλουσάμην
  choice: lavei-me
  rationale: A voz média indica naturalmente que Tobias lavou a si mesmo. O contexto sugere uma lavagem ligada à impureza por contato com um morto, mas o grego não explicita a finalidade ritual.
- source_word: ἤσθιον
  choice: comi
  rationale: Embora o verbo esteja no imperfeito, o pretérito perfeito é natural nesta sequência narrativa e não elimina nenhuma distinção contextual relevante.
- source_word: τὸν ἄρτον μου
  choice: o meu pão
  rationale: ἄρτος significa literalmente “pão”, mas também pode designar alimento ou refeição por extensão. A tradução mantém a imagem concreta do grego.
- source_word: ἐν λύπῃ
  choice: com tristeza
  rationale: λύπη abrange tristeza, pesar e aflição. “Com tristeza” é claro e natural, sem especificar além do texto a natureza exata do sofrimento.
theological_decisions:
- issue: Explicitar ou não o caráter ritual da lavagem
  choice: Manter “lavei-me” no texto principal.
  alternative: “purifiquei-me” ou “tomei banho para me purificar”
  rationale: O contexto e a tradição semítica paralela apontam para uma lavagem após contato com um morto, mas o grego afirma apenas que Tobias se lavou. A tradução preserva essa distinção e explica o provável contexto em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação de “meu” após o artigo soa natural, e “lavei-me” conserva com concisão a reflexividade do grego. As notas mantêm a ordem alfabética dos marcadores no texto.
