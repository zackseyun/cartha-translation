base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/001.yaml
  text: When I had come down to my house[a], and Anna my wife and Tobiah my son were restored to me, on the feast of Pentecost, which is the holy feast of seven weeks, a fine meal was prepared for me[c][b], and I reclined to eat.
translation:
  language: pt
  text: Quando desci à minha casa e Ana, minha esposa, e Tobias, meu filho, me foram restituídos, durante a festa de Pentecostes[a], que é a santa festa das sete semanas, foi-me preparada uma boa refeição[c], e reclinei-me à mesa para comer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Festa das Semanas». O grego diz «Pentecostes» e logo a explica como «a santa festa das sete semanas».
    reason: alternative_reading
  - marker: b
    text: O grego diz literalmente «reclinei-me para comer», refletindo o costume antigo de tomar as refeições reclinado à mesa.
    reason: cultural_note
  - marker: c
    text: A tradição semítica paralela apresenta uma forma mais extensa deste versículo e acrescenta que Tobias foi enviado para convidar um parente pobre para a refeição. Esse conteúdo não aparece na redação grega mais breve traduzida aqui.
    reason: textual_variant
lexical_decisions:
- source_word: κατῆλθον
  choice: desci
  rationale: Preserva o sentido direcional de «descer», em vez de reduzi-lo simplesmente a «voltar».
- source_word: οἶκόν
  choice: casa
  rationale: Mantém o sentido concreto de οἶκος e soa natural com o possessivo «minha».
- source_word: ἀπεδόθη μοι
  choice: me foram restituídos
  rationale: Expressa a ideia passiva de serem dados de volta a Tobit. O plural em português concorda naturalmente com Ana e Tobias, embora o grego apresente o verbo no singular.
- source_word: Ἄννα ἡ γυνή μου
  choice: Ana, minha mulher
  rationale: Translitera o nome grego em sua forma portuguesa corrente e traduz diretamente a relação familiar.
- source_word: Τωβίας ὁ υἱός μου
  choice: Tobias, meu filho
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecível do nome, sem alterar a identificação da personagem.
- source_word: πεντηκοστῇ ἑορτῇ
  choice: festa de Pentecostes
  rationale: Conserva a designação grega da festa; a explicação que vem em seguida esclarece sua identidade judaica como Festa das Semanas.
- source_word: ἁγία ἑπτὰ ἑβδομάδων
  choice: a santa festa das sete semanas
  rationale: Torna explícito o substantivo «festa», subentendido na expressão grega, e preserva a explicação do nome Pentecostes.
- source_word: ἐγενήθη ἄριστον καλὸν μοι
  choice: prepararam para mim uma boa refeição
  rationale: Traduz idiomaticamente a expressão literal «veio a haver para mim uma boa refeição», sem especificar no texto quem a preparou.
- source_word: ἀνέπεσα τοῦ φαγεῖν
  choice: me reclinei à mesa para comer
  rationale: Preserva o costume antigo de comer reclinado; «à mesa» esclarece o contexto sem substituir a postura por «sentar-se».
theological_decisions:
- issue: Nome da festa judaica designada por πεντηκοστή
  choice: festa de Pentecostes ... a santa festa das sete semanas
  alternative: Festa das Semanas
  rationale: Mantém o termo efetivamente usado pelo texto grego e também sua explicação, evitando que «Pentecostes» seja entendido apenas em sentido cristão posterior.
- issue: Forma portuguesa do nome Τωβίας
  choice: Tobias
  alternative: Tobias/Tobiah em transliteração sem adaptação portuguesa
  rationale: «Tobias» é a forma portuguesa corrente e reconhecível, adequada a uma tradução moderna destinada a leitores lusófonos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A sintaxe foi levemente reorganizada em duas frases para evitar um período excessivamente longo. Mantiveram-se o sentido direcional de «desci», a passividade de «me foram restituídos» e a imagem cultural de reclinar-se à mesa.
