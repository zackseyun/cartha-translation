  text: E minha mulher, Ana, trabalhava em tarefas próprias das mulheres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em trabalhos de mulheres”. A expressão grega pode referir-se de modo geral ao trabalho costumeiramente realizado por mulheres, e não a um local físico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή μου
  choice: minha mulher
  rationale: Com o possessivo, γυνή significa naturalmente “esposa”. “Minha mulher” é uma forma idiomática e amplamente compreensível em português.
- source_word: Ἄννα
  choice: Ana
  rationale: Emprega-se a forma tradicional portuguesa do nome bíblico.
- source_word: ἠριθεύετο
  choice: trabalhava
  rationale: O verbo indica exercer trabalho, possivelmente remunerado. “Trabalhava” preserva o sentido sem afirmar pagamento nem especificar uma atividade que o grego não identifica.
- source_word: ἐν τοῖς γυναικείοις
  choice: em tarefas próprias das mulheres
  rationale: A expressão provavelmente designa o âmbito do trabalho então costumeiramente realizado por mulheres, sem especificar um ofício ou necessariamente um local físico.
