base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/002.yaml
  text: And I saw much food[a], and I said to my son, “Go and bring whichever one of our brothers you may find in need, who remembers the Lord; and behold[c][b], I am waiting for you.”
translation:
  language: pt
  text: 'E vi muita comida[a] e disse a meu filho: “Vá e traga qualquer um de nossos irmãos[b] que você encontrar necessitado e que se lembre do Senhor; e veja[c], estou à sua espera.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos pratos” ou “muita carne”; o termo grego se refere a alimentos preparados e servidos numa refeição.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “nossos irmãos” significa outros membros do povo de Tobit, não somente irmãos biológicos.
    reason: cultural_note
  - marker: c
    text: A frase final é sintaticamente difícil no grego transmitido; pelo contexto, o sentido é que Tobit permanece à espera de seu filho voltar.
    reason: textual_variant
lexical_decisions:
- source_word: ἐθεασάμην
  choice: vi
  rationale: O aoristo de θεάομαι funciona aqui como verbo simples de percepção; “vi” é natural e preserva a sequência narrativa.
- source_word: ὄψα πολλά
  choice: muita comida
  rationale: ὄψα designa alimentos preparados ou pratos servidos numa refeição. “Muita comida” comunica o sentido sem especificar indevidamente o cardápio.
- source_word: Βάδισον
  choice: Vá
  rationale: O imperativo é uma ordem para sair; “Vá” é a forma idiomática e direta em português.
- source_word: ἄγαγε
  choice: traga
  rationale: No contexto, o filho deve trazer consigo uma pessoa necessitada para a refeição.
- source_word: ὃν ἐὰν εὕρῃς
  choice: qualquer um ... que você encontrar
  rationale: A construção relativa com ἐάν expressa referência indefinida; esta formulação conserva o singular e a abertura da escolha.
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: de nossos irmãos
  rationale: Mantém a metáfora familiar masculina do grego, enquanto uma nota esclarece que se trata dos membros do povo de Tobit, não apenas de irmãos biológicos.
- source_word: ἐνδεὴς
  choice: necessitado
  rationale: Expressa falta ou carência sem restringir o sentido exclusivamente à pobreza financeira.
- source_word: ὃς μέμνηται τοῦ κυρίου
  choice: e que se lembre do Senhor
  rationale: “Lembrar-se do Senhor” preserva de modo transparente a expressão piedosa do grego. A conjunção “e” torna clara, em português, a coordenação das duas características do convidado.
- source_word: ἰδοὺ μένω σε
  choice: Eis que estou esperando por você
  rationale: 'Mantém ἰδού e verte a construção grega difícil segundo o sentido contextual mais provável: Tobit permanece no lugar à espera do retorno do filho.'
theological_decisions:
- issue: Tradução de κύριος na fórmula de piedade narrativa
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz κύριος, e não o nome divino hebraico; “Senhor” preserva esse dado textual sem importar uma retroversão.
- issue: Alcance de ἀδελφῶν ἡμῶν
  choice: nossos irmãos
  alternative: nosso povo / nossos compatriotas israelitas
  rationale: A expressão provavelmente abrange membros da comunidade de Israel, mas o texto emprega um termo masculino de parentesco; a tradução o preserva e esclarece seu alcance em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala usa “você” para naturalidade contemporânea; “Eis que” conserva a força discursiva de ἰδού sem tornar todo o versículo arcaizante. Os marcadores aparecem junto às expressões a que se referem.
