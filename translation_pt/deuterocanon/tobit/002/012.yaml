review_pass:
  verdict: revise
  source_fidelity: O imperfeito ἀπέστελλεν é bem refletido por “enviava”, mas ἀπέδωκαν é aoristo e deve ser vertido por um passado pontual (“pagaram”), não pelo imperfeito “pagavam”. O objeto de “enviava” fica implícito em grego; em português, “o” sem antecedente no próprio versículo é pouco claro. “O trabalho” explicita de modo seguro o referente fornecido pelo contexto imediato.
  naturalness: “Aos donos” é pouco idiomático para pessoas que contratavam e remuneravam a trabalhadora; “aos seus patrões” é natural em português moderno e adequado ao contexto laboral. A redação revista também elimina o pronome enclítico semanticamente pouco ancorado.
  terminology: “Salário” traduz adequadamente μισθός, e “cabrito” traduz com precisão ἔριφον. “Patrões” é a melhor opção contextual para κυρίοις; a nota preserva “senhores” como alternativa lexical.
  issues:
  - severity: medium
    issue: “pagavam” não reflete o aoristo ἀπέδωκαν.
    rationale: O texto grego passa do imperfeito de ἀπέστελλεν ao aoristo de ἀπέδωκαν. No contexto narrativo, o pagamento, incluindo o cabrito adicional, é apresentado como evento pontual; “pagaram” conserva essa distinção.
  - severity: low
    issue: “o enviava” tem antecedente insuficientemente claro no versículo.
    rationale: O grego deixa o objeto implícito, recuperável do contexto anterior. Em português, o pronome masculino isolado pode dificultar a leitura; “o trabalho” torna a referência clara sem alterar o sentido.
  - severity: medium
    issue: “donos” é inadequado como designação principal dos κυρίοις neste contexto.
    rationale: Embora κύριοι possa ter sentido de donos ou senhores, aqui são as pessoas para quem Ana trabalhava e que lhe pagavam. “Patrões” comunica essa relação laboral com maior naturalidade e precisão contextual.
  revised_text: Ela enviava o trabalho aos seus patrões[a], e eles lhe pagaram o salário e, além disso, deram-lhe um cabrito.
  revised_footnotes:
  - marker: a
    text: Ou “senhores”. O grego traz κυρίοις, termo que aqui se refere às pessoas para quem ela trabalhava.
    reason: lexical_alternative
  revision_rationale: A revisão preserva o aspecto habitual de “enviava”, restitui o caráter pontual de “pagaram” para o aoristo grego e torna explícito, de maneira contextual e não interpretativa, o trabalho que ela enviava. Também substitui “donos” por “patrões”, solução mais idiomática e contextualmente exata, mantendo a alternativa lexical em nota.
