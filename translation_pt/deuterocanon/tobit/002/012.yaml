  text: And she would send it to the owners[a], and they also paid her wages, adding a young goat.
translation:
  language: pt
  text: Ela enviava o trabalho aos seus patrões[a], e eles lhe pagaram o salário e, além disso, deram-lhe um cabrito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senhores”. O grego traz κυρίοις, termo que aqui se refere às pessoas para quem ela trabalhava.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστελλεν
  choice: enviava
  rationale: O imperfeito indica ação habitual ou repetida no contexto narrativo; “enviava” preserva naturalmente esse aspecto em português.
- source_word: τοῖς κυρίοις
  choice: aos donos
  rationale: Neste contexto de trabalho, o plural designa as pessoas a quem pertencia o trabalho ou para quem ele era feito. “Donos” evita uma conotação teológica e é mais natural que “senhores”, embora “patrões” também seja possível.
- source_word: ἀπέδωκαν
  choice: pagavam
  rationale: Com “o salário” como objeto, o verbo tem o sentido contextual de pagar ou entregar a remuneração devida. O imperfeito em português acompanha o caráter habitual da cena.
- source_word: τὸν μισθόν
  choice: o salário
  rationale: μισθός designa a remuneração pelo trabalho; “salário” é claro e corrente em português.
- source_word: προσδόντες
  choice: ainda davam
  rationale: O particípio expressa uma dádiva adicional ao salário. “Ainda davam” comunica de modo natural esse valor suplementar.
- source_word: ἔριφον
  choice: um cabrito
  rationale: ἔριφος é um bode novo; “cabrito” é a designação portuguesa comum e inequívoca.
theological_decisions:
- issue: Sentido de κυρίοις em um contexto não teológico de trabalho
  choice: donos
  alternative: senhores; patrões
  rationale: O termo se refere aqui a seres humanos ligados ao trabalho realizado, não ao título divino “Senhor”. “Donos” preserva o sentido de posse ou autoridade sem introduzir ressonância teológica; a nota registra alternativas contextuais.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os imperfeitos “enviava” e “pagavam” apresentam a ação como costumeira. O pronome “o” conserva o objeto implícito no grego e remete ao trabalho mencionado no contexto anterior.
