revisions:
- from: Ela o enviava aos donos[a], e eles, por sua vez, lhe pagavam o salário e ainda davam um cabrito.
  to: Ela enviava o trabalho aos seus patrões[a], e eles lhe pagaram o salário e, além disso, deram-lhe um cabrito.
  rationale: A revisão preserva o aspecto habitual de “enviava”, restitui o caráter pontual de “pagaram” para o aoristo grego e torna explícito, de maneira contextual e não interpretativa, o trabalho que ela enviava. Também substitui “donos” por “patrões”, solução mais idiomática e contextualmente exata, mantendo a alternativa lexical em nota.
