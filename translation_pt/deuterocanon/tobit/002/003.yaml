base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/003.yaml
  text: And he came and said[a], “Father, one of our own people has been strangled and thrown down in the marketplace.”
translation:
  language: pt
  text: 'Ele chegou e disse: “Pai, um dos nossos[a] foi estrangulado e jogado na praça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um dos nossos parentes”. O termo grego pode indicar família, grupo de parentesco ou o próprio povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἶπεν
  choice: Ele chegou e disse
  rationale: O particípio aoristo seguido do verbo principal é expresso por coordenação, construção natural em narrativa portuguesa que preserva a sequência das ações.
- source_word: Πάτερ
  choice: Pai
  rationale: Mantém de modo direto o vocativo grego, sem acrescentar o possessivo “meu”.
- source_word: εἷς ἐκ τοῦ γένους ἡμῶν
  choice: um dos nossos
  rationale: Expressa pertencimento ao mesmo grupo familiar, étnico ou comunitário sem restringir o sentido à família imediata.
- source_word: ἐστραγγαλωμένος
  choice: foi estrangulado
  rationale: Traduz o particípio perfeito passivo e evita especificar enforcamento por suspensão, método que o grego não exige.
- source_word: ἔρριπται
  choice: jogado
  rationale: Comunica a disposição violenta do corpo; em combinação com o estado resultante implícito na cena, o português não precisa reproduzir separadamente o aspecto perfeito.
- source_word: ἐν τῇ ἀγορᾷ
  choice: na praça
  rationale: ἀγορά designa a praça pública onde também se realizava o mercado. “Praça” é claro e natural em português, sem sugerir apenas um estabelecimento comercial moderno.
theological_decisions:
- issue: Alcance de γένος ἡμῶν
  choice: 'pertencimento comunitário amplo: “um dos nossos”'
  alternative: 'parentesco familiar mais restrito: “um dos nossos parentes”'
  rationale: O contexto aponta para alguém pertencente ao povo ou à comunidade de Tobit, mas o termo também pode envolver parentesco. A tradução mantém essa amplitude, e a nota registra a alternativa sem impor uma relação familiar imediata.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa direta. “Um dos nossos” preserva a ambiguidade comunitária e familiar; “praça” representa o espaço público da ἀγορά.
