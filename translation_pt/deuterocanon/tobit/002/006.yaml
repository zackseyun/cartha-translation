base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/006.yaml
  text: And I remembered the prophecy of Amos[a], as he said, “Your festivals will be turned into mourning, and all your rejoicing into lamentation.” And I wept.
translation:
  language: pt
  text: 'E lembrei-me da profecia de Amós[a], conforme ele disse: “As festas de vocês serão transformadas em luto, e toda a alegria de vocês, em lamentação”. E chorei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase citada faz eco a Amós 8:10 na tradição da Septuaginta.
    reason: cross_reference
lexical_decisions:
- source_word: ἐμνήσθην
  choice: lembrei-me
  rationale: O aoristo de μιμνῄσκομαι tem sentido ativo neste contexto. “Lembrei-me” é direto, natural e mantém a narração em primeira pessoa.
- source_word: προφητείας
  choice: profecia
  rationale: O singular designa a palavra profética de Amós que será citada; “profecia” é claro e preserva o registro bíblico.
- source_word: Στραφήσονται
  choice: serão transformadas
  rationale: Mantém a forma passiva do futuro grego e comunica a inversão sofrida pelas festas sem explicitar quem a produz.
- source_word: ἑορταὶ
  choice: festas
  rationale: Designa celebrações coletivas, inclusive religiosas. “Festas” é corrente e mais amplo do que “banquetes”.
- source_word: πένθος
  choice: luto
  rationale: Expressa lamento público e solene, adequado ao contexto profético, e não apenas tristeza interior.
- source_word: εὐφροσύναι
  choice: toda a alegria
  rationale: Embora o grego use o plural, o singular coletivo é idiomático em português e abrange as ocasiões e expressões de júbilo.
- source_word: θρῆνον
  choice: lamentação
  rationale: Refere-se a lamento expresso ou formal; “lamentação” conserva o tom solene da citação.
- source_word: ἔκλαυσα
  choice: chorei
  rationale: Tradução simples e direta do aoristo, natural em português e apropriada à solenidade do contexto.
theological_decisions:
- issue: Forma da citação profética de Amós
  choice: 'Manter a profecia como citação direta dirigida à segunda pessoa do plural: “As festas de vocês serão transformadas em luto, e toda a alegria de vocês, em lamentação”.'
  alternative: Empregar uma formulação menos direta ou mais arcaizante, como “Vossas festas se converterão em pranto, e todos os vossos júbilos, em lamentação”.
  rationale: O grego introduz explicitamente uma profecia recordada e em seguida a cita. A citação direta preserva a ligação intertextual e a forma de advertência dirigida a uma coletividade, sem acrescentar uma identificação interpretativa dos destinatários.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Vocês” torna explícito o plural de ὑμῶν sem recorrer ao arcaizante “vós”. A construção passiva preserva a formulação grega e evita explicitar um agente que o texto não nomeia.
