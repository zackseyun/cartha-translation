base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/002.yaml
  text: You are righteous[a], Lord, and all your works and all your ways are mercy and truth, and you judge true and righteous judgment forever.
translation:
  language: pt
  text: Tu és justo, Senhor, e todas as tuas obras e todos os teus caminhos são misericórdia e verdade,[a] e pronuncias um juízo verdadeiro e justo para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atos de misericórdia e fidelidade”. O grego ἐλεημοσύναι pode indicar manifestações ou atos de misericórdia, e ἀλήθεια também pode ter a nuance de “fidelidade”.'
    reason: Alternativas lexicais que preservam o plural de ἐλεημοσύναι e a possível nuance de ἀλήθεια.
lexical_decisions:
- source_word: Δίκαιος
  choice: justo
  rationale: Adjetivo predicativo que descreve o caráter do Senhor; “justo” preserva de modo natural em português tanto a dimensão moral quanto a judicial.
- source_word: Κύριε
  choice: Senhor
  rationale: Forma de tratamento direto a Deus e equivalente bíblico corrente de κύριος.
- source_word: ἔργα
  choice: obras
  rationale: Mantém o sentido amplo de tudo o que Deus faz e a ressonância bíblica do termo.
- source_word: ὁδοί
  choice: caminhos
  rationale: Preserva a metáfora bíblica para os modos de agir e governar de Deus.
- source_word: ἐλεημοσύναι
  choice: misericórdia
  rationale: Neste contexto, o termo não designa especificamente esmolas humanas, mas a misericórdia manifesta nos caminhos de Deus. O singular coletivo produz português natural, enquanto a força plural é registrada na nota.
- source_word: ἀλήθεια
  choice: verdade
  rationale: É o equivalente mais direto do grego e mantém a conhecida associação entre misericórdia e verdade; a possível nuance de fidelidade é preservada em nota.
- source_word: κρίσιν ἀληθινὴν καὶ δικαίαν
  choice: juízo verdadeiro e justo
  rationale: Conserva os dois adjetivos aplicados a κρίσις e o peso formal da declaração.
- source_word: κρίνεις
  choice: julgas
  rationale: Tradução direta e transparente do verbo, adequada à oração dirigida a Deus.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Expressão portuguesa idiomática para a duração permanente indicada pelo grego.
theological_decisions:
- issue: Se ἀλήθεια deve ser traduzida como “verdade” ou “fidelidade” na associação com misericórdia
  choice: verdade
  alternative: fidelidade
  rationale: “Verdade” representa diretamente a forma lexical grega, enquanto “fidelidade” expressa uma nuance possível de confiabilidade divina; a alternativa é mantida em nota para não eliminar a tensão semântica.
- issue: Se ἐλεημοσύναι deve ser entendido como esmolas ou como manifestações de misericórdia
  choice: misericórdia
  alternative: atos de misericórdia / misericórdias
  rationale: Como o termo caracteriza os caminhos de Deus, o sentido estreito de esmola seria inadequado. A formulação principal segue de perto a predicação grega, e a pluralidade semântica fica documentada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo e a solenidade da oração, sem restringir “misericórdia” ao sentido de esmola nem resolver silenciosamente a nuance entre “verdade” e “fidelidade”.
