    issue: Construção «julgas com juízo»
    rationale: Embora corresponda formalmente ao cognato grego κρίνεις κρίσιν, a expressão é pouco natural em português moderno. «Pronuncias um juízo» transmite o ato de julgar e mantém explicitamente o substantivo κρίσις qualificado por «verdadeiro e justo».
  revised_text: Tu és justo, Senhor, e todas as tuas obras e todos os teus caminhos são misericórdia e verdade,[a] e pronuncias um juízo verdadeiro e justo para sempre.
