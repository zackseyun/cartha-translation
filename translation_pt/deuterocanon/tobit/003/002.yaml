review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz com precisão a invocação, os paralelismos («todas as tuas obras» / «todos os teus caminhos»), «misericórdia e verdade» e a duração expressa por εἰς τὸν αἰῶνα. «Justo», «Senhor», «obras», «caminhos», «misericórdia» e «verdade» são escolhas adequadas. Contudo, «julgas com juízo» é uma reprodução demasiado literal da construção de cognato grega κρίνεις κρίσιν e não é a formulação mais natural em português moderno; «pronuncias um juízo» preserva o sentido judicial e os dois qualificativos.
  naturalness: O registro é digno, bíblico e bem compreensível. A única dificuldade relevante é «julgas com juízo», que soa redundante e pouco idiomático em português atual. A revisão proposta mantém a solenidade sem esse calque.
  terminology: A terminologia está consistente. «Misericórdia e verdade» preserva a formulação grega sem restringir ἐλεημοσύναι a esmolas; a nota registra de forma útil tanto a força plural/ativa possível quanto a nuance de «fidelidade» para ἀλήθεια. «Juízo verdadeiro e justo» conserva os dois adjetivos de κρίσιν.
  issues:
