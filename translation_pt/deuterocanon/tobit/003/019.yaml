  to: Em todo o tempo, bendiga o Senhor Deus e peça a ele que os seus caminhos se tornem retos[a] e que todas as suas veredas e planos prosperem. Pois nenhum povo possui conselho[b]; é o próprio Senhor quem dá todas as coisas boas e humilha a quem ele quer, como quer. E agora, filho, lembre-se dos meus mandamentos e não permita que sejam apagados do seu coração.
