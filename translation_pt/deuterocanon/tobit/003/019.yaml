base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, as he wills. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: pt
  text: Em todo o tempo, bendiga o Senhor Deus e peça a ele que os seus caminhos se tornem retos[a] e que todas as suas veredas e planos prosperem. Pois nenhum povo possui conselho[b]; é o próprio Senhor quem dá todas as coisas boas e humilha a quem ele quer, como quer. E agora, filho, lembre-se dos meus mandamentos e não permita que sejam apagados do seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sejam endireitados». O grego pode indicar que os caminhos se tornam retos ou, no contexto do pedido a Deus, que são endireitados.'
    reason: lexical_alternative
  - marker: b
    text: A frase grega é concisa e pode ser entendida como uma afirmação de que nenhum povo possui conselho seguro por si só, em contraste com o Senhor, que concede tudo o que é bom.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: em todo o tempo
  rationale: Preserva a força distributiva da expressão grega em uma formulação bíblica natural e compreensível em português.
- source_word: εὐλόγει
  choice: bendiga
  rationale: Traduz diretamente o imperativo e conserva o idioma bíblico de bendizer a Deus; «louve» seria possível, mas menos formalmente correspondente.
- source_word: Κύριον τὸν Θεόν
  choice: o Senhor Deus
  rationale: Reproduz naturalmente a sequência dos títulos divinos e mantém «Senhor» como equivalente reverente de κύριος.
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: peça a ele
  rationale: Expressa de modo idiomático em português o pedido dirigido a Deus; a ideia de receber dele permanece clara no contexto.
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: que os seus caminhos se tornem retos
  rationale: Mantém o valor de mudança ou resultado de γένωνται sem impor uma voz passiva que o grego não exige.
- source_word: ὁδοί / τρίβοι
  choice: caminhos / veredas
  rationale: Conserva o paralelismo e a distinção entre os dois termos gregos, bem como sua amplitude metafórica.
- source_word: βουλαὶ
  choice: planos
  rationale: Na primeira ocorrência, designa intenções ou projetos pessoais; «planos» é claro e corrente.
- source_word: εὐοδωθῶσιν
  choice: prosperem
  rationale: Comunica avanço bem-sucedido ou resultado favorável e se ajusta ao contexto de oração.
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: nenhum povo possui conselho em si mesmo
  rationale: A frase grega é abrupta. «Povo» é natural para ἔθνος neste dito geral, e «em si mesmo» explicita de maneira cautelosa o contraste com o Senhor, sem transformar a frase em uma afirmação absoluta de irracionalidade.
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: dá todas as coisas boas
  rationale: Preserva a agência divina e o caráter abrangente dos bens concedidos.
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: humilha quem ele quer
  rationale: O relativo grego é formalmente neutro, mas pode ter referência indefinida; o contexto favorece pessoas. «Humilha» mantém a força de ταπεινοῖ sem suavizar a declaração.
- source_word: παιδίον
  choice: meu filho
  rationale: No contexto de instrução paterna, esta é a forma de tratamento mais natural em português, embora o grego diga literalmente «criança» ou «filho».
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: não permita que sejam apagados do seu coração
  rationale: Conserva a imagem de apagar ou eliminar da memória interior, com sintaxe natural em português.
theological_decisions:
- issue: Tradução de κύριος como título divino
  choice: Senhor
  alternative: Soberano
  rationale: «Senhor» é o equivalente bíblico corrente e reverente, adequado ao título «Senhor Deus», sem acrescentar uma interpretação denominacional.
- issue: Agência na retidão dos caminhos
  choice: se tornem retos
  alternative: sejam endireitados
  rationale: O grego γένωνται permite a ideia de tornar-se, enquanto o contexto do pedido a Deus pode sugerir agência divina. A tradução mantém a forma menos determinada e registra a alternativa em nota.
- issue: Afirmação sobre o conselho dos povos
  choice: nenhum povo possui conselho em si mesmo
  alternative: nenhum povo possui conselho
  rationale: A expressão grega é concisa e difícil. A formulação escolhida preserva o contraste entre a insuficiência humana e o Senhor como doador do bem, sem atribuir ao texto uma teoria mais específica.
- issue: Soberania divina em ὃ ἐὰν θέλῃ ταπεινοῖ, καθὼς βούλεται
  choice: humilha quem ele quer, conforme a sua vontade
  alternative: humilha aquilo que quer, como quer
  rationale: A redação mantém a declaração forte acerca da liberdade divina, sem atenuá-la nem convertê-la em uma formulação doutrinária mais sistemática.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. «Veredas» preserva o paralelismo poético sem tornar o conjunto excessivamente arcaico; «meu filho» torna explícita a relação indicada pelo contexto e pelo vocativo παιδίον.
