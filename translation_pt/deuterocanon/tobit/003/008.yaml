  yaml_path: translation/deuterocanon/tobit/003/008.yaml
  text: because she had been given to seven husbands[a], and Asmodeus, the evil demon, killed them before they could be with her as with wives. And they said to her, “Do you not understand that you are choking your husbands? Already you have had seven, and you have not benefited from even one of them.”
translation:
  language: pt
  text: 'porque ela tinha sido dada em casamento a sete maridos, e Asmodeu, o demônio maligno, os matou antes que pudessem unir-se a ela como se faz com esposas[a]. E disseram-lhe: “Você não percebe que está sufocando seus maridos? Já teve sete e não tirou proveito de nenhum deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes que tivessem relações com ela”. O grego se refere eufemisticamente à união conjugal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδομένη ἀνδράσιν ἑπτά
  choice: tinha sido dada em casamento a sete maridos
  rationale: O perfeito passivo preserva a ideia de que Sara foi dada a eles, enquanto “em casamento” explicita naturalmente em português o sentido contextual de ἀνδράσιν como maridos.
- source_word: Ἀσμοδαῖος
  choice: Asmodeu
  rationale: Forma tradicional e amplamente reconhecível do nome próprio em português.
- source_word: τὸ πονηρὸν δαιμόνιον
  choice: o demônio maligno
  rationale: Traduz os dois elementos do grego diretamente, sem reduzir δαιμόνιον ao termo mais amplo “espírito”.
- source_word: πρὶν ἢ γενέσθαι αὐτοὺς μετʼ αὐτῆς ὡς ἐν γυναιξίν
  choice: antes que pudessem estar com ela como se está com uma esposa
  rationale: Mantém o eufemismo conjugal do grego e comunica seu sentido em português corrente; a nota registra uma formulação mais explícita.
- source_word: ἀποπνίγουσά σου τοὺς ἄνδρας
  choice: está sufocando seus maridos
  rationale: “Sufocando” reproduz a acusação vívida e cruel do particípio presente; “seus maridos” expressa naturalmente a relação possessiva indicada no grego.
- source_word: ἤδη ἑπτὰ ἔσχες
  choice: Já teve sete
  rationale: Preserva a concisão do original, no qual “maridos” fica subentendido pelo contexto imediato.
- source_word: ἑνὸς αὐτῶν οὐκ ὠνάσθης
  choice: não tirou proveito de nenhum deles
  rationale: Expressa o sentido de obter benefício ou vantagem e conserva o tom ofensivo da fala sem explicar além do texto.
theological_decisions:
- issue: Eufemismo conjugal em πρὶν ἢ γενέσθαι αὐτοὺς μετʼ αὐτῆς ὡς ἐν γυναιξίν
  choice: Manter no texto uma referência modesta, mas inteligível, à união conjugal.
  alternative: antes que tivessem relações com ela
  rationale: O grego evita um verbo sexual explícito. A tradução conserva essa reserva, e a nota oferece a alternativa direta sem resolver excessivamente a expressão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A fala das servas permanece direta e cruel, sem arcaísmos nem suavização da acusação.
