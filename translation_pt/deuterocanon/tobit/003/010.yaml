  text: When she heard these things[a], she was deeply grieved, so that she wanted to hang herself. But she said, “I am my father’s only child. If I do this, it will be a disgrace to him, and I will bring his old age down with sorrow to Hades.”
translation:
  language: pt
  text: 'Ao ouvir essas coisas, ela ficou profundamente aflita, a ponto de querer se enforcar. Mas disse: “Sou filha única de meu pai. Se eu fizer isso, será uma desonra para ele, e farei sua velhice descer ao Hades[a] com tristeza.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao reino dos mortos” ou “à sepultura”. O grego diz “ao Hades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ἀκούσασα
  choice: Ao ouvir essas coisas
  rationale: Expressa naturalmente o particípio temporal e preserva o demonstrativo sem explicitar além do texto.
- source_word: ἐλυπήθη σφόδρα
  choice: ela ficou profundamente aflita
  rationale: Transmite a intensa dor emocional indicada por λυπέω e reforçada por σφόδρα, em português atual e digno.
- source_word: ὥστε ἀπάγξασθαι
  choice: a ponto de querer se enforcar
  rationale: Comunica o resultado extremo e a intenção contemplada, sem afirmar que ela chegou a executar ou decidir irrevogavelmente o ato.
- source_word: Μία μέν εἰμι τῷ πατρί μου
  choice: Sou filha única de meu pai
  rationale: Torna claro o sentido idiomático de que ela é a única filha ou descendente do pai; o feminino é inerente à fala de Sara.
- source_word: ὄνειδος αὐτῷ ἔσται
  choice: será uma desonra para ele
  rationale: Desonra preserva o aspecto público e social de ὄνειδος sem soar antiquado.
- source_word: τὸ γῆρας αὐτοῦ κατάξω
  choice: farei com que sua velhice desça
  rationale: Preserva a imagem grega de fazer a velhice do pai descer, mantendo sua ligação com o destino mencionado em seguida.
- source_word: μετʼ ὀδύνης
  choice: em meio à dor
  rationale: ὀδύνη pode indicar dor ou pesar; a formulação conserva deliberadamente essa amplitude no contexto emocional e funerário.
- source_word: εἰς ᾅδου
  choice: ao Hades
  rationale: Reproduz o termo grego explícito e evita substituí-lo por uma concepção doutrinária mais específica, como inferno.
theological_decisions:
- issue: Tradução de ᾅδης no contexto deuterocanônico grego
  choice: Hades
  alternative: reino dos mortos; sepultura
  rationale: O texto-fonte nomeia expressamente o Hades. Manter o termo conserva a imagem e sua possível tensão teológica, sem identificá-lo indevidamente com o inferno; alternativas interpretativas são registradas em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém dignidade narrativa, explicita apenas o necessário para a fluência e conserva a imagem da velhice que desce ao Hades.
