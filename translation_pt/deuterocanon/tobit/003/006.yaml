base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/006.yaml
  text: And now deal with me according to what is pleasing to you[a]. Command that my spirit be taken up, so that I may be released and become dust. For it is better for me to die than to live, because I have heard false reproaches, and there is great grief within me. Command that I be released now from this distress into the everlasting place[b], and do not turn your face away from me.
translation:
  language: pt
  text: E agora, faze comigo segundo o que te agrada. Ordena que o meu espírito seja levado, para que eu seja liberto e me torne terra[a], pois é melhor para mim morrer do que viver, porque ouvi insultos falsos, e há grande tristeza dentro de mim. Ordena que eu seja agora libertado desta aflição, para o lugar eterno[b]. Não desvies de mim o teu rosto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me torne pó”. O grego diz literalmente “me torne terra”, uma imagem da morte e do retorno do ser humano à terra.
    reason: lexical_alternative
  - marker: b
    text: “O lugar eterno” é uma expressão geral para o lugar dos mortos; o grego não emprega aqui um termo doutrinário mais específico.
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸ ἀρεστόν σου
  choice: segundo o que te agrada
  rationale: Expressa conformidade com aquilo que é agradável a Deus, preservando de modo natural o sentido da vontade divina sem o tornar mais específico.
- source_word: ἐπίταξον
  choice: Ordena
  rationale: Mantém a força direta e solene do imperativo dirigido a Deus, que pede uma determinação revestida de autoridade.
- source_word: ἀναλαβεῖν τὸ πνεῦμά μου
  choice: que o meu espírito seja levado
  rationale: Preserva πνεῦμα como “espírito” e a construção passiva, sem substituir o termo por “vida” nem introduzir a fórmula interpretativa “recebe o meu espírito”.
- source_word: ἀπολυθῶ / ἀπολυθῆναι
  choice: eu seja liberto
  rationale: Conserva a metáfora de ser solto ou libertado, usada aqui como circunlóquio reverente para a morte, e mantém a repetição do verbo grego.
- source_word: γένωμαι γῆ
  choice: me torne terra
  rationale: Traduz γῆ diretamente como “terra” e preserva a imagem concreta da mortalidade, evitando ocultá-la sob uma paráfrase.
- source_word: λυσιτελεῖ μοι
  choice: é melhor para mim
  rationale: É a forma portuguesa corrente de exprimir que algo é mais vantajoso ou preferível no contraste explícito entre morrer e viver.
- source_word: ὀνειδισμοὺς ψευδεῖς
  choice: falsas acusações
  rationale: Comunica reprovações ou insultos cujo conteúdo é falso. “Acusações” soa natural no contexto da desonra sofrida, sem eliminar a ideia de censura.
- source_word: λύπη ἐστὶν πολλὴ ἐν ἐμοί
  choice: há grande tristeza dentro de mim
  rationale: Mantém tanto a estrutura existencial quanto a ênfase na tristeza interior.
- source_word: τῆς ἀνάγκης
  choice: desta aflição
  rationale: No contexto do lamento, ἀνάγκη designa sofrimento opressivo ou angústia; “aflição” transmite esse valor sem sugerir mera necessidade lógica.
- source_word: εἰς τὸν αἰώνιον τόπον
  choice: para o lugar eterno
  rationale: Reproduz a expressão geral do grego sem identificá-la especificamente com céu, Hades, sepultura ou outra concepção posterior.
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπʼ ἐμοῦ
  choice: Não desvies de mim o teu rosto
  rationale: Preserva a imagem bíblica do rosto divino e o pedido para que Deus não retire sua atenção ou favor.
theological_decisions:
- issue: Linguagem antropológica no pedido de morte
  choice: que o meu espírito seja levado
  alternative: que a minha vida seja tirada; recebe o meu espírito
  rationale: O grego emprega explicitamente πνεῦμα. A tradução conserva “espírito”, mas evita definir como ou para onde ele é levado, preservando a abertura teológica do texto.
- issue: Destino após a morte
  choice: o lugar eterno
  alternative: o lar eterno; a sepultura; o céu
  rationale: A fonte nomeia apenas “o lugar eterno”. A tradução mantém essa expressão ampla e não introduz uma identificação doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A sintaxe foi moderadamente ajustada para clareza, enquanto as imagens de “espírito”, “terra”, “lugar eterno” e “rosto” foram preservadas.
