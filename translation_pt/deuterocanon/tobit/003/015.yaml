  source_fidelity: A tradução preserva bem o sentido geral, a concisão sobre os sete e a ambiguidade da cláusula familiar difícil. Contudo, “outro filho” introduz uma restrição ausente de παιδίον e cria uma tensão desnecessária com “filha única”; “outro descendente” representa melhor o valor amplo de “filho/descendente” no contexto. A formulação da oração final pode ser ligeiramente ajustada para português natural sem resolver a sintaxe disputada.
  naturalness: O registro é geralmente digno e claro. “Dar-me a morte” é menos idiomático do que “matar-me” neste português moderno. A repetição “nem filho que ele tenha” soa pesada; “nem tem ele um filho” conserva a construção acumulativa e melhora a leitura.
  terminology: “Desonrei o meu nome” é uma boa equivalência contextual para ἐμόλυνα τὸ ὄνομά μου, com a nota registrando a imagem de contaminação. “Terra do meu cativeiro”, “filha única”, “irmão próximo”, “reservar-me”, “misericórdia” e “insultos” são defensáveis. A nota sobre “irmão próximo” preserva adequadamente a possibilidade de um parente masculino próximo.
  issues:
