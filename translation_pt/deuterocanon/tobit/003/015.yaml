  to: E não desonrei o meu nome[a], nem o nome de meu pai, na terra do meu cativeiro. Sou filha única de meu pai, e ele não tem nenhum descendente que o herde, nem irmão próximo, nem tem ele um filho, para quem eu possa reservar-me como esposa.[b] Já perdi sete[c]; por que eu deveria continuar vivendo? Mas, se não te parece bem matar-me, ordena que olhes para mim e tenhas misericórdia de mim, e que eu não ouça mais insultos.
  rationale: A revisão elimina a adição interpretativa de “outro” e usa “descendente” para refletir o alcance de παιδίον sem criar conflito com “filha única”. Também torna mais idiomáticas as expressões “matar-me” e “nem tem ele um filho”, preservando a ambiguidade sintática e familiar do grego. As âncoras e as notas permanecem coerentes com o texto e esclarecem somente o necessário.
