base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/015.yaml
  text: And I have not defiled my name[a], nor the name of my father, in the land of my captivity. I am my father’s only child, and he has no child who will inherit him, nor a near brother, nor does he have a son so that I might keep myself for him as a wife. Already seven have perished from me; why should I live? But if it does not seem good to you to put me to death, command that you look upon me and have mercy on me[c][b], and that I no longer hear reproach.
translation:
  language: pt
  text: E não desonrei o meu nome[a], nem o nome de meu pai, na terra do meu cativeiro. Sou filha única de meu pai, e ele não tem nenhum descendente que o herde, nem irmão próximo, nem tem ele um filho, para quem eu possa reservar-me como esposa.[b] Já perdi sete[c]; por que eu deveria continuar vivendo? Mas, se não te parece bem matar-me, ordena que olhes para mim e tenhas misericórdia de mim, e que eu não ouça mais insultos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, o “nome” inclui a honra e a reputação da pessoa e de sua família; o grego usa literalmente o verbo “contaminar” ou “profanar”.
    reason: lexical_alternative
  - marker: b
    text: Este trecho é sintática e textualmente difícil no grego. “Irmão próximo” também pode ter o sentido mais amplo de “parente próximo”; não é possível definir com plena certeza a relação familiar exata descrita.
    reason: textual_variant
  - marker: c
    text: Isto é, sete maridos, conforme o contexto da narrativa; aqui, porém, o grego diz apenas “sete”.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐμόλυνα
  choice: desonrei
  rationale: Embora o verbo possa significar literalmente “contaminar” ou “profanar”, com ὄνομα a expressão diz respeito à desonra moral lançada sobre o nome pessoal e familiar. “Desonrei” comunica essa força com naturalidade em português.
- source_word: ὄνομα
  choice: nome
  rationale: Mantém a repetição concreta do grego e preserva a dimensão cultural de honra e reputação sem substituí-la por uma interpretação abstrata.
- source_word: γῇ τῆς αἰχμαλωσίας μου
  choice: terra do meu cativeiro
  rationale: Reproduz de perto a formulação grega e conserva o cenário de deslocamento e sujeição da personagem.
- source_word: μονογενής
  choice: filha única
  rationale: A palavra indica descendência única. Como quem fala é uma mulher, “filha única” é a forma portuguesa mais clara e natural.
- source_word: παιδίον, ὃ κληρονομήσει αὐτόν
  choice: outro filho que venha a ser seu herdeiro
  rationale: “Herdá-lo” seria pouco natural em português. A formulação expressa a função sucessória sem sugerir apenas a herança de bens; “outro” é exigido pelo contexto de ela própria ser a filha única.
- source_word: ἀδελφὸς ἐγγύς
  choice: irmão próximo
  rationale: Mantém a forma incomum do grego e não resolve silenciosamente se ἀδελφός designa irmão em sentido estrito ou um parente masculino próximo; a nota registra a alternativa.
- source_word: συντηρήσω ἐμαυτὴν αὐτῷ γυναῖκα
  choice: eu possa reservar-me como esposa para ele
  rationale: “Reservar-me” comunica a ideia de conservar-se ou manter-se destinada a alguém, enquanto a nota reconhece a dificuldade sintática e referencial do trecho.
- source_word: ἀπώλοντό μοι ἑπτά
  choice: já perdi sete
  rationale: Expressa de modo natural o dativo de perda pessoal e conserva a concisão do grego, que não repete explicitamente “maridos” neste versículo.
- source_word: δοκεῖ σοι
  choice: não te parece bem
  rationale: Preserva a formulação reverente sobre aquilo que parece apropriado a Deus, sem convertê-la diretamente em uma declaração explícita sobre a vontade divina.
- source_word: ἀποκτεῖναί με
  choice: dar-me a morte
  rationale: Mantém o sentido de causar a morte e se ajusta ao registro solene da oração.
- source_word: ἐπίταξον ἐπιβλέψαι ἐπʼ ἐμὲ
  choice: ordena que olhes para mim
  rationale: Conserva a construção elevada e incomum do grego, na qual a suplicante pede que Deus ordene o olhar misericordioso sobre ela.
- source_word: ὀνειδισμόν
  choice: insultos
  rationale: Transmite a ideia de censura humilhante ou afronta verbal em linguagem atual e compreensível.
theological_decisions:
- issue: Identificação dos sete que morreram
  choice: Manter apenas “sete” no texto principal.
  alternative: Explicitar “sete maridos”.
  rationale: O contexto narrativo identifica claramente os sete como maridos, mas o grego deste versículo traz somente o numeral. A nota esclarece o referente sem ampliá-lo no texto.
- issue: Relação de parentesco e casamento na cláusula difícil
  choice: Preservar “irmão próximo” e traduzir a finalidade sem determinar além do texto a identidade do possível marido.
  alternative: Interpretar diretamente como “parente próximo” ou reformular segundo uma instituição matrimonial específica.
  rationale: A sintaxe grega é difícil e provavelmente envolve deveres familiares e sucessórios. A tradução retém essa tensão, sem importar uma reconstrução jurídica ou doutrinária específica.
- issue: Sentido de profanar o nome
  choice: Usar “desonrei” no texto, mantendo “nome”.
  alternative: Traduzir literalmente “contaminei” ou interpretar plenamente como “prejudiquei minha reputação”.
  rationale: No contexto da oração de Sara, trata-se de integridade moral e honra familiar. A escolha comunica o sentido idiomático sem apagar a imagem concreta do “nome”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. O texto conserva o tom solene da oração e alguma estranheza necessária nas cláusulas gregas difíceis, recorrendo a notas apenas onde a ambiguidade lexical, contextual ou sintática é relevante.
