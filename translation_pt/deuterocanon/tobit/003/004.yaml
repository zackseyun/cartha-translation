  verdict: revise
  source_fidelity: A tradução preserva adequadamente a distinção do grego entre «eles» que desobedeceram e «nos» que Deus entregou, bem como a sequência de calamidades e a dispersão entre as nações. «Motivo de insulto» comunica o sentido geral de παραβολὴν ὀνειδισμοῦ, e a nota conserva a imagem proverbial.
  naturalness: Há uma pequena redundância e rigidez em «entre todas as nações no meio das quais». «Entre todas as nações entre as quais» é mais natural e mantém com precisão a referência do pronome relativo às nações.
  terminology: «Mandamentos», «cativeiro», «morte» e «dispersos» são adequados ao registro. «Saque» é defensável para διαρπαγή, entendida como ser dado à pilhagem; «motivo de insulto» é uma solução idiomática, devidamente esclarecida pela nota.
