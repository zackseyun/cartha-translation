base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/004.yaml
  text: For they disobeyed your commandments, and you gave us over to plunder and captivity and death, and to become a proverb of reproach among all the nations where we have been scattered.
translation:
  language: pt
  text: Pois eles desobedeceram aos teus mandamentos, e tu nos entregaste ao saque, ao cativeiro e à morte, e para sermos motivo de insulto[a] entre todas as nações entre as quais fomos dispersos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “provérbio de insulto”; também pode ser entendido como “dito proverbial de desonra” ou “objeto de insulto”.
    reason: alternativa lexical para a expressão grega παραβολὴν ὀνειδισμοῦ
lexical_decisions:
- source_word: παρήκουσαν
  choice: desobedeceram
  rationale: Expressa de modo claro e conciso a recusa ou falha em atender aos mandamentos, preservando a terceira pessoa do plural.
- source_word: ἐντολῶν
  choice: mandamentos
  rationale: Mantém a força religiosa e pactual do termo grego no contexto de oração.
- source_word: ἔδωκας ἡμᾶς εἰς
  choice: tu nos entregaste ao
  rationale: Preserva explicitamente a ação divina de entregar o povo a condições adversas, com naturalidade em português.
- source_word: διαρπαγήν
  choice: saque
  rationale: Designa de forma corrente a pilhagem ou espoliação sofrida.
- source_word: αἰχμαλωσίαν
  choice: cativeiro
  rationale: É o equivalente direto do estado de ter sido capturado, sem generalizá-lo como mero exílio.
- source_word: θάνατον
  choice: morte
  rationale: Reproduz o sentido simples e direto do grego.
- source_word: παραβολὴν ὀνειδισμοῦ
  choice: motivo de insulto
  rationale: Comunica em português natural a ideia de o povo se tornar uma expressão proverbial de desonra; a imagem lexical mais literal é registrada em nota.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: entre todas as nações
  rationale: Refere-se amplamente aos povos entre os quais Israel foi disperso, sem importar o valor posterior de 'gentios'.
- source_word: ἐν οἷς ἐσκορπίσμεθα
  choice: no meio das quais fomos dispersos
  rationale: Mantém a referência às nações e o passivo da dispersão, em formulação digna e compreensível.
theological_decisions:
- issue: Confissão coletiva e ação divina no juízo
  choice: 'Manter tanto a desobediência deles quanto a ação de Deus: ''eles desobedeceram'' e ''tu nos entregaste''.'
  alternative: Generalizar a culpa como 'nós desobedecemos' ou atenuar a ação divina com 'fomos entregues'.
  rationale: O grego distingue os que desobedeceram, na terceira pessoa, da comunidade que sofre as consequências, na primeira pessoa, e atribui expressamente a Deus o ato de entregá-la.
- issue: Linguagem figurada de vergonha pública
  choice: Usar 'motivo de insulto' no texto e preservar a construção mais literal em nota.
  alternative: Usar no texto 'provérbio de opróbrio' ou 'objeto de desonra'.
  rationale: A formulação principal comunica com clareza a humilhação pública, enquanto a nota conserva a combinação incomum de 'provérbio/dito proverbial' e 'insulto' presente no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome 'tu' acompanha o discurso direto da oração; 'saque', 'cativeiro' e 'dispersos' preservam o tom histórico e solene sem arcaísmo excessivo.
