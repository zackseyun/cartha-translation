base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/005.yaml
  text: And now your judgments are many and true in dealing with me concerning my sins and the sins of my fathers[a], because we did not keep your commandments[b]; for we did not walk in truth before you.
translation:
  language: pt
  text: E agora, muitos e verdadeiros são os teus juízos[a] ao tratares comigo a respeito dos meus pecados e dos pecados dos meus antepassados, porque não guardamos os teus mandamentos; pois não andamos na verdade[b] diante de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos e justos são os teus juízos”. O grego diz literalmente “verdadeiros”, o que, neste contexto, também afirma que os juízos de Deus são corretos.
    reason: lexical_alternative
  - marker: b
    text: “Andar na verdade” é uma expressão bíblica que significa viver com verdade e fidelidade diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσεις
  choice: juízos
  rationale: No contexto penitencial, refere-se às decisões ou ações judiciais de Deus. “Juízos” preserva o sentido formal e a linguagem bíblica sem restringi-lo a sentenças verbais.
- source_word: ἀληθιναί
  choice: verdadeiros
  rationale: É o equivalente lexical mais direto. No contexto, também afirma que os juízos de Deus são corretos, mas a tradução evita substituir essa amplitude pela interpretação mais específica “justos”.
- source_word: ἐξ ἐμοῦ ποιῆσαι
  choice: ao tratares comigo
  rationale: A construção grega é incomum. Esta formulação comunica a ação de Deus em relação a Tobit sem acrescentar a hostilidade que “agir contra mim” poderia sugerir.
- source_word: περὶ τῶν ἁμαρτιῶν μου καὶ τῶν πατέρων μου
  choice: a respeito dos meus pecados e dos pecados dos meus antepassados
  rationale: “A respeito de” conserva a relação indicada por περί, e a repetição de “pecados” explicita a elipse. “Antepassados” expressa aqui o sentido familiar e ancestral de πατέρων com clareza em português moderno.
- source_word: ἐντολάς
  choice: mandamentos
  rationale: Tradução corrente que mantém o peso moral e pactual do termo.
- source_word: ἐπορεύθημεν ἐν ἀληθείᾳ
  choice: não andamos na verdade
  rationale: Preserva a metáfora bíblica do caminhar como modo de vida e mantém a amplitude de ἀλήθεια, que pode abranger verdade, sinceridade e fidelidade.
- source_word: ἐνώπιόν σου
  choice: diante de ti
  rationale: Expressão natural e concisa que conserva a ideia de viver na presença e sob o olhar de Deus.
theological_decisions:
- issue: Se os juízos de Deus devem ser chamados explicitamente de “justos” em vez de “verdadeiros”
  choice: verdadeiros
  alternative: justos
  rationale: Embora o contexto implique a justiça dos juízos divinos, o grego usa ἀληθιναί. “Verdadeiros” preserva a formulação e a amplitude do texto-fonte.
- issue: Se a menção aos pecados ancestrais afirma culpabilidade herdada
  choice: meus pecados e os pecados dos meus antepassados
  alternative: nossa culpa ancestral
  rationale: O texto confessa pecados pessoais e familiares ou corporativos, mas não formula uma doutrina específica de culpa herdada. A tradução mantém a distinção expressa no grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se a metáfora bíblica “andar na verdade” e a forma tradicional “juízos”, enquanto “antepassados” esclarece o alcance ancestral de πατέρων.
