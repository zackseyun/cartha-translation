  yaml_path: translation/deuterocanon/tobit/003/011.yaml
  text: And she prayed by the window and said[a], “Blessed are you, Lord my God, and blessed is your holy and honored name forever; let all your works bless you forever.”
translation:
  language: pt
  text: 'Ela orou junto à janela e disse: “Bendito és tu, Senhor, meu Deus, e bendito é o teu nome santo e honrado para sempre; que todas as tuas obras te bendigam[a] para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que todas as tuas obras te louvem para sempre”. O grego repete aqui o mesmo grupo de palavras relacionado a “bendito” usado antes no versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθη
  choice: orou
  rationale: O verbo expressa súplica dirigida a Deus; “orou” é natural no contexto e não exagera o grau de desespero.
- source_word: πρὸς τῇ θυρίδι
  choice: junto à janela
  rationale: θυρίς designa uma janela ou abertura, e a construção indica aqui proximidade ou localização.
- source_word: Εὐλογητὸς
  choice: Bendito
  rationale: Mantém a fórmula doxológica tradicional e a ligação lexical com εὐλογησάτωσάν no fim do versículo.
- source_word: Κύριε ὁ θεός μου
  choice: Senhor, meu Deus
  rationale: Forma natural de vocativo em português, preservando tanto κύριος como a relação pessoal expressa por μου.
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔντιμον
  choice: o teu nome santo e honrado
  rationale: ἔντιμος pode significar honrado, estimado ou precioso; “honrado” preserva a ideia de dignidade e reverência sem acrescentar a noção de glória.
- source_word: εἰς τοὺς αἰῶνας / εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Equivalente claro e corrente para as duas expressões de duração contínua, preservando o paralelismo.
- source_word: εὐλογησάτωσάν
  choice: que ... te bendigam
  rationale: A construção com “que” transmite naturalmente o imperativo de terceira pessoa e conserva a repetição do grupo lexical de “bendito”.
- source_word: πάντα τὰ ἔργα σου
  choice: todas as tuas obras
  rationale: Mantém a amplitude de ἔργα, que pode abranger tanto os feitos de Deus como aquilo que ele fez.
theological_decisions:
- issue: Tradução de κύριος na invocação dirigida a Deus
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a tradução convencional e contextualmente adequada na linguagem de oração, sem impor nuance adicional.
- issue: Linguagem de bênção dirigida a Deus
  choice: que todas as tuas obras te bendigam
  alternative: que todas as tuas obras te louvem
  rationale: O grego repete o mesmo grupo lexical de bênção empregado anteriormente. “Bendigam” preserva essa coesão, enquanto “louvem” explicita o sentido pragmático possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tu/teu” foi mantido como registro bíblico corrente e coerente dentro da oração; a sintaxe evita arcaísmos como “pelos séculos”.
