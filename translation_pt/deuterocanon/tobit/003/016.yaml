translation:
  language: pt
  text: E a oração de ambos foi ouvida diante da Glória[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante da glória de Deus” ou “na presença da Glória”. Nesta oração, o grego não menciona Deus explicitamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσηκούσθη
  choice: foi ouvida
  rationale: O passivo de εἰσακούω, aplicado à oração, indica acolhimento favorável. “Foi ouvida” mantém-se próximo do grego sem explicitar uma resposta que a oração ainda não descreve diretamente.
- source_word: προσευχὴ
  choice: oração
  rationale: É o equivalente direto, natural e corrente para προσευχή neste contexto.
- source_word: ἀμφοτέρων
  choice: de ambos
  rationale: O genitivo remete às duas pessoas mencionadas no contexto; “de ambos” é conciso e natural em português.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Expressa estar perante ou na presença de alguém ou algo, preservando de modo natural a construção grega.
- source_word: τῆς δόξης
  choice: da Glória
  rationale: Mantém o artigo e a formulação reverencial indireta do grego. A inicial maiúscula sinaliza o provável uso metonímico para a presença gloriosa de Deus sem inserir explicitamente “Deus” no texto.
theological_decisions:
- issue: Se δόξης deve ser ampliado para mencionar Deus explicitamente
  choice: da Glória
  alternative: da glória de Deus; na presença gloriosa de Deus
  rationale: Embora o contexto indique a referência divina, esta oração grega não nomeia Deus. A tradução preserva a indeterminação formal e a reverente metonímia do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem sintática permanece próxima do grego, mas natural em português; “Glória” conserva a reverência e a tensão interpretativa do original.
