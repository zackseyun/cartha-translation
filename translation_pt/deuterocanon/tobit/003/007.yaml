  yaml_path: translation/deuterocanon/tobit/003/007.yaml
  text: On that same day it happened to Sarah, the daughter of Raguel, in Ecbatana of Media, that she too was reproached by her father's maidservants,
translation:
  language: pt
  text: Naquele mesmo dia, aconteceu que Sara, filha de Raguel, em Ecbátana da Média, também foi insultada[a] pelas servas de seu pai,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «foi censurada» ou «foi injuriada»; o verbo grego indica censura humilhante ou abuso verbal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ αὐτῇ ἡμέρᾳ
  choice: Naquele mesmo dia
  rationale: Expressão temporal natural em português, preservando a força demonstrativa e a ligação com a narrativa anterior.
- source_word: συνέβη ... καὶ ταύτην ὀνειδισθῆναι
  choice: aconteceu também que ... foi insultada
  rationale: Mantém a construção narrativa impessoal e comunica a força aditiva de καί/ταύτην, ligando a experiência de Sara ao episódio precedente.
- source_word: τῇ θυγατρὶ Ῥαγουὴλ Σάρρᾳ
  choice: Sara, filha de Raguel
  rationale: Reordenação idiomática que conserva o nome pessoal e a identificação familiar.
- source_word: ἐν Ἐκβατάνοις τῆς Μηδείας
  choice: em Ecbátana, na Média
  rationale: Forma geográfica clara e natural em português, preservando tanto a cidade quanto a região.
- source_word: ὀνειδισθῆναι
  choice: foi insultada
  rationale: O verbo pode indicar censura humilhante, afronta ou abuso verbal; «insultada» é corrente e adequado ao contexto, sem restringir o sentido apenas a zombaria.
- source_word: ὑπὸ παιδισκῶν πατρὸς αὐτῆς
  choice: pelas servas de seu pai
  rationale: Preserva o gênero e a condição servil expressos por παιδίσκων, em linguagem atual e digna.
