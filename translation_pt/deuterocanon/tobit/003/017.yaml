base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/017.yaml
  text: 'of the great Raphael. And he was sent to heal the two: to remove the white films from Tobit''s eyes[a], and to give Sarah daughter of Raguel to Tobiah son of Tobit as a wife, and to bind Asmodeus, the evil demon, because Tobiah was entitled to inherit her. At that same time Tobit returned and entered into his house, and Sarah daughter of Raguel came down from her upper room.'
translation:
  language: pt
  text: 'do grande Rafael. Ele foi enviado para curar os dois: remover as películas brancas dos olhos de Tobit, dar Sara, filha de Raguel, como esposa a Tobias, filho de Tobit, e prender Asmodeu, o demônio maligno, porque cabia a Tobias herdá-la.[a] Naquele mesmo momento, Tobit voltou e entrou em sua casa, e Sara, filha de Raguel, desceu do aposento no andar de cima.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais idiomática, “porque Tobias tinha o direito de casar-se com ela”. O grego diz “herdá-la”, refletindo a estrutura jurídica e familiar da narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ μεγάλου Ῥαφαήλ
  choice: do grande Rafael
  rationale: Mantém a construção genitiva fragmentária do grego, que liga o início do versículo ao contexto anterior, e usa a forma portuguesa tradicional do nome.
- source_word: ἀπεστάλη ἰάσασθαι τοὺς δύο
  choice: Ele foi enviado para curar os dois
  rationale: Conserva a voz passiva, sem explicitar quem o enviou, e deixa que a ideia de cura abranja tanto Tobit quanto Sara.
- source_word: λεπίσαι τὰ λευκώματα
  choice: remover as películas brancas dos olhos de Tobit
  rationale: Expressa de modo compreensível a imagem de retirar ou descamar opacidades brancas, sem impor o diagnóstico moderno específico de catarata.
- source_word: δοῦναι ... γυναῖκα
  choice: dar Sara ... como esposa a Tobias
  rationale: Reproduz a fórmula matrimonial do grego em português natural e mantém as relações familiares explicitadas no texto.
- source_word: δῆσαι Ἀσμοδαῖον τὸ πονηρὸν δαιμόνιον
  choice: prender Asmodeu, o demônio maligno
  rationale: “Prender” comunica a ação de restringir ou atar o demônio sem acrescentar explicações; “maligno” é adequado ao contexto.
- source_word: ἐπιβάλλει κληρονομῆσαι αὐτήν
  choice: cabia a Tobias herdá-la
  rationale: Preserva a linguagem de herança e o sentido de direito ou precedência legal, apesar de sua estranheza deliberada no contexto matrimonial.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: Naquele mesmo momento
  rationale: Mantém a simultaneidade narrativa enfatizada pela expressão grega.
- source_word: ἐπιστρέψας Τωβείτ εἰσῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: Tobit voltou e entrou em sua casa
  rationale: Converte o particípio e o verbo principal numa coordenação natural em português, preservando a sequência da ação.
- source_word: κατέβη ἐκ τοῦ ὑπερῴου αὐτῆς
  choice: desceu do aposento no andar de cima
  rationale: Traduz ὑπερῷον por uma descrição clara do cômodo superior, evitando termos regionais ou arcaicos.
theological_decisions:
- issue: Alcance da missão curadora de Rafael
  choice: A cura abrange os dois, incluindo tanto a restauração física de Tobit quanto a libertação e o casamento de Sara.
  alternative: Restringir “curar” apenas à recuperação da visão de Tobit e tratar as ações relativas a Sara como missão separada.
  rationale: O infinitivo ἰάσασθαι rege a sequência referente a “os dois”; a tradução mantém esse alcance amplo sem definir mais precisamente a natureza teológica da cura.
- issue: Linguagem de herança aplicada a Sara
  choice: “cabia a Tobias herdá-la”
  alternative: “Tobias tinha o direito de casar-se com ela”
  rationale: O grego emprega explicitamente o verbo “herdar” dentro de uma estrutura jurídico-familiar. O texto principal conserva essa tensão, e a nota oferece a formulação idiomática.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o início fragmentário ligado ao versículo anterior. Os nomes seguem formas portuguesas correntes: Rafael, Tobit, Tobias, Sara, Raguel e Asmodeu. A nota foi posicionada junto à expressão sobre herdar Sara, à qual efetivamente se refere.'
