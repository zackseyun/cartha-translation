base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/001.yaml
  text: And being grieved[a], I wept, and I prayed in anguish, saying,
translation:
  language: pt
  text: 'E, entristecido[a], chorei e orei com angústia, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego é breve aqui: “E, entristecido, chorei e orei com angústia, dizendo”. Uma tradição de forma semítica mais extensa amplia consideravelmente o lamento nas linhas seguintes; esta frase inicial está bem representada pelo grego.'
    reason: textual_variant
lexical_decisions:
- source_word: λυπηθεὶς
  choice: entristecido
  rationale: O particípio aoristo passivo de λυπέω descreve o estado de quem foi tomado pela tristeza; a forma participial conserva de modo natural e direto a relação com as ações seguintes.
- source_word: ἔκλαυσα
  choice: chorei
  rationale: Tradução direta de κλαίω no aoristo, sem acrescentar uma intensidade que o grego não explicita.
- source_word: προσηυξάμην
  choice: orei
  rationale: Forma idiomática e corrente em português para προσεύχομαι, sem intensificação indevida.
- source_word: μετʼ ὀδύνης
  choice: com angústia
  rationale: ὀδύνη indica dor profunda ou angústia; a expressão preserva a intensidade e se combina naturalmente com o verbo 'orar'.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio introduz o conteúdo da oração e mantém a transição narrativa do grego.
