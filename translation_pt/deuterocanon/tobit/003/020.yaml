base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a][b].
translation:
  language: pt
  text: E agora lhe mostro os dez talentos de prata que depositei com Gabael, filho de Gabrias, em Rages, na Média.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Mostro» também pode ser traduzido por «dou a conhecer»; o verbo grego pode indicar que se chama a atenção de alguém para o assunto, sem implicar que algo seja exibido fisicamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: lhe mostro
  rationale: Mantém o presente do grego e expressa de modo natural o ato de chamar a atenção do interlocutor para a quantia; o contexto não exige que se trate de exibição física.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: os dez talentos de prata
  rationale: Preserva a quantidade, o material e a antiga unidade de peso ou valor sem convertê-la em medida moderna.
- source_word: παρεθέμην
  choice: depositei
  rationale: No contexto financeiro, o aoristo médio indica que a prata foi confiada a outra pessoa para custódia; «depositei» comunica isso de modo conciso.
- source_word: Γαβαήλῳ
  choice: Gabael
  rationale: Transliteração portuguesa clara do nome próprio grego Γαβαήλ.
- source_word: τῷ τοῦ Γαβρεία
  choice: filho de Gabrias
  rationale: Explicita a filiação indicada pela construção grega com artigo e genitivo de nome próprio.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: em Rages, na Média
  rationale: A formulação identifica naturalmente, em português, a cidade e sua região, preservando os topônimos antigos.
theological_decisions: []
