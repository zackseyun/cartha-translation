base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/018.yaml
  text: Seek counsel from every wise person[a], and do not despise any useful counsel.
translation:
  language: pt
  text: Busque conselho de toda pessoa sábia e não despreze nenhum conselho útil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλίαν / συμβουλίας
  choice: conselho
  rationale: O substantivo indica orientação oferecida para uma decisão. “Conselho” é natural em português e sua repetição mantém a correspondência lexical entre as duas orações.
- source_word: παρὰ παντὸς φρονίμου
  choice: de toda pessoa sábia
  rationale: 'παρά com o genitivo marca a fonte, e o adjetivo substantivado φρόνιμος tem sentido genérico: alguém sábio, prudente ou sensato. “Pessoa sábia” evita acrescentar uma especificação masculina ausente do grego.'
- source_word: ζήτησον
  choice: Busque
  rationale: O imperativo exprime procura ativa; “busque conselho” transmite essa força de modo claro e digno.
- source_word: μὴ καταφρονήσῃς
  choice: não despreze
  rationale: καταφρονέω implica tratar com desdém ou menosprezo. “Despreze” preserva essa força, em vez de reduzi-la a simplesmente ignorar.
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  choice: nenhum conselho útil
  rationale: Sob a negação, πάσης é expresso naturalmente como “nenhum”; χρησίμης qualifica o conselho como útil ou proveitoso.
theological_decisions:
- issue: Referência genérica em φρονίμου
  choice: toda pessoa sábia
  alternative: todo sábio / todo homem sábio
  rationale: O grego emprega um adjetivo substantivado genericamente, sem substantivo explicitamente masculino. A tradução mantém a abrangência sem importar especificidade de gênero.
translation_notes:
  register: Português moderno, claro e digno, com forma imperativa “busque/não despreze”, amplamente compreensível e natural para leitores brasileiros. A repetição de “conselho” acompanha deliberadamente a repetição grega.
