base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/003.yaml
  text: Remember me and look upon me[a]; do not punish me for my sins and my errors done in ignorance, and for those of my fathers[c][b], which they committed before you.
translation:
  language: pt
  text: Lembra-te de mim e olha para mim; não me castigues pelos meus pecados, nem pelas faltas que cometi por ignorância, nem pelos pecados de meus antepassados[a], que eles cometeram diante de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “meus pais” (isto é, “meus pais ancestrais”); aqui, o termo se refere aos antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητί μου
  choice: Lembra-te de mim
  rationale: Mantém o imperativo direto e a linguagem bíblica de oração, na qual lembrar-se implica voltar a atenção favoravelmente para quem suplica.
- source_word: ἐπίβλεψον ἐπʼ ἐμέ
  choice: olha para mim
  rationale: Expressa de modo natural e digno o pedido intensificado de atenção divina, sem o tom arcaico de alternativas como “põe os olhos sobre mim”.
- source_word: μὴ ἐκδίκῃς
  choice: não me castigues
  rationale: Embora ἐκδικέω possa significar vingar ou exercer justiça, aqui introduz a súplica para que Deus não retribua os pecados com punição. A formulação explicita em português o objeto pessoal implícito no contexto.
- source_word: τὰς ἁμαρτίας μου
  choice: pelos meus pecados
  rationale: “Pecados” conserva o peso moral e teológico usual de ἁμαρτία.
- source_word: τοῖς ἀγνοήμασίν μου
  choice: pelas faltas que cometi por ignorância
  rationale: ἀγνόημα designa transgressões praticadas sem conhecimento ou plena consciência. “Faltas” evita enfraquecê-las como meros enganos, e a oração relativa comunica claramente a ignorância envolvida.
- source_word: τῶν πατέρων μου
  choice: pelos pecados de meus antepassados
  rationale: O grego diz literalmente “de meus pais”, mas no contexto πατέρες se refere às gerações anteriores. “Antepassados” evita que o leitor moderno entenda apenas o pai imediato; “pecados” é suprido para tornar explícita a elipse sintática.
- source_word: ἃ ἥμαρτον ἐνώπιόν σου
  choice: que eles cometeram diante de ti
  rationale: O plural ἥμαρτον aponta mais naturalmente para os antepassados. “Cometeram” retoma de forma idiomática “pecados”, enquanto “diante de ti” preserva a dimensão relacional e judicial de ἐνώπιόν σου.
theological_decisions:
- issue: Escopo da oração relativa ἃ ἥμαρτον ἐνώπιόν σου
  choice: A oração se refere especificamente aos pecados dos antepassados.
  alternative: A oração pode ser entendida de modo mais amplo, resumindo todos os pecados mencionados anteriormente.
  rationale: O verbo plural ἥμαρτον concorda mais naturalmente com o referente plural mais próximo, “meus antepassados”. A tradução mantém distintos os pecados pessoais e os ancestrais, sem negar a possível leitura mais abrangente.
- issue: Valor de μὴ ἐκδίκῃς na oração penitencial
  choice: não me castigues
  alternative: não te vingues / não exijas reparação
  rationale: O contexto pede que Deus não aplique retribuição pelos pecados. “Castigues” comunica esse sentido em português corrente sem atribuir a Deus a conotação moderna, frequentemente passional, de vingança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal própria do registro bíblico (“Lembra-te”, “não me castigues”). A repetição de “nem” organiza com clareza as três categorias mencionadas no grego. O texto evita tanto arcaísmos desnecessários quanto linguagem excessivamente coloquial.
