  text: You know, Lord, that I am pure from every sin and from a man,
translation:
  language: pt
  text: Tu sabes, Senhor, que estou pura de todo pecado e de homem,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺ γινώσκεις
  choice: Tu sabes
  rationale: Mantém o pronome enfático e traduz naturalmente o presente grego em contexto de oração.
- source_word: καθαρά εἰμι
  choice: estou pura
  rationale: Preserva o predicativo feminino e a afirmação de pureza feita por Sara.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: de todo pecado
  rationale: Reproduz a abrangência de πάσης sem ampliar a expressão para uma alegação teológica mais específica.
- source_word: καὶ ἀνδρός
  choice: e de homem algum
  rationale: ἀνήρ pode significar homem ou marido; aqui, após a preposição e sem artigo, a expressão concisa indica pureza em relação a homem algum, sem resolver mais do que o grego permite.
theological_decisions:
- issue: Alcance da declaração de pureza
  choice: Conservar a formulação abrangente “pura de todo pecado”
  alternative: Atenuar para “inocente deste pecado”
  rationale: O texto grego traz πάσης ἁμαρτίας, literalmente uma afirmação abrangente; a tradução não deve restringi-la por harmonização teológica.
- issue: Sentido de ἀνδρός
  choice: “de homem algum”
  alternative: “de marido” ou “de um homem”
  rationale: A forma grega isolada admite associação com homem ou marido. No contexto da declaração de castidade, “homem algum” é português natural e conserva a referência geral sem afirmar especificamente que nunca teve marido.
translation_notes:
  register: Oração em registro digno e atual. Emprega-se “Tu” por ser uma invocação direta ao Senhor e por manter a ênfase de σύ. A vírgula final é preservada porque o versículo continua sintaticamente no trecho seguinte.
