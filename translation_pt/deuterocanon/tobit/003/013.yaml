  source_fidelity: A construção grega εἰπὸν ἀπολῦσαί με é uma súplica para que Deus diga/mande que a falante seja libertada. «Ordena» é possível no contexto, mas torna mais forte o simples imperativo de λέγω e, assim, vai além da nuance lexical preservada pelo texto-fonte e pela trilha inglesa. A coordenação com «e que eu não ouça mais reprovação» mantém os dois infinitivos gregos sem converter necessariamente o segundo em consequência do primeiro.
  naturalness: «Dize que eu seja libertada» é claro, solene e compreensível em português moderno de registro bíblico. A repetição de «que eu» diante do segundo membro torna a coordenação natural e inequívoca.
  terminology: «Libertada da terra» preserva a imagem indireta do grego sem explicitar a morte. «Reprovação» corresponde bem a ὀνειδισμός como censura, vergonha ou vitupério sofrido; evita o sentido mais pontual de «afronta».
