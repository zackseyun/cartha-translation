  text: Tell me to release me from the earth[a], so that I may no longer hear reproach.
translation:
  language: pt
  text: Dize que eu seja libertada da terra[a] e que eu não ouça mais reprovação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seja liberta da terra» ou «seja retirada da terra». A expressão grega é um pedido indireto para ser libertada da vida terrena.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπὸν
  choice: Ordena
  rationale: O imperativo aoristo de λέγω introduz aqui o conteúdo da súplica dirigida a Deus. Em português, «ordena» comunica de modo natural a força do dizer divino seguido de infinitivo, sem tornar a formulação obscura.
- source_word: ἀπολῦσαί με
  choice: que eu seja libertada
  rationale: ἀπολύω pode significar soltar, libertar ou deixar partir. A formulação passiva em português expressa naturalmente o pedido para que Deus a liberte; o feminino decorre da identidade da falante, Sara, no contexto.
- source_word: ἀπὸ τῆς γῆς
  choice: da terra
  rationale: Mantém a imagem grega, que funciona no contexto como pedido indireto para ser retirada da vida terrena, sem explicitar «morrer» no texto principal.
- source_word: καὶ μὴ ἀκοῦσαί με μηκέτι
  choice: e não ouça mais
  rationale: Reproduz a coordenação do segundo infinitivo e o valor de cessação de μηκέτι em português corrente.
- source_word: ὀνειδισμόν
  choice: nenhuma afronta
  rationale: ὀνειδισμός abrange censura, insulto e humilhação pública. «Afronta» conserva tanto o caráter verbal quanto a desonra sofrida; «nenhuma» torna idiomática a negação em português.
theological_decisions:
- issue: Expressão indireta de um desejo de morte em oração a Deus
  choice: seja libertada da terra
  alternative: seja retirada da terra
  rationale: A tradução conserva a metáfora de ἀπολύω e γῆ, sem transformar o pedido reverente em uma declaração mais explícita sobre a morte ou a vida após a morte do que permite o grego.
translation_notes:
  register: Português moderno, digno e acessível. «Ordena» evita a construção pouco natural de uma reprodução mecânica de εἰπόν com infinitivo. A imagem «da terra» e sua tensão teológica são preservadas, com explicação apenas na nota.
