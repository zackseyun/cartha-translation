review_pass:
  verdict: revise
  source_fidelity: O rascunho traduz corretamente a exortação inicial e a condição ética. Contudo, «você terá muitos bens» transforma em futuro a afirmação presente ὑπάρχει σοι πολλὰ («você possui/tem muitos bens»).
  naturalness: A redação é clara e de registro apropriado. A coordenação condicional fica mais fluida com a repetição de «você» antes de «se afastar».
  terminology: «Temer a Deus», «pecado» e «o que é agradável diante dele» mantêm terminologia bíblica compreensível e não impõem interpretação doutrinária.
  issues:
  - severity: medium
    issue: Tempo verbal de «ὑπάρχει σοι πολλὰ»
    rationale: O grego emprega o presente («há/existem para você muitas coisas», idiomaticamente «você possui muitos bens»), não um futuro. «Terá» altera a temporalidade da declaração, ainda que a condição subsequente possa sugerir uma consequência.
  - severity: low
    issue: Incompatibilidade entre a referência/camada inglesa e o texto-fonte fornecido
    rationale: A trilha inglesa contém uma frase sobre uma mulher aflita, sem correspondência no grego apresentado, que é uma passagem mais extensa cuja abertura corresponde ao rascunho. A revisão segue o original grego, mas a associação de referência e segmentação deve ser verificada editorialmente.
  revised_text: E não tenha medo, meu filho, porque ficamos pobres; você possui muitos bens, se temer a Deus, se afastar de todo pecado e fizer o que é agradável diante dele.
  revised_footnotes: []
  revision_rationale: A única alteração textual necessária substitui o futuro «terá» pelo presente «possui», preservando o tempo do grego e a condição introduzida por ἐάν. Também se ajusta a coordenação verbal para maior naturalidade em português, sem mudar o sentido.
