  yaml_path: translation/deuterocanon/tobit/003/021.yaml
  text: And she was utterly grieved, so that she wept.
translation:
  language: pt
  text: E não tenha medo, meu filho, porque ficamos pobres. Você terá muitos bens, se temer a Deus, afastar-se de todo pecado e fizer o que é agradável diante dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ φοβοῦ
  choice: não tenha medo
  rationale: Expressa naturalmente em português a proibição no presente, sem acrescentar objeto ao temor.
- source_word: παιδίον
  choice: meu filho
  rationale: No contexto de fala parental, a forma afetiva portuguesa é mais natural do que o literal «criança».
- source_word: ἐπτωχεύσαμεν
  choice: ficamos pobres
  rationale: 'Preserva o aspecto resultativo do aoristo: a família passou a uma condição de pobreza.'
- source_word: ὑπάρχει σοι πολλὰ
  choice: você terá muitos bens
  rationale: Comunica a ideia de possuir muito; o futuro em português acompanha a condição que vem em seguida, embora o grego use o presente.
- source_word: φοβηθῇς τὸν θεόν
  choice: temer a Deus
  rationale: Mantém a linguagem bíblica de reverência e obediência, sem reduzi-la a mero medo.
- source_word: τὸ ἀρεστὸν ἐνώπιον αὐτοῦ
  choice: o que é agradável diante dele
  rationale: Conserva a imagem relacional e judicial de agir perante Deus.
theological_decisions:
- issue: Relação condicional entre possuir muito e a fidelidade a Deus
  choice: manter explicitamente a condição «se»
  alternative: parafrasear como uma promessa absoluta de prosperidade
  rationale: O grego contém ἐάν e vincula a afirmação às três ações seguintes; a tradução não transforma isso numa promessa incondicional.
- issue: Sentido de «temer a Deus»
  choice: preservar a expressão tradicional sem explicação no corpo do texto
  alternative: traduzir como «reverenciar a Deus»
  rationale: «Temer a Deus» mantém a amplitude semântica e a tensão do original, abrangendo reverência, lealdade e consciência do juízo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento por «você» e cadência bíblica moderada. O texto grego fornecido não corresponde à camada inglesa nem parece compatível com a referência indicada; por isso, o rascunho traduz a unidade inicial claramente atestada no original apresentado, sem adotar a frase inglesa não sustentada por esse testemunho.
