  text: And now[a], Lord, I have set my eyes and my face toward you.
translation:
  language: pt
  text: E agora, Senhor, voltei meus olhos e meu rosto para ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “dei meus olhos e meu rosto a ti”. O grego provavelmente emprega essa linguagem corporal para indicar que a pessoa se volta para Deus em oração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Expressão de transição direta que marca o movimento imediato da oração.
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος; “Senhor” é a forma natural e reverente de dirigir-se a Deus em português.
- source_word: τοὺς ὀφθαλμούς μου
  choice: meus olhos
  rationale: Mantém a imagem corporal concreta do grego, em vez de reduzi-la a “olhar”.
- source_word: τὸ πρόσωπόν μου
  choice: meu rosto
  rationale: Preserva o sentido concreto de πρόσωπον e o paralelismo com “meus olhos”.
- source_word: εἰς σὲ
  choice: para ti
  rationale: Comunica a orientação em direção a Deus e corresponde naturalmente à preposição εἰς neste contexto.
- source_word: δέδωκα
  choice: volto
  rationale: O perfeito de δίδωμι significa literalmente “dei”, mas, com “olhos” e “rosto”, descreve idiomaticamente a ação deliberada de orientar-se para Deus. O presente português expressa o estado resultante no momento da oração.
theological_decisions:
- issue: Tradução de κύριος na invocação direta
  choice: Senhor
  alternative: Ó Senhor
  rationale: A oração se dirige a Deus. “Senhor” traduz κύριος sem acrescentar uma marca vocativa que o grego não exige e soa natural no português atual.
translation_notes:
  register: Português moderno, claro e reverente, com construção natural para leitores brasileiros e compreensão internacional. Mantém as imagens corporais do original, ao mesmo tempo que verte idiomaticamente o verbo.
