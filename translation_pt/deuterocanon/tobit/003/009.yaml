base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/009.yaml
  text: Why do you flog us? If they have died[a], go with them! May we never see a son or daughter from you forever.
translation:
  language: pt
  text: Por que você nos açoita? Se eles morreram[a], vá com eles! Que nunca vejamos um filho ou uma filha de você!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o sentido implícito: “vá morrer com eles”. O grego diz apenas “vá com eles”, mas se refere aos maridos mortos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖς
  choice: açoita
  rationale: O verbo denota literalmente açoitar ou flagelar. “Açoita” conserva a violência verbal da acusação e permanece claro em português atual.
- source_word: βάδιζε μετʼ αὐτῶν
  choice: vá com eles
  rationale: O imperativo manda ir ou seguir com eles. No contexto, “eles” são os maridos mortos; a tradução mantém a formulação implícita do grego sem acrescentar “morra” ao texto principal.
- source_word: μὴ ἴδωμέν
  choice: Que nunca vejamos
  rationale: O subjuntivo com μή exprime aqui um desejo hostil ou uma imprecação. A construção portuguesa reproduz essa força.
- source_word: σου υἱὸν ἢ θυγατέρα
  choice: um filho ou uma filha seus
  rationale: O genitivo σου liga os possíveis filhos a Sara. A formulação natural em português preserva a referência à descendência sem explicitar “nascidos de você”, ausente do grego.
- source_word: εἰς τὸν αἰῶνα
  choice: nunca
  rationale: Em combinação com μή, a expressão reforça a negação por tempo indefinido. “Nunca” comunica de modo idiomático a ideia de “jamais/para sempre” sem a redundância pouco natural de “nunca... para sempre”.
theological_decisions:
- issue: Sentido implícito de “vá com eles”
  choice: Manter “vá com eles” no texto principal, deixando implícito que se trata de juntar-se aos maridos na morte.
  alternative: “Vá morrer com eles.”
  rationale: O contexto torna clara a alusão à morte, mas o grego diz apenas “vá com eles”. A tradução preserva a dureza e também a implicitude do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Você” corresponde ao singular do verbo grego e é natural no contexto de confronto; “açoita” mantém a imagem forte do original. A frase final foi formulada como imprecação idiomática, sem duplicar artificialmente “nunca” e “para sempre”.
