base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/009.yaml
  text: And when I became a man[a], I took Anna as my wife from the seed of our ancestral family[b], and by her I fathered Tobiah.
translation:
  language: pt
  text: E, quando me tornei homem, tomei Ana por esposa, dentre os descendentes de nossa família paterna, e com ela gerei Tobias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγενόμην ἀνήρ
  choice: me tornei homem
  rationale: Preserva a formulação masculina e o sentido biográfico de chegar à idade adulta, sem recorrer a uma expressão arcaica.
- source_word: ἔλαβον Ἄνναν γυναῖκα
  choice: tomei Ana por esposa
  rationale: Mantém de modo natural em português o idioma matrimonial do grego, mais próximo da forma da fonte do que simplesmente 'casei-me com Ana'.
- source_word: ἐκ τοῦ σπέρματος τῆς πατριᾶς ἡμῶν
  choice: dentre os descendentes de nossa família paterna
  rationale: Expressa o sentido genealógico de σπέρμα e a linhagem vinculada ao lado paterno indicada por πατριά, evitando o pouco natural 'da semente de'.
- source_word: ἐγέννησα ἐξ αὐτῆς
  choice: com ela gerei
  rationale: Conserva o sujeito masculino e a referência explícita à mãe, em linguagem portuguesa atual e digna.
- source_word: Τωβίαν
  choice: Tobias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome grego Τωβίας.
theological_decisions:
- issue: Linguagem masculina da etapa da vida
  choice: me tornei homem
  alternative: cheguei à idade adulta
  rationale: O substantivo ἀνήρ é masculino e, neste relato autobiográfico, indica a passagem de Tobit à condição adulta; a tradução conserva esse dado sem neutralizá-lo.
- issue: Ênfase na linhagem familiar
  choice: dentre os descendentes de nossa família paterna
  alternative: de nossa linhagem ancestral
  rationale: A formulação retém a relação de parentesco e o caráter paterno da πατριά, sem transformar a informação narrativa em prescrição legal ou doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em âmbito lusófono. A coordenação do grego foi preservada. Preferiu-se clareza genealógica a um decalque semítico como 'semente', e a forma consagrada 'Tobias' à transliteração inglesa 'Tobiah'.
