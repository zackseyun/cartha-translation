  yaml_path: translation/deuterocanon/tobit/001/019.yaml
  text: But one of the men in Nineveh went and informed the king about me[a], that I was burying them; and I hid myself. Then, realizing that I was being sought to be put to death[b], I withdrew in fear.
translation:
  language: pt
  text: Mas um dos que estavam em Nínive foi informar ao rei a meu respeito[a], dizendo que eu os sepultava. Então me escondi. Quando percebi que estavam me procurando para me matar[b], retirei-me com medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «um dos que estavam em Nínive».
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, «eu estava sendo procurado para morrer» ou «para ser morto».
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: foi
  rationale: O particípio aoristo antecede a ação principal e, em português natural, integra-se bem à construção «foi informar».
- source_word: εἷς τῶν ἐν Νινευὴ
  choice: um dos que estavam em Nínive
  rationale: Preserva a expressão elíptica do grego sem acrescentar «homens» ou «habitantes», termos não expressos no texto.
- source_word: ὑπέδειξε
  choice: informar
  rationale: Neste contexto, o verbo indica dar informação a uma autoridade acerca de alguém; «informar» é claro e não acrescenta a conotação jurídica mais forte de «denunciar».
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Equivalente corrente e digno da expressão preposicional grega.
- source_word: ὅτι θάπτω αὐτούς
  choice: dizendo que eu os sepultava
  rationale: O presente θάπτω em discurso indireto sugere ação contínua ou habitual; o imperfeito português a situa naturalmente no quadro narrativo passado. «Dizendo» explicita a função declarativa de ὅτι sem alterar o conteúdo.
- source_word: ἐκρύβην
  choice: me escondi
  rationale: A forma passiva/média tem aqui sentido intransitivo-reflexivo; «me escondi» é direto e idiomático.
- source_word: ἐπιγνοὺς
  choice: quando percebi
  rationale: Expressa o reconhecimento da situação e mantém clara a relação temporal do particípio com a ação principal.
- source_word: ζητοῦμαι ἀποθανεῖν
  choice: estavam me procurando para me matar
  rationale: Torna natural em português a construção grega comprimida, literalmente próxima de «eu era procurado para morrer», preservando a busca e sua finalidade mortal.
- source_word: φοβηθεὶς
  choice: com medo
  rationale: Conserva a circunstância emocional ligada à retirada sem impor se o medo foi apenas circunstancial ou causal.
- source_word: ἀνεχώρησα
  choice: retirei-me
  rationale: Mantém o sentido de afastar-se por segurança, sem intensificá-lo necessariamente como «fugi».
theological_decisions:
- issue: Caracterização da reação de Tobit à perseguição
  choice: «retirei-me com medo»
  alternative: «fugi com medo» ou «fui embora porque estava com medo»
  rationale: ἀνεχώρησα indica retirada ou afastamento, não exigindo a intensidade de «fugi». A formulação preserva tanto o perigo real quanto a sobriedade narrativa.
- issue: Agente da ameaça de morte
  choice: «estavam me procurando para me matar»
  alternative: «eu estava sendo procurado para ser morto»
  rationale: O grego conserva Tobit como sujeito gramatical passivo, mas não identifica explicitamente os perseguidores. O sujeito indeterminado em português mantém essa indefinição e comunica com clareza a finalidade da busca.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe foi dividida em três frases para evitar um período excessivamente carregado, mantendo a sequência do grego. Os marcadores [a] e [b] aparecem no texto principal.
