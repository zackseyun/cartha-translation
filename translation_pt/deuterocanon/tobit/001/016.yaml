  text: And in the days of Enemessar I did many acts of mercy for my brothers[b][a];
translation:
  language: pt
  text: E, nos dias de Enemessar, eu praticava muitas obras de misericórdia em favor dos meus irmãos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esmolas” ou “atos de caridade”; o termo grego frequentemente indica ações concretas de misericórdia, especialmente ajuda aos necessitados.
    reason: lexical_alternative
  - marker: b
    text: “Meus irmãos” pode referir-se de modo amplo aos parentes ou compatriotas israelitas de Tobit, e não apenas a irmãos biológicos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις
  choice: nos dias de
  rationale: Preserva o idioma temporal grego e soa natural em português, sem explicitar indevidamente que se trata do reinado.
- source_word: Ἐνεμεσσάρου
  choice: Enemessar
  rationale: Translitera o nome próprio a partir da forma grega, retirando a terminação do genitivo.
- source_word: ἐλεημοσύνας
  choice: obras de misericórdia
  rationale: Conserva o plural e o sentido amplo de ações concretas de compaixão; não restringe o termo apenas à entrega de dinheiro.
- source_word: πολλὰς
  choice: muitas
  rationale: Corresponde diretamente ao adjetivo plural que qualifica ἐλεημοσύνας.
- source_word: ἐποίουν
  choice: eu praticava
  rationale: O imperfeito grego sugere ação habitual ou continuada naquele período; “praticava” comunica esse aspecto com naturalidade.
- source_word: τοῖς ἀδελφοῖς μου
  choice: em favor dos meus irmãos
  rationale: A expressão benefactiva é transmitida naturalmente por “em favor de”; “irmãos” preserva a formulação grega e sua possível amplitude de parentes ou compatriotas israelitas.
theological_decisions:
- issue: Amplitude de ἀδελφοῖς μου
  choice: meus irmãos
  alternative: meus parentes; meus compatriotas israelitas
  rationale: O texto grego diz literalmente “meus irmãos”, mas o contexto permite uma referência mais ampla aos parentes ou ao povo de Tobit. A tradução mantém a ambiguidade no texto e a esclarece em nota.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das notas segue a ocorrência lexical no versículo: primeiro “obras de misericórdia”, depois “meus irmãos”.'
