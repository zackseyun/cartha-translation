    issue: Aspecto verbal alterado na primeira oração e na ação de sepultar
    rationale: ἀπέκτεινεν e ἔθαψα são aoristos; 'matava' e 'sepultava' introduzem aspecto habitual não explicitado pela forma verbal grega.
  - severity: medium
    issue: '''voltou fugindo'' acrescenta a ideia de retorno'
    rationale: ἦλθεν φεύγων significa literalmente 'veio fugindo'; o verbo não contém por si a noção de voltar.
  - severity: medium
    issue: A busca dos corpos foi reformulada como ordem do rei
    rationale: 'ἐξητήθη ὑπὸ τοῦ βασιλέως tem os corpos como sujeito paciente e o rei como agente: ''os corpos foram procurados pelo rei''. ''Mandou procurar'' é possível como inferência contextual, mas é menos direto e altera a construção.'
  revised_text: E, se o rei Senaqueribe matou alguém quando veio fugindo da Judeia[a], eu os sepultei às escondidas; pois, em sua ira, matou muitos; e os corpos foram procurados pelo rei, mas não foram encontrados.
