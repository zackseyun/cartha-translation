  yaml_path: translation/deuterocanon/tobit/001/018.yaml
  text: And if Sennacherib the king killed any when he came fleeing from Judea[a], I buried them secretly; for in his anger he killed many, and the bodies were sought by the king, but they were not found.
translation:
  language: pt
  text: E, se o rei Senaqueribe matou alguém quando veio fugindo da Judeia[a], eu os sepultei às escondidas; pois, em sua ira, matou muitos; e os corpos foram procurados pelo rei, mas não foram encontrados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego de Swete traz “Achreil, o rei” (Ἀχρειλ ὁ βασιλεύς), forma que, neste contexto, é entendida como referência a Senaqueribe.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ εἴ τινα
  choice: E, se ... alguém
  rationale: Preserva a construção condicional e indefinida do grego. A retomada posterior no plural reflete a prática repetida de Tobias em relação às vítimas.
- source_word: ἀπέκτεινεν
  choice: matava / matou
  rationale: O verbo é traduzido de modo direto e corrente; o imperfeito português na primeira ocorrência expressa adequadamente a circunstância reiterada indicada pelo contexto, enquanto o perfeito na explicação resume os muitos mortos.
- source_word: Ἀχρειλ ὁ βασιλεύς
  choice: o rei Senaqueribe
  rationale: O contexto narrativo identifica o soberano como Senaqueribe. A forma incomum do nome no texto grego de Swete é preservada em nota para manter transparência textual.
- source_word: ὅτε ἦλθεν φεύγων
  choice: quando voltou fugindo
  rationale: Conserva tanto a ideia de deslocamento quanto a de fuga. Neste contexto, 'voltou' comunica naturalmente o retorno do rei, sem ocultar o particípio 'fugindo'.
- source_word: ἐκ τῆς Ἰουδαίας
  choice: da Judeia
  rationale: É a designação geográfica corrente e clara para Ἰουδαία neste contexto helenístico.
- source_word: ἔθαψα αὐτοὺς κλέπτων
  choice: eu os sepultava às escondidas
  rationale: O particípio κλέπτων indica ação furtiva ou secreta, não roubo. 'Às escondidas' é natural em português e mantém essa nuance.
- source_word: ἐν τῷ θυμῷ αὐτοῦ
  choice: em sua ira
  rationale: '''Ira'' preserva a intensidade de θυμός e mantém o registro digno, sem recorrer a linguagem arcaica.'
- source_word: ἐξητήθη ὑπὸ τοῦ βασιλέως τὰ σώματα
  choice: O rei mandou procurar os corpos
  rationale: A formulação ativa idiomática expressa a busca realizada sob autoridade do rei. Evita a construção pouco natural 'os corpos foram procurados pelo rei' sem acrescentar resultado à busca.
- source_word: καὶ οὐχ εὑρέθη
  choice: mas eles não foram encontrados
  rationale: O verbo grego singular concorda normalmente com o sujeito neutro plural τὰ σώματα; em português, a concordância plural é necessária. 'Mas' torna explícito o contraste já presente na sequência.
theological_decisions:
- issue: Forma do nome do rei assírio
  choice: Senaqueribe no texto principal, com a forma grega Achreil em nota
  alternative: Achreil no texto principal
  rationale: Trata-se de uma questão textual e histórica, não doutrinária. O contexto identifica o rei como Senaqueribe, mas a nota conserva honestamente a forma atestada no texto grego fornecido.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A alternância entre 'matava/sepultava' apresenta a prática reiterada no contexto, enquanto 'matou muitos' mantém a afirmação sumária do grego. O marcador [a] aparece junto ao referente anotado.
