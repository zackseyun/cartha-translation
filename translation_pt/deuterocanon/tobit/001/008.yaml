base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/008.yaml
  text: And the third I would give to those to whom it was due[a], just as Deborah, my father's mother, commanded[c][b], because I was left an orphan by my father.
translation:
  language: pt
  text: E eu dava a terceira parte[a] àqueles a quem era devida, conforme Débora, mãe de meu pai[b], havia ordenado, porque meu pai me deixou órfão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a terceira”; o substantivo “parte” ou “porção” fica subentendido no grego.
    reason: lexical_alternative
  - marker: b
    text: Isto é, sua avó paterna; literalmente, “mãe de meu pai”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, ficou sem pai. A expressão grega diz literalmente que seu pai o deixou órfão, provavelmente em referência à morte dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν τρίτην
  choice: a terceira parte
  rationale: O adjetivo feminino substantivado retoma uma parte ou porção mencionada pelo contexto. Em português, explicitar «parte» evita uma elipse pouco natural, sem acrescentar conteúdo indevido.
- source_word: ἐδίδουν
  choice: eu dava
  rationale: O imperfeito descreve uma prática habitual no passado; «dava» expressa isso naturalmente em português.
- source_word: οἷς καθήκει
  choice: àqueles a quem era devida
  rationale: καθήκει indica aquilo que cabe, convém ou é devido. A formulação conserva a ideia de destinatários legítimos sem especificá-los além do grego.
- source_word: καθὼς ἐνετείλατο
  choice: conforme ... havia ordenado
  rationale: ἐντέλλομαι denota dar uma ordem ou incumbência. O mais-que-perfeito composto torna clara, em português corrente, a anterioridade da ordem em relação à prática narrada.
- source_word: Δεββώρα
  choice: Débora
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: ἡ μήτηρ τοῦ πατρός μου
  choice: mãe de meu pai
  rationale: Preserva a expressão concreta do grego, em vez de substituí-la silenciosamente por «avó».
- source_word: διότι
  choice: porque
  rationale: Introduz diretamente a razão da autoridade ou participação de Débora.
- source_word: ὀρφανὸς κατελείφθην ὑπὸ τοῦ πατρός μου
  choice: meu pai me deixou órfão
  rationale: Reproduz de modo natural a construção grega e mantém sua tensão literal, sem inserir explicitamente «morte», embora esse seja o sentido contextual provável.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. A tradução conserva a referência explícita à mãe do pai e sinaliza em nota tanto a elipse de «parte» quanto o sentido contextual de ter ficado sem pai.
