  yaml_path: translation/deuterocanon/tobit/001/021.yaml
  text: And before fifty days had passed[a], his two sons killed him and fled to the mountains of Ararat. And Sacherdonos his son reigned in his place, and he appointed Achiacharos, the son of Anael, my brother's son[b], over all the accounts of his kingdom and over the whole administration.
translation:
  language: pt
  text: E, antes que se passassem cinquenta dias, seus dois filhos o mataram e fugiram para os montes de Ararate. E Saquerdonos[a], seu filho, reinou em seu lugar e nomeou Aquiacharos[b], filho de Anael — este, filho do meu irmão —, responsável por todas as contas do seu reino e por toda a administração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Saquerdonos é a forma baseada no nome grego do rei assírio mais conhecido em português como Esar-Hadom.
    reason: lexical_alternative
  - marker: b
    text: Aquiacharos é a forma baseada no grego do nome muitas vezes apresentado como Aicar ou Ahikar.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διῆλθον ἡμέραι πεντήκοντα ἕως οὗ
  choice: antes que se passassem cinquenta dias
  rationale: Reproduz em português natural o sentido do idiomatismo grego, destacando que o intervalo foi inferior a cinquenta dias.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: É a equivalência mais direta e neutra, sem acrescentar a avaliação jurídica ou moral implicada por “assassinaram”.
- source_word: ἔφυγον εἰς τὰ ὄρη Ἀραράθ
  choice: fugiram para os montes de Ararate
  rationale: Preserva o movimento de fuga após a morte e usa a forma portuguesa corrente do topônimo.
- source_word: ἐβασίλευσεν ... ἀντʼ αὐτοῦ
  choice: reinou em seu lugar
  rationale: Expressa de modo conciso tanto a sucessão quanto o exercício do reinado.
- source_word: ἔταξεν
  choice: nomeou
  rationale: No contexto administrativo, indica uma designação formal para uma função.
- source_word: ἐπὶ πᾶσαν τὴν ἐκλογιστείαν
  choice: responsável por todas as contas
  rationale: Comunica claramente a supervisão das funções contábeis; “responsável por” evita uma construção rígida com “sobre”.
- source_word: διοίκησιν
  choice: administração
  rationale: Designa a esfera administrativa mais ampla, em paralelo com a responsabilidade específica pelas contas.
- source_word: Σαχερδονός / Ἀχιάχαρον / Ἀναήλ
  choice: Saquerdonos / Aquiacharos / Anael
  rationale: Os nomes seguem formas transliteradas do testemunho grego, adaptadas à leitura portuguesa, sem substituição silenciosa por formas históricas mais conhecidas.
theological_decisions:
- issue: Formas de nomes pessoais conhecidas por outras tradições bíblicas ou históricas
  choice: 'Manter no texto principal transliterações baseadas no grego: Saquerdonos e Aquiacharos'
  alternative: Empregar as formas históricas mais conhecidas, como Esar-Hadom e Aicar/Ahikar
  rationale: A decisão preserva o testemunho grego utilizado como fonte e evita harmonização silenciosa; notas informam as equivalências usuais.
- issue: Relação genealógica em τὸν Ἀναὴλ υἱὸν τοῦ ἀδελφοῦ μου
  choice: “filho de Anael, filho do meu irmão”
  alternative: “filho de Anael, meu sobrinho” ou “filho de Anael, meu irmão”
  rationale: 'A construção mantém explícita a cadeia genealógica do grego: Aquiacharos era filho de Anael, e Anael era filho do irmão de Tobit. Assim, evita-se identificar Anael como irmão de Tobit.'
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluida. “Montes de Ararate” conserva o plural do grego. A repetição “filho de Anael, filho do meu irmão” é deliberada para preservar com precisão a genealogia, embora seja menos compacta que uma paráfrase.
