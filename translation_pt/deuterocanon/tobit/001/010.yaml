base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/010.yaml
  text: And when we were taken captive to Nineveh[a], all my brothers and those of my kindred ate from the bread of the Gentiles;
translation:
  language: pt
  text: Quando fomos levados cativos para Nínive, todos os meus irmãos e os da minha parentela comiam dos pães dos gentios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos alimentos dos gentios». O grego diz literalmente «dos pães dos gentios», expressão que pode designar as provisões alimentares em geral.'
    reason: alternativa lexical e esclarecimento do idioma grego
lexical_decisions:
- source_word: ᾐχμαλωτίσθημεν
  choice: fomos levados cativos
  rationale: Preserva a voz passiva e a natureza forçada do cativeiro, com formulação natural e digna em português.
- source_word: εἰς Νινευή
  choice: para Nínive
  rationale: Com verbo de movimento, εἰς indica naturalmente o destino; «para Nínive» é idiomático em português.
- source_word: πάντες οἱ ἀδελφοί μου
  choice: todos os meus irmãos
  rationale: Traduz diretamente o masculino plural ἀδελφοί e mantém a distinção em relação ao grupo familiar mais amplo mencionado a seguir.
- source_word: οἱ ἐκ τοῦ γένους
  choice: os da minha parentela
  rationale: Exprime o grupo de parentesco ou linhagem indicado por γένος sem recorrer ao termo moderno e potencialmente enganoso «raça».
- source_word: ἤσθιον
  choice: comiam
  rationale: O imperfeito português reproduz bem o aspecto durativo ou habitual do imperfeito grego.
- source_word: ἐκ τῶν ἄρτων τῶν ἐθνῶν
  choice: dos pães dos gentios
  rationale: Conserva a imagem concreta e o plural do grego, ao mesmo tempo que «gentios» comunica o contraste entre israelitas e não israelitas no contexto.
theological_decisions:
- issue: Força étnico-religiosa de ἐθνῶν
  choice: gentios
  alternative: nações
  rationale: No contexto judaico do exílio de Tobit, o termo contrasta israelitas com não israelitas e traz possíveis implicações alimentares e religiosas; «gentios» preserva melhor essa força.
- issue: Explicitação da preocupação alimentar
  choice: Não acrescentar «impuros» ao texto principal
  alternative: alimentos impuros dos gentios
  rationale: A cláusula grega não qualifica expressamente esses alimentos como impuros. Essa implicação deve permanecer contextual, sem ser introduzida como afirmação explícita do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Parentela» mantém um tom narrativo moderadamente formal; «comiam» preserva o valor habitual do imperfeito. O plural «pães» foi mantido para refletir de perto o grego, e a nota explica seu sentido mais amplo.
