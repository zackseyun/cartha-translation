base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/003.yaml
  text: I[a], Tobit, walked in the ways of truth and righteousness all the days of my life[b], and I did many acts of mercy for my brothers and for my people who went with me into the land of the Assyrians, to Nineveh.
translation:
  language: pt
  text: Eu, Tobit, andei nos caminhos da verdade e da justiça todos os dias da minha vida e pratiquei muitas obras de misericórdia para com meus irmãos[a] e meu povo, que foram comigo[b] para a terra dos assírios, para Nínive.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meus irmãos” provavelmente se refere de modo amplo aos parentes ou compatriotas israelitas de Tobit, e não apenas a irmãos do sexo masculino.
    reason: lexical_alternative
  - marker: b
    text: O grego também pode ser entendido como “que tinham ido adiante comigo”. A formulação é incomum e pode preservar uma nuance de precedência na ida à Assíria.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὁδοῖς ἀληθείας
  choice: nos caminhos da verdade
  rationale: Preserva a metáfora plural de conduta presente no grego e soa natural no registro bíblico moderno.
- source_word: ἐπορευόμην
  choice: andei
  rationale: Expressa o modo de vida e mantém a metáfora ética bíblica, sem reduzir o verbo a mero deslocamento.
- source_word: δικαιοσύνῃ
  choice: da justiça
  rationale: Neste paralelismo ético, 'justiça' comunica uma vida reta e fiel; o contexto impede que seja entendido apenas em sentido judicial.
- source_word: ἐλεημοσύνας πολλὰς ἐποίησα
  choice: pratiquei muitas obras de misericórdia
  rationale: Mantém a forma plural e a amplitude possível de ἐλεημοσύνη, que pode designar tanto esmolas quanto outros atos concretos de misericórdia.
- source_word: τοῖς ἀδελφοῖς μου
  choice: meus irmãos
  rationale: Traduz diretamente o masculino plural grego, embora no contexto provavelmente designe parentes ou compatriotas israelitas em sentido amplo.
- source_word: τῷ ἔθνει
  choice: meu povo
  rationale: É a formulação portuguesa mais natural para o vínculo étnico-nacional expresso no contexto.
- source_word: τοῖς προπορευθεῖσιν μετʼ ἐμοῦ
  choice: que foram comigo
  rationale: Comunica a ida conjunta ao exílio de modo natural. O particípio pode sugerir precedência no movimento, nuance preservada em nota.
- source_word: εἰς χώραν Ἀσσυρίων
  choice: para a terra dos assírios
  rationale: Reflete de perto a construção grega e conserva a referência ao território do povo assírio.
- source_word: εἰς Νινευή
  choice: para Nínive
  rationale: Forma idiomática portuguesa para indicar o destino urbano.
theological_decisions:
- issue: Sentido de δικαιοσύνη na autodescrição ética de Tobit
  choice: justiça
  alternative: retidão
  rationale: Em português bíblico corrente, 'justiça' preserva a ligação lexical e a dimensão moral-religiosa do termo. 'Retidão' explicitria mais diretamente o caráter pessoal, mas estreitaria uma palavra que também pode abranger conduta justa.
- issue: Amplitude de ἐλεημοσύνη
  choice: obras de misericórdia
  alternative: esmolas
  rationale: A expressão grega pode indicar especificamente a prática de dar esmolas, mas também comporta um sentido mais amplo. O texto principal preserva essa amplitude, e a alternativa específica é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência bíblica. A tradução segue prioritariamente o grego da LXX. A amplitude de 'obras de misericórdia' foi mantida; embora uma nota sobre 'esmolas' fosse lexicalmente possível, os dois marcadores disponíveis foram usados para esclarecer 'irmãos' e a construção incomum do particípio. O nome foi mantido como 'Tobit', de acordo com a identificação do livro e do personagem.
