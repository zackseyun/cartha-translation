base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/006.yaml
  text: But I alone would often go to Jerusalem for the feasts[a], as it is written for all Israel in an everlasting ordinance[b], bringing the firstfruits and the tithes of the produce and the first shearings.
translation:
  language: pt
  text: Somente eu, porém, costumava ir a Jerusalém por ocasião das festas, conforme está escrito para todo o Israel num decreto perpétuo, levando as primícias, os dízimos da produção e as primícias da tosquia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O raro termo grego traduzido por “primícias da tosquia” provavelmente se refere à primeira porção obtida ao tosquiar os animais; alguns o entendem de modo mais geral como as primeiras contribuições provenientes dos rebanhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος
  choice: Somente eu
  rationale: Preserva a ênfase contrastiva de que Tobit era o único a agir assim, sem sugerir apenas que viajava desacompanhado.
- source_word: ἐπορευόμην πλεονάκις
  choice: costumava ir
  rationale: O imperfeito com πλεονάκις descreve uma ação habitual e repetida no passado; em português, “costumava ir” expressa esse valor com naturalidade.
- source_word: ἐν Ἱεροσολύμοις
  choice: a Jerusalém
  rationale: Embora o grego empregue ἐν com o nome da cidade, o verbo de deslocamento e o contexto indicam destino; “ir a Jerusalém” é a construção portuguesa natural.
- source_word: ταῖς ἑορταῖς
  choice: por ocasião das festas
  rationale: Refere-se às festas de Israel e, neste contexto, às ocasiões em que Tobit ia a Jerusalém. A formulação evita a impressão de que ele permanecia ali de modo indefinido.
- source_word: καθὼς γέγραπται
  choice: conforme está escrito
  rationale: Mantém a fórmula que apela à autoridade de uma prescrição escrita.
- source_word: ἐν προστάγματι αἰωνίῳ
  choice: num decreto perpétuo
  rationale: πρόσταγμα designa uma determinação autoritativa, e αἰώνιος, nesta fórmula legal, ressalta sua validade duradoura. “Decreto perpétuo” preserva o registro bíblico sem ampliar a afirmação.
- source_word: ἀπαρχάς
  choice: as primícias
  rationale: É o termo cultual corrente para a primeira parte da produção consagrada a Deus.
- source_word: δεκάτας τῶν γενημάτων
  choice: os dízimos da produção
  rationale: Traduz a décima parte devida e mantém γενήματα abrangente, sem restringi-lo a uma cultura agrícola específica.
- source_word: προκουρίας
  choice: as primícias da tosquia
  rationale: O termo grego é raro, mas provavelmente designa a primeira porção obtida da tosquia dos animais; a tradução comunica esse sentido provável e a nota preserva a incerteza.
- source_word: ἔχων
  choice: levando
  rationale: O particípio indica que Tobit ia com essas ofertas em mãos; “levando” expressa de modo claro sua função circunstancial.
theological_decisions:
- issue: Natureza da obediência de Tobit
  choice: O versículo apresenta Tobit como observante pessoal das obrigações de Israel relativas às festas e ofertas ligadas a Jerusalém.
  alternative: Entender a passagem apenas como uma descrição geral de sua piedade.
  rationale: A referência explícita ao que está escrito para todo o Israel e a enumeração concreta das ofertas apontam para observância da prescrição, não apenas para devoção genérica.
- issue: Alcance de αἰώνιος na fórmula legal
  choice: perpétuo
  alternative: eterno; permanente
  rationale: “Perpétuo” reproduz adequadamente a linguagem de duração contínua própria de uma determinação legal, sem impor ao termo uma definição filosófica que o contexto não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Somente eu, porém” conserva o contraste enfático; “costumava ir” comunica o aspecto habitual; e a incerteza do termo raro προκουρίας é mantida em nota, sem ser resolvida silenciosamente.
