lexical_decisions:
- source_word: καθότι
  choice: porque
  rationale: Introduz a causa do resultado ou favor mencionado no contexto anterior e preserva de modo natural o valor causal do grego.
- source_word: ἐμεμνήμην
  choice: me lembrava
  rationale: O imperfeito português comunica uma disposição contínua de ter Deus presente na memória, representando naturalmente o valor resultativo do perfeito grego no contexto, sem explicitar além do texto.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Mantém a regência idiomática de «lembrar-se de» em português e corresponde ao genitivo que funciona como objeto do verbo grego.
- source_word: ἐν ὅλῃ τῇ ψυχῇ μου
  choice: com toda a minha alma
  rationale: Expressa integralidade interior com linguagem bíblica natural e preserva o termo antropológico ψυχή sem reduzi-lo a «ser» ou «vida».
theological_decisions:
- issue: Força antropológica de ψυχή
  choice: alma
  alternative: ser inteiro
  rationale: «Alma» conserva o peso antropológico e devocional do termo grego, sem impor uma definição técnica de sua relação com o corpo.
