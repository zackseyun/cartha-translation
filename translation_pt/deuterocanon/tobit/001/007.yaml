base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/007.yaml
  text: And I would give them to the priests[a], the sons of Aaron, for the altar, from the produce; I would give the tenth to the sons of Levi who minister in Jerusalem[b], and I would sell the second tenth and go and spend it in Jerusalem each year.
translation:
  language: pt
  text: Eu as dava aos sacerdotes, filhos de Arão, para o altar, dentre os produtos da terra. Dava a décima parte[a] aos filhos de Levi que serviam em Jerusalém; e vendia a segunda décima parte[b], ia a Jerusalém e ali gastava o dinheiro, todos os anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode dizer “o dízimo” e “o segundo dízimo”. O grego diz literalmente “a décima parte” e “a segunda décima parte”.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “vendia” também pode ser entendido como a conversão da segunda décima parte em dinheiro antes da viagem a Jerusalém, onde o valor seria gasto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδουν
  choice: dava
  rationale: O imperfeito expressa uma prática habitual no passado; a sequência e a expressão “todos os anos” tornam esse valor reiterativo claro em português.
- source_word: αὐτὰς
  choice: as
  rationale: Mantém o pronome feminino plural do grego e sua referência ao que foi mencionado no contexto anterior, sem inserir um referente mais específico.
- source_word: τοῖς ἱερεῦσιν τοῖς υἱοῖς Ἀαρών
  choice: aos sacerdotes, os filhos de Arão
  rationale: Preserva explicitamente a aposição e a linhagem sacerdotal indicadas no grego.
- source_word: πρὸς τὸ θυσιαστήριον τῶν γενημάτων
  choice: para o altar, dentre os produtos da terra
  rationale: Conserva tanto a destinação ao altar quanto a origem agrícola das dádivas, respeitando a formulação grega condensada.
- source_word: τὴν δεκάτην
  choice: a décima parte
  rationale: Traduz literalmente a expressão grega, permanecendo clara em português; “dízimo” é registrado na nota como equivalente idiomático.
- source_word: τοῖς υἱοῖς Λευεὶ
  choice: aos filhos de Levi
  rationale: Mantém a forma explícita do grego, em vez de substituí-la por “aos levitas”.
- source_word: τοῖς θεραπεύουσιν εἰς Ἱερουσαλήμ
  choice: que serviam em Jerusalém
  rationale: No contexto cultual, o verbo descreve serviço religioso; “serviam” é natural e não acrescenta uma função além do texto.
- source_word: τὴν δευτέραν δεκάτην
  choice: a segunda décima parte
  rationale: Preserva a formulação literal e a distinção entre as duas porções mencionadas, sem impor no texto principal uma explicação legal específica.
- source_word: ἀπεπρατιζόμην
  choice: vendia
  rationale: O verbo indica venda ou alienação por venda; o contexto subsequente de viagem e gasto favorece essa tradução direta.
- source_word: ἐδαπάνων αὐτὰ
  choice: ali gastava o dinheiro
  rationale: Explicita de modo natural em português o valor obtido com a venda, sem alterar a sequência de ações indicada pelo grego.
- source_word: καθʼ ἕκαστον ἐνιαυτόν
  choice: todos os anos
  rationale: Expressão portuguesa corrente para a repetição distributiva anual do original.
theological_decisions:
- issue: Terminologia das porções destinadas ao culto
  choice: “a décima parte” e “a segunda décima parte” no texto principal
  alternative: “o dízimo” e “o segundo dízimo”
  rationale: A opção preserva a forma literal do grego e a distinção entre as porções, enquanto a nota oferece a terminologia religiosa habitual sem definir além do que o verso afirma.
- issue: Sentido de ἀπεπρατιζόμην
  choice: “vendia”
  alternative: “convertia em dinheiro”
  rationale: “Vendia” representa diretamente o sentido lexical, enquanto a possibilidade de conversão em dinheiro é explicada em nota para preservar a nuance contextual sem incorporá-la como interpretação exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a progressão do grego, mas usa pontuação e expressões naturais em português. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
