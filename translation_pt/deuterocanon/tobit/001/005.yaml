base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/005.yaml
  text: and all the tribes that had apostatized were sacrificing to Baal the heifer[a], including the house of my father[b], Naphtali.
translation:
  language: pt
  text: E todas as tribos que juntas se afastaram da fé ofereciam sacrifícios a Baal, a novilha[a], inclusive a casa de meu pai[b], Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Baal, o bezerro”. O grego emprega uma palavra para uma vaca jovem, ou novilha; a expressão provavelmente se refere à imagem bovina de culto associada à adoração no reino do norte de Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'A sintaxe grega no fim do versículo é condensada; literalmente: “e a casa de Naftali de meu pai”. O sentido parece ser que até a própria casa ancestral de Tobit estava entre os participantes.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσαι αἱ φυλαί
  choice: todas as tribos
  rationale: No contexto histórico de Israel, φυλαί designa as divisões tribais, e não apenas clãs ou famílias.
- source_word: αἱ συναποστᾶσαι
  choice: que juntas se afastaram da fé
  rationale: O particípio composto expressa uma deserção coletiva; no contexto imediato de culto a Baal, a deserção é religiosa. A formulação comunica isso em português corrente sem usar o menos acessível 'apostataram'.
- source_word: ἔθυον
  choice: ofereciam sacrifícios
  rationale: O imperfeito grego indica uma prática contínua ou habitual no passado.
- source_word: τῇ Βάαλ
  choice: a Baal
  rationale: O dativo identifica a divindade destinatária dos sacrifícios.
- source_word: τῇ δαμάλει
  choice: a novilha
  rationale: δαμάλις designa uma vaca jovem ou novilha; a aposição ao nome Baal é preservada, sem explicar no corpo do texto a relação exata com a imagem bovina.
- source_word: ὁ οἶκος Νεφθαλεὶμ τοῦ πατρός μου
  choice: inclusive a casa de meu pai, Naftali
  rationale: A sintaxe grega final é condensada. 'Inclusive' torna explícito que a própria linhagem ancestral de Tobit participou, enquanto a nota preserva a dificuldade formal.
theological_decisions:
- issue: Sentido religioso de συναποστᾶσαι
  choice: afastaram-se da fé
  alternative: revoltaram-se; apostataram
  rationale: O sacrifício a Baal mostra que a deserção é religiosa e pactual, embora o verbo também possa exprimir revolta ou defecção.
- issue: Identificação de τῇ δαμάλει
  choice: Baal, a novilha
  alternative: Baal, o bezerro; a imagem de novilha associada a Baal
  rationale: A tradução mantém a aposição incomum do grego e não decide silenciosamente se o termo funciona como título, descrição da imagem cultual ou alusão ao culto bovino do reino do norte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Casa' conserva o sentido bíblico de linhagem familiar; 'ofereciam sacrifícios' reproduz o aspecto habitual do imperfeito. As duas notas são marcadas no texto principal.
