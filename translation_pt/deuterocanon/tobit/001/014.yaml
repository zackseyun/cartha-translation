  text: I used to go to Media[a], and I deposited ten talents of silver with Gabael, the brother of Gabri[c][b], in Rages of Media.
translation:
  language: pt
  text: Eu costumava ir à Média[a] e depositei[b] dez talentos de prata com Gabael, irmão de Gabri, em Rages, na Média.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fui à Média”. O imperfeito grego pode indicar uma ação repetida ou habitual (“costumava ir”), mas também pode ser entendido, neste contexto, como referência a uma viagem.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “confiei dez talentos de prata a Gabael”. O verbo grego pode indicar que algo foi entregue aos cuidados de outra pessoa, aqui em sentido financeiro.'
    reason: lexical_alternative
  - marker: c
    text: O nome da cidade também pode ser transliterado como “Rhages”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορευόμην
  choice: Eu costumava ir
  rationale: O imperfeito grego pode indicar ação habitual ou repetida no passado; a formulação preserva esse valor aspectual sem excluir totalmente a possibilidade contextual de uma viagem específica.
- source_word: παρεθέμην
  choice: depositei
  rationale: No contexto de prata entregue a outra pessoa, o verbo descreve bens postos sob sua guarda; “depositei” comunica de modo conciso a natureza financeira da ação.
- source_word: ἀργυρίου
  choice: prata
  rationale: O grego nomeia explicitamente o metal, e não apenas dinheiro em sentido genérico.
- source_word: τάλαντα δέκα
  choice: dez talentos
  rationale: Mantém a antiga unidade de peso e valor sem uma conversão moderna especulativa.
- source_word: Γαβηλῷ
  choice: Gabael
  rationale: Transliteração corrente e natural em português do nome pessoal grego.
- source_word: τῷ ἀδελφῷ Γαβρίᾳ
  choice: irmão de Gabri
  rationale: Reproduz diretamente a relação de parentesco expressa pelo grego, com ordem natural em português.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: em Rages, na Média
  rationale: Identifica com clareza a cidade e a região, em português natural, preservando o topônimo tradicional.
