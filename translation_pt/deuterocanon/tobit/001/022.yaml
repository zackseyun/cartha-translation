base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/022.yaml
  text: And Ahiacharus interceded for me[a], and I came to Nineveh. Now Ahiacharus was the cupbearer, keeper of the signet ring, administrator, and accountant, and Sacherdonos appointed him second in rank. He was my cousin.
translation:
  language: pt
  text: E Aiachar intercedeu por mim, e eu vim para Nínive. Aiachar era o copeiro, o encarregado do anel-sinete, o administrador e o contador; e Saquerdono nomeou-o como segundo em autoridade.[a] Ele era meu primo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente uma expressão difícil, “filho do segundo”, geralmente entendida como indicação de que Aiachar ocupava a posição seguinte em autoridade, isto é, era o segundo em autoridade.
    reason: textual_variant
lexical_decisions:
- source_word: ἠξίωσεν ... περὶ ἐμοῦ
  choice: intercedeu por mim
  rationale: No contexto narrativo, a construção indica que Aiachar atuou em favor de Tobit; esta formulação é natural e não especifica indevidamente o procedimento na corte.
- source_word: ἦλθον εἰς Νινευήν
  choice: vim para Nínive
  rationale: Reproduz diretamente o movimento expresso por ἔρχομαι na narrativa em primeira pessoa, sem acrescentar explicitamente a ideia de retorno.
- source_word: οἰνοχόος
  choice: copeiro
  rationale: Título tradicional e claro para o oficial da corte encarregado de servir vinho ao rei.
- source_word: ἐπὶ τοῦ δακτυλίου
  choice: encarregado do anel de selar
  rationale: Torna explícita a função administrativa do anel real sem substituir a imagem concreta do grego por um título excessivamente interpretativo.
- source_word: διοικητής
  choice: administrador
  rationale: Expressa de modo amplo a gestão de assuntos da corte, sem restringir indevidamente o cargo.
- source_word: ἐκλογιστής
  choice: contador
  rationale: O termo se refere ao cálculo e à prestação de contas; “contador” comunica essa responsabilidade de modo conciso.
- source_word: κατέστησεν αὐτὸν
  choice: o nomeou
  rationale: Em contexto de função oficial, καθίστημι indica nomeação ou colocação em determinado posto.
- source_word: υἱὸς ἐκ δευτέρας
  choice: o segundo em autoridade
  rationale: A expressão grega é literalmente estranha e provavelmente designa uma posição imediatamente inferior à do rei; a tradução transmite o sentido provável, enquanto a nota preserva a dificuldade textual.
- source_word: ἐξάδελφός μου
  choice: meu primo
  rationale: ἐξάδελφος designa especificamente um primo, e não apenas um parente em sentido amplo.
