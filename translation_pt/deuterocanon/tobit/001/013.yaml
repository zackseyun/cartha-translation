translation:
  language: pt
  text: E o Altíssimo me concedeu favor e boa aparência[a] diante de Enemessar, e eu era o comprador dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «favor e boa posição». O grego μορφή pode indicar forma ou aparência exterior, mas seu sentido exato neste contexto da corte é incerto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «seu agente de compras». O grego diz literalmente «comprador», provavelmente referindo-se a um funcionário encarregado das aquisições.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: o Altíssimo
  rationale: Preserva o título divino corrente no uso bíblico, sem reduzi-lo ao termo genérico «Deus».
- source_word: χάριν
  choice: favor
  rationale: No contexto da corte, indica acolhimento ou consideração favorável por parte do rei; «favor» evita a carga teológica que «graça» poderia sugerir.
- source_word: μορφήν
  choice: boa aparência
  rationale: μορφή designa forma ou aparência exterior. «Boa aparência» mantém esse sentido concreto e deixa em nota a possibilidade contextual de boa posição ou prestígio.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Equivalente natural e conciso para presença ou consideração perante o soberano.
- source_word: Ἐνεμεσσάρου
  choice: Enemessar
  rationale: Translitera a forma do nome presente no testemunho grego, sem harmonizá-la com outro nome histórico.
- source_word: ἀγοραστής
  choice: comprador
  rationale: Reproduz o sentido básico do substantivo grego; a provável função oficial de abastecimento é indicada em nota.
theological_decisions:
- issue: Título divino ὁ ὕψιστος
  choice: o Altíssimo
  alternative: Deus
  rationale: A tradução conserva a força titular da expressão grega e seu uso judaico-bíblico.
- issue: Nuance de μορφήν no contexto da corte
  choice: boa aparência
  alternative: boa posição
  rationale: O sentido lexical mais direto se refere à forma ou aparência exterior, embora o contexto possa apontar para posição favorável; a ambiguidade é preservada em nota.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira. A ordem dos marcadores segue a ordem das expressões anotadas no texto: [a] após a questão de μορφήν e [b] após ἀγοραστής.'
