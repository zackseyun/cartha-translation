base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/004.yaml
  text: And when I was in my own country[a], in the land of Israel, while I was still young, the whole tribe of my father Naphtali fell away from the house of Jerusalem, which had been chosen from all the tribes of Israel for all the tribes to sacrifice there; and the temple, the dwelling place of the Most High[c][b], was consecrated and built for all generations.
translation:
  language: pt
  text: E quando eu estava em minha terra natal, na terra de Israel, ainda jovem, toda a tribo de meu antepassado Naftali se afastou da casa de Jerusalém[a], que havia sido escolhida dentre todas as tribos de Israel para que todas as tribos ali oferecessem sacrifícios; e o templo, a morada do Altíssimo, foi consagrado e construído para todas as gerações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego distingue aqui «a casa de Jerusalém» de «o templo» mencionado em seguida. A primeira expressão provavelmente se refere de modo mais amplo ao santuário de Jerusalém.
    reason: lexical_alternative
  - marker: b
    text: O texto grego preservado termina abruptamente com «para todas» (εἰς πάσας). A tradução supre «as gerações» para completar o sentido provável; por isso, a suplementação é indicada nesta nota.
    reason: textual_variant
lexical_decisions:
- source_word: χώρα
  choice: terra natal
  rationale: Em ἐν τῇ χώρᾳ μου, expressa de modo natural a terra de origem de Tobit; a expressão seguinte, «na terra de Israel», a identifica.
- source_word: νεωτέρου μου ὄντος
  choice: ainda jovem
  rationale: Reproduz de maneira concisa e idiomática a indicação temporal do genitivo absoluto.
- source_word: ἀπέστη
  choice: se afastou
  rationale: Comunica abandono ou defecção religiosa sem impor o termo técnico e mais carregado «apostatou».
- source_word: τοῦ Νεφθαλεὶμ τοῦ πατρός μου
  choice: de meu antepassado Naftali
  rationale: Aqui πατήρ designa o ancestral tribal, não o pai imediato de Tobit; «antepassado» evita uma leitura familiar equivocada.
- source_word: οἶκος Ἱεροσολύμων
  choice: casa de Jerusalém
  rationale: Mantém a expressão distinta de ναός, mencionado depois como «templo», sem identificar silenciosamente os dois termos.
- source_word: ἐκλεγείσης
  choice: havia sido escolhida
  rationale: Conserva a voz passiva e a anterioridade da escolha no relato retrospectivo; o feminino remete naturalmente à casa.
- source_word: εἰς τὸ θυσιάζειν πάσαις ταῖς φυλαῖς
  choice: para que todas as tribos ali oferecessem sacrifícios
  rationale: Expressa a finalidade e torna explícito o valor locativo implícito do santuário escolhido.
- source_word: ναός
  choice: templo
  rationale: É a equivalência corrente e específica no contexto do santuário de Jerusalém.
- source_word: κατασκήνωσις
  choice: morada
  rationale: Preserva a ideia da habitação divina sem introduzir «tabernáculo», que poderia sugerir outra estrutura cultual.
- source_word: ὑψίστου
  choice: Altíssimo
  rationale: Título divino tradicional, claro e digno em português contemporâneo.
- source_word: ἡγιάσθη
  choice: foi consagrado
  rationale: Indica que o templo foi separado para uso santo, em formulação natural no contexto cultual.
- source_word: ᾠκοδομήθη
  choice: foi ... construído
  rationale: Mantém o sentido arquitetônico direto do verbo.
- source_word: εἰς πάσας
  choice: para todas as gerações
  rationale: O texto grego preservado termina de forma incompleta; «gerações» é uma suplementação contextual plausível, assinalada em nota.
theological_decisions:
- issue: Afastamento da tribo de Naftali do culto em Jerusalém
  choice: se afastou
  alternative: apostatou; rebelou-se; abandonou
  rationale: Preserva a gravidade religiosa da separação sem transformar o verbo em terminologia doutrinária técnica nem especificar além do grego.
- issue: Jerusalém como lugar escolhido para os sacrifícios de Israel
  choice: que havia sido escolhida dentre todas as tribos de Israel para que todas as tribos ali oferecessem sacrifícios
  alternative: escolhida de todas as tribos para o sacrifício de todas
  rationale: Mantém tanto a eleição do santuário central quanto a abrangência de todas as tribos, sem acrescentar uma explicação teológica.
- issue: Morada do Altíssimo
  choice: o templo, a morada do Altíssimo
  alternative: o templo da habitação do Altíssimo; o tabernáculo do Altíssimo
  rationale: Conserva a afirmação da presença divina associada ao templo e também a tensão da construção grega, sem importar uma distinção denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Evitou-se «pátria» por possível tom político e «apostatou» por seu caráter técnico. A ordem da frase acompanha o fluxo narrativo grego sem sacrificar a naturalidade.
