base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/001.yaml
  text: The book of the words of Tobit son of Tobiel[a], son of Ananiel, son of Aduel, son of Gabael, from the seed of Asiel, from the tribe of Naphtali[b],
translation:
  language: pt
  text: Livro das palavras de Tobit[a], filho de Tobiel, filho de Ananiel, filho de Aduel, filho de Gabael[b], da linhagem de Asiel, da tribo de Naftali,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente «Livro das palavras», uma fórmula solene de título. Também se poderia traduzir por «registro» ou «relato».
    reason: lexical_alternative
  - marker: b
    text: Neste ponto, o nome do antepassado apresenta uma forma grega difícil. Alguns testemunhos e tradições secundárias refletem formas próximas de «Gabiel» ou «Bagabael».
    reason: alternative_reading
lexical_decisions:
- source_word: ΒΙΒΛΟΣ λόγων
  choice: Livro das palavras
  rationale: Preserva a fórmula grega de título e seu provável sabor semítico. Embora «relato» ou «registro» fossem mais idiomáticos, comprimiriam a expressão e eliminariam sua forma característica.
- source_word: Τωβείτ
  choice: Tobit
  rationale: Translitera a forma grega e mantém a distinção entre Tobit e seu pai, Tobiel; usar «Tobias» para ambos poderia obscurecer a genealogia.
- source_word: τοῦ Τωβιὴλ τοῦ Ἀνανιὴλ τοῦ Ἀδουὴλ τοῦ ΒαΓαβαήλ
  choice: filho de Tobiel, filho de Ananiel, filho de Aduel, filho de Gabael
  rationale: Os genitivos sucessivos indicam filiação. Explicitar «filho de» produz uma genealogia clara e natural em português. «Gabael» normaliza uma forma grega textualmente difícil.
- source_word: ἐκ τοῦ σπέρματος Ἀσιήλ
  choice: da linhagem de Asiel
  rationale: σπέρμα significa literalmente «semente», mas aqui designa descendência. «Linhagem» comunica o sentido genealógico com naturalidade sem alterar a relação expressa.
- source_word: ἐκ τῆς φυλῆς Νεφθαλείμ
  choice: da tribo de Naftali
  rationale: «Tribo» é o equivalente genealógico direto de φυλή, e «Naftali» é a forma bíblica portuguesa corrente do nome.
