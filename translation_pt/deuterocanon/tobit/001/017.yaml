  text: I gave my bread to the hungry and clothing to the naked[a], and if I saw any of my kin dead and thrown behind the wall of Nineveh, I buried him.
translation:
  language: pt
  text: Eu dava do meu pão aos famintos e roupas aos que não tinham o que vestir; e, quando via alguém dos meus morto e jogado atrás da muralha de Nínive[a], eu o sepultava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fora da muralha de Nínive”. O grego diz “atrás da muralha de Nínive”, expressão que pode descrever corpos lançados para fora da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ἄρτους μου
  choice: do meu pão
  rationale: O plural grego significa literalmente “meus pães”, mas “do meu pão” é mais natural em português no contexto de repartir alimento e preserva o possessivo.
- source_word: ἐδίδουν
  choice: Eu dava
  rationale: O imperfeito exprime adequadamente uma prática habitual; o imperfeito português conserva esse aspecto.
- source_word: τοῖς πεινῶσιν
  choice: aos famintos
  rationale: Tradução direta e idiomática do particípio substantivado.
- source_word: ἱμάτια τοῖς γυμνοῖς
  choice: roupas aos que não tinham o que vestir
  rationale: No contexto de assistência, γυμνοῖς pode indicar pessoas nuas ou sem vestuário adequado. A formulação é natural, evita uma expressão potencialmente ambígua em português e não restringe indevidamente o sentido à nudez absoluta.
- source_word: ἐκ τοῦ γένους μου
  choice: do meu povo
  rationale: γένος pode designar parentesco, linhagem ou grupo étnico. “Do meu povo” preserva aqui a abrangência comunitária, embora possa também incluir parentes; a ambiguidade é registrada na decisão teológica.
- source_word: ἐθεώρουν
  choice: via
  rationale: O imperfeito português conserva a ação recorrente expressa pelo imperfeito grego.
- source_word: τεθνηκότα καὶ ἐρριμμένον
  choice: morto e jogado
  rationale: Mantém os dois particípios e comunica tanto a morte quanto o tratamento indigno dado ao corpo.
- source_word: ὀπίσω τοῦ τείχους Νινευή
  choice: atrás da muralha de Nínive
  rationale: Reproduz de perto ὀπίσω com genitivo sem decidir silenciosamente se o lugar era especificamente fora da cidade.
- source_word: ἔθαπτον αὐτόν
  choice: eu o sepultava
  rationale: O imperfeito indica a prática habitual de Tobit; “sepultava” é digno, claro e fiel ao verbo.
theological_decisions:
- issue: Alcance de γένος μου
  choice: do meu povo
  alternative: da minha parentela; da minha família
  rationale: O termo pode abranger parentes de sangue ou o grupo étnico de Tobit. “Meu povo” mantém o alcance relativamente amplo do contexto, sem excluir parentesco; as alternativas explicitam a possível leitura mais estreita.
- issue: Localização expressa por ὀπίσω τοῦ τείχους
  choice: atrás da muralha de Nínive
  alternative: fora da muralha de Nínive
  rationale: A expressão pode descrever corpos lançados para além da muralha, mas o grego diz literalmente “atrás da muralha”. O texto preserva a imagem e a nota informa a interpretação contextual possível.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Os imperfeitos “dava”, “via” e “sepultava” preservam claramente o caráter habitual das ações. A formulação evita arcaísmos e mantém sem resolução indevida a ambiguidade espacial da expressão grega.
