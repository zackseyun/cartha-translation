base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/011.yaml
  text: But I kept watch over myself so as not to eat[b][a],
translation:
  language: pt
  text: Eu, porém, me guardei de comer[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: «guardei a minha alma para não comer». Aqui, «a minha alma» é uma forma idiomática de dizer «a mim mesmo».'
    reason: lexical_alternative
  - marker: b
    text: O texto grego preservado aqui é breve e parece prosseguir na oração seguinte; o sentido é que Tobit decidiu deliberadamente não comer.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Eu, porém
  rationale: δέ assinala contraste moderado com a conduta mencionada no contexto; «porém» preserva esse contraste sem torná-lo excessivamente forte.
- source_word: συνετήρησα
  choice: vigiei
  rationale: O verbo composto comunica a ideia de guardar atentamente ou manter sob vigilância. Com o objeto reflexivo e o infinitivo, expressa autocontrole deliberado, preservado aqui sem reduzir a expressão simplesmente a «evitei».
- source_word: τὴν ψυχήν μου
  choice: a mim mesmo
  rationale: Embora literalmente signifique «a minha alma», neste contexto ψυχή funciona de maneira idiomática e reflexiva, referindo-se à própria pessoa de Tobit.
- source_word: μὴ φαγεῖν
  choice: para não comer
  rationale: O infinitivo negativo indica a finalidade do ato de vigiar-se e mantém a formulação breve do grego.
theological_decisions:
- issue: Força antropológica de ψυχή em τὴν ψυχήν μου
  choice: Expressão reflexiva («a mim mesmo»), e não afirmação doutrinária distinta sobre a alma
  alternative: 'Tradução literal: «a minha alma»'
  rationale: A frase descreve a vigilância moral de Tobit em relação ao alimento, sem formular uma doutrina sobre a distinção entre corpo e alma. A tradução idiomática evita importar uma afirmação teológica que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «vigiei a mim mesmo» conserva a imagem de cuidadosa autovigilância presente no grego, enquanto «para não comer» mantém a brevidade e a ligação com a oração seguinte. A ordem dos marcadores [b][a] acompanha a camada inglesa auditada.
