  text: And when Enemessar died[a], Achreil his son became king in his place, and his roads became unsafe[b], and I was no longer able to go into Media.
translation:
  language: pt
  text: Quando Enemessar morreu[a], seu filho Acreil tornou-se rei em seu lugar, e suas estradas ficaram inseguras[b]; então já não pude viajar para a Média.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste testemunho grego, os nomes reais aparecem como Enemessar e Acreil. Outras tradições textuais de Tobit preservam grafias diferentes e, em alguns casos, nomes diferentes.
    reason: textual_variant
  - marker: b
    text: O verbo grego traduzido como “ficaram inseguras” é difícil e aparece numa forma incomum. Pelo contexto da viagem, o sentido parece ser que as rotas ficaram desordenadas ou inseguras, de modo que Tobit já não pôde viajar para a Média.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Equivalente narrativo direto e natural, sem eufemismo.
- source_word: ἐβασίλευσεν
  choice: tornou-se rei
  rationale: O aoristo, no contexto da morte do antecessor, indica a ascensão de Acreil ao trono.
- source_word: ἀντʼ αὐτοῦ
  choice: em seu lugar
  rationale: Expressa de modo idiomático a substituição na sucessão real.
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: as estradas sob seu domínio
  rationale: O contexto exige o sentido concreto de estradas ou rotas; a formulação esclarece que o pronome se refere provavelmente às vias controladas pelo novo rei, sem afirmar propriedade pessoal.
- source_word: ἠκαταστάτησαν
  choice: ficaram inseguras
  rationale: A forma grega é incomum e difícil, mas o contexto aponta para desordem ou insegurança que impedia a viagem; a escolha comunica o efeito prático sem dizer que as vias ficaram fisicamente intransitáveis.
- source_word: οὐκέτι ἠδυνάσθην
  choice: eu já não pude
  rationale: Reproduz de forma concisa tanto a incapacidade quanto a cessação temporal.
- source_word: πορευθῆναι εἰς τὴν Μηδείαν
  choice: viajar para a Média
  rationale: Português natural que preserva o deslocamento em direção à região da Média.
