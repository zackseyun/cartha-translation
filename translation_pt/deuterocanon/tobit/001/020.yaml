  text: And all my possessions were plundered[a], and nothing was left to me except Anna my wife and Tobit my son.
translation:
  language: pt
  text: Todos os meus bens foram saqueados, e nada me restou além de Ana, minha mulher, e Tobit, meu filho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção grega indica quem permaneceu com o narrador depois que seus bens foram levados; não implica que sua mulher e seu filho fossem posses.
    reason: lexical_alternative
lexical_decisions:
- source_word: διηρπάγη
  choice: foram saqueados
  rationale: O verbo passivo expressa a tomada violenta dos bens por outras pessoas; “foram saqueados” conserva a ideia de despojo e soa natural em português.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: todos os meus bens
  rationale: A expressão abrange o conjunto dos recursos e propriedades materiais do narrador. “Todos os meus bens” é claro, corrente e preserva a totalidade indicada por πάντα.
- source_word: οὐ κατελείφθη μοι οὐδέν
  choice: nada me restou
  rationale: A formulação idiomática em português mantém a ênfase negativa e o sentido de que nada material permaneceu com o narrador.
- source_word: πλὴν
  choice: além de
  rationale: 'Marca naturalmente a exceção: embora os bens tenham sido levados, a esposa e o filho permaneceram com ele.'
- source_word: Ἄννας
  choice: Ana
  rationale: Emprega a forma portuguesa corrente do nome grego Ἄννα, amplamente reconhecida pelos leitores.
- source_word: Τωβεὶτ
  choice: Tobeit
  rationale: Reproduz mais de perto a forma grega específica Τωβεὶτ e evita substituí-la silenciosamente pela forma tradicional portuguesa “Tobias”.
theological_decisions:
- issue: A inclusão da esposa e do filho após a perda dos bens pode ser lida como se eles fossem propriedades.
  choice: Manter a estrutura de exceção do grego e esclarecer seu sentido em nota.
  alternative: Reformular como “somente minha mulher e meu filho permaneceram comigo”.
  rationale: A redação preserva a forma e a tensão do texto-fonte sem dar a entender que Ana e Tobeit faziam parte dos bens saqueados.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. “Minha mulher” traduz literalmente a relação expressa no grego e é natural em português amplo; “esposa” também seria possível. O nome do filho segue de perto a forma grega Tobeit, em vez da forma tradicional Tobias.
