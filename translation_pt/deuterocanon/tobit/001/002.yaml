base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/002.yaml
  text: who was taken captive in the days of Enemessaros king of the Assyrians[a], from Thisbe, which is to the south of Kedesh of Naphtali in Galilee[b], above Asher.
translation:
  language: pt
  text: o qual foi levado cativo, nos dias de Enemessaro, rei dos assírios[a], de Tisbe, que fica à direita de Cídio de Naftali, na Galileia, acima de Aser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns identificam Enemessaro com o rei assírio Salmaneser, mas o texto grego traz aqui a forma transliterada “Enemessaro”.
    reason: alternative_reading
  - marker: b
    text: As indicações geográficas deste versículo são difíceis e podem refletir incerteza textual ou geográfica. “Cídio” talvez designe um lugar identificado de outra maneira; por isso, “à direita de” e “acima de Aser” foram mantidos de modo relativamente literal, sem serem convertidos em direções cardeais.
    reason: cultural_note
lexical_decisions:
- source_word: ᾐχμαλωτεύθη
  choice: foi levado cativo
  rationale: Expressa a ação passiva e forçada de ser conduzido ao cativeiro, sem ampliar o sentido para o conceito mais geral de exílio.
- source_word: ἐν ἡμέραις
  choice: nos dias de
  rationale: Mantém a expressão temporal do grego em formulação portuguesa clara e digna.
- source_word: Ἐνεμεσσαάρου
  choice: Enemessaro
  rationale: Translitera a forma grega atestada, sem harmonizá-la com a identificação histórica possível, mas incerta, com Salmaneser.
- source_word: ἐκ Θίσβης
  choice: de Tisbe
  rationale: Indica a procedência geográfica de modo natural em português.
- source_word: ἐκ δεξιῶν
  choice: à direita de
  rationale: Preserva a imagem espacial do grego e evita convertê-la numa direção cardeal incerta.
- source_word: Κυδίως
  choice: Cídio
  rationale: Translitera o topônimo obscuro presente no texto grego, sem substituí-lo pela identificação conjectural com Quedes.
- source_word: τῆς Νεφθαλεὶμ
  choice: de Naftali
  rationale: Conserva a relação genitiva entre o local e a região tribal.
- source_word: ἐν τῇ Γαλειλαίᾳ
  choice: na Galileia
  rationale: É a forma geográfica corrente e natural em português.
- source_word: ὑπεράνω Ἀσήρ
  choice: acima de Aser
  rationale: Mantém a expressão espacial ambígua do grego, sem interpretá-la automaticamente como 'ao norte de'.
