lexical_decisions:
- source_word: ἐγένετο
  choice: houve
  rationale: Expressa de modo natural em português o uso existencial de γίνομαι, apresentando o estado resultante de alegria.
- source_word: χαρὰ
  choice: alegria
  rationale: Equivalente corrente e digno para o substantivo abstrato singular.
- source_word: πᾶσι
  choice: todos
  rationale: Preserva a abrangência do dativo plural.
- source_word: τοῖς ἐν Νινευὴ
  choice: em Nínive
  rationale: Mantém de forma concisa o sentido locativo da expressão grega.
- source_word: ἀδελφοῖς αὐτοῦ
  choice: seus irmãos
  rationale: Reproduz literalmente o masculino plural grego; o possível sentido mais amplo de parentesco é registrado em nota.
- source_word: παρεγένετο
  choice: chegou
  rationale: Verbo narrativo natural para indicar a chegada ou o comparecimento de Aicar.
- source_word: Ἀχιάχαρος
  choice: Aicar
  rationale: Forma portuguesa clara e reconhecível do nome, baseada na forma grega.
- source_word: Νασβὰς
  choice: Nasbas
  rationale: Translitera diretamente a forma do nome no texto grego de Swete.
- source_word: ὁ ἐξάδελφος αὐτοῦ
  choice: seu primo
  rationale: ἐξάδελφος designa especificamente um primo, favorecendo o termo preciso em vez de um genérico como parente.
theological_decisions:
- issue: Alcance de ἀδελφοῖς αὐτοῦ
  choice: seus irmãos
  alternative: seus parentes; sua parentela
