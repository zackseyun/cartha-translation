base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/010.yaml
  text: “From now on I can die.” And both of them wept. Then Tobit went out toward the door and stumbled[a], but his son ran to him,
translation:
  language: pt
  text: “Agora já posso morrer.”[a] E os dois choraram. Então Tobit saiu em direção à porta e tropeçou, mas seu filho correu até ele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “De agora em diante, morrerei”. É uma maneira de dizer que seu desejo se realizou e que ela está pronta para morrer em paz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν ἀποθανοῦμαι
  choice: Agora já posso morrer
  rationale: A formulação natural em português comunica que, depois de ver seu desejo realizado, a pessoa está pronta para morrer em paz. O advérbio “já” reforça esse sentido sem transformar a fala em previsão de morte imediata.
- source_word: ἔκλαυσαν ἀμφότεροι
  choice: os dois choraram
  rationale: Expressa com clareza que ambas as pessoas choraram; “choraram” é corrente, digno e adequado tanto à alegria quanto à forte emoção da cena.
- source_word: ἐξήρχετο πρὸς τὴν θύραν
  choice: saiu em direção à porta
  rationale: Mantém o movimento de Tobit para fora e preserva a nuance direcional de πρός com acusativo, em português narrativo natural.
- source_word: προσεκόπτεν
  choice: tropeçou
  rationale: Traduz diretamente o sentido de bater contra um obstáculo ou tropeçar, adequado à condição de Tobit no contexto.
- source_word: προσέδραμεν αὐτῷ
  choice: correu até ele
  rationale: Reproduz de modo claro e natural o movimento rápido do filho em direção a Tobit.
theological_decisions:
- issue: Valor idiomático de ἀποθανοῦμαι
  choice: Agora já posso morrer
  alternative: De agora em diante, morrerei
  rationale: No contexto do reencontro, a fala exprime desejo realizado e prontidão para morrer em paz, não necessariamente uma previsão de morte iminente. A nota preserva a forma mais literal.
- issue: Continuidade do sujeito narrativo
  choice: Tobit é quem sai em direção à porta e tropeça
  alternative: Seguir variantes de recensões mais longas nos detalhes da cena
  rationale: A tradução segue o texto grego de Swete fornecido, sem harmonizá-lo com outras formas textuais da narrativa.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A fala inicial foi vertida idiomaticamente, enquanto a alternativa mais formal foi preservada em nota. A coordenação final usa “mas” para tornar natural o contraste narrativo entre o tropeço de Tobit e a rápida reação do filho.
