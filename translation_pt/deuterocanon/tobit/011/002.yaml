base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/002.yaml
  text: And Raphael said to Tobiah[a], “Do you not know, brother, how you left your father?”
translation:
  language: pt
  text: 'Então Rafael disse a Tobias[a]: “Irmão, você não sabe como deixou seu pai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Irmão, você não se lembra em que condição deixou seu pai?” A tradição semítica paralela explicita a cegueira do pai, mas o texto grego se expressa de modo mais breve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γινώσκεις
  choice: você não sabe
  rationale: Mantém o sentido básico de γινώσκω e, no contexto, permite a nuance de recordar ou ter consciência da condição do pai.
- source_word: ἀδελφέ
  choice: Irmão
  rationale: Preserva literalmente o vocativo e seu tom afetuoso, sem presumir parentesco biológico.
- source_word: πῶς ἀφῆκες
  choice: como deixou
  rationale: Reproduz a formulação breve e aberta do grego; aqui, πῶς pode aludir à condição em que Tobias deixou o pai, sem explicitá-la.
- source_word: τὸν πατέρα σου
  choice: seu pai
  rationale: Equivalência direta e natural em português.
- source_word: Ῥαφαὴλ πρὸς Τωβείαν
  choice: Rafael disse a Tobias
  rationale: Tradução natural da fórmula de fala grega, mantendo os nomes em suas formas portuguesas tradicionais.
theological_decisions:
- issue: Uso da tradição semítica paralela ao lado do texto grego
  choice: Manter no texto principal a pergunta concisa do grego, deixando implícita a condição do pai.
  alternative: “Você não se lembra em que condição deixou seu pai?” ou explicitar que o pai estava cego.
  rationale: O grego é a âncora primária e não menciona expressamente a cegueira neste versículo. A tradição semítica paralela esclarece a provável referência contextual, mas não deve substituir a formulação mais breve do texto grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “você” torna natural a pergunta direta; “Irmão” conserva o tratamento afetuoso do original. A ambiguidade de πῶς foi preservada no texto e esclarecida em nota.
