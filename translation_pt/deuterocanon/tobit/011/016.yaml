base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/016.yaml
  text: And Tobit went out to meet his daughter-in-law[a], rejoicing and blessing God, at the gate of Nineveh. And those who saw him walking were amazed[b], because he could see.
translation:
  language: pt
  text: E Tobit saiu ao encontro de sua nora[a], cheio de alegria e bendizendo a Deus, junto à porta de Nínive. Os que o viram caminhando ficaram admirados[b], porque ele podia ver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego também pode significar “noiva”; aqui se refere a Sara como nora de Tobit.
    reason: lexical_alternative
  - marker: b
    text: Neste ponto, o grego emprega a forma nominal Tōbeías, mas o contexto indica o pai, Tobit, pois as pessoas se admiram de que ele agora possa ver.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Verbo narrativo de movimento, traduzido de modo direto e natural.
- source_word: Τωβείας
  choice: Tobit
  rationale: Embora a forma grega seja Tōbeías, o contexto identifica o referente como o pai curado, pois as pessoas se admiram de que ele possa ver.
- source_word: εἰς συνάντησιν
  choice: ao encontro de
  rationale: Expressão idiomática portuguesa natural para a ação de sair a fim de receber alguém.
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: sua nora
  rationale: νύμφη pode significar noiva ou nora; neste contexto, Sara é a esposa do filho de Tobit.
- source_word: χαίρων
  choice: cheio de alegria
  rationale: Comunica naturalmente o estado alegre expresso pelo particípio, preservando sua relação com a ação principal.
- source_word: εὐλογῶν τὸν θεόν
  choice: bendizendo a Deus
  rationale: Mantém o sentido explícito de εὐλογέω e um registro bíblico digno, ainda compreensível no português atual.
- source_word: πρὸς τῇ πύλῃ Νινευή
  choice: junto à porta de Nínive
  rationale: A preposição indica localização junto ou perto da porta; esta formulação é natural e evita precisão espacial excessiva.
- source_word: ἐθαύμαζον
  choice: ficaram admirados
  rationale: Expressa de modo idiomático a reação dos observadores; o contexto narrativo permite o perfeito português sem perder a força do imperfeito grego.
- source_word: οἱ θεωροῦντες αὐτὸν πορευόμενον
  choice: os que o viram caminhando
  rationale: Reproduz com clareza a construção participial que descreve os observadores vendo Tobit em movimento.
- source_word: ὅτι ἔβλεψεν
  choice: porque ele podia ver
  rationale: Mantém-se próximo da formulação grega e deixa que o contexto indique a recuperação da visão, sem explicitação interpretativa desnecessária.
theological_decisions:
- issue: Identificação da pessoa designada pela forma grega Τωβείας
  choice: Tobit, o pai que foi curado
  alternative: Tobias, o filho
  rationale: A oração final afirma que os observadores se admiraram porque ele podia ver, o que corresponde ao pai anteriormente cego. A nota registra a discrepância da forma nominal sem introduzir uma identificação enganosa no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Bendizendo” preserva o teor lexical e bíblico sem arcaísmo excessivo; “porta de Nínive” designa a porta da cidade.
