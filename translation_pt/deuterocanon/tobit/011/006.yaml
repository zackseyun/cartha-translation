  yaml_path: translation/deuterocanon/tobit/011/006.yaml
  text: And she noticed him coming and said to his father[a], “Look, my son is coming, and the man who went with him.”
translation:
  language: pt
  text: 'Ela o avistou chegando[a] e disse ao pai dele: “Olhe! Meu filho está chegando, e também o homem que foi com ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “percebeu-o chegando”; no contexto, trata-se de avistá-lo enquanto se aproximava.
    reason: lexical_alternative
lexical_decisions:
- source_word: προενόησεν
  choice: avistou
  rationale: No contexto, descreve a percepção visual de alguém que vinha se aproximando. “Avistou” é natural em português e preserva a ideia de percebê-lo à distância, sem impor com excessiva certeza a noção de reconhecimento.
- source_word: ἐρχόμενον
  choice: chegando
  rationale: O particípio indica movimento em direção à observadora. “Chegando” expressa isso de modo simples e idiomático.
- source_word: Ἰδοὺ
  choice: Olhe!
  rationale: Mantém a força de uma exclamação dêitica que chama a atenção, em linguagem moderna e corrente.
- source_word: ὁ υἱός μου
  choice: meu filho
  rationale: Tradução direta da expressão possessiva grega.
- source_word: ὁ ἄνθρωπος
  choice: o homem
  rationale: Preserva o substantivo explícito do grego, sem substituí-lo pela interpretação contextual “companheiro”.
- source_word: ὁ πορευθεὶς μετʼ αὐτοῦ
  choice: que foi com ele
  rationale: Reproduz com clareza a referência à viagem anterior e permanece próxima da construção participial grega.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A forma “pai dele” conserva a referência pronominal do grego; “e também” torna natural a coordenação final sem alterar seu conteúdo.
