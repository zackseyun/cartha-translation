base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/017.yaml
  text: And Tobit gave thanks before them that God had shown them mercy. And when Tobit came near to Sarah his daughter-in-law[a], he blessed her, saying, “May you come in good health, daughter. Blessed is God, who has brought you to us, and your father and your mother.”
translation:
  language: pt
  text: 'E Tobit dava graças diante deles, porque Deus havia tido misericórdia deles. Quando Tobit se aproximou de Sara, sua nora, abençoou-a, dizendo: “Que você chegue com saúde, filha. Bendito seja Deus, que trouxe você até nós, e seu pai e sua mãe.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego termina de maneira abrupta com “e seu pai e sua mãe”. Pode estar subentendida uma continuação como “e benditos sejam seu pai e sua mãe”, mas esse verbo não aparece neste testemunho.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογεῖτο
  choice: dava graças
  rationale: Neste contexto, o verbo expressa reconhecimento público e agradecido pela misericórdia de Deus, não confissão de pecado.
- source_word: ἠλέησεν αὐτούς
  choice: havia tido misericórdia deles
  rationale: Preserva o sentido teológico de ἐλεέω e apresenta a ação divina como anterior ao agradecimento de Tobit.
- source_word: καὶ ὡς ἤγγισεν
  choice: Quando ... se aproximou
  rationale: A conjunção introduz naturalmente a circunstância temporal em que Tobit abençoa Sara.
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: sua nora
  rationale: νύμφη pode significar noiva ou nora; aqui designa Sara em relação a Tobit, pai de seu marido.
- source_word: κατευλόγησεν
  choice: abençoou-a
  rationale: Traduz de modo direto e digno o ato enfático de pronunciar uma bênção.
- source_word: Ἔλθοις ὑγιαίνουσα
  choice: Que você chegue com saúde
  rationale: A construção optativa exprime desejo ou bênção; esta formulação conserva tanto a ideia de chegada quanto a de bem-estar.
- source_word: θύγατερ
  choice: filha
  rationale: Mantém a forma afetuosa de tratamento sem acrescentar o possessivo ausente no grego.
- source_word: εὐλογητὸς ὁ θεός
  choice: Bendito seja Deus
  rationale: É uma formulação portuguesa natural e tradicional para a expressão grega de louvor.
- source_word: ὃς ἤγαγέν σε πρὸς ἡμᾶς
  choice: que trouxe você até nós
  rationale: Reproduz claramente a ação concluída e a chegada de Sara à família.
- source_word: καὶ ὁ πατήρ σου καὶ ἡ μήτηρ σου
  choice: e seu pai e sua mãe
  rationale: Mantém a frase final tal como transmitida, sem suprir um verbo que não aparece neste testemunho.
theological_decisions:
- issue: Sentido de ἐξωμολογεῖτο em relação a Deus
  choice: agradecimento público
  alternative: confissão
  rationale: A oração seguinte, que declara a misericórdia de Deus para com eles, indica reconhecimento agradecido da ação divina, e não admissão de culpa.
- issue: Frase final sintaticamente abrupta
  choice: preservar “e seu pai e sua mãe” no texto principal
  alternative: explicitar “e benditos sejam seu pai e sua mãe”
  rationale: O testemunho grego não repete nem fornece explicitamente o verbo; preservar a forma abrupta evita resolver uma elipse genuína dentro do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para uma bênção familiar natural e conserva em nota a ambiguidade sintática do final.
