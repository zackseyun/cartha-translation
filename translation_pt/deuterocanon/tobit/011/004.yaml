  text: But take the fish’s gall in your hand. And they went on, and the dog came along behind them.
translation:
  language: pt
  text: Mas pegue a bílis do peixe e tenha-a na mão.[a] E eles seguiram viagem, e o cão veio atrás deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o fel do peixe». O grego χολή pode designar fel ou bílis.'
    reason: lexical_alternative
  - marker: b
    text: A tradição semítica paralela desta cena apresenta um texto bem mais extenso, concentrado em Tobias aplicando a bílis do peixe aos olhos do pai. O texto principal segue aqui a redação grega mais breve.
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε
  choice: pegue
  rationale: Imperativo aoristo de λαμβάνω; «pegue» expressa de modo natural e direto a ordem prática.
- source_word: παρὰ χεῖρα
  choice: na mão
  rationale: Neste contexto, a expressão indica ter ou levar o objeto na mão, não conduzir alguém pela mão.
- source_word: χολὴν τοῦ ἰχθύος
  choice: a bílis do peixe
  rationale: χολή pode designar bílis ou fel. «Bílis» é claro no português atual e identifica naturalmente a substância extraída do peixe; «fel» permanece como alternativa lexical em nota.
- source_word: ἐπορεύθησαν
  choice: seguiram viagem
  rationale: O verbo narrativo indica deslocamento; a formulação comunica naturalmente a continuação da jornada.
- source_word: συνῆλθεν
  choice: veio
  rationale: συνέρχομαι denota aqui movimento em companhia; combinado com «atrás deles», «veio» preserva a imagem sem transformar o verbo em um simples «seguiu».
- source_word: ὁ κύων
  choice: o cão
  rationale: Tradução direta do substantivo com artigo, referindo-se ao cão já conhecido na narrativa.
- source_word: ὀπίσωθεν αὐτῶν
  choice: atrás deles
  rationale: A expressão adverbial indica a posição do cão atrás dos viajantes.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Pegue» evita a possível ambiguidade de «tome»; «seguiram viagem» torna explícita apenas a continuação de movimento indicada pelo contexto. Todos os marcadores de nota aparecem no texto principal.
