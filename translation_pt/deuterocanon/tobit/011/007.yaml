  text: 'E Rafael disse[a]: “Eu sei que seu pai abrirá os olhos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu pai recuperará a visão”. O grego diz literalmente “abrirá os olhos”, expressão que, neste contexto, indica a recuperação da visão.'
