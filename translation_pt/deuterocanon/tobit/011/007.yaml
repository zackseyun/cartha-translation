lexical_decisions:
- source_word: Ἐπίσταμαι
  choice: Sei
  rationale: Expressa conhecimento seguro; “sei” é a equivalência mais direta e natural, sem acrescentar intensidade interpretativa.
- source_word: ἀνοίξει
  choice: abrirá
  rationale: Preserva o futuro ativo do grego e a imagem verbal empregada no texto.
- source_word: τοὺς ὀφθαλμούς
  choice: os olhos
  rationale: Reproduz de modo natural em português o objeto definido referente aos olhos do pai.
- source_word: ὁ πατήρ σου
  choice: seu pai
  rationale: É a tradução direta e corrente da expressão grega.
- source_word: Ῥαφαήλ
  choice: Rafael
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Expressão idiomática para a cura da cegueira
  choice: Manter no texto principal “seu pai abrirá os olhos”
  alternative: “seu pai recuperará a visão” ou “os olhos de seu pai se abrirão”
  rationale: O grego apresenta uma construção ativa, literalmente “seu pai abrirá os olhos”. No contexto, ela indica a recuperação da visão, mas preservar a imagem mantém a forma e o efeito narrativo sem explicitar no texto principal aquilo que permanece idiomático.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a construção ativa do grego foram preservadas, enquanto a nota esclarece o sentido contextual do idioma.
