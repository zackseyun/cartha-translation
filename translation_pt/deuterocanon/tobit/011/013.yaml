  rationale: No contexto anatômico, refere-se aos ângulos ou cantos dos olhos; “cantos” é claro e natural em português.
- source_word: ὀφθαλμῶν
  choice: olhos
  rationale: Equivalente anatômico comum e direto.
- source_word: λευκώματα
  choice: películas brancas
  rationale: Comunica camadas ou opacidades esbranquiçadas nos olhos e combina naturalmente com a ideia de se desprenderem.
- source_word: ἰδών
  choice: Quando viu
  rationale: Traduz o particípio com valor temporal de maneira natural em português.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: lançou-se ao pescoço dele
  rationale: Conserva a imagem da expressão grega convencional para um abraço emocionado, mantendo também sua intensidade.
