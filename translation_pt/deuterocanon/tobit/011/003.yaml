base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/003.yaml
  text: Let us run on ahead of your wife and prepare the house[a].
translation:
  language: pt
  text: Corramos à frente da sua esposa e preparemos a casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz «sua esposa». Pelo contexto mais amplo da narrativa, alguns leitores poderiam esperar uma referência a outro membro da família; porém, o testemunho grego preservado traz «sua esposa», e a tradução segue esse texto-fonte.
    reason: alternative_reading
lexical_decisions:
- source_word: προδράμωμεν
  choice: Corramos à frente
  rationale: 'O subjuntivo aoristo tem sentido exortativo: «corramos». A escolha preserva o movimento vívido do grego, sem reduzi-lo ao mais genérico «vamos».'
- source_word: ἔμπροσθεν
  choice: à frente
  rationale: Usado com o verbo de movimento, indica avançar adiante; «à frente» é idiomático e claro em português.
- source_word: τῆς γυναικός σου
  choice: da sua esposa
  rationale: γυνή, com o possessivo σου neste contexto relacional, tem o sentido de «esposa». Mantém-se a leitura do testemunho grego, apesar da dificuldade contextual.
- source_word: ἑτοιμάσωμεν
  choice: preparemos
  rationale: O subjuntivo exortativo acompanha o primeiro verbo. «Preparemos» reproduz de modo direto e digno a ideia de deixar algo pronto.
- source_word: τὴν οἰκίαν
  choice: a casa
  rationale: Embora οἰκία também possa designar a família ou o conjunto doméstico, o contexto de chegar antes para fazer preparativos favorece a habitação física.
