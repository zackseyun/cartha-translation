base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/005.yaml
  text: And Anna sat watching the road for her son,[a]
translation:
  language: pt
  text: Ana estava sentada, olhando atentamente para a estrada, à espera de seu filho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz, de forma condensada, «olhando para a estrada, seu filho», isto é, ela observava a estrada à espera da volta do filho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: estava sentada
  rationale: O imperfeito de κάθημαι descreve a postura contínua de Ana; a locução verbal é natural em português e preserva o aspecto durativo.
- source_word: περιβλεπομένη
  choice: olhando atentamente
  rationale: O particípio indica um olhar vigilante e perscrutador. A expressão comunica a expectativa de Ana sem restringir o verbo ao sentido literal de olhar ao redor.
- source_word: εἰς τὴν ὁδόν
  choice: para a estrada
  rationale: A preposição εἰς orienta o olhar para a via pela qual o filho voltaria; 'estrada' é concreto e natural no contexto narrativo.
- source_word: τὸν παῖδα αὐτῆς
  choice: à espera de seu filho
  rationale: παῖς designa aqui o filho de Ana. A construção grega é comprimida; 'à espera de' explicita em português a relação contextual entre a observação da estrada e o retorno do filho.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a ação contínua do imperfeito e torna inteligível, por meio da nota, a sintaxe condensada do grego.
