  yaml_path: translation/deuterocanon/tobit/011/014.yaml
  text: And she wept and said[a], “Blessed are you, O God, and blessed is your name forever, and blessed are all your holy angels,”
translation:
  language: pt
  text: 'Ela chorou e disse: “Bendito és tu, ó Deus, e bendito é o teu nome para sempre[a], e benditos são todos os teus santos anjos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “pelos séculos” ou “pelas eras”; a expressão significa “para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαυσεν
  choice: Ela chorou
  rationale: O verbo significa “chorou”. Embora a forma grega não marque gênero, o contexto identifica Ana como referente; explicitar “ela” produz português natural sem alterar o sentido.
- source_word: Εὐλογητὸς εἶ
  choice: Bendito és tu
  rationale: Mantém a fórmula direta de bênção, o valor declarativo do grego e o tom doxológico, sem convertê-la em mero vocabulário de louvor.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: O contexto é de invocação direta. A partícula vocativa portuguesa “ó” transmite com naturalidade o tom elevado da oração.
- source_word: τὸ ὄνομά σου
  choice: o teu nome
  rationale: Preserva sem expansão a expressão bíblica referente ao nome de Deus, em concordância com o tratamento direto “tu”.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É o equivalente idiomático claro para a expressão grega, literalmente “pelos séculos/as eras”, que aqui comunica duração perpétua.
- source_word: εὐλογημένοι
  choice: benditos são
  rationale: Dá continuidade ao padrão declarativo de bênção; evita transformá-lo sem necessidade em desejo optativo, como “sejam benditos”.
- source_word: πάντες
  choice: todos
  rationale: Expressa diretamente o sentido abrangente do termo grego.
- source_word: οἱ ἅγιοι ἄγγελοί σου
  choice: os teus santos anjos
  rationale: ἅγιοι modifica diretamente ἄγγελοι; “santos anjos” preserva a sintaxe e o sentido simples do grego.
theological_decisions:
- issue: Fórmula doxológica dirigida a Deus
  choice: “Bendito és tu, ó Deus”
  alternative: “Louvado és tu, ó Deus”
  rationale: A repetição de formas de εὐλογητός constitui uma fórmula de bênção. Manter “bendito” conserva a linguagem bíblica e a correspondência lexical, sem reduzir a fórmula a uma declaração genérica de louvor.
translation_notes:
  register: Português moderno, digno e litúrgico sem arcaísmo excessivo. O uso coerente de “tu/teu” conserva a segunda pessoa direta e é amplamente compreensível no português internacional e brasileiro. O marcador foi colocado junto de “para sempre”, expressão a que a nota se refere.
