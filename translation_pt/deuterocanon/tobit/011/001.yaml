base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/001.yaml
  text: After these things[a], Tobiah also went on his way, blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: pt
  text: Depois disso, Tobias seguiu viagem, bendizendo a Deus porque havia feito prosperar o seu caminho,[a] e continuava bendizendo Raguel e sua mulher, Edna. E ele prosseguiu até que eles se aproximaram de Nínive.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “fez prosperar o seu caminho”, expressão que significa que Deus deu bom êxito à sua viagem.
    reason: lexical_alternative
  - marker: b
    text: 'A oração final é difícil no grego: o verbo principal está no singular, mas o verbo seguinte está no plural. Provavelmente significa “até que eles se aproximaram de Nínive”; também pode ser entendida como “até que ele se aproximou de Nínive”.'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois disso
  rationale: Expressa naturalmente a transição temporal; o singular coletivo em português comunica bem o plural grego sem rigidez.
- source_word: ἐπορεύετο
  choice: seguiu viagem / prosseguiu
  rationale: O imperfeito indica deslocamento em curso; as duas formulações preservam esse valor com fluidez em português.
- source_word: εὐλογῶν τὸν θεόν
  choice: bendizendo a Deus
  rationale: Mantém o sentido literal e o registro bíblico de εὐλογέω, sem reduzi-lo apenas a 'louvar'.
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: porque havia feito prosperar o seu caminho
  rationale: Preserva a imagem da estrada/caminho e a ação divina do idioma grego, esclarecida em nota.
- source_word: κατευλόγει
  choice: continuava bendizendo
  rationale: Reproduz o aspecto durativo do imperfeito e a intensidade ou continuidade sugerida pelo verbo composto.
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: Raguel e Edna, mulher dele
  rationale: Identifica Edna como mulher de Raguel, mantendo a relação expressa pelo grego sem tornar 'dele' equivocadamente referente a Tobias.
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: até que chegaram perto de Nínive
  rationale: Conserva o verbo plural transmitido e apresenta o provável sentido de aproximação geográfica, deixando a dificuldade sintática registrada em nota.
theological_decisions:
- issue: Tradução de θεός
  choice: Deus
  alternative: o deus
  rationale: No contexto narrativo, o termo designa o Deus de Israel; a inicial maiúscula é a convenção portuguesa adequada.
- issue: Sujeito e sentido da oração final difícil
  choice: E prosseguiu até que chegaram perto de Nínive
  alternative: E prosseguiu até que chegou perto de Nínive
  rationale: Mantém a alternância do texto grego entre o verbo principal singular e o verbo final plural, sem corrigir silenciosamente sua tensão sintática; a nota informa a possibilidade de leitura singular.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A construção final preserva deliberadamente a mudança do singular para o plural presente no grego, enquanto a nota explicita a incerteza.
