  - severity: low
    issue: Mudança de sujeito final não está explicitada.
    rationale: O grego traz ἐπορεύετο (singular) e ἤγγισαν (plural). “E ele prosseguiu até que eles se aproximaram” conserva os respectivos números e é mais natural do que uma alternância sem sujeito expresso.
