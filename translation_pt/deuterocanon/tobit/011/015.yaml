  text: because you afflicted me and had mercy on me. Behold[a], I see Tobiah my son. And his son entered rejoicing, and reported to his father the great things that had happened to him in Media.
translation:
  language: pt
  text: porque me afligiste e tiveste misericórdia de mim. Eis que vejo Tobias, meu filho. E o filho dele entrou cheio de alegria e contou ao pai as grandes coisas que lhe tinham acontecido na Média.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαστίγωσας
  choice: me castigaste
  rationale: O verbo μαστιγόω pode significar literalmente açoitar, mas também castigar ou afligir severamente. “Me castigaste” conserva a ação divina direta e a força disciplinar do termo sem exigir um açoite literal no contexto.
- source_word: ἠλέησάς με
  choice: tiveste misericórdia de mim
  rationale: Equivalente corrente e digno de ἐλεέω, preservando o contraste com o castigo anterior.
- source_word: ἰδοὺ
  choice: Eis que
  rationale: Expressão de atenção adequada ao registro solene e à descoberta imediata da visão restaurada.
- source_word: βλέπω
  choice: vejo
  rationale: Tradução direta que comunica tanto a recuperação da visão quanto a identificação do filho.
- source_word: Τωβείαν
  choice: Tobias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome do filho neste livro; o contexto distingue-o de seu pai.
- source_word: χαίρων
  choice: cheio de alegria
  rationale: Reproduz naturalmente em português o estado expresso pelo particípio, sem reduzi-lo apenas ao modo da entrada.
- source_word: ἀπήγγειλεν
  choice: contou
  rationale: Verbo narrativo natural para comunicar ao pai o relato do que ocorreu, preservando a ideia de informar.
- source_word: τὰ μεγάλα
  choice: as grandes coisas
  rationale: Mantém a formulação ampla do grego sem especificar indevidamente se eram feitos divinos, bênçãos ou acontecimentos extraordinários.
- source_word: τὰ γενόμενα αὐτῷ
  choice: que lhe tinham acontecido
  rationale: Expressão idiomática que conserva a referência às experiências vividas pelo filho antes desse momento narrativo.
- source_word: ἐν τῇ Μηδείᾳ
  choice: na Média
  rationale: Nome geográfico consagrado para a região antiga indicada pelo grego Μηδεία.
theological_decisions:
- issue: Agência divina no sofrimento e na misericórdia
  choice: “me castigaste e tiveste misericórdia de mim”
  alternative: "“me afligiste e tiveste misericórdia de mim” ou “me aço \0itaste e tiveste misericórdia de mim”"
  rationale: A primeira pessoa dirige a Deus tanto o castigo quanto a misericórdia. A tradução conserva essa tensão teológica e não torna o sofrimento impessoal, ao mesmo tempo que evita impor a imagem necessariamente literal de açoites.
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. “Eis que” preserva a solenidade da exclamação; “Então” explicita de modo leve a progressão narrativa implicada pela coordenação grega. Não há marcadores de nota no texto porque nenhuma nota foi julgada indispensável.
