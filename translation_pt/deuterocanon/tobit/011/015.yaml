  source_fidelity: 'A tradução acompanha de perto o grego: preserva a atribuição direta a Deus da aflição e da misericórdia, a recuperação da visão, a alegria de Tobias e o relato dos acontecimentos na Média. Contudo, «Então» acrescenta uma relação temporal mais específica do que a simples coordenação de καί; «E» é mais fiel. «Castigaste» é possível, mas pode sugerir uma leitura disciplinar/punitiva que μαστιγόω não explicita necessariamente neste contexto; «afligiste» mantém a ideia de sofrimento severo sem essa inferência.'
  naturalness: O português é claro, digno e natural. «Eis que» funciona bem no registro narrativo elevado. «O filho dele» evita a leve ambiguidade referencial de «seu filho» e soa natural para leitores brasileiros e internacionais.
  terminology: '«Tobias», «misericórdia», «Média» e «grandes coisas» são escolhas adequadas. Não é necessária nota lexical: «afligiste» é uma solução contextual legítima para o verbo grego, sem alegar uma imagem literal de açoitamento.'
