lexical_decisions:
- source_word: ἤχθη
  choice: foi celebrado
  rationale: O aoristo passivo de ἄγω é empregado aqui no sentido idiomático de realizar ou celebrar um evento; a formulação preserva a voz passiva e soa natural em português.
- source_word: ὁ γάμος
  choice: o casamento
  rationale: Neste contexto, a duração de sete dias e a menção da alegria apontam para a celebração do casamento, não apenas para a união matrimonial em sentido abstrato.
- source_word: Τωβεία
  choice: de Tobias
  rationale: O genitivo identifica de quem era o casamento. “Tobias” mantém a forma tradicional e amplamente reconhecida do nome em português.
- source_word: μετʼ εὐφροσύνης
  choice: com alegria
  rationale: Expressa a alegria festiva que acompanhou a celebração, em linguagem clara, digna e corrente.
- source_word: ἑπτὰ ἡμέρας
  choice: durante sete dias
  rationale: O acusativo indica duração; “durante” torna essa função temporal explícita e natural em português.
