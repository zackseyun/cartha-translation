  text: You shall anoint his eyes with the gall[a], and when it stings, he will rub them, and the white films will come away[c][b], and he will see you.
translation:
  language: pt
  text: Aplique o fel[a] nos olhos dele. Quando arder[b], ele os esfregará; as películas brancas[c] se desprenderão, e ele verá você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a bile”. A palavra grega designa fel ou bile, usado aqui como substância medicinal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “quando morder” ou “quando picar”; o grego usa uma imagem corporal vívida para o ardor ou a irritação causada nos olhos.
    reason: lexical_alternative
  - marker: c
    text: Ou “as manchas brancas” ou “as placas brancas”. O termo se refere a opacidades esbranquiçadas nos olhos, não necessariamente a cataratas no sentido médico moderno.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγχρισον
  choice: aplicar
  rationale: O imperativo de ἐγχρίω indica passar ou espalhar uma substância. “Aplicar” é natural em português no contexto medicinal e evita a conotação predominantemente ritual de “ungir”.
- source_word: χολὴν
  choice: fel
  rationale: χολή designa fel ou bile. “Fel” conserva a equivalência tradicional e permanece compreensível; a alternativa mais clínica é indicada em nota.
- source_word: δηχθεὶς
  choice: quando arder
  rationale: O particípio expressa literalmente a ideia de ser mordido ou picado, aqui descrevendo o efeito irritante do fel nos olhos. “Quando arder” comunica esse efeito de modo natural sem eliminar inteiramente a força sensorial.
- source_word: διατρίψει
  choice: ele os esfregará
  rationale: O verbo indica esfregar; o pronome “os” retoma naturalmente “olhos”, cujo objeto está implícito no grego.
- source_word: ἀποβαλεῖται
  choice: se desprenderão
  rationale: A forma média, em conexão com τὰ λευκώματα, descreve a remoção ou soltura das opacidades. “Se desprenderão” oferece uma construção portuguesa clara sem impor um agente externo.
- source_word: τὰ λευκώματα
  choice: as películas brancas
  rationale: O termo se refere a formações ou opacidades esbranquiçadas nos olhos. “Películas brancas” é inteligível e evita identificá-las de modo anacrônico e excessivamente específico como cataratas.
- source_word: ὄψεταί σε
  choice: ele verá você
  rationale: Reproduz diretamente o grego, que diz apenas que ele verá a pessoa interpelada, sem acrescentar explicitamente “recuperará a visão”.
