  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação organiza a sequência das ações. “Aplicar” favorece naturalidade no contexto medicinal, enquanto as notas preservam as alternativas lexicais e a imagem vívida do grego.
