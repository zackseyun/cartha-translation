  text: Take courage[a], father. Then, when they had come together, he rubbed his eyes[b],
translation:
  language: pt
  text: “Coragem, pai!” Quando seus olhos arderam[a], ele os esfregou,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego é de sentido difícil; neste contexto, com “os olhos” como sujeito implícito, descreve ardor ou irritação nos olhos, não o encontro de pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρσει
  choice: Coragem
  rationale: O imperativo de θαρσέω transmite encorajamento e tranquilização. A forma exclamativa “Coragem!” é natural em português e conserva a força direta do grego.
- source_word: πάτερ
  choice: pai
  rationale: Vocativo dirigido por Tobias a Tobit. Não se acrescenta o possessivo “meu”, ausente no grego.
- source_word: ὡς δὲ συνεδήχθησαν
  choice: Quando os olhos começaram a arder
  rationale: No contexto, a forma verbal συνεδήχθησαν descreve os olhos sendo picados ou causando ardor, não a reunião de pessoas. “Começaram a arder” expressa de modo claro e natural a reação ocular, fazendo explícito o sujeito implícito.
- source_word: διέτριψε
  choice: esfregou
  rationale: O verbo διατρίβω, neste contexto corporal, indica friccionar ou esfregar; “esfregou” conserva a ação concreta sem acrescentar detalhes do tratamento.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: os
  rationale: Como “os olhos” já foi explicitado na oração anterior, o pronome objeto evita repetição e identifica naturalmente os olhos de Tobit.
