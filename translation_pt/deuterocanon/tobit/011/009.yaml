  text: And Anna ran up and fell on the neck of her son[a], and said to him, “I have seen you, child.”
translation:
  language: pt
  text: 'Ana correu e lançou-se ao pescoço do filho[a] e lhe disse: “Eu vi você, filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “lançou-se sobre o pescoço do filho”, expressão que descreve um abraço emocionado.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμοῦσα
  choice: correu ao encontro dele
  rationale: O particípio de προστρέχω descreve Ana correndo em direção ao filho. A formulação explicita em português o alvo já evidente no contexto e preserva a vivacidade do movimento.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον
  choice: lançou-se ao pescoço
  rationale: Preserva a imagem concreta do grego e comunica um abraço impetuoso e emocionado sem reduzir a expressão simplesmente a “abraçou”.
- source_word: τοῦ υἱοῦ αὐτῆς
  choice: do filho
  rationale: υἱός designa especificamente o filho de Ana; o artigo definido com “filho” é natural em português quando o vínculo familiar já está claro.
- source_word: Εἶδόν σε
  choice: Eu vi você
  rationale: Mantém o sentido direto do aoristo de ὁράω e a força emocional do reencontro, sem introduzir a ideia interpretativa de “encontrar”.
- source_word: παιδίον
  choice: meu filho
  rationale: Como vocativo materno dirigido a um filho já crescido, “meu filho” soa terno e natural em português. O possessivo é idiomático no tratamento familiar, embora não esteja expresso formalmente no grego.
