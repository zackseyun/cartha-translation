lexical_decisions:
- source_word: ἐπελάβετο
  choice: segurou
  rationale: O médio de ἐπιλαμβάνομαι indica tomar ou segurar alguém. “Segurou” preserva a ação física concreta sem defini-la como abraço nem acrescentar a ideia de amparo.
- source_word: προσέπασεν
  choice: aplicou
  rationale: O verbo descreve pôr ou espalhar uma substância sobre uma superfície. “Aplicou” é natural em contexto medicinal e evita tanto tecnicismo quanto coloquialismo excessivo.
- source_word: χολήν
  choice: fel
  rationale: χολή designa fel ou bile. “Fel” conserva o termo tradicional e literário apropriado ao remédio proveniente do peixe; “bile” seria mais clínico.
- source_word: ὀφθαλμούς
  choice: olhos
  rationale: Equivalente comum e direto de ὀφθαλμούς, sem necessidade de expressão anatômica mais específica.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio presente introduz a fala que continua no versículo seguinte. “Dizendo” preserva essa ligação e o caráter sintaticamente aberto do texto grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição grega de “seu pai” foi parcialmente substituída por “dele” para produzir fluência natural sem perder o referente. Os dois καί iniciais foram representados por “Então” e pela coordenação verbal, evitando uma sequência pesada de “e”.
