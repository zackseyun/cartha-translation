  yaml_path: translation/deuterocanon/tobit/012/012.yaml
  text: And now[a], when you and your bride Sarah were praying, I brought the memorial of your prayer before the Holy One. And when you were burying the dead[c][b], I likewise was with you.
translation:
  language: pt
  text: E agora, quando você e sua esposa Sara oravam, eu levei o memorial da oração de vocês à presença do Santo.[a] E, quando você sepultava os mortos, eu também estava com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Santo” refere-se a Deus neste contexto. “Memorial” também pode significar “lembrança” e talvez tenha aqui uma conotação cultual, como a de uma oferta memorial apresentada diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: agora
  rationale: Adverbial temporal padrão, que funciona naturalmente como transição no discurso.
- source_word: προσηύξω
  choice: oravam
  rationale: O pretérito imperfeito expressa de modo natural em português a ação em curso indicada pela oração temporal.
- source_word: ἡ νύμφη σου Σάρρα
  choice: sua esposa Sara
  rationale: νύμφη pode designar noiva ou esposa jovem; no contexto matrimonial, “esposa” é claro e natural, sem sugerir que o casamento ainda não ocorreu.
- source_word: προσήγαγον
  choice: levei
  rationale: Conserva o sentido concreto de trazer ou conduzir algo à presença de alguém; a locução seguinte comunica a ideia de apresentação.
- source_word: τὸ μνημόσυνον τῆς προσευχῆς ὑμῶν
  choice: o memorial da oração de vocês
  rationale: Mantém o singular grego e preserva a possível ressonância cultual de μνημόσυνον sem acrescentar explicitamente “oferta”.
- source_word: ἐνώπιον τοῦ ἁγίου
  choice: à presença do Santo
  rationale: Expressão portuguesa reverente e natural que preserva o título substantivado do grego; o contexto aponta para Deus.
- source_word: ἐθάπτες τοὺς νεκρούς
  choice: sepultava os mortos
  rationale: O imperfeito grego sugere ação habitual ou continuada; o singular concorda com o destinatário individual indicado por σοι.
- source_word: ὡσαύτως συμπαρήμην σοι
  choice: eu também estava com você
  rationale: “Também” comunica a correspondência marcada por ὡσαύτως, e “estava com você” traduz naturalmente a presença acompanhante do verbo composto.
theological_decisions:
- issue: Referente de τοῦ ἁγίου (“do Santo”)
  choice: Título referente a Deus, mantido como “o Santo”
  alternative: uma presença santa ou um ser celestial
  rationale: No contexto, Rafael apresenta a oração na presença divina. A tradução conserva a forma do grego sem substituir o título diretamente por “Deus”, preservando a expressão e sua tensão.
- issue: Natureza do “memorial” da oração
  choice: Manter “memorial” sem explicitar uma oferta
  alternative: “lembrança” ou “oferta memorial”
  rationale: μνημόσυνον pode ter ressonância cultual, mas o texto não nomeia expressamente uma oferta; “memorial” preserva essa possibilidade sem resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “você” e “de vocês” para clareza internacional com boa legibilidade brasileira. Preferiu-se “esposa” a “noiva” no texto principal; a ambiguidade lexical não altera substancialmente a cena matrimonial. A única nota reúne duas ambiguidades próximas na mesma oração, evitando sobrecarregar um versículo curto.
