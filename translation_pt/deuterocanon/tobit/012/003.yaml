base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/003.yaml
  text: because he brought me back to you healthy, and he healed my wife and brought back my money, and he likewise healed you.
translation:
  language: pt
  text: pois ele me trouxe de volta a você com saúde, curou minha esposa, trouxe meu dinheiro e igualmente curou você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγώχεν
  choice: trouxe de volta
  rationale: O perfeito de ἄγω, no contexto, indica que Rafael conduziu Tobias de volta até seu pai; a formulação conserva o valor resultativo.
- source_word: ὑγιῆ
  choice: com saúde
  rationale: Expressa diretamente o estado de saúde ou integridade física, sem ampliar para a ideia mais abrangente de segurança.
- source_word: ἐθεράπευσεν
  choice: curou
  rationale: Equivalente natural e preciso para a ação de restaurar a saúde, repetida em relação à esposa e ao pai.
- source_word: τὸ ἀργύριόν μου ἤνεγκεν
  choice: trouxe meu dinheiro
  rationale: ἀργύριον designa aqui o dinheiro ou prata recuperado; 'trouxe' preserva a formulação simples do grego sem acrescentar explicitamente 'de volta'.
- source_word: ὁμοίως
  choice: também
  rationale: Neste encadeamento, comunica naturalmente que Rafael realizou ação semelhante em favor do destinatário.
theological_decisions:
- issue: Agente das curas e dos benefícios
  choice: Manter Rafael como sujeito gramatical de todas as ações
  alternative: Reformular as curas como ações diretas de Deus por meio de Rafael
  rationale: O versículo atribui gramaticalmente essas ações ao personagem mencionado; explicitar uma causalidade teológica não declarada resolveria além do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem coordenada do grego foi preservada, evitando expressões idiomáticas que acrescentassem a noção de segurança além de saúde.
