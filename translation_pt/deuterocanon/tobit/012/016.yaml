  text: Os dois ficaram abalados e caíram com o rosto em terra, porque ficaram com medo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: ficaram abalados
  rationale: O passivo de ταράσσω indica perturbação ou forte agitação. “Ficaram abalados” comunica a reação súbita sem antecipar ou intensificar indevidamente o medo mencionado no fim do versículo.
- source_word: οἱ δύο
  choice: os dois
  rationale: Reproduz de modo direto o numeral substantivado e remete conjuntamente a Tobit e Tobias.
- source_word: ἔπεσον ἐπὶ πρόσωπον
  choice: caíram com o rosto em terra
  rationale: Expressa naturalmente a postura física de prostração indicada pelo idioma grego, sem acrescentar linguagem explícita de adoração.
- source_word: ἐφοβήθησαν
  choice: ficaram com medo
  rationale: Tradução corrente de φοβέομαι no aoristo, preservando a reação de medo declarada pelo texto.
- source_word: ὅτι
  choice: porque
  rationale: 'Marca com clareza a relação causal: o medo explica por que eles caíram com o rosto em terra.'
theological_decisions:
- issue: Natureza da reação à revelação de Rafael
  choice: O versículo descreve uma prostração causada pelo medo, sem qualificá-la explicitamente como adoração.
  alternative: A postura pode ser entendida como prostração reverente diante de um anjo.
  rationale: O grego afirma que os dois caíram com o rosto em terra porque tiveram medo. A tradução conserva tanto a postura quanto sua causa expressa, sem resolver além do texto sua possível dimensão reverencial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Com o rosto em terra” é idiomático e preserva a imagem concreta do grego; a repetição de “ficaram” mantém a sequência simples e enfática do original.
