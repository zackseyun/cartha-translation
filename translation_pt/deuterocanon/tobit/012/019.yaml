  text: All the days I was appearing to you[a], but I neither ate nor drank; rather, you were seeing a vision.
translation:
  language: pt
  text: Durante todos aqueles dias, eu aparecia a vocês[a], mas não comi nem bebi; o que vocês contemplavam era uma visão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Durante todos aqueles dias, apareci a vocês [...] mas o que vocês viram foi uma visão”. Os verbos gregos no imperfeito podem ressaltar uma ação contínua (“eu aparecia”, “vocês contemplavam”) ou ser traduzidos mais simplesmente como acontecimentos passados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: Durante todos aqueles dias
  rationale: Expressa naturalmente em português a extensão temporal de todo o período, preservando o sentido distributivo da frase grega.
- source_word: ὠπτανόμην ὑμῖν
  choice: eu aparecia a vocês
  rationale: O imperfeito é vertido com valor durativo, indicando que Rafael se mostrava ou permanecia visível a eles ao longo daqueles dias.
- source_word: οὐκ ἔφαγον οὐδὲ ἔπιον
  choice: não comi nem bebi
  rationale: Mantém a negação coordenada e o paralelismo conciso do grego.
- source_word: ἀλλὰ
  choice: mas ... o que
  rationale: 'A construção portuguesa introduz com naturalidade a correção contrastiva: não houve alimentação literal; aquilo que percebiam era uma visão.'
- source_word: ὅρασιν
  choice: uma visão
  rationale: Preserva a categoria visionária explicitamente nomeada no texto, sem explicar além do que o versículo afirma.
- source_word: ὑμεῖς ἐθεωρεῖτε
  choice: vocês contemplavam
  rationale: O verbo 'contemplar' comunica percepção atenta e permite conservar o aspecto contínuo do imperfeito sem soar artificial.
theological_decisions:
- issue: Natureza da presença visível e das ações de Rafael
  choice: Rafael afirma que aparecia visivelmente, embora não comesse nem bebesse, e caracteriza como visão aquilo que eles contemplavam.
  alternative: Interpretar que tudo apenas parecia acontecer ou explicar em termos precisos a natureza do corpo angélico.
  rationale: O grego contrapõe explicitamente a aparição à ausência de alimentação e bebida e chama de ὅρασις aquilo que os observadores percebiam. A tradução mantém essa tensão sobrenatural sem impor uma teoria angelológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “A vocês” evita regionalismo excessivo; “contemplavam” conserva o caráter perceptivo de θεωρέω e o aspecto contínuo, enquanto a nota registra a tradução possível pelo pretérito perfeito.
