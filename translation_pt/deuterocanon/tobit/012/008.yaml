base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/008.yaml
  text: Prayer with fasting[a], almsgiving, and righteousness is good; a little with righteousness is better than much with unrighteousness[b]. It is good to do almsgiving rather than to store up gold.
translation:
  language: pt
  text: A oração acompanhada de jejum, esmolas e justiça[a] é boa; é melhor ter pouco com justiça do que muito com injustiça. É bom dar esmolas em vez de acumular ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «retidão»; o termo grego também pode indicar conduta moralmente correta diante de Deus e das pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὸν
  choice: é boa / é melhor
  rationale: O adjetivo predicativo expressa avaliação positiva. Na comparação introduzida por ἢ, o português pede naturalmente «é melhor».
- source_word: προσευχὴ μετὰ νηστείας
  choice: a oração acompanhada de jejum
  rationale: «Acompanhada de» preserva a associação indicada por μετά e evita a possível leitura instrumental de «oração com jejum».
- source_word: ἐλεημοσύνης
  choice: esmolas / dar esmolas
  rationale: No contexto judaico-grego, refere-se concretamente à ajuda dada aos necessitados. A formulação é corrente e inteligível em português.
- source_word: δικαιοσύνης / ἀδικίας
  choice: justiça / injustiça
  rationale: Neste provérbio sobre bens e conduta ética, «justiça» e «injustiça» preservam claramente o contraste lexical, sem excluir a dimensão moral-religiosa.
- source_word: τὸ ὀλίγον / πολὺ
  choice: ter pouco / muito
  rationale: A inserção idiomática de «ter» explicita em português a posse ou quantidade subentendida no grego, mantendo o contraste proverbial.
- source_word: καλὸν
  choice: é bom
  rationale: Transmite a avaliação moral positiva de καλόν em linguagem natural, sem acentuar indevidamente a nuance de beleza ou nobreza.
- source_word: ποιῆσαι ἐλεημοσύνην
  choice: dar esmolas
  rationale: É a expressão portuguesa natural para a construção grega literalmente equivalente a «fazer esmola».
- source_word: θησαυρίσαι χρυσίον
  choice: acumular ouro
  rationale: Expressa a ideia de ajuntar ou armazenar riqueza sem acrescentar a conotação necessariamente negativa de «entesourar» ou «amontoar».
theological_decisions:
- issue: Sentido de δικαιοσύνη / ἀδικία neste contexto sapiencial
  choice: justiça / injustiça
  alternative: retidão / injustiça; justiça / maldade
  rationale: O contexto contrasta a posse de pouco ou muito com a qualidade ética do modo de vida. «Justiça / injustiça» conserva o par lexical e é natural em português; a nota registra a amplitude moral-religiosa de δικαιοσύνη.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura proverbial foi preservada, mas a sintaxe foi ajustada para soar natural. O texto mantém a coordenação das práticas piedosas sem afirmar uma relação teológica específica entre elas.
