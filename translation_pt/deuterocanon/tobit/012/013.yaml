  yaml_path: translation/deuterocanon/tobit/012/013.yaml
  text: And when you did not hesitate to rise and leave your meal so that you might go and wrap the dead man[a], your doing good did not escape me[b], but I was with you.
translation:
  language: pt
  text: E, quando você não hesitou em se levantar e deixar sua refeição para ir envolver o morto[a], não me passou despercebido que você praticava o bem; mas eu estava com você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “preparar o morto para o sepultamento”. O verbo grego pode se referir a envolver ou, de modo mais geral, preparar um cadáver.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ὤκνησας
  choice: você não hesitou
  rationale: ὀκνέω expressa hesitação, relutância ou demora. A formulação é natural em português e ressalta a prontidão de Tobias.
- source_word: ἀναστῆναι
  choice: em se levantar
  rationale: Mantém o sentido concreto de levantar-se da refeição, em linguagem corrente e digna.
- source_word: καταλιπεῖν τὸ ἄριστόν σου
  choice: deixar sua refeição
  rationale: ἄριστον designa uma refeição, por vezes matinal ou principal, mas o horário exato não é determinado no contexto; “refeição” evita especificá-lo indevidamente.
- source_word: ὅπως ἀπελθὼν
  choice: para ir
  rationale: Reproduz de modo idiomático a finalidade da construção grega, sem tornar pesada a sequência verbal.
- source_word: περιστείλῃς τὸν νεκρόν
  choice: envolver o morto
  rationale: περιστέλλω pode indicar envolver, cobrir ou preparar um cadáver. “Envolver” permanece próximo do grego sem ampliar o ato para o sepultamento completo.
- source_word: οὐκ ἔλαθές με ἀγαθοποιῶν
  choice: não me passou despercebido que você fazia o bem
  rationale: A construção com λανθάνω indica que a ação não ficou oculta nem deixou de ser notada; a oração preserva também a força verbal contínua do particípio ἀγαθοποιῶν.
- source_word: ἀλλὰ σὺν σοὶ ἤμην
  choice: pelo contrário, eu estava com você
  rationale: ἀλλά marca contraste enfático, e a tradução conserva diretamente a afirmação da presença de Rafael.
theological_decisions:
- issue: Natureza da presença e da observação de Rafael
  choice: Afirmar apenas que a boa ação de Tobias não passou despercebida a Rafael e que ele estava com Tobias.
  alternative: Explicitar uma doutrina mais ampla de guarda, mediação ou conhecimento angelical.
  rationale: O grego faz uma afirmação narrativa concreta sobre esse episódio, sem formular uma doutrina geral sobre os anjos. A tradução não acrescenta conclusões teológicas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome “você” torna explícito o singular do grego. Evitou-se determinar o horário da refeição e preservou-se a ambiguidade de περιστέλλω mediante nota. O marcador [a] consta no texto principal.
