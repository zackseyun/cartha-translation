  text: For it was not by my own favor[a], but by the will of your God. Therefore bless him forever.
translation:
  language: pt
  text: Pois não foi por minha própria benevolência[a], mas pela vontade do Deus de vocês. Portanto, bendigam-no para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por minha própria graça” ou “por meu próprio favor”. A palavra grega χάρις pode significar “graça”, “favor” ou “benevolência”; aqui, provavelmente se refere à benevolência ou iniciativa do próprio Rafael.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: favor
  rationale: Neste contexto, Rafael nega que tenha agido por benefício ou iniciativa própria. “Favor” preserva a amplitude de χάρις sem introduzir desnecessariamente uma carga doutrinária específica.
- source_word: θελήσει
  choice: vontade
  rationale: θέλημα denota vontade ou intenção; “vontade” é a correspondência mais direta e natural nesta construção.
- source_word: τοῦ θεοῦ ὑμῶν
  choice: do Deus de vocês
  rationale: Preserva a relação expressa pelo genitivo e o plural ὑμῶν, dirigindo-se a Tobit e aos que estão com ele.
- source_word: ὅθεν
  choice: Portanto
  rationale: Introduz de modo claro a conclusão e a exortação decorrentes da afirmação anterior.
- source_word: εὐλογεῖτε
  choice: bendigam
  rationale: O imperativo plural pede que os destinatários bendigam a Deus. “Bendigam” mantém o sentido cultual e o registro bíblico sem perder clareza.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a forma portuguesa corrente e fiel para o valor duradouro dessa expressão idiomática.
- source_word: ἐμαυτοῦ
  choice: meu próprio
  rationale: 'Conserva a ênfase reflexiva: Rafael nega que o favor procedesse dele mesmo.'
theological_decisions:
- issue: Sentido de χάρις na negação de Rafael
  choice: Rafael afirma que sua atuação não ocorreu por favor ou iniciativa própria, mas pela vontade de Deus.
  alternative: “Não foi por minha própria graça”, conservando de maneira mais literal a possível acepção de “graça”.
  rationale: χάρις pode significar graça, favor ou benevolência. O contexto narrativo enfatiza a agência delegada de Rafael, mas a nota mantém visível a alternativa lexical sem impor uma interpretação doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Deus de vocês” reproduz explicitamente o plural grego; “bendigam” conserva o registro bíblico e o imperativo plural.
