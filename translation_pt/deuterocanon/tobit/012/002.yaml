  text: And he said[a], “Father[b], I lose nothing by giving him half of what I have brought back.”
translation:
  language: pt
  text: 'E ele disse: “Pai, não fico em prejuízo por lhe ter dado a metade do que trouxe de volta.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, o grego diz: “não sou prejudicado, tendo-lhe dado a metade do que trouxe”. O sentido é que dar ao guia metade dos bens recuperados não deixaria Tobias em prejuízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ
  choice: Pai
  rationale: Vocativo direto dirigido por Tobias a seu pai; “Pai” é natural em português e preserva a concisão do grego.
- source_word: οὐ βλάπτομαι
  choice: não perco nada
  rationale: No contexto de pagamento, a forma expressa não sofrer prejuízo. “Não perco nada” comunica de modo idiomático o sentido econômico, sem sugerir dano físico.
- source_word: δοὺς
  choice: se lhe der
  rationale: O particípio aoristo indica a circunstância ligada a não sofrer perda. A construção condicional é natural em português e mantém a ação como proposta, ainda não necessariamente realizada.
- source_word: αὐτῷ
  choice: lhe
  rationale: Pronome de objeto indireto que se refere a Rafael/Azarias.
- source_word: τὸ ἥμυσυ
  choice: a metade
  rationale: Equivalente português natural do substantivo neutro grego que significa “metade”.
- source_word: ὧν ἐνήνοχα
  choice: do que trouxe de volta
  rationale: O perfeito indica uma ação concluída com resultado presente. “De volta” explicita naturalmente o retorno com os bens ou o dinheiro e concorda com o apoio indireto da tradição semítica.
