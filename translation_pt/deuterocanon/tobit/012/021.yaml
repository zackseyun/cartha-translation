  text: And they stood up[a], and they did not see him.
translation:
  language: pt
  text: E eles se levantaram e não o viram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já não conseguiam vê-lo”. Mais literalmente, o grego diz: “não o viram”, o que pode sugerir seu desaparecimento sem afirmá-lo diretamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστησαν
  choice: se levantaram
  rationale: O aoristo de ἀνίστημι descreve aqui um movimento físico simples; “se levantaram” é natural e preserva a ação sem acrescentar interpretação.
- source_word: οὐκ εἶδον
  choice: não o viram
  rationale: A expressão grega afirma literalmente que eles não o viram. A tradução mantém a perspectiva dos observadores sem explicitar incapacidade ou desaparecimento.
- source_word: αὐτόν
  choice: o
  rationale: Pronome masculino singular no acusativo, retomando Rafael no contexto; o pronome objeto “o” é direto e idiomático em português.
- source_word: καὶ
  choice: mas
  rationale: Embora καί normalmente signifique “e”, a segunda ocorrência liga aqui um resultado contrastante à ação de se levantarem. “Mas” expressa naturalmente essa relação no português sem alterar o conteúdo.
theological_decisions:
- issue: Se o desaparecimento milagroso implícito deve ser declarado de modo explícito
  choice: 'Manter a formulação observacional: “não o viram”'
  alternative: “já não conseguiam vê-lo” ou “ele desapareceu da vista deles”
  rationale: O grego relata o que os observadores perceberam, sem descrever diretamente o mecanismo. Essa contenção preserva a ambiguidade e evita tornar explícito aquilo que o texto apenas sugere.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O sujeito explícito “eles” mantém a referência narrativa, e “mas” torna idiomática a relação entre as duas orações.
