  text: And he said to them[a], “Do not be afraid; peace be with you. But bless God forever.”
translation:
  language: pt
  text: 'E ele lhes disse: “Não tenham medo; a paz estará com vocês. Mas bendigam a Deus para sempre.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: Não tenham medo
  rationale: Expressa de modo natural em português moderno a proibição com φοβέομαι, sem perder sua força.
- source_word: εἰρήνη ὑμῖν ἔσται
  choice: a paz estará com vocês
  rationale: Preserva o futuro explícito ἔσται e representa naturalmente o dativo ὑμῖν, apresentando a frase como garantia, não apenas como saudação ou desejo.
- source_word: τὸν δὲ θεὸν
  choice: Mas ... a Deus
  rationale: 'O conectivo δέ marca uma transição levemente contrastiva: em vez de temer, eles devem bendizer a Deus.'
- source_word: εὐλογεῖτε
  choice: bendigam
  rationale: Mantém a correspondência lexical com εὐλογέω e um registro bíblico digno, ainda compreensível no português atual.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Equivalente português natural da expressão idiomática grega de duração permanente.
theological_decisions:
- issue: Força da declaração sobre a paz
  choice: 'Garantia futura: “a paz estará com vocês”'
  alternative: 'Bênção ou saudação: “a paz esteja com vocês”'
  rationale: O grego contém o futuro indicativo ἔσται; a tradução preserva essa forma e a tensão com a fórmula tradicional de saudação, sem convertê-la em subjuntivo optativo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O plural “vocês” evita o regionalismo de “vós”; “bendigam” conserva o tom bíblico sem arcaísmo sintático.
