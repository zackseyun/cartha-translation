  text: But those who sin are enemies of their own life[a].
translation:
  language: pt
  text: Mas os que pecam são inimigos da sua própria vida[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “inimigos da sua própria alma”. A palavra grega tem sentido mais amplo, mas “vida” é a tradução mais direta aqui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ἁμαρτάνοντες
  choice: os que pecam
  rationale: 'O particípio presente com artigo funciona como substantivo e mantém a força verbal: pessoas que pecam. A formulação é natural e evita tornar a expressão mais estática com “os pecadores”.'
- source_word: δὲ
  choice: Mas
  rationale: A partícula assinala um contraste leve com a declaração anterior; “Mas” expressa esse contraste com clareza.
- source_word: πολέμιοί
  choice: inimigos
  rationale: O termo indica pessoas hostis ou que agem como inimigas; “inimigos” é a correspondência portuguesa mais direta e idiomática.
- source_word: τῆς ἑαυτῶν ζωῆς
  choice: da própria vida
  rationale: A construção reflexiva afirma que essa inimizade se dirige à vida deles mesmos. O singular coletivo “própria vida” preserva o grego e soa natural em português.
theological_decisions:
- issue: Sentido de ζωή em contexto sapiencial e moral
  choice: vida
  alternative: alma
  rationale: ζωή significa normalmente “vida” e, neste contexto, aponta para a vida ou o bem-estar da própria pessoa, sem formular uma afirmação antropológica técnica sobre a alma. “Vida” evita importar categorias doutrinárias não explícitas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura concisa e proverbial do grego foi preservada; “da própria vida” evita tanto uma paráfrase explicativa quanto uma interpretação teológica excessiva.
