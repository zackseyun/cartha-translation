  text: And now give thanks to God[a], because I am ascending to the one who sent me; and write all that has been accomplished in a book.
translation:
  language: pt
  text: E agora deem graças a Deus[a], pois estou subindo para aquele que me enviou; e escrevam num livro tudo o que se realizou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reconheçam a Deus” ou “louvem a Deus”; o verbo grego pode abranger o reconhecimento expresso em gratidão ou louvor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: deem graças
  rationale: No uso judaico helenístico, com Deus como objeto indireto, o verbo frequentemente indica reconhecer a Deus mediante louvor ou gratidão. A formulação é natural em português, e a nota preserva as demais nuances possíveis.
- source_word: ἀναβαίνω
  choice: estou subindo
  rationale: Preserva o aspecto presente e o movimento ascendente, com sua implicação celestial, sem acrescentar a interpretação 'estou voltando'.
- source_word: τὸν ἀποστείλαντά με
  choice: aquele que me enviou
  rationale: Traduz naturalmente o particípio substantivado sem identificar explicitamente o remetente além do que esta oração declara.
- source_word: γράψατε
  choice: escrevam
  rationale: Imperativo plural direto, adequado aos destinatários e fiel à ordem de pôr os acontecimentos por escrito.
- source_word: πάντα τὰ συντελεσθέντα
  choice: tudo o que se realizou
  rationale: Reflete o particípio perfeito passivo e a ideia de acontecimentos levados a termo, sem especificar indevidamente o agente.
- source_word: εἰς βιβλίον
  choice: num livro
  rationale: Expressa de modo corrente a preservação escrita em um documento; 'rolo' seria possível culturalmente, mas não é exigido por βιβλίον.
theological_decisions:
- issue: Sentido da subida de Rafael para aquele que o enviou
  choice: Manter a linguagem de subida e deixar o remetente sem nova identificação explícita
  alternative: Traduzir 'estou voltando para Deus, que me enviou'
  rationale: O contexto aponta para Deus como remetente e para uma subida celestial, mas a oração grega diz apenas 'aquele que me enviou'. A tradução conserva essa forma e não amplia a angelologia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural verbal traduz os imperativos gregos no plural. A expressão 'se realizou' preserva a ideia de conclusão de συντελεσθέντα.
