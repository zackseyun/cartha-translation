  text: And they acknowledged his great and wondrous works[b][a], because an angel of the Lord had appeared to them.
translation:
  language: pt
  text: E reconheciam abertamente as grandes e maravilhosas obras dele,[a] porque um anjo do Senhor lhes havia aparecido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “davam graças pelas grandes e maravilhosas obras dele” ou “proclamavam essas obras”. O verbo grego pode expressar confissão pública, reconhecimento, ação de graças ou louvor, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “um anjo do Senhor”. A expressão também é tradicionalmente traduzida por “o anjo do Senhor”, mas aqui o grego não exige o sentido definido.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογοῦντο
  choice: reconheciam abertamente
  rationale: O verbo pode expressar confissão pública, reconhecimento, ação de graças ou louvor. Como seu objeto são as obras divinas, “reconheciam abertamente” preserva a ideia de declaração pública sem restringir o sentido a confissão de pecados.
- source_word: τὰ ἔργα τὰ μεγάλα καὶ θαυμαστὰ αὐτοῦ
  choice: as grandes e maravilhosas obras dele
  rationale: Mantém a correspondência direta de ἔργα com “obras” e traduz θαυμαστά com linguagem digna e corrente. “Dele” reproduz o pronome grego sem explicitar um referente que o versículo deixa implícito.
- source_word: ὡς
  choice: porque
  rationale: 'Neste contexto, introduz de modo natural o fundamento do reconhecimento: o aparecimento do anjo. A conjunção grega também pode admitir outras relações contextuais.'
- source_word: ὤφθη αὐτοῖς
  choice: lhes havia aparecido
  rationale: A forma passiva é idiomaticamente usada no sentido de “aparecer”. O mais-que-perfeito em português esclarece que a aparição antecedeu o reconhecimento narrado.
- source_word: ἄγγελος Κυρίου
  choice: um anjo do Senhor
  rationale: ἄγγελος está sem artigo; a forma indefinida evita impor a identificação mais específica sugerida por “o anjo do Senhor”.
theological_decisions:
- issue: Definição de ἄγγελος Κυρίου
  choice: um anjo do Senhor
  alternative: o anjo do Senhor
  rationale: A construção grega é anarticulada e não exige referência definida. A tradução indefinida preserva a formulação da fonte sem importar uma identificação teológica específica.
- issue: Amplitude semântica de ἐξωμολογοῦντο
  choice: reconheciam abertamente
  alternative: davam graças; louvavam; confessavam
  rationale: O objeto são as grandes obras divinas. A escolha preserva o caráter público do verbo e deixa em aberto suas possíveis nuances de gratidão e louvor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Reconheciam abertamente” evita a associação predominante de “confessavam” com culpa ou pecado, preservando a declaração pública das obras divinas. Os marcadores foram colocados junto às expressões que explicam.
