base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/007.yaml
  text: Do not hesitate to acknowledge him[a]. It is good to conceal a king’s secret, but to reveal the works of God gloriously. Do what is good[b], and evil will not find you.
translation:
  language: pt
  text: Não hesitem em reconhecê-lo.[a] É bom guardar o segredo de um rei, mas revelar gloriosamente as obras de Deus.[b] Façam o bem, e o mal não os encontrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dar-lhe graças”, “louvá-lo abertamente” ou “confessar diante dele”. O verbo grego pode expressar essas formas de reconhecimento, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “com honra” ou “de modo digno”. O advérbio grego pode descrever a maneira honrosa e apropriada de falar das obras de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκνεῖτε
  choice: Não hesitem
  rationale: Preserva a força do imperativo plural e o sentido de não recuar nem mostrar relutância, em português natural.
- source_word: ἐξομολογεῖσθαι αὐτῷ
  choice: em reconhecê-lo publicamente
  rationale: O verbo pode indicar confessar, agradecer, louvar ou reconhecer abertamente. O contexto de divulgar as obras de Deus favorece o reconhecimento público sem limitar indevidamente o sentido.
- source_word: μυστήριον βασιλέως
  choice: o segredo de um rei
  rationale: Aqui μυστήριον designa assunto confidencial, e não necessariamente um mistério teológico.
- source_word: καλὸν κρύψαι
  choice: É bom guardar
  rationale: Expressa a máxima geral de modo idiomático; 'guardar um segredo' é mais natural em português do que 'esconder um segredo'.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: as obras de Deus
  rationale: Tradução transparente e tradicional de ἔργα, adequada ao contraste com o segredo real.
- source_word: ἀνακαλύπτειν
  choice: revelar
  rationale: Reproduz com clareza o sentido de descobrir, divulgar ou tornar conhecido.
- source_word: ἐνδόξως
  choice: com honra
  rationale: Comunica a maneira digna e honrosa de divulgar as obras de Deus sem o possível estranhamento de 'gloriosamente' no português corrente.
- source_word: ἀγαθὸν ποιήσατε
  choice: Façam o bem
  rationale: Formulação ética direta, natural e fiel ao imperativo plural grego.
- source_word: κακὸν οὐχ εὑρήσει ὑμᾶς
  choice: o mal não os encontrará
  rationale: Mantém a imagem expressiva do grego e sua possível abrangência entre mal, dano e calamidade.
theological_decisions:
- issue: Sentido de ἐξομολογεῖσθαι αὐτῷ
  choice: reconhecer Deus publicamente
  alternative: confessar a ele; dar-lhe graças; louvá-lo abertamente
  rationale: O contraste entre guardar o segredo de um rei e revelar as obras de Deus favorece o reconhecimento ou louvor público, mas a nota conserva a amplitude lexical.
- issue: Valor de ἐνδόξως
  choice: com honra
  alternative: gloriosamente; de modo digno
  rationale: O advérbio pode ter nuance doxológica ou indicar a maneira honrosa e apropriada da divulgação. O texto principal usa português natural, e a nota preserva a alternativa.
- issue: Promessa em κακὸν οὐχ εὑρήσει ὑμᾶς
  choice: manter a afirmação proverbial sem qualificação
  alternative: o dano não os alcançará; a desgraça não os atingirá
  rationale: A tradução conserva a tensão da promessa sapiencial e não a redefine como garantia absoluta nem reduz κακόν a uma única espécie de sofrimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. A formulação evita regionalismos marcados; 'reconhecê-lo publicamente' explicita uma nuance contextual do verbo, enquanto as notas conservam sua ambiguidade genuína.
