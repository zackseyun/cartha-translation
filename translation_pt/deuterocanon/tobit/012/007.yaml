    issue: A alternativa «confessá-lo» na nota não representa bem o sentido de «confessar a/diante dele».
    rationale: Em português contemporâneo, «confessá-lo» normalmente sugere confessar ou declarar que ele é algo/alguém. «Confessar diante dele» preserva melhor a relação expressa pelo dativo grego.
  - severity: low
