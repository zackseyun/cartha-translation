  naturalness: O português é moderno, claro e apropriado ao registro sapiencial. «Não hesitem em reconhecê-lo» é natural sem introduzir uma especificação interpretativa no texto principal.
  terminology: «Segredo de um rei», «obras de Deus», «Façam o bem» e «o mal não os encontrará» são escolhas fiéis e idiomáticas. A nota original trazia «confessá-lo», que em português tende a significar confessar/professar alguém, e não conserva bem a construção grega com dativo; «confessar diante dele» evita essa ambiguidade.
