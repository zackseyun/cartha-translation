    rationale: Embora o contexto favoreça reconhecimento ou louvor aberto, ἐξομολογεῖσθαι αὐτῷ admite também dar graças, louvar ou confessar diante dele. A dimensão pública deve ser conservada como alternativa na nota, não imposta no texto.
