base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/009.yaml
  text: Almsgiving rescues from death[a], and it will cleanse away every sin. Those who do acts of almsgiving and righteousness will be filled with life.
translation:
  language: pt
  text: Dar esmolas livra da morte e purificará de todo pecado. Os que dão esmolas e praticam atos de justiça serão cheios de vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terão vida em abundância”.'
    reason: O verbo πληρόω com o genitivo pode indicar tanto estar cheio de algo como tê-lo em abundância ou até à saciedade.
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: dar esmolas
  rationale: Expressa concretamente a ajuda material dada a quem necessita; a locução verbal é mais natural no português atual do que o substantivo isolado.
- source_word: ῥύεται
  choice: livra
  rationale: Transmite a ideia de libertar ou resgatar de um perigo, aqui especificado como a morte, sem acrescentar conotações não exigidas pelo contexto.
- source_word: θανάτου
  choice: da morte
  rationale: Reproduz diretamente a construção com ἐκ, que indica aquilo de que alguém é livrado.
- source_word: ἀποκαθαριεῖ
  choice: purifica
  rationale: Preserva o sentido forte do verbo composto, isto é, limpar ou eliminar a impureza associada ao pecado.
- source_word: πᾶσαν ἁμαρτίαν
  choice: de todo pecado
  rationale: Conserva a abrangência distributiva da expressão grega e forma uma construção portuguesa natural com 'purifica'.
- source_word: ποιοῦντες
  choice: dão ... e praticam atos de
  rationale: O particípio indica ação ou prática; a formulação foi ajustada a cada complemento para produzir português natural sem perder o caráter concreto das ações.
- source_word: ἐλεημοσύνας
  choice: esmolas
  rationale: O plural grego aponta para atos concretos de auxílio; 'dão esmolas' mantém essa dimensão prática.
- source_word: δικαιοσύνας
  choice: atos de justiça
  rationale: O plural, em paralelo com esmolas, favorece o sentido de ações justas ou retas, e não apenas uma qualidade abstrata.
- source_word: πλησθήσονται ζωῆς
  choice: serão cheios de vida
  rationale: Mantém a imagem vívida do futuro passivo grego e deixa em aberto se 'vida' se refere à longevidade, vitalidade ou plenitude de bênção.
theological_decisions:
- issue: Relação entre dar esmolas, libertação da morte e purificação do pecado
  choice: Manter a afirmação direta de que dar esmolas livra da morte e purifica de todo pecado.
  alternative: Interpretar explicitamente a frase como hipérbole sapiencial ou subordiná-la, na tradução, ao arrependimento e à expiação.
  rationale: O grego faz a afirmação sem qualificações. A tradução preserva a tensão teológica e não introduz explicações doutrinárias ausentes do versículo.
- issue: Sentido de δικαιοσύνας neste contexto sapiencial
  choice: atos de justiça
  alternative: justiça; retidão; obras justas
  rationale: O plural e o paralelismo com 'esmolas' sugerem manifestações concretas de conduta justa. 'Atos de justiça' torna esse valor prático claro sem restringi-lo à justiça institucional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. 'Dar esmolas' conserva o sentido antigo de auxílio concreto aos necessitados, enquanto 'atos de justiça' explicita naturalmente o plural grego. O marcador da nota aparece no fim da oração a que a alternativa se refere.
