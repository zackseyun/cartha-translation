  text: And now God has sent me to heal you and Sarah your bride[a].
translation:
  language: pt
  text: E agora Deus me enviou para curar você e Sara, sua nora[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Sara, sua noiva”. A palavra grega νύμφη pode significar “noiva”, “esposa jovem” ou “nora”; aqui, Rafael está falando com Tobit.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto a transição temporal.
- source_word: ἀπέστειλέν με ὁ θεὸς
  choice: Deus me enviou
  rationale: O aoristo apresenta o envio como ação realizada; o pretérito perfeito é natural em português e mantém Deus como agente explícito.
- source_word: ἰάσασθαί σε
  choice: para curar você
  rationale: ἰάομαι significa curar ou sarar. “Curar” abrange adequadamente a cegueira de Tobit sem especificar além do grego; “você” torna claro o objeto singular em português atual.
- source_word: τὴν νύμφην σου Σάρραν
  choice: Sara, sua nora
  rationale: νύμφη pode designar noiva, esposa jovem ou nora. Como Rafael fala com Tobit e Sara acaba de se casar com Tobias, “sua nora” expressa de modo natural a relação indicada pelo contexto, enquanto a alternativa lexical é preservada em nota.
theological_decisions:
- issue: Sentido de νύμφη na relação entre Tobit e Sara
  choice: Sara, sua nora
  alternative: Sara, sua noiva
  rationale: O termo grego admite tanto o sentido matrimonial de “noiva/esposa jovem” quanto o sentido familiar de “nora”. Uma vez que o interlocutor é Tobit, “nora” é a leitura contextual mais coerente; a ambiguidade lexical genuína permanece registrada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “você” a “tu” para evitar uma conjugação regionalmente marcada. A ordem “Sara, sua nora” reproduz com naturalidade a aposição grega.
