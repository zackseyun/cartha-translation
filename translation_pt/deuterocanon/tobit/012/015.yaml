base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/015.yaml
  text: I am Raphael[a], one of the seven holy angels who present the prayers of the holy ones and enter before the glory of the Holy One.
translation:
  language: pt
  text: Eu sou Rafael, um dos sete anjos santos que apresentam as orações dos que são santos[a] e entram na presença da glória do Santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos santos”. O grego diz literalmente “dos santos” ou “dos que são santos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαφαήλ
  choice: Rafael
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio grego Ῥαφαήλ.
- source_word: εἷς ἐκ τῶν ἑπτὰ
  choice: um dos sete
  rationale: Expressão partitiva natural em português que preserva a especificidade numérica.
- source_word: ἁγίων ἀγγέλων
  choice: santos anjos
  rationale: Reproduz diretamente ἅγιος e mantém linguagem bíblica clara e corrente.
- source_word: προσαναφέρουσιν
  choice: apresentam
  rationale: Expressa o ato de levar as orações à presença divina sem impor a conotação sacrificial que 'oferecem' poderia sugerir.
- source_word: τὰς προσευχὰς
  choice: as orações
  rationale: Equivalente direto, comum e natural de προσευχαί.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: Em português bíblico, 'os santos' designa naturalmente as pessoas consagradas a Deus; a nota registra a tradução mais literal 'os que são santos'.
- source_word: εἰσπορεύονται ἐνώπιον
  choice: entram diante de
  rationale: Preserva tanto o movimento de entrada quanto a ideia de comparecer perante alguém.
- source_word: τῆς δόξης
  choice: da glória
  rationale: Mantém visível o substantivo δόξα, sem expandi-lo interpretativamente como 'presença gloriosa'.
- source_word: τοῦ ἁγίου
  choice: do Santo
  rationale: O singular substantivado e articulado funciona naturalmente como título reverente de Deus; a inicial maiúscula sinaliza essa referência.
theological_decisions:
- issue: Referência de τοῦ ἁγίου na frase final
  choice: 'Título divino: “do Santo”'
  alternative: Entender o termo de maneira adjetival implícita ou como circunlóquio menos explícito da presença divina
  rationale: O contexto da corte celestial favorece a leitura substantivada como referência a Deus. A formulação preserva a imagem de entrar diante da glória divina sem acrescentar explicações ao texto.
- issue: Tradução de τῶν ἁγίων
  choice: “dos santos”, com nota lexical
  alternative: “dos que são santos” ou “dos santos seres”
  rationale: O referente mais provável são os fiéis de Deus, cujas orações são apresentadas. 'Santos' é natural no português bíblico, e a nota conserva a transparência lexical sem associar o termo especificamente a pessoas canonizadas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Mantém a repetição de 'santos/Santo' presente no grego e preserva a linguagem da corte celestial. O marcador [a] aparece imediatamente após a expressão comentada.
