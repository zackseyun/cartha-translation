  text: I will certainly not hide any word from you[a]. I have indeed said, ‘It is good to hide a king’s secret[b], but to reveal the works of God gloriously.’
translation:
  language: pt
  text: 'De modo algum esconderei de vocês palavra alguma. De fato, eu já disse: “É bom guardar o segredo de um rei[a], mas revelar de modo glorioso as obras de Deus[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mistério de um rei”. Aqui, a palavra grega indica um assunto confidencial ou secreto, não necessariamente um “mistério” em sentido teológico.
    reason: lexical_alternative
  - marker: b
    text: Ou “com honra” ou “honrosamente”. O advérbio pode indicar a maneira apropriada e honrosa de tornar conhecidas as obras de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ κρύψω
  choice: De modo algum esconderei
  rationale: A combinação οὐ μή com o subjuntivo aoristo expressa uma negação enfática com sentido futuro. “De modo algum esconderei” conserva essa força em português natural.
- source_word: ἀφʼ ὑμῶν
  choice: de vocês
  rationale: Com κρύπτω, ἀπό seguido do genitivo indica as pessoas de quem algo é ocultado. “De vocês” é direto e amplamente compreensível.
- source_word: πᾶν ῥῆμα
  choice: palavra alguma
  rationale: A expressão significa literalmente “toda palavra” e, sob negação, “palavra alguma”. A formulação preserva o elemento lexical ῥῆμα sem perder naturalidade.
- source_word: εἴρηκα δὴ
  choice: De fato, eu já disse
  rationale: O perfeito εἴρηκα apresenta uma declaração já feita e ainda relevante; δή acrescenta ênfase. “De fato” e “já disse” comunicam ambos os aspectos com clareza.
- source_word: μυστήριον βασιλέως
  choice: o segredo de um rei
  rationale: Neste contexto proverbial, μυστήριον designa um assunto confidencial, não necessariamente um mistério teológico. “Segredo” transmite esse sentido corrente.
- source_word: κρύψαι καλόν
  choice: É bom guardar
  rationale: O infinitivo com καλόν formula uma máxima geral. “É bom guardar” soa proverbial e, com “segredo”, é mais idiomático em português do que “esconder”.
- source_word: τὰ δὲ ἔργα τοῦ θεοῦ
  choice: mas ... as obras de Deus
  rationale: δέ marca o contraste com o segredo real, enquanto ἔργα abrange os feitos e as ações de Deus. “Obras de Deus” preserva essa amplitude e a ressonância tradicional.
- source_word: ἀνακαλύπτειν
  choice: revelar
  rationale: O verbo significa descobrir, desvelar ou tornar conhecido. “Revelar” mantém o contraste direto com guardar um segredo.
- source_word: ἐνδόξως
  choice: de modo glorioso
  rationale: O advérbio pode descrever uma revelação feita gloriosa ou honrosamente. “De modo glorioso” preserva a ligação lexical com glória, enquanto a nota registra a nuance possível de honra.
theological_decisions:
- issue: Sentido de μυστήριον no contexto sapiencial e proverbial
  choice: segredo
  alternative: mistério
  rationale: A expressão se refere a informação confidencial de um rei. “Segredo” evita introduzir um sentido técnico, apocalíptico ou teológico que o contexto não exige.
- issue: Força de ἐνδόξως na divulgação das obras divinas
  choice: de modo glorioso
  alternative: com honra; honrosamente
  rationale: O texto qualifica a maneira de revelar as obras de Deus, sem definir se o destaque recai sobretudo no esplendor ou na honra apropriada. A tradução principal mantém a relação com glória, e a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” como plural corrente. A construção proverbial foi mantida concisa; “guardar o segredo” favorece a naturalidade, enquanto “revelar de modo glorioso” conserva o contraste e a ambiguidade lexical relevante por meio de nota.
