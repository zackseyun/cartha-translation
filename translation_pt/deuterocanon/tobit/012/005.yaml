translation:
  language: pt
  text: 'Então ele chamou o anjo e lhe disse[a]: “Tome a metade de tudo o que'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho da fonte grega fornecido para este versículo está incompleto e termina no meio da frase, depois de “de tudo o que”. Por isso, a tradução mantém a oração inacabada, sem acrescentar palavras que não constam do trecho fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: O aoristo de καλέω significa aqui “chamou” ou “convocou”; “chamou” é natural no fluxo narrativo e não acrescenta formalidade indevida.
- source_word: τὸν ἄγγελον
  choice: o anjo
  rationale: Embora ἄγγελος também possa significar “mensageiro”, em Tobit 12 a personagem é identificada como um ser celestial; por isso, “o anjo” expressa adequadamente sua identidade narrativa.
- source_word: Λάβε
  choice: Fique com
  rationale: O imperativo de λαμβάνω pode ser traduzido literalmente por “Tome”, mas, no contexto de oferecer uma parte como pagamento, “Fique com” é mais natural em português e preserva a força direta do imperativo.
- source_word: τὸ ἥμισυ
  choice: a metade
  rationale: A expressão significa “a metade”; o artigo é idiomático em português.
- source_word: πάντων
  choice: de tudo
  rationale: O genitivo plural πάντων tem sentido abrangente, e “de tudo” é uma formulação corrente e clara em português.
- source_word: ὧν
  choice: o que
  rationale: O pronome relativo inicia uma oração interrompida no excerto grego fornecido. “O que” liga naturalmente a oração em português sem completar o conteúdo ausente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Então” representa o καί narrativo com naturalidade; “lhe disse” evita a construção mais pesada “disse a ele”. A frase permanece deliberadamente incompleta, de acordo com a evidência grega fornecida.
