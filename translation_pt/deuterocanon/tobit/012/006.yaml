base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/006.yaml
  text: And calling the two of them privately[a], he said to them, “Bless God and give thanks to him; give him greatness, and give thanks to him before all the living for what he has done with you. It is good to bless God and to exalt his name, showing forth with honor the words of the works of God[c][b]; and do not be reluctant
translation:
  language: pt
  text: 'E, chamando os dois em particular, disse-lhes: “Bendigam a Deus e deem-lhe graças; proclamem a sua grandeza[a] e deem-lhe graças diante de todos os viventes pelo que ele fez com vocês[b]. É bom bendizer a Deus e exaltar o seu nome, dando a conhecer com honra o relato das obras de Deus; e não...”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “deem-lhe grandeza”; o sentido é atribuir ou reconhecer a grandeza de Deus.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode ser entendida como “pelo que ele fez por vocês”.
    reason: lexical_alternative
  - marker: c
    text: O testemunho grego fornecido termina aqui com “e não...”; a proibição continua no versículo seguinte.
    reason: textual_variant
lexical_decisions:
- source_word: καλέσας τοὺς δύο κρυπτῶς
  choice: chamando os dois em particular
  rationale: Reproduz a construção participial e entende κρυπτῶς como uma conversa reservada, sem sugerir necessariamente clandestinidade.
- source_word: Εὐλογεῖτε τὸν θεόν
  choice: Bendigam a Deus
  rationale: Mantém o idioma bíblico de bendizer a Deus e distingue εὐλογεῖν de um verbo genérico para louvar.
- source_word: ἐξομολογεῖσθε
  choice: deem-lhe graças
  rationale: Neste contexto, o verbo expressa reconhecimento público e agradecido pelas obras de Deus, não confissão de pecados.
- source_word: μεγαλωσύνην δίδοτε αὐτῷ
  choice: proclamem a sua grandeza
  rationale: Expressa de modo natural o sentido de atribuir ou reconhecer grandeza a Deus, preservando μεγαλωσύνη como 'grandeza' em vez de substituí-la por 'glória'.
- source_word: ἐνώπιον πάντων τῶν ζώντων
  choice: diante de todos os viventes
  rationale: Conserva a amplitude e o tom solene da expressão grega, em português compreensível.
- source_word: περὶ ὧν ἐποίησεν μεθʼ ὑμῶν
  choice: pelo que ele fez com vocês
  rationale: Preserva a construção incomum com μετά, sem decidir silenciosamente entre a ação de Deus 'com' eles e a ação realizada 'por' eles.
- source_word: ὑψοῦν τὸ ὄνομα αὐτοῦ
  choice: exaltar o seu nome
  rationale: Equivalente bíblico natural e preciso para honrar publicamente o nome de Deus.
- source_word: τοὺς λόγους τῶν ἔργων τοῦ θεοῦ ἐντίμως ὑποδεικνύντες
  choice: dando a conhecer com honra o relato das obras de Deus
  rationale: Resolve a expressão grega comprimida em português natural, mantendo tanto a proclamação das obras quanto a maneira honrosa de fazê-lo.
- source_word: καὶ μή
  choice: e não...
  rationale: Representa explicitamente a interrupção do testemunho grego fornecido sem inventar o complemento da proibição.
theological_decisions:
- issue: Sentido da bênção dirigida a Deus
  choice: Bendigam a Deus
  alternative: Louvem a Deus
  rationale: O grego emprega εὐλογεῖν; 'bendizer' preserva a forma própria do idioma bíblico sem reduzir seu sentido ao louvor genérico.
- issue: Sentido contextual de ἐξομολογεῖσθε
  choice: deem-lhe graças
  alternative: confessem-no / louvem-no
  rationale: A exortação trata do reconhecimento público das ações de Deus, favorecendo gratidão, embora o verbo possa ter outros sentidos em contextos diferentes.
- issue: Ação de Deus expressa por μεθʼ ὑμῶν
  choice: o que ele fez com vocês
  alternative: o que ele fez por vocês
  rationale: A tradução principal conserva a ambiguidade da preposição; a alternativa idiomática e teologicamente plausível é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se 'bendizer', 'exaltar' e 'viventes' pelo tom bíblico solene, enquanto 'em particular', 'com vocês' e 'dando a conhecer' asseguram naturalidade. A frase final permanece incompleta porque o texto-fonte apresentado se interrompe em καὶ μή.
