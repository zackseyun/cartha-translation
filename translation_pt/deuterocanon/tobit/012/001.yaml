base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/001.yaml
  text: Then Tobit called Tobias his son and said to him[a], “See, child, wages must be given to the man who went with you, and more must be added for him.”
translation:
  language: pt
  text: 'Então, Tobit chamou Tobias, seu filho, e lhe disse: “Veja, filho[a], é preciso pagar ao homem que foi com você a sua remuneração e dar-lhe algo a mais.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “criança” como forma afetuosa de tratamento; neste contexto, dirigido por um pai ao seu filho, “filho” é uma tradução natural. A formulação semítica paralela traz “meu filho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: É o equivalente narrativo direto e natural para chamar alguém para junto de si.
- source_word: Ὅρα
  choice: Veja
  rationale: Preserva o imperativo que chama a atenção de Tobias para a obrigação mencionada em seguida.
- source_word: τέκνον
  choice: filho
  rationale: Embora o termo grego signifique literalmente “criança” ou “filho”, no vocativo afetuoso dirigido por um pai a Tobias, “filho” é natural em português e mantém a relação familiar sem acrescentar o possessivo ausente no grego.
- source_word: μισθὸν
  choice: pagar
  rationale: Neste contexto, μισθός designa a remuneração devida pelos serviços do companheiro de viagem. A formulação verbal “é preciso pagar” é mais natural em português do que “dar um salário” e preserva a ideia de compensação devida.
- source_word: τῷ ἀνθρώπῳ
  choice: ao homem
  rationale: Mantém o referente masculino singular explícito no grego.
- source_word: τῷ συνελθόντι σοι
  choice: que foi com você
  rationale: Reproduz de modo claro e próximo ao grego a ideia daquele que acompanhou Tobias na viagem.
- source_word: προσθεῖναι αὐτῷ δεῖ
  choice: e dar-lhe algo a mais
  rationale: Expressa a necessidade impessoal indicada por δεῖ e o acréscimo à remuneração básica indicado por προσθεῖναι.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A obrigação impessoal do grego foi preservada em “é preciso”, enquanto “dar-lhe algo a mais” comunica com naturalidade a remuneração adicional.
