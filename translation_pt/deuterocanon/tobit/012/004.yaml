base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/004.yaml
  text: And the elder said, “It is justified for him.”
translation:
  language: pt
  text: 'E o ancião disse: “Isso lhe é devido.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρεσβύτης
  choice: o ancião
  rationale: Mantém a designação substantivada do grego, em registro digno e natural.
- source_word: Δικαιοῦται αὐτῷ
  choice: É justo que seja dele
  rationale: Expressa a construção concisa e algo impessoal do grego, indicando que aquilo de que se fala é legitimamente devido a ele, sem transformar a frase numa declaração sobre sua justificação pessoal.
theological_decisions:
- issue: Possível leitura de δικαιοῦται como justificação pessoal
  choice: Entender a expressão como juízo sobre o que é justo ou devido a ele
  alternative: “Ele é justificado”
  rationale: O dativo αὐτῷ e o contexto favorecem uma avaliação do que lhe cabe, não uma afirmação teológica acerca do estado justo da pessoa.
translation_notes:
  register: Português moderno, claro e digno. A formulação conserva a brevidade do grego, mas evita o pouco natural “é justificado para ele”.
