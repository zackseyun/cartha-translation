base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/004.yaml
  text: And when the two of them had been shut in together[a], Tobiah rose from the bed and said, “Get up, sister[b], and let us pray that the Lord may show us mercy.”
translation:
  language: pt
  text: 'Depois que os dois foram encerrados juntos[a], Tobias levantou-se da cama e disse: “Levante-se, irmã[b], e oremos para que o Senhor tenha misericórdia de nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “foram fechados juntos”. A expressão indica que o casal foi encerrado junto, provavelmente no aposento nupcial.
    reason: lexical_alternative
  - marker: b
    text: “Irmã” é a forma de tratamento usada no grego, refletindo a linguagem de parentesco empregada para a noiva neste contexto narrativo.
    reason: cultural_note
lexical_decisions:
- source_word: συνεκλείσθησαν
  choice: ficaram fechados juntos no quarto
  rationale: Preserva o sentido passivo de terem sido encerrados juntos e explicita com naturalidade o espaço indicado pelo contexto narrativo; a nota registra a forma mais literal.
- source_word: ἀμφότεροι
  choice: os dois
  rationale: Expressa de modo claro e natural que Tobias e Sara estavam juntos.
- source_word: ἀνέστη
  choice: se levantou
  rationale: Equivalente corrente e digno para a ação de levantar-se da cama.
- source_word: κλίνης
  choice: cama
  rationale: No contexto nupcial, 'cama' é o equivalente moderno mais claro.
- source_word: Ἀνάστηθι
  choice: Levante-se
  rationale: Reproduz o imperativo e corresponde à ação que Tobias acabara de realizar.
- source_word: ἀδελφή
  choice: irmã
  rationale: Mantém literalmente o vocativo grego e sua linguagem de parentesco aplicada à noiva, sem substituí-lo por uma interpretação.
- source_word: προσευξώμεθα
  choice: oremos
  rationale: Traduz de forma concisa e natural o subjuntivo exortativo de primeira pessoa do plural.
- source_word: ἐλεήσῃ
  choice: tenha misericórdia de nós
  rationale: Expressão portuguesa tradicional e plenamente compreensível que conserva a petição dirigida ao Senhor.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: É a tradução portuguesa estabelecida de κύριος neste contexto religioso.
theological_decisions:
- issue: O vocativo ἀδελφή dirigido por Tobias à sua noiva
  choice: Manter 'irmã' no texto principal
  alternative: Empregar uma forma interpretativa como 'minha querida' ou 'esposa'
  rationale: O grego diz explicitamente 'irmã'. A tradução preserva a linguagem de parentesco e afeto do relato sem apagar sua possível estranheza para leitores modernos; uma nota esclarece o uso.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação conserva a sequência narrativa, o passivo do verbo inicial e o vocativo culturalmente marcado.
