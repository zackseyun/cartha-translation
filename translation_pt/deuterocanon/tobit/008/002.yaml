base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/002.yaml
  text: As he went in[a], he remembered the words of Raphael, and he took the ashes of the incense and placed the fish’s heart and liver on them, and made them smoke.
translation:
  language: pt
  text: Ao entrar[a], ele se lembrou das palavras de Rafael, pegou as cinzas do incenso, colocou sobre elas o coração e o fígado do peixe e os fez fumegar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Enquanto ia”. O particípio grego pode indicar movimento de modo mais geral, mas o contexto imediato favorece o sentido de entrada no aposento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενος
  choice: Ao entrar
  rationale: O particípio indica movimento em curso. O contexto imediato da noite de núpcias favorece a ideia de entrada no aposento, sem acrescentar à narrativa o conteúdo da recensão mais longa.
- source_word: ἐμνήσθη
  choice: se lembrou
  rationale: Equivalente narrativo direto, que mantém a ligação com a instrução anterior de Rafael.
- source_word: λόγων
  choice: palavras
  rationale: Preserva o sentido lexical amplo; o contexto deixa claro que se trata das instruções de Rafael.
- source_word: τέφραν τῶν θυμιαμάτων
  choice: as cinzas do incenso
  rationale: Expressão natural em português para o resíduo da queima do incenso, mantendo a relação genitiva do grego.
- source_word: ἐπέθηκεν
  choice: colocou sobre elas
  rationale: Reproduz a ação de pôr algo sobre as cinzas; o referente de 'elas' fica claro no contexto.
- source_word: καρδίαν τοῦ ἰχθύος
  choice: o coração ... do peixe
  rationale: Mantém de modo claro e concreto a parte do peixe indicada no texto.
- source_word: ἧπαρ
  choice: fígado
  rationale: Equivalente anatômico padrão.
- source_word: ἐκάπνισεν
  choice: fez com que soltassem fumaça
  rationale: Expressa a ação causativa de produzir fumaça sem impor um termo ritual mais técnico do que o grego exige.
theological_decisions:
- issue: Relação entre a recensão grega breve e a tradição semítica ou recensão longa nesta cena
  choice: Traduzir a ação narrativa presente no grego e entender πορευόμενος, à luz do contexto, como entrada no aposento.
  alternative: Traduzir de modo mais indeterminado como 'enquanto ia' ou harmonizar o versículo com a cena de oração da tradição mais longa.
  rationale: O grego fornecido permanece como fonte primária. O contexto e a tradição paralela apoiam a ideia de entrada, mas não justificam inserir neste versículo o conteúdo adicional da recensão longa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita tecnicismo ritual e preserva a sequência concreta das ações.
