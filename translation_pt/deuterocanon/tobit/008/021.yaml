  text: and then[a], after taking half of his possessions, to go in good health to your father[b]; and the rest when I and my wife die.
translation:
  language: pt
  text: e então, depois de receber metade dos bens dele, partir em boa saúde para junto de seu pai[a]; e o restante, quando eu e minha mulher morrermos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “para o pai”; o contexto de fala direta favorece “para junto de seu pai”.
    reason: lexical_alternative
  - marker: b
    text: 'A frase final é abreviada no grego: literalmente, “e o restante, quando eu morrer, e minha mulher”. O sentido é que a parte restante dos bens seria entregue depois da morte de ambos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντα
  choice: depois de receber
  rationale: O particípio aoristo indica uma ação anterior à expressa pelo infinitivo πορεύεσθαι. “Depois de receber” preserva essa sequência e soa natural em português.
- source_word: τὸ ἥμισυ
  choice: metade
  rationale: Equivalente quantitativo direto e idiomático em português.
- source_word: τῶν ὑπαρχόντων αὐτοῦ
  choice: dos bens dele
  rationale: Ὑπάρχοντα designa bens ou posses. “Bens” é claro no contexto patrimonial, e “dele” preserva o pronome grego sem substituir silenciosamente seu referente.
- source_word: πορεύεσθαι
  choice: partir
  rationale: O infinitivo exprime deslocamento. “Partir” mantém a forma infinitiva exigida pela construção e se ajusta naturalmente ao contexto de retorno.
- source_word: μετὰ ὑγείας
  choice: em boa saúde
  rationale: Preserva o sentido explícito de saúde e bem-estar, sem reduzi-lo apenas à ideia mais ampla de segurança.
- source_word: πρὸς τὸν πατέρα
  choice: para junto de seu pai
  rationale: Embora o grego diga literalmente “para o pai”, o contexto de fala direta identifica o pai do destinatário. “Para junto de” comunica adequadamente o movimento em direção a uma pessoa.
- source_word: τὰ λοιπά
  choice: o restante
  rationale: Refere-se à parte remanescente dos bens e mantém a formulação concisa do grego.
- source_word: ὅταν ἀποθάνω καὶ ἡ γυνή μου
  choice: quando eu e minha mulher morrermos
  rationale: A oração grega é comprimida, com o verbo expresso na primeira pessoa do singular e subentendido para “minha mulher”. A tradução torna inteligível a referência à morte de ambos sem acrescentar uma ordem entre as duas mortes.
