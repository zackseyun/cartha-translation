base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/006.yaml
  text: You made Adam[a], and you gave him Eve as a helper and support, his wife; from these came the seed of mankind. You said, ‘It is not good for the man to be alone[b]; let us make for him a helper like himself.’
translation:
  language: pt
  text: 'Tu fizeste Adão e lhe deste Eva, sua esposa, como auxiliadora e amparo; deles surgiu a descendência da humanidade.[a] Tu disseste: “Não é bom que o homem esteja só; façamos para ele uma auxiliadora semelhante a ele”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a semente dos seres humanos”, imagem de prole ou linhagem.
    reason: lexical_alternative
  - marker: b
    text: Esta frase retoma Gênesis 2:18.
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησας
  choice: fizeste
  rationale: Traduz diretamente ποιέω e mantém o tom da oração sem acrescentar a nuance mais específica de “criar”.
- source_word: Ἀδάμ
  choice: Adão
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: ἔδωκας αὐτῷ
  choice: lhe deste
  rationale: Forma direta, natural e fiel à ideia de provisão divina.
- source_word: βοηθὸν
  choice: auxiliadora
  rationale: Preserva a referência pessoal a Eva e a ligação lexical com o relato de Gênesis, evitando reduzir seu papel a mera companhia.
- source_word: στήριγμα
  choice: amparo
  rationale: Expressa de modo corrente a ideia de apoio ou sustentação contida em στήριγμα.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sua esposa
  rationale: No contexto matrimonial, γυνή designa naturalmente a esposa; a construção portuguesa mantém a expressão em aposição a Eva.
- source_word: ἐκ τούτων ἐγενήθη
  choice: deles surgiu
  rationale: “Deles” explicita de maneira natural que a descendência procede do casal, preservando o plural demonstrativo grego.
- source_word: τὸ ἀνθρώπων σπέρμα
  choice: a descendência da humanidade
  rationale: Comunica o sentido genealógico de σπέρμα em português atual; a imagem concreta de “semente” é registrada em nota.
- source_word: Οὐ καλὸν εἶναι τὸν ἄνθρωπον μόνον
  choice: Não é bom que o homem esteja só
  rationale: Segue de perto o grego e conserva a reconhecível evocação de Gênesis 2:18.
- source_word: ποιήσωμεν
  choice: façamos
  rationale: O subjuntivo exortativo grego é adequadamente representado pela primeira pessoa do plural do subjuntivo em português.
- source_word: ὅμοιον αὐτῷ
  choice: semelhante a ele
  rationale: Mantém o sentido direto de semelhança no testemunho grego, sem importar formulações interpretativas derivadas do hebraico.
theological_decisions:
- issue: Sentido antropológico genérico de ἀνθρώπων
  choice: humanidade
  alternative: seres humanos; raça humana
  rationale: A expressão abrange toda a humanidade descendente de Adão e Eva. “Humanidade” é inclusivo, natural e não sugere que se trate apenas dos homens do sexo masculino.
- issue: Evocação de Gênesis 2:18
  choice: 'Conservar formulação próxima da alusão: “auxiliadora”, “Não é bom que o homem esteja só” e “façamos”'
  alternative: Empregar uma paráfrase contemporânea mais livre
  rationale: A oração retoma deliberadamente o relato da criação; a proximidade verbal permite que o leitor reconheça essa relação sem que a tradução acrescente uma interpretação doutrinária.
- issue: Plural de ποιήσωμεν
  choice: façamos
  alternative: farei; faremos
  rationale: Preserva o plural e a forma exortativa do texto grego, sem explicar teologicamente a identidade dos participantes implícitos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “tu” acompanha a oração dirigida diretamente a Deus; “auxiliadora” é um pouco mais solene, mas preserva a referência pessoal e a ligação com Gênesis.
