base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/003.yaml
  text: But when the demon smelled the odor[a], it fled to the remotest parts of Egypt, and the angel bound it.
translation:
  language: pt
  text: Mas, quando o demônio sentiu o cheiro, fugiu para as regiões mais altas do Egito[a], e o anjo o amarrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para as regiões mais distantes do Egito”; a expressão também pode ser entendida geograficamente como “para o Alto Egito”.
    reason: A expressão grega τὰ ἀνώτατα Αἰγύπτου admite uma leitura espacial literal e pode aludir ao Alto Egito; a nota preserva essa ambiguidade.
lexical_decisions:
- source_word: ὠσφράνθη
  choice: sentiu o cheiro
  rationale: 'O aoristo de ὀσφραίνομαι tem aqui sentido ativo: perceber pelo olfato. “Sentiu o cheiro” é natural e claro em português.'
- source_word: τὸ δαιμόνιον
  choice: o demônio
  rationale: No relato, designa o ser espiritual hostil que afligia Sara. “Demônio” corresponde diretamente ao termo grego e preserva o caráter pessoal do agente.
- source_word: τῆς ὀσμῆς
  choice: o cheiro
  rationale: ὀσμή designa cheiro ou odor. “Cheiro” mantém a referência concreta à fumaça dos órgãos queimados sem sugerir necessariamente uma fragrância agradável.
- source_word: ἔφυγεν
  choice: fugiu
  rationale: Expressa afastamento rápido diante de perigo ou repulsa; “fugiu” é conciso e idiomático.
- source_word: εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: para as regiões mais altas do Egito
  rationale: Conserva o sentido básico superlativo de ἀνώτατα sem transformar obrigatoriamente a expressão no topônimo técnico “Alto Egito”. A nota registra a possível nuance geográfica ou de distância.
- source_word: ἔδησεν
  choice: amarrou
  rationale: δέω significa prender ou amarrar. “Amarrou” comunica de modo atual e concreto a ação do anjo, sem especificar o meio.
- source_word: ὁ ἄγγελος
  choice: o anjo
  rationale: Mantém o singular definido do grego e não introduz o nome de Rafael, ausente desta oração.
theological_decisions:
- issue: Natureza de δαιμόνιον no contexto narrativo
  choice: demônio, como ser espiritual hostil e pessoal
  alternative: espírito maligno
  rationale: O agente cheira, foge e é amarrado pelo anjo. “Demônio” representa diretamente o texto sem atenuar sua afirmação sobrenatural.
- issue: Sentido geográfico de εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: regiões mais altas do Egito
  alternative: regiões mais distantes do Egito; Alto Egito
  rationale: A formulação conserva a imagem espacial do grego e evita decidir se a expressão funciona como designação técnica do Alto Egito ou se ressalta distância/extremidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção é concisa e acompanha a sequência narrativa grega; a nota evita resolver indevidamente a ambiguidade geográfica.
