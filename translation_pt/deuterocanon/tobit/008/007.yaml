base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/007.yaml
  text: And now[a], Lord, I am not taking this my sister because of sexual immorality, but in truth[b]. Command that I may find mercy and that I and she may grow old together.
translation:
  language: pt
  text: E agora, Senhor, não é por imoralidade sexual que tomo esta minha irmã[a], mas com sinceridade. Ordena que eu alcance misericórdia e que envelheçamos juntos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Esta minha irmã” conserva a linguagem de parentesco do livro para uma parente próxima que também é uma esposa legítima; também se poderia traduzir “esta minha parenta”.
    reason: cultural_note
  - marker: b
    text: 'O grego formula esta petição de modo compacto. Também pode ser traduzido: “Ordena que eu receba misericórdia e que cheguemos juntos à velhice”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: κύριε
  choice: Senhor
  rationale: É uma invocação direta a Deus; “Senhor” é a forma natural e tradicional da linguagem de oração em português.
- source_word: πορνείαν
  choice: imoralidade sexual
  rationale: O termo abrange conduta sexual ilícita. A expressão moderna mantém essa amplitude sem restringi-la a uma forma específica de transgressão.
- source_word: λαμβάνω
  choice: tomo
  rationale: O verbo significa literalmente “tomar” ou “receber” e, neste contexto, refere-se a tomar a mulher em casamento. A formulação preserva a imagem do grego sem acrescentar explicitamente “por esposa”.
- source_word: τὴν ἀδελφήν μου ταύτην
  choice: esta minha irmã
  rationale: Mantém a linguagem de parentesco do livro. Aqui “irmã” designa uma parente próxima que pode legitimamente tornar-se esposa; a nota evita que a expressão seja entendida como referência moderna a uma irmã imediata.
- source_word: ἐπʼ ἀληθείας
  choice: com sinceridade
  rationale: A expressão contrasta a motivação sexual ilícita com uma intenção verdadeira e íntegra. “Com sinceridade” comunica esse sentido de modo natural, sem eliminar a noção de verdade.
- source_word: ἐπίταξον
  choice: Ordena
  rationale: Reproduz a força do imperativo grego, literalmente “ordena”, em vez de suavizá-lo para “concede”.
- source_word: ἐλεῆσαί με
  choice: que eu alcance misericórdia
  rationale: Expressa a súplica para que a misericórdia seja dirigida ao orante, ao mesmo tempo que evita impor um agente não explicitado pela construção infinitiva grega.
- source_word: συγκαταγηρᾶσαι
  choice: envelheça junto com ela
  rationale: O verbo composto expressa chegar à velhice em companhia de outra pessoa; “envelheça junto com ela” é claro e fiel.
theological_decisions:
- issue: Sentido de “irmã” numa oração matrimonial
  choice: Manter “esta minha irmã” no texto principal como linguagem de parentesco própria do mundo narrativo.
  alternative: “esta minha parenta” ou “esta mulher da minha família”
  rationale: O grego diz literalmente “esta minha irmã”. Substituir o termo no texto eliminaria uma característica cultural e literária do livro; a explicação cabe melhor em nota.
- issue: Agente e coordenação na petição final
  choice: Traduzir a súplica como pedido para que Tobias alcance misericórdia e envelheça com Sara, assinalando em nota a construção compacta e ambígua.
  alternative: “Ordena que tenhas misericórdia de mim e dela e que envelheçamos juntos.”
  rationale: Os infinitivos gregos dependem de “ordena”, mas seus sujeitos e a função exata de αὐτήν não são plenamente explícitos. A redação principal é clara sem transformar a ambiguidade gramatical em afirmação teológica indevidamente precisa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão “não é por... que” torna natural o contraste da motivação, enquanto “Ordena” preserva a força incomum da oração grega. As notas documentam a linguagem cultural de parentesco e a ambiguidade sintática do pedido final.
