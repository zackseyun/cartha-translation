lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: saiu
  rationale: O particípio aoristo de ἐξέρχομαι indica que ela se deslocou para fora; em português, a coordenação «e ela saiu» reproduz com naturalidade a sequência narrativa.
- source_word: ἀπήγγειλεν
  choice: anunciou
  rationale: ἀπαγγέλλω significa comunicar, relatar ou anunciar uma notícia. «Anunciou» é natural neste contexto e conserva o caráter de transmissão da informação.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O pronome no dativo plural designa os destinatários da notícia; «lhes» é uma forma concisa e idiomática de expressar «a eles».
- source_word: ὅτι
  choice: que
  rationale: Introduz o conteúdo da notícia comunicada.
- source_word: ζῇ
  choice: ele estava vivo
  rationale: A forma presente de ζάω significa literalmente «vive» ou «está vivo». Após o verbo narrativo no passado, «estava vivo» é a formulação mais natural em português; o sujeito masculino, implícito em grego, é recuperado do contexto.
