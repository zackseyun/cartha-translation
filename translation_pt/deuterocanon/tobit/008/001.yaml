base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/001.yaml
  text: And when they had finished dining[b][a], they brought Tobiah in to her.
translation:
  language: pt
  text: Quando terminaram de jantar, levaram Tobias até ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “levaram Tobias até ela”. A tradição semítica paralela amplia a cena com detalhes sobre a preparação do quarto, a entrada do casal e o fechamento da porta.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Quando
  rationale: Introduz o acontecimento seguinte e expressa naturalmente a relação temporal; a sequência narrativa indicada por δέ fica implícita no português corrente.
- source_word: συνετέλεσαν δειπνοῦντες
  choice: terminaram de jantar
  rationale: Reproduz de modo claro e natural a ideia de concluir a refeição principal, sem impor uma designação culturalmente mais específica.
- source_word: εἰσήγαγον
  choice: levaram
  rationale: O verbo indica conduzir ou levar alguém para dentro ou à presença de outra pessoa. Em português, “levaram ... até ela” comunica o movimento sem acrescentar um sujeito não expresso.
- source_word: Τωβείαν
  choice: Tobias
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecível do nome, adequada ao título português do livro e à legibilidade do texto.
- source_word: πρὸς αὐτήν
  choice: até ela
  rationale: Preserva o movimento em direção a Sara expresso por πρός com acusativo, sem explicitar além do grego o propósito ou a intimidade do encontro.
theological_decisions:
- issue: Forma do nome Τωβείαν
  choice: Tobias
  alternative: Tobias (forma semítica transliterada como Tobiá)
  rationale: A forma tradicional portuguesa “Tobias” mantém reconhecimento amplo. A escolha é onomástica, não doutrinária, e não altera a identidade do personagem.
- issue: Grau de explicitação da cena nupcial
  choice: levaram Tobias até ela
  alternative: levaram Tobias para ficar com ela
  rationale: O texto grego apenas indica movimento em direção a ela; a tradução evita acrescentar uma finalidade conjugal que, embora contextual, não está expressa nesta oração.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa simples. “Terminaram de jantar” é corrente em diferentes variedades do português e acessível ao leitor brasileiro. O sujeito indeterminado de “levaram” preserva a ausência de sujeito explícito no grego.
