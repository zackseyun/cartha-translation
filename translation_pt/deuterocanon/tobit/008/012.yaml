  yaml_path: translation/deuterocanon/tobit/008/012.yaml
  text: And Edna said to his wife, “Send one of the servant girls, and let them see whether he is alive; but if not, so that we may bury him and no one may know.”
translation:
  language: pt
  text: 'E Edna disse à sua mulher: “Mande uma das servas, e que elas vejam[a] se ele está vivo; mas, se não, para que o sepultemos e ninguém fique sabendo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “que elas vejam”, com verbo no plural, embora Edna tenha acabado de dizer “uma das servas”. A tradução conserva essa forma em vez de ajustá-la ao singular.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπόστειλον
  choice: Mande
  rationale: O imperativo de ἀποστέλλω é expresso de modo natural e direto em português; a forma de tratamento é coerente com «sua mulher».
- source_word: μίαν τῶν παιδισκῶν
  choice: uma das servas
  rationale: παιδίσκη designa uma criada ou serva doméstica. «Servas» preserva o gênero e a posição doméstica sem afirmar além do contexto imediato uma condição jurídica específica.
- source_word: ἰδέτωσαν
  choice: que elas vejam
  rationale: Preserva o imperativo de terceira pessoa do plural transmitido pelo grego, apesar de o antecedente imediato ser singular. A nota registra essa incongruência sem corrigi-la silenciosamente.
- source_word: εἰ ζῇ
  choice: se ele está vivo
  rationale: Formulação idiomática em português para verificar a condição de alguém.
- source_word: εἰ δὲ μή
  choice: caso contrário
  rationale: 'Expressa naturalmente a alternativa elíptica: se ele não estiver vivo.'
- source_word: ἵνα θάψωμεν αὐτὸν καὶ μηδεὶς γνῷ
  choice: poderemos sepultá-lo sem que ninguém fique sabendo
  rationale: Reproduz a finalidade prática e a intenção de manter o fato em segredo. «Sem que» rege adequadamente o subjuntivo e liga em português corrente os dois objetivos coordenados no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva-se a oscilação singular/plural do texto grego, devidamente explicada em nota.
