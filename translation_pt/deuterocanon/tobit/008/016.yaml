base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/016.yaml
  text: And Raguel blessed God[a], saying, “Blessed are you, O God, with every blessing; and may your holy ones bless you, and all your creatures[c][b]; may all your angels and your chosen ones bless you forever.”
translation:
  language: pt
  text: 'E Raguel bendisse a Deus, dizendo: “Bendito és tu, ó Deus, com toda bênção! Que os teus santos[a] te bendigam, bem como todas as tuas criaturas[b]; que todos os teus anjos e os teus escolhidos[c] te bendigam para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os teus seres santos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “toda a tua criação”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os teus eleitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγησεν / Εὐλογητὸς / εὐλογείτωσαν
  choice: bendisse / Bendito / bendigam
  rationale: Mantém em português a repetição da mesma raiz verbal, importante para o tom litúrgico e doxológico do grego.
- source_word: ἐν πάσῃ εὐλογίᾳ
  choice: com toda bênção
  rationale: Conserva o sentido abrangente e a formulação compacta do grego, sem acrescentar a ideia interpretativa de ser 'digno' de bênção.
- source_word: οἱ ἅγιοί σου
  choice: os teus santos
  rationale: Expressa o sentido básico de ἅγιοι em linguagem bíblica corrente, sem determinar se o grupo é humano, celestial ou ambos.
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: todas as tuas criaturas
  rationale: Reproduz o plural grego e comunica naturalmente a ideia de seres ou coisas criadas.
- source_word: οἱ ἐκλεκτοί σου
  choice: os teus escolhidos
  rationale: É transparente em português atual e evita a carga sistemática que 'eleitos' pode adquirir, preservando o sentido fundamental de pessoas ou seres escolhidos.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente português natural da expressão de duração perpétua neste contexto doxológico.
theological_decisions:
- issue: Identidade dos 'santos' e dos 'escolhidos' numa enumeração que também menciona anjos
  choice: Manter as designações gerais 'santos' e 'escolhidos', sem identificar seus referentes.
  alternative: Entendê-los especificamente como seres celestiais ou como fiéis humanos.
  rationale: O grego não define esses grupos, e os anjos são mencionados separadamente. A tradução preserva essa abertura teológica.
translation_notes:
  register: Português moderno, claro e solene, com cadência de oração. A construção menos habitual 'com toda bênção' foi preservada por proximidade ao grego e para não explicar além do texto. Os marcadores foram colocados junto aos termos a que suas notas se referem.
