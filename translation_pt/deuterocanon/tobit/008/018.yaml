lexical_decisions:
- source_word: ἐκέλευσεν
  choice: ordenou
  rationale: O aoristo de κελεύω expressa uma ordem. “Ordenou” preserva a força de autoridade e é natural no português atual.
- source_word: τοῖς οἰκέταις
  choice: aos servos
  rationale: οἰκέτης designa pessoas que servem numa casa. “Servos” é conciso e adequado ao contexto, sem especificar além do necessário sua condição jurídica.
- source_word: χῶσαι
  choice: que enchessem
  rationale: O infinitivo de χόω indica cobrir ou encher com terra. Com τάφος, refere-se concretamente a encher a cova previamente aberta, não a sepultar um corpo.
- source_word: τὸν τάφον
  choice: a cova
  rationale: τάφος pode significar sepultura, túmulo ou cova. Neste contexto, trata-se da abertura preparada para um enterro; “cova” também combina naturalmente com o verbo “encher”.
