  terminology: “Bendito”, “misericórdia” e “Soberano” são escolhas adequadas. “Soberano” conserva a distinção lexical de δέσποτα em relação a κύριος sem introduzir leitura doutrinária. “Dois filhos únicos” pode funcionar como masculino genérico para o casal misto; a nota deve nomear Tobias e Sara para evitar que “cada um ... filho único” pareça aplicar a forma masculina individualmente a ambos.
