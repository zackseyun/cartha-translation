base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/017.yaml
  text: Blessed are you[a], because you have made me rejoice, and it has not happened to me as I suspected; rather, according to your abundant mercy, you have acted with us. Blessed are you, because you have shown mercy to two only children. Show them mercy, Master[c][b]; bring their life to completion in health with gladness and mercy.
translation:
  language: pt
  text: Bendito és tu, porque me alegraste, e não me aconteceu como eu suspeitava; pelo contrário, agiste conosco segundo a tua grande misericórdia. Bendito és tu, porque tiveste misericórdia de dois filhos únicos.[a] Tem misericórdia deles, Soberano;[b] leva a vida deles a pleno termo, com saúde, alegria e misericórdia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Tobias era filho único, e Sara, filha única, de seus respectivos pais.
    reason: cultural_note
  - marker: b
    text: 'Ou: “Mestre”. O termo grego enfatiza autoridade soberana e não é a palavra geralmente traduzida por “Senhor”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “faz que completem a vida”. O grego emprega “vida” no singular, com sentido coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Bendito
  rationale: Preserva a fórmula de bênção dirigida a Deus e seu tom litúrgico, sem transformá-la numa exortação explícita ao louvor.
- source_word: ηὔφρανάς
  choice: me fizeste alegrar
  rationale: Mantém o sentido causativo de εὐφραίνω e comunica com clareza que Deus produziu a alegria do orante.
- source_word: ὑπενόουν
  choice: eu suspeitava
  rationale: Conserva a possível nuance de apreensão de ὑπονοέω sem explicitar além do grego que o orante temia esse desfecho.
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: segundo a tua grande misericórdia
  rationale: Expressa o padrão ou medida da ação divina e preserva a ênfase na magnitude da misericórdia.
- source_word: ἐποίησας μεθʼ ἡμῶν
  choice: agiste conosco
  rationale: Mantém deliberadamente ampla a ação indicada pelo idioma grego e reproduz sua construção relacional.
- source_word: ἠλέησας
  choice: tiveste misericórdia de
  rationale: É uma formulação portuguesa natural e diretamente correspondente ao verbo ἐλεέω.
- source_word: δύο μονογενεῖς
  choice: dois filhos únicos
  rationale: No contexto narrativo, refere-se a duas pessoas, cada qual filha única de seus respectivos pais, e não a uma afirmação metafísica.
- source_word: δέσποτα
  choice: Soberano
  rationale: Preserva a noção de autoridade absoluta e distingue δέσποτα de κύριος; em português, 'Soberano' é uma invocação divina digna e natural.
- source_word: συντέλεσον τὴν ζωὴν αὐτῶν
  choice: leva a vida deles à plenitude
  rationale: Comunica a oração para que o curso de vida compartilhado chegue ao seu pleno termo, mantendo o singular coletivo do grego.
- source_word: ἐν ὑγείᾳ
  choice: com saúde
  rationale: Forma corrente em português para indicar que a vida prossiga em estado de saúde.
- source_word: μετὰ εὐφροσύνης καὶ ἐλέους
  choice: com saúde, alegria e misericórdia
  rationale: A coordenação natural em português integra os três elementos, preservando tanto a alegria quanto a repetição temática da misericórdia.
theological_decisions:
- issue: Título δέσποτα dirigido a Deus
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: Evita confundir δέσποτα com κύριος e expressa sua ênfase em autoridade soberana. 'Mestre' seria lexicalmente possível, mas pode sugerir sobretudo um professor no português atual.
- issue: Sentido de μονογενεῖς
  choice: dois filhos únicos
  alternative: dois unigênitos; duas pessoas únicas
  rationale: O contexto trata da condição familiar de Tobias e Sara, cada um filho único de seus pais; não se deve importar para este texto um sentido cristológico posterior.
- issue: Alcance de συντέλεσον τὴν ζωὴν αὐτῶν
  choice: leva a vida deles à plenitude
  alternative: completa a vida deles; concede-lhes completar a vida
  rationale: A formulação preserva a petição por uma vida levada ao pleno termo sem decidir de modo estreito entre duração completa e realização plena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo da oração e a repetição de “misericórdia”. Os marcadores foram posicionados imediatamente após as expressões que explicam.
