  text: E celebrou para eles uma festa de casamento durante catorze dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E celebrou para eles um casamento durante catorze dias». A palavra grega traduzida como «festa de casamento» pode designar tanto o casamento em si quanto a festa ou celebração do casamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: celebrou
  rationale: Com γάμον como objeto, ποιέω forma uma expressão idiomática que significa realizar ou celebrar um casamento e sua festa; «celebrou» é natural em português e preserva esse sentido.
- source_word: αὐτοῖς
  choice: para eles
  rationale: O dativo indica os beneficiários da celebração; o contexto identifica o casal recém-casado.
- source_word: γάμον
  choice: uma festa de casamento
  rationale: γάμος pode designar tanto o casamento quanto a festa ou celebração nupcial. A duração de catorze dias favorece aqui o sentido festivo.
- source_word: ἡμερῶν δέκα τεσσάρων
  choice: durante catorze dias
  rationale: O genitivo temporal expressa duração; «durante catorze dias» comunica isso com clareza e naturalidade.
