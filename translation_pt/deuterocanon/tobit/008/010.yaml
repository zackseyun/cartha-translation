  text: And Raguel got up[a], went and dug a grave, saying, “Perhaps he too may die.”
translation:
  language: pt
  text: 'E Raguel se levantou, foi e cavou uma sepultura, dizendo: “E se este também morrer?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: O particípio aoristo introduz a sequência narrativa e indica que Raguel se ergueu para agir; “se levantou” é natural e fiel.
- source_word: ἐπορεύθη
  choice: foi
  rationale: O verbo expressa deslocamento. “Foi” preserva o sentido sem acrescentar “para fora”, elemento não expresso no grego.
- source_word: ὤρυξεν τάφον
  choice: cavar uma sepultura
  rationale: 'ὀρύσσω indica cavar, e τάφος, nesse contexto, é a cova destinada ao sepultamento. A construção com infinitivo em português apresenta naturalmente as ações estreitamente ligadas: ele foi com o propósito de cavá-la.'
- source_word: Μὴ καὶ οὗτος ἀποθάνῃ
  choice: E se este também morrer?
  rationale: A construção com μή e subjuntivo expressa apreensão diante de uma possibilidade temida. “E se...?” reproduz em português corrente tanto a incerteza quanto o temor de Raguel; “este também” conserva o demonstrativo e a comparação implícita com os maridos anteriores.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A fala direta é apresentada como pergunta apreensiva, sem eliminar a ambiguidade própria da construção grega nem explicitar no texto os noivos anteriores.
