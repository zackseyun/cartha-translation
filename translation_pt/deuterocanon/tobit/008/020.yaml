base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/020.yaml
  text: And Raguel said to him under oath[a], before the days of the wedding were completed, that he should not leave unless the fourteen days of the wedding were fulfilled,
translation:
  language: pt
  text: E Raguel lhe disse sob juramento[a], antes que terminassem os dias da festa de casamento, que não partisse enquanto não se completassem os catorze dias da festa de casamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com juramento”. O advérbio grego indica que Raguel confirmou essa determinação por juramento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ συντελεσθῆναι
  choice: antes que terminassem
  rationale: Expressa de modo natural em português o tempo anterior à conclusão do período, preservando o sentido do infinitivo passivo.
- source_word: τὰς ἡμέρας τοῦ γάμου
  choice: os dias da festa de casamento
  rationale: No contexto, γάμος designa as celebrações nupciais prolongadas; a formulação evita sugerir que o casamento em si durava vários dias.
- source_word: ἐνόρκως
  choice: sob juramento
  rationale: 'Reproduz com concisão o valor adverbial: Raguel vinculou sua declaração por meio de juramento.'
- source_word: μὴ ἐξελθεῖν αὐτόν
  choice: que não partisse
  rationale: Transmite o conteúdo da determinação juramentada e, no contexto, o sentido de não ir embora.
- source_word: ἐὰν μὴ πληρωθῶσιν
  choice: enquanto não se completassem
  rationale: A construção grega é literalmente condicional, mas nesta proibição tem força temporal de limite; a tradução conserva a ideia de que a partida só poderia ocorrer após o período completo.
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: os catorze dias da festa de casamento
  rationale: Mantém explicitamente o número e a referência ao período completo das celebrações nupciais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Festa de casamento” explicita o valor contextual de γάμος e torna inteligível o período de catorze dias; “partisse” evita o sentido excessivamente literal de apenas sair de um recinto.
