base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/005.yaml
  text: And Tobiah began to say[a], “Blessed are you, O God of our fathers, and blessed is your holy and glorious name forever; may the heavens and all your creation bless you.”
translation:
  language: pt
  text: 'E Tobias começou a dizer: “Bendito és tu, ó Deus de nossos pais, e bendito é o teu nome santo e glorioso para sempre. Que os céus e todas as tuas criaturas[a] te bendigam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a tua criação”. A expressão grega pode abranger tudo o que Deus criou, e não apenas os seres vivos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο Τωβίας λέγειν
  choice: Tobias começou a dizer
  rationale: Preserva o início narrativo da oração expresso pela construção com ἄρχομαι e infinitivo, em português natural.
- source_word: Εὐλογητὸς εἶ
  choice: Bendito és tu
  rationale: Mantém a fórmula litúrgica dirigida a Deus e o tom elevado sem recorrer a linguagem arcaica excessiva.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: ó Deus de nossos pais
  rationale: O vocativo explícito é natural na oração, e “pais” conserva o termo masculino πατέρων e a fórmula ancestral do grego.
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔνδοξον
  choice: o teu nome santo e glorioso
  rationale: Conserva os dois atributos em uma ordem fluente e fiel ao grego.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a expressão portuguesa corrente para a duração contínua indicada pelo idioma grego.
- source_word: εὐλογησάτωσάν σε
  choice: Que ... te bendigam
  rationale: Reproduz naturalmente o valor volitivo ou jussivo do imperativo aoristo no contexto de oração.
- source_word: οἱ οὐρανοὶ
  choice: os céus
  rationale: Mantém o plural do grego e sua ressonância poética e bíblica.
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: todas as tuas criaturas
  rationale: Preserva o plural κτίσεις e permite referência ampla às coisas ou aos seres criados; a nota registra a alternativa coletiva “toda a tua criação”.
theological_decisions:
- issue: Linguagem ancestral marcada por gênero
  choice: nossos pais
  alternative: nossos antepassados
  rationale: πατέρων significa literalmente “pais”; a tradução conserva a forma da fórmula tradicional sem neutralizá-la.
- issue: Alcance de κτίσεις no louvor cósmico
  choice: todas as tuas criaturas
  alternative: toda a tua criação
  rationale: A opção principal preserva o substantivo plural e sua possível referência a todos os seres ou entes criados, enquanto a nota mantém aberta a leitura coletiva de toda a ordem criada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A oração conserva leve elevação litúrgica em “Bendito és tu” e “ó Deus”, sem arcaísmos desnecessários.
