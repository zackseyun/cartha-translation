lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção narrativa simples que preserva o fluxo paratático do grego sem acrescentar uma nuance temporal explícita.
- source_word: ἦλθεν
  choice: voltou
  rationale: O aoristo de ἔρχομαι indica a chegada de Raguel à própria casa; em português, «voltou» expressa naturalmente esse movimento no contexto, sem usar «entrou», que tornaria explícito além do necessário o movimento já indicado por εἰς.
- source_word: Ῥαγουὴλ
  choice: Raguel
  rationale: Transliteração portuguesa tradicional e diretamente correspondente à forma grega Ῥαγουήλ.
- source_word: εἰς
  choice: para
  rationale: Com o acusativo, indica movimento em direção ao interior ou destino. Com «voltar», «para sua casa» é a formulação idiomática natural em português.
- source_word: τὴν οἰκίαν
  choice: sua casa
  rationale: Neste contexto de deslocamento físico, οἰκία designa concretamente a casa; o possessivo incorpora de modo natural a referência de ἑαυτοῦ.
- source_word: ἑαυτοῦ
  choice: sua
  rationale: O genitivo reflexivo remete a Raguel. «Sua» é natural; «sua própria» explicita mais fortemente o valor reflexivo, mas pode sugerir uma ênfase contrastiva que o contexto não exige.
