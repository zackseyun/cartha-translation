- source_word: Ὡς δὲ
  choice: E, quando
  rationale: A combinação introduz a etapa seguinte da narrativa com valor temporal; «E, quando» preserva tanto a continuidade quanto a relação temporal em português natural.
- source_word: προσήγγισαν
  choice: se aproximaram
  rationale: O aoristo expressa o ato de chegar perto de um lugar. «Se aproximaram» é claro, corrente e não implica necessariamente que já tenham entrado na cidade.
- source_word: τῇ Ῥάγῃ
  choice: de Rages
  rationale: O dativo indica o lugar do qual eles se aproximaram. «Rages» mantém a forma tradicional do topônimo em português, sem traduzir o nome próprio.
