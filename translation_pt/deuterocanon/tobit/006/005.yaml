base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/005.yaml
  text: And the angel said to him, “Cut open the fish, and after taking the heart and the liver and the gall, put them away safely.”
translation:
  language: pt
  text: 'E o anjo lhe disse: “Abra o peixe e, depois de retirar o coração, o fígado e a bílis[a], guarde-os em segurança.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o fel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάτεμε
  choice: Abra
  rationale: O imperativo de ἀνατέμνω indica cortar ou abrir por meio de corte. Em português, “abra o peixe” expressa com naturalidade a ação necessária para retirar os órgãos, sem soar excessivamente técnico.
- source_word: τὸν ἰχθύν
  choice: o peixe
  rationale: Tradução direta do substantivo com artigo definido.
- source_word: λαβὼν
  choice: depois de retirar
  rationale: O particípio aoristo indica uma ação anterior ao imperativo principal. “Depois de retirar” preserva essa sequência; “retirar” é idiomático para a extração dos órgãos.
- source_word: τὴν καρδίαν
  choice: o coração
  rationale: Sentido anatômico comum e direto.
- source_word: τὸ ἧπαρ
  choice: o fígado
  rationale: Termo anatômico comum e direto.
- source_word: τὴν χολὴν
  choice: a bílis
  rationale: χολή pode indicar a bílis ou o fel. “Bílis” é claro e atual em português, sem especificar indevidamente a vesícula biliar; a alternativa tradicional é registrada em nota.
- source_word: θὲς
  choice: guarde-os
  rationale: O imperativo significa pôr ou colocar. No contexto, os itens são separados para uso posterior; “guarde-os” comunica esse propósito com naturalidade.
- source_word: ἀσφαλῶς
  choice: em segurança
  rationale: Reproduz o sentido de modo seguro ou protegido e forma uma expressão portuguesa natural com “guarde-os”.
theological_decisions:
- issue: Identificação do falante como ὁ ἄγγελος
  choice: o anjo
  alternative: o mensageiro
  rationale: Embora ἄγγελος também possa significar “mensageiro”, a personagem é apresentada no enredo de Tobit como um ser angelical. “O anjo” preserva o sentido narrativo sem acrescentar afirmações doutrinárias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a anterioridade do particípio grego, e a nota mantém a amplitude lexical de χολή.
