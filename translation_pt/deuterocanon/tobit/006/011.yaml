  text: The angel said to the young man, “Brother, today we will lodge with Raguel. He is your relative, and he has a daughter named Sarah.”
translation:
  language: pt
  text: 'O anjo disse ao jovem: “Irmão, hoje passaremos a noite com Raguel. Ele é seu parente e tem uma filha chamada Sara.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδαρίῳ
  choice: jovem
  rationale: No contexto, Tobias já tem idade para viajar e se casar; “jovem” expressa isso naturalmente sem sugerir uma criança.
- source_word: Ἀδελφέ
  choice: Irmão
  rationale: Preserva a forma fraterna de tratamento direto presente no grego.
- source_word: σήμερον
  choice: hoje
  rationale: Equivalente temporal direto e corrente.
- source_word: αὐλισθησόμεθα
  choice: passaremos a noite
  rationale: O verbo indica alojar-se ou parar para pernoitar; a expressão é natural em português e não especifica indevidamente que acampariam ao ar livre.
- source_word: παρὰ Ῥαγουήλῳ
  choice: na casa de Raguel
  rationale: Neste contexto, παρά com dativo indica hospedagem junto à pessoa, provavelmente em sua casa; esta formulação comunica o sentido de modo claro e idiomático.
- source_word: συγγενής
  choice: parente
  rationale: Termo moderno e abrangente para a relação de parentesco indicada pelo grego.
- source_word: θυγάτηρ
  choice: filha
  rationale: Equivalente familiar direto e inequívoco.
- source_word: ὄνομα Σάρρα
  choice: chamada Sara
  rationale: Reproduz naturalmente em português a construção grega que informa o nome da filha.
