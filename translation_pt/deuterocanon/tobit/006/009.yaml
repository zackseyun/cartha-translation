lexical_decisions:
- source_word: χολή
  choice: bile
  rationale: Equivalente direto e corrente para a substância indicada no contexto.
- source_word: ἐγχρῖσαι
  choice: aplique
  rationale: Expressa naturalmente a ação de passar ou aplicar uma substância sobre a parte afetada, sem especificar além do grego.
- source_word: ἄνθρωπον ὃς ἔχει
  choice: em quem tiver
  rationale: Formulação inclusiva e natural em português; o substantivo grego é genérico neste contexto.
- source_word: λευκώματα
  choice: manchas brancas
  rationale: Preserva a descrição visual genérica de opacidades ou películas esbranquiçadas sem impor um diagnóstico médico moderno.
- source_word: ἰαθήσεται
  choice: será curada
  rationale: Mantém a voz passiva e a afirmação futura do texto grego; a concordância retoma explicitamente 'essa pessoa'.
