base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/014.yaml
  text: Then the young man said to the angel[a], “Azariah, brother, I have heard that the girl has been given to seven men[b], and that all of them were hindered in the bridal chamber.”
translation:
  language: pt
  text: 'Então o jovem disse ao anjo: “Azarias, irmão, ouvi dizer que a moça foi dada a sete homens[a] e que todos eles foram impedidos no quarto nupcial[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sete maridos”. O grego diz “a sete homens”, mas o contexto matrimonial permite o sentido mais específico.
    reason: lexical_alternative
  - marker: b
    text: O grego emprega uma expressão concisa com o sentido de impedir ou barrar. No contexto da narrativa, os noivos anteriores não conseguiram consumar o casamento porque morreram no quarto nupcial.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: o jovem
  rationale: Embora o diminutivo possa significar “menino”, Tobias já tem idade para se casar; “o jovem” é natural e adequado ao contexto.
- source_word: τῷ ἀγγέλῳ
  choice: ao anjo
  rationale: No contexto de Tobit, a personagem é um ser angelical; “anjo” expressa o sentido contextual de ἄγγελος.
- source_word: ἀδελφέ
  choice: irmão
  rationale: Mantém a forma direta e calorosa de tratamento do vocativo grego, sem decidir se indica parentesco literal.
- source_word: ἀκήκοα
  choice: ouvi dizer
  rationale: O perfeito indica informação recebida que permanece relevante; a expressão portuguesa comunica de modo natural esse valor.
- source_word: τὸ κοράσιον
  choice: a moça
  rationale: κοράσιον designa uma menina ou jovem mulher; “moça” é corrente, respeitoso e apropriado ao contexto matrimonial.
- source_word: δεδόσθαι
  choice: foi dada
  rationale: Conserva a imagem do verbo δίδωμι e deixa que o contexto matrimonial esclareça em que sentido ela foi dada.
- source_word: ἑπτὰ ἀνδράσιν
  choice: a sete homens
  rationale: ἀνήρ pode significar “homem” ou “marido”. “Homens” preserva a amplitude lexical, enquanto a nota registra a leitura contextual mais específica.
- source_word: ἐν τῷ νυμφῶνι
  choice: no quarto nupcial
  rationale: Tradução clara e atual para o aposento associado à celebração e consumação do casamento.
- source_word: ἀποκωλῦσαι
  choice: foram impedidos
  rationale: O verbo expressa impedir ou obstar. A formulação passiva em português preserva a concisão e evita introduzir no texto principal a morte dos noivos, informação conhecida pelo contexto mais amplo, mas não enunciada diretamente pelo verbo.
theological_decisions:
- issue: Se a tradução deve declarar explicitamente que os sete homens morreram
  choice: Manter no texto principal a ideia de impedimento
  alternative: “foram mortos” ou “morreram”
  rationale: O grego emprega um verbo de impedir, não um verbo explícito de matar. Embora a narrativa mais ampla explique a morte dos homens, inseri-la aqui resolveria a expressão comprimida com informação externa à oração.
- issue: Se ἑπτὰ ἀνδράσιν deve ser especificado como “sete maridos”
  choice: “sete homens” no texto, com “sete maridos” em nota
  alternative: “sete maridos”
  rationale: O contexto matrimonial favorece “maridos”, mas o substantivo grego também significa simplesmente “homens”; a solução mantém visível essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Moça” evita o tom arcaico de “donzela”; “quarto nupcial” comunica com clareza o referente histórico. A pontuação conserva o discurso direto sem sobrecarregar a frase.
