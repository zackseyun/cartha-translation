base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/002.yaml
  text: As they were traveling on the road[a], they came by evening to the Tigris River, and they camped there.
translation:
  language: pt
  text: Enquanto seguiam viagem[a], chegaram ao rio Tigre ao cair da tarde e acamparam ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste ponto, o texto grego breve diz simplesmente que eles chegaram ao Tigre ao cair da tarde e acamparam ali. A tradição semítica e a recensão longa ampliam imediatamente a cena com o episódio do peixe, narrado em seguida.
    reason: textual_variant
lexical_decisions:
- source_word: πορευόμενοι τὴν ὁδόν
  choice: seguiam viagem
  rationale: A expressão comunica o deslocamento em curso de modo natural em português, sem tornar desnecessariamente concreto o idiomatismo grego com ὁδός.
- source_word: ἦλθον ἑσπέρας
  choice: chegaram ... ao cair da tarde
  rationale: O verbo indica a chegada, e o genitivo temporal ἑσπέρας situa o acontecimento no período vespertino. A formulação é corrente e digna.
- source_word: ἐπὶ τὸν Τίγριν ποταμόν
  choice: ao rio Tigre
  rationale: Com verbo de movimento, ἐπί assinala a chegada ao rio. A ordem portuguesa natural é «rio Tigre».
- source_word: ηὐλίζοντο
  choice: acamparam
  rationale: O verbo denota alojar-se ou passar a noite durante uma viagem, muitas vezes ao ar livre; «acamparam» se ajusta ao cenário junto ao rio.
- source_word: ἐκεῖ
  choice: ali
  rationale: O advérbio retoma de forma direta e natural o local recém-mencionado, o rio Tigre.
