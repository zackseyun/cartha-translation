translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Seguiam viagem» preserva o aspecto contínuo sem reproduzir rigidamente o idiomatismo grego; «ao cair da tarde» dá fluidez narrativa ao marcador temporal.
