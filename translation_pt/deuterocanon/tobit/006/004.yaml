  text: But the angel said to him, “Grab the fish.” So the boy seized the fish and threw it up onto the land.
translation:
  language: pt
  text: 'Mas o anjo lhe disse: “Agarre o peixe.” Então o rapaz segurou o peixe e lançou-o para a terra firme.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιλαβοῦ τοῦ ἰχθύος
  choice: Agarre o peixe
  rationale: 'O imperativo de ἐπιλαμβάνομαι pede ação física imediata: agarrar ou apoderar-se do peixe. “Agarre” é natural, direto e preserva a força do grego.'
- source_word: τὸ παιδάριον
  choice: o rapaz
  rationale: Designa aqui o jovem Tobias. “Rapaz” é corrente e evita o sentido excessivamente infantil que “menino” poderia sugerir.
- source_word: ἀνέβαλεν αὐτὸν ἐπὶ τὴν γῆν
  choice: o lançou para cima, em terra firme
  rationale: ἀναβάλλω expressa o movimento de lançar ou erguer para cima; ἐπὶ τὴν γῆν indica o destino em solo seco. A formulação conserva ambos os elementos sem reduzir o verbo a simplesmente “puxar”.
