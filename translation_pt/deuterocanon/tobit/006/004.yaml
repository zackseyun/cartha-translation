    issue: Formulação final espacialmente ambígua e pouco idiomática
    rationale: «o lançou para cima, em terra firme» não exprime naturalmente em português o complemento ἐπὶ τὴν γῆν. A revisão explicita o destino do lançamento sem acrescentar interpretação.
