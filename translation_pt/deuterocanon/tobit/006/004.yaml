translation_notes:
  register: Português moderno, claro e digno, com diálogo direto e ação vívida. A tradução segue prioritariamente o texto grego de Swete; o suposto paralelo hebraico fornecido não corresponde a este episódio e não foi usado para alterar a leitura.
