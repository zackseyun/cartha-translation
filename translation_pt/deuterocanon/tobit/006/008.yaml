  text: And he said to him[a], “The heart and the liver—if a demon or an evil spirit troubles anyone, burn these as smoke before a man or a woman, and he or she will no longer be troubled.”
translation:
  language: pt
  text: 'E ele lhe disse: “Quanto ao coração e ao fígado, se um demônio ou espírito maligno atormentar alguém, queime-os para produzir fumaça diante de um homem ou de uma mulher, e essa pessoa não será mais atormentada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδία
  choice: coração
  rationale: Refere-se literalmente ao órgão do peixe, em paralelo com o fígado, e não à sede figurada dos pensamentos ou sentimentos.
- source_word: ἧπαρ
  choice: fígado
  rationale: Preserva o sentido anatômico literal exigido pelo contexto.
- source_word: ἐάν τινα ὀχλῇ
  choice: se ... atormentar alguém
  rationale: ὀχλέω indica afligir ou causar perturbação; “atormentar” comunica naturalmente a gravidade da ação atribuída ao demônio ou espírito.
- source_word: δαιμόνιον
  choice: demônio
  rationale: Mantém a distinção lexical entre δαιμόνιον e a expressão seguinte πνεῦμα πονηρόν.
- source_word: πνεῦμα πονηρόν
  choice: espírito maligno
  rationale: Tradução corrente e clara que preserva o paralelo sem fundir a expressão com “demônio”.
- source_word: ταῦτα δὲ καπνίσαι
  choice: queime-os para produzir fumaça
  rationale: O infinitivo καπνίσαι descreve fazer os órgãos soltarem fumaça mediante a queima; a formulação explicita o mecanismo sem acrescentar interpretação ritual.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Equivalente conciso e digno para indicar que a fumaça é produzida na presença da pessoa.
- source_word: ἀνθρώπου ἢ γυναικός
  choice: do homem ou da mulher
  rationale: Conserva a menção explícita dos dois sexos no grego, entendidos como a pessoa afetada já mencionada.
- source_word: οὐ μηκέτι ὀχληθῇ
  choice: não será mais atormentada
  rationale: Reproduz a forte negação de continuidade e retoma o mesmo verbo português usado na primeira ocorrência de ὀχλέω.
theological_decisions:
- issue: Natureza da afirmação sobre opressão demoníaca e o uso da fumaça
  choice: Apresentar diretamente a instrução no horizonte narrativo do texto, conservando a linguagem sobrenatural.
  alternative: Reformular a passagem como simbolismo, folclore ou tratamento meramente médico.
  rationale: O grego descreve explicitamente um demônio ou espírito maligno atormentando alguém e prescreve a fumaça dos órgãos; a tradução não deve suavizar nem endossar além do que a própria narrativa declara.
- issue: Referência de gênero em ἀνθρώπου ἢ γυναικός
  choice: Preservar “homem ou mulher”, retomando depois ambos por “essa pessoa”.
  alternative: Reduzir toda a expressão a “qualquer pessoa”.
  rationale: A fonte nomeia explicitamente homem e mulher; “essa pessoa” evita ambiguidade na oração final sem apagar essa distinção.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “Quanto ao coração e ao fígado” trata os órgãos como tópico da resposta. “Queime-os para produzir fumaça” é mais natural e semanticamente mais claro em português do que um literalismo como “fumegue-os”. Não se incluiu nota, pois a nuance de καπνίσαι foi incorporada de modo transparente ao texto principal.
