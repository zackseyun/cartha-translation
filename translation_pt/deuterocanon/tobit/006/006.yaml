base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/006.yaml
  text: And the young man did as the angel told him. Then they roasted the fish and ate it[a], and both of them traveled on until they came near Ecbatana.
translation:
  language: pt
  text: E o jovem fez como o anjo lhe disse. Depois, assaram o peixe e o comeram, e os dois seguiram viagem até se aproximarem de Ecbátana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: o jovem
  rationale: Embora o termo possa significar “menino” ou “criança”, Tobias já tem idade para viajar e se casar; “o jovem” comunica sua juventude sem sugerir que seja uma criança pequena.
- source_word: ἐποίησεν
  choice: fez
  rationale: Equivalente direto e natural no contexto de cumprir o que lhe foi dito.
- source_word: ὡς εἶπεν αὐτῷ ὁ ἄγγελος
  choice: como o anjo lhe havia dito
  rationale: Formulação portuguesa natural que preserva o caráter de instrução falada sem transformar explicitamente a fala em ordem formal.
- source_word: τὸν δὲ ἰχθὺν ὀπτήσαντες ἔφαγον
  choice: Depois, assaram o peixe e o comeram
  rationale: Converte a construção participial grega em uma sequência verbal clara; “assaram” representa o preparo ao fogo indicado por ὀπτάω.
- source_word: ὥδευον
  choice: seguiram viagem
  rationale: Expressão corrente que comunica a continuação do percurso sugerida pelo imperfeito.
- source_word: ἀμφότεροι
  choice: os dois
  rationale: Preserva explicitamente que Tobias e o anjo continuaram juntos.
- source_word: ἕως ἤγγισαν ἐν Ἐκβατάνοις
  choice: até chegarem perto de Ecbátana
  rationale: Mantém a ideia de aproximação de ἤγγισαν, sem afirmar que já haviam entrado ou chegado plenamente à cidade; resolve de modo natural em português a combinação grega pouco usual com ἐν.
