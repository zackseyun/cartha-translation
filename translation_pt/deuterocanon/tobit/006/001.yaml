  text: And she stopped weeping[a].
translation:
  language: pt
  text: E ela parou de chorar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego adotado aqui é muito breve: “E ela parou de chorar.” Uma tradição mais longa, relacionada a testemunhos semíticos, prossegue neste versículo com a narrativa da viagem (“o jovem seguiu seu caminho...”); essa redação, porém, não consta do texto grego principal traduzido aqui.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: A conjunção liga diretamente a frase ao contexto anterior; “E” preserva com naturalidade essa continuidade narrativa.
- source_word: ἐπαύσατο
  choice: parou
  rationale: O aoristo médio de παύω indica a interrupção de uma ação em curso. “Parou” é claro, atual e idiomático em português.
- source_word: κλαίουσα
  choice: de chorar
  rationale: O particípio presente de κλαίω descreve o choro que estava em andamento. A construção portuguesa “parou de chorar” transmite naturalmente esse aspecto sem acrescentar a ideia mais específica de lamentação.
