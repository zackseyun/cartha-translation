  yaml_path: translation/deuterocanon/tobit/006/007.yaml
  text: And the young man said to the angel[a], “Azariah, brother, what are the liver and the heart and the gall of the fish for?”
translation:
  language: pt
  text: 'E o jovem disse ao anjo: “Azarias, irmão, para que servem o fígado, o coração e a bílis do peixe?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: o jovem
  rationale: No contexto, refere-se a Tobias, que já tem idade para viajar e agir com autonomia. “O jovem” preserva a ideia de juventude sem sugerir uma criança pequena.
- source_word: τῷ ἀγγέλῳ
  choice: ao anjo
  rationale: Embora ἄγγελος também possa significar “mensageiro”, neste contexto a personagem é um ser angelical, e “anjo” expressa diretamente o sentido narrativo.
- source_word: Ἀζαρία
  choice: Azarias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome grego Ἀζαρία; a pontuação transmite o vocativo.
- source_word: ἀδελφέ
  choice: irmão
  rationale: Mantém o termo literal de tratamento familiar ou respeitoso, sem convertê-lo em “amigo” nem sugerir que o texto esteja afirmando parentesco biológico.
- source_word: τί ἐστιν
  choice: para que servem
  rationale: Embora a expressão seja literalmente “o que é?”, o contexto mostra que Tobias pergunta pela finalidade ou pelo uso das partes do peixe. A formulação é natural em português.
- source_word: τὸ ἧπαρ
  choice: o fígado
  rationale: Equivalente anatômico direto.
- source_word: ἡ καρδία
  choice: o coração
  rationale: Equivalente anatômico direto.
- source_word: ἡ χολή
  choice: a bílis
  rationale: χολή designa a secreção biliar; “bílis” é uma tradução anatômica moderna, clara e amplamente compreensível em português.
- source_word: τοῦ ἰχθύος
  choice: do peixe
  rationale: Genitivo direto que identifica o animal ao qual pertencem as partes mencionadas.
theological_decisions:
- issue: Forma de tratamento ἀδελφέ dirigida ao companheiro angelical
  choice: Manter “irmão” no discurso direto
  alternative: Traduzir idiomaticamente como “amigo” ou omitir o termo
  rationale: O vocativo funciona como forma comum de tratamento e não necessariamente como afirmação de parentesco. Preservar “irmão” mantém a transparência lexical e a tensão do texto sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Bílis” foi preferido a “fel” por ser anatomicamente preciso e corrente; não se acrescentou nota porque a alternativa lexical não produz ambiguidade relevante na tradução portuguesa.
