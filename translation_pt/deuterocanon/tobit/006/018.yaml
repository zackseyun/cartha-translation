base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/018.yaml
  text: Then the demon will smell it and flee[a], and it will never return forever. But when you go in to her, rise, both of you, and cry out to the merciful God, and he will save you and have mercy on you. Do not fear, because she had been prepared for you from eternity, and you will save her, and she will go with you, and I suppose that you will have children by her. And when Tobias heard these things, he kissed her[d][c][b], and his soul was bound to her very strongly.
translation:
  language: pt
  text: Então o demônio sentirá o cheiro e fugirá, e nunca mais voltará[a]. Mas, quando você se aproximar dela[b], levantem-se os dois e clamem ao Deus misericordioso; ele salvará vocês e terá compaixão de vocês. Não tenha medo, pois ela fora preparada para você desde a eternidade[c]. Você a salvará, ela irá com você, e suponho que você terá filhos com ela. Quando Tobias ouviu essas coisas, beijou-a, e sua alma se apegou profundamente a ela[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não voltará pela era da era”; trata-se de uma expressão enfática que indica que não voltará jamais.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto matrimonial, “aproximar-se dela” refere-se à aproximação de Tobias a Sara em vista da união conjugal.
    reason: cultural_note
  - marker: c
    text: 'Ou: “desde tempos antigos” ou “desde muito tempo”. A expressão grega pode indicar tanto um passado remoto como um horizonte eterno.'
    reason: alternative_reading
  - marker: d
    text: “Sua alma se apegou profundamente a ela” é uma imagem vívida de ligação e afeto profundos, não apenas de uma emoção passageira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσφρανθήσεται
  choice: sentirá o cheiro
  rationale: Preserva a ação concreta de perceber pelo olfato e soa natural em português no contexto da fumaça produzida pelos órgãos do peixe.
- source_word: τὸ δαιμόνιον
  choice: o demônio
  rationale: Equivalente direto e preciso do substantivo grego, sem diluí-lo em uma expressão mais genérica como “espírito maligno”.
- source_word: οὐκ ἐπανελεύσεται τὸν αἰῶνα τοῦ αἰῶνος
  choice: nunca mais voltará
  rationale: Expressa de modo natural a negação enfática e permanente do retorno; a forma intensiva do grego é registrada em nota.
- source_word: προσπορεύῃ αὐτῇ
  choice: você se aproximar dela
  rationale: Traduz o movimento de aproximação com naturalidade e preserva no texto a discrição do idioma conjugal, explicitado em nota.
- source_word: ἐγέρθητε ἀμφότεροι
  choice: levantem-se os dois
  rationale: Reproduz o imperativo plural e torna explícito, como no grego, que a instrução se dirige ao casal.
- source_word: βοήσατε πρὸς τὸν ἐλεήμονα θεόν
  choice: clamem ao Deus misericordioso
  rationale: “Clamar” conserva a urgência de βοάω, enquanto “misericordioso” representa diretamente ἐλεήμων.
- source_word: σώσει ὑμᾶς καὶ ἐλεήσει
  choice: ele salvará vocês e terá compaixão de vocês
  rationale: Mantém distintos os dois verbos gregos e preserva tanto o livramento quanto a misericórdia divina.
- source_word: ἡτοίμασμένη ἦν ἀπὸ τοῦ αἰῶνος
  choice: estava preparada para você desde a eternidade
  rationale: Conserva a força temporal elevada da expressão, sem esconder em nota a possibilidade de referência a um passado remoto.
- source_word: σὺ αὐτὴν σώσεις
  choice: você a salvará
  rationale: Mantém a repetição de σῴζω e sua possível ressonância teológica, enquanto o contexto imediato aponta para livramento da ameaça do demônio.
- source_word: πορεύσεται μετὰ σοῦ
  choice: ela irá com você
  rationale: Tradução simples e abrangente do futuro de πορεύομαι.
- source_word: ὑπολαμβάνω
  choice: suponho
  rationale: Preserva a apresentação da declaração como expectativa ou juízo do falante, sem transformá-la em certeza explícita.
- source_word: ἐξ αὐτῆς παιδία
  choice: filhos com ela
  rationale: Forma natural e respeitosa em português para os filhos provenientes da união do casal.
- source_word: ἡ ψυχὴ αὐτοῦ ἐκολλήθη αὐτῇ σφόδρα
  choice: sua alma se apegou profundamente a ela
  rationale: Preserva a imagem antropológica e relacional de ψυχή e κολλάω, bem como a intensidade de σφόδρα.
theological_decisions:
- issue: Alcance temporal de ἀπὸ τοῦ αἰῶνος na preparação de Sara para Tobias
  choice: desde a eternidade
  alternative: desde tempos antigos; desde muito tempo
  rationale: A expressão pode apontar para antiguidade remota ou para um horizonte eterno. O texto principal conserva a leitura temporal mais forte, coerente com a afirmação solene da providência, e a nota mantém aberta a alternativa lexical.
- issue: Sentido de “você a salvará”
  choice: manter “salvará”, com referência narrativa imediata ao livramento da ameaça demoníaca
  alternative: você a livrará; você a protegerá
  rationale: A repetição do verbo usado para a ação divina deve ser visível, mas não autoriza importar uma doutrina posterior de salvação espiritual. O contexto define o livramento concreto de Sara.
- issue: Papel da oração do casal no livramento
  choice: preservar a sequência de levantar-se, clamar a Deus e receber salvação e compaixão
  alternative: parafrasear como uma prescrição ritual ou garantia mecânica
  rationale: O grego associa a súplica à ação misericordiosa de Deus, sem desenvolver uma teoria sobre eficácia ritual; a tradução evita acrescentá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. Emprega “vocês” para o plural, evita arcaísmos e preserva imagens concretas e ambiguidades relevantes do grego. As notas seguem a ordem em que os marcadores aparecem no texto.
