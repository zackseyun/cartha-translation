  yaml_path: translation/deuterocanon/tobit/006/013.yaml
  text: And now listen to me[a], and I will speak to her father; and when we return from Rages, we will arrange the marriage. For I know that Raguel will certainly not give her to another man contrary to the law of Moses, or he will incur death[b], because it is fitting for you to receive the inheritance rather than any other man.
translation:
  language: pt
  text: 'Escute-me agora: falarei com o pai dela e, quando voltarmos de Rages, celebraremos o casamento. Pois sei que Raguel de modo nenhum a dará a outro homem em violação da Lei de Moisés; caso contrário, ficará sujeito à pena de morte.[a] Pois cabe a você receber a herança, mais do que a qualquer outro homem.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “ou deverá morte”, expressão que indica responsabilidade pela pena de morte.
    reason: lexical_alternative
  - marker: b
    text: 'O grego diz de modo compacto: “cabe a você receber a herança mais do que todo homem”, isto é, você tem prioridade sobre qualquer outro homem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄκουσόν μου
  choice: escute-me
  rationale: O imperativo pede atenção ao que será dito; “escute-me” é direto, natural e mais adequado ao contexto do que uma referência à simples audição.
- source_word: λαλήσω τῷ πατρὶ αὐτῆς
  choice: falarei com o pai dela
  rationale: Mantém o sentido simples de λαλέω e reproduz com naturalidade o destinatário indicado pelo dativo.
- source_word: ὅταν ὑποστρέψωμεν ἐκ Ῥάγων
  choice: quando voltarmos de Rages
  rationale: ὅταν com o subjuntivo aponta para uma ocasião futura; ἐκ indica o lugar de onde voltarão.
- source_word: ποιήσωμεν τὸν γάμον
  choice: realizaremos o casamento
  rationale: A expressão significa levar a efeito o casamento. “Realizaremos” preserva a amplitude do idioma sem restringi-lo apenas à festa ou aos preparativos.
- source_word: οὐ μὴ δῷ
  choice: de modo nenhum a dará
  rationale: A combinação οὐ μή com o subjuntivo forma uma negação enfática, aqui expressa de modo corrente e solene.
- source_word: ἀνδρὶ ἑτέρῳ
  choice: a outro homem
  rationale: ἀνήρ pode significar homem ou marido; como se trata de alguém a quem Sara seria dada em casamento, “outro homem” preserva a formulação menos interpretativa.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: conforme a Lei de Moisés
  rationale: Esta é a correspondência formal mais direta de κατά. No contexto, a expressão explica que a Lei impede Raguel de dá-la a outro homem; a continuação explicita a consequência da alternativa.
- source_word: ἢ ὀφειλέσει θάνατον
  choice: caso contrário, ficará sujeito à morte
  rationale: O sentido idiomático é de incorrer em responsabilidade ou pena de morte. “Caso contrário” torna clara a força alternativa de ἤ, sem alterar a relação lógica do texto.
- source_word: τὴν κληρονομίαν
  choice: a herança
  rationale: Mantém o substantivo e o artigo do grego sem acrescentar um possessivo que o texto não explicita.
- source_word: σοὶ καθήκει λαβεῖν
  choice: cabe a você receber
  rationale: καθήκει exprime aquilo que é apropriado, devido ou compete a alguém. A escolha preserva tanto a noção de propriedade quanto a de prioridade.
- source_word: ἢ πάντα ἄνθρωπον
  choice: mais do que a qualquer outro homem
  rationale: A construção grega é compacta e pouco usual; em contexto, estabelece a prioridade de Tobias sobre qualquer outro homem.
theological_decisions:
- issue: Força da obrigação de Raguel sob a Lei de Moisés
  choice: A Lei impede Raguel de dar Sara a outro homem; fazê-lo o deixaria sujeito à morte.
  alternative: Raguel simplesmente não escolherá outro marido porque conhece a Lei de Moisés.
  rationale: A negação enfática, seguida da alternativa “ficará sujeito à morte”, apresenta uma obrigação com consequência grave, não apenas uma preferência pessoal. A tradução preserva essa força sem identificar uma norma mosaica específica que o texto não cita.
- issue: Natureza da prioridade de Tobias sobre a herança
  choice: Tobias tem prioridade para receber a herança sobre qualquer outro homem.
  alternative: A herança pertence de modo absoluto e exclusivo a Tobias.
  rationale: καθήκει indica o que lhe cabe ou é devido, enquanto a comparação final formula prioridade. A tradução evita transformar essa prioridade contextual em uma afirmação jurídica mais absoluta do que o grego exige.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula por designar a Lei de Moisés. A formulação preserva a negação enfática, a gravidade da consequência legal e a construção comparativa do original, esclarecendo apenas os seus valores idiomáticos.
