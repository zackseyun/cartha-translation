base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/016.yaml
  text: But the angel said to him[a], “Do you not remember the words that your father commanded you about taking a wife from your own kin? And now listen to me, brother, because she will be your wife, and pay no attention to the demon, for tonight she will be given to you as a wife.”
translation:
  language: pt
  text: 'Mas o anjo lhe disse: “Você não se lembra das instruções que seu pai lhe deu sobre tomar por esposa uma mulher de sua própria parentela? Agora escute-me, irmão, pois ela será sua esposa. Não dê atenção alguma ao demônio[a], porque esta noite ela lhe será dada como esposa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se preocupe com o demônio”. O idioma grego pode ser expresso literalmente como “não tenha nenhuma consideração pelo demônio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέμνησαι
  choice: você não se lembra
  rationale: O perfeito médio tem força presente; a pergunta idiomática preserva tanto a memória quanto o tom de advertência.
- source_word: λόγων ὧν ἐνετείλατό σοι ὁ πατήρ σου
  choice: das palavras que seu pai lhe ordenou
  rationale: Mantém λόγων como “palavras” e o caráter autoritativo de ἐνετείλατο, sem transformar o substantivo em “instruções”.
- source_word: ὑπὲρ τοῦ λαβεῖν σε γυναῖκα
  choice: a respeito de tomar como esposa uma mulher
  rationale: Explicita naturalmente em português o idioma matrimonial, evitando que “tomar uma mulher” seja entendido fora do contexto de casamento.
- source_word: ἐκ τοῦ γένους σου
  choice: da sua própria parentela
  rationale: γένος indica aqui o grupo de parentesco ou linhagem familiar; “parentela” conserva essa abrangência sem especificar indevidamente tribo ou etnia.
- source_word: ἄκουσόν μου
  choice: escute-me
  rationale: Expressa a ordem de ouvir com atenção e permanece natural no português atual, sem ampliar diretamente para “obedeça-me”.
- source_word: ἀδελφέ
  choice: irmão
  rationale: Preserva o vocativo literal e seu tom caloroso de tratamento.
- source_word: σοὶ ἔσται εἰς γυναῖκα
  choice: ela será sua esposa
  rationale: Reproduz de modo idiomático o resultado matrimonial expresso pela construção grega.
- source_word: τοῦ δαιμονίου μηδένα λόγον ἔχε
  choice: não dê atenção alguma ao demônio
  rationale: Traduz o sentido provável do idioma, literalmente relacionado a “não ter palavra/conta” do demônio; a alternativa é registrada em nota para preservar a amplitude.
- source_word: δαιμονίου
  choice: demônio
  rationale: É a correspondência lexical direta e teologicamente transparente do termo grego.
- source_word: τὴν νύκτα ταύτην
  choice: esta noite
  rationale: Forma temporal natural em português e próxima da expressão grega.
- source_word: δοθήσεταί σοι αὕτη εἰς γυναῖκα
  choice: ela lhe será dada como esposa
  rationale: Preserva a voz passiva explícita e a fórmula matrimonial do original.
theological_decisions:
- issue: Linguagem matrimonial e obrigação de parentesco
  choice: Manter linguagem matrimonial explícita e a referência à própria parentela.
  alternative: Uniformizar tudo como “casar-se” e usar apenas “parente”.
  rationale: O grego repete fórmulas com γυνή e apresenta o casamento dentro de uma estrutura familiar. A tradução preserva esse quadro social sem acrescentar aprovação ou reprovação.
- issue: Identificação da ameaça sobrenatural
  choice: Traduzir δαιμόνιον por “demônio”.
  alternative: “espírito maligno”.
  rationale: O original nomeia diretamente um demônio; uma expressão mais genérica reduziria a precisão lexical.
- issue: Força do idioma μηδένα λόγον ἔχε
  choice: Usar “não dê atenção alguma”, com nota indicando outra nuance possível.
  alternative: “não se preocupe com” ou a reprodução literal “não tenha palavra/conta do”.
  rationale: O idioma pode envolver não levar em conta ou não se preocupar. A formulação principal é clara, enquanto a nota preserva a ambiguidade sem impor uma única nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” dá naturalidade ao discurso direto; “parentela” mantém precisão familiar sem soar excessivamente técnica. A repetição de “esposa” foi conservada por corresponder à insistência matrimonial do grego.
