base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/003.yaml
  text: Then the young man went down to wash himself[a], and a fish leaped up from the river and tried to swallow the young man.
translation:
  language: pt
  text: Então o jovem desceu para se lavar, e um peixe saltou do rio e quis engolir o jovem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tentou engolir o jovem”. O verbo grego pode expressar vontade ou intenção; no contexto, também pode ser entendido como uma tentativa de ataque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: o jovem
  rationale: Embora παιδάριον possa designar menino ou criança, aqui se refere a Tobias, que já tem idade para viajar e agir com autonomia. “O jovem” é natural e adequado ao contexto, e foi mantido nas duas ocorrências.
- source_word: κατέβη
  choice: desceu
  rationale: Preserva de modo direto o movimento concreto em direção à água.
- source_word: περικλύσασθαι
  choice: para se lavar
  rationale: O infinitivo médio indica que o jovem lava a si mesmo. “Se lavar” é claro e não pressupõe imersão completa.
- source_word: ἀνεπήδησεν
  choice: saltou
  rationale: Expressa o movimento súbito e vivo do peixe sem acrescentar elementos ausentes do grego.
- source_word: ἰχθύς
  choice: um peixe
  rationale: O substantivo aparece sem artigo e introduz o peixe pela primeira vez na cena.
- source_word: ἀπὸ τοῦ ποταμοῦ
  choice: do rio
  rationale: Forma idiomática em português que preserva a procedência indicada pelo grego.
- source_word: ἐβουλήθη
  choice: quis
  rationale: O verbo exprime vontade ou intenção. “Quis” preserva essa nuance sem convertê-la inequivocamente em tentativa efetiva.
- source_word: καταπεῖν
  choice: engolir
  rationale: É a correspondência direta e sóbria para o verbo composto que significa engolir ou tragar.
