base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/012.yaml
  text: I will speak about her[a], so that she may be given to you as a wife, because her inheritance falls to you, and you alone are from her family[b]; and the young woman is beautiful and sensible.
translation:
  language: pt
  text: Falarei a respeito dela, para que ela seja dada a você como esposa, porque a herança dela cabe a você[a], e só você é da família dela[b]; e a jovem é bela e sensata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a herança dela pertence a você” ou “o direito à herança dela recai sobre você”. O grego expressa um direito ou uma obrigação legal ligada ao parentesco.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “só você é da parentela dela” ou “só você é da linhagem dela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλήσω περὶ αὐτῆς
  choice: Falarei a respeito dela
  rationale: O futuro de λαλέω com περὶ e genitivo significa naturalmente falar a respeito de alguém. A formulação mantém aberta a possível implicação contextual de falar em favor dela, sem inseri-la explicitamente no texto.
- source_word: τοῦ δοθῆναί σοι αὐτὴν εἰς γυναῖκα
  choice: para que ela lhe seja dada como esposa
  rationale: O infinitivo articular com τοῦ expressa aqui propósito ou resultado. A construção passiva preserva a forma grega, e “como esposa” é natural em português atual.
- source_word: σοὶ ἐπιβάλλει ἡ κληρονομία αὐτῆς
  choice: a herança dela cabe a você
  rationale: ἐπιβάλλει indica que, segundo a relação jurídica de parentesco, a herança recai sobre o destinatário ou lhe compete. “Cabe a você” comunica esse sentido legal sem afirmar mera posse presente.
- source_word: σὺ μόνος εἶ ἐκ τοῦ γένους αὐτῆς
  choice: só você pertence à família dela
  rationale: γένος pode designar família, parentesco ou linhagem. “Pertence à família dela” é claro e corrente, preservando a ligação de parentesco relevante ao casamento e à herança.
- source_word: τὸ κοράσιον
  choice: a jovem
  rationale: κοράσιον designa uma moça ou jovem mulher. No contexto de casamento, “a jovem” evita tanto uma leitura infantil quanto linguagem arcaica.
- source_word: καλὸν
  choice: bela
  rationale: No retrato da futura esposa, καλός se refere naturalmente à beleza ou boa aparência. “Bela” é conciso e digno.
- source_word: φρόνιμόν
  choice: sensata
  rationale: φρόνιμος denota prudência, discernimento e bom senso prático. “Sensata” expressa esse valor em português contemporâneo sem ampliá-lo para uma sabedoria abstrata.
theological_decisions:
- issue: Formulação do casamento e da herança em contexto jurídico de parentesco
  choice: porque a herança dela cabe a você, e só você pertence à família dela
  alternative: porque a herança dela pertence a você, e só você é da parentela dela
  rationale: A redação conserva a lógica social e jurídica que fundamenta a proposta de casamento, sem transformar a jovem em objeto de herança nem introduzir categorias doutrinárias posteriores. “Cabe a você” também preserva melhor a ideia de direito ou obrigação decorrente do parentesco.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem das ideias e a relação de propósito foram preservadas, enquanto construções excessivamente literais ou arcaicas foram evitadas. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
