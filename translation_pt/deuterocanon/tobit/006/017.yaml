  text: And when you enter into the bridal chamber[a], take some of the incense ashes and place on them some of the fish’s heart and liver, and make smoke with them[b],
translation:
  language: pt
  text: Quando você entrar no quarto nupcial, pegue cinzas de incenso, coloque sobre elas um pouco do coração e do fígado do peixe e produza fumaça com tudo isso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, faça subir fumaça das cinzas com a porção do coração e do fígado colocada sobre elas. O verbo grego é mais específico do que simplesmente “queimar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυμφῶνα
  choice: quarto nupcial
  rationale: Designa o aposento associado ao leito e à consumação do casamento. “Quarto nupcial” é claro, natural e preserva o contexto matrimonial.
- source_word: λήμψῃ
  choice: pegue
  rationale: No contexto de uma sequência de instruções práticas, o verbo indica tomar algo para utilizá-lo.
- source_word: τέφραν θυμιαμάτων
  choice: cinzas de incenso
  rationale: τέφρα significa “cinza(s)”, enquanto θυμιαμάτων se refere a incenso ou substâncias aromáticas queimadas. A construção portuguesa é natural e mantém a relação entre os termos.
- source_word: ἐπιθήσεις
  choice: coloque sobre elas
  rationale: O verbo significa pôr ou colocar sobre algo. O pronome retoma “cinzas” e explicita em português o referente subentendido na construção grega.
- source_word: ἀπὸ τῆς καρδίας καὶ τοῦ ἥπατος τοῦ ἰχθύος
  choice: um pouco do coração e do fígado do peixe
  rationale: 'ἀπό tem aqui valor partitivo: deve-se retirar uma porção do coração e do fígado, não necessariamente usar os órgãos inteiros.'
- source_word: καπνίσεις
  choice: produza fumaça com tudo isso
  rationale: O verbo descreve especificamente a produção de fumaça. A tradução evita reduzi-lo ao ato genérico de queimar e deixa claro que as cinzas, o coração e o fígado compõem a mistura.
theological_decisions:
- issue: Natureza da ação descrita por καπνίσεις
  choice: Descrever concretamente a produção de fumaça.
  alternative: Interpretar a ação como oferta queimada, fumigação do quarto ou ato exorcístico.
  rationale: Este versículo apresenta a ação física; seu efeito é explicado no contexto seguinte. A tradução não deve antecipar nem impor uma interpretação ritual ou teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quarto nupcial” preserva o cenário matrimonial sem soar arcaico; “produza fumaça” conserva a precisão do verbo grego, e a nota esclarece a ação concreta.
