base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/015.yaml
  text: And now I am my father's only one[a], and I am afraid that if I go in, I will die, just as the former ones did, because a demon loves her, and it harms no one except those who approach her. And now I am afraid that I may die and bring down the life of my father and my mother in grief because of me to their grave[c][b]; and they have no other son who will bury them.
translation:
  language: pt
  text: E agora sou o único filho de meu pai, e tenho medo de que, se eu entrar, morra como os anteriores, pois um demônio a ama[a] e não faz mal a ninguém, a não ser aos que se aproximam dela. Agora tenho medo de morrer e de, por minha causa, fazer a vida de meu pai e de minha mãe descer com tristeza à sepultura deles[b]; e eles não têm outro filho que os sepulte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente que “um demônio a ama”, descrevendo o apego possessivo do demônio a Sara.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “fazer a vida de meu pai e de minha mãe descer com tristeza à sepultura deles”: isto é, levá-los a morrer com tristeza por minha causa.'
    reason: cultural_note
lexical_decisions:
- source_word: μόνος ... τῷ πατρί
  choice: o único filho de meu pai
  rationale: Embora μόνος seja literalmente “único” ou “sozinho”, o contexto posterior explicita que Tobias é o único filho disponível para cumprir o dever filial; a formulação portuguesa é natural e não acrescenta uma relação ausente do contexto.
- source_word: φοβοῦμαι μὴ εἰσελθὼν ἀποθάνω
  choice: tenho medo de que, se eu entrar, morra
  rationale: Reproduz naturalmente a construção de temor com μή e mantém a relação contingente entre entrar — no contexto, ir até Sara — e morrer.
- source_word: οἱ πρότεροι
  choice: os anteriores
  rationale: Mantém a expressão relativamente aberta do grego; o contexto identifica os maridos anteriores de Sara.
- source_word: δαιμόνιον
  choice: um demônio
  rationale: É o equivalente direto para o ser espiritual pessoal e hostil apresentado pela narrativa.
- source_word: φιλεῖ αὐτήν
  choice: a ama
  rationale: Preserva o sentido lexical simples de φιλέω e a inquietante tensão do texto, sem reinterpretar silenciosamente o amor como mero desejo ou domínio.
- source_word: ἀδικεῖ
  choice: faz mal
  rationale: No contexto, o verbo indica dano concreto; “faz mal” é claro, atual e mantém certa amplitude sem limitar o dano à morte.
- source_word: τῶν προσαγόντων αὐτῇ
  choice: aos que se aproximam dela
  rationale: Conserva a imagem de aproximação e evita especificar mais do que o grego se esses homens são conduzidos a ela ou vão até ela.
- source_word: κατάξω τὴν ζωὴν ... εἰς τὸν τάφον αὐτῶν
  choice: fazer a vida de meu pai e de minha mãe descer ... à sepultura
  rationale: Mantém a forte imagem grega da vida dos pais descendo à sepultura, esclarecida em nota como expressão de uma morte causada pela tristeza.
- source_word: μετʼ ὀδύνης ἐπʼ ἐμοί
  choice: por minha causa ... com tristeza
  rationale: Expressa tanto a causa pessoal da dor quanto a profunda aflição indicada por ὀδύνη.
- source_word: υἱὸς ἕτερος οὐχ ὑπάρχει αὐτοῖς ὃς θάψει αὐτούς
  choice: eles não têm outro filho que os sepulte
  rationale: Português idiomático que preserva o dever filial futuro do sepultamento.
theological_decisions:
- issue: Natureza do δαιμόνιον
  choice: um demônio pessoal que prejudica os homens que se aproximam de Sara
  alternative: um espírito mau em sentido genérico
  rationale: A narrativa trata o δαιμόνιον como agente espiritual pessoal, com apego a Sara e ação seletiva contra os homens que se aproximam dela.
- issue: Sentido de φιλεῖ αὐτήν
  choice: “a ama”, preservando a formulação desconcertante do grego
  alternative: “está possessivamente ligado a ela” ou “a deseja”
  rationale: A tradução não resolve a tensão teológica e narrativa ao substituir o verbo comum de amar por uma interpretação específica; a nota esclarece o caráter maligno e possessivo desse apego no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada em “por minha causa” para fluidez, sem perder a imagem do original. Os marcadores [a] e [b] aparecem no texto nas passagens correspondentes.
