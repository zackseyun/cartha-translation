  text: And all the nations will truly turn to fear the Lord God[a]; they will bury their idols.
translation:
  language: pt
  text: E todas as nações se voltarão verdadeiramente para temer o Senhor Deus[a]; enterrarão os seus ídolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retornarão verdadeiramente a temer o Senhor Deus”. O verbo grego pode significar “voltar-se” ou “retornar”; aqui descreve o movimento sincero das nações em direção a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Expressa naturalmente o alcance universal do grego, sem restringir ἔθνη aos gentios em contraste com os judeus.
- source_word: ἐπιστρέψουσιν
  choice: se voltarão
  rationale: Preserva a metáfora grega de voltar-se para Deus e evita introduzir a linguagem doutrinária mais técnica de conversão.
- source_word: ἀληθινῶς
  choice: verdadeiramente
  rationale: Mantém a força adverbial e indica que o voltar-se das nações será sincero e real.
- source_word: φοβεῖσθαι
  choice: para temer
  rationale: Reproduz o sentido lexical direto e conserva a linguagem bíblica do temor de Deus, sem reduzi-la apenas a reverência.
- source_word: Κύριον τὸν θεόν
  choice: o Senhor Deus
  rationale: Reflete a expressão grega sem acrescentar um possessivo ausente no texto.
- source_word: κατορύξουσιν
  choice: enterrarão
  rationale: Conserva a imagem concreta de cavar e pôr debaixo da terra, aqui aplicada ao abandono dos ídolos.
- source_word: τὰ εἴδωλα αὐτῶν
  choice: os seus ídolos
  rationale: Ídolos é o equivalente religioso direto de εἴδωλα; a colocação do possessivo é natural em português e mantém a referência às nações.
theological_decisions:
- issue: Se φοβεῖσθαι deve ser suavizado como “reverenciar”
  choice: temer
  alternative: reverenciar
  rationale: O grego emprega explicitamente a linguagem bíblica do temor de Deus. “Temer” preserva sua tensão entre reverência, submissão e temor, sem resolvê-la interpretativamente.
- issue: Se ἐπιστρέψουσιν deve ser vertido por linguagem técnica de conversão
  choice: se voltarão
  alternative: se converterão
  rationale: “Se voltarão” mantém visível a metáfora do original e não importa terminologia doutrinária mais específica.
- issue: Se ἐπιστρέψουσιν indica voltar ou retornar
  choice: se voltarão, com alternativa em nota
  alternative: retornarão
  rationale: O verbo grego admite ambos os sentidos. No contexto, “voltar-se para” é natural, mas a possibilidade de “retornar” merece ser preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação preserva a coordenação breve do grego, o futuro profético e a imagem concreta de enterrar os ídolos.
