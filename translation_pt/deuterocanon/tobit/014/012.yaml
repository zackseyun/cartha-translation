base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/012.yaml
  text: And when Hanna died[a], he buried her with his father. Then Tobias went away with his wife and his sons to Ecbatana, to Raguel his father-in-law.
translation:
  language: pt
  text: Quando Ana morreu, ele a sepultou com o pai dele.[a] Depois, Tobias partiu com a esposa e os filhos para Ecbátana, para junto de Raguel, seu sogro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não explicita o sujeito de «sepultou»; a oração seguinte menciona Tobias pelo nome.
    reason: Preservar a referência implícita e não resolver no texto uma ambiguidade do grego.
lexical_decisions:
- source_word: Ἅννα
  choice: Ana
  rationale: Forma portuguesa tradicional e natural do nome semítico representado no grego por Ἅννα.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Tradução direta e não eufemística do aoristo de ἀποθνῄσκω, adequada ao estilo narrativo.
- source_word: ἔθαψεν
  choice: sepultou
  rationale: Expressa diretamente o ato de enterrar, com registro digno e corrente em narrativa bíblica.
- source_word: μετὰ τοῦ πατρὸς αὐτοῦ
  choice: com o pai dele
  rationale: Preserva o sentido básico de μετά com genitivo e evita que o possessivo português «seu» crie ambiguidade gramatical adicional; não especifica se o sepultamento foi ao lado do pai ou no mesmo túmulo.
- source_word: ἀπῆλθεν
  choice: partiu
  rationale: Comunica de modo natural tanto a saída do lugar anterior quanto o deslocamento subsequente.
- source_word: γυναικὸς αὐτοῦ
  choice: a esposa
  rationale: No contexto familiar possessivo, γυνή significa claramente esposa; o possessivo fica subentendido de modo natural após «com».
- source_word: υἱῶν αὐτοῦ
  choice: os filhos
  rationale: Traduz o masculino plural υἱοί sem substituí-lo por um termo que signifique apenas crianças; o possessivo fica naturalmente ligado a Tobias.
- source_word: Ἐκβάτανα
  choice: Ecbátana
  rationale: Forma portuguesa estabelecida do nome da cidade antiga.
- source_word: πρὸς Ῥαγουὴλ τὸν πενθερὸν αὐτοῦ
  choice: para junto de Raguel, seu sogro
  rationale: Representa o movimento em direção a uma pessoa indicado por πρός e traduz πενθερός pelo termo familiar português «sogro».
theological_decisions:
- issue: Sujeito não expresso de ἔθαψεν
  choice: Manter a referência apenas como «ele» e explicar em nota que o grego não nomeia o sujeito nessa oração
  alternative: Inserir «Tobias» como sujeito de «sepultou» com base no contexto e na oração seguinte
  rationale: A forma verbal grega contém um sujeito implícito, mas não o identifica nominalmente; a oração seguinte introduz explicitamente Tobias. A tradução evita resolver silenciosamente essa questão, embora o contexto favoreça Tobias.
- issue: Relação espacial expressa por μετά no sepultamento
  choice: «com o pai dele»
  alternative: «ao lado do pai dele»
  rationale: O grego afirma associação no sepultamento, mas não define com precisão se se trata de posição lado a lado, do mesmo túmulo ou do mesmo local funerário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. «Partiu» e «para junto de» mantêm o movimento da narrativa sem rigidez; «pai dele» é preferido a «seu pai» para maior clareza referencial.
