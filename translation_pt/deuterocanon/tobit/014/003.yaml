base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/003.yaml
  text: He had grown very old[a]; and he called his son and his grandsons, and said to him, “Child, take your sons. Look, I have grown old[b], and I am about to depart from life.”
translation:
  language: pt
  text: 'Ele envelheceu muito; chamou seu filho e seus netos[a] e lhe disse: “Filho, leve seus filhos. Veja, estou velho e prestes a partir desta vida[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu filho e seus filhos”. Pelo contexto, a segunda expressão se refere a seus netos.
    reason: lexical_alternative
  - marker: b
    text: O grego diz, mais literalmente, “estou perto de afastar-me do viver”, uma expressão idiomática que indica que a morte está próxima.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλως δὲ ἐγήρασεν
  choice: Ele envelheceu muito
  rationale: A expressão descreve o avanço acentuado da idade. “Envelheceu muito” transmite naturalmente a força intensificadora de μεγάλως sem acrescentar um marcador temporal ausente do grego.
- source_word: τὸν υἱὸν αὐτοῦ καὶ τοὺς υἱοὺς αὐτοῦ
  choice: seu filho e seus netos
  rationale: Após a menção ao filho, a segunda expressão, literalmente repetida como “os filhos dele”, refere-se de modo mais natural aos filhos desse filho. “Seus netos” torna clara a relação em português, e a forma literal é preservada em nota.
- source_word: Τέκνον
  choice: Filho
  rationale: Neste contexto, τέκνον é uma forma afetuosa de um pai dirigir-se ao filho. “Filho” é natural em português e mantém tanto a relação quanto o tom.
- source_word: λάβε
  choice: leve
  rationale: O imperativo pode significar tomar ou levar consigo. “Leve” é idiomático no contexto de reunir os filhos para a ação que será indicada, sem desenvolver além do que o texto afirma.
- source_word: ἰδοὺ
  choice: Veja
  rationale: A interjeição chama solenemente a atenção para o que segue. “Veja” é atual e digno, sem o tom arcaico de “eis” em discurso direto.
- source_word: γεγήρακα
  choice: estou velho
  rationale: O perfeito apresenta o estado presente resultante do envelhecimento. “Estou velho” comunica esse resultado de maneira direta e natural.
- source_word: πρὸς τὸ ἀποτρέχειν ἐκ τοῦ ζῇν εἰμί
  choice: estou ... prestes a partir desta vida
  rationale: A construção indica proximidade e emprega uma expressão indireta para a morte. “Prestes a partir desta vida” conserva a iminência e o tom eufemístico sem reproduzir de forma obscura o sentido literal de “correr para fora do viver”.
theological_decisions:
- issue: Expressão eufemística para a morte iminente
  choice: prestes a partir desta vida
  alternative: prestes a morrer
  rationale: O grego evita o verbo direto “morrer”. A tradução preserva essa delicadeza e a imagem de partida, sem atribuir à frase uma elaboração doutrinária sobre o estado após a morte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O ponto e vírgula conserva a estreita ligação narrativa das orações; o discurso direto evita formas arcaicas. Todos os marcadores de nota aparecem junto ao trecho que explicam.
