revisions:
- from: E Deus voltará a ter misericórdia deles e os fará voltar para a terra. Eles construirão a Casa, embora ela não seja como a anterior, até que se cumpram os tempos desta era.[a] Depois disso, voltarão dos cativeiros[b] e edificarão Jerusalém com honra; e a Casa de Deus nela será edificada gloriosamente, assim como os profetas falaram a respeito dela.[c]
  to: E Deus voltará a ter misericórdia deles e os fará voltar para a terra. Eles construirão a Casa, mas ela não será como a anterior, até que se cumpram os tempos da era.[a] Depois disso, voltarão dos cativeiros[b] e edificarão Jerusalém de maneira digna; e a Casa de Deus nela será edificada gloriosamente, assim como os profetas falaram a respeito dela.[c]
  rationale: Foram feitas correções leves de precisão e estilo. A revisão retira o demonstrativo acrescentado em «desta era», preserva mais claramente a projeção futura da casa em contraste com a anterior e esclarece que ἐντίμως descreve a maneira de edificar Jerusalém. Os marcadores e as notas permanecem na ordem de ocorrência e continuam ancorados no texto.
