base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/005.yaml
  text: And God will again have mercy on them and bring them back to the land[a], and they will build the house, though not like the former one, until the times of the age are fulfilled. And after these things they will return from the captivities and build Jerusalem honorably, and the house of God in her will be built gloriously[c][b], just as the prophets spoke concerning her.
translation:
  language: pt
  text: E Deus voltará a ter misericórdia deles e os fará voltar para a terra. Eles construirão a Casa, mas ela não será como a anterior, até que se cumpram os tempos da era.[a] Depois disso, voltarão dos cativeiros[b] e edificarão Jerusalém de maneira digna; e a Casa de Deus nela será edificada gloriosamente, assim como os profetas falaram a respeito dela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «os tempos da era» pode indicar tempos determinados que conduzem a uma restauração mais plena; o grego não especifica seu alcance.
    reason: lexical_alternative
  - marker: b
    text: O grego traz o plural «cativeiros», que pode se referir a vários lugares ou episódios de exílio.
    reason: lexical_alternative
  - marker: c
    text: No grego, os pronomes femininos «nela» e «dela» retomam Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν ἐλεήσει αὐτοὺς
  choice: voltará a ter misericórdia deles
  rationale: Expressa com naturalidade a renovação da ação misericordiosa de Deus, preservando o valor de πάλιν e o tom religioso de ἐλεέω.
- source_word: ἐπιστρέψει αὐτοὺς εἰς τὴν γῆν
  choice: os fará voltar para a terra
  rationale: Mantém o sentido causativo de ἐπιστρέφω com objeto direto e conserva 'a terra', sem acrescentar um possessivo ausente do grego.
- source_word: οἰκοδομήσουσιν τὸν οἶκον
  choice: construirão a Casa
  rationale: Preserva a expressão grega 'a casa' e usa inicial maiúscula para tornar transparente, no contexto, a referência ao templo, posteriormente explicitada como 'Casa de Deus'.
- source_word: οὐχ οἷος ὁ πρότερος
  choice: embora ela não seja como a anterior
  rationale: A formulação concessiva é natural em português e mantém aberta a possibilidade de diferença ou inferioridade em relação à Casa anterior.
- source_word: ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος
  choice: até que se cumpram os tempos desta era
  rationale: Conserva a linguagem temporal e escatologicamente sugestiva, sem identificar esses tempos com um esquema doutrinário específico.
- source_word: ἐκ τῶν αἰχμαλωσιῶν
  choice: dos cativeiros
  rationale: Mantém o plural explícito do grego, que pode apontar para vários lugares ou episódios de desterro.
- source_word: οἰκοδομήσουσιν Ἰερουσαλὴμ ἐντίμως
  choice: edificarão Jerusalém com honra
  rationale: '''Com honra'' transmite o sentido adverbial de ἐντίμως de modo digno e mais idiomático que ''honrosamente'' neste contexto arquitetônico.'
- source_word: ἐν αὐτῇ
  choice: nela
  rationale: Retoma Jerusalém de modo natural em português; o gênero feminino preserva a forma da referência grega sem exigir uma personificação artificial.
- source_word: ἐνδόξως
  choice: gloriosamente
  rationale: Preserva tanto a ideia de esplendor quanto a ressonância de glória presente no termo grego.
- source_word: καθὼς ἐλάλησαν περὶ αὐτῆς οἱ προφῆται
  choice: assim como os profetas falaram a respeito dela
  rationale: Mantém a referência explícita à fala profética e o antecedente feminino, Jerusalém.
theological_decisions:
- issue: Sentido de καιροὶ τοῦ αἰῶνος
  choice: os tempos desta era
  alternative: os tempos da eternidade / os tempos determinados
  rationale: A expressão é temporal e possivelmente escatológica, mas imprecisa. A tradução conserva sua abertura e evita impor uma cronologia doutrinária.
- issue: Referente de τὸν οἶκον
  choice: a Casa
  alternative: o templo
  rationale: O contexto indica o templo, porém o grego emprega primeiro 'a casa'. Preservar a expressão permite que 'Casa de Deus', mais adiante, esclareça o referente.
- issue: Referência feminina a Jerusalém
  choice: nela / dela
  alternative: nessa cidade / a respeito da cidade
  rationale: O português permite retomar naturalmente 'Jerusalém' no feminino, preservando a coesão e um traço da imagem da cidade sem exagerar sua personificação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Foram mantidos o idioma bíblico da 'Casa', o plural incomum 'cativeiros' e a abertura da expressão temporal. As notas aparecem na ordem em que seus marcadores ocorrem no texto.
