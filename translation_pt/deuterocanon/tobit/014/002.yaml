  text: And he was fifty-eight years old when he lost his sight[a], and after eight years he regained it; and he did acts of mercy[c][b], and he continued to fear God.
translation:
  language: pt
  text: Ele tinha cinquenta e oito anos quando perdeu a visão[a] e, oito anos depois, voltou a enxergar. Continuava a dar esmolas[b] e a temer a Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “perdeu as vistas”; a expressão significa perder a capacidade de enxergar.
    reason: lexical_alternative
  - marker: b
    text: Ou “praticar obras de misericórdia”; o termo grego pode designar esmolas dadas aos necessitados ou, de modo mais amplo, ações misericordiosas.
    reason: lexical_alternative
  - marker: c
    text: O trecho grego diz apenas “temer”, sem declarar o objeto; “a Deus” foi explicitado conforme o contexto de piedade.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἦν ἐτῶν πεντήκοντα ὀκτώ
  choice: tinha cinquenta e oito anos
  rationale: É a forma corrente e natural de expressar idade em português.
- source_word: ἀπώλεσεν τὰς ὄψεις
  choice: perdeu a visão
  rationale: Reproduz naturalmente o sentido do idiomatismo grego, cujo plural literal não deve ser transposto mecanicamente.
- source_word: μετὰ ἔτη ὀκτώ
  choice: oito anos depois
  rationale: Equivalente temporal claro e idiomático de ‘depois de oito anos’.
- source_word: ἀνέβλεψεν
  choice: voltou a enxergar
  rationale: Em contexto de cegueira, o verbo indica recuperação da visão; esta formulação é natural e mantém o elo com a oração anterior.
- source_word: ἐποίει ἐλεημοσύνας
  choice: continuava a dar esmolas
  rationale: No grego judaico deste contexto, ἐλεημοσύνη designa de modo característico a esmola ou ajuda dada aos necessitados; o imperfeito ἐποίει indica prática continuada.
- source_word: προσεθέτο φοβεῖσθαι
  choice: a temer a Deus
  rationale: A construção expressa continuação ou acréscimo nessa prática. O objeto não aparece no trecho grego fornecido, mas o temor de Deus está implícito no resumo de piedade e é explicitado para que o português seja natural.
theological_decisions:
- issue: Objeto implícito de φοβεῖσθαι
  choice: temer a Deus
  alternative: continuar a temer; perseverar no temor
  rationale: O texto grego fornecido não explicita o objeto. No contexto piedoso, Deus é o referente natural; a tradução o explicita para clareza, enquanto a nota preserva a forma mais aberta do original.
- issue: Sentido de ἐλεημοσύνας
  choice: esmolas
  alternative: obras de misericórdia
  rationale: ‘Esmolas’ preserva o sentido concreto mais provável no contexto de Tobit, sem excluir que dar aos necessitados seja entendido como ato de misericórdia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição aspectual de ações habituais foi representada por “continuava a”. As explicitações interpretativas relevantes foram sinalizadas em notas.
