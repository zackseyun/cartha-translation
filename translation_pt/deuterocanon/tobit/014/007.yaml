base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/007.yaml
  text: And all the nations will bless the Lord[a]. And his people will give thanks to God, and the Lord will exalt his people; and all who love the Lord God in truth and righteousness will rejoice[c][b], showing mercy to our brothers.
translation:
  language: pt
  text: E todas as nações bendirão o Senhor. Seu povo dará graças a Deus[a], e o Senhor exaltará seu povo. Todos os que amam o Senhor Deus em verdade e justiça[b] se alegrarão, mostrando misericórdia aos nossos irmãos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “louvará a Deus” ou “confessará a Deus”; o verbo grego pode indicar confissão, ação de graças ou louvor, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: “Justiça” também pode ser traduzida por “retidão”; aqui, a palavra provavelmente se refere à integridade na devoção e na conduta, sem excluir sua dimensão de justiça.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “nossos irmãos”; o termo pode ser usado de modo representativo para parentes ou membros da mesma comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσουσιν
  choice: bendirão
  rationale: Preserva o sentido direto de falar bem do Senhor ou bendizê-lo, mantendo o registro bíblico sem reduzi-lo simplesmente a louvor.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Expressa diretamente o alcance universal de ἔθνη sem impor aqui a distinção mais específica sugerida por “gentios”.
- source_word: ἐξομολογήσεται
  choice: dará graças
  rationale: No contexto de respostas de culto a Deus, o verbo indica naturalmente ação de graças ou louvor; evita introduzir sem necessidade a ideia penitencial de confissão.
- source_word: ὑψώσει
  choice: exaltará
  rationale: Conserva tanto a imagem de elevar quanto o sentido de honrar.
- source_word: ἐν ἀληθείᾳ καὶ δικαιοσύνῃ
  choice: em verdade e justiça
  rationale: Mantém de modo conciso a construção grega e deixa que a expressão descreva a maneira ou esfera em que amam a Deus.
- source_word: ποιοῦντες ἔλεος
  choice: mostrando misericórdia
  rationale: Reproduz em português natural a expressão de feição semítica que significa agir misericordiosamente.
- source_word: τοῖς ἀδελφοῖς ἡμῶν
  choice: aos nossos irmãos
  rationale: Mantém o substantivo masculino plural explícito no grego, sem excluir em nota seu possível uso representativo para parentes ou membros da comunidade.
theological_decisions:
- issue: Tradução de Κύριος
  choice: Senhor
  alternative: SENHOR
  rationale: “Senhor” é a correspondência direta e tradicional de Κύριος, e o texto grego não exige explicitar no corpo do versículo uma possível representação do nome divino hebraico.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a correspondência lexical ampla e a tensão entre conduta reta e justiça; “retidão” é possível neste contexto moral e devocional, mas estreitaria a gama semântica.
- issue: Alcance de ἀδελφοῖς
  choice: irmãos
  alternative: irmãos e irmãs; membros da nossa comunidade
  rationale: O texto tem o masculino plural “irmãos”. Ele pode funcionar de modo representativo, mas a tradução principal não explicita um alcance que o grego deixa dependente do contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Bendizer”, “exaltar” e “misericórdia” preservam o registro bíblico sem arcaísmo excessivo. A divisão em três frases torna a longa coordenação grega mais legível sem alterar suas relações lógicas.
