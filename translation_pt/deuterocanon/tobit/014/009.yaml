  yaml_path: translation/deuterocanon/tobit/014/009.yaml
  text: But you, keep the law and the commandments, and become merciful and righteous, so that it may go well with you.
translation:
  language: pt
  text: Mas você, guarde a Lei e os mandamentos e torne-se misericordioso e justo, para que tudo vá bem para você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τήρησον
  choice: guarde
  rationale: Expressa a ideia de observar e cumprir fielmente, em formulação natural no contexto da Lei.
- source_word: τὸν νόμον καὶ τὰ προστάγματα
  choice: a Lei e os mandamentos
  rationale: Mantém a distinção do grego entre νόμος e προστάγματα; a inicial maiúscula em “Lei” indica a instrução legal recebida, sem ampliar indevidamente o sentido.
- source_word: γενοῦ
  choice: torne-se
  rationale: Preserva o valor de mudança ou desenvolvimento do imperativo aoristo de γίνομαι, em vez de reduzi-lo a simples “seja”.
- source_word: φιλελεήμων
  choice: misericordioso
  rationale: Comunica a disposição de amar e praticar a misericórdia em português claro e digno.
- source_word: δίκαιος
  choice: justo
  rationale: Equivalente direto que preserva a dimensão moral e relacional do termo.
- source_word: ἵνα σοι καλῶς ἦν
  choice: para que tudo lhe vá bem
  rationale: Reproduz de modo idiomático a finalidade e a ideia de bem-estar expressas pela construção grega.
theological_decisions:
- issue: Relação entre obediência, caráter moral e bem-estar
  choice: 'Manter a sequência e a finalidade explícitas no texto: guardar, tornar-se misericordioso e justo, para que tudo vá bem.'
  alternative: Reformular como promessa absoluta de prosperidade ou como mero desejo desvinculado da conduta.
  rationale: O grego estabelece uma relação final com ἵνα, mas não define a natureza ou a extensão do bem-estar; a tradução não deve transformá-la em garantia material irrestrita nem apagar a relação textual.
translation_notes:
  register: Português moderno, claro e digno, com uso de “você” adequado à legibilidade brasileira e amplamente compreensível. A construção “torne-se” conserva a nuance verbal destacada pelo texto-fonte.
