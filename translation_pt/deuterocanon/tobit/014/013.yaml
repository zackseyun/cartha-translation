  text: And he grew old honorably[a], and he buried his parents-in-law with honor, and he inherited their property and that of Tobit his father.
translation:
  language: pt
  text: E envelheceu com honra, sepultou com grande honra[a] os pais de sua esposa e herdou os bens deles e os de Tobit, seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sepultou esplendidamente os pais de sua esposa”. O termo grego também pode indicar um sepultamento magnífico ou glorioso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγήρασεν
  choice: envelheceu
  rationale: Expressa de modo direto e natural o processo de chegar à velhice indicado pelo aoristo de γηράσκω.
- source_word: ἐντίμως
  choice: com honra
  rationale: Preserva o sentido de uma velhice honrada ou estimada, em linguagem corrente e digna.
- source_word: ἔθαψεν
  choice: sepultou
  rationale: Verbo claro e adequado ao registro bíblico, sem suavizar o sentido concreto de enterrar.
- source_word: τοὺς πενθεροὺς αὐτοῦ
  choice: os pais de sua esposa
  rationale: Torna explícito que o plural se refere ao sogro e à sogra, evitando que “sogros” seja entendido de modo menos preciso por alguns leitores.
- source_word: ἐνδόξως
  choice: com grande honra
  rationale: Comunica que o sepultamento foi honroso e distinto, preservando a intensidade possível do advérbio sem sugerir ostentação indevida.
- source_word: ἐκληρονόμησεν
  choice: herdou
  rationale: Equivalente português direto e específico para receber algo por herança.
- source_word: τὴν οὐσίαν αὐτῶν
  choice: os bens deles
  rationale: “Bens” exprime naturalmente as propriedades ou posses que constituíam a herança.
- source_word: καὶ Τωβεὶτ τοῦ πατρὸς αὐτοῦ
  choice: e os de Tobit, seu pai
  rationale: Mantém a elipse do substantivo “bens” de forma natural em português e identifica claramente Tobit como o pai.
