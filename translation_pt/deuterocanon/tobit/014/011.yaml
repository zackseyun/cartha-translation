base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/011.yaml
  text: And now, children, see what almsgiving does, and how righteousness delivers. And while he was saying these things, his life came to an end on the bed. He was a hundred fifty-eight years old, and he buried him honorably.
translation:
  language: pt
  text: E agora, filhos, vejam o que a esmola faz e como a retidão[a] livra. Enquanto ele dizia essas coisas, sua vida chegou ao fim[b] no leito. Ele tinha cento e cinquenta e oito anos, e o sepultou com honra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justiça”. A palavra grega pode indicar tanto retidão quanto justiça, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a alma dele se extinguiu” ou “lhe faltou a alma”. Esta é uma expressão grega que indica a morte.
    reason: lexical_alternative
  - marker: c
    text: 'Alguns leitores talvez esperem “sepultaram-no com honra”, mas o testemunho grego aqui traz o verbo no singular: “o sepultou com honra”. O sujeito não está expresso.'
    reason: textual_variant
lexical_decisions:
- source_word: παιδία
  choice: filhos
  rationale: Vocativo plural dirigido aos descendentes ou ouvintes mais jovens; “filhos” preserva o tom familiar e é natural em português.
- source_word: ἴδετε
  choice: vejam
  rationale: Imperativo plural que mantém de modo direto a força exortativa de ver, perceber ou considerar.
- source_word: ἐλεημοσύνη
  choice: a prática da esmola
  rationale: Em Tobit, o termo costuma indicar a ação concreta de dar aos necessitados. A formulação evita que “esmola” seja entendida apenas como o objeto dado.
- source_word: ποιεῖ
  choice: faz
  rationale: Reproduz com simplicidade o presente grego e deixa em aberto o alcance do que essa prática efetua.
- source_word: δικαιοσύνη
  choice: retidão
  rationale: Neste contexto sapiencial, designa conduta moralmente correta; “justiça” continua sendo uma alternativa legítima e é registrada em nota.
- source_word: ῥύεται
  choice: livra
  rationale: Verbo de resgate ou libertação; “livra” conserva a amplitude da expressão sem restringi-la à salvação física ou eterna.
- source_word: ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: sua vida chegou ao fim
  rationale: Comunica claramente o falecimento sem transformar a expressão idiomática em uma afirmação antropológica mais específica.
- source_word: κλίνη
  choice: cama
  rationale: Equivalente corrente e adequado ao leito em que ocorreu a morte.
- source_word: ἐτῶν ἑκατὸν πεντήκοντα ὀκτώ
  choice: tinha cento e cinquenta e oito anos
  rationale: Forma natural em português para declarar a idade.
- source_word: ἔθαψεν αὐτὸν ἐνδόξως
  choice: o sepultou com honra
  rationale: Preserva o verbo singular do testemunho grego e traduz ἐνδόξως como a maneira honrosa do sepultamento, sem introduzir um sujeito ausente do texto.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: retidão
  alternative: justiça
  rationale: A leitura principal destaca a conduta moral correta no contexto sapiencial, enquanto a nota preserva o sentido também possível de justiça.
- issue: Expressão de morte ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: sua vida chegou ao fim
  alternative: sua alma o deixou / sua alma se foi
  rationale: A tradução principal apresenta o evento da morte sem definir de modo indevido o que acontece com a alma; a nota conserva a forma mais literal da expressão grega.
- issue: Sujeito implícito de ἔθαψεν
  choice: 'verbo singular com sujeito não expresso: “o sepultou”'
  alternative: “sepultaram-no” ou “foi sepultado”
  rationale: O testemunho grego fornecido tem verbo singular, embora o sujeito não esteja expresso e possa parecer inesperado. A tradução mantém essa característica, e a nota esclarece a dificuldade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta. “Prática da esmola” esclarece o caráter concreto de ἐλεημοσύνη; as notas preservam a ambiguidade de δικαιοσύνη, a forma idiomática da morte e a dificuldade do verbo singular final.
