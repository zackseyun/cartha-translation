base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/008.yaml
  text: And now[a], child, depart from Nineveh, because what the prophet Jonah spoke will surely happen.
translation:
  language: pt
  text: E agora, meu filho[a], saia de Nínive, pois certamente acontecerá o que o profeta Jonas anunciou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «minha criança»; o grego τέκνον é uma forma filial de tratamento e, conforme o contexto, pode ser traduzido das duas maneiras.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva a transição e a urgência do conselho em português natural.
- source_word: τέκνον
  choice: meu filho
  rationale: No contexto, é uma forma filial de tratamento dirigida por um pai; «meu filho» é natural e afetuoso em português, embora o grego, isoladamente, também possa significar «minha criança».
- source_word: ἄπελθε
  choice: saia
  rationale: O imperativo aoristo pede a partida; «saia» expressa de modo direto e atual a ordem de deixar o lugar.
- source_word: ἀπὸ Νινευή
  choice: de Nínive
  rationale: ἀπό marca afastamento ou separação; com «sair», a construção idiomática portuguesa é «sair de Nínive».
- source_word: πάντως
  choice: certamente
  rationale: Mantém a forte afirmação de certeza quanto ao cumprimento da profecia.
- source_word: ἔσται
  choice: acontecerá
  rationale: Embora literalmente signifique «será», neste contexto profético refere-se à ocorrência do que foi anunciado.
- source_word: ἃ ἐλάλησεν
  choice: o que ... anunciou
  rationale: O verbo λαλέω designa o que Jonas proferiu; «anunciou» soa natural no contexto profético sem acrescentar detalhes ao conteúdo.
- source_word: ὁ προφήτης Ἰωνᾶς
  choice: o profeta Jonas
  rationale: Reproduz de maneira direta e idiomática o título seguido do nome.
theological_decisions:
- issue: Certeza profética acerca do destino de Nínive
  choice: «certamente acontecerá o que o profeta Jonas anunciou»
  alternative: «sem dúvida se cumprirá o que o profeta Jonas disse»
  rationale: A redação conserva a ênfase de πάντως na certeza do acontecimento, sem especificar seu momento, mecanismo ou extensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Saia de Nínive» evita o tom excessivamente literário de «parte de Nínive», enquanto «certamente acontecerá» preserva a solenidade e a certeza profética.
