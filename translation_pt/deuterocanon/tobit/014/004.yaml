  to: 'Vá para a Média, meu filho, pois estou convencido de tudo o que o profeta Jonas disse a respeito de Nínive: ela será arrasada. Mas na Média haverá mais paz por algum tempo.[a] Nossos irmãos serão dispersos da boa terra; Jerusalém ficará desolada, a casa de Deus que nela está será consumida pelo fogo[b] e ficará desolada até certo tempo.[c]'
