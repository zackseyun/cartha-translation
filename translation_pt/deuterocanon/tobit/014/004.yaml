base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/004.yaml
  text: 'Go to Media[a], my child, because I am convinced that what Jonah the prophet spoke concerning Nineveh will happen: it will be overthrown. But in Media there will be peace for a while. And our brothers will be scattered from the good land, and Jerusalem will be desolate, and the house of God in it will be burned down[b], and it will be desolate until a time.'
translation:
  language: pt
  text: 'Vá para a Média, meu filho, pois estou convencido de tudo o que o profeta Jonas disse a respeito de Nínive: ela será arrasada. Mas na Média haverá mais paz por algum tempo.[a] Nossos irmãos serão dispersos da boa terra; Jerusalém ficará desolada, a casa de Deus que nela está será consumida pelo fogo[b] e ficará desolada até certo tempo.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode ser entendida como “haverá relativamente mais paz até determinado tempo”, indicando segurança comparativa e temporária na Média.
    reason: lexical_alternative
  - marker: b
    text: A “casa de Deus” é o templo de Jerusalém.
    reason: historical_context
  - marker: c
    text: A expressão “ficará desolada” pode retomar Jerusalém ou a casa de Deus; o grego não elimina completamente essa ambiguidade.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἄπελθε εἰς τὴν Μηδείαν
  choice: Vá para a Média
  rationale: O imperativo aoristo pede uma ordem direta. “Vá para” é natural em português e conserva o destino expresso no grego.
- source_word: τέκνον
  choice: meu filho
  rationale: O vocativo comunica afeto familiar. Em português, “meu filho” é a forma natural neste contexto, sem perder a ternura do original.
- source_word: πέπεισμαι
  choice: estou convencido
  rationale: O perfeito expressa uma convicção já estabelecida e ainda vigente.
- source_word: ὅσα ἐλάλησεν
  choice: tudo o que ... disse
  rationale: Reproduz o relativo neutro plural como referência ao conjunto da mensagem profética, em português corrente.
- source_word: καταστραφήσεται
  choice: será arrasada
  rationale: O futuro passivo de καταστρέφω anuncia a ruína de Nínive. “Arrasada” mantém a força da linguagem de juízo sem exigir uma descrição específica do modo de destruição.
- source_word: ἔσται εἰρήνη μᾶλλον ἕως καιροῦ
  choice: haverá mais paz por algum tempo
  rationale: Conserva tanto o valor comparativo de μᾶλλον quanto o limite temporal de ἕως καιροῦ. A formulação sugere segurança relativa, não paz absoluta ou permanente.
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: nossos irmãos
  rationale: Mantém a forma masculina plural do grego, que no contexto designa os compatriotas israelitas.
- source_word: σκορπισθήσονται ἀπὸ τῆς ἀγαθῆς γῆς
  choice: serão dispersos para longe da boa terra
  rationale: “Dispersos” preserva a imagem do espalhamento no exílio; “para longe de” torna explícito em português o afastamento indicado por ἀπό.
- source_word: ὁ οἶκος τοῦ θεοῦ ... κατακαήσεται
  choice: a casa de Deus ... será consumida pelo fogo
  rationale: “Casa de Deus” traduz formalmente a expressão grega, enquanto “consumida pelo fogo” comunica a intensidade do verbo composto κατακαίω.
- source_word: μέχρι χρόνου
  choice: até certo tempo
  rationale: Mantém o limite temporal indefinido do original sem transformá-lo em uma data ou duração determinada.
theological_decisions:
- issue: Relação sintática entre a convicção de Tobit e a profecia de Jonas
  choice: '“estou convencido de tudo o que ... disse ...: ela será arrasada”'
  alternative: “estou convencido de que acontecerá tudo o que ... disse”
  rationale: A redação escolhida segue de perto πέπεισμαι ὅσα ἐλάλησεν e apresenta a oração seguinte como o conteúdo da profecia, sem acrescentar ao grego um verbo explícito equivalente a “acontecer”.
- issue: Caráter da paz na Média
  choice: “haverá mais paz por algum tempo”
  alternative: “haverá paz por algum tempo”
  rationale: A escolha preserva μᾶλλον, deixando visível que a paz pode ser comparativa ou relativa, e mantém a limitação temporal.
- issue: Referente da última expressão “ficará desolada”
  choice: manter um referente gramaticalmente possível tanto para Jerusalém quanto para a casa de Deus
  alternative: explicitar “o templo ficará desolado” ou “Jerusalém ficará desolada”
  rationale: No grego, a referência final não precisa ser dogmaticamente fixada. Em português, o feminino de “Jerusalém” e “casa” permite conservar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução preserva a repetição profética de “desolada”, o comparativo de μᾶλλον e a possível ambiguidade do referente final, evitando terminologia denominacional.
