- issue: Sentido de ἐξομολογούμενος em contexto de culto
  choice: ação de graças
  alternative: confissão
  rationale: O contexto imediato é o encerramento das palavras de louvor e bênção de Tobit, favorecendo ação de graças. A nota preserva o sentido penitencial possível sem introduzi-lo no texto principal.
