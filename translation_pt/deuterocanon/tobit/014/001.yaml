- source_word: ἐπαύσατο
  choice: parou
  rationale: O aoristo médio de παύω indica aqui que a ação chegou ao fim. “Parou” é claro e natural em português moderno.
- source_word: ἐξομολογούμενος
  choice: de dar graças
  rationale: O particípio pode expressar confissão ou ação de graças/louvor. Como o versículo encerra a bênção e o cântico anteriores de Tobit, “dar graças” comunica melhor o sentido contextual sem ocultar a alternativa lexical.
- source_word: Τωβείτ
