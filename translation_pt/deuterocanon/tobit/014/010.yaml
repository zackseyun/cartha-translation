  naturalness: O registro é claro, moderno e adequado. «Meu filho», «veja», «armadilha mortal» e «obras de misericórdia» são naturais e amplamente compreensíveis. A repetição explícita de «sepulte» torna a primeira instrução menos elíptica e mais clara.
  terminology: «Nadabe» com nota é uma solução justificável para evitar confusão com o primeiro Adão, desde que a nota informe a leitura literal grega. «Aicar», «foi salvo», «obras de misericórdia» e a alternativa «deu esmolas» são adequados. «Retribuiu»/«retribuição» preserva melhor a ligação verbal grega do que «deu em paga»/«paga».
