  to: 'Sepulte-me devidamente e sepulte sua mãe junto comigo; não permaneçam mais em Nínive. Meu filho, veja o que Nadabe[a] fez a Aicar, que o havia criado: como o levou da luz para as trevas e tudo o que lhe retribuiu. Aicar, porém, foi salvo, enquanto aquele homem recebeu a retribuição e ele próprio desceu para as trevas. Manassés praticou obras de misericórdia[b] e foi salvo da armadilha mortal que Nadabe lhe havia preparado; mas Nadabe caiu na armadilha e pereceu.'
