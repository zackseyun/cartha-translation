base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/010.yaml
  text: And bury me properly[a], and your mother with me, and do not stay any longer in Nineveh. Child, see what Nadab did to Ahikar, who had reared him—how he brought him from the light into the darkness, and all that he repaid him. But Ahikar was saved, while that man received the repayment, and he himself went down into the darkness. Manasseh did acts of mercy, and he was saved from the deadly snare that Nadab had set for him[b]; but Nadab fell into the trap and perished.
translation:
  language: pt
  text: 'Sepulte-me devidamente e sepulte sua mãe junto comigo; não permaneçam mais em Nínive. Meu filho, veja o que Nadabe[a] fez a Aicar, que o havia criado: como o levou da luz para as trevas e tudo o que lhe retribuiu. Aicar, porém, foi salvo, enquanto aquele homem recebeu a retribuição e ele próprio desceu para as trevas. Manassés praticou obras de misericórdia[b] e foi salvo da armadilha mortal que Nadabe lhe havia preparado; mas Nadabe caiu na armadilha e pereceu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz literalmente «Adão». Aqui, porém, o nome se refere ao cortesão traiçoeiro da história de Aicar, conhecido em outras formas da tradição como Nadabe ou Nadã, e não ao primeiro homem.
    reason: alternative_reading
  - marker: b
    text: 'Ou: «deu esmolas». Em Tobias, o termo grego ἐλεημοσύνη muitas vezes se refere especificamente à ajuda material dada aos necessitados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάψον με καλῶς
  choice: sepulte-me de maneira digna
  rationale: θάπτω significa sepultar, e καλῶς pede que isso seja feito de modo apropriado. A expressão comunica um sepultamento condigno sem acrescentar a ideia específica de honras públicas.
- source_word: μηκέτι αὐλισθῆτε εἰς Νινευή
  choice: não permaneçam mais em Nínive
  rationale: A forma plural de αὐλίζομαι pode indicar alojar-se ou permanecer. Neste contexto, a ordem é deixar de residir em Nínive; o plural foi preservado.
- source_word: τέκνον
  choice: Meu filho
  rationale: Embora o grego diga literalmente 'filho/criança' sem possessivo, trata-se de uma forma afetuosa de tratamento paterno. 'Meu filho' é a formulação natural em português e o contexto identifica o destinatário.
- source_word: Ἀδὰμ
  choice: Nadabe
  rationale: Neste relato, o nome designa o cortesão traiçoeiro conhecido na tradição de Aicar como Nadabe/Nadã, não o primeiro homem. A nota conserva a forma literal do texto grego.
- source_word: Ἀχιαχάρῳ
  choice: Aicar
  rationale: Forma portuguesa legível do nome conhecido na tradição de Aicar, correspondente ao grego Ἀχιαχάρ.
- source_word: τῷ θρέψαντι αὐτόν
  choice: que o havia criado
  rationale: τρέφω, neste contexto familiar, refere-se a criar e sustentar alguém durante sua formação, não apenas alimentá-lo.
- source_word: ἐκ τοῦ φωτὸς ... εἰς τὸ σκότος
  choice: da luz para as trevas
  rationale: Mantém o contraste metafórico vívido do grego em linguagem portuguesa natural.
- source_word: ἀνταπέδωκεν / ἀνταπόδομα ἀπεδόθη
  choice: deu em paga / recebeu a paga
  rationale: A repetição de 'paga' preserva a conexão do grupo lexical ἀνταποδ-, que enfatiza retribuição, sem especificar além do texto a natureza dessa paga.
- source_word: ἔσωσεν / ἐσώθη
  choice: foi salvo
  rationale: O verbo σῴζω denota aqui livramento de perigo mortal. 'Foi salvo' mantém o equivalente lexical direto e deixa que o contexto indique o sentido narrativo.
- source_word: ἐλεημοσύνην
  choice: praticou obras de misericórdia
  rationale: ἐλεημοσύνη pode abranger atos concretos de compaixão e, especialmente em Tobias, esmolas. A formulação é clara em português e a alternativa mais específica fica registrada em nota.
- source_word: παγίδος θανάτου
  choice: armadilha mortal
  rationale: A expressão significa literalmente uma armadilha de morte. 'Armadilha mortal' transmite de modo idiomático que a cilada visava causar a morte.
- source_word: ἀπώλετο
  choice: morreu
  rationale: No contraste com o livramento da armadilha mortal, ἀπόλλυμι indica que Nadabe pereceu. 'Morreu' é direto e natural.
theological_decisions:
- issue: Sentido de 'foi salvo' nas referências a Aicar e Manassés
  choice: Livramento temporal de perigo mortal
  alternative: Salvação espiritual
  rationale: O contexto descreve uma conspiração e uma armadilha mortal. Conserva-se 'foi salvo', mas sem impor ao verbo uma doutrina de salvação eterna ausente desta cena narrativa.
- issue: Alcance de ἐλεημοσύνη
  choice: obras de misericórdia
  alternative: esmolas
  rationale: O termo pode designar especificamente a ajuda material aos necessitados, tema importante em Tobias, mas também permite uma formulação ética mais ampla. A tradução mantém essa amplitude, e a nota registra o sentido mais específico.
- issue: Retribuição recebida pelo agressor
  choice: recebeu a paga
  alternative: recebeu o castigo
  rationale: A escolha preserva a linguagem de reciprocidade do texto sem explicitar que a retribuição foi um castigo, embora o desfecho narrativo o indique.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregaram-se 'sepulte', 'permaneçam', 'armadilha' e construções narrativas correntes, evitando tanto arcaísmos quanto linguagem excessivamente coloquial. Os marcadores de nota aparecem junto aos termos a que se referem.
