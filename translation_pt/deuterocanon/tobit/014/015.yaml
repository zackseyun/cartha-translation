base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/015.yaml
  text: And before he died[a], he heard of the destruction of Nineveh, which Nebuchadnezzar and Ahasuerus had taken captive; before dying, he rejoiced over Nineveh. Amen.
translation:
  language: pt
  text: E, antes de morrer, ele ouviu falar da destruição de Nínive, que Nabucodonosor e Assuero haviam levado cativa.[a] Antes de morrer, alegrou-se por causa de Nínive. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego diz que Nabucodonosor e Assuero levaram Nínive cativa. A formulação foi mantida como aparece na fonte, embora se discuta a identificação histórica desses governantes em relação à queda de Nínive.
    reason: tensão histórica no texto-fonte
lexical_decisions:
- source_word: ἤκουσεν
  choice: ouviu falar
  rationale: Expressa naturalmente em português que ele recebeu a notícia do acontecimento, sem sugerir que tenha ouvido a destruição em si.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: antes de morrer
  rationale: Reproduz de modo claro e idiomático a construção temporal grega.
- source_word: ἀπωλίαν
  choice: destruição
  rationale: No contexto da queda de uma cidade, comunica com clareza a ideia de ruína ou aniquilação.
- source_word: ᾐχμαλώτισεν
  choice: haviam levado cativa
  rationale: Preserva o sentido próprio de levar ao cativeiro e mantém a imagem do texto, no qual Nínive representa metonimicamente seus habitantes; o plural em português concorda com os dois governantes nomeados.
- source_word: Ναβουχοδονοσὸρ
  choice: Nabucodonosor
  rationale: Forma bíblica tradicional e amplamente reconhecida em português.
- source_word: Ἀσύηρος
  choice: Assuero
  rationale: Forma bíblica tradicional e amplamente reconhecida em português para esse nome.
- source_word: ἐχάρη
  choice: alegrou-se
  rationale: Tradução direta, digna e corrente do verbo grego.
- source_word: ἐπὶ Νινευή
  choice: por causa de Nínive
  rationale: Mantém Nínive como a ocasião ou o objeto da alegria sem acrescentar explicitamente 'queda', preservando a relativa abertura da preposição grega.
- source_word: ἀμήν
  choice: Amém
  rationale: Conserva a conclusão expressamente presente no texto grego.
theological_decisions:
- issue: Identificação histórica dos conquistadores mencionados
  choice: Manter “Nabucodonosor e Assuero” no texto principal, sem harmonização histórica.
  alternative: Substituir os nomes por governantes associados em reconstruções históricas à queda de Nínive.
  rationale: A tradução deve representar fielmente o testemunho grego fornecido e não corrigir silenciosamente sua tensão histórica.
- issue: Sentido da alegria em ἐπὶ Νινευή
  choice: Traduzir “alegrou-se por causa de Nínive”.
  alternative: Explicitar “alegrou-se com a queda de Nínive”.
  rationale: O contexto associa a alegria à destruição noticiada, mas a formulação escolhida evita inserir na tradução um complemento que o grego não expressa diretamente.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos reconhecíveis no Brasil e em outras comunidades lusófonas. A repetição de “antes de morrer” foi preservada por corresponder à repetição enfática do grego.
