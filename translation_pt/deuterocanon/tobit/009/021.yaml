translation:
  language: pt
  text: E Tobit, pai dele, ia contando os dias, dia após dia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta página está sobrecarregado e parece conter material duplicado do contexto ao redor. Esta oração constitui uma unidade clara e foi traduzida diretamente; as orações posteriores da página refletem material sobreposto de diferentes formas textuais.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλογίζετο
  choice: ia contando
  rationale: O imperfeito expressa uma ação contínua ou repetida. No contexto, Tobit acompanha a passagem dos dias enquanto espera o retorno do filho; “ia contando” transmite isso de modo natural.
- source_word: ἑκάστης ἡμέρας
  choice: os dias, dia após dia
  rationale: A formulação preserva o sentido distributivo e repetido da expressão grega, em português corrente, sem reduzir a ação a um único momento.
- source_word: Τωβεὶθ ὁ πατὴρ αὐτοῦ
  choice: Tobit, pai dele
  rationale: Mantém o nome e a identificação apositiva presentes no grego. “Dele” torna inequívoca a referência ao filho no português moderno.
