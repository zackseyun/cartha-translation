  text: And they rose early together and came to the wedding[a], and Tobias blessed his wife.
translation:
  language: pt
  text: E levantaram-se cedo, juntos, e chegaram ao casamento[a], e Tobias abençoou sua esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «à festa de casamento». O grego γάμος pode referir-se tanto ao casamento quanto à celebração do casamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρευσαν
  choice: levantando-se cedo
  rationale: O verbo indica levantar-se ou estar de pé cedo, ao amanhecer; a expressão conserva a nuance temporal sem pressupor que já tenham partido.
- source_word: κοινῶς
  choice: juntos
  rationale: O advérbio expressa ação conjunta e, neste contexto, liga naturalmente o levantar-se cedo ao deslocamento subsequente.
- source_word: ἦλθοσαν
  choice: chegaram
  rationale: Embora o verbo signifique literalmente «vieram», «chegaram» é natural em português no ponto de vista narrativo e explicita apenas o resultado inerente ao movimento.
- source_word: γάμον
  choice: casamento
  rationale: γάμος pode designar tanto o casamento quanto sua celebração ou festa; «casamento» mantém a formulação ampla, e a alternativa contextual é registrada em nota.
- source_word: εὐλόγησεν
  choice: abençoou
  rationale: É o sentido normal do verbo e preserva a ação direta, sem acrescentar forma litúrgica ou conteúdo não indicado no grego.
- source_word: Τωβείας
  choice: Tobias
  rationale: Forma tradicional e reconhecível do nome grego em português.
- source_word: γυναῖκα αὐτοῦ
  choice: sua esposa
  rationale: No contexto matrimonial, γυνή significa claramente «esposa».
theological_decisions:
- issue: Natureza da ação de Tobias para com Sara em εὐλόγησεν ... τὴν γυναῖκα αὐτοῦ
  choice: Tobias abençoou sua esposa
  alternative: Tobias pronunciou uma bênção sobre sua esposa
  rationale: O texto relata uma bênção, mas não especifica sua forma, seu conteúdo nem um rito; a tradução simples evita importar pressupostos litúrgicos posteriores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção participial inicial preserva a sequência do grego; «chegaram» evita a estranheza de «vieram» sem alterar o movimento narrado. A ambiguidade de γάμος é mantida por meio da nota.
