base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/002.yaml
  text: Take with yourself a servant and two camels, and go to Rages of Media, to Gabael, and bring me the money, and bring him with you to the wedding.
translation:
  language: pt
  text: Leve com você um servo e dois camelos e vá a Rages, na Média, até Gabael. Traga-me o dinheiro[a] e traga-me também Gabael para o casamento[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “a prata”; aqui se refere ao dinheiro confiado a Gabael.
    reason: lexical_alternative
  - marker: b
    text: Ou “para a festa de casamento”. O termo grego pode indicar tanto o casamento quanto o banquete de celebração.
    reason: lexical_alternative
  - marker: c
    text: A tradição semítica paralela amplia este episódio com outros acompanhantes e detalhes sobre a casa de Gabael; o texto grego seguido aqui é mais breve.
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε μετὰ σεαυτοῦ
  choice: Leve com você
  rationale: Expressa naturalmente em português a ideia de tomar alguém e os animais como acompanhantes da viagem, sem reproduzir de modo rígido o reflexivo grego.
- source_word: παῖδα
  choice: um servo
  rationale: Embora παῖς também possa significar menino, jovem ou escravo, o contexto de viagem favorece servo ou ajudante; “servo” preserva a amplitude social sem enfatizar uma condição jurídica não explicitada.
- source_word: δύο καμήλους
  choice: dois camelos
  rationale: Correspondência direta e clara ao numeral e ao substantivo gregos.
- source_word: πορεύθητι
  choice: vá
  rationale: Imperativo simples e natural para o verbo de movimento.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: a Rages, na Média
  rationale: Com o verbo de movimento, a frase indica destino. “Na Média” identifica de modo natural a região em que ficava Rages.
- source_word: παρὰ Γαβαήλ
  choice: até Gabael
  rationale: παρά com referente pessoal indica ir até a pessoa ou ao lugar onde ela está. A formulação evita acrescentar “à casa de”, detalhe não expresso no texto grego.
- source_word: κόμισαί μοι τὸ ἀργύριον
  choice: Traga-me o dinheiro
  rationale: ἀργύριον significa literalmente prata, mas aqui designa o valor monetário confiado a Gabael; κόμισαι comunica trazê-lo de volta ao remetente.
- source_word: καὶ αὐτὸν ἄγε μοι
  choice: e traga também Gabael com você
  rationale: O pronome αὐτόν retoma Gabael. Repetir o nome elimina em português uma possível referência equivocada ao dinheiro e expressa o acompanhamento indicado por ἄγε.
- source_word: εἰς τὸν γάμον
  choice: para o casamento
  rationale: γάμος pode designar o casamento ou sua celebração festiva. “Casamento” conserva essa amplitude no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação do grego foi dividida em duas frases para fluidez, sem alterar a sequência das ordens. O nome “Gabael” foi repetido para tornar inequívoco o referente de αὐτόν.
