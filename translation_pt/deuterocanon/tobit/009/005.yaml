base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/005.yaml
  text: So Raphael went and lodged with Gabael[a], and he gave him the written note[b]; then Gabael brought out the money bags with the seals and gave them to him.
translation:
  language: pt
  text: Então Rafael foi e ficou hospedado com Gabael. Entregou-lhe o documento[a], e Gabael trouxe as bolsas de dinheiro, ainda lacradas[b], e as entregou a Rafael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «título de dívida» ou «nota promissória». O termo grego pode designar um documento escrito que reconhece uma obrigação financeira.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «as bolsas nos selos», isto é, com os selos ainda intactos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: foi
  rationale: Verbo narrativo simples de deslocamento; «foi» é natural e corresponde diretamente ao aoristo.
- source_word: ηὐλίσθη παρὰ Γαβαήλ
  choice: ficou hospedado com Gabael
  rationale: αὐλίζομαι indica alojar-se ou passar a noite, e παρά com uma pessoa indica hospedagem junto dela; a formulação é clara sem acrescentar explicitamente uma casa.
- source_word: τὸ χειρόγραφον
  choice: o documento
  rationale: χειρόγραφον designa um registro escrito e, neste contexto, pode ser um título ou reconhecimento de dívida. «Documento» mantém a referência ampla, enquanto a nota registra as opções financeiras mais específicas.
- source_word: προήνεγκεν
  choice: trouxe
  rationale: Expressa o ato de apresentar ou trazer para fora os objetos guardados; «trouxe» é idiomático e suficiente no contexto.
- source_word: τὰ θυλάκια
  choice: as bolsas de dinheiro
  rationale: θυλάκιον é uma pequena bolsa ou saco. A menção a dinheiro explicita sua função já estabelecida pelo contexto narrativo.
- source_word: ἐν ταῖς σφραγῖσιν
  choice: ainda lacradas
  rationale: A expressão indica que as bolsas estavam com os selos intactos. «Ainda lacradas» transmite naturalmente essa condição em português.
- source_word: ἔδωκεν αὐτῷ
  choice: as entregou a Rafael
  rationale: O objeto plural é recuperado do contexto. Nomear Rafael evita a ambiguidade pronominal que seria pouco natural em português, sem alterar os participantes da ação.
