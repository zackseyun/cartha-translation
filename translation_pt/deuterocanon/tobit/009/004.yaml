  text: And my father is counting the days, and if I delay long, he will be greatly distressed.
translation:
  language: pt
  text: E meu pai está contando os dias; se eu demorar muito, ele ficará profundamente angustiado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀριθμεῖ
  choice: está contando
  rationale: O presente grego indica uma ação em curso; a locução verbal preserva naturalmente a ideia de que o pai acompanha ansiosamente a passagem dos dias.
- source_word: τὰς ἡμέρας
  choice: os dias
  rationale: Tradução direta do objeto; em português, “contar os dias” expressa de modo natural a espera atenta sem acrescentar informação.
- source_word: χρονίσω μέγα
  choice: eu demorar muito
  rationale: O subjuntivo aoristo depois de ἐὰν apresenta uma possibilidade futura, e μέγα funciona adverbialmente, intensificando a demora. A formulação mantém a primeira pessoa sem sugerir uma causa externa.
- source_word: ὀδυνηθήσεται
  choice: ele ficará angustiado
  rationale: O verbo denota sofrimento emocional intenso. “Ficará angustiado” é claro, atual e preserva a força afetiva do grego.
- source_word: λίαν
  choice: profundamente
  rationale: O advérbio intensifica a angústia; “profundamente” combina com naturalidade com “angustiado” e comunica forte sofrimento.
