base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/001.yaml
  text: And Tobiah called Raphael and said to him[a], “Azariah[b], brother,”
translation:
  language: pt
  text: 'Tobias chamou Rafael e lhe disse: “Azarias[a], irmão,”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rafael é chamado aqui de “Azarias”, nome sob o qual vinha viajando com Tobias.
    reason: cross_reference
  - marker: b
    text: A tradição mais longa, alinhada aos testemunhos semíticos, prossegue imediatamente com as instruções de Tobias a Azarias/Rafael; o testemunho grego usado aqui conserva neste versículo apenas o início da fala.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: O aoristo de καλέω introduz aqui a fala direta. “Chamou” preserva o sentido sem acrescentar a força de “convocou”.
- source_word: Τωβίας
  choice: Tobias
  rationale: “Tobias” é a forma tradicional e amplamente reconhecida em português; neste contexto, o grego usa a mesma forma nominal que costuma designar o filho.
- source_word: Ῥαφαήλ
  choice: Rafael
  rationale: Forma portuguesa consagrada do nome.
- source_word: Ἀζαρία
  choice: Azarias
  rationale: Forma portuguesa consagrada. Embora fale com Rafael, Tobias o trata pelo nome sob o qual ele o acompanhava.
- source_word: ἀδελφέ
  choice: meu irmão
  rationale: O vocativo significa literalmente “irmão” e funciona aqui como tratamento afetuoso, não necessariamente como afirmação de parentesco. “Meu irmão” é natural em português e preserva a metáfora familiar.
