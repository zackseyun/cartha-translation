lexical_decisions:
- source_word: ηυλογησεν
  choice: abençoou
  rationale: O aoristo de εὐλογέω indica aqui o ato de conceder ou pronunciar uma bênção; “abençoou” é a forma mais natural e direta em português.
- source_word: τους αιωνας
  choice: para sempre
  rationale: A expressão temporal idiomática denota duração contínua; “para sempre” preserva o sentido em português corrente e digno.
theological_decisions:
- issue: Forma textual da frase de bênção
  choice: 'Manter no texto principal a formulação grega breve: “Ele os abençoou para sempre”.'
  alternative: Incluir “com uma bênção pura e santa” no texto principal.
  rationale: A expressão descritiva mais longa aparece como acréscimo em testemunhos marginais. A tradução conserva a leitura breve no corpo do texto e registra a variante em nota, sem decidir silenciosamente entre as formas textuais.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa. O pronome “os” explicita em português o objeto pessoal pressuposto pelo contexto, sem acrescentar “todos”, que aparece apenas como variante no aparato fornecido.
