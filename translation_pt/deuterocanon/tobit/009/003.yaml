lexical_decisions:
- source_word: διότι
  choice: Pois
  rationale: Introduz a razão da afirmação anterior, preservando de modo natural o valor causal no fluxo narrativo.
- source_word: ὠμόμοκεν
  choice: jurou
  rationale: Traduz o perfeito de ὄμνυμι como um juramento já feito e ainda válido; em português, o pretérito perfeito comunica isso naturalmente no contexto.
- source_word: ὁ Ῥαγουὴλ
  choice: Raguel
  rationale: Mantém a forma tradicional e reconhecível do nome em português.
- source_word: μὴ ἐξελθεῖν με
  choice: que não me deixaria partir
  rationale: Expressa naturalmente o conteúdo do juramento e explicita a autoridade de Raguel sobre a saída de Tobias, implícita no contexto. “Partir” comunica aqui o sentido contextual de sair da casa.
