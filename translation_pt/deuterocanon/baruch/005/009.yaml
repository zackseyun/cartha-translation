base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/009.yaml
  text: For God will lead Israel with gladness[a], by the light of his glory, with mercy and righteousness from him.
translation:
  language: pt
  text: Pois Deus conduzirá Israel com alegria, à luz da sua glória, com a misericórdia e a justiça[a] que procedem dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retidão”.'
    reason: δικαιοσύνη pode ressaltar tanto a justiça exercida quanto a retidão moral.
lexical_decisions:
- source_word: ἡγήσεται
  choice: conduzirá
  rationale: O futuro de ἡγέομαι indica que Deus guiará ou conduzirá Israel. “Conduzirá” é natural e preserva a imagem de restauração e êxodo.
- source_word: μετʼ εὐφροσύνης
  choice: com alegria
  rationale: εὐφροσύνη expressa alegria ou júbilo; “com alegria” comunica o sentido com clareza e dignidade.
- source_word: τῷ φωτὶ τῆς δόξης αὐτοῦ
  choice: à luz da sua glória
  rationale: O dativo pode indicar meio ou circunstância. “À luz da sua glória” mantém essa abertura sem tornar a construção pesada em português.
- source_word: ἐλεημοσύνῃ
  choice: misericórdia
  rationale: Neste contexto, o termo descreve a ação ou qualidade divina para com Israel, não a prática de dar esmolas.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: “Justiça” é a correspondência bíblica ampla e corrente em português para δικαιοσύνη, abrangendo tanto a retidão divina quanto sua ação justa; “retidão” é preservada em nota como alternativa.
- source_word: τῇ παρʼ αὐτοῦ
  choice: que procedem dele
  rationale: A expressão indica que a misericórdia e a justiça vêm de Deus. O plural explicita naturalmente em português a relação entendida no contexto.
theological_decisions:
- issue: Amplitude de δικαιοσύνη como atributo e ação de Deus
  choice: justiça
  alternative: retidão
  rationale: “Justiça” conserva a formulação bíblica tradicional e pode incluir tanto o caráter reto de Deus quanto sua atuação justa. A nota registra “retidão” sem restringir o texto principal a uma única nuance.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe fluente e vocabulário bíblico amplamente compreensível. O marcador foi colocado junto ao termo a que a alternativa lexical se refere.
