base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/006.yaml
  text: For they went out from you on foot[a], being led away by enemies, but God brings them to you[b], carried with glory as on a royal throne.
translation:
  language: pt
  text: Pois eles saíram de você a pé, levados por inimigos; mas Deus os traz até você[a], carregados[b] em glória, como em um trono real.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os conduz até você”; o verbo grego significa literalmente “traz para dentro” ou “conduz para dentro”, aqui no contexto do retorno do exílio.
    reason: lexical_alternative
  - marker: b
    text: Ou “levados no alto” ou “elevados”; a imagem contrasta a partida a pé com um retorno honrado e exaltado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ... παρὰ σοῦ
  choice: saíram de junto de você
  rationale: Expressa diretamente o movimento para longe da Jerusalém personificada, sem acrescentar ao verbo a ideia de retorno.
- source_word: πεζοὶ
  choice: a pé
  rationale: Forma portuguesa natural que mantém o contraste entre a partida humilhante e o retorno honroso.
- source_word: ἀγόμενοι ὑπʼ ἐχθρῶν
  choice: levados por inimigos
  rationale: Preserva a construção passiva e a sujeição dos exilados ao poder inimigo, sem intensificar indevidamente a violência.
- source_word: εἰσάγει ... πρὸς σὲ
  choice: os traz até você
  rationale: Comunica o movimento de entrada em direção à cidade personificada. Evita acrescentar explicitamente “de volta”, embora o retorno esteja claro no contexto.
- source_word: αἰρομένους
  choice: carregados
  rationale: Conserva a imagem de serem transportados, em contraste com terem partido a pé, e permite a nuance de serem erguidos em honra.
- source_word: μετὰ δόξης
  choice: com glória
  rationale: Mantém o valor honorífico e teológico de δόξα e segue de perto a construção grega.
- source_word: ὡς θρόνον βασιλείας
  choice: como num trono real
  rationale: Verte de modo idiomático a comparação grega comprimida e preserva a imagem régia sem explicá-la além do texto.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Equivalente padrão e direto no contexto.
theological_decisions:
- issue: Contraste entre exílio e restauração
  choice: Mantém-se o contraste entre sair a pé sob domínio inimigo e ser trazido por Deus com glória.
  alternative: Explicitar o retorno com “Deus os traz de volta até você”.
  rationale: O contexto implica restauração, mas εἰσάγει πρὸς σὲ expressa literalmente entrada ou condução em direção à cidade; a tradução evita tornar explícito no verbo o que permanece contextual.
- issue: Imagem do transporte exaltado
  choice: Preserva-se a comparação “carregados com glória, como num trono real”.
  alternative: Interpretar a imagem como simples retorno honroso ou traduzir “elevados em glória”.
  rationale: A formulação grega é poética e algo comprimida. Manter a imagem conserva sua força e sua tensão, em vez de reduzi-la a uma explicação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O tratamento “você” acompanha a personificação de Jerusalém e evita a ambiguidade regional de “tu” nas formas verbais. A pontuação com ponto e vírgula destaca o forte contraste entre a partida e o retorno.
