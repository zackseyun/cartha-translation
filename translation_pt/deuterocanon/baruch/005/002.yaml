base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/002.yaml
  text: Put on the robe of the righteousness that comes from God[d][c][b][a], and place on your head the turban of the glory of the Eternal.
translation:
  language: pt
  text: Vista o manto[a] da justiça que vem de Deus[b] e coloque sobre sua cabeça o turbante[c] da glória do Eterno[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “veste exterior” ou “capa”; o termo grego indica uma peça ampla usada por cima das outras roupas.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão que vem de Deus”. O termo grego pode abranger tanto a retidão moral e relacional quanto a justiça.
    reason: lexical_alternative
  - marker: c
    text: Ou “cobertura para a cabeça”; a tradução tradicional “mitra” pode sugerir, no português atual, uma peça eclesiástica mais específica do que o termo grego exige.
    reason: lexical_alternative
  - marker: d
    text: A expressão também pode ser entendida, de modo mais livre, como “a glória eterna”; porém, o grego provavelmente significa “a glória do Eterno”, isto é, a glória de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: περιβαλοῦ
  choice: Vista
  rationale: O imperativo de περιβάλλω apresenta a imagem de pôr uma roupa sobre si. “Vista” é natural em português e preserva diretamente a metáfora do vestuário.
- source_word: διπλοΐδα
  choice: manto
  rationale: O substantivo designa uma veste exterior ampla, possivelmente dobrada. “Manto” comunica uma peça exterior digna sem impor uma reconstrução técnica incerta.
- source_word: τῆς παρὰ τοῦ θεοῦ δικαιοσύνης
  choice: da justiça que vem de Deus
  rationale: A construção παρὰ τοῦ θεοῦ indica origem ou procedência. “Que vem de Deus” explicita essa relação com naturalidade, enquanto “justiça” preserva em português a amplitude moral, relacional e judicial de δικαιοσύνη.
- source_word: ἐπίθου
  choice: coloque
  rationale: O imperativo de ἐπιτίθημι significa pôr ou colocar. “Coloque” é claro e se ajusta ao registro poético sem soar arcaico.
- source_word: μίτραν
  choice: turbante
  rationale: μίτρα designa uma faixa ou cobertura enrolada para a cabeça. “Turbante” é compreensível e evita a associação eclesiástica específica que “mitra” costuma ter no português moderno.
- source_word: τῆς δόξης τοῦ αἰωνίου
  choice: da glória do Eterno
  rationale: A sequência de genitivos é mais naturalmente entendida como a glória pertencente ao Eterno, com αἰωνίου empregado substantivamente como designação de Deus. A tradução mantém a formulação compacta do grego.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: Em português, “justiça” é o equivalente lexical mais direto e conserva a possível dimensão moral, relacional e judicial do termo. “Retidão” também é possível, mas estreita a expressão sobretudo para uma qualidade moral.
- issue: Emprego substantivado de τοῦ αἰωνίου
  choice: do Eterno
  alternative: da glória eterna
  rationale: 'A sintaxe grega favorece entender αἰωνίου como título substantivado referente a Deus: “a glória do Eterno”. A alternativa toma o termo como adjetivo de “glória”, leitura possível em sentido mais livre, mas menos provável sintaticamente.'
translation_notes:
  register: Português moderno, claro e dignificado, com imperativos na terceira pessoa do singular. A linguagem preserva o paralelismo poético das duas ações e as imagens cerimoniais de vestuário, evitando tanto arcaísmos quanto terminologia eclesiástica excessivamente específica.
