  source_fidelity: 'O sentido central está correto: γάρ é adequadamente ligado por “Pois”; Deus é o agente futuro de δείξει; e λαμπρότητα é bem traduzido por “esplendor”. Contudo, “seu” pode ser entendido em português como reflexivo de Deus (“o esplendor de Deus”), em vez de retomar a destinatária singular, Jerusalém. “Teu” preserva de modo inequívoco a segunda pessoa do singular do grego.'
  naturalness: A redação é clara e de registro apropriado. “Sob o céu” é uma formulação um pouco mais concisa e idiomática do que “debaixo do céu”, mantendo a imagem abrangente do original.
  terminology: “Esplendor” corresponde bem a λαμπρότητα, conservando as dimensões de brilho e magnificência. As alternativas da nota são legítimas; “glória” deve permanecer como alternativa, não como tradução principal, pois o grego não emprega δόξα.
  issues:
