  text: For God will show your splendor to all under heaven[a].
translation:
  language: pt
  text: Pois Deus mostrará o teu esplendor a todos os que estão sob o céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resplendor”, “glória” ou “brilho”, em vez de “esplendor”.
    reason: Alternativas lexicais legítimas para λαμπρότητα.
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Pois
  rationale: Preserva a função explicativa de γάρ e liga naturalmente o versículo ao contexto anterior.
- source_word: θεὸς
  choice: Deus
  rationale: Refere-se diretamente ao Deus de Israel neste contexto, sem ambiguidade de título.
- source_word: δείξει
  choice: mostrará
  rationale: Traduz diretamente o futuro ativo de δείκνυμι, mantendo Deus como agente que torna visível o esplendor de Jerusalém.
- source_word: τῇ ὑπʼ οὐρανὸν πάσῃ
  choice: a todos os que estão debaixo do céu
  rationale: Conserva a imagem espacial e o alcance universal da expressão grega sem acrescentar explicitamente 'mundo' ou 'povos'.
- source_word: τὴν σὴν
  choice: o seu
  rationale: Mantém a segunda pessoa do singular dirigida a Jerusalém; em português corrente, 'seu' é natural no tratamento por você implícito.
- source_word: λαμπρότητα
  choice: esplendor
  rationale: Expressa tanto o brilho visível quanto a magnificência e honra do termo grego, sem recorrer ao mais teologicamente carregado 'glória'.
theological_decisions:
- issue: Representação da honra restaurada de Jerusalém em λαμπρότητα
  choice: esplendor
  alternative: resplendor; glória; brilho
  rationale: “Esplendor” preserva conjuntamente a nuance luminosa e a dignidade exaltada, sem identificar o termo com δόξα nem eliminar sua dimensão visível.
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla compreensão internacional e boa naturalidade brasileira. O referente singular de “seu” é Jerusalém, personificada no contexto.
