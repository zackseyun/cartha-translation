    issue: Ambiguidade de “o seu esplendor”
    rationale: Embora possa funcionar como possessivo de segunda pessoa em certos usos, “seu” também pode remeter ao sujeito “Deus”. O grego τὴν σὴν dirige-se inequivocamente à cidade personificada no contexto; “teu” preserva essa referência.
