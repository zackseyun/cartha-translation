base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/007.yaml
  text: For God has ordered that every high mountain and the everlasting hills be made low[a], and the valleys be filled for the leveling of the ground, so that Israel may walk safely in the glory of God.
translation:
  language: pt
  text: Pois Deus ordenou que todo monte elevado e as colinas eternas fossem rebaixados, e que os vales fossem preenchidos para nivelar a terra, a fim de que Israel caminhe em segurança na glória de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela glória de Deus” ou “por meio da glória de Deus”. O dativo grego pode indicar tanto a esfera ou associação em que Israel caminha quanto o meio pelo qual sua caminhada é protegida.'
    reason: Leitura alternativa decorrente da amplitude sintática do dativo grego.
lexical_decisions:
- source_word: συνέταξεν
  choice: ordenou
  rationale: Expressa uma determinação divina revestida de autoridade e, ao mesmo tempo, o propósito de dispor a paisagem para a passagem de Israel.
- source_word: ταπεινοῦσθαι
  choice: fossem rebaixados
  rationale: Com montes e colinas, o sentido é de redução física da altura, não de humilhação moral.
- source_word: πᾶν ὄρος ὑψηλὸν
  choice: todo monte elevado
  rationale: Preserva o valor distributivo de πᾶν e traduz de modo direto a imagem topográfica.
- source_word: θῖνας αἰωνίους
  choice: as colinas eternas
  rationale: θῖνας pode designar montes, elevações ou cordilheiras; no paralelismo topográfico, “colinas” é claro e natural. “Eternas” conserva o tom elevado e a aparente permanência expressa por αἰωνίους.
- source_word: φάραγγας
  choice: os vales
  rationale: Embora possa significar ravinas ou desfiladeiros, “vales” comunica de modo amplo e natural as depressões que devem ser preenchidas.
- source_word: πληροῦσθαι
  choice: fossem preenchidos
  rationale: Mantém o infinitivo passivo e a imagem de encher as depressões do terreno.
- source_word: εἰς ὁμαλισμὸν τῆς γῆς
  choice: para nivelar a terra
  rationale: 'Expressa com naturalidade o resultado pretendido: tornar plana a superfície do terreno.'
- source_word: ἵνα βαδίσῃ
  choice: a fim de que Israel caminhe
  rationale: Preserva a oração de finalidade e a imagem bíblica do povo avançando por um caminho preparado.
- source_word: ἀσφαλῶς
  choice: em segurança
  rationale: Equivalente português natural para o sentido de caminhar sem perigo, de modo seguro.
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: na glória de Deus
  rationale: Mantém aberta a possibilidade de o dativo indicar esfera ou associação, sem eliminar sua possível força instrumental.
theological_decisions:
- issue: Sentido de τῇ τοῦ θεοῦ δόξῃ em relação à caminhada segura de Israel
  choice: na glória de Deus
  alternative: pela glória de Deus; por meio da glória de Deus
  rationale: 'O dativo grego admite mais de uma relação: esfera ou associação, mas também meio. A tradução principal conserva essa amplitude teológica, e a nota registra explicitamente a leitura instrumental.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência bíblica moderada. “Monte elevado”, “colinas eternas” e “na glória de Deus” preservam o caráter poético da imagem sem recorrer a linguagem arcaica.
