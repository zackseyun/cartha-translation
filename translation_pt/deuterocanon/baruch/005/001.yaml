base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/001.yaml
  text: Take off[a], O Jerusalem, the garment of your mourning and affliction[b], and put on forever the splendor of the glory from God.
translation:
  language: pt
  text: Tire, Jerusalém, a veste do seu luto e da sua aflição e, para sempre, vista-se com o esplendor[a] da glória que vem de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “beleza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔκδυσαι
  choice: Tire
  rationale: O imperativo médio de ἐκδύω indica retirar uma peça de roupa. “Tire” é natural em português e preserva a metáfora sem acrescentar intensidade.
- source_word: στολή
  choice: veste
  rationale: στολή pode designar uma veste ou túnica, inclusive de caráter solene. “Veste” mantém a imagem singular e o registro elevado.
- source_word: πένθος
  choice: luto
  rationale: O termo designa pesar expresso, especialmente luto individual ou coletivo. “Luto” combina naturalmente com a imagem da veste.
- source_word: κάκωσις
  choice: aflição
  rationale: O substantivo abrange sofrimento, opressão e condição miserável. “Aflição” mantém essa amplitude sem especificar indevidamente a causa.
- source_word: ἔνδυσαι
  choice: vista-se com
  rationale: O imperativo médio de ἐνδύω forma o contraponto de Ἔκδυσαι. “Vista-se com” preserva a metáfora do vestuário e soa natural em português.
- source_word: εὐπρέπεια
  choice: esplendor
  rationale: A palavra reúne as ideias de beleza, dignidade e magnificência. “Esplendor” expressa bem o tom elevado, enquanto a nota registra a alternativa “beleza”.
- source_word: δόξα
  choice: glória
  rationale: “Glória” é o equivalente bíblico corrente de δόξα e preserva seu peso teológico.
- source_word: παρὰ τοῦ θεοῦ
  choice: que vem de Deus
  rationale: παρά com genitivo indica origem. A formulação explicita de modo natural que Deus é a fonte da glória, sem transformá-la simplesmente em “glória de Deus”.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: A expressão indica duração permanente; “para sempre” é clara, corrente e adequada à promessa de restauração duradoura.
theological_decisions:
- issue: Personificação de Jerusalém
  choice: Manter a interpelação direta a Jerusalém, com ordens de tirar uma veste e vestir-se de esplendor.
  alternative: Diluir a imagem e tratar Jerusalém apenas como referência coletiva ao povo.
  rationale: O grego se dirige diretamente a Ἰερουσαλήμ e emprega imperativos ligados ao ato de trocar de roupa. A personificação é parte da força profética do versículo.
- issue: Origem da glória
  choice: “a glória que vem de Deus”
  alternative: “a glória de Deus”
  rationale: παρὰ τοῦ θεοῦ marca procedência ou fonte. A tradução evita apagar a distinção entre a glória concedida por Deus a Jerusalém e uma simples referência à glória possuída por Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos “tire” e “vista-se” tratam Jerusalém segundo o uso corrente de “você”, e o paralelismo do original é preservado.
