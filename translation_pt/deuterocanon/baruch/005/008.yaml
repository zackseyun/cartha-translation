  text: And the forests as well as every fragrant tree gave shade to Israel, by the command of God.
translation:
  language: pt
  text: E as florestas e toda árvore aromática deram sombra a Israel, por ordem de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δρυμοί
  choice: as florestas
  rationale: Embora δρυμός possa referir-se a bosque ou mata, o plural coletivo é expresso naturalmente por “as florestas”, preservando a amplitude do cenário.
- source_word: πᾶν ξύλον εὐωδίας
  choice: toda árvore aromática
  rationale: ξύλον designa aqui árvore, e o genitivo εὐωδίας indica qualidade fragrante; “aromática” é claro e natural em português.
- source_word: ἐσκίασαν
  choice: deram sombra
  rationale: Expressa de modo idiomático a ação de sombrear ou proporcionar sombra, mantendo o aoristo narrativo.
- source_word: προστάγματι τοῦ θεοῦ
  choice: por ordem de Deus
  rationale: O dativo apresenta a ordem divina como fundamento ou meio da ação; “por ordem de Deus” conserva esse sentido sem explicitação excessiva.
theological_decisions:
- issue: Agência da criação sob a ordem divina
  choice: por ordem de Deus
  alternative: ao comando de Deus
  rationale: A formulação preserva a atuação obediente da natureza decorrente da determinação divina, sem ampliar o texto para uma descrição mais específica do modo dessa atuação.
translation_notes:
  register: Português moderno, claro e digno, com coordenação simples próxima do grego. “Árvore aromática” evita a formulação menos natural “árvore de fragrância”.
