base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/005.yaml
  text: Rise up[a], Jerusalem, and stand on the height, and look toward the east, and see your children gathered from the setting of the sun to its rising, at the word of the Holy One[b], rejoicing in the remembrance of God.
translation:
  language: pt
  text: Levante-se, Jerusalém, e fique de pé no alto. Olhe para o oriente e veja seus filhos reunidos desde o pôr do sol até o nascer do sol, pela palavra do Santo[a], regozijando-se na lembrança de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à palavra do Santo” ou “à ordem do Santo”. O dativo grego também pode indicar a palavra ou ordem que ocasiona a reunião.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode significar “porque Deus se lembrou deles” ou “na lembrança que eles têm de Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάστηθι
  choice: Levante-se
  rationale: O imperativo aoristo convoca Jerusalém a se erguer; a formulação é atual, natural e mantém a força da exortação.
- source_word: στῆθι ἐπὶ τοῦ ὑψηλοῦ
  choice: fique de pé no alto
  rationale: Preserva o ponto elevado sem acrescentar “monte” ou “montanha”, termos que não aparecem no grego.
- source_word: περίβλεψαι πρὸς ἀνατολάς
  choice: Olhe para o oriente
  rationale: Expressa de modo natural a ação de dirigir o olhar para o leste. O plural grego ἀνατολάς tem aqui sentido direcional idiomático.
- source_word: συνηγμένα τὰ τέκνα
  choice: seus filhos reunidos
  rationale: O particípio perfeito passivo descreve os filhos já reunidos; “filhos” é inclusivo no contexto e não restringe o referente ao sexo masculino.
- source_word: ἀπὸ ἡλίου δυσμῶν ἕως ἀνατολῶν
  choice: desde o pôr do sol até o nascer do sol
  rationale: Conserva a imagem solar e a amplitude geográfica do original, em vez de reduzi-la simplesmente a “do oeste ao leste”.
- source_word: τῷ ῥήματι
  choice: pela palavra
  rationale: O dativo pode indicar meio ou causa. “Pela palavra” preserva a atuação eficaz da declaração divina sem substituir ῥῆμα por “ordem” no texto principal.
- source_word: τοῦ ἁγίου
  choice: do Santo
  rationale: O adjetivo substantivado e articulado funciona como título reverente; “o Santo” evita acrescentar “Deus” neste ponto.
- source_word: χαίροντες
  choice: regozijando-se
  rationale: Mantém a forma participial e o tom elevado, ligando a alegria aos filhos reunidos.
- source_word: τῇ τοῦ θεοῦ μνείᾳ
  choice: na lembrança de Deus
  rationale: A formulação compacta conserva, tanto quanto possível em português, a possibilidade de se tratar da lembrança que Deus tem do povo ou da lembrança que o povo tem de Deus.
theological_decisions:
- issue: Sentido de τῇ τοῦ θεοῦ μνείᾳ
  choice: na lembrança de Deus
  alternative: porque Deus se lembrou deles; na lembrança que têm de Deus
  rationale: O genitivo pode ser entendido subjetiva ou objetivamente. O texto principal mantém a tensão, e a nota explicita as duas leituras sem escolher uma delas.
- issue: Valor do dativo τῷ ῥήματι
  choice: pela palavra do Santo
  alternative: à palavra do Santo; à ordem do Santo
  rationale: O dativo admite valor instrumental e também pode apresentar a palavra como ocasião ou comando ao qual a reunião ocorre. A tradução principal adota o valor instrumental, registrando a alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “oriente” por seu uso natural no registro bíblico atual, sem arcaísmo excessivo. As duas ambiguidades relevantes do grego foram preservadas no texto e esclarecidas em notas.
