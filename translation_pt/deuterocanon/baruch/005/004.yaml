base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/005/004.yaml
  text: For your name will be called by God forever[b][a], “Peace of righteousness and glory of godliness.”
translation:
  language: pt
  text: 'Pois Deus lhe dará para sempre este nome: “Paz da justiça[a] e glória da devoção a Deus[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Paz da retidão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “glória da piedade” ou “glória da reverência a Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθήσεται
  choice: dará ... este nome
  rationale: O futuro passivo de καλέω, dentro de uma fórmula de nomeação, indica que Deus confere um nome. A construção ativa com «Deus lhe dará» é mais natural em português e preserva a agência divina expressa por παρὰ τοῦ θεοῦ.
- source_word: τὸ ὄνομα
  choice: nome
  rationale: «Nome» conserva o idioma bíblico de uma identidade ou designação conferida, sem restringi-lo à ideia de mero título.
- source_word: παρὰ τοῦ θεοῦ
  choice: Deus lhe dará
  rationale: παρά com o genitivo pode indicar fonte ou agência; nesta fórmula, a redação escolhida comunica de modo idiomático que o nome é conferido por Deus.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Expressa claramente a duração permanente prometida pelo texto.
- source_word: εἰρήνη
  choice: Paz
  rationale: Integra o nome conferido e, por isso, recebe inicial maiúscula.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: «Justiça» é a correspondência bíblica ampla e corrente em português para δικαιοσύνη, podendo abranger retidão moral e ordem justa. A alternativa «retidão» é preservada em nota.
- source_word: δόξα
  choice: glória
  rationale: Preserva as associações bíblicas de honra, esplendor e dignidade conferida.
- source_word: θεοσεβείας
  choice: devoção a Deus
  rationale: Torna explícito e inteligível o sentido de reverência ou piedade dirigida a Deus, evitando que «devoção» isoladamente pareça ambígua.
theological_decisions:
- issue: Sentido de δικαιοσύνης no nome conferido
  choice: justiça
  alternative: retidão
  rationale: «Justiça» preserva o termo bíblico tradicional em português e sua amplitude moral e relacional; «retidão» explicita outra nuance legítima sem restringir silenciosamente o texto.
- issue: Sentido de θεοσεβείας
  choice: devoção a Deus
  alternative: piedade; reverência a Deus
  rationale: O composto grego indica uma atitude religiosa voltada para Deus. «Devoção a Deus» é claro e atual, enquanto as demais possibilidades são registradas em nota.
- issue: Função da frase final
  choice: nome divinamente conferido, marcado por aspas
  alternative: aposição sem aspas
  rationale: Os nominativos εἰρήνη e δόξα apresentam o conteúdo do novo nome. As aspas apenas tornam essa função sintática clara ao leitor moderno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para uma fórmula natural de nomeação em português, sem alterar a agência divina nem a duração permanente. As aspas identificam o conteúdo do nome conferido.
