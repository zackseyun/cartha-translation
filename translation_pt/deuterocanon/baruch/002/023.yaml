base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/023.yaml
  text: I will cause the sound of gladness and the sound of rejoicing to cease from the cities of Judah and from the outskirts of Jerusalem[a], the sound of bridegroom and the sound of bride[b], and all the land will become impassable because of its inhabitants.
translation:
  language: pt
  text: Farei cessar, nas cidades de Judá e fora de Jerusalém[a], o som de alegria e o som de júbilo, o som do noivo e o som da noiva; e toda a terra se tornará intransitável por causa dos que nela habitam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “fora de Jerusalém”. Algumas traduções trazem “nas ruas de Jerusalém” sob a influência de fórmulas proféticas paralelas, mas o texto grego preservado aqui diz “fora”.'
    reason: alternative_reading
  - marker: b
    text: A frase final é difícil no grego. Também pode ser entendida como “toda a terra se tornará intransitável, sem habitantes” ou “desprovida de habitantes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλείψειν ποιήσω
  choice: Farei cessar
  rationale: A construção causativa com ποιέω e infinitivo atribui diretamente ao agente a ação de fazer cessar, preservando a força ativa do anúncio de juízo.
- source_word: ἐκ πόλεων Ἰούδα καὶ ἔξωθεν Ἰερουσαλήμ
  choice: nas cidades de Judá e nos arredores de Jerusalém
  rationale: Em português, “fazer cessar nas cidades” expressa naturalmente o afastamento indicado por ἐκ. ἔξωθεν significa literalmente “fora”; “arredores” comunica aqui a área exterior a Jerusalém sem importar a leitura harmonizada “ruas”.
- source_word: φωνὴν εὐφροσύνης καὶ φωνὴν χαρμοσύνης
  choice: o som de alegria e o som de júbilo
  rationale: “Som” se ajusta à enumeração de manifestações festivas, e a repetição conserva o paralelismo enfático do grego.
- source_word: φωνὴν νυμφίου καὶ φωνὴν νύμφης
  choice: o som do noivo e o som da noiva
  rationale: Mantém a repetição de φωνή e emprega os equivalentes naturais no contexto de celebração nupcial.
- source_word: ἔσται πᾶσα ἡ γῆ εἰς ἄβατον
  choice: toda a terra se tornará intransitável
  rationale: ἄβατος designa aquilo que não pode ser percorrido; “intransitável” preserva essa especificidade melhor do que uma expressão genérica como “desolada”.
- source_word: ἀπὸ ἐνοικούντων
  choice: por causa dos que nela habitam
  rationale: A frase grega é difícil. Esta tradução conserva a possível força causal de ἀπό e explicita apenas o referente locativo implícito no particípio, sem ocultar em nota a alternativa de separação ou ausência.
theological_decisions:
- issue: Possível harmonização com fórmulas proféticas paralelas de juízo
  choice: Conservar a referência à região exterior de Jerusalém e a construção difícil no fim do versículo.
  alternative: Traduzir “nas ruas de Jerusalém” e “sem habitantes”, de acordo com fórmulas paralelas mais conhecidas.
  rationale: O testemunho grego existente deve governar a tradução. As formulações paralelas podem esclarecer possibilidades, mas não devem substituir silenciosamente as palavras preservadas neste texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. “Júbilo” mantém distinção natural em relação a “alegria”; “intransitável” retém a imagem concreta do grego. As ambiguidades textuais relevantes são apresentadas em notas, sem harmonização silenciosa.
