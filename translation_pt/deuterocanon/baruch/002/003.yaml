translation:
  language: pt
  text: a ponto de nós comermos — cada homem a carne de seu filho, e cada homem a carne de sua filha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego fornecido é uma oração dependente, não uma frase completa, e sua construção distributiva é incomum: literalmente, “a ponto de nós comermos — um homem a carne de seu filho, e um homem a carne de sua filha”. A tradução preserva essa estrutura sem reconstruir o contexto ausente.'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ φαγείν ἡμᾶς
  choice: a ponto de nós comermos
  rationale: O infinitivo articular com τοῦ, seguido do sujeito acusativo ἡμᾶς (“nós”), exprime aqui consequência dentro de uma oração dependente. A formulação conserva tanto o valor infinitivo quanto a primeira pessoa plural, presente no grego.
- source_word: ἄνθρωπον
  choice: cada homem
  rationale: 'A repetição do singular acusativo tem valor distributivo no enunciado: um homem em relação ao filho e um homem em relação à filha. “Cada homem” preserva a singularidade e torna a construção compreensível em português sem convertê-la interpretativamente em “uns... outros”.'
- source_word: σάρκας
  choice: a carne
  rationale: No contexto, o termo se refere literalmente à carne do corpo. “Carne” mantém a gravidade concreta da declaração e evita qualquer leitura metafórica.
- source_word: υἱοῦ αὐτοῦ
  choice: de seu filho
  rationale: O genitivo com αὐτοῦ indica a relação possessiva. “Seu filho” traduz o grego diretamente, sem acrescentar a ênfase de “seu próprio filho”, que não é lexicalmente explícita.
- source_word: θυγατρὸς αὐτοῦ
  choice: de sua filha
  rationale: A expressão paralela é traduzida de modo simétrico como “sua filha”, preservando a posse indicada no grego sem ênfase adicional.
theological_decisions:
- issue: Caráter fragmentário da redação fornecida e relação com o contexto mais amplo
  choice: Traduzir a oração grega fornecida como uma expressão dependente de consequência, sem completar a frase com material contextual ausente.
  alternative: Reconstruir uma frase completa com base nos versículos vizinhos ou omitir o pronome ἡμᾶς.
  rationale: A fonte fornecida começa com uma construção infinitiva dependente e contém explicitamente ἡμᾶς (“nós”). Preservar essa estrutura e esse pronome mantém a tradução ancorada no testemunho grego apresentado e deixa transparente sua incompletude sintática.
translation_notes:
  register: Português moderno, sóbrio e digno, com legibilidade brasileira. O travessão sinaliza a distribuição explicativa após “nós comermos” e ajuda a conservar a sintaxe marcada do grego sem suavizar o horror do enunciado.
