base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/012.yaml
  text: We have sinned[a], we have acted ungodly, we have done wrong, O Lord our God, against all your ordinances.
translation:
  language: pt
  text: Pecamos, agimos com impiedade, fizemos o que é errado, ó Senhor, nosso Deus, contra todos os teus preceitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra todos os teus juízos justos” ou “com relação a todos os teus preceitos”. A expressão grega pode indicar oposição às determinações de Deus ou, de modo mais amplo, relação com elas.
    reason: alternativa lexical e ambiguidade sintática
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: Pecamos
  rationale: O aoristo integra uma confissão de atos cometidos; o pretérito perfeito simples é a forma natural e direta em português.
- source_word: ἠσεβήσαμεν
  choice: agimos com impiedade
  rationale: Preserva o sentido verbal de conduta irreverente ou ímpia, com linguagem clara e digna.
- source_word: ἠδικήσαμεν
  choice: praticamos o mal
  rationale: Expressa de modo amplo a ideia de agir injustamente ou fazer o que é errado, sem introduzir um objeto pessoal ausente no grego.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: ó Senhor, nosso Deus
  rationale: Reproduz o vocativo solene e a relação possessiva em português natural; κύριος é traduzido por “Senhor”.
- source_word: ἐπὶ
  choice: contra
  rationale: No contexto penitencial, comunica que o pecado foi cometido em oposição às determinações de Deus, embora a preposição também possa indicar relação mais geral.
- source_word: πᾶσιν τοῖς δικαιώμασίν σου
  choice: todos os teus preceitos
  rationale: “Preceitos” mantém o sentido de determinações ou normas divinas vinculantes em linguagem atual, sem restringir δικαιώματα a sentenças judiciais.
theological_decisions:
- issue: Tradução de κύριος na invocação dirigida a Deus
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: O texto grego traz κύριος, não o nome divino hebraico; “Senhor” preserva a forma direta de oração sem importar uma distinção ausente na fonte.
- issue: Sentido de δικαιώματα na confissão penitencial
  choice: preceitos
  alternative: decretos; estatutos; juízos justos
  rationale: O termo aponta para determinações ou padrões vinculantes de Deus. “Preceitos” conserva essa amplitude legal e moral, enquanto a nota registra a possível nuance judicial.
- issue: Relação expressa por ἐπὶ com o dativo
  choice: contra
  alternative: a respeito de; com relação a
  rationale: “Contra” se ajusta ao contexto de confissão e expressa transgressão, mas a construção grega admite uma relação semântica mais ampla, preservada na nota.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. A sequência sem conjunções — “Pecamos, agimos com impiedade, praticamos o mal” — acompanha a força cumulativa da confissão grega. O marcador foi colocado após a expressão a que a nota efetivamente se refere.
