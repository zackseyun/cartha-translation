lexical_decisions:
- source_word: γνώσονται
  choice: saberão
  rationale: O futuro de γινώσκω é traduzido de modo direto e natural, preservando o sentido de reconhecimento relacional sem reduzi-lo à mera compreensão intelectual.
- source_word: Κύριος
  choice: Senhor
  rationale: Título divino consagrado e adequado neste contexto, em relação a «o Deus deles».
- source_word: ὁ θεὸς αὐτῶν
  choice: o Deus deles
  rationale: Reproduz de maneira idiomática a relação expressa pelo possessivo grego e mantém a linguagem de aliança.
- source_word: δώσω
  choice: darei
  rationale: Tradução direta e corrente do futuro de δίδωμι.
- source_word: καρδίαν
  choice: um coração
  rationale: Mantém o substantivo concreto e a metáfora antropológica do texto grego, sem explicá-la como mente, entendimento ou disposição.
- source_word: ὦτα ἀκούοντα
  choice: ouvidos que ouvem
  rationale: Conserva a formulação concreta e participial do grego, indicando ouvidos responsivos sem acrescentar explicitamente ideias como obediência ou entendimento.
theological_decisions:
- issue: Imagem de restauração antropológica em «um coração e ouvidos que ouvem»
  choice: Manter as metáforas concretas de coração e ouvidos.
  alternative: Traduzir interpretativamente como «entendimento e receptividade» ou «um coração compreensivo e ouvidos atentos».
  rationale: O grego apresenta καρδίαν e ὦτα ἀκούοντα sem explicar a relação entre transformação interior, percepção e obediência. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação repetida com «E» acompanha a estrutura grega. Não foi inserida nota, pois «ouvidos que ouvem» já representa de perto a expressão literal e não exige alternativa para sua compreensão.
