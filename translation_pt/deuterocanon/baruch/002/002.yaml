translation:
  language: pt
  text: 'Nada semelhante ao que ele fez em Jerusalém havia sido feito debaixo de todo o céu, conforme está escrito na Lei de Moisés:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐποιήθη
  choice: Nada semelhante havia sido feito
  rationale: A forma passiva impessoal expressa que algo assim não havia acontecido; “nada semelhante” produz uma frase natural em português sem identificar explicitamente o agente.
- source_word: ὑποκάτω παντὸς τοῦ οὐρανοῦ
  choice: debaixo de todo o céu
  rationale: Mantém a expressão abrangente e idiomática do grego.
- source_word: καθὰ ἐποίησεν
  choice: ao que ele fez
  rationale: Preserva o sujeito masculino singular implícito e a comparação, sem acrescentar uma identificação ausente neste versículo.
- source_word: κατὰ τὰ γεγραμμένα
  choice: conforme está escrito
  rationale: Expressão portuguesa natural para a referência ao conteúdo registrado nas Escrituras.
- source_word: ἐν τῷ νόμῳ Μωυσῆ
  choice: na Lei de Moisés
  rationale: Tradução convencional, clara e formal do sintagma grego.
theological_decisions:
- issue: Identidade do sujeito de ἐποίησεν
  choice: ele fez
  alternative: o Senhor fez
  rationale: O grego traz apenas o verbo na terceira pessoa do singular, sem nomear o sujeito neste versículo; a tradução preserva essa dependência do contexto e não explicita uma identificação interpretativa.
- issue: Relação com a Lei de Moisés
  choice: conforme está escrito
  alternative: segundo as coisas escritas
  rationale: Comunica que os acontecimentos correspondem ao texto da Lei sem restringir indevidamente o sentido a uma única citação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva o tom solene e a ambiguidade do sujeito. Os dois-pontos finais refletem que a frase introduz o conteúdo desenvolvido no versículo seguinte.
