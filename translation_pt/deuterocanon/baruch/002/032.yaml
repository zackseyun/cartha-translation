  text: and they will praise me in the land of their exile[a], and they will remember my name[b];
translation:
  language: pt
  text: e me louvarão na terra do seu exílio[a] e se lembrarão do meu nome[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na terra para onde foram deportados». O termo grego pode indicar a remoção e o estabelecimento longe da terra natal; «exílio» se ajusta melhor ao contexto.
    reason: lexical_alternative
  - marker: b
    text: «Meu nome» preserva o modo bíblico de falar da identidade revelada e da honra de Deus.
    reason: theological_idiom
lexical_decisions:
- source_word: αἰνέσουσίν
  choice: louvarão
  rationale: O futuro ativo de αἰνέω indica louvor expresso; «louvarão» é natural, claro e preserva o sentido cultual.
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  choice: na terra do seu exílio
  rationale: A expressão é locativa, e ἀποικισμός denota afastamento e estabelecimento fora da terra de origem. No contexto de juízo e dispersão, «exílio» comunica melhor o deslocamento imposto, sem restringi-lo ao ato da deportação.
- source_word: μνησθήσονται
  choice: se lembrarão
  rationale: O futuro de μιμνῄσκομαι é vertido naturalmente pela construção pronominal portuguesa «se lembrarão», seguida da preposição «de».
- source_word: τοῦ ὀνόματός μου
  choice: do meu nome
  rationale: Mantém o idioma bíblico, que pode abranger a identidade revelada e a honra de Deus, sem explicitar no texto principal mais do que o grego afirma.
theological_decisions:
- issue: Sentido de «meu nome» no contexto da aliança
  choice: Manter literalmente «meu nome»
  alternative: minha reputação; quem eu sou
  rationale: A expressão possui ressonância teológica que vai além de uma designação pessoal, mas preservá-la evita reduzir ou resolver indevidamente essa amplitude.
- issue: Força de ἀποικισμός no contexto de juízo e restauração
  choice: exílio
  alternative: deportação; dispersão; estabelecimento em terra estrangeira
  rationale: «Exílio» expressa de modo conciso a condição de viver longe da própria terra como consequência do juízo, sem acrescentar pormenores ausentes do versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Conservou-se o paralelismo das duas orações e o ponto e vírgula do trecho fornecido.
