  text: Let your wrath turn away from us, because we have been left few among the nations where you scattered us there.
translation:
  language: pt
  text: Que a tua ira se afaste de nós, pois fomos deixados em pequeno número entre as nações para onde nos dispersaste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστραφήτω
  choice: se afaste
  rationale: O imperativo aoristo passivo de ἀποστρέφω expressa o pedido de que a ira se desvie ou se retire; «se afaste» é natural e mantém a imagem de afastamento.
- source_word: ὁ θυμός σου
  choice: a tua ira
  rationale: θυμός, neste contexto, designa a indignação ou ira divina; «ira» é claro, digno e tradicional sem acrescentar interpretação.
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão do pedido; «pois» conserva o valor causal com fluidez em português.
- source_word: κατελείφθημεν ὀλίγοι
  choice: restamos poucos
  rationale: A forma passiva significa que foram deixados em pequeno número. «Restamos poucos» comunica idiomaticamente o resultado sem perder a ideia de remanescente.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: No contexto da dispersão, ἐν indica presença no meio dos povos; «entre as nações» é mais natural que «nas nações».
- source_word: οὗ διέσπειρας ἡμᾶς ἐκεῖ
  choice: para onde nos dispersaste
  rationale: A combinação οὗ...ἐκεῖ é enfática e algo redundante em grego. «Para onde» transmite o destino da dispersão em português natural; repetir «ali» seria desnecessário e pouco idiomático.
theological_decisions:
- issue: Pedido para que cesse a ira divina
  choice: Que a tua ira se afaste de nós
  alternative: Afasta de nós a tua ira
  rationale: A formulação escolhida acompanha a construção grega em terceira pessoa e preserva o tom de súplica, sem reformular o pedido como ordem direta.
- issue: Condição do povo disperso
  choice: restamos poucos
  alternative: fomos deixados em pequeno número
  rationale: A opção natural preserva a condição de um remanescente reduzido, sem explicar por quem foram deixados nem introduzir uma doutrina específica sobre o remanescente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a segunda pessoa singular dirigida a Deus e evita a redundância pouco natural «para onde... ali», embora reconheça a ênfase locativa do grego.
