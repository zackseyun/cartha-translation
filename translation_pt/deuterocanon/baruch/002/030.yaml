base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/030.yaml
  text: For I knew that they would certainly not listen to me[a], because they are a stiff-necked people; but in the land of their exile they will return to their heart,
translation:
  language: pt
  text: Pois eu sabia que de modo algum me dariam ouvidos, porque são um povo de dura cerviz; mas, na terra do seu exílio, voltarão ao próprio coração[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “voltarão ao coração deles”. A expressão também pode significar “cairão em si” ou “se voltarão de coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνων
  choice: eu sabia
  rationale: O aoristo de γινώσκω expressa aqui o conhecimento prévio de Deus sobre a reação do povo; o imperfeito português soa natural nesse contexto sem alterar o valor temporal.
- source_word: οὐ μὴ ἀκούσωσίν μου
  choice: de modo algum me dariam ouvidos
  rationale: A construção οὐ μή com o subjuntivo é uma negação enfática. “De modo algum” preserva essa força, e “dar ouvidos” mantém tanto a imagem auditiva de ἀκούω quanto o sentido contextual de atender ou obedecer.
- source_word: λαὸς σκληροτράχηλος
  choice: povo de dura cerviz
  rationale: Conserva a metáfora bíblica do pescoço endurecido, em vez de reduzi-la ao conceito interpretativo de obstinação.
- source_word: ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν
  choice: voltarão ao próprio coração
  rationale: Mantém o verbo de voltar e a linguagem explícita do coração. A formulação deliberadamente incomum preserva a ambiguidade do idioma sem substituí-lo diretamente por “se arrependerão”.
- source_word: ἐν γῇ ἀποικισμοῦ αὐτῶν
  choice: na terra do seu exílio
  rationale: ἀποικισμός indica o afastamento e estabelecimento fora da terra natal; “exílio” é a equivalência portuguesa mais clara e natural neste contexto.
theological_decisions:
- issue: Sentido de “voltarão ao próprio coração”
  choice: Preservar no texto principal a imagem do retorno ao coração, com esclarecimento em nota.
  alternative: “cairão em si”, “levarão isso a sério” ou “se voltarão de coração”
  rationale: A expressão sugere uma mudança interior e pode implicar arrependimento, mas o grego não emprega aqui uma formulação explícita equivalente a “arrepender-se”. Manter a imagem evita resolver indevidamente a tensão semântica.
- issue: Valor adversativo de καὶ
  choice: mas
  alternative: e
  rationale: Embora καὶ normalmente signifique “e”, aqui a mudança entre a recusa prevista e a futura volta interior cria contraste; “mas” torna essa relação clara em português sem alterar o conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Dura cerviz” conserva uma metáfora bíblica tradicional; a nota esclarece a expressão semítica incomum sobre o coração. A vírgula final foi mantida porque a frase prossegue no versículo seguinte.
