base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/028.yaml
  text: just as you spoke by the hand of your servant Moses[a], on the day when you commanded him to write your law before the sons of Israel, saying[b],
translation:
  language: pt
  text: 'assim como falaste pela mão de teu servo Moisés[a], no dia em que lhe ordenaste que escrevesse tua lei diante dos filhos de Israel[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega «pela mão de» é um modo bíblico de dizer «por meio de».
    reason: cultural_note
  - marker: b
    text: Ou «israelitas». O grego diz literalmente «filhos de Israel».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὰ
  choice: conforme
  rationale: Introduz a correspondência com o que foi dito anteriormente e conserva, em português natural, a ideia de «assim como».
- source_word: ἐλάλησας
  choice: falaste
  rationale: O aoristo de λαλέω indica uma fala passada; «falaste» mantém o tom solene e a segunda pessoa do singular.
- source_word: ἐν χειρὶ
  choice: pela mão de
  rationale: Preserva o conhecido idioma bíblico de agência mediada; a nota esclarece seu sentido para leitores modernos.
- source_word: παιδός σου
  choice: teu servo
  rationale: Neste contexto, παῖς designa Moisés como agente comissionado por Deus; «servo» expressa essa função honorífica sem sugerir filiação nem enfatizar escravidão.
- source_word: ἐν ἡμέρᾳ
  choice: no dia
  rationale: Reproduz a expressão temporal grega com formulação corrente em português.
- source_word: ἐντειλαμένου σου αὐτῷ
  choice: em que lhe ordenaste
  rationale: O genitivo absoluto exprime a circunstância temporal; esta formulação é clara e preserva o sujeito divino e o objeto referente a Moisés.
- source_word: γράψαι
  choice: que escrevesse
  rationale: O infinitivo dependente do verbo de ordem é vertido pelo subjuntivo, construção idiomática em português.
- source_word: τὸν νόμον σου
  choice: tua lei
  rationale: No contexto mosaico e pactual, νόμος é adequadamente traduzido por «lei», termo reconhecível e fiel ao sentido.
- source_word: ἐναντίον
  choice: diante de
  rationale: Quando usado em relação a pessoas, significa «diante de» ou «na presença de», não «contra».
- source_word: υἱῶν Ἰσραήλ
  choice: filhos de Israel
  rationale: Mantém a forma masculina explícita do grego e o registro bíblico tradicional, enquanto a nota oferece a alternativa coletiva natural.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio introduz a fala citada que continua no versículo seguinte; «dizendo» preserva essa continuidade sintática.
theological_decisions:
- issue: Sentido de παῖς aplicado a Moisés
  choice: teu servo
  alternative: teu filho; teu escravo
  rationale: A referência é ao papel de Moisés como agente comissionado de Deus. «Servo» preserva o caráter honorífico e pactual sem importar uma relação filial nem acentuar indevidamente a condição de escravo.
- issue: Forma masculina υἱῶν Ἰσραήλ
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A tradução conserva a forma masculina e a textura bíblica do original, sem impedir que a nota esclareça a alternativa coletiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se o idioma bíblico «pela mão de», acompanhado de explicação, e mantém-se «dizendo» porque a frase prossegue no versículo seguinte.
