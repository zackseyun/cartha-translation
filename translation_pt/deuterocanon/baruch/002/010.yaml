  text: And we did not listen to his voice[b][a], to walk in the commandments of the Lord that he set before us.
translation:
  language: pt
  text: E não ouvimos a sua voz[a], para andar segundo os mandamentos do Senhor, que ele pôs diante de nós[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedecemos à sua voz”. O grego diz literalmente “não ouvimos a sua voz”, expressão bíblica em que ouvir também envolve atender e obedecer.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “que ele deu diante da nossa face”; isto é, que colocou diante de nós.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: ouvimos
  rationale: Mantém a metáfora auditiva explícita de ἀκούω; no contexto, ouvir implica dar atenção e obedecer, sem reduzir o idioma ao resultado interpretativo.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: a sua voz
  rationale: Reproduz a expressão grega e conserva o caráter pessoal da palavra divina.
- source_word: πορεύεσθαι
  choice: andar
  rationale: Preserva a metáfora bíblica de caminhar como modo de vida e conduta.
- source_word: τοῖς προστάγμασιν
  choice: segundo os mandamentos
  rationale: πρόσταγμα designa uma ordem ou determinação; 'mandamentos' é natural no contexto da aliança. 'Segundo' expressa em português corrente a conformidade da conduta a esses mandamentos.
- source_word: Κυρίου
  choice: do Senhor
  rationale: Tradução tradicional e contextualmente adequada de Κυρίου.
- source_word: οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: que ele pôs diante de nós
  rationale: Comunica naturalmente o sentido de mandamentos dados ou colocados 'diante da nossa face', preservando a imagem espacial.
theological_decisions:
- issue: Se ἠκούσαμεν indica percepção auditiva ou obediência
  choice: não ouvimos a sua voz
  alternative: não obedecemos à sua voz
  rationale: A formulação escolhida preserva o idioma bíblico em que ouvir inclui atender e obedecer, sem explicitar apenas uma de suas implicações.
- issue: Como representar πορεύεσθαι no contexto ético da aliança
  choice: andar segundo os mandamentos
  alternative: viver de acordo com os mandamentos
  rationale: '''Andar'' conserva a metáfora bíblica da conduta; ''segundo'' torna a relação com os mandamentos idiomática em português.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva as metáforas bíblicas de ouvir a voz e andar, enquanto evita uma construção pouco natural como 'andar nos mandamentos'.
