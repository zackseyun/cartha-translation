base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/006.yaml
  text: To the Lord our God belongs righteousness[a], but to us and to our fathers belongs shame of face[b], as it is this day.
translation:
  language: pt
  text: Ao Senhor, nosso Deus, pertence a justiça[a]; a nós, porém, e aos nossos pais, pertence a vergonha no rosto[b], como se vê hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. Aqui, “justiça” também comunica que Deus está com a razão.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega significa literalmente “vergonha dos rostos” e indica desonra ou humilhação pública.
    reason: cultural_note
lexical_decisions:
- source_word: Τῷ κυρίῳ θεῷ ἡμῶν
  choice: Ao Senhor, nosso Deus, pertence
  rationale: O dativo, com ideia implícita de posse ou atribuição, é expresso naturalmente por “pertence”, preservando a afirmação de que a justiça é própria de Deus.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: “Justiça” é o equivalente português mais abrangente neste contexto e pode comunicar tanto a retidão de Deus quanto o fato de ele estar com a razão, sem restringir o sentido à justiça punitiva.
- source_word: ἡμῖν δὲ καὶ τοῖς πατράσιν ἡμῶν
  choice: a nós, porém, e aos nossos pais, pertence
  rationale: Mantém o contraste explícito com Deus e inclui os antepassados na confissão coletiva, como faz o grego.
- source_word: αἰσχύνη τῶν προσώπων
  choice: vergonha no rosto
  rationale: Preserva de modo compreensível a imagem concreta do original, que indica desonra manifesta, humilhação ou constrangimento público.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: como se vê hoje
  rationale: Expressa em português corrente que a situação vergonhosa continua evidente no presente, preservando a força da fórmula grega sem reproduzir uma construção artificial.
theological_decisions:
- issue: Sentido de δικαιοσύνη quando atribuída a Deus
  choice: A justiça e retidão pertencem a Deus, em contraste com a vergonha confessada pelo povo e por seus antepassados.
  alternative: A justiça judicial de Deus é contrastada especificamente com a desgraça de Israel.
  rationale: 'A tradução “justiça” conserva a amplitude do termo grego: Deus é justo e está com a razão. Assim, não limita a frase apenas ao exercício de punição judicial.'
translation_notes:
  register: Português moderno, claro e digno, com estrutura contrastiva próxima do grego. A repetição de “pertence” explicita a elipse do segundo membro e favorece a compreensão. “Nossos pais” preserva a formulação bíblica, no sentido de antepassados.
