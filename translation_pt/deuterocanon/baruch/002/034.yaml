base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/034.yaml
  text: and I will bring them back to the land that I swore to their fathers—to Abraham and Isaac and Jacob—and they will rule over it; and I will multiply them[a], and they will certainly not be diminished.
translation:
  language: pt
  text: Eu os farei voltar à terra que prometi sob juramento a seus pais — Abraão, Isaque e Jacó —, e eles terão domínio sobre ela[a]; eu os multiplicarei, e de modo algum serão reduzidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles a possuirão”. O verbo grego pode indicar tanto exercer domínio quanto possuir como senhor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψω
  choice: farei voltar
  rationale: Expressa de modo natural a ação causativa de conduzi-los novamente à terra, preservando a ideia de retorno.
- source_word: γῆν
  choice: terra
  rationale: No contexto do juramento feito aos patriarcas, refere-se à terra vinculada à promessa, não ao mundo em geral.
- source_word: ὤμοσα
  choice: sob juramento, prometi
  rationale: Em português corrente, a formulação comunica claramente que se trata de uma promessa confirmada por juramento, sem reduzir a força pactual do verbo.
- source_word: πατράσιν
  choice: pais
  rationale: Mantém a referência masculina e patriarcal do grego, explicitada em seguida pelos nomes Abraão, Isaque e Jacó.
- source_word: κυριεύσουσιν
  choice: terão domínio sobre
  rationale: Reproduz diretamente a ideia de exercer senhorio ou domínio; a possibilidade contextual de posse é preservada em nota.
- source_word: πληθυνῶ
  choice: multiplicarei
  rationale: Mantém a linguagem de multiplicação associada ao crescimento dos descendentes e ao juramento patriarcal.
- source_word: οὐ μὴ σμικρυνθῶσιν
  choice: seu número jamais diminuirá
  rationale: Traduz em português natural a negação grega enfática e, em paralelo com 'multiplicarei', torna explícito o sentido numérico de não serem reduzidos.
theological_decisions:
- issue: Restauração ligada ao juramento feito aos patriarcas
  choice: Manter no texto o caráter juramentado da promessa e os nomes dos patriarcas
  alternative: Dizer apenas 'a terra prometida aos seus antepassados'
  rationale: A formulação conserva o vínculo explícito entre a restauração, o juramento divino e Abraão, Isaque e Jacó, sem acrescentar uma interpretação doutrinária.
- issue: Relação futura do povo com a terra
  choice: terão domínio sobre ela
  alternative: possuirão a terra
  rationale: O verbo grego expressa primariamente domínio ou senhorio, embora no contexto territorial possa também sugerir posse; a tradução principal mantém a força lexical e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção 'sob juramento, prometi' evita a expressão pouco natural 'a terra que jurei aos seus pais', ao mesmo tempo que preserva a força explícita do juramento. O travessão destaca naturalmente a identificação dos 'pais' como Abraão, Isaque e Jacó.
