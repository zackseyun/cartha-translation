  rationale: A revisão conserva todas as afirmações do texto grego, melhora a ligação entre a promessa juramentada e os patriarcas e restaura na última oração a voz passiva e a amplitude da formulação original. A nota continua a registrar a alternativa lexical para o verbo referente à relação com a terra.
