review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente o retorno à terra, o juramento ligado a Abraão, Isaque e Jacó, o domínio sobre a terra, a multiplicação e a negação enfática final. Contudo, «seu número jamais diminuirá» explicita e reformula em voz ativa aquilo que o grego exprime como predicação passiva sobre «eles»; uma formulação passiva conserva melhor a forma e o alcance do original.
  naturalness: «Prometi sob juramento» é claro e idiomático em português moderno. A ordem «a terra que prometi sob juramento a seus pais» evita a leve intercalação e ambiguidade de «que, sob juramento, prometi». A manutenção em uma única frase com ponto e vírgula acompanha bem a articulação do grego.
  terminology: «Terão domínio sobre ela» reflete adequadamente κυριεύσουσιν, e a nota registra sem impor a alternativa contextual «possuirão». «Pais», seguido dos três nomes, preserva a referência patriarcal explícita. «Reduzidos» retém a voz passiva de σμικρυνθῶσιν e a força de οὐ μή é representada por «de modo algum».
  issues:
  - severity: low
    issue: Reformulação ativa e quantitativa da oração final
    rationale: «Seu número jamais diminuirá» é uma explicitação plausível, mas o grego diz literalmente que eles não serão reduzidos, em construção passiva. «Não serão de modo algum reduzidos» é mais formalmente fiel e não restringe desnecessariamente a formulação.
  - severity: low
    issue: Posição de «sob juramento»
    rationale: A expressão do rascunho é compreensível, mas «que prometi sob juramento a seus pais» estabelece com mais fluidez que o juramento qualifica a promessa feita aos pais.
  revised_text: Eu os farei voltar à terra que prometi sob juramento a seus pais — Abraão, Isaque e Jacó —, e eles terão domínio sobre ela[a]; eu os multiplicarei, e de modo algum serão reduzidos.
