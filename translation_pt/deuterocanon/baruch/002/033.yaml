base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/033.yaml
  text: And they will turn away from their stiff neck and from their evil deeds[a], because they will remember the way of their fathers who sinned before the Lord.
translation:
  language: pt
  text: E eles se afastarão de suas costas endurecidas e de suas más ações[a], porque se lembrarão do caminho de seus pais, que pecaram diante do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de suas costas obstinadas”; mais interpretativamente, “de sua obstinação”. O grego diz literalmente “de suas costas duras”, e não emprega aqui a expressão mais comum “dura cerviz”.
    reason: A nota registra a imagem incomum de νώτου e oferece alternativas sem substituí-la silenciosamente por outro idioma bíblico.
lexical_decisions:
- source_word: ἀποστρέψουσιν
  choice: se afastarão
  rationale: O futuro ativo com ἀπό indica mudança de direção para longe de algo; a forma pronominal é natural em português e comunica o abandono da conduta anterior.
- source_word: ἀπὸ τοῦ νώτου αὐτῶν τοῦ σκληροῦ
  choice: de suas costas endurecidas
  rationale: νώτου significa literalmente “costas”, não “pescoço”. A tradução conserva a imagem corporal incomum do grego, enquanto “endurecidas” expressa σκληροῦ com naturalidade razoável.
- source_word: πονηρῶν πραγμάτων αὐτῶν
  choice: de suas más ações
  rationale: Neste contexto, πράγματα designa atos ou práticas; “más ações” é claro, corrente e preserva o peso moral de πονηρῶν.
- source_word: μνησθήσονται
  choice: se lembrarão
  rationale: O futuro de μιμνῄσκομαι é traduzido diretamente pela construção portuguesa usual “se lembrarão”.
- source_word: τῆς ὁδοῦ
  choice: do caminho
  rationale: “Caminho” conserva a metáfora bíblica de ὁδός, que aqui pode representar a maneira de viver.
- source_word: πατέρων αὐτῶν
  choice: de seus pais
  rationale: O grego emprega o masculino plural πατέρων; “pais” mantém essa forma e pode referir-se aos antepassados no uso bíblico.
- source_word: τῶν ἁμαρτόντων
  choice: que pecaram
  rationale: A oração relativa traduz naturalmente o particípio aoristo e mantém explícita a ação passada.
- source_word: ἔναντι Κυρίου
  choice: diante do Senhor
  rationale: “Diante de” preserva o sentido espacial e moral de ἔναντι sem ampliá-lo interpretativamente para “contra”; “Senhor” corresponde a Κυρίου.
theological_decisions:
- issue: Força metafórica de “costas endurecidas”
  choice: Conservar a imagem corporal das costas.
  alternative: “de sua obstinação” ou “de sua dura cerviz”
  rationale: O testemunho grego diz νώτου, “costas”, e não emprega o termo habitual para “pescoço/cerviz”. Preservar a imagem mantém transparência ao texto-fonte, ainda que a expressão seja incomum.
- issue: Tradução de πατέρων αὐτῶν
  choice: “de seus pais”
  alternative: “de seus antepassados”
  rationale: A expressão grega é masculina e “pais” conserva tanto a forma quanto o idioma bíblico, sem excluir seu sentido ancestral.
- issue: Tradução de Κυρίου
  choice: “do Senhor”
  alternative: “do SENHOR”
  rationale: A fonte grega traz Κυρίου. “Senhor” é a correspondência direta e não pressupõe no texto traduzido uma forma hebraica não presente na linha-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se deliberadamente a estranheza da imagem grega “costas endurecidas”; a nota esclarece seu sentido provável. A pontuação separa a oração relativa referente aos pais.
