  text: because you have brought your wrath and your anger upon us[a], just as you spoke by the hand of your servants the prophets
translation:
  language: pt
  text: porque lançaste sobre nós o teu furor e a tua ira, assim como falaste pela mão[a] de teus servos, os profetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “por meio de teus servos, os profetas”. O grego diz literalmente “pela mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνῆκας
  choice: lançaste sobre
  rationale: O verbo, no contexto, descreve o ato de fazer recair o juízo sobre alguém. “Lançaste sobre” preserva a força causativa e a imagem do grego sem especificar além do texto.
- source_word: θυμόν
  choice: furor
  rationale: Expressa ira intensa e permite manter a dupla retórica formada com ὀργήν.
- source_word: ὀργήν
  choice: ira
  rationale: “Ira” é claro, digno e distinto de “furor”, preservando os dois termos próximos empregados no grego.
- source_word: καθάπερ
  choice: assim como
  rationale: Marca claramente a correspondência entre o juízo experimentado e a advertência profética anterior.
- source_word: ἐλάλησας
  choice: falaste
  rationale: Tradução direta que mantém a referência ao ato divino de falar por mediação profética.
- source_word: ἐν χειρί
  choice: pela mão
  rationale: Conserva o conhecido idioma bíblico de agência, enquanto a nota oferece a formulação corrente em português.
- source_word: παίδων
  choice: servos
  rationale: Neste contexto, designa pessoas comissionadas por Deus; “servos” comunica adequadamente essa função.
- source_word: προφητῶν
  choice: os profetas
  rationale: A expressão está em aposição e identifica os servos como profetas.
theological_decisions:
- issue: A dupla θυμός e ὀργή na descrição do juízo divino
  choice: “furor e ira” como dois termos distintos
  alternative: “ira e indignação” ou redução a um único termo
  rationale: A tradução mantém a intensificação retórica e a plenitude da linguagem de juízo, sem fundir os quase sinônimos.
- issue: O idioma de mediação profética ἐν χειρὶ
  choice: “pela mão de teus servos”
  alternative: “por meio de teus servos”
  rationale: A formulação principal preserva a textura do original e continua compreensível; a nota registra a equivalência idiomática.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção conserva o paralelismo “furor e ira” e o idioma bíblico “pela mão”, esclarecido em nota.
