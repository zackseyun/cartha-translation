base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/011.yaml
  text: And now[a], O Lord, God of Israel, who brought your people out of the land of Egypt with a mighty hand, with signs and wonders and with great power and with an uplifted arm, and made for yourself a name, as at this day,
translation:
  language: pt
  text: E agora, Senhor, Deus de Israel, tu que tiraste o teu povo da terra do Egito com mão poderosa, com sinais e prodígios, com grande poder e com braço erguido[a], e fizeste para ti um nome, como se vê neste dia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com braço estendido”. O grego diz literalmente “com braço erguido” ou “alto”, expressão diferente da fórmula mais comum em outras passagens sobre o êxodo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε ὁ θεὸς Ἰσραήλ
  choice: Senhor, Deus de Israel
  rationale: Mantém o título divino e o vocativo do grego em uma formulação natural e digna em português.
- source_word: ἐξήγαγες τὸν λαόν σου ἐκ γῆς Αἰγύπτου
  choice: tiraste o teu povo da terra do Egito
  rationale: Reproduz de modo claro a linguagem tradicional do êxodo e o sentido de fazer sair.
- source_word: ἐν χειρὶ κραταιῷ
  choice: com mão poderosa
  rationale: Preserva a metáfora da mão e expressa diretamente a força divina.
- source_word: σημείοις καὶ ἐν τέρασιν
  choice: sinais e prodígios
  rationale: É a combinação bíblica corrente em português e conserva os dois termos distintos.
- source_word: ἐν δυνάμει μεγάλῃ
  choice: com grande poder
  rationale: Tradução transparente que mantém a intensidade do adjetivo.
- source_word: ἐν βραχίονι ὑψηλῷ
  choice: com braço erguido
  rationale: ὑψηλός significa literalmente alto ou elevado; 'erguido' preserva essa particularidade sem substituí-la silenciosamente pela fórmula mais conhecida 'estendido'.
- source_word: ἐποίησας σεαυτῷ ὄνομα
  choice: fizeste para ti um nome
  rationale: Conserva o reflexivo explícito e a imagem bíblica de adquirir renome.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: como se vê neste dia
  rationale: Expressa em português natural a fórmula que aponta para a realidade presente do renome, sem transformar 'neste dia' em 'até hoje'.
theological_decisions:
- issue: Linguagem teofânica do êxodo e acumulação de expressões de poder
  choice: Preservar a sequência 'com mão poderosa, com sinais e prodígios, com grande poder e com braço erguido'
  alternative: Resumir a enumeração em uma expressão mais fluida sobre o grande poder de Deus
  rationale: A enumeração ecoa deliberadamente a tradição do êxodo e ressalta as manifestações do poder divino; condensá-la enfraqueceria seu peso retórico e teológico.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. Conserva o tom solene de oração, a repetição retórica das expressões instrumentais e a vírgula final, pois a frase continua no versículo seguinte.
