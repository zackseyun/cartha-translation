  source_fidelity: A tradução conserva adequadamente a mudança do grego entre o sujeito de terceira pessoa plural («eles ficaram») e a confissão em primeira pessoa plural («pecamos»). «Ficaram por baixo, e não por cima» reproduz de modo idiomático o contraste ὑποκάτω / ἐπάνω e mantém sua ressonância de rebaixamento. «Pecamos contra o Senhor, nosso Deus» e «ao não ouvirmos a sua voz» correspondem fielmente ao sentido e à construção do original, sem substituir prematuramente «ouvir» por «obedecer».
  naturalness: O texto é claro, moderno e digno em português de ampla legibilidade. «Por baixo ... por cima» é uma colocação natural e preserva a imagem concreta; a construção final é fluente.
