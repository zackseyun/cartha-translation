base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/005.yaml
  text: and they became beneath and not above[b][a], because we sinned against the Lord our God by not listening to his voice.
translation:
  language: pt
  text: E eles ficaram por baixo, e não por cima,[a] porque pecamos contra o Senhor, nosso Deus, ao não ouvirmos a sua voz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abaixo, e não acima”. O contraste espacial também comunica condição inferior ou humilhação.
    reason: lexical_alternative
  - marker: b
    text: Na linguagem bíblica, “ouvir a voz” de Deus inclui o sentido de dar-lhe ouvidos e obedecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθησαν
  choice: ficaram
  rationale: O aoristo de γίνομαι indica a passagem a um estado resultante. “Ficaram” é natural em português e conserva a ideia de que chegaram a uma condição inferior, sem introduzir explicitamente um agente.
- source_word: ὑποκάτω
  choice: por baixo
  rationale: Mantém o contraste espacial direto com ἐπάνω e, no contexto, também sugere inferioridade de condição ou humilhação.
- source_word: ἐπάνω
  choice: por cima
  rationale: Forma em português um contraste claro e idiomático com “por baixo”, preservando a metáfora do grego.
- source_word: ἡμάρτομεν
  choice: pecamos
  rationale: Equivalente direto e corrente de ἁμαρτάνω, preservando o peso moral e teológico do termo.
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: contra o Senhor, nosso Deus
  rationale: O dativo com ἁμαρτάνω é expresso naturalmente por “contra”. A aposição com vírgula produz uma formulação clara e digna em português.
- source_word: πρὸς τὸ μὴ ἀκούειν
  choice: ao não ouvirmos
  rationale: Expressa a maneira ou o aspecto em que ocorreu o pecado e mantém o verbo “ouvir”, em vez de substituir o idioma bíblico por sua interpretação “obedecer”.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: a sua voz
  rationale: Preserva o sentido literal de φωνή e o idioma bíblico de ouvir a voz de Deus, que inclui dar-lhe ouvidos e obedecer.
theological_decisions:
- issue: Metáfora de posição inferior na linguagem de maldição da aliança
  choice: E eles ficaram por baixo, e não por cima
  alternative: E eles ficaram em posição inferior, e não superior
  rationale: A tradução conserva tanto o contraste espacial explícito quanto sua força metafórica de rebaixamento ou humilhação, sem reduzir o texto a uma paráfrase interpretativa. Também mantém a terceira pessoa plural do grego, apesar da mudança subsequente para “pecamos”.
- issue: Sentido de ouvir a voz de Deus
  choice: ao não ouvirmos a sua voz
  alternative: por não lhe obedecermos
  rationale: Embora o idioma implique obediência, o grego fala expressamente de ouvir a voz. A formulação escolhida mantém a linguagem da aliança e deixa sua dimensão de obediência clara em nota, sem substituí-la no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Por baixo... por cima” preserva a imagem concreta e soa mais natural que “abaixo... acima” após “ficaram”. A alternância entre “eles” e “pecamos” foi mantida por corresponder ao grego, sem harmonização silenciosa.
