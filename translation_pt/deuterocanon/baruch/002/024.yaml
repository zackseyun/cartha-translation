base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/024.yaml
  text: And we did not listen to your voice to serve the king of Babylon[a], and you have fulfilled your words that you spoke by the hands of your servants the prophets[c][b], that the bones of our kings and the bones of our fathers would be brought out from their place.
translation:
  language: pt
  text: 'E não demos ouvidos à tua voz, para servirmos ao rei da Babilônia[a], e cumpriste as palavras que havias falado por meio dos teus servos, os profetas[b]: que os ossos dos nossos reis e os ossos dos nossos antepassados seriam retirados do lugar deles[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedecemos à tua voz”. O grego fala literalmente de não ouvir ou não dar ouvidos à voz de Deus; no contexto, isso implica desobediência.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pelas mãos dos teus servos, os profetas”; a expressão significa “por meio dos teus servos, os profetas”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, do lugar onde haviam sido sepultados. O grego diz apenas “do lugar deles”.
    reason: cultural_note
lexical_decisions:
- source_word: ἠκούσαμεν τῆς φωνῆς σου
  choice: demos ouvidos à tua voz
  rationale: Preserva a imagem auditiva do grego e, em português corrente, comunica naturalmente a ideia contextual de atender e obedecer.
- source_word: ἐργάσασθαι τῷ βασιλεῖ Βαβυλῶνος
  choice: servirmos ao rei da Babilônia
  rationale: Com o dativo de pessoa e no contexto de submissão política, «servir» expressa melhor o serviço exigido do que o sentido genérico de «trabalhar».
- source_word: ἔστησας τοὺς λόγους σου
  choice: cumpriste as palavras
  rationale: No contexto do juízo anunciado e realizado, traduz o sentido de estabelecer ou confirmar as palavras fazendo-as acontecer.
- source_word: ἐν χερσὶν τῶν παίδων σου τῶν προφητῶν
  choice: pela mão dos teus servos, os profetas
  rationale: 'Mantém o idioma semítico refletido no grego, ao mesmo tempo que a nota esclarece seu sentido instrumental: «por meio de».'
- source_word: παίδων σου
  choice: teus servos
  rationale: No contexto profético, παῖς designa pessoas comissionadas a serviço de Deus; «servos» é mais adequado do que «filhos» ou «escravos».
- source_word: τοῦ ἐξενεχθῆναι
  choice: seriam retirados
  rationale: Expressa em português natural o conteúdo ou resultado futuro das palavras proféticas, conservando a voz passiva.
- source_word: τὰ ὀστᾶ
  choice: os ossos
  rationale: Mantém a referência concreta do original, sem generalizá-la como «restos mortais».
- source_word: ἐκ τοῦ τόπου αὐτῶν
  choice: do lugar onde estavam
  rationale: Traduz τόπος sem explicitar no texto principal «sepultura» ou «túmulo», informação apenas inferida pelo contexto.
theological_decisions:
- issue: Explicitar obediência ou preservar a imagem de ouvir a voz de Deus
  choice: não demos ouvidos à tua voz
  alternative: não obedecemos à tua voz
  rationale: A passagem trata de desobediência, mas o grego formula a ideia em termos de ouvir. A expressão escolhida preserva essa textura bíblica e implica recusa em atender.
- issue: Descrever a ação de Deus em relação às palavras de juízo
  choice: cumpriste as palavras
  alternative: confirmaste as palavras
  rationale: «Cumpriste» comunica que as advertências proféticas se realizaram, sem acrescentar uma afirmação doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega «antepassados» em vez de «pais» para evitar ambiguidade familiar imediata. A expressão «pela mão» conserva o colorido idiomático do original, esclarecido em nota.
