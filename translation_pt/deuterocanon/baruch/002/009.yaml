base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/009.yaml
  text: And the Lord kept watch over the calamities and brought them upon us[b][a], because the Lord is righteous in all his works that he commanded us.
translation:
  language: pt
  text: E o Senhor manteve-se vigilante sobre as calamidades[a] e as trouxe sobre nós, pois o Senhor é justo[b] em todas as suas obras, que ele nos ordenou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os males” ou “os desastres”. Aqui, o grego provavelmente se refere às calamidades do juízo, não ao mal moral em abstrato.
    reason: lexical_alternative
  - marker: b
    text: Ou “reto”.
    reason: lexical_alternative
  - marker: c
    text: A construção grega é concisa e sintaticamente difícil. Pode referir-se às obras do Senhor em relação ao que ele ordenou ao povo; a tradução preserva essa formulação sem especificar além do texto.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐγρηγόρησεν
  choice: esteve vigilante
  rationale: Preserva a imagem de estar desperto e atento, indicando vigilância ativa, sem reduzir o verbo a mera observação.
- source_word: ἐπὶ τοῖς κακοῖς
  choice: quanto às calamidades
  rationale: No contexto de juízo, κακά designa desgraças ou calamidades trazidas sobre o povo, e não o mal moral em abstrato. A construção evita sugerir que Deus protegeu as calamidades.
- source_word: ἐπήγαγε
  choice: as trouxe sobre nós
  rationale: Expressa diretamente a ação de fazer vir algo contra ou sobre alguém e retoma naturalmente “calamidades”.
- source_word: δίκαιος
  choice: justo
  rationale: Em português, “justo” é a forma natural e biblicamente reconhecível para afirmar a retidão do Senhor, sobretudo no contexto de seu juízo.
- source_word: ἐπὶ πάντα τὰ ἔργα αὐτοῦ
  choice: em todas as suas obras
  rationale: Entende ἐπί como indicação de esfera ou respeito e mantém o alcance abrangente e o possessivo explícito do grego.
- source_word: ἃ ἐνετείλατο ἡμῖν
  choice: que nos ordenou
  rationale: Mantém a formulação comprimida e a referência gramatical às “obras”, sem acrescentar uma explicação interpretativa ausente do texto.
theological_decisions:
- issue: Se τὰ κακά deve ser traduzido como males morais ou como calamidades punitivas
  choice: calamidades
  alternative: males; desastres
  rationale: A oração seguinte afirma que o Senhor os trouxe sobre o povo; no contexto, trata-se de desgraças decorrentes do juízo, não de maldade moral. A tradução conserva a afirmação direta da ação divina sem atribuir mal moral a Deus.
- issue: Como representar δίκαιος aplicado ao Senhor
  choice: justo
  alternative: reto
  rationale: “Justo” comunica de modo natural tanto a retidão moral quanto a justiça do Senhor no juízo, sem restringir o termo a uma única formulação doutrinária.
- issue: Como tratar a construção comprimida ἃ ἐνετείλατο ἡμῖν
  choice: preservar a ligação entre “obras” e “que nos ordenou”
  alternative: explicitar como mandamentos dados a nós ou como atos realizados por Deus
  rationale: O grego é sintaticamente comprimido e potencialmente difícil. A tradução preserva essa tensão em vez de decidir silenciosamente se as obras são ações divinas, obras exigidas do povo ou uma referência elíptica ao que Deus ordenou.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Esteve vigilante quanto a” conserva a metáfora grega sem a conotação protetora que “velou sobre” poderia ter. A cláusula final permanece deliberadamente compacta para não eliminar a ambiguidade do original.
