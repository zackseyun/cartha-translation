base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/022.yaml
  text: And if you do not listen to the voice of the Lord[a], to serve the king of Babylon[b],
translation:
  language: pt
  text: E, se vocês não ouvirem a voz do Senhor[a], para servir ao rei da Babilônia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «derem ouvidos à voz do Senhor»; a expressão grega pode indicar obediência, e não apenas o ato de ouvir.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «trabalhar para o rei da Babilônia»; aqui, o sentido é prestar-lhe serviço.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ ἀκούσητε
  choice: se vocês não ouvirem
  rationale: O verbo ἀκούω com o genitivo pode expressar ouvir ou dar ouvidos, com obediência implícita. «Ouvirem» conserva a imagem auditiva do grego sem explicitar além do texto.
- source_word: τῆς φωνῆς
  choice: a voz
  rationale: φωνή significa literalmente «voz»; a escolha preserva a expressão bíblica, em vez de reduzi-la a «ordem».
- source_word: Κυρίου
  choice: do Senhor
  rationale: Forma portuguesa natural para a expressão genitiva definida «a voz do Senhor».
- source_word: ἐργάσασθαι
  choice: servir
  rationale: Embora o sentido básico seja «trabalhar», com o rei como objeto indireto o verbo indica trabalhar para ele, isto é, prestar-lhe serviço ou sujeição.
- source_word: τῷ βασιλεῖ Βαβυλῶνος
  choice: ao rei da Babilônia
  rationale: Tradução clara e natural da construção grega, preservando a referência geopolítica.
theological_decisions:
- issue: Tornar explícita a obediência implícita em ἀκούσητε
  choice: Manter «ouvirem a voz do Senhor» no texto principal
  alternative: «derem ouvidos à voz do Senhor» ou «obedecerem ao Senhor»
  rationale: A expressão sugere obediência, mas sua formulação é explicitamente auditiva. A tradução conserva essa tensão sem substituí-la por uma interpretação mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. O plural «vocês» torna explícita a segunda pessoa do plural. A vírgula final foi mantida porque o versículo é sintaticamente incompleto e continua no contexto seguinte.
