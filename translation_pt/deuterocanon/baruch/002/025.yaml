base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/025.yaml
  text: And behold[a], they have been exposed to the heat of the day and to the frost of the night; and they died in grievous sufferings, in famine and by the sword and in exile.
translation:
  language: pt
  text: 'E vejam: eles estão expostos ao calor do dia e à geada da noite; morreram em sofrimentos terríveis, de fome, pela espada e no desterro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na deportação” ou “no banimento”; o termo grego refere-se literalmente a um envio para longe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: vejam
  rationale: Preserva a função de chamar diretamente a atenção, em português atual e sem tom arcaizante.
- source_word: ἐξεριμμένα
  choice: estão lançados
  rationale: Mantém a força passiva de algo lançado para fora e, no contexto, deixado exposto aos elementos, sem explicitar além do grego que se trata de cadáveres.
- source_word: τῷ καύματι τῆς ἡμέρας
  choice: ao calor do dia
  rationale: Reprodução direta e natural da exposição ao calor diurno.
- source_word: τῷ παγετῷ τῆς νυκτός
  choice: à geada da noite
  rationale: Mantém a imagem concreta de παγετός e o paralelismo com o calor do dia.
- source_word: ἐν πόνοις πονηροῖς
  choice: em sofrimentos terríveis
  rationale: Expressa a intensidade negativa da locução em linguagem corrente e digna.
- source_word: ἐν λιμῷ
  choice: pela fome
  rationale: Em português, a preposição causal é natural na enumeração das calamidades que ocasionaram a morte.
- source_word: ἐν ῥομφαίᾳ
  choice: pela espada
  rationale: Preserva a imagem concreta e a expressão bíblica usual para morte violenta.
- source_word: ἐν ἀποστολῇ
  choice: pelo desterro
  rationale: Comunica a remoção forçada da terra sem reduzir o termo exclusivamente a uma modalidade administrativa específica; a amplitude lexical é indicada em nota.
theological_decisions:
- issue: Sentido de ἀποστολή no contexto de juízo
  choice: pelo desterro
  alternative: pela deportação; pelo banimento; por terem sido mandados embora
  rationale: “Desterro” preserva a realidade de remoção forçada associada ao juízo e ao afastamento da terra, enquanto a nota conserva o sentido mais literal e a variação possível do substantivo.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. “Vejam” evita o arcaísmo de “eis” sem perder a interpelação; “estão lançados” conserva a imagem passiva do grego, e a nota registra a ambiguidade de ἀποστολή.
