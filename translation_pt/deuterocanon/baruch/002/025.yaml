  source_fidelity: A tradução conserva a sequência e as principais imagens do grego. Contudo, «estão lançados ao calor» é pouco idiomático em português e não comunica com clareza o aspecto contextual de pessoas/corpos deixados expostos aos elementos em ἐξεριμμένα. «Estão expostos» preserva a voz passiva e evita especificar que são cadáveres.
  naturalness: «Vejam» é uma interpelação atual adequada para ἰδού. A formulação revista torna natural a relação com «ao calor do dia e à geada da noite» e harmoniza as expressões que indicam as circunstâncias da morte.
  terminology: «Geada», «sofrimentos terríveis», «espada» e «desterro» são escolhas adequadas. Para ἀποστολή, «no desterro» mantém o sentido de afastamento/exílio sem impor uma modalidade única; a nota conserva «deportação» e «banimento» como alternativas.
