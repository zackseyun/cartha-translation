review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a causalidade, a condição presente indicada por ὡς ἡ ἡμέρα αὕτη e as designações coletivas «casa de Israel» e «casa de Judá». Contudo, «sobre a qual o teu nome foi invocado» altera levemente a direção da fórmula: o grego diz literalmente que o nome foi chamado sobre a casa, fórmula semítica de pertença/designação, não que o nome foi invocado sobre ela.'
  naturalness: «Fizeste da casa ... o que ela é hoje» é compreensível, mas «Fizeste com que a casa ... se tornasse o que é hoje» é mais fluente no português moderno e explicita de modo natural o estado resultante. «A casa que leva o teu nome» comunica idiomaticamente a fórmula semítica sem obscurecer o sentido.
  terminology: «Casa», «Israel», «Judá» e «maldade» são apropriados. A fórmula referente ao nome divino deve ser vertida idiomaticamente no texto e preservada literalmente em nota, em vez de usar «foi invocado», que sugere um ato de oração ou culto não expresso pelo original.
  issues:
