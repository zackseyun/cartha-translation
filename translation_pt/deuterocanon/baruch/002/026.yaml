revisions:
- from: E fizeste da casa sobre a qual o teu nome foi invocado o que ela é hoje[a], por causa da maldade da casa de Israel e da casa de Judá.
  to: E fizeste com que a casa que leva o teu nome se tornasse o que é hoje[a], por causa da maldade da casa de Israel e da casa de Judá.
  rationale: A revisão substitui uma formulação que pode sugerir a invocação cultual do nome por uma expressão portuguesa natural que transmite o sentido da fórmula de pertença. A nota preserva a construção literal do grego e explica seu valor semítico. A construção verbal foi ajustada para um português corrente, sem especificar a natureza da mudança além do estado resultante expresso no original.
