base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/026.yaml
  text: And you made the house over which your name was called as it is this day[a], because of the wickedness of the house of Israel and the house of Judah.
translation:
  language: pt
  text: E fizeste com que a casa que leva o teu nome se tornasse o que é hoje[a], por causa da maldade da casa de Israel e da casa de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a casa sobre a qual foi chamado o teu nome”. O grego reproduz uma fórmula semítica que indica pertença ou consagração; isto é, a casa que leva o teu nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκας
  choice: fizeste ... o que ela é
  rationale: O aoristo de τίθημι, seguido da expressão de estado resultante, indica que Deus fez a casa chegar à condição em que se encontra; esta formulação é natural em português sem especificar além do grego a ação ocorrida.
- source_word: τὸν οἶκον
  choice: a casa
  rationale: Mantém o termo literal e o conhecido modo bíblico de designar o templo como casa de Deus.
- source_word: οὗ ἐπεκλήθη τὸ ὄνομά σου ἐπ᾽ αὐτῷ
  choice: sobre a qual o teu nome foi invocado
  rationale: Preserva a fórmula semítica refletida no grego, associada à consagração e ao pertencimento, com uma construção portuguesa compreensível.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: o que ela é hoje
  rationale: Exprime de maneira corrente o estado presente e manifesto da casa, que é o sentido do idioma bíblico.
- source_word: διὰ πονηρίαν
  choice: por causa da maldade
  rationale: διὰ tem valor causal, e πονηρία designa aqui a perversidade moral no contexto penitencial.
- source_word: οἴκου Ἰσραὴλ καὶ οἴκου Ἰούδα
  choice: da casa de Israel e da casa de Judá
  rationale: Conserva a linguagem corporativa e pactual do texto, sem reduzi-la apenas aos nomes dos povos.
theological_decisions:
- issue: Referência da casa e fórmula do nome divino
  choice: A casa é apresentada como aquela sobre a qual o nome de Deus foi invocado, preservando a fórmula de consagração e pertencimento.
  alternative: 'Traduzir de modo mais idiomático: “a casa que leva o teu nome”.'
  rationale: A formulação mais literal mantém o peso teológico da relação entre o templo e o nome divino, sem definir de modo excessivo a natureza dessa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém “casa” e a fórmula do nome divino por sua importância bíblica, enquanto verte a expressão temporal em português natural.
