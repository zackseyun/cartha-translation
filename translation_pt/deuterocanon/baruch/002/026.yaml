    issue: A fórmula do nome foi traduzida como «sobre a qual o teu nome foi invocado».
    rationale: ἐπεκλήθη τὸ ὄνομά σου ἐπ᾽ αὐτῷ é, em sentido literal, «teu nome foi chamado sobre ela», um semitismo que assinala pertença ou consagração. «Foi invocado» desloca o foco para a invocação do nome e não conserva com precisão a imagem gramatical do texto.
  - severity: low
    issue: A nota chama de literal uma formulação que ainda usa «foi invocado».
    rationale: A nota deve fornecer a forma literal «foi chamado sobre ela» e então explicar o valor idiomático da fórmula.
