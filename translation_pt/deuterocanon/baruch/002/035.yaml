base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/035.yaml
  text: And I will establish for them an everlasting covenant[a], that I may be their God and they may be my people; and I will no longer remove my people Israel from the land that I gave to them.
translation:
  language: pt
  text: E estabelecerei para eles uma aliança eterna[a], para que eu seja o Deus deles e eles sejam o meu povo; e nunca mais retirarei o meu povo Israel da terra que lhes dei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isto é, que eu serei o Deus deles e eles serão o meu povo”. O grego expressa o propósito ou o conteúdo da aliança por meio de uma construção com infinitivo.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: στήσω
  choice: estabelecerei
  rationale: O futuro de ἵστημι, aplicado a uma aliança, indica instituí-la ou torná-la vigente. “Estabelecerei” preserva a solenidade da formulação e é natural neste contexto.
- source_word: διαθήκην αἰώνιον
  choice: uma aliança eterna
  rationale: “Aliança eterna” é a expressão bíblica corrente em português e comunica a duração permanente indicada por αἰώνιον.
- source_word: τοῦ εἶναί με αὐτοῖς εἰς θεόν
  choice: para que eu seja o Deus deles
  rationale: A construção infinitiva pode indicar propósito ou conteúdo da aliança. A formulação escolhida conserva essa nuance e reproduz com clareza a conhecida fórmula de aliança.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: eles sejam o meu povo
  rationale: A tradução mantém a reciprocidade da fórmula de aliança e concorda naturalmente com o valor final de “para que” na oração anterior.
- source_word: οὐ κινήσω ἔτι
  choice: nunca mais retirarei
  rationale: Com ἀπό e a referência a um povo e sua terra, κινέω denota deslocar ou remover. “Nunca mais retirarei” comunica de modo natural a cessação futura expressa por οὐ ... ἔτι, sem acrescentar a imagem mais específica de arrancar pela raiz.
- source_word: τὸν λαόν μου Ἰσραήλ
  choice: o meu povo Israel
  rationale: Preserva a aposição e a ênfase possessiva da expressão grega em português claro.
- source_word: ἀπὸ τῆς γῆς
  choice: da terra
  rationale: Neste contexto de promessa e restauração, γῆ designa a terra concedida a Israel, não o planeta ou a terra em sentido genérico.
- source_word: ἧς ἔδωκα αὐτοῖς
  choice: que lhes dei
  rationale: O aoristo remete à concessão anterior da terra. “Que lhes dei” mantém a relação explícita e soa natural em português.
theological_decisions:
- issue: Formulação do conteúdo ou propósito da aliança
  choice: para que eu seja o Deus deles e eles sejam o meu povo
  alternative: isto é, que eu serei o Deus deles e eles serão o meu povo
  rationale: O grego emprega uma construção infinitiva articular que admite nuance de propósito e de conteúdo. A tradução principal preserva o valor final sem enfraquecer a promessa; a nota registra a leitura de conteúdo.
- issue: Sentido da promessa de οὐ κινήσω ἔτι quanto à permanência de Israel na terra
  choice: nunca mais retirarei o meu povo Israel da terra
  alternative: não tornarei a remover o meu povo Israel da terra
  rationale: A frase promete o fim do deslocamento da terra concedida. A tradução comunica a força idiomática da negação grega sem importar um sistema escatológico específico nem acrescentar a metáfora de “desarraigar”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Conserva-se a fórmula bíblica de aliança e a ambiguidade entre propósito e conteúdo por meio de nota.
