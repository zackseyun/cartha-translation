    text: Ou «misericórdia».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησας εἰς ἡμᾶς
  choice: agiste conosco
  rationale: A construção idiomática ποιεῖν εἰς com objeto pessoal indica agir para com alguém. «Agiste conosco» é natural em português, conserva a ação dirigida ao povo e evita o literalismo pouco claro «fizeste a nós».
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: Senhor, nosso Deus
  rationale: Κύριε é vocativo e recebe a tradução usual «Senhor»; ὁ θεὸς ἡμῶν identifica aquele a quem a oração se dirige como «nosso Deus».
- source_word: ἐπιεικίαν
  choice: clemência
  rationale: No contexto da maneira misericordiosa como Deus trata o povo, ἐπιείκεια expressa leniência, moderação ou indulgência. «Clemência» preserva essa nuance sem confundi-la com o termo seguinte para compaixão.
- source_word: οἰκτειρμόν
  choice: compaixão
  rationale: οἰκτειρμός designa compaixão ou misericórdia. «Compaixão» mantém a dimensão afetiva do termo e o distingue de ἐπιείκεια.
- source_word: τὸν μέγαν
  choice: grande
  rationale: O adjetivo modifica diretamente «compaixão» e é vertido de modo simples, sem intensificação adicional.
- source_word: κατὰ πᾶσαν ... καὶ κατὰ πάντα
  choice: segundo toda ... e segundo toda
  rationale: A repetição de «segundo» conserva o paralelismo de κατὰ ... κατὰ e o tom solene da oração.
theological_decisions:
- issue: Distinção entre dois termos próximos relativos à misericórdia divina
  choice: Traduzir ἐπιείκεια por «clemência» e οἰκτειρμός por «compaixão»
  alternative: Traduzir ambos por «misericórdia», ou usar «indulgência» e «misericórdia»
  rationale: O grego emprega dois substantivos distintos. Mantê-los distintos preserva a plenitude retórica sem criar uma diferença teológica técnica que o texto não explicita.
- issue: Forma de tratamento de Deus por κύριος
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte grega traz κύριος, não o nome divino hebraico; por isso, «Senhor» é a correspondência direta e não pressupõe uma retroversão.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por «tu» adequado ao registro de oração. A repetição «segundo toda ... e segundo toda» mantém deliberadamente o paralelismo do grego. A vírgula final foi preservada porque o versículo continua sintaticamente no contexto seguinte.
