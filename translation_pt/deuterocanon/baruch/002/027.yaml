base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/027.yaml
  text: And you have dealt with us[a], Lord our God, according to all your forbearance and according to all your great compassion[b],
translation:
  language: pt
  text: E trataste-nos, Senhor, nosso Deus, segundo toda a tua clemência[a] e segundo toda a tua grande compaixão[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «indulgência» ou «brandura». O termo grego pode indicar moderação, leniência ou disposição clemente.
