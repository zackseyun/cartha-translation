lexical_decisions:
- source_word: εἰσάκουσον
  choice: Ouve
  rationale: Imperativo natural e digno que preserva o pedido enfático dirigido ao Senhor.
- source_word: δέησις
  choice: súplica
  rationale: Expressa um pedido insistente e mantém a distinção em relação a προσευχή, traduzido como “oração”.
- source_word: ἐξελοῦ
  choice: livra-nos
  rationale: O verbo pede resgate ou libertação; “livra-nos” é claro e adequado ao registro de oração.
- source_word: ἕνεκεν σοῦ
  choice: por causa de ti mesmo
  rationale: Preserva a referência enfática ao próprio Senhor como motivo da libertação, sem acrescentar uma explicação teológica.
- source_word: χάριν κατὰ πρόσωπον
  choice: favor diante de
  rationale: Reproduz de modo idiomático a ideia de receber boa disposição ou benevolência na presença de alguém.
- source_word: τῶν ἀποικισάντων ἡμᾶς
  choice: daqueles que nos levaram para o exílio
  rationale: No contexto, o particípio designa os responsáveis pela deportação; esta formulação comunica com clareza a ação causativa sem tornar o português excessivamente técnico.
