base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/019.yaml
  text: for it is not on the basis of the righteous deeds of our fathers and of our kings that we lay our plea for mercy before you[a], O Lord our God[b],
translation:
  language: pt
  text: pois não é com base nos atos justos[a] de nossos pais e de nossos reis que apresentamos diante de ti[b] a nossa súplica por misericórdia, ó Senhor, nosso Deus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ações justas”; menos provavelmente aqui, “preceitos” ou “estatutos”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante de tua face”, expressão que significa “em tua presença”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώματα
  choice: atos justos
  rationale: No contexto desta oração penitencial, a referência aos pais e aos reis favorece o sentido de atos de justiça nos quais se poderia fundamentar a súplica, e não o de preceitos legais. A formulação preserva, em nota, a amplitude lexical do termo.
- source_word: καταβάλλομεν
  choice: apresentamos
  rationale: Embora o verbo tenha a imagem concreta de lançar ou colocar, aqui integra a expressão de levar uma petição à presença de Deus. “Apresentamos” é natural em português e mantém o caráter solene da oração.
- source_word: τὸν ἔλεον
  choice: a nossa súplica por misericórdia
  rationale: A tradução estritamente literal, “a misericórdia”, poderia sugerir em português que os orantes oferecem misericórdia. O contexto mostra que eles a pedem; a explicitação comunica adequadamente a força idiomática sem transformar a misericórdia em mérito humano.
- source_word: κατὰ πρόσωπόν σου
  choice: diante de ti
  rationale: Expressa naturalmente em português o idioma grego literalmente relacionado ao rosto, com o sentido de estar na presença direta de Deus. A imagem literal é preservada em nota.
- source_word: Κύριε ὁ θεὸς ἡμῶν
  choice: ó Senhor, nosso Deus
  rationale: Mantém o vocativo solene e traduz κύριος pela forma tradicional e amplamente compreensível “Senhor”.
theological_decisions:
- issue: Se a oração rejeita fundamentar a súplica no mérito dos antepassados e dos reis
  choice: Os orantes declaram que sua súplica por misericórdia não se baseia nos atos justos de seus pais e reis.
  alternative: Entender δικαιώματα em sentido jurídico, como estatutos ou preceitos ligados aos antepassados e reis.
  rationale: O contexto penitencial e a construção “com base em” favorecem a referência a atos de justiça como possível fundamento da petição. A tradução não amplia essa afirmação para uma doutrina geral além do que o versículo diz.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com boa legibilidade brasileira. A ordem da frase preserva a ênfase naquilo que não serve de fundamento para a oração; a vírgula final acompanha a continuidade sintática do texto-fonte.
