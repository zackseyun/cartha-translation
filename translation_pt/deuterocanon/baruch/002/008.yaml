base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/008.yaml
  text: And we did not entreat the favor of the Lord[b][a], that each one might turn from the thoughts of their evil heart.
translation:
  language: pt
  text: E não suplicamos o favor do Senhor[a], para que cada um se afastasse dos pensamentos[b] de seu coração mau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a face do Senhor”. A expressão se refere aqui à sua atenção favorável ou misericórdia.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “das intenções” ou “dos desígnios de seu coração mau”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθημεν
  choice: suplicamos
  rationale: O verbo indica pedir com insistência ou implorar; “suplicamos” preserva essa força e soa natural em português.
- source_word: τοῦ προσώπου Κυρίου
  choice: o favor do Senhor
  rationale: Literalmente, “a face do Senhor”; no contexto de súplica, o semitismo se refere à atenção favorável ou misericórdia do Senhor.
- source_word: τοῦ ἀποστρέψαι
  choice: para que ... se afastasse
  rationale: Expressa finalidade ligada à súplica; a construção portuguesa preserva o sentido de que cada pessoa deveria abandonar sua disposição interior má.
- source_word: ἕκαστον
  choice: cada um
  rationale: Mantém a força distributiva e singular do grego.
- source_word: νοημάτων
  choice: pensamentos
  rationale: νόημα pode indicar pensamentos, intenções ou desígnios; “pensamentos” preserva a amplitude lexical sem definir em excesso.
- source_word: καρδίας
  choice: coração
  rationale: Conserva a imagem antropológica bíblica do centro interior do pensamento e da vontade.
- source_word: αὐτῶν
  choice: seu
  rationale: O plural grego retoma distributivamente o grupo; em português, depois de “cada um”, o singular “seu” é a concordância mais natural.
- source_word: τῆς πονηρᾶς
  choice: mau
  rationale: O adjetivo qualifica moralmente o coração; “mau” é claro, direto e corresponde ao feminino singular grego ligado a καρδίας.
theological_decisions:
- issue: Força idiomática de “a face do Senhor”
  choice: o favor do Senhor
  alternative: a face do Senhor; a presença do Senhor
  rationale: No contexto da súplica, a expressão aponta para buscar a atenção favorável ou a misericórdia divina. A tradução idiomática evita obscuridade sem reduzir a frase a uma oração genérica.
- issue: Relação entre arrependimento e ação divina
  choice: para que cada um se afastasse
  alternative: a fim de fazer cada um afastar-se
  rationale: A formulação preserva a finalidade expressa pelo infinitivo grego sem determinar além do texto como a súplica e a conversão humana se relacionam.
- issue: Imagem do coração como fonte dos pensamentos maus
  choice: pensamentos de seu coração mau
  alternative: intenções de seu coração perverso
  rationale: Mantém tanto a imagem bíblica do coração quanto a amplitude de νόημα, sem reduzir o termo exclusivamente a planos deliberados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Suplicamos” retém o tom penitencial; “se afastasse” é mais natural do que uma reprodução literal de “fizesse voltar”. Os marcadores aparecem junto às expressões esclarecidas.
