base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/021.yaml
  text: 'Thus says the Lord: Bow your shoulder and serve the king of Babylon[c][b][a], and dwell on the land that I gave to your fathers.'
translation:
  language: pt
  text: 'Assim diz o Senhor: “Curvem o ombro[a] e sirvam ao rei da Babilônia; habitem na terra[b] que dei aos seus pais[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Inclinem o ombro”. A imagem é a de submeter-se ao serviço imposto.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “sentem-se sobre a terra”. Aqui, o verbo grego tem o sentido de habitar, estabelecer-se ou permanecer nela.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “seus antepassados”. O grego diz literalmente “seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως εἶπεν Κύριος
  choice: Assim diz o Senhor
  rationale: Embora εἶπεν seja formalmente aoristo, a fórmula profética é vertida naturalmente no presente em português, preservando a força permanente da declaração divina. Κύριος é traduzido por “Senhor”.
- source_word: Κλίνατε τὸν ὦμον ὑμῶν
  choice: Curvem o ombro
  rationale: Mantém a imagem concreta do grego — inclinar o ombro em submissão ao serviço imposto — sem substituí-la por “pescoço” ou “costas”.
- source_word: ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος
  choice: sirvam ao rei da Babilônia
  rationale: Neste contexto, o verbo de trabalhar, construído com o dativo do rei, expressa serviço prestado ao soberano. “Sirvam” é natural em português e comunica a submissão exigida.
- source_word: καθίσατε ἐπὶ τὴν γῆν
  choice: habitem na terra
  rationale: Καθίσατε significa literalmente “sentem-se”, mas aqui funciona idiomaticamente no sentido de residir ou permanecer estabelecido em uma terra.
- source_word: ἣν δέδωκα
  choice: que dei
  rationale: O perfeito grego aponta para a dádiva divina já realizada e ainda relevante; o pretérito perfeito simples é claro e idiomático em português.
- source_word: τοῖς πατράσιν ὑμῶν
  choice: aos seus pais
  rationale: Conserva o termo familiar masculino explícito do grego e a formulação bíblica tradicional, deixando “antepassados” como esclarecimento possível.
theological_decisions:
- issue: Tradução de Κύριος na fórmula profética
  choice: o Senhor
  alternative: Senhor
  rationale: Preserva a fórmula de autoridade divina sem introduzir uma forma tipográfica destinada especificamente ao tetragrama hebraico.
- issue: Natureza da ordem dada em relação ao rei da Babilônia
  choice: sirvam ao rei da Babilônia
  alternative: trabalhem para o rei da Babilônia
  rationale: “Sirvam” expressa adequadamente a submissão política e o trabalho exigidos, sem acrescentar aprovação moral ou teológica ao domínio babilônico.
- issue: Termo ancestral masculino τοῖς πατράσιν ὑμῶν
  choice: aos seus pais
  alternative: aos seus antepassados
  rationale: Mantém a forma masculina e familiar do texto grego, enquanto a nota registra a extensão coletiva possível do termo.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural e tratamento por “seus”. A metáfora incomum do ombro foi preservada por sua importância no texto, enquanto o uso idiomático de καθίσατε foi traduzido pelo natural “habitem” e explicado em nota.
