base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/029.yaml
  text: If you do not listen to my voice[b][a], surely this great and vast multitude will be reduced to a few among the nations where I will scatter them there.
translation:
  language: pt
  text: Se vocês não ouvirem a minha voz, certamente esta grande e numerosa multidão será reduzida a poucos entre as nações onde eu os espalharei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz literalmente uma expressão locativa redundante: “onde eu os espalharei, ali”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν μὴ ἀκούσητε τῆς φωνῆς μου
  choice: Se vocês não ouvirem a minha voz
  rationale: “Ouvir a voz” preserva o idioma do texto e, neste contexto de advertência da aliança, implica dar ouvidos e obedecer, não apenas perceber um som.
- source_word: εἰ μὴν
  choice: certamente
  rationale: Expressa a forte asseveração da consequência anunciada.
- source_word: ἡ βόμβησις
  choice: multidão
  rationale: Embora o substantivo possa designar zumbido, estrondo ou tumulto, a redução subsequente “a poucos” indica aqui, por metonímia, a grande massa populacional.
- source_word: ἡ μεγάλη ἡ πολλὴ αὕτη
  choice: esta grande e numerosa multidão
  rationale: Mantém a dupla ênfase na dimensão e no número do povo em português natural.
- source_word: ἀποστρέψει εἰς μικρὰν
  choice: será reduzida a poucos
  rationale: Explicita com naturalidade a construção grega comprimida, cujo sentido é a diminuição numérica da população.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: Refere-se sem carga teológica adicional aos povos estrangeiros entre os quais Israel seria disperso.
- source_word: οὗ διασπερῶ αὐτοὺς ἐκεῖ
  choice: onde eu os espalharei
  rationale: O português já incorpora em “onde” a localização reforçada pelo grego οὗ...ἐκεῖ; reproduzir “onde... ali” seria possível, mas excessivamente marcado e não acrescentaria conteúdo.
theological_decisions:
- issue: Advertência divina e consequência da desobediência
  choice: Apresentar a redução numérica do povo no exílio como consequência certa, sem ampliar a linguagem de juízo além do texto.
  alternative: Entender ἡ βόμβησις literalmente como “estrondo” ou “tumulto”, fazendo da frase uma referência à diminuição de um ruído.
  rationale: A oposição entre uma grande multidão e “poucos”, juntamente com a dispersão entre as nações, favorece claramente a referência à população, embora a nota preserve o valor literal incomum do termo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com uso de “vocês” para a segunda pessoa plural. A formulação conserva o idioma bíblico “ouvir a minha voz” e evita tanto literalismo obscuro em βόμβησις quanto expansão doutrinária.
