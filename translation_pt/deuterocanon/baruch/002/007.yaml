  text: which the Lord spoke against us—all these evils that came upon us[a].
translation:
  language: pt
  text: que o Senhor falou contra nós — todos estes males que vieram sobre nós.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas estas calamidades” ou “todos estes desastres”. Aqui, o grego traduzido por “males” se refere aos juízos danosos que sobrevieram ao povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: que
  rationale: Pronome relativo que mantém a ligação do versículo com a oração anterior e soa natural em português.
- source_word: ἐλάλησεν
  choice: falou
  rationale: Traduz diretamente o aoristo de λαλέω sem especificar indevidamente se se tratou de declaração formal, anúncio ou decreto.
- source_word: Κύριος
  choice: Senhor
  rationale: Corresponde ao grego Κύριος nesta fonte deuterocanônica, sem substituir a forma grega por uma representação tipográfica do nome divino hebraico.
- source_word: ἐφ᾽ ἡμᾶς (primeira ocorrência)
  choice: contra nós
  rationale: Com o verbo falar e no contexto de juízo, ἐπί com acusativo tem sentido adversativo; “contra nós” comunica que a palavra pronunciada era de juízo.
- source_word: πάντα τὰ κακὰ ταῦτα
  choice: todos estes males
  rationale: “Males” conserva a amplitude de κακά, que pode designar tanto o mal quanto acontecimentos danosos, sem reduzir no texto principal a expressão a “calamidades” ou “desastres”.
- source_word: ἦλθεν
  choice: vieram
  rationale: Equivalente direto e idiomático do aoristo de ἔρχομαι; o plural em português concorda naturalmente com “males”.
- source_word: ἐφ᾽ ἡμᾶς (segunda ocorrência)
  choice: sobre nós
  rationale: Com “vieram”, “sobre nós” reproduz naturalmente a imagem de acontecimentos que alcançaram ou recaíram sobre o povo.
theological_decisions:
- issue: Se τὰ κακά deve ser entendido moralmente como “males” ou experiencialmente como “calamidades/desastres” no contexto do juízo
  choice: males
  alternative: calamidades; desastres
  rationale: 'A opção mantém a amplitude e a tensão do grego: trata-se de acontecimentos danosos que vieram como juízo do Senhor, sem restringir silenciosamente o termo a uma única interpretação.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O travessão explicita a aposição já presente na sintaxe grega sem acrescentar conteúdo. A construção inicia com “que” porque o versículo continua a frase anterior.
