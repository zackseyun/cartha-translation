base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/017.yaml
  text: 'Open your eyes and see: it is not the dead in Hades, whose breath has been taken from their inward parts, who will give glory and righteousness to the Lord;'
translation:
  language: pt
  text: 'Abre os teus olhos e vê: não são os mortos no Hades, cujo sopro foi tirado de suas entranhas[a], que darão glória e justiça ao Senhor[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujo espírito foi tirado do íntimo deles”.'
    reason: Preserva as alternativas lexicais de πνεῦμα e σπλάγχνα.
  - marker: b
    text: 'Ou: “glória e retidão ao Senhor”.'
    reason: Preserva uma alternativa possível para δικαίωμα.
lexical_decisions:
- source_word: ἄνοιξον ὀφθαλμούς σου καὶ ἴδε
  choice: Abre os teus olhos e vê
  rationale: Reproduz os dois imperativos no singular e mantém a imagem concreta em português natural e digno.
- source_word: οὐχ οἱ τεθνηκότες ἐν τῷ ᾅδῃ
  choice: não são os mortos no Hades
  rationale: Conserva a ênfase negativa e o termo específico ᾅδης, sem reduzi-lo a sepultura.
- source_word: ὧν ἐλήμφθη τὸ πνεῦμα αὐτῶν
  choice: cujo sopro foi tirado
  rationale: No contexto da morte, πνεῦμα pode designar o sopro vital; a alternativa 'espírito' permanece na nota para preservar a ambiguidade.
- source_word: ἀπὸ τῶν σπλάγχνων αὐτῶν
  choice: de suas entranhas
  rationale: Mantém a concretude corporal de σπλάγχνα. Em português, 'entranhas' é compreensível e mais fiel do que a generalização 'de dentro deles'.
- source_word: δώσουσιν δόξαν καὶ δικαίωμα τῷ κυρίῳ
  choice: darão glória e justiça ao Senhor
  rationale: Mantém o futuro e a coordenação dos substantivos. Aqui δικαίωμα aponta para a justiça ou retidão reconhecida como pertencente ao Senhor.
theological_decisions:
- issue: Sentido de πνεῦμα no contexto da morte
  choice: sopro
  alternative: espírito
  rationale: A retirada do sopro vital corresponde diretamente à imagem da morte, mas πνεῦμα também pode significar 'espírito'; a nota evita encerrar a tensão.
- issue: Sentido de δικαίωμα atribuído ao Senhor
  choice: justiça
  alternative: retidão
  rationale: '''Justiça'' expressa de modo corrente o caráter justo ou o justo direito do Senhor. ''Retidão'' também é possível e preserva o matiz moral sem sugerir necessariamente uma ordenança legal.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa coerentes no imperativo. 'Hades' conserva a especificidade do texto grego; as notas registram ambiguidades genuínas sem impor uma leitura doutrinária.
