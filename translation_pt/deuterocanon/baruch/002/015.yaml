  text: so that all the earth may know that you[a], Lord, are our God, because your name has been called upon Israel and upon his offspring.
translation:
  language: pt
  text: para que toda a terra saiba que tu, Senhor, és o nosso Deus, pois o teu nome foi invocado sobre Israel e sobre a sua descendência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu nome foi chamado sobre Israel”; em sentido mais interpretativo: “Israel é chamado pelo teu nome”. A expressão grega indica pertencimento a Deus e identificação com ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνῷ
  choice: para que ... saiba
  rationale: Preserva a força de propósito ou resultado de ἵνα com o subjuntivo e soa natural em português.
- source_word: πᾶσα ἡ γῆ
  choice: toda a terra
  rationale: γῆ pode significar “terra” em sentido local ou universal; com πᾶσα e neste contexto, a referência mais ampla é a mais provável, sem eliminar totalmente a amplitude lexical do termo.
- source_word: Κύριος
  choice: Senhor
  rationale: É a tradução portuguesa corrente de κύριος e mantém o tratamento divino do texto grego.
- source_word: ὁ θεὸς ἡμῶν
  choice: o nosso Deus
  rationale: Formulação possessiva natural em português, preservando a confissão relacional do original.
- source_word: τὸ ὄνομά σου ἐπεκλήθη ἐπὶ
  choice: o teu nome foi invocado sobre
  rationale: Mantém de perto a construção grega e sua ambiguidade entre invocação, designação e pertencimento, esclarecida na nota.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: τὸ γένος αὐτοῦ
  choice: a sua descendência
  rationale: γένος designa aqui linhagem ou posteridade. “Descendência” é natural e abrangente; “sua” conserva a referência gramatical a Israel sem impor gênero em português.
theological_decisions:
- issue: O nome divino “invocado sobre” um povo
  choice: Preservar o idioma como “o teu nome foi invocado sobre Israel”
  alternative: “Israel é chamado pelo teu nome” ou “Israel leva o teu nome”
  rationale: A expressão comunica invocação, identificação pública e pertencimento a Deus. A tradução principal conserva a forma e a tensão do grego, enquanto a nota apresenta as leituras idiomáticas possíveis.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. Emprega “tu/teu” de modo coerente com o tratamento direto singular; conserva o idioma bíblico quando ele carrega ambiguidade teológica relevante.
