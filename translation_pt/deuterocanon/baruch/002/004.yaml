base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/004.yaml
  text: And he gave them over as subjects to all the kingdoms around us[a], for reproach and desolation among all the peoples around whom the Lord scattered them there.
translation:
  language: pt
  text: E ele os entregou como súditos a todos os reinos ao nosso redor, para serem objeto de vergonha e desolação[a] entre todos os povos ao redor, entre os quais o Senhor os dispersou ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um lugar intransitável”. O termo grego pode designar mais literalmente algo não pisado ou inacessível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν
  choice: entregou
  rationale: No contexto de juízo e sujeição política, o verbo indica pôr alguém sob o poder de outros, não uma simples doação.
- source_word: ὑποχειρίους
  choice: como súditos
  rationale: Expressa de modo claro a condição de quem foi colocado sob a mão ou o domínio de poderes estrangeiros.
- source_word: πάσαις ταῖς βασιλείαις
  choice: a todos os reinos
  rationale: Preserva o plural e a abrangência do grego, com o complemento exigido pela ideia de sujeição.
- source_word: ταῖς κύκλῳ ἡμῶν
  choice: ao nosso redor
  rationale: Reproduz de maneira natural a localização circundante indicada por κύκλῳ.
- source_word: εἰς ὀνειδισμόν
  choice: para serem objeto de vergonha
  rationale: Comunica a desonra pública resultante do juízo em português corrente, sem perder a força de censura e humilhação.
- source_word: ἄβατον
  choice: desolação
  rationale: Embora o termo possa designar literalmente algo não pisado, inacessível ou intransitável, neste contexto de juízo descreve adequadamente devastação e abandono; a alternativa literal é preservada em nota.
- source_word: λαοῖς
  choice: povos
  rationale: Mantém o sentido coletivo e étnico amplo sem transformar necessariamente os grupos em Estados políticos.
- source_word: διέσπειρεν
  choice: dispersou
  rationale: Representa com naturalidade o espalhamento do povo no exílio e conserva o agente divino explícito.
- source_word: Κύριος
  choice: o Senhor
  rationale: É a forma portuguesa bíblica natural para κύριος quando usado como designação divina.
- source_word: ἐκεῖ
  choice: ali
  rationale: Mantém explicitamente o advérbio locativo final, integrado à expressão 'ali onde' para evitar uma construção excessivamente rígida.
theological_decisions:
- issue: Atribuição da dispersão a Κύριος
  choice: o Senhor os dispersou
  alternative: foram dispersos entre os povos
  rationale: A tradução mantém o Senhor como agente explícito do juízo, sem suavizar a afirmação nem acrescentar explicações doutrinárias.
- issue: Sentido de ἄβατον no contexto do juízo
  choice: desolação
  alternative: lugar intransitável
  rationale: O contexto favorece a condição de devastação e abandono, mas a amplitude lexical do termo é preservada em nota para não eliminar a leitura mais literal.
- issue: Relação locativa em τοῖς κύκλῳ οὗ ... ἐκεῖ
  choice: entre todos os povos ao redor, ali onde o Senhor os dispersou
  alternative: entre todos os povos ao redor do lugar para onde o Senhor os dispersou
  rationale: A formulação conserva tanto a ideia dos povos circundantes quanto o elemento locativo de οὗ e ἐκεῖ, sem forçar uma referência pessoal inexistente no grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Como súditos” esclarece a sujeição política; “vergonha” evita o caráter menos corrente de “opróbrio”. A construção final mantém a repetição locativa do grego em forma natural.
