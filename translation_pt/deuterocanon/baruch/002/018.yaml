base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/018.yaml
  text: But the soul that is grieved over its great misery[a], that goes about bent over and weak, and the eyes that are failing and the soul that is hungry—these will give you glory and righteousness[b], O Lord.
translation:
  language: pt
  text: Mas a alma, entristecida por sua grande aflição[a], que caminha encurvada e enfraquecida, e os olhos que desfalecem, e a alma faminta — todos eles te darão glória e retidão[b], ó Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entristecida por causa da grandeza”. A expressão grega é condensada; “de sua aflição” é suprido a partir do contexto de fraqueza, fome e esgotamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “justiça”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχή
  choice: alma
  rationale: Preserva a repetição poética e o sentido da vida interior ou da própria pessoa em contexto de lamento.
- source_word: λυπουμένη
  choice: entristecida
  rationale: Expressa o pesar contínuo do particípio sem restringi-lo a uma causa mais específica.
- source_word: ἐπὶ τὸ μέγεθος
  choice: diante da grandeza de sua aflição
  rationale: O grego é elíptico; o contexto de fraqueza, fome e olhos que desfalecem indica a magnitude da aflição, mas a nota conserva a formulação mais literal.
- source_word: βαδίζει
  choice: anda
  rationale: Representa de modo simples e natural a ação contínua de caminhar ou seguir.
- source_word: κύπτον
  choice: encurvada
  rationale: Comunica vividamente a postura abatida, física e figurada.
- source_word: ἀσθενοῦν
  choice: enfraquecida
  rationale: Mantém o sentido amplo de debilidade sem especificar doença.
- source_word: οἱ ὀφθαλμοὶ οἱ ἐκλείποντες
  choice: os olhos que desfalecem
  rationale: Preserva a imagem de olhos que perdem as forças ou falham devido ao esgotamento.
- source_word: πεινῶσα
  choice: faminta
  rationale: Tradução direta e corrente do particípio, sem intensificação indevida.
- source_word: δώσουσίν σοι δόξαν
  choice: te darão glória
  rationale: Mantém a construção direta do grego e é compreensível em registro bíblico moderno.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: Neste contexto de atribuir algo a Deus, 'justiça' comunica sua retidão e seu agir justo; 'retidão' permanece alternativa legítima.
- source_word: Κύριε
  choice: Senhor
  rationale: Forma consagrada, digna e amplamente compreendida para a invocação divina.
theological_decisions:
- issue: Sentido de δικαιοσύνην na oração dirigida a Deus
  choice: justiça
  alternative: retidão
  rationale: Ambos os sentidos pertencem ao campo semântico do termo. 'Justiça' é natural em português e pode designar a qualidade justa de Deus, enquanto a nota preserva a nuance de retidão moral.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve cadência poética. A concordância de “encurvada e enfraquecida” toma “alma” como referente do sujeito implícito de “anda”; o demonstrativo plural “esses” reúne a alma aflita, os olhos e a alma faminta, refletindo a mudança para o verbo plural no grego.
