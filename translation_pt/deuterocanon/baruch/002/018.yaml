  rationale: A revisão esclarece a coordenação da frase, ajusta a relação causal da expressão grega elíptica e adota «retidão» para δικαιοσύνην, mantendo «justiça» em nota como alternativa legítima. Não altera as imagens, a ambiguidade essencial nem o sentido da passagem.
