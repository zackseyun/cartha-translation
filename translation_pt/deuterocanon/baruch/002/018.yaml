review_pass:
  verdict: revise
  source_fidelity: A versão capta bem a sequência de figuras de aflição e a retomada de ψυχή («alma»). Contudo, «diante da grandeza» não expressa com precisão o valor causal mais provável de ἐπὶ τὸ μέγεθος neste contexto; «por sua grande aflição» comunica a elipse contextual sem introduzir uma especificação indevida. Para δικαιοσύνην, «retidão» preserva melhor a nuance de qualidade atribuída a Deus e se alinha ao registro de «righteousness» no audit trail; «justiça» permanece uma alternativa válida em nota.
  naturalness: A enumeração original fica sintaticamente mais clara em português com a coordenação explícita por «e» e com «todos eles», que reúne naturalmente a alma, os olhos e a alma faminta antes do verbo plural. «Caminha» mantém a imagem de βαδίζει em registro moderno e digno.
  terminology: «Alma», «glória», «retidão» e «Senhor» são escolhas consistentes com o contexto orante e poético. A nota sobre a expressão elíptica preserva a possibilidade de uma formulação mais literal, sem apresentar «aflição» como se estivesse explicitamente no grego.
  issues:
  - severity: medium
    issue: A relação expressa por «diante da grandeza» é imprecisa.
    rationale: ἐπὶ τὸ μέγεθος é uma expressão elíptica cujo contexto favorece causa ou motivo da tristeza («por causa da grandeza [da aflição]»), e não primariamente localização ou postura «diante de» algo.
  - severity: low
    issue: A coordenação dos sujeitos antes de «esses te darão» está pouco fluida.
    rationale: Sem o segundo «e», «os olhos» parece uma aposição solta após a oração relativa. A coordenação explícita reproduz melhor a série grega e melhora a legibilidade.
  - severity: low
    issue: «Justiça» como texto principal pode estreitar δικαιοσύνην para a ideia de juízo ou agir judicial.
    rationale: No ato de atribuir uma qualidade a Deus, «retidão» preserva de modo mais direto a qualidade moral/rightness; «justiça» deve ser mantida como alternativa.
