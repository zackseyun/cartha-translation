base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/016.yaml
  text: Lord[a], look down from your holy house and take notice of us; incline your ear, Lord, and hear.
translation:
  language: pt
  text: Senhor, olha do alto da tua santa casa[a] e volta a tua atenção para nós; inclina, Senhor, o teu ouvido e ouve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do teu santo templo». O grego diz literalmente «da tua santa casa».
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος; «Senhor» mantém a invocação direta e solene sem exigir a interjeição «ó».
- source_word: κάτιδε
  choice: olha do alto
  rationale: O imperativo, reforçado por κατά, comunica a ideia de olhar para baixo ou desde cima; «olha do alto» preserva a imagem vertical e soa natural em português.
- source_word: ἐκ τοῦ οἴκου τοῦ ἁγίου σου
  choice: desde a tua santa casa
  rationale: οἶκος significa literalmente «casa». «Desde» expressa o ponto de onde parte o olhar e evita que «da tua santa casa» pareça apenas caracterizar «alto».
- source_word: ἐννόησον εἰς ἡμᾶς
  choice: volta a tua atenção para nós
  rationale: A construção pede consideração atenta dirigida aos suplicantes, não simples percepção intelectual. A formulação portuguesa conserva a direção marcada por εἰς.
- source_word: κλῖνον
  choice: inclina
  rationale: Mantém a metáfora tradicional da oração, na qual Deus inclina o ouvido para escutar, com linguagem elevada ainda plenamente compreensível.
- source_word: τὸ οὖς σου
  choice: o teu ouvido
  rationale: Preserva o singular concreto do grego e a imagem bíblica convencional.
- source_word: ἄκουσον
  choice: ouve
  rationale: Equivalente direto do imperativo, adequado ao paralelismo e ao tom de súplica.
theological_decisions:
- issue: Se οἶκος deve ser traduzido literalmente como «casa» ou interpretado como «templo»
  choice: casa
  alternative: templo
  rationale: O grego emprega οἶκος, não ναός. «Casa» preserva a formulação da fonte e sua possível referência à morada santa de Deus, sem impor uma identificação cultual mais específica.
- issue: Se a metáfora κλῖνον τὸ οὖς σου deve ser preservada
  choice: inclina o teu ouvido
  alternative: escuta-nos
  rationale: A expressão concreta e solene pertence à linguagem da oração bíblica. Preservá-la mantém a imagem e não elimina a intensidade retórica em favor de uma paráfrase.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Conserva-se a repetição de «Senhor», o paralelismo dos imperativos e a metáfora do ouvido inclinado.
