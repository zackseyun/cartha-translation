base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/002/001.yaml
  text: And the Lord has confirmed his word that he spoke against us and against our judges who judged Israel[a], and against our kings and against our rulers[b], and against the people of Israel and Judah.
translation:
  language: pt
  text: E o Senhor fez cumprir[a] a sua palavra, que havia proferido contra nós, contra os nossos juízes que julgaram Israel, contra os nossos reis, contra os nossos governantes e contra o povo de Israel e de Judá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confirmou”, “estabeleceu” ou “cumpriu”. O verbo grego pode significar fazer uma palavra permanecer de pé, isto é, confirmá-la ou levá-la a efeito.
    reason: lexical_alternative
  - marker: b
    text: 'O grego traz, literalmente, uma expressão singular e comprimida: “um ser humano” ou “um homem de Israel e de Judá”, usada aqui em sentido coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: fez cumprir
  rationale: O aoristo de ἵστημι significa aqui fazer com que a palavra pronunciada permaneça de pé ou produza efeito. No contexto de juízo, “fez cumprir” comunica que o Senhor levou a efeito o que havia declarado, sem reduzir o sentido à mera confirmação verbal.
- source_word: Κύριος
  choice: o Senhor
  rationale: Equivalente português natural e tradicional de κύριος como título divino, sem introduzir no texto grego um nome divino explícito.
- source_word: τὸν λόγον αὐτοῦ
  choice: a sua palavra
  rationale: “Palavra” preserva a amplitude de λόγος e se refere ao pronunciamento anterior do Senhor, sem especificá-lo indevidamente como decreto ou sentença.
- source_word: ἐλάλησεν ἐφ᾽ ἡμᾶς
  choice: havia proferido contra nós
  rationale: O contexto de juízo favorece o valor adversativo de ἐπί com acusativo. “Proferido” combina naturalmente com “palavra” e deixa claro que se trata de uma declaração solene.
- source_word: δικαστάς / τοὺς δικάσαντας
  choice: juízes que julgaram
  rationale: Mantém a correspondência lexical entre o substantivo e o particípio e distingue os juízes dos governantes mencionados depois.
- source_word: τοὺς ἄρχοντας
  choice: os nossos governantes
  rationale: Expressa autoridades dirigentes de maneira atual e preserva a distinção em relação aos reis e juízes.
- source_word: ἄνθρωπον Ἰσραὴλ καὶ Ἰούδα
  choice: o povo de Israel e de Judá
  rationale: O singular ἄνθρωπον tem força coletiva na enumeração. “O povo” transmite esse sentido em português natural, enquanto a forma incomum e comprimida do grego é registrada em nota.
theological_decisions:
- issue: Efeito da palavra de Deus no contexto de juízo
  choice: O Senhor levou a efeito a palavra de juízo que havia pronunciado.
  alternative: O Senhor confirmou ou estabeleceu a sua palavra em sentido mais geral.
  rationale: A repetição de “contra” e a enumeração dos atingidos indicam o cumprimento efetivo de uma palavra punitiva. “Fez cumprir” conserva esse peso contextual sem acrescentar a natureza específica do castigo.
- issue: Alcance coletivo de ἄνθρωπον
  choice: o povo de Israel e de Judá
  alternative: o homem de Israel e de Judá; cada pessoa de Israel e de Judá
  rationale: Embora o grego empregue um substantivo humano masculino singular, a construção coordena esse termo com grupos inteiros e, portanto, é mais naturalmente entendida de modo coletivo. A nota preserva a forma literal e a compressão da expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “contra” preserva a estrutura acusatória do grego; ela é mantida nas principais categorias da enumeração sem reproduzir mecanicamente todas as conjunções.
