base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/022.yaml
  text: For I have hoped in the Eternal One for your salvation, and joy has come to me from the Holy One because of the mercy that will quickly come to you from your eternal Savior.
translation:
  language: pt
  text: Pois pus minha esperança no Eterno pela salvação de vocês, e do Santo me veio alegria por causa da misericórdia que logo chegará até vocês, vinda do eterno Salvador de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤλπισα ἐπὶ τῷ αἰωνίῳ
  choice: pus minha esperança no Eterno
  rationale: Expressa de modo natural a confiança depositada em Deus e preserva o título substantivado «o Eterno».
- source_word: τὴν σωτηρίαν ὑμῶν
  choice: pela salvação de vocês
  rationale: Mantém o sentido mais provável da construção no contexto e usa uma forma amplamente compreensível em português moderno.
- source_word: παρὰ τοῦ ἁγίου
  choice: do Santo
  rationale: Conserva o título divino substantivado e a ideia de que a alegria procede dele.
- source_word: ἐλεημοσύνῃ
  choice: misericórdia
  rationale: Neste contexto, o termo designa a ação compassiva de Deus, não uma esmola humana.
- source_word: ἐν τάχει
  choice: em breve
  rationale: Indica proximidade temporal de modo idiomático, sem excluir a nuance de rapidez.
- source_word: τοῦ αἰωνίου σωτῆρος ὑμῶν
  choice: do eterno Salvador de vocês
  rationale: Preserva a modificação explícita de «Salvador» por «eterno» e a relação com os destinatários.
theological_decisions:
- issue: Títulos divinos substantivados
  choice: Eterno e Santo com iniciais maiúsculas
  alternative: eterno e santo em minúsculas
  rationale: No verso, ambos funcionam como designações pessoais de Deus; a capitalização deixa essa função clara sem acrescentar conteúdo doutrinário.
- issue: Relação entre esperança e salvação
  choice: «pus minha esperança no Eterno pela salvação de vocês»
  alternative: «esperei a salvação de vocês da parte do Eterno»
  rationale: A opção escolhida acompanha mais de perto a construção grega, mantendo como foco a confiança depositada no Eterno sem definir além do texto o modo dessa salvação.
translation_notes:
  register: 'Português atual, digno e de leitura ampla, com «vocês» para o plural. A ordem foi levemente ajustada para fluidez, preservando a progressão do grego: esperança, alegria e misericórdia futura.'
