  text: Take courage[a], children; cry out to God, and he will deliver you from oppression[b], from the hand of enemies.
translation:
  language: pt
  text: Tenham coragem, filhos; clamem a Deus, e ele os livrará da opressão, da mão dos inimigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Da mão dos inimigos” significa “do poder ou controle dos inimigos”.
    reason: cultural_note
lexical_decisions:
- source_word: Θαρρεῖτε
  choice: Tenham coragem
  rationale: O imperativo plural exorta à confiança e à coragem. A formulação é direta, natural e preserva a força exortativa do grego.
- source_word: τέκνα
  choice: filhos
  rationale: O vocativo plural designa os filhos ou descendentes a quem a voz materna se dirige; em português, “filhos” é uma forma familiar e abrangente nesse contexto.
- source_word: βοήσατε πρὸς τὸν θεόν
  choice: clamem a Deus
  rationale: O verbo indica clamar ou bradar, e πρός assinala aquele a quem se dirige o apelo. “Clamem a Deus” conserva a urgência e o caráter de oração.
- source_word: ἐξελεῖται ὑμᾶς
  choice: ele os livrará
  rationale: O futuro de ἐξαιρέω expressa resgate ou libertação. “Livrará” é claro, corrente e adequado à promessa de intervenção divina.
- source_word: ἐκ δυναστείας
  choice: da dominação
  rationale: δυναστεία pode indicar poder, domínio ou governo opressivo. “Dominação” preserva a ideia de sujeição a um poder controlador sem especificar além do texto.
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: da mão dos inimigos
  rationale: A tradução conserva a imagem concreta e o conhecido idioma bíblico segundo o qual a “mão” representa poder ou controle.
theological_decisions:
- issue: Promessa de libertação divina
  choice: e ele os livrará
  alternative: e ele os resgatará
  rationale: O grego promete de modo direto uma futura ação libertadora de Deus. “Livrará” comunica essa ação sem acrescentar uma explicação doutrinária.
- issue: Relação entre “dominação” e “mão dos inimigos”
  choice: manter as duas expressões em aposição
  alternative: fundir as expressões como “do domínio dos inimigos”
  rationale: A repetição de ἐκ no grego apresenta duas formulações correlatas. Mantê-las preserva o paralelismo e a imagem da fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O vocativo “filhos” preserva o tom familiar; “clamem” e “livrará” mantêm o registro bíblico sem arcaísmo excessivo.
