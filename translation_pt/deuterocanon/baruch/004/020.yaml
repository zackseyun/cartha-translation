base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/020.yaml
  text: I have taken off the robe of peace[a], but I have put on the sackcloth of my supplication[b]; I will cry out to the Eternal One in my days.
translation:
  language: pt
  text: Despi a veste da paz e vesti o pano de saco[a] da minha súplica; clamarei ao Eterno[b] durante os meus dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pano de saco” era uma roupa áspera usada como sinal de luto, arrependimento ou profunda aflição.
    reason: cultural_note
  - marker: b
    text: Também se pode traduzir por “aquele que é eterno”. O grego traz literalmente “o eterno”, usado aqui como título divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδυσάμην
  choice: Despi
  rationale: O aoristo médio indica tirar de si uma peça de roupa. “Despi” é natural, conciso e mantém a metáfora do vestuário.
- source_word: τὴν στολὴν τῆς εἰρήνης
  choice: a veste da paz
  rationale: “Veste” preserva o caráter digno de στολή sem restringi-lo a um tipo moderno específico de roupa; o genitivo “da paz” mantém a expressão metafórica grega.
- source_word: ἐνεδυσάμην
  choice: vesti
  rationale: Mantém o paralelismo antitético com “despi” e expressa naturalmente o ato de colocar a roupa sobre si.
- source_word: σάκκον
  choice: pano de saco
  rationale: Expressão bíblica compreensível em português para a roupa áspera usada em luto, aflição ou arrependimento; uma nota esclarece o costume.
- source_word: τῆς δεήσεώς μου
  choice: da minha súplica
  rationale: δέησις designa um pedido insistente ou urgente. “Súplica” conserva essa intensidade e a relação genitiva com o pano de saco.
- source_word: κεκράξομαι
  choice: clamarei
  rationale: O verbo comunica um apelo intenso e audível. “Clamarei” preserva a solenidade e a urgência sem paráfrase excessiva.
- source_word: τὸν αἰώνιον
  choice: ao Eterno
  rationale: O adjetivo substantivado funciona como título divino. “O Eterno” é natural em português e não substitui a formulação distintiva do grego por “Deus” ou “Senhor”.
- source_word: ἐν ταῖς ἡμέραις μου
  choice: durante os meus dias
  rationale: Reproduz a referência temporal sem acrescentar explicitamente “todos”, ausente do grego.
theological_decisions:
- issue: Tradução do título divino τὸν αἰώνιον
  choice: o Eterno
  alternative: aquele que é eterno; o Perpétuo
  rationale: O grego emprega um adjetivo substantivado, literalmente “o eterno”. A tradução conserva o título e sua força teológica sem normalizá-lo como “Deus” ou “Senhor”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela “despi... vesti” preserva a força poética do original; “súplica” e “clamarei” mantêm o tom solene e urgente.
