base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/024.yaml
  text: For just as the neighbors of Zion have now seen your captivity[b][a], so they will soon see the salvation from your God that will come upon you with great glory and the splendor of the Eternal.
translation:
  language: pt
  text: Pois, assim como os vizinhos de Sião viram agora o cativeiro de vocês, também verão em breve a salvação que vem do Deus de vocês[a] e que chegará até vocês com grande glória e com o esplendor do Eterno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o livramento que vem do Deus de vocês”. O termo grego também pode significar livramento ou resgate.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “daquele que é eterno”. No grego, o adjetivo aparece substantivado como título divino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάροικοι Σειὼν
  choice: os povos vizinhos de Sião
  rationale: πάροικοι indica os que vivem perto ou ao redor. “Povos vizinhos” expressa naturalmente os observadores circundantes sem impor o sentido jurídico de estrangeiros residentes.
- source_word: αἰχμαλωσίαν
  choice: cativeiro
  rationale: Preserva o sentido concreto do estado de quem foi capturado por inimigos, embora o exílio seja parte do contexto.
- source_word: ἐν τάχει
  choice: em breve
  rationale: O idiomatismo aponta para proximidade temporal; esta formulação é natural numa promessa futura.
- source_word: σωτηρίαν
  choice: salvação
  rationale: O termo pode significar livramento ou resgate, mas “salvação” mantém a amplitude teológica do ato salvador de Deus sem perder o sentido contextual de restauração.
- source_word: παρὰ τοῦ θεοῦ ὑμῶν
  choice: que vem do Deus de vocês
  rationale: παρά com genitivo indica origem. A redação explicita de modo idiomático que a salvação procede do Deus deles, sem atribuir posse não expressa no grego.
- source_word: ἐπελεύσεται ὑμῖν
  choice: chegará até vocês
  rationale: Expressa a aproximação e chegada da intervenção prometida; evita a possível conotação negativa que “virá sobre vocês” pode ter em português corrente.
- source_word: μετὰ δόξης μεγάλης
  choice: com grande glória
  rationale: Mantém a ressonância bíblica de δόξα no contexto da ação divina.
- source_word: λαμπρότητος
  choice: esplendor
  rationale: Comunica brilho e magnificência, combinando naturalmente com “glória” sem simples repetição.
- source_word: τοῦ αἰωνίου
  choice: do Eterno
  rationale: O adjetivo substantivado funciona como título divino. “O Eterno” conserva essa força e não acrescenta no título o substantivo “Deus”, ausente nesta expressão.
theological_decisions:
- issue: Tradução de σωτηρία num contexto de restauração
  choice: salvação
  alternative: livramento
  rationale: Embora o referente imediato inclua libertação do cativeiro, “salvação” preserva a amplitude do termo no uso bíblico. A alternativa é registrada em nota para manter visível a nuance contextual.
- issue: Tradução de τοῦ αἰωνίου como título divino
  choice: o Eterno
  alternative: Aquele que é eterno
  rationale: A forma grega é um adjetivo substantivado. O título conciso preserva essa construção e evita inserir “Deus” onde o texto não o repete.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O plural “vocês” evita formas regionais marcadas; “povos vizinhos” esclarece que se trata das comunidades ao redor de Sião.
