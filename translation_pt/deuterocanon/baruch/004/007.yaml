  text: For you provoked the one who made you by sacrificing to demons and not to God.
translation:
  language: pt
  text: Pois vocês provocaram aquele que os fez, oferecendo sacrifícios a demônios, e não a Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρωξύνατε
  choice: provocaram
  rationale: O aoristo ativo indica a ação passada de provocar. “Provocaram” preserva o sentido causativo sem explicitar além do grego uma emoção específica, como ira.
- source_word: τὸν ποιήσαντα ὑμᾶς
  choice: aquele que os fez
  rationale: Reproduz de modo natural a construção participial grega e mantém ποιέω como “fez”, sem substituí-lo por uma formulação mais interpretativa como “Criador”.
- source_word: θύσαντες
  choice: oferecendo sacrifícios
  rationale: O particípio explica o meio pelo qual ocorreu a provocação. A formulação é corrente em português e torna explícito o sentido sacrificial do verbo θύω sem alterar sua relação sintática.
- source_word: δαιμονίοις
  choice: a demônios
  rationale: No contexto judaico-grego de sacrifício idolátrico, o termo designa seres espirituais hostis associados à idolatria; “demônios” conserva diretamente esse peso teológico.
- source_word: καὶ οὐ θεῷ
  choice: e não a Deus
  rationale: Mantém o paralelismo dos dativos δαιμονίοις e θεῷ, indicando os destinatários contrastantes dos sacrifícios.
theological_decisions:
- issue: Sentido de δαιμονίοις no contexto de sacrifício idolátrico
  choice: demônios
  alternative: espíritos malignos; poderes dos ídolos
  rationale: “Demônios” preserva a apresentação do texto de que os sacrifícios idolátricos eram dirigidos a seres espirituais opostos a Deus, sem reduzir a afirmação a mera metáfora.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento plural “vocês/os” comunica naturalmente a segunda pessoa plural do grego. A vírgula antes de “e não a Deus” ressalta o contraste sacrificial sem mudar o sentido.
