base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/035.yaml
  text: For fire will come upon her from the Everlasting One for many days[a], and she will be inhabited by demons for a very long time.
translation:
  language: pt
  text: Pois virá sobre ela fogo da parte do Eterno[a] por muitos dias, e ela será habitada por demônios por muito tempo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da parte daquele que é eterno”. O grego emprega um adjetivo substantivado, literalmente “da parte do eterno”, usado aqui como título divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῦρ
  choice: fogo
  rationale: Mantém de modo direto a imagem do juízo, sem acrescentar artigo indefinido desnecessário.
- source_word: ἐπελεύσεται αὐτῇ
  choice: virá sobre ela
  rationale: Expressa a ideia de algo que sobrevém à cidade em juízo e preserva sua personificação no feminino.
- source_word: παρὰ τοῦ αἰωνίου
  choice: da parte do Eterno
  rationale: O adjetivo substantivado funciona como título divino. “O Eterno” é natural em português, conserva a força do título e não acrescenta explicitamente “Deus”.
- source_word: εἰς ἡμέρας μακράς
  choice: por muitos dias
  rationale: Comunica naturalmente a duração prolongada indicada pela expressão grega.
- source_word: κατοικηθήσεται
  choice: será habitada
  rationale: Preserva a forma passiva e apresenta a cidade como o lugar ocupado por esses seres.
- source_word: δαιμονίων
  choice: demônios
  rationale: No contexto judaico-grego de juízo e desolação, o termo designa seres espirituais hostis; “demônios” é o equivalente claro e corrente.
- source_word: τὸν πλεῖονα χρόνον
  choice: por muitíssimo tempo
  rationale: Reproduz em português natural a ideia de uma duração excepcionalmente prolongada, sem impor a leitura quantitativa mais literal “durante a maior parte do tempo”.
theological_decisions:
- issue: Tradução do título divino τοῦ αἰωνίου
  choice: o Eterno
  alternative: aquele que é eterno; o Deus eterno
  rationale: A formulação mantém o adjetivo como título divino e evita inserir o substantivo “Deus”, que não está expresso no grego.
- issue: Sentido de δαιμόνια no oráculo de juízo
  choice: demônios
  alternative: espíritos malignos
  rationale: A habitação de uma cidade arruinada por seres hostis favorece o sentido de “demônios”, corrente no uso judaico-grego, sem ampliar o texto com uma explicação interpretativa.
- issue: Força temporal de τὸν πλεῖονα χρόνον
  choice: por muitíssimo tempo
  alternative: durante a maior parte do tempo; por um tempo ainda mais longo
  rationale: A escolha comunica a longa desolação de modo idiomático, ao mesmo tempo que a nota lexical registra a possibilidade de uma leitura mais quantitativa da expressão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A personificação feminina da cidade foi preservada em “ela”, e a ordem das expressões temporais acompanha de perto o desenvolvimento do grego.
