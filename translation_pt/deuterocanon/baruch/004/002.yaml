translation:
  language: pt
  text: Volte[a], ó Jacó, e apegue-se a ela; avance rumo ao resplendor[b], diante de sua luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Retorne, ó Jacó, e agarre-se a ela”. O pronome feminino também pode ser traduzido de modo impessoal, caso seja entendido como referência à lei, e não à sabedoria personificada.'
