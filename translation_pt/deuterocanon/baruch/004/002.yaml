lexical_decisions:
- source_word: ἐπιστρέφου
  choice: Volte
  rationale: O imperativo pode significar “volte” ou “retorne”. “Volte” conserva tanto o movimento de retorno quanto a possível nuance de mudança de rumo, sem explicitar além do texto.
- source_word: Ἰακώβ
  choice: Jacó
  rationale: Mantém o nome próprio expresso no grego, em sua forma portuguesa tradicional, sem substituí-lo por “Israel”.
- source_word: ἐπιλαβοῦ αὐτῆς
  choice: agarre-se a ela
  rationale: Expressa o ato de tomar e manter firme contato. O pronome feminino preserva a personificação indicada pelo grego e pelo contexto.
- source_word: διόδευσον
  choice: avance rumo a
  rationale: O verbo comunica a ideia de seguir caminho ou prosseguir. “Avance rumo a” soa natural em português e mantém a imagem de movimento orientado.
- source_word: λάμψιν
  choice: resplendor
  rationale: Traduz a claridade radiante de λάμψις em registro elevado, mas compreensível, distinguindo-a de φῶς.
- source_word: κατέναντι
  choice: diante de
  rationale: A preposição pode indicar posição em frente de, defronte de ou na presença de algo. “Diante de” preserva essa relação espacial sem impor uma formulação excessivamente estranha.
- source_word: φωτός
  choice: luz
  rationale: É o sentido básico do termo e mantém a variação poética entre “resplendor” e “luz”.
theological_decisions:
- issue: Personificação do referente feminino αὐτῆς
  choice: Manter “ela/dela” no texto principal
  alternative: Usar “isso/disso” ou reformular de modo impessoal, entendendo o referente como a lei ou o mandamento
  rationale: O gênero feminino do pronome e o contexto favorecem a preservação da personificação da sabedoria/lei; uma forma neutra achataria a tensão literária presente no texto.
- issue: Relação entre o resplendor e a luz na frase final
  choice: 'Preservar a construção espacial: “rumo ao resplendor, diante da luz dela”'
  alternative: 'Integrar os termos: “rumo ao resplendor da luz dela”'
  rationale: A construção escolhida permanece mais próxima da sintaxe grega e conserva sua possível ambiguidade, enquanto a alternativa é idiomaticamente mais fluida.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação conserva a personificação feminina e a estrutura poética da frase final, recorrendo às notas para registrar alternativas legítimas.
