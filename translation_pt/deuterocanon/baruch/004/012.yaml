revisions:
- from: Que ninguém exulte com a minha desgraça[a], pois sou viúva e fui abandonada por muitos. Fiquei desolada por causa dos pecados dos meus filhos, porque eles se desviaram da lei de Deus.
  to: Que ninguém se regozije com o meu infortúnio[a], eu, viúva e abandonada por muitos. Fiquei desolada por causa dos pecados dos meus filhos, porque se desviaram da lei de Deus.
  rationale: A revisão elimina a inferência causal introduzida por «pois» e restaura a caracterização aposicional da locutora. Também substitui «exulte com a minha desgraça» por uma formulação que representa de forma mais natural e precisa a alegria maliciosa expressa pelo verbo grego, sem identificar a locutora personificada nem ampliar o sentido teológico do versículo.
