  source_fidelity: 'A ideia central está bem preservada: a locutora feminina, caracterizada como viúva e abandonada, atribui a sua desolação aos pecados de seus filhos e ao desvio da lei de Deus. Contudo, «pois» introduz uma relação causal que não está expressa no grego, onde «viúva e abandonada por muitos» funciona como caracterização aposicional da locutora. «Com a minha desgraça» torna explícito o infortúnio implícito no verbo, o que é defensável, mas «meu infortúnio» exprime a nuance sem o tom algo mais pesado de «desgraça».'
  naturalness: O texto é claro e de registro apropriado. «Regocije com o meu infortúnio» é natural em português atual e comunica melhor a alegria hostil implicada por ἐπιχαιρέτω do que o mais genérico «exulte». A aposição «eu, viúva e abandonada por muitos» mantém a concisão e a estrutura do original sem criar uma justificativa causal.
  terminology: «Viúva», «abandonada», «desolada», «pecados», «filhos» e «lei de Deus» são escolhas fiéis e adequadas. Não se deve nomear Jerusalém ou Sião no texto, pois o versículo grego não o faz.
