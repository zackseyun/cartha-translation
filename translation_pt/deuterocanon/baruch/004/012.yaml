base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/012.yaml
  text: Let no one gloat over me[a], a widow and abandoned by many; I have been left desolate because of the sins of my children, because they turned aside from the law of God.
translation:
  language: pt
  text: Que ninguém se regozije com o meu infortúnio[a], eu, viúva e abandonada por muitos. Fiquei desolada por causa dos pecados dos meus filhos, porque se desviaram da lei de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego indica alegrar-se com o infortúnio de outra pessoa, isto é, regozijar-se maliciosamente à custa dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ἐπιχαιρέτω μοι
  choice: Que ninguém exulte com a minha desgraça
  rationale: A construção exprime uma proibição, e o verbo composto indica alegrar-se maliciosamente com o infortúnio de alguém. A formulação escolhida comunica essa nuance hostil em português natural; “com a minha desgraça” explicita apenas o infortúnio já pressuposto pelo verbo e pelo contexto.
- source_word: τῇ χήρᾳ καὶ καταλειφθείσῃ ὑπὸ πολλῶν
  choice: pois sou viúva e fui abandonada por muitos
  rationale: Os particípios femininos descrevem a condição da própria locutora. A forma verbal torna a relação sintática clara em português, sem identificar explicitamente a mulher personificada como Jerusalém ou Sião.
- source_word: ἠρημώθην
  choice: Fiquei desolada
  rationale: O verbo passivo descreve o estado resultante de devastação, privação ou abandono. “Fiquei desolada” preserva a imagem e é mais natural do que uma reprodução mecânica do passivo grego.
- source_word: διὰ τὰς ἁμαρτίας τῶν τέκνων μου
  choice: por causa dos pecados dos meus filhos
  rationale: διά com acusativo indica causa, e τέκνα abrange os descendentes ou filhos sem restringir o sexo.
- source_word: ἐξέκλιναν ἐκ νόμου θεοῦ
  choice: eles se desviaram da lei de Deus
  rationale: A escolha preserva a metáfora de afastar-se de um caminho ou norma e mantém o tom solene da referência à lei divina.
theological_decisions:
- issue: Personificação coletiva de Jerusalém ou Sião como mãe viúva e desolada
  choice: Manter a fala feminina em primeira pessoa sem nomear a locutora no texto do versículo.
  alternative: Explicitar “Jerusalém” ou “Sião” como sujeito.
  rationale: Embora o contexto identifique a locutora, o grego deste versículo não a nomeia. A tradução conserva a personificação e evita transformar uma inferência contextual em conteúdo explícito.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Exulte” mantém o tom poético e solene, enquanto a formulação geral evita arcaísmos e não resolve explicitamente a identidade metafórica da locutora.
