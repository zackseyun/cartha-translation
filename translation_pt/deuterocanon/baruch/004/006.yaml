base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/006.yaml
  text: You were sold to the nations, not for destruction; but because you provoked God to anger, you were handed over to your adversaries.
translation:
  language: pt
  text: Vocês foram vendidos às nações, não para a destruição; mas, porque provocaram a ira de Deus, foram entregues aos seus adversários.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθητε
  choice: foram vendidos
  rationale: Preserva diretamente a metáfora do aoristo passivo de πιπράσκω, sem especificar um mecanismo de venda que o texto não explicita.
- source_word: τοῖς ἔθνεσιν
  choice: às nações
  rationale: No contexto de exílio e juízo, refere-se às nações estrangeiras; esta opção é clara e evita a carga teológica posterior de «gentios».
- source_word: οὐκ εἰς ἀπώλειαν
  choice: não para a destruição
  rationale: Mantém a construção que pode indicar finalidade ou resultado e expressa que a entrega não visava à destruição final.
- source_word: διὰ δὲ τὸ παροργίσαι
  choice: mas, porque provocaram a ira de
  rationale: A construção com διά e infinitivo articular é causal. «Provocaram a ira de» comunica naturalmente a força de παροργίζω.
- source_word: τὸν θεόν
  choice: Deus
  rationale: Forma idiomática em português para o objeto definido da ação.
- source_word: παρεδόθητε
  choice: foram entregues
  rationale: Preserva o passivo de παραδίδωμι e a ideia de serem postos sob o poder de outros como consequência do juízo.
- source_word: τοῖς ὑπεναντίοις
  choice: aos seus adversários
  rationale: Expressa com precisão pessoas que se opõem ao destinatário, sem ampliar necessariamente o sentido para toda forma de inimizade.
theological_decisions:
- issue: Natureza do exílio e do juízo de Israel
  choice: A venda às nações não tinha como fim a destruição, mas a entrega aos adversários ocorreu porque o povo provocou a ira de Deus.
  alternative: Entender explicitamente o exílio como disciplina corretiva, ou tomar toda a declaração apenas como linguagem retórica.
  rationale: O grego contrapõe expressamente «não para a destruição» à causa «porque provocaram a ira de Deus». A tradução conserva essa tensão sem acrescentar uma doutrina completa sobre a finalidade disciplinar do exílio.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para o plural explícito e naturalidade de leitura brasileira. O paralelismo passivo («foram vendidos» / «foram entregues») foi preservado.
