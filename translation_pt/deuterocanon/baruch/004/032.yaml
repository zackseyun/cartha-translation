  text: Wretched are the cities to which your children were enslaved[a]; wretched is she who received your sons.
translation:
  language: pt
  text: Infelizes são as cidades nas quais seus filhos e suas filhas foram escravizados[a]; infeliz é aquela que recebeu seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas quais seus filhos e suas filhas serviram como escravos”. O verbo grego está na voz ativa e pode ser traduzido mais literalmente como “serviram como escravos”; neste contexto, porém, indica sujeição e cativeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δείλαιαι / δείλαια
  choice: infelizes
  rationale: O adjetivo exprime lamento e condenação sobre as cidades. “Infelizes” conserva o tom exclamativo sem transformar a frase no interpretativo “ai de”.
- source_word: αἱ πόλεις
  choice: as cidades
  rationale: O artigo definido aponta para cidades específicas ligadas ao exílio e é natural em português.
- source_word: αἷς ἐδούλευσαν
  choice: às quais ... serviram como escravos
  rationale: A construção mantém o dativo relacional do grego e explicita que δουλεύω indica serviço em condição de escravidão, não mero trabalho voluntário.
- source_word: τὰ τέκνα σου
  choice: seus filhos e suas filhas
  rationale: τέκνα designa os filhos de modo abrangente. A formulação explicita essa abrangência e permite conservar, na segunda oração, a mudança lexical para o masculino específico υἱούς.
- source_word: ἡ δεξαμένη
  choice: aquela que recebeu
  rationale: Preserva o particípio feminino singular e a personificação da cidade, evitando “acolheu”, que poderia sugerir hospitalidade benévola.
- source_word: τοὺς υἱούς σου
  choice: seus filhos
  rationale: υἱούς é masculino e se distingue do termo abrangente τέκνα empregado antes; “filhos” preserva essa especificidade em português.
theological_decisions:
- issue: Sentido de δουλεύω no contexto de exílio e juízo
  choice: serviram como escravos
  alternative: foram escravizados
  rationale: A escolha preserva a voz ativa do grego e comunica claramente a sujeição servil. A alternativa passiva expressa bem o contexto de opressão, mas altera a estrutura verbal.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição de “infeliz” conserva o paralelismo exclamativo do grego; a cidade singular permanece personificada no feminino.
