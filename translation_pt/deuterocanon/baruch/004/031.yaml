lexical_decisions:
- source_word: δείλαιοι
  choice: Infelizes
  rationale: Expressa a condição miserável e digna de lamento dos inimigos, preservando o tom de desgraça sem transformar o adjetivo numa maldição formal.
- source_word: οἱ σε κακώσαντες
  choice: os que lhe fizeram mal
  rationale: Traduz de modo natural e abrangente o particípio de κακόω, sem restringir o dano a violência física.
- source_word: ἐπιχαρέντες
  choice: se alegraram
  rationale: Corresponde diretamente ao particípio grego; o caráter hostil da alegria fica claro pelo complemento «com a sua queda».
- source_word: τῇ σῇ πτώσει
  choice: com a sua queda
  rationale: Mantém a metáfora de πτῶσις e refere-se naturalmente à ruína de Jerusalém, aqui personificada e tratada na terceira pessoa de cortesia em português.
