base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/025.yaml
  text: Children[a], endure patiently the wrath that has come upon you from God. The enemy pursued you, but you will soon see his destruction, and you will step upon their necks.
translation:
  language: pt
  text: Filhos, suportem com paciência a ira que veio sobre vocês da parte de Deus. O inimigo perseguiu vocês, e logo cada um de vocês verá a destruição dele[a] e pisará sobre os pescoços deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “a destruição dele” e depois “os pescoços deles”, passando do singular para o plural ao se referir ao inimigo. Também usa o singular em “verá” e “pisará”, embora antes se dirija aos “filhos” no plural. Essas mudanças podem apresentar o inimigo como um só adversário e como uma força coletiva, e aplicar a promessa a cada integrante do grupo.
    reason: 'Preserva e explica as alternâncias gramaticais genuínas do grego: o inimigo no singular e plural, bem como os futuros singulares após o vocativo plural.'
lexical_decisions:
- source_word: τέκνα
  choice: Filhos
  rationale: Vocativo plural afetuoso de τέκνον. “Filhos” é natural em português e não acrescenta o possessivo “meus”, ausente no grego.
- source_word: μακροθυμήσατε
  choice: suportem com paciência
  rationale: O imperativo pede perseverança paciente diante da aflição; a expressão comunica tanto resistência quanto paciência.
- source_word: ὀργήν
  choice: ira
  rationale: No contexto da ação divina, “ira” conserva o peso judicial e teológico do termo sem reduzi-lo a mero desagrado.
- source_word: τὴν παρὰ τοῦ θεοῦ ἐπελθοῦσαν ὑμῖν
  choice: que veio sobre vocês da parte de Deus
  rationale: Preserva explicitamente a origem divina indicada por παρὰ τοῦ θεοῦ e a imagem de algo que sobreveio aos destinatários.
- source_word: κατεδίωξέν
  choice: perseguiu
  rationale: Expressa perseguição hostil de modo amplo e natural, adequado ao contexto de opressão inimiga.
- source_word: ὄψει
  choice: vocês verão
  rationale: Embora a forma grega seja singular, o referente continua sendo o grupo chamado de “filhos”; o plural é necessário no português corrente com “vocês”.
- source_word: ἀπώλειαν
  choice: destruição
  rationale: Mantém a força do termo para a ruína ou aniquilação do inimigo.
- source_word: ἐν τάχει
  choice: logo
  rationale: Equivalente idiomático claro para a ideia de proximidade temporal.
- source_word: ἐπὶ τραχήλους αὐτῶν ἐπιβήσῃ
  choice: pisarão sobre o pescoço deles
  rationale: Conserva a imagem concreta de vitória sobre inimigos derrotados. O singular coletivo “pescoço” soa natural e corresponde ao plural grego em sentido distributivo.
theological_decisions:
- issue: Agência divina no sofrimento do povo
  choice: “a ira que veio sobre vocês da parte de Deus”
  alternative: “o castigo que veio sobre vocês”
  rationale: O grego atribui expressamente a Deus a procedência da ira. A tradução mantém essa tensão e não interpreta ὀργή como “castigo”.
- issue: Imagem de vitória sobre os inimigos
  choice: “pisarão sobre o pescoço deles”
  alternative: “triunfarão sobre eles”
  rationale: A formulação retém a imagem corporal e militar do grego, em vez de substituí-la por uma abstração.
- issue: Alternância entre inimigo singular e referente plural
  choice: “a destruição dele ... o pescoço deles”
  alternative: uniformizar tudo no singular ou no plural
  rationale: O texto grego passa de αὐτοῦ, singular, para αὐτῶν, plural. A tradução preserva essa mudança, permitindo que o inimigo seja percebido simultaneamente como adversário singular e força coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “vocês” para o destinatário plural e mantém as imagens fortes e a tensão teológica do original.
