  text: And they carried away the widow’s beloved ones[a], and from among her daughters they left her desolate and alone.
translation:
  language: pt
  text: E levaram os entes queridos da viúva e a deixaram desolada e sozinha, separada de suas filhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «e, dentre as filhas dela, desolaram a única». O grego τὴν μόνην («a única») é sintaticamente difícil; no contexto, também pode descrever a viúva como deixada sozinha.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: ἀπήγαγον
  choice: levaram
  rationale: Expressa a retirada de pessoas, possivelmente para o cativeiro, sem especificar além do que o verbo grego afirma.
- source_word: τοὺς ἀγαπητοὺς
  choice: os entes queridos
  rationale: O adjetivo substantivado designa pessoas amadas; esta expressão é natural em português e preserva a força afetiva e o plural.
- source_word: τῆς χήρας
  choice: da viúva
  rationale: Mantém a relação genitiva e preserva a personificação poética, sem substituir a viúva por Jerusalém ou Sião.
- source_word: ἀπὸ τῶν θυγατέρων
  choice: dentre as filhas dela
  rationale: Representa o sentido de separação em relação ao grupo e torna explícito, de modo natural, que as filhas pertencem à viúva personificada.
- source_word: τὴν μόνην
  choice: sozinha
  rationale: Traduz de modo idiomático a condição resultante de isolamento, embora a expressão grega também possa ser entendida mais literalmente como «a única».
- source_word: ἠρήμωσαν
  choice: deixaram-na desolada
  rationale: Comunica o estado resultante de privação e abandono preservando a intensidade do verbo grego.
theological_decisions:
- issue: Personificação da viúva e de suas filhas
  choice: Manter diretamente a imagem familiar da viúva com filhas.
  alternative: Identificar a viúva explicitamente como Jerusalém ou Sião no texto principal.
  rationale: O grego emprega personificação poética; explicitar o referente no corpo do versículo resolveria interpretativamente uma imagem que o texto mantém figurada.
- issue: Referência de τὴν μόνην e relação com ἀπὸ τῶν θυγατέρων
  choice: Entender a viúva como aquela que foi deixada desolada e sozinha, separada de suas filhas.
  alternative: Entender a expressão mais literalmente como «a única» deixada dentre suas filhas.
  rationale: A leitura escolhida produz uma construção portuguesa coerente com a imagem de viuvez e privação, mas a sintaxe grega admite uma formulação alternativa, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. «Entes queridos» preserva o afeto do original sem soar arcaico; «dela» evita possível confusão de referente. A ambiguidade de τὴν μόνην é mantida por meio da nota.
