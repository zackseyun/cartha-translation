base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/009.yaml
  text: 'For he saw the wrath that came upon you from God[a], and he said, “Hear, you neighbors of Zion: God has brought upon me great mourning.”'
translation:
  language: pt
  text: 'Pois ela viu a ira que veio sobre vocês da parte de Deus e disse: “Ouçam, vizinhos de Sião[a]: Deus trouxe sobre mim grande luto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estrangeiros residentes em Sião”, “moradores junto de Sião” ou “habitantes próximos de Sião”. O termo grego pode designar quem vive perto de um lugar ou nele reside sem pertencer à população nativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: ela viu
  rationale: O sujeito implícito é Sião, personificada no contexto; o pretérito perfeito preserva a sequência narrativa e o sentido direto do verbo.
- source_word: ἐπελθοῦσαν
  choice: que veio sobre
  rationale: Expressa a ira que alcançou o povo, sem enfraquecer a imagem de algo que sobreveio a eles.
- source_word: ὀργὴν
  choice: ira
  rationale: “Ira” mantém a gravidade do juízo divino e corresponde naturalmente ao termo grego neste contexto.
- source_word: παρὰ τοῦ θεοῦ
  choice: da parte de Deus
  rationale: Marca com clareza a origem divina da ira, de modo idiomático em português.
- source_word: Ἀκούσατε
  choice: Escutem
  rationale: Imperativo natural e atual que conserva a força da convocação pública.
- source_word: οἱ πάροικοι Σειών
  choice: habitantes próximos de Sião
  rationale: Preserva a ideia espacial de pessoas que moram junto de Sião, sem reduzi-las simplesmente a habitantes da própria cidade; a nota registra outras nuances possíveis.
- source_word: ἐπήγαγέ μοι
  choice: trouxe sobre mim
  rationale: Conserva a agência explícita de Deus e a imagem de uma aflição imposta ou feita recair sobre a personificação de Sião.
- source_word: πένθος μέγα
  choice: grande luto
  rationale: Mantém o caráter manifesto e lamentoso de πένθος, em vez de tratá-lo apenas como um sentimento interior.
theological_decisions:
- issue: Agência divina na calamidade
  choice: A ira vem da parte de Deus, e Deus traz grande luto sobre Sião personificada.
  alternative: Suavizar a formulação, apresentando a calamidade de maneira mais impessoal.
  rationale: O grego atribui explicitamente a Deus tanto a origem da ira quanto a chegada do luto; a tradução preserva essa tensão teológica sem mitigá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Habitantes próximos de Sião” é um pouco mais explícito que o grego, mas evita a possível leitura equivocada de que se trata simplesmente dos habitantes nativos de Sião. O feminino “ela” explicita o referente contextual, Sião personificada.
