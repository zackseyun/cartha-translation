  text: You forgot the eternal God who nourished you; you also grieved Jerusalem, who reared you.
translation:
  language: pt
  text: Vocês se esqueceram do Deus eterno, que os nutriu, e entristeceram também Jerusalém, que os criou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάθεσθε
  choice: Vocês se esqueceram
  rationale: O aoristo médio de ἐπιλανθάνομαι expressa esquecer-se de alguém. A forma pronominal é natural em português e conserva o tom de acusação.
- source_word: τὸν τροφεύσαντα ὑμᾶς
  choice: que os nutriu
  rationale: τροφεύω abrange alimentar, sustentar e cuidar durante o crescimento. “Nutriu” preserva a imagem de cuidado sem limitá-la à alimentação física.
- source_word: θεὸν αἰώνιον
  choice: Deus eterno
  rationale: A expressão atribui a Deus a qualidade de eterno. Esta formulação é clara, corrente e teologicamente não restritiva.
- source_word: ἐλυπήσατε
  choice: entristeceram
  rationale: λυπέω significa causar tristeza ou pesar. “Entristeceram” comunica diretamente a ação dirigida a Jerusalém personificada.
- source_word: δὴ καὶ
  choice: também
  rationale: καί acrescenta Jerusalém ao objeto da acusação, enquanto δὴ lhe dá certa ênfase. “Também”, em posição pós-verbal, transmite a força aditiva com naturalidade.
- source_word: τὴν ἐκθρέψασαν ὑμᾶς
  choice: que os criou
  rationale: ἐκτρέφω significa criar, sustentar durante o crescimento ou educar. “Criou” conserva a imagem maternal e distingue esta ação de “nutriu”.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Mantém-se o nome próprio tradicional em português e sua personificação no contexto.
theological_decisions:
- issue: Personificação de Jerusalém como cuidadora maternal
  choice: Jerusalém, que os criou
  alternative: Jerusalém, sua mãe, que os criou
  rationale: O particípio feminino apresenta Jerusalém como figura pessoal e maternal, mas o grego não traz explicitamente a palavra “mãe”; por isso, a imagem é preservada sem acréscimo interpretativo.
- issue: Sentido do epíteto divino αἰώνιον
  choice: Deus eterno
  alternative: Deus para sempre
  rationale: “Eterno” reproduz diretamente o atributo expresso pelo grego e é uma formulação natural no português contemporâneo.
translation_notes:
  register: Português moderno, claro e digno, com plural explícito em “vocês”. A combinação “nutriu/criou” preserva o paralelismo entre o cuidado de Deus e o de Jerusalém, sem apagar a diferença lexical entre os dois verbos gregos.
