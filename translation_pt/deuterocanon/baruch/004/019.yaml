  language: en
  yaml_path: translation/deuterocanon/baruch/004/019.yaml
  text: Go[a], children, go[b], for I have been left desolate.
translation:
  language: pt
  text: Vão[a], filhos, vão, pois fui deixada desolada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Caminhem, filhos, caminhem»; o verbo grego significa literalmente «caminhar», mas aqui funciona como uma ordem urgente para partir.
    reason: lexical_alternative
  - marker: b
    text: Ou «sozinha» ou «deserta».
    reason: lexical_alternative
lexical_decisions:
- source_word: βαδίζετε
  choice: Vão
  rationale: Embora βαδίζω signifique literalmente «caminhar», o imperativo repetido, neste contexto de despedida e partida, é expresso de modo natural por «Vão». A repetição foi preservada para manter a urgência e a ênfase.
- source_word: τέκνα
  choice: filhos
  rationale: τέκνα é um termo familiar abrangente para os descendentes ou filhos, sem limitar a referência ao sexo masculino. «Filhos» conserva adequadamente o tratamento materno no contexto, sem acrescentar o possessivo «meus», ausente do grego.
- source_word: κατελείφθην
  choice: fui deixada
  rationale: O aoristo passivo indica que a personagem que fala foi deixada para trás. «Fui deixada» preserva a voz passiva e evita intensificar o verbo como «fui abandonada».
- source_word: ἔρημος
  choice: desolada
  rationale: ἔρημος pode comunicar solidão, abandono e condição deserta ou devastada. «Desolada» mantém essa amplitude e a força emotiva do lamento. O feminino concorda com a voz personificada de Jerusalém no contexto.
theological_decisions:
- issue: Força emocional e alcance da condição da personagem que fala
  choice: fui deixada desolada
  alternative: fui deixada sozinha; fui deixada deserta; fui abandonada
  rationale: «Desolada» conserva tanto a solidão quanto o estado de devastação sugeridos por ἔρημος, sem transformar κατελείφθην no mais forte «fui abandonada». Assim, a tradução preserva a tensão poética sem impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira e compreensão internacional. A ordem «Vão, filhos, vão» mantém a concisão e a repetição enfática do grego; não se acrescentou «meus», embora fosse idiomático, porque não aparece no texto-fonte.
