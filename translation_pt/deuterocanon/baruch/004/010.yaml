base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/010.yaml
  text: For behold[a], the captivity of my sons and daughters[b], which the Everlasting One brought upon them.
translation:
  language: pt
  text: Pois vejam o cativeiro[a] dos meus filhos e das minhas filhas, que o Eterno[b] trouxe sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o exílio”. A palavra grega pode indicar o cativeiro em sentido amplo, incluindo a deportação para o exílio.
    reason: lexical_alternative
  - marker: b
    text: Ou “Aquele que é eterno”. O grego traz um título divino que significa literalmente “o eterno” ou “aquele que dura para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: vejam
  rationale: Partícula que chama a atenção dos ouvintes. “Vejam” é corrente e digna em português, sem recorrer ao arcaizante “eis”.
- source_word: γὰρ
  choice: pois
  rationale: Preserva a ligação explicativa com o contexto anterior.
- source_word: τὴν αἰχμαλωσίαν
  choice: o cativeiro
  rationale: Expressa a condição resultante de conquista e captura, mantendo mais explicitamente que “exílio” a ideia de remoção forçada.
- source_word: τῶν υἱῶν μου καὶ τῶν θυγατέρων
  choice: dos meus filhos e das minhas filhas
  rationale: Mantém os dois grupos explicitamente nomeados no grego, sem reduzi-los ao termo coletivo “filhos” ou “crianças”.
- source_word: ἣν
  choice: que
  rationale: Pronome relativo que retoma naturalmente “o cativeiro”.
- source_word: ἐπήγαγεν
  choice: trouxe sobre
  rationale: Conserva a força causativa de ἐπάγω e a ideia de algo que veio sobre as pessoas afetadas.
- source_word: ὁ αἰώνιος
  choice: o Eterno
  rationale: Reproduz o título divino substantivado sem acrescentar “Deus” nem normalizá-lo como “Senhor”.
theological_decisions:
- issue: Tradução do título divino ὁ αἰώνιος
  choice: o Eterno
  alternative: Aquele que é eterno; o Perpétuo; o Deus eterno
  rationale: O grego emprega um título divino substantivado, não κύριος nem θεός. “O Eterno” preserva essa distinção de modo natural em português e sem inserir um substantivo ausente.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Vejam” funciona como chamado direto de atenção; a repetição “meus filhos e minhas filhas” preserva a formulação inclusiva e enfática do grego.
