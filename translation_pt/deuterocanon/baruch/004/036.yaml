translation:
  language: pt
  text: Olhe para o leste, Jerusalém, e veja a alegria que vem de Deus até você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίβλεψαι
  choice: Olhe para
  rationale: O imperativo aoristo médio dirige o olhar de Jerusalém para uma direção específica. «Olhe para» é natural em português e preserva a força exortativa sem exagerar o valor do prefixo.
- source_word: πρὸς ἀνατολάς
  choice: para o leste
  rationale: Embora ἀνατολαί possa significar literalmente «nascimentos» ou «nascer do sol», aqui predomina o sentido direcional. «Para o leste» é claro e idiomático.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma consagrada do nome em português, mantida como vocativo na personificação da cidade.
- source_word: ἴδε
  choice: veja
  rationale: O imperativo de ὁράω é traduzido de modo direto e atual, evitando o arcaísmo «eis» ou «contempla».
- source_word: εὐφροσύνην
  choice: a alegria
  rationale: εὐφροσύνη expressa alegria ou júbilo; «alegria» é a opção mais simples, ampla e natural.
- source_word: τὴν παρὰ τοῦ θεοῦ
  choice: que vem de Deus
  rationale: παρά com o genitivo indica origem. A formulação integra naturalmente essa origem ao particípio ἐρχομένην.
- source_word: σοι
  choice: até você
  rationale: O dativo refere-se à Jerusalém personificada. «Até você» explicita de modo idiomático o destino do movimento indicado por ἐρχομένην.
- source_word: ἐρχομένην
  choice: vem
  rationale: O particípio presente descreve a alegria em movimento rumo a Jerusalém. «Que vem» preserva a ideia de aproximação com fluidez em português.
theological_decisions:
- issue: Personificação de Jerusalém
  choice: Manter a interpelação direta a Jerusalém como cidade personificada
  alternative: Converter a frase em uma afirmação indireta sobre a cidade ou acrescentar «ó Jerusalém»
  rationale: O grego dirige dois imperativos diretamente a Jerusalém. A manutenção do vocativo preserva a força poética e profética sem acrescentar uma interjeição ausente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém os imperativos e a personificação, sem arcaísmos nem explicitação doutrinária.
