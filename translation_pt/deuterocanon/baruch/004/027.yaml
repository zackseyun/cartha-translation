base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/027.yaml
  text: Take courage[a], children, and cry out to God, for you will be remembered by the one who brought this upon you.
translation:
  language: pt
  text: Tenham coragem, filhos, e clamem a Deus, pois vocês serão lembrados por aquele que trouxe isso sobre vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “pois haverá lembrança de vocês por parte daquele que trouxe isso sobre vocês”.'
    reason: A nota registra a construção nominal do grego, que o texto principal verte por uma passiva idiomática.
lexical_decisions:
- source_word: Θαρρήσατε
  choice: Tenham coragem
  rationale: O imperativo plural exorta os destinatários a recobrar ânimo e agir com coragem; a expressão é atual, clara e preserva a força exortativa.
- source_word: τέκνα
  choice: filhos
  rationale: O vocativo plural designa os membros do povo como filhos. Em português, “filhos” é a forma natural de tratamento coletivo neste contexto e não restringe a referência apenas aos homens.
- source_word: βοήσατε
  choice: clamem
  rationale: O verbo indica um grito ou apelo intenso. “Clamem” comunica tanto a força do pedido quanto sua direção religiosa, sem exigir a adição de “em alta voz”.
- source_word: πρὸς τὸν θεόν
  choice: a Deus
  rationale: Depois de um verbo de clamor ou apelo, a construção direcional grega corresponde naturalmente a “clamar a Deus”.
- source_word: ἔσται ... ὑμῶν ... μνεία
  choice: vocês serão lembrados
  rationale: A construção significa literalmente que haverá lembrança deles. A formulação passiva é idiomática em português e mantém a promessa futura.
- source_word: ὑπὸ τοῦ ἐπάγοντος
  choice: por aquele que trouxe isso sobre vocês
  rationale: O particípio substantivado identifica o agente que fez sobrevir a calamidade, sem nomeá-lo novamente. “Isso” explicita apenas o objeto implícito exigido pelo português, remetendo à aflição do contexto.
theological_decisions:
- issue: Identidade daquele que trouxe a calamidade
  choice: 'Manter a referência indireta: “aquele que trouxe isso sobre vocês”'
  alternative: Explicitar “Deus” como o agente do juízo e da lembrança
  rationale: O contexto aponta para Deus, já mencionado na oração anterior, mas o grego usa uma designação indireta. A tradução preserva tanto a conexão contextual quanto a tensão formal do texto, sem substituir o particípio por uma identificação explícita.
- issue: Sentido de “lembrança”
  choice: “vocês serão lembrados”
  alternative: “haverá menção de vocês”
  rationale: Neste contexto, “lembrar” expressa de modo natural a futura atenção daquele que trouxe o juízo, sem especificar além do texto como essa lembrança se manifestará.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O plural “vocês” evita regionalismo excessivo; “clamem” conserva o tom solene e suplicante. A referência indireta ao agente da calamidade foi mantida.
