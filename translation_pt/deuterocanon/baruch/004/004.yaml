base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/004.yaml
  text: We are blessed[a], O Israel[b], because what is pleasing to God is known to us.
translation:
  language: pt
  text: Somos bem-aventurados[a], ó Israel, porque aquilo que agrada a Deus nos é conhecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «felizes» ou «afortunados»; o grego descreve uma condição privilegiada de felicidade e favor.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί
  choice: bem-aventurados
  rationale: Expressa uma condição de felicidade e favor privilegiado, e não apenas uma emoção passageira; mantém o tom bíblico sem acrescentar uma ação divina não explicitada.
- source_word: ἐσμεν
  choice: somos
  rationale: Reproduz diretamente o presente do verbo εἰμί e preserva a ênfase coletiva.
- source_word: Ἰσραήλ
  choice: ó Israel
  rationale: A interjeição «ó» torna explícito em português que Israel está sendo diretamente interpelado.
- source_word: τὰ ἀρεστὰ τοῦ θεοῦ
  choice: aquilo que agrada a Deus
  rationale: Verte de modo natural o substantivo neutro plural e sua relação com Deus, sem restringir o sentido à Lei ou a mandamentos específicos.
- source_word: ἡμῖν γνωστά ἐστιν
  choice: é conhecido por nós
  rationale: Preserva a ideia de que esse conteúdo está ao alcance do conhecimento de Israel, sem acrescentar a noção de que foi revelado ou dado a conhecer, que não está expressa no grego.
theological_decisions:
- issue: Natureza do privilégio de Israel
  choice: Israel é bem-aventurado porque conhece aquilo que agrada a Deus.
  alternative: Israel é bem-aventurado especificamente por conhecer a Lei de Deus.
  rationale: Embora o contexto possa evocar a Torá e a instrução da aliança, o grego emprega uma formulação mais ampla. A tradução conserva essa amplitude e não identifica explicitamente «aquilo que agrada a Deus» com a Lei.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. «Bem-aventurados» preserva o peso bíblico de μακάριοι; «aquilo que agrada a Deus» evita uma construção excessivamente literal e mantém a amplitude semântica do original.
