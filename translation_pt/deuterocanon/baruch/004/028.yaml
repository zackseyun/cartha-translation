base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/028.yaml
  text: For just as your mind was set on going astray from God[a], so, as you return, seek him ten times more.
translation:
  language: pt
  text: Pois, assim como a mente de vocês se voltou para se desviar de Deus, ao retornarem, busquem-no dez vezes mais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao retornarem para buscá-lo, multipliquem isso por dez”. O grego diz literalmente “multipliquem por dez, retornando para buscá-lo”, deixando implícito pelo contexto aquilo que deve ser intensificado.'
    reason: A construção com δεκαπλασιάσατε é elíptica e admite mais de uma forma de relacionar a intensificação com o retorno e a busca de Deus.
lexical_decisions:
- source_word: διάνοια
  choice: mente
  rationale: O termo designa a mente, o entendimento ou a disposição interior. “Mente” é claro e preserva o foco na orientação interior do povo.
- source_word: ἐγένετο ... εἰς τὸ πλανηθῆναι
  choice: se voltou para se desviar
  rationale: A construção indica que a disposição interior passou a orientar-se para o afastamento. A formulação comunica esse movimento de modo natural sem transformar a frase numa decisão pontual e explícita.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: de Deus
  rationale: A preposição ἀπό expressa separação; com “desviar-se”, “de Deus” transmite naturalmente a ideia.
- source_word: δεκαπλασιάσατε
  choice: busquem-no dez vezes mais
  rationale: O verbo significa literalmente “tornar dez vezes maior” ou “multiplicar por dez”. Como o objeto está implícito e o contexto imediato fala de buscar Deus, a tradução explicita aquilo que deve ser intensificado.
- source_word: ἐπιστρέφοντες
  choice: ao retornarem
  rationale: O particípio apresenta o retorno como circunstância concomitante à ordem de buscar Deus e preserva o motivo de voltar-se novamente para ele.
- source_word: ζητῆσαι αὐτόν
  choice: busquem-no
  rationale: ζητέω, neste contexto religioso, significa buscar a Deus; o pronome retoma Deus sem ambiguidade.
theological_decisions:
- issue: Relação de δεκαπλασιάσατε com o retorno e a busca de Deus
  choice: 'Entender a ordem como intensificação da busca: “busquem-no dez vezes mais”.'
  alternative: “Ao retornarem para buscá-lo, multipliquem isso por dez.”
  rationale: O grego deixa implícito o objeto de “multiplicar por dez”. A tradução principal explicita a busca indicada por ζητῆσαι, sem acrescentar uma definição doutrinária sobre penitência, mérito ou grau de arrependimento.
- issue: Grau de intenção expresso pela primeira oração
  choice: “A mente de vocês se voltou para se desviar”
  alternative: “Vocês decidiram desviar-se”
  rationale: A opção escolhida conserva a referência à disposição interior e evita converter a construção grega numa decisão deliberada mais explícita do que o texto exige.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “vocês”. “Ao retornarem” mantém o tema de voltar-se para Deus; “busquem-no” conserva um tom religioso natural sem arcaísmo excessivo.
