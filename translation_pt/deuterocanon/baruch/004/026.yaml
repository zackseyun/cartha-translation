  text: My pampered ones traveled rough roads[a]; they were carried off like a flock seized by enemies.
translation:
  language: pt
  text: Os meus, habituados ao conforto[a], percorreram caminhos ásperos; foram levados como um rebanho arrebatado por inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus delicados” ou “meus tenros”. O termo grego descreve pessoas habituadas à delicadeza ou ao conforto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ τρυφεροί μου
  choice: Os meus, criados no conforto
  rationale: A expressão grega descreve pessoas marcadas por delicadeza, vida branda ou criação confortável. A formulação portuguesa conserva o contraste entre a condição anterior e o sofrimento presente, sem o tom necessariamente censurador de “mimados”.
- source_word: ἐπορεύθησαν
  choice: percorreram
  rationale: O verbo significa ir ou viajar; “percorreram” combina naturalmente com caminhos e mantém a imagem concreta do deslocamento.
- source_word: ὁδοὺς τραχείας
  choice: caminhos ásperos
  rationale: Mantém os sentidos concretos de ὁδός, “caminho”, e τραχύς, “áspero, acidentado”, evocando uma jornada penosa sem explicitar além do texto.
- source_word: ἤρθησαν
  choice: foram levados
  rationale: O passivo de αἴρω indica aqui remoção sofrida pelos personagens. “Foram levados” preserva a voz passiva e, no contexto, sugere a retirada forçada sem duplicar a intensidade de ἡρπασμένον.
- source_word: ὡς ποίμνιον
  choice: como um rebanho
  rationale: Equivalente natural de ποίμνιον; não se enfatiza a possível nuance diminutiva, que não é necessária ao sentido contextual.
- source_word: ἡρπασμένον
  choice: arrebatado
  rationale: Expressa a tomada súbita e violenta indicada por ἁρπάζω, em registro digno e compreensível.
- source_word: ὑπὸ ἐχθρῶν
  choice: por inimigos
  rationale: Reproduz diretamente o plural grego e evita restringir a referência a um único inimigo.
theological_decisions:
- issue: Força metafórica da imagem do rebanho
  choice: Manter a comparação de pessoas vulneráveis com um rebanho arrebatado por inimigos.
  alternative: Explicitar que se trata do exílio ou do cativeiro.
  rationale: O grego apresenta uma comparação e uma remoção violenta, mas não nomeia diretamente o acontecimento nesta frase. A tradução preserva a imagem e não transforma a implicação contextual em explicação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. “Os meus” preserva a forma substantivada e afetiva do grego sem acrescentar “filhos”, enquanto a expressão explicativa evita a possível conotação pejorativa de “mimados”.
