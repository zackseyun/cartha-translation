  text: Tenham coragem, meu povo, o memorial[a] de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lembrança”. O termo grego pode indicar um memorial ou aquilo que mantém viva a lembrança.
