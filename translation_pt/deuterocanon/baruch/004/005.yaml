lexical_decisions:
- source_word: Θαρσεῖτε
  choice: Tenham coragem
  rationale: O imperativo plural de θαρσέω exorta diretamente os destinatários a recobrar ânimo e confiança. “Tenham coragem” é natural em português moderno e conserva o número plural do grego.
- source_word: λαός μου
  choice: meu povo
  rationale: Tradução direta que preserva o sentido comunitário e pactual, sem acrescentar uma interjeição ausente do grego.
- source_word: μνημόσυνον
  choice: memorial
  rationale: O substantivo pode indicar tanto um memorial quanto a lembrança ou recordação. “Memorial” mantém sua força nominal concreta e a metáfora não explicada do texto.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Forma consagrada do nome próprio em português.
theological_decisions:
- issue: Sentido da expressão apositiva μνημόσυνον Ἰσραήλ
  choice: 'Tratá-la como segunda designação vocativa/apositiva: “meu povo, memorial de Israel”'
  alternative: “meu povo, lembrança de Israel”
  rationale: O grego apresenta uma expressão nominal sem verbo após “meu povo”. A tradução preserva a metáfora e sua tensão, sem explicá-la como “os que Israel recorda” ou “o remanescente de Israel”.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O plural “tenham” segue a forma grega, embora “meu povo” seja gramaticalmente singular em português. A formulação incomum “memorial de Israel” foi mantida para não eliminar a ambiguidade da aposição.
