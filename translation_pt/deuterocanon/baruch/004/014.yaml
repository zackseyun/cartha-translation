base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/014.yaml
  text: Let the neighboring women of Zion come, let the neighboring women come, and remember the captivity of my sons and daughters, which the Eternal One brought upon them.
translation:
  language: pt
  text: Venham as vizinhas[a], venham as vizinhas de Sião[b], e lembrem-se do cativeiro dos meus filhos e das minhas filhas, que o Eterno trouxe sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as residentes estrangeiras”, “as peregrinas” ou “as que moram nas proximidades”. O termo grego πάροικοι pode designar tanto vizinhas como pessoas que vivem em terra alheia.
    reason: lexical_alternative
  - marker: b
    text: O texto grego repete a convocação “venham as vizinhas”, dando-lhe ênfase.
    reason: textual_feature
lexical_decisions:
- source_word: ἐλθάτωσαν
  choice: Venham
  rationale: O imperativo aoristo na terceira pessoa do plural tem aqui força de convocação; “Venham” é direto e natural em português.
- source_word: αἱ πάροικοι
  choice: as vizinhas
  rationale: O artigo e a forma no feminino plural pedem uma referência feminina. πάροικος pode indicar quem mora nas proximidades ou quem reside como estrangeiro; no contexto, “as vizinhas” oferece a leitura mais natural, sem ocultar as alternativas, registradas em nota.
- source_word: Σειών
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: μνήσθητε
  choice: lembrem-se
  rationale: Reproduz de modo claro e corrente o imperativo aoristo de μιμνῄσκομαι.
- source_word: τὴν αἰχμαλωσίαν
  choice: do cativeiro
  rationale: αἰχμαλωσία designa a condição de quem foi capturado, especialmente em contexto de guerra; “cativeiro” preserva essa concretude melhor que “exílio”.
- source_word: τῶν υἱῶν μου καὶ θυγατέρων
  choice: dos meus filhos e das minhas filhas
  rationale: Mantém expressamente os dois grupos nomeados no grego, sem reduzi-los ao termo genérico “filhos” ou “crianças”.
- source_word: ὁ αἰώνιος
  choice: o Eterno
  rationale: O adjetivo substantivado funciona como título divino. “O Eterno” é uma formulação portuguesa clara, digna e tradicional, sem substituir o título por um nome divino ausente do grego.
- source_word: ἐπήγαγεν αὐτοῖς
  choice: trouxe sobre eles
  rationale: Preserva a construção segundo a qual o Eterno fez o cativeiro vir sobre eles, evitando o sentido mais forte e interpretativo de “infligiu”.
theological_decisions:
- issue: Título divino ὁ αἰώνιος
  choice: o Eterno
  alternative: Aquele que é eterno; o Perpétuo
  rationale: O texto emprega um epíteto divino, não um nome próprio. “O Eterno” conserva o peso do título e não introduz linguagem pactual ausente do original.
- issue: Sentido contextual de αἱ πάροικοι
  choice: as vizinhas
  alternative: as residentes estrangeiras; as peregrinas
  rationale: A forma feminina plural e a convocação ligada a Sião favorecem a referência a mulheres vizinhas, mas a amplitude lexical do termo é preservada em nota, sem resolver silenciosamente a ambiguidade.
- issue: Agência divina no cativeiro
  choice: que o Eterno trouxe sobre eles
  alternative: que lhes sobreveio por ação do Eterno
  rationale: A tradução mantém a afirmação explícita do texto de que o Eterno trouxe o cativeiro sobre os filhos e as filhas, sem suavizar nem intensificar a tensão teológica.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das duas convocações segue o grego: primeiro “as vizinhas” e depois “as vizinhas de Sião”. O feminino plural é mantido explicitamente. A repetição enfática do original foi preservada, assim como a formulação direta da agência divina.'
