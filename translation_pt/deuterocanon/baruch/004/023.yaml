  text: For I sent you out with mourning and weeping[a], but God will give you back to me with joy and gladness forever.
translation:
  language: pt
  text: Pois eu mandei vocês embora com luto e choro, mas Deus os devolverá a mim[a] com alegria e júbilo para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os restituirá a mim”. O verbo grego pode significar “devolver” ou “restituir”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐξέπεμψα
  choice: mandei vocês embora
  rationale: O verbo ἐκπέμπω indica mandar para fora ou para longe. “Mandei vocês embora” comunica a separação com naturalidade, sem acrescentar a ideia técnica de banimento.
- source_word: μετὰ πένθους καὶ κλαυθμοῦ
  choice: com luto e choro
  rationale: 'A expressão mantém os dois substantivos gregos: πένθος como luto ou pesar e κλαυθμός como choro, preservando o paralelismo.'
- source_word: ἀποδώσει ... ὑμᾶς ... μοι
  choice: os devolverá a mim
  rationale: ἀποδίδωμι pode significar dar de volta, devolver ou restituir. A formulação conserva tanto o objeto “vocês” quanto o dativo μοι, “a mim”, importante para a imagem de Jerusalém como mãe.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: “Deus” é a forma idiomática em português; não há nome divino específico no grego.
- source_word: μετὰ χαρμοσύνης καὶ εὐφροσύνης
  choice: com alegria e júbilo
  rationale: Os dois termos semanticamente próximos são mantidos para reproduzir a intensificação do original. “Júbilo” expressa a alegria manifesta de εὐφροσύνη sem tornar a frase obscura.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: A expressão idiomática indica duração permanente neste contexto e é vertida de modo claro e atual.
theological_decisions:
- issue: Identidade da voz e enquadramento relacional
  choice: Manter “a mim”, apresentando Deus como aquele que devolve os filhos à figura materna de Jerusalém.
  alternative: Generalizar como “Deus restaurará vocês”, sem referência explícita à pessoa que fala.
  rationale: O grego traz explicitamente μοι, “a mim”, e o contexto personifica Jerusalém como mãe. O texto preserva essa relação familiar e comunitária sem substituir a imagem por uma restauração impessoal.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade brasileira e ampla compreensão internacional. O paralelismo emocional do grego foi preservado, assim como a personificação materna de Jerusalém.
