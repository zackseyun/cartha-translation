  terminology: “Desavergonhada” preserva o valor lexical de ἀναιδές sem antecipar a crueldade que o verso expressa na oração seguinte. “De língua estrangeira” transmite adequadamente ἀλλόγλωσσον, e a nota oferece a alternativa literal relevante. “Idoso” e “criança” são escolhas claras para os singulares gregos e não estreitam indevidamente παιδίον.
