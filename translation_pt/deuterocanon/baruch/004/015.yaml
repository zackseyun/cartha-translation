  source_fidelity: A tradução preserva com precisão a relação causal de γάρ (“Pois”), o sentido hostil de ἐπήγαγεν ἐπʼ αὐτούς (“trouxe contra eles”), a repetição enfática de ἔθνος, a distância de μακρόθεν e as duas caracterizações da nação. “Não respeitou o idoso” comunica adequadamente a falta de deferência expressa por οὐκ ᾐσχύνθησαν πρεσβύτην, e “nem teve compaixão da criança” traduz fielmente οὐδὲ παιδίον ἠλέησαν. Os singulares representativos foram preservados.
