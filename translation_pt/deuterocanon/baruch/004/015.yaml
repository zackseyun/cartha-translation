base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/015.yaml
  text: For he brought against them a nation from far away[a], a shameless and foreign-speaking nation, which showed no respect for the old man and had no mercy on the child[b],
translation:
  language: pt
  text: Pois ele trouxe contra eles uma nação de longe, uma nação desavergonhada e de língua estrangeira[a], que não respeitou o idoso nem teve compaixão da criança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de outra língua”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “o idoso” e “a criança”, no singular, como figuras representativas das pessoas vulneráveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπήγαγεν ... ἐπʼ αὐτούς
  choice: trouxe contra eles
  rationale: Expressa a chegada de uma força hostil dirigida contra eles, sem ampliar o sentido para uma descrição explícita de ataque.
- source_word: ἔθνος μακρόθεν
  choice: uma nação de longe
  rationale: Mantém tanto a ideia de um povo estrangeiro organizado quanto a distância geográfica indicada por μακρόθεν.
- source_word: ἀναιδές
  choice: desavergonhada
  rationale: Conserva o sentido básico de falta de vergonha ou pudor; opções como “cruel” ou “impiedosa” enfatizariam consequências não expressas diretamente pelo adjetivo.
- source_word: ἀλλόγλωσσον
  choice: de língua estrangeira
  rationale: Traduz de modo natural o composto que designa quem fala outra língua, preservando a alteridade linguística.
- source_word: οὐκ ᾐσχύνθησαν πρεσβύτην
  choice: não respeitou o idoso
  rationale: Neste contexto, αἰσχύνομαι comunica ausência de deferência diante de uma pessoa idosa; “não se envergonhou do idoso” seria pouco idiomático e poderia sugerir outro sentido.
- source_word: οὐδὲ παιδίον ἠλέησαν
  choice: nem teve compaixão da criança
  rationale: Reproduz o paralelismo negativo e o sentido de não demonstrar piedade ou misericórdia à criança.
theological_decisions:
- issue: Singulares representativos para pessoas vulneráveis
  choice: o idoso ... a criança
  alternative: os idosos ... as crianças
  rationale: O grego emprega πρεσβύτην e παιδίον no singular. A tradução conserva essa forma representativa sem restringir παιδίον especificamente a um bebê.
- issue: Concordância semântica entre “nação” e os verbos gregos no plural
  choice: que não respeitou ... nem teve
  alternative: eles não respeitaram ... nem tiveram
  rationale: Embora o grego passe de ἔθνος, singular, a verbos no plural, referindo-se coletivamente aos integrantes da nação, o singular na oração relativa é mais natural em português e não altera a referência coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura repetitiva “uma nação ... uma nação” foi mantida para preservar a ênfase retórica do grego.
