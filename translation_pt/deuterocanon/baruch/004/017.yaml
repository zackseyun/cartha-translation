lexical_decisions:
- source_word: ἐγώ
  choice: eu
  rationale: O pronome explícito é preservado para manter a ênfase pessoal; a posição após «Mas» soa natural em português.
- source_word: δέ
  choice: Mas
  rationale: Marca uma transição levemente adversativa em relação ao lamento precedente, sem intensificar demais o contraste.
- source_word: τί
  choice: como
  rationale: Embora possa significar literalmente «que», nesta construção com δυνατή e o infinitivo introduz uma pergunta sobre a possibilidade ou o meio de prestar ajuda.
- source_word: δυνατή
  choice: poderei
  rationale: Expressa capacidade ou possibilidade. A forma «poderei» produz uma pergunta idiomática e digna em português, adequada ao contexto de impotência diante da situação.
- source_word: βοηθῆσαι
  choice: ajudar
  rationale: Equivalente claro e corrente para prestar auxílio, sem expansão desnecessária.
- source_word: ὑμῖν
  choice: vocês
  rationale: Torna explícito o plural do pronome grego e oferece ampla legibilidade brasileira.
