  text: Pois eu os criei com alegria, mas os mandei embora com choro e luto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθρεψα
  choice: criei
  rationale: No contexto da voz materna, τρέφω abrange alimentar, sustentar e criar. “Criei” comunica de modo natural o cuidado ao longo do crescimento, sem restringir o sentido ao ato de dar alimento.
- source_word: μετʼ εὐφροσύνης
  choice: com alegria
  rationale: εὐφροσύνη indica alegria ou contentamento. “Com alegria” preserva o valor de acompanhamento de μετά e soa natural em português.
- source_word: ἐξαπέστειλα
  choice: mandei embora
  rationale: ἐξαποστέλλω expressa enviar para fora ou para longe. “Mandei embora” preserva a separação dolorosa sugerida pelo contexto, sem acrescentar explicitamente a ideia de exílio.
- source_word: μετὰ κλαυθμοῦ
  choice: com choro
  rationale: κλαυθμός designa choro ou pranto. “Com choro” mantém o paralelismo direto com “com alegria” e é claro para leitores modernos.
- source_word: πένθους
  choice: luto
  rationale: πένθος denota pesar e luto diante de uma perda. “Luto” conserva tanto a dor profunda quanto sua possível expressão pública.
theological_decisions:
- issue: Voz materna da oradora e contexto do exílio
  choice: Manter os verbos na primeira pessoa e não explicitar o exílio no texto.
  alternative: Acrescentar uma referência explícita ao exílio ou identificar a oradora.
  rationale: O grego apresenta diretamente o contraste emocional entre criar com alegria e mandar embora com choro e luto, mas não menciona o exílio neste versículo. A tradução conserva essa tensão sem inserir explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo “com alegria” / “com choro e luto” reproduz a estrutura retórica do grego.
