base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/001.yaml
  text: This is the book of the commandments of God[a], and the law that endures forever; all who hold fast to it are for life, but those who forsake it will die.
translation:
  language: pt
  text: Este é o livro dos mandamentos de Deus e a lei que permanece para sempre. Todos os que se apegam a ela viverão[a], mas os que a abandonam morrerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são para a vida”. O grego diz literalmente “todos os que se apegam a ela, para a vida”, numa expressão elíptica que contrasta com “os que a abandonam morrerão”.'
    reason: Registra a construção elíptica do grego e uma alternativa mais literal, enquanto o texto principal oferece uma formulação portuguesa natural.
lexical_decisions:
- source_word: βίβλος
  choice: livro
  rationale: “Livro” é o equivalente moderno natural para um escrito ou documento e se ajusta à expressão “livro dos mandamentos”.
- source_word: προσταγμάτων
  choice: mandamentos
  rationale: O termo designa ordens ou determinações revestidas de autoridade; “mandamentos” preserva a força da autoridade divina e o paralelo com “lei”.
- source_word: νόμος
  choice: lei
  rationale: No contexto, refere-se à norma divina vinculante. “Lei” mantém melhor essa dimensão jurídica e pactual do que opções mais amplas, como “instrução”.
- source_word: ὁ ὑπάρχων εἰς τὸν αἰῶνα
  choice: que permanece para sempre
  rationale: A expressão afirma existência contínua e permanência; esta formulação é natural em português e conserva a ideia de validade duradoura.
- source_word: κρατοῦντες
  choice: se apegam a
  rationale: κρατέω pode indicar segurar firmemente ou conservar. A forma pronominal “apegar-se a” comunica adesão perseverante à lei sem reduzir a imagem a mera obediência externa.
- source_word: εἰς ζωὴν
  choice: caminham para a vida
  rationale: O grego apresenta uma expressão elíptica, literalmente “para a vida”. “Caminham para a vida” torna a frase compreensível em português, preserva sua orientação para a vida e evita transformá-la silenciosamente em simples posse presente.
- source_word: καταλείποντες
  choice: abandonam
  rationale: O verbo significa deixar para trás ou abandonar. “Abandonam” expressa de modo claro e atual o afastamento deliberado da lei.
- source_word: ἀποθανοῦνται
  choice: morrerão
  rationale: O futuro simples preserva diretamente a advertência explícita e a oposição entre vida e morte.
theological_decisions:
- issue: Como verter a expressão elíptica εἰς ζωὴν em contraste com “morrerão”
  choice: “caminham para a vida”, com nota sobre a forma literal e a alternativa “viverão”
  alternative: “viverão” ou “alcançam a vida”
  rationale: A escolha conserva a direção expressa por εἰς e a polaridade teológica entre vida e morte, sem apresentar como inequívoco um verbo que não está expresso no grego.
- issue: Se νόμος deve ser ampliado para “instrução” a fim de atenuar conotações jurídicas
  choice: “lei”
  alternative: “instrução” ou “ensino”
  rationale: O paralelo imediato com “mandamentos de Deus” aponta para determinações divinas vinculantes. “Lei” preserva essa força sem acrescentar uma leitura confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “se apegam” e “abandonam” como formas atuais, evitando tanto arcaísmos quanto coloquialismos. A construção “caminham para a vida” busca equilibrar naturalidade e preservação da elipse e da direção presentes no grego.
