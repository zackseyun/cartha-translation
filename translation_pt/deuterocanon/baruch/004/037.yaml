base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/037.yaml
  text: Look[a], your sons are coming, whom you sent away; they are coming, gathered from east to west at the word of the Holy One[b], rejoicing in the glory of God.
translation:
  language: pt
  text: Veja! Seus filhos, que você mandou embora, estão chegando; vêm reunidos do leste ao oeste, à palavra[a] do Santo, alegrando-se com a glória de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pela palavra do Santo». O dativo grego pode indicar o meio pelo qual eles são reunidos ou a palavra à qual respondem.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «alegrando-se na glória de Deus». O dativo grego permite mais de uma maneira de expressar a relação entre a alegria e a glória de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Veja!
  rationale: Mantém a função de chamar a atenção para a cena em linguagem moderna e natural, sem o tom arcaico de «Eis».
- source_word: οἱ υἱοί σου
  choice: seus filhos
  rationale: Preserva o masculino plural explícito do grego e a imagem dos filhos exilados de Jerusalém.
- source_word: ἐξαπέστειλας
  choice: você mandou embora
  rationale: Expressa o movimento de enviar para longe e se ajusta ao contexto do exílio sem acrescentar a causa desse afastamento.
- source_word: συνηγμένοι
  choice: reunidos
  rationale: 'Conserva o sentido passivo e resultativo: eles vêm como pessoas que foram reunidas.'
- source_word: ἀπʼ ἀνατολῶν ἕως δυσμῶν
  choice: do leste ao oeste
  rationale: Reproduz de modo claro e corrente a extensão geográfica indicada pelo merismo grego.
- source_word: τῷ ῥήματι
  choice: à palavra
  rationale: Mantém ῥῆμα como «palavra» e permite entender que a reunião acontece em resposta à palavra divina; a possível leitura instrumental é registrada em nota.
- source_word: τοῦ ἁγίου
  choice: do Santo
  rationale: O adjetivo substantivado funciona como título divino. «O Santo» é claro em português e não acrescenta um substantivo ausente no grego.
- source_word: χαίροντες
  choice: alegrando-se
  rationale: Preserva a força verbal do particípio e descreve a atitude dos filhos enquanto chegam.
- source_word: τῇ τοῦ θεοῦ δόξῃ
  choice: com a glória de Deus
  rationale: É uma construção portuguesa natural para indicar o objeto ou motivo da alegria, sem explicitar uma relação causal que o grego deixa aberta.
theological_decisions:
- issue: Título divino τοῦ ἁγίου
  choice: do Santo
  alternative: do Deus Santo
  rationale: A forma substantivada «o Santo» preserva o título reverente e evita inserir «Deus» onde o sintagma grego não o traz explicitamente.
- issue: Valor do dativo τῷ ῥήματι
  choice: à palavra do Santo
  alternative: pela palavra do Santo
  rationale: A tradução principal apresenta a reunião como resposta à palavra divina, enquanto a nota conserva a possibilidade instrumental do dativo.
- issue: Relação de χαίροντες com τῇ τοῦ θεοῦ δόξῃ
  choice: alegrando-se com a glória de Deus
  alternative: alegrando-se na glória de Deus
  rationale: «Com» é natural em português para o objeto ou ocasião da alegria; a nota preserva a possível nuance locativa ou associativa de «na».
translation_notes:
  register: Português moderno, digno e acessível, com construções de ampla compreensão e boa legibilidade brasileira. A pontuação conserva o movimento enfático do versículo, e as notas registram ambiguidades reais dos dativos gregos.
