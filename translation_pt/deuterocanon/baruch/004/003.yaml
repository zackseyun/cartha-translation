base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/003.yaml
  text: Do not give your glory to another[b][a], nor what benefits you to a foreign nation.
translation:
  language: pt
  text: Não dê a outro a sua glória[a], nem dê a uma nação estrangeira o que lhe é proveitoso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a sua honra». A palavra grega δόξα também pode ter esse sentido aqui.
    reason: lexical_alternative
  - marker: b
    text: Ou «as suas vantagens», «o seu bem-estar» ou «o que lhe traz benefício».
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς
  choice: Não dê
  rationale: Expressa de modo direto e natural a proibição formada por μή com o subjuntivo aoristo, sem intensificá-la como faria «não entregue» ou «não ceda».
- source_word: ἑτέρῳ
  choice: a outro
  rationale: Mantém de forma concisa o contraste expresso por ἕτερος, que aqui indica outra pessoa ou outro povo sem especificação adicional.
- source_word: τὴν δόξαν σου
  choice: a sua glória
  rationale: «Glória» conserva tanto o registro elevado quanto a amplitude semântica de δόξα, que também pode significar honra, sem restringir o referente.
- source_word: τὰ συμφέροντά σοι
  choice: aquilo que é para o seu bem
  rationale: O neutro plural substantivado designa, de maneira ampla, o que é vantajoso ou benéfico para o destinatário. A formulação portuguesa é natural e evita limitar a ideia a bens materiais ou privilégios específicos.
- source_word: ἔθνει ἀλλοτρίῳ
  choice: a uma nação estrangeira
  rationale: «Nação» corresponde a ἔθνος neste contexto, e «estrangeira» comunica que ela pertence a outro povo, sem empregar «gentia», que acrescentaria uma conotação religiosa mais específica.
theological_decisions:
- issue: Sentido de «a sua glória» no contexto
  choice: Manter a expressão ampla «a sua glória».
  alternative: «a sua honra»; «a glória que Deus lhe deu»; «o seu privilégio da aliança»
  rationale: O grego não define explicitamente o referente. «Glória» preserva a amplitude e a ressonância teológica da expressão sem introduzir uma interpretação doutrinária mais estreita.
- issue: Sentido de τὰ συμφέροντά σοι
  choice: Traduzir de modo geral como «aquilo que é para o seu bem».
  alternative: «o seu bem-estar»; «as suas vantagens»; «aquilo que lhe traz proveito»
  rationale: A expressão é semanticamente ampla e pode abranger bem-estar, vantagens e benefícios práticos ou ligados à aliança. A tradução evita resolver essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo da exortação grega; os pronomes com «seu/sua» dirigem-se ao povo personificado no singular.
