  text: and they did not know his righteous decrees[a], nor did they walk in the ways of God's commandments[b], nor did they step onto the paths of discipline in his righteousness.
translation:
  language: pt
  text: E não conheceram os seus preceitos, nem andaram nos caminhos dos mandamentos de Deus, nem puseram os pés nas veredas da disciplina em sua justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώματα
  choice: preceitos
  rationale: O termo designa determinações, ordenanças ou exigências reconhecidas como retas. “Preceitos” conserva a força moral e normativa sem soar excessivamente jurídico.
- source_word: ἔγνωσαν
  choice: conheceram
  rationale: Mantém o sentido direto de γινώσκω e não restringe a falha a mera compreensão intelectual.
- source_word: ἐπορεύθησαν
  choice: andaram
  rationale: Com “caminhos”, preserva a metáfora bíblica da conduta ou modo de vida.
- source_word: ὁδοῖς ἐντολῶν θεοῦ
  choice: nos caminhos dos mandamentos de Deus
  rationale: Reproduz com naturalidade a estrutura genitiva e mantém a força moral e pactual de ἐντολαί.
- source_word: τρίβους
  choice: veredas
  rationale: Distingue τρίβους do anterior ὁδοῖς e conserva a imagem de caminhos trilhados.
- source_word: παιδίας (παιδεία)
  choice: disciplina
  rationale: Expressa formação moral que inclui ensino, treinamento e correção; a nota preserva “instrução” como alternativa menos corretiva.
- source_word: ἐπέβησαν
  choice: puseram os pés
  rationale: Conserva a imagem concreta de ἐπιβαίνω e soa idiomático em português.
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: na justiça dele
  rationale: Reflete de perto a expressão grega, torna explícita a referência do pronome a Deus e preserva a possível nuance tanto moral quanto jurídica de δικαιοσύνη.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é a correspondência portuguesa mais ampla e natural, capaz de abranger a dimensão moral e a jurídica sem decidir entre elas. “Retidão” destacaria mais exclusivamente o aspecto moral.
- issue: Relação sintática de ἐν δικαιοσύνῃ αὐτοῦ
  choice: manter a frase compacta após “disciplina”
  alternative: explicitar como “as veredas de sua disciplina justa”
  rationale: O grego permite uma relação compacta entre disciplina, caminhos e justiça. A tradução evita transformar essa relação em um adjetivo e, assim, não resolve silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Caminhos” e “veredas” mantêm o paralelismo poético; “puseram os pés” conserva a imagem concreta do original. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
