base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/034.yaml
  text: And I will take away from her the rejoicing of her many people[b][a], and turn her pride into mourning.
translation:
  language: pt
  text: E tirarei dela a alegria de sua numerosa população[a] e transformarei seu orgulho[b] em luto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a alegria de sua grande multidão”. A expressão grega pode referir-se tanto à numerosa população da cidade quanto à alegria proveniente dela.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua arrogância” ou “seu esplendor”. O termo grego pode indicar orgulho, altivez ou exibição esplêndida.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελῶ
  choice: tirarei
  rationale: O futuro de περιαιρέω expressa remoção direta. “Tirarei” é natural em português e mantém a ação divina na primeira pessoa.
- source_word: ἀγαλλίαμα
  choice: alegria
  rationale: O termo denota júbilo ou exultação. “Alegria” comunica o sentido de modo claro e atual, sem perder a força emocional no contexto.
- source_word: τῆς πολυοχλίας
  choice: de sua numerosa população
  rationale: πολυοχλία pode indicar grande multidão ou a condição de ser populosa. A expressão escolhida preserva a ligação entre a alegria da cidade e seu grande número de habitantes.
- source_word: ἀγαυρίαμα
  choice: orgulho
  rationale: O substantivo pode designar orgulho exaltado, arrogância ou ostentação esplêndida. “Orgulho” preserva a amplitude principal sem restringir o termo apenas à altivez moral ou ao esplendor visual.
- source_word: εἰς πένθος
  choice: em luto
  rationale: A preposição εἰς indica o resultado da transformação. “Em luto” forma contraste natural com “alegria” e expressa o estado resultante.
theological_decisions:
- issue: Ausência de verbo explícito na segunda oração
  choice: Explicitar o sentido elíptico com “transformarei”
  alternative: 'Manter a compressão: “e seu orgulho em luto”'
  rationale: O grego depende do paralelismo e omite um segundo verbo. Em português, “transformarei” torna clara a passagem do orgulho ao luto sem acrescentar uma interpretação teológica alheia ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo entre alegria e luto, explicita apenas a elipse verbal necessária em português e registra em notas as ambiguidades lexicais genuínas.
