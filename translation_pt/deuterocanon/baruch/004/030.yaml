lexical_decisions:
- source_word: Θάρσει
  choice: Tenha coragem
  rationale: O imperativo exorta Jerusalém a recobrar a coragem e a confiança. A formulação é natural no português atual e preserva a força exortativa.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade.
- source_word: παρακαλέσει
  choice: consolará
  rationale: O futuro de παρακαλέω pode expressar encorajamento, consolo ou amparo. No contexto da Jerusalém aflita, «consolará» comunica melhor o sentido restaurador.
- source_word: ὁ ὀνομάσας σε
  choice: aquele que lhe deu o nome
  rationale: O particípio aoristo substantivado indica uma pessoa caracterizada pelo ato de nomear Jerusalém. «Aquele que lhe deu o nome» é idiomático e mantém a agência pessoal sem explicitar no texto principal quem é o referente.
theological_decisions:
- issue: Identificação daquele que deu nome a Jerusalém
  choice: Manter a descrição «aquele que lhe deu o nome», sem acrescentar «Deus» ou «Senhor» ao texto principal.
  alternative: «o Senhor, que lhe deu o nome» ou «Deus, que lhe deu o nome»
  rationale: O contexto aponta para Deus como aquele que nomeou e consolará Jerusalém, mas o grego não emprega aqui nome nem título divino. A tradução preserva essa forma indireta e sua tensão literária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento de Jerusalém como interlocutora singular é mantido por «lhe» e «a»; a colocação pronominal em «a consolará» conserva clareza e registro literário sem arcaísmo excessivo.
