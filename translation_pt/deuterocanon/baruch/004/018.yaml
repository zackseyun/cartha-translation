base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/018.yaml
  text: For the one who brought these evils upon you will rescue you from the hand of your enemies[a].
translation:
  language: pt
  text: Pois aquele que trouxe sobre vocês esses males[a] os livrará das mãos dos seus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “essas calamidades” ou “essas aflições”. O grego τὰ κακὰ pode indicar sofrimentos graves, além de “males”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγαγὼν
  choice: trouxe sobre
  rationale: O particípio aoristo de ἐπάγω indica fazer vir ou trazer algo sobre alguém; “trouxe sobre vocês” conserva essa força direcional em português natural.
- source_word: τὰ κακὰ
  choice: esses males
  rationale: A expressão pode designar males, desgraças ou calamidades. “Esses males” mantém sua amplitude moral e aflitiva, enquanto o demonstrativo recupera a referência contextual sugerida pelo artigo grego.
- source_word: ἐξελεῖται
  choice: livrará
  rationale: O futuro médio de ἐξαιρέω expressa resgatar ou libertar alguém do perigo. “Livrará” é corrente no registro bíblico moderno e combina naturalmente com “das mãos”.
- source_word: ἐκ χειρὸς
  choice: das mãos de
  rationale: A locução é um conhecido idiomatismo bíblico que representa poder ou domínio. O plural idiomático em português, “das mãos de”, preserva a imagem sem perder clareza.
- source_word: ἐχθρῶν
  choice: inimigos
  rationale: É o equivalente direto e corrente, sem necessidade de especialização contextual.
theological_decisions:
- issue: Agência divina no juízo e no livramento
  choice: 'Preservar um único agente implícito: aquele que trouxe os males é também quem livrará o povo.'
  alternative: Atenuar a causalidade por meio de uma formulação impessoal, como se os males apenas tivessem sobrevindo.
  rationale: A construção grega atribui claramente ambas as ações ao mesmo sujeito. A tradução mantém essa tensão teológica sem explicá-la nem suavizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” preserva a conexão explicativa de γάρ; “vocês” evita formas regionais ou excessivamente solenes. O idiomatismo “das mãos dos seus inimigos” mantém a imagem bíblica do domínio inimigo.
