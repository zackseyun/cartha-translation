base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/004/033.yaml
  text: For just as she rejoiced over your fall and was glad over your downfall[b][a], so she will grieve over her own desolation.
translation:
  language: pt
  text: Pois, assim como ela[a] se alegrou com a tua queda e exultou com a tua ruína[b], assim também se entristecerá com a sua própria desolação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome feminino “ela” provavelmente se refere à cidade ou nação inimiga mencionada no contexto, tradicionalmente identificada como Babilônia.
    reason: cross_reference
  - marker: b
    text: Ou “derrocada”. Aqui, o grego πτῶμα indica uma calamidade ou ruína, não um cadáver literal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ ... οὕτως
  choice: Pois, assim como ... assim também
  rationale: Preserva tanto a força explicativa de γάρ como a estrutura comparativa explícita do grego, em português natural.
- source_word: ἐχάρη
  choice: se alegrou
  rationale: Expressa de modo direto a alegria diante da calamidade de Sião e mantém o valor verbal do aoristo.
- source_word: πτώσει
  choice: queda
  rationale: Conserva a metáfora concisa de πτῶσις e permite que a expressão paralela seguinte a intensifique.
- source_word: εὐφράνθη
  choice: exultou
  rationale: Distingue o segundo verbo de ἐχάρη e transmite uma alegria intensa e maliciosa sem repetir 'se alegrou'.
- source_word: πτώματί
  choice: ruína
  rationale: No paralelismo e no contexto de calamidade, o termo indica derrocada ou ruína, não um cadáver; 'ruína' é claro e idiomático em português.
- source_word: λυπηθήσεται
  choice: se entristecerá
  rationale: Reproduz naturalmente o futuro passivo/deponente, destacando a futura inversão da situação.
- source_word: ἐρημίᾳ
  choice: desolação
  rationale: No contexto de juízo, designa devastação e abandono, mantendo o tom profético do texto.
- source_word: ἑαυτῆς
  choice: própria
  rationale: 'Preserva a ênfase reflexiva: a desolação que virá será a dela mesma.'
theological_decisions:
- issue: Referente do sujeito feminino ao longo do versículo
  choice: Manter o pronome feminino 'ela' sem identificar a entidade no texto principal.
  alternative: Explicitar 'Babilônia' ou 'a cidade inimiga' na tradução.
  rationale: O grego emprega formas femininas singulares e depende do contexto para identificar o referente. Manter o pronome preserva a formulação da fonte e evita resolver no texto uma identificação apenas contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção comparativa e a inversão entre a queda de Sião e a futura desolação da inimiga foram mantidas; os dois verbos de alegria receberam formas distintas para preservar o paralelismo sem repetição artificial.
