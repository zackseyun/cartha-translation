  text: For the one who brought evils upon you will bring you everlasting gladness with your salvation[a][b].
translation:
  language: pt
  text: Pois aquele que trouxe sobre vocês os males trará a vocês a alegria eterna[a], junto com a salvação de vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o regozijo eterno». O termo grego também pode ser traduzido como «regozijo» ou «júbilo».
    reason: lexical_alternative
  - marker: b
    text: Ou «a libertação de vocês». A palavra grega pode significar «salvação» ou «libertação».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἐπαγαγὼν
  choice: aquele que trouxe sobre vocês
  rationale: Preserva a agência explícita do particípio grego e a ideia de fazer algo vir sobre alguém, sem suavizar a afirmação.
- source_word: τὰ κακὰ
  choice: os males
  rationale: Tradução direta do substantivo plural, que pode abranger males, desgraças e calamidades; o artigo definido é mantido, sem acrescentar um demonstrativo ausente no grego.
- source_word: ἐπάξει
  choice: trará a vocês
  rationale: Repete o verbo «trazer» usado na primeira oração, preservando o paralelo deliberado entre o mal já trazido e a alegria que será trazida.
- source_word: τὴν αἰώνιον εὐφροσύνην
  choice: a alegria eterna
  rationale: «Alegria» expressa de modo natural o contentamento e regozijo de εὐφροσύνη; «eterna» corresponde diretamente a αἰώνιον.
- source_word: μετὰ τῆς σωτηρίας ὑμῶν
  choice: junto com a salvação de vocês
  rationale: «Junto com» explicita naturalmente a associação indicada por μετά; «salvação» conserva a amplitude teológica de σωτηρία, enquanto a nota registra o sentido contextual de libertação.
theological_decisions:
- issue: Agência no juízo e na restauração
  choice: O mesmo agente que trouxe os males trará a alegria eterna e a salvação.
  alternative: Suavizar a primeira ação como mera permissão dos males ou traduzir o agente de modo impessoal.
  rationale: O grego atribui explicitamente as duas ações ao mesmo sujeito por meio de formas do mesmo verbo, ἐπάγω. A tradução preserva essa tensão teológica sem explicar além do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Vocês» representa com clareza o plural de ὑμῖν/ὑμῶν; a repetição de «trouxe/trará» mantém a estrutura retórica do original.
