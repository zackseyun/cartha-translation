base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/010.yaml
  text: And they said[a], ‘Behold, we have sent you money; and with the money buy burnt offerings and sin offerings and frankincense, and prepare a grain offering and offer them on the altar of the Lord our God,’
translation:
  language: pt
  text: 'E eles disseram: “Eis que enviamos dinheiro a vocês. Com esse dinheiro, comprem sacrifícios inteiramente queimados, ofertas pelo pecado e olíbano; preparem uma oferta de cereais[a] e ofereçam tudo sobre o altar do Senhor, nosso Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, o grego μάννα é entendido em sentido sacrificial, isto é, como uma oferta de cereais, e não como o alimento do deserto chamado maná.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  choice: dinheiro
  rationale: Embora o sentido literal possa ser “prata”, o contexto de compra indica dinheiro como meio de pagamento.
- source_word: ἀγοράσατε
  choice: comprem
  rationale: Imperativo comercial direto, expresso de modo natural no português atual.
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: Termo sacrificial consagrado em português para ofertas inteiramente queimadas; o contexto evita o sentido histórico moderno.
- source_word: περὶ ἁμαρτίας
  choice: ofertas pelo pecado
  rationale: No contexto sacrificial, a expressão designa ofertas relacionadas à expiação do pecado.
- source_word: λίβανον
  choice: incenso
  rationale: Em português bíblico corrente, “incenso” comunica naturalmente a substância aromática indicada por λίβανος, ainda que “olíbano” seja mais específico.
- source_word: ποιήσατε μάννα
  choice: preparem uma oferta de cereais
  rationale: Aqui μάννα tem sentido sacrificial e designa uma oferta de cereal, não o maná do deserto.
- source_word: ἀνοίσατε
  choice: ofereçam
  rationale: No contexto cultual, o verbo significa fazer subir ou apresentar a oferta sobre o altar.
- source_word: θυσιαστήριον
  choice: altar
  rationale: Equivalente português padrão para o lugar de sacrifício.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: do Senhor, nosso Deus
  rationale: Reproduz com clareza a relação entre “Senhor” e “nosso Deus” e mantém a referência ao Deus de Israel.
theological_decisions:
- issue: Tradução de κύριος em um texto grego deuterocanônico referente ao Deus de Israel
  choice: Senhor
  alternative: SENHOR
  rationale: O testemunho primário é grego e traz Κυρίου; “Senhor” preserva essa forma sem reconstruir graficamente o tetragrama hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês”. “Eis que” preserva a força discursiva de Ἰδού. “Holocaustos” mantém a terminologia sacrificial tradicional; “ofereçam tudo” explicita naturalmente o objeto coletivo de ἀνοίσατε sem alterar a sequência das ofertas.
