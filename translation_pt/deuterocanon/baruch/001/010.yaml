  timestamp: '2026-07-14T00:23:27Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução comunica adequadamente a sequência de instruções e preserva o sentido cultual de μάννα como oferta de cereais. No entanto, λίβανον designa especificamente olíbano, não incenso em sentido geral; além disso, ὁλοκαυτώματα indica sacrifícios inteiramente consumidos pelo fogo. Uma formulação explícita evita a forte associação moderna não cultual de «holocaustos» e preserva melhor essa nuance.
  naturalness: O texto é fluente em português moderno e o tratamento por «vocês» é apropriado. «Sacrifícios inteiramente queimados» é claro e digno no registro bíblico; «olíbano» é o nome português preciso da resina, embora menos genérico que «incenso».
  terminology: «Ofertas pelo pecado», «oferta de cereais», «altar» e «Senhor, nosso Deus» são adequados. «Olíbano» deve substituir «incenso» por precisão lexical. A nota sobre μάννα permanece necessária e está bem ancorada.
  issues:
  - severity: medium
    issue: «Incenso» é demasiado genérico para λίβανον.
    rationale: λίβανον refere-se ao olíbano/franquincenso, uma substância aromática específica. «Incenso» pode designar várias substâncias ou o produto aromático de modo geral.
  - severity: low
    issue: «Holocaustos» pode produzir uma associação histórica moderna alheia ao sentido do texto e deixa implícita a total combustão da vítima.
    rationale: No contexto bíblico o termo é tradicional, mas «sacrifícios inteiramente queimados» transmite diretamente o valor de ὁλοκαυτώματα, com melhor inteligibilidade internacional contemporânea.
