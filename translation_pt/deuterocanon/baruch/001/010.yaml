- from: 'E eles disseram: “Eis que enviamos dinheiro a vocês. Com esse dinheiro, comprem holocaustos, ofertas pelo pecado e incenso; preparem uma oferta de cereais[a] e ofereçam tudo sobre o altar do Senhor, nosso Deus.”'
  to: 'E eles disseram: “Eis que enviamos dinheiro a vocês. Com esse dinheiro, comprem sacrifícios inteiramente queimados, ofertas pelo pecado e olíbano; preparem uma oferta de cereais[a] e ofereçam tudo sobre o altar do Senhor, nosso Deus.”'
