- source_word: ἡμάρτομεν
  choice: pecamos
  rationale: Traduz diretamente o aoristo de ἁμαρτάνω como ação passada coletiva, preservando a primeira pessoa do plural.
- source_word: ἔναντι
  choice: diante de
  rationale: Mantém o sentido espacial e relacional de estar perante Deus, sem substituir a expressão por «contra», leitura possível no contexto, porém menos formalmente correspondente.
- source_word: Κυρίου
  choice: o Senhor
  rationale: Forma portuguesa tradicional e clara para o título κύριος; o artigo é requerido pela expressão natural «diante do Senhor».
theological_decisions:
- issue: Relação expressa por ἔναντι Κυρίου
  choice: diante do Senhor
  alternative: contra o Senhor
  rationale: A tradução conserva a formulação do grego e sua dimensão de pecado cometido na presença e perante o juízo divino, sem reduzir a expressão apenas à ideia de oposição.
