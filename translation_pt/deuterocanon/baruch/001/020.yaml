base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/020.yaml
  text: And the calamities and the curse that the Lord appointed for Moses his servant clung to us[a], on the day when he brought our fathers out to give us a land flowing with milk and honey[c][b], as it is this day.
translation:
  language: pt
  text: E apegaram-se a nós as desgraças[a] e a maldição que o Senhor prescreveu a Moisés, seu servo[b], no dia em que fez nossos antepassados sair para nos dar uma terra que mana leite e mel, como é o caso hoje.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os males” ou “as calamidades”; aqui a expressão se refere provavelmente a consequências desastrosas, não à maldade moral.
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode significar “filho” ou “criança”, mas, aplicado a Moisés aqui, tem o sentido de “servo”.
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “como este dia”; a expressão aponta para a realidade presente, mas sua ligação exata com o que precede permanece concisa no grego.'
    reason: ambiguity
lexical_decisions:
- source_word: ἐκολλήθη
  choice: apegaram-se
  rationale: Preserva a imagem vívida de algo que se prende estreita e persistentemente ao povo; a concordância no plural é natural em português com os sujeitos coordenados.
- source_word: τὰ κακὰ
  choice: as desgraças
  rationale: No contexto de sanções da aliança, designa males sofridos ou calamidades, não maldade moral praticada pelo povo.
- source_word: ἡ ἀρά
  choice: a maldição
  rationale: Expressa de modo claro e solene a maldição ligada à desobediência à aliança, sem acrescentar terminologia técnica.
- source_word: συνέταξεν
  choice: prescreveu
  rationale: O verbo indica ordenar, determinar ou estabelecer; com o dativo de Moisés, “prescreveu a Moisés” conserva a direção da ordem sem transformar Moisés explicitamente em mero instrumento.
- source_word: παιδὶ αὐτοῦ
  choice: seu servo
  rationale: Embora παῖς também possa significar “criança” ou “filho”, aplicado a Moisés neste contexto denota o servo de Deus.
- source_word: ἐξήγαγεν
  choice: fez ... sair
  rationale: Reproduz o movimento de saída sem acrescentar “do Egito”, elemento contextual que não está expresso neste versículo.
- source_word: γῆν ῥέουσαν γάλα καὶ μέλι
  choice: uma terra que mana leite e mel
  rationale: Mantém a conhecida imagem bíblica em formulação natural e dignificada em português.
- source_word: ὡς ἡ ἡμέρα αὕτη
  choice: como é o caso hoje
  rationale: Comunica a realidade presente indicada pela expressão grega sem forçar uma ligação exclusiva com apenas uma das orações anteriores.
theological_decisions:
- issue: Natureza das desgraças e da maldição
  choice: Sanções da aliança anunciadas pelo Senhor em conexão com Moisés
  alternative: Infortúnios e maldição em sentido geral, sem referência específica à aliança
  rationale: A combinação de desgraças, maldição, Moisés, êxodo e concessão da terra evoca fortemente as sanções deuteronômicas, mas a tradução não explicita além do que o texto diz.
- issue: Relação de Moisés com aquilo que o Senhor prescreveu
  choice: “prescreveu a Moisés”
  alternative: “prescreveu por meio de Moisés” ou “destinou a Moisés”
  rationale: O dativo τῷ Μωυσῇ apresenta Moisés como destinatário da prescrição. A formulação evita importar uma preposição instrumental não expressa e também evita sugerir que a maldição fosse destinada a recair sobre Moisés.
- issue: Referência da expressão final
  choice: 'Formulação ampla: “como é o caso hoje”'
  alternative: Ligá-la exclusivamente às calamidades presentes ou à posse da terra
  rationale: A posição e a concisão do grego permitem alguma tensão quanto ao alcance da expressão. A tradução conserva essa abertura em vez de resolver silenciosamente a referência.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conserva a metáfora de as desgraças se apegarem ao povo, evita acrescentar “do Egito” e mantém a ambiguidade controlada da expressão temporal final.
