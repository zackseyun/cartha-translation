  text: And Baruch read the words of this book in the hearing of Jeconiah son of Jehoiakim, king of Judah, and in the hearing of all the people who came to the book,
translation:
  language: pt
  text: E Baruque leu as palavras deste livro aos ouvidos de Jeconias, filho de Joaquim, rei de Judá, e aos ouvidos de todo o povo que se aproximava do livro[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «que se aproximava da leitura» ou «que se aproximava do rolo». A expressão grega «que se aproximava do livro» é incomum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγνω
  choice: leu
  rationale: O verbo significa «ler». O contexto público já indica uma leitura audível, sem exigir que se acrescente «em voz alta».
- source_word: τοὺς λόγους
  choice: as palavras
  rationale: Mantém o sentido verbal e concreto de λόγοι, sem o interpretar de modo mais amplo como «conteúdo».
- source_word: τοῦ βιβλίου τούτου
  choice: deste livro
  rationale: βιβλίον pode designar livro ou rolo; «livro» é natural em português e preserva o demonstrativo.
- source_word: ἐν ὠσὶν
  choice: aos ouvidos de
  rationale: Reproduz de modo inteligível a expressão grega e destaca que a leitura foi ouvida publicamente.
- source_word: Ἰεχονίου
  choice: Jeconias
  rationale: Forma portuguesa tradicional e diretamente correspondente ao nome grego; a identificação alternativa é registrada em nota.
- source_word: Ἰωακεὶμ
  choice: Joaquim
  rationale: Forma portuguesa corrente do nome bíblico representado pelo grego Ἰωακείμ.
- source_word: τῶν ἐρχομένων πρὸς τὴν βίβλον
  choice: que veio até o livro
  rationale: Preserva a formulação concreta e incomum do grego, sem resolver silenciosamente se a referência é ao livro, ao rolo ou ao ato de leitura.
