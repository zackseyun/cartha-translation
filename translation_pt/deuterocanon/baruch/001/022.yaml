base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/022.yaml
  text: And each of us went off in the intent of his evil heart[a], to serve other gods, to do evil in the sight of the Lord our God.
translation:
  language: pt
  text: E cada um de nós partiu segundo o propósito de seu coração perverso[a], para servir a outros deuses e fazer o que é mau aos olhos do Senhor, nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «segundo o pensamento de seu coração perverso». A expressão grega destaca a intenção ou disposição interior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠχόμεθα
  choice: seguiu
  rationale: O verbo οἴχομαι indica partir ou seguir adiante; em português, «seguiu» comunica naturalmente o avanço deliberado no caminho da desobediência.
- source_word: ἕκαστος
  choice: cada um de nós
  rationale: 'Preserva o sentido distributivo: a confissão coletiva atribui a ação a cada indivíduo.'
- source_word: ἐν διανοίᾳ καρδίας αὐτοῦ τῆς πονηρᾶς
  choice: o propósito de seu coração perverso
  rationale: «Propósito» expressa a dimensão mental e volitiva de διάνοια, enquanto «coração perverso» mantém a linguagem antropológica e moral do grego.
- source_word: ἐργάζεσθαι θεοῖς ἑτέροις
  choice: servindo a outros deuses
  rationale: Com o dativo, ἐργάζομαι exprime aqui serviço prestado; o contexto identifica esse serviço como idolatria.
- source_word: ποιῆσαι τὰ κακὰ
  choice: fazendo o que é mau
  rationale: Traduz naturalmente o neutro plural substantivado τὰ κακά, sem reduzir sua força moral.
- source_word: κατʼ ὀφθαλμοὺς Κυρίου θεοῦ ἡμῶν
  choice: aos olhos do Senhor, nosso Deus
  rationale: Mantém a metáfora bíblica da avaliação divina em uma formulação corrente e digna em português.
- source_word: Κυρίου
  choice: Senhor
  rationale: No contexto da relação de Israel com seu Deus, «Senhor» é a equivalência tradicional e semanticamente adequada.
theological_decisions:
- issue: Sentido de κύριος no contexto da Septuaginta deuterocanônica
  choice: Senhor
  alternative: Soberano
  rationale: A referência ao Deus de Israel favorece «Senhor», preservando o uso bíblico reconhecível sem introduzir uma interpretação denominacional.
- issue: Natureza do serviço prestado a θεοῖς ἑτέροις
  choice: servindo a outros deuses
  alternative: trabalhando para outros deuses
  rationale: O contexto de apostasia indica serviço idolátrico, embora o verbo isoladamente possa ter o sentido mais geral de trabalhar ou agir.
- issue: Relação entre a vontade interior e os atos maus
  choice: seguiu o propósito de seu coração perverso
  alternative: andou segundo o pensamento de seu coração perverso
  rationale: A tradução conserva a tensão entre disposição interior e conduta exterior, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva a confissão distributiva («cada um de nós») e evita o masculino marcado no referente humano, embora mantenha «seu» por naturalidade. O particípio funcional em «servindo... e fazendo...» representa os infinitivos gregos como desenvolvimento do caminho seguido.
