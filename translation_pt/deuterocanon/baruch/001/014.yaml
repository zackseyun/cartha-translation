  yaml_path: translation/deuterocanon/baruch/001/014.yaml
  text: And you shall read this book that we have sent to you[a], to proclaim in the house of the Lord on a feast day and on days of appointed time,
translation:
  language: pt
  text: E vocês lerão este livro que lhes enviamos, para proclamá-lo na casa do Senhor, em um dia de festa e em dias de tempo determinado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais fluente: “em um dia de festa e em ocasiões determinadas”. A expressão grega traduzida por “em dias de tempo determinado” é incomum na forma em que foi transmitida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνώσεσθε
  choice: vocês lerão
  rationale: O futuro médio funciona aqui como instrução aos destinatários. “Vocês lerão” conserva a forma futura e a força diretiva sem explicitar “em voz alta”, embora o contexto pressuponha leitura pública.
- source_word: τὸ βιβλίον τοῦτο
  choice: este livro
  rationale: βιβλίον pode designar livro, rolo ou documento. “Este livro” é natural em português atual e não impõe um formato material específico.
- source_word: ἀπεστείλαμεν
  choice: lhes enviamos
  rationale: O aoristo indica o envio já realizado. O pretérito perfeito português expressa isso naturalmente em relação à instrução presente.
- source_word: ἐξαγορεῦσαι
  choice: para o proclamarem
  rationale: O infinitivo indica finalidade, e o verbo pode significar declarar ou tornar público. “Proclamar” comunica o caráter público e formal no contexto de culto, sem reduzi-lo apenas ao ato mecânico da leitura.
- source_word: ἐν οἴκῳ Κυρίου
  choice: na casa do Senhor
  rationale: Mantém a expressão bíblica para o templo ou santuário e traduz Κυρίου diretamente como “Senhor”.
- source_word: ἐν ἡμέρᾳ ἑορτῆς
  choice: em um dia de festa
  rationale: ἑορτή denota festa ou celebração religiosa. A formulação preserva o singular genérico e o sentido do calendário cultual.
- source_word: ἐν ἡμέραις καιροῦ
  choice: em dias de tempo determinado
  rationale: καιρός pode indicar um tempo próprio, fixado ou determinado. A formulação permanece próxima da expressão grega, cuja construção transmitida é incomum; uma alternativa mais fluente é registrada em nota.
theological_decisions:
- issue: Tradução de Κυρίου
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz Κυρίου, e não diretamente o tetragrama hebraico. “Senhor” é a tradução textualmente mais ancorada neste contexto grego deuterocanônico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “vocês” torna explícito o plural do grego; “lhes” evita regionalismo excessivo. A redação preserva deliberadamente a construção incomum do último sintagma, esclarecendo em nota uma leitura mais natural.
