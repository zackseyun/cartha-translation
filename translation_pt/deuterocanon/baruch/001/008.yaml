base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/008.yaml
  text: when he received the vessels of the house of the Lord that had been carried out from the temple[a], to return them to the land of Judah, on the tenth of Sivan—silver vessels that Zedekiah son of Josiah, king of Judah, had made—
translation:
  language: pt
  text: quando recebeu os utensílios da casa do Senhor que haviam sido retirados do templo, a fim de devolvê-los à terra de Judá[a], no décimo dia de Sivã — utensílios de prata que Zedequias, filho de Josias, rei de Judá, havia feito —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fim de levá-los de volta à terra de Judá”.'
    reason: Alternativa lexical para ἀποστρέψαι, que pode ressaltar o movimento de retorno, além da ideia de devolução.
lexical_decisions:
- source_word: ἐν τῷ λαβεῖν
  choice: quando recebeu
  rationale: A construção com infinitivo articular introduz uma circunstância temporal contemporânea; a forma escolhida é clara e natural em português.
- source_word: σκεύη
  choice: utensílios
  rationale: No contexto do templo, designa objetos ou implementos de uso sagrado. “Utensílios” evita limitar o sentido a recipientes, como poderia ocorrer com “vasos”.
- source_word: οἴκου Κυρίου
  choice: da casa do Senhor
  rationale: Preserva a designação tradicional do templo e traduz Κυρίου por “Senhor” de modo direto.
- source_word: τὰ ἐξενεχθέντα ἐκ τοῦ ναοῦ
  choice: que haviam sido retirados do templo
  rationale: O particípio passivo indica uma retirada anterior ao recebimento; o mais-que-perfeito composto explicita essa relação temporal.
- source_word: ἀποστρέψαι
  choice: a fim de devolvê-los
  rationale: O infinitivo exprime finalidade e, neste contexto, o retorno dos utensílios ao seu lugar de origem.
- source_word: γῆν Ἰούδα
  choice: à terra de Judá
  rationale: Mantém o valor territorial de γῆ em vez de reduzi-lo apenas ao nome próprio.
- source_word: τῇ δεκάτῃ τοῦ Σειουάν
  choice: no décimo dia de Sivã
  rationale: Reproduz com naturalidade a fórmula de data; “Sivã” é a forma portuguesa corrente do nome do mês.
- source_word: σκεύη ἀργυρᾶ
  choice: utensílios de prata
  rationale: Conserva tanto a referência aos objetos sagrados quanto a indicação do material.
- source_word: ἐποίησεν
  choice: havia feito
  rationale: O mais-que-perfeito composto esclarece que a fabricação precedeu o recebimento narrado.
theological_decisions:
- issue: Tradução de κύριος na expressão referente ao templo
  choice: Senhor
  alternative: SENHOR
  rationale: O grego traz Κυρίου, sem representar diretamente o nome divino hebraico; “Senhor” preserva o texto-fonte sem impor uma identificação tipográfica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase permanece aberta por travessões porque o versículo integra uma construção sintática que continua o contexto anterior e posterior.
