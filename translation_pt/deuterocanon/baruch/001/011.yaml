base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/011.yaml
  text: And pray for the life of Nebuchodonosor king of Babylon[a], and for the life of Baltasar his son[b], so that their days may be like the days of heaven upon the earth.
translation:
  language: pt
  text: E orem pela vida de Nabucodonosor, rei da Babilônia, e pela vida de Baltasar, seu filho,[a] para que os dias deles sejam como os dias do céu sobre a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes gregos são Ναβουχοδονοσόρ (Nabucodonosor) e Βαλτασάρ (Baltasar); outras tradições bíblicas apresentam formas diferentes desses nomes.
    reason: alternative_reading
  - marker: b
    text: 'Ou, em formulação mais idiomática: “para que seus dias sejam longos como a permanência do céu sobre a terra”. O grego conserva uma metáfora vívida de vida duradoura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεύξασθε
  choice: orem
  rationale: O imperativo aoristo plural expressa uma exortação direta. “Orem” é natural em português moderno e preserva tanto o valor verbal quanto o número plural.
- source_word: περὶ τῆς ζωῆς
  choice: pela vida de
  rationale: περί com genitivo indica aqui oração em favor da vida de alguém. A formulação mantém o substantivo explícito ζωή sem ampliá-lo para “bem-estar”.
- source_word: Ναβουχοδονοσόρ
  choice: Nabucodonosor
  rationale: Forma portuguesa que representa de perto o nome grego e é reconhecível ao leitor, sem substituir a forma desta testemunha por uma grafia baseada diretamente em outra tradição linguística.
- source_word: Βαλτασάρ
  choice: Baltasar
  rationale: Transliteração portuguesa direta e natural da forma grega, sem assimilá-la a uma forma alternativa derivada do hebraico ou aramaico.
- source_word: ἵνα ὦσιν αἱ ἡμέραι αὐτῶν
  choice: para que os dias deles sejam
  rationale: “Para que” comunica claramente a finalidade introduzida por ἵνα; “deles” conserva a referência conjunta aos dois personagens.
- source_word: ὡς αἱ ἡμέραι τοῦ οὐρανοῦ ἐπὶ τῆς γῆς
  choice: como os dias do céu sobre a terra
  rationale: A tradução preserva a imagem incomum e evocativa do grego, em vez de reduzi-la à paráfrase interpretativa “por muito tempo”.
theological_decisions:
- issue: Interpretar a oração final como simples desejo de longevidade ou preservar sua metáfora
  choice: 'Preservar a metáfora: “os dias deles sejam como os dias do céu sobre a terra”'
  alternative: “os dias deles sejam longos como a permanência do céu sobre a terra”
  rationale: A expressão grega sugere duração prolongada, mas o faz por meio de uma imagem bíblica vívida. Manter a imagem conserva sua ressonância e evita resolver em excesso o sentido idiomático.
- issue: Normalizar os nomes reais segundo formas de outras tradições textuais
  choice: Usar “Nabucodonosor” e “Baltasar”, correspondentes às formas gregas
  alternative: Empregar formas harmonizadas diretamente com grafias tradicionais baseadas no hebraico ou aramaico
  rationale: A tradução parte da testemunha grega fornecida; por isso, mantém nomes que refletem essa forma textual sem impor uma harmonização externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe permanece próxima do grego, mas evita rigidez desnecessária; a metáfora final é deliberadamente preservada.
