base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/007.yaml
  text: and they sent to Jerusalem[a], to Jehoiakim son of Hilkiah, son of Shallum, the priest, and to the priests, and to all the people who were found with him in Jerusalem,
translation:
  language: pt
  text: E enviaram a Jerusalém, a Joaquim, filho de Helquias, filho de Salum, o sacerdote, e aos sacerdotes e a todo o povo que foi encontrado com ele[a] em Jerusalém,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «com ele», no singular. O antecedente não está explícito neste versículo; a expressão também pode ser entendida, de modo mais geral, como referência aos que estavam presentes ali.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: enviaram
  rationale: O aoristo indica simplesmente o ato de enviar. O objeto permanece implícito, como no grego, e a continuidade sintática com o versículo seguinte é preservada.
- source_word: εἰς Ἰερουσαλήμ
  choice: a Jerusalém
  rationale: Com nome de cidade, a preposição εἰς indica destino; «a Jerusalém» é uma formulação portuguesa direta e natural.
- source_word: πρὸς Ἰωακεὶμ ... τὸν ἱερέα
  choice: a Joaquim, filho de Helquias, filho de Salum, o sacerdote
  rationale: πρός apresenta Joaquim como destinatário. ἱερεύς significa «sacerdote»; não se acrescenta «sumo», pois o grego não traz ἀρχιερεύς.
- source_word: τοὺς ἱερεῖς
  choice: aos sacerdotes
  rationale: Tradução direta do plural de ἱερεύς.
- source_word: πάντα τὸν λαόν
  choice: a todo o povo
  rationale: Mantém o sentido coletivo do singular grego em uma expressão corrente em português.
- source_word: τοὺς εὑρεθέντας
  choice: que foi encontrado
  rationale: Preserva a imagem verbal de εὑρίσκω e faz concordância com o coletivo singular «povo», sem substituí-la pela interpretação mais livre «que estava presente».
- source_word: μετ᾽ αὐτοῦ
  choice: com ele
  rationale: Mantém o pronome singular αὐτοῦ, embora seu antecedente não esteja explicitamente definido no versículo.
