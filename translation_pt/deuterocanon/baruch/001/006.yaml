lexical_decisions:
- source_word: συνήγαγον
  choice: reuniram
  rationale: Expressa o ato de juntar uma contribuição coletiva e permanece próximo do sentido básico de συνάγω.
- source_word: ἀργύριον
  choice: prata
  rationale: Preserva o termo concreto do grego, que neste contexto se refere à prata usada como dinheiro, sem substituí-lo interpretativamente por “dinheiro”.
- source_word: καθὰ ἑκάστου
  choice: de acordo com o que cada um
  rationale: Comunica de modo natural a proporção individual indicada por καθὰ e pelo genitivo distributivo ἑκάστου.
- source_word: ἠδύνατο ἡ χείρ
  choice: podia dar
  rationale: Traduz o sentido do idiomatismo grego referente à capacidade ou aos recursos de cada pessoa; a imagem literal da mão é registrada na nota.
