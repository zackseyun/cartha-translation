base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/009.yaml
  text: after Nebuchadnezzar king of Babylon had taken Jeconiah and the rulers and the prisoners and the mighty men and the people of the land from Jerusalem into exile[a], and had brought him to Babylon.
translation:
  language: pt
  text: depois que Nabucodonosor, rei da Babilônia, deportou de Jerusalém Jeconias, os governantes, os prisioneiros, os poderosos e o povo da terra, e o levou para a Babilônia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz um pronome masculino singular, aparentemente em referência específica a Jeconias; alguns podem entender o sentido de modo mais amplo, como “os”, referindo-se a todo o grupo deportado.
    reason: Leitura alternativa decorrente da tensão entre o pronome grego singular e a lista plural precedente.
lexical_decisions:
- source_word: μετὰ τὸ ἀποικίσαι
  choice: depois que ... deportou
  rationale: A construção com μετά e infinitivo articular é temporal, enquanto ἀποικίζω, neste contexto, indica remoção forçada e exílio. “Deportou” exprime isso de modo natural e conciso em português.
- source_word: Ναβουχοδονοσὸρ βασιλέα Βαβυλῶνος
  choice: Nabucodonosor, rei da Babilônia
  rationale: Emprega as formas tradicionais e amplamente reconhecidas em português, preservando diretamente o título do grego.
- source_word: τὸν Ἰεχονίαν
  choice: Jeconias
  rationale: Forma portuguesa tradicional que corresponde diretamente ao nome grego Ἰεχονίας, sem substituí-lo pela forma hebraica alternativa Joaquim.
- source_word: τοὺς ἄρχοντας
  choice: os governantes
  rationale: Ἄρχοντες designa pessoas que exercem autoridade ou governo; “governantes” conserva o sentido político sem especificar cargos.
- source_word: τοὺς δεσμώτας
  choice: os prisioneiros
  rationale: Δεσμώτης denota literalmente alguém preso ou em cadeias. “Prisioneiros” mantém a distinção lexical em relação aos demais deportados.
- source_word: τοὺς δυνατοὺς
  choice: os poderosos
  rationale: Δυνατοί pode designar homens fortes, influentes ou proeminentes. “Os poderosos” preserva essa amplitude sem restringir o grupo ao âmbito militar.
- source_word: τὸν λαὸν τῆς γῆς
  choice: o povo da terra
  rationale: Tradução formal da expressão grega, que pode ter valor social específico, mas não precisa ser explicitada interpretativamente no texto principal.
- source_word: ἀπὸ Ἰερουσαλήμ
  choice: de Jerusalém
  rationale: Indica diretamente o lugar de onde ocorreu a deportação.
- source_word: καὶ ἤγαγεν αὐτὸν εἰς Βαβυλῶνα
  choice: e o levou para a Babilônia
  rationale: Preserva o pronome masculino singular αὐτόν, cuja referência mais imediata é Jeconias. “Para a Babilônia” expressa naturalmente o destino indicado por εἰς.
theological_decisions:
- issue: Número do pronome na oração final
  choice: Manter o singular “o” no texto principal.
  alternative: Traduzir no plural, “os levou”, entendendo que toda a lista de deportados foi conduzida à Babilônia.
  rationale: O testemunho grego fornecido traz αὐτόν, no singular, provavelmente em referência específica a Jeconias. A possível compreensão coletiva deve ser registrada em nota, não introduzida silenciosamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais tradicionais de ampla legibilidade brasileira. A redação preserva a estrutura de oração temporal dependente do contexto anterior e mantém, sem harmonização, o singular inesperado da cláusula final.
