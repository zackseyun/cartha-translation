base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/001.yaml
  text: And these are the words of the book that Baruch son of Neriah[a], son of Maaseiah, son of Zedekiah, son of Hasadiah, son of Hilkiah, wrote in Babylon,
translation:
  language: pt
  text: 'E estas são as palavras do livro que Baruque, filho de Nerias, filho de Maasias, filho de Sedecias, filho de Asadias[a], filho de Helcias, escreveu na Babilônia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz Asadias; algumas traduções usam Hasadias, forma baseada na provável correspondência semítica do nome.
    reason: Registra a alternativa de transliteração semítica sem substituir a forma atestada diretamente na fonte grega.
lexical_decisions:
- source_word: ΚΑΙ οὗτοι
  choice: E estas são
  rationale: Preserva a abertura coordenada e o demonstrativo do grego, acrescentando apenas a cópula exigida pelo português natural.
- source_word: οἱ λόγοι τοῦ βιβλίου
  choice: as palavras do livro
  rationale: Mantém a referência aos conteúdos escritos e reproduz de perto a construção genitiva grega sem ampliá-la para “relato” ou “mensagem”.
- source_word: οὓς ἔγραψεν
  choice: que ... escreveu
  rationale: A oração relativa e o aoristo são vertidos naturalmente pelo relativo “que” e pelo pretérito perfeito simples.
- source_word: Βαροὺχ
  choice: Baruque
  rationale: Forma tradicional e amplamente reconhecível do nome em português bíblico.
- source_word: υἱὸς
  choice: filho de
  rationale: Preserva a fórmula genealógica explícita repetida no texto, sem substituí-la pelo sentido mais amplo de “descendente”.
- source_word: Νηρίου / Μαασαίου / Σεδεκίου / Ἀσαδίου / Χελκίου
  choice: Nerias / Maasias / Sedecias / Asadias / Helcias
  rationale: Empregam-se formas bíblicas tradicionais em português, próximas da transmissão grega e reconhecíveis ao leitor lusófono.
- source_word: ἐν Βαβυλῶνι
  choice: na Babilônia
  rationale: Equivalente locativo direto e idiomático em português.
theological_decisions:
- issue: Forma dos nomes genealógicos em um livro deuterocanônico grego
  choice: Usar as formas portuguesas tradicionais Baruque, Nerias, Maasias, Sedecias, Asadias e Helcias
  alternative: Usar formas semíticas reconstruídas, como Baruc, Nerias, Maaseias, Zedequias, Hasadias e Hilquias
  rationale: Como a fonte imediata é grega, as formas tradicionais portuguesas ligadas à tradição grega evitam reconstruir silenciosamente nomes semíticos. A nota em Asadias registra a alternativa relevante sem alterar o texto-base.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego, mas natural. A vírgula final do original foi representada por dois-pontos, pois o período introduz o conteúdo narrativo que continua no versículo seguinte.
