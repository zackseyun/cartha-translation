lexical_decisions:
- source_word: ἔκλαιον
  choice: choravam
  rationale: O imperfeito grego indica ação contínua ou repetida; o imperfeito português preserva naturalmente esse aspecto.
- source_word: ἐνήστευον
  choice: jejuavam
  rationale: Traduz diretamente o imperfeito de νηστεύω e mantém o paralelismo verbal da sequência.
- source_word: ηὔχοντο
  choice: oravam
  rationale: Em contexto religioso, εὔχομαι significa naturalmente 'orar'; o imperfeito acompanha as demais ações em curso.
- source_word: ἐναντίον
  choice: diante de
  rationale: Expressão portuguesa clara e digna para indicar presença e orientação reverente perante alguém.
- source_word: Κυρίου
  choice: o Senhor
  rationale: Tradução reverencial habitual de κύριος neste contexto judaico da Septuaginta, sem acrescentar uma identificação textual mais específica.
theological_decisions:
- issue: Tradução de Κυρίου em contexto judaico da Septuaginta
  choice: o Senhor
  alternative: Senhor
  rationale: Com ἐναντίον, 'diante do Senhor' é a formulação idiomática em português e conserva a referência reverencial ao Deus de Israel sem importar convenções tipográficas próprias de uma base hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação dos três verbos no imperfeito reproduz tanto a continuidade das ações quanto a estrutura repetitiva do grego.
