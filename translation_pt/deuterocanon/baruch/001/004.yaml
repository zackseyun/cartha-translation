translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa legibilidade brasileira. A tradução conserva a repetição retórica de “aos ouvidos”, a expressão literal “filhos dos reis” e o merismo social “do menor ao maior”. O travessão esclarece que “todos os que habitavam” retoma o conjunto do povo sem alterar a sintaxe ou resolver além do necessário a relação entre os grupos enumerados.
