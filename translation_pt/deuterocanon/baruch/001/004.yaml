  text: and in the hearing of the nobles and the sons of kings[a], and in the hearing of the elders, and in the hearing of all the people, from the least to the greatest[d][c][b], all who were dwelling in Babylon by the river Sud.
translation:
  language: pt
  text: e aos ouvidos dos poderosos e dos filhos dos reis, aos ouvidos dos anciãos e aos ouvidos de todo o povo, do menor ao maior, de todos os que habitavam na Babilônia junto ao rio Sud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome “Sud” é transliterado do grego; não se sabe ao certo qual rio ele designa.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ὠσίν / ἐν ὠσὶ
  choice: aos ouvidos de
  rationale: Preserva a imagem concreta e repetida do grego, que indica que a leitura foi feita de modo que essas pessoas a ouvissem; a expressão é inteligível em português no contexto iniciado no versículo anterior.
- source_word: τῶν δυνατῶν
  choice: dos poderosos
  rationale: O termo designa pessoas dotadas de poder ou proeminência. “Poderosos” mantém a amplitude lexical sem especificar uma condição nobiliárquica não expressa diretamente.
- source_word: υἱῶν τῶν βασιλέων
  choice: dos filhos dos reis
  rationale: Reproduz a construção relacional e plural do grego, sem convertê-la no título interpretativo “príncipes”.
- source_word: τῶν πρεσβυτέρων
  choice: dos anciãos
  rationale: Designa reconhecidos líderes da comunidade, e não apenas homens idosos; “anciãos” é a forma bíblica corrente e adequada ao contexto.
- source_word: παντὸς τοῦ λαοῦ
  choice: de todo o povo
  rationale: Mantém naturalmente em português o sentido coletivo e abrangente da expressão grega.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: do menor ao maior
  rationale: Preserva o merismo que abrange toda a escala social, sem restringi-lo indevidamente à idade.
- source_word: πάντων τῶν κατοικούντων
  choice: todos os que habitavam
  rationale: Representa a construção participial e concorda com o cenário narrativo passado.
- source_word: ἐν Βαβυλῶνι
  choice: na Babilônia
  rationale: Forma consagrada do topônimo em português; o artigo é natural no uso brasileiro.
- source_word: ἐπὶ ποταμοῦ Σούδ
  choice: junto ao rio Sud
  rationale: ἐπί com genitivo tem aqui valor locativo, indicando proximidade ou posição ao longo do rio. O nome é transliterado por ter identificação incerta.
