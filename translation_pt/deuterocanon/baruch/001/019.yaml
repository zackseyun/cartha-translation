base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/019.yaml
  text: From the day when the Lord brought our fathers out from the land of Egypt until this day[a], we have been disobedient to the Lord our God, and we have been negligent in not listening to his voice.
translation:
  language: pt
  text: Desde o dia em que o Senhor tirou nossos pais da terra do Egito até o dia de hoje, temos sido desobedientes ao Senhor, nosso Deus, e temos agido com negligência[a], não ouvindo a sua voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “temos agido de modo descuidado”. O verbo grego é incomum e pode indicar irreflexão ou negligência, sem necessariamente expressar obstinação deliberada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῆς ἡμέρας ἧς ... καὶ ἕως τῆς ἡμέρας ταύτης
  choice: Desde o dia em que ... até o dia de hoje
  rationale: Expressa com naturalidade o período contínuo iniciado no êxodo e prolongado até o presente da confissão.
- source_word: ἐξήγαγεν
  choice: tirou
  rationale: Verbo corrente e claro para a ação de fazer sair, preservando a referência ao êxodo.
- source_word: Κύριος
  choice: Senhor
  rationale: Corresponde diretamente ao título grego e mantém sua referência ao Deus de Israel sem introduzir uma forma tipográfica baseada no hebraico.
- source_word: τοὺς πατέρας ἡμῶν
  choice: nossos pais
  rationale: Preserva a formulação masculina e genealógica do grego, aqui referente aos antepassados de Israel.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: da terra do Egito
  rationale: Mantém tanto a ideia de saída quanto a expressão formal 'terra do Egito' em português idiomático.
- source_word: ἤμεθα ἀπειθοῦντες
  choice: temos sido desobedientes
  rationale: O pretérito perfeito composto comunica o padrão persistente de desobediência desde o passado até o presente.
- source_word: πρὸς Κύριον θεὸν ἡμῶν
  choice: ao Senhor, nosso Deus
  rationale: É o complemento natural de 'desobedientes' e preserva o título divino completo.
- source_word: ἐσχεδιάζομεν
  choice: temos agido com negligência
  rationale: O verbo raro sugere conduta descuidada, irrefletida ou negligente; esta tradução preserva essa amplitude sem intensificá-la para obstinação deliberada.
- source_word: πρὸς τὸ μὴ ἀκούειν τῆς φωνῆς αὐτοῦ
  choice: não ouvindo a sua voz
  rationale: Conserva a imagem bíblica de ouvir a voz de Deus e deixa aberta a relação exata entre a conduta negligente e a falta de escuta.
theological_decisions:
- issue: Título divino Κύριος no contexto pactual do êxodo
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-fonte grego traz Κύριος. 'Senhor' traduz diretamente o título e não importa para o texto grego a convenção tipográfica usada para o tetragrama hebraico.
- issue: Continuidade histórica da desobediência
  choice: temos sido desobedientes ... temos agido
  alternative: fomos desobedientes ... agimos
  rationale: A moldura temporal, do êxodo até o presente, e a construção perifrástica grega apresentam uma conduta persistente; o perfeito composto português torna essa continuidade explícita.
- issue: Grau de intencionalidade em ἐσχεδιάζομεν
  choice: temos agido com negligência
  alternative: temos sido obstinados
  rationale: O verbo é incomum e pode indicar descuido ou irreflexão. Evita-se atribuir obstinação deliberada, sentido mais específico e forte do que o termo exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula em “Senhor, nosso Deus” favorece a leitura natural, e a nota acompanha imediatamente a expressão lexicalmente incerta.
