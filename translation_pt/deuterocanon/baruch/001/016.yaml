  text: and to our kings and our rulers and our priests and our prophets and our fathers,[a]
translation:
  language: pt
  text: e aos nossos reis, aos nossos governantes, aos nossos sacerdotes, aos nossos profetas e aos nossos pais,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos nossos antepassados”. O termo grego traduzido como “pais” pode referir-se aos antepassados no contexto de um povo ou da aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦσιν
  choice: reis
  rationale: O dativo plural designa monarcas; “reis” é o equivalente português direto e preserva a posição política.
- source_word: ἄρχουσιν
  choice: governantes
  rationale: O termo designa pessoas investidas de autoridade; “governantes” preserva o sentido político amplo sem especificar um cargo.
- source_word: ἱερεῦσιν
  choice: sacerdotes
  rationale: É o termo grego comum para sacerdotes do culto, traduzido diretamente pelo equivalente consagrado em português.
- source_word: προφήταις
  choice: profetas
  rationale: Equivalente direto e natural, sem necessidade contextual de outra formulação.
- source_word: πατράσιν
  choice: pais
  rationale: Preserva a forma familiar masculina e sua ressonância comunitária e pactual; no contexto, pode abranger os antepassados, possibilidade indicada em nota.
- source_word: ἡμῶν
  choice: nossos/nossas
  rationale: O possessivo repetido no grego é mantido em cada elemento, com a concordância exigida pelo português, para conservar a força retórica e a identificação comunitária.
- source_word: καί
  choice: e
  rationale: A conjunção introduz e articula a continuação cumulativa da lista; sua presença é mantida de modo natural em português.
theological_decisions:
- issue: Sentido de πατράσιν na confissão comunitária
  choice: pais
  alternative: antepassados
  rationale: “Pais” conserva mais diretamente a expressão grega e sua possível ressonância pactual, enquanto a nota registra que, neste contexto nacional e histórico, o termo também pode significar “antepassados”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição dos possessivos acompanha a ênfase comunitária do grego, e a coordenação foi ajustada à fluência natural do português sem perder a estrutura cumulativa.
