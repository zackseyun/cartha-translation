  text: in the fifth year[a], on the seventh day of the month, at the time when the Chaldeans captured Jerusalem and burned it with fire.
translation:
  language: pt
  text: no quinto ano, no sétimo dia do mês[a], no tempo em que os caldeus capturaram Jerusalém e a queimaram com fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “no sétimo do mês”; a tradução entende a fórmula elíptica comum como “no sétimo dia do mês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ πέμπτῳ
  choice: no quinto ano
  rationale: Expressa de modo natural e formalmente próximo a indicação temporal introduzida por ἐν.
- source_word: ἐν ἑβδόμῃ τοῦ μηνός
  choice: no sétimo dia do mês
  rationale: O ordinal feminino ἑβδόμῃ aponta para a elipse de ἡμέρᾳ, ‘dia’, numa fórmula comum de datação; não indica ‘o sétimo mês’.
- source_word: ἐν τῷ καιρῷ ᾧ
  choice: no tempo em que
  rationale: Preserva explicitamente a ideia temporal de καιρός sem tornar a frase pouco natural em português.
- source_word: ἔλαβον
  choice: capturaram
  rationale: Com uma cidade como objeto, comunica claramente o sentido militar de λαμβάνω.
- source_word: οἱ Χαλδαῖοι
  choice: os caldeus
  rationale: Reproduz diretamente o etnônimo grego, sem substituí-lo pela identificação histórica interpretativa ‘babilônios’.
- source_word: ἐνέπρησαν αὐτὴν ἐν πυρί
  choice: a queimaram com fogo
  rationale: Mantém tanto o sentido de incendiar quanto a expressão instrumental explícita ἐν πυρί, preservando a ênfase do grego.
