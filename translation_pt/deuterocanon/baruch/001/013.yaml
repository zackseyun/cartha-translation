base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/013.yaml
  text: And pray for us to the Lord our God, because we have sinned against the Lord our God, and the anger of the Lord and his wrath has not turned away from us to this day.
translation:
  language: pt
  text: E orem por nós ao Senhor, nosso Deus, pois pecamos contra o Senhor, nosso Deus, e não se afastou de nós, até o dia de hoje, o furor do Senhor e a sua ira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεύξασθε περὶ ἡμῶν πρὸς Κύριον
  choice: orem por nós ao Senhor
  rationale: Reproduz diretamente o imperativo plural e o sentido de intercessão expresso por περὶ ἡμῶν, em português natural.
- source_word: ἡμάρτομεν τῷ κυρίῳ θεῷ ἡμῶν
  choice: pecamos contra o Senhor, nosso Deus
  rationale: O dativo após ἁμαρτάνω indica aquele contra quem se pecou; «contra» torna essa relação clara em português.
- source_word: ὁ θυμὸς Κυρίου καὶ ἡ ὀργὴ αὐτοῦ
  choice: o furor do Senhor e a sua ira
  rationale: 'Mantém os dois termos gregos distintos: θυμός como «furor» e ὀργή como «ira», sem fundi-los em uma única expressão.'
- source_word: οὐκ ἀπέστρεψεν ... ἀφʼ ἡμῶν
  choice: não se afastou de nós
  rationale: Conserva a imagem espacial de a ira não se retirar nem desviar do povo, além do singular verbal do texto grego mediante a colocação do sujeito depois do verbo.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: até o dia de hoje
  rationale: Equivalência idiomática próxima da expressão temporal grega, com registro bíblico claro e corrente.
theological_decisions:
- issue: A relação entre «furor» e «ira» e o verbo no singular
  choice: Preservar os dois substantivos e usar «não se afastou» no singular, com o sujeito posposto
  alternative: Empregar «não se afastaram» ou reduzir ambos os termos a «ira»
  rationale: O grego apresenta dois substantivos coordenados, mas usa ἀπέστρεψεν no singular. A formulação escolhida mantém essa tensão gramatical e semântica sem afirmar que os termos sejam necessariamente sinônimos absolutos ou realidades separadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «Senhor, nosso Deus» foi mantida por corresponder à ênfase do original. A ordem «não se afastou... o furor... e a sua ira» preserva de modo natural, embora marcado, o singular verbal grego.
