translation:
  language: pt
  text: e lhe desobedecemos, e não escutamos a voz do Senhor, nosso Deus, para andarmos segundo as determinações do Senhor que ele pôs diante de nós.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠπειθήσαμεν
  choice: lhe desobedecemos
  rationale: O aoristo de ἀπειθέω expressa desobediência ou recusa em obedecer; a formulação é concisa e mantém o objeto pronominal explícito.
- source_word: ἠκούσαμεν τῆς φωνῆς
  choice: não escutamos a voz
  rationale: Preserva a metáfora auditiva do grego e, no contexto, permite que permaneça perceptível a implicação de não obedecer.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: do Senhor, nosso Deus
  rationale: Traduz diretamente o título divino grego κύριος e mantém a relação expressa por 'nosso Deus', sem pressupor no texto-fonte grego a forma gráfica do Tetragrama.
- source_word: πορεύεσθαι
  choice: para andarmos
  rationale: Mantém a metáfora bíblica de andar como modo de conduta, evitando a paráfrase mais interpretativa 'vivermos'.
- source_word: τοῖς προστάγμασιν
  choice: segundo as determinações
  rationale: πρόσταγμα designa aquilo que foi prescrito ou ordenado; 'determinações' conserva o registro normativo e é compreensível em português atual.
- source_word: ἔδωκεν κατὰ πρόσωπον ἡμῶν
  choice: que ele pôs diante de nós
  rationale: Verte naturalmente o idiomatismo grego, comunicando que as determinações foram apresentadas ao povo para serem observadas.
theological_decisions:
- issue: Tradução de κύριος no contexto grego deuterocanônico
  choice: Senhor
  alternative: SENHOR
  rationale: Como o testemunho imediato está em grego e traz κύριος, 'Senhor' segue a primazia da fonte sem introduzir uma convenção gráfica baseada num Tetragrama não visível nesta linha.
- issue: Explicitação da obediência em ἠκούσαμεν τῆς φωνῆς
  choice: não escutamos a voz
  alternative: não obedecemos à voz
  rationale: A expressão implica obediência, mas conserva-se a imagem verbal do texto, sem reduzir sua tensão semântica a uma explicação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém a coordenação repetitiva do grego e a metáfora bíblica de 'andar', evitando linguagem excessivamente arcaica ou confessional.
