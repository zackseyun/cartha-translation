  text: καὶ δώσει Κύριος ἰσχὺν ἡμῖν καὶ φωτίσει τοὺς ὀφθαλμοὺς ἡμῶν, καὶ ζησόμεθα ὑπὸ τὴν σκιὰν Ναβουχοδονοσὸρ βασιλέως Βαβυλῶνος καὶ ὑπὸ τὴν σκιὰν Βαλτασὰρ υἱοῦ αὐτοῦ, καὶ δουλεύσομεν αὐτοῖς ἡμέρας πολλὰς καὶ εὑρήσομεν χάριν ἐναντίον αὐτῶν.
