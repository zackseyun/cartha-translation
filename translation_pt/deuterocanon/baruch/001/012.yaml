base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/012.yaml
  text: And the Lord will give us strength and enlighten our eyes[a], and we will live under the shadow of Nebuchadnezzar king of Babylon and under the shadow of Belshazzar his son[b], and we will serve them many days and find favor before them.
translation:
  language: pt
  text: E o Senhor nos dará força e iluminará nossos olhos; viveremos à sombra[a] de Nabucodonosor, rei da Babilônia, e à sombra de Belsazar, seu filho. Nós os serviremos por muitos dias e encontraremos favor diante deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob a proteção de” ou “sob o abrigo de”. O grego diz literalmente “à sombra de”, metáfora que pode sugerir tanto proteção quanto sujeição.
    reason: lexical_alternative
  - marker: b
    text: Ou “alcançaremos o favor deles”. A expressão grega diz literalmente “encontraremos favor diante deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχύν
  choice: força
  rationale: “Força” expressa de modo natural a capacidade ou o vigor que o Senhor concederá, sem ampliar o termo para “poder”.
- source_word: φωτίσει τοὺς ὀφθαλμοὺς ἡμῶν
  choice: iluminará os nossos olhos
  rationale: Mantém a imagem grega, que pode comunicar clareza, restauração e vitalidade renovada, sem reduzi-la a uma explicação.
- source_word: ζησόμεθα
  choice: viveremos
  rationale: Traduz diretamente o futuro de ζάω; “sobreviveremos” seria possível no contexto, mas acrescentaria uma nuance não explícita.
- source_word: ὑπὸ τὴν σκιὰν
  choice: à sombra de
  rationale: Preserva a metáfora do original e sua possível combinação de abrigo, dependência e sujeição política.
- source_word: Ναβουχοδονοσὸρ
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
- source_word: Βαλτασὰρ
  choice: Baltasar
  rationale: Forma tradicional e inteligível em português para o nome representado pelo grego Βαλτασάρ.
- source_word: δουλεύσομεν
  choice: os serviremos
  rationale: No contexto de submissão a governantes estrangeiros, “serviremos” conserva o sentido político sem tornar explícita uma escravidão institucional que a frase não destaca.
- source_word: ἡμέρας πολλὰς
  choice: por muitos dias
  rationale: Explicita naturalmente em português o valor temporal do acusativo grego.
- source_word: εὑρήσομεν χάριν ἐναντίον αὐτῶν
  choice: encontraremos favor diante deles
  rationale: Preserva o conhecido idioma bíblico e a estrutura espacial de ἐναντίον, mantendo leitura clara em português.
theological_decisions:
- issue: Sentido da metáfora “à sombra” em relação aos reis pagãos
  choice: Manter “à sombra de”
  alternative: “sob a proteção de” ou “sob o domínio de”
  rationale: A imagem grega pode sugerir tanto abrigo quanto sujeição. Mantê-la evita resolver indevidamente a tensão política e teológica da vida de Israel sob governantes estrangeiros.
- issue: Força de δουλεύσομεν no contexto do exílio
  choice: “os serviremos”
  alternative: “seremos escravos deles” ou “estaremos sujeitos a eles”
  rationale: “Serviremos” representa adequadamente a submissão política indicada no contexto, enquanto as alternativas explicitariam uma interpretação mais forte ou mais abstrata.
translation_notes:
  register: Português moderno, digno e acessível, com formas nominais bíblicas correntes no Brasil e compreensíveis internacionalmente. A pontuação divide a longa coordenação grega para favorecer a leitura sem alterar sua progressão. Os marcadores foram colocados junto às expressões a que as notas efetivamente se referem.
