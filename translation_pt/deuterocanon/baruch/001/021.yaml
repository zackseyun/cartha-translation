base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/001/021.yaml
  text: And we did not listen to the voice of the Lord our God[a], according to all the words of the prophets whom he sent to us,
translation:
  language: pt
  text: E não demos ouvidos à voz do Senhor, nosso Deus[a], conforme todas as palavras dos profetas que ele nos enviou,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedecemos à voz do Senhor, nosso Deus”. A expressão grega pode significar dar ouvidos ou atender, e não apenas escutar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: ouvimos
  rationale: Com a negação e o genitivo de 'voz', o verbo tem aqui o sentido de dar ouvidos, atender. 'Não ouvimos' preserva o conhecido idioma bíblico e sua força moral, sem explicitar demais como 'não obedecemos'.
- source_word: τῆς φωνῆς
  choice: a voz
  rationale: Tradução direta de φωνή, preservando a imagem bíblica e evitando confundi-la com as 'palavras' mencionadas em seguida.
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: do Senhor, nosso Deus
  rationale: Representa diretamente o grego κύριος ὁ θεὸς ἡμῶν. A vírgula produz uma formulação natural em português sem alterar a relação entre os termos.
- source_word: κατὰ πάντας τοὺς λόγους
  choice: conforme todas as palavras
  rationale: κατά com acusativo expressa conformidade. 'Conforme' é corrente, conciso e mantém a referência à totalidade da mensagem profética.
- source_word: τῶν προφητῶν
  choice: dos profetas
  rationale: Preserva o genitivo de maneira direta; a oração relativa seguinte identifica os profetas como enviados por Deus.
- source_word: ὧν ἀπέστειλεν πρὸς ἡμᾶς
  choice: que ele enviou a nós
  rationale: 'O pronome relativo retoma naturalmente ''os profetas''. πρὸς ἡμᾶς indica direção: ''a nós''.'
theological_decisions:
- issue: Força pactual de ouvir a voz do Senhor
  choice: não ouvimos a voz do Senhor, nosso Deus
  alternative: não obedecemos à voz do Senhor, nosso Deus
  rationale: '''Não ouvimos'' conserva a tensão semântica entre ouvir e atender/obedecer presente no idioma bíblico, enquanto a nota esclarece a força contextual sem inseri-la de modo exclusivo no texto.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se o encadeamento e a vírgula final do versículo-fonte, pois a frase prossegue no contexto.
