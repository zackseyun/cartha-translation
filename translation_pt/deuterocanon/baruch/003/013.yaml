  text: If you had walked in the way of God, you would have lived in peace forever.
translation:
  language: pt
  text: Se você tivesse andado no caminho de Deus, teria vivido em paz para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ὁδῷ
  choice: no caminho
  rationale: Preserva a metáfora de ὁδός como caminho ou modo de vida; com «andar», a expressão é natural e reconhecível em português bíblico atual.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Reproduz diretamente o genitivo e mantém aberta a ideia de caminho pertencente a Deus ou por ele prescrito.
- source_word: εἰ ἐπορεύθης
  choice: Se você tivesse andado
  rationale: A construção condicional, junto de ἄν na oração principal, indica uma situação irreal no passado. «Andado» conserva a metáfora de conduta.
- source_word: κατῴκεις ἂν
  choice: teria vivido
  rationale: Embora κατοικέω tenha o sentido básico de habitar ou residir, «teria vivido em paz» comunica com naturalidade a existência estável expressa no contexto.
- source_word: ἐν εἰρήνῃ
  choice: em paz
  rationale: Mantém o substantivo e apresenta a paz como estado ou condição, sem reduzi-la ao advérbio «pacificamente».
- source_word: τὸν αἰῶνα
  choice: para sempre
  rationale: A expressão acusativa tem valor adverbial de duração contínua; «para sempre» é a forma portuguesa natural para esse sentido.
theological_decisions:
- issue: Construção condicional e situação irreal implícita
  choice: «Se você tivesse andado... teria vivido...»
  alternative: «Se você andasse... viveria...»
  rationale: O aoristo indicativo depois de εἰ, com ἄν na oração principal, aponta para uma condição contrária ao fato no passado e preserva o tom de lamento.
- issue: Força metafórica de «o caminho de Deus»
  choice: Manter «no caminho de Deus»
  alternative: «Se você tivesse obedecido a Deus»
  rationale: O grego apresenta a imagem ampla do caminho, não uma referência explícita apenas à lei ou aos mandamentos; a tradução evita estreitar a formulação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de «você» explicita o singular de segunda pessoa do grego; a formulação mantém a metáfora bíblica sem soar arcaica.
