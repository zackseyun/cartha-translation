  text: nor was it heard in Canaan[a], nor was it seen in Teman;
translation:
  language: pt
  text: nem se ouviu falar dela[a] em Canaã, nem foi vista em Temã;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a sabedoria mencionada no contexto; neste versículo, o grego deixa o referente implícito.
    reason: Esclarece o referente contextual do pronome sem inseri-lo como substantivo no texto principal.
lexical_decisions:
- source_word: οὐδὲ
  choice: nem
  rationale: Mantém a negação cumulativa e coordena naturalmente as duas orações com o contexto anterior.
- source_word: ἠκούσθη
  choice: se ouviu falar dela
  rationale: O aoristo passivo de ἀκούω indica aqui que a sabedoria não chegou a ser conhecida ou mencionada naquele lugar; esta formulação é natural em português e evita a leitura meramente acústica de «foi ouvida».
- source_word: ἐν
  choice: em
  rationale: Expressa diretamente a localização geográfica nas duas ocorrências.
- source_word: Χαναὰν
  choice: Canaã
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: ὤφθη
  choice: foi vista
  rationale: Preserva a imagem visual do aoristo passivo de ὁράω e o paralelismo com a primeira oração, sem interpretar o verbo como «foi encontrada».
- source_word: Θαιμάν
  choice: Temã
  rationale: Forma bíblica tradicional do topônimo em português, normalmente associado a Edom.
theological_decisions:
- issue: Referente do sujeito implícito dos verbos passivos
  choice: Retomar a sabedoria por meio do pronome «dela», sem repetir o substantivo no versículo.
  alternative: 'Explicitar «a sabedoria»: «nem se ouviu falar da sabedoria...»'
  rationale: O grego depende do contexto imediato e não repete o substantivo. O pronome produz uma frase natural em português, mantém a ligação contextual e evita uma expansão substantiva do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção «se ouviu falar dela» comunica idiomaticamente conhecimento ou notícia, enquanto «foi vista» conserva o paralelismo imagético do grego.
