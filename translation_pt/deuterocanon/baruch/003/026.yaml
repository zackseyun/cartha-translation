  text: There the giants were born[a], those renowned from the beginning, great in size, skilled in war.
translation:
  language: pt
  text: Ali nasceram os gigantes[a], famosos desde os tempos antigos, de grande porte e hábeis na guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ali nasceram os gigantes, os famosos que surgiram desde o princípio”. A construção grega é compacta e também pode ligar “desde o princípio” mais diretamente ao fato de eles terem surgido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: Ali
  rationale: Advérbio de lugar que retoma o contexto anterior; “Ali” é direto e natural em português.
- source_word: ἐγεννήθησαν
  choice: nasceram
  rationale: O aoristo passivo de γεννάω expressa aqui nascimento; “nasceram” preserva com clareza essa imagem.
- source_word: οἱ γίγαντες
  choice: os gigantes
  rationale: É o equivalente lexical e tradicional de γίγαντες, sem impor uma identificação mitológica ou intertextual específica.
- source_word: οἱ ὀνομαστοὶ ἀπʼ ἀρχῆς γενόμενοι
  choice: famosos desde os tempos antigos
  rationale: A expressão grega é compacta e associa a notoriedade desses gigantes à sua origem em tempos remotos. A formulação portuguesa transmite naturalmente o sentido sem apagar a dificuldade sintática, registrada em nota.
- source_word: εὐμεγέθεις
  choice: de grande porte
  rationale: Expressa tamanho corporal avantajado em linguagem moderna e digna.
- source_word: ἐπιστάμενοι πόλεμον
  choice: hábeis na guerra
  rationale: ἐπίσταμαι indica conhecimento prático ou competência; a expressão comunica concisamente sua aptidão guerreira.
theological_decisions:
- issue: Identidade e conotações dos gigantes
  choice: Manter “os gigantes” como tradução direta de οἱ γίγαντες.
  alternative: “os poderosos” ou “os nefilins”
  rationale: “Nefilins” importaria uma identificação intertextual não explicitada no verso, enquanto “poderosos” enfraqueceria o sentido lexical do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “De grande porte” evita tanto arcaísmo quanto tom mitológico adicional; a nota preserva a ambiguidade da construção participial grega.
