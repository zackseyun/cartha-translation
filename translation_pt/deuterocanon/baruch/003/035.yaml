base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/035.yaml
  text: He called them[a], and they said, ‘Here we are’[c][b]; they shone with gladness for the one who made them.
translation:
  language: pt
  text: 'Ele os[a] chamou, e eles disseram: “Aqui estamos.”[b] Brilharam com alegria para aquele que os fez.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No contexto anterior, “os” se refere aos astros, apresentados poeticamente como seres que respondem ao Criador.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Estamos aqui”. A expressão comunica presença e prontidão em resposta ao chamado.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “diante daquele que os fez” ou “àquele que os fez”; o dativo grego permite mais de uma nuance de relação.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: O aoristo de καλέω significa chamar ou convocar. “Chamou” é direto, natural e preserva o vínculo com a resposta que vem em seguida.
- source_word: αὐτούς
  choice: os
  rationale: O pronome masculino plural retoma, no contexto anterior, os astros personificados.
- source_word: εἶπον
  choice: disseram
  rationale: Traduz diretamente o verbo de fala. Embora “responderam” seja possível pelo contexto da chamada, “disseram” preserva a formulação grega sem perder o caráter responsivo.
- source_word: Πάρεσμεν
  choice: Aqui estamos
  rationale: A forma expressa presença e prontidão em resposta a uma chamada. “Aqui estamos” é idiomático e mantém essa força responsiva.
- source_word: ἔλαμψαν
  choice: Brilharam
  rationale: λάμπω designa o ato de brilhar ou emitir luz; “brilharam” é claro e adequado aos astros do contexto.
- source_word: μετʼ εὐφροσύνης
  choice: com alegria
  rationale: Preserva a construção preposicional e traduz εὐφροσύνη em linguagem atual, digna e natural.
- source_word: τῷ ποιήσαντι αὐτούς
  choice: para aquele que os fez
  rationale: O dativo indica uma relação ou orientação dos astros para com seu Criador. “Para” conserva essa abertura sem impor uma precisão ausente do grego.
theological_decisions:
- issue: Personificação dos astros em resposta ao Criador
  choice: Manter diretamente a imagem dos astros que falam e brilham com alegria.
  alternative: Transformar a passagem em uma descrição astronômica impessoal.
  rationale: O grego retrata poeticamente os corpos celestes respondendo ao chamado daquele que os fez; a tradução preserva essa personificação e a tensão poético-teológica do texto.
- issue: Relação expressa pelo dativo τῷ ποιήσαντι αὐτούς
  choice: “para aquele que os fez”
  alternative: “diante daquele que os fez” ou “àquele que os fez”
  rationale: O dativo admite mais de uma nuance relacional. A opção principal é natural em português, enquanto a nota registra as alternativas legítimas sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é simples e digno; preserva a personificação poética, a sequência verbal concisa do grego e a ambiguidade do dativo por meio de nota.
