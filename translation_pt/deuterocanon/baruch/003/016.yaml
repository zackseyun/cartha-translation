translation:
  language: pt
  text: Onde estão os governantes das nações e os que dominam as feras da terra?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os animais selvagens que estão sobre a terra”. O termo grego pode designar feras em geral ou, mais especificamente, animais selvagens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: Onde estão
  rationale: Reproduz diretamente a pergunta sobre o paradeiro ou a condição presente das pessoas mencionadas, sem acrescentar ênfase ausente do grego.
- source_word: οἱ ἄρχοντες τῶν ἐθνῶν
  choice: os governantes das nações
  rationale: Expressa com clareza atual a autoridade política indicada por ἄρχοντες e entende ἐθνῶν em seu sentido amplo de nações, sem restringi-lo a “gentios”.
- source_word: οἱ κυριεύοντες
  choice: os que dominam
  rationale: Comunica o exercício de domínio expresso pelo particípio κυριεύοντες. “Dominam” também se ajusta naturalmente ao objeto animal e preserva a força do verbo.
- source_word: τῶν θηρίων
  choice: as feras
  rationale: Mantém o tom elevado e a amplitude possível de θηρία, que pode designar feras em geral ou, mais especificamente, animais selvagens.
- source_word: τῶν ἐπὶ τῆς γῆς
  choice: da terra
  rationale: É uma formulação portuguesa natural para identificar as feras que estão sobre a terra, sem alterar o referente da expressão grega.
