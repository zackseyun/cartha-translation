base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/004.yaml
  text: Lord Almighty[a], God of Israel, please hear the prayer of the dead of Israel and of the sons who sinned before you, who did not listen to the voice of you, their God, and the evils have clung to us.
translation:
  language: pt
  text: Senhor Todo-Poderoso, Deus de Israel, escuta, por favor, a oração dos mortos de Israel e dos filhos que pecaram diante de ti, os quais não deram ouvidos à tua voz, tu, o Deus deles; e os males se apegaram a nós.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as calamidades se apegaram a nós” ou “as desgraças ficaram grudadas em nós”. O grego diz literalmente: “os males se apegaram a nós”.'
    reason: Alternativa lexical para τὰ κακά e explicitação da metáfora de ἐκολλήθη.
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: Senhor Todo-Poderoso
  rationale: Emprega os títulos divinos consagrados em português e expressa com naturalidade a soberania universal indicada por παντοκράτωρ.
- source_word: ἄκουσον δὴ
  choice: escuta, por favor
  rationale: O imperativo ἄκουσον pede que Deus ouça, enquanto δή reforça aqui o tom de súplica; «por favor» comunica essa força em português corrente.
- source_word: τῶν τεθνηκότων Ἰσραήλ
  choice: dos mortos de Israel
  rationale: Mantém a expressão marcante e literalmente orientada do grego, sem decidir se também possui sentido figurado.
- source_word: υἱῶν τῶν ἁμαρτανόντων ἐναντίον σου
  choice: dos filhos que pecaram diante de ti
  rationale: Preserva o masculino explícito de υἱῶν e verte ἐναντίον σου sem substituir sua amplitude pela interpretação mais específica «contra ti».
- source_word: οἳ οὐκ ἤκουσαν τῆς φωνῆς σου θεοῦ αὐτῶν
  choice: os quais não deram ouvidos à tua voz, à voz de seu Deus
  rationale: «Dar ouvidos» conserva a imagem auditiva e sugere desobediência. A repetição de «à voz» torna clara e natural em português a aposição θεοῦ αὐτῶν à pessoa divina interpelada.
- source_word: ἐκολλήθη ἡμῖν τὰ κακά
  choice: os males se apegaram a nós
  rationale: Conserva tanto a amplitude de τὰ κακά quanto a metáfora vívida de κολλάω; a nota registra sentidos contextuais mais concretos.
theological_decisions:
- issue: Sentido de «os mortos de Israel»
  choice: Mantida como referência literal aos mortos de Israel.
  alternative: Israelitas figuradamente ou espiritualmente mortos.
  rationale: τῶν τεθνηκότων Ἰσραήλ designa diretamente os que morreram; qualquer dimensão retórica adicional não deve substituir o teor literal na tradução.
- issue: Força de τὰ κακά
  choice: «os males» no texto principal.
  alternative: «as calamidades» ou «as desgraças».
  rationale: O termo pode abranger males em sentido amplo ou adversidades concretas. O texto principal conserva essa amplitude, e a nota apresenta o sentido contextual possível.
- issue: Força de ἐναντίον σου
  choice: «diante de ti».
  alternative: «contra ti».
  rationale: A expressão pode indicar presença e, no contexto do pecado, oposição. «Diante de ti» preserva a ambiguidade sem eliminar a gravidade já comunicada pelo verbo «pecar».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Escuta» é usado como imperativo corrente em oração; «não deram ouvidos» comunica naturalmente a recusa em ouvir/obedecer. A pontuação evita uma cadeia excessiva de coordenações sem acrescentar relação causal ausente do grego.
