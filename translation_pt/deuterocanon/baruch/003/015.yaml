  text: Who found her place[a], and who entered into her treasuries?
translation:
  language: pt
  text: Quem encontrou o lugar dela, e quem entrou nos seus depósitos[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tesouros”. O termo grego pode indicar tanto os tesouros quanto os depósitos ou câmaras onde são guardados; “depósitos” foi escolhido porque o texto diz que alguém “entrou” neles.
    reason: alternativa lexical
lexical_decisions:
- source_word: τίς
  choice: Quem
  rationale: Introduz diretamente cada pergunta retórica e corresponde ao pronome interrogativo grego.
- source_word: εὗρεν
  choice: encontrou
  rationale: O aoristo é expresso naturalmente pelo pretérito perfeito, sem acrescentar aspecto ou explicação.
- source_word: τὸν τόπον αὐτῆς
  choice: o lugar dela
  rationale: Preserva o sentido comum de τόπος e a referência feminina à Sabedoria personificada, sem transformar o lugar em morada.
- source_word: εἰσῆλθεν εἰς
  choice: entrou em
  rationale: Expressa de modo natural em português o movimento para dentro indicado pelo verbo e pela preposição.
- source_word: τοὺς θησαυροὺς αὐτῆς
  choice: seus depósitos
  rationale: θησαυρός pode designar tanto tesouros quanto os lugares em que são guardados. O sentido locativo combina melhor com 'entrou em', enquanto a nota preserva a alternativa lexical.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: Manter a referência feminina por meio de 'dela' e 'seus'
  alternative: Tratar a sabedoria de modo impessoal
  rationale: O grego emprega formas femininas, e o contexto apresenta a Sabedoria como personificada. A tradução conserva essa apresentação literária sem identificar a figura além do que o texto afirma.
translation_notes:
  register: Português atual, claro e digno, com paralelismo retórico preservado. 'O lugar dela' mantém a metáfora e a personificação do original; 'depósitos' evita a leitura pouco natural de entrar em riquezas abstratas, e a nota registra a ambiguidade.
