base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/005.yaml
  text: Do not remember the unrighteous acts of our fathers[b][a], but remember your hand and your name at this time.
translation:
  language: pt
  text: Não te lembres dos atos injustos de nossos pais[a]; mas, neste momento, lembra-te da tua mão[b] e do teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das maldades de nossos pais”.'
    reason: lexical_alternative
  - marker: b
    text: Na linguagem bíblica, a “mão” de Deus pode representar seu poder ou sua ação poderosa.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ μνησθῇς ... μνήσθητι
  choice: não te lembres ... lembra-te
  rationale: Repete o mesmo verbo para preservar o contraste retórico deliberado entre não recordar as faltas passadas e recordar a mão e o nome de Deus.
- source_word: ἀδικιῶν
  choice: atos injustos
  rationale: Expressa ações moralmente erradas sem restringir o sentido à injustiça social nem substituir o termo grego pelo mais específico “pecados”.
- source_word: πατέρων ἡμῶν
  choice: de nossos pais
  rationale: Mantém a referência masculina explícita aos pais das gerações anteriores; “antepassados” seria uma possível explicitação contextual.
- source_word: χειρός σου
  choice: tua mão
  rationale: Conserva a metáfora bíblica, que pode evocar o poder e a atuação de Deus, sem transformar essa implicação em paráfrase no texto principal.
- source_word: ὀνόματός σου
  choice: teu nome
  rationale: Preserva a expressão bíblica e sua amplitude semântica, que inclui identidade, honra e reputação.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: neste momento
  rationale: Formulação corrente em português para a circunstância presente e urgente indicada por καιρός.
theological_decisions:
- issue: Sentido de “lembra-te da tua mão e do teu nome”
  choice: Manter literalmente “mão” e “nome”, deixando implícito o apelo para que Deus aja de acordo com seu poder e sua identidade ou honra.
  alternative: Explicitar como “lembra-te do teu poder e da honra do teu nome”.
  rationale: A formulação literal conserva a linguagem da oração e sua riqueza teológica sem impor ao texto uma única explicação da imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção pronominal preserva o tom direto da oração; o ponto e vírgula e “mas” mantêm a oposição enfática do grego.
