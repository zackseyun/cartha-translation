base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/028.yaml
  text: And they perished for lack of understanding[a]; they perished because of their own lack of counsel.
translation:
  language: pt
  text: E eles pereceram por não terem discernimento[a]; pereceram por sua falta de bom senso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por não terem prudência; pereceram por causa de sua falta de juízo”.'
    reason: Registra alternativas legítimas para φρόνησις e ἀβουλία, preservando a dimensão de prudência e deliberação presente no grego.
lexical_decisions:
- source_word: ἀπώλοντο
  choice: pereceram
  rationale: Preserva o tom solene e o sentido de ruína ou destruição sem especificar indevidamente morte violenta nem voz passiva.
- source_word: παρὰ τὸ μὴ ἔχειν
  choice: por não terem
  rationale: Expressa de modo natural a relação causal da construção grega παρὰ τό com infinitivo.
- source_word: φρόνησιν
  choice: discernimento
  rationale: Comunica a compreensão prática e prudente indicada por φρόνησις, sem reduzi-la a mero conhecimento intelectual.
- source_word: διὰ τὴν ἀβουλίαν αὐτῶν
  choice: por falta de bom senso
  rationale: ἀβουλία indica ausência de deliberação ou juízo sensato; a construção com 'por falta de' mantém a causalidade, e o possessivo é naturalmente compreendido pelo sujeito em português.
theological_decisions:
- issue: Natureza da causa da perdição
  choice: A perdição é atribuída à ausência de discernimento e de bom senso.
  alternative: Explicitar a deficiência como insensatez moral ou culpa deliberada.
  rationale: O grego emprega vocabulário sapiencial de compreensão prática e deliberação deficiente, sem desenvolver aqui uma explicação doutrinária mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com cadência solene. Mantém-se a repetição de “pereceram”, correspondente ao paralelismo enfático do original.
