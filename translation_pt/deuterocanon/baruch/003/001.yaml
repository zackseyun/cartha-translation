base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/001.yaml
  text: Lord Almighty[a], God of Israel, a soul in distress and a discouraged spirit has cried out to you.
translation:
  language: pt
  text: Senhor Todo-Poderoso, Deus de Israel, uma alma em aflição e um espírito desalentado clamaram a ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, o verbo está no singular: “clamou a ti”. “Em aflição” também pode ser traduzido por “em aperto”, e “desalentado”, por “abatido” ou “sem ânimo”.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: Κύριε Παντοκράτωρ
  choice: Senhor Todo-Poderoso
  rationale: Mantém a invocação divina e traduz o título estabelecido da Septuaginta em linguagem natural e reverente.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Deus de Israel
  rationale: Preserva o título divino em aposição direta, sem artigo, como é natural numa invocação em português.
- source_word: ψυχὴ ἐν στενοῖς
  choice: uma alma em aflição
  rationale: Conserva ψυχή como termo antropológico distinto e comunica idiomaticamente a condição de aperto, angústia ou grave dificuldade expressa por ἐν στενοῖς.
- source_word: πνεῦμα ἀκηδιῶν
  choice: um espírito desalentado
  rationale: Preserva o paralelismo entre alma e espírito; 'desalentado' expressa abatimento, cansaço interior e perda de ânimo sem impor uma leitura clínica.
- source_word: κέκραγεν πρὸς σέ
  choice: clamaram a ti
  rationale: O perfeito grego apresenta o clamor já levantado com relevância presente. O plural em português acomoda naturalmente os dois sintagmas coordenados, embora o grego empregue verbo singular e possa concebê-los como uma unidade poética.
theological_decisions:
- issue: Relação entre ψυχή e πνεῦμα
  choice: Manter os termos distintos como 'alma' e 'espírito'
  alternative: Fundir ambos em uma expressão como 'coração abatido' ou traduzir ψυχή por 'pessoa'
  rationale: A distinção preserva o paralelismo poético e a textura antropológica do grego sem transformá-la numa definição técnica da constituição humana.
- issue: Concordância singular de κέκραγεν com dois termos interiores
  choice: Usar o plural português 'clamaram'
  alternative: Usar o singular 'clamou', entendendo 'alma... e espírito...' como uma unidade ou um sujeito composto com concordância ad sensum
  rationale: Em português corrente, dois núcleos coordenados pedem naturalmente o plural. A nota registra o singular grego e preserva sua possível força unitária, sem produzir uma concordância portuguesa artificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação 'a ti' mantém o tom de oração sem arcaísmo excessivo. O marcador foi colocado após a oração à qual a nota se refere.
