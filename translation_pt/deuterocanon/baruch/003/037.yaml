base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/037.yaml
  text: He found every way of knowledge[a], and gave it to Jacob his servant and to Israel his beloved.
translation:
  language: pt
  text: Ele descobriu todo caminho do conhecimento e o deu a Jacó, seu servo[a], e a Israel, seu amado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filho” ou “criança”; o grego παῖς pode ter esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεῦρεν
  choice: descobriu
  rationale: Expressa de modo natural o ato de encontrar ou chegar a conhecer, preservando a força do verbo composto.
- source_word: πᾶσαν ὁδὸν ἐπιστήμης
  choice: todo caminho do conhecimento
  rationale: Mantém a metáfora de ὁδός e o sentido direto de ἐπιστήμη, sem substituí-lo pelo termo teologicamente mais específico “sabedoria”.
- source_word: ἔδωκεν αὐτήν
  choice: o deu
  rationale: O pronome retoma “caminho”, substantivo masculino em português; por isso, a concordância natural exige “o”.
- source_word: τῷ παιδὶ αὐτοῦ
  choice: seu servo
  rationale: No contexto da relação de Jacó com Deus, “servo” corresponde bem ao uso bíblico de παῖς, enquanto a nota preserva os sentidos alternativos legítimos.
- source_word: τῷ ἠγαπημένῳ ὑπʼ αὐτοῦ
  choice: seu amado
  rationale: Forma concisa e natural de traduzir “aquele que é amado por ele”, preservando a força relacional do particípio passivo.
- source_word: Ἰακὼβ ... Ἰσραὴλ
  choice: Jacó ... Israel
  rationale: Mantém os dois nomes e o paralelismo do texto grego, sem fundi-los nem explicitar além do original que designam o mesmo povo.
theological_decisions:
- issue: Sentido de παῖς aplicado a Jacó em relação a Deus
  choice: servo
  alternative: filho ou criança
  rationale: “Servo” se ajusta ao uso pactual e bíblico neste contexto, mas a polissemia genuína do grego é preservada em nota.
- issue: Paralelismo entre Jacó e Israel
  choice: manter os dois nomes
  alternative: fundir em uma única designação, como “Jacó/Israel”
  rationale: O grego apresenta as duas designações em paralelo; mantê-las conserva a forma literária e evita resolver interpretativamente a relação entre elas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura paralela próxima do grego. “Descobriu” evita a rigidez de uma tradução excessivamente literal, e a nota registra a ambiguidade relevante de παῖς.
