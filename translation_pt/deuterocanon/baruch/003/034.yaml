  text: And the stars shone in their watches and rejoiced;[a]
translation:
  language: pt
  text: E as estrelas brilharam em seus postos de vigília e se alegraram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em suas vigílias», «em suas posições» ou «em seus cursos». A palavra grega pode designar vigílias ou postos de guarda e, nesta linguagem poética, refere-se aos lugares ou tempos determinados para as estrelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: estrelas
  rationale: Equivalente direto e natural para os corpos celestes mencionados no plural.
- source_word: ἔλαμψαν
  choice: brilharam
  rationale: Expressa de modo corrente e conciso a emissão de luz indicada pelo aoristo de λάμπω.
- source_word: ἐν ταῖς φυλακαῖς αὐτῶν
  choice: em seus postos de vigília
  rationale: Preserva a imagem de φυλακαί como vigílias ou postos designados, sem defini-la de forma excessivamente específica como órbitas ou cursos astronômicos.
- source_word: εὐφράνθησαν
  choice: se alegraram
  rationale: Reproduz naturalmente a alegria atribuída poeticamente às estrelas e conserva sua personificação.
theological_decisions:
- issue: Personificação poética das estrelas
  choice: Manter diretamente que as estrelas «se alegraram»
  alternative: Reformular como uma descrição astronômica impessoal
  rationale: O grego atribui alegria às estrelas como parte da representação poética da criação em resposta à ordem divina; despersonalizar a frase reduziria esse efeito literário e teológico.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. «Postos de vigília» conserva a imagem grega, enquanto a nota registra as possibilidades espacial e temporal sem eliminar a ambiguidade.
