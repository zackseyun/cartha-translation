  text: This is our God[a]; no other will be reckoned beside him.
translation:
  language: pt
  text: Este é o nosso Deus; nenhum outro será considerado ao lado dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «nenhum outro será considerado comparável a ele».'
    reason: A expressão grega πρὸς αὐτόν pode indicar tanto estar ao lado de alguém quanto ser posto em comparação com essa pessoa.
lexical_decisions:
- source_word: οὗτος
  choice: Este é
  rationale: O demonstrativo funciona de modo predicativo com «o nosso Deus»; «Este é» reproduz naturalmente a identificação enfática.
- source_word: ὁ θεὸς ἡμῶν
  choice: o nosso Deus
  rationale: Mantém de forma clara e natural a construção possessiva e sua força relacional.
- source_word: οὐ λογισθήσεται
  choice: nenhum ... será considerado
  rationale: O futuro passivo de λογίζομαι indica ser contado, avaliado ou tido como tal. «Será considerado» preserva a voz passiva e soa corrente em português.
- source_word: ἕτερος
  choice: outro
  rationale: Expressa a alteridade e a exclusividade sem acrescentar explicitamente «deus», termo que o grego deixa subentendido.
- source_word: πρὸς αὐτόν
  choice: ao lado dele
  rationale: Neste contexto, πρός exprime relação ou comparação. «Ao lado dele» conserva a imagem relacional sem transformar a frase numa paráfrase doutrinária.
theological_decisions:
- issue: Afirmação da singularidade de Deus na oração comparativa
  choice: nenhum outro será considerado ao lado dele
  alternative: nenhum outro será considerado comparável a ele
  rationale: A formulação escolhida mantém a construção passiva e comparativa do grego, afirmando a exclusividade de Deus sem expandi-la para «não existe outro Deus».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo conciso do grego foram preservados; a nota registra a nuance comparativa sem sobrecarregar o texto principal.
