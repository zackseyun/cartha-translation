base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/014.yaml
  text: Learn where prudence is[a], where strength is, where understanding is, so that you may know at the same time where length of days and life are[b], where light for the eyes and peace are.
translation:
  language: pt
  text: Aprenda onde está a prudência, onde está a força, onde está o entendimento, para saber também onde estão a longevidade e a vida, onde estão a luz dos olhos[a] e a paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Luz dos olhos” é uma metáfora literal que pode sugerir vitalidade, alegria ou clareza.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάθε
  choice: Aprenda
  rationale: O imperativo aoristo de μανθάνω exorta o leitor a adquirir conhecimento; “Aprenda” preserva de modo direto e natural essa força.
- source_word: φρόνησις
  choice: prudência
  rationale: Expressa sabedoria prática e bom senso, mantendo-se distinta de σύνεσις.
- source_word: ἰσχύς
  choice: força
  rationale: Equivalente corrente e não exagerado para vigor ou poder neste contexto sapiencial.
- source_word: σύνεσις
  choice: entendimento
  rationale: Comunica compreensão e mantém a distinção lexical em relação a φρόνησις.
- source_word: τοῦ γνῶναι
  choice: para saber
  rationale: O infinitivo articular admite sentido de propósito; a construção portuguesa é natural e preserva essa relação.
- source_word: ἅμα
  choice: também
  rationale: Neste encadeamento, indica que o aprendizado permite conhecer juntamente esses outros bens; “também” é mais natural em português do que “ao mesmo tempo” sem eliminar a ideia cumulativa.
- source_word: μακροβίωσις
  choice: longevidade
  rationale: Traduz diretamente a duração prolongada da vida e evita a possível redundância estilística de “longa vida e vida”, sem acrescentar prosperidade.
- source_word: ζωή
  choice: vida
  rationale: Equivalente padrão, adequado ao contexto.
- source_word: φῶς ὀφθαλμῶν
  choice: luz dos olhos
  rationale: Preserva a metáfora literal e soa natural no registro bíblico em português.
- source_word: εἰρήνη
  choice: paz
  rationale: Mantém o equivalente bíblico usual sem restringir nem expandir o campo semântico para “bem-estar”.
theological_decisions:
- issue: Distinção entre os termos ligados à sabedoria
  choice: Manter φρόνησις, ἰσχύς e σύνεσις como “prudência”, “força” e “entendimento”.
  alternative: Fundir φρόνησις e σύνεσις sob “sabedoria” ou “entendimento”.
  rationale: A enumeração grega apresenta bens distintos; preservá-los evita nivelar a tensão e a variedade conceitual do texto.
- issue: Relação entre μακροβίωσις e ζωή
  choice: Traduzir como “longevidade e vida”.
  alternative: “longura de dias e vida” ou “longa vida e prosperidade”.
  rationale: O grego nomeia separadamente duração prolongada e vida. “Longevidade e vida” mantém ambos sem introduzir “prosperidade”, ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. A repetição de “onde está/estão” conserva a estrutura retórica do grego. Emprega-se “longevidade” por clareza contemporânea, e a metáfora “luz dos olhos” é mantida no texto.
