translation:
  language: pt
  text: Deus não escolheu esses, nem lhes deu o caminho do conhecimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ τούτους ἐξελέξατο ὁ θεός
  choice: Deus não escolheu esses
  rationale: A ordem foi ajustada ao português natural, preservando a negação, o verbo de escolha e a força demonstrativa de τούτους, que aponta para os grupos mencionados no contexto.
- source_word: οὐδὲ
  choice: nem
  rationale: Coordena com clareza a segunda oração negativa à primeira e conserva o paralelismo do grego.
- source_word: ὁδὸν ἐπιστήμης
  choice: o caminho do conhecimento
  rationale: Mantém de perto a construção grega e seu idioma sapiencial, sem acrescentar a ideia direcional de um caminho que leva ao conhecimento.
- source_word: ἔδωκεν αὐτοῖς
  choice: lhes deu
  rationale: É a forma corrente e concisa em português de expressar que Deus deu algo a eles, sem acrescentar a nuance de 'conceder'.
theological_decisions:
- issue: Preservar ou não a força demonstrativa de τούτους
  choice: esses
  alternative: eles
  rationale: O demonstrativo retoma de maneira específica os personagens ou grupos do contexto anterior. 'Esses' conserva essa referência sem identificar além do que o texto permite.
- issue: Sentido da expressão ὁδὸν ἐπιστήμης
  choice: o caminho do conhecimento
  alternative: o caminho para o conhecimento; o caminho do entendimento
  rationale: A formulação escolhida preserva a relação genitiva e a linguagem sapiencial do original, evitando transformar implicitamente o conhecimento em mero destino do caminho.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A concisão e o paralelismo do grego foram preservados.
