translation:
  language: pt
  text: Pois tu és o Senhor, nosso Deus, e nós te louvaremos, Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão que fundamenta o apelo anterior; “pois” preserva a conexão explicativa de modo natural e digno.
- source_word: σὺ
  choice: tu
  rationale: O pronome explícito é enfático. “Tu” mantém essa ênfase e se harmoniza com o registro tradicional de oração, sem arcaísmo excessivo.
- source_word: Κύριος
  choice: Senhor
  rationale: Como título divino e forma de tratamento, “Senhor” corresponde ao uso da Septuaginta e é a tradução portuguesa consagrada.
- source_word: ὁ θεὸς ἡμῶν
  choice: nosso Deus
  rationale: É a forma possessiva idiomática em português, sem necessidade de reproduzir o artigo grego.
- source_word: αἰνέσομέν
  choice: louvaremos
  rationale: Preserva o futuro do indicativo, sem transformá-lo indevidamente em exortação.
- source_word: σε
  choice: te
  rationale: Pronome objeto natural em português, com referência direta a Deus.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo é expresso naturalmente pela vírgula; evita-se “ó Senhor”, que aqui elevaria desnecessariamente o registro.
theological_decisions:
- issue: Tradução de κύριος em contexto de título e invocação divina
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” preserva o título divino tradicional e o vínculo com o uso da Septuaginta, sem introduzir uma nuance distinta de domínio.
translation_notes:
  register: Português moderno, digno e acessível, com “tu/te” em coerência interna. A repetição de “Senhor” foi mantida porque o segundo termo é vocativo explícito no grego.
