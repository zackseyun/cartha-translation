base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/007.yaml
  text: For because of this you have put your fear in our hearts[a], that we may call on your name; and we will praise you in our exile[d][c][b], because we have turned away from our hearts every unrighteousness of our fathers who sinned before you.
translation:
  language: pt
  text: Pois foi por isso que puseste o teu temor em nosso coração[a], para invocarmos o teu nome; e nós te louvaremos em nosso exílio[b], porque afastamos de nosso coração toda injustiça[c] de nossos pais, que pecaram diante de ti[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o temor de ti”. O grego diz literalmente “o teu temor”, expressão bíblica para o temor dirigido a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em nosso cativeiro”. O termo grego pode designar a condição de deportação ou exílio.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “toda iniquidade” ou “todo ato injusto”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “que pecaram contra ti”. O grego diz mais literalmente “que pecaram diante de ti”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι διὰ τοῦτο
  choice: Pois foi por isso que
  rationale: Reproduz a relação causal e o valor discursivo de ὅτι sem recorrer à formulação pouco natural «porque por isso».
- source_word: ἔδωκας
  choice: puseste
  rationale: Embora o verbo signifique literalmente «deste», «puseste ... em nosso coração» expressa com naturalidade portuguesa a ação de colocar ou incutir uma disposição interior.
- source_word: τὸν φόβον σου
  choice: o teu temor
  rationale: Mantém a construção possessiva do grego e não reduz φόβος apenas a reverência; a nota esclarece a leitura relacional possível.
- source_word: ἐπὶ καρδίαν ἡμῶν
  choice: em nosso coração
  rationale: Emprega a expressão idiomática portuguesa e conserva o singular coletivo do texto grego.
- source_word: ἐπικαλεῖσθαι τὸ ὄνομά σου
  choice: para invocarmos o teu nome
  rationale: Entende o infinitivo como finalidade ou resultado da ação anterior e preserva a linguagem bíblica de invocação do nome divino.
- source_word: αἰνέσομέν σε
  choice: nós te louvaremos
  rationale: Traduz diretamente o futuro; o pronome explícito dá a ênfase adequada ao novo movimento da oração.
- source_word: ἐν τῇ ἀποικίᾳ ἡμῶν
  choice: em nosso exílio
  rationale: No contexto de Baruque, ἀποικία designa a condição de deportação e afastamento da pátria; «exílio» é claro e historicamente apropriado.
- source_word: ἀπεστρέψαμεν
  choice: afastamos
  rationale: Conserva a imagem de fazer voltar ou retirar algo para longe, sem tornar explícita uma nuance temporal que o aoristo, isoladamente, não exige.
- source_word: ἀπὸ καρδίας ἡμῶν
  choice: de nosso coração
  rationale: Preserva tanto a preposição quanto o singular coletivo do original, apresentando o coração como o âmbito interior do arrependimento.
- source_word: πᾶσαν ἀδικίαν
  choice: toda injustiça
  rationale: «Injustiça» mantém a amplitude moral de ἀδικία, que também pode abranger iniquidade e todo tipo de ação errada.
- source_word: πατέρων ἡμῶν
  choice: de nossos pais
  rationale: Representa diretamente o substantivo masculino plural e mantém a referência aos antepassados paternos na confissão histórica.
- source_word: τῶν ἡμαρτηκότων ἐναντίον σου
  choice: que pecaram diante de ti
  rationale: Conserva a imagem espacial e relacional de ἐναντίον, deixando implícita, sem eliminá-la, a ideia de pecado cometido contra Deus.
theological_decisions:
- issue: Sentido de «teu temor» na relação entre ação divina e arrependimento
  choice: Manter «o teu temor»
  alternative: «o temor de ti» ou «a reverência por ti»
  rationale: A formulação preserva a tensão entre temor, reverência e obediência, sem restringir o termo a uma única interpretação teológica.
- issue: Referência de πατέρων
  choice: Traduzir por «nossos pais»
  alternative: «nossos antepassados»
  rationale: O original usa explicitamente «pais». A tradução mantém essa forma, enquanto o contexto deixa claro que se trata das gerações ancestrais.
- issue: Relação sintática do infinitivo ἐπικαλεῖσθαι
  choice: 'Expressá-lo como finalidade: «para invocarmos»'
  alternative: 'Coordenação mais literal: «e invocar»'
  rationale: A finalidade se ajusta à construção e ao fluxo da oração, mas não acrescenta uma explicação doutrinária sobre como o temor produz a invocação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais para leitores brasileiros. Mantiveram-se o singular coletivo «nosso coração», a linguagem bíblica «invocar o teu nome» e a ambiguidade teológica de «teu temor». A colocação dos marcadores segue a expressão específica explicada por cada nota.
