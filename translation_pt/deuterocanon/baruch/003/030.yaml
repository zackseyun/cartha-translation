  text: Who has crossed beyond the sea and found her[a], and will bring her for choice gold?
translation:
  language: pt
  text: Quem passou para além do mar e a encontrou, e a trará em troca de ouro fino?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς
  choice: Quem
  rationale: Introduz de modo natural uma pergunta retórica sobre a impossibilidade de alcançar a sabedoria pelo esforço humano.
- source_word: διέβη πέραν τῆς θαλάσσης
  choice: atravessou para além do mar
  rationale: Preserva tanto a ação concluída expressa pelo aoristo quanto a ideia espacial de chegar ao outro lado ou além do mar.
- source_word: εὗρεν αὐτήν
  choice: a encontrou
  rationale: O pronome feminino retoma a sabedoria personificada no contexto; em português, o gênero feminino de “sabedoria” permite conservar essa referência naturalmente.
- source_word: οἴσει αὐτὴν
  choice: a trará
  rationale: Traduz diretamente o futuro de φέρω sem acrescentar a noção de retorno, que está apenas implícita na cena e não é expressa pelo verbo grego.
- source_word: χρυσίου ἐκλεκτοῦ
  choice: em troca de ouro fino
  rationale: Torna explícita, em português idiomático, a provável relação de preço ou troca do genitivo; “ouro fino” comunica ouro selecionado e de alta qualidade.
theological_decisions:
- issue: Personificação da sabedoria no pronome αὐτήν
  choice: Manter a referência feminina com “a” nas duas ocorrências
  alternative: Empregar uma formulação impessoal ou repetir “a sabedoria”
  rationale: A referência feminina preserva discretamente a personificação presente no contexto e coincide naturalmente com o gênero de “sabedoria” em português, sem acrescentar identificação doutrinária posterior.
- issue: Relação expressa por χρυσίου ἐκλεκτοῦ
  choice: “em troca de ouro fino”
  alternative: “por ouro fino” ou “com ouro fino”
  rationale: O grego é sintaticamente conciso, mas o contexto sugere preço ou troca. A formulação escolhida comunica essa leitura provável sem transformar a sabedoria em algo efetivamente comprável, pois a pergunta é retórica.
translation_notes:
  register: Português moderno, claro e digno, com construção retórica preservada. A repetição de “a” mantém a coesão e a personificação da sabedoria. Não se acrescenta “de volta”, pois essa ideia não aparece explicitamente no grego.
