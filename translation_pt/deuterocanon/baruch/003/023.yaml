  naturalness: «Sobre a terra» é possível, mas «na terra» é a formulação moderna mais natural em português para ἐπὶ γῆς neste contexto. Os travessões fazem os grupos posteriores parecerem uma aposição aos filhos de Agar, quando o grego os apresenta como grupos coordenados; uma enumeração direta conserva melhor a sintaxe e a leitura.
