revisions:
- from: Também os filhos de Agar, que buscam o entendimento sobre a terra — os mercadores de Merrã[a] e Temã, os narradores de mitos[b] e os que buscam o entendimento —, não conheceram o caminho da sabedoria nem se lembraram das veredas dela.
