base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/023.yaml
  text: And the sons of Hagar also[a], who seek understanding on the earth—the merchants of Merran and Teman, and the myth-makers and seekers of understanding—did not know the way of wisdom[b], nor did they remember her paths.
translation:
  language: pt
  text: Também os filhos de Agar, que buscam o entendimento na terra, os mercadores de Merrã[a] e Temã, os narradores de mitos[b] e os que buscam o entendimento não conheceram o caminho da sabedoria nem se lembraram das veredas dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “Merrã”, nome geográfico incomum neste testemunho; algumas tradições o identificam ou normalizam de outra maneira. Aqui se preserva a forma grega existente, sem emenda silenciosa.
    reason: textual_variant
  - marker: b
    text: Ou “contadores de histórias”; o termo grego se refere a pessoas que se ocupam de narrativas ou mitos.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε υἱοὶ Ἁγὰρ
  choice: Também os filhos de Agar
  rationale: Mantém o sentido literal de υἱοί e representa a força aditiva de τε com “também”, usando a forma portuguesa tradicional do nome Agar.
- source_word: οἱ ἐκζητοῦντες τὴν σύνεσιν
  choice: que buscam o entendimento
  rationale: Expressa de modo natural a busca intencional indicada por ἐκζητέω e traduz σύνεσις por “entendimento”.
- source_word: οἱ ἐπὶ γῆς
  choice: sobre a terra
  rationale: Preserva a formulação ampla e um tanto abrupta do grego, sem restringi-la à ideia mais local de “naquela terra”.
- source_word: οἱ ἔμποροι τῆς Μερρὰν καὶ Θαιμάν
  choice: os mercadores de Merrã e Temã
  rationale: “Mercadores” é uma tradução corrente de ἔμποροι. Merrã translitera a forma incomum Μερράν, enquanto Temã segue a forma bíblica portuguesa usual de Θαιμάν.
- source_word: οἱ μυθολόγοι
  choice: os narradores de mitos
  rationale: Comunica com clareza pessoas dedicadas a relatos ou mitos, sem sugerir necessariamente falsidade deliberada.
- source_word: οἱ ἐκζητηταὶ τῆς συνέσεως
  choice: os que buscam o entendimento
  rationale: Repete o mesmo núcleo verbal e nominal da expressão anterior, preservando a repetição retórica do grego em linguagem portuguesa natural.
- source_word: ὁδὸν δὲ σοφίας
  choice: o caminho da sabedoria
  rationale: Conserva a metáfora de ὁδός e permite traduzir τρίβους por “veredas”, mantendo a variação lexical do original.
- source_word: οὐκ ἔγνωσαν
  choice: não conheceram
  rationale: O pretérito perfeito traduz adequadamente o aoristo e mantém o sentido direto de γινώσκω.
- source_word: οὐδὲ ἐμνήσθησαν τὰς τρίβους αὐτῆς
  choice: nem se lembraram das veredas dela
  rationale: Traduz naturalmente ἐμνήσθησαν e τρίβους; “dela” retoma explicitamente a sabedoria e conserva sua personificação.
theological_decisions:
- issue: Personificação da sabedoria
  choice: Retomar “sabedoria” com “dela”
  alternative: “suas veredas”
  rationale: Embora ambas as formas sejam gramaticalmente possíveis, “dela” torna explícita a referência à sabedoria personificada sem acrescentar uma identificação teológica ausente do texto.
- issue: Nomes geográficos em testemunho textual difícil
  choice: Conservar “Merrã” como transliteração de Μερράν e usar “Temã” para Θαιμάν
  alternative: Normalizar Merrã para outro topônimo mais conhecido
  rationale: A forma grega existente é incomum; preservá-la evita uma emenda silenciosa e mantém transparente a dificuldade textual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Os travessões esclarecem a longa sequência de aposições sem eliminar a ambiguidade estrutural do grego. A repetição de “buscam o entendimento” foi mantida por seu valor retórico.
