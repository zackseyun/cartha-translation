  text: You abandoned the fountain of wisdom[a].
translation:
  language: pt
  text: Abandonaste a fonte da sabedoria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a nascente da sabedoria” ou “a origem da sabedoria”.
    reason: Alternativas lexicais para πηγή, que pode indicar uma fonte ou nascente concreta e, figuradamente, uma origem.
lexical_decisions:
- source_word: ἐγκατέλιπες
  choice: você abandonou
  rationale: O aoristo ativo indicativo na segunda pessoa do singular expressa uma ação direta dirigida ao interlocutor. “Abandonou” é natural no português atual e conserva a força de deixar ou desamparar, sem o tom arcaico de “desamparaste” ou “deixaste”.
- source_word: πηγήν
  choice: fonte
  rationale: πηγή designa uma nascente ou fonte de água. “Fonte” preserva a imagem concreta e, em português, também comporta naturalmente o sentido figurado de origem, sem tornar a metáfora abstrata.
- source_word: σοφίας
  choice: sabedoria
  rationale: Equivalente corrente de σοφία. O contexto pode sugerir sabedoria divina, mas o texto diz apenas “sabedoria”; por isso, não se acrescenta uma qualificação interpretativa.
theological_decisions:
- issue: Força metafórica de τὴν πηγὴν τῆς σοφίας
  choice: Manter “a fonte da sabedoria” como metáfora direta.
  alternative: “a origem da sabedoria” ou “a nascente da sabedoria”
  rationale: O grego emprega uma imagem concreta de água que brota. “Fonte da sabedoria” conserva a textura poética e teológica sem identificar explicitamente a fonte nem reduzir a imagem a uma explicação abstrata.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. O pronome “você” torna explícita a segunda pessoa do singular de modo amplamente compreensível no português brasileiro, enquanto “fonte da sabedoria” preserva a concisão e a imagem do grego.
