  text: Great and without end[a], lofty and immeasurable.
translation:
  language: pt
  text: Grande e sem fim[a], alto e imensurável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «e não tem fim».'
    reason: Registra a forma verbal explícita do grego por trás da expressão portuguesa mais fluente «sem fim».
lexical_decisions:
- source_word: μέγας
  choice: Grande
  rationale: Mantém o sentido amplo de magnitude sem restringi-lo a tamanho físico ou poder; também preserva a forma concisa da cláusula nominal grega.
- source_word: οὐκ ἔχει τελευτήν
  choice: sem fim
  rationale: Expressão natural e concisa em português para a formulação literal «não tem fim», sem acrescentar a ideia mais ampla de ausência de qualquer limite.
- source_word: ὑψηλός
  choice: alto
  rationale: Equivalente direto que conserva a imagem espacial e o paralelismo poético, sem introduzir a nuance avaliativa mais forte de «exaltado».
- source_word: ἀμέτρητος
  choice: imensurável
  rationale: Exprime aquilo que não pode ser medido e não reduz o sentido a quantidade numérica, como faria «incontável».
theological_decisions:
- issue: Sujeito ou referente implícito
  choice: Manter a descrição sem inserir um sujeito explícito.
  alternative: Acrescentar «Ele é» ou identificar nominalmente o referente.
  rationale: O grego apresenta adjetivos e uma locução predicativa sem sujeito expresso. O masculino de ὑψηλός e o contexto imediato remetem naturalmente ao referente masculino anterior, mas nomeá-lo aqui eliminaria a concisão e parte da continuidade poética do original.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo breve e poético. «Alto» conserva a concretude do grego; a ordem dos quatro elementos descritivos foi mantida.
