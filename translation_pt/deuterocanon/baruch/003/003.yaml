lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou explicação da súplica no contexto, preservando de modo natural a força causal.
- source_word: σὺ
  choice: tu
  rationale: Mantém o pronome explícito e enfático, em contraste direto com «nós» na segunda oração.
- source_word: καθήμενος
  choice: permaneces sentado
  rationale: Preserva a imagem literal de estar sentado e expressa a continuidade sugerida pelo particípio, sem acrescentar explicitamente um trono.
- source_word: τὸν αἰῶνα
  choice: para sempre
  rationale: Expressão idiomática de duração, repetida nas duas orações para conservar o paralelismo retórico.
- source_word: ἡμεῖς
  choice: nós
  rationale: Conserva o pronome explícito e o forte contraste entre a permanência divina e a ruína humana coletiva.
- source_word: ἀπολλύμενοι
  choice: estamos perecendo
  rationale: Reproduz o aspecto contínuo do particípio presente e deixa aberta a amplitude semântica entre perecer, ser destruído e definhar.
theological_decisions:
- issue: Se καθήμενος deve ser explicitado como uma imagem régia de entronização
  choice: permaneces sentado
  alternative: permaneces entronizado
  rationale: Embora a referência a Deus possa sugerir entronização e governo permanente, o grego menciona apenas estar sentado. O texto principal mantém a formulação menos interpretativa, e a nota registra a possível nuance régia.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de «tu» para preservar a ênfase do pronome grego. A repetição de «para sempre» e a coordenação com «e» mantêm o paralelismo incisivo do original.
