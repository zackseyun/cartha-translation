base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/020.yaml
  text: The younger men saw the light and lived on the earth[b][a], but they did not know the way of knowledge.
translation:
  language: pt
  text: Os mais jovens[a] viram a luz[b] e habitaram na terra, mas não conheceram o caminho do conhecimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os jovens» ou «os homens mais jovens». O grego está no masculino plural.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «viram luz». A expressão pode sugerir, de modo idiomático, estar vivo ou desfrutar a vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτεροι
  choice: os mais jovens
  rationale: O comparativo substantivado designa os mais jovens em contraste com os de gerações anteriores. A forma masculina plural é preservada em português sem acrescentar o substantivo «homens», que não aparece explicitamente no grego.
- source_word: εἶδον φῶς
  choice: viram a luz
  rationale: Preserva a imagem concreta do grego e sua possível associação idiomática com estar vivo, sem reduzir a expressão a uma única interpretação.
- source_word: κατῴκησαν ἐπὶ τῆς γῆς
  choice: habitaram na terra
  rationale: «Habitaram» representa diretamente κατοικέω, enquanto «na terra» expressa de modo natural o sentido amplo de ἐπὶ τῆς γῆς neste contexto.
- source_word: ὁδὸν
  choice: o caminho
  rationale: Mantém a metáfora de uma via ou curso, entendida como expressão conceitualmente definida pelo genitivo seguinte.
- source_word: ἐπιστήμης
  choice: do conhecimento
  rationale: «Conhecimento» é a correspondência mais direta e adequada ao contexto sapiencial, sem estreitar o sentido para habilidade ou percepção.
- source_word: οὐκ ἔγνωσαν
  choice: não conheceram
  rationale: Reproduz de maneira simples e direta o aoristo de γινώσκω, sem acrescentar ideias de aprendizagem ou reconhecimento.
theological_decisions:
- issue: Força idiomática de «viram a luz» no contexto sapiencial
  choice: Conservar a expressão concreta «viram a luz».
  alternative: «viveram» ou «desfrutaram a vida»
  rationale: A frase pode sugerir a experiência de estar vivo, mas o texto formula essa ideia por meio da imagem da luz. Preservá-la mantém a força poética e a ambiguidade genuína.
- issue: Referência de gênero em νεώτεροι
  choice: Usar o masculino substantivado «os mais jovens».
  alternative: «as pessoas mais jovens» ou «a geração mais jovem»
  rationale: O grego apresenta um masculino plural substantivado. O português permite conservar essa forma de modo natural, sem neutralizar nem acrescentar «homens» ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem da frase e a imagem poética do grego foram mantidas sem rigidez artificial.
