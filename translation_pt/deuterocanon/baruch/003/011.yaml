  text: você foi contada entre os que estão no Hades.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você foi considerada como uma das que estão no mundo dos mortos”. Em grego: “no Hades”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελογίσθης
  choice: você foi contado
  rationale: O aoristo passivo expressa que o destinatário passou a ser contado como integrante de um grupo. A formulação mantém a voz passiva e é clara em português atual.
- source_word: μετὰ
  choice: entre
  rationale: Embora μετά com genitivo tenha o sentido básico de “com”, depois de “contado” a construção idiomática portuguesa “contado entre” comunica naturalmente a inclusão no grupo.
- source_word: τῶν εἰς ᾅδου
  choice: os que estão no Hades
  rationale: A expressão identifica os integrantes do grupo por sua presença no Hades. “Estão” explicita de modo natural a relação elíptica do grego sem transformar a expressão simplesmente em “os mortos”.
- source_word: ᾅδου
  choice: Hades
  rationale: Mantém o termo grego para o domínio dos mortos e evita tanto sua redução a “sepultura” como sua identificação indevida com o lugar de castigo final.
theological_decisions:
- issue: Tradução de ᾅδου
  choice: Hades
  alternative: mundo dos mortos
  rationale: “Hades” preserva a precisão lexical e a tensão conceitual do texto grego, sem o confundir com “inferno”. A nota oferece uma equivalência explicativa acessível.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O pronome “você” corresponde ao singular do verbo grego e mantém o endereço direto; “contado entre” é idiomático sem perder a estrutura passiva.
