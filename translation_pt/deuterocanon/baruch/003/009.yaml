  text: Hear[a], O Israel, the commandments of life[b]; give ear to know prudence.
translation:
  language: pt
  text: Escute, Israel, os mandamentos da vida[a]; deem ouvidos para conhecer a prudência[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os mandamentos que dão vida” ou “os mandamentos para a vida”. O grego diz literalmente “os mandamentos da vida”.
    reason: alternativa lexical e preservação da ambiguidade do genitivo
  - marker: b
    text: Ou “o discernimento” ou “a compreensão prática”.
    reason: alternativa lexical
lexical_decisions:
- source_word: Ἄκουε
  choice: Escute
  rationale: Imperativo singular dirigido a Israel como entidade coletiva. “Escute” mantém a convocação solene e tem leitura natural no português moderno.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: ἐντολὰς
  choice: os mandamentos
  rationale: Expressa ordens dotadas de autoridade e preserva a ressonância bíblica da instrução divina.
- source_word: ζωῆς
  choice: da vida
  rationale: Conserva a construção genitiva compacta do grego sem decidir se a vida é origem, resultado ou finalidade dos mandamentos.
- source_word: ἐνωτίσασθε
  choice: deem ouvidos
  rationale: O imperativo plural evoca literalmente o ato de dar ouvidos. A expressão preserva a imagem e o tom elevado da exortação.
- source_word: γνῶναι
  choice: para conhecer
  rationale: Traduz o infinitivo como propósito, de maneira direta e natural, sem acrescentar a nuance pedagógica de “aprender”.
- source_word: φρόνησιν
  choice: a prudência
  rationale: “Prudência” comunica discernimento prático e moral, evitando a formulação pouco natural “conhecer o entendimento”; “discernimento” também é possível.
theological_decisions:
- issue: Sentido do genitivo em ἐντολὰς ζωῆς
  choice: “os mandamentos da vida”
  alternative: “os mandamentos que dão vida” ou “os mandamentos para a vida”
  rationale: O genitivo grego admite relações próximas de qualidade, resultado ou finalidade. A tradução principal preserva essa ambiguidade em vez de impor uma interpretação.
- issue: Mudança de número entre Ἄκουε e ἐνωτίσασθε
  choice: “Escute, Israel” no singular e “deem ouvidos” no plural
  alternative: Uniformizar os dois imperativos no singular ou no plural
  rationale: 'A mudança de número está no texto grego: Israel é interpelado primeiro como unidade coletiva e depois como pluralidade. Preservá-la mantém uma tensão gramatical genuína da fonte.'
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. “Deem ouvidos” conserva deliberadamente a imagem do original e seu registro exortativo. A alternância entre singular e plural reproduz a forma grega.
