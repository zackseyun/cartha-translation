base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/024.yaml
  text: O Israel[a], how great is the house of God, and how vast is the place of his possession;
translation:
  language: pt
  text: Ó Israel, como é grande a casa de Deus e como é vasto o lugar de sua possessão[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de sua criação”. O grego κτήσεως pode indicar possessão ou propriedade e, em certos contextos, criação ou aquilo que foi adquirido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Ó
  rationale: Preserva a força vocativa e o tom elevado da interpelação grega, de modo natural em português.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Emprega a forma consagrada do nome próprio em português.
- source_word: ὡς μέγας
  choice: como é grande
  rationale: Reproduz o valor exclamativo de ὡς com o adjetivo, em vez de reduzi-lo a uma simples afirmação.
- source_word: ὁ οἶκος τοῦ θεοῦ
  choice: a casa de Deus
  rationale: Tradução formalmente próxima que mantém aberta a referência a morada, templo ou âmbito de Deus, sem restringi-la a uma comunidade de pessoas.
- source_word: ἐπιμήκης
  choice: vasto
  rationale: Expressa a grande extensão espacial indicada pelo termo grego com linguagem idiomática e digna em português.
- source_word: ὁ τόπος
  choice: o lugar
  rationale: Mantém a imagem espacial concreta e flexível do substantivo grego.
- source_word: τῆς κτήσεως αὐτοῦ
  choice: de sua possessão
  rationale: Conserva o sentido de propriedade ou daquilo que Deus possui e acompanha de perto a construção genitiva, sem excluir em nota o possível sentido de criação.
theological_decisions:
- issue: Sentido de κτήσεως em relação à casa e ao lugar de Deus
  choice: sua possessão
  alternative: sua criação
  rationale: O contexto enfatiza a grandeza e a extensão do domínio de Deus, favorecendo o sentido daquilo que ele possui. Como κτῆσις também pode, em certos contextos, referir-se à criação ou ao que foi adquirido, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “como é” preserva o paralelismo exclamativo do grego; “possessão” mantém a ambiguidade lexical melhor do que uma paráfrase mais interpretativa.
