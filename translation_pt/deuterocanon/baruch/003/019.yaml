base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/019.yaml
  text: They vanished and went down to Hades[a], and others rose up in their place.
translation:
  language: pt
  text: Eles desapareceram e desceram ao Hades[a], e outros se levantaram em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mundo dos mortos” ou “sepultura”; em grego, “Hades”, o domínio dos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠφανίσθησαν
  choice: desapareceram
  rationale: Preserva o sentido resultativo de terem sumido de cena, sem tornar explícita uma destruição física que o verbo, neste contexto, não exige.
- source_word: εἰς ᾅδου
  choice: ao Hades
  rationale: O grego nomeia diretamente o Hades, o domínio dos mortos. A transliteração preserva a referência cosmológica sem substituí-la por 'sepultura' nem importar o termo hebraico 'Sheol'.
- source_word: κατέβησαν
  choice: desceram
  rationale: Reproduz de modo natural e direto o movimento descendente expresso pelo verbo grego.
- source_word: ἄλλοι
  choice: outros
  rationale: Mantém o plural indefinido sem acrescentar 'homens', que não aparece expressamente no grego.
- source_word: ἀντανέστησαν
  choice: se levantaram
  rationale: Conserva a imagem verbal de erguer-se e, junto de 'em seu lugar', comunica sucessão sem sugerir necessariamente ressurreição.
- source_word: ἀντʼ αὐτῶν
  choice: em seu lugar
  rationale: Expressa de forma idiomática a substituição ou sucessão indicada por ἀντί com genitivo.
theological_decisions:
- issue: Tradução de ᾅδης em um contexto sapiencial deuterocanônico
  choice: Hades
  alternative: mundo dos mortos; sepultura; Sheol
  rationale: Como a fonte é grega e emprega ᾅδης, mantém-se 'Hades'. Isso preserva a descrição do domínio dos mortos sem reduzi-la à sepultura, retrovertê-la para o hebraico ou identificá-la com concepções doutrinárias posteriores de inferno.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem coordenada e o paralelismo do grego foram preservados.
