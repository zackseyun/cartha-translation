  text: He sends out the light[a], and it goes; he called it, and it obeyed him with trembling.
translation:
  language: pt
  text: Ele envia a luz[a], e ela vai; chamou-a, e ela lhe obedeceu com tremor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “aquele que envia a luz, e ela vai”. O grego começa com um particípio acompanhado de artigo, que funciona como uma descrição de Deus semelhante a um título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀποστέλλων
  choice: Ele envia
  rationale: O particípio com artigo funciona substantivamente e retoma Deus no contexto. A forma verbal finita é natural em português e preserva a ação característica; a construção mais formal é registrada em nota.
- source_word: τὸ φῶς
  choice: a luz
  rationale: Mantém naturalmente o artigo grego e designa, no contexto, a luz cósmica submetida ao comando de Deus.
- source_word: πορεύεται
  choice: ela vai
  rationale: A formulação simples preserva a personificação direta da luz e o movimento decorrente do envio divino.
- source_word: ἐκάλεσεν αὐτό
  choice: chamou-a
  rationale: Conserva o aoristo e a imagem pessoal do chamado divino sem especificá-lo em excesso como convocação formal.
- source_word: ὑπήκουσεν αὐτῷ
  choice: ela lhe obedeceu
  rationale: Expressa com clareza a resposta obediente indicada por ὑπακούω e mantém a personificação da criação.
- source_word: τρόμῳ
  choice: com tremor
  rationale: Traduz o dativo em função adverbial e conserva a imagem vívida de uma resposta reverente e temerosa.
theological_decisions:
- issue: Personificação da luz que obedece a Deus
  choice: Manter diretamente no texto a luz como agente que vai, é chamada e obedece com tremor.
  alternative: Suavizar a linguagem em uma descrição impessoal da ordem natural.
  rationale: O grego personifica explicitamente a luz. Preservar essa poesia mantém a ênfase na soberania de Deus sobre a criação sem reduzir a força da imagem.
- issue: Referente de ὁ ἀποστέλλων
  choice: Empregar o sujeito pessoal explícito “Ele”, referindo-se a Deus no contexto.
  alternative: “Aquele que envia a luz”
  rationale: Embora o particípio seja substantivado, a retomada pronominal é mais fluente em português. O contexto identifica claramente Deus como o agente, e a alternativa formal permanece na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A variação entre o presente (“envia”, “vai”) e o passado aorístico (“chamou”, “obedeceu”) foi preservada para refletir o texto grego, sem uniformização interpretativa.
