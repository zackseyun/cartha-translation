  text: After this he appeared on the earth[a], and lived among men.
translation:
  language: pt
  text: Depois disso, apareceu na terra[a] e conviveu com os seres humanos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi visto na terra e viveu entre os seres humanos”. O grego não explicita o sujeito dos verbos.'
    reason: Registra a tradução mais formal de ὤφθη e preserva a ambiguidade do sujeito.
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: Depois disso
  rationale: Mantém de modo natural e direto a sequência temporal expressa no grego.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: É a forma idiomática em português para a manifestação no âmbito terreno; neste contexto, γῆ indica a terra, não uma região específica.
- source_word: ὤφθη
  choice: apareceu
  rationale: Embora a forma possa ser traduzida literalmente por «foi visto», o aoristo passivo de ὁράω é usado idiomaticamente com o sentido de «apareceu».
- source_word: ἐν τοῖς ἀνθρώποις συνανεστράφη
  choice: conviveu com os seres humanos
  rationale: Συναναστρέφομαι indica relacionar-se ou viver em companhia de outros. «Conviveu com» transmite essa presença compartilhada, e «seres humanos» expressa o sentido genérico de ἀνθρώποις.
theological_decisions:
- issue: Identidade e gênero do sujeito não expresso
  choice: Omitir o pronome, como permite naturalmente o português
  alternative: Introduzir «ele» ou «ela»
  rationale: Os verbos gregos não explicitam o gênero do sujeito neste versículo. A construção portuguesa com sujeito oculto preserva a ligação com o contexto anterior e evita resolver indevidamente a tensão interpretativa ou impor uma leitura cristológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. Evitou-se «homens» porque ἀνθρώποις designa aqui a humanidade em geral.
