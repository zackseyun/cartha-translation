base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/032.yaml
  text: But he who knows all things knows her[a]; he found her out by his understanding. He who prepared the earth for everlasting time filled it with four-footed animals[c][b];
translation:
  language: pt
  text: Mas aquele que sabe todas as coisas a conhece[a] e, por seu entendimento, a descobriu. Aquele que preparou a terra para todo o sempre[b] encheu-a de animais de quatro patas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os pronomes femininos deste trecho se referem à sabedoria personificada.
    reason: cultural_note
  - marker: b
    text: 'Ou: “para todos os tempos” ou “para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰδὼς τὰ πάντα
  choice: aquele que sabe todas as coisas
  rationale: O particípio perfeito substantivado caracteriza Deus por seu conhecimento completo; a formulação é natural em português e preserva o alcance abrangente de τὰ πάντα.
- source_word: γινώσκει αὐτήν
  choice: a conhece
  rationale: O pronome feminino retoma a sabedoria no contexto. Em português, o clítico feminino mantém essa referência sem acrescentar uma interpretação alheia ao texto.
- source_word: ἐξεῦρεν αὐτήν
  choice: a descobriu
  rationale: ἐξευρίσκω expressa encontrar mediante investigação ou chegar a descobrir. “Descobriu” comunica essa força de modo corrente e digno em português.
- source_word: τῇ συνέσει αὐτοῦ
  choice: por seu entendimento
  rationale: Preserva o valor instrumental do dativo e traduz σύνεσις como capacidade de compreender ou discernir.
- source_word: ὁ κατασκευάσας τὴν γῆν
  choice: Aquele que preparou a terra
  rationale: κατασκευάζω pode significar preparar, dispor ou estabelecer. “Preparou” conserva a amplitude lexical sem substituir o verbo por um termo criacional mais específico.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: para todo o sempre
  rationale: A expressão grega combina termos temporais para indicar duração permanente. A formulação portuguesa transmite essa ênfase sem a rigidez pouco natural de “para um tempo eterno”.
- source_word: ἐνέπλησεν αὐτὴν κτηνῶν τετραπόδων
  choice: encheu-a de animais de quatro patas
  rationale: O pronome retoma naturalmente “a terra”, e a expressão traduz κτήνη τετράποδα de maneira clara para leitores comuns, sem o tecnicismo de “quadrúpedes”.
theological_decisions:
- issue: Personificação da sabedoria
  choice: Manter a referência feminina por meio de “a conhece” e “a descobriu”
  alternative: Empregar uma referência impessoal ou repetir apenas “sabedoria”
  rationale: Os pronomes gregos femininos retomam a sabedoria personificada no contexto. A tradução conserva essa textura literária sem sugerir que ela seja uma divindade separada.
- issue: Ação divina expressa por κατασκευάσας
  choice: “preparou a terra”
  alternative: “criou a terra” ou “estabeleceu a terra”
  rationale: “Preparou” representa a força possível do verbo grego sem introduzir uma formulação teológica mais específica do que a usada neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das orações foi levemente ajustada para fluidez, preservando o paralelismo e a personificação do original.
