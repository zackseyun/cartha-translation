base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/029.yaml
  text: Who has gone up into heaven and taken her[a], and brought her down from the clouds?
translation:
  language: pt
  text: Quem subiu ao céu, tomou-a[a] e a fez descer das nuvens?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a Sabedoria, personificada no feminino no contexto.
    reason: Esclarece o referente do pronome feminino e preserva com precisão a personificação literária presente no contexto.
lexical_decisions:
- source_word: τίς
  choice: Quem
  rationale: Introduz de modo direto e natural a pergunta retórica, sem acrescentar ênfase ausente do grego.
- source_word: ἀνέβη εἰς τὸν οὐρανόν
  choice: subiu ao céu
  rationale: Expressa claramente o movimento ascendente. Em português, «subiu ao céu» é mais idiomático do que «subiu para dentro do céu», sem perder o sentido de εἰς.
- source_word: ἔλαβεν αὐτήν
  choice: tomou-a
  rationale: Mantém o sentido direto de λαμβάνω e o pronome feminino, cujo referente é a Sabedoria personificada no contexto.
- source_word: κατεβίβασεν αὐτήν
  choice: a fez descer
  rationale: 'Preserva explicitamente o valor causativo do verbo: alguém fez com que ela descesse.'
- source_word: ἐκ τῶν νεφελῶν
  choice: das nuvens
  rationale: Reproduz naturalmente a origem indicada por ἐκ e conserva a imagem no plural.
theological_decisions:
- issue: Gênero do pronome que se refere à Sabedoria
  choice: Usar o pronome feminino em «tomou-a» e «a fez descer»
  alternative: Empregar uma formulação neutra ou repetir «a sabedoria»
  rationale: O grego emprega αὐτήν no feminino, em harmonia com a personificação da Sabedoria no contexto. O pronome feminino preserva essa textura literária sem impor uma identificação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem verbal compacta conserva o paralelismo da pergunta grega; «a fez descer» evita a possível ideia de derrubar à força que «a trouxe para baixo» ou «a baixou» poderia sugerir.
