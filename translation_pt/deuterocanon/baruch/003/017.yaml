    issue: «cuja aquisição não tem fim» para τῆς κτήσεως αὐτῶν
    rationale: κτῆσις pode em alguns usos referir-se à aquisição, mas, após a menção de prata e ouro acumulados, o sentido contextual mais direto é «posses/bens». Além disso, «cuja» deixa gramaticalmente incerto se o antecedente é prata e ouro ou as pessoas, enquanto αὐτῶν se refere aos indivíduos descritos.
