translation:
  language: pt
  text: os que se divertem com as aves do céu[a], que acumulam prata e ouro, nos quais as pessoas confiaram, e não há fim para as suas posses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “brincam entre as aves do céu”. O particípio grego pode indicar uma atividade de diversão em sentido amplo, não necessariamente zombaria verbal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαίζοντες
  choice: se divertem com
  rationale: Preserva a ideia ampla de brincar ou praticar alguma atividade por diversão, sem restringir o sentido a zombaria verbal ou caça.
- source_word: ὀρνέοις τοῦ οὐρανοῦ
  choice: as aves do céu
  rationale: Equivalente natural e próximo da formulação grega, preservando seu sabor bíblico.
- source_word: θησαυρίζοντες
  choice: acumulam
  rationale: Expressa de modo claro e atual o ato de ajuntar e guardar riquezas.
- source_word: ἀργύριον
  choice: prata
  rationale: A associação imediata com ouro favorece o metal precioso, e não o sentido mais amplo de dinheiro.
- source_word: χρυσίον
  choice: ouro
  rationale: Equivalente lexical direto.
- source_word: ᾧ ἐπεποίθεισαν ἄνθρωποι
  choice: nos quais as pessoas confiaram
  rationale: O relativo grego singular retoma coletivamente a riqueza mencionada; o plural em português concorda naturalmente com prata e ouro. 'As pessoas' transmite o sentido humano genérico de ἄνθρωποι, e o pretérito perfeito corresponde ao aoristo.
- source_word: οὐκ ἔστιν τέλος τῆς κτήσεως αὐτῶν
  choice: cuja aquisição não tem fim
  rationale: κτῆσις pode designar o processo de adquirir, não apenas aquilo que se possui. A formulação conserva essa possibilidade e liga αὐτῶν aos acumuladores.
theological_decisions:
- issue: Sentido genérico de ἄνθρωποι
  choice: as pessoas
  alternative: os homens
  rationale: Neste contexto, o substantivo se refere genericamente aos seres humanos, sem estabelecer uma afirmação restrita ao sexo masculino.
- issue: Referente de αὐτῶν em τῆς κτήσεως αὐτῶν
  choice: aquisição deles, expressa por 'cuja aquisição'
  alternative: suas posses
  rationale: O pronome plural remete mais naturalmente às pessoas descritas, enquanto κτῆσις admite tanto 'aquisição' como 'posse'. A tradução preserva o foco na acumulação sem converter o substantivo inequivocamente em bens possuídos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de 'que' foi moderada por coordenação natural, e a ambiguidade de ἐμπαίζοντες foi preservada com nota.
