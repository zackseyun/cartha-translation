  source_fidelity: A tradução reproduz adequadamente a sequência dos particípios, «prata e ouro», a confiança humana nesses bens e a ideia de ilimitada acumulação. Contudo, «cuja aquisição não tem fim» desloca κτῆσις para o processo de adquirir e introduz uma relativa portuguesa de referente pouco claro. No contexto, κτῆσις designa mais naturalmente os bens/posses adquiridos; a construção grega afirma que não há fim para essas posses.
  naturalness: «Os que se divertem com as aves do céu» é natural e mantém a ambiguidade deliberada do particípio. «Não há fim para as suas posses» é idiomático, claro e preserva o tom sóbrio do texto.
  terminology: «Aves do céu», «prata», «ouro» e «pessoas» são escolhas adequadas. «Posses» representa κτῆσις melhor que «aquisição» neste contexto, sem especificar indevidamente uma modalidade de riqueza.
  issues:
