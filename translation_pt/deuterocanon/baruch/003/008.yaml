base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/008.yaml
  text: Behold[a], today we are in our exile, where you scattered us, for reproach and for a curse and for payment, according to all the wrongdoings of our fathers, who turned away from the Lord our God.
translation:
  language: pt
  text: Eis que hoje estamos no nosso exílio, para onde nos dispersaste, como alvo de vergonha e maldição e sob obrigação de pagar[a], conforme todas as injustiças de nossos pais, que se afastaram do Senhor, nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob pena” ou “em dívida”. O termo grego pode indicar pagamento, dívida ou obrigação contraída e, neste contexto, pode ter conotação de penalidade no juízo divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Interjeição que chama enfaticamente a atenção para a situação presente; o plural é natural em português, dado o discurso coletivo, sem alterar o conteúdo.
- source_word: ἀποικίᾳ
  choice: exílio
  rationale: No contexto, designa a condição e o lugar da deportação entre povos estrangeiros; “exílio” comunica bem o sentido histórico e pactual.
- source_word: διέσπειρας
  choice: dispersaste
  rationale: Preserva a imagem de espalhamento entre as nações e a segunda pessoa singular dirigida a Deus.
- source_word: ὀνειδισμὸν
  choice: motivo de vergonha
  rationale: Expressa a desonra pública e a condição de ser alvo de censura ou zombaria, em linguagem portuguesa clara.
- source_word: ἀρὰν
  choice: objeto de maldição
  rationale: Mantém o substantivo “maldição” e, no encadeamento da frase, explicita naturalmente que os exilados se tornaram alvo dela.
- source_word: ὄφλησιν
  choice: para pagarmos
  rationale: Conserva a metáfora de obrigação ou dívida contraída, tornando-a idiomática em português; a nota registra outras possibilidades no contexto de juízo.
- source_word: κατὰ πάσας τὰς ἀδικίας
  choice: por todas as injustiças
  rationale: Neste contexto, κατά relaciona a condição presente às ações injustas dos antepassados; “por” exprime essa correspondência causal de modo natural.
- source_word: ἀπέστησαν
  choice: se afastaram
  rationale: Traduz a ideia de abandono ou defecção em relação ao Senhor sem acrescentar a especificidade técnica de “apostatar” nem intensificar para “rebelar-se”.
- source_word: Κυρίου θεοῦ ἡμῶν
  choice: do Senhor, nosso Deus
  rationale: Forma natural em português que preserva a linguagem de aliança e verte κύριος por “Senhor”.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: No contexto grego de Baruque, refere-se ao Deus de Israel em linguagem de aliança; “Senhor” é fiel e natural sem introduzir uma convenção tipográfica ausente do texto grego.
- issue: Sentido de ὄφλησιν no contexto de juízo
  choice: para pagarmos
  alternative: para sofrermos a pena; como devedores
  rationale: O termo pode indicar dívida, obrigação contraída ou penalidade. A tradução principal preserva a imagem de pagamento sem decidir de modo excessivamente específico entre dívida e pena, e a nota mantém a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa legibilidade brasileira. A estrutura foi levemente naturalizada para evitar uma série abstrata e pouco idiomática de complementos com “para”, preservando a progressão do grego e sua ambiguidade central.
