revisions:
- from: 'Vejam: hoje estamos no exílio, para onde nos dispersaste, para sermos motivo de vergonha e objeto de maldição e para pagarmos[a] por todas as injustiças de nossos pais, que se afastaram do Senhor, nosso Deus.'
  to: Eis que hoje estamos no nosso exílio, para onde nos dispersaste, como alvo de vergonha e maldição e sob obrigação de pagar[a], conforme todas as injustiças de nossos pais, que se afastaram do Senhor, nosso Deus.
  rationale: A revisão conserva a sequência e a ambiguidade de ὄφλησιν mediante «sob obrigação de pagar», sem transformar o termo numa afirmação inequívoca de castigo. «Conforme todas as injustiças» verte a relação expressa por κατά e evita que ela se ligue apenas ao ato de pagar. «Eis que» transmite de forma digna e idiomática a chamada enfática de ἰδοὺ.
