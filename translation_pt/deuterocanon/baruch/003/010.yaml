base_translation:
  language: en
  yaml_path: translation/deuterocanon/baruch/003/010.yaml
  text: What is it, Israel? Why is it that you are in the land of enemies? You have grown old in a foreign land; you have become defiled with the dead,
translation:
  language: pt
  text: O que há, Israel?[a] Por que você está na terra dos inimigos? Você envelheceu em terra estrangeira; ficou contaminado com os mortos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que aconteceu, Israel?” A expressão grega pode funcionar como pergunta ou exclamação de lamento.'
    reason: lexical_alternative
  - marker: b
    text: “Contaminado com os mortos” pode evocar tanto a impureza associada ao contato com os mortos quanto, figuradamente, a condição de quem no exílio é como se estivesse morto; o grego permite ambas as ressonâncias.
    reason: alternative_reading
lexical_decisions:
- source_word: τί ἐστιν
  choice: O que há
  rationale: A expressão introduz uma pergunta de lamento. “O que há?” é natural em português e mantém a distinção em relação ao τί ὅτι seguinte, traduzido por “por que”.
- source_word: ἐν γῇ τῶν ἐχθρῶν
  choice: numa terra de inimigos
  rationale: O grego não traz pronome possessivo. “Terra de inimigos” preserva essa forma aberta sem acrescentar “seus”, e o artigo indefinido produz uma frase natural em português.
- source_word: ἐπαλαιώθης
  choice: você envelheceu
  rationale: O verbo indica que Israel se tornou velho ou envelheceu. A tradução conserva a imagem da longa permanência no exílio, sem substituí-la por uma interpretação como “desgastou-se”.
- source_word: γῇ ἀλλοτρίᾳ
  choice: em terra estrangeira
  rationale: ἀλλοτρία designa terra alheia ou estrangeira. A expressão escolhida é clara, atual e apropriada ao contexto do exílio.
- source_word: συνεμιάνθης
  choice: ficou contaminado
  rationale: O verbo expressa contaminação ou impureza, inclusive em sentido ritual ou moral. “Ficou contaminado” comunica o estado resultante e evita definir de antemão a natureza exata da impureza.
- source_word: τοῖς νεκροῖς
  choice: com os mortos
  rationale: O dativo ligado ao verbo composto pode indicar associação. “Com os mortos” mantém aberta tanto a ideia de contato contaminante quanto a associação figurada com a condição dos mortos.
theological_decisions:
- issue: Natureza da contaminação em συνεμιάνθης τοῖς νεκροῖς
  choice: Manter a formulação ampla “ficou contaminado com os mortos”
  alternative: Especificar contaminação ritual pelo contato com cadáveres ou interpretar exclusivamente como condição figurada de morte no exílio
  rationale: O grego permite ressonâncias tanto de impureza ligada aos mortos quanto de associação figurada com o domínio da morte. A tradução não resolve uma tensão que o texto preserva.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega “você” para a interpelação singular a Israel e evita acrescentar o possessivo “seus” antes de “inimigos”. A pontuação final com vírgula preserva a continuidade sintática com o versículo seguinte.
