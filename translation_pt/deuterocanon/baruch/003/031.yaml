  text: There is no one who knows her way, nor one who considers her path.
translation:
  language: pt
  text: Não há quem conheça o caminho dela, nem quem reflita sobre a vereda dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: Não há quem
  rationale: Expressa de modo natural em português a construção existencial negativa e mantém a afirmação enfática de que ninguém assim existe.
- source_word: ὁ γινώσκων
  choice: conheça
  rationale: O particípio presente com artigo funciona como substantivo, isto é, “aquele que conhece”; após “não há quem”, o subjuntivo é a construção portuguesa idiomática.
- source_word: τὴν ὁδὸν αὐτῆς
  choice: o caminho dela
  rationale: “Caminho” preserva a imagem de ὁδός, e “dela” mantém a referência feminina à Sabedoria personificada no contexto.
- source_word: οὐδὲ
  choice: nem
  rationale: Conserva a coordenação negativa e o paralelismo poético entre as duas orações.
- source_word: ὁ ἐνθυμούμενος
  choice: quem reflita sobre
  rationale: ἐνθυμέομαι indica considerar ou ponderar interiormente; “refletir sobre” comunica esse sentido sem reduzi-lo a mera lembrança.
- source_word: τὴν τρίβον αὐτῆς
  choice: a vereda dela
  rationale: “Vereda” distingue τρίβος de ὁδός e preserva a variação poética entre dois termos próximos ligados à imagem de percurso.
theological_decisions:
- issue: Referente do pronome feminino αὐτῆς
  choice: “dela”, em referência à Sabedoria personificada
  alternative: Usar uma forma impessoal, tratando a sabedoria apenas como conceito abstrato
  rationale: O contexto imediato personifica a Sabedoria, e o pronome grego é feminino; “dela” conserva essa característica literária e teológica sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A combinação “caminho/vereda” preserva a variação lexical do grego; “dela” soa mais natural e inequívoco do que o possessivo potencialmente ambíguo “seu”.
