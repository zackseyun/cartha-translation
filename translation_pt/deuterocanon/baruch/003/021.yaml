  text: Nor did they understand its paths[a], nor did they take hold of it; their sons became far from their way,
translation:
  language: pt
  text: Não compreenderam as veredas dela, nem se apoderaram dela; os filhos deles ficaram longe do caminho deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “os filhos deles se afastaram do caminho”. A redação grega da oração final é pouco usual; o texto principal conserva o possessivo plural, literalmente “deles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: compreenderam
  rationale: O verbo συνίημι indica entender ou captar. “Compreenderam” é claro e combina naturalmente com a imagem figurada das veredas da sabedoria.
- source_word: τρίβους
  choice: veredas
  rationale: τρίβος designa caminho, trilha ou vereda. “Veredas” preserva a imagem poética e a distingue levemente de ὁδός na oração final.
- source_word: ἀντελάβοντο
  choice: tomaram posse de
  rationale: O médio de ἀντιλαμβάνομαι pode expressar tomar, agarrar ou alcançar algo. “Tomaram posse dela” conserva a ideia concreta de obter a sabedoria sem reduzir o verbo apenas a compreensão intelectual.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: os filhos deles
  rationale: O grego traz explicitamente o substantivo masculino plural “filhos”; a tradução preserva essa forma em vez de generalizá-la como “descendentes” ou “crianças”.
- source_word: πόρρω ἐγενήθησαν
  choice: ficaram longe
  rationale: A expressão significa literalmente “tornaram-se/ficaram longe”. “Ficaram longe” é idiomático em português e mantém a noção de distância ou afastamento.
- source_word: ἀπὸ τῆς ὁδοῦ αὐτῶν
  choice: do caminho deles
  rationale: O texto transmitido contém o possessivo plural αὐτῶν, “deles”. A tradução o conserva, apesar da referência algo difícil, sem substituí-lo conjecturalmente por “dela” ou omiti-lo.
theological_decisions:
- issue: Termo filial marcado por gênero
  choice: os filhos deles
  alternative: os descendentes deles / os filhos e filhas deles
  rationale: Não há necessidade contextual de neutralizar o masculino explícito υἱοί; preservar “filhos” mantém a forma do texto-fonte sem acrescentar uma especificação ausente.
- issue: Redação difícil da oração final
  choice: os filhos deles ficaram longe do caminho deles
  alternative: os filhos deles se afastaram do caminho
  rationale: A tradução principal conserva tanto o valor de πόρρω ἐγενήθησαν quanto o possessivo plural αὐτῶν. A alternativa mais fluente é registrada em nota, sem resolver silenciosamente a dificuldade sintática do texto grego.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imagens poéticas preservadas. A repetição de “deles” na oração final é intencional, pois reflete a redação difícil do grego; a nota oferece uma formulação mais fluente.
