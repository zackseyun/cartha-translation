  text: because those who work in silver and are concerned[a], and there is no finding out their works.
translation:
  language: pt
  text: porque os que trabalham a prata vivem preocupados,[a] e não há como descobrir suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os que moldam a prata e se inquietam; não há como descobrir suas obras». O grego é conciso e um tanto difícil; a frase pode descrever artesãos habilidosos cujas realizações, no fim, não permitem encontrar a sabedoria.'
    reason: Alternativa lexical e esclarecimento da ambiguidade sintática e contextual.
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Introduz uma explicação causal no argumento mais amplo e corresponde naturalmente ao valor do grego.
- source_word: οἱ τὸ ἀργύριον τεκταίνοντες
  choice: os que trabalham a prata
  rationale: A construção participial designa pessoas por sua atividade artesanal; «trabalham a prata» é claro e preserva o material como objeto direto.
- source_word: μεριμνῶντες
  choice: vivem preocupados
  rationale: Expressa cuidado inquieto ou ansiedade; «vivem preocupados» soa natural em português e mantém essa nuance.
- source_word: οὐκ ἔστιν ἐξεύρεσις
  choice: não há como descobrir
  rationale: Conserva a ideia de impossibilidade ou ausência de descoberta sem reproduzir de modo artificial a construção nominal grega.
- source_word: τῶν ἔργων αὐτῶν
  choice: suas obras
  rationale: Mantém a amplitude de ἔργα, que pode indicar tanto realizações quanto produtos do trabalho, sem decidir além do texto.
theological_decisions:
- issue: Relação dos artesãos e de suas obras com a busca da sabedoria
  choice: Preservar a formulação breve e ambígua do grego
  alternative: Explicitar que as realizações dos artesãos não conseguem descobrir a sabedoria
  rationale: O complemento referente à sabedoria é inferido do contexto, mas não aparece nesta oração; inseri-lo no texto resolveria uma tensão que o original deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão acompanham o grego, enquanto «não há como descobrir» evita uma formulação nominal pouco natural.
