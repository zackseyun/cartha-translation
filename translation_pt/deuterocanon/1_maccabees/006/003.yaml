base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/003.yaml
  text: And he came and sought to take the city and plunder it[a], but he was not able, because the plan became known to those from the city.
translation:
  language: pt
  text: Ele veio e procurou tomar a cidade e saqueá-la, mas não conseguiu, porque o plano se tornou conhecido dos habitantes da cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “porque o assunto se tornou conhecido” ou “porque o intento se tornou conhecido”. O termo grego λόγος pode significar palavra, notícia, assunto ou plano; aqui, o contexto favorece a ideia de que os habitantes souberam o que ele pretendia fazer.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβεῖν
  choice: tomar
  rationale: No contexto militar, significa apoderar-se da cidade. “Tomar” é natural em português para a conquista de uma cidade e permanece próximo do grego.
- source_word: προνομεῦσαι
  choice: saqueá-la
  rationale: O verbo indica pilhar ou tomar despojos. “Saquear” comunica isso de modo claro e direto.
- source_word: οὐκ ἠδυνάσθη
  choice: não conseguiu
  rationale: Expressa naturalmente em português a incapacidade de realizar o intento, sem alterar o sentido do grego.
- source_word: ἐγνώσθη
  choice: se tornou conhecido
  rationale: Preserva o valor passivo e não especifica como a informação chegou aos habitantes.
- source_word: ὁ λόγος
  choice: o plano
  rationale: Neste contexto, λόγος provavelmente designa a ação pretendida ou o plano que foi descoberto; a nota preserva alternativas mais neutras.
- source_word: τοῖς ἐκ τῆς πόλεως
  choice: dos habitantes da cidade
  rationale: A expressão significa literalmente “aos que eram da cidade”; em português atual, “habitantes da cidade” transmite o referente com naturalidade.
