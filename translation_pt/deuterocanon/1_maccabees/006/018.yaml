base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/018.yaml
  text: He named him Eupator[a]. And those from the citadel were hemming Israel in around the sanctuary[b], seeking evil continually and serving as a support to the nations.
translation:
  language: pt
  text: Deu-lhe o nome de Eupátor. Os da cidadela mantinham Israel encurralado ao redor do santuário[a], procurando fazer-lhe mal continuamente e servindo de apoio às nações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao redor dos lugares santos”; o grego diz literalmente “as coisas/os lugares santos” e provavelmente se refere à área do santuário.
    reason: lexical_alternative
  - marker: b
    text: Ou “servindo de apoio aos gentios”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ
  choice: Deu-lhe o nome de
  rationale: Expressão idiomática grega para atribuir um nome; a formulação portuguesa é natural e preserva o sentido.
- source_word: Εὐπάτωρ
  choice: Eupátor
  rationale: Transliteração do nome ou título pessoal, com acento gráfico conforme a pronúncia e a ortografia portuguesas.
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: os que estavam na cidadela
  rationale: Identifica o grupo ligado à fortaleza de Jerusalém sem acrescentar uma especificação de gênero ausente da expressão substantivada.
- source_word: ἦσαν συγκλείοντες
  choice: mantinham ... encurralado
  rationale: A construção perifrástica no imperfeito descreve uma ação contínua de fechar ou confinar; 'mantinham encurralado' comunica tanto a duração quanto a pressão exercida.
- source_word: τὸν Ἰσραὴλ
  choice: Israel
  rationale: Mantém o singular coletivo do grego.
- source_word: κύκλῳ τῶν ἁγίων
  choice: ao redor do santuário
  rationale: No contexto, o plural substantivado 'as coisas/os lugares santos' aponta para a área sagrada do templo; 'santuário' é claro e conciso, com a amplitude lexical registrada em nota.
- source_word: ζητοῦντες κακὰ
  choice: procurando fazer-lhe mal
  rationale: Expressa em português corrente a intenção hostil da locução, sem reduzir κακά a simples transtorno.
- source_word: διʼ ὅλου
  choice: continuamente
  rationale: Reproduz o valor idiomático de persistência e duração.
- source_word: στήριγμα τοῖς ἔθνεσιν
  choice: servindo de apoio às nações
  rationale: στήριγμα designa apoio ou sustentáculo, e o dativo indica aqueles a quem esse grupo dava suporte.
theological_decisions:
- issue: Sentido de ἔθνεσιν
  choice: nações
  alternative: gentios
  rationale: '''Nações'' conserva o sentido étnico-político amplo do termo no contexto, sem impor uma oposição teológica posterior entre judeus e gentios.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção verbal natural. A ação contínua do imperfeito grego foi preservada por 'mantinham' e pelos gerúndios coordenados. As notas mantêm a ambiguidade de τὰ ἅγια e a alternativa tradicional para ἔθνη.
