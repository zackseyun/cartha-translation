base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/027.yaml
  text: And if he does not get ahead of them quickly[a], they will do greater things than these[b], and he will not be able to restrain them.
translation:
  language: pt
  text: E, se ele não se antecipar a eles rapidamente[a], farão coisas maiores do que estas[b], e ele não conseguirá contê-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não agir antes deles rapidamente» ou «não os alcançar rapidamente»; o verbo grego sugere antecipar-se a eles ou frustrar-lhes a iniciativa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «coisas maiores do que estas»; no contexto, pode referir-se a ações mais graves ou mais amplas.
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαταλάβῃ
  choice: se antecipar a
  rationale: O verbo indica agir antes de outros ou frustrar-lhes a iniciativa. «Antecipar-se a» é natural em português e preserva a ideia de ação preventiva sem limitar o sentido a uma perseguição.
- source_word: διὰ τάχους
  choice: rapidamente
  rationale: A expressão indica rapidez ou prontidão; «rapidamente» transmite de modo claro a urgência.
- source_word: μείζονα τούτων
  choice: coisas maiores do que estas
  rationale: Mantém o comparativo literal e a abertura semântica do grego, permitindo que o contexto sugira ações mais graves ou mais amplas.
- source_word: κατασχεῖν
  choice: conter
  rationale: Neste contexto político-militar, o infinitivo comunica manter sob controle ou impedir o avanço. «Conter» é corrente e preciso.
- source_word: αὐτῶν
  choice: -los
  rationale: O genitivo ligado ao infinitivo é expresso idiomaticamente em português como objeto direto de «conter».
- source_word: οὐ δυνήσεται
  choice: não conseguirá
  rationale: Expressa com naturalidade a incapacidade futura indicada pelo grego.
