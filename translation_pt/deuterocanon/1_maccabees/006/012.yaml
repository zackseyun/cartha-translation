base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/012.yaml
  text: 'But now I remember the evils that I did in Jerusalem: I took all the silver vessels and the gold vessels that were in it[a], and I sent orders to wipe out the inhabitants of Judah for nothing.'
translation:
  language: pt
  text: 'Mas agora me lembro dos males que pratiquei em Jerusalém: tomei todos os utensílios de prata e de ouro que nela havia e mandei exterminar, sem motivo, os habitantes de Judá.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιμνήσκομαι
  choice: me lembro
  rationale: O presente médio indica uma recordação atual; a formulação é natural em português e preserva o tom reflexivo da confissão.
- source_word: τῶν κακῶν
  choice: dos males
  rationale: Mantém a caracterização moral das ações, sem reduzi-las a meros erros ou prejuízos.
- source_word: ἐποίησα
  choice: pratiquei
  rationale: Com «males», «pratiquei» é idiomático e conserva o sentido ativo de ter cometido tais atos.
- source_word: σκεύη τὰ ἀργυρᾶ καὶ τὰ χρυσᾶ
  choice: utensílios de prata e de ouro
  rationale: «Utensílios» é claro e apropriado para objetos valiosos ligados ao templo; a coordenação conserva os dois materiais sem repetição artificial.
- source_word: ἐξαπέστειλα τοῦ ἐξᾶραι
  choice: mandei exterminar
  rationale: Expressa de modo natural tanto o envio da ordem quanto a finalidade de eliminar completamente a população.
- source_word: τοὺς κατοικοῦντας Ἰούδα
  choice: os habitantes de Judá
  rationale: Reproduz com concisão a referência aos que residiam na região de Judá.
- source_word: διὰ κενῆς
  choice: sem motivo
  rationale: Verte o idioma como ausência de causa ou justificativa, evitando a possível leitura de «em vão» como falta de resultado.
theological_decisions:
- issue: Caracterização moral das ações de Antíoco em sua própria fala
  choice: «dos males que pratiquei»
  alternative: «dos erros que cometi»
  rationale: O grego κακῶν tem peso moral; «males» preserva a admissão de culpa sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Mandar exterminar» conserva a severidade do grego sem recorrer a uma expressão excessivamente coloquial.
