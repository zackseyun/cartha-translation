  yaml_path: translation/deuterocanon/1_maccabees/006/019.yaml
  text: And Judas decided to root them out[a], and he assembled all the people to besiege them.
translation:
  language: pt
  text: Judas decidiu eliminá-los e convocou todo o povo para sitiá-los.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cercá-los”; literalmente, “sentar-se ao redor deles”. A expressão tem aqui o sentido militar de pôr sob cerco.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογίσατο
  choice: decidiu
  rationale: O verbo no médio indica aqui uma decisão deliberada, e não mero cálculo ou reflexão.
- source_word: ἐξᾶραι
  choice: eliminá-los
  rationale: O infinitivo expressa a remoção hostil dos adversários. “Eliminá-los” preserva a força do termo sem especificar além do grego o modo como isso seria feito.
- source_word: ἐξεκκλησίασεν
  choice: convocou
  rationale: O verbo significa reunir ou chamar uma assembleia; com “todo o povo” como objeto, “convocou” é natural e preciso em português.
- source_word: πάντα τὸν λαόν
  choice: todo o povo
  rationale: Mantém a designação explícita do grego. Embora no contexto se trate do contingente reunido para a ação militar, o texto diz “povo”, não “exército”.
- source_word: τοῦ περικαθίσαι ἐπʼ αὐτούς
  choice: para sitiá-los
  rationale: O infinitivo articular indica a finalidade da convocação. A imagem literal de permanecer sentado ao redor de alguém funciona aqui como expressão militar para cercar e sitiar.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com sintaxe direta. O marcador da nota foi colocado após “sitiá-los”, pois a explicação corresponde ao grego τοῦ περικαθίσαι ἐπʼ αὐτούς.
