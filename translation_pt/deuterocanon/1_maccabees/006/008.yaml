base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/008.yaml
  text: And it happened that when the king heard these words[a], he was astonished and greatly shaken; and he fell upon his bed and became sick from grief, because it had not happened for him as he had planned.
translation:
  language: pt
  text: E aconteceu que, quando o rei ouviu essas palavras, ficou atônito e profundamente abalado; caiu sobre o leito e adoeceu de tristeza, porque não lhe saiu como havia planejado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque não lhe tinha acontecido conforme ele tinha em mente”.'
    reason: Registra uma tradução mais próxima da construção impessoal grega οὐκ ἐγένετο αὐτῷ e da nuance de intenção ou consideração em ἐνεθυμεῖτο.
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσεν
  choice: aconteceu que, quando [...] ouviu
  rationale: Preserva a transição narrativa de sabor semítico, mas continua clara e natural em português moderno.
- source_word: ἐθαμβήθη
  choice: ficou atônito
  rationale: Expressa o choque e o espanto provocados pelas más notícias sem acrescentar explicitamente a ideia de horror.
- source_word: ἐσαλεύθη σφόδρα
  choice: profundamente abalado
  rationale: Reproduz o sentido metafórico de forte perturbação interior e mantém a intensidade de σφόδρα.
- source_word: ἔπεσεν ἐπὶ τὴν κοίτην
  choice: caiu sobre o leito
  rationale: Mantém a imagem concreta do colapso físico e o registro digno do relato.
- source_word: ἐνέπεσεν εἰς ἀρρωστίαν
  choice: adoeceu
  rationale: Verte de modo natural a expressão grega que indica a entrada num estado de enfermidade.
- source_word: ἀπὸ τῆς λύπης
  choice: de tristeza
  rationale: Conserva a relação causal e o sentido amplo de pesar ou tristeza de λύπη.
- source_word: οὐκ ἐγένετο αὐτῷ
  choice: as coisas não lhe tinham acontecido
  rationale: Preserva a construção relativamente impessoal do grego, tornando explícito em português o sujeito neutro exigido pela fluência.
- source_word: καθὼς ἐνεθυμεῖτο
  choice: como ele havia planejado
  rationale: No contexto dos projetos frustrados do rei, 'planejado' comunica o sentido prático de intenção sem excluir a nuance de expectativa.
