lexical_decisions:
- source_word: διάδημα
  choice: diadema
  rationale: Designa a insígnia régia usada na cabeça. «Diadema» preserva a precisão histórica e é compreensível em português, sem confundi-la necessariamente com uma coroa de formato posterior.
- source_word: στολή
  choice: manto
  rationale: No contexto régio, refere-se a uma veste distintiva ou cerimonial. «Manto» comunica de modo natural a dignidade oficial sem acrescentar detalhes ausentes do grego.
- source_word: δακτύλιος
  choice: anel
  rationale: O termo grego significa simplesmente «anel». Embora o objeto possa ter funcionado como sinete e símbolo de autoridade, o texto não explicita isso.
- source_word: ἀγαγεῖν
  choice: para trazer
  rationale: O infinitivo articular expressa finalidade. «Para trazer» reproduz naturalmente essa construção e não especifica além do texto o modo ou propósito subsequente.
- source_word: Ἀντίοχον τὸν υἱὸν αὐτοῦ
  choice: seu filho Antíoco
  rationale: Esta ordem é natural em português e preserva a identificação de Antíoco como filho do rei.
