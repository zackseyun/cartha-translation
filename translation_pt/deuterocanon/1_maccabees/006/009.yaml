  yaml_path: translation/deuterocanon/1_maccabees/006/009.yaml
  text: And he remained there for many days[a], because great grief came over him, and he thought that he was dying.
translation:
  language: pt
  text: E permaneceu ali muitos dias, porque uma grande tristeza voltou a tomar conta dele[a], e ele pensou que estava morrendo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma grande tristeza se renovou sobre ele”. O verbo grego enfatiza que a tristeza retornou ou foi reavivada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: permaneceu ali
  rationale: A expressão indica presença continuada no lugar; “permaneceu ali” transmite naturalmente o aspecto durativo do contexto.
- source_word: ἡμέρας πλείους
  choice: muitos dias
  rationale: No contexto, a expressão descreve um período prolongado, e “muitos dias” é claro e idiomático em português.
- source_word: ἀνεκαινίσθη
  choice: voltou a tomar conta
  rationale: O passivo de ἀνακαινίζω comunica renovação ou retorno. Com “grande tristeza” como sujeito, esta formulação preserva a recorrência sem recorrer a uma construção artificial em português.
- source_word: ἐπ᾽ αὐτόν
  choice: dele
  rationale: Integrado à expressão portuguesa “tomar conta dele”, representa de modo natural a ideia de a tristeza vir sobre a pessoa e dominá-la.
- source_word: λύπη μεγάλη
  choice: uma grande tristeza
  rationale: λύπη designa tristeza, pesar ou aflição; “grande tristeza” mantém a força e a forma concreta da expressão grega.
- source_word: ἐλογίσατο
  choice: pensou
  rationale: O verbo pode significar considerar, calcular ou concluir. “Pensou” é natural neste relato e não intensifica indevidamente o grau de deliberação.
- source_word: ὅτι ἀποθνήσκει
  choice: que estava morrendo
  rationale: O presente grego apresenta a morte como processo percebido em andamento, adequadamente expresso pelo imperfeito progressivo em português.
