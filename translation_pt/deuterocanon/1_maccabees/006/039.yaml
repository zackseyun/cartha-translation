  text: And when the sun flashed on the golden shields, the mountains flashed from them and shone like torches of fire.
translation:
  language: pt
  text: Quando o sol reluzia sobre os escudos dourados, os montes reluziam com o reflexo deles e brilhavam como tochas de fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιλβεν
  choice: reluzia / reluziam
  rationale: O verbo descreve um brilho intenso produzido pela luz; a repetição em português preserva a repetição expressiva do grego e liga o brilho do sol nos escudos ao dos montes.
- source_word: χρυσᾶς
  choice: dourados
  rationale: É a forma adjetival natural em português para a aparência ou composição indicada pelo grego, sem especificar se os escudos eram de ouro maciço ou revestidos de ouro.
- source_word: ἀσπίδας
  choice: escudos
  rationale: Termo militar corrente, claro e correspondente ao substantivo grego.
- source_word: τὰ ὄρη
  choice: os montes
  rationale: ὄρη designa montes, montanhas ou regiões elevadas; «montes» é direto, natural e apropriado à paisagem descrita.
- source_word: ἀπʼ αὐτῶν
  choice: com o reflexo deles
  rationale: Explicita de modo natural em português que a luminosidade dos montes procedia da luz refletida pelos escudos, sentido contextual da preposição, sem alterar a imagem.
- source_word: κατήγαζεν
  choice: brilhavam
  rationale: O verbo indica emitir ou projetar luz. O plural concorda naturalmente com «os montes», sujeito preservado da oração anterior.
- source_word: ὡς λαμπάδες πυρός
  choice: como tochas de fogo
  rationale: Mantém a comparação vívida e a formulação concreta do grego, em linguagem ainda compreensível e digna.
