base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/010.yaml
  text: And he called all his friends and said to them[a], “Sleep departs from my eyes[c][b], and my heart faints from anxiety.”
translation:
  language: pt
  text: 'E ele chamou todos os seus amigos[a] e lhes disse: “O sono foge dos meus olhos, e meu coração desfalece de preocupação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus companheiros” ou “todos os seus conselheiros”; no contexto de uma corte helenística, “amigos” também pode designar integrantes do círculo íntimo de um governante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: O aoristo de καλέω significa aqui “chamar” ou “convocar”. “Chamou” é natural e preserva a formulação simples do grego.
- source_word: πάντας τοὺς φίλους αὐτοῦ
  choice: todos os seus amigos
  rationale: φίλοι significa literalmente “amigos”, embora, no contexto de uma corte helenística, também possa designar pessoas do círculo íntimo ou conselheiros do governante. A tradução principal conserva o sentido direto.
- source_word: Ἀφίσταται ἀπὸ τῶν ὀφθαλμῶν μου ὁ ὕπνος
  choice: O sono foge dos meus olhos
  rationale: ἀφίσταται indica afastar-se ou retirar-se. “O sono foge dos meus olhos” preserva a imagem vívida do original em português natural e dignificado.
- source_word: συνέπεπτον τῇ καρδίᾳ
  choice: meu coração desfalece
  rationale: A expressão descreve abatimento ou colapso interior. “Meu coração desfalece” comunica essa força emocional sem a estranheza de uma reprodução mecânica da construção grega com dativo.
- source_word: ἀπὸ τῆς μερίμνης
  choice: de preocupação
  rationale: μέριμνα pode significar preocupação, ansiedade ou inquietação. “Preocupação” é claro, corrente e adequado ao estado angustiado retratado.
