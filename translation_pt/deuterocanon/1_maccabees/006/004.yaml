  text: And they rose up against him in battle, and he fled and went away from there with great sorrow, to return to Babylon.
translation:
  language: pt
  text: Eles se levantaram contra ele em batalha, e ele fugiu e partiu dali com grande tristeza, para voltar à Babilônia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστησαν αὐτῷ εἰς πόλεμον
  choice: Eles se levantaram contra ele para a batalha
  rationale: Preserva a imagem verbal de ἀνίστημι e expressa de modo claro a ação hostil indicada por εἰς πόλεμον, sem reduzi-la simplesmente a um ataque pontual.
- source_word: ἔφυγεν
  choice: ele fugiu
  rationale: Tradução direta do verbo, mantendo a força narrativa e distinguindo fuga de mero afastamento.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: partiu dali
  rationale: Forma natural e concisa em português que preserva tanto a partida física quanto a referência ao lugar de onde ele saiu.
- source_word: μετὰ λύπης μεγάλης
  choice: com grande tristeza
  rationale: Mantém o sentido afetivo amplo de λύπη e a intensidade de μεγάλης, sem especificar uma causa ou emoção mais estreita.
- source_word: ἀποστρέψαι εἰς Βαβυλῶνα
  choice: a fim de voltar para a Babilônia
  rationale: Entende o infinitivo como propósito ligado à partida; “voltar” comunica adequadamente o movimento de retorno, e “a fim de” torna explícita a relação sintática sem alterar o conteúdo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção conserva a sequência narrativa do grego e sua linguagem concreta, evitando arcaísmos. O ponto e vírgula organiza a longa coordenação sem enfraquecer a progressão dos acontecimentos.
