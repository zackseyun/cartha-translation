translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Os dois imperfeitos passivos foram mantidos por construções com “eram”, enquanto o aoristo foi vertido por “estenderam”. A imagem idiomática da mão estendida foi preservada. O marcador da nota foi colocado junto de “territórios”, termo ao qual a alternativa lexical se refere.
