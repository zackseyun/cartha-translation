base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/025.yaml
  text: They were being put to death[a], and our inheritances were being plundered. And they stretched out their hand not only against us, but also against all their territories.
translation:
  language: pt
  text: Eles eram mortos, e nossas heranças eram saqueadas. Estenderam a mão não só contra nós, mas também contra todos os territórios deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra todas as fronteiras deles” ou “contra todas as regiões ao redor deles”. O termo grego pode designar tanto linhas de fronteira quanto os territórios delimitados por elas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθανατοῦντο
  choice: eram mortos
  rationale: O imperfeito passivo indica ação contínua ou repetida no passado. “Eram mortos” conserva a voz passiva e a gravidade do verbo sem acrescentar uma ideia de execução formal que o grego não exige.
- source_word: κληρονομίαι
  choice: heranças
  rationale: O termo pode indicar bens herdados ou propriedades ancestrais. “Heranças” preserva o vínculo familiar e hereditário, em vez de generalizar como “bens” ou “posses”.
- source_word: διηρπάζοντο
  choice: eram saqueadas
  rationale: O verbo expressa apropriação violenta ou pilhagem. A forma escolhida mantém tanto essa força quanto o aspecto contínuo ou repetido do imperfeito passivo.
- source_word: ἐξέτειναν χεῖρα
  choice: estenderam a mão contra
  rationale: A expressão idiomática descreve ação hostil. A tradução conserva a imagem do grego e permanece compreensível em português.
- source_word: ὅρια
  choice: territórios
  rationale: O substantivo pode designar limites, fronteiras ou as regiões por eles delimitadas. “Territórios” funciona naturalmente no contexto sem inserir a noção não explícita de que fossem territórios vizinhos.
- source_word: αὐτῶν
  choice: deles
  rationale: A forma explícita “deles” preserva o pronome grego e evita a possível ambiguidade de “seus” em português, sem definir além do texto a natureza exata da posse ou associação.
