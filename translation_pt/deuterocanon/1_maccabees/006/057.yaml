base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/057.yaml
  text: And they kept urging and pressing to depart[a]. And he said to the king and the leaders of the army and the men, “We are growing weaker day by day, and our food is scant, and the place where we are encamped is strong[b], and the affairs of the kingdom are pressing upon us.”
translation:
  language: pt
  text: 'Eles insistiam com urgência em partir. Então ele disse ao rei, aos comandantes do exército e aos soldados: “Estamos perdendo as forças dia após dia[a], temos pouca comida, o lugar onde estamos acampados é fortificado, e os assuntos do reino pesam sobre nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Estamos nos esgotando dia após dia”; o verbo grego pode indicar enfraquecimento, esgotamento ou diminuição.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέσπευδον καὶ ἐπενύοντο
  choice: se apressavam e insistiam
  rationale: Os dois imperfeitos exprimem ação contínua e enfática em favor da partida. A formulação conserva a dupla expressão grega sem tornar o português excessivamente literal.
- source_word: τοῦ ἀπελθεῖν
  choice: em partir
  rationale: O infinitivo indica a ação que procuravam apressar ou promover; “partir” é natural e adequado ao contexto militar.
- source_word: Ἐκλείπομεν
  choice: Estamos perdendo as forças
  rationale: O verbo pode indicar enfraquecimento, esgotamento ou redução. A escolha comunica o sentido contextual sem restringi-lo explicitamente à diminuição do número de soldados.
- source_word: ἡ τροφὴ ἡμῖν ὀλίγη
  choice: temos pouca comida
  rationale: Tradução clara e corrente que preserva a afirmação direta de escassez de sustento.
- source_word: ὁ τόπος, οὗ παρεμβάλλομεν, ἐστὶν ὀχυρός
  choice: o lugar onde estamos acampados é fortificado
  rationale: “Fortificado” explicita naturalmente o valor militar de ὀχυρός, enquanto “estamos acampados” mantém o presente de παρεμβάλλομεν.
- source_word: ἐπίκειται ἡμῖν τὰ τῆς βασιλείας
  choice: os assuntos do reino exigem nossa atenção
  rationale: A expressão idiomática comunica que as questões do reino pesam sobre eles e são urgentes. A formulação é natural em português e evita o calque pouco idiomático “pressionam sobre nós”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O discurso militar permanece direto. A ambiguidade de Ἐκλείπομεν é preservada por nota, sem limitar o sentido apenas às forças físicas, aos recursos ou ao número de soldados.
