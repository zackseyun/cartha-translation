  text: And the king captured Bethsura[b][a], and he stationed a garrison there to guard it.
translation:
  language: pt
  text: E o rei tomou Betsura[a] e deixou ali uma guarnição para guardá-la.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “capturou Betsura” ou “apoderou-se de Betsura”. O verbo grego pode indicar, de modo geral, a tomada de posse da cidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “estabeleceu ali uma guarnição para mantê-la sob controle”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελάβετο
  choice: tomou
  rationale: No contexto militar, o verbo indica apoderar-se de uma localidade. “Tomou” preserva a amplitude do grego sem especificar além do necessário se houve captura por combate ou ocupação.
- source_word: ὁ βασιλεύς
  choice: o rei
  rationale: Tradução direta do título, sem substituir o referente por um nome próprio não expresso neste versículo.
- source_word: τὴν Βεθσούραν
  choice: Betsura
  rationale: Transliteração portuguesa da forma grega Βεθσούρα, sem harmonizá-la com a forma hebraica Bete-Zur.
- source_word: ἐπέταξεν ... φρουράν
  choice: deixou ... uma guarnição
  rationale: A construção descreve a colocação ou designação de uma força militar no local. “Deixou ali uma guarnição” é natural em português e comunica que a tropa foi incumbida de manter a cidade.
- source_word: τηρεῖν αὐτήν
  choice: para guardá-la
  rationale: 'O infinitivo expressa a finalidade da guarnição: vigiar, conservar ou manter sob controle a cidade, representada pelo pronome feminino.'
