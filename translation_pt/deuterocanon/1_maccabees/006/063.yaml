  yaml_path: translation/deuterocanon/1_maccabees/006/063.yaml
  text: And he departed in haste and returned to Antioch, and he found Philip in control of the city, and he fought against him and took the city by force.
translation:
  language: pt
  text: Ele partiu às pressas e voltou para Antioquia; encontrou Filipe no controle da cidade, lutou contra ele e tomou a cidade à força.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: O aoristo indica que ele deixou prontamente o lugar onde estava; «partiu» é natural e não acrescenta detalhes de modo ou destino.
- source_word: κατὰ σπουδήν
  choice: às pressas
  rationale: A expressão idiomática comunica rapidez e urgência; «às pressas» conserva ambas em português corrente.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: voltou para Antioquia
  rationale: O verbo com εἰς expressa retorno em direção à cidade; a formulação é clara e idiomática.
- source_word: εὗρεν Φίλιππον κυριεύοντα τῆς πόλεως
  choice: encontrou Filipe no controle da cidade
  rationale: κυριεύω indica exercer domínio ou controle. A escolha evita sugerir, além do texto, que Filipe reinava formalmente.
- source_word: ἐπολέμησεν πρὸς αὐτόν
  choice: lutou contra ele
  rationale: Expressa de maneira direta o confronto militar indicado por πολεμέω, sem amplificação.
- source_word: κατελάβετο τὴν πόλιν βίᾳ
  choice: tomou a cidade à força
  rationale: Neste contexto, καταλαμβάνω denota apoderar-se ou capturar, enquanto βίᾳ especifica o uso da força; a tradução preserva de modo conciso o resultado e o meio.
