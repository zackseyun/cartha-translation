translation_notes:
  register: Português moderno, digno e narrativamente fluido, com ampla legibilidade brasileira. A divisão em duas frases e o advérbio «Ali» tornam explícita apenas a conexão espacial já presente na sequência grega, sem alterar o conteúdo.
