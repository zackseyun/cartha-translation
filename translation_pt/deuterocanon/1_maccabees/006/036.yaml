  text: These were there beforehand[a], wherever the beast might be; and wherever it went, they went with it and did not leave it.
translation:
  language: pt
  text: Estes estavam de antemão onde quer que o animal[a] estivesse; e, para onde quer que ele fosse, iam junto com ele e não se afastavam dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fera”; neste contexto, trata-se de um elefante.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Estes
  rationale: O demonstrativo retoma os homens designados no contexto anterior, sem acrescentar ao texto grego um substantivo explícito.
- source_word: πρὸ καιροῦ
  choice: já estavam posicionados de antemão
  rationale: A expressão indica preparação ou colocação antecipada; “posicionados” torna clara a ideia contextual sem perder o valor temporal de “de antemão”.
- source_word: οὗ ἂν ᾖ
  choice: onde quer que ... estivesse
  rationale: Reproduz o caráter indefinido e aberto da oração relativa formada com ἄν.
- source_word: τὸ θηρίον
  choice: o animal
  rationale: Θηρίον designa aqui o animal mencionado no contexto, especificamente um elefante. “Animal” é natural e preserva a formulação genérica do grego.
- source_word: ἐπορεύετο
  choice: fosse
  rationale: Verbo comum de deslocamento; a forma escolhida se integra naturalmente à construção indefinida “para onde quer que” sem acrescentar a ideia específica de marcha.
- source_word: ἅμα
  choice: junto com ele
  rationale: Expressa movimento coordenado ou conjunto com o animal.
- source_word: οὐκ ἀφίσταντο ἐπʼ αὐτοῦ
  choice: não se afastavam dele
  rationale: Preserva de modo idiomático a ideia de não se separarem nem se retirarem do animal.
