lexical_decisions:
- source_word: ὤμοσεν
  choice: prestaram juramento
  rationale: Expressa de modo natural e solene o ato de jurar, preservando a força formal e político-jurídica do grego.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: Equivalente direto e corrente de βασιλεύς na narrativa histórica.
- source_word: οἱ ἄρχοντες
  choice: os governantes
  rationale: Mantém o sentido amplo de autoridades políticas ou dirigentes, sem restringi-los a uma função administrativa específica.
- source_word: ἐπὶ τούτοις
  choice: nesses termos
  rationale: Retoma as condições apresentadas anteriormente e traduz de maneira idiomática a relação do juramento com elas.
- source_word: ἐξῆλθεν
  choice: ele saiu
  rationale: Preserva o singular do verbo grego e deixa implícito, como no texto-fonte, quem é o sujeito.
- source_word: τοῦ ὀχυρώματος
  choice: da fortaleza
  rationale: Transmite com clareza o sentido de um lugar fortificado no contexto militar.
