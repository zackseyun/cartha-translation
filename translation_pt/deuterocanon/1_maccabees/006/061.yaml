translation_notes:
  register: Português moderno, claro e digno, com vocabulário acessível. “Prestaram juramento nesses termos” conserva a solenidade do ato e explicita apenas a referência anafórica já presente em ἐπὶ τούτοις. O singular de ἐξῆλθεν foi mantido no texto principal sem identificar além do que o grego permite o sujeito implícito.
