  yaml_path: translation/deuterocanon/1_maccabees/006/062.yaml
  text: And the king entered Mount Zion[a], and when he saw the fortification of the place[b], he broke the oath that he had sworn and gave orders to tear down the wall all around.
translation:
  language: pt
  text: E o rei entrou no monte Sião e, ao ver a fortificação[a] do lugar, rompeu[b] o juramento que havia feito, deu ordens e derrubou a muralha ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fortaleza” ou “a praça-forte”.
    reason: lexical_alternative
  - marker: b
    text: Ou “desconsiderou” ou “violou”; o verbo grego indica invalidar ou desprezar um compromisso vinculante.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: Equivalente direto e natural do aoristo narrativo de εἰσέρχομαι, preservando o movimento para dentro do local.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: Tradução padrão de βασιλεύς no relato histórico, sem explicitação ausente do grego.
- source_word: τὸ ὄρος Σιών
  choice: o monte Sião
  rationale: Forma geográfica tradicional e clara em português para ὄρος Σιών.
- source_word: τὸ ὀχύρωμα
  choice: a fortificação
  rationale: ὀχύρωμα designa uma obra ou estrutura fortificada; “fortificação” preserva o caráter militar sem especificar indevidamente o tipo de construção.
- source_word: τοῦ τόπου
  choice: do lugar
  rationale: Mantém de modo simples e natural a relação genitiva do texto grego.
- source_word: ἠθέτησεν
  choice: rompeu
  rationale: No contexto de um juramento, o verbo exprime desconsiderar ou violar um compromisso vinculante; “rompeu” conserva com clareza sua força moral.
- source_word: τὸν ὁρκισμὸν ὃν ὤμοσεν
  choice: o juramento que havia feito
  rationale: Preserva o substantivo e a oração relativa; “havia feito” expressa naturalmente em português a anterioridade do juramento, sem a construção pouco idiomática “juramento que havia jurado”.
- source_word: ἐνετείλατο
  choice: deu ordens
  rationale: Forma idiomática adequada ao contexto militar para o sentido de ordenar ou mandar.
- source_word: καθεῖλεν
  choice: para derrubar
  rationale: Com “deu ordens”, o infinitivo português explicita naturalmente o conteúdo da ordem e transmite o sentido de demolir de καθαιρέω.
- source_word: τὸ τεῖχος κυκλόθεν
  choice: toda a muralha ao redor
  rationale: “Muralha” convém ao contexto defensivo de τεῖχος, e “toda ... ao redor” comunica que a demolição abrangia o perímetro.
theological_decisions:
- issue: Força moral de ἠθέτησεν em relação a um juramento
  choice: rompeu o juramento
  alternative: desconsiderou ou violou o juramento
  rationale: A expressão apresenta o rei repudiando um compromisso jurado. “Rompeu” mantém a gravidade ética da ação em linguagem atual, sem acrescentar interpretação teológica além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação narrativa do grego foi preservada, enquanto a pontuação e a construção infinitiva foram ajustadas à fluência do português. Os marcadores foram posicionados junto aos termos a que suas notas se referem.
