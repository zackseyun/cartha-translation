  text: And they divided the beasts among the units, and beside each elephant they stationed a thousand men in coats of mail, with bronze helmets on their heads, and five hundred picked horsemen assigned to each beast.
translation:
  language: pt
  text: Eles distribuíram os animais entre as unidades militares[a] e, junto de cada elefante, posicionaram mil homens protegidos por cotas de malha, com capacetes de bronze na cabeça, e quinhentos cavaleiros escolhidos, designados para cada animal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre as divisões” ou “entre as formações”. A expressão grega é difícil neste contexto, mas provavelmente tem sentido militar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cada fera” ou “cada animal”; neste contexto, trata-se de cada elefante.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεῖλον
  choice: distribuíram
  rationale: O aoristo de διαιρέω pode significar dividir ou distribuir; “distribuíram” exprime com naturalidade a disposição tática dos animais entre formações.
- source_word: τὰ θηρία
  choice: os animais
  rationale: Preserva o termo genérico do grego sem a conotação potencialmente depreciativa de “feras”; o contexto e a menção subsequente a cada elefante identificam os animais.
- source_word: εἰς τὰς φάραγγας
  choice: entre as unidades militares
  rationale: A expressão é difícil. Neste contexto, φάραγγας provavelmente designa formações ou divisões militares; “unidades militares” comunica esse sentido sem impor o tecnicismo “falanges” como certeza.
- source_word: παρέστησαν
  choice: posicionaram
  rationale: No contexto militar, o verbo indica colocar ou postar em determinada posição.
- source_word: ἐφʼ ἑκάστῳ ἐλέφαντι
  choice: junto de cada elefante
  rationale: ἐπί com dativo admite sentidos como “sobre”, “junto de” ou “para”. “Junto de” é taticamente plausível e evita sugerir que os mil homens estivessem montados no elefante.
- source_word: χιλίους ἄνδρας τεθωρακισμένους ἐν ἁλυσιδωτοῖς
  choice: mil homens protegidos com cotas de malha
  rationale: A formulação reúne de modo natural a ideia geral de homens encouraçados e a especificação de armadura feita de malha.
- source_word: περικεφαλαῖαι χαλκαῖ
  choice: capacetes de bronze
  rationale: Tradução direta e corrente do equipamento militar mencionado.
- source_word: πεντακόσιοι ἵπποι
  choice: quinhentos cavaleiros
  rationale: Embora ἵπποι signifique literalmente “cavalos”, em enumerações militares pode representar a cavalaria ou os homens montados; “cavaleiros” concorda com ἐκλελεγμένοι e produz sentido natural no contexto.
- source_word: διατεταγμένοι
  choice: designados
  rationale: O particípio indica que os cavaleiros foram ordenadamente destinados a cada animal.
- source_word: ἐκλελεγμένοι
  choice: escolhidos
  rationale: 'Preserva o sentido do particípio perfeito: homens selecionados para essa função.'
