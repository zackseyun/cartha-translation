lexical_decisions:
- source_word: ἔγνων
  choice: Sei
  rationale: O aoristo de γινώσκω expressa aqui uma compreensão alcançada cujo resultado permanece no presente; «Sei» é natural no discurso direto e preserva esse reconhecimento atual.
- source_word: χάριν τούτων
  choice: por causa dessas coisas
  rationale: χάριν com o genitivo tem sentido causal neste contexto e indica que os sofrimentos decorrem das ações mencionadas.
- source_word: εὗρόν με
  choice: me sobrevieram
  rationale: Embora a expressão signifique literalmente «me encontraram», com males como sujeito o português idiomático «me sobrevieram» comunica que tais desgraças recaíram sobre o falante.
- source_word: τὰ κακὰ ταῦτα
  choice: estes males
  rationale: κακά designa aqui infortúnios ou calamidades, não necessariamente maldade moral. «Estes males» preserva a forma lexical e o registro bíblico sem restringir indevidamente o sentido.
- source_word: καὶ
  choice: e
  rationale: O texto grego fornecido termina com a conjunção καὶ. Ela é mantida para representar com fidelidade a oração incompleta, sem suprir material ausente.
