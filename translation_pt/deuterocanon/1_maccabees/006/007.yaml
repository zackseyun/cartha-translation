  text: and they tore down the abomination that he had built upon the altar in Jerusalem[a], and they surrounded the sanctuary, as before, with high walls, and also Bethsura[b], his city.
translation:
  language: pt
  text: E derrubaram a abominação que ele tinha construído sobre o altar em Jerusalém[a] e cercaram o santuário, como antes, com altas muralhas, bem como Betsura, sua cidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a coisa detestável”. O grego traz “a abominação”, termo de forte sentido cultual para algo ofensivo no culto.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega “Betsura, sua cidade” é condensada. O referente de “sua” não é explicitado; no contexto, pode referir-se a Judas ou, de modo mais geral, a uma cidade sob seu controle.
    reason: alternative_reading
lexical_decisions:
- source_word: καθεῖλαν
  choice: derrubaram
  rationale: O aoristo de καθαιρέω descreve a demolição ou remoção forçada de uma construção ou instalação; “derrubaram” é natural e preserva o sentido físico.
- source_word: τὸ βδέλυγμα
  choice: a abominação
  rationale: βδέλυγμα designa algo repugnante ou detestável, especialmente em contexto de culto. “A abominação” conserva essa força cultual sem acrescentar “da desolação”, expressão ausente do versículo.
- source_word: ᾠκοδόμησεν
  choice: tinha construído
  rationale: O verbo significa literalmente “construir”. O mais-que-perfeito composto expressa com clareza que a construção antecedeu sua demolição no relato.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sobre o altar
  rationale: ἐπί com acusativo indica aqui posição sobre o altar; “sobre” é preciso e idiomático em português.
- source_word: τὸ ἁγίασμα
  choice: o santuário
  rationale: No contexto do templo, ἁγίασμα se refere ao lugar ou recinto sagrado; “santuário” é claro, digno e corrente.
- source_word: καθὼς τὸ πρότερον
  choice: como antes
  rationale: A expressão indica restauração ao estado anterior; a tradução é concisa e natural.
- source_word: ἐκύκλωσαν τείχεσιν ὑψηλοῖς
  choice: cercaram ... com muralhas altas
  rationale: O verbo significa rodear ou circundar, e o dativo instrumental indica o meio empregado. A formulação evita tornar explícita uma interpretação mais ampla como “fortificaram”.
- source_word: τὴν Βεθσουρὰ πόλιν αὐτοῦ
  choice: também Betsura, sua cidade
  rationale: A construção grega é condensada e faz de Betsura outro objeto do verbo “cercaram”. “Também” esclarece a coordenação, enquanto “sua” preserva a referência pronominal ambígua do original.
theological_decisions:
- issue: Tradução de βδέλυγμα em contexto de polêmica cultual
  choice: a abominação
  alternative: a coisa detestável
  rationale: “Abominação” mantém a ressonância cultual estabelecida do termo, mas não importa a fórmula ampliada “abominação da desolação”, que não aparece no texto grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a estrutura coordenada do grego e sua ambiguidade pronominal, sem ampliar o termo cultual nem resolver silenciosamente o referente de “sua”.
