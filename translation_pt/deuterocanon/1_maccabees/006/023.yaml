translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a abertura fragmentária do testemunho grego e a metáfora bíblica de “andar”, enquanto “Estamos dispostos” evita a rigidez pouco natural de “Temos prazer” no contexto de lealdade política.
