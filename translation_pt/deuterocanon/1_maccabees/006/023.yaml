  text: judgment[a], and avenge our brothers? We are pleased to serve your father and to walk according to what is said by him[c][b],
translation:
  language: pt
  text: juízo e vingarás nossos irmãos?[b] Estamos dispostos a servir ao seu pai e a andar de acordo com o que ele diz.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou “fará justiça em favor de nossos irmãos”. O verbo grego pode indicar tanto vingança como a obtenção de justiça em favor de alguém.
    reason: lexical_alternative
  - marker: c
    text: Isto é, “viver de acordo com o que ele diz”. O grego diz literalmente “andar segundo as coisas ditas por ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσιν
  choice: juízo
  rationale: Preserva o sentido formal de decisão judicial ou justiça sem definir em excesso a nuance, especialmente porque o texto transmitido começa no meio da frase.
- source_word: ἐκδικήσεις
  choice: vingar
  rationale: O verbo pode indicar vingar uma ofensa ou obter justiça por alguém. “Vingar” expressa diretamente a força do termo, enquanto a nota registra a alternativa jurídica.
- source_word: τοὺς ἀδελφοὺς ἡμῶν
  choice: nossos irmãos
  rationale: Mantém o termo familiar do grego, que neste contexto também pode abranger compatriotas ou companheiros.
- source_word: εὐδοκοῦμεν
  choice: Estamos dispostos
  rationale: No contexto de submissão política, expressa de modo natural a disposição favorável para servir, sem sugerir necessariamente prazer emocional.
- source_word: δουλεύειν
  choice: servir
  rationale: Embora o verbo possa denotar condição servil, aqui descreve lealdade e sujeição a um governante; “servir” comunica adequadamente esse sentido contextual.
- source_word: τῷ πατρί σου
  choice: ao seu pai
  rationale: Reprodução direta e natural do complemento dativo de δουλεύειν.
- source_word: πορεύεσθαι
  choice: andar
  rationale: Preserva a metáfora bíblica de conduzir a vida ou proceder segundo determinada orientação.
- source_word: τοῖς ὑπʼ αὐτοῦ λεγομένοις
  choice: de acordo com o que ele diz
  rationale: Expressa com naturalidade “segundo as coisas ditas por ele” sem fortalecer a frase para “suas ordens”, que seria mais interpretativo.
