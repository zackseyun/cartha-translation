lexical_decisions:
- source_word: ἐκθρέψαι
  choice: criar
  rationale: No contexto da criação de um jovem sucessor, o verbo indica fazê-lo crescer ou educá-lo até a maturidade; “criar” é natural e preserva esse sentido.
- source_word: βασιλεύειν
  choice: reinar
  rationale: O verbo designa especificamente o exercício da realeza; “reinar” conserva esse sentido sem ampliar para o mais genérico “governar”.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Tradução direta e sem eufemismo do verbo comum para morrer.
- source_word: ἐκεῖ
  choice: ali
  rationale: Advérbio locativo simples; “ali” retoma com naturalidade o lugar mencionado no contexto anterior.
- source_word: ἔτους ἐνάτου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: no ano cento e quarenta e nove
  rationale: Reproduz claramente a indicação cronológica e a numeração do ano presentes no grego, sem acrescentar ao texto a identificação da era.
