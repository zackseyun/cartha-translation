  text: And the king was enraged when he heard it, and he gathered all his Friends, the commanders of his forces, and those over the reins.
translation:
  language: pt
  text: Quando o rei ouviu isso, ficou furioso e reuniu todos os seus Amigos, os comandantes de suas forças e os responsáveis pelas rédeas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os encarregados da cavalaria”. A expressão grega diz literalmente “os que estavam sobre as rédeas”.'
    reason: A expressão τοὺς ἐπὶ τῶν ἡνιῶν é incomum e pode designar oficiais ligados aos carros ou à cavalaria; a nota preserva essa incerteza.
lexical_decisions:
- source_word: ὠργίσθη
  choice: ficou furioso
  rationale: Expressa de modo natural e vigoroso a ira intensa do rei, preservando o valor passivo/incoativo do aoristo.
- source_word: τοὺς φίλους αὐτοῦ
  choice: os seus Amigos
  rationale: A maiúscula indica que “Amigos” funciona como título cortesão oficial, e não apenas como referência a companheiros pessoais.
- source_word: ἄρχοντας δυνάμεως αὐτοῦ
  choice: os comandantes de suas forças
  rationale: Traduz com clareza os chefes militares ligados às forças do rei.
- source_word: τοὺς ἐπὶ τῶν ἡνιῶν
  choice: os responsáveis pelas rédeas
  rationale: Mantém a imagem concreta e a concisão do grego, cuja referência institucional exata é incerta.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural. A ordem da primeira oração foi ajustada ao uso corrente do português. “Amigos” recebe inicial maiúscula para sinalizar o título da corte selêucida; a expressão final permanece imagética, com esclarecimento em nota.
