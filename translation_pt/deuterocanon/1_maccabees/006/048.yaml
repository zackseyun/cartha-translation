  text: And from the king’s camp they went up to meet them at Jerusalem[a], and the king encamped in Judea and at Mount Zion.
translation:
  language: pt
  text: Do acampamento do rei, subiram para ir ao encontro deles em Jerusalém; e o rei acampou na Judeia e no monte Sião.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολῆς
  choice: acampamento
  rationale: No contexto militar, o substantivo designa o acampamento das tropas; «acampamento» é natural e preserva o sentido concreto.
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Mantém o sentido topográfico de ascender em direção a Jerusalém sem acrescentar que se tratava necessariamente de uma marcha.
- source_word: εἰς συνάντησιν αὐτῶν
  choice: para encontrar-se com eles
  rationale: Reproduz o propósito do movimento e conserva a possível neutralidade de συνάντησις, sem definir por si só se o encontro foi amistoso ou hostil.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: No relato militar, o verbo significa estabelecer acampamento; «acampou» é claro, corrente e conciso.
- source_word: Ἰουδαίαν
  choice: Judeia
  rationale: Refere-se à região geográfico-política da Judeia, conforme o uso helenístico.
- source_word: ὄρος Σιών
  choice: monte Sião
  rationale: É a forma portuguesa tradicional, transparente e geograficamente adequada para a expressão grega.
