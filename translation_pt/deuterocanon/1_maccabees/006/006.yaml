base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/006.yaml
  text: And Lysias marched at first with a strong force[a], but was driven back before them, and they grew strong by means of the weapons that they had taken from the camps they had cut down.
translation:
  language: pt
  text: E Lísias marchou, a princípio, com uma força poderosa, mas foi rechaçado diante deles; e eles se fortaleceram com as armas que haviam tomado dos acampamentos que destruíram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e prevaleceram com as armas que haviam tomado dos acampamentos que abateram». O grego pode destacar tanto o fortalecimento quanto a vitória; a oração final emprega uma expressão militar condensada, cujo verbo significa literalmente “cortar” ou “abater”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: marchou
  rationale: No contexto militar e com δυνάμει ἰσχυρᾷ, «marchou» expressa naturalmente o deslocamento organizado de tropas.
- source_word: δυνάμει ἰσχυρᾷ
  choice: com uma força poderosa
  rationale: δύναμις designa aqui uma força militar; a tradução mantém esse sentido sem especificar além do grego que se tratava de um exército.
- source_word: ἐν πρώτοις
  choice: a princípio
  rationale: A expressão indica a fase inicial dos acontecimentos e prepara o contraste com o revés subsequente.
- source_word: ἀνετράπη ἀπὸ προσώπου αὐτῶν
  choice: foi rechaçado diante deles
  rationale: Em contexto de batalha, o passivo indica que Lísias foi repelido; «diante deles» preserva a imagem espacial de ἀπὸ προσώπου αὐτῶν.
- source_word: ἴσχυσαν
  choice: se fortaleceram
  rationale: O verbo pode significar tornar-se forte ou prevalecer. Com o dativo instrumental ὅπλοις, «se fortaleceram» conserva a ideia de aumento de força por meio das armas capturadas.
- source_word: ὅπλοις
  choice: com as armas
  rationale: O dativo é instrumental, e «com as armas» o expressa de modo claro e natural em português.
- source_word: παρεμβολῶν
  choice: acampamentos
  rationale: παρεμβολή designa normalmente um acampamento militar neste contexto.
- source_word: ἐξέκοψαν
  choice: destruíram
  rationale: Embora o verbo tenha a imagem concreta de cortar ou abater, aplicado aos acampamentos em uma cláusula militar comprimida, «destruíram» comunica com clareza a derrota e eliminação desses acampamentos, sem introduzir um objeto implícito no texto principal.
