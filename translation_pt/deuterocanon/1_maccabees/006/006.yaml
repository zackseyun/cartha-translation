  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação preserva o tom de relato militar e registra em nota a ambiguidade de ἴσχυσαν e a imagem concreta, porém comprimida, de ἐξέκοψαν.
