  text: And they also made engines against their engines[a], and they fought for many days.
translation:
  language: pt
  text: Eles também construíram máquinas de guerra contra as máquinas deles[a] e combateram durante muitos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «máquinas de cerco» ou simplesmente «máquinas». O termo grego se refere a dispositivos mecânicos usados na guerra, especialmente em contextos de cerco.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηχανὰς
  choice: máquinas de guerra
  rationale: No contexto militar e de cerco, o termo designa dispositivos mecânicos usados em combate. «Máquinas de guerra» é claro e natural em português, sem especificar um tipo não indicado pelo grego.
- source_word: πρὸς
  choice: para enfrentar
  rationale: Com o acusativo neste contexto hostil, indica oposição. «Para enfrentar» expressa de modo natural que as máquinas foram construídas em resposta às do adversário.
- source_word: ἐπολέμησαν
  choice: combateram
  rationale: Traduz diretamente a ação de entrar ou permanecer em combate e mantém o tom narrativo conciso do aoristo.
- source_word: ἡμέρας πολλάς
  choice: durante muitos dias
  rationale: Reproduz naturalmente em português o acusativo grego de duração.
- source_word: καὶ αὐτοὶ
  choice: Eles também
  rationale: 'Preserva o sentido aditivo e responsivo: esse grupo igualmente construiu máquinas de guerra.'
