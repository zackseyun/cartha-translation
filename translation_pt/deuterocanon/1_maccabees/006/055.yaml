  text: And Lysias heard that Philip[a], whom King Antiochus had appointed while he was still alive to bring up Antiochus his son so that he might reign,
translation:
  language: pt
  text: E Lísias soube que Filipe, a quem o rei Antíoco havia designado, enquanto ainda vivia, para criar Antíoco, seu filho, a fim de que este reinasse[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fim de que ele se tornasse rei”. O infinitivo grego βασιλεῦσαι pode referir-se tanto a reinar quanto, neste contexto, a assumir a realeza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube
  rationale: Neste contexto, ἀκούω introduz uma informação recebida. “Soube” é mais natural em português narrativo do que o literal “ouviu”, sem acrescentar uma fonte específica para a notícia.
- source_word: κατέστησεν
  choice: havia designado
  rationale: O verbo indica a nomeação formal de Filipe para uma responsabilidade; o mais-que-perfeito composto deixa claro que a designação antecedeu a notícia recebida por Lísias.
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: ainda em vida
  rationale: A expressão conserva o valor temporal do genitivo absoluto e, por sua posição junto a “o rei Antíoco”, indica de modo natural que a referência é ao rei.
- source_word: ἐκθρέψαι
  choice: para criar
  rationale: ἐκτρέφω abrange sustentar e educar uma criança até a maturidade. “Criar” é corrente e suficientemente amplo, sem limitar a função de Filipe à instrução formal.
- source_word: εἰς τὸ βασιλεῦσαι αὐτόν
  choice: a fim de que ele reinasse
  rationale: A construção indica propósito ou resultado pretendido. “Reinasse” preserva o sentido verbal de βασιλεύω sem explicitar além do grego se o foco recai no exercício do reinado ou na ascensão ao trono.
- source_word: ὁ βασιλεὺς Ἀντίοχος
  choice: o rei Antíoco
  rationale: Esta é a ordem idiomática do título e do nome em português.
