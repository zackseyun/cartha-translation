translation_notes:
  register: Português moderno, claro e digno, com vocabulário militar acessível. Preservou-se a força imagética de ἐν ὁρμήματι αὐτῆς por meio de “com todo o seu ímpeto”, em vez de explicá-la como simples totalidade numérica. A divisão em duas frases favorece a leitura sem alterar a sequência narrativa.
