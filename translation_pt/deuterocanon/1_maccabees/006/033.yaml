base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/033.yaml
  text: And the king rose early in the morning and moved the camp out in full force on the road to Beth-zachariah[a], and the forces drew up for battle[b], and they sounded the trumpets.
translation:
  language: pt
  text: O rei se levantou de madrugada e pôs o acampamento em marcha com todo o seu ímpeto pela estrada de Bet-Zacarias[a]. As tropas se posicionaram para a batalha, e tocaram as trombetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela estrada que levava a Bet-Zacarias”. A expressão grega pode indicar movimento ao longo da rota associada a esse lugar ou em direção a ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρισεν
  choice: se levantou de madrugada
  rationale: Expressa a ação de levantar-se ou estar ativo bem cedo, preservando a ênfase temporal do grego sem antecipar no verbo a ideia de partida.
- source_word: ἀπῆρεν τὴν παρεμβολὴν
  choice: pôs o acampamento em marcha
  rationale: No contexto militar, ἀπαίρω com παρεμβολή indica levantar e deslocar o acampamento; a formulação portuguesa comunica de modo natural o movimento organizado do exército.
- source_word: ἐν ὁρμήματι αὐτῆς
  choice: com todo o seu ímpeto
  rationale: ὅρμημα pode denotar impulso, ímpeto ou avanço impetuoso. A tradução conserva a imagem dinâmica e a referência pronominal ao acampamento, sem reduzi-la simplesmente ao número total das tropas.
- source_word: κατὰ τὴν ὁδὸν Βεθζαχαριά
  choice: pela estrada de Bet-Zacarias
  rationale: κατά com ὁδός indica movimento ao longo de uma rota. A expressão pode designar a estrada que levava a Bet-Zacarias ou a rota associada ao lugar; a nota preserva essa amplitude.
- source_word: διετάξαντο αἱ δυνάμεις εἰς τὸν πόλεμον
  choice: As tropas se posicionaram para a batalha
  rationale: διατάσσω, neste uso militar, descreve a disposição das forças em ordem de combate. O médio διετάξαντο é bem representado pela construção reflexiva natural em português.
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: tocaram as trombetas
  rationale: A construção cognata grega descreve o sinal militar dado com trombetas; 'tocaram as trombetas' é claro e corrente em português.
- source_word: Βεθζαχαριά
  choice: Bet-Zacarias
  rationale: Transliteração adaptada à ortografia portuguesa e coerente com a forma do nome próprio Zacarias.
