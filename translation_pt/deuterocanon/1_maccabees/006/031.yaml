  yaml_path: translation/deuterocanon/1_maccabees/006/031.yaml
  text: And they came through Idumea and encamped against Bethsura[a], and they fought for many days, and they made siege engines; but they came out and burned them with fire[b], and fought bravely.
translation:
  language: pt
  text: Eles atravessaram a Idumeia e acamparam contra Betsur. Lutaram durante muitos dias e construíram engenhos de cerco; e os defensores saíram[a], incendiaram-nos e lutaram com bravura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz aqui um verbo no singular, “saiu”, depois de vários verbos no plural. O sentido provavelmente é coletivo e se refere aos defensores de Betsur saindo para atacar.
    reason: textual_variant
  - marker: b
    text: Ou “valentemente”. O advérbio grego significa literalmente “de modo varonil”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς Ἰδουμαίας
  choice: atravessaram a Idumeia
  rationale: διά com genitivo indica movimento através de uma região; “atravessaram” expressa isso de modo natural e conciso.
- source_word: παρενεβάλοσαν ἐπὶ Βεθσουρᾷ
  choice: acamparam contra Betsur
  rationale: O verbo indica estabelecer acampamento, e ἐπί com dativo, neste contexto militar, assinala posicionamento hostil contra a cidade.
- source_word: ἐπολέμησαν ἐπʼ ἡμέρας πολλάς
  choice: lutaram durante muitos dias
  rationale: A construção indica duração; “durante muitos dias” é clara e corrente.
- source_word: μηχανὰς
  choice: engenhos de cerco
  rationale: No contexto, o termo designa equipamentos militares empregados num cerco, não máquinas em sentido genérico.
- source_word: ἔξηλθεν
  choice: os defensores saíram
  rationale: Embora o grego transmitido use um verbo no singular após verbos no plural, o contexto aponta provavelmente para uma saída coletiva dos defensores de Betsur. A explicitação evita atribuir a ação aos sitiantes, mas a irregularidade é preservada em nota.
- source_word: ἐνεπύρισαν αὐτοὺς ἐν πυρί
  choice: incendiaram-nos
  rationale: O pronome retoma naturalmente os engenhos de cerco. “Incendiaram-nos” comunica de forma idiomática a ação expressa pela fórmula grega enfática com “fogo”.
- source_word: ἀνδρωδῶς
  choice: com bravura
  rationale: O advérbio significa literalmente “de modo varonil”, mas aqui elogia a coragem; “com bravura” preserva a força sem linguagem arcaica ou marcada por gênero.
