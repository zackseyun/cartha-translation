  yaml_path: translation/deuterocanon/1_maccabees/006/026.yaml
  text: And behold[a], today they have encamped against the citadel in Jerusalem, to capture it and the sanctuary, and they have fortified Beth-zur.
translation:
  language: pt
  text: E eis que hoje eles estão acampados contra a cidadela[a] em Jerusalém, para tomá-la e também o santuário; e fortificaram Bete-Zur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Acra”, a cidadela fortificada de Jerusalém.'
    reason: Preserva a possibilidade de entender ἄκρα como designação histórica específica, quase um nome próprio, e não apenas como substantivo comum.
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: E eis que
  rationale: Preserva o marcador discursivo que chama a atenção, em linguagem digna e ainda corrente no registro bíblico.
- source_word: παρεμβεβλήκασιν
  choice: estão acampados contra
  rationale: 'O perfeito indica uma ação militar cujo resultado permanece: eles montaram acampamento e continuam posicionados contra o local. A tradução evita ampliar o sentido para um cerco formal.'
- source_word: σήμερον
  choice: hoje
  rationale: Equivalente temporal direto e natural.
- source_word: ἐπὶ τὴν ἄκραν
  choice: contra a cidadela
  rationale: ἄκρα designa uma fortaleza ou cidadela; com ἐπί e acusativo, o contexto militar favorece a ideia de posicionamento hostil contra ela.
- source_word: τοῦ καταλαβέσθαι αὐτὴν
  choice: para tomá-la
  rationale: O infinitivo articular expressa propósito, e καταλαμβάνω indica aqui tomar ou capturar militarmente. O pronome feminino retoma a cidadela.
- source_word: τὸ ἁγίασμα
  choice: o santuário
  rationale: Tradução concisa e estabelecida para o lugar sagrado, sem especificar além do que o grego afirma.
- source_word: τὴν Βεθσούραν
  choice: Bete-Zur
  rationale: Forma portuguesa transparente do topônimo semítico, preferível à forma grega helenizada Betsura.
- source_word: ὠχύρωσαν
  choice: fortificaram
  rationale: Equivalente militar direto do verbo, que significa tornar um lugar fortificado ou defensivamente seguro.
