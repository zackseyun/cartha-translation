lexical_decisions:
- source_word: ἔδειξαν
  choice: mostraram
  rationale: Equivalente direto e natural do aoristo narrativo, mantendo a ação de apresentar algo à vista dos elefantes.
- source_word: τοῖς ἐλέφασιν
  choice: aos elefantes
  rationale: Reproduz naturalmente em português o objeto indireto no dativo plural.
- source_word: αἷμα σταφυλῆς καὶ μόρων
  choice: o sangue de uvas e de amoras
  rationale: Preserva a metáfora vívida do grego, em vez de reduzi-la a “suco”. O singular coletivo σταφυλῆς é vertido naturalmente pelo plural “uvas”, e μόρων designa amoras.
- source_word: τοῦ παραστῆσαι
  choice: para incitá-los
  rationale: A construção com infinitivo articular expressa finalidade; neste contexto militar, indica estimular ou atiçar os elefantes para o combate.
- source_word: εἰς τὸν πόλεμον
  choice: à batalha
  rationale: Expressão idiomática e concisa em português para o direcionamento dos animais ao combate.
