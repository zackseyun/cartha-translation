base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/053.yaml
  text: But there was no food in the holy place[a], because it was the seventh year[b], and those who had escaped into Judea from the nations had eaten up the remnant of the supplies.
translation:
  language: pt
  text: Mas não havia alimento no santuário, porque era o sétimo ano[a], e os que haviam escapado das nações para a Judeia tinham consumido o restante das provisões[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o ano sabático, o sétimo ano, quando não se cultivava a terra; isso ajuda a explicar a falta de alimento.
    reason: cultural_note
  - marker: b
    text: 'Ou: «das reservas armazenadas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώματα
  choice: alimento
  rationale: Termo amplo para aquilo que se come; no singular coletivo, é natural em português e adequado ao contexto de escassez durante o cerco.
- source_word: ἐν τοῖς ἁγίοις
  choice: no santuário
  rationale: Embora a expressão grega seja literalmente plural, «nas coisas/lugares santos», o contexto aponta para o recinto sagrado do templo; «no santuário» comunica isso de modo claro sem especificar uma parte interna.
- source_word: διὰ τὸ ἕβδομον ἔτος εἶναι
  choice: porque era o sétimo ano
  rationale: Mantém a formulação explícita do grego, deixando a identificação com o ano sabático para a nota.
- source_word: οἱ ἀνασωζόμενοι
  choice: os que haviam escapado
  rationale: No contexto, designa pessoas que conseguiram chegar a salvo à Judeia; o mais-que-perfeito composto situa essa fuga antes do esgotamento das provisões.
- source_word: εἰς τὴν Ἰουδαίαν ἀπὸ τῶν ἐθνῶν
  choice: dentre as nações para a Judeia
  rationale: Preserva tanto a origem entre povos não judeus quanto o movimento em direção à Judeia, em ordem natural no português.
- source_word: κατέφαγον
  choice: tinham consumido
  rationale: Expressa o aspecto intensivo de comer completamente e se ajusta melhor a «provisões» do que uma tradução estritamente literal.
- source_word: τὸ ὑπόλιμμα τῆς παραθέσεως
  choice: o restante das provisões
  rationale: ὑπόλιμμα é aquilo que restou, e παράθεσις, neste contexto alimentar, indica provisões postas de lado ou armazenadas; a formulação é clara e não cria um sentido técnico indevido.
theological_decisions:
- issue: Identificação do «sétimo ano»
  choice: Manter «o sétimo ano» no texto e explicar em nota que se trata do ano sabático.
  alternative: Traduzir diretamente «o ano sabático».
  rationale: O referente histórico é o ano sabático, mas o grego conserva a expressão «sétimo ano»; a tradução preserva a forma da fonte sem ocultar sua implicação cultural.
- issue: Sentido de ἐθνῶν
  choice: «nações»
  alternative: «gentios» ou «povos estrangeiros»
  rationale: «Nações» reproduz o idioma judaico-grego e mantém a possível referência tanto aos povos não judeus quanto aos territórios em que viviam, sem impor terminologia teológica posterior.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. «Santuário» é usado para o recinto sagrado sem restringir a referência ao espaço mais interior do templo. Os marcadores de nota aparecem no texto junto aos elementos que explicam.
