  yaml_path: translation/deuterocanon/1_maccabees/006/002.yaml
  text: and that the temple in it was exceedingly rich[a], and that there were gold coverings there, and breastplates and weapons, which Alexander son of Philip, the Macedonian king, who first reigned over the Greeks, had left there.
translation:
  language: pt
  text: e que o templo que nela havia era extremamente rico, e que ali havia coberturas de ouro[a], couraças e armas, deixadas ali por Alexandre, filho de Filipe, o rei macedônio que primeiro reinou sobre os gregos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coberturas douradas”. O grego não especifica a forma exata desses objetos, apenas que eram coberturas feitas de ouro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: templo
  rationale: No contexto, designa o templo ou santuário da cidade; “templo” é claro, natural e adequado ao referente.
- source_word: πλούσιον σφόδρα
  choice: extremamente rico
  rationale: Preserva a forte intensificação de σφόδρα e expressa a grande riqueza do templo em português corrente.
- source_word: καλύμματα χρυσᾶ
  choice: coberturas de ouro
  rationale: καλύμματα é um termo amplo para objetos que cobrem; a tradução evita especificar indevidamente sua forma ou função.
- source_word: θώρακες
  choice: couraças
  rationale: Refere-se especificamente à proteção corporal usada em combate; “couraças” mantém essa precisão.
- source_word: ὅπλα
  choice: armas
  rationale: No elenco de equipamento militar, “armas” é a opção moderna mais clara, sem ampliar o sentido para todo tipo de equipamento.
- source_word: κατέλειπεν
  choice: deixadas ali
  rationale: O particípio português integra com naturalidade a oração relativa grega e mantém a ideia de objetos que Alexandre deixou naquele lugar.
- source_word: Ἀλέξανδρος ὁ τοῦ Φιλίππου
  choice: Alexandre, filho de Filipe
  rationale: Reproduz de modo idiomático o patronímico grego.
- source_word: ὁ βασιλεὺς ὁ Μακεδών
  choice: o rei macedônio
  rationale: Mantém os dois elementos da expressão apositiva e soa natural em português.
- source_word: ὃς ἐβασίλευσεν τοῖς Ἕλλησι πρῶτος
  choice: que primeiro reinou sobre os gregos
  rationale: Preserva o dativo regido por ἐβασίλευσεν e a afirmação histórica de πρῶτος sem explicá-la ou corrigi-la.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação com “e que” conserva a ligação do versículo com o discurso relatado no contexto anterior; a formulação evita precisar além do grego a natureza das coberturas.
