  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda oração explicita «os cavaleiros» para evitar que os particípios gregos sejam entendidos como referentes ao comandante. O ponto e vírgula distingue a ordem de posicionamento das ações executadas pela cavalaria.
