base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/038.yaml
  text: And he stationed the remaining cavalry on both sides[a], at the two flanks of the camp[b], brandishing and fully armed in the phalanxes.
translation:
  language: pt
  text: E ele posicionou a cavalaria restante de um lado e do outro, nos dois flancos do acampamento; os cavaleiros agitavam as armas[a] e cerravam as fileiras nas falanges[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «brandiam»; o particípio grego κατασείοντες indica um movimento ameaçador de agitar ou sacudir, mas não declara o que era agitado.
    reason: lexical_alternative
  - marker: b
    text: Ou «protegiam-se nas falanges» ou «dispunham-se nas linhas de batalha». O sentido de καταφρασσόμενοι neste contexto é incerto e pode indicar que os cavaleiros compactavam, organizavam ou protegiam a formação.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἐπίλοιπον ἵππον
  choice: a cavalaria restante
  rationale: ἵππος pode designar coletivamente a tropa montada em contexto militar; «cavalaria» expressa com naturalidade esse valor coletivo.
- source_word: ἔνθεν καὶ ἔνθεν
  choice: de um lado e do outro
  rationale: A expressão indica disposição nos dois lados, não distribuição aleatória.
- source_word: ἐπὶ τὰ δύο μέρη τῆς παρεμβολῆς
  choice: nos dois flancos do acampamento
  rationale: παρεμβολή significa «acampamento» neste relato militar, e μέρη aponta para seus dois lados; «flancos» comunica a função tática.
- source_word: κατασείοντες
  choice: agitavam as armas
  rationale: O particípio descreve um gesto ameaçador de sacudir ou brandir; o objeto não é expresso no grego, mas «as armas» é suprido pelo contexto militar e torna a ação clara em português.
- source_word: καταφρασσόμενοι
  choice: cerravam as fileiras
  rationale: O verbo é difícil neste contexto; ligado a ἐν ταῖς φάλαγξιν, provavelmente descreve os soldados compactando ou protegendo sua formação. A opção preserva o caráter de ação tática sem convertê-lo simplesmente em estado.
- source_word: ἐν ταῖς φάλαγξιν
  choice: nas falanges
  rationale: Mantém o termo técnico para as formações militares helenísticas, em vez de substituí-lo por uma expressão genérica.
