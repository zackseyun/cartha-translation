  yaml_path: translation/deuterocanon/1_maccabees/006/046.yaml
  text: And he slipped in under the elephant[a], struck it from beneath, and killed it; and it fell to the ground on top of him, and he died there.
translation:
  language: pt
  text: Então ele se meteu debaixo do elefante e o golpeou por baixo[a], matando-o. O elefante caiu por terra em cima dele, e ele morreu ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o feriu por baixo”. A expressão grega é incomum neste contexto e indica um ataque desferido de baixo, sem deixar totalmente claro o movimento exato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσέδυσεν
  choice: se meteu
  rationale: Expressa a entrada deliberada e arriscada num espaço apertado, sob o animal, em linguagem portuguesa natural e vívida.
- source_word: ὑπὸ τὸν ἐλέφαντα
  choice: debaixo do elefante
  rationale: Reproduz de modo claro e concreto a relação espacial indicada pelo grego.
- source_word: ὑπέθηκεν αὐτῷ
  choice: o golpeou por baixo
  rationale: A expressão grega é incomum neste contexto; a tradução conserva a direção do ataque sem especificar uma arma ou um gesto além do que o texto permite.
- source_word: ἀνεῖλεν αὐτόν
  choice: matando-o
  rationale: Comunica diretamente o resultado fatal e liga com naturalidade o golpe à morte do elefante.
- source_word: ἔπεσεν ἐπὶ τὴν γῆν ἐπάνω αὐτοῦ
  choice: O elefante caiu por terra em cima dele
  rationale: Torna explícito o referente do sujeito para evitar confusão em português e preserva tanto a queda ao chão quanto o fato de o animal cair sobre o homem.
- source_word: ἀπέθανεν ἐκεῖ
  choice: ele morreu ali
  rationale: Segue de perto a formulação simples do grego, sem acrescentar ênfase como 'na mesma hora'.
