translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A terminologia militar “falange” foi mantida por sua precisão histórica; o restante da frase usa construções correntes, preservando o aspecto contínuo dos verbos gregos e a ambiguidade entre as tropas se abrirem e serem divididas por ele.
