  text: And he charged boldly into the middle of the phalanx[a], and kept killing right and left, and they were split apart before him on both sides.
translation:
  language: pt
  text: E ele investiu ousadamente no meio da falange e continuou matando à direita e à esquerda; e eles se abriam diante dele para um lado e para o outro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e se separavam diante dele para cá e para lá”. A expressão grega também pode descrever as fileiras abrindo-se ou sendo separadas em direções opostas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέδραμεν
  choice: avançou
  rationale: No contexto militar, o verbo descreve um avanço impetuoso contra o inimigo. “Avançou” é natural em português e, com “com ousadia”, comunica a força do ataque sem acrescentar uma imagem técnica ausente do grego.
- source_word: θράσει
  choice: com ousadia
  rationale: O dativo expressa modo; a locução preserva diretamente a ideia de ação ousada e destemida.
- source_word: εἰς μέσον τῆς φάλαγγος
  choice: para o meio da falange
  rationale: “Falange” conserva a imagem militar específica de uma tropa compacta e organizada, enquanto “para o meio” reproduz de modo claro o movimento indicado por εἰς.
- source_word: ἐθανάτου
  choice: continuou matando
  rationale: O imperfeito apresenta uma ação em curso ou repetida durante o avanço; “continuou matando” torna esse aspecto perceptível em português.
- source_word: δεξιὰ καὶ εὐώνυμα
  choice: à direita e à esquerda
  rationale: É o equivalente idiomático e preciso para a ação exercida nos dois lados.
- source_word: ἐσχίζοντο
  choice: se abriam
  rationale: O imperfeito médio-passivo retrata as fileiras dividindo-se ou abrindo-se à medida que ele avançava. “Se abriam” preserva o movimento sem afirmar indevidamente que eram fisicamente despedaçados.
- source_word: ἀπʼ αὐτοῦ
  choice: diante dele
  rationale: No contexto, indica que as tropas se afastavam da sua frente conforme ele avançava; “diante dele” é uma formulação natural e contextual.
- source_word: ἔνθα καὶ ἔνθα
  choice: para um lado e para o outro
  rationale: A expressão distributiva indica divisão em direções opostas. A tradução mantém a imagem dinâmica e evita reduzir a frase apenas a uma localização estática.
