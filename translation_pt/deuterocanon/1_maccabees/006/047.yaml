translation:
  language: pt
  text: E eles viram a força do reino e o ímpeto das tropas[a] e se afastaram delas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o avanço das forças” ou “a investida das tropas”. O termo grego expressa um movimento vigoroso para a frente em combate.
    reason: lexical_alternative
  - marker: b
    text: O grego diz “deles/delas”, no plural, provavelmente em referência às tropas adversárias, embora também possa resumir o poder régio mencionado antes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχὺν
  choice: força
  rationale: O substantivo indica força ou poder; “força” é claro e preserva tanto a dimensão política quanto a militar no contexto.
- source_word: βασιλείας
  choice: reino
  rationale: βασιλεία pode designar reino, reinado ou poder régio. “Reino” mantém a amplitude do termo e forma uma expressão natural em português.
- source_word: ὁρμήμα
  choice: ímpeto
  rationale: O termo descreve um movimento vigoroso para a frente, especialmente um avanço ou ataque. “Ímpeto” conserva a vivacidade sem especificar além do grego a forma da investida.
- source_word: δυνάμεων
  choice: tropas
  rationale: No contexto militar, δυνάμεις designa forças ou tropas. “Tropas” torna claro o referente humano e permite retomar naturalmente o plural feminino em “delas”.
- source_word: ἐξέκλιναν
  choice: se afastaram
  rationale: ἐκκλίνω significa desviar-se, voltar-se para o lado ou afastar-se. “Se afastaram” permanece próximo do sentido básico sem transformar explicitamente a ação em fuga ou retirada formal.
- source_word: ἀπʼ αὐτῶν
  choice: delas
  rationale: O pronome grego está no plural e aponta mais naturalmente para as tropas mencionadas imediatamente antes. “Delas” preserva o número e não elimina por nota a possível referência mais ampla ao poder adversário.
