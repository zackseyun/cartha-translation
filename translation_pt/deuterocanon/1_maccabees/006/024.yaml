  text: and to follow his commands[a], because those of our people were becoming alienated from us on account of this, except those who were found among us.
translation:
  language: pt
  text: e seguir as suas ordens, porque os do nosso povo, por causa disso, estavam se afastando de nós, exceto os que eram encontrados entre nós[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego é sintaticamente condensado na oração final. A expressão também pode ser entendida como “exceto os que eram encontrados do nosso lado”; o sentido exato da relação ou afiliação permanece incerto.
    reason: alternative_reading
lexical_decisions:
- source_word: κατακολουθεῖν
  choice: seguir
  rationale: Com o dativo τοῖς προστάγμασιν, o infinitivo expressa seguir ou obedecer a determinações; “seguir” é claro e preserva a formulação do grego.
- source_word: προστάγμασιν
  choice: ordens
  rationale: O termo designa determinações dotadas de autoridade. “Ordens” combina naturalmente com o possessivo “suas” e mantém o caráter pessoal da autoridade.
- source_word: οἱ τοῦ λαοῦ ἡμῶν
  choice: os do nosso povo
  rationale: Reproduz a expressão elíptica do grego sem acrescentar “homens” nem generalizá-la simplesmente como “nosso povo”.
- source_word: χάριν τούτου
  choice: por causa disso
  rationale: Expressa de modo natural e direto a relação causal indicada pela locução grega.
- source_word: ἠλλοτριοῦντο
  choice: estavam se afastando
  rationale: O imperfeito indica um processo em curso de distanciamento ou alienação. A formulação é idiomática em português e conserva o sentido social e relacional.
- source_word: ἀφʼ ἡμῶν
  choice: de nós
  rationale: Na primeira ocorrência, ἀπό indica claramente separação; “de nós” é a equivalência direta e natural.
- source_word: πλὴν ὅσοι εὑρίσκοντο ἀφʼ ἡμῶν
  choice: exceto os que eram encontrados entre nós
  rationale: πλήν introduz uma exceção e εὑρίσκοντο significa literalmente “eram encontrados”. Na repetição difícil de ἀφʼ ἡμῶν, “entre nós” conserva a possível ideia de localização ou associação sem resolver além do texto a relação exata.
