  yaml_path: translation/deuterocanon/1_maccabees/006/041.yaml
  text: And all who heard the sound of their multitude, and the marching of the multitude, and the clashing of the weapons, were shaken; for the camp was exceedingly great and strong.
translation:
  language: pt
  text: Todos os que ouviam o ruído daquela multidão, o seu marchar e o choque das armas ficavam abalados, pois o acampamento era imenso e poderoso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσαλεύοντο
  choice: ficavam abalados
  rationale: O imperfeito passivo exprime um efeito contínuo sobre os ouvintes. “Ficavam abalados” preserva a força física e emocional do verbo sem especificar, além do grego, que se tratava necessariamente de terror.
- source_word: φωνῆς πλήθους αὐτῶν
  choice: o ruído daquela multidão
  rationale: Neste contexto militar, φωνή designa o som coletivo produzido pela tropa. “Ruído” é natural em português e mantém a amplitude da expressão.
- source_word: πλήθους
  choice: multidão
  rationale: O termo salienta a grande quantidade de pessoas sem exigir o sentido técnico de “exército”. Na segunda ocorrência, o referente é retomado por “seu” para evitar repetição pesada.
- source_word: ὁδοιπορίας τοῦ πλήθους
  choice: o seu marchar
  rationale: Embora ὁδοιπορία possa indicar viagem ou deslocamento, o cenário de batalha favorece o movimento cadenciado das tropas. “Marchar” comunica esse sentido militar com clareza.
- source_word: συγκρουσμοὺς τῶν ὅπλων
  choice: o choque das armas
  rationale: συγκρουσμός indica colisão ou impacto. “Choque das armas” conserva tanto a ação quanto a imagem sonora, sem limitar ὅπλα a armaduras.
- source_word: παρεμβολὴ
  choice: acampamento
  rationale: O substantivo designa aqui o acampamento militar, e não apenas uma formação abstrata de tropas.
- source_word: μεγάλη σφόδρα καὶ ἰσχυρά
  choice: imenso e poderoso
  rationale: “Imenso” incorpora de modo idiomático a intensificação de μεγάλη por σφόδρα, enquanto “poderoso” expressa a força militar indicada por ἰσχυρά.
