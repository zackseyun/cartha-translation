  yaml_path: translation/deuterocanon/1_maccabees/006/032.yaml
  text: And Judas moved away from the citadel and encamped at Beth-zachariah[a], opposite the king’s camp.
translation:
  language: pt
  text: E Judas partiu da cidadela[a] e acampou em Bet-Zacarias, diante do acampamento do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da Acra”, a cidadela fortificada de Jerusalém.'
    reason: Preserva a possibilidade de entender ἄκρα como o nome tradicional dessa fortificação específica, e não apenas como substantivo comum.
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: Expressa afastamento ou partida de um lugar sem acrescentar a ideia de retirada militar, que o grego não exige.
- source_word: ἄκρας
  choice: cidadela
  rationale: O termo designa uma fortaleza elevada e, neste contexto, a fortificação de Jerusalém conhecida como Acra. O substantivo comum favorece a compreensão, enquanto o nome técnico é preservado em nota.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: Verbo militar que indica estabelecer acampamento; a forma escolhida é natural e clara em português atual.
- source_word: εἰς Βεθζαχαριά
  choice: em Bet-Zacarias
  rationale: Embora εἰς tenha sentido direcional, com o verbo 'acampar' o português expressa naturalmente o local resultante com 'em'.
- source_word: ἀπέναντι
  choice: diante de
  rationale: Indica posição em frente ou defronte de outro acampamento, sem necessariamente implicar distância específica.
- source_word: παρεμβολῆς
  choice: acampamento
  rationale: O substantivo denota um acampamento militar; a escolha mantém a relação lexical com 'acampou' e é corrente em português.
- source_word: τοῦ βασιλέως
  choice: do rei
  rationale: Reproduz de modo idiomático e direto a relação genitiva do texto grego.
