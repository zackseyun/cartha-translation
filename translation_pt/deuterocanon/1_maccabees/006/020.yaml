translation:
  language: pt
  text: no ano cento e cinquenta; e fez contra eles lançadores de projéteis[a] e máquinas de cerco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “engenhos para lançar projéteis”; o termo grego pode designar diferentes dispositivos de arremesso, não necessariamente um único tipo específico de engenho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: no ano cento e cinquenta
  rationale: A fórmula grega de datação no genitivo indica o ano 150; esta forma é clara e idiomática em português.
- source_word: ἐποίησεν
  choice: construiu
  rationale: Embora ποιέω tenha o sentido amplo de “fazer”, no contexto de equipamentos militares “construiu” comunica naturalmente a fabricação dos artefatos.
- source_word: ἐπʼ αὐτούς
  choice: contra eles
  rationale: Neste contexto militar, ἐπί com acusativo expressa oposição ou emprego dirigido contra os sitiados.
- source_word: βελοστασίεις
  choice: lançadores de projéteis
  rationale: O termo designa dispositivos destinados a lançar projéteis, sem exigir a identificação mais específica “catapultas”.
- source_word: μηχανάς
  choice: máquinas de cerco
  rationale: No contexto de guerra e assédio a uma fortificação, μηχαναί se refere a engenhos ou máquinas empregados no cerco.
