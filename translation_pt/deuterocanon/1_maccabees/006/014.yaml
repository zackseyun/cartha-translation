base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/014.yaml
  text: Look[a], I am perishing in great grief in a foreign land. And he called Philip, one of his friends[b], and appointed him over all his kingdom.
translation:
  language: pt
  text: “Eis que estou perecendo em grande tristeza numa terra estrangeira.”[a] Então ele chamou Filipe, um de seus amigos,[b] e o nomeou para ficar à frente de todo o seu reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que estou morrendo em grande pesar numa terra estrangeira”. O grego pode indicar tanto perecer quanto morrer; λύπη também pode expressar tristeza, pesar ou aflição.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “um de seus amigos” talvez designe também um título da corte, isto é, um associado ou cortesão do rei, e não apenas um amigo pessoal.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Eis que
  rationale: Mantém a vivacidade do marcador discursivo grego em linguagem bíblica digna e ainda corrente, introduzindo com ênfase as palavras do rei.
- source_word: ἀπόλλυμαι
  choice: estou perecendo
  rationale: Preserva o sentido amplo de estar sucumbindo ou caminhando para a morte, sem reduzir o verbo apenas a “morrer”.
- source_word: λύπῃ μεγάλῃ
  choice: de profunda tristeza
  rationale: Expressa naturalmente em português tanto a intensidade de λύπη quanto sua possível relação causal com o perecimento; “profunda” evita uma formulação rígida como “grande tristeza”.
- source_word: ἐν γῇ ἀλλοτρίᾳ
  choice: numa terra estrangeira
  rationale: Comunica com clareza que o rei está fora de sua própria terra e conserva o sentimento de afastamento presente no grego.
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: Reproduz o sentido básico do verbo sem acrescentar a formalidade específica de “convocou”.
- source_word: Φίλιππον
  choice: Filipe
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: um de seus amigos
  rationale: Mantém o sentido lexical direto de φίλος, deixando em nota a possível nuance de título ou posição na corte helenística.
- source_word: κατέστησεν
  choice: nomeou
  rationale: No contexto, indica uma designação formal para exercer autoridade; “nomeou” é natural e preciso em português.
- source_word: ἐπὶ πάσης τῆς βασιλείας αὐτοῦ
  choice: para governar todo o seu reino
  rationale: Explicita de modo idiomático a autoridade conferida sobre a totalidade do reino. O verbo “governar” está implícito na construção de nomeação sobre o reino e evita a expressão pouco natural “nomeou sobre”.
