translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” conserva a solenidade e a força de ἰδοὺ sem recorrer a uma formulação excessivamente arcaica. A fala direta foi delimitada por aspas; “Então” marca naturalmente a transição narrativa representada por καί.
