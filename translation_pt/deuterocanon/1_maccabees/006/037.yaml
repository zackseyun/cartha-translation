  yaml_path: translation/deuterocanon/1_maccabees/006/037.yaml
  text: and on them were strong wooden towers[a], covered over, on each beast, fitted on them with engines; and on each one were thirty-two fighting men[b], and its Indian driver.
translation:
  language: pt
  text: Sobre eles havia torres fortes de madeira, cobertas, uma sobre cada animal[a] e equipadas com máquinas de guerra. Em cada um havia trinta e dois combatentes e o seu condutor indiano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz “animal”; pelo contexto, trata-se de um elefante.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o seu indiano”, provavelmente o indiano encarregado de conduzir cada elefante.
    reason: lexical_alternative
lexical_decisions:
- source_word: πύργοι ξύλινοι ὀχυροὶ
  choice: torres fortes de madeira
  rationale: Mantém a imagem direta de estruturas elevadas e resistentes, sem restringir o sentido a uma forma técnica específica de torre.
- source_word: σκεπαζόμενοι
  choice: cobertas
  rationale: Expressa o particípio passivo como estruturas providas de cobertura, sem definir além do grego o formato dessa cobertura.
- source_word: θηρίου
  choice: animal
  rationale: O substantivo grego é genérico, embora o contexto identifique os animais como elefantes; 'animal' preserva essa generalidade em português corrente.
- source_word: ἐζωσμένοι ἐπʼ αὐτοῖς μηχαναῖς
  choice: equipadas com máquinas de guerra
  rationale: Comunica de modo natural a ideia de estarem providas de dispositivos militares; 'de guerra' explicita o valor contextual de μηχαναῖς.
- source_word: ἄνδρες δύο καὶ τριάκοντα οἱ πολεμοῦντες
  choice: trinta e dois combatentes
  rationale: Verte naturalmente o numeral e o particípio substantivado que identifica os homens por sua função de combate.
- source_word: ὁ Ἰνδὸς αὐτοῦ
  choice: o seu condutor indiano
  rationale: O grego diz literalmente 'o seu indiano'; o contexto indica o homem que conduzia cada elefante, e 'condutor' torna clara essa função sem recorrer ao termo especializado 'mahout'.
