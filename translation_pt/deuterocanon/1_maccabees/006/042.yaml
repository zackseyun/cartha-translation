  text: And Judas and his camp advanced into battle formation, and six thousand men from the king’s camp fell.
translation:
  language: pt
  text: Judas e seu acampamento avançaram em formação de batalha, e caíram seis mil homens do acampamento do rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισεν
  choice: avançaram
  rationale: Embora o verbo signifique literalmente “aproximou-se”, no contexto militar, seguido de εἰς παράταξιν, “avançaram” expressa com naturalidade o movimento rumo ao combate. O plural concorda com o sujeito composto em português.
- source_word: παρεμβολὴ
  choice: acampamento
  rationale: O termo designa um acampamento ou arraial militar. “Acampamento” é claro, atual e adequado às duas ocorrências.
- source_word: εἰς παράταξιν
  choice: em formação de batalha
  rationale: A expressão indica disposição organizada para o combate; esta formulação preserva a imagem militar sem reduzir o sentido a um genérico “para a batalha”.
- source_word: ἔπεσαν
  choice: caíram
  rationale: Mantém o idioma marcial do grego, que implica baixas em combate sem explicitar além do texto se todos morreram.
- source_word: ἑξακισχίλιοι ἄνδρες
  choice: seis mil homens
  rationale: Reproduz diretamente a expressão grega. O contexto deixa claro que se trata de combatentes, sem necessidade de substituir “homens” por “soldados”.
