  text: he turned back from Persia and Media[a], and the forces that had gone with the king are with him, and that he is seeking to take over the conduct of affairs;
translation:
  language: pt
  text: voltou da Pérsia e da Média, e as forças que tinham ido com o rei estão com ele[a], e que ele procura assumir a condução dos assuntos;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção grega desta oração é sintaticamente difícil, sobretudo na expressão que reúne “com o rei” e “com ele”. A tradução permanece próxima da redação de Swete/Vaticano, sem eliminar a dificuldade além do que as evidências permitem.
