lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: voltou
  rationale: O aoristo indica que ele retornou dessas regiões; “voltou” é natural e não acrescenta a ideia de retirada militar.
- source_word: ἀπὸ τῆς Περσίδος καὶ Μηδίας
  choice: da Pérsia e da Média
  rationale: Tradução direta da expressão geográfica regida por ἀπό.
- source_word: αἱ δυνάμεις
  choice: as forças
  rationale: No contexto militar, δυνάμεις designa forças armadas; a escolha preserva a amplitude do termo.
- source_word: αἱ πορευθεῖσαι τῷ βασιλεῖ μετʼ αὐτοῦ
  choice: que tinham ido com o rei estão com ele
  rationale: A formulação mantém representados tanto “com o rei” quanto “com ele”, acrescentando apenas a cópula exigida pelo português. A sintaxe grega transmitida permanece difícil e não permite determinar com segurança todas as relações.
- source_word: ζητεῖ
  choice: procura
  rationale: O presente expressa intenção ou esforço em curso; “procura” conserva essa nuance sem afirmar que o objetivo foi alcançado.
- source_word: παραλαβεῖν
  choice: assumir
  rationale: No contexto político, o infinitivo indica tomar para si ou passar a exercer uma responsabilidade.
- source_word: τὰ τῶν πραγμάτων
  choice: a direção dos negócios
  rationale: A expressão idiomática se refere à condução dos assuntos públicos; “negócios” tem aqui o sentido amplo de assuntos, não apenas atividades comerciais.
