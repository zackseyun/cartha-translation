  yaml_path: translation/deuterocanon/1_maccabees/006/060.yaml
  text: And the proposal pleased the king and the rulers[a], and he sent to them to make peace[c][b], and they accepted.
translation:
  language: pt
  text: E a proposta agradou ao rei e aos governantes[a]. Então ele mandou tratar da paz com eles[b], e eles aceitaram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a palavra” ou “a questão agradou ao rei e aos governantes”. O termo grego λόγος pode indicar a proposta apresentada ou o assunto em discussão.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “ele enviou a eles para fazer a paz”. O grego não especifica se ele enviou mensageiros ou uma mensagem.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, aceitaram a proposta ou as condições de paz.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρεσεν
  choice: agradou
  rationale: Expressa de modo natural que a proposta recebeu a aprovação do rei e dos governantes.
- source_word: ὁ λόγος
  choice: a proposta
  rationale: No contexto diplomático, λόγος designa o conteúdo apresentado ou discutido, não apenas uma palavra isolada.
- source_word: ἐναντίον
  choice: ao
  rationale: Com ἤρεσεν, a expressão indica diante de quem a proposta encontrou aprovação; a construção portuguesa 'agradou ao rei' comunica isso naturalmente.
- source_word: ἀρχόντων
  choice: governantes
  rationale: Preserva a ideia ampla de pessoas investidas de autoridade sem especificar cargos não indicados pelo grego.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: ele mandou ... com eles
  rationale: Mantém indeterminado se o rei enviou mensageiros ou uma mensagem, como no original, embora a sintaxe seja ajustada para o português natural.
- source_word: εἰρηνεῦσαι
  choice: tratar da paz
  rationale: Comunica a finalidade diplomática sem afirmar mais especificamente que a paz já foi concluída naquele momento.
- source_word: ἐπεδέξαντο
  choice: eles aceitaram
  rationale: Preserva a concisão do grego e deixa implícito, conforme o contexto, que aceitaram a iniciativa ou as condições de paz.
