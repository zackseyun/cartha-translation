  yaml_path: translation/deuterocanon/1_maccabees/006/021.yaml
  text: And they came out from it[a], from the confinement, and some of the ungodly from Israel joined them.
translation:
  language: pt
  text: E eles saíram dali[a], do confinamento, e alguns dos ímpios de Israel se juntaram a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do cerco” ou “da situação em que estavam encurralados”; o termo grego enfatiza o confinamento ou o fato de estarem cercados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: saíram
  rationale: Traduz diretamente o aoristo de ἐξέρχομαι e expressa com naturalidade o movimento para fora.
- source_word: ἐξ αὐτοῦ
  choice: dali
  rationale: O antecedente do pronome grego está implícito no contexto. “Dali” mantém a referência sem introduzir um lugar específico e evita a forma pouco natural “saíram disso”.
- source_word: συγκλεισμοῦ
  choice: confinamento
  rationale: O substantivo enfatiza a condição de estar fechado ou cercado. “Confinamento” preserva esse núcleo sem especificar no texto principal que se tratava necessariamente de um cerco militar.
- source_word: ἐκολλήθησαν
  choice: se juntaram
  rationale: Neste contexto, o verbo indica adesão ou associação a um grupo; “se juntaram” é corrente e preserva o valor médio-passivo da forma grega.
- source_word: τινες
  choice: alguns
  rationale: Representa o plural indefinido sem acrescentar “homens”, elemento não explícito no grego.
- source_word: ἀσεβῶν
  choice: ímpios
  rationale: “Ímpios” conserva a dimensão religiosa e moral do termo, mais específica do que a ideia genérica de maldade.
- source_word: ἐξ Ἰσραήλ
  choice: de Israel
  rationale: Identifica essas pessoas como provenientes do meio de Israel de forma direta e natural em português.
theological_decisions:
- issue: Caracterização moral e religiosa de ἀσεβῶν
  choice: ímpios
  alternative: perversos; irreligiosos; descrentes
  rationale: “Ímpios” mantém a ideia de irreverência e oposição a Deus, sem reduzir o termo à maldade genérica nem impor uma categoria confessional mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição explicativa “dali, do confinamento” preserva a construção grega com duplo ἐξ, enquanto a nota registra a possível nuance militar sem fixá-la no texto principal.
