  yaml_path: translation/deuterocanon/1_maccabees/006/030.yaml
  text: And the number of his forces was one hundred thousand foot soldiers[a], and twenty thousand horsemen[b], and thirty-two elephants trained for war.
translation:
  language: pt
  text: E o número de suas forças era de cem mil soldados de infantaria, vinte mil cavaleiros[a] e trinta e dois elefantes treinados para a guerra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “vinte mil dos cavalos”; provavelmente “cavalos” é usado por metonímia para tropas montadas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “elefantes que conheciam a guerra”, isto é, treinados ou experientes para o combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμός
  choice: número
  rationale: Equivalente direto e natural no contexto de uma enumeração militar.
- source_word: δυνάμεων
  choice: forças
  rationale: Preserva o sentido coletivo e abrangente de contingentes ou poder militar sem restringi-lo a um único ramo.
- source_word: πεζῶν
  choice: soldados de infantaria
  rationale: Expressa claramente os combatentes a pé em contraste com as tropas montadas, em linguagem moderna e acessível.
- source_word: ἵππων
  choice: cavaleiros
  rationale: Embora o termo signifique literalmente “cavalos”, nesta enumeração militar provavelmente funciona por metonímia para tropas montadas; a nota preserva a forma literal.
- source_word: ἐλέφαντες
  choice: elefantes
  rationale: Equivalente lexical direto.
- source_word: εἰδότες πόλεμον
  choice: treinados para a guerra
  rationale: A expressão significa literalmente “que conheciam a guerra”; aplicada aos elefantes, indica animais treinados ou experientes para o combate.
