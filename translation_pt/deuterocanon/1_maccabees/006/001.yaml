  source_fidelity: A tradução preserva adequadamente o imperfeito de διεπορεύετο, a localização em Elimaida/Pérsia e a enumeração de riqueza, prata e ouro. Contudo, «quando ouviu dizer» converte a coordenação grega («e ouviu») numa relação temporal mais explícita do que o original requer. A pontuação final deve também manter a continuação sintática do versículo seguinte, como indica o ponto e vírgula grego/editorial.
