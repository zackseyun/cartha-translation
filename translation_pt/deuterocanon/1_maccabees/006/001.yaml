  yaml_path: translation/deuterocanon/1_maccabees/006/001.yaml
  text: And King Antiochus was traveling through the upper regions[a], and he heard that in Elymais, in Persia, there was a city renowned for wealth, silver, and gold;
translation:
  language: pt
  text: O rei Antíoco percorria as regiões superiores e ouviu que, em Elimaida, na Pérsia[a], havia uma cidade célebre por sua riqueza, prata e ouro;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na Pérside”, isto é, na região ou província persa. O termo grego pode ter sentido geográfico mais específico do que “Pérsia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: percorria
  rationale: O imperfeito grego apresenta uma ação em andamento; “percorria” preserva esse aspecto durativo e a ideia de deslocamento através de uma região.
- source_word: τὰς ἐπάνω χώρας
  choice: as regiões do alto
  rationale: Mantém a referência espacial de ἐπάνω sem decidir se se trata especificamente de terras interiores, orientais ou montanhosas.
- source_word: Ἐλυμαΐς
  choice: Elimaida
  rationale: Emprega a forma portuguesa tradicional e reconhecível do topônimo grego.
- source_word: ἐν τῇ Περσίδι
  choice: na Pérsia
  rationale: É a forma mais clara para leitores modernos; a nota registra a possibilidade geográfica mais específica, “Pérside”.
- source_word: πόλις ἔνδοξος
  choice: uma cidade célebre
  rationale: ἔνδοξος indica fama ou notoriedade; “célebre” evita atribuir glória moral à cidade.
- source_word: πλούτῳ, ἀργυρίῳ, καὶ χρυσίῳ
  choice: por suas riquezas, sua prata e seu ouro
  rationale: A preposição “por” expressa naturalmente o aspecto em que a cidade era célebre, e a repetição de “sua” torna clara a enumeração cumulativa.
