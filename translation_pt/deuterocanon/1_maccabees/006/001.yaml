  terminology: «Antíoco», «Elimaida», «Pérsia» e «Pérside» são formas adequadas. «Cidade célebre» traduz naturalmente πόλις ἔνδοξος. A nota mantém de modo apropriado a alternativa regional mais específica para Περσίς.
