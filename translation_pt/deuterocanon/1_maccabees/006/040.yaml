base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/040.yaml
  text: And part of the king’s camp spread out over the high mountains[a], and some over the lowlands; and they advanced securely and in formation.
translation:
  language: pt
  text: Uma parte do exército do rei foi posicionada pelas montanhas altas, e outros pelo terreno baixo[a]; as tropas avançavam com segurança e em formação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelos lugares mais baixos”. O grego contrasta as montanhas altas com o terreno mais baixo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάθη
  choice: se estendeu
  rationale: O aoristo passivo descreve a extensão ou o posicionamento das forças pelo terreno; a formulação preserva a imagem espacial do grego.
- source_word: μέρος τι
  choice: uma parte
  rationale: Expressa uma porção indefinida do contingente sem acrescentar precisão ausente no original.
- source_word: παρεμβολῆς
  choice: exército
  rationale: Neste contexto militar, o termo designa o contingente acampado, não apenas o local físico do acampamento; “exército” torna clara a referência às forças em movimento.
- source_word: ἐπὶ τὰ ὑψηλὰ ὄρη
  choice: pelas montanhas altas
  rationale: ἐπί com acusativo indica extensão pelo terreno, e “montanhas altas” conserva diretamente o contraste topográfico do grego.
- source_word: τινες ἐπὶ τὰ ταπεινά
  choice: alguns pelas regiões baixas
  rationale: O adjetivo substantivado τὰ ταπεινά indica terrenos ou lugares mais baixos; “regiões baixas” mantém o contraste com as montanhas, enquanto “alguns” preserva a elipse grega referente aos soldados.
- source_word: ἤρχοντο
  choice: avançavam
  rationale: O imperfeito retrata o movimento contínuo das tropas; no contexto, “avançavam” comunica melhor a progressão militar do que o genérico “vinham”.
- source_word: ἀσφαλῶς
  choice: com segurança
  rationale: Mantém o sentido de movimento seguro, sem impedimento ou vulnerabilidade evidente, sem transformar a expressão em mera confiança subjetiva.
- source_word: τεταγμένως
  choice: em formação
  rationale: O advérbio deriva da ideia de ordenação e, em contexto militar, indica deslocamento disciplinado em disposição organizada.
