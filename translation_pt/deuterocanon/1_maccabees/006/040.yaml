  naturalness: «Uma parte do exército do rei se estendeu» é compreensível, mas «foi posicionada» é mais natural em português militar e evita sugerir que o próprio exército se alongou fisicamente. «Outros» é mais natural do que «alguns» no segundo membro, pois retoma os integrantes restantes da mesma força.
  terminology: «Exército do rei» é uma contextualização aceitável de παρεμβολή neste enunciado militar. «Montanhas altas», «terreno baixo», «avançavam» e «em formação» correspondem adequadamente aos termos gregos e mantêm registro claro.
