base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/017.yaml
  text: And Lysias learned that the king had died[a], and he installed Antiochus his son to reign in his place, whom he had reared from youth, and
translation:
  language: pt
  text: Lísias soube que o rei havia morrido e estabeleceu Antíoco, filho do rei, como rei em seu lugar, a quem havia criado quando ele era jovem, e[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego deste versículo termina com “e”, indicando que a frase continua no versículo seguinte.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπέγνω
  choice: soube
  rationale: No contexto narrativo, o aoristo indica que Lísias tomou conhecimento da morte; “soube” é direto e natural em português.
- source_word: τέθνηκεν
  choice: havia morrido
  rationale: O perfeito expressa uma morte já ocorrida, com estado resultante; o mais-que-perfeito composto também situa naturalmente o fato antes da ação narrativa seguinte.
- source_word: κατέστησεν βασιλεύειν
  choice: estabeleceu como rei
  rationale: A construção indica que Lísias colocou Antíoco na função régia. A formulação é clara e digna, sem a rigidez de “constituiu para reinar”.
- source_word: ἀντʼ αὐτοῦ
  choice: em seu lugar
  rationale: Expressa a substituição do rei falecido por seu sucessor e mantém a referência pronominal do grego.
- source_word: ἐξέθρεψεν
  choice: havia criado
  rationale: O verbo denota sustentar e criar alguém durante a juventude; “criado” comunica naturalmente a responsabilidade de Lísias pela formação do jovem.
- source_word: νεώτερον
  choice: desde jovem
  rationale: A expressão preserva de modo conciso a referência ao período juvenil sem especificar uma idade que o grego não determina.
