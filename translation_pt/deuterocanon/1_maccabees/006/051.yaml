base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/051.yaml
  text: And he encamped against the sanctuary for many days[a], and there he set up missile-launchers and engines and fire-throwers and stone-throwers and scorpions, to shoot arrows and slingstones.
translation:
  language: pt
  text: E acampou contra o santuário durante muitos dias e instalou ali lançadores de projéteis, máquinas de guerra, lançadores de fogo, lançadores de pedras e escorpiões[a], para disparar flechas e pedras de funda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pequenos lançadores de projéteis chamados escorpiões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: acampou
  rationale: O verbo indica primariamente montar acampamento. O contexto envolve um cerco, mas a tradução preserva a ação expressa no grego sem substituí-la por um verbo mais específico.
- source_word: ἐπὶ τὸ ἁγίασμα
  choice: contra o santuário
  rationale: Com o verbo militar e o acusativo, a expressão comunica posicionamento hostil dirigido ao recinto sagrado.
- source_word: ἡμέρας πολλάς
  choice: durante muitos dias
  rationale: Reproduz naturalmente em português o acusativo de duração.
- source_word: ἔστησεν
  choice: instalou
  rationale: Expressa de modo claro o ato de colocar e preparar o equipamento militar para uso.
- source_word: βελοστασίσεις
  choice: lançadores de projéteis
  rationale: O termo designa dispositivos para lançar βέλη. A formulação abrangente evita restringi-los indevidamente a flechas.
- source_word: μηχανὰς
  choice: máquinas de guerra
  rationale: O substantivo é geral, mas o contexto militar recomenda explicitar a função, evitando o sentido moderno e genérico de simples máquinas.
- source_word: πυροβόλα
  choice: lançadores de fogo
  rationale: Traduz de modo transparente o composto que designa aparelhos capazes de lançar fogo, sem importar tecnologia posterior.
- source_word: λιθοβόλα
  choice: lançadores de pedras
  rationale: Mantém o sentido concreto do composto sem identificar de maneira excessivamente específica o tipo de máquina.
- source_word: σκορπίδια
  choice: escorpiões
  rationale: Preserva o nome histórico de uma pequena arma lançadora de projéteis; a nota esclarece o sentido militar para leitores modernos.
- source_word: εἰς τὸ βάλλεσθαι
  choice: para disparar
  rationale: A construção infinitiva expressa finalidade; 'para disparar' é natural com os projéteis mencionados.
- source_word: βέλη
  choice: flechas
  rationale: Embora o termo possa significar projéteis em geral, aqui a enumeração ao lado de pedras de funda favorece a referência específica a flechas.
- source_word: σφενδόνας
  choice: pedras de funda
  rationale: No contexto do que seria disparado, a expressão se refere melhor aos projéteis de funda do que às próprias fundas.
