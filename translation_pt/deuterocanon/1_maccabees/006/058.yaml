  text: Now then[a], let us give our right hand to these men, and let us make peace with them and with their whole nation;
translation:
  language: pt
  text: Agora, pois, demos a mão direita[a] a estes homens e façamos paz com eles e com toda a sua nação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: «dar a mão direita», expressão que indica oferecer um compromisso de paz ou aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, pois
  rationale: Preserva tanto a ideia de momento presente em νῦν quanto a transição inferencial de οὖν, em português natural e digno.
- source_word: δῶμεν δεξιὰν
  choice: estendamos a mão direita
  rationale: Mantém a imagem concreta do gesto idiomático de compromisso, paz ou aliança, usando uma formulação mais natural em português do que a reprodução estrita «demos a mão direita».
- source_word: τοῖς ἀνθρώποις τούτοις
  choice: a estes homens
  rationale: No contexto político-militar, refere-se ao grupo masculino específico em negociação; «homens» é preciso e natural.
- source_word: ποιήσωμεν ... εἰρήνην
  choice: façamos paz
  rationale: Reproduz diretamente a construção grega e é uma expressão corrente em português para estabelecer relações pacíficas.
- source_word: μετʼ αὐτῶν
  choice: com eles
  rationale: Representa de modo direto as partes com quem se propõe fazer paz.
- source_word: μετὰ παντὸς ἔθνους αὐτῶν
  choice: com toda a sua nação
  rationale: ἔθνος designa aqui o povo ou nação a que eles pertencem, e παντός ressalta sua totalidade.
