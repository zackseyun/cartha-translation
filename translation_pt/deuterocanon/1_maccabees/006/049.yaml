base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/049.yaml
  text: And he came to terms with those in Bethsura and went out from the city[a], because they had no provisions there to remain shut up in it, because it was a sabbath year for the land.
translation:
  language: pt
  text: Ele fez um acordo com os de Betsur e saiu da cidade, pois eles não tinham ali provisões para permanecerem confinados nela, porque era ano sabático para a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “era sábado para a terra”, referência ao ano sabático, em que a terra ficava sem cultivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν μετὰ τῶν ἐκ Βεθσούρων
  choice: fez um acordo com os habitantes de Betsur
  rationale: A expressão idiomática indica chegar a um acordo ou estabelecer termos. “Habitantes de Betsur” expressa naturalmente οἱ ἐκ Βεθσούρων no contexto do cerco.
- source_word: ἐξῆλθε ἐκ τῆς πόλεως
  choice: saiu da cidade
  rationale: Mantém o verbo grego no singular e descreve o movimento sem acrescentar rendição ou evacuação, ideias que o texto não explicita.
- source_word: διατροφή
  choice: provisões
  rationale: No contexto de um cerco, o termo designa os meios necessários à subsistência, sobretudo mantimentos armazenados.
- source_word: τοῦ συνκλεισθαι ἐν αὐτῇ
  choice: para permanecerem confinados nela
  rationale: Comunica o estado continuado de estarem encerrados dentro da cidade durante o cerco.
- source_word: σάββατον ἦν τῇ γῇ
  choice: era ano sabático para a terra
  rationale: A formulação torna claro ao leitor moderno que se trata do descanso agrícola periódico da terra, e não do sábado semanal.
theological_decisions:
- issue: Sentido de σάββατον ἦν τῇ γῇ
  choice: era ano sabático para a terra
  alternative: era sábado para a terra
  rationale: O contexto histórico e agrícola aponta para o ano em que a terra ficava em repouso. A tradução explicita o referente provável, enquanto a nota preserva a forma literal.
- issue: Sujeito singular de ἐξῆλθε
  choice: saiu da cidade
  alternative: saíram da cidade
  rationale: A forma verbal da edição grega fornecida está no singular. A tradução não a altera para o plural, embora o contexto possa suscitar dificuldade quanto ao referente do sujeito.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário acessível. “Betsur” segue uma transliteração simples do topônimo; “ano sabático” evita confusão com o sábado semanal. O marcador foi colocado junto à expressão que a nota explica.
