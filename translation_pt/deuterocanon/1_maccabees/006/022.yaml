translation:
  language: pt
  text: 'Eles foram ao rei e disseram: “Até quando não agirás[b]…?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego disponível para este versículo está incompleto e termina depois de “Até quando não agirás…?”. As reticências indicam a interrupção do texto-fonte, não uma paráfrase deliberada.
    reason: textual_variant
  - marker: b
    text: Ou, mais literalmente, “Até quando não farás…?”. O verbo grego ποιήσεις tem o sentido amplo de “fazer”; “agir” foi usado para tornar mais clara em português uma oração que ficou incompleta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: foram
  rationale: O aoristo de πορεύομαι indica aqui deslocamento simples; “foram” é a forma mais natural e fiel no contexto narrativo.
- source_word: πρὸς τὸν βασιλέα
  choice: ao rei
  rationale: πρός com acusativo expressa movimento em direção a uma pessoa, neste caso para comparecer diante dela; “ao rei” comunica isso de modo idiomático.
- source_word: Ἕως πότε
  choice: Até quando
  rationale: A expressão introduz uma pergunta de protesto diante de uma demora. “Até quando” é o equivalente corrente em português e preserva o tom urgente.
- source_word: οὐ ποιήσεις
  choice: você não vai agir
  rationale: ποιέω pode significar amplamente “fazer” ou “agir”. Como o trecho termina sem objeto ou complemento, “agir” transmite a exigência de uma intervenção sem inventar o que deveria ser feito; “vai agir” mantém o valor futuro em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome “você” torna explícito o sujeito singular já indicado pela forma verbal grega, sem acrescentar título honorífico ausente do texto. As reticências preservam a truncação do testemunho fornecido.
