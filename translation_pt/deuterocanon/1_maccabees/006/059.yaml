  text: and let us establish for them to walk according to their own laws[a], as before; for it was because of their laws, which we set aside[b], that they became angry and did all these things.
translation:
  language: pt
  text: E estabeleçamos que lhes seja permitido viver segundo suas próprias leis[a], como antes; pois foi por causa das leis deles que desmantelamos[b] que ficaram irados e fizeram todas essas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vivam de acordo com suas próprias leis/costumes”. O grego diz literalmente “andar segundo suas leis”, expressão que significa conduzir a vida de acordo com elas.'
    reason: lexical_alternative
  - marker: b
    text: O verbo grego significa mais literalmente “espalhar” ou “dispersar”; aqui se refere a desarticular ou suprimir suas leis e práticas.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσωμεν
  choice: permitamos
  rationale: No contexto de uma proposta para restaurar direitos, o hortativo exprime o estabelecimento formal de uma permissão. “Permitamos” produz português natural sem perder a força normativa da decisão.
- source_word: τοῦ πορεύεσθαι
  choice: que eles vivam segundo
  rationale: Embora πορεύεσθαι signifique literalmente “ir/andar”, com leis ou costumes indica conduzir a vida de acordo com eles.
- source_word: τοῖς νομίμοις αὐτῶν
  choice: suas próprias leis
  rationale: νομίμοις abrange leis, costumes e práticas estabelecidas. “Leis” é claro no contexto político-religioso, enquanto “próprias” ressalta αὐτῶν.
- source_word: ὡς τὸ πρότερον
  choice: como antes
  rationale: Reproduz de modo direto e natural a comparação temporal.
- source_word: χάριν
  choice: por causa de
  rationale: A construção tem valor causal neste contexto.
- source_word: διεσκεδάσαμεν
  choice: desmantelamos
  rationale: O verbo significa literalmente espalhar ou dispersar; aplicado às leis e práticas, indica que elas foram desarticuladas ou suprimidas. “Desmantelamos” preserva essa imagem melhor que “abolimos”.
- source_word: ὠργίσθησαν
  choice: se enfureceram
  rationale: Expressa o ingresso no estado de ira indicado pelo aoristo, com intensidade adequada ao contexto de revolta.
- source_word: ἐποίησαν ταῦτα πάντα
  choice: fizeram todas essas coisas
  rationale: Mantém a formulação ampla e inclusiva do grego.
