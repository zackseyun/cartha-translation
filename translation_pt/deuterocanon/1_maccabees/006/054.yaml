base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/054.yaml
  text: And a few men were left in the sanctuary[a], because the famine had overpowered them; and they were scattered, each to his own place.
translation:
  language: pt
  text: E restaram poucos homens no santuário[a], porque a fome os havia dominado; e eles se dispersaram, cada um para o seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no lugar santo” ou “nos recintos sagrados”. O grego diz literalmente “nos [lugares/coisas] santos”, expressão ligada ao templo que aqui se refere à área sagrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθησαν
  choice: restaram
  rationale: O passivo de ὑπολείπω indica que apenas um pequeno remanescente ficou depois da saída dos demais. “Restaram” preserva esse sentido de redução e soa natural em português.
- source_word: ἐν τοῖς ἁγίοις
  choice: no santuário
  rationale: A expressão plural substantivada designa, neste contexto militar e cultual, a área sagrada do templo. “No santuário” comunica com clareza essa referência espacial sem sugerir objetos santos.
- source_word: ἄνδρες ὀλίγοι
  choice: poucos homens
  rationale: ἄνδρες tem referência masculina específica, e ὀλίγοι indica um número reduzido. A formulação portuguesa é direta e fiel.
- source_word: κατεκράτησεν αὐτῶν ὁ λιμός
  choice: a fome os havia dominado
  rationale: κατακρατέω expressa alcançar domínio ou prevalecer sobre alguém. “Havia dominado” conserva a força da personificação e explicita a anterioridade contextual.
- source_word: ἐσκορπίσθησαν
  choice: eles se dispersaram
  rationale: Embora a forma grega seja passiva, o passivo pode descrever o resultado de ficarem espalhados. “Se dispersaram” é idiomático em português e preserva a imagem sem introduzir um agente não mencionado.
- source_word: ἕκαστος εἰς τὸν τόπον αὐτοῦ
  choice: cada um para o seu lugar
  rationale: τόπος significa amplamente “lugar”. Evita-se “casa”, que especificaria além do texto, mantendo a ambiguidade do destino.
theological_decisions:
- issue: Sentido da expressão cultual ἐν τοῖς ἁγίοις
  choice: no santuário
  alternative: no lugar santo; nos recintos sagrados
  rationale: A expressão é espacial e ligada ao templo. “No santuário” é a forma portuguesa mais clara e corrente, enquanto a nota preserva a amplitude do plural grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se a estrutura coordenada do grego e a ambiguidade de “seu lugar”, evitando identificar o destino especificamente como a casa de cada homem.
