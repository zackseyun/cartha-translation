  yaml_path: translation/deuterocanon/1_maccabees/006/011.yaml
  text: And I said in my heart, ‘Into what distress I have come, and into a great סער? now I am in it—though I was kind and beloved.’
translation:
  language: pt
  text: 'E eu disse no meu coração: “A que aflição e a que grande tempestade cheguei, na qual agora estou! Pois eu era bondoso e amado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ
  choice: disse no meu coração
  rationale: Preserva a expressão interior do grego de modo natural e reconhecível em português.
- source_word: Ἕως τίνος θλίψεως ἦλθον
  choice: A que ponto de aflição cheguei
  rationale: Entende ἕως τίνος como indicação exclamativa do grau ou extremo alcançado, sem reduzir θλίψις a uma emoção específica.
- source_word: κλύδωνος μεγάλου
  choice: grande tempestade
  rationale: κλύδων designa agitação violenta das águas ou tormenta; “tempestade” mantém a imagem metafórica com clareza corrente.
- source_word: χρηστὸς
  choice: bondoso
  rationale: Expressa o sentido moral e relacional de χρηστός sem lhe acrescentar uma qualificação não presente no texto.
- source_word: ἀγαπώμενος
  choice: amado
  rationale: Mantém a forma passiva do particípio e sua afirmação direta.
theological_decisions:
- issue: Relação introduzida por ὅτι
  choice: Pois eu era bondoso e amado
  alternative: Embora eu fosse bondoso e amado
  rationale: O grego traz ὅτι, normalmente causal ou explicativo. A tradução preserva essa ligação, apesar da tensão aparente, em vez de introduzir a concessão “embora”, que não está explicitamente marcada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe exclamativa natural. A repetição de “a que” explicita a coordenação grega e evita que “aflição” e “tempestade” pareçam uma única expressão composta.
