base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/006/043.yaml
  text: And Eleazar the Avaran saw one of the beasts armored with royal breastplates[a], and it towered above all the beasts[b], and it appeared that the king was on it.
translation:
  language: pt
  text: Eleazar, o Avarã, viu um dos animais[a], protegido por couraças reais, que sobressaía a todos os outros animais; e parecia que o rei estava sobre ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, os “animais” são elefantes de guerra.
    reason: cultural_note
  - marker: b
    text: 'Ou: “dava a impressão de que o rei estava sobre ele”. O grego indica aparência, não certeza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεάζαρ ὁ Σαυαρὰν
  choice: Eleazar, o Avarã
  rationale: Mantém a designação própria transliterada e sua função de epíteto, usando uma forma natural em português.
- source_word: ἐν τῶν θηρίων
  choice: um dos animais
  rationale: θηρίον significa literalmente “animal” ou “fera”. O contexto identifica esses animais como elefantes de guerra, mas o texto deste versículo emprega o termo genérico.
- source_word: τεθωρακισμένον θώραξιν βασιλικοῖς
  choice: protegido por couraças reais
  rationale: Reproduz a linguagem de armadura formada pelo verbo θωρακίζω e pelo substantivo cognato θώραξ, sem criar uma repetição pouco natural em português.
- source_word: ὑπεράγον πάντα τὰ θηρία
  choice: sobressaía a todos os outros animais
  rationale: Expressa a proeminência do animal em relação aos demais sem restringi-la com certeza apenas à altura ou ao tamanho.
- source_word: ὤφθη ὅτι ἐν αὐτῷ ἐστιν ὁ βασιλεύς
  choice: parecia que o rei estava sobre ele
  rationale: Preserva a formulação de aparência, sem transformar a presença do rei em fato certo. “Sobre ele” é idiomático para alguém transportado por um elefante e corresponde ao valor contextual de ἐν αὐτῷ.
