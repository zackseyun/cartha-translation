base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/037.yaml
  text: And the king took half of the forces that had been left behind and departed from Antioch[a], the city of his kingdom, in the one hundred forty-seventh year[c][b]; and he crossed the Euphrates River and traveled through the upper regions.
translation:
  language: pt
  text: E o rei levou consigo metade das forças que haviam sido deixadas para trás e partiu de Antioquia, a cidade de seu reino,[a] no ano cento e quarenta e sete.[b] Depois, atravessou o rio Eufrates e percorreu as regiões do interior.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Antioquia, a cidade real de seu reino». A expressão grega pode identificar Antioquia como a cidade real ou capital do rei.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o ano cento e quarenta e sete da era selêucida.
    reason: cultural_note
  - marker: c
    text: 'Ou: «as regiões superiores» ou «as províncias superiores». A expressão provavelmente se refere aos territórios a leste do Eufrates.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: levou consigo
  rationale: No contexto militar, indica que o rei tomou consigo ou pôs sob seu comando parte das forças; «levou consigo» explicita naturalmente esse sentido em português.
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: metade das forças
  rationale: Expressa de modo natural a porção militar indicada pelo grego, sem restringir δυνάμεις a uma unidade específica.
- source_word: τὰς καταλειφθείσας
  choice: que haviam sido deixadas para trás
  rationale: O particípio remete a uma ação anterior e modifica as forças; o mais-que-perfeito composto preserva essa relação temporal.
- source_word: ἀπῆρεν
  choice: partiu
  rationale: Verbo corrente e digno para o início de uma viagem ou campanha.
- source_word: ἀπὸ πόλεως βασιλείας αὐτοῦ
  choice: a cidade de seu reino
  rationale: Tratado como aposição a Antioquia, preservando a formulação pouco comum do grego sem impor explicitamente «capital» ou «cidade real».
- source_word: ἔτους ἑβδόμου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ
  choice: no ano cento e quarenta e sete
  rationale: Forma portuguesa natural para o numeral ordinal cronológico grego.
- source_word: διεπέρασεν
  choice: atravessou
  rationale: Equivalente direto e idiomático para cruzar um rio.
- source_word: τὸν Εὐφράτην ποταμόν
  choice: o rio Eufrates
  rationale: Ordem nominal natural em português, preservando o topônimo e a identificação geográfica.
- source_word: διεπορεύετο
  choice: percorreu
  rationale: Comunica deslocamento continuado através de um território; o aspecto imperfeito é entendido narrativamente como progresso da viagem.
- source_word: τὰς ἐπάνω χώρας
  choice: as regiões do interior
  rationale: No contexto após a travessia do Eufrates, a expressão provavelmente designa territórios interiores ou orientais; a nota conserva as alternativas mais literais e administrativas.
