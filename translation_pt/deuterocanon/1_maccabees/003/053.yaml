lexical_decisions:
- source_word: πῶς
  choice: Como
  rationale: Introduz naturalmente a pergunta retórica sobre possibilidade ou capacidade.
- source_word: δυνησόμεθα
  choice: poderemos
  rationale: Preserva o valor futuro de δύναμαι e expressa capacidade em português corrente.
- source_word: ὑποστῆναι
  choice: resistir
  rationale: No contexto de confronto militar, comunica a ideia de manter-se firme diante do adversário sem recorrer a uma formulação pouco natural.
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: diante deles
  rationale: Preserva a imagem de estar em face dos adversários; a nota registra o possível sentido mais diretamente hostil.
- source_word: ἐὰν μὴ
  choice: se ... não
  rationale: Equivale naturalmente à condição negativa grega; nesta oração, soa mais direto do que «a menos que».
- source_word: σὺ
  choice: tu
  rationale: Mantém o pronome explícito e enfático do grego, adequado à linguagem direta de oração.
- source_word: βοηθήσῃς
  choice: ajudares
  rationale: Traduz de modo claro e direto o pedido de auxílio expresso por βοηθέω.
- source_word: ἡμῖν
  choice: nos
  rationale: Representa naturalmente em português o objeto dativo de βοηθέω.
theological_decisions:
- issue: Apelo a Deus em contexto militar
  choice: Manter o apelo direto na segunda pessoa sem acrescentar promessa de vitória
  alternative: Como poderemos enfrentá-los, se não vieres em nosso auxílio?
  rationale: O texto reconhece dependência da ajuda divina, mas não declara explicitamente que essa ajuda garantirá vitória; a tradução conserva esse limite e a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Tu» conserva a ênfase do pronome grego e o tom de oração; a construção verbal permanece natural no registro bíblico contemporâneo.
