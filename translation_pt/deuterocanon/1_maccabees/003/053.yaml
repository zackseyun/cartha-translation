  text: How will we be able to stand before them[a], unless you help us?
translation:
  language: pt
  text: Como poderemos fazer frente a eles[a], se tu não nos ajudares?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «resistir-lhes» ou «manter-nos firmes diante deles»; a expressão grega descreve estar diante de adversários em confronto.
