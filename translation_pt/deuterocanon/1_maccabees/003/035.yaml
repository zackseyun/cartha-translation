  text: to send a force against them[a], to crush and remove the strength of Israel and the remnant of Jerusalem, and to take away its memory from the place,
translation:
  language: pt
  text: enviar contra eles uma força, para esmagar e remover a força de Israel e o remanescente de Jerusalém, e apagar daquele lugar a sua memória[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “remover daquele lugar o seu memorial” ou “apagar dali a sua lembrança”.
    reason: Alternativas lexicais para μνημόσυνον e para a expressão completa ἆραι τὸ μνημόσυνον αὐτοῦ ἀπὸ τοῦ τόπου.
lexical_decisions:
- source_word: ἀποστεῖλαι
  choice: enviar
  rationale: O infinitivo aoristo expressa o conteúdo ou propósito da decisão anterior; “enviar” é direto e natural.
- source_word: δύναμιν
  choice: uma força
  rationale: No contexto militar, designa uma força armada. A expressão evita especificar indevidamente seu tamanho como se fosse necessariamente um exército completo.
- source_word: τοῦ ἐκρίψαι
  choice: para esmagar
  rationale: O infinitivo articulado indica propósito e, no contexto, comunica derrubada violenta. “Esmagar” mantém a força da ação sem fundi-la com o verbo seguinte.
- source_word: ἐξᾶραι
  choice: eliminar
  rationale: Expressa a remoção da força de Israel e do remanescente após a investida. “Eliminar” é corrente e adequado ao propósito hostil descrito.
- source_word: τὴν ἰσχὺν Ἰσραήλ
  choice: a força de Israel
  rationale: Reproduz com clareza o sentido de ἰσχύς e preserva a construção genitiva.
- source_word: τὸ κατάλιμμα Ἰερουσαλήμ
  choice: o remanescente de Jerusalém
  rationale: Mantém o sentido amplo daquilo que restou, sem restringir a referência apenas aos sobreviventes humanos.
- source_word: ἆραι τὸ μνημόσυνον αὐτοῦ
  choice: tirar [...] a sua lembrança
  rationale: μνημόσυνον pode indicar lembrança, memória ou memorial. “Lembrança” comunica o propósito de apagar a recordação, enquanto “sua” preserva a relativa abertura do referente de αὐτοῦ.
- source_word: ἀπὸ τοῦ τόπου
  choice: daquele lugar
  rationale: Expressa de modo natural em português a remoção a partir do lugar em questão, cujo referente vem do contexto.
theological_decisions:
- issue: Alcance de “o remanescente de Jerusalém”
  choice: Expressão coletiva ampla, sem limitá-la apenas a pessoas sobreviventes.
  alternative: “os sobreviventes de Jerusalém” ou “o que restava de Jerusalém”
  rationale: κατάλιμμα pode abranger de modo geral aquilo que permaneceu. A formulação escolhida conserva essa amplitude e não impõe uma identificação mais estreita que o grego.
- issue: Referente de αὐτοῦ em “sua lembrança”
  choice: Manter o possessivo sem explicitar um referente único.
  alternative: “a lembrança de Israel”, “a lembrança de Jerusalém” ou “a lembrança deles”
  rationale: O pronome grego singular admite relação com o referente coletivo anteriormente mencionado. O possessivo português conserva a ambiguidade genuína em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura de propósito e a sequência militar do grego foram preservadas; o possessivo “sua” mantém a ambiguidade do antecedente.
