  text: And Judas[a], who was called Maccabeus, his son, rose up in his place.
translation:
  language: pt
  text: E Judas, seu filho, chamado Macabeu[a], levantou-se em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grego Μακκαβαῖος (Makkabaíos), tradicionalmente vertido em português como “Macabeu”.
