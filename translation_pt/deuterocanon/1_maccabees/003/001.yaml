lexical_decisions:
- source_word: ἀνέστη
  choice: levantou-se
  rationale: O aoristo de ἀνίστημι descreve Judas surgindo para agir após o pai. “Levantou-se” preserva a força narrativa sem transformar a expressão em um termo técnico de posse do cargo.
- source_word: ὁ καλούμενος
  choice: chamado
  rationale: A expressão participial identifica Judas por um nome adicional ou epíteto; “chamado” é natural e fiel à construção grega.
- source_word: Μακκαβαῖος
  choice: Macabeu
  rationale: “Macabeu” é a forma tradicional e amplamente reconhecida em português para o epíteto grego Μακκαβαῖος.
- source_word: υἱὸς αὐτοῦ
  choice: seu filho
  rationale: A expressão identifica Judas como filho da personagem mencionada anteriormente; a posição junto a “Judas” elimina possível ambiguidade em português.
- source_word: ἀντʼ αὐτοῦ
  choice: em seu lugar
  rationale: ἀντί com o genitivo expressa substituição ou sucessão. “Em seu lugar” comunica esse sentido sem afirmar formalmente uma investidura política.
theological_decisions:
- issue: Natureza da sucessão de Judas
  choice: levantou-se em seu lugar
  alternative: sucedeu-lhe
  rationale: O grego narra que Judas assumiu o lugar do pai, mas não emprega um termo técnico de sucessão oficial. A formulação escolhida mantém tanto a imagem narrativa quanto a abertura do original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A ordem dos elementos foi levemente ajustada para deixar inequívoco que “seu filho” se refere a Judas.
