  yaml_path: translation/deuterocanon/1_maccabees/003/016.yaml
  text: And he came near as far as the ascent of Beth-horon[a], and Judas went out to meet him with only a few men.
translation:
  language: pt
  text: Ele se aproximou até a subida de Bete-Horom[a], e Judas saiu ao encontro dele com apenas alguns homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego Μεθωρών reflete o lugar geralmente conhecido como Bete-Horom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: se aproximou
  rationale: O aoristo de ἐγγίζω expressa aproximação; «se aproximou» é natural em português e preserva o movimento em direção ao local.
- source_word: ἕως ἀναβάσεως
  choice: até a subida
  rationale: ἕως com o genitivo indica extensão ou limite, e ἀνάβασις designa aqui a subida topográfica. «Até a subida» conserva ambos os sentidos sem transformar o termo em «passagem» ou «desfiladeiro».
- source_word: Μεθωρών
  choice: Bete-Horom
  rationale: Embora o texto grego tenha Μεθωρών, trata-se do lugar geralmente conhecido como Bete-Horom. Emprega-se a forma portuguesa convencional, com nota que registra a forma grega.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: O verbo significa literalmente «saiu». Evita-se «marchou», que acrescentaria uma nuance militar não expressa pelo verbo.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: ao encontro dele
  rationale: A expressão idiomática indica sair para encontrar alguém; «saiu ao encontro dele» é a formulação portuguesa mais natural.
- source_word: ὀλίγος
  choice: com apenas alguns homens
  rationale: O adjetivo singular funciona predicativamente e indica que Judas estava acompanhado por um número reduzido. O português requer que o referente implícito seja explicitado; «homens» é adequado ao contexto militar, e «apenas» preserva a ênfase na escassez.
