    issue: «Para nos exterminar» é excessivamente específico para ἐξᾶραι.
    rationale: Embora o contexto seja de ameaça extrema, o verbo grego significa primariamente remover ou tirar e pode, por extensão contextual, comunicar destruição. «Exterminar» tende a explicitar aniquilação total e acrescenta uma intensidade que o termo não determina por si só. «Destruir» conserva a ameaça sem estreitar indevidamente o alcance lexical.
