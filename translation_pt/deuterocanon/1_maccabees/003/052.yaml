  yaml_path: translation/deuterocanon/1_maccabees/003/052.yaml
  text: And behold[a], the nations have gathered against us to destroy us[b]; you know what they are planning against us.
translation:
  language: pt
  text: Eis que as nações se reuniram contra nós para nos destruir[a]; tu sabes o que tramam contra nós.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para nos eliminar». O verbo grego pode indicar remover ou destruir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o que planejam contra nós».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Eis que
  rationale: Preserva a força de chamada de atenção e a urgência da oração, em registro bíblico ainda claro em português.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Reproduz diretamente o sentido político e coletivo de ἔθνη no contexto, sem recorrer ao termo religiosamente mais marcado «gentios».
- source_word: συνῆκται
  choice: se reuniram
  rationale: O perfeito grego indica uma reunião já realizada cujos efeitos permanecem; o pretérito perfeito é natural em português e adequado ao contexto.
- source_word: ἐφʼ ἡμᾶς
  choice: contra nós
  rationale: Expressa a direção hostil da reunião no contexto militar.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: para nos exterminar
  rationale: A construção indica finalidade, e ἐξαίρω pode comunicar remoção completa ou aniquilação; «exterminar» transmite a ameaça total com concisão e dignidade.
- source_word: σὺ οἶδας
  choice: tu sabes
  rationale: Mantém a interpelação direta a Deus e o pronome enfático do grego.
- source_word: ἃ λογίζονται
  choice: o que tramam
  rationale: No contexto hostil, λογίζομαι denota cálculo ou intenção deliberada; «tramam» torna clara essa conotação sem ampliar o conteúdo.
theological_decisions:
- issue: Referente de τὰ ἔθνη numa oração judaica em contexto de guerra
  choice: as nações
  alternative: os gentios; os povos
  rationale: «As nações» preserva a amplitude lexical do grego e destaca o sentido político-militar, sem impor um uso religioso técnico posterior.
- issue: Intensidade da ameaça em ἐξᾶραι
  choice: para nos exterminar
  alternative: para nos eliminar; para nos destruir
  rationale: O verbo pode designar retirar ou eliminar e, neste contexto, aponta para a supressão completa do povo. A nota registra uma alternativa sem reduzir a gravidade da ameaça.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. «Eis que» conserva a urgência da oração; «tu sabes» mantém a interpelação direta e enfática do original.
