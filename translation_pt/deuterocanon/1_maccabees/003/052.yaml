  verdict: revise
  source_fidelity: «As nações se reuniram contra nós» reproduz bem τὰ ἔθνη συνῆκται ἐφʼ ἡμᾶς, e «tu sabes o que tramam contra nós» comunica adequadamente a interpelação enfática e o cálculo hostil de σὺ οἶδας ἃ λογίζονται ἐφʼ ἡμᾶς. Contudo, «exterminar» afirma de modo mais específico a eliminação total de pessoas do que o ἐξᾶραι, cujo sentido básico é remover/tirar e que, no contexto, pode ser vertido de forma segura por «destruir».
  naturalness: O texto é claro, idiomático e adequadamente solene em português moderno. «Eis que» e «tu sabes» são naturais no registro de oração bíblica e compreensíveis para leitores brasileiros.
  terminology: «Nações» preserva apropriadamente τὰ ἔθνη sem introduzir a carga técnica de «gentios». «Tramam» é uma boa opção contextual para λογίζονται. Recomenda-se «destruir» no lugar de «exterminar», deixando a alternativa mais intensa ou mais literal para a nota.
  issues:
