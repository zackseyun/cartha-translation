  yaml_path: translation/deuterocanon/1_maccabees/003/050.yaml
  text: And they cried out with a loud voice to heaven[a], saying, “What shall we do with these, and where shall we take them?”
translation:
  language: pt
  text: 'E clamaram em alta voz ao céu, dizendo: “Que faremos com estes, e para onde os levaremos[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para onde os conduziremos daqui?” O verbo grego pode indicar mais especificamente levar ou conduzir alguém para longe do lugar ou perigo presente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησαν
  choice: clamaram
  rationale: Expressa um apelo forte e urgente e, neste contexto, conserva o tom de oração melhor do que o mais neutro “chamaram”.
- source_word: φωνῇ
  choice: em alta voz
  rationale: Embora o substantivo signifique literalmente “voz”, sua combinação com ἐβόησαν reforça a intensidade do clamor; a expressão portuguesa é natural e enfática.
- source_word: εἰς τὸν οὐρανόν
  choice: ao céu
  rationale: Indica a direção do apelo. A formulação mantém “céu” como no grego, sem explicitar Deus como destinatário.
- source_word: Τί ποιήσωμεν
  choice: Que faremos
  rationale: Representa de modo conciso o subjuntivo deliberativo e preserva a urgência e a incerteza da pergunta.
- source_word: τούτοις
  choice: com estes
  rationale: Mantém a referência demonstrativa sem identificar ou explicar os envolvidos além do que o próprio versículo afirma.
- source_word: ἀπαγάγωμεν
  choice: os levaremos
  rationale: É uma formulação portuguesa natural para transportar ou conduzir pessoas a outro lugar; a nota registra a nuance mais específica de afastamento presente no verbo composto.
theological_decisions:
- issue: Destinatário implícito do clamor
  choice: Manter “ao céu”
  alternative: “a Deus no céu” ou “ao Senhor”
  rationale: O texto grego menciona o céu, não Deus ou o Senhor de maneira explícita. O contexto sugere oração, mas a tradução não explicita o que o original deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Clamaram em alta voz” conserva o tom solene e urgente; a ordem e as perguntas do grego foram mantidas sem explicações inseridas no texto.
