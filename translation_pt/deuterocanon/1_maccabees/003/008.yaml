  yaml_path: translation/deuterocanon/1_maccabees/003/008.yaml
  text: And he went through the cities of Judah[a], and destroyed the ungodly from it[b], and turned away wrath from Israel.
translation:
  language: pt
  text: E ele percorreu as cidades de Judá, extirpou dela os ímpios[a] e afastou de Israel a ira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os irreverentes» ou «os perversos».
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, «ira» provavelmente se refere à ira divina, embora o versículo não mencione Deus de forma explícita.
    reason: alternative_reading
lexical_decisions:
- source_word: διῆλθεν
  choice: percorreu
  rationale: Expressa o movimento através de uma série de cidades de modo natural em português, sem acrescentar uma finalidade não indicada pelo grego.
- source_word: πόλεσιν Ἰούδα
  choice: as cidades de Judá
  rationale: Mantém a expressão geográfica direta; πόλις pode designar cidade ou povoação, mas «cidades» corresponde formalmente ao termo e é claro no contexto.
- source_word: ἐξωλόθρευσεν
  choice: extirpou
  rationale: Preserva a força do verbo, que indica remoção mediante destruição, e combina naturalmente com a ideia de retirar pessoas de um território.
- source_word: ἀσεβεῖς
  choice: os ímpios
  rationale: Conserva a dimensão religiosa e moral de ἀσεβής, referente aos que agem sem reverência a Deus e contra a ordem da aliança.
- source_word: ἐπʼ αὐτῆς
  choice: dela
  rationale: Mantém a referência pronominal do grego a Judá, entendida como terra ou região, sem inserir explicitamente um substantivo ausente do texto.
- source_word: ἀπέστρεψεν ὀργὴν
  choice: afastou ... a ira
  rationale: Reproduz o sentido idiomático de fazer cessar ou desviar a ira, em formulação natural e digna em português.
- source_word: ἀπὸ Ἰσραήλ
  choice: de Israel
  rationale: Apresenta Israel diretamente como aquele de quem a ira foi afastada e conserva o sentido coletivo do original.
theological_decisions:
- issue: A natureza da «ira» afastada de Israel
  choice: O texto diz simplesmente «a ira», sem identificar expressamente quem está irado.
  alternative: Explicitar «a ira de Deus» ou entender a palavra como calamidade ou hostilidade geral contra Israel.
  rationale: No contexto das Escrituras judaicas, ὀργή provavelmente alude à ira divina; contudo, Deus não é nomeado neste versículo. A tradução preserva essa tensão em vez de tornar explícito o que permanece implícito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Percorreu» e «afastou» dão fluidez sem enfraquecer o original; «extirpou» conserva a severidade de ἐξωλόθρευσεν. A referência pronominal em «dela» preserva a concisão e a leve ambiguidade do grego.
