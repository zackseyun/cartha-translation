  yaml_path: translation/deuterocanon/1_maccabees/003/006.yaml
  text: And the lawless were restrained because of fear of him[a], and all the workers of lawlessness were thrown into confusion[b], and deliverance prospered in his hand.
translation:
  language: pt
  text: E os iníquos foram contidos por medo dele, e todos os que praticavam a iniquidade ficaram abalados, e a libertação[a] prosperou em sua mão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “salvação”. A palavra grega pode significar tanto “libertação” como “salvação”; neste contexto, refere-se principalmente ao livramento nacional e militar.
    reason: lexical_alternative
  - marker: b
    text: A expressão “em sua mão” é um idioma bíblico que indica que o êxito veio por meio da ação ou do poder dele.
    reason: cultural_note
lexical_decisions:
- source_word: συνεστάλησαν
  choice: foram contidos
  rationale: Expressa o passivo de συστέλλω como repressão ou contenção causada pelo temor, sem limitar o sentido a uma retirada militar.
- source_word: οἱ ἄνομοι
  choice: os transgressores da Lei
  rationale: No contexto de 1 Macabeus, ἄνομοι caracteriza os que violam ou rejeitam a Lei. A formulação mantém a referência à Lei e prepara a repetição do mesmo campo lexical em ἀνομία.
- source_word: ἀπὸ τοῦ φόβου αὐτοῦ
  choice: por medo dele
  rationale: 'Reproduz com naturalidade a relação causal indicada pela preposição ἀπό: eles foram contidos porque o temiam.'
- source_word: οἱ ἐργάται τῆς ἀνομίας
  choice: todos os que praticavam a transgressão da Lei
  rationale: Conserva a ligação lexical com ἄνομοι e transmite a imagem de pessoas ativamente empenhadas na transgressão, evitando o pouco natural 'trabalhadores da ilegalidade'.
- source_word: συνεταράχθησαν
  choice: ficaram perturbados
  rationale: Traduz o passivo com o sentido de agitação, abalo e desordem, sem intensificá-lo obrigatoriamente para 'aterrorizados'.
- source_word: εὐωδώθη
  choice: prosperou
  rationale: Mantém a imagem verbal de algo que alcança bom êxito, em vez de reduzir o resultado apenas a uma vitória militar.
- source_word: σωτηρία
  choice: libertação
  rationale: Neste relato histórico-militar, o termo aponta principalmente para resgate ou livramento do povo; 'libertação' preserva essa amplitude sem impor um sentido soteriológico mais estreito.
- source_word: ἐν χειρὶ αὐτοῦ
  choice: em sua mão
  rationale: Preserva o idioma bíblico e o singular do grego, indicando que a libertação prosperou por sua ação ou poder.
theological_decisions:
- issue: Sentido de σωτηρία no contexto militar deuterocanônico
  choice: libertação
  alternative: salvação
  rationale: O contexto imediato descreve o efeito da atuação de Judas sobre os inimigos e o livramento obtido por meio dele. 'Libertação' comunica o resgate histórico do povo, enquanto a nota preserva a alternativa lexical mais ampla.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A repetição de 'transgressores/transgressão da Lei' procura conservar a coesão do grupo grego ἀνομ-; o ponto e vírgula dá relevo à declaração culminante sobre a libertação.
