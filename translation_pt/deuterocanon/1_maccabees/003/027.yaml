base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/027.yaml
  text: When Antiochus the king heard these words[a], he became furiously angry, and he sent out and gathered all the forces of his kingdom, a very strong camp.
translation:
  language: pt
  text: Quando o rei Antíoco ouviu essas palavras, ficou furioso e enviou ordens para reunir todas as forças do seu reino, um acampamento militar muito poderoso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma força acampada muito poderosa” ou “um exército acampado muito poderoso”. A palavra grega pode designar tanto o acampamento quanto a força nele acampada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Quando
  rationale: Introduz o acontecimento seguinte com valor temporal e transição narrativa natural em português.
- source_word: ἤκουσεν ... τοὺς λόγους τούτους
  choice: ouviu essas palavras
  rationale: Mantém o sentido direto de ἀκούω e a formulação explícita λόγους τούτους, sem reduzir a expressão a “soube disso”.
- source_word: ὠργίσθη θυμῷ
  choice: ficou furioso
  rationale: A combinação intensifica a ira; esta formulação transmite a força enfática de modo natural, sem reproduzir literalmente a redundância grega.
- source_word: ἀπέστειλεν καὶ συνήγαγεν
  choice: mandou reunir
  rationale: No contexto de mobilização militar, ἀπέστειλεν indica o envio de ordens ou agentes, seguido da reunião das tropas. A construção portuguesa expressa naturalmente essa relação sem introduzir um objeto não declarado.
- source_word: τὰς δυνάμεις πάσας τῆς βασιλείας αὐτοῦ
  choice: todas as forças do seu reino
  rationale: δυνάμεις designa aqui forças militares; a escolha conserva a amplitude do termo sem especificar indevidamente o tipo de tropa.
- source_word: παρεμβολὴν ἰσχυρὰν σφόδρα
  choice: formando um exército poderosíssimo
  rationale: A expressão funciona em aposição às forças reunidas. παρεμβολή pode indicar tanto o acampamento quanto a força acampada; no fluxo narrativo, “exército” comunica naturalmente esta última possibilidade, enquanto a nota preserva a ambiguidade lexical. “Poderosíssimo” representa a intensificação de ἰσχυράν por σφόδρα.
