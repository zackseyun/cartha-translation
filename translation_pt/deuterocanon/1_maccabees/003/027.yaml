- from: Quando o rei Antíoco ouviu essas palavras, ficou furioso; então mandou reunir todas as forças do seu reino, formando um exército poderosíssimo.[a]
  to: Quando o rei Antíoco ouviu essas palavras, ficou furioso e enviou ordens para reunir todas as forças do seu reino, um acampamento militar muito poderoso.[a]
