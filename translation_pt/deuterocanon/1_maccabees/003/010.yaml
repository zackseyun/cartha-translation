  text: And Apollonius gathered Gentiles[a], and from Samaria a large force to wage war against Israel.
translation:
  language: pt
  text: E Apolônio reuniu gentios[a] e uma grande força da Samaria para guerrear contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nações”. O termo grego pode significar “nações” em geral, mas aqui provavelmente se refere a povos não israelitas reunidos contra Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: reuniu
  rationale: O aoristo indica que Apolônio ajuntou pessoas e tropas. “Reuniu” é natural em português e serve adequadamente aos dois complementos.
- source_word: ἔθνη
  choice: gentios
  rationale: Neste contexto narrativo judaico, o termo designa provavelmente povos não israelitas em contraste com Israel. “Gentios” preserva esse contraste sem acrescentar a conotação religiosa mais forte de “pagãos”.
- source_word: δύναμιν μεγάλην
  choice: uma grande força
  rationale: Aqui δύναμις se refere a efetivos ou poderio militar. “Uma grande força” conserva a amplitude do grego sem especificar necessariamente um exército formal.
- source_word: τοῦ πολεμῆσαι
  choice: para guerrear
  rationale: O infinitivo articular exprime propósito. “Para guerrear” comunica ação militar organizada e reproduz de modo conciso essa relação final.
- source_word: πρὸς Ἰσραήλ
  choice: contra Israel
  rationale: Com o verbo πολεμέω, πρὸς expressa direção hostil; “contra Israel” é a formulação portuguesa natural.
- source_word: ἀπὸ Σαμαρίας
  choice: da Samaria
  rationale: A preposição indica origem. “Da Samaria” expressa com clareza que a grande força procedia dessa região.
theological_decisions:
- issue: Sentido de ἔθνη no contexto bélico judaico
  choice: gentios
  alternative: nações
  rationale: O contexto contrapõe os grupos reunidos a Israel, favorecendo a referência a povos não israelitas. A nota preserva o sentido lexical mais geral, “nações”, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura corrente, com estrutura clara. “Apolônio” segue a forma portuguesa tradicional do nome; “guerrear” mantém o caráter militar organizado sem tornar a frase excessivamente técnica.
