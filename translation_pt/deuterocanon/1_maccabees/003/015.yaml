base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/015.yaml
  text: And a strong camp of ungodly men was added and went up with him[b][a], to help him and to execute vengeance on the sons of Israel.
translation:
  language: pt
  text: E um forte exército[a] de homens ímpios juntou-se a ele e subiu com ele, para ajudá-lo e fazer vingança contra os filhos de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “acampamento”. O grego παρεμβολή pode designar um acampamento ou um exército, isto é, a força militar acampada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fazer vingança nos filhos de Israel”; neste contexto, trata-se de uma ação punitiva dirigida contra Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεθέτο
  choice: juntou-se a ele
  rationale: O médio indica que a força foi acrescentada à que já estava em vista. “Juntou-se a ele” comunica isso de modo natural em português, sem alterar o sentido narrativo.
- source_word: ἀνέβη
  choice: subiu
  rationale: Preserva a linguagem concreta e habitual de movimento de ἀναβαίνω, sem acrescentar a ideia mais específica de marcha militar.
- source_word: παρεμβολὴ
  choice: exército
  rationale: O termo pode designar tanto um acampamento quanto o contingente militar nele reunido. Neste contexto, refere-se à força armada que acompanhou o comandante; “exército” é mais claro no português atual, mantendo a alternativa em nota.
- source_word: ἀσεβῶν
  choice: homens ímpios
  rationale: Conserva a dimensão religiosa e moral de ἀσεβής, em vez de reduzi-la à maldade em sentido geral. “Homens” explicita que o genitivo se refere a pessoas.
- source_word: ἰσχυρὰ
  choice: forte
  rationale: Equivalente direto e natural, aqui qualificando a capacidade da força militar.
- source_word: βοηθῆσαι
  choice: para ajudá-lo
  rationale: O infinitivo exprime finalidade; a formulação é simples, clara e fiel.
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: exercer vingança
  rationale: A expressão denota a realização de uma retaliação punitiva. “Exercer vingança” preserva a força de ἐκδίκησις sem suavizá-la para simples punição.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: contra os filhos de Israel
  rationale: Embora ἐν seja literalmente “em”, neste contexto hostil indica o alvo da ação punitiva. “Filhos de Israel” conserva a designação étnica e pactual do texto grego.
theological_decisions:
- issue: Sentido religioso e moral de ἀσεβῶν em contexto político-militar
  choice: homens ímpios
  alternative: homens perversos; homens sem Deus
  rationale: “Ímpios” mantém a caracterização de irreverência diante de Deus e da ordem da aliança, sem introduzir categorias doutrinárias posteriores.
- issue: Designação υἱοῖς Ἰσραήλ
  choice: filhos de Israel
  alternative: povo de Israel; israelitas
  rationale: A tradução retém a expressão bíblica tradicional presente no grego, onde o masculino funciona como designação étnica e pactual coletiva.
- issue: Direção da vingança expressa por ἐν
  choice: contra os filhos de Israel
  alternative: entre os filhos de Israel; sobre os filhos de Israel
  rationale: O contexto apresenta Israel como alvo da expedição punitiva. A nota preserva a forma literalmente ambígua da preposição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe foi ajustada à ordem natural do português, mantendo a sequência narrativa e a finalidade dos infinitivos gregos. Termos bíblicos tradicionais como “ímpios” e “filhos de Israel” foram preservados por sua precisão teológica e cultural.
