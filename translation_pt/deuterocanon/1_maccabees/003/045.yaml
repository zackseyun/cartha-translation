base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/045.yaml
  text: And Jerusalem was uninhabited like a wilderness[a]; there was no one entering or going out from her offspring, and the sanctuary was being trampled down, and sons of foreigners were in the citadel, a lodging place for the nations; and delight was taken away from Jacob[c][b], and flute and harp ceased.
translation:
  language: pt
  text: Jerusalém estava desabitada como um deserto; dentre os seus filhos, não havia quem entrasse ou saísse[a]. O santuário era pisoteado, e filhos de estrangeiros estavam na cidadela[b], que servia de alojamento para as nações. O deleite foi tirado de Jacó, e cessaram a flauta e a harpa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “dentre os seus filhos” significa literalmente “dentre as coisas geradas por ela” e pode indicar os nascidos em Jerusalém, isto é, seus habitantes.
    reason: lexical_alternative
  - marker: b
    text: Ou “Acra”, a cidadela fortificada de Jerusalém.
    reason: alternative_reading
  - marker: c
    text: “Harpa” também pode ser traduzido por “lira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀοίκητος ὡς ἔρημος
  choice: desabitada como um deserto
  rationale: “Desabitada” expressa concretamente a ausência de moradores, enquanto “como um deserto” preserva a comparação explícita do grego sem fundir as duas ideias.
- source_word: ἐκ τῶν γενημάτων αὐτῆς
  choice: dentre os seus filhos
  rationale: γενήματα designa literalmente aquilo que é gerado ou nascido. “Seus filhos” conserva a personificação de Jerusalém e comunica, no contexto, os nascidos ou habitantes da cidade; a dificuldade lexical é registrada em nota.
- source_word: ἁγίασμα
  choice: santuário
  rationale: É o equivalente português natural para o lugar sagrado em questão, sem restringi-lo indevidamente a uma parte específica do complexo do templo.
- source_word: καταπατούμενον
  choice: era pisoteado
  rationale: Preserva a imagem concreta de ser calcado aos pés e sua força de desonra, em vez de substituí-la apenas pela interpretação “profanado”.
- source_word: υἱοὶ ἀλλογενῶν
  choice: filhos de estrangeiros
  rationale: Mantém a forma específica do grego, que não diz simplesmente “estrangeiros”, embora a expressão seja menos idiomática em português.
- source_word: ἄκρα
  choice: cidadela
  rationale: Traduz o sentido da fortaleza elevada e fortificada de Jerusalém; o possível nome histórico “Acra” é preservado em nota.
- source_word: κατάλυμα ἐν τοῖς ἔθνεσιν
  choice: alojamento para as nações
  rationale: “Alojamento” conserva o sentido básico de κατάλυμα como lugar de pouso ou hospedagem. “Para as nações” segue a relação contextual adotada sem converter explicitamente ἔθνη em “gentios”.
- source_word: τέρψις
  choice: deleite
  rationale: “Deleite” preserva a nuance de prazer ou satisfação, em vez de nivelar o termo à palavra mais geral “alegria”.
- source_word: αὐλὸς
  choice: flauta
  rationale: É um equivalente moderno claro para o instrumento de sopro, também traduzível por “flauta de tubo” ou “flautim” conforme o contexto.
- source_word: κινύρα
  choice: harpa
  rationale: “Harpa” é uma designação reconhecível do instrumento de cordas; “lira” permanece uma alternativa lexical plausível e aparece em nota.
theological_decisions:
- issue: Sentido da expressão incomum ἐκ τῶν γενημάτων αὐτῆς
  choice: dentre os seus filhos
  alternative: dentre os seus habitantes; dentre os nascidos nela; de seus produtos
  rationale: A leitura principal conserva a metáfora genealógica aplicada à cidade e não elimina o substantivo transmitido pelo texto grego. Como a expressão admite mais de uma compreensão lexical, a nota evita apresentar a interpretação contextual como indiscutível.
- issue: Tradução ou transliteração de ἄκρα
  choice: cidadela
  alternative: Acra
  rationale: O substantivo traduzido torna o texto imediatamente compreensível, enquanto a nota preserva a identificação possível com o nome histórico da fortaleza selêucida.
- issue: Valor contextual de ἔθνεσιν
  choice: nações
  alternative: gentios
  rationale: “Nações” mantém o valor lexical amplo do termo e evita introduzir no texto principal uma categoria religiosa mais explícita do que a forma grega exige, embora “gentios” seja contextualmente possível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e cadência narrativa. A personificação de Jerusalém e as imagens concretas de desolação, profanação e silêncio musical foram preservadas. As formulações menos transparentes do grego foram mantidas no texto quando significativas e esclarecidas em notas, sem resolver silenciosamente suas ambiguidades.
