  yaml_path: translation/deuterocanon/1_maccabees/003/012.yaml
  text: And they took their equipment[a], and Judas took the sword of Apollonius, and he fought with it all his days.
translation:
  language: pt
  text: E tomaram o equipamento deles. Judas tomou a espada de Apolônio e continuou lutando com ela todos os seus dias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todos os dias”; no contexto, a expressão provavelmente significa pelo resto da vida de Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  choice: equipamento
  rationale: No contexto militar, designa coletivamente os apetrechos ou materiais pertencentes aos derrotados. “Equipamento” é claro e abrangente, sem especificar armas ou despojos além do que o grego afirma.
- source_word: μάχαιραν
  choice: espada
  rationale: Embora μάχαιρα possa designar uma lâmina curta ou um punhal, “espada” é a tradução natural neste relato militar e evita precisão indevida.
- source_word: ἦν πολεμῶν
  choice: continuou lutando
  rationale: A construção perifrástica com ἦν e particípio comunica ação prolongada ou habitual; “continuou lutando” preserva esse aspecto melhor do que o simples “lutou”.
- source_word: ἐν αὐτῇ
  choice: com ela
  rationale: O pronome feminino retoma naturalmente “a espada”, e “com ela” expressa em português o valor instrumental da construção.
- source_word: πάσας τὰς ἡμέρας
  choice: por todos os seus dias
  rationale: A expressão mantém de perto a formulação grega e sua possível força idiomática, sem explicitar no texto que se trata necessariamente do restante da vida de Judas.
