  yaml_path: translation/deuterocanon/1_maccabees/003/043.yaml
  text: And each said to his neighbor[a], “Let us restore the ruin of our people and of the holy places.”
translation:
  language: pt
  text: 'E cada um disse ao que estava ao seu lado: “Vamos reerguer das ruínas o nosso povo e os lugares santos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as coisas santas”. O grego combina “reerguer” com uma palavra que significa “ruína”, “demolição” ou “queda”, exprimindo a restauração depois da devastação.
    reason: Alternativas lexicais e preservação da imagem incomum da expressão grega.
lexical_decisions:
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: cada um disse ao que estava ao seu lado
  rationale: Preserva o valor distributivo de ἕκαστος e expressa de modo natural que cada pessoa se dirigia a quem estava próximo.
- source_word: Ἀναστήσωμεν τὴν καθαίρεσιν
  choice: vamos reerguer das ruínas
  rationale: A construção grega combina o verbo “levantar/reerguer” com um substantivo que significa “demolição, queda, ruína”. A formulação portuguesa conserva a imagem de levantar novamente após a devastação sem reproduzir uma combinação pouco natural.
- source_word: τοῦ λαοῦ ἡμῶν
  choice: o nosso povo
  rationale: λαός designa aqui o povo de Israel; “nosso povo” é direto, corrente e adequado ao contexto.
- source_word: τῶν ἁγίων
  choice: os lugares santos
  rationale: O plural substantivado refere-se, no contexto da profanação do templo, aos espaços e elementos sagrados. “Lugares santos” comunica claramente a referência cultual sem limitá-la a um único edifício.
theological_decisions:
- issue: Referente de τῶν ἁγίων
  choice: os lugares santos
  alternative: as coisas santas; o santuário
  rationale: O contexto favorece os lugares e recintos sagrados devastados, mas o grego plural também pode abranger objetos sagrados. A nota preserva essa amplitude sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Ao que estava ao seu lado” evita a possível leitura estritamente residencial de “vizinho”; “reerguer das ruínas” mantém a força concreta da expressão grega em sintaxe portuguesa natural.
