lexical_decisions:
- source_word: Καὶ μετὰ τοῦτο
  choice: Depois disso
  rationale: Transição temporal natural em português moderno, preservando a sequência expressa pelo grego.
- source_word: κατέστησεν
  choice: nomeou
  rationale: No contexto da atribuição de funções militares, indica colocar pessoas em posições de responsabilidade.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forma tradicional e amplamente reconhecida em português para o nome neste contexto.
- source_word: ἡγουμένους τοῦ λαοῦ
  choice: líderes do povo
  rationale: Mantém o sentido amplo de pessoas que lideram, enquanto os títulos seguintes especificam os postos militares.
- source_word: χιλιάρχους
  choice: comandantes de mil
  rationale: Tradução transparente que conserva a estrutura numérica do posto sem introduzir terminologia romana posterior.
- source_word: ἑκατοντάρχους
  choice: de cem
  rationale: O substantivo «comandantes» rege toda a enumeração, permitindo uma formulação concisa e paralela.
- source_word: πεντηκοντάρχους
  choice: de cinquenta
  rationale: Preserva a hierarquia numérica e o paralelismo da lista grega.
- source_word: δεκαδάρχους
  choice: de dez
  rationale: Mantém de modo claro e consistente o último nível da organização militar descrita.
