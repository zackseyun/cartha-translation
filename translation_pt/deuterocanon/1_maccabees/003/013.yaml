base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/013.yaml
  text: And Seron[a], the commander of the army of Syria, heard that Judas had gathered a company and an assembly of the faithful with him[b], and of those going out to war.
translation:
  language: pt
  text: Seron, comandante do exército da Síria, soube que Judas havia reunido um grupo[a] e uma assembleia de fiéis[b] que estavam com ele e saíam para a guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um bando” ou “um agrupamento”; o grego indica um conjunto de pessoas reunidas e, neste contexto, pode ter nuance militar.
    reason: lexical_alternative
  - marker: b
    text: “Fiéis” também pode ser entendido como “leais”, destacando tanto a fidelidade religiosa quanto o compromisso com a causa de Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube
  rationale: No contexto narrativo, o aoristo de ἀκούω indica que Seron recebeu a notícia; “soube” é natural em português e mantém o sentido amplo de tomar conhecimento pelo que ouviu.
- source_word: ὁ ἄρχων τῆς δυνάμεως Συρίας
  choice: comandante do exército da Síria
  rationale: ἄρχων designa aqui um chefe militar, e δύναμις, no contexto, uma força armada ou exército. A formulação segue o genitivo do texto grego sem transformar “Síria” em adjetivo.
- source_word: ἤθροισεν
  choice: havia reunido
  rationale: O verbo significa ajuntar ou reunir. O mais-que-perfeito composto expressa naturalmente em português a ação anterior à notícia recebida por Seron.
- source_word: ἄθροισμα
  choice: um grupo
  rationale: O substantivo denota um conjunto reunido. “Grupo” é claro e não pressupõe uma unidade militar formal, embora o contexto permita uma nuance marcial.
- source_word: ἐκκλησίαν
  choice: uma assembleia
  rationale: No contexto judaico pré-cristão, “assembleia” comunica uma reunião ou comunidade convocada sem importar o sentido institucional cristão posterior de “igreja”.
- source_word: πιστῶν
  choice: de fiéis
  rationale: O adjetivo substantivado pode indicar pessoas fiéis ou leais. “Fiéis” preserva tanto a fidelidade religiosa quanto a lealdade à causa.
- source_word: μεθʼ αὐτοῦ
  choice: que estavam com ele
  rationale: Expressa acompanhamento ou associação com Judas em linguagem portuguesa natural.
- source_word: ἐκπορευομένων εἰς πόλεμον
  choice: e saíam para a guerra
  rationale: O particípio genitivo plural é coordenado a πιστῶν e caracteriza os integrantes da assembleia como pessoas que partiam para a guerra. A tradução mantém essa ligação sem elevar “guerra” a uma batalha específica.
theological_decisions:
- issue: Sentido de ἐκκλησίαν no contexto judaico e militar de 1 Macabeus
  choice: uma assembleia
  alternative: uma congregação; uma igreja
  rationale: “Assembleia” reproduz o sentido contextual de uma comunidade reunida e evita projetar sobre o texto uma instituição cristã posterior.
- issue: Amplitude semântica de πιστῶν
  choice: fiéis
  alternative: leais
  rationale: “Fiéis” conserva a possível referência à fidelidade à aliança, sem excluir a lealdade concreta a Judas e à causa apresentada na narrativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura mantém os dois substantivos gregos, “grupo” e “assembleia”, apesar da proximidade de sentido. A oração relativa torna explícita a ligação gramatical dos genitivos πιστῶν e ἐκπορευομένων com os membros da assembleia, sem resolver a ambiguidade de “fiéis/leais”.
