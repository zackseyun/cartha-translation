  yaml_path: translation/deuterocanon/1_maccabees/003/044.yaml
  text: And the assembly gathered to be ready for war[b][a], and to pray and ask for mercy and compassion.
translation:
  language: pt
  text: E a assembleia se reuniu para estar preparada para a guerra[a] e para orar e pedir misericórdia e compaixão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi reunida”. O verbo grego tem forma passiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθροίσθη
  choice: se reuniu
  rationale: O aoristo passivo pode indicar que a comunidade foi reunida ou que se reuniu. A forma pronominal é natural em português e preserva o sentido coletivo; a alternativa mais formal consta na nota.
- source_word: ἡ συναγωγή
  choice: a assembleia
  rationale: No contexto, designa a comunidade reunida, não um edifício nem necessariamente a instituição posterior chamada sinagoga. “Assembleia” é claro e historicamente apropriado.
- source_word: τοῦ εἶναι ἑτοίμους
  choice: para estar pronta
  rationale: O infinitivo articular expressa finalidade. A concordância no singular retoma o substantivo coletivo “assembleia”.
- source_word: εἰς πόλεμον
  choice: para a guerra
  rationale: Traduz diretamente πόλεμος e corresponde ao contexto militar mais amplo.
- source_word: τοῦ προσεύξασθαι
  choice: para orar
  rationale: O segundo infinitivo articular é paralelo ao primeiro e também expressa finalidade.
- source_word: αἰτῆσαι
  choice: pedir
  rationale: Verbo corrente e direto para solicitar aquilo que os dois substantivos seguintes nomeiam.
- source_word: ἔλεον
  choice: misericórdia
  rationale: Mantém o peso religioso do apelo e é a equivalência portuguesa habitual neste contexto.
- source_word: οἰκτειρμούς
  choice: compaixão
  rationale: Distingue o termo de ἔλεον e comunica naturalmente a ideia de sentimentos ou atos compassivos, embora o grego esteja no plural.
theological_decisions:
- issue: Sentido de συναγωγή no contexto histórico deuterocanônico
  choice: a assembleia
  alternative: a congregação; a sinagoga
  rationale: A passagem descreve o povo reunido para a guerra e para a oração. “Assembleia” evita sugerir anacronicamente um edifício ou uma instituição fixa e preserva a dimensão comunitária.
- issue: Agente e nuance passiva de ἠθροίσθη
  choice: se reuniu
  alternative: foi reunida
  rationale: O grego é passivo na forma, mas pode descrever a reunião do grupo sem identificar um agente. A tradução principal é idiomática e a nota preserva a alternativa formal, sem decidir se alguém convocou a assembleia.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego sem rigidez. “Assembleia” evita a possível leitura arquitetônica de “sinagoga”; “misericórdia e compaixão” conserva a distinção entre os dois substantivos gregos.
