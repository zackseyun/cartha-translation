  yaml_path: translation/deuterocanon/1_maccabees/003/031.yaml
  text: And he was greatly troubled in his soul[a], and he decided to go into Persia[b], to collect the taxes of the regions and to gather much silver.
translation:
  language: pt
  text: E ele ficou profundamente angustiado em seu íntimo[a] e decidiu ir à Pérsia, recolher os impostos das regiões e juntar muita prata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ficou sem saber o que fazer» ou «ficou muito aflito». O verbo grego pode indicar tanto perplexidade como grave dificuldade.
    reason: lexical_alternative
  - marker: b
    text: Aqui, «prata» provavelmente se refere a riqueza monetária, em prata cunhada ou pesada, e não apenas ao metal em estado bruto.
    reason: cultural_note
lexical_decisions:
- source_word: ἠπορεῖτο
  choice: ficou profundamente angustiado
  rationale: O verbo pode indicar estar sem saber o que fazer, perplexo ou em grave dificuldade. No contexto da crise financeira e política, «ficou angustiado» comunica naturalmente a aflição interior, enquanto «profundamente» expressa a força de σφόδρα.
- source_word: τῇ ψυχῇ αὐτοῦ
  choice: em sua alma
  rationale: Mantém a linguagem antropológica do grego sem limitar ψυχή apenas à emoção ou à mente.
- source_word: σφόδρα
  choice: profundamente
  rationale: Intensifica a angústia de modo natural e digno em português.
- source_word: ἐβουλεύσατο
  choice: decidiu
  rationale: A forma média sugere deliberação que leva a uma decisão; «decidiu» é claro e atual.
- source_word: τοῦ πορευθῆναι εἰς τὴν Περσίδα
  choice: ir à Pérsia
  rationale: Expressa de modo direto e idiomático o conteúdo da decisão e o movimento em direção à Pérsia.
- source_word: λαβεῖν τοὺς φόρους
  choice: recolher os impostos
  rationale: φόροι pode designar tributos ou impostos. «Recolher os impostos» transmite com clareza a ação fiscal neste contexto administrativo.
- source_word: τῶν χωρῶν
  choice: das regiões
  rationale: χῶραι designa aqui territórios sujeitos ao governo; «regiões» evita a precisão administrativa não garantida de «províncias».
- source_word: συναγαγεῖν ἀργύριον πολύ
  choice: juntar muita prata
  rationale: Preserva a imagem concreta de ἀργύριον, que pode designar prata usada como dinheiro, sem substituí-la inteiramente pelo conceito abstrato de riqueza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura narrativa foi mantida próxima do grego, mas com formulação idiomática. As notas preservam a amplitude semântica de ἠπορεῖτο e esclarecem o uso monetário de ἀργύριον.
