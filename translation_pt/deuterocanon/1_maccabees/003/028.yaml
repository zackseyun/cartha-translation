  yaml_path: translation/deuterocanon/1_maccabees/003/028.yaml
  text: And he opened his treasury and gave wages to his forces for a year, and he commanded them to be ready for every need for a year.
translation:
  language: pt
  text: Então ele abriu o seu tesouro, pagou às suas tropas o soldo de um ano e ordenou-lhes que, durante um ano, estivessem prontas para qualquer necessidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γαζοφυλάκιον
  choice: tesouro
  rationale: No contexto, designa o lugar ou fundo onde se guardavam os recursos financeiros do rei; «tesouro» é natural e suficientemente preciso.
- source_word: ὀψώνια
  choice: soldo
  rationale: O termo se refere à remuneração ou provisão dada a soldados; «soldo» preserva com clareza o contexto militar.
- source_word: δυνάμεσιν
  choice: tropas
  rationale: Aqui indica as forças militares do rei, e «tropas» é a forma corrente e inequívoca em português.
- source_word: εἰς πᾶσαν χρείαν
  choice: para qualquer necessidade
  rationale: Mantém a amplitude da expressão grega sem especificar indevidamente que tipo de necessidade ou missão estava em vista.
