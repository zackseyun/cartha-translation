  source_fidelity: 'A tradução acompanha a estrutura e o sentido do grego: ἐδίωξεν é bem vertido por “perseguiu”, e ἐφλόγισεν por “queimou”. Contudo, “por toda parte” explicita uma extensão espacial que o particípio ἐξερευνῶν não afirma; ele indica antes uma busca cuidadosa/intensiva. “Os que viviam sem lei” comunica parte do sentido, mas transforma o adjetivo ἀνόμους numa descrição durativa e fica menos direto que “os sem lei”.'
  naturalness: A frase é clara e de registro apropriado. “Buscando-os” é natural e preserva a relação participial sem o acréscimo de “por toda parte”. A nota b atual, “pôs fogo nos”, está incompleta como alternativa independente e soa inadequada no ponto em que está ancorada.
  terminology: “Os sem lei” preserva a força moral e legal de ἀνόμους sem reduzi-la a uma categoria penal moderna nem especificar indevidamente a Lei mosaica. “Queimou” mantém a crueza de ἐφλόγισεν. “Incendiou” é uma alternativa lexical completa e idiomática para a nota.
