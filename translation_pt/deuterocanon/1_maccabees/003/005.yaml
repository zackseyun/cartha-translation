    rationale: A formulação deixa a regência sem complemento e não funciona como alternativa autônoma para “queimou” no texto.
  - severity: low
    issue: “os que viviam sem lei” torna ἀνόμους mais parafrástico e durativo.
    rationale: O grego emprega o adjetivo substantivado “os sem lei”; uma formulação igualmente direta preserva melhor a concisão e a categoria moral-legal do original.
