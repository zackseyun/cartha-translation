translation:
  language: pt
  text: E perseguiu os sem lei[a], buscando-os, e queimou os que perturbavam o seu povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os transgressores”.'
    reason: lexical_alternative
  - marker: b
