    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: perseguiu
  rationale: O verbo indica perseguição ativa e determinada. “Perseguiu” é natural em português e evita acrescentar a imagem específica de caça.
- source_word: ἀνόμους
  choice: os que viviam sem lei
  rationale: A expressão conserva a força moral e legal do adjetivo grego sem restringi-lo à categoria civil de criminosos ou foragidos.
- source_word: ἐξερευνῶν
  choice: procurando-os por toda parte
  rationale: O particípio descreve uma busca cuidadosa e intensa. A formulação comunica essa procura minuciosa em português corrente.
- source_word: παράσσοντας
  choice: os que perturbavam
  rationale: O particípio se refere aos que causavam desordem ou dano ao povo. “Perturbavam” mantém a amplitude do termo sem pressupor uma forma específica de opressão.
- source_word: ἐφλόγισεν
  choice: queimou
  rationale: O verbo expressa de modo direto a ação de queimar ou pôr em chamas. “Queimou” preserva a severidade da declaração sem explicá-la nem suavizá-la.
- source_word: τὸν λαὸν αὐτοῦ
  choice: o seu povo
  rationale: A expressão portuguesa é natural e preserva o sentido coletivo, nacional e comunitário de λαός.
theological_decisions:
- issue: Força moral e legal de ἀνόμους
  choice: os que viviam sem lei
  alternative: os transgressores
  rationale: A escolha preserva a ideia de pessoas que agiam fora da ordem legal e comunitária, sem limitar o termo à criminalidade civil nem explicitar indevidamente uma referência exclusiva à Lei mosaica.
- issue: Severidade de ἐφλόγισεν
  choice: queimou os que perturbavam o seu povo
  alternative: pôs fogo nos que perturbavam o seu povo
  rationale: O grego apresenta a ação de forma incisiva. A tradução mantém essa dureza e não a transforma em metáfora nem acrescenta detalhes sobre o modo ou o resultado da ação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição coordenada do grego foi preservada, e o particípio foi vertido de maneira idiomática sem reduzir a intensidade da busca.
