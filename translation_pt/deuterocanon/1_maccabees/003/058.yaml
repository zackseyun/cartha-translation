base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/058.yaml
  text: And Judas said[a], “Gird yourselves, and become mighty men[b], and be ready in the morning to fight against these nations that have assembled against us to destroy us and our holy things.”
translation:
  language: pt
  text: 'E Judas disse: “Cinjam-se e tornem-se homens valentes[a]. Estejam prontos pela manhã para lutar contra estas nações que se reuniram contra nós, a fim de destruir-nos, bem como as nossas coisas sagradas[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tornem-se filhos poderosos”; também pode ser traduzido por “mostrem-se homens fortes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o nosso santuário”. O grego emprega o plural “as nossas coisas sagradas”, que pode abranger objetos sagrados ou recintos santos.
    reason: alternative_reading
lexical_decisions:
- source_word: Περιζώσασθε
  choice: Cinjam-se
  rationale: Preserva a imagem concreta de prender a veste com um cinto como preparação para a ação, bem como o tom militar do imperativo médio.
- source_word: γίνεσθε εἰς υἱοὺς δυνατούς
  choice: tornem-se homens valentes
  rationale: Expressa em português natural o provável semitismo grego, literalmente «tornem-se filhos poderosos», sem apagar em nota sua forma masculina e incomum.
- source_word: ἕτοιμοι
  choice: prontos
  rationale: Equivalente direto, claro e natural no contexto de preparação militar.
- source_word: εἰς τὸ πρωῒ
  choice: pela manhã
  rationale: Mantém a referência temporal ao período da manhã sem especificar indevidamente «ao amanhecer».
- source_word: πολεμῆσαι
  choice: lutar
  rationale: Verbo corrente que comunica diretamente a ação de combater.
- source_word: ἔθνεσιν
  choice: nações
  rationale: Conserva o sentido amplo de povos estrangeiros; «gentios» tornaria explícito um contraste étnico-religioso que o contexto imediato não exige.
- source_word: ἐπισυνηγμένοις
  choice: que se reuniram
  rationale: Representa o estado resultante expresso pelo particípio perfeito e a ideia de forças congregadas contra o grupo de Judas.
- source_word: ἐξᾶραι
  choice: destruir
  rationale: No contexto de agressão militar, o infinitivo indica eliminação destrutiva; a formulação portuguesa aplica o mesmo propósito tanto às pessoas quanto ao que lhes é sagrado.
- source_word: τὰ ἅγια ἡμῶν
  choice: as nossas coisas sagradas
  rationale: Mantém o plural e a amplitude da expressão grega, que pode abranger objetos sagrados, recintos santos ou o complexo do santuário.
theological_decisions:
- issue: Expressão marcial masculina γίνεσθε εἰς υἱοὺς δυνατούς
  choice: homens valentes no texto, com a forma literal indicada em nota
  alternative: filhos poderosos; homens fortes
  rationale: A tradução principal comunica naturalmente o valor idiomático da expressão, enquanto a nota preserva sua forma literalmente masculina e a possível tensão semítica.
- issue: Referente de τὰ ἅγια ἡμῶν
  choice: as nossas coisas sagradas
  alternative: o nosso santuário; os nossos lugares santos
  rationale: O plural grego não identifica com certeza apenas o santuário; a opção ampla evita restringir o referente e a nota registra a interpretação específica possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural de uso brasileiro. «Cinjam-se» conserva deliberadamente a imagem marcial do original; as demais escolhas evitam arcaísmos e especificações interpretativas desnecessárias.
