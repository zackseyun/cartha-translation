base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/042.yaml
  text: And Judas and his brothers saw that the troubles had multiplied[a], and that the forces were encamped within their borders[b]; and they recognized the orders of the kingdom that it had commanded to be carried out against the people for destruction and annihilation.
translation:
  language: pt
  text: Judas e seus irmãos viram que as calamidades se haviam multiplicado e que as tropas estavam acampadas dentro de suas fronteiras; e tomaram conhecimento dos decretos do reino[a], que o reino havia ordenado executar contra o povo[b], para destruição e aniquilação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as ordens do poder real”; o grego diz literalmente “do reino”, e não “do rei”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ao povo”; o contexto mostra que os decretos eram dirigidos contra o povo, visando destruí-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κακά
  choice: as aflições
  rationale: O plural designa as adversidades e calamidades crescentes do contexto político-militar, não apenas o mal moral abstrato.
- source_word: αἱ δυνάμεις
  choice: as forças militares
  rationale: No contexto, o termo se refere inequivocamente a tropas armadas; a explicitação evita o sentido abstrato de “forças”.
- source_word: παρεμβάλλουσιν
  choice: estavam acampadas
  rationale: Expressa em português natural o estado presente das tropas no cenário narrativo.
- source_word: ἐν τοῖς ὁρίοις αὐτῶν
  choice: dentro de suas fronteiras
  rationale: Preserva tanto a ideia de limites territoriais quanto a presença ameaçadora das forças em seu território.
- source_word: ἐπέγνωσαν
  choice: tomaram conhecimento
  rationale: Comunica percepção ou conhecimento efetivo das determinações reais sem impor a ideia mais específica de reconhecimento prévio.
- source_word: τοὺς λόγους τῆς βασιλείας
  choice: as ordens do reino
  rationale: λόγοι são determinações oficiais neste contexto, enquanto βασιλεία é mantido como “reino”, sem ser substituído silenciosamente por “rei”.
- source_word: ἐνετείλατο ποιῆσαι
  choice: havia mandado executá-las
  rationale: Reproduz a combinação de ordenar e levar a efeito, com o pronome retomando naturalmente as ordens.
- source_word: τῷ λαῷ
  choice: contra o povo
  rationale: Embora o dativo seja literalmente “ao povo”, a finalidade destrutiva mostra que as determinações eram dirigidas de modo hostil contra ele.
- source_word: εἰς ἀπώλειαν καὶ συντέλειαν
  choice: para sua destruição e completo extermínio
  rationale: A dupla expressão intensifica a ideia de ruína total; “completo extermínio” comunica o caráter terminal de συντέλεια neste contexto.
theological_decisions:
- issue: Agente expresso por τῆς βασιλείας
  choice: do reino
  alternative: do rei / do poder real
  rationale: O texto grego emprega o substantivo abstrato βασιλεία. A tradução conserva essa forma e deixa uma nota esclarecer que se trata do governo ou poder real.
- issue: Força hostil do dativo τῷ λαῷ
  choice: contra o povo
  alternative: ao povo
  rationale: A finalidade explícita de destruição torna a relação adversa; a tradução contextual evita que “ao povo” pareça indicar benefício ou simples destinatário.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém “reino” para preservar a formulação grega e usa notas apenas onde a equivalência exige esclarecimento.
