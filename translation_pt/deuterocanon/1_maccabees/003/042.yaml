revisions:
- from: Judas e seus irmãos viram que as aflições haviam aumentado e que as forças militares estavam acampadas dentro de suas fronteiras. Também tomaram conhecimento das ordens do reino[a], que havia mandado executá-las contra o povo[b], para sua destruição e completo extermínio.
  to: Judas e seus irmãos viram que as calamidades se haviam multiplicado e que as tropas estavam acampadas dentro de suas fronteiras; e tomaram conhecimento dos decretos do reino[a], que o reino havia ordenado executar contra o povo[b], para destruição e aniquilação.
  rationale: A revisão aproxima «as calamidades se haviam multiplicado» do verbo grego, simplifica a construção relativa referente aos decretos e substitui «completo extermínio» por «destruição e aniquilação», preservando a dupla formulação enfática do texto-fonte sem acrescentar um modificador. As notas permanecem ancoradas nos dois pontos em que esclarecem alternativas relevantes.
