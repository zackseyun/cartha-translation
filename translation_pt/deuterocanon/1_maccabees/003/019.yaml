  text: For victory in war is not in a multitude of strength[a], but strength is from heaven.
translation:
  language: pt
  text: Pois a vitória na guerra não depende de grande força[a], mas a força vem do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a vitória na guerra não está em uma grande força, mas o vigor vem do céu”. O grego contrapõe a força humana acumulada à força que procede do âmbito divino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθει
  choice: quantidade
  rationale: O substantivo πλῆθος indica grande número, multidão ou abundância. Com ἐν, aponta para aquilo em que a vitória não se fundamenta; “quantidade” produz uma expressão natural em português sem restringir o sentido apenas ao número de soldados.
- source_word: δυνάμεως
  choice: forças
  rationale: δύναμις pode designar força, poder ou força militar. O plural idiomático “forças” preserva no contexto bélico a ideia de recursos humanos e militares acumulados, sem a reduzir explicitamente a tropas.
- source_word: νίκη πολέμου
  choice: vitória na guerra
  rationale: O genitivo πολέμου caracteriza a vitória como vitória de guerra. “Vitória na guerra” é claro e idiomático em português atual.
- source_word: ἀλλʼ ἢ
  choice: mas
  rationale: A expressão introduz o contraste entre a força humana acumulada e a força cuja origem é o céu. “Mas” comunica esse valor adversativo com naturalidade.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vem do céu
  rationale: A formulação conserva a referência explícita ao “céu”, provável circunlóquio judaico para a ajuda divina, sem substituí-la interpretativamente por “Deus”.
- source_word: ἰσχύς
  choice: a força
  rationale: ἰσχύς significa força, vigor ou poder. “A força” mantém o paralelismo semântico com δύναμις e o contraste entre recursos humanos e força de origem celeste.
theological_decisions:
- issue: Se ἐκ τοῦ οὐρανοῦ deve ser explicitado como referência indireta a Deus
  choice: do céu
  alternative: de Deus
  rationale: O grego diz literalmente “do céu”, expressão que no uso judaico pode indicar reverentemente a fonte divina. A tradução preserva a formulação e sua implicação, sem tornar explícito o que o texto deixa indireto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Não depende de” expressa naturalmente o valor de οὐκ ἐν, enquanto a repetição de “força(s)” preserva o contraste deliberado entre os dois termos gregos próximos.
