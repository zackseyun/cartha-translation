  text: And Judas learned of it[a], and he went out to meet him and struck him down and killed him; and many fell wounded, and the rest fled.
translation:
  language: pt
  text: Judas ficou sabendo disso e saiu ao encontro dele. Judas o feriu e o matou; muitos caíram feridos, e os demais fugiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: ficou sabendo disso
  rationale: O aoristo de γινώσκω indica aqui que Judas tomou conhecimento da situação; a expressão comunica esse valor ingressivo em português natural.
- source_word: ἐξῆλθεν εἰς συνάντησιν αὐτῷ
  choice: saiu ao encontro dele
  rationale: Preserva o sentido usual da expressão grega, enquanto o contexto militar deixa clara a ideia de confronto.
- source_word: ἐπάταξεν αὐτόν
  choice: o feriu
  rationale: Expressa o golpe violento indicado por πατάσσω sem antecipar o verbo seguinte, que declara explicitamente a morte.
- source_word: ἀπέκτεινεν
  choice: o matou
  rationale: Tradução direta e atual de ἀποκτείνω.
- source_word: ἔπεσον τραυματίαι πολλοί
  choice: muitos caíram feridos
  rationale: Mantém tanto a imagem de queda no campo de batalha quanto a referência específica a feridos, sem transformar implicitamente essas baixas em mortos.
- source_word: οἱ ἐπίλοιποι
  choice: os demais
  rationale: Forma clara e natural para o restante da força adversária.
- source_word: ἔφυγον
  choice: fugiram
  rationale: Verbo direto e apropriado para uma retirada em contexto militar.
