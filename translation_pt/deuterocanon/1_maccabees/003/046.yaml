base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/046.yaml
  text: And they assembled and came to Mizpah[a], opposite Jerusalem, because formerly Mizpah had been a place of prayer for Israel.
translation:
  language: pt
  text: Então eles se reuniram e foram a Mispá, defronte de Jerusalém[a], porque, antigamente, Mispá era um lugar de oração para Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em frente de Jerusalém” ou “diante de Jerusalém”. A expressão grega indica uma posição em frente de ou no lado oposto de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: se reuniram
  rationale: O aoristo passivo com sentido intransitivo descreve naturalmente a ação coletiva de reunir-se; esta forma é clara e corrente em português.
- source_word: ἦλθοσαν
  choice: foram
  rationale: Com εἰς e um destino, o verbo indica deslocamento até Mispá. Em narrativa portuguesa, “foram” é mais natural neste contexto do que “vieram”, que pressuporia o ponto de vista no destino.
- source_word: Μασσηφά
  choice: Mispá
  rationale: Forma tradicional e reconhecível em português para o topônimo bíblico ligado ao hebraico Miṣpāh.
- source_word: κατέναντι Ἰερουσαλήμ
  choice: diante de Jerusalém
  rationale: κατέναντι expressa posição diante, defronte ou em frente de algo. “Diante de Jerusalém” conserva a relação espacial sem reduzi-la a mera proximidade.
- source_word: τόπος προσευχῆς
  choice: um lugar de oração
  rationale: Tradução idiomática que mantém a associação do local com a oração sem introduzir uma instituição específica, como sinagoga ou santuário.
- source_word: τὸ πρότερον
  choice: antigamente
  rationale: A expressão adverbial aponta para um período anterior; “antigamente” é natural, claro e adequado ao registro narrativo.
- source_word: τῷ Ἰσραήλ
  choice: para Israel
  rationale: 'O dativo é entendido como referência ou benefício: o local servia como lugar de oração para o povo de Israel.'
theological_decisions:
- issue: Natureza de Mispá como local de culto
  choice: “um lugar de oração”
  alternative: “uma casa de oração” ou “um lugar de culto”
  rationale: O grego afirma apenas que Mispá era associada à oração de Israel. A tradução evita identificar o lugar como sinagoga, santuário ou local sacrificial.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Mispá” segue o uso bíblico português; a construção preserva a relação espacial potencialmente ambígua de κατέναντι.
