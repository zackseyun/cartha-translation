  text: And he enlarged the glory of his people[a]; he put on a breastplate like a giant, and strapped on his weapons of war; he set battles in order[c][b], shielding the camp with the sword.
translation:
  language: pt
  text: Ele aumentou a glória de seu povo[a]; vestiu uma couraça como um gigante[b] e cingiu-se de suas armas de guerra. Conduziu guerras[c], protegendo o acampamento com a espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “engrandecer a honra” ou “aumentou o renome de seu povo”. O verbo grego significa literalmente “tornar largo” e é usado aqui de modo figurado.'
    reason: lexical_alternative
  - marker: b
    text: “Gigante” traduz literalmente o grego; no contexto, a expressão também pode ser entendida no sentido mais geral de “guerreiro poderoso” ou “campeão”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “organizou batalhas”, “empreendeu guerras” ou “travou batalhas”. A expressão grega pode destacar a organização e condução das ações militares, e não apenas a participação no combate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλάτυνεν
  choice: aumentou
  rationale: O verbo significa literalmente “alargou”, mas aqui é empregado metaforicamente no sentido de aumentar ou engrandecer. “Aumentou” comunica o sentido com naturalidade em português.
- source_word: δόξαν
  choice: glória
  rationale: No contexto, δόξα indica honra pública ou renome conquistado para o povo. “Glória” preserva tanto o registro elevado quanto a ressonância bíblica do termo.
- source_word: τῷ λαῷ αὐτοῦ
  choice: de seu povo
  rationale: 'Embora o grego empregue o dativo, a construção portuguesa “aumentou a glória de seu povo” expressa naturalmente a relação: ele fez crescer a glória pertencente ao povo.'
- source_word: ἐνεδύσατο θώρακα
  choice: vestiu uma couraça
  rationale: θώραξ designa especificamente a proteção do torso. “Couraça” é preciso, corrente em contexto histórico-militar e mais fiel do que o termo geral “armadura”.
- source_word: ὡς γίγας
  choice: como um gigante
  rationale: γίγας significa literalmente “gigante” e funciona aqui como comparação heroica. A tradução mantém a imagem vívida sem substituí-la por uma interpretação.
- source_word: συνεζώσατο
  choice: cingiu-se com
  rationale: O verbo descreve o ato de prender ao corpo ou colocar equipamento por meio de um cinto. “Cingiu-se com” conserva a imagem marcial em registro digno e compreensível.
- source_word: τὰ σκεύη τὰ πολεμικὰ αὐτοῦ
  choice: suas armas de guerra
  rationale: σκεύη pode significar utensílios, equipamento ou apetrechos; qualificado por πολεμικά, refere-se ao equipamento bélico. “Armas de guerra” é claro e adequado ao contexto, embora “equipamento de guerra” também seja possível.
- source_word: πολέμους συνεστήσατο
  choice: conduziu guerras
  rationale: A expressão pode abranger organizar, empreender ou travar ações militares. “Conduziu guerras” preserva a ideia de direção e realização sem restringi-la apenas ao combate pessoal.
- source_word: σκεπάζων τὴν παρεμβολὴν
  choice: protegendo o acampamento
  rationale: σκεπάζω significa cobrir e, por extensão, resguardar ou proteger; παρεμβολή é o acampamento militar. A formulação explicita naturalmente a função protetora da ação.
- source_word: ἐν ῥομφαίᾳ
  choice: com a espada
  rationale: A preposição tem valor instrumental, e ῥομφαία designa uma espada, frequentemente grande. “Com a espada” é natural e não acrescenta ao texto o possessivo “sua”.
