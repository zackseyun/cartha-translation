lexical_decisions:
- source_word: ὡμοιώθη
  choice: foi como
  rationale: O passivo expressa comparação, não necessariamente transformação. “Foi como” é natural e preserva o caráter do símile.
- source_word: Λέοντι
  choice: um leão
  rationale: O dativo indica o termo da comparação; em português, “como um leão” é a formulação idiomática.
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: em seus feitos
  rationale: No contexto, ἔργα se refere às ações e proezas dele. “Feitos” mantém o tom heroico e permanece claro.
- source_word: σκύμνος
  choice: filhote de leão
  rationale: O termo designa um leão jovem. “Filhote de leão” distingue claramente esta imagem da referência anterior ao leão adulto.
- source_word: ἐρυγόμενος
  choice: que ruge
  rationale: O particípio descreve o som do jovem leão em contexto predatório; “ruge” é vívido, corrente e apropriado à imagem leonina.
- source_word: εἰς θήραν
  choice: em busca de presa
  rationale: A expressão indica a direção ou finalidade predatória. “Em busca de presa” comunica isso naturalmente sem restringir o sentido apenas à atividade da caça.
