lexical_decisions:
- source_word: παρέδωκεν
  choice: entregou-lhe
  rationale: O verbo indica transferência para o controle ou encargo de outra pessoa. “Entregou-lhe” conserva esse sentido concreto sem impor a ideia mais interpretativa de confiança.
- source_word: τὰς ἡμίσεις τῶν δυνάμεων
  choice: metade das forças
  rationale: A expressão designa metade do contingente ou poderio militar. “Forças” preserva a amplitude do termo grego e soa natural no contexto.
- source_word: τοὺς ἐλέφαντας
  choice: os elefantes
  rationale: O grego diz simplesmente “os elefantes”; o contexto militar torna sua função evidente, sem necessidade de acrescentar “de guerra”.
- source_word: ἐνετείλατο αὐτῷ
  choice: deu-lhe ordens
  rationale: A formulação expressa instruções autoritativas e se ajusta naturalmente ao contexto militar.
- source_word: περὶ πάντων ὧν ἐβούλετο
  choice: a respeito de tudo o que desejava
  rationale: Mantém a formulação comprimida e a ambiguidade do grego, que não explicita o objeto ou conteúdo concreto do desejo.
- source_word: τῶν κατοικούντων
  choice: todos os que moravam
  rationale: Reproduz o particípio substantivado em linguagem portuguesa corrente e digna.
- source_word: τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: na Judeia e em Jerusalém
  rationale: Em português, as preposições explicitam naturalmente o lugar de residência indicado pela construção grega.
