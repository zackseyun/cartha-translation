  text: And he handed over to him half of the forces and the elephants[a], and he gave him orders concerning everything he desired, and concerning all those dwelling in Judea and Jerusalem[b],
translation:
  language: pt
  text: E entregou-lhe[a] metade das forças e os elefantes, e deu-lhe ordens a respeito de tudo o que desejava[b] e de todos os que moravam na Judeia e em Jerusalém,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confiou-lhe”. O verbo grego pode enfatizar a transferência de algo para o encargo de outra pessoa.'
