  text: and he became afraid that he might not have enough[a], as once and twice before, for the expenses and the gifts that he had formerly given with a generous hand,
translation:
  language: pt
  text: E temeu não ter recursos suficientes, como em uma ou duas ocasiões anteriores,[a] para as despesas e os presentes que antes costumava dar com mão generosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «como uma vez e duas vezes». A expressão grega se refere a ocasiões anteriores e pode indicar repetição, sem necessariamente limitar-se a duas ocorrências exatas.
    reason: Preserva e esclarece a fórmula idiomática grega.
lexical_decisions:
- source_word: εὐλαβήθη
  choice: ficou com medo
  rationale: O aoristo de εὐλαβέομαι expressa aqui temor diante da possibilidade de faltarem recursos; a formulação também preserva o aspecto ingressivo.
- source_word: μὴ οὐκ ἔχῃ
  choice: de não ter recursos
  rationale: A construção apresenta o conteúdo do temor. “Recursos” explicita de modo natural a suficiência financeira implícita, definida em seguida pelas despesas e pelos presentes.
- source_word: ὡς ἅπαξ καὶ δὶς
  choice: como antes, uma e duas vezes
  rationale: Mantém a expressão incomum do grego e sua ideia de repetição em ocasiões anteriores, sem a reduzir necessariamente a duas ocorrências exatas.
- source_word: δαπάνας
  choice: despesas
  rationale: Equivalente financeiro direto e corrente, adequado ao contexto fiscal da corte.
- source_word: δόματα
  choice: presentes
  rationale: Termo amplo para dádivas ou concessões distribuídas pelo rei, sem impor sentido administrativo técnico.
- source_word: ἐδίδου
  choice: costumava dar
  rationale: Reproduz o valor habitual do imperfeito grego.
- source_word: ἔμπροσθεν
  choice: antes
  rationale: O advérbio tem sentido temporal e remete ao costume anterior do rei.
- source_word: δαψιλῇ χειρί
  choice: com mão generosa
  rationale: Preserva a metáfora grega de generosidade aberta e abundante em linguagem portuguesa natural.
