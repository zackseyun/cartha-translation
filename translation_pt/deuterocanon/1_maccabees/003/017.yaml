  yaml_path: translation/deuterocanon/1_maccabees/003/017.yaml
  text: But when they saw the camp coming to meet him[a], they said to Judas, “How can we, being so few, fight against so great a multitude? And we are exhausted[c][b], having gone without food today.”
translation:
  language: pt
  text: 'Quando, porém, viram o acampamento vindo ao encontro dele[a], disseram a Judas: “Como poderemos nós, sendo tão poucos, lutar contra uma multidão tão grande? E estamos exaustos[b], sem ter comido hoje[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vindo contra ele”. A expressão grega também pode ser entendida de modo mais neutro como “vindo ao encontro dele”, mas, neste contexto militar, indica um encontro hostil.
    reason: lexical_alternative
  - marker: b
    text: Ou “estamos desfalecidos”. O termo grego pode indicar uma condição de fraqueza ou desânimo; aqui está ligado à falta de alimento.
    reason: lexical_alternative
  - marker: c
    text: “Sem ter comido” também pode ser traduzido como “jejuando”, mas a expressão, por si só, não exige a ideia de um jejum religioso formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολήν
  choice: acampamento
  rationale: Em contexto militar, o termo pode designar o acampamento ou a força nele reunida. “Acampamento” conserva a imagem concreta do grego sem substituí-la diretamente por “exército”.
- source_word: ἐρχομένην εἰς συνάντησιν αὐτῷ
  choice: vindo ao encontro dele
  rationale: Reproduz de modo natural o movimento em direção a um encontro e preserva a relativa neutralidade formal da expressão, embora o contexto militar indique confronto hostil.
- source_word: ὀλιγοστοὶ ὄντες
  choice: sendo tão poucos
  rationale: Expressa a inferioridade numérica e mantém o contraste enfático com a grande multidão adversária.
- source_word: πολεμῆσαι
  choice: lutar
  rationale: Equivalente corrente e direto para a ação de combater neste contexto imediato.
- source_word: πρὸς πλῆθος τοσοῦτο
  choice: contra uma multidão tão grande
  rationale: Comunica a grande massa de tropas inimigas e conserva a força retórica da pergunta.
- source_word: ἐκλελύμεθα
  choice: estamos exaustos
  rationale: O perfeito expressa um estado presente de enfraquecimento ou esgotamento, aqui associado à falta de alimento.
- source_word: ἀσιτοῦντες
  choice: sem ter comido
  rationale: Indica privação de alimento sem pressupor que se trate de um jejum religioso formal.
- source_word: σήμερον
  choice: hoje
  rationale: É o equivalente temporal simples e natural em português moderno.
