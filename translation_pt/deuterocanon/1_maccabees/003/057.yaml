lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: No contexto militar, indica levantar acampamento e pôr-se em marcha; “partiu” é natural em português e mantém a concisão do aoristo.
- source_word: ἡ παρεμβολή
  choice: o acampamento
  rationale: παρεμβολή pode designar tanto o acampamento quanto, coletivamente, a força nele reunida. “O acampamento” preserva essa formulação coletiva sem explicitar além do grego.
- source_word: παρενεβάλοσαν
  choice: acamparam
  rationale: O verbo, em contexto militar e de viagem, significa estabelecer acampamento. “Acamparam” reproduz diretamente o sentido narrativo.
- source_word: κατὰ νότον
  choice: ao sul de
  rationale: A expressão indica a posição do acampamento em relação a Emaús, e não apenas uma direção de deslocamento.
- source_word: Ἀμμαούμ
  choice: Emaús
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do topônimo.
