  text: and to settle foreigners throughout all their territories[a], and to distribute their land by lot.
translation:
  language: pt
  text: e estabelecer filhos estrangeiros[a] em todos os territórios deles, e repartir por sorteio a terra deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais idiomática, “estrangeiros” ou “filhos de estrangeiros”. O grego diz literalmente “filhos estrangeiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίσαι
  choice: estabelecer
  rationale: O infinitivo aoristo de κατοικίζω expressa fazer com que pessoas passem a residir no território. “Estabelecer” preserva esse sentido causativo e soa natural em português.
- source_word: υἱοὺς ἀλλοτρίους
  choice: filhos estrangeiros
  rationale: A expressão grega diz literalmente “filhos estrangeiros”. Embora aqui designe estrangeiros instalados como habitantes, a tradução mantém no texto a forma masculina explícita da fonte e esclarece o sentido idiomático em nota.
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῶν
  choice: em todos os territórios deles
  rationale: ὅρια pode indicar limites, regiões ou territórios. Neste contexto, refere-se à extensão das terras pertencentes ao povo, não apenas às linhas de fronteira.
- source_word: κατακληρονομῆσαι
  choice: repartir por sorteio
  rationale: O verbo composto comunica a atribuição de terras como quinhões hereditários, associada ao sorteio. “Repartir por sorteio” torna explícita essa nuance sem reduzir o sentido a uma divisão genérica.
- source_word: τὴν γῆν αὐτῶν
  choice: a terra deles
  rationale: γῆ designa aqui a terra pertencente ao povo que seria despojado; a formulação é direta e natural.
theological_decisions:
- issue: Tradução da expressão masculina υἱοὺς ἀλλοτρίους
  choice: filhos estrangeiros
  alternative: estrangeiros; filhos de estrangeiros
  rationale: Não se trata de uma questão doutrinária central, mas a fonte emprega explicitamente “filhos”. A redação principal conserva essa forma, enquanto a nota apresenta o sentido contextual mais idiomático sem apagar a particularidade do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção coordenada que preserva a continuidade sintática do versículo. “Deles” evita a possível ambiguidade de “seus” quanto ao referente.
