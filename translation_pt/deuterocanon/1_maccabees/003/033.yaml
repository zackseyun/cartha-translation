  text: and to provide for Antiochus his son until he returns[a].
translation:
  language: pt
  text: e de sustentar Antíoco, seu filho, até ele voltar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “alimentar ou sustentar Antíoco, seu filho, até a volta dele”.'
    reason: Registra a amplitude de τρέφειν e a forma nominal mais literal da expressão temporal grega.
lexical_decisions:
- source_word: τρέφειν
  choice: sustentar
  rationale: O infinitivo pode significar alimentar, criar, manter ou dar sustento. Neste contexto político e familiar, “sustentar” abrange a responsabilidade de prover e cuidar de Antíoco durante a ausência do pai, sem limitar o sentido à alimentação.
- source_word: Ἀντίοχον
  choice: Antíoco
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego Ἀντίοχος.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seu filho
  rationale: Expressa de modo natural a relação filial explicitamente indicada no grego; a aposição após o nome preserva a estrutura e a identificação.
- source_word: ἕως τοῦ ἐπιστρέψαι αὐτόν
  choice: até ele voltar
  rationale: A construção com ἕως e infinitivo articular estabelece o limite temporal. A oração finita é natural em português, enquanto o pronome “ele” preserva a referência pronominal do grego, esclarecida pelo contexto mais amplo.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla. “Sustentar” foi preferido a “alimentar” por comunicar a responsabilidade geral de manutenção e cuidado no contexto da corte. A formulação concisa mantém o caráter de continuação sintática do versículo anterior.
