lexical_decisions:
- source_word: ἐσάλπισαν
  choice: tocaram
  rationale: O verbo indica fazer soar uma trombeta. Em português, “tocar as trombetas” é natural e mantém explícita a ação instrumental.
- source_word: ταῖς σάλπιγξιν
  choice: as trombetas
  rationale: 'Embora o dativo grego tenha valor instrumental, a construção idiomática portuguesa com “tocar” emprega objeto direto: “tocar as trombetas”.'
- source_word: ἐβόησαν
  choice: gritaram
  rationale: O verbo descreve um clamor ou grito forte. “Gritaram” é claro, atual e não especifica indevidamente o conteúdo do clamor.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: A expressão idiomática conserva a referência concreta à voz e soa natural em português moderno.
