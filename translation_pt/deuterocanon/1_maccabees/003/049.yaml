base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/049.yaml
  text: And they brought the priestly garments[a], and the firstfruits and the tithes; and they brought forward the Nazirites, who had completed their days.
translation:
  language: pt
  text: E trouxeram as vestes sacerdotais, as primícias e os dízimos; e fizeram comparecer os nazireus que haviam completado os seus dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, haviam cumprido o período prescrito do voto nazireu. O grego diz literalmente “haviam completado os dias”.
    reason: Esclarece o sentido idiomático sem acrescentar ao texto principal palavras que não estão expressas no grego.
lexical_decisions:
- source_word: ἤνεγκαν
  choice: trouxeram
  rationale: O aoristo de φέρω indica aqui levar objetos até o local da reunião; “trouxeram” é direto e natural.
- source_word: τὰ ἱμάτια τῆς ἱερωσύνης
  choice: as vestes sacerdotais
  rationale: Expressa de modo claro e digno as roupas próprias do serviço sacerdotal, sem recorrer a terminologia excessivamente eclesiástica.
- source_word: τὰ πρωτογεννήματα
  choice: as primícias
  rationale: No contexto cultual, ao lado dos dízimos, designa as primeiras porções da produção consagradas a Deus; “primícias” é o termo bíblico tradicional e compreensível.
- source_word: τὰς δεκάτας
  choice: os dízimos
  rationale: É a tradução corrente e precisa para as décimas partes entregues no contexto religioso.
- source_word: ἤγειραν
  choice: fizeram comparecer
  rationale: Embora o verbo signifique literalmente “levantaram”, neste contexto com pessoas indica fazê-las pôr-se diante da assembleia ou apresentar-se; “fizeram comparecer” evita sugerir ressurreição ou simples despertar.
- source_word: τοὺς Ναζιραίους
  choice: os nazireus
  rationale: Preserva o termo técnico para as pessoas consagradas mediante o voto nazireu, em vez de diluí-lo numa descrição genérica.
- source_word: οἳ ἐπλήρωσαν τὰς ἡμέρας
  choice: que haviam completado os seus dias
  rationale: Mantém a formulação idiomática do grego e sua referência ao término do período prescrito do voto; a nota esclarece o sentido sem inseri-lo indevidamente no texto.
theological_decisions:
- issue: Tradução do termo técnico Ναζιραίους
  choice: nazireus
  alternative: pessoas sob voto de nazireado
  rationale: Trata-se de uma categoria específica de consagração baseada na Torá. A transliteração preserva a instituição histórico-religiosa sem impor uma paráfrase ao texto.
- issue: Sentido de completar “os dias”
  choice: manter o idioma no texto e explicar na nota
  alternative: que haviam cumprido o período do seu voto
  rationale: O grego não menciona explicitamente o voto nesta oração, embora o contexto nazireu torne esse sentido provável. A redação conserva a forma e a tensão do original, enquanto a nota oferece a explicação contextual.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é digno e direto; conserva os termos religiosos estabelecidos “primícias”, “dízimos” e “nazireus”. O marcador foi colocado após a expressão a que a nota efetivamente se refere.
