  text: And he embittered many kings[a], and he made Jacob glad by his deeds, and his remembrance is for blessing forever.
translation:
  language: pt
  text: E ele encheu de amargura muitos reis, alegrou Jacó por seus feitos, e sua memória é uma bênção para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua memória é para bênção para sempre”. O grego emprega literalmente uma fórmula de bênção: “sua memória é para bênção para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίκρανεν
  choice: encheu de amargura
  rationale: Preserva a metáfora de tornar amargo e expressa com naturalidade, em português, o efeito causado por Judas nos reis inimigos.
- source_word: βασιλεῖς πολλούς
  choice: muitos reis
  rationale: Traduz diretamente o substantivo grego, sem ampliá-lo para o sentido menos preciso de governantes.
- source_word: ηὔφρανεν
  choice: alegrou
  rationale: Mantém de forma concisa e natural o sentido causativo de produzir alegria.
- source_word: τὸν Ἰακώβ
  choice: Jacó
  rationale: Conserva o nome ancestral empregado coletivamente para o povo, em vez de substituí-lo pela interpretação Israel.
- source_word: ἐν τοῖς ἔργοις αὐτοῦ
  choice: com seus feitos
  rationale: Expressa de modo idiomático o meio pelo qual Jacó foi alegrado, mantendo o sentido de ações realizadas.
- source_word: τὸ μνημόσυνον αὐτοῦ
  choice: sua memória
  rationale: Neste contexto, traduz naturalmente a lembrança duradoura da pessoa; memorial seria possível, mas menos fluente.
- source_word: εἰς εὐλογίαν
  choice: será uma bênção
  rationale: Comunica em português corrente a fórmula nominal grega de que a memória é para bênção, sem apagar seu valor positivo e duradouro.
- source_word: ἕως τοῦ αἰῶνος
  choice: para sempre
  rationale: É a equivalência portuguesa mais natural para a expressão idiomática de duração perpétua.
theological_decisions:
- issue: Sentido coletivo de Jacó
  choice: Manter Jacó como nome pactual e coletivo do povo.
  alternative: Israel
  rationale: A fonte grega traz o nome ancestral Jacó. Preservá-lo mantém o registro bíblico e evita substituir o texto por uma explicação interpretativa.
- issue: Fórmula de bênção na oração final
  choice: Traduzir de modo natural como “sua memória será uma bênção para sempre”.
  alternative: “sua memória é para bênção para sempre” ou “sua memória será bendita para sempre”
  rationale: A redação escolhida conserva o conteúdo da fórmula nominal εἰς εὐλογίαν, mas evita uma construção pouco idiomática em português. A nota registra tanto a alternativa passiva quanto a forma literal.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblica moderada. “Encheu de amargura” preserva a imagem grega sem soar artificial; “Jacó” mantém o uso coletivo da fonte.
