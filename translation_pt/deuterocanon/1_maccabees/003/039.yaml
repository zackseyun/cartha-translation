base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/039.yaml
  text: And he sent with them forty thousand men and seven thousand cavalry[a], to come into the land of Judah and destroy it[b], according to the word of the king.
translation:
  language: pt
  text: E enviou com eles quarenta mil homens e sete mil cavaleiros[a], para entrarem na terra de Judá e destruí-la, conforme a palavra do rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sete mil cavalos”; no contexto militar, o grego provavelmente usa “cavalo” em sentido metonímico para as tropas montadas.
    reason: lexical_alternative
  - marker: b
    text: Ou “conforme a ordem do rei”. O grego diz “conforme a palavra do rei”, e “palavra” tem aqui a força de uma ordem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo indica o envio das tropas junto com os líderes mencionados anteriormente. “Enviou” é direto, natural e preserva o sentido do verbo grego.
- source_word: μετʼ αὐτῶν
  choice: com eles
  rationale: A expressão indica que as tropas acompanhavam os líderes mencionados no contexto anterior.
- source_word: τεσσεράκοντα χιλιάδας ἀνδρῶν
  choice: quarenta mil homens
  rationale: Traduz literalmente ἀνδρῶν sem explicitar “soldados”, embora o contexto militar torne essa função evidente.
- source_word: ἑπτακισχιλίον ἵππον
  choice: sete mil cavaleiros
  rationale: Embora ἵππος signifique literalmente “cavalo”, aqui o singular coletivo é empregado metonimicamente para tropas montadas. “Cavaleiros” permite contar os integrantes da força de modo natural em português.
- source_word: τοῦ ἐλθεῖν
  choice: para entrarem
  rationale: O infinitivo articular expressa finalidade. No contexto de deslocamento para um território, “entrarem” comunica naturalmente a chegada à terra de Judá sem depender do ponto de vista de “ir” ou “vir”.
- source_word: εἰς γῆν Ἰούδα
  choice: na terra de Judá
  rationale: Preserva a designação territorial do grego, em vez de substituí-la pelo nome regional mais interpretativo “Judeia”.
- source_word: καταφθεῖραι αὐτήν
  choice: destruí-la
  rationale: O verbo exprime destruição intensa, e o pronome feminino retoma “terra”. “Destruí-la” mantém a força e a amplitude do grego sem especificar o modo da devastação.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: conforme a palavra do rei
  rationale: Mantém λόγος como “palavra”, preservando a expressão grega, ao mesmo tempo que o contexto deixa claro que se trata de uma ordem real.
