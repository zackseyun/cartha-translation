base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/059.yaml
  text: For it is better for us to die in battle than to look on at the evils of our nation and of the holy things[a].
translation:
  language: pt
  text: Pois é melhor morrermos em batalha do que assistirmos aos males que atingem nossa nação e as coisas santas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o santuário» ou «os lugares santos»; o grego diz literalmente «as coisas santas».'
    reason: Alternativa lexical que registra possíveis referentes contextuais do neutro plural grego sem eliminar sua amplitude.
lexical_decisions:
- source_word: κρεῖσσον
  choice: é melhor
  rationale: Expressa de modo natural e direto a preferência comparativa e moral do grego.
- source_word: ἀποθανεῖν
  choice: morrermos
  rationale: Equivalente direto do infinitivo grego, ajustado idiomaticamente à construção portuguesa com sujeito explícito na primeira pessoa do plural.
- source_word: ἐν πολέμῳ
  choice: em batalha
  rationale: No contexto militar imediato, comunica a morte em combate com mais precisão contextual do que a expressão mais ampla «na guerra».
- source_word: ἐφιδεῖν ἐπὶ
  choice: ficarmos olhando
  rationale: Preserva a ideia de assistir aos acontecimentos como espectador, sem reduzi-la ao simples ato de ver.
- source_word: τὰ κακά
  choice: os males que sobrevêm
  rationale: «Males» mantém a amplitude moral e desastrosa de κακά; «que sobrevêm» torna natural em português a relação genitiva com aqueles que são atingidos, sem restringir os males a calamidades ou delitos.
- source_word: τοῦ ἔθνους ἡμῶν
  choice: à nossa nação
  rationale: Preserva o sentido coletivo e nacional de ἔθνος no contexto do povo judeu.
- source_word: τῶν ἁγίων
  choice: às coisas santas
  rationale: Mantém o neutro plural do grego e evita identificar de maneira indevidamente estreita o referente com o santuário ou os lugares santos.
theological_decisions:
- issue: Referente de τῶν ἁγίων
  choice: as coisas santas
  alternative: o santuário; os lugares santos
  rationale: A forma grega é neutra plural e designa literalmente realidades santas. A tradução ampla preserva a ambiguidade entre objetos sagrados, lugares santos e o complexo do santuário, sem interpretá-la como referência aos santos.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção «ficarmos olhando» conserva a força de permanecer como espectador diante dos males; a nota mantém aberta a referência exata das «coisas santas».
