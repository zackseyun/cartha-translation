  text: And he himself will crush them before us; but as for you, do not fear them.
translation:
  language: pt
  text: E ele mesmo os esmagará diante de nós; vocês, porém, não tenham medo deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: Ele mesmo
  rationale: Preserva a ênfase do pronome grego no sujeito que realizará a ação, sem acrescentar ao versículo uma identificação explícita que o original deixa ao contexto.
- source_word: συντρίψει
  choice: os esmagará
  rationale: O futuro de συντρίβω comunica quebra ou destruição violenta. “Esmagará” mantém a força da imagem militar e soa natural em português.
- source_word: πρὸ προσώπου ἡμῶν
  choice: diante de nós
  rationale: Reproduz com naturalidade o sentido espacial do idioma grego, literalmente relacionado à face ou presença, sem impor a leitura mais específica de expulsão “para longe de nós”.
- source_word: μὴ φοβηθῆτε ἀπʼ αὐτῶν
  choice: não tenham medo deles
  rationale: Expressa de modo corrente e direto a proibição grega. A formulação é mais natural no português moderno do que “não os temam”, sem perda relevante de sentido.
- source_word: ὑμεῖς δὲ
  choice: vocês, porém
  rationale: “Vocês” torna explícito o pronome enfático plural, enquanto “porém” preserva o contraste introduzido por δέ entre a ação decisiva do sujeito e a resposta esperada dos ouvintes.
theological_decisions:
- issue: Identidade e ênfase do sujeito αὐτός
  choice: Manter a forma enfática “Ele mesmo”, deixando que o contexto identifique o referente como Deus.
  alternative: Explicitar “O próprio Deus” ou reduzir a ênfase para “Ele”.
  rationale: O contexto aponta para Deus como agente da vitória, mas o texto do versículo emprega apenas o pronome enfático. A tradução preserva tanto a ênfase teológica na ação divina quanto a forma referencial do original, sem explicitação interpretativa indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e mantém o paralelismo contrastivo e a concisão do grego.
