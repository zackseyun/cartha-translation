base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/024.yaml
  text: And they pursued them down the descent of Beth-horon as far as the plain[a], and about eight hundred of them fell; but the rest fled into the land of the Philistines.
translation:
  language: pt
  text: E eles os perseguiram pela descida de Bete-Horom até a planície; cerca de oitocentos deles caíram[a], mas os restantes fugiram para a terra dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “caíram dentre eles cerca de oitocentos homens”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωκον
  choice: perseguiram
  rationale: O imperfeito grego descreve uma perseguição em curso dentro da narrativa; o pretérito perfeito é a forma mais natural em português para fazer a sequência avançar.
- source_word: ἐν τῇ καταβάσει
  choice: pela descida
  rationale: κατάβασις designa uma descida ou caminho descendente; “pela descida” preserva tanto o relevo quanto o trajeto da perseguição.
- source_word: Βαιθωρὼν
  choice: Bete-Horom
  rationale: Forma portuguesa clara e tradicional do topônimo semítico.
- source_word: ἕως τοῦ πεδίου
  choice: até a planície
  rationale: πέδιον indica terreno plano, em contraste geográfico com a descida, e ἕως marca o limite alcançado.
- source_word: ἔπεσον ἀπʼ αὐτῶν εἰς ἄνδρας ὀκτακοσίους
  choice: cerca de oitocentos deles caíram
  rationale: A construção indica baixas entre os perseguidos; εἰς com o numeral pode expressar uma quantidade aproximada. “Caíram” conserva a expressão do grego sem explicitar além do texto a maneira da morte.
- source_word: οἱ δὲ λοιποὶ
  choice: mas os restantes
  rationale: δέ introduz contraste entre os que caíram e os que conseguiram fugir.
- source_word: ἔφυγον εἰς γῆν Φυλιστιείμ
  choice: fugiram para a terra dos filisteus
  rationale: Tradução transparente da expressão grega, mais próxima do original do que simplesmente “Filístia”.
