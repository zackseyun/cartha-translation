  text: And he saw that the silver had run out from the treasuries[a], and that the taxes of the country were few because of the division and the blow that he had brought upon the land[b], by removing the customs that had existed from former days.
translation:
  language: pt
  text: Ele viu que a prata havia se esgotado nos tesouros e que as receitas do país eram escassas, por causa da discórdia e da calamidade que ele havia causado à terra[a] ao abolir os costumes estabelecidos desde tempos antigos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da divisão e do golpe que ele havia infligido à terra”. Os termos gregos também podem ter sentidos políticos e punitivos mais marcados.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as normas estabelecidas” ou “as leis tradicionais”. A construção grega também pode ser entendida como “a fim de abolir”, em vez de “ao abolir”.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ἐξέλιπεν τὸ ἀργύριον ἀπὸ τῶν θησαυρῶν
  choice: a prata dos tesouros havia se esgotado
  rationale: Mantém a imagem concreta da prata e o plural de «tesouros», enquanto «havia se esgotado» expressa de modo natural a falta de recursos.
- source_word: οἱ φόροι τῆς χώρας ὀλίγοι
  choice: as receitas do país eram poucas
  rationale: φόροι pode designar impostos, tributos ou a receita fiscal resultante. «Receitas» convém ao contexto financeiro e evita sugerir apenas o número de impostos.
- source_word: χάριν τῆς διχοστασίας
  choice: por causa da discórdia
  rationale: διχοστασία indica divisão ou dissensão; «discórdia» comunica com naturalidade o conflito interno sem especificar além do grego.
- source_word: πληγῆς ἧς κατεσκεύασεν ἐπὶ τὴν γῆν
  choice: da calamidade que ele havia causado à terra
  rationale: πληγή pode ser golpe, flagelo ou calamidade. Neste contexto, «calamidade» expressa o dano sofrido pela terra, preservando-se em nota a alternativa mais literal.
- source_word: τοῦ ἆραι
  choice: ao abolir
  rationale: O infinitivo articular pode indicar meio, resultado ou propósito. «Ao abolir» mantém uma ligação sintática concisa sem explicitar demais essa relação.
- source_word: τὰ νόμιμα
  choice: os costumes estabelecidos
  rationale: νόμιμα abrange normas, ordenanças e costumes reconhecidos. A formulação preserva sua dimensão tradicional e normativa sem restringi-la apenas a leis formais.
- source_word: ἀφʼ ἡμερῶν τῶν πρώτων
  choice: desde os primeiros tempos
  rationale: Reproduz o caráter retrospectivo da expressão grega em português corrente e digno.
