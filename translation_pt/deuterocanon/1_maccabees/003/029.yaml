  naturalness: A redação é clara e de registro adequado, mas «a prata havia se esgotado nos tesouros» e «as receitas do país eram escassas» soam mais naturais em português moderno. «Desde tempos antigos» também comunica melhor o valor retrospectivo da expressão grega do que «desde os primeiros tempos».
  terminology: «Discórdia», «calamidade» e «costumes estabelecidos» são escolhas defensáveis para διχοστασία, πληγή e τὰ νόμιμα. «Receitas» preserva adequadamente a amplitude fiscal de φόροι. A nota mantém alternativas sem impor uma interpretação específica do infinitivo.
