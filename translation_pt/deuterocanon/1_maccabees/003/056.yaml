base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/056.yaml
  text: And he said that those building a house[a], and those betrothed to women, and those planting vineyards, and the fearful, should each return to his house[b], according to the law.
translation:
  language: pt
  text: E disse que os que construíam uma casa, os que estavam noivos, os que plantavam vinhas e os que tinham medo[b] voltassem, cada um para sua casa, conforme a Lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «conforme a Lei» provavelmente alude às dispensas do serviço de guerra em Deuteronômio 20:5–8.
    reason: cross_reference
  - marker: b
    text: 'Ou: «os tímidos» ou «os covardes», em vez de «os que tinham medo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομοῦσιν οἰκίαν
  choice: os que estavam construindo uma casa
  rationale: Reproduz o particípio presente e seu objeto singular em português natural, indicando uma atividade em andamento.
- source_word: μνηστευομένοις γυναῖκας
  choice: os que estavam noivos
  rationale: No contexto distributivo, refere-se a homens comprometidos em casamento. A formulação portuguesa evita a expressão pouco natural «noivos de mulheres» sem sugerir múltiplas noivas.
- source_word: φυτεύουσιν ἀμπελῶνας
  choice: os que estavam plantando vinhas
  rationale: Mantém o paralelismo participial; «vinhas» é uma tradução corrente de ἀμπελῶνας no contexto agrícola e legal.
- source_word: δειλοῖς
  choice: os que tinham medo
  rationale: Preserva a referência ao temor diante da batalha sem impor a censura moral mais forte de «covardes».
- source_word: ἀποστρέφειν ἕκαστον εἰς τὸν οἶκον αὐτοῦ
  choice: voltassem, cada um para sua casa
  rationale: O infinitivo dependente de εἶπεν tem força de ordem indireta. «Voltassem» é natural em português, e «cada um» conserva o sentido distributivo.
- source_word: κατὰ τὸν νόμον
  choice: conforme a Lei
  rationale: Traduz diretamente a expressão e mantém implícita a provável alusão à legislação de guerra em Deuteronômio.
theological_decisions:
- issue: Explicitar ou não a referência de «a Lei»
  choice: Manter «conforme a Lei» no texto e explicar a provável alusão em nota
  alternative: conforme a Lei de Moisés
  rationale: O grego diz apenas τὸν νόμον. Acrescentar «de Moisés» tornaria explícito algo que o versículo deixa implícito.
- issue: Determinar se δειλοῖς condena covardia moral
  choice: os que tinham medo
  alternative: os covardes
  rationale: A opção escolhida mantém a ambiguidade entre estar com medo e ser moralmente covarde, em consonância com o contexto legal de Deuteronômio 20:8.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para a sintaxe portuguesa, sem eliminar o paralelismo das quatro categorias. Os marcadores foram colocados após a frase a que se referem, pois ambas as notas dizem respeito a expressões no versículo.
