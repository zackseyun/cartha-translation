  yaml_path: translation/deuterocanon/1_maccabees/003/014.yaml
  text: And he said[a], “I will make a name for myself, and I will be glorified in the kingdom[c][b], and I will fight Judah and those with him who are disregarding the king’s word.”
translation:
  language: pt
  text: 'E ele disse: “Conquistarei renome e serei glorificado[a] no reino[b]. Lutarei contra Judas e contra os que estão com ele, os quais desprezam a palavra do rei[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serei honrado” ou “alcançarei glória”.'
    reason: Alternativas lexicais para δοξασθήσομαι.
  - marker: b
    text: 'Ou: “no domínio real”.'
    reason: βασιλεία pode designar tanto o reino quanto o domínio ou esfera de governo.
  - marker: c
    text: 'Ou: “a ordem do rei” ou “o decreto do rei”.'
    reason: Neste contexto, λόγος pode referir-se à ordem ou determinação do rei.
lexical_decisions:
- source_word: Ποιήσω ἐμαυτῷ ὄνομα
  choice: Conquistarei renome
  rationale: A expressão grega significa adquirir fama ou reputação. “Conquistarei renome” comunica naturalmente em português o impulso de autoexaltação de ἐμαυτῷ, sem reproduzir de modo artificial o idioma “farei para mim um nome”.
- source_word: δοξασθήσομαι
  choice: serei glorificado
  rationale: Preserva a forma passiva futura e o campo semântico de glória e honra, sem especificar quem lhe dará essa glória.
- source_word: ἐν τῇ βασιλείᾳ
  choice: no reino
  rationale: É a correspondência direta e contida de βασιλεία. O texto grego não acrescenta explicitamente “do rei”.
- source_word: πολεμήσω
  choice: Lutarei contra
  rationale: Expressa de forma concisa e natural a hostilidade militar indicada pelo verbo grego, sem ampliar desnecessariamente para “travarei guerra”.
- source_word: τὸν Ἰούδαν
  choice: Judas
  rationale: O acusativo grego designa Judas Macabeu. “Judas” é a forma pessoal tradicional e imediatamente reconhecível em português.
- source_word: τοὺς σὺν αὐτῷ
  choice: os que estão com ele
  rationale: Mantém a referência aberta aos que acompanham Judas, sem defini-los mais especificamente como soldados, aliados ou companheiros.
- source_word: τοὺς ἐξουθενοῦντας
  choice: os quais desprezam
  rationale: ἐξουθενέω pode indicar tratar algo como sem valor ou com desprezo. “Desprezam” conserva essa força melhor que o mais brando “ignoram”.
- source_word: τὸν λόγον τοῦ βασιλέως
  choice: a palavra do rei
  rationale: Mantém o valor lexical básico de λόγος e continua inteligível no contexto, enquanto a nota registra os sentidos contextuais de ordem ou decreto.
theological_decisions:
- issue: Agente implícito em δοξασθήσομαι
  choice: Preservar a voz passiva em “serei glorificado” sem identificar o agente.
  alternative: “Alcançarei glória” ou “serei honrado”.
  rationale: O grego não declara quem concederá glória ao falante; explicitar o agente ou converter plenamente a frase em ação reflexiva eliminaria essa abertura.
- issue: Identificação de Ἰούδαν
  choice: Traduzir como o nome pessoal “Judas”, referente a Judas Macabeu.
  alternative: “Judá”.
  rationale: O contexto identifica o líder macabeu, e “Judas” é a forma consagrada em português para esse personagem; a decisão é onomástica, não doutrinária.
- issue: Sentido de λόγος na expressão real
  choice: Manter “palavra do rei” no texto principal.
  alternative: “ordem do rei” ou “decreto do rei”.
  rationale: No contexto, λόγος provavelmente se refere a uma ordem ou determinação régia, mas a formulação literal preserva a amplitude do substantivo grego e a nota apresenta as leituras contextuais.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A tradução evita o decalque pouco natural “farei para mim um nome”, mas conserva a autoexaltação do discurso; mantém a passiva “serei glorificado” e a força depreciativa de “desprezam”.
