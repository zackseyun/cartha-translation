  yaml_path: translation/deuterocanon/1_maccabees/003/051.yaml
  text: And your holy things have been trampled down and profaned[a], and your priests are in mourning and humiliation.
translation:
  language: pt
  text: E as tuas coisas santas foram pisoteadas e profanadas[a], e os teus sacerdotes estão de luto e em humilhação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o teu santuário” ou “o teu lugar santo”. O grego está no plural; literalmente, “as tuas coisas santas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἅγιά σου
  choice: as tuas coisas santas
  rationale: Preserva o plural neutro do grego e sua referência abrangente às coisas e aos espaços consagrados a Deus, sem restringi-lo a uma única estrutura do templo.
- source_word: κατεπεπάτηται
  choice: foram pisoteadas
  rationale: Conserva a imagem concreta e violenta de calcar aos pés; o resultado da ação perfeita passiva permanece evidente no contexto.
- source_word: βεβήλωται
  choice: profanadas
  rationale: Expressa a transformação ofensiva do que é santo em algo tratado como comum, mantendo o contraste lexical com 'santas'.
- source_word: οἱ ἱερεῖς σου
  choice: os teus sacerdotes
  rationale: Equivalente corrente e preciso para os ministros do culto no templo.
- source_word: ἐν πένθει
  choice: de luto
  rationale: Forma idiomática em português para o estado de pesar e lamentação indicado pela expressão preposicional grega.
- source_word: ταπεινώσει
  choice: em humilhação
  rationale: Preserva a ideia de rebaixamento, vergonha pública e condição oprimida, sem reduzi-la apenas a uma emoção interior.
theological_decisions:
- issue: Âmbito de τὰ ἅγιά σου
  choice: Referência ampla às coisas e aos espaços sagrados pertencentes a Deus, mantida no plural.
  alternative: “o teu santuário” ou “o teu lugar santo”
  rationale: O plural grego é mais abrangente que uma referência arquitetônica singular. A tradução evita impor essa delimitação, mas registra as leituras contextuais possíveis em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” coerente com a oração dirigida a Deus. A formulação preserva o paralelismo e a tensão entre santidade, profanação, luto e humilhação.
