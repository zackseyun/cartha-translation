translation:
  language: pt
  text: E o temor de Judas e de seus irmãos começou a se espalhar[a], e a ruína se abatia sobre as nações ao redor deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «começou o temor de Judas e de seus irmãos»; isto é, o temor que eles inspiravam começou a se espalhar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «a ruína se abatia sobre as nações vizinhas». O imperfeito grego sugere uma ação em curso ou repetida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: começou a se espalhar
  rationale: O verbo marca o início de um estado ou processo. Como o sujeito é «o temor de Judas e de seus irmãos», «começou a se espalhar» expressa naturalmente em português o surgimento desse temor entre outros, sem ocultar em nota a formulação mais literal.
- source_word: ὁ φόβος
  choice: o temor
  rationale: «Temor» conserva a amplitude de φόβος e é mais digno e menos intenso que «terror», embora no contexto indique receio ou pavor causado pela fama de Judas e de seus irmãos.
- source_word: Ἰούδα καὶ τῶν ἀδελφῶν αὐτοῦ
  choice: de Judas e de seus irmãos
  rationale: Mantém a construção genitiva e sua associação com φόβος. No contexto, trata-se provavelmente do temor que eles inspiravam, mas a tradução não explicita essa relação além do necessário.
- source_word: ἡ πτῶσις
  choice: a ruína
  rationale: πτῶσις pode designar queda, colapso ou ruína. «Ruína» se ajusta ao contexto militar e político e forma uma expressão portuguesa natural com «abater-se sobre».
- source_word: ἐπίπτεν
  choice: continuava a se abater
  rationale: O imperfeito grego apresenta uma ação em curso ou repetida. «Continuava a se abater» preserva esse aspecto e evita a expressão pouco natural «a ruína estava caindo».
- source_word: ἐπὶ τὰ ἔθνη
  choice: sobre as nações
  rationale: ἔθνη refere-se aqui aos povos ou nações não judeus da região. «Nações» é amplo e não acrescenta uma identificação teológica indevida.
- source_word: τὰ κύκλῳ αὐτῶν
  choice: ao redor deles
  rationale: Reproduz de forma concisa a referência geográfica aos povos vizinhos de Judas e seus irmãos.
