  text: And he was renowned to the ends of the earth[b][a], and he gathered those who were perishing.
translation:
  language: pt
  text: E ele se tornou conhecido até os confins da terra[a] e reuniu os que estavam perecendo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seu nome tornou-se conhecido até os confins da terra». O grego diz literalmente «foi nomeado» ou «foi chamado», expressão que aqui pode indicar fama ou reputação amplamente difundida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «os que estavam sendo destruídos»; também pode significar «os arruinados» ou «os que corriam perigo de morrer».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠνομάσθη
  choice: se tornou conhecido
  rationale: O aoristo passivo de ὀνομάζω significa literalmente «foi nomeado» ou «foi chamado», mas, neste contexto, indica que seu nome ou sua reputação se difundiu. «Se tornou conhecido» expressa o idioma com naturalidade sem intensificá-lo para «ficou famoso».
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: até os confins da terra
  rationale: Expressão idiomática que indica os lugares mais distantes. A formulação preserva a amplitude do grego e é corrente no registro bíblico português.
- source_word: συνήγαγεν
  choice: reuniu
  rationale: Equivalente direto e natural do aoristo de συνάγω, com o sentido de juntar ou congregar pessoas.
- source_word: ἀπολλυμένους
  choice: os que estavam perecendo
  rationale: O particípio presente médio/passivo descreve pessoas em processo de ruína, destruição ou grave perigo. A escolha preserva esse aspecto contínuo e evita transformar a expressão em uma categoria teológica fixa.
theological_decisions:
- issue: Possível leitura teológica de ἀπολλυμένους
  choice: os que estavam perecendo
  alternative: os perdidos
  rationale: No contexto de conflito e aflição, a expressão provavelmente se refere a pessoas ameaçadas de ruína ou destruição. «Os perdidos» poderia sugerir uma categoria espiritual não exigida pelo texto.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação simples acompanha a estrutura grega; os marcadores foram colocados junto às expressões que explicam.
