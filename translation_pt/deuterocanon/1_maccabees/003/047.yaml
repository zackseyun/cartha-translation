lexical_decisions:
- source_word: ἐνήστευσαν
  choice: jejuaram
  rationale: Equivalente direto e natural do verbo grego, preservando a ação religiosa coletiva.
- source_word: περιεβάλλοντο σάκκους
  choice: vestiram-se de pano de saco
  rationale: Expressa idiomaticamente o ato de cobrir-se com tecido áspero como sinal de luto ou penitência; o plural grego é distributivo.
- source_word: σποδὸν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: puseram cinzas sobre a cabeça
  rationale: Mantém distinta esta ação da de vestir pano de saco e preserva a imagem concreta do grego; o singular coletivo 'a cabeça' é natural em português.
- source_word: διέρρηξαν τὰ ἱμάτια αὐτῶν
  choice: rasgaram as suas roupas
  rationale: Tradução clara do gesto convencional de luto; 'roupas' é mais corrente e abrangente do que 'vestes'.
