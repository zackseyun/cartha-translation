  text: And they spread out the book of the law[b][a], concerning which the nations were searching for the likenesses of their idols.
translation:
  language: pt
  text: E estenderam o livro da lei[a], a respeito do qual as nações procuravam as representações de seus ídolos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «abriram» ou «desenrolaram» o livro da lei.'
    reason: lexical_alternative
  - marker: b
    text: O grego é comprimido; o sentido pode ser que as nações examinavam o livro da lei em relação à confecção ou à consulta de representações de seus ídolos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξεπέτασαν
  choice: estenderam
  rationale: O verbo indica literalmente estender ou desdobrar. Com um livro em forma de rolo, «estenderam» preserva a ação concreta sem especificar além do texto se o abriram ou desenrolaram.
- source_word: τὸ βιβλίον τοῦ νόμου
  choice: o livro da lei
  rationale: Tradução direta e idiomática, mantendo «lei» em minúscula para não acrescentar uma decisão editorial ausente do grego.
- source_word: περὶ ὧν
  choice: a respeito do qual
  rationale: O relativo grego está no plural, embora seu antecedente explícito seja singular, o que faz parte da dificuldade textual. Em português, a concordância com «livro» torna a frase legível, enquanto a nota registra a construção comprimida.
- source_word: ἐξηρεύων
  choice: procuravam
  rationale: O imperfeito sugere ação contínua ou habitual. «Procuravam» é natural e suficientemente amplo para exprimir busca ou investigação.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Mantém o sentido direto de povos não israelitas sem adotar termos mais interpretativos como «pagãos» ou mais marcados pela tradição como «gentios».
- source_word: τὰ ὁμοιώματα
  choice: as representações
  rationale: O termo designa semelhanças ou representações. «Representações» distingue-o de εἴδωλα e soa mais natural em português do que «semelhanças» neste contexto.
- source_word: τῶν εἰδώλων αὐτῶν
  choice: de seus ídolos
  rationale: «Ídolos» comunica adequadamente o sentido cultual e polêmico de εἴδωλα.
theological_decisions:
- issue: Relação entre o livro da lei e as representações dos ídolos das nações
  choice: 'Manter a ligação sintática próxima do grego: «a respeito do qual as nações procuravam as representações de seus ídolos»'
  alternative: Explicitar que as nações examinavam o livro para fazer ou consultar representações de seus ídolos
  rationale: A construção grega é comprimida e sua situação prática exata não é inequívoca. A tradução conserva essa tensão, e a nota apresenta a possibilidade interpretativa sem incorporá-la ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva deliberadamente a dificuldade da cláusula grega, esclarecida sem resolução dogmática em nota.
