  yaml_path: translation/deuterocanon/1_maccabees/003/018.yaml
  text: And Judas said, “It is easy for many to be shut up into the hands of a few, and in the sight of heaven there is no difference between saving by many or by few.”
translation:
  language: pt
  text: 'E Judas disse: “É fácil que muitos sejam entregues nas mãos de poucos[a], e, aos olhos do Céu[b], não há diferença entre salvar por meio de muitos ou de poucos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sejam encerrados nas mãos de poucos”. O verbo grego significa literalmente ser fechado ou cercado; neste contexto, refere-se a ficar preso sob o poder de alguém.'
    reason: lexical_alternative
  - marker: b
    text: “Céu” provavelmente é uma forma reverente de se referir a Deus; uma tradução interpretativa seria “aos olhos de Deus”.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὔκοπόν
  choice: É fácil
  rationale: O adjetivo com ἐστιν forma uma expressão impessoal de possibilidade ou facilidade; “É fácil” é direto e natural em português.
- source_word: συγκλεισθῆναι
  choice: sejam encurralados
  rationale: O infinitivo passivo exprime ser fechado, cercado ou preso. “Encurralados” comunica com naturalidade a imagem militar de ficar sem saída sob o poder de outros.
- source_word: πολλοὺς ... ἐν χερσὶν ὀλίγων
  choice: muitos ... nas mãos de poucos
  rationale: Mantém o contraste central entre muitos e poucos e preserva a expressão idiomática de cair sob o poder alheio.
- source_word: διαφορὰ
  choice: não faz diferença
  rationale: Traduz idiomaticamente οὐκ ἔστι διαφορὰ sem acrescentar a ideia mais específica de vantagem.
- source_word: ἐναντίον τοῦ οὐρανοῦ
  choice: diante do Céu
  rationale: Preserva “Céu”, presente no grego, e expressa a ideia de estar perante sua presença ou consideração, sem substituir explicitamente o termo por “Deus”.
- source_word: σῴζειν
  choice: salvar
  rationale: Conserva tanto o sentido de livramento militar no contexto quanto a ressonância teológica mais ampla do verbo.
- source_word: ἐν πολλοῖς ἢ ἐν ὀλίγοις
  choice: por meio de muitos ou de poucos
  rationale: Torna explícito, em português natural, o valor instrumental da construção grega, sem identificar indevidamente quem são os muitos ou os poucos.
theological_decisions:
- issue: Uso reverencial de “Céu” em ἐναντίον τοῦ οὐρανοῦ
  choice: Manter “Céu” no texto principal
  alternative: diante de Deus
  rationale: Embora “Céu” provavelmente funcione como referência reverencial a Deus, o original diz literalmente “Céu”. A tradução preserva essa formulação e registra a interpretação provável em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Encurralados nas mãos” preserva simultaneamente a imagem de cerco e a expressão de estar sob o poder de alguém. A maiúscula em “Céu” sinaliza o uso reverencial sem apagar a formulação do grego.
