  text: As his will is in heaven[a], so he will do.
translation:
  language: pt
  text: Mas, seja qual for a vontade no céu[a], assim ele fará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Mas, conforme for a vontade no céu, assim ele fará.”'
    reason: A nota registra uma alternativa mais próxima da construção comparativa grega e deixa explícito que o original não traz pronome possessivo.
lexical_decisions:
- source_word: ὡς δʼ ἂν ᾖ
  choice: Mas, seja qual for
  rationale: A construção comparativa com ἄν traz uma nuance indefinida. “Seja qual for” a expressa de modo natural em português, enquanto “mas” representa δέ e liga a frase ao contexto anterior.
- source_word: θέλημα
  choice: a vontade dele
  rationale: θέλημα indica vontade ou intenção. O possessivo não está expresso lexicalmente, mas explicita em português o referente pessoal implícito no contexto e evita a formulação pouco natural “a vontade no céu”.
- source_word: ἐν οὐρανῷ
  choice: no céu
  rationale: Mantém o singular do grego e a expressão corrente em português.
- source_word: οὕτως
  choice: assim
  rationale: Preserva a correlação entre a oração inicial e o que o sujeito fará.
- source_word: ποιήσει
  choice: ele fará
  rationale: O futuro ativo tem sujeito masculino singular implícito. “Fará” conserva a simplicidade do verbo sem acrescentar um objeto ausente no grego.
theological_decisions:
- issue: Sujeito implícito de ποιήσει e referente de θέλημα
  choice: ele fará / a vontade dele
  alternative: isso será feito / a vontade no céu
  rationale: O verbo grego está na voz ativa e aponta para um agente pessoal masculino singular, entendido no contexto como Deus. A tradução preserva essa agência sem introduzir título divino no versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem correlativa “seja qual for... assim...” conserva a estrutura e a tensão do grego.
