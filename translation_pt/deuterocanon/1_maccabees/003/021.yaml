  text: But we are fighting for our lives and our laws[a][b].
translation:
  language: pt
  text: Mas nós lutamos por nossas vidas[a] e por nossas leis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossas almas”. A palavra grega pode significar “vidas” ou “almas”; neste contexto de batalha, “vidas” se ajusta melhor ao sentido.
    reason: lexical_alternative
  - marker: b
    text: Ou “nossos costumes legítimos” ou “nossas ordenanças ancestrais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mas nós
  rationale: δέ marca contraste com a declaração anterior, e o pronome explícito ἡμεῖς dá ênfase ao sujeito. “Mas nós” preserva ambos de modo natural.
- source_word: πολεμοῦμεν
  choice: lutamos
  rationale: O presente de πολεμέω significa lutar ou guerrear. Em português, o presente “lutamos” expressa naturalmente a ação atual no contexto.
- source_word: περὶ
  choice: por
  rationale: Com o verbo de combate, περί indica aquilo que está em jogo ou em cuja defesa se luta; “por” é a formulação portuguesa mais direta.
- source_word: τῶν ψυχῶν ἡμῶν
  choice: nossas vidas
  rationale: ψυχή pode significar tanto “vida” como “alma”. Neste contexto militar, “vidas” comunica melhor a sobrevivência concreta sem excluir a alternativa lexical, registrada em nota.
- source_word: τῶν νομίμων ἡμῶν
  choice: nossas leis
  rationale: νόμιμα abrange disposições estabelecidas por lei e costumes ou observâncias tradicionais. “Leis” é claro, conciso e mantém o peso jurídico-religioso do termo; as nuances alternativas aparecem em nota.
theological_decisions:
- issue: Sentido de ψυχαί no contexto de guerra
  choice: nossas vidas
  alternative: nossas almas
  rationale: O contexto imediato trata de combate e sobrevivência. “Vidas” preserva o sentido concreto sem impor uma leitura antropológica dualista que o grego não exige.
- issue: Amplitude de νόμιμα
  choice: nossas leis
  alternative: nossos costumes legítimos; nossas ordenanças ancestrais
  rationale: O termo pode incluir tanto leis quanto práticas tradicionais de caráter ancestral e religioso. “Leis” mantém sua força normativa, enquanto a nota preserva a amplitude sem restringi-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção curta conserva o contraste, o paralelismo e a urgência do grego.
