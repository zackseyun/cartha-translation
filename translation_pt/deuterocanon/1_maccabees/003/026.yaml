  text: And his name reached even to the king[c][b][a], and every nation spoke of the battle lines of Judah.
translation:
  language: pt
  text: E o nome dele chegou até o rei[a], e todas as nações falavam das batalhas de Judas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Isto é, sua fama chegou ao conhecimento do rei. O grego diz literalmente: “o nome dele se aproximou até o rei”.'
    reason: lexical_alternative
  - marker: b
    text: A construção grega é difícil e comprimida. A palavra traduzida por “batalhas” também pode se referir a formações ou linhas militares; literalmente, a frase inclui “acima de/tendo por assunto toda formação de batalha”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγγισεν ἕως τοῦ βασιλέως
  choice: chegou até o rei
  rationale: Embora ἤγγισεν signifique literalmente “aproximou-se”, com ἕως e neste contexto a expressão comunica que o nome ou a reputação de Judas chegou ao conhecimento do rei. “Chegou até” preserva a imagem grega sem soar artificial em português.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: o nome dele
  rationale: Reproduz o sentido literal de “seu nome”; no contexto, é uma maneira de falar de sua fama ou reputação.
- source_word: ὑπὲρ πᾶν παράταξιν
  choice: como superior a toda formação de batalha
  rationale: παράταξις designa uma tropa disposta para o combate, linha de batalha ou formação militar. ὑπέρ com acusativo conserva aqui uma força comparativa, mas a construção é comprimida e difícil; “como superior a” torna essa relação compreensível sem ocultar a incerteza, registrada em nota.
- source_word: ἐξηγεῖτο
  choice: falava de
  rationale: O verbo pode significar relatar, contar ou expor. “Falava de” é natural e suficientemente amplo para esta construção sintaticamente difícil.
- source_word: πᾶν ἔθνος
  choice: cada nação
  rationale: Mantém o valor distributivo do singular πᾶν ἔθνος e resulta em português natural.
- source_word: Ἰούδα
  choice: Judas
  rationale: Neste contexto, Ἰούδα é Judas Macabeu. “Judas” é a forma portuguesa tradicional e historicamente clara para esse personagem.
theological_decisions:
- issue: Identificação de Ἰούδα
  choice: Judas
  alternative: Judá
  rationale: A forma grega pode representar ambos os nomes, mas o contexto identifica inequivocamente Judas Macabeu. A escolha evita confusão com o território ou a tribo de Judá, sem acrescentar interpretação doutrinária.
- issue: Sentido da comparação em ὑπὲρ πᾶν παράταξιν
  choice: As nações falavam de Judas como superior a toda formação de batalha
  alternative: As nações falavam de Judas em relação a todas as suas formações ou campanhas militares
  rationale: A preposição ὑπέρ com acusativo favorece a ideia de ultrapassar ou superar, mas a sintaxe é incomum e admite outras explicações. A tradução mantém a força comparativa no texto e registra a alternativa em nota, sem transformar a frase numa afirmação teológica mais definida.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas naturais para leitores brasileiros. A tradução mantém “nome” e a imagem de algo que “chegou até” o rei, enquanto esclarece no corpo do versículo a comparação militar obscura e preserva sua incerteza em nota.
