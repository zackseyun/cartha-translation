base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/002.yaml
  text: And all his brothers helped him[a], and all who had joined themselves to his father[b], and they fought the war of Israel with gladness.
translation:
  language: pt
  text: Todos os seus irmãos o ajudavam, e todos os que haviam se unido a seu pai[a] travavam a guerra de Israel com alegria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “haviam aderido a seu pai” ou “haviam se aliado a seu pai”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “travavam com alegria a guerra por Israel”. O grego diz mais literalmente: “combatiam a guerra de Israel com alegria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθουν
  choice: ajudavam
  rationale: O imperfeito indica uma ação contínua no contexto narrativo; “ajudavam” é natural em português e preserva esse aspecto.
- source_word: πάντες οἱ ἀδελφοὶ αὐτοῦ
  choice: todos os seus irmãos
  rationale: A expressão se refere diretamente aos irmãos de Judas, os filhos de Matatias, e não a associados em sentido genérico.
- source_word: ὅσοι ἐκολλήθησαν τῷ πατρὶ αὐτοῦ
  choice: todos os que haviam se unido a seu pai
  rationale: O verbo κολλάω comunica a ideia de ligar-se ou aderir estreitamente a alguém. “Haviam se unido” preserva a adesão pessoal sem definir em excesso sua natureza política ou religiosa.
- source_word: ἐπολέμουν τὸν πόλεμον
  choice: travavam a guerra
  rationale: A expressão mantém o substantivo “guerra” presente na construção cognata grega, mas usa uma formulação idiomática e digna em português.
- source_word: Ἰσραήλ
  choice: de Israel
  rationale: Mantém o genitivo grego e sua concisão, sem decidir no texto principal entre posse, identificação e causa defendida.
- source_word: μετʼ εὐφροσύνης
  choice: com alegria
  rationale: Reproduz naturalmente a locução preposicional e o sentido de alegria ou disposição jubilosa expresso por εὐφροσύνη.
theological_decisions:
- issue: Sentido de “a guerra de Israel”
  choice: a guerra de Israel
  alternative: a guerra por Israel
  rationale: A formulação principal preserva o genitivo e a tensão do original. A alternativa explicita que a luta era travada em favor de Israel, mas pode resolver uma relação que o grego deixa condensada.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. Os imperfeitos “ajudavam” e “travavam” preservam o caráter contínuo das ações. O ponto e vírgula torna clara a passagem do apoio prestado a Judas para a participação coletiva na guerra.
