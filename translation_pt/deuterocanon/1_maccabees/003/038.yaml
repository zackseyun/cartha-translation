  yaml_path: translation/deuterocanon/1_maccabees/003/038.yaml
  text: And Lysias chose Ptolemy son of Dorymenes[a], Nicanor, and Gorgias, mighty men among the king’s friends.
translation:
  language: pt
  text: E Lísias escolheu Ptolomeu, filho de Dorímenes, Nicanor e Górgias, homens poderosos entre os amigos do rei[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os cortesãos do rei”. No uso das cortes helenísticas, “amigos do rei” podia ser um título oficial, e não apenas uma referência à amizade pessoal com o monarca.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: escolheu
  rationale: O verbo indica escolher ou selecionar. “Escolheu” é direto e natural, sem acrescentar a ideia mais específica de nomeação oficial.
- source_word: Πτολεμαῖον τὸν Δορυμένους
  choice: Ptolomeu, filho de Dorímenes
  rationale: O artigo seguido do nome pessoal no genitivo identifica Ptolomeu por sua filiação; em português, “filho de Dorímenes” expressa claramente essa relação.
- source_word: ἄνδρας δυνατοὺς
  choice: homens poderosos
  rationale: A expressão se refere explicitamente a homens e δυνατούς pode indicar força, capacidade ou influência. “Poderosos” preserva de modo conciso tanto a dimensão militar quanto a posição elevada dessas pessoas.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: entre os amigos do rei
  rationale: O genitivo associa esses homens ao círculo dos “amigos do rei”. “Entre” produz uma construção natural em português, enquanto a nota preserva a possível função de título cortesão.
