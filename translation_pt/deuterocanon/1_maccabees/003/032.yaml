lexical_decisions:
- source_word: κατέλιπεν
  choice: deixou
  rationale: Preserva o sentido de deixar alguém numa posição ou incumbência, cujo conteúdo é explicitado pela construção seguinte.
- source_word: ἄνθρωπον ἔνδοξον
  choice: homem honrado
  rationale: Ἔνδοξος indica alguém de honra, prestígio ou alta reputação; «honrado» mantém o valor positivo sem exagerá-lo.
- source_word: ἀπὸ γένους τῆς βασιλείας
  choice: membro da família real
  rationale: Expressa naturalmente a pertença à linhagem ou casa régia, sem sugerir necessariamente que Lísias fosse filho do rei.
- source_word: ἐπὶ τῶν πραγμάτων τοῦ βασιλέως
  choice: encarregado dos assuntos do rei
  rationale: A construção indica autoridade administrativa sobre os negócios ou assuntos régios.
- source_word: ἀπὸ τοῦ ποταμοῦ Εὐφράτου ἕως τῶν ὁρίων Αἰγύπτου
  choice: desde o rio Eufrates até as fronteiras do Egito
  rationale: Reproduz com clareza a extensão geográfica da responsabilidade confiada a Lísias.
