  yaml_path: translation/deuterocanon/1_maccabees/003/023.yaml
  text: And when he stopped speaking[a], he suddenly charged at them[b], and Seron and his camp were crushed before him.
translation:
  language: pt
  text: Quando terminou de falar, lançou-se de repente contra eles[a], e Seron e o seu acampamento[b] foram esmagados diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arremeteu de repente contra eles” ou “precipitou-se sobre eles”; o verbo grego sugere um ataque súbito.
    reason: lexical_alternative
  - marker: b
    text: “Acampamento” também pode ser entendido, em sentido mais amplo, como “exército” ou “tropa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: Quando terminou de falar
  rationale: Expressa com naturalidade a sequência imediata indicada pela construção grega, sem acrescentar uma relação causal.
- source_word: ἐνήλατο ἐπʼ αὐτοὺς ἄφνω
  choice: lançou-se de repente contra eles
  rationale: “Lançou-se contra” preserva o movimento súbito e agressivo do verbo, enquanto “de repente” traduz diretamente ἄφνω.
- source_word: συνετρίβη
  choice: foram esmagados
  rationale: Mantém a imagem forte de quebrar ou esmagar, em vez de reduzi-la ao sentido mais genérico de “foram derrotados”; o plural concorda com o sujeito composto.
- source_word: Σήρων
  choice: Seron
  rationale: Transliteração portuguesa clara da forma grega Σήρων.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: o seu acampamento
  rationale: παρεμβολή pode designar tanto o acampamento como a força militar nele reunida; “acampamento” conserva a imagem concreta do texto.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Reproduz a expressão espacial grega e preserva a referência pronominal sem explicitação interpretativa.
