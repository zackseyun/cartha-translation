  to: Eles vêm contra nós com uma multidão de insolência e de desrespeito à lei[a], para nos exterminar, bem como a nossas esposas e nossos filhos, e para nos saquear.
  rationale: A revisão restabelece a ligação de πλήθει (“multidão”, “grande número”) com “insolência e desrespeito à lei”, sem eliminar a possível leitura que entende a expressão como uma referência ao grande número dos invasores. A nota registra essa ambiguidade sintática. Também torna a enumeração dos alvos mais natural em português.
