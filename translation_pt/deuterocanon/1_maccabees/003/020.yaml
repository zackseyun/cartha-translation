  yaml_path: translation/deuterocanon/1_maccabees/003/020.yaml
  text: They are coming against us in a great mass of insolence and lawlessness, to wipe out us and our wives and our children, and to plunder us.
translation:
  language: pt
  text: Eles vêm contra nós com uma multidão de insolência e de desrespeito à lei[a], para nos exterminar, bem como a nossas esposas e nossos filhos, e para nos saquear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em grande número, com insolência e desrespeito à lei”. O grego diz literalmente “com uma multidão de insolência e de desrespeito à lei”; a construção pode também indicar que eles vêm em grande número, caracterizados por essas atitudes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ἔρχονται πρὸς ἡμᾶς
  choice: Eles vêm contra nós
  rationale: No contexto militar, πρός indica aproximação hostil; “contra nós” torna isso claro sem ampliar o sentido.
- source_word: πλήθει ὕβρεως καὶ ἀνομίας
  choice: em grande número, com insolência e desprezo pela lei
  rationale: A construção grega é compacta e incomum. A formulação comunica naturalmente tanto a força numérica quanto as qualidades morais de ὕβρις e ἀνομία, enquanto a nota preserva uma alternativa mais formal.
- source_word: ὕβρεως
  choice: insolência
  rationale: O termo expressa arrogância ofensiva e violenta; “insolência” mantém essa dimensão moral.
- source_word: ἀνομίας
  choice: desprezo pela lei
  rationale: A expressão conserva a referência lexical à rejeição da lei e é mais clara no português corrente do que “anomia”, sem reduzir o termo à mera ilegalidade técnica.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: para exterminar a nós
  rationale: O infinitivo articular indica propósito, e ἐξαίρω, neste contexto, comunica remoção total ou aniquilação. A forma explícita “a nós” preserva a coordenação com esposas e filhos.
- source_word: τὰς γυναῖκας ἡμῶν καὶ τὰ τέκνα ἡμῶν
  choice: as nossas esposas e os nossos filhos
  rationale: Com os possessivos neste contexto familiar, γυναῖκες significa naturalmente “esposas”; τέκνα é vertido por “filhos”, abrangendo os descendentes sem especificar sexo.
- source_word: τοῦ σκυλεῦσαι ἡμᾶς
  choice: para nos saquear
  rationale: σκυλεύω designa despojar ou pilhar, sobretudo após uma vitória; “saquear” é corrente e preserva o sentido militar e econômico.
