  source_fidelity: A formulação principal desloca πλήθει para uma descrição meramente numérica dos invasores (“em grande número”) e apresenta “insolência e desprezo pela lei” como elemento separado. No grego, πλήθει rege os genitivos ὕβρεως e ἀνομίας; a tradução deve conservar, na medida do possível, a ideia de uma grande profusão/multidão dessas atitudes. Os dois infinitivos de finalidade e seus objetos são preservados.
  naturalness: O texto é em geral claro e moderno. Contudo, “para exterminar a nós, as nossas esposas e os nossos filhos” soa menos fluente do que uma coordenação com pronomes oblíquos, sem perda de ênfase.
  terminology: “Insolência” traduz adequadamente ὕβρις. “Desrespeito à lei” expressa ἀνομία de modo claro e preserva a referência à lei. “Saquear” é apropriado para σκυλεύω neste contexto.
