base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/003/041.yaml
  text: And the merchants of the land heard their name[a], and they took very much silver and gold, and servants, and came into the camp to take the sons of Israel as servants[c][b]. And forces from Syria and from the land of foreigners were added to them.
translation:
  language: pt
  text: Os mercadores da região ouviram o nome deles[a]; levaram uma quantidade enorme de prata e ouro, e escravos, e foram ao acampamento para tomar os filhos de Israel como escravos[b]. Também se juntaram a eles tropas da Síria e da terra dos estrangeiros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouviram falar deles”, “souberam da fama deles”. Literalmente, “ouviram o nome deles”.
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode significar “servos” ou “jovens”; aqui se refere a pessoas adquiridas como propriedade. A mesma palavra é usada para os escravos levados pelos mercadores e para aquilo em que pretendiam transformar os filhos de Israel.
    reason: lexical_alternative
  - marker: c
    text: “Estrangeiros” traduz literalmente pessoas de outro povo. Em alguns contextos bíblicos, o termo pode designar os filisteus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι τῆς χώρας
  choice: os mercadores da região
  rationale: ἔμποροι designa comerciantes, e χώρα pode significar terra, país ou região. “Da região” é natural em português e não especifica um território além do que o grego permite.
- source_word: τὸ ὄνομα αὐτῶν
  choice: o nome deles
  rationale: Mantém a expressão grega, que no contexto comunica a reputação ou as notícias a respeito das forças mencionadas.
- source_word: ἀργύριον καὶ χρυσίον πολὺ σφόδρα
  choice: uma quantidade enorme de prata e ouro
  rationale: Expressa com naturalidade a forte intensificação de πολὺ σφόδρα.
- source_word: παῖδας
  choice: escravos
  rationale: Embora παῖς tenha uma faixa semântica mais ampla, o contexto é de comércio de cativos como propriedade humana. A mesma tradução nas duas ocorrências preserva a repetição lexical do grego.
- source_word: παρεμβολήν
  choice: acampamento
  rationale: Equivalente corrente para o sentido militar de παρεμβολή.
- source_word: τοῦ λαβεῖν τοὺς υἱοὺς Ἰσραὴλ εἰς παῖδας
  choice: para tomar os filhos de Israel como escravos
  rationale: A construção infinitiva indica propósito; “filhos de Israel” conserva a formulação explícita υἱοὺς Ἰσραήλ.
- source_word: προσετέθησαν πρὸς αὐτούς
  choice: se juntaram a eles
  rationale: Comunica em português natural o sentido passivo-aditivo da expressão, sem alterar quem se associa a quem.
- source_word: δυνάμεις Συρίας καὶ γῆς ἀλλοφύλων
  choice: tropas da Síria e da terra dos estrangeiros
  rationale: δυνάμεις tem sentido militar aqui. ἀλλόφυλοι significa literalmente gente de outro povo; “estrangeiros” evita restringir sem necessidade a referência aos filisteus.
theological_decisions:
- issue: Sentido de παῖδας no contexto de comércio de cativos
  choice: escravos
  alternative: servos; jovens
  rationale: A intenção de comprar israelitas capturados exige aqui o sentido de pessoas mantidas como propriedade. “Escravos” torna explícita essa realidade sem importar uma distinção doutrinária; a nota preserva a amplitude lexical do termo.
- issue: Identidade de ἀλλόφυλοι
  choice: estrangeiros
  alternative: filisteus
  rationale: Embora o termo possa designar os filisteus em certos contextos bíblicos, este versículo não exige essa identificação étnica mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e as repetições relevantes do grego foram preservadas, enquanto “se juntaram” e “uma quantidade enorme” evitam construções excessivamente literais.
