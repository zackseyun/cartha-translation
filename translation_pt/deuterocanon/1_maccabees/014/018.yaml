  yaml_path: translation/deuterocanon/1_maccabees/014/018.yaml
  text: And they wrote to him on bronze tablets to renew with him the friendship and the alliance that they had established with Judas and Jonathan his brothers[a].
translation:
  language: pt
  text: E escreveram-lhe em placas de bronze[a], a fim de renovar com ele a amizade e a aliança que haviam estabelecido com Judas e Jônatas, irmãos dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tabuletas de bronze». O grego se refere a placas próprias para escrita, feitas de bronze, provavelmente destinadas a um registro diplomático durável.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψαν
  choice: escreveram-lhe
  rationale: Mantém o sentido básico de «escrever»; o suporte de bronze já sugere que o texto foi gravado, sem tornar o verbo mais específico do que o grego.
- source_word: δέλτους χαλκᾶς
  choice: placas de bronze
  rationale: δέλτος designa uma superfície ou placa para escrita. «Placas de bronze» é natural em português e comunica o caráter durável e formal do documento.
- source_word: τοῦ ἀνανεώσασθαι
  choice: a fim de renovar
  rationale: O infinitivo articular indica finalidade; a expressão explicita essa relação com clareza e dignidade.
- source_word: φιλίαν
  choice: a amizade
  rationale: Preserva o termo relacional do grego e seu possível sentido diplomático formal sem substituí-lo por uma interpretação mais técnica.
- source_word: συμμαχίαν
  choice: a aliança
  rationale: Expressa de modo conciso a associação político-militar indicada pelo termo grego.
- source_word: ἔστησαν
  choice: haviam estabelecido
  rationale: Neste contexto, o verbo significa estabelecer ou firmar uma relação; o mais-que-perfeito situa essa aliança antes de sua renovação.
- source_word: πρὸς αὐτόν
  choice: com ele
  rationale: Em contexto de relações diplomáticas, a preposição é vertida idiomaticamente por «com».
- source_word: Ἰούδαν καὶ Ἰωνάθαν τοὺς ἀδελφοὺς αὐτοῦ
  choice: Judas e Jônatas, irmãos dele
  rationale: Identifica ambos como irmãos do referente masculino sem acrescentar o nome «Simão», ausente deste versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. «Irmãos dele» evita a possível ambiguidade coloquial de «seus irmãos» quanto ao referente. O marcador [a] acompanha diretamente a expressão comentada.
