  source_fidelity: 'A tradução reproduz com precisão as três ações do grego: ἐστήρισεν, ἐξεζήτησεν e ἐξῆρεν. “Fortaleceu” é adequado para ἐστήρισεν; “buscou diligentemente” expressa legitimamente a força intensiva de ἐξεζήτησεν; e “removeu” preserva a amplitude de ἐξῆρεν. “Todos os humildes” mantém, com a nota, a ambiguidade social e disposicional de ταπεινούς. “Tudo o que era contrário à lei e perverso” transmite de forma natural o neutro substantivado πάντα ἄνομον καὶ πονηρόν e conserva a ligação lexical com νόμον, sem restringir indevidamente o referente.'
