  terminology: “A lei” é uma escolha prudentemente não interpretativa para τὸν νόμον, e a nota identifica de modo adequado a referência provável à Torá. A nota em [a] esclarece com precisão a possível dimensão social de ταπεινούς sem eliminar sua possível conotação moral. Os marcadores estão corretamente posicionados e correspondem às notas fornecidas.
