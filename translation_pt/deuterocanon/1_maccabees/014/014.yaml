  yaml_path: translation/deuterocanon/1_maccabees/014/014.yaml
  text: And he strengthened all the humble of his people[a]; he sought out the law[b], and removed every lawless and evil thing.
translation:
  language: pt
  text: E fortaleceu todos os humildes do seu povo[a]; buscou diligentemente a lei[b] e removeu tudo o que era contrário à lei e perverso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os de condição humilde do seu povo”. O grego pode indicar tanto pessoas socialmente humildes quanto pessoas humildes em sua disposição.'
    reason: lexical_alternative
  - marker: b
    text: “A lei” provavelmente se refere à lei ancestral judaica, isto é, à Torá.
    reason: cultural_note
lexical_decisions:
- source_word: ἐστήρισεν
  choice: fortaleceu
  rationale: Expressa o sentido de tornar firme, fortalecer ou dar apoio, e soa natural no contexto do governo de Simão.
- source_word: πάντας τοὺς ταπεινοὺς
  choice: todos os humildes
  rationale: Preserva a amplitude de ταπεινός, que pode apontar tanto para a condição social humilde quanto para uma disposição de humildade.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: do seu povo
  rationale: Reproduz diretamente a relação genitiva e conserva a força possessiva do grego.
- source_word: τὸν νόμον
  choice: a lei
  rationale: O contexto provavelmente se refere à lei ancestral judaica, a Torá; a minúscula evita explicitar no texto principal mais do que a forma grega permite.
- source_word: ἐξεζήτησεν
  choice: buscou diligentemente
  rationale: O verbo composto comunica uma busca ativa e cuidadosa; esta formulação torna perceptível sua força intensiva em português.
- source_word: ἐξῆρεν
  choice: removeu
  rationale: Mantém o sentido amplo de tirar ou eliminar sem decidir se o objeto são pessoas, práticas ou condições.
- source_word: πάντα ἄνομον καὶ πονηρόν
  choice: tudo o que era contrário à lei e perverso
  rationale: A formulação substantiva representa os adjetivos neutros gregos e preserva a ligação lexical de ἄνομον com νόμον, evitando o português menos natural 'tudo sem lei'.
theological_decisions:
- issue: Se νόμος deve ser explicitado como a Torá ou grafado como título pactual
  choice: a lei
  alternative: a Lei; a Torá
  rationale: Embora o contexto indique provavelmente a lei ancestral judaica, o grego não contém distinção de maiúsculas nem explicita 'Torá'. A nota fornece a identificação provável sem a impor ao texto.
- issue: Se ταπεινούς descreve principalmente condição social ou caráter moral
  choice: os humildes
  alternative: os de condição humilde; os oprimidos; os pobres
  rationale: A escolha mantém abertas as dimensões social e moral do termo, enquanto a nota registra a alternativa social mais explícita.
- issue: Se πάντα ἄνομον καὶ πονηρόν designa pessoas, práticas ou coisas
  choice: tudo o que era contrário à lei e perverso
  alternative: todo transgressor e malfeitor; toda prática contrária à lei e perversa
  rationale: Os adjetivos neutros substantivados permitem referência ampla. A tradução não restringe o objeto da remoção a pessoas nem apenas a práticas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A tradução conserva a estrutura coordenada do grego e suas ambiguidades relevantes, mas torna explícita em português a relação de ἄνομον com νόμος por meio de “contrário à lei”.
