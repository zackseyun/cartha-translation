  text: And each sat under his own vine and his own fig tree[a], and there was no one to frighten them.
translation:
  language: pt
  text: E cada um se sentou debaixo da sua videira e da sua figueira[a], e não havia ninguém que os amedrontasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta expressão evoca uma imagem bíblica de paz e segurança; compare 1 Reis 4:25 e Miqueias 4:4.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκάθισεν
  choice: se sentava
  rationale: O aoristo descreve a situação de repouso e segurança desfrutada por cada pessoa. «Se sentava» preserva a imagem concreta e soa natural no contexto, sem a transformar numa afirmação abstrata.
- source_word: ἕκαστος
  choice: cada um
  rationale: 'Mantém o sentido distributivo do grego: a segurança era desfrutada individualmente por todos, sem acrescentar um substantivo masculino explícito.'
- source_word: ὑπὸ
  choice: debaixo de
  rationale: Reproduz tanto o sentido espacial como a formulação bíblica tradicional de repouso seguro sob a videira e a figueira.
- source_word: ἄμπελον
  choice: videira
  rationale: É o equivalente português preciso e corrente para a planta que produz uvas, preservando a imagem agrícola.
- source_word: συκῆν
  choice: figueira
  rationale: Designa precisamente a árvore e corresponde à expressão bíblica conhecida em português.
- source_word: οὐκ ἦν ὁ ἐκφοβῶν
  choice: não havia quem os amedrontasse
  rationale: O particípio substantivado indica alguém que causasse medo. Esta construção é natural em português e conserva o valor causativo do verbo.
- source_word: αὐτούς
  choice: os
  rationale: Retoma de modo conciso as pessoas que desfrutavam dessa segurança, como faz o pronome grego.
theological_decisions:
- issue: Fórmula intertextual de paz («debaixo da sua videira e da sua figueira»)
  choice: Manter literalmente a imagem agrícola no texto principal.
  alternative: Parafrasear como uma declaração geral de paz, prosperidade e segurança.
  rationale: A expressão evoca uma fórmula bíblica reconhecível de paz e segurança. A imagem literal preserva essa ressonância intertextual sem impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «cada um se sentava» preserva a cena concreta e exprime uma condição habitual de segurança; «amedrontasse» mantém o sentido causativo sem soar excessivamente coloquial.
