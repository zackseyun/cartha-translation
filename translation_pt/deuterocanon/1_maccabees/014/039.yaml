  text: and he made him one of his Friends[a], and he honored him with great honor.
translation:
  language: pt
  text: e fez dele um dos seus Amigos[a] e o honrou com grande honra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um dos seus amigos”. O grego pode referir-se tanto à amizade pessoal como, mais provavelmente aqui, à categoria reconhecida dos “Amigos” do rei na corte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησεν
  choice: fez
  rationale: Na construção com complemento, ποιέω indica fazer ou constituir alguém como membro de um grupo. “Fez dele” acompanha de perto o grego e é natural em português.
- source_word: τῶν φίλων αὐτοῦ
  choice: um dos seus Amigos
  rationale: O genitivo plural indica inclusão numa classe. No contexto das cortes helenísticas, φίλοι provavelmente designa a categoria reconhecida dos “Amigos” do rei; a inicial maiúscula sinaliza esse provável valor institucional sem eliminar a leitura comum.
- source_word: ἐδόξασεν
  choice: honrou
  rationale: Neste contexto régio e político, δοξάζω significa conferir honra ou distinção, não necessariamente “glorificar” em sentido teológico.
- source_word: δόξῃ μεγάλῃ
  choice: com grande honra
  rationale: O dativo expressa o modo ou meio pelo qual ele foi honrado. A formulação preserva a repetição cognata de ἐδόξασεν e δόξῃ e o tom enfático do grego.
theological_decisions:
- issue: Se φίλοι é um termo relacional comum ou um título de corte
  choice: “Amigos”, com inicial maiúscula, preservando o provável sentido de categoria cortesã
  alternative: “amigos”, no sentido de relações pessoais
  rationale: No uso régio helenístico e em 1 Macabeus, “Amigos” frequentemente designa um círculo oficial ligado ao rei. A nota mantém explícita a ambiguidade real do grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se a repetição “honrou com grande honra” por refletir a ênfase e a figura etimológica do original, embora “concedeu-lhe grande honra” fosse mais idiomático.
