  text: He made peace upon the land, and Israel rejoiced with great joy.
translation:
  language: pt
  text: Ele estabeleceu a paz na terra[a], e Israel se alegrou com grande alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre a terra”.
    reason: Preserva a possibilidade de uma tradução mais literal de ἐπὶ τῆς γῆς, sem substituir a formulação portuguesa mais natural no texto principal.
lexical_decisions:
- source_word: ἐποίησεν τὴν εἰρήνην
  choice: estabeleceu a paz
  rationale: A expressão grega significa literalmente “fez a paz”. Em português corrente, “estabeleceu a paz” comunica com naturalidade a realização de uma condição pública de paz, sem acrescentar uma ideia estranha ao contexto.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Neste contexto, γῆ provavelmente designa a terra ou o território de Israel, e “na terra” é a forma mais natural em português. A nota preserva a construção grega mais literal com ἐπί.
- source_word: ηὐφράνθη
  choice: se alegrou
  rationale: A forma verbal expressa a reação jubilosa de Israel; “se alegrou” é idiomático e mantém a voz reflexiva/depoente percebida em português.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Forma tradicional e corrente do nome do povo ou nação.
- source_word: εὐφροσύνην μεγάλην
  choice: com grande alegria
  rationale: O acusativo tem valor adverbial ou intensivo. A formulação preserva a repetição enfática entre “se alegrou” e “alegria” presente no grego.
