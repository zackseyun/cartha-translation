base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/002.yaml
  text: And Arsaces, the king of Persia and Media, heard that Demetrius had come into his territory, and he sent one of his commanders to capture him alive.
translation:
  language: pt
  text: Arsaces, rei da Pérsia e da Média, soube que Demétrio havia entrado em seu território e enviou um de seus oficiais para capturá-lo vivo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube
  rationale: No contexto, o aoristo de ἀκούω indica que Arsaces recebeu a notícia; “soube” é natural em português sem especificar indevidamente como a informação chegou.
- source_word: Ἀρσάκης
  choice: Arsaces
  rationale: Forma tradicional e reconhecível do nome real em português.
- source_word: ὁ βασιλεὺς Περσίδος καὶ Μηδίας
  choice: rei da Pérsia e da Média
  rationale: Reproduz diretamente os títulos e emprega as formas geográficas correntes em português.
- source_word: ἦλθεν
  choice: havia entrado
  rationale: O mais-que-perfeito composto marca a chegada anterior à notícia recebida por Arsaces; “entrado” combina naturalmente com a referência territorial seguinte.
- source_word: τὰ ὅρια αὐτοῦ
  choice: seu território
  rationale: Embora ὅρια designe literalmente limites ou fronteiras, no plural pode indicar a região delimitada sob seu domínio; “território” comunica esse sentido político-geográfico com clareza.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente direto, claro e adequado à prosa narrativa.
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ
  choice: um de seus oficiais
  rationale: ἄρχων é amplo e pode designar governante, dirigente ou alto funcionário. “Oficiais” preserva essa amplitude melhor que “comandantes”, pois o grego não especifica um cargo militar.
- source_word: συλλαβεῖν
  choice: capturá-lo
  rationale: Expressa a apreensão de Demétrio no contexto de uma ação ordenada pelo rei, sem a conotação estritamente jurídica de “prendê-lo”.
- source_word: ζῶντα
  choice: vivo
  rationale: Indica explicitamente que Demétrio deveria ser capturado com vida, em contraste implícito com ser morto.
