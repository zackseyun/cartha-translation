  text: And he went and struck the camp of Demetrius, and captured him, and brought him to Arsaces, and put him in prison.
translation:
  language: pt
  text: Ele foi, atacou o acampamento de Demétrio, capturou-o, levou-o a Arsáces e o pôs na prisão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: foi
  rationale: O aoristo de πορεύομαι funciona aqui como verbo narrativo simples de deslocamento. “Foi” preserva essa sobriedade sem acrescentar uma marcha militar não explicitada.
- source_word: ἐπάταξεν
  choice: atacou
  rationale: πάτασσω significa literalmente golpear. Aplicado a um acampamento em contexto militar, “atacou” comunica naturalmente a ação em português sem afirmar necessariamente que o derrotou.
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: Em contexto militar, παρεμβολή designa um acampamento ou arraial. “Acampamento” é claro e corrente.
- source_word: συνέλαβεν
  choice: capturou-o
  rationale: συλλαμβάνω indica agarrar ou capturar. “Capturou-o” corresponde ao cenário militar e evita as conotações jurídicas modernas de “prendeu”.
- source_word: ἤγαγεν
  choice: levou-o
  rationale: ἄγω indica conduzir alguém a uma pessoa ou destino. “Levou-o a Ársaces” é a formulação mais natural em português.
- source_word: Ἀρσάκην
  choice: Ársaces
  rationale: “Ársaces” é a forma tradicional portuguesa do nome grego Ἀρσάκης, com acentuação gráfica adequada à pronúncia proparoxítona.
- source_word: ἔθετο
  choice: pôs
  rationale: τίθημι significa pôr ou colocar. “Pôs” conserva a expressão concreta do grego, enquanto o complemento esclarece a reclusão.
- source_word: ἐν φυλακῇ
  choice: na prisão
  rationale: φυλακή pode significar guarda, custódia ou prisão. Na construção “pôs... em”, o contexto favorece claramente a ideia de encarceramento; “na prisão” é direto e natural.
