  text: When the people heard these words[a], they said, “What favor shall we repay to Simon and to his sons?”
translation:
  language: pt
  text: 'Quando o povo ouviu essas palavras, disse: “Que retribuição de gratidão daremos a Simão e a seus filhos?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que favor retribuiremos a Simão e a seus filhos?” A palavra grega χάρις pode indicar favor, agradecimento ou gratidão; com «retribuir», tem aqui sentido recíproco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Quando ouviu
  rationale: A construção introduz a circunstância temporal da reação popular; o pretérito perfeito acompanha naturalmente a sequência narrativa em português, sem precisar representar δέ separadamente.
- source_word: ὁ δῆμος
  choice: o povo
  rationale: Refere-se ao corpo coletivo da população. “O povo” é claro e natural, sem impor a ideia mais formal de uma assembleia.
- source_word: τῶν λόγων τούτων
  choice: essas palavras
  rationale: Mantém a referência direta ao que acabara de ser dito. “Essas” soa natural no discurso narrativo português.
- source_word: Τίνα χάριν ἀποδώσομεν
  choice: Como retribuiremos
  rationale: A combinação de χάρις com ἀποδίδωμι expressa a ideia de corresponder ao favor recebido ou demonstrar gratidão. A formulação escolhida é idiomática em português e conserva o caráter deliberativo da pergunta, enquanto a nota registra a forma e a amplitude lexical do grego.
- source_word: Σίμωνι καὶ τοῖς υἱοῖς αὐτοῦ
  choice: a Simão e a seus filhos
  rationale: Preserva o nome tradicional e traduz υἱοί especificamente como “filhos”; a repetição da preposição torna a coordenação clara.
