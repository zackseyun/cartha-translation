  text: and that the Jews and the priests were pleased that Simon should be their leader and high priest forever[a], until a trustworthy prophet should arise.
translation:
  language: pt
  text: e que os judeus e os sacerdotes aprovaram que Simão fosse seu líder e sumo sacerdote para sempre, até que surgisse um profeta digno de confiança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um profeta fiel» ou «um profeta verdadeiro». A palavra grega πιστός pode designar alguém fiel ou digno de confiança.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: aprovaram
  rationale: No contexto de uma decisão pública, o verbo expressa consentimento favorável e aprovação; «aprovaram» soa natural em português e conserva o caráter formal da deliberação.
- source_word: ἡγούμενον
  choice: líder
  rationale: O particípio designa a função dirigente de Simão sem especificar um cargo político mais estreito como governador ou comandante.
- source_word: ἀρχιερέα
  choice: sumo sacerdote
  rationale: É a designação portuguesa tradicional e clara para o ofício sacerdotal expresso por ἀρχιερεύς.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Reproduz a formulação forte e aberta do grego, sem enfraquecê-la, embora a oração seguinte introduza um limite explícito.
- source_word: ἕως τοῦ ἀναστῆναι
  choice: até que surgisse
  rationale: Expressa de modo idiomático o limite prospectivo indicado pela construção grega.
- source_word: προφήτην πιστόν
  choice: um profeta digno de confiança
  rationale: πιστός pode indicar alguém fiel, confiável ou reconhecidamente verdadeiro. «Digno de confiança» destaca a credibilidade do profeta sem excluir as demais nuances, registradas em nota.
theological_decisions:
- issue: Duração do ofício de Simão diante de εἰς τὸν αἰῶνα seguido por ἕως
  choice: Manter «para sempre» e também a limitação «até que surgisse um profeta».
  alternative: Abrandar «para sempre» para «por tempo indeterminado» ou tratar a oração seguinte como simples explicação sem força limitadora.
  rationale: O grego conserva a tensão entre uma concessão aparentemente permanente e um termo futuro. A tradução mantém os dois elementos sem harmonizá-los.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Aprovaram que Simão fosse» preserva o tom de deliberação oficial; «líder» evita impor um cargo político não especificado pelo grego.
