translation:
  language: pt
  text: Ele deixou de combatê-los na terra[a], e os reis deles foram esmagados naqueles dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixou de guerrear contra eles no país”.'
    reason: Alternativa lexical para πολεμῶν e contextual para ἐπὶ τῆς γῆς; preserva o sujeito singular implícito de ἐξέλιπεν.
lexical_decisions:
- source_word: ἐξέλιπεν πολεμῶν αὐτούς
  choice: já não havia ... quem lutasse contra eles
  rationale: A combinação de ἐξέλιπεν com o particípio substantivado πολεμῶν indica que deixou de existir ou não restou alguém que combatesse contra eles. Esta formulação evita introduzir um sujeito anterior («ele») que o grego não exige e expressa naturalmente a construção em português.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: No contexto histórico e territorial de 1 Macabeus, γῆ designa mais naturalmente a terra ou o território em questão, embora também possa significar a terra em sentido amplo.
- source_word: οἱ βασιλεῖς αὐτῶν
  choice: os reis deles
  rationale: Mantém o genitivo pronominal do grego sem especificar além do texto a relação exata entre os reis e o grupo referido.
- source_word: συνετρίβησαν
  choice: foram esmagados
  rationale: O passivo de συντρίβω comunica derrota decisiva ou destruição do poder dos reis; «foram esmagados» preserva a força da imagem.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: naqueles dias
  rationale: Equivalente temporal direto, corrente e digno em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção existencial reproduz o sentido contextual do grego com mais precisão do que «ele parou de lutar», sem eliminar a possível amplitude de γῆ, indicada em nota.
