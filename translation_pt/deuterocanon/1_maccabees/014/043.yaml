  text: and that he should have charge of the holy things[a], and that he should be obeyed by all, and that all documents in the country should be written in his name[d][c][b], and that he should wear purple and gold.
translation:
  language: pt
  text: e que ele tivesse a seu cargo as coisas sagradas[a], fosse obedecido por todos[b], todos os documentos na região fossem redigidos em seu nome[c], e que vestisse púrpura e usasse ouro[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o santuário” ou “os assuntos sagrados”. O grego diz literalmente “as coisas sagradas”, expressão ampla para o que pertence à esfera sagrada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fosse ouvido por todos”; neste contexto, o sentido é que sua autoridade deveria ser acatada.
    reason: lexical_alternative
  - marker: c
    text: Isto é, todos os documentos oficiais da região deveriam ser redigidos sob sua autoridade.
    reason: cultural_note
  - marker: d
    text: A púrpura e o ouro eram sinais de posição elevada e honra oficial.
    reason: cultural_note
lexical_decisions:
- source_word: μέλῃ ... περὶ
  choice: tivesse a seu cargo
  rationale: A construção pode significar cuidar de ou ocupar-se de algo; no contexto de um decreto administrativo, expressa responsabilidade e supervisão oficiais.
- source_word: τῶν ἁγίων
  choice: as coisas sagradas
  rationale: O plural neutro abrange objetos, assuntos ou atividades ligados ao âmbito sagrado, sem restringir o sentido ao edifício do santuário.
- source_word: ἀκούηται
  choice: fosse obedecido
  rationale: Embora o sentido mais literal seja “fosse ouvido”, neste contexto de autoridade pública o verbo indica que todos deveriam dar ouvidos a Simão e acatar sua autoridade.
- source_word: συγγραφαὶ
  choice: documentos
  rationale: O termo designa escritos ou instrumentos formais; “documentos” preserva a amplitude adequada ao contexto jurídico e administrativo.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: em seu nome
  rationale: A expressão indica que os documentos seriam redigidos ou emitidos sob o nome e a autoridade de Simão.
- source_word: πορφύραν
  choice: púrpura
  rationale: O substantivo refere-se à púrpura usada como vestimenta prestigiosa; “vestisse púrpura” mantém a forma concisa do grego.
- source_word: χρυσοφορῇ
  choice: usasse ouro
  rationale: O verbo significa portar ou usar ouro, provavelmente como adorno ou insígnia de dignidade.
theological_decisions:
- issue: Amplitude de τῶν ἁγίων
  choice: as coisas sagradas
  alternative: o santuário; os assuntos sagrados
  rationale: O contexto diz respeito à autoridade sobre a esfera sagrada, mas o plural grego é mais amplo do que uma referência exclusiva ao santuário. A tradução preserva essa amplitude.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção formal adequada ao texto de um decreto. “Região” traduz χώρα sem impor a noção moderna de Estado nacional; “tivesse a seu cargo” comunica responsabilidade administrativa sem estreitar o alcance das atribuições sagradas.
