  text: But if anyone does anything contrary to these things[a], or sets aside any of them, he shall be liable.
translation:
  language: pt
  text: Mas, se alguém fizer algo contrário a estas disposições ou invalidar qualquer uma delas, será responsabilizado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será considerado culpado”. A expressão grega pode indicar responsabilidade jurídica ou culpabilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα ποιήσῃ
  choice: agir contra estas disposições
  rationale: No contexto jurídico, παρά com acusativo e ποιέω indica agir em violação do que foi estabelecido. “Estas disposições” explicita naturalmente que ταῦτα se refere às determinações anteriores.
- source_word: ἀθετήσῃ
  choice: invalidar
  rationale: Em contexto de decreto, ἀθετέω pode indicar tornar sem efeito, rejeitar ou desconsiderar uma disposição; “invalidar” preserva sua força jurídica.
- source_word: τι τούτων
  choice: qualquer uma delas
  rationale: A construção partitiva se refere a qualquer item entre as disposições anteriormente enumeradas.
- source_word: ἔνοχος ἔσται
  choice: será responsabilizado
  rationale: ἔνοχος exprime sujeição a responsabilidade ou culpabilidade. A formulação escolhida soa natural em português jurídico sem especificar uma pena não declarada no texto.
