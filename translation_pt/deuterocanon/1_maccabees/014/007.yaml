base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/007.yaml
  text: And he gathered many captives[a], and he took control of Gezer and Beth-zur and the citadel, and he removed the uncleanness from it, and there was no one opposing him.
translation:
  language: pt
  text: Ele reuniu muitos cativos, tomou o controle de Gezer, de Bete-Zur e da cidadela[a], removeu dela as impurezas, e não havia quem se opusesse a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acra”, a fortaleza específica de Jerusalém.'
    reason: Leitura alternativa de ἄκρα como nome próprio histórico, em vez de substantivo comum.
lexical_decisions:
- source_word: συνήγαγεν αἰχμαλωσίαν πολλήν
  choice: reuniu muitos cativos
  rationale: Mantém a imagem concreta de reunir o produto humano das conquistas e expressa de modo natural o sentido contextual da expressão grega.
- source_word: ἐκυρίευσεν
  choice: tomou o controle de
  rationale: Comunica a obtenção de domínio militar e político sobre os lugares sem restringir o verbo ao ato pontual de capturá-los nem sugerir necessariamente um reinado prolongado.
- source_word: Γαζάρων
  choice: Gezer
  rationale: Adota a forma portuguesa reconhecível do topônimo semítico, em vez de reproduzir a forma flexionada do grego.
- source_word: Βαιθσούρων
  choice: Bete-Zur
  rationale: Emprega uma transliteração corrente e legível em português para o topônimo semítico.
- source_word: τῆς ἄκρας
  choice: da cidadela
  rationale: Traduz o sentido comum de ἄκρα como fortificação elevada; a possibilidade de ser o nome da fortaleza específica de Jerusalém é preservada em nota.
- source_word: ἐξῆρεν τὰς ἀκαθαρσίας ἐξ αὐτῆς
  choice: removeu dela as impurezas
  rationale: Conserva o plural grego e sua possível ressonância ritual ou religiosa, com formulação idiomática em português; 'dela' retoma naturalmente 'cidadela'.
- source_word: οὐκ ἦν ὁ ἀντικείμενος αὐτῷ
  choice: não havia quem se opusesse a ele
  rationale: Reproduz a construção existencial e o caráter contínuo da oposição ausente, sem converter a frase em uma afirmação mais absoluta do que o grego.
theological_decisions:
- issue: Significado cultual de ἀκαθαρσίαι
  choice: impurezas
  alternative: contaminações; coisas impuras
  rationale: A escolha preserva uma possível dimensão ritual e religiosa da purificação, sem especificar a natureza das impurezas além do que o texto declara.
- issue: ἄκρα como substantivo comum ou nome próprio
  choice: cidadela no texto principal
  alternative: Acra
  rationale: O substantivo grego admite o sentido comum de cidadela, mas no contexto macabeu pode designar especificamente a Acra de Jerusalém; a nota mantém essa ambiguidade histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação narrativa foi mantida, mas sem repetir mecanicamente a conjunção grega em cada oração. O marcador da nota foi colocado junto de “cidadela”, termo ao qual a variante realmente se refere.
