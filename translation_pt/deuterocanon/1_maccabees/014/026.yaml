base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/026.yaml
  text: For he and his brothers and his father's house stood firm[a], and they fought the enemies of Israel away from them, and established freedom for him, and recorded it on bronze tablets, and set them on a pillar on Mount Zion.
translation:
  language: pt
  text: Pois ele, seus irmãos e a casa de seu pai mantiveram-se firmes; combateram os inimigos de Israel e os afastaram deles, garantiram-lhe a liberdade[a], registraram isso em placas de bronze e as colocaram numa coluna no monte Sião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “estabeleceram liberdade para ele”. O pronome pode referir-se a Israel como povo ou nação personificada; também pode ser entendido como referência a Simão.
    reason: Preservar a ambiguidade do referente masculino singular αὐτῷ.
lexical_decisions:
- source_word: ἐστήρισεν
  choice: mantiveram-se firmes
  rationale: O verbo pode significar firmar, fortalecer ou estabelecer. Neste contexto político-militar, a formulação reflexiva comunica perseverança e firmeza. O plural natural em português acompanha o sujeito composto, embora o grego apresente o verbo no singular antes dos demais integrantes.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: seus irmãos
  rationale: Preserva o sentido familiar comum do substantivo, sem ampliá-lo desnecessariamente para parentes ou companheiros.
- source_word: ὁ οἶκος τοῦ πατρὸς αὐτοῦ
  choice: a casa de seu pai
  rationale: Mantém a expressão semítica para a família ou linhagem paterna, ainda compreensível em português bíblico moderno.
- source_word: ἐπολέμησαν τοὺς ἐχθροὺς Ἰσραὴλ ἀπʼ αὐτῶν
  choice: combateram os inimigos de Israel e os afastaram deles
  rationale: Conserva tanto a ação militar quanto a ideia espacial de afastamento expressa por ἀπʼ αὐτῶν, sem identificar de modo mais específico que o grego o referente do pronome plural.
- source_word: ἔστησαν αὐτῷ ἐλευθερίαν
  choice: garantiram-lhe a liberdade
  rationale: ‘Garantir a liberdade’ expressa de modo natural o ato de estabelecer ou assegurar liberdade. O pronome singular ‘lhe’ preserva o dativo masculino singular αὐτῷ e sua ambiguidade referencial.
- source_word: κατέγραψαν
  choice: registraram isso
  rationale: O verbo indica registro escrito. ‘Isso’ retoma os feitos ou a declaração precedente sem impor um referente mais estreito.
- source_word: ἐν δέλτοις χαλκαῖς
  choice: em placas de bronze
  rationale: No contexto de uma inscrição pública, ‘placas’ é mais natural que ‘tabuinhas’ e representa adequadamente δέλτοι feitas de bronze.
- source_word: ἔθεντο ἐν στήλῃ
  choice: as colocaram numa coluna
  rationale: O pronome feminino plural retoma as placas; ‘coluna’ oferece uma forma acessível de representar στήλη, monumento ou pilar erguido.
- source_word: ἐν ὄρει Σιών
  choice: no monte Sião
  rationale: Segue o uso geográfico corrente e tradicional em português.
theological_decisions:
- issue: Referente de αὐτῷ em ἔστησαν αὐτῷ ἐλευθερίαν
  choice: Manter o pronome singular em ‘garantiram-lhe a liberdade’
  alternative: Explicitar ‘garantiram liberdade a Israel/ao povo’ ou entender ‘lhe’ como referência pessoal a Simão
  rationale: O contexto favorece a liberdade de Israel como povo ou nação personificada, mas a forma grega é masculina singular e também pode ser relacionada a Simão. A tradução não resolve silenciosamente essa tensão.
- issue: Referente de αὐτῶν em ἀπʼ αὐτῶν
  choice: Preservar o pronome plural em ‘os afastaram deles’
  alternative: Explicitar ‘afastaram os inimigos do povo de Israel’
  rationale: A explicitação facilitaria a leitura, mas eliminaria parte da indeterminação pronominal do grego. A formulação escolhida conserva o sentido de remoção da ameaça.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A pontuação organiza a longa sequência coordenada sem alterar sua progressão. ‘Casa de seu pai’ preserva o sabor bíblico da expressão familiar, enquanto ‘placas de bronze’ e ‘garantiram-lhe’ mantêm clareza contemporânea.
