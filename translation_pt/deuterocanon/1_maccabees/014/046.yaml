  text: And all the people approved that Simon should act according to these words[a].
translation:
  language: pt
  text: E todo o povo aprovou que Simão agisse de acordo com essas palavras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em conformidade com essas disposições». O grego diz literalmente «de acordo com essas palavras», provavelmente em referência às disposições apresentadas anteriormente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησεν
  choice: aprovou
  rationale: O aoristo expressa aqui a aprovação ou decisão favorável coletiva do povo; «aprovou» comunica naturalmente o sentido público e formal.
- source_word: πᾶς ὁ λαός
  choice: todo o povo
  rationale: Preserva πᾶς e λαός de modo direto, natural e sem interpretar o grupo como «nação».
- source_word: θέσθαι
  choice: que Simão agisse
  rationale: A construção infinitiva grega é condensada. Em português, a oração com «que» transmite de maneira idiomática o que o povo decidiu a respeito de Simão, sem acrescentar a ideia mais específica de nomeação.
- source_word: ποιῆσαι
  choice: agisse
  rationale: Neste contexto político-administrativo, «agisse» exprime a execução prática do que havia sido estabelecido, com maior clareza do que o genérico «fizesse».
- source_word: κατὰ τοὺς λόγους τούτους
  choice: de acordo com essas palavras
  rationale: Mantém de perto a formulação grega e deixa aberta a possibilidade de λόγους designar as disposições previamente declaradas.
