  yaml_path: translation/deuterocanon/1_maccabees/014/010.yaml
  text: He supplied the cities with provisions[a], and equipped them with implements of fortification[b], until the name of his glory was named to the end of the earth.
translation:
  language: pt
  text: Abasteceu as cidades de mantimentos e as equipou com recursos de fortificação[a], até que o nome da sua glória foi proclamado até os confins da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida por «equipamentos de fortificação»; refere-se de modo amplo aos materiais e meios usados para fortalecer ou defender as cidades.
    reason: lexical_alternative
  - marker: b
    text: 'Mais idiomaticamente: «até que seu nome glorioso se tornou conhecido nos confins da terra». O grego diz mais literalmente: «o nome da sua glória foi nomeado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχορήγησεν
  choice: abasteceu
  rationale: Expressa o ato de fornecer às cidades aquilo de que necessitavam e se ajusta naturalmente ao complemento «mantimentos».
- source_word: βρώματα
  choice: mantimentos
  rationale: Embora signifique literalmente «alimentos», o contexto cívico e militar favorece o sentido de reservas alimentares ou provisões.
- source_word: ἔταξεν
  choice: equipou
  rationale: No contexto, o verbo indica que ele pôs as cidades em condições de defesa; «equipou» comunica o resultado sem acrescentar a ideia específica de armas.
- source_word: σκεύεσιν ὀχυρώσεως
  choice: recursos de fortificação
  rationale: A expressão pode abranger equipamentos, materiais e outros meios empregados para fortalecer e defender as cidades. «Recursos» evita restringi-la indevidamente a instrumentos manuais ou armas.
- source_word: ἕως ὅτου
  choice: até que
  rationale: Mantém a construção grega, que apresenta o alcance ou resultado atingido.
- source_word: τὸ ὄνομα τῆς δόξης αὐτοῦ
  choice: o nome da sua glória
  rationale: Preserva a construção genitiva enfática do grego, em vez de a resolver silenciosamente como «seu nome glorioso» ou «sua fama».
- source_word: ὠνομάσθη
  choice: foi mencionado
  rationale: Conserva a referência ao ato de nomear ou pronunciar o nome, mas em português é mais compreensível do que o literal e pouco natural «foi nomeado».
- source_word: ἕως ἄκρου γῆς
  choice: até os confins da terra
  rationale: É uma formulação portuguesa corrente para a extremidade da terra e comunica o alcance universal da expressão grega.
