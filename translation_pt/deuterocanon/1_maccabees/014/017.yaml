  text: But when they heard that Simon his brother had become high priest in his place and was ruling over the country and the cities in it,
translation:
  language: pt
  text: Mas, quando souberam que Simão, irmão dele, havia se tornado sumo sacerdote em seu lugar e governava o país e as cidades que havia nele,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Mas, quando souberam
  rationale: ὡς com o aoristo introduz aqui uma oração temporal, enquanto δέ assinala progressão narrativa com leve contraste; a formulação é natural em português e mantém a ligação com o contexto anterior.
- source_word: Σίμων ὁ ἀδελφὸς αὐτοῦ
  choice: Simão, irmão dele
  rationale: A expressão apositiva identifica Simão como irmão do referente anterior. As vírgulas deixam clara a aposição, e «dele» evita pressupor no próprio versículo um antecedente nominal não repetido.
- source_word: γέγονεν
  choice: havia se tornado
  rationale: O perfeito grego apresenta uma mudança já consumada com resultado vigente. O mais-que-perfeito composto também indica que isso ocorreu antes de eles receberem a notícia.
- source_word: ἀντ' αὐτοῦ
  choice: em seu lugar
  rationale: ἀντί expressa substituição ou sucessão no cargo; «em seu lugar» é claro e idiomático.
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: É a designação portuguesa tradicional, clara e precisa, do principal ofício sacerdotal judaico.
- source_word: ἐπικρατεῖ
  choice: governava
  rationale: Neste contexto político e territorial, o verbo indica exercer domínio ou controle. «Governava» comunica autoridade efetiva sem sugerir apenas vitória militar.
- source_word: τῆς χώρας
  choice: o país
  rationale: χώρα designa aqui o território mais amplo que contém as cidades mencionadas em seguida; «país» preserva esse alcance.
- source_word: τῶν πόλεων τῶν ἐν αὐτῇ
  choice: as cidades que nele havia
  rationale: A formulação conserva explicitamente a localização das cidades dentro do país e produz uma sequência natural em português.
theological_decisions:
- issue: Força política de ἐπικρατεῖ na narrativa histórica
  choice: governava
  alternative: exercia domínio sobre
  rationale: O contexto trata da autoridade cívica e territorial de Simão. «Governava» expressa essa autoridade política sem introduzir uma conotação teológica ou limitar o sentido a controle militar.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A tradução preserva a oração incompleta do versículo, encerrando com vírgula porque a frase prossegue no contexto seguinte.
