base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/036.yaml
  text: And in his days it prospered in his hands to remove the nations from their land[a], and those in the city of David in Jerusalem who had made for themselves a citadel, from which they would go out and defile the area around the sanctuary, and they inflicted great damage on its purity.
translation:
  language: pt
  text: Em seus dias, ele teve êxito em expulsar as nações da terra deles e os que estavam na Cidade de Davi, em Jerusalém. Estes haviam construído para si uma cidadela[a], de onde saíam para contaminar os arredores do santuário e causavam grande dano à sua pureza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Acra”, a cidadela fortificada de Jerusalém.
    reason: Alternativa lexical e identificação histórica provável de ἄκρα.
lexical_decisions:
- source_word: εὐοδώθη ἐν ταῖς χερσὶν αὐτοῦ
  choice: ele teve êxito
  rationale: Expressa em português natural o passivo de sentido impessoal e a ideia idiomática de sucesso obtido por sua atuação, sem atribuir uma causa não explicitada.
- source_word: τοῦ ἐξαρθῆναι
  choice: em expulsar
  rationale: No contexto, indica retirar da terra os povos estrangeiros e os ocupantes hostis; “expulsar” comunica esse resultado sem sugerir necessariamente extermínio.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Mantém o sentido lexical amplo e evita tornar explícita, mediante “gentios”, uma identificação que o substantivo grego deixa ao contexto.
- source_word: χώρα
  choice: terra
  rationale: Equivalente amplo e natural para o território em questão.
- source_word: ἄκραν
  choice: uma cidadela
  rationale: Traduz o substantivo comum como fortificação urbana; a possível referência histórica específica à Acra é preservada em nota.
- source_word: ἐμίανον
  choice: contaminar
  rationale: Conserva o sentido de impureza cultual no contexto do santuário, em linguagem corrente e digna.
- source_word: κύκλῳ τῶν ἁγίων
  choice: os arredores do santuário
  rationale: A expressão grega é condensada e pode ser entendida como aquilo que circunda o lugar santo; esta formulação comunica claramente o provável referente espacial.
- source_word: πληγὴν μεγάλην
  choice: grande dano
  rationale: Transmite de modo idiomático a metáfora de um grande golpe ou ferida causado à pureza cultual.
- source_word: ἁγνείᾳ
  choice: à sua pureza
  rationale: Mantém a ênfase em pureza cultual; o possessivo retoma naturalmente o santuário e seu entorno.
theological_decisions:
- issue: Terminologia cultual ligada ao templo
  choice: contaminar, santuário e pureza
  alternative: profanar, lugar santo e santidade
  rationale: As escolhas preservam a linguagem de contaminação e pureza ritual do grego, sem transformar ἁγνεία no conceito mais amplo de santidade.
- issue: Identidade de τὰ ἔθνη
  choice: as nações
  alternative: os gentios
  rationale: “Nações” conserva a amplitude lexical e não impõe uma formulação religiosa mais específica do que o texto exige.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção grega muito longa foi dividida em duas frases para esclarecer que “estes” são os ocupantes da Cidade de Davi, sem alterar as relações sintáticas. “Da terra deles” preserva a ambiguidade do pronome grego quanto ao referente.
