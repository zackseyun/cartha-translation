  text: καὶ ἐν ταῖς ἡμέραις αὐτοῦ εὐοδώθη ἐν ταῖς χερσὶν αὐτοῦ, τοῦ ἐξαρθῆναι τὰ ἔθνη ἐκ τῆς χώρας αὐτῶν, καὶ τοὺς ἐν τῇ πόλει Δαυεὶδ τοὺς ἐν Ἰερουσαλὴμ οἳ ἐποίησαν ἑαυτοῖς ἄκραν ἐξ ἧς ἐξεπορεύοντο, καὶ ἐμίανον κύκλῳ τῶν ἁγίων, καὶ ἐποίουν πληγὴν μεγάλην ἐν τῇ ἁγνείᾳ.
