  yaml_path: translation/deuterocanon/1_maccabees/014/047.yaml
  text: And Simon accepted it[a], and agreed to be high priest and to be commander and ethnarch of the Jews and priests[c][b], and to be over them all.
translation:
  language: pt
  text: E Simão aceitou isso e consentiu em exercer o sumo sacerdócio, ser comandante e etnarca[a] dos judeus[b] e dos sacerdotes, e ficar à frente de todos eles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Etnarca” era um título político histórico, aproximadamente “governante de um povo” ou “líder de uma nação”.
    reason: cultural_note
  - marker: b
    text: Ou “judeanos”. O termo grego pode referir-se aos judeus como povo ou aos habitantes da Judeia em sentido geoétnico.
    reason: lexical_alternative
  - marker: c
    text: Ou “presidir a todos eles” ou “estar encarregado de todos eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: aceitou isso
  rationale: O verbo médio indica que Simão aceitou o cargo ou acordo anteriormente descrito. “Isso” explicita apenas o objeto subentendido e produz uma frase natural em português.
- source_word: εὐδόκησεν
  choice: consentiu
  rationale: Neste contexto, o verbo expressa a anuência voluntária de Simão em assumir as funções enumeradas; “consentiu” preserva melhor essa ideia do que uma tradução literal como “teve prazer”.
- source_word: ἀρχιερατεύσαι
  choice: exercer o sumo sacerdócio
  rationale: O infinitivo verbal ressalta o exercício da função de sumo sacerdote. A formulação é clara e mantém a força ativa do grego.
- source_word: στρατηγός
  choice: comandante
  rationale: O termo designa uma função de liderança militar. “Comandante” é acessível e não impõe uma patente militar moderna específica.
- source_word: ἐθνάρχης
  choice: etnarca
  rationale: Trata-se de um título político histórico. A transliteração preserva sua especificidade, esclarecida em nota.
- source_word: Ἰουδαίων
  choice: judeus
  rationale: O termo pode designar o povo judeu ou, em sentido geoétnico, os habitantes da Judeia. Neste decreto político nacional, “judeus” é a opção mais natural, sem excluir a alternativa indicada em nota.
- source_word: ἱερέων
  choice: sacerdotes
  rationale: Tradução direta do substantivo plural, que aparece como um grupo distinguido no texto.
- source_word: προστῆσαι
  choice: ficar à frente de
  rationale: O infinitivo de προΐστημι comunica estar colocado sobre outros, presidir ou dirigir. “Ficar à frente de” conserva a imagem de posição e autoridade em português natural.
- source_word: ἁπάντων
  choice: todos eles
  rationale: O genitivo plural retoma coletivamente os grupos antes mencionados; o pronome torna essa referência explícita em português.
theological_decisions:
- issue: Tradução do título político ἐθνάρχης
  choice: etnarca
  alternative: governante do povo; líder da nação
  rationale: Manter o título histórico evita reduzir sua nuance constitucional a uma categoria genérica e não introduz interpretação teológica.
- issue: Alcance de Ἰουδαίων
  choice: judeus
  alternative: judeanos
  rationale: O grego admite tanto um sentido étnico-religioso quanto geoétnico. O contexto nacional favorece “judeus”, enquanto a nota preserva a ambiguidade genuína.
- issue: Relação de ἁπάντων com os grupos mencionados
  choice: todos eles
  alternative: todos; tudo
  rationale: O plural masculino retoma mais naturalmente os judeus e os sacerdotes mencionados, sem definir além do que o texto permite a extensão institucional da autoridade de Simão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se o título técnico “etnarca”, explicado em nota, e emprega-se “exercer o sumo sacerdócio” para refletir a forma verbal grega. A coordenação dos cargos foi preservada sem modernizar sua estrutura política.
