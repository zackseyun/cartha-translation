  text: And he settled Jewish men in it, and fortified it for the security of the country and the city, and raised the walls of Jerusalem.
translation:
  language: pt
  text: E instalou nela homens judeus, fortificou-a para a segurança da região e da cidade e elevou as muralhas de Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατῴκισεν
  choice: estabeleceu
  rationale: 'O verbo tem sentido causativo: fazer com que pessoas passem a residir num lugar. “Estabeleceu nela” é natural em português e evita a carga política moderna de “colonizou”.'
- source_word: ἄνδρας Ἰουδαίους
  choice: homens judeus
  rationale: Mantém explícito o substantivo masculino ἄνδρας e traduz Ἰουδαίους segundo seu sentido étnico-religioso adequado ao contexto.
- source_word: ὠχύρωσεν
  choice: fortificou-a
  rationale: É a tradução militar e histórica direta do verbo, tendo como referente feminino o lugar mencionado no contexto anterior.
- source_word: πρὸς ἀσφάλειαν
  choice: para a segurança
  rationale: Expressa claramente a finalidade indicada por πρὸς e conserva o teor defensivo e administrativo da frase.
- source_word: τῆς χώρας
  choice: da região
  rationale: χώρα designa aqui o território mais amplo em contraste com a cidade. “Região” é claro e evita tanto o sentido político moderno de “país” quanto possíveis ressonâncias especiais de “terra”.
- source_word: τῆς πόλεως
  choice: da cidade
  rationale: Tradução direta de πόλις; no contexto, a cidade é Jerusalém.
- source_word: ὕψωσεν
  choice: elevou
  rationale: Preserva a ideia de tornar mais altas as muralhas sem decidir se a ação consistiu em reconstruí-las ou apenas aumentá-las.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: as muralhas de Jerusalém
  rationale: “Muralhas” é o termo português natural para os muros defensivos de uma cidade e conserva o plural grego.
