  yaml_path: translation/deuterocanon/1_maccabees/014/044.yaml
  text: And it is not permitted for anyone of the people or of the priests to set aside any of these things, or to contradict what is said by him, or to convene an assembly in the country without him, or to put on purple and wear a gold clasp.
translation:
  language: pt
  text: E não é permitido a ninguém do povo nem dos sacerdotes anular qualquer uma destas disposições, contradizer o que ele disser, convocar uma assembleia no país sem ele[a], nem vestir púrpura e usar um broche de ouro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “organizar uma facção no país sem ele”. O termo grego traduzido por “assembleia” pode indicar uma reunião, uma coalizão ou um agrupamento faccioso.
    reason: lexical_alternative
  - marker: b
    text: As roupas de púrpura e o broche de ouro eram sinais de posição elevada ou de honra oficial.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔξεστιν
  choice: não é permitido
  rationale: Expressa com clareza a proibição formal, sem acrescentar uma conotação jurídica mais forte do que a locução grega exige.
- source_word: ἀθετῆσαί τι τούτων
  choice: anular nenhuma destas disposições
  rationale: No contexto de um decreto público, ἀθετέω indica invalidar ou deixar sem efeito; “disposições” explicita de modo natural o referente de τούτων.
- source_word: ἀντειπεῖν
  choice: contradizer
  rationale: Conserva o sentido de falar contra ou contestar os pronunciamentos de Simão.
- source_word: τοῖς ὑπʼ αὐτοῦ ῥηθησομένοις
  choice: o que ele disser
  rationale: 'Reproduz naturalmente em português a referência prospectiva do particípio passivo futuro: aquilo que vier a ser dito por ele.'
- source_word: ἐπιστρέψαι συστροφὴν
  choice: convocar uma assembleia
  rationale: Representa a ideia contextual de promover ou reunir um agrupamento organizado, sem impor o sentido mais negativo de facção ou sedição; a ambiguidade é registrada em nota.
- source_word: ἐν τῇ χώρᾳ ἄνευ αὐτοῦ
  choice: no país sem a autorização dele
  rationale: No contexto administrativo, χώρα é o território governado, e ἄνευ αὐτοῦ indica que tal reunião não poderia ocorrer à parte de sua autoridade.
- source_word: περιβαλέσθαι πορφύραν
  choice: vestir púrpura
  rationale: Mantém a forma concisa e o valor simbólico da vestimenta púrpura como sinal de posição elevada.
- source_word: ἐνπορποῦσθαι πόρπην χρυσῆν
  choice: usar um broche de ouro
  rationale: O verbo e o substantivo descrevem portar uma peça ornamental de ouro presa à roupa; “broche” é concreto e compreensível em português moderno.
theological_decisions:
- issue: Natureza da proibição no decreto cívico
  choice: Apresentar o versículo como uma restrição jurídico-política que estabelece a autoridade exclusiva de Simão.
  alternative: Interpretar a cláusula sobre συστροφή explicitamente como proibição de rebelião ou sedição.
  rationale: O contexto é um decreto público que honra e investe Simão de autoridade. A tradução não acrescenta uma avaliação teológica ou moral além da linguagem cívica do grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação foi ajustada para soar natural, e as ambiguidades relevantes do grego foram preservadas em nota.
