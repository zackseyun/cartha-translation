base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/001.yaml
  text: And in the one hundred seventy-second year[a], King Demetrius gathered his forces and went into Media[b], to obtain help for himself so that he might make war against Tryphon.
translation:
  language: pt
  text: No ano cento e setenta e dois[a], o rei Demétrio reuniu suas forças e foi para a Média a fim de conseguir ajuda para si[b], para guerrear contra Trifão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A fórmula de datação costuma ser entendida segundo a era selêucida. Literalmente: “no ano segundo, septuagésimo e centésimo”.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “atrair ajuda para si” ou “obter auxílio para si”. O verbo grego sugere puxar, atrair ou angariar ajuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔτει δευτέρῳ καὶ ἑβδομηκοστῷ καὶ ἑκατοστῷ
  choice: No ano cento e setenta e dois
  rationale: Converte a numeração grega aditiva em uma formulação cronológica natural em português, sem alterar a referência ao ano da era selêucida.
- source_word: συνήγαγεν
  choice: reuniu
  rationale: No contexto militar, o verbo indica juntar ou congregar tropas; “reuniu” é claro e corrente.
- source_word: τὰς δυνάμεις αὐτοῦ
  choice: suas forças
  rationale: Preserva o plural militar de δυνάμεις sem restringi-lo indevidamente a uma unidade ou formação específica.
- source_word: ἐπορεύθη εἰς Μηδίαν
  choice: foi para a Média
  rationale: Expressa o deslocamento até a região da Média sem acrescentar ao verbo a noção mais específica de marchar.
- source_word: τοῦ ἐπισπάσθαι βοήθειαν ἑαυτῷ
  choice: a fim de conseguir ajuda para si
  rationale: O infinitivo articulado indica finalidade. “Conseguir ajuda” é natural em português e comunica o sentido contextual de atrair ou obter auxílio.
- source_word: ὅπως πολεμήσῃ
  choice: para guerrear contra
  rationale: Mantém a finalidade subsequente e traduz πολεμέω como ação militar mais ampla do que um combate isolado.
- source_word: τὸν Τρύφωνα
  choice: Trifão
  rationale: Emprega a forma portuguesa tradicional e fonologicamente adequada do nome grego Τρύφων.
