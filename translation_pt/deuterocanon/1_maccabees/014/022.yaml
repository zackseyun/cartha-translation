base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/022.yaml
  text: 'And after recording in the public records what had been said by them[a], thus: “Numenius son of Antiochus and Antipater son of Jason, ambassadors of the Jews[c][b], came to us renewing their friendship with us.”'
translation:
  language: pt
  text: 'E registraram nos documentos oficiais do povo[a] o que eles haviam dito, nestes termos: “Numênio, filho de Antíoco, e Antípatro, filho de Jasão, embaixadores dos judeus[b], vieram até nós para renovar a amizade conosco[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas resoluções” ou “nas deliberações do povo”. A expressão grega provavelmente se refere à documentação oficial do corpo cívico.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego transmitido contém um alfa isolado antes de “judeus” (Α Ἰουδαίων), provavelmente um vestígio de copista ou editorial sem função no texto. A tradução segue o sentido claro: “embaixadores dos judeus”.'
    reason: textual_variant
  - marker: c
    text: Neste contexto, “amizade” é um termo diplomático e pode indicar relações amistosas formais ou uma aliança.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγραψάμενοι
  choice: registraram
  rationale: O verbo indica pôr por escrito ou inscrever oficialmente. A forma finita produz uma frase natural em português e exprime o ato documental indicado pelo particípio grego.
- source_word: τὰ ὑπ’ αὐτῶν εἰρημένα
  choice: o que eles haviam dito
  rationale: Reproduz de modo claro o conteúdo anteriormente declarado pelos enviados e mantém a anterioridade sugerida pela construção grega.
- source_word: ἐν ταῖς βουλαῖς τοῦ δήμου
  choice: nos documentos oficiais do povo
  rationale: No contexto cívico e diplomático, a expressão aponta para deliberações, resoluções ou seu registro oficial. Esta formulação comunica a função administrativa sem reduzir βουλαῖς a simples conversa oral.
- source_word: οὕτως
  choice: nestes termos
  rationale: Introduz de modo idiomático a redação exata do registro oficial.
- source_word: πρεσβευταὶ
  choice: embaixadores
  rationale: Designa representantes oficiais enviados em missão diplomática.
- source_word: Α Ἰουδαίων
  choice: dos judeus
  rationale: O alfa isolado transmitido antes de Ἰουδαίων não produz sentido claro; a expressão inteligível identifica os enviados como representantes dos judeus.
- source_word: ἀνανεούμενοι
  choice: para renovar
  rationale: Expressa naturalmente em português a finalidade da visita diplomática, isto é, tornar vigente de novo uma relação já existente.
- source_word: τὴν πρὸς ἡμᾶς φιλίαν
  choice: a amizade conosco
  rationale: Mantém o sentido lexical de φιλία e deixa que o contexto indique sua força diplomática, sem convertê-la explicitamente em 'aliança'.
