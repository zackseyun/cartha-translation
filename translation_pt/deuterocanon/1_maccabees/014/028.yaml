  yaml_path: translation/deuterocanon/1_maccabees/014/028.yaml
  text: 'At Saramel[a], in a great assembly of the priests and the people and the leaders of the nation and the elders of the country[b], it was made known to us:'
translation:
  language: pt
  text: 'Em Saramel, numa grande assembleia dos sacerdotes, do povo, dos líderes da nação e dos anciãos da terra[b], foi-nos dado a conhecer:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou: «dos governantes da nação e dos anciãos do país».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Σαραμέλ
  choice: Em Saramel
  rationale: A preposição ἐν com nome de lugar admite «em»; esta é a formulação mais natural e direta em português. O topônimo é transliterado.
- source_word: συναγωγῆς μεγάλης
  choice: numa grande assembleia
  rationale: Aqui συναγωγή designa uma reunião pública, não um edifício sinagogal. «Grande assembleia» preserva tanto a dimensão quanto o tom solene de μεγάλη.
- source_word: τῶν ἱερέων καὶ λαοῦ καὶ ἀρχόντων ἔθνους καὶ τῶν πρεσβυτέρων τῆς χώρας
  choice: dos sacerdotes, do povo, dos líderes da nação e dos anciãos da terra
  rationale: Mantém os quatro grupos coordenados do grego. «Líderes» traduz ἀρχόντων sem pressupor um cargo governamental mais específico; «nação» e «terra» refletem, respectivamente, ἔθνος e χώρα neste contexto judaico.
- source_word: ἐγνώσθη ἡμῖν
  choice: foi-nos dado a conhecer
  rationale: Preserva a voz passiva e o tom formal da fórmula que introduz a declaração, com sintaxe idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A enumeração formal do grego foi preservada, e «o seguinte» explicita de modo natural que os dois-pontos introduzem a declaração subsequente.
