  yaml_path: translation/deuterocanon/1_maccabees/014/032.yaml
  text: Then Simon rose up and fought for his nation[a], and spent much of his own money, and armed the men of his nation's forces[b], and gave them wages.
translation:
  language: pt
  text: Então Simão se levantou[b] e lutou por sua nação[a]. Gastou muito de seu próprio dinheiro, armou os homens das forças de sua nação e lhes deu soldo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego ἔθνος também pode ser traduzido aqui por “povo”; “nação” preserva o sentido político e coletivo do contexto.
    reason: lexical_alternative
  - marker: b
    text: A forma impressa no texto grego, ἀνέστησενσεν, parece conter uma sílaba duplicada, refletindo provavelmente ἀνέστησεν; o sentido é “se levantou” ou “ergueu-se”.
    reason: textual_variant
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Conector temporal e sequencial natural em português, preservando o avanço da narrativa.
- source_word: ἀνέστησενσεν
  choice: se levantou
  rationale: A forma impressa parece conter uma sílaba duplicada e refletir ἀνέστησεν; a tradução mantém tanto a ação de levantar-se quanto a ideia contextual de tomar a iniciativa.
- source_word: ἐπολέμησεν περὶ τοῦ ἔθνους αὐτοῦ
  choice: lutou por sua nação
  rationale: περὶ, neste contexto, indica ação em defesa ou em favor de alguém; a formulação portuguesa é direta e preserva o sentido político-coletivo.
- source_word: ἔθνος
  choice: nação
  rationale: Em 1 Macabeus, o termo pode designar o povo judeu como corpo nacional e político; “povo” também é possível.
- source_word: ἐδαπάνησεν χρήματα πολλὰ τῶν ἑαυτοῦ
  choice: Gastou muito do próprio dinheiro
  rationale: Expressa de modo natural tanto o grande dispêndio quanto o fato de os recursos pertencerem ao próprio Simão.
- source_word: ὡπλοδότησεν
  choice: armou
  rationale: O verbo significa fornecer armas; “armou” é conciso, exato e corrente.
- source_word: τοὺς ἄνδρας τῆς δυνάμεως τοῦ ἔθνους αὐτοῦ
  choice: os homens das forças de sua nação
  rationale: Mantém a referência masculina explícita de ἄνδρας e o valor militar de δύναμις sem restringi-lo necessariamente a um único exército formal.
- source_word: ὀψώνια
  choice: soldo
  rationale: No contexto militar, o termo designa a remuneração ou provisão de soldados; “soldo” comunica com precisão o pagamento militar.
theological_decisions:
- issue: Sentido de ἔθνος no contexto nacional judaico
  choice: nação
  alternative: povo
  rationale: “Nação” conserva a dimensão política e coletiva do texto sem projetar sobre ele formas modernas de nacionalismo.
- issue: Referência masculina em τοὺς ἄνδρας
  choice: os homens
  alternative: os soldados
  rationale: O grego faz referência explícita a homens; a tradução preserva essa especificidade em vez de neutralizá-la.
- issue: Amplitude de ὀψώνια
  choice: soldo
  alternative: pagamento; provisões
  rationale: O contexto militar favorece a remuneração dos combatentes, embora o termo possa historicamente abranger provisões; a nota preserva essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases evita uma sequência excessivamente longa sem alterar as relações sintáticas. “Soldo” é termo corrente o bastante no contexto militar e mais preciso que “salário”.
