  to: E pareceu bem ao povo receber os homens com honra e depositar uma cópia das palavras deles nos registros públicos[a], para que o povo espartano[b] tivesse uma lembrança delas; e escreveram uma cópia dessas coisas a Simão, o sumo sacerdote.
