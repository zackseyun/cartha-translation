  naturalness: O texto é claro e de registro apropriado. «Depositar uma cópia ... nos registros públicos» é natural em contexto cívico-documental e representa melhor a ação pontual aprovada pelo povo. A ordem «escreveram uma cópia dessas coisas a Simão» evita a separação algo pesada do objeto direto.
  terminology: «Povo espartano» é uma boa equivalência idiomática para τὸν δῆμον τῶν Σπαρτιατῶν, com nota literal adequada. «Sumo sacerdote» é a forma portuguesa estabelecida para ἀρχιερεύς. «Registros públicos» é defensável, desde que a nota preserve a formulação literal e o sentido de arquivos cívicos.
