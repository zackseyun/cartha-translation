  text: And it pleased the people to receive the men with honor[a], and to place a copy of their words in the public records of the people, so that the people of the Spartans might have a memorial of them[b]; and they wrote a copy of these things to Simon the high priest.
translation:
  language: pt
  text: E pareceu bem ao povo receber os homens com honra e depositar uma cópia das palavras deles nos registros públicos[a], para que o povo espartano[b] tivesse uma lembrança delas; e escreveram uma cópia dessas coisas a Simão, o sumo sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nos livros designados para o povo”, isto é, nos arquivos ou registros cívicos oficiais.
    reason: cultural_note
  - marker: b
    text: Literalmente, “o povo dos espartanos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρεσεν τῷ δήμῳ
  choice: pareceu bem ao povo
  rationale: Preserva a construção impessoal e o tom formal de uma decisão pública, em linguagem bíblica digna, mas compreensível.
- source_word: ἐπιδέξασθαι τοὺς ἄνδρας ἐνδόξως
  choice: receber os homens com honra
  rationale: Mantém ἄνδρας como “homens”, sem explicitar “enviados”, e verte o advérbio ἐνδόξως de modo natural no contexto de uma recepção cívica.
- source_word: τοῦ δέσθαι τὸ ἀντίγραφον τῶν λόγων αὐτῶν
  choice: guardar uma cópia das palavras deles
  rationale: “Guardar” expressa a colocação e conservação da cópia no arquivo; “palavras” permanece próximo de λόγων sem restringi-lo a uma mensagem específica.
- source_word: ἐν τοῖς ἀποδεδειγμένοις τῷ δήμῳ βιβλίοις
  choice: nos registros públicos
  rationale: Traduz funcionalmente os livros oficialmente destinados ao povo como arquivos ou registros cívicos, evitando uma formulação excessivamente literal e obscura.
- source_word: τοῦ μνημόσυνον ἔχειν
  choice: para que ... tivesse uma lembrança delas
  rationale: Reproduz a ideia de finalidade e conserva o sentido memorial de μνημόσυνον, sem reduzi-lo a mero registro administrativo.
- source_word: τὸν δῆμον τῶν Σπαρτιατῶν
  choice: o povo espartano
  rationale: É a forma portuguesa natural de expressar literalmente “o povo dos espartanos”, preservando a dimensão cívica de δῆμος.
- source_word: τὸ δὲ ἀντίγραφον τούτων ἔγραψαν Σίμωνι τῷ ἀρχιερεῖ
  choice: e eles escreveram a Simão, o sumo sacerdote, uma cópia dessas coisas
  rationale: Mantém o verbo “escrever”, o conteúdo documental amplo de τούτων e o dativo de destinatário, sem acrescentar que a cópia foi enviada.
