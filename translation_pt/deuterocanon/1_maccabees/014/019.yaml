lexical_decisions:
- source_word: ἀνεγνώσθησαν
  choice: foram lidas
  rationale: Aoristo passivo de ἀναγινώσκω, com referência a mensagens ou cartas mencionadas no contexto; em português, «foram lidas» expressa naturalmente a leitura perante o público sem acrescentar «em voz alta», ideia implícita no cenário, mas não explicitada pelo verbo.
- source_word: ἐνώπιον
  choice: diante da
  rationale: Traduz de modo idiomático a noção de presença perante um grupo, preservando o tom público e formal.
- source_word: ἐκκλησίας
  choice: assembleia
  rationale: Neste contexto cívico-religioso do período do Segundo Templo, designa o corpo reunido, não especificamente a igreja cristã posterior; «assembleia» evita anacronismo.
- source_word: ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Tradução locativa direta e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A concordância feminina de «lidas» pressupõe as cartas ou mensagens do contexto imediato; não se acrescenta «publicamente» nem «em voz alta», pois essas ideias são contextualmente implícitas, mas não lexicalmente expressas.
