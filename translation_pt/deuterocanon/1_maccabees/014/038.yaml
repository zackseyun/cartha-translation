lexical_decisions:
- source_word: ἔστησεν
  choice: confirmou
  rationale: No contexto político-administrativo, o verbo indica estabelecer ou manter alguém oficialmente numa função. «Confirmou» exprime a ratificação da posição de Simão sem sugerir a criação inicial do cargo.
- source_word: ἀρχιερωσύνην
  choice: o sumo sacerdócio
  rationale: O substantivo designa o cargo ou a dignidade de sumo sacerdote. «Sumo sacerdócio» é uma formulação corrente, digna e fiel.
- source_word: κατὰ ταῦτα
  choice: de acordo com isso
  rationale: A expressão remete ao que foi exposto anteriormente. Esta tradução preserva de modo natural sua referência retrospectiva, sem especificar indevidamente se se trata de termos, decisões ou circunstâncias.
- source_word: βασιλεὺς Δημήτριος
  choice: o rei Demétrio
  rationale: Emprega a ordem natural do título seguido do nome em português.
- source_word: αὐτῷ
  choice: -lhe
  rationale: O pronome dativo identifica a pessoa em cujo favor o cargo foi confirmado; a forma enclítica é concisa e natural neste registro.
