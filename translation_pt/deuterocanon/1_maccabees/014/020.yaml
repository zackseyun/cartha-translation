  text: And this is the copy of the letter that the Spartans sent—the rulers of the Spartans and the city—to Simon the high priest[a], and to the elders and the priests and the rest of the people of the Jews, their brothers[b], greetings.
translation:
  language: pt
  text: 'E esta é a cópia das cartas[a] que os espartanos enviaram — os governantes e a cidade de Esparta — a Simão, o sumo sacerdote, aos anciãos, aos sacerdotes e ao restante do povo dos judeus, seus irmãos[b]: saudações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme o sentido contextual: “da carta”. O grego traz o plural “cartas”, embora a frase introduza uma única comunicação.'
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” expressa aqui a fraternidade diplomática entre os espartanos e os judeus; o texto não define mais precisamente a natureza dessa relação.
    reason: ambiguity
lexical_decisions:
- source_word: ἀντίγραφον
  choice: cópia
  rationale: Designa uma cópia ou transcrição escrita de um documento; “cópia” é a forma mais natural e precisa neste contexto.
- source_word: ἐπιστολῶν
  choice: cartas
  rationale: Mantém o plural explícito do grego, embora a frase introduza uma única comunicação diplomática; a nota registra a possibilidade contextual do singular.
- source_word: οἱ Σπαρτιᾶται Σπαρτιατῶν ἄρχοντες καὶ ἡ πόλις
  choice: os espartanos enviaram — os governantes dos espartanos e a cidade —
  rationale: Preserva a construção grega comprimida e quase apositiva, identificando como remetentes oficiais os governantes espartanos e o corpo cívico.
- source_word: ἱερεῖ μεγάλῳ
  choice: sumo sacerdote
  rationale: É o título institucional consagrado e idiomático em português para o cargo judaico.
- source_word: πρεσβυτέροις
  choice: anciãos
  rationale: Neste contexto, refere-se a líderes reconhecidos, e não simplesmente a homens idosos.
- source_word: τῷ λοιπῷ δήμῳ τῶν Ἰουδαίων
  choice: ao restante do povo dos judeus
  rationale: Mantém a construção genitiva do grego e o sentido de δῆμος como povo ou corpo cívico, sem perder inteligibilidade.
- source_word: ἀδελφοῖς
  choice: seus irmãos
  rationale: Expressa a relação de fraternidade reivindicada diplomaticamente entre os remetentes espartanos e os destinatários judeus.
- source_word: χαίρειν
  choice: saudações
  rationale: É a fórmula epistolar convencional correspondente ao infinitivo grego, mais natural do que o sentido lexical isolado “alegrar-se”.
theological_decisions:
- issue: Título judaico ἱερεῖ μεγάλῳ
  choice: sumo sacerdote
  alternative: grande sacerdote
  rationale: “Sumo sacerdote” comunica com precisão o cargo institucional e evita a formulação literal pouco idiomática “grande sacerdote”.
- issue: Alcance de ἀδελφοῖς
  choice: seus irmãos
  alternative: irmãos
  rationale: O possessivo torna clara em português a relação diplomática de fraternidade sem especificar se ela é étnica, política ou religiosa além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem solene da saudação diplomática foi preservada; os travessões ajudam a tornar legível a construção apositiva e comprimida do grego.
