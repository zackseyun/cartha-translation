  yaml_path: translation/deuterocanon/1_maccabees/014/031.yaml
  text: And their enemies planned to invade their land[a], to destroy their land and to stretch out their hands against their holy places.
translation:
  language: pt
  text: E os inimigos deles planejaram invadir a terra deles, para devastá-la e estender as mãos contra os lugares santos deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o santuário deles” ou “as coisas sagradas deles”; o grego traz a forma plural τὰ ἅγια.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλήθησαν
  choice: planejaram
  rationale: Expressa a formação de um plano ou propósito hostil sem sugerir, além do grego, uma resolução formal.
- source_word: ἐμβατεῦσαι
  choice: invadir
  rationale: Embora o verbo possa significar entrar, o contexto militar e hostil favorece “invadir” em português corrente.
- source_word: χώραν
  choice: terra
  rationale: “Terra” é natural e suficientemente amplo para país, território ou região. Na segunda ocorrência, o pronome “-la” evita uma repetição pesada sem alterar o referente.
- source_word: τοῦ ἐκτρῖψαι
  choice: para devastá-la
  rationale: A construção indica propósito, e ἐκτρίβω comunica destruição intensa. “Devastar” se aplica naturalmente à terra e mantém a força do verbo sem sugerir necessariamente o extermínio dos habitantes.
- source_word: ἐκτεῖναι τὰς χεῖρας ἐπὶ
  choice: estender as mãos contra
  rationale: Preserva a imagem concreta do grego e, com “contra”, deixa claro o caráter hostil sem especificar a forma da agressão.
- source_word: τὰ ἅγια
  choice: os lugares santos deles
  rationale: O neutro plural pode designar lugares, recintos ou coisas sagradas. O texto principal conserva o plural e a referência possessiva, enquanto a nota registra alternativas legítimas.
theological_decisions:
- issue: Sentido cultual de τὰ ἅγια
  choice: os lugares santos deles
  alternative: o santuário deles; as coisas sagradas deles
  rationale: O grego usa o plural e não obriga a identificar o referente exclusivamente com um único santuário nem apenas com objetos sagrados. A tradução mantém essa abertura e documenta as alternativas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação conserva a imagem idiomática do original e sua ambiguidade cultual.
