  text: And the land was at rest all the days of Simon, and he sought good for his nation; and his authority and his glory were pleasing to them all his days.
translation:
  language: pt
  text: E a terra teve descanso durante todos os dias de Simão. Ele buscou o bem de sua nação, e sua autoridade e sua glória lhes agradaram durante todos os seus dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασεν
  choice: teve descanso
  rationale: Expressa a condição de tranquilidade da terra sob Simão sem sugerir necessariamente um tratado formal de paz.
- source_word: ἡ γῆ
  choice: a terra
  rationale: No contexto histórico e nacional, refere-se ao território do povo, não ao mundo inteiro.
- source_word: ἐζήτησεν ἀγαθὰ
  choice: buscou o bem
  rationale: Conserva a ideia de procurar ativamente o bem-estar, com formulação natural em português.
- source_word: τῷ ἔθνει αὐτοῦ
  choice: de sua nação
  rationale: ἔθνος designa aqui a coletividade político-étnica judaica; 'nação' preserva esse sentido corporativo.
- source_word: ἡ ἐξουσία αὐτοῦ
  choice: sua autoridade
  rationale: Representa o poder legítimo ou exercido sem intensificar o termo para 'domínio' nem reduzi-lo simplesmente a governo.
- source_word: ἡ δόξα αὐτοῦ
  choice: sua glória
  rationale: Mantém o tom elevado e a amplitude de δόξα, que pode envolver honra, reputação e esplendor.
- source_word: ἤρεσεν αὐτοῖς
  choice: lhes agradaram
  rationale: A concordância plural é natural em português para os dois sujeitos, 'autoridade' e 'glória', e preserva o sentido avaliativo.
- source_word: πάσας τὰς ἡμέρας ... πάσας τὰς ἡμέρας
  choice: durante todos os dias ... durante todos os seus dias
  rationale: Retém a repetição enfática que enquadra tanto o descanso da terra quanto a aprovação da liderança de Simão.
theological_decisions:
- issue: Elogio político da liderança de Simão
  choice: Apresentar o versículo como uma avaliação histórica positiva, sem acrescentar conotações messiânicas ou pactuais.
  alternative: Interpretar o descanso da terra como fórmula teológica explícita de paz concedida por Deus.
  rationale: O grego não atribui explicitamente o descanso à ação divina nem caracteriza Simão em termos messiânicos; a tradução conserva essa sobriedade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição do original foi preservada, e a segunda frase foi separada por ponto para maior clareza sem alterar as relações de sentido.
