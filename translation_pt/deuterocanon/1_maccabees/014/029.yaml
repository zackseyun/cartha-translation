  to: Visto que muitas vezes houve guerras na terra, Simão, filho de Matatias, descendente dos filhos de Joiaribe, e seus irmãos se expuseram ao perigo[a] e resistiram aos adversários de sua nação, para que seus lugares santos[b] e a lei permanecessem firmes, e deram grande honra à sua nação[c].
