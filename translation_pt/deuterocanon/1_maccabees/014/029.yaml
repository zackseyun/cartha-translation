base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/029.yaml
  text: Since wars had often arisen in the land[a], Simon son of Mattathias, one of the sons of Joarib, and his brothers gave themselves to danger and stood against the adversaries of their nation, so that their sanctuary and the law might stand[c][b], and they glorified their nation with great glory.
translation:
  language: pt
  text: Visto que muitas vezes houve guerras na terra, Simão, filho de Matatias, descendente dos filhos de Joiaribe, e seus irmãos se expuseram ao perigo[a] e resistiram aos adversários de sua nação, para que seus lugares santos[b] e a lei permanecessem firmes, e deram grande honra à sua nação[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “entregaram-se ao perigo”; isto é, expuseram-se voluntariamente ao risco.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu santuário” ou “suas coisas santas”. O grego emprega um plural que pode designar os recintos sagrados ou, coletivamente, aquilo que é santo.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “glorificaram sua nação com grande glória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ πολλάκις ἐγενήθησαν πόλεμοι ἐν τῇ χώρᾳ
  choice: Visto que muitas vezes houve guerras na terra
  rationale: Expressa naturalmente a relação causal e a repetição dos conflitos, preservando χώρα como o território do povo.
- source_word: ὁ υἱὸς τῶν υἱῶν Ἰωαρίβ
  choice: da linhagem dos filhos de Joiarib
  rationale: Evita a estranheza de uma reprodução palavra por palavra e comunica a pertença genealógica ou clânica indicada pela expressão grega.
- source_word: ἔδωκαν ἑαυτοὺς τῷ κινδύνῳ
  choice: se expuseram ao perigo
  rationale: Reproduz em português corrente a ideia de submissão voluntária ao risco; a alternativa mais literal consta em nota.
- source_word: ἀντέστησαν τοῖς ὑπεναντίοις
  choice: resistiram aos adversários
  rationale: Transmite resistência ativa em contexto de conflito sem intensificar necessariamente o termo para 'inimigos'.
- source_word: ὅπως σταθῇ
  choice: para que ... permanecessem firmes
  rationale: Conserva a imagem de estar ou manter-se de pé, expressando a continuidade pretendida para os elementos sagrados e a lei.
- source_word: τὰ ἅγια αὐτῶν
  choice: seus lugares santos
  rationale: Mantém o plural e parte da amplitude do grego, que pode designar os recintos sagrados ou, mais amplamente, as coisas santas.
- source_word: ὁ νόμος
  choice: a lei
  rationale: Refere-se à lei judaica/Torá, sem introduzir por capitalização uma distinção ausente do grego.
- source_word: δόξῃ μεγάλῃ ἐδόξασαν τὸ ἔθνος αὐτῶν
  choice: deram grande honra à sua nação
  rationale: Verte idiomaticamente a construção cognata grega e preserva sua ênfase por meio de 'grande honra'.
theological_decisions:
- issue: Sentido de ἔθνος no contexto judaico
  choice: nação
  alternative: povo
  rationale: O contexto público e comemorativo favorece a dimensão corporativa e nacional, sem importar concepções modernas de nacionalismo.
- issue: Referente de τὰ ἅγια αὐτῶν
  choice: seus lugares santos
  alternative: seu santuário / suas coisas santas
  rationale: O plural grego é genuinamente amplo. A tradução conserva o plural, enquanto a nota registra tanto a leitura institucional do santuário como a referência possível às coisas sagradas.
- issue: Força de δόξῃ μεγάλῃ ἐδόξασαν
  choice: deram grande honra à sua nação
  alternative: glorificaram sua nação com grande glória
  rationale: A formulação principal é natural em português e mantém a ênfase; a nota preserva a forma retórica literal do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe causal e comemorativa foi preservada, mas os idiomatismos gregos foram vertidos de modo natural. Os marcadores [a], [b] e [c] aparecem no texto principal e correspondem às notas.
