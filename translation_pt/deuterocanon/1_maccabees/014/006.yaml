  text: And he enlarged the borders of his nation, and gained control of the country.
translation:
  language: pt
  text: Ampliou as fronteiras de sua nação e passou a controlar o território.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλάτυνεν
  choice: ampliou
  rationale: Expressa naturalmente a ideia de alargar ou estender, adequada ao contexto de expansão territorial.
- source_word: τὰ ὅρια
  choice: as fronteiras
  rationale: Ὅρια designa limites ou fronteiras; a escolha preserva o sentido geopolítico concreto.
- source_word: τῷ ἔθνει αὐτοῦ
  choice: de sua nação
  rationale: Embora o dativo possa ter nuance de benefício (“para sua nação”), em português a expressão “ampliar as fronteiras de sua nação” comunica de modo natural tanto a pertença quanto o benefício, sem excluir essa nuance.
- source_word: ἐκράτησεν
  choice: passou a controlar
  rationale: Com o genitivo, κρατέω indica obter ou exercer domínio. “Passou a controlar” comunica a aquisição efetiva desse controle sem pressupor propriedade jurídica.
- source_word: τῆς χώρας
  choice: o território
  rationale: Χώρα pode significar terra, país ou região. “Território” é claro no contexto político-militar e evita sugerir necessariamente um Estado nacional moderno.
