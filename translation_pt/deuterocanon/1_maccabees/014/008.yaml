translation_notes:
  register: Português atual, claro e digno, com paralelismo fluente. O ponto e vírgula evita uma sequência pesada de orações ligadas por “e”, sem alterar a relação entre elas. O verbo “davam” foi explicitado na última oração porque o grego o deixa subentendido.
