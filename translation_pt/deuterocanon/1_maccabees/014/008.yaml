  text: And they were cultivating their land in peace[a], and the land was yielding its produce, and the trees of the fields their fruit.
translation:
  language: pt
  text: E cultivavam sua terra em paz, e a terra dava seus produtos, e as árvores dos campos[a] davam seus frutos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das planícies”. O grego πεδίων pode indicar planícies ou, de modo mais geral, campos e áreas rurais abertas.
    reason: alternativa lexical
lexical_decisions:
- source_word: γεωργοῦντες
  choice: cultivavam
  rationale: Expressa o trabalho agrícola contínuo indicado pelo particípio, em linguagem natural e sem restringi-lo à posse da terra.
- source_word: γῆν
  choice: terra
  rationale: No contexto, refere-se à terra que lhes pertencia e que era cultivada, não ao planeta ou à terra em sentido universal.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Mantém a construção nominal grega e abrange tanto tranquilidade quanto segurança.
- source_word: ἐδίδου
  choice: produzia / davam
  rationale: O imperfeito descreve uma produção contínua ou habitual; a repetição verbal na segunda oração torna explícita em português a elipse do grego.
- source_word: γενήματα
  choice: o que nela crescia
  rationale: Reproduz o sentido amplo da produção agrícola da terra sem confundi-la com os frutos das árvores mencionados em seguida.
- source_word: ξύλα
  choice: árvores
  rationale: A referência aos frutos mostra que se trata de árvores vivas, não de madeira.
- source_word: πεδίων
  choice: dos campos
  rationale: É uma formulação natural em português para terras abertas ou planas e preserva o cenário rural; a possível nuance de planícies é registrada em nota.
- source_word: καρπὸν
  choice: frutos
  rationale: Com árvores como referente, esta é a tradução mais direta e idiomática; o plural concorda naturalmente com as várias árvores.
