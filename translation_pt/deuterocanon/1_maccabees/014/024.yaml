  text: After these things Simon sent Numenius to Rome[a], carrying a large gold shield weighing a thousand minas, to establish the alliance with them.
translation:
  language: pt
  text: Depois desses acontecimentos, Simão enviou Numênio a Roma, levando um grande escudo de ouro, que pesava mil minas[a], para estabelecer a aliança com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
