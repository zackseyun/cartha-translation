lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois disso
  rationale: Expressa naturalmente a transição temporal e a ligação com os acontecimentos anteriores, sem rigidez desnecessária.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente direto e corrente do aoristo narrativo.
- source_word: Νουμήνιον
  choice: Numênio
  rationale: Forma portuguesa tradicional e transparente do nome próprio grego.
- source_word: εἰς Ῥώμην
  choice: a Roma
  rationale: A preposição direcional com nome de cidade é vertida de modo natural em português.
- source_word: ἔχοντα
  choice: levando
  rationale: O particípio modifica Numênio e indica que ele transportava consigo o presente diplomático.
- source_word: ἀσπίδα χρυσῆν μεγάλην
  choice: um grande escudo de ouro
  rationale: Preserva o tamanho e a composição material do objeto em linguagem clara e atual.
- source_word: ὁλκὴν μνῶν χιλίων
  choice: que pesava mil minas
  rationale: Torna explícita, de maneira idiomática, a relação de peso expressa pelo substantivo ὁλκή.
- source_word: εἰς τὸ στῆσαι
  choice: para firmar
  rationale: O infinitivo articular expressa finalidade; no contexto diplomático, 'firmar' comunica estabelecer ou confirmar formalmente.
- source_word: πρὸς αὐτοὺς
  choice: com eles
  rationale: Expressa naturalmente a relação entre as partes da aliança e mantém o referente pronominal do grego.
- source_word: τὴν συμμαχίαν
  choice: a aliança
  rationale: Equivalente direto para uma aliança de caráter político ou militar.
