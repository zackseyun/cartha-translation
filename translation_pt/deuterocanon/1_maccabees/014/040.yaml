base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/040.yaml
  text: For it was heard that the Jews are called friends and allies and brothers by the Romans[a], and that they received Simon’s envoys honorably.
translation:
  language: pt
  text: Pois se soube que os judeus são chamados pelos romanos de amigos, aliados e irmãos, e que os romanos receberam honrosamente os enviados de Simão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram honrosamente ao encontro dos enviados de Simão”. O verbo grego significa literalmente “foram ao encontro de”, mas, neste contexto, refere-se a uma recepção diplomática oficial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσθη
  choice: se soube
  rationale: Reproduz de modo natural em português a construção passiva impessoal e indica que a informação se tornou conhecida, sem especificar a fonte.
- source_word: προσηγορεῦνται
  choice: são chamados
  rationale: Expressa diretamente a atribuição formal desses títulos no contexto diplomático.
- source_word: φίλοι
  choice: amigos
  rationale: É o equivalente direto e preserva o possível valor diplomático do termo helenístico sem explicá-lo em excesso.
- source_word: σύμμαχοι
  choice: aliados
  rationale: É o termo político-militar corrente para participantes de uma aliança.
- source_word: οἱ ἀδελφοί
  choice: irmãos
  rationale: Mantém o masculino plural explícito e a linguagem de fraternidade própria da fórmula diplomática.
- source_word: ἀπήντησαν
  choice: receberam
  rationale: Embora o sentido literal seja “foram ao encontro de”, no contexto descreve a recepção oficial dada a representantes diplomáticos.
- source_word: πρεσβευταῖς
  choice: enviados
  rationale: Designa com clareza representantes oficiais e soa natural no português atual.
- source_word: ἐνδόξως
  choice: honrosamente
  rationale: Comunica que os enviados receberam tratamento distinto e digno de honra.
theological_decisions:
- issue: Tradução de οἱ ἀδελφοί em uma fórmula diplomática
  choice: irmãos
  alternative: parentes; irmãos e irmãs
  rationale: O grego emprega o masculino plural como designação relacional formal. A tradução conserva essa forma sem ampliá-la inclusivamente nem substituir a metáfora diplomática de fraternidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Estes” explicita que o sujeito de “receberam” são os romanos, evitando uma ambiguidade pronominal criada pela flexão verbal portuguesa. A enumeração “amigos, aliados e irmãos” preserva a fórmula diplomática e sua tensão histórica.
