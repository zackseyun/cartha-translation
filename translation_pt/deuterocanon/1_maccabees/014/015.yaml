  text: He honored the holy things and increased the vessels of the sanctuary[a][b].
translation:
  language: pt
  text: Ele honrou as coisas sagradas[a] e aumentou o número dos utensílios do santuário[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «glorificou o santuário» ou «honrou as coisas santas». A expressão grega pode referir-se tanto às coisas sagradas como, por extensão, ao santuário.
    reason: lexical_alternative
  - marker: b
    text: Isto é, os objetos e implementos sagrados usados no santuário.
    reason: cultural_note
lexical_decisions:
- source_word: τὰ ἅγια
  choice: as coisas sagradas
  rationale: O neutro plural pode designar as coisas sagradas ou, por extensão, o próprio santuário. A formulação preserva o sentido amplo e evita fundir a primeira oração com a referência explícita ao santuário na segunda.
- source_word: ἐδόξασεν
  choice: honrou
  rationale: O verbo expressa a atribuição de glória ou honra; neste contexto histórico e cultual, «honrou» é natural e mantém seu núcleo semântico.
- source_word: ἐπλήθυνεν
  choice: aumentou o número
  rationale: O verbo significa tornar mais numeroso. A expressão comunica claramente que ele ampliou a quantidade disponível.
- source_word: τὰ σκεύη
  choice: os utensílios
  rationale: Em contexto cultual, o termo designa objetos, recipientes ou implementos usados no serviço sagrado. «Utensílios» é claro em português atual, enquanto «vasos» poderia ser entendido de modo demasiadamente restrito.
- source_word: τῶν ἁγίων
  choice: do santuário
  rationale: O genitivo indica a esfera sagrada à qual pertencem os utensílios; «do santuário» transmite com clareza o referente cultual provável.
