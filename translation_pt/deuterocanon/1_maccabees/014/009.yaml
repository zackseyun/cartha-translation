  yaml_path: translation/deuterocanon/1_maccabees/014/009.yaml
  text: The elders sat in the public squares; all of them talked together about good things[a], and the young men put on splendid garments and armor.
translation:
  language: pt
  text: Os anciãos sentavam-se nas praças públicas; todos conversavam sobre coisas boas, e os jovens vestiram trajes esplêndidos[a] e trajes de guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “glórias e trajes de guerra”. Neste contexto, “glórias” provavelmente se refere a vestes esplêndidas ou adornos honrosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: anciãos
  rationale: No cenário cívico, designa os homens mais velhos e respeitados da comunidade, sem exigir que se trate de um cargo formal.
- source_word: ἐν ταῖς πλατείαις
  choice: nas praças públicas
  rationale: A expressão aponta para espaços urbanos largos e abertos onde a comunidade se reunia; esta formulação é clara e natural em português.
- source_word: ἐκάθηντο
  choice: sentavam-se
  rationale: O imperfeito apresenta uma ação habitual ou compõe a cena; o imperfeito português conserva esse aspecto.
- source_word: πάντες περὶ ἀγαθῶν ἐκοινολόγουν
  choice: todos conversavam sobre coisas boas
  rationale: Mantém tanto o caráter coletivo da conversa quanto a amplitude de ἀγαθῶν, sem restringi-lo a prosperidade, bênçãos ou assuntos específicos.
- source_word: οἱ νεανίσκοι
  choice: os jovens
  rationale: Designa os homens jovens da comunidade; em português, o masculino plural conserva adequadamente essa referência no contexto.
- source_word: ἐνεδύσαντο
  choice: vestiam
  rationale: Exprime de modo natural o ato de estar trajado, adequado à descrição da cena, sem tornar a construção reflexiva artificial.
- source_word: δόξας
  choice: trajes esplêndidos
  rationale: Embora o sentido literal seja 'glórias', no contexto de vestuário o termo sugere esplendor visível ou adornos honrosos; a nota preserva a forma incomum do grego.
- source_word: στολὰς πολέμου
  choice: trajes de guerra
  rationale: Reproduz de perto a expressão grega e preserva sua possível referência ampla a vestimenta ou equipamento militar, sem reduzi-la necessariamente a armadura.
