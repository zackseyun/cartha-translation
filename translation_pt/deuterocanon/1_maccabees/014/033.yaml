  yaml_path: translation/deuterocanon/1_maccabees/014/033.yaml
  text: And he fortified the cities of Judea[a], and Bethsura on the borders of Judea, where formerly the weapons of the enemies had been, and he stationed there a garrison of Jewish men.
translation:
  language: pt
  text: Ele fortificou as cidades da Judeia e Betsur, na fronteira da Judeia, onde antes estavam as armas dos inimigos, e pôs ali uma guarnição de homens judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homens judeanos” ou “homens da Judeia”. O termo grego pode indicar tanto a identidade judaica quanto a origem regional na Judeia.'
    reason: Alternativa lexical que preserva a ambiguidade histórica de Ἰουδαίους.
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: fortificou
  rationale: O verbo indica tornar um lugar militarmente forte por meio de defesas; “fortificou” é natural e preciso neste contexto.
- source_word: τὰς πόλεις
  choice: as cidades
  rationale: “Cidades” preserva o sentido comum do substantivo e se ajusta ao contexto administrativo e militar.
- source_word: Βαιθσουρὰμ
  choice: Betsur
  rationale: Forma portuguesa clara e tradicional do topônimo, correspondente à fortaleza fronteiriça mencionada no texto grego.
- source_word: ἐπὶ τῶν ὁρίων
  choice: na fronteira
  rationale: A expressão situa Betsur na região limítrofe da Judeia. O singular coletivo “fronteira” é mais idiomático em português sem alterar o sentido.
- source_word: ὅπλα
  choice: armas
  rationale: Equivalente direto, atual e acessível para o equipamento bélico mencionado.
- source_word: πολεμίων
  choice: inimigos
  rationale: Traduz diretamente o genitivo que identifica a quem pertenciam as armas.
- source_word: τὸ πρότερον
  choice: antes
  rationale: Expressa de modo conciso e natural o estado anterior indicado pelo grego.
- source_word: ἔθετο ἐκεῖ φρουρὰν
  choice: pôs ali uma guarnição
  rationale: No contexto militar, φρουρά designa uma força destacada para guardar o lugar; “guarnição” conserva esse sentido institucional.
- source_word: ἄνδρας Ἰουδαίους
  choice: homens judeus
  rationale: Mantém a referência masculina explícita de ἄνδρας e traduz Ἰουδαίους pelo sentido étnico-religioso mais amplo, sem ocultar em nota a alternativa regional.
theological_decisions:
- issue: Sentido de Ἰουδαίους em ἄνδρας Ἰουδαίους
  choice: homens judeus
  alternative: homens judeanos; homens da Judeia
  rationale: O termo pode indicar identidade étnico-religiosa ou procedência regional. O texto não resolve inteiramente essa nuance; por isso, a leitura principal usa “judeus” e a alternativa geográfica é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe acompanha de perto a progressão do grego, mas usa “na fronteira” e “pôs ali” para manter naturalidade. O marcador da nota foi colocado junto de “homens judeus”, expressão à qual a ambiguidade efetivamente pertence.
