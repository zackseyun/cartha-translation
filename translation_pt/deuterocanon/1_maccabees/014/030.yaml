  text: And Jonathan gathered their nation[a], and became their high priest, and was added to his people.
translation:
  language: pt
  text: E Jônatas reuniu a nação deles, tornou-se sumo sacerdote deles e foi acrescentado ao seu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi reunido ao seu povo”, expressão bíblica conhecida para indicar a morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθροισεν
  choice: reuniu
  rationale: O aoristo de ἀθροίζω indica reunir ou congregar. “Reuniu” é natural em português e preserva a ação sem especificar indevidamente o modo.
- source_word: τὸ ἔθνος αὐτῶν
  choice: a nação deles
  rationale: ἔθνος pode designar uma nação ou coletividade étnico-política. “A nação deles” mantém esse sentido corporativo e também preserva a distinção lexical em relação a λαός no fim do versículo.
- source_word: ἐγενήθη αὐτοῖς ἀρχιερεύς
  choice: tornou-se sumo sacerdote deles
  rationale: ἐγενήθη com um substantivo predicativo significa naturalmente “tornou-se”; ἀρχιερεύς é o termo habitual para “sumo sacerdote”. A formulação com “deles” expressa αὐτοῖς de modo corrente em português.
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: foi acrescentado ao seu povo
  rationale: A tradução conserva de perto a imagem do grego e não explicita além do texto o sentido convencional de morte ou reunião com os antepassados.
- source_word: λαός
  choice: povo
  rationale: λαός designa aqui o povo como coletividade. “Povo” é a equivalência portuguesa comum, clara e digna.
theological_decisions:
- issue: Expressão idiomática de morte em προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: foi acrescentado ao seu povo
  alternative: foi reunido ao seu povo
  rationale: O texto principal preserva a imagem lexical do grego. A nota registra a formulação bíblica alternativa, que comunica com mais clareza o provável sentido idiomático ligado à morte, sem transformar essa interpretação em paráfrase no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Nação” e “povo” foram mantidos distintos para refletir ἔθνος e λαός. O marcador da nota foi colocado junto à expressão que ele explica.
