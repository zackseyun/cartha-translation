  text: And copies of them were to be placed in the treasury[a], so that Simon and his sons might have them.
translation:
  language: pt
  text: E cópias deles[a] deveriam ser depositadas no tesouro, para que Simão e seus filhos as tivessem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “duplicatas” ou “transcrições”. O grego se refere a reproduções de documentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφα
  choice: cópias
  rationale: O termo designa reproduções ou duplicatas de documentos. “Cópias” é natural em português e preserva o sentido documental sem especificar indevidamente o método de reprodução.
- source_word: θέσθαι
  choice: deveriam ser depositadas
  rationale: O infinitivo retoma o conteúdo da determinação no contexto anterior. A construção expressa essa força normativa e “depositadas” combina naturalmente com a guarda oficial de documentos.
- source_word: γαζοφυλακίῳ
  choice: tesouro
  rationale: O termo pode indicar o tesouro ou a câmara do tesouro, que também servia como local seguro de depósito. “Tesouro” mantém a designação institucional concisa.
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade da determinação, expressa de modo claro e natural por “para que”.
- source_word: ἔχῃ
  choice: as tivessem
  rationale: O subjuntivo depende da oração final; o pronome feminino plural retoma “cópias”. O imperfeito do subjuntivo é exigido naturalmente pela sequência verbal em português.
