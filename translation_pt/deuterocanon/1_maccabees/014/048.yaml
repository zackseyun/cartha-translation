lexical_decisions:
- source_word: τὴν γραφὴν ταύτην
  choice: este documento
  rationale: No contexto, γραφή designa o registro escrito ou documento anteriormente citado, não a Escritura em sentido técnico.
- source_word: θέσθαι ἐν δέλτοις χαλκαῖς
  choice: fosse colocado em placas de bronze
  rationale: Preserva a formulação ampla do grego, que indica pôr o documento em placas de bronze sem explicitar o processo de inscrição.
- source_word: ἐν περιβόλῳ τῶν ἁγίων
  choice: no recinto do santuário
  rationale: περίβολος indica a área cercada ou recinto; τὰ ἅγια refere-se aqui ao lugar santo, expresso naturalmente como 'santuário'.
- source_word: ἐν τόπῳ πιστῷ
  choice: em lugar seguro
  rationale: Neste contexto físico e documental, πιστός comunica confiabilidade e segurança do local de guarda ou exposição.
