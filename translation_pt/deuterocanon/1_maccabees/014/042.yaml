  text: and that he should be their commander[a], and that he should take thought for the sanctuary, and appoint men over their works and over the country and over the weapons and over the strongholds.
translation:
  language: pt
  text: e que ele fosse o comandante deles, cuidasse das coisas sagradas[a] e nomeasse responsáveis pelas obras deles, pelo território, pelas armas e pelas fortalezas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do santuário” ou “do lugar santo”. A redação grega transmitida aqui é difícil.'
    reason: Registra alternativas plausíveis para uma expressão grega de transmissão textual incerta.
lexical_decisions:
- source_word: στρατηγόν
  choice: comandante
  rationale: Preserva o sentido militar e administrativo de στρατηγός sem impor uma patente moderna específica, como “general”.
- source_word: μέλῃ
  choice: cuidasse
  rationale: Expressa de modo natural em português a ideia de ter cuidado, interesse ou responsabilidade por algo.
- source_word: τῶν Α ἅγιον
  choice: das coisas sagradas
  rationale: A forma grega transmitida é difícil. A expressão ampla “coisas sagradas” mantém a referência ao âmbito santo sem decidir indevidamente entre o santuário, o lugar santo ou os assuntos sagrados.
- source_word: καθιστάναι
  choice: nomeasse responsáveis
  rationale: No contexto administrativo, o verbo indica designar pessoas para supervisionar determinadas áreas; “responsáveis” explicita naturalmente em português as pessoas subentendidas.
- source_word: τῶν ἔργων
  choice: pelas obras deles
  rationale: Mantém o sentido básico de ἔργα e deixa aberta a possibilidade contextual de empreendimentos, trabalhos ou assuntos administrativos.
- source_word: χώρας
  choice: pelo território
  rationale: “Território” corresponde ao sentido político e geográfico de χώρα e se ajusta ao contexto de administração pública.
- source_word: ὅπλων
  choice: pelas armas
  rationale: Equivalente moderno, claro e direto de ὅπλα.
- source_word: ὀχυρωμάτων
  choice: pelas fortalezas
  rationale: Transmite claramente a referência a lugares fortificados e preserva o caráter militar do termo.
theological_decisions:
- issue: Referente da expressão textual difícil τῶν Α ἅγιον
  choice: “das coisas sagradas” no texto principal
  alternative: “do santuário” ou “do lugar santo”
  rationale: A dificuldade é sobretudo textual e lexical. A tradução principal conserva a amplitude da linguagem grega, enquanto a nota registra as leituras mais específicas sem resolver artificialmente a incerteza.
translation_notes:
  register: Português atual, digno e de leitura ampla, com estrutura adequada ao estilo de decreto público. “Nomeasse responsáveis” evita a rigidez de uma reprodução excessivamente literal e torna explícita a função administrativa implícita. O marcador foi colocado junto à expressão textual a que a nota se refere.
