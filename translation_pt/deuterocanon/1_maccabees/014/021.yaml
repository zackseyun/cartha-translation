  text: The envoys who had been sent to our people reported to us about your glory and honor[a], and we rejoiced at their arrival.
translation:
  language: pt
  text: Os enviados que foram enviados ao nosso povo nos informaram sobre a glória e a honra de vocês[a], e nos alegramos com a chegada deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As embaixadas” ou “As delegações que foram enviadas ao nosso povo nos informaram...”. O grego οἱ πρεσβεῖαι pode referir-se tanto às missões diplomáticas quanto aos enviados como pessoas; o texto principal adota o sentido pessoal porque o versículo menciona depois “a chegada deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πρεσβεῖαι
  choice: os enviados
  rationale: Embora a forma grega possa designar embaixadas ou delegações, o sentido pessoal se harmoniza com o particípio masculino e com a referência posterior à chegada deles. “Enviados” é natural e conserva o contexto diplomático.
- source_word: οἱ ἀποσταλέντες
  choice: que tinham sido mandados
  rationale: Expressa uma ação anterior ao relato e mantém de modo natural o valor passivo do particípio.
- source_word: πρὸς τὸν δῆμον ἡμῶν
  choice: ao nosso povo
  rationale: δῆμος designa aqui o corpo cívico ou a comunidade política; “nosso povo” é claro e não excessivamente técnico.
- source_word: ἀπήγγειλαν ἡμῖν
  choice: nos falaram
  rationale: No contexto, o verbo indica a transmissão formal de notícias. “Nos falaram” evita a construção pouco natural “nos relataram sobre”, sem perder o sentido de informar.
- source_word: περὶ τῆς δόξης ὑμῶν καὶ τιμῆς
  choice: da glória e da honra de vocês
  rationale: Traduz diretamente o par δόξα e τιμή, que comunica distinção e estima públicas. “Vocês” oferece legibilidade brasileira e permanece amplamente compreensível.
- source_word: ηὐφράνθημεν
  choice: nós nos alegramos
  rationale: Preserva a intensidade e o registro digno do verbo, com o pronome explícito ajudando a marcar a mudança de sujeito.
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: com a chegada deles
  rationale: ἐφόδος pode indicar vinda, aproximação ou chegada. Aqui, a chegada dos enviados com a notícia é a leitura contextual mais natural; “com” preserva sem rigidez a relação circunstancial expressa por ἐπί.
