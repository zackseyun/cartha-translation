base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/027.yaml
  text: 'And this is the copy of the writing: On the eighteenth of Elul[a], in the one hundred seventy-second year, and this was the third year under Simon the high priest,'
translation:
  language: pt
  text: 'E esta é a cópia do documento[a]: No décimo oitavo dia de elul, no ano cento e setenta e dois, e este era o terceiro ano sob Simão, o sumo sacerdote,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «escrito». Aqui, o termo grego se refere a um registro oficial por escrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφον
  choice: cópia
  rationale: O termo designa uma cópia ou duplicata de um texto; «cópia» é natural e exato no contexto documental.
- source_word: γραφῆς
  choice: documento
  rationale: Neste contexto jurídico-administrativo, o termo se refere a um registro oficial escrito, não às Escrituras.
- source_word: Ὀκτωκαιδεκάτῃ Ἐλοὺλ
  choice: No décimo oitavo dia de elul
  rationale: O ordinal no dativo forma uma data com o nome do mês; a formulação explicita «dia» de modo natural em português.
- source_word: ἔτους δευτέρου ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: no ano cento e setenta e dois
  rationale: Reproduz com clareza a datação pelo centésimo septuagésimo segundo ano, sem acrescentar ao texto a identificação da era.
- source_word: τοῦτο τρίτον ἔτος
  choice: este era o terceiro ano
  rationale: Uma oração finita preserva o valor explicativo da expressão e soa natural em português.
- source_word: ἐπὶ Σίμωνος τοῦ ἀρχιερέως
  choice: sob Simão, o sumo sacerdote
  rationale: ἐπί com genitivo, em fórmulas cronológicas, indica o período de exercício de uma autoridade; «sumo sacerdote» é o equivalente consagrado e preciso de ἀρχιερεύς.
theological_decisions:
- issue: Sentido de γραφή neste contexto
  choice: documento
  alternative: escrito
  rationale: O contexto apresenta a cópia de um registro oficial. «Documento» evita a possível impressão de que γραφή se refira aqui às Escrituras, enquanto a nota preserva a alternativa mais literal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. Conservou-se a estrutura de fórmula documental e a vírgula final, pois a inscrição prossegue no versículo seguinte. O nome do mês foi transliterado como «elul» e grafado em minúscula conforme o uso português para meses.
