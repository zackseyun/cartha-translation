  to: E o povo viu a fidelidade[a] de Simão e a glória que ele havia decidido proporcionar à sua nação, e o constituíram seu líder e sumo sacerdote, por ter feito todas essas coisas, pela justiça[b] e pela fidelidade que havia mantido para com sua nação e por haver procurado, por todos os meios, elevar seu povo.
  rationale: A revisão elimina a inferência adicional de «Por isso», restaura a ligação coordenada do grego e melhora a expressão portuguesa do caráter continuativo de συνετήρησεν. Mantêm-se as escolhas lexicais principais e as notas, que refletem adequadamente as ambiguidades de πίστις e δικαιοσύνη.
