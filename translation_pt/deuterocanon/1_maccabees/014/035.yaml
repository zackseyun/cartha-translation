base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/035.yaml
  text: And the people saw the faithfulness of Simon and the glory that he had purposed to bring about for his nation[a], and they appointed him as their leader and high priest, because he had done all these things, and because of the righteousness and the faithfulness that he had maintained for his nation[b], and because he had sought in every way to exalt his people.
translation:
  language: pt
  text: E o povo viu a fidelidade[a] de Simão e a glória que ele havia decidido proporcionar à sua nação, e o constituíram seu líder e sumo sacerdote, por ter feito todas essas coisas, pela justiça[b] e pela fidelidade que havia mantido para com sua nação e por haver procurado, por todos os meios, elevar seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fé”, aqui e na segunda ocorrência de “fidelidade”; o grego πίστις pode indicar fé, lealdade, confiabilidade ou fidelidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão”; o grego δικαιοσύνη pode ter aqui um sentido cívico ou ético.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: fidelidade
  rationale: Neste contexto histórico e político, o termo descreve sobretudo a lealdade e a confiabilidade demonstradas por Simão para com sua nação. “Fidelidade” traduz naturalmente as duas ocorrências sem excluir por completo a amplitude de πίστις.
- source_word: δόξαν
  choice: glória
  rationale: “Glória” preserva a amplitude de δόξα, que pode envolver honra, renome e posição elevada, sem restringir o sentido a apenas um desses aspectos.
- source_word: ἐβουλεύσατο ποιῆσαι
  choice: havia decidido trazer
  rationale: A expressão indica deliberação e propósito. Em português, “havia decidido trazer” comunica de modo natural a intenção de proporcionar glória à nação.
- source_word: ἔθνει
  choice: nação
  rationale: O termo designa aqui a comunidade nacional de Simão em sentido político e coletivo.
- source_word: ἔθεντο
  choice: constituíram-no
  rationale: O verbo descreve a designação formal de Simão para uma função; “constituíram-no” conserva esse caráter institucional.
- source_word: ἡγούμενον
  choice: líder
  rationale: “Líder” mantém a generalidade do termo grego, que pode indicar alguém que dirige ou governa, sem especificar um cargo além do texto.
- source_word: ἀρχιερέα
  choice: sumo sacerdote
  rationale: É a designação corrente e historicamente adequada para o principal ofício sacerdotal judaico.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: No contexto de serviço público e compromisso com a nação, “justiça” expressa bem a conduta reta e justa de Simão, enquanto a nota preserva a alternativa “retidão”.
- source_word: συνετήρησεν
  choice: havia preservado
  rationale: O verbo composto sugere conservar ou manter algo ao longo do tempo. “Havia preservado” aplica-se naturalmente à justiça e à fidelidade de Simão para com a nação.
- source_word: ἐζήτησεν παντὶ τρόπῳ
  choice: havia procurado, por todos os meios
  rationale: A formulação transmite esforço intencional e abrangente, preservando a força de παντὶ τρόπῳ.
- source_word: ὑψῶσαι
  choice: elevar
  rationale: Aqui o verbo se refere a elevar a condição, a honra ou a posição do povo. “Elevar” mantém essa amplitude e soa natural em português.
- source_word: λαὸν
  choice: povo
  rationale: “Povo” traduz adequadamente o corpo coletivo e também preserva a distinção vocabular em relação a ἔθνος, traduzido como “nação”.
theological_decisions:
- issue: Sentido de πίστις como elogio ao caráter e à conduta de Simão
  choice: fidelidade
  alternative: fé
  rationale: A menção às ações comprovadas de Simão e àquilo que ele preservou para com a nação favorece o sentido de lealdade ou confiabilidade. A alternativa lexical “fé” é mantida em nota para não eliminar a amplitude do termo grego.
- issue: Sentido de δικαιοσύνη em contexto histórico-político
  choice: justiça
  alternative: retidão
  rationale: “Justiça” se ajusta ao possível sentido cívico e ético da palavra neste contexto, enquanto “retidão” continua sendo uma leitura plausível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção foi dividida em duas frases para evitar um período excessivamente longo, sem alterar as relações causais do grego. Mantiveram-se “glória”, “nação”, “líder”, “sumo sacerdote” e “elevar” para preservar o tom público e honorífico do contexto.
