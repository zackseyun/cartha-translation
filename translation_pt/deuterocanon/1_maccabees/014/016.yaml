lexical_decisions:
- source_word: ἤκουσεν
  choice: souberam
  rationale: Embora a forma grega esteja no singular, o verbo plural seguinte e os lugares mencionados indicam sentido coletivo ou impessoal. Em português, «souberam» expressa naturalmente que as pessoas desses lugares receberam a notícia.
- source_word: ἐν Ῥώμῃ
  choice: em Roma
  rationale: Tradução locativa direta e natural de ἐν com o nome da cidade.
- source_word: καὶ ἕως Σπάρτης
  choice: e até em Esparta
  rationale: Preserva a ideia de alcance geográfico expressa por ἕως, em formulação idiomática portuguesa.
- source_word: ἀπέθανεν
  choice: havia morrido
  rationale: O mais-que-perfeito composto esclarece que a morte de Jônatas precedeu o recebimento da notícia.
- source_word: ἐλυπήθησαν σφόδρα
  choice: ficaram profundamente entristecidos
  rationale: Expressa tanto a mudança de estado indicada pelo verbo quanto a forte intensidade de σφόδρα em linguagem atual e digna.
