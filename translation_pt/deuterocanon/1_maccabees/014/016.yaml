translation:
  language: pt
  text: Em Roma[a] e até Esparta, souberam que Jônatas havia morrido e ficaram profundamente entristecidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz o verbo «ouviu» no singular antes de «ficaram entristecidos», no plural. A tradução apresenta o sentido coletivamente: as pessoas em Roma e até Esparta souberam da notícia.'
