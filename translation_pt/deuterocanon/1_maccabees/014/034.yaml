base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/014/034.yaml
  text: And he fortified Joppa[a], which is by the sea, and Gazara, which is on the borders of Azotus, where the enemies had formerly lived; and he settled Jews there[b], and placed in them whatever was needed for their restoration.
translation:
  language: pt
  text: Ele fortificou Jope, que fica junto ao mar, e Gazara[a], situada na fronteira de Azoto, onde antes habitavam os inimigos. Estabeleceu ali judeus e pôs nessas cidades tudo o que era necessário para a restauração delas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Gezer”. O texto grego traz “Gazara”, forma helenizada do nome.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode se referir ao restabelecimento das comunidades judaicas ali instaladas, e não apenas à restauração das cidades.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠχύρωσεν
  choice: fortificou
  rationale: O verbo indica tornar um lugar militarmente seguro por meio de fortificações; “fortificou” é natural e preciso em português.
- source_word: Ἰόππην
  choice: Jope
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo grego.
- source_word: τὴν ἐπὶ τῆς θαλάσσης
  choice: que fica junto ao mar
  rationale: Expressa com naturalidade a localização marítima indicada literalmente pelo grego.
- source_word: Γάζαραν
  choice: Gazara
  rationale: Preserva a forma helenizada que consta do texto grego, sem harmonizá-la silenciosamente com Gezer.
- source_word: τὴν ἐπὶ τῶν ὁρίων Ἀζώτου
  choice: situada na fronteira de Azoto
  rationale: ὅρια designa limites ou região fronteiriça; o singular coletivo “fronteira” é idiomático em português.
- source_word: οἱ πολέμιοι
  choice: os inimigos
  rationale: Equivalente direto do adjetivo substantivado que designa os adversários.
- source_word: τὸ πρότερον
  choice: antes
  rationale: Marca de modo simples e corrente a situação anterior.
- source_word: κατῴκισεν
  choice: estabeleceu
  rationale: Comunica o valor causativo de fazer com que os judeus passassem a residir ali, sem sugerir necessariamente um reassentamento prévio.
- source_word: Ἰουδαίους
  choice: judeus
  rationale: Termo português natural que conserva as dimensões étnica, religiosa e política possíveis no contexto.
- source_word: ὅσα ἐπιτήδεια
  choice: tudo o que era necessário
  rationale: Mantém a amplitude do grego, que pode abranger recursos, provisões e outros meios necessários.
- source_word: πρὸς τὴν τούτων ἐπανόρθωσιν
  choice: para a restauração delas
  rationale: “Restauração” representa ἐπανόρθωσις sem especificar indevidamente se se trata de reparo físico ou restabelecimento comunitário; a nota registra a ambiguidade do referente.
- source_word: ἔθετο ἐν αὐτοῖς
  choice: pôs nessas cidades
  rationale: Torna explícito o referente locativo plural de αὐτοῖς em português natural, entendido como Jope e Gazara.
