  text: Este é o túmulo que ele fez em Modeim e que permanece até hoje.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάφος
  choice: túmulo
  rationale: Designa um lugar de sepultamento ou monumento funerário; “túmulo” corresponde bem à construção familiar monumental descrita no contexto.
- source_word: ἐποίησεν
  choice: fez
  rationale: Mantém o sentido amplo de ποιέω e segue de perto o grego; embora “construiu” fosse possível no contexto, “fez” é claro e natural.
- source_word: ἐν Μωδεεὶμ
  choice: em Modeim
  rationale: A preposição ἐν é representada naturalmente por “em”, e o topônimo segue uma transliteração portuguesa próxima da forma grega.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: permanece até hoje
  rationale: A expressão indica que o monumento ainda existia no tempo da narração. O verbo “permanece”, explicitado em português, evita que “até hoje” pareça modificar o ato passado de fazê-lo.
- source_word: οὗτος
  choice: Este é
  rationale: O demonstrativo identifica o monumento; a cópula, ausente na construção nominal grega, é necessária para uma frase natural em português.
