  yaml_path: translation/deuterocanon/1_maccabees/013/043.yaml
  text: In those days he encamped against Gaza and surrounded it with encampments[a], and he made a siege engine and brought it up to the city, and he struck one tower and captured it.
translation:
  language: pt
  text: Naqueles dias, ele acampou contra Gaza e a cercou com acampamentos. Construiu uma máquina de cerco[a], levou-a até a cidade, golpeou uma torre e a tomou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego helépolis designa mais precisamente um tipo de máquina de cerco usada contra cidades.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Γάζαν
  choice: acampou contra Gaza
  rationale: Preserva o sentido militar de montar acampamento diante de um alvo hostil, sem ampliar o verbo para “marchou” ou comprimi-lo em “sitiou”.
- source_word: ἐκύκλωσεν αὐτὴν παρεμβολαῖς
  choice: a cercou com acampamentos
  rationale: Reproduz separadamente a ação de cercar e o meio empregado, os acampamentos militares, mantendo a repetição lexical ligada a παρενέβαλεν.
- source_word: ἑλέπολιν
  choice: uma máquina de cerco
  rationale: Expressão clara e atual para uma máquina destinada ao ataque de cidades; uma nota registra a maior precisão do termo grego.
- source_word: προσήγαγεν τῇ πόλει
  choice: levou-a até a cidade
  rationale: Traduz o movimento da máquina em direção à cidade de modo natural, sem acrescentar detalhes sobre sua colocação ou operação.
- source_word: ἐπάταξεν πύργον ἕνα
  choice: golpeou uma torre
  rationale: Mantém a força concreta do verbo e representa πύργον ἕνα sem acrescentar a ideia não expressa de que era “uma das torres”.
- source_word: κατελάβετο
  choice: a tomou
  rationale: No contexto militar, o verbo indica apoderar-se ou capturar. O pronome retoma naturalmente a torre, o antecedente explícito mais próximo, embora o objeto esteja implícito no grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa direta. “Máquina de cerco” evita uma transliteração obscura, enquanto a nota conserva a precisão técnica do grego. O topônimo “Gaza” segue o texto grego fornecido da edição de Swete.
