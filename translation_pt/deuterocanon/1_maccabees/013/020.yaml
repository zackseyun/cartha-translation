  text: And after these things Tryphon came to enter the city and wipe it out[a], and he encircled the road to Adora[b]; and Simon and his camp marched opposite him to every place where he went.
translation:
  language: pt
  text: Depois disso, Trifão veio para entrar na cidade e destruí-la. Ele cercou a estrada para Adora[a], e Simão e seu exército marcharam em oposição a ele[b] por todos os lugares por onde ele passava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “bloqueou a estrada para Adora”. O grego diz literalmente que ele “cercou” ou “circundou” a estrada, talvez descrevendo uma manobra militar para cortar o acesso.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “marcharam paralelamente a ele” ou “avançaram diante dele”. O verbo grego pode indicar que as forças de Simão acompanhavam os movimentos de Trifão, em posição correspondente ou contrária.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Depois disso
  rationale: Transição temporal natural em português, preservando a sequência narrativa do grego.
- source_word: τοῦ ἐμβατεῦσαι εἰς τὴν πόλιν
  choice: para entrar na cidade
  rationale: O infinitivo articular com τοῦ indica propósito; “entrar” mantém o sentido básico sem acrescentar a interpretação mais forte de “invadir”.
- source_word: ἐκτρῖψαι αὐτήν
  choice: destruí-la
  rationale: No contexto militar, ἐκτρίβω expressa destruição completa; “destruí-la” é claro, digno e natural.
- source_word: ἐκύκλωσεν ὁδὸν τὴν εἰς Ἄδωρά
  choice: contornou a estrada que levava a Adora
  rationale: “Contornou” conserva a imagem espacial de κυκλόω melhor do que a interpretação militar já resolvida “bloqueou”, embora a construção grega permaneça incomum.
- source_word: Ἄδωρά
  choice: Adora
  rationale: Transliteração direta da forma grega do topônimo.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: seu exército
  rationale: παρεμβολή pode designar tanto o acampamento quanto a força acampada; aqui, como sujeito de uma marcha, “exército” comunica naturalmente o referente humano.
- source_word: ἀντιπαρῆγεν αὐτῷ
  choice: marchavam em paralelo a ele
  rationale: Expressa o acompanhamento tático dos movimentos de Trifão sem afirmar um ataque direto; a possível nuance de oposição é mantida em nota.
- source_word: εἰς πάντα τόπον οὗ ἐπορεύετο
  choice: por todos os lugares por onde ele passava
  rationale: Reproduz a ideia distributiva de que as forças de Simão correspondiam repetidamente ao trajeto de Trifão.
