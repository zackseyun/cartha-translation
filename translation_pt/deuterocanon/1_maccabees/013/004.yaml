review_pass:
  verdict: revise
  source_fidelity: A tradução de ἀπώλοντο como «foram mortos» restringe o verbo, que significa mais amplamente «pereceram»/«foram destruídos», sem explicitar necessariamente o modo de morte. «Por causa de Israel» para χάριν τοῦ Ἰσραήλ pode sugerir causa meramente ocasional; no contexto e na construção, «em favor de Israel» reproduz melhor o sentido de finalidade/benefício. «Somente eu fiquei» comunica o resultado, mas perde a voz passiva enfática de κατελείφθην.
  naturalness: O texto é claro e idiomático. A revisão proposta permanece natural em português contemporâneo e torna explícita, sem rigidez, a ênfase de «eu sozinho».
  terminology: «Pereceram» é apropriado para a morte dos irmãos sem acrescentar uma especificação não expressa pelo verbo grego. «Em favor de Israel» preserva o valor de χάριν sem impor uma leitura sacrificial além do texto.
  issues:
  - severity: medium
    issue: «Foram mortos» é mais específico que ἀπώλοντο.
    rationale: O grego afirma que os irmãos pereceram, mas o verbo não declara por si só que foram mortos por um agente.
  - severity: medium
    issue: «Por causa de Israel» enfraquece a nuance de benefício/finalidade de χάριν τοῦ Ἰσραήλ.
    rationale: Neste paralelismo com τούτου χάριν, a segunda ocorrência se entende naturalmente como «em favor de Israel» ou «por amor a Israel».
  - severity: low
    issue: «Somente eu fiquei» não preserva plenamente o passivo de κατελείφθην.
    rationale: «Só eu fui deixado» mantém a formulação passiva e a ênfase explícita em «eu».
  revised_text: Por essa razão, todos os meus irmãos pereceram em favor de Israel, e só eu fui deixado.
