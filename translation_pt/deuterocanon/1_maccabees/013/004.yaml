  text: Por essa razão, todos os meus irmãos pereceram em favor de Israel, e só eu fui deixado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπώλοντο
  choice: foram mortos
  rationale: No contexto, refere-se à morte violenta dos irmãos de Simão. A forma passiva comunica o resultado e o agente não expresso, sem recorrer ao menos natural «foram destruídos» para pessoas.
- source_word: χάριν τοῦ Ἰσραήλ
  choice: por causa de Israel
  rationale: Preserva a construção causal/final do grego e sua possível nuance de terem morrido em favor de Israel.
- source_word: κατελείφθην ἐγὼ μόνος
  choice: somente eu fiquei
  rationale: Expressa naturalmente o passivo grego e mantém a ênfase explícita em «eu» e em sua condição solitária.
theological_decisions:
- issue: Sentido da morte dos irmãos em relação a Israel
  choice: por causa de Israel
  alternative: em favor de Israel
  rationale: A expressão grega χάριν pode comportar matiz causal ou de benefício. «Por causa de» preserva melhor essa abertura sem impor uma interpretação sacrificial específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição de «por causa de» reflete a repetição de χάριν no grego e reforça a ligação lógica entre as duas orações.
