  yaml_path: translation/deuterocanon/1_maccabees/013/041.yaml
  text: In the one hundred seventy-first year[a], the yoke of the nations was removed from Israel.
translation:
  language: pt
  text: No ano cento e setenta e um, o jugo das nações[a] foi removido de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos gentios”. A palavra grega pode significar “nações” em geral ou, no uso judaico, “gentios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους ἑκατοστοῦ ἑβδομηκοστοῦ πρώτῃ
  choice: No ano cento e setenta e um
  rationale: Trata-se de uma fórmula de datação. A redação explicita a preposição exigida pelo português e expressa o número do ano de modo natural e claro.
- source_word: ὁ ζυγὸς
  choice: o jugo
  rationale: ζυγός designa literalmente um jugo e, por metáfora, domínio ou sujeição opressiva. “Jugo” preserva tanto a imagem quanto sua força histórica.
- source_word: τῶν ἐθνῶν
  choice: das nações
  rationale: ἔθνη pode significar “nações” em geral ou “gentios” no uso judaico. “Das nações” mantém o sentido lexical mais amplo e evita restringir indevidamente a expressão; a alternativa contextual é registrada em nota.
- source_word: ἀπὸ τοῦ Ἰσραήλ
  choice: de Israel
  rationale: ἀπό indica separação ou afastamento. Com “foi removido”, “de Israel” comunica naturalmente que o domínio estrangeiro deixou de pesar sobre o povo.
theological_decisions:
- issue: Se τῶν ἐθνῶν deve ser traduzido pela expressão mais ampla “das nações” ou pela expressão judaicamente marcada “dos gentios”
  choice: das nações
  alternative: dos gentios
  rationale: O contexto celebra o fim do domínio estrangeiro sobre Israel, mas o substantivo grego também é o termo comum para “nações”. A tradução principal preserva essa amplitude sem eliminar a leitura contextual possível, indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conservou-se a metáfora histórica de “jugo”, e a ambiguidade de ἔθνη foi mantida no texto e explicitada em nota.
