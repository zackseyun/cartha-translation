  yaml_path: translation/deuterocanon/1_maccabees/013/053.yaml
  text: And Simon saw that John his son was a man[a], and he appointed him commander over all the forces; and he lived in Gazara.
translation:
  language: pt
  text: Simão viu que seu filho João já era homem e o nomeou comandante de todas as forças; e ele morava em Gazara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara é a forma grega do lugar mais conhecido como Gezer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: já era homem
  rationale: A expressão preserva o sentido básico do grego e, com «já», comunica que João havia alcançado a idade adulta ou demonstrado capacidade de adulto, sem explicitar além do texto.
- source_word: ἔθετο
  choice: nomeou
  rationale: No contexto da atribuição de um posto, «nomeou» expressa de modo natural a ação administrativa indicada pelo verbo.
- source_word: ἡγούμενον
  choice: comandante
  rationale: Como o termo rege «todas as forças», trata-se de liderança militar; «comandante» é claro e idiomático.
- source_word: τῶν δυνάμεων πάσων
  choice: de todas as forças
  rationale: Aqui δυνάμεις designa forças militares, e a formulação conserva tanto a abrangência de πάσων quanto a relação com «comandante».
- source_word: ᾤκει
  choice: ele morava
  rationale: O imperfeito indica residência continuada. «Morava» transmite naturalmente esse aspecto e mantém aberta, como no grego, a referência do sujeito pronominal.
- source_word: ἐν Γαζάροις
  choice: em Gazara
  rationale: Mantém no texto principal a forma grega do topônimo, deixando a forma mais conhecida, Gezer, para a nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. A repetição «seu filho João» identifica naturalmente a relação familiar, e «ele morava» preserva a possível ambiguidade do sujeito na última oração.
