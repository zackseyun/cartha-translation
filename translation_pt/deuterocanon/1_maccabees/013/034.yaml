  yaml_path: translation/deuterocanon/1_maccabees/013/034.yaml
  text: And Simon chose men and sent them to Demetrius the king to grant remission to the land[a], because all the acts of Tryphon were acts of plundering.
translation:
  language: pt
  text: E Simão escolheu homens e os enviou ao rei Demétrio para que o rei concedesse remissão à terra[a], pois todos os atos de Trifão eram atos de pilhagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alívio à terra”. O termo grego pode indicar libertação, dispensa ou remissão, provavelmente em sentido administrativo ou fiscal neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελέξατο
  choice: escolheu
  rationale: O médio ἐπιλέγομαι tem aqui o sentido direto de escolher ou selecionar; “escolheu” é natural e conciso.
- source_word: ἄνδρας
  choice: alguns homens
  rationale: O substantivo designa homens adultos; “alguns” torna natural em português o objeto plural indefinido, sem alterar sua referência masculina.
- source_word: ἀπέστειλεν πρὸς Δημήτριον τὸν βασιλέα
  choice: os enviou ao rei Demétrio
  rationale: O pronome retoma os homens escolhidos, e “ao rei Demétrio” expressa de modo corrente o título e o nome.
- source_word: τοῦ ποιῆσαι ἄφεσιν τῇ χώρᾳ
  choice: para que concedesse remissão à terra
  rationale: ἄφεσις pode indicar soltura, dispensa ou remissão. Neste contexto político-administrativo, “remissão” conserva a amplitude do termo sem especificar impostos ou tributos que o versículo não nomeia.
- source_word: χώρᾳ
  choice: à terra
  rationale: χώρα designa terra, região ou território; “terra” preserva a formulação ampla e se ajusta ao contexto nacional.
- source_word: πᾶσαι αἱ πράξεις Τρύφωνος
  choice: todos os atos de Trifão
  rationale: πράξεις significa atos, ações ou feitos; “atos” mantém o tom histórico e formal.
- source_word: ἦσαν ἁρπασίαι
  choice: tinham sido atos de pilhagem
  rationale: ἁρπασίαι denota saques, roubos ou apropriações violentas. “Atos de pilhagem” comunica a natureza predatória das ações; o mais-que-perfeito composto situa tais atos no período anterior ao envio.
