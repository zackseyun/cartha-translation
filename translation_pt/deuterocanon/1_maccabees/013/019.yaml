lexical_decisions:
- source_word: ἀπέστειλε
  choice: enviou
  rationale: Equivalente narrativo natural do aoristo de ἀποστέλλω.
- source_word: τὰ παιδάρια
  choice: os jovens
  rationale: Preserva a referência a pessoas de pouca idade sem decidir entre 'meninos', 'rapazes' e jovens servos; no contexto, eram os reféns anteriormente exigidos.
- source_word: τὰ ἑκατὸν τάλαντα
  choice: os cem talentos
  rationale: Mantém a unidade monetária antiga e o artigo definido do grego.
- source_word: διεψεύσατο
  choice: faltou com a palavra
  rationale: No contexto, expressa conduta falsa ou enganosa concretizada no descumprimento do acordo.
- source_word: οὐκ ἀφῆκεν
  choice: não libertou
  rationale: Como Jônatas estava cativo, 'libertou' comunica com naturalidade o sentido contextual de ἀφίημι.
- source_word: τὸν Ἰωναθάν
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
