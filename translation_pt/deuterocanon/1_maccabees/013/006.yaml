  yaml_path: translation/deuterocanon/1_maccabees/013/006.yaml
  text: But I will take vengeance for my nation[a], and for the sanctuary, and for our women and children[c][b], because all the nations have gathered to wipe us out out of hatred.
translation:
  language: pt
  text: Mas tomarei vingança por minha nação, pelo santuário[a] e por nossas mulheres e crianças[b], pois todas as nações se reuniram para nos exterminar por ódio[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelas coisas santas”, “pelos lugares santos” ou “pelos santos”; a expressão grega substantivada pode ter esses sentidos.
    reason: lexical_alternative
  - marker: b
    text: Ou “por nossas esposas e crianças”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “por causa da inimizade” ou “por causa do ódio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Introduz um contraste forte com o contexto anterior de modo natural e direto em português atual.
- source_word: ἐκδικήσω
  choice: tomarei vingança
  rationale: Preserva o sentido futuro de vingar ou aplicar retribuição, adequado ao contexto militar, sem suavizar a força do verbo.
- source_word: τοῦ ἔθνους μου
  choice: por minha nação
  rationale: Refere-se à comunidade nacional judaica; “nação” conserva melhor essa dimensão coletiva e política do que “povo”.
- source_word: τῶν ἁγίων
  choice: pelo santuário
  rationale: No contexto centrado no templo de 1 Macabeus, o referente mais provável é o santuário ou recinto sagrado. A ambiguidade da expressão grega é preservada em nota.
- source_word: τῶν γυναικῶν καὶ τῶν τέκνων ἡμῶν
  choice: por nossas mulheres e crianças
  rationale: γυναῖκες pode significar “mulheres” ou “esposas”; o sentido mais amplo corresponde melhor à dimensão comunitária da enumeração, enquanto a alternativa consta em nota.
- source_word: συνήχθησαν
  choice: se reuniram
  rationale: Expressa de maneira natural a ação concluída das nações que se juntaram para atacar.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Designa os povos ou nações circundantes e evita importar um sentido técnico posterior de “gentios”.
- source_word: ἐκτρῖψαι ἡμᾶς
  choice: para nos exterminar
  rationale: Transmite claramente a ideia de erradicação completa, com força equivalente à do verbo grego e em registro digno.
- source_word: ἔχθρας χάριν
  choice: por ódio
  rationale: Expressa concisamente o motivo hostil indicado pela construção grega; a formulação mais literal é registrada em nota.
theological_decisions:
- issue: Referente de τῶν ἁγίων
  choice: o santuário
  alternative: as coisas santas; os lugares santos; os santos
  rationale: O contexto de 1 Macabeus e a preocupação recorrente com o templo favorecem “santuário”, mas a forma grega substantivada admite outros referentes; a nota mantém aberta essa ambiguidade sem impor uma conclusão doutrinária.
