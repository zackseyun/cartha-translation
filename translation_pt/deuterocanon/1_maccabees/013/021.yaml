  text: But those in the citadel kept sending envoys and urgently pressing him to come to them through the wilderness and to send them provisions[a].
translation:
  language: pt
  text: Mas os que estavam na cidadela continuavam enviando emissários e insistiam com urgência para que ele fosse até eles[a] pelo deserto e lhes enviasse provisões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “até ele”; o contexto sugere o sentido coletivo “até eles”, referindo-se aos que estavam na cidadela.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῆς ἄκρας
  choice: os que estavam na cidadela
  rationale: Ἄκρα designa aqui a cidadela fortificada; a expressão portuguesa identifica naturalmente o grupo que nela se encontrava.
- source_word: ἀπέστελλον πρεσβεύτας
  choice: continuavam enviando emissários
  rationale: O imperfeito ἀπέστελλον indica ação contínua ou repetida, enquanto πρεσβεύτας se refere a representantes oficiais.
- source_word: κατεσπούδαζον
  choice: insistiam com urgência
  rationale: A expressão preserva tanto a insistência intensa do verbo quanto o aspecto contínuo do imperfeito.
- source_word: αὐτὸν τοῦ ἐλθεῖν ... πρὸς αὐτόν
  choice: para que ele fosse até eles
  rationale: O contexto aponta para os ocupantes da cidadela como destino, embora o texto grego impresso traga o pronome singular; essa diferença é preservada em nota.
- source_word: διὰ τῆς ἐρήμου
  choice: pelo deserto
  rationale: Διά com genitivo indica o trajeto, e ἐρήμου descreve a região deserta pela qual ele deveria passar.
- source_word: ἀποστεῖλαι αὐτοῖς τροφάς
  choice: lhes enviasse provisões
  rationale: Τροφάς se refere a mantimentos ou suprimentos alimentares, e “provisões” é natural no contexto militar.
