  text: And Tryphon set out from Ptolemais with a large force to enter the land of Judah[a], and Jonathan was with him in custody;
translation:
  language: pt
  text: E Trifão partiu de Ptolemaida com um grande contingente para entrar na terra de Judá; Jônatas estava com ele sob custódia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob guarda”; a expressão grega também pode significar “na prisão”.
    reason: Preserva a amplitude semântica de ἐν φυλακῇ, que pode denotar custódia vigiada ou encarceramento.
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: O aoristo de ἀπαίρω indica a partida de um lugar. “Partiu” é direto e natural em português, sem acrescentar a ideia específica de marcha militar.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: com um grande contingente
  rationale: Neste contexto militar, δύναμις designa uma força armada. “Grande contingente” comunica a presença de numerosas tropas sem transformar o termo necessariamente em “exército”.
- source_word: εἰσελθεῖν εἰς γῆν Ἰούδα
  choice: para entrar na terra de Judá
  rationale: O infinitivo expressa a finalidade da partida. “Entrar” preserva o sentido básico e evita acrescentar explicitamente a noção de invasão, embora o contexto seja militar.
- source_word: γῆν Ἰούδα
  choice: terra de Judá
  rationale: Mantém a forma geográfica do grego e evita substituí-la pelo nome convencional posterior “Judeia”.
- source_word: ἐν φυλακῇ
  choice: sob custódia
  rationale: A expressão pode indicar detenção, guarda ou prisão. “Sob custódia” mostra que Jônatas era levado como prisioneiro sem sugerir que estivesse em um edifício prisional.
