  yaml_path: translation/deuterocanon/1_maccabees/013/027.yaml
  text: And Simon built over the tomb of his father and his brothers[a], and he raised it high to be seen[b], with dressed stone at the back and at the front.
translation:
  language: pt
  text: Simão construiu sobre o túmulo de seu pai e de seus irmãos e o ergueu bem alto, para que se destacasse à vista,[a] com pedra lavrada[b] na parte de trás e na parte da frente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanto à aparência”. A expressão grega pode descrever o monumento como visualmente imponente ou notável aos olhos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com pedra polida”. O termo grego pode indicar pedra raspada até ficar lisa ou trabalhada com esmero.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: construiu
  rationale: O aoristo de οἰκοδομέω emprega o verbo comum para construir; “construiu” é claro e natural no contexto de um monumento funerário.
- source_word: ἐπὶ τὸν τάφον
  choice: sobre o túmulo
  rationale: ἐπί com acusativo pode indicar posição sobre algo. Aqui descreve a construção de um monumento associado ao túmulo e erguido sobre ele.
- source_word: ὕψωσεν αὐτόν
  choice: o ergueu bem alto
  rationale: ὑψόω significa elevar ou tornar alto. A formulação preserva o sentido físico e identifica o monumento como referente do pronome.
- source_word: τῇ ὁράσει
  choice: para que se destacasse à vista
  rationale: A expressão dativa descreve o efeito visual do monumento. Esta redação comunica que sua altura o tornava visível ou impressionante, sem eliminar a alternativa mais literal relativa à aparência.
- source_word: λίθῳ ξυστῷ
  choice: com pedra lavrada
  rationale: ξυστός indica material raspado, alisado ou trabalhado. “Pedra lavrada” é uma expressão arquitetônica corrente e não exige o brilho que “pedra polida” poderia sugerir.
- source_word: ἐκ τῶν ὄπισθεν καὶ ἐκ τῶν ἔμπροσθεν
  choice: na parte de trás e na parte da frente
  rationale: A expressão paralela especifica os lados posterior e anterior do monumento; a redação é explícita e natural em português.
