lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: voltou
  rationale: O aoristo de ἐπιστρέφω indica aqui que Trifão voltou ou tomou o caminho de volta. «Voltou» é natural em português e preserva a progressão narrativa antes de ἀπῆλθεν.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: Neste contexto, ἀπέρχομαι descreve a partida em direção à terra de Trifão. Com «voltou» já indicando o afastamento do lugar, «foi» evita uma formulação pesada como «foi embora para».
- source_word: γῆν
  choice: terra
  rationale: γῆ pode significar terra, país ou território. «Terra» mantém a amplitude do termo grego sem impor uma definição política específica.
- source_word: αὐτοῦ
  choice: sua
  rationale: O possessivo refere-se naturalmente a Trifão. «Sua terra» é idiomático e suficientemente claro em português.
- source_word: Τρύφων
  choice: Trifão
  rationale: Emprega-se a forma portuguesa tradicional do nome grego Τρύφων.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação narrativa concisa. «Então» representa o καί que dá continuidade à sequência, evitando a repetição menos natural de «e» no início e no meio da frase.
