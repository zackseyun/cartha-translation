  text: And he made these as devices, setting up great pillars; and on the pillars he made suits of armor for an everlasting memorial, and beside the armor, ships engraved, to be seen by all who sail the sea.
translation:
  language: pt
  text: E fez delas construções elaboradas[a], dispondo ao redor grandes colunas; sobre as colunas fez armaduras completas como memorial eterno e, ao lado das armaduras, navios esculpidos, para serem vistos por todos os que navegam pelo mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: obras engenhosas; o termo grego também pode designar dispositivos ou construções concebidas com habilidade.'
    reason: Preserva a amplitude semântica de μηχανήματα sem impor o sentido moderno de máquinas.
lexical_decisions:
- source_word: μηχανήματα
  choice: estruturas elaboradas
  rationale: O termo pode indicar obras, dispositivos ou construções engenhosamente concebidas. No contexto arquitetônico do monumento funerário, “estruturas elaboradas” comunica a ideia sem sugerir máquinas no sentido moderno.
- source_word: περιθεὶς στύλους μεγάλους
  choice: dispondo grandes colunas
  rationale: O particípio περιθεὶς expressa a colocação ou disposição das colunas ao redor; a formulação portuguesa conserva essa relação espacial de modo natural.
- source_word: πανοπλίας
  choice: armaduras completas
  rationale: πανοπλία designa o conjunto completo de armas e armadura de um combatente, aqui provavelmente como representação ornamental sobre as colunas.
- source_word: εἰς ὄνομα αἰώνιον
  choice: como memorial eterno
  rationale: Literalmente, “para um nome eterno”; no contexto monumental, a expressão indica a perpetuação da memória ou renome, e “memorial eterno” transmite essa função em português claro.
- source_word: πλοῖα ἐγγεγλυμμένα
  choice: navios esculpidos
  rationale: ἐγγεγλυμμένα descreve figuras gravadas ou entalhadas; “esculpidos” se ajusta às representações incorporadas ao monumento.
