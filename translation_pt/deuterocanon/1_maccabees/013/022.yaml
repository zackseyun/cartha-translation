  yaml_path: translation/deuterocanon/1_maccabees/013/022.yaml
  text: And Tryphon prepared all his cavalry to come; but on that night there was a very great snowfall[a], and he did not come because of the snow. So he broke camp and went into the Gilead region.
translation:
  language: pt
  text: Trifão preparou toda a sua cavalaria para vir. Mas naquela noite caiu uma quantidade enorme de neve, e ele não veio por causa dela. Então partiu e foi para a região de Gileade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Galaadítide”, isto é, a região de Gileade.'
    reason: Esclarece a forma regional do nome próprio grego e sua equivalência geográfica.
lexical_decisions:
- source_word: ἡτοίμασεν
  choice: preparou
  rationale: Verbo direto e natural em contexto de preparação militar, sem especificar ações que o grego não explicita.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: toda a sua cavalaria
  rationale: A expressão coletiva designa as tropas montadas; “cavalaria” comunica com clareza o sentido militar.
- source_word: ἐλθεῖν
  choice: para vir
  rationale: Mantém o valor básico do infinitivo grego e evita acrescentar a ideia interpretativa de avançar ou atacar.
- source_word: χιών πολλὴ σφόδρα
  choice: caiu uma quantidade enorme de neve
  rationale: Expressa de modo corrente a intensidade excepcional indicada por πολλὴ σφόδρα. O contexto noturno favorece a formulação eventiva “caiu”, embora literalmente o grego diga que “havia” muita neve.
- source_word: οὐκ ἦλθεν διὰ τὴν χιόνα
  choice: ele não veio por causa dela
  rationale: Preserva tanto a declaração factual quanto a relação causal explícita, sem transformar o texto em uma afirmação de incapacidade.
- source_word: ἀπῆρεν
  choice: partiu
  rationale: Equivalente seguro e conciso para o movimento de retirada ou saída; evita tornar explícito “levantar acampamento”, detalhe apenas implícito no contexto militar.
- source_word: Γαλααδῖτιν
  choice: região de Gileade
  rationale: Identifica em português atual o distrito geográfico designado pela forma regional grega, em vez de usar uma transliteração pouco reconhecível.
