  yaml_path: translation/deuterocanon/1_maccabees/013/047.yaml
  text: And Simon came to terms with them and did not fight against them[a]. He drove them out of the city and cleansed the houses in which the idols were[b], and so he entered it with hymns and blessings.
translation:
  language: pt
  text: Simão chegou a um acordo com eles e não combateu contra eles.[a] Expulsou-os da cidade, purificou as casas em que havia ídolos[b] e, assim, entrou nela cantando hinos e proferindo bênçãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez um acordo com eles”. O particípio grego pode indicar que ele chegou a um entendimento com eles, em vez de enfrentá-los em batalha.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, casas onde havia imagens de culto pagão; a purificação provavelmente era religiosa, além de física.
    reason: cultural_note
lexical_decisions:
- source_word: συνευδὼν
  choice: chegou a um acordo com eles
  rationale: No contexto, o particípio indica que Simão chegou a um entendimento prático com os habitantes, em vez de lhes dar combate. A formulação preserva esse sentido conciliatório sem o reduzir a mera satisfação emocional.
- source_word: ἐπολέμησεν
  choice: combateu contra
  rationale: O verbo denota conflito armado. Esta expressão é clara em português atual e mantém a dimensão militar.
- source_word: ἐξέβαλεν
  choice: expulsou-os
  rationale: Preserva a força do verbo e se ajusta ao contexto político-militar, sem sugerir exorcismo.
- source_word: ἐκαθάρισεν
  choice: purificou
  rationale: A presença de ídolos confere ao ato uma dimensão religiosa, não apenas a de limpeza física.
- source_word: τὰ εἴδωλα
  choice: ídolos
  rationale: Refere-se a imagens de culto pagão; “ídolos” comunica naturalmente sua função religiosa e a avaliação implícita no contexto.
- source_word: ὑμνῶν
  choice: cantando hinos
  rationale: O particípio descreve a maneira festiva e litúrgica pela qual Simão entrou na cidade.
- source_word: εὐλογῶν
  choice: proferindo bênçãos
  rationale: Mantém o sentido lexical de abençoar e evita fundi-lo simplesmente com louvar; a expressão portuguesa também preserva alguma abertura quanto ao objeto da bênção.
theological_decisions:
- issue: Dimensão cultual da purificação das casas que continham ídolos
  choice: “purificou”, e não apenas “limpou”
  alternative: “limpou”
  rationale: A menção explícita aos ídolos aponta para a remoção de impureza religiosa. “Purificou” conserva essa dimensão sem impor um rito específico não mencionado no texto.
- issue: Sentido de εὐλογῶν na entrada celebrativa
  choice: “proferindo bênçãos”
  alternative: “louvando” ou “bendizendo a Deus”
  rationale: O grego não explicita o objeto. A tradução retém o campo semântico de bênção sem acrescentar “a Deus”, embora isso seja plausível no contexto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Chegou a um acordo” expressa naturalmente a acomodação prática; “purificou” conserva a dimensão cultual; e “cantando hinos e proferindo bênçãos” reproduz os dois particípios finais sem explicitar um objeto ausente no grego.
