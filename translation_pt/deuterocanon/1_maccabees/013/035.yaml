  text: 'And King Demetrius sent to him according to these words[a], and answered him, and wrote to him a letter like this:'
translation:
  language: pt
  text: 'E o rei Demétrio enviou-lhe uma mensagem nesses termos, respondeu-lhe[a] e escreveu-lhe uma carta como esta:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
