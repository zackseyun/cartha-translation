lexical_decisions:
- source_word: ἀπέστειλεν αὐτῷ
  choice: enviou-lhe uma mensagem
  rationale: O verbo significa “enviar” e aqui não traz objeto expresso; “uma mensagem” explicita apenas o complemento subentendido pelo contexto, sem confundi-lo com a carta mencionada em seguida.
- source_word: Δημήτριος ὁ βασιλεύς
  choice: o rei Demétrio
  rationale: Ordem natural em português para o título real seguido do nome.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: nesses termos
  rationale: Expressão portuguesa corrente para introduzir o teor de uma comunicação, correspondendo ao sentido de “segundo estas palavras”.
- source_word: ἀπεκρίθη αὐτῷ
  choice: respondeu-lhe
  rationale: Tradução direta que preserva o verbo distinto do envio e da escrita da carta, apesar da aparente redundância narrativa.
- source_word: ἔγραψεν αὐτῷ ἐπιστολήν
  choice: escreveu-lhe uma carta
  rationale: Reprodução clara e idiomática da construção grega.
- source_word: τοιαύτην
  choice: como esta
  rationale: Introduz naturalmente o conteúdo da carta que vem a seguir.
