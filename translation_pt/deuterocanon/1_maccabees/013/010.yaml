  text: And he gathered all the fighting men, and hastened to finish the walls of Jerusalem, and fortified it all around.
translation:
  language: pt
  text: Ele reuniu todos os homens de combate, apressou-se a concluir as muralhas de Jerusalém e fortificou a cidade por todos os lados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήγαγεν
  choice: reuniu
  rationale: O aoristo de συνάγω indica congregar pessoas para uma finalidade pública ou militar; “reuniu” é natural e fiel ao contexto.
- source_word: πάντας τοὺς ἄνδρας τοὺς πολεμιστάς
  choice: todos os homens de combate
  rationale: A expressão grega é explicitamente masculina e militar. “Homens de combate” preserva ambos os aspectos em português atual, sem o tom arcaico de “homens de guerra”.
- source_word: ἐτάχυνεν τοῦ τελέσαι
  choice: apressou-se a concluir
  rationale: A formulação comunica a urgência de ἐτάχυνεν e a ideia de levar a obra ao fim em τελέσαι, com sintaxe natural em português.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: as muralhas de Jerusalém
  rationale: “Muralhas” expressa com precisão as fortificações urbanas indicadas por τείχη.
- source_word: ὠχύρωσεν
  choice: fortificou
  rationale: O verbo tem sentido militar específico de tornar defensável ou reforçar por meio de fortificações; “fortificou” preserva essa força.
- source_word: αὐτὴν κυκλόθεν
  choice: a cidade por todos os lados
  rationale: O pronome feminino retoma Jerusalém. A explicitação como “a cidade” evita uma referência pronominal pouco natural ou ambígua em português, enquanto “por todos os lados” traduz claramente κυκλόθεν.
theological_decisions:
- issue: Designação militar marcada pelo gênero
  choice: todos os homens de combate
  alternative: todos os combatentes
  rationale: ἄνδρας torna explícita a referência masculina; a tradução a conserva, em vez de empregar uma forma neutra que poderia sugerir um grupo misto não indicado pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação grega foi levemente ajustada para fluidez, sem alterar a sequência das ações.
