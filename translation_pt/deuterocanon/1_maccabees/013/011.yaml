  yaml_path: translation/deuterocanon/1_maccabees/013/011.yaml
  text: And Jonathan son of Absalom sent a considerable force with him to Joppa[a], and he drove out those who were in it and remained there.
translation:
  language: pt
  text: Ele enviou Jônatas, filho de Absalão, a Jope, com uma força considerável. Jônatas expulsou os que estavam na cidade e permaneceu ali, dentro dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “permaneceu ali nela”, repetindo a indicação de lugar, possivelmente para enfatizar que Jônatas ficou dentro da própria cidade.'
    reason: A nota registra a duplicação locativa ἐκεῖ ἐν αὐτῇ e sua possível função enfática.
lexical_decisions:
- source_word: ἀπέστειλεν Ἰωνάθαν τὸν τοῦ Ἀψαλώμου
  choice: ele enviou ... Jônatas, filho de Absalão
  rationale: O acusativo Ἰωνάθαν mostra que Jônatas é o objeto de ἀπέστειλεν, não o sujeito. O sujeito permanece implícito no grego e é representado por “ele”, conforme o contexto narrativo.
- source_word: καὶ μετʼ αὐτοῦ δύναμιν ἱκανὴν
  choice: acompanhado de uma força considerável
  rationale: δύναμις designa aqui uma força militar, e ἱκανή indica efetivo suficiente ou substancial. A formulação portuguesa expressa naturalmente que as tropas foram enviadas com Jônatas.
- source_word: εἰς Ἰόππην
  choice: a Jope
  rationale: A preposição direcional εἰς com o nome da cidade é vertida naturalmente por “a”; “Jope” é a forma portuguesa tradicional e reconhecível do topônimo.
- source_word: ἐξέβαλεν
  choice: expulsou
  rationale: No contexto militar e político, “expulsou” transmite com precisão a remoção forçada sem acrescentar detalhes não presentes no texto.
- source_word: τοὺς ἐν αὐτῇ ὄντας
  choice: os que estavam na cidade
  rationale: A expressão grega não identifica essas pessoas como habitantes permanentes. “Os que estavam” conserva essa indeterminação, enquanto “na cidade” torna claro o referente do pronome feminino.
- source_word: ἔμεινεν ἐκεῖ ἐν αὐτῇ
  choice: permaneceu ali, dentro dela
  rationale: A tradução conserva os dois elementos locativos, ἐκεῖ e ἐν αὐτῇ, de modo compreensível em português, sem eliminar a possível ênfase em permanecer dentro da própria cidade.
theological_decisions:
- issue: Sujeito de ἀπέστειλεν e das ações seguintes
  choice: O primeiro verbo recebe o sujeito implícito “ele”; Jônatas é explicitado como agente das ações seguintes.
  alternative: Tratar Jônatas como sujeito de “enviou”, conforme a camada inglesa, ou manter “ele” também nas ações seguintes.
  rationale: A morfologia grega põe Ἰωνάθαν no acusativo, portanto como pessoa enviada. Nas orações seguintes, o sujeito não é expresso; o contexto e a sequência natural da missão favorecem Jônatas como agente, embora o grego em si permita alguma ambiguidade referencial.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A divisão em duas frases evita atribuir erroneamente o primeiro verbo a Jônatas e esclarece a progressão narrativa sem acrescentar identidade aos expulsos.
