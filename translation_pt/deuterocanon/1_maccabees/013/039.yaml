base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/039.yaml
  text: But we forgive you the oversights and the sins up to this present day[a], and the crown tax that you owed; and if anything else was being levied in Jerusalem[b], let it no longer be levied.
translation:
  language: pt
  text: Além disso, nós vos perdoamos as faltas cometidas por ignorância e os pecados até o dia de hoje[a], bem como cancelamos o tributo da coroa[b] que devíeis. E, se algum outro imposto era cobrado em Jerusalém, que não seja mais cobrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os erros involuntários e os pecados até hoje».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «a coroa»; neste contexto, provavelmente um tributo ou imposto devido ao poder real.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίεμεν
  choice: nós vos perdoamos … e cancelamos
  rationale: O verbo pode significar perdoar, remitir ou liberar. Como rege tanto faltas e pecados quanto uma obrigação fiscal, a tradução distribui seu sentido em dois verbos naturais em português, sem reduzir a dimensão moral nem obscurecer o cancelamento financeiro.
- source_word: ἀγνοήματα
  choice: faltas cometidas por ignorância
  rationale: Expressa ações erradas decorrentes de ignorância ou inadvertência e as distingue dos «pecados» mencionados em seguida.
- source_word: ἁμαρτήματα
  choice: pecados
  rationale: Preserva a força moral do termo grego e o contraste deliberado com as faltas cometidas por ignorância.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: até o dia de hoje
  rationale: Reproduz com naturalidade e solenidade moderada o limite temporal da remissão.
- source_word: στέφανον
  choice: tributo da coroa
  rationale: Embora signifique literalmente «coroa», neste contexto administrativo designa uma obrigação fiscal ligada ao poder real. «Tributo da coroa» mantém a imagem lexical e esclarece a função.
- source_word: ὠφείλετε
  choice: que devíeis
  rationale: O imperfeito indica uma obrigação pendente; a forma escolhida preserva o tom formal do decreto.
- source_word: εἴ τι ἄλλο
  choice: se qualquer outra coisa
  rationale: Mantém aberta a categoria adicional de cobrança, sem especificar um imposto que o texto não identifica.
- source_word: ἐτελωνεῖτο
  choice: vinha sendo cobrada como imposto
  rationale: O verbo pertence ao campo da tributação e arrecadação; a formulação explicita esse sentido administrativo mantendo o aspecto contínuo.
- source_word: μηκέτι τελωνιζέσθω
  choice: que não seja mais cobrada
  rationale: Preserva a proibição formal e a voz passiva, evitando repetição pesada de «como imposto».
theological_decisions:
- issue: Se ἁμαρτήματα deve receber linguagem explicitamente moral em um decreto régio
  choice: pecados
  alternative: ofensas; transgressões
  rationale: Apesar do contexto político e fiscal, o grego emprega um termo moral comum ao lado de ἀγνοήματα. «Pecados» preserva essa tensão em vez de secularizar o texto.
- issue: Se στέφανον deve ser traduzido literalmente ou como termo fiscal
  choice: tributo da coroa
  alternative: coroa; imposto real
  rationale: «Coroa» isoladamente poderia sugerir um objeto físico, enquanto o contexto trata de dívida e arrecadação. A escolha conserva a imagem da coroa e comunica o sentido fiscal provável.
translation_notes:
  register: Português moderno, digno e acessível, com leve formalidade adequada a um decreto régio. Emprega-se «vos» para conservar o plural dirigido à comunidade e «devíeis» para harmonizar com esse tratamento. A repetição semântica de ἀφίεμεν foi vertida por «perdoamos» no campo moral e «cancelamos» no fiscal, visando clareza natural.
