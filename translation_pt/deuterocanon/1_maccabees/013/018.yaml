translation:
  language: pt
  text: 'dizendo: “Foi porque eu não lhe enviei a prata e os rapazes[a] que ele pereceu[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os meninos”, “os jovens” ou “os jovens servos”. O termo grego παιδάρια pode indicar crianças ou jovens e também jovens que servem ou acompanham alguém.
    reason: lexical_alternative
  - marker: b
    text: Ou “morreu”, “foi destruído” ou “foi arruinado”. O verbo grego ἀπώλετο pode indicar perecimento ou destruição; o contexto favorece a compreensão de que ele morreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém a forma participial que introduz a fala, sem explicitar além do grego quem falaria.
- source_word: Ὅτι
  choice: Foi porque
  rationale: Introduz a explicação causal e, com a construção enfática «Foi porque... que», expressa com naturalidade em português a relação entre a omissão alegada e a morte.
- source_word: οὐκ ἀπέστειλα
  choice: eu não lhe enviei
  rationale: O pretérito perfeito traduz naturalmente o aoristo e conserva a primeira pessoa da fala; «lhe» representa o objeto indireto αὐτῷ.
- source_word: τὸ ἀργύριον
  choice: a prata
  rationale: Preserva a imagem concreta do grego, embora o termo também possa designar dinheiro.
- source_word: τὰ παιδάρια
  choice: os rapazes
  rationale: O diminutivo pode designar meninos ou jovens e, em certos contextos, jovens servos; «rapazes» conserva a referência etária sem impor uma função social.
- source_word: ἀπώλετο
  choice: ele morreu
  rationale: No contexto, o verbo de destruição indica que a pessoa perdeu a vida. «Morreu» é português claro e natural, enquanto a nota registra a formulação mais literal e sua amplitude.
