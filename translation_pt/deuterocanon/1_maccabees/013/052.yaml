  yaml_path: translation/deuterocanon/1_maccabees/013/052.yaml
  text: And he established it as a yearly observance to celebrate this day. And he fortified the hill of the sanctuary beside the citadel[a], and he lived there, he and those with him.
translation:
  language: pt
  text: E instituiu a celebração anual desse dia. Também fortificou o monte do santuário, junto à cidadela[a], e morava ali, ele e os que estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto à Acra”; ἄκρα pode referir-se especificamente à fortaleza selêucida em Jerusalém, e não a uma cidadela em sentido genérico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν κατʼ ἐνιαυτὸν τοῦ ἄγειν
  choice: determinou que todos os anos se celebrasse
  rationale: Expressa a instituição de uma celebração anual em português natural, preservando tanto o caráter permanente de ἔστησεν quanto a repetição anual e o sentido festivo de ἄγειν com ἡμέραν.
- source_word: τὴν ἡμέραν ταύτην
  choice: esse dia
  rationale: O demonstrativo retoma, no fluxo narrativo, o dia mencionado anteriormente; “esse dia” é a forma dêitica mais natural neste contexto em português moderno.
- source_word: προσωχύρωσεν
  choice: fortificou
  rationale: O verbo composto indica reforço ou acréscimo de defesas; “fortificou” comunica com precisão a ação militar sem tornar a frase pesada.
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: o monte do santuário
  rationale: Mantém os sentidos básicos de ὄρος e ἱερόν e evita introduzir no texto principal a designação técnica posterior “Monte do Templo”.
- source_word: τὸ παρὰ τὴν ἄκραν
  choice: junto à cidadela
  rationale: παρά com acusativo indica proximidade espacial. ἄκρα pode ser entendido como substantivo comum, “cidadela”, embora talvez designe especificamente a fortaleza selêucida chamada Acra; essa alternativa é preservada em nota.
- source_word: ᾤκει
  choice: passou a morar
  rationale: No contexto narrativo, o imperfeito descreve a residência de Simão naquele lugar após a fortificação. A formulação portuguesa comunica a instalação e a continuidade da moradia sem recorrer ao arcaísmo “habitou”.
- source_word: οἱ παρʼ αὐτοῦ
  choice: os que estavam com ele
  rationale: Preserva a amplitude da expressão grega, que pode abranger companheiros, membros da casa ou séquito, sem identificar o grupo de modo mais específico do que a fonte permite.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e vocabulário bíblico não arcaizante. A repetição inicial de καί é representada por “E” e “Também”, evitando monotonia sem apagar a coordenação narrativa. A ambiguidade histórica de ἄκρα é mantida por meio de nota.
