  yaml_path: translation/deuterocanon/1_maccabees/013/014.yaml
  text: And Tryphon learned that Simon had arisen in place of Jonathan his brother, and that he was about to engage him in war; and he sent envoys to him, saying,
translation:
  language: pt
  text: 'E Trifão soube que Simão havia se levantado em lugar de Jônatas, seu irmão[a], e que estava prestes a entrar em guerra contra ele[b]. Então enviou-lhe emissários, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “havia tomado o lugar de Jônatas” ou “havia surgido em lugar de Jônatas”. O grego pode indicar que Simão se levantou como sucessor, não apenas que se pôs fisicamente de pé.
    reason: lexical_alternative
  - marker: b
    text: Ou “travar batalha contra ele” ou “fazer guerra contra ele”. A expressão grega é um modo de dizer que alguém entra em conflito armado com outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: soube
  rationale: O aoristo de γινώσκω indica que Trifão tomou conhecimento da situação; “soube” expressa naturalmente esse sentido eventivo em português.
- source_word: ἀνέστη
  choice: havia se levantado
  rationale: Preserva a imagem de ἀνίστημι e, em conjunto com ἀντί, comunica o surgimento de Simão como líder no lugar de Jônatas.
- source_word: ἀντὶ Ἰωνάθου
  choice: em lugar de Jônatas
  rationale: ἀντί indica substituição ou sucessão; “em lugar de” permanece próximo do grego sem explicitar além dele uma função sucessória formal.
- source_word: συνάπτειν αὐτῷ ... εἰς πόλεμον
  choice: entrar em guerra contra ele
  rationale: A expressão grega é idiomática para iniciar ou travar conflito armado com alguém; esta formulação é clara e natural em português.
- source_word: μέλλει
  choice: estava prestes a
  rationale: μέλλω assinala ação iminente ou esperada; “estava prestes a” conserva a iminência sem afirmar que o conflito já havia começado.
- source_word: ἀπέστειλεν ... πρέσβεις
  choice: enviou-lhe emissários
  rationale: πρέσβεις designa representantes enviados para uma comunicação de caráter político, não simples portadores de recado; “emissários” preserva essa nuance.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio introduz a fala que continua no versículo seguinte; “dizendo” mantém adequadamente a frase aberta.
