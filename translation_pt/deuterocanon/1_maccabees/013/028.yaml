  text: And he set up seven pyramids[a], one opposite the other, for his father and mother and four brothers.
translation:
  language: pt
  text: Ergueu sete pirâmides, uma diante da outra[a], para seu pai, sua mãe e seus quatro irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma em frente à outra». A expressão grega descreve os monumentos dispostos uns diante dos outros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησεν
  choice: Ergueu
  rationale: No contexto da construção de monumentos funerários, «ergueu» expressa de modo natural e concreto o ato de levantar ou edificar as estruturas.
- source_word: ἑπτὰ πυραμίδας
  choice: sete pirâmides
  rationale: Traduz diretamente πυραμίδας sem definir além do texto a forma arquitetônica exata dos monumentos.
- source_word: μίαν κατέναντι τῆς μιᾶς
  choice: uma diante da outra
  rationale: Preserva a ideia de disposição recíproca, com cada monumento voltado ou situado em frente a outro, em português corrente.
- source_word: τῷ πατρὶ καὶ τῇ μητρὶ
  choice: para seu pai, sua mãe
  rationale: Os dativos indicam finalidade dedicatória ou comemorativa; «seu» é suprido naturalmente pelo contexto familiar.
- source_word: τέσσαρσιν ἀδελφοῖς
  choice: seus quatro irmãos
  rationale: Aqui ἀδελφοῖς designa irmãos do sexo masculino; o possessivo explicita em português a relação já evidente no contexto.
