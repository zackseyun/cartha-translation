lexical_decisions:
- source_word: πολέμησον
  choice: Lute
  rationale: O imperativo aoristo de πολεμέω pede ação militar direta. “Lute” é conciso, natural e mantém a força da ordem.
- source_word: τὸν πόλεμον ἡμῶν
  choice: a nossa batalha
  rationale: O acusativo cognato reforça o verbo, enquanto ἡμῶν expressa o envolvimento pessoal dos que falam. “A nossa batalha” preserva ambos os aspectos com naturalidade.
- source_word: πάντα ὅσα ἐὰν εἴπῃς ἡμῖν
  choice: tudo o que você nos disser
  rationale: A construção comunica disposição abrangente para obedecer a futuras instruções. “Tudo o que você nos disser” é clara e conserva o valor prospectivo do subjuntivo.
- source_word: ποιήσομεν
  choice: faremos
  rationale: O futuro de ποιέω expressa aqui o compromisso de cumprir as instruções, sem necessidade de tornar explícita uma interpretação adicional.
