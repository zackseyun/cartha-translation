base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/033.yaml
  text: And Simon built up the stronghold of Judea[a], and he surrounded it with high towers and great walls and gates and bars[b], and he placed provisions in the strongholds.
translation:
  language: pt
  text: Simão construiu a fortaleza da Judeia e a cercou com torres altas, grandes muralhas, torres, portões e trancas.[a] E armazenou mantimentos nas fortalezas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego repete “torres” na lista das estruturas defensivas; a tradução conserva essa repetição.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pôs alimentos nas fortalezas”. No contexto militar, “armazenou mantimentos” expressa o sentido de provisões destinadas à defesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: construiu
  rationale: O verbo significa basicamente “construir” ou “edificar”. “Construiu” é natural em português e evita especificar além do grego se Simão ergueu a fortaleza do zero ou reforçou uma estrutura existente.
- source_word: τὸ ὀχύρωμα τῆς Ἰουδαίας
  choice: a fortaleza da Judeia
  rationale: ὀχύρωμα designa um lugar fortificado ou uma fortaleza. Mantém-se o singular do texto grego e a relação genitiva direta com a Judeia.
- source_word: περιετείχισεν
  choice: a cercou
  rationale: O verbo indica cercar com muralhas ou fortificações. O pronome retoma “a fortaleza”, enquanto a lista seguinte explicita os elementos defensivos usados.
- source_word: πύργοις ὑψηλοῖς καὶ τείχεσιν μεγάλοις καὶ πύργοις καὶ πύλαις καὶ μοχλοῖς
  choice: com torres altas, grandes muralhas, torres, portões e trancas
  rationale: A tradução conserva a sequência arquitetônica e a repetição de πύργοις (“torres”) presente no grego. μοχλοῖς refere-se às barras ou trancas que prendiam os portões; “trancas” comunica naturalmente essa função.
- source_word: ἔθετο βρώματα
  choice: armazenou mantimentos
  rationale: Literalmente, a expressão indica que ele pôs alimentos. No contexto militar, “armazenou mantimentos” transmite com clareza a provisão de comida para as fortalezas.
- source_word: ἐν τοῖς ὀχυρώμασιν
  choice: nas fortalezas
  rationale: Preserva-se o plural do grego, mesmo após o singular “a fortaleza” no início do versículo, sem harmonizar a mudança de número.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário militar amplamente compreensível. A redação preserva tanto a repetição de “torres” quanto a alternância entre o singular “fortaleza” e o plural “fortalezas” no texto grego.
