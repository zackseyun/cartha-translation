base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/051.yaml
  text: And he entered it on the twenty-third day of the second month, in the one hundred seventy-first year, with praise and palm branches and with harps and cymbals and stringed instruments and with hymns and songs, because a great enemy had been crushed out of Israel.
translation:
  language: pt
  text: E ele entrou nela no vigésimo terceiro dia do segundo mês, no ano cento e setenta e um, com louvores e ramos de palmeira, ao som de harpas[a], címbalos e instrumentos de cordas[b], com hinos e cânticos, porque um grande inimigo havia sido esmagado de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “liras”; a identificação exata do instrumento grego κινύρα é incerta.
    reason: lexical_alternative
  - marker: b
    text: O grego se refere a um instrumento de cordas específico, a νάβλα, cuja correspondência moderna é incerta; também se traduz por “harpas” ou “saltérios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν εἰς αὐτήν
  choice: entrou nela
  rationale: Traduz diretamente o movimento para dentro e mantém o pronome feminino grego, que retoma a cidadela mencionada no contexto anterior.
- source_word: τῇ τρίτῃ καὶ εἰκάδι τοῦ δευτέρου μηνός
  choice: no vigésimo terceiro dia do segundo mês
  rationale: Expressa em português corrente a fórmula calendárica grega, literalmente 'no terceiro e vigésimo'.
- source_word: ἔτους ἑνὸς καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: no ano cento e setenta e um
  rationale: Preserva exatamente a datação da era selêucida em formulação portuguesa natural.
- source_word: μετὰ αἰνέσεως
  choice: com louvores
  rationale: O plural idiomático em português comunica a aclamação celebrativa sem restringi-la a ações de graças.
- source_word: βαΐων
  choice: ramos de palmeira
  rationale: Identifica claramente os ramos usados na celebração pública.
- source_word: κινύραις
  choice: harpas
  rationale: Equivalente tradicional e compreensível para esse antigo instrumento de cordas, cuja identificação exata permanece incerta.
- source_word: κυμβάλοις
  choice: címbalos
  rationale: Correspondência direta e corrente para o instrumento de percussão.
- source_word: νάβλαις
  choice: instrumentos de cordas
  rationale: Mantém a categoria musical sem impor uma identificação moderna excessivamente precisa ao instrumento antigo.
- source_word: ὕμνοις καὶ ᾠδαῖς
  choice: hinos e cânticos
  rationale: Preserva a distinção entre os dois termos musicais em linguagem digna e facilmente compreensível.
- source_word: συνετρίβη ἐχθρὸς μέγας ἐξ Ἰσραήλ
  choice: um grande inimigo havia sido esmagado e expulso de Israel
  rationale: Reproduz a voz passiva de συνετρίβη e explicita o valor separativo de ἐξ, indicando a remoção do inimigo do meio de Israel.
theological_decisions:
- issue: Caráter da celebração
  choice: Linguagem pública de louvor, música e vitória
  alternative: Empregar terminologia litúrgica mais técnica ou acrescentar conotações messiânicas
  rationale: O grego descreve uma celebração pela libertação de um inimigo, mas não exige uma leitura litúrgica posterior nem expansão tipológica.
- issue: Agente do esmagamento do inimigo
  choice: Manter a construção passiva sem nomear o agente
  alternative: Explicitar que Deus ou Simão esmagou o inimigo
  rationale: O texto grego não identifica gramaticalmente o agente; nomeá-lo resolveria indevidamente uma abertura do texto.
- issue: Identificação dos instrumentos antigos
  choice: Usar equivalentes acessíveis e registrar a incerteza em notas
  alternative: Empregar somente nomes técnicos ou arcaicos como 'saltérios'
  rationale: A identificação organológica de κινύρα e νάβλα não é inteiramente segura; a tradução deve ser legível sem apresentar uma precisão inexistente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a solenidade narrativa sem arcaísmos desnecessários; as notas preservam a incerteza legítima quanto aos instrumentos antigos.
