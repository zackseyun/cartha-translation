  text: And now[a], far be it from me to spare my life in any time of distress; for I am not better than my brothers.
translation:
  language: pt
  text: E agora, que eu jamais poupe minha vida[a] em tempo de aflição, pois não sou melhor do que meus irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poupar a mim mesmo”; literalmente, “poupar minha vida/alma”. Aqui, ψυχή se refere à vida, e não à alma imaterial.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή μοι γένοιτο
  choice: longe de mim
  rationale: Expressão idiomática portuguesa que comunica com naturalidade a forte rejeição expressa pelo optativo grego.
- source_word: φείσασθαί μου τῆς ψυχῆς
  choice: poupar a minha vida
  rationale: Neste contexto, ψυχή designa a vida ou a própria pessoa, não especificamente a alma imaterial; o genitivo com φείδομαι expressa a ideia de preservar a própria vida.
- source_word: ἐν παντὶ καιρῷ θλίψεως
  choice: em qualquer tempo de aflição
  rationale: Preserva a força distributiva de παντί e traduz θλῖψις como sofrimento ou adversidade opressiva, em linguagem digna e compreensível.
- source_word: οὐ γάρ εἰμι κρείσσων
  choice: pois não sou melhor
  rationale: κρείσσων pode significar melhor, mais forte ou superior; aqui a comparação com o destino dos irmãos favorece 'melhor', sem explicitar uma superioridade específica.
- source_word: τῶν ἀδελφῶν μου
  choice: do que meus irmãos
  rationale: No contexto narrativo, ἀδελφοί se refere aos irmãos literais de Simão; a tradução direta é natural e precisa.
