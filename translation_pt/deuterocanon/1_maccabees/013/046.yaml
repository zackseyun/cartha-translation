  text: And they said, “Do not deal with us according to our wickedness, but according to your mercy.”
translation:
  language: pt
  text: 'E disseram: “Não nos trates segundo as nossas maldades, mas segundo a tua misericórdia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρήσῃ
  choice: trates
  rationale: O verbo χράομαι, construído aqui com dativo e uma expressão introduzida por κατά, descreve a maneira de proceder para com alguém. “Tratar” é natural em português e preserva esse sentido relacional.
- source_word: κατὰ τὰς πονηρίας ἡμῶν
  choice: segundo as nossas maldades
  rationale: O plural πονηρίας pode indicar manifestações ou atos de maldade. O plural “maldades” mantém essa forma e sua força moral sem restringir o sentido apenas a atos específicos.
- source_word: ἔλεός
  choice: misericórdia
  rationale: ἔλεος denota misericórdia ou compaixão. “Misericórdia” reproduz diretamente o contraste entre o castigo merecido e a clemência pedida.
- source_word: Μὴ ἡμῖν χρήσῃ
  choice: Não nos trates
  rationale: A construção expressa um pedido negativo direto. “Não nos trates” é corrente, claro e adequado ao tom de súplica.
theological_decisions:
- issue: Contraste penitencial entre a consequência merecida da maldade e a misericórdia
  choice: Manter a súplica para que sejam tratados segundo a misericórdia do interlocutor, não segundo suas maldades.
  alternative: Explicitar julgamento divino, perdão ou linguagem de aliança.
  rationale: O grego apresenta o contraste de modo direto, sem identificar neste versículo o interlocutor como Deus nem acrescentar categorias doutrinárias. A tradução conserva essa tensão e evita explicitação indevida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção paralela “segundo... mas segundo...” foi preservada por sua concisão e força retórica.
