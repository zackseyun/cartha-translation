lexical_decisions:
- source_word: ἀνεζωπύρισεν
  choice: se reanimou
  rationale: O verbo evoca reacender ou fazer reviver. Em português, “se reanimou” comunica naturalmente a renovação do ânimo e da disposição do povo, sem tornar excessivamente explícita a imagem de fogo.
- source_word: τὸ πνεῦμα
  choice: o espírito
  rationale: Mantém o sentido literal e a metáfora do grego; no contexto, refere-se ao ânimo ou à determinação interior do povo.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: do seu povo
  rationale: Preserva o genitivo possessivo e a relação pessoal expressa por αὐτοῦ.
- source_word: ἀκοῦσαι
  choice: ao ouvir
  rationale: O infinitivo indica a ocasião em que o espírito do povo se reanimou. “Ao ouvir” é conciso, natural e preserva essa relação temporal.
- source_word: τῶν λόγων τούτων
  choice: essas palavras
  rationale: λόγων remete ao discurso precedente. Em português, “essas palavras” retoma naturalmente o que acabara de ser dito.
