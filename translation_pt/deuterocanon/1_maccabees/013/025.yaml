  text: And Simon sent and took the bones of Jonathan his brother[a], and buried him in Modein, the city of his fathers.
translation:
  language: pt
  text: Então Simão enviou e tomou os ossos de Jônatas, seu irmão, e o sepultou em Modeim, cidade de seus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: mandou buscar
  rationale: Embora o verbo signifique literalmente «mandou», o objeto da missão fica implícito e a sequência com ἔλαβεν indica o envio para trazer os ossos. «Mandou buscar» exprime isso naturalmente em português sem especificar quem foi enviado.
- source_word: ἔλαβεν τὰ ὀστᾶ
  choice: buscar os ossos
  rationale: A construção grega diz literalmente «tomou os ossos». No contexto do envio e da transferência dos restos mortais, «buscar os ossos» é claro e idiomático, preservando o termo concreto «ossos».
- source_word: Ἰωναθὰν τοῦ ἀδελφοῦ αὐτοῦ
  choice: de seu irmão Jônatas
  rationale: A ordem portuguesa identifica naturalmente Jônatas como irmão de Simão, sem acrescentar ênfase ausente no grego.
- source_word: ἔθαψεν αὐτόν
  choice: o sepultou
  rationale: «Sepultou» é uma tradução corrente e digna do verbo comum para enterrar; o pronome retoma Jônatas, como faz o singular grego apesar de «ossos» estar no plural.
- source_word: ἐν Μωδεεὶμ
  choice: em Modeim
  rationale: Mantém a preposição locativa e translitera a forma grega do topônimo de maneira legível em português.
- source_word: πόλει τῶν πατέρων αὐτοῦ
  choice: cidade de seus antepassados
  rationale: O grego diz literalmente «cidade de seus pais», mas πατέρων neste contexto tem sentido ancestral. «Antepassados» comunica esse valor com naturalidade e evita a leitura restrita de pais imediatos.
