  text: And all Israel made great mourning for him[a], and they mourned for him many days.
translation:
  language: pt
  text: E todo o Israel fez por ele grande lamentação[a] e o pranteou durante muitos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fez por ele grande luto”. O grego emprega uma expressão idiomática para o luto público.
