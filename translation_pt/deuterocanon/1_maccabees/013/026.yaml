lexical_decisions:
- source_word: ἔκοψαντο ... κοπετὸν μέγαν
  choice: fez por ele grande lamentação
  rationale: A combinação idiomática expressa luto público e intenso. “Fez ... grande lamentação” preserva a força e a repetição lexical do grego sem explicitar o gesto físico de bater no peito.
- source_word: πᾶς Ἰσραήλ
  choice: todo o Israel
  rationale: Expressão coletiva natural em português para o povo de Israel como um todo.
- source_word: ἐπένθησαν
  choice: o pranteou
  rationale: O verbo indica luto por alguém, especialmente por um morto. “Pranteou” distingue esta segunda oração da “lamentação” anterior e mantém o tom funerário.
- source_word: ἡμέρας πολλάς
  choice: durante muitos dias
  rationale: O acusativo indica duração; “durante” torna essa relação clara e natural em português.
