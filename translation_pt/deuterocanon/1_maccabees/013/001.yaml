  text: And Simon heard that Tryphon was gathering a large force to come into the land of Judah and destroy it[a].
translation:
  language: pt
  text: Simão soube que Trifão estava reunindo uma grande força para entrar na terra de Judá e destruí-la.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra da Judeia”. O grego diz “a terra de Judá”, expressão que pode designar o território historicamente associado a Judá, em vez de empregar uma terminologia administrativa posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube
  rationale: Neste contexto, o aoristo de ἀκούω introduz uma informação recebida. “Soube” é natural em português e evita sugerir necessariamente uma audição direta.
- source_word: συνῆγεν
  choice: estava reunindo
  rationale: O imperfeito apresenta a ação em andamento; a locução verbal preserva esse aspecto.
- source_word: δύναμιν πολλὴν
  choice: uma grande força
  rationale: Em contexto militar, δύναμις designa uma força armada ou tropas. A expressão mantém a amplitude do grego sem especificar indevidamente um exército formal.
- source_word: τοῦ ἐλθεῖν
  choice: para entrar
  rationale: O infinitivo articular exprime propósito. “Entrar” comunica naturalmente o movimento para dentro do território, embora o verbo grego, de modo mais literal, seja “vir”.
- source_word: γῆν Ἰούδα
  choice: a terra de Judá
  rationale: A formulação acompanha de perto o grego e conserva o sentido histórico-geográfico, sem substituir a expressão por terminologia administrativa posterior.
- source_word: τοῦ ἐκτρῖψαι αὐτήν
  choice: e destruí-la
  rationale: O segundo infinitivo articular continua a expressar propósito. ἐκτρίβω indica destruir ou eliminar por completo; “destruí-la” é forte e claro sem recorrer a linguagem coloquial.
