  text: And he reigned in his place[a], and put on the crown of Asia[b], and inflicted a great blow on the land.
translation:
  language: pt
  text: E reinou em seu lugar, pôs sobre si o diadema da Ásia e desferiu um grande golpe contra a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “causou grande devastação na terra”. O grego diz literalmente “desferiu um grande golpe contra a terra”, expressão que pode indicar dano grave ou calamidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: reinou
  rationale: Mantém de modo conciso o sentido de exercer a realeza, sem impor um valor ingressivo mais forte, como em “tornou-se rei”.
- source_word: ἀντʼ αὐτοῦ
  choice: em seu lugar
  rationale: Expressa claramente substituição e sucessão, preservando a força de ἀντί.
- source_word: περιέθετο
  choice: pôs sobre si
  rationale: A voz média indica que ele colocou o objeto em si mesmo; a formulação conserva a imagem concreta do ato de assumir a insígnia real.
- source_word: τὸ διάδημα
  choice: o diadema
  rationale: “Diadema” designa com precisão a faixa ou insígnia régia e é compreensível em português bíblico moderno, evitando confundi-la com qualquer tipo de coroa.
- source_word: τῆς Ἀσίας
  choice: da Ásia
  rationale: Reproduz o genitivo grego sem ampliar a referência para “Ásia Menor” ou “reino asiático”.
- source_word: ἐποίησεν πληγὴν μεγάλην
  choice: desferiu um grande golpe
  rationale: Preserva a metáfora de πληγή como golpe ou dano grave, sem especificar indevidamente peste ou devastação.
- source_word: ἐπὶ τῆς γῆς
  choice: contra a terra
  rationale: Mantém a construção direcional de ἐπί e a possível referência político-territorial de γῆ; a nota registra uma leitura idiomática mais natural.
