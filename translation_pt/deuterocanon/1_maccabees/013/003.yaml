  text: And he encouraged them and said to them[a], “You yourselves know what I and my brothers and my father’s house have done for the laws and the holy things, and the wars and the distresses.”
translation:
  language: pt
  text: 'E ele os encorajou e lhes disse: “Vocês mesmos sabem tudo o que eu, meus irmãos e a casa de meu pai fizemos pelas leis e pelas coisas santas[a], e sabem das guerras e das aflições.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo santuário”. O grego diz literalmente “pelas coisas santas”, expressão que pode abranger o santuário e outros assuntos sagrados.
    reason: alternativa lexical
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: encorajou
  rationale: No contexto, Simão fortalece e anima o povo antes de recordar a atuação e os sofrimentos de sua família; “encorajou” preserva essa força sem restringir o verbo a uma exortação formal.
- source_word: Αὐτοὶ οἴδατε
  choice: Vocês mesmos sabem
  rationale: O pronome explícito αὐτοὶ é enfático; “vocês mesmos” conserva essa ênfase em português natural.
- source_word: οἶκος τοῦ πατρός μου
  choice: a casa de meu pai
  rationale: Mantém a imagem familiar e dinástica do idioma grego, compreensível como a família ou linhagem paterna.
- source_word: περὶ τῶν νόμων καὶ τῶν ἁγίων
  choice: pelas leis e pelas coisas santas
  rationale: “Pelas” expressa a atuação em defesa ou benefício delas; o plural de νόμων é preservado, e “coisas santas” mantém a amplitude do substantivo adjetival τῶν ἁγίων.
- source_word: τοὺς πολέμους καὶ τὰς στενοχωρίας
  choice: das guerras e das aflições
  rationale: A repetição de “sabem” torna clara e natural em português a coordenação acusativa elíptica do grego, sem acrescentar que as aflições foram especificamente “suportadas”.
- source_word: στενοχωρίας
  choice: aflições
  rationale: O termo denota situações de angústia, opressão ou dificuldade extrema; “aflições” oferece registro digno e amplo.
theological_decisions:
- issue: Alcance de τῶν ἁγίων
  choice: coisas santas
  alternative: santuário
  rationale: O plural substantivado pode abranger o santuário, objetos consagrados, ritos ou assuntos sagrados. A tradução não reduz a referência a uma única instituição.
- issue: Relação sintática de “guerras e aflições”
  choice: Coordenação como segundo conteúdo do verbo “saber”, explicitando “sabem” em português
  alternative: Tratar tudo como objeto de “fizemos”, ou acrescentar “que suportamos”
  rationale: O grego muda de uma oração relativa com ἐποιήσαμεν para os acusativos “as guerras e as aflições”. A repetição do verbo principal preserva a elipse e evita afirmar além do texto que as aflições foram “suportadas”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para leitura natural no Brasil e inteligibilidade internacional. A repetição de “sabem” esclarece a sintaxe sem eliminar a concisão ou a ambiguidade lexical do original.
