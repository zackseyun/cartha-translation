  terminology: «Simão», «muralha», «roupas» e «clamaram» são escolhas apropriadas. Para δεξιὰς ... δοῦναι, «desse garantias» comunica o sentido idiomático sem especificar indevidamente quais seriam essas garantias; a nota conserva a imagem literal e as possíveis implicações de paz.
