  text: And those in the city went up onto the wall with their wives and children, having torn their garments, and they cried out with a loud voice, asking Simon to give them his right hand.
translation:
  language: pt
  text: Os que estavam na cidade subiram à muralha com suas mulheres e seus filhos, com as roupas rasgadas[b], e clamaram em alta voz, pedindo a Simão que lhes desse garantias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhes concedesse termos de paz”. O grego diz literalmente “desse mãos direitas”, uma expressão usada para indicar um compromisso de boa-fé, garantias ou um acordo de paz.'
    reason: lexical_alternative
  - marker: b
    text: Rasgar as roupas era um sinal costumeiro de tristeza, aflição ou súplica urgente.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Expressa de modo direto e natural o movimento ascendente indicado pelo verbo grego.
- source_word: οἱ ἐν τῇ πόλει
  choice: os que estavam na cidade
  rationale: Preserva o caráter coletivo e indefinido da expressão substantivada, sem acrescentar uma identificação não explícita.
- source_word: σὺν ταῖς γυναιξὶ καὶ τοῖς τέκνοις
  choice: com suas mulheres e seus filhos
  rationale: No contexto do cerco, o possessivo comunica naturalmente a relação familiar provavelmente implícita, sem excluir a leitura literal de mulheres e crianças associadas ao grupo.
- source_word: ἐπὶ τὸ τεῖχος
  choice: à muralha
  rationale: Com o verbo 'subiram', indica que chegaram à parte superior da muralha; a formulação é corrente em português.
- source_word: διερρωχότες τὰ ἱμάτια αὐτῶν
  choice: depois de rasgarem as próprias roupas
  rationale: Representa o estado resultante expresso pelo particípio perfeito e evita a conotação moderna mais restrita de 'vestes'.
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: clamaram em alta voz
  rationale: Mantém a intensidade e a solenidade da expressão grega em português natural e digno.
- source_word: ἀξιοῦντες
  choice: pedindo
  rationale: Transmite uma solicitação insistente sem impor a força de 'exigindo', inadequada à postura suplicante do contexto.
- source_word: δεξιὰς ... δοῦναι
  choice: lhes desse a mão direita
  rationale: Conserva na tradução principal a imagem concreta do idioma grego e deixa sua provável força de garantia, acordo ou paz para a nota.
theological_decisions:
- issue: Força idiomática de δεξιὰς ... δοῦναι em um contexto de cerco e rendição
  choice: Manter no texto a imagem 'lhes desse a mão direita'
  alternative: lhes desse garantias; lhes concedesse termos de paz
  rationale: Embora a expressão provavelmente denote um compromisso de boa-fé ou condições pacíficas, a imagem literal permite preservar a amplitude do idioma sem definir silenciosamente se se trata de paz, salvo-conduto ou outra garantia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. 'Muralha' explicita a estrutura defensiva da cidade; 'clamaram' preserva a intensidade narrativa. Os marcadores foram colocados junto às expressões que explicam.
