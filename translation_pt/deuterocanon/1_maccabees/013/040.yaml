  yaml_path: translation/deuterocanon/1_maccabees/013/040.yaml
  text: And if any of you are fit to be enrolled among our people[a], let them be enrolled, and let there be peace between us.
translation:
  language: pt
  text: E, se alguns de vocês forem aptos para serem inscritos entre os nossos[a], que sejam inscritos, e haja paz entre nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “entre os que estão ao nosso redor”; a expressão provavelmente se refere à incorporação ao povo ou grupo de quem envia a mensagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτήδειοι
  choice: aptos
  rationale: O adjetivo indica pessoas consideradas adequadas ou qualificadas; “aptos” preserva a ideia de idoneidade prática sem definir em excesso a natureza jurídica da condição.
- source_word: γράφηναι
  choice: ser inscritos
  rationale: Neste contexto administrativo, o verbo se refere ao registro formal. “Ser inscritos” também mantém a ligação lexical com o imperativo seguinte.
- source_word: τοὺς περὶ ἡμᾶς
  choice: entre os nossos
  rationale: A expressão significa literalmente “os que estão ao nosso redor”, mas aqui provavelmente designa o grupo, comunidade ou partido do emissor. “Entre os nossos” soa natural e conserva certa abertura quanto à identidade precisa do grupo.
- source_word: ἐγγραφέσθωσαν
  choice: que sejam inscritos
  rationale: O imperativo dá continuidade à linguagem de registro formal e repete, em português, a mesma raiz usada na oração anterior.
- source_word: γενέσθω ἀνὰ μέσον ἡμῶν εἰρήνη
  choice: haja paz entre nós
  rationale: Forma portuguesa natural e digna para a fórmula recíproca de paz, sem perder o sentido de que a paz deve existir entre as duas partes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve tom administrativo. A expressão “entre os nossos” evita a formulação menos natural “entre os que estão ao nosso redor” no corpo do texto, enquanto a nota preserva o sentido literal e a ambiguidade da referência.
