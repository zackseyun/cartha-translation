  text: And they answered with a loud voice, saying, “You are our leader in place of Judas and Jonathan your brother.”
translation:
  language: pt
  text: 'E eles responderam em voz alta: “Tu és o nosso líder em lugar de Judas e de Jônatas, teu irmão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: responderam
  rationale: Forma narrativa direta e natural do aoristo de ἀποκρίνομαι.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Expressa de modo idiomático a ideia de maneira, preservando a referência concreta à voz.
- source_word: λέγοντες
  choice: introdução por dois-pontos
  rationale: Em português, o conteúdo da fala após “responderam” é introduzido naturalmente por dois-pontos; repetir “dizendo” seria possível, mas menos fluente.
- source_word: ἡγούμενος
  choice: líder
  rationale: Abrange a função política e militar sem impor um cargo formal, régio ou estritamente militar que o grego não especifica.
- source_word: ἀντί
  choice: em lugar de
  rationale: Preserva o sentido de substituição ou sucessão sem explicitar além do texto a natureza institucional dessa sucessão.
- source_word: Ἰούδου
  choice: Judas
  rationale: Forma portuguesa tradicional do nome pessoal neste contexto macabeu.
- source_word: Ἰωνάθου
  choice: Jônatas
  rationale: Forma portuguesa consagrada e facilmente reconhecível do nome pessoal.
- source_word: τοῦ ἀδελφοῦ σου
  choice: teu irmão
  rationale: Mantém a identificação explícita de Jônatas como irmão do interlocutor e concorda com o tratamento singular “tu”.
theological_decisions:
- issue: Natureza da função de Simão indicada por ἡγούμενος
  choice: líder
  alternative: governante; comandante; chefe
  rationale: “Líder” conserva a amplitude do termo grego e o reconhecimento da autoridade de Simão, sem importar uma definição régia, constitucional ou exclusivamente militar.
- issue: Sentido sucessório de ἀντί
  choice: em lugar de
  alternative: em substituição a; como sucessor de
  rationale: A formulação mantém tanto a ideia de substituição quanto a possível dimensão de sucessão, sem transformar essa implicação em título formal.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. O tratamento “tu” preserva de modo inequívoco o singular do grego e combina naturalmente com “teu irmão”. A construção evita redundância ao verter λέγοντες por pontuação de discurso direto.
