  text: And the people of Israel began to write in documents and contracts[a], “Year one of Simon, the great high priest and general and leader of the Jews.”
translation:
  language: pt
  text: 'E o povo de Israel começou a escrever nos documentos e contratos: “Ano primeiro de Simão, o grande sumo sacerdote, comandante e líder dos judeus[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos judeanos”. O termo grego pode designar tanto o povo judeu em sentido amplo quanto, mais especificamente, o povo da Judeia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο
  choice: começou
  rationale: O aoristo de ἄρχω assinala o início de uma prática; “começou” é direto e natural em português.
- source_word: ὁ λαὸς Ἰσραήλ
  choice: o povo de Israel
  rationale: Preserva explicitamente o substantivo coletivo e o nome Israel.
- source_word: γράφειν
  choice: a escrever
  rationale: Mantém o sentido básico do infinitivo e se integra naturalmente à construção com “começou”.
- source_word: ἐν ταῖς συγγραφαῖς
  choice: nos documentos
  rationale: συγγραφή designa aqui documentos ou registros escritos de caráter administrativo.
- source_word: καὶ συναλλάγμασιν
  choice: e contratos
  rationale: No contexto de instrumentos formais datados, “contratos” comunica adequadamente acordos ou negócios formalizados.
- source_word: Ἔτους πρώτου
  choice: Ano um
  rationale: Reproduz a concisão de uma fórmula oficial de datação e indica o início de uma nova era administrativa.
- source_word: ἐπὶ Σίμωνος
  choice: de Simão
  rationale: Em fórmula cronológica, ἐπί com genitivo pode marcar a era ou administração associada a uma pessoa; “Ano um de Simão” é conciso e natural.
- source_word: ἀρχιερέως μεγάλου
  choice: o grande sumo sacerdote
  rationale: Representa tanto ἀρχιερεύς quanto μεγάλου, preservando o caráter elevado do título.
- source_word: στρατηγοῦ
  choice: comandante
  rationale: Expressa o cargo militar sem impor uma patente moderna específica como “general”.
- source_word: ἡγουμένου
  choice: líder
  rationale: Preserva o sentido amplo de quem dirige ou governa sem definir em excesso o cargo político.
- source_word: Ἰουδαίων
  choice: dos judeus
  rationale: Aqui o etnônimo integra um título público e provavelmente designa o povo como coletividade; “judeus” é a forma mais natural em português, embora “judeanos” continue possível.
theological_decisions:
- issue: Sentido de Ἰουδαίων no título de Simão
  choice: dos judeus
  alternative: dos judeanos
  rationale: O contexto é político-administrativo, e “judeus” comunica naturalmente a coletividade étnico-política; a possível nuance geográfica de “judeanos” é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com fórmula documental concisa. “Comandante” evita uma patente militar moderna excessivamente específica; a ambiguidade do etnônimo é mantida em nota.
