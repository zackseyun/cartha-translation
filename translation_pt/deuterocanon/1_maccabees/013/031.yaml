  text: But Tryphon was acting deceitfully with Antiochus the younger king[a], and he killed him,
translation:
  language: pt
  text: Trifão, porém, andava com Antíoco, o rei mais jovem, com engano[a], e o matou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de engano”. O dativo grego δόλῳ pode indicar tanto o modo como o meio da ação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: seguia
  rationale: O imperfeito indica uma ação em andamento no passado. “Seguia” mantém o movimento ou curso narrativo sem tornar a frase artificial em português.
- source_word: δόλῳ
  choice: agindo com dolo
  rationale: O dativo pode indicar modo ou instrumento. A expressão comunica engano deliberado e preserva a ligação com a ação contínua expressa por ἐπορεύετο.
- source_word: μετὰ Ἀντιόχου
  choice: com Antíoco
  rationale: μετά com o genitivo normalmente expressa companhia. Embora o contexto revele hostilidade, a tradução não substitui esse sentido explícito por “contra Antíoco”.
- source_word: τοῦ βασιλέως τοῦ νεωτέρου
  choice: o rei mais jovem
  rationale: νεωτέρου é comparativo e distingue este Antíoco como o mais jovem; a aposição reproduz com clareza a estrutura grega.
- source_word: ἀπέκτεινεν
  choice: o matou
  rationale: O verbo significa diretamente “matou”. Evita-se “assassinou”, que tornaria explícita uma qualificação jurídica ou moral não contida no verbo isoladamente.
