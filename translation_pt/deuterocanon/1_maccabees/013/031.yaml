  - severity: low
    issue: «Dolo» é um termo válido, mas relativamente técnico/jurídico no uso atual.
    rationale: «Engano» é mais idiomático para leitores amplos e mantém o sentido de δόλῳ; a nota registra a alternativa instrumental.
