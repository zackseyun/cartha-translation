  text: And whatever we established with you stands[a], and the strongholds that you built shall remain yours.
translation:
  language: pt
  text: E tudo o que estabelecemos com vocês continua em vigor[a], e as fortalezas que vocês construíram permanecerão em poder de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “permanece estabelecido”. O grego deixa implícito o objeto de “estabelecemos”; no contexto diplomático, trata-se das disposições ou dos termos anteriormente fixados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: tudo o que
  rationale: O pronome relativo neutro plural deixa implícito o objeto do que foi estabelecido. “Tudo o que” preserva essa abertura sem inserir “acordos” no texto.
- source_word: ἐστήσαμεν
  choice: estabelecemos
  rationale: No contexto diplomático, o aoristo de ἵστημι indica disposições ou termos fixados; “estabelecemos” mantém o tom formal e natural.
- source_word: πρὸς ὑμᾶς
  choice: com vocês
  rationale: Aqui πρὸς expressa relação entre as partes; “com vocês” é claro e idiomático em português.
- source_word: ἔστηκεν
  choice: continua em vigor
  rationale: O perfeito comunica validade presente e continuada. A expressão portuguesa transmite o sentido diplomático da forma verbal, embora torne explícita sua força contextual.
- source_word: ὀχυρώματα
  choice: fortalezas
  rationale: O substantivo designa lugares ou instalações fortificados. “Fortalezas” é uma equivalência corrente, ampla e digna.
- source_word: ᾠκοδομήσατε
  choice: construíram
  rationale: Traduz diretamente o sentido comum de οἰκοδομέω, sem substituir a ação de construir pela ideia mais específica de fortificar.
- source_word: ὑπαρχέτω ὑμῖν
  choice: permanecerão em poder de vocês
  rationale: No contexto administrativo, a forma confirma a posse continuada. Esta formulação distingue a posse ou o controle da mera existência das fortalezas.
