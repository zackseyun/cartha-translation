  yaml_path: translation/deuterocanon/1_maccabees/013/048.yaml
  text: And he drove out from it every impurity[a], and settled in it men who practice the law, and fortified it[b], and built for himself a residence in it.
translation:
  language: pt
  text: E ele expulsou dali toda impureza[a], instalou ali homens que praticam a Lei, fortificou-a[b] e construiu para si ali uma residência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda imundície” ou “toda contaminação”. O grego pode designar amplamente a impureza, inclusive ritual ou moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “reforçou suas fortificações”. O verbo composto pode sugerir o reforço de fortificações já existentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλεν
  choice: expulsou
  rationale: Expressa a remoção deliberada e enérgica indicada pelo verbo, com naturalidade em português moderno.
- source_word: ἀκαθαρσίαν
  choice: impureza
  rationale: Mantém o sentido amplo do termo, sem restringi-lo indevidamente à contaminação ritual ou moral.
- source_word: κατῴκισεν
  choice: estabeleceu ali
  rationale: Comunica o sentido causativo de instalar habitantes no lugar, evitando a possível leitura de que ele apenas lhes deu assentamento temporário.
- source_word: ἄνδρας
  choice: homens
  rationale: Preserva o substantivo masculino explícito do texto grego.
- source_word: οἵτινες τὸν νόμον ποιοῦσιν
  choice: que praticavam a Lei
  rationale: Verte de modo idiomático a ideia de observar e pôr em prática a Lei; o imperfeito português ajusta a caracterização contínua ao tempo narrativo.
- source_word: προσοχύρωσεν
  choice: reforçou suas fortificações
  rationale: Representa tanto a ideia de fortificar quanto a possível força adicional do prefixo προσ-, sem recorrer à formulação pouco natural 'fortificou-a ainda mais'.
- source_word: ᾠκοδόμησεν ἑαυτῷ ... οἴκησιν
  choice: construiu ali uma residência para si
  rationale: Preserva a construção de um lugar de moradia próprio em português claro e digno.
theological_decisions:
- issue: Alcance de ἀκαθαρσία no contexto de purificação
  choice: toda impureza
  alternative: toda imundície; toda contaminação
  rationale: A formulação ampla preserva a possibilidade de referência ritual, moral ou cultual, sem decidir aquilo que o texto não especifica.
- issue: Referência de gênero em ἄνδρας
  choice: homens
  alternative: pessoas
  rationale: O grego emprega um termo masculino explícito, e o contexto não exige sua neutralização.
- issue: Sentido de τὸν νόμον ποιοῦσιν
  choice: que praticavam a Lei
  alternative: que observavam a Lei
  rationale: A opção mantém o aspecto comportamental concreto da expressão sem lhe impor uma formulação confessional mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “ali” preserva as relações locativas do grego sem tornar a frase excessivamente pesada; “Lei” recebe inicial maiúscula por se referir à Lei judaica.
