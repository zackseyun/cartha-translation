base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/013/037.yaml
  text: And to the elders and the nation of the Jews[a], greetings. We have received the gold crown and the palm branch that you sent[b], and we are ready to make great peace with you and to write to the officials in charge to grant you remissions.
translation:
  language: pt
  text: E aos anciãos e à nação dos judeus, saudações. Recebemos a coroa de ouro e o ramo de palmeira[a] que vocês enviaram. Estamos prontos para estabelecer uma grande paz com vocês e para escrever aos encarregados dos assuntos, a fim de que lhes concedam remissões[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fronde de palmeira»; o termo grego designa um ramo de palmeira usado em contexto cerimonial ou honorífico.
    reason: lexical_alternative
  - marker: b
    text: A expressão provavelmente se refere a isenções ou dispensas administrativas ou fiscais, embora o grego não especifique aqui sua natureza exata.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβυτέροις
  choice: anciãos
  rationale: No contexto político e diplomático, refere-se aos líderes reconhecidos da comunidade, não apenas a homens idosos.
- source_word: ἔθνει Ἰουδαίων
  choice: nação dos judeus
  rationale: Preserva o sentido corporativo de ἔθνος e o tom formal do endereço diplomático.
- source_word: χαίρειν
  choice: saudações
  rationale: É a fórmula epistolar grega convencional; a tradução literal «alegrar-se» seria enganosa neste contexto.
- source_word: στέφανον τὸν χρυσοῦν
  choice: coroa de ouro
  rationale: Tradução direta e natural do presente diplomático mencionado.
- source_word: βαΐν
  choice: ramo de palmeira
  rationale: O termo designa um ramo ou uma fronde de palmeira, aqui no singular.
- source_word: κεκομίσμεθα
  choice: recebemos
  rationale: O perfeito indica que o recebimento do que foi enviado já se completou; em português, o pretérito perfeito é natural nesse contexto.
- source_word: ἕτοιμοί ἐσμεν
  choice: estamos prontos
  rationale: Expressa com clareza e naturalidade a disposição declarada no texto.
- source_word: ποιεῖν ὑμῖν εἰρήνην μεγάλην
  choice: estabelecer uma grande paz com vocês
  rationale: «Estabelecer» comunica naturalmente o ato diplomático de fazer a paz, enquanto «grande» preserva a ênfase incomum do grego.
- source_word: τοῖς ἐπὶ τῶν χρειῶν
  choice: aos encarregados dos assuntos
  rationale: Mantém a formulação administrativa relativamente aberta do grego, sem atribuir aos responsáveis um cargo mais específico do que o texto permite.
- source_word: ἀφεῖναι ὑμῖν ἀφέματα
  choice: a fim de que lhes concedam remissões
  rationale: Preserva a amplitude da construção cognata grega, que pode indicar dispensas, isenções ou perdão de obrigações, sem limitar indevidamente seu objeto a tributos.
