  text: But those in the citadel at Jerusalem were prevented from going out into the country and from buying and selling[a]; and they became very hungry[b], and many of them perished from famine.
translation:
  language: pt
  text: Mas os que estavam na cidadela de Jerusalém[a] eram impedidos de sair para a região ao redor e de comprar e vender[b]. Eles passaram muita fome, e muitos deles morreram de fome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na Acra de Jerusalém”. O grego ἄκρα pode ser entendido como o substantivo comum “cidadela” ou como a designação conhecida da fortaleza selêucida em Jerusalém.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego repete a conjunção: literalmente, “e e comprar e vender” (καὶ καὶ ἀγοράζειν καὶ πωλεῖν). O sentido permanece claro; a repetição provavelmente se deve a um erro de copista ou de transcrição.'
    reason: textual_variant
lexical_decisions:
- source_word: ἄκρας
  choice: cidadela
  rationale: O termo pode designar uma fortificação elevada ou, de modo mais específico, a fortaleza selêucida conhecida como Acra. “Cidadela” comunica com clareza a função do lugar, enquanto a alternativa como nome próprio é preservada em nota.
- source_word: ἐκωλύοντο
  choice: eram impedidos
  rationale: O imperfeito passivo indica uma restrição externa e contínua; “eram impedidos” preserva tanto a voz passiva quanto o aspecto durativo.
- source_word: ἐκπορεύεσθαι
  choice: de sair
  rationale: O infinitivo completa o verbo de impedimento e, no contexto do cerco, refere-se a sair da cidadela em direção à região exterior.
- source_word: εἰς τὴν χώραν
  choice: para a região ao redor
  rationale: χώρα indica aqui o território ou a zona rural nos arredores de Jerusalém. A expressão evita a possível ambiguidade moderna de “país” e explicita apenas o sentido geográfico contextual.
- source_word: ἀγοράζειν καὶ πωλεῖν
  choice: de comprar e vender
  rationale: A tradução mantém os dois verbos concretos e a referência às atividades comerciais ordinárias.
- source_word: ἐπείνασαν σφόδρα
  choice: passaram muita fome
  rationale: Expressão portuguesa natural e forte para a experiência de fome severa indicada por σφόδρα, sem tornar o texto desnecessariamente técnico.
- source_word: ἀπώλοντο
  choice: morreram
  rationale: No contexto da fome, o verbo se refere claramente à morte. “Morreram” é direto, digno e mais natural no português corrente que “pereceram”.
- source_word: ἱκανοὶ
  choice: muitos
  rationale: No plural substantivado, ἱκανοί indica um número considerável, porém não especificado; “muitos” preserva essa imprecisão quantitativa.
- source_word: τῷ λιμῷ
  choice: de fome
  rationale: O dativo expressa a causa da morte. “Morrer de fome” é a formulação idiomática em português e mantém a ligação lexical com a fome intensa mencionada antes.
