  yaml_path: translation/deuterocanon/1_maccabees/013/017.yaml
  text: And Simon recognized that they were speaking deceitfully to him[a], yet he sent the money and the boys[b], lest he stir up great hostility against the people.
translation:
  language: pt
  text: Simão percebeu que eles lhe falavam com falsidade. Mesmo assim, enviou o dinheiro[a] e os rapazes, para não provocar grande hostilidade entre o povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a prata”. O termo grego pode designar tanto a prata como metal quanto dinheiro ou prata destinada a pagamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “contra o povo” ou “com o povo”. A expressão grega permite mais de uma maneira de entender a relação dessa hostilidade com o povo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: percebeu
  rationale: O aoristo de γινώσκω indica que Simão discerniu a intenção enganosa por trás da fala, não apenas que possuía uma informação.
- source_word: δόλῳ
  choice: com falsidade
  rationale: O dativo exprime modo ou meio, isto é, uma fala marcada por engano deliberado. A formulação é natural e digna em português.
- source_word: λαλοῦσιν πρὸς αὐτόν
  choice: eles lhe falavam
  rationale: Reproduz a ação verbal em curso no discurso indireto e seu direcionamento a Simão.
- source_word: πέμπει
  choice: enviou
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, mais natural na narrativa portuguesa.
- source_word: τὸ ἀργύριον
  choice: o dinheiro
  rationale: No contexto de um pagamento exigido, ἀργύριον designa naturalmente dinheiro, embora também possa significar prata.
- source_word: τὰ παιδάρια
  choice: os rapazes
  rationale: παιδάρια refere-se aos jovens mencionados no contexto; “rapazes” evita sugerir necessariamente crianças muito pequenas.
- source_word: μή ποτε
  choice: para não
  rationale: Introduz o resultado temido ou a finalidade preventiva. A forma portuguesa é clara sem perder a cautela implícita no contexto.
- source_word: ἔχθραν ἄρῃ μεγάλην
  choice: provocar grande hostilidade
  rationale: Traduz idiomaticamente a imagem de “levantar” inimizade, conservando sua força social e política.
- source_word: πρὸς τὸν λαόν
  choice: entre o povo
  rationale: Com ἔχθρα, πρός exprime uma relação de hostilidade. O texto principal entende que ela surgiria no âmbito da população, enquanto a nota preserva outras relações possíveis.
