lexical_decisions:
- source_word: Σίμων
  choice: Simão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego Σίμων.
- source_word: δὲ
  choice: porém
  rationale: Marca uma transição narrativa com leve contraste, sem sugerir uma oposição forte.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: No contexto militar, o aoristo de παρεμβάλλω indica estabelecer acampamento; «acampou» é natural, conciso e preserva esse sentido.
- source_word: ἐν Ἀδείδοις
  choice: em Adida
  rationale: A preposição ἐν indica localização, e «em Adida» é a construção idiomática em português para a posição junto à localidade.
- source_word: κατὰ πρόσωπον
  choice: diante de
  rationale: A expressão tem valor espacial e indica uma posição de frente para algo; «diante de» conserva essa relação sem impor precisão geográfica maior que a do grego.
- source_word: τοῦ πεδίου
  choice: a planície
  rationale: πεδίον designa terreno plano ou uma planície; neste contexto geográfico, «planície» é claro e específico.
