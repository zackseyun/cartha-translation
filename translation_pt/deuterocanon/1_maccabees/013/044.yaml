  yaml_path: translation/deuterocanon/1_maccabees/013/044.yaml
  text: And those in the siege tower went out into the city[a], and there was a great commotion in the city.
translation:
  language: pt
  text: E os que estavam na torre de cerco saíram para a cidade, e houve grande agitação na cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «grande perturbação» ou «grande tumulto»; o termo grego κίνημα pode indicar, de modo amplo, agitação ou inquietação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήλοντο
  choice: saíram
  rationale: Expressa de modo direto o movimento para fora indicado pela forma verbal aorista, sem acrescentar motivo ou resultado.
- source_word: οἱ ἐν τῇ ἑλεπόλει
  choice: os que estavam na torre de cerco
  rationale: ἑλέπολις designa uma máquina de cerco, especialmente uma torre móvel; «torre de cerco» é claro e adequado ao contexto militar.
- source_word: εἰς τὴν πόλιν
  choice: para a cidade
  rationale: Preserva a direção do movimento expressa por εἰς e traduz πόλις pelo equivalente corrente «cidade».
- source_word: κίνημα μέγα
  choice: grande agitação
  rationale: κίνημα pode indicar movimento, perturbação ou inquietação coletiva. «Grande agitação» conserva essa amplitude sem especificar indevidamente motim, revolta ou tumulto.
- source_word: ἐγένετο
  choice: houve
  rationale: Verte com naturalidade o uso narrativo de γίνομαι para introduzir o surgimento de uma situação.
theological_decisions: []
