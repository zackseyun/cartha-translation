  register: Português moderno, claro e digno, com estrutura narrativa próxima do grego. A repetição de «cidade» foi mantida por corresponder à repetição do texto-fonte; o marcador da nota foi colocado após «agitação na cidade», pois a nota explica κίνημα, não πόλις.
