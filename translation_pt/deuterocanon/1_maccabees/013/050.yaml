  yaml_path: translation/deuterocanon/1_maccabees/013/050.yaml
  text: And they cried out to Simon to receive pledges of good faith[a], and he gave them to them, and he drove them out from there[b], and he cleansed the citadel from its defilements.
translation:
  language: pt
  text: E eles clamaram a Simão, pedindo garantias de boa-fé[a]; e ele lhas concedeu, expulsou-os dali e purificou a cidadela[b] de suas impurezas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, em grego, “receber mãos direitas”, expressão usada para receber garantias ou compromissos de boa-fé.
    reason: lexical_alternative
  - marker: b
    text: Ou “a Acra”, a cidadela fortificada de Jerusalém.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβόησαν πρὸς Σίμωνα
  choice: clamaram a Simão
  rationale: O aoristo de βοάω expressa um clamor em voz alta ou um apelo urgente. “Clamaram” conserva tanto a força vocal quanto a urgência, em registro digno e compreensível.
- source_word: δεξιὰς λαβεῖν
  choice: que aceitasse garantias de boa-fé
  rationale: A expressão significa literalmente “receber mãos direitas”, mas funciona como idioma para aceitar garantias ou compromissos formalmente confirmados. A tradução comunica o sentido sem tornar o texto obscuro.
- source_word: ἔδωκεν αὐτοῖς
  choice: ele as concedeu
  rationale: O objeto está implícito e retoma as garantias mencionadas na oração anterior. “Concedeu” evita a repetição pouco natural de “deu-as a eles” e preserva a ideia de Simão atender ao pedido.
- source_word: ἐξέβαλεν αὐτοὺς ἐκεῖθεν
  choice: expulsou-os dali
  rationale: ἐκβάλλω denota retirar ou lançar para fora com força. No contexto político-militar, “expulsou-os” é direto e natural.
- source_word: τὴν ἄκραν
  choice: a cidadela
  rationale: ἄκρα pode designar uma cidadela ou fortaleza e, neste contexto, refere-se à fortificação de Jerusalém conhecida como Acra. O substantivo comum mantém o texto principal transparente; a identificação histórica fica na nota.
- source_word: ἀπὸ τῶν μιασμάτων
  choice: de suas contaminações
  rationale: μίασμα indica contaminação ou profanação, frequentemente com conotações cultuais. “Contaminações” conserva o plural e permite a dimensão ritual, moral ou material sem restringi-la indevidamente.
theological_decisions:
- issue: Se δεξιὰς λαβεῖν deve ser traduzido literalmente ou como idioma
  choice: 'Tradução idiomática no texto: “aceitasse garantias de boa-fé”.'
  alternative: 'Tradução literal: “recebesse mãos direitas”; ou expansão: “aceitasse garantias de segurança”.'
  rationale: A forma literal seria opaca para a maioria dos leitores atuais. A escolha comunica uma garantia formal sem especificar que se tratava necessariamente de salvo-conduto ou segurança, algo que o grego não declara de modo explícito.
- issue: Se τὴν ἄκραν deve aparecer como substantivo comum ou nome próprio
  choice: 'Substantivo comum no texto: “a cidadela”.'
  alternative: 'Nome histórico: “a Acra”.'
  rationale: O termo grego tem sentido lexical transparente e também pode identificar uma fortificação específica de Jerusalém. A tradução principal conserva o sentido comum, enquanto a nota registra a possível leitura como nome próprio.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com boa legibilidade brasileira. A coordenação narrativa do grego foi parcialmente segmentada para maior naturalidade, sem alterar a sequência dos acontecimentos. Os marcadores [a] e [b] aparecem no texto principal.
