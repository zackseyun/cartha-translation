    reason: lexical_alternative
  - marker: b
    text: Ou “a Acra”, a cidadela fortificada de Jerusalém.
    reason: alternative_reading
  revision_rationale: A revisão elimina a atribuição explícita e problemática a Simão de aceitar as garantias, mantendo a formulação elíptica do pedido e explicitando apenas o objeto que a resposta de Simão retoma. Também corrige a forma verbal da glosa literal na nota e emprega “impurezas” como equivalente amplo e idiomático para μίασματα, sem reduzir suas possíveis conotações cultuais.
