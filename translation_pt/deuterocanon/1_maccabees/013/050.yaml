revisions:
- from: E eles clamaram a Simão, pedindo que aceitasse garantias de boa-fé[a]. Ele as concedeu, expulsou-os dali e purificou a cidadela[b] de suas contaminações.
  to: E eles clamaram a Simão, pedindo garantias de boa-fé[a]; e ele lhas concedeu, expulsou-os dali e purificou a cidadela[b] de suas impurezas.
  rationale: A revisão elimina a atribuição explícita e problemática a Simão de aceitar as garantias, mantendo a formulação elíptica do pedido e explicitando apenas o objeto que a resposta de Simão retoma. Também corrige a forma verbal da glosa literal na nota e emprega “impurezas” como equivalente amplo e idiomático para μίασματα, sem reduzir suas possíveis conotações cultuais.
