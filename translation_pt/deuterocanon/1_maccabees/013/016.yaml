lexical_decisions:
- source_word: ἀργυρίου ἑκατὸν τάλαντα
  choice: cem talentos de prata
  rationale: Mantém a antiga unidade de peso e o material especificado pelo grego, sem converter para uma medida moderna incerta.
- source_word: ὅμηρα
  choice: como reféns
  rationale: Expressa de modo natural em português a função dos dois filhos exigidos como garantia.
- source_word: ἀποστατήσῃ ἀφʼ ἡμῶν
  choice: se revolte contra nós
  rationale: Comunica a ideia política de abandonar a lealdade e insurgir-se contra o grupo de Trifão.
- source_word: ἀφήσομεν αὐτόν
  choice: então nós o soltaremos
  rationale: Preserva a promessa futura e torna explícita em português a relação consequente com as condições anteriores.
theological_decisions:
- issue: Valor temporal e circunstancial de ἀφεθείς
  choice: uma vez solto
  alternative: quando for solto
  rationale: A construção participial admite ambas as formulações; “uma vez solto” preserva concisamente a ideia de que o risco de revolta surgiria após a libertação.
