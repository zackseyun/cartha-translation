  text: And now send a hundred talents of silver, and two of his sons as hostages, so that, once released, he may not revolt from us; and we will release him.
translation:
  language: pt
  text: E agora envie cem talentos de prata e dois dos filhos dele como reféns, para que, uma vez solto, ele não se revolte contra nós; e nós o soltaremos.
