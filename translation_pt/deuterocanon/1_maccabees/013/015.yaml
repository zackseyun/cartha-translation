  text: As for the silver that your brother Jonathan owed to the royal treasury because of the needs he had[b][a], we have held him liable for it.
translation:
  language: pt
  text: Quanto à prata que seu irmão Jônatas devia ao tesouro real por causa das funções que exercia,[a] nós o mantemos detido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa das necessidades ou obrigações que tinha”. A expressão grega pode referir-se a necessidades, negócios, obrigações ou funções oficiais.'
    reason: lexical_alternative
  - marker: b
    text: O verbo grego também pode significar “segurar”, “restringir” ou “manter sob controle”. Aqui, o contexto da prometida libertação de Jônatas favorece “manter detido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ ἀργυρίου
  choice: Quanto à prata
  rationale: Περὶ introduz o assunto, e ἀργύριον designa literalmente prata, aqui com valor monetário. A formulação conserva a imagem do grego e soa natural em português.
- source_word: ὤφειλεν
  choice: devia
  rationale: Expressa diretamente uma obrigação financeira anterior, sem acrescentar explicações ausentes do texto.
- source_word: εἰς τὸ βασιλικόν
  choice: ao tesouro real
  rationale: O adjetivo substantivado τὸ βασιλικόν indica o domínio ou erário régio; no contexto de uma dívida, “tesouro real” comunica com clareza o referente fiscal.
- source_word: διʼ ἃς εἶχεν χρείας
  choice: por causa das funções que exercia
  rationale: χρεία pode indicar necessidades, obrigações, negócios ou encargos. Neste contexto administrativo, ligado à dívida de Jônatas para com o tesouro real, “funções” é a leitura contextual mais provável, enquanto a nota preserva a amplitude lexical.
- source_word: συνέχομεν αὐτόν
  choice: nós o mantemos detido
  rationale: συνέχω pode significar segurar, restringir ou manter sob custódia. A continuação do episódio trata da libertação de Jônatas mediante condições, favorecendo aqui o sentido de detenção, não de perdão da dívida.
