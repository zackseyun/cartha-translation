  source_fidelity: A tradução de ἐπέλεξεν e dos genitivos partitivos («alguns dos anciãos... alguns dos sacerdotes») é fiel. A última oração interpreta de forma plausível a difícil sequência ἔδωκεν αὐτὸν τῷ κινδύνῳ, e a nota documenta adequadamente o pronome singular transmitido. Contudo, «mandou que mantivessem o cerco» acrescenta a ideia de continuidade/manutenção, que não é expressa pelo infinitivo presente περικαθίσθαι; o verbo indica ordenar cercar ou posicionar-se ao redor.
  naturalness: O texto é claro, fluente e apropriado ao registro bíblico moderno. «Mandou cercar» é conciso, natural e evita tanto o acréscimo de «manter» quanto a imposição de um objeto expresso que o grego deste versículo deixa implícito.
