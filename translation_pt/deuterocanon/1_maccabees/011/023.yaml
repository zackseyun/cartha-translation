  text: But when Jonathan heard, he ordered them to be surrounded; and he chose some of the elders of Israel and some of the priests, and put himself in danger.
translation:
  language: pt
  text: Quando Jônatas soube disso, mandou cercar. Então escolheu alguns dos anciãos de Israel e alguns dos sacerdotes e se expôs ao perigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: «entregou-o ao perigo». A referência do pronome é incerta; pelo contexto, provavelmente significa que Jônatas expôs a si mesmo ao perigo.'
    reason: textual_variant
lexical_decisions:
- source_word: περικαθίσθαι
  choice: que mantivessem o cerco
  rationale: O infinitivo médio περικαθίσθαι, em contexto militar, descreve permanecer em torno de um lugar para sitiá-lo. Como o contexto imediato já apresenta um cerco em andamento, «manter o cerco» expressa naturalmente a ordem sem identificar no versículo um objeto que o grego deixa implícito.
- source_word: ἐπέλεξεν
  choice: escolheu
  rationale: Equivalente direto e corrente, adequado ao estilo narrativo.
- source_word: τῶν πρεσβυτέρων Ἰσραήλ
  choice: alguns dos anciãos de Israel
  rationale: 'O genitivo depois de ἐπέλεξεν tem sentido partitivo: Jônatas escolheu dentre os anciãos, não necessariamente todos eles.'
- source_word: τῶν ἱερέων
  choice: alguns dos sacerdotes
  rationale: Assim como no sintagma anterior, o genitivo é partitivo e indica uma seleção dentre os sacerdotes.
- source_word: ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: se expôs ao perigo
  rationale: A expressão com δίδωμι e o dativo de «perigo» comunica exposição ao risco. Embora o texto transmitido use αὐτόν («o»), a sequência narrativa aponta com maior probabilidade para Jônatas como aquele que se arriscou; a dificuldade formal é registrada em nota.
theological_decisions:
- issue: Referência difícil do pronome em ἔδωκεν αὐτὸν τῷ κινδύνῳ
  choice: 'Entender a frase como a exposição do próprio Jônatas ao perigo: «se expôs ao perigo».'
  alternative: «expôs aquele ao perigo» ou, mais literalmente, «entregou-o ao perigo».
  rationale: Não se trata de uma decisão doutrinária, mas textual e narrativa. O acusativo singular masculino αὐτόν é formalmente «o», porém não possui antecedente singular claro no contexto imediato. A leitura reflexiva produz o sentido narrativo mais coerente, enquanto a nota preserva a dificuldade do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Jônatas», «anciãos» e «sacerdotes» preservam o registro bíblico corrente sem arcaísmo excessivo. A primeira frase explicita de modo natural a continuidade do cerco indicada pelo contexto, e a nota conserva a ambiguidade real da última oração.
