base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/055.yaml
  text: And all the forces that Demetrius had dismissed gathered to him[a], and they fought against him; and he fled and was routed.
translation:
  language: pt
  text: E todas as forças que Demétrio havia dispensado reuniram-se a ele[a], lutaram contra Demétrio, e ele fugiu e foi posto em debandada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «havia mandado embora» ou «havia afastado do serviço». O verbo grego pode indicar que tropas foram retiradas do serviço ou simplesmente despedidas da presença de alguém; o contexto favorece uma dispensa militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: reuniram-se
  rationale: O aoristo passivo seguido de πρὸς αὐτόν indica que as forças se congregaram para se juntar à pessoa mencionada; «reuniram-se» é natural e preserva o sentido coletivo e militar.
- source_word: δυνάμεις
  choice: forças
  rationale: No contexto militar, o termo designa forças armadas. «Forças» mantém a amplitude do grego sem especificar em excesso como «exércitos».
- source_word: ἀπεκρόακεν
  choice: havia dispensado
  rationale: A forma verbal indica uma ação anterior aos acontecimentos narrados. No contexto, Demétrio havia afastado ou liberado essas tropas do serviço; «havia dispensado» expressa bem essa ideia, sem excluir totalmente o sentido de mandá-las embora.
- source_word: ἐπολέμησαν πρὸς αὐτόν
  choice: lutaram contra Demétrio
  rationale: A construção com πρὸς tem sentido adversativo. A repetição explícita do nome em português evita a ambiguidade pronominal criada pelos dois referentes masculinos no versículo.
- source_word: ἔφυγεν
  choice: fugiu
  rationale: Tradução direta e natural do aoristo narrativo, apropriada ao relato de batalha.
- source_word: ἐτροπώθη
  choice: foi posto em debandada
  rationale: O passivo tem sentido militar de ser repelido e obrigado a fugir. «Foi posto em debandada» preserva essa imagem melhor que o genérico «foi derrotado».
