translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O segundo «Demétrio» explicita o referente do pronome grego para evitar que o leitor entenda que as forças lutaram contra a mesma pessoa a quem se reuniram. A formulação conserva o encadeamento rápido do relato militar.
