  text: And some lawless men[a], who hated their own nation, went to the king and reported to him that Jonathan was besieging the citadel.
translation:
  language: pt
  text: Alguns homens sem lei, que odiavam a própria nação, foram ao rei e lhe informaram que Jônatas estava sitiando a cidadela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Acra”, a cidadela fortificada de Jerusalém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησάν
  choice: foram
  rationale: Verbo narrativo simples de movimento; “foram” traduz naturalmente o aoristo no contexto.
- source_word: τινες
  choice: alguns homens
  rationale: Mantém a referência plural indefinida; “homens” é explicitado pela aposição ἄνδρες.
- source_word: μισοῦντες
  choice: que odiavam
  rationale: A oração relativa é natural em português e preserva a força descritiva do particípio.
- source_word: τὸ ἔθνος αὐτῶν
  choice: a própria nação
  rationale: Refere-se à comunidade nacional judaica; “própria” preserva o valor reflexivo de αὐτῶν no contexto.
- source_word: ἄνδρες παράνομοι
  choice: homens que desprezavam a Lei
  rationale: παράνομοι caracteriza os homens por sua oposição ou transgressão da Lei, não apenas como criminosos civis; a formulação comunica essa dimensão moral-religiosa sem recorrer ao pouco natural “sem lei”.
- source_word: ἀπήγγειλαν
  choice: informaram
  rationale: Expressa a apresentação de uma notícia a uma autoridade e se ajusta naturalmente ao cenário da corte.
- source_word: περικάθηται
  choice: estava sitiando
  rationale: No contexto militar, o verbo indica cercar ou investir uma fortificação; “estava sitiando” preserva a ação em curso do presente no discurso indireto.
- source_word: τὴν ἄκραν
  choice: a cidadela
  rationale: ἄκρα designa aqui a fortificação de Jerusalém; “cidadela” transmite o sentido comum, enquanto o nome histórico alternativo é preservado em nota.
