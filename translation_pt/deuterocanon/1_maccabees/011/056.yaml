  text: And Tryphon took the elephants and gained control of Antioch[a].
translation:
  language: pt
  text: E Trifão tomou os elefantes[a] e assumiu o controle de Antioquia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “as feras”; neste contexto militar, a referência é aos elefantes de guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: tomou
  rationale: O aoristo de λαμβάνω, com objeto direto, indica aqui que Trifão tomou para si os animais; “tomou” preserva a concisão e evita especificar, sem necessidade, se os capturou ou recebeu.
- source_word: Τρύφων
  choice: Trifão
  rationale: Forma portuguesa tradicional e corrente do nome grego Τρύφων.
- source_word: τὰ θηρία
  choice: os elefantes
  rationale: Literalmente, “os animais” ou “as feras”; no contexto militar helenístico, a expressão designa os elefantes de guerra. A tradução explicita o referente, enquanto a nota preserva a forma lexical grega.
- source_word: κατεκράτησεν
  choice: assumiu o controle de
  rationale: κατακρατέω com o genitivo expressa domínio ou controle. A formulação portuguesa comunica a consolidação do poder sobre a cidade sem pressupor os detalhes de sua tomada.
- source_word: Ἀντιοχίας
  choice: Antioquia
  rationale: Forma portuguesa consagrada do nome da cidade; o genitivo é regido por κατακρατέω.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A repetição de “e” reproduz a coordenação simples do grego sem soar artificial. A nota conserva a transparência quanto ao sentido literal de τὰ θηρία.
