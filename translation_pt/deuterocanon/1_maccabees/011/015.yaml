base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/015.yaml
  text: And Alexander heard[a], and came against him in war; and Ptolemy marched out and met him with a strong force, and routed him.
translation:
  language: pt
  text: Alexandre ouviu e veio contra ele para guerrear. Ptolomeu saiu, foi ao encontro dele com grande força[a] e o pôs em fuga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com mão forte”, expressão militar que indica ação poderosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: ouviu
  rationale: Mantém o verbo sem acrescentar um objeto explícito; o contexto fornece aquilo que Alexandre ouviu.
- source_word: ἦλθεν ἐπʼ αὐτὸν ἐν πολέμῳ
  choice: veio contra ele para guerrear
  rationale: Expressa tanto o movimento hostil contra o adversário quanto o propósito bélico, em português natural.
- source_word: ἐξήγαγεν
  choice: saiu
  rationale: No contexto militar, indica que Ptolomeu saiu para o confronto. Evita explicitar tropas ou um exército, que não aparecem como objeto no texto grego.
- source_word: ἀπήντησεν αὐτῷ
  choice: foi ao encontro dele
  rationale: Reproduz claramente o movimento deliberado de ir enfrentar Alexandre.
- source_word: ἐν χειρὶ ἰσχυρᾷ
  choice: com grande força
  rationale: Transmite de modo natural o valor militar da expressão idiomática grega, cuja imagem literal é explicada em nota.
- source_word: ἐτροπώσατο αὐτόν
  choice: o pôs em fuga
  rationale: Preserva o sentido militar específico de fazer o adversário recuar ou fugir, em vez do sentido mais amplo de apenas derrotá-lo.
