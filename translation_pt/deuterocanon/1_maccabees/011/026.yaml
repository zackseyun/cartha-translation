  yaml_path: translation/deuterocanon/1_maccabees/011/026.yaml
  text: And the king dealt with him as those before him had dealt with him[a], and he exalted him above all his friends.
translation:
  language: pt
  text: O rei o tratou da mesma forma que seus predecessores o haviam tratado e o elevou acima de todos os seus amigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante de todos os seus amigos”. A expressão grega pode indicar uma elevação pública na presença da corte do rei, embora o contexto também permita o sentido de posição superior à deles.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐποίησεν αὐτῷ
  choice: o tratou
  rationale: Neste contexto político e relacional, ποιέω com o dativo exprime o modo de agir para com alguém. “O tratou” é natural em português e evita o literalismo pouco claro de “fez a ele”.
- source_word: καθὼς ἐποίησαν αὐτῷ οἱ πρὸ αὐτοῦ
  choice: da mesma forma que seus predecessores o haviam tratado
  rationale: οἱ πρὸ αὐτοῦ refere-se aos que ocuparam o poder antes do rei, isto é, seus predecessores. A formulação explicita esse referente sem alterar o sentido.
- source_word: ὕψωσεν
  choice: o elevou
  rationale: ὑψόω indica elevar em posição ou honra. “Elevou” conserva a dignidade da linguagem e a amplitude do termo grego no contexto da corte.
- source_word: ἐναντίον πάντων τῶν φίλων αὐτοῦ
  choice: acima de todos os seus amigos
  rationale: Com ὕψωσεν, a expressão pode indicar superioridade de posição entre os membros do círculo régio. “Amigos” preserva o termo cortesão helenístico φίλοι, embora continue compreensível em linguagem comum; a leitura locativa ou pública é registrada em nota.
