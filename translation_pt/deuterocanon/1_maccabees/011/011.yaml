  text: and he reproached him because he desired his kingdom[a].
translation:
  language: pt
  text: e o censurou por desejar o reino dele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o culpou por cobiçar o reino dele”. Neste contexto, o verbo grego traduzido como “desejar” também pode ter o sentido mais forte de “cobiçar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψόγισεν
  choice: censurou
  rationale: O verbo ψογίζω significa culpar, censurar ou repreender. “Censurou” preserva o caráter pessoal e acusatório sem intensificá-lo como condenação formal.
- source_word: χάριν τοῦ
  choice: por
  rationale: A construção χάριν com infinitivo articular expressa causa ou motivo. Em português, “por” seguido de infinitivo comunica isso de modo direto e natural.
- source_word: ἐπιθυμῆσαι
  choice: desejar
  rationale: ἐπιθυμέω pode significar tanto “desejar” quanto, em sentido mais forte, “cobiçar”. “Desejar” mantém a amplitude lexical do grego, enquanto o contexto político fornece a conotação negativa.
- source_word: τῆς βασιλείας
  choice: o reino
  rationale: βασιλεία pode designar reino, reinado ou poder régio. Neste contexto, “reino” é a forma mais clara e comum de se referir ao domínio do outro governante.
- source_word: αὐτὸν ... αὐτοῦ
  choice: o ... dele
  rationale: A formulação preserva a referência pronominal compacta do grego. “Dele” mantém a ambiguidade formal, embora a leitura contextual mais natural seja que alguém censurou outro por desejar o reino desse outro.
