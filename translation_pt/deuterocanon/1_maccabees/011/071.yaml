  text: And Jonathan tore his clothes[a], and put earth on his head[b], and prayed.
translation:
  language: pt
  text: Então Jônatas rasgou as suas roupas, pôs terra sobre a cabeça[a] e orou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Colocar terra ou pó sobre a cabeça era um sinal costumeiro de luto, aflição ou lamentação. Também se pode traduzir: “pôs pó sobre a cabeça”; o grego diz literalmente “terra”.'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: διέρρηξεν
  choice: rasgou
  rationale: O aoristo de διαρρήγνυμι descreve o ato de rasgar as vestes, gesto de aflição; “rasgou” é direto e natural em português atual.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: as suas roupas
  rationale: Ἱμάτια designa vestes ou roupas de modo geral. “Roupas” é claro e atual, sem sugerir indevidamente trajes cerimoniais.
- source_word: ἐπέθετο γῆν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: pôs terra sobre a cabeça
  rationale: Γῆ significa literalmente “terra” ou “solo”. A formulação preserva a escolha lexical grega e a ação simbólica sem substituí-la silenciosamente por “pó”.
- source_word: προσηύξατο
  choice: orou
  rationale: Forma aorista de προσεύχομαι; “orou” é a tradução simples e exata.
- source_word: Ἰωνάθαν
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Terminologia do gesto de luto e aflição
  choice: Manter “terra” no texto e explicar o gesto em nota
  alternative: Traduzir “pó” para evocar mais diretamente a linguagem convencional de luto
  rationale: O grego traz γῆ, “terra”, e não um termo específico para “pó” ou “cinza”. A tradução mantém o dado lexical e deixa a nota esclarecer a função cultural do gesto, sem acrescentar interpretação ao corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência narrativa é concisa como no grego. “Então” representa naturalmente o καί inicial no encadeamento do relato; não se acrescenta motivo explícito para os gestos.
