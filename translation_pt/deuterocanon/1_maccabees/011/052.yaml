  text: And King Demetrius sat on the throne of his kingdom, and the land was quiet before him.
translation:
  language: pt
  text: E o rei Demétrio sentou-se no trono do seu reino, e a terra ficou tranquila diante dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: sentou-se
  rationale: Preserva a imagem formal de tomar assento no trono e, no contexto, sugere a entronização sem explicitar além do grego.
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: trono do seu reino
  rationale: Mantém a construção genitiva e a menção explícita ao reino; é clara e digna em português.
- source_word: ἡσύχασεν
  choice: ficou tranquila
  rationale: Expressa a passagem a uma condição de quietude ou ausência de perturbação, sem afirmar uma paz plena que o verbo não exige.
- source_word: ἡ γῆ
  choice: a terra
  rationale: No contexto histórico, refere-se ao território ou país sob governo; «a terra» preserva a formulação do grego sem sugerir necessariamente o planeta inteiro.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Tradução direta que preserva a possível nuance de quietude em sua presença ou perante sua autoridade, sem reduzi-la explicitamente a «sob seu governo».
- source_word: ὁ βασιλεὺς Δημήτριος
  choice: o rei Demétrio
  rationale: Segue a ordem idiomática do português para título e nome, preservando a ênfase régia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação próxima do grego. «Ficou tranquila» soa mais natural que «se aquietou» neste relato político e evita ampliar o sentido para prosperidade ou paz completa.
