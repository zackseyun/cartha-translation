  text: For I regret giving him my daughter[a], for he sought to kill me.
translation:
  language: pt
  text: Pois lamento ter dado minha filha a ele, porque ele procurou me matar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tentou me matar”. O verbo grego pode indicar tanto procurar quanto tentar fazer algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταμεμέλημαι
  choice: me arrependo
  rationale: O perfeito médio expressa arrependimento presente por uma ação passada. Em português, “me arrependo de ter dado” comunica naturalmente esse pesar sem exigir sentido religioso.
- source_word: δοὺς
  choice: de ter dado
  rationale: O particípio aoristo indica a ação passada que causa o arrependimento; a construção com infinitivo composto é idiomática em português.
- source_word: τὴν θυγατέρα μου
  choice: minha filha
  rationale: Tradução direta da expressão familiar, sem expansão desnecessária.
- source_word: ἐζήτησεν
  choice: procurou
  rationale: ζητέω seguido de infinitivo pode significar tanto procurar quanto tentar fazer algo. “Procurou” preserva de modo natural a imagem verbal do grego, enquanto a alternativa é registrada em nota.
- source_word: ἀποκτεῖναί
  choice: me matar
  rationale: O infinitivo expressa o ato pretendido. “Matar” é direto e neutro, sem acrescentar a nuance jurídica ou moral de “assassinar”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível. A repetição causal de γὰρ foi preservada por “pois” e “porque”. O marcador [a] foi colocado após a oração a que a alternativa se refere.
