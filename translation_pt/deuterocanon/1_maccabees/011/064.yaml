  text: And he went to meet them[a], but he left his brother Simon in the country.
translation:
  language: pt
  text: Ele foi ao encontro deles, mas deixou seu irmão Simão naquela região.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “naquela terra” ou “naquela área”; o grego χώρα pode designar um território mais amplo, não apenas uma zona rural.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήντησεν
  choice: foi ao encontro
  rationale: Preserva de modo natural a ideia direcional do verbo composto, em vez do sentido mais genérico de apenas encontrar.
- source_word: αὐτοῖς
  choice: deles
  rationale: Reflete o dativo plural do texto grego.
- source_word: κατέλιπεν
  choice: deixou
  rationale: É a tradução direta e natural do verbo no contexto de deixar alguém permanecer em determinado lugar.
- source_word: ἀδελφὸν αὐτοῦ Σίμωνα
  choice: seu irmão Simão
  rationale: Mantém com clareza tanto a relação familiar quanto o nome próprio.
- source_word: ἐν τῇ χώρᾳ
  choice: naquela região
  rationale: No contexto geográfico e militar, χώρα designa naturalmente o território ou a região onde Simão permaneceu; “naquela” retoma o espaço já identificado pelo contexto.
