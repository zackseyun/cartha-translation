base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/018.yaml
  text: And King Ptolemy died on the third day[a], and those who were in his strongholds were destroyed by those in the strongholds.
translation:
  language: pt
  text: E o rei Ptolemeu morreu no terceiro dia, e os que estavam em suas fortalezas foram destruídos pelos que estavam nas fortalezas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego repete “nas fortalezas” nas duas partes da frase. A formulação provavelmente distingue os que estavam nas fortalezas de Ptolemeu daqueles que, nas fortalezas, se voltaram contra eles, mas a relação exata entre os grupos é condensada no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Equivalente direto e natural do aoristo grego, sem eufemismo.
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: no terceiro dia
  rationale: Reproduz naturalmente a expressão temporal sem acrescentar um ponto de referência que o grego não explicita.
- source_word: οἱ ὄντες
  choice: os que estavam
  rationale: Mantém a referência geral às pessoas presentes, sem acrescentar uma especificação de gênero ausente no grego.
- source_word: ὀχυρώμασιν
  choice: fortalezas
  rationale: Expressa lugares fortificados em linguagem militar clara e corrente; a repetição foi preservada nas duas ocorrências.
- source_word: ἀπώλοντο
  choice: foram destruídos
  rationale: Conserva a força destrutiva e a construção agentiva com ὑπό, sem restringir indevidamente o sentido a uma forma específica de morte.
- source_word: ὑπὸ τῶν ἐν τοῖς ὀχυρώμασιν
  choice: pelos que estavam nas fortalezas
  rationale: Preserva a agência marcada por ὑπό e a formulação breve e repetitiva do original.
