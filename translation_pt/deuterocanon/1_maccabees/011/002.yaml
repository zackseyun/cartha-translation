    issue: “Entrou na Síria” para ἐξῆλθεν.
    rationale: O verbo grego significa “saiu”, “partiu” ou “foi”; embora o destino seja a Síria, “entrou” substitui o verbo de partida/movimento do texto-fonte.
  - severity: high
    issue: “Para que fossem recebê-lo” para συναντᾷν αὐτῷ.
    rationale: O infinitivo significa “ir ao encontro dele” ou “encontrá-lo”. “Recebê-lo” muda a ação expressa pelo grego; a nota atual também introduz indevidamente a qualificação “favoravelmente”.
  - severity: low
    issue: Ambiguidade em “ele era seu sogro”.
    rationale: A construção reproduz formalmente os pronomes gregos, mas em português deixa incerto quem é sogro de quem. O contexto identifica Ptolemeu como sogro de Alexandre; explicitar Alexandre melhora a compreensão sem impor interpretação adicional.
