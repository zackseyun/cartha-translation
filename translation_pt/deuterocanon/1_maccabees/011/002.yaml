base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/002.yaml
  text: And he went out into Syria with peaceful words[a], and the men from the cities opened to him and went out to meet him, because Alexander the king had given an order to meet him[b], since he was his father-in-law.
translation:
  language: pt
  text: Ele saiu para a Síria com palavras de paz, e os homens das cidades lhe abriram[a] e foram ao encontro dele, porque havia uma ordem do rei Alexandre para que fossem ao encontro dele[b], pois ele era sogro de Alexandre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit., “lhe abriram”. O grego não declara o que foi aberto; pelo contexto, provavelmente as portas das cidades.
    reason: lexical_alternative
  - marker: b
    text: Isto é, Alexandre havia ordenado aos homens das cidades que fossem ao encontro dele, pois Ptolemeu era sogro de Alexandre.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐξῆλθεν εἰς Συρίαν
  choice: entrou na Síria
  rationale: Embora ἐξῆλθεν signifique literalmente “saiu”, com εἰς Συρίαν a expressão descreve a partida e o avanço para dentro da Síria; “entrou na Síria” comunica naturalmente o movimento no destino sem acrescentar conteúdo.
- source_word: λόγοις εἰρηνικοῖς
  choice: com palavras de paz
  rationale: Mantém o substantivo λόγοι e expressa o caráter diplomático e pacífico das declarações, em vez de reduzir a frase a um simples advérbio.
- source_word: ἤνοιγον αὐτῷ
  choice: lhe abriram as portas
  rationale: O objeto de “abriam” está elíptico no grego. Em português, a formulação sem objeto seria pouco natural; “as portas” explicita o sentido contextual provável, com nota indicando a elipse.
- source_word: οἱ ἀπὸ τῶν πόλεων
  choice: os homens das cidades
  rationale: Representa o sujeito masculino plural e o sentido de habitantes ou representantes procedentes das cidades.
- source_word: συνήντων αὐτῷ
  choice: foram ao seu encontro
  rationale: Expressa de modo idiomático o movimento para encontrar alguém e se ajusta ao contexto de recepção oficial.
- source_word: ἐντολὴ ἦν Ἀλεξάνδρου τοῦ βασιλέως
  choice: havia uma ordem do rei Alexandre
  rationale: Preserva a construção nominal e a autoridade da diretiva régia, sem inserir um objeto explícito inexistente no texto grego.
- source_word: συναντᾷν αὐτῷ
  choice: para que fossem recebê-lo
  rationale: Traduz o conteúdo da ordem em português natural e recupera o sujeito implícito, isto é, os representantes das cidades.
- source_word: διὰ τὸ πενθερὸν αὐτοῦ εἶναι
  choice: visto que ele era seu sogro
  rationale: πενθερός designa especificamente o sogro. A formulação conserva os pronomes do grego; o contexto identifica Ptolemeu como sogro de Alexandre.
