  source_fidelity: É necessária revisão. ἐξῆλθεν deve ser representado por “saiu” ou “partiu”, não por “entrou”; e συναντᾷν αὐτῷ significa “ir ao encontro dele/encontrá-lo”, não “recebê-lo”. A elipse do objeto de ἤνοιγον pode ser preservada em português com “lhe abriram” e explicada em nota.
  naturalness: 'A redação revista permanece fluente em português moderno: “saiu para a Síria”, “lhe abriram” e “foram ao encontro dele” são claros no registro narrativo. A identificação explícita de Alexandre na relação de parentesco evita uma ambiguidade pronominal desnecessária em português.'
  terminology: “Palavras de paz”, “ordem do rei Alexandre”, “sogro” e “foram ao encontro” refletem adequadamente os termos gregos e o contexto político, sem acrescentar a ideia de uma recepção favorável que não está expressa no versículo.
  issues:
