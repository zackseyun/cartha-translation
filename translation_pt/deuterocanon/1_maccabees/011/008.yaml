    issue: «Tramava» para διελογίζετο
    rationale: Embora compatível com «planos perversos», pode conotar conspiração secreta. «Elaborava» mantém a deliberação continuada do imperfeito sem essa implicação adicional.
  - severity: low
    issue: Posição da chamada de nota
    rationale: Como a nota explica especificamente «contra Alexandre», a chamada deve seguir esse sintagma, e não a frase inteira.
