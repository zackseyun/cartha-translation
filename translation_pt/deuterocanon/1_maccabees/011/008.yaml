base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/008.yaml
  text: But King Ptolemy gained control of the cities of the coast as far as Seleucia-by-the-Sea[a], and he was devising evil plans against Alexander.
translation:
  language: pt
  text: Mas o rei Ptolemeu tomou o controle das cidades do litoral até Selêucia junto ao mar e elaborava planos perversos contra Alexandre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “considerava planos perversos a respeito de Alexandre”. O grego περὶ Ἀλεξάνδρου significa literalmente “a respeito de Alexandre”, mas, neste contexto, o sentido é hostil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκυρίευσεν
  choice: passou a controlar
  rationale: Expressa a obtenção de domínio político-militar sem sugerir necessariamente soberania permanente; o aoristo é apresentado como aquisição efetiva de controle.
- source_word: πόλεων τῆς παραλίας
  choice: as cidades do litoral
  rationale: Preserva a construção geográfica do grego em português natural e claro.
- source_word: ἕως Σελευκίας τῆς παραθαλασσίας
  choice: até Selêucia à Beira-Mar
  rationale: Mantém o epíteto que distingue esta Selêucia de outras cidades do mesmo nome e reproduz o sentido de 'a marítima'.
- source_word: διελογίζετο
  choice: tramava
  rationale: O imperfeito indica deliberação contínua; junto de 'planos perversos', 'tramava' comunica naturalmente a intenção hostil, embora seja um pouco mais interpretativo que 'considerava'.
- source_word: λογισμοὺς πονηρούς
  choice: planos perversos
  rationale: Representa o sentido de cálculos, desígnios ou planos moralmente maus, em linguagem atual e digna.
- source_word: περὶ Ἀλεξάνδρου
  choice: contra Alexandre
  rationale: A preposição significa literalmente 'a respeito de', mas, qualificada por 'planos perversos', indica no contexto que esses planos se dirigiam hostilmente contra Alexandre; a nota preserva a formulação mais literal.
