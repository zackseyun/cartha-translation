revisions:
- from: Mas o rei Ptolemeu passou a controlar as cidades do litoral até Selêucia à Beira-Mar e tramava planos perversos contra Alexandre.[a]
  to: Mas o rei Ptolemeu tomou o controle das cidades do litoral até Selêucia junto ao mar e elaborava planos perversos contra Alexandre[a].
  rationale: A revisão aproxima a expressão de aquisição de domínio do valor de ἐκυρίευσεν, evita uma conotação não necessária de sigilo em διελογίζετο e emprega uma designação portuguesa mais corrente para o epíteto geográfico de Selêucia. A alternativa literalmente mais próxima para περὶ Ἀλεξάνδρου continua preservada em nota, ancorada no trecho que ela esclarece.
