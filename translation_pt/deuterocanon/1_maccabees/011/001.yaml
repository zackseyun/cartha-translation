base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/001.yaml
  text: And the king of Egypt gathered many forces[a], like the sand by the seashore, and many ships; and he sought to gain control of Alexander’s kingdom by deceit, and to add it to his own kingdom.
translation:
  language: pt
  text: O rei do Egito reuniu numerosas tropas, como a areia à beira-mar, e muitos navios. Ele procurou dominar[a] o reino de Alexandre por meio de engano e acrescentá-lo ao seu próprio reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «apoderar-se do reino de Alexandre» ou «assumir o controle do reino de Alexandre». O verbo grego pode expressar a ideia de prevalecer sobre algo ou obter domínio sobre ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθροισεν
  choice: reuniu
  rationale: O aoristo de ἀθροίζω indica reunir ou ajuntar; «reuniu» é natural em português e se ajusta à mobilização militar sem explicitação excessiva.
- source_word: δυνάμεις πολλὰς
  choice: numerosas tropas
  rationale: No contexto militar, δυνάμεις designa forças ou tropas. «Numerosas tropas» comunica com clareza o referente humano e mantém a ideia de grande quantidade.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: como a areia à beira-mar
  rationale: Preserva a comparação bíblica convencional de uma multidão incontável em linguagem portuguesa natural.
- source_word: πλοῖα πολλά
  choice: muitos navios
  rationale: Tradução direta e idiomática da expressão grega.
- source_word: ἐζήτησεν
  choice: procurou
  rationale: ζητέω expressa aqui intenção e tentativa; «procurou» conserva ambas sem afirmar que o objetivo foi alcançado.
- source_word: κατακρατῆσαι
  choice: dominar
  rationale: O verbo pode significar prevalecer sobre, apoderar-se ou obter domínio. «Dominar» preserva essa amplitude no contexto político.
- source_word: τῆς βασιλείας Ἀλεξάνδρου
  choice: o reino de Alexandre
  rationale: Neste contexto, βασιλεία se refere ao reino ou domínio territorial, não à realeza em sentido abstrato.
- source_word: δόλῳ
  choice: por meio de engano
  rationale: δόλος denota engano, ardil ou fraude. A formulação escolhida é direta e evita intensificar o termo para «traição».
- source_word: προσθεῖναι αὐτὴν τῇ βασιλείᾳ αὐτοῦ
  choice: acrescentá-lo ao seu próprio reino
  rationale: Mantém o sentido básico de προστίθημι, «acrescentar», e deixa claro que o pronome retoma o reino de Alexandre.
