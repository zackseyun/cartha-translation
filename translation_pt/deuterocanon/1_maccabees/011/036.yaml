  text: E nenhuma destas coisas será deixada sem efeito de agora em diante, em tempo algum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετήσεται
  choice: será deixada sem efeito
  rationale: O futuro passivo indica que aquilo que foi estabelecido não será anulado nem invalidado. “Deixada sem efeito” é uma formulação clara e corrente em português, preserva a voz passiva e se ajusta ao contexto de concessões formais sem recorrer a tecnicismo excessivo.
- source_word: οὐδὲν τούτων
  choice: nenhuma destas coisas
  rationale: Retoma coletivamente as concessões ou determinações anteriores e conserva o demonstrativo plural do grego sem explicitar no texto uma interpretação contextual.
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: Expressa de modo natural e contemporâneo o ponto inicial da validade futura.
- source_word: ἐπὶ τὸν ἅπαντα χρόνον
  choice: por todo o tempo
  rationale: Mantém a formulação temporal abrangente do grego. Evita substituir diretamente a expressão por “para sempre”, que poderia soar mais absoluta e menos ligada à duração da validade do decreto.
