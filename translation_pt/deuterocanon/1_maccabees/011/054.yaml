base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/054.yaml
  text: After these things Tryphon returned[a], and Antiochus with him, a younger boy[b]; and he became king and put on the crown.
translation:
  language: pt
  text: Depois dessas coisas, Trifão voltou, trazendo consigo Antíoco, um menino mais novo[a]. Antíoco passou a reinar e pôs o diadema[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma criança mais nova” ou “um menino muito jovem”. A expressão grega ressalta a pouca idade de Antíoco.
    reason: lexical_alternative
  - marker: b
    text: O diadema era uma faixa usada como insígnia da realeza.
    reason: historical_clarification
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Depois dessas coisas
  rationale: Mantém a transição temporal e o plural do demonstrativo grego em português natural.
- source_word: ἀπέστρεψεν
  choice: voltou
  rationale: Expressa de modo direto e idiomático o sentido de retornar ou voltar.
- source_word: Τρύφων καὶ Ἀντίοχος μετʼ αὐτοῦ
  choice: Trifão voltou, trazendo consigo Antíoco
  rationale: Torna natural em português a construção grega, na qual Antíoco está com Trifão, sem alterar a relação entre os personagens.
- source_word: παιδάριον νεώτερον
  choice: um menino mais novo
  rationale: Preserva tanto a referência a um menino ou criança quanto a força comparativa de νεώτερον, sem determinar uma idade exata.
- source_word: ἐβασίλευσεν
  choice: passou a reinar
  rationale: No contexto da imposição do diadema, comunica a provável força ingressiva do aoristo, sem desenvolver além do necessário a ideia de entronização.
- source_word: ἐπέθετο διάδημα
  choice: pôs o diadema
  rationale: Mantém o gesto reflexivo sugerido pela voz média e traduz διάδημα pelo termo específico para a insígnia real.
theological_decisions:
- issue: Força de ἐβασίλευσεν no contexto
  choice: passou a reinar
  alternative: reinou; tornou-se rei
  rationale: A sequência narrativa favorece o início do reinado, mas a formulação escolhida permanece próxima do verbo grego e evita explicar em excesso a forma de sua ascensão.
- issue: Terminologia régia de διάδημα
  choice: diadema
  alternative: coroa
  rationale: “Diadema” é lexicalmente mais específico e preserva a insígnia real mencionada no grego; a nota esclarece seu sentido histórico para leitores modernos.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. O nome “Antíoco” é repetido na segunda frase para evitar a ambiguidade pronominal quanto a quem passou a reinar. As notas preservam a amplitude da expressão referente à idade e esclarecem o sentido régio de “diadema”.
