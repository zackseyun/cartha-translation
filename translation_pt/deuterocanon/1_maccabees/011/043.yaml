base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/043.yaml
  text: Now then[a], you will do well to send us men who will fight alongside me, because all my forces have deserted.
translation:
  language: pt
  text: Agora, pois, você fará bem em nos enviar homens que lutarão ao meu lado[a], pois todas as minhas forças me abandonaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que serão meus aliados”; o verbo grego pode indicar apoio militar como aliado, expresso aqui como lutar ao lado do falante.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, portanto
  rationale: Marca ao mesmo tempo a transição e a conclusão prática do pedido, em linguagem portuguesa natural e digna.
- source_word: ὀρθῶς ποιήσεις
  choice: você fará bem
  rationale: A expressão idiomática recomenda a ação solicitada, sem reduzi-la a uma afirmação moral abstrata.
- source_word: ἀποστείλας ἡμῖν
  choice: em nos enviar
  rationale: O particípio aoristo especifica a ação pela qual o destinatário fará bem; o dativo indica o envio em benefício ou direção ao grupo do remetente.
- source_word: ἄνδρας
  choice: homens
  rationale: Conserva o substantivo não técnico do grego; a função militar é explicitada pela oração seguinte.
- source_word: οἳ συμμαχήσουσίν μοι
  choice: que lutem ao meu lado
  rationale: O verbo indica prestar apoio como aliado, especialmente em combate; a formulação transmite claramente esse sentido militar.
- source_word: ἀπέστησαν
  choice: me abandonaram
  rationale: No contexto militar, indica que as forças se afastaram do governante ou deixaram de apoiá-lo. A escolha preserva o sentido sem impor a nuance técnica mais estreita de deserção ou revolta.
- source_word: πᾶσαι αἱ δυνάμεις μου
  choice: todas as minhas forças
  rationale: δυνάμεις designa forças militares neste contexto, sem determinar uma unidade específica como exército ou tropa.
