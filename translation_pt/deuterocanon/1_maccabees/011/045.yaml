  text: And those from the city gathered in the middle of the city[a], about one hundred twenty thousand men, and they wanted to kill the king.
translation:
  language: pt
  text: E os da cidade reuniram-se no centro da cidade, num total de cento e vinte mil homens[a], e queriam matar o rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “doze miríades de homens”, isto é, 120.000 homens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνώχθησαν
  choice: se reuniram
  rationale: O verbo indica ajuntamento ou reunião. A forma pronominal é natural em português e preserva a ação coletiva.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: os que eram da cidade
  rationale: Reproduz de modo claro a expressão grega sem acrescentar uma identificação mais específica, como “habitantes” ou “homens”.
- source_word: εἰς τὸ μέσον τῆς πόλεως
  choice: no centro da cidade
  rationale: Expressa naturalmente em português a localização central indicada pelo grego.
- source_word: εἰς ἄνδρας δώδεκα μυριάδας
  choice: num total de cento e vinte mil homens
  rationale: A construção indica o número alcançado; doze miríades equivalem a cento e vinte mil. “Homens” traduz explicitamente ἄνδρας.
- source_word: ἠβούλοντο
  choice: queriam
  rationale: Preserva o sentido direto de vontade ou intenção do imperfeito de βούλομαι, sem intensificá-lo indevidamente.
- source_word: ἀνελεῖν
  choice: matar
  rationale: Neste contexto, o infinitivo significa tirar a vida; “matar” é direto, atual e preciso.
