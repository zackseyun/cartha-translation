base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/073.yaml
  text: And those who had fled from him saw it[a], and they returned to him, and with him they pursued as far as Kadesh, as far as their camp[b], and they encamped there.
translation:
  language: pt
  text: E os que haviam fugido dele viram isso[a], voltaram para ele e, com ele, perseguiram até Cades, até o acampamento deles[b], e acamparam ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente, “viram o que havia acontecido”. No grego, o objeto não é expresso e remete aos acontecimentos anteriores.
    reason: lexical_alternative
  - marker: b
    text: “O acampamento deles” refere-se mais naturalmente ao acampamento da força perseguida; o pronome grego, porém, não explicita isso.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ φυγόντες παρ᾽ αὐτοῦ
  choice: os que haviam fugido dele
  rationale: O particípio aoristo substantivado indica os homens que antes tinham fugido, e παρ᾽ αὐτοῦ expressa afastamento dele. A formulação conserva a anterioridade e é natural em português.
- source_word: ἴδον
  choice: viram isso
  rationale: O grego não explicita o objeto, mas remete aos acontecimentos anteriores. O pronome neutro «isso» dá fluência ao português sem especificar além do texto; a nota registra a elipse grega.
- source_word: ἐπέστρεψαν πρὸς αὐτόν
  choice: voltaram para ele
  rationale: Expressa diretamente a reversão da fuga anterior e o retorno ao líder.
- source_word: ἐδίωκον μετ᾽ αὐτοῦ
  choice: junto com ele, perseguiram os inimigos
  rationale: O imperfeito descreve a perseguição em curso, e μετ᾽ αὐτοῦ mantém explícita a participação ao lado dele. «Os inimigos» é um complemento idiomático inferido do grupo perseguido, sem identificar além disso quem eram.
- source_word: ἕως Κάδης
  choice: até Cades
  rationale: ἕως com o topônimo marca o limite alcançado. «Cades» é a forma portuguesa tradicional e legível do nome.
- source_word: ἕως τῆς παρεμβολῆς αὐτῶν
  choice: até o acampamento deles
  rationale: παρεμβολή designa um acampamento militar. O pronome «deles» preserva a referência formalmente ambígua de αὐτῶν, embora o contexto favoreça o grupo perseguido.
- source_word: παρενέβαλον ἐκεῖ
  choice: acamparam ali
  rationale: O verbo militar significa instalar acampamento. A tradução é atual e mantém a relação lexical com «acampamento».
