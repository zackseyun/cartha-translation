translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação narrativa do grego foi preservada sem rigidez excessiva. As duas ambiguidades relevantes — o objeto não expresso de ἴδον e o referente de αὐτῶν — foram mantidas no texto ou esclarecidas sem resolução indevida nas notas.
