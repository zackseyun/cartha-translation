  naturalness: A redação é clara e moderna. «Seu acampamento acamparam» é uma construção metonímica possível, mas «Jônatas e os de seu acampamento» soa mais natural em português e conserva o referente coletivo militar. «De manhã bem cedo» comunica naturalmente a ênfase dupla do grego.
  terminology: «Genesar» e «Nasor» refletem apropriadamente as formas Γεννησάρ e Νασώρ do texto grego. «Planície» é uma boa equivalência para πεδίον. A nota sobre Genesaré é pertinente.
