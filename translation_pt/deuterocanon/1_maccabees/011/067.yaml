base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/067.yaml
  text: And Jonathan and his camp encamped by the water of Gennesar, and they rose early in the morning for the plain of Nasor.
translation:
  language: pt
  text: Jônatas e os de seu acampamento acamparam junto à água de Genesar.[a] De manhã bem cedo, levantaram-se e partiram rumo à planície de Nasor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Genesar é a forma do nome encontrada aqui no texto grego; o lugar também é conhecido como Genesaré.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “levantaram-se cedo de manhã para a planície de Nasor”. O grego indica a direção para a planície, mas não emprega um verbo separado que signifique “partir” ou “ir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: seu exército
  rationale: No contexto militar, παρεμβολή pode designar coletivamente as tropas acampadas. “Seu exército” é natural em português e permite que o grupo seja sujeito de “acamparam”, sem reduzir o termo ao local físico do acampamento.
- source_word: παρενέβαλον
  choice: acamparam
  rationale: Verte diretamente o ato de estabelecer acampamento e preserva o cenário militar.
- source_word: ἐπὶ τὸ ὕδωρ
  choice: junto às águas
  rationale: Com o verbo de acampar, a expressão indica localização junto ao corpo de água. O plural idiomático “às águas” soa natural em português sem acrescentar uma identificação geográfica ausente da frase.
- source_word: τοῦ Γεννησάρ
  choice: de Genesar
  rationale: Mantém a forma do topônimo Γεννησάρ presente no texto grego, sem harmonizá-la silenciosamente com a forma mais conhecida “Genesaré”.
- source_word: ὤρθρισαν τὸ πρωὶ
  choice: De manhã, levantaram-se cedo
  rationale: Preserva tanto o sentido de levantar-se cedo em ὤρθρισαν quanto o reforço temporal de τὸ πρωὶ, embora haja alguma redundância intencional.
- source_word: εἰς τὸ πεδίον Νασώρ
  choice: partiram rumo à planície de Nasor
  rationale: εἰς indica direção para a planície. “Partiram rumo a” explicita em português natural o movimento implícito na construção grega, enquanto a nota registra a forma mais literal.
