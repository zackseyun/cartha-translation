base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/013.yaml
  text: And Ptolemy entered Antioch and put on the crown of Asia[a], and he put two crowns on his head, that of Asia and Egypt.
translation:
  language: pt
  text: 'E Ptolemeu entrou em Antioquia, pôs sobre si a coroa da Ásia[a] e colocou duas coroas na cabeça: a da Ásia e a do Egito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “diadema da Ásia”. O grego emprega o mesmo termo real nas duas ocorrências: primeiro, “a coroa da Ásia”; depois, “duas coroas”, a da Ásia e a do Egito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: Verbo narrativo direto de movimento para dentro da cidade; “entrou” é natural e preserva o sentido do aoristo grego.
- source_word: περιέθετο
  choice: pôs / colocou
  rationale: A forma média indica que Ptolemeu pôs sobre si a insígnia real. As duas formas portuguesas mantêm a ação concreta e evitam a interpretação abstrata “assumiu”.
- source_word: διάδημα
  choice: coroa
  rationale: Embora o termo designe propriamente o diadema ou faixa real, “coroa” é mais acessível no português atual e comunica claramente a insígnia da realeza.
- source_word: τῆς Ἀσίας
  choice: da Ásia
  rationale: Mantém a formulação geográfico-política simples do grego sem explicá-la como “reino selêucida” ou restringi-la a “Ásia Menor”.
- source_word: δύο διαδήματα
  choice: duas coroas
  rationale: Preserva o numeral e a repetição do termo real, destacando o uso simultâneo das duas insígnias.
- source_word: περὶ τὴν κεφαλὴν αὐτοῦ
  choice: sobre a cabeça
  rationale: Expressão natural em português para o uso de insígnias reais na cabeça, próxima da imagem espacial do grego.
theological_decisions:
- issue: Simbolismo real das duas coroas
  choice: Traduzir como o ato concreto de colocar duas coroas
  alternative: Explicitar que Ptolemeu reivindicou o domínio sobre a Ásia e o Egito
  rationale: O gesto tem evidente significado político, mas o grego o narra concretamente. A tradução conserva a imagem e não incorpora sua interpretação ao texto principal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa clara. “Ptolemeu” e “Antioquia” seguem as formas tradicionais em português. A repetição de “Ásia” é mantida por corresponder à ênfase e à estrutura do original.
