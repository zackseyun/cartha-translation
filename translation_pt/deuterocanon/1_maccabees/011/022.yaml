base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/022.yaml
  text: And when he heard it, he was angry. As soon as he heard, he immediately broke camp and came to Ptolemais, and he wrote to Jonathan not to continue the siege, but to meet him for a conference in Ptolemais as quickly as possible.
translation:
  language: pt
  text: Quando ouviu isso, ele ficou irado. Assim que ouviu, levantou acampamento imediatamente e foi para Ptolemaida. Então escreveu a Jônatas, ordenando-lhe que não continuasse o cerco[a], mas que fosse encontrá-lo em Ptolemaida o mais depressa possível, para se reunir com ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “não ficar sentado ao redor” ou “não permanecer ao redor”; neste contexto, a expressão se refere a manter o cerco.
    reason: lexical_alternative
  - marker: b
    text: A construção grega referente ao encontro é difícil, literalmente algo como “encontrá-lo, reunir-se com ele”. O sentido aparente é que Jônatas deveria ir sem demora a Ptolemaida para se reunir com o remetente.
    reason: textual_variant
lexical_decisions:
- source_word: ἀκούσας / ἤκουσεν
  choice: Quando ouviu isso / Assim que recebeu a notícia
  rationale: Mantém a repetição do verbo grego, mas varia levemente a formulação em português para evitar rigidez e destacar a prontidão da reação.
- source_word: ὠργίσθη
  choice: ficou irado
  rationale: Expressa de modo direto o ingresso no estado de ira, sem intensificar para 'enfureceu-se'.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Equivalente moderno e claro para a ação sem demora.
- source_word: ἀναζεύξας
  choice: levantou acampamento
  rationale: Preserva a imagem militar concreta de desmontar ou levantar o acampamento para partir.
- source_word: ἦλθεν εἰς Πτολεμαΐδα
  choice: foi para Ptolemaida
  rationale: Em narrativa portuguesa, 'foi' expressa naturalmente o deslocamento até o destino.
- source_word: ἔγραψεν Ἰωναθὰν
  choice: escreveu a Jônatas
  rationale: Representa o destinatário da comunicação de maneira direta e natural.
- source_word: τοῦ μὴ περικαθῆσθαι
  choice: que não continuasse o cerco
  rationale: No contexto militar, o sentido literal de permanecer sentado ao redor indica a manutenção do cerco; a nota preserva a imagem lexical.
- source_word: ἀπαντῆσαι
  choice: que fosse encontrá-lo
  rationale: Traduz o movimento implícito de ir ao encontro de alguém.
- source_word: αὐτὸν αὐτῷ συνμίσγειν
  choice: para se reunir com ele
  rationale: Oferece uma representação cautelosa da construção grega difícil, sem acrescentar explicitamente a ideia mais interpretativa de conferência.
- source_word: τὴν ταχίστην
  choice: o mais depressa possível
  rationale: Reproduz de forma idiomática o superlativo adverbial de máxima urgência.
