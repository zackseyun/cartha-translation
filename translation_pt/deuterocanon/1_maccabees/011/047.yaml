base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/047.yaml
  text: And the king called the Jews to his aid[a], and they all gathered to him together; and they spread out in the city, and on that day they killed ten thousand in the city.
translation:
  language: pt
  text: Então, o rei convocou os judeus para ajudá-lo, e todos se reuniram junto a ele; espalharam-se pela cidade[a] e, naquele dia, mataram cem mil na cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego também pode ser traduzido de modo mais literal como “foram dispersos na cidade”. Aqui, “espalharam-se pela cidade” reflete o provável sentido militar no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν ... εἰς βοήθειαν
  choice: convocou ... para ajudá-lo
  rationale: O verbo indica que o rei chamou ou convocou os judeus com a finalidade de receber sua ajuda. “Convocou ... para ajudá-lo” é claro, natural e adequado ao contexto militar.
- source_word: ἐπισυνήχθησαν πρὸς αὐτὸν πάντες ἅμα
  choice: todos eles se reuniram junto dele
  rationale: A formulação preserva tanto a totalidade expressa por πάντες quanto a ação coletiva indicada por ἅμα, sem produzir uma repetição artificial em português.
- source_word: διεσπάρησαν ἐν τῇ πόλει
  choice: Espalharam-se pela cidade
  rationale: O verbo significa literalmente dispersar-se ou espalhar-se. No contexto de combate urbano, “espalharam-se pela cidade” comunica naturalmente a distribuição dos combatentes pelo espaço da cidade.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: Equivalente moderno, direto e não arcaizante do verbo grego.
- source_word: εἰς μυριάδας δέκα
  choice: cem mil
  rationale: Uma μυριάς corresponde a dez mil; portanto, dez miríades correspondem a cem mil. A tradução segue o numeral do texto grego, apesar de a camada inglesa fornecida trazer “ten thousand”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A duplicação καὶ καὶ no texto grego foi tratada como repetição textual sem valor semântico adicional. A repetição de “cidade” foi mantida porque ocorre nas duas orações do original. O total foi traduzido como “cem mil”, pois δέκα μυριάδες significa literalmente dez grupos de dez mil.
