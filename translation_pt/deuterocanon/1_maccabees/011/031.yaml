base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/031.yaml
  text: We have also written to you a copy of the letter that Lasthenes wrote to our kinsman concerning you[a], so that you may see it.
translation:
  language: pt
  text: Também lhes escrevemos uma cópia da carta que Lástenes escreveu a nosso parente[a] a respeito de vocês, para que possam vê-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a nosso parente” ou “a nosso compatriota”. O grego συγγενής pode designar um parente consanguíneo, alguém do mesmo povo ou, em contexto diplomático, um associado honrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀντίγραφον τῆς ἐπιστολῆς
  choice: uma cópia da carta
  rationale: ἀντίγραφον designa uma cópia ou transcrição de um documento, e ἐπιστολή significa normalmente “carta”. A formulação é natural em português e mantém o caráter documental.
- source_word: ἧς ἔγραψεν Λασθένεις
  choice: que Lástenes escreveu
  rationale: A oração relativa modifica “carta”, e ἔγραψεν significa especificamente “escreveu”. O nome Λασθένεις é vertido pela forma portuguesa Lástenes.
- source_word: τῷ συγγενεῖ ἡμῶν
  choice: ao nosso parente[a]
  rationale: συγγενής pode indicar parente consanguíneo, membro do mesmo povo ou associado honrado. “Parente” preserva o sentido básico sem excluir a possível acepção diplomática, explicitada em nota.
- source_word: περὶ ὑμῶν
  choice: a respeito de vocês
  rationale: περί com genitivo significa aqui “acerca de” ou “a respeito de”; a escolha é clara e mantém o registro formal.
- source_word: γεγράφαμεν καὶ πρὸς ὑμᾶς
  choice: Também enviamos a vocês
  rationale: Literalmente, a construção diz “também escrevemos a vocês”, mas, tendo “uma cópia” como objeto antecipado, refere-se naturalmente ao envio ou encaminhamento dessa cópia. “Enviamos” evita em português a impressão de que os remetentes produziram outra carta, embora torne explícita uma implicação contextual.
- source_word: ὅπως ἰδῆτε
  choice: para que possam lê-la
  rationale: A construção expressa finalidade. Embora ἰδῆτε seja literalmente “vejam”, no contexto de uma carta significa ter acesso ao conteúdo; “lê-la” comunica naturalmente essa finalidade em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para evitar uma construção pouco natural, mantendo o tom de correspondência oficial. O pronome “vocês” oferece ampla inteligibilidade contemporânea.
