  text: And Simon encamped at Bethsura[a], and fought against it for many days, and shut it in.
translation:
  language: pt
  text: Simão acampou em Betsura, combateu contra ela por muitos dias e a cercou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encerrou-a” ou “bloqueou-a”. O verbo grego significa fechar ou encerrar; no contexto militar, descreve o isolamento da cidade durante um cerco.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβάλλεν
  choice: acampou junto a
  rationale: O verbo indica montar acampamento ou tomar posição. A expressão preserva a sequência militar sem antecipar a ideia de cerco expressa no fim do versículo.
- source_word: Βεθσούρᾳ
  choice: Betsura
  rationale: Transliteração natural em português da forma grega do topônimo.
- source_word: ἐπολέμει
  choice: combateu contra
  rationale: Expressa a ação militar contínua do imperfeito grego sem reduzi-la a um único ataque.
- source_word: ἡμέρας πολλὰς
  choice: durante muitos dias
  rationale: Torna explícito em português o acusativo grego de duração.
- source_word: συνέκλεισεν
  choice: cercando-a por completo
  rationale: Comunica a ideia de fechar ou encerrar a cidade dentro de um cerco. A forma adverbial liga naturalmente a ação ao combate prolongado, embora o grego empregue verbo coordenado.
