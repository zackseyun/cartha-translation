base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/061.yaml
  text: And he went from there to Gaza[a], and the men of Gaza shut him out; and he encamped around it, and burned its outlying parts with fire[b], and plundered them.
translation:
  language: pt
  text: Daí ele foi para Gaza, e os homens de Gaza lhe barraram a entrada. Ele acampou ao redor dela[a], queimou com fogo as suas áreas periféricas[b] e saqueou-as.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pôs Gaza sob cerco». O grego diz literalmente que ele se assentou ou acampou ao redor dela.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é difícil; pode referir-se aos arredores de Gaza, às suas zonas periféricas ou aos seus subúrbios.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: foi
  rationale: O aoristo indica, de modo simples, o deslocamento na sequência narrativa; “foi” é natural e fiel ao contexto.
- source_word: ἀπέκλεισαν
  choice: impediram sua entrada
  rationale: O verbo expressa barrar ou excluir. A formulação comunica a ação hostil sem acrescentar portas ou outro meio não mencionado no grego.
- source_word: οἱ ἀπὸ Γάζης
  choice: os homens de Gaza
  rationale: A expressão significa literalmente “os de Gaza”; no contexto militar, refere-se provavelmente aos homens ou defensores da cidade.
- source_word: περιεκάθισεν περὶ αὐτήν
  choice: acampou ao redor da cidade
  rationale: Preserva a imagem concreta de permanecer acampado em torno da cidade e deixa implícita, sem a impor, a ideia contextual de cerco.
- source_word: τὰ περίπολα αὐτῆς
  choice: as áreas ao redor dela
  rationale: A expressão é lexicalmente difícil. Esta escolha ampla permite entendê-la como os arredores, zonas periféricas ou dependências próximas de Gaza sem especificação excessiva.
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: queimou com fogo
  rationale: Mantém a formulação enfática e algo redundante do grego, ainda compreensível no registro narrativo bíblico.
- source_word: ἐσκύλευσεν
  choice: saqueou
  rationale: É um termo militar claro e atual para a tomada de bens como despojo.
