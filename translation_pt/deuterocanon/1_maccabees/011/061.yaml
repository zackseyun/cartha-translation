  register: Português moderno, claro e digno, com fluidez brasileira e vocabulário amplamente compreensível. A repetição enfática “queimou com fogo” foi mantida por refletir a forma grega; as notas preservam as ambiguidades relativas ao cerco e às áreas periféricas.
