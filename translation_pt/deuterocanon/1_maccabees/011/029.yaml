  text: 'And the king approved[a], and wrote letters to Jonathan concerning all these things, having this form:'
translation:
  language: pt
  text: 'O rei deu sua aprovação e escreveu a Jônatas cartas sobre todas essas questões, nos seguintes termos[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que tinham esta forma”.
    reason: A expressão grega pode indicar a forma ou o teor das cartas; “nos seguintes termos” comunica naturalmente que o texto vem a seguir.
lexical_decisions:
- source_word: εὐδόκησεν
  choice: deu sua aprovação
  rationale: Expressa a aceitação favorável do rei no contexto administrativo, sem dar ao verbo um sentido meramente emotivo.
- source_word: ἔγραψεν
  choice: escreveu
  rationale: Tradução direta do aoristo; com “cartas” como objeto, é natural e preserva a ação verbal do grego.
- source_word: ἐπιστολάς
  choice: cartas
  rationale: Mantém o plural explícito do grego e designa com clareza as comunicações oficiais escritas.
- source_word: περὶ πάντων τούτων
  choice: sobre todas essas questões
  rationale: Retoma os pedidos e assuntos mencionados anteriormente; “questões” é natural em português e conserva a referência abrangente.
- source_word: ἔχουσας τὸν τρόπον τοῦτον
  choice: nos seguintes termos
  rationale: Introduz de modo idiomático o teor das cartas que vem a seguir. A formulação mais literal é preservada em nota.
