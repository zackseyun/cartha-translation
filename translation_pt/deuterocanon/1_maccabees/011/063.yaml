  yaml_path: translation/deuterocanon/1_maccabees/011/063.yaml
  text: And Jonathan heard that Demetrius’s commanders had come to Kedesh in Galilee with a large force[a], intending to remove him from office.
translation:
  language: pt
  text: Jônatas soube que os comandantes de Demétrio tinham chegado a Quedes, na Galileia, com uma grande força, com a intenção de destituí-lo do cargo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “afastá-lo de sua função”. A expressão grega pode indicar a remoção de alguém da função, do encargo ou da posição que lhe foi atribuída.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube
  rationale: Neste contexto, o aoristo de ἀκούω introduz uma informação recebida por relato. “Soube” é natural em português e comunica melhor a chegada de notícias do que o literal “ouviu”.
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: os comandantes de Demétrio
  rationale: Embora ἄρχοντες possa significar governantes, chefes ou autoridades, a presença de uma grande força indica aqui líderes militares; “comandantes” expressa esse sentido sem acrescentar uma patente específica.
- source_word: παρῆσαν
  choice: tinham chegado
  rationale: O verbo descreve presença resultante de chegada. O mais-que-perfeito situa adequadamente essa chegada antes de Jônatas receber a notícia.
- source_word: Κῆδες τὴν ἐν τῇ Γαλιλαίᾳ
  choice: Quedes, na Galileia
  rationale: A expressão identifica esta Quedes por sua localização. A forma “Quedes” é corrente em português bíblico, e a construção é clara e idiomática.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: com uma grande força
  rationale: δύναμις, em narrativa militar, designa contingente ou força armada. “Grande força” mantém a amplitude do termo sem especificá-lo indevidamente como um exército completo.
- source_word: βουλόμενοι
  choice: com a intenção de
  rationale: O particípio exprime vontade ou propósito. A locução escolhida torna explícita essa relação de finalidade em português natural.
- source_word: μεταστῆσαι αὐτὸν τῆς χρείας
  choice: destituí-lo do cargo
  rationale: μεταστῆσαι pode indicar afastar, remover ou depor, e χρεία pode designar função, serviço ou encargo. No contexto político-militar, “destituí-lo do cargo” comunica de modo claro a retirada de Jônatas de sua posição oficial, enquanto a nota preserva a alternativa lexical.
