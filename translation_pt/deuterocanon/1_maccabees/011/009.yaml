base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/009.yaml
  text: And he sent envoys to King Demetrius[a], saying, “Come, let us make a covenant with one another, and I will give you my daughter whom Alexander has[b], and you will reign over your father's kingdom.”
translation:
  language: pt
  text: 'E enviou representantes ao rei Demétrio, dizendo: “Venha, façamos uma aliança entre nós[a]. Eu lhe darei minha filha, que Alexandre tem consigo[b], e você reinará sobre o reino de seu pai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “façamos um tratado entre nós”. O grego usa διαθήκη, termo para um pacto formal, frequentemente traduzido como “aliança”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “minha filha, que Alexandre tem”; no contexto, ela estava com Alexandre como esposa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Forma narrativa natural do aoristo de ἀποστέλλω, sem acrescentar uma nuance técnica ausente do verbo.
- source_word: πρέσβεις
  choice: representantes
  rationale: Designa enviados oficiais em missão diplomática; “representantes” é claro em português internacional, enquanto “mensageiros” poderia minimizar seu caráter oficial.
- source_word: συνθώμεθα ... διαθήκην
  choice: façamos uma aliança
  rationale: A combinação expressa o estabelecimento de um pacto formal. “Aliança” preserva o peso de διαθήκη e funciona no contexto político sem restringi-lo necessariamente a um tratado entre Estados.
- source_word: πρὸς ἑαυτούς
  choice: entre nós
  rationale: Expressa de modo idiomático e conciso a reciprocidade do grego.
- source_word: δώσω σοι τὴν θυγατέρα μου
  choice: Eu lhe darei minha filha
  rationale: Mantém a formulação direta e a força transacional da linguagem de aliança matrimonial.
- source_word: ἣν ἔχει Ἀλέξανδρος
  choice: que Alexandre tem consigo
  rationale: Preserva o sentido básico de ἔχει sem empregar o pouco natural “possui” para uma pessoa; evita explicitar no corpo do texto que ela é esposa, informação contextual não declarada diretamente na oração.
- source_word: βασιλεύσεις
  choice: você reinará
  rationale: Reproduz o valor verbal futuro de βασιλεύω e é digno e inteligível em português moderno.
- source_word: τῆς βασιλείας τοῦ πατρός σου
  choice: sobre o reino de seu pai
  rationale: O genitivo regido por βασιλεύω indica o domínio sobre o qual Demétrio reinaria; “reino” denota aqui o território ou domínio paterno.
