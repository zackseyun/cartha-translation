  text: And some lawless men from the nation were making accusations against him[a].
translation:
  language: pt
  text: E alguns homens sem lei, dentre o povo, apresentavam acusações contra ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «apresentavam petições contra ele», isto é, levavam uma queixa à autoridade. O verbo grego pode indicar um apelo ou uma petição; neste contexto, porém, a ação é hostil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετύγχανον
  choice: apresentavam acusações
  rationale: Com κατ’ αὐτοῦ, o verbo indica aqui uma petição hostil ou denúncia apresentada a uma autoridade. O imperfeito é expresso por «apresentavam», preservando o aspecto contínuo sem tornar a frase pesada.
- source_word: κατʼ αὐτοῦ
  choice: contra ele
  rationale: A preposição κατά com genitivo tem força adversativa neste contexto.
- source_word: τινες
  choice: alguns
  rationale: Mantém a referência indefinida a uma parte do grupo de modo natural em português.
- source_word: ἄνομοι
  choice: homens sem lei
  rationale: Preserva tanto o referente masculino plural quanto a caracterização moral e jurídica, sem reduzir o termo a «maus» nem sugerir necessariamente criminosos oficialmente proscritos.
- source_word: τῶν ἐκ τοῦ ἔθνους
  choice: dentre o povo
  rationale: Indica que esses homens pertenciam ao povo ou nação em questão. «Povo» é mais natural em português e evita a possível associação de «nação» com uma entidade estatal moderna ou a tradução equivocada por «gentios».
theological_decisions:
- issue: Sentido de ἄνομοι
  choice: homens sem lei
  alternative: homens perversos
  rationale: O grego contém uma avaliação moral ligada à ausência ou ao desprezo da lei. A tradução escolhida conserva essa dimensão sem transformar o termo em uma categoria doutrinária técnica.
- issue: Natureza da ação expressa por ἐνετύγχανον
  choice: apresentavam acusações
  alternative: faziam petições contra ele
  rationale: O verbo pode designar petição ou apelo, mas a construção «contra ele» torna a ação hostil. A nota preserva a amplitude lexical sem neutralizar o sentido contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Dentre o povo» evita rigidez excessiva, e «apresentavam acusações» comunica naturalmente uma denúncia formal ou queixa levada à autoridade.
