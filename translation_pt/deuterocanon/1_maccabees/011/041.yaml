base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/041.yaml
  text: And Jonathan sent to Demetrius the king[a], asking that he drive out those in the citadel from Jerusalem, and those in the strongholds; for they were making war against Israel.
translation:
  language: pt
  text: Jônatas mandou pedir ao rei Demétrio que expulsasse de Jerusalém os que estavam na cidadela[a] e os que estavam nas fortalezas, pois estavam guerreando contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “os da Acra”, a cidadela selêucida em Jerusalém.
    reason: A palavra grega ἄκρα pode significar “cidadela”, mas aqui provavelmente designa em particular a fortaleza selêucida conhecida como Acra.
lexical_decisions:
- source_word: ἀπέστειλεν ... πρὸς Δημήτριον τὸν βασιλέα
  choice: mandou pedir ao rei Demétrio
  rationale: A construção grega indica que Jônatas enviou uma comunicação ou representantes com um pedido. “Mandou pedir” expressa isso naturalmente sem acrescentar ao texto um objeto específico, como “mensageiros” ou “mensagem”.
- source_word: ἵνα ἐκβάλῃ
  choice: que expulsasse
  rationale: Após o verbo de envio, ἵνα introduz a ação solicitada; “expulsasse” preserva a ideia vigorosa de fazer sair à força.
- source_word: τοὺς ἐκ τῆς ἄκρας ἐξ Ἱερουσαλήμ
  choice: expulsasse de Jerusalém os que estavam na cidadela
  rationale: A ordem foi ajustada para um português claro, mantendo Jerusalém como o lugar do qual essas pessoas deveriam ser expulsas. “Cidadela” comunica o sentido de ἄκρα, enquanto a identificação específica com a Acra fica registrada em nota.
- source_word: τοὺς ἐν τοῖς ὀχυρώμασιν
  choice: os que estavam nas fortalezas
  rationale: “Fortalezas” é uma tradução corrente e concreta para os lugares fortificados indicados por ὀχυρώματα.
- source_word: ἦσαν γὰρ πολεμοῦντες τὸν Ἰσραήλ
  choice: pois estavam guerreando contra Israel
  rationale: A forma perifrástica grega descreve uma ação hostil contínua. “Estavam guerreando” conserva esse aspecto e o caráter militar de πολεμέω; “contra” explicita em português a relação adversativa com Israel.
