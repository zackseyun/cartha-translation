base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/016.yaml
  text: And Alexander fled to Arabia[a], that he might be sheltered there[b]; but King Ptolemy was exalted.
translation:
  language: pt
  text: E Alexandre fugiu para a Arábia, a fim de ser abrigado ali[a]; mas o rei Ptolemeu foi exaltado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fim de ser ocultado ali” ou “a fim de ser protegido ali”. A expressão grega pode sugerir abrigo, ocultação ou proteção.
    reason: lexical_alternative
  - marker: b
    text: Ou “foi elevado” ou “tornou-se poderoso”. Mais literalmente, o grego diz “foi exaltado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: fugiu
  rationale: O aoristo de φεύγω indica aqui uma fuga ou retirada; “fugiu” transmite diretamente o movimento urgente no contexto político-militar.
- source_word: Ἀραβίαν
  choice: Arábia
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: τοῦ σκεπασθῆναι αὐτὸν ἐκεῖ
  choice: a fim de ser abrigado ali
  rationale: A construção com infinitivo articular expressa finalidade, e o infinitivo passivo é preservado. “Ser abrigado” comunica a ideia de receber cobertura, refúgio ou proteção sem reduzi-la apenas a ocultação.
- source_word: ὁ δὲ βασιλεὺς Πτολεμαῖος
  choice: mas o rei Ptolemeu
  rationale: δέ estabelece aqui contraste entre a fuga de Alexandre e a elevação de Ptolemeu; “mas” torna essa relação clara em português.
- source_word: ὑψώθη
  choice: foi exaltado
  rationale: O passivo de ὑψόω significa literalmente “foi elevado/exaltado”. A escolha preserva a amplitude entre elevação de posição, honra e aumento de poder, sem substituir o verbo por uma interpretação política específica.
theological_decisions:
- issue: Sentido de ὑψώθη no contexto régio e político
  choice: foi exaltado
  alternative: tornou-se poderoso; foi elevado
  rationale: Embora o contexto possa apontar para ascensão política, a formulação mantém a ressonância mais ampla do verbo grego e evita resolver como mero poder aquilo que também pode envolver posição, honra ou êxito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a estrutura narrativa concisa, o passivo da expressão de finalidade e a ambiguidade da elevação de Ptolemeu.
