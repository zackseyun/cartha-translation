  yaml_path: translation/deuterocanon/1_maccabees/011/066.yaml
  text: And they asked him to receive pledges from them[a], and he gave them; then he drove them out from there and took the city, and stationed a garrison in it.
translation:
  language: pt
  text: E eles lhe pediram que aceitasse as garantias deles[a], e ele lhes deu garantias. Depois, expulsou-os dali, tomou a cidade e estabeleceu nela uma guarnição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “receber mãos direitas”. A expressão se refere à troca de garantias ou compromissos, provavelmente simbolizada pelo aperto das mãos direitas; pode envolver paz, lealdade ou outro acordo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίωσαν
  choice: pediram
  rationale: No contexto da construção com infinitivo, expressa um pedido sem a força excessiva de “exigiram”.
- source_word: δεξιὰς λαβεῖν
  choice: aceitasse deles garantias de paz
  rationale: A expressão significa literalmente “receber mãos direitas”, gesto idiomático ligado à troca de garantias ou compromissos. “Garantias de paz” comunica o sentido provável no contexto, enquanto a nota preserva a imagem literal e a amplitude do idioma.
- source_word: ἔδωκεν αὐτοῖς
  choice: ele as concedeu
  rationale: O grego é elíptico; o objeto é retomado da expressão anterior. “Concedeu” torna claro que ele correspondeu ao pedido sem repetir toda a formulação.
- source_word: ἐξέβαλεν
  choice: expulsou-os
  rationale: Transmite de modo direto a remoção forçada indicada pelo verbo.
- source_word: κατελάβετο τὴν πόλιν
  choice: tomou a cidade
  rationale: Expressa a tomada de posse ou ocupação da cidade sem acrescentar pormenores ausentes do grego.
- source_word: ἔθετο ἐπʼ αὐτὴν φρουράν
  choice: estabeleceu nela uma guarnição
  rationale: No contexto militar, φρουρά é uma força de guarda ou guarnição; a formulação portuguesa indica que ela foi instalada para controlar a cidade.
