translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A tradução conserva a sequência narrativa do grego, usando «então» e «depois» apenas como conectores naturais para os repetidos καί, sem alterar as relações essenciais do texto.
