base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/051.yaml
  text: And they threw down their weapons and made peace. And the Jews were honored before the king and before all those in his kingdom, and they returned to Jerusalem with much plunder.
translation:
  language: pt
  text: Então eles depuseram as armas e fizeram a paz. Os judeus foram honrados diante do rei e de todos os que estavam em seu reino; depois, voltaram para Jerusalém levando muitos despojos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρριψαν τὰ ὅπλα
  choice: depuseram as armas
  rationale: A expressão indica abandono das armas ou rendição. «Depuseram as armas» é idiomático em português e comunica esse sentido sem tornar o gesto desnecessariamente brusco.
- source_word: ἐποίησαν εἰρήνην
  choice: fizeram a paz
  rationale: Reproduz de modo natural e conciso o idioma grego, sem acrescentar um complemento que não está expresso.
- source_word: ἐδοξάσθησαν
  choice: foram honrados
  rationale: No contexto histórico, o passivo indica reconhecimento e estima pública, não glorificação em sentido propriamente teológico.
- source_word: ἐναντίον τοῦ βασιλέως
  choice: diante do rei
  rationale: Preserva a ideia de reconhecimento na presença e na consideração do rei.
- source_word: ἐνώπιον πάντων τῶν ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: diante de todos os que estavam em seu reino
  rationale: Mantém a abrangência do grego e liga o reconhecimento público ao conjunto dos habitantes ou presentes no reino.
- source_word: ἐπέστρεψαν εἰς Ἰερουσαλήμ
  choice: voltaram para Jerusalém
  rationale: Forma corrente e precisa para o retorno narrado.
- source_word: σκῦλα πολλά
  choice: muitos despojos
  rationale: «Despojos» designa com precisão os bens tomados em contexto militar; o plural acompanha naturalmente πολλά e mantém um registro histórico digno.
