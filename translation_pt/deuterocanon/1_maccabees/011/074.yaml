  text: Naquele dia, três mil homens dentre os estrangeiros caíram, e Jônatas voltou para Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσον
  choice: caíram
  rationale: Preserva o sentido literal e o uso idiomático militar do verbo, que neste contexto indica baixas em combate sem explicitar além do grego a maneira exata da morte.
- source_word: ἐκ τῶν ἀλλοφύλων
  choice: dentre os estrangeiros
  rationale: ἀλλόφυλοι designa pessoas de outro povo. Embora na Septuaginta possa ser um nome convencional para os filisteus, aqui se refere de modo mais geral aos adversários não judeus; “estrangeiros” evita uma identificação étnica indevidamente específica.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Naquele dia
  rationale: Forma temporal natural em português, equivalente ao grego.
- source_word: εἰς ἄνδρας τρισχιλίους
  choice: cerca de três mil homens
  rationale: A construção com εἰς diante de um número pode indicar a extensão ou o total alcançado e admitir valor aproximativo. A tradução principal preserva essa possibilidade; a leitura de número exato é registrada em nota.
- source_word: ἐπέστρεψεν
  choice: voltou
  rationale: No contexto de deslocamento, o verbo indica retorno a um lugar; “voltou” é claro e natural.
- source_word: Ἰωναθάν
  choice: Jônatas
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa estabelecida do nome da cidade.
