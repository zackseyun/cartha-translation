  text: But King Alexander was in Cilicia in those days[a], because those from those regions were rebelling.
translation:
  language: pt
  text: O rei Alexandre, porém, estava na Cilícia naqueles dias, porque as pessoas daqueles lugares[a] estavam se rebelando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «os daqueles lugares».
    reason: Alternativa lexical que explicita a construção elíptica do grego οἱ ἀπὸ τῶν τόπων ἐκείνων.
lexical_decisions:
- source_word: Ἀλέξανδρος δὲ ὁ βασιλεὺς
  choice: O rei Alexandre, porém
  rationale: Mantém o título e o nome em ordem natural no português; «porém» representa o valor contrastivo de δέ.
- source_word: ἦν ἐν Κιλικίᾳ
  choice: estava na Cilícia
  rationale: O imperfeito de εἰμί descreve a localização de Alexandre naquele momento; «na Cilícia» é a forma geográfica idiomática.
- source_word: κατὰ τοὺς καιροὺς ἐκείνους
  choice: naqueles dias
  rationale: Expressão temporal natural que conserva a referência plural do grego.
- source_word: ὅτι
  choice: porque
  rationale: Introduz a razão de Alexandre estar na Cilícia.
- source_word: ἀπεστάτουν
  choice: estavam se rebelando
  rationale: Preserva o aspecto contínuo do imperfeito e o sentido político de revolta ou insubordinação.
- source_word: οἱ ἀπὸ τῶν τόπων ἐκείνων
  choice: os habitantes daqueles lugares
  rationale: Expressa naturalmente o coletivo elíptico grego, isto é, as pessoas oriundas ou residentes naquelas localidades, sem a repetição pouco idiomática de «os daqueles lugares».
