  text: King Demetrius to Jonathan his brother[a], greetings, and to the nation of the Jews.
translation:
  language: pt
  text: 'O rei Demétrio a Jônatas, seu irmão, e à nação dos judeus[a]: saudações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da nação dos judeus da Judeia». O grego Ἰουδαίων pode destacar a identidade étnica («judeus») ou a vinculação geográfica à Judeia («judeus da Judeia»).
    reason: Alternativa lexical que preserva a amplitude semântica do gentílico grego.
lexical_decisions:
- source_word: Βασιλεὺς Δημήτριος
  choice: O rei Demétrio
  rationale: Mantém o título real junto ao nome do remetente, de modo natural e solene em português.
- source_word: Ἰωνάθαν
  choice: Jônatas
  rationale: Emprega a forma bíblica tradicional e amplamente reconhecida em português.
- source_word: τῷ ἀδελφῷ
  choice: a seu irmão
  rationale: Conserva o termo relacional do grego; no contexto de correspondência régia, pode funcionar como tratamento diplomático ou honorífico, sem exigir parentesco literal.
- source_word: χαίρειν
  choice: saudações
  rationale: Traduz a fórmula epistolar helenística de maneira concisa, natural e formal.
- source_word: ἔθνει
  choice: nação
  rationale: Preserva o sentido coletivo e político de um povo constituído, adequado a uma carta real.
- source_word: Ἰουδαίων
  choice: dos judeus
  rationale: É a forma convencional e imediatamente compreensível em português; o grego também admite a tradução «dos judeanos», registrada em nota.
theological_decisions:
- issue: Sentido de ἀδελφός na correspondência régia
  choice: Manter «irmão» como designação diplomática potencialmente honorífica
  alternative: Explicitar «aliado» ou entender o termo como parentesco literal
  rationale: O texto grego diz expressamente «irmão», mas o contexto epistolar régio favorece um título de solidariedade e honra. A tradução conserva a formulação e sua tensão sem impor parentesco biológico nem substituir o termo por uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com forma epistolar compacta. A construção com dois destinatários antes de «saudações» torna explícito em português que a saudação se dirige tanto a Jônatas quanto à nação, sem alterar o conteúdo do grego.
