lexical_decisions:
- source_word: ἀφεῖλεν
  choice: cortou
  rationale: Com «a cabeça» como objeto direto, o verbo indica que Zabdiel a separou do corpo. «Cortou a cabeça» expressa isso de modo natural e explícito em português.
- source_word: Ζαβδιὴλ
  choice: Zabdiel
  rationale: Transliteração convencional do nome próprio grego.
- source_word: ὁ Ἀραβ
  choice: o árabe
  rationale: O termo funciona como designação étnica em aposição a Zabdiel; «o árabe» é direto e idiomático.
- source_word: τὴν κεφαλὴν Ἀλεξάνδρου
  choice: a cabeça de Alexandre
  rationale: A construção com «de» reproduz naturalmente o genitivo grego e evita qualquer rigidez desnecessária.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo corrente e exato para o ato de mandar o objeto mencionado.
- source_word: τῷ Πτολεμαίῳ
  choice: a Ptolemeu
  rationale: Mantém o destinatário sem acrescentar o título «rei», ausente do texto grego.
