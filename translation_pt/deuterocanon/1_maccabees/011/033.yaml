base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/033.yaml
  text: To the nation of the Jews[a], our friends, who also maintain what is right toward us, we have decided to do good, because of their goodwill toward us.
translation:
  language: pt
  text: À nação dos judeus, nossos amigos e que mantêm o que é justo em relação a nós[a], decidimos fazer o bem, por causa da boa vontade deles para conosco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que cumprem suas obrigações para conosco”. A expressão grega diz literalmente: “e que mantêm as coisas justas em relação a nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: À nação dos judeus
  rationale: O dativo funciona como objeto indireto de ἐκρίναμεν ἀγαθοποιῆσαι. “Nação” preserva o sentido coletivo e político de ἔθνος, e “dos judeus” acompanha de perto o genitivo grego.
- source_word: φίλοις ἡμῶν
  choice: nossos amigos
  rationale: Descrição em aposição à nação judaica; a formulação é direta e natural em português.
- source_word: συντηροῦσι
  choice: que mantêm
  rationale: O particípio indica a continuidade da observância ou da conduta leal; “mantêm” conserva essa ideia sem especificar além do grego.
- source_word: τὰ πρὸς ἡμᾶς δίκαια
  choice: o que é justo para conosco
  rationale: Preserva a expressão deliberadamente ampla, de teor moral, jurídico ou político, literalmente relacionada às “coisas justas” em relação ao remetente.
- source_word: ἐκρίναμεν
  choice: decidimos
  rationale: No estilo oficial da carta, o verbo comunica uma determinação formal; “decidimos” é claro e corrente.
- source_word: ἀγαθοποιῆσαι
  choice: fazer o bem
  rationale: Mantém a amplitude do infinitivo, sem antecipar ou limitar os benefícios concretos descritos pelo contexto.
- source_word: χάριν
  choice: por causa de
  rationale: Expressa naturalmente a relação causal introduzida pela preposição imprópria.
- source_word: τῆς ἑαυτῶν εὐνοίας πρὸς ἡμᾶς
  choice: da boa vontade deles para conosco
  rationale: “Boa vontade” traduz εὔνοια sem reduzi-la necessariamente a lealdade política; “deles” explicita naturalmente o reflexivo grego em português.
theological_decisions: []
