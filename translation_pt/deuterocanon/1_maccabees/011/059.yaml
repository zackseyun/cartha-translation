  yaml_path: translation/deuterocanon/1_maccabees/011/059.yaml
  text: And he appointed Simon his brother as commander from the Ladder of Tyre as far as the borders of Egypt[a][b].
translation:
  language: pt
  text: E nomeou seu irmão Simão comandante desde a Escada de Tiro até as fronteiras do Egito.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «general». O termo grego designa um líder militar, sem necessariamente corresponder a uma patente moderna específica.
    reason: lexical_alternative
  - marker: b
    text: A «Escada de Tiro» é um nome de lugar, provavelmente o desfiladeiro ou escarpa costeira perto de Tiro, e não uma escada literal.
    reason: cultural_note
lexical_decisions:
- source_word: κατέστησεν
  choice: nomeou
  rationale: O verbo indica colocar alguém oficialmente em um cargo ou função; «nomeou» expressa isso de modo natural e direto.
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão Simão
  rationale: Preserva a identificação familiar e segue uma ordem natural em português.
- source_word: στρατηγὸν
  choice: comandante
  rationale: O termo designa um chefe militar; «comandante» evita impor uma patente moderna excessivamente específica.
- source_word: ἀπὸ τῆς κλίμακος Τύρου
  choice: desde a Escada de Tiro
  rationale: κλίμαξ funciona aqui como topônimo; a tradução conserva o nome tradicional do lugar, e «desde» marca naturalmente o início da extensão territorial.
- source_word: ἕως τῶν ὁρίων Αἰγύπτου
  choice: até as fronteiras do Egito
  rationale: Expressa com clareza o limite territorial indicado por ὅρια, que pode referir-se a fronteiras ou regiões limítrofes.
