  yaml_path: translation/deuterocanon/1_maccabees/011/069.yaml
  text: But the ambushes rose up from their places and joined battle[a], and all those with Jonathan fled.
translation:
  language: pt
  text: Mas os homens que estavam de emboscada[a] levantaram-se de suas posições e travaram combate; e todos os que estavam com Jônatas fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “as emboscadas se levantaram”; a expressão se refere aos combatentes escondidos, e não apenas à tática da emboscada.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ ἔνεδρα
  choice: Mas os homens que estavam de emboscada
  rationale: O neutro plural pode designar as emboscadas, mas, como sujeito de ações pessoais, refere-se por metonímia aos combatentes escondidos. A formulação explicita esses agentes em português natural, enquanto a nota preserva a expressão grega.
- source_word: ἐξανέστησαν
  choice: levantaram-se
  rationale: Mantém de perto o sentido do aoristo de ἐξανίστημι e descreve os combatentes saindo de sua posição oculta sem ampliar indevidamente a imagem.
- source_word: ἐκ τῶν τόπων ἑαυτῶν
  choice: de suas posições
  rationale: No contexto militar, τόποι indica os lugares ocupados pelos homens da emboscada. “Posições” é claro e idiomático, sem acrescentar que fossem necessariamente esconderijos.
- source_word: συνῆψαν πόλεμον
  choice: travaram combate
  rationale: Equivalente português corrente para o idioma grego que indica o início ou estabelecimento do confronto armado.
- source_word: οἱ παρὰ Ἰωνάθαν πάντες
  choice: todos os que estavam com Jônatas
  rationale: Reproduz tanto a associação expressa por παρά quanto a totalidade enfática de πάντες, sem impor uma relação de posse ou comando mais forte que o grego.
