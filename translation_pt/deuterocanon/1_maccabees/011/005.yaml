  text: And they reported to the king what Jonathan had done[a], in order to accuse him; but the king kept silent.
translation:
  language: pt
  text: E eles relataram ao rei o que Jônatas tinha feito, a fim de acusá-lo[a]; mas o rei se calou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fim de censurá-lo”, “culpá-lo” ou “desacreditá-lo”. O verbo grego pode indicar censura ou depreciação, não necessariamente uma acusação formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσαντο
  choice: relataram
  rationale: O verbo indica contar ou expor acontecimentos; “relataram” é natural no contexto da apresentação do caso ao rei, sem exigir uma narrativa minuciosa.
- source_word: ἃ ἐποίησεν
  choice: o que Jônatas tinha feito
  rationale: A construção relativa se refere às ações anteriores de Jônatas; o mais-que-perfeito composto esclarece naturalmente a sequência narrativa em português.
- source_word: εἰς τὸ ψογίσαι
  choice: a fim de acusá-lo
  rationale: A construção expressa finalidade, e ψογίζω pode significar censurar, culpar ou desacreditar. “Acusar” se ajusta ao contexto político diante do rei, enquanto a nota preserva a amplitude lexical.
- source_word: αὐτόν
  choice: -lo
  rationale: O pronome retoma naturalmente Jônatas, a pessoa mencionada imediatamente antes e alvo do relato hostil.
- source_word: ἐσίγησεν
  choice: ficou em silêncio
  rationale: Expressa de modo corrente a ausência de resposta do rei, sem acrescentar uma motivação que o grego não explicita.
- source_word: ὁ βασιλεύς
  choice: o rei
  rationale: Equivalente padrão e claro do título no contexto narrativo.
