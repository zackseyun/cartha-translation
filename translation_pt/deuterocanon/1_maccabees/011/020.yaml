base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/020.yaml
  text: In those days Jonathan gathered those from Judea to make war against the citadel in Jerusalem[a], and they built many siege engines against it.
translation:
  language: pt
  text: Naqueles dias, Jônatas reuniu os da Judeia para guerrear contra a cidadela em Jerusalém[a], e eles construíram muitas máquinas de cerco para atacá-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Acra”, a fortaleza situada em Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: reuniu
  rationale: O aoristo de συνάγω indica juntar pessoas para uma ação militar; “reuniu” é natural e não acrescenta a ideia de uma convocação formal.
- source_word: τοὺς ἐκ τῆς Ἰουδαίας
  choice: os que eram da Judeia
  rationale: Preserva a expressão elíptica do grego sem inserir explicitamente “homens”, embora o contexto seja militar.
- source_word: τοῦ ἐκπολεμῆσαι
  choice: para guerrear contra
  rationale: O infinitivo articular expressa finalidade, e ἐκπολεμέω descreve ação militar hostil mais forte que simplesmente “lutar”.
- source_word: τὴν ἄκραν τὴν ἐν Ἱερουσαλήμ
  choice: a cidadela de Jerusalém
  rationale: ἄκρα designa uma fortaleza ou cidadela e, neste contexto, a fortificação selêucida conhecida como Acra; “cidadela” comunica a função no texto principal.
- source_word: μηχανὰς πολλάς
  choice: muitas máquinas de cerco
  rationale: No contexto de ataque a uma fortificação, μηχαναί são engenhos ou máquinas militares de cerco, não máquinas genéricas.
- source_word: ἐποίησαν ἐπʼ αὐτὴν
  choice: construíram ... para atacá-la
  rationale: ποιέω com μηχαναί indica fabricar ou construir os equipamentos; a formulação explicita de modo natural em português a direção hostil de ἐπʼ αὐτήν.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém a referência não especificada às pessoas da Judeia e esclarece o sentido militar de μηχαναί sem ampliar o conteúdo.
