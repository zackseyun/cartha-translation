base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/003.yaml
  text: And as he entered into the cities of Ptolemais[a], he stationed forces as a garrison in each city.
translation:
  language: pt
  text: E, quando entrava nas cidades de Ptolemaida[a], ele destacava tropas para servirem de guarnição em cada cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “nas cidades Ptolemaida”. A construção é sintaticamente comprimida e pode indicar as cidades pertencentes a Ptolemeu ou sob seu controle; também se relaciona de forma ambígua com o nome da cidade de Ptolemaida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quando
  rationale: Introduz a circunstância temporal da ação seguinte; em português, “Quando” transmite com naturalidade a transição narrativa e a simultaneidade, sem exigir a reprodução mecânica de δέ.
- source_word: εἰσεπορεύετο
  choice: entrava
  rationale: O imperfeito de εἰσπορεύομαι sugere ação progressiva ou repetida ao passar pelas várias cidades. “Entrava” preserva esse aspecto e rege naturalmente a preposição “em” em português.
- source_word: εἰς τὰς πόλεις Πτολεμαΐς
  choice: nas cidades de Ptolemaida[a]
  rationale: Mantém de perto a formulação grega comprimida e sua dificuldade sintática, sem resolver silenciosamente a relação entre o plural “cidades” e o nome singular “Ptolemaida”. A nota registra a ambiguidade.
- source_word: ἀπετάσσε
  choice: destacava
  rationale: No contexto militar, o verbo indica dispor ou designar tropas para determinado posto. “Destacava” é corrente e combina com a função de guarnição.
- source_word: τὰς δυνάμεις
  choice: tropas
  rationale: Aqui δυνάμεις designa contingentes militares. “Tropas” é mais claro ao leitor comum do que o mais amplo “forças” e não sugere vários exércitos completos.
- source_word: φρουράν
  choice: para servirem de guarnição
  rationale: 'Explicita em português a função predicativa de φρουράν: as tropas eram colocadas nas cidades com a finalidade de constituir a guarnição.'
- source_word: ἐν ἑκάστῃ πόλει
  choice: em cada cidade
  rationale: Reproduz diretamente o valor distributivo e individualizador de ἑκάστῃ.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperfeito em “entrava” e “destacava” apresenta ações repetidas ao longo do percurso. A formulação incomum “cidades de Ptolemaida” foi mantida no texto para não eliminar a dificuldade real do grego, esclarecida em nota.
