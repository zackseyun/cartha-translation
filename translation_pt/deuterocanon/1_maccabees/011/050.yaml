translation:
  language: pt
  text: Dá-nos a tua mão direita[a], e que os judeus parem de lutar contra nós e contra a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dá-nos mãos direitas”. É uma expressão para oferecer um compromisso de paz, aliança ou boa-fé.
