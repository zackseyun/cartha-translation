lexical_decisions:
- source_word: Δὸς ἡμῖν δεξιάς
  choice: Deem-nos a mão direita
  rationale: A expressão concreta do grego é preservada em português como gesto de compromisso, paz ou boa-fé. Embora δεξιάς seja plural no grego, o singular distributivo é a forma idiomática natural em português para várias pessoas darem cada qual a mão direita.
- source_word: παυσάσθωσαν
  choice: que ... parem
  rationale: O imperativo na terceira pessoa ordena que os judeus cessem a ação; esta construção é clara e corrente em português.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Equivalência direta do substantivo gentílico definido, sem explicitação adicional.
- source_word: πολεμοῦντες
  choice: de lutar contra
  rationale: Expressa a ação hostil em curso e mantém a regência adversativa aplicada tanto a 'nós' como a 'cidade'.
- source_word: τὴν πόλιν
  choice: a cidade
  rationale: Mantém o artigo definido do grego sem acrescentar o possessivo 'nossa', ausente do texto-fonte.
