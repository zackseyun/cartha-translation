base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/060.yaml
  text: And Jonathan went out[a], and he traveled beyond the river and through the cities, and all the forces of Syria gathered to him as allies, and he came to Ashkelon[b], and the men of the city met him with honor.
translation:
  language: pt
  text: Jônatas partiu e seguiu viagem para além do rio[a] e pelas cidades. Todas as forças da Síria se reuniram a ele como aliadas[b]. Ele chegou a Ascalom, e os habitantes da cidade foram ao encontro dele com honras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não identifica “o rio”; neste contexto histórico, provavelmente se trata do Eufrates.
    reason: cultural_note
  - marker: b
    text: Ou “para uma aliança” ou “em aliança”. A expressão grega indica que as forças sírias se reuniram para apoiar Jônatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλεν
  choice: partiu
  rationale: Expressa de modo natural o início do deslocamento de Jônatas, sem acrescentar uma nuance militar que o verbo, por si só, não exige.
- source_word: διεπορεύετο
  choice: seguiu viagem
  rationale: O imperfeito descreve deslocamento continuado; a expressão portuguesa conserva esse aspecto narrativo.
- source_word: πέραν τοῦ ποταμοῦ
  choice: para além do rio
  rationale: Mantém a referência genérica do grego e não identifica no texto principal um rio que a fonte não nomeia.
- source_word: ἐν ταῖς πόλεσιν
  choice: pelas cidades
  rationale: No contexto de movimento, traduz idiomaticamente a passagem de Jônatas pelas cidades, embora ἐν tenha literalmente o sentido de “em”.
- source_word: ἠθροίσθησαν
  choice: se reuniram
  rationale: Representa com clareza a concentração das forças junto de Jônatas.
- source_word: δυνάμεις
  choice: forças
  rationale: No contexto militar, designa coletivamente contingentes armados sem pressupor um único exército organizado.
- source_word: εἰς συμμαχίαν
  choice: como aliadas
  rationale: 'Comunica em português corrente a finalidade ou o resultado da reunião: apoiar Jônatas em aliança.'
- source_word: Ἀσκαλῶνα
  choice: Ascalom
  rationale: Forma tradicional e amplamente reconhecível do topônimo no português bíblico brasileiro.
- source_word: ἀπήντησαν αὐτῷ
  choice: foram ao encontro dele
  rationale: Explicita naturalmente o movimento inerente ao verbo grego de sair ou ir ao encontro de alguém.
- source_word: ἐνδόξως
  choice: com honras
  rationale: Transmite uma recepção pública honrosa ou distinta sem a formulação pouco natural “gloriosamente”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com fluidez narrativa. Preserva-se a referência não especificada ao rio, enquanto a relação de aliança é expressa de forma idiomática. Os marcadores foram colocados junto às expressões que as notas explicam.
