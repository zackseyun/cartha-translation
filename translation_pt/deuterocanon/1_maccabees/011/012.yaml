base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/012.yaml
  text: And after taking his daughter away from him[a], he gave her to Demetrius; and Alexander’s attitude changed, and their hostility became evident.
translation:
  language: pt
  text: E, depois de tirar dele a própria filha, deu-a a Demétrio. O semblante de Alexandre mudou[a], e a hostilidade entre eles se tornou evidente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o rosto de Alexandre se alterou”. A expressão pode indicar uma mudança de disposição ou atitude, e não apenas da expressão facial.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφελόμενος αὐτοῦ τὴν θυγατέρα
  choice: depois de tirar dele a própria filha
  rationale: O particípio aoristo indica uma ação anterior, e αὐτοῦ designa aquele de quem a filha foi tirada, isto é, Alexandre. “A própria filha” deixa claro, de modo natural em português, que se trata da filha do sujeito da oração, sem confundi-la com uma filha de Alexandre.
- source_word: ἔδωκεν αὐτὴν τῷ Δημητρίῳ
  choice: deu-a a Demétrio
  rationale: Mantém o sentido básico de “dar” e não acrescenta explicitamente “em casamento”, embora o contexto implique uma união matrimonial.
- source_word: ἠλλοιώθη τὸ πρόσωπον Ἀλεξάνδρου
  choice: O semblante de Alexandre mudou
  rationale: “Semblante” preserva a imagem concreta de πρόσωπον (“rosto”) e, ao mesmo tempo, permite o sentido idiomático de mudança de disposição ou atitude.
- source_word: ἐφάνη
  choice: se tornou evidente
  rationale: Expressa que a hostilidade passou a manifestar-se claramente, em vez de sugerir apenas uma aparição visual.
- source_word: ἡ ἔχθρα αὐτῶν
  choice: a hostilidade entre eles
  rationale: Traduz ἔχθρα de forma corrente e torna claro que αὐτῶν se refere à inimizade existente entre os dois.
