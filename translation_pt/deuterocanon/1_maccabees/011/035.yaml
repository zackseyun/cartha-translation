base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/035.yaml
  text: And the other things belonging to us from now on—the tithes and the taxes belonging to us[a], and the salt lakes[b], and the crowns belonging to us—we will grant all these to them.
translation:
  language: pt
  text: 'E, de agora em diante, cederemos a eles tudo o mais que nos pertence: os dízimos e os tributos que nos são devidos, os lagos de sal[a] e as coroas que nos são devidas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “salinas” ou “instalações de produção de sal”. O grego diz literalmente “lagos de sal” e provavelmente se refere a recursos produtores de sal ou às receitas provenientes deles.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “coroas”. Neste contexto fiscal, o termo pode designar uma contribuição tradicional em forma de coroa ou um pagamento honorífico devido ao rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄλλα τὰ ἀνήκοντα ἡμῖν
  choice: tudo o mais que nos pertence
  rationale: Mantém o sentido amplo de outros direitos ou receitas reais, com formulação administrativa natural em português.
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: Indica que a concessão passa a vigorar imediatamente e continua no futuro.
- source_word: δεκατῶν
  choice: dízimos
  rationale: Equivalente corrente para a décima parte cobrada como obrigação fiscal ou religiosa.
- source_word: τελῶν
  choice: tributos
  rationale: Termo abrangente e adequado ao contexto fiscal; evita restringir o sentido a impostos alfandegários.
- source_word: τὰς τῶν ἁλῶν λίμνας
  choice: os lagos de sal
  rationale: Reproduz de perto a expressão grega e preserva a incerteza entre acidentes geográficos, instalações produtoras de sal e as receitas correspondentes.
- source_word: στεφάνους
  choice: coroas
  rationale: Conserva o sentido literal, sem eliminar a possível referência administrativa a uma contribuição honorífica ou fiscal oferecida ao rei.
- source_word: πάντα ἐπαρκέσομεν αὐτοῖς
  choice: cederemos a eles tudo
  rationale: No contexto de concessões reais, comunica a transferência ou renúncia a receitas e prerrogativas com clareza, sem especificar indevidamente o mecanismo jurídico.
