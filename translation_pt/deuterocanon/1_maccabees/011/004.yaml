base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/004.yaml
  text: But when he came near Ashdod[a], they showed him the temple of Dagon burned down, and Ashdod and its surrounding villages torn down, and the bodies thrown about[b], and those burned in the war—for they had made heaps of them along his route.
translation:
  language: pt
  text: Quando ele se aproximou de Asdode, mostraram-lhe o templo de Dagom incendiado, Asdode e os povoados ao redor[a] demolidos, os cadáveres atirados ao chão e os que ele havia queimado durante a guerra, pois tinham feito montes[b] com eles ao longo do seu caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os arredores” ou “os distritos periféricos”.
    reason: lexical_alternative
  - marker: b
    text: O termo grego é raro e seu sentido exato é incerto; também pode significar “pilhas”, “montículos” ou, possivelmente, “piras funerárias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: se aproximou
  rationale: Expressa de modo natural e direto o movimento de chegar perto.
- source_word: Ἄζωτον
  choice: Asdode
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome bíblico.
- source_word: ἱερὸν Δαγὼν
  choice: templo de Dagom
  rationale: No contexto de um local de culto pagão, “templo” comunica claramente o sentido de ἱερόν.
- source_word: ἐνεπυρισμένον
  choice: incendiado
  rationale: Descreve o estado resultante do templo após ter sido posto em chamas sem acrescentar que foi totalmente consumido.
- source_word: τὰ περιπόλια αὐτῆς
  choice: os povoados ao redor
  rationale: Indica assentamentos ou áreas habitadas periféricas em linguagem clara, evitando o anacronismo potencial de “subúrbios”.
- source_word: καθῃρημένα
  choice: demolidos
  rationale: Comunica que a cidade e seus arredores haviam sido derrubados ou destruídos.
- source_word: τὰ σώματα ἐρριμμένα
  choice: os cadáveres espalhados
  rationale: O contexto exige corpos mortos, e “espalhados” preserva a cena de abandono desordenado.
- source_word: τοὺς ἐμπεπυρισμένους οὓς ἐνεπύρισε
  choice: os que ele havia queimado
  rationale: Preserva tanto o particípio referente às pessoas queimadas quanto a oração relativa que atribui a ação a “ele”, sem eliminar a repetição do grego.
- source_word: ἐν τῷ πολέμῳ
  choice: durante a guerra
  rationale: Mantém o alcance mais amplo de πόλεμος, em vez de restringi-lo a uma única batalha.
- source_word: βωμίας
  choice: montes
  rationale: A palavra rara parece designar pilhas ou montículos feitos com os mortos; “montes” preserva a imagem sem impor a interpretação mais específica de piras funerárias.
- source_word: ἐν τῇ ὁδῷ αὐτοῦ
  choice: ao longo do seu caminho
  rationale: Indica que os montes estavam dispostos na rota pela qual ele passava.
