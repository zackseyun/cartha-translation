lexical_decisions:
- source_word: Βασιλεὺς
  choice: O rei
  rationale: Título real que identifica o remetente; em português, o artigo definido produz uma abertura natural sem alterar o sentido.
- source_word: Δημήτριος
  choice: Demétrio
  rationale: Forma tradicional e amplamente reconhecida do nome grego em português.
- source_word: Λασθένει
  choice: a Lástenes
  rationale: O dativo marca o destinatário na fórmula epistolar; a preposição «a» conserva com clareza essa relação.
- source_word: τῷ πατρὶ
  choice: seu pai
  rationale: Mantém a formulação do grego e sua possível ambiguidade, enquanto a nota esclarece que pode se tratar de designação honorífica ou cortesã.
- source_word: χαίρειν
  choice: saudações
  rationale: Equivalente idiomático da fórmula grega usada na abertura de cartas; evita o literalismo pouco natural «alegrar-se».
