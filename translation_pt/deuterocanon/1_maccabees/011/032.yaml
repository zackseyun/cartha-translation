  language: pt
  text: 'O rei Demétrio a Lástenes, seu pai[b]: saudações.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Fórmula grega de abertura de carta; literalmente: «O rei Demétrio a Lástenes, seu pai, alegrar-se».'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, «seu pai» provavelmente funciona como título honorífico ou cortesão, não necessariamente como afirmação de parentesco biológico.
