translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura foi dividida em duas frases para evitar uma sequência excessiva de coordenações, mantendo a progressão narrativa e a ênfase incomum do grego em “poderosos por sua força”.
