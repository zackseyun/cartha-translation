base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/044.yaml
  text: And Jonathan sent three thousand men, mighty in their strength, to Antioch, and they came to the king, and the king rejoiced at their arrival.
translation:
  language: pt
  text: Jônatas enviou a Antioquia três mil homens de grande força. Eles foram até o rei, e o rei se alegrou com a chegada deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a aproximação deles” ou “por terem vindo”; o termo grego pode indicar aproximação ou vinda, mas aqui provavelmente se refere à chegada dos homens de Jônatas diante do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: É o equivalente narrativo direto e natural para o verbo grego de enviar.
- source_word: ἄνδρας τρισχιλίους
  choice: três mil homens
  rationale: Mantém o sentido explícito de ἄνδρας sem acrescentar “soldados”, embora o contexto seja militar.
- source_word: δυνατοὺς ἰσχύι αὐτῶν
  choice: poderosos por sua força
  rationale: Preserva a formulação enfática e parcialmente redundante do grego, sem reduzi-la a um único adjetivo.
- source_word: εἰς Ἀντιοχίαν
  choice: a Antioquia
  rationale: Expressa de modo idiomático o movimento em direção à cidade.
- source_word: ἦλθοσαν πρὸς τὸν βασιλέα
  choice: foram até o rei
  rationale: Em português, “foram” acompanha naturalmente o ponto de vista narrativo depois de terem sido enviados; “até o rei” preserva o movimento em direção a ele.
- source_word: ηὐφράνθη
  choice: se alegrou
  rationale: Comunica claramente a alegria indicada pelo verbo, em registro digno e corrente.
- source_word: ἐπὶ τῇ ἐφόδῳ αὐτῶν
  choice: com a chegada deles
  rationale: No contexto, a expressão provavelmente se refere à chegada ou vinda dos homens diante do rei, embora o substantivo também possa indicar aproximação.
