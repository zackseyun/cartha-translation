  yaml_path: translation/deuterocanon/1_maccabees/011/062.yaml
  text: And the men from Gaza asked terms of Jonathan[a], and he gave them pledges; and he took the sons of their rulers as hostages and sent them to Jerusalem[b]. And he passed through the country as far as Damascus.
translation:
  language: pt
  text: Os homens de Gaza pediram condições a Jônatas, e ele lhes deu garantias[a]. Então tomou como reféns os filhos dos governantes deles e os enviou a Jerusalém[b]. Depois, atravessou a região até Damasco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deu-lhes mãos direitas”, expressão usada para oferecer garantias de compromisso ou boa-fé.
    reason: lexical_alternative
  - marker: b
    text: Depois de “Jerusalém”, o testemunho grego aqui traz a palavra isolada “Asalim” (Ἀσαλήμ). Como ela não se encaixa naturalmente na frase, pode ser uma corrupção textual ou um nome de lugar deslocado nesta linha de transmissão.
    reason: textual_variant
lexical_decisions:
- source_word: ἠξίωσαν
  choice: pediram condições
  rationale: No contexto político-militar, o verbo expressa um pedido de condições favoráveis, mais específico que um simples pedido, sem explicitar além do grego que se tratava formalmente de paz.
- source_word: οἱ ἀπὸ Γάζης
  choice: Os homens de Gaza
  rationale: Representa naturalmente os representantes ou habitantes procedentes da cidade, em vez de tratar Gaza de modo abstrato.
- source_word: ἔδωκεν αὐτοῖς δεξιάς
  choice: ele lhes deu garantias
  rationale: A expressão literalmente menciona 'mãos direitas', gesto idiomático de compromisso ou boa-fé. 'Deu garantias' comunica esse valor em português atual sem acrescentar explicitamente 'de paz'.
- source_word: τοὺς υἱοὺς τῶν ἀρχόντων αὐτῶν
  choice: os filhos dos governantes deles
  rationale: ἀρχόντων designa autoridades governantes; a formulação mantém claro que os filhos pertenciam aos governantes de Gaza.
- source_word: εἰς ὅμηρα
  choice: como reféns
  rationale: Expressa de forma direta a função para a qual os filhos foram tomados.
- source_word: διῆλθεν τὴν χώραν
  choice: atravessou a região
  rationale: χώρα pode indicar terra, território ou região; 'região' é natural no relato de deslocamento e evita sugerir um Estado nacional moderno.
- source_word: ἕως Δαμασκοῦ
  choice: até Damasco
  rationale: Equivalente espacial natural e fiel de ἕως seguido do nome do lugar.
- source_word: Ἀσαλήμ
  choice: não incorporado ao corpo do versículo
  rationale: A palavra isolada ocorre depois de 'Jerusalém' no testemunho fornecido, mas não se integra à sintaxe; é preservada em nota como possível corrupção textual ou topônimo intruso.
