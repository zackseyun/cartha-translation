base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/038.yaml
  text: And King Demetrius saw that the land was quiet before him and that nothing opposed him[a], so he dismissed all his forces, each to his own place, except for the foreign forces that he had recruited from the islands of the nations[b]; and all the forces from his fathers became hostile to him.
translation:
  language: pt
  text: 38 O rei Demétrio viu que a terra estava tranquila diante dele e que nada lhe resistia. Então dispensou todas as suas tropas, cada um para o seu próprio lugar, exceto as tropas estrangeiras[a] que havia recrutado das ilhas das nações. E todas as tropas que vinham de seus antepassados[b] tornaram-se hostis a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tropas mercenárias”. O grego se refere especificamente a tropas não nativas e pode sugerir soldados estrangeiros contratados.
    reason: lexical_alternative
  - marker: b
    text: A expressão provavelmente se refere às tropas tradicionais herdadas do governo de seus antepassados, em contraste com as tropas estrangeiras que ele conservou.
    reason: cultural_note
lexical_decisions:
- source_word: ἡσύχασεν ἡ γῆ
  choice: a terra estava tranquila
  rationale: Expressa a ausência de agitação ou resistência político-militar sem ampliar o sentido para uma paz plena.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Mantém a expressão relacional do grego e sugere tranquilidade sob seu governo sem explicitar além do texto.
- source_word: οὐθὲν αὐτῷ ἀνθεστήκει
  choice: nada lhe resistia
  rationale: Formulação natural em português que conserva a ideia de oposição contínua.
- source_word: ἀπέλυσεν πάσας τὰς δυνάμεις αὐτοῦ
  choice: dispensou todas as suas tropas
  rationale: No contexto militar, ἀπολύω indica mandar embora ou liberar do serviço; 'tropas' comunica claramente o sentido de δυνάμεις.
- source_word: ἕκαστον εἰς τὸν ἴδιον τόπον
  choice: cada um para o seu próprio lugar
  rationale: Preserva a construção distributiva e a amplitude de τόπος, que pode indicar lar, região ou posto.
- source_word: ξένων δυνάμεων
  choice: tropas estrangeiras
  rationale: Conserva o sentido explícito de tropas não nativas sem impor que fossem necessariamente mercenárias.
- source_word: ἐξενολόγησεν
  choice: havia recrutado
  rationale: Traduz o recrutamento de estrangeiros sem tornar explícita a possível, mas não obrigatória, ideia de contratação mercenária.
- source_word: ἀπὸ τῶν νήσων τῶν ἐθνῶν
  choice: das ilhas das nações
  rationale: Segue de perto a expressão grega e evita substituir 'nações' por uma interpretação geográfica mais restrita.
- source_word: πᾶσαι αἱ δυνάμεις αἱ ἀπὸ τῶν πατέρων
  choice: todas as tropas que vinham de seus antepassados
  rationale: Mantém a expressão dinástica comprimida do grego, indicando as tropas tradicionais recebidas dos predecessores sem inserir explicitamente 'do tempo de'.
- source_word: ἠχθρασαν αὐτῷ
  choice: tornaram-se hostis a ele
  rationale: Reproduz o sentido ingressivo de passarem a nutrir hostilidade contra o rei.
