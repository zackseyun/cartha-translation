lexical_decisions:
- source_word: συνήντησεν
  choice: encontrou-se com
  rationale: Expressa naturalmente o encontro entre Jônatas e o rei, sem especificar além do grego quem tomou a iniciativa.
- source_word: εἰς Ἰόππην
  choice: em Jope
  rationale: Neste contexto, a preposição com o nome do lugar indica de modo idiomático onde ocorreu o encontro.
- source_word: μετὰ δόξης
  choice: foi recebido com honra
  rationale: Em um contexto diplomático, δόξα aponta para honra ou tratamento honroso. A formulação torna clara a relação natural da expressão com a recepção de Jônatas.
- source_word: ἠσπάσαντο ἀλλήλους
  choice: Eles se cumprimentaram
  rationale: Traduz a saudação recíproca sem impor o gesto mais específico de um abraço.
- source_word: ἐκοιμήθησαν
  choice: passaram a noite
  rationale: Embora o verbo possa significar literalmente dormir, na narrativa de viagem refere-se naturalmente a permanecer ou pernoitar no local.
