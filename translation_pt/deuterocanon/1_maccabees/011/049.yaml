base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/049.yaml
  text: And those in the city saw that the Jews had gained control of the city as they wished, and they lost heart, and they cried out to the king with a plea, saying,
translation:
  language: pt
  text: 'E os que estavam na cidade viram que os judeus haviam assumido o controle da cidade como queriam, perderam o ânimo e clamaram ao rei em súplica, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ὑπὸ τῆς πόλεως
  choice: os que estavam na cidade
  rationale: A expressão designa as pessoas ou o grupo presente na cidade, e não uma posição literal debaixo dela. A formulação é natural e evita especificar além do texto.
- source_word: κατεκράτησαν ... τῆς πόλεως
  choice: haviam assumido o controle da cidade
  rationale: O verbo com genitivo expressa domínio efetivo sobre a cidade. A tradução comunica o resultado sem acrescentar uma tomada necessariamente violenta.
- source_word: ὡς ἠβούλοντο
  choice: como queriam
  rationale: Reproduz de modo direto e corrente a ideia de que o domínio alcançado correspondia à vontade dos judeus.
- source_word: ἠσθένησαν ταῖς διανοίαις αὐτῶν
  choice: perderam o ânimo
  rationale: A expressão literalmente fala de enfraquecimento na mente ou disposição; em português, a locução escolhida transmite naturalmente o colapso da coragem ou determinação.
- source_word: ἐκέκραξαν πρὸς τὸν βασιλέα
  choice: clamaram ao rei
  rationale: Preserva a intensidade de κράζω e mantém o destinatário do clamor.
- source_word: μετὰ δεήσεως
  choice: suplicando
  rationale: Expressa de maneira fluente a súplica urgente indicada por δέησις, sem recorrer a uma construção nominal pesada.
- source_word: λέγοντες
  choice: ':'
  rationale: Como o particípio introduz a fala direta que continua no versículo seguinte, os dois-pontos cumprem essa função naturalmente em português.
