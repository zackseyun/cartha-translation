base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/040.yaml
  text: And he stayed close to him[a], so that he might hand him over to him, so that he might reign in place of his father. And they reported to him all that Demetrius had done, and the hostility with which his forces were hostile to him; and he remained there many days.
translation:
  language: pt
  text: E ele permaneceu junto dele, para que este o entregasse a ele, a fim de que reinasse no lugar de seu pai. Relataram-lhe tudo o que Demétrio tinha feito e a hostilidade que suas próprias forças demonstravam contra ele[a]; e ele permaneceu ali muitos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega uma formulação repetitiva, literalmente: “a hostilidade com que suas forças lhe eram hostis”. O sentido é que as próprias forças de Demétrio agiam contra ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήδρευσεν
  choice: permaneceu junto
  rationale: O verbo indica manter-se perto ou ligado a alguém. A formulação conserva a proximidade física ou social sem acrescentar a ideia mais específica de bajulação ou pressão política.
- source_word: παραδοῖ
  choice: entregasse
  rationale: παραδίδωμι significa entregar ou pôr alguém nas mãos de outro; “entregasse” é natural no contexto político e preserva a construção pronominal do grego.
- source_word: βασιλεύσῃ ἀντὶ τοῦ πατρὸς αὐτοῦ
  choice: reinasse no lugar de seu pai
  rationale: Mantém o sentido de substituição ou sucessão expresso por ἀντί, sem reduzir o verbo à ideia genérica de governar.
- source_word: ἀπήγγειλαν
  choice: relataram
  rationale: O verbo descreve a transmissão de um informe e combina com o contexto político-militar.
- source_word: συνετέλεσεν
  choice: tinha feito
  rationale: A expressão ampla abrange tudo o que Demétrio realizou sem sugerir necessariamente êxito, aprovação ou conclusão favorável.
- source_word: ἔχθραν
  choice: hostilidade
  rationale: “Hostilidade” comunica oposição ativa e se ajusta ao cenário militar e político.
- source_word: ἣν ἐχθραίνονσιν αὐτῷ αἱ δυνάμεις αὐτοῦ
  choice: a hostilidade que suas próprias forças demonstravam contra ele
  rationale: A redação torna compreensível a construção cognata e repetitiva do grego, preservando o ponto de que as forças do próprio Demétrio agiam contra ele.
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: suas próprias forças
  rationale: δυνάμεις designa forças militares; “próprias” explicita, sem mudar o referente, o contraste contextual de que eram as forças de Demétrio.
- source_word: ἔμεινεν ἐκεῖ ἡμέρας πολλάς
  choice: permaneceu ali muitos dias
  rationale: Tradução direta e idiomática da nota temporal.
