  yaml_path: translation/deuterocanon/1_maccabees/011/042.yaml
  text: And Demetrius sent to Jonathan[a], saying, “Not only will I do these things for you and for your nation, but I will greatly honor you and your nation, if I find a suitable opportunity.”
translation:
  language: pt
  text: 'E Demétrio mandou dizer a Jônatas: “Não somente farei essas coisas por você e por sua nação, mas também honrarei grandemente você e sua nação, se eu encontrar uma ocasião favorável.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν Δημήτριος πρὸς Ἰωνάθαν λέγων
  choice: Demétrio mandou dizer a Jônatas
  rationale: A expressão grega descreve o envio de uma mensagem; “mandou dizer” torna explícito e natural em português o valor epistolar de ἀπέστειλεν... λέγων.
- source_word: Οὐ μόνον ταῦτα ποιήσω
  choice: Não somente farei essas coisas
  rationale: Preserva a construção enfática e o futuro do original em português atual e digno.
- source_word: σοι καὶ τῷ ἔθνει σου
  choice: por você e por sua nação
  rationale: O dativo indica os beneficiários, e ἔθνος possui aqui sentido coletivo e político, adequadamente expresso por “nação”.
- source_word: ἀλλʼ ἢ δόξῃ δοξάσω
  choice: mas também honrarei grandemente
  rationale: A combinação cognata intensifica δοξάσω. “Honrarei grandemente” comunica a ênfase sem reproduzir uma repetição artificial em português.
- source_word: σε καὶ τὸ ἔθνος σου
  choice: você e sua nação
  rationale: Mantém o paralelismo do texto e o matiz nacional-político de ἔθνος.
- source_word: ἐὰν εὐκαιρίας τύχω
  choice: se eu encontrar uma ocasião favorável
  rationale: Preserva tanto a condição expressa por ἐάν quanto a ideia de obter ou encontrar uma oportunidade propícia.
