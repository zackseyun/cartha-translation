base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/028.yaml
  text: And Jonathan asked the king to make Judea[a], the three toparchies, and Samaria tax-free, and he promised him three hundred talents.
translation:
  language: pt
  text: Jônatas pediu ao rei que isentasse de impostos a Judeia, as três toparquias[a] e a Samaria, e prometeu-lhe trezentos talentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uma toparquia era um distrito administrativo. O grego emprega um termo territorial técnico, e não uma palavra genérica para região.
    reason: cultural_note
lexical_decisions:
- source_word: ἠξίωσεν
  choice: pediu
  rationale: No contexto de um pedido formal dirigido ao rei, o verbo indica solicitar, sem necessariamente ter a força de exigir.
- source_word: ποιῆσαι ... ἀφορολόγητον
  choice: que isentasse de impostos
  rationale: A construção expressa a concessão de condição fiscal privilegiada aos territórios. Esta formulação é natural em português e preserva o sentido de torná-los livres de tributação.
- source_word: τὰς τρεῖς τοπαρχίας
  choice: as três toparquias
  rationale: Mantém o termo administrativo técnico do grego, explicado em nota, em vez de reduzi-lo ao sentido genérico de regiões.
- source_word: τὴν Σαμαρῖτιν
  choice: a Samaria
  rationale: Designa a região de Samaria; esta é a forma geográfica consagrada em português.
- source_word: ἐπηγγείλατο αὐτῷ
  choice: prometeu-lhe
  rationale: O verbo indica que Jônatas assumiu um compromisso com o rei; a forma pronominal é concisa e natural.
- source_word: τάλαντα τριακόσια
  choice: trezentos talentos
  rationale: Conserva a unidade antiga de peso e valor, evitando uma conversão moderna especulativa.
