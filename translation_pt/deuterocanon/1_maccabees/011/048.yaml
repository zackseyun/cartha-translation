lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: incendiaram
  rationale: Expressa de modo natural e direto a ação causativa de pôr a cidade em chamas.
- source_word: τὴν πόλιν
  choice: a cidade
  rationale: πόλις normalmente designa uma cidade; o artigo definido é representado naturalmente em português.
- source_word: ἐλάβοσαν σκῦλα πολλὰ
  choice: tomaram muitos despojos
  rationale: σκῦλα são bens tomados em contexto de guerra. “Muitos despojos” preserva o plural grego e mantém um registro narrativo digno e claro.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: naquele dia
  rationale: É a formulação temporal corrente e idiomática em português.
- source_word: ἔσωσαν
  choice: salvaram
  rationale: Mantém o sentido amplo e direto de σῴζω, adequado ao livramento do rei do perigo imediato.
- source_word: τὸν βασιλέα
  choice: o rei
  rationale: Tradução direta do objeto definido.
