base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/034.yaml
  text: Therefore we have confirmed for them the borders of Judea and the three districts—Aphairema and Lydda and Ramathaim—which were added to Judea from Samaria[a], and all that adjoins them, for all who offer sacrifice in Jerusalem[c][b], instead of the royal taxes that the king formerly received from them each year from the produce of the land and the fruit trees.
translation:
  language: pt
  text: Portanto, confirmamos para eles os limites da Judeia e os três distritos[a] — Aferema, Lida e Ramataim —, que foram acrescentados à Judeia a partir da Samaria, bem como tudo o que lhes está associado,[b] em favor de todos os que oferecem sacrifícios em Jerusalém, em lugar dos tributos reais que o rei antes recebia deles todos os anos, provenientes da produção da terra e dos produtos das árvores.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “distritos” refere-se a divisões administrativas; em textos técnicos, às vezes é transliterado como “nomos”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é ampla e pode abranger aldeias dependentes, terras ou outras pertenças ligadas aos três distritos.
    reason: lexical_alternative
  - marker: c
    text: Ou “frutos das árvores”. O termo grego pode abranger produtos arbóreos, inclusive frutas e nozes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστήκαμεν
  choice: confirmamos
  rationale: O perfeito de ἵστημι, no contexto de um decreto régio, indica que uma disposição foi estabelecida ou ratificada. “Confirmamos” exprime seu vigor oficial sem sugerir apenas a demarcação física.
- source_word: τὰ ὅρια
  choice: os limites
  rationale: Ὅρια designa fronteiras ou limites territoriais; “limites” é natural e preciso no contexto administrativo.
- source_word: τοὺς τρεῖς νομοὺς
  choice: os três distritos
  rationale: Νομός, no uso administrativo helenístico, designa um distrito. A tradução evita o tecnicismo pouco conhecido “nomos”.
- source_word: Ἀφαίρεμα καὶ Λυδδὰ καὶ Ραμαθείμ
  choice: Aferema, Lida e Ramataim
  rationale: Os topônimos são transliterados em formas claras e compatíveis com o uso bíblico em português.
- source_word: προσετέθησαν τῇ Ἰουδαίᾳ ἀπὸ τῆς Σαμαρίτιδος
  choice: foram acrescentados à Judeia, vindos da Samaria
  rationale: A formulação conserva tanto a incorporação à Judeia como a procedência administrativa da Samaria, sem especificar além do texto o mecanismo político.
- source_word: πάντα τὰ συγκυροῦντα αὐτοῖς
  choice: tudo o que lhes está associado
  rationale: A expressão grega é abrangente e pode incluir aldeias dependentes, terras ou outras pertenças. “Está associado” preserva essa amplitude.
- source_word: πᾶσιν τοῖς θυσιάζουσιν εἰς Ἰερουσαλήμ
  choice: em favor de todos os que oferecem sacrifícios em Jerusalém
  rationale: Θυσιάζω significa especificamente oferecer sacrifício. “Em favor de” torna explícita a relação dativa com os beneficiários da concessão, sem reduzi-los genericamente a adoradores.
- source_word: ἀντὶ τῶν βασιλικῶν
  choice: em lugar dos tributos reais
  rationale: Τὰ βασιλικά refere-se a receitas ou obrigações devidas à coroa. “Tributos reais” é idiomático e suficientemente amplo.
- source_word: ὧν ἐλάμβανεν ὁ βασιλεὺς παρʼ αὐτῶν τὸ πρότερον κατʼ ἐνιαυτόν
  choice: que o rei antes recebia deles todos os anos
  rationale: O imperfeito com τὸ πρότερον descreve uma cobrança habitual anterior; a expressão portuguesa mantém esse aspecto iterativo.
- source_word: τῶν γενημάτων τῆς γῆς
  choice: da produção da terra
  rationale: Γενήματα abrange a produção ou rendimento agrícola, não apenas uma cultura específica.
- source_word: τῶν ἀκροδρύων
  choice: dos produtos das árvores
  rationale: Ἀκρόδρυα designa produtos arbóreos, inclusive frutos e nozes. A tradução evita transformar a própria árvore em objeto do tributo.
