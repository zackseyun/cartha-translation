base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/039.yaml
  text: Tryphon had formerly been among those with Alexander[a], and seeing that all the forces were grumbling against Demetrius, he went to Simmakoues the Arab, who was rearing Antiochus, the little child of Alexander.
translation:
  language: pt
  text: Trifão havia pertencido anteriormente ao grupo de Alexandre e, ao ver que todas as tropas murmuravam contra Demétrio, foi até Simácues, o árabe, que estava criando Antíoco, o menino de Alexandre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o menino de Alexandre”. A expressão grega é elíptica e, no contexto, refere-se ao filho de Alexandre.
    reason: A nota esclarece a relação filial contextual sem substituir no texto principal a formulação elíptica do grego.
lexical_decisions:
- source_word: Τρύφων
  choice: Trifão
  rationale: Forma portuguesa tradicional e natural do nome grego Τρύφων.
- source_word: τῶν παρὰ Ἀλεξάνδρου
  choice: pertencido ao grupo de Alexandre
  rationale: A construção παρά com genitivo indica associação ao lado ou partido de Alexandre, sem definir cargo ou patente.
- source_word: τὸ πρότερον
  choice: anteriormente
  rationale: Expressa de modo claro a referência a um período passado.
- source_word: πᾶσαι αἱ δυνάμεις
  choice: todas as tropas
  rationale: No contexto militar, δυνάμεις designa as forças armadas; “tropas” é corrente e não sugere necessariamente vários exércitos distintos.
- source_word: καταγογγύζουσιν κατὰ τοῦ Δημητρίου
  choice: murmuravam contra Demétrio
  rationale: Preserva tanto a ideia de queixa descontente, possivelmente em voz baixa, quanto a oposição dirigida contra Demétrio.
- source_word: ἐπορεύθη πρὸς
  choice: foi até
  rationale: Tradução direta e idiomática do movimento em direção a uma pessoa.
- source_word: Σιμμάκουην τὸν Ἄραβα
  choice: Simácues, o árabe
  rationale: O nome é transliterado em forma adaptada ao português, e a designação étnica é mantida como aposto.
- source_word: ἔτρεφεν
  choice: estava criando
  rationale: Neste contexto, τρέφω envolve sustentar e educar uma criança; “criar” comunica naturalmente esse conjunto de cuidados.
- source_word: τὸ παιδάριον
  choice: o menino
  rationale: O diminutivo indica uma criança do sexo masculino; “menino” preserva sua pouca idade sem recorrer a formulação afetiva excessiva.
- source_word: τὸ τοῦ Ἀλεξάνδρου
  choice: filho de Alexandre
  rationale: A expressão elíptica identifica o menino como pertencente a Alexandre; no contexto dinástico, a relação indicada é filial.
