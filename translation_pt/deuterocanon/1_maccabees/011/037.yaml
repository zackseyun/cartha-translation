base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/037.yaml
  text: Now then[a], take care to make a copy of these things, and let it be given to Jonathan, and let it be placed on the holy mountain in a prominent place.
translation:
  language: pt
  text: Agora, portanto, cuidem de fazer uma cópia destas coisas, e que ela seja entregue a Jônatas e colocada no monte santo, em lugar de destaque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em lugar bem visível”. A expressão grega indica um local notável, publicamente perceptível ou oficialmente assinalado.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, portanto
  rationale: Marca simultaneamente a transição e a inferência, conservando o tom de orientação formal do grego.
- source_word: ἐπιμελεῖσθε
  choice: cuidem de
  rationale: O imperativo médio exige atenção responsável ao cumprimento da ordem; a expressão é natural e digna em português.
- source_word: τοῦ ποιῆσαι ... ἀντίγραφον
  choice: fazer uma cópia
  rationale: A construção refere-se à produção de uma cópia escrita e é expressa com clareza em português corrente.
- source_word: τούτων
  choice: destas coisas
  rationale: Preserva o plural amplo do demonstrativo sem especificar indevidamente que se trata de um decreto.
- source_word: δοθήτω Ἰωνάθαν
  choice: entreguem-na a Jônatas
  rationale: Converte o imperativo passivo formal em uma ordem ativa natural em português, sem alterar o destinatário nem a força diretiva.
- source_word: τεθήτω
  choice: coloquem-na
  rationale: Expressa de modo idiomático a determinação oficial de depositar ou pôr a cópia no local indicado.
- source_word: ἐν ὄρει τῷ ἁγίῳ
  choice: no monte santo
  rationale: Mantém a designação topográfica e cultual sem explicitar além do texto se se trata de Sião ou do monte do templo.
- source_word: ἐν τόπῳ ἐπισήμῳ
  choice: em lugar de destaque
  rationale: Comunica que o lugar é notável, visível ou publicamente reconhecível, conforme a amplitude semântica de ἐπίσημος.
