base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/058.yaml
  text: And he sent him gold vessels and table service[c][b][a], and gave him authority to drink from gold vessels and to be clothed in purple and to wear a gold clasp.
translation:
  language: pt
  text: E enviou-lhe objetos de ouro e utensílios de serviço[a], e deu-lhe o direito de beber em vasos de ouro, de vestir-se de púrpura e de usar um broche de ouro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serviço”; o termo grego também pode referir-se aos apetrechos usados para servir ou, menos provavelmente, às pessoas encarregadas do serviço.
    reason: lexical_alternative
  - marker: b
    text: Ou “fecho de ouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρυσώματα
  choice: objetos de ouro / vasos de ouro
  rationale: O plural designa artefatos feitos de ouro. Na primeira ocorrência, “objetos de ouro” evita restringir indevidamente o sentido; no contexto de beber, “vasos de ouro” expressa naturalmente o uso desses objetos como recipientes.
- source_word: διακονίαν
  choice: utensílios de serviço
  rationale: Em coordenação com os objetos de ouro e no contexto cortesão, provavelmente indica artigos usados no serviço, possivelmente à mesa, sem excluir por completo a amplitude do termo grego.
- source_word: ἐξουσίαν
  choice: direito
  rationale: Trata-se de uma prerrogativa concedida pelo rei. “Direito” é natural em português e comunica autorização oficial sem sugerir poder exercido sobre outras pessoas.
- source_word: πίνειν ἐν χρυσώμασιν
  choice: beber em vasos de ouro
  rationale: A expressão indica beber usando recipientes de ouro. “Vasos” mantém uma designação ampla e digna, sem limitar o referente a taças.
- source_word: εἶναι ἐν πορφύρᾳ
  choice: vestir-se de púrpura
  rationale: Torna explícito o idiomatismo referente ao uso de vestes púrpuras, sinal de elevada posição, em linguagem clara e atual.
- source_word: πόρπην χρυσῆν
  choice: broche de ouro
  rationale: πόρπη designa um fecho ornamental de vestimenta. “Broche” é compreensível em português e representa melhor o objeto antigo do que “fivela”.
