- source_word: οὐδὲ εἷς κατελείφθη ἀπʼ αὐτῶν
  choice: Não restou nenhum deles
  rationale: Expressa de modo natural e enfático que ninguém do grupo permaneceu, sem acrescentar a ideia mais específica de ter sido abandonado para trás.
- source_word: πλὴν
  choice: exceto
  rationale: Mantém com clareza o valor exceptivo da expressão grega.
- source_word: Ματταθίας ὁ τοῦ Ἀψαλώμου
  choice: Matatias, filho de Absalão
  rationale: A construção com artigo e genitivo identifica a filiação; as formas dos nomes são correntes em português bíblico.
- source_word: Ἰούδας ὁ τοῦ Χαλφεί
  choice: Judas, filho de Calfi
  rationale: A construção paralela indica filiação ou identificação familiar; a tradução conserva essa relação sem a tornar mais específica.
- source_word: ἄρχοντες
  choice: comandantes
  rationale: No contexto militar, designa pessoas investidas de comando, mais precisamente do que o termo geral 'líderes'.
- source_word: τῆς στρατιᾶς τῶν δυνάμεων
  choice: das forças do exército
  rationale: Conserva os dois termos militares do grego em uma formulação compreensível e natural em português, sem eliminar a leve redundância do original.
