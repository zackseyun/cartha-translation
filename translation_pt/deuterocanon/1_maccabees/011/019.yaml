lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: começou a reinar
  rationale: Neste aviso cronológico, o aoristo de βασιλεύω assinala a subida de Demétrio ao trono. «Começou a reinar» torna explícito esse valor ingressivo de modo natural em português, sem ampliar o sentido.
- source_word: Δημήτριος
  choice: Demétrio
  rationale: Forma tradicional e amplamente reconhecida do nome grego em português.
- source_word: ἔτους ἑβδομοῦ καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: no ano cento e sessenta e sete
  rationale: A expressão genitiva é uma fórmula de datação, literalmente construída na ordem «sétimo, sexagésimo e centésimo». A ordem numérica portuguesa comunica com naturalidade o mesmo 167.º ano.
