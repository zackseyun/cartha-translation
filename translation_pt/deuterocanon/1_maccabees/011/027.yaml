  yaml_path: translation/deuterocanon/1_maccabees/011/027.yaml
  text: And he confirmed for him the high priesthood[a], and whatever other honors he had formerly held, and he made him rank among the first friends.
translation:
  language: pt
  text: E confirmou-lhe o sumo sacerdócio e todas as outras honras que antes possuía e fez que fosse contado entre os primeiros amigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os principais amigos”. A expressão grega provavelmente designa uma categoria oficial na corte selêucida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστήρισεν
  choice: confirmou
  rationale: No contexto político-administrativo, indica que o cargo já concedido a Jônatas foi ratificado ou assegurado, não que ele tenha recebido uma nomeação inicial.
- source_word: ἀρχιερωσύνην
  choice: o sumo sacerdócio
  rationale: Designa o cargo e a dignidade de sumo sacerdote; esta é a formulação portuguesa mais natural e tradicional.
- source_word: τίμια
  choice: honras
  rationale: O adjetivo substantivado se refere aqui a distinções ou privilégios honoríficos concedidos pela realeza, não a objetos valiosos.
- source_word: τὸ πρότερον
  choice: anteriormente
  rationale: Preserva de modo claro e corrente a referência temporal às honras que Jônatas já possuía.
- source_word: τῶν πρώτων φίλων
  choice: entre os Amigos de Primeira Classe
  rationale: A expressão provavelmente designa uma categoria oficial da corte selêucida. A capitalização e 'de Primeira Classe' comunicam que se trata de título ou posto, evitando a impressão de mera amizade pessoal.
- source_word: ἡγεῖσθαι
  choice: fez com que fosse contado
  rationale: Neste complemento acusativo com genitivo, o verbo expressa fazer alguém ser considerado ou classificado como integrante de determinado grupo.
