base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/046.yaml
  text: And the king fled into the court[b][a], and the men of the city seized the passages of the city and began to fight.
translation:
  language: pt
  text: E o rei fugiu para o pátio[a]. Os habitantes da cidade tomaram o controle das vias de acesso da cidade[b] e começaram a lutar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “átrio”; o termo grego pode indicar o pátio de um complexo palaciano.
    reason: lexical_alternative
  - marker: b
    text: Ou “as passagens da cidade”; o termo grego pode designar passagens, caminhos de travessia ou rotas de acesso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: fugiu
  rationale: O aoristo de φεύγω indica fuga diante do perigo; “fugiu” é direto, natural e preserva a urgência da retirada.
- source_word: αὐλήν
  choice: pátio
  rationale: αὐλή designa com frequência um pátio ou área interna de um complexo residencial ou palaciano. “Pátio” é claro em português sem acrescentar explicitamente “palácio”, ausente do grego.
- source_word: κατελάβοντο
  choice: tomaram o controle
  rationale: A forma média exprime apoderar-se ou assumir o controle. A locução comunica naturalmente a ação militar sem sugerir necessariamente captura violenta em um único momento.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: os habitantes da cidade
  rationale: A expressão significa literalmente “os da cidade”. “Os habitantes da cidade” é inclusivo e natural, sem restringir indevidamente o grupo a homens, embora o contexto seja de combate.
- source_word: τὰς διόδους τῆς πόλεως
  choice: as vias de acesso da cidade
  rationale: δίοδος pode indicar passagem, caminho de travessia ou rota de acesso. “Vias de acesso” preserva essa amplitude melhor que termos mais específicos como “portões” ou “ruas”.
- source_word: ἤρξαντο ἐκπολεμεῖν
  choice: começaram a lutar
  rationale: A construção indica o início de uma ação bélica. “Começaram a lutar” é idiomático, conciso e adequado ao contexto.
