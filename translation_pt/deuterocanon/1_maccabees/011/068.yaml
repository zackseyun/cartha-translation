base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/068.yaml
  text: And behold[a], a camp of foreigners met him in the plain, and they set an ambush against him in the mountains, while they themselves advanced from the front.
translation:
  language: pt
  text: E eis que um acampamento de estrangeiros veio ao encontro dele na planície, e eles armaram uma emboscada contra ele nas montanhas, enquanto eles mesmos vinham de frente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto eles mesmos vinham do lado oposto”. Mais literalmente, “eles mesmos vieram ao encontro do lado oposto”; também pode significar que o enfrentaram de frente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ
  choice: exército
  rationale: Embora o substantivo possa designar um acampamento militar, aqui ele vem ao encontro de alguém e atua taticamente; “exército” expressa com naturalidade a força militar em movimento.
- source_word: ἀλλοφύλων
  choice: de estrangeiros
  rationale: O termo designa pessoas de outro povo. Neste contexto, não se refere especificamente aos filisteus; “estrangeiros” mantém o sentido étnico genérico sem o restringir.
- source_word: ἀπήντα αὐτῷ
  choice: veio ao encontro dele
  rationale: Reproduz o sentido de encontrar ou sair ao encontro e se encaixa naturalmente na narrativa militar.
- source_word: ἐν τῷ πεδίῳ
  choice: na planície
  rationale: Indica terreno aberto e plano, em contraste geográfico com as montanhas mencionadas em seguida.
- source_word: ἐξέβαλον ἔνεδρον
  choice: armaram uma emboscada
  rationale: A expressão idiomática descreve a colocação ou preparação de uma emboscada; esta é a formulação corrente em português.
- source_word: ἐπʼ αὐτόν
  choice: contra ele
  rationale: No contexto da emboscada, a preposição indica direção hostil.
- source_word: ἐν τοῖς ὄρεσιν
  choice: nas montanhas
  rationale: Tradução locativa direta que preserva o contraste com a planície.
- source_word: αὐτοὶ δὲ ἀπήντησαν ἐξ ἐναντίας
  choice: enquanto eles mesmos avançaram contra ele pela frente
  rationale: “Eles mesmos” conserva a ênfase de αὐτοί e distingue a força frontal dos homens postos em emboscada. “Pela frente” comunica a disposição tática de ἐξ ἐναντίας, cuja formulação literal permanece um tanto ambígua.
