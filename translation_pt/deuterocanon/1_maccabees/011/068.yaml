  naturalness: O português é claro e de registro narrativo adequado. A revisão mantém fluência, usando “acampamento” e uma formulação natural para a aproximação frontal.
  terminology: “Acampamento de estrangeiros” conserva o valor militar de παρεμβολή e o caráter genérico de ἀλλόφυλοι. “Emboscada”, “planície” e “montanhas” são escolhas fiéis e naturais. “Vinham de frente” comunica ἐξ ἐναντίας sem eliminar a possibilidade de “do lado oposto”, registrada na nota.
