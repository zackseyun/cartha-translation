  text: And Jonathan went with the king as far as the river called Eleutherus[a], and he returned to Jerusalem.
translation:
  language: pt
  text: E Jônatas foi com o rei até o rio chamado Eleutero[a] e voltou para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eleutero é o nome próprio de um rio; o grego diz simplesmente «o rio chamado Eleutero».
    reason: cultural_note
lexical_decisions:
- source_word: ἐπορεύθη
  choice: acompanhou
  rationale: Em combinação com μετὰ τοῦ βασιλέως e ἕως, o verbo de movimento descreve Jônatas indo com o rei até determinado ponto; “acompanhou” expressa naturalmente essa ação em português.
- source_word: μετὰ τοῦ βασιλέως
  choice: o rei
  rationale: A ideia de acompanhamento indicada por μετά com genitivo está incorporada no verbo “acompanhou”, evitando a formulação menos natural “foi com o rei”.
- source_word: ἕως τοῦ ποταμοῦ
  choice: até o rio
  rationale: ἕως indica o limite do percurso; “até” conserva essa noção de extensão espacial de modo direto.
- source_word: τοῦ καλουμένου Ἐλευθέρου
  choice: chamado Eleutero
  rationale: Mantém a construção grega e translitera o nome geográfico em forma adequada ao português.
- source_word: ἐπέστρεψεν
  choice: voltou
  rationale: Traduz de maneira simples e narrativa o retorno ou movimento de volta indicado pelo verbo.
- source_word: εἰς Ἰερουσαλήμ
  choice: para Jerusalém
  rationale: εἰς indica movimento em direção ao destino; “para Jerusalém” é corrente e claro em português.
