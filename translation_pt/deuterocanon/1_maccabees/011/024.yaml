  yaml_path: translation/deuterocanon/1_maccabees/011/024.yaml
  text: And he took silver and gold and clothing and many other gifts[a], and went to the king at Ptolemais, and found favor before him.
translation:
  language: pt
  text: Ele levou prata, ouro, roupas e muitos outros presentes, foi até o rei em Ptolemaida e encontrou favor diante dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obteve o favor dele”. A expressão grega diz literalmente “encontrou favor diante dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: Ele levou
  rationale: O particípio aoristo introduz uma ação anterior ou concomitante à viagem. “Levou” é natural em português e, no contexto dos presentes destinados ao rei, expressa melhor que os objetos foram transportados consigo.
- source_word: ἀργύριον καὶ χρυσίον
  choice: prata, ouro
  rationale: Mantém os sentidos materiais básicos dos dois termos; a enumeração de bens favorece “prata” em vez do sentido metonímico “dinheiro”.
- source_word: ἱματισμόν
  choice: roupas
  rationale: Termo corrente e claro para vestimentas oferecidas entre os presentes, sem a solenidade menos natural de “vestes”.
- source_word: ἕτερα ξένια πλείονα
  choice: muitos outros presentes
  rationale: ξένια designa presentes ligados à hospitalidade ou ao intercâmbio diplomático. A formulação comunica esse sentido no contexto político, enquanto “outros” e “muitos” representam ἕτερα e πλείονα.
- source_word: ἐπορεύθη πρὸς τὸν βασιλέα εἰς Πτολεμαΐδα
  choice: foi até o rei em Ptolemaida
  rationale: Preserva tanto o movimento em direção ao rei quanto a localização geográfica do encontro, em português natural.
- source_word: εὗρεν χάριν ἐναντίον αὐτοῦ
  choice: encontrou favor diante dele
  rationale: Conserva o conhecido idioma bíblico e a imagem espacial do grego sem transformar a expressão em uma interpretação mais explícita; “dele” retoma o rei.
