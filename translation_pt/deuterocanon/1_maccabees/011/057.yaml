base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/057.yaml
  text: And Antiochus the younger wrote to Jonathan[a], saying, “I appoint you to the high priesthood, and I appoint you over the four districts, and that you are to be among the king’s Friends.”
translation:
  language: pt
  text: 'E Antíoco, o mais jovem, escreveu a Jônatas: “Eu lhe confiro o sumo sacerdócio, coloco você à frente dos quatro distritos e faço de você um dos Amigos do rei.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amigos do rei”. O grego provavelmente se refere a uma categoria oficial da corte na monarquia helenística, não apenas a companheiros pessoais.
    reason: alternativa lexical e esclarecimento histórico
lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu
  rationale: Traduz diretamente o aoristo e preserva a fórmula epistolar indicada pelo contexto e por λέγων.
- source_word: ὁ νεώτερος
  choice: o mais jovem
  rationale: Funciona como designação distintiva de Antíoco em português natural, sem introduzir um título não expresso no grego.
- source_word: Ἵστημί σοι τὴν ἀρχιερωσύνην
  choice: Eu lhe confiro o sumo sacerdócio
  rationale: A expressão indica a concessão ou confirmação oficial da dignidade sacerdotal; “confiro” comunica esse valor institucional de modo natural.
- source_word: καθίστημί σε ἐπὶ
  choice: coloco você à frente de
  rationale: Expressa a designação de alguém para exercer autoridade administrativa sobre determinada esfera.
- source_word: τῶν τεσσάρων νομῶν
  choice: dos quatro distritos
  rationale: νόμοι designa aqui divisões administrativas; “distritos” é claro e evita tanto o tecnicismo “nomos” quanto a possível amplitude excessiva de “províncias”.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: dos Amigos do rei
  rationale: A inicial maiúscula sinaliza o provável uso de “Amigos” como categoria ou dignidade oficial da corte helenística, e não apenas como relação pessoal.
theological_decisions:
- issue: Sentido institucional de φίλων τοῦ βασιλέως
  choice: Amigos do rei
  alternative: amigos do rei; companheiros do rei
  rationale: Embora não envolva uma doutrina central, a expressão tem relevância histórica e provavelmente indica uma categoria oficial da corte. A tradução mantém essa nuance sem explicá-la excessivamente no texto.
translation_notes:
  register: Português moderno, claro e digno, com construção administrativa natural. “Você” mantém ampla legibilidade brasileira; “lhe confiro” evita repetição mecânica e preserva o tom oficial. A nota foi posicionada junto à expressão que explica.
