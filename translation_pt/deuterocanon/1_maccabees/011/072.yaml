  text: Então ele se voltou contra eles em combate[a], desbaratou-os, e eles fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz de forma condensada: “voltou-se para eles, guerra”, isto é, voltou-se contra eles para combater.'
