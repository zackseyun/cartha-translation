lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: se voltou
  rationale: Expressa o movimento de voltar-se ou virar-se novamente contra o adversário, preservando a força direcional do verbo no contexto da batalha.
- source_word: πρὸς αὐτοὺς πόλεμον
  choice: contra eles em combate
  rationale: A construção grega é comprimida; esta formulação comunica de modo natural a retomada da ação hostil sem acrescentar uma finalidade que não esteja explicitamente marcada.
- source_word: ἐτροπώσατο
  choice: desbaratou-os
  rationale: O verbo indica causar a derrota e a fuga do inimigo. “Desbaratou-os” conserva esse sentido militar específico e prepara a declaração seguinte de que fugiram.
- source_word: ἔφυγον
  choice: eles fugiram
  rationale: Tradução direta do aoristo narrativo, clara e coerente com o registro do relato militar.
