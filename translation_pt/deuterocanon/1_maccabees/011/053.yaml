base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/011/053.yaml
  text: And he proved false in everything that he said[a], and became estranged from Jonathan, and did not repay the favors that Jonathan had shown him, and he oppressed him severely.
translation:
  language: pt
  text: E ele se mostrou falso em tudo o que disse[a], afastou-se de Jônatas, não retribuiu os favores que Jônatas lhe havia prestado e o oprimiu severamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mentiu em tudo o que disse” ou “agiu com falsidade em tudo o que disse”. O verbo grego pode destacar tanto a falsidade das palavras quanto uma conduta enganosa mais ampla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐψεύσατο
  choice: foi falso
  rationale: Preserva a possibilidade de o verbo indicar tanto falsidade nas palavras quanto conduta enganosa, em ligação direta com «tudo o que disse».
- source_word: πάντα ὅσα εἶπεν
  choice: tudo o que disse
  rationale: Tradução direta e natural que conserva a abrangência de πάντα ὅσα.
- source_word: ἠλλοτριώθη τῷ Ἰωνάθαν
  choice: afastou-se de Jônatas
  rationale: Expressa de modo idiomático a ruptura relacional indicada pelo verbo, sem intensificá-la necessariamente como hostilidade aberta.
- source_word: οὐκ ἀνταπέδωκεν τὰς εὐνοίας
  choice: não retribuiu os favores
  rationale: Conserva a ideia de reciprocidade de ἀνταποδίδωμι e entende εὐνοίαι aqui como benefícios ou atos favoráveis concretos.
- source_word: ἃς ἀνταπέδωκεν αὐτῷ
  choice: que Jônatas lhe havia prestado
  rationale: Explicita o referente de modo necessário em português e evita a formulação pouco natural «favores que havia retribuído», embora o grego repita o mesmo verbo de reciprocidade.
- source_word: ἔθλιψεν αὐτὸν σφόδρα
  choice: o oprimiu severamente
  rationale: No contexto político, «oprimiu» comunica tratamento duro, e «severamente» preserva a forte intensidade de σφόδρα.
