  source_fidelity: O rascunho transmite o sentido geral, mas «fortificassem todo o monte Sião ao redor» reconfigura a construção coordenada do grego e torna menos explícita a obra edificada em volta de Sião. «Pedras lavradas» também é menos preciso que λίθων τετραγώνων, ‘pedras esquadrejadas’.
