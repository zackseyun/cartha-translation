  yaml_path: translation/deuterocanon/1_maccabees/010/011.yaml
  text: And he told those doing the work to build the walls and Mount Zion all around with squared stones for fortification, and they did so.
translation:
  language: pt
  text: E ele ordenou aos que executavam as obras que construíssem as muralhas e edificassem, em toda a volta do monte Sião, uma fortificação de pedras esquadrejadas; e assim fizeram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν πρὸς
  choice: ordenou
  rationale: No contexto de uma determinação dirigida aos trabalhadores, a construção grega tem força injuntiva; «ordenou» expressa isso naturalmente em português.
- source_word: τοὺς ποιοῦντας τὰ ἔργα
  choice: aos que faziam a obra
  rationale: Mantém a referência genérica aos responsáveis pelo trabalho, sem acrescentar uma categoria profissional não explicitada.
- source_word: τὸ ὄρος Σιὼν
  choice: o monte Sião
  rationale: Tradução direta da designação geográfica tradicional, preservando «monte» conforme o grego.
- source_word: ἐκ λίθων τετραγώνων
  choice: com pedras lavradas
  rationale: τετράγωνος indica pedras esquadrejadas, talhadas em formato regular para construção; «lavradas» é claro e idiomático.
- source_word: εἰς ὀχύρωσιν
  choice: fortificassem
  rationale: Expressa a finalidade defensiva da construção em português corrente, evitando a formulação pouco natural «para fortificação».
