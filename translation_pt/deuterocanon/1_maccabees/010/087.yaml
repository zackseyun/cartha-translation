  text: And Jonathan returned with those who were with him[a], carrying much plunder.
translation:
  language: pt
  text: E Jônatas voltou com os que estavam com ele, os quais levavam muitos despojos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «muitos espólios». O termo grego se refere a bens tomados em combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: voltou
  rationale: O aoristo indica o regresso de Jônatas após o confronto; «voltou» é natural e não especifica uma direção ausente do grego.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: com os que estavam com ele
  rationale: Conserva a formulação ampla do grego para o grupo que acompanhava Jônatas, sem acrescentar explicitamente a caracterização militar de «seus homens».
- source_word: ἔχοντες
  choice: levando
  rationale: O particípio expressa uma circunstância simultânea ao regresso. «Levando» é idiomático com bens tomados em combate e evita a rigidez de «tendo».
- source_word: σκῦλα
  choice: despojos
  rationale: O termo designa bens tomados ao inimigo em combate. «Despojos» é claro, digno e tradicionalmente inteligível em contexto bélico.
- source_word: πολλά
  choice: muitos
  rationale: Concorda naturalmente em português com o plural «despojos» e preserva a ênfase quantitativa do original.
