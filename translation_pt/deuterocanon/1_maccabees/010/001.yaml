base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/001.yaml
  text: And in the one hundred sixtieth year[a], Alexander, the son of Antiochus Epiphanes, came up and took Ptolemais, and they received him[c][b], and he reigned there.
translation:
  language: pt
  text: No ano cento e sessenta, Alexandre, filho de Antíoco Epífanes, subiu[a], apoderou-se de Ptolemaida[b], e eles o receberam, e ele se tornou rei ali.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «avançou»; o grego diz literalmente «subiu», expressão direcional convencional que também pode descrever movimento militar.
    reason: lexical_alternative
  - marker: b
    text: Ou «tomou Ptolemaida» ou «ocupou Ptolemaida».
    reason: lexical_alternative
  - marker: c
    text: Ou «reinou ali»; o verbo grego pode indicar tanto a ascensão ao trono quanto o exercício da realeza.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἔτει ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: No ano cento e sessenta
  rationale: Reproduz de modo natural em português a fórmula cronológica grega, literalmente «no sexagésimo e centésimo ano».
- source_word: ἀνέβη
  choice: subiu
  rationale: Preserva o idioma direcional convencional do grego, que neste contexto pode também indicar avanço militar.
- source_word: ὁ τοῦ Ἀντιόχου ὁ Ἐπιφανής
  choice: filho de Antíoco Epífanes
  rationale: Explicita a filiação implícita na construção grega com artigo e genitivo e conserva Epífanes como o epíteto régio tradicional.
- source_word: κατελάβετο
  choice: apoderou-se de
  rationale: Expressa a tomada de controle da cidade sem determinar além do grego se isso envolveu captura militar propriamente dita.
- source_word: Πτολεμαΐδα
  choice: Ptolemaida
  rationale: Emprega a forma portuguesa corrente do topônimo antigo.
- source_word: ἐπεδέξαντο αὐτόν
  choice: eles o receberam
  rationale: Mantém aberta a possibilidade de recepção, acolhimento ou aceitação política, sem tornar explícita uma atitude mais calorosa do que o grego exige.
- source_word: ἐβασίλευσεν ἐκεῖ
  choice: ele se tornou rei ali
  rationale: No encadeamento narrativo, o aoristo pode ter força ingressiva e indicar a ascensão ao trono; a nota preserva a leitura igualmente possível de exercício do reinado.
