base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/015.yaml
  text: And King Alexander heard the promises that Demetrius had sent to Jonathan, and they told him about the wars and the brave deeds that he and his brothers had done, and the hardships they had endured.
translation:
  language: pt
  text: O rei Alexandre soube das promessas que Demétrio havia enviado a Jônatas. Também lhe contaram sobre as guerras e os atos de coragem realizados por Jônatas e seus irmãos, bem como sobre as dificuldades que eles haviam suportado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: promessas
  rationale: Expressa compromissos ou garantias oferecidos por Demétrio a Jônatas e corresponde naturalmente ao contexto político.
- source_word: διηγήσαντο
  choice: lhe contaram
  rationale: O verbo indica narrar ou relatar; esta formulação é clara e corrente, mantendo o sujeito plural indefinido do grego.
- source_word: πολέμους
  choice: guerras
  rationale: Preserva o plural e o alcance amplo do termo, sem reduzi-lo a batalhas isoladas.
- source_word: ἀνδραγαθίας
  choice: atos de coragem
  rationale: Comunica feitos que demonstram bravura de modo natural, digno e acessível.
- source_word: κόπους
  choice: dificuldades
  rationale: No contexto, abrange sofrimentos, fadigas e provações decorrentes dos conflitos, não apenas trabalho físico.
- source_word: ἔσχοσαν
  choice: haviam suportado
  rationale: Em combinação com κόπους, descreve dificuldades pelas quais passaram e que suportaram.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: O contexto se refere aos irmãos de Jônatas na família macabeia, portanto o sentido literal é apropriado.
