  text: And he said[b][a], “Will we find one man like this? And now let us make him our friend and ally.”
translation:
  language: pt
  text: 'E ele disse: “Encontraremos um só homem como este?[a] E agora, façamo-lo nosso amigo[b] e aliado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito: “Certamente não encontraremos um homem como este.” A pergunta grega espera uma resposta negativa.'
    reason: lexical_alternative
  - marker: b
    text: “Amigo” pode ter aqui um sentido político oficial próprio da linguagem das cortes helenísticas, e não apenas indicar afeição pessoal.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ εὑρήσομεν
  choice: Encontraremos
  rationale: A pergunta com μή e o futuro do indicativo espera resposta negativa. A formulação interrogativa preserva essa força retórica sem explicitar no corpo do texto o que o grego deixa implícito.
- source_word: ἄνδρα
  choice: homem
  rationale: O substantivo grego é masculino singular e, no contexto, designa um indivíduo do sexo masculino.
- source_word: τοιοῦτον
  choice: como este
  rationale: Expressa alguém desta espécie ou qualidade, conservando de modo natural a força demonstrativa do grego.
- source_word: ἕνα
  choice: um só
  rationale: Torna perceptível a força do numeral, que destaca a singularidade do homem procurado, sem chegar à expansão mais interpretativa «sequer um».
- source_word: ποιήσωμεν
  choice: façamo-lo
  rationale: Mantém o sentido básico de «fazer» na construção «fazer alguém amigo e aliado», adequada ao contexto de estabelecimento de uma relação política.
- source_word: φίλον
  choice: amigo
  rationale: Preserva a distinção lexical em relação a σύμμαχον, embora «amigo» possa ter aqui um sentido político oficial.
- source_word: σύμμαχον
  choice: aliado
  rationale: É o equivalente português claro e corrente para alguém unido por aliança política ou militar.
- source_word: ἡμῶν
  choice: nosso
  rationale: Reproduz de maneira idiomática o possessivo grego aplicado conjuntamente a «amigo» e «aliado».
