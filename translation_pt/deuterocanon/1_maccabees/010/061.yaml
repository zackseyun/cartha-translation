base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/061.yaml
  text: And pestilent men from Israel gathered against him[a], lawless men, to bring charges against him[b]; but the king paid no attention to them.
translation:
  language: pt
  text: E reuniram-se contra ele alguns homens de Israel que eram uma praga[a], homens sem lei, para apresentar acusações contra ele[b]; mas o rei não lhes deu atenção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «homens nocivos» ou «homens semelhantes a uma praga»; o insulto grego é excepcionalmente forte e metafórico.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida como «para fazer uma petição contra ele» ou «para acusá-lo».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: reuniram-se
  rationale: Expressa naturalmente o sentido intransitivo de pessoas que se ajuntaram como grupo.
- source_word: ἐπʼ αὐτόν
  choice: contra ele
  rationale: O contexto hostil e acusatório favorece o sentido adversativo, não apenas direcional.
- source_word: ἄνδρες λοιμοί
  choice: homens de Israel que eram uma praga
  rationale: Preserva em português atual a metáfora excepcionalmente forte de λοιμός, ligada a praga ou pestilência, sem recorrer ao pouco usual «homens pestilentos».
- source_word: ἐξ Ἰσραήλ
  choice: de Israel
  rationale: Indica de modo conciso a origem ou o grupo ao qual esses homens pertenciam.
- source_word: ἄνδρες παράνομοι
  choice: homens sem lei
  rationale: Mantém o sentido direto de pessoas contrárias à lei e a força retórica do grego, sem especificar indevidamente qual aspecto da lei estava em vista.
- source_word: ἐντυχεῖν κατʼ αὐτοῦ
  choice: para apresentar acusações contra ele
  rationale: Comunica o teor administrativo ou judicial de uma petição dirigida à autoridade contra alguém, preservando a possibilidade de se tratar de acusação formal ou de denúncia.
- source_word: οὐ προσέσχεν αὐτοῖς
  choice: não lhes deu atenção
  rationale: Equivalente idiomático e claro para a recusa do rei em dar ouvidos ou acolher o caso deles.
- source_word: ὁ βασιλεύς
  choice: o rei
  rationale: Tradução padrão e adequada ao contexto narrativo.
