translation_notes:
  register: Português atual, claro e digno, com leve registro histórico-militar. Empregam-se as formas portuguesas tradicionais “Celessíria” e “Jâmnia”. A longa coordenação grega foi dividida em duas frases para maior naturalidade, sem alterar a sequência narrativa.
