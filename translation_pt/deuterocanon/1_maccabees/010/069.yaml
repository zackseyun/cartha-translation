base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/069.yaml
  text: And Demetrius appointed Apollonius[a], who was over Coele-Syria, and he gathered a great force and encamped in Jamnia;
translation:
  language: pt
  text: E Demétrio nomeou Apolônio, que estava à frente da Celessíria. Apolônio reuniu uma grande força[a] e acampou em Jâmnia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um grande exército”. O termo grego pode designar uma força militar em sentido amplo, não apenas um exército formalmente constituído.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέστησεν
  choice: nomeou
  rationale: No contexto administrativo, o verbo indica colocar alguém numa função ou posição oficial; “nomeou” é natural e preserva esse sentido.
- source_word: τὸν ὄντα ἐπὶ Κοίλης Συρίας
  choice: que estava à frente da Celessíria
  rationale: A expressão identifica Apolônio por sua autoridade sobre a região. “Estava à frente de” preserva o sentido governamental sem especificar um título não presente no grego.
- source_word: συνήγαγεν
  choice: reuniu
  rationale: Traduz diretamente a ideia de ajuntar ou concentrar pessoas, adquirindo sentido militar pelo complemento.
- source_word: δύναμιν μεγάλην
  choice: uma grande força
  rationale: Em narrativa militar, δύναμις designa uma força armada, mas não necessariamente um exército formalmente constituído. A formulação mantém essa amplitude.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: O verbo é usado para estabelecer acampamento, especialmente em contexto militar; “acampou” é atual, claro e fiel.
- source_word: ἐν Ἰαμνείᾳ
  choice: em Jâmnia
  rationale: “Em” corresponde naturalmente a ἐν, e “Jâmnia” é a forma portuguesa tradicional do topônimo.
