base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/053.yaml
  text: And I joined battle with him[a], and he and his camp were crushed by us, and we sat on the throne of his kingdom;
translation:
  language: pt
  text: E travei batalha contra ele, e ele e o seu acampamento foram esmagados por nós[a], e nos sentamos no trono do seu reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente «ele e o seu acampamento foi esmagado por nós»; em português, emprega-se o plural por concordância natural com o sujeito composto.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆψα ... μάχην
  choice: travei batalha
  rationale: A expressão idiomática grega significa entrar em combate. “Travei batalha” conserva a imagem militar e soa natural em português atual e digno.
- source_word: συνετρίβη
  choice: foram esmagados
  rationale: Embora o verbo grego esteja no singular, o sujeito composto é “ele e o seu acampamento”; o plural é a concordância natural em português. “Esmagados” preserva a força de συντρίβω, mais intensa que simples derrota.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: o seu acampamento
  rationale: Em contexto militar, παρεμβολή pode designar o acampamento ou as tropas nele reunidas. “Acampamento” é a correspondência mais direta e mantém a metonímia do grego.
- source_word: ὑφʼ ἡμῶν
  choice: por nós
  rationale: Reproduz diretamente o agente da voz passiva e preserva a passagem da primeira pessoa singular para a voz coletiva régia ou militar.
- source_word: ἐκαθίσαμεν
  choice: nos sentamos
  rationale: Mantém o sentido literal do verbo, enquanto a expressão seguinte deixa clara a ideia de ocupação do trono.
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: no trono do seu reino
  rationale: Preserva os elementos “trono” e “reino” sem explicitar além do texto a tomada de poder; “no trono” é a formulação idiomática em português.
