lexical_decisions:
- source_word: Ἰωνάθαν
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: χαίρειν
  choice: saudações
  rationale: Na abertura de cartas, o infinitivo funciona como fórmula convencional de saudação, não como ordem literal para alegrar-se.
- source_word: ἀκηκόαμεν
  choice: ouvimos
  rationale: O perfeito grego indica conhecimento presente resultante do que se ouviu; em português natural, «ouvimos» comunica adequadamente esse estado no contexto.
- source_word: περὶ σοῦ
  choice: a seu respeito
  rationale: Expressão corrente e digna que corresponde a περί com genitivo.
- source_word: ἀνὴρ
  choice: homem
  rationale: O substantivo é masculino singular e se refere especificamente a Jônatas.
- source_word: ἀγαθὸς ἰσχύϊ
  choice: notável por sua força
  rationale: O dativo delimita o aspecto em que Jônatas é avaliado positivamente. A formulação preserva essa relação e soa natural em português, sem reduzir ἀγαθός a uma afirmação exclusivamente moral.
- source_word: καὶ
  choice: e
  rationale: Mantém a conjunção final atestada, embora a continuação da frase não conste no texto grego fornecido.
