lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo de ἀποστέλλω descreve a ação narrativa concluída; “enviou” é a forma corrente e precisa em português.
- source_word: πρὸς
  choice: a
  rationale: Com verbo de envio e destinatário pessoal no acusativo, πρὸς indica o destinatário; “a Ptolemeu” é idiomático e preserva a direção da ação.
- source_word: πρέσβεις
  choice: embaixadores
  rationale: No contexto de comunicação entre reis, o termo designa representantes diplomáticos oficiais; “embaixadores” comunica melhor esse caráter do que “mensageiros”.
- source_word: κατὰ τοὺς λόγους τούτους
  choice: com estas palavras
  rationale: A expressão introduz o teor da mensagem e é vertida de maneira natural, clara e próxima do grego.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio introduz a fala citada no versículo seguinte; “dizendo” preserva a construção e mantém a frase aberta para a continuação.
- source_word: βασιλέα Αἰγύπτου
  choice: rei do Egito
  rationale: A expressão funciona como aposto de Ptolemeu e é reproduzida naturalmente como seu título.
