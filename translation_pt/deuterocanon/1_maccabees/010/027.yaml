  text: We rejoiced[a]. And now continue still to keep faith with us,
translation:
  language: pt
  text: Ficamos contentes. E agora, vocês ainda permaneceram firmes em manter a fidelidade para conosco.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A forma grega traduzida por “vocês permaneceram” é indicativa: literalmente, “vocês permaneceram”. Pelo contexto, a frase também pode ser entendida como exortação: “E agora, continuem a manter a fidelidade para conosco”, isto é, “continuem leais a nós”.'
    reason: morphological_and_lexical_alternative
lexical_decisions:
- source_word: ἐχάρημεν
  choice: Ficamos contentes
  rationale: O aoristo de χαίρω expressa a reação passada de alegria ou satisfação. Em correspondência régia, “ficamos contentes” soa natural e dignificado, sem intensificar o termo para uma alegria exuberante.
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva tanto a ligação com a frase anterior quanto a progressão temporal da carta.
- source_word: ἐμείνατε
  choice: vocês continuaram
  rationale: 'A forma com aumento é, morfologicamente, aoristo indicativo ativo, segunda pessoa do plural: “vocês permaneceram/continuaram”. Por isso, o texto principal não a converte silenciosamente em imperativo, embora o contexto possa ter levado algumas traduções a entendê-la como exortação.'
- source_word: ἔτι
  choice: continuaram
  rationale: A ideia de persistência de ἔτι é incorporada ao verbo “continuaram”; acrescentar “ainda” produziria em português uma repetição pouco natural (“continuaram ainda”).
- source_word: τοῦ συντηρῆσαι
  choice: a manter
  rationale: 'O infinitivo articular de συντηρέω especifica em que consiste a continuidade: conservar ou manter algo. “A manter” é claro e idiomático em português.'
- source_word: πίστιν
  choice: a fidelidade
  rationale: Neste contexto diplomático e político, πίστις designa confiabilidade, lealdade ou fidelidade a uma aliança, não crença religiosa. “Fidelidade” preserva o valor relacional sem importar um sentido teológico inadequado.
- source_word: πρὸς ἡμᾶς
  choice: para conosco
  rationale: A preposição indica a orientação da fidelidade em relação aos remetentes. “Para conosco” é uma formulação corrente e dignificada em português.
theological_decisions:
- issue: Sentido de πίστις em contexto político
  choice: fidelidade
  alternative: fé; lealdade
  rationale: A situação é de compromisso diplomático, de modo que “fidelidade” representa o sentido contextual de πίστις. “Fé” sugeriria indevidamente crença religiosa, enquanto “lealdade” é possível, mas um pouco mais interpretativa.
- issue: Modo verbal de ἐμείνατε
  choice: 'indicativo passado: “vocês continuaram”'
  alternative: 'imperativo: “continuem”'
  rationale: A forma grega transmitida contém aumento e corresponde formalmente ao aoristo indicativo, não ao imperativo μείνατε. Como o contexto pode sugerir uma exortação e a tradição inglesa consultada a adota, a alternativa é registrada em nota, sem alterar a evidência morfológica no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural. A tradução prioriza a morfologia do texto grego fornecido e torna explícita em nota a leitura exortativa favorecida pelo contexto. A pontuação final mantém a vírgula do fragmento, indicando que a sentença prossegue no versículo seguinte.
