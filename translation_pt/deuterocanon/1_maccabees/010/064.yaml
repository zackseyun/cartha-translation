base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/064.yaml
  text: And it happened that[a], when those who met him saw his splendor, as it had been proclaimed, and that he was clothed in linen[b], they all fled.
translation:
  language: pt
  text: E aconteceu que, quando os que o encontravam viram o seu esplendor[a], conforme havia sido proclamado, e que ele estava vestido de linho[b], todos fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua glória”. Neste contexto, o grego provavelmente se refere à magnificência régia visível, e não a um sentido especificamente teológico.
    reason: lexical_alternative
  - marker: b
    text: O grego diz “vestido de linho” ou “usando uma veste de linho”; o termo pode designar tecido ou roupa de linho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: E aconteceu que, quando
  rationale: Mantém a transição narrativa e o valor temporal da fórmula grega sem tornar o português excessivamente rígido.
- source_word: οἱ ἐντυγχάνοντες
  choice: os que o encontravam
  rationale: O particípio indica aqueles que se deparavam com ele ou o encontravam; o objeto pronominal é suprido pelo contexto.
- source_word: τὴν δόξαν αὐτοῦ
  choice: o seu esplendor
  rationale: Neste contexto régio e público, δόξα aponta provavelmente para magnificência visível; “esplendor” preserva o tom elevado sem impor um sentido especificamente teológico.
- source_word: καθὼς ἐκήρυξεν
  choice: conforme havia sido proclamado
  rationale: Expressa uma proclamação pública e conserva a indeterminação do sujeito do verbo grego por meio de uma construção passiva impessoal natural em português.
- source_word: περιβεβλημένον αὐτὸν σινδόνα
  choice: que ele estava vestido de linho
  rationale: περιβάλλω descreve estar vestido ou envolto, e σινδών designa tecido ou veste de linho; a formulação é clara e não acrescenta a ideia não expressa de linho fino.
- source_word: ἔφυγον πάντες
  choice: todos fugiram
  rationale: Reproduz diretamente a força do aoristo e de πάντες em português natural e digno.
theological_decisions:
- issue: Sentido de δόξα no contexto
  choice: esplendor
  alternative: glória
  rationale: O cenário enfatiza a aparência régia publicamente anunciada, favorecendo a ideia de magnificência visível; a alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha a progressão do grego, enquanto construções passivas e pronominais naturais evitam rigidez desnecessária.
