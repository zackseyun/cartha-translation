base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/075.yaml
  text: And he encamped against Joppa[a], and those from the city shut him out, because a garrison of Apollonius was in Joppa[b]; and they fought against it.
translation:
  language: pt
  text: Ele acampou contra Jope, e os da cidade o impediram de entrar, porque havia em Jope uma guarnição de Apolônio; e lutaram contra ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ela» pode se referir a Jope, isto é, à cidade, ou à guarnição; o grego admite ambas as leituras.
    reason: referential_ambiguity
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Ἰόππην
  choice: acampou contra Jope
  rationale: Em contexto militar, παρεμβάλλω indica estabelecer acampamento ou tomar posição diante de um lugar; «contra» conserva a intenção hostil expressa por ἐπί.
- source_word: ἀπέκλεισαν αὐτόν
  choice: o impediram de entrar
  rationale: ἀποκλείω significa fechar para fora ou excluir. A formulação explicita em português corrente a provável ação de negar-lhe acesso à cidade sem acrescentar a imagem não expressa de fechar portões.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: os da cidade
  rationale: Reproduz de modo conciso a expressão grega «os da cidade», sem especificar indevidamente se eram habitantes em geral ou homens ligados à defesa local.
- source_word: φρουρὰ Ἀπολλωνίου
  choice: uma guarnição de Apolônio
  rationale: φρουρά designa aqui uma força militar estacionada no local; o genitivo a associa a Apolônio.
- source_word: ἐπολέμησαν αὐτήν
  choice: lutaram contra ela
  rationale: Mantém o sentido militar de πολεμέω e preserva a referência feminina não explicitada do pronome αὐτήν, que pode ser entendida no contexto como Jope ou como a guarnição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com coordenação próxima do grego. «Os da cidade» conserva a concisão e evita definir além do texto a identidade do grupo; a nota mantém a ambiguidade real do pronome final.
