  text: I too will write to them words of encouragement and honor and gifts,[a]
translation:
  language: pt
  text: Eu também lhes escreverei palavras de encorajamento, de honra e de presentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “palavras de encorajamento, de elevação e de presentes”. O termo grego traduzido por “honra” significa literalmente “altura” ou “elevação” e pode referir-se a distinção ou promoção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψω
  choice: escreverei
  rationale: O futuro ativo do indicativo expressa diretamente a intenção do sujeito.
- source_word: κἀγώ
  choice: eu também
  rationale: A crase de καί + ἐγώ acrescenta sentido aditivo e enfático, preservado naturalmente por “eu também”.
- source_word: αὐτοῖς
  choice: lhes
  rationale: O dativo funciona como objeto indireto de γράψω; “lhes” é natural e conciso em português.
- source_word: λόγους παρακλήσεως
  choice: palavras de encorajamento
  rationale: Mantém a imagem de “palavras” e traduz παράκλησις pelo sentido positivo de incentivo ou ânimo adequado ao contexto diplomático, sem excluir por completo a ideia de exortação.
- source_word: ὕψους
  choice: honra
  rationale: Embora signifique literalmente “altura” ou “elevação”, neste contexto político pode indicar dignidade, distinção ou promoção; “honra” comunica esse sentido sem excessiva especificação.
- source_word: δομάτων
  choice: presentes
  rationale: Designa dádivas ou presentes; “presentes” soa natural no contexto de uma oferta diplomática.
