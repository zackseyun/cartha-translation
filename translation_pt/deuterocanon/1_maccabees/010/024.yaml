translation_notes:
  register: Português moderno, claro e digno. A coordenação foi explicitada como “e lhes oferecerei presentes” porque, em português, não se escrevem presentes; assim se comunica naturalmente que a carta conteria palavras favoráveis e seria acompanhada de dádivas. A nota preserva a formulação mais estritamente literal e a ambiguidade de ὕψους.
