base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/033.yaml
  text: And every Jewish person who has been taken captive from the land of Judah into any part of my kingdom I release as free[a], without payment; and let all also remit the taxes on them and on their livestock.
translation:
  language: pt
  text: E concedo liberdade, sem pagamento, a todo judeu que tenha sido levado cativo da terra de Judá para qualquer parte do meu reino; e que todos os isentem dos impostos que lhes são cobrados e dos que incidem sobre seus animais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção grega final é concisa e sintaticamente discutida. Pode referir-se especificamente aos impostos cobrados dos judeus e de seus animais, ou, de modo mais amplo, à remissão de impostos e de encargos relacionados aos bens deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν ψυχὴν Ἰουδαίων
  choice: todo judeu
  rationale: Neste contexto administrativo, ψυχή designa a pessoa, não a alma interior. “Todo judeu” é natural e preserva a força distributiva de πᾶσαν.
- source_word: τὴν αἰχμαλωτισθεῖσαν
  choice: que tenha sido levado cativo
  rationale: O particípio indica alguém feito prisioneiro e ainda nessa condição; a formulação portuguesa expressa o resultado presente de uma captura anterior.
- source_word: ἀπὸ γῆς Ἰούδα
  choice: da terra de Judá
  rationale: Mantém γῆ como “terra” e o nome Judá, sem substituir a expressão pela forma mais interpretativa “Judeia”.
- source_word: εἰς πᾶσαν βασιλείαν μου
  choice: para qualquer parte do meu reino
  rationale: A expressão indica dispersão em qualquer lugar dentro dos domínios do rei, e não a instituição abstrata da realeza.
- source_word: ἀφίημι ἐλευθέραν δωρεάν
  choice: concedo liberdade, sem pagamento
  rationale: ἀφίημι ἐλευθέραν comunica libertação, enquanto δωρεάν esclarece que não se exige resgate, taxa ou outra contraprestação.
- source_word: πάντες ἀφιέτωσαν
  choice: que todos o isentem
  rationale: No contexto fiscal, o imperativo pede às autoridades ou demais responsáveis que liberem a pessoa das obrigações cobradas.
- source_word: τοὺς φόρους
  choice: dos impostos
  rationale: φόροι designa tributos ou cobranças fiscais; “impostos” é o equivalente moderno mais claro.
- source_word: κτηνῶν αὐτῶν
  choice: dos que incidem sobre os seus animais
  rationale: κτῆνος designa animais domésticos, gado ou animais de carga. A tradução explicita a ligação elíptica com φόρους, entendendo a expressão como impostos incidentes sobre esses animais, e registra a dificuldade sintática em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Concedo liberdade” evita uma construção rígida como “solto como livre”; “animais” é mais abrangente e corrente que “gado”, pois κτῆνος pode incluir animais de carga. A nota preserva a ambiguidade fiscal da frase final.
