  yaml_path: translation/deuterocanon/1_maccabees/010/086.yaml
  text: And Jonathan departed from there and encamped at Ashkelon[a], and the people of the city came out to meet him with great honor.
translation:
  language: pt
  text: Então Jônatas partiu dali e acampou em Ascalom. Os habitantes da cidade saíram ao encontro dele com grande honra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com grande esplendor” ou “com grande glória”; a expressão grega destaca a magnificência da recepção oferecida a Jônatas pela cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: O aoristo de ἀπαίρω indica que Jônatas deixou o local anterior; “partiu dali” é natural e preserva o sentido de deslocamento.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: Em contexto militar e de viagem, o verbo designa o ato de estabelecer acampamento; “acampou” comunica isso com clareza.
- source_word: Ἀσκάλωνα
  choice: Ascalom
  rationale: Forma portuguesa tradicional e reconhecível do topônimo antigo.
- source_word: ἐξῆλθον
  choice: saíram
  rationale: Traduz diretamente o movimento para fora da cidade, complementado pela expressão “ao encontro dele”.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: os habitantes da cidade
  rationale: A expressão abrange as pessoas provenientes da cidade sem restringi-las explicitamente aos homens.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: ao encontro dele
  rationale: Equivalente idiomático português para a ação de sair a fim de receber ou encontrar alguém.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: com grande honra
  rationale: No contexto de uma recepção pública, δόξα pode indicar honra, glória ou esplendor; “grande honra” exprime naturalmente o tratamento prestigioso sem eliminar as alternativas lexicais, registradas em nota.
