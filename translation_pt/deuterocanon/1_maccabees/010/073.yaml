  yaml_path: translation/deuterocanon/1_maccabees/010/073.yaml
  text: And now you will not be able to withstand the cavalry and so great a force in the plain[a], where there is neither stone nor pebble nor a place to flee.
translation:
  language: pt
  text: E agora você não poderá resistir à cavalaria[a] e a uma força tão grande na planície, onde não há pedra nem seixo, nem lugar para fugir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “o cavalo” aparece no singular coletivo, com o sentido de cavalaria ou tropas montadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνήσῃ
  choice: você não poderá
  rationale: O futuro de δύναμαι expressa incapacidade futura; a formulação é direta e natural em português.
- source_word: ὑποστῆναι
  choice: resistir
  rationale: No contexto militar, indica manter-se firme diante de uma força adversária; “resistir” comunica isso com clareza.
- source_word: τὴν ἵππον
  choice: a cavalaria
  rationale: O singular coletivo, literalmente “o cavalo”, designa aqui as tropas montadas.
- source_word: δύναμιν τοσαύτην
  choice: uma força tão grande
  rationale: δύναμις refere-se à força militar, e τοσαύτην ressalta sua grandeza sem limitar o termo a um tipo específico de tropa.
- source_word: ἐν τῷ πεδίῳ
  choice: na planície
  rationale: πέδιον indica terreno plano e aberto, em contraste com lugares que poderiam favorecer defesa ou fuga.
- source_word: λίθος
  choice: pedra
  rationale: Mantém o sentido básico do termo e sua distinção em relação a κόχλας.
- source_word: κόχλας
  choice: seixo
  rationale: Designa uma pedra menor; “seixo” preserva o contraste lexical com λίθος.
- source_word: τόπος τοῦ φυγεῖν
  choice: lugar para fugir
  rationale: Reproduz de modo natural a construção que indica lugar ou possibilidade de fuga.
