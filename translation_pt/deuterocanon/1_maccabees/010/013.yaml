  text: And each one left his place and went away to his own land.
translation:
  language: pt
  text: E cada um deixou o seu lugar e foi para a sua própria terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέλιπεν
  choice: deixou
  rationale: O aoristo de καταλείπω indica aqui deixar para trás um local; «deixou» comunica o sentido narrativo sem intensificá-lo como «abandonou».
- source_word: ἕκαστος
  choice: cada um
  rationale: Preserva a força distributiva, indicando a ação individual de cada pessoa, sem acrescentar especificação masculina ausente do termo grego.
- source_word: τὸν τόπον αὐτοῦ
  choice: o seu lugar
  rationale: τόπος tem o sentido básico de «lugar». Embora o contexto possa sugerir posto ou posição, a formulação ampla evita interpretação excessiva.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: No encadeamento com «deixou o seu lugar», «foi» expressa de modo natural o afastamento indicado por ἀπέρχομαι; «foi embora para» seria possível, mas menos fluente diante do destino expresso.
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: para a sua própria terra
  rationale: γῆ refere-se aqui à terra ou território de origem de cada pessoa. «Sua própria terra» torna explícita em português a relação possessiva e evita a conotação nacional moderna que «país» poderia introduzir.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. A repetição de «seu/sua» mantém a distribuição individual do original, e «própria terra» esclarece que cada um voltou ao respectivo território de origem.
