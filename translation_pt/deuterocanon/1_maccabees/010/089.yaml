base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/089.yaml
  text: And he sent him a gold clasp[a], as is the custom to give to the king’s kinsmen; and he gave him Accaron and all its territory as an inheritance.
translation:
  language: pt
  text: E enviou-lhe um broche de ouro, como é costume dar aos parentes dos reis; e deu-lhe Acarom[a] e todo o seu território como herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Acarom é a forma grega do nome do lugar mais conhecido, a partir do hebraico, como Ecrom.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόρπην χρυσῆν
  choice: um broche de ouro
  rationale: πόρπη designa um fecho ou adorno usado para prender vestes. “Broche de ouro” é concreto, natural em português e evita definir com excessiva precisão o formato do objeto.
- source_word: ὡς ἔθος ἐστὶν διδόσθαι
  choice: como é costume dar
  rationale: Reproduz de modo claro e próximo a expressão grega que descreve uma prática costumeira da corte.
- source_word: τοῖς συγγενεῦσιν τῶν βασιλέων
  choice: aos parentes dos reis
  rationale: Mantém o plural genérico do grego e o sentido básico de συγγενεύς, sem pressupor que se trate exclusivamente dos parentes de um único rei.
- source_word: Ἀκκαρὼν
  choice: Acarom
  rationale: Translitera a forma grega do topônimo em ortografia portuguesa; a forma hebraica mais conhecida é indicada em nota.
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: todo o seu território
  rationale: Embora ὅρια possa significar literalmente “limites”, no plural também designa a área delimitada. “Todo o seu território” expressa naturalmente esse sentido geográfico no contexto de uma concessão.
- source_word: εἰς κληρονομίαν
  choice: como herança
  rationale: Preserva o valor jurídico e dinástico de κληρονομία como bem transmitido ou posse hereditária.
