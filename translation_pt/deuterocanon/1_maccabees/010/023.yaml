  yaml_path: translation/deuterocanon/1_maccabees/010/023.yaml
  text: He was grieved and said[a], “What is this that we have done, that Alexander has gotten ahead of us in securing friendship with the Jews for support?”
translation:
  language: pt
  text: 'Ele ficou aflito e disse: “O que foi que fizemos? Alexandre se adiantou a nós, conquistando a amizade dos judeus para obter apoio.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλυπήθη
  choice: ficou aflito
  rationale: Expressa dor emocional ou perturbação séria sem exagerar a intensidade do verbo.
- source_word: Τί τοῦτο ἐποιήσαμεν
  choice: O que foi que fizemos
  rationale: Mantém a pergunta retórica e o tom de autorreprovação, em português natural.
- source_word: προέφθακεν ἡμᾶς
  choice: se antecipar a nós
  rationale: Comunica que Alexandre agiu antes deles e lhes tomou a dianteira.
- source_word: φιλίαν
  choice: amizade
  rationale: Preserva o sentido lexical direto, enquanto o contexto político deixa transparecer a dimensão diplomática.
- source_word: καταλαβέσθαι
  choice: conquistar
  rationale: Neste contexto, indica obter ou ganhar para si a amizade de alguém.
- source_word: τοῖς Ἰουδαίοις
  choice: dos judeus
  rationale: Com φιλίαν, o dativo indica a relação estabelecida com os judeus; em português, “a amizade dos judeus” expressa naturalmente a amizade conquistada junto a eles.
- source_word: εἰς στήριγμα
  choice: a fim de obter apoio
  rationale: Explicita a finalidade política da amizade sem transformar “amizade” diretamente em “aliança”.
