translation:
  language: pt
  text: Visto que vocês mantiveram fidelidade para conosco nos tratados[a], permaneceram em amizade conosco e não se uniram aos nossos inimigos, ficamos sabendo[b], e
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mantiveram lealdade para conosco nos tratados”. Neste contexto diplomático, o grego πίστις pode indicar fidelidade ou lealdade.'
    reason: lexical_alternative
  - marker: b
    text: O texto grego transmitido repete “e” após “tratados”; essa repetição não é reproduzida na tradução. Ele termina neste versículo com “ficamos sabendo, e”, deixando a frase incompleta; a continuação vem no versículo seguinte.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεὶ
  choice: Visto que
  rationale: Introduz a causa do que vem a seguir e soa natural no contexto de uma carta oficial.
- source_word: συνετηρήσατε πίστιν
  choice: mantiveram a fidelidade
  rationale: O verbo composto indica conservar ou manter, enquanto πίστις, neste contexto diplomático, expressa fidelidade ou lealdade aos compromissos assumidos.
- source_word: πρὸς ἡμᾶς
  choice: para conosco
  rationale: Expressa a orientação relacional da fidelidade e preserva o tom formal da comunicação diplomática.
- source_word: συνθήκας
  choice: nos tratados
  rationale: Refere-se a acordos políticos formais; “tratados” é mais preciso que “alianças” ou “pactos” neste contexto interestatal.
- source_word: ἐνεμείνατε τῇ φιλία ἡμῶν
  choice: permaneceram em nossa amizade
  rationale: Mantém a imagem relacional do grego, sem eliminar o possível matiz político de aliança.
- source_word: οὐ προσεχωρήσατε τοῖς ἐχθροῖς ἡμῶν
  choice: não se uniram aos nossos inimigos
  rationale: O verbo indica aderir a outro lado ou passar para ele; a formulação é clara e adequada ao contexto político-militar.
- source_word: ἠκούσαμεν
  choice: ficamos sabendo disso
  rationale: No contexto epistolar, o verbo significa receber a notícia ou tomar conhecimento dos fatos mencionados; “disso” torna explícito em português o objeto entendido pelo contexto.
theological_decisions:
- issue: Sentido de πίστις em contexto político-diplomático
  choice: fidelidade
  alternative: fé; lealdade
  rationale: Aqui πίστις não designa primariamente crença religiosa, mas confiabilidade e constância nas relações estabelecidas por tratados. “Fidelidade” preserva essa amplitude sem introduzir uma leitura doutrinária estranha ao contexto.
translation_notes:
  register: Português moderno, claro e digno, com tom formal apropriado a uma carta régia. Emprega “vocês” para leitura internacional com boa naturalidade brasileira. A sintaxe conserva a sequência cumulativa do grego e mantém o “e” final, apesar da frase incompleta, para respeitar a divisão do texto transmitido.
