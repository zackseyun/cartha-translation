translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem frasal natural. “Ao seu lado” explicita de modo idiomático a posição honorífica indicada por μετʼ αὑτοῦ; “queixa” mantém a provável dimensão oficial de ἐντυγχάνειν, e a nota preserva sua amplitude lexical.
