base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/063.yaml
  text: And the king seated him with himself[a], and said to his officials, “Go out with him into the middle of the city, and proclaim that no one is to bring a complaint against him about any matter, and let no one trouble him for any reason.”
translation:
  language: pt
  text: 'O rei fez que ele se sentasse ao seu lado e disse aos seus oficiais: “Saiam com ele ao centro da cidade e proclamem que ninguém apresente queixa contra ele a respeito de questão alguma[a], nem o incomode por motivo algum.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ninguém faça petição contra ele a respeito de qualquer questão”. O verbo grego pode indicar dirigir-se a uma autoridade com uma petição ou representação, aqui provavelmente em sentido oficial ou jurídico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν αὐτὸν ὁ βασιλεὺς μετʼ αὑτοῦ
  choice: O rei fez com que ele se sentasse ao seu lado
  rationale: Preserva a força causativa de καθίζω e torna natural em português a honra de ser colocado junto ao rei.
- source_word: τοῖς ἄρχουσιν
  choice: aos seus oficiais
  rationale: No contexto da corte, designa de modo amplo e atual as pessoas investidas de autoridade, sem especificar indevidamente uma função militar.
- source_word: Ἐξέλθατε μετʼ αὐτοῦ εἰς μέσον τῆς πόλεως
  choice: Saiam com ele até o centro da cidade
  rationale: Mantém o movimento expresso pelo imperativo e o cenário central e público da proclamação.
- source_word: κηρύξατε
  choice: proclamem
  rationale: Reproduz o caráter público e oficial do anúncio feito por ordem real.
- source_word: τοῦ μηδένα ἐντυγχάνειν κατὰ τούτου περὶ μηδενὸς πράγματος
  choice: que ninguém apresente queixa alguma contra ele
  rationale: No uso com κατά, ἐντυγχάνειν pode indicar uma petição, representação ou queixa contra alguém; a formulação conserva o provável contexto oficial ou jurídico sem restringi-lo a uma acusação formal.
- source_word: μηδεὶς αὐτῷ ἐνοχλείτω περὶ παντὸς λόγου
  choice: nem o incomode por motivo algum
  rationale: Expressa de maneira clara a proibição geral de importunar ou molestar, enquanto λόγος assume aqui o sentido de motivo, causa ou questão.
