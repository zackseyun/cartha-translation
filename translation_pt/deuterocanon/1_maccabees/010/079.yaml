lexical_decisions:
- source_word: ἀπέλειπεν
  choice: deixou
  rationale: Expressa de modo direto a ação de deixar uma força posicionada, sem acrescentar uma nuance ausente do verbo.
- source_word: χιλίαν ἵππον
  choice: mil cavaleiros
  rationale: Embora ἵππον seja literalmente “cavalaria” ou “cavalos” em uso coletivo, o contexto militar pede a referência natural aos combatentes montados.
- source_word: κρυπτῶς
  choice: escondidos
  rationale: 'Vertido predicativamente com sentido adverbial: os cavaleiros foram deixados de maneira oculta, numa posição escondida.'
- source_word: κατόπισθεν αὐτῶν
  choice: atrás deles
  rationale: Preserva a referência pronominal e a posição espacial do grego sem identificar além do que o versículo declara.
