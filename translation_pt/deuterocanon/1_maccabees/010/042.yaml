revisions:
- from: Além disso, os cinco mil siclos de prata que, como nos anos anteriores, eram retirados anualmente das receitas, por conta do santuário,[a] também ficam isentos, pois pertencem aos sacerdotes que ali ministram.
  to: Além disso, os cinco mil siclos de prata que se costumavam retirar das receitas, como nos anos anteriores, da conta do santuário a cada ano,[a] também ficam isentos, pois pertencem aos sacerdotes que ministram.
  rationale: A revisão corrige a falsa nuance de «por conta do santuário», conservando a referência a uma conta ou registro administrativo do santuário e sua periodicidade anual. Mantém-se a construção deliberadamente próxima da sintaxe comprimida do grego, enquanto a nota registra alternativas seguras para λόγος. Remove-se a localização adicional «ali».
  reviewer_model: gpt-5.6-terra
