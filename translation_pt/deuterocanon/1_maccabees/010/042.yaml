base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/042.yaml
  text: And in addition to these things[a], the five thousand shekels of silver that they used to take from the revenues, as in former years, from the sanctuary account each year, these also are remitted, because they belong to the priests who minister.
translation:
  language: pt
  text: Além disso, os cinco mil siclos de prata que se costumavam retirar das receitas, como nos anos anteriores, da conta do santuário a cada ano,[a] também ficam isentos, pois pertencem aos sacerdotes que ministram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do registro anual do santuário” ou “do cômputo anual do santuário”. A expressão grega com λόγος é administrativa e bastante condensada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐπὶ τούτοις
  choice: Além disso
  rationale: Expressa com naturalidade a ideia aditiva da fórmula grega no contexto de novas concessões.
- source_word: πεντακισχιλίους σίκλους ἀργυρίου
  choice: os cinco mil siclos de prata
  rationale: Preserva a antiga unidade monetária e reproduz de modo claro a construção grega.
- source_word: ἐλάμβανον
  choice: eram retirados
  rationale: O imperfeito indica uma prática habitual passada; a voz passiva em português mantém indefinido o agente plural implícito no grego.
- source_word: ἀπὸ τῶν χρειῶν
  choice: das receitas
  rationale: No contexto fiscal, χρεῖαι designa receitas ou rendimentos, não necessidades.
- source_word: ὡς ἐν τοῖς πρώτοις ἔτεσιν
  choice: como nos anos anteriores
  rationale: Comunica a comparação com a prática dos anos precedentes em português atual.
- source_word: τοῦ ἁγίου ἀπὸ τοῦ λόγου κατʼ ἐνιαυτόν
  choice: anualmente das receitas, por conta do santuário
  rationale: Representa a expressão administrativa comprimida sem impor uma única análise sintática; λόγος pode indicar conta, cômputo ou registro fiscal.
- source_word: ἀφίεται
  choice: ficam isentos
  rationale: No contexto de tributos e receitas, indica a remissão da cobrança; a formulação portuguesa evita a conotação religiosa de perdão.
- source_word: διὰ τὸ ἀνήκειν αὐτὰ
  choice: pois pertencem
  rationale: Preserva a noção de que esses valores cabem por direito aos sacerdotes.
- source_word: τοῖς ἱερεῦσιν τοῖς λειτουργοῦσιν
  choice: aos sacerdotes que ali ministram
  rationale: Mantém o sentido cultual de λειτουργέω; “ali” explicita naturalmente que o serviço ocorre no santuário, sem acrescentar doutrina.
