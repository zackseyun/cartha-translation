review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a soma, o caráter habitual do imperfeito, as receitas, a remissão e o direito dos sacerdotes. Contudo, «por conta do santuário» normalmente significa «em nome/do lado do santuário» e não reproduz com precisão ἀπὸ τοῦ λόγου, que aqui se refere a uma conta, registro ou cômputo administrativo do santuário. «Ali» em «que ali ministram» também acrescenta uma explicitação locativa que o grego não declara nesta oração.
  naturalness: O texto é claro e tem registro administrativo apropriado. A revisão substitui a expressão ambígua e potencialmente enganosa «por conta do santuário» por uma formulação que conserva a referência fiscal e a ordem comprimida do grego.
  terminology: «Siclos de prata», «receitas», «santuário», «ficam isentos» e «sacerdotes que ministram» são escolhas adequadas. «Conta do santuário» é preferível a «por conta do santuário»; a nota mantém «cômputo» e «registro» como alternativas para λόγος.
  issues:
  - severity: medium
    issue: «por conta do santuário» não traduz adequadamente ἀπὸ τοῦ λόγου.
    rationale: Em português, a locução tende a indicar representação, responsabilidade ou benefício («em nome de»), enquanto λόγος no contexto é uma conta, um registro ou um cômputo fiscal. A leitura administrativa deve permanecer explícita.
  - severity: low
    issue: «ali» em «aos sacerdotes que ali ministram» é uma explicitação não presente no grego.
    rationale: O particípio/qualificação λειτουργοῦσιν identifica os sacerdotes que exercem o ministério; embora o contexto seja cultual, o advérbio locativo não é necessário.
  revised_text: Além disso, os cinco mil siclos de prata que se costumavam retirar das receitas, como nos anos anteriores, da conta do santuário a cada ano,[a] também ficam isentos, pois pertencem aos sacerdotes que ministram.
