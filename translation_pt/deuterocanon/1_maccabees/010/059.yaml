lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu
  rationale: Traduz diretamente o aoristo de γράφω sem acrescentar explicitamente «uma carta», objeto apenas implícito.
- source_word: ὁ βασιλεὺς Ἀλέξανδρος
  choice: o rei Alexandre
  rationale: Mantém o título e o nome na ordem natural do português.
- source_word: Ἰωνάθῃ
  choice: a Jônatas
  rationale: O dativo marca o destinatário da comunicação escrita; «Jônatas» é a forma portuguesa tradicional do nome.
- source_word: ἐλθεῖν
  choice: pedindo-lhe que fosse
  rationale: Após «escreveu», a construção explicita naturalmente em português o conteúdo do pedido. «Fosse» adota a perspectiva narrativa e evita o pouco idiomático «vir» quando o narrador não está no local de Alexandre.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: encontrar-se com ele
  rationale: Reproduz de maneira natural a expressão grega que indica ir ao encontro de alguém para uma reunião.
