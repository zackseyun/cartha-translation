base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/052.yaml
  text: After I returned to my kingdom and sat on the throne of my fathers[a], and took control of the rule, and crushed Demetrius and gained control of our land,
translation:
  language: pt
  text: Depois que voltei ao meu reino, sentei-me no trono de meus antepassados[a], assumi o poder, esmaguei Demétrio e passei a controlar nossa terra,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no trono de meus pais”. No grego, “pais” é uma expressão dinástica no sentido de antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: Depois que
  rationale: Introduz as circunstâncias anteriores à ação subsequente. A expressão preserva com naturalidade o sentido temporal, sem excluir por completo o pano de fundo causal.
- source_word: ἀνέστρεψα εἰς τὴν βασιλείαν μου
  choice: voltei ao meu reino
  rationale: O verbo indica retorno, e βασιλεία designa aqui o domínio político-territorial do rei.
- source_word: ἐκάθισα ἐπὶ θρόνου πατέρων μου
  choice: sentei-me no trono de meus pais
  rationale: Mantém a expressão dinástica concreta do grego e sua reivindicação de sucessão pela linhagem paterna.
- source_word: ἐκράτησα τῆς ἀρχῆς
  choice: assumi o poder
  rationale: Expressa de modo corrente a obtenção do controle da autoridade governante, sem sugerir necessariamente uma tomada ilegítima.
- source_word: συνέτριψα
  choice: esmaguei
  rationale: Conserva a força enfática e militar do verbo, mais intensa que simplesmente 'derrotei'.
- source_word: ἐπεκράτησα τῆς χώρας ἡμῶν
  choice: passei a controlar nossa terra
  rationale: Comunica o domínio político-militar alcançado; 'terra' evita conotações modernas de Estado-nação.
theological_decisions:
- issue: Expressão dinástica πατέρων μου
  choice: meus pais
  alternative: meus antepassados
  rationale: O grego diz literalmente 'meus pais'. A formulação preserva tanto a textura ancestral quanto a reivindicação dinástica masculina, enquanto a nota esclarece o sentido amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e a vírgula final foram preservadas porque o versículo integra uma frase que prossegue no contexto.
