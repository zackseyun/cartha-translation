base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/031.yaml
  text: And let Jerusalem be holy and set apart[a], along with its territory, its tithes[c][b], and its taxes.
translation:
  language: pt
  text: E que Jerusalém seja santa e isenta[a], juntamente com seu território[b], seus dízimos e seus impostos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “liberada” ou “dispensada”; no contexto, provavelmente isenta de encargos fiscais.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus limites” ou “suas fronteiras”; o grego pode indicar tanto as linhas de demarcação quanto o território delimitado.
    reason: lexical_alternative
  - marker: c
    text: Ou “suas taxas”, “seus pedágios” ou “seus direitos aduaneiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤτω
  choice: seja
  rationale: O imperativo de terceira pessoa de εἰμί tem força jussiva e decretal; em português, “que ... seja” expressa isso de modo natural.
- source_word: ἁγία
  choice: santa
  rationale: Preserva diretamente o caráter religioso e cultual atribuído a Jerusalém.
- source_word: ἀφιεμένη
  choice: isenta
  rationale: O particípio passivo de ἀφίημι pode indicar aquilo que foi liberado ou dispensado. No contexto de um decreto sobre dízimos e tributos, “isenta” comunica melhor a provável força jurídico-fiscal, sem eliminar em nota a possibilidade de sentido dedicatório.
- source_word: τὰ ὅρια αὐτῆς
  choice: seu território
  rationale: ὅρια pode designar limites ou a região delimitada. O contexto administrativo favorece o território ligado a Jerusalém, enquanto a nota mantém a ambiguidade lexical.
- source_word: αἱ δεκάται
  choice: seus dízimos
  rationale: O artigo e a relação possessiva do contexto apontam para os dízimos vinculados a Jerusalém e ao seu território.
- source_word: τὰ τέλη
  choice: seus impostos
  rationale: τέλη é termo amplo para impostos, taxas, pedágios ou direitos aduaneiros; “impostos” é claro e abrangente, com as acepções mais específicas registradas em nota.
theological_decisions:
- issue: Relação entre ἁγία e ἀφιεμένη
  choice: “santa e isenta”
  alternative: “santa e consagrada” ou “santa e separada”
  rationale: Os dois qualificativos são preservados distintamente. Embora ἀφιεμένη possa receber leitura dedicatória, o ambiente fiscal do decreto favorece a ideia de liberação ou isenção; a alternativa permanece explícita em nota.
- issue: Alcance de τὰ ὅρια αὐτῆς
  choice: “seu território”
  alternative: “seus limites” ou “suas fronteiras”
  rationale: O contexto administrativo sugere a região vinculada à cidade, mas o grego também pode referir-se aos limites que a demarcam; a nota evita encerrar a ambiguidade.
- issue: Relação sintática da lista final com a isenção
  choice: “juntamente com seu território, seus dízimos e seus impostos”
  alternative: entender os termos finais como especificação daquilo de que Jerusalém fica livre
  rationale: A coordenação nominativa permite associar os elementos ao estatuto concedido a Jerusalém. A tradução conserva a estrutura compacta do grego sem acrescentar uma preposição que resolveria de modo indevido sua relação exata.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formulação decretal natural. “Isenta” foi preferido por adequação ao contexto fiscal, enquanto as possibilidades dedicatórias e administrativas foram preservadas em notas.
