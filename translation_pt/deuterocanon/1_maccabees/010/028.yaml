translation:
  language: pt
  text: E nós lhes retribuiremos com coisas boas pelo que vocês fazem conosco.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em troca do que vocês fazem por nós” ou “em relação a nós”. O grego diz literalmente “conosco”, o que pode indicar cooperação ou relações favoráveis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποδώσομεν
  choice: retribuiremos
  rationale: O futuro ativo expressa dar algo em retorno. “Retribuiremos” preserva naturalmente o sentido de reciprocidade.
- source_word: ὑμῖν
  choice: lhes
  rationale: O pronome está no dativo e indica os destinatários da retribuição; “lhes” comunica essa função em português corrente.
- source_word: ἀγαθὰ
  choice: coisas boas
  rationale: O adjetivo neutro plural é substantivado e permanece amplo e não específico; “coisas boas” conserva tanto o plural quanto essa abrangência.
- source_word: ἀνθʼ ὧν
  choice: pelo que
  rationale: A expressão introduz a base ou contrapartida da retribuição. “Pelo que” é conciso e mantém a possível nuance causal e recíproca.
- source_word: ποιεῖτε
  choice: vocês fazem
  rationale: O presente grego descreve a conduta em curso ou habitual. O presente simples é natural em português sem excluir a continuidade.
- source_word: μεθʼ ἡμῶν
  choice: conosco
  rationale: μετά com genitivo significa literalmente “com”. “Conosco” preserva a formulação grega e sua possível ideia de cooperação, sem interpretá-la diretamente como benefício prestado.
