  text: But the people stood as Jonathan had commanded[a], and their horses grew weary.
translation:
  language: pt
  text: O povo, porém, mantinha-se em posição, como Jônatas havia ordenado, e os cavalos deles ficaram cansados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz simplesmente «os cavalos deles». Pelo contexto, provavelmente se refere aos cavalos da cavalaria inimiga, que se cansaram enquanto o povo de Jônatas mantinha a posição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ λαός
  choice: O povo, porém
  rationale: λαός designa aqui o povo ou as forças sob o comando de Jônatas; δέ marca a progressão narrativa com leve contraste, expresso naturalmente por «porém».
- source_word: ἱστήκει
  choice: permanecia firme
  rationale: A forma verbal descreve um estado continuado de estar parado ou manter a posição. «Permanecia firme» comunica de modo natural que o grupo sustentou a posição ordenada, sem acrescentar uma ação ofensiva.
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: conforme Jônatas havia ordenado
  rationale: ἐπιτάσσω significa ordenar ou comandar; o mais-que-perfeito composto deixa clara a anterioridade da ordem em relação à manutenção da posição.
- source_word: ἐκοπίασαν
  choice: ficaram cansados
  rationale: κοπιάω indica ficar cansado ou fatigado pelo esforço. A escolha preserva o sentido resultativo sem intensificá-lo para «ficaram exaustos».
- source_word: οἱ ἵπποι αὐτῶν
  choice: os cavalos deles
  rationale: A tradução mantém o possessivo ambíguo do grego. Pelo contexto, o referente mais provável são os adversários, mas isso não é explicitado no texto-fonte.
