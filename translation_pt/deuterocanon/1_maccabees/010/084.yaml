base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/084.yaml
  text: And Jonathan set Azotus and the cities around it on fire[a], and he took their spoil[b]; and he burned the temple of Dagon and its shrines with fire.
translation:
  language: pt
  text: Jônatas incendiou Azoto e as cidades ao redor dela[a], e tomou os despojos delas; e queimou com fogo o templo de Dagom e o templo dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azoto é a forma grega de Asdode.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego repete «templo»: literalmente, «o templo de Dagom e o templo dela». A repetição foi mantida, embora sua referência exata seja ambígua.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐνεπύρισεν
  choice: incendiou / queimou
  rationale: O verbo significa pôr fogo ou queimar. A variação em português evita rigidez estilística, sem alterar o sentido das duas ocorrências.
- source_word: Ἄζωτον
  choice: Azoto
  rationale: Reproduz em português a forma grega helenizada do nome da cidade; a forma hebraica mais conhecida é indicada em nota.
- source_word: τὰς πόλεις τὰς κύκλῳ αὐτῆς
  choice: as cidades ao redor dela
  rationale: κύκλῳ com genitivo expressa localização circundante; «dela» retoma naturalmente a cidade de Azoto.
- source_word: τὰ σκῦλα αὐτῶν
  choice: os despojos delas
  rationale: σκῦλα designa bens tomados ao inimigo na guerra, e αὐτῶν retoma as cidades.
- source_word: τὸ ἱερὸν Δαγὼν
  choice: o templo de Dagom
  rationale: ἱερόν pode indicar templo ou santuário; «templo» é claro e apropriado neste contexto narrativo.
- source_word: τὸ ἱερὸν αὐτῆς
  choice: o templo dela
  rationale: Preserva a repetição singular de ἱερόν e o pronome feminino do texto grego, sem substituí-los por um plural interpretativo como «santuários».
- source_word: ἐν πυρί
  choice: com fogo
  rationale: Expressão instrumental que reforça o ato de queimar; «com fogo» conserva essa formulação de modo idiomático.
