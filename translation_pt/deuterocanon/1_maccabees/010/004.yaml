base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/004.yaml
  text: For he said[a], “Let us get ahead of him by making peace with him, before he makes common cause with Alexander against us.”
translation:
  language: pt
  text: 'Pois ele disse: “Vamos nos antecipar a ele, fazendo as pazes com ele, antes que se coloque ao lado de Alexandre contra nós.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antes que se alie a Alexandre contra nós”. O grego diz literalmente “antes que se coloque com Alexandre contra nós”, expressão que indica alinhamento político.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προφθάσωμεν
  choice: Vamos nos antecipar a ele
  rationale: O subjuntivo aoristo hortativo de προφθάνω conclama a agir primeiro, antes da outra parte. “Vamos nos antecipar a ele” preserva a nuance estratégica em português natural.
- source_word: τοῦ εἰρηνεῦσαι
  choice: e fazer as pazes
  rationale: O infinitivo articular indica a ação em que o grupo pretende tomar a dianteira. A coordenação com “e” produz uma formulação clara e natural, sem perder a relação com προφθάσωμεν.
- source_word: μετʼ αὐτοῦ
  choice: com ele
  rationale: μετά com genitivo expressa a parte com quem se busca a paz; no contexto, o pronome se refere a Jônatas.
- source_word: πρὶν ἢ
  choice: antes que
  rationale: A locução introduz a ação que se pretende impedir por meio de uma iniciativa anterior.
- source_word: θεῖναι αὐτὸν μετὰ Ἀλεξάνδρου
  choice: que se coloque ao lado de Alexandre
  rationale: A expressão significa literalmente colocar-se com alguém e, no contexto político, sugere alinhamento ou aliança. A tradução mantém a imagem do grego e deixa a implicação política perceptível.
- source_word: καθʼ ἡμῶν
  choice: contra nós
  rationale: κατά com genitivo indica oposição ou hostilidade dirigida ao grupo do falante.
