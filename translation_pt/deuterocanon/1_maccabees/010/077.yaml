translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A coordenação narrativa do grego foi preservada em grande parte, mas dividida em duas frases para evitar uma sequência excessivamente longa. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
