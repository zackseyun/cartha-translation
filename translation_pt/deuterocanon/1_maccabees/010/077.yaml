base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/077.yaml
  text: And Apollonius heard[a], and he encamped with three thousand cavalry and a large force, and went to Azotus as though passing through, and at the same time advanced into the plain[b], because he had a multitude of cavalry and trusted in it.
translation:
  language: pt
  text: Apolônio soube disso e acampou com três mil cavaleiros e uma grande força. Depois foi para Azoto, como se estivesse apenas de passagem[a], e, ao mesmo tempo, avançou para a planície, pois dispunha de numerosa cavalaria[b] e confiava nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como quem estava atravessando a região». A expressão grega indica que seu movimento parecia ser apenas de trânsito, e não um ataque declarado.'
    reason: lexical_alternative
  - marker: b
    text: O grego emprega «cavalo» coletivamente para designar tropas montadas; por isso, «cavalaria».
    reason: cultural_note
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube disso
  rationale: O verbo significa literalmente «ouviu», mas, sem objeto expresso, a formulação portuguesa «soube disso» comunica naturalmente que Apolônio recebeu a notícia mencionada no contexto.
- source_word: παρενέβαλεν
  choice: acampou com
  rationale: Em narrativa militar, o verbo indica montar ou estabelecer acampamento. A preposição «com» torna clara e natural em português a associação com as tropas enumeradas.
- source_word: τρισχιλίαν ἵππον
  choice: três mil cavaleiros
  rationale: ἵππος, literalmente «cavalo», é usado coletivamente para tropas montadas. Na contagem, «três mil cavaleiros» é mais idiomático e preciso em português do que «três mil de cavalaria».
- source_word: δύναμιν πολλήν
  choice: uma grande força
  rationale: δύναμις designa aqui uma força militar, não poder abstrato; a tradução mantém a amplitude do termo sem especificar indevidamente a composição das tropas.
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: foi para Azoto
  rationale: Mantém o sentido comum do verbo de deslocamento sem acrescentar que ele marchou ou atacou.
- source_word: ὡς διοδεύων
  choice: como se estivesse apenas de passagem
  rationale: A construção ὡς com particípio apresenta o movimento sob a aparência de simples trânsito, possivelmente como disfarce tático, sem afirmar explicitamente intenção enganosa.
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: ao mesmo tempo, avançou para a planície
  rationale: ἅμα assinala simultaneidade, e προσάγω, neste contexto militar, descreve avanço ou aproximação. «Para a planície» preserva a direção sem forçar se ele já entrou nela.
- source_word: πλῆθος ἵππου
  choice: numerosa cavalaria
  rationale: O singular coletivo ἵππου refere-se às tropas montadas; «numerosa cavalaria» reproduz também a ideia de grande quantidade expressa por πλῆθος.
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: confiava nela
  rationale: O perfeito exprime confiança estabelecida, e o pronome feminino remete naturalmente à cavalaria, também feminina em português.
