lexical_decisions:
- source_word: συνήγαγεν
  choice: reuniu
  rationale: O aoristo de συνάγω descreve a concentração de recursos militares; “reuniu” é claro, natural e não acrescenta a nuance mais específica de convocação formal.
- source_word: δυνάμεις μεγάλας
  choice: grandes forças
  rationale: Em contexto militar, δυνάμεις designa forças ou tropas. A tradução preserva o plural e entende μεγάλας em sentido quantitativo.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: παρεμβάλλω, em narrativa militar, significa estabelecer acampamento. “Acampou” é corrente e conciso.
- source_word: ἐξ ἐναντίας
  choice: diante de
  rationale: A expressão indica posição frontal ou oposta. “Diante de” preserva o sentido espacial sem afirmar que o ataque já havia começado.
- source_word: Δημητρίῳ
  choice: Demétrio
  rationale: Forma tradicional e corrente em português para o nome grego Δημήτριος.
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: o rei Alexandre
  rationale: A colocação do título antes do nome é mais natural em português, sem alterar a identificação expressa pela aposição grega.
