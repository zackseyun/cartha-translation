  to: Em vez de receber a terça parte da produção dos campos semeados[a] e a metade dos frutos das árvores, que me cabem, a partir de hoje e daí em diante renuncio a cobrá-las[b] na terra de Judá e nos três distritos[c] que lhe foram acrescentados, provenientes da Samaria e da Galileia, a partir de hoje e para sempre.
