base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/030.yaml
  text: And instead of the third of the seed-sowing[a], and instead of the half of the fruit of the trees that falls to me to receive, I release it from this day and onward, from being taken from the land of Judah and from the three districts added to it from Samaria and Galilee[c][b], from this day and for all time.
translation:
  language: pt
  text: Em vez de receber a terça parte da produção dos campos semeados[a] e a metade dos frutos das árvores, que me cabem, a partir de hoje e daí em diante renuncio a cobrá-las[b] na terra de Judá e nos três distritos[c] que lhe foram acrescentados, provenientes da Samaria e da Galileia, a partir de hoje e para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «a terça parte da semeadura». A expressão se refere à parcela da produção dos campos semeados.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a parcela real ou o tributo que, de outro modo, seria devido ao rei.
    reason: cultural_note
  - marker: c
    text: «Distritos» traduz o grego nomoi, termo que designa regiões administrativas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ
  choice: Quanto a
  rationale: No contexto, introduz as parcelas fiscais das quais o rei abre mão. A formulação evita o pouco natural «em vez de» sem alterar a relação entre os tributos e sua remissão.
- source_word: τρίτου τῆς σπορᾶς
  choice: terça parte da produção dos campos semeados
  rationale: σπορά pode designar a semeadura ou aquilo que é semeado. A escolha comunica naturalmente a parcela agrícola tributada, enquanto a nota preserva a forma mais literal.
- source_word: τοῦ ἡμίσους τοῦ καρποῦ τοῦ ξυλίνου
  choice: metade dos frutos das árvores
  rationale: Expressa em português corrente os produtos provenientes das árvores, sem recorrer ao literalismo obscuro «fruto lenhoso».
- source_word: τοῦ ἐπιβάλλοντός μοι λαβεῖν
  choice: que me cabe receber
  rationale: Preserva a ideia de uma parcela devida ao rei, sem acrescentar uma modalidade coercitiva não expressa no grego.
- source_word: ἀφίημι
  choice: abro mão
  rationale: No contexto fiscal, indica a renúncia do rei ao recebimento. É preciso, acessível e evita tanto o sentido moral de «perdoar» quanto o tecnicismo de «remitir».
- source_word: τοῦ λαβεῖν
  choice: dessa cobrança
  rationale: O infinitivo articular refere-se à arrecadação que deixa de ser feita. A explicitação nominal produz português natural, e a nota esclarece que se trata da parcela real.
- source_word: γῆς Ἰούδα
  choice: terra de Judá
  rationale: Reproduz diretamente a designação geográfica grega em linguagem bíblica clara e atual.
- source_word: τῶν τριῶν νομῶν
  choice: três distritos
  rationale: νομοί são divisões administrativas. «Distritos» comunica a função sem impor ao leitor o termo técnico «nomos».
- source_word: τῶν προστιθεμένων αὐτῇ
  choice: que lhe foram acrescentados
  rationale: Mantém a relação passiva e a referência de αὐτῇ à terra de Judá.
- source_word: ἀπὸ τῆς Σαμαρίτιδος καὶ Γαλιλαίας
  choice: provenientes da Samaria e da Galileia
  rationale: Torna explícito que os distritos acrescentados procedem dessas regiões, preservando ambas as referências geográficas do texto fonte.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: para sempre
  rationale: Equivalente idiomático e digno para a ideia de duração ilimitada.
