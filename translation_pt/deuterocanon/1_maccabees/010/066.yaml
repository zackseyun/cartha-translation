lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: voltou
  rationale: No contexto narrativo, com εἰς Ἱερουσαλήμ, indica o retorno a Jerusalém; “voltou” é natural e preserva o sentido direcional.
- source_word: Ἰωνάθαν
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: εἰς Ἱερουσαλήμ
  choice: para Jerusalém
  rationale: Expressa naturalmente em português o destino indicado por εἰς com acusativo.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Embora μετά com genitivo signifique literalmente “com”, a expressão idiomática portuguesa “em paz” comunica com clareza um retorno seguro e tranquilo.
- source_word: εὐφροσύνης
  choice: alegria
  rationale: O substantivo denota alegria ou regozijo; “alegria” é corrente, digna e adequada ao registro narrativo.
