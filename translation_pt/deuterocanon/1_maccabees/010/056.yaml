  yaml_path: translation/deuterocanon/1_maccabees/010/056.yaml
  text: And now I will do for you what you wrote; but meet me at Ptolemais[a], so that we may see one another, and I will become related by marriage to you, just as you said.
translation:
  language: pt
  text: E agora farei por você o que você escreveu. Mas venha encontrar-se comigo em Ptolemaida, para que nos vejamos, e estabelecerei parentesco por casamento com você[a], conforme você disse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «farei uma aliança matrimonial com você». O verbo grego se refere ao estabelecimento de parentesco por casamento; o contexto mais amplo mostra que se trata de um casamento dinástico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσω
  choice: farei
  rationale: Expressa diretamente o ato de cumprir o que foi proposto na carta, sem especificar além do grego.
- source_word: ἃ ἔγραψας
  choice: o que escreveu
  rationale: Retoma de modo natural e conciso o conteúdo da carta do destinatário.
- source_word: ἀπάντησον εἰς Πτολεμαΐδα
  choice: venha encontrar-se comigo em Ptolemaida
  rationale: O imperativo indica deslocamento para um encontro; «venha encontrar-se comigo» preserva essa ideia, e «em Ptolemaida» identifica naturalmente o local.
- source_word: ὅπως ἰδωμεν ἀλλήλους
  choice: para que nos vejamos
  rationale: Mantém a imagem literal de ver um ao outro e soa natural em português.
- source_word: ἐπιγαμβρεύσω σοι
  choice: me tornarei seu parente por casamento
  rationale: Preserva o sentido de estabelecer parentesco por casamento sem explicitar neste versículo quem se casará com quem.
- source_word: καθὼς εἴρηκας
  choice: conforme você disse
  rationale: Representa naturalmente a referência à proposta anterior do destinatário.
