base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/020.yaml
  text: And now today we have appointed you high priest of your nation[c][b][a], and to be called the king’s Friend—and they sent him a purple robe and a crown of gold—and to take our side and maintain friendship with us.
translation:
  language: pt
  text: E agora, hoje, nós o constituímos sumo sacerdote da sua nação, para ser chamado Amigo do rei[a] — e enviaram-lhe um manto púrpura e uma coroa de ouro[b] — e para tomar o nosso partido[c] e manter amizade conosco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “amigo do rei”. No uso helenístico, a expressão grega pode refletir um título oficial da corte.'
    reason: lexical_alternative
  - marker: b
    text: Neste ponto, o texto grego passa da fala régia na primeira pessoa (“nós o constituímos”) para a narração na terceira pessoa (“enviaram-lhe”); a tradução preserva essa mudança.
    reason: textual_variant
  - marker: c
    text: Literalmente, “pensar as nossas coisas”; a expressão significa favorecer os nossos interesses ou tomar o nosso partido.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεστάκαμέν
  choice: constituímos
  rationale: O perfeito de καθίστημι, neste contexto oficial, indica a investidura formal no cargo; “constituímos” transmite isso em português corrente e solene.
- source_word: ἀρχιερέα
  choice: sumo sacerdote
  rationale: É a designação portuguesa consagrada e precisa para o principal ofício sacerdotal judaico.
- source_word: τοῦ ἔθνους σου
  choice: da sua nação
  rationale: ἔθνος designa aqui o corpo nacional judaico; “nação” preserva melhor o sentido político e coletivo do decreto.
- source_word: φίλον βασιλέως
  choice: Amigo do rei
  rationale: A expressão provavelmente funciona como título honorífico da corte helenística. A inicial maiúscula em “Amigo” sinaliza esse possível valor oficial sem ocultar o sentido literal.
- source_word: καλεῖσθαι
  choice: que seja chamado
  rationale: O infinitivo depende da fórmula de nomeação; a construção com “determinamos que” torna clara e natural em português a coordenação difícil do grego.
- source_word: πορφύραν
  choice: um manto púrpura
  rationale: O substantivo pode indicar púrpura, tecido púrpura ou uma veste púrpura; no contexto de uma insígnia régia enviada como presente, “manto púrpura” explicita naturalmente a peça de roupa implícita.
- source_word: στέφανον χρυσοῦν
  choice: uma coroa de ouro
  rationale: στέφανος pode ser grinalda ou coroa; neste contexto de investidura, “coroa” é clara, enquanto “de ouro” acompanha de perto a expressão grega.
- source_word: φρονεῖν τὰ ἡμῶν
  choice: tome o nosso partido
  rationale: Literalmente, a expressão é “pensar as nossas coisas”, mas o idioma comunica adesão aos interesses ou à causa de alguém; “tomar o nosso partido” conserva o teor político.
- source_word: συντηρεῖν φιλίαν πρὸς ἡμᾶς
  choice: mantenha amizade conosco
  rationale: A frase exprime a continuidade de uma relação de amizade e lealdade diplomática.
- source_word: ἀπέστειλαν αὐτῷ
  choice: enviaram-lhe
  rationale: O texto transmitido emprega a terceira pessoa do plural e cria uma mudança em relação ao discurso régio na primeira pessoa; a tradução preserva essa mudança.
theological_decisions:
- issue: Valor oficial de φίλον βασιλέως
  choice: “Amigo do rei”, com inicial maiúscula em “Amigo”
  alternative: “amigo do rei” ou “amigo real”
  rationale: Embora seja sobretudo uma questão histórico-política, a expressão provavelmente designa uma dignidade oficial da corte helenística. A forma escolhida preserva essa possibilidade sem transformar a expressão em um título menos transparente.
- issue: Mudança de pessoa em ἀπέστειλαν αὐτῷ dentro do decreto citado
  choice: 'Preservar a terceira pessoa: “enviaram-lhe”'
  alternative: 'Harmonizar com a primeira pessoa: “nós lhe enviamos”'
  rationale: O grego fornecido muda da fala régia na primeira pessoa para uma observação na terceira pessoa. Sem evidência textual suficiente para corrigir ou harmonizar a passagem, a tradução mantém a forma transmitida e sua tensão narrativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A tradução mantém o tom de decreto régio, preserva a mudança de pessoa do grego e esclarece os infinitivos por meio de uma construção portuguesa natural, sem resolver silenciosamente as ambiguidades históricas.
