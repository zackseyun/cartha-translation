  text: Jônatas passou a morar em Jerusalém e começou a construir e renovar a cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾤκησεν
  choice: passou a morar
  rationale: O aoristo de οἰκέω indica que Jônatas se estabeleceu em Jerusalém; esta formulação natural comunica melhor a entrada nesse estado do que o simples «morou».
- source_word: οἰκοδομεῖν
  choice: reconstruir
  rationale: No contexto de uma cidade já existente que precisava de obras, «reconstruir» expressa naturalmente o sentido contextual de edificar novamente, sem reduzir o verbo à mera construção inicial.
- source_word: καινίζειν
  choice: renovar
  rationale: Reproduz o sentido de tornar nova ou restaurar, mantendo-o distinto de οἰκοδομεῖν.
