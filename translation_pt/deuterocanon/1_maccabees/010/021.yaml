base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/021.yaml
  text: And Jonathan put on the holy robe in the seventh month[a], in the one hundred sixtieth year, at the feast of Booths, and he gathered forces and made many weapons.
translation:
  language: pt
  text: Jônatas vestiu-se da veste sagrada no sétimo mês do centésimo sexagésimo ano, na Festa das Cabanas[a], e reuniu tropas e preparou muitas armas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também chamada “Festa dos Tabernáculos”. O termo grego refere-se literalmente à festa da construção de cabanas ou abrigos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδύσατο
  choice: vestiu
  rationale: O aoristo médio de ἐνδύω descreve Jônatas colocando em si a vestimenta; “vestiu” é direto e natural em português.
- source_word: τὴν ἁγίαν στολήν
  choice: a veste sagrada
  rationale: στολή designa uma veste ou traje solene, e ἁγίαν indica seu caráter consagrado. A formulação evita especificar além do grego o tipo exato de vestimenta sacerdotal.
- source_word: τῷ ἑβδόμῳ μηνὶ
  choice: no sétimo mês
  rationale: Reproduz de modo idiomático o dativo temporal grego.
- source_word: ἔτους ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: do ano cento e sessenta
  rationale: A construção ordinal grega identifica o 160º ano; a forma por extenso é clara e corrente em português.
- source_word: ἐν ἑορτῇ σκηνοπηγίας
  choice: durante a Festa das Cabanas
  rationale: σκηνοπηγία designa a festa judaica associada à construção e habitação em abrigos temporários. “Festa das Cabanas” comunica esse sentido de forma transparente, enquanto o nome tradicional é preservado em nota.
- source_word: συνήγαγεν δυνάμεις
  choice: reuniu tropas
  rationale: No contexto militar, δυνάμεις se refere a forças ou contingentes; “tropas” torna o sentido claro sem pressupor um exército formal completo.
- source_word: κατεσκεύασεν ὅπλα πολλά
  choice: preparou muitas armas
  rationale: κατασκευάζω pode significar fabricar, equipar ou preparar. “Preparou” preserva essa amplitude melhor que “fabricou”, e ὅπλα é naturalmente traduzido por “armas”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A conjunção repetida do grego foi articulada em duas frases para fluidez, sem alterar a sequência dos acontecimentos. O fragmento inicial “ἡμῶν καὶ συντηρεῖν φιλίαν πρὸς ἡμᾶς” pertence ao contexto anterior e não foi incluído no versículo.
