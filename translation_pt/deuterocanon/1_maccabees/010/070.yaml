base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/070.yaml
  text: And he sent to Jonathan the high priest[a], saying, “You alone are lifting yourself up against us, while I have become an object of ridicule and reproach because of you[c][b]; and why do you exercise authority over us in the mountains?”
translation:
  language: pt
  text: 'E ele mandou dizer a Jônatas, o sumo sacerdote: “Só você se levanta contra nós[a], enquanto eu, por causa de você, me tornei alvo de zombaria e afronta[b]. E por que você exerce autoridade sobre nós na região montanhosa[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se exalta contra nós”. O verbo grego pode indicar tanto levantar-se agressivamente contra alguém como engrandecer a si mesmo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “me tornei motivo de riso e de vergonha”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “nos montes”; a expressão também pode designar, de modo mais amplo, a região montanhosa.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλεν πρὸς
  choice: mandou dizer a
  rationale: A construção indica o envio de uma mensagem ou mensageiro. “Mandou dizer a” comunica isso naturalmente sem especificar um meio que o grego não explicita.
- source_word: τὸν ἀρχιερέα
  choice: o sumo sacerdote
  rationale: É a designação portuguesa tradicional e clara para o principal ofício sacerdotal judaico.
- source_word: Σὺ μονώτατος
  choice: Só você
  rationale: Expressa de modo natural a exclusividade enfática do superlativo μονώτατος.
- source_word: ἐπαίρῃ ἐφʼ ἡμᾶς
  choice: se levanta contra nós
  rationale: Preserva o movimento hostil sugerido pela construção e, por meio da nota, mantém a possível conotação de autoexaltação.
- source_word: ἐγενήθην εἰς καταγέλωτα καὶ ὀνειδισμόν
  choice: me tornei alvo de zombaria e afronta
  rationale: Reproduz os dois substantivos de vergonha pública em português atual e digno, sem reduzir a expressão a uma única ideia.
- source_word: διὰ σέ
  choice: por causa de você
  rationale: Representa diretamente o valor causal de διά com acusativo.
- source_word: ἐξουσιάζῃ ἐφʼ ἡμᾶς
  choice: exerce autoridade sobre nós
  rationale: Mantém a noção de exercício de poder ou controle sem intensificá-la para “domina” nem neutralizá-la como mera administração.
- source_word: ἐν τοῖς ὄρεσιν
  choice: na região montanhosa
  rationale: Em contexto geográfico, o plural ὄρεσιν pode designar coletivamente a serra ou região de montes; a escolha soa natural em português e evita sugerir apenas picos isolados.
