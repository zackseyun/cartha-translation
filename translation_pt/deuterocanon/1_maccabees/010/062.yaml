  yaml_path: translation/deuterocanon/1_maccabees/010/062.yaml
  text: And the king gave orders to them[a], and they stripped Jonathan of his garments and clothed him in purple[b]; and they did so.
translation:
  language: pt
  text: O rei deu-lhes ordens[a], tirou as vestes de Jônatas e vestiu-o de púrpura[b]; e eles assim fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No grego, «tirou» e «vestiu-o» estão no singular, ao passo que a cláusula final, «eles assim fizeram», está no plural. A relação entre o rei e os que cumpriram a ordem é sintaticamente irregular no texto.
    reason: textual_variant
  - marker: b
    text: Neste contexto de corte, a púrpura indica uma veste própria da realeza ou de alguém de posição elevada.
    reason: cultural_note
lexical_decisions:
- source_word: προσέταξεν
  choice: deu ordens
  rationale: Expressa uma determinação autoritativa do rei em português natural e atual.
- source_word: ἐξέδυσεν
  choice: eles tiraram as vestes de Jônatas
  rationale: Embora a forma grega seja singular, o plural anterior («lhes») e a conclusão plural («assim fizeram») indicam que os encarregados cumpriram a ordem do rei; a nota preserva a irregularidade gramatical do texto.
- source_word: ἱμάτια
  choice: vestes
  rationale: Termo geral para roupas, adequado ao registro digno e ao contexto cerimonial da corte sem especificar indevidamente «mantos».
- source_word: ἐνέδυσεν
  choice: o vestiram
  rationale: Formulação idiomática que comunica o ato cerimonial de revestir Jônatas.
- source_word: πορφύραν
  choice: de púrpura
  rationale: Mantém a concisão do substantivo grego, que pode designar tecido púrpura ou uma veste dessa cor, sem acrescentar um tipo específico de roupa.
- source_word: ἐποίησαν οὕτως
  choice: E assim fizeram
  rationale: Reproduz de modo direto e natural a declaração final de que a ordem foi cumprida.
