base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/045.yaml
  text: and for the walls of Jerusalem to be rebuilt and fortified all around[a], the expense will be paid from the king’s treasury, and for the walls in Judea to be rebuilt.
translation:
  language: pt
  text: e para que as muralhas de Jerusalém sejam reconstruídas e fortificadas em toda a volta, a despesa será custeada por ordem do rei[a], e para que as muralhas da Judeia sejam reconstruídas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “a despesa será custeada a partir da conta ou do registro do rei”. A expressão grega ἐκ τοῦ λόγου τοῦ βασιλέως pode referir-se tanto a uma determinação oficial do rei quanto, em sentido administrativo-contábil, a sua conta ou registro.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι / οἰκοδομῆσαι
  choice: sejam reconstruídas
  rationale: Os infinitivos exprimem a construção das muralhas; no contexto de restauração das defesas existentes, “reconstruídas” comunica naturalmente o sentido provável, sem ampliar a ideia.
- source_word: τὰ τείχη
  choice: as muralhas
  rationale: “Muralhas” é o termo português corrente para muros defensivos de cidades e corresponde ao sentido contextual de τείχη.
- source_word: ὀχυρῶσαι
  choice: fortificadas
  rationale: O verbo significa tornar seguro ou fortalecer defensivamente; “fortificadas” é preciso e idiomático.
- source_word: κυκλόθεν
  choice: ao redor
  rationale: Preserva de modo claro e natural a ideia espacial de circundar a cidade.
- source_word: ἡ δαπάνη
  choice: a despesa
  rationale: O substantivo designa o desembolso ou custo financeiro da obra; “despesa” convém ao contexto administrativo.
- source_word: δοθήσεται
  choice: será paga
  rationale: Embora o verbo signifique literalmente “será dada”, com “a despesa” a formulação “será paga” expressa em português natural o sentido financeiro.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: pelo tesouro do rei
  rationale: No contexto de custeio, λόγος pode ter valor administrativo ou contábil. “Tesouro do rei” torna clara a fonte dos recursos, enquanto a nota preserva a possível leitura ligada à ordem oficial do rei.
- source_word: Ἰουδαίᾳ
  choice: Judeia
  rationale: É a designação geográfica apropriada para a região no período helenístico.
