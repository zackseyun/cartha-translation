translation_notes:
  register: Português moderno, claro e digno, com tom de decreto real. Mantém-se a alternância do plural “concederemos/daremos” para o singular “eu libero”, presente no grego. A repetição jurídica de “libero e isento” também foi preservada, enquanto os termos fiscais antigos receberam formulações compreensíveis e notas explicativas.
