base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/029.yaml
  text: And we will grant you many remissions[a], and we will give you gifts. And now I release you and exempt all the Jews from the taxes, from the salt duty[c][b], and from the crown levies.
translation:
  language: pt
  text: E concederemos a vocês muitas remissões[a] e lhes daremos presentes. Agora eu os libero e isento todos os judeus dos impostos, da taxa sobre o sal[b] e dos tributos das coroas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitas isenções”. A expressão grega ἀφέματα πολλά refere-se, neste contexto, à liberação de obrigações fiscais.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega pode significar literalmente “preço do sal”; nesta lista fiscal, provavelmente designa uma taxa ou cobrança relacionada ao sal.
    reason: cultural_note
  - marker: c
    text: Literalmente, “coroas”. No sistema financeiro helenístico, o termo podia designar coroas honoríficas oferecidas ao rei ou contribuições em dinheiro equivalentes.
    reason: cultural_note
lexical_decisions:
- source_word: ἀφήσομεν
  choice: concederemos
  rationale: Com ἀφέματα como objeto, o verbo introduz a concessão de medidas fiscais; “concederemos” é natural em português e preserva o tom oficial.
- source_word: ἀφέματα πολλά
  choice: muitas remissões
  rationale: No contexto administrativo e fiscal, refere-se à remissão de obrigações, não ao perdão de pecados. A nota registra a alternativa mais explícita “muitas isenções”.
- source_word: δόματα
  choice: presentes
  rationale: Designa benefícios ou bens concedidos pelo rei; “presentes” mantém o sentido amplo e concreto do termo.
- source_word: ἀπολύω
  choice: libero
  rationale: O verbo indica liberação legal de obrigações. “Libero” preserva sua força sem sugerir necessariamente soltura física.
- source_word: ἀφίημι ... ἀπὸ
  choice: isento ... de
  rationale: A construção com as obrigações fiscais enumeradas expressa isenção; esta formulação é clara e idiomática em português.
- source_word: φόρων
  choice: impostos
  rationale: É o termo contemporâneo mais claro para pagamentos compulsórios ao Estado neste contexto.
- source_word: τιμῆς τοῦ ἁλός
  choice: taxa sobre o sal
  rationale: Embora τιμή possa significar “preço” ou “valor”, sua posição numa lista fiscal favorece o sentido de cobrança vinculada ao sal; a nota preserva essa nuance histórica.
- source_word: στεφάνων
  choice: contribuições das coroas
  rationale: Literalmente “coroas”, o termo pode designar coroas honoríficas oferecidas ao soberano ou pagamentos monetários equivalentes. “Contribuições das coroas” torna perceptível a função fiscal sem apagar a imagem original.
