  text: And the king honored him[a], and enrolled him among the first friends[b], and appointed him general and governor of a district.
translation:
  language: pt
  text: E o rei o honrou, inscreveu-o entre os Primeiros Amigos[a] e o nomeou general e governador de distrito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «entre os amigos mais importantes». A expressão «Primeiros Amigos» provavelmente era o título de uma categoria oficial da corte.
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por «governador de distrito» designa o governante administrativo de uma divisão territorial.
    reason: cultural_note
lexical_decisions:
- source_word: ἐδόξασεν
  choice: honrou
  rationale: No contexto político da corte, o verbo indica conceder honra ou distinção, não glorificação em sentido teológico.
- source_word: ἔγραψεν αὐτὸν τῶν πρώτων φίλων
  choice: inscreveu-o entre os Primeiros Amigos
  rationale: γράφω tem aqui o sentido de registrar ou incluir oficialmente alguém numa categoria; «entre» torna a expressão natural em português.
- source_word: τῶν πρώτων φίλων
  choice: os Primeiros Amigos
  rationale: A expressão provavelmente designa uma categoria oficial da corte. As iniciais maiúsculas sinalizam o caráter titular sem substituir o termo por uma interpretação mais específica.
- source_word: στρατηγὸν
  choice: general
  rationale: O título é entendido em seu sentido militar, distinguindo-se do cargo administrativo mencionado em seguida.
- source_word: μεριδάρχην
  choice: governador de distrito
  rationale: O termo designa o governante de uma divisão territorial; a tradução explicativa evita tanto uma transliteração obscura quanto precisão administrativa indevida.
