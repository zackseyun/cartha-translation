base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/040.yaml
  text: And I also give, year by year, fifteen thousand shekels of silver from the king’s account, from the places that belong to him.
translation:
  language: pt
  text: Eu também dou, a cada ano, quinze mil siclos de prata da conta do rei[a], dos lugares que lhe pertencem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das receitas do rei” ou “do tesouro do rei”. A expressão grega diz literalmente “da conta” ou “do cálculo do rei”.
    reason: lexical_alternative
  - marker: b
    text: A frase final pode se referir a distritos ou localidades de onde os recursos são obtidos; literalmente, “dos lugares que pertencem [a ele]”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Eu também
  rationale: A crase de καί com ἐγώ expressa continuidade e ênfase pessoal; “Eu também” preserva ambas de modo natural em português.
- source_word: δίδωμι
  choice: dou
  rationale: Tradução direta do verbo amplo “dar”; evita especificar indevidamente se a transferência é concessão, doação ou pagamento.
- source_word: κατʼ ἐνιαυτόν
  choice: a cada ano
  rationale: Expressa com clareza o caráter anual e recorrente da entrega.
- source_word: δέκα πέντε χιλιάδας σίκλων ἀργυρίου
  choice: quinze mil siclos de prata
  rationale: Mantém a antiga unidade monetária ou de peso e explicita que se trata de prata.
- source_word: ἀπὸ τοῦ λόγου τοῦ βασιλέως
  choice: retirados da conta do rei
  rationale: λόγος pode designar conta ou apuração financeira. “Conta do rei” conserva a formulação fiscal e sua relativa ambiguidade, enquanto “retirados” torna clara a ideia de procedência indicada por ἀπό.
- source_word: ἀπὸ τῶν τόπων τῶν ἀνηκόντων
  choice: provenientes dos lugares que lhe pertencem
  rationale: τόποι indica lugares ou distritos como fonte dos recursos; “lhe” explicita, a partir do contexto régio, o referente implícito de ἀνηκόντων sem transformar os lugares em uma categoria administrativa mais específica do que o grego.
