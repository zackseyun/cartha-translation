base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/072.yaml
  text: Ask and learn who I am and who the rest are who are helping us; and they say[a], ‘You have no place to stand before us, because your fathers were routed twice in their own land.’
translation:
  language: pt
  text: 'Pergunte e descubra quem eu sou e quem são os outros que nos ajudam. Eles dizem[a]: “Vocês não têm onde firmar os pés diante de nós, pois os seus antepassados foram postos em fuga duas vezes na própria terra deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Não há para vocês posição de pé diante de nossa face”. A expressão indica que eles não conseguiriam manter sua posição diante dos adversários.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρώτησον καὶ μάθε
  choice: Pergunte e descubra
  rationale: 'Os dois imperativos singulares formam uma sequência: buscar informação e então obtê-la. “Pergunte e descubra” é natural em português e mantém essa progressão.'
- source_word: οἱ λοιποὶ οἱ βοηθοῦντές ἡμῖν
  choice: os outros que nos ajudam
  rationale: “Os outros” traduz λοιποί sem especificar além do texto, e “ajudam” conserva o sentido ativo de βοηθοῦντες sem acrescentar uma função militar explícita.
- source_word: λέγουσιν
  choice: Eles dizem
  rationale: Mantém o presente vívido e o sujeito plural indefinido do grego.
- source_word: Οὐκ ἔστιν ὑμῖν στάσις ποδὸς κατὰ πρόσωπον ἡμῶν
  choice: Vocês não têm onde firmar os pés diante de nós
  rationale: Conserva a imagem de “pé” e a ideia de não conseguir manter posição diante do adversário, em formulação compreensível e idiomática em português.
- source_word: δὶς ἐτροπώθησαν
  choice: foram postos em fuga duas vezes
  rationale: No contexto militar, o passivo indica que foram rechaçados ou obrigados a fugir. A escolha preserva a força concreta do verbo melhor que o mais genérico “foram derrotados”.
- source_word: οἱ πατέρες σου
  choice: os seus antepassados
  rationale: Aqui πατέρες tem sentido ancestral. “Antepassados” comunica isso claramente ao leitor moderno; “seus” corresponde à referência singular do grego, embora em português também possa servir a um grupo.
- source_word: ἐν τῇ γῇ αὐτῶν
  choice: na própria terra deles
  rationale: 'Torna clara a força possessiva e enfática: a derrota ocorreu até mesmo no território pertencente aos antepassados.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. O discurso mantém o tom de provocação militar. O plural “vocês” traduz ὑμῖν, enquanto “seus antepassados” permite a referência ao interlocutor singular de σου sem produzir uma mudança pronominal artificial em português.
