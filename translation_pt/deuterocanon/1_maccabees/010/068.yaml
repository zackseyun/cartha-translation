lexical_decisions:
- source_word: ἤκουσεν
  choice: soube disso
  rationale: No contexto narrativo, o aoristo de ἀκούω indica que Alexandre recebeu a notícia. “Soube disso” é natural em português e explicita apenas o referente implícito no grego.
- source_word: ἐλυπήθη σφόδρα
  choice: ficou profundamente angustiado
  rationale: O passivo de λυπέω pode expressar tristeza, aflição ou angústia; “angustiado” preserva essa amplitude emocional, e “profundamente” comunica a intensidade de σφόδρα.
- source_word: ἀπέστρεψεν εἰς Ἀντιόχειαν
  choice: voltou para Antioquia
  rationale: Neste uso narrativo, ἀποστρέφω descreve o retorno a um lugar; a formulação escolhida é direta e idiomática em português.
- source_word: Ἀλέξανδρος ὁ βασιλεύς
  choice: o rei Alexandre
  rationale: A ordem portuguesa “o rei Alexandre” corresponde naturalmente à construção nominal grega sem alterar a identificação da personagem.
