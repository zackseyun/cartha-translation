  text: And those in the city[a], being afraid, opened the gates, and Jonathan took control of Joppa.
translation:
  language: pt
  text: Os que estavam na cidade, com medo, abriram os portões[a], e Jônatas tomou o controle de Jope.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou apenas «abriram»; o grego não diz explicitamente «os portões», embora isso provavelmente esteja implícito no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθέντες
  choice: com medo
  rationale: O particípio aoristo passivo tem aqui sentido intransitivo e circunstancial; a formulação expressa naturalmente o estado que motivou a ação, sem exagerar sua intensidade.
- source_word: ἤνοιξαν
  choice: abriram os portões
  rationale: O grego diz apenas «abriram», mas o contexto militar de uma cidade implica provavelmente os portões. A explicitação torna a frase natural em português, e a nota preserva a ausência do objeto no original.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: os que estavam na cidade
  rationale: Embora a expressão seja literalmente «os da cidade», o sentido contextual é o das pessoas que se encontravam dentro dela. Esta forma é natural e não especifica gênero nem grupo além do que o grego permite.
- source_word: ἐκυρίευσεν
  choice: tomou o controle de
  rationale: κυριεύω indica alcançar domínio ou controle. A escolha comunica o resultado político-militar sem restringi-lo necessariamente à ideia de captura pela força.
- source_word: Ἰόππης
  choice: Jope
  rationale: «Jope» é a forma portuguesa tradicional e amplamente reconhecida do topônimo grego Ἰόππη.
