base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/067.yaml
  text: And in the one hundred sixty-fifth year[a], Demetrius the son of Demetrius came from Crete into the land of his fathers.
translation:
  language: pt
  text: No ano cento e sessenta e cinco, Demétrio, filho de Demétrio, veio de Creta para a terra de seus antepassados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a terra de seus pais», expressão que se refere à terra de seus antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔτει πέμπτῳ καὶ ἑξηκοστῷ καὶ ἑκατοστῷ
  choice: No ano cento e sessenta e cinco
  rationale: A expressão grega apresenta a data pela soma dos numerais, literalmente «no ano quinto, sexagésimo e centésimo». A formulação portuguesa conserva o ano da era selêucida em ordem natural e clara.
- source_word: ἦλθεν
  choice: veio
  rationale: O verbo narrativo comum indica movimento até o destino introduzido por εἰς. «Veio» preserva essa perspectiva sem acrescentar a ideia mais específica de chegada.
- source_word: Δημήτριος ὁ υἱὸς Δημητρίου
  choice: Demétrio, filho de Demétrio
  rationale: Os nomes são apresentados em sua forma portuguesa tradicional, e a aposição grega é reproduzida com a fórmula genealógica natural «filho de».
- source_word: ἐκ Κρήτης
  choice: de Creta
  rationale: ἐκ indica a procedência; «de Creta» é a expressão portuguesa direta e idiomática.
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: para a terra de seus antepassados
  rationale: «Terra» preserva o sentido territorial amplo de γῆ. «Antepassados» comunica naturalmente o valor ancestral do plural πατέρων, cujo sentido literal é esclarecido em nota; «para» expressa em português corrente o movimento em direção ao território.
