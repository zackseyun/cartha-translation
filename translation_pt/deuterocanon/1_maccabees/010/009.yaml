revisions:
- from: E os que estavam na cidadela entregaram os reféns a Jônatas[a], e ele os devolveu aos pais deles.
  to: E os da cidadela[a] entregaram os reféns a Jônatas e os devolveram a seus pais.
  rationale: A revisão restaura o plural explícito de ἀπέδωκαν e representa com maior precisão a expressão οἱ ἐκ τῆς ἄκρας. Também reposiciona a chamada da nota junto de «cidadela», o termo histórico que ela esclarece. A vírgula antes de «e» foi omitida por ser dispensável em uma coordenação simples em português.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:19:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Revisão necessária: οἱ ἐκ τῆς ἄκρας é mais bem expresso por «os da cidadela» do que por «os que estavam na cidadela», pois a construção identifica o grupo por sua ligação/origem na cidadela, não apenas por uma localização momentânea. Sobretudo, ἀπέδωκαν está no plural e seu sujeito gramatical é o mesmo grupo que entregou os reféns; o texto não autoriza mudar o sujeito para Jônatas no singular.'
  naturalness: «Os da cidadela» é conciso, natural e claro no registro narrativo. «Os devolveram a seus pais» preserva a referência aos reféns sem a repetição desnecessária de «deles».
  terminology: «Cidadela», «reféns», «Jônatas» e «pais» são escolhas adequadas. A nota cultural deve estar ancorada em «cidadela», termo que ela explica, e não no nome Jônatas.
  issues:
  - severity: high
    issue: O segundo verbo foi vertido no singular («ele os devolveu»).
    rationale: O original lê ἀπέδωκαν, terceira pessoa do plural. Embora a trilha inglesa adote «he returned», essa leitura não corresponde à flexão do texto grego fornecido. A tradução deve preservar o sujeito plural sem introduzir Jônatas como sujeito.
  - severity: medium
    issue: «Os que estavam na cidadela» enfraquece o sentido de οἱ ἐκ τῆς ἄκρας.
    rationale: ἐκ marca procedência/associação a partir da cidadela; «os da cidadela» reproduz essa identificação de modo idiomático, sem acrescentar uma afirmação de permanência momentânea.
  - severity: low
    issue: A âncora da nota está em «Jônatas», mas a nota explica ἄκρα/cidadela.
    rationale: A âncora deve acompanhar o elemento textual a que a nota se refere.
  revised_text: E os da cidadela[a] entregaram os reféns a Jônatas e os devolveram a seus pais.
  revised_footnotes:
  - marker: a
    text: O termo grego ἄκρα refere-se à cidadela fortificada, tradicionalmente chamada de Acra.
