  text: And those from the citadel handed over the hostages to Jonathan[a], and he returned them to their parents.
translation:
  language: pt
  text: E os da cidadela[a] entregaram os reféns a Jônatas e os devolveram a seus pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego ἄκρα refere-se à cidadela fortificada, tradicionalmente chamada de Acra.
    reason: cultural_note
lexical_decisions:
- source_word: παρέδωκαν
  choice: entregaram
  rationale: O verbo indica entregar ou passar alguém à custódia de outro; «entregaram» é natural e preserva o sentido direto da ação.
- source_word: οἱ ἐκ τῆς ἄκρας
  choice: os que estavam na cidadela
  rationale: A expressão designa o grupo associado à fortaleza; em português, «estavam na cidadela» comunica naturalmente a localização contextual sem especificar além do grego.
- source_word: Ἰωναθὰν
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: τὰ ὅμηρα
  choice: os reféns
  rationale: ὅμηρα refere-se a pessoas mantidas como garantia, como confirma a devolução delas aos pais.
- source_word: ἀπέδωκαν
  choice: devolveu
  rationale: Embora o grego tenha sujeito plural, o contexto e a referência inglesa auditada entendem Jônatas como sujeito semântico; «devolveu» expressa dar de volta.
- source_word: τοῖς γονεῦσιν αὐτῶν
  choice: aos pais deles
  rationale: γονεῖς significa «pais» no sentido de pai e mãe; «deles» deixa claro que se trata dos pais dos reféns.
