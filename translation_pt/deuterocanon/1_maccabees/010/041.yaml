base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/041.yaml
  text: And all the surplus that they did not pay from the revenues[a], as in the former years[b], from now on they shall give for the works of the house.
translation:
  language: pt
  text: E todo o excedente que não repassaram dos recursos[a], como nos anos anteriores, eles o darão, de agora em diante, para as obras da Casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das verbas”; o termo grego também pode significar literalmente “necessidades” ou “usos”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo.
    reason: cultural_note
lexical_decisions:
- source_word: πλεονάζον
  choice: excedente
  rationale: O particípio substantivado indica aquilo que sobra ou excede o montante ordinariamente utilizado; “excedente” é claro e apropriado ao contexto administrativo.
- source_word: ἀπέδωσαν
  choice: repassaram
  rationale: No contexto fiscal, o verbo exprime a entrega ou remessa de valores devidos. “Repassaram” preserva melhor a ideia administrativa do que o genérico “deram”.
- source_word: χρειῶν
  choice: recursos
  rationale: Embora χρεία possa significar “necessidade” ou “uso”, o contexto financeiro permite entendê-lo como recursos ou verbas. A nota conserva a ambiguidade lexical.
- source_word: ἐν τοῖς πρώτοις ἔτεσιν
  choice: nos anos anteriores
  rationale: Aqui πρῶτος contrasta o período anterior com a nova disposição; “anteriores” é mais natural do que o literal “primeiros”.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: Mantém o plural grego e abrange projetos, construção ou reparos sem especificar mais do que o texto.
- source_word: τοῦ οἴκου
  choice: da Casa
  rationale: Preserva a designação reverencial e tradicional do templo como “a Casa”; a inicial maiúscula ajuda o leitor a reconhecer o referente sem substituí-lo no texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação administrativa natural. “Casa” conserva a expressão bíblica para o templo, esclarecida em nota. Os marcadores foram posicionados junto aos termos que efetivamente explicam.
