base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/037.yaml
  text: And some of them shall be appointed in the king’s great strongholds[a], and from among them some shall be appointed over the needs of the kingdom, being trustworthy; and let those over them and the rulers be from among them, and let them live by their own laws[b], just as the king commanded in the land of Judah.
translation:
  language: pt
  text: Alguns deles serão designados para as grandes fortalezas do rei; e, dentre eles, serão designados homens de confiança para cuidar das necessidades do reino.[a] Que os responsáveis por eles e os governantes sejam dentre eles. Que vivam segundo suas próprias leis,[b] conforme o rei ordenou na terra de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para cuidar dos assuntos do reino». A expressão grega pode abranger necessidades, negócios ou responsabilidades administrativas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «que andem segundo suas leis». No idioma grego, «andar» pode significar conduzir a vida de acordo com essas leis.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασταθήσεται
  choice: serão designados
  rationale: O futuro passivo de καθίστημι, neste contexto administrativo e militar, indica nomeação ou atribuição a um posto. O singular grego tem sentido distributivo ou coletivo, expresso naturalmente em português pelo plural indefinido.
- source_word: ὀχυρώμασιν τοῦ βασιλέως τοῖς μεγάλοις
  choice: para as grandes fortalezas do rei
  rationale: ὀχύρωμα designa um lugar fortificado; «fortalezas» preserva com clareza o sentido militar, e «grandes» corresponde diretamente a τοῖς μεγάλοις.
- source_word: ἐπὶ χρειῶν τῆς βασιλείας
  choice: para cuidar das necessidades do reino
  rationale: A expressão indica responsabilidade por necessidades, assuntos ou serviços do reino. «Cuidar das necessidades» mantém a imagem lexical e torna explícita apenas a relação administrativa indicada por ἐπί.
- source_word: οὖσιν εἰς πίστιν
  choice: homens de confiança
  rationale: Neste contexto de serviço real, πίστις descreve confiabilidade, não a fé em sentido teológico. A formulação portuguesa é idiomática e adequada à função administrativa.
- source_word: οἱ ἐπʼ αὐτῶν
  choice: os que estiverem no comando deles
  rationale: A expressão comprimida se refere aos superiores postos sobre os nomeados. Esta tradução comunica a relação hierárquica sem definir uma função específica não indicada pelo grego.
- source_word: οἱ ἄρχοντες
  choice: os governantes
  rationale: Ἄρχοντες é um termo amplo para autoridades ou dirigentes; «governantes» preserva o registro oficial do decreto.
- source_word: ἐξ αὐτῶν ἔστωσαν
  choice: deverão ser escolhidos dentre eles mesmos
  rationale: O imperativo de εἰμί exige que essas autoridades procedam do próprio grupo. «Escolhidos» explicita no português a nomeação implícita no contexto, sem indicar quem faz a escolha.
- source_word: πορευέσθωσαν τοῖς νόμοις αὐτῶν
  choice: viverão segundo suas próprias leis
  rationale: O verbo πορεύομαι, construído com «leis», descreve conduzir a vida de acordo com elas. «Viver segundo» reproduz naturalmente o sentido do idioma grego.
- source_word: καθὰ καὶ προσέταξεν
  choice: conforme o rei ordenou
  rationale: Προστάσσω indica ordem ou determinação oficial; «ordenou» preserva a autoridade do decreto.
- source_word: ἐν γῇ Ἰούδα
  choice: na terra de Judá
  rationale: Tradução direta da expressão grega, evitando substituí-la pelo nome regional mais interpretativo «Judeia».
theological_decisions:
- issue: Sentido de πίστις em contexto administrativo
  choice: homens de confiança
  alternative: homens fiéis
  rationale: A expressão οὖσιν εἰς πίστιν qualifica a aptidão para o serviço do reino. O contexto requer confiabilidade funcional, e não uma referência à fé religiosa.
- issue: Autonomia legal do grupo nomeado
  choice: viverão segundo suas próprias leis
  alternative: andarão segundo suas leis
  rationale: A tradução mantém a afirmação de que eles regerão sua conduta por suas próprias leis, sem especificar o alcance dessa autonomia além do que o texto declara.
translation_notes:
  register: Português moderno, digno e acessível, com cadência de decreto real. Preferiu-se «fortalezas», «homens de confiança» e «viverão segundo» por clareza contemporânea, preservando em notas as alternativas lexicais genuínas. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
