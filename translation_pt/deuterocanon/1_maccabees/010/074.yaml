base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/074.yaml
  text: But when Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem, and Simon his brother met him to help him.
translation:
  language: pt
  text: Mas, quando Jônatas ouviu as palavras de Apolônio, ficou agitado em seu íntimo[a]. Então escolheu dez mil homens, saiu de Jerusalém, e seu irmão Simão foi ao encontro dele para ajudá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi movido em seu íntimo” ou “ficou provocado em seu íntimo”. O grego descreve uma agitação ou reação interior sem especificar exatamente a emoção.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Mas, quando ... ouviu
  rationale: Ὡς com o aoristo introduz a circunstância temporal, e δέ marca uma transição narrativa leve; a formulação é natural e mantém ambos os valores.
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: as palavras de Apolônio
  rationale: Mantém o sentido concreto de λόγοι como as declarações ou o desafio verbal de Apolônio, sem reduzir a expressão a uma interpretação específica.
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: ficou agitado em seu íntimo
  rationale: A construção descreve movimento ou agitação interior sem identificar com precisão a emoção. “Em seu íntimo” comunica naturalmente o âmbito mental/interior e evita sugerir apenas ira.
- source_word: ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν
  choice: escolheu dez mil homens
  rationale: Tradução direta e clara, preservando ἀνδρῶν como “homens” sem acrescentar explicitamente “soldados”.
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: saiu de Jerusalém
  rationale: Reproduz o verbo comum de movimento sem introduzir a ideia mais específica de marcha militar.
- source_word: συνήντησεν αὐτῷ
  choice: foi ao encontro dele
  rationale: Expressa de modo idiomático que Simão veio encontrar Jônatas; no contexto, evita a possível impressão de um encontro casual.
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: para ajudá-lo
  rationale: Comunica com clareza a finalidade da ida de Simão ao encontro de Jônatas.
