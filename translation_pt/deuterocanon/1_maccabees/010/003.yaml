  yaml_path: translation/deuterocanon/1_maccabees/010/003.yaml
  text: And Demetrius sent letters to Jonathan with peaceful words[b][a], so as to honor him.
translation:
  language: pt
  text: E Demétrio enviou cartas a Jônatas em termos pacíficos[a], a fim de honrá-lo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com palavras de paz”. A expressão grega pode ser traduzida mais literalmente dessa maneira.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “torná-lo grande”; isto é, conferir-lhe honra ou elevar sua posição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Forma natural e direta em português para o aoristo de ἀποστέλλω, adequada ao envio de correspondência.
- source_word: ἐπιστολὰς
  choice: cartas
  rationale: O acusativo plural indica várias cartas ou comunicações escritas; “cartas” preserva claramente esse número.
- source_word: λόγοις εἰρηνικοῖς
  choice: em termos pacíficos
  rationale: Expressa de modo idiomático o caráter ou conteúdo conciliador das cartas, preservando em nota a formulação mais literal.
- source_word: ὥστε
  choice: a fim de
  rationale: No contexto, introduz a finalidade pretendida por Demétrio, e não apenas um resultado.
- source_word: μεγαλῦναι
  choice: honrá-lo
  rationale: Embora signifique literalmente “torná-lo grande”, no contexto político indica conferir honra, prestígio ou posição elevada a Jônatas.
- source_word: Ἰωναθὰν
  choice: Jônatas
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
