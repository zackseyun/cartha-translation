base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/058.yaml
  text: And King Alexander met him and gave him Cleopatra his daughter[a], and he held her wedding in Ptolemais, as kings do[b], with great splendor.
translation:
  language: pt
  text: O rei Alexandre foi ao encontro dele e lhe deu em casamento sua filha Cleópatra; celebrou o casamento dela em Ptolemaida, como fazem os reis[a], com grande esplendor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à maneira dos reis» ou «como os reis costumam fazer».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήντησεν
  choice: foi ao encontro
  rationale: Expressa o sentido comum do verbo, que pode incluir o movimento de sair ou ir para encontrar alguém, sem acrescentar a ideia menos segura de recebê-lo formalmente.
- source_word: ἐξέδοτο
  choice: deu em casamento
  rationale: No contexto matrimonial, o verbo significa dar uma mulher em casamento. A explicitação é natural em português e evita que «deu» pareça mera entrega ou presente.
- source_word: Κλεοπάτραν τὴν θυγατέρα αὐτοῦ
  choice: sua filha Cleópatra
  rationale: A ordem é idiomática em português e preserva claramente a relação familiar indicada pela aposição grega.
- source_word: ἐποίησεν τὸν γάμον αὐτῆς
  choice: celebrou o casamento dela
  rationale: A combinação de ποιέω com γάμος designa realizar ou celebrar o casamento, possivelmente incluindo a festa; a formulação mantém o sentido amplo do evento.
- source_word: ἐν Πτολεμαΐδι
  choice: em Ptolemaida
  rationale: Forma portuguesa tradicional e reconhecível do topônimo grego Πτολεμαΐς.
- source_word: καθὼς οἱ βασιλεῖς
  choice: como fazem os reis
  rationale: Reproduz de modo natural a comparação com o costume ou a maneira régia, sem especificar além do grego.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: com grande esplendor
  rationale: Neste contexto cerimonial, δόξα aponta para magnificência, honra e ostentação régia, não primariamente para «glória» em sentido teológico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Deu em casamento» torna explícito o valor matrimonial de ἐξέδοτο; «celebrou o casamento» evita reduzir γάμος apenas à cerimônia ou apenas à festa. O marcador [a] aparece no texto principal.
