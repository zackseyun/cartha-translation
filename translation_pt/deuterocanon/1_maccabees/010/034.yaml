base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/034.yaml
  text: And let all the festivals and the Sabbaths and the new moons and the appointed days[a], and the three days before a festival and the three days after a festival, all be days of tax exemption and release for all the Jews who are in all my kingdom.
translation:
  language: pt
  text: Que todas as festas, os sábados, as luas novas, os dias determinados, os três dias antes de cada festa e os três dias depois dela sejam dias de isenção de impostos e de dispensa[a] para todos os judeus que vivem em todo o meu reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “remissão” ou “perdão”. O termo grego pode indicar liberação de obrigações e, neste contexto, provavelmente se refere a uma dispensa administrativa concedida nesses dias.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑορταὶ
  choice: festas
  rationale: Expressa celebrações festivas ou dias de festa em linguagem portuguesa corrente e digna.
- source_word: σάββατα
  choice: sábados
  rationale: Mantém o plural e a referência direta às observâncias sabáticas judaicas.
- source_word: νουμηνίαι
  choice: luas novas
  rationale: É a designação tradicional e concisa das observâncias ligadas ao início do mês lunar.
- source_word: ἡμέραι ἀποδεδειγμέναι
  choice: dias determinados
  rationale: Comunica que esses dias foram oficialmente designados, sem especificar por quem ou para qual finalidade além do que o texto declara.
- source_word: ἔστωσαν
  choice: sejam
  rationale: Preserva a força imperativa do decreto real em português natural.
- source_word: ἀτελείας
  choice: isenção de impostos
  rationale: No contexto administrativo, o termo indica imunidade de impostos, tributos ou encargos; a formulação escolhida é clara para o leitor moderno.
- source_word: ἀφέσεως
  choice: dispensa
  rationale: Conserva o sentido administrativo amplo de liberação de obrigações sem introduzir a ideia especificamente teológica de perdão de pecados.
- source_word: πᾶσι τοῖς Ἰουδαίοις
  choice: para todos os judeus
  rationale: Representa naturalmente o dativo que identifica os beneficiários do decreto.
- source_word: τοῖς οὖσιν ἐν πάσῃ τῇ βασιλείᾳ μου
  choice: que vivem em todo o meu reino
  rationale: Transmite que a concessão abrange os judeus situados em qualquer parte do reino.
theological_decisions:
- issue: Sentido de ἀφέσεως no contexto de um decreto real
  choice: dispensa
  alternative: remissão ou perdão
  rationale: O contexto trata de privilégios civis concedidos em dias sagrados, não diretamente do perdão de pecados. “Dispensa” preserva o sentido de liberação de obrigações, enquanto a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição grega foi levemente organizada por meio de “cada festa” e “depois dela”, sem alterar o alcance do decreto. O marcador foi colocado junto a “dispensa”, termo ao qual a nota lexical se refere.
