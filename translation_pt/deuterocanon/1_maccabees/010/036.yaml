  yaml_path: translation/deuterocanon/1_maccabees/010/036.yaml
  text: And let up to thirty thousand men from the Jews be enrolled in the king’s forces[a], and provisions shall be given to them, as is fitting for all the king’s forces.
translation:
  language: pt
  text: E sejam alistados, dentre os judeus, até trinta mil homens nas forças do rei; e lhes serão dadas provisões[a], como convém a todas as forças do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «rações» ou «sustento»; mais literalmente, «hospitalidade». Aqui, o grego ξενιά indica o apoio material fornecido às tropas.
    reason: lexical_alternative
lexical_decisions:
- source_word: προγραφήθήτωσαν
  choice: sejam alistados
  rationale: O imperativo passivo indica inscrição oficial para o serviço; «alistados» expressa com naturalidade o contexto militar e administrativo.
- source_word: τῶν Ἰουδαίων
  choice: dentre os judeus
  rationale: 'A expressão tem sentido partitivo: os homens seriam selecionados da população judaica.'
- source_word: εἰς τὰς δυνάμεις τοῦ βασιλέως
  choice: nas forças do rei
  rationale: δυνάμεις designa aqui as forças militares, sem exigir a ideia de vários exércitos independentes.
- source_word: εἰς τριάκοντα χιλιάδας ἀνδρῶν
  choice: até trinta mil homens
  rationale: Com o numeral, εἰς indica o limite de trinta mil; ἀνδρῶν refere-se especificamente a homens no contexto de recrutamento militar.
- source_word: δοθήσεται αὐτοῖς ξενιά
  choice: lhes serão dadas provisões
  rationale: O futuro passivo mantém o caráter de determinação oficial, e ξενιά, neste contexto, denota o sustento fornecido às tropas.
- source_word: ὡς καθῆκει
  choice: como é devido
  rationale: A expressão comunica aquilo que cabe ou é apropriado segundo a prática estabelecida, preservando o tom formal.
- source_word: πάσαις ταῖς δυνάμεσιν τοῦ βασιλέως
  choice: a todas as forças do rei
  rationale: O dativo indica a quem esse sustento normalmente é devido; a formulação preserva o sentido militar de δυνάμεις.
