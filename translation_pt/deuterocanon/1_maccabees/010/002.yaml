  text: And King Demetrius heard, and he gathered very many forces, and went out to meet him in battle.
translation:
  language: pt
  text: Quando o rei Demétrio soube disso, reuniu forças muito numerosas e saiu ao encontro dele para a batalha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube disso
  rationale: No contexto, o aoristo de ἀκούω indica que Demétrio recebeu a notícia mencionada anteriormente. «Soube disso» é natural em português e explicita apenas o referente contextual implícito.
- source_word: συνήγαγεν
  choice: reuniu
  rationale: Traduz diretamente a ideia de ajuntar ou congregar, sem especificar além do grego o procedimento militar.
- source_word: δυνάμεις
  choice: forças
  rationale: No contexto militar, o plural designa contingentes ou forças armadas; «forças» preserva tanto a amplitude quanto o número do termo grego.
- source_word: πολλὰς σφόδρα
  choice: muito numerosas
  rationale: A expressão intensifica a quantidade. «Muito numerosas» reproduz essa ênfase com linguagem portuguesa natural e digna.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Mantém o sentido básico de sair, sem acrescentar a noção mais específica de marchar.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: ao encontro dele
  rationale: Reproduz de modo natural o movimento para encontrar a pessoa mencionada; a frase seguinte deixa claro que se trata de um encontro hostil.
- source_word: εἰς πόλεμον
  choice: para a batalha
  rationale: Expressa a finalidade militar do encontro. «Para a batalha» é idiomático e preserva o sentido sem ampliar para uma campanha de guerra inteira.
