  text: And no one will have authority to act against or harass any of them in any matter.
translation:
  language: pt
  text: E ninguém terá autoridade nem para agir contra nem para importunar qualquer um deles, em qualquer assunto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para tomar medidas contra ou importunar qualquer um deles, em qualquer matéria”.'
    reason: πρᾶξαι é amplo e pode referir-se a agir ou tomar medidas; περὶ παντὸς πράγματος significa “em qualquer assunto/matéria”.
lexical_decisions:
- source_word: οὐχ ἕξει ἐξουσίαν οὐδεὶς
  choice: ninguém terá autoridade
  rationale: Reproduz diretamente a negação e o sentido jurídico de ἐξουσία no contexto de um decreto real.
- source_word: πρᾶξαι
  choice: fazer cobranças a
  rationale: No contexto imediato de isenções fiscais e imunidades, πράσσω pode ter o sentido administrativo de exigir ou cobrar pagamentos. Esta leitura também explica naturalmente a pessoa indicada por τινα αὐτῶν como alvo da cobrança, sem limitar a tradução a um tributo específico não expresso neste versículo.
- source_word: παρενοχλεῖν
  choice: importunar
  rationale: Expressa causar incômodo, perturbar ou interferir de modo hostil, em registro digno e atual, sem as conotações modernas inadequadas que certos cognatos poderiam sugerir.
- source_word: τινα αὐτῶν
  choice: qualquer um deles / importuná-los
  rationale: Indica qualquer indivíduo do grupo protegido. A retomada pronominal no segundo verbo torna a coordenação natural em português.
- source_word: περὶ παντὸς πράγματος
  choice: por motivo algum
  rationale: 'Transmite idiomaticamente a abrangência absoluta da proibição: nenhuma questão, caso ou motivo poderia servir de fundamento para a cobrança ou perturbação.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e juridicamente adequado ao contexto do decreto. Emprega “ninguém” e “qualquer um deles” para leitura ampla no espaço lusófono, com fluidez brasileira. A nota preserva a ambiguidade real de πρᾶξαι sem sobrecarregar o texto principal.
