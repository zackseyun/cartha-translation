  yaml_path: translation/deuterocanon/1_maccabees/010/078.yaml
  text: And he pursued him to Azotus[a], and the camps joined battle behind him.
translation:
  language: pt
  text: Ele o perseguiu até Azoto, e os exércitos travaram combate atrás dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e os exércitos entraram em combate em seu encalço». O grego repete a expressão «atrás/depois dele», cuja relação exata com o combate é um tanto ambígua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδίωξεν ὀπίσω αὐτοῦ
  choice: o perseguiu
  rationale: A construção grega expressa perseguição ativa em contexto militar. Em português, «o perseguiu» transmite naturalmente o sentido sem a repetição pouco idiomática de «atrás dele».
- source_word: εἰς Ἄζωτον
  choice: até Azoto
  rationale: εἰς indica movimento em direção à cidade e, neste contexto, o ponto alcançado pela perseguição. «Azoto» é a forma tradicional portuguesa do topônimo.
- source_word: συνῆψαν ... εἰς πόλεμον
  choice: travaram combate
  rationale: No contexto militar, συνάπτω com εἰς πόλεμον indica entrar ou engajar-se em combate. A expressão escolhida é clara, concisa e digna em português atual.
- source_word: αἱ παρεμβολαί
  choice: os exércitos
  rationale: Embora o sentido básico seja «acampamentos», o termo designa aqui, por metonímia, as forças acampadas que efetivamente combatem. «Os exércitos» evita a imagem sem sentido de acampamentos lutando e preserva o referente militar.
- source_word: ὀπίσω αὐτοῦ
  choice: atrás dele
  rationale: A segunda ocorrência da expressão pode ter sentido espacial («atrás dele») ou sequencial («depois dele», «em seu encalço»). A tradução mantém a leitura espacial sem eliminar a alternativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. A metonímia militar de «acampamentos» foi vertida como «exércitos», enquanto a ambiguidade da segunda ocorrência de ὀπίσω αὐτοῦ foi preservada por meio de nota.
