  yaml_path: translation/deuterocanon/1_maccabees/010/071.yaml
  text: Now then[a], if you trust in your forces, come down to us in the plain, and let us meet there[b], because with me is the strength of the cities.
translation:
  language: pt
  text: Agora, pois, se você confia nas suas forças, desça até nós na planície, e ali nos enfrentemos[a], pois comigo está a força das cidades[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meçamos forças ali”; a expressão grega pode indicar confronto direto neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “as forças das cidades”. A expressão grega pode referir-se coletivamente ao apoio militar proveniente das cidades.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθας
  choice: confia
  rationale: O perfeito intransitivo exprime confiança firmada; “confia” é claro e natural no contexto do desafio.
- source_word: δυνάμεσίν
  choice: forças
  rationale: No contexto militar, o plural designa forças armadas ou capacidade militar, sentido bem preservado por “forças”.
- source_word: κατάβηθι
  choice: desça até nós
  rationale: Mantém tanto o movimento descendente quanto a orientação em direção a quem fala.
- source_word: πεδίον
  choice: planície
  rationale: Designa terreno plano e aberto, apropriado ao cenário de confronto militar.
- source_word: συγκριθῶμεν ἑαυτοῖς
  choice: nos enfrentemos
  rationale: Neste contexto marcial, a expressão indica confronto direto, não mera comparação; a formulação portuguesa é natural sem especificar além do grego a forma do combate.
- source_word: δύναμις τῶν πόλεων
  choice: a força das cidades
  rationale: Preserva o singular coletivo e a formulação comprimida do grego, sem decidir se se trata especificamente de tropas, recursos ou apoio militar provenientes das cidades.
