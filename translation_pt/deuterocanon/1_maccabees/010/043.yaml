base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/043.yaml
  text: And as for any who flee to the sanctuary in Jerusalem and in all its borders[a], owing royal taxes or any other obligation, let them be released[b], along with everything that belongs to them in my kingdom.
translation:
  language: pt
  text: E todos os que fugirem para o santuário, em Jerusalém e em todo o seu território[a], devendo tributos reais ou qualquer outra obrigação, sejam liberados[b], juntamente com tudo o que lhes pertence no meu reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “buscarem refúgio no templo, em Jerusalém e em todo o território a ele ligado”. Os termos gregos podem designar de modo mais amplo os recintos do templo ou o território associado; “seu” também pode referir-se a Jerusalém.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sejam liberados”, devendo “obrigações reais e qualquer assunto”. A expressão pode incluir tributos, dívidas e outras reivindicações legais.
    reason: alternative_reading
lexical_decisions:
- source_word: φύγωσιν
  choice: fugirem
  rationale: Preserva o sentido básico de movimento e fuga expresso por φεύγω, sem tornar explícita demais a noção contextual de asilo.
- source_word: ἱερὸν
  choice: santuário
  rationale: Abrange o espaço sagrado do templo e não apenas o edifício propriamente dito, adequando-se ao contexto de asilo.
- source_word: ἐν πᾶσιν τοῖς ὁρίοις αὐτοῦ
  choice: para qualquer lugar dentro dos seus limites
  rationale: Expressa a extensão territorial associada ao santuário ou a Jerusalém, preservando a ambiguidade do referente do pronome.
- source_word: βασιλικὰ
  choice: tributos reais
  rationale: Indica obrigações fiscais devidas à coroa, com formulação natural e historicamente apropriada.
- source_word: πᾶν πρᾶγμα
  choice: qualquer outra obrigação
  rationale: No contexto regido por ὀφείλων, pode abranger dívidas, encargos ou reivindicações legais, sem restringir a expressão apenas a débitos financeiros.
- source_word: ἀπολελύσθωσαν
  choice: sejam isentos
  rationale: Transmite a força do imperativo passivo e a liberação das obrigações mencionadas, em linguagem própria de um decreto.
- source_word: πάντα ὅσα ἐστὶν αὐτοῖς
  choice: tudo o que lhes pertence
  rationale: Mantém a amplitude da expressão grega, sem limitá-la explicitamente a uma categoria específica de bens.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: no meu reino
  rationale: Equivalência direta, clara e natural para o domínio territorial do rei.
theological_decisions:
- issue: Alcance do asilo e da remissão ligados ao santuário de Jerusalém
  choice: O decreto isenta de tributos reais e de outras obrigações aqueles que fogem para o santuário e para a área abrangida por seus limites.
  alternative: A isenção poderia referir-se apenas aos tributos, e os “limites” poderiam ser os de Jerusalém, não os do santuário.
  rationale: A construção com ὀφείλων associa tanto βασιλικὰ quanto πᾶν πρᾶγμα às obrigações das quais os refugiados são liberados. O referente de αὐτοῦ e a natureza exata dos limites permanecem ambíguos, por isso a tradução e a nota evitam uma delimitação administrativa excessiva.
translation_notes:
  register: Português moderno, claro e digno, com cadência de decreto real. “Tributos reais” evita a possível leitura contemporânea de “impostos reais” como impostos verdadeiros; “sejam isentos” comunica naturalmente a remissão legal, enquanto a nota preserva a forma mais literal.
