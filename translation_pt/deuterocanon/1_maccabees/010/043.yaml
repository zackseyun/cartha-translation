revisions:
- from: E todos os que fugirem para o santuário em Jerusalém e para qualquer lugar dentro dos seus limites[a], devendo tributos reais ou qualquer outra obrigação, sejam isentos[b], eles e tudo o que lhes pertence no meu reino.
  to: E todos os que fugirem para o santuário, em Jerusalém e em todo o seu território[a], devendo tributos reais ou qualquer outra obrigação, sejam liberados[b], juntamente com tudo o que lhes pertence no meu reino.
  rationale: A revisão preserva a ambiguidade sobre se «seu território» se refere ao santuário ou a Jerusalém, sem converter o território em destino alternativo. «Sejam liberados» conserva a força do decreto e abrange coerentemente as pessoas e seus bens. A nota b foi corrigida para refletir o sentido fiscal de βασιλικά sem restringir πᾶν πρᾶγμα.
