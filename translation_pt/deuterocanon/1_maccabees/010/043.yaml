  naturalness: O registro é claro e apropriado a um decreto real. A reformulação proposta conserva essa clareza e elimina a construção pouco fiel «para qualquer lugar dentro dos seus limites».
  terminology: «Santuário», «tributos reais», «qualquer outra obrigação» e «meu reino» são escolhas adequadas. «Sejam liberados» representa melhor ἀπολελύσθωσαν e permite que a libertação alcance tanto as pessoas quanto seus bens. A nota b deve evitar a glosa imprecisa «coisas reais».
  issues:
