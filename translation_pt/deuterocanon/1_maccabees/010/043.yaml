    issue: «para qualquer lugar dentro dos seus limites» apresenta os limites como destino alternativo ao santuário.
    rationale: ἐν Ἰεροσολύμοις καὶ ἐν πᾶσιν τοῖς ὁρίοις αὐτοῦ qualifica a localização/extensão do santuário; não diz que as pessoas fogem para qualquer lugar dentro desses limites.
