    issue: «sejam isentos» reduz e torna sintaticamente difícil o alcance de ἀπολελύσθωσαν.
    rationale: O imperativo passivo significa serem soltos, liberados ou dispensados; a continuação inclui «tudo o que lhes pertence», para a qual «isentos» não é uma formulação natural.
  - severity: low
