base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/083.yaml
  text: And the cavalry was scattered in the plain[a], and they fled to Azotus and entered Beth-dagon, their idol temple, to save themselves.
translation:
  language: pt
  text: E a cavalaria se dispersou pela planície; eles fugiram para Azoto e entraram em Bet-Dagom, o ídolo deles,[a] para se salvarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o sentido: “o santuário do ídolo deles”. O grego diz literalmente “Bet-Dagom, o ídolo deles”, numa aposição condensada que se refere ao santuário associado ao ídolo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἵππος
  choice: a cavalaria
  rationale: Embora esteja no singular, ἵππος tem sentido coletivo no contexto militar e designa a tropa montada.
- source_word: ἐσκορπίσθη
  choice: se dispersou
  rationale: Reproduz naturalmente o passivo grego e indica que a força montada foi desbaratada e espalhada.
- source_word: ἐν τῷ πεδίῳ
  choice: pela planície
  rationale: πεδίον designa uma extensão de terreno plano e aberto; a preposição portuguesa expressa aqui o espaço ao longo do qual ocorreu a dispersão.
- source_word: ἔφυγον εἰς Ἄζωτον
  choice: eles fugiram para Azoto
  rationale: Mantém a forma grega do topônimo e explicita de modo natural o sujeito plural subentendido após o coletivo singular.
- source_word: Βηθδαγὼν
  choice: Bet-Dagom
  rationale: Translitera o topônimo cultual em forma corrente e legível em português, preservando sua identificação própria.
- source_word: τὸ εἴδωλον αὐτῶν
  choice: o ídolo deles
  rationale: Mantém a aposição comprimida e a avaliação negativa expressa por εἴδωλον, sem inserir no texto principal a palavra 'templo', ausente do grego.
- source_word: τοῦ σωθῆναι
  choice: para se salvarem
  rationale: O infinitivo articular indica finalidade; a forma reflexiva comunica que buscavam refúgio e preservação.
theological_decisions:
- issue: Sentido cultual de εἴδωλον na aposição a Bet-Dagom
  choice: o ídolo deles
  alternative: o templo do ídolo deles
  rationale: A tradução formal preserva a palavra efetivamente usada no grego e sua carga polêmica. Como Bet-Dagom é algo em que se pode entrar, a nota esclarece que se trata do santuário associado ao ídolo, sem resolver silenciosamente a expressão comprimida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura preserva a sequência narrativa e a ambiguidade da aposição grega; a nota fornece a explicitação contextual sem acrescentá-la silenciosamente ao texto.
