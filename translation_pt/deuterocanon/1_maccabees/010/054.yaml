  yaml_path: translation/deuterocanon/1_maccabees/010/054.yaml
  text: and let us establish friendship with him[a]. And now, give me your daughter as a wife, and I will become related by marriage to you[b], and I will give gifts to you and to her worthy of you.
translation:
  language: pt
  text: e estabeleçamos amizade com ele.[a] E agora, dê-me sua filha como esposa, e eu me tornarei seu parente por casamento;[b] darei a você e a ela presentes dignos de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “façamos uma aliança com ele”. O grego diz literalmente “amizade”, que, neste contexto régio, provavelmente inclui uma aliança diplomática.
    reason: lexical_alternative
  - marker: b
    text: Ou “passarei a fazer parte de sua família pelo casamento”. O verbo grego se refere a entrar numa relação de parentesco por meio do casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνστήσωμεν
  choice: estabeleçamos
  rationale: O subjuntivo exortativo expressa uma proposta conjunta; “estabeleçamos” comunica naturalmente a formação da relação.
- source_word: φιλίαν
  choice: amizade
  rationale: Preserva o sentido básico do substantivo grego, sem apagar sua provável dimensão diplomática no contexto régio.
- source_word: δός μοι τὴν θυγατέρα σου εἰς γυναῖκα
  choice: dê-me sua filha como esposa
  rationale: Mantém o teor dinástico e transacional da fórmula matrimonial grega em português claro e atual.
- source_word: ἐπιγαμβρεύσω
  choice: eu me tornarei seu parente por casamento
  rationale: Explicita a entrada numa relação de parentesco por matrimônio, sentido próprio do verbo, sem reduzi-lo apenas ao ato de casar.
- source_word: δόματα
  choice: presentes
  rationale: Traduz o substantivo geral sem acrescentar a especificação contextual possível, mas não expressa, de presentes de casamento.
- source_word: ἄξιά σου
  choice: dignos de você
  rationale: Conserva a referência à dignidade ou posição do interlocutor e a forma pessoal da expressão grega.
