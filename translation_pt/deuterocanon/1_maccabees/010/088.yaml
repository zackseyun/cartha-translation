  yaml_path: translation/deuterocanon/1_maccabees/010/088.yaml
  text: And it happened that when Alexander the king heard these words[a], he added to honoring Jonathan.
translation:
  language: pt
  text: E aconteceu que, quando o rei Alexandre ouviu essas palavras, honrou Jônatas ainda mais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuou a honrar Jônatas”. A expressão grega pode indicar continuidade ou aumento da honra concedida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  choice: E aconteceu que, quando
  rationale: Preserva a fórmula narrativa grega e a transição que ela assinala, com uma construção natural em português.
- source_word: ἤκουσεν
  choice: ouviu
  rationale: Traduz diretamente o aoristo de ἀκούω, sem introduzir a interpretação mais específica de que o rei apenas tomou conhecimento da notícia.
- source_word: τοὺς λόγους τούτους
  choice: essas palavras
  rationale: Mantém o sentido concreto de λόγοι no contexto de palavras ou declarações relatadas; “essa mensagem” seria possível, mas mais interpretativo.
- source_word: προσέθετο δοξάσαι
  choice: passou a honrar ... ainda mais
  rationale: Expressa em português natural a ideia de acréscimo ou intensificação contida na construção προστίθημι com infinitivo, sem recorrer ao pouco idiomático “acrescentou honrar”.
- source_word: δοξάσαι
  choice: honrar
  rationale: No contexto político e régio, δοξάζω indica conferir honra ou distinção, não necessariamente “glorificar” em sentido religioso.
- source_word: τὸν Ἰωναθάν
  choice: Jônatas
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio Ἰωναθάν.
