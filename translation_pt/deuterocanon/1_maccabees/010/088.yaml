  source_fidelity: A tradução de ἤκουσεν, τοὺς λόγους τούτους e δοξάσαι é adequada. Contudo, «passou a honrar ... ainda mais» pode sugerir que Alexandre começou então a honrar Jônatas, nuance que não é expressa por προσέθετο. A construção grega indica que ele acrescentou à honra que já lhe prestava, isto é, honrou-o ainda mais; também pode ser entendida como continuação da honra.
  naturalness: «E aconteceu que, quando...» é uma fórmula narrativa compreensível e condizente com o registro. «Honrou Jônatas ainda mais» é idiomático, conciso e evita a implicação incoativa de «passou a honrar».
  terminology: «Honrar» traduz bem δοξάζω neste contexto régio-político. «Jônatas» é a forma portuguesa estabelecida e adequada.
