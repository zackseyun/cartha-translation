lexical_decisions:
- source_word: μνησθήσεται
  choice: se lembrará
  rationale: Reproduz diretamente o futuro do verbo grego, preservando a ideia de que as ações passadas serão levadas em conta.
- source_word: πάντων τῶν κακῶν
  choice: de todos os males
  rationale: Mantém a amplitude e a força moral de κακά; no contexto, refere-se aos atos nocivos cometidos, sem restringi-los a simples ofensas.
- source_word: συνετελέσαμεν
  choice: cometemos
  rationale: Expressa naturalmente em português a realização dos males mencionados, sem tentar reproduzir de modo artificial a possível nuance prefixal do verbo.
- source_word: ἀδελφοὺς
  choice: irmãos
  rationale: Equivalente direto, preservando a possível referência tanto a irmãos literais quanto a membros do mesmo povo, conforme o contexto.
- source_word: ἔθνος
  choice: nação
  rationale: Representa adequadamente o coletivo nacional ou étnico indicado pelo grego.
