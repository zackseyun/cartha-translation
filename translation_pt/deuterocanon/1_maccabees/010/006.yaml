  yaml_path: translation/deuterocanon/1_maccabees/010/006.yaml
  text: And he gave him authority to gather forces[a], and to make weapons, and for him to be his ally, and he said that the hostages in the citadel should be handed over to him.
translation:
  language: pt
  text: E deu-lhe autoridade para reunir forças, fabricar armas e ser seu aliado; e ordenou que lhe fossem entregues os reféns que estavam na cidadela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na Acra”, a cidadela fortificada de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ἐξουσίαν
  choice: deu-lhe autoridade
  rationale: Expressa uma concessão oficial de direito ou autorização, preservando de perto a construção grega.
- source_word: συναγαγεῖν δυνάμεις
  choice: reunir forças
  rationale: Neste contexto político-militar, δυνάμεις designa forças armadas, não poderes abstratos.
- source_word: κατασκευάζειν ὅπλα
  choice: fabricar armas
  rationale: Com ὅπλα, o verbo pode indicar preparar, produzir ou providenciar armamento; “fabricar armas” é claro e adequado ao contexto.
- source_word: εἶναι αὐτῷ σύμμαχον αὐτόν
  choice: ser seu aliado
  rationale: Mantém a formulação compacta e a relação pronominal do grego sem acrescentar uma identificação ausente no versículo.
- source_word: τὰ ὅμηρα
  choice: os reféns
  rationale: Ὅμηρα refere-se normalmente a pessoas mantidas como garantia política ou militar.
- source_word: ἐν τῇ ἄκρᾳ
  choice: na cidadela
  rationale: Traduz o sentido comum de ἄκρα e mantém em nota a possibilidade de referência específica à Acra de Jerusalém.
- source_word: εἶπεν παραδοῦναι αὐτῷ
  choice: ordenou que lhe fossem entregues
  rationale: O infinitivo depois de εἶπεν tem força diretiva neste contexto; “ordenou” comunica isso naturalmente em português, e a voz passiva preserva o foco nos reféns.
