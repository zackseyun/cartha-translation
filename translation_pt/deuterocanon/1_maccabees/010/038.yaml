base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/038.yaml
  text: And the three districts added to Judea from the territory of Samaria[a], let them be attached to Judea, so as to be reckoned as one[b], so as not to obey any other authority except that of the high priest.
translation:
  language: pt
  text: E os três distritos acrescentados à Judeia, provenientes do território da Samaria[a], sejam incorporados à Judeia, para serem considerados como um só[b] e para não obedecerem a nenhuma outra autoridade, exceto à do sumo sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os três nomos”; νόμος era um termo administrativo helenístico para um distrito ou divisão territorial.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para ficarem sob um só”, isto é, para serem tratados como uma única unidade administrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοὺς
  choice: distritos
  rationale: No contexto administrativo helenístico, νόμος designa uma divisão territorial, não uma lei. “Distritos” transmite esse sentido com clareza em português atual.
- source_word: προστεθέντας / προστεθήτω
  choice: acrescentados / sejam incorporados
  rationale: O particípio descreve a anexação anterior dos distritos, enquanto o imperativo formula o decreto de sua vinculação à Judeia. A variação evita repetição pouco natural sem perder a relação entre as formas gregas.
- source_word: χώρας
  choice: território
  rationale: χώρα indica aqui o domínio territorial da Samaria; “território” se ajusta ao contexto político-administrativo.
- source_word: πρὸς τὸ λογισθῆναι
  choice: para serem considerados
  rationale: A construção expressa finalidade, e λογίζομαι tem aqui o sentido administrativo de considerar ou contabilizar.
- source_word: τοῦ γενέσθαι ὑφʼ ἕνα
  choice: como um só
  rationale: A expressão comprimida significa literalmente algo como “ficarem sob um só”. No contexto, indica unidade administrativa, preservada de modo natural por “como um só” e esclarecida em nota.
- source_word: ὑπακοῦσαι
  choice: obedecerem
  rationale: Mantém o sentido direto de ὑπακούω e concorda naturalmente com os três distritos personificados como unidades sujeitas a uma autoridade.
- source_word: ἄλλης ἐξουσίας
  choice: nenhuma outra autoridade
  rationale: ἐξουσία pode indicar poder ou jurisdição; “autoridade” preserva a amplitude do termo no contexto do decreto.
- source_word: ἀλλʼ ἢ τοῦ ἀρχιερέως
  choice: exceto à do sumo sacerdote
  rationale: O pronome “à” retoma “autoridade”, deixando claro que se trata da jurisdição do sumo sacerdote sem ampliar o alcance teológico da afirmação.
theological_decisions:
- issue: Natureza da função do sumo sacerdote no decreto
  choice: A passagem é traduzida em termos político-administrativos, apresentando os distritos sob a autoridade do sumo sacerdote.
  alternative: Entender a frase como submissão religiosa e civil abrangente ao sumo sacerdote.
  rationale: O contexto imediato trata da incorporação territorial e da jurisdição. A tradução não restringe artificialmente o termo “autoridade”, mas também não introduz uma afirmação teológica mais ampla do que o decreto explicita.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação mantém o tom de decreto e as duas ideias de finalidade do grego, sem tornar a sintaxe excessivamente rígida.
