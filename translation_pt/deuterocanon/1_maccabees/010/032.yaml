base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/032.yaml
  text: I also relinquish the authority over the citadel in Jerusalem[a], and I give it to the high priest, so that he may appoint in it men whom he himself chooses to guard it.
translation:
  language: pt
  text: Também renuncio à autoridade sobre a cidadela de Jerusalém[a] e a entrego ao sumo sacerdote, para que ele designe para ela homens que ele mesmo escolher, a fim de guardá-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Acra de Jerusalém”, usando a transliteração tradicional do nome dessa fortaleza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφίημι
  choice: renuncio
  rationale: No contexto administrativo, indica abrir mão de uma prerrogativa ou controle, não perdoar; “renuncio” expressa com naturalidade a cessão da autoridade.
- source_word: ἐξουσίαν
  choice: autoridade sobre
  rationale: Preserva o sentido jurídico-administrativo de direito ou poder de governar.
- source_word: ἄκρας
  choice: cidadela
  rationale: Designa a fortificação urbana de Jerusalém; “cidadela” comunica claramente o referente, enquanto a transliteração tradicional fica registrada em nota.
- source_word: δίδωμι
  choice: a entrego
  rationale: Expressa a transferência formal da cidadela ao sumo sacerdote e evita a possível impressão de simples doação material.
- source_word: ἀρχιερεῖ
  choice: sumo sacerdote
  rationale: Equivalente português consagrado e adequado ao contexto judaico cultual e político.
- source_word: ὅπως ἂν καταστῇ
  choice: para que ele estabeleça
  rationale: καθίστημι pode indicar colocar, instalar ou designar pessoas para uma função; “estabeleça” preserva tanto a nomeação quanto a colocação no posto.
- source_word: ἄνδρας
  choice: os homens
  rationale: Mantém o plural masculino explícito do grego, apropriado aos encarregados da guarda.
- source_word: οὓς ἂν ἐκλέξηται αὐτός
  choice: que ele mesmo escolher
  rationale: Conserva a ênfase de αὐτός na liberdade pessoal de escolha do sumo sacerdote.
- source_word: τοῦ φυλάσσειν αὐτήν
  choice: para guardá-la
  rationale: Traduz de modo direto a finalidade de proteger e vigiar a cidadela.
theological_decisions:
- issue: Tradução de ἄκρα como nome comum ou topônimo transliterado
  choice: a cidadela
  alternative: a Acra
  rationale: O nome comum torna imediatamente claro que se trata da fortificação de Jerusalém, sem negar a identificação histórica tradicional, preservada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A formulação mantém o tom de decreto administrativo e a ênfase do grego na escolha pessoal feita pelo sumo sacerdote.
