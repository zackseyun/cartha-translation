  text: But in Bethsura some of those who had abandoned the law and the commandments were left behind, for it was a refuge for them.
translation:
  language: pt
  text: Mas, em Betsur, ficaram alguns dos que haviam abandonado a Lei e os mandamentos, pois aquele lugar lhes servia de refúgio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Mas
  rationale: Marca a exceção ou contraste em relação ao contexto anterior com uma conjunção natural em português.
- source_word: ἐν Βεθσούροις
  choice: em Betsur
  rationale: Adota a forma portuguesa concisa do topônimo e preserva a indicação locativa.
- source_word: ὑπελείφθησάν τινες
  choice: ficaram alguns
  rationale: Expressa com naturalidade o sentido passivo de que alguns restaram ou foram deixados no lugar, sem especificar um agente ausente no grego.
- source_word: τῶν καταλειπόντων τὸν νόμον καὶ τὰ προστάγματα
  choice: dos que haviam abandonado a Lei e os mandamentos
  rationale: O particípio indica pessoas que deixaram para trás ou abandonaram a Lei e as determinações; o mais-que-perfeito composto situa essa ação antes de terem ficado em Betsur.
- source_word: φυγαδευτήριον
  choice: refúgio
  rationale: Designa um lugar de abrigo ou asilo; “refúgio” é claro, corrente e adequado ao contexto.
theological_decisions:
- issue: Relação entre “a Lei” e “os mandamentos”
  choice: a Lei e os mandamentos
  alternative: a lei e as ordenanças
  rationale: Mantém os dois termos gregos distintos sem identificar “Lei” com uma formulação denominacional específica; “mandamentos” comunica προστάγματα de modo acessível.
- issue: Voz passiva de ὑπελείφθησαν
  choice: ficaram
  alternative: foram deixados para trás
  rationale: O português idiomático “ficaram” preserva o estado resultante e evita introduzir um agente não expresso, embora a alternativa reproduza mais explicitamente a forma passiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Aquele lugar” explicita naturalmente o referente espacial do pronome grego sem alterar o sentido.
