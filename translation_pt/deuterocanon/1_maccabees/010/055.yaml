  yaml_path: translation/deuterocanon/1_maccabees/010/055.yaml
  text: And King Ptolemy answered, saying, “A good day is this, on which you returned to the land of your fathers and sat on the throne of their kingdom.”
translation:
  language: pt
  text: 'E o rei Ptolemeu respondeu: “Este é um bom dia, no qual você voltou à terra de seus antepassados e se assentou no trono do reino deles.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεκρίθη ... λέγων
  choice: respondeu
  rationale: A fórmula grega introduz uma resposta; em português atual, “respondeu” comunica naturalmente tanto o verbo quanto o particípio redundante “dizendo”.
- source_word: Ἀγαθὴ ἡμέρα
  choice: Este é um bom dia
  rationale: Preserva a ênfase da construção nominal grega e produz uma declaração clara e natural em português.
- source_word: γῆν πατέρων σου
  choice: terra de seus antepassados
  rationale: “Antepassados” expressa o sentido familiar e ancestral de πατέρων sem sugerir apenas os pais imediatos.
- source_word: ἐκάθισας ἐπὶ θρόνου
  choice: se assentou no trono
  rationale: Mantém a imagem régia concreta do grego em registro digno e corrente.
- source_word: βασιλείας αὐτῶν
  choice: reino deles
  rationale: Conserva o referente plural de αὐτῶν, ligado aos antepassados, sem explicitação interpretativa adicional.
