lexical_decisions:
- source_word: ὅπως ὦσιν σὺν ἐμοὶ εἰς βοήθειαν
  choice: a fim de que estejam comigo como auxílio
  rationale: Mantém a finalidade expressa por ὅπως e a construção incomum, mas inteligível, de εἰς βοήθειαν, sem especificar além do grego como seria prestado o auxílio.
- source_word: ἀπέστειλεν αὐτοῖς κατὰ τοὺς λόγους τούτους
  choice: lhes enviou uma mensagem com estas palavras
  rationale: Explicita naturalmente em português o envio de uma comunicação, implícito no contexto epistolar, e reproduz a fórmula que introduz o teor da carta.
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: à nação dos judeus
  rationale: Traduz ἔθνος de modo direto e preserva a designação coletiva do destinatário.
- source_word: χαίρειν
  choice: Saudações!
  rationale: Verte a fórmula epistolar grega idiomaticamente, em vez de usar o sentido lexical isolado de 'alegrar-se'.
