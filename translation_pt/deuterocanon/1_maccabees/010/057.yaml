base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/057.yaml
  text: And Ptolemy went out from Egypt[a], he and Cleopatra his daughter, and came to Ptolemais in the one hundred sixty-second year.
translation:
  language: pt
  text: E Ptolemeu saiu do Egito[a], ele e Cleópatra, sua filha, e chegou a Ptolemaida no ano cento e sessenta e dois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, no ano 162 da era selêucida.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: O aoristo de ἐξέρχομαι significa literalmente “saiu” e, neste contexto de viagem, indica a partida do Egito.
- source_word: αὐτὸς καὶ Κλεοπάτρα ἡ θυγάτηρ αὐτοῦ
  choice: ele e sua filha Cleópatra
  rationale: Mantém a coordenação e a retomada enfática de Ptolemeu sem produzir uma formulação artificial em português.
- source_word: ἦλθεν
  choice: chegou
  rationale: Embora ἔρχομαι possa significar “vir” ou “ir”, diante de um destino geográfico “chegou” expressa com naturalidade o movimento até Ptolemaida.
- source_word: εἰς Πτολεμαΐδα
  choice: a Ptolemaida
  rationale: Com nome de cidade e verbo de chegada, a preposição “a” traduz de modo idiomático o movimento indicado por εἰς.
- source_word: ἔτους δευτέρου καὶ ἑξηκοστοῦ καὶ ἑκατοστοῦ
  choice: no ano cento e sessenta e dois
  rationale: Reproduz em português corrente a fórmula aditiva grega de datação, referente ao 162º ano da era selêucida.
