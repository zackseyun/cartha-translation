base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/060.yaml
  text: And he went with splendor to Ptolemais[a], and met the two kings; and he gave them silver and gold, and many gifts to their friends[c][b], and found favor before them.
translation:
  language: pt
  text: Ele foi com grande esplendor[a] a Ptolemaida e encontrou os dois reis. Deu-lhes prata e ouro e muitos presentes aos amigos[b] deles, e obteve o favor deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com glória” ou “com grande pompa”. A expressão grega descreve uma chegada marcada por honra e magnificência pública.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto de corte helenística, “amigos” também pode designar associados do rei ou cortesãos.
    reason: cultural_note
  - marker: c
    text: Literalmente, “achou favor diante deles”; também pode ser traduzido por “conquistou o favor deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: foi
  rationale: Verbo narrativo simples de movimento; “foi” é direto, natural e não acrescenta uma maneira de viajar que o grego não especifica.
- source_word: μετὰ δόξης
  choice: com grande esplendor
  rationale: No contexto da chegada pública, a expressão comunica magnificência e honra visíveis. “Esplendor” evita uma possível leitura exclusivamente teológica de “glória”; “grande” torna a expressão natural em português.
- source_word: Πτολεμαΐδα
  choice: Ptolemaida
  rationale: Forma portuguesa transliterada do nome grego da cidade.
- source_word: ἀπήντησεν
  choice: encontrou
  rationale: Expressa de modo conciso o encontro com os reis, sem especificar indevidamente que ele saiu para recebê-los.
- source_word: τοῖς δυσὶν βασιλεῦσιν
  choice: os dois reis
  rationale: Reproduz diretamente o numeral e identifica o par já presente no contexto.
- source_word: ἔδωκεν
  choice: deu
  rationale: Mantém o sentido comum do verbo. A repetição na segunda oração esclarece em português os diferentes destinatários dos bens.
- source_word: ἀργύριον καὶ χρυσίον
  choice: prata e ouro
  rationale: Equivalentes diretos dos termos gregos para os dois materiais preciosos.
- source_word: τοῖς φίλοις αὐτῶν
  choice: aos amigos deles
  rationale: Preserva o sentido básico de φίλοι e a referência aos associados dos reis, sem converter silenciosamente o termo em um título oficial.
- source_word: δόματα πολλά
  choice: muitos presentes
  rationale: “Presentes” é natural no contexto diplomático e distingue estes itens da prata e do ouro dados aos reis.
- source_word: εὗρεν χάριν ἐναντίον αὐτῶν
  choice: obteve o favor dos reis
  rationale: Comunica em português corrente a expressão idiomática grega. A explicitação de “dos reis” evita que o pronome pareça referir-se aos amigos mencionados imediatamente antes.
