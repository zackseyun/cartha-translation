lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu
  rationale: O aoristo de γράφω tem aqui o sentido direto de “escreveu”; alternativas como “redigiu” acrescentariam uma nuance desnecessária.
- source_word: ἐπιστολὰς
  choice: cartas
  rationale: O acusativo plural indica claramente mais de uma carta. “Cartas” é natural no português atual e preserva o número do grego.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo de ἀποστέλλω é expresso naturalmente por “enviou”, sem o peso estilístico de “despachou”.
- source_word: αὐτῷ
  choice: a ele
  rationale: O pronome dativo significa “a ele”. A tradução mantém o pronome em vez de explicitar um nome que o grego não repete.
