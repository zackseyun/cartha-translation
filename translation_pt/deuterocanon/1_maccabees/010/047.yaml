  yaml_path: translation/deuterocanon/1_maccabees/010/047.yaml
  text: And they were pleased with Alexander[a], because he had become for them the initiator of peaceful terms, and they fought alongside him all the days.
translation:
  language: pt
  text: Eles ficaram satisfeitos com Alexandre, porque ele havia se tornado, para eles, o iniciador de propostas de paz[a]; e continuaram lutando ao lado dele por todo aquele tempo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o líder em palavras de paz” ou “o promotor de negociações de paz”. A expressão grega é condensada e provavelmente apresenta Alexandre como aquele que tomou a iniciativa de fazer propostas conciliatórias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν ἐν Ἀλεξάνδρῳ
  choice: ficaram satisfeitos com Alexandre
  rationale: Expressa de modo natural a disposição favorável e a aprovação indicadas por εὐδοκέω com ἐν, sem sugerir um ato formal de ratificação.
- source_word: ἐγένετο
  choice: havia se tornado
  rationale: Conserva a ideia de mudança ou chegada a uma condição e se ajusta à relação temporal da oração explicativa.
- source_word: ἀρχηγὸς λόγων εἰρηνικῶν
  choice: o iniciador de propostas de paz
  rationale: No contexto diplomático, ἀρχηγός indica aquele que toma a iniciativa, enquanto λόγοι εἰρηνικοί se refere provavelmente a propostas ou negociações conciliatórias. A formulação mantém a expressão um pouco incomum sem recorrer a uma literalidade obscura.
- source_word: συνεμάχουν αὐτῷ
  choice: continuaram lutando ao lado dele
  rationale: O verbo composto indica participação militar conjunta. O imperfeito é representado por “continuaram lutando”, destacando a ação prolongada.
- source_word: πάσας τὰς ἡμέρας
  choice: por todo aquele tempo
  rationale: Reproduz naturalmente o valor durativo do idiomatismo grego e evita a possível impressão de que combatiam literalmente a cada dia.
