base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/049.yaml
  text: And the two kings joined battle[a], and Demetrius's camp fled, and Alexander pursued him and prevailed over them.
translation:
  language: pt
  text: Os dois reis travaram batalha, e as tropas de Demétrio fugiram. Alexandre o perseguiu e prevaleceu sobre elas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “o acampamento de Demétrio fugiu; Alexandre o perseguiu e prevaleceu sobre eles”. A passagem do singular (“o”) para o plural (“eles”) provavelmente descreve a perseguição de Demétrio como comandante e a vitória sobre suas forças.'
    reason: A nota preserva a metonímia de “acampamento” e a mudança de número nos pronomes gregos, ambas difíceis de reproduzir com naturalidade no texto principal.
lexical_decisions:
- source_word: συνῆψαν πόλεμον
  choice: travaram batalha
  rationale: A expressão idiomática indica que os reis entraram em combate. “Travaram batalha” é natural em português e conserva o sentido militar sem ampliar para uma guerra inteira.
- source_word: οἱ δύο βασιλεῖς
  choice: os dois reis
  rationale: Tradução direta do sujeito explícito, com a mesma ênfase nos dois soberanos.
- source_word: ἡ παρεμβολὴ Δημητρίου
  choice: as tropas de Demétrio
  rationale: παρεμβολή significa literalmente “acampamento”, mas, neste contexto de batalha e fuga, designa por metonímia a força acampada. “As tropas” comunica naturalmente esse referente em português; a forma literal é registrada na nota.
- source_word: ἔφυγεν
  choice: fugiram
  rationale: O verbo afirma simplesmente a fuga, sem acrescentar a ideia mais forte de que as tropas foram completamente desbaratadas.
- source_word: ἐδίωξεν αὐτόν
  choice: o perseguiu
  rationale: O pronome grego está no singular masculino e, de modo mais natural, retoma Demétrio, comandante das forças mencionadas.
- source_word: ἴσχυσεν ἐπʼ αὐτούς
  choice: prevaleceu sobre elas
  rationale: A expressão indica superioridade ou vitória sobre os adversários sem exigir a noção de derrota total. Em português, “elas” explicita como referente as tropas de Demétrio, correspondendo ao plural grego.
