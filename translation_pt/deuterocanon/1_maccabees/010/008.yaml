  yaml_path: translation/deuterocanon/1_maccabees/010/008.yaml
  text: And they were greatly afraid when they heard that the king had given them authority to gather forces[a].
translation:
  language: pt
  text: E eles ficaram com muito medo quando souberam que o rei lhes havia dado autoridade para reunir tropas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «temeram um grande temor», expressão grega que enfatiza a intensidade do medo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: ficaram com muito medo
  rationale: O grego emprega um acusativo cognato, literalmente «temeram um grande temor», para intensificar o medo. A formulação escolhida preserva essa ênfase em português natural e corrente.
- source_word: ὅτε ἤκουσαν
  choice: quando souberam
  rationale: Embora ἀκούω signifique primariamente «ouvir», neste contexto introduz a notícia recebida; «souberam» expressa com naturalidade que tomaram conhecimento da concessão real, sem alterar a relação temporal marcada por ὅτε.
- source_word: ἔδωκεν αὐτοῖς
  choice: lhes havia dado
  rationale: O mais-que-perfeito composto esclarece que a concessão do rei antecedeu o momento em que eles receberam a notícia.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: Equivalente direto e normal de βασιλεύς neste contexto histórico.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: ἐξουσία indica autorização ou direito delegado pelo rei; «autoridade» conserva melhor essa dimensão oficial do que o termo mais amplo «poder».
- source_word: συναγαγεῖν δυνάμεις
  choice: reunir tropas
  rationale: συναγαγεῖν denota reunir ou ajuntar, e δυνάμεις, neste contexto militar, refere-se a forças armadas. «Reunir tropas» é claro, idiomático e menos ambíguo do que «reunir forças».
