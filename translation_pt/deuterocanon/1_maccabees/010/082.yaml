translation_notes:
  register: Português moderno, claro e digno, com vocabulário militar compreensível. “Falange” preserva a especificidade histórica; a breve nota evita que o termo técnico fique obscuro. A mudança para o sujeito plural implícito em “foram esmagados e fugiram” acompanha o grego sem identificar além do que o texto explicita.
