base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/082.yaml
  text: And Simon deployed his force and joined battle with the phalanx[a], for the cavalry had been thrown into disorder[c][b]; and they were crushed by him and fled.
translation:
  language: pt
  text: Simão pôs sua tropa em ação e travou combate com a falange[a], pois a cavalaria[b] havia perdido a coesão[c]; e foram esmagados por ele e fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A falange era uma formação compacta de soldados de infantaria.
    reason: historical_context
  - marker: b
    text: Literalmente, “o cavalo”; isto é, a cavalaria.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “havia sido desfeita” ou “havia sido desorganizada”. A expressão indica a perda de coesão da cavalaria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλυσεν
  choice: pôs ... em ação
  rationale: No contexto militar, indica soltar ou fazer avançar a tropa para o combate. A expressão comunica isso em português atual sem sugerir que Simão dissolveu suas próprias forças.
- source_word: τὴν δύναμιν αὐτοῦ
  choice: sua tropa
  rationale: δύναμις designa aqui um contingente ou força militar. “Tropa” conserva o sentido coletivo sem pressupor um exército nacional completo.
- source_word: συνῆψεν πρὸς τὴν φάλαγγα
  choice: travou combate com a falange
  rationale: O verbo exprime o início ou estabelecimento do confronto, e φάλαγξ identifica uma formação militar helenística específica.
- source_word: ἡ γὰρ ἵππος
  choice: a cavalaria
  rationale: Embora ἵππος signifique literalmente “cavalo”, aqui funciona coletivamente como designação militar da cavalaria.
- source_word: ἐξελύθη
  choice: havia perdido a coesão
  rationale: O passivo descreve a cavalaria se desfazendo como unidade organizada. Esta formulação evita antecipar a fuga, mencionada em seguida.
- source_word: συνετρίβησαν
  choice: foram esmagados
  rationale: O verbo transmite derrota violenta e decisiva em combate.
- source_word: ἀπʼ αὐτοῦ
  choice: por ele
  rationale: 'A preposição com o pronome pode marcar agência neste contexto: os adversários foram esmagados pela ação de Simão.'
