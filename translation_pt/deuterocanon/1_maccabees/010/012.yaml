  text: And the foreigners who were in the strongholds that Bacchides had built fled.
translation:
  language: pt
  text: E os estrangeiros que estavam nas fortalezas que Báquides havia construído fugiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφυγον
  choice: fugiram
  rationale: O aoristo de φεύγω indica fuga; «fugiram» é direto, natural e não acrescenta a ideia específica de escapar com êxito.
- source_word: ἀλλογενεῖς
  choice: estrangeiros
  rationale: O termo designa pessoas de outro povo ou origem. «Estrangeiros» preserva esse sentido no contexto histórico-militar sem introduzir as possíveis conotações teológicas de «gentios».
- source_word: ὀχυρώμασιν
  choice: fortalezas
  rationale: Refere-se a posições fortificadas; «fortalezas» é corrente em português e adequado ao contexto militar.
- source_word: οἷς οἰκοδόμησεν
  choice: que Báquides havia construído
  rationale: A oração relativa modifica «fortalezas». O mais-que-perfeito composto deixa claro, de modo natural, que a construção precedeu a fuga.
- source_word: Βακχίδης
  choice: Báquides
  rationale: Forma portuguesa tradicional e reconhecível do nome grego Βακχίδης.
