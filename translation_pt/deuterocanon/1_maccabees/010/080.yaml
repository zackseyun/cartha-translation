  text: And Jonathan realized that there was an ambush behind him.
translation:
  language: pt
  text: E Jônatas percebeu que havia uma emboscada atrás dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: percebeu
  rationale: O aoristo de γινώσκω indica aqui que Jônatas tomou consciência da situação naquele momento; “percebeu” expressa naturalmente essa constatação, sem reduzir o sentido ao estado contínuo de simplesmente “saber”.
- source_word: ἔνεδρον
  choice: uma emboscada
  rationale: O substantivo pode designar uma emboscada ou o grupo posto de tocaia. “Uma emboscada” mantém a formulação concisa e a possível referência coletiva do grego.
- source_word: κατόπισθεν αὐτοῦ
  choice: atrás dele
  rationale: A expressão indica que a emboscada estava na retaguarda de Jônatas. “Atrás dele” é direta, natural e não acrescenta tecnicismo militar ausente do texto.
- source_word: καὶ
  choice: E
  rationale: A conjunção liga a frase à sequência narrativa sem explicitar uma relação temporal ou causal além do que o grego afirma.
- source_word: ἐστιν
  choice: havia
  rationale: Na construção portuguesa, “havia” apresenta de modo idiomático a existência da emboscada naquele ponto da narrativa, correspondendo a ἐστιν sem exigir o pouco natural “está uma emboscada”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A tradução conserva a coordenação narrativa do grego e evita explicitar se “emboscada” designa a ação, a disposição tática ou o grupo oculto.
