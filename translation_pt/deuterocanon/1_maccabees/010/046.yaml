base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/046.yaml
  text: But when Jonathan and the people heard these words[a], they did not believe them or accept them, because they remembered the great evil that he had done in Israel[b], and how he had oppressed them severely.
translation:
  language: pt
  text: Mas, quando Jônatas e o povo ouviram essas palavras[a], não acreditaram nelas nem as aceitaram, porque se lembraram do grande mal que ele havia feito em Israel[b] e de como os havia oprimido severamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não confiaram nelas nem as acolheram». O grego distingue entre não dar crédito às palavras e não as receber favoravelmente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o grande mal que ele havia feito contra Israel». O grego diz literalmente «em Israel», expressão que pode indicar um mal praticado dentro de Israel ou contra Israel como povo.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐπίστευσαν
  choice: não acreditaram
  rationale: No contexto, indica que não deram crédito à veracidade ou sinceridade da mensagem; a formulação portuguesa mantém a ligação natural com «essas palavras».
- source_word: ἐπεδέξαντο
  choice: nem as aceitaram
  rationale: Expressa acolhimento ou recepção favorável, preservando a distinção entre não dar crédito às palavras e não aceitar o que foi proposto.
- source_word: ἐμνήσθησαν
  choice: se lembraram
  rationale: Tradução narrativa direta que conserva a lembrança como motivo da recusa.
- source_word: τῆς κακίας τῆς μεγάλης
  choice: do grande mal
  rationale: Reproduz a gravidade da expressão grega sem restringi-la indevidamente a perversidade moral ou dano material.
- source_word: ἧς ἐποίησεν ἐν Ἰσραήλ
  choice: que ele havia feito em Israel
  rationale: Mantém formalmente a preposição ἐν («em») e deixa em aberto se o mal foi praticado no território ou no meio de Israel, ou dirigido contra o povo.
- source_word: ἔθλιψεν
  choice: havia oprimido
  rationale: Comunica aflição grave e tratamento opressivo no contexto político-militar.
- source_word: σφόδρα
  choice: severamente
  rationale: Intensifica de modo natural em português o verbo «oprimir».
theological_decisions:
- issue: Referente do sujeito implícito das ações hostis anteriores
  choice: Singular «ele», em conformidade com os verbos gregos no singular e com o remetente mencionado no contexto imediato.
  alternative: Plural «eles», caso o agente seja entendido corporativamente a partir do contexto político mais amplo.
  rationale: ἐποίησεν e ἔθλιψεν estão no singular; preserva-se esse dado sem introduzir uma identificação histórica mais ampla.
- issue: Relação do mal com Israel em ἐν Ἰσραήλ
  choice: «em Israel», preservando a forma e a ambiguidade do grego.
  alternative: «contra Israel», explicitando Israel como alvo do mal.
  rationale: A preposição ἐν significa literalmente «em» e pode apontar para o âmbito em que o mal ocorreu; traduzir «contra» resolveria uma ambiguidade real do texto.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. «Jônatas» segue a acentuação corrente no português do Brasil; a sintaxe evita arcaísmos e conserva as duas recusas distintas do grego.
