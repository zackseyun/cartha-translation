  naturalness: «Jônatas chegou a Jerusalém e leu as cartas diante de todo o povo» é claro, natural e apropriado ao registro narrativo. «Dos que eram da Cidadela» conserva uma formulação portuguesa fluente sem introduzir a inferência locativa de «estavam na».
