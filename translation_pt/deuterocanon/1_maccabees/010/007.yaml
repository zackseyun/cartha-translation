  yaml_path: translation/deuterocanon/1_maccabees/010/007.yaml
  text: And Jonathan came to Jerusalem[a], and read the letters in the hearing of all the people and those in the citadel.
translation:
  language: pt
  text: Jônatas chegou a Jerusalém e leu as cartas diante de todo o povo e dos que eram da Cidadela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “dos que eram da Acra”, a fortaleza situada em Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: chegou
  rationale: O aoristo de ἔρχομαι indica aqui a chegada de Jônatas a Jerusalém. “Chegou” é natural em português narrativo e evita impor a perspectiva dêitica de “veio” ou “foi”.
- source_word: ἀνέγνω
  choice: leu
  rationale: ἀναγινώσκω significa “ler”. A expressão seguinte já estabelece que se trata de leitura perante ouvintes, por isso não é necessário acrescentar “em voz alta”.
- source_word: τὰς ἐπιστολάς
  choice: as cartas
  rationale: ἐπιστολή designa normalmente uma carta ou comunicação escrita; “cartas” é a correspondência direta e adequada ao contexto.
- source_word: εἰς τὰ ὦτα
  choice: diante de
  rationale: A expressão idiomática, literalmente “aos ouvidos de”, indica que as cartas foram lidas para a audiência ouvir. “Diante de” comunica em português natural o caráter público da leitura sem reproduzir um semitismo pouco corrente.
- source_word: παντὸς τοῦ λαοῦ
  choice: todo o povo
  rationale: Preserva o sentido coletivo e abrangente da expressão grega em linguagem portuguesa corrente.
- source_word: τῶν ἐκ τῆς ἄκρας
  choice: dos que estavam na Cidadela
  rationale: Embora ἐκ signifique formalmente “de” ou “procedentes de”, no contexto identifica as pessoas ligadas à fortaleza e presentes nela. A formulação esclarece a referência contextual sem converter necessariamente Ἄκρα em nome próprio no texto principal.
