base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/044.yaml
  text: And for the rebuilding and the renovation of the works of the sanctuary[b][a], the expense will be given by order of the king.
translation:
  language: pt
  text: E, para a reconstrução e a renovação das obras do santuário[a], a despesa será paga por conta do rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «das coisas santas» ou «dos lugares santos»; aqui, a expressão se refere ao complexo sagrado do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou «por ordem do rei». A expressão grega pode indicar tanto a conta ou o registro fiscal do rei como sua ordem ou determinação; o contexto financeiro favorece «por conta do rei».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθῆναι
  choice: reconstrução
  rationale: O infinitivo articular substantivado designa o projeto de construção; no contexto da restauração do templo, «reconstrução» é mais preciso do que o genérico «construção».
- source_word: ἐπικαινισθῆναι
  choice: renovação
  rationale: O verbo indica tornar novo outra vez ou restaurar; junto de «reconstrução», refere-se naturalmente à recuperação material, sem sugerir especificamente uma cerimônia de rededicação.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: Mantém a amplitude do plural grego, que pode abranger os trabalhos e as estruturas ligados ao complexo sagrado.
- source_word: τῶν ἁγίων
  choice: do santuário
  rationale: Neste contexto do templo, o plural substantivado τὰ ἅγια refere-se ao lugar ou complexo sagrado; «santuário» comunica isso com naturalidade em português.
- source_word: ἡ δαπάνη
  choice: a despesa
  rationale: Designa o custo financeiro coletivo da reconstrução e renovação.
- source_word: δοθήσεται
  choice: será paga
  rationale: Embora literalmente seja «será dada», em relação a uma despesa o português idiomático pede «será paga»; a passividade e o valor futuro são preservados.
- source_word: ἐκ τοῦ λόγου τοῦ βασιλέως
  choice: por ordem do rei
  rationale: λόγος pode indicar palavra, determinação ou ordem; com ἐκ, a expressão admite o sentido administrativo de uma despesa autorizada por determinação régia. A alternativa fiscal «por conta do rei» é registrada em nota para preservar a ambiguidade.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «reconstrução», «renovação» e «despesa» preservando o tom administrativo. As notas mantêm a referência literal aos «lugares santos» e a ambiguidade de λόγος entre ordem régia e conta fiscal.
