  naturalness: 'O português é claro e de registro adequado. Há, porém, uma incongruência gramatical em «dei-os»: Ptolemaida e território são ambos femininos, portanto o pronome deve ser «as». A redação revista permanece natural sem converter o referente ambíguo em pessoas ou em uma instituição específica.'
  terminology: «Ptolemaida» é forma portuguesa apropriada. «Território adjacente» é uma boa solução. Para τοῖς ἁγίοις, «o que é sagrado» evita tanto os matizes posteriores de «santos» quanto a identificação interpretativa com «serviço sagrado» ou «santuário».
  issues:
