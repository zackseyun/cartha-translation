base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/010/039.yaml
  text: Ptolemais and the territory adjoining it I have given as a gift to the holy ones in Jerusalem[b][a], for the expenses that come first for the holy place.
translation:
  language: pt
  text: Quanto a Ptolemaida e ao território adjacente, dei-as como dádiva ao que é sagrado em Jerusalém, para as despesas prioritárias relativas ao que é sagrado.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ptolemaida e o que lhe pertence” ou “Ptolemaida e o distrito ligado a ela”.'
    reason: lexical_alternative
  - marker: b
    text: 'A cláusula final é difícil no texto grego. A expressão traduzida por «o que é sagrado» também pode ser entendida como «os santos». O sentido provável é o de despesas prioritárias destinadas ao âmbito sagrado; outra tradução possível é: “para as despesas necessárias dos santos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πτολεμαΐδα
  choice: Ptolemaida
  rationale: Forma portuguesa tradicional do topônimo grego, clara e reconhecível.
- source_word: τὴν προσκυροῦσαν αὐτῇ
  choice: o território adjacente
  rationale: Expressa naturalmente aquilo que está ligado ou contíguo à cidade, provavelmente em sentido territorial ou administrativo.
- source_word: δέδωκα
  choice: dei-os
  rationale: O perfeito indica uma concessão já efetuada e ainda vigente; em português, o pretérito perfeito é a forma idiomática neste documento régio. O pronome retoma a cidade e o território.
- source_word: δόμι
  choice: como presente
  rationale: A forma transmitida é incomum, mas parece pertencer à linguagem de dádiva ou concessão; a tradução comunica essa função sem corrigir silenciosamente o texto.
- source_word: τοῖς ἁγίοις τοῖς ἐν Ἰερουσαλήμ
  choice: aos santos que estão em Jerusalém
  rationale: Mantém o dativo plural masculino como referência a pessoas consagradas, sem substituí-lo por 'santuário'.
- source_word: εἰς τὴν προκαθήκουσαν δαπάνην
  choice: para as despesas prioritárias
  rationale: A expressão grega é difícil; 'prioritárias' preserva a ideia de despesas que vêm primeiro, são previamente designadas ou têm precedência.
- source_word: τοῖς ἁγίοις
  choice: do serviço sagrado
  rationale: No fecho da oração, o contexto financeiro e cultual favorece uma finalidade ligada às atividades sagradas, embora a forma grega também permita referência aos santos; a ambiguidade é explicitada em nota.
theological_decisions:
- issue: Referência das duas ocorrências de τοῖς ἁγίοις
  choice: A primeira designa pessoas consagradas em Jerusalém; a última é entendida funcionalmente como referência ao serviço sagrado.
  alternative: 'Entender ambas as ocorrências como referência às mesmas pessoas: ''para as despesas necessárias dos santos''.'
  rationale: A morfologia da primeira expressão favorece claramente pessoas, enquanto o contexto de despesas na cláusula final favorece uso cultual. Como o grego transmitido é difícil, a nota preserva a leitura alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe própria de uma proclamação régia. As notas conservam a incerteza lexical e sintática do texto grego sem impor uma leitura denominacional.
