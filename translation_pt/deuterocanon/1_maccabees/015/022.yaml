lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo que dá continuidade à narrativa e preserva o estilo paratático do grego.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Reproduz o demonstrativo neutro plural, que retoma o conteúdo mencionado anteriormente.
- source_word: ἔγραψεν
