- source_word: Δημητρίῳ
  choice: Demétrio
  rationale: Forma portuguesa convencional do nome próprio grego, aqui regido pela preposição “a”.
- source_word: τῷ βασιλεῖ
  choice: o rei
  rationale: Conserva a aposição descritiva ligada a Demétrio sem transformá-la em forma de tratamento.
- source_word: Ἀττάλῳ
  choice: Átalo
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: Ἀράθῃ
  choice: Ariarates
  rationale: Embora a forma impressa seja Ἀράθῃ, o referente histórico é muito provavelmente o rei conhecido em português como Ariarates; a nota preserva a forma textual e a alternativa mais mecânica.
- source_word: Ἀρσάκῃ
  choice: Ársaces
  rationale: Forma portuguesa histórica e convencional do nome real.
