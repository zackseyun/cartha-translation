  text: And the king appointed Cendebaeus commander of the coastal region, and gave him infantry and cavalry forces.
translation:
  language: pt
  text: E o rei nomeou Cendebeu comandante da região costeira e lhe deu forças de infantaria e cavalaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: nomeou
  rationale: No contexto administrativo e militar, o verbo indica a designação de alguém para um cargo; “nomeou” é natural e preciso em português.
- source_word: Κενδεβαῖον
  choice: Cendebeu
  rationale: Forma portuguesa tradicional e reconhecível do nome grego, adequada ao uso bíblico lusófono.
- source_word: ἐπιστράτηγον
  choice: comandante
  rationale: O termo designa um oficial militar responsável por uma região. “Comandante” preserva o sentido sem especificar em excesso a estrutura do cargo.
- source_word: τῆς παραλίας
  choice: da região costeira
  rationale: O genitivo define a jurisdição territorial do comandante; “região costeira” torna explícito esse valor sem acrescentar localização não indicada no grego.
- source_word: δυνάμεις
  choice: forças
  rationale: Neste contexto, refere-se a contingentes militares, posteriormente especificados como infantaria e cavalaria.
- source_word: πεζικὰς
  choice: de infantaria
  rationale: Equivalente militar corrente para forças que combatem a pé e que aqui se contrapõem à cavalaria.
- source_word: ἱππικὰς
  choice: cavalaria
  rationale: Equivalente conciso e convencional para tropas montadas, em paralelo natural com “infantaria”.
- source_word: ἔδωκεν αὐτῷ
  choice: lhe deu
  rationale: Reproduz diretamente o verbo simples do grego; o objeto militar esclarece que as forças foram colocadas à disposição dele.
