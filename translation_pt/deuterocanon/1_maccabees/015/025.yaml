  text: But King Antiochus encamped against Dora a second time[a], continually bringing his forces against it and constructing siege engines[b], and he shut Tryphon in so that he could neither go in nor go out.
translation:
  language: pt
  text: Mas o rei Antíoco acampou contra Dora pela segunda vez[a], mantendo continuamente a pressão sobre ela[b] e construindo máquinas de cerco; e cercou Trifão, impedindo-o de entrar ou sair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega diz literalmente “na segunda” e é elíptica. Embora possa ser entendida de outras formas, no contexto provavelmente se refere a uma segunda ação ou investida.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “levando continuamente as mãos contra ela”, expressão que, neste contexto militar, indica ataque ou pressão constante durante o cerco.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ Δωρὰ
  choice: acampou contra Dora
  rationale: Em contexto militar, παρεμβάλλω indica estabelecer acampamento; ἐπί dá à ação direção hostil contra a cidade sitiada.
- source_word: ἐν τῇ δευτέρᾳ
  choice: pela segunda vez
  rationale: A expressão é entendida de modo adverbial, como repetição da ação militar, interpretação que melhor se ajusta ao contexto imediato.
- source_word: προσάγων διὰ παντὸς αὐτῇ τὰς χεῖρας
  choice: mantendo continuamente a pressão sobre a cidade
  rationale: A formulação literalmente ligada a 'levar/aplicar as mãos' é idiomática neste contexto e comunica uma pressão militar constante; 'a cidade' explicita o referente do pronome grego sem alterar seu sentido.
- source_word: μηχανὰς ποιούμενος
  choice: construindo máquinas de cerco
  rationale: μηχαναί designa aqui engenhos militares usados numa operação de cerco, e não máquinas em sentido genérico.
- source_word: συνέκλεισεν τὸν Τρύφωνα
  choice: cercou Trifão
  rationale: O verbo expressa fechar alguém dentro de um espaço ou encurralá-lo; 'cercou' é claro, natural e apropriado à situação militar.
- source_word: τοῦ εἰσπορεύεσθαι καὶ ἐκπορεύεσθαι
  choice: de modo que ele não podia entrar nem sair
  rationale: A construção com infinitivos articulares indica impedimento ou resultado efetivo e descreve o bloqueio completo dos movimentos de Trifão.
