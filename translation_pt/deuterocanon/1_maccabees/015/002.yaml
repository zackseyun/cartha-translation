  text: 'And they contained this form: “King Antiochus to Simon the high priest and ethnarch[a], and to the nation of the Jews[b], greetings.”'
translation:
  language: pt
  text: 'E elas tinham o seguinte teor[a]: “O rei Antíoco a Simão, sumo sacerdote e etnarca, e à nação dos judeus[b]: saudações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente, “continham esta forma”; também se pode traduzir: “diziam o seguinte”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “à nação dos judeus da Judeia”. O grego pode referir-se aos judeus como povo ou enfatizar sua ligação geográfica com a Judeia.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν περιέχουσαι
  choice: elas tinham
  rationale: A construção perifrástica descreve o conteúdo das cartas mencionadas no contexto. Em português documental, “tinham o seguinte teor” expressa o sentido com naturalidade, sem alterar a referência feminina plural.
- source_word: τὸν τρόπον τοῦτον
  choice: o seguinte teor
  rationale: Neste contexto, τρόπος indica a forma ou redação do documento. “Teor” é uma expressão portuguesa clara e apropriada para introduzir o conteúdo de uma carta.
- source_word: ἱερεῖ μεγάλῳ
  choice: sumo sacerdote
  rationale: É a designação consagrada e natural do cargo judaico indicado pela expressão grega, preferível ao literal “grande sacerdote”.
- source_word: ἐθνάρχῃ
  choice: etnarca
  rationale: Mantém o título político específico e historicamente significativo, sem reduzi-lo a uma designação genérica como “governante”.
- source_word: ἔθνει Ἰουδαίων
  choice: à nação dos judeus
  rationale: Reproduz a construção coletiva do grego e, neste contexto, identifica o povo judeu; a possível nuance geográfica de “judeus da Judeia” é preservada em nota.
- source_word: χαίρειν
  choice: saudações
  rationale: Na abertura de cartas, o infinitivo χαίρειν funciona como fórmula convencional de saudação, não como uma ordem literal para alegrar-se.
theological_decisions:
- issue: Alcance étnico-geográfico de Ἰουδαίων
  choice: judeus
  alternative: judeus da Judeia
  rationale: O termo grego pode designar o povo judeu ou, com maior ênfase geográfica, os judeus ligados à Judeia. A carta se dirige coletivamente à nação, favorecendo “judeus”, mas a alternativa permanece genuína e consta em nota.
- issue: Grau de literalidade da fórmula que introduz a carta
  choice: tinham o seguinte teor
  alternative: continham esta forma
  rationale: A opção escolhida comunica em português corrente a função documental da expressão grega, enquanto a alternativa mais formalmente literal é indicada na nota.
translation_notes:
  register: Português moderno, claro e digno, com formulação documental natural. Conserva-se “etnarca” como título histórico específico e mantém-se a estrutura formal da saudação real.
