  text: 'And Numenius and those with him came back from Rome[a], bringing letters to the kings and the countries, in which these things had been written:'
translation:
  language: pt
  text: 'E Numênio e os que o acompanhavam voltaram de Roma[a], trazendo cartas dirigidas aos reis e aos países, nas quais estava escrito o seguinte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «veio ... de Roma»; o verbo está no singular, tendo Numênio como sujeito. Contudo, o contexto indica o regresso dele e dos seus acompanhantes de uma missão realizada ali; por isso, «voltaram de Roma».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: voltaram
  rationale: Embora o verbo grego signifique basicamente «veio», o contexto indica o regresso de Numênio e seus acompanhantes da missão a Roma; o plural é natural em português, pois o sujeito composto inclui o grupo.
- source_word: οἱ παρʼ αὐτοῦ
  choice: os que estavam com ele
  rationale: Expressa de modo transparente o grupo que acompanhava Numênio sem especificar além do que diz o grego.
- source_word: ἐκ Ῥώμης
  choice: de Roma
  rationale: Equivalente direto e natural para a origem do deslocamento.
- source_word: ἔχοντες ἐπιστολάς
  choice: trazendo cartas
  rationale: Reproduz o particípio de circunstância concomitante em português idiomático e indica que chegaram portando a correspondência.
- source_word: τοῖς βασιλεῦσι καὶ ταῖς χώραις
  choice: dirigidas aos reis e aos países
  rationale: O dativo indica os destinatários das cartas. «Países» é um equivalente moderno e direto de χώραις neste contexto.
- source_word: ἐν αἷς ἐγέγραπτο τάδε
  choice: nas quais estava escrito o seguinte
  rationale: Introduz naturalmente em português o conteúdo da correspondência. O singular idiomático «o seguinte» comunica a função de τάδε sem produzir uma formulação artificial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. Conserva-se a referência coletiva aos acompanhantes e explicita-se apenas na nota a nuance contextual de regresso.
