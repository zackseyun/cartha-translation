  text: But concerning Joppa and Gazara, you ask for them. These were inflicting great harm on the people and on our land. For these we will give one hundred talents. And he answered him not a word.
translation:
  language: pt
  text: Quanto a Jope e Gazara, você as pede. Elas causavam grande dano ao povo e à nossa terra. Por elas, daremos cem talentos. E ele não lhe respondeu palavra alguma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτεῖς
  choice: você exige
  rationale: No contexto de uma reivindicação diplomática, o verbo tem força maior que um simples pedido; “exige” comunica de modo natural a demanda pelas cidades.
- source_word: πληγὴν μεγάλην
  choice: grande dano
  rationale: A expressão literalmente envolve um “grande golpe” ou “grande ferida”; aqui funciona como descrição do grave prejuízo causado ao povo e à terra.
- source_word: τάλαντα ἑκατόν
  choice: cem talentos
  rationale: Mantém a unidade antiga de peso e valor sem convertê-la de modo especulativo.
- source_word: οὐκ ἀπεκρίθη αὐτῷ λόγον
  choice: não lhe respondeu palavra alguma
  rationale: Reproduz a ênfase idiomática do grego em não dar resposta nenhuma.
theological_decisions: []
translation_notes:
  register: Português atual, digno e direto. “Jope” e “Gazara” seguem formas tradicionais e reconhecíveis. O plural feminino αὗται é explicitado como “essas cidades” e retomado por “elas”, evitando ambiguidade em português. A adversativa final foi vertida por “Mas” para marcar naturalmente a reação negativa do interlocutor.
