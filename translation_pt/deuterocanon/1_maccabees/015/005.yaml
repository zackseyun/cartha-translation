  yaml_path: translation/deuterocanon/1_maccabees/015/005.yaml
  text: Now therefore I confirm for you all the remissions that the kings before me granted you[b][a], and whatever other remissions they granted you.
translation:
  language: pt
  text: Agora, portanto, confirmo em seu favor todas as remissões[b] que os reis antes de mim lhe concederam, bem como todas as outras remissões que ele lhe concedeu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego termina com um verbo no singular, “ele lhe concedeu”, depois do sujeito plural “os reis antes de mim”. Isso pode refletir a redação transmitida e preservada no texto de Swete; pela concordância, seria de esperar “eles lhe concederam”.
    reason: textual_variant
  - marker: b
    text: Aqui, “remissões” são concessões fiscais régias, como redução ou perdão de tributos e outros encargos; a palavra não significa necessariamente isenção completa de todas as obrigações.
    reason: cultural_note
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, portanto
  rationale: Preserva tanto a transição temporal quanto a força conclusiva das partículas, em registro adequado a uma declaração régia.
- source_word: ἵστημί
  choice: confirmo
  rationale: Neste contexto administrativo, o verbo indica ratificar ou manter em vigor concessões anteriores, não o ato físico de colocar algo em pé.
- source_word: σοι
  choice: em seu favor / lhe
  rationale: Expressa naturalmente em português a ideia de benefício ou concessão dirigida ao destinatário.
- source_word: πάντα τὰ ἀφαιρέματα
  choice: todas as remissões
  rationale: Mantém o sentido administrativo amplo de valores, encargos ou obrigações reduzidos ou perdoados, sem pressupor isenção total.
- source_word: ἃ ἀφῆκάν σοι
  choice: que ... lhe concederam
  rationale: O aoristo de ἀφίημι designa aqui a concessão ou remissão de obrigações; “concederam” é natural em português e evita repetição pouco elegante.
- source_word: οἱ πρὸ ἐμοῦ βασιλεῖς
  choice: os reis antes de mim
  rationale: Tradução direta e corrente da expressão temporal no contexto de sucessão régia.
- source_word: καὶ ὅσα ἄλλα ἀφαιρέματα
  choice: bem como todas as outras remissões
  rationale: Comunica o alcance adicional e não especificado de ὅσα ἄλλα, mantendo a ligação com a cláusula anterior.
- source_word: ἀφῆκέν σοι
  choice: que ele lhe concedeu
  rationale: Preserva deliberadamente o verbo singular da forma grega transmitida, em vez de normalizá-lo silenciosamente para concordar com “reis”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com formulação administrativa compatível com uma declaração régia. Conserva-se a anomalia do singular no fim do texto grego, esclarecida em nota, e evita-se restringir indevidamente o alcance fiscal de ἀφαιρέματα.
