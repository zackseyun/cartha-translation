  yaml_path: translation/deuterocanon/1_maccabees/015/041.yaml
  text: And he fortified Kedron and stationed there cavalry and forces[a], so that by going out they might patrol the roads of Judea[c][b], just as the king had ordered him.
translation:
  language: pt
  text: E ele fortificou Cedrom[a] e colocou ali cavaleiros[b] e tropas, para que, saindo, patrulhassem[c] as estradas da Judeia, conforme o rei lhe havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «construiu Cedrom». O verbo grego significa literalmente «construiu» ou «edificou»; «fortificou» corresponde ao contexto militar.
    reason: lexical_alternative
  - marker: b
    text: Também poderia ser traduzido por «cavalaria».
    reason: lexical_alternative
  - marker: c
    text: O verbo também pode sugerir percorrer as estradas para controlá-las, hostilizar quem passava por elas ou realizar incursões.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: fortificou
  rationale: O verbo significa literalmente «construiu» ou «edificou», mas o contexto militar e a colocação imediata de tropas indicam a preparação defensiva e estratégica da localidade.
- source_word: τὴν Κεδρὼν
  choice: Cedrom
  rationale: Forma portuguesa tradicional e reconhecível do topônimo grego Κεδρών.
- source_word: ἔταξεν
  choice: colocou
  rationale: No contexto militar, expressa de modo natural a designação de tropas para permanecerem naquele lugar, sem acrescentar uma estrutura militar não explicitada.
- source_word: ἵππεις
  choice: cavaleiros
  rationale: Designa combatentes montados; «cavaleiros» é claro e preserva a forma concreta do plural grego.
- source_word: δυνάμεις
  choice: tropas
  rationale: Aqui o termo amplo para forças ou contingentes tem sentido claramente militar; «tropas» é natural em português.
- source_word: ὅπως
  choice: para que
  rationale: Preserva a relação de finalidade introduzida pela conjunção grega.
- source_word: ἐκπορευόμενοι
  choice: saindo dali
  rationale: Reproduz a ideia circunstancial de sair da base em Cedrom para realizar a ação seguinte; «dali» torna a referência espacial natural em português.
- source_word: ἐξοδεύωσιν
  choice: patrulhassem
  rationale: No contexto das estradas e de tropas estacionadas, comunica deslocamento militar destinado a vigiar ou controlar as rotas, mantendo em nota a amplitude possível do verbo.
- source_word: τὰς ὁδοὺς τῆς Ἰουδαίας
  choice: as estradas da Judeia
  rationale: Tradução direta e idiomática do sintagma geográfico.
- source_word: καθὰ συνετέταξεν αὐτῷ ὁ βασιλεύς
  choice: conforme o rei lhe havia ordenado
  rationale: Mantém a autoridade da instrução real e o aspecto anterior expresso pelo mais-que-perfeito grego.
