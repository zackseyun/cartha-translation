  text: But I want to go out into the country[a], so that I may pursue those who have devastated our country and laid waste many cities in the kingdom[b];
translation:
  language: pt
  text: Mas quero sair para percorrer o território[a], a fim de perseguir[b] os que devastaram nossa terra e arrasaram muitas cidades no reino;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sair pelo território”; a expressão grega pode indicar movimento através da região de modo geral.
    reason: lexical_alternative
  - marker: b
    text: Ou “ir contra” ou “punir”; o verbo grego traduzido por “perseguir” pode indicar uma ação hostil contra os ofensores.
    reason: lexical_alternative
lexical_decisions:
- source_word: βούλομαι
  choice: quero
  rationale: Expressa de modo natural e direto a vontade ou intenção pessoal do falante.
- source_word: ἐκβῆναι κατὰ τὴν χώραν
  choice: sair e percorrer o território
  rationale: Combina a ideia de sair, presente em ἐκβῆναι, com o movimento pelo território indicado por κατά com acusativo, evitando entender a expressão como hostilidade contra a própria terra.
- source_word: ὅπως μετέλθω
  choice: para perseguir
  rationale: A oração expressa propósito, e μετέρχομαι pode indicar ir atrás de ofensores com intenção hostil; “perseguir” preserva essa força sem especificar punição judicial.
- source_word: τοὺς κατεφθαρκότας τὴν χώραν ἡμῶν
  choice: os que devastaram a nossa terra
  rationale: O particípio perfeito identifica os responsáveis pela ruína causada; “devastaram” transmite a gravidade sem afirmar necessariamente destruição total.
- source_word: τοὺς ἠρημωκότας πόλεις πολλὰς
  choice: arrasaram muitas cidades
  rationale: “Arrasaram” comunica em português corrente a ação de tornar cidades desoladas, com força adequada ao contexto.
- source_word: ἐν τῇ βασιλείᾳ
  choice: do reino
  rationale: Em português, “muitas cidades do reino” expressa naturalmente cidades situadas dentro do reino, sem acrescentar o possessivo “meu”, ausente no grego.
