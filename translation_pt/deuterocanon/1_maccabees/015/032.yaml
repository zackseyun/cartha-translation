  text: And Athenobius, the king’s friend, came to Jerusalem, and he saw the splendor of Simon, and a display of gold and silver vessels, and an impressive retinue; and he was astonished, and reported to him the king’s words.
translation:
  language: pt
  text: Atenóbio, amigo do rei, foi a Jerusalém e viu o esplendor de Simão, uma exposição[a] de peças de ouro e de prata e um séquito imponente. Ele ficou admirado e transmitiu a Simão as palavras do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “exposição” é raro e de sentido incerto; talvez se refira mais especificamente a um serviço de mesa ou a utensílios luxuosos de ouro e prata dispostos para exibição.
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος τοῦ βασιλέως
  choice: amigo do rei
  rationale: Mantém a designação cortesã expressa literalmente no grego, sem defini-la de modo excessivo como um cargo técnico.
- source_word: δόξαν
  choice: esplendor
  rationale: Neste contexto narrativo, indica a grandeza visível e o prestígio de Simão, não a glória em sentido especificamente teológico.
- source_word: κυλίκιον μετὰ χρυσωμάτων καὶ ἀργυρωμάτων
  choice: uma exposição de peças de ouro e de prata
  rationale: κυλίκιον é raro e de sentido incerto, provavelmente ligado à apresentação de utensílios ou objetos valiosos à mesa. A formulação preserva a cena de luxo visível sem impor uma identificação técnica duvidosa.
- source_word: παράστασιν ἱκανήν
  choice: um séquito imponente
  rationale: Expressa uma presença numerosa e prestigiosa de acompanhantes ao redor de Simão, de modo natural em português.
- source_word: ἐξίστατο
  choice: ficou admirado
  rationale: Comunica o forte espanto provocado pelo que Atenóbio viu, em linguagem corrente e digna.
- source_word: ἀπήγγειλεν αὐτῷ τοὺς λόγους τοῦ βασιλέως
  choice: transmitiu a Simão as palavras do rei
  rationale: Torna explícito o referente de αὐτῷ para evitar ambiguidade pronominal artificial em português, preservando o conteúdo direto da frase grega.
