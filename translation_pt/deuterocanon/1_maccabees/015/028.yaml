  yaml_path: translation/deuterocanon/1_maccabees/015/028.yaml
  text: And he sent to him Athenobius[a], one of his Friends, to confer with him, saying, “You are holding Joppa and Gazara and the citadel in Jerusalem[b], cities of my kingdom.”
translation:
  language: pt
  text: 'E ele lhe enviou Atenóbio, um dos seus Amigos, para conversar com ele, dizendo: “Vocês mantêm sob seu domínio Jope, Gazara[a] e a cidadela de Jerusalém[b], cidades do meu reino.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara é a forma grega do nome do lugar, geralmente identificado com Gezer.
    reason: cross_reference
  - marker: b
    text: Ou “a Acra de Jerusalém”. A palavra grega significa “cidadela” ou “fortaleza”, mas aqui também pode funcionar como o nome consagrado da fortaleza selêucida de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo direto e natural, sem acrescentar uma nuance militar ausente do verbo grego.
- source_word: Ἀθηνόβιον
  choice: Atenóbio
  rationale: Transliteração adaptada à forma natural dos nomes gregos em português.
- source_word: ἕνα τῶν φίλων αὐτοῦ
  choice: um dos seus Amigos
  rationale: A inicial maiúscula sinaliza que “Amigos” provavelmente designa uma categoria ou título da corte helenística, sem eliminar a leitura comum da palavra.
- source_word: κοινολογησόμενον αὐτῷ
  choice: para conversar com ele
  rationale: Expressa a ideia ampla de entrar em diálogo ou tratar de um assunto com alguém; “negociar” seria específico demais.
- source_word: κατακρατεῖτε
  choice: mantêm sob seu domínio
  rationale: Comunica exercício continuado de controle e preserva o tom acusatório melhor que o simples “mantêm”, sem impor necessariamente uma ocupação militar.
- source_word: Ἰόππης
  choice: Jope
  rationale: Forma portuguesa tradicional e reconhecível do topônimo.
- source_word: Γαζάρων
  choice: Gazara
  rationale: Preserva a forma grega do topônimo apresentada pela testemunha textual, em vez de substituí-la silenciosamente por Gezer.
- source_word: ἄκρας
  choice: cidadela
  rationale: Sentido comum e claro do substantivo grego; a possível função como nome estabelecido da fortaleza selêucida é registrada em nota.
- source_word: πόλεις τῆς βασιλείας μου
  choice: cidades do meu reino
  rationale: Tradução direta e idiomática da construção genitiva.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Amigos” recebe inicial maiúscula para preservar sua provável nuance de título cortesão. Os marcadores foram posicionados junto aos termos a que as notas efetivamente correspondem; isso corrige a aparente inversão dos marcadores na camada inglesa fornecida.
