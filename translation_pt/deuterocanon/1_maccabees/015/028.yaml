  source_fidelity: 'A tradução acompanha com precisão o grego: ἀπέστειλεν («enviou»), ἕνα τῶν φίλων αὐτοῦ («um dos seus Amigos»), κοινολογησόμενον αὐτῷ («para conversar com ele»), κατακρατεῖτε («mantêm sob seu domínio») e a enumeração final são todos adequadamente representados. «Cidades do meu reino» preserva inclusive a aposição plural do original, embora a referência à cidadela dentro da enumeração seja historicamente e sintaticamente algo marcada.'
