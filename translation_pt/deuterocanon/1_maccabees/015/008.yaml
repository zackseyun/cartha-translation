  yaml_path: translation/deuterocanon/1_maccabees/015/008.yaml
  text: And let every royal debt[a], and the royal revenues yet to come, from now on and for all time, be remitted to you.
translation:
  language: pt
  text: E que toda dívida para com o rei e todas as receitas reais futuras, de agora em diante e para sempre, sejam canceladas a você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν ὀφείλημα βασιλικόν
  choice: toda dívida para com o rei
  rationale: O singular com πᾶν abrange toda quantia ou obrigação devida ao rei; a formulação deixa claro que se trata de dívida para com a autoridade real, não de dívida contraída pelo rei.
- source_word: τὰ ἐσόμενα βασιλικά
  choice: todas as futuras receitas reais
  rationale: O neutro plural substantivado com o particípio futuro indica valores que futuramente caberiam ao rei ou ao tesouro real, sem especificar se eram impostos, tributos ou outra categoria fiscal.
- source_word: ἀπὸ τοῦ νῦν
  choice: de agora em diante
  rationale: Expressão temporal natural em português contemporâneo, indicando vigência a partir daquele momento.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: para sempre
  rationale: Comunica de modo claro e corrente a duração irrestrita expressa pela locução grega.
- source_word: ἀφέσθω σοι
  choice: sejam canceladas em seu favor
  rationale: No contexto fiscal e jurídico, ἀφίημι significa liberar ou cancelar obrigações; o dativo σοι assinala o beneficiário da remissão.
