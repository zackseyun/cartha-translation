  text: In the one hundred seventy-fourth year, Antiochus went out into the land of his fathers, and all the forces gathered to him, so that only a few were left with Tryphon.
translation:
  language: pt
  text: No ano cento e setenta e quatro, Antíoco partiu para a terra de seus antepassados, e todas as forças se juntaram a ele, de modo que poucos estavam com Trifão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτους τετάρτου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: No ano cento e setenta e quatro
  rationale: Reproduz de modo natural em português a fórmula grega de datação, sem acrescentar ao texto a identificação da era selêucida.
- source_word: ἐξῆλθεν
  choice: partiu
  rationale: No contexto narrativo, expressa naturalmente o ato de sair em direção a um território, sem tornar explícita uma marcha militar que o verbo, por si só, não exige.
- source_word: εἰς τὴν γῆν τῶν πατέρων αὐτοῦ
  choice: para a terra de seus antepassados
  rationale: Preserva o sentido ancestral de πατέρων em português corrente e mantém γῆ como “terra”.
- source_word: συνῆλθον πρὸς αὐτόν
  choice: se juntaram a ele
  rationale: Comunica tanto a convergência quanto a adesão a Antíoco, de forma idiomática e sem especificar além do grego.
- source_word: πᾶσαι αἱ δυνάμεις
  choice: todas as forças
  rationale: No contexto militar, “forças” conserva a amplitude de δυνάμεις sem restringi-lo necessariamente a tropas ou exércitos específicos.
- source_word: ὥστε ὀλίγους εἶναι σὺν Τρύφωνι
  choice: de modo que poucos estavam com Trifão
  rationale: Mantém a construção de resultado introduzida por ὥστε e traduz diretamente εἶναι σὺν, evitando acrescentar “somente” ou a ideia explícita de que alguns “ficaram” ou “foram deixados” com Trifão.
