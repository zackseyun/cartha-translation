  text: E ele escreveu uma cópia delas para Simão, o sumo sacerdote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, das cartas ou documentos mencionados anteriormente. O pronome grego está no plural e também pode referir-se coletivamente ao seu conteúdo.
    reason: Esclarece o antecedente contextual provável de αὐτῶν, preservando tanto o plural do grego quanto a possível referência coletiva.
lexical_decisions:
- source_word: ἀντίγραφον
  choice: uma cópia
  rationale: O substantivo designa uma cópia ou duplicata de um documento; «uma cópia» é natural e adequado ao contexto administrativo.
- source_word: αὐτῶν
  choice: deles
  rationale: O pronome está formalmente no plural e provavelmente remete aos escritos ou destinatários mencionados no contexto anterior; manter o plural preserva a forma e a possível ambiguidade do grego.
- source_word: ἔγραψεν
  choice: escreveu
  rationale: Reproduz o sentido básico do verbo sem acrescentar a ideia de envio, que não é expressa neste versículo.
- source_word: Σίμωνι
  choice: a Simão
  rationale: O dativo marca o destinatário; «Simão» é a forma portuguesa convencional do nome.
- source_word: ἀρχιερεῖ
  choice: sumo sacerdote
  rationale: É a expressão portuguesa consagrada e precisa para o principal sacerdote no contexto judaico.
