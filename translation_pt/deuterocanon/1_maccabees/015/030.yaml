base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/030.yaml
  text: Now then[a], hand over the cities that you seized, and the taxes of the places over which you gained control, beyond the borders of Judea.
translation:
  language: pt
  text: Agora, pois, entreguem as cidades que tomaram e os impostos dos lugares que passaram a dominar, fora das fronteiras da Judeia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais formal, “a partir das fronteiras da Judeia”. A expressão grega referente às fronteiras é bastante condensada; o texto apresenta o sentido contextual provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, pois
  rationale: Expressa tanto a transição conclusiva quanto a urgência do momento, em português natural e digno.
- source_word: παράδοτε
  choice: entreguem
  rationale: O imperativo exige a transferência de posse ou controle, sem acrescentar necessariamente a ideia militar de rendição nem a de restituição contida em “devolvam”.
- source_word: τὰς πόλεις ἃς κατελάβετε
  choice: as cidades que tomaram
  rationale: “Tomaram” comunica a aquisição de posse ou controle, provavelmente pela força, com clareza e sem excesso de especificação.
- source_word: τοὺς φόρους
  choice: os impostos
  rationale: φόροι pode designar impostos ou tributos; “impostos” é a opção moderna mais ampla e inteligível neste contexto político.
- source_word: τῶν τόπων
  choice: dos lugares
  rationale: Mantém a amplitude de τόποι sem pressupor que se tratava de distritos administrativos formalmente definidos.
- source_word: ὧν κατεκυριεύσατε
  choice: que passaram a dominar
  rationale: Traduz a aquisição de domínio ou controle político e preserva o aspecto resultante sugerido pelo verbo.
- source_word: τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: fora das fronteiras da Judeia
  rationale: A frase grega é comprimida e sintaticamente difícil; no contexto, esta formulação comunica a interpretação provável de territórios situados além dos limites próprios da Judeia.
theological_decisions:
- issue: Sentido da expressão limítrofe τῶν ὁρίων τῶν ἐκ τῆς Ἰουδαίας
  choice: fora das fronteiras da Judeia
  alternative: dos limites da Judeia / a partir das fronteiras da Judeia
  rationale: Não se trata de uma questão doutrinária central, mas de uma ambiguidade geográfica real. O texto principal apresenta o sentido contextual mais provável, enquanto a nota conserva a possibilidade de uma tradução mais formal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural verbal sem pronome explícito corresponde à ordem dirigida a mais de uma pessoa. Evitou-se linguagem arcaica e preservou-se em nota a ambiguidade da frase final.
