base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/014.yaml
  text: And he encircled the city[a], and the ships closed in from the sea; and he pressed the city from the land and from the sea[b], and he allowed no one to go out or to come in.
translation:
  language: pt
  text: Ele cercou a cidade[a], e os navios fecharam o cerco[b] pelo mar; pressionava a cidade por terra e pelo mar e não permitiu que ninguém saísse nem entrasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rodeou a cidade”. O verbo grego descreve literalmente o ato de cercar algo ao redor.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego pode sugerir que os navios se juntaram ou avançaram em conjunto; aqui, indica que eles apertaram ou completaram o cerco pelo mar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: cercou
  rationale: Expressa de modo natural o ato de rodear completamente a cidade, sem acrescentar ao verbo uma especificação técnica além da imagem militar presente no contexto.
- source_word: συνῆψαν
  choice: fecharam o cerco
  rationale: Com “os navios” como sujeito e “pelo mar” como complemento, indica que as forças navais se aproximaram e completaram o bloqueio. A formulação portuguesa comunica isso sem afirmar explicitamente que houve combate.
- source_word: συνέθλιβεν
  choice: mantinha ... sob forte pressão
  rationale: Preserva tanto a força do verbo, que sugere compressão ou pressão intensa, quanto o aspecto contínuo do imperfeito grego.
- source_word: ἀπὸ τῆς γῆς καὶ ἀπὸ τῆς θαλάσσης
  choice: por terra e pelo mar
  rationale: É uma expressão portuguesa clara e idiomática que mantém as duas frentes de pressão indicadas pelo grego.
- source_word: οὐκ εἴασεν
  choice: não deixava ninguém
  rationale: Formulação corrente em português que traduz com clareza o sentido permissivo negativo e harmoniza com o caráter contínuo da ação.
- source_word: ἐκπορεύεσθαι καὶ εἰσπορεύεσθαι
  choice: sair nem entrar
  rationale: Reproduz de maneira concisa e natural a oposição dos dois verbos de movimento e comunica um bloqueio total.
