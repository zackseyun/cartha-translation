base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/021.yaml
  text: If[a], then, any pestilent men have escaped from their land to us, hand them over to Simon the high priest[b], so that he may punish them according to their law.
translation:
  language: pt
  text: Portanto, se alguns homens nocivos[a] tiverem escapado da terra deles para junto de nós, entreguem-nos a Simão, o sumo sacerdote, para que ele os puna[b] segundo a lei deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens perniciosos”, “causadores de transtornos” ou, mais literalmente, “homens pestilentos”. O termo grego é uma designação dura para pessoas perigosas ou nocivas.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que ele lhes faça justiça” ou “se vingue deles”. O verbo grego pode indicar fazer justiça, punir ou vingar; a expressão “segundo a lei deles” favorece aqui o sentido judicial.
    reason: alternative_reading
lexical_decisions:
- source_word: λοιμοὶ
  choice: homens nocivos
  rationale: O termo é literalmente associado a peste, mas, aplicado a pessoas, funciona como designação dura de indivíduos perniciosos ou perigosos. “Homens nocivos” conserva a forte censura sem soar artificial em português.
- source_word: διαπεφεύγασιν
  choice: tiverem escapado
  rationale: O perfeito grego indica uma fuga já consumada com resultado presente; em português, a construção condicional “se... tiverem escapado” expressa isso com naturalidade.
- source_word: χώρας
  choice: terra
  rationale: Mantém a amplitude geográfica de χώρα, que pode indicar terra, país ou território, sem especificar além do grego.
- source_word: πρὸς ἡμᾶς
  choice: para junto de nós
  rationale: Reproduz a direção para a esfera ou jurisdição dos remetentes, sem introduzir a ideia mais específica de asilo.
- source_word: παράδοτε
  choice: entreguem-nos
  rationale: Expressa de modo idiomático a ordem de transferir os fugitivos à custódia de Simão.
- source_word: ἀρχιερεῖ
  choice: sumo sacerdote
  rationale: É a designação portuguesa estabelecida para o cargo judaico indicado por ἀρχιερεύς.
- source_word: ἐκδικήσει
  choice: lhes faça justiça
  rationale: Preserva o sentido de exercer ou executar justiça, adequado ao contexto jurídico, sem restringir o verbo a castigo nem convertê-lo claramente em vingança pessoal.
- source_word: κατὰ τὸν νόμον αὐτῶν
  choice: segundo a lei deles
  rationale: Mantém o pronome plural αὐτῶν e a possível ambiguidade quanto ao grupo a que “deles” se refere.
theological_decisions:
- issue: Força de ἐκδικήσει no contexto jurídico-político
  choice: lhes faça justiça
  alternative: os castigue; se vingue deles
  rationale: A expressão “segundo a lei deles” favorece uma ação judicial. “Faça justiça” mantém a severidade e alguma amplitude do verbo, sem impor a leitura de vingança privada.
- issue: Referente de αὐτῶν em “a lei deles”
  choice: preservar o plural ambíguo
  alternative: segundo a lei judaica; segundo a lei dele
  rationale: O texto grego traz o plural e não identifica explicitamente o referente. A tradução evita harmonizá-lo ou explicá-lo no corpo do versículo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem direta foi preservada, e as ambiguidades do verbo jurídico e do pronome plural foram mantidas ou registradas em nota.
