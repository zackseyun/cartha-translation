  text: And Cendebeus came to Jamnia[b][a], and began to provoke the people and to invade Judea and to take the people captive and to kill them.
translation:
  language: pt
  text: E Cendebeu chegou a Jâmnia e começou a provocar o povo, a invadir a Judeia[a], a levar o povo cativo e a matá-lo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a entrar na Judeia»; o verbo grego pode ser traduzido de forma mais literal, mas o contexto indica uma incursão militar hostil.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «matar»; em português, «-lo» retoma «o povo», objeto expresso na oração anterior e subentendido no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγενήθη
  choice: chegou
  rationale: O aoristo de παραγίνομαι indica a chegada a um lugar; «chegou» é natural e preciso na sequência narrativa.
- source_word: Κενδεβαῖος
  choice: Cendebeu
  rationale: Forma portuguesa tradicional e reconhecível do nome grego.
- source_word: Ἰαμνείαν
  choice: Jâmnia
  rationale: Forma portuguesa convencional do topônimo, com acento para indicar a pronúncia corrente.
- source_word: ἤρξατο τοῦ ἐρεθίζειν
  choice: começou a provocar
  rationale: A construção expressa o início da ação; ἐρεθίζω admite «provocar» e mantém a hostilidade sem especificar indevidamente o modo.
- source_word: τὸν λαόν
  choice: o povo
  rationale: Preserva o sentido coletivo de λαός e sua repetição no grego.
- source_word: ἐμβατεύειν εἰς τὴν Ἰουδαίαν
  choice: invadir a Judeia
  rationale: Embora o verbo possa significar literalmente entrar, o contexto de captura e morte indica uma incursão militar hostil.
- source_word: αἰχμαλωτίζειν
  choice: levar ... cativo
  rationale: Expressa claramente a captura de pessoas em contexto de guerra e mantém «o povo» como objeto explícito.
- source_word: φονεύειν
  choice: matar
  rationale: Tradução direta que evita acrescentar uma nuance jurídica; o objeto pronominal é retomado em português para completar a construção.
