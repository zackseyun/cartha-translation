  text: But[a], since we have the opportunity[b], we are holding fast to the inheritance of us and of our fathers.
translation:
  language: pt
  text: Mas nós, enquanto temos a oportunidade[a], apegamo-nos firmemente à herança[b] que pertence a nós e aos nossos pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo uma ocasião favorável” ou “enquanto dispomos de um momento oportuno”. O grego καιρὸν ἔχοντες se refere a uma ocasião propícia, não meramente ao tempo em geral.'
    reason: lexical_alternative
  - marker: b
    text: “Herança” também pode ter aqui o sentido de posse hereditária ou patrimônio ancestral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mas nós
  rationale: δέ marca contraste com a declaração anterior; “Mas nós” conserva essa força adversativa em português natural.
- source_word: καιρὸν ἔχοντες
  choice: enquanto temos a oportunidade
  rationale: καιρός indica uma ocasião oportuna ou favorável, não apenas tempo cronológico. “Enquanto” preserva o valor circunstancial e temporal do particípio sem definir de modo excessivo sua relação lógica.
- source_word: ἀντεχόμεθα
  choice: apegamo-nos firmemente
  rationale: O verbo na voz média expressa adesão firme ou retenção resoluta. A formulação evita reduzir o sentido a uma reivindicação puramente jurídica.
- source_word: τῆς κληρονομίας
  choice: à herança
  rationale: κληρονομία designa herança ou posse hereditária. “Herança” é transparente e mantém aberta a nuance territorial e patrimonial do contexto.
- source_word: ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: que pertence a nós e aos nossos antepassados
  rationale: Os dois genitivos dependem da única ocorrência de κληρονομία. A oração relativa deixa claro que se trata de uma só herança vinculada tanto à geração presente quanto aos ancestrais, sem sugerir duas heranças distintas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção reflexiva “apegamo-nos” conserva a força de adesão do grego, e “antepassados” comunica naturalmente o sentido ancestral de πατέρων neste contexto.
