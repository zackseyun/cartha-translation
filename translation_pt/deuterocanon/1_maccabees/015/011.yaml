  text: And King Antiochus pursued him[a], and he came to Dora, fleeing to the seacoast.
translation:
  language: pt
  text: O rei Antíoco o perseguiu, e ele chegou a Dora, junto ao mar, fugindo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “chegou a Dora, fugindo para o lugar junto ao mar” ou “para o litoral”. A expressão grega é elíptica e pode descrever Dora como situada junto ao mar ou indicar a direção da fuga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: perseguiu
  rationale: O aoristo de διώκω indica perseguição ativa; “perseguiu” é natural em português e se ajusta ao contexto político-militar sem especificar indevidamente o modo.
- source_word: Ἀντίοχος ὁ βασιλεύς
  choice: o rei Antíoco
  rationale: A ordem com o título antes do nome é idiomática em português e comunica integralmente o grego.
- source_word: ἦλθεν εἰς Δῶρα
  choice: chegou a Dora
  rationale: Neste movimento narrativo, ἔρχομαι com εἰς é bem expresso por “chegou a”, que realça a entrada no destino sem depender do ponto de vista dêitico de “veio”.
- source_word: φεύγων
  choice: fugindo
  rationale: O particípio presente indica uma ação concomitante à chegada. “Chegou fugindo” preserva essa relação de maneira compacta e natural.
- source_word: τὴν ἐπὶ τὴν θάλασσαν
  choice: que fica à beira-mar
  rationale: A expressão elíptica aponta para a localização marítima de Dora. A formulação esclarece essa referência geográfica, mantendo em nota a possibilidade de entendê-la como direção da fuga.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa fluente. Mantém-se a repetição pronominal do grego sem identificar pelo nome o perseguido, pois o referente vem do contexto. A ambiguidade geográfica da expressão final é preservada em nota.
