  yaml_path: translation/deuterocanon/1_maccabees/015/013.yaml
  text: And Antiochus encamped against Dora[c][b][a], and with him were twelve myriads of fighting men and eight thousand cavalry.
translation:
  language: pt
  text: Antíoco acampou contra Dora[a], e com ele estavam doze miríades[b] de homens de guerra e oito mil de cavalaria[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome do lugar aparece em grego como «Dora»; algumas tradições usam «Dor».
    reason: alternative_reading
  - marker: b
    text: Isto é, cento e vinte mil. A miríade era uma unidade de dez mil.
    reason: lexical_alternative
  - marker: c
    text: O grego diz literalmente «oito mil cavalo», expressão militar coletiva que se refere a tropas montadas, isto é, à cavalaria.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: acampou contra
  rationale: O verbo indica montar acampamento, especialmente em contexto militar; com ἐπί e o nome da cidade, expressa uma posição hostil contra Dora, provavelmente no contexto de cerco.
- source_word: Δῶρα
  choice: Dora
  rationale: Reproduz diretamente a forma grega Δῶρα da fonte utilizada. A forma tradicional alternativa é «Dor».
- source_word: δώδεκα μυριάδες
  choice: doze miríades
  rationale: Preserva a expressão numérica grega, em que cada miríade corresponde a dez mil, sem converter silenciosamente a unidade antiga.
- source_word: ἀνδρῶν πολεμιστῶν
  choice: homens de guerra
  rationale: Expressa combatentes masculinos e mantém o caráter militar da construção grega em linguagem digna e clara.
- source_word: ὀκτακισχίλια
  choice: oito mil
  rationale: Tradução direta do numeral composto grego.
- source_word: ἵππος
  choice: cavalaria
  rationale: Embora o substantivo signifique literalmente «cavalo», aqui é empregado coletivamente numa enumeração militar e designa tropas montadas.
