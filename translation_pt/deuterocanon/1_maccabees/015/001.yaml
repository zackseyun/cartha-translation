base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/001.yaml
  text: And Antiochus son of King Demetrius sent letters from the islands of the sea to Simon[a], priest and ethnarch of the Jews[b], and to all the nation.
translation:
  language: pt
  text: Antíoco, filho do rei Demétrio, enviou, das ilhas do mar, cartas a Simão, sacerdote e etnarca[a] dos judeus[b], e a toda a nação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Etnarca” é um título formal que designa o governante ou dirigente de um povo ou nação.
    reason: cultural_note
  - marker: b
    text: Ou “judeanos”; o termo grego pode designar o povo judeu em sentido étnico-religioso ou regional-político, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Forma natural e direta para o aoristo de ἀποστέλλω no contexto do envio de cartas.
- source_word: ἐπιστολάς
  choice: cartas
  rationale: O acusativo plural indica várias comunicações escritas; “cartas” é corrente e não tem o tom arcaico de “epístolas”.
- source_word: ἀπὸ τῶν νήσων τῆς θαλάσσης
  choice: das ilhas do mar
  rationale: Mantém a expressão geográfica e a construção genitiva do grego sem identificar ilhas não especificadas pelo texto.
- source_word: ἱερεῖ
  choice: sacerdote
  rationale: Dativo em aposição a Simão; a tradução sem artigo acompanha a ausência de artigo no grego e soa natural em português.
- source_word: ἐθνάρχῃ
  choice: etnarca
  rationale: Preserva o título político formal e evita impor uma estrutura constitucional mais específica, como “governador”.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: No contexto, designa amplamente o povo judeu, embora o termo grego também possa ter sentido regional-político, “judeus da Judeia” ou “judeanos”.
- source_word: παντὶ τῷ ἔθνει
  choice: a toda a nação
  rationale: Mantém o sentido corporativo e político de ἔθνος e a coordenação do segundo destinatário com Simão.
- source_word: τοῦ βασιλέως
  choice: do rei
  rationale: Reproduz de modo idiomático a relação genitiva e o título de Demétrio.
theological_decisions:
- issue: Tradução do título político ἐθνάρχης
  choice: etnarca
  alternative: governante da nação; governador
  rationale: A transliteração preserva o caráter formal e historicamente específico do cargo de Simão, sem lhe atribuir uma forma de governo mais definida do que o grego expressa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego sem rigidez. Os nomes seguem as formas portuguesas tradicionais. A colocação de “das ilhas do mar” entre vírgulas deixa claro que indica a procedência do envio.
