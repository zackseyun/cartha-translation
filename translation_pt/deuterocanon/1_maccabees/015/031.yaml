  yaml_path: translation/deuterocanon/1_maccabees/015/031.yaml
  text: But if not[a], give five hundred talents of silver in place of them, and another five hundred talents for the destruction that you have caused and for the taxes of the cities. But if not[b], they will come and make war against you.
translation:
  language: pt
  text: Mas, se não, entreguem quinhentos talentos de prata em lugar deles, e mais quinhentos talentos pela devastação que vocês causaram e pelos tributos das cidades.[a][b] Mas, se não, eles virão e farão guerra contra vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, a construção é comprimida: “e pela devastação que vocês causaram e pelos tributos das cidades, mais quinhentos talentos”. A tradução entende a soma final como um pagamento adicional que cobre tanto a devastação como os tributos das cidades.'
    reason: lexical_alternative
  - marker: b
    text: Ou “impostos das cidades”.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ μή
  choice: Mas, se não
  rationale: Preserva a transição condicional e a repetição enfática do ultimato no grego.
- source_word: δότε
  choice: entreguem
  rationale: O imperativo significa literalmente dar; “entreguem” é natural numa exigência de pagamento e mantém o tom de ordem sem reduzir o verbo apenas a “pagar”.
- source_word: ἀντʼ αὐτῶν
  choice: em lugar deles
  rationale: ἀντί indica substituição ou troca. A formulação conserva o referente masculino plural sem explicá-lo além do contexto.
- source_word: πεντακόσια τάλαντα ἀργυρίου
  choice: quinhentos talentos de prata
  rationale: Mantém a antiga unidade de peso e valor e expressa claramente que se trata de prata.
- source_word: τῆς καταφθορᾶς ἧς κατεφθάρατε
  choice: pela devastação que vocês causaram
  rationale: A combinação cognata designa ruína ou destruição provocada pelos destinatários. “Devastação” preserva a gravidade e evita uma repetição pouco natural.
- source_word: τῶν φόρων τῶν πόλεων
  choice: pelos tributos das cidades
  rationale: φόροι pode indicar impostos ou tributos; no contexto político helenístico, “tributos” comunica melhor pagamentos devidos por cidades a um poder governante.
- source_word: ἀλλὰ τάλαντα πεντακόσια
  choice: e mais quinhentos talentos
  rationale: A sintaxe contábil comprimida apresenta uma segunda soma. “Mais” torna clara a adição sem apagar a estrutura do grego.
- source_word: παραγενόμενοι
  choice: eles virão
  rationale: O particípio de chegada, ligado ao verbo principal, é vertido naturalmente como ação coordenada em português.
- source_word: ἐκπολεμήσουσιν ὑμᾶς
  choice: farão guerra contra vocês
  rationale: Expressa a ação militar hostil do verbo composto e conserva o tom formal da ameaça.
