  text: And it seemed good to us to receive the shield from them[a].
translation:
  language: pt
  text: E pareceu-nos bem receber deles o escudo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aceitar deles o escudo». O grego ἀσπίς pode designar um escudo em geral; neste contexto diplomático, talvez se refira a uma oferta honorífica, tradicionalmente entendida como um escudo de ouro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: pareceu-nos bem
  rationale: Preserva a construção impessoal e o tom formal de uma comunicação diplomática, sem substituí-la pela formulação mais interpretativa «decidimos».
- source_word: ἡμῖν
  choice: -nos
  rationale: O pronome dativo identifica o grupo a quem a decisão pareceu boa; em português, integra-se naturalmente ao verbo em «pareceu-nos».
- source_word: δέξασθαι
  choice: receber
  rationale: O infinitivo aoristo médio de δέχομαι pode significar «receber» ou «aceitar»; «receber» permanece próximo do grego e combina com o contexto de uma dádiva diplomática.
- source_word: τὴν ἀσπίδα
  choice: o escudo
  rationale: ἀσπίς designa normalmente um escudo. Embora o contexto histórico possa sugerir uma oferta honorífica, tradicionalmente entendida como um escudo de ouro, este versículo diz apenas «o escudo».
- source_word: παρʼ αὐτῶν
  choice: deles
  rationale: παρά com o genitivo indica origem ou procedência; «deles» é claro, natural e conciso em português.
