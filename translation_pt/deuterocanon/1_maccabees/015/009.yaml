  text: And when we establish our kingdom[a], we will honor you and your nation and the sanctuary with great glory[c][b], so that your glory may become evident in all the earth.
translation:
  language: pt
  text: E, quando tivermos estabelecido o nosso reino, honraremos você, a sua nação e o santuário com grande honra,[a] para que a honra de vocês se torne manifesta em toda a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “glorificaremos você, a sua nação e o santuário com grande glória [...] a glória de vocês”. O grego repete formas relacionadas de δόξα e δοξάζω; no texto principal, “honra” foi escolhida por causa do contexto diplomático e político.'
    reason: lexical_alternative
  - marker: b
    text: “Em toda a terra” também pode ser entendido como “por todo o país” ou “em todo o mundo”, pois o grego γῆ admite diferentes extensões geográficas conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστήσωμεν
  choice: tivermos estabelecido
  rationale: O aoristo do subjuntivo com ὡς ἂν indica uma contingência futura; a construção portuguesa expressa naturalmente “quando, uma vez que tenhamos estabelecido” e mantém o sentido político de consolidar o reino.
- source_word: βασιλείαν
  choice: reino
  rationale: No contexto de correspondência régia, refere-se ao domínio ou governo do remetente; “reino” preserva o sentido institucional sem restringi-lo ao ato de reinar.
- source_word: δοξάσωμέν
  choice: honraremos
  rationale: Embora o verbo possa ser traduzido por “glorificaremos”, aqui descreve a concessão pública de prestígio em contexto diplomático e político; “honraremos” é natural e não introduz uma conotação teológica desnecessária.
- source_word: ἔθνος
  choice: nação
  rationale: Designa o povo judeu como coletividade no âmbito político; “nação” corresponde ao registro diplomático da carta.
- source_word: ἱερὸν
  choice: santuário
  rationale: O termo pode indicar o templo ou todo o recinto sagrado. “Santuário” conserva essa amplitude sem especificar mais do que o grego.
- source_word: δόξῃ μεγάλῃ
  choice: com grande honra
  rationale: O dativo indica o modo ou meio pelo qual a distinção será concedida. A formulação mantém em português a ligação lexical com “honraremos” e com a ocorrência posterior de δόξα.
- source_word: φανερὰν γενέσθαι
  choice: se torne manifesta
  rationale: A construção com ὥστε exprime resultado; “se torne manifesta” comunica que a honra será publicamente visível ou reconhecida.
- source_word: τὴν δόξαν ὑμῶν
  choice: a honra de vocês
  rationale: No contexto político, δόξα denota honra, prestígio ou renome público. “De vocês” reproduz claramente o plural ὑμῶν, que abrange o destinatário e seu povo.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: em toda a terra
  rationale: Preserva a amplitude e a ambiguidade de γῆ, que pode designar terra, país ou mundo conforme o contexto.
