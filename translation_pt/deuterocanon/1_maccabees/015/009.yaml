translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O futuro composto “quando tivermos estabelecido” reproduz a contingência futura do grego. “Você” mantém o destinatário singular, enquanto “de vocês” torna visível a mudança para o plural em ὑμῶν. A repetição de “honra” procura conservar a cadeia retórica δοξάζω/δόξα sem dar ao trecho político um tom indevidamente cultual.
