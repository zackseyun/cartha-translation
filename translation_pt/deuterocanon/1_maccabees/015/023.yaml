base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/023.yaml
  text: and to all the regions[a], and to Sampsame, and to the Spartans[b], and to Delos and to Myndus and to Sicyon and to Caria and to Samos and to Pamphylia and Lycia and to Halicarnassus and to Cos and to Side and to Aradus and to Rhodes and to Phaselis and Gortyna and Cnidus and Cyprus and Cyrene.
translation:
  language: pt
  text: e a todas as regiões[a], a Sampsame[b], aos espartanos, a Delos, a Mindos, a Sicião, à Cária, a Samos, à Panfília e à Lícia, a Halicarnasso, a Cós, a Side, a Arado, a Rodes, a Fasélis, a Gortina, a Cnido, a Chipre e a Cirene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns topônimos também aparecem com outras grafias em português, como Cos para Cós e Knidos para Cnido.
    reason: lexical_alternative
  - marker: b
    text: A identificação e a forma do topônimo Sampsame são incertas; a tradução segue de perto a forma grega.
    reason: cultural_note
lexical_decisions:
- source_word: πάσας τὰς χώρας
  choice: todas as regiões
  rationale: χώρα pode indicar região, território ou país. “Regiões” é abrangente e evita a ideia anacrônica de Estados nacionais modernos.
- source_word: Σαμψάμῃ
  choice: Sampsame
  rationale: Nome próprio de identificação incerta; conserva-se uma transliteração próxima da forma grega, sem tentar identificá-lo de maneira conjectural.
- source_word: Σπαρτιάταις
  choice: aos espartanos
  rationale: O plural étnico designa o povo de Esparta, e não apenas a cidade.
- source_word: καὶ εἰς ...
  choice: e a ... / aos ...
  rationale: Nesta lista administrativa, εἰς indica os destinos ou destinatários da correspondência. Em português, a preposição “a” expressa isso naturalmente; as contrações são usadas quando exigidas pelo idioma.
- source_word: τὴν Καρίδα
  choice: Cária
  rationale: Refere-se à região histórica da Cária; emprega-se a forma portuguesa consagrada.
- source_word: τὴν Παμφυλίαν καὶ Λυκίαν
  choice: Panfília e Lícia
  rationale: São nomes de regiões históricas, vertidos pelas formas portuguesas usuais.
- source_word: Κῶ
  choice: Cós
  rationale: Usa-se a forma portuguesa tradicional do nome da ilha grega; também ocorre a grafia “Cos”.
- source_word: Ἄραδον
  choice: Arado
  rationale: Adota-se a forma portuguesa do topônimo helenizado Aradus, mantendo-o distinto de possíveis identificações modernas.
- source_word: τὴν Φασηλίδα
  choice: Fasélis
  rationale: Forma portuguesa corrente para o topônimo grego Φασηλίς.
- source_word: Κνίδον
  choice: Cnido
  rationale: Forma portuguesa tradicional do nome da cidade grega, próxima da transliteração do original.
