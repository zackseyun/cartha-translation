translation_notes:
  register: Português moderno, formal e acessível, com sintaxe adequada a uma comunicação diplomática. Emprega-se 'países' para os destinatários políticos e 'territórios' para as terras pertencentes aos judeus, preservando a amplitude semântica de χώρα por meio da nota.
