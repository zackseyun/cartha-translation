base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/019.yaml
  text: It therefore seemed good to us to write to the kings and the countries[a], that they should not seek harm against them, and should not make war against them and their cities and their countries[b], and that they should not join in alliance with those who are making war against them.
translation:
  language: pt
  text: Por isso, pareceu-nos bem escrever aos reis e aos países[a], para que não procurassem causar-lhes mal, nem fizessem guerra contra eles, contra suas cidades e contra seus territórios[b], e para que não se aliassem aos que guerreavam contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego χώρα pode significar “país”, “terra”, “região” ou “território”. Aqui, refere-se aos territórios políticos que receberiam a carta.
    reason: lexical_alternative
  - marker: b
    text: O texto impresso de Swete traz a letra “A” antes de “cidades”, ao que tudo indica por problema editorial ou de transcrição. Pelo contexto, o sentido é “suas cidades”.
    reason: textual_variant
lexical_decisions:
- source_word: ἤρεσεν οὖν ἡμῖν
  choice: Por isso, pareceu-nos bem
  rationale: Preserva a fórmula deliberativa e oficial do grego, em português natural e digno.
- source_word: γράψαι τοῖς βασιλεῦσιν καὶ ταῖς χώραις
  choice: escrever aos reis e aos países
  rationale: Mantém o sentido direto de γράψαι e entende χώραι, em paralelo com reis, como entidades territoriais destinatárias da correspondência.
- source_word: μὴ ἐκζητήσωσιν αὐτοῖς κακά
  choice: para que não procurassem causar-lhes mal
  rationale: Expressa a busca ativa de dano indicada por ἐκζητέω com κακά, evitando o lusismo pouco natural 'buscar males contra eles'.
- source_word: μὴ πολεμήσωσιν αὐτοὺς
  choice: nem guerreassem contra eles
  rationale: Verte de modo conciso o sentido político-militar de πολεμέω.
- source_word: τὰς πόλεις αὐτῶν καὶ τὰς χώρας αὐτῶν
  choice: suas cidades e seus territórios
  rationale: πόλεις é naturalmente 'cidades'; na segunda ocorrência, χώρα designa as terras sob domínio deles, para as quais 'territórios' é mais claro em português.
- source_word: μὴ συμμαχώσιν τοῖς πολεμοῦσιν αὐτούς
  choice: não se aliassem aos que guerreavam contra eles
  rationale: συμμαχέω indica prestar apoio como aliado; a formulação conserva a dimensão formal e militar, enquanto o particípio presente descreve os que estavam em guerra contra eles.
