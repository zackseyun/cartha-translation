  yaml_path: translation/deuterocanon/1_maccabees/015/007.yaml
  text: But Jerusalem and the holy places are to be free; and all the weapons that you have made[a], and the strongholds that you have built, which you hold, shall remain yours.
translation:
  language: pt
  text: Jerusalém, porém, e os lugares santos[a] serão livres; e todas as armas que você fabricou, bem como as fortificações que construiu e que mantém sob seu controle, continuarão sendo suas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o santuário” ou “as coisas santas”. O plural grego τὰ ἅγια pode referir-se tanto aos recintos sagrados como a objetos santos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
- source_word: τὰ ἅγια
  choice: os lugares santos
  rationale: O plural neutro pode designar os recintos sagrados ou as coisas santas. No contexto político e territorial da liberdade de Jerusalém e dos direitos de posse, “os lugares santos” preserva a amplitude da expressão sem limitá-la ao edifício do santuário.
- source_word: ἐλεύθερα
  choice: livres
  rationale: Expressa diretamente a liberdade concedida, que no contexto pode envolver isenção de obrigações ou de interferência régia.
- source_word: ὅπλα
  choice: armas
  rationale: Termo claro e corrente para o equipamento militar referido no contexto.
- source_word: κατεσκεύασας
  choice: preparou
  rationale: O verbo pode significar fazer, preparar ou equipar; “preparou” mantém essa amplitude e combina naturalmente com armas.
- source_word: ὀχυρώματα
  choice: fortificações
  rationale: Designa estruturas ou lugares fortificados; “fortificações” é preciso, natural e não restringe a referência a grandes fortalezas.
- source_word: ᾠκοδόμησας
  choice: construiu
  rationale: Equivalente direto e natural do verbo grego no contexto de obras defensivas.
- source_word: ὧν κρατεῖς
  choice: mantém sob seu controle
  rationale: κρατέω indica aqui posse ou controle efetivo das fortificações; a formulação explicita esse sentido político-militar.
- source_word: μενέτω σοι
  choice: continuarão sendo suas
  rationale: O imperativo singular tem sentido coletivo após os substantivos neutros plurais e confirma a continuidade da posse; a tradução comunica com naturalidade a força concessiva da declaração.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conservou-se o tom de concessão política e jurídica, sem eliminar a ambiguidade de τὰ ἅγια; “você” torna explícito o destinatário singular de modo natural no português contemporâneo.
