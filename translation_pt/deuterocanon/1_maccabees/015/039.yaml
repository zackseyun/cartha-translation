  yaml_path: translation/deuterocanon/1_maccabees/015/039.yaml
  text: And he commanded him to encamp opposite Judea[a]; and he commanded him to build Kedron and fortify the cities, and to fight against the people[b]. But the king was pursuing Tryphon.
translation:
  language: pt
  text: E ordenou-lhe que acampasse em frente à Judeia[a]. Ordenou-lhe também que construísse Kedron[b], fortificasse as cidades e guerreasse contra o povo. Mas o rei perseguia Trifão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante da Judeia”. A expressão grega indica posição espacial, em frente ou diante da Judeia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “reconstruísse Kedron”. O verbo grego não especifica se o lugar seria construído pela primeira vez ou restaurado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: ordenou-lhe
  rationale: Preserva a força autoritativa do verbo e a referência explícita ao destinatário.
- source_word: παρεμβάλλειν
  choice: que acampasse
  rationale: Expressa com naturalidade o ato de estabelecer acampamento em contexto militar.
- source_word: κατὰ πρόσωπον τῆς Ἰουδαίας
  choice: em frente à Judeia
  rationale: Mantém o sentido espacial da expressão grega sem antecipar, nessa locução, a hostilidade declarada depois.
- source_word: οἰκοδομῆσαι
  choice: que construísse
  rationale: Traduz diretamente o ato de edificar, sem decidir se se tratava de construção inicial ou reconstrução.
- source_word: τὴν Κεδρὼν
  choice: Kedron
  rationale: Translitera o topônimo grego e evita identificá-lo indevidamente com outro lugar de nome tradicional semelhante.
- source_word: ὀχυρῶσαι
  choice: fortificasse
  rationale: É o equivalente português preciso para tornar cidades militarmente defensáveis.
- source_word: ὅπως πολεμῇ τὸν λαόν
  choice: e guerreasse contra o povo
  rationale: Comunica a finalidade militar hostil; a coordenação em português conserva a sequência das ordens.
- source_word: τὸν λαόν
  choice: o povo
  rationale: Mantém a referência coletiva ao povo judeu sem introduzir o sentido político moderno de 'nação'.
- source_word: ἐδίωκε
  choice: perseguia
  rationale: O imperfeito português preserva a ação contínua indicada pelo imperfeito grego.
- source_word: Τρύφωνα
  choice: Trifão
  rationale: Emprega a forma portuguesa natural do nome grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de ἐνετείλατο foi parcialmente preservada por “Ordenou-lhe também”, evitando uma frase excessivamente pesada. “Enquanto isso” explicita apenas a simultaneidade já sugerida pelo imperfeito, sem alterar o contraste narrativo.
