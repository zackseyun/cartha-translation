base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/003.yaml
  text: Since certain pestilent men seized control of the kingdom of our fathers[a], and I want to reclaim the kingdom so that I may restore it as it was before, I have enlisted a multitude of forces and equipped warships[c][b];
translation:
  language: pt
  text: Visto que certos homens perniciosos tomaram o controle do reino de nossos pais[a], e eu quero reivindicar o reino para restaurá-lo ao estado em que se encontrava antes, recrutei numerosas tropas[b] e preparei navios de guerra[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certas pestes apoderaram-se do reino de nossos pais”. O grego emprega λοιμοί, literalmente “pestes” ou “pragas”, aqui provavelmente como expressão pejorativa para pessoas nocivas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “alistei muitas forças”; o verbo pode sugerir o recrutamento de soldados estrangeiros ou mercenários.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “equipei” ou “construí navios de guerra”; o verbo grego pode indicar tanto preparar e equipar quanto construir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: Visto que
  rationale: Introduz a causa declarada para as ações do pretendente ao trono, em português natural e digno.
- source_word: τινες λοιμοὶ
  choice: certos homens perniciosos
  rationale: λοιμοί significa literalmente pestes, mas aqui funciona como designação metafórica e pejorativa de pessoas nocivas; a tradução explicita o referente humano sem perder o insulto.
- source_word: κατεκράτησαν
  choice: tomaram o controle de
  rationale: Com o genitivo, exprime domínio ou posse efetiva; a formulação comunica a tomada política do reino.
- source_word: τῆς βασιλείας τῶν πατέρων ἡμῶν
  choice: do reino de nossos pais
  rationale: Preserva a construção dinástica e ancestral do grego sem substituir 'pais' por uma interpretação mais abstrata.
- source_word: βούλομαι δὲ ἀντιποιήσασθαι τῆς βασιλείας
  choice: e eu quero reivindicar o reino
  rationale: ἀντιποιέομαι com genitivo indica reclamar ou reivindicar para si, possivelmente com ideia de direito; 'reivindicar' preserva melhor essa nuance do que uma afirmação inequívoca de recuperação legítima.
- source_word: ὅπως ἀποκαταστήσω αὐτὴν ὡς ἦν τὸ πρότερον
  choice: para restaurá-lo ao estado em que se encontrava antes
  rationale: Expressa com clareza tanto a finalidade quanto a restauração à condição anterior.
- source_word: ἐξενολόγησα πλῆθος δυνάμεων
  choice: recrutei numerosas tropas
  rationale: O verbo é militar e pode envolver forças estrangeiras ou mercenárias, mas isso não precisa ser imposto no texto principal; πλῆθος e δυνάμεων são vertidos de modo idiomático.
- source_word: κατεσκεύασα πλοῖα πολεμικά
  choice: preparei navios de guerra
  rationale: κατασκευάζω pode significar preparar, equipar ou construir; 'preparei' conserva deliberadamente essa amplitude.
theological_decisions: []
