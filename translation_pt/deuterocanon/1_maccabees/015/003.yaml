  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período mantém o encadeamento retórico do grego e o ponto e vírgula final, pois o versículo continua a frase. 'Reivindicar' preserva a alegação política do locutor sem confirmar narrativamente a legitimidade dela.
