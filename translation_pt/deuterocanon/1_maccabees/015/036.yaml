  text: But he turned back to the king in anger[a], and reported to him these words and the splendor of Simon and everything that he had seen; and the king became very angry.
translation:
  language: pt
  text: Ele, porém, voltou ao rei, irado, e lhe relatou estas palavras, o esplendor de Simão[a] e tudo o que tinha visto; e o rei ficou muito irado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a glória de Simão”. O termo grego δόξα pode indicar honra, glória ou magnificência visível; aqui, provavelmente se refere à impressionante magnificência de Simão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: voltou
  rationale: O aoristo indica o movimento de retorno ao rei; “voltou” é claro, natural e preserva o sentido contextual.
- source_word: μετὰ θυμοῦ
  choice: irado
  rationale: A expressão indica a maneira como ele voltou. “Irado” transmite com concisão a forte emoção de θυμός e mantém um registro digno.
- source_word: ἀπήγγειλεν
  choice: relatou
  rationale: O verbo descreve a transmissão ao rei do que havia sido dito e observado; “relatou” se ajusta naturalmente ao contexto.
- source_word: τοὺς λόγους τούτους
  choice: estas palavras
  rationale: A tradução conserva a referência concreta às declarações anteriores, sem generalizá-las como simples assuntos ou mensagem.
- source_word: τὴν δόξαν Σίμωνος
  choice: o esplendor de Simão
  rationale: Neste contexto narrativo, δόξα provavelmente aponta para a grandeza ou magnificência visível associada a Simão. A nota preserva a amplitude lexical do termo.
- source_word: πάντα ὅσα εἶδεν
  choice: tudo o que tinha visto
  rationale: A formulação é abrangente e o mais-que-perfeito composto deixa clara a anterioridade da observação em relação ao relato.
- source_word: ὠργίσθη ὁ βασιλεὺς ὀργὴν μεγάλην
  choice: o rei ficou muito irado
  rationale: A construção cognata grega intensifica a ira. Esta formulação reproduz a ênfase em português natural, sem imitar de modo artificial a repetição do original.
