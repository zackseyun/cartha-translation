  text: And Simon answered and said to him[a], “We have neither taken foreign land nor seized what belongs to others, but only the inheritance of our fathers[b], which at one time was unjustly taken over by our enemies.”
translation:
  language: pt
  text: 'E Simão lhe respondeu: “Não tomamos terra alheia nem nos apoderamos do que pertence a outros, mas sim a herança de nossos pais, que, em certa ocasião, foi tomada injustamente[a] por nossos inimigos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi tomada sem julgamento” ou “foi tomada arbitrariamente”; o termo grego pode destacar tanto a injustiça quanto a ausência de julgamento adequado.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν ἀλλοτρίαν
  choice: terra alheia
  rationale: Expressa de modo natural que a terra pertence a outros, evitando que “estrangeira” seja entendida apenas em sentido geográfico ou étnico.
- source_word: εἴλημμεν
  choice: tomamos
  rationale: O perfeito indica uma ação de tomar cujos efeitos permanecem; em português, o pretérito no contexto da negação comunica isso naturalmente.
- source_word: ἀλλοτρίων
  choice: o que pertence a outros
  rationale: Torna explícita a elipse grega sem restringi-la indevidamente apenas à terra ou a estrangeiros.
- source_word: κεκρατήκαμεν
  choice: nos apoderamos
  rationale: Conserva a ideia de obter domínio ou posse, adequada ao contexto territorial e político.
- source_word: κληρονομίας τῶν πατέρων ἡμῶν
  choice: herança de nossos pais
  rationale: Mantém tanto a noção de posse herdada quanto a referência masculina aos antepassados presente no grego.
- source_word: ἀκρίτως
  choice: injustamente
  rationale: Comunica com clareza a ausência de julgamento justo ou de direito legítimo, sem limitar o sentido ao procedimento jurídico.
- source_word: ἐν τινι καιρῷ
  choice: em certa ocasião
  rationale: Preserva a referência temporal indefinida; o sintagma indica um tempo não especificado, não necessariamente a duração “por algum tempo”.
- source_word: κατεκρατήθη
  choice: foi tomada
  rationale: A voz passiva descreve a herança dominada ou subjugada pelos inimigos; “foi tomada” é natural e mantém a conexão territorial.
theological_decisions:
- issue: A natureza da reivindicação ancestral
  choice: mas da herança de nossos pais
  alternative: mas apenas nossa herança ancestral
  rationale: A tradução preserva a justificativa patrimonial expressa no texto, sem acrescentar uma interpretação teológica ou nacionalista.
- issue: A referência masculina de πατέρων
  choice: nossos pais
  alternative: nossos antepassados
  rationale: “Pais” acompanha mais formalmente o masculino plural do original e conserva sua ressonância familiar, embora “antepassados” também seja semanticamente possível.
- issue: Relação lógica de ἀλλά após a dupla negação
  choice: mas da herança de nossos pais
  alternative: mas somente tomamos a herança de nossos pais
  rationale: A elipse verbal é mantida de modo natural, sem inserir “somente”, que não aparece explicitamente no grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Terra alheia” preserva o paralelismo com “o que pertence a outros”; “em certa ocasião” mantém a indefinição temporal do grego.
