  yaml_path: translation/deuterocanon/1_maccabees/015/017.yaml
  text: The envoys of the Jews came to us as our friends and allies[a], renewing the friendship and alliance from the beginning, having been sent by Simon the high priest and by the people of the Jews[b];
translation:
  language: pt
  text: Os emissários[a] dos judeus vieram até nós como nossos amigos e aliados, renovando a amizade e a aliança que existiam desde o princípio. Eles haviam sido enviados por Simão, o sumo sacerdote, e pelo povo judeu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “embaixadores”; o termo grego designa representantes diplomáticos oficiais.
    reason: lexical_alternative
  - marker: b
    text: “Povo judeu” também pode ser traduzido como “nação judaica” ou “assembleia dos judeus”, pois o termo grego pode designar o povo constituído como corpo cívico.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβευταὶ
  choice: emissários
  rationale: Designa representantes diplomáticos oficiais. “Emissários” é claro e atual, sem perder o caráter oficial do termo.
- source_word: φίλοι
  choice: amigos
  rationale: Preserva o sentido direto do substantivo e, no contexto, permite a conotação diplomática de amizade reconhecida.
- source_word: σύμμαχοι
  choice: aliados
  rationale: É o equivalente corrente para o termo político-militar que designa participantes de uma aliança.
- source_word: ἀνανεούμενοι
  choice: renovando
  rationale: Reproduz diretamente a ideia de tornar nova outra vez uma relação já existente.
- source_word: ἐξ ἀρχῆς
  choice: desde o princípio
  rationale: Mantém a referência à origem da relação sem substituir a expressão por uma interpretação mais específica.
- source_word: φιλίαν
  choice: amizade
  rationale: É o equivalente direto e inteligível, inclusive para uma relação diplomática formal.
- source_word: συμμαχίαν
  choice: aliança
  rationale: Expressa naturalmente o vínculo político formal indicado pelo substantivo grego.
- source_word: ἀπεσταλμένοι
  choice: haviam sido enviados
  rationale: Preserva a voz passiva e a anterioridade do envio em relação à chegada, de modo natural em português.
- source_word: Σιμωνος τοῦ ἀρχιερέως
  choice: Simão, o sumo sacerdote
  rationale: Usa a forma portuguesa tradicional do nome e o equivalente estabelecido de ἀρχιερεύς.
- source_word: τοῦ δήμου τῶν Ἰουδαίων
  choice: pelo povo judeu
  rationale: Conserva o sentido coletivo e cívico de δῆμος sem impor uma estrutura constitucional específica.
