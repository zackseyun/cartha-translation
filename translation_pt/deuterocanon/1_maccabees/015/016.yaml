lexical_decisions:
- source_word: Λεύκιος
  choice: Lúcio
  rationale: Forma portuguesa tradicional do nome latino Lucius, apropriada a uma personagem romana.
- source_word: ὕπατος
  choice: cônsul
  rationale: Designa aqui o cargo romano de consul; «cônsul» é o equivalente histórico preciso em português.
- source_word: Ῥωμαίων
  choice: dos romanos
  rationale: Reproduz explicitamente o genitivo plural e identifica o povo cujo magistrado é Lúcio.
- source_word: Πτολεμαίῳ
  choice: Ptolemeu
  rationale: Forma portuguesa consagrada do nome régio, no dativo como destinatário da carta.
- source_word: βασιλεῖ
  choice: rei
  rationale: Preserva diretamente o título real em aposição a Ptolemeu.
- source_word: χαίρειν
  choice: saudações
  rationale: Equivale naturalmente à fórmula convencional de abertura epistolar grega; uma tradução literal como «alegrar-se» seria enganosa neste contexto.
