  text: And he was not willing to accept them[a], but rejected everything that he had previously agreed to with him[b], and became estranged from him.
translation:
  language: pt
  text: E ele não estava disposto a aceitar nada disso, mas rejeitou tudo o que antes havia acordado com ele[a] e foi se afastando dele[b].
  philosophy: optimal-equivalence
  footnotes:
