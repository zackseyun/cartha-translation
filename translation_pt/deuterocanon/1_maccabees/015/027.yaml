lexical_decisions:
- source_word: οὐκ ἠβούλετο αὐτὰ δέξασθαι
  choice: não quis aceitar nada disso
  rationale: Expressa de modo natural a recusa indicada por βούλομαι + δέχομαι e mantém αὐτά abrangente, sem especificar além do contexto quais ofertas ou providências foram recusadas.
- source_word: ἠθέτησεν
  choice: invalidou
  rationale: O verbo pode indicar rejeitar, pôr de lado ou tornar sem efeito. “Invalidou” comunica que os entendimentos anteriores deixaram de valer, sem introduzir terminologia denominacional.
- source_word: πάντα ὅσα συνέθετο αὐτῷ τὸ πρότερον
  choice: tudo o que antes havia acordado com ele
  rationale: A forma média de συντίθημι tem sentido de chegar a um acordo; a formulação preserva a abrangência de πάντα e a anterioridade de τὸ πρότερον.
- source_word: ἠλλοτριοῦτο αὐτῷ
  choice: foi se afastando dele
  rationale: O imperfeito sugere um processo de alienação ou distanciamento. A expressão portuguesa preserva esse aspecto progressivo e não exagera a ruptura como hostilidade aberta.
