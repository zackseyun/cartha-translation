  text: For he knew that troubles had gathered against him[b][a], and the forces had abandoned him.
translation:
  language: pt
  text: Pois ele sabia que males se haviam acumulado contra ele[a] e que as tropas o haviam abandonado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “calamidades se haviam reunido contra ele”. O verbo grego sugere males ou adversidades que se juntaram de modo concentrado.
    reason: lexical_alternative
  - marker: b
    text: Ou “as forças o haviam abandonado”. O termo grego é militar e se refere ao apoio armado com que ele contava.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: sabia
  rationale: A forma passada de οἶδα expressa um estado de conhecimento e corresponde naturalmente a “sabia”.
- source_word: ἐπισυνῆκται
  choice: se haviam acumulado
  rationale: O perfeito médio/passivo de ἐπισυνάγω indica um estado resultante de reunião ou concentração; com κακά, “se haviam acumulado” soa natural e preserva a ideia de adversidades concentradas contra ele.
- source_word: ἐπʼ αὐτόν
  choice: contra ele
  rationale: Com κακά e o verbo de reunião, ἐπί com acusativo tem sentido hostil, expresso idiomaticamente por “contra ele”.
- source_word: κακά
  choice: males
  rationale: O termo é amplo e aqui designa adversidades ou calamidades, não necessariamente mal moral; “males” preserva essa amplitude e a concisão do grego.
- source_word: ἀφῆκαν
  choice: haviam abandonado
  rationale: O aoristo de ἀφίημι indica que o apoio militar o deixou ou desertou; “haviam abandonado” explicita a situação já estabelecida.
- source_word: αἱ δυνάμεις
  choice: as tropas
  rationale: No contexto militar, δυνάμεις refere-se às forças armadas ou tropas. “As tropas” é claro e corrente, sem acrescentar o possessivo ausente do grego.
