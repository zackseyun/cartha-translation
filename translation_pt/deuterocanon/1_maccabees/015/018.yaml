translation:
  language: pt
  text: E trouxeram um escudo de ouro no valor de cinco mil minas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um escudo de ouro de cinco mil minas”. A expressão grega pode ser traduzida de maneira mais formal, mas provavelmente indica aqui o valor do escudo.'
