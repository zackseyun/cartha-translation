lexical_decisions:
- source_word: ἤνεγκαν
  choice: trouxeram
  rationale: O aoristo de φέρω descreve a ação narrativa simples de levar e entregar o presente. “Trouxeram” é natural em português e evita explicitar indevidamente uma apresentação formal.
- source_word: ἀσπίδα
  choice: escudo
  rationale: É o equivalente comum e historicamente adequado, sem a especificidade excessiva de termos como “broquel”.
- source_word: χρυσῆν
  choice: de ouro
  rationale: Expressa de modo natural em português o material ou caráter valioso do escudo e se ajusta à indicação de valor que vem em seguida.
- source_word: ἀπὸ μνῶν πεντακισχιλίων
  choice: no valor de cinco mil minas
  rationale: Embora a construção use literalmente ἀπό com uma quantia, neste contexto de presente diplomático ela provavelmente indica avaliação ou custo. A formulação comunica esse sentido sem converter a unidade antiga.
- source_word: μνῶν
  choice: minas
  rationale: Mantém transliterada a antiga unidade de peso ou valor, preservando a especificidade histórica e evitando equivalências modernas inexatas.
