  text: And Simon sent him two thousand chosen men to fight alongside him[b][a], and silver and gold and sufficient equipment.
translation:
  language: pt
  text: E Simão lhe enviou dois mil homens escolhidos para lutar ao seu lado[a], e prata, ouro e equipamento suficiente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para se aliarem a ele” ou “para ajudá-lo”. O verbo grego pode indicar apoio aliado em sentido mais amplo; neste contexto, provavelmente se refere a auxílio militar.
    reason: lexical_alternative
  - marker: b
    text: Ou “suprimentos suficientes”. O termo grego para “equipamento” é amplo e pode designar equipamento, utensílios, apetrechos ou suprimentos, conforme o contexto; o qualificativo indica que eram suficientes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo direto e natural para o verbo grego de enviar.
- source_word: διαχιλίους ἄνδρας
  choice: dois mil homens
  rationale: Preserva o substantivo explícito ἄνδρας sem acrescentar “soldados”, embora o contexto seja militar.
- source_word: ἐκλεκτούς
  choice: escolhidos
  rationale: Mantém a ideia de homens selecionados sem afirmar explicitamente que constituíam uma tropa de elite.
- source_word: συμμαχῆσαι αὐτῷ
  choice: para lutar ao seu lado
  rationale: Expressa naturalmente o apoio armado indicado pelo verbo no contexto, preservando em nota seu sentido mais amplo de prestar auxílio como aliado.
- source_word: ἀργύριον
  choice: prata
  rationale: Conserva o sentido concreto do grego, especialmente por estar em paralelo com ouro.
- source_word: χρυσίον
  choice: ouro
  rationale: Equivalente lexical direto.
- source_word: σκεύη ἱκανά
  choice: equipamento suficiente
  rationale: No contexto de apoio militar, “equipamento” representa bem o termo amplo σκεύη, enquanto ἱκανά indica quantidade adequada.
