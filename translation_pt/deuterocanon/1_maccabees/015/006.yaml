  text: produzir moeda própria como moeda corrente do seu país;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cunhar moeda própria para servir de moeda corrente em seu país”. O grego emprega um verbo geral (“fazer” ou “produzir”) junto de termos referentes a dinheiro cunhado e moeda corrente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: produzir
  rationale: O infinitivo aoristo de ποιέω tem o sentido geral de fazer ou produzir. “Produzir” soa natural em português neste contexto administrativo sem especificar no verbo, por si só, o ato técnico de cunhar.
- source_word: κόμμα
  choice: moeda
  rationale: Neste contexto, κόμμα designa dinheiro cunhado ou emissão monetária. “Moeda” pode funcionar coletivamente em português e evita a expressão técnica e menos acessível “cunhagem monetária”.
- source_word: ἴδιον
  choice: própria
  rationale: Expressa aquilo que pertence especificamente ao destinatário ou é emitido por sua própria autoridade.
- source_word: νόμισμα
  choice: moeda corrente
  rationale: νόμισμα indica dinheiro reconhecido e em circulação. “Moeda corrente” distingue essa função do dinheiro cunhado mencionado por κόμμα.
- source_word: τῆς χώρας σου
  choice: do seu país
  rationale: No contexto político e territorial, χώρα é comunicada naturalmente por “país”; o possessivo preserva a referência direta ao território do destinatário.
