base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/015/029.yaml
  text: You have laid waste their borders[a], and you have inflicted a great blow on the land[c][b], and you have gained control of many places in my kingdom.
translation:
  language: pt
  text: Vocês devastaram as regiões fronteiriças deles[a], desferiram um grande golpe contra a terra[b] e assumiram o controle de muitos lugares no meu reino[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “devastaram o território deles”; o grego pode designar limites, regiões fronteiriças ou território.
    reason: lexical_alternative
  - marker: b
    text: Ou “causaram grande dano à terra”; a palavra grega traduzida como “golpe” também pode significar ferida, dano ou praga, conforme o contexto.
    reason: lexical_alternative
  - marker: c
    text: Ou “passaram a dominar muitos lugares no meu reino”; o verbo grego indica exercer domínio ou senhorio.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὅρια αὐτῶν
  choice: as regiões fronteiriças deles
  rationale: ὅρια pode indicar limites, fronteiras ou as zonas territoriais junto a eles. “Regiões fronteiriças” mantém o sentido geopolítico e permite que sejam devastadas de modo natural em português.
- source_word: ἠρημώσατε
  choice: devastaram
  rationale: O verbo descreve tornar desolado ou arruinar. “Devastaram” transmite com clareza a força da ação militar.
- source_word: πληγὴν μεγάλην
  choice: um grande golpe
  rationale: πληγή pode significar golpe, ferida, dano ou praga. Neste protesto político-militar, “grande golpe” preserva a imagem do grego sem sugerir necessariamente uma epidemia.
- source_word: ἐπὶ τῆς γῆς
  choice: contra a terra
  rationale: γῆ se refere aqui à terra ou ao território atingido. Com “desferiram um golpe”, a preposição “contra” produz uma construção portuguesa natural.
- source_word: ἐκυριεύσατε
  choice: assumiram o controle de
  rationale: O verbo indica exercer domínio ou tornar-se senhor de algo. A formulação escolhida comunica domínio efetivo sem afirmar mais do que o texto sobre soberania formal.
- source_word: τόπων πολλῶν
  choice: muitos lugares
  rationale: τόποι é um termo amplo para lugares ou localidades; “muitos lugares” evita especificar indevidamente regiões administrativas.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: no meu reino
  rationale: βασιλεία designa aqui o domínio territorial do rei; “meu reino” é direto e adequado ao contexto.
