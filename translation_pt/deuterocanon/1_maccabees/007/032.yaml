  text: at Chaphar-salama. And about five thousand men of those with Nicanor fell[a], and they fled into the city of David.
translation:
  language: pt
  text: em Carfarassaramá.[a] Cerca de cinco mil homens dos que estavam com Nicanor tombaram, e eles fugiram para a Cidade de Davi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome do lugar, Carfarassaramá, representa um topônimo grego de forma difícil (Χαρφαρασαραμά); outras transliterações são possíveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: em
  rationale: Diante do topônimo, a preposição indica aqui o local do confronto; “em” é conciso e natural no contexto narrativo.
- source_word: Χαρφαρασαραμά
  choice: Carfarassaramá
  rationale: O topônimo grego é de forma difícil. A opção o translitera de maneira legível em português, sem tentar lhe atribuir um significado incerto.
- source_word: ἔπεσαν
  choice: tombaram
  rationale: Em relato militar, “tombaram” expressa de modo idiomático a morte em combate e mantém a concisão do grego.
- source_word: τῶν παρὰ Νικάνορος
  choice: dos que estavam com Nicanor
  rationale: Reproduz de perto a referência aos homens que acompanhavam Nicanor, sem tornar a expressão mais possessiva do que o original.
- source_word: ὡς πεντακισχίλιοι ἄνδρες
  choice: Cerca de cinco mil homens
  rationale: ὡς diante do numeral indica aproximação; “cerca de” preserva que o número não é exato.
- source_word: ἔφυγον
  choice: eles fugiram
  rationale: Mantém a formulação breve e a mudança implícita de referente do grego, sem acrescentar “os restantes”, embora sejam evidentemente os sobreviventes.
- source_word: εἰς τὴν πόλιν Δαυείδ
  choice: para a Cidade de Davi
  rationale: Indica movimento em direção ao interior da cidade. “Cidade de Davi” é uma designação descritiva estabelecida e, por isso, é traduzida.
