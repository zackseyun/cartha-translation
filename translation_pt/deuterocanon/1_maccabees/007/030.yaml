  yaml_path: translation/deuterocanon/1_maccabees/007/030.yaml
  text: And the matter became known to Judas[a], that he had come against him with deceit; and he was alarmed because of him, and no longer wished to see his face.
translation:
  language: pt
  text: E Judas ficou sabendo que ele tinha vindo contra ele com engano; ficou alarmado por causa dele e não quis mais ver o rosto dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος τῷ Ἰούδα
  choice: Judas ficou sabendo
  rationale: A construção passiva indica que a informação chegou ao conhecimento de Judas. Em português corrente, a formulação ativa é mais natural e não introduz um informante inexistente no grego.
- source_word: μετὰ δόλου
  choice: com engano
  rationale: Reproduz diretamente a ideia de ação enganosa sem intensificá-la para 'traição' ou recorrer ao menos corrente 'dolo'.
- source_word: ἦλθεν ἐπ’ αὐτόν
  choice: tinha vindo contra si
  rationale: O contexto confere sentido hostil a ἐπί, e o mais-que-perfeito composto deixa clara a anterioridade da vinda em relação à descoberta de Judas. 'Si' identifica Judas como alvo sem tornar ambíguo o referente.
- source_word: ἐπτοήθη ἀπ’ αὐτοῦ
  choice: ficou alarmado por causa dele
  rationale: Expressa a perturbação séria indicada pelo verbo sem exagerá-la como terror; 'por causa dele' comunica a fonte ou causa marcada por ἀπό.
- source_word: οὐκ ἠβουλήθη ἔτι
  choice: não quis mais
  rationale: Forma portuguesa natural para a decisão de não manter o encontro ou contato dali em diante.
- source_word: ἰδεῖν τὸ πρόσωπον αὐτοῦ
  choice: vê-lo face a face
  rationale: Conserva a imagem do rosto presente no grego, enquanto comunica naturalmente em português a ideia de encontrar-se pessoalmente com ele.
