base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/009.yaml
  text: And he sent him and Alcimus the ungodly[a], and established the priesthood for him[b], and commanded him to carry out vengeance on the sons of Israel.
translation:
  language: pt
  text: E ele enviou-o com Álcimo, o ímpio, e estabeleceram-lhe o sacerdócio[a]; e ordenou-lhe que exercesse vingança entre os filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “designaram-no para o sacerdócio”. O grego diz literalmente “estabeleceram para ele o sacerdócio”, referindo-se, no contexto, à instalação de Álcimo no ofício sacerdotal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “contra os filhos de Israel”. A preposição grega pode indicar a esfera em que a vingança seria exercida; pelo contexto, está implícita uma ação hostil contra eles.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo corrente, que preserva sem acréscimos o ato de incumbir e mandar alguém.
- source_word: Ἄλκιμον
  choice: Álcimo
  rationale: Forma tradicional e natural do nome em português, com acentuação conforme a pronúncia portuguesa.
- source_word: τὸν ἀσεβῆ
  choice: o ímpio
  rationale: Preserva a censura moral e especificamente religiosa de ἀσεβής; é mais preciso que o sentido amplo de «perverso».
- source_word: ἔστησαν αὐτῷ τὴν ἱερωσύνην
  choice: confirmou-lhe o sacerdócio
  rationale: A construção grega significa estabelecer ou assegurar para Álcimo o ofício sacerdotal. «Confirmou-lhe» é natural em português e mantém a ideia de tornar firme, sem explicitar além do texto que se tratava do sumo sacerdócio.
- source_word: ἱερωσύνην
  choice: sacerdócio
  rationale: Equivalente direto do substantivo que designa a dignidade ou o ofício sacerdotal.
- source_word: ἐνετείλατο
  choice: ordenou-lhe
  rationale: Mantém a força autoritativa do verbo e explicita naturalmente em português o destinatário indicado pelo pronome grego.
- source_word: ποιῆσαι τὴν ἐκδίκησιν
  choice: executasse a vingança
  rationale: Reproduz a expressão de realizar ou aplicar vingança, preservando sua severidade.
- source_word: ἐν τοῖς υἱοῖς Ἰσραήλ
  choice: entre os filhos de Israel
  rationale: Mantém o valor locativo ou esférico de ἐν e a designação étnica formular; a leitura hostil «contra» é possível pelo contexto e consta em nota.
theological_decisions:
- issue: Epíteto pejorativo ἀσεβῆ aplicado a Álcimo
  choice: o ímpio
  alternative: o irreligioso; o perverso
  rationale: «Ímpio» conserva o juízo religioso explícito do narrador sem reduzi-lo a maldade genérica.
- issue: Sentido de ἔστησαν αὐτῷ τὴν ἱερωσύνην
  choice: confirmou-lhe o sacerdócio
  alternative: designou-o para o sacerdócio; estabeleceu para ele o sacerdócio
  rationale: A formulação escolhida comunica a instalação ou confirmação no ofício, mas evita inserir «sumo sacerdote», que não aparece expressamente neste versículo.
- issue: Força de ἐν diante de τοῖς υἱοῖς Ἰσραήλ
  choice: entre os filhos de Israel
  alternative: contra os filhos de Israel
  rationale: «Entre» preserva mais diretamente a esfera indicada pela preposição; o contexto permite entender ação hostil contra o povo, possibilidade registrada em nota para não eliminar a ambiguidade.
- issue: Designação υἱοῖς Ἰσραήλ
  choice: filhos de Israel
  alternative: israelitas
  rationale: A expressão tradicional reproduz a forma masculina e formular do grego sem neutralizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a coordenação narrativa do grego, o epíteto religioso «ímpio» e a expressão formular «filhos de Israel». As notas preservam as ambiguidades relativas à instalação sacerdotal e ao alcance da preposição ἐν.
