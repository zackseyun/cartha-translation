base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/026.yaml
  text: And the king sent Nikanor[a], one of his honored rulers, who hated and was hostile to Israel[b], and commanded him to destroy the people.
translation:
  language: pt
  text: Então o rei enviou Nicanor, um dos seus ilustres dignitários[a], que odiava Israel e lhe era hostil, e ordenou-lhe que eliminasse[b] o povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um dos seus altos oficiais de grande prestígio”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “destruísse”, “extirpasse” ou “exterminasse o povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo direto e natural para o ato de enviar alguém com uma missão.
- source_word: ὁ Βασιλεὺς
  choice: o rei
  rationale: Refere-se ao monarca reinante; a inicial minúscula é adequada em português.
- source_word: Νικάνορα
  choice: Nicanor
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἕνα τῶν ἀρχόντων αὐτοῦ τῶν ἐνδόξων
  choice: um dos seus altos oficiais ilustres
  rationale: ἄρχων designa aqui uma autoridade ou oficial de alta posição, e ἔνδοξος indica alguém ilustre ou de grande prestígio.
- source_word: μισοῦντα καὶ ἐχθραίνοντα τῷ Ἰσραήλ
  choice: que odiava Israel e lhe era hostil
  rationale: Transforma os dois particípios em oração relativa natural, preservando tanto o ódio quanto a hostilidade expressos no grego.
- source_word: ἐνετείλατο αὐτῷ
  choice: ordenou-lhe
  rationale: Mantém a força da ordem régia e identifica Nicanor como seu destinatário.
- source_word: ἐξᾶραι τὸν λαόν
  choice: que exterminasse o povo
  rationale: No contexto de hostilidade político-militar, ἐξαίρω indica eliminar ou destruir; “exterminar” comunica com clareza a gravidade da ordem.
theological_decisions:
- issue: Intensidade de ἐξᾶραι τὸν λαόν
  choice: exterminasse o povo
  alternative: eliminasse, destruísse ou extirpasse o povo
  rationale: A formulação preserva a ameaça destrutiva no contexto sem reduzir o verbo a mera remoção geográfica nem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. “Altos oficiais” evita o possível tom arcaico ou excessivamente principesco de “governantes”, enquanto a nota preserva essa alternativa. Os marcadores foram colocados junto às expressões que explicam.
