base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/022.yaml
  text: And all those who were troubling their people gathered to him[a], and they gained control of the land of Judah, and they inflicted a great blow in Israel.
translation:
  language: pt
  text: Todos os que perturbavam o seu povo se reuniram a ele, tomaram o controle da terra de Judá e infligiram um grande golpe em Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre o povo de Israel”. A expressão grega também pode indicar que o golpe ocorreu no meio do povo de Israel, e não apenas em um território.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  choice: se reuniram a ele
  rationale: Expressa o movimento de aproximação e associação indicado por πρός com acusativo, sem acrescentar a ideia mais específica de alistamento formal.
- source_word: πάντες οἱ ταράσσοντες τὸν λαὸν αὐτῶν
  choice: todos os que perturbavam o seu povo
  rationale: Mantém a força verbal do particípio ταράσσοντες e representa o possessivo αὐτῶν, evitando o rótulo mais interpretativo “agitadores”.
- source_word: κατεκράτησαν γῆν Ἰούδα
  choice: tomaram o controle da terra de Judá
  rationale: Comunica domínio efetivo sobre o território sem sugerir necessariamente posse jurídica ou permanente.
- source_word: ἐποίησαν πληγὴν μεγάλην
  choice: infligiram um grande golpe
  rationale: Reproduz de modo natural a metáfora do golpe, sem restringir πληγή a matança, praga ou devastação material.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Preserva a formulação ampla do grego, que pode indicar tanto o âmbito territorial quanto a ocorrência no meio do povo de Israel.
