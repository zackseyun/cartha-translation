  yaml_path: translation/deuterocanon/1_maccabees/007/020.yaml
  text: And he appointed Alcimus over the country, and left with him a force to help him; and Bacchides went away to the king.
translation:
  language: pt
  text: E ele nomeou Álcimo para governar o país e deixou com ele uma força para ajudá-lo; Báquides foi ao rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν ... τὴν χώραν τῷ Ἀλκίμῳ
  choice: nomeou Álcimo para governar o país
  rationale: A construção indica que Álcimo foi colocado em posição de autoridade administrativa sobre o território. A formulação é natural em português e evita a expressão pouco idiomática «estabeleceu o país para Álcimo».
- source_word: τὴν χώραν
  choice: o país
  rationale: No contexto político-administrativo, χώρα designa o território ou país confiado à autoridade de Álcimo.
- source_word: ἀφῆκεν
  choice: deixou
  rationale: Com uma força militar como objeto e Álcimo como companhia, o verbo indica que ele deixou tropas no lugar com Álcimo.
- source_word: δύναμιν
  choice: uma força
  rationale: Na narrativa militar, δύναμις se refere a uma força armada, sem especificar que se tratava de um exército inteiro.
- source_word: τοῦ βοηθεῖν αὐτῷ
  choice: para ajudá-lo
  rationale: O infinitivo articular expressa a finalidade da força deixada com Álcimo.
- source_word: ἀπῆλθεν
  choice: partiu
  rationale: Expressa de modo claro e digno a saída de Báquides do local.
- source_word: πρὸς τὸν βασιλέα
  choice: para junto do rei
  rationale: Preserva o movimento em direção à pessoa do rei sem acrescentar «de volta», ideia possível pelo contexto, mas não explícita no grego.
