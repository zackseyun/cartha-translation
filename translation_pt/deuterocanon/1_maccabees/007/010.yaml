base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/010.yaml
  text: And he departed and came into the land of Judah with a large force[a], and he sent messengers to Judas and to his brothers with peaceful words, but with deceit.
translation:
  language: pt
  text: Ele partiu e chegou à terra de Judá com uma grande força militar. Enviou mensageiros a Judas e aos irmãos dele com palavras de paz, mas com engano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “palavras pacíficas, mas com dolo”. O grego contrasta a linguagem exteriormente pacífica com a intenção enganosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν καὶ ἦλθεν
  choice: partiu e chegou
  rationale: 'Preserva a sequência narrativa dos dois aoristos: saída do lugar anterior e chegada ao destino, sem acrescentar detalhes sobre o percurso.'
- source_word: μετὰ δυνάμεως πολλῆς
  choice: com uma grande força militar
  rationale: No contexto, δύναμις designa uma força armada, não poder abstrato. A explicitação de “militar” torna esse sentido claro em português sem transformar necessariamente a força em um exército formal.
- source_word: εἰς γῆν Ἰούδα
  choice: à terra de Judá
  rationale: Mantém o substantivo γῆ e seu sentido territorial.
- source_word: ἀπέστειλεν ἀγγέλους
  choice: enviou mensageiros
  rationale: ἀγγέλους refere-se aqui a emissários humanos em um contexto político e militar; “mensageiros” é claro e abrangente.
- source_word: πρὸς Ἰούδαν καὶ πρὸς τοὺς ἀδελφοὺς αὐτοῦ
  choice: a Judas e aos irmãos dele
  rationale: Reproduz os destinatários e preserva o masculino explícito de ἀδελφούς. “Dele” evita, em português, uma possível ambiguidade de “seus irmãos”.
- source_word: λόγους εἰρηνικοὺς
  choice: palavras de paz
  rationale: Expressa de modo natural o teor aparentemente pacífico da mensagem e mantém a oposição com o engano subsequente.
- source_word: μετὰ δόλου
  choice: mas com engano
  rationale: δόλος indica fraude, astúcia enganosa ou dolo. O “mas” explicita a oposição lógica já presente entre a aparência pacífica das palavras e a intenção enganosa, sem alterar o conteúdo.
