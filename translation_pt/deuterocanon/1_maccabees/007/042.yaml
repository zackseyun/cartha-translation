base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/042.yaml
  text: So crush this camp before us today[a], and let the rest know that he has spoken wickedly against your holy things; judge him according to his wickedness.
translation:
  language: pt
  text: Assim, esmaga hoje este acampamento diante de nós; e que os demais saibam que ele falou perversamente contra as tuas coisas santas[a], e julga-o segundo a sua maldade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra o teu santuário”. O grego diz literalmente “contra as tuas coisas santas” (plural), expressão que pode abranger tudo o que é consagrado a Deus, incluindo o santuário.'
    reason: Alternativa lexical decorrente da amplitude semântica de τὰ ἅγια.
lexical_decisions:
- source_word: σύντριψον
  choice: esmaga
  rationale: O imperativo aoristo pede uma ação decisiva de destruição. “Esmaga” conserva a força da imagem e se aplica naturalmente à derrota militar e ao juízo divino.
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: O termo designa com frequência um acampamento, especialmente militar. “Este acampamento” é claro no contexto sem substituir o local pelo exército que ali está.
- source_word: ἐνώπιον ἡμῶν
  choice: diante de nós
  rationale: Reproduz de modo natural o sentido de “na nossa presença” ou “à nossa vista”.
- source_word: οἱ ἐπίλοιποι
  choice: os demais
  rationale: Mantém aberto se a expressão se refere aos restantes em geral ou especificamente aos sobreviventes, sem acrescentar uma precisão ausente no grego.
- source_word: κακῶς ἐλάλησεν
  choice: falou perversamente
  rationale: Expressa a censura moral do advérbio κακῶς, e não apenas uma maneira inadequada de falar.
- source_word: ἐπὶ τὰ ἅγιά σου
  choice: contra as tuas coisas santas
  rationale: Conserva o plural e a amplitude de τὰ ἅγια, que pode abranger aquilo que é consagrado a Deus e também o santuário, sem restringir silenciosamente o referente.
- source_word: κρῖνον αὐτὸν
  choice: julga-o
  rationale: Preserva o núcleo judicial de κρίνω e o referente masculino singular do pronome.
- source_word: κατὰ τὴν κακίαν αὐτοῦ
  choice: segundo a sua maldade
  rationale: Segue de perto a relação expressa por κατά e mantém o pedido de que o julgamento corresponda à maldade do culpado.
theological_decisions:
- issue: Referente singular de αὐτόν (“o”) após ἐλάλησεν (“falou”)
  choice: Manter “ele” e “julga-o” no singular.
  alternative: Entender o singular coletivamente e formular a referência como sendo ao acampamento, ao exército ou aos seus integrantes.
  rationale: O grego passa do coletivo “este acampamento” para um ofensor singular. A manutenção do singular preserva a gramática e a tensão do texto sem identificar por conta própria quem é esse indivíduo.
- issue: Amplitude de τὰ ἅγια
  choice: Traduzir no texto como “as tuas coisas santas” e registrar “o teu santuário” em nota.
  alternative: Traduzir diretamente como “o teu santuário”.
  rationale: A forma grega é plural e pode designar amplamente as realidades sagradas de Deus, embora também possa referir-se ao santuário. A tradução principal conserva essa amplitude.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem enfraquecer o caráter urgente da oração. O ponto e vírgula separa o pedido de destruição de suas consequências e do pedido judicial final.
