  text: And he spoke peaceful words with them, and swore to them, saying, “We will not seek harm against you or against your friends.”
translation:
  language: pt
  text: 'E falou-lhes em termos de paz e lhes jurou: “Não procuraremos fazer mal[a] a vocês nem aos seus amigos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não procuraremos causar dano a vocês nem aos seus amigos.” A palavra grega pode significar “mal” ou “dano”; neste contexto, provavelmente se refere a uma ação prejudicial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν μετʼ αὐτῶν
  choice: falou com eles
  rationale: Preserva o sentido direto de λαλέω e o valor associativo de μετά com genitivo, em português natural.
- source_word: εἰρηνικοὺς λόγους
  choice: palavras de paz
  rationale: Expressa de modo claro e digno o teor conciliador das palavras, sem afirmar que a intenção fosse sincera.
- source_word: ὤμοσεν αὐτοῖς
  choice: lhes jurou
  rationale: Forma concisa e natural que mantém tanto o juramento quanto seus destinatários.
- source_word: Οὐκ ἐκζητήσομεν
  choice: Não procuraremos fazer
  rationale: Com κακόν, a construção comunica a intenção de não buscar ou praticar uma ação prejudicial; 'procuraremos fazer' soa natural em português.
- source_word: ὑμῖν κακὸν
  choice: mal a vocês
  rationale: κακόν pode indicar mal ou dano. Aqui, a promessa diz respeito a uma ação hostil, e 'fazer mal a' preserva essa amplitude em linguagem corrente.
- source_word: τοῖς φίλοις ὑμῶν
  choice: aos seus amigos
  rationale: Mantém o sentido comum de φίλοι sem restringi-lo indevidamente a aliados políticos ou militares.
