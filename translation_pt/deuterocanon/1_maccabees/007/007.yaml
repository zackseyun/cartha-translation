  yaml_path: translation/deuterocanon/1_maccabees/007/007.yaml
  text: Now then, send a man whom you trust, and let him go and see all the destruction that he has done to us and to the king’s land, and let him punish them and all who are helping them.
translation:
  language: pt
  text: Agora, portanto, envia um homem em quem confias, e que ele vá e veja toda a destruição que ele trouxe sobre nós e sobre o território do rei; e que castigue tanto a eles como a todos os que lhes prestam ajuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, portanto
  rationale: Mantém a transição conclusiva e o sentido temporal do grego em linguagem clara e digna.
- source_word: ἀπόστειλον ἄνδρα ᾧ πιστεύεις
  choice: envia um homem em quem confias
  rationale: Preserva a ordem imperativa e a oração relativa, que destaca a confiança pessoal do destinatário nesse homem.
- source_word: πορευθεὶς ἰδέτω
  choice: que ele vá e veja
  rationale: Converte naturalmente a sequência de particípio e imperativo em duas ações coordenadas, sem acrescentar a ideia mais específica de inspecionar.
- source_word: τὴν ἐξολέθρευσιν ἅπασαν
  choice: toda a destruição
  rationale: Expressa tanto a devastação indicada pelo substantivo como a totalidade enfatizada por ἅπασαν.
- source_word: ἣν ἐποίησεν ἡμῖν καὶ τῇ χώρᾳ τοῦ βασιλέως
  choice: que aquele homem trouxe sobre nós e sobre o território do rei
  rationale: A formulação portuguesa comunica de modo natural o dano causado aos dois alvos. 'Território' evita a possível conotação moderna de Estado-nação associada a 'país'.
- source_word: κολάσατο αὐτούς
  choice: que os castigue, tanto a eles
  rationale: Traduz o imperativo punitivo de maneira neutra, sem intensificá-lo como vingança. A explicitação 'tanto a eles' prepara com clareza a construção correlativa seguinte.
- source_word: πάντας τοὺς ἐπιβοηθοῦντας αὐτοῖς
  choice: todos os que lhes prestam ajuda
  rationale: Mantém o valor verbal do particípio e não restringe a ajuda ao campo militar ou político.
theological_decisions:
- issue: Identidade do sujeito de ἐποίησεν e dos referentes de αὐτούς/αὐτοῖς
  choice: aquele homem / eles / lhes
  alternative: Judas / Judas e os seus / a eles
  rationale: O versículo grego usa pronomes cujos referentes vêm do contexto, sem repetir nomes. A tradução evita inserir explicitamente 'Judas' e conserva a dependência contextual, ao mesmo tempo que torna idiomática a mudança do referente singular para o plural.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O tratamento por 'tu' aparece apenas nas formas verbais 'envia' e 'confias', adequadas ao discurso dirigido ao rei e coerentes com o singular grego; a redação evita arcaísmos e linguagem burocrática.
