revisions:
- from: Agora, portanto, envia um homem em quem confias; que ele vá e veja toda a destruição que aquele homem trouxe sobre nós e sobre o território do rei. Depois, que os castigue, tanto a eles como a todos os que lhes prestam ajuda.
  to: Agora, portanto, envia um homem em quem confias, e que ele vá e veja toda a destruição que ele trouxe sobre nós e sobre o território do rei; e que castigue tanto a eles como a todos os que lhes prestam ajuda.
  rationale: A revisão remove o demonstrativo não expresso na fonte, evita reforçar uma sequência temporal não exigida por καί e torna a coordenação final idiomática. Conserva-se a ambiguidade contextual dos pronomes, inclusive a passagem do sujeito singular da destruição ao referente plural da punição, sem inserir o nome de Judas ou outra identificação interpretativa.
