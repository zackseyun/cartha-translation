base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/046.yaml
  text: And they came out from all the villages of Judea all around and outflanked them[a]; and these turned back against them, and they all fell by the sword[b], and not even one of them was left.
translation:
  language: pt
  text: Então saíram de todas as aldeias da Judeia, de todos os lados, e os flanquearam[a]. Estes se voltaram contra aqueles[b], e todos caíram à espada; não restou sequer um deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego é incomum neste contexto e também pode significar, de modo mais geral, “cercaram” ou “levaram vantagem sobre eles”.
    reason: alternative_reading
  - marker: b
    text: O grego apresenta a sequência concisa e algo abrupta “e estes se voltaram contra aqueles”; os referentes exatos dos demonstrativos ficam implícitos no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: saíram
  rationale: Verbo narrativo direto que indica a saída das pessoas de suas aldeias para o combate.
- source_word: κωμῶν
  choice: aldeias
  rationale: κώμη designa normalmente uma povoação menor que uma cidade; “aldeias” é claro e corrente em português.
- source_word: κυκλόθεν
  choice: ao redor
  rationale: O advérbio indica posição ou movimento circundante e, neste contexto, sugere que as aldeias ficavam nos arredores ou que as pessoas vieram de vários lados.
- source_word: ὑπερεφέρων
  choice: flanquearam
  rationale: A forma é incomum, mas, associada a κυκλόθεν e ao cenário de batalha, provavelmente descreve a obtenção de vantagem pelos lados do inimigo. A nota preserva outras possibilidades.
- source_word: ἀνέστρεφον
  choice: se voltaram
  rationale: Mantém o sentido básico de voltar-se ou mudar de direção sem decidir se houve retirada ou contra-ataque.
- source_word: οὗτοι πρὸς τούτους
  choice: Estes se voltaram contra aqueles
  rationale: Reproduz a oposição entre os dois demonstrativos sem identificar explicitamente seus referentes, que permanecem implícitos no grego.
- source_word: ἔπεσαν πάντες ῥομφαίᾳ
  choice: todos caíram à espada
  rationale: Expressão de combate natural e próxima do idioma grego, indicando morte violenta pela espada.
- source_word: οὐ κατελείφθη ἐξ αὐτῶν οὐδὲ εἷς
  choice: não restou sequer um deles
  rationale: Preserva a negação enfática e a ideia de destruição total.
