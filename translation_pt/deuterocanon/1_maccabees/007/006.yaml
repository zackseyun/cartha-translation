base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/006.yaml
  text: And they accused the people before the king[a], saying, “Judas and his brothers have destroyed all your friends, and have scattered us from our land.”
translation:
  language: pt
  text: 'E acusaram o povo diante do rei, dizendo: “Judas e seus irmãos destruíram todos os teus amigos[a] e nos dispersaram, afastando-nos da nossa terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aliados” ou “partidários”; em contextos da realeza, “amigos” pode designar apoiadores políticos ou associados da corte do rei.
    reason: Registra a possível acepção política ou cortesã de φίλοι sem eliminar do texto principal seu sentido lexical transparente.
lexical_decisions:
- source_word: κατηγόρησαν
  choice: acusaram
  rationale: Expressa diretamente a apresentação de uma acusação hostil e formal perante o rei.
- source_word: τοῦ λαοῦ
  choice: o povo
  rationale: O genitivo funciona como objeto do verbo de acusar; “o povo” preserva o sentido amplo sem introduzir uma noção nacional mais técnica.
- source_word: πρὸς τὸν βασιλέα
  choice: diante do rei
  rationale: No contexto de uma denúncia formal, traduz naturalmente a direção da acusação e sua apresentação perante a autoridade real.
- source_word: Ἀπώλεσεν
  choice: destruíram
  rationale: No contexto, indica a eliminação ou ruína de pessoas. O plural concorda naturalmente em português com o sujeito composto “Judas e seus irmãos”.
- source_word: οἱ φίλοι σου
  choice: teus amigos
  rationale: Mantém o sentido lexical básico de φίλοι, enquanto a nota registra sua possível nuance política ou cortesã.
- source_word: ἐσκόρπισεν
  choice: nos dispersaram
  rationale: Preserva a imagem de espalhar ou dispersar um grupo, com plural idiomático em referência a Judas e seus irmãos.
- source_word: ἀπὸ τῆς γῆς ἡμῶν
  choice: para longe da nossa terra
  rationale: Torna explícita em português a ideia de afastamento expressa por ἀπό, sem especificar indevidamente o modo da expulsão.
theological_decisions:
- issue: Verbos gregos no singular com o sujeito “Judas e seus irmãos”
  choice: Empregar “destruíram” e “dispersaram” no plural.
  alternative: 'Conservar Judas como agente gramatical singular, por exemplo: “Judas destruiu..., e seus irmãos com ele”.'
  rationale: O grego põe Judas em primeiro plano e usa verbos no singular, embora nomeie também seus irmãos. O plural é a concordância natural em português com o sujeito composto, sem alterar a atribuição conjunta da ação.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. Mantém a estrutura de denúncia e discurso direto, evitando linguagem excessivamente técnica.
