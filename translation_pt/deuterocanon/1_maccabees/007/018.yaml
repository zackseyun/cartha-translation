base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/018.yaml
  text: And fear and dread fell upon all the people[a], for they said, “There is no truth or justice in them, for they have broken the agreement and the oath that they swore.”
translation:
  language: pt
  text: 'O medo e o pavor caíram sobre todo o povo[a], pois disseram: “Não há neles verdade nem justiça, porque violaram o acordo e o juramento que fizeram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pacto” ou “aliança”, em vez de “acordo”; o termo grego pode indicar um compromisso formal, reforçado aqui pelo juramento que o acompanha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: caíram sobre
  rationale: O aoristo de ἐπιπίπτω expressa algo que sobrevém de modo marcante. O plural em português faz a concordância natural com os dois sujeitos coordenados, “o medo e o pavor”.
- source_word: ὁ φόβος καὶ ὁ τρόμος
  choice: o medo e o pavor
  rationale: 'Distingue os dois termos sem redundância: φόβος é o termo mais amplo, e τρόμος intensifica a reação, podendo envolver tremor ou terror.'
- source_word: εἰς πάντα τὸν λαόν
  choice: sobre todo o povo
  rationale: Com o verbo de movimento e os estados emocionais, εἰς indica que o medo e o pavor alcançaram o povo inteiro.
- source_word: ἀλήθεια καὶ κρίσις
  choice: verdade nem justiça
  rationale: ἀλήθεια conserva a acusação de falta de veracidade e confiabilidade; κρίσις, neste contexto ético, aponta para justiça ou trato justo. “Nem” é natural sob a negação portuguesa.
- source_word: παρῆρσαν
  choice: violaram
  rationale: No contexto, o verbo indica transgressão das obrigações assumidas. “Violaram” combina naturalmente com um acordo formal e um juramento.
- source_word: τὴν στάσιν
  choice: o acordo
  rationale: Embora στάσις tenha ampla variedade semântica, aqui, ao lado do juramento, designa uma disposição ou compromisso formal. “Acordo” evita impor a carga teológica específica de “aliança”.
- source_word: τὸν ὅρκον ὃν ὤμοσαν
  choice: o juramento que fizeram
  rationale: Expressa claramente a relação entre o substantivo e o verbo cognato gregos, usando a colocação portuguesa corrente “fazer um juramento”.
theological_decisions:
- issue: Se στάσις deve receber linguagem de aliança
  choice: acordo
  alternative: aliança; pacto
  rationale: O contexto descreve a quebra de um compromisso formal confirmado por juramento, mas στάσις não exige por si só o sentido teológico mais específico de “aliança”. A nota preserva alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação mantém o paralelismo “medo e pavor” e a acusação dupla “verdade nem justiça”, sem resolver além do necessário a amplitude de στάσις.
