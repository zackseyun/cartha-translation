lexical_decisions:
- source_word: ἠγωνίσατο
  choice: lutou
  rationale: O verbo ἀγωνίζομαι indica empenho intenso, disputa ou luta. Neste contexto político, “lutou” expressa a busca ativa pelo cargo sem afirmar necessariamente combate físico.
- source_word: Ἄλκιμος
  choice: Álcimo
  rationale: “Álcimo” é a forma tradicional e reconhecível do nome em português, com acento conforme a pronúncia portuguesa.
- source_word: περὶ
  choice: pelo
  rationale: Com um verbo de luta ou empenho, περί apresenta aquilo que está em disputa ou é buscado; “pelo” é natural em português.
- source_word: τῆς ἀρχιερωσύνης
  choice: sumo sacerdócio
  rationale: ἀρχιερωσύνη designa o cargo ou a dignidade de sumo sacerdote. “Sumo sacerdócio” preserva de modo conciso seu sentido institucional.
