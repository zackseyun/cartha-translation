  text: And the people rejoiced greatly[a], and they made that day a day of great gladness.
translation:
  language: pt
  text: O povo se alegrou muito e celebrou aquele dia como um dia de grande alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “levaram/conduziram aquele dia como um dia de grande alegria”, expressão idiomática que significa que o observaram ou celebraram dessa maneira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐφράνθη
  choice: se alegrou
  rationale: O aoristo passivo de εὐφραίνω tem aqui sentido intransitivo e expressa a reação jubilosa do povo; “se alegrou” é natural e fiel em português.
- source_word: ὁ λαός
  choice: o povo
  rationale: Reproduz o substantivo coletivo do grego sem explicitar “de Israel”, informação fornecida pelo contexto, mas não repetida neste versículo.
- source_word: σφόδρα
  choice: muito
  rationale: Transmite de modo claro e corrente a forte intensificação do verbo.
- source_word: ἦγαγον
  choice: celebrou
  rationale: Embora o verbo signifique literalmente “conduzir” ou “levar”, na expressão relativa a um dia indica observá-lo ou celebrá-lo. O singular concorda naturalmente com o coletivo “o povo” em português.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: aquele dia
  rationale: Equivalente direto e idiomático da expressão demonstrativa grega.
- source_word: ἡμέραν εὐφροσύνης μεγάλην
  choice: como um dia de grande alegria
  rationale: εὐφροσύνη denota alegria, júbilo ou regozijo festivo; “grande alegria” preserva o sentido e mantém uma formulação digna e acessível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “dia” preserva a ênfase retórica do original, enquanto “celebrou” comunica naturalmente o valor idiomático de ἦγαγον.
