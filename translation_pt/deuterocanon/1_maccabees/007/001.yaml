base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/001.yaml
  text: In the one hundred fifty-first year[a], Demetrius son of Seleucus went out from Rome, and went up with a few men to a city by the sea[b], and reigned there.
translation:
  language: pt
  text: No ano cento e cinquenta e um, Demétrio, filho de Seleuco, saiu de Roma, subiu com poucos homens até uma cidade à beira-mar[a] e reinou ali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma cidade litorânea”. O grego diz literalmente “uma cidade à beira-mar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tornou-se rei ali”. Neste contexto, o verbo grego pode indicar tanto o início do reinado quanto o ato de reinar.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους ἑνὸς καὶ πεντηκοστοῦ
  choice: No ano cento e cinquenta e um
  rationale: Reproduz com clareza a fórmula cronológica grega, sem acrescentar ao texto principal a identificação da era usada.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Equivalente direto e natural do aoristo de ἐξέρχομαι, preservando o movimento para fora de Roma sem introduzir a ideia não explícita de fuga.
- source_word: Δημήτριος ὁ τοῦ Σελεύκου
  choice: Demétrio, filho de Seleuco
  rationale: O artigo seguido do genitivo funciona como patronímico; explicitar 'filho de' é idiomático e fiel em português.
- source_word: ἀνέβη
  choice: subiu
  rationale: Mantém a imagem de movimento de ἀναβαίνω e evita substituí-la por uma interpretação geográfica ou política não expressa no grego.
- source_word: σὺν ἀνδράσιν ὀλίγοις
  choice: com poucos homens
  rationale: Expressão simples e natural que preserva a informação de que o grupo era reduzido.
- source_word: εἰς πόλιν παραθαλασσίαν
  choice: até uma cidade à beira-mar
  rationale: Traduz de modo transparente παραθαλασσίαν, conservando a descrição concreta da localização junto ao mar.
- source_word: ἐβασίλευσεν
  choice: reinou ali
  rationale: Preserva explicitamente o sentido régio do verbo βασιλεύω sem decidir no texto principal se o aoristo enfatiza o começo do reinado ou o exercício da realeza.
theological_decisions:
- issue: Nuance aspectual e histórica de ἐβασίλευσεν
  choice: reinou ali
  alternative: tornou-se rei ali
  rationale: O verbo pode descrever tanto o exercício do reinado quanto, neste contexto narrativo, a ascensão à realeza. A tradução principal permanece próxima da forma verbal grega, e a nota conserva a alternativa historicamente relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação narrativa foi mantida enxuta; 'subiu' conserva a formulação do grego, e as ambiguidades lexicais relevantes aparecem em notas.
