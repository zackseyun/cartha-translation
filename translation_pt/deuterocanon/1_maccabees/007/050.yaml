  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασεν
  choice: ficou em paz
  rationale: O aoristo de ἡσυχάζω indica que a terra passou a estar tranquila ou livre de conflito. “Ficou em paz” é natural em português e preserva o caráter temporário dessa situação sem sugerir uma paz duradoura.
- source_word: ἡ γῆ Ἰούδα
  choice: a terra de Judá
  rationale: γῆ designa a terra ou o território. “A terra de Judá” acompanha de perto a construção grega e mantém o sentido territorial.
- source_word: ἡμέρας ὀλίγας
  choice: por poucos dias
  rationale: O acusativo expressa duração. “Por poucos dias” explicita essa função temporal e conserva a brevidade indicada por ὀλίγας.
