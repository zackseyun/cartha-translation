  text: And they established that this day should be observed year by year, on the thirteenth day of Adar.
translation:
  language: pt
  text: E estabeleceram que esse dia fosse observado todos os anos, no décimo terceiro dia de adar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστησαν
  choice: estabeleceram
  rationale: O aoristo de ἵστημι, nesta construção, indica a instituição de uma prática; «estabeleceram» preserva esse sentido formal e é natural em português.
- source_word: τοῦ ἄγειν
  choice: que esse dia fosse observado
  rationale: O infinitivo articular expressa o conteúdo do que foi estabelecido. «Fosse observado» abrange a guarda comemorativa da data sem pressupor necessariamente um caráter festivo.
- source_word: κατʼ ἐνιαυτόν
  choice: todos os anos
  rationale: A expressão indica recorrência anual; «todos os anos» é clara, corrente e fiel ao sentido.
- source_word: τὴν ἡμέραν ταύτην
  choice: esse dia
  rationale: Embora o grego use demonstrativo proximal, «esse dia» retoma com naturalidade, em português moderno, o dia mencionado no contexto narrativo.
- source_word: τῇ τρισκαιδεκάτῃ
  choice: no décimo terceiro dia
  rationale: O dativo indica a data da observância; a explicitação de «dia» torna a formulação natural e inequívoca.
- source_word: τοῦ Ἀδάρ
  choice: de adar
  rationale: Adar é o nome de um mês e, por isso, é transliterado; emprega-se inicial minúscula conforme o uso português corrente para nomes de meses.
