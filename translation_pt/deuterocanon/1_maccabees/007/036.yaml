base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/036.yaml
  text: “I will burn this house.” And he went out in anger[a]. Then the priests entered and stood before the altar and the sanctuary, and they wept and said[b],
translation:
  language: pt
  text: “Porei fogo nesta casa.”[a] E ele saiu irado. Então os sacerdotes entraram, postaram-se diante do altar e do santuário, choraram e disseram:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o templo. O grego diz literalmente “nesta casa”, uma maneira comum de se referir ao templo.
    reason: lexical_alternative
  - marker: b
    text: A fala introduzida por “disseram” continua no versículo seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: ἐμπυριῶ
  choice: Porei fogo
  rationale: Expressa diretamente a ameaça futura de incendiar, sem acrescentar que o edifício seria necessariamente consumido por completo.
- source_word: τὸν οἶκον τοῦτον
  choice: nesta casa
  rationale: Preserva o sentido literal de οἶκος e sua ressonância bíblica como designação do templo; o contexto esclarece o referente.
- source_word: μετὰ θυμοῦ
  choice: enfurecido
  rationale: Transmite de modo natural em português o estado de ira com que ele saiu.
- source_word: οἱ ἱερεῖς
  choice: os sacerdotes
  rationale: Equivalente padrão e inequívoco no contexto cultual.
- source_word: ἔστησαν κατὰ πρόσωπον
  choice: ficaram diante
  rationale: Representa naturalmente o ato de se posicionarem diante do altar e do santuário.
- source_word: τοῦ θυσιαστηρίου
  choice: do altar
  rationale: Equivalente cultual corrente.
- source_word: τοῦ ναοῦ
  choice: do santuário
  rationale: Mantém a distinção lexical entre οἶκος, anteriormente traduzido por 'casa', e ναός, que pode designar o santuário propriamente dito.
- source_word: ἔκλαυσαν
  choice: choraram
  rationale: Forma atual, clara e solene para o ato de chorar.
- source_word: εἶπαν
  choice: disseram
  rationale: Introduz a fala que continua no versículo seguinte; os dois-pontos tornam essa continuidade natural em português.
