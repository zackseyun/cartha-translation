  yaml_path: translation/deuterocanon/1_maccabees/007/039.yaml
  text: And Nicanor went out from Jerusalem and camped at Beth-horon[a], and a force of Syria met him.
translation:
  language: pt
  text: Então Nicanor saiu de Jerusalém e acampou em Bete-Horom, e uma força da Síria[a] foi ao encontro dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma força síria encontrou-se com ele» ou «o exército da Síria foi ao encontro dele». O termo grego δύναμις pode designar uma força militar ou um exército.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Verte diretamente o aoristo de ἐξέρχομαι como movimento para fora de Jerusalém, sem acrescentar a ideia específica de marcha militar.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: No contexto militar, παρεμβάλλω significa estabelecer acampamento; «acampou» é corrente, claro e fiel.
- source_word: Βεθωρών
  choice: Bete-Horom
  rationale: Transliteração portuguesa tradicional e inteligível do topônimo grego.
- source_word: συνήντησεν αὐτῷ
  choice: foi ao encontro dele
  rationale: Preserva o sentido amplo de encontro expresso por συναντάω sem afirmar que a força se juntou a Nicanor como reforço, embora isso seja possível no contexto.
- source_word: δύναμις Συρίας
  choice: uma força da Síria
  rationale: Em narrativa militar, δύναμις pode designar uma força ou exército; o genitivo Συρίας é vertido diretamente por «da Síria», sem precisar se indica origem ou pertencimento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A coordenação narrativa foi mantida, e a ambiguidade de συνήντησεν não foi resolvida como aliança ou reforço.
