  text: And all the lawless and ungodly men from Israel came to him[a], and Alcimus led them, wanting to be priest,
translation:
  language: pt
  text: E todos os homens que violavam a Lei e eram ímpios dentre Israel foram até ele, e Álcimo os liderou, querendo exercer o sacerdócio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “querendo ser sacerdote”. Neste contexto, a pretensão de Álcimo dizia respeito ao cargo de sumo sacerdote, embora o verbo grego signifique literalmente exercer a função sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες
  choice: homens
  rationale: Preserva o masculino plural explícito e identifica um grupo concreto de homens.
- source_word: ἄνομοι
  choice: que violavam a Lei
  rationale: Expressa de modo natural a oposição à Lei, provavelmente a Lei judaica ou pactual, sem reduzir o termo a uma maldade genérica.
- source_word: ἀσεβεῖς
  choice: ímpios
  rationale: Mantém a dimensão religiosa de irreverência para com Deus e distingue o termo da violação da Lei.
- source_word: ἐξ Ἰσραήλ
  choice: vindos de Israel
  rationale: Indica que esses homens procediam do próprio Israel.
- source_word: πρὸς αὐτόν
  choice: até ele
  rationale: Com o verbo de movimento, comunica claramente a aproximação em direção a ele.
- source_word: ἡγείται
  choice: os liderava
  rationale: O presente histórico grego é vertido naturalmente no imperfeito narrativo, conservando a ideia de liderança sobre o grupo.
- source_word: βουλόμενος
  choice: querendo
  rationale: Apresenta diretamente a vontade ou ambição que motivava Álcimo.
- source_word: ἱερατεύειν
  choice: exercer o sacerdócio
  rationale: Preserva o sentido verbal de atuar como sacerdote sem inserir no texto principal a especificação não expressa de modo lexical de que se tratava do sumo sacerdócio.
theological_decisions:
- issue: Caracterização moral e religiosa dos israelitas
  choice: que violavam a Lei e eram ímpios
  alternative: iníquos e ímpios
  rationale: Mantém distintos os aspectos legal-pactual e religioso dos dois adjetivos gregos.
- issue: Especificidade da ambição sacerdotal de Álcimo
  choice: exercer o sacerdócio
  alternative: ser sumo sacerdote
  rationale: O contexto histórico aponta para o sumo sacerdócio, mas ἱερατεύειν, por si só, significa exercer função sacerdotal; a tradução principal preserva essa extensão lexical e a nota registra a referência contextual provável.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação evita explicitar “sumo” no corpo do texto, preservando a tensão entre o sentido lexical do verbo e o contexto histórico.
