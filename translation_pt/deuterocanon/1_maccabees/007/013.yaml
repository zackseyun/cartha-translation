  text: And the Hasideans were the first among the sons of Israel[a], and they sought peace from them.
translation:
  language: pt
  text: E os assideus foram os primeiros entre os filhos de Israel[a] e pediam-lhes paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «entre os israelitas». O grego diz literalmente «entre os filhos de Israel», expressão tradicional de identidade familiar, nacional e pactual.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτοι
  choice: os primeiros
  rationale: O uso predicativo com ἦσαν indica prioridade; a expressão conserva a ideia de que esse grupo tomou a iniciativa antes dos demais.
- source_word: Ἀσιδαῖοι
  choice: assideus
  rationale: Usa-se a forma tradicional e reconhecível em português para o nome desse grupo, sem substituí-la por uma descrição interpretativa nem pelo hebraísmo «hassidim».
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: entre os filhos de Israel
  rationale: ἐν tem aqui sentido de «entre» ou «no meio de». A tradução mantém a expressão familiar e nacional do grego, em vez de nivelá-la silenciosamente para «israelitas».
- source_word: ἐπεζήτουν
  choice: procuravam obter
  rationale: O imperfeito sugere uma ação em curso ou uma tentativa. «Procuravam obter» expressa esse aspecto de maneira natural em português.
- source_word: παρʼ αὐτῶν
  choice: da parte deles
  rationale: παρά com o genitivo indica procedência. A formulação preserva o pronome plural e evita identificar de modo explícito seu referente, que depende do contexto.
- source_word: εἰρήνην
  choice: paz
  rationale: Mantém o sentido básico do substantivo sem ampliá-lo para «condições de paz» ou «reconciliação», que seriam interpretações mais específicas.
theological_decisions:
- issue: Tradução da expressão étnico-pactual υἱοῖς Ἰσραήλ
  choice: entre os filhos de Israel
  alternative: entre os israelitas
  rationale: O grego traz literalmente «filhos de Israel», expressão tradicional de identidade familiar, nacional e pactual. Ela é preservada no texto, enquanto a alternativa idiomática aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Assideus» segue o uso bíblico tradicional em português. A construção «procuravam obter paz da parte deles» conserva o aspecto imperfeito e a procedência indicada pelo grego sem resolver o referente do pronome.
