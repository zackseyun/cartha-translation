  yaml_path: translation/deuterocanon/1_maccabees/007/037.yaml
  text: You chose this house for your name to be called upon it[a], to be a house of prayer and petition for your people.
translation:
  language: pt
  text: Tu escolheste esta casa para que o teu nome fosse invocado sobre ela[a], a fim de ser uma casa de oração e súplica para o teu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para levar o teu nome” ou “para que o teu nome fosse chamado sobre ela”. O grego emprega uma fórmula bíblica que indica que a casa pertence a Deus e está sob o seu nome.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελέξω
  choice: tu escolheste
  rationale: Traduz diretamente o aoristo de ἐκλέγω e expressa de modo natural a escolha divina do templo.
- source_word: τὸν οἶκον τοῦτον
  choice: esta casa
  rationale: Preserva a imagem bíblica de οἶκος como 'casa', cujo referente no contexto é o templo.
- source_word: ἐπικληθῆναι τὸ ὄνομά σου ἐπ’ αὐτόν
  choice: para que o teu nome fosse invocado sobre ela
  rationale: Mantém a formulação bíblica e a ambiguidade entre invocação e identificação da casa como pertencente a Deus e colocada sob o seu nome.
- source_word: εἶναι
  choice: a fim de ser
  rationale: Explicita com naturalidade o valor de finalidade do infinitivo, em continuidade com a escolha da casa.
- source_word: οἶκον προσευχῆς
  choice: uma casa de oração
  rationale: Reproduz com clareza a construção genitiva e preserva a expressão bíblica reconhecível.
- source_word: καὶ δεήσεως
  choice: e súplica
  rationale: Distingue a petição insistente indicada por δέησις da noção mais ampla de oração, sem recorrer a linguagem obscura.
- source_word: τῷ λαῷ σου
  choice: para o teu povo
  rationale: 'Entende o dativo como vantagem ou referência: a casa foi destinada ao serviço religioso do povo de Deus, embora a ideia de orações feitas pelo povo permaneça possível.'
theological_decisions:
- issue: Fórmula do templo referente ao nome divino
  choice: para que o teu nome fosse invocado sobre ela
  alternative: para levar o teu nome; para que o teu nome fosse chamado sobre ela
  rationale: A tradução preserva a fórmula bíblica que associa o santuário ao nome, à autoridade e à pertença de Deus, sem reduzi-la a uma única explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento direto de Deus por “tu”. Conservam-se “casa de oração” e a fórmula relativa ao nome divino por seu valor bíblico; “súplica” mantém a distinção lexical sem soar excessivamente arcaica.
