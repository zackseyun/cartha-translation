lexical_decisions:
- source_word: παρενέβαλεν
  choice: acampou
  rationale: O verbo descreve o estabelecimento de um acampamento, especialmente em contexto militar; “acampou” é direto e natural em português.
- source_word: ἐν Ἀδασὰ
  choice: em Adasa
  rationale: A preposição ἐν localiza o acampamento; “em Adasa” é a formulação idiomática em português.
- source_word: ἐν τρισχιλίοις ἀνδράσιν
  choice: com três mil homens
  rationale: Neste contexto militar, a expressão indica a tropa que acompanhava Judas; “com três mil homens” comunica isso com clareza.
- source_word: προσηύξατο
  choice: orou
  rationale: É a tradução corrente e precisa do verbo προσεύχομαι, que aqui descreve a oração feita por Judas.
- source_word: εἶπεν
  choice: dizendo
  rationale: Embora a forma grega seja literalmente “disse”, o gerúndio introduz com naturalidade em português o conteúdo da oração que vem a seguir, sem alterar a relação sintática.
