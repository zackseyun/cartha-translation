base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/047.yaml
  text: And they took the spoils and the plunder[a], and they cut off Nikanor’s head and his right hand, which he had stretched out in arrogance, and brought them and displayed them beside Jerusalem.
translation:
  language: pt
  text: Então recolheram os despojos e o saque, cortaram a cabeça de Nicânor e a mão direita que ele havia estendido com arrogância, levaram-nas e as expuseram junto de Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perto de Jerusalém”. O grego diz literalmente “junto de Jerusalém”, sem indicar o local exato.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκῦλα
  choice: despojos
  rationale: Designa os bens tomados dos derrotados, especialmente em contexto militar; “despojos” conserva esse sentido de modo natural e digno.
- source_word: προνομήν
  choice: saque
  rationale: Refere-se ao que foi tomado como presa ou pilhagem. “Saque” mantém a distinção em relação a σκῦλα e preserva a acumulação dos dois substantivos gregos.
- source_word: ἀφεῖλαν
  choice: cortaram
  rationale: Com “cabeça” e “mão direita” como objetos, o verbo implica decepação; “cortaram” expressa claramente a ação no contexto.
- source_word: δεξιὰν
  choice: mão direita
  rationale: O substantivo usado de forma elíptica normalmente significa “mão direita”, sentido mais direto do que “braço direito”.
- source_word: ἐξέτεινεν
  choice: havia estendido
  rationale: Apresenta a ação anterior de Nicânor em relação à mutilação e identifica a mão como aquela que ele havia estendido.
- source_word: ἐν ὑπερηφάνως
  choice: com arrogância
  rationale: Apesar da construção grega irregular, o sentido é de orgulho altivo; “com arrogância” preserva sua avaliação moral negativa.
- source_word: ἤνεγκαν
  choice: levaram-nas
  rationale: 'Verte o verbo narrativo φέρω e explicita por pronome os dois objetos femininos em português: a cabeça e a mão.'
- source_word: ἐξέτειναν
  choice: as expuseram
  rationale: Literalmente, “estenderam”, mas neste contexto descreve a exposição pública dos membros decepados; “expuseram” comunica a função da ação sem especificar o modo.
- source_word: παρὰ τὴν Ἰερουσαλήμ
  choice: junto de Jerusalém
  rationale: παρά com acusativo indica proximidade ou posição ao lado; a formulação não determina um ponto exato nem autoriza acrescentar “fora” da cidade.
theological_decisions:
- issue: Tratamento público dos restos mortais de Nicânor
  choice: Narrar o ato historicamente, sem acrescentar aprovação ou condenação moral além da referência à arrogância de Nicânor.
  alternative: Interpretar a exposição como ocorrida especificamente no portão da cidade ou no recinto do templo.
  rationale: O versículo relata a mutilação e a exibição como sinal de triunfo, mas não identifica precisamente o local nem acrescenta uma avaliação teológica explícita do ato.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a dupla “despojos e saque” e evita-se suavizar a violência do relato ou especificar indevidamente o local da exposição.
