  yaml_path: translation/deuterocanon/1_maccabees/007/016.yaml
  text: 'And they trusted him[a], and he seized sixty men from among them and killed them in one day, according to the words that he wrote:'
translation:
  language: pt
  text: 'E eles confiaram nele, e capturaram[a] sessenta homens dentre eles; e ele os matou num só dia, conforme as palavras que escreveu:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego muda do plural, «capturaram», para o singular, «ele os matou».
    reason: A nota registra a construção mista do texto grego e evita ocultar a mudança de agente por meio de harmonização.
lexical_decisions:
- source_word: ἐνεπίστευσαν
  choice: confiaram nele
  rationale: Expressa confiança depositada em uma pessoa no contexto narrativo, sem sugerir desnecessariamente o sentido teológico que «creram» poderia assumir.
- source_word: συνέλαβον
  choice: prenderam
  rationale: O verbo está na terceira pessoa do plural e indica que os homens foram detidos ou capturados. «Prenderam» é natural em português e preserva o número gramatical do texto grego.
- source_word: ἐξ αὐτῶν
  choice: dentre eles
  rationale: 'Preserva o sentido partitivo: os sessenta foram escolhidos e retirados de um grupo maior.'
- source_word: ἑξήκοντα ἄνδρας
  choice: sessenta homens
  rationale: Tradução direta e corrente da expressão numérica referente a pessoas do sexo masculino.
- source_word: ἀπέκτεινεν
  choice: ele os matou
  rationale: O verbo está no singular e significa matar; o pronome explícito evidencia em português a mudança de sujeito presente no grego.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: num só dia
  rationale: Forma idiomática que comunica a concentração de todas as mortes em um único dia.
- source_word: κατὰ τοὺς λόγους
  choice: conforme as palavras
  rationale: Mantém a relação de conformidade com o texto escrito que introduz a citação seguinte.
- source_word: οὓς ἔγραφεν
  choice: que escreveu
  rationale: Preserva a forma ativa singular e a formulação abrupta do grego, que antecipa as palavras citadas em seguida.
theological_decisions:
- issue: Mudança do sujeito entre o plural συνέλαβον e o singular ἀπέκτεινεν
  choice: Manter «prenderam ... e ele os matou»
  alternative: 'Uniformizar no singular: «ele prendeu ... e os matou»'
  rationale: O texto grego transmitido apresenta deliberadamente ou por irregularidade uma construção de número misto. Mantê-la preserva a evidência textual e a ambiguidade quanto à participação dos agentes, sem atribuir exclusivamente ao líder as duas ações.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação conserva os encadeamentos do grego, enquanto o ponto e vírgula torna perceptível a mudança de sujeito.
