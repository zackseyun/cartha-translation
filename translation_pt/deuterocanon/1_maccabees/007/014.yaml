base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/014.yaml
  text: For they said[a], “A man, a priest from the seed of Aaron, has come with the forces[b], and he will not wrong us.”
translation:
  language: pt
  text: 'Pois eles disseram: “Um homem, sacerdote da linhagem de Arão[a], veio com as forças militares[b] e não cometerá injustiça contra nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da semente de Arão”; isto é, da descendência ou linhagem de Arão.
    reason: lexical_alternative
  - marker: b
    text: Isto é, com tropas ou com o exército.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπαν γάρ
  choice: Pois eles disseram
  rationale: γάρ introduz a explicação da ação anterior, e o aoristo εἶπαν é traduzido naturalmente pelo pretérito perfeito em narrativa.
- source_word: Ἄνθρωπος ἱερεὺς
  choice: Um homem, sacerdote
  rationale: Mantém a referência a um indivíduo do sexo masculino e a aposição do grego, sem confundir ἄνθρωπος com a humanidade em geral.
- source_word: ἐκ τοῦ σπέρματος Ἀαρών
  choice: da linhagem de Arão
  rationale: Em contexto genealógico, σπέρμα indica descendência. “Linhagem” comunica com naturalidade a ascendência sacerdotal, enquanto a nota registra a expressão grega literal.
- source_word: ἦλθεν
  choice: veio
  rationale: O pretérito perfeito traduz diretamente o aoristo e, no discurso, indica uma chegada cuja relevância permanece no momento da fala.
- source_word: ἐν ταῖς δυνάμεσιν
  choice: com as forças militares
  rationale: O plural δυνάμεις designa aqui forças armadas. A explicitação “militares” evita que “forças” seja entendida em sentido abstrato, sem restringir indevidamente o referente a uma unidade específica.
- source_word: οὐκ ἀδικήσει ἡμᾶς
  choice: não cometerá injustiça contra nós
  rationale: Preserva tanto o aspecto moral de agir injustamente quanto a possibilidade de dano prático, em vez de reduzir o verbo apenas a ferir fisicamente.
theological_decisions:
- issue: Expressão genealógica ligada à legitimidade sacerdotal
  choice: da linhagem de Arão
  alternative: da semente de Arão; descendente de Arão
  rationale: A formulação mantém explícita a descendência aarônica na qual os falantes baseiam sua confiança, sem afirmar que essa ascendência garante de fato uma conduta justa.
- issue: Confiança dos falantes na conduta do sacerdote
  choice: não cometerá injustiça contra nós
  alternative: não nos fará mal
  rationale: A tradução conserva a dimensão ética de ἀδικέω e apresenta a declaração como expectativa dos próprios falantes, sem validá-la teologicamente.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez excessiva. “Linhagem” é mais corrente do que o literal “semente” em expressão genealógica; “forças militares” torna explícito o sentido contextual do plural grego.
