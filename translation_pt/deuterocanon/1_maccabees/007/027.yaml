  source_fidelity: 'O sentido central está bem representado: Nicanor chega a Jerusalém com uma força militar numerosa e manda uma mensagem de aparência pacífica, mas enganosa, a Judas e a seus irmãos. «Grande exército» é defensável para δυνάμει πολλῇ no contexto, embora «força» seja mais literal.'
