lexical_decisions:
- source_word: δυνάμει πολλῇ
  choice: com um grande exército
  rationale: Neste contexto militar, δύναμις designa uma força armada, não poder em sentido abstrato.
- source_word: μετὰ δόλου
  choice: com falsidade
  rationale: Preserva a ideia de dolo ou intenção enganosa sem acrescentar detalhes não expressos no grego.
- source_word: λόγους εἰρηνικούς
  choice: palavras de paz
  rationale: Mantém a expressão concreta do grego e indica uma mensagem aparentemente pacífica.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: seus irmãos
  rationale: Tradução direta, preservando a possível referência tanto a irmãos de sangue quanto a companheiros próximos conforme o contexto mais amplo.
