  text: And an assembly of scribes gathered to Alcimus and Bacchides to seek justice[a].
translation:
  language: pt
  text: E uma assembleia de escribas reuniu-se com Álcimo e Báquides para buscar o que é justo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «buscar justiça» ou «buscar aquilo que é correto». O grego δίκαια pode ter sentido tanto moral como jurídico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: reuniu-se
  rationale: O aoristo de ἐπισυνάγω descreve o ajuntamento do grupo; o singular concorda naturalmente com o coletivo «assembleia» em português.
- source_word: πρὸς
  choice: junto de
  rationale: Com pessoas após um verbo de reunião, indica aproximação e associação; «junto de» preserva ambas sem afirmar necessariamente apoio político.
- source_word: συναγωγὴ
  choice: assembleia
  rationale: Designa aqui um corpo reunido, não um edifício de sinagoga; «assembleia» mantém o caráter coletivo e relativamente formal.
- source_word: γραμματέων
  choice: de escribas
  rationale: No contexto judaico-helenístico, γραμματεῖς são escribas, termo histórico claro e consagrado em português.
- source_word: ἐκζητῆσαι
  choice: para buscar
  rationale: O infinitivo expressa finalidade; «para buscar» é direto e mantém aberta a natureza concreta dessa procura.
- source_word: δίκαια
  choice: o que era justo
  rationale: O neutro plural pode abranger coisas justas, justiça ou aquilo que é correto. A formulação portuguesa conserva a amplitude moral e jurídica e, pelo contexto narrativo passado, soa mais natural com «era».
- source_word: Ἄλκιμον
  choice: Álcimo
  rationale: Forma tradicional portuguesa do nome próprio, com acentuação gráfica adequada.
- source_word: Βακχίδην
  choice: Báquides
  rationale: Forma tradicional portuguesa do nome próprio grego.
theological_decisions:
- issue: Sentido de δίκαια em contexto politicamente carregado
  choice: o que era justo
  alternative: justiça; termos justos; aquilo que é correto
  rationale: O versículo não esclarece se os escribas procuravam reparação jurídica, condições equitativas ou retidão moral. A tradução mantém essa tensão em vez de impor uma leitura política ou teológica mais estreita.
translation_notes:
  register: Português moderno, digno e acessível, com formas onomásticas tradicionais. «Assembleia de escribas» preserva o caráter histórico; «junto de» é amplamente compreensível no português internacional e evita resolver a relação do grupo com Álcimo e Báquides.
