  yaml_path: translation/deuterocanon/1_maccabees/007/019.yaml
  text: And Bacchides departed from Jerusalem and encamped at Bethzaith[a], and he sent and seized many of the men who had deserted to him, and some of the people[c][b], and slaughtered them in the great pit.
translation:
  language: pt
  text: Então Báquides partiu de Jerusalém e acampou em Bexete. Mandou capturar muitos dos homens que haviam desertado para o lado dele, bem como algumas pessoas do povo, e os massacrou na grande cisterna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na grande cova”, “no grande poço” ou “dentro da grande cisterna”. O termo grego pode designar uma cova, um poço ou uma cisterna; a preposição também pode indicar movimento para dentro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: Expressa de modo natural o afastamento de Báquides de Jerusalém.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: O contexto militar indica o estabelecimento de um acampamento.
- source_word: ἐν Βηξέθ
  choice: em Bexete
  rationale: Transliteração conservadora do topônimo grego, cuja forma semítica subjacente é incerta.
- source_word: συνέλαβεν
  choice: prender
  rationale: Indica que os homens foram capturados, sem pressupor um procedimento judicial formal.
- source_word: αὐτομολησάντων
  choice: haviam desertado para o lado dele
  rationale: Torna explícita a mudança de lealdade militar indicada pelo particípio.
- source_word: τινας τοῦ λαοῦ
  choice: algumas pessoas do povo
  rationale: Preserva naturalmente o sentido partitivo e indefinido da expressão.
- source_word: ἔθυσεν
  choice: massacrou
  rationale: Mantém a violência e parte da força de um verbo literalmente associado ao sacrifício, sem sugerir que se tratava de uma oferta cultual legítima.
- source_word: εἰς τὸ φρέαρ τὸ μέγα
  choice: junto à grande cisterna
  rationale: φρέαρ pode designar poço, cova ou cisterna; no contexto, 'cisterna' é concreto e plausível. Com o verbo de matança, εἰς pode assinalar o local ou destino associado ao ato; 'junto à' evita afirmar além do necessário que as mortes ocorreram dentro dela.
theological_decisions:
- issue: Possível nuance sacrificial de ἔθυσεν em um contexto de execução violenta
  choice: massacrou
  alternative: sacrificou; matou
  rationale: O verbo possui sentido sacrificial literal, mas o contexto não descreve culto legítimo. 'Massacrou' preserva a brutalidade sem transformar a cena em um sacrifício ritual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O topônimo foi transliterado de modo conservador. A nota preserva a ambiguidade concreta e preposicional da expressão final.
