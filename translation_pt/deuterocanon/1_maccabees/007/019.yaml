  naturalness: O português é moderno, claro e adequado ao registro narrativo. «Capturou» é mais idiomático e semanticamente direto que «mandou prender» para συνέλαβεν, sem sugerir procedimento judicial.
  terminology: «Báquides», «Jerusalém» e «Bexete» são formas aceitáveis; «cisterna» é uma opção plausível para φρέαρ, desde que a nota mantenha as alternativas. «Massacrou» comunica a violência de ἔθυσεν sem apresentar a ação como oferta cultual legítima.
