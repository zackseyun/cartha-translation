  yaml_path: translation/deuterocanon/1_maccabees/007/041.yaml
  text: When those from the king were speaking abusively[b][a], your angel went out and struck down one hundred eighty-five thousand among them.
translation:
  language: pt
  text: Quando os homens do rei proferiam insultos[a][b], o teu anjo saiu e abateu cento e oitenta e cinco mil dentre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “blasfemavam”. O verbo grego pode indicar fala ofensiva, injúria ou linguagem ímpia; o texto principal conserva a formulação mais ampla.
    reason: lexical_alternative
  - marker: b
    text: Há aqui uma alusão à destruição do exército assírio nos dias de Ezequias; compare 2 Reis 19:35 e Isaías 37:36.
    reason: cross_reference
lexical_decisions:
- source_word: Οἱ παρὰ τοῦ βασιλέως
  choice: os homens do rei
  rationale: A expressão designa pessoas ligadas ao rei ou vindas da parte dele. “Os homens do rei” é natural em português e preserva a referência ampla a seus agentes ou integrantes de suas forças, sem especificar uma função que o grego não declara.
- source_word: ἐδυσφήμουν
  choice: proferiam insultos
  rationale: O verbo indica falar mal, injuriar ou usar linguagem ímpia. A formulação mantém o sentido amplo de fala ofensiva e deixa que o contexto indique seu caráter de afronta contra Deus.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Tradução direta e natural do aoristo, preservando a imagem de movimento.
- source_word: ἄγγελός σου
  choice: o teu anjo
  rationale: Embora ἄγγελος também possa significar “mensageiro”, a alusão histórica aponta para um agente celestial da intervenção divina; “anjo” expressa adequadamente esse referente.
- source_word: ἐπάταξεν
  choice: abateu
  rationale: O verbo significa golpear ou ferir e, neste contexto, implica morte. “Abateu” comunica o resultado letal sem recorrer a linguagem arcaica.
- source_word: ἐν αὐτοῖς
  choice: dentre eles
  rationale: A expressão assinala que o número abatido pertencia ao grupo mencionado. “Dentre eles” é idiomático e preserva essa relação coletiva.
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: cento e oitenta e cinco mil
  rationale: Reproduz por extenso o número explícito no texto grego, de modo apropriado à prosa bíblica corrente.
theological_decisions:
- issue: Se δυσφημέω deve receber aqui uma tradução explicitamente teológica
  choice: proferiam insultos
  alternative: blasfemavam
  rationale: A passagem evoca palavras arrogantes dirigidas contra Deus, mas o verbo grego possui sentido mais amplo de injuriar ou falar de modo ofensivo. A tradução principal preserva essa amplitude, e a nota registra a leitura teológica possível.
- issue: Referente de ἄγγελός σου
  choice: o teu anjo
  alternative: o teu mensageiro
  rationale: No episódio evocado, o executor do juízo divino é um agente celestial. “Anjo” corresponde ao contexto sem eliminar a dimensão sobrenatural, embora “mensageiro” seja lexicalmente possível em outros contextos.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da oração foi ajustada ao uso natural do português, sem alterar a relação temporal do grego. Evitaram-se tanto o termo teologicamente mais específico no texto principal quanto formas arcaicas como “feriu de morte” ou “desbaratou”.
