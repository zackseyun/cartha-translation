  yaml_path: translation/deuterocanon/1_maccabees/007/033.yaml
  text: And after these words Nikanor went up to Mount Zion, and some of the priests came out from the sanctuary, and some of the elders of the people, to greet him peaceably and to show him the burnt offering that was being offered for the king.
translation:
  language: pt
  text: Depois dessas palavras, Nicanor subiu ao monte Sião. Alguns dos sacerdotes saíram do santuário, e alguns dos anciãos do povo saíram para saudá-lo pacificamente e mostrar-lhe o holocausto que estava sendo oferecido em favor do rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέβη
  choice: subiu
  rationale: Preserva de modo natural o movimento ascendente em direção ao monte Sião.
- source_word: τὸ ὄρος Σιών
  choice: o monte Sião
  rationale: Forma tradicional, clara e geograficamente adequada em português.
- source_word: ἐξῆλθαν
  choice: saíram
  rationale: Expressa a saída de dentro do recinto sagrado sem impor uma perspectiva dêitica ausente no português.
- source_word: ἀπὸ τῶν ἱερέων ... καὶ ἀπὸ τῶν πρεσβυτέρων τοῦ λαοῦ
  choice: alguns dos sacerdotes ... e alguns dos anciãos do povo
  rationale: 'Torna explícito o provável valor partitivo da repetição de ἀπό: representantes dentre os dois grupos, sem sugerir que todos participaram.'
- source_word: ἐκ τῶν ἁγίων
  choice: do santuário
  rationale: No contexto de sacerdotes que saem para mostrar a oferta, o plural substantivado τὰ ἅγια designa naturalmente o lugar ou recinto sagrado.
- source_word: ἀσπάσασθαι αὐτὸν εἰρηνικῶς
  choice: saudá-lo pacificamente
  rationale: Conserva tanto o ato de saudação quanto o modo ou propósito pacífico, sem acrescentar cordialidade não expressa no grego.
- source_word: δεῖξαι αὐτῷ
  choice: mostrar-lhe
  rationale: Equivalente direto, natural e conciso do infinitivo de finalidade.
- source_word: τὴν ὁλοκαύτωσιν
  choice: o holocausto
  rationale: Termo sacrificial consagrado em português para a oferta inteiramente queimada; o contexto evita o sentido histórico moderno da palavra.
- source_word: τὴν προσφερομένην
  choice: que estava sendo oferecido
  rationale: A construção progressiva reproduz o aspecto de uma ação sacrificial em curso.
- source_word: ὑπὲρ τοῦ βασιλέως
  choice: em favor do rei
  rationale: Explicita o valor benefactivo ou representativo de ὑπέρ com maior precisão que o simples 'pelo rei'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe dividida em duas frases para evitar uma cadeia excessivamente longa. Mantém a terminologia bíblica corrente sem arcaísmos desnecessários. A ambiguidade de ἐκ τῶν ἁγίων foi resolvida no texto como 'do santuário' por adequação contextual; não foi julgada necessária uma nota nesta unidade.
