  text: And the king chose Bacchides[a], one of the king’s Friends, governor of the region beyond the River, and great in the kingdom, and faithful to the king[b],
translation:
  language: pt
  text: E o rei escolheu Báquides, um dos Amigos do rei[a], que governava a região de Além do Rio[b], homem importante no reino e fiel ao rei,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amigos do rei” provavelmente designa uma categoria ou posição oficial de conselheiros e companheiros reais na administração helenística, não apenas amigos pessoais.
    reason: cultural_note
  - marker: b
    text: “Além do Rio” é uma designação territorial, provavelmente da região a oeste do Eufrates sob administração imperial; também se pode traduzir simplesmente por “além do rio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: escolheu
  rationale: Traduz diretamente a ideia de escolher ou selecionar, sem acrescentar a noção mais específica de nomeação.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: um dos Amigos do rei
  rationale: Mantém o sentido partitivo e sinaliza, pela inicial maiúscula, o provável uso de «Amigos» como título ou categoria da corte helenística.
- source_word: κυριεύοντα
  choice: que governava
  rationale: Expressa de modo natural o exercício de autoridade por Báquides, sem transformar inequivocamente o particípio em um título oficial.
- source_word: ἐν τῷ πέραν τοῦ ποταμοῦ
  choice: a região de Além do Rio
  rationale: Apresenta a expressão como designação territorial, preservando sua forma tradicional e evitando o tecnicismo «Trans-Eufrates».
- source_word: μέγαν ἐν τῇ βασιλείᾳ
  choice: homem importante no reino
  rationale: Comunica o sentido contextual de elevada posição ou influência, e não de tamanho físico; «homem» é uma explicitação idiomática do referente masculino.
- source_word: πιστὸν τῷ βασιλεῖ
  choice: fiel ao rei
  rationale: Preserva a amplitude de πιστός, que no contexto político envolve lealdade e confiabilidade.
