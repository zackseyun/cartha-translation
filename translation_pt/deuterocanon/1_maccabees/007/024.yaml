base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/024.yaml
  text: And he went out into all the borders of Judea and the surrounding region[a], and he took vengeance on the men and on those who had deserted[c][b], and they were prevented from going into the country.
translation:
  language: pt
  text: Ele partiu para todos os confins da Judeia e para as regiões ao redor[a], vingou-se dos homens e dos que haviam desertado[b], e eles foram impedidos de entrar na região[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as áreas vizinhas”. O advérbio grego amplia o alcance para além dos confins propriamente ditos da Judeia.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos que haviam passado para o outro lado”. O termo grego se refere a desertores ou a pessoas que mudaram de lado.
    reason: lexical_alternative
  - marker: c
    text: Ou “de ir para a terra” ou “de entrar no território”. A palavra grega pode significar “terra”, “região”, “território” ou “área rural”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: percorreu
  rationale: No contexto narrativo, o verbo indica que ele saiu e avançou pelo território. “Percorreu” expressa com naturalidade em português o deslocamento abrangente sugerido pelo complemento geográfico, sem recorrer ao pouco idiomático “saiu para todos os confins”.
- source_word: πάντα τὰ ὅρια τῆς Ἰουδαίας
  choice: todos os confins da Judeia
  rationale: ὅρια pode designar limites, distritos ou territórios. “Confins” conserva a dimensão geográfica e a ideia de alcance por toda a extensão da Judeia.
- source_word: κυκλόθεν
  choice: as regiões ao redor
  rationale: O advérbio amplia o alcance para além dos confins propriamente ditos da Judeia. A formulação nominal é natural em português e mantém essa extensão geográfica.
- source_word: ἐποίησεν ἐκδίκησιν
  choice: vingou-se
  rationale: A expressão idiomática significa exercer ou tomar vingança. “Vingou-se” transmite diretamente sua força punitiva sem tornar explícita uma noção judicial que o grego não exige.
- source_word: ἐν τοῖς ἀνδράσιν
  choice: daqueles homens
  rationale: Com ἐκδίκησιν, ἐν assinala as pessoas sobre as quais recai a vingança. O demonstrativo torna a referência definida natural em português, sem identificar os homens além do que o texto afirma.
- source_word: τοῖς αὐτομολήσασιν
  choice: dos que haviam desertado
  rationale: O particípio aoristo de αὐτομολέω designa pessoas que desertaram ou passaram para o outro lado. “Haviam desertado” preserva a anterioridade da ação e mantém aberta a exata natureza da mudança de lado.
- source_word: ἐνεστάλησαν
  choice: foram impedidos
  rationale: O passivo indica que essas pessoas foram detidas ou impossibilitadas de prosseguir. “Foram impedidos” combina naturalmente com o infinitivo seguinte e preserva a voz passiva.
- source_word: τοῦ πορεύεσθαι εἰς χώραν
  choice: de entrar na região
  rationale: O infinitivo articular indica aquilo que foram impedidos de fazer. χώρα pode significar terra, região ou área rural; “região” é claro e evita especificar indevidamente se se trata do país inteiro ou do campo.
