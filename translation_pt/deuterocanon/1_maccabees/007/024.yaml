translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A frase mantém o ritmo narrativo, conserva a ambiguidade do referente de “eles” e evita identificar mais precisamente os homens, os desertores ou a região do que o grego permite.
