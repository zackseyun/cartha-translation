lexical_decisions:
- source_word: καὶ
  choice: Mas
  rationale: Embora καί normalmente signifique “e”, aqui a conjunção introduz uma reação contrastante às palavras mencionadas no contexto; “mas” expressa naturalmente essa relação em português.
- source_word: οὐ προσεῖχον
  choice: não deram atenção
  rationale: προσέχω com dativo significa prestar atenção, dar ouvidos ou levar em conta. “Não deram atenção” é corrente e preserva a ideia sem acrescentar uma motivação específica.
- source_word: τοῖς λόγοις αὐτῶν
  choice: às palavras deles
  rationale: A tradução mantém a referência ao conteúdo do que foi dito e permanece próxima da formulação grega.
- source_word: ἴδου γὰρ ὅτι
  choice: pois, eis que
  rationale: ἴδου funciona como expressão que chama a atenção, e γάρ introduz a razão. “Pois, eis que” conserva ambos os elementos, ainda que a construção seja mais solene que a fala cotidiana.
- source_word: ἦλθον
  choice: tinham vindo
  rationale: O mais-que-perfeito composto apresenta a vinda como circunstância anterior que explica por que as palavras não receberam atenção.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: com uma grande força
  rationale: δύναμις pode indicar poder, força ou contingente militar. Neste contexto narrativo, “grande força” sugere uma força armada sem substituir a ambiguidade lexical por “exército”.
