base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/043.yaml
  text: And the camps joined battle on the thirteenth day of the month Adar[a], and Nicanor’s camp was crushed,
translation:
  language: pt
  text: E os exércitos[a] entraram em combate no décimo terceiro dia do mês de adar, e o exército de Nicanor foi esmagado,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, literalmente, «os acampamentos». O grego usa «acampamentos» para se referir às forças militares adversárias.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆψαν ... εἰς πόλεμον
  choice: entraram em combate
  rationale: A expressão, em contexto militar, indica que as forças iniciaram o confronto; esta formulação comunica o sentido de modo natural sem ampliar o texto.
- source_word: αἱ παρεμβολαὶ
  choice: os dois exércitos
  rationale: παρεμβολή pode designar tanto o acampamento como a força acampada. O plural refere-se às forças adversárias; «os dois exércitos» torna essa referência clara em português corrente.
- source_word: τῇ τρισκαιδεκάτῃ τοῦ μηνὸς Ἀδάρ
  choice: no décimo terceiro dia do mês de adar
  rationale: O dativo marca a data, e «dia» está legitimamente subentendido. A grafia «adar» segue o uso português para o nome do mês.
- source_word: συνετρίβη
  choice: foi esmagado
  rationale: Preserva a força do passivo de συντρίβω, mais intenso do que o simples «foi derrotado».
- source_word: ἡ παρεμβολὴ Νικάνορος
  choice: o exército de Nicanor
  rationale: Neste contexto, a palavra denota a força militar de Nicanor. A escolha também mantém a correspondência com a primeira ocorrência, vertida como «exércitos».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Entraram em combate» é idiomático; «foi esmagado» conserva a intensidade do grego. O marcador [a] aparece após a expressão de data, acompanhando a colocação da camada inglesa fornecida, embora a nota esclareça a expressão militar anterior.
