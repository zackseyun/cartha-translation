lexical_decisions:
- source_word: ὤμοσεν
  choice: jurou
  rationale: O aoristo de ὄμνυμι indica a prestação de um juramento; “jurou” é direto, solene e natural em português.
- source_word: μετὰ θυμοῦ
  choice: com ira
  rationale: A expressão descreve o estado emocional em que ele jurou. “Com ira” conserva a força de θυμός sem recorrer a uma formulação excessivamente explicativa.
- source_word: παραδοθῇ
  choice: forem entregues
  rationale: O subjuntivo passivo de παραδίδωμι indica que Judas e seu grupo devem ser postos sob o poder de outra pessoa. “Forem entregues” preserva tanto a voz passiva quanto o contexto militar.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: o seu acampamento
  rationale: παρεμβολή pode designar um acampamento ou, por extensão, as forças nele reunidas. “Acampamento” mantém a imagem concreta e não restringe indevidamente o sentido a “exército”.
- source_word: τὸ νῦν
  choice: agora
  rationale: A expressão enfatiza o momento presente; “agora” é a equivalência mais direta e natural.
- source_word: εἰς χεῖράς μου
  choice: em minhas mãos
  rationale: Mantém a imagem idiomática grega de entrega ao controle ou poder de alguém, plenamente compreensível em português.
- source_word: καὶ ἔσται ἐὰν ἐπιστρέψω ἐν εἰρήνῃ
  choice: então, quando eu voltar em paz
  rationale: “Então” representa a transição introduzida por καὶ ἔσται, enquanto “quando eu voltar em paz” expressa de modo natural o valor temporal prospectivo de ἐὰν com o subjuntivo neste juramento. A oração fica deliberadamente incompleta, pois sua conclusão vem no versículo seguinte.
theological_decisions:
- issue: Fórmula de juramento incompleta neste versículo
  choice: Conservar a fala como uma oração condicional inacabada, terminando com vírgula
  alternative: Completar a ameaça com palavras do versículo seguinte
  rationale: O texto grego deste versículo termina antes da conclusão do juramento. Preservar essa interrupção respeita a divisão e a forma da fonte, sem importar antecipadamente a continuação.
- issue: Valor de ἐὰν em ἐὰν ἐπιστρέψω
  choice: quando eu voltar
  alternative: se eu voltar
  rationale: Com subjuntivo e referência futura, ἐὰν pode introduzir uma circunstância temporal esperada. “Quando” produz uma fala natural no contexto da ameaça, sem negar que a forma grega também comporte nuance condicional; essa alternativa é registrada para manter transparente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da fala preserva a solenidade e a tensão do juramento; a vírgula final sinaliza sua continuação no próximo versículo.
