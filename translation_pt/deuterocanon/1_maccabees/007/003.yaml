lexical_decisions:
- source_word: ἐγνώσθη αὐτῷ
  choice: chegou ao conhecimento dele
  rationale: 'Expressa naturalmente em português o aoristo passivo e o dativo: o fato se tornou conhecido para ele, sem fazê-lo agente explícito da descoberta.'
- source_word: τὸ πρᾶγμα
  choice: o que havia acontecido
  rationale: πρᾶγμα pode designar a questão, o caso ou o ocorrido. No contexto narrativo, esta formulação é clara e natural, sem especificar além do grego.
- source_word: Μή μοι δείξητε
  choice: Não me mostrem
  rationale: Preserva a proibição direta formada por μή com o imperativo e o sentido concreto de δείκνυμι, “mostrar”.
- source_word: τὰ πρόσωπα αὐτῶν
  choice: o rosto deles
  rationale: Mantém a expressão concreta do grego. Embora πρόσωπα esteja no plural, o distributivo singular é idiomático em português e significa o rosto de cada um deles.
