  text: And the matter became known to him[a], and he said, “Do not show me their faces.”
translation:
  language: pt
  text: 'E o assunto chegou ao conhecimento dele, e ele disse: “Não me mostrem os rostos deles.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Não me mostrem os rostos deles”, expressão que indica que ele se recusava a recebê-los em sua presença.
