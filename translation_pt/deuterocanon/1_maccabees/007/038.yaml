base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/038.yaml
  text: Take vengeance on this man and on his camp[a], and let them fall by the sword. Remember their blasphemies[b], and grant them no survival.
translation:
  language: pt
  text: Executa vingança contra este homem e contra o seu acampamento, e que eles caiam pela espada. Lembra-te das blasfêmias deles[a] e não lhes dês onde permanecer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “insultos” ou “difamações”. O termo grego pode referir-se mais amplamente a palavras injuriosas, embora o contexto desta oração favoreça “blasfêmias”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não lhes concedas permanência”, “refúgio” ou “trégua”. A expressão grega pode indicar tanto um lugar seguro onde ficar como a possibilidade de continuar ou obter alívio do juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον ἐκδίκησιν
  choice: Executa vingança
  rationale: A expressão grega pede uma ação punitiva concreta. “Executa vingança” conserva a força judicial e retributiva do original sem enfraquecê-la para uma formulação genérica sobre justiça.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ καὶ ἐν τῇ παρεμβολῇ αὐτοῦ
  choice: contra este homem e contra o seu acampamento
  rationale: Com ἐκδίκησιν, ἐν indica aqui os alvos da vingança. παρεμβολή designa naturalmente um acampamento militar e, por extensão, as forças ali reunidas.
- source_word: πεσάτωσαν ἐν ῥομφαίᾳ
  choice: que eles caiam pela espada
  rationale: O imperativo grego na terceira pessoa tem valor de súplica. O plural abrange o homem e o seu acampamento, e “pela espada” mantém o conhecido sentido de morte violenta em combate.
- source_word: μνήσθητι
  choice: Lembra-te
  rationale: Em uma oração dirigida a Deus, “lembra-te” preserva o apelo para que Deus leve a ofensa em conta e aja judicialmente.
- source_word: δυσφημιῶν
  choice: blasfêmias
  rationale: O termo pode designar fala injuriosa ou difamatória em sentido amplo; no contexto sagrado desta oração, “blasfêmias” comunica adequadamente a dimensão religiosa sem ocultar a amplitude lexical, registrada em nota.
- source_word: μὴ δῷς αὐτοῖς μονήν
  choice: não lhes dês onde permanecer
  rationale: μονή envolve permanência, estada ou lugar de permanência. A formulação conserva esse núcleo concreto e evita transformar sem apoio suficiente a expressão exclusivamente em “sobrevivência” ou “descanso”.
theological_decisions:
- issue: Natureza das δυσφημίαι recordadas na oração imprecatória
  choice: blasfêmias
  alternative: insultos ou difamações
  rationale: O contexto de conflito envolvendo o sagrado favorece o sentido religiosamente carregado, mas a nota preserva a possibilidade lexical mais ampla de linguagem injuriosa.
- issue: Sentido do pedido μὴ δῷς αὐτοῖς μονήν
  choice: não lhes dês onde permanecer
  alternative: não lhes concedas permanência, refúgio ou trégua
  rationale: A tradução principal retém a imagem de permanecer ou ter lugar estável, enquanto a nota reconhece que, neste contexto de juízo, a expressão também pode apontar para ausência de segurança ou de alívio.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. A oração imprecatória foi mantida direta, sem suavizar sua violência nem ampliar o texto para uma conclusão teológica não expressa. Os marcadores [a] e [b] aparecem no texto nos pontos exatos das ambiguidades lexicais.
