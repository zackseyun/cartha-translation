lexical_decisions:
- source_word: αἱ δυνάμεις
  choice: as tropas
  rationale: No contexto militar, o substantivo designa forças armadas ou soldados; “as tropas” é natural em português e evita o sentido abstrato de “poderes”.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: O aoristo indica diretamente o ato de matar, sem exigir a ideia mais específica de execução formal.
- source_word: ἐκάθισεν
  choice: sentou-se
  rationale: Mantém o sentido literal do verbo e, em conjunto com “no trono”, comunica naturalmente a ascensão de Demétrio ao poder.
- source_word: ἐπὶ θρόνου βασιλείας αὐτοῦ
  choice: no trono do seu reino
  rationale: Reproduz de perto a construção grega e conserva a imagem do trono associado ao reino de Demétrio, sem reduzi-la à paráfrase “tornou-se rei”.
- source_word: Δημήτριος
  choice: Demétrio
  rationale: Forma tradicional e corrente do nome grego em português.
