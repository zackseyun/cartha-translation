  text: They poured out the flesh of your holy ones and their blood around Jerusalem[c][b][a], and there was no one to bury them.
translation:
  language: pt
  text: Derramaram[c] a carne dos teus santos[a] e o sangue deles ao redor de Jerusalém[b], e não havia quem os sepultasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiéis” ou “piedosos”.
    reason: lexical_alternative
  - marker: b
    text: Esta frase ecoa de perto Salmos 79:2–3 (78:2–3 na Septuaginta).
    reason: cross_reference
  - marker: c
    text: Ou “verteram”; o verbo grego significa literalmente “derramaram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σάρκας
  choice: a carne
  rationale: O plural grego tem sentido concreto e coletivo. Em português, “a carne” é mais natural do que “as carnes” e preserva a imagem corporal forte, sem suavizá-la para “os corpos”.
- source_word: ὁσίων
  choice: santos
  rationale: O termo designa pessoas santas, piedosas ou fiéis a Deus. “Santos” conserva de modo claro e conciso a força religiosa do grego; a nota registra alternativas que evitam possíveis associações eclesiásticas posteriores.
- source_word: ἐξέχεαν
  choice: Derramaram
  rationale: O verbo significa literalmente “derramar”. Embora a combinação com “carne” seja incomum em português, ela preserva a imagem gráfica e a tensão da formulação grega, além de servir aos dois objetos coordenados, “carne” e “sangue”.
- source_word: κύκλῳ Ἱερουσαλήμ
  choice: ao redor de Jerusalém
  rationale: Expressa diretamente a localização espacial indicada por κύκλῳ e soa natural em português moderno.
- source_word: οὐκ ἦν αὐτοῖς ὁ θάπτων
  choice: não havia quem os sepultasse
  rationale: Reproduz idiomaticamente a construção existencial grega e mantém o sentido trágico de que ninguém lhes deu sepultura.
theological_decisions:
- issue: Tradução de ὁσίων em linguagem de lamento bíblico
  choice: santos
  alternative: fiéis; piedosos
  rationale: “Santos” preserva a dimensão de santidade e pertença a Deus sem explicar além do texto. Como o termo português pode ser entendido segundo usos eclesiásticos posteriores, as opções “fiéis” e “piedosos” são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação deliberadamente forte “derramaram a carne” conserva a imagem incomum do grego em vez de normalizá-la para “espalharam os corpos”.
