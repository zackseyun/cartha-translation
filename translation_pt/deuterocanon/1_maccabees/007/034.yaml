  text: And he sneered at them, and laughed at them and defiled them, and spoke arrogantly.
translation:
  language: pt
  text: E ele os tratou com desprezo, e riu deles, e os tornou impuros[a], e falou com arrogância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os contaminou” ou “os desonrou”.'
    reason: O verbo grego pode indicar tornar impuro, contaminar ou profanar/desonrar; o contexto não esclarece exatamente como isso ocorreu.
lexical_decisions:
- source_word: ἐμυκτήρισεν
  choice: os tratou com desprezo
  rationale: O verbo exprime escárnio e desdém, ligado figuradamente ao gesto de torcer o nariz. A formulação comunica esse desprezo em português atual sem se confundir com o verbo seguinte.
- source_word: κατεγέλασεν
  choice: riu deles
  rationale: Preserva a imagem concreta de rir de alguém e mantém a distinção em relação ao ato anterior de desprezo.
- source_word: ἐμίανεν
  choice: os profanou
  rationale: Mantém a força de manchar, contaminar ou tornar impuro, especialmente apropriada ao contexto sacerdotal, sem especificar um modo de profanação que o grego não explicita.
- source_word: ἐλάλησεν ὑπερηφάνως
  choice: falou com arrogância
  rationale: Expressão natural e clara que reproduz o sentido de falar de modo altivo, insolente ou arrogante.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: e ... e ... e ... e
  rationale: A repetição das conjunções conserva o efeito cumulativo e a cadência enfática do grego.
