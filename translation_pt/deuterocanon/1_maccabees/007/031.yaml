lexical_decisions:
- source_word: ἔγνω
  choice: soube
  rationale: O aoristo de γινώσκω indica aqui que Nicanor tomou conhecimento de um fato; «soube» expressa isso naturalmente em português.
- source_word: ἀπεκαλύφθη
  choice: havia sido descoberto
  rationale: O passivo indica que o plano se tornou conhecido. «Havia sido descoberto» preserva a voz passiva e evita possíveis conotações teológicas de «revelado».
- source_word: ἡ βουλὴ αὐτοῦ
  choice: seu plano
  rationale: No contexto político-militar, βουλή designa o plano ou propósito de Nicanor. «Plano» é claro e não acrescenta o tom pejorativo de «trama».
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Reproduz diretamente o sentido de ir para fora, sem explicitar uma marcha militar que o verbo, por si só, não declara.
- source_word: εἰς συνάντησιν
  choice: ao encontro de
  rationale: A expressão indica sair para encontrar alguém. O contexto fornece o caráter hostil do encontro, sem necessidade de acrescentar «em batalha».
- source_word: τῷ Ἰούδα
  choice: Judas
  rationale: Emprega a forma portuguesa convencional do nome Ἰούδας no livro de 1 Macabeus.
