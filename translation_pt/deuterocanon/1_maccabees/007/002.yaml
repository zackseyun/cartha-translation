    rationale: O imperfeito εἰσεπορεύετο apresenta a entrada como ação em curso. «Quando ele estava entrando» mantém esse aspecto com maior clareza no português moderno.
  revised_text: E aconteceu que, quando ele estava entrando no palácio real de seus antepassados[a], as tropas prenderam Antíoco e Lísias para levá-los até ele.
