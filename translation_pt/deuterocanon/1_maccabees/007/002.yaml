translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A fórmula narrativa foi mantida, enquanto a expressão incomum referente à residência dinástica foi vertida de modo inteligível e esclarecida em nota.
