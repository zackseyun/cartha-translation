  source_fidelity: 'O sentido central está correto: a fórmula narrativa, a entrada em curso, a detenção de Antíoco e Lísias pelas tropas e a finalidade de levá-los a «ele» são todos preservados. Contudo, «casa real» em português normalmente designa a família ou dinastia real, e não a residência na qual alguém pode entrar; isso torna menos explícito o referente espacial de οἶκον βασιλείας.'
