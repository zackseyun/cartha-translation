base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/002.yaml
  text: And it happened[a], as he was entering the royal house of his fathers, that the forces seized Antiochus and Lysias to bring them to him.
translation:
  language: pt
  text: E aconteceu que, quando ele estava entrando no palácio real de seus antepassados[a], as tropas prenderam Antíoco e Lísias para levá-los até ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “casa do reino de seus pais”; também pode ser entendido como “palácio de seus antepassados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: E aconteceu que, quando
  rationale: Preserva a fórmula narrativa e a relação temporal do grego sem produzir uma construção excessivamente rígida em português.
- source_word: εἰσεπορεύετο
  choice: ele entrava
  rationale: O imperfeito apresenta a entrada como ação em andamento no momento em que ocorreu a captura.
- source_word: οἶκον βασιλείας πατέρων αὐτοῦ
  choice: casa real de seus antepassados
  rationale: Expressa de modo natural a residência ou sede dinástica, mantendo tanto a imagem de 'casa' quanto a referência ancestral; a formulação grega incomum é registrada em nota.
- source_word: συνέλαβον
  choice: prenderam
  rationale: No contexto, o verbo indica que Antíoco e Lísias foram detidos pelas tropas; 'prenderam' evita sugerir necessariamente um procedimento judicial formal.
- source_word: αἱ δυνάμεις
  choice: as tropas
  rationale: O plural designa forças militares, e 'tropas' é claro e corrente em português.
- source_word: ἀγαγεῖν αὐτοὺς αὐτῷ
  choice: para levá-los até ele
  rationale: Conserva a ideia de finalidade do infinitivo e os referentes pronominais sem acrescentar uma interpretação não expressa no texto.
