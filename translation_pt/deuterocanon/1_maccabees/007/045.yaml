  text: And they pursued them for a day's journey from Adasa until they came to Gazera[a], and they sounded the signal trumpets behind them.
translation:
  language: pt
  text: E os perseguiram por uma jornada de um dia, desde Adasa até chegarem a Gazera; e tocaram atrás deles as trombetas de sinalização.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωκον
  choice: os perseguiram
  rationale: O imperfeito grego apresenta a perseguição em curso; em português, o pretérito perfeito é natural na sequência narrativa, enquanto o contexto preserva a ideia de ação prolongada.
- source_word: ὁδὸν ἡμέρας μιᾶς
  choice: por uma jornada de um dia
  rationale: A expressão indica a distância ou o percurso normalmente coberto em um dia; esta formulação mantém a imagem antiga com clareza.
- source_word: ἀπὸ Ἀδασὰ
  choice: desde Adasa
  rationale: Translitera o topônimo e marca com naturalidade o ponto de partida da perseguição.
- source_word: ἕως τοῦ ἐλθεῖν εἰς Γαζηρά
  choice: até chegarem a Gazera
  rationale: Reproduz com clareza o limite final indicado pela construção com ἕως e o infinitivo articular.
- source_word: ἐσάλπισαν
  choice: tocaram
  rationale: No contexto de trombetas, 'tocar' é a expressão portuguesa corrente e preserva o sentido militar do verbo.
- source_word: ὀπίσω αὐτῶν
  choice: atrás deles
  rationale: Mantém o valor espacial do grego sem explicitar além do texto se o toque visava perseguir, intimidar ou coordenar.
- source_word: ταῖς σάλπιγξιν τῶν σημασιῶν
  choice: as trombetas de sinalização
  rationale: O genitivo qualifica as trombetas por sua função de transmitir sinais; a formulação é natural e preserva o caráter militar.
