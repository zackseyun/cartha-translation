  text: Let there be no battle between me and you. I will come with a few men, so that I may see your faces in peace.
translation:
  language: pt
  text: “Não haja batalha entre mim e vocês. Virei com poucos homens, para vê-los em paz.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ ἔστω
  choice: Não haja
  rationale: Reproduz com naturalidade em português o valor proibitivo-jussivo da construção grega, como apelo direto.
- source_word: μάχη
  choice: batalha
  rationale: Conserva o sentido militar de luta ou combate adequado ao contexto de 1 Macabeus.
- source_word: ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν
  choice: entre mim e vocês
  rationale: Mantém a relação expressa no grego e preserva a distinção entre o falante singular e os destinatários plurais.
- source_word: ἥξω
  choice: Irei
  rationale: No contexto, o futuro de ἥκω comunica o deslocamento prometido pelo falante até os destinatários; “irei” é natural em português nessa perspectiva discursiva.
- source_word: ἐν ἀνδράσιν ὀλίγοις
  choice: com poucos homens
  rationale: Expressa o valor de acompanhamento de ἐν e mantém a referência contextual a um pequeno grupo masculino, provavelmente de acompanhantes ou soldados.
- source_word: ἵνα ἴδω
  choice: para ver
  rationale: A oração infinitiva com “para” transmite de modo claro e natural a finalidade marcada por ἵνα com o subjuntivo.
- source_word: ὑμῶν τὰ πρόσωπα
  choice: vê-los
  rationale: O grego diz literalmente “ver os rostos de vocês”, idiomatismo de encontro pessoal. “Vê-los” comunica essa intenção com naturalidade, sem uma formulação estranha em português.
- source_word: μετ’ εἰρήνης
  choice: em paz
  rationale: Correspondência direta e idiomática que mantém tanto a maneira pacífica quanto o ambiente relacional pretendido.
