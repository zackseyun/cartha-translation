base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/023.yaml
  text: And Judas saw all the evil that Alcimus and those with him had done among the sons of Israel[a], beyond even the nations.
translation:
  language: pt
  text: E Judas viu todo o mal que Álcimo e os que estavam com ele haviam feito entre os filhos de Israel, mais do que o das nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mais do que [o mal] dos gentios». A expressão grega indica que o mal praticado por Álcimo e seus aliados ultrapassou o das nações.'
    reason: alternativa lexical e esclarecimento do valor comparativo de ὑπὲρ τὰ ἔθνη
lexical_decisions:
- source_word: ἴδεν
  choice: viu
  rationale: Aoristo narrativo direto de ὁράω; «viu» é natural em português e pode abranger tanto a observação quanto o reconhecimento da situação.
- source_word: ἅπαν τὴν κακίαν
  choice: todo o mal
  rationale: Preserva a abrangência de ἅπαν e a força moral de κακία em linguagem corrente e digna.
- source_word: ἐποίησεν
  choice: haviam feito
  rationale: O mais-que-perfeito composto apresenta as ações de Álcimo e seus aliados como anteriores ao momento em que Judas as constatou; o plural segue o sujeito composto em português.
- source_word: οἱ μετ’ αὐτοῦ
  choice: os que estavam com ele
  rationale: Expressa de modo transparente o grupo de associados ou partidários de Álcimo sem especificar uma relação além da indicada pelo grego.
- source_word: ἐν υἱοῖς Ἰσραήλ
  choice: entre os filhos de Israel
  rationale: «Entre» comunica a esfera humana em que o mal foi praticado, e «filhos de Israel» conserva a expressão filial e histórico-pactual da fonte.
- source_word: ὑπὲρ τὰ ἔθνη
  choice: mais até do que as outras nações
  rationale: Traduz o valor comparativo de ὑπέρ e torna explícito, sem apagar a tensão retórica, que a maldade ultrapassou a das nações em contraste com Israel.
theological_decisions:
- issue: Tradução de υἱοῖς Ἰσραήλ
  choice: entre os filhos de Israel
  alternative: entre o povo de Israel; entre os israelitas
  rationale: A forma grega é explicitamente filial; a redação conserva essa imagem em vez de convertê-la silenciosamente em um coletivo genérico.
- issue: Tradução de τὰ ἔθνη
  choice: as outras nações
  alternative: os gentios; as nações
  rationale: No contexto judaico, a expressão contrasta Israel com os demais povos. «As outras nações» deixa essa relação clara em português atual, enquanto «os gentios» seria possível, mas mais marcado pela tradição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém «filhos de Israel» por fidelidade à imagem da fonte e usa um travessão para destacar a comparação enfática final.
