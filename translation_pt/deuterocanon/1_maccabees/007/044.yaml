base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/044.yaml
  text: And he himself fell first in the battle. But when his camp saw that Nicanor had fallen[a], they threw down their weapons and fled.
translation:
  language: pt
  text: E ele mesmo foi o primeiro a cair na batalha. Mas, quando as tropas dele[a] viram que Nicanor havia caído, jogaram as armas no chão e fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou "seu acampamento" ou "suas forças" (grego: ἡ παρεμβολὴ αὐτοῦ).'
    reason: A palavra grega pode designar o acampamento ou o contingente militar reunido; "tropas" exprime naturalmente, neste contexto, o grupo que abandona as armas e foge.
lexical_decisions:
- source_word: ἔπεσεν
  choice: cair / havia caído
  rationale: Preserva o idioma grego, que no contexto de batalha implica ser abatido ou morrer sem explicitar mais do que o texto.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Mantém a ênfase do pronome grego sobre o próprio Nicanor.
- source_word: πρῶτος
  choice: o primeiro
  rationale: Conserva diretamente a ideia de prioridade temporal ou sequencial.
- source_word: ἐν τῷ πολέμῳ
  choice: na batalha
  rationale: O contexto aponta para o confronto imediato, e não para a guerra em sentido amplo.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: o seu exército
  rationale: Embora παρεμβολή possa designar acampamento, aqui o sujeito que vê, abandona as armas e foge é o contingente militar de Nicanor; 'exército' comunica naturalmente essa metonímia em português.
- source_word: ῥίψαντες τὰ ὅπλα αὐτῶν
  choice: jogaram as armas no chão
  rationale: Expressa o abandono deliberado das armas antes da fuga e conserva a força de ῥίψαντες.
- source_word: ἔφυγον
  choice: fugiram
  rationale: Equivalente direto e natural no contexto militar.
