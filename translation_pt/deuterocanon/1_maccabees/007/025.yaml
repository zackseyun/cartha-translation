base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/007/025.yaml
  text: But when Alcimus saw that Judas and those with him had grown strong[a], and realized that he was not able to withstand them, he returned to the king and brought wicked charges against them.
translation:
  language: pt
  text: Mas, quando Álcimo viu que Judas e os que estavam com ele haviam se fortalecido e percebeu que não podia resistir-lhes[a], voltou ao rei e apresentou acusações maldosas contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego impresso diz literalmente: “percebeu que podia resistir-lhes”. O contexto, porém, indica fortemente o sentido “não podia resistir-lhes”, adotado na tradução.'
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ ἴδεν
  choice: Mas, quando ... viu
  rationale: ὡς com o aoristo introduz aqui uma oração temporal, enquanto δέ marca uma transição levemente adversativa na narrativa.
- source_word: ἐνίσχυσεν
  choice: haviam se fortalecido
  rationale: O verbo expressa aquisição de força; o mais-que-perfeito composto apresenta naturalmente em português o estado já alcançado por Judas e seus companheiros.
- source_word: οἱ μετ’ αὐτοῦ
  choice: os que estavam com ele
  rationale: Reproduz a expressão relacional sem especificar indevidamente que se tratava apenas de homens.
- source_word: ἔγνω
  choice: percebeu
  rationale: No contexto, indica o reconhecimento da situação por Álcimo, não apenas conhecimento abstrato.
- source_word: δύναται ὑποστῆναι αὐτούς
  choice: não podia resistir-lhes
  rationale: 'Embora o texto grego impresso não contenha negação, o contexto narrativo indica incapacidade: Álcimo vê o fortalecimento dos adversários e então recorre ao rei. A nota preserva transparentemente a forma transmitida.'
- source_word: ἐπέστρεψεν πρὸς τὸν βασιλέα
  choice: voltou ao rei
  rationale: Expressa de modo conciso e natural o ato de retornar ou dirigir-se novamente ao rei.
- source_word: κατηγόρησεν αὐτῶν πονηρά
  choice: apresentou acusações maldosas contra eles
  rationale: Mantém tanto o sentido acusatório de κατηγορέω quanto a avaliação moral comunicada por πονηρά; 'maldosas' sugere acusações de intenção maliciosa sem pressupor um processo judicial formal.
theological_decisions:
- issue: Sentido de δύναται ὑποστῆναι αὐτούς no contexto
  choice: 'Traduzir como incapacidade: “não podia resistir-lhes”.'
  alternative: 'Traduzir literalmente o texto grego impresso, sem negação: “podia resistir-lhes”.'
  rationale: A redação grega transmitida entra em tensão com a sequência imediata, pois Álcimo recorre ao rei depois de constatar a força de Judas. A tradução segue o sentido contextual provável, talvez decorrente de uma negação perdida, e registra a dificuldade textual em nota, sem ocultar a ambiguidade documental.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção é narrativa e natural, preservando em nota a importante tensão entre a forma do texto grego transmitido e o sentido exigido pelo contexto.
