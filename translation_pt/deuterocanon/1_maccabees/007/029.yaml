  text: And he came to Judas[a], and they greeted one another peaceably[b]; but the enemies were ready to seize Judas.
translation:
  language: pt
  text: Ele foi até Judas, e os dois se cumprimentaram pacificamente[a]; mas os inimigos estavam prontos para agarrar Judas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em paz”. O advérbio grego destaca a maneira aparentemente pacífica do encontro.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego pode significar “arrebatar”, “agarrar de repente” ou “apoderar-se de”, ressaltando a intenção traiçoeira por trás da saudação pacífica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς Ἰούδαν
  choice: foi até Judas
  rationale: O aoristo de ἔρχομαι com πρός indica movimento em direção a uma pessoa. “Foi até Judas” é natural em português e não acrescenta uma intenção ausente do texto.
- source_word: ἠσπάσαντο ἀλλήλους
  choice: os dois se cumprimentaram
  rationale: ἀσπάζομαι normalmente designa saudar ou cumprimentar. A reciprocidade de ἀλλήλους é expressa por “os dois ... se”, sem pressupor que tenha havido um abraço.
- source_word: εἰρηνικῶς
  choice: pacificamente
  rationale: O advérbio descreve a maneira aparentemente pacífica do encontro e mantém o contraste irônico com a intenção hostil que vem em seguida.
- source_word: οἱ πολέμιοι
  choice: os inimigos
  rationale: O adjetivo substantivado com artigo identifica um grupo definido de adversários, adequadamente expresso por “os inimigos”.
- source_word: ἕτοιμοι ἐξαρπάσαι
  choice: estavam prontos para agarrar
  rationale: ἐξαρπάζω pode indicar agarrar, arrebatar ou apoderar-se de alguém repentinamente. “Agarrar” comunica a ação hostil concreta sem transformar explicitamente a tentativa em prisão formal.
