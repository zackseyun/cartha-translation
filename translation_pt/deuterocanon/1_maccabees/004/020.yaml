  yaml_path: translation/deuterocanon/1_maccabees/004/020.yaml
  text: And he saw that they had been routed[a], and that they were setting the camp on fire; for the smoke that was visible made what had happened clear.
translation:
  language: pt
  text: E ele viu que tinham sido postos em fuga[a] e que estavam incendiando o acampamento, pois a fumaça que se via deixava claro o que havia acontecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tinham recuado” / “tinham sido derrotados e obrigados a fugir”; o verbo grego pode indicar que foram forçados a recuar, aqui em sentido militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδεν
  choice: viu
  rationale: O aoristo de ὁράω indica percepção visual direta; “viu” é natural e preciso no relato.
- source_word: τετρόπωται
  choice: tinham sido postos em fuga
  rationale: A forma perfeita, em contexto militar, descreve uma retirada forçada já consumada. A expressão preserva a voz passiva e evita ampliar o sentido para uma derrota total.
- source_word: ἐνπυρίζουσιν
  choice: estavam incendiando
  rationale: O presente descreve a ação em andamento de atear fogo ao objeto expresso.
- source_word: τὴν παρεμβολήν
  choice: o acampamento
  rationale: Equivalente corrente e claro para o termo militar que designa o acampamento.
- source_word: ὁ καπνὸς ὁ θεωρούμενος
  choice: a fumaça que se via
  rationale: Mantém a ideia de fumaça visivelmente observável, com formulação natural em português.
- source_word: ἐνεφάνιζε τὸ γεγονός
  choice: deixava claro o que havia acontecido
  rationale: Expressa de modo idiomático que a fumaça tornava evidente o fato já ocorrido.
