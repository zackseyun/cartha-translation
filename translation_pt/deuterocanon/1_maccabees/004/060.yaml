base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/060.yaml
  text: And at that time they built up Mount Zion with high walls all around and strong towers[a], lest the nations come and trample it, as they had done before.
translation:
  language: pt
  text: Naquele tempo, fortificaram o monte Sião com muralhas altas ao redor e torres fortes, para que as nações[a] não viessem pisoteá-lo, como haviam feito antes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os gentios”. O grego τὰ ἔθνη pode significar “as nações” ou “os gentios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: cercaram ... de
  rationale: O verbo significa literalmente “construíram”, mas a construção sintática apresenta muralhas e torres ao redor do monte. Em português, “cercaram ... de muralhas altas e torres fortes” expressa com naturalidade a ação concreta sem substituir o verbo por uma interpretação militar mais ampla como “fortificaram”.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: Naquele tempo
  rationale: Expressão temporal corrente, clara e fiel ao contexto narrativo.
- source_word: τὸ ὄρος Σιὼν
  choice: o monte Sião
  rationale: Forma tradicional e natural em português para o topônimo.
- source_word: κυκλόθεν
  choice: cercaram ... de
  rationale: A construção portuguesa comunica que as estruturas rodeavam o monte por todos os lados.
- source_word: τείχη ὑψηλὰ
  choice: muralhas altas
  rationale: “Muralhas” corresponde melhor que o genérico “muros” ao contexto de defesa urbana; “altas” preserva diretamente o adjetivo grego.
- source_word: πύργους ἰσχυρούς
  choice: torres fortes
  rationale: Tradução direta que mantém a ênfase na resistência das torres, sem acrescentar tamanho ou função não explicitados.
- source_word: μή ποτε
  choice: para que ... não
  rationale: Introduz de maneira natural em português a finalidade preventiva ou precaução expressa pelo grego.
- source_word: παραγενηθέντα τὰ ἔθνη
  choice: as nações ... viessem
  rationale: O particípio é vertido naturalmente como verbo finito. “As nações” preserva o sentido básico e a ambiguidade lexical de τὰ ἔθνη; “os gentios” permanece como alternativa em nota.
- source_word: καταπατήσωσιν
  choice: pisoteassem
  rationale: Preserva a imagem concreta de calcar ou pisar, em vez de interpretá-la apenas como “invadir” ou “dominar”.
- source_word: αὐτά
  choice: o
  rationale: Embora o pronome grego seja formalmente plural neutro, o singular português retoma naturalmente “o monte Sião” como o lugar fortificado. A referência plural às estruturas também é gramaticalmente possível no grego.
- source_word: ὡς ἐποίησαν τὸ πρότερον
  choice: como haviam feito antes
  rationale: O mais-que-perfeito composto exprime com clareza a ação anterior evocada retrospectivamente.
theological_decisions:
- issue: Sentido de τὰ ἔθνη no contexto histórico de 1 Macabeus
  choice: as nações
  alternative: os gentios
  rationale: “As nações” corresponde ao sentido lexical básico e evita transformar desnecessariamente a expressão em termo religioso técnico. No contexto, refere-se aos povos não judeus hostis, de modo que “os gentios” continua sendo uma tradução legítima e é registrada em nota.
- issue: Referente do pronome plural αὐτά
  choice: o, retomando o monte Sião como local fortificado
  alternative: as, retomando as fortificações
  rationale: A forma grega plural permite referência às estruturas ou ao conjunto fortificado; o português singular produz uma frase clara sem eliminar a possibilidade contextual de que o local e suas defesas sejam concebidos em conjunto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Naquele tempo” conserva o tom narrativo bíblico sem arcaísmo; “muralhas” e “pisoteassem” mantêm a concretude das imagens gregas.
