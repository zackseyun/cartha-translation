base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/018.yaml
  text: And Gorgias and the force are in the hill country near us[a]. But now stand against our enemies and fight them[b], and after this take the spoils with boldness.
translation:
  language: pt
  text: Górgias e as tropas estão na região montanhosa perto de nós[a]. Mas agora mantenham-se firmes diante dos nossos inimigos e lutem contra eles; depois disso, tomem os despojos com ousadia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no monte perto de nós”. A expressão grega pode referir-se tanto a um monte específico quanto, de modo mais amplo, à região montanhosa.
    reason: lexical_alternative
  - marker: b
    text: Ou “com confiança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμις
  choice: as tropas
  rationale: No contexto militar, designa uma força armada. “As tropas” é natural em português e não especifica indevidamente o tamanho nem a organização do contingente.
- source_word: ἐν τῷ ὄρει
  choice: na região montanhosa
  rationale: O singular grego pode indicar tanto um monte específico quanto, de modo mais amplo, uma área elevada ou montanhosa. A tradução principal expressa bem o sentido geográfico amplo, mantendo a alternativa em nota.
- source_word: ἐγγὺς ἡμῶν
  choice: perto de nós
  rationale: Tradução espacial direta e corrente, que preserva a proximidade imediata da ameaça.
- source_word: στῆτε
  choice: mantenham-se firmes diante
  rationale: O imperativo exige uma posição resoluta perante o inimigo. A formulação comunica resistência em combate sem ampliar indevidamente o texto.
- source_word: πολεμήσατε αὐτούς
  choice: lutem contra eles
  rationale: Expressão natural e direta para a ordem de entrar em combate.
- source_word: σκῦλα
  choice: os despojos
  rationale: Refere-se aos bens tomados após a vitória. “Despojos” é claro, tradicional no contexto militar e de registro digno.
- source_word: μετὰ παρρησίας
  choice: com ousadia
  rationale: Neste contexto, indica ação destemida ou confiante ao recolher os despojos. “Com ousadia” preserva a construção nominal e a força da expressão grega.
- source_word: Γοργίας
  choice: Górgias
  rationale: Forma portuguesa corrente do nome grego, com acentuação que orienta a pronúncia.
