  text: And they rebuilt the sanctuary and the interior of the house[b][a], and they consecrated the courts.
translation:
  language: pt
  text: E reconstruíram o santuário[a] e o interior do templo[b], e consagraram os pátios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o lugar santo». O grego τὰ ἅγια pode designar a área sagrada do templo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «casa»; aqui se refere ao edifício do templo.
    reason: cultural_note
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: reconstruíram
  rationale: Embora o verbo signifique literalmente «construíram», o contexto é o reparo do templo profanado; «reconstruíram» expressa essa atividade sem substituir a imagem de edificação por uma paráfrase mais ampla.
- source_word: τὰ ἅγια
  choice: o santuário
  rationale: No contexto do templo, o plural neutro designa naturalmente a área sagrada. «Santuário» é claro em português moderno e preserva a referência espacial.
- source_word: τὰ ἐντὸς τοῦ οἴκου
  choice: o interior do templo
  rationale: A expressão é espacial e concreta, referindo-se ao que ficava dentro do edifício. Traduzir οἶκος por «templo» evita a possível leitura de uma residência comum e comunica diretamente o referente.
- source_word: τὰς αὐλάς
  choice: os pátios
  rationale: Em arquitetura templária, αὐλαί são os pátios ou átrios. «Pátios» é natural e amplamente compreensível em português.
- source_word: ἡγίασαν
  choice: consagraram
  rationale: O verbo descreve a separação ritual para uso sagrado. «Consagraram» transmite esse sentido com linguagem corrente e digna.
theological_decisions:
- issue: Terminologia dos espaços sagrados do templo
  choice: Traduzir τὰ ἅγια como «o santuário» e distingui-lo do «interior do templo».
  alternative: Traduzir τὰ ἅγια como «o lugar santo» ou «as coisas sagradas».
  rationale: A sequência menciona áreas arquitetônicas reparadas e consagradas. A leitura locativa se ajusta melhor ao contexto, mas a nota preserva a alternativa lexical genuína.
- issue: Tradução de οἶκος no contexto templário
  choice: Usar «templo» no texto principal.
  alternative: Usar «casa», preservando literalmente a expressão bíblica para o templo.
  rationale: Aqui «templo» identifica de modo inequívoco o edifício referido e soa mais natural em português moderno, sem alterar o sentido contextual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Mantém a estrutura coordenada do grego e usa terminologia concreta para os espaços do templo.
