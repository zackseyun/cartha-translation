  yaml_path: translation/deuterocanon/1_maccabees/004/044.yaml
  text: And they deliberated concerning the defiled altar of burnt offering[a], what they should do with it.
translation:
  language: pt
  text: E deliberaram sobre o que deveriam fazer com o altar dos holocaustos profanado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contaminado” ou “violado”.'
    reason: Alternativas lexicais para βεβηλωμένου, que indica que o altar fora tratado de modo a violar seu caráter sagrado e sua condição cultual.
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: deliberaram
  rationale: O aoristo médio indica que consultaram entre si e ponderaram em conjunto; “deliberaram” preserva esse processo, sem reduzi-lo a uma decisão já tomada.
- source_word: θυσιαστηρίου
  choice: altar
  rationale: É o termo português comum e preciso; o genitivo seguinte especifica a função do altar.
- source_word: ὁλοκαυτώσεως
  choice: dos holocaustos
  rationale: Identifica o altar destinado às ofertas inteiramente queimadas. “Holocaustos” é a designação bíblica portuguesa consagrada e, no plural, soa natural neste contexto funcional.
- source_word: βεβηλωμένου
  choice: que havia sido profanado
  rationale: O particípio perfeito passivo descreve um estado resultante de violação cultual. A formulação verbal explicita com naturalidade tanto a ação anterior quanto a condição presente do altar.
- source_word: τί αὐτῷ ποιήσωσιν
  choice: para decidir o que fariam com ele
  rationale: Expressa a questão prática submetida à deliberação. “Com ele” traduz naturalmente o dativo αὐτῷ sem sugerir necessariamente uma ação hostil contra o altar; “para decidir” torna clara em português a relação com o ato de deliberar.
theological_decisions:
- issue: Descrição cultual da condição do altar
  choice: altar ... que havia sido profanado
  alternative: altar ... que havia sido contaminado; altar ... que havia sido dessacralizado
  rationale: “Profanado” preserva a ideia de violação do caráter sagrado do altar e se ajusta ao contexto cultual. “Contaminado” destaca mais a impureza ritual, enquanto “dessacralizado” pode sugerir uma mudança formal de estatuto não necessariamente afirmada pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção evita arcaísmos, mantém a deliberação coletiva e preserva o sentido cultual do texto grego.
