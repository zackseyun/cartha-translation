  text: And Gorgias took five thousand men and one thousand chosen horsemen[a], and the camp set out by night,
translation:
  language: pt
  text: E Górgias levou consigo cinco mil homens e mil cavaleiros escolhidos, e o acampamento[a] partiu de noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tropa”. Em grego, “o acampamento” pode designar coletivamente as tropas acampadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: levou consigo
  rationale: No contexto militar, o verbo indica que Górgias tomou esses homens consigo ou os colocou sob seu comando. “Levou consigo” expressa a ação com naturalidade sem especificar além do grego.
- source_word: πεντακισχιλίους ἄνδρας
  choice: cinco mil homens
  rationale: ἄνδρας significa literalmente “homens”; embora o contexto indique combatentes, a tradução preserva o termo comum usado na fonte.
- source_word: χιλίαν ἵππον ἐκλεκτήν
  choice: mil cavaleiros escolhidos
  rationale: ἵππον é um singular coletivo que designa a cavalaria ou os cavaleiros, e ἐκλεκτήν os qualifica como escolhidos ou selecionados. A formulação é clara e mantém os dois elementos.
- source_word: ἀπῆρεν
  choice: partiu
  rationale: O verbo indica partir ou pôr-se a caminho. “Partiu” é direto e não acrescenta a ideia mais específica de marchar.
- source_word: ἡ παρεμβολή
  choice: o acampamento
  rationale: παρεμβολή significa “acampamento” e pode designar, por metonímia, as tropas acampadas. O texto mantém a imagem grega, esclarecida em nota.
- source_word: νυκτός
  choice: de noite
  rationale: O genitivo funciona adverbialmente e indica o tempo da partida. “De noite” é natural em português e não acrescenta uma finalidade de segredo ou surpresa.
