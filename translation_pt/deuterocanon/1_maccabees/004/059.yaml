base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/059.yaml
  text: And Judas and his brothers and all the assembly of Israel decreed that the days of the dedication of the altar should be observed at their appointed times[a], year by year, for eight days, from the twenty-fifth day of the month Chislev, with gladness and joy.
translation:
  language: pt
  text: Judas, seus irmãos e toda a assembleia de Israel determinaram que os dias da dedicação do altar fossem celebrados nos tempos determinados, ano após ano, durante oito dias, a partir do vigésimo quinto dia do mês de Casleu[a], com júbilo e alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego Χασελεύ representa o nome do mês judaico também grafado “Quisleu” ou “Kislev”.
    reason: Registra formas alternativas reconhecidas do nome do mês e esclarece a transliteração adotada no texto.
lexical_decisions:
- source_word: ἔστησεν
  choice: determinaram
  rationale: 'Com a oração introduzida por ἵνα, o verbo expressa o estabelecimento formal de uma prática recorrente. O plural ajusta a concordância natural em português ao sujeito composto: Judas, seus irmãos e toda a assembleia.'
- source_word: ἐκκλησία
  choice: assembleia
  rationale: No contexto judaico anterior ao cristianismo, designa o povo reunido de Israel sem introduzir a associação posterior de “igreja”.
- source_word: ἵνα ἄγωνται
  choice: fossem celebrados
  rationale: A construção refere-se à observância festiva e anual desses dias. “Celebrados” comunica tanto a observância quanto o caráter alegre indicado no fim do versículo.
- source_word: ἐγκαινισμοῦ τοῦ θυσιαστηρίου
  choice: da dedicação do altar
  rationale: Expressa com clareza o ato cultual de dedicar novamente o altar, sem acrescentar qualificações ausentes do grego.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: nas épocas estabelecidas
  rationale: Mantém o sentido de períodos fixados para a celebração, preservando o plural do original em linguagem portuguesa natural.
- source_word: ἐνιαυτὸν κατʼ ἐνιαυτὸν
  choice: ano após ano
  rationale: Reproduz de modo idiomático a repetição anual enfatizada pela expressão grega.
- source_word: ἡμέρας ὀκτώ
  choice: durante oito dias
  rationale: Indica naturalmente em português a duração da celebração.
- source_word: ἀπὸ τῆς πέμπτης καὶ εἰκάδος
  choice: a partir do vigésimo quinto dia
  rationale: ἀπό marca o ponto inicial da observância de oito dias; “a partir de” preserva explicitamente essa função temporal.
- source_word: τοῦ μηνὸς Χασελεὺ
  choice: do mês de Casleu
  rationale: “Casleu” é uma forma tradicional e reconhecível em português para o nome do mês judaico refletido pela transliteração grega Χασελεύ.
- source_word: μετʼ εὐφροσύνης καὶ χαρᾶς
  choice: com júbilo e alegria
  rationale: Conserva os dois substantivos coordenados e sua ênfase na felicidade festiva, evitando uma repetição pouco natural em português.
theological_decisions:
- issue: Tradução de ἐκκλησία em um contexto judaico deuterocanônico
  choice: assembleia
  alternative: congregação; comunidade; igreja
  rationale: O termo se refere ao povo de Israel reunido, não especificamente à igreja cristã posterior. “Assembleia” preserva o sentido coletivo sem anacronismo eclesiológico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e leve solenidade adequada a uma decisão comunitária e a uma celebração litúrgica. A formulação segue prioritariamente o grego e conserva a repetição enfática de tempo e alegria.
