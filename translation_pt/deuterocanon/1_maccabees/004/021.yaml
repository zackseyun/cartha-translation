  yaml_path: translation/deuterocanon/1_maccabees/004/021.yaml
  text: But when they saw these things[a], they were greatly terrified; and when they also saw Judas's camp in the plain, ready for battle,
translation:
  language: pt
  text: Mas, quando viram essas coisas, ficaram muito apavorados; e, quando também viram o acampamento de Judas na planície, preparado para a formação de batalha,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «preparado para se colocar em ordem de batalha». O termo grego militar refere-se especificamente à formação ou disposição das tropas para o combate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: quando viram
  rationale: O particípio pode indicar ver ou perceber; a formulação temporal é natural em português e não transforma a percepção em uma conclusão mental mais específica.
- source_word: ἐδειλώθησαν σφόδρα
  choice: ficaram apavorados
  rationale: O verbo descreve a perda de coragem causada pelo medo, intensificada por σφόδρα. “Ficaram apavorados” comunica de modo claro tanto o forte temor quanto o abatimento militar.
- source_word: παρεμβολή
  choice: acampamento
  rationale: No contexto militar, o termo designa o acampamento ou arraial de um exército; “acampamento” é atual e claro.
- source_word: ἐν τῷ πεδίῳ
  choice: na planície
  rationale: πεδίον designa terreno plano e aberto; “na planície” preserva o sentido geográfico.
- source_word: ἑτοίμην εἰς παράταξιν
  choice: pronto para se dispor em ordem de batalha
  rationale: A expressão indica preparação para formação ou disposição militar. A tradução explicita esse sentido sem reduzi-lo apenas à ideia genérica de combater.
