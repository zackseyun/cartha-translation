base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/055.yaml
  text: And all the people fell on their faces[b][a], and they worshiped and blessed toward heaven the one who had prospered them.
translation:
  language: pt
  text: E todo o povo se prostrou com o rosto em terra, adorou e bendisse, em direção ao céu[a], aquele que os fizera prosperar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao céu». O grego pode indicar direção («em direção ao céu») ou empregar «céu» como referência reverente a Deus no céu.
    reason: lexical_alternative
  - marker: b
    text: Ou «aquele que lhes dera êxito».
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπεσον ... ἐπὶ πρόσωπον
  choice: se prostrou com o rosto em terra
  rationale: A expressão grega descreve prostração. Esta formulação comunica naturalmente a postura em português sem perder a imagem do rosto voltado ao chão.
- source_word: πᾶς ὁ λαός
  choice: todo o povo
  rationale: Reproduz de modo natural o sentido coletivo da expressão grega, sem introduzir a noção política mais específica de 'nação'.
- source_word: προσεκύνησαν
  choice: adorou
  rationale: No contexto cultual da rededicação do altar, o verbo indica adoração reverente, e não apenas uma inclinação corporal ou homenagem humana.
- source_word: ηὐλόγησαν
  choice: bendisse
  rationale: Preserva o sentido literal de bendizer a Deus, que em português religioso corrente equivale a louvá-lo, sem substituir o termo por uma interpretação mais ampla.
- source_word: εἰς οὐρανόν
  choice: em direção ao céu
  rationale: Conserva a força direcional de εἰς e também permite que 'céu' funcione como referência reverente e indireta a Deus, sem decidir entre essas nuances.
- source_word: τὸν εὐοδώσαντα αὐτούς
  choice: aquele que os fizera prosperar
  rationale: O particípio substantivado designa indiretamente a Deus e o verbo comunica a ideia de fazer prosperar ou conceder bom êxito. O mais-que-perfeito situa esse ato antes da adoração narrada.
theological_decisions:
- issue: Referente de «aquele que os fizera prosperar»
  choice: Manter a referência implícita a Deus por meio de «aquele», como no grego.
  alternative: 'Explicitar: «Deus, que os fizera prosperar».'
  rationale: O texto grego emprega um particípio substantivado e não nomeia Deus diretamente. A tradução preserva essa circunlocução reverente e sua relação potencial com «céu».
- issue: Função de «em direção ao céu»
  choice: Preservar a direção espacial e a possível circunlocução reverente.
  alternative: Traduzir simplesmente «ao céu», entendendo «céu» como referência a Deus.
  rationale: A construção grega admite tanto a direção dos atos de adorar e bendizer quanto uma referência indireta a Deus no céu; o texto principal não deve eliminar essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular verbal acompanha naturalmente o sujeito coletivo «todo o povo». «Bendisse» mantém o tom cultual sem tornar a frase excessivamente arcaica.
