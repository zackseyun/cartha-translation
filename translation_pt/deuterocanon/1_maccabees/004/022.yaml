lexical_decisions:
- source_word: ἔφυγον
  choice: fugiram
  rationale: O aoristo de φεύγω indica fuga diante do perigo; «fugiram» é natural e preserva o sentido de retirada militar.
- source_word: πάντες
  choice: todos eles
  rationale: O adjetivo tem uso substantivado e enfatiza a totalidade; «todos eles» explicita o sujeito de modo idiomático em português.
- source_word: γῆν
  choice: terra
  rationale: Neste contexto geográfico e militar, γῆ designa uma terra ou região; «terra» é direto e evita precisão territorial indevida.
- source_word: ἀλλοφύλων
  choice: dos estrangeiros
  rationale: ἀλλόφυλος designa pessoas pertencentes a outro povo. Aqui, «estrangeiros» mantém o sentido amplo, sem identificar especificamente os filisteus.
