  text: para atacar o acampamento dos judeus e golpeá-los de repente; e os homens da cidadela lhe serviam de guias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: para
  rationale: Introduz aqui o propósito pretendido do movimento militar mencionado no contexto anterior; “para” expressa esse valor de modo natural e conciso em português.
- source_word: ἐπιβαλεῖν ἐπὶ
  choice: atacar
  rationale: A expressão descreve um movimento hostil contra um alvo. “Atacar” comunica com clareza o sentido militar sem acrescentar detalhes não expressos no grego.
- source_word: παρεμβολή
  choice: acampamento
  rationale: No contexto militar, o termo designa o local onde o exército está acampado.
- source_word: πατάξαι
  choice: golpeá-los
  rationale: Mantém o sentido direto de ferir ou desferir golpes sem pressupor necessariamente que todos fossem mortos.
- source_word: ἄφνω
  choice: de repente
  rationale: Reproduz diretamente a ideia de uma ação súbita, sem transformar explicitamente o termo em “de surpresa”.
- source_word: οἱ υἱοὶ τῆς ἄκρας
  choice: os homens da Cidadela
  rationale: A expressão literal “os filhos da Cidadela” identifica os homens ligados à fortaleza, não descendentes biológicos. A formulação natural no texto é acompanhada de nota que preserva a forma grega.
- source_word: ἄκρα
  choice: Cidadela
  rationale: Designa a fortaleza conhecida como Acra, em Jerusalém. “Cidadela” comunica sua natureza, enquanto a nota preserva o nome grego tradicional.
- source_word: ὁδηγοί
  choice: guias
  rationale: O termo designa pessoas que mostram ou conduzem pelo caminho, sentido adequado à movimentação militar narrada.
