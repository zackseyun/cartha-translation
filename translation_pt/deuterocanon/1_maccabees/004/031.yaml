base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/031.yaml
  text: Hand over this camp into the hands of your people Israel, and let them be put to shame because of their army and their cavalry.
translation:
  language: pt
  text: Entrega[a] este acampamento nas mãos do teu povo Israel, e que eles sejam envergonhados por causa de sua força militar e de sua cavalaria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Encerra este acampamento nas mãos do teu povo Israel”. O verbo grego significa mais literalmente “fechar”, “encerrar” ou “confinar”; aqui, no contexto militar, tem o sentido de entregar a força inimiga ao poder de Israel.'
    reason: lexical_alternative
  - marker: b
    text: “Por causa de sua força militar e de sua cavalaria” também pode ser entendido como “em sua força e em sua cavalaria”. A palavra grega traduzida por “força militar” pode significar força, poder ou exército.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: Entrega
  rationale: O imperativo tem como sentido básico “fechar”, “encerrar” ou “confinar”, mas, nesta oração militar e com a expressão “nas mãos”, pede que Deus entregue a força inimiga ao domínio de Israel. “Entrega” comunica esse sentido de modo natural e digno.
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: O substantivo pode indicar tanto um acampamento quanto a força armada nele reunida. “Acampamento” preserva a imagem concreta do grego sem excluir a referência ao exército inimigo.
- source_word: εἰς χεῖρας
  choice: nas mãos
  rationale: Mantém o conhecido idioma bíblico de sujeição ao poder ou controle de alguém e continua natural em português.
- source_word: λαοῦ σου Ἰσραήλ
  choice: teu povo Israel
  rationale: Identifica Israel como o povo de Deus, sem acrescentar uma interpretação ausente do texto.
- source_word: αἰσχυνθήτωσαν
  choice: que eles sejam envergonhados
  rationale: Preserva a força passiva e volitiva do imperativo de terceira pessoa, indicando a vergonha pública resultante da derrota, e não apenas um sentimento interior.
- source_word: ἐπὶ τῇ δυνάμει
  choice: por causa de sua força militar
  rationale: δύναμις pode significar força, poder ou contingente militar. Em paralelo com a cavalaria, “força militar” torna claro o contexto bélico sem restringir o termo simplesmente a “exército”.
- source_word: τῇ ἵππῳ αὐτῶν
  choice: sua cavalaria
  rationale: O singular coletivo ἵππος pode designar os cavalos ou a cavalaria; no contexto militar, “cavalaria” é a formulação moderna mais clara.
theological_decisions:
- issue: Oração para que Deus entregue o inimigo a Israel
  choice: Entrega este acampamento nas mãos do teu povo Israel
  alternative: Encerra este acampamento nas mãos do teu povo Israel
  rationale: A tradução expressa uma petição por vitória concedida por Deus e preserva sua agência, enquanto evita uma reprodução excessivamente literal e pouco natural do verbo grego.
- issue: Motivo ou esfera da vergonha dos inimigos
  choice: por causa de sua força militar e de sua cavalaria
  alternative: em sua força e em sua cavalaria
  rationale: 'A preposição ἐπί com dativo admite mais de uma relação semântica. No contexto, “por causa de” é coerente: os recursos militares nos quais os inimigos confiam se tornam ocasião de vergonha. A alternativa é preservada em nota.'
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tratamento na segunda pessoa do singular (“teu”) conserva o tom direto da oração bíblica. A formulação mantém o idioma “nas mãos” e usa vocabulário militar claro, sem resolver silenciosamente as ambiguidades de σύγκλεισον, δύναμις e ἐπί.
