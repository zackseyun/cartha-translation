base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/011.yaml
  text: And all the nations will know that there is one who redeems and saves Israel[a].
translation:
  language: pt
  text: E todas as nações saberão que há alguém que resgata e salva Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ele é quem resgata e salva Israel”. O grego deixa o sujeito implícito.'
    reason: Leitura alternativa decorrente do sujeito não expresso no grego.
lexical_decisions:
- source_word: γνώσονται
  choice: saberão
  rationale: O futuro de γινώσκω anuncia que as nações virão a saber ou reconhecer esse fato; “saberão” é natural e preserva a força preditiva.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Mantém o alcance étnico e político abrangente da expressão sem restringi-la explicitamente a “gentios”.
- source_word: ὅτι ἔστιν
  choice: que há
  rationale: Reproduz de modo idiomático a leitura existencial e evita explicitar um sujeito que o grego deixa implícito.
- source_word: ὁ λυτρούμενος
  choice: quem resgata
  rationale: O particípio substantivado indica aquele que resgata; “quem resgata” é corrente, digno e conserva a ação característica sem impor um título.
- source_word: σώζων
  choice: salva
  rationale: Preserva o sentido comum e a ressonância teológica de σῴζω, formando uma coordenação natural com “resgata”.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: O nome próprio pode ser vertido diretamente, sem necessidade de expandi-lo para “o povo de Israel”.
theological_decisions:
- issue: Sujeito implícito dos particípios substantivados
  choice: “há quem resgata e salva Israel”
  alternative: “ele é quem resgata e salva Israel”
  rationale: Embora o contexto aponte para Deus, a oração grega não expressa o sujeito. A formulação existencial preserva essa contenção e a ambiguidade genuína, enquanto a nota registra a leitura anafórica possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Há quem” evita o menos natural “há um que” e mantém a indefinição do referente presente na construção grega.
