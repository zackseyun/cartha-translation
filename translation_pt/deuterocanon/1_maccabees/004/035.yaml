base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/035.yaml
  text: But when Lysias saw the rout that had happened to his own force[a], and the boldness that had arisen in Judas’s men, and how they were ready either to live or to die nobly, he departed for Antioch, and recruited foreign troops, intending, after becoming stronger in number[b], to come again into Judea.
translation:
  language: pt
  text: Mas Lísias, ao ver a debandada de suas próprias tropas, a coragem que havia surgido entre os homens de Judas[a] e como eles estavam dispostos tanto a viver como a morrer com nobreza, partiu para Antioquia. Ali, passou a recrutar soldados estrangeiros[b], pretendendo, depois de aumentar novamente suas tropas, voltar à Judeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “a coragem de Judas”. O plural da frase seguinte indica que o sentido inclui os homens que estavam com ele.
    reason: lexical_alternative
  - marker: b
    text: Ou “mercenários”. O verbo grego enfatiza o recrutamento de estrangeiros, sem declarar explicitamente que eram soldados pagos.
    reason: alternative_reading
lexical_decisions:
- source_word: τροπή
  choice: debandada
  rationale: No contexto militar, o termo indica a fuga desordenada ou o completo revés de uma força em combate; “debandada” conserva esse sentido mais específico que “derrota”.
- source_word: σύνταξις
  choice: tropas
  rationale: Embora possa designar a formação ou disposição ordenada de soldados, aqui se refere concretamente à força militar de Lísias; “tropas” é natural em português e adequado ao contexto.
- source_word: θάρσος
  choice: coragem
  rationale: Expressa coragem, ousadia ou confiança. “Coragem” liga-se naturalmente à disposição de viver ou morrer mencionada em seguida.
- source_word: τῆς δὲ Ἰούδα τὸ γεγενημένον θάρσος
  choice: a coragem que havia surgido entre os homens de Judas
  rationale: A expressão grega é condensada e, literalmente, pode ser entendida como “a coragem de Judas”; porém, o plural da oração seguinte mostra que estão em vista os que lutavam ao lado dele. A nota preserva a forma literal.
- source_word: ἕτοιμοι εἶεν ἢ ζῆν ἢ τεθνάναι γενναίως
  choice: estavam dispostos tanto a viver como a morrer com nobreza
  rationale: Mantém o paralelismo dos infinitivos e traduz γενναίως de modo a conservar sua conotação de bravura honrada, sem reduzir a expressão apenas à sobrevivência.
- source_word: ἀπῆρεν εἰς Ἀντιόχειαν
  choice: partiu para Antioquia
  rationale: Reproduz de modo direto e natural o movimento de partida em direção a Antioquia.
- source_word: ἐξενολόγει
  choice: passou a recrutar soldados estrangeiros
  rationale: O verbo enfatiza o alistamento de estrangeiros. “Mercenários” é possível no contexto, mas acrescentaria de modo mais explícito a ideia de serviço pago.
- source_word: πλεοναστὸν πάλιν γενηθέντα
  choice: depois de aumentar o número de suas tropas
  rationale: A frase indica que Lísias pretendia ampliar numericamente sua força antes de regressar; o objeto implícito é explicitado para clareza em português.
- source_word: παραγίνεσθαι εἰς τὴν Ἰουδαίαν
  choice: voltar à Judeia
  rationale: Expressa naturalmente a nova chegada de Lísias à Judeia e incorpora o sentido contextual de retorno para outra campanha.
