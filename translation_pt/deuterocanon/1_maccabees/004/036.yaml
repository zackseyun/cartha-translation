  text: Then Judas and his brothers said[a], “Look, our enemies have been crushed[b]. Let us go up to cleanse the sanctuary and dedicate it.”
translation:
  language: pt
  text: 'Então Judas e seus irmãos disseram: “Vejam! Nossos inimigos foram esmagados. Subamos para purificar o santuário e dedicá-lo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inaugurá-lo”. O verbo grego pode significar “dedicar” ou “inaugurar”; neste contexto, a dedicação ocorre após a profanação do santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Então ... disseram
  rationale: O δέ dá continuidade à narrativa, e o verbo no singular com sujeito composto anteposto é vertido naturalmente pelo plural em português.
- source_word: Ἰούδας καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: Judas e seus irmãos
  rationale: Mantém o nome tradicional da personagem e o sentido familiar direto de ἀδελφοί.
- source_word: Ἰδοὺ
  choice: Vejam!
  rationale: Interjeição atual que chama a atenção dos irmãos de Judas sem recorrer ao arcaico “Eis”.
- source_word: συνετρίβησαν
  choice: foram esmagados
  rationale: O aoristo passivo de συντρίβω expressa uma derrota decisiva; “esmagados” conserva a imagem forte do grego.
- source_word: ἀναβῶμεν
  choice: Subamos
  rationale: Preserva tanto o subjuntivo exortativo quanto a ideia de subida a Jerusalém e ao recinto do templo.
- source_word: καθαρίσαι τὰ ἅγια
  choice: purificar o santuário
  rationale: No contexto cultual, “purificar” comunica melhor que uma simples limpeza, enquanto “santuário” identifica naturalmente o espaço sagrado do templo.
- source_word: ἐγκαινίσαι
  choice: dedicá-lo novamente
  rationale: O verbo pode significar inaugurar ou dedicar; o contexto da restauração do templo profanado indica uma dedicação renovada, sem ocultar em nota a alternativa lexical mais direta.
theological_decisions:
- issue: Referente e caráter cultual de τὰ ἅγια e καθαρίσαι
  choice: purificar o santuário
  alternative: limpar as coisas santas; purificar o lugar santo
  rationale: O contexto aponta para o santuário do templo como unidade e para a remoção ritual da profanação; a tradução evita reduzir o ato a higiene física.
- issue: Valor contextual de ἐγκαινίσαι
  choice: dedicá-lo novamente
  alternative: dedicá-lo; inaugurá-lo
  rationale: O grego não contém um prefixo equivalente a “re-”, mas o santuário já existia e havia sido profanado. “Novamente” explicita a renovação indicada pelo contexto, enquanto a nota preserva a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Subamos” conserva de modo natural a direção do grego; “Vejam!” comunica a força apelativa de Ἰδοὺ. O único marcador de nota, [a], aparece no texto principal e corresponde à nota fornecida.
