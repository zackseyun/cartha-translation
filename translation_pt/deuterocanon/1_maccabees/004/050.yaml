base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/050.yaml
  text: And they burned incense on the altar[a], and they lit the lamps that were on the lampstand[b], and they shone in the temple.
translation:
  language: pt
  text: E queimaram incenso sobre o altar, acenderam as lâmpadas que estavam no candelabro, e elas brilhavam no santuário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no templo». O termo grego pode designar especificamente o santuário, isto é, o recinto sagrado do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθυμίασαν
  choice: queimaram incenso
  rationale: O verbo θυμιάω designa especificamente o ato de queimar incenso; a formulação preserva a ação ritual concreta.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sobre o altar
  rationale: ἐπί com acusativo indica aqui que o incenso foi posto e queimado sobre a superfície do altar.
- source_word: ἐξῆψαν
  choice: acenderam
  rationale: O verbo significa acender ou atear fogo e combina naturalmente com lâmpadas em português.
- source_word: τοὺς λύχνους
  choice: as lâmpadas
  rationale: λύχνος designa lâmpadas concretas, e não a luz em sentido abstrato.
- source_word: τῆς λυχνίας
  choice: do candelabro
  rationale: λυχνία é o suporte destinado às lâmpadas; «candelabro» é a designação bíblica tradicional e amplamente compreensível em português, sem introduzir a transliteração interpretativa «menorá».
- source_word: ἐφαίνοντο
  choice: elas brilhavam
  rationale: A forma verbal descreve a luz contínua das lâmpadas; o pronome explicita o sujeito em português e o imperfeito preserva o aspecto durativo.
- source_word: ἐν τῷ ναῷ
  choice: no santuário
  rationale: Neste contexto de mobiliário e culto, ναός se refere mais precisamente ao recinto sagrado do templo, não ao complexo inteiro.
theological_decisions:
- issue: Terminologia cultual na restauração do templo
  choice: 'Manter os elementos rituais concretos: incenso, altar, lâmpadas, candelabro e santuário.'
  alternative: Generalizar a cena como um ato de culto ou usar «templo» para ναός.
  rationale: O texto narra ações e objetos específicos da restauração cultual; conservar essa concretude evita impor uma interpretação denominacional e distingue o recinto sagrado do complexo mais amplo quando o contexto favorece essa precisão.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e terminologia bíblica amplamente reconhecível. O pronome «elas» evita ambiguidade quanto ao sujeito de «brilhavam».
