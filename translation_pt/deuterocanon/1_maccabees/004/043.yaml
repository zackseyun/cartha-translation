  text: And they cleansed the sanctuary, and carried the stones of defilement to an unclean place.
translation:
  language: pt
  text: E purificaram o santuário e levaram as pedras da profanação para um lugar impuro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαθάρισαν
  choice: purificaram
  rationale: No contexto da restauração do templo, o verbo expressa purificação cultual, sem excluir a limpeza material; “purificaram” preserva essa dimensão melhor que “limparam”.
- source_word: τὰ ἅγια
  choice: o santuário
  rationale: O neutro plural designa aqui o recinto sagrado no contexto do templo, e “o santuário” é a forma portuguesa mais clara e idiomática.
- source_word: ἦραν
  choice: levaram
  rationale: Embora o verbo possa significar literalmente levantar ou retirar, neste contexto indica transportar as pedras para outro local; “levaram” mantém concreta a ação.
- source_word: τοὺς λίθους τοῦ μιασμοῦ
  choice: as pedras da profanação
  rationale: A construção associa as pedras à contaminação cultual causada pela profanação. “Da profanação” soa natural em português e conserva o peso religioso de μίασμα.
- source_word: εἰς τόπον ἀκάθαρτον
  choice: para um lugar impuro
  rationale: “Impuro” preserva o vocabulário bíblico de pureza ritual e evita reduzir o sentido a um lugar meramente sujo.
theological_decisions:
- issue: Terminologia cultual na restauração do templo
  choice: 'Manter explicitamente a linguagem de pureza e profanação: “purificaram”, “profanação” e “impuro”'
  alternative: 'Empregar linguagem física ou genérica: “limparam”, “sujeira” e “lugar sujo”'
  rationale: O grego descreve não apenas limpeza material, mas a reversão de uma contaminação cultual. A tradução mantém essa tensão sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação simples com “E” acompanha o fluxo narrativo do grego. Não foram necessárias notas de rodapé.
