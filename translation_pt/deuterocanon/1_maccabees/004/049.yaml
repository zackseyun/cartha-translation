base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/049.yaml
  text: And they made new holy vessels[b][a], and they brought the lampstand and the altar of burnt offerings and of incense and the table into the temple.
translation:
  language: pt
  text: Fizeram novos utensílios sagrados e introduziram no santuário o candelabro, o altar dos holocaustos e do incenso,[a] e a mesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o altar para os holocaustos e o incenso”. No grego, tanto “holocaustos” como “incenso” estão ligados a “altar”, embora o contexto se refira ao conhecido par de altares do santuário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: fizeram
  rationale: Traduz diretamente a fabricação dos objetos de reposição, com linguagem simples e natural.
- source_word: τὰ σκεύη τὰ ἅγια καινά
  choice: novos utensílios sagrados
  rationale: “Utensílios” abrange os objetos usados no culto sem sugerir apenas recipientes; “novos” indica que foram recém-feitos, e “sagrados” reflete ἅγια.
- source_word: εἰσήνεγκαν
  choice: levaram para
  rationale: Expressa de modo natural o movimento de introduzir os objetos no santuário.
- source_word: τὴν λυχνίαν
  choice: o candelabro
  rationale: No contexto do templo, λυχνία designa o suporte das lâmpadas, tradicionalmente chamado de candelabro.
- source_word: τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων καὶ θυμιαμάτων
  choice: o altar dos holocaustos e o do incenso
  rationale: A sintaxe grega relaciona os dois genitivos a “altar”, mas o contexto cultual aponta para os dois altares conhecidos. A repetição elíptica de “o [altar]” torna isso claro sem abandonar a forma compacta.
- source_word: τὴν τράπεζαν
  choice: a mesa
  rationale: Mantém a concisão do grego e não acrescenta a identificação do pão da Presença, ausente no versículo.
- source_word: εἰς τὸν ναόν
  choice: para o santuário
  rationale: ναός se refere ao edifício sagrado interior, e não ao complexo mais amplo do templo; “santuário” comunica essa distinção diretamente em português.
theological_decisions:
- issue: Identificação dos altares
  choice: “o altar dos holocaustos e o do incenso”
  alternative: “o altar dos holocaustos e do incenso”
  rationale: Embora o grego use um único substantivo seguido de dois genitivos, o contexto se refere ao conhecido par de altares do culto. A tradução principal explicita minimamente o segundo altar, enquanto a nota preserva a possibilidade de reproduzir mais estritamente a construção grega.
- issue: Expansão dos referentes cultuais implícitos
  choice: Manter “a mesa” sem explicação adicional
  alternative: “a mesa dos pães da Presença”
  rationale: A identificação é provável pelo contexto, mas não está expressa neste versículo; acrescentá-la resolveria além do texto-fonte.
- issue: Alcance de ναός
  choice: “santuário”
  alternative: “templo”
  rationale: “Santuário” distingue o edifício interior do conjunto mais amplo do templo e se ajusta ao destino desses móveis cultuais.
translation_notes:
  register: Português moderno, claro e digno, com terminologia cultual reconhecível. Preferiu-se “utensílios sagrados” a “vasos sagrados” por ser mais abrangente e imediatamente compreensível; “santuário” traduz com precisão o alcance de ναός.
