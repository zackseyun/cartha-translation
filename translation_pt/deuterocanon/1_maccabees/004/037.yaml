lexical_decisions:
- source_word: συνήχθη
  choice: se reuniu
  rationale: O aoristo passivo de συνάγω tem aqui sentido coletivo e pode ser expresso naturalmente em português pela construção pronominal «se reuniu», sem exigir a forma mais rígida «foi reunido».
- source_word: ἡ παρεμβολὴ πᾶσα
  choice: todo o acampamento
  rationale: παρεμβολή designa o acampamento, por extensão incluindo o conjunto das pessoas nele; πᾶσα marca a totalidade. A tradução preserva a imagem coletiva do grego.
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Expressa diretamente o movimento ascendente, tanto topográfico quanto em direção a um lugar de destaque, sem acrescentar a ideia não explícita de marcha militar.
- source_word: εἰς ὄρος Σιών
  choice: ao monte Sião
  rationale: εἰς indica movimento em direção ao destino; «monte Sião» é a forma bíblica corrente e natural em português para ὄρος Σιών.
