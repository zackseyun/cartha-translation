  yaml_path: translation/deuterocanon/1_maccabees/004/017.yaml
  text: And he said to the people[a], “Do not desire the spoils[b], for the battle is before us,”
translation:
  language: pt
  text: 'E ele disse ao povo: “Não desejem os despojos[a], pois a batalha está à nossa frente[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não cobicem o saque”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pois a batalha está diante de nós”; ou, “está contra nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμήσητε
  choice: desejem
  rationale: O verbo expressa desejo forte. “Desejem” é claro e natural, sem acrescentar necessariamente a conotação moral específica de “cobiçar”.
- source_word: σκύλων
  choice: despojos
  rationale: No contexto militar, refere-se aos bens tomados do inimigo. “Despojos” é corrente em linguagem bíblica, compreensível e dignificado.
- source_word: πόλεμος
  choice: batalha
  rationale: Embora possa significar “guerra”, o contexto aponta para o confronto imediato, de modo que “batalha” é mais preciso.
- source_word: ἐξ ἐναντίας ἡμῶν
  choice: está à nossa frente
  rationale: A expressão indica posição oposta ou frontal. “Está à nossa frente” preserva o sentido espacial e comunica a iminência do confronto.
- source_word: λαόν
  choice: povo
  rationale: Mantém o termo amplo do grego, embora, no contexto, se trate do povo reunido para combater; evita restringi-lo interpretativamente a “tropas” ou “exército”.
