base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/008.yaml
  text: And Judas said to the men with him[a], “Do not fear their multitude[b], and do not be terrified by their attack.”
translation:
  language: pt
  text: 'E Judas disse aos homens que estavam com ele: “Não tenham medo do grande número deles, nem percam a coragem[a] diante da investida deles[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nem se deixem intimidar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do ataque deles” ou “do ímpeto deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: Não tenham medo
  rationale: Reproduz de modo direto e natural a proibição expressa pelo imperativo de φοβέομαι.
- source_word: τὸ πλῆθος αὐτῶν
  choice: do grande número deles
  rationale: πλῆθος destaca a superioridade numérica. A expressão é mais corrente em português moderno que “multidão deles” e preserva o sentido.
- source_word: μὴ δειλωθῆτε
  choice: nem percam a coragem
  rationale: A forma de δειλόω comunica a ideia de ceder ao medo ou perder o ânimo. Esta opção preserva a força da exortação sem acrescentar a censura moral que “não sejam covardes” poderia sugerir.
- source_word: τὸ ὅρμημα αὐτῶν
  choice: diante da investida deles
  rationale: ὅρμημα pode indicar um avanço impetuoso, assalto ou ataque. “Investida” é natural no contexto militar e conserva a noção de movimento ofensivo.
- source_word: τοῖς ἀνδράσιν τοῖς μετʼ αὐτοῦ
  choice: aos homens que estavam com ele
  rationale: Mantém a referência masculina explícita de ἀνδράσιν e traduz com clareza a construção τοῖς μετʼ αὐτοῦ.
