base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/010.yaml
  text: And now let us cry out to heaven; if he is willing toward us[a], he will remember the covenant of our fathers and crush this camp before us today.
translation:
  language: pt
  text: E agora clamemos ao céu; se ele se agradar de nós[a], ele se lembrará da aliança de nossos antepassados e esmagará hoje este acampamento diante de nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se ele nos favorecer” ou “se ele tiver prazer em nós”. O grego diz literalmente “se ele nos quiser”, expressando a disposição favorável de Deus para com seu povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: βοήσωμεν
  choice: clamemos
  rationale: O subjuntivo aoristo tem valor exortativo. “Clamemos” transmite um apelo urgente por socorro, adequado à crise militar, sem sugerir apenas aumento de volume.
- source_word: εἰς οὐρανόν
  choice: ao céu
  rationale: Preserva a expressão grega que aponta para um apelo a Deus sem substituir explicitamente “céu” por “Deus”.
- source_word: εἰ θελήσει ἡμᾶς
  choice: se ele se agradar de nós
  rationale: θέλω rege aqui um objeto pessoal e expressa disposição favorável. A formulação mantém a condição e comunica em português corrente a ideia de querer favoravelmente ou ter prazer no povo.
- source_word: μνησθήσεται
  choice: ele se lembrará
  rationale: “Lembrar-se” conserva a linguagem bíblica da memória da aliança, que implica ação e não mero recordar mental.
- source_word: διαθήκης πατέρων
  choice: da aliança de nossos antepassados
  rationale: Mantém a construção genitiva do grego e expressa com clareza moderna a referência à aliança ancestral, sem decidir explicitamente entre aliança pertencente aos antepassados e aliança feita com eles.
- source_word: συντρίψει
  choice: esmagará
  rationale: Expressa a força do verbo no contexto militar melhor que o mais brando “quebrará”.
- source_word: τὴν παρεμβολὴν ταύτην
  choice: este acampamento
  rationale: παρεμβολή pode designar acampamento ou exército. “Acampamento” conserva a imagem concreta do texto grego.
- source_word: κατὰ πρόσωπον ἡμῶν
  choice: diante de nós
  rationale: Equivalente idiomático e conciso da expressão grega, que pode significar “à nossa frente” ou “em nossa presença”.
theological_decisions:
- issue: Sujeito implícito dos verbos após a oração condicional
  choice: Explicitar o sujeito como “ele”, referindo-se implicitamente a Deus
  alternative: Manter o sujeito não expresso em português
  rationale: O clamor é dirigido “ao céu”, e os verbos no singular se referem naturalmente a Deus. A explicitação evita ambiguidade sem substituir “céu” por “Deus” no primeiro membro.
- issue: Sentido de εἰ θελήσει ἡμᾶς
  choice: “se ele se agradar de nós”
  alternative: “se ele nos favorecer”; “se ele nos quiser”; “se ele tiver prazer em nós”
  rationale: A expressão grega é incomum por empregar θέλω com objeto pessoal. A tradução conserva a disposição pessoal favorável e a nuance condicional, enquanto a nota registra a formulação mais literal e outras possibilidades.
- issue: Relação expressa por διαθήκης πατέρων
  choice: “aliança de nossos antepassados”
  alternative: “aliança com nossos antepassados”
  rationale: O genitivo grego não explicita a relação. A formulação principal preserva essa abertura em vez de definir a aliança exclusivamente como feita com os antepassados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Antepassados” evita a possível leitura estritamente paterna de “pais”; “clamemos” preserva o tom solene e urgente. O marcador [a] aparece no texto principal.
