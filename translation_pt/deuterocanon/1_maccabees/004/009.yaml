translation:
  language: pt
  text: Lembrem-se de como os nossos pais foram salvos no Mar Vermelho, quando o faraó os perseguiu com força.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com poder”. A expressão grega pode ter conotação de força militar neste contexto.
