  source_fidelity: 'A tradução acompanha bem a estrutura e os principais termos do grego: «Lembrem-se», «os nossos pais», «foram salvos», «Mar Vermelho» e «perseguiu». Contudo, «com seu exército» especifica indevidamente ἐν δυνάμει. A expressão significa literalmente algo como «com força/poder» e pode ter conotação militar no contexto, mas não nomeia explicitamente um exército.'
  naturalness: O português é claro, moderno e de registro bíblico adequado. «Mar Vermelho» deve levar maiúscula em «Mar», por ser o topônimo convencional.
  terminology: «Foram salvos» preserva apropriadamente o vocabulário de σῴζω no contexto de livramento histórico, sem impor leitura doutrinária posterior. «Os nossos pais» reproduz a linguagem ancestral masculina do grego. «Com força» mantém a amplitude semântica de ἐν δυνάμει melhor do que «com seu exército».
