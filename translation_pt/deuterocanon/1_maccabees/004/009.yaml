lexical_decisions:
- source_word: μνήσθητε
  choice: Lembrem-se
  rationale: O imperativo aoristo convoca os ouvintes à recordação ativa; esta é a forma direta e natural em português contemporâneo.
- source_word: ἐσώθησαν
  choice: foram salvos
  rationale: Preserva o sentido passivo de σῴζω e sua ressonância bíblica de salvação, sendo também natural para o livramento histórico narrado.
- source_word: οἱ πατέρες ἡμῶν
  choice: os nossos pais
  rationale: Reproduz a expressão ancestral explicitamente masculina do grego, aqui referente aos antepassados de Israel.
- source_word: ἐν θαλάσσῃ ἐρυθρᾷ
  choice: no mar Vermelho
  rationale: É a designação convencional da expressão grega no uso bíblico; a contração 'no' expressa naturalmente tanto o local quanto o âmbito do livramento.
- source_word: ἐδίωξεν
  choice: perseguiu
  rationale: Equivalente corrente e digno para διώκω em contexto narrativo e militar.
- source_word: ἐν δυνάμει
  choice: com seu exército
  rationale: No contexto da perseguição do faraó, δύναμις pode designar uma força militar; esta formulação comunica o sentido contextual com clareza, sem sugerir mera intensidade abstrata.
theological_decisions:
- issue: Linguagem de salvação em um contexto de livramento histórico
  choice: foram salvos
  alternative: foram libertos; foram resgatados
  rationale: A escolha mantém a linguagem própria de σῴζω e a ressonância intertextual bíblica, sem transformar o episódio em uma afirmação soteriológica posterior.
- issue: Linguagem ancestral marcada pelo gênero
  choice: os nossos pais
  alternative: os nossos antepassados
  rationale: Mantém a forma masculina explícita do texto grego, embora o referente histórico possa abranger de modo mais amplo a geração anterior de Israel.
- issue: Sentido militar de ἐν δυνάμει
  choice: com seu exército
  alternative: com força; com poder
  rationale: O contexto do faraó em perseguição favorece o sentido coletivo-militar de δύναμις; a alternativa mais formalmente aberta permanece indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem narrativa e a linguagem bíblica de salvação foram preservadas sem rigidez sintática.
