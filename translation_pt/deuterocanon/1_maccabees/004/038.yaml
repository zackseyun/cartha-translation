base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/038.yaml
  text: And they saw our sanctuary laid waste[a], and the altar defiled, and the gates burned down, and in the courts plants growing as in a thicket or as on one of the mountains[b], and the chambers torn down.
translation:
  language: pt
  text: E eles viram o nosso santuário devastado, o altar profanado[a], os portões queimados, plantas crescendo nos pátios como num bosque cerrado ou como em uma das montanhas, e as câmaras[b] derrubadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contaminado”. O grego ressalta a profanação do que era sagrado.
    reason: lexical_alternative
  - marker: b
    text: O termo grego se refere a salas ou dependências associadas ao complexo do templo; sua função arquitetônica exata é incerta.
    reason: cultural_note
lexical_decisions:
- source_word: ἁγίασμα
  choice: santuário
  rationale: No contexto do templo, designa o lugar ou recinto sagrado; “santuário” é natural e preserva o sentido cultual.
- source_word: ἠρημωμένον
  choice: devastado
  rationale: Expressa o estado de ruína e desolação do santuário com linguagem atual e digna.
- source_word: θυσιαστήριον
  choice: altar
  rationale: Equivalente cultual direto e consagrado em português.
- source_word: βεβηλωμένον
  choice: profanado
  rationale: Destaca que algo sagrado foi violado e tornado impróprio para o culto; “contaminado” é uma alternativa possível.
- source_word: πύλας
  choice: portões
  rationale: Indica as grandes portas de acesso ao complexo do templo; “portões” é claro no português moderno.
- source_word: κατακεκαυμένας
  choice: queimados
  rationale: O particípio perfeito indica o estado resultante da ação do fogo; o contexto já comunica a destruição.
- source_word: αὐλαῖς
  choice: pátios
  rationale: Refere-se aos pátios do complexo do templo e é mais corrente para leitores modernos do que “átrios”.
- source_word: φυτὰ πεφυκότα
  choice: plantas crescendo
  rationale: Reproduz de modo simples a imagem da vegetação que cresceu sem controle.
- source_word: δρυμῷ
  choice: bosque cerrado
  rationale: Transmite a comparação com vegetação silvestre e densa sem especificar indevidamente uma espécie de árvore.
- source_word: παστοφόρια
  choice: câmaras
  rationale: O termo designa dependências ligadas ao complexo do templo, mas sua função arquitetônica exata é incerta; “câmaras” evita especificação excessiva.
- source_word: καθῃρημένα
  choice: derrubadas
  rationale: Comunica de forma natural que essas estruturas haviam sido desmanteladas ou demolidas.
theological_decisions:
- issue: Sentido cultual de βεβηλωμένον
  choice: profanado
  alternative: contaminado
  rationale: “Profanado” preserva explicitamente a violação do caráter sagrado do altar sem acrescentar uma teoria específica de pureza ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição inicial da coordenação grega foi suavizada sem perder a sequência visual da devastação. A comparação incomum “como em uma das montanhas” foi mantida para preservar a forma e a ambiguidade do original.
