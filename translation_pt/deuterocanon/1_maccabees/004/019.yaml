  text: While Judas was still saying these things in a low voice[a], a certain part appeared, coming out from the mountain.
translation:
  language: pt
  text: Enquanto Judas ainda dizia essas coisas em voz baixa, uma parte apareceu, saindo do monte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «uma parte»; provavelmente se refere a uma parte do exército adversário que se tornou visível ao sair do monte.
    reason: A expressão grega não identifica explicitamente aquilo de que se trata essa «parte»; a nota preserva a ambiguidade no texto e informa o referente contextual provável.
lexical_decisions:
- source_word: ἔτι
  choice: enquanto ... ainda
  rationale: 'Expressa naturalmente a simultaneidade: a ação seguinte ocorreu quando Judas ainda falava.'
- source_word: ὑποφθεγγομένου
  choice: dizia ... em voz baixa
  rationale: Preserva a ideia de falar em tom baixo, sem recorrer a «murmurava», que poderia sugerir queixa ou descontentamento.
- source_word: Ἰούδου
  choice: Judas
  rationale: Forma tradicional e amplamente reconhecida do nome neste contexto histórico.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Mantém o demonstrativo plural e sua referência às palavras anteriores de Judas.
- source_word: ὤφθη
  choice: apareceu
  rationale: Traduz de modo idiomático o passivo grego empregado com sentido intransitivo de tornar-se visível.
- source_word: μέρος τι
  choice: uma parte
  rationale: Conserva a expressão deliberadamente indefinida do grego sem acrescentar «do exército inimigo», referente provável, mas não explícito.
- source_word: ἐκκύπτον
  choice: saindo
  rationale: No contexto, indica algo que surge à vista ou emerge; «saindo» mantém a imagem sem especificar além do texto.
- source_word: ἐκ τοῦ ὄρους
  choice: do monte
  rationale: Representa diretamente o singular ὄρος; «monte» é natural no registro bíblico moderno e não o amplia para uma região montanhosa.
