  text: And they set the stones aside on the temple hill in a suitable place[a], until a prophet should come to give an answer concerning them.
translation:
  language: pt
  text: E puseram as pedras de lado, no monte do templo, em lugar apropriado[a], até que viesse um profeta para dar uma resposta a respeito delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «no monte da casa», isto é, no monte do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθεντο
  choice: puseram ... de lado
  rationale: A forma média indica que as pedras foram retiradas e reservadas para uma decisão posterior. A expressão é natural em português e mantém esse caráter provisório.
- source_word: τοὺς λίθους
  choice: as pedras
  rationale: O grego menciona apenas «as pedras». Embora o contexto indique que eram pedras do altar, a tradução não acrescenta essa especificação.
- source_word: ἐν τῷ ὄρει τοῦ οἴκου
  choice: do monte do templo
  rationale: A expressão literal «monte da casa» designa o monte onde ficava o templo. «Monte do templo» comunica o referente com clareza, enquanto a nota registra a forma literal.
- source_word: ἐν τόπῳ ἐπιτηδείῳ
  choice: num lugar apropriado
  rationale: ἐπιτήδειος expressa adequação ou conveniência. «Apropriado» é corrente e preserva o sentido avaliativo.
- source_word: μέχρι τοῦ παραγενηθῆναι
  choice: até que viesse
  rationale: A construção aponta para um acontecimento futuro aguardado a partir da perspectiva narrativa. O imperfeito do subjuntivo é idiomático em português nesse contexto.
- source_word: προφήτην
  choice: um profeta
  rationale: O substantivo sem artigo não identifica um profeta específico; expressa a expectativa de futura orientação profética.
- source_word: τοῦ ἀποκριθῆναι περὶ αὐτῶν
  choice: para dar uma resposta a respeito delas
  rationale: Mantém o sentido básico de «responder» e evita interpretar a resposta necessariamente como sentença jurídica formal.
theological_decisions:
- issue: Natureza da função profética esperada
  choice: aguardava-se um profeta que desse orientação autorizada a respeito das pedras
  alternative: o profeta proferiria uma decisão jurídica formal, ou a expressão seria apenas uma fórmula para adiar a decisão
  rationale: O grego afirma que as pedras permaneceriam guardadas até a chegada de um profeta capaz de responder sobre elas. A tradução preserva essa expectativa sem definir além do texto a natureza jurídica, o mecanismo ou a ocasião dessa resposta.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva a sequência narrativa e a expectativa futura do grego sem rigidez excessiva.
