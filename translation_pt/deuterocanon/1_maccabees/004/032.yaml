  text: Give them cowardice[a], and melt the boldness of their strength, and let them be shaken by their own crushing.
translation:
  language: pt
  text: Dá-lhes covardia e derrete a ousadia de sua força; que sejam abalados por sua ruína.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por seu esmagamento”. A expressão grega também pode indicar destruição ou ruína.'
    reason: alternativa lexical e preservação da imagem concreta
lexical_decisions:
- source_word: δὸς
  choice: Dá
  rationale: Mantém a forma imperativa direta e a simplicidade vigorosa da oração.
- source_word: δειλίαν
  choice: covardia
  rationale: Expressa falta de coragem ou pusilanimidade, e não apenas medo comum, preservando o sentido militar do contexto.
- source_word: τῆξον
  choice: faz derreter
  rationale: Conserva a metáfora concreta de algo que se desfaz, sem reduzi-la ao sentido mais abstrato de “enfraquece”.
- source_word: θράσος
  choice: ousadia
  rationale: Pode indicar coragem agressiva, audácia ou atrevimento. “Ousadia” preserva essa amplitude sem impor uma avaliação moral mais específica.
- source_word: ἰσχύος
  choice: força
  rationale: É o equivalente natural de ἰσχύς e mantém a relação genitiva presente na expressão grega.
- source_word: σαλευθήτωσαν
  choice: que eles sejam abalados
  rationale: Reproduz o imperativo passivo e a imagem de desestabilização ou perturbação.
- source_word: συντριβῇ
  choice: ruína
  rationale: Oferece uma formulação portuguesa natural para o resultado destrutivo, enquanto a nota preserva a imagem mais concreta de esmagamento.
- source_word: αὐτῶν
  choice: sua
  rationale: Retoma os inimigos como referentes da ruína sem acrescentar ao texto uma reflexividade mais enfática do que o pronome grego exige.
theological_decisions:
- issue: Linguagem de oração imprecatória
  choice: Manter os pedidos diretos para que os inimigos recebam covardia, percam a ousadia e sejam abalados.
  alternative: Suavizar o texto, apresentando-o apenas como um pedido genérico de derrota.
  rationale: O grego formula uma súplica direta pela intervenção de Deus contra forças hostis; a tradução conserva sua tensão teológica e sua força retórica.
- issue: Sentido de τῇ συντριβῇ αὐτῶν
  choice: “por sua ruína”, com alternativa concreta em nota
  alternative: “com o seu esmagamento”
  rationale: “Ruína” é mais natural no corpo do texto, mas συντριβή também pode evocar esmagamento ou despedaçamento; a nota evita apagar essa força imagética.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A estrutura conserva o paralelismo da oração e sua linguagem forte, sem suavização denominacional ou doutrinária.
