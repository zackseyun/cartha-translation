base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/023.yaml
  text: And Judas returned to the plunder of the camp[a], and took much gold and silver, and blue cloth and purple cloth and sea goods[b], and great wealth.
translation:
  language: pt
  text: Judas voltou aos despojos do acampamento e tomou muito ouro e prata, tecido azul e tecido púrpura, artigos do mar[a] e grandes riquezas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “tecido azul-marinho” ou “púrpura marinha”. O termo grego significa literalmente “do mar”, e não se sabe ao certo o que ele designa nesta lista de objetos valiosos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: voltou
  rationale: O verbo indica voltar ou retornar; “voltou” é claro e natural no contexto do movimento de Judas de volta ao acampamento.
- source_word: σκυλίαν τῆς παρεμβολῆς
  choice: recolher os despojos do acampamento
  rationale: σκυλίαν designa bens tomados do inimigo, e παρεμβολῆς, o acampamento militar. A construção final com “para recolher” expressa em português corrente que Judas voltou a fim de tomar esses despojos.
- source_word: ἔλαβε
  choice: tomou
  rationale: Mantém o singular do grego, cujo sujeito gramatical é Judas, sem impedir que ele aja como líder representativo de seus homens.
- source_word: χρυσίον καὶ ἀργύριον πολὺ
  choice: muito ouro e prata
  rationale: Reproduz de modo natural a quantidade abundante aplicada ao conjunto dos dois metais preciosos.
- source_word: ὑάκινθον καὶ πορφύραν
  choice: tecidos azuis e púrpura
  rationale: No inventário de objetos valiosos, os termos cromáticos provavelmente designam tecidos tingidos. “Azuis e púrpura” preserva as cores sem usar o pouco transparente “jacinto”.
- source_word: θαλασσίαν
  choice: artigos marinhos
  rationale: O adjetivo substantivado significa literalmente algo “do mar” ou “marinho”, mas seu referente exato neste inventário é incerto. A tradução ampla evita definir indevidamente se eram produtos do mar ou um tecido de corante marinho.
- source_word: πλοῦτον μέγαν
  choice: grandes riquezas
  rationale: Expressa de maneira idiomática e digna a grande quantidade de bens capturados.
