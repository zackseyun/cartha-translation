translation:
  language: pt
  text: Eles se prostraram com o rosto em terra, tocaram as trombetas de sinalização[a] e clamaram ao céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “as trombetas dos sinais”. A expressão provavelmente se refere a trombetas usadas para sinalização, e não a estandartes ou bandeiras.
