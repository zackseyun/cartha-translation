lexical_decisions:
- source_word: ἔπεσον ἐπὶ πρόσωπον ἐπὶ τὴν γῆν
  choice: se prostraram com o rosto em terra
  rationale: A expressão descreve literalmente a queda com o rosto voltado para o chão; esta formulação preserva a postura física e soa natural e digna em português.
- source_word: ἐσάλπισαν
  choice: tocaram
  rationale: O verbo significa tocar ou fazer soar uma trombeta. “Tocaram” é a construção corrente em português com o instrumento expresso.
- source_word: ταῖς σάλπιγξιν τῶν σημαιῶν
  choice: as trombetas de sinalização
  rationale: O genitivo provavelmente indica a função das trombetas, usadas para emitir sinais. A tradução mantém esse sentido sem adotar a interpretação menos provável de estandartes físicos.
- source_word: ἐβόησαν εἰς οὐρανόν
  choice: clamaram ao céu
  rationale: “Clamaram” comunica a intensidade do verbo, enquanto “ao céu” preserva a direção do apelo sem explicitar um destinatário que o grego deixa implícito.
theological_decisions:
- issue: Destinatário do clamor dirigido ao céu
  choice: clamaram ao céu
  alternative: clamaram a Deus
  rationale: O texto grego diz literalmente que clamaram “ao céu”. Embora Deus seja o destinatário implícito provável, a tradução não o explicita para preservar a formulação e a tensão do original.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. A colocação pronominal e o vocabulário são naturais, sem perder a concisão nem a força imagética do grego.
