base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/052.yaml
  text: And they rose early in the morning on the twenty-fifth day of the ninth month—that is[b][a], the month Chislev—in the one hundred and forty-eighth year.
translation:
  language: pt
  text: Eles se levantaram bem cedo, na manhã do vigésimo quinto dia do nono mês — isto é, o mês de Quisleu[a] —, no centésimo quadragésimo oitavo ano.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “o mês Chaseleu”; este mês judaico é geralmente chamado Quisleu em português.
    reason: lexical_alternative
  - marker: b
    text: O grego diz apenas “no centésimo quadragésimo oitavo ano”; historicamente, a data se refere à era selêucida.
    reason: cultural_note
lexical_decisions:
- source_word: ὤρθρισαν
  choice: se levantaram bem cedo
  rationale: O verbo indica levantar-se cedo ou estar em atividade ao amanhecer; a formulação preserva a ênfase temporal em português natural.
- source_word: τὸ πρωὶ
  choice: na manhã
  rationale: Mantém o reforço temporal do grego junto de ὤρθρισαν, sem tornar a frase excessivamente pesada.
- source_word: τῇ πέμπτῃ καὶ εἰκάδι
  choice: no vigésimo quinto dia
  rationale: É a forma moderna e clara de expressar o ordinal da data.
- source_word: τοῦ μηνὸς τοῦ ἐνάτου
  choice: do nono mês
  rationale: Reprodução direta e idiomática da expressão genitiva de data.
- source_word: Χασελεὺ
  choice: Quisleu
  rationale: Forma tradicional e reconhecível em português para o nome do mês judaico representado no grego como Chaseleu.
- source_word: τοῦ ὀγδόου καὶ τεσσερακοστοῦ καὶ ἑκατοστοῦ ἔτους
  choice: no centésimo quadragésimo oitavo ano
  rationale: Preserva a fórmula cronológica do grego em português corrente, sem explicitar no texto principal uma era não nomeada no versículo.
theological_decisions:
- issue: Referência da era cronológica
  choice: manter apenas “no centésimo quadragésimo oitavo ano” no texto principal
  alternative: “no centésimo quadragésimo oitavo ano da era selêucida”
  rationale: O grego não identifica expressamente a era neste versículo. A identificação histórica como era selêucida é contextual e, por isso, fica em nota, evitando acrescentá-la ao texto bíblico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A leve redundância temporal de ὤρθρισαν τὸ πρωὶ é preservada por “se levantaram bem cedo, na manhã”, e a informação histórica não explícita permanece em nota.
