base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/028.yaml
  text: And in the following year he assembled sixty thousand chosen men and five thousand cavalry[b][a], so as to make war against them.
translation:
  language: pt
  text: No ano seguinte[a], ele reuniu sessenta mil homens escolhidos e cinco mil cavaleiros[b], a fim de guerrear contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no ano vindouro”. A expressão grega é literalmente “no ano que vem” e se refere ao ano seguinte na sequência narrativa.
    reason: lexical_alternative
  - marker: b
    text: Ou “cinco mil homens a cavalo”. O grego usa “cavalo” como coletivo militar, referindo-se a combatentes montados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἐρχομένῳ ἐνιαυτῷ
  choice: no ano seguinte
  rationale: A expressão significa literalmente “no ano que vinha”; no fluxo narrativo, “no ano seguinte” comunica com naturalidade a relação temporal com os acontecimentos anteriores.
- source_word: συνελόχησεν
  choice: reuniu
  rationale: O verbo descreve a reunião ou mobilização de tropas. “Reuniu” é claro, atual e não acrescenta detalhes ausentes do grego.
- source_word: ἀνδρῶν ἐπιλέκτων
  choice: homens escolhidos
  rationale: Preserva o sentido de homens selecionados para a campanha sem interpretar necessariamente o grupo como uma tropa de elite institucional.
- source_word: ἑξήκοντα χιλιάδας
  choice: sessenta mil
  rationale: Tradução direta do numeral que indica o contingente de homens escolhidos.
- source_word: πεντακισχιλίαν ἵππον
  choice: cinco mil cavaleiros
  rationale: ἵππος, literalmente “cavalo”, é usado aqui como coletivo militar. “Cavaleiros” expressa de modo natural em português o número de combatentes montados.
- source_word: ὥστε ἐκπολεμῆσαι αὐτούς
  choice: a fim de guerrear contra eles
  rationale: ὥστε com o infinitivo indica aqui finalidade ou resultado pretendido, e ἐκπολεμέω tem o sentido de fazer ou conduzir guerra contra alguém.
