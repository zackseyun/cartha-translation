base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/027.yaml
  text: But when he heard all this[a], he was confounded and lost heart, because what had happened to Israel was not what he wanted, and what the king had commanded him had not come about.
translation:
  language: pt
  text: Mas, ao ouvir tudo isso, ele ficou transtornado e desanimado, porque o que havia acontecido a Israel não era o que ele queria, e o que o rei lhe havia ordenado não se realizou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεχύθη
  choice: ficou transtornado
  rationale: O passivo de συγχέω indica que ele foi lançado em confusão ou perturbação interior. «Ficou transtornado» comunica com naturalidade a forte desorientação emocional e mental.
- source_word: ἤθυμει
  choice: desanimado
  rationale: O imperfeito descreve um estado contínuo de abatimento. Em coordenação com «ficou», «desanimado» expressa de modo claro que ele perdeu o ânimo.
- source_word: οὐχ οἷα ἤθελεν
  choice: não era o que ele queria
  rationale: A expressão contrasta o resultado ocorrido com a vontade ou expectativa dele, sem especificar além do que o grego permite.
- source_word: γέγονεν τῷ Ἰσραήλ
  choice: havia acontecido a Israel
  rationale: O perfeito de γίνομαι aponta para acontecimentos já consumados e seu resultado presente; esta formulação é natural e preserva Israel como a parte afetada.
- source_word: οὐχ οἷα ἐνετείλατο αὐτῷ ὁ βασιλεὺς
  choice: o que o rei lhe havia ordenado
  rationale: ἐντέλλομαι comunica uma ordem investida de autoridade, aqui explicitamente real.
- source_word: ἐξέβη
  choice: não se realizou
  rationale: 'Neste contexto, ἐκβαίνω se refere ao desfecho: aquilo que fora ordenado não chegou ao resultado pretendido. «Não se realizou» mantém essa ideia sem sugerir necessariamente incapacidade pessoal.'
