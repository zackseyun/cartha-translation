  text: And they joined battle[a], and the nations were crushed, and they fled into the plain.
translation:
  language: pt
  text: E travaram combate, e as nações[a] foram esmagadas e fugiram para a planície.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os gentios”; neste contexto, “as nações” pode referir-se especificamente aos povos não judeus.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆψαν
  choice: travaram combate
  rationale: Em contexto militar, συνάπτω indica entrar em combate ou travar batalha. A expressão explicita naturalmente em português o sentido marcial implícito no verbo grego.
- source_word: συνετρίβησαν
  choice: foram esmagadas
  rationale: O passivo de συντρίβω transmite a imagem forte de serem quebradas ou esmagadas. “Foram esmagadas” preserva essa vivacidade melhor que o mais neutro “foram derrotadas”.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: É a correspondência mais direta do grego e mantém sua amplitude étnico-política. No contexto, a expressão pode designar especificamente os povos não judeus, possibilidade registrada em nota.
- source_word: τὸ πεδίον
  choice: a planície
  rationale: πεδίον designa normalmente uma área plana e aberta; “a planície” é conciso, natural e adequado ao movimento de retirada militar.
