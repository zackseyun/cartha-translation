base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/041.yaml
  text: Then Judas ordered men to fight those in the citadel until he had cleansed the sanctuary[a].
translation:
  language: pt
  text: Então Judas ordenou a homens que combatessem os que estavam na cidadela, até que ele purificasse o santuário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que estavam na Acra”, a fortaleza de Jerusalém.
    reason: Preserva a identificação histórico-geográfica específica possível para ἄκρα.
lexical_decisions:
- source_word: ἐπέταξεν
  choice: ordenou
  rationale: O aoristo de ἐπιτάσσω expressa uma ordem ou determinação com autoridade; “ordenou” é natural e conserva essa força.
- source_word: ἀνδράσιν
  choice: a alguns homens
  rationale: O dativo plural significa literalmente “a homens”. O contexto é militar, mas o grego não diz explicitamente “soldados”; “alguns homens” torna natural em português a ideia de homens designados para a tarefa.
- source_word: πολεμεῖν
  choice: que combatessem
  rationale: O infinitivo completa o verbo de ordem. A oração com “que” e o subjuntivo é idiomática em português e “combater” comunica claramente o confronto militar.
- source_word: τοὺς ἐν τῇ ἄκρᾳ
  choice: os que estavam na cidadela
  rationale: ἄκρα pode designar uma cidadela ou fortaleza e, neste contexto, provavelmente se refere à fortificação de Jerusalém conhecida como Acra. A tradução descritiva favorece a compreensão, enquanto o nome histórico é preservado em nota.
- source_word: ἕως
  choice: até que
  rationale: Marca o limite temporal ou objetivo até o qual o combate deveria continuar.
- source_word: καθαρίσῃ
  choice: ele purificasse
  rationale: O aoristo do subjuntivo depois de ἕως indica o acontecimento esperado que encerraria a ação. O singular permite conservar Judas como o referente mais natural sem transformar a construção em passiva.
- source_word: τὰ ἅγια
  choice: o santuário
  rationale: Neste contexto do templo, o plural substantivado designa o recinto santo ou santuário, e não meramente objetos sagrados. “O santuário” é claro, corrente e adequado ao contexto.
theological_decisions:
- issue: Referente de ἄκρα
  choice: “a cidadela” no texto principal, com “Acra” na nota
  alternative: “a Acra” ou “a fortaleza”
  rationale: A questão é histórico-geográfica, não doutrinária. O substantivo grego pode ser traduzido descritivamente, mas no contexto de 1 Macabeus provavelmente identifica a fortificação específica de Jerusalém conhecida como Acra; a nota preserva essa identificação possível.
- issue: Sujeito de καθαρίσῃ
  choice: Judas, expresso por “ele”
  alternative: 'Construção impessoal ou passiva: “até que o santuário fosse purificado”'
  rationale: O verbo grego está na terceira pessoa do singular, e Judas é o antecedente singular mais natural. A tradução conserva essa leitura sem ocultar a estrutura ativa do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “ordenou a alguns homens que combatessem” evita o pouco natural “ordenou homens a combater” e não explicita “soldados”, termo ausente do grego.
