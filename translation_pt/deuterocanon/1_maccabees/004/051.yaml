  text: And they placed loaves on the table[a], and they spread out the curtains[b]; and they completed all the works that they had done.
translation:
  language: pt
  text: E puseram pães sobre a mesa, estenderam as cortinas[a] e concluíram todas as obras que haviam feito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “véus”; o termo grego é usado para cortinas ou peças suspensas do santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: puseram
  rationale: O aoristo de ἐπιτίθημι indica pôr ou colocar algo sobre outra coisa. “Puseram” é direto, natural e mantém a relação expressa por ἐπὶ.
- source_word: τὴν τράπεζαν
  choice: a mesa
  rationale: O grego diz simplesmente “a mesa”. O contexto a identifica como mobiliário do santuário, mas não justifica acrescentar uma designação técnica ao texto.
- source_word: ἄρτους
  choice: pães
  rationale: O plural concreto preserva o número de ἄρτους e comunica naturalmente os pães colocados sobre a mesa.
- source_word: ἐξεπέτασαν
  choice: estenderam
  rationale: O verbo expressa abrir, desdobrar ou estender. “Estenderam” preserva a ação sem determinar além do grego a forma exata de instalação.
- source_word: τὰ καταπετάσματα
  choice: as cortinas
  rationale: καταπέτασμα designa uma cortina, véu ou peça suspensa, especialmente no santuário. “Cortinas” é claro em português moderno, enquanto “véus” permanece como alternativa em nota.
- source_word: ἐτέλεσαν
  choice: concluíram
  rationale: O verbo indica levar algo ao fim ou completar; “concluíram” conserva esse sentido de finalização.
- source_word: πάντα τὰ ἔργα
  choice: todas as obras
  rationale: A tradução mantém o plural do grego e o vocabulário amplo de ἔργα, sem reduzir a expressão a uma única tarefa.
- source_word: ἃ ἐποίησαν
  choice: que haviam feito
  rationale: A formulação reproduz diretamente o sentido de ποιέω e preserva a repetição um pouco incomum do original, em vez de interpretá-la como “que haviam empreendido”.
theological_decisions:
- issue: Terminologia dos objetos do santuário
  choice: Usar “mesa”, “pães” e “cortinas” sem qualificadores técnicos acrescentados.
  alternative: “mesa dos pães da Presença” e “véus”
  rationale: Embora o contexto seja cultual, o versículo não traz designações mais extensas. A tradução evita importar terminologia não expressa aqui e registra a alternativa lexical relevante para καταπετάσματα.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe coordenada próxima à do grego. “Pães” preserva o plural concreto; “obras que haviam feito” mantém deliberadamente a repetição sem a suavizar por meio de uma interpretação adicional.
