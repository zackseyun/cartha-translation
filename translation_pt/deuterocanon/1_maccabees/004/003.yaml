lexical_decisions:
- source_word: ἤκουσεν
  choice: soube disso
  rationale: No contexto narrativo, o aoristo de ἀκούω indica que Judas recebeu a notícia mencionada anteriormente. A expressão é natural em português; “disso” explicita apenas a referência contextual implícita, sem definir conteúdo adicional.
- source_word: ἀπῆρεν
  choice: partiu
  rationale: O verbo indica que ele saiu com um propósito. “Partiu” preserva o movimento sem especificar rota, elevação topográfica ou formação militar.
- source_word: οἱ δυνατοὶ
  choice: os homens valentes
  rationale: A expressão designa os fortes ou capazes, aqui em contexto militar. “Homens valentes” conserva a conotação de bravura e soa digna e clara em português, sem acrescentar o possessivo “seus”.
- source_word: πατάξαι
  choice: para atacar
  rationale: O infinitivo exprime o objetivo da partida e uma ação hostil. “Atacar” é natural em português e não antecipa o resultado, ao contrário de “derrotar”; “ferir” seria lexicalmente mais próximo, mas menos idiomático como descrição do ataque a uma força militar.
- source_word: τὴν δύναμιν
  choice: a força
  rationale: Neste contexto, δύναμις se refere a uma força militar. “Força” mantém a amplitude do termo grego sem pressupor a estrutura formal sugerida por “exército”.
- source_word: τοῦ βασιλέως
  choice: do rei
  rationale: O genitivo indica a relação de pertencimento ou subordinação. “A força do rei” é claro e idiomático em português.
- source_word: τὴν ἐν Ἐμμαούμ
  choice: que estava em Emaús
  rationale: A construção identifica a força por sua localização. A tradução evita acrescentar a noção mais específica de que ela estava formalmente aquartelada ou estacionada ali.
