base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/034.yaml
  text: And they engaged one another in battle[a], and about five thousand men from the camp of Lysias fell[b], and they fell before them.
translation:
  language: pt
  text: Eles travaram combate uns contra os outros, e cerca de cinco mil homens[a] do acampamento de Lísias caíram, e caíram diante deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «cinco mil homens»; a construção grega com εἰς pode indicar aproximação ou um total alcançado.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por «em frente deles» ou «defronte deles».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλον ἀλλήλοις
  choice: travaram combate uns contra os outros
  rationale: O verbo συμβάλλω, neste contexto militar, significa entrar ou travar combate; a formulação conserva também a reciprocidade expressa por ἀλλήλοις.
- source_word: ἔπεσον
  choice: caíram
  rationale: Em narrativa de batalha, «caíram» comunica de modo natural a morte em combate sem tornar explícito mais do que o grego; a repetição do verbo foi preservada.
- source_word: ἐκ τῆς παρεμβολῆς Λυσίου
  choice: do acampamento de Lísias
  rationale: παρεμβολή designa aqui o acampamento militar e, por extensão possível, as forças nele reunidas. A tradução mantém a imagem concreta do texto.
- source_word: εἰς πεντακισχιλίους ἄνδρας
  choice: cerca de cinco mil homens
  rationale: Com expressão numérica, εἰς pode indicar aproximação ou extensão até determinado total; «cerca de» oferece uma leitura portuguesa natural sem apresentar o número como necessariamente exato.
- source_word: ἐξ ἐναντίας αὐτῶν
  choice: diante deles
  rationale: A expressão indica uma posição em frente ou defronte do outro grupo. «Diante deles» preserva tanto a relação espacial quanto a possível ideia de cair perante o inimigo.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A repetição de «caíram» foi mantida por corresponder à repetição enfática do grego, e a ambiguidade espacial de ἐξ ἐναντίας não foi eliminada.
