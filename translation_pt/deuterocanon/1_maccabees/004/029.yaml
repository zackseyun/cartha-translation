lexical_decisions:
- source_word: ἦλθον εἰς τὴν Ἰδουμαίαν
  choice: chegaram à Idumeia
  rationale: Expressa com naturalidade o movimento de entrada na região, sem acrescentar uma direção não indicada pelo grego.
- source_word: παρεμβάλον
  choice: acamparam
  rationale: O verbo tem sentido militar de estabelecer acampamento; “acamparam” é claro e adequado ao registro narrativo.
- source_word: ἐν Βηθορούς
  choice: em Bete-Zur[a]
  rationale: O contexto geográfico e militar de 1 Macabeus identifica o local como Bete-Zur, embora a forma grega transmitida, Βηθορούς, seja incomum e possa sugerir outra identificação; a nota conserva essa dificuldade textual.
- source_word: συνήντησεν αὐτοῖς
  choice: foi ao encontro deles
  rationale: Reproduz o movimento deliberado de Judas para confrontar a força adversária e soa mais natural em português do que uma tradução rigidamente literal.
- source_word: ἐν δέκα χιλιάσιν ἀνδρῶν
  choice: com dez mil homens
  rationale: Mantém o valor comitativo de ἐν e traduz diretamente ἀνδρῶν, sem explicitar “soldados”, embora o contexto militar o implique.
