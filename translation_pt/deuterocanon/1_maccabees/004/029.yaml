  text: And they came into Idumea and encamped at Beth-zur[a], and Judas met them with ten thousand men.
translation:
  language: pt
  text: E eles chegaram à Idumeia e acamparam em Bete-Horom[a]; Judas os encontrou com dez mil homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
