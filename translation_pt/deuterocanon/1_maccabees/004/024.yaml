  yaml_path: translation/deuterocanon/1_maccabees/004/024.yaml
  text: 'And when they turned back, they sang hymns and gave praise to heaven: “For he is good; his mercy endures forever.”'
translation:
  language: pt
  text: 'E, ao voltarem, entoavam hinos e davam louvores ao céu[a]: “Pois ele é bom; sua misericórdia dura para sempre.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “ao céu”, uma maneira reverente de dirigir o louvor a Deus.
    reason: cultural_note
  - marker: b
    text: 'Ou, mais literalmente: “Pois é bom; sua misericórdia é para sempre.” O texto principal expressa o provável sentido pessoal da fórmula litúrgica.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: quando voltaram
  rationale: O particípio aoristo tem valor temporal e indica o retorno após a ação anterior; «quando voltaram» é natural e não especifica um destino ausente do grego.
- source_word: ὕμνουν
  choice: entoavam hinos
  rationale: Preserva o caráter musical e litúrgico de ὑμνέω em português corrente e digno.
- source_word: ᾐνοῦν
  choice: louvavam
  rationale: Traduz diretamente αἰνέω e mantém distinta a segunda ação de louvor, sem confundi-la com o ato de entoar hinos.
- source_word: εἰς οὐρανόν
  choice: o céu
  rationale: Com «louvavam», a construção portuguesa pede objeto direto; «o céu» conserva a circunlocução reverencial do grego, que dirige o louvor a Deus sem nomeá-lo explicitamente.
- source_word: Ὅτι καλὸν
  choice: Porque ele é bom
  rationale: A fórmula litúrgica e o possessivo subsequente favorecem a referência pessoal a Deus, embora a forma grega isolada também admita leitura impessoal.
- source_word: εἰς τὸν αἰῶνα
  choice: dura para sempre
  rationale: Expressa de modo idiomático a permanência indicada pela fórmula grega.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: sua misericórdia
  rationale: «Misericórdia» é a equivalência direta e amplamente compreensível de ἔλεος, sem acrescentar uma nuance pactual que não está explicitada.
theological_decisions:
- issue: Sujeito implícito na fórmula de louvor
  choice: “Porque ele é bom; sua misericórdia dura para sempre.”
  alternative: “Porque é bom; sua misericórdia é para sempre.”
  rationale: O contexto de louvor e «sua misericórdia» tornam mais provável a referência pessoal a Deus. A nota preserva a ambiguidade gramatical real de καλόν.
- issue: «Céu» como circunlocução reverencial
  choice: Manter «o céu» no texto
  alternative: Explicitar «Deus»
  rationale: O grego diz literalmente «ao céu»; explicitar Deus no corpo do texto eliminaria a forma reverencial escolhida pelo autor.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Entoavam hinos» preserva o tom litúrgico sem soar arcaico; os imperfeitos coordenados refletem as ações contínuas de cantar e louvar.
