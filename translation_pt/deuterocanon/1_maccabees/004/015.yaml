  yaml_path: translation/deuterocanon/1_maccabees/004/015.yaml
  text: But all the rear guard fell by the sword[a], and they pursued them as far as Gazara and as far as the plains of Judea and Azotus and Jamnia[c][b], and about three thousand of them fell.
translation:
  language: pt
  text: Mas todos os que estavam na retaguarda caíram à espada, e eles os perseguiram até Gazara[a], até as planícies da Judeia, até Azoto e Jâmnia[b]. Cerca de três mil deles caíram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara é o nome grego do lugar geralmente identificado com Gezer.
    reason: cross_reference
  - marker: b
    text: Azoto é a forma grega de Asdode; Jâmnia é geralmente identificada com Jabne ou Yavne.
    reason: cross_reference
  - marker: c
    text: 'Ou: “Cerca de três mil homens deles caíram”. A expressão grega apresenta idiomaticamente a contagem dos mortos e pode indicar uma cifra aproximada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔσχατοι πάντες
  choice: Mas todos os que estavam na retaguarda
  rationale: ἔσχατοι significa literalmente os últimos ou os que estavam mais atrás. A formulação preserva o sentido espacial e militar sem pressupor necessariamente uma unidade formal de retaguarda.
- source_word: ἔπεσαν ἐν ῥομφαίᾳ
  choice: caíram à espada
  rationale: Mantém a expressão idiomática de morte em combate e a imagem marcial do grego.
- source_word: ἐδίωξαν αὐτούς
  choice: eles os perseguiram
  rationale: Tradução direta e natural do verbo de perseguição em contexto militar; os pronomes preservam a referência contextual do original.
- source_word: ἕως Γαζήρων
  choice: até Gazara
  rationale: Reproduz a forma grega do topônimo, deixando sua identificação comum com Gezer para a nota.
- source_word: τῶν πεδίων τῆς Ἰουδαίας
  choice: as planícies da Judeia
  rationale: πεδία designa áreas planas ou abertas; “planícies” comunica com clareza o sentido geográfico, e “Judeia” segue o texto grego fornecido.
- source_word: Ἀζώτου καὶ Ἰαννείας
  choice: de Azoto e de Jâmnia
  rationale: Emprega formas portuguesas reconhecíveis dos topônimos gregos e as coordena com “planícies”, conforme a sintaxe da passagem.
- source_word: ἔπεσαν ἐξ αὐτῶν εἰς ἄνδρας τρισχιλίους
  choice: Cerca de três mil deles caíram
  rationale: A construção εἰς ἄνδρας seguida do numeral expressa idiomaticamente uma contagem aproximada de homens; a redação é natural e conserva a repetição de “caíram” presente no grego.
