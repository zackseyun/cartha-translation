  language: pt
  text: enquanto as tropas ainda estavam dispersas, afastadas do acampamento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal: “até que as tropas ainda estivessem dispersas, afastadas do acampamento”. A expressão grega ἕως ἔτι é condensada; aqui é entendida idiomaticamente como uma oração temporal com o sentido de “enquanto ... ainda”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι
  choice: enquanto ... ainda
  rationale: A expressão grega é condensada e, neste contexto, introduz o período durante o qual a ação devia ocorrer. “Enquanto ... ainda” comunica com naturalidade tanto o valor temporal como a continuidade indicada por ἔτι.
- source_word: αἱ δυνάμεις
  choice: as tropas
  rationale: No contexto militar, δυνάμεις designa as forças combatentes. “Tropas” é corrente em português e conserva a referência coletiva e plural sem especificar indevidamente a organização militar.
- source_word: ἐσκορπισμέναι
  choice: dispersas
  rationale: O particípio indica que as tropas não estavam concentradas num só lugar. “Dispersas” reproduz diretamente esse sentido no contexto militar.
- source_word: ἀπὸ τῆς παρεμβολῆς
  choice: longe do acampamento
  rationale: παρεμβολή significa “acampamento” neste contexto, e ἀπό expressa afastamento. “Longe do acampamento” torna clara essa relação espacial em português natural, sem sugerir que as tropas estivessem necessariamente dentro dele antes de se dispersarem.
