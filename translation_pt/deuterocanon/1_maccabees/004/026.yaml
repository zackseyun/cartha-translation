lexical_decisions:
- source_word: ἀλλοφύλων
  choice: estrangeiros
  rationale: Reproduz o sentido básico de pessoas pertencentes a outro povo, sem introduzir uma identificação étnica mais específica do que o grego permite.
- source_word: διεσώθησαν
  choice: conseguiram escapar
  rationale: Expressa aqui a ideia contextual de sair com vida e escapar da derrota.
- source_word: παραγενηθέντες
  choice: foram até Lísias
  rationale: O particípio indica que chegaram ao lugar onde Lísias estava; a formulação portuguesa integra naturalmente essa chegada ao movimento até ele.
- source_word: ἀπήγγειλαν
  choice: lhe contaram
  rationale: Verbo comum e natural para comunicar um relato completo do ocorrido.
- source_word: πάντα τὰ συμβεβηκότα
  choice: tudo o que havia acontecido
  rationale: Mantém o alcance total de πάντα e o valor anterior do particípio perfeito.
