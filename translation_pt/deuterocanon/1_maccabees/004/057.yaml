base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/057.yaml
  text: And they adorned the front of the temple with golden crowns and small shields[a], and they renewed the gates and the side chambers, and they fitted them with doors.
translation:
  language: pt
  text: E adornaram a frente do templo com coroas de ouro[a] e pequenos escudos; renovaram os portões e as câmaras laterais e instalaram-lhes portas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grinaldas de ouro” ou “guirlandas de ouro”; o grego στεφάνοις pode designar ornamentos em forma de grinalda, além de coroas.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκόσμησαν
  choice: adornaram
  rationale: Expressa o ato de embelezar com ornamentos e mantém um registro digno e natural.
- source_word: τὸ κατὰ πρόσωπον τοῦ ναοῦ
  choice: a frente do templo
  rationale: Traduz de modo claro e idiomático a parte situada diante ou na face do templo, sem impor o termo arquitetônico mais técnico 'fachada'.
- source_word: στεφάνοις χρυσοῖς
  choice: coroas de ouro
  rationale: É uma tradução lexical direta, mas στέφανος também pode indicar grinaldas ou ornamentos em forma de coroa; a ambiguidade é registrada em nota.
- source_word: ἀσπιδίσκαις
  choice: pequenos escudos
  rationale: O diminutivo designa escudos pequenos, provavelmente ornamentais ou votivos; a expressão é clara no português atual.
- source_word: ἐνεκαίνισαν
  choice: renovaram
  rationale: Como os objetos são os portões e as câmaras laterais, o contexto favorece renovação ou restauração física, sem excluir as ressonâncias de inauguração ou dedicação do verbo.
- source_word: πύλας
  choice: portões
  rationale: Preserva a distinção entre os grandes acessos e as portas mencionadas na oração seguinte.
- source_word: παστοφόρια
  choice: câmaras laterais
  rationale: Indica compartimentos ligados ao complexo do santuário sem especificar uma função incerta, como depósito ou alojamento sacerdotal.
- source_word: ἐθύρωσαν
  choice: os equiparam com portas
  rationale: Transmite o sentido de prover ou instalar portas, em formulação compreensível e fiel.
- source_word: αὐτά
  choice: os
  rationale: O pronome retoma coletivamente os portões e as câmaras; o masculino plural é a concordância portuguesa normal para antecedentes de gêneros diferentes.
