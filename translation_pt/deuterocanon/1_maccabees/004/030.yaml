base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/030.yaml
  text: And when he saw that the camp was strong[a], he prayed and said, “Blessed are you, O Savior of Israel, who crushed the assault of the mighty one by the hand of your slave David[b], and gave the camp of the foreigners into the hands of Jonathan son of Saul and of the one who carried his armor.”
translation:
  language: pt
  text: 'Ao ver que o acampamento era forte, ele orou, dizendo: “Bendito és tu, Salvador de Israel, que esmagaste o ataque do poderoso pela mão de teu escravo Davi,[a] e entregaste o acampamento dos estrangeiros nas mãos de Jônatas, filho de Saul, e daquele que carregava as armas de Jônatas.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teu servo Davi”. O grego δοῦλος pode significar “escravo” ou “servo”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: A oração alude à vitória de Davi sobre Golias e ao combate de Jônatas acompanhado por seu escudeiro. Aqui, porém, o grego diz literalmente “o poderoso”, “os estrangeiros” e “aquele que carregava as armas dele”, sem nomeá-los de modo mais específico.
    reason: cross_reference
lexical_decisions:
- source_word: παρεμβολή
  choice: acampamento
  rationale: No contexto militar, designa tanto o acampamento como, por extensão, a força ali reunida; “acampamento” preserva a imagem concreta e funciona naturalmente em português.
- source_word: ἰσχυράν
  choice: forte
  rationale: Reproduz de modo direto a força militar atribuída ao acampamento, sem ampliar o sentido para “formidável”.
- source_word: σωτήρ
  choice: Salvador
  rationale: Mantém o peso teológico do título dirigido a Deus e corresponde diretamente ao substantivo grego.
- source_word: συντρίψας
  choice: esmagaste
  rationale: Expressa a derrota decisiva e violenta evocada pelo verbo grego.
- source_word: ὅρμημα
  choice: ataque
  rationale: Comunica com clareza a investida hostil; é atual e natural, sem perder o sentido militar.
- source_word: τοῦ δυνατοῦ
  choice: do poderoso
  rationale: Preserva a referência pessoal singular e genérica do grego sem inserir explicitamente o nome de Golias.
- source_word: ἐν χειρὶ
  choice: pela mão de
  rationale: Conserva o conhecido idioma bíblico de agência e a textura alusiva da oração.
- source_word: δούλου
  choice: escravo
  rationale: Mantém a força de pertencimento e subordinação de δοῦλος; a alternativa tradicional “servo” é registrada em nota por ser natural neste contexto religioso.
- source_word: ἀλλοφύλων
  choice: estrangeiros
  rationale: Traduz a designação genérica do texto grego sem substituir por “filisteus”, embora estes sejam o referente na narrativa evocada.
- source_word: αἰρόντος τὰ σκεύη αὐτοῦ
  choice: daquele que carregava suas armas
  rationale: Mantém a construção participial e verte σκεύη conforme seu sentido militar contextual, evitando transformar a expressão no título lexicalizado “escudeiro”.
theological_decisions:
- issue: Tradução de δοῦλος em referência a Davi
  choice: Davi, teu escravo
  alternative: Davi, teu servo
  rationale: “Escravo” preserva mais explicitamente a relação de pertencimento e sujeição expressa por δοῦλος, enquanto a nota reconhece a formulação tradicional e contextualmente possível “servo”.
- issue: Explicitação da alusão a Golias e aos filisteus
  choice: manter “o poderoso” e “os estrangeiros” no texto principal
  alternative: nomear “Golias” e “os filisteus”
  rationale: A alusão às narrativas de Davi e Jônatas é clara, mas o grego emprega designações genéricas; preservá-las evita importar identificações não expressas no versículo.
- issue: Identidade do portador das armas
  choice: manter a referência descritiva e anônima
  alternative: explicitar “o escudeiro de Jônatas”
  rationale: O grego apenas descreve aquele que carregava o equipamento de Jônatas; a tradução conserva essa forma e deixa a identificação narrativa para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência bíblica moderada. Empregam-se “Bendito és tu” e “pela mão de” para conservar a forma solene da oração, sem recorrer a vocabulário excessivamente arcaico.
