translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção próxima do grego. Mantém-se a coordenação repetida com «e», característica da narrativa, e evita-se explicitar «homens», pois o grego diz literalmente «os que estavam com Judas».
