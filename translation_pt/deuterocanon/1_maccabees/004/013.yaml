  text: And they went out from the camp for battle[a], and those with Judas sounded the trumpets.
translation:
  language: pt
  text: E eles saíram do acampamento para a batalha, e os que estavam com Judas tocaram as trombetas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθαν
  choice: saíram
  rationale: Traduz diretamente o aoristo de ἐξέρχομαι como movimento para fora, sem acrescentar a ideia específica de marchar.
- source_word: παρεμβολῆς
  choice: acampamento
  rationale: No contexto militar, παρεμβολή designa o acampamento; a forma portuguesa é clara e corrente.
- source_word: εἰς πόλεμον
  choice: para a batalha
  rationale: Expressa o movimento com finalidade de entrar em combate; «batalha» corresponde melhor ao confronto imediato do que o sentido mais amplo de «guerra».
- source_word: ἐσάλπισαν
  choice: tocaram as trombetas
  rationale: O verbo significa fazer soar trombeta; «tocar as trombetas» é uma expressão portuguesa natural e conserva o sinal militar.
- source_word: οἱ παρὰ Ἰούδου
  choice: os que estavam com Judas
  rationale: Reproduz de modo explícito e neutro o grupo associado a Judas, sem acrescentar uma relação formal de comando não expressa no grego.
- source_word: Ἰούδου
  choice: Judas
  rationale: É a forma tradicional portuguesa do nome grego neste livro, referente a Judas Macabeu.
