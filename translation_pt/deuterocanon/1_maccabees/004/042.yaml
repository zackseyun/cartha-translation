  text: And he chose blameless priests[a], devoted to the law.
translation:
  language: pt
  text: E ele escolheu sacerdotes irrepreensíveis[a], dedicados à Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sacerdotes sem defeito, zelosos pela Lei». O grego pode ressaltar tanto a ausência de defeito como o compromisso fervoroso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν
  choice: escolheu
  rationale: O aoristo de ἐπιλέγω indica uma escolha deliberada; «escolheu» é natural e fiel ao ato intencional.
- source_word: ἱερεῖς
  choice: sacerdotes
  rationale: Equivalente corrente de ἱερεύς no contexto do culto judaico e do templo.
- source_word: ἀμώμους
  choice: irrepreensíveis
  rationale: O adjetivo pode indicar ausência de culpa ou de defeito. «Irrepreensíveis» exprime adequação e integridade em português atual, enquanto a nota preserva a possível conotação ritual.
- source_word: θελητὰς
  choice: dedicados à
  rationale: θελητής designa quem deseja ou quer algo; com νόμου, comunica disposição positiva e compromisso. «Dedicados à» é idiomático e preserva esse empenho.
- source_word: νόμου
  choice: Lei
  rationale: Embora sem artigo em grego, neste contexto νόμος se refere à Lei judaica conhecida, isto é, à Torá. A inicial maiúscula torna essa referência específica clara sem acrescentar conteúdo.
theological_decisions:
- issue: Se νόμου deve ser entendido em sentido abstrato («lei») ou específico («a Lei»)
  choice: à Lei
  alternative: à lei
  rationale: Em 1 Macabeus, νόμος normalmente designa a Lei ancestral de Israel, não a lei como princípio abstrato. A forma definida e a inicial maiúscula comunicam essa especificidade.
- issue: Se ἀμώμους enfatiza integridade moral ou ausência de defeito ritual
  choice: irrepreensíveis
  alternative: sem defeito
  rationale: O termo admite ambas as nuances no contexto sacerdotal. O texto principal usa uma formulação natural que expressa idoneidade, e a nota mantém explícita a leitura ritual possível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Lei» identifica a Torá neste contexto; a nota conserva a ambiguidade lexical dos qualificativos gregos.
