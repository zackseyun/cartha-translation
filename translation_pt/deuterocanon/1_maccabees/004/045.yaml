base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/045.yaml
  text: And it seemed to them a good plan to tear it down[a], lest it become a reproach to them because the nations had defiled it; so they tore down the altar.
translation:
  language: pt
  text: Então, pareceu-lhes uma boa ideia derrubá-lo, para que não se tornasse motivo de desonra para eles, pois as nações[a] o haviam contaminado. E derrubaram o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os gentios”. Neste contexto judaico, o grego τὰ ἔθνη, literalmente “as nações”, designa os povos não judeus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν αὐτοῖς βουλὴ ἀγαθή
  choice: consideraram uma boa decisão
  rationale: Reproduz de modo natural o sentido deliberativo da expressão idiomática grega, literalmente uma “boa decisão” que lhes ocorreu, sem conservar uma construção artificial em português.
- source_word: καθελεῖν / καθεῖλον
  choice: derrubá-lo / derrubaram
  rationale: “Derrubar” expressa com clareza o desmonte físico do altar e mantém a correspondência lexical entre o propósito e sua execução.
- source_word: μή ποτε γένηται αὐτοῖς εἰς ὄνειδος
  choice: para que não se tornasse motivo de desonra para eles
  rationale: “Desonra” preserva a dimensão pública de vergonha ou opróbrio de ὄνειδος, em linguagem atual e dignificada.
- source_word: ἐμίαναν
  choice: haviam contaminado
  rationale: No contexto cultual, “contaminar” comunica que o altar foi tornado impuro, sem substituir essa noção pela ideia parcialmente distinta de profanação.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: É a correspondência mais direta e menos interpretativamente carregada; no contexto judaico, refere-se aos povos não judeus, possibilidade esclarecida em nota.
- source_word: τὸ θυσιαστήριον
  choice: o altar
  rationale: Equivalente português estabelecido para o lugar destinado aos sacrifícios.
theological_decisions:
- issue: Linguagem de impureza cultual aplicada ao altar
  choice: contaminado
  alternative: profanado
  rationale: “Contaminado” preserva a noção de impureza ritual presente em μιαίνω. “Profanado” seria possível no contexto, mas destacaria a violação da santidade mais do que a contaminação expressa pelo verbo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém a repetição do verbo grego e explicita na nota a ambiguidade contextual de τὰ ἔθνη.
