  text: And there was very great rejoicing among the people[a], and the reproach of the nations was turned away.
translation:
  language: pt
  text: E houve imensa alegria entre o povo, e a desonra das nações[a] foi afastada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos gentios».'
    reason: Registra a alternativa tradicional para ἐθνῶν; «nações» preserva melhor a forma do grego e evita uma carga teológica desnecessária.
lexical_decisions:
- source_word: ἐγενήθη
  choice: houve
  rationale: Expressa de modo idiomático em português a fórmula narrativa existencial, sem acrescentar um agente ou enfatizar indevidamente o acontecimento.
- source_word: εὐφροσύνη μεγάλη ... σφόδρα
  choice: enorme júbilo
  rationale: Reúne a ideia de alegria comunitária e festiva de εὐφροσύνη com a forte intensificação produzida por μεγάλη e σφόδρα, em linguagem natural e digna.
- source_word: ἐν τῷ λαῷ
  choice: entre o povo
  rationale: Traduz idiomaticamente ἐν diante de um substantivo coletivo e indica que o júbilo se difundiu no meio do povo.
- source_word: ἀπεστράφη
  choice: foi afastado
  rationale: Mantém a voz passiva e a imagem de algo desviado ou removido, sem introduzir um agente que o grego não explicita.
- source_word: ὀνειδὸς
  choice: opróbrio
  rationale: Preserva o sentido de desonra pública, vergonha ou afronta, bem como o tom histórico e solene do contexto.
- source_word: ἐθνῶν
  choice: das nações
  rationale: É a tradução mais direta e menos carregada teologicamente; no contexto, designa os povos não israelitas ao redor, sem explicitar isso no texto.
theological_decisions:
- issue: Referentes de «o povo» e «as nações»
  choice: Conservar o contraste textual entre «o povo» e «as nações».
  alternative: Explicitar «o povo de Israel» e «os povos não israelitas».
  rationale: O contexto identifica o povo com Israel/Judá e as nações com povos estrangeiros, mas a formulação grega não traz essas explicitações; mantê-la evita inserir interpretação no corpo do versículo.
- issue: Relação do genitivo em ὀνειδὸς ἐθνῶν
  choice: «o opróbrio das nações»
  alternative: «o opróbrio causado pelas nações» ou «a vergonha diante das nações»
  rationale: O genitivo pode apontar para a afronta proveniente das nações ou para a desonra associada a elas. A formulação escolhida conserva essa tensão em vez de determinar silenciosamente a relação.
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira. «Enorme júbilo» reproduz de forma concisa a intensificação grega, enquanto «opróbrio» conserva o caráter público da desonra. O marcador foi colocado junto a «nações», termo ao qual a nota se refere.
