  yaml_path: translation/deuterocanon/1_maccabees/004/007.yaml
  text: And they saw a strong camp of the nations[a], armored, and cavalry surrounding it, and these were trained for war.
translation:
  language: pt
  text: E eles viram um poderoso acampamento das nações[a], bem armado, e cavaleiros que o cercavam; eles eram treinados para a guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um poderoso acampamento dos gentios [...] e cavaleiros que o cercavam”.'
    reason: Registra “gentios” como alternativa contextual para ἐθνῶν e “cavaleiros” como expressão do coletivo militar ἵππον.
lexical_decisions:
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: O termo designa um acampamento militar; “acampamento” é claro, natural e preserva o sentido do contexto.
- source_word: ἐθνῶν
  choice: das nações
  rationale: Mantém de perto a expressão grega e, no contexto, refere-se aos povos não judeus, sem tornar explícita além do necessário a interpretação “gentios”.
- source_word: ἰσχυρὰν
  choice: forte
  rationale: Reproduz de modo conciso a ideia de um acampamento militar poderoso ou formidável.
- source_word: τεθωρακισμένην
  choice: bem armado
  rationale: O particípio indica que o acampamento ou suas tropas estavam providos de armadura. “Bem armado” exprime naturalmente em português essa preparação militar, sem sugerir veículos blindados modernos.
- source_word: ἵππον
  choice: a cavalaria
  rationale: Embora o singular grego signifique literalmente “cavalo”, aqui funciona coletivamente em contexto militar e designa a tropa montada.
- source_word: κυκλοῦσαν
  choice: ao redor dele
  rationale: Expressa de maneira natural a posição da cavalaria que cercava o acampamento.
- source_word: διδακτοὶ πολέμου
  choice: treinados para a guerra
  rationale: Preserva a ênfase em instrução e preparo militar, em linguagem corrente e digna.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A coordenação do grego foi preservada, enquanto “bem armado” evita a impressão anacrônica que “blindado” poderia causar. O ponto e vírgula esclarece que “esses homens” se refere à cavalaria.
