  text: And they took whole stones according to the law[b][a], and built a new altar as before.
translation:
  language: pt
  text: E pegaram pedras inteiras[a], conforme a Lei, e construíram um altar novo como o anterior[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras não lavradas”. O grego diz literalmente “pedras inteiras” ou “completas”; a expressão seguinte, “conforme a Lei”, provavelmente alude às exigências da Lei para as pedras de um altar.
    reason: lexical_alternative
  - marker: b
    text: Ou “como antes” ou “segundo o modelo anterior”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: pegaram
  rationale: O aoristo de λαμβάνω indica aqui o ato concreto de tomar ou obter o material; “pegaram” é direto e natural em português.
- source_word: λίθους ὁλοκλήρους
  choice: pedras inteiras
  rationale: ὁλόκληρος significa inteiro, completo ou intacto. “Pedras inteiras” preserva o sentido expresso no grego sem incorporar ao adjetivo a inferência de que eram pedras não lavradas.
- source_word: κατὰ τὸν νόμον
  choice: conforme a Lei
  rationale: A expressão indica conformidade com a prescrição legal. A maiúscula em “Lei” torna clara a referência à Lei de Moisés no contexto, sem acrescentar conteúdo não expresso.
- source_word: ᾠκοδόμησαν
  choice: construíram
  rationale: O verbo significa construir ou edificar. “Construíram” evita especificar “reconstruíram”, ideia possível pelo contexto, mas não explícita no verbo.
- source_word: θυσιαστήριον καινὸν
  choice: um altar novo
  rationale: Tradução direta e natural de θυσιαστήριον καινόν, preservando a ênfase na novidade do altar.
- source_word: κατὰ τὸ πρότερον
  choice: como o anterior
  rationale: A expressão comunica correspondência com aquilo que havia antes; “como o anterior” conserva de modo claro a provável referência ao altar precedente.
theological_decisions:
- issue: Se a descrição das pedras deve explicitar a exigência da Torá de não serem lavradas
  choice: Manter “pedras inteiras” no texto principal e deixar “conforme a Lei” indicar o contexto legal.
  alternative: Traduzir “pedras não lavradas” no texto principal.
  rationale: O grego diz literalmente “pedras inteiras/completas” e acrescenta separadamente “conforme a Lei”. A alternativa é uma inferência contextual plausível, mas não deve substituir silenciosamente a formulação da fonte.
- issue: Se κατὰ τὸ πρότερον descreve genericamente a maneira anterior ou compara o altar novo ao precedente
  choice: Traduzir “como o anterior”.
  alternative: Traduzir “como antes” ou “segundo o modelo anterior”.
  rationale: “Como o anterior” preserva a provável referência concreta ao altar precedente, enquanto a nota registra a amplitude possível da expressão grega.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação simples acompanha a narrativa grega. Os marcadores foram posicionados junto às expressões que explicam: [a] após “pedras inteiras” e [b] após “como o anterior”.'
