lexical_decisions:
- source_word: ἅμα ἡμέρᾳ
  choice: Ao raiar do dia
  rationale: A expressão indica o início do dia; esta formulação é natural e digna em português.
- source_word: ὤφθη
  choice: apareceu
  rationale: Preserva o sentido de Judas tornar-se visível ou apresentar-se no campo de batalha.
- source_word: πεδίῳ
  choice: planície
  rationale: Corresponde ao terreno plano indicado pelo substantivo grego e mantém o cenário geográfico.
- source_word: καλύμματα
  choice: armaduras
  rationale: Embora o termo signifique literalmente 'coberturas', no contexto militar designa equipamento de proteção; 'armaduras' comunica esse sentido sem especificar uma peça não indicada pelo grego.
- source_word: μάχαιραν
  choice: espada
  rationale: Mantém o singular do texto grego, que pode ter valor coletivo, sem normalizá-lo silenciosamente para o plural.
- source_word: καθὼς ἠβούλοντο
  choice: como desejavam
  rationale: 'Preserva a comparação aberta do original: o equipamento não correspondia ao que eles desejavam, sem determinar se a deficiência era de quantidade ou de qualidade.'
