lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: voltaram
  rationale: No contexto militar, o verbo indica mudança de direção e retorno; “voltaram” expressa isso de modo natural em português.
- source_word: ἡ δύναμις
  choice: suas tropas
  rationale: Aqui δύναμις designa a força armada que acompanhava Judas. “Suas tropas” é claro e corrente, sem pressupor um exército formalmente organizado.
- source_word: ἀπὸ τοῦ διώκειν
  choice: pararam de perseguir
  rationale: A construção com ἀπό e infinitivo articulado indica afastamento ou cessação da atividade; “pararam de perseguir” comunica explicitamente esse valor.
- source_word: ὀπίσθεν αὐτῶν
  choice: persegui-los
  rationale: Em contexto de perseguição, a expressão indica ir atrás dos fugitivos. Em português, o objeto pronominal de “perseguir” transmite naturalmente esse sentido, sem a redundância de “persegui-los atrás deles”.
