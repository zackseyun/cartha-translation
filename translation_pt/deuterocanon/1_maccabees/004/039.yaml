lexical_decisions:
- source_word: διέρρηξαν
  choice: rasgaram
  rationale: Expressa diretamente o ato de rasgar como gesto de luto, em linguagem atual e digna.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: suas vestes
  rationale: “Vestes” preserva o registro solene e o sentido amplo de roupas, sem especificar indevidamente o tipo de peça.
- source_word: ἐκόψαντο κοπετὸν μέγαν
  choice: fizeram grande lamentação
  rationale: Mantém a construção enfática com verbo e substantivo cognatos e comunica o caráter intenso e público do luto sem acrescentar um gesto corporal não explicitado no grego.
- source_word: σποδὸν
  choice: cinzas
  rationale: O singular coletivo grego é expresso naturalmente pelo plural “cinzas” na fórmula tradicional de luto.
- source_word: ἐπέθεντο
  choice: puseram
  rationale: Equivalente corrente e direto para o ato de colocar as cinzas.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτῶν
  choice: sobre a cabeça
  rationale: Conserva o singular distributivo do grego; em português, com sujeito plural, entende-se naturalmente a cabeça de cada pessoa.
