  text: And they tore their garments[a], and made great lamentation, and put ashes on their heads.
translation:
  language: pt
  text: E rasgaram suas vestes[a], fizeram grande lamentação e puseram cinzas sobre a cabeça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rasgar as vestes, lamentar e pôr cinzas sobre a cabeça eram sinais convencionais de dor e luto na literatura bíblica.
