lexical_decisions:
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: No contexto militar, designa o acampamento de Judas; é uma tradução direta e natural.
- source_word: ἐζήτει
  choice: foi procurá-los
  rationale: O imperfeito indica a ação de procurar; a construção portuguesa mantém a sequência narrativa de modo natural, sem acrescentar que os encontrou.
- source_word: ἐν τοῖς ὄρεσιν
  choice: nas montanhas
  rationale: Reproduz de modo claro o plural e a localização expressos no grego.
- source_word: Φεύγουσιν
  choice: estão fugindo
  rationale: Mantém o presente vívido do discurso direto e a perspectiva equivocada de Górgias.
