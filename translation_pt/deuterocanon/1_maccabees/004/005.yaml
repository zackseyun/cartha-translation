  text: And Gorgias came to the camp of Judas by night, and found no one; and he was looking for them in the mountains, because he said, “These men are fleeing from us.”
translation:
  language: pt
  text: 'Górgias chegou de noite ao acampamento de Judas e não encontrou ninguém; procurava por eles nas montanhas, pois dizia: “Estes homens estão fugindo de nós.”'
