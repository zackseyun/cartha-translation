base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/061.yaml
  text: And they stationed a force there to guard it[a], and they fortified it to guard Bethsura[b], so that the people might have a stronghold facing Idumea.
translation:
  language: pt
  text: E destacaram ali uma força para guardá-lo[a]; também o fortificaram para proteger Betsura[b], a fim de que o povo tivesse uma fortaleza diante da Idumeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deram ordem para que uma força o guardasse”. O verbo grego pode significar “ordenar” ou “designar”, mas aqui, no contexto militar, indica provavelmente que tropas foram destacadas para um posto de guarda.'
    reason: lexical_alternative
  - marker: b
    text: Betsura era uma localidade fortificada ao sul de Jerusalém, situada estrategicamente na direção da Idumeia.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέταξαν
  choice: destacaram
  rationale: Com δύναμιν e o infinitivo τηρεῖν, o verbo indica a designação de uma força para um posto de guarda. “Destacaram” comunica naturalmente essa ação militar, sem apagar de todo o sentido básico de ordenar ou designar.
- source_word: δύναμιν
  choice: uma força
  rationale: Neste contexto, o substantivo designa um contingente militar; “uma força” preserva a generalidade do termo sem especificar seu tamanho.
- source_word: τηρεῖν
  choice: guardar / proteger
  rationale: O verbo tem sentido de vigiar ou manter em segurança. A variação portuguesa evita repetição pesada, mantendo o mesmo campo semântico militar nas duas ocorrências.
- source_word: ὠχύρωσαν
  choice: fortificaram
  rationale: O verbo descreve o ato de tornar algo defensivamente forte; “fortificaram” conserva com precisão o caráter militar.
- source_word: Βαιθσουρά
  choice: Betsura
  rationale: O topônimo é transliterado em forma clara e natural para leitores de português, próxima da forma grega.
- source_word: τοῦ ἔχειν
  choice: a fim de que ... tivesse
  rationale: O infinitivo articular introduz finalidade; essa construção portuguesa expressa claramente o propósito.
- source_word: ὀχύρωμα
  choice: uma fortaleza
  rationale: O substantivo denota uma obra ou posição defensiva fortificada. “Fortaleza” é corrente e adequado ao contexto estratégico.
- source_word: κατὰ πρόσωπον τῆς Ἰδουμαίας
  choice: diante da Idumeia
  rationale: A expressão espacial significa literalmente estar perante ou defronte da Idumeia. “Diante da” conserva essa imagem e não define além do texto se a orientação é estritamente geográfica ou estratégica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário militar corrente. Os pronomes masculinos em “guardá-lo” e “o fortificaram” preservam a referência pouco explícita do grego, sem substituir silenciosamente seu objeto por Betsura. A formulação “para proteger Betsura” segue a sintaxe do texto grego fornecido, embora ela seja incomum.
