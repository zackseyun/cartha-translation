  text: Derruba-os com a espada dos que te amam, e que todos os que conhecem o teu nome te louvem com hinos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατάβαλε
  choice: Derruba-os
  rationale: Imperativo forte e direto, que preserva a imagem de abater ou fazer cair os inimigos.
- source_word: ῥομφαίᾳ ἀγαπώντων σε
  choice: com a espada dos que te amam
  rationale: Mantém a relação genitiva e a instrumentalidade do grego sem substituir a imagem concreta da espada.
- source_word: οἱ εἰδότες τὸ ὄνομά σου
  choice: os que conhecem o teu nome
  rationale: Reproduz a expressão sem reduzir 'nome' a mera informação nem expandi-lo interpretativamente.
- source_word: ἐν ὕμνοις
  choice: com hinos
  rationale: Formulação natural em português que conserva a referência explícita a cânticos de louvor.
theological_decisions:
- issue: Agência na derrota dos inimigos
  choice: com a espada dos que te amam
  alternative: pela espada dos que te amam
  rationale: A preposição grega ἐν pode indicar meio ou instrumento. 'Com' preserva essa relação e acompanha a formulação adjudicada sem decidir além do necessário como se a espada fosse uma causa autônoma.
translation_notes:
  register: Português moderno, claro e digno, com tratamento na segunda pessoa singular para conservar a oração direta a Deus. A ordem e o paralelismo das duas petições foram preservados.
