base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/054.yaml
  text: At the time[a], on the very day when the nations had defiled it[b], on that very day it was rededicated with songs and lyres and harps and cymbals.
translation:
  language: pt
  text: Na ocasião, no próprio dia em que as nações o haviam profanado, naquele mesmo dia ele foi dedicado novamente, com cânticos, liras, harpas[a] e címbalos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego designa um instrumento de cordas antigo cuja identificação exata é incerta; também poderia ser traduzido de modo mais geral como “instrumentos de cordas”.
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸν καιρὸν κατὰ τὴν ἡμέραν
  choice: No tempo determinado, no mesmo dia
  rationale: A combinação das duas expressões temporais aponta para a correspondência precisa da ocasião e da data. A formulação portuguesa evita o literalismo duro e conserva a ênfase.
- source_word: ἐβεβήλωσαν
  choice: haviam profanado
  rationale: Em contexto sagrado, o verbo indica tornar profano ou ritualmente impuro. “Profanado” comunica de modo preciso a violação do que era consagrado, e o mais-que-perfeito marca a anterioridade em relação à nova dedicação.
- source_word: αὐτό
  choice: o
  rationale: Mantém o pronome masculino do grego sem explicitar como “santuário” ou “altar” um referente que o próprio versículo deixa ao contexto.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Reproduz o sentido básico do grego e evita opções mais interpretativas ou potencialmente pejorativas, embora no contexto designe povos não judeus.
- source_word: ἐν ἐκείνῃ
  choice: naquele mesmo dia
  rationale: A repetição enfática ressalta que a restauração aconteceu precisamente na data da profanação.
- source_word: ἐνεκαινίσθη
  choice: ele foi novamente dedicado
  rationale: Expressa a renovação cultual após a profanação, preservando a voz passiva e evitando depender do neologismo menos universal “rededicado”.
- source_word: ἐν ᾠδαῖς
  choice: com cânticos
  rationale: O uso instrumental de ἐν é natural em português com “com”; “cânticos” se ajusta ao contexto celebrativo sem restringir necessariamente o termo a hinos formais.
- source_word: κιθάραις
  choice: liras
  rationale: Designa um instrumento antigo do tipo lira e o distingue do instrumento seguinte.
- source_word: κινύραις
  choice: harpas
  rationale: É uma equivalência tradicional e inteligível, embora a identificação exata do instrumento antigo seja incerta; essa incerteza é registrada em nota.
- source_word: κυμβάλοις
  choice: címbalos
  rationale: Equivalente direto e corrente para o instrumento de percussão mencionado.
theological_decisions:
- issue: Verbo cultual para a restauração do que havia sido profanado
  choice: ele foi novamente dedicado
  alternative: ele foi renovado
  rationale: A expressão escolhida torna explícito o sentido cultual de ἐνεκαινίσθη sem acrescentar um referente nominal ausente no versículo. “Renovado” seria possível, mas poderia sugerir apenas reparo físico.
- issue: Referente do pronome αὐτό
  choice: manter o pronome “o”
  alternative: explicitar “o altar” ou “o santuário”
  rationale: O contexto pode orientar o referente, mas o grego deste versículo não o nomeia. Manter o pronome preserva essa dependência contextual e evita resolver silenciosamente a questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem retórica e a repetição temporal do grego foram preservadas de modo natural. O único marcador de nota, [a], aparece no texto junto a “harpas”.
