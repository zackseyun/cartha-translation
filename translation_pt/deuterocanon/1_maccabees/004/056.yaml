base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/004/056.yaml
  text: And they celebrated the dedication of the altar for eight days, and they offered whole burnt offerings with gladness, and they sacrificed a sacrifice of deliverance and praise.
translation:
  language: pt
  text: E celebraram durante oito dias a dedicação do altar; ofereceram holocaustos com alegria e apresentaram um sacrifício de salvação[a] e louvor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sacrifício de paz” ou “um sacrifício de livramento”. O grego diz literalmente: “um sacrifício de salvação e louvor”.'
    reason: Registra alternativas possíveis para σωτηρίου sem substituir no texto a formulação lexical explícita do grego.
lexical_decisions:
- source_word: ἐποίησαν
  choice: celebraram
  rationale: Com ἐγκαινισμός como objeto, o verbo exprime a realização festiva da dedicação; “celebraram” é natural e fiel ao contexto.
- source_word: ἐγκαινισμὸν τοῦ θυσιαστηρίου
  choice: a dedicação do altar
  rationale: Reproduz diretamente a inauguração ou rededicação cultual do altar.
- source_word: ἡμέρας ὀκτώ
  choice: durante oito dias
  rationale: Explicita de modo idiomático o acusativo de duração.
- source_word: προσήνεγκαν ὁλοκαυτώματα
  choice: ofereceram holocaustos
  rationale: No contexto sacrificial, προσφέρω significa oferecer; ὁλοκαύτωμα designa a oferta inteiramente queimada. “Holocausto” é o termo bíblico corrente em português.
- source_word: μετʼ εὐφροσύνης
  choice: com alegria
  rationale: Expressa claramente a jubilosa celebração que acompanhava as ofertas.
- source_word: ἔθυσαν θυσίαν σωτηρίου
  choice: apresentaram um sacrifício de comunhão
  rationale: Embora σωτήριον possa lexicalmente evocar salvação ou livramento, nesta fórmula cultual corresponde ao sacrifício de bem-estar ou comunhão; a nota conserva a amplitude literal do grego.
- source_word: αἰνέσεως
  choice: e louvor
  rationale: Mantém o genitivo coordenado que caracteriza o sacrifício também como oferta de louvor.
theological_decisions:
- issue: Sentido cultual de θυσίαν σωτηρίου
  choice: um sacrifício de comunhão
  alternative: um sacrifício de livramento/salvação; uma oferta de paz
  rationale: O contexto é uma enumeração de sacrifícios e a expressão grega tem uso cultual para a oferta de bem-estar ou comunhão. A tradução principal evita interpretar o rito apenas como referência abstrata ao livramento, enquanto a nota registra a forma e a ambiguidade lexical do grego.
- issue: Visibilidade da linguagem sacrificial
  choice: holocaustos ... um sacrifício de comunhão e louvor
  alternative: ofertas queimadas ... uma oferta de ação de graças
  rationale: Conserva o caráter cultual específico do versículo sem o diluir em linguagem religiosa genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. Emprega “holocaustos” em seu sentido sacrificial bíblico tradicional e usa pontuação que evita uma sequência pesada de coordenações.
