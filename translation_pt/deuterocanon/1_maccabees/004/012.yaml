  text: And the foreigners lifted up their eyes and saw them encamped opposite them,[a]
translation:
  language: pt
  text: Os estrangeiros levantaram os olhos e os viram postados em frente deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «formados em frente deles» ou «acampados em frente deles». O particípio grego pode indicar que estavam situados ou dispostos em determinada posição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλόφυλοι
  choice: estrangeiros
  rationale: O termo designa pessoas de outro povo. Neste contexto, refere-se de modo geral às forças inimigas não judias, sem indicar especificamente os filisteus.
- source_word: ἦραν ... τοὺς ὀφθαλμοὺς αὐτῶν
  choice: levantaram os olhos
  rationale: Preserva a imagem do idioma grego e continua natural e compreensível em português moderno.
- source_word: ἶδαν
  choice: viram
  rationale: Reproduz de maneira direta o aoristo narrativo.
- source_word: ἐχομένους
  choice: posicionados
  rationale: No contexto militar, o particípio descreve o grupo ocupando uma posição. A escolha evita especificar indevidamente se estavam acampados ou em formação de batalha.
- source_word: ἐξ ἐναντίας
  choice: diante deles
  rationale: Expressa a posição face a face indicada pela locução, em formulação natural em português.
