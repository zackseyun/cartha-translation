  yaml_path: translation/deuterocanon/1_maccabees/004/053.yaml
  text: And they offered sacrifice according to the law on the new altar of burnt offering that they had made[a].
translation:
  language: pt
  text: E ofereceram um sacrifício, de acordo com a Lei, sobre o novo altar dos holocaustos que haviam feito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre o novo altar para holocaustos que haviam feito”.'
    reason: Alternativa sintática legítima para o genitivo τῶν ὁλοκαυτωμάτων, que pode indicar a finalidade do altar.
lexical_decisions:
- source_word: ἀνήνεγκαν
  choice: ofereceram
  rationale: No contexto sacrificial, ἀναφέρω significa oferecer um sacrifício; “ofereceram” é natural e preserva o sentido cultual.
- source_word: θυσίαν
  choice: um sacrifício
  rationale: θυσία designa o sacrifício ou a oferta sacrificial. “Um sacrifício” mantém a terminologia cultual explícita.
- source_word: κατὰ τὸν νόμον
  choice: de acordo com a Lei
  rationale: A expressão indica conformidade com as prescrições legais de Israel. A inicial maiúscula deixa claro que se trata da Lei, sem acrescentar uma identificação ausente no grego.
- source_word: θυσιαστήριον τῶν ὁλοκαυτωμάτων
  choice: altar dos holocaustos
  rationale: A construção genitiva identifica o altar destinado aos holocaustos. “Holocausto” é o termo cultual português tradicional e ainda inteligível para a oferta inteiramente queimada.
- source_word: τὸ καινόν
  choice: novo
  rationale: καινόν contrasta este altar com o anterior profanado; “novo” reproduz o sentido sem explicitação indevida.
- source_word: ὃ ἐποίησαν
  choice: que haviam feito
  rationale: ἐποίησαν se refere à confecção ou construção do altar. O mais-que-perfeito composto marca naturalmente que isso ocorreu antes do sacrifício, enquanto “feito” evita especificar além do grego.
theological_decisions:
- issue: Terminologia cultual do culto no templo
  choice: 'Manter a linguagem sacrificial explícita: “ofereceram um sacrifício” e “altar dos holocaustos”.'
  alternative: Generalizar como “apresentaram uma oferta” ou simplesmente “sobre o altar”.
  rationale: O versículo trata da restauração do sacrifício no templo conforme a Lei; termos genéricos enfraqueceriam sua ênfase cultual e legal.
- issue: Referência à Lei
  choice: Traduzir νόμος por “Lei”, com inicial maiúscula.
  alternative: Usar “lei”, em sentido genérico.
  rationale: No contexto, a referência é às prescrições religiosas de Israel, embora o texto não diga explicitamente “Lei de Moisés”; a tradução preserva essa referência sem ampliá-la.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conserva-se “holocaustos” como termo técnico bíblico; a nota oferece uma formulação funcional mais transparente.
