  text: junto com os que foram queimados[a], totalizando oito mil homens. E ele partiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego deste versículo tem sentido fragmentário e preserva apenas a frase: «junto com os que foram queimados, totalizando oito mil homens. E ele partiu». A tradução acompanha de perto as palavras que sobreviveram, sem reconstruir o contexto omitido.'
    reason: textual_variant
lexical_decisions:
- source_word: σὺν
  choice: junto com
  rationale: A preposição acrescenta os queimados a um grupo ou número mencionado anteriormente; «junto com» expressa essa força aditiva com naturalidade.
- source_word: τοῖς ἐμπυρισθεῖσιν
  choice: os que foram queimados
  rationale: O particípio aoristo passivo de ἐμπυρίζω se refere a pessoas submetidas ao fogo. A tradução preserva o sentido direto sem acrescentar «vivos», detalhe não explícito no fragmento.
- source_word: εἰς
  choice: totalizando
  rationale: Neste contexto, εἰς introduz o total resultante. «Totalizando» torna clara em português a relação numérica, apesar do caráter fragmentário da frase.
- source_word: ἄνδρας
  choice: homens
  rationale: O grego emprega especificamente ἄνδρας; por isso, mantém-se o termo marcado por gênero, sem generalizá-lo como «pessoas».
- source_word: ὀκτακισχιλίους
  choice: oito mil
  rationale: Tradução direta do numeral cardinal.
- source_word: ἀπῆρεν
  choice: ele partiu
  rationale: O aoristo indica a partida do sujeito. «Partiu» é claro, conciso e adequado ao registro narrativo.
