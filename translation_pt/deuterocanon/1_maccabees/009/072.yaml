base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/072.yaml
  text: And he returned to him the captives whom he had formerly taken captive from the land of Judah[a], and he turned back and went away to his own land[b], and he no longer came again into their borders.
translation:
  language: pt
  text: E devolveu-lhe os cativos que antes havia levado da terra de Judá[a]. Depois, voltou e partiu para a sua própria terra, e nunca mais entrou no território deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “o cativeiro”; aqui, a expressão designa coletivamente as pessoas que haviam sido levadas cativas.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega traduzida como “nunca mais entrou” significa que ele não voltou a entrar, ou não continuou entrando, no território deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: devolveu
  rationale: Expressa de modo natural o ato de restituir a alguém aquilo que havia sido tomado.
- source_word: τὴν αἰχμαλωσίαν
  choice: os cativos
  rationale: Embora o substantivo possa significar literalmente “cativeiro”, aqui designa coletivamente as pessoas levadas cativas.
- source_word: ᾐχμαλώτευσεν
  choice: havia levado
  rationale: Com “os cativos” já expresso, “havia levado” comunica a captura e remoção das pessoas sem uma repetição pesada em português.
- source_word: τὸ πρότερον
  choice: antes
  rationale: Marca com clareza e naturalidade que a captura ocorreu anteriormente.
- source_word: ἐκ γῆς Ἰούδα
  choice: da terra de Judá
  rationale: Preserva a referência geográfica explícita de γῆ.
- source_word: ἀποστρέψας
  choice: voltou
  rationale: Representa o movimento de retorno indicado pelo particípio e mantém clara a sequência narrativa.
- source_word: ἀπῆλθεν εἰς τὴν γῆν αὐτοῦ
  choice: partiu para a sua própria terra
  rationale: “Partiu” conserva a ideia de afastamento, e “sua própria terra” explicita naturalmente a força possessiva.
- source_word: οὐ προσέθετο ἔτι ἐλθεῖν
  choice: nunca mais entrou
  rationale: A construção idiomática com προστίθημι e infinitivo nega a repetição ou continuação da ação; “nunca mais” é a formulação portuguesa mais natural neste contexto.
- source_word: τὰ ὅρια αὐτῶν
  choice: no território deles
  rationale: No contexto, ὅρια pode indicar não apenas linhas fronteiriças, mas a região delimitada por elas; “território” evita sugerir que ele apenas se aproximava das fronteiras.
