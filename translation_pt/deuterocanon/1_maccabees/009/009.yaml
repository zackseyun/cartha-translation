base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/009.yaml
  text: But they turned away from him[a], saying, “We certainly cannot do it. Instead, let us save our own lives for now. Let us return with our brothers and fight against them[b], but we are few.”
translation:
  language: pt
  text: 'Mas eles o fizeram voltar atrás[a], dizendo: “De modo nenhum conseguiremos. Em vez disso, salvemos por enquanto nossas próprias vidas[b]. Voltemos com nossos irmãos e lutemos contra eles; nós, porém, somos poucos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recusaram a proposta dele”. A expressão grega pode indicar que procuraram fazê-lo desistir de seu plano, e não apenas um movimento físico de retorno.'
    reason: lexical_alternative
  - marker: b
    text: “Vidas” traduz o plural grego “almas”, expressão comum para a preservação da vida diante do perigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν αὐτόν
  choice: se afastaram dele
  rationale: Preserva o sentido relacional de voltar-se para longe de Judas e, no contexto, recusar seu conselho, sem limitar a expressão a um movimento físico nem explicitar demais a rejeição.
- source_word: Οὐ μὴ δυνώμεθα
  choice: De modo nenhum conseguiremos
  rationale: A forte negação οὐ μή é expressa de modo enfático e natural; o verbo fica absoluto, como no grego, com a ação impossível inferida do contexto.
- source_word: σώσωμεν τὰς ἑαυτῶν ψυχὰς
  choice: salvemos ... a nossa própria vida
  rationale: Em contexto de batalha, ψυχαί designa a vida ameaçada, não a alma em sentido teológico. O singular distributivo em português é natural para a vida de cada integrante do grupo.
- source_word: τὸ νῦν
  choice: por enquanto
  rationale: Indica uma medida imediata e temporária diante da crise.
- source_word: ἐπιστρέψωμεν
  choice: voltemos
  rationale: Expressa o retorno para junto dos demais irmãos, sem acrescentar um destino não explicitado.
- source_word: μετὰ τῶν ἀδελφῶν ἡμῶν
  choice: com nossos irmãos
  rationale: Mantém o valor normal de μετά com o genitivo e conserva o substantivo masculino explícito ἀδελφῶν.
- source_word: πολεμήσωμεν πρὸς αὐτούς
  choice: lutemos contra eles
  rationale: Comunica de forma direta o conflito armado dirigido contra o inimigo.
- source_word: ἡμεῖς δὲ ὀλίγοι
  choice: nós, porém, somos poucos
  rationale: Conserva tanto o pronome enfático ἡμεῖς quanto a nuance adversativa de δέ e a concisão da frase nominal grega.
theological_decisions:
- issue: Sentido de ψυχὰς no contexto militar
  choice: vida
  alternative: almas
  rationale: A ameaça imediata é a morte em batalha; 'vida' evita introduzir uma afirmação sobre a alma imaterial que o contexto não exige.
- issue: Referente de ἀδελφῶν
  choice: irmãos
  alternative: companheiros ou compatriotas
  rationale: O grego emprega o masculino plural 'irmãos', provavelmente para companheiros judeus; a tradução conserva a forma do texto sem ampliar seu referente.
- issue: Força de ἀπέστρεψαν αὐτόν
  choice: se afastaram dele
  alternative: rejeitaram o conselho dele
  rationale: A escolha mantém aberta a tensão entre afastamento físico e recusa relacional, enquanto a alternativa resolveria implicitamente a expressão como rejeição do conselho.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A fala conserva a urgência militar e a estrutura exortativa do grego. 'De modo nenhum' comunica a negação enfática sem soar excessivamente técnica; 'nós, porém, somos poucos' preserva o contraste e a ênfase do original.
