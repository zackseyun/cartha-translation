  yaml_path: translation/deuterocanon/1_maccabees/009/077.yaml
  text: He encamped three thousand cavalry and a large force[a], and went to Azotus as though passing through; at the same time he was leading them into the plain[c][b], because he had a multitude of cavalry and trusted in it.
translation:
  language: pt
  text: Ele acampou com três mil cavaleiros e um grande contingente, e foi a Azoto como se estivesse de passagem[a]; ao mesmo tempo, conduzia-os para a planície, porque dispunha de numerosa cavalaria e confiava nela.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se estivesse atravessando a região”. A expressão grega pode indicar que sua passagem era apenas aparente, como parte de uma manobra.'
    reason: lexical_alternative
  - marker: b
    text: O pronome grego é singular e feminino. Pode retomar a grande força militar ou, pelo sentido, a cavalaria na qual ele depositava sua confiança.
    reason: lexical_alternative
  - marker: c
    text: O texto grego fornecido termina no meio da palavra seguinte (καὶ κατε-), indicando que a frase prossegue além deste recorte. Aqui se traduz somente a parte completa preservada na unidade.
    reason: textual_variant
lexical_decisions:
- source_word: παρενέβαλεν
  choice: acampou com
  rationale: Preserva o sentido militar concreto de estabelecer acampamento, usando uma construção natural em português diante das tropas enumeradas.
- source_word: τρισχιλίαν ἵππον
  choice: três mil cavaleiros
  rationale: ἵππος é empregado coletivamente para a tropa montada; “cavaleiros” comunica com clareza tanto a contagem quanto o caráter militar.
- source_word: δύναμιν πολλήν
  choice: um grande contingente
  rationale: Neste contexto, δύναμις designa uma força militar, não poder abstrato; “contingente” evita sugerir necessariamente um exército completo.
- source_word: ἐπορεύθη εἰς Ἄζωτον
  choice: foi a Azoto
  rationale: Verte de modo simples o verbo comum de deslocamento, sem especificar indevidamente a maneira da marcha.
- source_word: ὡς διοδεύων
  choice: como se estivesse apenas de passagem
  rationale: A construção com ὡς apresenta o deslocamento como aparência ou pretexto; “apenas” torna perceptível essa possível dissimulação sem transformá-la em certeza explícita.
- source_word: ἅμα προσῆγεν εἰς τὸ πεδίον
  choice: ao mesmo tempo, conduzia-os para a planície
  rationale: Mantém a simultaneidade de ἅμα e o valor causativo de προσάγω. O objeto está implícito em grego e é recuperado pelo pronome “os”, referente aos homens mencionados.
- source_word: διὰ τὸ ἔχειν αὐτὸν πλῆθος ἵππου
  choice: porque dispunha de numerosa cavalaria
  rationale: Expressa a relação causal e o sentido coletivo militar de πλῆθος ἵππου em português corrente e digno.
- source_word: πεποιθέναι ἐπʼ αὐτήν
  choice: confiava nela
  rationale: O imperfeito em português comunica a confiança já estabelecida expressa pelo infinitivo perfeito grego. “Nela” conserva o pronome singular feminino sem fixar silenciosamente seu antecedente.
