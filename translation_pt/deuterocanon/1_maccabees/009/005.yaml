  text: Judas estava acampado em Alasa, e com ele havia três mil homens escolhidos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεβεβληκὼς
  choice: estava acampado
  rationale: O particípio perfeito de παρεμβάλλω, neste contexto militar, expressa o estado resultante de ter montado acampamento. “Estava acampado” preserva esse valor de estado e soa natural em português.
- source_word: ἐν Ἀλασά
  choice: em Alasa
  rationale: A preposição ἐν indica localização. “Em Alasa” é natural em português para o local do acampamento, e o topônimo é transliterado.
- source_word: τρισχίλιοι
  choice: três mil
  rationale: Correspondência direta do numeral cardinal grego.
- source_word: ἄνδρες
  choice: homens
  rationale: O grego diz explicitamente “homens”. Embora o contexto seja militar, “soldados” acrescentaria uma especificação não expressa pelo substantivo.
- source_word: ἐκλεκτοὶ
  choice: escolhidos
  rationale: ἐκλεκτοί designa homens selecionados ou de escolha. “Escolhidos” mantém de modo claro e direto a ideia de seleção especial.
- source_word: μετʼ αὐτοῦ
  choice: com ele havia
  rationale: A expressão indica que os homens estavam com Judas. A formulação “com ele havia” comunica essa presença de maneira natural sem acrescentar a ideia mais específica de acompanhá-lo em movimento.
