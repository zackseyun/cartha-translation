translation:
  language: pt
  text: E vingaram o sangue do irmão deles[a] e voltaram para a região montanhosa do Jordão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “vingaram a vingança do sangue do irmão deles”, expressão enfática que se refere à vingança de sangue.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para o monte do Jordão”. O termo grego pode indicar tanto um monte quanto uma região de terreno montanhoso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδίκησαν τὴν ἐκδίκησιν αἵματος
  choice: vingaram o sangue
  rationale: A construção grega com verbo e objeto cognato é enfática e expressa vingança de sangue. A formulação escolhida preserva o sentido e soa natural em português, sem reproduzir uma redundância pouco idiomática.
- source_word: ἀδελφοῦ αὐτῶν
  choice: de seu irmão
  rationale: O substantivo está no singular e significa diretamente “irmão”; não há necessidade de ampliá-lo para “parente”.
- source_word: ἀπέστρεψαν
  choice: voltaram
  rationale: No contexto narrativo, indica o retorno a uma região anterior; “voltaram” é claro, atual e fiel ao movimento expresso.
- source_word: εἰς τὸ ὄρος τοῦ Ἰορδάνου
  choice: para a região montanhosa do Jordão
  rationale: ὄρος pode designar tanto um monte específico quanto terreno montanhoso. A expressão “região montanhosa” comunica naturalmente a provável referência geográfica sem apagar a alternativa literal.
