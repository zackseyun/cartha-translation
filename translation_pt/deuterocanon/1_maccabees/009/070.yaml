base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/070.yaml
  text: And Jonathan learned of it[b][a], and sent ambassadors to him to make peace with him and to return the captives to them.
translation:
  language: pt
  text: E Jônatas soube disso e enviou-lhe emissários[a] para fazer paz com ele e lhes devolver os cativos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “embaixadores”. O termo grego designa representantes diplomáticos oficiais.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o cativeiro”. Neste contexto, o termo designa coletivamente as pessoas levadas cativas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: soube disso
  rationale: O aoristo de γινώσκω indica aqui que Jônatas tomou conhecimento do acontecimento anterior; “soube disso” expressa esse sentido de modo natural.
- source_word: ἀπέστειλεν
  choice: enviou-lhe
  rationale: Traduz diretamente ἀποστέλλω e conserva πρὸς αὐτόν mediante o pronome dativo, com redação portuguesa fluente.
- source_word: πρέσβεις
  choice: emissários
  rationale: No contexto, designa representantes oficiais enviados para uma negociação diplomática. “Emissários” é claro e amplamente compreensível, sem sugerir necessariamente o cargo diplomático moderno de embaixador.
- source_word: τοῦ συνθέσθαι πρὸς αὐτὸν εἰρήνην
  choice: para fazer a paz com ele
  rationale: O infinitivo articular expressa finalidade, e a locução com συντίθεμαι e εἰρήνη denota chegar a um acordo de paz. A formulação não especifica indevidamente a forma jurídica do acordo.
- source_word: ἀποδοῦναι
  choice: conseguir que lhes devolvesse
  rationale: ἀποδίδω significa devolver ou restituir. A construção portuguesa explicita a finalidade prática da missão diplomática e, pelo contexto, apresenta o interlocutor como aquele de quem se buscava a devolução; uma nota preserva a forma mais literal e sua concisão sintática.
- source_word: τὴν αἰχμαλωσίαν
  choice: os cativos
  rationale: Embora o substantivo possa significar literalmente “o cativeiro”, aqui funciona coletivamente para as pessoas levadas cativas.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Mantém o pronome plural do grego sem identificar além do texto o grupo a quem os cativos seriam devolvidos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas compreensíveis tanto no Brasil quanto em âmbito internacional. Emprega “Jônatas”, grafia bíblica corrente em português, e evita linguagem diplomática excessivamente técnica.
