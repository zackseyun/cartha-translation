  yaml_path: translation/deuterocanon/1_maccabees/009/064.yaml
  text: And he came and encamped against Bethbasi[a], and fought against it for many days, and made siege engines.
translation:
  language: pt
  text: Ele veio, acampou diante de Betbasi e combateu contra ela durante muitos dias; também construiu máquinas de cerco.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “construiu máquinas”; o termo grego se refere, neste contexto, a dispositivos militares usados num cerco.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: veio
  rationale: O particípio aoristo introduz a ação seguinte; a coordenação verbal é natural na narrativa portuguesa e preserva a sequência.
- source_word: παρεβάλεν ἐπὶ
  choice: acampou diante de
  rationale: Em contexto militar, a expressão indica estabelecer acampamento contra um lugar. “Diante de” comunica a posição hostil sem antecipar indevidamente a ideia mais específica de cerco.
- source_word: Βεθβασί
  choice: Betbasi
  rationale: O topônimo foi transliterado de forma natural para o português, sem tradução.
- source_word: ἐπολέμησεν αὐτήν
  choice: combateu contra ela
  rationale: Preserva o sentido de guerrear ou lutar contra a localidade; o pronome feminino retoma naturalmente Betbasi em português.
- source_word: ἡμέρας πολλὰς
  choice: durante muitos dias
  rationale: Expressa em português corrente o acusativo grego de duração.
- source_word: ἐποίησεν μηχανάς
  choice: construiu máquinas de cerco
  rationale: No contexto de um ataque prolongado a uma localidade, μηχαναί designa dispositivos militares empregados em cercos. A formulação esclarece a função sem especificar um tipo não indicado pelo grego.
