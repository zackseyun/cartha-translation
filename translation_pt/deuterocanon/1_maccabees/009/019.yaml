  text: And Jonathan and Simon carried Judas their brother and buried him in the tomb of his fathers at Modein[a][b].
translation:
  language: pt
  text: Jônatas e Simão levaram Judas, seu irmão, e o sepultaram no túmulo de seus antepassados, em Modeim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦραν
  choice: levaram
  rationale: No contexto do sepultamento, αἴρω indica tomar e transportar o corpo. “Levaram” é natural em português e evita a rigidez de “levantaram”.
- source_word: Ἰωναθὰν καὶ Σίμων
  choice: Jônatas e Simão
  rationale: Adotam-se as formas portuguesas tradicionais e amplamente reconhecíveis desses nomes pessoais.
- source_word: Ἰούδα τὸν ἀδελφὸν αὐτοῦ
  choice: Judas, seu irmão
  rationale: Embora αὐτοῦ esteja no singular, Judas é irmão dos dois sujeitos coordenados. Em português, “seu irmão” pode relacionar-se naturalmente ao conjunto “Jônatas e Simão” sem alterar o número expresso no grego.
- source_word: ἔθαψαν
  choice: sepultaram
  rationale: Equivalente corrente e digno de θάπτω em contexto funerário; não especifica além do verbo grego o modo de deposição.
- source_word: ἐν τῷ τάφῳ
  choice: no túmulo
  rationale: τάφος designa túmulo ou lugar de sepultamento; “túmulo” se ajusta bem ao contexto de uma sepultura familiar.
- source_word: τῶν πατέρων αὐτοῦ
  choice: de seus antepassados
  rationale: O plural πατέρων tem sentido ancestral. “Antepassados” comunica isso com clareza no português atual, sem sugerir apenas pais imediatos.
- source_word: ἐν Μωδεείμ
  choice: em Modeim
  rationale: O topônimo é transliterado da forma grega Μωδεείμ. A preposição “em” preserva de modo natural a expressão locativa.
