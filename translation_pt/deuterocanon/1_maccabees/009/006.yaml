base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/006.yaml
  text: And they saw the multitude of the forces[a], that they were many, and they were greatly afraid; and many fled from the camp, and none of them were left except eight hundred men.
translation:
  language: pt
  text: Eles viram a multidão das tropas, que eram numerosas, e ficaram com muito medo; muitos saíram do acampamento[a], e deles restaram apenas oitocentos homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saíram às escondidas do acampamento” ou “fugiram do acampamento”. O verbo grego pode sugerir tanto uma saída discreta como uma fuga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πλῆθος τῶν δυνάμεων
  choice: a multidão das tropas
  rationale: πλῆθος indica grande número ou multidão, e δυνάμεις, neste contexto militar, designa tropas ou forças. “Tropas” é claro e natural em português, mantendo o plural grego.
- source_word: πολλοί εἰσιν
  choice: eram numerosas
  rationale: O adjetivo retoma as tropas e explica a causa do medo. A formulação mantém o sentido quantitativo sem a construção pouco natural “eram muitas”.
- source_word: ἐφοβήθησαν σφόδρα
  choice: ficaram com muito medo
  rationale: O aoristo expressa a reação de medo, intensificada por σφόδρα. A expressão é corrente, clara e conserva a forte ênfase.
- source_word: ἐξερρύησαν
  choice: se esgueiraram para fora
  rationale: O verbo pode retratar pessoas que vão saindo ou escapando do grupo, talvez furtivamente, sem exigir que se defina se houve fuga aberta ou deserção formal. A nota registra a alternativa contextual “fugiram”.
- source_word: παρεμβολῆς
  choice: acampamento
  rationale: Em contexto militar, παρεμβολή designa o acampamento das tropas; “acampamento” é o equivalente moderno mais claro.
- source_word: οὐ κατελείφθησαν ἐξ αὐτῶν ἀλλʼ ἢ ὀκτακόσιοι ἄνδρες
  choice: deles restaram apenas oitocentos homens
  rationale: A construção indica quantos permaneceram depois que muitos saíram. Esta forma é concisa e natural e preserva a limitação enfática a oitocentos homens.
