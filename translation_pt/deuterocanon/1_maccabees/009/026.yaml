translation_notes:
  register: 'Português moderno, digno e acessível, com formas correntes no Brasil. A alternância do plural (“eles procuravam”, “levavam”, “zombavam”) para o singular (“ele se vingava”) reproduz a mudança de número do texto grego: o singular provavelmente se refere a Báquides, enquanto o plural retoma os agentes que capturavam os amigos de Judas.'
