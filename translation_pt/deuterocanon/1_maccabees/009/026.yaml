base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/026.yaml
  text: And they kept seeking out and searching for the friends of Judas[a], and they were bringing them to Bacchides[b], and he took vengeance on them and mocked them.
translation:
  language: pt
  text: Eles procuravam insistentemente e rastreavam os amigos de Judas[a]; levavam-nos a Báquides, e ele se vingava deles[b], e eles zombavam deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os partidários de Judas” ou “os aliados de Judas”. O grego diz literalmente “os amigos de Judas”, expressão que, neste contexto, também pode designar seus adeptos políticos ou militares.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego também pode significar “os punia” ou “fazia justiça contra eles”. A tradução adotada ressalta o sentido hostil e retributivo do contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεζήτουν καὶ ἐξηραύνων
  choice: procuravam insistentemente e rastreavam
  rationale: Os dois imperfeitos descrevem uma ação contínua ou repetida. A combinação preserva a duplicação enfática do grego sem soar artificial em português.
- source_word: τοὺς φίλους Ἰούδου
  choice: os amigos de Judas
  rationale: Mantém o sentido direto de φίλοι, que no contexto também pode abranger partidários ou aliados; essa extensão é indicada em nota.
- source_word: ἦγον αὐτοὺς πρὸς Βακχίδην
  choice: levavam-nos a Báquides
  rationale: O imperfeito sugere que isso ocorria repetidamente; πρός com acusativo indica condução até uma pessoa.
- source_word: ἐξεδίκα αὐτούς
  choice: ele se vingava deles
  rationale: O verbo pode indicar fazer justiça, punir ou vingar-se. O contexto hostil favorece a noção retributiva, mantendo-se a ambiguidade lexical em nota.
- source_word: ἐνέπαιζον αὐτοῖς
  choice: eles zombavam deles
  rationale: O verbo exprime escárnio ou o ato de fazer alguém objeto de diversão cruel. A forma plural do grego foi preservada, em contraste com o verbo singular anterior.
