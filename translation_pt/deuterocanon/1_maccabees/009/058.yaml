  text: And all the lawless men took counsel, saying, “Look, Jonathan and those with him are living in peace, confident; so now let us bring Bacchides, and he will seize them all in a single night.”
translation:
  language: pt
  text: 'E todos os sem lei deliberaram, dizendo: “Vejam! Jônatas e os que estão com ele vivem tranquilos e confiantes.[a] Portanto, vamos trazer Báquides, e ele os capturará a todos numa só noite.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vivem em tranquilidade, cheios de confiança”. O grego combina a ideia de residir sem perturbação com a de estar confiante ou confiar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: deliberaram entre si
  rationale: Expressa a consulta intencional indicada pelo verbo no médio, sem acrescentar necessariamente a ideia de conspiração secreta.
- source_word: οἱ ἄνομοι
  choice: os que desprezavam a Lei
  rationale: No contexto de 1 Macabeus, ἄνομοι designa opositores da Lei, e não meramente pessoas que infringem leis em geral; a formulação mantém essa força moral e político-religiosa.
- source_word: Ἰδοὺ
  choice: Vejam!
  rationale: Interjeição corrente que chama a atenção dos interlocutores e preserva a vivacidade do grego.
- source_word: οἱ παρ᾿ αὐτοῦ
  choice: os que estão com ele
  rationale: Mantém a expressão abrangente, sem definir os associados de Jônatas especificamente como soldados ou companheiros.
- source_word: ἐν ἡσυχίᾳ κατοικοῦσιν
  choice: vivem tranquilos
  rationale: Comunica residência quieta e sem perturbação em português natural.
- source_word: πεποιθότες
  choice: confiantes
  rationale: 'Preserva o sentido do particípio perfeito: encontram-se seguros ou cheios de confiança, sem introduzir a interpretação mais específica de que estejam desprevenidos.'
- source_word: ἄξομεν
  choice: mandemos buscar
  rationale: No contexto, os adversários propõem fazer Báquides vir até eles. A forma exortativa em português reproduz o valor volitivo do futuro no discurso deliberativo.
- source_word: συλλήψεται
  choice: capturará
  rationale: Adequado ao contexto de ação hostil e militar, sem a conotação estritamente jurídica de 'prenderá'.
- source_word: ἐν νυκτὶ μιᾷ
  choice: numa só noite
  rationale: Preserva a ênfase na rapidez e concentração da ação.
theological_decisions:
- issue: Sentido de οἱ ἄνομοι no contexto da resistência macabeia
  choice: os que desprezavam a Lei
  alternative: os transgressores / os sem lei
  rationale: A escolha deixa clara a referência contextual à Lei judaica, mas evita identificar o grupo com uma categoria denominacional posterior.
translation_notes:
  register: Português moderno, digno e acessível, com fluência brasileira e compreensão internacional. 'Lei' recebe inicial maiúscula por se referir à Lei judaica no contexto. A nota preserva a relação sintática e a amplitude lexical do grego.
