  text: E Judas caiu[a], e os demais fugiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «foi abatido» ou «morreu». O grego diz «caiu», expressão comum em relatos de batalha que pode indicar a morte sem declará-la de modo mais explícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Adota a forma tradicional portuguesa do nome grego Ἰούδας; neste contexto, refere-se a Judas Macabeu.
- source_word: ἔπεσεν
  choice: caiu
  rationale: Traduz diretamente o aoristo de πίπτω. Em narrativa de batalha, «cair» pode implicar a morte, mas preserva a formulação sóbria e a relativa implicitude do grego.
- source_word: οἱ λοιποὶ
  choice: os demais
  rationale: Expressa de modo natural e conciso os outros que restavam além de Judas.
- source_word: ἔφυγον
  choice: fugiram
  rationale: No contexto de combate, φεύγω indica fugir diante do perigo; «fugiram» é a correspondência direta e natural.
