base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/008.yaml
  text: And he was dismayed[a], and said to those who were left, “Let us rise and go up against our adversaries, if perhaps we are able to fight them.”
translation:
  language: pt
  text: 'E ele perdeu o ânimo[a] e disse aos que restavam: “Levantemo-nos e subamos contra os nossos adversários, se acaso conseguirmos combatê-los.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou enfraquecido” ou “desanimou”; o verbo grego pode indicar alguém física ou emocionalmente prostrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελύθη
  choice: perdeu o ânimo
  rationale: O passivo de ἐκλύω pode indicar ficar enfraquecido, abatido ou sem coragem. No contexto da batalha, a expressão comunica com naturalidade o colapso interior da determinação, sem excluir a ideia de enfraquecimento.
- source_word: τοῖς καταλειφθεῖσιν
  choice: aos que restavam
  rationale: O particípio de καταλείπω designa os que ficaram ou permaneceram. A formulação é natural em português e não especifica indevidamente se eram sobreviventes ou apenas o restante da tropa.
- source_word: Ἀναστῶμεν
  choice: Levantemo-nos
  rationale: Preserva a força exortativa do subjuntivo hortativo e mantém o tom digno da convocação militar.
- source_word: ἀναβῶμεν
  choice: subamos
  rationale: Conserva o sentido básico de ἀναβαίνω, que pode refletir tanto deslocamento para terreno mais alto quanto avanço militar, sem decidir entre essas nuances.
- source_word: τοὺς ὑπεναντίους ἡμῶν
  choice: os nossos adversários
  rationale: ὑπεναντίος descreve aqueles que se colocam em oposição. “Adversários” preserva essa ideia com precisão e em registro natural.
- source_word: ἐὰν ἄρα
  choice: para ver se
  rationale: Em português corrente, a expressão comunica a incerteza e a tentativa esperançosa presentes na combinação grega, com maior naturalidade que o literal “se porventura”.
- source_word: δυνώμεθα
  choice: conseguimos
  rationale: Expressa capacidade no âmbito incerto introduzido por ἐὰν ἄρα; junto de “para ver se”, reproduz de modo idiomático o caráter tentativo.
- source_word: πολεμῆσαι
  choice: combatê-los
  rationale: O infinitivo significa lutar ou guerrear contra alguém. “Combatê-los” é claro, conciso e adequado ao contexto imediato de batalha.
