  text: E a festa de casamento transformou-se em luto, e o som de seus músicos transformou-se em lamentação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετεστράφη
  choice: transformou-se em
  rationale: Expressa de modo natural a mudança radical de uma condição para outra, preservando o contraste entre celebração e luto.
- source_word: ὁ γάμος
  choice: o casamento
  rationale: No contexto, designa a celebração do casamento; a formulação é concisa e corrente em português.
- source_word: πένθος
  choice: luto
  rationale: O termo indica luto diante de morte ou calamidade e mantém o contraste cerimonial com o casamento.
- source_word: φωνὴ
  choice: o som
  rationale: Embora possa significar literalmente “voz”, aqui se refere ao que se ouvia dos músicos; “som” é idiomático no contexto musical.
- source_word: μουσικῶν
  choice: músicos
  rationale: O plural genitivo pode designar os músicos ou executantes. A alternativa referente aos instrumentos é preservada em nota.
- source_word: θρῆνον
  choice: lamentação
  rationale: Designa um lamento formal, muitas vezes fúnebre, e preserva o tom elevado e coletivo do verso.
