  text: And they set out and went to Berea with twenty thousand men and two thousand horsemen[a].
translation:
  language: pt
  text: Então eles partiram e foram para Bereia com vinte mil homens e dois mil cavaleiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “dois mil cavalos”; no contexto militar, a expressão provavelmente se refere a tropas montadas, daí “cavaleiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆραν
  choice: partiram
  rationale: O verbo indica que levantaram acampamento ou iniciaram a partida. “Partiram” é natural em português e não especifica além do texto se houve desmontagem formal de um acampamento.
- source_word: ἐπορεύθησαν
  choice: foram
  rationale: Verbo comum de deslocamento. “Foram” preserva a simplicidade do grego; “marcharam” acrescentaria uma nuance militar não expressa diretamente pelo verbo.
- source_word: εἰς Βερέαν
  choice: para Bereia
  rationale: A preposição εἰς indica direção ou destino. “Bereia” é a forma portuguesa tradicional e clara do topônimo.
- source_word: ἐν εἴκοσι χιλιάσιν ἀνδρῶν
  choice: com vinte mil homens
  rationale: Neste contexto militar, ἐν introduz a força que acompanha o deslocamento. “Com” expressa isso de modo idiomático em português.
- source_word: δισχιλίοις ἵπποις
  choice: dois mil cavaleiros
  rationale: A expressão significa literalmente “dois mil cavalos”, mas, no relato militar, os cavalos representam metonimicamente as tropas montadas. “Cavaleiros” comunica o sentido provável sem esconder a forma literal, registrada em nota.
