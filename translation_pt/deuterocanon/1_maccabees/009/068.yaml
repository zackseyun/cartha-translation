base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/068.yaml
  text: And they fought against Bacchides[a], and he was crushed by them, and they pressed him hard, because his plan and his attack were in vain.
translation:
  language: pt
  text: E lutaram contra Báquides, e ele foi esmagado por eles, e o pressionaram duramente, porque seu plano e seu ataque foram em vão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente “vazia”. Também se pode traduzir: “foram inúteis”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπολέμησαν πρὸς
  choice: lutaram contra
  rationale: Com πρός e o acusativo, πολεμέω expressa ação hostil dirigida contra alguém. “Lutaram contra” é direto, natural e preserva essa força.
- source_word: Βακχίδην
  choice: Báquides
  rationale: Forma tradicional e inteligível do nome grego em português, com acento conforme a pronúncia portuguesa.
- source_word: συνετρίβη
  choice: foi esmagado
  rationale: O passivo de συντρίβω transmite literalmente a ideia vívida de ser quebrado ou esmagado; no contexto militar, implica derrota severa sem reduzir o verbo ao sentido abstrato de “foi derrotado”.
- source_word: ἔθλιβον αὐτὸν σφόδρα
  choice: Eles o pressionaram duramente
  rationale: θλίβω pode significar pressionar, afligir ou oprimir. No contexto de combate, “pressionaram” comunica a intensa pressão militar, enquanto “duramente” representa σφόδρα.
- source_word: βουλή
  choice: plano
  rationale: Aqui βουλή designa o curso de ação concebido por Báquides. “Plano” é claro e mantém a amplitude do termo.
- source_word: ἔφοδος
  choice: ataque
  rationale: ἔφοδος pode designar ataque, assalto ou investida. “Ataque” é a opção moderna mais direta e combina naturalmente com “plano”.
- source_word: κενή
  choice: foram em vão
  rationale: κενή significa literalmente “vazia”, mas neste contexto qualifica o plano e o ataque como infrutíferos. “Foram em vão” comunica esse sentido idiomaticamente; a imagem literal é preservada em nota.
