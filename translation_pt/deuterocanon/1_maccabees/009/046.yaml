  text: Now then[a], cry out to heaven, so that you may be delivered from the hand of our enemies.
translation:
  language: pt
  text: Agora, pois, clamem ao céu[a], para que sejam libertados da mão dos nossos inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Deus”; o grego diz “ao céu”, usando “céu” como forma reverencial de se referir ao âmbito divino ou ao próprio Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, portanto
  rationale: Preserva tanto o valor temporal de νῦν quanto a força conclusiva e urgente de οὖν, em português claro e digno.
- source_word: κεκράξατε
  choice: clamem
  rationale: O imperativo aoristo de κράζω expressa um apelo urgente e intenso; “clamem” comunica uma súplica vigorosa dirigida ao céu.
- source_word: εἰς οὐρανόν
  choice: ao céu
  rationale: Mantém a expressão grega e sua possível função reverencial ou metonímica, sem explicitar “Deus” onde o texto diz literalmente “céu”.
- source_word: ὅπως
  choice: para que
  rationale: Introduz de modo natural a finalidade ou o resultado pretendido.
- source_word: διασωθῆτε
  choice: sejam libertados
  rationale: O subjuntivo passivo de διασῴζω indica resgate de um perigo concreto; “libertados” se ajusta ao contexto militar sem acrescentar conotações soteriológicas desnecessárias.
- source_word: ἐκ χειρὸς
  choice: das mãos de
  rationale: Conserva a imagem bíblica de estar sob o poder ou domínio de alguém. O plural “mãos” é a forma idiomática mais natural em português nesta construção.
- source_word: ἐχθρῶν ἡμῶν
  choice: nossos inimigos
  rationale: Equivalente direto e natural da construção possessiva grega.
theological_decisions:
- issue: Se “céu” deve ser mantido literalmente ou interpretado explicitamente como Deus
  choice: ao céu
  alternative: a Deus
  rationale: O grego traz οὐρανόν, “céu”, provavelmente como metonímia reverencial para Deus ou para a esfera divina. A tradução preserva a formulação e a tensão do texto, enquanto a nota esclarece a leitura possível.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom é urgente e digno. “Clamem” preserva o caráter de súplica, e “das mãos” mantém a imagem bíblica em formulação idiomática portuguesa.
