base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/035.yaml
  text: And he sent his brother as leader of the crowd[a], and he urged his Nabatean friends to take charge of their abundant baggage for them.
translation:
  language: pt
  text: E ele enviou seu irmão como líder do grupo e pediu a seus amigos nabateus que recebessem sob sua guarda, para eles, a grande quantidade de bagagem deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tomassem conta, para eles, da grande quantidade de bagagem deles”. O infinitivo grego pode indicar o recebimento de bens confiados a alguém para que os guarde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: É o equivalente narrativo direto e natural do verbo grego.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Reproduz de modo conciso a relação possessiva expressa no grego.
- source_word: ἡγούμενον τοῦ ὄχλου
  choice: como líder do grupo
  rationale: O particípio indica a função de liderança confiada ao irmão; “grupo” comunica naturalmente, neste contexto, o conjunto de pessoas designado por ὄχλος sem lhe atribuir patente militar específica.
- source_word: παρεκάλεσεν
  choice: pediu
  rationale: No contexto de uma solicitação prática, “pediu” é natural e preserva o sentido do verbo sem introduzir uma intensidade que o grego não exige.
- source_word: τοὺς Ναβαταίους φίλους αὐτοῦ
  choice: seus amigos nabateus
  rationale: Mantém tanto a identificação étnica quanto a relação de amizade, em ordem idiomática no português atual.
- source_word: παραθέσθαι αὐτοῖς
  choice: que recebessem e guardassem para eles
  rationale: Explicita de forma natural o valor contextual de receber bens confiados e mantê-los em segurança; “para eles” representa αὐτοῖς.
- source_word: τὴν ἀποσκευήν αὐτῶν τὴν πολλήν
  choice: a grande quantidade de bagagem que levavam
  rationale: ἀποσκευή designa a bagagem ou os pertences transportados, e τὴν πολλήν ressalta sua grande quantidade. A formulação evita o pouco natural “sua muita bagagem”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Optou-se por “grupo” em vez de “multidão” porque o contexto aponta para o conjunto de acompanhantes. A nota preserva a nuance custodial e a relativa amplitude de παραθέσθαι.
