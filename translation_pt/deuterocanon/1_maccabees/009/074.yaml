base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/074.yaml
  text: When Jonathan heard the words of Apollonius[a], he was stirred in his mind, and he chose ten thousand men and went out from Jerusalem; and Simon his brother met him to help him.
translation:
  language: pt
  text: Quando Jônatas ouviu as palavras de Apolônio, ficou com a mente agitada. Então escolheu dez mil homens e saiu de Jerusalém; e Simão, seu irmão, foi ao encontro dele para ajudá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encontrou-se com ele para ajudá-lo”.'
    reason: A expressão grega pode descrever simplesmente o encontro, embora o contexto indique que Simão veio prestar ajuda a Jônatas.
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Quando ... ouviu
  rationale: A construção com ὡς e o aoristo introduz uma oração temporal; a forma portuguesa é natural e preserva a sequência narrativa.
- source_word: τῶν λόγων Ἀπολλωνίου
  choice: as palavras de Apolônio
  rationale: Mantém o sentido direto de λόγοι sem reduzi-lo a uma interpretação como “mensagem” ou “o que disse”.
- source_word: ἐκινήθη τῇ διανοίᾳ
  choice: ficou com a mente agitada
  rationale: Expressa a agitação interior indicada pelo passivo de κινέω e preserva o âmbito mental de διάνοια, sem determinar se a emoção foi ira, medo ou perturbação.
- source_word: ἐπέλεξεν δέκα χιλιάδας ἀνδρῶν
  choice: escolheu dez mil homens
  rationale: Tradução direta que não acrescenta “soldados”, embora o contexto seja militar.
- source_word: ἐξῆλθεν ἐξ Ἱερουσαλήμ
  choice: saiu de Jerusalém
  rationale: Reproduz a ideia simples de partida sem acrescentar a noção não expressa de marcha militar.
- source_word: συνήντησεν αὐτῷ
  choice: foi ao encontro dele
  rationale: Conserva o sentido básico de encontro e, junto da expressão seguinte, comunica naturalmente que Simão veio apoiar Jônatas.
- source_word: ἐπὶ βοήθειαν αὐτοῦ
  choice: para ajudá-lo
  rationale: A expressão preposicional indica finalidade ou apoio; esta formulação é clara e idiomática.
