  source_fidelity: 'O texto traduz com precisão a sequência grega: a reação interior de Jônatas (ἐκινήθη τῇ διανοίᾳ), a escolha de dez mil homens, sua saída de Jerusalém e a chegada de Simão para prestar-lhe ajuda. «Foi ao encontro dele» representa adequadamente συνήντησεν αὐτῷ sem converter o encontro em uma união militar mais específica do que o grego afirma.'
  naturalness: O português é claro, atual e de registro narrativo apropriado. «Ficou com a mente agitada» é uma formulação natural que mantém a esfera mental de διάνοια e não especifica indevidamente a emoção. A divisão em duas frases favorece a legibilidade sem alterar a sequência.
  terminology: Os nomes Jônatas, Apolônio e Simão estão bem estabelecidos em português. «Dez mil homens» preserva ἀνδρῶν sem acrescentar «soldados». «Para ajudá-lo» transmite de modo idiomático a finalidade expressa em ἐπὶ βοήθειαν αὐτοῦ.
