  text: E naquele dia caíram cerca de mil homens junto de Báquides.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “naquele dia caíram cerca de mil homens do lado de Báquides”. A expressão grega com παρά pode indicar associação com Báquides, e não necessariamente simples proximidade física.
