lexical_decisions:
- source_word: διέπεσαν
  choice: caíram
  rationale: O verbo conserva a imagem grega de cair e, no contexto de batalha, indica naturalmente morrer em combate, sem explicitar além do texto.
- source_word: παρὰ Βακχίδα
  choice: junto de Báquides
  rationale: A expressão com παρά e acusativo relaciona os homens a Báquides, mas pode indicar proximidade ou associação com o seu lado. “Junto de” preserva essa abertura melhor do que uma formulação de agência, como “pelas mãos de Báquides”.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ
  choice: naquele dia
  rationale: Forma temporal direta, corrente e fiel ao dativo grego.
- source_word: εἰς χιλίους ἄνδρας
  choice: cerca de mil homens
  rationale: εἰς com numeral indica extensão ou total aproximado, isto é, um número que chegou a aproximadamente mil.
