  text: And Jonathan said to his brothers[a], “Let us rise now and fight for our lives, for today is not as yesterday and the day before.”
translation:
  language: pt
  text: 'E Jônatas disse aos seus irmãos: “Levantemo-nos agora e lutemos por nossas vidas, pois hoje não é como ontem e anteontem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστῶμεν
  choice: Levantemo-nos
  rationale: O subjuntivo aoristo tem sentido exortativo. A escolha conserva tanto o chamado à ação quanto a urgência militar.
- source_word: πολεμήσωμεν
  choice: lutemos
  rationale: O verbo indica entrar em combate; “lutemos” é natural em português e adequado à exortação imediata.
- source_word: ὑπὲρ τῶν ψυχῶν ἡμῶν
  choice: por nossa vida
  rationale: Neste contexto de batalha, ψυχή se refere à vida e à sobrevivência, não especificamente à alma imaterial.
- source_word: σήμερον
  choice: hoje
  rationale: Correspondência direta e natural para o advérbio temporal.
- source_word: ὡς ἐχθὲς καὶ τρίτην ἡμέραν
  choice: como ontem e anteontem
  rationale: A expressão grega é idiomática e se refere aos dois dias anteriores; “ontem e anteontem” comunica isso com clareza e concisão em português.
- source_word: ἀδελφοῖς
  choice: irmãos
  rationale: Preserva o termo familiar masculino explícito do grego sem ampliar indevidamente o referente.
