lexical_decisions:
- source_word: ὑστήκει
  choice: mantinha-se
  rationale: A forma verbal indica permanência em posição. O sujeito não está expresso no trecho grego fornecido; a construção sem pronome conserva essa indefinição melhor do que «ele» ou «ela».
- source_word: καθὼς ἐπέταξεν Ἰωναθάν
  choice: conforme Jônatas havia ordenado
  rationale: καθώς expressa correspondência, e ἐπιτάσσω significa ordenar. O mais-que-perfeito composto deixa claro que a ordem precedeu a permanência em posição.
- source_word: ἐκοπίασαν οἱ ἵπποι αὐτῶν
  choice: os cavalos deles se cansaram
  rationale: κοπιάω denota cansaço resultante de esforço, sem exigir o sentido mais forte de exaustão completa; o possessivo é mantido de modo direto.
- source_word: ἐξέλυσεν τὴν δύναμιν αὐτοῦ
  choice: pôs sua força em ação
  rationale: ἐξέλυσεν tem o sentido básico de soltar ou fazer avançar; no contexto militar, a expressão escolhida comunica o emprego tático da força sem restringir δύναμις necessariamente a um exército inteiro.
- source_word: συνῆψεν πρὸς
  choice: travou combate com
  rationale: No contexto militar, συνάπτω com πρός descreve o ato de entrar em combate contra ou com outra força. A formulação é natural e mantém a relação introduzida pela preposição.
- source_word: τὴν
  choice: a
  rationale: O texto grego fornecido termina no artigo definido feminino acusativo, deixando a expressão incompleta. A tradução reproduz deliberadamente essa interrupção.
