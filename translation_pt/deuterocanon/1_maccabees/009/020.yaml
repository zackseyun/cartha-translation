lexical_decisions:
- source_word: ἐκόψαντο
  choice: prantearam
  rationale: No contexto de morte, o médio de κόπτω indica lamentação fúnebre, possivelmente acompanhada de gestos rituais. “Prantearam” comunica esse sentido sem explicitar um gesto físico não exigido pelo contexto.
- source_word: αὐτόν
  choice: por ele
  rationale: O pronome retoma Judas no contexto anterior; em português, a regência natural de “prantear” permite “por ele” nesta construção.
- source_word: ἐκεῖ
  choice: ali
  rationale: Advérbio locativo simples, vertido de modo natural e direto.
- source_word: πᾶς Ἰσραήλ
  choice: todo o Israel
  rationale: Preserva a expressão coletiva nacional e seu uso bíblico corrente em português.
- source_word: κοπετὸν μέγαν
  choice: grande lamentação
  rationale: Mantém o substantivo cognato da linguagem anterior de pranto e conserva a intensificação expressa por μέγαν.
- source_word: ἔπενθουν
  choice: ficaram de luto
  rationale: Distingue πενθέω do verbo anterior e expressa naturalmente um estado prolongado de pesar e luto.
- source_word: ἡμέρας πολλὰς
  choice: por muitos dias
  rationale: Expressa de maneira idiomática o acusativo grego de duração.
- source_word: καὶ εἶπαν
  choice: 'Então disseram:'
  rationale: Introduz a fala do versículo seguinte. “Então” dá fluidez narrativa ao καί, e os dois-pontos sinalizam que a citação continua.
