  text: 'E o prantearam ali[a], e todo Israel o pranteou com grande lamentação; ficaram de luto por muitos dias e disseram:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego acumula termos de luto: primeiro um verbo que indica prantear, depois a expressão “grande lamentação” e, por fim, outro verbo que significa estar de luto. A tradução conserva essa progressão em vez de uniformizar as expressões.'
