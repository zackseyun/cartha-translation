  yaml_path: translation/deuterocanon/1_maccabees/009/047.yaml
  text: And the battle grew intense[a], and Jonathan stretched out his hand to strike Bacchides[b], but he turned away from him to the rear.
translation:
  language: pt
  text: E a batalha se acirrou[a], e Jônatas estendeu a mão para golpear Báquides, mas Báquides se desviou dele, recuando[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a batalha se fechou” ou “a luta se intensificou”. O verbo grego sugere que o combate se apertou ou se tornou mais intenso.
    reason: lexical_alternative
  - marker: b
    text: Ou “mas ele se desviou dele para trás”. A expressão grega indica que Báquides se afastou do ataque em direção à retaguarda.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆγεν
  choice: se acirrou
  rationale: No contexto imediato de combate, o verbo sugere que a luta se fechou ou se intensificou. “Se acirrou” expressa isso de modo natural sem reduzir o sentido ao simples ato de reunir.
- source_word: ὁ πόλεμος
  choice: a batalha
  rationale: Aqui πόλεμος designa o confronto em curso, de modo que “batalha” é mais preciso que o sentido amplo de “guerra”.
- source_word: ἐξέτεινεν ... τὴν χεῖρα αὐτοῦ
  choice: estendeu a mão
  rationale: Mantém visível a expressão grega e soa natural em português, sem explicitar além do texto o tipo de golpe pretendido.
- source_word: πατάξαι
  choice: para ferir
  rationale: Neste contexto de combate, “ferir” comunica a ação violenta pretendida com linguagem moderna e digna; “golpear” também seria possível, mas é mais específico quanto ao gesto.
- source_word: Βακχίδην
  choice: Báquides
  rationale: Forma portuguesa tradicional e fonologicamente clara do nome grego Βακχίδης.
- source_word: ἐξέκλινεν
  choice: se desviou
  rationale: O verbo indica afastar-se da direção do ataque ou virar para o lado. “Se desviou” preserva a ideia de movimento evasivo sem especificar se houve fuga.
- source_word: ἀπ᾿ αὐτοῦ
  choice: dele
  rationale: Reproduz a referência pronominal do grego sem resolver indevidamente a possível ambiguidade quanto aos participantes.
- source_word: εἰς τὰ ὀπίσω
  choice: para trás
  rationale: Tradução direta e idiomática da direção para a retaguarda.
