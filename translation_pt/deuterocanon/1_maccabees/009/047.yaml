  naturalness: “A batalha se acirrou” é natural e adequada. A repetição de pronomes em “ele se desviou dele” fica pouco clara em português; explicitar Báquides preserva melhor a relação entre as ações sem acrescentar interpretação indevida.
  terminology: “Jônatas” e “Báquides” são formas portuguesas estabelecidas. “Batalha” corresponde bem a πόλεμος no contexto, e “para trás” comunica εἰς τὰ ὀπίσω, embora “recuando” seja mais fluente em português neste encadeamento.
