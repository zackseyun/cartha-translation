lexical_decisions:
- source_word: ἐβαρύνθη
  choice: ficou intensa
  rationale: O passivo de βαραίνω expressa literalmente a ideia de tornar-se pesado; no contexto de combate, indica que a luta se tornou severa ou intensa. A formulação é natural em português e conserva o sentido contextual.
- source_word: ὁ πόλεμος
  choice: a batalha
  rationale: Embora πόλεμος também possa significar «guerra», aqui designa o confronto específico em andamento.
- source_word: ἔπεσαν τραυματίαι πολλοὶ
  choice: muitos ... caíram feridos
  rationale: A construção preserva o verbo «caíram» e expressa τραυματίαι como pessoas feridas, sem ampliar o sentido para mortos ou baixas em geral.
- source_word: ἐκ τούτων καὶ ἐκ τούτων
  choice: dos dois lados
  rationale: A expressão literalmente simétrica, «destes e daqueles», é um modo idiomático de indicar os dois grupos em combate. «Dos dois lados» transmite isso com clareza e naturalidade.
