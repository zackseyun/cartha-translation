  text: After these words it was reported to Jonathan and Simon his brother that the sons of Jambri were holding a great wedding[a], and were bringing the bride from Nadabath, the daughter of one of the great nobles of Canaan, with a large escort.
translation:
  language: pt
  text: Depois dessas palavras, foi comunicado a Jônatas e a Simão, seu irmão, que os filhos de Jambri estavam celebrando um grande casamento e trazendo a noiva de Nadabate, filha de um dos grandes nobres de Canaã, com uma grande escolta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com uma grande procissão”. O termo grego παραπομπή pode indicar tanto a escolta acompanhante como a própria procissão festiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τοὺς λόγους τούτους
  choice: Depois dessas palavras
  rationale: Mantém a referência próxima a λόγους e funciona como transição temporal natural em português, sem ampliar para “acontecimentos”.
- source_word: ἀπηγγέλησαν
  choice: foi anunciado
  rationale: Preserva a construção passiva e não introduz um agente ausente no grego.
- source_word: Ἰωναθὰν καὶ Σίμωνι τῷ ἀδελφῷ αὐτοῦ
  choice: a Jônatas e a seu irmão Simão
  rationale: Expressa o objeto indireto e identifica naturalmente Simão como irmão de Jônatas.
- source_word: Υἱοὶ Ἰαμβρὶ
  choice: os filhos de Jambri
  rationale: Conserva a designação familiar ou clânica transparente do texto grego.
- source_word: ποιοῦσιν γάμον μέγαν
  choice: estavam celebrando um grande casamento
  rationale: Verte idiomaticamente ποιεῖν γάμον e preserva o qualificativo μέγαν sem acrescentar explicitamente a ideia de banquete.
- source_word: ἄγουσι τὴν νύμφην
  choice: trazendo ... a noiva
  rationale: “Trazer” comunica de modo natural o deslocamento da noiva no contexto nupcial.
- source_word: ἀπὸ Ναδαβάθ
  choice: de Nadabate
  rationale: A preposição indica procedência; o topônimo é transliterado em forma natural para o português.
- source_word: θυγατέρα ἑνὸς τῶν μεγάλων μεγιστάνων Χαναάν
  choice: filha de um dos grandes nobres de Canaã
  rationale: “Nobres” comunica a alta posição social de μεγιστάνων, enquanto “grandes” preserva a ênfase de μεγάλων.
- source_word: μετὰ παραπομπῆς μεγάλης
  choice: com uma grande escolta
  rationale: Representa o sentido concreto de acompanhamento, mantendo em nota a possibilidade de uma procissão festiva.
