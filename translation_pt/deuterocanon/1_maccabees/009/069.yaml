  yaml_path: translation/deuterocanon/1_maccabees/009/069.yaml
  text: And he became angry with those lawless men who had advised him to come into the country[a], and he killed many of them, and he decided to depart to his own land.
translation:
  language: pt
  text: Ele ficou irado com aqueles homens sem lei que o haviam aconselhado a entrar na região; e mataram muitos deles.[a] Então decidiu partir para sua própria terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego de Swete traz literalmente “e mataram muitos deles”. Como os verbos ao redor estão no singular e a sequência narrativa pode indicar que o mesmo líder realizou a ação, algumas traduções entendem: “e ele matou muitos deles”.'
    reason: textual_variant
lexical_decisions:
- source_word: ὠργίσθη
  choice: ficou irado
  rationale: Expressa naturalmente o valor ingressivo do aoristo de ὀργίζομαι, sem intensificar além do que o grego exige.
- source_word: τοῖς ἀνδράσι τοῖς ἀνόμοις
  choice: aqueles homens sem lei
  rationale: Preserva a força moral e legal de ἄνομος, em vez de reduzi-la ao sentido mais genérico de “maus” ou “perversos”.
- source_word: τοῖς συμβουλεύσασιν αὐτῷ
  choice: que o haviam aconselhado
  rationale: O particípio aoristo identifica os homens pelo conselho anterior que deram; o mais-que-perfeito torna clara essa anterioridade em português.
- source_word: ἐλθεῖν εἰς τὴν χώραν
  choice: a entrar na região
  rationale: No contexto militar e geográfico, χώρα designa uma região ou território; “região” é claro e evita atribuir ao termo uma conotação pactual indevida.
- source_word: ἀπέκτειναν ἐξ αὐτῶν πολλούς
  choice: mataram muitos deles
  rationale: Traduz diretamente a forma verbal plural preservada no texto grego de Swete. Como o referente do sujeito plural não é expresso e o contexto pode sugerir uma forma singular, a dificuldade é mantida e explicada em nota.
- source_word: ἐβουλεύσατο
  choice: decidiu
  rationale: No contexto, o médio indica que ele tomou para si uma decisão definida, não apenas que ponderou ou pediu conselho.
- source_word: τοῦ ἀπελθεῖν
  choice: partir
  rationale: O infinitivo articular apresenta o conteúdo da decisão; “partir” é atual, natural e adequado ao registro narrativo.
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: para sua própria terra
  rationale: γῆ indica aqui a terra ou território de origem dele; “própria” explicita em português a ênfase possessiva natural da expressão.
