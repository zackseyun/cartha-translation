base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/066.yaml
  text: And he struck Odomera and his brothers and the sons of Phasiron in their camp[b][a], and he began to strike and to advance with his forces.
translation:
  language: pt
  text: E ele feriu Odomera, seus irmãos e os filhos de Fasiron no acampamento deles[a]; então começou a ferir e a avançar com as tropas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “na tenda” ou “na habitação deles”; neste contexto militar, o sentido provável é “no acampamento deles”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “começou a ferir e a subir”; “avançar” expressa o provável sentido militar de “subir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάτεξεν
  choice: feriu
  rationale: O aoristo de πατάσσω indica golpear ou ferir. “Feriu” conserva a ação concreta e o tom militar sem recorrer a linguagem arcaica.
- source_word: Ὀδομηρὰ
  choice: Odomera
  rationale: O nome próprio é transliterado diretamente da forma grega.
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: seus irmãos
  rationale: ἀδελφοί tem como sentido normal “irmãos”; o contexto não exige o sentido mais amplo de parentes.
- source_word: τοὺς υἱοὺς Φασιρὼν
  choice: os filhos de Fasiron
  rationale: A tradução mantém a expressão genealógica concreta do grego, sem decidir se se trata de filhos imediatos ou de descendentes.
- source_word: ἐν τῷ σκηνώματι αὐτῶν
  choice: no acampamento deles
  rationale: σκηνώμα pode designar tenda ou habitação, mas neste contexto militar e coletivo “acampamento” comunica melhor o sentido provável.
- source_word: ἐξηρξατο
  choice: começou
  rationale: A forma verbal assinala o início da ação, valor expresso diretamente por “começou”.
- source_word: τύπτειν
  choice: a ferir
  rationale: τύπτω significa golpear ou ferir. A repetição de “ferir” preserva a repetição verbal do grego em vez de suavizá-la.
- source_word: ἀναβαίνειν
  choice: a avançar
  rationale: Embora o sentido básico seja “subir”, no contexto de combate o verbo provavelmente descreve o avanço militar.
- source_word: ἐν ταῖς δυνάμεσιν
  choice: com suas tropas
  rationale: δύναμις no plural pode indicar forças militares. “Tropas” é natural em português; o possessivo, implícito pelo contexto, torna clara a relação com o sujeito.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordenada e a repetição de “ferir” refletem o grego, enquanto “acampamento” e “avançar” comunicam de modo natural o provável sentido militar.
