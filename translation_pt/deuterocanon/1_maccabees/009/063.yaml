  yaml_path: translation/deuterocanon/1_maccabees/009/063.yaml
  text: And Bacchides learned of it and gathered all his forces[c][b][a], and he gave orders to those from Judea.
translation:
  language: pt
  text: Báquides soube disso, reuniu todas as suas forças[a] e deu ordens aos que eram da Judeia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “toda a sua multidão”; neste contexto, provavelmente se refere ao conjunto de tropas ou partidários sob seu comando.
    reason: lexical_alternative
  - marker: b
    text: Ou, menos provavelmente, “aos que estavam na Judeia”. O grego diz “aos que são/procedem da Judeia” e pode indicar origem ou vínculo com a Judeia, não apenas localização.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: ficou sabendo disso
  rationale: O aoristo de γινώσκω indica aqui que Báquides tomou conhecimento do acontecimento anterior; a expressão é natural em português e preserva a progressão narrativa.
- source_word: συνήγαγεν
  choice: reuniu
  rationale: O verbo descreve a concentração de pessoas sob seu comando para agir, com provável sentido militar no contexto.
- source_word: πᾶν τὸ πλῆθος αὐτοῦ
  choice: todas as suas forças
  rationale: Embora a expressão signifique literalmente “toda a sua multidão”, o contexto militar favorece o sentido coletivo de tropas ou seguidores sob seu comando.
- source_word: τοῖς ἐκ τῆς Ἰουδαίας
  choice: aos que eram da Judeia
  rationale: A formulação conserva a ideia de origem ou vínculo expressa por ἐκ sem transformar a frase, de modo categórico, em mera localização atual.
- source_word: παρήγγειλεν
  choice: deu ordens
  rationale: A expressão comunica com naturalidade o ato de transmitir instruções autoritativas e se ajusta ao contexto militar.
