  text: And the force moved out from the camp and took their stand to meet them[a], and the cavalry was divided into two parts, and the slingers and the archers went before the force, and all the mighty men were in the front ranks.
translation:
  language: pt
  text: As tropas saíram do acampamento e tomaram posição para enfrentá-los. A cavalaria foi dividida em duas partes; os atiradores de funda e os arqueiros avançavam à frente das tropas, e todos os guerreiros valentes ocupavam a linha de frente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e os combatentes da linha de frente eram todos guerreiros valentes”. A expressão grega é condensada e pode relacionar “os combatentes da linha de frente” e “todos os valentes” de mais de uma maneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: saíram
  rationale: No contexto militar, o verbo indica que as tropas deixaram o acampamento para entrar em ação; “saíram” é claro e natural sem acrescentar uma ideia de ataque que o grego não explicita.
- source_word: ἡ δύναμις
  choice: as tropas
  rationale: Aqui δύναμις designa coletivamente uma força militar. “As tropas” abrange naturalmente as diferentes unidades mencionadas em seguida.
- source_word: παρεμβολῆς
  choice: acampamento
  rationale: Equivalente corrente e preciso para o sentido militar de παρεμβολή.
- source_word: ἔστησαν εἰς συνάντησιν αὐτοῖς
  choice: tomaram posição para enfrentá-los
  rationale: Expressa tanto o ato deliberado de se posicionar quanto o encontro hostil, em linguagem militar natural.
- source_word: ἡ ἵππος
  choice: a cavalaria
  rationale: O substantivo coletivo, literalmente relacionado a “cavalo”, designa aqui as tropas montadas.
- source_word: ἐμερίσθη ... εἰς δύο μέρη
  choice: foi dividida em duas partes
  rationale: Mantém de forma direta a construção passiva e a divisão tática descrita pelo grego.
- source_word: σφενδονῆται
  choice: atiradores de funda
  rationale: Forma transparente para leitores modernos, mais imediatamente compreensível que o termo técnico “fundibulários”.
- source_word: τοξόται
  choice: arqueiros
  rationale: Termo militar corrente para combatentes armados de arco.
- source_word: προεπορεύοντο τῆς δυνάμεως
  choice: avançavam à frente das tropas
  rationale: Preserva a posição diante do corpo principal sem sugerir indevidamente que essas unidades exerciam o comando.
- source_word: πρωταγωνισταὶ πάντες οἱ δυνατοί
  choice: todos os guerreiros valentes ocupavam a linha de frente
  rationale: Comunica o provável sentido militar de πρωταγωνισταί como combatentes da posição mais avançada e entende οἱ δυνατοί como guerreiros fortes ou valentes, preservando em nota a compressão sintática da expressão.
