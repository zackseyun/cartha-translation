  text: How the mighty one has fallen, he who was saving Israel.
translation:
  language: pt
  text: Como caiu o valente[a], aquele que salvava Israel!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Estas palavras ecoam a fórmula bíblica de lamento “Como caíram os valentes!” (compare 2 Samuel 1:19,25,27).
    reason: cross_reference
lexical_decisions:
- source_word: Πῶς
  choice: Como
  rationale: Introduz uma exclamação de lamento, não uma pergunta. “Como” preserva a fórmula bíblica sem acrescentar uma interjeição ausente do grego.
- source_word: ἔπεσεν
  choice: caiu
  rationale: O aoristo de πίπτω descreve a queda consumada; em português, o pretérito perfeito é a forma natural e vigorosa neste lamento.
- source_word: δυνατός
  choice: o valente
  rationale: O adjetivo está empregado como substantivo e no singular. “O valente” mantém o tom elevado, a referência implícita a Judas e a ressonância da fórmula de lamento de 2 Samuel, sem inserir a palavra “guerreiro”.
- source_word: σώζων
  choice: aquele que salvava
  rationale: O particípio presente retrata uma ação contínua ou característica do homem que caiu. “Salvava” preserva esse aspecto melhor que o pontual “salvou”.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: É o objeto direto de σώζων; o nome próprio dispensa artigo nessa construção em português.
theological_decisions:
- issue: Eco da fórmula bíblica de lamento
  choice: Como caiu o valente
  alternative: Como caiu um homem poderoso
  rationale: A formulação preserva o provável eco de 2 Samuel 1:19,25,27, bem como o singular do texto grego, sem explicitar uma interpretação além do que o verso diz.
- issue: Sentido temporal do particípio σώζων
  choice: aquele que salvava Israel
  alternative: aquele que salvou Israel
  rationale: A tradução mantém a ação em curso ou característica expressa pelo particípio presente e não a reduz a um único ato passado.
translation_notes:
  register: Português moderno, digno e acessível, com cadência breve de lamento. “Valente” conserva a ressonância bíblica sem soar excessivamente arcaico; a exclamação torna explícita a força exclamativa de Πῶς.
