lexical_decisions:
- source_word: στρεψεν
  choice: voltou
  rationale: O aoristo de στρέφω, neste contexto narrativo, indica retorno ou mudança de direção; “voltou” é natural e preserva o sentido de movimento.
- source_word: σὺν τοῖς παρʼ αὐτοῦ
  choice: com os que estavam com ele
  rationale: A formulação mantém a referência ao grupo que acompanhava Jônatas sem especificá-los além do que o grego afirma.
- source_word: ἔχοντες
  choice: levando
  rationale: O particípio expressa circunstância concomitante e, com despojos materiais, “levando” comunica naturalmente a posse durante o retorno.
- source_word: σκῦλα πολλά
  choice: muitos despojos
  rationale: σκῦλα designa bens tomados em combate; “despojos” é claro, digno e tradicionalmente inteligível, enquanto πολλά é representado pelo plural quantificado “muitos”.
