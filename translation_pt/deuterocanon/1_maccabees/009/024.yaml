  text: In those days a very great famine came about[a], and the land defected with them.
translation:
  language: pt
  text: Naqueles dias, houve uma fome extremamente grave, e a região passou para o lado deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a região desertou junto com eles”. O verbo grego indica abandonar um lado e aderir a outro, enquanto a expressão que o acompanha significa literalmente “com eles”.'
    reason: Preserva a possível nuance de acompanhamento em μετʼ αὐτῶν sem perder o sentido político ou militar de αὐτομόλησεν.
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Naqueles dias
  rationale: Reproduz de modo natural a fórmula temporal narrativa do grego.
- source_word: ἐγενήθη
  choice: houve
  rationale: Expressa com naturalidade o surgimento ou a ocorrência da fome, sem tornar a frase excessivamente literal.
- source_word: λιμὸς μεγάλη σφόδρα
  choice: uma fome extremamente grave
  rationale: Mantém a forte intensificação de μεγάλη por σφόδρα em português atual e digno.
- source_word: αὐτομόλησεν
  choice: passou para o lado
  rationale: O verbo tem sentido político ou militar de desertar e aderir ao outro partido; esta expressão é clara para leitores comuns.
- source_word: ἡ χώρα
  choice: a região
  rationale: Evita a possível conotação moderna de Estado nacional em «país» e preserva a referência ampla ao território e, por metonímia, aos seus habitantes.
- source_word: μετʼ αὐτῶν
  choice: deles
  rationale: Em ligação com o verbo de deserção, indica alinhamento com o grupo referido; a nota registra a forma mais literal e a ambiguidade entre direção e acompanhamento.
