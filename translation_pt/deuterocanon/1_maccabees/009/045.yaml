base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/045.yaml
  text: For behold[a], the battle is before us and behind us, while the water of the Jordan is on this side and on that, with marsh and forest[b], and there is no place to turn aside.
translation:
  language: pt
  text: 'Pois vejam: a batalha está diante de nós e atrás de nós; as águas do Jordão estão de um lado e do outro, e há pântano e floresta. Não há por onde nos desviarmos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não há por onde recuar” ou “escapar”. O grego diz literalmente “não há lugar para se desviar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Pois vejam
  rationale: Preserva o valor explicativo de γάρ e a força de ἰδού como chamado vívido à atenção, em português moderno e natural.
- source_word: ὁ πόλεμος
  choice: a batalha
  rationale: No contexto tático imediato, designa o combate presente, não a guerra em sentido amplo.
- source_word: ἐξ ἐναντίας ἡμῶν καὶ ἐξόπισθεν ἡμῶν
  choice: diante de nós e atrás de nós
  rationale: Mantém o contraste espacial que descreve o cerco militar.
- source_word: τὸ ὕδωρ τοῦ Ἰορδάνου
  choice: as águas do Jordão
  rationale: Conserva a referência explícita à água como obstáculo; o plural idiomático soa natural em português.
- source_word: ἔνθεν καὶ ἔνθεν
  choice: de um lado e do outro
  rationale: Expressa com clareza o sentido distributivo espacial da locução grega.
- source_word: ἕλος καὶ δρυμός
  choice: pântano e floresta
  rationale: Traduz diretamente os dois tipos de terreno que impedem a retirada, sem estreitar indevidamente δρυμός para 'matagal'.
- source_word: οὐκ ἔστι τόπος τοῦ ἐκκλῖναι
  choice: Não há por onde nos desviarmos
  rationale: Mantém a imagem verbal de 'desviar-se', ao mesmo tempo que comunica naturalmente a ausência de uma rota de saída.
