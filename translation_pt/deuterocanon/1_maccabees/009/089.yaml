  text: a gold buckle[a], as is customary to give to the kinsmen of kings[b]; and he gave him Accaron and all its territories as an inheritance.
translation:
  language: pt
  text: uma fivela de ouro[a], como é costume dar aos parentes dos reis; e deu-lhe Acarom[b] e todo o seu território como herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz apenas «de ouro», no feminino, deixando subentendido pelo contexto anterior o nome do objeto. «Fivela» foi acrescentado para completar a frase; também são possíveis «broche», «adorno» ou «fecho».
    reason: lexical_alternative
  - marker: b
    text: Acarom é a forma grega do nome do lugar mais conhecido em português como Ecrom.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσῆν
  choice: de ouro
  rationale: O adjetivo feminino significa «de ouro/dourada» e modifica um substantivo feminino subentendido pelo contexto anterior; a expressão material «de ouro» é natural em português.
- source_word: '[objeto subentendido pelo contexto]'
  choice: fivela
  rationale: O grego conserva apenas o adjetivo feminino χρυσῆν. «Fivela» completa a elipse de modo plausível no contexto de uma dádiva régia, mas a inserção interpretativa é explicitada em nota.
- source_word: ἔθος
  choice: costume
  rationale: A construção ὡς ἔθος ἐστὶν διδόσθαι é vertida naturalmente por «como é costume dar», sem perder seu caráter impessoal.
- source_word: συγγενεῦσιν
  choice: parentes
  rationale: O termo designa pessoas ligadas por parentesco. «Parentes» é corrente e claro em português, sem acrescentar uma definição mais estreita do vínculo.
- source_word: τῶν βασιλέων
  choice: dos reis
  rationale: Reproduz diretamente o genitivo plural e preserva a referência geral aos reis.
- source_word: Ἀκκαρὼν
  choice: Acarom
  rationale: Transliteração adaptada à ortografia portuguesa da forma grega do topônimo; a forma bíblica mais conhecida, «Ecrom», é registrada em nota.
- source_word: πάντα τὰ ὅρια αὐτῆς
  choice: todo o seu território
  rationale: Neste contexto de concessão de terras, ὅρια designa a área compreendida pelos limites, não apenas as linhas fronteiriças. O singular coletivo é idiomático em português.
- source_word: εἰς κληρονομίαν
  choice: como herança
  rationale: Mantém de forma concisa o sentido jurídico de uma concessão destinada a ser posse hereditária.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez. Conservou-se a abertura em minúscula porque o texto fornecido começa no meio de uma frase. O marcador [b] foi colocado junto a «Acarom», pois é a esse topônimo que a nota correspondente se refere.
