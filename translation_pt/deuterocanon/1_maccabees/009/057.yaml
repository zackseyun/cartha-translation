  yaml_path: translation/deuterocanon/1_maccabees/009/057.yaml
  text: And Bacchides saw that Alcimus had died, and he returned to the king, and the land of Judah was quiet for two years.
translation:
  language: pt
  text: Báquides viu que Álcimo havia morrido e retornou ao rei, e a terra de Judá ficou tranquila por dois anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: viu
  rationale: Mantém o sentido básico do aoristo de ὁράω e, com a oração introduzida por ὅτι, é natural em português como percepção ou constatação.
- source_word: ἀπέθανεν
  choice: havia morrido
  rationale: O mais-que-perfeito composto expressa naturalmente que a morte de Álcimo precedeu a constatação de Báquides, sem acrescentar conteúdo ao aoristo grego.
- source_word: ἀπέστρεψεν
  choice: voltou
  rationale: Traduz de modo conciso e idiomático a ideia de retornar ou voltar atrás.
- source_word: πρὸς τὸν βασιλέα
  choice: para junto do rei
  rationale: Exprime o movimento em direção à pessoa indicada por πρός com acusativo e evita sugerir, além do texto, um lugar específico.
- source_word: ἡσύχασεν
  choice: ficou tranquila
  rationale: Comunica a cessação de agitação ou conflito com a sobriedade do grego, sem ampliar o termo para uma noção teológica plena de paz.
- source_word: ἡ γῆ Ἰούδα
  choice: a terra de Judá
  rationale: Preserva explicitamente γῆ, 'terra', e mantém a forma bíblica territorial 'Judá'.
- source_word: ἔτη δύο
  choice: durante dois anos
  rationale: Torna idiomático em português o acusativo grego de extensão temporal.
