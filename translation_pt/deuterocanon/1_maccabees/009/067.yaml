lexical_decisions:
- source_word: οἱ μετʼ αὐτοῦ
  choice: os que estavam com ele
  rationale: Preserva a referência ampla aos companheiros de Simão, sem especificá-los mais estreitamente como soldados.
- source_word: ἐξῆλθον ἐκ τῆς πόλεως
  choice: saíram da cidade
  rationale: Expressa de modo natural e direto o movimento para fora da cidade indicado pelo grego.
- source_word: ἐνεπύρισαν
  choice: puseram fogo em
  rationale: Traduz claramente a ação deliberada de incendiar, sem reduzir o verbo ao resultado de queimar.
- source_word: τὰς μηχανάς
  choice: as máquinas de cerco
  rationale: No contexto militar, μηχαναί designa dispositivos usados contra a cidade; a explicitação contextual evita a leitura moderna de máquinas genéricas.
