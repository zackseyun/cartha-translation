base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/010.yaml
  text: And Judas said[a], “Far be it from me to do this thing—to flee from them. And if our time has drawn near, let us die bravely for the sake of our brothers[b], and let us not leave a cause for reproach to our glory.”
translation:
  language: pt
  text: 'E Judas disse: “Longe de mim fazer tal coisa: fugir deles! Chegou a nossa hora; morramos com coragem em favor de nossos irmãos e não deixemos motivo de censura contra a nossa glória[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossa honra” ou “nossa reputação”. Neste contexto, “glória” se refere especialmente à honra pública e à reputação do grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή μοι γένοιτο
  choice: Longe de mim
  rationale: Expressão portuguesa natural e digna para o optativo de forte repúdio pessoal.
- source_word: ποιῆσαι τὸ πρᾶγμα τοῦτο, φυγεῖν ἀπʼ αὐτῶν
  choice: 'fazer tal coisa: fugir deles'
  rationale: Mantém o objeto explícito e apresenta o infinitivo seguinte como explicação daquilo que Judas rejeita fazer.
- source_word: ἤγγικεν ὁ καιρὸς ἡμῶν
  choice: Chegou a nossa hora
  rationale: καιρός indica o momento decisivo que se aproximou; em português, “chegou a nossa hora” preserva a solenidade e a referência implícita à morte sem explicitá-la além do grego.
- source_word: ἀποθάνωμεν ἀνδρίᾳ
  choice: morramos com coragem
  rationale: Reproduz o valor de coragem e bravura da expressão grega em linguagem atual, evitando o arcaísmo e a possível leitura estritamente masculina de uma tradução literal.
- source_word: χάριν τῶν ἀδελφῶν ἡμῶν
  choice: por causa dos nossos irmãos
  rationale: Expressa χάριν com genitivo e conserva o masculino explícito de ἀδελφῶν no contexto militar e fraterno.
- source_word: μὴ καταλίπωμεν αἰτίαν τῇ δόξῃ ἡμῶν
  choice: não deixemos motivo de desonra para a nossa glória
  rationale: αἰτία é entendido como motivo ou fundamento de censura; “desonra” explicita a polaridade negativa exigida pelo contexto, enquanto “glória” conserva o vínculo lexical com δόξα.
theological_decisions:
- issue: Alcance de ἀδελφῶν
  choice: irmãos
  alternative: compatriotas
  rationale: O termo grego é masculino plural e, neste cenário de guerra, pode abranger os companheiros ou o povo judeu; “irmãos” preserva a forma e a tensão familiar-comunitária do original.
- issue: Sentido de δόξα no contexto de honra e vergonha
  choice: glória
  alternative: honra ou reputação
  rationale: Embora o contexto favoreça honra ou reputação, “glória” preserva a amplitude lexical de δόξα; uma nota registra os sentidos contextuais possíveis.
- issue: Valor temporal de ἤγγικεν
  choice: Chegou
  alternative: aproximou-se
  rationale: O perfeito indica que o momento decisivo se tornou iminente ou presente. “Chegou” é idiomático e não identifica explicitamente esse momento com a morte, embora o contexto a sugira.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e compreensão internacional. A pontuação destaca que “fugir deles” explica “tal coisa”. O texto conserva “irmãos” e “glória”, mas evita construções excessivamente literais ou arcaicas.
