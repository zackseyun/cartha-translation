  yaml_path: translation/deuterocanon/1_maccabees/009/036.yaml
  text: And the sons of Jambri came out from Medaba[a], and they seized John and everything he had, and went away with them.
translation:
  language: pt
  text: Então os filhos de Jambri saíram de Medaba, capturaram João e tudo o que ele possuía, e foram embora levando-os consigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram embora, levando João e todos os seus bens”. O grego diz literalmente “foram embora tendo-os”, retomando João e tudo o que ele possuía.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰαμβρεὶ
  choice: os filhos de Jambri
  rationale: Mantém a expressão grega e translitera o nome próprio; “filhos” pode designar os descendentes ou membros do clã de Jambri, sem limitar necessariamente a referência aos filhos imediatos.
- source_word: ἐκ Μηδαβά
  choice: de Medaba
  rationale: Expressa de modo natural o movimento para fora ou a procedência indicado por ἐκ, preservando o topônimo transliterado.
- source_word: συνέλαβον
  choice: capturaram
  rationale: No contexto hostil, comunica que João foi dominado e levado, sem sugerir o procedimento judicial normalmente associado a “prenderam”.
- source_word: Ἰωάνην
  choice: João
  rationale: Emprega a forma portuguesa convencional do nome grego Ἰωάνης.
- source_word: πάντα ὅσα εἶχεν
  choice: tudo o que ele possuía
  rationale: Preserva o alcance total da expressão e soa natural e digno em português.
- source_word: ἀπῆλθον ἔχοντες
  choice: foram embora levando-os consigo
  rationale: Explicita de maneira idiomática o particípio conciso ἔχοντες. O pronome plural retoma coletivamente João e tudo o que ele possuía, sem reduzir a referência apenas aos bens.
