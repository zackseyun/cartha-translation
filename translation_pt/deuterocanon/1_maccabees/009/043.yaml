  text: And Bacchides heard[a], and on the day of the Sabbaths he came as far as the banks of the Jordan with a great force.
translation:
  language: pt
  text: E Báquides soube disso e, no dia de sábado[a], chegou até as margens do Jordão com uma grande força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “no dia dos sábados”, expressão idiomática do grego judaico que significa “no dia de sábado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube disso
  rationale: Neste contexto narrativo, o aoristo de ἀκούω indica que Báquides recebeu a notícia do acontecimento anterior. “Soube disso” é natural em português e explicita apenas o referente contextual implícito.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: no dia de sábado
  rationale: A expressão plural é um idiomatismo do grego judaico que designa o sábado. A formulação escolhida comunica esse sentido com clareza em português moderno.
- source_word: ἕως τῶν κρηπῖδων τοῦ Ἰορδάνου
  choice: até as margens do Jordão
  rationale: κρηπίς pode indicar base, borda ou margem; no contexto geográfico, refere-se às margens do rio.
- source_word: ἐν δυνάμει πολλῇ
  choice: com uma grande força
  rationale: δύναμις tem aqui sentido militar. “Grande força” preserva essa referência sem especificá-la além do que diz o grego, como faria “grande exército”.
- source_word: Βακχίδης
  choice: Báquides
  rationale: Transliteração portuguesa tradicional e inteligível do nome próprio grego, com acento para indicar a pronúncia.
