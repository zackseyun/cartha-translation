base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/054.yaml
  text: And in the one hundred and fifty-third year[a], in the second month, Alcimus ordered the wall of the inner court of the sanctuary to be torn down, and he tore down the works of the prophets[b], and began to tear it down.
translation:
  language: pt
  text: 'No ano cento e cinquenta e três, no segundo mês, Alcimo ordenou que fosse derrubado o muro do pátio interior do santuário. Ele derrubou as obras dos profetas[a] e deu início à demolição.


    [a] A expressão “as obras dos profetas” traduz literalmente o grego. Pode se referir a construções ou restaurações associadas aos profetas, mas o texto não especifica.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “as obras dos profetas” traduz literalmente o grego. Pode se referir a construções ou restaurações associadas aos profetas, mas o texto não especifica.
    reason: Preserva e explica uma expressão historicamente ambígua sem resolver seu referente por conjectura.
lexical_decisions:
- source_word: ἐν ἔτει τρίτῳ καὶ πεντηκοστῷ καὶ ἑκατοστῷ
  choice: No ano cento e cinquenta e três
  rationale: Reproduz de modo natural em português a data expressa no grego por numerais aditivos, sem acrescentar ao texto a identificação da era cronológica.
- source_word: τῷ μηνὶ τῷ δευτέρῳ
  choice: no segundo mês
  rationale: Tradução direta e idiomática do dativo temporal.
- source_word: ἐπέταξεν
  choice: ordenou
  rationale: Expressa de maneira concisa a emissão de uma ordem.
- source_word: καθελεῖν
  choice: que fosse derrubado
  rationale: A construção passiva é natural em português depois de “ordenou” e mantém o muro como objeto da demolição.
- source_word: τὸ τεῖχος
  choice: o muro
  rationale: “Muro” comunica melhor que “parede” a ideia de uma estrutura delimitadora de um recinto.
- source_word: τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: do pátio interior do santuário
  rationale: “Pátio interior” traduz com clareza αὐλή...ἐσωτέρα, e “santuário” comunica naturalmente o espaço sagrado indicado por τῶν ἁγίων.
- source_word: καθεῖλεν
  choice: derrubou
  rationale: Mantém a repetição do verbo de demolição presente no grego.
- source_word: τὰ ἔργα τῶν προφητῶν
  choice: as obras dos profetas
  rationale: Preserva a formulação deliberadamente opaca do grego, sem identificar de forma especulativa quais estruturas estavam em vista.
- source_word: ἐνήρξατο τοῦ καθαιρεῖν
  choice: deu início à demolição
  rationale: Expressa naturalmente o começo da ação e evita introduzir um pronome cujo referente o grego não explicita.
theological_decisions:
- issue: Topografia do templo em τῆς αὐλῆς τῶν ἁγίων τῆς ἐσωτέρας
  choice: o pátio interior do santuário
  alternative: o átrio interior do lugar santo
  rationale: A opção escolhida é clara para leitores modernos e preserva a referência geral ao espaço sagrado sem impor uma terminologia técnica posterior.
- issue: Sentido histórico de τὰ ἔργα τῶν προφητῶν
  choice: as obras dos profetas
  alternative: as construções feitas pelos profetas
  rationale: Como o referente histórico não é explicado, a tradução conserva a ambiguidade do original, e a nota apresenta uma possível compreensão sem incorporá-la ao texto.
- issue: Objeto implícito na cláusula final ἐνήρξατο τοῦ καθαιρεῖν
  choice: deu início à demolição
  alternative: começou a derrubá-lo
  rationale: O grego não declara o objeto nessa cláusula. Evitar “-lo” impede que a tradução identifique silenciosamente o muro como referente exclusivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “pátio” em vez do mais técnico “átrio”. A pontuação divide o longo encadeamento grego em duas frases para melhorar a legibilidade sem alterar a sequência dos acontecimentos.
