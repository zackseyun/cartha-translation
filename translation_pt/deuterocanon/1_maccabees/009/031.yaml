  text: And Jonathan took up the leadership at that time, and arose in place of Judas his brother.
translation:
  language: pt
  text: Naquele tempo, Jônatas assumiu a liderança e se levantou no lugar de seu irmão Judas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: assumiu
  rationale: O médio de ἐπιδέχομαι indica aqui aceitar ou tomar para si uma função; “assumiu” expressa naturalmente a entrada de Jônatas na liderança.
- source_word: ἡγεσίαν
  choice: a liderança
  rationale: ἡγεσία designa liderança ou comando. “A liderança” se ajusta ao contexto de sucessão sem sugerir indevidamente um governo monárquico.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: Naquele tempo
  rationale: Equivalente idiomático e claro da expressão temporal grega, preservando o tom narrativo.
- source_word: ἀνέστη
  choice: se levantou
  rationale: Mantém a imagem de ἀνίστημι e, no contexto, sugere que Jônatas se apresentou para ocupar a posição deixada pelo irmão.
- source_word: ἀντί
  choice: no lugar de
  rationale: Comunica substituição ou sucessão, sem acrescentar ideia de oposição.
- source_word: Ἰούδου
  choice: Judas
  rationale: Forma tradicional em português para o nome grego Ἰούδας neste livro, distinguindo-se do nome do livro de Judá e acompanhando o uso corrente em 1 Macabeus.
