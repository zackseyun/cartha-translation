base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/007.yaml
  text: And Judas saw that his camp was failing, because the battle was pressing hard on him; and he was crushed in heart, because he had no time to gather them together.
translation:
  language: pt
  text: Judas viu que seu acampamento estava cedendo[a], pois a batalha o pressionava duramente; e ficou com o coração esmagado, porque não tinha tempo para reuni-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção grega depois de “Judas viu” é concisa e um tanto elíptica. A tradução a entende no sentido de que Judas percebeu que suas próprias forças estavam cedendo sob a pressão do combate.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβολὴ
  choice: acampamento
  rationale: Em contexto militar, o termo pode designar tanto o acampamento quanto a força acampada. “Acampamento” preserva a imagem concreta e permite que, pelo contexto, se entenda a referência às tropas de Judas.
- source_word: ὅτι ἡ παρεμβολὴ αὐτοῦ
  choice: que seu acampamento estava cedendo
  rationale: O grego transmitido é conciso e elíptico, sem predicado expresso depois de “seu acampamento”. À luz da pressão da batalha, “estava cedendo” comunica de modo natural a provável ideia de enfraquecimento ou recuo da força de Judas, sem definir além do necessário como isso ocorreu.
- source_word: ὁ πόλεμος ἔθλιβεν αὐτόν
  choice: a batalha o pressionava duramente
  rationale: Embora πόλεμος também possa significar “guerra”, o combate imediato favorece “batalha”. O imperfeito ἔθλιβεν indica pressão contínua e intensa, bem expressa por “pressionava duramente”.
- source_word: συνετρίβη τῇ καρδίᾳ
  choice: ficou com o coração esmagado
  rationale: A formulação mantém a metáfora forte do verbo passivo e a referência explícita ao coração, em português digno e compreensível.
- source_word: καιρὸν
  choice: tempo
  rationale: Neste contexto de urgência militar, “tempo” é a expressão portuguesa mais natural, embora o termo também possa envolver a ideia de ocasião ou oportunidade.
- source_word: συναγαγεῖν αὐτούς
  choice: reuni-los
  rationale: Traduz diretamente a ideia de ajuntar ou congregar as pessoas anteriormente mencionadas, sem acrescentar a noção mais específica de reorganização militar contida em “reagrupar”.
