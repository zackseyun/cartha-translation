  yaml_path: translation/deuterocanon/1_maccabees/009/071.yaml
  text: And he accepted[a], and did according to his words, and swore to him not to seek harm against him all the days of his life.
translation:
  language: pt
  text: Ele aceitou, agiu conforme as palavras dele e lhe jurou que não procuraria fazer-lhe mal[a] durante todos os dias da sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “buscar o mal contra ele”.'
    reason: Registra a formulação mais literal de ἐκζητῆσαι αὐτῷ κακόν, enquanto o texto principal usa português mais natural.
lexical_decisions:
- source_word: ἀπεδέξατο
  choice: aceitou
  rationale: O verbo médio indica que ele aceitou a proposta ou as condições mencionadas no contexto; “aceitou” é natural e não acrescenta um objeto ausente no grego.
- source_word: ἐποίησεν κατὰ τοὺς λόγους αὐτοῦ
  choice: agiu conforme as palavras dele
  rationale: Expressa de modo claro que sua conduta correspondeu ao que o outro havia dito, mantendo a estrutura e a referência pronominal do grego.
- source_word: ὤμοσεν αὐτῷ
  choice: lhe jurou
  rationale: Preserva tanto a solenidade do juramento quanto o destinatário indicado pelo dativo.
- source_word: μὴ ἐκζητῆσαι αὐτῷ κακὸν
  choice: que não procuraria fazer-lhe mal
  rationale: No contexto, a expressão significa buscar ou intentar o mal de alguém. A formulação escolhida é idiomática em português e conserva a ideia de intenção hostil.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ
  choice: durante todos os dias da sua vida
  rationale: Mantém a expressão temporal enfática e a cadência bíblica, sem resolver a possível ambiguidade do pronome final.
theological_decisions:
- issue: Referente de αὐτοῦ em τῆς ζωῆς αὐτοῦ
  choice: Manter a expressão pronominal “da sua vida”
  alternative: Explicitar “da própria vida dele” ou nomear a pessoa
  rationale: O grego não elimina formalmente toda ambiguidade quanto ao referente do pronome; a tradução evita impor uma identificação não explicitada no versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição de pronomes reflete o texto grego e preserva suas referências sem inserir nomes interpretativos.
