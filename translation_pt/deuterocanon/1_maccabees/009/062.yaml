base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/062.yaml
  text: And Jonathan and Simon and those with them withdrew to Beth-basi in the wilderness[b][a], and rebuilt its ruins and fortified it.
translation:
  language: pt
  text: Jônatas, Simão e os que estavam com ele[a] retiraram-se para Bet-Basi, no deserto, reconstruíram o que nela havia sido derrubado[b] e a fortificaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «os que estavam com ele».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «restauraram suas ruínas» ou «reedificaram as partes dela que haviam sido derrubadas».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξεχώρησεν
  choice: retiraram-se
  rationale: O verbo indica afastar-se ou retirar-se. No contexto de conflito, «retiraram-se» comunica o movimento sem sugerir necessariamente fuga em pânico. O plural é natural em português diante do sujeito composto, embora o grego empregue o singular.
- source_word: οἱ μετʼ αὐτοῦ
  choice: os que estavam com ele
  rationale: Mantém o singular αὐτοῦ do grego e deixa aberta a referência mais imediata a Jônatas, sem transformar explicitamente o grupo em acompanhantes de ambos os irmãos.
- source_word: Βεθβασί
  choice: Bet-Basi
  rationale: O topônimo é transliterado; o hífen torna seus elementos mais legíveis em português.
- source_word: τὴν ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: A expressão localiza Bet-Basi. «Deserto» é a forma bíblica corrente e natural em português para ἔρημος neste contexto.
- source_word: ᾠκοδόμησεν τὰ καθηρημένα αὐτῆς
  choice: reconstruíram o que nela havia sido derrubado
  rationale: A formulação preserva o sentido concreto de edificar novamente aquilo que fora derrubado, sem reduzir necessariamente a expressão a «ruínas».
- source_word: ἐστερέωσεν
  choice: a fortificaram
  rationale: No contexto militar, o fortalecimento da localidade diz respeito naturalmente às suas defesas; «fortificaram» expressa isso com clareza.
