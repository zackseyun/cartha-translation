translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O sujeito composto pede verbos no plural em português; o grego traz verbos no singular, uma construção possível quando o verbo antecede um sujeito composto e que também pode destacar Jônatas. A tradução evita introduzir um pronome que resolva essa nuance de modo indevido.
