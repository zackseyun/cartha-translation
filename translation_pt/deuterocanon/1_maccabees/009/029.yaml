  text: Since your brother Judas has died[a], and there is no man like him to go out against the enemies and Bacchides, and those who hate our nation,
translation:
  language: pt
  text: Desde que seu irmão Judas morreu, não há homem semelhante a ele para sair contra os inimigos, contra Báquides e contra os que odeiam nossa nação[a],
  philosophy: optimal-equivalence
  footnotes:
