    text: 'O grego traz aqui uma construção difícil, literalmente “e entre os que odeiam nossa nação”. A tradução apresenta o sentido que parece mais provável no contexto: outro grupo hostil a ser enfrentado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀφʼ οὗ
  choice: Desde que
  rationale: Expressa de modo natural em português a relação temporal, com possível nuance circunstancial, introduzida pela locução grega.
- source_word: ὁ ἀδελφός σου Ἰούδας
  choice: seu irmão Judas
  rationale: Reproduz diretamente o parentesco, o possessivo e a forma tradicional do nome em português.
- source_word: τετελεύτηκεν
  choice: morreu
  rationale: Comunica com clareza a morte consumada e sua consequência presente; o pretérito perfeito é idiomático em português neste contexto narrativo.
- source_word: ἀνὴρ ὅμοιος αὐτῷ
  choice: homem semelhante a ele
  rationale: Mantém o substantivo masculino ἀνήρ e a comparação explícita, em registro digno e natural.
- source_word: οὐκ ἔστιν
  choice: não há
  rationale: É a forma existencial corrente e precisa em português.
- source_word: ἐξελθεῖν
  choice: sair
  rationale: Preserva a imagem do grego, que no contexto tem sentido de sair para enfrentar militarmente alguém, sem explicitar além do texto.
- source_word: πρὸς τοὺς ἐχθροὺς καὶ Βακχίδην
  choice: contra os inimigos, contra Báquides
  rationale: πρός indica oposição no contexto militar. A repetição de “contra” evita que Báquides pareça aliado dos inimigos em vez de outro alvo do confronto.
- source_word: καὶ ἐν τοῖς ἐχθαίνουσιν τοῦ ἔθνους ἡμῶν
  choice: e contra os que odeiam nossa nação
  rationale: Embora o texto transmitido tenha literalmente “e entre/nos que odeiam”, a construção é sintaticamente difícil. O contexto indica outro grupo hostil a ser enfrentado; a nota registra a forma grega e preserva a incerteza textual.
- source_word: ἔθνους ἡμῶν
  choice: nossa nação
  rationale: Neste contexto, ἔθνος designa o povo judeu como coletividade nacional e político-religiosa; “nação” conserva essa força.
theological_decisions:
- issue: Tradução de ἀνήρ na descrição de um líder militar
  choice: homem
  alternative: alguém
  rationale: O grego emprega especificamente o substantivo masculino ἀνήρ. A tradução mantém essa especificidade sem ampliá-la em formulação doutrinária.
- issue: Sentido coletivo de ἔθνος ἡμῶν
  choice: nossa nação
  alternative: nosso povo
  rationale: “Nação” preserva a dimensão coletiva e político-religiosa do termo em 1 Macabeus, enquanto “povo” seria possível, mas menos específico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva a estrutura de uma oração ainda não concluída mediante a vírgula final, de acordo com o versículo-fonte. O nome Βακχίδης é vertido pela forma portuguesa tradicional “Báquides”.
