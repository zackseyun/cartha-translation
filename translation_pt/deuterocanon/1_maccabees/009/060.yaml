base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/060.yaml
  text: And he refrained from coming with a large force[a], and secretly sent letters to all his allies in Judea, so that they might seize Jonathan and those with him; but they were not able[b], because their plan became known to them.
translation:
  language: pt
  text: E ele desistiu de vir com uma grande força e enviou secretamente cartas a todos os seus aliados na Judeia, para que capturassem Jônatas e os que estavam com ele. Mas ele não conseguiu[a], pois o plano deles se tornou conhecido por Jônatas e pelos que estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo grego está no singular: “ele não conseguiu”. Também pode ser entendido em sentido coletivo, como “eles não conseguiram”, referindo-se aos conspiradores.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἀπῆρεν τοῦ ἐλθεῖν
  choice: se pôs a caminho para vir
  rationale: ἀπαίρω, neste contexto narrativo, indica partir ou pôr-se a caminho; o infinitivo τοῦ ἐλθεῖν expressa a vinda pretendida. A tradução segue o grego e o contexto imediato, em vez de entender a expressão como desistência.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: com uma grande força militar
  rationale: δύναμις designa aqui contingente ou poderio militar. “Força militar” é claro em português e evita especificar necessariamente um exército formal.
- source_word: ἐπιστολὰς λάθρᾳ
  choice: enviou secretamente cartas
  rationale: λάθρᾳ caracteriza o envio como oculto ou clandestino; a posição do advérbio produz uma frase natural em português.
- source_word: πᾶσι τοῖς συμμάχοις αὐτοῦ τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: a todos os seus aliados na Judeia
  rationale: σύμμαχοι tem sentido político-militar de “aliados”, e a construção locativa identifica os que se encontravam na Judeia.
- source_word: ὅπως συλλάβωσι
  choice: para que prendessem
  rationale: συλλαμβάνω pode significar agarrar, capturar ou prender. No contexto de uma ação planejada contra Jônatas e seus homens, “prender” é corrente e não exige um procedimento judicial formal.
- source_word: τοὺς σὺν αὐτῷ
  choice: os que estavam com ele
  rationale: A expressão grega é geral; esta formulação preserva essa generalidade sem acrescentar uma relação específica entre Jônatas e seus acompanhantes.
- source_word: οὐκ ἠδύνατο
  choice: ele não conseguiu
  rationale: O verbo grego está no singular e retoma naturalmente o principal agente da narrativa. A nota registra que a impossibilidade também pode ser entendida coletivamente, em referência aos envolvidos na conspiração.
- source_word: ἔγνωσθη αὐτοῖς ἡ βουλὴ αὐτῶν
  choice: estes ficaram sabendo do plano deles
  rationale: 'A formulação torna legíveis os dois grupos indicados pelos pronomes comprimidos do grego: os alvos tomaram conhecimento do plano dos conspiradores, sem alterar o conteúdo da cláusula.'
