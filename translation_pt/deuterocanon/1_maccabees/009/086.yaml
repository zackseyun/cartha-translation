  yaml_path: translation/deuterocanon/1_maccabees/009/086.yaml
  text: From there Jonathan moved on and encamped at Ashkelon[a], and those from the city came out to meet him with great honor.
translation:
  language: pt
  text: Dali, Jônatas partiu e acampou em Ascalom. Os habitantes da cidade saíram ao encontro dele com grande honra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha da fonte grega na edição de Swete está interrompida depois de καὶ ἐπέ-, mas a oração até “com grande honra” está completa e permite uma tradução segura deste trecho do versículo.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: Dali
  rationale: Expressa de modo natural e conciso a transição espacial indicada pelo grego.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: Conserva o sentido de estabelecer acampamento e se ajusta ao contexto militar, sem recorrer a uma forma arcaica.
- source_word: εἰς Ἀσκάλωνα
  choice: em Ascalom
  rationale: Embora εἰς costume indicar movimento para dentro ou em direção a algo, com o verbo 'acampar' o português idiomático pede 'em'.
- source_word: ἐξῆλθον οἱ ἐκ τῆς πόλεως
  choice: Os habitantes da cidade saíram
  rationale: Torna clara em português a expressão grega relativamente indefinida, sem acrescentar uma categoria social mais específica.
- source_word: εἰς συνάντησιν αὐτῷ
  choice: ao encontro dele
  rationale: É a formulação narrativa natural para a finalidade expressa pela locução grega.
- source_word: ἐν δόξῃ μεγάλῃ
  choice: e o receberam com grandes honras
  rationale: Neste contexto, δόξα descreve uma recepção pública honrosa e esplêndida. A explicitação de 'receberam' produz português natural e comunica o valor social da expressão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Ascalom' segue a forma tradicional portuguesa do topônimo. A tradução evita literalismos como 'em grande glória', que obscureceriam o sentido social da recepção.
