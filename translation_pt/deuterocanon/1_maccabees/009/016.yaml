base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/016.yaml
  text: And those on the left wing[a], seeing that the right wing had been crushed, turned back at the heels of Judas and those with him[b], from behind.
translation:
  language: pt
  text: Os da ala esquerda[a], ao verem que a ala direita tinha sido destroçada, deram meia-volta e foram no encalço de Judas e dos que estavam com ele, por trás.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “chifre esquerdo” e “chifre direito”; no uso militar grego, a expressão designa as alas ou os flancos esquerdo e direito de um exército.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega diz, literalmente, que “voltaram-se aos calcanhares de Judas e dos que estavam com ele, por trás”; trata-se de uma imagem de perseguição próxima por trás.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριστερὸν κέρας / δεξιὸν κέρας
  choice: ala esquerda / ala direita
  rationale: Embora κέρας signifique literalmente “chifre”, no contexto militar designa uma ala ou um flanco do exército. “Ala” comunica com naturalidade a formação de batalha e preserva o paralelismo.
- source_word: συνετρίβη
  choice: tinha sido destroçada
  rationale: Mantém a força do verbo, que expressa quebrar ou esmagar, bem como sua forma passiva, sem explicitar interpretativamente uma debandada.
- source_word: ἐπέστρεψαν
  choice: mudaram de direção
  rationale: No contexto da movimentação militar, expressa claramente uma reversão ou mudança de movimento sem sugerir necessariamente um retorno ao ponto de partida.
- source_word: κατὰ πόδας
  choice: foram no encalço
  rationale: O idioma, literalmente relacionado aos pés ou calcanhares, indica perseguição próxima. “Ir no encalço” é uma expressão portuguesa natural que conserva esse sentido.
- source_word: ἐκ τῶν ὄπισθεν
  choice: pela retaguarda
  rationale: Indica que a aproximação ou perseguição ocorreu por trás de Judas e seus companheiros; “pela retaguarda” preserva o sentido militar.
- source_word: τῶν μετʼ αὐτοῦ
  choice: dos que estavam com ele
  rationale: Reproduz a referência ampla aos acompanhantes de Judas sem acrescentar a especificação “seus soldados” ou “seus homens”.
