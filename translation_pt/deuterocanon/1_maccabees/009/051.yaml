  text: And they stationed a garrison in them to be hostile toward Israel[a].
translation:
  language: pt
  text: E estabeleceram neles uma guarnição para agir com hostilidade contra Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para hostilizar Israel”. O infinitivo grego expressa a finalidade para a qual a guarnição foi estabelecida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: estabeleceram
  rationale: No contexto militar, o verbo indica colocar ou instalar uma força em determinado local; “estabeleceram” é natural e mantém o sentido de uma disposição deliberada.
- source_word: φρουράν
  choice: uma guarnição
  rationale: O substantivo designa aqui uma força militar encarregada de guardar lugares fortificados; “guarnição” é mais preciso do que o termo genérico “guarda”.
- source_word: ἐν αὐτοῖς
  choice: neles
  rationale: O pronome retoma os lugares mencionados no contexto anterior. “Neles” preserva essa referência sem especificá-la além do que o versículo declara.
- source_word: τοῦ ἐχθραίνειν
  choice: para agir com hostilidade
  rationale: O infinitivo articular com τοῦ expressa a finalidade da instalação da guarnição. A formulação comunica ação hostil sem restringi-la a assédio ou guerra aberta.
- source_word: τῷ Ἰσραήλ
  choice: contra Israel
  rationale: O dativo assinala o alvo da hostilidade; em português, “contra Israel” é a construção mais natural e direta.
