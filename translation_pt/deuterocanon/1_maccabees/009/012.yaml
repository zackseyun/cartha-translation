base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/012.yaml
  text: But Bacchides was on the right wing[a], and the phalanx came near from both sides, and they were sounding the trumpets[b], and those with Judas also sounded the trumpets, they too.
translation:
  language: pt
  text: Báquides, porém, estava na ala direita[a], e a falange aproximou-se pelos dois lados. Eles faziam soar as trombetas, e os que estavam com Judas, também eles, tocaram as trombetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «no chifre direito»; trata-se de uma expressão militar para a ala ou o flanco direito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βακχίδης
  choice: Báquides
  rationale: Transliteração tradicional e reconhecível do nome grego em português.
- source_word: ἐν τῷ δεξιᾷ κέρατι
  choice: na ala direita
  rationale: Embora κέρας signifique literalmente «chifre», no contexto militar designa a ala ou o flanco de uma formação; «ala direita» é claro e idiomático.
- source_word: ἤγγισεν
  choice: se aproximou
  rationale: Expressa diretamente o movimento indicado pelo aoristo de ἐγγίζω, sem acrescentar a ideia de ataque.
- source_word: ἡ φάλαγξ
  choice: a falange
  rationale: Mantém o termo militar específico e a imagem da formação de combate.
- source_word: ἐκ τῶν δύο μερῶν
  choice: dos dois lados
  rationale: Representa naturalmente a procedência ou aproximação a partir de duas partes ou direções, preservando a concisão do grego.
- source_word: ἐφώνουν ταῖς σάλπιγξιν
  choice: faziam soar as trombetas
  rationale: O imperfeito é representado por uma ação em curso, enquanto o dativo instrumental é expresso naturalmente em português.
- source_word: οἱ παρὰ Ἰούδαν
  choice: os que estavam com Judas
  rationale: Conserva a formulação relacional do grego sem especificar além do texto se eram soldados, seguidores ou acompanhantes.
- source_word: ἐσάλπισαν
  choice: tocaram as trombetas
  rationale: Traduz o verbo específico para tocar ou fazer soar uma trombeta e conserva o contraste aspectual com o imperfeito anterior.
- source_word: καὶ αὐτοὶ
  choice: também eles
  rationale: Preserva a ênfase de que o grupo de Judas igualmente respondeu com suas trombetas, sem eliminar o pronome intensivo.
