  text: He pursued after him as far as Azotus[a], and the camps joined battle behind him[b]. And Apollonius left behind a thousand horsemen
translation:
  language: pt
  text: Ele o perseguiu até Azoto, e as forças militares travaram batalha atrás dele.[a] E Apolônio deixou para trás mil cavaleiros[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “os acampamentos se juntaram atrás dele para a batalha”. A expressão provavelmente se refere a forças militares que entraram em combate na retaguarda dele.'
    reason: lexical_alternative
  - marker: b
    text: O texto grego fornecido termina com “E Apolônio deixou para trás mil cavaleiros”, formando uma oração aparentemente incompleta, que provavelmente continua no versículo seguinte.
    reason: textual_variant
lexical_decisions:
- source_word: δίωξεν ὀπίσω αὐτοῦ
  choice: Ele o perseguiu
  rationale: O verbo διώκω, neste contexto militar, indica perseguição hostil; o pronome preserva o referente masculino singular do grego sem explicitação indevida.
- source_word: εἰς Ἄζωτον
  choice: até Azoto
  rationale: Depois de um verbo de perseguição, εἰς pode indicar o limite alcançado; “até” expressa naturalmente essa extensão em português.
- source_word: συνῆψαν ... εἰς πόλεμον
  choice: travaram batalha
  rationale: No contexto militar, συνάπτω com εἰς πόλεμον descreve o início ou engajamento no combate. “Travaram batalha” é claro e idiomático.
- source_word: αἱ παρεμβολαί
  choice: as forças militares
  rationale: Embora o sentido literal seja “os acampamentos”, o plural pode designar metonimicamente os contingentes ou exércitos acampados. A escolha comunica o sentido provável, enquanto a nota preserva a forma incomum do grego.
- source_word: ὀπίσω αὐτοῦ
  choice: atrás dele
  rationale: Nesta segunda ocorrência, a expressão tem sentido espacial e conserva a ambiguidade sobre a disposição exata das forças na retaguarda.
- source_word: ἀπέλειπεν
  choice: deixou para trás
  rationale: A forma verbal indica que Apolônio deixou uma parte da força na retaguarda ou separada, sem justificar uma especificação maior como “posicionou” ou “manteve em reserva”.
- source_word: χιλίαν ἵππον
  choice: mil cavaleiros
  rationale: Em enumeração militar, ἵππος pode designar metonimicamente tropas montadas. “Mil cavaleiros” é natural e preciso em português.
