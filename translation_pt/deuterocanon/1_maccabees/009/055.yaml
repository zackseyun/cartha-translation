base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/055.yaml
  text: At that time Alcimus was struck down[a], and his works were hindered; his mouth was stopped up, and he was paralyzed, and he could no longer speak a word or give orders concerning his house.
translation:
  language: pt
  text: Naquele tempo, Alcimo foi atingido, e suas atividades foram impedidas. Sua boca se fechou, e ele ficou paralisado; já não conseguia dizer uma palavra nem dar instruções a respeito de sua casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua família”, “seus assuntos domésticos” ou “seus bens”. O grego “casa” (οἶκος) pode se referir a todo o âmbito doméstico, e não apenas ao edifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγη
  choice: foi atingido
  rationale: Preserva a ideia de um golpe ou aflição súbita e incapacitante sem especificar causa divina nem diagnóstico médico.
- source_word: ἐνεποδίσθη τὰ ἔργα αὐτοῦ
  choice: suas atividades foram impedidas
  rationale: No contexto, ἔργα se refere de modo amplo às ações ou iniciativas em curso; a forma passiva indica que foram obstadas.
- source_word: ἀπεφράγη τὸ στόμα αὐτοῦ
  choice: sua boca se fechou
  rationale: Mantém a imagem física concreta do grego em português natural, sem reduzir a expressão a uma abstração sobre a fala.
- source_word: παρελύθη
  choice: ficou paralisado
  rationale: Expressa o sentido comum de παραλύω e concorda com a incapacidade física e de fala descrita ao redor.
- source_word: οὐκ ἠδύνατο ἔτι λαλῆσαι λόγον
  choice: já não conseguia dizer uma palavra
  rationale: Reproduz naturalmente a expressão grega e inclui o valor temporal de ἔτι.
- source_word: ἐντείλασθαι
  choice: dar instruções
  rationale: Transmite o ato de ordenar ou determinar algo, com boa adequação ao contexto doméstico-administrativo.
- source_word: περὶ τοῦ οἴκου αὐτοῦ
  choice: a respeito de sua casa
  rationale: Conserva o termo abrangente οἶκος, que pode indicar casa, família, pessoal doméstico ou conjunto de assuntos ligados ao lar; a nota registra a amplitude.
theological_decisions:
- issue: Natureza da aflição de Alcimo
  choice: Descrever uma aflição súbita e incapacitante sem identificar seu agente ou natureza clínica.
  alternative: Explicitar que foi um juízo divino ou diagnosticar um derrame ou ataque.
  rationale: A sequência de passivos gregos descreve o ocorrido, mas o versículo não nomeia Deus como agente nem fornece diagnóstico médico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação organiza a longa sequência grega sem eliminar sua progressão cumulativa. “Alcimo” segue a forma tradicional portuguesa do nome.
