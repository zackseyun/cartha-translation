revisions:
- from: Demétrio soube que Nicanor e suas forças haviam travado guerra. Então voltou a enviar Báquides e Álcimo à terra de Judá, acompanhados pela ala direita do exército.[a]
  to: Demétrio soube que Nicanor e as forças dele haviam travado guerra, e enviou, pela segunda vez, Báquides e Álcimo à terra de Judá, e, com eles, a ala direita.[a]
  rationale: A revisão explicita «pela segunda vez», conforme ἐκ δευτέρου, e reestrutura a última coordenação para refletir que a ala direita foi enviada com Báquides e Álcimo. Mantêm-se os nomes, a designação «terra de Judá», a amplitude de «forças» e a nota lexical sobre a metáfora militar.
