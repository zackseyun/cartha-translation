    issue: O numeral de ἐκ δευτέρου não está expresso.
    rationale: «Voltou a enviar» comunica repetição, mas o grego diz especificamente «pela segunda vez». A tradução deve preservar essa precisão quando ela pode ser expressa naturalmente.
  - severity: low
    issue: A formulação participial para a ala direita enfraquece a coordenação do original.
    rationale: O grego acrescenta «a ala direita com eles» como elemento coordenado do envio. «E, com eles, a ala direita» reproduz essa relação de modo mais direto sem alterar o sentido.
  revised_text: Demétrio soube que Nicanor e as forças dele haviam travado guerra, e enviou, pela segunda vez, Báquides e Álcimo à terra de Judá, e, com eles, a ala direita.[a]
