base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/001.yaml
  text: And Demetrius heard that Nicanor and his forces had made war[a], and he sent Bacchides and Alcimus into the land of Judah a second time, and the right wing with them.
translation:
  language: pt
  text: Demétrio soube que Nicanor e as forças dele haviam travado guerra, e enviou, pela segunda vez, Báquides e Álcimo à terra de Judá, e, com eles, a ala direita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «o chifre direito»; no uso militar, a expressão designa a ala ou o flanco direito do exército.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube
  rationale: No contexto de receber uma notícia, «soube» expressa naturalmente o aoristo ἤκουσεν sem acrescentar a ideia formal de um relatório oficial.
- source_word: ἐποίησεν ... πόλεμον
  choice: haviam travado guerra
  rationale: Reproduz o sentido do idioma grego «fazer guerra» em português corrente; o mais-que-perfeito composto esclarece que o combate precedeu a notícia recebida por Demétrio.
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: suas forças
  rationale: Mantém a amplitude militar de δυνάμεις sem especificar indevidamente uma unidade ou um exército formal.
- source_word: προσέθετο ... ἀποστεῖλαι / ἐκ δευτέρου
  choice: voltou a enviar
  rationale: A combinação idiomática indica a repetição do envio. «Voltou a enviar» é natural e preserva o sentido de uma nova ação, embora não expresse literalmente o numeral ordinal.
- source_word: γῆν Ἰούδα
  choice: terra de Judá
  rationale: Segue de perto a expressão geográfica grega, evitando substituí-la pelo nome regional convencional «Judeia».
- source_word: τὸ δεξιὸν κέρας
  choice: ala direita do exército
  rationale: κέρας significa literalmente «chifre», mas no uso militar designa uma ala ou flanco. A explicitação «do exército» torna a metáfora inteligível em português.
