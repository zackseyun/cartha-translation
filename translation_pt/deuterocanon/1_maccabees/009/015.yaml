  text: And the right wing was crushed before them[b][a], and he pursued after them as far as the mountain of Azotus.
translation:
  language: pt
  text: E a ala direita foi esmagada diante deles, e ele os perseguiu até o monte de Azoto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até a região montanhosa de Azoto». A expressão grega pode referir-se a um monte específico ou à região elevada associada a Azoto.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνετρίβη
  choice: foi esmagada
  rationale: O passivo de συντρίβω expressa ser quebrado ou esmagado; no contexto de batalha, «foi esmagada» preserva a força da imagem sem substituí-la por uma explicação como «foi derrotada».
- source_word: τὸ δεξιὸν κέρας
  choice: a ala direita
  rationale: Embora κέρας signifique literalmente «chifre», aqui é uma metáfora militar para um dos lados da formação; «ala direita» é a equivalência portuguesa mais natural.
- source_word: ἀπʼ αὐτῶν
  choice: diante deles
  rationale: No contexto da derrota em combate, ἀπό indica que a ala cedeu sob a pressão das forças adversárias; «diante deles» conserva essa relação sem forçar o sentido instrumental.
- source_word: ἔδωκεν ὀπίσω αὐτῶν
  choice: ele os perseguiu
  rationale: A expressão idiomática descreve a perseguição do inimigo em retirada. O singular «ele» preserva a forma verbal grega e provavelmente se refere a Judas como comandante.
- source_word: ἕως Ἀζώτου ὄρους
  choice: até a região montanhosa de Azoto
  rationale: A construção grega pode indicar tanto um monte específico como as terras altas associadas a Azoto. No contexto geográfico, «região montanhosa de Azoto» preserva essa possibilidade sem criar com segurança excessiva um nome próprio não inequívoco no grego.
