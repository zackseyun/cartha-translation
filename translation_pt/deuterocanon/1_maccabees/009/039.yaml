  yaml_path: translation/deuterocanon/1_maccabees/009/039.yaml
  text: And they lifted up their eyes and looked, and behold, a noisy procession and much baggage; and the bridegroom came out to meet them, with his friends and his brothers, with tambourines and musicians and many weapons.
translation:
  language: pt
  text: Então eles ergueram os olhos e viram, e eis que havia grande alvoroço e muita bagagem. O noivo, seus amigos e seus irmãos saíram ao encontro deles com tamborins, instrumentos musicais e muitas armas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θροῦς
  choice: cortejo ruidoso
  rationale: O substantivo indica ruído, alvoroço ou tumulto; no contexto da comitiva nupcial, «cortejo ruidoso» expressa tanto o som quanto a movimentação do grupo sem reduzir o termo apenas a «barulho».
- source_word: ἀποσκευή πολλή
  choice: muita bagagem
  rationale: ἀποσκευή designa bagagem, equipamento ou pertences transportados; «muita bagagem» é natural e preserva o sentido amplo.
- source_word: οἱ φίλοι αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: seus amigos e irmãos
  rationale: Mantém os dois grupos nomeados no grego, sem decidir se ἀδελφοί são irmãos de sangue ou parentes/companheiros em sentido mais amplo.
- source_word: τύμπανα
  choice: tamborins
  rationale: Refere-se a instrumentos de percussão de mão; «tamborins» é uma equivalência clara e adequada ao contexto festivo.
- source_word: μουσικά
  choice: instrumentos musicais
  rationale: O neutro plural substantivado pode indicar recursos ou instrumentos musicais; no contexto de uma comitiva com tamborins, «instrumentos musicais» oferece a leitura mais natural.
- source_word: ὅπλα πολλά
  choice: muitas armas
  rationale: ὅπλα pode significar armas ou equipamento bélico; «muitas armas» corresponde ao contexto armado da narrativa.
