  verdict: revise
  source_fidelity: 'O sentido geral está bem preservado: os agressores agem a partir da emboscada, há mortos e muitos feridos, os sobreviventes fogem para o monte, e os bens/equipamentos são tomados. Contudo, no português corrente, o pronome em «eles tomaram» pode retomar mais naturalmente «os restantes», produzindo uma ambiguidade de agente que não corresponde à progressão sintática grega, em que os emboscados são os que tomam os σκεύη.'
  naturalness: «Os restantes» é compreensível, mas «os que restaram» tem leitura mais imediata no português internacional com boa legibilidade brasileira. A explicitação de «os atacantes» no último membro elimina uma ambiguidade referencial indesejada sem alterar o conteúdo narrativo.
  terminology: «Monte» reproduz adequadamente o singular τὸ ὄρος. «Equipamento» é uma boa opção contextual para σκεύη; a nota mantém alternativas pertinentes. «Caíram feridos» preserva a indeterminação de τραυματίαι entre feridos e baixas.
