base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/040.yaml
  text: And they rose up against them from the ambush and killed them[a]; and many fell wounded, and the rest fled to the mountain[b], and they took all their equipment.
translation:
  language: pt
  text: Então saíram da emboscada, avançaram contra eles e os mataram. Muitos caíram feridos[a]; os que restaram fugiram para o monte, e os atacantes tomaram todo o equipamento deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Muitos caíram como baixas”. A palavra grega pode designar homens feridos ou, em sentido mais amplo, baixas de combate.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a bagagem deles” ou “todos os seus apetrechos”. O termo grego é amplo e pode indicar objetos, bagagem ou equipamento; neste contexto militar, refere-se provavelmente ao material que carregavam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν ἐπʼ αὐτοὺς ἀπὸ τοῦ ἐνέδρου
  choice: saíram da emboscada, avançaram contra eles
  rationale: Expressa naturalmente a saída repentina da posição oculta e a ação hostil indicada por ἐξανέστησαν ἐπʼ αὐτούς, sem reduzir toda a frase ao verbo interpretativo “atacaram”.
- source_word: ἀπέκτειναν αὐτούς
  choice: os mataram
  rationale: Tradução direta e atual do verbo comum para matar, mantendo o objeto pronominal do grego.
- source_word: ἔπεσαν τραυματίαι πολλοί
  choice: Muitos caíram feridos
  rationale: Preserva tanto a imagem de cair quanto o sentido primário de τραυματίαι como feridos, sem afirmar que todos morreram; a amplitude lexical é registrada em nota.
- source_word: οἱ ἐπίλοιποι
  choice: os restantes
  rationale: Designa de modo claro aqueles que não caíram e conseguiram fugir.
- source_word: ἔφυγον εἰς τὸ ὄρος
  choice: fugiram para o monte
  rationale: Mantém o singular e a referência topográfica do texto grego, evitando ampliar interpretativamente para uma região montanhosa.
- source_word: πάντα τὰ σκεύη αὐτῶν
  choice: todo o equipamento deles
  rationale: No contexto militar, σκεύη aponta de modo natural para apetrechos, bagagem ou equipamento; “equipamento” é claro e abrangente em português atual.
