  verdict: revise
  source_fidelity: O particípio aoristo πορευθέντες indica uma ação anterior («depois de partirem»), e συνεβουλεύσαντο αὐτῷ descreve deliberação ou conferência com ele. A versão proposta preserva a sequência, mas «aconselharam-se com ele» pode sugerir sobretudo que buscaram o conselho dele, enfraquecendo o aspecto de consulta conjunta expresso pelo grego.
  naturalness: «Depois de partirem» é mais idiomático e fluente do que «depois de irem» neste contexto narrativo. «Conferenciaram com ele» é claro, moderno e mantém o registro digno sem introduzir uma direção unilateral do aconselhamento.
  terminology: Não há termos teológicos nem nomes próprios neste versículo. «Conferenciaram com ele» representa adequadamente o sentido deliberativo de συνεβουλεύσαντο e conserva a relação expressa pelo dativo αὐτῷ.
  issues:
