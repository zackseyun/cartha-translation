    issue: Possível direcionalidade indevida em «aconselharam-se com ele».
    rationale: Em português, «aconselhar-se com alguém» frequentemente significa pedir ou receber conselho dessa pessoa. O grego, bem como o audit trail inglês, permite e favorece a noção mais recíproca de deliberar ou consultar em conjunto.
  - severity: low
    issue: «Depois de irem» é uma formulação pouco natural neste contexto.
    rationale: Embora gramatical, «depois de partirem» expressa de modo mais idiomático o deslocamento pressuposto por πορευθέντες, preservando a anterioridade do particípio.
