base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/023.yaml
  text: And it happened that after the death of Judas[a], the lawless emerged in all the territories of Israel[b], and all those who worked unrighteousness sprang up.
translation:
  language: pt
  text: Depois da morte de Judas, aconteceu que os transgressores da Lei[a] surgiram em todos os territórios de Israel, e despontaram todos os que praticavam a injustiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os que viviam sem lei». O adjetivo grego está empregado como substantivo no plural e caracteriza pessoas contrárias à Lei.
    reason: lexical_alternative
  - marker: b
    text: Ou «a iniquidade».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: aconteceu que
  rationale: Reproduz de modo natural em português a fórmula narrativa grega, sem recorrer ao arcaísmo «sucedeu que».
- source_word: τελευτήν
  choice: morte
  rationale: No contexto, o termo se refere claramente à morte de Judas, e não apenas a um fim abstrato.
- source_word: ἐξέκυψαν
  choice: surgiram
  rationale: Expressa o aparecimento dos transgressores e sugere que passaram a se manifestar abertamente, sem tornar excessivamente literal a imagem do verbo.
- source_word: οἱ ἄνομοι
  choice: os transgressores da Lei
  rationale: Mantém a ligação de ἄνομος com νόμος e comunica em português corrente a caracterização substantivada do grupo. A inicial maiúscula indica a Lei de Israel, conforme o contexto, sem inserir «homens» no texto.
- source_word: ὁρίοις
  choice: territórios
  rationale: Aqui o plural designa as áreas ou regiões de Israel, não somente suas linhas de fronteira.
- source_word: ἀνέτειλαν
  choice: despontaram
  rationale: Preserva a imagem vívida de algo que nasce ou aparece, além de formar um paralelo natural com «surgiram».
- source_word: οἱ ἐργαζόμενοι τὴν ἀδικίαν
  choice: todos os que praticavam a injustiça
  rationale: O imperfeito em português comunica a atividade característica e continuada expressa pelo particípio presente, com formulação natural.
- source_word: ἀδικίαν
  choice: injustiça
  rationale: É o equivalente direto e corrente, capaz de abranger tanto conduta moralmente errada quanto injustiça contra outros; «iniquidade» permanece uma alternativa possível.
theological_decisions:
- issue: Preservação da relação entre ἄνομοι e a Lei
  choice: os transgressores da Lei
  alternative: os perversos; os que vivem sem lei
  rationale: A escolha conserva a dimensão legal e pactual do termo grego, evitando reduzi-lo a uma descrição genérica de maldade.
- issue: Amplitude moral de ἀδικία
  choice: injustiça
  alternative: iniquidade; maldade
  rationale: «Injustiça» preserva a amplitude do grego sem decidir se a ênfase recai especificamente sobre culpa moral ou dano social; a nota registra a alternativa tradicional.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. «Lei» recebe inicial maiúscula por remeter à Lei de Israel. «Despontaram» mantém a metáfora do original sem soar arcaico.
