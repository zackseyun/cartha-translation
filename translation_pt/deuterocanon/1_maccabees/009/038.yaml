  text: And they remembered John their brother[a], and they went up and hid under the cover of the mountain.
translation:
  language: pt
  text: E eles se lembraram de João, seu irmão, subiram e se esconderam ao abrigo da montanha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sob a cobertura da montanha». A palavra grega pode indicar cobertura, abrigo ou proteção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: se lembraram de
  rationale: O aoristo de μιμνῄσκομαι indica que trouxeram João à memória. «Lembraram-se de» é direto, natural e não acrescenta uma intenção não expressa no grego.
- source_word: Ἰωάνου
  choice: João
  rationale: É a forma portuguesa tradicional e corrente do nome grego Ἰωάνης, aqui no genitivo.
- source_word: τοῦ ἀδελφοῦ αὐτῶν
  choice: seu irmão
  rationale: Identifica João como irmão deles; no contexto plural, «seu irmão» é claro e idiomático em português.
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Preserva de modo conciso o movimento ascendente expresso pelo verbo, sem especificar um destino que o texto não declara.
- source_word: ἐκρύβησαν
  choice: se esconderam
  rationale: A forma verbal, no contexto, descreve os próprios sujeitos ocultando-se; a construção pronominal é natural em português.
- source_word: ὑπὸ τὴν σκέπην
  choice: ao abrigo
  rationale: σκέπη pode indicar cobertura, abrigo ou proteção. «Ao abrigo» mantém a imagem protetora e produz uma expressão natural com «da montanha».
- source_word: τοῦ ὄρους
  choice: da montanha
  rationale: Traduz diretamente o substantivo singular articulado ὄρος, sem ampliar o referente para uma região montanhosa.
