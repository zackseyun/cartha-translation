  text: And there was great distress in Israel[a], such as had not been since the day when a prophet was no longer seen among them.
translation:
  language: pt
  text: E houve grande aflição em Israel, uma aflição como não havia ocorrido desde o dia em que já não se via profeta entre eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o dia em que nenhum profeta lhes apareceu”. O passivo grego traduzido por “se via” também pode ter o sentido de “apareceu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: houve
  rationale: A fórmula narrativa grega indica o surgimento de uma situação. “Houve” é natural em português e conserva o caráter eventivo sem a rigidez de “veio a existir”.
- source_word: θλίψις μεγάλη
  choice: grande aflição
  rationale: Expressa sofrimento e grave dificuldade coletiva. “Aflição” evita transformar o termo em uma expressão escatológica técnica.
- source_word: ἐν τῷ Ἰσραήλ
  choice: em Israel
  rationale: Mantém o valor locativo e corporativo da expressão, referente ao povo de Israel como âmbito da crise.
- source_word: ἥτις οὐκ ἐγένετο
  choice: como não havia ocorrido
  rationale: 'Reproduz o valor qualitativo e comparativo da oração: tratava-se de uma aflição sem precedente naquele período.'
- source_word: ἀφʼ ἧς ἡμέρας
  choice: desde o dia em que
  rationale: É a forma temporal direta e idiomática em português.
- source_word: οὐκ ὤφθη
  choice: já não se via
  rationale: A construção portuguesa comunica a ausência continuada sugerida pelo contexto, preservando na nota a alternativa de entender o passivo grego como “aparecia”.
- source_word: προφήτης
  choice: profeta
  rationale: O singular sem artigo tem sentido genérico, indicando a ausência de presença profética, não necessariamente a de um indivíduo específico.
- source_word: αὐτοῖς
  choice: entre eles
  rationale: No contexto, indica a presença do profeta no meio da comunidade; “a eles” permanece como alternativa possível quando ὤφθη é entendido como “apareceu”.
theological_decisions:
- issue: Sentido da ausência de profeta
  choice: A frase descreve historicamente um período em que já não se via profeta entre Israel.
  alternative: A frase pode ser entendida mais estritamente como a ausência de manifestação pública de um profeta a eles.
  rationale: O singular é mais naturalmente genérico, mas o texto não deve ser ampliado para formular uma doutrina geral sobre a cessação da profecia. A nota conserva a ambiguidade lexical entre ser visto e aparecer.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe amplamente compreensível no Brasil e em outros contextos lusófonos. A formulação evita linguagem confessional técnica e mantém a ambiguidade do verbo grego em nota.
