lexical_decisions:
- source_word: κατόπισθεν αὐτοῦ
  choice: atrás dele
  rationale: A expressão indica posição na retaguarda. Mantém-se o início fragmentário, pois a unidade continua a frase anterior.
- source_word: ἐκύκλωσαν
  choice: cercaram
  rationale: O verbo denota envolver ou circundar, aqui em contexto militar; “cercaram” é natural e preciso.
- source_word: παρεμβολήν
  choice: acampamento
  rationale: Em narrativa militar, o substantivo costuma designar um acampamento ou arraial.
- source_word: ἐξετίναξαν
  choice: dispararam
  rationale: No contexto de combate, o verbo descreve o lançamento de projéteis; “dispararam” expressa a ação sem especificar indevidamente o mecanismo.
- source_word: σχίζας
  choice: flechas
  rationale: O substantivo incomum parece designar projéteis; “flechas” é uma interpretação contextual clara, com a incerteza lexical preservada em nota.
- source_word: ἐκ πρωΐθεν ἕως δείλης
  choice: desde o começo da manhã até a tarde
  rationale: Reproduz claramente a duração do ataque ao longo do dia.
- source_word: λαός
  choice: povo
  rationale: Preserva o sentido comum de λαός, embora no contexto se refira às pessoas envolvidas no combate.
