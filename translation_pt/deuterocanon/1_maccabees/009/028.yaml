lexical_decisions:
- source_word: ἠθροίσθησαν
  choice: se reuniram
  rationale: O aoristo passivo de ἀθροίζω tem aqui sentido intransitivo ou médio; “se reuniram” expressa com naturalidade a ação coletiva.
- source_word: πάντες
  choice: todos
  rationale: Reproduz de modo direto e conciso a totalidade indicada pelo grego.
- source_word: οἱ φίλοι
  choice: os amigos
  rationale: Mantém o sentido básico de φίλοι sem explicitar indevidamente possíveis nuances políticas como “partidários” ou “aliados”.
- source_word: Ἰούδου
  choice: de Judas
  rationale: O genitivo indica a relação dos amigos com Judas; a construção é natural em português.
- source_word: εἶπον
  choice: disseram
  rationale: Equivalente narrativo comum e direto de λέγω no aoristo.
- source_word: τῷ Ἰωναθάν
  choice: a Jônatas
  rationale: O dativo marca o destinatário; “Jônatas” é a forma tradicional e corrente do nome em português.
