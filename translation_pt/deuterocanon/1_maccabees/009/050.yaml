base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/050.yaml
  text: 'And they returned to Jerusalem and built fortified cities in Judea: the stronghold in Jericho[a], and Emmaus, and Beth-horon, and Bethel, and Thamnatha-pharathon, and Tephon[b], with high walls and gates and bars.'
translation:
  language: pt
  text: 'Eles voltaram a Jerusalém e construíram cidades fortificadas na Judeia: a fortaleza em Jericó, Emaús, Bete-Horom, Betel, Temanata-Faratom[a] e Tefom[b], com muralhas altas, portões e ferrolhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Temanata-Faratom também pode ser transliterado como «Timnat-Faratom», forma do topônimo encontrada em outras tradições.
    reason: lexical_alternative
  - marker: b
    text: Tefom é uma transliteração da forma grega; algumas tradições trazem outra grafia, como «Tafom».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: voltaram
  rationale: Expressa de modo natural o retorno a um lugar anterior, sem acrescentar uma nuance não indicada pelo aoristo grego.
- source_word: ᾠκοδόμησαν
  choice: construíram
  rationale: O verbo significa construir ou edificar; não se adotou «reconstruíram», pois a ideia de repetição não está explícita no grego.
- source_word: πόλεις ὀχυράς
  choice: cidades fortificadas
  rationale: Equivalente idiomático que comunica cidades preparadas para defesa.
- source_word: τὸ ὀχύρωμα
  choice: a fortaleza
  rationale: Designa uma instalação ou posição fortificada; «fortaleza» é claro e adequado ao contexto militar.
- source_word: Ἰερειχὼ
  choice: Jericó
  rationale: Forma portuguesa tradicional e amplamente reconhecida.
- source_word: Ἐμμαοὺμ
  choice: Emaús
  rationale: Forma portuguesa tradicional do topônimo.
- source_word: Βεθωρὼν
  choice: Bete-Horom
  rationale: Forma aportuguesada legível, próxima do nome semítico refletido no grego.
- source_word: Βαιθὴλ
  choice: Betel
  rationale: Forma portuguesa convencional do topônimo.
- source_word: Θεμανάθα Φαραθὼν
  choice: Temanata-Faratom
  rationale: Transliteração aportuguesada próxima da forma do testemunho grego fornecido; a nota registra uma forma alternativa conhecida em outras tradições.
- source_word: Τεφών
  choice: Tefom
  rationale: Transliteração aportuguesada da forma grega, com a alternativa ortográfica preservada em nota.
- source_word: ἐν τείχεσιν ὑψηλοῖς
  choice: com muralhas altas
  rationale: O uso de ἐν descreve aqui as estruturas com que os lugares foram fortificados; «com» é natural em português.
- source_word: πύλαις
  choice: portões
  rationale: Refere-se às grandes portas defensivas das cidades e fortalezas.
- source_word: μοχλοῖς
  choice: ferrolhos
  rationale: No contexto de portões fortificados, indica barras ou travas de fechamento; «ferrolhos» transmite com precisão essa função.
