lexical_decisions:
- source_word: φάλαγγα
  choice: a falange
  rationale: O termo designa uma linha de batalha ou formação militar compacta. “Falange” preserva a especificidade e a brusquidão do fragmento grego.
- source_word: ἵππος
  choice: a cavalaria
  rationale: Embora esteja no singular, ἡ ἵππος tem sentido coletivo e se refere às tropas montadas; “cavalaria” expressa isso com naturalidade.
- source_word: ἐξελύθη
  choice: se desfez
  rationale: O verbo indica que a formação se soltou ou se desarticulou, sem necessariamente acrescentar a ideia mais forte de derrota total.
- source_word: συνετρίβησαν
  choice: foram esmagados
  rationale: O verbo transmite a ideia forte de serem quebrados ou severamente derrotados; “esmagados” conserva essa intensidade.
- source_word: ἀπʼ αὐτοῦ
  choice: por ele
  rationale: No contexto de combate, a expressão indica que a derrota ocorreu pela ação dele. A formulação direta é natural em português, embora o grego seja conciso.
- source_word: ἐσκορπίσθη
  choice: se dispersou
  rationale: Expressa de modo claro e próximo ao grego a dispersão de uma força militar.
- source_word: πεδίῳ
  choice: pela planície
  rationale: Em narrativa militar, πεδίον costuma indicar terreno aberto ou uma planície; “pela planície” também traduz naturalmente ἐν τῷ πεδίῳ neste contexto.
