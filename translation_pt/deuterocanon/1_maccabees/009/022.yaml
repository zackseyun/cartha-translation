  yaml_path: translation/deuterocanon/1_maccabees/009/022.yaml
  text: And the rest of the accounts concerning Judas, and his wars, and the brave deeds that he did, and his greatness, were not recorded; for they were very many.
translation:
  language: pt
  text: Os demais relatos sobre Judas, suas guerras, os atos de bravura que realizou e sua grandeza não foram registrados, pois eram muito numerosos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ περισσὰ τῶν λόγων Ἰούδα
  choice: O restante dos relatos sobre Judas
  rationale: A expressão τὰ περισσὰ indica aquilo que resta ou não foi narrado, e λόγων, nesta fórmula historiográfica, refere-se a relatos ou registros sobre Judas. A formulação preserva o sentido resumitivo e soa natural em português.
- source_word: τῶν πολέμων
  choice: suas guerras
  rationale: πολέμων designa de modo amplo os conflitos militares de Judas; “guerras” mantém essa abrangência sem reduzi-los apenas a batalhas isoladas.
- source_word: τῶν ἀνδραγαθιῶν ὧν ἐποίησεν
  choice: os atos de bravura que realizou
  rationale: ἀνδραγαθία denota ação valorosa ou heroica. “Atos de bravura” conserva o tom elogioso sem recorrer a linguagem arcaica ou marcada por gênero.
- source_word: τῆς μεγαλωσύνης αὐτοῦ
  choice: sua grandeza
  rationale: μεγαλωσύνη expressa aqui a grandeza ou elevada estatura de Judas, sem exigir o sentido técnico de majestade régia.
- source_word: οὐ κατεγράφη
  choice: não foi registrado
  rationale: O passivo indica que esse material não foi consignado por escrito. O singular concorda naturalmente com “o restante”, núcleo da construção portuguesa.
- source_word: πολλὰ γὰρ ἦν σφόδρα
  choice: pois tudo isso era numeroso demais
  rationale: A frase explica a ausência do registro pela enorme quantidade do material. “Numeroso demais” comunica a intensidade de σφόδρα e torna explícita a referência coletiva sem restringir o conteúdo.
