  text: And they took the sons of the leaders of the land as hostages[a], and placed them under guard in the citadel in Jerusalem.
translation:
  language: pt
  text: E tomaram como reféns os filhos dos líderes da região e colocaram-nos sob guarda na cidadela[a], em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na Acra”, a cidadela fortificada de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: tomaram
  rationale: Verbo narrativo direto; no contexto, indica que os filhos foram tomados sob custódia, sem exigir a nuance mais forte de “capturaram”.
- source_word: τοὺς υἱοὺς
  choice: os filhos
  rationale: O grego especifica filhos do sexo masculino; a tradução preserva essa referência.
- source_word: τῶν ἡγουμένων
  choice: dos líderes
  rationale: O particípio substantivado designa pessoas que exerciam liderança, sem necessariamente indicar um cargo político formal.
- source_word: τῆς χώρας
  choice: da região
  rationale: χώρα pode significar terra, país ou região; “região” é natural neste contexto histórico e evita sugerir um Estado nacional moderno.
- source_word: ὁμήρα
  choice: como reféns
  rationale: O termo designa reféns; a construção com “como” explicita em português a condição em que foram tomados.
- source_word: ἔθεντο
  choice: os mantiveram
  rationale: Embora literalmente seja “colocaram”, em combinação com ἐν φυλακῇ a expressão portuguesa natural é “mantiveram sob guarda”, indicando detenção contínua.
- source_word: ἐν τῇ ἄκρᾳ
  choice: na cidadela
  rationale: ἄκρα designa uma fortaleza elevada ou cidadela e, neste livro, pode referir-se especificamente à fortaleza de Jerusalém conhecida como Acra.
- source_word: ἐν φυλακῇ
  choice: sob guarda
  rationale: Expressa custódia ou vigilância sem afirmar, de modo mais específico do que o grego, que estavam em um edifício prisional.
