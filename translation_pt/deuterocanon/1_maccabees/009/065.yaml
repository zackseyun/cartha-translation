  yaml_path: translation/deuterocanon/1_maccabees/009/065.yaml
  text: And Jonathan left Simon his brother in the city[a], and went out into the country, and came with a number of men.
translation:
  language: pt
  text: Jônatas deixou seu irmão Simão na cidade, saiu para a região e veio com certo número de homens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “veio em número”. A expressão é elíptica e provavelmente indica que ele veio acompanhado de um grupo ou contingente de homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: deixou
  rationale: O aoristo de ἀπολείπω indica que Jônatas deixou Simão naquele lugar enquanto ele próprio partiu; “deixou” expressa isso com naturalidade.
- source_word: Σίμωνα τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão Simão
  rationale: A formulação identifica Simão como irmão de Jônatas e segue a ordem mais natural em português.
- source_word: ἐν τῇ πόλει
  choice: na cidade
  rationale: πόλις pode designar cidade ou povoado; “cidade” é a equivalência usual e mantém o contraste espacial com χώρα.
- source_word: ἐξῆλθεν εἰς τὴν χώραν
  choice: saiu para a região
  rationale: χώρα pode significar região, território ou campo. “Região” preserva a amplitude do termo sem restringi-lo necessariamente à zona rural.
- source_word: ἦλθεν ἀρίθμῳ
  choice: veio com certo número de homens
  rationale: A expressão grega é elíptica. O contexto militar permite explicitar “homens”, enquanto “certo número” conserva a indefinição do original.
