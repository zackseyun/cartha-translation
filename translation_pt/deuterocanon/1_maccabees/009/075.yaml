  yaml_path: translation/deuterocanon/1_maccabees/009/075.yaml
  text: And he encamped against Joppa[a], but those from the city shut him out, because a garrison of Apollonius was in Joppa; and they fought against it.
translation:
  language: pt
  text: E ele acampou contra Jope, mas os habitantes da cidade o impediram de entrar, porque havia em Jope uma guarnição de Apolônio; e eles combateram contra ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “eles combateram contra ela”. Depois dos verbos anteriores no singular, o sujeito passa ao plural; provavelmente se trata de Jônatas e suas forças, enquanto “ela” se refere a Jope. A formulação foi preservada sem eliminar essa mudança abrupta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν ἐπὶ
  choice: acampou contra
  rationale: Preserva o sentido militar de estabelecer acampamento diante de uma cidade com intenção hostil, sem reduzir o verbo a uma simples marcha ou ataque.
- source_word: Ἰόππην
  choice: Jope
  rationale: Forma tradicional e reconhecível do topônimo bíblico em português.
- source_word: ἀπέκλεισαν αὐτόν
  choice: o impediram de entrar
  rationale: Expressa naturalmente em português que os habitantes lhe bloquearam o acesso à cidade, mantendo o objeto masculino singular do grego.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: os habitantes da cidade
  rationale: Identifica de modo claro e inclusivo as pessoas procedentes da cidade, sem acrescentar a especificação masculina ausente no grego.
- source_word: φρουρὰ Ἀπολλωνίου
  choice: uma guarnição de Apolônio
  rationale: Mantém a relação de pertencimento ou associação da guarnição com Apolônio e reproduz naturalmente a construção sem artigo.
- source_word: ἐπολέμησαν αὐτήν
  choice: eles combateram contra ela
  rationale: Conserva tanto o verbo no plural quanto o pronome feminino singular, provavelmente referente à cidade, sem harmonizar a mudança abrupta de sujeito.
