  text: And Alcimus died at that time after great torment[a].
translation:
  language: pt
  text: E Álcimo morreu naquele tempo, em meio a grande tormento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «depois de grande tormento». A expressão grega pode descrever tanto a circunstância que acompanhou sua morte quanto o sofrimento intenso que a precedeu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: morreu
  rationale: O aoristo de ἀποθνῄσκω narra diretamente o acontecimento da morte; «morreu» é a forma simples e natural em português.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: naquele tempo
  rationale: A expressão situa o acontecimento de modo geral, sem atribuir a καιρός o sentido técnico de uma época ou estação específica.
- source_word: μετὰ βασάνου μεγάλης
  choice: depois de grande tormento
  rationale: Embora μετά com genitivo normalmente indique acompanhamento, o contexto permite entender o sofrimento intenso como anterior à morte. A tradução principal segue essa leitura natural, preservando em nota a alternativa circunstancial.
- source_word: βασάνου
  choice: tormento
  rationale: «Tormento» conserva a intensidade de βασάνος, que denota sofrimento, dor ou suplício severo.
- source_word: Ἄλκιμος
  choice: Álcimo
  rationale: Forma tradicional e reconhecível do nome em português, com acento conforme a pronúncia portuguesa.
