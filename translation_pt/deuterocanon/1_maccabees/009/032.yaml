lexical_decisions:
- source_word: ἔγνω
  choice: ficou sabendo disso
  rationale: O aoristo de γινώσκω indica aqui que Báquides tomou conhecimento da situação. “Ficou sabendo” expressa naturalmente essa mudança de estado; “disso” explicita em português o conteúdo implícito no contexto.
- source_word: ἐζήτει
  choice: procurava
  rationale: O imperfeito retrata uma ação contínua ou uma tentativa em andamento. “Procurava” preserva esse aspecto sem afirmar que o objetivo foi alcançado.
- source_word: ἀποκτεῖναι
  choice: matá-lo
  rationale: O infinitivo significa diretamente “matar”. A forma com pronome enclítico traduz também αὐτόν de modo claro e natural.
- source_word: Βακχίδης
  choice: Báquides
  rationale: Forma portuguesa tradicional e reconhecível do nome grego, com acentuação adequada à pronúncia em português.
- source_word: αὐτόν
  choice: -lo
  rationale: Pronome masculino singular que retoma a personagem masculina mencionada no contexto e funciona como objeto direto de “matar”.
