  text: And Jonathan and Simon his brother[a], and all those with him, learned of it[b], and they fled into the wilderness of Tekoa and encamped by the water of the cistern of Asphar.
translation:
  language: pt
  text: Jônatas, seu irmão Simão e todos os que estavam com ele ficaram sabendo disso[a]. Então fugiram para o deserto de Tecoa e acamparam junto à água da cisterna[b] de Asfar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomaram conhecimento”. O grego diz literalmente que eles “vieram a saber”, deixando implícito pelo contexto aquilo de que ficaram sabendo.'
    reason: lexical_alternative
  - marker: b
    text: “Cisterna” também pode ser traduzida por “poço” ou “cova”; porém, a expressão “água da cisterna” indica uma fonte ou reservatório de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: ficaram sabendo disso
  rationale: O aoristo de γινώσκω indica que o grupo tomou conhecimento de algo já expresso pelo contexto. A formulação é natural em português e mantém implícito o objeto, explicitando-o apenas pelo pronome contextual “disso”.
- source_word: ἔφυγον
  choice: fugiram
  rationale: O verbo expressa fuga diante do perigo, preservando a urgência da narrativa.
- source_word: ἔρημον Θεκώε
  choice: deserto de Tecoa
  rationale: ἔρημος designa aqui uma região erma. “Deserto” é claro e geograficamente adequado ao contexto judaico, sem exigir a ideia de dunas arenosas.
- source_word: παρενέβαλον
  choice: acamparam
  rationale: O verbo narrativo indica o estabelecimento de um acampamento; “acamparam” é corrente, preciso e mantém o tom histórico.
- source_word: ἐπὶ τὸ ὕδωρ
  choice: junto à água
  rationale: Com o verbo de acampar, ἐπί com acusativo indica a localização do acampamento nas proximidades da fonte de água.
- source_word: λάκκου
  choice: cisterna
  rationale: Embora λάκκος também possa significar “poço” ou “cova”, a associação com ὕδωρ favorece uma cavidade ou reservatório destinado a conter água.
- source_word: Ἀσφάρ
  choice: Asfar
  rationale: Transliteração adaptada à ortografia portuguesa do nome próprio grego, representando φ por “f”.
