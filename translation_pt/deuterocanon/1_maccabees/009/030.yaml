  yaml_path: translation/deuterocanon/1_maccabees/009/030.yaml
  text: Now therefore we have chosen you today to be for us, in his place, a ruler and leader, to fight our war.
translation:
  language: pt
  text: Agora, portanto, hoje escolhemos você para ser, em lugar dele, nosso governante e líder, a fim de travar a nossa guerra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρετισάμεθα
  choice: escolhemos
  rationale: O aoristo médio indica a escolha de alguém para exercer uma função. “Escolhemos” é natural e preserva a ideia de seleção sem pressupor um processo eleitoral técnico.
- source_word: ἀντʼ αὐτοῦ
  choice: em lugar dele
  rationale: A expressão indica sucessão na posição antes ocupada por outra pessoa; esta formulação é idiomática e não torna a substituição excessivamente mecânica.
- source_word: ἄρχοντα
  choice: governante
  rationale: O termo designa de modo amplo quem exerce autoridade. “Governante” mantém esse sentido e deixa que o termo seguinte expresse separadamente a função de liderança.
- source_word: ἡγούμενον
  choice: líder
  rationale: O particípio substantivado designa aquele que conduz ou lidera. “Líder” preserva a distinção entre os dois títulos sem impor um cargo técnico posterior.
- source_word: τοῦ πολεμῆσαι
  choice: a fim de travar
  rationale: O infinitivo articular exprime propósito. “A fim de travar” explicita essa relação e combina naturalmente com “guerra” em português.
- source_word: τὸν πόλεμον ἡμῶν
  choice: a nossa guerra
  rationale: πόλεμος se refere normalmente à guerra, e não apenas a uma batalha isolada; o possessivo foi mantido de forma direta.
theological_decisions:
- issue: Tradução dos títulos combinados ἄρχοντα καὶ ἡγούμενον
  choice: governante e líder
  alternative: príncipe e comandante; governante e dirigente
  rationale: A tradução conserva os dois termos distintamente, sem transformar a função em um título político ou militar técnico e posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada moderadamente para fluência, preservando a ênfase temporal de νῦν, οὖν e σήμερον e a finalidade expressa pelo infinitivo.
