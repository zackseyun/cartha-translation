  yaml_path: translation/deuterocanon/1_maccabees/009/014.yaml
  text: And Judas saw that Bacchides and the main strength of the camp were on the right[b][a], and all the men courageous in heart gathered around him.
translation:
  language: pt
  text: Judas viu que Báquides e a principal força do exército estavam à direita, e todos os homens de coração corajoso se reuniram a ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεν
  choice: viu
  rationale: O aoristo de ὁράω tem aqui seu sentido narrativo direto; “viu” evita transformar a percepção em inferência.
- source_word: τὸ στερέωμα τῆς παρεμβολῆς
  choice: o núcleo mais forte do exército
  rationale: στερέωμα indica a parte firme, forte ou principal das forças. No contexto de batalha, παρεμβολή se refere ao exército disposto em campo, não necessariamente a um acampamento físico.
- source_word: ἐν τοῖς δεξιοῖς
  choice: à direita
  rationale: Expressa a posição no lado ou ala direita sem acrescentar uma especificação ausente do grego.
- source_word: συνῆλθον αὐτῷ
  choice: se reuniram a ele
  rationale: Preserva tanto a ação coletiva de συνέρχομαι quanto a orientação para Judas indicada pelo dativo αὐτῷ.
- source_word: πάντες οἱ εὔψυχοι τῇ καρδίᾳ
  choice: todos os homens corajosos de coração
  rationale: Mantém a referência contextual aos combatentes masculinos e conserva a expressão explícita τῇ καρδίᾳ, embora ela seja menos idiomática que “de coração valente”.
theological_decisions:
- issue: Referência masculina no contexto militar
  choice: todos os homens corajosos de coração
  alternative: todos os corajosos de coração
  rationale: O plural masculino substantivado designa, neste episódio, os combatentes que se juntaram a Judas; explicitar “homens” comunica essa referência contextual sem generalizá-la.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Núcleo mais forte do exército” torna inteligível a metáfora militar sem confundi-la com fortificações ou tendas; “corajosos de coração” preserva deliberadamente o matiz semítico do original.
