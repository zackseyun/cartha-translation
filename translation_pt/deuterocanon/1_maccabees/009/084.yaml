lexical_decisions:
- source_word: αὐτῆς
  choice: dela
  rationale: Preserva o pronome feminino do fragmento grego, embora seu antecedente esteja fora do trecho fornecido.
- source_word: ἔλαβεν
  choice: tomou
  rationale: Tradução narrativa natural do aoristo de λαμβάνω.
- source_word: τὰ σκῦλα αὐτῶν
  choice: os despojos deles
  rationale: σκῦλα designa despojos tomados em guerra; a formulação conserva também o pronome expresso.
- source_word: τὸ ἱερὸν Δαγὼν
  choice: o templo de Dagom
  rationale: Neste contexto, ἱερόν indica o templo ou santuário dedicado à divindade pagã Dagom.
- source_word: τὸ ἱερὸν αὐτῆς
  choice: o templo dela
  rationale: Mantém o pronome feminino αὐτῆς e evita determinar um antecedente ausente do fragmento.
- source_word: ἐνεπύρισεν ἐν πυρί
  choice: incendiou
  rationale: Expressa em português corrente a ideia enfática de pôr fogo; repetir 'com fogo' seria pouco natural e semanticamente redundante.
- source_word: οἱ πεπτωκότες
  choice: os que haviam caído
  rationale: O particípio perfeito destaca o estado resultante daqueles que já tinham caído.
- source_word: μαχαίρᾳ
  choice: à espada
  rationale: Expressão portuguesa tradicional e clara para morte ou queda por arma em combate.
