base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/048.yaml
  text: And Jonathan and those with him jumped into the Jordan and swam across to the other side[a], and they did not cross the Jordan after them.
translation:
  language: pt
  text: Jônatas e os que estavam com ele saltaram para dentro do Jordão e atravessaram a nado para a outra margem; os perseguidores, porém, não atravessaram o Jordão atrás deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não atravessaram o Jordão contra eles” ou “para atacá-los”. A expressão grega é condensada e pode indicar um movimento hostil contra o grupo de Jônatas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπήδησεν
  choice: saltaram no
  rationale: O verbo expressa um salto súbito para dentro do rio. Embora esteja no singular por concordar com Jônatas, em português a coordenação com “os que estavam com ele” pede naturalmente o plural.
- source_word: οἱ μετ᾿ αὐτοῦ
  choice: os que estavam com ele
  rationale: Mantém a amplitude da expressão grega sem acrescentar “homens” ou definir a relação como a de companheiros.
- source_word: διεκολύμβησαν
  choice: atravessaram a nado
  rationale: Preserva tanto o movimento de travessia quanto o meio empregado, isto é, nadando.
- source_word: εἰς τὸ πέραν
  choice: para a outra margem
  rationale: No contexto da travessia de um rio, “outra margem” explicita de modo natural o sentido espacial do idioma grego.
- source_word: οὐ διέβησαν ἐπ᾿ αὐτοὺς τὸν Ἰορδάνην
  choice: os perseguidores, porém, não atravessaram o Jordão atrás deles
  rationale: O sujeito implícito é recuperado do contexto como o grupo perseguidor. “Atrás deles” expressa naturalmente o movimento hostil ou persecutório sugerido por ἐπί com acusativo, sem afirmar de modo categórico um ataque.
- source_word: Ἰορδάνην
  choice: o Jordão
  rationale: Esta é a forma consagrada e suficiente em português; o substantivo “rio” não aparece no grego.
