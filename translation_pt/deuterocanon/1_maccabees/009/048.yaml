translation_notes:
  register: Português atual, digno e de ampla compreensão, com fluidez brasileira. A conjunção final foi vertida por “porém” para tornar clara a mudança de sujeito, e “os perseguidores” foi explicitado a partir do contexto imediato. O marcador da nota foi colocado após a oração ambígua a que se refere.
