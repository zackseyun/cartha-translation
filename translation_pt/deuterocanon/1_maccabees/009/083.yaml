  text: to Azotus[a], and they entered Beth-dagon, their idol temple, to be saved[b]. And Jonathan burned Azotus and the cities around it.
translation:
  language: pt
  text: para Azoto[a], e entraram em Bet-Dagom[b], o santuário do ídolo deles, a fim de se pôr a salvo[c]. E Jônatas incendiou Azoto e as cidades ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azoto é o nome grego de Asdode.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, «o ídolo deles». No contexto, a expressão provavelmente se refere ao santuário de Bet-Dagom, e não apenas a uma estátua.
    reason: lexical_alternative
  - marker: c
    text: Ou, mais literalmente, «para serem salvos». Aqui se trata de escapar do perigo ou buscar proteção.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄζωτον
  choice: Azoto
  rationale: Preserva em português a forma grega helenizada do topônimo, adequada a um livro de fonte grega; Asdode é o equivalente hebraico e aparece em nota.
- source_word: εἰσῆλθον
  choice: entraram em
  rationale: Traduz diretamente o aoristo de movimento com uma construção natural em português.
- source_word: Βηθδαγὼν
  choice: Bet-Dagom
  rationale: Mantém o nome próprio do lugar ou edifício em forma transliterada e legível em português, sem substituí-lo pela interpretação «casa de Dagom».
- source_word: τὸ εἴδωλον αὐτῶν
  choice: o santuário do ídolo deles
  rationale: Embora a expressão signifique literalmente «o ídolo deles», sua aposição a Bet-Dagom e o verbo «entraram» indicam aqui o santuário associado ao ídolo. A formulação conserva a referência explícita ao ídolo sem sugerir que entraram numa estátua.
- source_word: τοῦ σωθῆναι
  choice: a fim de se pôr a salvo
  rationale: Expressa a finalidade do infinitivo articular e comunica naturalmente, no contexto militar, a busca de proteção ou sobrevivência.
- source_word: ἐνεπύρισεν
  choice: incendiou
  rationale: O verbo indica atear fogo; «incendiou» é conciso e não afirma necessariamente destruição total.
- source_word: τὰς πόλεις τὰς κύκλῳ
  choice: as cidades ao redor
  rationale: Reproduz de modo idiomático a referência às cidades circunvizinhas, entendidas em relação a Azoto.
theological_decisions:
- issue: Sentido de σωθῆναι no contexto de fuga militar
  choice: segurança ou livramento físico («pôr-se a salvo»)
  alternative: salvação espiritual em sentido religioso
  rationale: O contexto narra pessoas que entram num santuário pagão buscando proteção. A tradução evita importar um sentido soteriológico, sem apagar a ideia básica de serem salvas do perigo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. «Bet-Dagom» e «Jônatas» seguem formas naturais em português; a ordem narrativa e a relação de aposição do grego foram preservadas sem rigidez artificial.
