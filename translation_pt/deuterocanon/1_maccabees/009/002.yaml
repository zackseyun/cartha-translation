base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/002.yaml
  text: And they traveled on the road to Galgala[a], and encamped against Mesaloth in Arbela, and captured it[b], and destroyed many people.
translation:
  language: pt
  text: Eles seguiram pela estrada que leva a Gálgala e acamparam contra Messalote, em Arbela. Tomaram-na[a] e matou muitas pessoas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego é raro e difícil. Também pode significar “tomaram-na antecipadamente”, “apoderaram-se dela primeiro” ou, de modo mais geral, “dominaram-na”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “destruiu muitas vidas humanas” e passa aqui do sujeito plural para um verbo no singular.
    reason: source_form
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: seguiram
  rationale: O aoristo de πορεύομαι indica deslocamento. “Seguiram” combina naturalmente com a expressão de rota que vem em seguida, sem especificar além do grego se marcharam ou apenas viajaram.
- source_word: ὁδὸν τὴν εἰς Γάλγαλα
  choice: pela estrada que leva a Gálgala
  rationale: A construção acusativa com ὁδόν indica o caminho ou a rota tomada. Esta formulação conserva a imagem concreta da estrada e o sentido direcional.
- source_word: παρενέβαλον ἐπὶ
  choice: acamparam contra
  rationale: Em contexto militar, παρεμβάλλω significa montar acampamento; ἐπί diante do lugar sugere posicionamento hostil, preservado por “contra”.
- source_word: Μεσσαλὼθ τὴν ἐν Ἀρβήλοις
  choice: Messalote, em Arbela
  rationale: A expressão identifica Messalote por sua localização em Arbela. A aposição é clara e natural em português.
- source_word: προκατελίβοντο
  choice: tomaram-na
  rationale: O verbo composto é raro e de interpretação difícil. “Tomaram-na” comunica a captura do local sem definir no texto principal se o prefixo προ- indica antecipação, prioridade ou tomada de assalto; a nota registra essa incerteza.
- source_word: ἀπώλεσεν
  choice: ele matou
  rationale: Com pessoas como objeto, ἀπόλλυμι tem sentido letal. O verbo grego passa inesperadamente para o singular; o pronome explícito em português torna essa mudança perceptível.
- source_word: ψυχὰς ἀνθρώπων πολλὰς
  choice: muitas pessoas
  rationale: Literalmente, a expressão fala de “muitas vidas de seres humanos”, mas ψυχαί funciona aqui como designação de pessoas ou vidas; “muitas pessoas” transmite naturalmente o sentido.
