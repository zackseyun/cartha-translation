  text: And in the first month of the one hundred and fifty-second year[a], they encamped in Jerusalem.
translation:
  language: pt
  text: E, no primeiro mês do ano cento e cinquenta e dois, eles acamparam em Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «acamparam para Jerusalém»; «em Jerusalém» expressa de modo natural, em português, o local do acampamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ μηνὸς τοῦ πρώτου
  choice: no primeiro mês
  rationale: O genitivo tem função temporal; «no primeiro mês» expressa essa referência de modo natural e fiel em português.
- source_word: ἔτους δευτέρου καὶ πεντηκοστοῦ καὶ ἑκατοστοῦ
  choice: do ano cento e cinquenta e dois
  rationale: A forma aditiva grega («segundo, quinquagésimo e centésimo») designa o ano 152; a ordem numérica corrente em português preserva o valor sem reproduzir uma construção artificial.
- source_word: παρενέβαλον
  choice: eles acamparam
  rationale: O verbo indica montar acampamento, frequentemente em contexto militar. «Acamparam» mantém o sentido e o tom narrativo sem explicitação excessiva.
- source_word: εἰς Ἱερουσαλήμ
  choice: em Jerusalém
  rationale: Embora εἰς costume indicar movimento para dentro ou em direção a um lugar, com o verbo «acampar» o português normalmente expressa o local resultante com «em». A nota registra a forma menos usual do grego.
