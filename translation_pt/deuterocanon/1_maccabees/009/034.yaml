base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/009/034.yaml
  text: And Bacchides learned of it on the Sabbath day[b][a], and he himself and all his army came to the other side of the Jordan.
translation:
  language: pt
  text: E Báquides ficou sabendo disso no dia de sábado[a]; então ele próprio e todo o seu exército foram para o outro lado do Jordão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «no dia dos sábados», expressão idiomática que significa «no dia de sábado».
    reason: lexical_alternative
  - marker: b
    text: Ou «para além do Jordão». A expressão grega pode designar a região do outro lado do rio ou o movimento até esse lado.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: ficou sabendo disso
  rationale: O aoristo de γινώσκω indica aqui que Báquides tomou conhecimento de uma informação. O pronome «disso» explicita em português o objeto subentendido pelo contexto.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: no dia de sábado
  rationale: A expressão grega, literalmente «no dia dos sábados», é um idiomatismo que designa o sábado; a formulação escolhida é clara e natural em português.
- source_word: αὐτὸς
  choice: ele próprio
  rationale: Preserva a ênfase do pronome grego, indicando que Báquides foi pessoalmente com o exército.
- source_word: πᾶν τὸ στράτευμα αὐτοῦ
  choice: todo o seu exército
  rationale: στράτευμα designa a força militar sob seu comando, e esta expressão reproduz tanto o sentido coletivo quanto a totalidade indicada por πᾶν.
- source_word: πέραν τοῦ Ἰορδάνη
  choice: para o outro lado do Jordão
  rationale: No contexto do verbo de movimento, πέραν pode indicar deslocamento para o lado oposto do rio. A formulação é natural sem eliminar a possível referência à região além do Jordão.
