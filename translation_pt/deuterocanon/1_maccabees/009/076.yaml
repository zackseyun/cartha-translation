lexical_decisions:
- source_word: φοβηθέντες
  choice: com medo
  rationale: Traduz de modo natural o particípio aoristo, indicando que os habitantes agiram movidos pelo medo, sem ampliar o sentido.
- source_word: ἤνοιξαν
  choice: abriram
  rationale: O grego não expressa o objeto do verbo. A tradução preserva essa elipse, sem inserir no texto principal «os portões».
- source_word: οἱ ἐκ τῆς πόλεως
  choice: os que estavam na cidade
  rationale: No contexto, a expressão substantivada designa os habitantes ou defensores presentes na cidade. Esta formulação é natural em português e não acrescenta uma referência exclusivamente masculina.
- source_word: ἐκυρίευσεν
  choice: tomou o controle de
  rationale: κυριεύω comunica domínio ou controle. A expressão se ajusta ao contexto militar e político sem restringir o sentido à ideia de captura física.
- source_word: Ἰόππης
  choice: Jope
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo grego Ἰόππη.
- source_word: ἤκουσεν
  choice: ouviu falar disso
  rationale: A formulação torna natural em português o uso absoluto de ἀκούω, retomando o acontecimento precedente sem completar a oração interrompida.
