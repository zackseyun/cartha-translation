  source_fidelity: A tradução de φοβηθέντες, ἤνοιξαν e ἐκυρίευσεν é em geral adequada, e «Jope» é a forma portuguesa tradicional do topônimo. Contudo, «os que estavam na cidade» desloca o sentido de οἱ ἐκ τῆς πόλεως («os da cidade»), e «ouviu falar disso» introduz um complemento («disso») que o grego não expressa no trecho preservado.
  naturalness: «Os da cidade» é natural, conciso e mais próximo da expressão grega. Embora «Apolônio ouviu, e» seja uma oração deliberadamente truncada, ela deve permanecer assim para refletir o testemunho fornecido; a nota explica a estranheza resultante.
  terminology: «Tomou o controle de Jope» comunica adequadamente ἐκυρίευσεν e mantém registro moderno. «Jônatas», «Jope» e «Apolônio» são formas portuguesas estabelecidas.
