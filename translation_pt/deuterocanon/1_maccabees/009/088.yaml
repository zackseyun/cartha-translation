  yaml_path: translation/deuterocanon/1_maccabees/009/088.yaml
  text: And it happened that when Alexander the king heard these words[a], he continued to honor Jonathan, and he sent him a clasp.
translation:
  language: pt
  text: E aconteceu que, quando o rei Alexandre ouviu essas palavras, continuou a honrar Jônatas e lhe enviou um broche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fecho” ou “fivela”; o termo grego designa um adorno usado para prender uma peça de roupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: E aconteceu que, quando
  rationale: Preserva a fórmula grega de transição narrativa e a relação temporal, sem soar excessivamente literal em português.
- source_word: ἤκουσεν
  choice: ouviu
  rationale: Mantém o sentido direto de receber auditivamente as palavras ou a notícia.
- source_word: τοὺς λόγους τούτους
  choice: essas palavras
  rationale: Conserva a formulação concreta do grego, embora λόγοι também possa significar mensagem ou assuntos.
- source_word: προσέθετο δοξάσαι
  choice: passou a honrar ainda mais
  rationale: Expressa o valor idiomático de προστίθημι com infinitivo — prosseguir ou acrescentar uma ação — e deixa claro que Alexandre conferiu honra adicional a Jônatas.
- source_word: πόρπην
  choice: um broche
  rationale: πόρπη designa um objeto ornamental usado para prender uma peça de roupa; “broche” é corrente e natural, sem definir de modo rígido seu formato.
