  text: And they seized from the men of the country fifty men who were leaders of wickedness[a], and he killed them.
translation:
  language: pt
  text: E prenderam, dentre os homens daquela região, cinquenta homens que eram líderes da maldade[a]; e ele os matou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “líderes da maldade”; a expressão também pode significar “malfeitores de destaque”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: συνέλαβον
  choice: prenderam
  rationale: Expressa a captura ou detenção de pessoas de modo natural em português, sem exigir a ideia de um processo jurídico formal.
- source_word: ἀπὸ τῶν ἀνδρῶν τῆς χώρας
  choice: dentre os homens daquela região
  rationale: ἀπό indica seleção a partir de um grupo maior, e χώρα designa aqui a região ou território; “dentre” torna essa relação clara.
- source_word: τῶν ἀρχηγῶν
  choice: líderes
  rationale: Mantém o sentido direto de pessoas que ocupavam posição de liderança, sem acrescentar a conotação mais específica de “chefes de quadrilha” ou “instigadores”.
- source_word: τῆς κακίας
  choice: da maldade
  rationale: Preserva de perto a construção genitiva e a amplitude de κακία, que pode indicar maldade, perversidade ou prática do mal.
- source_word: εἰς πεντήκοντα ἄνδρας
  choice: cinquenta homens
  rationale: Comunica naturalmente o total exato indicado pela expressão grega, sem reproduzir de maneira rígida o idiomatismo numérico.
- source_word: ἀπέκτεινεν
  choice: matou
  rationale: Verte o sentido básico do verbo sem introduzir a nuance judicial que “executou” poderia sugerir.
theological_decisions:
- issue: Mudança do sujeito plural para o singular na oração final
  choice: “E prenderam [...] e ele os matou”
  alternative: “E prenderam [...] e eles os mataram”
  rationale: O grego passa claramente do plural συνέλαβον para o singular ἀπέκτεινεν. A tradução mantém essa tensão gramatical e não identifica além do texto quem é o sujeito singular.
- issue: Sentido de τῶν ἀρχηγῶν τῆς κακίας
  choice: “líderes da maldade”
  alternative: “malfeitores de destaque”
  rationale: 'A opção principal conserva a estrutura e a ambiguidade do genitivo grego: eles podem ser líderes na prática do mal ou os principais malfeitores.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula ajuda a marcar a mudança inesperada do sujeito plural para o singular sem suavizá-la.
