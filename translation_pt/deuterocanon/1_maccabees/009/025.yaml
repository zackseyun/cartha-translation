translation:
  language: pt
  text: E Báquides escolheu homens ímpios e os constituiu senhores da região.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «governantes da região». O grego diz literalmente «senhores da região», expressão que aqui indica pessoas investidas de autoridade sobre o território.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλεξεν
  choice: escolheu
  rationale: Traduz diretamente o aoristo de ἐκλέγομαι, mantendo a ideia simples de escolher ou selecionar.
- source_word: Βακχίδης
  choice: Báquides
  rationale: Adota a forma portuguesa tradicional e inteligível do nome próprio grego.
- source_word: τοὺς ἀσεβεῖς ἄνδρας
  choice: homens ímpios
  rationale: ἀσεβεῖς caracteriza pessoas sem reverência ou lealdade religiosa e moral; «ímpios» preserva essa dimensão, enquanto ἄνδρας é mantido como «homens».
- source_word: κατέστησεν
  choice: constituiu
  rationale: Neste contexto, o verbo indica colocar ou estabelecer alguém numa posição de autoridade; «constituiu» expressa uma designação efetiva e formal.
- source_word: κυρίους
  choice: senhores
  rationale: Preserva mais de perto o sentido lexical de κύριοι, «senhores» ou «detentores de autoridade», sem reduzir antecipadamente a expressão a um cargo político específico.
- source_word: τῆς χώρας
  choice: da região
  rationale: χώρα designa aqui o território ou região sob autoridade; «região» é natural no contexto político e evita identificar necessariamente todo um país.
