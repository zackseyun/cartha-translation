  yaml_path: translation/deuterocanon/1_maccabees/009/052.yaml
  text: And they fortified the city[a], and Beth-zur, and Gazara, and the citadel[b], and they stationed forces in them and supplies of food.
translation:
  language: pt
  text: E fortificaram a cidade, Bete-Zur, Gazara[a] e a cidadela[b]; nelas colocaram tropas e provisões de alimentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara é a forma grega do nome; o local costuma ser identificado com Gezer.
    reason: cross_reference
  - marker: b
    text: Ou “a Acra”, nome histórico da fortaleza de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠχύρωσαν
  choice: fortificaram
  rationale: O verbo indica tornar um lugar defensável ou reforçar suas defesas; “fortificaram” é a formulação militar mais direta e natural.
- source_word: τὴν πόλιν
  choice: a cidade
  rationale: πόλις significa normalmente “cidade”, e o artigo aponta para uma cidade específica já identificável pelo contexto.
- source_word: Βεθοσούραν
  choice: Bete-Zur
  rationale: Transliteração portuguesa clara do topônimo, mantendo reconhecível o elemento Zur.
- source_word: Γάζαρα
  choice: Gazara
  rationale: Reproduz diretamente a forma grega Γάζαρα; a identificação habitual com Gezer é indicada em nota.
- source_word: τὴν ἄκραν
  choice: a cidadela
  rationale: ἄκρα designa uma fortificação elevada ou cidadela e, neste contexto, pode referir-se especificamente à fortaleza selêucida de Jerusalém.
- source_word: ἔθεντο ἐν αὐταῖς δυνάμεις
  choice: nelas posicionaram tropas
  rationale: Embora ἔθεντο seja literalmente “puseram”, “posicionaram” expressa naturalmente a colocação de forças militares nos locais fortificados; “tropas” comunica o sentido contextual de δυνάμεις.
- source_word: παραθέσεις βρωμάτων
  choice: armazenaram provisões
  rationale: A expressão denota alimentos depositados ou guardados. A construção verbal em português evita a formulação pouco natural “posicionaram [...] depósitos” e preserva a ideia de estoque de víveres.
