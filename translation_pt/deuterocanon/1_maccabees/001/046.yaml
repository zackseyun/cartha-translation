  text: and to defile the sanctuary and the holy ones;[a]
translation:
  language: pt
  text: e tornar impuros o santuário e os santos;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os consagrados” ou “o povo santo”. O grego diz literalmente “os santos”.
    reason: Preservar a possível amplitude do referente pessoal e evitar que “santos” seja entendido apenas em seu sentido cristão posterior.
lexical_decisions:
- source_word: μιᾶναι
  choice: tornar impuros
  rationale: O infinitivo exprime causar impureza, sobretudo ritual ou moral. “Tornar impuros” preserva essa força mais diretamente do que “profanar” e é claro em português atual.
- source_word: ἁγίασμα
  choice: o santuário
  rationale: Neste contexto, o termo designa naturalmente o templo como espaço sagrado. “Santuário” é conciso, idiomático e mantém a referência cultual.
- source_word: ἁγίους
  choice: os santos
  rationale: O acusativo masculino plural substantivado aponta mais naturalmente para pessoas. “Os santos” reproduz de modo conciso a expressão grega, enquanto a nota esclarece alternativas menos suscetíveis de conotação cristã posterior.
theological_decisions:
- issue: Referente de ἁγίους
  choice: pessoas consagradas a Deus (“os santos”)
  alternative: “os consagrados” ou “o povo santo”; menos provavelmente, “as coisas sagradas”
  rationale: A forma masculina plural favorece um referente pessoal, não objetos sagrados. A tradução não restringe o grupo aos sacerdotes nem resolve além do que a gramática permite.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação conserva o paralelismo e a tensão da expressão grega sem identificar indevidamente os “santos” com um grupo específico.
