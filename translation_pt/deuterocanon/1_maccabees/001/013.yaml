  yaml_path: translation/deuterocanon/1_maccabees/001/013.yaml
  text: And some from the people eagerly sought this[a], and they went to the king; and he gave them authority to practice the customs of the nations.
translation:
  language: pt
  text: Alguns do povo se dispuseram com entusiasmo e foram até o rei; e lhes deram autoridade para praticar os costumes das nações.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as práticas dos gentios”. O grego diz literalmente “das nações”, expressão judaica comum para os povos não israelitas.'
    reason: lexical_alternative
  - marker: b
    text: 'O verbo grego está no plural: “deram”, embora “o rei” seja o antecedente imediatamente anterior. Pelo sentido, também se pode entender: “e o rei lhes deu autoridade”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: προεθυμήθησάν
  choice: se dispuseram com entusiasmo
  rationale: Preserva tanto a disposição voluntária quanto a intensidade expressa pelo verbo, sem acrescentar um objeto explícito ausente no grego.
- source_word: τινες ἀπὸ τοῦ λαοῦ
  choice: alguns do povo
  rationale: Identifica de modo natural e conciso um grupo dentro do povo judeu, sem acrescentar 'homens', que não aparece no texto.
- source_word: ἐπορεύθησαν πρὸς τὸν Βασιλέα
  choice: foram até o rei
  rationale: Expressa diretamente o movimento em direção ao rei em português corrente e digno.
- source_word: ἔδωκαν αὐτοῖς ἐξουσίαν
  choice: lhes deram autoridade
  rationale: Mantém o verbo no plural conforme o texto grego de Swete e traduz ἐξουσίαν por 'autoridade', preservando mais do que mera permissão.
- source_word: ποιῆσαι
  choice: praticar
  rationale: No contexto de costumes ou normas, 'praticar' comunica melhor a adoção efetiva dessas condutas do que o genérico 'fazer'.
- source_word: τὰ δικαιώματα τῶν ἐθνῶν
  choice: os costumes das nações
  rationale: Comunica as práticas normativas dos povos não israelitas. 'Costumes' é natural no contexto, enquanto 'das nações' permanece próximo do grego e evita tornar 'gentios' um termo técnico no texto principal.
theological_decisions:
- issue: Sentido de ἐθνῶν no contexto judaico
  choice: nações
  alternative: gentios
  rationale: O termo se refere contextualmente aos povos não israelitas, mas 'nações' conserva a forma e a amplitude do grego; a alternativa contextual é registrada em nota.
- issue: Número verbal de ἔδωκαν após o singular 'rei'
  choice: lhes deram
  alternative: o rei lhes deu
  rationale: O texto grego apresentado traz inequivocamente a forma plural. Embora o contexto possa levar à compreensão de que a autorização veio do rei, converter o verbo em singular resolveria silenciosamente uma dificuldade textual ou sintática real.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação evita explicitar um objeto inexistente após προεθυμήθησάν e conserva no texto principal o plural difícil de ἔδωκαν, documentando em nota a leitura contextual no singular.
