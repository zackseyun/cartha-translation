base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/044.yaml
  text: And the king sent letters by the hand of messengers to Jerusalem and the cities of Judah[a], that they should follow laws foreign to the land,
translation:
  language: pt
  text: E o rei enviou cartas pelas mãos de mensageiros a Jerusalém e às cidades de Judá, ordenando que seguissem leis alheias à terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «costumes alheios à terra». O grego νόμιμα pode designar tanto leis como costumes ou práticas estabelecidas.'
    reason: alternativa lexical
lexical_decisions:
- source_word: βιβλία
  choice: cartas
  rationale: No contexto administrativo, designa comunicações escritas do rei, não livros no sentido moderno.
- source_word: ἐν χειρὶ ἀγγέλων
  choice: pelas mãos de mensageiros
  rationale: Preserva a expressão de agência e entrega, de sabor semítico e administrativo, sem perder clareza em português.
- source_word: προπορεύθηναι ὀπίσω
  choice: ordenando que seguissem
  rationale: A construção expressa o conteúdo diretivo das cartas. «Seguissem» traduz naturalmente a ideia de adotar e obedecer a determinado curso; «ordenando» explicita a força contextual da ordem régia.
- source_word: νομίμων
  choice: leis
  rationale: O termo pode abranger costumes e práticas estabelecidas, mas «leis» comunica melhor, neste contexto, a força normativa e oficial do decreto.
- source_word: ἀλλοτρίων
  choice: estrangeiras
  rationale: Indica normas pertencentes a outros povos, em contraste com as próprias da terra.
- source_word: τῆς γῆς
  choice: à terra
  rationale: Mantém a formulação relativamente não especificada do grego, sem substituir por «Judá» ou «Judeia».
theological_decisions:
- issue: Amplitude de νόμιμα no contexto de perseguição
  choice: leis
  alternative: costumes; práticas estabelecidas; ordenanças
  rationale: «Leis» conserva o caráter coercivo e oficial da imposição régia, enquanto a nota mantém visível a possível dimensão de costumes e práticas.
- issue: Força da oração infinitiva após o envio das cartas
  choice: ordenando que seguissem
  alternative: para que seguissem; que seguissem; fossem após
  rationale: A formulação transmite em português o conteúdo diretivo das cartas e o sentido de adesão a normas, sem reduzir a frase a movimento físico.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. A expressão «pelas mãos de mensageiros» conserva deliberadamente o colorido idiomático do original.
