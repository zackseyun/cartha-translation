review_pass:
  verdict: revise
  source_fidelity: O rascunho preserva o sentido geral, o paralelismo de força dos dois verbos e o valor final de τοῦ μὴ φαγεῖν. Porém, “se mantiveram fortes e se firmaram interiormente” é redundante e “interiormente” restringe indevidamente o ambíguo ἐν αὐτοῖς a uma experiência psicológica individual.
  naturalness: A redação proposta é compreensível, mas “se firmaram interiormente” não é uma combinação idiomática natural no português moderno. “Se fortaleceram e se mantiveram firmes em seu propósito” conserva a dupla ênfase e produz uma construção fluente.
  terminology: “Alimentos profanados” é uma boa tradução contextual de κοινά, distinguindo-o de ἀκάθαρτα sem apagar o sentido ritual. A nota preserva adequadamente “impuros” e o valor literal “coisas comuns”.
  issues:
  - severity: medium
    issue: “interiormente” fixa de modo excessivo o sentido de ἐν αὐτοῖς.
    rationale: A expressão é condensada e admite leituras como “em si mesmos” ou, contextualmente, uma firmeza partilhada. “Interiormente” introduz uma nuance psicológica específica que o grego não exige.
  - severity: medium
    issue: “se mantiveram fortes e se firmaram interiormente” é redundante e pouco idiomático.
    rationale: As duas expressões portuguesas não distinguem com clareza ἐκραταιώθησαν e ὠχυρώθησαν e enfraquecem a fluência. A revisão mantém duas ações correlatas de fortalecimento e firmeza.
  revised_text: Muitos em Israel se fortaleceram e se mantiveram firmes em seu propósito de não comer alimentos profanados.[a]
  revised_footnotes:
