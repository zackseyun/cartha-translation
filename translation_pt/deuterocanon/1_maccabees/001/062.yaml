  text: And many in Israel stood firm and were strengthened among themselves so as not to eat defiled food;[a]
translation:
  language: pt
  text: Muitos em Israel se fortaleceram e se mantiveram firmes em seu propósito de não comer alimentos profanados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alimentos impuros”; mais literalmente, “coisas comuns”. Neste contexto, o termo grego se refere a alimentos considerados ritualmente profanados segundo a Lei judaica.
    reason: Preserva a alternativa lexical e esclarece o sentido ritual de κοινά.
lexical_decisions:
- source_word: πολλοὶ ἐν Ἰσραήλ
  choice: Muitos em Israel
  rationale: Mantém a expressão quantitativa concisa e a localização social do grupo, sem acrescentar um substantivo ausente no grego.
- source_word: ἐκραταιώθησαν
  choice: se mantiveram fortes
  rationale: Conserva a imagem de força e, no contexto de resistência à coerção, exprime perseverança resoluta em português natural.
- source_word: ὠχυρώθησαν ἐν αὐτοῖς
  choice: se firmaram interiormente
  rationale: O verbo sugere tornar-se firme ou fortificado, e ἐν αὐτοῖς aponta mais naturalmente para uma firmeza neles mesmos. A formulação evita impor a ideia de solidariedade mútua, que não é inequívoca no grego.
- source_word: τοῦ μὴ φαγεῖν
  choice: para não comer
  rationale: Reproduz de modo claro e corrente o valor final do infinitivo articular com μή.
- source_word: κοινά
  choice: alimentos profanados
  rationale: Neste contexto de observância alimentar judaica, κοινά designa coisas consideradas ritualmente comuns ou profanadas. O substantivo 'alimentos' fica implícito no grego, mas é exigido pelo contexto e torna a frase clara.
theological_decisions:
- issue: Sentido ritual de κοινά
  choice: alimentos profanados
  alternative: alimentos impuros; coisas comuns
  rationale: '''Profanados'' preserva a oposição ritual entre o santo e o comum sem confundir diretamente κοινός com ἀκάθαρτος. A nota registra tanto a tradução tradicional ''impuros'' quanto o sentido mais literal.'
- issue: Referente e sentido de ἐν αὐτοῖς
  choice: interiormente
  alternative: entre si; neles
  rationale: A expressão grega é condensada e pode descrever firmeza neles mesmos. 'Interiormente' produz português compreensível sem transformar o trecho, de modo indevido, numa afirmação explícita de fortalecimento comunitário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de ideias de força e firmeza conserva o paralelismo enfático do grego sem soar artificial.
