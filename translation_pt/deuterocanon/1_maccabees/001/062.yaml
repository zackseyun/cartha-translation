    text: Ou “alimentos impuros”; mais literalmente, “coisas comuns”. Neste contexto, o termo grego se refere a alimentos considerados ritualmente profanados segundo a Lei judaica.
    reason: Preserva a alternativa lexical e esclarece o sentido ritual de κοινά.
