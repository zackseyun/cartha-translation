lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Depois dessas coisas
  rationale: Preserva de perto a transição temporal e a sequência expressa no grego, em português claro.
- source_word: ἔπεσεν
  choice: caiu
  rationale: Mantém a imagem física concreta do verbo grego, sem interpretá-lo antecipadamente como “deitou-se” ou “recolheu-se”.
- source_word: ἐπὶ τὴν κοίτην
  choice: sobre a cama
  rationale: Reproduz naturalmente a construção direcional do grego. O artigo definido é idiomático em português e evita acrescentar um possessivo ausente do texto-fonte.
- source_word: ἔγνω
  choice: soube
  rationale: Traduz diretamente o aoristo de γινώσκω e, neste contexto, comunica a tomada de consciência sem abandonar a formulação sóbria do original.
- source_word: ἀποθνήσκει
  choice: estava morrendo
  rationale: O imperfeito perifrástico em português expressa naturalmente o processo em curso indicado pelo presente grego no discurso indireto.
