  text: By their power they kept doing this to Israel[b][a], to those who were found in the cities month after month.
translation:
  language: pt
  text: Com sua força[a], continuavam fazendo isso a Israel, aos que eram encontrados nas cidades, mês após mês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à força»; a expressão grega pode destacar a força coerciva como o meio pelo qual agiam.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «em cada mês e mês», isto é, repetidamente, todos os meses.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἰσχύϊ αὐτῶν
  choice: Com sua força
  rationale: Entende a expressão como instrumental e preserva a ideia de poder coercivo sem explicitar além do grego; «à força» continua sendo uma alternativa possível.
- source_word: ἐποίουν οὕτω
  choice: continuavam fazendo isso
  rationale: O imperfeito indica ação contínua ou reiterada, expressa naturalmente por «continuavam fazendo».
- source_word: τῷ Ἰσραήλ
  choice: a Israel
  rationale: Mantém o dativo de maneira direta; o caráter hostil da ação fica claro pelo contexto, sem converter a construção em «contra Israel».
- source_word: τοῖς εὑρισκομένοις
  choice: aos que eram encontrados
  rationale: Preserva a forma passiva do particípio e a possível ideia de pessoas localizadas pelas autoridades.
- source_word: ἐν παντὶ μηνὶ καὶ μηνὶ
  choice: mês após mês
  rationale: Reproduz de modo idiomático a repetição distributiva e a recorrência mensal enfatizada pelo grego.
- source_word: ἐν ταῖς πόλεσιν
  choice: nas cidades
  rationale: É a correspondência direta e natural para a expressão grega, sem acrescentar uma ideia explícita de extensão territorial.
