  text: And he took the silver and the gold[a], and the precious vessels[b]; and he took the hidden treasures that he found.
translation:
  language: pt
  text: E tomou a prata, o ouro e os objetos valiosos[a]; tomou também os tesouros escondidos que encontrou.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “objetos desejáveis”; também pode ser traduzido como “utensílios preciosos” ou “vasos preciosos”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode se referir a depósitos ou câmaras secretas de tesouro, e não apenas a riquezas escondidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: tomou
  rationale: Equivalente direto e neutro do aoristo de λαμβάνω; evita acrescentar ideias como “saqueou” ou “levou consigo”, embora o contexto seja de pilhagem.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: a prata, o ouro
  rationale: Os artigos definidos apontam para riquezas específicas; a formulação conserva a concretude do grego e soa natural em português.
- source_word: τὰ σκεύη τὰ ἐπιθυμητά
  choice: os objetos valiosos
  rationale: σκεύη designa objetos, utensílios ou vasos, provavelmente ligados ao templo; ἐπιθυμητά significa literalmente “desejáveis”. “Objetos valiosos” comunica de modo natural o sentido contextual sem restringir indevidamente o tipo de peça.
- source_word: τοὺς θησαυροὺς τοὺς ἀποκρύφους
  choice: os tesouros escondidos
  rationale: Preserva o sentido principal de riquezas ocultas, mantendo em nota a possibilidade lexical de depósitos ou câmaras de tesouro.
- source_word: οὓς εὗρεν
  choice: que encontrou
  rationale: Tradução direta e idiomática da oração relativa grega.
