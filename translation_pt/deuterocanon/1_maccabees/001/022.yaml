translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita o tradicionalismo pouco transparente de «pães da proposição», mas conserva a referência cultual por meio de uma explicitação breve. A coordenação segue o ritmo de inventário do grego; o ponto e vírgula marca a transição para a ação final.
