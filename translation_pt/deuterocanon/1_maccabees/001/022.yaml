  text: and the table for the presentation of the bread[b][a], and the libation vessels and the bowls and the golden censers and the curtain and the crowns and the gold decoration on the front of the temple—and he stripped it all off.
translation:
  language: pt
  text: E a mesa dos pães apresentados diante de Deus[a], os vasos para libações, as tigelas, os incensários de ouro, a cortina, as coroas e a ornamentação de ouro na fachada do templo; e retirou tudo isso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a mesa da apresentação» ou «a mesa dos pães da Presença». O grego se refere literalmente à mesa ligada à colocação dos pães diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego pode significar «descascou» ou «despojou», sugerindo a retirada de revestimentos ou adornos, provavelmente de ouro.
    reason: lexical_alternative
lexical_decisions:
- source_word: τράπεζαν τῆς προθέσεως
  choice: a mesa dos pães apresentados diante de Deus
  rationale: A expressão designa a mesa ligada à colocação ritual dos pães perante Deus. A tradução explicita a função cultual em português claro, sem depender do termo tradicional menos transparente «pães da proposição».
- source_word: σπονδεῖα
  choice: os recipientes para as ofertas derramadas
  rationale: O termo se refere a utensílios usados em libações. «Ofertas derramadas» comunica em linguagem acessível a natureza do rito, enquanto «recipientes» evita especificar indevidamente o formato.
- source_word: φιάλας
  choice: as tigelas
  rationale: φιάλη indica uma vasilha larga, frequentemente ritual; «tigelas» é uma correspondência simples e compreensível.
- source_word: θυΐσκας τὰς χρυσᾶς
  choice: os incensários de ouro
  rationale: O substantivo designa utensílios para queimar incenso, e χρυσᾶς indica seu material. «Incensários de ouro» é preciso e corrente no registro bíblico.
- source_word: καταπέτασμα
  choice: a cortina
  rationale: O termo designa uma cortina ou véu do templo. «Cortina» é moderno e acessível, sem excluir a função de separação cultual.
- source_word: στεφάνους
  choice: as coroas
  rationale: Mantém o sentido básico de στεφάνοι. No inventário do templo, provavelmente se trata de ornamentos em forma de coroa, mas o texto não explicita isso.
- source_word: κόσμον τὸν χρυσοῦν
  choice: a ornamentação de ouro
  rationale: κόσμος significa aqui adorno ou ornamentação, não «mundo». A expressão portuguesa preserva o caráter decorativo e o material.
- source_word: κατὰ πρόσωπον τοῦ ναοῦ
  choice: na fachada do templo
  rationale: No contexto de ornamentação arquitetônica, a expressão aponta naturalmente para a parte frontal do templo. «Diante do templo» permanece uma possibilidade mais literal.
- source_word: ἐλέπισεν πάντα
  choice: arrancou tudo isso
  rationale: O verbo sugere descascar, retirar ou despojar uma camada. «Arrancou» comunica a remoção forçada da ornamentação ou do revestimento, e «tudo isso» retoma o conjunto mencionado.
