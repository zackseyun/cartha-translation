lexical_decisions:
- source_word: ἐγένετο
  choice: houve
  rationale: Forma narrativa e existencial natural em português, que preserva o sentido de que o luto se instaurou sem reproduzir de modo rígido «veio a ser».
- source_word: πένθος μέγα
  choice: grande luto
  rationale: «Luto» expressa a aflição coletiva causada pela calamidade, mantendo-se próximo do substantivo grego πένθος e de sua intensidade.
- source_word: ἐπὶ Ἰσραήλ
  choice: sobre Israel
  rationale: Preserva a imagem da aflição que recai sobre Israel, correspondente à força direcional de ἐπί, sem reduzi-la simplesmente a uma localização.
- source_word: ἐν παντὶ τόπῳ αὐτῶν
  choice: em todos os lugares onde habitavam
  rationale: Formulação portuguesa natural que comunica a distribuição do luto pelas localidades do povo; a relação exata expressa por αὐτῶν permanece esclarecida na nota.
