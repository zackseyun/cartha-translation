lexical_decisions:
- source_word: κωλῦσαι
  choice: proibir
  rationale: No contexto de um decreto oficial, expressa melhor uma proibição do que mero impedimento físico.
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: Termo cultual consagrado em português para ofertas inteiramente consumidas pelo fogo; a nota esclarece o sentido para o leitor moderno.
- source_word: θυσίας
  choice: sacrifícios
  rationale: Preserva o termo sacrificial amplo e sua distinção em relação aos holocaustos e às libações.
- source_word: σπονδὴν
  choice: libações
  rationale: Designa com precisão as ofertas rituais de bebida. O plural é natural em português numa enumeração de práticas cultuais proibidas em geral.
- source_word: ἐκ τοῦ ἁγιάσματος
  choice: no santuário
  rationale: Com o verbo 'proibir', comunica naturalmente que esses ritos não poderiam ocorrer no santuário. A nota preserva a forma mais literal e a nuance de exclusão expressa por ἐκ.
- source_word: βεβηλῶσαι
  choice: profanar
  rationale: Expressa tratar como comum ou não santo aquilo que é sagrado, mantendo a força cultual do verbo.
- source_word: σάββατα
  choice: os sábados
  rationale: Preserva o plural grego e se refere à observância sabática de modo geral.
- source_word: ἑορτάς
  choice: as festas
  rationale: Termo claro e tradicional para as celebrações do calendário religioso de Israel.
theological_decisions:
- issue: Terminologia cultual dos ritos do templo de Israel
  choice: Manter as categorias específicas 'holocaustos', 'sacrifícios' e 'libações'.
  alternative: Generalizar como 'ofertas' ou 'atos de culto'.
  rationale: O texto enumera práticas concretas que seriam suprimidas. Preservar as distinções reproduz a preocupação do original com o sistema sacrificial de Israel sem acrescentar conclusões teológicas posteriores.
- issue: Relação de ἐκ τοῦ ἁγιάσματος com a proibição
  choice: Traduzir idiomaticamente 'proibir no santuário', registrando em nota a expressão literal 'do santuário'.
  alternative: Traduzir no corpo do texto 'suprimir do santuário' ou 'proibir do santuário'.
  rationale: A formulação escolhida torna claro em português que os ritos foram proibidos naquele espaço, enquanto a nota conserva a nuance grega de exclusão sem forçar uma construção pouco natural.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a sintaxe coordenada do contexto e a vírgula final por se tratar de continuação da frase iniciada no versículo anterior. A terminologia cultual específica é preservada e explicada de modo breve em notas.
