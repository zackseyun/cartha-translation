base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/030.yaml
  text: And he spoke peaceful words to them with deceit[a], and they trusted him; then he fell upon the city suddenly, struck it a great blow[b], and destroyed many people from Israel.
translation:
  language: pt
  text: Ele lhes falou palavras de paz com engano,[a] e eles confiaram nele. Então, de repente, ele atacou a cidade, desferiu contra ela um grande golpe e matou muitos do povo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “palavras pacíficas de modo enganoso”. A expressão indica que ele falou em tom conciliatório, mas com intenção enganosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησεν αὐτοῖς λόγους εἰρηνικούς
  choice: lhes falou palavras de paz
  rationale: Mantém a construção verbal e traduz o adjetivo como uma expressão portuguesa natural, indicando fala conciliatória sem afirmar que a paz era genuína.
- source_word: ἐν δόλῳ
  choice: com engano
  rationale: Preserva o substantivo e apresenta o engano como o modo pelo qual ele proferiu as palavras de paz.
- source_word: ἐπίστευσαν αὐτῷ
  choice: confiaram nele
  rationale: No contexto, o verbo descreve confiança prática nas garantias enganosas, não fé em sentido teológico.
- source_word: ἐπέπεσεν ἐπὶ τὴν πόλιν ἐξαίφνα
  choice: de repente, ele atacou a cidade
  rationale: Explicita de modo natural em português o valor hostil de ἐπιπίπτω e preserva a súbita irrupção expressa pelo advérbio.
- source_word: ἐπάταξεν αὐτὴν πληγὴν μεγάλην
  choice: desferiu contra ela um grande golpe
  rationale: Reproduz a imagem e a intensidade do idioma grego sem restringir πληγή a 'massacre'.
- source_word: ἀπώλεσεν λαὸν πολὺν ἐξ Ἰσραήλ
  choice: matou muitos do povo de Israel
  rationale: Com seres humanos como objeto e num contexto de ataque, ἀπόλλυμι tem sentido letal. A formulação portuguesa identifica naturalmente as vítimas como israelitas.
theological_decisions:
- issue: Sentido de ἐπίστευσαν em narrativa não teológica
  choice: confiaram nele
  alternative: acreditaram nele
  rationale: A escolha comunica que aceitaram suas garantias de paz, evitando introduzir conotações doutrinárias de fé.
- issue: Força de ἀπώλεσεν aplicado às vítimas israelitas
  choice: matou
  alternative: destruiu
  rationale: O contexto de ataque violento e o objeto humano favorecem o sentido de causar a morte; 'destruiu' seria formalmente possível, mas menos natural em português neste contexto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. Evitou-se o pouco natural 'caiu sobre a cidade' e também linguagem arcaica. A pontuação divide a longa coordenação grega sem alterar a sequência dos acontecimentos.
