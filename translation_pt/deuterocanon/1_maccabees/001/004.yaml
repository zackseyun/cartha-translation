  text: And he gathered a very strong force[a], and began to rule over lands and nations and dominions[b], and they became tributary to him.
translation:
  language: pt
  text: Ele reuniu uma força militar muito poderosa e passou a governar[a] terras, nações e domínios[b], e eles passaram a pagar-lhe tributo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “governou” ou “exerceu domínio sobre”. O verbo grego denota o exercício do governo; neste contexto, “passou a governar” explicita uma possível nuance de início, embora o aoristo não a exija por si só.
    reason: lexical_alternative
  - marker: b
    text: O termo grego refere-se mais especificamente a governos ou territórios governados por tiranos; traduções mais formais seriam “tiranias” ou “despotismos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆξεν
  choice: reuniu
  rationale: O aoristo de συνάγω descreve aqui a mobilização de recursos militares. “Reuniu” mantém o sentido concreto e é natural em português.
- source_word: δύναμιν
  choice: uma força militar
  rationale: Neste contexto, δύναμις indica poderio ou contingente armado. “Força militar” explicita o sentido contextual sem restringi-lo necessariamente a um exército regular.
- source_word: ἰσχυρὰν σφόδρα
  choice: muito poderosa
  rationale: A combinação do adjetivo com o advérbio é intensiva. “Muito poderosa” comunica a ênfase de modo natural e digno.
- source_word: ἦρξεν
  choice: governou
  rationale: Com os genitivos seguintes, ἄρχω significa exercer governo ou domínio sobre. O aoristo simples não exige por si só a tradução ingressiva “começou a governar”, embora o contexto possa permitir essa compreensão.
- source_word: χωρῶν
  choice: terras
  rationale: χώρα designa terras, territórios ou regiões. “Terras” evita projetar a ideia moderna de Estados nacionais.
- source_word: ἐθνῶν
  choice: nações
  rationale: ἔθνη refere-se aqui a povos ou nações submetidos ao conquistador. “Nações” é claro e adequado ao contexto histórico.
- source_word: τυραννιῶν
  choice: domínios
  rationale: O termo designa governos ou territórios sob a autoridade de tiranos. “Domínios” é mais natural em português no contexto de uma lista de entidades conquistadas, enquanto a nota preserva a especificidade do grego.
- source_word: ἐγένοντο αὐτῷ εἰς φόρον
  choice: ficaram sujeitos a lhe pagar tributo
  rationale: A expressão indica que passaram a uma condição de sujeição tributária. A formulação portuguesa preserva tanto a mudança de condição quanto a obrigação fiscal-política.
