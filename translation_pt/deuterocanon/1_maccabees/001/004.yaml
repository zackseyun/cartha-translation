  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Força militar” evita a ambiguidade excessiva de “força” isoladamente; “lhe pagar tributo” é corrente no português brasileiro sem deixar de ser amplamente compreensível.
