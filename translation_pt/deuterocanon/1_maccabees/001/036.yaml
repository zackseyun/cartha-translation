  yaml_path: translation/deuterocanon/1_maccabees/001/036.yaml
  text: And it became an ambush against the sanctuary[a], and a wicked adversary against Israel continually.
translation:
  language: pt
  text: E tornou-se uma emboscada contra o santuário e um adversário perverso[a] contra Israel sem cessar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um caluniador perverso». O grego διάβολος pode designar um caluniador ou adversário; neste contexto de hostilidade, «adversário» parece mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: tornou-se
  rationale: Expressa o desenvolvimento para um novo estado ou função, sem reduzir o verbo a uma simples cópula.
- source_word: εἰς ἔνεδρον
  choice: uma emboscada
  rationale: Preserva a imagem militar de uma força posta à espreita para atacar.
- source_word: τῷ ἁγιάσματι
  choice: contra o santuário
  rationale: No contexto do templo de Jerusalém, «santuário» traduz naturalmente o lugar consagrado; «contra» explicita a relação hostil indicada pela construção.
- source_word: εἰς διάβολον πονηρόν
  choice: um adversário perverso
  rationale: O substantivo comum διάβολος descreve aqui a função hostil da fortaleza ou guarnição, enquanto πονηρός acrescenta uma avaliação moral negativa; a tradução evita tratá-lo como título de um ser sobrenatural.
- source_word: τῷ Ἰσραήλ
  choice: de Israel
  rationale: Com «adversário», a construção portuguesa idiomática «adversário de» comunica a relação de oposição expressa pelo dativo grego.
- source_word: διὰ παντός
  choice: sem cessar
  rationale: Reproduz de modo natural e enfático a ideia de continuidade constante.
theological_decisions:
- issue: Se διάβολον deve ser entendido como título («Diabo») ou como substantivo comum
  choice: 'substantivo comum: «adversário»'
  alternative: «caluniador» ou «Diabo»
  rationale: O contexto histórico e militar apresenta a cidadela ou guarnição como força hostil a Israel, não identifica um ser sobrenatural. «Adversário» preserva esse sentido contextual, enquanto a nota registra a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe concisa. A metáfora militar «emboscada» e a continuidade de «sem cessar» foram preservadas. O marcador da nota foi colocado junto a «adversário perverso», termo ao qual a alternativa lexical se refere.
