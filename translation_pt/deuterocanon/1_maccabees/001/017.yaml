  text: And he entered Egypt with a heavy force, with chariots and elephants and horsemen and a great fleet.
translation:
  language: pt
  text: E ele entrou no Egito com uma força poderosa, com carros, elefantes, cavaleiros e uma grande frota.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande aparato militar” ou “uma grande força expedicionária”. O termo grego pode designar mais amplamente equipamento militar ou uma expedição armada, embora “frota” se ajuste bem ao contexto desta campanha.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: Tradução direta do aoristo de εἰσέρχομαι; evita explicitar como “invadiu” a hostilidade que o contexto militar já sugere.
- source_word: ὄχλῳ βαρεῖ
  choice: com uma força poderosa
  rationale: No contexto militar, ὄχλος designa um contingente ou força, e βαρύς comunica peso, poder ou imponência; “força poderosa” soa natural em português sem reduzir a expressão apenas ao tamanho.
- source_word: ἅρμασιν
  choice: carros
  rationale: Equivalente tradicional e direto de ἅρματα neste contexto militar; “de guerra” está implícito.
- source_word: ἐλέφανσιν
  choice: elefantes
  rationale: Correspondência direta; o uso bélico dos animais é evidente pelo contexto.
- source_word: ἱππεῦσιν
  choice: cavaleiros
  rationale: Equivalente natural de ἱππεῖς, aqui referente a tropas montadas.
- source_word: στόλῳ μεγάλῳ
  choice: uma grande frota
  rationale: στόλος pode designar equipamento militar, expedição armada ou frota; “frota” se ajusta bem à campanha contra o Egito e à enumeração paralela das forças terrestres, embora a amplitude lexical seja preservada em nota.
