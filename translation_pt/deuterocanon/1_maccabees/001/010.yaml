  yaml_path: translation/deuterocanon/1_maccabees/001/010.yaml
  text: And from them came forth a sinful root[a], Antiochus Epiphanes, son of King Antiochus, who had been a hostage in Rome[b]. And he reigned in the one hundred forty-seventh year of the kingdom of the Greeks.
translation:
  language: pt
  text: E deles surgiu uma raiz pecadora[a], Antíoco Epifânio, filho do rei Antíoco, que era refém em Roma. Ele começou a reinar no ano cento e quarenta e sete do reino dos gregos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “uma raiz perversa” ou “um rebento pecador”. O grego conserva literalmente a metáfora vegetal: “raiz”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, segundo o sistema de datação da era selêucida, aqui chamado de “reino dos gregos”.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ αὐτῶν
  choice: deles surgiu
  rationale: Expressa a procedência a partir do grupo ou linhagem mencionado anteriormente e, em português corrente, introduz com naturalidade a imagem vegetal que vem a seguir.
- source_word: ῥίζα ἁμαρτωλός
  choice: uma raiz pecadora
  rationale: Mantém literalmente a metáfora de ῥίζα, sem reduzi-la a “homem” ou “descendente”, e traduz o adjetivo moral ἁμαρτωλός sem intensificá-lo indevidamente.
- source_word: Ἀντίοχος Ἐπιφανής
  choice: Antíoco Epifânio
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis do nome e do epíteto.
- source_word: ὅμηρα
  choice: como refém
  rationale: Representa o sentido político de alguém mantido como garantia; a formulação portuguesa concorda naturalmente com o referente singular.
- source_word: ἐβασίλευσεν
  choice: começou a reinar
  rationale: O aoristo, associado à data indicada, assinala aqui a ascensão ao trono; esta formulação preserva o verbo “reinar” e torna claro o caráter ingressivo.
- source_word: ἔτει ἑκατοστῷ καὶ ἑβδόμῳ καὶ τεσσαρακοστῷ
  choice: no ano cento e quarenta e sete
  rationale: Reproduz a fórmula cronológica grega em português claro e idiomático.
- source_word: βασιλείας Ἑλλήνων
  choice: do reino dos gregos
  rationale: Conserva a moldura política e a forma de datação do texto, sem substituí-la no corpo por uma identificação histórica interpretativa.
theological_decisions:
- issue: Caracterização moral metafórica em ῥίζα ἁμαρτωλός
  choice: Conservar a metáfora como “uma raiz pecadora”
  alternative: Substituir por “um homem pecador”, “um rebento perverso” ou “uma raiz de pecado”
  rationale: A metáfora introduz Antíoco com a avaliação moral própria do narrador. Preservá-la mantém a força literária e evita tanto achatar a imagem quanto intensificar a censura além do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a imagem e a sequência narrativa do grego sem rigidez excessiva. A nota cronológica foi colocada junto à expressão que explica.
