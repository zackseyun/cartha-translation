  source_fidelity: A tradução preserva bem a estrutura, a metáfora de ῥίζα ἁμαρτωλός, o nome e a fórmula cronológica. Contudo, “estivera como refém” introduz um mais-que-perfeito que o imperfeito ἦν não exprime diretamente; “era refém” corresponde de modo mais próximo ao grego.
  naturalness: O português é moderno, claro e adequado. “Uma raiz pecadora” é uma metáfora deliberadamente incomum, mas isso é apropriado, pois conserva a imagem vegetal do original. A pequena correção verbal melhora a precisão sem prejudicar a fluência.
  terminology: “Antíoco Epifânio”, “rei Antíoco”, “refém” e “reino dos gregos” são escolhas adequadas. “Começou a reinar” é uma representação aceitável do aoristo em uma fórmula de ascensão régia datada.
