  yaml_path: translation/deuterocanon/1_maccabees/001/051.yaml
  text: According to all these words he wrote to his whole kingdom[a], and he appointed overseers over all the people; and he commanded the cities of Judah to offer sacrifices, city by city.
translation:
  language: pt
  text: De acordo com todas essas palavras, ele escreveu ao seu reino, nomeou supervisores sobre todo o povo e ordenou às cidades de Judá que oferecessem sacrifícios, cidade por cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πάντας τοὺς λόγους τούτους
  choice: De acordo com todas essas determinações
  rationale: A expressão indica conformidade com o conteúdo das ordens reais. “Determinações” comunica naturalmente o valor oficial de λόγοι neste contexto, enquanto a nota preserva o sentido literal de “palavras”.
- source_word: ἔγραψεν τῇ βασιλείᾳ αὐτοῦ
  choice: ele escreveu ao seu reino
  rationale: O dativo apresenta o reino como destinatário da comunicação escrita. Não se acrescenta “todo”, pois essa palavra não está expressa no grego, embora o contexto indique alcance amplo.
- source_word: ἐποίησεν ἐπισκόπους
  choice: nomeou supervisores
  rationale: Neste contexto, ἐπίσκοποι designa agentes administrativos encarregados de supervisão. “Supervisores” evita a leitura anacrônica de um ofício eclesiástico.
- source_word: ἐπὶ πάντα τὸν λαόν
  choice: sobre todo o povo
  rationale: A preposição com acusativo exprime aqui autoridade ou jurisdição, preservada pela construção “sobre todo o povo”.
- source_word: ἐνετείλατο
  choice: ordenou
  rationale: O verbo expressa uma ordem dotada de autoridade, adequada ao contexto de imposição real.
- source_word: ταῖς πόλεσιν Ἰούδα
  choice: às cidades de Judá
  rationale: Tradução direta da designação geográfica e política, em formulação natural em português.
- source_word: θυσιάζειν
  choice: que oferecessem sacrifícios
  rationale: A locução explicita de modo idiomático a ação cultual indicada pelo infinitivo grego.
- source_word: κατὰ πόλιν καὶ πόλιν
  choice: cidade por cidade
  rationale: 'A expressão reproduz a força distributiva do grego: a ordem deveria ser cumprida em cada cidade.'
theological_decisions:
- issue: Possível leitura eclesiástica anacrônica de ἐπισκόπους
  choice: supervisores
  alternative: bispos
  rationale: A passagem trata de agentes nomeados pelo rei para impor suas ordens ao povo, não de um cargo da igreja. “Supervisores” conserva o sentido funcional sem introduzir conotações eclesiásticas posteriores.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e alguma correspondência formal. Evitou-se acrescentar “todo” a “reino”, pois essa expansão não está explícita no texto grego; o alcance geral já aparece no restante do versículo.
