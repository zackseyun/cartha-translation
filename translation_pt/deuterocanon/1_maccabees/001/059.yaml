  yaml_path: translation/deuterocanon/1_maccabees/001/059.yaml
  text: And on the twenty-fifth day of the month they were sacrificing on the altar that was upon the altar of burnt offering[a].
translation:
  language: pt
  text: E no vigésimo quinto dia do mês, eles ofereciam sacrifícios sobre o altar que estava em cima do altar dos holocaustos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega aqui duas palavras diferentes: “altar” (βωμός) e “altar dos holocaustos” (θυσιαστήριον), preservando a distinção entre o altar sobre o qual sacrificavam e o altar sobre o qual ele estava colocado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτῃ καὶ εἰκάδι
  choice: no vigésimo quinto dia
  rationale: A expressão grega indica o vigésimo quinto dia do mês; a formulação é natural e precisa em português moderno.
- source_word: τοῦ μηνός
  choice: do mês
  rationale: O genitivo integra a fórmula de data e corresponde naturalmente a “do mês”.
- source_word: θυσιάζοντες
  choice: eles ofereciam sacrifícios
  rationale: O particípio foi expresso por uma forma verbal finita para dar fluidez narrativa, mantendo o aspecto durativo ou repetido da ação.
- source_word: ἐπὶ τὸν βωμόν
  choice: sobre o altar
  rationale: ἐπί com acusativo indica aqui que os sacrifícios eram oferecidos sobre a superfície do altar.
- source_word: βωμός
  choice: altar
  rationale: O termo designa um altar e é mantido sem qualificá-lo como pagão, algo plausível pelo contexto, mas não explícito neste versículo.
- source_word: θυσιαστήριον
  choice: altar dos holocaustos
  rationale: A expressão distingue este altar do βωμός mencionado antes e identifica de modo claro o altar sacrificial já estabelecido no templo.
theological_decisions:
- issue: Distinção entre βωμός e θυσιαστήριον no contexto da profanação
  choice: Traduzir βωμός por “altar” e θυσιαστήριον por “altar dos holocaustos”
  alternative: Traduzir ambos apenas por “altar”, ou explicitar o primeiro como “altar pagão”
  rationale: O grego emprega dois termos cultuais diferentes e parece descrever um altar colocado sobre o altar principal do templo. A tradução preserva essa distinção sem inserir no texto principal a qualificação interpretativa “pagão”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ofereciam sacrifícios” soa mais natural do que “sacrificavam” neste contexto cultual, e “em cima de” preserva com clareza a disposição física expressa no grego.
