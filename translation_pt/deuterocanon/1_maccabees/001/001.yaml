base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/001.yaml
  text: And it happened[a], after Alexander the Macedonian, the son of Philip, who had come out from the land of Kittim, struck down Darius king of the Persians and Medes, that he reigned in his place[b], having first reigned over Greece.
translation:
  language: pt
  text: E aconteceu que, depois que Alexandre, o macedônio, filho de Filipe, que havia saído da terra de Quitim[a], derrotou[b] Dario, rei dos persas e dos medos, ele reinou em seu lugar, tendo antes reinado sobre a Grécia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quitim é um topônimo bíblico tradicional. Conforme o contexto, pode designar mais especificamente Chipre ou, de maneira mais ampla, terras do Ocidente.
    reason: cultural_note
  - marker: b
    text: Literalmente, «feriu» ou «abateu» Dario.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa grega em português atual e digno, sem recorrer ao arcaísmo «E sucedeu que».
- source_word: μετὰ τὸ πατάξαι
  choice: depois que ... derrotou
  rationale: A construção com μετά e infinitivo indica sequência temporal. No contexto militar, «derrotou» comunica naturalmente o resultado de πατάσσω.
- source_word: Ἀλέξανδρον τὸν Φιλίππου τὸν Μακεδόνα
  choice: Alexandre, o macedônio, filho de Filipe
  rationale: Mantém tanto a identificação geográfica quanto a filiação, em ordem natural para leitores de língua portuguesa.
- source_word: ἐξῆλθεν ἐκ τῆς γῆς Χεττιείμ
  choice: havia saído da terra de Quitim
  rationale: O mais-que-perfeito composto assinala que essa saída antecedeu a derrota de Dario; «saído da terra de» conserva o sentido direcional do grego.
- source_word: Χεττιείμ
  choice: Quitim
  rationale: Emprega a forma tradicional do topônimo bíblico em português e evita identificá-lo de maneira excessivamente específica com Chipre, Macedônia ou o Ocidente.
- source_word: ἐπάταξεν
  choice: derrotou
  rationale: No contexto de conquista militar, «derrotou» é idiomático e claro; uma nota registra o sentido mais literal, «feriu» ou «abateu».
- source_word: ἐβασίλευσεν ἀντʼ αὐτοῦ
  choice: reinou em seu lugar
  rationale: Expressa a sucessão de Alexandre ao domínio de Dario e conserva a nuance monárquica de βασιλεύω.
- source_word: πρότερον ἐπὶ τὴν Ἑλλάδα
  choice: tendo antes reinado sobre a Grécia
  rationale: Toma πρότερον em sentido temporal e mantém explícita a ideia de que o reinado sobre a Grécia precedeu o domínio assumido após Dario.
theological_decisions:
- issue: Identificação histórico-geográfica de Χεττιείμ
  choice: Quitim
  alternative: Chipre, Macedônia ou terras ocidentais
  rationale: O texto grego conserva o topônimo bíblico tradicional, cuja referência pode variar conforme o contexto. A tradução não resolve uma ambiguidade histórica que o original deixa aberta.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A frase longa do original foi preservada sem arcaísmos, e os marcadores [a] e [b] aparecem junto aos termos que explicam.
