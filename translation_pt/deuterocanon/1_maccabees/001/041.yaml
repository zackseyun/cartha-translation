lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu
  rationale: O aoristo de γράφω tem o sentido comum de “escrever”. Embora o contexto seja o de uma ordem real, traduzir por “decretou” acrescentaria uma especificidade não expressa diretamente pelo verbo grego.
- source_word: πάσῃ τὴν βασιλεία αὐτοῦ
  choice: a todo o seu reino
  rationale: A formulação grega designa a totalidade dos domínios do rei como destinatária ou âmbito da ordem. “A todo o seu reino” mantém a construção direta e é natural em português.
- source_word: εἶναι πάντας
  choice: que todos se tornassem
  rationale: O infinitivo apresenta o conteúdo da ordem. Com εἰς λαὸν ἕνα, “se tornassem” comunica adequadamente a passagem para uma condição unificada, embora o grego use literalmente o verbo “ser”.
- source_word: εἰς λαὸν ἕνα
  choice: um só povo
  rationale: λαός indica aqui um povo como corpo social ou político. “Um só povo” exprime a unificação pretendida e evita o tom político moderno que “uma só nação” poderia introduzir.
theological_decisions:
- issue: Sentido político-étnico de λαός
  choice: um só povo
  alternative: uma só nação
  rationale: O contexto trata da assimilação imperial, não de uma afirmação sobre o povo da aliança. “Povo” preserva o sentido social e político sem importar uma distinção teológica posterior.
- issue: Valor de εἶναι na ordem de unificação
  choice: se tornassem
  alternative: fossem
  rationale: A construção com εἰς sugere movimento rumo a uma condição comum. “Se tornassem” explicita essa força assimiladora, enquanto a nota conserva a tradução mais estritamente literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das notas segue os marcadores no texto. A tradução mantém “escreveu” em vez de explicitar “decretou” e preserva em nota a ambiguidade entre “ser” e “tornar-se”.
