  text: And the king wrote to all his kingdom that all should become one people[b][a],
translation:
  language: pt
  text: E o rei escreveu a todo o seu reino que todos se tornassem um só povo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a todo o reino dele” ou “por todo o seu reino”. A expressão grega indica a totalidade dos domínios do rei como destinatária ou âmbito da ordem.'
    reason: lexical_alternative
  - marker: b
