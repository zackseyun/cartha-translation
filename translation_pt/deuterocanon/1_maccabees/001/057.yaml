  source_fidelity: A tradução reproduz adequadamente as duas condições alternativas, a posse de um «livro da aliança» e a adesão à lei, bem como o caráter oficial e letal da decisão real. Contudo, «determinava que essa pessoa fosse morta» desloca ligeiramente a ação expressa por ἐθάνατου, que atribui à sentença/decreto a condenação à morte. «Condenava ... à morte» preserva melhor essa força sem especificar o método de execução.
  naturalness: O português é claro e de registro apropriado. Reordenar «um livro da aliança» antes de «em poder de alguém» torna a primeira oração mais fluida. A nota b também precisa de uma formulação sintaticamente completa e natural.
  terminology: «Aliança» traduz corretamente διαθήκη; «lei» mantém a economia do grego, embora o contexto se refira à lei judaica. «Sentença do rei» é uma opção natural para τὸ σύγκριμα τοῦ βασιλέως no contexto penal e evita enfraquecer a ação verbal.
