base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/057.yaml
  text: And wherever a book of the covenant was found with anyone[a], or if anyone consented to the law[b], the king’s decree put him to death.
translation:
  language: pt
  text: Onde quer que se encontrasse um livro da aliança[a] em poder de alguém, ou se alguém se mostrasse favorável à lei[b], a sentença do rei condenava essa pessoa à morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um documento da aliança” ou “um livro da Lei/aliança”. O grego diz literalmente “um livro da aliança”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, que alguém se alinhava com a lei judaica ou permanecia fiel a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: onde quer que
  rationale: Reproduz o valor distributivo e indefinido da expressão, indicando a aplicação da medida em qualquer lugar.
- source_word: εὑρίσκετο
  choice: se encontrasse
  rationale: O imperfeito passivo descreve ocorrências repetidas ou habituais; esta construção é natural em português.
- source_word: παρὰ τινι
  choice: em poder de alguém
  rationale: No contexto, a preposição indica posse ou custódia, não mera proximidade física.
- source_word: βιβλίον διαθήκης
  choice: um livro da aliança
  rationale: Mantém a formulação concreta e a ressonância bíblica de διαθήκη, sem identificar de modo mais estreito o tipo exato de documento.
- source_word: συνευδόκει
  choice: se mostrasse favorável
  rationale: Expressa aprovação, apoio ou alinhamento, sem reduzir o verbo a mero assentimento intelectual.
- source_word: τῷ νόμῳ
  choice: à lei
  rationale: O contexto aponta para a lei judaica ancestral, mas a tradução evita acrescentar uma identificação que o grego não explicita.
- source_word: τὸ σύγκριμα τοῦ βασιλέως
  choice: o decreto do rei
  rationale: σύγκριμα designa aqui uma decisão ou determinação oficial do rei com força penal.
- source_word: ἐθάνατου αὐτόν
  choice: determinava que essa pessoa fosse morta
  rationale: Conserva a força causativa e judicial do verbo — levar alguém à morte por decisão oficial — em uma construção portuguesa natural.
theological_decisions:
- issue: Referência de τῷ νόμῳ
  choice: “a lei”, entendida contextualmente como a lei judaica ancestral
  alternative: “a Lei de Moisés” ou “a Torá”
  rationale: O contexto identifica a lei em questão, mas o texto grego não traz os qualificadores “de Moisés” nem “Torá”; a forma simples preserva essa economia e evita explicitação doutrinária desnecessária.
- issue: Relação entre possuir o livro e apoiar a lei
  choice: duas condições alternativas de condenação, ligadas por “ou”
  alternative: condições cumulativas ligadas por “e”
  rationale: Embora a sequência grega use καί, o segundo membro introduz outra circunstância suficiente para a pena; “ou” comunica com clareza essa relação disjuntiva no contexto, sem exigir que ambas as condições se cumpram juntas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Em poder de alguém” torna explícito o sentido possessivo da locução grega; “essa pessoa” evita o masculino genérico no segundo membro sem alterar o referente indefinido.
