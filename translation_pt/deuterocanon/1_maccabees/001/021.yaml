lexical_decisions:
- source_word: ἁγίασμα
  choice: santuário
  rationale: Designa um lugar sagrado. “Santuário” é natural no contexto do templo e evita especificar uma câmara particular além do que o grego exige.
- source_word: ἐν ὑπερηφανίᾳ
  choice: com arrogância
  rationale: Expressa a maneira da entrada e conserva a forte avaliação moral do substantivo grego.
- source_word: θυσιαστήριον τὸ χρυσοῦν
  choice: altar de ouro
  rationale: É uma formulação portuguesa natural e corresponde diretamente ao substantivo acompanhado do adjetivo grego.
- source_word: λυχνίαν τοῦ φωτός
  choice: candelabro da luz
  rationale: Mantém a relação genitiva explícita no grego sem omitir a referência à luz.
- source_word: σκεύη
  choice: utensílios
  rationale: Refere-se aos objetos ou implementos associados ao candelabro; “utensílios” é concreto, claro e adequado ao contexto cultual.
theological_decisions:
- issue: Se ἁγίασμα deve ser traduzido de modo mais específico para indicar determinada câmara do templo
  choice: santuário
  alternative: lugar santo
  rationale: O termo grego identifica um espaço sagrado, mas não obriga a tradução a definir com precisão técnica qual recinto está em vista. “Santuário” conserva essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação simples acompanha o ritmo narrativo do grego; a vírgula final foi mantida porque o versículo continua a enumeração na sequência.
