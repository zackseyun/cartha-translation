  text: And he entered the sanctuary in arrogance[a], and took the golden altar, and the lampstand of the light with all its utensils,
translation:
  language: pt
  text: E ele entrou no santuário[a] com arrogância e tomou o altar de ouro, o candelabro da luz e todos os seus utensílios,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lugar santo”.'
