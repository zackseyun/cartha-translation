  yaml_path: translation/deuterocanon/1_maccabees/001/043.yaml
  text: And many from Israel approved of his worship[a], and they sacrificed to the idols and profaned the Sabbath.
translation:
  language: pt
  text: E muitos de Israel aprovaram o culto dele[a], sacrificaram aos ídolos e profanaram o sábado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se agradaram do culto dele” ou “consentiram com o culto dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: muitos de Israel
  rationale: Expressa naturalmente pessoas pertencentes a Israel e mantém de perto a construção grega com ἀπό.
- source_word: ηὐδόκησαν
  choice: aprovaram
  rationale: No contexto, o verbo indica aceitação deliberada ou consentimento, sem exigir a ideia mais emotiva de sentir prazer.
- source_word: τῇ λατρίᾳ αὐτοῦ
  choice: o culto dele
  rationale: λατρεία designa aqui culto ou observância religiosa. “O culto dele” é claro e preserva a referência ao sistema religioso promovido pelo rei, sem usar o sentido sociológico moderno de “seita”.
- source_word: ἔθυσαν
  choice: sacrificaram
  rationale: Tradução direta e concisa do verbo cultual.
- source_word: τοῖς εἰδώλοις
  choice: aos ídolos
  rationale: No contexto religioso, εἴδωλον se refere a ídolos; a construção portuguesa expressa adequadamente o dativo.
- source_word: ἐβεβήλωσαν
  choice: profanaram
  rationale: Indica tratar como comum ou violar aquilo que é santo; “profanaram” conserva o sentido religioso preciso.
- source_word: τὸ σάββατον
  choice: o sábado
  rationale: Forma corrente em português para o dia santo judaico referido pelo grego.
theological_decisions:
- issue: Sentido de λατρεία no contexto da religião imposta pelo rei
  choice: o culto dele
  alternative: o serviço religioso dele
  rationale: “Culto” mantém o caráter especificamente religioso da expressão sem sugerir mera servidão política nem introduzir linguagem denominacional.
- issue: Nuance volitiva de ηὐδόκησαν
  choice: aprovaram
  alternative: se agradaram de; consentiram com
  rationale: “Aprovaram” comunica adesão consciente. A nota conserva as nuances legítimas de satisfação e consentimento presentes no verbo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A coordenação verbal foi mantida de forma concisa; “sábado” aparece em minúscula segundo o uso ortográfico corrente em português.
