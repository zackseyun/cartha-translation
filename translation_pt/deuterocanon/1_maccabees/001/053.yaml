  text: E puseram Israel em lugares ocultos[a], em todos os seus refúgios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeram Israel esconder-se”. O grego é compacto e pode indicar tanto a colocação em lugares ocultos quanto a condição de estar escondido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθεντο
  choice: puseram
  rationale: Preserva de modo sóbrio o valor causativo e agentivo do aoristo médio de τίθημι, sem intensificá-lo para “expulsaram” ou “forçaram”.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Mantém o singular coletivo do grego, que designa o povo de Israel.
- source_word: ἐν κρυφίοις
  choice: em lugares ocultos
  rationale: Reproduz a imagem locativa compacta do grego e evita decidir além do texto se o foco está no ato de esconder-se ou nos próprios esconderijos.
- source_word: ἐν παντὶ φυγαδευτηρίῳ
  choice: em todos os seus refúgios
  rationale: φυγαδευτήριον designa um lugar de fuga ou refúgio; o singular distributivo com πᾶς é expresso naturalmente em português pelo plural “todos”.
- source_word: αὐτῶν
  choice: seus
  rationale: Conserva a relação possessiva e a ambiguidade formal do pronome, cujo referente mais provável é Israel em sentido coletivo.
