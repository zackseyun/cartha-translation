  yaml_path: translation/deuterocanon/1_maccabees/001/035.yaml
  text: And they stored up weapons and provisions[a], and after gathering the spoils of Jerusalem they deposited them there, and it became a great snare,
translation:
  language: pt
  text: Armazenaram armas e provisões e, depois de reunirem os despojos de Jerusalém,[a] guardaram-nos ali; e isso se tornou uma grande armadilha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os despojos trazidos de Jerusalém”.'
    reason: A relação expressa por “de Jerusalém” pode ser entendida como procedência; a alternativa explicita esse sentido sem alterar o referente.
lexical_decisions:
- source_word: παρέθεντο
  choice: armazenaram
  rationale: No contexto militar, o verbo indica que armas e mantimentos foram colocados em reserva, não apenas postos momentaneamente em algum lugar.
- source_word: ὅπλα
  choice: armas
  rationale: Expressa com clareza o sentido geral de equipamento bélico no contexto.
- source_word: τροφήν
  choice: provisões
  rationale: Embora possa significar literalmente alimento ou sustento, aqui designa mantimentos armazenados para a guarnição.
- source_word: συναγαγόντες
  choice: depois de reunirem
  rationale: Torna explícita, em português natural, a anterioridade do particípio em relação ao ato de guardar os despojos.
- source_word: τὰ σκῦλα
  choice: os despojos
  rationale: Refere-se aos bens tomados à força; “despojos” conserva o teor histórico e o registro digno sem soar excessivamente coloquial.
- source_word: Ἰερουσαλήμ
  choice: de Jerusalém
  rationale: A construção identifica Jerusalém como a procedência ou associação dos despojos. A formulação portuguesa preserva essa relação sem explicação excessiva.
- source_word: ἀπέθεντο
  choice: guardaram-nos
  rationale: Indica que os despojos reunidos foram postos naquele local para ficar armazenados; o pronome retoma claramente “despojos”.
- source_word: ἐκεῖ
  choice: ali
  rationale: Retoma de modo natural o lugar fortificado mencionado no contexto anterior.
- source_word: παγίδα
  choice: armadilha
  rationale: Conserva a metáfora de perigo e captura em linguagem atual e amplamente compreensível.
theological_decisions:
- issue: Referente implícito em καὶ ἐγένετο εἰς μεγάλην παγίδα
  choice: e isso se tornou uma grande armadilha
  alternative: e ela se tornou uma grande armadilha
  rationale: O grego não nomeia novamente o sujeito. “Isso” preserva a possibilidade de referência ao lugar fortificado ou à situação criada, sem decidir silenciosamente entre elas.
- issue: Força metafórica de μεγάλην παγίδα
  choice: uma grande armadilha
  alternative: um grande laço
  rationale: “Armadilha” mantém a imagem ameaçadora e figurada sem especificar antecipadamente quem seria apanhado; “laço” seria possível, mas é menos transparente para muitos leitores atuais.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por termos transparentes. A repetição dos atos de armazenar e guardar reflete os dois verbos gregos distintos, enquanto “isso” evita resolver o referente implícito do último verbo.
