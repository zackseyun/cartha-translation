  text: And the books of the law that they found, they tore to pieces and burned with fire.
translation:
  language: pt
  text: E os livros da Lei que encontraram, rasgaram-nos e queimaram-nos no fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ βιβλία
  choice: os livros
  rationale: βιβλία designa escritos ou livros; “livros” é natural em português e evita especificar “rolos”, formato plausível no contexto, mas não exigido pelo termo grego.
- source_word: τοῦ νόμου
  choice: da Lei
  rationale: νόμος se refere aqui à Lei judaica, a Torá. A inicial maiúscula sinaliza esse referente reconhecível sem acrescentar uma identificação que o texto não explicita.
- source_word: ἃ εὗρον
  choice: que encontravam
  rationale: O aoristo εὗρον pode ser vertido literalmente por “encontraram”, mas, no contexto narrativo de uma ação reiterada contra todos os exemplares localizados, o imperfeito idiomático português “encontravam” expressa naturalmente a relação com os verbos principais.
- source_word: κατασχίσαντες
  choice: rasgavam
  rationale: O particípio indica rasgar ou despedaçar. Coordená-lo como verbo finito reproduz em português natural a ação associada à queima; “rasgavam” preserva o sentido sem acrescentar explicitamente “em pedaços”.
- source_word: ἐνεπύρισαν πυρί
  choice: queimavam no fogo
  rationale: A expressão combina o verbo “queimar” com πυρί, “fogo”. “Queimavam no fogo” mantém a ênfase algo redundante do grego e soa mais natural em português do que “queimavam com fogo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa acessível. A retomada pronominal em “eles os” dá clareza ao objeto anteposto e conserva a ênfase do grego. Não há necessidade de nota textual ou interpretativa.
