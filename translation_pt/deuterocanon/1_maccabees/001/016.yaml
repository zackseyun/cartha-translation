base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/016.yaml
  text: And the kingdom was established before Antiochus[a], and he undertook to rule the land of Egypt, so that he might rule over the two kingdoms.
translation:
  language: pt
  text: O reino ficou consolidado diante de Antíoco[a], e ele se dispôs a reinar sobre a terra do Egito, a fim de reinar sobre os dois reinos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “o reino foi preparado diante de Antíoco”. A formulação grega pode indicar que seu domínio havia sido assegurado antes de ele se voltar contra o Egito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡτοιμάσθη
  choice: ficou consolidado
  rationale: O verbo passivo significa literalmente “foi preparado” ou “ficou pronto”; no contexto político, “ficou consolidado” expressa que o reino estava assegurado antes da campanha contra o Egito, sem ampliar a ideia além do contexto.
- source_word: ἡ βασιλεία
  choice: o reino
  rationale: Embora βασιλεία também possa significar “reinado” ou “poder real”, a referência posterior aos “dois reinos” favorece aqui o sentido político concreto de “reino”.
- source_word: ἐνώπιον Ἀντιόχου
  choice: para Antíoco
  rationale: A expressão significa formalmente “diante de Antíoco”, mas, neste contexto, provavelmente indica que o reino foi preparado ou assegurado para ele. A formulação mais literal é preservada em nota.
- source_word: ὑπέλαβεν
  choice: se dispôs
  rationale: Com o infinitivo βασιλεῦσαι, o verbo indica que Antíoco assumiu ou empreendeu o propósito de reinar sobre o Egito. “Se dispôs” é corrente em português e evita sugerir que ele já havia alcançado esse domínio.
- source_word: βασιλεῦσαι
  choice: a reinar
  rationale: O infinitivo descreve o exercício do poder régio. “Reinar sobre” conserva esse sentido e funciona naturalmente com o território mencionado.
- source_word: γῆς Αἰγύπτου
  choice: a terra do Egito
  rationale: A expressão mantém a referência territorial explícita do grego, em vez de reduzi-la simplesmente a “Egito”.
- source_word: ὅπως
  choice: a fim de
  rationale: A locução introduz com clareza a finalidade do empreendimento de Antíoco.
- source_word: ἐπὶ τὰς δύο βασιλείας
  choice: sobre os dois reinos
  rationale: 'A tradução direta conserva a referência a dois domínios distintos: o reino já governado por Antíoco e o Egito que ele pretendia dominar.'
