  text: And they took the women and the children captive[a], and they took the livestock as plunder.
translation:
  language: pt
  text: E ele levou as mulheres e as crianças para o cativeiro; e eles tomaram os animais de criação como despojo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «tomaram posse dos animais de criação» ou «os herdaram». O verbo grego normalmente se refere a receber ou obter uma posse, mas, neste contexto de conquista, indica que os animais foram tomados como despojo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐχμαλώτευσεν
  choice: levou cativas
  rationale: O verbo descreve capturar e levar pessoas como prisioneiras de guerra. A formulação preserva tanto a coerção quanto o contexto de cativeiro.
- source_word: τὰς γυναῖκας
  choice: as mulheres
  rationale: Embora γυνή também possa significar «esposa», aqui o plural, ao lado das crianças, designa mais naturalmente as mulheres em geral.
- source_word: τὰ τέκνα
  choice: as crianças
  rationale: τέκνα é um termo abrangente para filhos ou crianças, sem limitar o grupo aos meninos.
- source_word: τὰ κτήνη
  choice: os animais
  rationale: κτήνη refere-se a animais mantidos como propriedade. «Os animais» é claro e abrangente neste contexto, sem restringir indevidamente o sentido a gado bovino.
- source_word: ἐκληρονόμησαν
  choice: tomaram ... como despojo
  rationale: O verbo normalmente expressa herdar ou receber como posse, mas, no contexto de conquista, indica que os animais foram apropriados como despojo. A nota preserva o sentido lexical mais literal.
theological_decisions: []
translation_notes:
  register: 'Português atual, digno e acessível. Foi preservada a mudança de número verbal do grego: primeiro o sujeito implícito está no singular («ele levou»), depois no plural («eles tomaram»). O ponto e vírgula torna essa mudança perceptível sem explicá-la no corpo do versículo.'
