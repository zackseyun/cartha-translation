  text: And many from the people gathered to them, everyone who was abandoning the law; and they did evil in the land,
translation:
  language: pt
  text: E muitos do povo se reuniram a eles, todos os que estavam abandonando a Lei; e fizeram o mal na terra,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνηθροίσθησαν ... πρὸς αὐτούς
  choice: se reuniram a eles
  rationale: Reproduz o sentido de ajuntar-se e aderir ao grupo, sem tornar explícita uma lealdade que o grego apenas sugere pelo contexto.
- source_word: πᾶς ὁ ἐγκαταλείπων
  choice: todos os que estavam abandonando
  rationale: Preserva o particípio presente, que apresenta o abandono como ação em curso ou característica do grupo, em vez de simples ato concluído.
- source_word: τὸν νόμον
  choice: a Lei
  rationale: A referência é à Lei judaica como realidade definida; a inicial maiúscula torna essa referência clara em português.
- source_word: ἐποίησαν κακὰ
  choice: fizeram o mal
  rationale: Expressão natural e digna que conserva a avaliação moral ampla do plural grego κακά.
- source_word: ἐν τῇ γῇ
  choice: na terra
  rationale: Mantém a formulação geográfica geral do original sem especificar indevidamente Judeia ou Israel.
theological_decisions:
- issue: Aspecto do abandono da Lei
  choice: estavam abandonando a Lei
  alternative: abandonaram a Lei
  rationale: O particípio presente ἐγκαταλείπων favorece uma ação em andamento ou uma disposição caracterizadora; a tradução evita apresentar necessariamente o abandono como ato pontual e encerrado.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A coordenação e a vírgula final foram mantidas porque o versículo continua sintaticamente no contexto seguinte.
