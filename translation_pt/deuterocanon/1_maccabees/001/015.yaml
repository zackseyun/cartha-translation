  text: and they made themselves foreskins[a], and turned away from the holy covenant, and yoked themselves to the nations, and sold themselves to do evil.
translation:
  language: pt
  text: E fizeram para si prepúcios[a], afastaram-se da santa aliança, atrelaram-se às nações e venderam-se para fazer o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «fizeram para si prepúcios»; isto é, ocultaram ou reverteram a marca visível da circuncisão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν ἑαυτοῖς ἀκροβυστίαν
  choice: fizeram para si prepúcios
  rationale: Preserva a formulação concreta e impactante do grego, literalmente «fizeram para si prepúcio(s)», enquanto a nota esclarece que se trata de ocultar ou reverter a marca visível da circuncisão.
- source_word: ἀπέστησαν
  choice: afastaram-se
  rationale: Expressa abandono ou deserção da aliança em português corrente, sem recorrer ao termo eclesiástico mais técnico «apostataram».
- source_word: διαθήκης ἁγίας
  choice: da santa aliança
  rationale: Embora sem artigo em grego, o contexto aponta para a conhecida aliança santa de Israel; a construção definida é natural em português.
- source_word: ἐζευγίσθησαν
  choice: puseram-se sob o mesmo jugo
  rationale: Mantém a metáfora de serem atrelados por um jugo e explicita de modo natural a associação voluntária com as nações.
- source_word: τοῖς ἔθνεσιν
  choice: as nações
  rationale: Representa diretamente os povos não israelitas e evita a carga teológica adicional que «gentios» pode adquirir.
- source_word: ἐπράθησαν
  choice: venderam-se
  rationale: Entende a forma médio-passiva como autoentrega ou autoescravização deliberada, de acordo com o sentido moral do contexto.
- source_word: τοῦ ποιῆσαι πονηρόν
  choice: para fazer o mal
  rationale: Reproduz com clareza e concisão a construção infinitiva de finalidade ou resultado.
theological_decisions:
- issue: Grau de explicitação do idioma referente à reversão da circuncisão
  choice: Manter no texto a expressão concreta «fizeram para si prepúcios»
  alternative: Traduzir diretamente o sentido como «restauraram seus prepúcios» ou «fizeram-se incircuncisos»
  rationale: A formulação literal preserva a força chocante da imagem e sua ligação com o abandono visível da aliança; a nota fornece o sentido histórico-físico sem substituir a ambiguidade expressiva do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora do jugo e a imagem concreta ligada à circuncisão foram preservadas; a construção «puseram-se sob o mesmo jugo que» evita uma formulação artificial como «jungiram-se às nações».
