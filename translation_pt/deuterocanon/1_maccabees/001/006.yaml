base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/006.yaml
  text: And he called his honored servants[a], who had been brought up with him from youth, and divided his kingdom among them while he was still alive.
translation:
  language: pt
  text: E chamou seus servidores ilustres[a], que haviam sido criados com ele desde a juventude, e repartiu entre eles o seu reino enquanto ainda estava vivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “seus paides”. A palavra pode significar “filhos”, “jovens” ou “servidores”; neste contexto, as descrições “ilustres” e “criados com ele desde a juventude” apontam para cortesãos de confiança, e não para filhos biológicos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: Traduz diretamente o verbo grego, que pode significar chamar ou convocar; “chamou” é natural e não acrescenta uma formalidade ausente do contexto.
- source_word: τοὺς παῖδας αὐτοῦ
  choice: seus servidores
  rationale: παῖς pode designar criança, filho, jovem ou servidor. Aqui, as expressões seguintes os apresentam como figuras distintas criadas com o rei desde a juventude, favorecendo o sentido de servidores ou cortesãos de confiança, não de filhos biológicos.
- source_word: ἐνδόξους
  choice: ilustres
  rationale: O adjetivo indica pessoas de destaque, prestígio ou elevada posição; “ilustres” preserva esse valor social em português corrente e digno.
- source_word: τοὺς συνεκτρόφους αὐτοῦ ἀπὸ νεότητος
  choice: que haviam sido criados com ele desde a juventude
  rationale: συνεκτρόφους descreve pessoas criadas ou educadas junto com alguém. A formulação explicita naturalmente essa relação, e “desde a juventude” conserva a referência temporal de ἀπὸ νεότητος sem determinar de quem era a juventude, como também ocorre no grego.
- source_word: διεῖλεν αὐτοῖς
  choice: repartiu entre eles
  rationale: O verbo significa dividir ou distribuir; com o objeto “reino” e vários destinatários, “repartiu entre eles” expressa claramente a distribuição.
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: o seu reino
  rationale: Embora βασιλεία também possa significar reinado ou poder régio, aquilo que é repartido entre várias pessoas é, neste contexto, o reino como domínio político.
- source_word: ἔτι ζῶντος αὐτοῦ
  choice: enquanto ainda estava vivo
  rationale: A construção temporal enfatiza que a repartição ocorreu antes da morte dele; a tradução é clara e preserva essa ênfase.
