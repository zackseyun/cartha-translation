translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Servidores ilustres” mantém o vínculo lexical com παῖδες e a posição elevada indicada por ἐνδόξους; a nota preserva a amplitude semântica do termo. A expressão “desde a juventude” conserva a leve ambiguidade do grego quanto à pessoa cuja juventude serve de referência.
