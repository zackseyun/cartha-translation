  naturalness: O texto é claro e fluente em português moderno. A coordenação elíptica após «festas» reproduz bem o estilo sentencioso do original. «Em opróbrio» é um pouco mais elevado que a linguagem cotidiana, mas é inteligível, digno e mais preciso no registro bíblico-histórico.
