  text: Her sanctuary was laid waste like a wilderness; her feasts were turned into mourning, her Sabbaths into reproach, her honor into contempt,
translation:
  language: pt
  text: Seu santuário ficou devastado como um deserto; suas festas se transformaram em luto, seus sábados, em opróbrio, e sua honra, em desprezo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἁγίασμα
  choice: santuário
  rationale: Designa o recinto sagrado de Jerusalém; “santuário” conserva de modo natural o sentido cultual.
- source_word: ἠρημώθη
  choice: ficou devastado
  rationale: Expressa o resultado da destruição e da desolação em português atual, preservando a força do passivo grego.
- source_word: ὡς ἔρημος
  choice: como um deserto
  rationale: Mantém a comparação explícita introduzida por ὡς; “deserto” comunica com clareza um lugar ermo e desolado.
- source_word: αἱ ἑορταὶ
  choice: festas
  rationale: Refere-se às celebrações religiosas de Israel; “festas” é conciso, corrente e adequado ao contexto do templo.
- source_word: ἐστράφησαν εἰς πένθος
  choice: se transformaram em luto
  rationale: Reproduz a ideia de mudança para um estado de luto sem tornar a construção artificial em português.
- source_word: τὰ σάββατα
  choice: sábados
  rationale: O plural designa as observâncias recorrentes do sábado; esta é a forma direta e consagrada em português.
- source_word: εἰς ὀνειδισμόν
  choice: em motivo de vergonha
  rationale: ὀνειδισμός envolve opróbrio, afronta e desonra pública. A expressão portuguesa deixa implícito o agente, como o grego, e comunica o resultado social.
- source_word: τιμὴ
  choice: honra
  rationale: Indica a honra ou dignidade antes atribuída à cidade; “honra” é a equivalência mais direta.
- source_word: εἰς ἐξουδένωσιν
  choice: em desprezo
  rationale: Expressa o ato ou estado de ser tratado como sem valor, preservando o contraste direto com “honra”.
theological_decisions:
- issue: Referente dos possessivos femininos αὐτῆς
  choice: Empregar “seu/suas” ao longo do versículo, sem explicitar novamente o antecedente.
  alternative: Traduzir de modo explícito como “de Jerusalém” ou “da cidade”.
  rationale: O grego repete o possessivo feminino e deixa o antecedente dependente do contexto, no qual Jerusalém é personificada. O português permite preservar essa referência implícita e o tom de lamentação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com paralelismo poético preservado. As elipses “seus sábados, em...” e “sua honra, em...” refletem a estrutura coordenada do grego sem repetição pesada. Não há marcadores de nota, pois nenhuma nota foi necessária.
