  text: And his sons became strong[a], each in his own place;
translation:
  language: pt
  text: E seus filhos se firmaram no poder, cada um em seu próprio lugar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua própria região” ou “em seu próprio território”; aqui, “lugar” provavelmente se refere à área controlada por cada filho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκράτησαν
  choice: se firmaram no poder
  rationale: O verbo ἐπικρατέω expressa prevalecer, fortalecer-se ou alcançar domínio. No contexto da sucessão de Alexandre, a formulação indica que os filhos consolidaram poder, sem explicitar além do grego sobre quem governavam.
- source_word: οἱ παῖδες αὐτοῦ
  choice: seus filhos
  rationale: Embora παῖδες possa designar filhos, crianças ou servos, o contexto dinástico identifica os sucessores como filhos.
- source_word: ἕκαστος
  choice: cada um
  rationale: Reproduz de modo natural o sentido distributivo do grego.
- source_word: ἐν τῷ τόπῳ αὐτοῦ
  choice: em seu próprio lugar
  rationale: Preserva o sentido básico de τόπος e a relativa abertura da expressão; neste contexto, o lugar provavelmente corresponde à região ou ao território controlado por cada sucessor.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. “Se firmaram no poder” comunica a consolidação do domínio sugerida pelo contexto sem reduzir o verbo apenas a força pessoal; “lugar” mantém a formulação aberta do grego, esclarecida em nota.
