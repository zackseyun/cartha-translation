  text: And after taking everything[a], he went away to his own land. And they committed murder[b], and spoke great arrogance.
translation:
  language: pt
  text: E, depois de tomar tudo, ele partiu para sua terra. Eles praticaram derramamento de sangue[a] e falaram com grande arrogância[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cometeram homicídio” ou “praticaram uma matança”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “proferiram grande arrogância”. O grego emprega uma expressão nominal, literalmente: “falaram grande arrogância”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: depois de tomar
  rationale: O particípio aoristo indica uma ação concluída antes do verbo principal; esta formulação expressa com naturalidade essa sequência.
- source_word: πάντα
  choice: tudo
  rationale: O plural neutro tem sentido abrangente e enfatiza a totalidade do que foi tomado.
- source_word: ἀπῆλθεν
  choice: partiu
  rationale: Expressa de modo claro e digno a ideia de ir embora ou retirar-se.
- source_word: εἰς τὴν γῆν αὐτοῦ
  choice: para sua terra
  rationale: γῆ pode indicar terra ou país; a expressão portuguesa conserva o sentido possessivo sem acrescentar informação.
- source_word: ἐποίησαν
  choice: cometeram
  rationale: Com o substantivo de matança, “cometeram” forma uma construção portuguesa natural e mantém a avaliação moral negativa.
- source_word: φονοκτονίαν
  choice: uma matança
  rationale: O termo designa homicídio, derramamento de sangue ou matança. “Uma matança” é natural no contexto coletivo e preserva a gravidade da ação.
- source_word: ἐλάλησαν
  choice: falaram
  rationale: Tradução direta e corrente do verbo de fala, sem intensificação indevida.
- source_word: ὑπερηφανίαν μεγάλην
  choice: com grande arrogância
  rationale: A formulação é natural em português e conserva tanto a intensidade de μεγάλην quanto o sentido moral de ὑπερηφανίαν; uma nota registra a construção nominal mais literal.
theological_decisions:
- issue: Força moral de φονοκτονίαν
  choice: uma matança
  alternative: assassinato; derramamento de sangue
  rationale: “Matança” comunica morte violenta e condenável, adequa-se aos agentes no plural e evita enfraquecer o juízo moral do narrador.
- issue: Forma da expressão ὑπερηφανίαν μεγάλην
  choice: falaram com grande arrogância
  alternative: falaram grande arrogância; proferiram grande arrogância
  rationale: A construção com “com” é idiomática em português. A nota preserva a consciência de que o grego emprega um substantivo como objeto da fala, sem resolver além do necessário se a ênfase recai no conteúdo ou no modo de falar.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A mudança do singular (“ele partiu”) para o plural (“eles cometeram”) foi mantida conforme o texto grego. Os marcadores aparecem junto aos termos a que suas notas se referem.
