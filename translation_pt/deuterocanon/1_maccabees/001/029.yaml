base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/029.yaml
  text: After two years had passed, the king sent a chief collector of tribute to the cities of Judah, and he came to Jerusalem with a heavy crowd.
translation:
  language: pt
  text: Passados dois anos, o rei enviou às cidades de Judá um alto responsável pela cobrança de tributos, e ele chegou a Jerusalém com um grande contingente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com uma grande multidão” ou “com uma força numerosa”. Em grego, literalmente, “com uma multidão pesada”, expressão que sugere um grupo acompanhante numeroso ou imponente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δύο ἐτῶν ἡμερῶν
  choice: Passados dois anos
  rationale: A expressão idiomática grega marca o transcurso de dois anos; esta formulação é natural em português e conserva o valor temporal.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente direto e corrente do aoristo de ἀποστέλλω neste contexto.
- source_word: ἄρχοντα φορολογίας
  choice: um alto responsável pela cobrança de tributos
  rationale: ἄρχων indica alguém investido de autoridade, enquanto φορολογία se refere à arrecadação de tributos. A formulação evita reduzi-lo a um simples cobrador local e não especifica um título administrativo incerto.
- source_word: εἰς τὰς πόλεις Ἰούδα
  choice: às cidades de Judá
  rationale: Expressa naturalmente o movimento ou destino indicado por εἰς e mantém Judá como designação geográfica.
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: com um grande contingente
  rationale: ὄχλος designa uma multidão ou grupo numeroso, e βαρύς, literalmente 'pesado', sugere aqui dimensão e poder consideráveis. 'Contingente' é natural no contexto político-militar sem afirmar de modo categórico que se tratava apenas de tropas.
