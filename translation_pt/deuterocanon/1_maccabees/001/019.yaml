  text: And they captured the fortified cities in the land of Egypt, and he took the plunder of the land of Egypt.
translation:
  language: pt
  text: Eles capturaram as cidades fortificadas na terra do Egito, e ele tomou os despojos da terra do Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβοντο
  choice: capturaram
  rationale: O aoristo médio de καταλαμβάνω indica aqui a tomada militar e o controle das cidades; “capturaram” é natural e preciso no contexto.
- source_word: πόλεις
  choice: cidades
  rationale: É o sentido comum do substantivo e se ajusta ao contexto histórico-militar.
- source_word: ὀχυράς
  choice: fortificadas
  rationale: Como adjetivo atributivo de “cidades”, descreve lugares dotados de defesas; “cidades fortificadas” é a expressão portuguesa corrente.
- source_word: γῇ
  choice: terra
  rationale: Na expressão ἐν γῇ Αἰγύπτῳ, “na terra do Egito” preserva de modo natural a referência geográfica do grego.
- source_word: ἔλαβεν
  choice: ele tomou
  rationale: Mantém a forma simples do verbo e, sobretudo, a mudança gramatical do plural da primeira oração para o singular da segunda.
- source_word: σκῦλα
  choice: os despojos
  rationale: O termo designa bens tomados em guerra. “Despojos” preserva com clareza e dignidade o sentido militar.
theological_decisions:
- issue: Mudança do verbo no plural (“capturaram”) para o singular (“ele tomou”)
  choice: Preservar a mudança gramatical do texto grego
  alternative: Uniformizar as duas orações no plural ou no singular
  rationale: O grego passa explicitamente de κατελάβοντο, plural, para ἔλαβεν, singular. A tradução mantém essa tensão narrativa sem identificar além do necessário o sujeito singular nem suavizar a redação da fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das orações e a repetição de “terra do Egito” foram preservadas por refletirem a estrutura e a ênfase do original.
