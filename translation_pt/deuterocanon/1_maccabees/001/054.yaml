lexical_decisions:
- source_word: πεντεκαιδεκάτῃ ἡμέρᾳ
  choice: no décimo quinto dia
  rationale: O dativo tem valor temporal; a formulação explicita o dia e soa natural em português.
- source_word: Χασελεὺ
  choice: quisleu
  rationale: Emprega a forma portuguesa reconhecível do nome do mês judaico, correspondente ao grego transliterado.
- source_word: τῷ πέμπτῳ καὶ τεσσερακοστῷ ἔτει
  choice: no ano cento e quarenta e cinco
  rationale: O grego pressupõe a centena no sistema de datação selêucida; a forma cardinal é clara e corrente em português.
- source_word: ᾠκοδόμησαν
  choice: construíram
  rationale: Preserva o sentido básico de edificar e também a repetição do mesmo verbo nas duas orações.
- source_word: βδέλυγμα ἐρημώσεως
  choice: a abominação da desolação
  rationale: Mantém a expressão cultual e intertextual tradicional sem decidir se o genitivo descreve o efeito, a qualidade ou um título fixo.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sobre o altar
  rationale: Expressa diretamente a colocação do objeto sobre o altar.
- source_word: πόλεσιν Ἰούδα κύκλῳ
  choice: nas cidades de Judá ao redor
  rationale: Conserva a relação de κύκλῳ com a distribuição das cidades, sem especificar indevidamente que estariam fora de Judá.
- source_word: βωμούς
  choice: altares
  rationale: É o equivalente direto do termo cultual; opções como 'santuários' ou 'lugares altos' acrescentariam sentidos não exigidos pelo grego.
theological_decisions:
- issue: Sentido de βδέλυγμα ἐρημώσεως e sua ressonância bíblico-teológica posterior
  choice: a abominação da desolação
  alternative: uma abominação desoladora; a abominação que causa desolação
  rationale: A redação principal preserva a formulação compacta e sua continuidade intertextual, enquanto a nota registra as leituras descritivas possíveis sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantém-se a repetição de “construíram” e a formulação tradicional “abominação da desolação”. Os marcadores foram colocados junto aos elementos efetivamente explicados por cada nota.
