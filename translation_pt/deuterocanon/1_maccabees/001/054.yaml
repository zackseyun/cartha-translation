  text: And on the fifteenth day of Chislev[a], in the one hundred forty-fifth year, they built the abomination of desolation upon the altar; and in the surrounding cities of Judah they built altars[b],
translation:
  language: pt
  text: No décimo quinto dia de quisleu, no ano cento e quarenta e cinco[b], construíram a abominação da desolação[a] sobre o altar; e, nas cidades de Judá, por toda a região, construíram altares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma abominação desoladora” ou “a abominação que causa desolação”. A expressão grega é compacta e pode ser entendida como uma designação fixa ou como uma descrição.'
