base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/009.yaml
  text: And they all put on crowns after his death[a], and their sons after them for many years[b]; and they multiplied evils in the land.
translation:
  language: pt
  text: E todos eles puseram diademas[a] depois que ele morreu, e seus filhos depois deles, por muitos anos; e multiplicaram os males na terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, insígnias da realeza; também se pode traduzir por «coroas reais».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «aumentaram a maldade na terra» ou «multiplicaram as calamidades na terra». O termo grego pode abranger tanto o mal moral quanto suas consequências danosas.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθεντο
  choice: puseram
  rationale: A voz média, em combinação com διαδήματα, indica que eles próprios tomaram e passaram a usar a insígnia real. «Puseram» conserva a imagem concreta e é natural em português.
- source_word: διαδήματα
  choice: diademas
  rationale: O termo grego designa especificamente a insígnia da realeza. «Diademas» mantém essa precisão histórica; uma nota esclarece o sentido para leitores modernos.
- source_word: μετὰ τὸ ἀποθανεῖν αὐτόν
  choice: depois que ele morreu
  rationale: A construção com infinitivo articular expressa tempo posterior à morte de Alexandre. Esta formulação é clara, direta e idiomática.
- source_word: ὀπίσω αὐτῶν
  choice: depois deles
  rationale: No contexto dinástico, a expressão indica sucessão, não posição física. A tradução preserva a concisão do grego.
- source_word: ἔτη πολλά
  choice: por muitos anos
  rationale: Expressa naturalmente em português o acusativo grego de duração.
- source_word: ἐπλήθυναν
  choice: multiplicaram
  rationale: Conserva a força ativa do verbo, isto é, fizeram aumentar ou tornaram numerosos.
- source_word: κακὰ
  choice: os males
  rationale: O plural grego é amplo e pode abranger tanto a maldade moral quanto danos, desgraças e calamidades; «males» preserva essa amplitude.
- source_word: ἐν τῇ γῇ
  choice: na terra
  rationale: No contexto histórico-político, γῆ se refere à terra ou região afetada, e não necessariamente ao planeta inteiro.
theological_decisions:
- issue: Amplitude semântica de κακὰ
  choice: os males
  alternative: a maldade; as calamidades
  rationale: A expressão pode incluir simultaneamente conduta perversa e suas consequências destrutivas. A tradução ampla evita restringir indevidamente a avaliação do narrador.
translation_notes:
  register: Português moderno, digno e acessível, com construção narrativa direta. «Diademas» conserva a precisão histórica e é explicado em nota; «males» preserva a ambiguidade intencional do grego.
