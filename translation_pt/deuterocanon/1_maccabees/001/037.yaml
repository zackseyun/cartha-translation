  text: And they poured out innocent blood around the sanctuary, and they defiled the sanctuary.
translation:
  language: pt
  text: E derramaram sangue inocente ao redor do santuário e contaminaram o santuário.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέχεαν
  choice: derramaram
  rationale: No contexto de sangue, «derramaram» é natural em português e preserva a imagem concreta do verbo grego.
- source_word: αἷμα ἀθῷον
  choice: sangue inocente
  rationale: Expressão bíblica estabelecida para o sangue de pessoas sem culpa, injustamente morto.
- source_word: κύκλῳ
  choice: ao redor
  rationale: Expressa de modo claro e conciso a localização em torno do santuário.
- source_word: τοῦ ἁγιάσματος / τὸ ἁγίασμα
  choice: do santuário / o santuário
  rationale: «Santuário» designa adequadamente o espaço sagrado e mantém a repetição enfática do mesmo termo grego.
- source_word: ἐμόλυναν
  choice: profanaram
  rationale: No contexto de violência cometida no espaço sagrado, «profanaram» comunica a violação e contaminação cultual com naturalidade em português.
theological_decisions:
- issue: Sentido cultual de ἁγίασμα
  choice: santuário
  alternative: lugar santo; recinto sagrado
  rationale: O termo indica o espaço sagrado ligado ao templo de Jerusalém; «santuário» preserva o sentido cultual sem especificar mais do que o grego.
- issue: Sentido de ἐμόλυναν
  choice: profanaram
  alternative: contaminaram; tornaram impuro
  rationale: A escolha retém a dimensão cultual e moral da ação, sem restringi-la apenas à sujeira física ou explicitar um mecanismo ritual não declarado no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de «santuário» foi mantida para reproduzir a ênfase retórica do grego.
