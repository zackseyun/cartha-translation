base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/011.yaml
  text: In those days lawless men came out from Israel and persuaded many[a], saying, “Let us go and make a covenant with the nations around us, because since we separated ourselves from them[c][b], many evils have found us.”
translation:
  language: pt
  text: 'Naqueles dias, homens transgressores[a] saíram do meio de Israel e persuadiram muitos, dizendo: “Vamos fazer uma aliança com as nações ao nosso redor, pois, desde que fomos separados delas[b], muitos males nos sobrevieram[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “filhos da transgressão” ou “filhos da ilegalidade”; trata-se de pessoas caracterizadas pelo desprezo à lei.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “desde que nos separamos delas”. O grego está na voz passiva, mas pode admitir sentido reflexivo neste contexto.
    reason: source_ambiguity
  - marker: c
    text: Literalmente, “muitos males nos encontraram”, isto é, muitas calamidades ou aflições vieram sobre nós.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ἐξ Ἰσραὴλ
  choice: saíram do meio de Israel
  rationale: Conserva a imagem de saída e deixa claro, em português natural, que esses homens surgiram de dentro do próprio Israel.
- source_word: υἱοὶ παράνομος
  choice: homens transgressores
  rationale: A expressão grega, apesar da irregularidade de concordância no texto de Swete, designa pessoas caracterizadas pela transgressão da lei. A formulação é idiomática sem apagar a alternativa mais literal.
- source_word: ἀνέπεισαν πολλοὺς
  choice: persuadiram muitos
  rationale: Traduz diretamente o sentido de convencer ou induzir, sem acrescentar ao verbo a avaliação de que eles enganaram os demais.
- source_word: Πορευθῶμεν
  choice: Vamos
  rationale: Expressa naturalmente em português a exortação do subjuntivo grego no contexto da fala.
- source_word: διαθώμεθα διαθήκην
  choice: fazer uma aliança
  rationale: Preserva o vocabulário bíblico de διαθήκη e seu peso político-religioso, em vez de reduzi-lo a um acordo genérico.
- source_word: τῶν ἐθνῶν τῶν κύκλῳ ἡμῶν
  choice: as nações ao nosso redor
  rationale: Representa os povos circunvizinhos com clareza e evita impor terminologia posterior específica como “gentios”.
- source_word: ἀφʼ ἧς ἐχωρίσθημεν ὑπʼ αὐτῶν
  choice: desde que fomos separados delas
  rationale: Mantém o valor temporal e a forma passiva do grego. A possível leitura reflexiva é registrada em nota para preservar a ambiguidade.
- source_word: εὗρεν ἡμᾶς κακὰ πολλὰ
  choice: muitos males nos sobrevieram
  rationale: Comunica com naturalidade o idiomatismo segundo o qual males ou calamidades “encontraram” alguém, mantendo em nota a imagem literal.
theological_decisions:
- issue: Terminologia de aliança em um contexto político e religioso
  choice: fazer uma aliança
  alternative: fazer um acordo; formar uma aliança política
  rationale: “Aliança” conserva o peso bíblico de διαθήκη e não decide antecipadamente que o vínculo proposto era apenas político.
- issue: Agente e responsabilidade na separação entre Israel e as nações
  choice: fomos separados delas
  alternative: nos separamos delas
  rationale: A voz passiva do texto grego é mantida no corpo do versículo, sem determinar se a separação foi imposta ou assumida; a leitura reflexiva possível aparece na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Do meio de Israel” esclarece a origem interna do grupo; “aliança” mantém o registro bíblico; as notas preservam tanto a expressão familiar do grego quanto a ambiguidade da voz em ἐχωρίσθημεν.
