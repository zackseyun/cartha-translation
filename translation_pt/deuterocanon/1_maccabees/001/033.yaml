  text: And they fortified the city of David with a great and strong wall[a], with strong towers, and it became a citadel for them.
translation:
  language: pt
  text: Eles construíram a Cidade de Davi com uma grande e forte muralha e com torres fortificadas, e ela se tornou uma cidadela para eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela se tornou uma Acra para eles”. O grego ἄκρα pode ser entendido como substantivo comum (“cidadela”, “fortaleza”) ou como o nome historicamente associado à fortaleza selêucida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: fortificaram
  rationale: Embora οἰκοδομέω signifique normalmente “construir”, aqui a construção de muralha e torres tem função explicitamente defensiva; “fortificaram” expressa com naturalidade o sentido contextual sem acrescentar um tipo específico de obra.
- source_word: τὴν πόλιν Δαυεὶδ
  choice: a Cidade de Davi
  rationale: Mantém a designação histórica e topográfica de modo claro e convencional em português.
- source_word: τείχει μεγάλῳ καὶ ὀχυρῷ
  choice: com uma muralha grande e resistente
  rationale: A construção com o dativo descreve as obras usadas para fortificar a cidade. “Grande” representa μέγας, e “resistente” comunica a solidez defensiva de ὀχυρός em português natural.
- source_word: πύργοις ὀχυροῖς
  choice: com torres fortificadas
  rationale: “Fortificadas” preserva a nuance militar de ὀχυρός e evita a repetição pouco elegante de “resistente”.
- source_word: ἐγένετο αὐτοῖς εἰς ἄκραν
  choice: ela se tornou uma cidadela para eles
  rationale: “Cidadela” expressa o sentido comum de ἄκρα como fortaleza urbana ou posição fortificada, enquanto a possível leitura como nome histórico é preservada em nota.
