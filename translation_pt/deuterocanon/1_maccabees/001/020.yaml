  text: And after striking Egypt[a], Antiochus returned in the one hundred forty-third year; and he went up against Israel and Jerusalem with a great multitude.
translation:
  language: pt
  text: Depois de golpear o Egito, Antíoco voltou, no ano cento e quarenta e três, e subiu contra Israel e Jerusalém com um numeroso contingente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com uma grande multidão”; literalmente, “com uma multidão pesada”.
    reason: Registra tanto uma alternativa menos explicitamente militar para ὄχλος quanto a imagem incomum de βαρεῖ no grego.
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: voltou
  rationale: O aoristo de ἐπιστρέφω indica aqui o retorno físico de Antíoco após a campanha no Egito; “voltou” é natural e não acrescenta um destino ausente do grego.
- source_word: μετὰ τὸ πατάξαι Αἴγυπτον
  choice: depois de golpear o Egito
  rationale: A construção μετὰ τό com infinitivo expressa tempo posterior. “Golpear” conserva a força militar de πατάσσω sem afirmar de modo indevido uma derrota completa.
- source_word: ἐν τῷ ἑκατοστῷ καὶ τεσσερακοστῷ καὶ τρίτῳ ἔτει
  choice: no ano cento e quarenta e três
  rationale: Reproduz com clareza a fórmula de datação da era selêucida, sem inserir uma explicação cronológica no corpo do versículo.
- source_word: ἀνέβη ἐπὶ
  choice: subiu contra
  rationale: “Subiu” preserva o sentido direcional de ἀναβαίνω, enquanto “contra” comunica o valor hostil de ἐπί com acusativo no contexto militar.
- source_word: Ἰσραὴλ καὶ Ἱεροσόλυμα
  choice: Israel e Jerusalém
  rationale: Mantém os dois nomes do texto grego sem transformar explicitamente Israel em “terra” ou “povo”, preservando sua possível abrangência.
- source_word: ἐν ὄχλῳ βαρεῖ
  choice: com um numeroso contingente
  rationale: No contexto de uma campanha, ὄχλος designa um grande corpo de pessoas, provavelmente tropas, e βαρύς ressalta seu peso ou poder. “Numeroso contingente” é corrente em português e mantém o caráter coletivo e militar sem especificar uma formação técnica.
