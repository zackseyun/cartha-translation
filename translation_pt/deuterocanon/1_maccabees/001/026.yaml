  yaml_path: translation/deuterocanon/1_maccabees/001/026.yaml
  text: And rulers and elders groaned; virgins and young men grew weak[a], and the beauty of the women was altered.
translation:
  language: pt
  text: E governantes e anciãos gemeram; virgens e rapazes enfraqueceram, e a beleza das mulheres se alterou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mudou”. O grego afirma que a beleza das mulheres se alterou, sem especificar exatamente de que maneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστέναξαν
  choice: gemeram
  rationale: Preserva a expressão audível e intensa de sofrimento indicada pelo verbo, sem a atenuar como “suspiraram” nem explicá-la como “lamentaram”.
- source_word: ἄρχοντες
  choice: governantes
  rationale: Designa de modo amplo os que exerciam autoridade, sem sugerir necessariamente nobreza hereditária.
- source_word: πρεσβύτεροι
  choice: anciãos
  rationale: Conserva o provável sentido de figuras seniores reconhecidas na comunidade, e não apenas de homens idosos.
- source_word: παρθένοι
  choice: virgens
  rationale: Mantém o termo específico do grego, em vez de o generalizar como “jovens mulheres”.
- source_word: νεανίσκοι
  choice: jovens
  rationale: No paralelismo com “virgens”, refere-se naturalmente aos jovens do sexo masculino; a forma é clara e evita rigidez desnecessária.
- source_word: ἠσθένησαν
  choice: enfraqueceram
  rationale: Expressa de forma natural que perderam as forças ou se tornaram fracos.
- source_word: τὸ κάλλος
  choice: a beleza
  rationale: É o equivalente direto e corrente para a beleza ou formosura mencionada no texto.
- source_word: ἠλλοιώθη
  choice: se alterou
  rationale: Preserva a passividade semântica e a indefinição do grego quanto à natureza da mudança, sem especificar que a beleza “desapareceu” ou que as mulheres ficaram “desfiguradas”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo conciso. “Anciãos” conserva o papel social do termo antigo; “jovens” é entendido como masculino no contraste com “virgens”. O marcador da nota foi colocado após a expressão a que ela efetivamente se refere.
