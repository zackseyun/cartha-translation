- from: E sobre as entradas das casas e nas praças queimavam incenso[a][b].
  to: E sobre as portas das casas e nas praças queimavam incenso[a][b].
  rationale: A revisão substitui «entradas» por «portas» para uma representação mais concreta e idiomática de θυρίδων sob a preposição «sobre», sem alegar uma identificação arquitetônica mais específica. Também ajusta a redação da nota b. A ambiguidade de πλατείαις e o possível sentido cultual de θυμιάω permanecem documentados nas notas.
