  text: And on the doorways of the houses and in the streets they burned incense[a][b].
translation:
  language: pt
  text: E sobre as portas das casas e nas praças queimavam incenso[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofereciam incenso”. O verbo grego pode indicar a queima de incenso como oferta cultual.
    reason: lexical_alternative
  - marker: b
    text: O termo traduzido por “praças” também pode designar “ruas largas” ou “espaços públicos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδων
  choice: entradas
  rationale: O termo pode designar portas, aberturas ou entradas. “Entradas” é natural em português e evita especificar indevidamente portas ou umbrais.
- source_word: οἰκιῶν
  choice: casas
  rationale: Tradução direta e concreta de οἰκία neste contexto narrativo.
- source_word: πλατείαις
  choice: praças
  rationale: πλατεῖα pode designar vias largas ou espaços públicos abertos. “Praças” comunica com naturalidade o cenário urbano público, mantendo em nota a alternativa “ruas largas”.
- source_word: ἐθυμίων
  choice: queimavam incenso
  rationale: θυμιάω significa queimar incenso e, em contexto cultual, oferecê-lo. A formulação é direta e preserva a ação concreta sem explicitar além do grego o caráter de oferta.
- source_word: ἐπὶ ... καὶ ἐν
  choice: sobre ... e nas
  rationale: 'Mantém a distinção das preposições gregas: ἐπί ligado às entradas das casas e ἐν aos espaços públicos.'
