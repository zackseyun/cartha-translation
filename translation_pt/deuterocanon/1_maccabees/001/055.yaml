  source_fidelity: 'A tradução preserva a estrutura locativa do grego (ἐπὶ... καὶ ἐν) e o sentido de ἐθυμίων. Contudo, «sobre as entradas» é menos preciso e menos idiomático neste contexto do que «sobre as portas»: θυρίδες pode referir-se a portas/aberturas, e «entradas» tende a designar o acesso ou o espaço de entrada, não o elemento físico sobre o qual a ação é situada.'
  naturalness: «E sobre as portas das casas e nas praças queimavam incenso» é claro, natural e mantém a concisão narrativa. A nota sobre πλατείαις deve evitar a concordância potencialmente ambígua de «Praças também pode ser entendido».
  terminology: «Queimavam incenso» representa adequadamente θυμιάω; a alternativa «ofereciam incenso» é útil para explicitar o possível valor cultual sem impor uma interpretação. «Praças» é uma opção aceitável para πλατείαις, com alternativas preservadas em nota.
