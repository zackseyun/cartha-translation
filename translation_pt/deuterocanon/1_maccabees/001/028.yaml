  text: And the earth shook for those who dwelt on it[a], and the whole house of Jacob clothed itself with shame.
translation:
  language: pt
  text: E a terra tremeu sobre os seus habitantes[a], e toda a casa de Jacó se vestiu de vergonha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o país tremeu». A palavra grega pode significar tanto «terra» como «país» ou «região».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσείσθη
  choice: tremeu
  rationale: O aoristo passivo de σείω descreve abalo ou tremor. Em português, «tremeu» é vívido e natural, sem decidir se o sentido é literal, figurado ou ambos.
- source_word: ἡ γῆ
  choice: a terra
  rationale: γῆ pode designar a terra em sentido amplo ou uma região/país. «A terra» preserva essa elasticidade melhor que uma especificação geográfica.
- source_word: ἐπὶ τοὺς κατοικοῦντας αὐτήν
  choice: sob os seus habitantes
  rationale: A construção com ἐπί e acusativo relaciona o abalo com os que habitam a terra. «Sob os seus habitantes» conserva a imagem espacial e soa natural em português.
- source_word: πᾶς ὁ οἶκος Ἰακώβ
  choice: toda a casa de Jacó
  rationale: Mantém a expressão coletiva e pactual do grego, sem substituí-la interpretativamente por «todo Israel».
- source_word: ἐνεδύσατο αἰσχύνην
  choice: se vestiu de vergonha
  rationale: Preserva a voz média e a metáfora concreta de vestir-se, ao mesmo tempo que emprega uma construção portuguesa clara e digna.
theological_decisions:
- issue: Amplitude semântica de γῆ
  choice: a terra
  alternative: o país; a região
  rationale: O contexto permite tanto a terra em sentido amplo quanto a terra habitada em sentido regional. O texto principal mantém «terra», e a nota registra a alternativa sem impor uma leitura.
- issue: Preservação da metáfora de ἐνεδύσατο αἰσχύνην
  choice: se vestiu de vergonha
  alternative: ficou coberta de vergonha
  rationale: A tradução escolhida conserva a metáfora explícita do original e sua força poética, sem reduzi-la a uma explicação abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens poéticas do grego são preservadas sem rigidez artificial.
