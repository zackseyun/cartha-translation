lexical_decisions:
- source_word: ἐγένετο
  choice: houve
  rationale: A construção καὶ ἐγένετο introduz aqui um estado ou acontecimento resultante. “Houve” é natural em português e mantém o agente indefinido.
- source_word: ὀργὴ
  choice: ira
  rationale: “Ira” expressa a intensidade de ὀργή neste resumo culminante, sem identificar sua origem.
- source_word: μεγάλη
  choice: muito grande
  rationale: “Grande”, reforçado por “muito”, preserva a intensificação formada por μεγάλη e σφόδρα.
- source_word: ἐπὶ Ἰσραήλ
  choice: contra Israel
  rationale: Com ὀργή, ἐπί pode indicar a direção da ira; “contra Israel” é idiomático em português. A alternativa “sobre Israel” é registrada em nota por preservar mais diretamente a imagem grega.
- source_word: σφόδρα
  choice: muito
  rationale: O advérbio intensifica fortemente a declaração; “muito” produz uma formulação clara e natural em português.
theological_decisions:
- issue: Origem implícita da ira
  choice: A tradução não identifica a origem nem o agente da ira.
  alternative: Entender a expressão especificamente como ira divina ou como ira/perseguição dos opressores.
  rationale: O grego não nomeia Deus, os inimigos nem qualquer outra fonte. Manter o agente implícito preserva a ambiguidade e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação concisa acompanha o caráter enfático do grego sem acrescentar um agente.
