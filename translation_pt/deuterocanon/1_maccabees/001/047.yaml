translation:
  language: pt
  text: construir altares, santuários e ídolos, e sacrificar porcos e animais impuros[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «animais comuns»; o adjetivo grego pode significar «comuns», mas aqui provavelmente tem o sentido de ritualmente impuros no contexto judaico das leis de pureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομῆσαι
  choice: construir
  rationale: O infinitivo aoristo expressa a ação ordenada; «construir» é natural e pode reger os três objetos da sequência.
- source_word: βωμούς
  choice: altares
  rationale: βωμός designa normalmente um altar, sobretudo destinado a sacrifícios.
- source_word: τεμένη
  choice: santuários
  rationale: τέμενος pode indicar um recinto ou lugar consagrado. «Santuários» preserva o caráter cultual e é mais natural para leitores atuais do que «recintos sagrados».
- source_word: εἴδωλα
  choice: ídolos
  rationale: No contexto judaico de culto pagão, o termo se refere a objetos de adoração e não a imagens em sentido neutro.
- source_word: θύειν
  choice: sacrificar
  rationale: Mantém de forma compacta e natural o segundo infinitivo da lista de ações ordenadas.
- source_word: ὕεια
  choice: porcos
  rationale: O adjetivo substantivado refere-se a suínos. «Porcos» é corrente e claro em português, sem perder o sentido sacrificial.
- source_word: κτῆνη κοινά
  choice: animais impuros
  rationale: κτῆνη é uma designação ampla de animais ou gado; neste contexto judaico de pureza ritual, κοινά tem o sentido contextual de profanos ou impuros.
theological_decisions:
- issue: Sentido de κοινά no contexto judaico de pureza ritual
  choice: animais impuros
  alternative: animais comuns
  rationale: Embora κοινός possa significar literalmente «comum», no uso judaico helenístico pode designar aquilo que é ritualmente profano ou impuro. O contexto de práticas cultuais contrárias à Torá favorece «impuros», enquanto a nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura infinitiva foi preservada por se tratar da continuação de uma lista no contexto maior; «porcos» evita o tom arcaizante de «suínos», e «santuários» comunica de modo natural a natureza cultual de τεμένη.
