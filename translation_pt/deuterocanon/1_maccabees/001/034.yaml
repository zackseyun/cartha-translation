  - severity: low
    issue: «Homens que transgrediam a Lei» desenvolve o adjetivo παρανόμους como oração verbal.
    rationale: «Homens transgressores da Lei» é mais próximo da construção nominal grega e evita uma nuance aspectual desnecessária.
