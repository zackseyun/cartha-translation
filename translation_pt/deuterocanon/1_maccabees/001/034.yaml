  text: And they stationed there a sinful nation, lawless men, and they strengthened themselves in it.
translation:
  language: pt
  text: E estabeleceram ali um povo pecador, homens transgressores da Lei, e se fortaleceram nela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκαν
  choice: puseram
  rationale: Reproduz de modo direto o ato de colocar ou estabelecer pessoas naquele lugar, sem acrescentar uma nuance militar que o verbo, isoladamente, não exige.
- source_word: ἔθνος ἁμαρτωλὸν
  choice: uma nação pecadora
  rationale: Mantém o sentido coletivo de ἔθνος e o juízo moral expresso por ἁμαρτωλόν, em consonância com o texto grego e sem reduzir o grupo a um termo mais genérico.
- source_word: ἄνδρας παρανόμους
  choice: homens que transgrediam a Lei
  rationale: No contexto de 1 Macabeus, παράνομος aponta para quem viola a Lei; a formulação verbal soa natural em português e preserva essa referência, em vez de sugerir apenas criminalidade civil.
- source_word: ἐνίσχυσαν ἐν αὐτῇ
  choice: se fortaleceram nela
  rationale: Preserva a leitura reflexiva refletida pela tradição textual consultada e mantém o referente feminino potencialmente ambíguo de αὐτῇ, provavelmente a fortaleza mencionada no contexto.
theological_decisions:
- issue: Sentido de παρανόμους
  choice: homens que transgrediam a Lei
  alternative: homens sem lei
  rationale: A escolha explicita a violação da Lei no contexto judaico sem introduzir uma designação denominacional nem transformar a expressão em simples ausência de ordem.
- issue: Referente de αὐτῇ
  choice: nela
  alternative: ali
  rationale: O pronome feminino do grego é preservado, permitindo que o contexto determine o referente, em vez de eliminar a ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordenada do grego foi mantida, evitando explicações dentro do versículo.
