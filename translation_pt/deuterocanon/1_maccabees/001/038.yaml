base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/038.yaml
  text: And the inhabitants of Jerusalem fled because of them[a], and she became a dwelling place of foreigners; she became foreign to her offspring, and her children abandoned her.
translation:
  language: pt
  text: E os habitantes de Jerusalém fugiram por causa deles, e ela se tornou morada de estrangeiros; tornou-se estranha aos seus descendentes[a], e seus filhos a abandonaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos seus frutos”. O termo grego pode se referir tanto a descendentes quanto ao que é produzido; o paralelismo imediato com “seus filhos” favorece “descendentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγον
  choice: fugiram
  rationale: Expressa de modo direto a fuga dos habitantes sob pressão, preservando o aspecto de ação passada.
- source_word: οἱ κάτοικοι
  choice: os habitantes
  rationale: Designa naturalmente as pessoas que moravam em Jerusalém e mantém o registro histórico.
- source_word: διʼ αὐτούς
  choice: por causa deles
  rationale: A preposição com acusativo indica aqui causa ou motivo; o pronome retoma os opressores mencionados no contexto.
- source_word: κατοικία ἀλλοτρίων
  choice: morada de estrangeiros
  rationale: Preserva a imagem concreta de Jerusalém ocupada por pessoas de fora e o tema da alienação.
- source_word: ἐγένετο ἀλλοτρία
  choice: tornou-se estranha
  rationale: Mantém a personificação feminina de Jerusalém e a ligação lexical com os estrangeiros da oração anterior.
- source_word: τοῖς γενήμασιν αὐτῆς
  choice: aos seus descendentes
  rationale: γενήματα pode indicar descendência ou produtos/frutos. O paralelismo imediato com “seus filhos” favorece “descendentes”, sem eliminar a alternativa lexical, registrada em nota.
- source_word: τὰ τέκνα αὐτῆς
  choice: seus filhos
  rationale: τέκνα abrange os filhos da cidade personificada e preserva a metáfora familiar de Jerusalém como mãe.
- source_word: ἐγκατέλειπον
  choice: abandonaram
  rationale: Comunica desertar ou deixar desamparada, com mais força do que uma simples partida e sem arcaísmo.
theological_decisions:
- issue: Personificação de Jerusalém nas formas femininas singulares
  choice: Preservar a personificação feminina por meio de “ela”, “estranha”, “seus descendentes” e “seus filhos”.
  alternative: Repetir “Jerusalém” ou converter a descrição em linguagem impessoal.
  rationale: O grego trata Jerusalém como figura feminina e materna. Manter essa imagem conserva a força de lamento e prepara a referência a seus filhos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e a repetição de “tornou-se” preservam o ritmo cumulativo do grego; “morada” mantém o tom literário sem soar arcaico.
