base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/001/063.yaml
  text: And they chose to die[a], so that they might not be defiled by the foods and might not profane the holy covenant[b]; and they died.
translation:
  language: pt
  text: E aceitaram morrer, para não se contaminarem com os alimentos[a] nem profanarem a santa aliança[b]; e morreram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com as comidas”. O termo grego se refere a alimentos, aqui especificamente aos que os contaminariam segundo a lei da aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma santa aliança”. A expressão grega não tem artigo, mas o contexto aponta para a aliança conhecida de Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπεδέξαντο ἀποθανεῖν
  choice: aceitaram morrer
  rationale: A construção expressa a aceitação voluntária da morte. “Aceitaram morrer” é natural em português e preserva a ideia de assumir esse destino sem acrescentar que o receberam com alegria.
- source_word: μιανθῶσιν
  choice: se contaminarem
  rationale: O verbo indica contaminação ou impureza no âmbito ritual e moral da fidelidade à aliança; a forma pronominal é idiomática em português.
- source_word: τοῖς βρώμασιν
  choice: com os alimentos
  rationale: O plural designa os alimentos em questão, cuja ingestão causaria contaminação segundo a lei da aliança. “Alimentos” evita restringir indevidamente o sentido a carnes.
- source_word: βεβηλώσωσιν
  choice: profanarem
  rationale: O verbo apresenta a ação como tratar como comum ou violar aquilo que é santo; “profanar” preserva o contraste explícito com a santidade da aliança.
- source_word: διαθήκην ἁγίαν
  choice: a santa aliança
  rationale: Embora a expressão grega não tenha artigo, o contexto aponta para a aliança conhecida de Israel. A ordem “santa aliança” é natural, clara e digna em português bíblico moderno.
- source_word: ἀπέθανον
  choice: morreram
  rationale: O grego afirma simplesmente que morreram. A tradução não explicita que foram executados, embora o contexto mais amplo indique martírio.
theological_decisions:
- issue: Natureza da contaminação causada pelos alimentos
  choice: contaminação ritual e moral decorrente dos alimentos proibidos
  alternative: corrupção moral geral ligada a práticas alimentares
  rationale: No contexto da perseguição contra a observância da lei, os alimentos contaminariam os fiéis em sua relação com a aliança. A formulação mantém juntas as dimensões ritual e moral sem explicar além do texto.
- issue: Definição de διαθήκην ἁγίαν
  choice: a santa aliança
  alternative: uma santa aliança
  rationale: A ausência do artigo em grego permite formalmente a alternativa indefinida, mas o contexto histórico e literário identifica a aliança de Israel já conhecida. A nota preserva a característica gramatical do original.
- issue: Grau de voluntariedade em ἐπεδέξαντο ἀποθανεῖν
  choice: aceitaram morrer
  alternative: preferiram morrer
  rationale: “Aceitaram morrer” comunica consentimento e firmeza sem intensificar a comparação como faria “preferiram” nem sugerir entusiasmo diante da morte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição final “e morreram” foi mantida por sua força sóbria e por corresponder diretamente ao grego. Os marcadores foram posicionados junto aos termos a que as notas efetivamente se referem.
