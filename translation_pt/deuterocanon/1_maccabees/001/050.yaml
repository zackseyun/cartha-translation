  text: And whoever does not act according to the word of the king shall die[a].
translation:
  language: pt
  text: E quem não agir de acordo com a palavra do rei morrerá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de acordo com a ordem do rei». O grego diz literalmente «de acordo com a palavra do rei», expressão que, neste contexto, se refere à sua ordem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ ποιήσῃ
  choice: quem não agir
  rationale: A construção com ἄν e o subjuntivo tem sentido geral e indefinido. Neste contexto, ποιέω indica agir em conformidade com uma determinação; «agir» é natural em português e evita explicitar mais do que o grego.
- source_word: κατὰ τὸ ῥῆμα
  choice: de acordo com a palavra
  rationale: ῥῆμα significa literalmente «palavra», «declaração» ou «enunciado». No contexto, refere-se à ordem real, mas a tradução mantém o termo menos específico do original; a nota registra a alternativa contextual.
- source_word: τοῦ βασιλέως
  choice: do rei
  rationale: Tradução direta e natural do genitivo, indicando que a palavra ou ordem procede do rei.
- source_word: ἀποθανεῖται
  choice: morrerá
  rationale: O futuro de ἀποθνῄσκω afirma diretamente que a pessoa morrerá. Embora o contexto indique pena de morte, o grego não explicita o agente, por isso não se traduz por «será executado».
