  text: And they put to death the women who had circumcised their children[a], according to the decree,
translation:
  language: pt
  text: E mataram as mulheres que haviam circuncidado seus filhos[a], conforme o decreto,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que haviam mandado circuncidar seus filhos”; o grego usa um particípio ativo (“haviam circuncidado”), que pode indicar tanto ação direta quanto a circuncisão providenciada por elas.
    reason: Alternativa lexical que preserva a possível nuance causativa do particípio ativo grego.
lexical_decisions:
- source_word: περιτετμηκυίας
  choice: que haviam circuncidado
  rationale: O particípio perfeito ativo, feminino e plural, apresenta a circuncisão como ação já concluída antes da morte das mulheres. A forma ativa pode indicar tanto ação direta quanto ação providenciada por elas; o texto principal preserva a formulação ativa, e a possibilidade causativa é registrada em nota.
- source_word: τὰ τέκνα αὐτῶν
  choice: seus filhos
  rationale: τέκνα significa literalmente “filhos” ou “crianças”. Em português, “seus filhos” preserva o sentido parental e a amplitude lexical do grego sem substituir o termo por “meninos”, embora a circuncisão diga respeito aos filhos do sexo masculino.
- source_word: ἐθανάτωσαν
  choice: mataram
  rationale: O verbo significa causar a morte ou matar. “Mataram” é natural, claro e não acrescenta a ideia estritamente judicial que “executaram” poderia sugerir; o caráter oficial da ação fica expresso na referência ao decreto.
- source_word: κατὰ τὸ πρόσταγμα
  choice: conforme o decreto
  rationale: πρόσταγμα designa uma ordem, determinação ou decreto. No contexto de uma política oficial de perseguição, “decreto” comunica adequadamente a natureza formal da ordem.
theological_decisions:
- issue: Agência das mulheres na circuncisão dos filhos
  choice: O texto principal apresenta as mulheres como as que haviam circuncidado seus filhos.
  alternative: As mulheres haviam mandado circuncidar seus filhos.
  rationale: O particípio ativo favorece a expressão de agência direta, mas pode abranger a ação realizada por intermédio de outra pessoa. A nota preserva essa ambiguidade sem decidir além do que o grego permite.
- issue: Alcance de τέκνα no contexto da circuncisão
  choice: Traduzir por “filhos”, sem especificar “meninos”.
  alternative: Seus meninos ou seus filhos homens.
  rationale: Embora apenas os filhos do sexo masculino fossem circuncidados, o substantivo grego é mais amplo. A tradução evita introduzir uma especificação ausente da forma lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mataram” mantém clareza e naturalidade; “conforme o decreto” conserva o tom oficial. A vírgula final foi mantida porque o versículo fornecido continua a frase.
