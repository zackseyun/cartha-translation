lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: reinou
  rationale: Aoristo de βασιλεύω, indicando o exercício da realeza; “reinou” é a forma natural, concisa e historicamente adequada em português.
- source_word: ἔτη δώδεκα
  choice: doze anos
  rationale: Acusativo de extensão de tempo. Em português, a duração sem preposição após “reinou” é idiomática e preserva a concisão do grego.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Aoristo simples de ἀποθνῄσκω; “morreu” reproduz de modo direto o sentido, sem acrescentar o tom eufemístico de alternativas como “faleceu”.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: Os dois καί coordenam de maneira simples as ações históricas. Em português, o primeiro não precisa ser vertido no início isolado do versículo; o segundo aparece como “e”, conservando a coordenação sem tornar a frase artificial.
- source_word: Ἀλέξανδρος
  choice: Alexandre
  rationale: Forma tradicional e amplamente reconhecida do nome grego Ἀλέξανδρος em português.
