  yaml_path: translation/deuterocanon/1_maccabees/001/018.yaml
  text: And he waged war against Ptolemy the king of Egypt[a]; and Ptolemy was routed before him and fled[b], and many fell wounded.
translation:
  language: pt
  text: E ele travou guerra contra Ptolemeu, rei do Egito. Ptolemeu foi derrotado diante dele[a] e fugiu, e muitos caíram feridos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi obrigado a recuar diante dele”. O verbo grego pode indicar ser repelido ou vencido; “foi derrotado” exprime seu sentido no contexto militar.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “muitos feridos caíram”. A expressão pode designar numerosas baixas em combate, sem especificar que todos morreram nem que todos sobreviveram aos ferimentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεστήσατο πόλεμον
  choice: travou guerra
  rationale: A expressão grega indica iniciar e conduzir um conflito militar. “Travou guerra” é idiomático, claro e preserva a força da construção sem reproduzi-la de modo artificial.
- source_word: πρὸς
  choice: contra
  rationale: Com πόλεμον, a preposição indica direção hostil; “contra” expressa naturalmente a ação militar adversária.
- source_word: ἐνετράπη
  choice: foi derrotado
  rationale: No contexto de batalha, o passivo indica que Ptolemeu foi obrigado a recuar ou sofreu derrota. “Foi derrotado” comunica o sentido militar sem afirmar mais precisamente o grau da debandada.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: diante dele
  rationale: A expressão idiomática descreve o recuo perante um adversário. “Diante dele” conserva a imagem do texto e soa natural em português.
- source_word: ἔφυγεν
  choice: fugiu
  rationale: O verbo denota diretamente a fuga em combate; “fugiu” é claro e fiel.
- source_word: ἔπεσαν
  choice: caíram
  rationale: Mantém a imagem militar do original e evita determinar se todos morreram.
- source_word: τραυματίαι πολλοί
  choice: muitos caíram feridos
  rationale: A expressão se refere a numerosas pessoas feridas que caíram em combate. A formulação preserva tanto o verbo “caíram” quanto a referência aos feridos, sem restringir o resultado aos sobreviventes.
