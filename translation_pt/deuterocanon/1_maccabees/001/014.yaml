  text: And they built a gymnasium in Jerusalem according to the customs of the nations[a].
translation:
  language: pt
  text: E construíram um ginásio em Jerusalém, segundo os costumes das nações[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos gentios”. O grego diz “das nações”, expressão judaica comum para se referir aos povos não judeus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾠκοδόμησαν
  choice: construíram
  rationale: O aoristo indica diretamente o ato concluído de edificar. “Construíram” é natural em português e adequado para uma instituição e seu espaço físico.
- source_word: γυμνάσιον
  choice: ginásio
  rationale: Designa a instituição helenística específica de formação física e cultural, e não apenas um local genérico de exercícios. “Ginásio” conserva essa especificidade histórica.
- source_word: ἐν Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: É a forma locativa corrente e natural em português.
- source_word: κατὰ
  choice: segundo
  rationale: Com o acusativo, expressa conformidade com um padrão. “Segundo” comunica isso de modo claro, conciso e digno.
- source_word: τὰ νόμιμα
  choice: os costumes
  rationale: No contexto, refere-se a práticas e instituições socialmente estabelecidas, não apenas a leis formais. “Costumes” preserva essa amplitude.
- source_word: τῶν ἐθνῶν
  choice: das nações
  rationale: Mantém o sentido lexical básico e a formulação judaica que se refere aos povos não judeus, sem acrescentar a carga pejorativa que “pagãos” poderia sugerir.
theological_decisions:
- issue: Tradução de ἐθνῶν em contexto judaico contrastivo
  choice: das nações
  alternative: dos gentios
  rationale: “Das nações” preserva a forma lexical e a tensão entre os costumes judaicos e os dos povos não judeus, sem intensificar o juízo do texto. A nota esclarece o uso contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Ginásio” é mantido como termo histórico-cultural; o contexto e a nota evitam que seja reduzido ao sentido moderno de simples instalação esportiva.
