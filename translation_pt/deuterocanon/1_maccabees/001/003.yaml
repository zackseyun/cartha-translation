  yaml_path: translation/deuterocanon/1_maccabees/001/003.yaml
  text: And he passed on to the ends of the earth, and took plunder from a multitude of nations; and the earth was quiet before him, and he was exalted, and his heart was lifted up.
translation:
  language: pt
  text: E avançou até os confins da terra e tomou despojos de uma multidão de nações; a terra aquietou-se diante dele, e ele foi exaltado, e seu coração se elevou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se orgulhoso”. O grego diz literalmente “seu coração se elevou”, expressão frequentemente associada ao orgulho.'
    reason: Alternativa lexical que explicita a provável conotação moral do idioma grego.
lexical_decisions:
- source_word: διῆλθεν
  choice: avançou
  rationale: No contexto de conquista, expressa o movimento contínuo através de territórios sem especificar indevidamente a rota ou o modo.
- source_word: ἕως ἄκρων τῆς γῆς
  choice: até os confins da terra
  rationale: Preserva a expressão abrangente e hiperbólica para as regiões mais distantes do mundo, em linguagem portuguesa natural e digna.
- source_word: ἔλαβεν σκῦλα
  choice: tomou despojos
  rationale: σκῦλα designa bens tomados na guerra; “despojos” mantém com clareza o contexto militar.
- source_word: πλήθους ἐθνῶν
  choice: de uma multidão de nações
  rationale: Reproduz tanto a ideia de grande número em πλήθους quanto a referência coletiva de ἐθνῶν.
- source_word: ἡσύχασεν ἡ γῆ ἐνώπιον αὐτοῦ
  choice: a terra aquietou-se diante dele
  rationale: Conserva a imagem da terra reduzida à quietude perante seu domínio, sem definir se essa condição era paz voluntária ou submissão imposta.
- source_word: ὑψώθη
  choice: foi exaltado
  rationale: Mantém a forma passiva e a ideia de elevação em posição, poder ou prestígio.
- source_word: ἐπήρθη ἡ καρδία αὐτοῦ
  choice: seu coração se elevou
  rationale: Preserva a imagem idiomática do grego e sua provável conotação de orgulho, sem substituir a figura por uma interpretação explícita no texto principal.
theological_decisions:
- issue: Avaliação moral de ἐπήρθη ἡ καρδία αὐτοῦ
  choice: seu coração se elevou
  alternative: tornou-se orgulhoso
  rationale: A expressão provavelmente sugere orgulho ou arrogância, mas o grego comunica isso por uma imagem idiomática, não por um adjetivo moral explícito. A tradução mantém essa tensão, enquanto a nota esclarece a leitura possível.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira e compreensão internacional. A cadência narrativa e o paralelismo do grego foram preservados sem tornar a frase artificial.
