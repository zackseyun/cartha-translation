  yaml_path: translation/deuterocanon/1_maccabees/001/040.yaml
  text: According to her glory[a], her dishonor was multiplied[b], and her exaltation was turned into mourning.
translation:
  language: pt
  text: Na proporção da sua glória[a], sua desonra se multiplicou, e sua elevação[b] transformou-se em luto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Conforme a sua glória”; κατά pode indicar correspondência ou proporção.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “altura”; também pode ser entendido em sentido figurado como “exaltação” ou “grandeza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν δόξαν αὐτῆς
  choice: À medida de sua glória
  rationale: Com o acusativo, κατά expressa aqui correspondência ou proporção. “À medida de” comunica essa relação em português natural, enquanto “glória” preserva o registro elevado e o contraste com “desonra”.
- source_word: ἐπληθύνθη
  choice: multiplicou-se
  rationale: A forma pronominal conserva o sentido passivo de aumento intenso, com mais naturalidade em português do que “foi multiplicada”.
- source_word: ἀτιμασμός
  choice: desonra
  rationale: O termo designa desonra, vergonha ou humilhação. “Desonra” forma um contraste direto com “glória” e mantém a estrutura abstrata do grego.
- source_word: ὕψος
  choice: elevação
  rationale: A palavra pode significar literalmente “altura” e, em sentido figurado, condição elevada ou exaltação. “Elevação” preserva a imagem vertical sem limitar o texto a um único sentido.
- source_word: ἐστράφη εἰς πένθος
  choice: transformou-se em luto
  rationale: A expressão descreve uma reversão ou transformação de estado. Esta formulação é corrente em português e conserva a imagem do original.
