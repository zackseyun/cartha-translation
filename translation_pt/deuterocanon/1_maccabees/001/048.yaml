  text: and to leave their sons uncircumcised[a], to make their souls abominable with every unclean thing, and to profane them[b],
translation:
  language: pt
  text: e deixar seus filhos incircuncisos, tornar suas almas[a] abomináveis com tudo o que é impuro e profaná-las[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas vidas” ou “suas pessoas”. Aqui, “alma” pode designar a vida ou a pessoa inteira, e não necessariamente uma parte separada do ser humano.
    reason: lexical_alternative
  - marker: b
    text: No grego, “profaná-las” retoma gramaticalmente “suas almas”, embora o sentido possa abranger as próprias pessoas.
    reason: referent_clarification
lexical_decisions:
- source_word: ἀφεῖναι
  choice: deixar
  rationale: O infinitivo de ἀφίημι indica deixar ou manter alguém em determinado estado; “deixar” é natural no contexto das ordens impostas.
- source_word: τοὺς υἱοὺς αὐτῶν
  choice: seus filhos
  rationale: υἱούς designa especificamente os filhos do sexo masculino, o que corresponde à referência imediata à circuncisão.
- source_word: ἀπεριτμήτους
  choice: incircuncisos
  rationale: Equivalente direto e tradicional que conserva a dimensão corporal, ritual e pactual do termo.
- source_word: βδελύξαι
  choice: tornar ... abomináveis
  rationale: O verbo expressa a ideia de tornar detestável ou abominável. Esta tradução preserva sua força própria, em vez de reduzi-lo apenas à noção de contaminação.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: suas almas
  rationale: ψυχή pode indicar alma, vida ou a própria pessoa. “Almas” mantém o peso moral e religioso do contexto sem eliminar a amplitude semântica, registrada em nota.
- source_word: ἐν παντὶ ἀκαθάρτῳ
  choice: com tudo o que é impuro
  rationale: Expressa de modo corrente a associação ou o meio indicado por ἐν e conserva a abrangência de παντί.
- source_word: βεβηλώσαι
  choice: profaná-las
  rationale: βεβηλόω significa profanar ou dessacralizar. O pronome feminino retoma gramaticalmente “almas” e preserva a distinção entre tornar abominável e profanar.
theological_decisions:
- issue: Sentido de ψυχή no contexto de impureza ritual e infidelidade à aliança
  choice: suas almas
  alternative: suas vidas; suas pessoas
  rationale: “Almas” conserva a gravidade moral e religiosa do grego, enquanto a nota reconhece que ψυχή pode abranger a vida ou a pessoa inteira, sem impor uma antropologia técnica.
- issue: Objeto implícito de βεβηλώσαι
  choice: profaná-las, retomando “almas”
  alternative: profanar a si mesmos
  rationale: A concordância e a estrutura grega apontam para τὰς ψυχὰς como objeto, embora o sentido possa abranger as próprias pessoas. A tradução segue a sintaxe e a nota registra o alcance possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a estrutura coordenada do decreto e o contraste lexical entre tornar abominável e profanar.
