  text: E travou muitas guerras, apoderou-se de fortalezas e massacrou reis,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεστήσατο
  choice: travou
  rationale: Na expressão συνεστήσατο πολέμους, o verbo indica empreender ou conduzir guerras. “Travou” é a formulação portuguesa natural para esse sentido militar.
- source_word: πολέμους πολλούς
  choice: muitas guerras
  rationale: O plural de πόλεμος designa conflitos militares de modo amplo. “Guerras” preserva essa abrangência, sem restringir o sentido a campanhas ou batalhas.
- source_word: ἐκράτησεν
  choice: apoderou-se de
  rationale: Neste contexto, κρατέω expressa tomar posse ou obter domínio pela força. “Apoderou-se de” transmite com clareza a conquista militar.
- source_word: ὀχυρωμάτων
  choice: fortalezas
  rationale: Ὀχύρωμα designa lugares fortificados. “Fortalezas” é corrente, conciso e adequado ao contexto militar.
- source_word: ἔσφαξεν
  choice: massacrou
  rationale: Σφάζω é um verbo forte, associado a matar violentamente ou chacinar. “Massacrou” conserva a severidade do grego melhor que o termo mais neutro “matou”.
- source_word: βασιλεῖς
  choice: reis
  rationale: “Reis” corresponde diretamente ao título político específico βασιλεῖς; “governantes” seria menos preciso.
