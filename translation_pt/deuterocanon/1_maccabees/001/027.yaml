  text: Every bridegroom took up lamentation[a]; she who sat in the bridal chamber became one in mourning.
translation:
  language: pt
  text: Todo noivo entoou uma lamentação[a]; aquela que estava sentada no aposento nupcial ficou de luto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais simples: “Todo noivo lamentou; aquela que estava sentada no aposento nupcial ficou de luto.” O grego emprega uma formulação poética condensada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: Todo
  rationale: Com o substantivo singular νυμφίος, tem sentido distributivo; “todo noivo” é natural em português e preserva a abrangência.
- source_word: νυμφίος
  choice: noivo
  rationale: É o termo português corrente para o homem no contexto das núpcias e mantém o paralelismo com a figura feminina implícita na segunda oração.
- source_word: ἀνέλαβε
  choice: entoou
  rationale: Em combinação com θρῆνον, indica iniciar ou levantar um lamento; “entoou” preserva a imagem de uma lamentação expressa, possivelmente cantada, sem exigir que fosse um canto formal.
- source_word: θρῆνον
  choice: uma lamentação
  rationale: Designa lamento ou canto fúnebre. “Lamentação” conserva o tom solene sem restringir o sentido a uma elegia formal.
- source_word: καθημένη
  choice: aquela que estava sentada
  rationale: O particípio feminino não nomeia explicitamente a mulher, embora o contexto nupcial aponte para a noiva. A formulação preserva essa referência implícita.
- source_word: ἐν παστῷ
  choice: no aposento nupcial
  rationale: παστός designa o quarto ou aposento das núpcias; a escolha é clara e digna em português moderno.
- source_word: ἐγένετο ἐν πένθει
  choice: ficou de luto
  rationale: A construção expressa mudança de estado. “Ficou de luto” comunica essa transição de modo natural, em vez de apresentar apenas uma condição estática.
