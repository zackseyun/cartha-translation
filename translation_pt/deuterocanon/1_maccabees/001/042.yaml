  text: and that each should abandon his own customs[b][a]. And all the nations accepted the word of the king.
translation:
  language: pt
  text: e que cada um abandonasse seus próprios costumes[a]. E todas as nações aceitaram a palavra do rei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «suas próprias leis» ou «seus próprios costumes ancestrais». O termo grego pode designar práticas tradicionais de caráter legal e religioso, especialmente observâncias recebidas dos antepassados.
    reason: lexical_alternative
  - marker: b
    text: Ou «a ordem do rei» ou «o decreto do rei». O grego diz literalmente «a palavra do rei».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείπειν
  choice: abandonasse
  rationale: O infinitivo indica deixar ou renunciar a uma prática estabelecida; «abandonasse» comunica a força dessa ruptura no contexto coercivo.
- source_word: ἕκαστον
  choice: cada um
  rationale: Preserva o sentido distributivo singular do grego.
- source_word: τὰ νόμιμα αὐτοῦ
  choice: seus próprios costumes
  rationale: νόμιμα pode designar práticas tradicionais de caráter legal e religioso, não apenas leis codificadas; «costumes» é natural e mantém essa amplitude.
- source_word: ἐπεδέξαντο
  choice: aceitaram
  rationale: Expressa o sentido básico de receber ou aceitar, sem tornar explícita uma ideia de obediência que o contexto apenas sugere.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Traduz diretamente a referência ampla aos povos sujeitos à determinação do rei, sem introduzir o contraste religioso específico de «gentios».
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: a palavra do rei
  rationale: Mantém a formulação concreta do grego e sua ambiguidade, embora λόγος, neste contexto régio, também possa significar ordem ou decreto.
