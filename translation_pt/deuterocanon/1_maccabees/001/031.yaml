  text: And he took the plunder of the city and burned it with fire, and he tore down its houses and its walls all around.
translation:
  language: pt
  text: E ele tomou o saque da cidade, incendiou-a e derrubou suas casas e muralhas por toda a volta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: tomou
  rationale: Tradução direta de λαμβάνω, adequada à sequência narrativa e sem especificar além do texto o modo de obtenção.
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: o saque da cidade
  rationale: σκῦλα designa bens tomados em guerra ou pilhagem; “saque” conserva o sentido militar e violento. O genitivo foi mantido como “da cidade”.
- source_word: ἐνεπύρισεν αὐτὴν πυρί
  choice: incendiou-a
  rationale: “Incendiou” expressa naturalmente em português tanto o ato de atear fogo quanto a ideia explícita de πυρί, evitando a redundância pouco idiomática de “queimou-a com fogo”.
- source_word: καθεῖλεν
  choice: derrubou
  rationale: O verbo indica destruição ou desmantelamento forçado; “derrubou” é claro, vigoroso e natural no contexto.
- source_word: τοὺς οἴκους αὐτῆς
  choice: suas casas
  rationale: οἶκοι refere-se aqui às construções residenciais da cidade; “casas” é a equivalência mais direta.
- source_word: τὰ τείχη αὐτῆς
  choice: suas muralhas
  rationale: τείχη são os muros defensivos da cidade; “muralhas” torna essa função inequívoca em português.
- source_word: κύκλῳ
  choice: ao redor
  rationale: Indica a extensão circundante das muralhas ou de sua destruição; “ao redor” preserva a expressão sem acrescentar uma totalidade não explicitada lexicalmente.
