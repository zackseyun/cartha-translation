  yaml_path: translation/deuterocanon/1_maccabees/008/025.yaml
  text: The nation of the Jews shall be an ally[a], as the occasion may indicate for them, with a full heart.
translation:
  language: pt
  text: A nação dos judeus agirá como aliada, conforme a ocasião lhes indicar, de todo o coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com o coração pleno”.
    reason: Preserva a imagem semítica e a forma concreta da expressão grega καρδίᾳ πλήρει, vertida de maneira idiomática no texto.
lexical_decisions:
- source_word: συμμαχήσει
  choice: agirá como aliada
  rationale: O futuro de συμμαχέω expressa atuar em aliança. A formulação preserva o sentido diplomático e evita acrescentar um objeto que não está explícito no grego.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: a nação dos judeus
  rationale: Mantém o sentido político e coletivo de ἔθνος e reproduz de modo direto o genitivo τῶν Ἰουδαίων.
- source_word: ὡς ἂν ὁ καιρὸς ὑπογράφῃ αὐτοῖς
  choice: conforme a ocasião lhes indicar
  rationale: ὡς ἄν com o subjuntivo confere caráter eventual ou indefinido; καιρός é a ocasião oportuna ou a circunstância, e ὑπογράφῃ pode significar indicar ou prescrever. “Conforme ... indicar” conserva essa abertura sem tornar a frase excessivamente rígida.
- source_word: καρδίᾳ πλήρει
  choice: de todo o coração
  rationale: É a expressão portuguesa natural para a ideia de plena sinceridade e empenho, enquanto a nota preserva a imagem literal do grego.
