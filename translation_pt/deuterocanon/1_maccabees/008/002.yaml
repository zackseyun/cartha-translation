translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a ênfase de δυνατοὶ ἰσχύϊ e a ambiguidade de ἐν τοῖς Γαλάταις. Os presentes gregos em discurso indireto foram vertidos de acordo com o quadro narrativo: “são” preserva a afirmação sobre o poder vigente dos romanos, enquanto “realizaram” apresenta as façanhas já relatadas e culmina naturalmente em sua dominação e tributação dos gálatas.'
