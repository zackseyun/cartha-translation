  text: and that they are mighty in strength[a]. They told him about their wars and the brave deeds they did among the Galatians[b], and that they had subdued them and brought them under tribute.
translation:
  language: pt
  text: e que são poderosos e fortes. Contaram-lhe suas guerras e os feitos de bravura[a] que realizam entre os gálatas[b], e que os dominaram e os sujeitaram a tributo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atos de valor”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “entre os gálatas”; a expressão pode se referir às ações militares romanas em relação aos gálatas ou em território gálata.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατοὶ ἰσχύϊ
  choice: poderosos por sua força
  rationale: Preserva a ênfase da expressão grega, que combina poder e força, sem produzir uma formulação excessivamente artificial em português.
- source_word: διηγήσαντο
  choice: Contaram-lhe
  rationale: Expressa de modo natural o ato de narrar ou relatar algo a Judas, mantendo o pronome dativo αὐτῷ.
- source_word: πολέμους
  choice: guerras
  rationale: Corresponde ao sentido amplo do plural grego; “batalhas” seria mais restrito e “campanhas” mais interpretativo.
- source_word: ἀνδραγαθίας
  choice: feitos de bravura
  rationale: Comunica atos valorosos em contexto militar, evitando uma tradução arcaica ou desnecessariamente marcada por gênero.
- source_word: ποιοῦσιν ἐν τοῖς Γαλάταις
  choice: que realizaram entre os gálatas
  rationale: Mantém a formulação espacial e relacional relativamente aberta de ἐν τοῖς Γαλάταις, sem convertê-la de modo explícito em “contra os gálatas” ou “na Galácia”.
- source_word: κατεκράτησαν αὐτῶν
  choice: os dominaram
  rationale: Traduz a ideia de prevalecer sobre eles e obter domínio, adequada ao contexto militar e político.
- source_word: ἤγαγον αὐτοὺς ὑπὸ φόρον
  choice: os sujeitaram a tributo
  rationale: Reproduz de forma idiomática a imposição de uma obrigação tributária como sinal de submissão política.
