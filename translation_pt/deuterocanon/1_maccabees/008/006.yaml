  text: and Antiochus the great king of Asia[a], who came against them in war, having one hundred twenty elephants and cavalry and chariots and a very great force, was crushed by them.
translation:
  language: pt
  text: E Antíoco, o grande rei da Ásia, que marchou contra eles para guerrear, com cento e vinte elefantes, cavalaria[a], carros de guerra e uma força muito grande, foi esmagado por eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente “cavalo”, no singular, mas aqui o termo tem sentido coletivo e se refere à cavalaria ou às tropas montadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίοχον
  choice: Antíoco
  rationale: Forma tradicional e amplamente reconhecida do nome grego em português.
- source_word: τὸν μέγαν βασιλέα τῆς Ἀσίας
  choice: o grande rei da Ásia
  rationale: Preserva a estrutura apositiva e traduz diretamente μέγαν, sem transformar a expressão em um título técnico não explicitado pelo texto.
- source_word: τὸν πορευθέντα ἐπʼ αὐτοὺς εἰς πόλεμον
  choice: que marchou contra eles para a guerra
  rationale: O particípio de πορεύομαι indica deslocamento militar; “marchou contra” comunica naturalmente o avanço hostil, enquanto “para a guerra” mantém εἰς πόλεμον.
- source_word: ἔχοντα
  choice: com
  rationale: Em português, “com” introduz de modo natural a relação circunstancial e o inventário das forças que Antíoco tinha consigo.
- source_word: ἑκατὸν εἴκοσι ἐλέφαντας
  choice: cento e vinte elefantes
  rationale: Tradução numérica direta e idiomática em português.
- source_word: ἵππον
  choice: cavalaria
  rationale: Embora esteja no singular, ἵππον tem sentido coletivo neste inventário militar e designa a tropa montada.
- source_word: ἅρματα
  choice: carros de guerra
  rationale: Explicita o sentido militar de ἅρματα e evita a possível leitura moderna de “carros” como automóveis.
- source_word: δύναμιν πολλὴν σφόδρα
  choice: um exército muito numeroso
  rationale: No contexto, δύναμις designa uma força militar; “exército” é claro para o leitor comum, e “muito numeroso” representa πολλὴν σφόδρα.
- source_word: συνετρίβη
  choice: foi esmagado
  rationale: Mantém a intensidade do passivo de συντρίβω, mais forte do que uma simples referência a ser derrotado.
- source_word: ἀπʼ αὐτῶν
  choice: por eles
  rationale: Expressa diretamente a agência dos romanos na derrota.
