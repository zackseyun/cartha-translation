review_pass:
  verdict: revise
  source_fidelity: A tradução preserva com precisão o referente, o título régio, o avanço militar, o inventário bélico, a intensidade de συνετρίβη e a agência expressa por ἀπʼ αὐτῶν. «Cavalaria» é uma boa interpretação coletiva de ἵππον, devidamente documentada em nota. Convém, porém, representar δύναμιν de forma um pouco mais ampla como «força», sem restringi-la desnecessariamente a «exército».
  naturalness: «Marchou contra eles para a guerra» é compreensível, mas pouco idiomático no português moderno. «Marchou contra eles para guerrear» mantém o sentido de εἰς πόλεμον e soa mais natural. A pontuação também separa com clareza a oração relativa e a enumeração militar.
  terminology: «Antíoco», «grande rei da Ásia», «cavalaria», «carros de guerra» e «foi esmagado» são escolhas adequadas, claras e fiéis ao registro histórico-militar. «Uma força muito grande» preserva melhor a amplitude de δύναμις e a ênfase de πολλὴν σφόδρα.
  issues:
