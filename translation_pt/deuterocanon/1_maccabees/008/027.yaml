base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/027.yaml
  text: Likewise[a], if war should first come upon the nation of the Jews, the Romans will fight as allies wholeheartedly[b], as the occasion may direct them.
translation:
  language: pt
  text: Do mesmo modo, se a guerra sobrevier primeiro à nação dos judeus, os romanos lutarão como aliados com total empenho[a], conforme a ocasião lhes indicar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de todo o coração” ou “com toda a dedicação” (ἐκ ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “conforme as circunstâncias lhes sugerirem” ou “conforme o momento lhes prescrever”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτὰ
  choice: Do mesmo modo
  rationale: Retoma, de maneira natural, os termos recíprocos apresentados anteriormente e conserva a força comparativa da expressão grega.
- source_word: ἔθνει Ἰουδαίων
  choice: à nação dos judeus
  rationale: Ἔθνος designa aqui um povo ou nação; a formulação acompanha de perto a construção grega sem acrescentar conotações políticas posteriores.
- source_word: συμβῇ προτέρῳ πόλεμος
  choice: se a guerra sobrevier primeiro
  rationale: A construção com ἐὰν e o subjuntivo expressa uma eventualidade, enquanto προτέρῳ marca prioridade temporal; “sobrevier” comunica adequadamente uma guerra que atinge alguém.
- source_word: συμμαχήσουσιν
  choice: lutarão como aliados
  rationale: O verbo se refere à prestação efetiva de auxílio militar como aliado, e não apenas ao estabelecimento abstrato de uma aliança.
- source_word: ἐκ ψυχῆς
  choice: com total empenho
  rationale: A expressão indica dedicação integral ou ação de todo o coração; “com total empenho” é clara e apropriada ao registro de um tratado.
- source_word: ὡς ἂν αὐτοῖς ὁ καιρὸς ὑπογράφῃ
  choice: conforme a ocasião lhes indicar
  rationale: Καιρός denota a ocasião ou circunstância oportuna, e ὑπογράφῃ pode transmitir a ideia de indicar, prescrever ou orientar. A tradução mantém aberta essa nuance e a limitação circunstancial da ajuda romana.
