base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/023.yaml
  text: May it go well for the Romans and for the nation of the Jews[a], on sea and on land forever[b]; and may sword and enemy be far from them.
translation:
  language: pt
  text: Que tudo vá bem para os romanos e para a nação dos judeus, no mar e em terra[a], para sempre; e que a espada[b] e o inimigo fiquem longe deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no mar e na terra”. O grego emprega um par convencional de domínios para expressar bem-estar em todas as esferas.
    reason: lexical_alternative
  - marker: b
    text: “Espada” provavelmente representa a guerra por metonímia, mas o texto principal conserva o termo concreto do grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς γένοιτο
  choice: Que tudo vá bem
  rationale: Expressa de modo natural e atual o optativo de desejo ou bênção, preservando a ideia de que as coisas transcorram favoravelmente.
- source_word: Ῥωμαίοις
  choice: para os romanos
  rationale: O dativo indica os beneficiários do voto; o artigo é natural em português e combina com a expressão paralela seguinte.
- source_word: τῷ ἔθνει τῶν Ἰουδαίων
  choice: para a nação dos judeus
  rationale: Preserva o sentido político-étnico de ἔθνος e acompanha de perto a estrutura grega sem perder naturalidade.
- source_word: ἐν τῇ θαλάσσῃ καὶ ἐπὶ τῆς ξηρᾶς
  choice: no mar e em terra
  rationale: Mantém o par convencional de domínios, provavelmente um merismo que abrange todas as esferas de atuação.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a forma corrente e clara de exprimir duração indefinida ou permanente neste contexto de aliança.
- source_word: ῥομφαία
  choice: espada
  rationale: Conserva a imagem concreta do termo grego, embora no contexto a arma provavelmente represente a guerra.
- source_word: ἐχθρός
  choice: inimigo
  rationale: Mantém o substantivo singular e representativo do grego, com sentido possivelmente coletivo.
- source_word: μακρυνθείη ἀπ' αὐτῶν
  choice: fiquem longe deles
  rationale: Reproduz o segundo optativo como desejo e preserva a imagem espacial de afastamento, em português natural.
