base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/010.yaml
  text: And when the report became known to them, they sent one general against them, and they fought against them, and many of them fell wounded, and they took their wives and their children captive, and plundered them, and gained control of their land, and pulled down their strongholds, and plundered them.
translation:
  language: pt
  text: E, quando a notícia chegou ao conhecimento deles, enviaram contra eles um único general. Combateram contra eles, e muitos deles caíram feridos. Levaram suas mulheres e seus filhos como cativos, saquearam-nos, tomaram o controle de sua terra, derrubaram suas fortalezas e os saquearam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego repete “os saquearam” no fim do versículo. A repetição foi mantida no texto principal porque consta na fonte, embora possa representar ênfase deliberada ou uma duplicação ocorrida na transmissão do texto.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώσθη ὁ λόγος
  choice: a notícia chegou ao conhecimento deles
  rationale: Neste contexto, λόγος designa a notícia ou informação sobre os acontecimentos, e ἐγνώσθη indica que ela se tornou conhecida. A formulação é natural em português e não reduz λόγος à ideia isolada de “palavra”.
- source_word: ἀπέστειλαν ἐπʼ αὐτοὺς στρατηγὸν ἕνα
  choice: enviaram contra eles um único general
  rationale: “General” comunica claramente o sentido militar de στρατηγός. “Um único” preserva a ênfase de ἕνα, segundo a qual apenas um comandante foi enviado.
- source_word: ἐπολέμησαν πρὸς αὐτούς
  choice: combateram contra eles
  rationale: Tradução direta e corrente da ação militar, preservando a força adversativa de πρὸς.
- source_word: ἔπεσαν ἐξ αὐτῶν τραυματίαι πολλοί
  choice: muitos deles caíram feridos
  rationale: τραυματίαι se refere a feridos ou baixas. “Caíram feridos” mantém a imagem militar sem afirmar que todos morreram.
- source_word: ᾐχμαλώτισαν
  choice: levaram cativos
  rationale: O verbo descreve a captura de pessoas em contexto de guerra. “Levaram cativos” é idiomático e conserva esse sentido.
- source_word: ἐπρονόμευσαν αὐτούς
  choice: saquearam-nos / os saquearam
  rationale: O verbo significa saquear ou despojar após a vitória. A repetição presente no grego foi mantida, com variação apenas na colocação pronominal para naturalidade em português.
- source_word: κατεκράτησαν τῆς γῆς αὐτῶν
  choice: tomaram o controle de sua terra
  rationale: κατακρατέω com genitivo expressa domínio ou controle. A tradução evita afirmar uma posse jurídica mais específica do que o texto permite.
- source_word: καθεῖλον τὰ ὀχυρώματα αὐτῶν
  choice: derrubaram suas fortalezas
  rationale: ὀχυρώματα são fortalezas ou posições fortificadas, e καθεῖλον indica que foram derrubadas ou demolidas.
