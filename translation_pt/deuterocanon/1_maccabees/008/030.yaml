  yaml_path: translation/deuterocanon/1_maccabees/008/030.yaml
  text: But if[a], after these terms, these people and those decide to add or to remove anything, they will do so by their own choice[b], and whatever they add or remove will be valid.
translation:
  language: pt
  text: Mas, se, depois destas cláusulas, uns e outros[a] decidirem acrescentar ou retirar alguma coisa, farão isso por escolha própria, e tudo o que acrescentarem ou retirarem será válido[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ambas as partes”; o grego repete o mesmo demonstrativo, referindo-se aos dois lados do acordo.
    reason: lexical_alternative
  - marker: b
    text: Ou “terá força” ou “será vinculante”, neste contexto jurídico.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους
  choice: cláusulas
  rationale: No contexto de um tratado, o termo designa as disposições acordadas, e não meras palavras; “cláusulas” comunica com naturalidade esse sentido jurídico.
- source_word: βουλεύσωνται
  choice: decidirem
  rationale: O verbo pode indicar deliberar ou formar uma resolução; nesta condição jurídica, “decidirem” expressa de modo claro o resultado da deliberação.
- source_word: οὗτοι καὶ οὗτοι
  choice: uns e outros
  rationale: A repetição dos demonstrativos aponta para os dois lados do acordo. “Uns e outros” preserva a referência bilateral sem identificar as partes além do que o grego explicita.
- source_word: προσθεῖναι ἢ ἀφελεῖν
  choice: acrescentar ou retirar
  rationale: O par verbal descreve a modificação das cláusulas do tratado e mantém a formulação direta do grego.
- source_word: ἐξ αἱρέσεως αὐτῶν
  choice: por escolha própria
  rationale: αἵρεσις tem aqui o sentido de escolha ou decisão, não o de seita; a expressão atribui a alteração à decisão das próprias partes.
- source_word: κύρια
  choice: válido
  rationale: No contexto jurídico, o adjetivo indica que a alteração tem validade ou força. “Válido” é conciso e natural, sem acrescentar uma noção alheia ao texto.
