lexical_decisions:
- source_word: χώρα
  choice: terra
  rationale: “Terra” expressa naturalmente uma região ou território e evita projetar de modo excessivo a ideia de um Estado-nação moderno.
- source_word: Σπανίας
  choice: Espanha
  rationale: É a forma geográfica corrente e reconhecível em português para o território antigo referido pelo grego.
- source_word: κατακρατῆσαι
  choice: assumir o controle de
  rationale: O infinitivo indica finalidade, e o verbo composto comunica domínio efetivo; a expressão preserva essa força sem sugerir necessariamente um único ato de tomada violenta.
- source_word: μέταλλα
  choice: minas
  rationale: O termo pode designar metais ou minas; com “prata e ouro” e neste contexto de domínio econômico, “minas” oferece o sentido contextual mais provável, mantendo-se a alternativa em nota.
- source_word: ἀργυρίου
  choice: prata
  rationale: Equivalente português direto e natural para o metal precioso.
- source_word: χρυσίου
  choice: ouro
  rationale: Equivalente português direto e natural, em paralelo com “prata”.
- source_word: τοῦ ἐκεῖ
  choice: que havia ali
  rationale: Explicita de modo idiomático em português que as minas se localizavam naquela terra, sem acrescentar conteúdo substancial.
