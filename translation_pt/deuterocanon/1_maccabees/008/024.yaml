  text: But if war comes first to Rome, or to any of their allies, anywhere within their dominion,
translation:
  language: pt
  text: Mas, se a guerra atingir primeiro Roma ou qualquer um dos seus aliados, em qualquer parte de seus domínios,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ ἐνστῇ πόλεμος
  choice: Mas, se a guerra atingir
  rationale: Reproduz naturalmente a condição e o sentido de uma guerra que sobrevém ou se apresenta, sem acrescentar interpretação.
- source_word: Ῥώμῃ προτέρα
  choice: primeiro Roma
  rationale: Mantém o dativo como alvo da guerra e associa προτέρα a Roma, isto é, caso Roma seja atingida antes.
- source_word: ἢ πᾶσι τοῖς συμμάχοις αὐτῶν
  choice: ou qualquer um dos seus aliados
  rationale: Embora πᾶσι seja literalmente 'todos', neste contexto distributivo a expressão portuguesa 'qualquer um' comunica que a condição vale para todo aliado, em concordância com o sentido da cláusula.
- source_word: ἐν πάσῃ κυρίᾳ αὐτῶν
  choice: em qualquer parte de seus domínios
  rationale: κυρία denota aqui território sob autoridade ou domínio; a formulação conserva a amplitude de πάσῃ e soa natural em português.
