base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/005.yaml
  text: And Philip[a], and Perseus king of the Kittians[b], and those who rose up against them—they crushed them in war and prevailed over them.
translation:
  language: pt
  text: E Filipe e Perseu, rei dos quitianos[a][b], e os que se levantaram contra eles — os romanos os esmagaram na guerra e prevaleceram sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em sentido literal, o grego diz “rei dos quitianos”. No contexto histórico, a expressão provavelmente se refere ao reino macedônio; por isso, algumas traduções dizem “rei dos macedônios”.
    reason: alternative_reading
  - marker: b
    text: O texto grego transmitido contém aqui a conjunção καί (“e”) repetida várias vezes. Isso parece ser uma irregularidade textual, mas não altera substancialmente o sentido.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππον
  choice: Filipe
  rationale: Forma portuguesa tradicional e reconhecível do nome grego Φίλιππος.
- source_word: Περσέα
  choice: Perseu
  rationale: Forma portuguesa tradicional do nome próprio grego Περσεύς.
- source_word: Κιτιέων
  choice: dos quitianos
  rationale: Preserva o etnônimo plural do texto grego, sem substituí-lo pela identificação histórica interpretativa com os macedônios.
- source_word: βασιλέα
  choice: rei
  rationale: Equivalente corrente do título real; pela construção grega, o singular é ligado diretamente a Perseu.
- source_word: τοὺς ἐπηρμένους ἐπʼ αὐτοὺς
  choice: os que se levantaram contra eles
  rationale: Mantém a imagem do verbo ἐπαίρω e expressa de modo natural uma ação hostil contra os romanos.
- source_word: συνέτριψαν
  choice: esmagaram
  rationale: Transmite a força da imagem de quebrar ou destroçar e indica derrota militar decisiva.
- source_word: πολέμῳ
  choice: na guerra
  rationale: Tradução idiomática do dativo no contexto militar, sem restringi-lo necessariamente a uma única batalha.
- source_word: κατεκράτησαν αὐτῶν
  choice: prevaleceram sobre eles
  rationale: Expressa domínio ou superioridade alcançada sem afirmar além do texto uma sujeição política permanente.
theological_decisions:
- issue: Identificação historicamente carregada de Κιτιέων
  choice: dos quitianos
  alternative: dos macedônios; de Cítio
  rationale: A tradução conserva o etnônimo transmitido pelo grego e deixa a provável identificação histórica para a nota, preservando a distinção entre texto e interpretação.
- issue: Referente do sujeito implícito em συνέτριψαν e κατεκράτησαν
  choice: os romanos
  alternative: eles
  rationale: O sujeito é recuperado do contexto anterior do relato sobre os romanos. Explicitá-lo em português evita que Filipe, Perseu ou seus aliados sejam tomados erroneamente como agentes, sem alterar o referente contextual.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais tradicionais. A repetição inicial de “e” acompanha a enumeração grega; a repetição anômala de καί no interior do versículo não foi reproduzida integralmente, mas é registrada em nota. O travessão separa a lista de adversários da ação dos romanos e reduz a ambiguidade sintática.
