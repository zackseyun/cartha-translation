base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/016.yaml
  text: And they entrust one man to rule over them each year and to exercise lordship over all their land[a], and all listen to the one, and there is no envy or jealousy among them.
translation:
  language: pt
  text: E confiam a um homem o governo sobre eles a cada ano e o domínio sobre toda a sua terra; e todos dão ouvidos a esse único homem,[a] e não há entre eles inveja nem ciúme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos obedecem a esse único homem”. O grego diz literalmente “todos ouvem o único”, expressão que, neste contexto de governo, pode implicar obediência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύουσιν
  choice: confiam
  rationale: Com os infinitivos que se seguem, o verbo indica que eles depositam autoridade nas mãos de alguém. “Confiam” preserva o valor lexical sem explicitar além do grego a ideia de nomeação.
- source_word: ἑνὶ ἀνθρώπῳ
  choice: a um homem
  rationale: Representa diretamente o masculino singular do grego e identifica uma única pessoa investida de autoridade.
- source_word: ἄρχειν αὐτῶν
  choice: o governo sobre eles
  rationale: A construção nominal com “confiam” soa natural em português e conserva a ideia de exercer autoridade política sobre o povo.
- source_word: κατ' ἐνιαυτόν
  choice: a cada ano
  rationale: Expressa com clareza a recorrência anual do encargo, sem decidir se a ênfase recai na duração exata do mandato ou na escolha anual.
- source_word: κυριεύειν πάσης τῆς γῆς αὐτῶν
  choice: o domínio sobre toda a sua terra
  rationale: “Domínio” mantém a força de κυριεύειν, distinta do simples ato de governar, enquanto “terra” preserva a amplitude sem restringi-la interpretativamente a “território”.
- source_word: ἀκούουσιν τοῦ ἑνός
  choice: dão ouvidos a esse único homem
  rationale: Mantém a imagem auditiva do grego e, no contexto de governo, permite a implicação de acatamento sem convertê-la diretamente em “obedecem”.
- source_word: φθόνος οὔτε ζῆλος
  choice: inveja nem ciúme
  rationale: 'Conserva a distinção entre os dois termos negativos: φθόνος como inveja e ζῆλος, neste paralelismo, como ciúme ou rivalidade.'
