translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. Conserva a estrutura coordenada e repetitiva do grego, mas usa «povo» e «manter a boa ordem entre si» para comunicar naturalmente o sentido cívico sem eliminar a ambiguidade de εὐκοσμεῖν ἑαυτούς.
