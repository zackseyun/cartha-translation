base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/015.yaml
  text: And they established a council for themselves, and every day three hundred and twenty would deliberate, continually taking counsel concerning the multitude, to govern themselves well.
translation:
  language: pt
  text: E instituíram para si um conselho, e todos os dias trezentos e vinte deliberavam, consultando continuamente sobre o povo, a fim de manter a boa ordem entre si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para se organizarem bem». O grego também pode ser entendido no sentido cívico de «para se governarem bem».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευτήριον
  choice: conselho
  rationale: Designa um órgão deliberativo; «conselho» é claro e não especifica além do grego se era um senado ou uma câmara física.
- source_word: ἐποίησαν ἑαυτοῖς
  choice: instituíram para si
  rationale: Em contexto institucional, traduz de modo natural a ideia literal de «fizeram para si», isto é, estabeleceram um órgão.
- source_word: καθ' ἡμέραν
  choice: todos os dias
  rationale: Expressa naturalmente a frequência habitual da ação.
- source_word: ἐβουλεύοντο
  choice: deliberavam
  rationale: O imperfeito indica atividade habitual ou reiterada, bem representada pelo imperfeito português.
- source_word: τριακόσιοι καὶ εἴκοσι
  choice: trezentos e vinte
  rationale: Tradução direta do numeral.
- source_word: βουλευόμενοι διὰ παντός
  choice: consultando continuamente
  rationale: Preserva a ação deliberativa do particípio e a duração enfática de διὰ παντός.
- source_word: περὶ τοῦ πλήθους
  choice: sobre o povo
  rationale: Neste contexto cívico, πλῆθος se refere ao conjunto da população; «povo» é mais natural em português que «multidão», sem restringi-lo a cidadãos ou tropas.
- source_word: τοῦ εὐκοσμεῖν ἑαυτούς
  choice: a fim de manter a boa ordem entre si
  rationale: εὐκοσμεῖν denota pôr ou conservar em boa ordem. A formulação mantém o valor reflexivo sem impor a ideia mais específica de governar.
