lexical_decisions:
- source_word: ἐπέλεξεν
  choice: escolheu
  rationale: O verbo indica escolher ou selecionar; “escolheu” é natural e não sugere uma nomeação formal além do que o grego expressa.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo direto e idiomático para o ato de mandar representantes.
- source_word: στῆσαι
  choice: estabelecer
  rationale: 'O infinitivo aoristo expressa a finalidade da missão: constituir formalmente uma relação diplomática.'
- source_word: φιλίαν
  choice: amizade
  rationale: Preserva o sentido lexical e, em associação com “aliança”, comunica a dimensão diplomática do termo.
- source_word: συμμαχίαν
  choice: aliança
  rationale: Designa uma aliança política ou militar; “aliança” mantém a amplitude do original sem especificar indevidamente seu caráter.
- source_word: τοῦ Ἀκχώς
  choice: filho de Acos
  rationale: 'O artigo repetido com o genitivo favorece a leitura de uma cadeia genealógica: Eupólemo, filho de João, que era filho de Acos.'
- source_word: αὐτοῖς
  choice: com os romanos
  rationale: O dativo tem sentido relacional neste contexto diplomático. A explicitação do referente evita em português a ambiguidade pronominal que poderia fazer “com eles” parecer referir-se aos enviados.
