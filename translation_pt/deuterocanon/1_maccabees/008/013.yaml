base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/013.yaml
  text: Whomever they wish to help and to make king[a], they make king; and whomever they wish, they remove[b], and they have become very great.
translation:
  language: pt
  text: A quem querem ajudar e fazer rei[a], fazem rei; e a quem querem, depõem, e foram grandemente exaltados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz, literalmente, “reinar”; neste contexto, a expressão indica fazer alguém reinar, isto é, estabelecê-lo como rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “tornaram-se muito poderosos”. A expressão grega significa, literalmente, “foram grandemente elevados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς δʼ ἂν βούλωνται
  choice: A quem querem
  rationale: 'A construção relativa indefinida com ἄν e subjuntivo tem sentido aberto: qualquer pessoa que decidam favorecer. A formulação é concisa e natural em português.'
- source_word: βοηθεῖν
  choice: ajudar
  rationale: Expressa de modo claro o auxílio político ou militar sem especificar além do grego.
- source_word: καὶ βασιλεύειν ... βασιλεύουσιν
  choice: e fazer rei ... fazem rei
  rationale: Embora βασιλεύειν e βασιλεύουσιν normalmente signifiquem reinar, a construção com o referente pessoal e o contraste com μεθιστῶσιν indica aqui a instalação de alguém como rei. A repetição preserva o paralelismo enfático do grego.
- source_word: μεθιστῶσιν
  choice: depõem
  rationale: No contexto político, o verbo significa retirar alguém de sua posição de governo. “Depõem” torna esse sentido explícito e contrasta naturalmente com “fazem rei”.
- source_word: ὑψώθησαν σφόδρα
  choice: foram grandemente exaltados
  rationale: Mantém a forma passiva e a imagem de elevação do grego, sem decidir silenciosamente se o foco recai sobre prestígio, domínio ou poder.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa. “Fazer rei” e “depor” comunicam o cenário político, enquanto a tradução mais formal da frase final preserva sua imagem e sua possível amplitude semântica.
