  yaml_path: translation/deuterocanon/1_maccabees/008/020.yaml
  text: Judas[a], who is also called Maccabeus, and his brothers and the multitude of the Jews sent us to you, to establish an alliance and peace with you, and to have us enrolled as your allies and friends.
translation:
  language: pt
  text: Judas, também chamado Macabeu, seus irmãos e a multidão dos judeus nos enviaram a vocês para estabelecer com vocês uma aliança e a paz, e para que fôssemos registrados[a] como aliados e amigos de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que fôssemos inscritos como aliados e amigos de vocês”. O grego provavelmente se refere ao registro ou à inscrição formal numa relação diplomática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  choice: Judas
  rationale: Forma portuguesa tradicional do nome grego Ἰούδας neste contexto histórico.
- source_word: ὁ καὶ Μακκαβαῖος
  choice: também chamado Macabeu
  rationale: Expressa naturalmente a função do segundo nome ou epíteto indicada pela construção grega ὁ καὶ.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: seus irmãos
  rationale: Tradução direta do termo familiar, sem generalizá-lo para um grupo mais amplo.
- source_word: τὸ πλῆθος τῶν Ἰουδαίων
  choice: a multidão dos judeus
  rationale: Preserva o sentido coletivo amplo de πλῆθος sem transformá-lo numa instituição formal.
- source_word: ἀπέστειλαν ἡμᾶς πρὸς ὑμᾶς
  choice: nos enviaram a vocês
  rationale: Tradução clara e corrente do envio dos representantes aos destinatários.
- source_word: στῆσαι
  choice: estabelecer
  rationale: No contexto diplomático, comunica a instituição formal da aliança e da paz.
- source_word: συμμαχίαν
  choice: uma aliança
  rationale: Mantém o sentido político e possivelmente militar do termo sem acrescentar uma especificação ausente no grego.
- source_word: εἰρήνην
  choice: a paz
  rationale: Conserva o substantivo simples do grego, sem convertê-lo explicitamente em “tratado de paz”.
- source_word: γραφῆναι ἡμᾶς
  choice: para que fôssemos registrados
  rationale: Reproduz a finalidade do infinitivo passivo e seu provável sentido administrativo ou diplomático em português natural.
- source_word: συμμάχους καὶ φίλους ὑμῶν
  choice: como aliados e amigos de vocês
  rationale: Preserva a fórmula diplomática e deixa clara a relação com os destinatários.
