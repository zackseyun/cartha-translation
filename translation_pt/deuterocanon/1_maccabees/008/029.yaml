  text: According to these terms[a], the Romans thus made an agreement with the people of the Jews.
translation:
  language: pt
  text: Foi nesses termos que os romanos fizeram um acordo com o povo dos judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos judeanos”. O termo grego pode referir-se tanto aos judeus como povo quanto ao povo da Judeia, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τοὺς λόγους τούτους
  choice: Conforme estes termos
  rationale: Em contexto diplomático, λόγοι designa as cláusulas ou condições anteriormente expostas; “termos” comunica esse sentido jurídico com naturalidade.
- source_word: οὕτως
  choice: assim
  rationale: Retoma a forma e as condições descritas anteriormente, preservando sua função no texto grego.
- source_word: ἔστησαν
  choice: fizeram um acordo
  rationale: O aoristo de ἵστημι tem aqui sentido elíptico de estabelecer formalmente um arranjo. “Fizeram um acordo” é idiomático em português e explicita apenas o que o contexto diplomático requer.
- source_word: Ῥωμαῖοι
  choice: os romanos
  rationale: Forma natural em português para o etnônimo coletivo que funciona como sujeito.
- source_word: τῷ δήμῳ
  choice: com o povo
  rationale: δῆμος indica o povo como corpo coletivo, e o dativo identifica a outra parte do acordo.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Neste contexto, a expressão provavelmente se refere ao povo judeu coletivamente, embora também possa ser entendida geograficamente como “judeus da Judeia” ou “judeanos”.
theological_decisions:
- issue: Sentido de Ἰουδαίων
  choice: dos judeus
  alternative: dos judeus da Judeia; dos judeanos
  rationale: A referência diplomática parece abranger o povo judeu como coletividade, não apenas os habitantes de uma região. A nota preserva a possível nuance geográfica sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com leve tom jurídico adequado ao contexto de tratado. A ordem de “assim” foi mantida próxima da estrutura grega sem comprometer a naturalidade.
