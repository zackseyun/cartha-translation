  source_fidelity: A oração reproduz adequadamente a deliberação passada (ἐβουλεύσαντο), os dois infinitivos e o pronome final. Contudo, «os que vinham da Grécia» tende a descrever pessoas que estavam vindo, enquanto οἱ ἐκ τῆς Ἑλλάδος identifica procedência («os da Grécia»); além disso, cria uma repetição temporal pouco natural com «tinham planejado vir». «Removê-los» preserva melhor a amplitude de ἐξᾶραι do que «eliminá-los» no texto principal.
  naturalness: A redação é clara, mas «os que vinham da Grécia tinham planejado vir» soa tautológica e pode ser entendida como deslocamento já em curso. «Os da Grécia tinham planejado vir» é idiomático, conciso e conserva a formulação de procedência.
  terminology: «Grécia» é a forma adequada para Ἑλλάς neste registro. A nota deve manter «eliminar» e «exterminar» como possibilidades contextuais, sem transformar a eliminação total em sentido obrigatório.
