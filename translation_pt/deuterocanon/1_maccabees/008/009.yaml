lexical_decisions:
- source_word: οἱ ἐκ τῆς Ἑλλάδος
  choice: os que vinham da Grécia
  rationale: Reproduz a expressão de procedência sem convertê-la diretamente no etnônimo mais interpretativo «os gregos».
- source_word: ἐβουλεύσαντο
  choice: tinham planejado
  rationale: Expressa em português atual a deliberação e a formação de um plano, sem acrescentar a conotação necessariamente sinistra de «tramado».
- source_word: ἐλθεῖν
  choice: vir
  rationale: Equivalente direto do infinitivo grego e natural na sequência verbal.
- source_word: ἐξᾶραι
  choice: eliminá-los
  rationale: No contexto político-militar, o verbo indica retirar pela força ou suprimir; «eliminar» conserva essa força sem afirmar inequivocamente aniquilação total.
- source_word: αὐτούς
  choice: -los
  rationale: Pronome acusativo que retoma o grupo mencionado no contexto.
