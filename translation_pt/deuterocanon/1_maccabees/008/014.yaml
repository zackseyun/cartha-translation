  yaml_path: translation/deuterocanon/1_maccabees/008/014.yaml
  text: And in all these matters not one of them put on a crown[b][a], nor did they clothe themselves in purple so as to exalt themselves by it.
translation:
  language: pt
  text: Em tudo isso, nenhum deles pôs sobre si um diadema[a], nem se vestiram de púrpura[b], de modo a se engrandecerem com ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coroa”; o termo grego designa especificamente uma faixa usada na cabeça como insígnia da realeza.
    reason: lexical_alternative
  - marker: b
    text: A púrpura era sinal de realeza ou de posição elevada.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἅπασιν τούτοις
  choice: Em tudo isso
  rationale: Expressão portuguesa natural que retoma, de modo amplo, as práticas e realizações romanas descritas no contexto anterior.
- source_word: ἐπέθετο ... διάδημα
  choice: pôs sobre si um diadema
  rationale: Mantém tanto a ação reflexiva de ἐπέθετο quanto o sentido específico de διάδημα como insígnia régia usada na cabeça.
- source_word: πορφύραν
  choice: se vestiram de púrpura
  rationale: Reproduz a referência concisa à púrpura, entendida metonimicamente como vestimenta associada à realeza e à alta posição social.
- source_word: ἁδρυνθῆναι
  choice: se engrandecerem
  rationale: Comunica a ideia contextual de adquirir grandeza ou destaque para si, sem restringir o termo à soberba como estado moral interior.
- source_word: ἐν αὐτῇ
  choice: com ela
  rationale: Toma o pronome feminino como referência à púrpura e expressa naturalmente seu valor instrumental em português.
