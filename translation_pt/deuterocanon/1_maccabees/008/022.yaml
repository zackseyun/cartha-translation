base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/022.yaml
  text: And this is the copy of the document that they copied onto bronze tablets and sent to Jerusalem, to be there among them as a memorial of peace and alliance.
translation:
  language: pt
  text: E esta é a cópia do documento que eles transcreveram em placas de bronze e enviaram a Jerusalém, para que ali estivesse com eles como memorial de paz e aliança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: cópia
  rationale: Designa uma reprodução de um texto escrito; “cópia” é natural e adequado ao contexto administrativo.
- source_word: γραφῆς
  choice: documento
  rationale: Neste contexto, refere-se ao registro oficial mencionado, e não à Escritura; “documento” comunica essa função com clareza.
- source_word: ἀντέγραψαν
  choice: transcreveram
  rationale: Indica que o texto foi reproduzido por escrito. “Transcreveram” evita a repetição pouco fluida de “cópia... copiaram”, sem perder o sentido.
- source_word: ἐπὶ δέλτους χαλκαῖς
  choice: em placas de bronze
  rationale: δέλτοι são suportes planos para escrita, e χαλκαῖς especifica o bronze; “placas de bronze” soa natural para uma inscrição oficial.
- source_word: μνημόσυνον
  choice: memorial
  rationale: Denota algo preservado como lembrança; “memorial” mantém o caráter formal e comemorativo do documento depositado.
- source_word: εἰρήνης
  choice: paz
  rationale: Traduz diretamente o substantivo, sem acrescentar “tratado”, ideia possível no contexto, mas não expressa pelo termo.
- source_word: συμμαχίας
  choice: aliança
  rationale: É o equivalente direto para uma aliança política ou militar e preserva a amplitude do termo grego.
- source_word: παρ' αὐτοῖς
  choice: entre eles
  rationale: Expressa a presença do documento junto à comunidade de Jerusalém, preservando o sentido relacional da frase.
- source_word: εἶναι
  choice: para que ... servisse
  rationale: O infinitivo exprime a finalidade de enviar a cópia. Em português, “para que ... servisse” comunica naturalmente sua função como memorial.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom documental do versículo e não explicita como “tratado” ou “aliança militar” aquilo que o grego deixa mais amplo.
