lexical_decisions:
- source_word: ἤρεσεν
  choice: agradou
  rationale: O aoristo de ἀρέσκω indica que a proposta foi recebida com aprovação; “agradou” é natural e fiel ao sentido.
- source_word: ὁ λόγος
  choice: a proposta
  rationale: No contexto diplomático, λόγος designa o assunto ou proposta apresentada, não apenas uma palavra ou declaração isolada.
- source_word: ἐνώπιον αὐτῶν
  choice: lhes
  rationale: Embora literalmente signifique “diante deles”, com ἀρέσκω a formulação idiomática em português é “lhes agradou”, preservando o sentido sem rigidez.
