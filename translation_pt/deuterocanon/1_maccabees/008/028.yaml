  yaml_path: translation/deuterocanon/1_maccabees/008/028.yaml
  text: And grain[a], weapons, or silver shall not be given to the allies, as it seemed good to Rome; and they shall keep these provisions[b], and not with deceit.
translation:
  language: pt
  text: E não se dará aos aliados cereal, armas nem prata, conforme pareceu bem a Roma[a]; eles observarão estas disposições[b], sem fraude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «pareceu bem a Roma» é uma fórmula diplomática e significa, na prática, «conforme Roma decidiu» ou «conforme Roma determinou».
    reason: cultural_note
  - marker: b
    text: Ou «estas obrigações» ou «estas cláusulas». A expressão grega significa literalmente «estas coisas que devem ser guardadas» no contexto de um tratado.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμάχοις
  choice: aos aliados
  rationale: O dativo plural designa as partes aliadas no contexto político-militar de um tratado; «aliados» é claro e natural.
- source_word: δοθήσεται
  choice: não se dará
  rationale: Preserva o futuro passivo de força impessoal e o tom prescritivo do tratado, sem introduzir um agente não expresso.
- source_word: σῖτος
  choice: cereal
  rationale: O termo designa cereal ou grão de modo geral, e não especificamente trigo; o singular coletivo acompanha de perto o grego.
- source_word: ὅπλα
  choice: armas
  rationale: No contexto militar, o plural se refere claramente a armas ou armamentos; «armas» é a opção mais transparente.
- source_word: ἀργύριον
  choice: prata
  rationale: Embora possa funcionar como dinheiro neste contexto, o grego diz literalmente «prata»; a tradução evita especificar além do texto.
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: conforme pareceu bem a Roma
  rationale: Mantém a fórmula diplomática grega e seu tom oficial; uma nota esclarece que ela expressa uma decisão de Roma.
- source_word: φυλάξονται
  choice: observarão
  rationale: Em contexto jurídico ou pactual, o verbo significa cumprir ou observar determinações, não meramente protegê-las.
- source_word: τὰ φυλάγματα ταῦτα
  choice: estas disposições
  rationale: «Disposições» é linguagem natural de tratado e comunica normas vinculantes, preservando em nota a amplitude da expressão grega.
- source_word: οὐ μετὰ δόλου
  choice: sem dolo
  rationale: Reproduz de maneira concisa a negação de fraude ou intenção enganosa e conserva o registro jurídico-formal.
