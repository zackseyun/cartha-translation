base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/001.yaml
  text: And Judas heard the name of the Romans[a], that they are mighty in strength, and that they are well disposed toward all who attach themselves to them, and that as many as come to them obtain friendship with them[b],
translation:
  language: pt
  text: 'Judas ouviu falar da reputação dos romanos[a]: eles eram muito poderosos, tratavam com boa vontade todos os que se associavam a eles e todos os que se aproximavam dos romanos obtinham a amizade deles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o nome dos romanos”; aqui, “nome” tem o sentido de renome ou reputação.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “amizade” pode incluir relações diplomáticas formais ou uma aliança, e não apenas afeição pessoal.
    reason: cultural_note
lexical_decisions:
- source_word: ἤκουσεν ... τὸ ὄνομα τῶν Ῥωμαίων
  choice: ouviu falar da reputação dos romanos
  rationale: A expressão grega diz literalmente «ouviu o nome dos romanos», mas ὄνομα aqui comunica renome ou reputação conhecida por relatos. A formulação escolhida transmite naturalmente esse sentido em português, preservando a expressão literal em nota.
- source_word: δυνατοὶ ἐν ἰσχύϊ
  choice: muito poderosos
  rationale: A combinação grega é enfática e algo redundante, literalmente «poderosos em força». «Muito poderosos» conserva a intensificação em português corrente e digno.
- source_word: εὐδοκοῦσιν ἐν πᾶσιν τοῖς προστεθειμένοις αὐτοῖς
  choice: tratavam com boa vontade todos os que se uniam a eles
  rationale: Neste contexto, εὐδοκέω indica disposição favorável, enquanto o particípio de προστίθημι descreve os que se associam ou se alinham aos romanos. A tradução evita especificar prematuramente uma aliança formal.
- source_word: ὅσοι ἐὰν προσέλθωσιν αὐτοῖς
  choice: todos os que os procuravam
  rationale: A construção indefinida abrange qualquer pessoa ou povo que se aproximasse dos romanos. «Os procuravam» é natural em português e mantém a ideia de recorrer ou dirigir-se a eles.
- source_word: ἐσπῶντο αὐτοῖς φιλίαν
  choice: estabeleciam amizade com
  rationale: O verbo expressa a obtenção ou formação de uma relação, e φιλία pode designar tanto amizade quanto relações diplomáticas ou aliança. «Estabeleciam amizade» mantém a amplitude lexical, esclarecida em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O período foi mantido como uma sequência coesa de informações recebidas por Judas; o imperfeito português apresenta o conteúdo geral desses relatos. As notas preservam o idioma literal de «nome» e a amplitude político-relacional de φιλία.
