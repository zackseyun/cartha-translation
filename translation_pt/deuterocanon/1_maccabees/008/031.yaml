base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/031.yaml
  text: And concerning the wrongs that King Demetrius is doing to them[a], we wrote to him, saying, “Why have you made your yoke heavy upon our friends and allies, the Jews?”
translation:
  language: pt
  text: 'E quanto aos males que o rei Demétrio lhes está causando[a], escrevemos a ele, dizendo: “Por que tornou pesado o seu jugo sobre os judeus, nossos amigos e aliados?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quanto aos danos” ou “quanto às injustiças que o rei Demétrio está cometendo contra eles”. A expressão grega pode indicar atos prejudiciais ou medidas opressivas, e não apenas o mal moral em sentido abstrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τῶν κακῶν
  choice: quanto aos males
  rationale: O plural substantivado κακά designa aqui males concretos, danos ou injustiças, não apenas o mal moral abstrato. “Males” preserva a amplitude do grego, com esclarecimento em nota.
- source_word: συντελεῖται εἰς αὐτούς
  choice: lhes está causando
  rationale: A expressão descreve medidas danosas em curso dirigidas contra os judeus. “Está causando” é natural em português e mantém o valor continuativo e hostil do contexto.
- source_word: ἐγράψαμεν αὐτῷ
  choice: escrevemos a ele
  rationale: O aoristo, em contexto narrativo, é adequadamente vertido pelo pretérito perfeito simples.
- source_word: Διὰ τί ἐβάρυνας τὸν ζυγόν σου
  choice: Por que tornou pesado o seu jugo
  rationale: Mantém tanto o verbo “tornar pesado” quanto a imagem concreta do jugo, metáfora da dominação opressiva.
- source_word: ἐπὶ τοὺς φίλους ἡμῶν τοὺς συμμάχους Ἰουδαίους
  choice: sobre os judeus, nossos amigos e aliados
  rationale: 'A formulação portuguesa explicita naturalmente a aposição: os judeus são identificados como amigos e aliados dos romanos.'
theological_decisions: []
