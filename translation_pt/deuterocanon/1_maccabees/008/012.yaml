base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/012.yaml
  text: But with their allies and with those who relied on them they maintained friendship[a], and they gained control over the kingdoms near and far[b]; and all who heard their name feared them.
translation:
  language: pt
  text: Mas conservaram a amizade com seus aliados[a] e com os que neles se apoiavam; dominaram os reinos próximos e distantes, e todos os que ouviam o nome deles[b] os temiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seus amigos»; o termo grego pode indicar amigos pessoais ou aliados políticos, e o contexto diplomático favorece «aliados».
    reason: lexical_alternative
  - marker: b
    text: A expressão «ouviam o nome deles» pode significar que ouviam falar de sua fama ou reputação.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Mas ... com
  rationale: δέ dá continuidade ao relato com leve contraste ou progressão; «Mas» preserva essa transição sem torná-la excessivamente forte.
- source_word: τῶν φίλων αὐτῶν
  choice: seus aliados
  rationale: φίλοι pode significar amigos pessoais ou parceiros políticos; o contexto diplomático e militar favorece «aliados».
- source_word: τῶν ἐπαναπαυομένων αὐτοῖς
  choice: os que neles se apoiavam
  rationale: O particípio de ἐπαναπαύομαι expressa confiança ou dependência depositada em alguém; «apoiavam-se neles» mantém a imagem e é natural em português.
- source_word: συνετήρησαν αὐτοῖς φιλίαν
  choice: conservaram a amizade com
  rationale: συντηρέω indica preservar ou manter, e φιλία designa aqui uma relação amistosa, provavelmente diplomática; a formulação é corrente e digna.
- source_word: κατεκράτησαν
  choice: dominaram
  rationale: κατακρατέω denota obter ou exercer domínio; «dominaram» é conciso e não pressupõe que tenham assumido formalmente a realeza.
- source_word: τῶν βασιλειῶν
  choice: os reinos
  rationale: O plural genitivo refere-se naturalmente aos reinos ou domínios, e não necessariamente aos reis individualmente.
- source_word: τῶν ἐγγὺς καὶ τῶν μακρῶν
  choice: próximos e distantes
  rationale: Preserva o contraste geográfico e a abrangência da expressão grega em português natural.
- source_word: ὅσοι ἤκουσαν τὸ ὄνομα αὐτῶν
  choice: todos os que ouviam o nome deles
  rationale: Mantém a expressão concreta do grego, na qual «nome» pode representar fama ou reputação.
- source_word: ἐφοβοῦντο αὐτούς
  choice: os temiam
  rationale: Traduz diretamente o temor provocado pelo poder romano, em registro conciso e solene.
