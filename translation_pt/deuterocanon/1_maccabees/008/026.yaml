base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/026.yaml
  text: To those who make war on them they shall neither give nor supply grain[a], weapons, silver, or ships, as Rome has decided; and they shall keep their obligations, taking nothing.
translation:
  language: pt
  text: Àqueles que lhes fizerem guerra, não darão nem fornecerão cereal, armas, prata ou navios, conforme Roma decidiu; e cumprirão suas obrigações[a], sem receber nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “observarão seus termos” ou “cumprirão as cláusulas do tratado”. O grego emprega palavras cognatas, literalmente algo como “guardarão as coisas que devem guardar”, no contexto de um tratado.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς πολεμοῦσιν
  choice: àqueles que lhes fizerem guerra
  rationale: O particípio substantivado designa os que promovem guerra; o pronome “lhes” explicita o alvo implícito no contexto do tratado sem reduzir a expressão a “atacantes”.
- source_word: οὐ δώσουσιν οὐδὲ ἐπαρκέσουσιν
  choice: não darão nem fornecerão
  rationale: Mantém os dois verbos futuros e distingue a entrega direta do fornecimento de auxílio.
- source_word: σῖτον
  choice: cereal
  rationale: σίτος se refere aqui a grãos ou provisões de grãos; “cereal” preserva essa precisão sem restringir o sentido a trigo.
- source_word: ὅπλα
  choice: armas
  rationale: Equivalente corrente e claro no contexto militar.
- source_word: ἀργύριον
  choice: prata
  rationale: Preserva a referência literal do grego e o ambiente econômico antigo, embora o termo também possa representar dinheiro.
- source_word: πλοῖα
  choice: navios
  rationale: É a designação natural no contexto militar e diplomático.
- source_word: ὡς ἔδοξεν Ῥώμῃ
  choice: conforme Roma decidiu
  rationale: A construção ἔδοξεν com dativo expressa uma decisão ou resolução oficial.
- source_word: φυλάξονται τὰ φυλάγματα αὐτῶν
  choice: cumprirão suas obrigações
  rationale: A expressão cognata, literalmente algo como “guardarão as coisas que devem guardar”, refere-se no contexto às estipulações assumidas no tratado.
- source_word: οὐθὲν λαβόντες
  choice: sem receber nada
  rationale: 'Expressa de modo natural a circunstância do particípio: o cumprimento ocorre sem que recebam coisa alguma.'
