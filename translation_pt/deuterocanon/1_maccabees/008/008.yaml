base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/008.yaml
  text: and the land of India and Media and Lydia[a], some of the finest of their lands—they took them from him and gave them to King Eumenes.
translation:
  language: pt
  text: e a região da Índia, a Média, a Lídia e algumas das melhores terras deles[a]; tomaram-nas dele e deram-nas ao rei Eumenes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos territórios mais excelentes deles”. O grego diz literalmente “das terras mais belas deles”, expressão que aqui indica regiões especialmente desejáveis ou valiosas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χώραν τὴν Ἰνδικὴν
  choice: a região da Índia
  rationale: χώρα pode indicar terra, região ou território; “região da Índia” conserva o sentido geográfico e soa natural em português.
- source_word: Μηδίαν καὶ Λυδίαν
  choice: a Média e a Lídia
  rationale: Empregam-se as formas geográficas tradicionais em português.
- source_word: ἀπὸ τῶν καλλίστων χωρῶν αὐτῶν
  choice: algumas das melhores terras deles
  rationale: A formulação torna explícita a força partitiva de ἀπό, enquanto “melhores” comunica o valor idiomático de καλλίστων neste contexto territorial. “Deles” preserva o pronome plural do grego sem fixar silenciosamente seu referente.
- source_word: λαβόντες αὐτὰς παρ' αὐτοῦ
  choice: Eles as tomaram dele
  rationale: O particípio aoristo é expresso como verbo finito para dar fluidez à sequência narrativa; os pronomes mantêm a distinção do grego entre o antecedente plural feminino e a pessoa de quem as terras foram tomadas.
- source_word: ἔδωκαν αὐτὰς Εὐμενεῖ τῷ βασιλεῖ
  choice: e as deram ao rei Eumenes
  rationale: Tradução direta e idiomática que conserva tanto a ação de dar como o título real de Eumenes.
