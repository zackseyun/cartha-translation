base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/004.yaml
  text: And they gained control of the whole region by their counsel and by the sword—though the region was very far away from them—and of the kings who came against them from the end of the earth[a], until they crushed them and struck them with a great blow[b]; and the rest give them tribute year by year.
translation:
  language: pt
  text: E dominaram toda a região por seu conselho e pela espada — embora a região ficasse muito longe deles — e os reis que vieram contra eles desde a extremidade da terra[a], até que os esmagaram e lhes infligiram um grande golpe; e os restantes[b] lhes pagam tributo ano após ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “desde a extremidade da terra”, expressão que indica uma distância muito grande.
    reason: lexical_alternative
  - marker: b
    text: “Os restantes” pode se referir aos governantes ou povos que restaram; eles continuam pagando tributo anualmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεκράτησαν
  choice: dominaram
  rationale: Exprime domínio efetivo e vigoroso no contexto político-militar, sem acrescentar a ideia específica de ocupação ou posse.
- source_word: τοῦ τόπου παντός
  choice: toda aquela região
  rationale: τόπος tem aqui sentido territorial; “região” é natural em português, e “aquela” ajuda a recuperar o referente contextual sem universalizar a expressão.
- source_word: τῇ βουλῇ αὐτῶν
  choice: por seu conselho
  rationale: Preserva o campo semântico de deliberação, plano e prudência política, em contraste retórico com a espada.
- source_word: τῇ ῥομφαίᾳ
  choice: pela espada
  rationale: Mantém a metonímia concreta do grego para o poder militar.
- source_word: μακρὰν ἀπέχων ἀπʼ αὐτῶν σφόδρα
  choice: ficasse muito longe deles
  rationale: Reproduz de modo corrente a grande distância enfatizada por σφόδρα.
- source_word: τῶν βασιλέων τῶν ἐπελθόντων ἐπʼ αὐτούς
  choice: bem como os reis que vieram contra eles
  rationale: Torna clara em português a continuação do objeto de κατεκράτησαν, preservando a formulação ampla do avanço hostil.
- source_word: ἀπʼ ἄκρου τῆς γῆς
  choice: desde a extremidade da terra
  rationale: Conserva a imagem singular do grego e sua ideia idiomática de distância extrema.
- source_word: συνέτριψαν
  choice: esmagarem
  rationale: Verbo militar forte que comunica derrota decisiva.
- source_word: ἐπάταξαν ἐν αὐτοῖς πληγὴν μεγάλην
  choice: lhes infligirem um grande golpe
  rationale: Mantém a metáfora de golpe e oferece uma construção idiomática e digna em português.
- source_word: οἱ ἐπίλοιποι
  choice: os restantes
  rationale: Preserva a ambiguidade do referente, que pode abranger os reis, povos ou adversários que restaram.
- source_word: ὀιδόασιν αὐτοῖς φόρον
  choice: lhes pagam tributo
  rationale: Expressão política corrente em português para a entrega de φόρος, mantendo o presente verbal do texto.
- source_word: κατʼ ἐνιαυτόν
  choice: ano após ano
  rationale: Expressa claramente a recorrência anual e conserva a força distributiva da locução grega.
