revisions:
- from: E dominaram toda aquela região por seu conselho e pela espada — embora a região ficasse muito longe deles —, bem como os reis que vieram contra eles desde a extremidade da terra[a], até os esmagarem e lhes infligirem um grande golpe; e os restantes lhes pagam tributo ano após ano.[b]
  to: E dominaram toda a região por seu conselho e pela espada — embora a região ficasse muito longe deles — e os reis que vieram contra eles desde a extremidade da terra[a], até que os esmagaram e lhes infligiram um grande golpe; e os restantes[b] lhes pagam tributo ano após ano.
  rationale: A revisão restaura a oração narrativa finita exigida pelo grego após «até», elimina a dêixis não assinalada em «aquela» e posiciona a nota b junto ao termo ambíguo que ela explica. Não altera o sentido nem resolve indevidamente a ambiguidade de οἱ ἐπίλοιποι.
