  source_fidelity: 'A construção grega exige uma oração finita depois de ἕως: «até que os esmagaram e lhes infligiram um grande golpe», não o infinitivo «até os esmagarem». O restante da tradução transmite adequadamente o domínio político-militar, a distância extrema, a derrota e o tributo anual. «Aquela» não é exigido por τόπος e introduz uma dêixis desnecessária.'
  naturalness: O texto é claro e de registro apropriado. A coordenação direta de «toda a região ... e os reis» é mais natural e transparente do que «bem como os reis» neste período extenso. A nota b deve ficar ancorada em «os restantes», termo que ela esclarece.
  terminology: «Dominaram», «conselho», «espada», «extremidade da terra», «tributo» e «ano após ano» são escolhas adequadas, modernas e fiéis. «Os restantes» preserva corretamente a indeterminação do referente.
  issues:
  - severity: medium
    issue: «até os esmagarem e lhes infligirem» usa infinitivo onde o grego traz verbos finitos aoristos após ἕως.
    rationale: A formulação pode sugerir finalidade ou uma ação apenas prevista, enquanto o texto afirma que eles de fato esmagaram e infligiram o golpe. «Até que os esmagaram e lhes infligiram» preserva a afirmação narrativa.
  - severity: low
    issue: «aquela região» acrescenta uma nuance dêitica ausente do grego.
    rationale: τόπος παντός significa «toda a região/território»; retirar «aquela» evita especificação não marcada pela fonte.
  - severity: low
    issue: O marcador b está depois do ponto final, embora a nota explique especificamente «os restantes».
    rationale: Ancorá-lo imediatamente após a expressão esclarecida torna a referência da nota precisa.
