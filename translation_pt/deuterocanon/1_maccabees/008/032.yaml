lexical_decisions:
- source_word: ἐὰν οὖν ἔτι
  choice: Se, portanto, ... ainda
  rationale: Preserva tanto a condição introduzida por ἐὰν como o valor inferencial de οὖν e a ideia de continuação expressa por ἔτι.
- source_word: ἐντύχωσιν κατὰ σοῦ
  choice: apresentarem queixa contra você
  rationale: No contexto diplomático e com κατὰ σοῦ, o verbo indica uma petição ou queixa adversa, não necessariamente um ataque físico.
- source_word: ποιήσομεν αὐτοῖς τὴν κρίσιν
  choice: executaremos contra eles o juízo
  rationale: Mantém a linguagem judicial da expressão grega e a orientação adversativa contra os que apresentam a queixa, sem reduzir κρίσις a mera decisão administrativa.
- source_word: πολεμήσομέν σε
  choice: combateremos você
  rationale: Reproduz a leitura atestada no texto grego, no qual σε é objeto singular de segunda pessoa, apesar da dificuldade contextual.
- source_word: διὰ τῆς θαλάσσης καὶ διὰ τῆς ξηρᾶς
  choice: por mar e por terra
  rationale: É a formulação portuguesa natural para os dois âmbitos da ação militar.
theological_decisions:
- issue: Mudança aparentemente incoerente do objeto na oração final
  choice: Manter “combateremos você” no texto principal.
  alternative: “combateremos por você” ou “combateremos contra eles”
  rationale: O grego transmitido traz πολεμήσομέν σε, literalmente “combateremos você”. Como o contexto parece prometer apoio ao destinatário, a redação é difícil; a tradução não corrige silenciosamente o texto, mas registra as leituras contextuais na nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe diplomático-jurídica. A formulação deliberadamente inesperada da última oração preserva o testemunho grego e é esclarecida por nota.
