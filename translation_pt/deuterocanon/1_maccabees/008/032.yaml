  text: If they still bring charges against you[a], we will execute judgment on them, and we will fight against them by sea and by land.
translation:
  language: pt
  text: Se, pois, eles ainda apresentarem uma queixa contra você, faremos justiça contra eles e combateremos você[a] por mar e por terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “combateremos você”. No contexto, talvez se esperasse “combateremos por você” ou “combateremos contra eles”; a redação transmitida pode refletir uma dificuldade textual.
