  text: and to remove their yoke[a], because they saw that the kingdom of the Greeks was enslaving Israel.
translation:
  language: pt
  text: e para retirar o jugo deles, pois viram que o reino dos gregos estava reduzindo Israel à escravidão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é enfático e reúne palavras da mesma esfera: literalmente, algo como “escravizando Israel à escravidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἆραι
  choice: retirar
  rationale: No idioma formado com ζυγός, o infinitivo de αἴρω indica tirar ou remover um jugo, não apenas erguê-lo fisicamente.
- source_word: ζυγὸν αὐτῶν
  choice: o jugo deles
  rationale: Preserva a metáfora política de dominação e também a referência pronominal concisa do grego, sem explicitar além do texto a quem se refere αὐτῶν.
- source_word: βασιλείαν τῶν Ἑλλήνων
  choice: o reino dos gregos
  rationale: É o equivalente formal mais direto e conserva a designação étnico-política do original.
- source_word: καταδουλουμένους ... δουλίαν
  choice: estava reduzindo Israel à escravidão
  rationale: Expressa em português natural o processo de sujeitar completamente à escravidão e representa a construção enfática do grego, que reúne o verbo 'escravizar' e o substantivo 'escravidão'.
theological_decisions:
- issue: Linguagem enfática de escravidão em contexto de dominação política
  choice: estava reduzindo Israel à escravidão
  alternative: estava subjugando Israel
  rationale: A opção escolhida mantém explícita a escravidão indicada tanto pelo verbo καταδουλόω como pelo substantivo δουλία, sem suavizá-la para uma ideia genérica de opressão.
- issue: Referente de αὐτῶν em 'o jugo deles'
  choice: manter a referência pronominal ambígua
  alternative: o jugo dos gregos
  rationale: Embora o contexto favoreça a identificação com o poder grego, o pronome do texto não nomeia novamente seu referente; a tradução evita resolver silenciosamente essa referência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural para a repetição enfática do grego. A abertura em minúscula conserva o caráter continuativo do fragmento em relação ao versículo anterior.
