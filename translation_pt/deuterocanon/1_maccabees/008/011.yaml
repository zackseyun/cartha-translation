base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/008/011.yaml
  text: And they enslaved them to this day[a]. And the remaining kingdoms and the islands, as many as ever resisted them[b], they destroyed and enslaved to them.
translation:
  language: pt
  text: E eles os escravizaram até o dia de hoje.[a] Quanto aos demais reinos e às ilhas — todos quantos alguma vez lhes resistiram —, eles os devastaram[b] e os escravizaram para si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até este dia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “destruíram” ou “arruinaram”; o verbo grego pode indicar devastação severa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδουλώσαντο
  choice: escravizaram
  rationale: Preserva a força de καταδουλόω, que indica reduzir à escravidão ou à sujeição completa, sem suavizá-la para simples domínio político.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: até o dia de hoje
  rationale: Expressão portuguesa natural que comunica a continuidade da condição até o presente do narrador.
- source_word: τὰς ἐπιλοίπους βασιλείας
  choice: os demais reinos
  rationale: Traduz ἐπίλοιπος como aquilo que resta ou ainda não foi mencionado, mantendo o estilo enumerativo.
- source_word: τὰς νήσους
  choice: as ilhas
  rationale: Correspondência direta e suficiente para νήσους, sem ampliar para territórios insulares.
- source_word: ὅσοι ποτὲ ἀντέστησαν αὐτοῖς
  choice: todos quantos alguma vez lhes resistiram
  rationale: Mantém o alcance abrangente de ὅσοι, a indefinição enfática de ποτέ e o sentido de oposição de ἀντέστησαν.
- source_word: κατέφθειραν
  choice: devastaram
  rationale: Expressa destruição severa sem exigir aniquilação total, harmonizando-se naturalmente com a escravização que vem em seguida.
- source_word: ἐδούλωσαν αὐτοῖς
  choice: os escravizaram para si
  rationale: Representa tanto o ato de escravizar quanto o dativo αὐτοῖς, indicando que os vencidos foram reduzidos à escravidão em benefício e sob o domínio dos romanos.
theological_decisions:
- issue: Linguagem de escravidão em contexto político-militar
  choice: escravizaram
  alternative: subjugaram
  rationale: A família lexical de δουλόω apresenta aqui uma dominação extrema expressa como escravização; o termo mais forte evita suavizar a violência descrita.
- issue: Grau de destruição expresso por κατέφθειραν
  choice: devastaram
  alternative: destruíram
  rationale: “Devastaram” preserva a severidade do verbo e permite a tensão do texto com a subsequente escravização, sem determinar que houve aniquilação total.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção enfática marcada por travessões para conservar a abrangência da oração grega. Os pronomes mantêm os referentes do contexto sem inserir explicações ausentes do original.
