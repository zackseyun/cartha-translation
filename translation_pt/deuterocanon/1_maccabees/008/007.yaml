  text: and they took him alive[a], and imposed on them that both he and those reigning after him should pay a great tribute, and give hostages and a cession of territory[b],
translation:
  language: pt
  text: e o capturaram vivo[a], e lhes impuseram que tanto ele como os que reinassem depois dele pagassem um grande tributo, entregassem reféns e cedessem território[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o tomaram vivo».'
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por «cedessem território» (διαστολήν) é difícil e pode indicar uma divisão territorial, uma demarcação ou uma concessão de terras como parte do acordo imposto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον αὐτὸν ζῶντα
  choice: o capturaram vivo
  rationale: Expressa claramente que ele foi feito prisioneiro sem ser morto; «capturaram» é natural em português no contexto militar.
- source_word: ἔστησαν αὐτοῖς διδόναι
  choice: lhes impuseram que ... pagassem / entregassem / cedessem
  rationale: A construção estabelece uma obrigação política. «Impuseram» preserva seu caráter coercivo e jurídico, enquanto os verbos coordenados tornam a enumeração natural em português.
- source_word: φόρον μέγαν
  choice: um grande tributo
  rationale: «Tributo» é historicamente mais preciso que «imposto» para o pagamento exigido de um soberano ou povo submetido; «grande» corresponde diretamente a μέγαν.
- source_word: ὅμηρα
  choice: reféns
  rationale: Designa pessoas entregues como garantia de cumprimento de um acordo político.
- source_word: διαστολήν
  choice: cedessem território
  rationale: No contexto do acordo imposto, provavelmente indica uma cessão ou delimitação territorial. A nota mantém visível a dificuldade lexical do termo.
- source_word: τοὺς βασιλεύοντας μετʼ αὐτόν
  choice: os que reinassem depois dele
  rationale: Preserva a referência aos governantes que lhe sucederiam sem substituir a expressão pelo substantivo interpretativo «sucessores».
