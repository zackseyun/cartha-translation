  yaml_path: translation/deuterocanon/1_maccabees/008/019.yaml
  text: And they went to Rome—the journey was very long indeed—and entered the council chamber and answered[b][a],
translation:
  language: pt
  text: 'E foram a Roma — a viagem foi extremamente longa[a] — e entraram na sala do conselho[b] e responderam:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o caminho era extremamente longo». Em sentido literal, o grego fala do caminho ou da estrada; no contexto, refere-se à extensão da viagem.
    reason: lexical_alternative
  - marker: b
    text: Ou «a sede do Senado». O grego designa o lugar onde o conselho se reunia; «sala do conselho» traduz o termo sem especificar além do que ele próprio expressa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: foram
  rationale: O aoristo de πορεύομαι narra aqui um deslocamento; «foram» é natural, claro e fiel ao contexto.
- source_word: εἰς Ῥώμην
  choice: a Roma
  rationale: Com verbo de movimento, εἰς seguido de topônimo indica destino; em português, «a Roma» expressa isso de modo idiomático.
- source_word: ἡ ὁδὸς πολλὴ σφόδρα
  choice: a viagem foi muito longa
  rationale: Embora ὁδός signifique literalmente «caminho» ou «estrada», no contexto a expressão descreve a extensão da viagem. «Muito longa» conserva a forte ênfase de πολλὴ σφόδρα sem soar artificial.
- source_word: εἰσῆλθον
  choice: entraram
  rationale: Tradução direta e natural do aoristo de εἰσέρχομαι.
- source_word: τὸ βουλευτήριον
  choice: a sala do conselho
  rationale: βουλευτήριον designa o lugar onde um conselho se reúne. A formulação é transparente e evita identificar explicitamente o órgão como Senado, algo plausível no contexto romano, mas não expresso no termo por si só.
- source_word: ἀπεκρίθησαν
  choice: responderam
  rationale: O verbo significa normalmente «responder». O uso dos dois-pontos permite que a resposta seja apresentada no versículo seguinte, preservando a sequência narrativa grega.
