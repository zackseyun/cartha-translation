  yaml_path: translation/deuterocanon/1_maccabees/016/008.yaml
  text: And they sounded the trumpets[a], and Cendebeus and his camp were thrown into confusion, and many of them fell wounded[b]; but those who were left fled into the stronghold.
translation:
  language: pt
  text: E tocaram as trombetas, e Cendebeu e seu acampamento foram desbaratados[a]; muitos deles caíram feridos[b], mas os que restaram fugiram para a fortaleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «foram postos em fuga» ou «foram lançados em confusão». O verbo grego, em contexto militar, pode indicar derrota e dispersão; a frase seguinte relata explicitamente a fuga dos que restaram.
    reason: lexical_alternative
  - marker: b
    text: «Caíram feridos» segue de perto o grego e não significa necessariamente que todos morreram; pode referir-se a homens derrubados em combate e feridos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισαν ταῖς σάλπιγξιν
  choice: tocaram as trombetas
  rationale: Expressão portuguesa natural para o ato de dar um sinal militar com trombetas, mantendo a imagem concreta do grego.
- source_word: ἐτροπώθη
  choice: foram postos em fuga
  rationale: Em contexto militar, o passivo de τρέπω indica que uma força foi desbaratada ou obrigada a fugir. A formulação comunica claramente a derrota sem acrescentar que todos morreram.
- source_word: παρεμβολὴ
  choice: exército
  rationale: παρεμβολή pode designar tanto um acampamento quanto a força militar nele reunida. Como o referente sofre baixas e foge, 'exército' expressa naturalmente o sentido contextual em português.
- source_word: ἔπεσον ... τραυματίαι πολλοί
  choice: Muitos deles caíram feridos
  rationale: Segue de perto a construção grega e evita afirmar que todos os que caíram morreram; τραυματίαι identifica pessoas feridas em combate.
- source_word: οἱ ... καταλειφθέντες
  choice: os restantes
  rationale: Forma concisa e fiel para os que ficaram ou permaneceram depois das baixas, sem explicitar além do texto se todos eram sobreviventes ilesos.
- source_word: ὀχύρωμα
  choice: fortaleza
  rationale: Equivalente corrente e digno para um lugar fortificado ou reduto defensivo.
