- source_word: ἑτέρους
  choice: outros
  rationale: Plural indefinido que designa agentes adicionais, distintos dos mencionados anteriormente; “outros” é conciso e natural.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Verbo narrativo comum para mandar pessoas cumprir uma missão.
- source_word: καταλαβέσθαι
  choice: tomar
  rationale: Neste contexto político-militar, indica apoderar-se ou assumir o controle; “tomar” transmite a ação hostil sem especificar indevidamente o método.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma tradicional e corrente do nome da cidade em português.
- source_word: τὸ ὄρος τοῦ ἱεροῦ
  choice: o monte do templo
  rationale: Preserva a imagem espacial de ὄρος e expressa ἱερόν de modo claro e natural; a nota registra a forma mais literal.
