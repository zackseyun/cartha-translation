  text: And the son of Abubus welcomed them into the stronghold called Dok with deceit[a], which he had built, and he gave them a great banquet; and he had men hidden there.
translation:
  language: pt
  text: E o filho de Abubo os recebeu com engano na fortaleza chamada Doc, que ele havia construído, e lhes ofereceu um grande banquete[a]; ali escondeu homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «preparou para eles uma grande festa regada a bebida». A expressão grega destaca literalmente a bebida, embora, no contexto, possa indicar um banquete farto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδέξατο
  choice: recebeu
  rationale: Expressa naturalmente o ato de acolher hóspedes; o complemento «com dolo» evidencia que a hospitalidade era fingida.
- source_word: ὁ τοῦ Ἀβουβον
  choice: o filho de Abubo
  rationale: A expressão grega elíptica funciona como patronímico. Preserva-se a identificação pela filiação, sem inserir o nome próprio conhecido pelo contexto.
- source_word: εἰς τὸ ὀχύρωματιν
  choice: na fortaleza
  rationale: Apesar da forma textual incomum, o substantivo designa claramente um lugar fortificado. «Fortaleza» é corrente e adequado ao contexto.
- source_word: τὸ καλούμενον Δὼκ
  choice: chamada Doc
  rationale: Reproduz diretamente a fórmula de nomeação; «Doc» translitera o topônimo grego de modo natural em português.
- source_word: μετὰ δόλου
  choice: com dolo
  rationale: Mantém o substantivo e o caráter deliberadamente enganoso da recepção. «Dolo» é conciso, digno e inteligível em português.
- source_word: ὃ ᾠκοδόμησεν
  choice: que ele havia construído
  rationale: O mais-que-perfeito composto deixa claro que a construção da fortaleza antecedeu a recepção.
- source_word: ἐποίησεν αὐτοῖς πότον μέγαν
  choice: lhes ofereceu um grande banquete
  rationale: A expressão destaca literalmente a bebida, mas descreve uma grande ocasião de hospitalidade. «Banquete» comunica naturalmente a cena, enquanto a nota preserva a nuance lexical.
- source_word: ἐνέκρυψεν ἐκεῖ ἄνδρας
  choice: ali, porém, havia escondido alguns homens
  rationale: Expressa a preparação prévia da emboscada. «Porém» torna explícito o contraste já evidente entre o banquete e os homens ocultos, sem alterar o conteúdo; «alguns» é exigido pelo português natural diante do substantivo plural indefinido.
