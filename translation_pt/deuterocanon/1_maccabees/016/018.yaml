  text: And Ptolemy wrote these things and sent word to the king that he should send him forces as help, and hand over their country and the cities.
translation:
  language: pt
  text: Ptolomeu escreveu essas coisas e mandou uma mensagem ao rei, pedindo que lhe enviasse tropas como auxílio e lhe entregasse o território deles e as cidades.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυνάμεις
  choice: tropas
  rationale: No contexto militar, o plural designa forças armadas; “tropas” é claro e natural em português.
- source_word: εἰς βοήθειαν
  choice: como auxílio
  rationale: Conserva a ideia de tropas enviadas para prestar ajuda sem ampliar o sentido.
- source_word: παραδῷ
  choice: lhe entregasse
  rationale: Expressa a transferência solicitada e explicita o beneficiário já indicado pelo contexto.
- source_word: χώραν
  choice: território
  rationale: Neste contexto político, refere-se à região sob domínio, sendo “território” mais preciso que “terra”.
