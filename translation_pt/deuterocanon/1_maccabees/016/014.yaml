base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/014.yaml
  text: Simon was making a circuit of the cities in the country and taking care of their administration[a], and he went down to Jericho, he and Mattathias and Judas his sons, in the one hundred seventy-seventh year, in the eleventh month—that is, the month Shebat.
translation:
  language: pt
  text: Simão percorria as cidades da região e cuidava da administração delas. Ele desceu a Jericó com seus filhos Matatias e Judas, no ano cento e setenta e sete, no décimo primeiro mês, isto é, o mês de Sebate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “Sabat”, forma do nome do mês conhecido em português como “Sebate”.
    reason: Esclarece que “Sebate” traduz por meio de uma forma portuguesa convencional a transliteração grega Σαβάτ.
lexical_decisions:
- source_word: ἐφοδεύων
  choice: percorria
  rationale: Expressa o deslocamento de Simão pelas diversas cidades, possivelmente em circuito, sem tornar a formulação pesada em português.
- source_word: τὰς πόλεις τὰς ἐν τῇ χώρᾳ
  choice: as cidades da região
  rationale: χώρα pode designar terra, país ou região; “região” é natural no contexto territorial e evita sugerir o conceito moderno de Estado-nação.
- source_word: φροντίζω τὰς ἐπιμελίας αὐτῶν
  choice: cuidava da administração delas
  rationale: A construção grega é incomum, mas combina a ideia de cuidado com a de supervisão ou gestão dos assuntos das cidades; a tradução preserva esse sentido administrativo.
- source_word: κατέβη εἰς Ἰεριχώ
  choice: desceu a Jericó
  rationale: Mantém a indicação direcional de καταβαίνω e segue o uso bíblico natural em português.
- source_word: αὐτὸς καὶ Ματταθίας καὶ Ἰούδας καὶ οἱ υἱοὶ αὐτοῦ
  choice: Ele desceu a Jericó com seus filhos Matatias e Judas
  rationale: Apresenta com clareza em português a relação apositiva pela qual Matatias e Judas são identificados como filhos de Simão.
- source_word: ἔτους ἑβδόμου καὶ ἑβδομηκοστοῦ καὶ ἑκατοστοῦ
  choice: no ano cento e setenta e sete
  rationale: Reproduz de modo corrente a numeração do ano da era selêucida, sem acrescentar uma explicação ausente do versículo.
- source_word: μηνὶ ἐνδεκάτῳ
  choice: no décimo primeiro mês
  rationale: Tradução direta e idiomática da expressão ordinal grega.
- source_word: Σαβάτ
  choice: Sebate
  rationale: Forma portuguesa tradicional e inteligível do nome semítico do mês representado no grego como Σαβάτ.
