  text: And the rest of the accounts concerning John, and his wars, and his mighty deeds that he did, and the building of the walls that he built, and his acts—
translation:
  language: pt
  text: E o restante dos relatos sobre João, suas guerras, os atos de bravura que realizou, a construção das muralhas que ergueu e seus feitos—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ λοιπὰ τῶν λόγων
  choice: o restante dos relatos
  rationale: A expressão funciona como fórmula historiográfica que remete ao que não foi narrado aqui; “relatos” comunica o sentido contextual de λόγων, e não apenas “palavras”.
- source_word: πολέμων
  choice: guerras
  rationale: Preserva o alcance amplo dos conflitos militares de João, sem reduzi-los a batalhas específicas.
- source_word: ἀνδραγαθιῶν ... ἠνδραγάθησεν
  choice: atos de bravura que realizou
  rationale: Transmite o caráter valoroso das ações e evita em português a repetição pesada de substantivo e verbo cognatos do grego.
- source_word: οἰκοδομῆς τῶν τειχέων ὧν ᾠκοδόμησεν
  choice: a construção das muralhas que ergueu
  rationale: “Muralhas” explicita naturalmente o caráter defensivo de τείχη; “ergueu” mantém a repetição sem soar artificial.
- source_word: πράξεων
  choice: feitos
  rationale: Termo geral e digno para as ações de João, adequado à fórmula conclusiva e distinto de “atos de bravura”.
