  yaml_path: translation/deuterocanon/1_maccabees/016/001.yaml
  text: And John came up from Gazara and reported to Simon his father what Cendebeus was doing[a].
translation:
  language: pt
  text: João subiu de Gazara e contou a seu pai, Simão, o que Cendebeu estava fazendo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «estava executando» ou «estava levando a cabo». O verbo grego pode indicar uma ação em andamento ou a execução de um plano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: subiu
  rationale: Preserva de modo natural o sentido direcional de ἀναβαίνω, sem impor em português a distinção contextual entre «foi» e «veio».
- source_word: Γαζάρων
  choice: Gazara
  rationale: Segue a forma helenizada do topônimo no testemunho grego, em forma singular natural em português.
- source_word: ἀπήγγειλεν
  choice: contou
  rationale: Expressa com naturalidade o ato de transmitir a Simão uma informação; «relatou» também seria possível, mas soaria mais formal.
- source_word: συνετέλει
  choice: estava fazendo
  rationale: O imperfeito indica atividade em curso; a formulação conserva a amplitude do verbo, que também pode sugerir executar ou levar adiante um plano.
- source_word: Κενδεβαῖος
  choice: Cendebeu
  rationale: Adota a forma portuguesa tradicional e reconhecível do nome grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A aposição «seu pai, Simão» evita a sequência menos natural «a Simão, seu pai» e reproduz sem ambiguidade a relação indicada pelo grego.
