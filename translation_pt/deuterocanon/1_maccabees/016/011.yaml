  yaml_path: translation/deuterocanon/1_maccabees/016/011.yaml
  text: And Ptolemy son of Abubus had been appointed governor over the plain of Jericho[a], and he had much silver and gold;
translation:
  language: pt
  text: E Ptolomeu, filho de Abubo, havia sido nomeado governador da planície de Jericó[a] e tinha muita prata e ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido como «governador» também pode significar «general» ou «governador militar». Aqui, «governador» indica sua autoridade sobre um território, não apenas o comando em batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: e
  rationale: Conjunção narrativa simples; em português, a ligação entre as duas orações é preservada sem forçar um início com «E».
- source_word: Πτολεμαῖος
  choice: Ptolomeu
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego.
- source_word: ὁ τοῦ Ἀβούβου
  choice: filho de Abubo
  rationale: O genitivo funciona como patronímico; explicitar «filho de» comunica naturalmente a relação em português.
- source_word: ἦν καθεστημένος
  choice: tinha sido nomeado
  rationale: A construção perifrástica exprime um estado resultante de uma nomeação anterior; o mais-que-perfeito composto preserva esse valor.
- source_word: στρατηγὸς
  choice: governador
  rationale: No contexto de autoridade sobre um território, «governador» comunica melhor a função administrativa, embora o termo grego também possa designar um general ou governador militar.
- source_word: εἰς τὸ πεδίον Ἰεριχώ
  choice: da planície de Jericó
  rationale: A expressão delimita a jurisdição ligada ao cargo; «planície» preserva o sentido concreto de πεδίον.
- source_word: ἀργύριον καὶ χρυσίον πολύ
  choice: muita prata e ouro
  rationale: Formulação direta, natural e próxima da declaração grega de grande riqueza.
