  text: And he ran on ahead and reported to John in Gazara that his father and his brothers had perished[a], and that he had sent men to kill you also.
translation:
  language: pt
  text: Ele correu adiante e comunicou a João, em Gazara, que seu pai e seus irmãos tinham morrido e que ele havia enviado homens para matar você também.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e que também enviou para matar você”. O grego não declara quem foi enviado; “homens” foi acrescentado no texto para dar clareza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν
  choice: correu na frente
  rationale: O particípio indica que ele se adiantou correndo; a expressão preserva tanto o movimento quanto a urgência.
- source_word: ἀπήγγειλεν
  choice: comunicou
  rationale: O verbo descreve a transmissão de uma notícia ou mensagem. “Comunicou” é natural e suficientemente digno neste contexto.
- source_word: εἰς Γάζαρα
  choice: em Gazara
  rationale: Ligado ao destinatário da mensagem, o sintagma é vertido de modo idiomático como o local onde João se encontrava.
- source_word: ἀπώλετο
  choice: tinham morrido
  rationale: Neste contexto, o verbo se refere à morte violenta já ocorrida. “Tinham morrido” comunica o fato sem acrescentar ao verbo um modo específico de execução.
- source_word: Ἀπέσταλκεν
  choice: havia enviado homens
  rationale: O perfeito indica uma ação já realizada com efeito presente. O objeto de “enviado” não está expresso no grego; “homens” é suprido para que a frase seja natural em português e é explicitado em nota.
- source_word: καὶ σὲ ἀποκτεῖναι
  choice: para matar você
  rationale: 'A tradução mantém a segunda pessoa do grego e expressa o valor inclusivo de καί por meio de “também” antes do verbo principal: João igualmente era alvo da ação.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A segunda pessoa “você” preserva a referência direta a João presente no grego. O pronome “ele” permanece sem identificação explícita, como no texto-fonte.
