  verdict: revise
  source_fidelity: A tradução transmite corretamente a sequência narrativa, o local, as mortes do pai e dos irmãos e a ameaça dirigida a João. Contudo, a posição de “também” em “ele também havia enviado homens” pode sugerir que o sujeito realizou uma ação adicional de enviar homens, em vez de indicar que João também era alvo da morte. O grego καὶ σέ enfatiza “você também”.
  naturalness: “Correu adiante” é uma formulação um pouco mais natural e direta para προδραμών. A frase revista mantém registro moderno, claro e digno, com boa legibilidade em português internacional.
  terminology: “Gazara”, “João”, “matar” e “homens” são adequados. “Homens” continua sendo um suprimento esclarecedor legítimo, desde que a nota explique que o objeto de “enviou” está implícito no grego.
  issues:
  - severity: medium
    issue: Posição ambígua de “também”
    rationale: Em “ele também havia enviado homens para matar você”, “também” pode modificar “havia enviado”, enquanto o grego καὶ σέ (“você também”) associa João aos alvos da ação de matar. Deve-se deslocar “também” para junto de “você”.
  - severity: low
    issue: Nota de rodapé imprecisa na paráfrase literal
    rationale: “Havia enviado você para ser morto” pode dar a entender que João foi a pessoa enviada. O grego deixa sem expressão quem foi enviado, não identifica João como objeto de ἀπέσταλκεν.
