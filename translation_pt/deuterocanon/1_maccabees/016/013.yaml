revisions:
- from: E o coração dele se exaltou[a]; ele resolveu apoderar-se do país e tramava com dolo contra Simão e seus filhos, a fim de eliminá-los[b].
  to: E ele se encheu de orgulho[a]; pretendeu apoderar-se do país e tramava, por meio de engano, contra Simão e seus filhos, para removê-los[b].
  rationale: A revisão substitui o juridiquês potencialmente equívoco de «dolo» por uma expressão corrente para o ardil indicado por δόλῳ. Também troca «eliminá-los» por «removê-los», conservando no texto a menor especificidade de αἴρω e deixando a inferência de violência para a nota. A interpretação idiomática de ὑψώθη ἡ καρδία αὐτοῦ é apresentada de forma natural, com a imagem literal preservada em nota.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:29:02Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a sequência e os sentidos principais do grego. Contudo, «eliminá-los» no texto principal torna mais explícita uma implicação contextual que αἴρω deixa formulada como «remover/tirar». Convém preservar essa margem no texto e explicar a provável eliminação violenta na nota.
  naturalness: «Com dolo» é pouco natural neste contexto e, no uso jurídico moderno, pode sugerir especificamente intenção consciente, não o engano/ardil expresso por δόλῳ. «Por meio de engano» é claro e idiomático. «Ele se encheu de orgulho» comunica naturalmente o valor idiomático de «seu coração foi elevado».
  terminology: «Simão», «país» e «apoderar-se» são adequados. «Removê-los» mantém a formulação menos determinada de αἴρω; a nota registra a provável conotação de eliminação violenta sem a impor ao texto.
  issues:
  - severity: medium
    issue: «Com dolo» para δόλῳ
    rationale: Em português contemporâneo, «dolo» tem forte valor técnico-jurídico de intenção, enquanto δόλῳ aqui designa ardil, engano ou traição como meio da conspiração.
  - severity: medium
    issue: «Eliminá-los» para ἆραι αὐτούς no texto principal
    rationale: Embora a eliminação violenta seja provável no contexto, αἴρω significa literalmente tirar/remover. «Removê-los» preserva a formulação e a ambiguidade do grego; a nota pode indicar a implicação contextual.
  revised_text: E ele se encheu de orgulho[a]; pretendeu apoderar-se do país e tramava, por meio de engano, contra Simão e seus filhos, para removê-los[b].
