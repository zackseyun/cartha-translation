lexical_decisions:
- source_word: ὑψώθη ἡ καρδία αὐτοῦ
  choice: o coração dele se exaltou
  rationale: Preserva a metáfora do grego e sua conotação de orgulho ou exaltação própria, em linguagem portuguesa compreensível.
- source_word: ἐβουλήθη
  choice: resolveu
  rationale: Expressa uma intenção deliberada e já formada, com mais força que «quis», sem necessariamente afirmar que o plano foi executado.
- source_word: κατακρατῆσαι τῆς χώρας
  choice: apoderar-se do país
  rationale: Comunica a ideia de obter domínio político sobre o território; «país» corresponde bem ao sentido territorial-político de χώρα no contexto.
- source_word: ἐβούλευετο
  choice: tramava
  rationale: O aspecto deliberativo, unido a δόλῳ e aos alvos hostis, indica uma conspiração em andamento.
- source_word: δόλῳ
  choice: com dolo
  rationale: Mantém a ideia de engano intencional e traiçoeiro como meio ou modo da trama, em formulação digna e concisa.
- source_word: ἆραι αὐτούς
  choice: eliminá-los
  rationale: No contexto hostil, o verbo sugere livrar-se deles, provavelmente de modo violento; a nota registra a formulação mais literal e preserva a margem semântica.
- source_word: χώρα
  choice: país
  rationale: No contexto de tomada do poder, designa o território como unidade política, e não apenas a terra física.
