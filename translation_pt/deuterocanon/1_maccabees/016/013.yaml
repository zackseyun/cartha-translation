  text: And his heart was lifted up[a], and he intended to seize control of the country, and he was plotting deceitfully against Simon and against his sons[b], to remove them.
translation:
  language: pt
  text: E ele se encheu de orgulho[a]; pretendeu apoderar-se do país e tramava, por meio de engano, contra Simão e seus filhos, para removê-los[b].
  philosophy: optimal-equivalence
  footnotes:
