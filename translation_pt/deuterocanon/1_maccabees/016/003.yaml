base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/003.yaml
  text: But now I have grown old[a], and you also, by mercy, are mature in years. Become my replacements, and my brother’s, and go out and fight on behalf of our nation[c][b], and may the help from heaven be with you.
translation:
  language: pt
  text: Agora, porém, envelheci, e vocês, pela misericórdia[a], já têm idade suficiente. Assumam o meu lugar e o de meu irmão[b], saiam e lutem em defesa de nossa nação; e que a ajuda vinda do céu[c] esteja com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por misericórdia”. O grego não declara explicitamente de quem é a misericórdia, embora o contexto sugira naturalmente a misericórdia divina.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Tornem-se em lugar de mim e de meu irmão”; a expressão grega indica substituição.
    reason: alternative_reading
  - marker: c
    text: “Ajuda vinda do céu” é uma forma reverente de falar do auxílio divino sem mencionar Deus diretamente.
    reason: cultural_note
lexical_decisions:
- source_word: γεγήρακα
  choice: envelheci
  rationale: O perfeito grego expressa o estado presente resultante do envelhecimento. “Envelheci” comunica com naturalidade tanto o processo quanto a condição atual.
- source_word: ἐν τῷ ἐλέει
  choice: pela misericórdia
  rationale: A expressão significa literalmente “na misericórdia”. Como o grego não declara de quem é a misericórdia, a tradução não acrescenta “de Deus”, embora essa referência seja naturalmente sugerida pelo contexto.
- source_word: ἱκανοί ἐστε ἐν τοῖς ἔτεσιν
  choice: já têm idade suficiente
  rationale: ἱκανοί indica suficiência ou aptidão; em combinação com “nos anos”, descreve quem alcançou idade adequada para assumir a responsabilidade. A formulação é clara e não sugere indevidamente velhice.
- source_word: γίνεσθε ἀντʼ ἐμοῦ καὶ τοῦ ἀδελφοῦ μου
  choice: Assumam o meu lugar e o de meu irmão
  rationale: ἀντί com o genitivo expressa substituição. A frase portuguesa preserva esse sentido de tomar o lugar de alguém e soa mais natural do que uma reprodução literal de “tornem-se em vez de”.
- source_word: ὑπερμαχεῖτε
  choice: lutem em defesa de
  rationale: O verbo denota lutar por alguém ou por uma causa, especialmente em sua defesa. “Lutem em defesa de” preserva essa nuance.
- source_word: ἔθνους
  choice: nação
  rationale: No contexto macabeu, ἔθνος designa a comunidade judaica como coletividade étnica e nacional. “Nação” conserva esse aspecto coletivo.
- source_word: ἐκ τοῦ οὐρανοῦ βοήθεια
  choice: a ajuda vinda do céu
  rationale: A expressão identifica o céu como fonte da ajuda e sugere reverentemente o auxílio divino sem nomear Deus de modo explícito.
- source_word: ἤτω μεθʼ ὑμῶν
  choice: que ... esteja com vocês
  rationale: O imperativo de terceira pessoa tem valor jussivo e é naturalmente expresso em português como desejo ou bênção.
theological_decisions:
- issue: Referência divina implícita em “misericórdia” e “ajuda vinda do céu”
  choice: Manter a referência implícita, sem inserir “Deus” no texto principal.
  alternative: “pela misericórdia de Deus” ou “que a ajuda de Deus, vinda do céu, esteja com vocês”
  rationale: O contexto sugere a ação divina, sobretudo na ajuda proveniente do céu, mas o grego não nomeia Deus neste versículo. A tradução preserva a implicação teológica sem torná-la mais explícita do que a fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto usa “vocês”, adequado ao plural e natural no registro contemporâneo. A sintaxe mantém o encadeamento exortativo do grego sem rigidez excessiva.
