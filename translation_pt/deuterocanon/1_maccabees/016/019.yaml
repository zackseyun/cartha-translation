review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz corretamente a sequência e as relações de finalidade do grego. Contudo, a nota em João vai além do que αἴρω especifica ao introduzir explicitamente a possibilidade de matá-lo; o contexto é hostil, mas o verbo não determina esse desfecho. «Comandantes de milhares» representa com mais clareza o plural de χιλιάρχοι do que «comandantes de mil».
  naturalness: A redação é clara e atual. A coordenação em uma só frase e «pedindo-lhes que viessem» tornam explícito, de modo natural, que as cartas foram enviadas aos comandantes.
  terminology: «Gazara» preserva a forma do texto grego, com identificação de Gezer em nota. «Prata, ouro e presentes» é fiel e idiomático. «Comandantes de milhares» conserva o caráter de título militar sem impor uma equivalência institucional moderna.
  issues:
  - severity: medium
    issue: A nota b menciona que os enviados poderiam pretender matar João.
    rationale: O infinitivo ἄραι significa levar, retirar ou remover; embora o contexto narrativo sugira hostilidade, o verbo não especifica matar. A nota deve preservar essa indeterminação sem apresentar uma ação não lexicalizada como alternativa.
  - severity: low
    issue: «Comandantes de mil» pode soar incompleto e atenua o plural de χιλιάρχοι.
    rationale: O grego se refere a comandantes associados a milhares; «comandantes de milhares» comunica melhor o título e o número plural sem acrescentar uma estrutura militar específica.
  revised_text: Ele enviou outros a Gazara[a] para levarem João[b] e enviou cartas aos comandantes de milhares, pedindo-lhes que viessem até ele, a fim de lhes dar prata, ouro e presentes.
  revised_footnotes:
