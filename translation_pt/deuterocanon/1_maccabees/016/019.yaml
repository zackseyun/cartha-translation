  text: And he sent others to Gazara to take John[a], and to the commanders of thousands he sent letters to come to him[b], so that he might give them silver and gold and gifts.
translation:
  language: pt
  text: Ele enviou outros a Gazara[a] para levarem João[b] e enviou cartas aos comandantes de milhares, pedindo-lhes que viessem até ele, a fim de lhes dar prata, ouro e presentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gazara é a forma grega do nome do lugar conhecido também como Gezer.
    reason: cultural_note
  - marker: b
    text: Ou “retirarem João”. O verbo grego pode significar levar ou retirar; no contexto, sugere intenção hostil, sem especificar a ação pretendida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: É o equivalente narrativo comum e natural, adequado às duas ocorrências do verbo.
- source_word: ἑτέρους
  choice: outros
  rationale: Preserva o objeto implícito do grego sem acrescentar desnecessariamente “homens” ou “mensageiros”.
- source_word: Γάζαρα
  choice: Gazara
  rationale: Reproduz a forma grega do topônimo; a identificação mais conhecida, Gezer, é indicada em nota.
- source_word: ἄραι
  choice: levarem João
  rationale: O infinitivo de αἴρω pode indicar levar, retirar ou carregar para longe. “Levarem” conserva a ideia de remoção sem especificar indevidamente captura ou morte.
- source_word: τοῖς χιλιάρχοις
  choice: aos comandantes de mil
  rationale: Traduz o sentido do título militar, literalmente referente a comandantes de mil homens, sem recorrer a uma transliteração pouco conhecida.
- source_word: ἐπιστολάς
  choice: cartas
  rationale: É o sentido comum do termo; “ordens escritas” explicitaria mais do que o texto grego.
- source_word: παραγενέσθαι πρὸς αὐτόν
  choice: que fossem até ele
  rationale: Expressa de modo natural a ideia de comparecer ou chegar à presença de alguém.
- source_word: ὅπως δῷ αὐτοῖς
  choice: a fim de lhes dar
  rationale: Mantém claramente a relação de finalidade expressa por ὅπως com o subjuntivo.
- source_word: ἀργύριον καὶ χρυσίον
  choice: prata, ouro
  rationale: Conserva a dupla referência literal aos metais preciosos, que também podem representar riqueza.
- source_word: δόματα
  choice: presentes
  rationale: É um equivalente amplo e corrente, sem determinar se os bens eram recompensas, concessões ou subornos.
