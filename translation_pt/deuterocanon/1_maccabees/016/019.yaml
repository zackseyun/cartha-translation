revisions:
- from: Ele enviou outros a Gazara[a] para levarem João[b]. Também enviou cartas aos comandantes de mil, pedindo que fossem até ele, a fim de lhes dar prata, ouro e presentes.
  to: Ele enviou outros a Gazara[a] para levarem João[b] e enviou cartas aos comandantes de milhares, pedindo-lhes que viessem até ele, a fim de lhes dar prata, ouro e presentes.
  rationale: A revisão elimina da nota uma especificação indevida sobre morte, preservando a ambiguidade de αἴρω. Também ajusta o título militar para refletir melhor o plural grego e melhora a ligação sintática entre as cartas e seus destinatários, sem alterar o sentido do versículo.
