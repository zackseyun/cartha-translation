  text: And when he heard, he was greatly alarmed, and he seized the men who had come to destroy him and killed them, for he knew that they were seeking to destroy him.
translation:
  language: pt
  text: Quando ouviu, ficou muito alarmado. Então prendeu os homens que tinham vindo para matá-lo e os matou, pois sabia que procuravam matá-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Quando soube disso
  rationale: O particípio aoristo indica circunstância temporal anterior. «Soube disso» é natural em português e explicita apenas o referente contextual implícito do verbo ouvir.
- source_word: ἐξέστη σφόδρα
  choice: ficou profundamente alarmado
  rationale: No contexto de uma tentativa de assassinato, ἐξίστημι descreve forte abalo ou consternação; σφόδρα intensifica a reação. A formulação evita reduzi-la a simples surpresa.
- source_word: συνέλαβεν
  choice: prendeu
  rationale: O verbo indica capturar ou deter. «Prendeu» comunica a apreensão dos homens sem exigir a ideia moderna de um procedimento policial formal.
- source_word: τοὺς ἄνδρας
  choice: os homens
  rationale: Mantém o sentido masculino plural explícito de ἄνδρας.
- source_word: τοὺς ἐλθόντας ἀπολέσαι αὐτόν
  choice: que tinham vindo para matá-lo
  rationale: Embora ἀπόλλυμι também possa significar «destruir», neste contexto pessoal e assassino significa causar a morte. «Matá-lo» é claro e idiomático.
- source_word: ἀπέκτεινεν αὐτούς
  choice: os matou
  rationale: ἀποκτείνω denota diretamente matar; a tradução é moderna, precisa e sem arcaísmo.
- source_word: ἔγνω
  choice: sabia
  rationale: Expressa o conhecimento ou reconhecimento da intenção dos homens. O imperfeito português integra naturalmente esse estado à explicação introduzida por «pois».
- source_word: ἐζήτουν αὐτὸν ἀπολέσαι
  choice: procuravam matá-lo
  rationale: ζητέω com infinitivo exprime intenção ou tentativa, e o imperfeito grego apresenta uma ação em curso. A repetição de «matá-lo» preserva a repetição de ἀπολέσαι nas duas orações.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A divisão em duas frases reduz o encadeamento excessivo sem alterar a sequência narrativa. Não há marcadores de nota, pois nenhuma nota é necessária.
