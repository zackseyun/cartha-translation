  yaml_path: translation/deuterocanon/1_maccabees/016/004.yaml
  text: And he selected from the country twenty thousand fighting men and horsemen[a], and they marched against Kendebaios, and camped in Modein.
translation:
  language: pt
  text: Ele selecionou na região vinte mil homens de combate e cavaleiros. Eles marcharam contra Cendebeu e acamparam[a] em Modin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “dormiram”; neste contexto militar, o sentido é que acamparam ali para passar a noite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέλεξεν ἐκ τῆς χώρας
  choice: escolheu dentre os habitantes da região
  rationale: O verbo indica uma escolha deliberada feita a partir de um grupo maior. Como χώρα designa o território ou a região, a formulação deixa claro, em português natural, que os homens foram recrutados entre seus habitantes.
- source_word: εἴκοσι χιλιάδας ἀνδρῶν πολεμιστῶν
  choice: vinte mil homens de combate
  rationale: Mantém a referência explícita a combatentes do sexo masculino e expressa o sentido militar de πολεμιστῶν em linguagem atual e digna.
- source_word: ἱππεῖς
  choice: cavaleiros
  rationale: Traduz diretamente os combatentes montados, sem substituir o termo concreto por uma designação coletiva como “cavalaria”.
- source_word: ἐπορεύθησαν ἐπὶ τὸν Κενδεβαῖον
  choice: marcharam contra Cendebeu
  rationale: No contexto militar, πορεύομαι descreve o avanço das tropas, e ἐπί com acusativo indica movimento hostil contra o adversário.
- source_word: ἐκοιμήθησαν
  choice: acamparam
  rationale: O sentido literal é “dormiram”, mas, no relato de uma campanha militar, a expressão indica que montaram acampamento ou passaram ali a noite.
- source_word: Μωδαείμ
  choice: Modein
  rationale: Emprega uma forma portuguesa reconhecível do topônimo antigo, próxima da transliteração tradicional.
