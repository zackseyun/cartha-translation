lexical_decisions:
- source_word: διεῖλεν
  choice: dividiu
  rationale: Preserva o sentido básico de dividir ou distribuir, enquanto a coordenação da frase deixa clara a organização militar.
- source_word: τὸν λαόν
  choice: o povo
  rationale: Mantém a formulação grega sem substituir explicitamente o referente contextual por “tropas” ou “exército”.
- source_word: τοὺς ἱππεῖς ἐν μέσῳ τῶν πεζῶν
  choice: colocou os cavaleiros no meio dos soldados de infantaria
  rationale: Explicita de modo natural em português a distribuição dos cavaleiros entre os combatentes a pé; “colocou” é fornecido pelo sentido distributivo de διεῖλεν no contexto.
- source_word: ἡ δὲ ἵππος
  choice: mas a cavalaria
  rationale: O singular ἵππος tem aqui valor coletivo e designa a força montada.
- source_word: τῶν ὑπεναντίων
  choice: dos inimigos
  rationale: É a expressão militar mais natural para os que se opõem ao grupo de João.
- source_word: πολλὴ σφόδρα
  choice: muito numerosa
  rationale: Transmite com clareza a forte intensificação quantitativa aplicada à cavalaria inimiga.
