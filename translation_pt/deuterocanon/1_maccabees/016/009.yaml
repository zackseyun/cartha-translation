base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/009.yaml
  text: Then Judas[a], the brother of John, was wounded; but John pursued them until he came to Kedron[b], which he had built.
translation:
  language: pt
  text: Então Judas, irmão de João, foi ferido; João, porém, perseguiu-os até chegar a Cedrom[a], que Cendebeu havia construído.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode escrever «Quedrom», transliteração mais direta do grego Κεδρών.
    reason: lexical_alternative
  - marker: b
    text: O grego deixa implícito o sujeito de «havia construído». No contexto anterior, Cendebeu é explicitamente apresentado como quem construiu Cedrom (15:39, 41).
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτραυματίσθη
  choice: foi ferido
  rationale: O aoristo passivo indica que Judas recebeu um ferimento; a formulação é natural e específica no contexto de batalha.
- source_word: κατεδίωξεν
  choice: perseguiu-os
  rationale: O verbo expressa a perseguição ativa dos adversários em fuga; o pronome retoma de modo claro o grupo mencionado no contexto.
- source_word: ἕως ἐλθεῖν
  choice: até chegar
  rationale: O infinitivo singular depende naturalmente de João, sujeito de «perseguiu», e marca o limite alcançado na perseguição sem exigir a inserção de um novo sujeito.
- source_word: Κεδρών
  choice: Cedrom
  rationale: «Cedrom» é uma forma tradicional e reconhecível em português para o topônimo grego; «Quedrom» reproduziria mais diretamente o kappa grego.
- source_word: οἰκοδόμησεν
  choice: havia construído
  rationale: O verbo significa normalmente «construir». O mais-que-perfeito composto deixa claro que a construção ocorreu antes da perseguição, sem acrescentar a ideia não explícita de fortificação.
theological_decisions:
- issue: Referente do sujeito implícito em οἰκοδόμησεν
  choice: que ele havia construído, com nota de ambiguidade
  alternative: que Cendebeu havia construído / que João havia construído
  rationale: O grego não explicita o sujeito de «havia construído». A proximidade sintática pode sugerir João, enquanto o contexto anterior atribui a construção de Cedrom a Cendebeu. A tradução conserva o pronome ambíguo e a nota informa as possibilidades sem decidir silenciosamente.
translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa natural. «João, porém» preserva o contraste marcado por δέ. Os marcadores aparecem junto aos elementos a que suas notas se referem.
