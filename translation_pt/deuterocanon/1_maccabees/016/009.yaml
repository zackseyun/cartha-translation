  naturalness: O português é claro e de registro narrativo adequado. A ligação por ponto e «João, porém» é aceitável, mas o ponto e vírgula preserva melhor a continuidade contrastiva do grego.
  terminology: «Foi ferido», «perseguiu-os» e «Cedrom» são escolhas adequadas. «Quedrom» pode ser mencionada como transliteração alternativa. Convém nomear Cendebeu na oração relativa para evitar uma ambiguidade enganosa em português.
