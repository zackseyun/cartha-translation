    rationale: Isso descreve uma possível impressão da sintaxe isolada, mas não dá peso suficiente à identificação contextual explícita de Cendebeu como construtor. A nota deve informar a elipse grega sem apresentar João como alternativa contextual equiparável.
  revised_text: Então Judas, irmão de João, foi ferido; João, porém, perseguiu-os até chegar a Cedrom[a], que Cendebeu havia construído.[b]
