  text: Behold[a], these things are written in the book of the days of his high priesthood, from the time when he became high priest after his father.
translation:
  language: pt
  text: Eis que essas coisas estão escritas no livro dos dias do seu sumo sacerdócio[a], desde quando ele se tornou sumo sacerdote depois de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo, “nos anais do seu sumo sacerdócio”. O grego diz mais literalmente: “no livro dos dias do seu sumo sacerdócio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Eis que
  rationale: Preserva a função de chamar a atenção e se ajusta ao tom solene de uma nota conclusiva, sem deixar de ser compreensível.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O neutro plural abrange os acontecimentos narrados anteriormente; “essas coisas” preserva essa referência ampla.
- source_word: γέγραπται
  choice: estão escritas
  rationale: O perfeito passivo apresenta o conteúdo como registrado e ainda existente por escrito.
- source_word: ἐπὶ βιβλίῳ
  choice: no livro
  rationale: Em contexto documental, a expressão indica que o conteúdo se encontra em um registro escrito; “no livro” é natural em português.
- source_word: ἡμερῶν ἀρχιερωσύνης αὐτοῦ
  choice: dos dias do seu sumo sacerdócio
  rationale: Mantém de perto a formulação grega e sua possível ressonância como título de um registro analístico.
- source_word: ἀφʼ οὗ
  choice: desde quando
  rationale: Expressa o ponto inicial do período abrangido pelo registro.
- source_word: ἐγενήθη ἀρχιερεὺς
  choice: ele se tornou sumo sacerdote
  rationale: Traduz a ascensão ao ofício sem introduzir um agente que o grego não explicita.
- source_word: μετὰ τὸν πατέρα αὐτοῦ
  choice: depois de seu pai
  rationale: Preserva a concisão do grego e deixa implícita, como no contexto, a sucessão no ofício.
