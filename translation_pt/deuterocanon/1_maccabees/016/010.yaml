  yaml_path: translation/deuterocanon/1_maccabees/016/010.yaml
  text: And they fled into the towers in the fields of Azotus[a], and he burned it with fire; and about a thousand men fell from among them[c][b], and he returned to Judea in peace.
translation:
  language: pt
  text: Eles fugiram para as torres que ficavam nos campos de Azoto[a], e ele pôs fogo naquele lugar[b]. Cerca de mil homens dentre eles caíram[c], e ele voltou em paz para a Judeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azoto é o nome grego de Asdode.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “queimou-a com fogo”. O pronome está no singular e talvez se refira coletivamente à posição fortificada, não a cada uma das torres.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “mil homens”. A expressão grega pode indicar um total aproximado.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγον
  choice: fugiram
  rationale: Verbo narrativo direto e natural no contexto de retirada militar.
- source_word: πύργους
  choice: torres
  rationale: Preserva a imagem concreta do termo grego, sem ampliá-lo interpretativamente para “fortalezas”.
- source_word: ἀγροῖς
  choice: campos
  rationale: Equivalente direto e inteligível; indica a área rural ao redor de Azoto.
- source_word: Ἀζώτου
  choice: Azoto
  rationale: Mantém a forma grega tradicional do topônimo em português; a identificação com Asdode é dada em nota.
- source_word: ἐνεπύρισεν αὐτὴν ἐν πυρί
  choice: pôs fogo naquele lugar
  rationale: Expressa idiomaticamente a ação e preserva o singular αὐτήν sem fazê-lo concordar artificialmente com o plural “torres”; “naquele lugar” deixa aberta a referência coletiva à posição fortificada.
- source_word: ἔπεσον
  choice: caíram
  rationale: Conserva o conhecido eufemismo militar do grego, entendido no contexto como morte em combate.
- source_word: ἐξ αὐτῶν
  choice: dentre eles
  rationale: 'Reproduz naturalmente o sentido partitivo: as baixas pertenciam ao grupo em fuga.'
- source_word: εἰς ἄνδρας χιλίους
  choice: cerca de mil homens
  rationale: A construção indica que o total chegou aproximadamente a mil, sem exigir uma precisão maior que a do grego.
- source_word: ἀπέστρεψεν
  choice: voltou
  rationale: Forma corrente e natural para o retorno que encerra a ação narrativa.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Equivalente literal e idiomático da expressão grega.
