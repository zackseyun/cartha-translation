base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/006.yaml
  text: And he himself and his people encamped opposite them; and when he saw the people afraid to cross the wadi[a], he crossed first, and the men saw him and crossed after him.
translation:
  language: pt
  text: Ele próprio e seu povo acamparam diante deles. Ao ver que o povo estava com medo de atravessar o uádi[a], ele atravessou primeiro; quando os homens o viram, atravessaram atrás dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a torrente» ou «o leito do riacho»; o termo grego se refere a um curso de água sazonal.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλεν
  choice: acamparam
  rationale: No contexto militar, o verbo indica estabelecer acampamento. O plural é natural em português porque o sujeito expresso é «ele próprio e seu povo».
- source_word: κατὰ πρόσωπον αὐτῶν
  choice: diante deles
  rationale: A expressão indica uma posição em frente ao grupo adversário; «diante deles» preserva o sentido espacial sem acrescentar uma nuance de confronto não explicitada.
- source_word: αὐτὸς καὶ ὁ λαὸς αὐτοῦ
  choice: ele próprio e seu povo
  rationale: «Ele próprio» conserva a ênfase de αὐτός, enquanto «seu povo» traduz diretamente a força que o acompanhava.
- source_word: δειλούμενον
  choice: estava com medo
  rationale: O particípio descreve temor diante da travessia, sem exigir o julgamento moral mais forte de «covardia».
- source_word: διαπερᾶσαι
  choice: atravessar
  rationale: No contexto de um curso de água sazonal, o verbo significa passar de um lado para o outro.
- source_word: τὸν χειμάρρουν
  choice: o uádi
  rationale: χείμαρρους designa um curso de água sazonal ou seu leito. «Uádi» comunica com precisão a realidade geográfica, e a nota oferece equivalentes mais descritivos.
- source_word: διεπέρασεν πρῶτος
  choice: ele atravessou primeiro
  rationale: A formulação direta preserva a ênfase narrativa na iniciativa pessoal do líder.
- source_word: οἱ ἄνδρες
  choice: os homens
  rationale: O grego não traz possessivo nem especifica «soldados»; a tradução mantém essa formulação mais aberta.
- source_word: κατόπισθεν αὐτοῦ
  choice: atrás dele
  rationale: A expressão descreve os homens atravessando em seu rastro, depois de ele tomar a dianteira.
