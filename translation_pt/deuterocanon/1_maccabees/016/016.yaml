base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/016.yaml
  text: And when Simon and his sons became drunk[a], Ptolemy and those with him rose up and took their weapons, and entered the banquet against Simon, and killed him and his sons, and some of his young servants.
translation:
  language: pt
  text: Quando Simão e seus filhos ficaram embriagados, Ptolemeu e os que estavam com ele se levantaram, pegaram as próprias armas, entraram no banquete[a] para atacar Simão e mataram Simão, seus filhos e alguns de seus jovens criados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “festa regada a bebida”; o termo grego pode designar especificamente um banquete em que se bebia.
    reason: Registra a nuance mais específica de συμπόσιον sem restringir indevidamente o texto principal.
lexical_decisions:
- source_word: ἐμεθύσθη
  choice: ficaram embriagados
  rationale: O aoristo passivo de μεθύσκω indica a entrada no estado de embriaguez; “ficaram embriagados” preserva esse aspecto ingressivo em português natural.
- source_word: ἐξανέστη
  choice: se levantaram
  rationale: Expressa o início decidido da ação dos agressores sem acrescentar uma ideia de rebelião que o contexto não exige.
- source_word: οἱ μετʼ αὐτοῦ
  choice: os que estavam com ele
  rationale: Mantém a expressão grega deliberadamente inespecífica, sem definir essas pessoas como soldados, servos ou companheiros.
- source_word: ἔλαβον τὰ ὅπλα αὐτῶν
  choice: pegaram as próprias armas
  rationale: ὅπλα designa armas; “as próprias” evita a ambiguidade possessiva que “suas armas” poderia criar em português.
- source_word: ἐπεισῆλθοσαν τῷ Σίμωνι
  choice: entraram ... para atacar Simão
  rationale: O verbo composto e o dativo comunicam uma entrada hostil dirigida contra Simão. A formulação portuguesa preserva essa força sem a construção pouco natural “entraram contra Simão”.
- source_word: συμπόσιον
  choice: banquete
  rationale: “Banquete” é claro e adequado ao cenário, embora o termo grego também possa designar mais especificamente uma reunião festiva centrada em beber; essa nuance é registrada em nota.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: Reproduz o sentido lexical básico sem introduzir no próprio verbo uma qualificação jurídica adicional como “assassinaram”.
- source_word: παιδαρίων
  choice: jovens criados
  rationale: παιδάριον pode indicar meninos ou jovens servos. No contexto da casa de um governante, “jovens criados” conserva tanto a possível nuance de idade quanto a função de serviço.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem narrativa foi preservada, enquanto a construção hostil de ἐπεισῆλθοσαν com dativo foi vertida de modo idiomático.
