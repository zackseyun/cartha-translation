lexical_decisions:
- source_word: ἦν
  choice: era
  rationale: O imperfeito de εἰμί expressa aqui um estado passado; «era» é a forma natural em português.
- source_word: γὰρ
  choice: pois
  rationale: γάρ introduz a explicação do que foi dito antes; «pois» preserva essa relação de modo conciso e natural.
- source_word: γαμβρὸς
  choice: genro
  rationale: Neste contexto, o termo de parentesco indica mais provavelmente o genro do sumo sacerdote, embora em grego possa designar de modo mais amplo um parente por casamento.
- source_word: τοῦ ἀρχιερέως
  choice: do sumo sacerdote
  rationale: ἀρχιερεύς é o título habitual do principal sacerdote no contexto judaico, tradicional e corretamente vertido como «sumo sacerdote».
