base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/016/002.yaml
  text: And Simon called his two older sons, Judas and John, and said to them, “I and my brothers and my father’s house have fought the wars of Israel from youth until this day, and it has prospered in our hands to deliver Israel many times.”
translation:
  language: pt
  text: 'Então Simão chamou seus dois filhos mais velhos, Judas e João, e lhes disse: “Eu, meus irmãos e a casa de meu pai temos travado as guerras de Israel desde a juventude até o dia de hoje, e tivemos êxito em libertar Israel muitas vezes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς δύο υἱοὺς αὐτοῦ τοὺς πρεσβυτέρους
  choice: seus dois filhos mais velhos
  rationale: Expressa o comparativo πρεσβυτέρους em português natural, sem afirmar necessariamente que Simão tivesse apenas dois filhos.
- source_word: ἐπολεμήσαμεν τοὺς πολέμους Ἰσραήλ
  choice: temos travado as guerras de Israel
  rationale: O pretérito perfeito composto comunica uma atividade reiterada ou prolongada que se estende da juventude até o presente da fala; “guerras de Israel” preserva a relação genitiva sem decidir se são guerras de Israel ou em favor de Israel.
- source_word: ἀπὸ νεότητος ἕως τῆς σήμερον ἡμέρας
  choice: desde a juventude até o dia de hoje
  rationale: Formulação clara e dignificada que mantém a extensão temporal do grego sem inserir um possessivo ausente no texto.
- source_word: εὐώδωθη ἐν ταῖς χερσὶν ἡμῶν
  choice: tivemos êxito
  rationale: Reproduz de modo natural em português o sentido contextual da construção grega, literalmente ligada a prosperar ou ser bem-sucedido “em nossas mãos”.
- source_word: ῥύσασθαι τὸν Ἰσραὴλ πλεονάκις
  choice: em libertar Israel muitas vezes
  rationale: “Libertar” se ajusta ao contexto de resgate militar e evita conotações soteriológicas mais amplas; “muitas vezes” preserva a repetição expressa por πλεονάκις.
theological_decisions:
- issue: Agência na libertação de Israel
  choice: Manter a família de Simão como agente humano explícito do êxito na libertação.
  alternative: Acrescentar Deus como aquele que lhes concedeu o êxito.
  rationale: O grego não nomeia explicitamente Deus, embora a expressão possa ser compatível com a ideia de êxito providencial. A tradução não deve explicitar um agente divino que o versículo deixa implícito ou sem menção.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno, mas evita literalismos pouco idiomáticos como “prosperou em nossas mãos”. “Então” oferece uma ligação narrativa natural para καί.
