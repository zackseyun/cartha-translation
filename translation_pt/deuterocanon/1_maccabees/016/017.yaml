  text: And he committed a great act of treachery[a], and repaid evil for good.
translation:
  language: pt
  text: E ele cometeu uma grande traição[a] e retribuiu o bem com o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande quebra de confiança” ou “uma grande infidelidade”. O termo grego pode indicar a violação de confiança, compromisso ou obrigação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: cometeu
  rationale: Com ἀθεσίαν como objeto, o verbo exprime idiomaticamente a prática de um ato moralmente condenável; “cometeu” é natural em português.
- source_word: ἀθεσίαν
  choice: traição
  rationale: No contexto narrativo, o substantivo indica violação de confiança, compromisso ou obrigação. “Traição” comunica de modo direto o caráter concreto e relacional do ato.
- source_word: μεγάλην
  choice: grande
  rationale: Mantém de perto a intensificação do grego e sublinha a gravidade da traição sem explicá-la em excesso.
- source_word: ἀνταπέδωκεν
  choice: retribuiu
  rationale: O verbo denota dar em retorno ou pagar na mesma lógica de troca; “retribuiu” combina naturalmente com a construção portuguesa “o bem com o mal”.
- source_word: κακὰ
  choice: o mal
  rationale: O plural neutro grego abrange ações ou tratamento maus. O singular coletivo “o mal” é idiomático em português e preserva a dimensão moral.
- source_word: ἀντὶ ἀγαθῶν
  choice: o bem com o mal
  rationale: A construção portuguesa “retribuir o bem com o mal” expressa com clareza a troca indicada por ἀντί e conserva o contraste moral do original.
theological_decisions:
- issue: Caracterização moral de ἀθεσία
  choice: “traição”, em sentido relacional e concreto
  alternative: “infidelidade”, “quebra de confiança” ou “ato de transgressão”
  rationale: O contexto condena uma violação concreta de confiança ou obrigação. A tradução evita transformar o termo em uma categoria teológica técnica e preserva sua força narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação conserva o paralelismo moral entre bem e mal e mantém em nota a amplitude semântica de ἀθεσία.
