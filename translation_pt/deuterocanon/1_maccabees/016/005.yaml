  text: And when they rose early in the morning[a], they went into the plain; and behold, a large force came to meet them, infantry and cavalry, and a wadi was between them.
translation:
  language: pt
  text: Depois de se levantarem de manhã cedo, foram para a planície. E eis que uma grande força, composta de infantaria e cavalaria, veio ao encontro deles; e havia torrentes entre eles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cursos de água sazonais” ou “leitos de torrentes”. O termo grego se refere a cursos de água que correm na estação chuvosa e pode indicar tanto a água como os seus leitos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες τὸ πρωὶ
  choice: Levantando-se de manhã cedo
  rationale: O particípio seguido da expressão temporal indica uma ação anterior ao deslocamento; a formulação é natural em português e preserva a sequência narrativa.
- source_word: ἐπορεύοντο
  choice: foram
  rationale: Embora o imperfeito possa apresentar o movimento em curso, no fluxo narrativo português o pretérito perfeito expressa com naturalidade o avanço para a planície sem perda relevante.
- source_word: τὸ πεδίον
  choice: a planície
  rationale: No contexto militar, o termo designa terreno aberto e relativamente plano, não especificamente um campo agrícola.
- source_word: δύναμις πολλὴ
  choice: uma grande força
  rationale: Aqui δύναμις denota uma força militar numerosa; a escolha evita especificar além do texto que se tratava de um exército formal.
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: veio ao encontro deles
  rationale: Reproduz diretamente a ideia de aproximação para o encontro, sem tornar explícita uma hostilidade que apenas o contexto sugere.
- source_word: πεζικοὶ καὶ ἱππεῖς
  choice: soldados de infantaria e cavaleiros
  rationale: Identifica com clareza as tropas a pé e as montadas em linguagem corrente, sem depender do termo coletivo mais técnico “cavalaria”.
- source_word: χειμάρρους
  choice: curso de água sazonal
  rationale: O termo grego pode indicar uma torrente de inverno ou seu leito; esta expressão comunica melhor ao leitor lusófono a natureza sazonal do acidente geográfico, preservando a ambiguidade em nota.
- source_word: ἦν ἀνὰ μέσον αὐτῶν
  choice: havia entre os dois grupos
  rationale: Torna inequívoco que o curso de água separava as duas forças, sendo “os dois grupos” uma explicitação contextual mínima do pronome.
