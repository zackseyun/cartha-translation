  yaml_path: translation/deuterocanon/1_maccabees/005/001.yaml
  text: And it happened that when the surrounding nations heard that the altar had been rebuilt and the sanctuary rededicated as before, they became very angry.
translation:
  language: pt
  text: E aconteceu que, quando as nações ao redor souberam que o altar havia sido reconstruído e o santuário havia sido novamente dedicado, como antes, ficaram muito iradas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: E aconteceu que, quando
  rationale: Preserva a fórmula narrativa de matriz semítica e sua estrutura temporal, sem deixar o português obscuro.
- source_word: τὰ ἔθνη κυκλόθεν
  choice: as nações ao redor
  rationale: Mantém o sentido geográfico e a designação direta de povos vizinhos, sem tornar explícito no texto aquilo que o contexto apenas implica.
- source_word: ᾠκοδομήθη
  choice: tinha sido reconstruído
  rationale: O contexto é de restauração após a profanação; o mais-que-perfeito composto deixa claro que a reconstrução antecedeu a notícia recebida.
- source_word: τὸ θυσιαστήριον
  choice: o altar
  rationale: Equivalente direto e suficiente no contexto do culto do templo.
- source_word: ἐνεκαινίσθη
  choice: novamente dedicado
  rationale: No contexto do santuário, o verbo indica renovação ou nova dedicação. A expressão é clara e evita uma forma menos corrente como 'rededicado'.
- source_word: τὸ ἁγίασμα
  choice: o santuário
  rationale: Designa o lugar sagrado, e não a santidade em sentido abstrato.
- source_word: ὡς τὸ πρότερον
  choice: como antes
  rationale: Expressa de modo conciso a restauração à condição anterior.
- source_word: ὠργίσθη σφόδρα
  choice: ficaram muito iradas
  rationale: Comunica de maneira natural a passagem a um estado de intensa ira, preservando a força de σφόδρα.
theological_decisions:
- issue: Referência de τὰ ἔθνη no contexto histórico judaico de 1 Macabeus
  choice: as nações ao redor
  alternative: os gentios ao redor; os povos vizinhos
  rationale: O grego diz literalmente 'as nações ao redor'. No contexto, trata-se dos povos não judeus vizinhos, mas 'nações' preserva a formulação da fonte sem introduzir no texto uma interpretação mais específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula inicial foi preservada por seu valor narrativo; a construção mantém o antecedente feminino plural de 'nações' em 'iradas'.
