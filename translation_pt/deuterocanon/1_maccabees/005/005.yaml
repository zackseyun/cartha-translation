  text: And they were shut up by him in the towers[a], and he encamped against them, and he devoted them to destruction, and he burned its towers with fire[b], along with all who were in them.
translation:
  language: pt
  text: Eles foram encerrados por ele nas torres; ele acampou contra eles, destinou-os à destruição[a] e incendiou suas torres[b], com todos os que estavam nelas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pôs todos sob a interdição”. O verbo grego indica destinar pessoas ou coisas à destruição, e não apenas amaldiçoá-las.'
    reason: lexical_alternative
  - marker: b
    text: O grego traz um pronome feminino singular, literalmente “as torres dela”, provavelmente em referência à cidade mencionada no contexto.
    reason: referent_clarification
lexical_decisions:
- source_word: διεκλείσθησαν
  choice: foram encerrados
  rationale: Preserva a voz passiva e a ideia de que foram confinados nas torres pela ação dele, sem especificar além do grego o mecanismo militar.
- source_word: πύργους
  choice: torres
  rationale: É o sentido comum e direto do termo grego; o contexto já indica que se trata de estruturas defensivas.
- source_word: παρέβαλεν ἐπʼ αὐτούς
  choice: acampou contra eles
  rationale: Mantém a imagem concreta de estabelecer acampamento em posição hostil, sem substituir o verbo pela interpretação mais específica de sitiar.
- source_word: ἀνεθεμάτισεν
  choice: destinou-os à destruição
  rationale: Expressa a ideia bíblica de colocar pessoas sob a interdição que as destina à destruição, indo além do mero ato de amaldiçoar.
- source_word: ἐνεπύρισεν ... ἐν πυρί
  choice: incendiou
  rationale: Comunica naturalmente em português o ato de pôr fogo. A construção grega acrescenta literalmente «com fogo», expressão redundante no português corrente.
- source_word: αὐτῆς
  choice: da cidade
  rationale: O pronome grego é feminino singular e provavelmente retoma a cidade mencionada no contexto. A explicitação evita em português um pronome sem antecedente claro.
- source_word: σὺν πᾶσιν τοῖς ἐνοῦσιν
  choice: com todos os que estavam nelas
  rationale: Preserva a totalidade indicada por πᾶσιν e liga naturalmente as pessoas ao interior das torres.
theological_decisions:
- issue: Sentido de ἀνεθεμάτισεν no contexto de guerra sacral
  choice: destinou-os à destruição
  alternative: pôs todos sob a interdição
  rationale: A formulação escolhida conserva a noção de consagração ou interdição para destruição, mas evita deixar no texto principal um termo técnico pouco transparente. Não reduz o verbo a uma simples maldição nem afirma apenas o resultado material.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. «Foram encerrados» e «acampou contra eles» mantêm de perto as imagens do grego; «da cidade» explicita apenas o provável referente do pronome feminino singular. O marcador [a] foi colocado junto à expressão que traduz ἀνεθεμάτισεν.
