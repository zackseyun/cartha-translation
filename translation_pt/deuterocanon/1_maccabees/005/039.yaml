base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/039.yaml
  text: And Arabs had been hired to help them[a], and they were encamped beyond the wadi, ready to come against you in battle[b]. And Judas went out to meet them.
translation:
  language: pt
  text: E árabes haviam sido contratados para ajudá-los. Eles estão acampados do outro lado da torrente[a], prontos para vir contra você em combate[b]. Então Judas foi ao encontro deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do outro lado do ribeiro”. A palavra grega pode indicar uma corrente que corre no inverno, uma torrente ou o leito sazonal por onde ela passa.
    reason: lexical_alternative
  - marker: b
    text: O grego diz “contra você” no singular, refletindo o relato dirigido diretamente a Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄραβες
  choice: árabes
  rationale: Designação étnica direta e natural no português atual.
- source_word: μεμίσθωνται
  choice: foram contratados
  rationale: O perfeito médio-passivo de μισθόω indica que haviam sido contratados mediante pagamento; a formulação preserva esse estado sem explicitar além do texto que eram mercenários.
- source_word: εἰς βοήθειαν αὐτοῖς
  choice: para ajudá-los
  rationale: Expressa com clareza a finalidade da contratação e mantém o referente plural.
- source_word: παρεμβάλλουσιν
  choice: estão acampados
  rationale: O presente descreve a situação militar vigente; esta forma é natural em português e conserva o aspecto durativo.
- source_word: πέραν τοῦ χειμάρρου
  choice: do outro lado da torrente
  rationale: χείμαρρος pode designar uma corrente impetuosa ou seu leito sazonal. “Torrente” preserva essa amplitude melhor que o empréstimo menos conhecido “uádi”.
- source_word: ἕτοιμοι τοῦ ἐλθεῖν ἐπὶ σὲ εἰς πόλεμον
  choice: prontos para vir contra você em combate
  rationale: Mantém tanto o movimento hostil quanto a finalidade militar, além do pronome singular do discurso dirigido a Judas.
- source_word: εἰς συνάντησιν αὐτῶν
  choice: ao encontro deles
  rationale: Reproduz a ideia de Judas dirigir-se ao encontro ou confronto com eles sem acrescentar uma especificação já implícita no contexto militar.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. “Você” torna explícito e natural o singular de σέ; “torrente” evita um regionalismo ou empréstimo pouco conhecido, enquanto a nota preserva a amplitude geográfica do termo grego.
