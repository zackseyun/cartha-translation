lexical_decisions:
- source_word: ὁ ἀνὴρ Ἰούδας
  choice: o homem Judas
  rationale: Mantém a expressão apositiva explícita do grego, embora incomum em português, sem acrescentar a ideia não expressa de “guerreiro”.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: seus irmãos
  rationale: Reproduz naturalmente o plural masculino e a relação indicada pelo possessivo.
- source_word: ἐδοξάζοντο σφόδρα
  choice: eram grandemente honrados
  rationale: O contexto aponta para a estima pública concedida a Judas e seus irmãos; “honrados” comunica esse valor de δοξάζω com mais naturalidade em português do que “glorificados”, enquanto “grandemente” preserva a força de σφόδρα.
- source_word: ἐναντίον παντὸς Ἰσραήλ
  choice: diante de todo o Israel
  rationale: Preserva a construção que indica a consideração pública perante o conjunto do povo de Israel.
- source_word: τῶν ἐθνῶν πάντων
  choice: de todas as nações
  rationale: Expressa o sentido amplo e político de ἔθνη no contexto, sem impor a categoria teológica “gentios”.
- source_word: οὗ ἠκούετο τὸ ὄνομα αὐτῶν
  choice: onde quer que se ouvisse o nome deles
  rationale: Conserva o idiomatismo do original e seu sentido locativo geral, sem explicitar demais como “fama” ou “reputação”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação incomum “o homem Judas” foi preservada por correspondência formal e esclarecida em nota; “eram grandemente honrados” evita uma conotação teológica indevida de “glorificados” neste contexto de reconhecimento público.
