  text: And the man Judas and his brothers were greatly glorified before all Israel and all the nations, wherever their name was heard.
translation:
  language: pt
  text: E o homem Judas[a] e seus irmãos eram grandemente honrados diante de todo o Israel e de todas as nações, onde quer que se ouvisse o nome deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “o homem Judas”, expressão apositiva mantida aqui em vez de ser simplificada para apenas “Judas”.
