  yaml_path: translation/deuterocanon/1_maccabees/005/003.yaml
  text: And Judas fought against the sons of Esau in Judea[a], in the Akrabattene region, because they were hemming in Israel. And he struck them with a great blow, and humbled them[b], and took their spoils.
translation:
  language: pt
  text: Judas guerreava contra os filhos de Esaú[a], na Judeia, na região de Acrabatene[b], porque eles mantinham Israel cercado. Ele lhes infligiu uma grande derrota, humilhou-os[c] e tomou os despojos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes de Esaú”; isto é, provavelmente os edomitas. O grego diz literalmente “os filhos de Esaú”.
    reason: lexical_alternative
  - marker: b
    text: Acrabatene é o nome de uma região da Judeia. A sintaxe grega é condensada e também pode ser entendida como “na Judeia, em Acrabatene”.
    reason: cultural_note
  - marker: c
    text: Ou “reprimiu-os” ou “reduziu-os”. O verbo grego pode indicar que ele os conteve ou os pôs em condição inferior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπολέμει
  choice: guerreava contra
  rationale: O imperfeito indica ação militar em curso; “guerreava contra” preserva esse aspecto e a relação adversativa expressa por πρὸς.
- source_word: υἱοὺς Ἠσαῦ
  choice: os filhos de Esaú
  rationale: Mantém a expressão étnico-genealógica do grego sem substituí-la pela identificação histórica interpretativa “edomitas”.
- source_word: ἐν τῇ Ἰουδαίᾳ τὴν Ἀκραβαττήνην
  choice: na Judeia, na região de Acrabatene
  rationale: A construção grega é comprimida e algo irregular; tratar Acrabatene como nome regional produz português claro sem eliminar a incerteza sintática, registrada em nota.
- source_word: περικάθηντο
  choice: mantinham Israel cercado
  rationale: Expressa a ação contínua de rodear e pressionar hostilmente, sem necessariamente pressupor o cerco formal de uma cidade.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Preserva o singular coletivo e o sentido nacional do texto grego.
- source_word: ἐπάταξεν αὐτοῖς πληγὴν μεγάλην
  choice: lhes infligiu uma grande derrota
  rationale: Verte de maneira natural o idiomatismo militar grego, cujo sentido é desferir um golpe severo ou impor uma grande derrota.
- source_word: συνέστειλεν αὐτούς
  choice: subjugou-os
  rationale: No contexto militar, o verbo indica reduzir, reprimir ou pôr sob domínio; “subjugou-os” comunica isso sem sugerir aniquilação.
- source_word: τὰ σκῦλα αὐτῶν
  choice: os despojos deles
  rationale: Refere-se aos bens tomados do inimigo após a vitória; “despojos” é o termo militar corrente e digno em português.
