  yaml_path: translation/deuterocanon/1_maccabees/005/033.yaml
  text: And he went out against them in three divisions from outside them[a]; and they sounded the trumpets and cried out in prayer.
translation:
  language: pt
  text: E ele saiu contra eles em três divisões, do lado de fora deles[a]; tocou as trombetas[b], e eles clamaram em oração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de fora deles”. A expressão é espacialmente ambígua e pode referir-se ao lado exterior da posição ou do agrupamento deles.
    reason: Preserva a ambiguidade de ἔξωθεν αὐτῶν sem introduzir “posições” no texto principal.
  - marker: b
    text: 'O grego traz aqui o verbo no singular, “tocou”, e em seguida passa ao plural: “eles clamaram”. A primeira ação também pode ser entendida em sentido coletivo: “tocaram as trombetas”.'
    reason: Registra a mudança de número presente no texto grego e a possível compreensão coletiva do toque das trombetas.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu contra eles
  rationale: O verbo significa literalmente “saiu”, mas o contexto militar indica uma saída ou avanço hostil; “contra eles” torna explícita essa relação sem ampliar indevidamente o sentido.
- source_word: ἐν τρισὶν ἀρχαῖς
  choice: em três divisões
  rationale: Neste contexto, ἀρχαῖς indica três agrupamentos organizados para a ação militar. “Divisões” comunica a estrutura tática sem transformar o termo em referência explícita a três comandantes.
- source_word: ἔξωθεν αὐτῶν
  choice: vindo de fora de suas posições
  rationale: A expressão grega é concisa e literalmente diz “de fora deles”. A explicitação de “posições” produz português natural e preserva a provável referência espacial, sem especificar acampamento, retaguarda ou outro local não nomeado.
- source_word: ἐσάλπισεν ταῖς σάλπιγξιν
  choice: tocou as trombetas
  rationale: Mantém-se o verbo no singular, conforme a forma grega ἐσάλπισεν, embora a passagem mude em seguida para o plural. “Tocar as trombetas” é uma formulação natural para emitir o sinal militar.
- source_word: ἐβόησαν
  choice: clamaram
  rationale: O verbo descreve um brado forte. “Clamaram” conserva tanto a intensidade vocal quanto a adequação ao contexto de oração.
- source_word: ἐν προσευχῇ
  choice: em oração
  rationale: Tradução direta da expressão que indica a maneira ou esfera religiosa do clamor, sem defini-lo mais especificamente como súplica.
theological_decisions:
- issue: Explicitação da hostilidade militar em ἐξῆλθεν
  choice: saiu contra eles
  alternative: saiu
  rationale: O contexto é de combate, e o complemento “contra eles” comunica a força contextual do movimento sem alterar o agente ou o alvo.
- issue: Mudança de número entre ἐσάλπισεν e ἐβόησαν
  choice: tocou as trombetas ... eles clamaram
  alternative: tocaram as trombetas ... clamaram
  rationale: 'A tradução principal preserva a tensão gramatical do texto grego: primeiro um verbo singular, depois um plural. A nota informa a possibilidade de entender a primeira ação coletivamente, sem apagar a forma atestada.'
translation_notes:
  register: Português atual, digno e acessível, com cadência narrativa. A redação mantém a concisão do grego e conserva sua mudança inesperada do singular para o plural, documentando em notas as ambiguidades espacial e gramatical.
