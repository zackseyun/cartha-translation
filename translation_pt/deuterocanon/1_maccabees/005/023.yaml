  text: And he took them from Galilee and from Arbactis[a], together with the women and the children and all that belonged to them[b], and they brought them into Judea with great rejoicing.
translation:
  language: pt
  text: E ele os recolheu da Galileia e em Arbactis[a], com as mulheres, as crianças e tudo o que lhes pertencia; e eles os conduziram à Judeia com grande alegria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «em Arbactis», embora a coordenação com «da Galileia» e o contexto de deslocamento possam levar a entender «de Arbactis».
    reason: lexical_alternative
  - marker: b
    text: O texto grego passa do singular («ele os recolheu») para o plural («eles os conduziram»). A tradução preserva essa mudança tal como foi transmitida.
    reason: textual_variant
lexical_decisions:
- source_word: παρέλαβεν
  choice: levou
  rationale: No contexto, o verbo descreve o ato de reunir essas pessoas e levá-las consigo para um lugar seguro; «levou» é natural e mantém o singular grego.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: da Galileia
  rationale: Expressa diretamente a procedência geográfica indicada por ἐκ.
- source_word: ἐν Ἀρβάκτοις
  choice: de Arbactis
  rationale: Embora o grego tenha literalmente «em Arbactis», a coordenação com «da Galileia» e o movimento rumo à Judeia favorecem a expressão de procedência em português; a alternativa literal é registrada em nota.
- source_word: σὺν ταῖς γυναιξὶν καὶ τοῖς τέκνοις
  choice: com as mulheres e as crianças
  rationale: Preserva os substantivos explícitos do grego sem restringir «mulheres» ao sentido de esposas.
- source_word: πάντα ὅσα ἦν αὐτοῖς
  choice: tudo o que lhes pertencia
  rationale: Abrange bens e pertences sem limitar indevidamente o alcance da expressão.
- source_word: ἤγαγον
  choice: eles os conduziram
  rationale: Mantém a mudança transmitida do verbo singular para o plural. O objeto «os» fica naturalmente subentendido no grego, mas é explicitado em português para clareza.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: à Judeia
  rationale: Expressa de modo idiomático o movimento para dentro da região; «para a Judeia» também seria possível.
- source_word: μετʼ εὐφροσύνης μεγάλης
  choice: com grande alegria
  rationale: Comunica em português corrente e digno a alegria intensa e celebrativa da expressão grega.
