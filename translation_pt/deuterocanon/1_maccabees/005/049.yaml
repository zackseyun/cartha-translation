  text: And Judas gave orders to make proclamation in the camp that each should encamp in the place where he is.
translation:
  language: pt
  text: Então Judas ordenou que se anunciasse no acampamento que cada um acampasse no lugar onde estava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que cada um permanecesse acampado onde estava”. A expressão grega também pode ser entendida como uma ordem para que todos permanecessem em suas posições atuais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: ordenou
  rationale: Expressa de modo natural e direto a autoridade da instrução dada por Judas.
- source_word: κηρῦξαι
  choice: que se anunciasse
  rationale: Preserva a ideia de um anúncio público no acampamento, usando uma construção idiomática em português após “ordenou”.
- source_word: παρεμβολῇ
  choice: acampamento
  rationale: No contexto militar, o substantivo designa o acampamento.
- source_word: παρεμβαλεῖν
  choice: acampasse
  rationale: Mantém o sentido militar do verbo e a repetição etimológica perceptível entre “acampamento” e “acampasse”.
- source_word: ἕκαστον
  choice: cada um
  rationale: Conserva a força distributiva singular sem acrescentar uma referência masculina não explícita.
- source_word: ἐν ᾧ ἐστιν τόπῳ
  choice: no lugar onde estava
  rationale: Reproduz a expressão locativa e indica naturalmente a posição em que cada pessoa já se encontrava.
