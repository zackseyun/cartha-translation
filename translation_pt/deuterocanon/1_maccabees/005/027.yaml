  text: And in the other cities of Gilead they are shut in[a]; tomorrow they will encamp against the strongholds, capture them[c][b], and destroy all of them in a single day.
translation:
  language: pt
  text: E, nas outras cidades de Gileade, eles estão encurralados[a]. Amanhã, seus inimigos irão acampar contra as fortalezas, tomá-las e eliminar todos eles num só dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cercados” ou “confinados”. O grego descreve pessoas impedidas de sair e sob ameaça, sem exigir o sentido técnico de um cerco militar.
    reason: lexical_alternative
  - marker: b
    text: “Eliminar todos eles” também pode ser traduzido como “destruir todos eles”. No contexto militar, a expressão anuncia a remoção violenta e total das pessoas em questão, sem especificar o meio.
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπαῖς πόλεσιν
  choice: outras cidades
  rationale: No contexto, λοιπαῖς distingue essas cidades das já mencionadas; “outras cidades” é natural e mantém essa relação.
- source_word: τῆς Γαλααδίτιδος
  choice: de Gileade
  rationale: Forma geográfica consagrada e clara em português para a região designada pelo grego.
- source_word: συνειλημμένοι
  choice: estão encurralados
  rationale: O particípio perfeito passivo descreve uma condição resultante de confinamento sob ameaça. “Encurralados” comunica isso sem exigir a ideia técnica de um cerco formal.
- source_word: εἰς αὔριον
  choice: amanhã
  rationale: Equivalente temporal direto e idiomático.
- source_word: πάσονται
  choice: pretendem
  rationale: No contexto e conforme a leitura funcional refletida pela tradição de tradução fornecida, expressa intenção iminente; “pretendem” preserva o caráter planejado sem reduzi-lo a simples futuro.
- source_word: παρεμβαλεῖν ἐπὶ
  choice: acampar diante de
  rationale: Mantém a imagem militar de estabelecer acampamento contra um lugar, sem antecipar o resultado como “sitiar” ou “atacar”.
- source_word: τὰ ὀχυρώματα
  choice: as fortalezas
  rationale: ὀχυρώματα designa lugares fortificados; “fortalezas” é corrente, preciso e adequado ao contexto militar.
- source_word: καταλαβέσθαι
  choice: tomá-las
  rationale: No contexto militar, o verbo indica apoderar-se das fortalezas. “Tomá-las” é conciso e idiomático.
- source_word: ἐξᾶραι
  choice: exterminar
  rationale: Com pessoas como objeto e em uma sequência de conquista militar, o verbo tem força destrutiva. “Exterminar” comunica a eliminação total indicada pelo contexto.
- source_word: ἅπαντας αὐτοὺς
  choice: todos eles
  rationale: Preserva a totalidade enfática do grego.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: num só dia
  rationale: Expressão natural que conserva a ênfase na rapidez e concentração da ação.
