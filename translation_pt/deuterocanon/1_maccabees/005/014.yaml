lexical_decisions:
- source_word: Ἔτι ... ἀνεγινώσκοντο
  choice: Enquanto ... ainda estavam sendo lidas
  rationale: Reproduz o valor durativo do imperfeito passivo e apresenta a chegada dos mensageiros como simultânea à leitura em andamento.
- source_word: αἱ ἐπιστολαὶ
  choice: as cartas
  rationale: Equivalente direto, natural e adequado ao contexto narrativo.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a força de súbita atenção narrativa do grego em registro bíblico ainda compreensível.
- source_word: ἄγγελοι ἕτεροι
  choice: outros mensageiros
  rationale: No contexto, designa portadores humanos de notícias; 'outros' mantém a distinção indicada por ἕτεροι.
- source_word: παρεγένοντο ἐκ τῆς Γαλιλαίας
  choice: chegaram ... da Galileia
  rationale: Expressa de modo idiomático a entrada em cena e a procedência dos mensageiros.
- source_word: διερρηχότες τὰ ἱμάτια
  choice: com as vestes rasgadas
  rationale: O particípio perfeito retrata o estado em que chegaram; a formulação também conserva o gesto cultural de aflição ou alarme.
- source_word: ἀπαγγέλλοντες κατὰ τὰ ῥήματα ταῦτα
  choice: trazendo a seguinte notícia
  rationale: Expressa naturalmente a introdução do conteúdo da mensagem, sem sugerir que o versículo já cite literalmente as palavras pronunciadas.
theological_decisions:
- issue: Sentido de ἄγγελοι
  choice: mensageiros humanos
  alternative: anjos
  rationale: A procedência geográfica, as vestes rasgadas e a função de relatar notícias identificam pessoas enviadas, não seres celestiais.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. 'Eis que' conserva a vivacidade narrativa do original; 'vestes' mantém o tom histórico e solene sem tornar a frase obscura.
