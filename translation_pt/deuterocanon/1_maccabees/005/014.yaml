  text: 'While the letters were still being read[a], behold, other messengers arrived from Galilee with their garments torn, reporting these words:'
translation:
  language: pt
  text: 'Enquanto as cartas ainda estavam sendo lidas, eis que chegaram outros mensageiros da Galileia, com as vestes rasgadas, trazendo a seguinte notícia:'
