lexical_decisions:
- source_word: διέβησαν
  choice: atravessaram
  rationale: O aoristo de διαβαίνω, com o Jordão como objeto, descreve de modo natural a travessia de uma margem à outra.
- source_word: τὸν Ἰορδάνην
  choice: o Jordão
  rationale: O nome próprio com artigo refere-se ao rio Jordão; em português, a forma breve é natural e dispensa acrescentar «rio».
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: entrando na grande planície
  rationale: πεδίον designa uma planície ou região plana, e μέγα é preservado por «grande». O gerúndio explicita com naturalidade o movimento indicado por εἰς após a travessia.
- source_word: κατὰ πρόσωπον
  choice: diante de
  rationale: Na descrição geográfica, a expressão indica localização em frente de ou defronte a um lugar. «Diante de» mantém a formulação espacial sem exigir uma oposição topográfica mais precisa.
- source_word: Βαισάν
  choice: Baisã
  rationale: Translitera a forma grega Βαισάν segundo padrões naturais do português, incluindo o valor nasal da terminação, sem substituí-la pela forma hebraizada Bete-Seã.
