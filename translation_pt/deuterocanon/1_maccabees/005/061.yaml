  yaml_path: translation/deuterocanon/1_maccabees/005/061.yaml
  text: And there was a great rout among the people[a], because they had not listened to Judas and his brothers[b], thinking that they themselves would act bravely.
translation:
  language: pt
  text: E houve uma grande debandada entre o povo[a], porque não deram ouvidos a Judas e a seus irmãos, pensando que eles mesmos demonstrariam sua valentia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande derrota” ou “um grande pânico”; o termo grego indica o movimento de virar-se para fugir, daí “debandada”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pensando que eles mesmos agiriam com bravura” ou “se mostrariam valentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπή
  choice: debandada
  rationale: Em contexto militar, o termo indica a fuga desordenada após o colapso da força. “Debandada” exprime isso de modo natural em português, sem reduzi-lo a uma derrota genérica.
- source_word: λαός
  choice: o povo
  rationale: Mantém o referente amplo do grego; no contexto, trata-se da coletividade que participava do combate, sem especificá-la indevidamente como exército ou tropas.
- source_word: οὐκ ἤκουσαν
  choice: não deram ouvidos a
  rationale: Com o genitivo, ἀκούω expressa ouvir ou atender alguém. A formulação portuguesa preserva tanto a imagem auditiva quanto a ideia contextual de não seguir a orientação.
- source_word: Ἰούδα
  choice: Judas
  rationale: É a forma tradicional e reconhecível em português para o nome pessoal Ἰούδας no livro de 1 Macabeus.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: O contexto se refere aos irmãos de Judas; a tradução direta é clara e natural.
- source_word: οἰόμενοι
  choice: pensando
  rationale: O particípio apresenta a suposição que motivou sua conduta; “pensando” conserva essa relação sem torná-la mais enfática que o original.
- source_word: ἀνδραγαθῆσαι
  choice: demonstrariam sua valentia
  rationale: O verbo significa agir com bravura ou mostrar-se valente. Esta formulação moderna preserva a ideia de provar o próprio valor, evitando linguagem arcaica ou marcada por gênero.
- source_word: αὐτοί
  choice: eles mesmos
  rationale: 'Reproduz a ênfase do pronome: eles supunham que seriam capazes de demonstrar valor por si próprios.'
theological_decisions:
- issue: Força causal da explicação da debandada
  choice: A debandada ocorreu porque eles não deram ouvidos a Judas e a seus irmãos.
  alternative: Ler a oração apenas como explicação narrativa frouxa, sem causalidade marcada.
  rationale: ὅτι introduz naturalmente a razão da debandada. A tradução conserva esse juízo narrativo sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Deram ouvidos” é idiomático sem ser coloquial; “debandada” conserva a imagem militar do grego. Os marcadores [a] e [b] aparecem no texto principal.
