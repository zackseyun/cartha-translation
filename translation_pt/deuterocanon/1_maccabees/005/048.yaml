  text: And Judas sent them peaceful words[a], saying, “We will pass through your land to go to our own land, and no one will harm you; we will only pass through on foot.” But they were not willing to open to him.
translation:
  language: pt
  text: 'Judas lhes enviou palavras de paz, dizendo: “Passaremos pelo seu território para irmos à nossa terra. Ninguém lhes fará mal; apenas passaremos a pé.” Mas eles não quiseram abrir-lhe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, não quiseram permitir-lhe a entrada ou a passagem; no grego, o objeto de “abrir” fica implícito.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγους εἰρηνικούς
  choice: palavras de paz
  rationale: Expressão direta e natural em português, preservando o caráter pacífico e diplomático da mensagem.
- source_word: Διελευσόμεθα
  choice: Passaremos pelo
  rationale: O futuro de διέρχομαι indica trânsito pelo território; esta formulação é clara e idiomática.
- source_word: τοῦ ἀπελθεῖν εἰς τὴν γῆν ἡμῶν
  choice: para irmos à nossa terra
  rationale: Mantém a finalidade expressa pelo infinitivo articular sem acrescentar a ideia interpretativa de retorno.
- source_word: οὐδεὶς κακοποιήσει ὑμᾶς
  choice: Ninguém lhes fará mal
  rationale: Traduz κακοποιέω de modo conciso e adequado ao contexto militar e diplomático.
- source_word: πλὴν τοῖς ποσὶν παρελευσόμεθα
  choice: apenas passaremos a pé
  rationale: Preserva a imagem de passagem a pé e o sentido de mero trânsito, sem sugerir ação hostil.
- source_word: οὐκ ἠβούλοντο ἀνοῖξαι αὐτῷ
  choice: eles não quiseram abrir-lhe
  rationale: Conserva o objeto de 'abrir' implícito, como no grego, evitando decidir no texto se se trata da porta, da cidade ou da passagem.
