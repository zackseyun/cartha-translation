  yaml_path: translation/deuterocanon/1_maccabees/005/065.yaml
  text: And Judas and his brothers went out[a], and they fought the sons of Esau in the land to the south, and he struck Hebron and its daughter towns; he tore down its fortress[b], and he burned its towers all around.
translation:
  language: pt
  text: Judas e seus irmãos saíram e combateram os filhos de Esaú[a] na terra ao sul. Ele atacou Hebrom e os povoados que dependiam dela[b], derrubou sua fortaleza e incendiou suas torres por toda a volta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os edomitas”; literalmente, “os filhos de Esaú”.'
    reason: Indica a identificação étnica provável como alternativa, preservando a formulação genealógica literal do grego no texto.
  - marker: b
    text: Literalmente, “suas filhas”, expressão que designa povoados menores dependentes de uma cidade principal.
    reason: Explica o antigo modo de falar geográfico que não seria imediatamente claro em português.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saíram
  rationale: Traduz de modo direto o aoristo de ἐξέρχομαι, sem acrescentar a ideia específica de marcha militar.
- source_word: ἐπολέμουν
  choice: combateram
  rationale: Expressa com naturalidade a ação militar do imperfeito grego; o contexto permite perceber seu caráter continuado sem exigir uma construção perifrástica.
- source_word: τοὺς υἱοὺς Ἠσαῦ
  choice: os filhos de Esaú
  rationale: Conserva a expressão literal e sua ressonância bíblica, sem substituí-la silenciosamente pelo gentílico interpretativo “edomitas”.
- source_word: ἐν τῇ γῇ τῇ πρὸς νότον
  choice: na terra ao sul
  rationale: Segue de perto a expressão geográfica grega e evita identificar o local de maneira mais específica do que o texto permite.
- source_word: ἐπάταξεν
  choice: atacou
  rationale: No contexto militar, comunica de maneira natural o sentido amplo de golpear ou investir contra, sem afirmar necessariamente uma vitória completa.
- source_word: τὰς θυγατέρας αὐτῆς
  choice: os povoados que dependiam dela
  rationale: Torna inteligível o conhecido uso geográfico de “filhas” para assentamentos menores subordinados a uma cidade principal.
- source_word: καθεῖλεν τὸ ὀχύρωμα αὐτῆς
  choice: derrubou sua fortaleza
  rationale: Reproduz com clareza a destruição da estrutura defensiva de Hebrom.
- source_word: τοὺς πύργους αὐτῆς ἐνεπύρισεν κυκλόθεν
  choice: incendiou suas torres por toda a volta
  rationale: Preserva tanto o ato de pôr fogo nas torres quanto a noção espacial de κυκλόθεν, “ao redor” ou “por todos os lados”.
theological_decisions:
- issue: Gentílico ou expressão literal em τοὺς υἱοὺς Ἠσαῦ
  choice: os filhos de Esaú
  alternative: os edomitas; os descendentes de Esaú
  rationale: A forma literal mantém a linguagem genealógica do texto e sua ligação com a tradição bíblica sobre Esaú e Edom; a identificação é esclarecida em nota, sem ser imposta no corpo do versículo.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe narrativa clara. A repetição de “e” foi moderada para maior naturalidade, sem apagar a sequência rápida das ações. O singular de ἐπάταξεν foi representado por “Ele”, retomando Judas como líder, enquanto o combate anterior permanece no plural.
