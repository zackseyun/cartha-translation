  text: And Judas was gathering up those who were falling behind and encouraging the people all along the way[a], until he came into the land of Judah.
translation:
  language: pt
  text: Judas ia reunindo os que ficavam para trás[a] e encorajando o povo por todo o caminho, até chegar à terra de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os retardatários» ou «os que seguiam na retaguarda». O grego provavelmente se refere aos que se atrasavam durante a marcha.
    reason: Preserva a alternativa lexical de τοὺς ἐσχατίζοντας e posiciona a chamada junto ao termo a que a nota se refere.
lexical_decisions:
- source_word: ἐπισυνάγων
  choice: ia reunindo
  rationale: O particípio indica uma ação contínua durante a marcha. «Ia reunindo» expressa de modo natural que Judas juntava novamente os que se dispersavam ou se atrasavam.
- source_word: τοὺς ἐσχατίζοντας
  choice: os que ficavam para trás
  rationale: No contexto da viagem, o termo provavelmente designa os que seguiam no fim da coluna ou se atrasavam. A formulação preserva o caráter participial e evita tratá-los necessariamente como uma retaguarda militar formal.
- source_word: παρακαλῶν
  choice: encorajando
  rationale: O verbo pode significar exortar, animar ou consolar. Neste contexto de marcha, «encorajando» abrange o fortalecimento do ânimo sem restringir indevidamente o sentido.
- source_word: τὸν λαόν
  choice: o povo
  rationale: Mantém o sentido amplo do grego, sem substituir o termo por «exército» ou «tropas», embora o contexto envolva uma expedição militar.
- source_word: κατὰ πᾶσαν τὴν ὁδόν
  choice: por todo o caminho
  rationale: Expressa a continuidade da ação ao longo de todo o percurso em português corrente e digno.
- source_word: γῆν Ἰούδα
  choice: terra de Judá
  rationale: Segue de perto a expressão grega e preserva a ressonância geográfica e bíblica do nome Judá.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção «ia reunindo» comunica a duração da ação, e o texto conserva «povo» e «terra de Judá» em proximidade com o grego.
