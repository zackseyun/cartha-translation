  yaml_path: translation/deuterocanon/1_maccabees/005/030.yaml
  text: And when morning came, they lifted up their eyes, and behold, a great multitude, beyond number, carrying ladders and siege engines to capture the stronghold; and they were fighting them.
translation:
  language: pt
  text: Quando amanheceu, eles levantaram os olhos e viram uma multidão tão grande que não se podia contar[a], trazendo escadas e máquinas de cerco[b] para tomar a fortaleza; e combatiam contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que não tinha número» ou «numerosa demais para ser contada».'
    reason: lexical_alternative
  - marker: b
    text: O termo grego se refere a dispositivos ou engenhos usados no ataque a um lugar fortificado.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο ἑωθινή
  choice: Quando amanheceu
  rationale: Expressão temporal natural em português, preservando a transição narrativa do grego.
- source_word: ἦραν τοὺς ὀφθαλμοὺς αὐτῶν καὶ ἰδοὺ
  choice: eles levantaram os olhos e viram
  rationale: Mantém o idioma bíblico compreensível e transmite a força apresentativa de ἰδού sem recorrer ao mais arcaizante «eis».
- source_word: λαὸς πολὺς οὗ οὐκ ἦν ἀριθμός
  choice: uma multidão tão grande que não se podia contar
  rationale: Comunica de modo claro a grande quantidade e a expressão grega de incontabilidade.
- source_word: αἴροντες κλίμακας
  choice: trazendo escadas
  rationale: O particípio descreve o equipamento levado para o ataque; «trazendo» é natural e não especifica indevidamente o modo de transporte.
- source_word: μηχανὰς
  choice: máquinas de cerco
  rationale: No contexto militar, designa dispositivos empregados no assalto a uma posição fortificada.
- source_word: καταλαβεῖσθαι τὸ ὀχύρωμα
  choice: para tomar a fortaleza
  rationale: Preserva a finalidade do infinitivo e traduz ὀχύρωμα por um termo militar claro e corrente.
- source_word: ἐπολέμουν αὐτούς
  choice: combatiam contra eles
  rationale: O imperfeito indica ação em curso; a formulação preserva a referência pronominal do grego, embora o contexto deixe alguma ambiguidade quanto aos grupos referidos.
