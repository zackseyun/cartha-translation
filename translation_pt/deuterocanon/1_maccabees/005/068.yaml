base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/068.yaml
  text: And Judas turned aside into Azotus[a], the land of foreigners, and he tore down their altars, and burned the carved images of their gods with fire, and plundered the spoil of the cities[b], and returned to Judea.
translation:
  language: pt
  text: Judas desviou-se para Azoto[a], terra de estrangeiros, e derrubou os altares deles. Eles queimaram no fogo as imagens esculpidas de seus deuses[b], e ele tomou os despojos das cidades e voltou para a Judeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais específico no contexto histórico, “terra dos filisteus”. O grego diz mais literalmente “terra de estrangeiros”.
    reason: alternative_reading
  - marker: b
    text: O verbo grego está no plural (“eles queimaram”), embora os verbos ao redor estejam no singular. O sujeito pode ser Judas e seus homens, mas o texto não o especifica.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: desviou-se
  rationale: Expressa a mudança de direção indicada pelo verbo, sem acrescentar motivo ou finalidade.
- source_word: Ἄζωτον
  choice: Azoto
  rationale: Mantém em português a forma helenizada do topônimo presente no texto grego.
- source_word: γῆν ἀλλοφύλων
  choice: terra de estrangeiros
  rationale: Preserva o sentido lexical amplo de ἀλλόφυλοι; a identificação histórica mais específica com os filisteus fica em nota.
- source_word: καθεῖλεν τοὺς βωμοὺς
  choice: derrubou os altares
  rationale: Reproduz de modo concreto e natural a demolição dos altares.
- source_word: τὰ γλυπτὰ
  choice: as imagens esculpidas
  rationale: Conserva a referência material a representações entalhadas, sem substituir o termo pelo interpretativo 'ídolos'.
- source_word: κατέκαυσαν
  choice: eles queimaram no fogo
  rationale: Mantém o plural do verbo grego e a expressão enfática de queima, apesar da mudança abrupta de sujeito.
- source_word: ἐσκύλευσεν τὰ σκῦλα
  choice: tomou os despojos
  rationale: Evita em português a repetição cognata pouco natural e preserva o sentido militar de apropriar-se do espólio.
- source_word: ἐπέστρεψεν εἰς τὴν Ἰουδαίαν
  choice: voltou para a Judeia
  rationale: Forma corrente e clara para o retorno à região.
theological_decisions:
- issue: Designação étnica ἀλλόφυλοι em território historicamente filisteu
  choice: terra de estrangeiros
  alternative: terra dos filisteus
  rationale: O texto grego emprega uma designação ampla, embora no uso da Septuaginta ela possa indicar os filisteus. O texto principal preserva essa amplitude, e a nota registra a identificação histórica.
- issue: Mudança de número em κατέκαυσαν após verbos no singular
  choice: eles queimaram
  alternative: ele queimou
  rationale: O plural transmitido pelo grego é preservado, sem harmonização silenciosa; provavelmente inclui os homens de Judas, mas o texto não explicita o sujeito.
translation_notes:
  register: Português moderno, digno e acessível, com coordenação narrativa fluente. A mudança do singular para o plural em “eles queimaram” foi mantida por fidelidade ao texto grego; a nota foi colocada após “Azoto” para esclarecer a expressão imediatamente seguinte, seguindo a marcação fornecida.
