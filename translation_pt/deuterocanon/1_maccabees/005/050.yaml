  text: And the men of the city encamped, and they fought against the city all that day and all that night, and the city was delivered into his hands.
translation:
  language: pt
  text: Então os homens da cidade acamparam e combateram a cidade durante todo aquele dia e toda a noite; e a cidade foi entregue nas mãos dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “nas mãos dele”, no singular. Algumas traduções usam “nas mãos deles” para concordar com os sujeitos plurais anteriores, mas o texto grego aqui mantém o singular.
    reason: Leitura alternativa e mudança incomum de número no texto-fonte.
lexical_decisions:
- source_word: παρενέβαλον
  choice: acamparam
  rationale: Preserva o sentido militar concreto de montar acampamento ou tomar posição, sem ampliar o verbo para uma ação de ataque.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: os homens da cidade
  rationale: Traduz literalmente ἄνδρες como “homens” e mantém a relação genitiva “da cidade”, embora a sequência possa parecer difícil no contexto.
- source_word: ἐπολέμησαν τὴν πόλιν
  choice: combateram contra a cidade
  rationale: O verbo indica combate, e “contra” explicita em português a relação do verbo com seu objeto acusativo. A formulação preserva a tensão existente no grego entre “os homens da cidade” e “contra a cidade”.
- source_word: ὅλην τὴν ἡμέραν ἐκείνην καὶ ὅλην τὴν νύκτα
  choice: durante todo aquele dia e toda a noite
  rationale: Mantém a repetição enfática de ὅλην e apresenta a duração de modo natural em português.
- source_word: παρεδόθη
  choice: foi entregue
  rationale: Conserva a voz passiva e não introduz um agente que o texto grego deixa implícito.
- source_word: ἐν χερσὶν αὐτοῦ
  choice: nas mãos dele
  rationale: Mantém o pronome singular αὐτοῦ, apesar dos sujeitos plurais anteriores, sem harmonizá-lo indevidamente para o plural.
theological_decisions:
- issue: Mudança de número na oração final
  choice: manter o singular “nas mãos dele”
  alternative: “nas mãos deles” para concordar com os sujeitos plurais anteriores
  rationale: O testemunho grego traz αὐτοῦ no singular. A tradução preserva essa mudança, que pode apontar para um líder representativo, sem decidir explicitamente a identidade do referente.
- issue: Tensão entre “os homens da cidade” e “combateram contra a cidade”
  choice: preservar ambas as expressões conforme o texto grego
  alternative: omitir “contra a cidade” ou reinterpretar “os homens da cidade”
  rationale: Embora a frase pareça difícil ou contraditória, o texto-fonte apresentado contém claramente as duas expressões. Suavizá-las resolveria silenciosamente uma dificuldade textual ou contextual genuína.
translation_notes:
  register: 'Português moderno, claro e digno, com sintaxe narrativa corrente. “Acamparam” e “combateram” conservam o registro militar. A formulação deliberadamente não elimina as duas dificuldades do grego: os homens “da cidade” combatem “contra a cidade”, e o desfecho passa do plural para o singular.'
