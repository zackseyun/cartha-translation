lexical_decisions:
- source_word: προκατελάβε
  choice: conquistou
  rationale: No contexto militar, o verbo composto indica tomar posse de um lugar. “Conquistou” expressa isso com naturalidade, sem impor ao prefixo προ- um sentido temporal que não parece estar em destaque.
- source_word: Ἰαζὴρ
  choice: Jazer
  rationale: Forma tradicional e reconhecível do topônimo bíblico em português.
- source_word: θυγατέρας
  choice: os povoados que dependiam dela
  rationale: Literalmente “filhas”, mas, no uso geográfico, refere-se aos assentamentos menores subordinados a uma cidade principal. A formulação explicita a relação sem obscurecer o sentido.
- source_word: ἀπέστρεψεν
  choice: voltou
  rationale: Tradução corrente e concisa do sentido de retornar ou voltar atrás.
- source_word: Ἰουδαίαν
  choice: a Judeia
  rationale: Designa a região da Judeia no grego helenístico; evita confusão com o território tribal mais antigo de Judá.
