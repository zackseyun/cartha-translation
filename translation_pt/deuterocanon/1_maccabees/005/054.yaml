  yaml_path: translation/deuterocanon/1_maccabees/005/054.yaml
  text: And they went up to Mount Zion with gladness and joy[a], and they offered whole burnt offerings, because not one of them had fallen until they returned in peace.
translation:
  language: pt
  text: E subiram ao monte Sião com júbilo e alegria, e ofereceram ofertas queimadas por inteiro[a], pois nenhum deles havia caído até retornarem em paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “holocaustos”. O termo grego se refere a ofertas inteiramente consumidas pelo fogo no altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Preserva de modo natural o movimento de subida ao monte Sião.
- source_word: τὸ ὄρος Σιὼν
  choice: o monte Sião
  rationale: Forma geográfica consagrada e clara em português.
- source_word: ἐν εὐφροσύνῃ καὶ χαρᾷ
  choice: com júbilo e alegria
  rationale: Mantém os dois substantivos de sentido próximo e o tom de celebração.
- source_word: προσήγαγον
  choice: ofereceram
  rationale: No contexto sacrificial, expressa com clareza a apresentação das ofertas no culto.
- source_word: ὁλοκαυτώματα
  choice: ofertas queimadas por inteiro
  rationale: Explicita que as ofertas eram inteiramente consumidas pelo fogo e evita que o termo tradicional “holocaustos” seja mal compreendido pelo leitor moderno.
- source_word: οὐκ ἔπεσεν ἐξ αὐτῶν οὐθεὶς
  choice: nenhum deles havia caído
  rationale: Conserva a negação enfática e a metáfora militar de cair em combate.
- source_word: ἕως τοῦ ἐπιστρέψαι ἐν εἰρήνῃ
  choice: até retornarem em paz
  rationale: Reproduz o limite temporal e mantém a expressão ampla “em paz”, que também sugere retorno em segurança.
theological_decisions:
- issue: Terminologia cultual de ὁλοκαυτώματα
  choice: ofertas queimadas por inteiro
  alternative: holocaustos; ofertas queimadas
  rationale: A formulação preserva a especificidade do sacrifício totalmente consumido no altar sem depender de um termo que adquiriu fortes associações modernas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição semântica em “júbilo e alegria” e a expressão “em paz” foram preservadas por refletirem de perto o grego.
