  text: And he set out from there by night[a], and he kept going until he reached the stronghold.
translation:
  language: pt
  text: Ele partiu dali durante a noite e seguiu até a fortaleza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugar fortificado”. O termo grego pode designar, de modo mais geral, uma posição defensiva fortificada.
