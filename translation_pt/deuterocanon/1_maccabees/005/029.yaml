lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: O aoristo indica a saída daquele lugar; “partiu” é natural e conciso em português narrativo.
- source_word: ἐκεῖθεν
  choice: dali
  rationale: Expressa com clareza e naturalidade o ponto de partida.
- source_word: νυκτός
  choice: durante a noite
  rationale: O genitivo tem valor adverbial e indica que o deslocamento ocorreu à noite.
- source_word: ἐπορεύετο
  choice: seguiu
  rationale: O imperfeito descreve o movimento em curso; “seguiu” conserva a progressão narrativa sem tornar a frase pesada.
- source_word: ἕως ἐπὶ
  choice: até
  rationale: Marca o limite ou destino do percurso sem acrescentar um verbo explícito de chegada.
- source_word: ὀχύρωμα
  choice: fortaleza
  rationale: Designa uma posição ou um lugar fortificado; “fortaleza” preserva a nuance militar e é corrente em português.
