  text: And he commanded them[a], saying, “Take care of this people, and do not join battle with the nations until we return.”
translation:
  language: pt
  text: 'E deu-lhes esta ordem: “Cuidem deste povo[a] e não entrem em combate contra as nações até que voltemos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Zelem por este povo”. O imperativo grego pode indicar tanto cuidado protetor quanto atenção vigilante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο αὐτοῖς
  choice: deu-lhes esta ordem
  rationale: Expressa com naturalidade a força autoritativa do verbo médio ἐντέλλομαι, sem tornar a frase excessivamente rígida.
- source_word: Πρόσεχετε, τοῦ λαοῦ τούτου
  choice: Cuidem deste povo
  rationale: Com o genitivo, o imperativo indica atenção voltada ao povo, provavelmente em sentido protetor; “cuidem” preserva essa dimensão prática.
- source_word: τοῦ λαοῦ τούτου
  choice: deste povo
  rationale: Mantém o coletivo singular λαός e a referência demonstrativa próxima do grego.
- source_word: μὴ συνάψητε πόλεμον
  choice: não entrem em combate
  rationale: Reproduz o idioma militar que significa iniciar ou travar confronto, sem afirmar necessariamente uma guerra prolongada.
- source_word: πρὸς τὰ ἔθνη
  choice: contra as nações
  rationale: “Nações” é transparente e preserva a referência aos povos não judeus circundantes sem impor a terminologia neotestamentária “gentios”.
- source_word: ἕως τοῦ ἐπιστρέψαι ἡμᾶς
  choice: até que voltemos
  rationale: Traduz naturalmente o limite temporal expresso por ἕως com infinitivo articular.
