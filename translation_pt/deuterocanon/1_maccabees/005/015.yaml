  text: saying[a], “A gathering has been assembled against them from Ptolemais and Tyre and Sidon and all Galilee of the foreigners, to wipe us out.”
translation:
  language: pt
  text: 'dizendo: “Uma força foi reunida contra eles, vinda de Ptolemaida, de Tiro, de Sidom e de toda a Galileia dos estrangeiros,[a] para nos exterminar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de toda a Galileia dos gentios”. O grego diz literalmente “de toda a Galileia dos estrangeiros”, usando um termo que designa pessoas de outro povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπισυνήχθη
  choice: Uma força foi reunida
  rationale: O aoristo passivo de ἐπισυνάγω é mantido por “foi reunida”. “Força” explicita com naturalidade o sujeito coletivo implícito no contexto militar, sem especificá-lo como exército.
- source_word: ἐπʼ αὐτούς
  choice: contra eles
  rationale: ἐπί com acusativo indica aqui direção hostil; “contra eles” é natural e não acrescenta uma ação específica.
- source_word: ἐκ Πτολεμαΐδος καὶ Τύρου καὶ Σιδῶνος καὶ πάσης Γαλιλαίας ἀλλοφύλων
  choice: vinda de Ptolemaida, de Tiro, de Sidom e de toda a Galileia dos estrangeiros
  rationale: A origem da força é expressa de modo claro, e o genitivo ἀλλοφύλων é preservado como qualificação de Galileia. Os topônimos seguem formas portuguesas correntes.
- source_word: ἀλλοφύλων
  choice: estrangeiros
  rationale: O termo designa pessoas de outro povo. “Estrangeiros” preserva o sentido étnico-político imediato sem impor uma categoria teológica; “gentios” permanece em nota como alternativa tradicional plausível.
- source_word: τοῦ ἐξαναλῶσαι
  choice: para nos exterminar
  rationale: O infinitivo articular expressa finalidade, e o verbo comunica destruição completa. “Exterminar” é forte, claro e digno em português.
- source_word: ἡμᾶς
  choice: nos
  rationale: Mantém-se a primeira pessoa do plural e, portanto, a mudança deliberada de “eles” para “nós” presente no discurso grego.
theological_decisions:
- issue: Tradução de ἀλλόφυλοι no contexto histórico-militar de 1 Macabeus
  choice: estrangeiros
  alternative: gentios
  rationale: Neste contexto, o termo funciona principalmente como designação étnica e política. “Estrangeiros” representa esse sentido imediato, enquanto “gentios” é registrado na nota por ser uma tradução tradicional possível.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A voz passiva e a mudança de “eles” para “nos” foram preservadas; a construção foi levemente ajustada para soar natural em português.
