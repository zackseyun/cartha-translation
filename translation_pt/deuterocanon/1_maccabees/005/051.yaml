  yaml_path: translation/deuterocanon/1_maccabees/005/051.yaml
  text: And he destroyed every male with the edge of the sword[a], and uprooted it, and took the plunder of the city[b], and passed through the city over the slain.
translation:
  language: pt
  text: E ele matou todos os homens ao fio da espada[a], arrancou a cidade pela raiz[b], tomou os despojos dela e atravessou a cidade por cima dos mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «pela boca da espada», expressão que significa «ao fio da espada».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «arrancou-a pela raiz»; o verbo preserva a imagem de desenraizar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: matou
  rationale: No contexto militar, o aoristo de ἀπόλλυμι indica causar a morte ou destruição. Como o objeto é πᾶν ἀρσενικόν e o meio é a espada, «matou» expressa com clareza o sentido contextual sem suavizar a violência.
- source_word: πᾶν ἀρσενικόν
  choice: todos os homens
  rationale: A expressão abrange os seres humanos do sexo masculino. Em português corrente, «todos os homens» é natural e mantém o alcance explícito e específico do grego.
- source_word: ἐν στόματι ῥομφαίας
  choice: ao fio da espada
  rationale: Equivalente idiomático português da expressão literalmente «pela boca da espada», preservando a imagem do instrumento cortante.
- source_word: ἐξερρίζωσεν αὐτήν
  choice: arrasou a cidade pela raiz
  rationale: O verbo significa arrancar pela raiz. A formulação conserva a metáfora e explicita o referente feminino αὐτήν, a cidade, evitando em português uma referência pronominal pouco clara.
- source_word: τὰ σκῦλα τῆς πόλεως
  choice: os despojos dela
  rationale: σκῦλα designa bens tomados na guerra. «Despojos» é corrente no registro histórico-bíblico e «dela» evita a repetição pesada de «da cidade».
- source_word: διῆλθεν διὰ τῆς πόλεως
  choice: atravessou a cidade
  rationale: Reproduz de modo natural o movimento de passar através dela, sem acrescentar a ideia não expressa de marchar.
- source_word: ἐπάνω τῶν ἀπεκταμμένων
  choice: por cima dos mortos
  rationale: O particípio substantivado se refere aos que haviam sido mortos. «Os mortos» é direto e mantém a imagem severa do texto.
theological_decisions:
- issue: Linguagem de violência e extensão da destruição
  choice: Manter explicitamente a morte de todos os homens, a ação da espada, a devastação da cidade e a passagem sobre os mortos.
  alternative: Suavizar com termos como «derrotou», «conquistou» ou tratar a erradicação como figura vaga.
  rationale: O grego descreve a violência militar de maneira explícita. A tradução não deve atenuar sua brutalidade nem impor uma avaliação teológica ausente do versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A coordenação repetida do grego foi preservada em sequência narrativa natural. «Ao fio da espada» e «despojos» mantêm um registro histórico-bíblico inteligível, enquanto «por cima dos mortos» conserva sem eufemismo a força visual do original.
