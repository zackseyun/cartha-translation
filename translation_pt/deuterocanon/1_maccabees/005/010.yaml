  text: And they sent letters to Judas and his brothers[a], saying, “The nations around us have gathered together against us to destroy us,”
translation:
  language: pt
  text: 'E enviaram cartas a Judas e aos irmãos dele, dizendo: “As nações ao nosso redor se reuniram contra nós para nos destruir[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos exterminar”. O verbo grego pode expressar a ideia de remover ou eliminar completamente; no contexto, trata-se da destruição do grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλαν γράμματα
  choice: enviaram cartas
  rationale: Expressa de modo direto e natural o envio de comunicações escritas.
- source_word: Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ
  choice: a Judas e aos irmãos dele
  rationale: Mantém a referência específica a Judas e a seus irmãos, homens que atuam com ele na narrativa.
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: se reuniram
  rationale: Transmite em português corrente o estado presente resultante da reunião, expresso pela construção perfeita perifrástica grega.
- source_word: τὰ ἔθνη τὰ κύκλῳ ἡμῶν
  choice: as nações ao nosso redor
  rationale: Preserva o sentido étnico-político e geográfico sem introduzir as conotações teológicas posteriores de “gentios”.
- source_word: τοῦ ἐξᾶραι ἡμᾶς
  choice: para nos destruir
  rationale: O infinitivo indica propósito hostil; “destruir” conserva registro digno e corresponde ao sentido contextual de eliminação.
theological_decisions:
- issue: Sentido de ἔθνη no contexto histórico deuterocanônico
  choice: as nações
  alternative: os gentios; os povos
  rationale: Aqui o termo designa os povos não judeus vizinhos em sentido étnico-político, não uma categoria teológica desenvolvida.
- issue: Referência de ἀδελφοί
  choice: irmãos
  alternative: parentes; irmãos e irmãs
  rationale: A narrativa se refere aos irmãos homens de Judas, seus colaboradores e líderes; uma expansão inclusiva não é exigida pelo grego.
- issue: Força de ἐξᾶραι
  choice: destruir
  alternative: exterminar; eliminar
  rationale: “Destruir” mantém proximidade formal e registro bíblico natural, enquanto a nota registra a possibilidade de explicitar a ideia de eliminação total.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e as relações sintáticas do grego foram preservadas sempre que naturais em português.
