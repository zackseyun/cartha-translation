  yaml_path: translation/deuterocanon/1_maccabees/005/022.yaml
  text: And he pursued them as far as the cities of Ptolemais[a]; and about three thousand men from the nations fell[b], and he took their spoils.
translation:
  language: pt
  text: Ele os perseguiu até as cidades de Ptolemaida; caíram cerca de três mil homens dentre as nações[b], e ele tomou os despojos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «Dentre as nações» refere-se aos povos não israelitas das forças adversárias; outras traduções dizem «dos gentios».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξεν
  choice: perseguiu
  rationale: Verbo militar direto que expressa a continuação da perseguição a uma força em retirada.
- source_word: ἕως τῶν πόλεων Πτολεμαΐδος
  choice: até as cidades de Ptolemaida
  rationale: Preserva tanto a extensão marcada por ἕως com genitivo quanto o plural explícito πόλεων, sem reduzir a expressão apenas ao nome da cidade.
- source_word: ἔπεσον
  choice: caíram
  rationale: Mantém o idiomatismo militar do grego, no sentido de cair em combate, sem explicitar além do texto 'foram mortos'.
- source_word: ἐκ τῶν ἐθνῶν
  choice: dentre as nações
  rationale: Indica homens pertencentes aos povos não israelitas das forças adversárias, evitando restringir a expressão a uma terminologia teológica posterior.
- source_word: εἰς τρισχιλίους ἄνδρας
  choice: cerca de três mil homens
  rationale: Com numeral, εἰς pode indicar total e admitir nuance aproximativa; a formulação é natural em português e preserva essa possível nuance.
- source_word: τὰ σκῦλα αὐτῶν
  choice: os despojos deles
  rationale: Designa o espólio tomado após a batalha e preserva o referente possessivo de αὐτῶν.
theological_decisions:
- issue: Sentido de ἐκ τῶν ἐθνῶν
  choice: dentre as nações
  alternative: dos gentios
  rationale: A escolha conserva o sentido étnico amplo de povos não israelitas sem importar conotações confessionais ou neotestamentárias desnecessárias.
translation_notes:
  register: Português atual, digno e narrativamente fluente, com ampla legibilidade brasileira. Conservam-se o plural incomum “cidades de Ptolemaida”, o verbo militar “caíram” e a possível aproximação do numeral.
