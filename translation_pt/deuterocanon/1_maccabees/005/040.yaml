base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/040.yaml
  text: And Timotheus said to the commanders of his forces[a], when Judas and his camp were drawing near to the wadi, “If he crosses over to us first, we will not be able to withstand him[b], because he will surely prevail against us.”
translation:
  language: pt
  text: 'E Timóteo disse aos comandantes de suas forças, quando Judas e seu acampamento se aproximavam do curso de água[a]: “Se ele atravessar primeiro para o nosso lado, não poderemos resistir-lhe, pois será forte demais para nós[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “torrente de água”. A expressão provavelmente se refere ao leito de uma torrente ou a um curso de água sazonal.
    reason: cultural_note
  - marker: b
    text: Ou, mais literalmente, “será capaz contra nós”. No contexto, o sentido é que Judas seria forte demais para eles ou os venceria.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρχουσιν τῆς δυνάμεως αὐτοῦ
  choice: comandantes de suas forças
  rationale: No contexto militar, ἄρχοντες designa os que exercem autoridade sobre a força armada; a expressão evita especificar uma estrutura militar não indicada pelo grego.
- source_word: ἐν τῷ ἐγγίζειν
  choice: quando ... se aproximavam
  rationale: O infinitivo articular com ἐν exprime simultaneidade temporal; esta formulação é natural em português e conserva o aspecto progressivo da aproximação.
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: O termo pode indicar o acampamento ou a força acampada; “acampamento” preserva a imagem concreta sem excluir por completo o grupo ali reunido.
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: curso de água
  rationale: A expressão designa um leito de torrente ou curso sazonal. “Curso de água” é claro em português internacional e evita tanto “rio”, excessivamente específico, quanto o empréstimo regionalmente menos conhecido “wadi”.
- source_word: διαβῇ πρὸς ἡμᾶς πρότερος
  choice: atravessar primeiro para o nosso lado
  rationale: Explicita naturalmente a travessia rumo à posição de Timóteo, conservando πρότερος como prioridade temporal.
- source_word: ὑποστῆναι αὐτόν
  choice: resistir-lhe
  rationale: No contexto de batalha, o verbo significa manter-se firme diante de um adversário ou resistir a ele.
- source_word: δυνήσεται πρὸς ἡμᾶς
  choice: será forte demais para nós
  rationale: O grego é comprimido, literalmente algo como “será capaz contra nós”. A tradução comunica a superioridade militar sem acrescentar a ideia enfática de certeza que não está lexicalmente expressa.
- source_word: Τιμόθεος
  choice: Timóteo
  rationale: Forma portuguesa tradicional e natural do nome grego.
- source_word: Ἰούδαν
  choice: Judas
  rationale: Forma portuguesa convencional do nome de Judas Macabeu.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase segue de perto o grego, mas emprega construções naturais. “Curso de água” comunica o terreno sem depender do termo estrangeiro “wadi”; as notas preservam a forma mais literal e a compressão ambígua da oração final.
