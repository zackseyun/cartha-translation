  yaml_path: translation/deuterocanon/1_maccabees/005/031.yaml
  text: And Judas saw that the battle had begun[a], and the outcry of the city went up to heaven with trumpet blasts and a great cry.
translation:
  language: pt
  text: E Judas viu que a batalha havia começado, e o clamor da cidade subiu até o céu, com toques de trombetas e um grande grito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao som de trombetas e de um forte grito”. Os dativos gregos podem indicar mais diretamente o meio ou, de modo mais geral, os sons que acompanhavam o clamor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρκται
  choice: havia começado
  rationale: O perfeito médio/passivo de ἄρχω indica que a batalha já tinha começado quando Judas percebeu isso; o mais-que-perfeito composto expressa naturalmente essa sequência narrativa em português.
- source_word: ὁ πόλεμος
  choice: a batalha
  rationale: Embora πόλεμος também possa significar “guerra”, aqui designa o confronto específico já em curso.
- source_word: ἡ κραυγὴ τῆς πόλεως
  choice: o clamor da cidade
  rationale: κραυγή denota um brado ou clamor intenso; o genitivo associa o clamor à cidade, isto é, aos que estavam dentro dela.
- source_word: ἀνέβη ἕως οὐρανοῦ
  choice: subiu até o céu
  rationale: Preserva de modo natural a imagem vertical e o limite expresso por ἕως.
- source_word: σάλπιγξιν
  choice: com toques de trombeta
  rationale: O dativo plural pode indicar acompanhamento ou meio; “toques” explicita de maneira idiomática o som dos instrumentos no contexto militar.
- source_word: κραυγῇ μεγάλῃ
  choice: e um grande grito
  rationale: Mantém o singular e a intensidade de μεγάλη, além de conservar a distinção em relação ao “clamor da cidade” anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. A repetição entre “clamor” e “grito” foi mantida porque corresponde a duas ocorrências distintas de κραυγή no grego. O marcador da nota foi colocado junto à expressão cuja ambiguidade explica.
