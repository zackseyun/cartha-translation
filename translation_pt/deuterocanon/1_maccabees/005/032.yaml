  text: And he said to the men of the force[b][a], “Fight today for our brothers.”
translation:
  language: pt
  text: 'E ele disse aos homens da tropa[a]: “Lutem hoje por nossos irmãos[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos soldados” ou “aos guerreiros”; literalmente, “aos homens da força”.
    reason: lexical_alternative
  - marker: b
    text: “Nossos irmãos” pode referir-se de modo amplo aos demais israelitas, e não apenas a irmãos biológicos.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀνδράσιν τῆς δυνάμεως
  choice: aos homens da tropa
  rationale: Preserva a referência explícita aos homens que compõem o contingente militar; “tropa” expressa de modo natural o sentido militar de δύναμις sem exigir a ideia mais institucional de “exército”.
- source_word: Πολεμήσατε
  choice: Lutem
  rationale: O imperativo aoristo pede ação marcial imediata; “Lutem” é direto, atual e idiomático em português.
- source_word: σήμερον
  choice: hoje
  rationale: Mantém a referência temporal e a urgência do momento.
- source_word: ὑπὲρ
  choice: por
  rationale: Expressa de forma concisa agir em favor ou em defesa de alguém, preservando a amplitude da preposição no contexto.
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: nossos irmãos
  rationale: Mantém o substantivo masculino plural do grego e a linguagem de solidariedade do grupo, sem decidir no texto principal se se trata de irmãos biológicos ou de compatriotas israelitas.
theological_decisions:
- issue: Alcance da linguagem de parentesco em τῶν ἀδελφῶν ἡμῶν
  choice: nossos irmãos
  alternative: nossos compatriotas / nossos irmãos e irmãs
  rationale: O grego emprega o masculino plural ἀδελφῶν. A tradução conserva a forma do texto e deixa em nota a possibilidade de referência ampla aos companheiros israelitas, evitando tanto restringi-la ao parentesco biológico quanto explicitar uma inclusão que o grego não formula diretamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Homens da tropa” mantém a formulação masculina e o caráter militar do grego; “Lutem hoje” reproduz a concisão e a urgência da exortação.
