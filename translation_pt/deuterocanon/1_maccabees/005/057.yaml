translation:
  language: pt
  text: 'E disseram: “Também nós conquistemos renome[a] e vamos lutar contra as nações ao nosso redor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “façamos também para nós mesmos um nome”. Ou “conquistemos fama para nós mesmos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os gentios ao nosso redor”. O termo grego pode designar os povos não judeus vizinhos.
    reason: alternative_reading
lexical_decisions:
- source_word: Ποιήσωμεν ... ὄνομα
  choice: Façamos ... um nome
  rationale: Preserva a expressão idiomática grega e sua ressonância bíblica; a nota esclarece o sentido de alcançar fama ou renome.
- source_word: καὶ αὐτοὶ
  choice: também
  rationale: Expressa de modo natural a ideia de que eles próprios queriam realizar feito semelhante.
- source_word: ἑαυτοῖς
  choice: para nós mesmos
  rationale: Na fala direta, o reflexivo tem sentido de primeira pessoa e reforça que buscavam renome para si.
- source_word: πορευθῶμεν
  choice: vamos
  rationale: Verbo de movimento em construção exortativa; “vamos” é corrente em português e não acrescenta a ideia específica de marchar.
- source_word: πολεμῆσαι
  choice: lutar contra
  rationale: Transmite diretamente a ação militar e se combina naturalmente com o complemento introduzido por πρός.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Mantém o sentido amplo do termo grego sem explicitar no texto principal que se trata de povos não judeus.
- source_word: τὰ κύκλῳ ἡμῶν
  choice: ao nosso redor
  rationale: Representa de maneira concisa e idiomática a localização dos povos circundantes.
theological_decisions:
- issue: Sentido idiomático de ποιεῖν ὄνομα
  choice: Façamos também um nome para nós mesmos
  alternative: Conquistemos também renome
  rationale: A formulação escolhida conserva a imagem e a ressonância bíblica do original, enquanto a nota oferece o sentido idiomático em português mais direto.
- issue: Sentido de τὰ ἔθνη
  choice: as nações
  alternative: os gentios
  rationale: O contexto é histórico e militar. “As nações” permanece próximo do grego e deixa que o contexto indique os povos estrangeiros vizinhos, sem impor terminologia teológica posterior.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “façamos um nome para nós mesmos” é deliberadamente próxima do idioma bíblico grego; a nota fornece a equivalência portuguesa mais natural.
