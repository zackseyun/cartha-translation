lexical_decisions:
- source_word: ἐπισυνήγοντο
  choice: ajuntavam-se
  rationale: O imperfeito médio/passivo de ἐπισυνάγω indica uma ação contínua ou repetida de pessoas que se reuniam ou se dirigiam para junto do grupo; “ajuntavam-se” preserva esse aspecto e é natural em narrativa bíblica moderna.
- source_word: πρὸς αὐτούς
  choice: a eles
  rationale: πρός com acusativo expressa aqui movimento em direção a pessoas. “A eles” mantém o valor direcional sem transformar a expressão em mera associação estática.
- source_word: εὐφημοῦντες
  choice: falando bem deles
  rationale: O particípio de εὐφημέω comunica fala favorável ou aprovadora. “Falando bem deles” explicita naturalmente em português o referente implícito, sem impor o tom mais formal ou público de “aclamando-os”.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. O imperfeito foi mantido para comunicar a ação em andamento ou repetida. A formulação conserva a direção de πρὸς e deixa na nota as possíveis nuances mais enfáticas de εὐφημέω.
