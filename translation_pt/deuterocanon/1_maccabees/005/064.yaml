  text: E reuniam-se a eles, falando bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “elogiando-os” ou “aclamando-os”. O particípio grego εὐφημοῦντες expressa fala favorável ou aprovadora; o objeto não é expresso no grego.
