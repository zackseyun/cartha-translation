  text: E os da cidade os cercaram e bloquearam os portões com pedras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκλεισαν αὐτούς
  choice: os mantiveram do lado de fora
  rationale: O verbo ἀποκλείω, neste contexto de uma cidade cujos portões são obstruídos, indica impedir a entrada ou deixar alguém do lado de fora. A formulação comunica isso de modo natural em português, sem sugerir que o grupo foi aprisionado dentro da cidade.
- source_word: οἱ ἐκ τῆς πόλεως
  choice: os habitantes da cidade
  rationale: A expressão significa literalmente «os da cidade». «Os habitantes da cidade» é inclusivo, natural e não acrescenta ao grego uma especificação masculina.
- source_word: ἐνέφραξαν
  choice: bloquearam
  rationale: O verbo descreve fechar ou obstruir fisicamente; «bloquearam» combina com o uso de pedras e distingue esta ação da recusa de entrada expressa na oração anterior.
- source_word: τὰς πύλας
  choice: os portões
  rationale: Mantém o plural do grego e designa com clareza os grandes portões da cidade.
- source_word: λίθοις
  choice: com pedras
  rationale: Reproduz de maneira direta o dativo instrumental, indicando o material empregado para bloquear os portões.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A tradução segue o sentido contextual de exclusão expresso por ἀποκλείω e evita a leitura menos provável de que o grupo tenha sido encerrado dentro da cidade.
