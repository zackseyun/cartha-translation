base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/016.yaml
  text: When Judas and the people heard these words[b][a], a great assembly gathered to consider what they should do for their brothers who were in distress and being attacked by them.
translation:
  language: pt
  text: Quando Judas e o povo ouviram essas palavras[a], reuniu-se uma grande assembleia para deliberar sobre o que deveriam fazer pelos seus irmãos[b], que estavam em aflição e sob ataque deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esses relatos” ou “essas coisas”; literalmente, “essas palavras”.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” refere-se aqui aos demais membros do povo judeu que estavam sendo oprimidos.
    reason: cultural_note
  - marker: c
    text: Isto é, ao que tudo indica, sob ataque dos povos hostis mencionados nos relatos anteriores. O grego diz apenas “deles”.
    reason: referent_ambiguity
lexical_decisions:
- source_word: Ὡς δὲ ἤκουσεν
  choice: Quando ... ouviram
  rationale: A construção introduz uma oração temporal. O plural em português concorda naturalmente com o sujeito composto, Judas e o povo, embora o grego empregue o verbo no singular.
- source_word: Ἰούδας
  choice: Judas
  rationale: Segue a forma tradicional do nome nesta obra e corresponde diretamente ao grego Ἰούδας.
- source_word: ὁ λαός
  choice: o povo
  rationale: Designa coletivamente o povo judeu ligado a Judas, sem restringir o referente ao exército.
- source_word: τοὺς λόγους τούτους
  choice: essas palavras
  rationale: Preserva a forma lexical do grego; no contexto, pode também significar a mensagem ou os relatos que acabavam de ser transmitidos.
- source_word: ἐπισυνήχθη ἐκκλησία μεγάλη
  choice: reuniu-se uma grande assembleia
  rationale: Expressa com naturalidade a reunião de um grande corpo deliberativo e evita a conotação cristã posterior que 'igreja' teria neste contexto judaico pré-cristão.
- source_word: βουλεύσασθαι τί ποιήσωσιν
  choice: para deliberar sobre o que deveriam fazer
  rationale: Conserva tanto a finalidade da reunião quanto o caráter consultivo e deliberativo da pergunta.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: pelos seus irmãos
  rationale: Mantém o termo masculino de parentesco do grego; aqui ele tem sentido comunitário e se refere aos demais membros do povo judeu.
- source_word: τοῖς οὖσιν ἐν θλίψει
  choice: que estavam em aflição
  rationale: Representa a pressão, o sofrimento e a situação grave expressos por θλίψις, em linguagem portuguesa clara e digna.
- source_word: πολεμουμένοις ὑπʼ αὐτῶν
  choice: sob ataque deles
  rationale: Transmite de modo idiomático a ação militar hostil do particípio passivo e conserva o pronome grego, cuja referência depende do contexto.
theological_decisions:
- issue: Sentido de ἐκκλησία no contexto histórico judaico
  choice: assembleia
  alternative: congregação; reunião; igreja
  rationale: Aqui o termo indica uma assembleia pública convocada para deliberar, não a instituição cristã posteriormente chamada de igreja.
- issue: Alcance comunitário de ἀδελφοῖς
  choice: irmãos
  alternative: parentes; compatriotas; irmãos e irmãs
  rationale: A tradução retém a forma masculina do texto e esclarece em nota que se trata dos outros membros do povo judeu, sem neutralizar ou ampliar silenciosamente a expressão.
- issue: Referente de ὑπʼ αὐτῶν
  choice: deles
  alternative: dos inimigos; dos povos hostis
  rationale: O pronome é mantido para não explicitar no corpo do texto um antecedente que o versículo não nomeia; o contexto aponta para os povos hostis mencionados nos relatos anteriores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e o caráter formal da deliberação foram preservados sem arcaísmos; as ambiguidades de λόγοι e do pronome αὐτῶν foram mantidas ou registradas em nota.
