  yaml_path: translation/deuterocanon/1_maccabees/005/042.yaml
  text: And when Judas came near to the wadi[a], he stationed the scribes of the people at the wadi and commanded them, saying, “Do not let anyone camp[b], but let them all come into the battle.”
translation:
  language: pt
  text: 'Quando Judas se aproximou da torrente[a], posicionou os escribas do povo[b] junto à torrente e lhes ordenou: “Não deixem ninguém acampar, mas que todos venham para a batalha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “córrego”, “leito de riacho” ou “uádi”. O termo grego pode designar um curso de água sazonal ou seu leito.
    reason: lexical_alternative
  - marker: b
    text: “Escribas do povo” pode designar oficiais administrativos ou responsáveis pelos registros a serviço do exército; a tradução preserva o termo literal “escribas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισεν
  choice: se aproximou
  rationale: Expressa de modo natural e preciso o movimento de aproximação indicado pelo verbo grego.
- source_word: χειμάρρουν τοῦ ὕδατος
  choice: torrente
  rationale: χειμάρρους designa uma corrente de água, muitas vezes sazonal, ou seu leito. “Torrente” mantém a imagem geográfica sem o pleonasmo pouco natural “torrente de água”.
- source_word: ἔστησεν
  choice: posicionou
  rationale: No contexto militar, comunica que Judas colocou essas pessoas em um ponto determinado para desempenhar uma função.
- source_word: γραμματεῖς τοῦ λαοῦ
  choice: os escribas do povo
  rationale: Preserva o termo lexical grego e evita definir como oficiais ou secretários uma função administrativa cuja natureza exata não está explicitada.
- source_word: ἐπὶ τοῦ χειμάρρου
  choice: junto à torrente
  rationale: ἐπί com genitivo indica aqui posição junto ao curso ou leito de água.
- source_word: Μὴ ἀφῆτε ἄνθρωπον παρεμβαλεῖν
  choice: Não deixem ninguém montar acampamento
  rationale: Reproduz a proibição de permitir que qualquer pessoa acampe; “ninguém” é idiomático em português e abrange o singular genérico ἄνθρωπον.
- source_word: ἀλλὰ ἐρχέσθωσαν πάντες εἰς τὸν πόλεμον
  choice: mas que todos venham para a batalha
  rationale: Mantém o imperativo dirigido à participação de todos e o movimento expresso por ἐρχέσθωσαν.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. “Torrente” foi preferido a “uádi” no texto principal por ser mais amplamente compreensível; a alternativa geográfica aparece na nota. O marcador [b] foi colocado junto a “escribas do povo”, expressão explicada pela respectiva nota.
