  yaml_path: translation/deuterocanon/1_maccabees/005/067.yaml
  text: On that day priests fell in battle[a], because they wanted to act bravely[b], when they went out into battle without counsel.
translation:
  language: pt
  text: Naquele dia, sacerdotes tombaram em combate porque ele[a] queria demonstrar valentia, quando eles saíram para a batalha sem deliberação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz literalmente “porque ele queria demonstrar valentia”. O referente de “ele” não é identificado neste versículo; algumas versões entendem a ação como sendo dos sacerdotes: “porque eles queriam demonstrar valentia”. Também se pode traduzir “realizar um feito heroico”.'
    reason: ambiguity
  - marker: b
    text: Ou “sem ponderar”, “sem se aconselhar” ou “de modo precipitado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: tombaram
  rationale: Expressa idiomaticamente a morte em combate e preserva o tom marcial do grego.
- source_word: ἱερεῖς
  choice: sacerdotes
  rationale: O plural sem artigo descreve membros da classe sacerdotal, sem exigir artigo definido em português.
- source_word: πολέμῳ
  choice: em combate
  rationale: Traduz de modo natural o dativo de esfera ou circunstância em que os sacerdotes tombaram.
- source_word: βουλομένου αὐτοῦ
  choice: porque ele queria
  rationale: Mantém o pronome e o particípio no singular conforme o texto grego fornecido e expressa a provável nuance causal do genitivo absoluto, sem identificar seu referente.
- source_word: ἀνδραγαθῆσαι
  choice: demonstrar valentia
  rationale: Comunica a ideia de evidenciar coragem ou realizar um feito valoroso, evitando uma expressão de gênero pouco natural no português atual.
- source_word: ἐν τῷ αὐτοὺς ἐξελθεῖν
  choice: quando eles saíram
  rationale: Representa naturalmente o infinitivo articular com sujeito acusativo em sua função temporal.
- source_word: εἰς τὸν πόλεμον
  choice: para a batalha
  rationale: Indica a entrada numa ação militar concreta e soa idiomático em português.
- source_word: ἀβουλεύτως
  choice: sem ponderar
  rationale: Preserva a noção de agir sem deliberação, evitando decidir se faltou reflexão pessoal ou consulta a outros.
theological_decisions:
- issue: Referente de αὐτοῦ em βουλομένου αὐτοῦ ἀνδραγαθῆσαι
  choice: Mantido como o singular “ele”, com o antecedente não especificado.
  alternative: Entender a ação como pertencente aos sacerdotes e traduzir “porque eles queriam demonstrar valentia”.
  rationale: O texto grego fornecido apresenta explicitamente formas genitivas singulares. A tradução não corrige silenciosamente essa dificuldade para harmonizá-la com o sujeito plural da oração seguinte.
- issue: Relação lógica do genitivo absoluto
  choice: 'Traduzido com valor causal: “porque”.'
  alternative: 'Traduzir circunstancialmente: “enquanto ele queria”.'
  rationale: O contexto associa a busca de valentia ao desfecho fatal, mas a nota reconhece que a construção também pode ser lida de modo mais circunstancial.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Tombaram em combate” preserva o registro narrativo-militar; a mudança explícita de “ele” para “eles” mantém a tensão gramatical do texto grego em vez de resolvê-la silenciosamente.
