  source_fidelity: A tradução preserva adequadamente o acampamento, o relatório, as nações circundantes, a força militar e, sobretudo, a alternância pronominal transmitida pelo grego (“vocês” / “eles”). Contudo, o grego diz apenas que Judas ‘enviou’ com a finalidade de reconhecimento; não explicita ‘homens’. Embora a elipse possa ser entendida no contexto, a explicitação não é necessária em português e acrescenta um elemento ausente do texto-fonte.
  naturalness: A redação é clara e atual. ‘Enviou para espionar o acampamento’ é natural em português e evita a inserção de um objeto implícito. ‘Uma força muito grande’ reproduz de modo mais direto a intensificação de δύναμις πολλὴ σφόδρα, sem perder o registro narrativo.
  terminology: ‘Acampamento’, ‘relataram’, ‘nações’ e ‘força’ são escolhas adequadas ao contexto militar. A nota mantém corretamente a incongruência pronominal sem tentar harmonizá-la.
