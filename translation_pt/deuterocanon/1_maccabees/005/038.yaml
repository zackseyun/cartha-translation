  text: And Judas sent men to spy out the camp[a], and they reported to him, saying, “All the nations around you have gathered together against them—a very great force.”
translation:
  language: pt
  text: 'E Judas enviou para espionar o acampamento, e lhe relataram: “Todas as nações ao redor de vocês se reuniram contra eles[a] — uma força muito grande.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz “contra eles”. Os pronomes deste relato são um tanto inesperados no contexto (“ao redor de vocês ... contra eles”), mas a tradução preserva o texto transmitido, em vez de ajustá-lo para “contra vocês” ou “ao nosso redor”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou homens
  rationale: O verbo significa “enviou”; o objeto humano implícito é explicitado em português para que a finalidade de reconhecimento soe natural, sem alterar o sentido.
- source_word: κατασκοπῆσαι
  choice: para espionar
  rationale: Expressa a observação secreta ou militar das posições inimigas e permanece claro ao leitor comum.
- source_word: τὴν παρεμβολήν
  choice: o acampamento
  rationale: Em contexto militar, παρεμβολή designa o acampamento ou arraial das tropas.
- source_word: ἀπήγγειλαν
  choice: relataram
  rationale: Indica que os enviados voltaram com informações obtidas no reconhecimento.
- source_word: Ἐπισυνηγμένοι εἰσὶν
  choice: se reuniram
  rationale: A construção perifrástica perfeita descreve uma reunião já realizada cujo resultado permanece; o contexto comunica esse estado atual.
- source_word: πρὸς αὐτοὺς
  choice: contra eles
  rationale: Em contexto militar, πρὸς pode indicar oposição hostil. Mantém-se o pronome de terceira pessoa transmitido pelo grego.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Refere-se aos grupos étnico-políticos vizinhos sem introduzir a carga interpretativa possível de “gentios”.
- source_word: τὰ κύκλῳ ὑμῶν
  choice: ao redor de vocês
  rationale: Preserva a segunda pessoa do plural do texto grego e usa uma forma amplamente clara, especialmente para leitores brasileiros.
- source_word: δύναμις πολλὴ σφόδρα
  choice: uma força extraordinariamente grande
  rationale: δύναμις tem sentido militar de força ou contingente, enquanto σφόδρα intensifica πολλή.
