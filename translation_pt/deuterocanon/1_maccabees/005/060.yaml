  text: And Joseph and Azariah were routed and were pursued as far as the borders of Judea[a]; and on that day about two thousand men of the people of Israel fell.
translation:
  language: pt
  text: José e Azarias foram postos em fuga e perseguidos até as fronteiras da Judeia; naquele dia, caíram cerca de dois mil homens[a] do povo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “caíram... até dois mil homens”; a expressão provavelmente indica um total aproximado, daí “cerca de dois mil homens”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτροπώθη
  choice: foram postos em fuga
  rationale: No contexto militar, o passivo indica que José e Azarias foram desbaratados e obrigados a fugir; a expressão é clara e natural em português.
- source_word: ἐδιώχθησαν
  choice: perseguidos
  rationale: O passivo de διώκω descreve a perseguição hostil que se seguiu à debandada.
- source_word: ἕως τῶν ὁρίων τῆς Ἰουδαίας
  choice: até as fronteiras da Judeia
  rationale: Preserva o valor de ἕως e o plural ὅρια, com formulação corrente em português.
- source_word: ἔπεσον
  choice: caíram
  rationale: Mantém a imagem grega convencional para os mortos em combate, sem substituir a expressão por uma explicação interpretativa.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: naquele dia
  rationale: Equivalente temporal direto, natural e digno em português moderno.
- source_word: ἐκ τοῦ λαοῦ Ἰσραήλ
  choice: do povo de Israel
  rationale: Indica que os homens que caíram pertenciam ao povo de Israel.
- source_word: εἰς δισχιλίους ἄνδρας
  choice: cerca de dois mil homens
  rationale: Diante de numeral, εἰς pode indicar uma cifra aproximada ou um total que chega a esse número; “cerca de” preserva essa nuance.
