  text: and that many of them are shut up in Bosora and Bosor[a], in Alamis, Casphor, Maked, and Carnaim; all these cities are fortified and large.
translation:
  language: pt
  text: e que muitos deles estão confinados em Bossorá e Bosor[a], em Alámois, Casfor, Maqued e Carnaim; todas essas cidades são grandes e fortificadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os topônimos gregos são difíceis e variam entre as tradições de tradução. Esta versão conserva uma transliteração próxima do texto de Swete, em vez de harmonizá-los com formas mais conhecidas.
    reason: cultural_note
lexical_decisions:
- source_word: συνειλημμένοι
  choice: estão confinados
  rationale: O particípio perfeito passivo indica que muitos se encontram encerrados ou retidos nesses lugares. “Estão confinados” expressa esse estado sem especificar, além do que o grego exige, que estejam formalmente sitiados ou presos.
- source_word: εἰς
  choice: em
  rationale: Depois do particípio passivo e antes dos topônimos, a preposição descreve a localização resultante, não um movimento para dentro; por isso, “em” é natural em português.
- source_word: Βοσσορὰ καὶ Βοσόρ, ἐν Ἀλάμοις, Κασφὼρ, Μακέδ, καὶ Καρναΐν
  choice: Bossorá e Bosor, em Alámois, Casfor, Maqued e Carnaim
  rationale: Os nomes são transliterados de modo conservador a partir do texto grego de Swete, com adaptações ortográficas mínimas para a leitura em português. O segundo “em” representa o ἐν explícito antes de Ἀλάμοις e se estende naturalmente aos nomes seguintes.
- source_word: ὀχυραὶ
  choice: fortificadas
  rationale: O adjetivo descreve cidades dotadas de defesas; “fortificadas” transmite de forma concreta esse sentido.
- source_word: μεγάλαι
  choice: grandes
  rationale: No contexto da descrição de cidades, “grandes” comunica primariamente sua dimensão sem impor o sentido de importância política.
- source_word: πᾶσαι αἱ πόλεις αὗται
  choice: todas essas cidades
  rationale: Tradução direta e natural da expressão que resume os lugares mencionados.
