  yaml_path: translation/deuterocanon/1_maccabees/005/066.yaml
  text: And he set out to go into the land of the foreigners[a], and he passed through Samaria.
translation:
  language: pt
  text: E ele partiu para ir à terra dos estrangeiros[a] e atravessava a Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «terra dos filisteus», pois o termo grego traduzido como «estrangeiros» pode ser usado na linguagem bíblica como designação convencional dos filisteus; aqui se mantém o sentido mais amplo porque o próprio versículo não especifica esse povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: O aoristo de ἀπαίρω assinala o início do deslocamento; «partiu» é natural e mantém a ideia de pôr-se a caminho.
- source_word: τοῦ πορευθῆναι
  choice: para ir
  rationale: O infinitivo articular expressa finalidade ou intenção depois de ἀπῆρεν; «para ir» reproduz essa relação diretamente.
- source_word: γῆν ἀλλοφύλων
  choice: terra dos estrangeiros
  rationale: ἀλλόφυλοι pode designar convencionalmente os filisteus no grego bíblico, mas, isoladamente, a expressão significa pessoas de outro povo. A tradução mais ampla preserva a ambiguidade lexical.
- source_word: διεπορεύετο
  choice: atravessava
  rationale: O imperfeito apresenta o deslocamento em curso através da região; «atravessava» expressa de modo conciso tanto o aspecto contínuo quanto o percurso.
- source_word: τὴν Σαμάριαν
  choice: a Samaria
  rationale: Forma portuguesa corrente do topônimo, com artigo conforme o uso natural.
