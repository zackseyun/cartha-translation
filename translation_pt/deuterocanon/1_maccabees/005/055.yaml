  text: And in the days when Judas and Jonathan were in Gilead[a], and Simon his brother was in Galilee opposite Ptolemais,
translation:
  language: pt
  text: E, nos dias em que Judas e Jônatas estavam em Gileade, e Simão, irmão de Judas, estava na Galileia, em frente a Ptolemaida,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oposta a Ptolemaida”, “diante de Ptolemaida” ou “na direção de Ptolemaida”; o grego usa uma expressão espacial que indica a localização em relação à cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις αἷς
  choice: nos dias em que
  rationale: Preserva a construção temporal grega de modo natural e digno em português.
- source_word: ἦν
  choice: estavam
  rationale: Embora o verbo grego esteja no singular, ele acompanha o sujeito composto Judas e Jônatas; em português, emprega-se a concordância no plural.
- source_word: Γαλαάδ
  choice: Gileade
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português bíblico.
- source_word: Σίμων ὁ ἀδελφὸς αὐτοῦ
  choice: Simão, irmão de Judas
  rationale: O pronome grego singular remete naturalmente a Judas, o referente masculino singular mais próximo dentro do par mencionado; explicitar o nome evita que o português sugira que Simão era irmão apenas de Jônatas.
- source_word: Γαλιλαίᾳ
  choice: Galileia
  rationale: Forma corrente do nome da região em português.
- source_word: κατὰ πρόσωπον Πτολεμαΐδος
  choice: diante de Ptolemaida
  rationale: Mantém o caráter espacial da expressão grega sem definir com precisão indevida se a posição era oposta, voltada para ou na direção da cidade.
- source_word: Πτολεμαΐδος
  choice: Ptolemaida
  rationale: Forma portuguesa tradicional do nome da cidade antiga.
