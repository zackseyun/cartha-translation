  text: And he crossed over against the sons of Ammon[a], and found a strong force and a large people[b], with Timothy leading them.
translation:
  language: pt
  text: E ele atravessou para ir contra os filhos de Amom[a] e encontrou uma força poderosa[b] e um povo numeroso, com Timóteo à frente deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os amonitas».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «uma mão poderosa»; aqui, a expressão provavelmente indica poder ou força militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπέρασεν
  choice: atravessou
  rationale: Preserva o sentido básico de cruzar ou passar para o outro lado, adequado ao deslocamento militar descrito.
- source_word: ἐπὶ
  choice: para atacar
  rationale: Neste contexto de campanha militar, a preposição indica movimento hostil contra um adversário. A formulação explicita essa direção sem especificar indevidamente a rota.
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: os filhos de Amom
  rationale: Reproduz de modo transparente a expressão grega; «os amonitas» seria a forma gentílica idiomática equivalente.
- source_word: χεῖρα κραταιὰν
  choice: uma força poderosa
  rationale: Embora a expressão signifique literalmente «uma mão poderosa», «mão» pode designar poder ou força, especialmente em cenário militar. A tradução comunica o sentido provável sem dizer explicitamente «exército».
- source_word: λαὸν πολύν
  choice: um povo numeroso
  rationale: Mantém o valor coletivo de λαός e evita restringi-lo a «exército», especificação que o grego não faz expressamente.
- source_word: ἡγούμενον
  choice: à frente deles
  rationale: Expressa de maneira natural o papel de Timóteo como líder, preservando a amplitude do particípio sem impor o sentido mais específico de comandante militar.
