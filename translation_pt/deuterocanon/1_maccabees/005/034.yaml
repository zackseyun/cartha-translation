base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/034.yaml
  text: And Timothy’s camp recognized that it was Maccabeus[a], and they fled from before him; and he struck them with a great blow, and as many as eight thousand of them fell on that day.
translation:
  language: pt
  text: As tropas de Timóteo reconheceram que era Macabeu e fugiram de diante dele. Ele lhes infligiu uma grande derrota, e naquele dia caíram cerca de oito mil homens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até oito mil homens”; a expressão grega pode indicar uma quantidade aproximada ou um total que chegou a esse número.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνω
  choice: reconheceram
  rationale: O verbo indica que as tropas identificaram ou perceberam quem se aproximava; “reconheceram” preserva esse sentido no contexto militar.
- source_word: ἡ παρεμβολὴ Τιμοθέου
  choice: as tropas de Timóteo
  rationale: παρεμβολή pode designar tanto o acampamento como a força militar nele reunida. Como o coletivo reconhece, foge e sofre baixas, “as tropas” comunica naturalmente o referente humano em português.
- source_word: ὁ Μακκαβαῖός
  choice: Macabeu
  rationale: Forma portuguesa tradicional e clara do nome ou título grego, sem tornar obrigatório o valor titular do artigo.
- source_word: ἔφυγον ἀπὸ προσώπου αὐτοῦ
  choice: fugiram de diante dele
  rationale: Mantém o sabor da expressão semítica refletida no grego e continua inteligível no português atual.
- source_word: ἐπάταξεν αὐτοὺς πληγὴν μεγάλην
  choice: ele lhes infligiu uma grande derrota
  rationale: Reproduz o sentido do idiomatismo militar grego com naturalidade, evitando o pouco idiomático “feriu-os com um grande golpe”.
- source_word: ἔπεσον
  choice: caíram
  rationale: Em narrativa de batalha, “caíram” comunica que foram mortos, preservando o eufemismo e a formulação militar do original.
- source_word: εἰς ὀκτακισχιλίους ἄνδρας
  choice: cerca de oito mil homens
  rationale: A preposição εἰς diante do numeral pode apresentar uma contagem aproximada ou um total que chegou a esse número; “cerca de” preserva essa nuance sem impor precisão indevida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. O coletivo singular grego foi vertido por “tropas” para tornar naturais os verbos de reconhecimento e fuga; a expressão semítica “de diante dele” foi preservada por ser clara no contexto.
