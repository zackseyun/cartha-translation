  text: Now then[a], come and rescue us from their hand[b], because a great number of our people has fallen.
translation:
  language: pt
  text: Agora, pois, venha e nos livre das mãos deles[a], porque um grande número de nós caiu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «da mão deles»; trata-se de uma expressão comum para indicar domínio ou poder hostil.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «foi derrotado». Neste contexto, o grego não especifica se «caiu» enfatiza a morte, a derrota ou ambas.'
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, pois
  rationale: Conserva tanto o valor temporal de νῦν quanto a força conclusiva ou de transição de οὖν, em uma formulação portuguesa clara e digna.
- source_word: ἐλθὼν
  choice: venha
  rationale: Embora seja formalmente um particípio aoristo, funciona de modo idiomático junto ao imperativo seguinte. Em português, a sequência natural é «venha e nos livre».
- source_word: ἔξελου
  choice: nos livre
  rationale: Neste contexto, ἐξαιρέω significa retirar alguém do perigo ou do domínio hostil. «Livrar» expressa isso naturalmente sem acrescentar uma interpretação específica.
- source_word: ἐκ χειρὸς αὐτῶν
  choice: das mãos deles
  rationale: A expressão grega, literalmente no singular, é uma metáfora comum para domínio ou poder hostil. O plural «das mãos deles» mantém a imagem e soa mais natural em português.
- source_word: πέπτωκεν
  choice: caiu
  rationale: O perfeito de πίπτω indica que a queda já ocorreu e seus efeitos permanecem. No contexto militar, pode envolver morte, derrota ou ambas; «caiu» preserva essa ambiguidade.
- source_word: ἐξ ἡμῶν
  choice: de nós
  rationale: Reproduz com clareza a ideia de que as pessoas atingidas pertencem ao grupo que faz o apelo.
- source_word: πλῆθος
  choice: um grande número
  rationale: Preserva o substantivo coletivo e a ênfase quantitativa do grego, além de permitir que o verbo permaneça no singular, como no texto-fonte.
