  text: And he turned aside to Maapha and fought against it, and he captured it and killed every male in it, and he took its spoils and burned it with fire.
translation:
  language: pt
  text: Então ele se desviou para Maafá, combateu contra ela, conquistou-a, matou todos os do sexo masculino que nela havia, tomou os seus despojos e a incendiou com fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκλινεν εἰς Μααφὰ
  choice: se desviou para Maafá
  rationale: Preserva a ideia de deixar ou alterar a rota em direção à localidade, sem transformar o verbo em uma fórmula explícita de ataque militar.
- source_word: Μααφὰ
  choice: Maafá
  rationale: Transliteração portuguesa próxima da forma grega, com acento para indicar a tonicidade final.
- source_word: ἐπολέμησεν αὐτήν
  choice: combateu contra ela
  rationale: Expressa de modo claro e próximo ao grego a ação militar dirigida contra a cidade.
- source_word: κατελάβετο αὐτὴν
  choice: conquistou-a
  rationale: No contexto militar, o verbo indica tomar e passar a controlar a cidade; «conquistou-a» distingue essa ação da posterior tomada dos despojos.
- source_word: πᾶν ἀρσενικὸν αὐτῆς
  choice: todos os homens que havia nela
  rationale: Em referência à população de uma cidade, esta formulação natural comunica a totalidade dos indivíduos do sexo masculino sem suavizar a violência do texto.
- source_word: τὰ σκῦλα αὐτῆς
  choice: os seus despojos
  rationale: «Despojos» é o termo corrente e digno para bens tomados em contexto de guerra.
- source_word: ἐνέπρησεν αὐτὴν ἐν πυρί
  choice: a incendiou
  rationale: O verbo português já inclui semanticamente o uso do fogo, evitando a redundância pouco natural de «incendiou-a com fogo» enquanto preserva integralmente a ação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. Os pronomes femininos retomam a cidade de Maafá, conforme o referente implícito no grego. A coordenação cumulativa das ações foi mantida, mas sem repetir «e» de maneira artificial em português.
