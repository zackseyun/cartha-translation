- from: Então ele se desviou para Maafá, combateu contra ela, conquistou-a, matou todos os homens que havia nela, tomou os seus despojos e a incendiou.
  to: Então ele se desviou para Maafá, combateu contra ela, conquistou-a, matou todos os do sexo masculino que nela havia, tomou os seus despojos e a incendiou com fogo.
  rationale: A revisão apenas torna explícito o instrumental «com fogo» e ajusta a referência a πᾶν ἀρσενικόν para abranger todos os indivíduos masculinos, como no grego. Mantêm-se a ordem, o referente feminino da cidade e o tom sóbrio do relato.
