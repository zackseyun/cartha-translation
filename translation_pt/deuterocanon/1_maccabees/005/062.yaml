  text: But they were not from the offspring of those men through whose hand deliverance had been given to Israel[a].
translation:
  language: pt
  text: Mas eles não eram da descendência daqueles homens por cuja mão a libertação havia sido concedida a Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela mão deles”; de modo mais idiomático, “por meio deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Mas eles
  rationale: δέ marca contraste com o contexto anterior; “Mas eles” o expressa de modo direto e natural.
- source_word: σπέρματος
  choice: descendência
  rationale: Na construção ἐκ τοῦ σπέρματος, o termo indica origem genealógica ou linhagem. “Descendência” conserva esse sentido sem recorrer ao literalismo pouco natural de “semente”.
- source_word: ἀνδρῶν
  choice: homens
  rationale: O substantivo grego é masculino plural e se refere a figuras masculinas específicas; “homens” preserva essa referência.
- source_word: ἐδόθη
  choice: havia sido concedida
  rationale: Mantém a voz passiva e exprime adequadamente a anterioridade retrospectiva da ação no contexto. “Concedida” soa natural com “libertação” e não identifica explicitamente o agente não mencionado.
- source_word: σωτηρία
  choice: libertação
  rationale: Neste contexto histórico-militar, o termo designa livramento concreto ou preservação nacional. “Libertação” comunica esse sentido sem impor uma leitura doutrinária posterior.
- source_word: διὰ χειρὸς αὐτῶν
  choice: por cuja mão
  rationale: A expressão é um idiomatismo de agência. A formulação conserva a imagem bíblica da mão e liga com clareza a agência àqueles homens, embora o português mais idiomático pudesse dizer “por meio deles”.
theological_decisions:
- issue: Sentido de σωτηρία no contexto histórico-militar
  choice: libertação
  alternative: salvação; vitória
  rationale: “Libertação” preserva a ideia de Israel ser concretamente livrado, sem restringir o termo a uma vitória militar nem ampliar indevidamente suas conotações teológicas.
- issue: Expressão de agência em διὰ χειρὸς αὐτῶν
  choice: por cuja mão
  alternative: pela mão deles; por meio deles
  rationale: A escolha mantém a imagem concreta e a textura septuagintal da expressão, sem resolver além do necessário a relação entre agência humana e o agente implícito que concede a libertação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “da descendência” preserva o componente genealógico, e “por cuja mão” mantém deliberadamente o sabor bíblico do idioma de agência.
