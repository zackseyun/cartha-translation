  yaml_path: translation/deuterocanon/1_maccabees/005/043.yaml
  text: And he crossed over to them first[a], and all his people were before him; and all the nations were crushed before him[b], and they threw down all their weapons and fled into the sanctuary at Carnain.
translation:
  language: pt
  text: Ele atravessou primeiro para junto deles[a], e todo o seu povo estava à sua frente. Todas as nações foram destroçadas diante dele; elas largaram todas as suas armas e fugiram para o santuário[b] em Carnaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra eles”; o grego πρὸς αὐτούς pode indicar direção (“para junto deles”, “em direção a eles”) ou, neste contexto, assumir sentido hostil.
    reason: lexical_alternative
  - marker: b
    text: Ou “recinto sagrado” ou “área do templo”; o grego τέμενος designa uma área consagrada ou um santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπέρασεν
  choice: atravessou
  rationale: Expressa diretamente a passagem de um lado para outro, sem especificar um terreno que o grego não nomeia.
- source_word: πρὸς αὐτούς
  choice: até eles
  rationale: Conserva o sentido direcional de πρός com acusativo, sem eliminar a possível nuance hostil indicada pelo contexto militar.
- source_word: πρότερον
  choice: primeiro
  rationale: Indica de modo conciso que ele fez a travessia antes dos demais.
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: todo o seu povo
  rationale: Mantém o sentido amplo de λαός, embora no contexto se trate de sua força militar.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: à sua frente
  rationale: Reproduz com clareza a relação espacial expressa pelo grego, sem tentar harmonizá-la com a afirmação anterior.
- source_word: συνετρίβησαν
  choice: foram destroçadas
  rationale: Preserva a imagem forte de quebra e comunica uma derrota militar decisiva.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Mantém a formulação ampla de ἔθνη sem restringi-la explicitamente a “gentios”.
- source_word: ἔρριψαν πάντα τὰ ὅπλα αὐτῶν
  choice: largaram todas as suas armas
  rationale: Em português corrente, “largaram” transmite o abandono das armas durante a fuga; “armas” é a leitura contextual mais clara de ὅπλα.
- source_word: τέμενος
  choice: santuário
  rationale: Comunica o caráter sagrado do lugar, enquanto a nota preserva as alternativas mais específicas de recinto ou complexo cultual.
- source_word: ἐν Καρναΐν
  choice: em Carnaim
  rationale: Emprega uma transliteração natural em português do topônimo grego e conserva a indicação de localização.
