  yaml_path: translation/deuterocanon/1_maccabees/005/004.yaml
  text: And he remembered the evil of the sons of Baian[a], who were a snare and a stumbling block to the people, lying in ambush for them on the roads.
translation:
  language: pt
  text: E ele se lembrou da maldade dos filhos de Baian[a], que eram uma armadilha e uma pedra de tropeço para o povo, ao emboscá-los nas estradas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos de Baean”; o nome próprio grego Βαιάν admite mais de uma transliteração.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: se lembrou
  rationale: Expressa de modo natural o aoristo de μιμνῄσκομαι, apresentando a recordação da hostilidade anterior como motivação para agir.
- source_word: κακίας
  choice: maldade
  rationale: Preserva o amplo sentido moral de κακία e, no contexto, abrange os atos hostis praticados contra o povo sem especificar indevidamente a intenção.
- source_word: υἱῶν Βαιάν
  choice: filhos de Baiã
  rationale: Mantém a forma filial do grego, que pode designar um clã ou grupo ligado a um antepassado, sem substituí-la interpretativamente por 'descendentes'.
- source_word: παγίδα
  choice: uma armadilha
  rationale: Comunica com clareza a imagem de um perigo preparado para capturar ou prejudicar, preservando seu uso metafórico.
- source_word: σκάνδαλον
  choice: uma pedra de tropeço
  rationale: Conserva a metáfora de σκάνδαλον e forma um paralelo imagético natural com 'armadilha'.
- source_word: ἐν τῷ ἐνεδρεύειν
  choice: emboscando-os
  rationale: A construção expressa circunstância ou meio; o gerúndio português liga naturalmente as emboscadas à maneira pela qual eles se tornavam armadilha e pedra de tropeço.
- source_word: αὐτοὺς
  choice: -os
  rationale: O pronome retoma 'o povo' como alvo das emboscadas, sem acrescentar um referente novo.
- source_word: ἐν ταῖς ὁδοῖς
  choice: pelos caminhos
  rationale: Designa as rotas nas quais ocorriam as emboscadas; 'pelos caminhos' é natural em português narrativo e mantém a noção distributiva ou espacial sem restringi-la a estradas construídas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação das duas metáforas foi preservada, assim como a possível designação clânica em 'filhos de Baiã'. O gerúndio mantém aberta a relação circunstancial ou instrumental da construção grega.
