  text: And three thousand men were assigned to Simon to go into Galilee, but eight thousand men to Judas into Gilead.
translation:
  language: pt
  text: Foram designados a Simão três mil homens para irem à Galileia, mas a Judas, oito mil homens para irem a Gileade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμερίσθησαν
  choice: foram designados
  rationale: O passivo de μερίζω indica aqui a distribuição de tropas entre comandantes. “Foram designados” transmite naturalmente esse sentido militar e administrativo, sem recorrer ao literalismo menos claro de “foram divididos”.
- source_word: ἄνδρες
  choice: homens
  rationale: O grego diz explicitamente “homens”. Embora o contexto mostre que são combatentes, “homens” preserva a formulação da fonte sem acrescentar uma especificação interpretativa.
- source_word: τρισχίλιοι / ὀκτακισχίλιοι
  choice: três mil / oito mil
  rationale: Tradução direta e natural dos numerais gregos.
- source_word: τοῦ πορευθῆναι
  choice: para ir
  rationale: O infinitivo articular expressa finalidade. “Para ir” conserva esse valor de modo simples, sem acrescentar a ideia mais específica de marchar.
- source_word: Σίμωνι / Ἰούδα
  choice: a Simão / a Judas
  rationale: Os dativos indicam os comandantes aos quais os contingentes foram designados. Simão e Judas são as formas portuguesas tradicionais e inequívocas desses nomes pessoais no livro.
- source_word: Γαλιλαίαν
  choice: Galileia
  rationale: Forma geográfica consagrada em português.
- source_word: Γαλααδῖτιν
  choice: Gileade
  rationale: O termo designa a região de Gileade; a forma simples é natural e suficiente em português, sem necessidade de explicitar “terra” ou “região”.
- source_word: δὲ
  choice: porém
  rationale: Marca a contraposição entre os dois contingentes e comandantes. A colocação pós-positiva em português produz uma frase clara e digna.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela e concisa. O ponto e vírgula torna explícita a divisão entre os dois contingentes, enquanto a elipse de “foram designados” e de “ir” na segunda oração preserva a concisão do grego sem prejudicar a compreensão.
