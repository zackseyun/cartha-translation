  text: And they met the Nabateans[a], and they greeted them peaceably, and they told them everything that had happened to their brothers in Gilead,
translation:
  language: pt
  text: Eles encontraram os nabateus, que os receberam pacificamente[a] e lhes contaram tudo o que havia acontecido a seus irmãos em Galaad,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os saudaram pacificamente” ou “foram ao encontro deles em paz”. O verbo grego pode indicar sair ao encontro de alguém ou recebê-lo, e o advérbio ressalta a intenção pacífica.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήντησαν
  choice: encontraram
  rationale: Verbo narrativo simples para o ato de encontrar; a forma é natural em português e não sugere hostilidade.
- source_word: Ναβαταίοις
  choice: os nabateus
  rationale: Forma portuguesa corrente do nome desse povo antigo.
- source_word: ὑπήντησαν αὐτοῖς εἰρηνικῶς
  choice: foram ao encontro deles pacificamente
  rationale: Preserva o movimento ou a iniciativa possível em ὑπαντάω e expressa claramente a intenção não hostil indicada por εἰρηνικῶς.
- source_word: διηγήσαντο
  choice: lhes contaram
  rationale: Expressa de modo corrente o ato de relatar os acontecimentos, enquanto o complemento abrangente comunica a ideia de exposição completa.
- source_word: ἅπαντα τὰ συμβεβηκότα
  choice: tudo o que tinha acontecido
  rationale: Tradução idiomática que conserva tanto a totalidade de ἅπαντα como a anterioridade dos acontecimentos.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: aos irmãos deles
  rationale: Mantém a linguagem de parentesco do grego sem substituí-la interpretativamente por “compatriotas” ou “judeus” e conserva a referência pronominal do texto.
- source_word: ἐν τῇ Γαλααδίτιδι
  choice: em Galaad
  rationale: Forma portuguesa tradicional e concisa para a região de Gileade/Galaad.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção identifica naturalmente os nabateus como os que se aproximaram e deram as informações, conforme o fluxo narrativo, sem ampliar “irmãos” para uma identificação étnica explícita. A vírgula final foi mantida porque o versículo continua a frase nos versículos seguintes.
