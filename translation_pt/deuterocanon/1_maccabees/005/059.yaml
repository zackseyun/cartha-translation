  text: And Gorgias came out from the city, and his men, to meet them in battle.
translation:
  language: pt
  text: Então Górgias saiu da cidade com os seus homens para enfrentá-los em batalha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Expressa diretamente o movimento de dentro para fora da cidade; em português, o ponto de vista narrativo não exige distinguir entre “veio para fora” e “foi para fora”.
- source_word: πόλεως
  choice: cidade
  rationale: É o equivalente comum de πόλις e preserva naturalmente o cenário urbano e militar.
- source_word: οἱ ἄνδρες αὐτοῦ
  choice: com os seus homens
  rationale: No contexto, designa a força que acompanhava Górgias sem explicitar “soldados”, termo militar mais específico que o grego. A construção com “com” comunica em português natural que tanto Górgias quanto seus homens saíram.
- source_word: εἰς συνάντησιν αὐτοῖς
  choice: para enfrentá-los
  rationale: O idioma indica ir ao encontro deles; no contexto inequivocamente hostil, “enfrentá-los” comunica com naturalidade a finalidade do encontro.
- source_word: εἰς πόλεμον
  choice: em batalha
  rationale: Preserva o sentido marcial e evita a formulação pouco natural “para enfrentá-los para a batalha”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação grega foi convertida em “com os seus homens” para evitar ambiguidade sintática sem alterar os participantes ou a ação.
