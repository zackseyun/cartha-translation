  text: And they are preparing to come and seize the stronghold into which we have fled[b][a]; and Timothy is leading their camp.
translation:
  language: pt
  text: E eles estão se preparando para vir e se apoderar da fortaleza[a] na qual nos refugiamos; e Timóteo comanda as tropas deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomar de antemão a fortaleza” ou “ocupar primeiro a fortaleza”. O verbo grego pode enfatizar uma tomada preventiva ou antecipada.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego significa literalmente “acampamento” e também pode designar o exército ou a força militar reunida nele.
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζοντές εἰσιν
  choice: estão se preparando
  rationale: A construção perifrástica no presente indica uma preparação em andamento.
- source_word: προκαταλαβέσθαι
  choice: se apoderar
  rationale: Expressa a tomada hostil da posição; a nuance de ocupação antecipada contida no prefixo grego é preservada em nota, pois explicitá-la no corpo do texto produziria uma formulação pouco natural e potencialmente confusa no contexto.
- source_word: τὸ ὀχύρωμα
  choice: a fortaleza
  rationale: Designa uma posição fortificada e corresponde naturalmente ao lugar de refúgio mencionado na frase seguinte.
- source_word: εἰς ὃ κατεφύγομεν
  choice: na qual nos refugiamos
  rationale: Traduz o movimento para um lugar de refúgio de modo natural em português, mantendo a ação passada do aoristo.
- source_word: ἡγεῖται
  choice: comanda
  rationale: No contexto militar, o verbo indica estar à frente ou exercer liderança sobre a força.
- source_word: τῆς παρεμβολῆς αὐτῶν
  choice: as tropas deles
  rationale: παρεμβολή pode designar tanto um acampamento militar quanto o exército acampado; aqui, como complemento de 'comanda', 'as tropas' comunica com naturalidade o sentido metonímico.
