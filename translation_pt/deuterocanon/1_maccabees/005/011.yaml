  register: Português moderno, claro e digno, com sintaxe corrente e legibilidade brasileira. A ordem da frase grega foi preservada sem sacrificar a naturalidade; as ambiguidades de προκαταλαβέσθαι e παρεμβολή foram registradas em notas.
