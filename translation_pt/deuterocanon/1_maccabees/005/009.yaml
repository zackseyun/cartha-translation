  source_fidelity: A tradução reproduz adequadamente a sequência narrativa, os agentes, o propósito hostil expresso por τοῦ ἐξᾶραι αὐτούς e a fuga para o lugar fortificado. «em seu território», porém, torna menos nítida a referência plural de αὐτῶν e de ὁρίοις; «em seus territórios» preserva melhor que os israelitas estavam nas áreas pertencentes aos vários povos.
