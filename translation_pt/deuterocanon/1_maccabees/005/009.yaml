  terminology: «Povos», «Galaad», «israelitas», «fortaleza» e «Datema» são escolhas adequadas. «Eliminá-los completamente» transmite bem a força de remoção total; a nota deve oferecer alternativas sem acrescentar a ideia locativa de «dali», ausente do grego.
