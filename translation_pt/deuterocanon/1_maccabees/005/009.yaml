  text: And the nations in Gilead gathered together against the Israelites who were within their borders[a], to wipe them out; and they fled into the stronghold at Dathema.
translation:
  language: pt
  text: E os povos que estavam em Galaad se reuniram contra os israelitas que viviam em seus territórios, a fim de eliminá-los completamente[a]; e eles fugiram para a fortaleza de Datema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruí-los” ou “extirpá-los”. A expressão grega indica a intenção de removê-los por completo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: se reuniram
  rationale: Expressa de modo natural a mobilização coletiva e hostil indicada pelo verbo composto grego.
- source_word: τὰ ἔθνη
  choice: os povos
  rationale: No contexto, refere-se aos grupos não israelitas da região. “Os povos” é claro em português e evita possíveis conotações posteriores de “gentios”.
- source_word: τὰ ἐν τῇ Γαλααδίτιδι
  choice: que estavam em Galaad
  rationale: Identifica os povos situados na região de Galaad, preservando de forma direta a referência geográfica.
- source_word: ἐπὶ τὸν Ἰσραὴλ
  choice: contra os israelitas
  rationale: Embora o grego diga literalmente “contra Israel”, a construção seguinte mostra que estão em vista os membros do povo que viviam ali.
- source_word: τοὺς ὄντας ἐπὶ τοῖς ὁρίοις αὐτῶν
  choice: que viviam em seu território
  rationale: A expressão situa os israelitas nos limites territoriais pertencentes àqueles povos; esta formulação comunica com naturalidade a localização sem restringi-la necessariamente à linha exata da fronteira.
- source_word: τοῦ ἐξᾶραι αὐτούς
  choice: a fim de eliminá-los completamente
  rationale: O infinitivo expressa propósito hostil e a intenção de removê-los por inteiro; “eliminá-los completamente” preserva essa força em linguagem atual.
- source_word: ἔφυγον
  choice: fugiram
  rationale: Tradução direta e natural do verbo narrativo, mantendo a referência pronominal do original aos israelitas.
- source_word: Δάθεμα
  choice: Datema
  rationale: Transliteração adequada do topônimo grego para a ortografia portuguesa.
- source_word: τὸ ὀχύρωμα
  choice: a fortaleza
  rationale: Designa um lugar fortificado usado para defesa; “fortaleza” é corrente, conciso e preciso.
