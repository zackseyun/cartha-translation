  text: And all our brothers who are in the region of Tob have been killed[a], and they have taken their wives and children captive, along with their possessions[c][b], and have destroyed about one thousand men there.
translation:
  language: pt
  text: E todos os nossos irmãos que estão na região de Tob foram mortos[a], e eles levaram cativas as suas mulheres e os seus filhos, juntamente com os seus bens[b], e mataram ali cerca de mil homens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego também pode ser entendido como “morreram” ou “estão mortos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seus pertences”. A palavra grega traduzida por “bens” também pode significar “bagagem” ou “equipamento”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “destruíram [ou fizeram perecer] ali cerca de mil homens”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: os nossos irmãos
  rationale: Preserva o termo de parentesco do grego, que neste contexto designa os compatriotas israelitas.
- source_word: οἱ ὄντες ἐν τοῖς Τουβίου
  choice: que estavam na região de Tob
  rationale: Expressa o provável sentido geográfico da construção difícil τοῖς Τουβίου sem convertê-la com certeza indevida em etnônimo.
- source_word: τεθανάτωνται
  choice: foram mortos
  rationale: O perfeito indica morte consumada; o contexto de ataque e captura favorece uma formulação de morte violenta.
- source_word: αἰχμαλωτίκασι
  choice: foram levados como despojo
  rationale: A construção comunica que mulheres, filhos e bens foram tomados pelos inimigos; aplicada também a ὑποσκευήν, evita a expressão pouco natural de que bens foram feitos cativos.
- source_word: τὴν ὑποσκευήν
  choice: seus bens
  rationale: O substantivo pode significar bagagem, equipamento ou propriedade móvel; “bens” mantém essa amplitude.
- source_word: ἀπώλεσαν
  choice: foram mortos
  rationale: Embora o verbo signifique literalmente destruir ou fazer perecer, com homens como objeto “foram mortos” comunica naturalmente o resultado letal sem sugerir dano apenas material.
- source_word: ὡς μίαν χιλιάδα ἀνδρῶν
  choice: cerca de mil homens
  rationale: ὡς diante do numeral indica aproximação.
