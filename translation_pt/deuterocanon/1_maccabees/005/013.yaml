translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A divisão em duas frases reduz a ambiguidade sintática. “Região de Tob” conserva a incerteza do topônimo; “despojo” permite coordenar pessoas e bens sem afirmar literalmente que objetos foram feitos cativos.
