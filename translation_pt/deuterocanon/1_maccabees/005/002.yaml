base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/005/002.yaml
  text: And they were plotting to remove the offspring of Jacob who were among them[b][a], and they began to kill and wipe out those among the people.
translation:
  language: pt
  text: E tramavam remover os descendentes de Jacó[a] que estavam no meio deles; então começaram a matar e a exterminar entre o povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a linhagem de Jacó” ou “o povo de Jacó”. O grego γένος ressalta descendência ou parentesco.
    reason: lexical_alternative
  - marker: b
    text: Ou “do povo” ou “membros do povo”. A expressão grega ἐν τῷ λαῷ é concisa e pode ser entendida, neste contexto, em sentido locativo (“entre o povo”) ou partitivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύοντο
  choice: tramavam
  rationale: O imperfeito médio indica uma ação deliberativa em curso; no contexto hostil, “tramavam” comunica planejamento contínuo e mal-intencionado.
- source_word: ἆραι
  choice: remover
  rationale: O infinitivo de αἴρω significa tirar ou remover. “Remover” preserva a formulação inicial sem antecipar totalmente a matança e o extermínio mencionados em seguida.
- source_word: τὸ γένος Ἰακώβ
  choice: os descendentes de Jacó
  rationale: γένος aponta para origem, linhagem ou parentesco. “Descendentes de Jacó” conserva a identificação genealógica do povo judeu sem as conotações modernas de “raça”.
- source_word: τοὺς ὄντας ἐν μέσῳ αὐτῶν
  choice: que estavam no meio deles
  rationale: A oração participial delimita os descendentes de Jacó que se encontravam entre aqueles povos. A tradução mantém o valor locativo sem acrescentar que ali residiam permanentemente.
- source_word: ἤρξαντο τοῦ θανατοῦν
  choice: começaram a matar
  rationale: A construção com ἤρξαντο expressa o início da ação, e θανατοῦν significa matar ou levar à morte.
- source_word: ἐν τῷ λαῷ
  choice: os que estavam entre o povo
  rationale: A expressão grega é comprimida. A tradução fornece em português um objeto natural para os dois infinitivos, conservando a leitura locativa, sem ocultar a possível leitura partitiva registrada em nota.
- source_word: ἐξαίρειν
  choice: exterminar
  rationale: Neste contexto de violência coletiva, ἐξαίρειν vai além de mera retirada e expressa erradicação; “exterminar” preserva a intensificação depois de “matar”.
theological_decisions:
- issue: Designação étnico-genealógica em τὸ γένος Ἰακώβ
  choice: os descendentes de Jacó
  alternative: a linhagem de Jacó; o povo de Jacó
  rationale: A expressão identifica o povo judeu por sua descendência de Jacó. A escolha mantém essa identidade histórico-genealógica sem introduzir uma noção racial moderna.
- issue: Progressão de ἆραι para θανατοῦν e ἐξαίρειν
  choice: remover ... matar ... exterminar
  alternative: eliminar ... matar ... extirpar
  rationale: A formulação conserva a progressão entre o objetivo inicialmente expresso como remoção e sua execução por matança e erradicação, sem reduzir os três verbos à mesma ideia.
- issue: Sentido comprimido de ἐν τῷ λαῷ
  choice: os que estavam entre o povo
  alternative: membros do povo; no meio do povo
  rationale: O grego permite entender a expressão de modo locativo ou partitivo. A tradução principal adota uma formulação locativa inteligível, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tramavam” conserva o caráter hostil da deliberação; o ponto e vírgula torna clara a passagem do plano à execução. As notas registram as ambiguidades lexicais genuínas sem sobrecarregar o texto principal.
