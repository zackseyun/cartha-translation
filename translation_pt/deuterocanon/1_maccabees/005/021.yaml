  text: And Simon went into Galilee, and fought many battles against the nations; and the nations were crushed before him.
translation:
  language: pt
  text: E Simão foi para a Galileia e travou muitas batalhas contra as nações; e as nações foram esmagadas diante dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: foi
  rationale: O aoristo de πορεύομαι indica simplesmente ir ou deslocar-se. “Foi” é natural e não acrescenta a ideia específica de marcha militar.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: para a Galileia
  rationale: εἰς expressa movimento em direção ao interior da região. Em português corrente, “para a Galileia” comunica isso com naturalidade; “entrou na Galileia” tornaria explícito um aspecto apenas implícito.
- source_word: συνῆψεν πόλεμους πολλοὺς
  choice: travou muitas batalhas
  rationale: A expressão συνάπτειν πόλεμον descreve entrar em combate ou fazer guerra. “Travou muitas batalhas” é idiomático e adequado à sequência narrativa.
- source_word: πρὸς τὰ ἔθνη
  choice: contra as nações
  rationale: No contexto militar, ἔθνη designa os povos não judeus circundantes. “Nações” preserva o termo de modo neutro, sem a carga religiosa que “gentios” pode adquirir.
- source_word: συνετρίβη
  choice: foram esmagadas
  rationale: O passivo de συντρίβω tem a força de quebrar ou esmagar. A tradução mantém a intensidade da imagem grega, em vez de reduzi-la ao sentido mais fraco de “foram derrotadas”.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: diante dele
  rationale: O idioma significa literalmente “de diante da face dele” e, neste contexto, descreve os adversários esmagados perante Simão ou diante de seu avanço. “Diante dele” preserva a formulação sem explicá-la em excesso.
