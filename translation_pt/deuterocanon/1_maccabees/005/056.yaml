  text: Joseph son of Zechariah and Azariah[a], commanders of the forces, heard of the brave deeds and of the warlike exploits that they had done.
translation:
  language: pt
  text: José, filho de Zacarias, e Azarias[a], comandantes das forças, ouviram falar dos atos de bravura e dos feitos de guerra que eles haviam realizado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego de Swete, conforme transcrito, parece trazer “Zacarias” como o segundo nome; o contexto narrativo e a tradição textual corrente apoiam “Azarias” neste ponto.
    reason: textual_variant
lexical_decisions:
- source_word: ἤκουσεν
  choice: ouviram falar
  rationale: O verbo significa “ouvir” ou “tomar conhecimento pelo que se ouviu”. A expressão “ouviram falar” introduz de modo natural, em português, a notícia dos feitos mencionados a seguir. Emprega-se o plural por concordância idiomática com o sujeito composto.
- source_word: Ἰωσὴφ ὁ τοῦ Ζαχαρία
  choice: José, filho de Zacarias
  rationale: O artigo seguido do genitivo constitui uma designação filial; “filho de” é a forma portuguesa mais clara e natural.
- source_word: Ζαχαρίας
  choice: Azarias
  rationale: Embora a transcrição de Swete pareça trazer Ζαχαρίας como o segundo nome, o contexto narrativo e a tradição textual corrente identificam este comandante como Azarias. A incerteza textual é indicada em nota.
- source_word: ἄρχοντες τῶν δυνάμεων
  choice: comandantes das forças
  rationale: ἄρχοντες designa dirigentes ou chefes e, no contexto militar de τῶν δυνάμεων, “comandantes das forças” comunica a função sem impor uma patente moderna específica.
- source_word: ἀνδραγαθήσεων
  choice: atos de bravura
  rationale: O substantivo denota demonstrações de coragem ou valor. “Atos de bravura” preserva o sentido elogioso em linguagem moderna e digna.
- source_word: τοῦ πολέμου
  choice: feitos de guerra
  rationale: Em paralelo com “atos de bravura”, a expressão concreta “feitos de guerra” comunica realizações militares e evita a formulação pouco natural de “fazer a guerra” dentro da oração relativa.
- source_word: οἷα ἐποίησαν
  choice: que eles haviam realizado
  rationale: A expressão relativa retoma as ações relatadas. O mais-que-perfeito composto preserva a anterioridade em relação ao momento em que os comandantes receberam a notícia.
