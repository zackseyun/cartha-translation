  text: And they came as far as Ephron. This was a large city at the entrance[a], very strong. There was no way to turn aside from it to the right or to the left, but only to go through the middle of it.
translation:
  language: pt
  text: E chegaram até Efron. Era uma cidade grande, situada na entrada[a], e muito fortificada. Não era possível desviar-se dela nem pela direita nem pela esquerda; era preciso atravessá-la pelo meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na passagem» ou «na via de acesso»; a expressão grega indica que Efron controlava a rota de entrada, o que explica por que não era possível contorná-la.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἦλθον ἕως Ἐφρών
  choice: chegaram até Efrom
  rationale: ἕως marca o limite alcançado, e «até» conserva essa nuance. «Efrom» segue a forma tradicional portuguesa do topônimo bíblico.
- source_word: αὕτη ἡ πόλις μεγάλη
  choice: Era uma cidade grande
  rationale: Expressa naturalmente a descrição introduzida pelo demonstrativo αὕτη, sem tornar a frase pesada em português.
- source_word: ἡ τῆς εἰσόδου
  choice: situada na entrada
  rationale: O genitivo caracteriza a posição estratégica da cidade junto à entrada ou via de acesso; «situada» torna essa relação clara sem especificar indevidamente a geografia.
- source_word: ἰσχυρὰ σφόδρα
  choice: muito fortificada
  rationale: Aplicado a uma cidade em contexto militar, ἰσχυρά indica defesas fortes. «Muito fortificada» comunica naturalmente o sentido contextual de σφόδρα.
- source_word: οὐκ ἦν ἐκκλῖναι
  choice: Não era possível desviar-se
  rationale: A construção impessoal exprime impossibilidade, preservada de modo idiomático em português.
- source_word: ἀπ’ αὐτῆς δεξιὰν ἢ ἀριστεράν
  choice: dela nem pela direita nem pela esquerda
  rationale: Indica que não se podia contornar a cidade por nenhum dos lados; «pela direita... pela esquerda» é natural e mantém a imagem espacial.
- source_word: ἀλλ’ ἢ διὰ μέσου αὐτῆς πορεύεσθαι
  choice: era preciso atravessá-la pelo meio
  rationale: A construção apresenta a passagem pelo interior da cidade como única alternativa. «Pelo meio» preserva explicitamente διὰ μέσου.
