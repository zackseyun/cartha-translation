  text: And they gave orders to those of the force with them[a], and they marched against Jamnia.
translation:
  language: pt
  text: E deram ordens aos homens do contingente que estava com eles e marcharam contra Jâmnia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Jâmnia”. A expressão grega pode indicar movimento em direção a um lugar, mas, neste contexto militar, provavelmente denota um avanço hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλαν
  choice: deram ordens
  rationale: O verbo indica a emissão de instruções ou ordens; a expressão é natural em português e combina com o contexto militar.
- source_word: τοῖς ἀπὸ τῆς δυνάμεως τῆς μετʼ αὐτῶν
  choice: aos homens do contingente que estava com eles
  rationale: δύναμις designa aqui uma força militar, e ἀπό tem sentido partitivo. “Homens do contingente” comunica esse sentido de modo claro, sem reproduzir a construção grega pouco natural.
- source_word: ἐπορεύθησαν
  choice: marcharam
  rationale: Embora o verbo possa significar simplesmente “foram”, o contexto de deslocamento militar favorece “marcharam”.
- source_word: ἐπὶ Ἰαμνίαν
  choice: contra Jâmnia
  rationale: Com movimento militar, ἐπί seguido do acusativo provavelmente expressa avanço hostil; a alternativa direcional é preservada em nota.
- source_word: Ἰαμνίαν
  choice: Jâmnia
  rationale: Forma portuguesa tradicional e imediatamente legível do nome do lugar.
