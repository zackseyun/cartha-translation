  yaml_path: translation/deuterocanon/1_maccabees/005/018.yaml
  text: And he left Joseph son of Zechariah and Azariah[a], leaders of the people, with the rest of the forces in Judea for defense.
translation:
  language: pt
  text: E deixou José, filho de Zacarias, e Azarias, líder do povo, com o restante das tropas na Judeia, para a defesa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a guarda”, “para a vigilância” ou “para a proteção”. A expressão grega enfatiza o ato de guardar ou manter vigilância.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν
  choice: deixou
  rationale: Expressa diretamente a ideia de deixar alguém para trás; “designou” tornaria explícita uma comissão apenas implícita no contexto.
- source_word: Ἰώσηφον τὸν τοῦ Ζαχαρίου
  choice: José, filho de Zacarias
  rationale: A construção grega indica filiação, e esta formulação é natural e clara em português.
- source_word: Ἀζαρίαν
  choice: Azarias
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: ἡγούμενον τοῦ λαοῦ
  choice: líder do povo
  rationale: O particípio singular masculino concorda mais naturalmente com Azarias. “Líder” preserva a amplitude do termo, sem impor um cargo político ou militar específico.
- source_word: μετὰ τῶν ἐπιλοίπων τῆς δυνάμεως
  choice: com o restante das tropas
  rationale: No contexto militar, δύναμις se refere às forças ou tropas, e ἐπίλοιπος indica aquilo que restava.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: na Judeia
  rationale: Forma geográfica corrente em português.
- source_word: εἰς τήρησιν
  choice: para a defesa
  rationale: Comunica de modo natural a finalidade militar de guardar e proteger a Judeia, enquanto a nota preserva as alternativas mais literais.
theological_decisions:
- issue: Referente singular de ἡγούμενον
  choice: “líder do povo” descreve Azarias
  alternative: Entender José e Azarias conjuntamente como “líderes do povo”
  rationale: A forma grega ἡγούμενον está no acusativo masculino singular e aparece imediatamente após Azarias, favorecendo sua aplicação somente a ele. A tradução conserva essa concordância em vez de pluralizar por inferência contextual.
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos e topônimo em formas correntes no Brasil e amplamente compreensíveis no mundo lusófono. A ordem da frase acompanha de perto o grego sem sacrificar a naturalidade.
