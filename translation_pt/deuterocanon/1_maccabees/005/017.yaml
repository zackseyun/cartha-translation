  text: And Judas said to Simon his brother[a], “Choose men for yourself, and go and rescue your brothers in Galilee; but I and Jonathan my brother will go into Gileaditis.”
translation:
  language: pt
  text: 'Judas disse a seu irmão Simão: “Escolha homens para você, vá e resgate seus irmãos na Galileia. Mas eu e meu irmão Jônatas iremos para a Galaadítida[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Galaad”. O grego emprega “Galaadítida”, nome mais específico da região.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίλεξον
  choice: Escolha
  rationale: O imperativo aoristo de ἐπιλέγω expressa uma ordem direta. “Escolha” é corrente, claro e preserva a força do original.
- source_word: σεαυτῷ
  choice: para você
  rationale: O dativo reflexivo indica que Simão deve escolher os homens para o contingente sob sua responsabilidade. A expressão preserva essa nuance sem acrescentar que seriam explicitamente soldados.
- source_word: ἄνδρας
  choice: homens
  rationale: O contexto é militar, mas o grego diz literalmente “homens”, não “soldados” ou “combatentes”; por isso, mantém-se o termo mais amplo.
- source_word: πορεύου
  choice: vá
  rationale: Tradução natural e direta do imperativo de πορεύομαι.
- source_word: ῥῦσαι
  choice: resgate
  rationale: No contexto de perigo e expedição militar, “resgate” comunica livramento concreto e ativo.
- source_word: τοὺς ἀδελφούς σου
  choice: seus irmãos
  rationale: Preserva a linguagem de parentesco do grego, que pode abranger compatriotas israelitas, sem explicitar essa interpretação no corpo do texto.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: na Galileia
  rationale: Representa de modo claro e idiomático a localização dos irmãos ameaçados.
- source_word: ἐγὼ δὲ καὶ Ἰωναθὰν ὁ ἀδελφός μου
  choice: Eu, porém, e meu irmão Jônatas
  rationale: “Porém” conserva o contraste de δέ entre as duas missões, e a formulação mantém com razoável proximidade a ordem e a ênfase do grego.
- source_word: πορευσόμεθα
  choice: iremos
  rationale: Expressa de modo natural o futuro de πορεύομαι.
- source_word: εἰς τὴν Γαλααδῖτιν
  choice: para a Galaadítida
  rationale: Mantém o nome regional específico Γαλααδῖτις, em vez de reduzi-lo silenciosamente ao nome mais geral “Galaad”.
