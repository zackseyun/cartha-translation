revisions:
- from: Judas e seu exército mudaram de direção de repente, seguindo o caminho que atravessava o deserto rumo a Bosor. Ele tomou a cidade, matou todos os homens ao fio da espada[a], apoderou-se de todos os despojos deles e incendiou a cidade.
  to: Judas e seu acampamento mudaram subitamente de direção, tomando o caminho para o deserto, em direção a Bosor. Ele tomou a cidade, matou todos os do sexo masculino ao fio da espada[a], apoderou-se de todos os despojos deles e incendiou a cidade.
  rationale: A revisão corrige a possível restrição etária introduzida por «homens» e torna mais literal, sem perder naturalidade, a indicação do caminho para o deserto. Mantêm-se a divisão em duas frases, o tom narrativo e as demais escolhas adequadas do rascunho.
