  yaml_path: translation/deuterocanon/1_maccabees/005/028.yaml
  text: And Judas and his camp turned suddenly by the road into the wilderness toward Bosor; and he captured the city and killed every male with the edge of the sword[a], and took all their spoils, and burned it with fire.
translation:
  language: pt
  text: Judas e seu acampamento mudaram subitamente de direção, tomando o caminho para o deserto, em direção a Bosor. Ele tomou a cidade, matou todos os do sexo masculino ao fio da espada[a], apoderou-se de todos os despojos deles e incendiou a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “na boca da espada”, expressão idiomática que significa matar à espada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: mudaram de direção
  rationale: Expressa a mudança de rumo militar sem sugerir necessariamente retirada ou retorno.
- source_word: ἡ παρεμβολὴ αὐτοῦ
  choice: seu exército
  rationale: Embora παρεμβολή possa designar literalmente o acampamento, aqui se refere naturalmente à força militar que se deslocava com Judas.
- source_word: ὁδὸν εἰς τὴν ἔρημον
  choice: seguindo o caminho que atravessava o deserto
  rationale: Conserva tanto a ideia de caminho quanto a referência ao deserto, tornando natural a expressão grega compacta.
- source_word: εἰς Βοσὸρ
  choice: rumo a Bosor
  rationale: Mantém o valor direcional da preposição e translitera o topônimo.
- source_word: ἄφνω
  choice: de repente
  rationale: Transmite diretamente o caráter súbito da manobra.
- source_word: κατελάβετο
  choice: tomou
  rationale: No contexto militar, indica a conquista ou tomada da cidade; a formulação é clara e corrente em português.
- source_word: πᾶν ἀρσενικόν
  choice: todos os homens
  rationale: No relato de guerra, verte de modo natural a referência coletiva aos indivíduos do sexo masculino, sem atenuar a abrangência da afirmação.
- source_word: ἐν στόματι ῥομφαίας
  choice: ao fio da espada
  rationale: Equivalente idiomático tradicional e compreensível do grego literal 'na boca da espada'.
- source_word: τὰ σκῦλα
  choice: os despojos
  rationale: Termo português digno e preciso para bens tomados em guerra.
- source_word: ἐνέπρησεν αὐτὴν πυρί
  choice: incendiou a cidade
  rationale: Comunica naturalmente que a cidade foi queimada com fogo, evitando uma redundância pouco idiomática em português.
