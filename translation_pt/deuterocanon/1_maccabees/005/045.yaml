  yaml_path: translation/deuterocanon/1_maccabees/005/045.yaml
  text: And Judas gathered all Israel who were in Gilead[a], from the least to the greatest, along with their wives and their children and their baggage, a very great company, to come into the land of Judah.
translation:
  language: pt
  text: Judas reuniu todos os israelitas que estavam em Galaad, do menor ao maior, juntamente com suas mulheres, seus filhos e sua bagagem — um grupo muitíssimo grande[a] —, para entrarem na terra de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um acampamento muitíssimo grande». A palavra grega παρεμβολή pode designar um acampamento, sobretudo em contextos militares, mas aqui também pode referir-se de modo amplo ao grupo reunido, com famílias e bagagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: reuniu
  rationale: O aoristo de συνάγω descreve Judas ajuntando as pessoas; «reuniu» é direto, natural e não acrescenta uma conotação militar.
- source_word: πάντα Ἰσραὴλ τοὺς ἐν τῇ Γαλααδίτιδι
  choice: todo o Israel que estava em Galaad
  rationale: Conserva a expressão coletiva do grego, que aqui designa os israelitas presentes na região, sem transformar «Israel» numa referência abstrata à nação inteira.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: do menor ao maior
  rationale: Mantém a fórmula abrangente do original, sem restringi-la indevidamente à idade, como faria «dos jovens aos idosos».
- source_word: τὰς γυναῖκας αὐτῶν
  choice: suas mulheres
  rationale: No contexto familiar, γυναῖκες indica as mulheres ou esposas dos israelitas. «Suas mulheres» preserva essa relação e permanece compreensível em português amplo.
- source_word: ἀποσκευήν
  choice: bagagem
  rationale: ἀποσκευή refere-se aos bens e volumes transportados por um grupo em viagem; «bagagem» é a equivalência mais direta no contexto.
- source_word: παρεμβολὴν μεγάλην σφόδρα
  choice: um grupo muitíssimo grande
  rationale: A expressão resume em aposição toda a coletividade, que inclui famílias e bagagem. «Grupo» funciona naturalmente no contexto, enquanto a nota conserva o possível sentido técnico de «acampamento».
- source_word: ἐλθεῖν εἰς γῆν Ἰούδα
  choice: para irem à terra de Judá
  rationale: O infinitivo indica a finalidade do ajuntamento. O plural «irem» torna explícito, em português natural, que o grupo reunido se deslocaria para Judá.
