  text: And they seized the city[a], and they burned the temple precinct with fire, together with all who were in it; and Karnain was routed, and it could no longer stand before Judas.
translation:
  language: pt
  text: E eles tomaram a cidade e incendiaram o recinto sagrado, juntamente com todos os que estavam nele[a]; e Carnaim foi derrotada e já não pôde resistir diante de Judas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com tudo o que havia nele”. A expressão grega pode ter sentido mais amplo, embora, neste contexto, provavelmente se refira às pessoas que estavam dentro do recinto sagrado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκατελάβοντο
  choice: tomaram
  rationale: No contexto militar, o verbo indica tomar posse da cidade; o valor de προ- não precisa ser explicitado de modo artificial em português.
- source_word: τὸ τέμενος
  choice: o recinto sagrado
  rationale: τέμενος designa a área consagrada ou o recinto do santuário, não apenas o edifício do templo.
- source_word: ἐνεπύρισαν ἐν πυρί
  choice: incendiaram
  rationale: A expressão grega é enfática e redundante; o verbo português comunica naturalmente que puseram fogo ao recinto.
- source_word: σὺν πᾶσιν τοῖς οὖσιν ἐν αὐτῷ
  choice: juntamente com todos os que estavam nele
  rationale: A leitura mais provável no relato é pessoal, referindo-se aos que estavam dentro do recinto, sem ocultar em nota a possibilidade de sentido mais amplo.
- source_word: ἐτροπώθη
  choice: foi derrotada
  rationale: O passivo tem sentido militar de ser posta em fuga ou desbaratada; 'foi derrotada' é claro e natural em português.
- source_word: Καρναῒν
  choice: Carnaim
  rationale: Forma portuguesa tradicional e legível do topônimo grego.
- source_word: οὐκ ἐδύνατο ἔτι ὑποστῆναι
  choice: já não pôde resistir
  rationale: No contexto de combate, ὑποστῆναι significa manter posição ou oferecer resistência.
- source_word: κατὰ πρόσωπον Ἰούδα
  choice: diante de Judas
  rationale: Reproduz com naturalidade o idioma grego de confronto direto sem forçar a expressão literal 'face a face'.
