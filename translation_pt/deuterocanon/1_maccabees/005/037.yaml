  text: After these words[a], Timotheus gathered another camp and encamped opposite Raphon, beyond the stream.
translation:
  language: pt
  text: Depois dessas palavras, Timóteo reuniu outro acampamento e acampou diante de Rafon, do outro lado da torrente[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do outro lado do riacho sazonal” ou “além do uádi”; o termo grego pode designar um curso de água que corre sobretudo na estação chuvosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰ ῥήματα ταῦτα
  choice: Depois dessas palavras
  rationale: Mantém a referência mais direta ao que acaba de ser dito, preservando a transição temporal e a formulação grega de modo natural em português.
- source_word: συνήγαγεν
  choice: reuniu
  rationale: Expressa o ato de juntar ou congregar, sem explicitar além do grego se o referente concreto é o acampamento ou as forças nele reunidas.
- source_word: παρεμβολὴν ἄλλην
  choice: outro acampamento
  rationale: Conserva a imagem concreta de παρεμβολή e sua ligação com o verbo seguinte, embora o substantivo também possa designar, por extensão, a tropa acampada.
- source_word: παρενέβαλεν
  choice: acampou
  rationale: Equivalente militar claro e corrente para o ato de estabelecer acampamento.
- source_word: κατὰ πρόσωπον
  choice: diante de
  rationale: Reproduz a ideia espacial de estar em frente a ou defronte de um lugar, sem impor uma precisão geográfica maior do que a do grego.
- source_word: Ῥαφὼν
  choice: Rafon
  rationale: Transliteração natural do topônimo grego para a ortografia portuguesa.
- source_word: ἐκ πέραν τοῦ χειμάρρου
  choice: do outro lado da torrente
  rationale: ἐκ πέραν indica posição além ou do lado oposto; χειμάρρου designa um curso de água sujeito a cheias, como uma torrente ou leito sazonal.
