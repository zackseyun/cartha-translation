  text: But if we cross over and camp beyond the river[a], we will cross over to him.
translation:
  language: pt
  text: Mas, se atravessarmos e ele acampar do outro lado do rio, atravessaremos em direção a ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra ele”. A expressão grega indica movimento em direção a ele e, neste contexto de batalha, pode implicar um avanço para atacá-lo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέλθωμεν
  choice: atravessarmos
  rationale: O aoristo do subjuntivo depois de ἐὰν expressa uma condição futura; “atravessarmos” comunica com naturalidade o movimento de cruzar.
- source_word: παρεμβάλῃ
  choice: ele acampar
  rationale: Em contexto militar, o verbo significa montar acampamento. A forma grega está na terceira pessoa do singular, por isso se preserva “ele”, em vez de assimilá-la ao “nós” do verbo anterior.
- source_word: πέραν τοῦ ποταμοῦ
  choice: do outro lado do rio
  rationale: A expressão indica o lado além do rio; esta formulação é natural e espacialmente clara em português.
- source_word: διαπεράσομεν
  choice: atravessaremos
  rationale: O futuro indica a travessia subsequente. A repetição de “atravessar” reflete a repetição lexical e a sequência tática do grego.
- source_word: πρὸς αὐτόν
  choice: em direção a ele
  rationale: A expressão marca movimento na direção de uma pessoa. A tradução mantém o valor direcional sem apagar a possível força hostil sugerida pelo contexto militar.
