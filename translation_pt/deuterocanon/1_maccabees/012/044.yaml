  yaml_path: translation/deuterocanon/1_maccabees/012/044.yaml
  text: And he said to Jonathan[a], “Why have you cut down all this people, when no war is pressing upon us?”
translation:
  language: pt
  text: 'E ele disse a Jônatas: “Por que você abateu[a] todo este povo, quando nenhuma guerra nos ameaça?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “cortou”. Neste contexto, a expressão também pode significar “derrubou”, “golpeou” ou “eliminou”. A formulação grega da pergunta é um tanto abrupta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκοψας
  choice: abateu
  rationale: O aoristo de κόπτω significa literalmente “cortar” e pode, neste contexto, sugerir derrubar, golpear ou eliminar pessoas. “Abateu” conserva a imagem violenta sem afirmar de modo mais específico do que o grego se houve extermínio total.
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: todo este povo
  rationale: λαός designa normalmente “povo”, não especificamente “exército”. A expressão singular com demonstrativo é vertida de forma direta e natural.
- source_word: πολέμου μὴ ἐνεστῶτος ἡμῖν
  choice: se nenhuma guerra nos ameaça
  rationale: A construção expressa que a guerra não está presente, não sobreveio ou não pesa sobre eles. “Nos ameaça” comunica essa ideia em português atual e idiomático.
- source_word: Τίνα τί
  choice: Por que
  rationale: A sequência interrogativa transmitida é abrupta, mas funciona no contexto como uma pergunta pela razão. “Por que” reproduz seu sentido sem imitar uma irregularidade grega que obscureceria a frase em português.
- source_word: τῷ Ἰωναθάν
  choice: a Jônatas
  rationale: O dativo marca o destinatário da fala; emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção acessível ao leitor brasileiro e compreensível internacionalmente. O uso de “você” evita a flexão regional de “tu” e mantém a fala direta natural.
