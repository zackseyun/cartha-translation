lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: nos alegramos
  rationale: A forma expressa alegria ou regozijo; «nos alegramos» é natural em português moderno e preserva a força verbal.
- source_word: δὲ
  choice: Mas
  rationale: δέ introduz aqui contraste ou transição leve; «Mas» mantém essa conexão no contexto.
- source_word: ἐπὶ
  choice: com
  rationale: Com o dativo, ἐπί pode indicar a base ou o motivo da alegria. Em português, «alegrar-se com» é idiomático e deixa aberta a nuance entre ocasião e causa.
- source_word: τῇ δόξῃ
  choice: a glória
  rationale: δόξα denota aqui a condição honrada, honra ou boa reputação dos destinatários. «Glória» é o equivalente mais direto, enquanto a nota registra alternativas contextuais.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Representa com clareza o possessivo da segunda pessoa do plural em português moderno de ampla legibilidade brasileira.
