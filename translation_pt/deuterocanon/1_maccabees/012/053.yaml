base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/053.yaml
  text: And all the nations around them sought to wipe them out[a], for they said, “They have no man to rule and help them. Now then[c][b], let us make war against them and remove their memory from among men.”
translation:
  language: pt
  text: 'E todas as nações ao redor deles procuraram exterminá-los[a], pois disseram: “Eles não têm homem que os governe e os ajude[b]. Agora, pois, façamos guerra contra eles e apaguemos do meio da humanidade a sua lembrança[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apagá-los”; o verbo grego transmite a ideia de erradicação completa.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “não têm homem governando-os e ajudando-os”; alternativamente, “não têm governante que os conduza e os ajude”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “eliminemos a memória deles dentre os seres humanos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησαν
  choice: procuraram
  rationale: O aoristo de ζητέω seguido de infinitivo expressa aqui iniciativa e intenção; “procuraram” conserva essa nuance sem reduzir a frase a mero desejo.
- source_word: πάντα τὰ ἔθνη τὰ κύκλῳ αὐτῶν
  choice: todas as nações ao redor deles
  rationale: ἔθνη designa os povos ou nações vizinhos; “nações” é neutro e adequado ao contexto histórico.
- source_word: ἐκτρῖψαι
  choice: exterminá-los
  rationale: O verbo transmite a ideia forte de erradicar ou apagar por completo; “exterminá-los” é natural em português e mantém a força da ameaça.
- source_word: ἄνδρα ἄρχοντα καὶ βοηθοῦντα
  choice: homem que os governe e os ajude
  rationale: Mantém o substantivo masculino explícito ἄνδρα e apresenta de modo natural em português os dois particípios coordenados, governar e ajudar.
- source_word: πολεμήσωμεν
  choice: façamos guerra contra eles
  rationale: O subjuntivo exortativo convoca hostilidades organizadas; “façamos guerra” conserva o valor amplo do verbo.
- source_word: ἐξαροῦμεν ἐξ ἀνθρώπων τὸ μνημόσυνον αὐτῶν
  choice: apaguemos do meio da humanidade a sua lembrança
  rationale: A expressão comunica a eliminação total da memória coletiva do povo. “Humanidade” traduz naturalmente o plural genérico ἀνθρώπων, enquanto “lembrança” preserva o sentido de μνημόσυνον.
theological_decisions:
- issue: Linguagem de gênero na fala hostil
  choice: Manter “homem” para ἄνδρα e usar “humanidade” para o plural genérico ἀνθρώπων
  alternative: “Eles não têm líder... apaguemos do meio dos homens a sua lembrança”
  rationale: ἄνδρα é explicitamente masculino e, no contexto, destaca a ausência de um governante homem. Já ἀνθρώπων tem sentido coletivo e genérico; “humanidade” comunica esse alcance em português atual sem alterar a referência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe da fala direta permanece firme e solene; “agora, portanto” representa νῦν οὖν sem coloquialismo excessivo.
