base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/010.yaml
  text: We have tried to renew the brotherhood and friendship with you by sending word[a], so that we might not become estranged from you; for many times have passed since you sent to us.
translation:
  language: pt
  text: Tentamos enviar uma mensagem para renovar a fraternidade e a amizade com vocês, para não nos tornarmos distantes de vocês; pois muitos períodos[a] se passaram desde que vocês nos enviaram uma mensagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “muitos tempos”. O grego καιροί refere-se de modo amplo a intervalos, ocasiões ou tempos determinados, não necessariamente a estações literais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: Procuramos
  rationale: Expressa a tentativa ou esforço indicado pelo aoristo de πειράω, em português natural, sem afirmar que a ação foi plenamente realizada.
- source_word: ἀποστεῖλαι
  choice: enviar uma mensagem
  rationale: O infinitivo significa literalmente “enviar”; no contexto de correspondência diplomática, “uma mensagem” explicita com moderação o ato comunicativo implícito.
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: a fraternidade e a amizade com vocês
  rationale: Conserva os dois termos relacionais e diplomáticos, vertendo πρὸς ὑμᾶς de maneira idiomática.
- source_word: ἀνανεώσασθαι
  choice: renovar
  rationale: Indica tornar nova novamente uma relação previamente estabelecida, como convém ao contexto diplomático.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: a fim de não nos afastarmos de vocês
  rationale: Preserva a finalidade da construção e comunica naturalmente a ideia relacional de tornar-se alheio ou distanciado.
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: pois já se passaram muitos períodos
  rationale: Mantém o plural de καιροί e seu sentido amplo de intervalos ou ocasiões decorridos; “já se passaram” é idiomático em português.
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: desde que vocês enviaram uma mensagem a nós
  rationale: A expressão marca o tempo transcorrido desde um envio anterior. “Mensagem” reflete o contexto epistolar, sem especificar mensageiros.
