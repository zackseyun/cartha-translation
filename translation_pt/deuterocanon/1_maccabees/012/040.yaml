base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/040.yaml
  text: And he became afraid that Jonathan might not permit him and might make war against him[a], and he was seeking a way to seize him and kill him; and he set out and came to Beth-shan.
translation:
  language: pt
  text: E ele ficou com medo de que Jônatas não o deixasse agir[a] e travasse guerra contra ele; procurava um meio de capturá-lo e matá-lo; então partiu e foi a Bete-Seã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não o deixasse”. O grego não explicita o que Jônatas talvez não lhe permitisse fazer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐλαβήθη
  choice: ficou com medo
  rationale: O verbo pode indicar medo ou apreensão cautelosa. A expressão comunica com naturalidade a reação ingressiva do aoristo, sem introduzir o sentido de reverência que o verbo pode ter em outros contextos.
- source_word: μὴ ποτε οὐκ ἐάσῃ αὐτὸν
  choice: de que Jônatas não o deixasse agir[a]
  rationale: O grego apresenta Jônatas como sujeito e αὐτόν como objeto de ἐάω, mas deixa implícita a ação que talvez não fosse permitida. “Agir” torna a frase natural em português sem definir qual ação estava em vista; a nota registra a elipse.
- source_word: πολεμήσῃ πρὸς αὐτόν
  choice: travasse guerra contra ele
  rationale: Preserva o caráter militar de πολεμέω e é uma formulação corrente e digna em português.
- source_word: ἐζήτει πόρον
  choice: procurava um meio
  rationale: πόρος designa um caminho, recurso ou meio prático. “Um meio” abrange tanto o método quanto a oportunidade, enquanto o imperfeito é refletido por “procurava”.
- source_word: τοῦ συλλαβεῖν αὐτὸν τοῦ ἀποκτεῖναι
  choice: de capturá-lo e matá-lo
  rationale: Os infinitivos articulados expressam o objetivo da busca. “Capturar” evita a conotação de processo legal de “prender”, e “matar” traduz diretamente ἀποκτείνω.
- source_word: ἀπάρας
  choice: partiu
  rationale: O particípio indica a partida anterior à chegada, sem exigir que se especifique o levantamento de um acampamento.
- source_word: Βεθσά
  choice: Bete-Seã
  rationale: Emprega a forma portuguesa reconhecível do topônimo identificado com Bete-Seã, correspondente ao grego Βεθσά.
