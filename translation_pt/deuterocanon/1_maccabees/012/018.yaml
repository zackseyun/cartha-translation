lexical_decisions:
- source_word: ἐπολέμησαν
  choice: guerrearam contra
  rationale: O aoristo de πολεμέω descreve a ação de travar guerra ou manter hostilidades. “Guerrearam contra” expressa naturalmente o sentido militar e mantém a direção hostil indicada por ἡμᾶς.
- source_word: οἱ βασιλεῖς
  choice: os reis
  rationale: O artigo grego identifica um grupo definido de reis; sua manutenção é natural e clara em português.
- source_word: οἱ κύκλῳ ἡμῶν
  choice: ao nosso redor
  rationale: κύκλῳ com o genitivo indica localização circundante. “Ao nosso redor” preserva tanto a imagem espacial quanto o provável sentido geopolítico dos reis vizinhos, sem tornar este último explícito demais.
