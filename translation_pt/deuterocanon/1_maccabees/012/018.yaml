translation:
  language: pt
  text: E os reis ao nosso redor guerrearam contra nós.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lutaram contra nós”; o verbo grego pode ter o sentido militar mais amplo de travar guerra.'
