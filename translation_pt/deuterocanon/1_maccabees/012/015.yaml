base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/015.yaml
  text: Therefore we continually remember you at all times[a], at the festivals and on the other appointed days, when we offer sacrifices and in our prayers[b], as it is right and fitting to remember brothers.
translation:
  language: pt
  text: Portanto, em todo tempo nos lembramos continuamente de vocês, nas festas e nos demais dias de observância[a], quando oferecemos sacrifícios e em nossas orações, como é justo e apropriado lembrar-se dos irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos demais dias apropriados” ou “prescritos”. O grego se refere a dias considerados devidos ou próprios para observância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: continuamente
  rationale: Expressa constância reiterada sem exigir a ideia de uma ação literalmente ininterrupta, o que se ajusta ao contexto litúrgico.
- source_word: ἑορταῖς
  choice: festas
  rationale: Termo corrente e digno para as celebrações do calendário religioso.
- source_word: καθηκούσαις ἡμέραις
  choice: dias de observância
  rationale: Comunica que eram dias reconhecidos como próprios ou devidos para práticas religiosas, sem afirmar mais precisamente do que o grego se eram formalmente decretados.
- source_word: μνημονεύομεν ὑμῶν
  choice: nos lembramos de vocês
  rationale: Preserva tanto a lembrança quanto a menção litúrgica no contexto de sacrifícios e orações, em português natural.
- source_word: ἐφʼ ὧν προσφέρομεν θυσίων
  choice: nos sacrifícios que oferecemos
  rationale: Entende a construção grega, de ordem incomum, como referência aos sacrifícios nos quais os destinatários eram lembrados; esta leitura respeita o genitivo θυσίων e o relativo ὧν.
- source_word: προσευχαῖς
  choice: orações
  rationale: Equivalente direto e natural; o plural condiz com práticas litúrgicas repetidas.
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: como é justo e apropriado
  rationale: 'Mantém os dois aspectos da expressão: o que é devido e o que é conveniente ou adequado.'
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: Conserva o substantivo masculino plural e sua função de designação de parentesco coletivo entre as comunidades mencionadas.
theological_decisions:
- issue: Designação de parentesco ἀδελφῶν
  choice: irmãos
  alternative: parentes; irmãos e irmãs
  rationale: O grego usa o masculino plural como designação coletiva de parentesco étnico-político. O contexto não exige ampliação inclusiva nem substituição por um termo menos direto.
- issue: Lembrança no contexto cultual
  choice: nos lembramos de vocês ... nos sacrifícios ... e em nossas orações
  alternative: fazemos menção de vocês
  rationale: A tradução preserva a abertura semântica entre recordar e mencionar liturgicamente, enquanto o contexto de sacrifícios e orações torna perceptível a dimensão cultual.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém tom epistolar e litúrgico digno. A repetição de “em todo tempo” e “continuamente” foi preservada por corresponder à ênfase do texto grego. A construção sobre os sacrifícios segue diretamente a sintaxe e o sentido do original, em vez da leitura temporal adotada na camada inglesa.
