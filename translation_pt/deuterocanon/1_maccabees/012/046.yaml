  text: And trusting him, he did as he said, and sent out the forces, and they went away into the land of Judah.
translation:
  language: pt
  text: E, confiando nele, fez como ele havia dito e mandou embora as tropas; elas partiram para a terra de Judá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entraram na terra de Judá”; neste contexto de movimento, a preposição pode indicar tanto o destino quanto a entrada nele.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπιστεύσας αὐτῷ
  choice: confiando nele
  rationale: O particípio aoristo expressa a confiança depositada nele como circunstância que conduz às ações seguintes. A formulação é natural em português e não explicita além do grego se a nuance é estritamente temporal ou causal.
- source_word: ἐποίησεν καθὼς εἶπεν
  choice: fez como ele havia dito
  rationale: Reproduz a conformidade da ação com o que fora dito. O pronome mantém a referência contextual sem substituir o personagem por um nome, e o mais-que-perfeito composto torna clara a anterioridade no português corrente.
- source_word: ἐξαπέστειλεν τὰς δυνάμεις
  choice: mandou embora as tropas
  rationale: No contexto militar, δυνάμεις designa tropas, enquanto ἐξαπέστειλεν indica que foram enviadas para longe do local. A expressão evita afirmar que se tratava necessariamente do exército inteiro ou que estavam voltando para casa.
- source_word: ἀπῆλθον
  choice: partiram
  rationale: O verbo indica afastamento ou partida. “Partiram” transmite esse movimento de modo conciso e natural, sem a redundância de “foram embora” logo após “mandou embora”.
- source_word: εἰς γῆν Ἰούδα
  choice: para a terra de Judá
  rationale: γῆ Ἰούδα é vertido transparentemente como “terra de Judá”. Com verbo de movimento, εἰς pode indicar tanto o destino quanto a entrada nele; “para” é a opção portuguesa mais natural, com a alternativa registrada em nota.
