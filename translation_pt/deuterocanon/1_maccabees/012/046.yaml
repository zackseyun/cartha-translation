  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição pronominal conserva a referência contextual e a possível ambiguidade do grego, sem inserir nomes. O ponto e vírgula distingue a ordem dada às tropas da partida delas e evita uma sequência excessiva de conjunções.
