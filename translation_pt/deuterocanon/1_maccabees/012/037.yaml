  - severity: low
    issue: «restaurou» é possível, mas «reparou» é a equivalência mais direta de ἐπεσκεύασεν.
    rationale: O verbo descreve reparar ou consertar; «reparou» evita sugerir uma restauração mais ampla.
  - severity: low
    issue: A grafia «Chafenata» induz uma pronúncia portuguesa de «ch» diferente do som inicial grego.
    rationale: «Cafenata» oferece uma adaptação legível e foneticamente mais próxima, sem alegar identificar o lugar.
