  yaml_path: translation/deuterocanon/1_maccabees/012/037.yaml
  text: And they gathered to build[a], and the wall of the wadi on the east side fell[b], and he repaired what is called Chaphenatha.
translation:
  language: pt
  text: Eles se reuniram para construir, e uma parte da muralha junto à ravina a leste caiu[a]; e ele reparou o que é chamado Cafenata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego usa uma construção concisa: literalmente, “caiu [algo] da muralha da torrente/ravina a leste”. Ela pressupõe uma parte da muralha como sujeito. χείμαρρος pode indicar uma torrente sazonal ou a ravina por onde ela corre.'
    reason: lexical_alternative
  - marker: b
    text: Cafenata é a transliteração de um nome de lugar; o grego não esclarece que tipo de local ou estrutura era.
    reason: cultural_note
lexical_decisions:
- source_word: συνήχθησαν
  choice: se reuniram
  rationale: 'O aoristo passivo/médio de συνάγω tem aqui sentido intransitivo: o grupo se reuniu com determinada finalidade.'
- source_word: τοῦ οἰκοδομεῖν
  choice: para construir
  rationale: O infinitivo articular com τοῦ expressa finalidade. “Construir” evita acrescentar a ideia não explícita de reconstrução.
- source_word: ἔπεσεν τοῦ τείχους
  choice: um trecho da muralha ... desabou
  rationale: A construção grega é condensada e parece pressupor uma parte da muralha como sujeito. Em português, “um trecho” explicita apenas o mínimo necessário, e “desabou” é natural para a queda de uma muralha.
- source_word: τοῦ χειμάρρου
  choice: junto ao leito da torrente
  rationale: χείμαρρος pode designar uma torrente sazonal ou o leito/barranco por onde ela corre. A expressão escolhida comunica o dado geográfico sem recorrer ao termo menos difundido “uádi”.
- source_word: τοῦ ἐξ ἀπηλιώτου
  choice: no lado leste
  rationale: ἀπηλιώτης indica o leste ou o vento oriental; no contexto, a expressão localiza esse setor da muralha.
- source_word: ἐπεσκεύασεν
  choice: restaurou
  rationale: O verbo significa reparar ou restaurar. “Restaurou” funciona tanto para um local quanto para uma estrutura, cuja natureza o grego não especifica.
- source_word: τὸ καλούμενον Χαφεναθά
  choice: o que é chamado Chafenata
  rationale: O artigo neutro com o particípio não identifica se se trata de lugar ou estrutura. A formulação preserva essa indefinição, e o nome é transliterado de modo legível em português.
