translation:
  language: pt
  text: E enviou cartas aos espartanos e a outros lugares nos mesmos termos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com o mesmo teor» ou «da mesma forma». A expressão grega indica que essas cartas correspondiam, em conteúdo, à que acaba de ser mencionada.'
