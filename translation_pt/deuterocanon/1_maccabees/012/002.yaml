lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo ativo de ἀποστέλλω indica diretamente o ato de enviar; «enviou» é natural, claro e fiel ao grego.
- source_word: ἐπιστολὰς
  choice: cartas
  rationale: O acusativo plural indica várias cartas; «cartas» é a correspondência normal e transparente.
- source_word: πρὸς Σπαρτιάτας
  choice: aos espartanos
  rationale: Com verbo de envio, πρός assinala os destinatários; «aos espartanos» expressa isso de modo idiomático.
- source_word: τόπους ἑτέρους
  choice: a outros lugares
  rationale: A expressão significa literalmente «outros lugares»; evita atribuir ao texto uma especificidade política ou geográfica que ele não explicita.
- source_word: κατὰ ταὐτά
  choice: nos mesmos termos
  rationale: A expressão aponta para correspondência de conteúdo ou formulação com a comunicação anteriormente mencionada; «nos mesmos termos» preserva essa referência melhor que um simples «igualmente».
