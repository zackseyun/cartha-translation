  text: And he set out from Jerusalem and met them in the land of Hamath, for he gave them no respite to enter his land.
translation:
  language: pt
  text: Ele partiu de Jerusalém e foi ao encontro deles na região de Hamate, pois não lhes deu tempo para entrar em seu território.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: Expressa de modo natural o ato de sair de Jerusalém, sem acrescentar meio ou circunstância não presentes no grego.
- source_word: ἀπήντησεν αὐτοῖς
  choice: foi ao encontro deles
  rationale: Preserva o sentido ativo de deslocar-se para interceptá-los ou encontrá-los, com formulação idiomática em português.
- source_word: τὴν Ἀμαθεῖτιν χώραν
  choice: a região de Hamate
  rationale: Χώρα designa aqui uma região ou território; a forma tradicional e reconhecível do topônimo é “Hamate”.
- source_word: ἀνοχὴν
  choice: tempo
  rationale: No contexto, indica margem, trégua ou oportunidade concedida. “Não lhes deu tempo” comunica naturalmente que ele agiu antes que pudessem entrar.
- source_word: τοῦ ἐμβατεῦσαι εἰς τὴν χώραν αὐτοῦ
  choice: para entrar em seu território
  rationale: Traduz a finalidade ligada a ἀνοχή e distingue χώρα neste contexto como o território sob seu domínio.
