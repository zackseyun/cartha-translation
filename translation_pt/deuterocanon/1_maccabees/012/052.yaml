base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/052.yaml
  text: And they all came in peace into the land of Judah[a], and they mourned for Jonathan and those with him, and they were greatly afraid; and Israel mourned with great mourning.
translation:
  language: pt
  text: Todos chegaram em paz à terra de Judá, prantearam Jônatas e os que estavam com ele e ficaram com muito medo; e Israel fez grande lamentação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Israel lamentou uma grande lamentação”. O grego repete palavras da mesma raiz para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πάντες
  choice: Todos chegaram
  rationale: O aoristo de ἔρχομαι descreve a chegada de volta ao território de Judá; a anteposição de “Todos” preserva a abrangência explícita de πάντες.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Mantém a forma da expressão grega e comunica tanto uma chegada pacífica quanto segura, sem escolher apenas um desses matizes.
- source_word: εἰς γῆν Ἰούδα
  choice: à terra de Judá
  rationale: Reproduz o sentido territorial de γῆ Ἰούδα e evita a nuance provincial posterior que “Judeia” poderia sugerir.
- source_word: ἐπένθησαν τὸν Ἰωνάθαν
  choice: prantearam Jônatas
  rationale: “Prantear” expressa luto solene por alguém e permite conservar Jônatas como objeto direto, conforme a construção grega, sem acrescentar explicitamente sua morte.
- source_word: τοὺς μετʼ αὐτοῦ
  choice: os que estavam com ele
  rationale: Preserva a referência aberta aos associados de Jônatas, sem defini-los mais especificamente como soldados, companheiros ou seguidores.
- source_word: ἐφοβήθησαν σφόδρα
  choice: ficaram com muito medo
  rationale: Expressão atual e clara que conserva a forte intensidade de σφόδρα.
- source_word: ἐπένθησεν Ἰσραὴλ πένθος μέγα
  choice: Israel fez grande lamentação
  rationale: Comunica o luto coletivo e retém a ênfase do substantivo cognato grego em português natural e solene.
