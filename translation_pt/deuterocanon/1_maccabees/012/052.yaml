translation_notes:
  register: Português moderno, claro e solene, com sintaxe narrativa fluente. “Prantearam” conserva o caráter público e fúnebre do verbo grego sem afirmar além do texto que Jônatas já estivesse morto. A expressão cognata final é apresentada de modo natural no texto e explicada literalmente em nota.
