    issue: «quando souberam» acrescenta uma ligação temporal explícita.
    rationale: O texto grego diz simplesmente «e souberam/reconheceram ...; e encorajaram-se ...». A coordenação deve ser preservada sem apresentar a segunda ação como consequência temporal formal da primeira.
  - severity: medium
    issue: «assim como os que estavam com ele» deixa impreciso o alcance da elipse.
    rationale: Na redação portuguesa, a comparação pode sugerir que os acompanhantes também foram capturados e pereceram. É mais seguro explicitar que eles também haviam perecido, sem estender a captura a eles.
  revised_text: E souberam que ele havia sido capturado e perecido, e que os que estavam com ele também haviam perecido; encorajaram uns aos outros[a] e seguiram em formação cerrada, prontos para a batalha.
