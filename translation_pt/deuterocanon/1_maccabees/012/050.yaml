base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/050.yaml
  text: And they learned that he had been captured and had perished[a], and those with him; and they encouraged one another and went on in close formation, ready for battle.
translation:
  language: pt
  text: E souberam que ele havia sido capturado e perecido, e que os que estavam com ele também haviam perecido; encorajaram uns aos outros[a] e seguiram em formação cerrada, prontos para a batalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ganharam coragem”. O grego diz literalmente “encorajaram a si mesmos”, expressão reflexiva que, neste contexto coletivo, indica fortalecimento mútuo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: souberam
  rationale: No contexto narrativo, o verbo indica que chegaram a saber ou tomaram conhecimento do ocorrido; “souberam” é natural e direto.
- source_word: συνελήμφθη
  choice: havia sido capturado
  rationale: O aoristo passivo de συλλαμβάνω descreve alguém que foi preso ou capturado; o contexto militar favorece “capturado”.
- source_word: ἀπώλωλεν
  choice: perecido
  rationale: O perfeito de ἀπόλλυμι pode significar que alguém pereceu, morreu ou foi destruído. “Perecido” preserva a gravidade sem especificar o modo da morte.
- source_word: οἱ μετʼ αὐτοῦ
  choice: os que estavam com ele
  rationale: Mantém a amplitude da expressão grega sem acrescentar uma identificação que o texto não explicita.
- source_word: παρεκάλεσαν ἑαυτούς
  choice: encorajaram uns aos outros
  rationale: Embora a construção seja literalmente reflexiva, em referência a um grupo ela exprime naturalmente fortalecimento mútuo.
- source_word: ἐπορεύοντο
  choice: seguiram
  rationale: Traduz o verbo comum de movimento de modo fluente; o caráter militar é dado pelas expressões seguintes.
- source_word: συνεστραμμένοι
  choice: em formação cerrada
  rationale: O particípio comunica a ideia de estarem agrupados compactamente, adequada ao contexto de tropas preparadas para o combate.
- source_word: ἕτοιμοι εἰς πόλεμον
  choice: prontos para a batalha
  rationale: Expressão militar clara e idiomática; “batalha” se ajusta melhor à situação imediata do que o sentido mais amplo de “guerra”.
