translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A conexão causal de γάρ é mantida por “Pois”, e a consequência prática é explicitada naturalmente por “por isso”, sem alterar o conteúdo.
