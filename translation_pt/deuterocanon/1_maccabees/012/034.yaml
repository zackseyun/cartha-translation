  yaml_path: translation/deuterocanon/1_maccabees/012/034.yaml
  text: For he heard that they intended to hand over the stronghold to those on Demetrius's side, and he stationed a garrison there so that they might guard it.
translation:
  language: pt
  text: Pois ele ouviu que pretendiam entregar a fortaleza aos partidários de Demétrio e colocou ali uma guarnição para que a guardassem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: ouviu dizer
  rationale: Expressa naturalmente, em português, que ele recebeu essa informação, preservando o valor direto de ἀκούω.
- source_word: βούλονται
  choice: pretendiam
  rationale: No contexto político-militar, comunica uma intenção concreta sem afirmar que o plano já estava decidido ou em execução.
- source_word: τὸ ὀχύρωμα
  choice: a fortaleza
  rationale: ὀχύρωμα designa um local fortificado; “fortaleza” é claro, corrente e adequado ao contexto.
- source_word: παραδοῦναι
  choice: entregar
  rationale: Indica a transferência do controle do lugar, sem acrescentar a conotação mais específica de capitulação presente em “render”.
- source_word: τοῖς παρὰ Δημητρίου
  choice: aos partidários de Demétrio
  rationale: Representa os associados ou aliados de Demétrio sem restringi-los necessariamente a soldados.
- source_word: ἔθετο
  choice: colocou
  rationale: Com “guarnição” como objeto e “ali” como complemento, “colocou” expressa de modo natural o destacamento da força no local.
- source_word: φρουράν
  choice: uma guarnição
  rationale: Aqui φρουρά se refere à força militar deixada para guardar o lugar, e não apenas à atividade de vigiar.
- source_word: ὅπως φυλάσσωσιν αὐτήν
  choice: para protegê-la
  rationale: A construção expressa finalidade. “Protegê-la” comunica de modo natural a função de guardar e conservar a fortaleza sob controle.
