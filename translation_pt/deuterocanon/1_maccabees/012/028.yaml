base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/028.yaml
  text: And when the adversaries heard that Jonathan and those with him were prepared for war[a], they were afraid and lost heart, and they lit fires in their camp.
translation:
  language: pt
  text: Quando os adversários souberam que Jônatas e os que estavam com ele estavam preparados para a guerra, ficaram com medo, perderam a coragem[a] e acenderam fogueiras em seu acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “endureceram” ou “congelaram o coração”, expressão que indica desânimo ou perda de coragem.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὑπεναντίοι
  choice: os adversários
  rationale: Expressa os que se opunham a Jônatas sem acrescentar uma especificação além do contexto militar.
- source_word: ἡτοίμασται
  choice: se encontravam preparados
  rationale: Reproduz o estado resultante de prontidão indicado pela forma perfeita, com concordância natural em português para Jônatas e seus acompanhantes.
- source_word: οἱ παρʼ αὐτοῦ
  choice: os que estavam com ele
  rationale: Mantém a referência abrangente e próxima do grego, sem acrescentar explicitamente “homens” ou “soldados”.
- source_word: εἰς πόλεμον
  choice: para a guerra
  rationale: É a correspondência direta da expressão e evita restringi-la a uma única batalha.
- source_word: ἐφοβήθησαν
  choice: ficaram com medo
  rationale: Formulação corrente em português que comunica o ingresso no estado de temor.
- source_word: ἔπηξαν τὴν καρδίαν αὐτῶν
  choice: perderam a coragem[a]
  rationale: Comunica de modo natural o sentido idiomático de desânimo ou perda de ânimo; a imagem concreta e sua ambiguidade lexical são preservadas na nota.
- source_word: ἀνέκαυσαν πυρὰς
  choice: acenderam fogueiras
  rationale: Traduz o ato de atear ou reacender fogos no contexto de um acampamento; “fogueiras” é mais idiomático que o genérico “fogos”.
- source_word: ἐν τῇ παρεμβολῇ αὐτῶν
  choice: em seu acampamento
  rationale: No contexto militar, παρεμβολή designa o acampamento das tropas.
