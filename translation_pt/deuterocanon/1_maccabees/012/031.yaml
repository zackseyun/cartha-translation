  text: Então Jônatas desviou-se para atacar os árabes chamados zabadeus, feriu-os e tomou os despojos deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέκλινεν
  choice: desviou-se para atacar
  rationale: Preserva a ideia básica de mudar ou desviar o rumo e, pelo contexto militar, explicita naturalmente em português que Jônatas redirecionou seu movimento para um ataque.
- source_word: Ἀράβας
  choice: árabes
  rationale: É o equivalente moderno e natural para o plural que designa esse povo ou grupo.
- source_word: τοὺς καλουμένους
  choice: chamados
  rationale: Reproduz de modo conciso e direto o particípio grego que identifica o nome do grupo.
- source_word: Ζαβαδαίους
  choice: zabadeus
  rationale: Transliteração adaptada à morfologia e à ortografia portuguesa para o etnônimo grego.
- source_word: ἐπάταξεν
  choice: feriu-os
  rationale: Mantém o sentido direto de golpear ou ferir no contexto de combate, sem ampliar necessariamente para 'derrotou-os'.
- source_word: σκῦλα
  choice: despojos
  rationale: Termo português claro e digno para bens tomados do inimigo em guerra.
