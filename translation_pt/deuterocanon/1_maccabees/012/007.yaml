base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/007.yaml
  text: Even earlier[a], letters were sent to Onias the high priest from Areus, who was ruling among you, saying, ‘You are our brothers,’ as the copy laid out here shows.
translation:
  language: pt
  text: 'Já anteriormente, foram enviadas cartas a Onias, o sumo sacerdote, da parte de Areu, que reinava entre vocês, dizendo: “Vocês são nossos irmãos”, como mostra a cópia apresentada a seguir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como mostra a cópia apresentada aqui”. A expressão grega indica que uma cópia da carta anterior é apresentada ou anexada ao texto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι πρότερον
  choice: Já anteriormente
  rationale: Reproduz a ênfase temporal da expressão grega e indica que a correspondência ocorreu antes da presente.
- source_word: ἀπεστάλησαν ἐπιστολαὶ
  choice: foram enviadas cartas
  rationale: Mantém o plural de ἐπιστολαί e a construção passiva do grego em português natural.
- source_word: πρὸς Ὀνίαν τὸν ἀρχιερέα
  choice: a Onias, o sumo sacerdote
  rationale: Expressa o destinatário e conserva o título em aposição clara.
- source_word: παρὰ δʼ Ἀρείου
  choice: da parte de Areu
  rationale: παρά com genitivo indica aqui a origem ou o remetente das cartas; “da parte de” evita a possível ambiguidade de “por”.
- source_word: τοῦ βασιλεύοντος ἐν ὑμῖν
  choice: que reinava entre vocês
  rationale: Conserva a força verbal do particípio e traduz de perto ἐν ὑμῖν sem convertê-lo necessariamente em “sobre vocês”.
- source_word: ὅτι ἐστὲ ἀδελφοὶ ἡμῶν
  choice: 'dizendo: “Vocês são nossos irmãos”'
  rationale: Entende ὅτι como introdutor do conteúdo da mensagem e mantém a metáfora explícita de parentesco entre os povos.
- source_word: ὡς τὸ ἀντίγραφον ὑπόκειται
  choice: como mostra a cópia apresentada a seguir
  rationale: ἀντίγραφον designa uma cópia ou transcrição documental, e ὑπόκειται indica que ela é apresentada no texto subsequente.
