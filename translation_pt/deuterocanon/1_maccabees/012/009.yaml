  yaml_path: translation/deuterocanon/1_maccabees/012/009.yaml
  text: And so we also[a], though having no need of these things, have the holy books that are in our hands as encouragement[b],
translation:
  language: pt
  text: Assim, também nós, embora não precisemos dessas coisas, temos como encorajamento[a] os livros sagrados que estão em nossas mãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consolo” ou “conforto”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os livros sagrados que estão em nossas mãos”; a expressão provavelmente se refere aos escritos sagrados de Israel que estavam em sua posse.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπροσδεεῖς
  choice: não precisemos
  rationale: Expressa de modo natural o sentido de não ter necessidade de algo, sem sugerir autossuficiência absoluta.
- source_word: τούτων
  choice: dessas coisas
  rationale: Mantém a referência geral e neutra do pronome grego ao que foi mencionado no contexto.
- source_word: παράκλησιν
  choice: encorajamento
  rationale: Abrange a ideia de fortalecimento e ânimo proporcionados pelos livros sagrados; o termo também pode denotar consolo.
- source_word: τὰ βιβλία τὰ ἅγια
  choice: os livros sagrados
  rationale: Segue de perto a expressão grega e evita restringi-la interpretativamente a um cânon definido.
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: que estão em nossas mãos
  rationale: Preserva a imagem concreta do grego, que comunica posse e acesso imediato.
theological_decisions:
- issue: Referência dos “livros sagrados”
  choice: Manter a expressão ampla “livros sagrados”
  alternative: “Sagradas Escrituras” ou uma referência genérica a documentos religiosos
  rationale: O contexto favorece os escritos sagrados de Israel, mas o grego diz literalmente “livros sagrados”; a formulação escolhida preserva essa amplitude sem definir além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase permanece próxima do grego, enquanto “embora não precisemos” torna natural a construção participial.
