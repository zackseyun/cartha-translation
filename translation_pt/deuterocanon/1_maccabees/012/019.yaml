  text: Therefore we did not wish to trouble you and the rest of our allies and friends in these wars[a].
translation:
  language: pt
  text: Por isso, não quisemos incomodar vocês e os nossos demais aliados e amigos nestas guerras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobrecarregar vocês e os nossos demais aliados e amigos nestes conflitos”. O verbo grego pode significar incomodar, perturbar ou impor uma carga; aqui, provavelmente se refere a um encargo diplomático ou militar, e não a mera irritação pessoal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἠβουλόμεθα
  choice: não quisemos
  rationale: O imperfeito de βούλομαι expressa vontade ou intenção no passado. “Não quisemos” é natural em português e preserva o caráter deliberado da decisão.
- source_word: οὖν
  choice: Por isso
  rationale: Indica uma conclusão ou consequência ligada ao contexto anterior; “Por isso” comunica essa relação com naturalidade.
- source_word: παρενοχλεῖν
  choice: incomodar
  rationale: O verbo pode indicar causar incômodo, perturbar ou impor uma carga. “Incomodar” mantém a amplitude do termo sem sugerir hostilidade excessiva.
- source_word: ὑμῖν
  choice: vocês
  rationale: Pronome da segunda pessoa do plural, referente aos destinatários da carta. “Vocês” oferece leitura clara e corrente, sobretudo para leitores brasileiros.
- source_word: τοὺς λοιποὺς
  choice: os demais
  rationale: Distingue os outros participantes além dos destinatários; “os demais” é claro e preserva essa relação.
- source_word: συμμάχους
  choice: aliados
  rationale: Equivalente político-militar direto para os que estão unidos por aliança.
- source_word: φίλους
  choice: amigos
  rationale: Preserva o sentido básico de φίλοι e permite que o contexto diplomático forneça sua nuance política.
- source_word: ἐν τοῖς πολέμοις τούτοις
  choice: nestas guerras
  rationale: Mantém o plural de πολέμοις e apresenta as guerras como a esfera em que os destinatários seriam incomodados ou envolvidos.
