  yaml_path: translation/deuterocanon/1_maccabees/012/004.yaml
  text: And they gave them letters to the people in each place[b][a], so that they might send them on to the land of Judah in peace.
translation:
  language: pt
  text: E deram-lhes cartas para as pessoas de cada lugar[a], para que estas os encaminhassem[b] em paz até a terra de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lugar por lugar”. A expressão indica cartas destinadas às pessoas ou autoridades locais ao longo do caminho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os escoltassem adiante”. O verbo grego pode incluir a ideia de acompanhar viajantes e ajudá-los a prosseguir viagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν
  choice: deram
  rationale: Reproduz de modo direto o aoristo de δίδωμι e se ajusta ao estilo narrativo.
- source_word: ἐπιστολὰς
  choice: cartas
  rationale: É o sentido comum de ἐπιστολή e designa naturalmente comunicações escritas.
- source_word: αὐτοῖς ... πρὸς αὐτοὺς
  choice: a eles ... dirigidas às pessoas
  rationale: Distingue os viajantes que receberam as cartas de seus destinatários locais, tornando claros os referentes dos pronomes gregos sem identificar indevidamente os destinatários como autoridades.
- source_word: κατὰ τόπον
  choice: de cada lugar
  rationale: Preserva o valor distributivo da expressão, isto é, cartas destinadas, lugar por lugar, às pessoas encontradas ao longo do percurso.
- source_word: ὅπως
  choice: para que
  rationale: Expressa claramente a finalidade introduzida pela conjunção grega.
- source_word: προπέμπωσιν
  choice: encaminhassem
  rationale: Comunica a ideia de ajudar viajantes a prosseguir, sem limitar o verbo à mera expedição nem afirmar que houve necessariamente escolta durante todo o trajeto.
- source_word: γῆν Ἰούδα
  choice: terra de Judá
  rationale: Mantém a forma concreta da expressão grega, em vez de substituí-la pelo nome regional 'Judeia'.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Preserva a expressão do original e, no contexto de viagem, sugere chegada segura e sem impedimentos.
