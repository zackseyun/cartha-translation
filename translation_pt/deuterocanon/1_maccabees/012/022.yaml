  text: And now[a], since we have learned these things, you will do well to write to us concerning your peace.
translation:
  language: pt
  text: E agora, visto que soubemos dessas coisas, vocês farão bem em nos escrever a respeito da paz de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a respeito do bem-estar de vocês”. A palavra grega traduzida como “paz” também pode ter o sentido de bem-estar.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Mantém tanto o conectivo como a referência temporal que dão continuidade à carta.
- source_word: ἀφʼ οὗ
  choice: visto que
  rationale: 'Expressa de modo natural o valor causal-temporal da locução neste contexto: o pedido decorre do que eles ficaram sabendo.'
- source_word: ἔγνωμεν
  choice: soubemos
  rationale: O aoristo de γινώσκω indica que os remetentes tomaram conhecimento das informações mencionadas; o pretérito perfeito é idiomático em português.
- source_word: ταῦτα
  choice: dessas coisas
  rationale: Retoma no plural as informações anteriormente comunicadas, com referência discursiva natural em português.
- source_word: καλῶς ποιήσετε
  choice: vocês farão bem
  rationale: Reproduz a fórmula epistolar que recomenda cortesmente uma ação, em linguagem atual e clara.
- source_word: γράφοντες ἡμῖν
  choice: em nos escrever
  rationale: O gerúndio grego especifica a ação por meio da qual os destinatários farão bem; a construção portuguesa preserva essa relação.
- source_word: περὶ τῆς εἰρήνης ὑμῶν
  choice: a respeito de sua paz
  rationale: Preserva o equivalente lexical direto de εἰρήνη e sua adequação ao contexto diplomático, sem excluir o sentido possível de bem-estar.
