revisions:
- from: Procuramos enviar-lhes uma mensagem para renovar a fraternidade e a amizade que temos com vocês, a fim de não nos tornarmos estranhos uns aos outros, pois já se passou muito tempo[a] desde que vocês nos enviaram uma mensagem.
  to: Procuramos enviar-lhes algo para renovar nossa fraternidade e amizade com vocês, a fim de não nos afastarmos de vocês; pois já se passou muito tempo[a] desde que vocês nos enviaram algo.
  rationale: A revisão evita especificar o conteúdo do envio, que o grego deixa implícito, usando “algo” para conservar a elipse de modo legível em português. Também substitui a formulação recíproca por “não nos afastarmos de vocês”, que transmite a finalidade de evitar alienação sem ampliar o referente do genitivo grego. Mantêm-se os termos relacionais centrais e a nota sobre o plural καιροί.
