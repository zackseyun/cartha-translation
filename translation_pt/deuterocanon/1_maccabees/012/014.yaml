base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/014.yaml
  text: We have tried to send to you and renew the brotherhood and friendship[a], so that we might not become estranged from you; for many years have passed since you sent to us.
translation:
  language: pt
  text: Procuramos enviar-lhes algo para renovar nossa fraternidade e amizade com vocês, a fim de não nos afastarmos de vocês; pois já se passou muito tempo[a] desde que vocês nos enviaram algo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “muitos tempos” ou “muitos períodos se passaram”.
    reason: O grego emprega o plural καιροί, que pode designar tempos, períodos ou ocasiões; a tradução corrente em português usa o singular coletivo “muito tempo”.
lexical_decisions:
- source_word: ἐπειράθημεν
  choice: Procuramos
  rationale: Expressa a tentativa ou o esforço deliberado do aoristo sem afirmar que a ação necessariamente teve pleno êxito.
- source_word: ἀποστεῖλαι
  choice: enviar-lhes uma mensagem
  rationale: O verbo significa “enviar”, mas o objeto está elíptico no grego. Em português, “uma mensagem” fornece o complemento exigido pelo uso natural no contexto de correspondência diplomática, sem especificar carta ou emissários.
- source_word: τὴν πρὸς ὑμᾶς ἀδελφότητα καὶ φιλίαν
  choice: a fraternidade e a amizade que temos com vocês
  rationale: Preserva os dois termos relacionais e torna explícita, em português idiomático, a relação indicada por πρὸς ὑμᾶς, sem transformar fraternidade em parentesco biológico.
- source_word: ἀνανεώσασθαι
  choice: renovar
  rationale: Indica reavivar ou tornar vigente novamente uma relação já existente, adequado ao contexto diplomático.
- source_word: πρὸς τὸ μὴ ἐξαλλοτριωθῆναι ὑμῶν
  choice: a fim de não nos tornarmos estranhos uns aos outros
  rationale: A construção expressa finalidade, e o verbo descreve alienação ou distanciamento relacional. “Uns aos outros” comunica naturalmente a reciprocidade da relação em português.
- source_word: πολλοὶ γὰρ καιροὶ διῆλθον
  choice: pois já se passou muito tempo
  rationale: É a formulação corrente em português para o transcurso de um longo intervalo; uma nota preserva o plural concreto do grego.
- source_word: ἀφʼ οὗ ἀπεστείλατε πρὸς ἡμᾶς
  choice: desde que vocês nos enviaram uma mensagem
  rationale: Mantém a referência temporal e o verbo “enviar”. Como no primeiro caso, “uma mensagem” supre de modo discreto o objeto elíptico sem decidir entre carta e delegação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. Emprega “vocês” para o plural de segunda pessoa. A repetição de “mensagem” esclarece em português os dois usos absolutos de “enviar” no grego, sem especificar o meio exato da comunicação.
