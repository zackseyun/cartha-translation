  rationale: O aoristo de κυκλόω descreve a ação de rodear ou cercar. O pretérito perfeito preserva o aspecto narrativo sem acrescentar ao grego uma duração explícita.
- source_word: πολλαὶ θλίψεις
  choice: muitas aflições
