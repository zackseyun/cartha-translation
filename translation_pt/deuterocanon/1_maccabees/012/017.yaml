- source_word: καὶ πόλεμοι πολλοί
  choice: e muitas guerras
  rationale: πόλεμοι designa guerras ou conflitos armados. A repetição de “muitas” mantém a ênfase reiterada do grego, embora a posição do adjetivo seja ajustada ao português natural.
