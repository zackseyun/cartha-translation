  text: And Simon rebuilt Adida in the Shephelah[b][a], and fortified it with gates and bars.
translation:
  language: pt
  text: E Simão reconstruiu[a] Adida, na Sefelá[b], e a fortificou com portões e barras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “construiu Adida”. O verbo grego pode significar “construir” ou “reconstruir”, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: A Sefelá é a região de colinas baixas da Judeia; também se pode traduzir por “a baixada”.
    reason: cultural_note
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: reconstruiu
  rationale: O verbo pode significar tanto “construiu” como “reconstruiu”. Como Adida já era uma localidade conhecida e o contexto é de obras defensivas, “reconstruiu” expressa naturalmente a restauração do lugar, sem ocultar a alternativa registrada em nota.
- source_word: τὴν Ἀδιδὰ
  choice: Adida
  rationale: O topônimo é transliterado de modo simples e corrente em português.
- source_word: ἐν τῇ σεφηλά
  choice: na Sefelá
  rationale: σεφηλά representa o nome geográfico da região de colinas baixas da Judeia. Preservar o topônimo é mais preciso do que reduzi-lo a “planície” ou “baixada”.
- source_word: ὠχύρωσεν
  choice: fortificou
  rationale: O verbo indica tornar um lugar forte e defensável; “fortificou” é o termo militar natural neste contexto.
- source_word: θύρας
  choice: portões
  rationale: Em uma cidade fortificada, trata-se dos portões de acesso, não de portas domésticas.
- source_word: μοχλούς
  choice: trancas
  rationale: O substantivo designa barras ou ferrolhos usados para fechar e assegurar portões. “Trancas” é claro e idiomático em português moderno.
