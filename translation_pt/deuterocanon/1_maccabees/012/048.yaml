  yaml_path: translation/deuterocanon/1_maccabees/012/048.yaml
  text: But when Jonathan entered Ptolemais[a], the men of Ptolemais shut the gates and seized him, and they killed with the sword all who had come with him.
translation:
  language: pt
  text: Mas, quando Jônatas entrou em Ptolemaida, os habitantes de Ptolemaida fecharam os portões, capturaram-no e mataram à espada todos os que tinham vindo com ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “todos os que se haviam reunido com ele”. O contexto da entrada na cidade também permite entender “todos os que tinham entrado com ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mas, quando
  rationale: Expressa a transição temporal e a reviravolta adversativa da narrativa.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: Verbo simples e natural para o movimento para dentro da cidade.
- source_word: Πτολεμαΐδα
  choice: Ptolemaida
  rationale: Forma tradicional e amplamente reconhecível do topônimo em português.
- source_word: οἱ Πτολεμαεῖται
  choice: os habitantes de Ptolemaida
  rationale: Comunica de modo claro e acessível o gentílico grego, que designa os moradores ou cidadãos da cidade.
- source_word: ἀπέκλεισαν τὰς πύλας
  choice: fecharam os portões
  rationale: Preserva a ação hostil de impedir a saída sem acrescentar que os portões foram trancados ou barricados.
- source_word: συνέλαβον αὐτόν
  choice: capturaram-no
  rationale: Retrata a apreensão súbita de Jônatas sem sugerir um procedimento jurídico formal.
- source_word: πάντας τοὺς συνελθόντας μετʼ αὐτοῦ
  choice: todos os que tinham vindo com ele
  rationale: Mantém a formulação ampla do grego; o contexto indica que eram os que acompanharam Jônatas ao entrar na cidade.
- source_word: ἀπέκτειναν ἐν ῥομφαίᾳ
  choice: mataram à espada
  rationale: Reproduz de maneira concisa e natural o idioma grego para morte violenta pela espada.
