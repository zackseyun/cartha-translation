base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/008.yaml
  text: And Onias received the man who had been sent with honor[a], and he received the letters[b], in which an alliance and friendship were explained.
translation:
  language: pt
  text: E Onias recebeu com honra o homem que tinha sido enviado[a] e recebeu as cartas[b], nas quais se expunham aliança e amizade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «acolheu honrosamente o enviado». O grego diz mais literalmente: «recebeu com honra o homem que tinha sido enviado».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «as cartas, nas quais aliança e amizade eram explicadas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: recebeu
  rationale: O verbo expressa receber ou acolher alguém; «recebeu» preserva a sobriedade narrativa, enquanto o advérbio indica a maneira da recepção.
- source_word: ἐνδόξως
  choice: com honra
  rationale: A locução comunica uma recepção honrosa e distinta em português natural, sem a possível conotação indevida de «gloriosamente».
- source_word: τὸν ἄνδρα τὸν ἀπεσταλμένον
  choice: o homem que tinha sido enviado
  rationale: Mantém a formulação descritiva do grego, literalmente «o homem, o que fora enviado», sem converter implicitamente a expressão no título «enviado» ou «embaixador».
- source_word: ἔλαβε τὰς ἐπιστολάς
  choice: recebeu as cartas
  rationale: No contexto de intercâmbio diplomático, «recebeu» é o equivalente idiomático de ἔλαβε, preferível ao literal «tomou».
- source_word: διεσάφειτο
  choice: se expunham os termos
  rationale: A forma verbal indica que o conteúdo era esclarecido ou apresentado nas cartas. «Expunham-se os termos» soa natural e explicita que aliança e amizade constituíam o assunto formalmente apresentado, sem resolver além do contexto a natureza exata do acordo.
- source_word: συμμαχίας
  choice: aliança
  rationale: O substantivo designa aliança, frequentemente política ou militar; «aliança» preserva essa amplitude sem acrescentar «militar».
- source_word: φιλίας
  choice: amizade
  rationale: É o equivalente direto e mantém a linguagem diplomática antiga em paralelo com «aliança».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção natural no Brasil. A repetição de «recebeu» acompanha a sequência do grego; a vírgula antes de «e» foi evitada por não ser necessária em português. Os marcadores de todas as notas aparecem no texto principal.
