  yaml_path: translation/deuterocanon/1_maccabees/012/051.yaml
  text: And when the pursuers saw that it was a matter of life and death for them[a], they turned back.
translation:
  language: pt
  text: Quando os perseguidores viram que, para eles, era uma questão de vida ou morte[a], voltaram atrás.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “que para eles era acerca da vida”; expressão que indica que a vida deles estava em jogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: quando ... viram
  rationale: O particípio aoristo tem valor temporal no contexto. Embora apareça no singular no texto transmitido, refere-se ao sujeito plural οἱ διώκοντες; a tradução usa naturalmente o plural.
- source_word: οἱ διώκοντες
  choice: os perseguidores
  rationale: O particípio presente substantivado designa o grupo que realizava a perseguição; “os perseguidores” é conciso e natural.
- source_word: ὅτι περὶ ψυχῆς ἐστιν αὐτοῖς
  choice: que, para eles, era uma questão de vida ou morte
  rationale: A expressão idiomática indica perigo mortal, isto é, que a vida deles estava em jogo. A formulação portuguesa comunica esse sentido com clareza e dignidade.
- source_word: ψυχῆς
  choice: vida
  rationale: Neste contexto, ψυχή se refere à vida física ameaçada, não especificamente à alma imaterial.
- source_word: ἐπέστρεψαν
  choice: voltaram atrás
  rationale: No contexto de uma perseguição, o verbo indica que inverteram o rumo e desistiram de prosseguir.
