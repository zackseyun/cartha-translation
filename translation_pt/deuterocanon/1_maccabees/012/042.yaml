  yaml_path: translation/deuterocanon/1_maccabees/012/042.yaml
  text: And Tryphon saw that he had come with a large force[a], and he was afraid to stretch out his hands against him.
translation:
  language: pt
  text: Trifão viu que Jônatas havia chegado com uma grande força militar e teve medo de estender as mãos contra ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pôr as mãos nele”. A expressão grega pode indicar uma ação hostil de modo geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέστη
  choice: havia chegado
  rationale: O aoristo de παρίστημι descreve, neste contexto narrativo, a chegada de Jônatas ao local. A forma mais-que-perfeita composta expressa naturalmente em português a anterioridade em relação ao momento em que Trifão percebeu a situação.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: com uma grande força militar
  rationale: Em contexto militar, δύναμις designa uma força ou contingente de tropas, não poder abstrato. A tradução explicita esse sentido sem especificar em excesso que se tratava de um exército formal.
- source_word: ἐκτείνειν χεῖρας ἐπʼ αὐτόν
  choice: estender as mãos contra ele
  rationale: A formulação conserva de perto a imagem do idioma grego e mantém em aberto a forma exata da ação hostil. Uma explicação mais idiomática aparece na nota.
- source_word: ηὐλαβήθη
  choice: teve medo
  rationale: O verbo comunica temor ou receio que impede a ação. “Teve medo” é direto, natural e adequado à causa indicada pela narrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. O nome “Jônatas” foi explicitado como sujeito de παρέστη para evitar que o pronome português fosse entendido como referência a Trifão; o referente é fornecido pelo contexto narrativo.
