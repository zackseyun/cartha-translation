  text: Arius[a], king of the Spartans, to Onias the high priest, greetings.
translation:
  language: pt
  text: 'Ário[a], rei dos espartanos, a Onias, o sumo sacerdote: saudações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego Ἄρης poderia ser transliterado mais literalmente como “Ares”, mas, neste contexto histórico, é entendido como o nome régio “Ário”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρης
  choice: Ário
  rationale: Em uma saudação epistolar, trata-se de um nome pessoal. Embora a forma grega coincida com Ares, nome do deus, o contexto histórico aponta para o rei espartano tradicionalmente chamado Ário em português.
- source_word: βασιλεὺς
  choice: rei
  rationale: É o equivalente direto e natural do título político grego.
- source_word: Σπαρτιατῶν
  choice: dos espartanos
  rationale: O genitivo plural designa o povo, e não apenas a cidade de Esparta.
- source_word: Ὀνείᾳ
  choice: a Onias
  rationale: O dativo identifica o destinatário na fórmula de endereçamento da carta.
- source_word: ἱερεῖ μεγάλῳ
  choice: o sumo sacerdote
  rationale: É a designação consagrada e contextualmente adequada do principal ofício sacerdotal judaico.
- source_word: χαίρειν
  choice: saudações
  rationale: Na fórmula epistolar grega, funciona como uma saudação convencional, não como a ordem literal para se alegrar.
