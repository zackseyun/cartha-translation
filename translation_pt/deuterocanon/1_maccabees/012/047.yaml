  yaml_path: translation/deuterocanon/1_maccabees/012/047.yaml
  text: But he left three thousand men with himself[a]; about two thousand he left in Galilee[b], and a thousand went with him.
translation:
  language: pt
  text: Mas deixou consigo três mil homens[a]; deixou cerca de dois mil na Galileia, e mil juntaram-se a ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grego, literalmente, “com ele mesmo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram com ele”; o verbo grego significa mais literalmente “vieram reunir-se com ele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλιπεν
  choice: deixou
  rationale: O verbo indica deixar para trás ou fazer permanecer. “Deixou” preserva o sentido básico sem acrescentar a ideia mais específica de posicionamento militar.
- source_word: μεθʼ ἑαυτοῦ
  choice: consigo
  rationale: Reproduz de modo natural em português a força reflexiva da expressão grega, literalmente “com ele mesmo”.
- source_word: ἄνδρας τρισχιλίους
  choice: três mil homens
  rationale: “Homens” corresponde diretamente a ἄνδρας; o contexto militar torna “soldados” possível, mas essa especificação não é explícita no termo.
- source_word: ὡς δισχιλίους
  choice: cerca de dois mil
  rationale: Com um numeral, ὡς indica aproximação; “cerca de” expressa claramente essa nuance.
- source_word: ἀφῆκεν
  choice: deixou
  rationale: O verbo pode significar deixar ou permitir que permaneça. A tradução evita interpretar o ato como uma designação militar formal.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: na Galileia
  rationale: É a forma locativa corrente e natural em português para ἐν seguido do nome de uma região.
- source_word: χίλιοι
  choice: mil
  rationale: Forma idiomática em narrativa portuguesa, sem necessidade de explicitar “homens”, já subentendido pelo contexto.
- source_word: συνῆλθον αὐτῷ
  choice: se reuniram a ele
  rationale: Preserva mais diretamente a ideia de convergência ou reunião presente em συνέρχομαι, sem excluir o sentido contextual de acompanhá-lo.
