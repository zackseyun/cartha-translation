base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/023.yaml
  text: 'And we also write back to you: Your livestock and your possessions are ours[a], and ours are yours[c][b]. Therefore we are giving orders that they report this to you accordingly.'
translation:
  language: pt
  text: 'E nós, por nossa vez, respondemos por escrito a vocês[a]: “Os animais de criação e os bens de vocês são nossos, e os nossos são de vocês[b]”. Portanto, damos instruções para que lhes comuniquem isso nos mesmos termos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escrevemos de volta a vocês”. O verbo grego também pode significar literalmente “copiamos para vocês”, mas, neste contexto, provavelmente indica uma resposta por escrito.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Os animais de criação e os bens de vocês são nossos, e os nossos são de vocês”. Trata-se de uma fórmula diplomática de aliança e solidariedade mútua, não necessariamente da abolição da propriedade legal.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “para que lhes comuniquem isso nesse mesmo sentido”. O grego não declara expressamente o objeto de “comuniquem”; “nos mesmos termos” traduz uma expressão que indica conformidade com o que acaba de ser dito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιγράφομεν
  choice: respondemos por escrito
  rationale: No contexto epistolar, o verbo indica uma resposta escrita ou uma carta enviada em retorno, não a simples ação de copiar.
- source_word: κτήνη
  choice: animais de criação
  rationale: Designa animais domésticos que integram o patrimônio. A expressão é clara em português internacional e evita limitar o sentido apenas a gado bovino.
- source_word: ὕπαρξις
  choice: bens
  rationale: Aqui se refere ao conjunto de posses ou recursos materiais. “Bens” é natural e preserva o sentido coletivo do singular grego.
- source_word: ἐντελλόμεθα
  choice: damos instruções
  rationale: Mantém o caráter oficial da ordem sem recorrer a uma formulação excessivamente dura ou arcaica.
- source_word: ἀπαγγείλωσιν
  choice: transmitam
  rationale: O verbo significa anunciar, informar ou comunicar uma mensagem. “Transmitam” se ajusta ao contexto diplomático, mantendo implícitos os mensageiros, como no grego.
- source_word: κατὰ τὰ αὐτά
  choice: a mesma mensagem
  rationale: A expressão remete ao teor do que acaba de ser declarado. Esta formulação é idiomática, embora o grego também permita “nesse mesmo sentido”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. “A vocês” e “lhes” evitam regionalismos excessivos; a citação direta preserva o tom de correspondência diplomática.
