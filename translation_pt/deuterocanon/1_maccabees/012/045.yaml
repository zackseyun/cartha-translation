base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/045.yaml
  text: And now send them away to their homes, but choose for yourself a few men who will be with you; and come with me to Ptolemais, and I will hand it over to you, along with the rest of the strongholds and the large forces and all those in charge of affairs, and then I will depart after turning back; for this is why I have come.
translation:
  language: pt
  text: Agora, mande-os de volta para casa, mas escolha para você alguns homens que ficarão com você. Venha comigo a Ptolemaida, e eu a entregarei a você, juntamente com as demais fortalezas, as numerosas tropas e todos os encarregados dos assuntos[a]. Depois, retornarei e partirei[b], pois foi para isso que vim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os oficiais”. O grego se refere literalmente aos que estavam encarregados das necessidades ou dos negócios.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é condensada e indica que o falante primeiro retornaria ou voltaria e depois partiria, sem dizer para onde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστειλον αὐτοὺς εἰς τοὺς οἴκους αὐτῶν
  choice: mande-os de volta para casa
  rationale: A expressão indica que os homens devem ser dispensados e enviados aos próprios lares; “de volta para casa” comunica isso naturalmente em português.
- source_word: ἐπίλεξαι δὲ σεαυτῷ ἄνδρας ὀλίγους
  choice: mas escolha para você alguns homens
  rationale: Preserva o valor médio de ἐπίλεξαι e mantém ἄνδρας como “homens”, sem explicitar “soldados”, embora o contexto seja militar.
- source_word: δεῦρο μετ’ ἐμοῦ εἰς Πτολεμαΐδα
  choice: Venha comigo a Ptolemaida
  rationale: δεῦρο funciona como chamado ou convite; a formulação é clara, digna e direta.
- source_word: παραδώσω σοι αὐτὴν
  choice: eu a entregarei a você
  rationale: O verbo denota transferência de controle; o pronome feminino retoma Ptolemaida.
- source_word: τὰ λοιπὰ ὀχυρώματα
  choice: as demais fortalezas
  rationale: ὀχυρώματα designa posições fortificadas, e “fortalezas” é natural no contexto militar.
- source_word: τὰς δυνάμεις τὰς πολλὰς
  choice: as numerosas tropas
  rationale: δυνάμεις tem sentido militar no contexto; “numerosas tropas” expressa a quantidade sem o caráter pouco idiomático de “muitas forças”.
- source_word: πάντας τοὺς ἐπὶ τῶν χρειῶν
  choice: todos os encarregados dos assuntos
  rationale: Mantém a expressão administrativa relativamente ampla do grego, que literalmente se refere aos que estão postos sobre necessidades, negócios ou assuntos.
- source_word: ἐπιστρέψας ἀπελεύσομαι
  choice: Depois, retornarei e partirei
  rationale: Torna clara a sequência do particípio anterior ao verbo futuro sem especificar para onde ocorre o retorno ou a partida.
- source_word: τούτου γὰρ χάριν πάρειμι
  choice: pois foi para isso que vim
  rationale: Expressa naturalmente a finalidade declarada da presença do falante.
