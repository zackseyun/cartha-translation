  text: And he pursued after them, but did not overtake them, for they had crossed the Eleutherus River.
translation:
  language: pt
  text: Ele os perseguiu, mas não os alcançou, pois haviam atravessado o rio Eleutero.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδίωξεν ὀπίσω αὐτῶν
  choice: foi atrás deles
  rationale: A expressão descreve perseguição ativa; em português corrente, “foi atrás deles” transmite naturalmente o movimento de perseguição sem a redundância de “perseguiu atrás”.
- source_word: οὐκ ἐκατέλαβεν αὐτούς
  choice: não conseguiu alcançá-los
  rationale: No contexto de fugitivos, καταλαμβάνω significa alcançá-los durante a perseguição. A construção com “conseguiu” torna claro o fracasso da tentativa, sem sugerir captura efetiva.
- source_word: διέβησαν
  choice: já tinham atravessado
  rationale: O mais-que-perfeito composto, reforçado por “já”, expressa com naturalidade que a travessia ocorreu antes de ele poder alcançá-los e explica o fracasso da perseguição.
- source_word: τὸν Ἐλεύθερον ποταμόν
  choice: o rio Eleutero
  rationale: Ἐλεύθερον é o nome próprio do rio. “Eleutero” é uma transliteração portuguesa clara, e a ordem “rio Eleutero” é idiomática em português.
