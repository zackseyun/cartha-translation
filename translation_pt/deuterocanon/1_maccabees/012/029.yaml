  text: But Jonathan and those with him did not know until morning[a], for they saw the fires burning.
translation:
  language: pt
  text: Mas Jônatas e os que estavam com ele não ficaram sabendo até pela manhã[a], pois viam as luzes acesas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «as luzes ardendo». Neste contexto, provavelmente se refere a fogueiras deixadas acesas no acampamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: não souberam disso
  rationale: Preserva o sentido simples de γινώσκω; o pronome «disso» torna natural em português a referência ao que não perceberam, sem especificá-la além do contexto.
- source_word: ἕως πρωί
  choice: até a manhã
  rationale: Reproduz diretamente o limite temporal da ignorância indicado pelo grego.
- source_word: ἔβλεπον
  choice: viam
  rationale: O imperfeito português preserva o aspecto durativo e fornece a circunstância explicativa para não terem percebido o ocorrido.
- source_word: τὰ φῶτα
  choice: as luzes
  rationale: Mantém o sentido lexical direto e a ambiguidade do grego; no contexto, provavelmente se trata de fogueiras deixadas acesas, esclarecido em nota.
- source_word: καιόμενα
  choice: acesas
  rationale: É uma expressão natural em português para luzes ou fogueiras que continuam ardendo, sem exigir uma formulação passiva artificial.
- source_word: οἱ παρʼ αὐτοῦ
  choice: os que estavam com ele
  rationale: Representa fielmente o grupo que acompanhava Jônatas, sem restringi-lo explicitamente a soldados.
