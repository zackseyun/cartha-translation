base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/011.yaml
  text: Therefore[a], at all times we continually remember you at the festivals and on the other appointed days, when we offer sacrifices and in our prayers, as it is right and fitting to remember brothers.
translation:
  language: pt
  text: Por isso, em todo tempo, lembramo-nos continuamente de vocês nas festas e nos outros dias estabelecidos[a], ao oferecermos sacrifícios e em nossas orações, como é justo e apropriado lembrar-se dos irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos outros dias apropriados”, “devidos” ou “costumeiros”. O termo grego pode indicar dias considerados próprios, habituais ou estabelecidos para observância.
    reason: Alternativa lexical que preserva a amplitude semântica de καθηκούσαις.
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: continuamente
  rationale: Expressa a constância enfática do grego e, ao lado de “em todo tempo”, conserva a repetição intencional do original sem recorrer ao mais absoluto “sem interrupção”.
- source_word: ἑορταῖς
  choice: festas
  rationale: Designa celebrações religiosas e é uma forma corrente e digna em português para o contexto cultual.
- source_word: λοιπαῖς καθηκούσαις ἡμέραις
  choice: outros dias estabelecidos
  rationale: No contexto das festas e práticas cultuais, indica outros dias reconhecidos para observância. A nota preserva a amplitude de καθηκούσαις, que também pode significar apropriados, devidos ou costumeiros.
- source_word: μιμνησκόμεθα ὑμῶν
  choice: lembramo-nos de vocês
  rationale: Reproduz diretamente o verbo médio com objeto no genitivo e mantém a ideia de recordação ativa no contexto de sacrifícios e orações.
- source_word: ἐφʼ ὧν
  choice: quando
  rationale: Tradução temporal idiomática que vincula a lembrança às ocasiões em que se oferecem sacrifícios.
- source_word: προσφέρομεν θυσιῶν
  choice: oferecemos sacrifícios
  rationale: Mantém explicitamente a linguagem cultual do texto grego.
- source_word: ἐν ταῖς προσευχαῖς
  choice: em nossas orações
  rationale: O possessivo é implícito no contexto da primeira pessoa do plural e torna a expressão natural em português sem alterar substancialmente o sentido.
- source_word: ὡς δέον ἐστὶν καὶ πρέπον
  choice: como é justo e apropriado
  rationale: Conserva os dois termos coordenados, um ligado ao dever e outro à conveniência, em linguagem portuguesa natural.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: Preserva a forma masculina e a força da linguagem familiar empregada diplomaticamente entre os povos aliados.
theological_decisions:
- issue: Termo familiar masculino ἀδελφῶν
  choice: irmãos
  alternative: irmãos e irmãs; parentes; povos irmãos
  rationale: O grego emprega o masculino plural como linguagem familiar, política e diplomática. “Irmãos” conserva a forma e a imagem do texto sem neutralizá-las nem explicá-las dentro da tradução.
- issue: Linguagem cultual de sacrifícios e orações
  choice: manter a referência explícita a sacrifícios e orações
  alternative: generalizar como ofertas ou culto
  rationale: O texto nomeia especificamente sacrifícios e orações. Generalizar apagaria o cenário cultual e seria menos preciso.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a ênfase de “em todo tempo” e “continuamente”, bem como a linguagem explicitamente cultual e familiar do original.
