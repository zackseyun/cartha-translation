  source_fidelity: 'A tradução transmite adequadamente os elementos centrais do grego: a dupla ênfase temporal ("em todo tempo" e "continuamente"), as festas e os demais dias de observância, a recordação no contexto de sacrifícios e orações, e a formulação final sobre ser justo e apropriado lembrar-se de irmãos. “Dias estabelecidos” é uma opção contextual defensável para καθηκούσαις, desde que acompanhada da nota que registra sua amplitude semântica.'
  naturalness: 'O texto é claro e de registro apropriado. Contudo, a sequência “quando oferecemos sacrifícios, e em nossas orações” fica levemente quebrada: “quando” introduz uma oração temporal, mas “em nossas orações” é um sintagma paralelo. “Ao oferecermos sacrifícios e em nossas orações” torna a coordenação natural e preserva a relação temporal/contextual de ἐφʼ ὧν.'
  terminology: “Festas”, “sacrifícios”, “orações” e “irmãos” são escolhas fiéis e naturais. “Lembramo-nos de vocês” é português moderno de ampla compreensão e representa bem μιμνησκόμεθα ὑμῶν. A nota de rodapé preserva corretamente a incerteza lexical de καθηκούσαις.
