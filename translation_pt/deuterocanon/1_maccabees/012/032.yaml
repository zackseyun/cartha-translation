lexical_decisions:
- source_word: ἀναζεύξας
  choice: depois de levantar acampamento
  rationale: O particípio indica levantar acampamento e pôr-se em marcha; a formulação preserva o contexto de deslocamento militar e soa natural em português.
- source_word: ἦλθεν
  choice: chegou
  rationale: Com εἰς Δαμασκόν, o verbo descreve a chegada ao destino; «chegou a Damasco» é claro e idiomático.
- source_word: διώδευσεν
  choice: percorreu
  rationale: O verbo expressa deslocamento através de uma área; «percorreu» comunica de modo conciso a ideia de atravessar ou viajar pela região.
- source_word: ἐν πάσῃ τῇ χώρᾳ
  choice: toda a região
  rationale: χώρα pode designar terra, território ou região. «Região» preserva a referência territorial sem sugerir um Estado nacional moderno.
- source_word: καὶ ... καὶ
  choice: E ... e
  rationale: A repetição de καί marca a sequência narrativa simples; manter as duas conjunções reproduz o fluxo do grego de forma natural.
