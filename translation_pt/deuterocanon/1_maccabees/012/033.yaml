  yaml_path: translation/deuterocanon/1_maccabees/012/033.yaml
  text: And Simon went out and passed through as far as Ashkelon and the nearby strongholds[a], and he turned aside to Joppa and took it beforehand.
translation:
  language: pt
  text: E Simão saiu e percorreu a região até Ascalom e as fortalezas próximas; depois, desviou-se para Jope e tomou posse dela de antemão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ocupou-a previamente», «ocupou-a primeiro» ou «capturou-a preventivamente». O verbo grego indica que Simão assumiu o controle de Jope antes que outra parte o fizesse, sem especificar qual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διώδευσεν
  choice: percorreu a região
  rationale: O verbo indica atravessar ou percorrer um território. A explicitação de «a região» produz português natural sem atribuir ao movimento um caráter militar que o grego não declara.
- source_word: ἕως Ἀσκάλωνος
  choice: até Ascalom
  rationale: ἕως assinala o limite do percurso; «até Ascalom» preserva essa nuance de extensão.
- source_word: τὰ πλησίον ὀχυρώματα
  choice: as fortalezas próximas
  rationale: ὀχυρώματα designa lugares fortificados ou fortalezas, e πλησίον indica proximidade.
- source_word: ἐξέκλινεν εἰς Ἰόππην
  choice: desviou-se para Jope
  rationale: ἐκκλίνω expressa o desvio de uma rota ou a mudança de direção; a formulação mantém esse movimento.
- source_word: προκατελάβετο
  choice: tomou posse dela antes dos outros
  rationale: O composto verbal indica apoderar-se ou ocupar previamente. «Antes dos outros» torna compreensível o elemento antecipatório sem afirmar quem era a outra parte.
- source_word: αὐτήν
  choice: dela
  rationale: O pronome retoma Jope; em português, a concordância feminina com «Jope» é natural neste contexto.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. O ponto e vírgula separa as duas etapas do deslocamento. A tradução preserva a ideia antecipatória de προκατελάβετο, enquanto a nota registra alternativas possíveis.
