  yaml_path: translation/deuterocanon/1_maccabees/012/049.yaml
  text: And Tryphon sent forces and cavalry into Galilee[a], into the great plain, to destroy all those who were with Jonathan.
translation:
  language: pt
  text: E Trifão enviou tropas e cavalaria para a Galileia, para a grande planície, a fim de destruir todos os que estavam com Jônatas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os que estavam do lado de Jônatas”. A expressão grega diz literalmente “todos os que estavam junto de/com Jônatas” e provavelmente se refere aos seus homens ou apoiadores.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: O aoristo indica de modo direto o envio das unidades militares; “enviou” é natural e digno em português.
- source_word: δυνάμεις
  choice: tropas
  rationale: Neste contexto militar, o plural designa contingentes ou unidades armadas, não “poderes”; “tropas” é claro sem especificar infantaria.
- source_word: ἵππον
  choice: cavalaria
  rationale: Embora formalmente singular, o termo tem sentido coletivo e se refere às forças montadas.
- source_word: εἰς Γαλιλαίαν
  choice: para a Galileia
  rationale: Expressa naturalmente o movimento das forças em direção à região, sem tornar enfático demais o ingresso nela.
- source_word: εἰς τὸ πεδίον τὸ μέγα
  choice: para a grande planície
  rationale: Mantém o segundo destino introduzido por εἰς e traduz de maneira transparente πεδίον e o adjetivo atributivo μέγα.
- source_word: τοῦ ἀπολέσαι
  choice: a fim de destruir
  rationale: O infinitivo articular indica propósito; “destruir” preserva a amplitude da eliminação militar sem restringi-la explicitamente a matar.
- source_word: πάντας τοὺς παρὰ Ἰωνάθου
  choice: todos os que estavam com Jônatas
  rationale: A construção com παρά e o nome pessoal indica associação ou alinhamento; a formulação preserva a ambiguidade entre presença junto dele e apoio à sua causa.
