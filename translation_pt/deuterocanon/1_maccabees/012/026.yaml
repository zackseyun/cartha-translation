  text: And he sent scouts into their camp[a], and they returned and reported to him, “Thus they are arraying themselves to fall upon them by night.”
translation:
  language: pt
  text: 'E ele enviou batedores ao acampamento deles. Eles voltaram e lhe informaram: “Eles estão se posicionando assim[a] para atacá-los durante a noite.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles estão dispostos em formação para atacá-los durante a noite”. O grego pode indicar que estavam se organizando ou tomando posição em formação, e não apenas fazendo planos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Forma narrativa natural para o aoristo de ἀποστέλλω, sem acrescentar uma nuance técnica desnecessária.
- source_word: κατασκόπους
  choice: batedores
  rationale: No contexto militar, designa homens enviados para observar as posições inimigas; “batedores” comunica reconhecimento militar com naturalidade.
- source_word: παρεμβολήν
  choice: acampamento
  rationale: Equivalente corrente e preciso para o sentido militar de παρεμβολή.
- source_word: ἀπήγγειλαν
  choice: informaram
  rationale: Expressa o ato de trazer de volta as informações obtidas, preservando o contexto de reconhecimento.
- source_word: Οὕτως τάσσονται
  choice: Eles estão se posicionando assim
  rationale: Preserva o aspecto presente e a ideia de disposição ou posicionamento tático de τάσσονται, sem reduzi-la a uma simples intenção ou plano.
- source_word: ἐπιπεσεῖν
  choice: para atacá-los
  rationale: Transmite com clareza a ação hostil de lançar-se contra alguém; em português atual, “atacar” é mais natural que uma reprodução literal de “cair sobre”.
- source_word: τὴν νύκτα
  choice: durante a noite
  rationale: Representa naturalmente o acusativo de tempo e mantém aberta a referência ao período noturno.
