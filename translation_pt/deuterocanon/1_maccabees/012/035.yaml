lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: voltou
  rationale: O aoristo indica retorno físico; “voltou” é a forma natural e direta em português.
- source_word: ἐξεκκλησίασεν
  choice: reuniu
  rationale: O verbo descreve a convocação dos anciãos para uma reunião; “reuniu” comunica com clareza a ação sem tecnicismo desnecessário.
- source_word: πρεσβυτέρους
  choice: anciãos
  rationale: Neste contexto comunitário e político, refere-se a líderes reconhecidos, não apenas a homens idosos.
- source_word: ἐβουλεύσατο μετ’ αὐτῶν
  choice: deliberou com eles
  rationale: Preserva o sentido de consulta e consideração conjunta expresso pelo verbo na voz média.
- source_word: οἰκοδομῆσαι
  choice: construção
  rationale: Na locução “sobre a construção”, expressa naturalmente em português o conteúdo da deliberação, correspondente ao infinitivo grego “construir”.
- source_word: ὀχυρώματα
  choice: fortalezas
  rationale: Designa estruturas ou posições defensivas fortificadas; “fortalezas” é concreto e corrente.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: na Judeia
  rationale: Indica a região onde seriam construídas as fortalezas; “Judeia” é a grafia portuguesa corrente.
