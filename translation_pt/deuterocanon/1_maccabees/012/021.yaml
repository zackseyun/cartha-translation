  text: It was found in a writing concerning both the Spartans and the Jews that they are brothers and that they are of the family line of Abraham[a][b].
translation:
  language: pt
  text: Encontrou-se num escrito, a respeito tanto dos espartanos como dos judeus, que eles são irmãos e que são da linhagem de Abraão[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num documento” ou “num registro”. O termo grego se refere aqui a uma fonte escrita e não significa necessariamente as Escrituras.
    reason: lexical_alternative
  - marker: b
    text: Isto é, segundo o escrito citado, eles teriam uma descendência comum de Abraão.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρέθη
  choice: Encontrou-se
  rationale: O aoristo passivo é vertido por uma construção impessoal natural em português, preservando o sentido de uma descoberta passada sem acrescentar agente.
- source_word: ἐν γραφῇ
  choice: num escrito
  rationale: γραφή designa aqui uma fonte escrita, sem exigir o sentido técnico de Escritura sagrada; “escrito” mantém a amplitude do termo.
- source_word: περὶ τε τῶν Σπαρτιατῶν καὶ Ἰουδαίων
  choice: sobre os espartanos e os judeus
  rationale: περί com genitivo significa “sobre/a respeito de”; a coordenação dos dois povos é preservada de modo natural em português.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva a imagem explícita de parentesco entre os dois povos, sem reduzi-la a amizade ou aliança política.
- source_word: ἐκ γένους Ἀβραάμ
  choice: descendem da linhagem de Abraão
  rationale: A formulação comunica com clareza a procedência genealógica expressa por ἐκ γένους e soa mais natural em português atual do que uma reprodução rígida como “são da linhagem”.
theological_decisions:
- issue: Natureza da relação alegada entre espartanos e judeus
  choice: Apresentar diretamente a alegação de fraternidade e descendência comum contida no escrito citado.
  alternative: Atenuar a declaração para amizade política, afinidade ou aliança.
  rationale: O grego afirma explicitamente que são “irmãos” e procedem da linhagem de Abraão. A tradução preserva a alegação textual sem se pronunciar sobre sua historicidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção impessoal natural. “Espartanos” e “judeus” aparecem em minúscula segundo o uso ortográfico corrente. A nota preserva a natureza alegada da genealogia sem enfraquecer a afirmação do texto principal.
