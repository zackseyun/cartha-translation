base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/027.yaml
  text: When the sun had set, Jonathan commanded those with him to stay awake and remain at their weapons, to be ready for battle through the whole night; and he posted sentries around the camp.
translation:
  language: pt
  text: Quando o sol se pôs, Jônatas ordenou aos que estavam com ele que permanecessem acordados e junto às suas armas, prontos para a batalha durante toda a noite; e posicionou sentinelas ao redor do acampamento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἔδυ ὁ ἥλιος
  choice: Quando o sol se pôs
  rationale: Expressa de modo natural o pôr do sol já ocorrido, de acordo com o aoristo e com a sequência narrativa.
- source_word: ἐπέταξεν
  choice: ordenou
  rationale: Preserva a força de uma ordem dada em contexto militar.
- source_word: τοῖς παρʼ αὐτοῦ
  choice: aos que estavam com ele
  rationale: Mantém a formulação abrangente do grego sem explicitar além do texto que fossem apenas soldados ou subordinados.
- source_word: γρηγορεῖν
  choice: que permanecessem acordados
  rationale: Retém o sentido básico de vigília e evita confundi-lo com a ação posterior de posicionar sentinelas.
- source_word: εἶναι ἐπὶ τοῖς ὅπλοις
  choice: junto às suas armas
  rationale: Conserva a imagem concreta de permanecer com as armas à mão, em prontidão.
- source_word: ἑτοιμάζεσθαι εἰς πόλεμον
  choice: prontos para a batalha
  rationale: Comunica com concisão a preparação para o combate imediato; 'batalha' corresponde melhor ao contexto tático do que 'guerra'.
- source_word: διʼ ὅλης τῆς νυκτός
  choice: durante toda a noite
  rationale: Preserva claramente a ideia de duração integral.
- source_word: ἐξέβαλεν προφύλακας
  choice: posicionou sentinelas
  rationale: Traduz naturalmente a expressão militar de destacar e colocar guardas em seus postos.
- source_word: κύκλῳ τῆς παρεμβολῆς
  choice: ao redor do acampamento
  rationale: Representa diretamente o sentido espacial de κύκλῳ e o uso militar de παρεμβολή.
