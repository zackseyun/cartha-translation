base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/043.yaml
  text: And he received him honorably[a], introduced him to all his friends, gave him gifts[b], and commanded his friends and his forces likewise to obey him.
translation:
  language: pt
  text: Ele o recebeu com honra, apresentou-o[a] a todos os seus amigos[b], deu-lhe presentes e ordenou a seus amigos e a suas tropas que lhe obedecessem igualmente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deu-o a conhecer”. O verbo grego pode indicar a apresentação pública de alguém.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto régio helenístico, “amigos” pode designar membros do círculo oficial do rei, e não apenas companheiros pessoais.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεδέξατο ... ἐνδόξως
  choice: recebeu com honra
  rationale: Expressa de modo natural o acolhimento honroso e distinto indicado pelo verbo e pelo advérbio, sem exagerar o sentido como faria “gloriosamente”.
- source_word: συνέστησεν
  choice: apresentou
  rationale: No contexto social e político, indica apresentar ou dar alguém a conhecer aos próprios associados.
- source_word: φίλοις
  choice: amigos
  rationale: Preserva o termo grego comum, enquanto uma nota registra seu possível sentido técnico no ambiente das cortes helenísticas.
- source_word: δόματα
  choice: presentes
  rationale: Equivalente corrente e direto para dádivas oferecidas a alguém.
- source_word: δυνάμεσιν
  choice: tropas
  rationale: O plural designa aqui forças militares; “tropas” é claro e natural em português.
- source_word: ὑπακούειν
  choice: obedecessem
  rationale: Transmite diretamente a obediência exigida pela ordem.
- source_word: ὡσαύτως
  choice: igualmente
  rationale: Conserva a ideia de que tanto os amigos quanto as tropas deviam obedecer-lhe do mesmo modo.
