  text: But we rejoice in your glory[a].
translation:
  language: pt
  text: Mas nos alegramos com a glória de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com a honra de vocês» ou «por causa do renome de vocês». Aqui, o grego δόξα pode indicar honra ou reputação, além de glória.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμεθα
  choice: nos alegramos
  rationale: Expressa de modo natural o estado presente de alegria indicado pela forma verbal, sem acrescentar a ideia mais forte de celebração.
- source_word: δὲ
  choice: Mas
  rationale: Marca a transição levemente contrastiva do grego; «mas» preserva essa força, embora o contraste seja suave.
- source_word: ἐπὶ
  choice: com
  rationale: Com o dativo, indica a base ou ocasião da alegria. Em português, «alegrar-se com» é idiomático e conserva a relação sem impor exclusivamente um sentido causal.
- source_word: τῇ δόξῃ
  choice: a glória
  rationale: Mantém o termo tradicional e o tom elevado de δόξα, cuja extensão semântica neste contexto também inclui honra e renome.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Representa claramente o possessivo da segunda pessoa do plural em português moderno, com ampla legibilidade brasileira.
