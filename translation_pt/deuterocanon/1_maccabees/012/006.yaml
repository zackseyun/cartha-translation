base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/006.yaml
  text: Jonathan the high priest of the nation[a], and the council of elders, and the priests, and the rest of the people of the Jews, to their Spartan brothers[b], greetings.
translation:
  language: pt
  text: 'Jônatas, sumo sacerdote da nação, o conselho de anciãos, os sacerdotes e o restante do povo judeu[a], aos irmãos espartanos[b]: saudações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «judeano»; o termo grego pode designar o povo da Judeia em sentido étnico-político, além do sentido religioso.
    reason: lexical_alternative
  - marker: b
    text: «Irmãos» reproduz a linguagem grega de parentesco diplomático; não indica necessariamente irmãos em sentido literal.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: sumo sacerdote
  rationale: É a designação tradicional, clara e precisa do principal ofício sacerdotal judaico.
- source_word: τοῦ ἔθνους
  choice: da nação
  rationale: Preserva o sentido político e coletivo de ἔθνος e sua ligação explícita com o ofício de Jônatas.
- source_word: γερουσία
  choice: conselho de anciãos
  rationale: Expressa de modo transparente o órgão governante formado por anciãos, sem introduzir a associação romana que «senado» pode sugerir.
- source_word: ὁ λοιπὸς δῆμος
  choice: o restante do povo
  rationale: Distingue naturalmente a coletividade dos dirigentes e sacerdotes já mencionados.
- source_word: τῶν Ἰουδαίων
  choice: judeu
  rationale: Em «povo judeu», identifica de modo natural em português a coletividade remetente, embora o termo grego também possa ser traduzido como «judeano».
- source_word: Σπαρτιάταις
  choice: espartanos
  rationale: É o gentílico português corrente e preciso para os destinatários.
- source_word: τοῖς ἀδελφοῖς
  choice: irmãos
  rationale: Mantém a linguagem explícita de fraternidade ou parentesco diplomático do texto grego.
- source_word: χαίρειν
  choice: saudações
  rationale: Reproduz de modo idiomático a fórmula convencional de abertura das cartas helenísticas.
theological_decisions:
- issue: Sentido de «irmãos» no tratamento diplomático
  choice: Manter «irmãos» como linguagem declarada de fraternidade entre os povos.
  alternative: parentes; amigos; aliados
  rationale: O grego afirma uma relação de fraternidade, cuja natureza exata não deve ser resolvida ou enfraquecida na tradução.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A estrutura nominal da saudação epistolar foi mantida, e os termos institucionais foram vertidos de forma transparente.
