  yaml_path: translation/deuterocanon/1_maccabees/012/013.yaml
  text: But we[a], though having no need of these things, have as encouragement the holy books that are in our hands[b],
translation:
  language: pt
  text: Nós, porém, embora não precisemos dessas coisas, temos como encorajamento[a] os livros santos que estão em nossas mãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consolo” ou “alento”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que estão em nossas mãos”; a expressão também pode significar “que estão em nossa posse”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπρόσδεοι
  choice: não precisemos
  rationale: O adjetivo significa “não necessitado de” ou “sem precisar de”. A forma verbal é natural em português e, com “dessas coisas”, preserva a relação expressa pelo genitivo sem sugerir autossuficiência absoluta.
- source_word: τούτων
  choice: dessas coisas
  rationale: O pronome retoma elementos mencionados anteriormente. “Dessas coisas” explicita a referência de modo natural e fiel.
- source_word: παράκλησιν
  choice: encorajamento
  rationale: Neste contexto, indica amparo ou fortalecimento recebido dos escritos sagrados. “Encorajamento” conserva a amplitude do termo, enquanto “consolo” pode soar mais restrito ao alívio da tristeza.
- source_word: τὰ βιβλία τὰ ἅγια
  choice: os livros santos
  rationale: Reproduz de perto a expressão grega concreta, sem substituí-la por terminologia canônica posterior como “as Escrituras”.
- source_word: τὰ ἐν ταῖς χερσὶν ἡμῶν
  choice: que estão em nossas mãos
  rationale: Mantém a imagem literal do grego, natural em português, e permite também o sentido implícito de posse ou disponibilidade imediata.
theological_decisions:
- issue: Referência de “os livros santos”
  choice: Manter a designação genérica “os livros santos”.
  alternative: “as Escrituras Sagradas” ou “os escritos sagrados”
  rationale: O grego identifica livros como santos, mas não delimita explicitamente um cânon posterior. A formulação escolhida evita acrescentar precisão doutrinária ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase acompanha o contraste do grego, e as notas preservam as principais alternativas lexicais e idiomáticas.
