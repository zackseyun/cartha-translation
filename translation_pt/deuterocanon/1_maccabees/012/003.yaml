  yaml_path: translation/deuterocanon/1_maccabees/012/003.yaml
  text: And they went to Rome[a], and they entered the council chamber, and said, “Jonathan the high priest and the nation of the Jews have sent us to renew with them the alliance as before.”
translation:
  language: pt
  text: 'Eles foram a Roma, entraram na sala do conselho[a] e disseram: “Jônatas, o sumo sacerdote, e a nação dos judeus nos enviaram para também renovar com eles a aliança, como antes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “câmara do conselho” ou “salão do conselho”; o grego nomeia o lugar onde o conselho governante se reunia, em vez de empregar um título institucional romano formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθησαν
  choice: foram / entraram
  rationale: O verbo indica deslocamento. Na primeira ocorrência, “foram” é a forma mais natural; na segunda, diante de εἰς τὸ βουλευτήριον, “entraram” expressa em português corrente o movimento para dentro do recinto sem alterar o sentido.
- source_word: βουλευτήριον
  choice: sala do conselho
  rationale: O termo designa concretamente o recinto onde o conselho governante se reunia. A tradução evita substituir o local pelo título institucional romano mais interpretativo, “Senado”.
- source_word: Ἰωναθὰν ὁ ἀρχιερεύς
  choice: Jônatas, o sumo sacerdote
  rationale: “Sumo sacerdote” é a correspondência tradicional, clara e historicamente adequada para ἀρχιερεύς.
- source_word: τὸ ἔθνος τῶν Ἰουδαίων
  choice: a nação dos judeus
  rationale: Mantém a estrutura do grego e apresenta os judeus como corpo nacional, sem introduzir uma distinção interpretativa entre “judeus” e “judeanos”.
- source_word: ἀπέστειλαν ἡμῖς
  choice: nos enviaram
  rationale: O grego impresso traz ἡμῖς, forma anômala neste contexto; o sentido exigido pela construção é o dos enviados falando de sua comissão. “Nos enviaram” reproduz esse sentido em português natural.
- source_word: ἀνανεώσασθαι
  choice: para renovarmos
  rationale: O infinitivo expressa a finalidade da missão diplomática; “renovar” comunica de modo conciso a restauração formal de um acordo anterior.
- source_word: αὐτοῖς
  choice: com eles
  rationale: A aliança é uma relação entre partes, por isso “com” é idiomático. Mantém-se a terceira pessoa do grego, sem convertê-la silenciosamente em “com vocês” por causa do discurso citado.
- source_word: συμμαχίαν
  choice: aliança
  rationale: No contexto político e diplomático, o termo denota uma aliança entre povos; “aliança” é claro e não restringe indevidamente o acordo a uma modalidade específica de tratado.
- source_word: κατὰ τὸ πρότερον
  choice: como antes
  rationale: A expressão remete ao estado anterior das relações e é traduzida de modo direto e natural.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. A repetição grega de “foram” foi vertida por “foram” e “entraram” conforme o destino de cada movimento. Preservou-se a terceira pessoa em “com eles”, apesar da possível estranheza dentro da fala direta, para não resolver silenciosamente a forma do texto grego.
