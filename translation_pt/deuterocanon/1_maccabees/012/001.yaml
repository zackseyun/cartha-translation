base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/001.yaml
  text: And when Jonathan saw that the time was favorable to him[b][a], he chose men and sent them to Rome to establish and renew the friendship with them.
translation:
  language: pt
  text: Quando Jônatas viu que as circunstâncias lhe eram favoráveis[a], escolheu homens e os enviou a Roma para firmar e renovar a amizade com os romanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que a ocasião o favorecia” ou “que o momento agia a seu favor”. A expressão grega indica que a conjuntura era vantajosa para Jônatas.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “amizade” provavelmente se refere a relações diplomáticas formais, e não apenas a afeição pessoal.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν
  choice: quando ... viu
  rationale: O particípio aoristo introduz a circunstância anterior às ações principais; a construção temporal é natural em português e preserva a relação do grego.
- source_word: ὁ καιρὸς αὐτῷ συνεργεῖ
  choice: as circunstâncias lhe eram favoráveis
  rationale: καιρός designa aqui uma conjuntura oportuna, e συνεργεῖ indica que ela cooperava com Jônatas ou agia a seu favor. A formulação idiomática comunica esse sentido sem sugerir que o tempo seja um agente literal.
- source_word: ἐπέλεξεν ἄνδρας
  choice: escolheu alguns homens
  rationale: Mantém a referência masculina explícita do grego e expressa naturalmente a seleção de enviados; “alguns” é implícito no plural indefinido.
- source_word: ἀπέστειλεν εἰς Ῥώμην
  choice: os enviou a Roma
  rationale: Tradução direta e corrente da missão diplomática.
- source_word: στῆσαι
  choice: firmar
  rationale: No contexto de relações diplomáticas, o infinitivo exprime o propósito de estabelecer ou pôr em bases firmes a relação.
- source_word: ἀνανεῶσαι
  choice: renovar
  rationale: Reproduz diretamente a ideia de tornar nova outra vez uma relação já existente.
- source_word: τὴν πρὸς αὐτοὺς φιλίαν
  choice: a amizade com os romanos
  rationale: “Amizade” preserva a escolha lexical de φιλία, enquanto “com os romanos” explicita de modo natural o referente de αὐτούς após a menção de Roma.
