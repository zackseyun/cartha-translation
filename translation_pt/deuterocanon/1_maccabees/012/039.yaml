  yaml_path: translation/deuterocanon/1_maccabees/012/039.yaml
  text: And Tryphon sought to rule over Asia[a], to put on the crown[b], and to lay hands on Antiochus the king.
translation:
  language: pt
  text: Trifão procurou reinar sobre a Ásia[a], pôr o diadema e estender as mãos contra o rei Antíoco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Ásia” se refere ao reino helenístico em questão, não ao continente asiático no sentido moderno.
    reason: cultural_note
  - marker: b
    text: Ou “atacar o rei Antíoco”; literalmente, “estender as mãos contra o rei Antíoco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησεν
  choice: procurou
  rationale: Expressa propósito e esforço, sem afirmar que Trifão alcançou o que pretendia.
- source_word: βασιλεῦσαι
  choice: reinar
  rationale: Reproduz diretamente a ideia de exercer a realeza e combina naturalmente com a referência territorial introduzida por «sobre».
- source_word: τῆς Ἀσίας
  choice: sobre a Ásia
  rationale: Mantém o nome geográfico do grego, enquanto a nota esclarece seu alcance histórico.
- source_word: περιθέσθαι τὸ διάδημα
  choice: pôr o diadema
  rationale: O diadema era a insígnia específica da realeza helenística; a formulação é clara e preserva a imagem do original.
- source_word: ἐκτεῖναι χεῖρας ἐπ’ Ἀντίοχον
  choice: levantar a mão contra o rei Antíoco
  rationale: É uma expressão portuguesa natural para ação hostil, preservando a imagem corporal e sem especificar indevidamente a forma do ataque.
- source_word: τὸν βασιλέα
  choice: o rei
  rationale: Mantém de modo explícito o título aposto a Antíoco.
