  text: And Jonathan heard that Demetrius’s commanders had returned with a much larger force than before to make war against him.
translation:
  language: pt
  text: Jônatas soube que os comandantes de Demétrio tinham voltado com uma força muito maior do que antes para guerrear contra ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν
  choice: soube
  rationale: No contexto narrativo de recebimento de notícias, «soube» comunica naturalmente em português o resultado de ouvir um relato, sem especificar indevidamente o meio da informação.
- source_word: οἱ ἄρχοντες Δημητρίου
  choice: os comandantes de Demétrio
  rationale: Embora ἄρχοντες possa designar governantes, líderes ou oficiais, o contexto de força militar e combate favorece a função de comandantes.
- source_word: ἐπέστρεψαν
  choice: tinham voltado
  rationale: O mais-que-perfeito composto marca com clareza que o retorno ocorreu antes de Jônatas receber a notícia.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: com uma força muito maior
  rationale: Em contexto militar, δύναμις indica tropas ou força armada; «muito maior» integra de modo idiomático a comparação expressa pela frase seguinte.
- source_word: ὑπὲρ τὸ πρότερον
  choice: do que antes
  rationale: A expressão estabelece uma comparação com a força anterior; «do que antes» é clara, concisa e natural.
- source_word: τοῦ πολεμῆσαι πρὸς αὐτόν
  choice: para guerrear contra ele
  rationale: O infinitivo articular expressa propósito, e «guerrear» preserva o sentido de hostilidade militar sustentada de πολεμέω.
