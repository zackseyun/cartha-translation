  verdict: approve
  source_fidelity: O texto reproduz adequadamente o sentido do grego. «Soube» expressa de modo natural a receção da notícia (ἤκουσεν); «os comandantes de Demétrio» é apropriado para οἱ ἄρχοντες Δημητρίου no contexto militar; e «tinham voltado» comunica corretamente a ação anterior ao momento em que Jônatas tomou conhecimento dela. «Com uma força muito maior do que antes» transmite a força numerosa e a comparação com a situação anterior (μετὰ δυνάμεως πολλῆς ὑπὲρ τὸ πρότερον), sem alteração material de sentido. «Para guerrear contra ele» preserva o propósito expresso pelo infinitivo.
