  yaml_path: translation/deuterocanon/1_maccabees/012/041.yaml
  text: And Jonathan went out to meet him with forty thousand chosen men for battle[a], and he came to Beth-shan.
translation:
  language: pt
  text: E Jônatas saiu ao encontro dele com quarenta mil homens escolhidos para a batalha[a] e chegou a Bete-Seã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a formação de batalha” ou “para serem dispostos em combate”; a expressão grega se refere mais literalmente à disposição em linha de batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Reproduz diretamente o sentido narrativo de ἐξέρχομαι, sem acrescentar a ideia de marcha militar.
- source_word: εἰς ἀπάντησιν αὐτῷ
  choice: ao encontro dele
  rationale: Expressão portuguesa natural que preserva a finalidade indicada por εἰς e o referente pronominal sem identificá-lo além do grego.
- source_word: ἐν τεσσεράκοντα χιλιάσιν ἀνδρῶν
  choice: com quarenta mil homens
  rationale: 'Neste contexto, ἐν tem valor associativo: Jônatas saiu acompanhado por quarenta mil homens. A formulação é clara e idiomática em português.'
- source_word: ἐπιλεγμέναις
  choice: escolhidos
  rationale: Comunica que os homens eram especialmente selecionados, mantendo o sentido militar elevado sem paráfrase excessiva.
- source_word: εἰς παρατάξιν
  choice: para a batalha
  rationale: Expressa de modo claro a finalidade militar; a nota preserva o sentido mais literal de disposição em formação de combate.
- source_word: ἦλθεν
  choice: chegou
  rationale: Com um destino expresso, “chegou a” é a forma mais natural em português e comunica adequadamente o movimento de ἔρχομαι.
- source_word: Βεθσάν
  choice: Betsã
  rationale: Forma transliterada e adaptada à ortografia portuguesa do topônimo grego.
