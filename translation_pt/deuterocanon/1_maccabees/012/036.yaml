base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/012/036.yaml
  text: and to fortify the walls of Jerusalem[a], and to raise a great barrier between the citadel and the city so as to separate it from the city, so that it might stand by itself, in order that they might neither buy nor sell.
translation:
  language: pt
  text: e reforçar as muralhas de Jerusalém, e erguer uma grande barreira entre a cidadela[a] e a cidade, a fim de separá-la da cidade, para que ficasse isolada e eles não pudessem nem comprar nem vender.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a Acra”, a fortaleza situada em Jerusalém.
    reason: Alternativa lexical e designação histórica específica.
lexical_decisions:
- source_word: προφυῶσαι
  choice: reforçar
  rationale: O verbo raro sugere acrescentar força ou estruturas defensivas. “Reforçar” expressa com clareza a ação militar sem especificar uma técnica de construção não explicitada.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: as muralhas de Jerusalém
  rationale: “Muralhas” é o termo corrente e preciso para os muros defensivos de uma cidade.
- source_word: ὑψῶσαι ὕψος μέγα
  choice: erguer uma grande barreira
  rationale: A expressão grega, literalmente próxima de “erguer uma grande altura”, enfatiza uma estrutura elevada. No contexto, sua função é separar a cidadela da cidade; “grande barreira” comunica isso naturalmente, sem definir o material ou a forma exata.
- source_word: ἄκρας
  choice: a cidadela
  rationale: Aqui designa a fortaleza conhecida historicamente como Acra. “Cidadela” torna sua função imediatamente compreensível, enquanto a nota preserva a designação histórica.
- source_word: εἰς τὸ διαχωρίσαι αὐτὴν τῆς πόλεως
  choice: a fim de separá-la da cidade
  rationale: A construção indica finalidade, e o pronome feminino retoma naturalmente “cidadela” em português.
- source_word: κατὰ μόνας
  choice: ficasse isolada
  rationale: A expressão indica que a cidadela permaneceria separada, por si só; “isolada” é natural e exato no contexto.
- source_word: ὅπως μήτε ἀγοράζωσιν μήτε πωλῶσιν
  choice: eles não pudessem nem comprar nem vender
  rationale: Preserva a finalidade ou consequência pretendida e mantém implícita, como no grego, a identificação dos ocupantes da cidadela.
theological_decisions:
- issue: Designação histórica de ἄκρα
  choice: “a cidadela” no texto principal
  alternative: “a Acra” ou “a fortaleza”
  rationale: Não há questão doutrinária envolvida, mas existe especificidade histórica. A tradução funcional favorece a leitura comum, e a nota registra o nome tradicional.
- issue: Referente do sujeito plural em “comprem” e “vendam”
  choice: Manter “eles” sem identificar expressamente o grupo
  alternative: “os ocupantes da cidadela”
  rationale: O grego deixa o sujeito plural implícito. Evita-se acrescentar uma identificação que, embora provável pelo contexto, não está formulada no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial foi mantida por este versículo continuar a frase e a lista de ações do contexto anterior. Evitaram-se arcaísmos e explicações históricas dentro do texto principal.
