  text: And you[a], gather to yourselves all who practice the law[b], and take vengeance for your people.
translation:
  language: pt
  text: E vocês, tragam para junto de vocês todos os que praticam a lei[a] e tomem vingança pelo seu povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “todos os cumpridores da lei” ou “todos os que fazem a lei”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “vinguem a vingança do seu povo”. O grego combina palavras da mesma raiz para dar intensidade à ordem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσάξετε πρὸς ὑμᾶς
  choice: reúnam consigo
  rationale: A combinação do verbo com a expressão preposicional indica trazer pessoas para junto de si, incorporando-as ao próprio grupo. “Reúnam consigo” é natural em português e preserva a ideia de congregar aliados.
- source_word: πάντας τοὺς ποιητὰς τοῦ νόμου
  choice: todos os que praticam a lei
  rationale: Neste contexto, ποιητάς designa os que fazem, cumprem ou praticam, não autores da lei. “Praticam a lei” comunica observância ativa com clareza e proximidade ao grego.
- source_word: ἐκδικήσατε ἐκδίκησιν
  choice: tomem vingança
  rationale: A construção grega emprega verbo e substantivo cognatos, intensificando a ordem. “Tomem vingança” mantém a força da expressão sem produzir uma repetição artificial em português.
- source_word: τοῦ λαοῦ ὑμῶν
  choice: pelo seu povo
  rationale: O genitivo ligado a ἐκδίκησιν exprime a vingança exercida em favor ou em defesa do povo. “Pelo seu povo” é idiomático e preserva essa relação sem explicá-la em excesso.
theological_decisions:
- issue: Tradução de νόμος no contexto judaico de 1 Macabeus
  choice: a lei
  alternative: a Lei
  rationale: O contexto aponta para a lei ancestral, a Torá, mas o grego não contém uma distinção gráfica equivalente à inicial maiúscula. A forma “a lei” mantém a referência contextual sem introduzir uma convenção editorial ausente da fonte.
- issue: Sentido da vingança ordenada
  choice: tomem vingança pelo seu povo
  alternative: vinguem o seu povo
  rationale: A formulação escolhida conserva o substantivo ἐκδίκησιν e deixa intacta a tensão moral e teológica da ordem, sem suavizá-la nem especificar além do texto quem deve sofrer a vingança.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa do plural e formas verbais de uso amplo no Brasil. A redação evita tanto arcaísmos como uma paráfrase explicativa. Os marcadores foram posicionados junto às expressões a que cada nota se refere.
