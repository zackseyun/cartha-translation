base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/023.yaml
  text: And as soon as he had finished speaking these words[a], a Jewish man came forward in the sight of all to offer sacrifice on the altar in Modein, according to the king's command.
translation:
  language: pt
  text: Assim que ele terminou de dizer essas palavras, um homem judeu[a] aproximou-se, à vista de todos, para oferecer sacrifício sobre o altar em Modeim, conforme a ordem do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um judeu” ou “um homem da Judeia”. O termo grego pode indicar identidade judaica ou origem judeana; neste contexto, a identidade judaica é provavelmente o sentido principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐπαύσατο
  choice: Assim que ele terminou
  rationale: Expressa de modo natural a sequência temporal imediata indicada pela construção grega, sem recorrer ao literalismo pouco idiomático de “quando cessou”.
- source_word: λαλῶν τοὺς λόγους τούτους
  choice: de dizer essas palavras
  rationale: Reproduz com clareza o conteúdo da construção participial e mantém a referência explícita às palavras que acabavam de ser pronunciadas.
- source_word: προσῆλθεν
  choice: aproximou-se
  rationale: Preserva o sentido básico de movimento em direção ao local da ação; o contexto público é explicitado pela expressão seguinte.
- source_word: ἀνὴρ Ἰουδαῖος
  choice: um homem judeu
  rationale: Mantém o masculino singular de ἀνήρ e comunica o provável sentido étnico-religioso de Ἰουδαῖος, deixando em nota a possível nuance geográfica.
- source_word: ἐν ὀφθαλμοῖς πάντων
  choice: à vista de todos
  rationale: Equivalente português natural e digno para o idioma grego que enfatiza que a ação ocorreu publicamente.
- source_word: θυσιάσαι
  choice: para oferecer sacrifício
  rationale: O infinitivo indica finalidade, e esta formulação conserva de modo explícito o sentido cultual do verbo.
- source_word: ἐπὶ τοῦ βωμοῦ
  choice: sobre o altar
  rationale: Tradução direta que preserva a localização ritual da oferta.
- source_word: ἐν Μωδεείμ
  choice: em Modeim
  rationale: Translitera o topônimo grego de forma clara e compatível com a ortografia portuguesa.
- source_word: κατὰ τὸ πρόσταγμα τοῦ βασιλέως
  choice: conforme a ordem do rei
  rationale: πρόσταγμα designa uma determinação autoritativa; “ordem” é conciso e natural em português.
theological_decisions:
- issue: Sentido de Ἰουδαῖος
  choice: homem judeu
  alternative: um judeu; um homem da Judeia
  rationale: No contexto, a identidade étnico-religiosa parece mais relevante que uma simples origem regional. A tradução preserva também o substantivo masculino ἀνήρ, enquanto a nota reconhece a amplitude semântica genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. A sintaxe acompanha a progressão narrativa do grego sem soar rígida.
