  text: What nation has not inherited a kingdom and taken hold of its spoils?[a]
translation:
  language: pt
  text: Que nação não herdou um reino e não se apoderou dos seus despojos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do seu saque” ou “do seu butim”. O termo grego σκῦλα designa despojos tomados em conquista ou guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῖον ἔθνος
  choice: Que nação
  rationale: Expressa naturalmente a pergunta retórica; “nação” corresponde ao sentido político e coletivo de ἔθνος.
- source_word: οὐκ ἐκληρονόμησεν
  choice: não herdou
  rationale: Preserva a metáfora de receber por herança ou como posse atribuída, sem reduzi-la simplesmente a conquista.
- source_word: βασιλείαν
  choice: um reino
  rationale: No paralelismo com a apropriação de despojos, o sentido político concreto de “reino” é o mais natural, embora o termo também possa indicar realeza ou domínio.
- source_word: οὐκ ἐκράτησεν
  choice: não se apoderou
  rationale: Reproduz a ideia de tomar posse ou obter controle, com naturalidade em português e sem explicitar além do grego o modo da ação.
- source_word: τῶν σκύλων αὐτῆς
  choice: dos seus despojos
  rationale: σκῦλα designa bens tomados em guerra ou conquista. “Despojos” preserva esse sentido; “seus” mantém a referência pronominal suficientemente aberta no português.
