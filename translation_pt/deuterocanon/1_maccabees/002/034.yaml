  text: And they said, “We will not come out, nor will we do the king’s word, to profane the Sabbath day.”
translation:
  language: pt
  text: 'E eles disseram: “Não sairemos, nem cumpriremos a ordem do rei para profanar o dia de sábado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελευσόμεθα
  choice: sairemos
  rationale: O futuro médio de ἐξέρχομαι significa ‘sair’. No contexto de pessoas convocadas a deixar seu esconderijo, ‘não sairemos’ é natural e fiel.
- source_word: ποιήσομεν τὸν λόγον τοῦ βασιλέως
  choice: cumpriremos a ordem do rei
  rationale: A expressão significa literalmente ‘faremos a palavra do rei’, isto é, executaremos sua determinação. ‘Cumprir a ordem’ comunica esse sentido idiomático em português sem reduzir a frase a mera concordância verbal.
- source_word: βεβηλῶσαι
  choice: profanar
  rationale: O infinitivo indica o propósito ligado ao cumprimento da ordem real. ‘Profanar’ preserva o sentido religioso de tratar como comum aquilo que é santo.
- source_word: ἡμέραν τῶν σαββάτων
  choice: o dia de sábado
  rationale: Embora σαββάτων tenha forma plural, a expressão grega é idiomática e designa o sábado singular. ‘O dia de sábado’ é claro e natural em português.
theological_decisions:
- issue: Linguagem de santidade em βεβηλῶσαι τὴν ἡμέραν τῶν σαββάτων
  choice: profanar o dia de sábado
  alternative: violar o dia de sábado
  rationale: ‘Profanar’ mantém a dimensão de santidade e sacrilégio presente no verbo grego; ‘violar’ poderia soar apenas como transgressão de uma regra.
- issue: Relação do infinitivo βεβηλῶσαι com a ordem do rei
  choice: para profanar
  alternative: profanando
  rationale: A construção com ‘para’ expressa de modo natural a finalidade ou consequência pretendida pela ordem, sem afirmar mais do que a sintaxe grega permite.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita literalismos pouco naturais como ‘fazer a palavra do rei’, mas conserva a força de executar uma ordem real e o registro religioso de ‘profanar’.
