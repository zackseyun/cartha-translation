  text: E Matatias e seus filhos foram de lugar em lugar e derrubaram os altares deles,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: percorreram a região
  rationale: O verbo exprime a ideia de andar ao redor ou fazer um circuito. No contexto, a formulação comunica deslocamento de lugar em lugar sem sugerir um cerco militar. O singular grego com sujeito composto foi vertido naturalmente pelo plural em português.
- source_word: καθεῖλον
  choice: derrubaram
  rationale: O aoristo indica pôr abaixo ou demolir; “derrubaram” é direto, natural e adequado à destruição física dos altares.
- source_word: βωμοὺς
  choice: altares
  rationale: βωμός designa normalmente um altar. “Altares” preserva o referente cultual sem introduzir a noção distinta de lugares altos.
- source_word: αὐτῶν
  choice: deles
  rationale: O pronome possessivo remete naturalmente ao grupo adversário mencionado no contexto. “Deles” preserva essa referência sem identificar o grupo de modo mais específico do que o grego.
- source_word: Ματταθίας
  choice: Matatias
  rationale: Forma tradicional e amplamente reconhecível do nome em português bíblico.
theological_decisions:
- issue: Referente cultual das estruturas destruídas
  choice: os altares deles
  alternative: os altares em geral
  rationale: O pronome αὐτῶν associa os altares ao grupo adversário ou idólatra do contexto. A tradução conserva o possessivo sem acrescentar uma caracterização doutrinária ausente da frase.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Percorreram a região” torna idiomática a ação itinerante implícita em ἐκύκλωσεν; a vírgula final foi mantida porque o versículo fornecido prossegue sintaticamente no contexto.
