lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca de modo natural e conciso a sequência narrativa.
- source_word: κατέβησαν
  choice: desceram
  rationale: Preserva a linguagem explícita de descida presente no aoristo de καταβαίνω.
- source_word: πολλοὶ
  choice: muitos
  rationale: Equivalente quantitativo direto e idiomático.
- source_word: ζητοῦντες
  choice: que buscavam
  rationale: Expressa o aspecto contínuo do particípio presente e caracteriza essas pessoas pelo que procuravam.
- source_word: δικαιοσύνην
  choice: a justiça
  rationale: Em português, «justiça» abrange retidão moral e fidelidade ao que é justo; o artigo torna a coordenação natural sem eliminar a distinção em relação a κρίμα.
- source_word: καὶ κρίμα
  choice: e o juízo
  rationale: «Juízo» preserva o valor judicial de κρίμα e evita traduzir os dois substantivos gregos pela mesma palavra.
- source_word: εἰς τὴν ἔρημον
  choice: para o deserto
  rationale: «Deserto» é a forma bíblica corrente em português para uma região erma ou desabitada, sem exigir que o terreno seja arenoso.
- source_word: καθίσαι ἐκεῖ
  choice: a fim de se estabelecer ali
  rationale: Comunica a finalidade de fixar residência, em vez do sentido literal inadequado de sentar-se.
theological_decisions:
- issue: Relação entre δικαιοσύνη e κρίμα
  choice: a justiça e o juízo
  alternative: a retidão e a justiça
  rationale: A tradução mantém dois ideais relacionados sem fundi-los. «Justiça» é a equivalência portuguesa mais ampla e natural para δικαιοσύνη neste contexto, enquanto «juízo» conserva a dimensão judicial de κρίμα; a nota registra uma alternativa possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a linguagem de descida e a distinção lexical do par grego.
