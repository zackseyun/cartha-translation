  text: Then many who were seeking righteousness and justice went down into the wilderness to settle there,[a]
translation:
  language: pt
  text: Então muitos que buscavam a justiça e o juízo desceram para o deserto a fim de se estabelecer ali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a retidão e a justiça”. O grego reúne δικαιοσύνη e κρίμα, termos cujos sentidos podem se sobrepor, mas que provavelmente preservam dois ideais relacionados.'
