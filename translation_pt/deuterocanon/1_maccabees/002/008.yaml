  text: Seu santuário tornou-se como um homem ilustre;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seu templo tornou-se como um homem honrado”. O grego ναός pode ser traduzido por “templo” ou “santuário”, e ἔνδοξος pode significar “honrado”, “glorioso” ou “ilustre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: santuário
  rationale: Pode designar o templo ou, mais especificamente, seu recinto sagrado. “Santuário” preserva o sentido cúltico sem restringir nem ampliar indevidamente a referência.
- source_word: ἐγένετο
  choice: tornou-se
  rationale: O aoristo de γίνομαι indica mudança de estado; “tornou-se” expressa isso de modo natural e digno em português.
- source_word: αὐτῆς
  choice: seu
  rationale: O pronome feminino retoma Jerusalém personificada no contexto. Em português, “seu” mantém a relação possessiva com naturalidade, embora não marque por si só o gênero do referente.
- source_word: ὡς ἀνὴρ ἔνδοξος
  choice: como um homem de honra
  rationale: Mantém a comparação masculina singular e o campo semântico de dignidade, honra ou renome de ἔνδοξος, sem tentar resolver a tensão dessa imagem no contexto de lamentação.
