  text: And they circumcised the uncircumcised boys[a], as many as they found within the borders of Israel[b], by force.
translation:
  language: pt
  text: E circuncidaram os meninos incircuncisos, todos os que encontraram no território de Israel[a], à força.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas regiões de Israel” ou “dentro dos limites de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com força”; aqui, a expressão indica coerção.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέτεμον
  choice: circuncidaram
  rationale: Aoristo ativo de περιτέμνω, verbo comum e específico para realizar a circuncisão.
- source_word: τὰ παιδάρια
  choice: os meninos
  rationale: παιδάριον pode designar uma criança ou um menino. Neste contexto de circuncisão, “meninos” expressa com clareza o referente provável sem fixar uma idade mais precisa do que o grego.
- source_word: τὰ ἀπερίτμητα
  choice: incircuncisos
  rationale: O adjetivo caracteriza diretamente os meninos como não circuncidados; “incircuncisos” é conciso e preserva a formulação do grego.
- source_word: ὅσα εὗρεν
  choice: todos os que encontraram
  rationale: A expressão neutra plural tem sentido abrangente e distributivo. Embora εὗρεν esteja no singular no texto de Swete, o contexto requer em português uma referência natural ao grupo agente; a tradução comunica que nenhum dos meninos encontrados foi excluído.
- source_word: ἐν ὁρίοις Ἰσραήλ
  choice: no território de Israel
  rationale: ὅρια pode indicar limites, território ou regiões. “No território de Israel” é natural em português e mantém o sentido geográfico sem sugerir apenas a linha fronteiriça.
- source_word: ἐν ἰσχύϊ
  choice: à força
  rationale: Literalmente relacionada a força ou poder, a expressão neste contexto indica que a ação foi imposta. “À força” comunica diretamente seu caráter coercitivo.
theological_decisions:
- issue: Valor moral e teológico da circuncisão imposta
  choice: 'Descrever sem atenuar nem justificar: “à força”.'
  alternative: “com força” ou “poderosamente”
  rationale: O contexto favorece coerção. A tradução conserva a severidade da ação, mas não acrescenta ao relato um juízo moral explícito que o versículo não formula.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase acompanha de perto o grego, enquanto “todos os que encontraram” evita uma construção excessivamente rígida.
