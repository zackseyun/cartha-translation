  yaml_path: translation/deuterocanon/1_maccabees/002/009.yaml
  text: The vessels of her glory were carried away captive[a]; her infants were slain in her streets[b], her young men by the enemy’s sword.
translation:
  language: pt
  text: Os utensílios da glória dela foram levados para o cativeiro[a]; suas crianças pequenas foram mortas nas ruas dela[b], e seus jovens, pela espada do inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram levados como cativos”. O grego retrata uma remoção forçada para o cativeiro.'
    reason: lexical_alternative
  - marker: b
    text: Os possessivos femininos referem-se à cidade personificada no contexto, provavelmente Jerusalém ou Sião.
    reason: cross_reference
lexical_decisions:
- source_word: σκεύη
  choice: utensílios
  rationale: O termo pode designar vasos, objetos ou utensílios. “Utensílios” preserva a amplitude do grego sem limitar a referência explicitamente aos vasos do templo.
- source_word: δόξης
  choice: glória
  rationale: Mantém o tom elevado e a possível ressonância sagrada de δόξα, sem reduzir o sentido a mero esplendor material.
- source_word: αἰχμάλωτα ἀπήχθη
  choice: foram levados para o cativeiro
  rationale: Expressa a remoção forçada e o destino de cativeiro, embora o referente sejam objetos, para os quais “levados como cativos” soaria menos natural em português.
- source_word: νήπια
  choice: crianças pequenas
  rationale: νήπια indica crianças muito novas; a expressão é clara e atual, sem afirmar uma faixa etária tão estreita quanto “bebês”.
- source_word: ἀπεκτάθη
  choice: foram mortas
  rationale: Traduz diretamente o ato de matar em registro grave e natural no português contemporâneo.
- source_word: πλατείαις
  choice: ruas
  rationale: O termo pode indicar ruas largas ou espaços públicos abertos; “ruas” é a opção contextual mais natural sem especificação indevida.
- source_word: νεανίσκοι
  choice: jovens
  rationale: Preserva o contraste etário com as crianças e soa mais natural do que uma formulação excessivamente marcada.
- source_word: ῥομφαίᾳ
  choice: espada
  rationale: É o equivalente claro e tradicional para a arma indicada; o possível tamanho maior da lâmina não é decisivo neste contexto.
- source_word: ἐχθροῦ
  choice: do inimigo
  rationale: O singular grego pode funcionar de modo representativo ou coletivo, e a forma definida comunica com clareza a agência hostil.
theological_decisions:
- issue: Referente dos possessivos femininos repetidos
  choice: Manter a referência feminina sem identificar nominalmente a cidade no versículo
  alternative: Explicitar “Jerusalém” ou “Sião”
  rationale: O grego depende do contexto para o antecedente de αὐτῆς. A tradução conserva a personificação e evita resolver no próprio versículo uma identificação apenas contextual.
translation_notes:
  register: Português moderno, claro e solene, com estrutura paralela própria de um lamento. A repetição dos possessivos foi parcialmente preservada para manter a personificação feminina, sem tornar a frase excessivamente rígida.
