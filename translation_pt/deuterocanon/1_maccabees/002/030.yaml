translation:
  language: pt
  text: eles, seus filhos, suas mulheres e seus animais, porque os males que os atingiam haviam se agravado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «porque as aflições que os atingiam haviam se tornado severas» ou «porque as calamidades se agravaram contra eles». A expressão grega usa «os males» no sentido de aflições ou adversidades.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: eles
  rationale: Dá continuidade ao sujeito do versículo anterior; o contexto não exige explicitar a possível ênfase de «eles mesmos».
- source_word: οἱ υἱοὶ αὐτῶν
  choice: seus filhos
  rationale: Mantém o sentido masculino específico de υἱοί e soa natural na enumeração familiar.
- source_word: αἱ γυναῖκες αὐτῶν
  choice: suas mulheres
  rationale: No contexto de grupos familiares, refere-se às esposas; «suas mulheres» conserva a expressão abrangente do grego sem tornar a frase pesada.
- source_word: τὰ κτήνη αὐτῶν
  choice: seus animais
  rationale: κτήνη designa de modo amplo os animais possuídos ou domésticos; «animais» é claro e mais abrangente que «gado» ou «rebanhos».
- source_word: ἐσκληρύνθη ἐπʼ αὐτοὺς
  choice: que os atingiam haviam se agravado
  rationale: Expressa idiomaticamente que as adversidades se tornaram duras ou severas sobre eles, evitando o pouco natural «foram endurecidas contra eles».
- source_word: τὰ κακά
  choice: os males
  rationale: Preserva a forma lexical ampla do grego, que neste contexto indica aflições, dificuldades ou calamidades.
