  yaml_path: translation/deuterocanon/1_maccabees/002/025.yaml
  text: And he killed the king’s man who was compelling them to sacrifice at that time[a], and he tore down the altar,
translation:
  language: pt
  text: E, naquela ocasião, ele matou o homem do rei que os obrigava a oferecer sacrifícios[a] e derrubou o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “o homem do rei”, provavelmente um oficial ou agente real.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄνδρα τοῦ βασιλέως
  choice: o homem do rei
  rationale: Preserva a expressão concreta do grego, na qual o genitivo indica alguém ligado ao rei ou que o representa, sem especificar no texto uma função oficial não explicitada.
- source_word: τὸν ἀναγκάζοντα
  choice: que os obrigava
  rationale: ἀναγκάζω expressa coerção; “obrigava” é natural e mantém essa força. O pronome “os” explicita o objeto implícito com base no contexto narrativo.
- source_word: θύειν
  choice: a oferecer sacrifícios
  rationale: Em contexto cultual, θύω significa sacrificar ou oferecer sacrifício; a formulação escolhida é clara e idiomática em português.
- source_word: ἀπέκτεινεν
  choice: matou
  rationale: Traduz diretamente o aoristo de ἀποκτείνω em linguagem moderna, sem arcaísmo nem formalidade excessiva.
- source_word: ἐν τῷ καιρῷ ἐκείνῳ
  choice: naquele momento
  rationale: Mantém o valor temporal e a possível ênfase da expressão, vinculando a ação à ocasião imediata descrita.
- source_word: τὸν βωμὸν
  choice: o altar
  rationale: Equivalente direto e convencional de βωμός no contexto sacrificial.
- source_word: καθεῖλεν
  choice: derrubou
  rationale: καθαιρέω indica fazer cair, remover ou demolir; “derrubou” comunica a ação enérgica contra o altar sem necessariamente afirmar destruição completa.
theological_decisions:
- issue: Objeto implícito de “obrigava a oferecer sacrifícios”
  choice: que os obrigava a oferecer sacrifícios
  alternative: que obrigava as pessoas a oferecer sacrifícios; que o obrigava a oferecer sacrifícios
  rationale: O grego não expressa o objeto de ἀναγκάζοντα, mas o contexto aponta para a coerção exercida sobre os habitantes. “Os” preserva essa referência contextual sem restringi-la a um único indivíduo.
translation_notes:
  register: Português moderno, digno e acessível, com coordenação próxima do grego. “O homem do rei” conserva a formulação literal e sua leve ambiguidade funcional; a nota esclarece a provável referência. O marcador [a] aparece no texto principal.
