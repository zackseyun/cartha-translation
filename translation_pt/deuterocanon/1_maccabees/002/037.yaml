base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/037.yaml
  text: saying[a], “Let us all die in our innocence; heaven and earth testify against you concerning us[b], that you are destroying us unjustly.”
translation:
  language: pt
  text: 'dizendo: “Morramos todos em nossa inocência[a]. O céu e a terra testemunham contra vocês, a nosso respeito: vocês estão nos destruindo injustamente[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em nossa simplicidade”, “sinceridade” ou “inteireza”. Aqui, o grego provavelmente ressalta que eles não tinham culpa nem agiam com duplicidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sem julgamento” ou “sem exame”, isto é, sem que houvesse uma decisão ou apuração justa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: dizendo
  rationale: Preserva de modo natural em português o particípio que introduz a fala citada.
- source_word: Ἀποθάνωμεν οἱ πάντες
  choice: Morramos todos
  rationale: O subjuntivo aoristo na primeira pessoa do plural tem força exortativa; “morramos” expressa a decisão coletiva e mantém a ênfase inclusiva de οἱ πάντες.
- source_word: ἐν τῇ ἁπλότητι ἡμῶν
  choice: em nossa inocência
  rationale: ἁπλότης pode indicar simplicidade, sinceridade ou inteireza; no contexto, “inocência” comunica a condição não culpável e não agressora dos que aceitam morrer.
- source_word: μαρτυρεῖ ἐφʼ ἡμᾶς
  choice: dão testemunho a nosso respeito
  rationale: A formulação mantém o caráter judicial de μαρτυρεῖ e evita definir em excesso a relação ambígua de ἐπί com o pronome; o testemunho do céu e da terra diz respeito às vítimas e confirma a injustiça praticada contra elas.
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: O céu e a terra
  rationale: Reproduz a fórmula bíblica de testemunho. O verbo vai ao plural segundo o uso natural do português, embora o grego empregue o singular com o sujeito composto.
- source_word: ἀκρίτως
  choice: injustamente
  rationale: Comunica de forma clara a força moral e jurídica do advérbio, enquanto a nota preserva o sentido mais literal de ausência de julgamento ou exame.
- source_word: ἀπόλλυτε
  choice: vocês estão nos destruindo
  rationale: Mantém o presente e a segunda pessoa do plural, além do sentido amplo de ἀπόλλυμι, que neste contexto inclui a morte das vítimas.
theological_decisions:
- issue: Sentido de ἁπλότης no contexto de martírio
  choice: inocência moral
  alternative: simplicidade, sinceridade ou inteireza
  rationale: A fala afirma que o grupo morre sem culpa e sem oferecer agressão. A nota conserva a amplitude lexical sem transformar a expressão em uma afirmação doutrinária técnica.
- issue: Relação expressa por μαρτυρεῖ ἐφʼ ἡμᾶς
  choice: testemunho a respeito das vítimas
  alternative: testemunho a favor delas ou contra os perseguidores por causa delas
  rationale: A preposição admite matizes contextuais. “A nosso respeito” preserva a referência às vítimas sem resolver além do necessário a direção judicial do testemunho; a oração seguinte explicita a acusação de injustiça.
- issue: Força de ἀκρίτως
  choice: injustamente
  alternative: sem julgamento, sem processo ou sem exame
  rationale: O texto denuncia tanto a ausência de julgamento quanto a injustiça resultante. A tradução principal é acessível, e a nota mantém o matiz jurídico literal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” torna explícita a segunda pessoa do plural do verbo grego. A construção “dão testemunho a nosso respeito” conserva o tom judicial e a ambiguidade legítima da preposição, sem impor uma leitura denominacional.
