  yaml_path: translation/deuterocanon/1_maccabees/002/017.yaml
  text: And those from the king answered and said to Mattathias[a], saying, “You are a ruler, honored and great in this city[b], and supported by sons and brothers.”
translation:
  language: pt
  text: 'Os representantes do rei[a] responderam e disseram a Matatias: “Você é uma autoridade, ilustre e importante nesta cidade e está amparado por filhos e irmãos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os que eram da parte do rei”; isto é, os representantes do rei.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “está firmemente estabelecido com filhos e irmãos”. O grego pode destacar tanto o apoio da família de Matatias quanto a posição sólida que ele tinha por meio dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: os representantes do rei
  rationale: A expressão significa literalmente “os que eram da parte do rei”; no contexto, designa seus agentes ou representantes. A escolha comunica essa função com clareza sem especificar indevidamente que fossem mensageiros.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν ... λέγοντες
  choice: responderam e disseram
  rationale: Mantém os dois verbos principais da fórmula narrativa grega. O particípio λέγοντες não é reproduzido como um terceiro verbo redundante, pois os dois-pontos introduzem naturalmente a fala em português.
- source_word: Ἄρχων
  choice: autoridade
  rationale: Aqui o termo indica uma pessoa de posição e influência reconhecidas na comunidade. “Autoridade” é natural em português e evita sugerir que Matatias governasse formalmente a cidade.
- source_word: ἔνδοξος
  choice: ilustre
  rationale: Expressa reputação pública e distinção social; “ilustre” conserva o tom elevado sem o sentido potencialmente inadequado de “glorioso”.
- source_word: μέγας
  choice: importante
  rationale: No contexto da posição social de Matatias, o adjetivo aponta para grandeza ou relevância. “Importante” transmite esse valor de modo idiomático.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: nesta cidade
  rationale: Tradução direta e natural de πόλις, preservando a referência ao lugar onde Matatias tinha destaque.
- source_word: ἐστηριγμένος ἐν υἱοῖς καὶ ἀδελφοῖς
  choice: está amparado por filhos e irmãos
  rationale: O particípio sugere firmeza, apoio ou posição consolidada, e a construção com filhos e irmãos provavelmente indica apoio familiar. “Amparado por” conserva essa leitura sem eliminar a possibilidade de que sua posição estivesse estabelecida por meio da família.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição narrativa “responderam e disseram” foi mantida para refletir a textura do original, enquanto “dizendo” foi representado pelos dois-pontos para evitar artificialidade. O tratamento “você” torna a fala direta natural sem perder o respeito transmitido pelos títulos.
