base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/049.yaml
  text: And the days drew near for Mattathias to die[a], and he said to his sons, “Now arrogance and reproach have grown strong[b], and it is a time of ruin and furious wrath.”
translation:
  language: pt
  text: 'Aproximavam-se os dias em que Matatias morreria, e ele disse a seus filhos: “Agora a arrogância e a desonra se firmaram[a]; este é um tempo de ruína e de ira furiosa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram estabelecidas” ou “se tornaram arraigadas”; o verbo grego ressalta que a arrogância e a desonra ficaram firmemente instaladas.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega combina dois termos próximos para “ira”, intensificando a ideia. O texto não especifica de quem é essa ira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: aproximavam-se
  rationale: Preserva a imagem temporal de dias que se aproximam e soa natural na abertura narrativa em português.
- source_word: αἱ ἡμέραι τοῦ Ματταθίου ἀποθανεῖν
  choice: os dias em que Matatias morreria
  rationale: Expressa de modo idiomático a construção grega com infinitivo, mantendo tanto o plural 'dias' quanto a proximidade da morte de Matatias.
- source_word: Νῦν
  choice: Agora
  rationale: Mantém o marcador discursivo com que Matatias avalia a crise presente.
- source_word: ἐστηρίχθη
  choice: se firmaram
  rationale: 'Comunica o sentido resultativo do aoristo passivo: a arrogância e a desonra se estabeleceram ou se tornaram arraigadas.'
- source_word: ὑπερηφανία
  choice: arrogância
  rationale: Transmite claramente a soberba altiva e opressora indicada pelo termo grego.
- source_word: ἔλεγμος
  choice: desonra
  rationale: No contexto de uma crise pública, representa melhor uma condição de opróbrio ou vergonha do que um simples ato verbal de repreensão.
- source_word: καιρὸς καταστροφῆς
  choice: um tempo de ruína
  rationale: Mantém o caráter decisivo de καιρός e a força ominosa de καταστροφή sem restringir o termo a uma forma específica de destruição.
- source_word: ὀργὴ θυμοῦ
  choice: ira furiosa
  rationale: Reproduz em português legível a intensificação criada pela combinação de dois termos gregos relacionados à ira.
theological_decisions:
- issue: De quem é a ira mencionada
  choice: Não identificar o sujeito ou possuidor da ira
  alternative: Explicitar que se trata da ira de Deus ou da fúria dos perseguidores humanos
  rationale: O grego menciona a ira, mas não declara de quem ela procede; a tradução preserva essa ambiguidade teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe inicial conserva a imagem dos dias que se aproximam sem reproduzir de forma artificial a construção infinitiva grega.
