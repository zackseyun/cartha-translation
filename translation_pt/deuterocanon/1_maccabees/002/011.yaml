  text: All her glory was taken away; instead of being free[a], she became a slave.
translation:
  language: pt
  text: Toda a sua glória[a] lhe foi tirada; de livre, tornou-se escrava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Todo o seu esplendor” ou “Todo o seu adorno”. Aqui, a palavra grega κόσμος se refere a adorno ou esplendor, não ao “mundo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: toda
  rationale: Com o substantivo singular κόσμος, expressa totalidade coletiva; “toda a sua glória” é natural em português.
- source_word: κόσμος
  choice: glória
  rationale: Neste contexto, designa aquilo que adorna e confere esplendor ou honra, e não o “mundo”. “Glória” comunica de modo natural a dignidade e o esplendor perdidos.
- source_word: ἀφηρέθη
  choice: lhe foi tirada
  rationale: Preserva a voz passiva e a ideia de privação causada por um agente externo, sem especificar indevidamente o modo.
- source_word: ἀντί
  choice: de livre
  rationale: Na construção “de livre, tornou-se escrava”, comunica de forma idiomática a substituição e a reversão de condição expressas por ἀντί.
- source_word: ἐλευθέρας
  choice: livre
  rationale: Mantém o adjetivo feminino ligado à cidade personificada e o contraste direto com “escrava”.
- source_word: δούλην
  choice: escrava
  rationale: O contraste explícito com ἐλευθέρα torna central a perda da liberdade; “escrava” representa com precisão a condição de sujeição.
theological_decisions:
- issue: Tradução de δούλη em contraste com ἐλευθέρα
  choice: escrava
  alternative: serva
  rationale: O verso descreve uma reversão da liberdade para a sujeição. “Escrava” preserva com maior clareza a condição de não liberdade indicada pelo contraste grego, sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com personificação feminina preservada. A formulação concisa “de livre, tornou-se escrava” mantém o paralelismo e a forte reversão de condição do grego.
