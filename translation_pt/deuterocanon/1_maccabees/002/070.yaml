base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/070.yaml
  text: And he died in the one hundred forty-sixth year[a], and his sons buried him in the tombs of his fathers at Modein, and all Israel mourned for him with great mourning.
translation:
  language: pt
  text: E ele morreu no centésimo quadragésimo sexto ano[a]. Seus filhos o sepultaram nos túmulos de seus antepassados, em Modein, e todo o Israel o pranteou com grande lamentação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente, o centésimo quadragésimo sexto ano da era selêucida.
    reason: Nota cultural e histórica que identifica a provável era cronológica sem acrescentá-la ao texto grego.
lexical_decisions:
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Traduz de modo direto o aoristo grego, sem introduzir eufemismo.
- source_word: ἐν τῷ ἕκτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: no centésimo quadragésimo sexto ano
  rationale: Reproduz naturalmente em português a fórmula cronológica ordinal, sem acrescentar no texto principal a identificação da era.
- source_word: ἔθαψαν
  choice: sepultaram
  rationale: Verbo corrente e digno para o ato de enterrar, adequado ao contexto funerário.
- source_word: τάφοις πατέρων αὐτοῦ
  choice: nos túmulos de seus antepassados
  rationale: Preserva a referência familiar e ancestral de πατέρων sem restringi-la necessariamente aos pais imediatos.
- source_word: Μωδεείν
  choice: Modein
  rationale: Translitera o topônimo grego de forma compatível com a camada de consulta fornecida.
- source_word: ἐκόψαντο
  choice: pranteou
  rationale: Expressa o luto manifesto indicado pelo verbo, sem especificar gestos rituais que a frase não explicita.
- source_word: κοπετὸν μέγαν
  choice: com grande lamentação
  rationale: Mantém a intensificação do acusativo cognato e evita a repetição pouco natural de 'pranteou com grande pranto'.
- source_word: πᾶς Ἰσραήλ
  choice: todo o Israel
  rationale: Mantém a expressão coletiva convencional referente ao povo como um todo.
theological_decisions:
- issue: Referência da fórmula cronológica
  choice: Manter no texto principal apenas “no centésimo quadragésimo sexto ano”.
  alternative: “No centésimo quadragésimo sexto ano da era selêucida.”
  rationale: O grego não identifica expressamente a era. A identificação selêucida é historicamente provável, mas deve permanecer como nota, preservando a precisão entre texto e interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Antepassados” comunica o sentido ancestral de πατέρων; “pranteou com grande lamentação” preserva o tom público e intenso do luto.
