lexical_decisions:
- source_word: οἱ παρὰ τοῦ Βασιλέως
  choice: os agentes do rei
  rationale: A expressão significa literalmente «os da parte do rei» e, no contexto, designa enviados que agiam com autoridade real. «Agentes do rei» é natural e preserva a ideia de representação sem especificar um cargo não indicado pelo grego.
- source_word: καταναγκάζοντες
  choice: que obrigavam
  rationale: O particípio indica coerção efetiva. «Obrigavam» comunica de modo claro e corrente a força imposta, sem atenuá-la como mera pressão.
- source_word: τὴν ἀποστασίαν
  choice: à apostasia
  rationale: No contexto de 1 Macabeus, refere-se ao abandono forçado da fé e das práticas ancestrais judaicas. «Apostasia» preserva o peso religioso e teológico do termo.
- source_word: εἰς Μωδεείν
  choice: a Modeim
  rationale: Com verbo de movimento, εἰς é naturalmente expresso por «a». «Modeim» é uma transliteração portuguesa clara do topônimo grego Μωδεείν.
- source_word: Καὶ ἦλθον
  choice: E ... chegaram
  rationale: «E» preserva o conectivo narrativo grego; «chegaram» é a forma mais natural em português para a chegada dos agentes ao destino.
theological_decisions:
- issue: Sentido de ἀποστασία no contexto da perseguição
  choice: apostasia em sentido religioso
  alternative: rebelião política ou deserção em sentido geral
  rationale: O contexto imediato trata da coerção para abandonar a observância da aliança e aderir a práticas religiosas pagãs. A leitura religiosa é, portanto, primária, sem transformar o termo em uma explicação interpretativa mais extensa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção mantém a sequência narrativa e a força coercitiva do original sem acrescentar detalhes institucionais.
