base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/066.yaml
  text: And Judas Maccabeus himself, strong in might from his youth, shall be your commander of the army, and you shall fight the battle against the nations.
translation:
  language: pt
  text: E o próprio Judas Macabeu, forte e poderoso desde a juventude,[a] será o comandante do exército de vocês, e vocês travarão guerra contra as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego diz literalmente algo como “forte em poder dele, desde a sua juventude”. A formulação é difícil; a tradução apresenta o sentido aparente, isto é, que Judas era forte desde jovem.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: Judas Macabeu
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome e o epíteto, sem transformar o epíteto em substantivo comum.
- source_word: ἰσχυρὸς δυνάμει
  choice: forte e valente
  rationale: Expressa naturalmente em português a ênfase da combinação pleonástica grega, adequada ao contexto militar, sem a rigidez de 'forte em poder'.
- source_word: ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: desde a juventude
  rationale: Transmite o sentido aparente da frase difícil, isto é, que Judas demonstrava força desde jovem; a redação incomum do texto transmitido é registrada em nota.
- source_word: ἄρχοντα στρατιᾶς
  choice: comandante do exército
  rationale: No contexto militar, ἄρχων designa quem lidera ou comanda, e στρατιά se refere ao exército.
- source_word: πολεμήσετε πόλεμον
  choice: vocês combaterão
  rationale: O português usa naturalmente o verbo 'combater' de modo absoluto neste contexto; a construção cognata grega reforça a ação, mas sua reprodução literal ('combaterão um combate') seria artificial.
- source_word: λαῶν
  choice: as nações
  rationale: Representa os povos estrangeiros enfrentados militarmente sem introduzir a conotação teológica mais específica de 'gentios'.
theological_decisions:
- issue: Tratamento da expressão difícil ἐκ αὐτοῦ ἐκ νεότητος αὐτοῦ
  choice: 'Traduzir segundo o sentido aparente: Judas era forte e valente desde a juventude.'
  alternative: 'Reproduzir literalmente a formulação obscura: ''forte em poder a partir dele, desde a sua juventude''.'
  rationale: O primeiro ἐκ αὐτοῦ torna o texto grego transmitido sintaticamente difícil. A tradução principal comunica o sentido recuperável sem ocultar a dificuldade, que fica documentada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O pronome explícito 'de vocês' evita a ambiguidade de 'vosso'; 'será' preserva a declaração prospectiva do grego.
