    rationale: A construção grega contém verbo e substantivo cognatos («lutarão/travarão guerra»). «Travarão guerra contra as nações» preserva o substantivo e torna clara a relação de oposição.
  revised_text: E o próprio Judas Macabeu, forte e poderoso desde a juventude,[a] será o comandante do exército de vocês, e vocês travarão guerra contra as nações.
