base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/063.yaml
  text: Today he will be exalted[a], and he will surely not be found, because he has returned to his dust[b], and his plans have perished.
translation:
  language: pt
  text: Hoje ele será elevado[a] e de modo algum será encontrado, porque voltou ao seu pó, e seu pensamento[b] pereceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será exaltado”. O grego diz literalmente “será levantado” ou “elevado” e pode indicar elevação de posição ou destaque.'
    reason: lexical_alternative
  - marker: b
    text: “Pensamento” também pode ser traduzido como “plano”, “propósito” ou “raciocínio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: Hoje
  rationale: Mantém a referência temporal imediata e a força sentenciosa do grego.
- source_word: ἐπαρθήσεται
  choice: será elevado
  rationale: Preserva a forma passiva e a imagem de elevação, sem limitar o sentido a honra ou posição social.
- source_word: οὐ μὴ εὑρεθῇ
  choice: de modo algum será encontrado
  rationale: Expressa a negação enfática formada por οὐ μή com o subjuntivo aoristo.
- source_word: ἐπέστρεψεν εἰς τὸν χοῦν αὐτοῦ
  choice: voltou ao seu pó
  rationale: Reproduz de maneira concisa a imagem da mortalidade e o provável eco da linguagem de retorno ao pó.
- source_word: διαλογισμὸς
  choice: pensamento
  rationale: Conserva o singular e a amplitude do termo, que também pode indicar plano, propósito ou raciocínio.
- source_word: ἀπώλετο
  choice: pereceu
  rationale: Mantém a formulação forte e definitiva do verbo grego sem acrescentar uma explicação teológica.
theological_decisions:
- issue: Alcance antropológico de διαλογισμός após a morte
  choice: pensamento
  alternative: plano, propósito ou raciocínio
  rationale: O texto afirma o fim do διαλογισμός da pessoa, mas não identifica esse termo com a alma nem formula uma doutrina completa sobre o estado dos mortos; a tradução preserva essa limitação e ambiguidade.
- issue: Sentido da elevação em ἐπαρθήσεται
  choice: será elevado
  alternative: será exaltado
  rationale: A opção principal conserva a metáfora do grego e permite tanto a ideia de ascensão quanto a de destaque, sem decidir além do que o texto explicita.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. A negação enfática foi vertida de forma natural, e as ambiguidades de ἐπαρθήσεται e διαλογισμός foram mantidas no texto e explicitadas em notas.
