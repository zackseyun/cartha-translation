  yaml_path: translation/deuterocanon/1_maccabees/002/022.yaml
  text: We will not obey the king’s decree by turning aside from our worship, to the right or to the left.
translation:
  language: pt
  text: Não obedeceremos ao decreto do rei[a], nem nos desviaremos do nosso culto para a direita ou para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Não daremos ouvidos à lei do rei”. O verbo grego pode significar “ouvir”, “dar ouvidos” ou, neste contexto, “obedecer”; e “lei” é a tradução mais literal de νόμος.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσόμεθα
  choice: obedeceremos
  rationale: Embora o verbo tenha o sentido básico de “ouvir” ou “dar ouvidos”, neste contexto de uma ordem régia a recusa tem força prática de desobediência. “Obedeceremos” comunica isso com naturalidade em português.
- source_word: νόμον
  choice: decreto
  rationale: Aqui νόμος designa a determinação imposta pelo rei. “Decreto” expressa uma ordem oficial e contextualiza a autoridade régia sem confundi-la com a Lei divina.
- source_word: παρελθεῖν
  choice: desviando-nos
  rationale: O verbo indica passar além ou afastar-se do caminho estabelecido. Esta escolha preserva a imagem direcional desenvolvida por “para a direita ou para a esquerda”.
- source_word: λατρίαν
  choice: culto
  rationale: No contexto, o termo se refere ao serviço religioso e à adoração de Israel. “Culto” é conciso, corrente e mantém o sentido religioso.
- source_word: δεξιὰν ἢ ἀριστεράν
  choice: para a direita ou para a esquerda
  rationale: A tradução mantém literalmente a expressão direcional, que representa qualquer desvio do caminho fiel.
theological_decisions:
- issue: Sentido e referente de “a lei do rei”
  choice: decreto do rei
  alternative: lei do rei; ordem do rei
  rationale: O contexto contrapõe a determinação régia à fidelidade ao culto de Israel. “Decreto” indica uma exigência oficial do rei sem sugerir que ela tenha a mesma condição da Lei divina.
- issue: Relação do infinitivo παρελθεῖν com a recusa
  choice: desviando-nos
  alternative: para nos desviarmos; transgredindo
  rationale: A formulação conserva a ligação entre obedecer ao decreto e abandonar o culto, mas evita tornar excessivamente explícita uma relação sintática que o grego apresenta de forma compacta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção direcional foi mantida por sua força idiomática e ressonância bíblica; “culto” foi preferido a termos técnicos como “serviço cultual”.
