base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/040.yaml
  text: And one man said to his neighbor[a], “If we all do as our brothers did, and do not fight against the Gentiles for our lives and our rights[b], they will quickly destroy us from the land.”
translation:
  language: pt
  text: 'E um homem disse ao seu próximo: “Se todos nós fizermos como fizeram nossos irmãos e não lutarmos contra os gentios[a] em defesa de nossa vida e de nossos direitos[b], eles logo nos exterminarão da terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as nações”. O termo grego frequentemente significa “nações”, mas aqui provavelmente se refere especificamente aos povos não judeus que se opunham aos judeus.
    reason: lexical_alternative
  - marker: b
    text: Ou “nossos estatutos”, “nossas ordenanças” ou “nossas reivindicações legais”. O termo grego pode designar direitos estabelecidos, normas legais ou prerrogativas reconhecidas pelo costume.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ πρὸς τὸν πλησίον αὐτοῦ
  choice: um homem disse ao seu próximo
  rationale: Mantém o indivíduo masculino e a relação expressa por πλησίον, usando uma formulação digna e inteligível em português.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: Conserva o masculino plural do grego e a referência provável aos judeus mencionados anteriormente.
- source_word: πολεμήσωμεν
  choice: lutarmos
  rationale: Expressa de modo natural o sentido militar de combater ou guerrear no contexto de resistência armada.
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: Neste contexto judaico, designa os povos não judeus que se opõem à comunidade; a alternativa mais literal é registrada em nota.
- source_word: ὑπὲρ τῆς ψυχῆς ἡμῶν
  choice: em defesa de nossa vida
  rationale: Aqui ψυχή se refere à preservação da vida, não à alma como entidade abstrata. O singular coletivo do grego é preservado.
- source_word: δικαιωμάτων
  choice: direitos
  rationale: Comunica com clareza as reivindicações, normas ou prerrogativas reconhecidas da comunidade, sem excluir a nuance jurídica indicada em nota.
- source_word: νῦν τάχιον
  choice: logo
  rationale: Transmite a urgência e a rapidez iminente da consequência em português natural, sem a combinação pouco idiomática de 'agora rapidamente'.
- source_word: ὀλεθρεύσουσιν
  choice: exterminarão
  rationale: Preserva a força do verbo grego, que indica destruição severa ou eliminação do povo.
- source_word: ἀπὸ τῆς γῆς
  choice: da terra
  rationale: Refere-se naturalmente à terra ou território em que vivem, sem ampliar o sentido para o planeta inteiro.
theological_decisions:
- issue: Sentido de τὰ ἔθνη no contexto da resistência judaica
  choice: os gentios
  alternative: as nações
  rationale: O contraste com 'nossos irmãos' indica especificamente povos não judeus, embora o substantivo grego possa significar literalmente 'as nações'.
- issue: Alcance semântico de δικαιωμάτων
  choice: direitos
  alternative: estatutos, ordenanças ou reivindicações legais
  rationale: “Direitos” é claro para o leitor moderno e se ajusta à defesa da existência e das prerrogativas comunitárias; a nota conserva a amplitude jurídica e normativa do termo.
- issue: Sentido de ψυχή
  choice: vida
  alternative: alma
  rationale: A ameaça é de destruição física da comunidade; traduzir por “alma” introduziria aqui uma distinção antropológica que o contexto não exige.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A sintaxe acompanha de perto o argumento do grego, enquanto “logo” evita uma reprodução artificial de νῦν τάχιον. Os marcadores de nota foram posicionados junto aos termos que efetivamente explicam.
