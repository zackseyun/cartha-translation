  text: Phinehas our father[a], because he was zealous with zeal, received a covenant of holy priesthood.
translation:
  language: pt
  text: Fineias, nosso pai[a], por seu zelo[b], recebeu uma aliança de sacerdócio santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “pai” tem o sentido de antepassado.
    reason: Esclarece o uso ancestral de πατήρ sem substituir a formulação literal no texto.
  - marker: b
    text: Literalmente, “por ter zelado com zelo”. O grego emprega palavras da mesma raiz para dar ênfase; ou, de modo mais fluente, “por ter demonstrado zelo”.
    reason: Registra a construção cognata enfática do grego e explica a formulação mais idiomática adotada no texto.
lexical_decisions:
- source_word: Φινεὲς
  choice: Fineias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio grego Φινεές.
- source_word: ὁ πατὴρ ἡμῶν
  choice: nosso pai
  rationale: Mantém o termo familiar e a força retórica do grego; neste contexto, “pai” designa um antepassado.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον
  choice: por ter zelado com zelo
  rationale: A construção é entendida causalmente no contexto, enquanto a repetição cognata “zelado com zelo” preserva a ênfase incomum do grego sem explicá-la além do texto.
- source_word: ἔλαβε
  choice: recebeu
  rationale: Expressa adequadamente a obtenção de algo concedido, sem sugerir que Fineias o tomou por conta própria.
- source_word: διαθήκην
  choice: uma aliança
  rationale: “Aliança” é o equivalente bíblico estabelecido e preserva a ligação com a tradição escriturística de Fineias.
- source_word: ἱερωσύνης ἁγίας
  choice: de sacerdócio santo
  rationale: Reproduz diretamente a relação genitiva e mantém “santo” ligado a “sacerdócio”, sem acrescentar duração ou outras qualificações não expressas neste versículo.
theological_decisions:
- issue: Força causal e enfática do zelo de Fineias em relação à aliança
  choice: “por ter zelado com zelo”
  alternative: “quando demonstrou zelo” ou “por ter demonstrado grande zelo”
  rationale: A formulação escolhida comunica a relação causal indicada pelo contexto e conserva a repetição cognata do original, importante para a força retórica e para a alusão à tradição de Fineias, sem acrescentar pormenores interpretativos.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A repetição deliberada em “zelado com zelo” é mais formal que a fala comum, mas preserva uma ênfase real do original; a nota oferece a forma mais fluente.
