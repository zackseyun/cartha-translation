  text: And look—our holy things, our beauty, and our glory have been laid waste, and the nations have defiled them.
translation:
  language: pt
  text: 'E vejam: as nossas coisas santas, a nossa beleza e a nossa glória foram devastadas, e as nações as profanaram.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: vejam
  rationale: Interjeição que chama a atenção dos ouvintes; «vejam» é natural no português atual e preserva a força de apresentação do grego.
- source_word: τὰ ἅγια ἡμῶν
  choice: as nossas coisas santas
  rationale: Mantém o plural substantivado e sua amplitude referencial, sem o restringir indevidamente ao santuário ou a objetos específicos.
- source_word: ἡ καλλονὴ ἡμῶν
  choice: a nossa beleza
  rationale: Equivalente direto de καλλονή, preservando a linguagem afetiva e poética.
- source_word: ἡ δόξα ἡμῶν
  choice: a nossa glória
  rationale: Tradução corrente de δόξα, mantendo a possível dimensão de honra e esplendor.
- source_word: ἠρημώθη
  choice: foram devastadas
  rationale: O passivo exprime que aquilo que era santo, belo e glorioso ficou arruinado ou desolado; «foram devastadas» comunica isso de modo claro.
- source_word: ἔθνη
  choice: as nações
  rationale: Preserva o sentido coletivo e estrangeiro de ἔθνη sem acrescentar uma qualificação teológica ausente do texto.
- source_word: ἐβεβήλωσαν
  choice: profanaram
  rationale: Expressa diretamente a violação do caráter sagrado indicada pelo verbo βεβηλόω.
theological_decisions:
- issue: Referente de «as nossas coisas santas»
  choice: Manter a expressão ampla no plural
  alternative: Traduzir como «o nosso santuário» ou «os nossos lugares santos»
  rationale: O grego τὰ ἅγια é plural e pode abranger realidades sagradas diversas; especificar um único referente eliminaria uma ambiguidade genuína.
- issue: Agente da profanação
  choice: «as nações»
  alternative: «os gentios» ou «os pagãos»
  rationale: «Nações» traduz ἔθνη de forma semanticamente direta e evita importar uma carga confessional ou depreciativa não necessariamente exigida pelo contexto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A abertura «E vejam:» conserva o chamado enfático à atenção; a coordenação e a repetição dos possessivos preservam o ritmo lamentoso do original.
