base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/032.yaml
  text: And many ran after them[a], and when they caught up with them, they encamped against them and joined battle with them on the Sabbath day.
translation:
  language: pt
  text: Muitos correram atrás deles e, depois de alcançá-los, acamparam contra eles e travaram batalha com eles no dia de sábado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “no dia dos sábados”, expressão idiomática que se refere ao dia de sábado.
    reason: Explicar a forma plural do grego, que não deve ser entendida como referência a vários sábados.
lexical_decisions:
- source_word: ἔδραμον ὀπίσω αὐτῶν
  choice: correram atrás deles
  rationale: Preserva a imagem concreta e vívida da perseguição expressa pelo grego, em linguagem portuguesa natural.
- source_word: πολλοί
  choice: muitos
  rationale: Equivalente quantitativo direto e claro.
- source_word: καταλαβόντες αὐτούς
  choice: depois de alcançá-los
  rationale: No contexto de perseguição, καταλαμβάνω indica alcançar quem vai adiante, sem exigir o sentido de capturar ou prender.
- source_word: παρενέβαλον ἐπʼ αὐτούς
  choice: acamparam contra eles
  rationale: Mantém o sentido militar de estabelecer acampamento diante de uma força adversária e conserva a relação hostil indicada por ἐπί.
- source_word: συνεστείλαντο πρὸς αὐτοὺς πόλεμον
  choice: travaram batalha com eles
  rationale: Comunica o início de um confronto militar imediato; evita o sentido mais amplo e prolongado de 'fizeram guerra'.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: no dia de sábado
  rationale: Expressa naturalmente em português o sentido idiomático singular da fórmula grega influenciada pelo uso semítico.
theological_decisions:
- issue: Sentido de σαββάτων na expressão calendárica judaica
  choice: no dia de sábado
  alternative: no dia dos sábados
  rationale: Embora σαββάτων esteja formalmente no plural, a expressão designa idiomaticamente o sábado. A tradução singular preserva o sentido histórico judaico sem criar em português uma pluralidade indevida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição de “eles” foi mantida para preservar com clareza as relações entre os grupos no texto grego.
