  yaml_path: translation/deuterocanon/1_maccabees/002/062.yaml
  text: And do not fear the word of a sinful man[a], for his glory is for dung and worms.
translation:
  language: pt
  text: E não tenham medo da palavra de um homem pecador[a], pois a glória dele acabará em esterco e vermes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tenham medo do que um homem pecador diz”. O grego diz literalmente: “da palavra de um homem pecador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγου
  choice: palavra
  rationale: Mantém o substantivo singular concreto do grego e pode designar aquilo que o homem diz; a nota registra a formulação mais explícita.
- source_word: ἀνδρὸς ἁμαρτωλοῦ
  choice: de um homem pecador
  rationale: Preserva o masculino singular de ἀνήρ e a construção adjetival de ἁμαρτωλός, com linguagem natural em português.
- source_word: μὴ φοβηθῆτε
  choice: não tenham medo
  rationale: Expressa de modo claro e corrente a proibição no plural, sem restringir o sentido a intimidação ou ameaça.
- source_word: δόξα
  choice: glória
  rationale: Conserva o tom elevado e a ironia do contraste entre a glória aparente e a decomposição final.
- source_word: εἰς κόπρια
  choice: acabará em esterco
  rationale: A construção com εἰς indica o destino ou resultado; 'acabará em' é idiomático em português, e 'esterco' mantém a força concreta e depreciativa.
- source_word: εἰς σκώληκας
  choice: e vermes
  rationale: Preserva a imagem ampla de decomposição sem especificar indevidamente larvas.
theological_decisions:
- issue: Se ἀνήρ deve ser traduzido de modo genérico ou especificamente masculino
  choice: homem
  alternative: pessoa; indivíduo
  rationale: O texto usa ἀνήρ no masculino singular, e o contexto não exige neutralização.
- issue: Como representar o destino da glória na imagem final
  choice: a glória dele acabará em esterco e vermes
  alternative: a glória dele é para esterco e vermes; a honra dele se tornará podridão
  rationale: A tradução conserva as imagens fortes de humilhação e mortalidade e apresenta εἰς como destino ou resultado, sem suavizá-las.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural 'não tenham' reproduz o imperativo dirigido a vários ouvintes. A linguagem concreta e contundente do original foi preservada.
