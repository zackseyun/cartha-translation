base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/019.yaml
  text: And Mattathias answered and said with a loud voice[a], “Even if all the nations in the kingdom of the king listen to him, each one turning away from the worship of his fathers[b], and have chosen his commandments,”
translation:
  language: pt
  text: 'Matatias respondeu e disse em alta voz: “Mesmo que todas as nações que estão no reino do rei[a] o escutem[b], cada uma se afastando do culto de seus antepassados e tendo escolhido os mandamentos dele,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos domínios do rei”. A expressão grega é incomum; literalmente, “na casa do reino do rei”.
    reason: lexical_alternative
  - marker: b
    text: Ou “lhe obedeçam”. O grego diz mais literalmente “o escutem”, embora o contexto implique obediência.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Expressão portuguesa natural que conserva a força narrativa e o sentido literal da locução grega.
- source_word: ἔθνη
  choice: nações
  rationale: Refere-se aos diversos povos sujeitos ao governo do rei; “nações” evita a carga interpretativa de “gentios”.
- source_word: οἴκῳ τῆς βασιλείας τοῦ βασιλέως
  choice: no reino do rei
  rationale: A expressão grega é incomum e literalmente inclui “casa”; o texto principal comunica de modo inteligível o domínio político, enquanto a nota preserva a forma peculiar do original.
- source_word: ἀκούουσιν αὐτοῦ
  choice: o escutem
  rationale: Mantém o sentido lexical de ouvir ou escutar, sem explicitar como “obedecer” aquilo que o contexto apenas implica.
- source_word: ἀποστῆναι
  choice: se afastando
  rationale: Comunica abandono ou defecção sem introduzir o sentido técnico posterior de “apostatar”.
- source_word: λατρίας πατέρων αὐτοῦ
  choice: do culto de seus antepassados
  rationale: λατρεία designa aqui serviço ou prática religiosa; “culto” é claro e adequado ao contexto, e “antepassados” é mais abrangente e natural que “pais”.
- source_word: ᾑρετίσαντο
  choice: escolhendo
  rationale: Reproduz diretamente a ideia de escolher ou preferir; a forma participial em português integra com naturalidade as ações coordenadas da condição.
- source_word: ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: os mandamentos dele
  rationale: “Mandamentos” conserva o caráter formal e autoritativo das ordens reais; “dele” deixa claro que se trata do rei.
theological_decisions:
- issue: Como traduzir a expressão incomum οἴκῳ τῆς βασιλείας τοῦ βασιλέως
  choice: no reino do rei
  alternative: na casa do reino do rei; nos domínios do rei
  rationale: A formulação principal conserva a repetição de “reino” e “rei”, mas evita uma construção portuguesa obscura; a nota registra a literalidade e a alternativa sem impor uma interpretação específica.
- issue: Se ἀκούουσιν deve ser explicitado como obediência
  choice: o escutem
  alternative: lhe obedeçam
  rationale: Embora o contexto implique submissão às ordens reais, o verbo grego significa primariamente ouvir ou escutar. A tradução preserva essa tensão e informa a implicação contextual em nota.
- issue: Sentido de λατρεία no contexto
  choice: culto
  alternative: serviço religioso; adoração
  rationale: “Culto” expressa a prática religiosa ancestral sem restringir o termo a uma atitude interior nem introduzir terminologia confessional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A frase permanece aberta, como no versículo grego, pois a resposta de Matatias continua no versículo seguinte.
