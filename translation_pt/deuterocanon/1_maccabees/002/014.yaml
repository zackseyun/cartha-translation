  text: And Mattathias and his sons tore their clothes[a], put on sackcloth, and mourned greatly.
translation:
  language: pt
  text: E Matatias e seus filhos rasgaram suas roupas, vestiram-se de pano de saco e lamentaram profundamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέρρηξεν
  choice: rasgaram
  rationale: O verbo descreve o ato de rasgar as roupas como sinal de pesar ou indignação. O plural natural em português concorda com o sujeito composto, sem reproduzir a concordância singular do grego.
- source_word: τὰ ἱμάτια αὐτῶν
  choice: as próprias roupas
  rationale: Ἱμάτια designa roupas ou vestes, e αὐτῶν indica que eram as roupas deles. «As próprias roupas» expressa isso com clareza e naturalidade.
- source_word: περιεβάλοντο σάκκους
  choice: vestiram roupas de pano de saco
  rationale: A expressão retrata a adoção de vestes ásperas associadas ao luto. «Roupas de pano de saco» é mais imediatamente compreensível em português atual do que simplesmente «vestiram pano de saco» e preserva o plural concreto σάκκους.
- source_word: ἐπένθησαν
  choice: prantearam
  rationale: O verbo indica manifestação de luto. «Prantearam» se ajusta ao contexto ritual das roupas rasgadas e do pano de saco, mantendo um registro digno.
- source_word: σφόδρα
  choice: profundamente
  rationale: O advérbio intensifica o luto. «Profundamente» é idiomático em português e não acrescenta uma nuance específica, como amargura, ausente do grego.
- source_word: Ματταθίας
  choice: Matatias
  rationale: Usa-se a forma tradicional e amplamente reconhecível do nome em português.
