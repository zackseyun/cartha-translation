  yaml_path: translation/deuterocanon/1_maccabees/002/027.yaml
  text: And Mattathias cried out in the city with a loud voice, saying, “Everyone who is zealous for the law and upholds the covenant, let him come out after me.”
translation:
  language: pt
  text: 'E Matatias gritou na cidade, em voz alta: “Todo aquele que tem zelo pela Lei e permanece fiel à aliança saia e venha após mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκραξεν
  choice: gritou
  rationale: Expressa o forte clamor público do verbo grego em português atual e natural.
- source_word: ἐν τῇ πόλει
  choice: na cidade
  rationale: Reproduz diretamente o sentido locativo da expressão grega.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Mantém a imagem concreta do grego com uma expressão portuguesa digna e idiomática.
- source_word: Πᾶς ὁ ζηλῶν τῷ νόμῳ
  choice: Todo aquele que tem zelo pela Lei
  rationale: Preserva a ideia de dedicação ardente dirigida à Lei; a inicial maiúscula esclarece que se trata da Lei de Israel.
- source_word: ἱστῶν διαθήκην
  choice: permanece fiel à aliança
  rationale: No contexto, ἵστημι indica sustentar ou manter a aliança, não estabelecê-la inicialmente; a formulação comunica fidelidade ativa com naturalidade.
- source_word: ἐξελθέτω ὀπίσω μου
  choice: saia e venha após mim
  rationale: Conserva tanto o movimento explícito de sair em ἐξελθέτω quanto a orientação pessoal de ὀπίσω μου.
theological_decisions:
- issue: Sentido de διαθήκη no contexto judaico da aliança
  choice: a aliança
  alternative: uma aliança; o pacto
  rationale: O contexto aponta para a aliança de Israel com Deus. O artigo definido torna esse referente claro sem acrescentar uma interpretação denominacional.
- issue: Referente de νόμος
  choice: Lei
  alternative: lei
  rationale: A maiúscula ajuda o leitor moderno a reconhecer a referência à Lei de Israel, sem substituir o termo por “Torá” nem ampliar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando o chamado público, o zelo pela Lei, a fidelidade à aliança e o ato concreto de sair após Matatias.
