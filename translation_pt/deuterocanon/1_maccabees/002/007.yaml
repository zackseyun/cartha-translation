  source_fidelity: O texto traduz com precisão o lamento de Matatias. “Ai de mim!”, “Por que nasci para ver”, a dupla ocorrência de “ruína”, “cidade santa”, “santuário” e a construção paralela de entrega aos inimigos/estrangeiros correspondem adequadamente ao grego. “Enquanto ela era entregue” preserva de modo legítimo a circunstância expressa por ἐν + infinitivo articular e retoma corretamente a cidade (αὐτήν).
  naturalness: O português é moderno, claro e de registro apropriado ao lamento solene. “Ficar ali sentado” é uma formulação natural e conserva a imagem concreta de καθίσαι ἐκεῖ sem explicá-la indevidamente. A elipse em “e o santuário, nas mãos de estrangeiros” é compreensível e reproduz o paralelismo enfático do original.
  terminology: “Meu povo”, “cidade santa” e “santuário” são escolhas precisas e não acrescentam identificações ou interpretações ausentes do versículo. “Estrangeiros” verte adequadamente ἀλλοτρίων neste contexto. As notas distinguem apropriadamente a pluralidade de συντρίμματα e o idiomatismo “na mão de”.
