base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/007.yaml
  text: And he said[a], “Alas! Why was I born to see the ruin of my people and the ruin of the holy city, and to sit there while it was given into the hand of enemies[b], and the sanctuary into the hand of foreigners?”
translation:
  language: pt
  text: 'E ele disse: “Ai de mim! Por que nasci para ver a ruína do meu povo[a] e a ruína da cidade santa, e para ficar ali sentado enquanto ela era entregue nas mãos dos inimigos, e o santuário, nas mãos de estrangeiros[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega aqui uma forma plural, que também pode ser traduzida por “os destroços” ou “as devastações do meu povo”, talvez enfatizando a extensão da destruição.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na mão dos inimigos... na mão de estrangeiros”, expressão bíblica que significa ser entregue ao poder deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴμοι
  choice: Ai de mim!
  rationale: Interjeição de lamento que expressa aflição pessoal intensa; é corrente, digna e preserva a força do grego.
- source_word: ἵνα τί
  choice: Por que
  rationale: Forma interrogativa idiomática que pergunta a razão ou finalidade; “Por que” é a equivalência mais natural em português.
- source_word: ἐγενήθην
  choice: nasci
  rationale: Neste lamento, o aoristo de γίνομαι tem o sentido contextual de vir à existência ou nascer.
- source_word: ἰδεῖν
  choice: para ver
  rationale: Mantém de modo direto o infinitivo ligado a “nasci” e a experiência dolorosa de testemunhar a devastação.
- source_word: τὰ συντρίμματα
  choice: a ruína
  rationale: O plural grego pode ter valor coletivo e enfatizar uma devastação extensa; “a ruína” é natural em português, com a nuance do plural registrada em nota.
- source_word: τὸ σύντριμμα
  choice: a ruína
  rationale: A repetição de “ruína” preserva o paralelismo com o termo cognato anterior e descreve a devastação da cidade.
- source_word: τῆς πόλεως τῆς ἁγίας
  choice: da cidade santa
  rationale: Tradução transparente que conserva a designação teologicamente significativa sem inserir explicitamente “Jerusalém”, nome ausente no grego.
- source_word: καθίσαι ἐκεῖ
  choice: para ficar ali sentado
  rationale: Preserva a imagem concreta de permanecer sentado no local e sua sugestão contextual de dolorosa impotência.
- source_word: ἐν τῷ δοθῆναι αὐτὴν
  choice: enquanto ela era entregue
  rationale: O infinitivo articular com ἐν exprime circunstância simultânea; o pronome feminino retoma naturalmente a cidade.
- source_word: ἐν χειρὶ ἐχθρῶν
  choice: nas mãos dos inimigos
  rationale: Reproduz em português corrente o idiomatismo bíblico de ser entregue ao poder de alguém.
- source_word: τὸ ἁγίασμα
  choice: o santuário
  rationale: Distingue o lugar sagrado da cidade como um todo e usa o termo português tradicional e preciso.
- source_word: ἐν χειρὶ ἀλλοτρίων
  choice: nas mãos de estrangeiros
  rationale: Mantém o paralelismo com “nas mãos dos inimigos”; ἀλλότριοι designa aqui pessoas alheias ao povo, portanto estrangeiros.
theological_decisions:
- issue: Termos de identidade do povo e da cidade santa
  choice: “meu povo” e “cidade santa”, sem expansão interpretativa
  alternative: “minha nação” e identificação explícita da cidade como Jerusalém
  rationale: A tradução conserva a linguagem identitária e sagrada do grego sem acrescentar uma identificação que o versículo não formula.
- issue: Referência do pronome feminino αὐτήν
  choice: A cidade é entregue nas mãos dos inimigos; a entrega do santuário fica subentendida na oração paralela
  alternative: Reformular para fazer da cidade e do santuário um único objeto expresso da entrega
  rationale: O gênero feminino de αὐτήν retoma πόλις, enquanto τὸ ἁγίασμα inicia uma construção paralela elíptica. A pontuação preserva essa estrutura e sua tensão retórica.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom permanece solene e emotivo sem arcaísmo excessivo. “Ai de mim” preserva o lamento; “ficar ali sentado” conserva a imagem concreta; “nas mãos” verte naturalmente o idiomatismo sem ocultá-lo.
