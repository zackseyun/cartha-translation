  text: Caleb[a], when he testified before the assembly, received the land as an inheritance.
translation:
  language: pt
  text: Calebe, ao dar testemunho diante da assembleia[a], recebeu a terra como herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando deu testemunho perante a assembleia”; a expressão também pode ter sentido causal: “por ter dado testemunho perante a assembleia”.'
    reason: A construção grega admite nuance circunstancial, temporal ou causal, e a relação do verbo com a assembleia pode ser expressa naturalmente como “diante de” ou “perante”.
lexical_decisions:
- source_word: Χαλὲβ
  choice: Calebe
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio bíblico.
- source_word: ἐν τῷ ἐπιμαρτυρῆσαι
  choice: ao dar testemunho
  rationale: A construção com ἐν e infinitivo articular expressa a circunstância, com possível nuance temporal ou causal. “Ao dar testemunho” é natural e mantém essa relação relativamente aberta.
- source_word: τῇ ἐκκλησίᾳ
  choice: diante da assembleia
  rationale: Neste contexto judaico pré-cristão, ἐκκλησία designa a comunidade reunida, não a igreja cristã. “Diante da assembleia” expressa naturalmente o âmbito público do testemunho.
- source_word: ἔλαβε
  choice: recebeu
  rationale: O verbo indica aqui que Calebe passou a possuir aquilo que lhe foi concedido; “recebeu” combina com o contexto de herança sem sugerir conquista autônoma.
- source_word: γῆν
  choice: a terra
  rationale: Embora o substantivo esteja sem artigo em grego, o contexto aponta para a terra prometida concedida a Calebe; o artigo definido é idiomático em português.
- source_word: κληρονομίαν
  choice: como herança
  rationale: Preserva o sentido de uma posse recebida por herança ou concessão, sem acrescentar o possessivo “sua”, ausente do grego.
theological_decisions:
- issue: Sentido de ἐκκλησία no contexto histórico
  choice: assembleia
  alternative: congregação; igreja
  rationale: “Assembleia” representa a comunidade de Israel reunida e evita o anacronismo de identificar o termo com a igreja cristã.
- issue: Relação expressa por ἐν τῷ ἐπιμαρτυρῆσαι
  choice: ao dar testemunho
  alternative: quando deu testemunho; por ter dado testemunho
  rationale: A formulação escolhida conserva a possível sobreposição entre circunstância temporal e fundamento causal, sem resolver além do que a construção grega exige.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Evita-se “igreja” por ser anacrônico neste contexto, e mantém-se a concisão proverbial do original.
