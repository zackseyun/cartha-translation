base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/048.yaml
  text: And they rescued the law from the hand of the nations and from the hand of the kings[a], and they did not give a horn to the sinner.
translation:
  language: pt
  text: E resgataram a lei da mão das nações e da mão dos reis, e não deram força ao pecador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, «não deram um chifre ao pecador». O «chifre» é uma imagem bíblica de força, poder ou exaltação; também pode significar: «não permitiram que o pecador ganhasse poder».'
    reason: Alternativa lexical e explicação da metáfora; a tradução funcional no texto evita a expressão portuguesa «dar chifre», que tem um sentido idiomático alheio ao original.
lexical_decisions:
- source_word: ἀντελάβοντο
  choice: resgataram
  rationale: O médio de ἀντιλαμβάνομαι pode indicar tomar em auxílio, socorrer ou resgatar. Neste contexto, a lei é retirada do domínio de forças hostis; “resgataram” comunica essa libertação ativa.
- source_word: τοῦ νόμου
  choice: a lei
  rationale: νόμος se refere aqui à lei judaica, a Torá. A inicial minúscula acompanha a forma do grego e evita acrescentar uma distinção tipográfica interpretativa.
- source_word: ἐκ χειρὸς
  choice: da mão de
  rationale: Preserva a metáfora concreta da mão como domínio ou poder. A repetição — “da mão das nações e da mão dos reis” — reflete a estrutura grega.
- source_word: τῶν ἐθνῶν
  choice: das nações
  rationale: ἐθνῶν significa literalmente “nações” e, no contexto, designa povos não judeus. A tradução mantém o termo amplo sem impor “gentios” ou “pagãos”.
- source_word: τῶν βασιλέων
  choice: dos reis
  rationale: βασιλέων significa diretamente “reis”; não há razão contextual para generalizar como “governantes”.
- source_word: οὐκ ἔδωκαν κέρας
  choice: não deram um chifre
  rationale: κέρας significa literalmente “chifre” e funciona na linguagem bíblica como imagem de força, poder ou exaltação. A imagem foi preservada no texto, com explicação em nota.
- source_word: τῷ ἁμαρτωλῷ
  choice: ao pecador
  rationale: O adjetivo substantivado singular ἁμαρτωλῷ corresponde diretamente a “o pecador”, sem exigir a interpretação mais forte “o perverso”.
theological_decisions:
- issue: Sentido metafórico de “chifre” na oração final
  choice: 'Preservar no texto a imagem literal: “não deram um chifre ao pecador”'
  alternative: “não deram força ao pecador” ou “não permitiram que o pecador ganhasse poder”
  rationale: O grego emprega uma imagem bíblica tradicional para força, poder ou exaltação. Mantê-la conserva a textura intertextual e evita reduzir a metáfora a apenas um de seus possíveis sentidos; a nota esclarece sua função.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão repetida “da mão de” e a imagem incomum do “chifre” foram mantidas para preservar a forma e a tensão do grego; a nota oferece o sentido funcional sem substituir a metáfora no texto.
