  verdict: revise
  source_fidelity: O texto transmite corretamente ἀντελάβοντο como libertação/resgate ativo, preserva a dupla expressão «da mão de», traduz τῶν ἐθνῶν e τῶν βασιλέων de modo direto e mantém o singular «o pecador». A formulação literal «dar um chifre» reproduz κέρας, mas em português contemporâneo «dar chifre» é uma expressão idiomática fortemente associada à infidelidade conjugal e, portanto, cria um sentido alheio ao grego.
  naturalness: «E resgataram a lei da mão das nações e da mão dos reis» é claro e natural em registro bíblico moderno. «Não deram um chifre ao pecador», embora explicada em nota, soa artificial e é suscetível a uma leitura idiomática enganosa em português. Uma tradução funcional de κέρας no texto evita esse falso sentido sem afetar o conteúdo.
  terminology: «Lei», «nações», «reis» e «pecador» são escolhas adequadas, sem impor leituras confessionais. «Força» comunica de modo conciso o valor metafórico primário de κέρας; a nota deve registrar a imagem literal e sua faixa semântica de poder/exaltação.
