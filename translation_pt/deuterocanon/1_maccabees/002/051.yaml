base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/051.yaml
  text: Remember the deeds of our fathers[a], which they did in their generations, and receive great glory and everlasting glory.
translation:
  language: pt
  text: Lembrem-se dos feitos de nossos pais[a], realizados por eles em suas gerações, e recebam grande glória e glória eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “antepassados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  choice: Lembrem-se
  rationale: O imperativo aoristo exorta os ouvintes, no plural, a trazer ativamente à memória os exemplos anteriores; “Lembrem-se” é claro e natural em português.
- source_word: τῶν πατέρων ἡμῶν
  choice: de nossos pais
  rationale: Mantém o termo familiar masculino do grego e sua ressonância bíblica; no contexto, “pais” designa os antepassados de Israel, alternativa registrada em nota.
- source_word: ἔργα
  choice: feitos
  rationale: Refere-se a ações notáveis e exemplares. “Feitos” comunica melhor esse valor do que o mais genérico “obras”.
- source_word: ταῖς γενεαῖς αὐτῶν
  choice: em suas gerações
  rationale: Conserva a expressão grega e sua possível referência às sucessivas épocas em que os pais viveram, sem reduzi-la simplesmente a “em seu tempo”.
- source_word: δέξασθε
  choice: recebam
  rationale: Equivalente direto do imperativo plural, preservando a exortação a entrar na posse da glória mencionada.
- source_word: δόξαν μεγάλην καὶ δόξαν αἰώνιον
  choice: grande glória e glória eterna
  rationale: Reproduz a repetição deliberada de δόξαν e distingue os dois qualificativos, μεγάλην e αἰώνιον, sem substituir a segunda ocorrência por “renome”.
theological_decisions:
- issue: Sentido do termo ancestral masculino πατέρων
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O texto grego emprega literalmente o termo masculino “pais”, embora o referente contextual sejam os antepassados de Israel. A tradução principal preserva a forma do original, e a nota esclarece o sentido possível.
- issue: Repetição de δόξα
  choice: grande glória e glória eterna
  alternative: grande glória e renome eterno
  rationale: A repetição no grego pode soar marcada em português, mas é genuína e pode ter força retórica. Mantê-la evita resolver silenciosamente se a segunda ocorrência significa glória, honra ou renome duradouro.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas imperativas plurais naturais para leitores brasileiros. A formulação preserva a repetição retórica do grego e a expressão pouco idiomática, mas inteligível, “em suas gerações”.
