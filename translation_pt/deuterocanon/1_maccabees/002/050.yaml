base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/050.yaml
  text: And now[a], children, be zealous for the law[b], and give your lives for the covenant of our fathers.
translation:
  language: pt
  text: E agora, filhos[a], tenham zelo pela lei e deem suas vidas pela aliança de nossos pais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego também pode ser traduzido por “crianças” ou “descendentes”; aqui funciona como tratamento familiar dirigido aos filhos de Matatias.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por causa da aliança de nossos pais” ou “em defesa da aliança de nossos pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: filhos
  rationale: O vocativo é uma forma familiar de tratamento que pode designar a prole em geral; no contexto imediato, Matatias se dirige a seus filhos. “Filhos” é natural em português e preserva o apelo paterno.
- source_word: ζηλώσατε τῷ νόμῳ
  choice: tenham zelo pela lei
  rationale: O imperativo pede dedicação ardorosa à lei. “Tenham zelo” conserva a intensidade religiosa sem recorrer a “ciúme”, que teria sentido enganoso no português atual.
- source_word: δότε τὰς ψυχὰς ὑμῶν
  choice: deem suas vidas
  rationale: Neste chamado ao sacrifício, ψυχαί se refere à vida das pessoas, não especificamente a uma alma imaterial. A formulação mantém o verbo simples “dar”, sem ampliar para “sacrificar” ou “entregar”.
- source_word: ὑπὲρ διαθήκης
  choice: pela aliança
  rationale: 'ὑπέρ expressa causa ou benefício: dar a vida em defesa ou por causa da aliança. “Pela” é conciso e preserva essa amplitude.'
- source_word: πατέρων ἡμῶν
  choice: de nossos pais
  rationale: A expressão grega emprega linguagem ancestral explicitamente masculina. “Nossos pais” preserva a formulação pactual do texto, enquanto “antepassados” seria uma alternativa mais abrangente.
theological_decisions:
- issue: Linguagem ancestral de πατέρων ἡμῶν
  choice: de nossos pais
  alternative: de nossos antepassados
  rationale: A tradução mantém a expressão masculina do grego e seu caráter pactual, sem neutralizá-la.
- issue: Sentido de ψυχή no contexto de exortação ao martírio
  choice: vidas
  alternative: almas
  rationale: O contexto exige a disposição de morrer em defesa da aliança; “vidas” comunica isso sem impor ao versículo uma afirmação sobre a constituição imaterial do ser humano.
- issue: Alcance de ὑπέρ diante de διαθήκης
  choice: pela aliança
  alternative: por causa da aliança
  rationale: A preposição pode indicar causa, interesse ou defesa. A forma concisa “pela” conserva essa tensão sem escolher apenas uma dessas nuances.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com imperativos na terceira pessoa do plural (“tenham”, “deem”), naturais para leitores brasileiros e inteligíveis internacionalmente. “Lei” permanece em minúscula para não acrescentar uma convenção editorial ausente do grego.
