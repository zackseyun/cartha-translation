base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/042.yaml
  text: Then a company of Hasideans gathered to them[a], mighty in strength from Israel, everyone who willingly devoted himself to the law.
translation:
  language: pt
  text: Então, juntou-se a eles um grupo de assideus, forte em poder, de Israel — todos os que voluntariamente se dedicavam à lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também chamados “hassidim”; nome de um grupo judeu associado ao zelo pela lei.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτούς
  choice: se reuniu a eles
  rationale: Expressa o movimento de aproximação e associação com o grupo mencionado anteriormente, sem acrescentar a ideia mais específica de alistamento.
- source_word: συναγωγὴ
  choice: um grupo
  rationale: Designa um conjunto reunido de pessoas. “Grupo” é natural em português e evita associações anacrônicas com o edifício ou a instituição da sinagoga.
- source_word: Ἀσιδαίων
  choice: assideus
  rationale: Mantém o termo como nome de um grupo histórico, em forma tradicionalmente usada em português, em vez de interpretá-lo apenas como “piedosos”.
- source_word: ἰσχυρὰ δυνάμει
  choice: uma força poderosa
  rationale: Reproduz a ênfase da expressão grega em poder e capacidade coletiva, com formulação idiomática em português.
- source_word: ἀπὸ Ἰσραήλ
  choice: de Israel
  rationale: Preserva a indicação de origem ou procedência sem definir de modo mais estreito se a expressão é étnica, nacional ou militar.
- source_word: πᾶς ὁ ἑκουσιαζόμενος
  choice: todos os que se dedicavam voluntariamente
  rationale: Conserva tanto a abrangência distributiva quanto o caráter livre e deliberado do compromisso, sem reduzir a expressão ao simples ato de se apresentar como voluntário.
- source_word: τῷ νόμῳ
  choice: à lei
  rationale: O dativo completa a ideia de dedicação. A minúscula não deixa de apontar para a lei de Israel e evita acrescentar uma distinção gráfica ausente do grego.
theological_decisions:
- issue: Identidade dos Ἀσιδαῖοι
  choice: assideus
  alternative: piedosos; hassidim
  rationale: O contexto permite reconhecer uma designação histórica de grupo. A transliteração evita transformar silenciosamente o nome em uma avaliação religiosa genérica.
- issue: Sentido de ἑκουσιαζόμενος τῷ νόμῳ
  choice: os que se dedicavam voluntariamente à lei
  alternative: os que se ofereceram para defender a lei
  rationale: A tradução preserva a adesão voluntária à lei sem inserir explicitamente uma finalidade militar que o texto grego não declara nesta expressão.
- issue: Relação entre “uma força poderosa de Israel” e o grupo
  choice: aposição explicativa após vírgula
  alternative: “um grupo forte em poder, vindo de Israel”
  rationale: A aposição conserva a intensidade coletiva de ἰσχυρὰ δυνάμει e deixa “de Israel” como indicação de origem, sem resolver além do necessário a estrutura compacta do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção coletiva seguida de dois-pontos torna inteligível a aposição distributiva do grego sem eliminar sua ênfase. O nome histórico é transliterado e explicado em nota.
