  text: And he was zealous for the law[a], just as Phinehas was against Zambri son of Salom.
translation:
  language: pt
  text: E mostrou zelo pela lei, assim como Fineias havia feito contra Zambri, filho de Salom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No texto grego, os nomes são Zambri e Salom; em Números 25, eles são mais conhecidos como Zinri, filho de Salu.
    reason: Referência cruzada e esclarecimento das diferentes formas dos nomes.
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: mostrou zelo
  rationale: O aoristo de ζηλόω descreve um zelo que se manifesta em ação decisiva. “Mostrou zelo” é direto e natural em português, sem reduzi-lo a mero sentimento interior nem acrescentar uma metáfora ausente do grego.
- source_word: τῷ νόμῳ
  choice: pela lei
  rationale: O dativo indica o objeto ou a causa do zelo. “Pela lei” expressa essa relação com clareza e preserva a referência à lei judaica sem impor uma convenção especial de maiúsculas.
- source_word: καθὼς
  choice: assim como
  rationale: Introduz uma comparação histórica explícita com Fineias e conserva a força retórica da analogia.
- source_word: ἐποίησεν
  choice: havia feito
  rationale: O verbo é amplo e fica elíptico no grego. O mais-que-perfeito composto deixa clara, em português natural, a anterioridade da ação de Fineias sem especificar além do texto o que ele fez.
- source_word: Φινεὲς
  choice: Fineias
  rationale: Forma portuguesa bíblica corrente para a personagem de Números 25.
- source_word: τῷ Ζαμβρὶ
  choice: contra Zambri
  rationale: 'Embora a forma seja dativa, a alusão narrativa indica relação adversativa: Fineias agiu contra o transgressor. “Contra” torna essa relação inteligível sem ampliar a ação.'
- source_word: υἱῷ Σαλώμ
  choice: filho de Salom
  rationale: Mantém as formas nominais do texto grego, Ζαμβρί e Σαλώμ, em vez de substituí-las silenciosamente pelas formas mais conhecidas derivadas da tradição hebraica.
theological_decisions:
- issue: Como apresentar a imitação de Fineias por Matatias em um contexto de zelo violento
  choice: Manter de modo direto a comparação com a ação de Fineias
  alternative: Explicar a alusão no corpo do texto ou suavizar a linguagem de zelo
  rationale: O grego estabelece explicitamente o paralelo com Números 25. A tradução preserva a tensão narrativa e teológica sem acrescentar aprovação moral nem atenuar a força da referência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão do grego e sua alusão histórica; a nota explica as variantes nominais sem alterar o texto-base.
