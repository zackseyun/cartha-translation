  text: Daniel[a], in his simplicity, was rescued from the mouth of lions.
translation:
  language: pt
  text: Daniel, em sua integridade[a], foi livrado da boca dos leões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em sua simplicidade», «em sua sinceridade» ou «em sua inteireza». O termo grego pode indicar sinceridade, inteireza ou retidão moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δανιὴλ
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐν τῇ ἁπλότητι αὐτοῦ
  choice: por causa de sua integridade
  rationale: A construção ἐν pode indicar a circunstância ou base associada ao livramento. Neste contexto elogioso, ἁπλότης expressa inteireza, sinceridade ou retidão de caráter; “integridade” comunica esse sentido moral com naturalidade em português.
- source_word: ἐρύσθη
  choice: foi livrado
  rationale: O aoristo passivo descreve a libertação de um perigo concreto. “Foi livrado” é claro, digno e adequado ao registro bíblico, sem exigir uma explicitação do agente.
- source_word: ἐκ στόματος λεόντων
  choice: da boca dos leões
  rationale: Preserva a imagem vívida e a forma singular coletiva do grego, permanecendo idiomática em português.
theological_decisions:
- issue: Sentido de ἁπλότης na apresentação de Daniel como exemplo
  choice: integridade
  alternative: simplicidade; sinceridade; inteireza de coração
  rationale: “Integridade” preserva a força ética e elogiosa da expressão sem reduzir o termo a ingenuidade. A nota mantém visível a amplitude lexical, inclusive a ideia de sinceridade e devoção não dividida.
- issue: Relação expressa por ἐν τῇ ἁπλότητι αὐτοῦ
  choice: por causa de sua integridade
  alternative: em sua integridade
  rationale: No contexto da série de exemplos, a expressão provavelmente apresenta a qualidade fiel associada ao livramento. A formulação causal é natural em português, mas não identifica Daniel como autor de sua própria salvação nem explicita o agente divino além do que o texto declara.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A imagem “da boca dos leões” foi mantida, e a nota registra a amplitude semântica de ἁπλότης sem introduzir interpretação denominacional.
