  text: David[a], because of his mercy, inherited the throne of an everlasting kingdom.
translation:
  language: pt
  text: Davi[a], por sua misericórdia, herdou o trono de um reino eterno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela misericórdia de Deus, ele herdou o trono de um reino eterno”. O pronome traduzido por “sua” pode referir-se a Deus, em vez de a Davi.'
    reason: Leitura alternativa decorrente da ambiguidade do referente de αὐτοῦ.
lexical_decisions:
- source_word: Δαυεὶδ
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: por sua misericórdia
  rationale: A preposição ἐν com o dativo pode indicar meio ou causa. A formulação é natural em português e conserva o pronome sem explicitar à força se ele se refere a Davi ou a Deus.
- source_word: ἐκληρονόμησεν
  choice: herdou
  rationale: Preserva o sentido próprio de receber como herança e a nuance dinástica do contexto.
- source_word: θρόνον
  choice: o trono
  rationale: O artigo definido é natural porque se trata do trono régio reconhecido ligado à dinastia de Davi.
- source_word: βασιλείας αἰωνίας
  choice: de um reino eterno
  rationale: Reproduz a construção genitiva e comunica a duração permanente do reino em linguagem elevada, clara e corrente.
theological_decisions:
- issue: Referente de αὐτοῦ em ἐν τῷ ἐλέει αὐτοῦ
  choice: Manter no texto principal a leitura mais imediata, segundo a qual a misericórdia é de Davi, sem tornar o referente explícito.
  alternative: Entender que Davi herdou o trono pela misericórdia de Deus.
  rationale: A sintaxe imediata e a sequência de elogios a personagens exemplares favorecem a referência a Davi; contudo, a referência à misericórdia divina continua possível no idioma bíblico e, por isso, é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a concisão proverbial do grego e preserva sua ambiguidade pronominal genuína.
