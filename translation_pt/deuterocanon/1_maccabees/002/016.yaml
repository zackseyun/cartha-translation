  yaml_path: translation/deuterocanon/1_maccabees/002/016.yaml
  text: to the city[a], so that they might offer sacrifice. And many from Israel came over to them[b], and Mattathias and his sons were gathered together.
translation:
  language: pt
  text: à cidade[a], para que oferecessem sacrifícios. Muitos de Israel se aproximaram deles[b], e Matatias e seus filhos se reuniram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego fornecido para este versículo começa no meio de uma frase; “à cidade” dá continuidade à oração anterior.
    reason: textual_variant
  - marker: b
    text: Ou “juntaram-se a eles” ou “passaram para o lado deles”. O grego diz literalmente que se aproximaram deles, o que, neste contexto, provavelmente sugere adesão.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν πόλιν
  choice: à cidade
  rationale: O acusativo depende de um verbo de movimento no contexto anterior. Como o trecho grego fornecido começa no meio da frase, a tradução mantém o fragmento sem reconstruir o que não está presente.
- source_word: ἵνα θυσιάσωσιν
  choice: para que oferecessem sacrifícios
  rationale: ἵνα com o subjuntivo expressa finalidade. “Oferecer sacrifícios” comunica com naturalidade o sentido cultual de θυσιάζω.
- source_word: πολλοὶ ἀπὸ Ἰσραήλ
  choice: Muitos de Israel
  rationale: Preserva a expressão de origem ou pertencimento marcada por ἀπό, sem acrescentar especificidade interpretativa.
- source_word: πρὸς αὐτοὺς προσῆλθαν
  choice: se aproximaram deles
  rationale: A expressão indica movimento em direção a pessoas. Esta formulação preserva esse sentido básico sem tornar explícita, no texto principal, a possível ideia contextual de adesão.
- source_word: συνήχθησαν
  choice: se reuniram
  rationale: Embora a forma grega seja passiva, ela pode ter sentido intransitivo de reunir-se ou ajuntar-se. A forma pronominal é natural em português e conserva a ação coletiva.
theological_decisions:
- issue: Alinhamento político-religioso sugerido por πρὸς αὐτοὺς προσῆλθαν
  choice: se aproximaram deles
  alternative: juntaram-se a eles; passaram para o lado deles
  rationale: No contexto, a aproximação provavelmente implica adesão aos representantes do rei e ao sacrifício imposto. Contudo, o verbo grego descreve diretamente o movimento em direção a eles; por isso, a tradução principal mantém a ambiguidade e registra a leitura mais forte em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O fragmento inicial foi preservado, e a possível ideia de adesão foi mantida como ambiguidade contextual, sem ser imposta no texto principal.
