base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/038.yaml
  text: And they rose up against them in battle on the Sabbath[a], and they died—they and their wives and their children and their livestock—about a thousand persons.
translation:
  language: pt
  text: E levantaram-se contra eles em combate no sábado. E morreram eles, suas mulheres, seus filhos e seus animais — cerca de mil pessoas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até mil pessoas”; a expressão grega pode indicar um limite superior aproximado, e não uma contagem exata.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀνέστησαν ἐπʼ αὐτούς
  choice: levantaram-se contra eles
  rationale: Preserva a imagem verbal e o sentido hostil da expressão grega sem especificar além do texto a forma do ataque.
- source_word: ἐν τῷ πολέμῳ
  choice: em combate
  rationale: No contexto, a expressão se refere ao confronto concreto, não à guerra como período prolongado.
- source_word: τοῖς σάββασιν
  choice: no sábado
  rationale: Embora a forma grega seja plural, trata-se de uma expressão idiomática referente à observância sabática numa ocasião específica; o singular é natural em português.
- source_word: ἀπέθανον
  choice: morreram
  rationale: Mantém o verbo grego intransitivo, sem transformá-lo em um passivo mais explícito como “foram mortos”, ainda que o contexto indique morte causada pelos atacantes.
- source_word: τὰ κτήνη
  choice: seus animais
  rationale: Refere-se aos animais domésticos possuídos pelo grupo. “Animais” é claro e abrangente, sem restringir o sentido a gado bovino.
- source_word: ἕως χιλίων ψυχῶν ἀνθρώπων
  choice: cerca de mil pessoas
  rationale: ψυχαί ἀνθρώπων conta vidas ou pessoas humanas, e ἕως diante do número pode indicar um total aproximado ou um limite superior.
