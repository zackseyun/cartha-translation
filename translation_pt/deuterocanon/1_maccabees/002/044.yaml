base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/044.yaml
  text: They joined them and became a support for them[a]. They also formed a force and struck down sinners in their anger, and lawless men in their wrath[b]; and the rest fled to the nations to save themselves.
translation:
  language: pt
  text: Juntaram-se a eles e lhes serviram de apoio.[a] Organizaram também uma força e abateram os pecadores em sua ira e os homens sem lei em seu furor; os demais fugiram para as nações[b] a fim de se salvar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foram acrescentados a eles e se tornaram um apoio para eles”. O verbo grego apresenta mais formalmente essas pessoas como agregadas ao grupo.'
    reason: lexical_alternative
  - marker: b
    text: “As nações” provavelmente se refere aos povos ou territórios não judeus ao redor; também pode ser traduzido por “os gentios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετέθησαν
  choice: Juntaram-se
  rationale: O passivo de προστίθημι indica aqui que pessoas foram agregadas ao grupo. “Juntaram-se” é natural em português e conserva a ideia de adesão.
- source_word: εἰς στήριγμα
  choice: lhes serviram de apoio
  rationale: στήριγμα designa apoio ou sustentação. A formulação comunica naturalmente a construção predicativa grega sem lhe acrescentar um sentido militar mais específico.
- source_word: συνεστήσαντο δύναμιν
  choice: Organizaram também uma força
  rationale: A expressão descreve a constituição organizada de poder militar. “Força” preserva a amplitude de δύναμις sem defini-la necessariamente como exército formal.
- source_word: ἐπάταξαν
  choice: abateram
  rationale: πατάσσω denota golpear ou derrubar, muitas vezes com resultado letal em contexto de combate. “Abateram” mantém a violência e a provável gravidade da ação sem explicitar além do verbo.
- source_word: ἁμαρτωλούς
  choice: os pecadores
  rationale: Mantém diretamente a avaliação moral e religiosa expressa pelo substantivo grego.
- source_word: ἐν ὀργῇ αὐτῶν
  choice: em sua ira
  rationale: “Ira” reproduz a força de ὀργή e permite distingui-la de θυμός na oração paralela.
- source_word: ἄνδρας ἀνόμους
  choice: os homens sem lei
  rationale: Conserva tanto o substantivo explicitamente masculino ἄνδρας quanto o sentido de ἄνομος, sem definir de maneira indevida qual lei está em vista.
- source_word: ἐν θυμῷ αὐτῶν
  choice: em seu furor
  rationale: “Furor” comunica a intensidade de θυμός e preserva a variação retórica em relação a ὀργή, traduzido como “ira”.
- source_word: οἱ λοιποί
  choice: os demais
  rationale: Expressa de modo claro o grupo restante, em contraste com os que foram abatidos.
- source_word: εἰς τὰ ἔθνη
  choice: para as nações
  rationale: É uma tradução próxima do grego e mantém a referência aos povos ou territórios não judeus ao redor sem impor como única leitura o termo técnico “gentios”.
- source_word: σωθῆναι
  choice: a fim de se salvar
  rationale: O infinitivo passivo após o verbo de movimento expressa a finalidade de fugir para obter livramento ou sobreviver; a forma reflexiva é idiomática em português.
theological_decisions:
- issue: Descrições morais em contexto militar
  choice: Manter “pecadores” e “homens sem lei” como categorias avaliativas do próprio texto.
  alternative: “malfeitores” e “fora da lei”
  rationale: O grego enquadra o conflito em termos morais e religiosos. A tradução não deve reduzir essas designações a categorias meramente políticas ou criminais.
- issue: Gênero de ἄνδρας
  choice: Traduzir explicitamente por “homens”.
  alternative: “pessoas”
  rationale: O texto-fonte emprega um substantivo masculino explícito, cuja referência deve ser preservada.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A coordenação e o paralelismo do grego foram preservados, assim como a distinção entre “ira” e “furor”. Os marcadores de nota foram posicionados junto às expressões que explicam.
