lexical_decisions:
- source_word: πάντες
  choice: todos
  rationale: O adjetivo substantivado, ligado ao artigo e ao particípio, abrange a totalidade do grupo.
- source_word: οἱ φυγαδεύοντες
  choice: os que fugiam
  rationale: O particípio presente substantivado expressa uma ação em curso. Esta formulação evita a conotação criminal que «fugitivos» pode ter e não acrescenta a ideia de que já estivessem refugiados.
- source_word: ἀπὸ
  choice: de
  rationale: A preposição indica afastamento ou separação; «fugir de» é a construção natural em português.
- source_word: τῶν κακῶν
  choice: dos males
  rationale: O plural neutro pode abranger atos maus, adversidades ou opressões. «Dos males» preserva essa amplitude sem restringir prematuramente o sentido.
