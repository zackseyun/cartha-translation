base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/041.yaml
  text: And on that day they decided, saying, “If any man comes against us for battle on the Sabbath day, we will fight against him, and we will certainly not all die as our brothers died in the hiding places.”
translation:
  language: pt
  text: 'Naquele dia, eles decidiram: “Se alguém vier guerrear contra nós no dia de sábado, lutaremos contra ele e de modo nenhum morreremos todos como morreram nossos irmãos nos esconderijos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: decidiram
  rationale: Expressa naturalmente a deliberação que resultou numa decisão, sem tornar explícitos detalhes ausentes do grego.
- source_word: Πᾶς ἄνθρωπος ὃς ἐὰν ἔλθῃ
  choice: Se alguém vier
  rationale: Reproduz com clareza o valor geral e condicional da construção grega; evita o masculino marcado desnecessário em português.
- source_word: εἰς πόλεμον
  choice: guerrear
  rationale: Transmite o propósito hostil da vinda de modo corrente e conciso.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: no dia de sábado
  rationale: É a forma portuguesa natural para a referência ao sábado como dia de repouso religioso.
- source_word: πολεμήσομεν κατέναντι αὐτοῦ
  choice: lutaremos contra ele
  rationale: Mantém a resposta militar direta e o referente singular do texto grego.
- source_word: οὐ μὴ ἀποθάνωμεν πάντες
  choice: de modo nenhum morreremos todos
  rationale: 'Preserva a negação enfática οὐ μή e o alcance de πάντες: eles não permitiriam que todos morressem.'
- source_word: ἐν τοῖς κρυφοῖς
  choice: nos esconderijos
  rationale: Conserva o plural substantivado e o sentido de lugares ocultos onde os irmãos haviam se refugiado.
theological_decisions:
- issue: Defesa armada no sábado
  choice: Tradução direta da decisão de lutar quando atacados no sábado
  alternative: Explicitar uma regra geral de autodefesa sabática
  rationale: O versículo relata a decisão do grupo em seu contexto, mas não formula explicitamente uma doutrina universal; a tradução não deve ampliar a afirmação.
- issue: Força da negação
  choice: “de modo nenhum morreremos todos”
  alternative: “não morreremos todos”
  rationale: A forma escolhida conserva a forte negação grega sem sugerir que nenhum indivíduo poderia morrer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula introdutória foi condensada de “decidiram, dizendo” para “decidiram:”, evitando um semitismo pouco natural sem perda de conteúdo. Não foram necessárias notas de rodapé.
