  text: But I and my sons and my brothers will walk in the covenant of our fathers[a].
translation:
  language: pt
  text: Mas eu, meus filhos e meus irmãos andaremos na aliança de nossos pais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «iremos na aliança de nossos pais». A expressão grega provavelmente significa conduzir a vida em fidelidade à aliança.
    reason: Alternativa lexical e explicação do sentido idiomático.
lexical_decisions:
- source_word: κἀγώ
  choice: Mas eu
  rationale: A crase reúne καί e ἐγώ. Neste contexto, «mas eu» comunica a oposição entre a decisão de Matatias e a submissão de outros, sem perder a ligação com o discurso anterior.
- source_word: οἱ υἱοί μου
  choice: meus filhos
  rationale: υἱοί designa especificamente os filhos homens de Matatias, de acordo com o contexto narrativo.
- source_word: οἱ ἀδελφοί μου
  choice: meus irmãos
  rationale: Mantém o sentido lexical mais direto de ἀδελφοί, sem ampliá-lo desnecessariamente para parentes ou aliados.
- source_word: πορευσόμεθα
  choice: andaremos
  rationale: Embora o verbo possa significar literalmente «iremos», junto de ἐν διαθήκῃ descreve a conduta perseverante segundo a aliança. «Andaremos» preserva a imagem bíblica e continua compreensível em português.
- source_word: ἐν διαθήκῃ
  choice: na aliança
  rationale: διαθήκη refere-se aqui à aliança herdada por Israel. A formulação conserva a preposição grega e sua associação com «andaremos».
- source_word: πατέρων ἡμῶν
  choice: de nossos pais
  rationale: Reproduz o termo masculino e familiar do grego, mantendo também sua ressonância ancestral e pactual.
theological_decisions:
- issue: A expressão pactual πορευσόμεθα ἐν διαθήκῃ
  choice: andaremos na aliança de nossos pais
  alternative: viveremos de acordo com a aliança de nossos pais
  rationale: A opção escolhida preserva a metáfora de caminhar e a linguagem pactual sem reduzir a frase a uma indicação espacial. A nota esclarece o sentido de conduta fiel sem transformar a interpretação em paráfrase no texto.
- issue: Termos masculinos de parentesco
  choice: meus filhos, meus irmãos, nossos pais
  alternative: meus filhos, meus parentes, nossos antepassados
  rationale: O grego emprega termos masculinos específicos. Preservá-los respeita a concretude familiar e histórica do enunciado, sem impor uma generalização ausente da fonte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Andaremos na aliança» conserva deliberadamente o idioma bíblico da fonte; a nota oferece o sentido mais explícito. A enumeração sem repetir «e» depois de «eu» evita rigidez excessiva em português, enquanto o último «e» representa naturalmente a coordenação grega.
