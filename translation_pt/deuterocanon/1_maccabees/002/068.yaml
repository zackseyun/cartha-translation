  text: Repay the nations with recompense[a], and pay attention to the commands of the law.
translation:
  language: pt
  text: Retribuam às nações com retribuição[a] e estejam atentos aos mandamentos da Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Retribuam aos gentios com retribuição”. O grego emprega um verbo e um substantivo da mesma raiz, literalmente algo como “retribuam uma retribuição”, para dar ênfase.'
    reason: Registra «gentios» como alternativa para ἔθνη e explica a construção cognata enfática do grego.
lexical_decisions:
- source_word: ἀνταποδίδοτε ἀνταπόδομα
  choice: Retribuam ... com a paga devida
  rationale: O imperativo e seu objeto cognato exprimem dar em troca a correspondente paga. A formulação mantém a força retributiva, evita intensificá-la necessariamente como punição e soa natural em português atual.
- source_word: τοῖς ἔθνεσιν
  choice: às nações
  rationale: ἔθνη pode designar tanto as nações quanto os gentios. “Nações” preserva a dimensão étnico-política pertinente ao contexto sem restringir desnecessariamente o referente.
- source_word: προσέχετε
  choice: estejam atentos
  rationale: O imperativo pede atenção cuidadosa. “Estejam atentos” é claro e atual, sem transformar o verbo diretamente em “obedeçam” ou “cumpram”.
- source_word: προστάγματα
  choice: mandamentos
  rationale: O substantivo indica ordens ou determinações. “Mandamentos” é acessível e adequado às prescrições da Lei, sem o tom institucional de “ordenanças”.
- source_word: τοῦ νόμου
  choice: da Lei
  rationale: No contexto, νόμος se refere à Lei de Israel, a Torá. A inicial maiúscula explicita esse referente reconhecível em português.
theological_decisions:
- issue: Sentido de τοῖς ἔθνεσιν
  choice: às nações
  alternative: aos gentios
  rationale: O contexto permite entender os povos não judeus, mas “nações” conserva tanto o valor étnico quanto o político do termo grego e não resolve sua amplitude de modo indevido.
- issue: Força de ἀνταπόδομα
  choice: a paga devida
  alternative: a retribuição
  rationale: O grego indica paga correspondente e, no contexto de conflito, pode ter sentido punitivo; porém, o substantivo por si só não exige que se explicite “castigo” ou “vingança”. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. “Paga devida” comunica reciprocidade sem tornar o texto coloquial nem impor uma nuance punitiva mais forte do que a expressão grega exige.
