  text: And they said to them[a], “Until now—come out and do according to the word of the king[b], and you will live.”
translation:
  language: pt
  text: 'E lhes disseram: “Até agora[a]: saiam e façam conforme a palavra do rei[b], e vocês viverão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Até este momento”. A abertura grega é concisa e pode indicar uma última oportunidade de obedecer.'
    reason: lexical_alternative
  - marker: b
    text: “Conforme a palavra do rei” também pode ser traduzido por “conforme a ordem do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕως τοῦ νῦν
  choice: Até agora
  rationale: Preserva a expressão temporal abrupta do grego e sua possível força de oportunidade final, sem explicitar além do texto.
- source_word: ἐξέλθοντες
  choice: Saiam
  rationale: O particípio, ligado ao imperativo seguinte, tem força de ordem. “Saiam” é natural no contexto de pessoas escondidas ou abrigadas.
- source_word: ποιήσατε
  choice: façam
  rationale: Corresponde diretamente ao imperativo amplo do grego e combina naturalmente com “conforme”.
- source_word: κατὰ τὸν λόγον τοῦ βασιλέως
  choice: conforme a palavra do rei
  rationale: Mantém λόγος como “palavra”, preservando a possibilidade contextual de significar ordem ou mandado.
- source_word: ζήσεσθε
  choice: vocês viverão
  rationale: Reproduz literalmente o futuro de ζάω e conserva a implicação, sem torná-la explícita, de que a vida deles seria poupada.
