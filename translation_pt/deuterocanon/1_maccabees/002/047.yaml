  text: And they pursued the sons of arrogance[b][a], and the work prospered in their hands.
translation:
  language: pt
  text: E perseguiram os filhos da arrogância[a], e a obra prosperou nas mãos deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os arrogantes” ou “os filhos da soberba”. O grego emprega literalmente a expressão “filhos da arrogância”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a iniciativa teve êxito sob a direção deles; literalmente, “a obra prosperou na mão deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίωξαν
  choice: perseguiram
  rationale: Expressa a perseguição ativa e hostil no contexto do conflito, sem especificar além do grego se houve expulsão ou morte.
- source_word: τοὺς υἱοὺς τῆς ὑπερηφανίας
  choice: os filhos da arrogância
  rationale: Preserva a expressão de sabor semítico e sua força retórica. Em sentido, refere-se aos arrogantes, mas a formulação literal mantém a imagem do original.
- source_word: ὑπερηφανίας
  choice: arrogância
  rationale: Comunica claramente, no português atual, a soberba prepotente e moralmente condenada indicada pelo termo grego.
- source_word: κατευωδώθη
  choice: prosperou
  rationale: 'Reproduz de modo conciso o resultado favorável expresso pela forma passiva: a ação empreendida foi bem-sucedida.'
- source_word: τὸ ἔργον
  choice: a obra
  rationale: É uma tradução direta que mantém em aberto o alcance da atividade realizada durante a revolta.
- source_word: ἐν χειρὶ αὐτῶν
  choice: nas mãos deles
  rationale: Usa uma forma natural em português para indicar que a obra avançou sob sua atuação e direção, preservando a imagem das mãos.
