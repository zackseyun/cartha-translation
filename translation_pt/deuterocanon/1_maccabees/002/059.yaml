  text: Hananiah[a], Azariah, and Mishael, having believed[b], were saved from the flame.
translation:
  language: pt
  text: Hananias[a], Azarias e Misael, tendo crido[b], foram salvos da chama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “Ananias, Azarias, Misael”. A tradução emprega as formas hebraicas mais conhecidas em português: “Hananias, Azarias e Misael”; são os três jovens de Daniel 3.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “porque creram, foram salvos”. Também se pode traduzir: “foram libertos da chama”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνανίας, Ἀζαρίας, Μισαήλ
  choice: Hananias, Azarias e Misael
  rationale: Os nomes são apresentados nas formas hebraicas mais reconhecíveis em português para os três jovens de Daniel 3; a nota registra as formas gregas do texto-fonte.
- source_word: πιστεύσαντες
  choice: tendo crido
  rationale: O particípio aoristo de πιστεύω indica que eles creram ou confiaram. “Tendo crido” reflete a construção participial sem definir de modo excessivo se a relação com o verbo principal é temporal, circunstancial ou causal.
- source_word: ἐσώθησαν
  choice: foram salvos
  rationale: O passivo de σῴζω pode significar “foram salvos”, “foram libertos” ou “foram resgatados”. “Foram salvos” preserva de perto o verbo grego e é natural no contexto de livramento de perigo mortal.
- source_word: ἐκ φλογός
  choice: da chama
  rationale: φλόξ designa chama ou labareda. O singular “da chama” mantém a imagem vívida e a construção concisa do grego.
theological_decisions:
- issue: Relação de πιστεύσαντες com ἐσώθησαν
  choice: tendo crido, foram salvos
  alternative: porque creram, foram salvos; por terem crido, foram salvos
  rationale: O particípio associa o ato de crer ao livramento, mas sua função exata pode ser entendida como circunstancial, temporal ou causal. A tradução principal conserva essa abertura, enquanto a nota apresenta a leitura causal possível.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais reconhecíveis e sintaxe concisa. A construção “tendo crido” mantém a proximidade formal com o particípio grego, e as notas preservam as alternativas legítimas sem impor uma interpretação doutrinária.
