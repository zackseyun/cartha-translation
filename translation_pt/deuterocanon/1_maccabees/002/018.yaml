base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/018.yaml
  text: Now then[a], come forward first and carry out the king’s command, as all the nations have done, and the rulers of Judah, and those left in Jerusalem; and you and your house will be among the king’s Friends[b], and you and your sons will be honored with silver and gold and many gifts.
translation:
  language: pt
  text: Agora, pois, venha primeiro e cumpra a ordem do rei, como fizeram todas as nações, os governantes de Judá e os que ficaram em Jerusalém. Você e sua família estarão entre os Amigos do rei[a], e você e seus filhos serão honrados com prata, ouro e muitas dádivas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amigos do rei”. O grego pode aludir ao título cortesão “Amigos”, uma classe reconhecida de conselheiros e companheiros favorecidos pelo rei.
    reason: lexical_alternative
  - marker: b
    text: O termo traduzido por “dádivas” pode indicar benefícios, concessões ou distribuições reais; aqui, refere-se a recompensas adicionais à prata e ao ouro.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσελθε πρῶτος
  choice: apresente-se primeiro
  rationale: Expressa tanto a aproximação quanto o gesto público de tomar a dianteira, preservando a pressão para servir de exemplo.
- source_word: ποίησον τὸ πρόσταγμα τοῦ βασιλέως
  choice: cumpra a ordem do rei
  rationale: Forma portuguesa natural para executar uma determinação oficial, sem enfraquecer sua autoridade.
- source_word: τὰ ἔθνη
  choice: todas as nações
  rationale: Mantém o sentido amplo do grego e evita impor o sentido técnico-religioso de “gentios”.
- source_word: οἱ ἄρχοντες Ἰούδα
  choice: os governantes de Judá
  rationale: Preserva a dimensão política e a posição reconhecida dessas autoridades.
- source_word: οἱ καταλειφθέντες ἐν Ἰερουσαλήμ
  choice: os que ficaram em Jerusalém
  rationale: Conserva a abertura do particípio grego, sem decidir se eram remanescentes, sobreviventes ou apenas residentes que permaneceram.
- source_word: ὁ οἶκός σου
  choice: sua família
  rationale: Neste contexto, “família” comunica naturalmente o grupo doméstico ligado a Matatias, enquanto o literal “casa” poderia soar como edifício.
- source_word: τῶν φίλων τοῦ βασιλέως
  choice: entre os Amigos do rei
  rationale: A inicial maiúscula sinaliza o provável título da corte helenística sem tornar a frase artificial.
- source_word: δοξασθήσεσθε
  choice: serão honrados
  rationale: No contexto de favores políticos e recompensas materiais, o verbo indica honra e distinção concedidas, não glorificação divina.
- source_word: ἀποστολαῖς πολλαῖς
  choice: muitas dádivas
  rationale: Ao lado de prata e ouro, o termo provavelmente designa benefícios, concessões ou distribuições reais; “dádivas” mantém esse alcance melhor do que “missões”.
theological_decisions:
- issue: Possível título cortesão em φίλοι
  choice: Amigos do rei
  alternative: amigos do rei
  rationale: O contexto de promoção e recompensa favorece a referência a uma classe reconhecida de cortesãos, mas a nota preserva a possibilidade do sentido comum.
- issue: Alcance de ἔθνη
  choice: nações
  alternative: gentios
  rationale: A tradução formalmente próxima conserva a amplitude étnico-política do termo e não introduz uma categoria religiosa mais específica do que o contexto exige.
- issue: Sentido de ἀποστολαί
  choice: dádivas
  alternative: benefícios, concessões ou distribuições reais
  rationale: O contexto material orienta o termo para recompensas concedidas pela coroa, embora sua forma exata permaneça indeterminada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” adequado à legibilidade brasileira. A coordenação extensa do grego foi dividida em duas frases para fluidez, sem alterar a progressão do apelo e da promessa.
