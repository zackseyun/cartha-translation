  yaml_path: translation/deuterocanon/1_maccabees/002/065.yaml
  text: And look, Simeon your brother—I know that he is a man of counsel. Listen to him all your days; he will be a father to you.
translation:
  language: pt
  text: 'E vejam: Simeão, irmão de vocês — sei que ele é um homem de discernimento. Escutem-no todos os dias; ele será como um pai para vocês.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: vejam
  rationale: Interjeição que chama a atenção dos ouvintes; «vejam» é natural no português moderno e preserva sua função discursiva.
- source_word: ἀνὴρ βουλῆς
  choice: homem de bom conselho
  rationale: Expressa a capacidade de oferecer orientação prudente, sem reduzir βουλή apenas a inteligência ou sabedoria genérica.
- source_word: ἀκούετε
  choice: escutem-no
  rationale: No contexto, ouvir Simeão implica dar atenção e seguir sua orientação; «escutem-no» mantém essa amplitude sem explicitar obediência além do texto.
- source_word: πάσας τὰς ἡμέρας
  choice: todos os dias
  rationale: Reproduz de modo simples a ideia contínua de recorrer à orientação de Simeão.
- source_word: εἰς πατέρα
  choice: como um pai
  rationale: A construção indica que Simeão desempenhará o papel de pai para eles; «como um pai» soa natural e evita sugerir paternidade biológica.
theological_decisions:
- issue: Autoridade paterna de Simeão
  choice: ele será como um pai para vocês
  alternative: ele será pai de vocês
  rationale: A formulação preserva a função de liderança e cuidado atribuída a Simeão, sem transformar a expressão relacional em afirmação de paternidade literal ou em título eclesiástico.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O plural «vocês» favorece clareza e legibilidade brasileira; o travessão conserva a pausa enfática do enunciado.
