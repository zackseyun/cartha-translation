lexical_decisions:
- source_word: ἵνα τί
  choice: Por que
  rationale: No grego helenístico, a expressão funciona idiomaticamente como pergunta de motivo ou finalidade. Em português, «Por que» é a forma natural e preserva a força lamentosa da pergunta.
- source_word: ἡμῖν
  choice: havemos de
  rationale: O dativo integra a construção idiomática que, de modo mais formal, seria «para nós viver». A locução «havemos de» transpõe naturalmente para o português a ideia deliberativa sem reproduzir uma sintaxe grega pouco natural.
- source_word: ἔτι
  choice: ainda
  rationale: Marca a continuação da vida e preserva a ideia de «continuar a viver» presente no lamento.
- source_word: ζῇν
  choice: viver
  rationale: O infinitivo presente significa viver ou continuar vivo; «viver» é direto, digno e semanticamente suficiente.
