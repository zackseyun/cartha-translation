  text: Elijah[a], in his zeal for the law, was taken up into heaven.
translation:
  language: pt
  text: Elias, em seu zelo pela Lei, foi elevado como que ao céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma menos literal: “foi elevado ao céu”. O grego inclui ὡς (“como”, “como que”), que pode atenuar ou caracterizar a expressão.'
    reason: Leitura alternativa decorrente da possível força de ὡς.
lexical_decisions:
- source_word: Ἠλίας
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida do nome grego Ἠλίας em português.
- source_word: ἐν τῷ ζηλῶσαι ζῆλον νόμου
  choice: em seu zelo pela Lei
  rationale: Expressa de modo natural a circunstância indicada pelo infinitivo articular com ἐν e conserva a ênfase do verbo e do substantivo cognatos sem reproduzir uma construção artificial em português. “Lei” refere-se aqui à Torá no contexto macabeu.
- source_word: ἀνελήμφθη
  choice: foi elevado
  rationale: Reproduz a voz passiva e o movimento ascendente de ἀναλαμβάνω; é uma formulação digna e corrente em português.
- source_word: ὡς εἰς τὸν οὐρανόν
  choice: como que ao céu
  rationale: Mantém explicitamente a nuance de ὡς, enquanto “ao céu” traduz com naturalidade εἰς τὸν οὐρανόν.
theological_decisions:
- issue: Se a partícula ὡς na ascensão de Elias deve ser expressa
  choice: Conservar a nuance comparativa ou modal em “como que ao céu”.
  alternative: “ao céu” ou “para o céu”
  rationale: O grego traz ὡς antes de εἰς τὸν οὐρανόν. Mantê-lo evita transformar silenciosamente a formulação em uma declaração de destino mais categórica do que o texto-fonte.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição etimológica de ζηλῶσαι ζῆλον foi vertida idiomaticamente por “em seu zelo”, e a ambiguidade de ὡς foi preservada no texto e esclarecida em nota.
