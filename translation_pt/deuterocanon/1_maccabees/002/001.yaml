  yaml_path: translation/deuterocanon/1_maccabees/002/001.yaml
  text: In those days Mattathias son of John, son of Simeon, a priest of the sons of Joarib, rose up from Jerusalem and settled in Modein.
translation:
  language: pt
  text: Naqueles dias, levantou-se Matatias, filho de João, filho de Simeão, sacerdote dos filhos de Joiaribe, vindo de Jerusalém, e estabeleceu-se em Modeín.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστη
  choice: levantou-se
  rationale: Preserva o sentido formal de erguer-se e o possível valor narrativo de entrar em ação, sem reduzi-lo simplesmente a “veio”.
- source_word: τῶν υἱῶν Ἰωαρίβ
  choice: dos filhos de Joiaribe
  rationale: Mantém a expressão genealógica e sacerdotal do grego, sem explicitar além do texto se se trata de família, clã ou turno sacerdotal.
- source_word: ἀπὸ Ἱερουσαλήμ
  choice: saiu de Jerusalém
  rationale: Expressa com naturalidade a origem ou partida indicada por ἀπό no encadeamento narrativo.
- source_word: ἐκάθισεν
  choice: se estabeleceu
  rationale: No contexto de mudança de residência, comunica o valor idiomático de fixar moradia, em vez do sentido estritamente literal “sentou-se”.
- source_word: Μωδεείν
  choice: Modeín
  rationale: Transliteração portuguesa clara do topônimo grego, com acento para orientar a pronúncia.
