translation_notes:
  register: Português atual, digno e de leitura fluente. A divisão em duas frases reduz a ambiguidade sintática de ligar “de Jerusalém” à identificação sacerdotal, sem acrescentar conteúdo. Os nomes seguem formas portuguesas reconhecíveis.
