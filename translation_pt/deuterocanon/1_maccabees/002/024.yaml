base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/024.yaml
  text: And Mattathias saw it and was zealous, and his inward parts trembled, and he brought up wrath according to the judgment, and running up he slaughtered him on the altar.
translation:
  language: pt
  text: Matatias viu aquilo e se encheu de zelo; suas entranhas estremeceram[a]. Ele deu vazão à ira conforme o julgamento[b] e, correndo, degolou o homem sobre o altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seus rins estremeceram”, expressão de estilo hebraico para profunda agitação ou emoção interior.
    reason: cultural_note
  - marker: b
    text: Ou “como exigia o julgamento” ou “de acordo com a ordenança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήλωσεν
  choice: se encheu de zelo
  rationale: Expressa a indignação zelosa indicada por ζηλόω e conserva o motivo de zelo pela aliança, sem reduzi-lo a simples ciúme ou ira.
- source_word: οἱ νεφροὶ αὐτοῦ
  choice: suas entranhas
  rationale: O grego diz literalmente “seus rins”, hebraísmo que representa o íntimo e as emoções profundas. “Entranhas” mantém a imagem corporal de modo natural em português.
- source_word: ἀνήνεγκεν θυμόν
  choice: deu vazão à ira
  rationale: Comunica a exteriorização intensa da ira de modo idiomático e claro, sem tratá-la como mera emoção passiva.
- source_word: κατὰ τὸ κρίμα
  choice: conforme o julgamento
  rationale: Preserva o sentido judicial de κρίμα e não determina se se trata especificamente de lei, sentença ou ordenança.
- source_word: δραμὼν
  choice: correndo
  rationale: Mantém a rapidez e a ação direta expressas pelo particípio aoristo, sem acrescentar uma direção que não está explícita no termo.
- source_word: ἔσφαξεν
  choice: degolou
  rationale: Conserva a violência de σφάζω e sua possível ressonância sacrificial, mais forte do que o genérico “matou”.
- source_word: ἐπὶ τὸν βωμόν
  choice: sobre o altar
  rationale: Torna explícito o local chocante do ato e corresponde naturalmente à preposição ἐπί com acusativo neste contexto.
theological_decisions:
- issue: Preservação da alusão ao zelo pela aliança e à execução judicial
  choice: Manter a linguagem de zelo, julgamento, ira e degola sem atenuá-la nem explicá-la no corpo do versículo.
  alternative: Interpretar como “ficou enfurecido” ou “executou-o segundo a Lei”.
  rationale: O texto associa o ato de Matatias ao zelo e ao julgamento, mas não identifica expressamente κρίμα como uma lei ou sentença específica. A tradução conserva essa tensão narrativa e teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação grega foi levemente organizada com pontuação e divisão em duas frases, sem eliminar a sequência rápida das ações.
