  text: Joseph[a], in the time of his distress, kept the commandment, and became lord of Egypt.
translation:
  language: pt
  text: José, no tempo da sua aflição, guardou um mandamento[a] e tornou-se senhor do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o mandamento» ou «uma ordem». O grego não especifica qual mandamento está em vista e pode resumir, de modo geral, a obediência de José.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν καιρῷ στενοχωρίας αὐτοῦ
  choice: no tempo da sua aflição
  rationale: Reproduz com naturalidade a expressão temporal e o sentido de dificuldade ou provação de στενοχωρία, sem restringi-lo apenas à angústia emocional.
- source_word: ἐφύλαξε
  choice: guardou
  rationale: Em combinação com ἐντολήν, «guardou» é uma formulação bíblica clara e corrente para a obediência fiel.
- source_word: ἐντολήν
  choice: um mandamento
  rationale: O substantivo grego está no singular e sem artigo. «Um mandamento» preserva essa indefinição, enquanto a nota registra que a expressão também pode ter sentido genérico ou definido pelo contexto.
- source_word: κύριος Αἰγύπτου
  choice: senhor do Egito
  rationale: Mantém a formulação compacta e elevada do grego; aqui «senhor» indica a autoridade concedida a José, não um título divino.
- source_word: ἐγένετο
  choice: tornou-se
  rationale: Expressa diretamente a mudança de condição indicada pelo verbo grego.
theological_decisions:
- issue: Referência da obediência de José
  choice: Manter sem especificação qual mandamento José guardou.
  alternative: Entender a frase como alusão específica à recusa de José diante da mulher de Potifar.
  rationale: O grego não identifica o mandamento. A redação preserva essa abertura, sem limitar a referência a Gênesis 39 nem excluir essa possível evocação.
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla compreensão internacional e boa legibilidade brasileira. «Guardou um mandamento» conserva a concisão e a ambiguidade do original.
