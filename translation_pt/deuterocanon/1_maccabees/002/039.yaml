  text: E Matatias e seus amigos souberam disso e lamentaram profundamente por eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: souberam disso
  rationale: O aoristo de γινώσκω indica aqui que Matatias e seus amigos receberam a notícia ou tomaram conhecimento do acontecimento mencionado anteriormente.
- source_word: οἱ φίλοι αὐτοῦ
  choice: seus amigos
  rationale: φίλοι designa amigos ou associados próximos; “seus amigos” é direto, natural e adequado ao círculo leal de Matatias.
- source_word: ἐπένθησαν
  choice: ficaram de luto
  rationale: O verbo expressa lamento em resposta à morte; “ficaram de luto” comunica esse sentido com clareza, sem reduzi-lo apenas ao ato físico de chorar.
- source_word: ἐπʼ αὐτούς
  choice: por eles
  rationale: Com um verbo de luto, ἐπί com acusativo identifica as pessoas por quem se lamenta; “por eles” preserva naturalmente essa relação.
- source_word: ἕως σφόδρα
  choice: profundamente
  rationale: A expressão intensifica o luto. “Profundamente” transmite em português corrente a grande intensidade emocional, sem a rigidez de uma reprodução literal.
