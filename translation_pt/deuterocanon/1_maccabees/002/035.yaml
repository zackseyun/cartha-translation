  text: And they hastened to make war against them[a].
translation:
  language: pt
  text: E apressaram-se a fazer guerra contra eles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correram a guerrear contra eles” ou “lançaram um ataque contra eles”. O grego é conciso; literalmente, “apressaram guerra contra eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάχυναν
  choice: apressaram-se
  rationale: O aoristo de ταχύνω comunica rapidez ou urgência. A forma pronominal é natural em português e preserva a ideia de que agiram sem demora, sem especificar uma manobra militar não expressa no grego.
- source_word: πόλεμον
  choice: fazer guerra
  rationale: πόλεμος significa literalmente “guerra”. A locução “fazer guerra” conserva esse conteúdo lexical e torna natural em português a construção grega condensada.
- source_word: ἐπʼ αὐτούς
  choice: contra eles
  rationale: Em contexto de ação hostil, ἐπί com acusativo indica o alvo da ação e é naturalmente traduzido por “contra eles”.
