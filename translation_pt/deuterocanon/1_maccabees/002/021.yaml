translation:
  language: pt
  text: Longe de nós abandonar a Lei e os preceitos![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Que Deus seja misericordioso conosco, para que não abandonemos a Lei e os preceitos”. O grego emprega uma fórmula idiomática de forte rejeição: “Longe de nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵλεως ἡμῖν
  choice: Longe de nós
  rationale: A expressão grega, seguida de infinitivo, funciona idiomaticamente como forte repúdio à ação mencionada. “Longe de nós” preserva essa força e soa natural em português, sem inserir explicitamente “Deus”, que não aparece no texto.
- source_word: καταλεῖπειν
  choice: abandonar
  rationale: Expressa deixar deliberadamente a Lei, e não apenas afastar-se dela de modo neutro; “abandonar” comunica com clareza a gravidade da apostasia no contexto.
- source_word: νόμον
  choice: a Lei
  rationale: Embora o substantivo esteja sem artigo em grego, o contexto aponta para a Lei reconhecida de Israel. A inicial maiúscula ajuda a indicar essa referência definida e pactual.
- source_word: δικαιώματα
  choice: os preceitos
  rationale: O termo designa determinações ou exigências legais estabelecidas. “Preceitos” é corrente, digno e abrangente, sem restringir indevidamente o sentido a uma categoria específica de mandamentos.
theological_decisions:
- issue: Força pactual de νόμον καὶ δικαιώματα
  choice: a Lei e os preceitos
  alternative: a lei e os estatutos
  rationale: A formulação mantém a referência à tradição legal pactual de Israel e à fidelidade exigida por ela, sem introduzir divisões teológicas posteriores entre tipos de lei.
- issue: Agente implícito na expressão ἵλεως ἡμῖν
  choice: Não explicitar Deus no texto principal
  alternative: Deus nos livre de abandonar
  rationale: Embora a expressão possa evocar um apelo à misericórdia divina, o grego não nomeia Deus. “Longe de nós” preserva o valor idiomático e evita resolver além do texto a dimensão teológica implícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A exclamação reproduz a veemência da declaração; “Lei” recebe inicial maiúscula por se referir à Lei de Israel.
