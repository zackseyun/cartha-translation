  text: And seeing the blasphemies being committed in Judah and in Jerusalem,
translation:
  language: pt
  text: E, ao ver as blasfêmias que se cometiam em Judá e em Jerusalém,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδών
  choice: ao ver
  rationale: O particípio aoristo de ὁράω liga esta oração ao discurso ou à ação seguinte. “Ao ver” é natural em português e preserva essa relação sem impor uma sequência temporal mais específica.
- source_word: βλασφημίας
  choice: blasfêmias
  rationale: É o equivalente direto do substantivo grego e mantém o caráter explicitamente religioso das ofensas, sem restringi-las interpretativamente a sacrilégios.
- source_word: τὰς γινομένας
  choice: que se cometiam
  rationale: O particípio presente descreve atos em curso. Em português, “cometer blasfêmias” é idiomático, e o imperfeito comunica adequadamente a continuidade no contexto narrativo.
- source_word: ἐν Ἰούδᾳ
  choice: em Judá
  rationale: Preserva a forma territorial tradicional e sua ressonância étnica, evitando introduzir a associação administrativa posterior que “Judeia” pode sugerir.
- source_word: ἐν Ἱερουσαλήμ
  choice: em Jerusalém
  rationale: Forma portuguesa consagrada do nome geográfico, sem ambiguidade relevante para a tradução.
theological_decisions:
- issue: Tradução de βλασφημίας no contexto histórico de 1 Macabeus
  choice: blasfêmias
  alternative: sacrilégios; ultrajes
  rationale: “Blasfêmias” conserva o peso religioso explícito do grego e abrange atos ímpios contra Deus e as coisas sagradas. “Sacrilégios” estreitaria o sentido, enquanto “ultrajes” poderia diluir sua dimensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “ao ver” mantém a ligação participial do grego, e “que se cometiam” expressa naturalmente o caráter contínuo dos atos. A vírgula final foi preservada porque o versículo constitui uma oração dependente que prossegue no contexto.
