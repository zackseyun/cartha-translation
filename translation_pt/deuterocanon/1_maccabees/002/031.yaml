base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_maccabees/002/031.yaml
  text: And it was reported to the king’s men and to the forces that were in Jerusalem[a], the city of David, that men who had scattered because of the king’s command had gone down into the hidden places in the wilderness.
translation:
  language: pt
  text: E foi comunicado aos homens do rei e às forças que estavam em Jerusalém, cidade de Davi, que homens que se haviam dispersado por causa da ordem do rei[a] haviam descido aos lugares ocultos no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que homens que haviam desobedecido à ordem do rei haviam descido aos esconderijos no deserto”. A construção grega é comprimida e pode indicar tanto a dispersão causada pela ordem quanto a desobediência a ela.'
    reason: Leitura alternativa decorrente da construção incomum διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως.
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: foi comunicado
  rationale: O aoristo passivo introduz uma informação levada às autoridades; a construção impessoal é natural em português e não acrescenta um mensageiro não mencionado.
- source_word: τοῖς ἀνδράσιν τοῦ βασιλέως
  choice: aos homens do rei
  rationale: Mantém o sentido amplo de ἄνδρες sem definir indevidamente essas pessoas como oficiais ou soldados.
- source_word: ταῖς δυνάμεσιν
  choice: às forças
  rationale: Em contexto militar, δυνάμεις designa forças armadas ou tropas; “forças” conserva a amplitude e o plural do grego.
- source_word: ἐν Ἰερουσαλὴμ πόλει Δαυείδ
  choice: em Jerusalém, cidade de Davi
  rationale: Trata πόλει Δαυείδ como aposição a Jerusalém, preservando ambos os nomes de forma fluente em português.
- source_word: κατέβησαν
  choice: haviam descido
  rationale: O mais-que-perfeito composto expressa naturalmente que a descida ocorreu antes de ser comunicada; “descer” preserva a perspectiva geográfica do verbo.
- source_word: διεσκέδασαν
  choice: tendo se dispersado por causa de
  rationale: Preserva o núcleo lexical usual de διασκεδάζω, “dispersar”, e explicita de modo idiomático a relação contextual com a ordem real, sem ocultar em nota a dificuldade da construção grega.
- source_word: τὴν ἐντολὴν τοῦ βασιλέως
  choice: a ordem do rei
  rationale: “Ordem” traduz ἐντολή com naturalidade no contexto de uma determinação régia.
- source_word: εἰς τοὺς κρυφοὺς
  choice: aos lugares ocultos
  rationale: O adjetivo substantivado indica locais escondidos ou secretos; “lugares ocultos” mantém essa forma de expressão sem pressupor estruturas construídas.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: “Deserto” é uma tradução clara e corrente de ἔρημος em português bíblico, podendo designar uma região erma sem implicar necessariamente dunas de areia.
theological_decisions:
- issue: Sentido de διεσκέδασαν τὴν ἐντολὴν τοῦ βασιλέως
  choice: Os homens se dispersaram por causa da ordem do rei e depois desceram a lugares ocultos no deserto.
  alternative: Os homens desobedeceram ou rejeitaram a ordem do rei e foram para esconderijos no deserto.
  rationale: 'A expressão grega é comprimida e incomum: διεσκέδασαν normalmente significa “dispersaram”, mas aqui recebe “a ordem do rei” como objeto direto, o que pode apontar para o sentido contextual de rejeitar ou desobedecer. O texto principal conserva o valor lexical mais comum e a nota registra a outra leitura plausível, sem resolver silenciosamente a tensão.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita definir “os homens do rei” como uma categoria administrativa ou militar específica e conserva, por meio de nota, a ambiguidade real da cláusula central.
