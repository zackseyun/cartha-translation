  text: And he blessed them[a], and was gathered to his fathers.
translation:
  language: pt
  text: E ele os abençoou e foi reunido a seus antepassados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “foi acrescentado a seus pais”; expressão tradicional que indica a morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐλόγησεν
  choice: abençoou
  rationale: O aoristo de εὐλογέω indica que Matatias pronunciou uma bênção sobre os presentes; “abençoou” é natural, preciso e mantém a concisão do grego.
- source_word: προσετέθη
  choice: foi reunido
  rationale: Embora o verbo signifique literalmente “foi acrescentado”, nesta fórmula tradicional de morte a tradução “foi reunido” comunica o uso idiomático sem explicitar além do texto o que ocorre após a morte.
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: a seus antepassados
  rationale: “Antepassados” comunica em português atual o sentido coletivo de πατέρες neste idioma de morte e evita que “pais” seja entendido apenas como pai e mãe.
theological_decisions:
- issue: Fórmula de morte προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: foi reunido a seus antepassados
  alternative: foi acrescentado a seus pais
  rationale: A redação principal conserva a fórmula bíblica tradicional e sua passividade, mas usa português compreensível. Ela não define a natureza do estado dos mortos nem transforma o idioma em uma afirmação antropológica mais específica; a forma mais literal fica registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A coordenação simples do grego foi preservada; “antepassados” foi preferido a “pais” para evitar ambiguidade familiar indevida no português contemporâneo.
