  text: Joshua[a], in fulfilling the word[b], became a judge in Israel.
translation:
  language: pt
  text: Josué, ao cumprir[a] a palavra[b], tornou-se juiz em Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando cumpriu” ou “por cumprir”. A construção grega pode ter sentido temporal ou instrumental.
    reason: lexical_alternative
  - marker: b
    text: “A palavra” também pode ser entendida como “a ordem”, “a promessa” ou “o assunto”, conforme se compreenda a alusão à fidelidade de Josué.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Josué
  rationale: Neste resumo histórico dos fiéis de Israel, o referente é Josué, filho de Num. A forma portuguesa tradicional distingue essa personagem de Jesus de Nazaré, embora o grego use a mesma forma nominal.
- source_word: ἐν τῷ πληρῶσαι
  choice: ao cumprir
  rationale: A construção com ἐν e infinitivo articular pode indicar circunstância temporal ou meio. “Ao cumprir” é natural em português e mantém certa abertura entre essas nuances, explicitadas em nota.
- source_word: λόγον
  choice: a palavra
  rationale: λόγος tem sentido amplo. “A palavra” conserva a concisão e a indeterminação do grego, sem decidir se se trata especificamente de ordem, promessa ou assunto.
- source_word: ἐγένετο
  choice: tornou-se
  rationale: Expressa de modo idiomático a passagem de Josué à função mencionada, correspondendo ao sentido de “veio a ser” ou “tornou-se”.
- source_word: κριτὴς
  choice: juiz
  rationale: É o equivalente lexical direto e preserva a categoria histórico-bíblica, sem reduzi-la nem ampliá-la para “líder”.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Reproduz diretamente a preposição grega ἐν e evita tornar explícita uma ideia de domínio que a expressão não exige.
theological_decisions:
- issue: Natureza da “palavra” cumprida por Josué
  choice: a palavra
  alternative: a ordem; a promessa; o assunto
  rationale: O substantivo λόγος não determina por si só qual dessas acepções está em vista. A tradução genérica preserva a possível alusão e evita impor uma interpretação narrativa ou teológica específica.
- issue: Relação expressa por ἐν τῷ πληρῶσαι
  choice: ao cumprir
  alternative: quando cumpriu; por cumprir
  rationale: A construção pode ser entendida temporal ou instrumentalmente. O texto principal mantém uma formulação compacta, e a nota registra a ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase acompanha de perto o grego sem soar artificial; as notas preservam suas ambiguidades lexical e sintática.
