  text: And you, children, be strong and act like men in your law, because in it you will be glorified.
translation:
  language: pt
  text: E vocês, filhos, sejam fortes e portem-se como homens[a] na lei de vocês, pois nela serão glorificados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “sejam corajosos”. O verbo grego emprega literalmente uma imagem masculina: “portem-se como homens” ou “mostrem-se homens”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “serão honrados” ou “alcançarão glória”.
    reason: alternative_reading
lexical_decisions:
- source_word: τέκνα
  choice: filhos
  rationale: O termo grego designa os descendentes de modo amplo. Em português, “filhos” é a forma relacional natural para a exortação de um pai aos seus descendentes, sem acrescentar o possessivo “meus”, ausente no grego.
- source_word: ἰσχύετε
  choice: sejam fortes
  rationale: O imperativo presente exorta à força e à firmeza contínuas. “Sejam fortes” é claro, idiomático e mantém a força exortativa.
- source_word: ἀνδρίζεσθε
  choice: portem-se como homens
  rationale: O verbo expressa coragem por meio de uma imagem explicitamente masculina. A tradução conserva essa imagem concreta, enquanto a nota registra o sentido idiomático “sejam corajosos”.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: na lei de vocês
  rationale: A preposição indica a esfera em que devem demonstrar força e coragem. “De vocês” preserva o possessivo explícito e soa mais claro no português moderno do que “vossa lei”.
- source_word: δοξασθήσεσθε
  choice: serão glorificados
  rationale: O futuro passivo preserva a relação verbal com glória e não especifica quem concede essa glória nem de que modo ela se manifesta.
theological_decisions:
- issue: Imagem masculina em ἀνδρίζεσθε
  choice: portem-se como homens
  alternative: sejam corajosos
  rationale: O grego formula a coragem mediante imagem masculina explícita. Mantê-la evita neutralizar silenciosamente a retórica da fonte; a nota oferece o sentido idiomático.
- issue: Sentido e agente de δοξασθήσεσθε
  choice: serão glorificados
  alternative: serão honrados; alcançarão glória
  rationale: A fonte não identifica o agente nem define se a promessa se refere a honra pública, recompensa divina ou vindicação. “Serão glorificados” conserva essa abertura.
translation_notes:
  register: Português moderno, digno e diretamente compreensível, com “vocês” para ampla legibilidade brasileira. A construção conserva a repetição da segunda pessoa, o possessivo explícito, a imagem masculina do verbo grego e o passivo teologicamente aberto da promessa.
