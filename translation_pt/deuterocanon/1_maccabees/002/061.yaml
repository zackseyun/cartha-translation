  yaml_path: translation/deuterocanon/1_maccabees/002/061.yaml
  text: And so consider[a], from generation to generation[b], that all who hope in him will not grow weak.
translation:
  language: pt
  text: E assim, considerem[a], de geração em geração, que todos os que esperam nele não enfraquecerão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entendam” ou “levem isto a sério”.
    reason: lexical_alternative
  - marker: b
    text: Ou “não serão fracos”; o grego também pode ser entendido, em sentido mais amplo, como “não falharão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐννοήθητε
  choice: considerem
  rationale: O aoristo imperativo plural exorta os ouvintes a refletir e reconhecer algo à luz da história de Israel. “Considerem” é natural, atual e mantém a força exortativa.
- source_word: κατὰ γενεὰν
  choice: de geração em geração
  rationale: A expressão aponta para a sucessão das gerações e para o testemunho contínuo da história, ideia transmitida idiomaticamente em português por “de geração em geração”.
- source_word: ἐλπίζοντες
  choice: os que esperam
  rationale: Traduz diretamente o particípio presente de ἐλπίζω e preserva o sentido de esperança confiante, sem deslocá-lo inteiramente para “confiar”.
- source_word: ἐπʼ αὐτόν
  choice: nele
  rationale: Com “esperar”, “nele” é uma construção portuguesa natural. O pronome conserva a forma do grego, enquanto o contexto indica Deus como referente.
- source_word: ἀσθενήσουσιν
  choice: não enfraquecerão
  rationale: O futuro de ἀσθενέω pode indicar ficar ou tornar-se fraco. “Não enfraquecerão” preserva o valor verbal e evita especificar em excesso a ideia mais ampla de não falhar.
theological_decisions:
- issue: Referente de αὐτόν (“nele”)
  choice: Deus como referente implícito, mantendo-se o pronome no texto
  alternative: Um objeto de esperança não explicitamente identificado
  rationale: O contexto imediato relembra a fidelidade de Deus aos antepassados. Manter “nele” preserva a expressão grega sem inserir o nome “Deus” onde o versículo usa um pronome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a exortação no plural e conserva a ambiguidade lexical de ἀσθενέω por meio de nota.
