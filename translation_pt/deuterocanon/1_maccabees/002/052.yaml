  yaml_path: translation/deuterocanon/1_maccabees/002/052.yaml
  text: Was not Abraham found faithful in testing[b][a], and was it counted to him as righteousness?
translation:
  language: pt
  text: Não foi Abraão achado fiel na provação[a] e isso lhe foi atribuído como justiça?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na prova”. O termo grego também pode significar “tentação”, mas aqui se refere ao fato de Abraão ter sido posto à prova.
    reason: lexical_alternative
  - marker: b
    text: Alusão a Gênesis 15:6, aqui ligada à provação de Abraão.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀβραάμ
  choice: Abraão
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do patriarca.
- source_word: πειρασμῷ
  choice: na provação
  rationale: O termo pode indicar prova, provação ou tentação. Neste contexto, refere-se à prova pela qual Abraão passou, não a um estímulo para pecar.
- source_word: εὑρέθη πιστός
  choice: foi ... achado fiel
  rationale: 'Mantém a construção passiva e o sentido avaliativo do grego: Abraão foi constatado ou reconhecido como fiel em meio à prova.'
- source_word: ἐλογίσθη
  choice: foi atribuído
  rationale: Preserva a imagem de considerar ou lançar algo à conta de alguém e soa natural em português, sem acrescentar uma elaboração doutrinária posterior.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: É o equivalente português corrente de δικαιοσύνη neste contexto bíblico e conserva o vínculo verbal com Gênesis 15:6.
theological_decisions:
- issue: Relação entre a provação de Abraão e a atribuição de justiça
  choice: Manter as duas afirmações ligadas na mesma pergunta retórica, sem explicar sua relação cronológica ou teológica.
  alternative: Explicitar que a fé demonstrada durante a prova foi o que lhe foi atribuído como justiça, ou harmonizar diretamente Gênesis 15:6 com o episódio da prova de Abraão.
  rationale: O grego associa a fidelidade de Abraão na provação à atribuição de justiça, mas não esclarece de que modo os episódios bíblicos se relacionam. A tradução preserva essa tensão.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” mantém a formulação bíblica tradicional e a amplitude do termo grego, enquanto “retidão” poderia estreitar o sentido para uma qualidade moral pessoal.
translation_notes:
  register: Português moderno, claro e digno, com leve preservação da cadência bíblica em “achado fiel”. A pergunta retórica e a ambiguidade da ligação entre as duas orações foram mantidas.
