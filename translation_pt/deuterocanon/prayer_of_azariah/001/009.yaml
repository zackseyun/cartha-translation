base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/009.yaml
  text: And you gave us into the hands of our lawless enemies, hateful rebels, and to an unjust and most wicked king in all the earth.
translation:
  language: pt
  text: E nos entregaste nas mãos de nossos inimigos sem lei, de apóstatas extremamente odiosos e de um rei injusto, o mais perverso de toda a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκας
  choice: entregaste
  rationale: Preserva a ação direta expressa pelo aoristo grego e o tom da oração dirigida a Deus.
- source_word: ἀνόμων
  choice: transgressores da lei
  rationale: Expressa de modo claro o sentido de pessoas que vivem contra a lei, evitando a possível ambiguidade moderna de «sem lei».
- source_word: ἐχθίστων ἀποστατῶν
  choice: apóstatas detestáveis
  rationale: Mantém ἀποστατῶν como «apóstatas» e transmite a forte qualificação negativa de ἐχθίστων em português natural.
- source_word: πονηροτάτῳ παρὰ πᾶσαν τὴν γῆν
  choice: o mais perverso de toda a terra
  rationale: Reproduz o superlativo enfático e entende a construção comparativa como supremacia em perversidade no âmbito de toda a terra.
theological_decisions:
- issue: Caracterização dos inimigos como ἀποστάται
  choice: apóstatas
  alternative: rebeldes
  rationale: «Apóstatas» preserva a ideia específica de deserção ou abandono presente no termo grego, sem reduzir o sentido à rebeldia genérica.
- issue: Referência à lei em ἀνόμων
  choice: transgressores da lei
  alternative: iníquos
  rationale: A tradução explícita conserva a referência lexical à lei sem determinar além do texto qual código legal está em vista.
translation_notes:
  register: Português atual, digno e acessível, com forma verbal de oração («entregaste»). A aposição «apóstatas detestáveis» conserva a tensão e a severidade retórica do grego sem tornar a frase excessivamente literal.
