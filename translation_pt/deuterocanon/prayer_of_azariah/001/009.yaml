revisions:
- from: E nos entregaste nas mãos de nossos inimigos transgressores da lei, apóstatas detestáveis, e a um rei injusto, o mais perverso de toda a terra.
  to: E nos entregaste nas mãos de nossos inimigos sem lei, de apóstatas extremamente odiosos e de um rei injusto, o mais perverso de toda a terra.
  rationale: A revisão substitui uma caracterização passiva e sem força superlativa por uma formulação que comunica melhor ἐχθίστων, traduz ἀνόμων sem restringir seu referente e melhora o paralelismo sintático da enumeração. Não acrescenta interpretação histórica ou confessional.
