review_pass:
  verdict: revise
  source_fidelity: A tradução conserva corretamente a entrega aos adversários e ao rei, bem como a injustiça e o superlativo referente à perversidade do rei. Contudo, «detestáveis» significa sobretudo “dignos de ser detestados”, enquanto ἐχθίστων caracteriza os apóstatas como intensamente hostis/odiosos; além disso, o superlativo grego merece expressão mais clara.
  naturalness: A construção do rascunho é compreensível, mas a coordenação de «nas mãos de ... e a um rei» fica menos fluida. Repetir «de» na série torna clara a regência de «nas mãos».
  terminology: «Apóstatas» é uma opção defensável para ἀποστατῶν e preserva a maior especificidade do grego em comparação com «rebeldes». «Sem lei» traduz ἀνόμων de modo direto, sem especificar indevidamente qual lei está em vista. «Extremamente odiosos» representa adequadamente a força superlativa de ἐχθίστων.
  issues:
  - severity: medium
    issue: «apóstatas detestáveis» não transmite com precisão ἐχθίστων.
    rationale: «Detestáveis» tende a ser passivo (“que merecem ser detestados”), ao passo que o adjetivo grego descreve adversários como particularmente odiosos/hostis. A formulação revista também explicita a intensidade superlativa.
  - severity: low
    issue: Regência e paralelismo na enumeração.
    rationale: «Nas mãos de ... e a um rei» é possível por elipse, mas «nas mãos de ... de ... e de ...» é mais transparente em português e mantém todos os agentes sob a imagem de submissão ao seu poder.
  revised_text: E nos entregaste nas mãos de nossos inimigos sem lei, de apóstatas extremamente odiosos e de um rei injusto, o mais perverso de toda a terra.
  revised_footnotes: []
