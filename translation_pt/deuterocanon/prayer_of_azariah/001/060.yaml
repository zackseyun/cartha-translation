base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/060.yaml
  text: Bless the Lord[a], Israel; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Israel, bendigam o Senhor[a]; cantem louvores a ele e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “louvem o Senhor”. Neste contexto de adoração, o verbo grego também pode significar “louvar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bendigam
  rationale: O imperativo plural preserva o idioma bíblico de bendizer a Deus. Em contexto litúrgico, o verbo também pode significar “louvar”, alternativa registrada em nota.
- source_word: Ἰσραήλ
  choice: Povo de Israel
  rationale: O nome funciona como chamado coletivo. A explicitação de “povo” permite manter naturalmente em português os imperativos plurais do grego sem alterar o referente.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Tradução direta e corrente de κύριος quando o termo se refere a Deus; a forma grega não exige representar graficamente o tetragrama.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Preserva tanto o ato de louvar quanto a nuance musical e litúrgica de ὑμνέω.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no sobremaneira
  rationale: “Sobremaneira” comunica a força intensiva do verbo composto sem recorrer a uma formulação pouco natural.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Expressa de modo idiomático a duração ilimitada da fórmula doxológica.
theological_decisions:
- issue: Tradução de κύριος em um hino deuterocanônico dirigido a Deus
  choice: o Senhor
  alternative: o SENHOR
  rationale: A fonte grega traz κύριον, não o tetragrama hebraico diretamente. “O Senhor” segue a forma lexical do texto grego sem acrescentar uma identificação tipográfica não explicitada nele.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Povo de Israel” torna natural a concordância com os três imperativos plurais do grego; “sobremaneira” conserva o tom elevado do refrão sem arcaísmo excessivo.
