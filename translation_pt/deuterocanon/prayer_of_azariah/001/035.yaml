  text: Bless the Lord[a], angels of the Lord[b]; sing hymns and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, anjos do Senhor; cantem hinos e o exaltem grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural preserva o sentido doxológico de εὐλογέω e o registro litúrgico, sem excluir a ideia de louvor.
- source_word: ἄγγελοι
  choice: anjos
  rationale: No chamado cósmico do hino, refere-se naturalmente a seres celestiais, não a mensageiros humanos.
- source_word: Κυρίου / τὸν κύριον
  choice: Senhor
  rationale: É a correspondência bíblica e contextualmente adequada para κύριος nas duas ocorrências.
- source_word: ὑμνεῖτε
  choice: cantem-lhe hinos
  rationale: Expressa de modo natural em português tanto a ação de cantar quanto o caráter hínico e litúrgico de ὑμνέω; o pronome retoma o Senhor.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  rationale: O composto intensivo pede mais que o simples verbo 'exaltar'; esta formulação comunica a elevação superlativa em português corrente e digno.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a forma idiomática portuguesa para a duração perpétua indicada pela expressão neste refrão.
theological_decisions:
- issue: Tradução de κύριος no hino grego deuterocanônico
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” mantém o uso bíblico tradicional e a referência divina do contexto sem introduzir interpretação denominacional.
translation_notes:
  register: Português moderno, claro e litúrgico, com imperativos no plural. A construção preserva o paralelismo do chamado hínico e a intensidade de ὑπερυψοῦτε sem recorrer a linguagem arcaica.
