translation:
  language: pt
  text: Bendito és tu, Senhor, Deus de nossos pais, e louvado e glorificado é o teu nome para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Bendito
  rationale: Adjetivo predicativo em fórmula litúrgica de bênção; «Bendito» conserva o registro doxológico e a construção de tratamento direto.
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος; neste contexto de oração, funciona como título divino em invocação direta.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Deus de nossos pais
  rationale: Expressão bíblica de caráter pactual. «Pais» reproduz o termo masculino explícito do grego e mantém sua ressonância tradicional, sem impedir que o contexto abranja os antepassados.
- source_word: αἰνετὸν
  choice: louvado
  rationale: O adjetivo indica ser digno de louvor. «Louvado» forma naturalmente, com «glorificado», a cláusula doxológica sem acrescentar uma obrigação modal explícita.
- source_word: δεδοξασμένον
  choice: glorificado
  rationale: Forma perfeita passiva com valor participial ou adjetival de δοξάζω; «glorificado» preserva tanto o aspecto de honra conferida quanto o peso teológico do termo.
- source_word: τὸ ὄνομά σου
  choice: o teu nome
  rationale: Mantém a metonímia bíblica para a identidade revelada e a reputação de Deus, sem explicitação interpretativa.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Tradução idiomática portuguesa da expressão grega «pelos séculos/eras», que comunica duração perpétua de modo natural.
theological_decisions:
- issue: Tradução da expressão pactual τῶν πατέρων ἡμῶν
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O grego diz literalmente «nossos pais». A redação principal conserva a forma masculina e o idioma bíblico pactual; «antepassados» comunicaria bem a extensão genealógica, mas reduziria a correspondência lexical.
- issue: Construção καὶ αἰνετὸν καὶ δεδοξασμένον τὸ ὄνομά σου
  choice: e louvado e glorificado é o teu nome
  alternative: e o teu nome é digno de louvor e glorificado
  rationale: A ordem escolhida preserva a forma elevada da cláusula nominal doxológica e sua ênfase nos predicados, sem transformá-la numa declaração modal como «deve ser louvado».
translation_notes:
  register: Português moderno, digno e litúrgico, com sintaxe elevada mas inteligível. Emprega-se «tu/teu» de modo coerente com a invocação direta e com ampla legibilidade internacional; a vírgula delimita o vocativo «Senhor». Nenhuma nota é necessária, pois «nossos pais» e «para sempre» comunicam adequadamente o texto grego sem ocultar uma ambiguidade relevante.
