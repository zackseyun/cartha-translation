lexical_decisions:
- source_word: καταισχύνῃς
  choice: cubras de vergonha
  rationale: Expressão portuguesa natural e digna que preserva o sentido de envergonhar ou desonrar, sem intensificá-lo indevidamente.
- source_word: ποίησον μεθʼ ἡμῶν ἔλεος
  choice: age com misericórdia para conosco
  rationale: Reproduz de modo idiomático a construção concreta, literalmente «faze misericórdia conosco», e mantém a ideia de uma ação misericordiosa em favor dos suplicantes.
- source_word: ἐπιείκειάν
  choice: clemência
  rationale: Neste contexto de súplica, comunica com precisão a disposição indulgente, moderada e benigna de Deus, distinguindo-a de ἔλεος.
- source_word: πλῆθος
  choice: abundância
  rationale: Expressa a grande quantidade ou plenitude da misericórdia e forma uma combinação natural em português.
- source_word: ἐλέους
  choice: misericórdia
  rationale: É a correspondência mais adequada no contexto penitencial e preserva a força da súplica; a repetição no versículo reflete a repetição do grego.
theological_decisions:
- issue: Distinção entre as qualidades divinas ἐπιείκεια e ἔλεος
  choice: clemência e misericórdia
  alternative: brandura e compaixão
  rationale: O grego emprega termos relacionados, mas distintos. A tradução mantém a tensão entre a disposição clemente de Deus e a abundância de sua misericórdia, sem fundi-las numa única qualidade.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Para conosco» mantém o tom de oração e a relação expressa por μεθʼ ἡμῶν; «clemência» preserva a distinção lexical do paralelismo.
