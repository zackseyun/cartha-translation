  yaml_path: translation/deuterocanon/prayer_of_azariah/001/036.yaml
  text: Bless the Lord, O heavens; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, ó céus; cantem louvores a ele e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural preserva o sentido de bendizer e a estrutura litúrgica repetitiva do cântico.
- source_word: οὐρανοί
  choice: ó céus
  rationale: O plural é uma invocação direta; «ó céus» mantém o tom poético elevado sem soar antiquado em excesso.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Traduz κύριος pela forma portuguesa convencional «Senhor», sem sugerir que o texto grego contenha diretamente o nome divino hebraico.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Expressa naturalmente tanto o componente musical do verbo quanto seu sentido de louvor.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  rationale: O composto intensivo pede mais do que o simples «exaltem»; a expressão comunica exaltação suprema e conserva a cadência do refrão.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático claro para a expressão de duração perpétua.
theological_decisions:
- issue: Tradução de κύριος em uma invocação hínica deuterocanônica dirigida a Deus
  choice: o Senhor
  alternative: o SENHOR
  rationale: A fonte grega traz κύριον, e não o nome divino hebraico; «o Senhor» evita indicar uma forma YHWH que não aparece diretamente neste testemunho.
translation_notes:
  register: Português moderno, digno e litúrgico, com boa legibilidade brasileira. O paralelismo imperativo e o tom de invocação foram preservados; não são necessárias notas de rodapé.
