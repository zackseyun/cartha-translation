base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/023.yaml
  text: And the king’s attendants who threw them in did not stop feeding the furnace with naphtha and pitch and tow and brushwood[b][a], keeping it burning.
translation:
  language: pt
  text: E os servos do rei que os haviam lançado ali não paravam de alimentar a fornalha com nafta[a], piche, estopa e ramos de videira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “betume”; o termo grego designa uma substância petrolífera altamente inflamável.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διέλειπον
  choice: não paravam
  rationale: O imperfeito com negação expressa ação contínua; esta formulação é natural e preserva esse aspecto.
- source_word: οἱ ἐμβάλλοντες αὐτοὺς
  choice: que os haviam lançado ali
  rationale: O particípio identifica os servos como os mesmos que lançaram os três na fornalha; o mais-que-perfeito composto esclarece a relação com a ação contínua seguinte sem acrescentar conteúdo.
- source_word: ὑπηρέται τοῦ βασιλέως
  choice: os servos do rei
  rationale: Expressa subordinados a serviço do rei sem lhes atribuir um cargo formal específico.
- source_word: καίοντες τὴν κάμινον
  choice: alimentar a fornalha
  rationale: No contexto da lista de combustíveis, o particípio descreve manter a fornalha acesa mediante a adição de combustível; a formulação evita o português pouco natural 'queimar a fornalha'.
- source_word: ἀφθάλτῳ
  choice: nafta
  rationale: Designa uma substância petrolífera altamente inflamável e mantém a distinção em relação ao piche mencionado em seguida.
- source_word: πίσσῃ
  choice: piche
  rationale: Equivalente direto e corrente para o material resinoso combustível indicado pelo grego.
- source_word: στιππύῳ
  choice: estopa
  rationale: Refere-se a fibras grosseiras ou resíduos fibrosos usados como material inflamável; 'estopa' é inteligível e exato em português.
- source_word: κληματίδα
  choice: ramos de videira
  rationale: O termo pode designar especificamente rebentos ou ramos cortados de videira empregados como combustível; a escolha preserva essa concretude lexical.
