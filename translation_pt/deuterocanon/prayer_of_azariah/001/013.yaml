  text: just as you spoke to them[a], saying that their offspring would be multiplied like the stars of heaven in number and like the sand by the shore of the sea.
translation:
  language: pt
  text: assim como lhes falaste, dizendo que multiplicarias a descendência deles[a], tornando-a tão numerosa como as estrelas do céu e como a areia à beira do mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente “semente”, linguagem que retoma a promessa feita aos antepassados. Também pode ser traduzido por “posteridade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησας πρὸς αὐτοὺς
  choice: lhes falaste
  rationale: Expressa com naturalidade a fala dirigida a eles e mantém o tom solene da oração.
- source_word: λέγων
  choice: dizendo
  rationale: Conserva a estrutura participial que introduz o conteúdo da promessa.
- source_word: πολυπληθῦναι τὸ σπέρμα αὐτῶν
  choice: que multiplicarias a descendência deles
  rationale: O futuro do pretérito comunica a força promissória do infinitivo no discurso indireto; “descendência” transmite o sentido coletivo de σπέρμα em português corrente.
- source_word: ὡς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: tornando-a tão numerosa como as estrelas do céu
  rationale: Integra o dativo de quantidade em uma comparação clara e idiomática, sem perder a imagem bíblica.
- source_word: ὡς τὴν ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: como a areia à beira do mar
  rationale: Traduz a expressão literal referente à borda do mar por uma formulação natural e fiel em português.
theological_decisions:
- issue: Linguagem da aliança em σπέρμα na alusão à promessa patriarcal
  choice: descendência, com nota sobre o sentido literal “semente”
  alternative: semente
  rationale: “Descendência” é clara e natural para leitores atuais, enquanto a nota preserva a metáfora original e sua ligação verbal com as promessas ancestrais, sem impor uma interpretação mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o caráter de oração e a alusão bíblica, evitando o calque pouco natural “em número”.
