  text: And the flame spread above the furnace to forty-nine cubits,[a]
translation:
  language: pt
  text: E a chama se estendia acima da fornalha por quarenta e nove côvados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O côvado era uma antiga unidade de comprimento, aproximadamente a distância do cotovelo à ponta dos dedos.
    reason: cultural_note
lexical_decisions:
- source_word: διείχετο
  choice: se estendia
  rationale: O imperfeito médio-passivo descreve a extensão contínua da chama; “se estendia” preserva tanto o aspecto verbal quanto a imagem espacial.
- source_word: ἡ φλὸξ
  choice: a chama
  rationale: Equivalente direto do substantivo grego singular, mantendo a imagem vívida do texto.
- source_word: ἐπάνω τῆς καμίνου
  choice: acima da fornalha
  rationale: A preposição com o genitivo indica posição ou extensão acima da fornalha; esta formulação é clara e natural em português.
- source_word: ἐπὶ πήχεις τεσσαράκοντα ἐννέα
  choice: por quarenta e nove côvados
  rationale: A expressão indica a medida da extensão ou altura da chama. “Por” comunica essa extensão sem determinar além do que o grego explicita, e mantém a unidade antiga.
