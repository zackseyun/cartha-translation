translation:
  language: pt
  text: Saibam que só tu és o Senhor Deus e és glorioso sobre toda a terra habitada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por todo o mundo». O grego οἰκουμένη pode significar «mundo» ou «terra habitada».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώτωσαν
  choice: saibam
  rationale: O imperativo aoristo na terceira pessoa do plural tem força jussiva; «saibam» a preserva de modo direto e natural em português.
- source_word: σὺ
  choice: tu
  rationale: O pronome explícito é mantido para refletir a ênfase do grego e concordar com o contexto de oração.
- source_word: Κύριος θεὸς
  choice: Senhor Deus
  rationale: Mantém os títulos divinos em sua forma reverente e corrente, sem introduzir uma distinção ausente no texto.
- source_word: μόνος
  choice: só tu
  rationale: A posição junto ao pronome comunica naturalmente a exclusividade enfatizada por μόνος.
- source_word: ἔνδοξος
  choice: glorioso
  rationale: Como adjetivo predicativo, descreve a majestade e a glória de Deus, em vez de apenas fama ou honra recebida.
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: sobre toda a terra habitada
  rationale: «Terra habitada» conserva o sentido próprio de οἰκουμένη, enquanto «sobre» preserva a possível noção de extensão ou domínio expressa por ἐπί com acusativo.
theological_decisions:
- issue: Exclusividade divina em μόνος com Κύριος θεὸς
  choice: só tu és o Senhor Deus
  alternative: tu és o único Senhor Deus
  rationale: A formulação escolhida preserva a afirmação monoteísta e a ênfase no destinatário da oração, sem tornar «único» um modificador sintaticamente rígido de apenas um dos títulos.
- issue: Coordenação introduzida por καὶ
  choice: és o Senhor Deus e glorioso
  alternative: és o Senhor Deus, glorioso
  rationale: A conjunção «e» reflete καὶ e conserva os dois predicados coordenados, mesmo que a construção seja mais solene do que a prosa portuguesa comum.
translation_notes:
  register: Português moderno, digno e acessível, com uso de «tu» próprio da oração bíblica e compreensível internacionalmente. A construção coordenada foi mantida próxima do grego para não apagar a relação entre καὶ e ἔνδοξος.
