base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/067.yaml
  text: Bless the Lord[a], all you who fear the Lord, the God of gods; sing praise and give thanks, for his mercy is forever[b], even forever and ever.
translation:
  language: pt
  text: Bendigam o Senhor, todos vocês que reverenciam o Senhor[a], o Deus dos deuses; cantem louvores e deem graças, pois sua misericórdia dura para sempre[b], para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos vocês que adoram o Senhor” ou “todos vocês que temem o Senhor”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pois seu amor leal permanece para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural preserva a força litúrgica de εὐλογέω e a estrutura recorrente do cântico.
- source_word: πάντες οἱ σεβόμενοι τὸν κύριον
  choice: todos vocês que reverenciam o Senhor
  rationale: σέβομαι expressa reverência devota e também pode implicar culto; “reverenciam” traduz o verbo grego com mais precisão do que “temem”, sem sugerir mero medo.
- source_word: κύριον
  choice: Senhor
  rationale: É a forma bíblica corrente e digna para κύριος neste contexto.
- source_word: τὸν θεὸν τῶν θεῶν
  choice: o Deus dos deuses
  rationale: Mantém de modo transparente o título e a construção genitiva do grego.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Preserva a nuance musical específica do verbo, em português natural.
- source_word: ἐξομολογεῖσθε
  choice: deem graças
  rationale: No contexto hínico, o verbo denota ação pública de graças ou louvor; “deem graças” se ajusta à menção seguinte da misericórdia divina.
- source_word: ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ
  choice: pois sua misericórdia dura para sempre
  rationale: “Misericórdia” é a correspondência lexical direta de ἔλεος; “dura para sempre” expressa naturalmente o idioma temporal grego.
- source_word: καὶ εἰς τὸν αἰῶνα τῶν αἰώνων
  choice: para todo o sempre
  rationale: Reproduz em português corrente a intensificação climática da fórmula grega, evitando uma repetição pouco natural.
theological_decisions:
- issue: Sentido de σεβόμενοι no contexto de devoção
  choice: que reverenciam o Senhor
  alternative: que adoram o Senhor; que temem o Senhor
  rationale: O particípio vem de σέβομαι, não de φοβέω. “Reverenciam” mantém a devoção religiosa e preserva a amplitude entre reverência e culto sem introduzir a formulação tradicional baseada em outro verbo grego.
- issue: Sentido de ἔλεος
  choice: misericórdia
  alternative: amor leal
  rationale: Como o texto disponível é grego, “misericórdia” é a tradução mais direta de ἔλεος; “amor leal” continua sendo uma possibilidade contextual legítima.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com imperativos no plural (“bendigam”, “cantem”, “deem”) e tratamento explícito “todos vocês”. A cadência poética é preservada sem recorrer a construções excessivamente arcaicas.
