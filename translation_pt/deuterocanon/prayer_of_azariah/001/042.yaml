base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/042.yaml
  text: Bless the Lord[a], all spirits; sing praise and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, todos os espíritos; cantem-lhe louvores e exaltem-no grandemente para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os ventos”, caso πνεύματα se refira a massas de ar em movimento, e não a seres espirituais.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: Imperativo plural que preserva o sentido litúrgico de bendizer e a estrutura repetida do cântico.
- source_word: πάντα τὰ πνεύματα
  choice: todos os espíritos
  rationale: A expressão funciona como vocativo e designa diretamente espíritos; πνεύματα também pode significar ventos, possibilidade registrada em nota.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Título divino reverente e convencional neste contexto judaico-grego de louvor.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Expressa naturalmente em português tanto o louvor quanto a nuance musical do verbo.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  rationale: Busca conservar a intensificação do verbo composto ὑπερυψόω em linguagem corrente e dignificada.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente português natural da fórmula que indica duração perpétua.
theological_decisions:
- issue: Sentido de πνεύματα no chamado ao louvor
  choice: espíritos
  alternative: ventos
  rationale: O sentido pessoal ou espiritual é a leitura mais direta, mas o termo grego preserva a possibilidade lexical de 'ventos', que não deve ser ocultada.
- issue: Tradução de κύριος como título divino
  choice: o Senhor
  alternative: o Soberano
  rationale: “Senhor” corresponde ao uso reverente consolidado da Septuaginta e não introduz uma interpretação denominacional.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; tom poético e litúrgico, com imperativos no plural e sem regionalismos marcados.
