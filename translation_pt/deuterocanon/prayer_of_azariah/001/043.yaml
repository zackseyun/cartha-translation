base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/043.yaml
  text: Bless the Lord[a], fire and heat; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, fogo e calor[a]; cantem-lhe louvores e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “calor ardente”.
    reason: Registra a intensidade possível de καῦμα sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca os elementos da criação a bendizer o Senhor; a escolha preserva o refrão litúrgico e distingue este verbo dos verbos seguintes de louvor e exaltação.
- source_word: πῦρ
  choice: fogo
  rationale: Correspondência direta e natural para o elemento criado mencionado no texto.
- source_word: καῦμα
  choice: calor
  rationale: Designa calor forte ou ardente; “calor” forma um par claro com “fogo” sem confundir os dois termos.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Tradução corrente de κύριος como título divino, sem introduzir explicitamente o nome divino hebraico ausente do texto grego.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: Expressa a nuance específica de louvar por meio de canto e mantém linguagem clara e atual.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: Preserva a força intensiva do verbo composto sem recorrer a uma formulação pouco natural em português.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático moderno da expressão grega de duração perpétua.
theological_decisions:
- issue: Tradução de κύριος no refrão litúrgico deuterocanônico
  choice: o Senhor
  alternative: o SENHOR
  rationale: “O Senhor” corresponde diretamente ao título presente no grego e evita inserir de modo explícito o nome divino hebraico, que o texto-fonte não apresenta.
translation_notes:
  register: Português moderno, solene e acessível, com imperativos na terceira pessoa do plural, de ampla legibilidade brasileira. A ordem poética do grego foi mantida, e os pronomes enclíticos conservam dignidade litúrgica sem arcaísmo excessivo.
