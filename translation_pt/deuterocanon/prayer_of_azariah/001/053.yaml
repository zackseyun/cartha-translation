base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/053.yaml
  text: Bless the Lord, all things that grow on the earth; sing hymns and highly exalt him forever.
translation:
  language: pt
  text: Todas as coisas que crescem sobre a terra, bendigam o Senhor; cantem hinos e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bendigam
  rationale: Preserva o sentido de falar bem do Senhor e a fórmula litúrgica recorrente do cântico, em vez de reduzi-la ao termo mais geral “louvem”.
- source_word: πάντα τὰ φυόμενα
  choice: todas as coisas que crescem
  rationale: Reproduz a amplitude do particípio substantivado, que abrange aquilo que cresce ou brota, sem restringi-lo explicitamente a “vegetação” ou “plantas”.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Expressa de modo natural o sentido locativo de ἐπί com o genitivo.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Traduz κύριος por “Senhor” e mantém o artigo grego de modo natural em português.
- source_word: ὑμνεῖτε
  choice: cantem hinos
  rationale: Conserva a nuance musical específica do verbo, mais precisa do que o simples “louvem”.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O advérbio transmite a força intensiva do composto verbal sem recorrer a uma construção pouco natural em português.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a expressão portuguesa clara e idiomática para a perpetuidade indicada pela fórmula litúrgica.
theological_decisions:
- issue: Tradução de κύριος na fórmula litúrgica deuterocanônica
  choice: o Senhor
  alternative: Senhor
  rationale: A forma “o Senhor” reflete τὸν κύριον, soa natural em português e não introduz o nome divino onde o texto grego traz κύριος.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural para conservar o chamado dirigido à totalidade das coisas que crescem. A ordem com o vocativo em primeiro lugar favorece clareza e fluidez.
