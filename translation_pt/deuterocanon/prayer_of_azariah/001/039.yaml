base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/039.yaml
  text: Bless the Lord[a], sun and moon; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, sol e lua; cantem-lhe louvores e exaltem-no grandemente para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “pelos séculos”.
    reason: Registra a forma temporal mais literal de εἰς τοὺς αἰῶνας, sem sacrificar a clareza de “para sempre” no texto principal.
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca o sol e a lua a bendizer ou louvar o Senhor. “Bendigam” preserva a forma litúrgica recorrente e continua claro em português.
- source_word: ἥλιος καὶ σελήνη
  choice: sol e lua
  rationale: Os dois astros são interpelados diretamente como vocativos; a formulação sem artigos é natural na linguagem poética portuguesa.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Neste hino judaico, κύριος designa o Deus de Israel. “O Senhor” preserva o uso teológico consagrado sem acrescentar uma convenção tipográfica ausente do grego.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: ὑμνέω indica louvor cantado ou entoado. A expressão torna explícita essa nuance musical em português natural.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O composto intensifica a ideia de exaltar. “Grandemente” comunica essa força sem sugerir necessariamente uma comparação espacial.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: A expressão idiomática indica duração perpétua. “Para sempre” é a formulação moderna mais clara, enquanto a nota registra a forma mais literal.
theological_decisions:
- issue: Tradução de κύριος em contexto hínico deuterocanônico
  choice: o Senhor
  alternative: o SENHOR; o Mestre
  rationale: “O Senhor” identifica adequadamente o referente divino e evita importar para o texto grego a convenção de versaletes ligada à representação do nome divino no hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência litúrgica. A ordem mantém o chamado inicial e o paralelismo dos dois imperativos de louvor.
