  text: Blessed are you in the firmament of heaven, and praised and glorified forever.
translation:
  language: pt
  text: Bendito és no firmamento do céu, louvado e glorificado para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογητός
  choice: Bendito
  rationale: Equivalente tradicional e natural para a fórmula de louvor dirigida a Deus.
- source_word: στερέωμα
  choice: firmamento
  rationale: Preserva a imagem cosmológica do grego e mantém correspondência formal com o termo fonte.
- source_word: ὑμνητός
  choice: digno de louvor
  rationale: O adjetivo verbal indica aquele que deve ou merece ser celebrado em hinos; esta formulação conserva melhor o valor adjetival do que o particípio «louvado».
- source_word: δεδοξασμένος
  choice: glorificado
  rationale: Reproduz o particípio perfeito passivo, expressando Deus como aquele a quem se atribui glória.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Expressão portuguesa corrente e digna para a fórmula idiomática de duração ilimitada.
theological_decisions:
- issue: Valor de ὑμνητός na sequência de predicados
  choice: digno de louvor
  alternative: louvado
  rationale: Mantém a distinção gramatical entre o adjetivo ὑμνητός e o particípio perfeito δεδοξασμένος, sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e solene, com forma de tratamento bíblica em segunda pessoa do singular. A ordem e o paralelismo do grego foram preservados sem tornar a frase artificial.
