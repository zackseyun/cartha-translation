base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/063.yaml
  text: Bless the Lord[a], spirits and souls of the righteous[b]; sing hymns and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor[a], espíritos e almas dos justos; cantem hinos e exaltem-no grandemente para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Louvem o Senhor, espíritos e almas dos justos”.'
    reason: lexical_alternative
  - marker: b
    text: Em grego, “pelos séculos”; trata-se de uma fórmula doxológica que expressa duração contínua ou eterna.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural preserva a força litúrgica e doxológica de εὐλογέω; “louvem” permanece uma alternativa legítima.
- source_word: πνεύματα
  choice: espíritos
  rationale: Mantém o sentido comum do termo e sua distinção deliberada em relação a ψυχαί.
- source_word: ψυχαὶ
  choice: almas
  rationale: Na expressão coordenada com “espíritos”, é a equivalência mais transparente, sem reduzir os dois termos a uma única ideia.
- source_word: δικαίων
  choice: dos justos
  rationale: O genitivo qualifica conjuntamente “espíritos” e “almas”; “dos justos” é natural e preserva o sentido moral e religioso.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: É a tradução consagrada e adequada de κύριος neste contexto litúrgico judaico-grego.
- source_word: ὑμνεῖτε
  choice: cantem hinos
  rationale: Explicita a nuance musical e litúrgica do verbo, mais específica que o simples “louvem”.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: Conserva a intensificação expressa pelo composto grego em português claro, sem introduzir uma comparação ausente no texto.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Comunica naturalmente o valor duradouro da fórmula doxológica; a forma mais literal é registrada em nota.
theological_decisions:
- issue: Associação antropológica de “espíritos” e “almas”
  choice: 'Conservar distintamente os dois termos: “espíritos e almas dos justos”.'
  alternative: Entender a expressão como hendíade (“almas dos justos”) ou vertê-la dinamicamente como “os justos, em espírito e alma”.
  rationale: O grego nomeia explicitamente πνεύματα e ψυχαί. A tradução mantém a dualidade verbal sem impor uma doutrina específica sobre a constituição humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem do grego foi preservada sem sacrificar a naturalidade, e os imperativos plurais concordam com o vocativo composto.
