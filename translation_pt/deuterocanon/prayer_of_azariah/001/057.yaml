base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/057.yaml
  text: Bless the Lord[a], all birds of the sky; sing hymns and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, todas as aves do céu[a]; cantem-lhe hinos e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as criaturas voadoras do céu”.
    reason: πετεινά pode designar especificamente aves ou, de maneira mais ampla, seres que voam.
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural de εὐλογέω convoca as criaturas a bendizer o Senhor. “Bendigam” conserva o tom litúrgico e distingue este verbo do louvor cantado expresso em seguida.
- source_word: πάντα τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: todas as aves do céu
  rationale: πετεινά pode abranger aves ou criaturas voadoras em geral. “Aves do céu” é natural em português, adequado ao catálogo da criação e mantém a possibilidade mais ampla em nota.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Traduz diretamente κύριον como título divino, sem introduzir a forma tipográfica “SENHOR”, que poderia sugerir a presença explícita do Tetragrama no texto grego.
- source_word: ὑμνεῖτε
  choice: cantem-lhe hinos
  rationale: ὑμνέω designa louvor em forma de canto. A formulação preserva a dimensão musical e torna explícito, em português natural, que os hinos são dirigidos ao Senhor.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O composto intensivo indica exaltação em grau elevado. “Grandemente” preserva essa força sem sugerir necessariamente uma comparação ausente do grego.
- source_word: αὐτὸν
  choice: -lhe / -no
  rationale: O pronome retoma “o Senhor”. Em português, os clíticos adequados a cada construção explicitam que tanto os hinos quanto a exaltação se dirigem a ele.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Expressão idiomática de duração perpétua, vertida de modo claro e corrente em português.
theological_decisions:
- issue: Tradução de κύριος na convocação doxológica
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto grego traz κύριον, não o Tetragrama. “O Senhor” traduz o título presente na fonte sem acrescentar uma identificação tipográfica não explicitada por ela.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos na terceira pessoa do plural, forma natural tanto no Brasil quanto em uso internacional. A redação mantém o paralelismo litúrgico e a intensificação do refrão.
