base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/014.yaml
  text: For[a], Master, we have become smaller than all the nations[b], and today we are humbled in all the earth because of our sins.
translation:
  language: pt
  text: Pois, ó Soberano, fomos reduzidos a menos do que todas as nações[a] e hoje estamos humilhados em toda a terra[b] por causa dos nossos pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fomos diminuídos” ou “reduzidos a menos do que todas as nações”. O verbo grego pode indicar redução em número, condição ou importância.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em todo o país”. A palavra grega pode significar “terra” em sentido amplo ou um território.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: ó Soberano
  rationale: O vocativo δεσπότα expressa autoridade absoluta e se distingue de κύριος. “Soberano” preserva essa força em português atual, sem reduzir o título ao mais genérico “Senhor”.
- source_word: ἐσμικρύνθημεν
  choice: fomos reduzidos
  rationale: O aoristo passivo de σμικρύνω indica que o povo foi diminuído, seja em número, condição ou importância. “Fomos reduzidos” mantém a voz passiva e evita limitar a expressão apenas ao tamanho físico.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: abaixo de todas as nações
  rationale: Após a ideia comparativa de ser diminuído, παρά assinala comparação. “Abaixo de” comunica a condição inferior resultante, preservando a referência a todas as nações.
- source_word: ταπεινοὶ
  choice: humilhados
  rationale: O adjetivo descreve aqui uma condição de abatimento e desonra decorrente do juízo, não a virtude voluntária da humildade.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: em toda a terra
  rationale: γῆ pode significar tanto “terra” no sentido local quanto “mundo/terra” em sentido amplo. A formulação portuguesa conserva essa possibilidade sem explicitação indevida.
- source_word: σήμερον
  choice: hoje
  rationale: Equivalente direto, claro e atual do advérbio temporal grego.
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: por causa dos nossos pecados
  rationale: διά com acusativo expressa causa; a tradução preserva claramente a confissão de responsabilidade.
theological_decisions:
- issue: Forma de tratamento divino em δέσποτα
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: “Soberano” mantém a nuance de autoridade absoluta própria de δεσπότης e evita apagar sua distinção lexical em relação a κύριος. “Mestre” poderia sugerir sobretudo professor ou guia no português corrente.
- issue: Natureza do abatimento de Israel
  choice: fomos reduzidos abaixo de todas as nações
  alternative: tornamo-nos menores que todas as nações
  rationale: A tradução mantém aberta a combinação de redução numérica, perda de poder e rebaixamento público, sem restringir o texto a uma única explicação histórica ou teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção “ó Soberano” conserva o tom de oração solene; “por causa dos nossos pecados” expressa a causalidade de modo direto. Os marcadores foram posicionados junto às expressões efetivamente comentadas.
