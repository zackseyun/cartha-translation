base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/061.yaml
  text: Bless the Lord[a], priests[b]; sing hymns and highly exalt him forever.
translation:
  language: pt
  text: Sacerdotes, bendigam o Senhor; cantem hinos e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bendigam
  rationale: O imperativo plural mantém o sentido litúrgico e doxológico de εὐλογέω e preserva a formulação repetida do cântico.
- source_word: ἱερεῖς
  choice: Sacerdotes
  rationale: Vocativo plural que se dirige diretamente ao grupo sacerdotal; a posição inicial produz uma convocação natural em português.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Traduz diretamente o grego κύριος sem introduzir a convenção tipográfica associada ao Tetragrama hebraico.
- source_word: ὑμνεῖτε
  choice: cantem hinos
  rationale: Explicita a dimensão musical própria de ὑμνέω, em vez de reduzi-la ao sentido mais geral de louvar.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O advérbio conserva a força intensiva do verbo composto ὑπερυψόω em português natural.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático moderno da fórmula temporal e doxológica grega.
theological_decisions:
- issue: Tradução de κύριος em uma convocação doxológica
  choice: o Senhor
  alternative: o SENHOR
  rationale: Como a fonte imediata é grega e apresenta κύριος, emprega-se “Senhor” sem importar a convenção de versaletes usada por algumas traduções para o Tetragrama hebraico.
translation_notes:
  register: Português moderno, digno e litúrgico, com boa legibilidade brasileira. Conserva o paralelismo imperativo e a nuance musical de ὑμνεῖτε, sem acrescentar marcas confessionais.
