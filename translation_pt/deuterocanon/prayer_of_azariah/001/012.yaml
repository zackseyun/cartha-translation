base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/012.yaml
  text: And do not withdraw your mercy from us[a], for the sake of Abraham your beloved, and Isaac your servant[b], and Israel your holy one.
translation:
  language: pt
  text: E não retires de nós a tua misericórdia[a], por amor de Abraão, amado por ti, de Isaque, teu servo, e de Israel, o teu santo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não afastes de nós a tua misericórdia”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “Israel” se refere ao patriarca Jacó, chamado por seu nome de aliança.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: retires
  rationale: O verbo ἀφίστημι é transitivo aqui e tem «a tua misericórdia» como objeto. «Retirar» expressa com naturalidade o pedido para que Deus não afaste nem remova sua misericórdia do povo.
- source_word: τὸ ἔλεός
  choice: a tua misericórdia
  rationale: Ἔλεος designa misericórdia ou compaixão. «Misericórdia» é a correspondência tradicional, clara e adequada ao contexto de oração.
- source_word: διὰ
  choice: por amor de
  rationale: Com acusativo, διά apresenta os patriarcas como fundamento do apelo. «Por amor de» comunica em português a força de «por causa de / em consideração a», sem explicitar além do grego a natureza desse fundamento.
- source_word: ἠγαπημένον ὑπὸ σοῦ
  choice: amado por ti
  rationale: A formulação preserva explicitamente a voz passiva do particípio e o agente expresso por ὑπὸ σοῦ, evitando reduzir a frase apenas a um título possessivo.
- source_word: δοῦλόν
  choice: servo
  rationale: Embora δοῦλος também possa significar «escravo», neste título patriarcal o foco recai na relação de serviço fiel a Deus; «servo» é natural e não acentua indevidamente a condição social.
- source_word: ἅγιόν
  choice: o teu santo
  rationale: O adjetivo substantivado singular descreve Israel/Jacó como santo, isto é, separado para Deus. «O teu santo» conserva a forma direta e a tensão do texto sem substituir o nome por uma explicação.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Mantém-se o nome presente no grego, que designa o patriarca Jacó por seu nome de aliança, sem harmonizá-lo para «Jacó».
theological_decisions:
- issue: Sentido de δοῦλος como título de Isaque
  choice: servo
  alternative: escravo
  rationale: Na enumeração reverente dos patriarcas, a função do termo é destacar a pertença e o serviço fiel a Deus. «Escravo» daria destaque excessivo à dimensão soci jurídica que não é central neste contexto.
- issue: Força do apelo patriarcal introduzido por διά
  choice: por amor de Abraão... de Isaque... e de Israel
  alternative: por causa de Abraão... de Isaque... e de Israel
  rationale: «Por amor de» preserva a ideia de um apelo feito em consideração à relação de Deus com os patriarcas, sem definir de modo mais rígido o mecanismo teológico desse apelo.
- issue: Identidade de Israel no versículo
  choice: manter «Israel» e esclarecer em nota que se trata do patriarca Jacó
  alternative: traduzir como «Jacó»
  rationale: O texto grego escolhe intencionalmente o nome Israel. Mantê-lo respeita a forma textual, enquanto a nota evita possível confusão com o povo ou a nação.
translation_notes:
  register: Português atual, reverente e amplamente compreensível, com colocação pronominal natural e paralelismo preservado. A expressão «o teu santo» mantém a concisão e a estranheza significativa do grego; a nota identifica Israel sem alterar o texto principal.
