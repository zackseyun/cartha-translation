base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/062.yaml
  text: Bless the Lord[a], slaves[b]; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Escravos[a], bendigam o Senhor; cantem-lhe louvores e exaltem-no grandemente para sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O grego δοῦλοι pode designar tanto pessoas que servem em geral quanto pessoas em condição de escravidão; o texto principal mantém o sentido mais forte.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para os séculos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bendigam
  rationale: O imperativo plural de εὐλογέω, em uma convocação litúrgica, pede que os adoradores bendigam a Deus. “Bendigam” preserva tanto o sentido lexical quanto o tom tradicional e distinto de ὑμνεῖτε.
- source_word: δοῦλοι
  choice: escravos
  rationale: δοῦλοι pode designar servos ou pessoas em condição de escravidão. “Escravos” conserva no texto principal a ideia mais forte de pertencimento e sujeição total, enquanto “servos” é registrado como alternativa contextual legítima.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Neste contexto doxológico, κύριος funciona como título divino; “o Senhor” é a forma portuguesa natural e consagrada.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: ὑμνέω indica louvar por meio de hinos ou canto. A formulação explicita a nuance musical e soa natural em português.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O composto intensifica a ação de exaltar. “Grandemente” comunica essa intensificação sem recorrer a uma construção artificial.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: A expressão idiomática indica duração perpétua. “Para sempre” é o equivalente corrente e claro, enquanto a forma mais literal é preservada em nota.
theological_decisions:
- issue: Tradução de δοῦλοι como designação dos adoradores de Deus
  choice: escravos
  alternative: servos
  rationale: A convocação apresenta pessoas inteiramente sujeitas e pertencentes ao Senhor. O texto principal mantém o sentido social e teologicamente mais forte de δοῦλοι, sem negar que “servos” também seja possível neste contexto litúrgico; a alternativa consta em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. A colocação inicial do vocativo “Escravos” torna clara a sintaxe e evita que o termo seja confundido com objeto de “bendigam”. “Cantem-lhe louvores” mantém o caráter musical do verbo grego.
