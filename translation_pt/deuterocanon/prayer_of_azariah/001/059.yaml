base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/059.yaml
  text: Bless the Lord[a], sons of men; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, filhos dos homens[a]; cantem louvores a ele e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos da humanidade” ou “seres humanos”. O grego diz literalmente “filhos dos homens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural de εὐλογέω mantém a força litúrgica e doxológica de convocar os seres humanos a bendizer o Senhor.
- source_word: οἱ υἱοὶ τῶν ἀνθρώπων
  choice: filhos dos homens
  rationale: Preserva a forma masculina e o conhecido idioma bíblico do grego, embora a expressão se refira coletivamente aos seres humanos.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Equivalente português natural de κύριος neste contexto de louvor deuterocanônico.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Expressa de modo claro a dimensão musical e doxológica de ὑμνέω.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  rationale: A formulação comunica a intensificação presente no composto ὑπερυψόω, com linguagem portuguesa natural e dignificada.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É o equivalente idiomático corrente da fórmula doxológica, que indica duração perpétua.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto grego apresenta κύριος; “o Senhor” o traduz diretamente sem introduzir no corpo do texto uma reconstrução tipográfica do nome divino.
- issue: Expressão antropológica masculina
  choice: filhos dos homens
  alternative: seres humanos
  rationale: A tradução principal preserva a formulação masculina explícita e o idioma bíblico, enquanto a nota esclarece seu alcance coletivo.
- issue: Força intensiva de ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  alternative: exaltem-no grandemente
  rationale: A opção escolhida conserva a noção superlativa do verbo composto sem transformar a exortação em afirmação metafísica mais específica.
translation_notes:
  register: Português moderno, amplo e dignificado, com imperativos no plural. A sintaxe mantém o paralelismo litúrgico do original e usa “cantem louvores” para explicitar naturalmente o valor musical de ὑμνεῖτε.
