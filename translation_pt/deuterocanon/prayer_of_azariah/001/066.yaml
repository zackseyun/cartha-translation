base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/066.yaml
  text: Give thanks to the Lord[a], for he is good, for his mercy endures forever.
translation:
  language: pt
  text: Deem graças ao Senhor, porque ele é bom, porque a sua misericórdia dura para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o seu amor leal dura para sempre”. O grego diz literalmente “a sua misericórdia é para sempre”, mas, neste refrão litúrgico, a expressão pode também evocar amor constante e leal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Deem graças
  rationale: Neste refrão litúrgico, o verbo tem o sentido de agradecer ou louvar, não de confessar pecados.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Traduz diretamente κύριος com a forma portuguesa consagrada, sem substituir o termo grego pelo nome divino hebraico.
- source_word: χρηστός
  choice: bom
  rationale: No refrão doxológico, “bom” é natural e preserva o sentido de bondade e benevolência.
- source_word: εἰς τὸν αἰῶνα
  choice: dura para sempre
  rationale: A expressão significa permanência sem fim; como a oração grega não traz verbo explícito, “dura” produz uma formulação portuguesa natural.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: a sua misericórdia
  rationale: ἔλεος designa diretamente misericórdia, embora neste contexto litúrgico possa também evocar amor leal.
theological_decisions:
- issue: Amplitude pactual de ἔλεος no refrão litúrgico
  choice: a sua misericórdia dura para sempre
  alternative: o seu amor leal dura para sempre
  rationale: O texto principal mantém o sentido lexical direto do grego, enquanto a nota preserva a possível conotação mais ampla de lealdade amorosa sem impô-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “porque” preserva a estrutura enfática do grego.
