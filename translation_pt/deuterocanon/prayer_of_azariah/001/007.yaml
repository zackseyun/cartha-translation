  text: And we have not obeyed the commands of your law, nor kept them, nor done as you commanded us, so that it might go well with us.
translation:
  language: pt
  text: Não obedecemos aos mandamentos da tua lei, nem os guardamos, nem fizemos conforme nos ordenaste, para que nos fosse bem.
