lexical_decisions:
- source_word: ἐντολῶν τοῦ νόμου σου
  choice: mandamentos da tua lei
  rationale: “Mandamentos” é a forma natural e digna de expressar ἐντολαί neste contexto, preservando sua ligação explícita com a lei de Deus.
- source_word: ὑπηκούσαμεν
  choice: obedecemos
  rationale: Traduz diretamente a ideia de dar ouvidos e submeter-se ao que foi ordenado.
- source_word: συνετηρήσαμεν
  choice: os guardamos
  rationale: Mantém a linguagem bíblica corrente de observar e cumprir mandamentos; o pronome retoma claramente “mandamentos”.
- source_word: εὖ ἡμῖν γένηται
  choice: tudo nos corresse bem
  rationale: Expressa em português natural o sentido de que as coisas fossem bem para nós.
theological_decisions:
- issue: Relação entre obediência e bem-estar na oração
  choice: para que tudo nos corresse bem
  alternative: de modo que tudo nos corresse bem
  rationale: A oração grega com ἵνα pode indicar finalidade ou resultado. “Para que” preserva a formulação final sem acrescentar uma explicação teológica sobre a relação entre obediência e bênção.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A repetição “nem... nem...” preserva a cadência confessional do grego.
