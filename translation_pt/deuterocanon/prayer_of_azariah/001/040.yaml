base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/040.yaml
  text: Bless the Lord, stars of heaven; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, estrelas do céu; cantem louvores a ele e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural preserva a convocação litúrgica dirigida às estrelas e distingue este verbo dos demais termos de louvor no verso.
- source_word: ἄστρα τοῦ οὐρανοῦ
  choice: estrelas do céu
  rationale: Traduz diretamente o substantivo específico ἄστρα e o genitivo singular τοῦ οὐρανοῦ em português natural e elevado.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Neste contexto doxológico, κύριος funciona como título divino; “o Senhor” é a forma corrente e não acrescenta a convenção tipográfica ligada ao nome divino hebraico.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Expressa tanto o componente musical de ὑμνέω quanto seu sentido de louvor, em linguagem moderna e clara.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  rationale: O composto intensivo indica exaltação superlativa. A expressão conserva essa força sem recorrer ao pouco idiomático “superexaltem”.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático da fórmula temporal litúrgica, que aqui comunica duração perpétua.
theological_decisions:
- issue: Tradução de κύριος numa exortação hínica deuterocanônica dirigida a Deus
  choice: o Senhor
  alternative: o SENHOR; o Soberano
  rationale: O texto grego traz κύριον. “O Senhor” traduz o título diretamente, enquanto “o SENHOR” importaria uma convenção referente ao nome divino hebraico que este testemunho grego não explicita.
- issue: Força intensiva de ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  alternative: exaltem-no grandemente; superexaltem-no
  rationale: A opção mantém a intensidade superlativa do verbo composto e a tensão própria da linguagem poética, sem transformar a expressão em uma formulação doutrinária técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos na terceira pessoa do plural. A cadência paralela e litúrgica foi preservada, assim como a distinção entre “bendizer”, “cantar louvores” e “exaltar”.
