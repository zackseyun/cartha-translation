  text: E livra-nos segundo as tuas maravilhas e dá glória ao teu nome, ó Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελοῦ
  choice: livra-nos
  rationale: O imperativo aoristo de ἐξαιρέω, neste contexto de oração, pede uma intervenção salvadora. “Livra-nos” é natural, digno e preserva o sentido de resgate.
- source_word: κατὰ τὰ θαυμάσιά σου
  choice: segundo as tuas maravilhas
  rationale: 'κατά com acusativo expressa aqui conformidade ou correspondência: “segundo”, “de acordo com”. “Maravilhas” preserva de modo conciso a referência aos atos extraordinários de Deus sem explicitar além do grego.'
- source_word: δὸς δόξαν
  choice: dá glória
  rationale: A tradução direta conserva o imperativo e o objeto do grego, bem como a tensão do idioma bíblico, sem reinterpretá-lo como “traz glória” ou “glorifica”.
- source_word: τῷ ὀνόματί σου
  choice: ao teu nome
  rationale: Preserva o idioma bíblico em que o nome de Deus recebe honra e representa sua identidade revelada, sem reduzi-lo a “reputação”.
- source_word: Κύριε
  choice: ó Senhor
  rationale: O vocativo é representado por uma forma corrente e solene de invocação direta em português.
theological_decisions:
- issue: Sentido de “dar glória” ao nome divino
  choice: dá glória ao teu nome
  alternative: traz glória ao teu nome
  rationale: A formulação escolhida mantém o idioma e a aparente tensão do texto grego, sem resolver interpretativamente quem dará essa glória ou de que modo ela se manifestará.
- issue: Tradução de κύριε
  choice: ó Senhor
  alternative: Senhor
  rationale: “Ó Senhor” assinala claramente a invocação direta a Deus e conserva o tom de oração, sem introduzir uma interpretação denominacional.
- issue: Sentido teológico do “nome” divino
  choice: ao teu nome
  alternative: à tua reputação
  rationale: A tradução conserva a amplitude bíblica do “nome” como portador da honra e da identidade revelada de Deus, em vez de restringi-lo à ideia de reputação.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. Mantêm-se o paralelismo da oração e o idioma bíblico do original; não são necessárias notas para esta redação.
