base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/031.yaml
  text: Blessed are you[a], who look upon the depths, seated upon the cherubim[b], and praised and highly exalted forever.
translation:
  language: pt
  text: Bendito és tu, que contemplas as profundezas[a], sentado sobre os querubins[b], digno de louvor e sumamente exaltado para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os abismos”. A expressão evoca o abismo cósmico.
    reason: lexical_alternative
  - marker: b
    text: Ou “entronizado acima dos querubins”. O grego diz mais literalmente “sentado sobre os querubins”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος εἶ
  choice: Bendito és tu
  rationale: Reproduz a fórmula litúrgica de bênção dirigida diretamente a Deus, mantendo a segunda pessoa explícita e um registro digno.
- source_word: ὁ ἐπιβλέπων
  choice: que contemplas
  rationale: Conserva o sentido visual do particípio presente sem acrescentar a ideia de cuidado providencial, que não é exigida pelo grego.
- source_word: ἀβύσσους
  choice: as profundezas
  rationale: Expressão natural em português que preserva a imagem das regiões abissais ou do abismo cósmico; o plural do original é mantido.
- source_word: καθήμενος
  choice: sentado
  rationale: Traduz diretamente o particípio, evitando explicitar 'entronizado', embora essa imagem régia possa estar implícita.
- source_word: ἐπὶ χερουβεὶν
  choice: sobre os querubins
  rationale: Reflete naturalmente ἐπί e conserva a tradicional imagem bíblica da presença divina associada aos querubins.
- source_word: αἰνετὸς
  choice: digno de louvor
  rationale: Expressa o valor adjetival de alguém que merece louvor, em vez de indicar apenas que está sendo louvado.
- source_word: ὑπερυψούμενος
  choice: sumamente exaltado
  rationale: Comunica a elevação intensificada do verbo composto em linguagem doxológica natural.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente português claro e convencional da fórmula doxológica que indica duração perpétua.
theological_decisions:
- issue: Imagem do trono divino em relação aos querubins
  choice: sentado sobre os querubins
  alternative: entronizado acima dos querubins
  rationale: A tradução escolhida segue mais de perto καθήμενος ἐπὶ χερουβεὶν e não introduz explicitamente a noção de trono, embora ela pertença ao pano de fundo bíblico da expressão.
- issue: Valor de αἰνετὸς na doxologia
  choice: digno de louvor
  alternative: louvado
  rationale: 'A escolha preserva o caráter adjetival e avaliativo do termo: Deus merece louvor. A alternativa pode sugerir mais diretamente o ato de louvar, sem ser impossível no contexto.'
translation_notes:
  register: Português moderno, claro e solene, com cadência litúrgica. Emprega-se “tu” por se tratar de uma invocação direta a Deus; evitam-se arcaísmos além da construção consagrada e ainda inteligível “Bendito és tu”.
