base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/048.yaml
  text: Bless the Lord, nights and days; sing praise and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, noites e dias; cantem-lhe louvores e exaltem-no sobremaneira para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural preserva o chamado litúrgico dirigido às noites e aos dias. “Bendigam” mantém a ressonância bíblica de εὐλογέω e evita confundi-lo com ὑμνεῖτε, que expressa louvor cantado.
- source_word: νύκτες καὶ ἡμέραι
  choice: noites e dias
  rationale: Mantém os substantivos no plural e a personificação poética do original, no qual noites e dias são diretamente convocados a louvar.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: É o equivalente natural de κύριος neste contexto doxológico grego, sem introduzir a convenção tipográfica associada à representação explícita do tetragrama hebraico.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: Expressa de maneira natural em português a nuance de louvor entoado ou cantado. O pronome retoma “o Senhor”, objeto comum das exortações.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no sobremaneira
  rationale: “Sobremaneira” conserva a força intensiva do composto ὑπερυψόω sem recorrer a uma formulação pouco natural.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Neste refrão litúrgico, a expressão idiomática indica duração perpétua; “para sempre” é claro, corrente e fiel ao sentido.
theological_decisions:
- issue: Tradução de κύριος em uma doxologia litúrgica
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto-fonte traz o grego κύριος. “O Senhor” preserva diretamente esse testemunho e não pressupõe que seja necessário sinalizar aqui, por meio de versaletes, uma representação explícita do nome divino hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas verbais brasileiras correntes. A ordem vocativa “noites e dias” e o paralelismo imperativo preservam o caráter poético e litúrgico do verso.
