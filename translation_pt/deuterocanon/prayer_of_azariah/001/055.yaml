base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/055.yaml
  text: Bless the Lord, seas and rivers; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, mares e rios; cantem-lhe louvores e exaltem-no sobremaneira para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural dirige aos elementos da criação o chamado litúrgico para bendizer o Senhor, preservando a construção com objeto direto.
- source_word: θάλασσαι
  choice: mares
  rationale: Mantém o plural grego e a personificação poética de diferentes extensões de água salgada.
- source_word: ποταμοί
  choice: rios
  rationale: É o equivalente português direto e natural, formando o par poético «mares e rios».
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: κύριος funciona aqui como título divino; «o Senhor» é a forma portuguesa consagrada e diretamente fundamentada no texto grego.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: Explicita a nuance musical do verbo, que denota louvar por meio de hino ou canto, em português corrente e digno.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no sobremaneira
  rationale: «Sobremaneira» preserva a força intensificadora do composto grego sem recorrer a uma expressão pouco natural.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a formulação portuguesa idiomática para a duração ilimitada expressa pelo refrão.
theological_decisions:
- issue: Tradução de κύριος como título divino
  choice: o Senhor
  alternative: o SENHOR; o senhor
  rationale: O texto grego traz κύριον, não o tetragrama; «o Senhor» preserva o título divino sem introduzir uma distinção tipográfica que não está explícita na fonte.
translation_notes:
  register: Português moderno, claro e litúrgico, com imperativos no plural. A redação conserva o paralelismo e a personificação poética da criação, além da intensidade de ὑπερυψοῦτε.
