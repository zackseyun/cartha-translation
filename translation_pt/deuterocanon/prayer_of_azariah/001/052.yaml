base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/052.yaml
  text: Bless the Lord, mountains and hills; sing praise and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, montes e colinas; cantem louvores e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca a criação a bendizer o Senhor. “Bendigam” preserva o sentido litúrgico e distingue este verbo dos verbos de louvor que vêm em seguida.
- source_word: ὄρη καὶ βουνοί
  choice: montes e colinas
  rationale: Reproduz de modo claro e natural o par de acidentes geográficos e conserva o paralelismo poético.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Traduz diretamente o grego κύριον e mantém o registro doxológico sem introduzir a convenção tipográfica ligada ao nome divino hebraico.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Expressa explicitamente a dimensão musical do verbo, de forma mais natural em português do que um verbo derivado de “hino”.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O advérbio preserva a força intensificadora do composto grego, que vai além do simples “exaltar”, sem tornar a frase obscura.
- source_word: αὐτὸν
  choice: -no
  rationale: O pronome retoma “o Senhor” como objeto direto; a forma enclítica é clara e adequada ao registro poético.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a expressão portuguesa corrente para a duração perpétua indicada pela fórmula grega e mantém a cadência do refrão.
theological_decisions:
- issue: Tradução de κύριος em contexto doxológico
  choice: o Senhor
  alternative: o SENHOR
  rationale: A fonte traz o grego κύριον. “O Senhor” traduz o termo sem importar para este contexto grego a convenção de versaletes usada em traduções do nome divino hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas imperativas na terceira pessoa do plural. A ordem vocativa após o objeto mantém clareza e cadência poética.
