base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/015.yaml
  text: And at this time there is no ruler or prophet or leader, no whole burnt offering or sacrifice or offering or incense, and no place to bring firstfruits before you and to find mercy.
translation:
  language: pt
  text: E, neste tempo, não há governante, nem profeta, nem líder; não há oferta queimada por inteiro, nem sacrifício, nem oferta, nem incenso, nem lugar para apresentar os primeiros frutos[a] diante de ti e encontrar misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferecer frutos” ou “apresentar produtos da terra diante de ti”. A expressão grega é incomum; “apresentar os primeiros frutos” reflete o contexto cúltico dos termos ao redor.
    reason: Alternativa lexical para τοῦ καρπῶσαι, cuja referência exata não é inteiramente segura.
lexical_decisions:
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: neste tempo
  rationale: Preserva a referência temporal imediata do lamento em português natural e digno.
- source_word: ἄρχων
  choice: governante
  rationale: Expressa de modo amplo alguém investido de autoridade pública e distingue o termo de ἡγούμενος.
- source_word: προφήτης
  choice: profeta
  rationale: Equivalente português padrão, claro e preciso.
- source_word: ἡγούμενος
  choice: líder
  rationale: Mantém a distinção em relação a ἄρχων sem especificar indevidamente um cargo político ou militar.
- source_word: ὁλοκαύτωσις
  choice: oferta queimada por inteiro
  rationale: Torna explícito que a oferta era inteiramente consumida pelo fogo e evita a possível ambiguidade moderna de “holocausto”.
- source_word: θυσία
  choice: sacrifício
  rationale: Equivalente geral e natural para o termo cúltico.
- source_word: προσφορά
  choice: oferta
  rationale: Designa com clareza algo apresentado a Deus, sem recorrer a vocabulário eclesiástico especializado.
- source_word: θυμίαμα
  choice: incenso
  rationale: Forma concisa e corrente para o elemento cúltico mencionado.
- source_word: τοῦ καρπῶσαι
  choice: para apresentar os primeiros frutos
  rationale: O contexto de sacrifícios e ofertas favorece o sentido cúltico ligado à apresentação de produtos da terra ou primícias, embora a expressão grega seja incomum; a nota preserva alternativas legítimas.
- source_word: ἐνώπιόν σου
  choice: diante de ti
  rationale: Preserva de maneira idiomática o sentido relacional e cúltico da presença divina.
- source_word: εὑρεῖν ἔλεος
  choice: encontrar misericórdia
  rationale: Mantém a imagem verbal e a conhecida expressão bíblica do grego.
theological_decisions:
- issue: Sequência de termos cúlticos no contexto da perda do templo
  choice: Manter distintos todos os tipos de autoridade e de culto ausentes.
  alternative: Resumir a lista como “não há autoridades nem sacrifícios”.
  rationale: A enumeração completa intensifica o lamento pela privação tanto de liderança quanto do culto no templo; condensá-la apagaria distinções presentes no texto.
- issue: Sentido de τοῦ καρπῶσαι
  choice: “apresentar os primeiros frutos”, com nota de alternativa lexical.
  alternative: “fazer uma oferta” ou “apresentar produtos da terra”.
  rationale: O vocabulário sacrificial ao redor favorece uma referência cúltica a frutos ou primícias, mas a raridade da expressão não permite eliminar totalmente um sentido mais geral.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece solene sem arcaísmos. A repetição de “nem” conserva a força cumulativa do lamento grego; o ponto e vírgula separa com clareza a ausência de autoridades da ausência dos elementos de culto.
