base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/021.yaml
  text: And let all who show evil to your slaves be put to shame[a], and let them be disgraced from all their dominion[c][b], and let their strength be broken.
translation:
  language: pt
  text: Que sejam envergonhados todos os que fazem o mal aos teus escravos[a], que sejam desonrados em todo o seu poderio[b], e que a força deles seja despedaçada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teus servos”. O grego usa δοῦλοι, termo que ressalta o pertencimento a um senhor.
    reason: alternative_reading
  - marker: b
    text: A expressão grega também pode ser entendida como “por causa de todo o seu domínio” ou, de modo mais interpretativo, “privados de todo o seu domínio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντραπείησαν
  choice: sejam envergonhados
  rationale: O optativo aoristo passivo expressa um pedido ou desejo. “Sejam envergonhados” comunica vergonha imposta e preserva a voz passiva.
- source_word: οἱ ἐνδεικνύμενοι ... κακά
  choice: os que fazem o mal
  rationale: A expressão grega indica pessoas que manifestam ou praticam males contra alguém. “Fazem o mal” é natural em português e mantém a amplitude moral de κακά sem restringi-lo apenas a dano físico.
- source_word: τοῖς δούλοις σου
  choice: aos teus escravos
  rationale: δοῦλος designa propriamente alguém que pertence a um senhor. “Escravos” preserva aqui a ênfase forte no pertencimento a Deus; “servos” é uma alternativa tradicional e mais idiomática.
- source_word: καταισχυνθείησαν
  choice: sejam desonrados
  rationale: A escolha distingue este verbo de ἐντραπείησαν e conserva o paralelismo, destacando a perda pública de honra.
- source_word: ἀπὸ πάσης τῆς δυναστείας
  choice: em todo o seu poderio
  rationale: δυναστεία pode indicar domínio, poder governante ou poderio. A preposição ἀπό torna a relação sintática incomum; a formulação adotada expressa a esfera em que sobrevém a desonra sem introduzir explicitamente a ideia de tirania.
- source_word: ἡ ἰσχὺς αὐτῶν
  choice: a força deles
  rationale: Tradução direta que mantém a referência explícita aos adversários e o paralelo com o poderio mencionado antes.
- source_word: συντριβείη
  choice: seja despedaçada
  rationale: O verbo contém a imagem vigorosa de quebrar ou esmagar. “Despedaçada” preserva essa força e continua a sequência de pedidos expressa pelos optativos.
theological_decisions:
- issue: Tradução de δοῦλοι em relação a Deus
  choice: teus escravos
  alternative: teus servos
  rationale: A tradução principal mantém a força social e relacional de δοῦλος, enfatizando que essas pessoas pertencem a Deus. A alternativa tradicional é registrada sem substituir silenciosamente essa nuance.
- issue: Relação entre a desonra dos inimigos e seu poder
  choice: desonrados em todo o seu poderio
  alternative: desonrados e privados de todo o seu domínio
  rationale: O grego com ἀπό admite mais de uma compreensão. A tradução principal evita afirmar de modo inequívoco que o domínio lhes será retirado, pois essa consequência, embora possível, não está explicitada por um verbo de privação.
translation_notes:
  register: Português atual, digno e de leitura ampla, com a repetição de “que” para reproduzir com clareza a sequência de pedidos. “Poderio” conserva o tom elevado sem soar arcaico; “escravos” é deliberadamente forte, enquanto a alternativa “servos” aparece em nota.
