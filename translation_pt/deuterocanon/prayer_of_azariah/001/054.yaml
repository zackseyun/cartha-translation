  text: Bless the Lord, rains and springs; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, chuvas e fontes; cantem-lhe louvores e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca elementos da criação a honrar o Senhor em linguagem doxológica e preserva o refrão litúrgico mais precisamente que o simples verbo “louvem”.
- source_word: ὄμβροι
  choice: chuvas
  rationale: Mantém o plural grego e designa de modo natural a chuva proveniente do céu.
- source_word: πηγαί
  choice: fontes
  rationale: Designa nascentes ou fontes naturais de água; “fontes” é corrente e apropriado ao catálogo da criação.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Reproduz o artigo e o título divino do texto grego, sem importar convenções tipográficas próprias de textos hebraicos.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Expressa tanto a ação de louvar quanto a dimensão musical do verbo grego.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  rationale: Comunica a forte intensificação presente no verbo composto, em português natural e solene.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático claro para a expressão grega de duração perpétua.
theological_decisions:
- issue: Tradução de κύριος em um hino deuterocanônico dirigido ao Deus de Israel
  choice: o Senhor
  alternative: Senhor
  rationale: Preserva o refrão litúrgico e o artigo grego sem adotar a convenção de versaletes associada ao Tetragrama em textos de fonte hebraica.
translation_notes:
  register: Português moderno, digno e litúrgico, com imperativos no plural e legibilidade ampla, especialmente brasileira. A coordenação e o paralelismo do grego foram preservados.
