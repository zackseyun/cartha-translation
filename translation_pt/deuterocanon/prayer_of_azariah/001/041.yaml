base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/041.yaml
  text: Bless the Lord[a], all rain and dew; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, todas as chuvas e todo o orvalho[a]; cantem-lhe louvores e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega também pode ser entendida de modo distributivo: “cada chuva e cada orvalho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca os elementos da criação a bendizer o Senhor e preserva a fórmula litúrgica repetida.
- source_word: πᾶς ὄμβρος καὶ δρόσος
  choice: todas as chuvas e todo o orvalho
  rationale: A formulação portuguesa é natural e trata chuva e orvalho como classes de fenômenos, sem perder a possível força coletiva ou distributiva de πᾶς.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Traduz κύριος diretamente e mantém o registro devocional do cântico sem inserir no texto grego uma grafia representativa do nome divino.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: Expressa tanto o louvor quanto a nuance musical do verbo ὑμνέω; o pronome retoma o Senhor com clareza.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O advérbio comunica a intensificação presente no composto verbal sem sugerir uma comparação ausente no grego.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a forma portuguesa corrente e digna para o valor idiomático duradouro da expressão.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto grego traz κύριον; “o Senhor” traduz o termo diretamente, enquanto “o SENHOR” poderia impor uma identificação gráfica explícita com o nome divino que não aparece na forma grega.
translation_notes:
  register: Português moderno, claro e litúrgico, com imperativos no plural e paralelismo entre “cantem-lhe louvores” e “exaltem-no”. A flexão “todas as chuvas e todo o orvalho” torna natural em português a referência conjunta aos dois fenômenos.
