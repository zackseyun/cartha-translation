  text: And he made the inside of the furnace like a whistling dew-laden wind[a], and the fire did not touch them at all, nor did it distress or trouble them.
translation:
  language: pt
  text: E ele fez o interior da fornalha ficar como um vento carregado de orvalho que soprava assobiando[a]; o fogo não os tocou de modo algum, nem lhes causou sofrimento nem os incomodou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um vento orvalhado” ou “como um espírito de orvalho”. A palavra grega πνεῦμα pode significar “vento”, “sopro” ou “espírito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησε
  choice: fez ... ficar
  rationale: Expressa naturalmente em português que o agente levou o interior da fornalha a assumir a condição descrita, sem especificar o mecanismo.
- source_word: τὸ μέσον τῆς καμίνου
  choice: o interior da fornalha
  rationale: Transmite o sentido espacial de μέσον neste contexto com linguagem moderna e clara.
- source_word: ὡς πνεῦμα δρόσου
  choice: como um vento carregado de orvalho
  rationale: Mantém a imagem concreta e refrescante; πνεῦμα admite 'vento', 'sopro' ou 'espírito', enquanto δρόσου indica orvalho.
- source_word: διασυρίζον
  choice: que soprava assobiando
  rationale: Preserva tanto o movimento quanto a dimensão sonora vívida sugerida pelo particípio.
- source_word: οὐχ ἥψατο αὐτῶν ... τὸ καθόλου
  choice: não os tocou de modo algum
  rationale: Reproduz o sentido direto de ἅπτομαι e a ênfase absoluta de τὸ καθόλου.
- source_word: ἐλύπησεν
  choice: causou dor
  rationale: Abrange o sofrimento ou aflição produzidos pelo fogo sem limitar indevidamente o verbo a tristeza emocional.
- source_word: παρηνώχλησεν
  choice: incômodo
  rationale: Comunica perturbação ou dano adicional e preserva a dupla negação grega em português natural.
theological_decisions:
- issue: Referente do sujeito implícito de ἐποίησε
  choice: Manter o pronome 'ele' sem identificar expressamente o agente.
  alternative: Explicitar 'Deus' ou 'o anjo'.
  rationale: O grego apresenta um sujeito singular recuperável do contexto, mas não o nomeia neste versículo; a tradução preserva essa referência discursiva sem resolver a possível tensão.
- issue: Sentido de πνεῦμα no cenário milagroso
  choice: vento
  alternative: sopro ou espírito
  rationale: A imagem imediata descreve uma corrente refrescante dentro da fornalha. 'Vento' se ajusta bem ao fenômeno físico, enquanto a nota registra a polissemia do termo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A formulação conserva a imagem sensorial do grego e sua ambiguidade lexical relevante.
