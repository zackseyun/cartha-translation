base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/030.yaml
  text: Blessed are you in the temple of your holy glory, and highly praised and exceedingly glorious forever.
translation:
  language: pt
  text: Bendito és tu no templo da tua santa glória, altamente louvado e supremamente glorioso para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος
  choice: Bendito
  rationale: Mantém a fórmula litúrgica de louvor dirigida a Deus e concorda naturalmente com «és tu».
- source_word: ἐν τῷ ναῷ τῆς ἁγίας δόξης σου
  choice: no templo da tua santa glória
  rationale: Reproduz de perto a construção genitiva grega, sem decidir se a glória qualifica o templo ou designa a presença divina nele.
- source_word: ὑπερυμνητός
  choice: digno dos mais altos louvores
  rationale: Expressa o sentido intensivo de algo ou alguém que deve ser exaltado em cânticos e louvores; evita a forma pouco natural «superlouvado».
- source_word: ὑπερένδοξος
  choice: supremamente glorioso
  rationale: Preserva o caráter adjetival do grego e sua forte intensificação, em vez de convertê-lo no passivo «glorificado».
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático e liturgicamente natural para a expressão temporal grega.
theological_decisions:
- issue: Sentido de ὑπερένδοξος
  choice: supremamente glorioso
  alternative: grandemente glorificado
  rationale: O termo grego é adjetival e descreve a glória extraordinária de Deus; a alternativa passiva poderia deslocar o foco para o ato de criaturas o glorificarem.
- issue: Relação entre templo, santidade e glória
  choice: no templo da tua santa glória
  alternative: no teu templo santo e glorioso
  rationale: A tradução escolhida conserva a estrutura e a possível tensão semântica do original, sem transformar os genitivos em dois adjetivos coordenados.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência apropriada a uma doxologia. A formulação combina proximidade formal no primeiro membro com equivalência idiomática nos adjetivos intensivos.
