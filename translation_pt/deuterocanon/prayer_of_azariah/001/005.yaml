base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/005.yaml
  text: And you have executed true judgments in all that you have brought upon us and upon your holy city[a], Jerusalem, the city of our fathers; for in truth and judgment you have done all these things because of our sins.
translation:
  language: pt
  text: E executaste juízos verdadeiros em tudo o que trouxeste sobre nós e sobre a tua santa cidade, Jerusalém, a cidade dos nossos antepassados; pois, em verdade e juízo[a], fizeste todas estas coisas por causa dos nossos pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com verdade e justiça”. O termo grego traduzido por “juízo” também pode expressar “justiça”; “juízo” foi mantido para preservar a repetição da linguagem judicial neste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματα ἀληθείας
  choice: juízos verdadeiros
  rationale: 'Preserva o caráter judicial de κρίματα e entende o genitivo ἀληθείας como qualificação dos juízos: conformes à verdade. A expressão é clara e digna em português.'
- source_word: ἐποίησας
  choice: executaste / fizeste
  rationale: 'A variação é determinada pelo objeto: com κρίματα, “executaste” comunica a realização de atos judiciais; com πάντα ταῦτα, “fizeste” é a formulação natural.'
- source_word: κατὰ πάντα ἃ ἐπήγαγες ἡμῖν
  choice: em tudo o que trouxeste sobre nós
  rationale: ἐπάγω indica fazer vir ou trazer algo, especialmente uma calamidade ou punição. “Trouxeste sobre nós” preserva o sentido causativo sem explicitar além do grego.
- source_word: πόλιν σου τὴν ἁγίαν
  choice: a tua santa cidade
  rationale: Tradução corrente e direta, que conserva o peso religioso e pactual de ἁγίαν.
- source_word: τὴν τῶν πατέρων ἡμῶν Ἰερουσαλήμ
  choice: Jerusalém, a cidade dos nossos antepassados
  rationale: A formulação apositiva identifica Jerusalém como a cidade ancestral. “Antepassados” comunica naturalmente o sentido coletivo de πατέρων no português moderno.
- source_word: ἐν ἀληθείᾳ καὶ κρίσει
  choice: em verdade e juízo
  rationale: Mantém os dois substantivos e a linguagem judicial do grego, sem reduzir a expressão ao advérbio interpretativo “justamente”.
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: por causa dos nossos pecados
  rationale: διά com acusativo expressa causa; esta formulação é clara e preserva a força confessional.
theological_decisions:
- issue: Preservação da linguagem judicial aplicada às ações divinas
  choice: “juízos verdadeiros” e “em verdade e juízo”
  alternative: “atos justos” e “com verdade e justiça”
  rationale: O texto confessa que as calamidades sofridas por Israel e Jerusalém constituem atos judiciais verdadeiros em razão dos pecados do povo. A repetição de “juízo” conserva essa tensão e não suaviza o caráter punitivo da ação.
translation_notes:
  register: Português moderno, claro e dignificado, com leitura natural no Brasil e compreensão internacional. Conserva-se a estrutura confessional e a repetição judicial do original, usando “antepassados” para comunicar de modo atual o sentido coletivo de πατέρων.
