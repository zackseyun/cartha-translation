base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/032.yaml
  text: Blessed are you on the throne of your kingdom[a], and greatly praised and highly exalted forever.
translation:
  language: pt
  text: Bendito és no trono do teu reino[a], imensamente louvado e sumamente exaltado para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «no trono da tua realeza». O grego βασιλεία pode significar «reino», «realeza» ou «reinado».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογημένος
  choice: Bendito
  rationale: Mantém a fórmula litúrgica de bênção como adjetivo predicativo, sem acrescentar a nuance imperativa que haveria em «sejas bendito».
- source_word: ἐπὶ θρόνου
  choice: no trono
  rationale: Expressa de modo direto e natural o sentido locativo da construção grega, preservando a imagem concreta do trono sem inserir um verbo como «entronizado».
- source_word: τῆς βασιλείας σου
  choice: do teu reino
  rationale: «Reino» forma uma expressão natural com «trono» e preserva a referência ao domínio régio, embora βασιλεία também possa indicar realeza ou reinado.
- source_word: ὑπερυμνητός
  choice: imensamente louvado
  rationale: Comunica a forte intensificação do composto grego em português corrente e digno, mantendo explícita a ideia de louvor.
- source_word: ὑπερυψωμένος
  choice: sumamente exaltado
  rationale: Preserva o sentido superlativo e doxológico do termo, além do paralelismo com «imensamente louvado».
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É o equivalente idiomático mais claro para a expressão grega de duração perpétua.
theological_decisions:
- issue: Alocução doxológica e imagem do trono
  choice: 'Dirigir-se diretamente a Deus: «Bendito és no trono do teu reino»'
  alternative: «Bendito és, entronizado no trono do teu reino» ou «Bendito és no trono da tua realeza»
  rationale: O grego contém uma alocução direta na segunda pessoa e associa a bênção ao trono do domínio divino. A tradução conserva essa imagem sem expandir a sintaxe nem definir βασιλεία exclusivamente como território, exercício do poder ou dignidade régia.
translation_notes:
  register: Português moderno, solene e acessível, com cadência doxológica. «Bendito és» conserva o registro litúrgico tradicional sem recorrer a formas arcaicas; os advérbios intensificadores refletem o paralelismo dos dois compostos gregos.
