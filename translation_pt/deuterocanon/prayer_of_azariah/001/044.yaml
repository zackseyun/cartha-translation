base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/044.yaml
  text: Bless the Lord[a], frost and cold; sing hymns and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor[a], geada e frio; cantem hinos e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Louvem o Senhor, geada e frio”. O imperativo grego pode significar “bendizer” ou, em sentido mais geral, “louvar”; “bendigam” preserva o refrão do cântico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca esses elementos da criação a bendizer ou louvar o Senhor. “Bendigam” conserva o refrão litúrgico e a estrutura repetida do cântico.
- source_word: ῥῖγος
  choice: geada
  rationale: No par com ψῦχος, designa a geada ou o frio intenso; “geada” mantém distintos os dois fenômenos.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que liga os dois elementos naturais.
- source_word: ψῦχος
  choice: frio
  rationale: Equivalente português natural para o frio, sem confundi-lo com a geada mencionada antes.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Tradução corrente e digna de κύριος neste contexto litúrgico.
- source_word: ὑμνεῖτε
  choice: cantem hinos
  rationale: O verbo indica louvor cantado; a formulação preserva sua dimensão musical.
- source_word: καὶ ὑπερυψοῦτε
  choice: e exaltem acima de tudo
  rationale: O verbo composto intensifica ὑψόω. A expressão comunica uma exaltação superlativa sem perder naturalidade em português.
- source_word: αὐτὸν
  choice: -no
  rationale: Pronome objeto que retoma “o Senhor”, ligado por ênclise ao verbo.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Expressão idiomática portuguesa para a duração indefinida ou perpétua indicada pelo grego.
theological_decisions:
- issue: Tradução de κύριος em um hino grego deuterocanônico
  choice: o Senhor
  alternative: Senhor
  rationale: Segue o uso português consagrado e preserva o artigo presente no grego, sem introduzir especificação teológica ausente do texto.
- issue: Sentido de εὐλογεῖτε
  choice: Bendigam
  alternative: Louvem
  rationale: Ambos são possíveis, mas “Bendigam” preserva a forma litúrgica do refrão; a alternativa semântica legítima é registrada em nota.
translation_notes:
  register: Português moderno, solene e acessível, com imperativos no plural. A ordem vocativa do grego foi preservada; “geada e frio” mantém a distinção lexical do par. A expressão “acima de tudo” procura conservar a força intensiva de ὑπερυψοῦτε.
