translation:
  language: pt
  text: Orvalhos e nevascas, bendigam o Senhor; cantem-lhe louvores e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δρόσοι
  choice: orvalhos
  rationale: Equivalente direto e natural do plural grego, mantendo a personificação dos fenômenos naturais.
- source_word: νιφετοί
  choice: nevascas
  rationale: O substantivo grego designa quedas de neve ou tempestades de neve; “nevascas” expressa esse sentido melhor que o genérico “chuvas”.
- source_word: εὐλογεῖτε
  choice: bendigam
  rationale: Reproduz o imperativo plural dirigido aos elementos da natureza e mantém a fórmula litúrgica do cântico.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: Expressa de modo claro e idiomático a ideia de louvar por meio de hinos ou cânticos.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: Preserva a força intensiva do verbo grego sem recorrer a uma formulação pouco natural em português.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Forma portuguesa corrente e digna para a expressão idiomática grega de duração perpétua.
