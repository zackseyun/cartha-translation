base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/034.yaml
  text: Bless the Lord[a], all the works of the Lord; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, todas as obras do Senhor; cantem louvores a ele e exaltem-no grandemente para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelos séculos”. A expressão grega significa literalmente “para os séculos” e é uma forma habitual de indicar louvor duradouro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural preserva a força litúrgica e doxológica de εὐλογέω, dirigindo-se a todas as obras do Senhor.
- source_word: πάντα τὰ ἔργα Κυρίου
  choice: todas as obras do Senhor
  rationale: Tradução direta do chamamento à totalidade das obras ou criaturas do Senhor, preservando a relação genitiva e a estrutura do hino.
- source_word: Κυρίου / τὸν κύριον
  choice: do Senhor / o Senhor
  rationale: 'Mantém o uso de κύριος nos dois casos gramaticais: primeiro no genitivo e depois como objeto direto.'
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Expressa de modo natural a nuance de louvor cantado própria de ὑμνέω.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O advérbio comunica a força intensificadora do composto grego sem recorrer a uma formulação pouco natural.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente português claro e corrente para a expressão idiomática que, neste refrão hínico, indica louvor duradouro.
theological_decisions:
- issue: Tradução de κύριος em um hino grego deuterocanônico
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: “Senhor” corresponde ao termo grego, serve ao contexto litúrgico e não exige que se resolva além do texto sua relação com o uso reverencial judaico.
- issue: Alcance temporal de εἰς τοὺς αἰῶνας
  choice: para sempre
  alternative: pelos séculos
  rationale: No refrão hínico, a expressão indica duração contínua; a tradução principal usa o equivalente idiomático, enquanto a nota conserva a imagem literal dos “séculos”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com imperativos na terceira pessoa do plural, naturais sobretudo para leitores brasileiros. A repetição de “Senhor” e a cadência paralela foram preservadas por fazerem parte da estrutura do hino. O marcador da nota foi colocado após “para sempre”, expressão a que a nota efetivamente se refere.
