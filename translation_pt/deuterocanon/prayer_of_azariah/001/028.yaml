base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/028.yaml
  text: 'Then the three[a], as with one mouth, were singing hymns and glorifying and blessing God in the furnace, saying:'
translation:
  language: pt
  text: 'Então os três, como de uma só boca,[a] entoavam hinos, glorificavam e bendiziam a Deus na fornalha, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a uma só voz”. O grego diz literalmente “como de uma só boca”, ressaltando a completa unidade dos três em seu louvor.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Introduz naturalmente a sequência temporal da cena, sem acrescentar informação.
- source_word: οἱ τρεῖς
  choice: os três
  rationale: Preserva a formulação concisa do grego, que não repete “homens” nem “jovens” neste versículo.
- source_word: ὡς ἐξ ἑνὸς στόματος
  choice: como de uma só boca
  rationale: Mantém a imagem vívida do grego e expressa a plena unidade dos três; a alternativa idiomática aparece em nota.
- source_word: ὕμνουν
  choice: entoavam hinos
  rationale: O imperfeito português comunica ação contínua, e “entoavam hinos” preserva o sentido específico de louvor em forma de canto.
- source_word: ἐδόξαζον
  choice: glorificavam
  rationale: Conserva a ideia própria de atribuir glória e a distingue dos outros verbos de louvor.
- source_word: εὐλόγουν
  choice: bendiziam
  rationale: Preserva o verbo distinto empregado no grego e soa natural no registro bíblico português.
- source_word: τὸν θεὸν
  choice: a Deus
  rationale: É a construção idiomática em português para o objeto direto pessoal, sem reproduzir mecanicamente o artigo grego.
- source_word: ἐν τῇ καμίνῳ
  choice: na fornalha
  rationale: “Fornalha” é o termo claro e tradicionalmente adequado ao cenário de Daniel.
- source_word: λέγοντες
  choice: dizendo
  rationale: Traduz diretamente o particípio que introduz as palavras seguintes.
