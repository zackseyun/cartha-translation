base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/064.yaml
  text: Bless the Lord[a], you holy and humble in heart; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, vocês que são santos[a] e humildes de coração; cantem louvores a ele e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “piedosos” ou “devotos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural mantém o sentido litúrgico de bendizer o Senhor e corresponde naturalmente à sequência de exortações do cântico.
- source_word: ὅσιοι
  choice: santos
  rationale: O adjetivo pode designar pessoas santas, piedosas ou devotas. “Santos” preserva de modo conciso sua conotação religiosa, enquanto a nota registra alternativas legítimas.
- source_word: ταπεινοὶ τῇ καρδίᾳ
  choice: humildes de coração
  rationale: Expressão natural em português que conserva tanto a humildade quanto seu caráter interior indicado pelo dativo τῇ καρδίᾳ.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Tradução estabelecida de κύριος neste contexto de adoração, sem acrescentar nuance doutrinária indevida.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Explicita a dimensão musical e litúrgica do verbo, de maneira clara e corrente em português.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  rationale: O prefixo intensivo ὑπερ- pede mais que o simples “exaltem”. A formulação comunica exaltação suprema com naturalidade.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático e claro da expressão grega de duração ilimitada neste refrão.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: o Soberano
  rationale: “O Senhor” é a correspondência tradicional e natural no contexto do culto, sem resolver além do texto a identidade expressa pelo título.
- issue: Sentido de ὅσιοι
  choice: santos
  alternative: piedosos; devotos
  rationale: O grego admite essas nuances. O texto principal usa a forma concisa e elevada “santos”, e a nota preserva a amplitude lexical.
translation_notes:
  register: Registro poético-litúrgico, digno e contemporâneo. O uso de “vocês” torna explícito o vocativo plural para leitores modernos, e os imperativos no plural conservam a convocação comunitária do grego.
