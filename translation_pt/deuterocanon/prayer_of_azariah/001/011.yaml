  text: Do not give us over utterly for the sake of your name[b][a], and do not break your covenant.
translation:
  language: pt
  text: Não nos entregues completamente[a], por amor do teu nome, e não disperses a tua aliança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não nos entregues até o fim», isto é, «não nos abandones completamente».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não anules a tua aliança» ou «não rompas a tua aliança». O verbo grego significa literalmente «espalhar» ou «dispersar».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ παραδῷς ἡμᾶς
  choice: Não nos entregues
  rationale: παραδίδωμι significa entregar ou pôr alguém nas mãos ou no poder de outrem. A formulação portuguesa conserva esse sentido sem explicitar agentes ou inimigos que o grego não menciona.
- source_word: εἰς τέλος
  choice: completamente
  rationale: A expressão pode ser entendida literalmente como «até o fim», mas aqui tem força idiomática de totalidade. «Completamente» comunica esse sentido com clareza, enquanto a alternativa literal é preservada em nota.
- source_word: διὰ τὸ ὄνομά σου
  choice: por amor do teu nome
  rationale: A expressão apresenta o nome de Deus — sua identidade e reputação — como fundamento do apelo. «Por amor do teu nome» é natural no registro bíblico português e evita que «por causa» soe como atribuição de culpa.
- source_word: μὴ διασκεδάσῃς
  choice: não disperses
  rationale: διασκεδάζω significa literalmente espalhar ou dispersar. Embora o objeto «aliança» torne a imagem incomum em português, «disperses» preserva a metáfora grega; os sentidos contextuais mais idiomáticos são registrados em nota.
- source_word: τὴν διαθήκην
  choice: a tua aliança
  rationale: No contexto da relação entre Deus e seu povo, διαθήκη designa uma aliança, não meramente um acordo ou testamento.
theological_decisions:
- issue: Sentido de εἰς τέλος no pedido por misericórdia
  choice: completamente
  alternative: até o fim; para sempre
  rationale: O pedido pode expressar abandono total ou definitivo. O texto principal transmite a força de totalidade sem reduzir a expressão a uma duração temporal, e a nota preserva a forma mais literal.
- issue: Metáfora de διασκεδάζω aplicada à aliança
  choice: não disperses a tua aliança
  alternative: não anules a tua aliança; não rompas a tua aliança
  rationale: A tradução mantém a imagem incomum de dispersar, sem decidir silenciosamente se o efeito pretendido é anulação jurídica ou rompimento da aliança. As leituras idiomáticas ficam disponíveis em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega a segunda pessoa singular em registro bíblico natural. A construção incomum «disperses a tua aliança» é mantida deliberadamente para preservar a metáfora do grego, com esclarecimento em nota.
