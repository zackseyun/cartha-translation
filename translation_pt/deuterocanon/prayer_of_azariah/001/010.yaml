base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/010.yaml
  text: And now we cannot open our mouth[a]; shame and reproach have come upon your slaves and those who revere you.
translation:
  language: pt
  text: E agora não podemos abrir a boca; vergonha e afronta sobrevieram aos teus escravos[a] e aos que te reverenciam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “servos”. O grego usa o termo δούλος, aqui na forma δούλων, literalmente “escravos”, que ressalta pertencimento e subordinação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι τὸ στόμα
  choice: abrir a boca
  rationale: Mantém a imagem do idioma grego, que neste contexto expressa a falta de capacidade ou liberdade para falar, e soa natural em português.
- source_word: αἰσχύνη
  choice: vergonha
  rationale: É o equivalente direto e corrente, preservando tanto o sentimento quanto a condição de desonra.
- source_word: ὄνειδος
  choice: afronta
  rationale: Comunica censura, insulto e desonra pública, distinguindo-se de αἰσχύνη sem recorrer ao pouco natural 'opróbrio'.
- source_word: ἐγενήθη
  choice: sobrevieram
  rationale: Expressa de modo idiomático o estado adverso que atingiu os grupos mencionados; a flexão no plural é exigida em português pelos dois substantivos coordenados.
- source_word: δούλων σου
  choice: teus escravos
  rationale: Preserva o sentido forte de pertencimento e subordinação de δοῦλος, especialmente saliente na oração dirigida a Deus.
- source_word: τῶν σεβομένων σε
  choice: os que te reverenciam
  rationale: Abrange respeito devoto e piedade sem restringir o termo apenas ao medo ou ao culto ritual.
theological_decisions:
- issue: Tradução de δοῦλος em referência à relação com Deus
  choice: teus escravos
  alternative: teus servos
  rationale: A opção principal conserva a força social e teológica de pertencimento e subordinação presente no grego; a alternativa tradicional é registrada em nota para evitar que a escolha lexical seja confundida com falta de reconhecimento do uso consagrado.
- issue: Relação de vergonha e afronta com os grupos no genitivo
  choice: sobrevieram aos teus escravos e aos que te reverenciam
  alternative: tornaram-se a vergonha e a afronta dos teus escravos e dos que te reverenciam
  rationale: O genitivo grego admite uma relação condensada e não inteiramente explícita. A formulação escolhida segue a leitura contextual de que vergonha e afronta atingiram os fiéis, sem identificar silenciosamente os dois grupos entre si.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. 'Afronta' preserva o caráter público de ὄνειδος sem o arcaísmo de 'opróbrio'. O marcador [a] aparece imediatamente após o termo a que se refere.
