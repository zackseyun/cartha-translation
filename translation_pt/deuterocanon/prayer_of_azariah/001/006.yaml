translation:
  language: pt
  text: pois pecamos em tudo e agimos contra a lei, afastando-nos de ti; e em tudo pecamos gravemente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo grego desta última oração é mais forte que o verbo traduzido por «pecamos» no início do versículo. Também se pode traduzir: «cometemos pecados graves em tudo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτομεν
  choice: pecamos
  rationale: O aoristo exprime a ação confessada como um fato consumado; o pretérito perfeito simples é a forma natural em português.
- source_word: ἐν πᾶσι
  choice: em tudo
  rationale: Preserva de modo conciso a abrangência da expressão grega sem decidir entre cada matéria e cada maneira de agir.
- source_word: ἠνομήσαμεν
  choice: agimos contra a tua lei
  rationale: Explicita o sentido de agir contrariamente à lei, mantendo a ligação lexical com νόμος e evitando o pouco natural «agimos ilegalmente» neste contexto religioso.
- source_word: ἀποστῆναι ἀπὸ σοῦ
  choice: afastando-nos de ti
  rationale: O gerúndio apresenta o afastamento de Deus como conteúdo ou modo da ação contrária à lei e conserva o sentido relacional da expressão.
- source_word: ἐξημάρτομεν
  choice: pecamos gravemente
  rationale: O advérbio comunica a intensificação presente no verbo composto e distingue esta confissão da ocorrência anterior de ἡμάρτομεν.
theological_decisions:
- issue: Preservar a diferença entre ἡμάρτομεν e o verbo intensificado ἐξημάρτομεν
  choice: «pecamos» na primeira ocorrência e «pecamos gravemente» na última
  alternative: Traduzir ambos simplesmente por «pecamos»
  rationale: Os verbos gregos são relacionados, mas o segundo intensifica a confissão; conservar a diferença evita achatar a progressão retórica e não acrescenta uma distinção doutrinária alheia ao texto.
- issue: Relação sintática de ἀποστῆναι ἀπὸ σοῦ com ἠνομήσαμεν
  choice: «agimos contra a tua lei, afastando-nos de ti»
  alternative: «agimos contra a tua lei para nos afastarmos de ti»
  rationale: A construção infinitiva pode indicar explicação, conteúdo ou resultado. O gerúndio português mantém uma abertura semelhante e evita atribuir inequivocamente a intenção de afastar-se.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Emprega-se «tua» em concordância com «ti». O ponto e vírgula torna perceptível a intensificação da oração final sem alterar sua ligação com a confissão anterior.
