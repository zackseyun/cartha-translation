lexical_decisions:
- source_word: ἀλλʼ
  choice: mas
  rationale: Marca o contraste com a ausência de ofertas sacrificiais mencionada no contexto anterior.
- source_word: ἐν
  choice: com
  rationale: Introduz aqui a condição ou maneira em que se pede acolhimento; «com» é natural em português.
- source_word: ψυχῇ
  choice: alma
  rationale: Preserva o peso antropológico e devocional de ψυχή e sua distinção em relação a πνεῦμα.
- source_word: συντετριμμένῃ
  choice: quebrantada
  rationale: Expressa o estado resultante de ter sido quebrada ou esmagada; «quebrantada» mantém a imagem e é corrente no registro penitencial.
- source_word: πνεύματι
  choice: espírito
  rationale: Mantém o termo distinto de «alma» e indica a disposição interior.
- source_word: τεταπεινωμένῳ
  choice: humilhado
  rationale: Reproduz o estado de ter sido rebaixado ou tornado humilde diante de Deus, sem explicitar indevidamente a causa.
- source_word: προσδεχθείημεν
  choice: sejamos acolhidos
  rationale: O optativo passivo exprime um desejo ou súplica por recepção favorável; «sejamos acolhidos» preserva o valor relacional do verbo.
theological_decisions:
- issue: Par antropológico ψυχή e πνεῦμα
  choice: Traduzir distintamente como «alma» e «espírito»
  alternative: Generalizar ambos como aspectos do íntimo ou do ser interior
  rationale: O grego emprega dois termos distintos em paralelismo poético; preservá-los mantém a textura literária e a possível distinção antropológica sem defini-la dogmaticamente.
- issue: Imagem penitencial de συντετριμμένῃ
  choice: Usar «quebrantada»
  alternative: «contrita» ou «esmagada»
  rationale: «Quebrantada» conserva a imagem de algo quebrado e soa natural no registro devocional, enquanto «contrita» é mais interpretativo e «esmagada» é mais áspero.
- issue: Sentido de προσδεχθείημεν
  choice: «sejamos acolhidos»
  alternative: «sejamos aceitos» ou «sejamos recebidos»
  rationale: «Acolhidos» comunica recepção favorável por Deus sem reduzir o verbo a aprovação abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do grego foram preservados sem rigidez excessiva.
