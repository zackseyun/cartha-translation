translation:
  language: pt
  text: e atravessou e incendiou os caldeus que encontrou ao redor da fornalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «passou através e ateou fogo aos caldeus que encontrou ao redor da fornalha».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διώδευσεν
  choice: passou pelo fogo
  rationale: O verbo indica atravessar ou percorrer. Como o sujeito implícito é o fogo do contexto imediato, explicitar «pelo fogo» em português evita uma construção obscura sem acrescentar um novo agente.
- source_word: ἐνεπύρισεν
  choice: queimou
  rationale: O verbo expressa incendiar ou queimar. «Queimou» é natural e preserva o efeito destrutivo sem afirmar necessariamente consumo total.
- source_word: οὓς εὗρεν
  choice: os ... que encontrou
  rationale: 'Mantém a oração relativa e seu alcance: foram atingidos os caldeus que o fogo encontrou no local.'
- source_word: περὶ τὴν κάμινον
  choice: ao redor da fornalha
  rationale: περί com acusativo tem aqui sentido espacial; «ao redor da fornalha» é claro e direto.
- source_word: τῶν Χαλδαίων
  choice: os caldeus
  rationale: Conserva o etnônimo específico do grego, em vez de generalizá-lo como «babilônios».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla. A repetição explícita de «fogo» torna natural o sujeito implícito indicado pelo contexto; a nota preserva uma versão mais formal dos dois verbos gregos.
