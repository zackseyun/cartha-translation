base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/056.yaml
  text: Bless the Lord[a], sea creatures and all that move in the waters; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, criaturas do mar[a] e tudo o que se move nas águas; cantem-lhe louvores e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grandes criaturas marinhas”, “baleias” ou “monstros marinhos”. O termo grego é amplo e designa grandes criaturas das águas.
    reason: Alternativas lexicais legítimas para κήτη.
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca as criaturas a bendizer o Senhor e preserva o refrão litúrgico mais diretamente do que o simples verbo “louvar”.
- source_word: κήτη
  choice: criaturas do mar
  rationale: O termo designa amplamente grandes animais aquáticos e pode incluir cetáceos ou monstros marinhos; a escolha evita restringir indevidamente o referente.
- source_word: πάντα τὰ κινούμενα
  choice: tudo o que se move
  rationale: Mantém a abrangência da expressão grega substantivada sem acrescentar explicitamente “criatura”, termo apenas implícito.
- source_word: ἐν τοῖς ὕδασι
  choice: nas águas
  rationale: Preserva o plural grego e o uso bíblico natural para o domínio aquático.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: É a tradução direta do título divino κύριος neste contexto hínico grego, sem representar graficamente um Tetragrama que não aparece no texto-fonte.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: Expressa a nuance musical do verbo, que significa louvar por meio de cântico.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: Comunica a força intensiva do verbo composto sem recorrer a uma formulação pouco natural em português.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Transmite de modo idiomático a duração perpétua indicada pela expressão grega.
theological_decisions:
- issue: Tradução de κύριος em um hino deuterocanônico
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto grego traz κύριον, e não o Tetragrama hebraico; “o Senhor” preserva o título presente na fonte sem introduzir uma identificação gráfica não explícita.
translation_notes:
  register: Português moderno, claro e solene, com imperativos na terceira pessoa do plural, naturais para um público amplo e especialmente legíveis no Brasil. A estrutura paralela e o tom litúrgico do hino foram preservados.
