base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/051.yaml
  text: Let the earth bless the Lord; let it sing hymns and highly exalt him forever.
translation:
  language: pt
  text: Que a terra bendiga o Senhor; que lhe cante hinos e o exalte sobremaneira para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογείτω
  choice: Que ... bendiga
  rationale: O imperativo de terceira pessoa funciona como convocação litúrgica. “Bendiga” preserva o registro bíblico e o sentido de louvor dirigido a Deus.
- source_word: ἡ γῆ
  choice: a terra
  rationale: Na sequência cósmica do cântico, refere-se à terra como parte da criação, não a uma região específica.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: É a forma consagrada e natural em português para κύριος neste contexto doxológico.
- source_word: ὑμνείτω
  choice: que lhe cante hinos
  rationale: Mantém a nuance musical e litúrgica de ὑμνέω; “lhe” explicita de modo natural em português que os hinos são dirigidos ao Senhor.
- source_word: ὑπερυψούτω
  choice: o exalte sobremaneira
  rationale: “Sobremaneira” comunica a força intensiva do verbo composto sem produzir uma expressão artificial.
- source_word: αὐτὸν
  choice: lhe ... o
  rationale: Os pronomes retomam “o Senhor”; a alternância decorre da regência natural das expressões portuguesas “cantar hinos a alguém” e “exaltar alguém”.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Expressa de forma idiomática a duração ilimitada da fórmula doxológica.
theological_decisions:
- issue: Tradução de κύριος no hino grego deuterocanônico
  choice: o Senhor
  alternative: o Soberano
  rationale: O contexto litúrgico favorece o título bíblico estabelecido “Senhor”; o versículo não exige uma alternativa.
translation_notes:
  register: Português moderno, digno e litúrgico, com estrutura paralela clara. A formulação conserva a personificação poética da terra e a intensidade de ὑπερυψόω.
