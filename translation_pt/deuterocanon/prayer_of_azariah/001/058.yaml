base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/058.yaml
  text: Bless the Lord, four-footed animals and beasts of the earth; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, animais de quatro patas e feras da terra; cantem-lhe louvores e exaltem-no sobremaneira para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: Imperativo plural dirigido às criaturas. “Bendigam” preserva a linguagem litúrgica e a distingue de ὑμνεῖτε, que expressa louvor em forma de hino ou canto.
- source_word: τετράποδα
  choice: animais de quatro patas
  rationale: Expressa de modo claro e natural o sentido literal de “seres de quatro patas”, evitando o tom técnico de “quadrúpedes”.
- source_word: θηρία τῆς γῆς
  choice: feras da terra
  rationale: Mantém o sentido de animais ou feras e conserva a linguagem cósmica e poética da composição.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Tradução consagrada e adequada de κύριος neste contexto de adoração dirigida a Deus.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: Comunica a nuance especificamente hínica do verbo e mantém uma formulação natural em português.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no sobremaneira
  rationale: O verbo composto intensifica a ideia de exaltar; “sobremaneira” preserva essa força sem recorrer a uma construção pouco idiomática.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático que expressa a duração perpétua da fórmula doxológica.
theological_decisions:
- issue: Tradução de κύριος em um hino deuterocanônico dirigido a Deus
  choice: o Senhor
  alternative: o Soberano
  rationale: “O Senhor” corresponde ao uso religioso do termo no contexto e evita introduzir uma nuance alheia à passagem.
translation_notes:
  register: Português moderno, claro e digno, com cadência litúrgica. A ordem de chamamento às criaturas foi mantida, e os verbos distintos do grego receberam traduções distintas para preservar a progressão poética.
