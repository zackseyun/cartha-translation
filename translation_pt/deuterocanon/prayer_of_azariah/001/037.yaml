base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/037.yaml
  text: Bless the Lord[a], waters and all that are above the heavens; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Águas e tudo o que está acima do céu[a], bendigam o Senhor; cantem louvores a ele e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «todas as coisas que estão acima do céu». A expressão grega pode designar coletivamente as realidades cósmicas acima do céu.'
    reason: alternativa lexical
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: bendigam
  rationale: O imperativo plural convoca os elementos da criação a bendizer o Senhor e preserva o refrão litúrgico melhor que o termo mais genérico «louvem».
- source_word: ὕδατα
  choice: águas
  rationale: Mantém o plural grego e a personificação poética dos elementos cósmicos.
- source_word: πάντα τὰ ἐπάνω τοῦ οὐρανοῦ
  choice: tudo o que está acima dos céus
  rationale: Expressa naturalmente o neutro plural coletivo e usa «céus» como forma idiomática em português para o domínio celeste, embora οὐρανοῦ esteja no singular.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Traduz κύριος como título divino sem introduzir a convenção tipográfica reservada ao nome divino hebraico.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Preserva a nuance específica de louvor cantado.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: Reproduz a força intensiva do verbo composto sem recorrer a uma formulação arcaica.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Comunica de modo natural, no contexto doxológico, a duração indefinida expressa pela locução grega.
theological_decisions:
- issue: Tradução de κύριος em um hino grego deuterocanônico
  choice: o Senhor
  alternative: SENHOR
  rationale: O testemunho grego traz κύριος, não diretamente o nome divino hebraico; «o Senhor» segue a fonte sem importar a convenção de versaletes.
translation_notes:
  register: Português atual, solene e acessível, com ordem sintática ajustada para deixar claro que «águas e tudo o que está acima dos céus» são os destinatários dos imperativos no plural. A colocação pronominal em «exaltem-no» mantém dignidade literária sem arcaísmo excessivo.
