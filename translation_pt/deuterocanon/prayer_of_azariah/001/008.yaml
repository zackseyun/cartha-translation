base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/008.yaml
  text: And now[a], all that you have brought upon us, and all that you have done to us, you have done in true judgment[b],
translation:
  language: pt
  text: E agora, tudo o que trouxeste sobre nós e tudo o que nos fizeste, fizeste com juízo verdadeiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em julgamento verdadeiro”; também pode ser entendido como “com juízo justo”.'
    reason: A construção grega admite variação entre ‘com/em’, enquanto ἀληθινῇ pode destacar que o juízo é verdadeiro ou, no contexto, justo.
lexical_decisions:
- source_word: νῦν
  choice: agora
  rationale: Traduz diretamente o advérbio temporal e mantém a confissão ligada à situação presente dos que oram.
- source_word: πάντα ὅσα
  choice: tudo o que
  rationale: Expressão natural em português que preserva o caráter abrangente e, por sua repetição, o paralelismo enfático do grego.
- source_word: ἐπήγαγες
  choice: trouxeste sobre
  rationale: Mantém a atribuição direta da calamidade a Deus sem acrescentar a ideia mais específica de punição ou de algo infligido.
- source_word: ἐποίησας ἡμῖν
  choice: nos fizeste
  rationale: Preserva a construção simples e seu sentido contextual adverso, em paralelo com aquilo que foi trazido sobre os falantes.
- source_word: ἐν ἀληθινῇ κρίσει
  choice: com juízo verdadeiro
  rationale: Expressa de modo inteligível a ideia de que a ação divina se deu segundo um juízo genuíno e válido, conservando o valor básico de ἀληθινῇ sem substituí-lo silenciosamente por 'justo'.
- source_word: ἐποίησας
  choice: fizeste
  rationale: O pretérito perfeito português corresponde naturalmente ao aoristo grego neste reconhecimento de atos já realizados.
theological_decisions:
- issue: Caracterização das ações de Deus para com os falantes
  choice: A calamidade trazida sobre o povo é atribuída diretamente a Deus e confessada como realizada com juízo verdadeiro.
  alternative: Traduzir de modo mais interpretativo como 'com juízo justo' ou 'com justiça'.
  rationale: A formulação conserva tanto a agência divina explícita quanto a avaliação positiva de seu juízo, sem desenvolver uma doutrina de retribuição além do que o versículo afirma.
translation_notes:
  register: Português atual, claro e digno, com formas verbais na segunda pessoa do singular para refletir a oração dirigida diretamente a Deus. A repetição de “tudo o que” e “fizeste” foi mantida por corresponder ao paralelismo enfático do grego.
