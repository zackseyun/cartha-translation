base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/018.yaml
  text: And now we follow after you with our whole heart[a], and we fear you, and we seek your face.
translation:
  language: pt
  text: E agora continuamos a seguir-te de todo o nosso coração, tememos-te e buscamos a tua face.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “buscamos a tua presença”. O grego diz literalmente “buscamos a tua face”, expressão bíblica que pode significar buscar a presença ou o favor de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva tanto a ligação expressa por καί como a transição temporal imediata de νῦν.
- source_word: ἐξακολουθοῦμεν
  choice: continuamos a seguir-te
  rationale: Expressa o seguimento persistente sugerido pelo verbo composto e torna explícito o objeto implícito no contexto, sem mudar seu referente.
- source_word: ἐν ὅλῃ καρδίᾳ ἡμῶν
  choice: de todo o coração
  rationale: É a forma idiomática natural em português para devoção integral, preservando a imagem bíblica do coração.
- source_word: φοβούμεθά σε
  choice: tememos-te
  rationale: Mantém diretamente a linguagem de temor empregada no grego, sem reduzi-la apenas a reverência.
- source_word: ζητοῦμεν τὸ πρόσωπόν σου
  choice: buscamos a tua face
  rationale: Conserva a imagem literal e sua ressonância bíblica; o sentido idiomático de buscar a presença ou o favor de Deus fica indicado em nota.
theological_decisions:
- issue: Sentido de φοβούμεθά σε em referência a Deus
  choice: tememos-te
  alternative: reverenciamos-te
  rationale: O grego emprega explicitamente o verbo temer. A tradução preserva a tensão entre temor e reverência, em vez de resolvê-la no texto principal.
- issue: Sentido de ζητοῦμεν τὸ πρόσωπόν σου
  choice: buscamos a tua face
  alternative: buscamos a tua presença
  rationale: A expressão literal é mantida por transparência e por sua ressonância bíblica, enquanto o sentido idiomático é esclarecido em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal enclítica preserva o tom solene sem recorrer a vocabulário arcaico; a coordenação simples acompanha de perto o ritmo do grego.
