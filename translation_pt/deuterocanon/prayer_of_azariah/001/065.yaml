base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/065.yaml
  text: Bless the Lord[a], Hananiah, Azariah, and Mishael; sing praise to him and highly exalt him forever. For he has delivered us from Hades, and saved us from the hand of death, and rescued us from the midst of the burning flame, and redeemed us from the fire.
translation:
  language: pt
  text: Bendigam o Senhor, Ananias, Azarias e Misael; cantem louvores a ele e exaltem-no grandemente para sempre. Pois ele nos livrou do Hades[a], salvou-nos da mão da morte, resgatou-nos do meio da chama ardente e nos redimiu do fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da sepultura». O grego diz «do Hades», isto é, do domínio dos mortos.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: Preserva o imperativo plural e a força litúrgica de εὐλογέω dirigido ao Senhor; «louvem» seria possível, mas reduziria a distinção em relação a ὑμνεῖτε.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Equivalente bíblico corrente de κύριος como título divino neste contexto litúrgico judaico-grego.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Exprime de modo natural a dimensão musical do verbo, que denota entoar hinos ou cânticos de louvor.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: Reproduz a intensificação do composto grego sem recorrer a uma formulação pouco natural em português.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Forma idiomática portuguesa que comunica a duração contínua da fórmula doxológica.
- source_word: ἐξείλετο
  choice: livrou
  rationale: Comunica a retirada de um perigo e mantém alguma distinção dos verbos de salvamento e resgate que aparecem em seguida.
- source_word: ἐξ ᾅδου
  choice: do Hades
  rationale: Mantém o termo grego que designa o domínio dos mortos, evitando estreitá-lo silenciosamente a «sepultura»; a nota oferece essa leitura interpretativa.
- source_word: ἔσωσεν
  choice: salvou
  rationale: Equivalente direto de σώζω; no contexto, refere-se concretamente ao salvamento diante de perigo mortal.
- source_word: ἐκ χειρὸς θανάτου
  choice: da mão da morte
  rationale: Conserva a imagem semítica presente no grego e a personificação vívida do poder da morte.
- source_word: ἐρρύσατο
  choice: resgatou
  rationale: Expressa retirada de perigo imediato e evita repetir «livrou», embora o campo semântico dos verbos se sobreponha.
- source_word: ἐκ μέσου καιομένης φλογός
  choice: do meio da chama ardente
  rationale: Preserva a imagem de salvamento ocorrido dentro da chama, com formulação clara e digna em português.
- source_word: ἐλυτρώσατο
  choice: redimiu
  rationale: Retém a ressonância de libertação de λυτρόω e distingue o verbo dos demais termos de resgate no versículo.
theological_decisions:
- issue: Tradução de ᾅδης numa ação de graças pelo livramento de perigo mortal
  choice: do Hades
  alternative: da sepultura; do mundo dos mortos
  rationale: O grego emprega explicitamente ᾅδης. «Hades» preserva a transparência lexical e a tensão teológica sem identificar de modo exclusivo o termo com a sepultura; a nota esclarece o sentido antigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. Mantém o paralelismo litúrgico, a sequência de quatro verbos de livramento e as imagens concretas do original.
