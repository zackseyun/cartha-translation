  text: For you are righteous in all that you have done to us, and all your works are true, and your ways are straight, and all your judgments are true.
translation:
  language: pt
  text: Pois tu és justo em tudo o que fizeste conosco; todas as tuas obras são verdadeiras, os teus caminhos são retos, e todos os teus julgamentos são verdadeiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: justo
  rationale: Expressa a retidão moral de Deus e, em português corrente, também se ajusta naturalmente ao contexto de seus atos e julgamentos.
- source_word: πᾶσιν οἷς ἐποίησας ἡμῖν
  choice: em tudo o que fizeste conosco
  rationale: Reproduz de modo natural a construção abrangente e mantém a agência divina explicitamente afirmada pelo grego.
- source_word: ἔργα
  choice: obras
  rationale: Equivalente direto, natural e consolidado no vocabulário bíblico para os atos de Deus.
- source_word: ἀληθινὰ / ἀληθιναί
  choice: verdadeiras / verdadeiros
  rationale: Mantém a repetição do original e comunica tanto conformidade com a verdade quanto confiabilidade, sem reduzir o sentido apenas a 'fiéis'.
- source_word: ὁδοί
  choice: caminhos
  rationale: Preserva a metáfora bíblica referente ao modo de agir de Deus e soa natural em português.
- source_word: εὐθεῖαι
  choice: retos
  rationale: Conserva a imagem de caminhos direitos e, em português, comunica de forma idiomática sua retidão.
- source_word: κρίσεις
  choice: julgamentos
  rationale: Designa adequadamente os juízos ou decisões judiciais de Deus e mantém a ressonância teológica do termo.
theological_decisions:
- issue: A justiça de Deus diante do sofrimento experimentado pelos que falam
  choice: Afirmar que Deus é justo em tudo o que fez conosco, mantendo sua agência direta.
  alternative: Empregar uma formulação indireta que apresente os acontecimentos apenas como permitidos por Deus.
  rationale: O grego declara explicitamente 'o que fizeste conosco'. A tradução conserva a tensão da confissão de que Deus permanece justo mesmo em atos adversos aos falantes, sem introduzir uma mitigação teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e a repetição de 'verdadeiros' preservam o paralelismo enfático do grego; a segunda pessoa singular usa 'tu' por coerência com o discurso direto a Deus.
