base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/017.yaml
  text: As with whole burnt offerings of rams and bulls[a], and as with tens of thousands of fat lambs, so let our sacrifice be before you today and make atonement before you, for there is no shame for those who have put their trust in you[b], and let it be brought to completion before you.
translation:
  language: pt
  text: Como em ofertas totalmente queimadas de carneiros e touros, e como em dezenas de milhares de cordeiros gordos, assim seja hoje o nosso sacrifício diante de ti e faça expiação em tua presença[b], pois não há vergonha para os que depositaram a confiança em ti; e seja consumado em tua presença.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: A expressão grega traduzida duas vezes por “em tua presença” significa literalmente “atrás de ti”; seu uso neste contexto é incomum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώμασι
  choice: ofertas totalmente queimadas
  rationale: Expressa a oferta consumida por inteiro no fogo, preservando a especificidade sacrificial sem recorrer a “holocaustos”, termo hoje fortemente associado a outro referente histórico.
- source_word: κριῶν καὶ ταύρων
  choice: carneiros e touros
  rationale: São os equivalentes correntes e específicos dos animais mencionados no contexto sacrificial.
- source_word: μυριάσιν
  choice: dezenas de milhares
  rationale: Comunica de modo claro a grandeza numérica de μυριάδες, sem diluí-la em uma expressão vaga como “inúmeros”.
- source_word: ἀρνῶν πιόνων
  choice: cordeiros gordos
  rationale: Mantém de forma direta a imagem de animais bem alimentados e valiosos para o sacrifício.
- source_word: θυσία
  choice: sacrifício
  rationale: Preserva a força cultual da comparação com as ofertas de animais.
- source_word: ἐξιλάσαι
  choice: faça expiação
  rationale: Mantém o sentido sacrificial de expiar ou aplacar, sem ocultá-lo sob a leitura mais interpretativa “seja aceito”.
- source_word: ὄπισθέν σου
  choice: em tua presença
  rationale: Embora ὄπισθεν normalmente signifique “atrás”, as duas ocorrências são incomuns neste contexto; “em tua presença” comunica de modo inteligível a orientação do sacrifício para Deus, enquanto a tradução literal é registrada em nota.
- source_word: αἰσχύνη
  choice: vergonha
  rationale: Equivalente direto e natural para a desonra ou frustração que não recai sobre os que confiam em Deus.
- source_word: τοῖς πεποιθόσιν ἐπὶ σοί
  choice: os que depositaram a confiança em ti
  rationale: O perfeito participial retrata uma confiança já depositada e que permanece.
- source_word: τελειῶσαι
  choice: seja levado à plenitude
  rationale: Conserva a ideia de levar o sacrifício ao seu fim ou cumprimento, sem decidir além do que permite a sintaxe grega comprimida.
theological_decisions:
- issue: Sentido sacrificial de ἐξιλάσαι
  choice: faça expiação em tua presença
  alternative: seja aceito em tua presença
  rationale: A opção principal conserva o peso cultual e teológico do verbo grego. A alternativa possível é registrada em nota para não encobrir a incerteza contextual.
- issue: Frase repetida ὄπισθέν σου
  choice: em tua presença
  alternative: atrás de ti
  rationale: A tradução estritamente espacial seria obscura e provavelmente enganosa nesta oração. A formulação contextual adotada preserva a orientação do sacrifício para Deus, e a forma literal é documentada em nota.
- issue: Sujeito implícito de τελειῶσαι
  choice: seja levado à plenitude
  alternative: seja consumado
  rationale: A sintaxe é elíptica. A tradução liga naturalmente o pedido ao sacrifício já mencionado, sem especificar em que consiste sua plena realização.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa coerentes com a oração dirigida a Deus. “Ofertas totalmente queimadas” evita a ambiguidade moderna de “holocaustos”. A pontuação preserva o fluxo cumulativo da súplica e torna legíveis os infinitivos gregos de valor volitivo.
