base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/029.yaml
  text: Blessed are you[a], Lord, the God of our fathers, and praised and highly exalted forever; and blessed is your holy, glorious name, and supremely praised and highly exalted through all the ages.
translation:
  language: pt
  text: Bendito és tu, Senhor, Deus de nossos pais, louvado e altamente exaltado para sempre; e bendito é o teu santo e glorioso nome[a], louvado sobremaneira e altamente exaltado por todos os séculos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “o santo nome da tua glória”. A expressão grega é condensada e também pode ser entendida como “teu santo nome de glória”.'
    reason: Registra a estrutura genitiva e a ambiguidade genuína da expressão grega, enquanto o texto principal emprega português natural.
lexical_decisions:
- source_word: Εὐλογητὸς εἶ
  choice: Bendito és tu
  rationale: Mantém a construção predicativa direta da fórmula de louvor, sem transformá-la em desejo ou ordem.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma consagrada e natural para κύριος no vocativo.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Deus de nossos pais
  rationale: Preserva a formulação familiar e pactual do grego, que emprega o plural masculino πατέρων.
- source_word: αἰνετὸς
  choice: louvado
  rationale: Expressa naturalmente o predicado doxológico e mantém o paralelismo com os demais termos de louvor.
- source_word: ὑπερυψούμενος
  choice: exaltado acima de tudo
  rationale: Comunica a força intensiva do composto grego sem recorrer à expressão redundante 'altamente exaltado'; a mesma tradução é mantida nas duas ocorrências.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a expressão portuguesa idiomática para a duração indefinida indicada no primeiro membro.
- source_word: τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον
  choice: o teu santo e glorioso nome
  rationale: Comunica em português natural tanto a santidade quanto a glória do nome, enquanto a nota registra a estrutura genitiva mais literal.
- source_word: ὑπεραινετὸν
  choice: louvado sobremaneira
  rationale: Distingue o termo intensificado de αἰνετός e preserva a ideia de louvor extraordinário.
- source_word: εἰς ἅπαντας τοὺς αἰῶνας
  choice: por todos os séculos
  rationale: Torna explícito ἅπαντας, 'todos', e conserva a linguagem temporal mais ampla da segunda ocorrência.
theological_decisions:
- issue: Fórmula tradicional de bênção versus predicação direta do grego
  choice: Bendito és tu, Senhor, Deus de nossos pais
  alternative: Bendito seja o Senhor, Deus de nossos pais
  rationale: O grego dirige-se diretamente a Deus na segunda pessoa; a tradução conserva essa forma e seu caráter doxológico.
- issue: Tradução de πατέρων
  choice: pais
  alternative: antepassados
  rationale: O termo grego é masculino plural e integra uma fórmula bíblica familiar; 'pais' preserva essa forma sem acrescentar interpretação.
- issue: Relação entre ὄνομα e δόξα
  choice: teu santo e glorioso nome
  alternative: o santo nome da tua glória
  rationale: A opção principal apresenta em português natural a frase grega comprimida; a alternativa literal é mantida em nota, sem eliminar a ambiguidade da relação genitiva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência doxológica. Evitou-se tanto o arcaísmo quanto a redundância de 'altamente exaltado'; a repetição estrutural do original foi preservada.
