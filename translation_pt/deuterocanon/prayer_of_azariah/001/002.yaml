  source_fidelity: A tradução reproduz com precisão a sequência narrativa, o plural final de καὶ εἶπαν e a identificação dos caldeus. «Confessava» é uma opção lexical possível para ἐξωμολογεῖτο, desde que as alternativas de ação de graças e louvor permaneçam assinaladas. «Era intensamente aquecida» traduz de modo mais direto e menos interpretativo ὑποκαιομένης ... σφόδρα do que «era intensamente atiçada».
