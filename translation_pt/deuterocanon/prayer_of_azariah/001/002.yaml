base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/002.yaml
  text: Then Azariah stood and prayed thus[a], and opening his mouth he gave thanks to the Lord together with his companions in the midst of the fire, while the furnace was being intensely heated by the Chaldeans. And they said,
translation:
  language: pt
  text: 'Então Azarias se pôs de pé e orou assim e, abrindo a boca, confessava[a] ao Senhor, junto com seus companheiros, no meio do fogo, enquanto a fornalha era intensamente aquecida pelos caldeus. E disseram:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dava graças” ou “louvava”; o verbo grego pode indicar confissão, ação de graças ou louvor, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: se pôs de pé
  rationale: Reproduz a ação anterior expressa pelo particípio aoristo de ἵστημι de maneira natural em português.
- source_word: προσηύξατο οὕτως
  choice: orou assim
  rationale: Traduz diretamente o verbo de oração e introduz com clareza o conteúdo que vem a seguir.
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: Abrindo a boca
  rationale: Mantém a expressão narrativa solene do grego, sem reduzi-la simplesmente a “disse”.
- source_word: ἐξωμολογεῖτο
  choice: confessava
  rationale: O imperfeito conserva a ação em curso, e “confessava” preserva o reconhecimento da justiça de Deus e do pecado presente na oração subsequente; os sentidos de ação de graças e louvor são registrados em nota.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: No contexto escriturístico judaico, κύριος é uma referência reverente a Deus.
- source_word: ἅμα τοῖς συνεταίροις αὐτοῦ
  choice: junto com seus companheiros
  rationale: Expressa de modo corrente o acompanhamento indicado por ἅμα e συνεταῖροι.
- source_word: ἐν μέσῳ τῷ πυρί
  choice: no meio do fogo
  rationale: Mantém a localização vívida e a dignidade da narrativa em linguagem acessível.
- source_word: ὑποκαιομένης τῆς καμίνου ... σφόδρα
  choice: enquanto a fornalha era intensamente atiçada
  rationale: Representa a construção absoluta e a ação contínua de alimentar ou avivar fortemente o fogo da fornalha.
- source_word: ὑπὸ τῶν Χαλδαίων
  choice: pelos caldeus
  rationale: Conserva a designação étnica explícita do texto grego, sem generalizá-la para “babilônios”.
- source_word: καὶ εἶπαν
  choice: 'E disseram:'
  rationale: Preserva o plural transmitido no grego, ainda que a mudança do sujeito singular para o plural seja abrupta.
theological_decisions:
- issue: Sentido de ἐξωμολογεῖτο numa oração que contém confissão, louvor e reconhecimento de Deus
  choice: confessava
  alternative: dava graças; louvava
  rationale: A oração subsequente reconhece tanto a justiça divina quanto o pecado do povo, favorecendo “confessava”, mas a amplitude do verbo no grego bíblico exige que os sentidos de ação de graças e louvor permaneçam visíveis em nota.
- issue: Número do sujeito em καὶ εἶπαν
  choice: E disseram
  alternative: E ele disse
  rationale: O plural é a leitura explícita da fonte e pode incluir Azarias e seus companheiros; não deve ser harmonizado silenciosamente com o sujeito singular anterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a expressão solene “abrindo a boca”, o aspecto contínuo de ἐξωμολογεῖτο e a mudança abrupta para o plural no encerramento.
