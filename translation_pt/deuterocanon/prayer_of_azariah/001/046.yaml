base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/046.yaml
  text: Bless the Lord, frost and cold; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, geada e frio; cantem louvores a ele e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca elementos da criação a bendizer o Senhor. “Bendigam” preserva a força litúrgica e doxológica do verbo no refrão.
- source_word: πάγος
  choice: geada
  rationale: Embora possa significar gelo ou geada, o sentido atmosférico harmoniza melhor com ψῦχος e distingue a geada do frio em geral.
- source_word: ψῦχος
  choice: frio
  rationale: Tradução direta e natural do substantivo, adequada ao par poético com “geada”.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Reproduz diretamente κύριος neste hino grego e segue o uso consagrado em português sem introduzir uma forma tipográfica ligada ao nome divino hebraico.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Expressa tanto o louvor quanto a nuance musical do verbo, em linguagem clara e corrente.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O advérbio comunica a intensificação presente no verbo composto sem sugerir uma comparação ausente do grego.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático e natural para a duração contínua expressa pela fórmula neste refrão.
theological_decisions:
- issue: Tradução de κύριος em um hino grego deuterocanônico
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto-fonte traz κύριον. “O Senhor” mantém a formulação grega sem pressupor que aqui se deva representar tipograficamente o tetragrama hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos na terceira pessoa do plural para favorecer a legibilidade brasileira. A ordem do grego foi mantida de modo natural, tratando “geada e frio” como vocativo posposto.
