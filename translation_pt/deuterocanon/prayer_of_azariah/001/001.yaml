base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/001.yaml
  text: Thus Hananiah and Azariah and Mishael prayed[b][a], and they sang praise to the Lord when the king ordered them to be thrown into the furnace.
translation:
  language: pt
  text: Assim, Hananias, Azarias e Misael[a] oraram e cantaram louvores ao Senhor, quando o rei ordenou que fossem lançados[b] na fornalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz aqui os nomes hebraicos Hananias, Azarias e Misael, e não os nomes babilônicos Sadraque, Mesaque e Abede-Nego.
    reason: cross_reference
  - marker: b
    text: 'Ou: fossem atirados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως οὖν
  choice: Foi assim, pois, que
  rationale: Preserva tanto a ideia de modo expressa por οὕτως (“assim”) quanto a força conectiva de οὖν (“pois”), em construção natural e digna em português.
- source_word: προσηύξατο
  choice: oraram
  rationale: O verbo significa simplesmente “orar”. Embora a forma grega esteja no singular, o sujeito composto nomeia os três jovens; o plural é exigido pela concordância natural em português.
- source_word: Ἀνανίας καὶ Ἀζαρίας καὶ Μισαήλ
  choice: Hananias, Azarias e Misael
  rationale: Empregam-se as formas portuguesas tradicionais dos nomes hebraicos representados no texto grego, sem substituí-las pelos nomes babilônicos.
- source_word: ὕμνησαν
  choice: cantaram louvores
  rationale: Mantém o componente musical de ὑμνέω, que seria enfraquecido por uma tradução apenas como “louvaram”.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Neste contexto de oração e louvor, κύριος se refere a Deus; “Senhor” preserva o uso bíblico e teológico habitual.
- source_word: ὅτε
  choice: quando
  rationale: Traduz diretamente a conjunção temporal sem impor uma sequência mais forte, como “depois que”.
- source_word: προσέταξεν ἐμβληθῆναι
  choice: ordenou que fossem lançados
  rationale: Reproduz a ordem régia e o infinitivo passivo grego em uma construção idiomática portuguesa, sem identificar agentes não mencionados.
- source_word: εἰς τὴν κάμινον
  choice: na fornalha
  rationale: “Fornalha” corresponde bem a κάμινος no cenário de Daniel. A preposição portuguesa “na”, com o verbo “lançar”, comunica naturalmente o movimento para dentro.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: senhor ou soberano
  rationale: O referente é Deus em contexto de oração e cântico; “Senhor” mantém o uso escritural sem reduzir o termo a um título meramente social.
- issue: Forma dos nomes dos três jovens
  choice: Hananias, Azarias e Misael
  alternative: Sadraque, Mesaque e Abede-Nego
  rationale: O texto grego apresenta aqui os nomes hebraicos em forma grega, não os nomes babilônicos; a tradução conserva essa distinção textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A construção “Foi assim, pois, que” conserva a referência ao modo da oração que se segue, sem rigidez excessiva; “cantaram louvores” preserva explicitamente o sentido musical.
