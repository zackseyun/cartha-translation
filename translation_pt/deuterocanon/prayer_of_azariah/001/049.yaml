base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/049.yaml
  text: Bless the Lord[a], light and darkness; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, luz e trevas; cantem-lhe louvores e exaltem-no grandemente para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “pelos séculos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: Imperativo plural dirigido à luz e às trevas; preserva a força litúrgica e doxológica do verbo.
- source_word: φῶς καὶ σκότος
  choice: luz e trevas
  rationale: Mantém o par cósmico de opostos; “trevas” é natural no registro bíblico e poético em português.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Objeto direto do imperativo; é a forma portuguesa consagrada e natural para κύριος neste contexto.
- source_word: ὑμνεῖτε
  choice: cantem-lhe louvores
  rationale: Expressa tanto o ato de louvar quanto a nuance musical e litúrgica do verbo grego.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O advérbio comunica de modo natural a intensificação presente no verbo composto grego.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático da fórmula doxológica, com nota que preserva sua forma mais literal.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: Senhor
  rationale: O artigo é natural em português quando “Senhor” funciona como objeto direto nesta exortação litúrgica.
- issue: Fórmula doxológica εἰς τοὺς αἰῶνας
  choice: para sempre
  alternative: pelos séculos
  rationale: “Para sempre” comunica claramente a duração perpétua em português moderno, enquanto a nota conserva a imagem temporal do grego.
translation_notes:
  register: Português moderno, claro e digno, com cadência litúrgica. O plural verbal concorda com os dois elementos personificados, “luz e trevas”; a colocação pronominal em “cantem-lhe” e “exaltem-no” preserva fluidez e solenidade sem arcaísmo excessivo.
