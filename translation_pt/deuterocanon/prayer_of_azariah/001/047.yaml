  text: Bless the Lord[a], frost and snow[b]; sing hymns and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, geadas[a] e neves; cantem hinos e exaltem-no grandemente para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escarchas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “pelos séculos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca elementos da criação a bendizer o Senhor. “Bendigam” preserva a forma litúrgica recorrente do cântico e a ideia de falar bem de Deus.
- source_word: πάχναι
  choice: geadas
  rationale: O substantivo plural designa geada, escarcha ou uma camada de gelo formada pelo frio. “Geadas” é claro, corrente e mantém o plural grego.
- source_word: χιόνες
  choice: neves
  rationale: O grego está no plural. “Neves” é compreensível em linguagem poética e preserva a personificação plural dos fenômenos naturais.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: É a tradução portuguesa natural de κύριος neste contexto grego e não exige a grafia interpretativa “SENHOR”.
- source_word: ὑμνεῖτε
  choice: cantem hinos
  rationale: O verbo indica louvar por meio de um hino; a tradução mantém explicitamente a dimensão musical.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no grandemente
  rationale: O verbo intensivo significa exaltar de modo extraordinário. “Grandemente” preserva a intensificação sem recorrer a uma formulação excessivamente arcaica.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: A expressão significa duração contínua ou perpétua neste refrão. “Para sempre” é a formulação idiomática e clara em português; a forma mais literal é registrada em nota.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto grego traz κύριος, e nada neste versículo exige representar graficamente o nome da aliança. “O Senhor” preserva o dado textual sem acrescentar essa identificação interpretativa.
translation_notes:
  register: Português moderno, digno e próprio para leitura pública, com imperativos na terceira pessoa do plural, naturais tanto no Brasil quanto em uso internacional. A ordem vocativa e o paralelismo litúrgico do cântico foram preservados.
