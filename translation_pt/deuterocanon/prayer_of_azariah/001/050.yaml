  text: Bless the Lord, lightnings and clouds; sing praise to him and highly exalt him forever.
translation:
  language: pt
  text: Bendigam o Senhor, relâmpagos e nuvens; cantem louvores a ele e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: Imperativo plural dirigido conjuntamente aos relâmpagos e às nuvens; conserva a forma de convocação litúrgica.
- source_word: ἀστραπαὶ
  choice: relâmpagos
  rationale: Plural concreto correspondente ao plural grego, sem reduzi-lo a um singular coletivo.
- source_word: νεφέλαι
  choice: nuvens
  rationale: Equivalente comum e direto para o plural grego.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Expressa naturalmente em português o ato de louvar com hinos ou cânticos.
- source_word: ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  rationale: Reproduz a força intensiva do verbo grego, mais forte que simplesmente 'exaltem'.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Formulação portuguesa natural para a expressão idiomática de duração indefinida ou eterna.
theological_decisions:
- issue: Referente de αὐτόν
  choice: a ele / -no, referindo-se ao Senhor
  alternative: repetir 'o Senhor' em cada oração
  rationale: Os pronomes preservam a coesão e a referência inequívoca do texto grego sem expansão interpretativa.
- issue: Força de ὑπερυψοῦτε
  choice: exaltem-no acima de tudo
  alternative: exaltem-no grandemente
  rationale: A escolha mantém a intensidade do composto grego sem introduzir uma categoria teológica ausente.
translation_notes:
  register: Português moderno, solene e acessível, com imperativos no plural e paralelismo poético preservado. Usa 'Senhor' conforme o grego κύριον, sem versalete, pois não se trata aqui de uma representação direta do tetragrama hebraico.
