base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/026.yaml
  text: But the angel of the Lord went down into the furnace together with those around Azariah[a], and drove the flame of the fire out of the furnace,
translation:
  language: pt
  text: Mas o anjo do Senhor desceu para dentro da fornalha, junto com os que estavam ao redor de Azarias[a], e expulsou da fornalha a chama do fogo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os companheiros de Azarias”. Em sentido mais literal, o grego diz “os que estavam ao redor de Azarias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mas
  rationale: δέ dá continuidade à narrativa com leve contraste em relação ao perigo anterior; “Mas” preserva esse movimento sem o exagerar.
- source_word: ἄγγελος Κυρίου
  choice: o anjo do Senhor
  rationale: O artigo grego e o genitivo Κυρίου são representados pela expressão portuguesa natural e tradicional, sem definir além do texto a identidade do anjo.
- source_word: συνκατέβη ἅμα
  choice: desceu ... junto com
  rationale: A combinação exprime movimento descendente e companhia; a construção portuguesa distribui naturalmente essas duas ideias.
- source_word: τοῖς περὶ τὸν Ἀζαρίαν
  choice: os que estavam ao redor de Azarias
  rationale: Mantém a imagem literal e a relativa amplitude da expressão grega; uma nota oferece a leitura contextual mais idiomática, “os companheiros de Azarias”.
- source_word: κάμινον
  choice: fornalha
  rationale: “Fornalha” é o termo corrente e adequado ao contexto do forno ardente em Daniel.
- source_word: ἐξετίναξεν
  choice: expulsou
  rationale: O verbo comunica remoção vigorosa, literalmente semelhante a sacudir ou lançar para fora; “expulsou” preserva a força de afastamento com clareza.
- source_word: τὴν φλόγα τοῦ πυρός
  choice: a chama do fogo
  rationale: Reproduz a construção genitiva e sua imagem enfática sem suavização desnecessária.
- source_word: ἐκ τῆς καμίνου
  choice: da fornalha
  rationale: No contexto de “expulsou”, “da fornalha” expressa de modo natural o movimento para fora indicado por ἐκ.
theological_decisions:
- issue: Tradução de Κυρίου
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: “Senhor” corresponde naturalmente ao grego κύριος nesta narrativa e evita importar uma convenção tipográfica própria da representação do nome divino hebraico.
- issue: Identidade do “anjo do Senhor”
  choice: Conservar a designação sem especificar sua natureza
  alternative: Identificá-lo como teofania; identificá-lo como mero mensageiro criado
  rationale: O versículo apenas o chama de “o anjo do Senhor”; a tradução preserva a tensão teológica e não acrescenta uma identificação que o texto não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Azarias” segue a forma portuguesa tradicional do nome. A vírgula final foi mantida porque o texto-fonte continua no versículo seguinte.
