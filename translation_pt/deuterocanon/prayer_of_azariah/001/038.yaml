  source_fidelity: A tradução preserva corretamente a construção exortativa de terceira pessoa em εὐλογείτω, o singular potencialmente coletivo/distributivo de πᾶσα ἡ δύναμις, «o Senhor» para τὸν κύριον e «para sempre» para εἰς τοὺς αἰῶνας. A alternância subsequente para imperativos plurais também corresponde ao grego. Contudo, «acima de tudo» torna a intensificação de ὑπερυψοῦτε uma comparação explícita com outras coisas; «grandemente» transmite melhor a força intensiva sem acrescentar esse enquadramento comparativo.
