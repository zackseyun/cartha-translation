  terminology: «Poder» conserva deliberadamente a amplitude de δύναμις, sem interpretar como hostes ou seres angélicos. «Bendiga», «louvores», «exaltem» e «o Senhor» mantêm registro bíblico-litúrgico moderno. A nota continua necessária para registrar que o singular grego pode ter valor distributivo ou coletivo.
