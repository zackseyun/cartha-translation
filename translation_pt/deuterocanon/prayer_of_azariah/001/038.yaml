base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/038.yaml
  text: Let every power bless the Lord[a]; sing praise and highly exalt him forever.
translation:
  language: pt
  text: Que todo poder bendiga o Senhor[a]; cantem louvores e exaltem-no grandemente para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Todos os poderes bendigam o Senhor». O grego emprega «poder» no singular com «todo», expressão que pode ser entendida de modo distributivo ou coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογείτω
  choice: Que ... bendiga
  rationale: O imperativo de terceira pessoa é expresso naturalmente em português por «Que ... bendiga», preservando a força exortativa.
- source_word: πᾶσα ἡ δύναμις
  choice: todo poder
  rationale: Mantém o singular grego e sua possível leitura distributiva ou coletiva, sem restringir o referente a exércitos ou seres angélicos.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Forma portuguesa natural para κύριος como título neste contexto litúrgico.
- source_word: ὑμνεῖτε
  choice: cantem louvores
  rationale: Preserva a ideia específica de louvor cantado e verte adequadamente o imperativo plural.
- source_word: ὑπερυψοῦτε
  choice: exaltem acima de tudo
  rationale: Comunica a intensificação presente no verbo composto ὑπερυψόω em linguagem clara e digna.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que retoma «o Senhor», evitando repetição desnecessária.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático em português para a expressão grega de duração contínua.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: Senhor
  rationale: O artigo definido é natural como objeto de «bendiga» e preserva κύριος como título, sem introduzir identificação denominacional adicional.
- issue: Alcance de πᾶσα ἡ δύναμις
  choice: todo poder
  alternative: todos os poderes
  rationale: A escolha conserva o singular do grego e deixa aberta sua nuance distributiva ou coletiva, sem limitar o chamado a uma classe específica de poderes.
translation_notes:
  register: Português moderno, claro e litúrgico, com imperativos exortativos naturais. A alternância entre o singular «bendiga» e os plurais «cantem» e «exaltem» segue a mudança do grego de terceira pessoa singular para segunda pessoa plural, preservando a forma do texto sem eliminar sua tensão gramatical.
