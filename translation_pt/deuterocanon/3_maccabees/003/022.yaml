lexical_decisions:
- source_word: τούναντίον
  choice: o contrário
  rationale: No contexto de ἐκδεχόμενοι, expressa aquilo que eles esperavam em oposição ao bem mencionado no contexto.
- source_word: ἐκδεχόμενοι
  choice: esperavam
  rationale: O particípio indica aguardar ou esperar algo; «esperavam» é natural e preserva a postura mental descrita.
- source_word: συμφύτῳ
  choice: inata
  rationale: Literalmente, algo que cresceu junto com a pessoa; «inata» comunica uma disposição arraigada sem ampliar indevidamente o sentido.
- source_word: κακοηθείᾳ
  choice: maldade
  rationale: Designa mau caráter ou disposição maligna; «maldade» é corrente, digna e suficientemente abrangente.
- source_word: τὸ καλόν
  choice: o que é bom
  rationale: O neutro substantivado aponta para o bem em sentido moral; a formulação é clara em português moderno.
- source_word: ἀπωσάμενοι
  choice: repeliam
  rationale: Preserva a imagem vigorosa de afastar ou rejeitar, e o aspecto subordinado foi ajustado à fluência da sequência portuguesa.
- source_word: διηνεκῶς
  choice: continuamente
  rationale: Expressa uma ação persistente ou habitual.
- source_word: φαῦλον
  choice: o que é vil
  rationale: Conserva o sentido moral de algo baixo, indigno ou mau, sem reduzi-lo apenas à ideia abstrata de mal.
- source_word: ἐκνεύοντες
  choice: desviando-se
  rationale: Mantém a imagem de afastamento ou desvio moral em direção ao que é vil.
