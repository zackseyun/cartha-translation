lexical_decisions:
- source_word: μὴ ... παροραθήσεσθαι
  choice: não deve ser desconsiderada
  rationale: O passivo de παροράω pode significar ser ignorado, negligenciado ou desconsiderado. A formulação preserva a força negativa e evita repetir «ignorar», usado na oração participial.
- source_word: γὰρ
  choice: pois
  rationale: γάρ introduz a justificativa ou explicação da afirmação anterior; «pois» mantém essa ligação discursiva em português natural.
- source_word: οὕτω
  choice: dessa maneira
  rationale: 'A posição de οὕτω permite ligá-lo a παροραθήσεσθαι: a organização não deve ser desconsiderada «assim/dessa maneira». Essa leitura preserva o advérbio sem fundi-lo necessariamente com τηλικοῦτο.'
- source_word: τηλικοῦτο
  choice: tão grande
  rationale: τηλικοῦτος indica grandeza de dimensão, grau ou importância. «Tão grande» conserva a ênfase sem decidir entre tamanho numérico e relevância.
- source_word: σύστημα
  choice: organização
  rationale: σύστημα designa um conjunto constituído ou corpo organizado. «Organização» é claro no contexto coletivo e administrativo, embora «corpo» ou «comunidade organizada» também sejam possíveis.
- source_word: μηδὲν ἠγνοηκός
  choice: sem ignorar coisa alguma
  rationale: A expressão traduz de modo próximo o particípio perfeito de ἀγνοέω com objeto negativo, conservando a ideia de não desconhecer nada sem convertê-la em mera diligência ou ausência de omissões.
