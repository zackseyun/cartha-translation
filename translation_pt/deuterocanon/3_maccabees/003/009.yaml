  text: For so great an organization[a], lacking no knowledge, must not be overlooked.
translation:
  language: pt
  text: Pois uma organização tão grande[a], sem ignorar coisa alguma, não deve ser desconsiderada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um corpo organizado tão grande».'
