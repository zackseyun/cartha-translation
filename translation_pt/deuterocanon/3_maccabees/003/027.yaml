  text: But whoever shelters any of the Jews[a], from old man to infant, even to those at the breast, will be beaten to death with the most hateful tortures[b], together with his whole household.
translation:
  language: pt
  text: Mas quem der abrigo a qualquer judeu, desde o idoso até a criança, até mesmo bebês de peito[a], será espancado até a morte com as torturas mais odiosas[b], juntamente com todos os de sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos lactentes” ou “aos que ainda mamam”; o termo grego raro se refere a bebês ainda amamentados.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego descreve uma execução brutal por espancamento; também pode ser traduzido, de modo mais técnico, por “será morto a golpes” ou “será torturado sobre uma roda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεπάσῃ
  choice: der abrigo
  rationale: No contexto de uma ameaça legal, o verbo indica acolher, proteger ou esconder alguém das autoridades. “Der abrigo” exprime naturalmente tanto o refúgio quanto a proteção, sem se limitar ao ato físico de esconder.
- source_word: τινα τῶν Ἰουδαίων
  choice: a qualquer judeu
  rationale: A construção é partitiva e indefinida, literalmente “alguém dentre os judeus”. “Qualquer judeu” comunica esse alcance de modo claro e idiomático em português.
- source_word: ἀπὸ γεραιοῦ μέχρι νηπίου
  choice: desde o idoso até a criança
  rationale: A expressão abrange as idades do mais velho ao muito pequeno. “Idoso” evita restringir desnecessariamente o referente a um homem, enquanto “criança” permite que a expressão seguinte especifique os bebês ainda amamentados.
- source_word: καὶ μέχρι ὑπομαστιγίων
  choice: inclusive aos bebês de peito
  rationale: O termo raro designa crianças ainda junto ao peito, isto é, lactentes. “Bebês de peito” conserva a imagem concreta do grego e é compreensível em português atual.
- source_word: ἐχθίσταις βασάνοις
  choice: com as torturas mais odiosas
  rationale: O superlativo de ἐχθρός comunica algo extremamente odioso ou repugnante, e βάσανοι designa tormentos ou torturas, especialmente de caráter judicial. A formulação preserva a forte carga avaliativa do grego.
- source_word: ὑποτυμπανισθήσεται
  choice: será espancado até a morte
  rationale: O verbo se refere a uma execução brutal por golpes, possivelmente ligada a um instrumento ou estrutura de suplício. A tradução apresenta o sentido central de forma inteligível, deixando a incerteza técnica para a nota.
- source_word: πανοικίᾳ
  choice: juntamente com todos os de sua casa
  rationale: A forma adverbial significa “com toda a casa”, isto é, com todo o grupo doméstico. “Todos os de sua casa” mantém um alcance mais amplo que apenas parentes consanguíneos.
