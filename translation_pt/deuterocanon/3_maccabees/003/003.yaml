lexical_decisions:
- source_word: εὔνοιαν
  choice: boa vontade
  rationale: Expressa uma disposição favorável e benevolente em relação aos governantes, de modo natural no português contemporâneo.
- source_word: πίστιν
  choice: lealdade
  rationale: Neste contexto político, indica fidelidade e confiabilidade para com os reis, não fé religiosa.
- source_word: ἀδιάστροφον
  choice: inabaláveis
  rationale: O adjetivo grego, no singular, qualifica conjuntamente a boa vontade e a lealdade como não desviadas nem alteradas; em português, o plural concorda naturalmente com os dois substantivos.
- source_word: φυλάσσοντες
  choice: mantinham
  rationale: Com substantivos abstratos como objetos, o verbo tem o sentido idiomático de conservar ou manter.
- source_word: πρὸς τοὺς βασιλεῖς
  choice: para com os reis
  rationale: Preserva a relação dirigida aos reis e mantém explicitamente o plural do grego.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Mas os judeus
  rationale: δέ introduz aqui um contraste com o contexto anterior, adequadamente expresso por “Mas”.
theological_decisions:
- issue: Sentido de πίστις em contexto político e não religioso
  choice: lealdade
  alternative: fidelidade
  rationale: A relação explícita com os reis exige o sentido sociopolítico de constância e confiabilidade, evitando a leitura de “fé” como crença religiosa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o contraste inicial, o plural “reis” e a ideia de constância compartilhada por “boa vontade” e “lealdade”.
