  yaml_path: translation/deuterocanon/3_maccabees/003/020.yaml
  text: But we[a], having borne with their folly, and having been carried through with victory, and having met all the nations in Egypt with humanity[b], did what was fitting.
translation:
  language: pt
  text: Nós, porém, tendo suportado com paciência a insensatez deles[a], tendo sido conduzidos com vitória e tendo ido ao encontro de todos os povos no Egito com benevolência[b], fizemos o que era apropriado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo agido com brandura diante da insensatez deles”. O particípio grego pode indicar tolerância paciente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tendo encontrado todos os povos no Egito de modo humano” ou “benevolente”. O verbo também pode sugerir recebê-los favoravelmente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίᾳ
  choice: insensatez
  rationale: Expressa falta de bom senso ou entendimento sem sugerir necessariamente loucura clínica; mantém a força moral e intelectual do grego.
- source_word: συμπεριενεχθέντες
  choice: tendo suportado com paciência
  rationale: O particípio passivo de συμπεριφέρω, neste contexto, indica uma atitude de tolerância e condescendência; a formulação explicita a ideia de paciente indulgência sem recorrer ao coloquial 'aturado'.
- source_word: μετὰ νίκης
  choice: vitoriosamente
  rationale: Reproduz de modo natural em português a circunstância expressa literalmente por 'com vitória', sem acrescentar a conotação cerimonial de 'em triunfo'.
- source_word: διακομισθέντες
  choice: tendo sido conduzidos
  rationale: Preserva a voz passiva e a ideia de terem sido levados em segurança através de uma jornada ou de acontecimentos, sem especificar aquilo que o texto deixa implícito.
- source_word: τοῖς πᾶσιν ἔθνεσιν
  choice: todos os povos
  rationale: Neste contexto político, ἔθνη designa grupos ou povos sujeitos; 'povos' é mais natural que 'nações' e não introduz o contraste religioso sugerido por 'gentios'.
- source_word: ἀπαντήσαντες ... φιλανθρώπως
  choice: tendo tratado com humanidade
  rationale: Embora ἀπαντάω signifique basicamente 'encontrar-se com', a combinação com o advérbio descreve a maneira como o rei afirma ter lidado com os povos; esta solução produz português natural e conserva a retórica de benevolência.
- source_word: καθὼς ἔπρεπεν
  choice: o que era apropriado
  rationale: Comunica a noção de conduta conveniente ou própria e preserva o tom formal da justificação régia.
theological_decisions:
- issue: Autopresentação régia de benevolência para com os povos sujeitos
  choice: Apresentar diretamente as afirmações na voz do rei, sem validá-las nem contestá-las.
  alternative: Acrescentar linguagem que sinalize ironia, propaganda ou hipocrisia.
  rationale: O grego preserva a retórica autojustificadora da declaração régia; introduzir uma avaliação explícita iria além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A sequência de particípios foi mantida para refletir a estrutura retórica do original, enquanto 'vitoriosamente' e 'tratado com humanidade' evitam construções excessivamente literais ou pouco idiomáticas.
