  yaml_path: translation/deuterocanon/3_maccabees/003/026.yaml
  text: For if these men are punished all together[a], we will leave for the time that remains with complete confidence that our affairs will be established in stability and in the best condition.
translation:
  language: pt
  text: Pois, se todos eles forem punidos de uma só vez, estaremos plenamente certos de que, no tempo restante, nossos assuntos serão estabelecidos com estabilidade e nas melhores condições.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “deixaremos ... que nossos assuntos sejam estabelecidos”. A construção grega é um tanto condensada; o sentido é que, depois de essas pessoas serem punidas, os assuntos do reino permanecerão estabilizados no futuro.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτων
  choice: eles
  rationale: O demonstrativo retoma o grupo de pessoas mencionado no contexto; o pronome explicita a referência pessoal sem acrescentar uma designação ausente do grego.
- source_word: ὁμοῦ
  choice: todos eles ... de uma só vez
  rationale: A expressão comunica tanto o tratamento coletivo quanto a simultaneidade sugerida pelo advérbio.
- source_word: κολαθέντων
  choice: forem punidos
  rationale: O particípio aoristo passivo exprime a punição coerciva prevista pela política real.
- source_word: λείψαμεν
  choice: deixaremos
  rationale: Preserva a força verbal da primeira pessoa do plural e a construção comprimida do texto de Swete.
- source_word: εἰς τὸν ἐπίλοιπον χρόνον
  choice: para o tempo restante
  rationale: Mantém explícita a referência ao período futuro que ainda resta.
- source_word: τελείως ἡμῖν
  choice: com plena confiança
  rationale: Expressa idiomaticamente a segurança completa dos falantes quanto ao resultado esperado.
- source_word: τὰ πράγματα
  choice: nossos assuntos
  rationale: Termo abrangente adequado à voz governamental, sem especificar além do grego.
- source_word: ἐν εὐσταθείᾳ
  choice: com estabilidade
  rationale: Conserva o sentido de firmeza e estabilidade da situação.
- source_word: τῇ βελτίστῃ διαθέσει
  choice: nas melhores condições
  rationale: διάθεσις se refere aqui ao estado ou à condição dos assuntos, não a uma disposição emocional.
- source_word: κατασταθήσεσθαι
  choice: sejam estabelecidos
  rationale: Reflete o infinitivo futuro passivo e a ideia de os assuntos serem postos em estado firme e ordenado.
