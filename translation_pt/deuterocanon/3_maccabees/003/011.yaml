base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/011.yaml
  text: 'So then[a], puffed up by his present prosperity, and not perceiving the power of the greatest God, but supposing that he would continue forever in the same purpose, he wrote this letter against them:'
translation:
  language: pt
  text: 'Ele, portanto, inchado de orgulho por causa da prosperidade do momento e sem perceber o poder do maior Deus[a], mas supondo que permaneceria para sempre no mesmo propósito, escreveu contra eles esta carta:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, «do Deus Altíssimo». O grego diz literalmente «do maior Deus».
    reason: Registra uma alternativa bíblica mais familiar sem ocultar a forma superlativa exata do texto grego.
lexical_decisions:
- source_word: Ἐκεῖνος μὲν οὖν
  choice: Ele, portanto
  rationale: Mantém o pronome demonstrativo que retoma a personagem e expressa de modo natural a transição indicada por μὲν οὖν.
- source_word: τῇ κατὰ τὸ παρὸν εὐημερίᾳ
  choice: por causa da prosperidade do momento
  rationale: εὐημερία indica uma situação favorável ou próspera; κατὰ τὸ παρόν limita essa condição ao momento presente e prepara a ironia de sua transitoriedade.
- source_word: γεγαυρωμένος
  choice: inchado de orgulho
  rationale: Preserva a imagem de alguém inflado pela arrogância, com linguagem corrente e expressiva em português.
- source_word: οὐ καθορῶν
  choice: sem perceber
  rationale: Expressa a falta de reconhecimento ou compreensão, e não apenas a ausência de visão física.
- source_word: κράτος
  choice: poder
  rationale: Representa de forma clara a força soberana e atuante atribuída a Deus.
- source_word: τοῦ μεγίστου θεοῦ
  choice: do maior Deus
  rationale: Reproduz diretamente o superlativo μέγιστος, sem substituí-lo silenciosamente pelo título bíblico convencional «Altíssimo».
- source_word: ὑπολαμβάνων
  choice: supondo
  rationale: Indica a conclusão subjetiva e equivocada da personagem sem acrescentar certeza ao texto.
- source_word: διηνεκῶς
  choice: para sempre
  rationale: No contexto, comunica a expectativa de continuidade indefinida, não uma afirmação metafísica de eternidade.
- source_word: ἐν τῇ αὐτῇ διαμένειν βουλῇ
  choice: permaneceria para sempre no mesmo propósito
  rationale: Mantém a ideia de persistir na mesma intenção, decisão ou política, preservando a amplitude semântica de βουλή.
- source_word: ἔγραφεν κατʼ αὐτῶν ἐπιστολὴν τήνδε
  choice: escreveu contra eles esta carta
  rationale: O contexto hostil favorece o sentido adversativo de κατά; «esta carta» conserva a referência prospectiva ao texto que vem em seguida.
theological_decisions:
- issue: Tradução de τοῦ μεγίστου θεοῦ
  choice: do maior Deus
  alternative: do Deus Altíssimo
  rationale: O grego emprega o superlativo de μέγας, literalmente «maior» ou «máximo», e não a expressão grega convencional para «Altíssimo». A tradução principal preserva essa formulação, enquanto a nota registra a alternativa idiomática e tradicional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção «inchado de orgulho» conserva a imagem do grego; «prosperidade do momento» destaca a natureza circunstancial e passageira do êxito. O marcador [a] aparece junto à expressão a que a nota se refere.
