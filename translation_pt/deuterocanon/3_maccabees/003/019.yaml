  yaml_path: translation/deuterocanon/3_maccabees/003/019.yaml
  text: And by making their hostility toward us plain, they, alone among the nations, act arrogantly toward kings and toward their own benefactors, and are willing to offer nothing sincere.
translation:
  language: pt
  text: E, deixando evidente a hostilidade deles contra nós, eles, únicos entre os povos, agem com arrogância para com os reis e os seus próprios benfeitores e não se dispõem a oferecer nada de sincero.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυσμένειαν
  choice: hostilidade
  rationale: Expressa de modo direto a inimizade ou disposição hostil indicada pelo substantivo grego.
- source_word: μονώτατοι τῶν ἐθνῶν
  choice: únicos entre os povos
  rationale: Preserva a afirmação enfática do superlativo grego sem tornar a frase artificial em português.
- source_word: ὑψαυχνοῦντες
  choice: agem com arrogância
  rationale: Comunica a ideia de altivez e insubmissão da expressão grega em linguagem atual e digna.
- source_word: γνήσιον
  choice: sincero
  rationale: Mantém a referência aberta a algo autêntico, leal ou de boa-fé, sem acrescentar um objeto que o grego não especifica.
- source_word: φέρειν
  choice: oferecer
  rationale: Neste contexto, traduz a ideia ampla de apresentar ou prestar algo, preservando a indeterminação do objeto.
theological_decisions:
- issue: Caráter acusatório da declaração
  choice: Manter a acusação na voz e nos termos do emissor, sem endossá-la nem atenuá-la.
  alternative: Reformular a frase para indicar explicitamente que se trata de propaganda ou de uma alegação falsa.
  rationale: O versículo apresenta a acusação diretamente; inserir uma avaliação externa ultrapassaria o texto desta unidade.
translation_notes:
  register: Português moderno, claro e formal, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção preserva a retórica acusatória e a indeterminação de γνήσιον sem importar explicações confessionais.
