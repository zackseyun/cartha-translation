  yaml_path: translation/deuterocanon/3_maccabees/003/017.yaml
  text: But although they accepted our presence in word[a], in deed they were false, when we eagerly desired to enter into their temple and honor it with the most splendid and finest offerings[b],
translation:
  language: pt
  text: Mas eles, embora de palavra tenham aceitado a nossa presença[a], na prática agiram com falsidade quando estávamos ansiosos por entrar no templo deles e honrá-lo com ofertas magníficas e belíssimas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenham acolhido verbalmente a nossa presença, mas na realidade tenham agido com falsidade”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por “ofertas” também pode designar presentes dedicados ou ofertas votivas colocadas em um templo.
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ μὲν ... τῷ δὲ πράγματι
  choice: de palavra ... na prática
  rationale: Preserva a antítese retórica entre a aceitação declarada e a conduta efetiva, em português natural e atual.
- source_word: ἀποδεξάμενοι
  choice: tenham aceitado
  rationale: Expressa o ato de receber ou aceitar a presença do rei sem acrescentar a cordialidade mais forte de “acolher”.
- source_word: παρουσίαν
  choice: presença
  rationale: Mantém o sentido direto da presença ou chegada pessoal do governante e preserva a perspectiva do discurso.
- source_word: νόθως
  choice: agiram com falsidade
  rationale: Comunica a ideia adverbial de conduta falsa ou espúria sem reduzir o termo apenas a uma disposição interior insincera.
- source_word: προθυμηθέντων ἡμῶν
  choice: quando nos mostramos desejosos
  rationale: Reproduz a disposição solícita e voluntária expressa pelo genitivo absoluto, evitando uma formulação rígida em português.
- source_word: εἰσελθεῖν εἰς τὸν ναὸν αὐτῶν
  choice: entrar no templo deles
  rationale: Traduz naturalmente o movimento para dentro do templo e mantém a perspectiva externa marcada por “deles”.
- source_word: τοῖς ἐκπρεπέσιν καὶ καλλίστοις ἀναθήμασιν
  choice: com ofertas magníficas e belíssimas
  rationale: Representa os presentes dedicados ao templo e conserva a força enfática dos dois adjetivos.
- source_word: τιμῆσαι
  choice: honrá-lo
  rationale: Expressa de modo conciso o propósito declarado, tendo o templo como referente do pronome.
theological_decisions:
- issue: Sentido e tom da ação pretendida no templo
  choice: Apresentar diretamente a alegação do orador de que desejava honrar o templo com ofertas.
  alternative: Interpretar a frase de modo mais cerimonial como “prestar homenagem no templo deles com presentes votivos”.
  rationale: O texto relata a intenção alegada pelo personagem dentro de seu discurso; a tradução preserva essa afirmação sem endossá-la, atenuá-la ou lhe acrescentar avaliação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase permanece aberta por terminar em vírgula, acompanhando a estrutura sintática do versículo no contexto. Os marcadores [a] e [b] aparecem no texto principal.
