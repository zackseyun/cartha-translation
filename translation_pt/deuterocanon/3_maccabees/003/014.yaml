  text: concerning our campaign into Asia[a], which you yourselves also know, which by the unfailing alliance of the gods was brought, as was fitting, to its conclusion[b],
translation:
  language: pt
  text: quanto à nossa campanha rumo à Ásia, da qual vocês também têm conhecimento, foi levada, como convinha, até o fim pela inabalável[a] aliança dos deuses[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “invencível”. O adjetivo grego ἀρρωστῷ sugere literalmente algo que não é fraco nem enfermo e, portanto, firme, inabalável ou infalível.
    reason: lexical_alternative
  - marker: b
    text: Ou “foi conduzida à sua conclusão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρατείας
  choice: campanha
  rationale: O substantivo designa uma expedição ou campanha militar; “campanha” conserva o sentido marcial com concisão e naturalidade.
- source_word: εἰς τὴν Ἀσίαν
  choice: rumo à Ásia
  rationale: A preposição εἰς expressa movimento em direção à região; “rumo à Ásia” preserva essa força direcional sem impor o sentido de hostilidade de “contra a Ásia”.
- source_word: γενομένης ἡμῖν
  choice: que empreendemos
  rationale: A construção refere-se à campanha realizada pelo próprio remetente e seus associados; a forma verbal explicita essa participação de maneira natural em português.
- source_word: ἧς ἴστε καὶ αὐτοί
  choice: da qual vocês mesmos também têm conhecimento
  rationale: A redação mantém tanto o apelo ao conhecimento dos destinatários quanto a ênfase de αὐτοί e a inclusão expressa por καί.
- source_word: ἀρρωστῷ
  choice: inabalável
  rationale: O adjetivo significa literalmente algo não fraco ou enfermo e, aplicado a συμμαχία, comunica firmeza e segurança. “Inabalável” preserva a imagem sem exagerá-la como “invencível” poderia fazer.
- source_word: συμμαχίᾳ
  choice: aliança
  rationale: O termo pode indicar aliança ou auxílio, especialmente em contexto militar; “aliança” mantém sua forma relacional e combina diretamente com “dos deuses”.
- source_word: τῶν θεῶν
  choice: dos deuses
  rationale: O plural grego deve ser preservado como parte da voz religiosa pagã do governante, sem harmonização monoteísta.
- source_word: κατὰ λόγον
  choice: como convinha
  rationale: A expressão indica conformidade com o que era razoável, apropriado ou esperado. “Como convinha” conserva a nuance avaliativa e o tom régio.
- source_word: ἐπὶ τέλος ἀχθείσης
  choice: foi ... levada até o fim
  rationale: A formulação mantém a voz passiva e expressa claramente a condução da campanha à sua conclusão.
theological_decisions:
- issue: Referência a divindades pagãs no discurso régio
  choice: dos deuses
  alternative: de Deus; com a ajuda divina
  rationale: O texto grego emprega explicitamente o plural τῶν θεῶν. Como se trata da perspectiva de um governante pagão, a tradução conserva essa voz histórica e religiosa em vez de a adaptar à linguagem monoteísta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe explicita o sujeito de “foi levada” para evitar ambiguidade, mas conserva o caráter de oração dependente do contexto maior por meio da vírgula final. Os marcadores foram colocados junto às expressões que efetivamente esclarecem.
