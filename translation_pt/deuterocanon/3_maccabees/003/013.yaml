lexical_decisions:
- source_word: ἔρρωμαι
  choice: estou bem
  rationale: O perfeito médio/passivo de ῥώννυμι é usado idiomaticamente para indicar bem-estar ou boa saúde; “estou bem” é natural e preserva o sentido pessoal.
- source_word: δὲ
  choice: e
  rationale: Aqui δέ atua como conectivo leve, sem contraste forte; “e” mantém a fluidez da declaração.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: eu mesmo
  rationale: A combinação é enfática; “eu mesmo” preserva a ênfase explícita no remetente, embora καί também possa ser entendido como “também”.
- source_word: τὰ πράγματα ἡμῶν
  choice: os nossos assuntos
  rationale: πράγματα pode designar assuntos, circunstâncias ou negócios. “Os nossos assuntos” conserva a amplitude institucional ou política da expressão.
