base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/007.yaml
  text: But they kept spreading talk about the disagreement over acts of homage and foods[a], saying that these people would not become of one way with either the king or his forces, but were hostile and strongly opposed to the affairs of state[b]; and they attached to them no ordinary fear.
translation:
  language: pt
  text: Mas eles continuavam espalhando comentários sobre a divergência quanto aos atos de reverência e aos alimentos[a], afirmando que essas pessoas não adotavam o mesmo modo de viver que o rei e as suas forças, mas eram hostis e se opunham fortemente aos interesses do Estado; e fizeram recair sobre elas um temor nada pequeno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos atos de culto e aos alimentos”. O termo grego também pode designar prostrações ou homenagens, abrangendo atos religiosos e cortesãos de reverência.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “prenderam a elas um temor nada pequeno”; isto é, fizeram com que fossem vistas com grande temor ou suspeita pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάστασιν
  choice: divergência
  rationale: Expressa separação ou desacordo sem exagerar a acusação como rebelião aberta.
- source_word: προσκυνήσεων
  choice: atos de reverência
  rationale: Preserva a ambiguidade entre veneração religiosa e homenagem ou prostração de caráter régio.
- source_word: τροφῶν
  choice: alimentos
  rationale: Traduz diretamente o substantivo, sem explicitar de modo interpretativo leis alimentares.
- source_word: ἐθρύλουν
  choice: continuavam espalhando comentários
  rationale: O imperfeito indica ação reiterada, e o verbo sugere a circulação insistente de falas ou rumores.
- source_word: ὁμοτρόπως ... γίνεσθαι
  choice: não adotavam o mesmo modo de viver
  rationale: Comunica conformidade de conduta ou maneira de vida, e não apenas concordância intelectual.
- source_word: ταῖς δυνάμεσιν
  choice: suas forças
  rationale: Mantém a referência provável às forças ou estruturas de poder do rei sem restringi-la indevidamente ao exército.
- source_word: δυσμενεῖς
  choice: hostis
  rationale: Reflete a acusação de disposição ativamente adversa.
- source_word: μέγα τι τοῖς πράγμασιν ἐναντιουμένους
  choice: se opunham fortemente aos interesses do Estado
  rationale: Torna clara a dimensão político-pública da acusação, enquanto μέγα τι é representado pela intensidade de 'fortemente'.
- source_word: οὐ τῷ τυχόντι ... φόβῳ
  choice: um temor nada pequeno
  rationale: Reproduz de modo natural a expressão enfática que indica um temor considerável.
- source_word: περιήψαντο
  choice: fizeram recair sobre elas
  rationale: Conserva algo da imagem de pôr ou prender algo sobre alguém e permanece compreensível em português.
theological_decisions:
- issue: Se προσκυνήσεων deve ser entendido estritamente como culto ou de modo mais amplo como reverência ritual e régia
  choice: atos de reverência
  alternative: atos de culto; prostrações; homenagens
  rationale: O contexto político permite tanto uma dimensão religiosa quanto cortesã; a formulação escolhida preserva essa tensão.
- issue: Como explicitar o sentido político de τοῖς πράγμασιν
  choice: interesses do Estado
  alternative: assuntos públicos; ordem estabelecida
  rationale: A acusação apresenta o grupo como ameaça ao rei e ao governo, sem exigir que a expressão seja limitada a uma instituição específica.
- issue: A referência de ταῖς δυνάμεσιν
  choice: suas forças
  alternative: autoridades; poderes; exército
  rationale: A opção mantém aberto se estão em vista forças armadas ou, mais amplamente, os meios de poder ligados ao rei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção evita jargão confessional, mantém a ambiguidade político-religiosa de προσκυνήσεων e conserva, de forma natural, a metáfora de περιήψαντο.
