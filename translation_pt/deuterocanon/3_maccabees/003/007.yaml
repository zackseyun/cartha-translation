  terminology: «Atos de reverência», «alimentos», «forças», «hostis», «interesses do Estado» e «temor nada pequeno» são opções defensáveis e conservam as ambiguidades relevantes. A nota a preserva corretamente a possibilidade de sentido cultual ou cortesão.
