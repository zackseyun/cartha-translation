  yaml_path: translation/deuterocanon/3_maccabees/003/006.yaml
  text: So then[a], the foreigners did not at all take into account the beneficence for which the nation was spoken of everywhere;
translation:
  language: pt
  text: Assim, os estrangeiros não levaram em conta de modo algum[a] a boa conduta desse povo, comentada por toda parte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não deram valor algum». O verbo grego está ligado literalmente à ideia de contar ou enumerar, mas aqui significa considerar ou atribuir peso a algo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ... περὶ τὸ γένος ... εὐπραξίαν
  choice: a boa conduta desse povo
  rationale: Neste contexto, εὐπραξία aponta mais naturalmente para o bom proceder ou as boas ações atribuídas ao povo judeu do que para prosperidade. A formulação preserva a relação com γένος sem usar o moderno e potencialmente enganoso «raça».
- source_word: ἐν πᾶσιν θρυλουμένην
  choice: comentada por toda parte
  rationale: O particípio indica algo de que se fala amplamente; com ἐν πᾶσιν, a expressão comunica notoriedade pública generalizada sem acrescentar a ideia mais positiva de «celebrada».
- source_word: οἱ ἀλλόφυλοι
  choice: os estrangeiros
  rationale: ἀλλόφυλοι designa pessoas de outro povo. «Estrangeiros» mantém o contraste étnico-nacional e evita associações neotestamentárias específicas de «gentios».
- source_word: οὐδαμῶς
  choice: de modo algum
  rationale: Reproduz com naturalidade a negação enfática do grego.
- source_word: διηριθμήσαντο
  choice: levaram em conta
  rationale: 'Embora o verbo esteja ligado literalmente a contar ou enumerar, aqui tem força avaliativa: considerar ou atribuir peso a algo.'
- source_word: μὲν οὖν
  choice: Assim
  rationale: Marca a transição e a consequência no discurso de maneira natural em português, sem tentar reproduzir mecanicamente as partículas gregas.
