translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da enumeração grega foi mantida; formas excessivamente literais, como “formar escudos juntos”, foram evitadas. Os pronomes femininos retomam naturalmente “certas pessoas”, embora o grego deixe implícito o objeto dos infinitivos.
