base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/010.yaml
  text: And already some neighbors and friends and business associates[a], secretly drawing certain people aside, were giving assurances that they would join in protecting them and would offer every earnest effort toward their support.
translation:
  language: pt
  text: Já alguns vizinhos, amigos e parceiros de negócios, chamando certas pessoas de lado em segredo, davam garantias de que se uniriam para protegê-las e empregariam todo o empenho possível em ajudá-las.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “davam sua palavra de que se uniriam na defesa e prestariam toda a ajuda possível”.'
    reason: Alternativa lexical que preserva de modo mais explícito a força de compromisso de πίστεις ἐδίδουν e a possível imagem defensiva de συνασπίζειν.
lexical_decisions:
- source_word: γείτονές
  choice: vizinhos
  rationale: Expressa naturalmente as pessoas que moravam nas proximidades e preserva o primeiro grupo da enumeração social.
- source_word: φίλοι
  choice: amigos
  rationale: O sentido relacional comum é o mais adequado nesta lista de pessoas solidárias.
- source_word: συνπραγματευόμενοι
  choice: parceiros de negócios
  rationale: O particípio designa pessoas envolvidas conjuntamente em negócios ou transações, sem exigir uma sociedade comercial formal.
- source_word: μυστικῶς
  choice: em segredo
  rationale: Indica que a iniciativa ocorria de modo oculto, provavelmente devido ao perigo de manifestar apoio abertamente.
- source_word: τινας ἐπισπώμενοι
  choice: chamando certas pessoas de lado
  rationale: Preserva a ideia de atrair ou puxar algumas pessoas para junto de si, adequada ao contexto de uma conversa reservada, sem afirmar de modo excessivo que foram persuadidas.
- source_word: πίστεις ἐδίδουν
  choice: davam garantias
  rationale: A expressão idiomática comunica promessas ou garantias de apoio, em português atual e digno.
- source_word: συνασπίζειν
  choice: se uniriam para protegê-las
  rationale: O verbo, formado a partir de 'escudo', descreve proteção conjunta; a formulação mantém tanto a ação coletiva quanto a finalidade protetora sem forçar uma imagem militar literal.
- source_word: πᾶν ἐκτενὲς
  choice: todo o empenho possível
  rationale: A expressão substantivada transmite intensidade plena e dedicação máxima.
- source_word: προσιοίσεσθαι
  choice: empregariam
  rationale: Neste contexto, o infinitivo futuro indica aquilo que prometiam oferecer ou aplicar em favor dos necessitados.
- source_word: πρὸς ἀντίλημψιν
  choice: em ajudá-las
  rationale: ἀντίλημψις denota ajuda, amparo ou assistência; a construção verbal é natural em português e conserva a finalidade do esforço.
