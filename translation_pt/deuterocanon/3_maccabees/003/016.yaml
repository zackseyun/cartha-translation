base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/016.yaml
  text: And after assigning very great revenues to the temples in the cities[a], we also went on and, going up to Jerusalem, to honor the temple of those never-winnowed and never-ceasing in their folly.
translation:
  language: pt
  text: E, depois de termos destinado rendas muito elevadas aos templos das cidades, também prosseguimos e subimos a Jerusalém para honrar o templo daqueles que não são joeirados[a] e nunca cessam em sua insensatez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “não são joeirados” é rara e difícil. Pode ser uma metáfora hostil para pessoas vistas como não depuradas ou não purificadas; alguns intérpretes a entendem de modo mais positivo e traduzem a expressão em termos menos pejorativos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπονείμαντες
  choice: depois de destinarmos
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; “destinarmos” comunica naturalmente a atribuição administrativa das rendas.
- source_word: προσόδους πλείστας
  choice: rendas muito elevadas
  rationale: πρόσοδοι designa receitas ou rendas, e πλείστας intensifica sua quantidade ou vulto.
- source_word: προηχθημεν
  choice: prosseguimos
  rationale: Neste contexto, a forma tem sentido idiomático de avançar ou dar prosseguimento ao percurso.
- source_word: ἀναβάντες
  choice: subimos a Jerusalém
  rationale: Preserva o modo tradicional de descrever a viagem a Jerusalém e integra o particípio em português corrente.
- source_word: τιμῆσαι
  choice: para honrar
  rationale: Expressa com clareza a finalidade do deslocamento, sem acrescentar uma interpretação cultual mais específica.
- source_word: τὸ ἱερὸν
  choice: o templo
  rationale: No contexto, ἱερόν se refere ao templo ou complexo sagrado de Jerusalém; “templo” é a forma mais clara.
- source_word: ἀλητρίων
  choice: daqueles que nunca foram joeirados
  rationale: Conserva a rara e áspera metáfora agrícola do texto, em vez de reduzi-la a um qualificativo moral genérico.
- source_word: μηδέποτε ληγόντων
  choice: nunca cessam
  rationale: Reproduz a ideia contínua de não parar ou não ter fim em português natural.
- source_word: ἀνοίας
  choice: insensatez
  rationale: Expressa a ideia de falta de entendimento ou juízo e mantém o tom polêmico sem sugerir necessariamente uma condição clínica.
theological_decisions:
- issue: Referente e força da expressão genitiva τῶν ἀλητρίων καὶ μηδέποτε ληγόντων τῆς ἀνοίας
  choice: 'A expressão descreve os adeptos associados ao templo de Jerusalém: “daqueles que nunca foram joeirados e nunca cessam em sua insensatez”.'
  alternative: Entender a expressão de modo positivo, como “o templo dos puros e dos que nunca cessam em sua devoção”, ou aplicar a descrição ao próprio templo.
  rationale: A construção genitiva depende naturalmente de ἱερόν e identifica o templo por seus adeptos. O contexto hostil favorece a manutenção do insulto, embora a raridade de ἀλητρίων torne necessária uma nota que preserve a incerteza lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe fluida. A metáfora incomum foi mantida no texto e esclarecida em nota, preservando tanto o tom hostil da voz narrativa quanto a incerteza lexical.
