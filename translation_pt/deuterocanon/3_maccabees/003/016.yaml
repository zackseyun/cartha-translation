  verdict: revise
  source_fidelity: A tradução preserva o sentido administrativo de ἀπονείμαντες προσόδους πλείστας, a sequência de deslocamento para Jerusalém e a finalidade de honrar o templo. A metáfora hostil e difícil de ἀλητρίων é adequadamente mantida, com nota. Contudo, «depois de destinarmos» emprega um infinitivo pessoal que enfraquece a anterioridade já consumada do particípio aoristo; «depois de termos destinado» a reproduz melhor.
  naturalness: O registro é claro e digno. A revisão proposta torna a primeira oração mais idiomática e temporalmente precisa, e coordena de forma mais fluida as duas qualificações dos adeptos.
  terminology: «Rendas muito elevadas», «templo», «honrar», «joeirados» e «insensatez» são escolhas adequadas. «Não joeirados» corresponde mais diretamente ao adjetivo raro ἀλητρίων do que a perífrase verbal «nunca foram joeirados», sem resolver indevidamente sua imagem metafórica.
  issues:
