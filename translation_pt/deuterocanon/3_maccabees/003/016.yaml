    issue: Formulação de ἀλητρίων
    rationale: «Nunca foram joeirados» é compreensível, mas acrescenta uma formulação verbal perfectiva. «Não joeirados» mantém mais de perto o caráter adjetival e a dificuldade deliberada do termo grego.
