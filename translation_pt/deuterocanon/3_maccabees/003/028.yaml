base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/028.yaml
  text: And whoever wishes to inform against them will[a], for this, receive the property of the one who falls under the penalty, and two thousand drachmas from the royal treasury[b], and will be crowned with freedom.
translation:
  language: pt
  text: E quem quiser denunciá-los receberá, por isso, os bens daquele que ficar sujeito à punição[a], duas mil dracmas do tesouro real e será coroado com a liberdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “daquele que ficar sujeito a exame judicial”; a expressão grega pode indicar submissão a uma investigação oficial ou responsabilização, aqui no contexto de um decreto punitivo.
    reason: lexical_alternative
  - marker: b
    text: A expressão significa literalmente “será coroado com a liberdade” e provavelmente indica que o denunciante receberia a liberdade como recompensa.
    reason: cultural_note
lexical_decisions:
- source_word: μηνύειν
  choice: denunciá-lo
  rationale: No contexto jurídico-administrativo do decreto, o verbo indica informar às autoridades contra alguém. “Denunciar” comunica de modo natural a força acusatória.
- source_word: τὸν βουλόμενον
  choice: quem quiser
  rationale: O particípio substantivado tem sentido genérico e apresenta a recompensa como aberta a qualquer pessoa disposta a denunciar.
- source_word: ἐφʼ ᾧ
  choice: por isso
  rationale: A expressão liga causalmente a denúncia à recompensa prometida, sem reproduzir uma construção grega pouco natural em português.
- source_word: οὐσίαν
  choice: os bens
  rationale: Neste contexto, refere-se ao patrimônio material confiscado da pessoa responsabilizada.
- source_word: τοῦ ἐμπίπτοντος ὑπὸ τὴν εὔθυναν
  choice: daquele que incorrer na punição
  rationale: Preserva o sentido de passar a estar sujeito à responsabilização oficial e, no contexto punitivo do decreto, à sanção, sem apagar a possível nuance de exame judicial.
- source_word: λήμψεται
  choice: receberá
  rationale: O futuro médio exprime aqui a obtenção da recompensa prometida.
- source_word: ἐκ τοῦ βασιλικοῦ
  choice: do tesouro real
  rationale: O adjetivo substantivado pressupõe os fundos ou o erário do rei; “tesouro real” explicita naturalmente a elipse.
- source_word: δραχμὰς δισχιλίας
  choice: duas mil dracmas
  rationale: Mantém a unidade monetária histórica do texto.
- source_word: τῆς ἐλευθερίας στεφανωθήσεται
  choice: será coroado com a liberdade
  rationale: Conserva a imagem honorífica de στεφανόω e deixa visível que a liberdade é concedida como recompensa.
theological_decisions:
- issue: Sentido de “será coroado com a liberdade” no decreto real
  choice: Manter literalmente a imagem de ser coroado com a liberdade, provavelmente indicando concessão de liberdade ou emancipação.
  alternative: Traduzir de forma explicativa como “receberá a liberdade como recompensa” ou entender a expressão como concessão de privilégios civis.
  rationale: Embora não seja uma questão doutrinária central, a formulação literal preserva a retórica do texto e não decide além da evidência se se trata especificamente de alforria, emancipação jurídica ou outro estatuto de liberdade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem das recompensas foi mantida; a metáfora final foi preservada, e a ambiguidade jurídica de εὔθυνα foi registrada em nota.
