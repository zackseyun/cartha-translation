  yaml_path: translation/deuterocanon/3_maccabees/003/012.yaml
  text: 'King Ptolemy Philopator to the generals and soldiers throughout Egypt and in every place: greetings and good health[a].'
translation:
  language: pt
  text: 'O rei Ptolemeu Filopátor, aos comandantes e soldados por todo o Egito e em cada localidade[a]: saudações e boa saúde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em cada distrito” ou “localidade por localidade”. A expressão grega κατὰ τόπον é idiomática e pode se referir a postos locais ou a distritos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βασιλεὺς
  choice: O rei
  rationale: Empregado como título real na identificação do remetente; o artigo produz uma abertura epistolar natural em português.
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: Ptolemeu Filopátor
  rationale: O nome e o epíteto são transliterados em suas formas correntes em português, sem traduzir o sentido do epíteto.
- source_word: τοῖς ... στρατηγοῖς
  choice: aos comandantes
  rationale: στρατηγοί designa líderes militares e, no contexto helenístico, pode também ter caráter administrativo; “comandantes” preserva a função sem impor uma patente moderna específica.
- source_word: καὶ στρατιώταις
  choice: e soldados
  rationale: Tradução direta que mantém os destinatários como pessoas, em vez de usar o coletivo “tropas”.
- source_word: κατʼ Αἴγυπτον
  choice: por todo o Egito
  rationale: Expressa de modo natural a extensão geográfica distributiva da construção grega.
- source_word: καὶ κατὰ τόπον
  choice: e em cada localidade
  rationale: Preserva o valor distributivo de κατὰ τόπον sem decidir se τόπος indica um distrito administrativo ou simplesmente um posto/local.
- source_word: χαίρειν
  choice: saudações
  rationale: Equivalente convencional da fórmula epistolar grega de abertura.
- source_word: καὶ ἐρρῶσθαι
  choice: e boa saúde
  rationale: Reproduz de forma concisa o desejo epistolar de vigor, bem-estar ou saúde.
