base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/025.yaml
  text: We have ordered that[a], as soon as this letter arrives, those enrolled, together with their wives and children, be sent to us at once in iron bonds, shut in on every side, with abuse and plundering[c][b], for an incurable and disgraceful pit fit for enemies.
translation:
  language: pt
  text: Ordenamos que, assim que esta carta chegar, os que constam do registro[a], juntamente com suas esposas e seus filhos, sejam enviados imediatamente a nós, com grilhões de ferro, completamente acorrentados, sujeitos a ultrajes e espoliação[b], para um fosso irremediável e infame, próprio para inimigos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os registrados” ou “os alistados pelo nome”; o particípio grego se refere a pessoas oficialmente incluídas num registro.
    reason: lexical_alternative
  - marker: b
    text: A expressão reúne tanto o tratamento humilhante e abusivo quanto o despojo ou saque de seus bens.
    reason: lexical_alternative
  - marker: c
    text: “Fosso” pode indicar uma cavidade real ou funcionar como imagem vívida de um lugar de destruição e desonra.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: Ordenamos
  rationale: O perfeito indica uma ordem já emitida e ainda vigente; o presente solene é natural em português para o texto de um decreto.
- source_word: ἅμα τῷ προσπεσεῖν τὴν ἐπιστολὴν τήνδε
  choice: assim que esta carta chegar
  rationale: A construção ἅμα τῷ com infinitivo exprime imediatismo temporal, e προσπίπτω, aplicado à carta, refere-se à sua chegada ou entrega.
- source_word: αἰθωρεὶ
  choice: imediatamente
  rationale: Preserva de modo claro e atual o valor adverbial de execução sem demora.
- source_word: τοὺς ἐννεμομένους
  choice: os que constam do registro
  rationale: Expressa a inclusão oficial dessas pessoas numa lista ou registro, sem sugerir adesão voluntária.
- source_word: σὺν ταῖς γυναιξὶ καὶ τέκνοις
  choice: juntamente com suas esposas e seus filhos
  rationale: No contexto familiar dos homens registrados, γυναιξί designa naturalmente as esposas.
- source_word: μετὰ ὕβρεως καὶ σκυλμῶν
  choice: sujeitos a ultrajes e espoliação
  rationale: ὕβρις comunica tratamento humilhante e abusivo; σκυλμοί acrescenta a ideia distinta de despojo ou saque, que não deve ser reduzida a mero mau-trato.
- source_word: ἀποστεῖλαι πρὸς ἡμᾶς
  choice: sejam enviados ... até nós
  rationale: O infinitivo depende da ordem; a construção passiva é idiomática em português e πρὸς indica o destino junto aos emissores.
- source_word: ἐν δεσμοῖς σιδηροῖς
  choice: presos com grilhões de ferro
  rationale: Torna explícito o estado de restrição física sem especificar além do que δεσμοί permite.
- source_word: πάντοθεν κατακεκλεισμένους
  choice: encerrados por todos os lados
  rationale: Conserva tanto o estado resultante expresso pelo perfeito quanto a totalidade espacial de πάντοθεν.
- source_word: εἰς ἀνήκεστον καὶ δυσκλεῆ πρέποντα δυσμενέσιν βόθρον
  choice: para um abismo irremediável e infame, próprio para inimigos
  rationale: βόθρος mantém a imagem de uma cavidade ou lugar de perdição; ἀνήκεστος conserva a noção do que não admite remédio, δυσκλεής denota desonra ou má fama, e πρέποντα δυσμενέσιν caracteriza o destino como adequado a inimigos.
theological_decisions:
- issue: Natureza de βόθρος
  choice: abismo, com nota que preserva a possibilidade concreta ou figurada
  alternative: fosso estritamente literal ou imagem de destruição sem referência espacial
  rationale: O contexto não determina com segurança se o termo aponta para uma cavidade física específica ou funciona como imagem vívida de um destino de destruição e desonra.
translation_notes:
  register: Português moderno, claro e digno, com cadência compatível com um decreto régio. Evitaram-se arcaísmos como “destarte” e termos excessivamente técnicos; “espoliação” foi mantido por distinguir o despojo material dos ultrajes já expressos pelo primeiro substantivo.
