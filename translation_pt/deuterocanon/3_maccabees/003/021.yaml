base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/021.yaml
  text: And in these matters[a], after making known to all their own countrymen our lack of resentment, and because of the alliance and the countless affairs entrusted to them from the beginning with sincerity, we decided to transform their status and deem them worthy of Alexandrian citizenship[b], and to appoint them as sharers in the things of the sanctuary.
translation:
  language: pt
  text: E, nessas questões, depois de termos dado a conhecer a todos a nossa disposição de não guardar ressentimento para com seus compatriotas[a], tanto por causa da aliança como dos incontáveis assuntos que, desde o princípio, lhes foram confiados com sinceridade, decidimos mudar sua condição, considerá-los dignos da cidadania alexandrina e constituí-los participantes das coisas relativas ao santuário[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossa disposição de não guardar rancor” ou “nossa disposição de não levar em conta as ofensas”; o termo grego indica não conservar ressentimento pelos males sofridos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “das coisas relativas ao santuário”; a expressão pode abranger privilégios, responsabilidades ou assuntos sagrados ligados ao templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμνησικακίαν
  choice: não guardávamos ressentimento
  rationale: Expressa de modo natural a ideia de não conservar na memória as ofensas nem nutrir rancor, preservando o sentido do substantivo grego.
- source_word: ὁμοφύλους αὐτῶν
  choice: seus compatriotas
  rationale: Representa os membros do mesmo povo ou grupo de origem sem recorrer à linguagem biológica de “raça”.
- source_word: συμμαχίαν
  choice: aliança
  rationale: O contexto régio e político favorece uma associação formal, e não mera amizade pessoal.
- source_word: τὰ πεπιστευμένα ... μύρια πράγματα
  choice: os incontáveis assuntos que ... lhes foram confiados
  rationale: Mantém tanto a amplitude de πράγματα como a noção de responsabilidades entregues em confiança.
- source_word: μετὰ ἁπλότητος
  choice: com sinceridade
  rationale: Neste contexto, ἁπλότης indica franqueza e retidão de intenção.
- source_word: ἐξαλλοιῶσαι
  choice: mudar sua condição
  rationale: O verbo indica uma alteração profunda; “condição” explicita com cautela o aspecto de status desenvolvido pelas orações seguintes.
- source_word: πολιτίας ... Ἀλεξανδρέων
  choice: cidadania alexandrina
  rationale: πολιτεία designa aqui condição ou direitos cívicos; a formulação é concisa e natural em português.
- source_word: καταξιῶσαι
  choice: considerá-los dignos de
  rationale: Preserva a força avaliativa do verbo, em vez de reduzi-lo simplesmente a “conceder”.
- source_word: μετόχους
  choice: participantes
  rationale: Comunica claramente pessoas que passam a ter parte em algo, sem tom excessivamente técnico ou eclesiástico.
- source_word: τῶν εἰς ἱερὸν
  choice: das coisas relativas ao santuário
  rationale: Preserva a formulação grega comprimida e sua amplitude, sem restringi-la a privilégios ou serviços específicos.
- source_word: καταστῆσαι
  choice: constituí-los
  rationale: Indica o estabelecimento formal em uma nova posição ou qualidade, apropriado ao contexto administrativo.
theological_decisions:
- issue: Alcance da elevação cívica e da participação ligada ao santuário
  choice: A tradução apresenta uma mudança de condição, a dignidade para a cidadania alexandrina e a participação em assuntos relativos ao santuário, sem definir o alcance jurídico ou cultual.
  alternative: Interpretar o texto como plena assimilação ao corpo cívico alexandrino ou restringir a última expressão ao serviço no templo.
  rationale: O grego menciona cidadania e participação nas “coisas relativas ao santuário”, mas não especifica a extensão exata desses direitos, funções ou privilégios.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe longa acompanha o caráter do decreto régio, mas foi organizada com conectores claros. Evitaram-se tanto arcaísmos como especificações jurídicas ou cultuais não presentes no grego.
