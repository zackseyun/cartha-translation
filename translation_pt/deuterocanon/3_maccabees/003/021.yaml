  to: E, nessas questões, depois de termos dado a conhecer a todos a nossa disposição de não guardar ressentimento para com seus compatriotas[a], tanto por causa da aliança como dos incontáveis assuntos que, desde o princípio, lhes foram confiados com sinceridade, decidimos mudar sua condição, considerá-los dignos da cidadania alexandrina e constituí-los participantes das coisas relativas ao santuário[b].
