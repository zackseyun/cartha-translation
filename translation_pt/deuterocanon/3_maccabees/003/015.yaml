base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/015.yaml
  text: We considered that the nations inhabiting Coele-Syria and Phoenicia should be nurtured not by the force of the spear[a], but with gentleness and great kindness[b], having gladly done them good.
translation:
  language: pt
  text: Consideramos que os povos que habitam a Celessíria e a Fenícia deviam ser criados[a], não pela força da lança[b], mas com brandura e grande benevolência, fazendo-lhes o bem de bom grado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nutridos» ou «cuidados». O verbo grego evoca criar ou amamentar uma criança e aplica essa imagem paternalista ao tratamento de povos sujeitos.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega diz literalmente «pela força da lança», imagem militar de um governo coercitivo.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγησάμεθα
  choice: Consideramos
  rationale: O aoristo médio introduz uma avaliação ou decisão política ponderada; «consideramos» conserva esse sentido deliberativo.
- source_word: μὴ βίᾳ δόρατος
  choice: não pela força da lança
  rationale: Mantém a imagem militar concreta do grego, em vez de reduzi-la ao sentido interpretativo de «força das armas».
- source_word: ἐπιεικείᾳ
  choice: com brandura
  rationale: Expressa moderação, clemência ou trato gentil e estabelece contraste natural com a coerção militar.
- source_word: πολλῇ φιλανθρωπίᾳ
  choice: grande benevolência
  rationale: No contexto da política régia, φιλανθρωπία indica humanidade manifestada como bondade ou benevolência; esta opção é natural e preserva a força pública do termo.
- source_word: τιθηνήσασθαι
  choice: ser criados
  rationale: O verbo evoca nutrir ou criar como uma ama ou um responsável por uma criança. «Ser criados» conserva a metáfora paternalista, embora ela seja esclarecida em nota.
- source_word: τὰ κατοικοῦντα ... ἔθνη
  choice: os povos que habitam
  rationale: «Povos» é uma tradução corrente de ἔθνη e a oração relativa produz português mais natural que uma construção participial rígida.
- source_word: Κοίλην Συρίαν
  choice: Celessíria
  rationale: Forma portuguesa estabelecida do topônimo helenístico Coele-Syria, preferível a uma tradução literal de seu nome.
- source_word: εὖ ποιήσαντες ἀσμένως
  choice: fazendo-lhes o bem de boa vontade
  rationale: Reproduz o valor benefativo de εὖ ποιέω e a disposição voluntária ou satisfeita indicada por ἀσμένως, sem forçar uma relação temporal que o particípio não explicita.
theological_decisions:
- issue: Paternalismo político em τιθηνήσασθαι
  choice: Conservar a metáfora de criar povos sujeitos
  alternative: ser governados / ser tratados
  rationale: O grego descreve o domínio régio mediante uma imagem de criação ou cuidado infantil. Substituí-la por um termo administrativo neutro apagaria uma característica retórica significativa do texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de ampla compreensão no Brasil e internacionalmente. Conserva-se a imagem incomum de «criar» povos, acompanhada de nota, e evita-se linguagem administrativa que neutralizaria a retórica do original.
