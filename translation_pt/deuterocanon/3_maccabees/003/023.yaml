  terminology: «Inestimável cidadania» traduz de modo mais preciso o valor de ἄτιμητος (sem preço, de valor inestimável) e o provável sentido de πολιτεία no contexto. «Sob o mais ímpio pretexto» representa bem a possibilidade contextual de ἔμφασις sem afirmar na tradução principal uma intenção psicológica específica.
