base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/023.yaml
  text: Not only have they rejected the honorable civic order[a], but they also detest, both in speech and in silence, the few among them who are genuinely well-disposed toward us, and at every opportunity, driven by the most impious pretext[c][b], they rush to bring our affairs to ruin.
translation:
  language: pt
  text: Não só rejeitaram a inestimável cidadania[a], mas também abominam, em palavras e em silêncio[b], os poucos dentre eles que são sinceramente favoráveis a nós e, a cada oportunidade, sob o mais ímpio pretexto[c], investem às pressas para arruinar os nossos assuntos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os inestimáveis privilégios da cidadania». O termo πολιτεία pode referir-se à cidadania, aos privilégios cívicos ou à organização cívica. O adjetivo ἄτιμητος significa literalmente «sem preço», isto é, «inestimável»; formalmente, também pode receber o sentido de «sem honra» ou «desonrado», mas esse sentido se ajusta menos à retórica da acusação.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, «por palavra e por silêncio», indicando hostilidade tanto declarada quanto tácita.
    reason: lexical_alternative
  - marker: c
    text: O termo grego pode significar «manifestação», «aparência», «alegação» ou «pretexto». Também seria possível traduzir «com a mais ímpia aparência».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστρέψαντο
  choice: rejeitaram
  rationale: O médio exprime aqui afastamento deliberado ou repúdio; “rejeitaram” comunica isso com clareza em português atual.
- source_word: τὴν ἄτιμητον πολιτίαν
  choice: a estimada ordem cívica
  rationale: πολιτεία designa amplamente a organização ou condição cívica, não apenas cidadania individual. No contexto acusatório, ἄτιμητον é entendido como algo de grande valor ou estima, embora sua forma permita outra leitura, registrada em nota.
- source_word: βδελύσσονται
  choice: abominam
  rationale: Preserva a forte repulsa expressa pelo verbo grego em registro digno e corrente.
- source_word: λόγῳ τε καὶ σιγῇ
  choice: tanto por palavras como pelo silêncio
  rationale: Mantém o contraste concreto do grego e sugere hostilidade tanto explícita quanto tácita sem substituir a imagem por uma explicação.
- source_word: πρὸς ἡμᾶς γνησίως διακειμένους
  choice: que são genuinamente favoráveis a nós
  rationale: Expressa uma disposição sincera e favorável sem intensificá-la para lealdade política formal.
- source_word: παρʼ ἕκαστα
  choice: a cada oportunidade
  rationale: Reproduz o valor adverbial contextual de agir sempre que surge uma ocasião.
- source_word: ἐφορμώμενοι
  choice: lançam-se
  rationale: Conserva o movimento agressivo e impetuoso do particípio, em vez de reduzi-lo apenas a uma motivação interior.
- source_word: μετὰ τῆς δυσσεβεστάτης ἐμφάσεως
  choice: com a mais ímpia ostentação
  rationale: ἔμφασις pode indicar manifestação, aparência, alegação ou pretexto. “Ostentação” preserva a ideia de manifestação exterior e a deixa aberta à nota lexical.
- source_word: διὰ τάχους
  choice: rapidamente
  rationale: Traduz diretamente a ideia de velocidade e a liga ao propósito de causar ruína.
- source_word: ἡμᾶς καταστρέψαι τὰ πράγματα
  choice: levar os nossos negócios à ruína
  rationale: A construção aponta para a ruína ou subversão dos assuntos e da situação do grupo governante; “negócios” mantém essa amplitude político-administrativa.
theological_decisions:
- issue: Sentido valorativo de ἄτιμητον em relação a πολιτείαν
  choice: estimada ordem cívica
  alternative: ordem cívica desonrada; ordem cívica inestimável
  rationale: A retórica da acusação favorece uma ordem cívica apresentada como valiosa e, mesmo assim, rejeitada. Como o adjetivo isoladamente também pode ter sentido privativo, a ambiguidade é explicitada em nota, sem inverter silenciosamente a força contextual.
- issue: Valor de ἔμφασις na descrição da hostilidade
  choice: ostentação
  alternative: aparência; pretexto; intenção manifesta
  rationale: O termo admite mais de uma nuance. A tradução evita decidir que se trata necessariamente de um pretexto enganoso ou apenas de uma intenção interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura retórica foi preservada em uma única frase, e as ambiguidades de πολιτεία, ἄτιμητος e ἔμφασις foram mantidas ou documentadas sem impor uma leitura confessional.
