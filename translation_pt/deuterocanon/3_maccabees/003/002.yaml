review_pass:
  verdict: revise
  source_fidelity: A tradução capta a hostilidade da notícia, o alvo coletivo de γένος e a noção de ocasião em ἀφορμή. Contudo, a oração final foi convertida indevidamente em finalidade ativa (“para que pudessem impedi-los”). O texto grego transmitido traz ὡς ἂν e a forma passiva κωλύωνται, de modo que a redação deve conservar a aparência/alegação de impedimento, sem resolver a sintaxe difícil como ação dos opositores.
  naturalness: A ordem da frase foi ajustada para leitura natural em português atual. “Ocasião para essa disposição” mantém a concisão algo densa do original, mas é mais idiomático do que a construção anterior e seu referente hostil é claro pelo contexto imediato.
  terminology: “Povo”, “rumor hostil”, “maltratar” e “leis costumeiras” são escolhas adequadas. “Leis costumeiras” representa melhor τὰ νόμιμα do que “costumes estabelecidos”, pois conserva tanto o aspecto normativo como o tradicional.
  issues:
  - severity: high
    issue: 'A oração final foi traduzida como propósito ativo: “para que pudessem impedi-los”.'
    rationale: ὡς ἂν introduz uma comparação ou alegação (“como se”), e κωλύωνται é formalmente passivo. Embora a sequência contenha uma dificuldade sintática, o texto não autoriza apresentar sem ressalva os opositores como sujeitos que impedem o povo.
  - severity: medium
    issue: A nota b registra a leitura passiva apenas como alternativa, embora ela corresponda à voz da forma grega transmitida.
    rationale: A leitura passiva deve estar no texto principal. A nota deve explicar a irregularidade/ambiguidade sintática, em vez de tratar a leitura refletida diretamente pela forma verbal como secundária.
  revised_text: Enquanto esses assuntos eram conduzidos, espalhava-se contra o povo, entre pessoas que concordavam em maltratá-lo, um rumor hostil. Dava-se, assim, ocasião[a] para essa disposição, como se o povo estivesse sendo impedido de observar suas leis costumeiras.[b]
  revised_footnotes:
  - marker: a
    text: Ou “pretexto” ou “oportunidade”; o grego ἀφορμή pode assumir qualquer uma dessas nuances neste contexto.
    reason: lexical_alternative
  - marker: b
    text: 'A construção grega é condensada e apresenta uma dificuldade sintática: a forma verbal é passiva, “estivessem sendo impedidos”, embora o pronome correspondente apareça no acusativo. “Leis costumeiras” também pode ser traduzido por “costumes estabelecidos” ou “práticas tradicionais”.'
    reason: syntactic_and_lexical_alternative
  revision_rationale: A revisão restaura o valor comparativo de ὡς ἂν e a voz passiva de κωλύωνται, sem tentar solucionar dogmaticamente a dificuldade sintática do texto grego transmitido. Também torna τὰ νόμιμα explicitamente normativo no texto e deixa alternativas legítimas na nota.
