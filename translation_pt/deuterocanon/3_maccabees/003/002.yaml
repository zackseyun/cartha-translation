base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/002.yaml
  text: While these matters were being arranged[a], a hostile rumor was spread against the nation among people of like mind for mistreatment, a pretext being given for their purpose[c][b], as though they were being hindered from their customary laws.
translation:
  language: pt
  text: Enquanto essas coisas eram administradas, circulava contra o povo, entre pessoas que tinham o mesmo propósito de maltratá-lo, um rumor hostil. Desse modo, dava-se ocasião[a] a essa disposição, para que pudessem impedi-los de seguir seus costumes estabelecidos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pretexto” ou “oportunidade”; o grego ἀφορμή pode assumir qualquer uma dessas nuances neste contexto.
    reason: lexical_alternative
  - marker: b
    text: 'A construção grega é condensada. Também tem sido entendida assim: “como se eles estivessem sendo impedidos de seguir suas leis costumeiras”. “Costumes estabelecidos” também pode ser traduzido por “leis costumeiras” ou “práticas tradicionais”.'
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: οἰκονομουμένων
  choice: eram administradas
  rationale: O particípio indica que os assuntos estavam sendo conduzidos ou administrados; a formulação preserva o caráter processual e não especifica um agente ausente do grego.
- source_word: φήμη δυσμενὴς ἐξέκειτο
  choice: circulava ... um rumor hostil
  rationale: Com φήμη, ἐξέκειτο exprime algo posto em circulação ou divulgado. “Rumor hostil” conserva tanto a possível falta de comprovação quanto a malevolência de δυσμενής.
- source_word: κατὰ τοῦ γένους
  choice: contra o povo
  rationale: No contexto, γένος designa o povo judeu como coletividade. “Povo” é natural em português e evita as conotações biológicas modernas de “raça”.
- source_word: ἀνθρώποις συμφρονοῦσιν εἰς κακοποίησιν
  choice: entre pessoas que tinham o mesmo propósito de maltratá-lo
  rationale: A expressão descreve pessoas concordes ou de igual disposição quanto a causar dano. “Maltratar” mantém amplo o tipo de dano, sem limitá-lo à violência física.
- source_word: ἀφόρμης
  choice: ocasião
  rationale: ἀφορμή pode indicar ocasião, oportunidade, ponto de partida ou pretexto. “Ocasião” preserva a amplitude sem impor que a justificativa fosse necessariamente inventada.
- source_word: διάθεσιν
  choice: essa disposição
  rationale: διάθεσις pode denotar disposição, intenção ou propósito. O demonstrativo retoma a orientação hostil já expressa, sem definir além do que permite a construção grega comprimida.
- source_word: τῶν νομίμων
  choice: seus costumes estabelecidos
  rationale: O substantivo plural designa práticas, costumes ou normas reconhecidas. A tradução conserva o componente tradicional sem reduzi-lo apenas a legislação formal.
- source_word: αὐτοὺς κωλύωνται
  choice: pudessem impedi-los
  rationale: 'αὐτούς funciona naturalmente como objeto de κωλύωνται, com os agitadores hostis como sujeito implícito: eles procurariam impedir o povo. A construção, porém, é comprimida e admite outra compreensão, registrada em nota.'
theological_decisions:
- issue: Identidade coletiva expressa por γένος
  choice: o povo
  alternative: a nação; a raça
  rationale: “O povo” comunica a coletividade judaica visada pela hostilidade sem introduzir uma categoria racial moderna nem afirmar uma condição política específica.
- issue: Força de ἀφορμή no contexto da agitação hostil
  choice: ocasião
  alternative: pretexto; oportunidade
  rationale: O contexto pode sugerir um pretexto para a perseguição, mas o substantivo grego não exige essa nuance mais acusatória; a alternativa é preservada em nota.
- issue: Relação sintática de αὐτοὺς com κωλύωνται
  choice: os opositores poderiam impedir o povo de seguir seus costumes
  alternative: o povo estaria sendo impedido de seguir seus costumes
  rationale: O acusativo αὐτούς favorece sua leitura como objeto de κωλύωνται. Como a oração é sintaticamente condensada e a tradição de tradução registra a leitura passiva, a ambiguidade é explicitada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com períodos claros e vocabulário não técnico. A ordem foi levemente ajustada para fluência, mantendo a progressão do grego. Os pronomes em “maltratá-lo” e “impedi-los” retomam coletivamente “o povo”; a alternância de número é idiomática em português, mas a segunda ocorrência também espelha o plural αὐτούς.
