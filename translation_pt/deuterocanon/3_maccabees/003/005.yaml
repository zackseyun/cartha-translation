translation:
  language: pt
  text: E, adornando sua maneira de viver com a boa conduta dos justos, tinham se tornado estimados por todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ... εὐπραξίᾳ
  choice: com a boa conduta
  rationale: No contexto ético, εὐπραξία indica agir bem ou comportamento correto; “boa conduta” é claro e natural em português.
- source_word: τῶν δικαίων
  choice: dos justos
  rationale: O adjetivo substantivado plural designa pessoas justas e preserva de modo conciso sua força moral e religiosa.
- source_word: κοσμοῦντες
  choice: adornando
  rationale: 'Mantém a metáfora de κοσμέω: a maneira de viver deles recebia honra e beleza moral por meio da conduta justa.'
- source_word: τὴν συναναστροφήν
  choice: sua maneira de viver
  rationale: Expressa o sentido amplo de conduta ou modo de vida no convívio social, sem restringi-lo a uma associação específica.
- source_word: ἅπασιν ἀνθρώποις
  choice: por todos
  rationale: O dativo indica aqueles em cuja avaliação eles gozavam de boa reputação; a formulação é idiomática em português.
- source_word: εὐδόκιμοι
  choice: estimados
  rationale: Comunica a ideia de serem aprovados e gozarem de boa reputação perante os demais.
- source_word: καθειστήκεισαν
  choice: tinham se tornado
  rationale: O mais-que-perfeito expressa uma condição resultante já estabelecida, adequadamente transmitida por “tinham se tornado”.
