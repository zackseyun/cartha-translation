base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/018.yaml
  text: Carried away by ancient conceit[a], they barred us from entry, falling short of our strength, by which we have goodwill toward all people.
translation:
  language: pt
  text: Levados por uma arrogância antiga[a], eles nos impediram de entrar, por lhes faltar a nossa força, pela qual temos benevolência para com todas as pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Levados por uma arrogância de longa data” ou “impelidos por um orgulho arraigado”. A expressão grega é compacta e pode indicar uma presunção antiga, herdada ou persistente.
    reason: lexical_alternative
lexical_decisions:
- source_word: τύφοις
  choice: arrogância
  rationale: No contexto, o plural dativo descreve disposições de orgulho presunçoso que os impeliam. “Arrogância” comunica com clareza o sentido moral, sem introduzir a possível conotação psicológica de “delírios”.
- source_word: φερόμενοι
  choice: levados por
  rationale: Preserva a nuance passiva do particípio e exprime naturalmente em português a ideia de serem impelidos por uma disposição.
- source_word: παλαιοτέροις
  choice: de longa data
  rationale: O comparativo tem valor idiomático ligado a tempos anteriores. “De longa data” evita o pouco natural “mais antiga” e mantém a noção de atitude arraigada ou herdada.
- source_word: εἶρξαν ... τῆς εἰσόδου
  choice: impediram ... de entrar
  rationale: A construção com genitivo indica impedir alguém de ter entrada; a forma verbal é mais natural e direta em português do que “barraram-nos da entrada”.
- source_word: λειπόμενοι τῆς ἡμετέρας ἀλκῆς
  choice: embora fossem inferiores à nossa força
  rationale: O particípio exprime deficiência em comparação com a força do falante. “Inferiores à nossa força” conserva a comparação; “embora” explicita a relação concessiva provável no fluxo da frase, sem transformar a deficiência em mera ausência.
- source_word: διʼ ἣν
  choice: pela qual
  rationale: Mantém a ligação gramatical com “força” e a possível ideia de meio ou fundamento presente em διά com acusativo.
- source_word: ἔχομεν ... φιλανθρωπίαν
  choice: demonstramos benevolência
  rationale: Embora ἔχομεν seja literalmente “temos”, em português “demonstramos benevolência” comunica naturalmente a posse e manifestação dessa disposição.
- source_word: πρὸς ἅπαντας ἀνθρώπους
  choice: para com todas as pessoas
  rationale: A expressão refere-se genericamente a toda a humanidade; “todas as pessoas” é inclusivo, preciso e corrente.
theological_decisions:
- issue: Referência genérica de ἀνθρώπους
  choice: todas as pessoas
  alternative: todos os seres humanos
  rationale: O substantivo não é especificamente masculino. A escolha reproduz o alcance universal em português natural, sem acrescentar distinção de gênero.
- issue: Relação de διʼ ἣν com ἀλκῆς
  choice: pela qual
  alternative: por causa da qual
  rationale: A formulação conserva a ambiguidade entre meio e fundamento, em vez de fixar exclusivamente uma relação causal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala conserva o tom régio e autoconfiante do contexto, inclusive sua alegação de força e benevolência.
