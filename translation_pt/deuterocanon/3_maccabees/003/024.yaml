  yaml_path: translation/deuterocanon/3_maccabees/003/024.yaml
  text: Therefore[a], being well convinced by proofs that these people are in every way ill-disposed toward us, and taking thought lest, if some sudden disturbance should later arise, we should have these ungodly people at our back as traitors and barbarian enemies,
translation:
  language: pt
  text: Por isso, plenamente convencidos, com base em provas, de que essas pessoas são hostis a nós de todas as maneiras, e tomando precauções para que, caso mais tarde surja alguma perturbação repentina, não tenhamos esses ímpios às nossas costas como traidores e inimigos bárbaros[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inimigos selvagens”. O grego traduzido por “bárbaros” funciona aqui como um rótulo pejorativo na retórica do orador, não necessariamente como uma designação étnica precisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Expressa naturalmente a conclusão inferida do contexto anterior.
- source_word: τεκμηρίοις
  choice: por provas
  rationale: O dativo indica o fundamento ou meio da convicção; “provas” comunica evidência mais forte que mera suspeita.
- source_word: καλῶς πεπεισμένοι
  choice: firmemente convencidos
  rationale: Retrata um estado consolidado de persuasão e preserva a força adverbial de καλῶς em português natural.
- source_word: τούτους
  choice: essas pessoas
  rationale: Retoma o grupo visado sem acrescentar uma identificação não expressa pelo demonstrativo grego.
- source_word: κατὰ πάντα τρόπον
  choice: de todas as maneiras
  rationale: Mantém o alcance abrangente da acusação.
- source_word: δυσνοεῖν ἡμῖν
  choice: são hostis a nós
  rationale: Comunica de modo claro a disposição adversa dirigida contra “nós”, sem introduzir uma ação específica.
- source_word: προνοούμενοι
  choice: tomando precauções
  rationale: Expressa a preocupação antecipada e preventiva indicada pelo particípio no contexto político e militar.
- source_word: μή ποτε ἐφνιδίου μετέπειτα ταραχῆς ἐνστάσης
  choice: para que, caso mais tarde surja alguma perturbação repentina, não
  rationale: Preserva a apreensão diante de uma possível desordem futura, sem restringir ταραχή a motim ou rebelião.
- source_word: κατὰ νώτου
  choice: às nossas costas
  rationale: Conserva a imagem vívida de uma ameaça localizada na retaguarda.
- source_word: προδότας
  choice: traidores
  rationale: Equivalente político e militar direto no contexto de possível traição interna.
- source_word: βαρβάρους
  choice: bárbaros
  rationale: Preserva o qualificativo pejorativo empregado na retórica do orador, sem convertê-lo silenciosamente em uma designação étnica precisa.
- source_word: πολεμίους
  choice: inimigos
  rationale: Equivalente corrente e adequado ao sentido político-militar do termo.
theological_decisions:
- issue: Qualificativos polêmicos em uma acusação régia
  choice: Manter “ímpios”, “traidores” e “inimigos bárbaros” como termos carregados pertencentes à fala acusatória.
  alternative: Abrandar a linguagem com expressões como “desleais” ou “adversários hostis”.
  rationale: O texto registra a caracterização hostil feita pelo orador. Suavizá-la apagaria parte de sua força retórica e ideológica; reproduzi-la não implica endosso da acusação pela tradução.
