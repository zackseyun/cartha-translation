base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/008.yaml
  text: But the Greeks in the city[a], having suffered no wrong, seeing the unexpected turmoil concerning the men and the disorderly gatherings that were taking place, were not strong enough to help; for their disposition urged an appeal[b], and some also were in an agitated state and supposed that these things would change.
translation:
  language: pt
  text: Mas os gregos que estavam na cidade, embora não tivessem sofrido injustiça alguma, ao verem a inesperada agitação a respeito daqueles homens e os ajuntamentos desordenados que se formavam, não tinham forças para ajudar; pois sua disposição os movia a fazer uma súplica.[a] Também eles se achavam agitados[b] e supunham que essas coisas mudariam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua inclinação os movia a fazer um apelo” ou “a oferecer encorajamento”. A construção grega é condensada, e παράκλησις pode significar súplica, apelo, exortação ou encorajamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “também estavam envolvidos na agitação”. O raro advérbio συνδρόμως pode indicar tanto perturbação interior quanto envolvimento na movimentação da multidão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ κατὰ τὴν πόλιν Ἕλληνες
  choice: Mas os gregos que viviam na cidade
  rationale: Κατὰ τὴν πόλιν situa os gregos na cidade, sem exigir sentido distributivo; δέ introduz leve contraste.
- source_word: οὐδὲν ἠδικημένοι
  choice: embora não tivessem sofrido injustiça alguma
  rationale: Preserva o sentido passivo de ἀδικέω e explicita naturalmente o valor circunstancial do particípio.
- source_word: ταραχὴν ἀπροσδόκητον περὶ τοὺς ἄνδρας
  choice: a inesperada agitação em torno daqueles homens
  rationale: Agitação comunica ταραχή no contexto de perturbação pública; “em torno” mantém aberta a possibilidade de referência aos homens ou de movimentação ao redor deles.
- source_word: συνδρομὰς ἀπροκόπους γινομένας
  choice: os ajuntamentos desordenados que se formavam
  rationale: Συνδρομή designa a reunião ou afluência de pessoas, enquanto ἀπρόκοπος sugere algo desordenado, ineficaz ou sem avanço; a formulação evita especificar em excesso.
- source_word: βοηθεῖν μὲν οὐκ ἔσθενον
  choice: não tinham forças para ajudar
  rationale: Conserva a noção de força ou capacidade presente em σθένω, e não sugere falta de vontade.
- source_word: παρακλῆσιν γὰρ ἡ διάθεσις παρεκάλουν
  choice: pois sua disposição os movia a fazer uma súplica
  rationale: A construção grega é sintaticamente comprimida. A tradução oferece português natural, mantendo διάθεσις como disposição interior e παράκλησις como súplica ou apelo.
- source_word: οἱ δὲ καὶ συνδρόμως εἶχον
  choice: Alguns também se achavam agitados
  rationale: O raro συνδρόμως pode indicar estado de comoção ou envolvimento na movimentação coletiva; “agitados” conserva a indeterminação principal.
- source_word: μεταπεσεῖσθαι ταῦτα ὑπελάμβανον
  choice: supunham que essas coisas mudariam
  rationale: Μεταπίπτω indica mudança ou virada, sem esclarecer se o resultado esperado seria favorável.
