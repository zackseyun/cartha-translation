base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/001.yaml
  text: And when the impious man had taken this in[a], he became so enraged that he was angry not only with those in Alexandria, but also opposed those in the countryside more harshly; and after ordering that they quickly gather all together in one place[c][b], he intended to remove them from life by the cruelest fate.
translation:
  language: pt
  text: Ao tomar conhecimento disso[a], o homem ímpio ficou tão enfurecido que não apenas se irou contra os que estavam em Alexandria, mas também agiu com ainda mais hostilidade contra os que viviam nas regiões rurais[b]. Então ordenou que todos fossem reunidos às pressas num só lugar e que lhes tirassem a vida da maneira mais cruel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao receber essa informação” ou “ao saber disso”. O verbo grego pode indicar o recebimento de uma informação ou relato.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que estavam na χώρα”. Em contraste com Alexandria, a expressão provavelmente se refere aos que viviam fora da cidade, nos distritos rurais ao redor.
    reason: cultural_note
  - marker: c
    text: Literalmente, “removê-los da vida” ou “fazê-los deixar de viver”, uma forma indireta de dizer “matá-los”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβὼν
  choice: ao tomar conhecimento disso
  rationale: Expressa naturalmente a recepção da informação que provoca a reação, sem especificar se ela foi ouvida, recebida como relato ou plenamente compreendida.
- source_word: δυσσεβὴς
  choice: o homem ímpio
  rationale: Preserva a censura de caráter religioso de δυσσεβής, em vez de reduzi-la à maldade moral genérica.
- source_word: ἐξεχόλησεν
  choice: ficou tão enfurecido
  rationale: Comunica a intensa escalada da ira e se liga de modo natural à oração consecutiva introduzida por ὥστε.
- source_word: τοῖς κατὰ Ἀλεξάνδρειαν
  choice: os que estavam em Alexandria
  rationale: Identifica de modo claro e idiomático o grupo localizado em Alexandria, sem acrescentar uma designação étnica não expressa neste versículo.
- source_word: τοῖς ἐν τῇ χώρᾳ
  choice: os que viviam nas regiões rurais
  rationale: No contraste com Alexandria, χώρα indica mais naturalmente os distritos fora da cidade; o plural em português evita sugerir uma única área rural delimitada.
- source_word: βαρυτέρως ἐναντιοῦσθαι
  choice: agiu com ainda mais hostilidade contra
  rationale: Preserva tanto a oposição hostil de ἐναντιοῦσθαι quanto a força comparativa de βαρυτέρως, sem pressupor necessariamente violência física já consumada.
- source_word: προστάξας σπεύδοντας συναγαγεῖν πάντας ἐπὶ τὸ αὐτό
  choice: ordenou que todos fossem reunidos às pressas num só lugar
  rationale: Reflete a ordem urgente, a inclusão de todos e a concentração em um único local, ao mesmo tempo que evita definir agentes não identificados no texto.
- source_word: χειρίστῳ μόρῳ
  choice: pelo mais cruel dos destinos
  rationale: Mantém a imagem de um destino ou fim calamitoso e a intensidade superlativa, sem reduzir μόρος antecipadamente a um método específico de execução.
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: que lhes tirassem a vida
  rationale: Torna inteligível em português o eufemismo grego de fazer alguém deixar a condição de vivente, preservando a referência inequívoca à morte.
