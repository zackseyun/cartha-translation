base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/003/004.yaml
  text: But because they worshiped God and lived according to his law, they kept themselves separate in matters of food; for this reason some regarded them as hateful.
translation:
  language: pt
  text: Mas, por reverenciarem a Deus e viverem de acordo com a lei deles, mantinham-se separados no que dizia respeito aos alimentos. Por essa razão, alguns os consideravam detestáveis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεβόμενοι
  choice: por reverenciarem
  rationale: Expressa a devoção respeitosa indicada pelo particípio grego, sem restringi-la apenas a atos formais de culto.
- source_word: τῷ τούτων νόμῳ
  choice: de acordo com a lei deles
  rationale: τούτων é um genitivo plural demonstrativo, literalmente ligado à lei como pertencente a essas pessoas; por isso, a tradução segue a evidência grega direta, em vez de substituir o pronome por “de Deus”.
- source_word: πολιτευόμενοι
  choice: viverem
  rationale: Neste contexto, o verbo descreve a maneira de conduzir a vida conforme uma norma, não participação política em sentido moderno.
- source_word: χωρισμὸν ἐποίουν ἐπὶ τῷ κατὰ τὰς τροφάς
  choice: mantinham-se separados no que dizia respeito aos alimentos
  rationale: Reproduz a ideia de separação prática especialmente nas questões alimentares, em português natural.
- source_word: ἀπεχθεῖς ἐφαίνοντο
  choice: alguns os consideravam detestáveis
  rationale: Transmite idiomaticamente que, aos olhos de algumas pessoas, eles pareciam odiosos ou dignos de aversão.
theological_decisions:
- issue: Referência do pronome em “lei deles”
  choice: lei deles
  alternative: lei de Deus / sua lei
  rationale: O texto grego traz τούτων, “destes/deles”, e não um pronome singular referente a Deus. A formulação preserva essa referência gramatical sem acrescentar uma identificação teológica que o grego não explicita.
translation_notes:
  register: Português moderno, claro e digno, com construção fluente para leitores brasileiros e compreensão internacional. “Detestáveis” preserva a força negativa do grego sem recorrer a vocabulário arcaico.
