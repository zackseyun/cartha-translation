  text: But every place where a Jew is discovered while being concealed shall become inaccessible and burned with fire[a], and it shall appear altogether useless to every mortal creature for all time.
translation:
  language: pt
  text: Todo lugar onde for descoberto um judeu escondido[a] torne-se inacessível e fique em chamas, e se mostrará totalmente imprestável para todo ser mortal, para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “um judeu inteiramente escondido”. A construção grega em torno de τὸ σύνολον σκεπαζόμενος é difícil. σκεπαζόμενος significa “escondido” ou “ocultado”, e τὸ σύνολον pode intensificar essa ideia; o decreto trata de um lugar em que se descubra um judeu em ocultação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ... τόπος
  choice: Todo lugar
  rationale: Preserva o alcance distributivo e abrangente do decreto em português natural.
- source_word: οὗ ἐὰν φωραθῇ
  choice: onde for descoberto
  rationale: φωράω indica detectar ou descobrir aquilo que estava oculto; a forma passiva e eventual corresponde ao tom jurídico do texto.
- source_word: τὸ σύνολον σκεπαζόμενος
  choice: inteiramente escondido
  rationale: A construção grega é difícil. A tradução entende τὸ σύνολον adverbialmente, intensificando o estado expresso por σκεπαζόμενος, sem eliminar a ambiguidade, que é indicada em nota.
- source_word: Ἰουδαῖος
  choice: um judeu
  rationale: No contexto, designa alguém pertencente ao povo judeu, alvo de perseguição étnico-religiosa, e não apenas um habitante da Judeia.
- source_word: ἄβατος
  choice: inacessível
  rationale: Expressa um lugar no qual não se pode entrar ou transitar, preservando tanto a proibição quanto a desolação pretendida.
- source_word: πυριφλεγής
  choice: abrasado pelo fogo
  rationale: Mantém o valor adjetival de algo queimado ou inflamado pelo fogo e o tom solene do decreto.
- source_word: πάσῃ θνητῇ φύσει
  choice: para todo ser mortal
  rationale: Representa a formulação abrangente, literalmente relacionada a toda natureza mortal, sem restringi-la apenas aos seres humanos.
- source_word: καθʼ ἅπαν ἄχρηστος
  choice: totalmente imprestável
  rationale: Comunica a inutilidade completa do lugar em linguagem portuguesa atual e dignificada.
- source_word: φανήσεται
  choice: se mostrará
  rationale: Conserva o sentido de aparecer ou revelar-se como sendo algo, sem reduzir o verbo simplesmente a 'ser'.
- source_word: εἰς τὸν ἀεὶ χρόνον
  choice: para sempre
  rationale: É a expressão portuguesa mais natural para a duração permanente indicada pelo grego.
theological_decisions:
- issue: Designação étnico-religiosa Ἰουδαῖος
  choice: um judeu
  alternative: um judeano
  rationale: A narrativa trata da perseguição ao povo judeu como grupo étnico-religioso; restringir o termo a uma procedência geográfica enfraqueceria esse sentido.
- issue: Amplitude de πάσῃ θνητῇ φύσει
  choice: todo ser mortal
  alternative: todo ser humano
  rationale: A expressão grega é deliberadamente ampla; a tradução não a limita à humanidade.
translation_notes:
  register: Português moderno, claro e solene, com cadência própria de decreto. Emprega “judeu” no sentido étnico-religioso contextual e conserva, por meio de nota, a dificuldade sintática da expressão grega sobre o ocultamento.
