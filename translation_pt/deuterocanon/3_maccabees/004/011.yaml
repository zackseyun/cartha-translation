base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/011.yaml
  text: When they had been brought down to the place called Schedia[a], and the voyage had been completed, as had been decreed by the king, he ordered them to encamp in the hippodrome before the city, an open area excellently suited for making an example of them, lying in full view of all who were traveling down into the city and of those being sent out from there into the country on a journey[b], so that they might neither associate with his forces nor, in general, be deemed worthy of an enclosure.
translation:
  language: pt
  text: Depois que foram levados ao lugar chamado Esquédia[a] e a viagem foi concluída, conforme o rei havia decretado, ele ordenou que acampassem no hipódromo diante da cidade, uma área aberta extremamente adequada para expô-los como exemplo, à vista de todos os que desciam para a cidade e dos que dali eram enviados ao interior em viagem, para que não se associassem às tropas do rei nem sequer fossem considerados dignos de um recinto cercado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pista de corridas”. O termo grego designa especificamente um local para corridas de cavalos.
    reason: lexical_alternative
  - marker: b
    text: A cláusula final parece indicar que eles deviam ser mantidos sem associação com as tropas do rei e privados até mesmo de um alojamento devidamente cercado ou protegido.
    reason: textual_clarity
lexical_decisions:
- source_word: Πότιον δὲ ... ἀχθέντων
  choice: Depois que foram levados
  rationale: A forma inicial transmitida é difícil, mas funciona no contexto como transição; a construção temporal em português integra naturalmente o particípio passivo sem lhe atribuir uma nuance mais específica e incerta.
- source_word: τὴν λεγομένην Σχεδίαν
  choice: ao lugar chamado Esquédia
  rationale: Mantém a expressão explicativa λεγομένην e translitera o topônimo de modo legível em português.
- source_word: τὸ παράπλου περαθέντος
  choice: terminada a viagem
  rationale: Preserva a construção absoluta e a noção de conclusão de um percurso por água, sem especificar indevidamente mar ou rio.
- source_word: δεδογματισμένον
  choice: havia decretado
  rationale: Expressa uma decisão real formal já estabelecida.
- source_word: ἱπποδρόμῳ
  choice: hipódromo
  rationale: Designa com precisão histórica um espaço destinado a corridas de cavalos.
- source_word: παρεμβαλεῖν
  choice: acampassem
  rationale: O verbo indica instalar ou colocar um grupo em acampamento, adequado ao confinamento coletivo descrito.
- source_word: ἁπλατῷ καθεστῶτι περιμέτρῳ
  choice: tinha um perímetro aberto
  rationale: A expressão grega é incomum; a tradução conserva a ideia de um espaço exposto, em contraste com o recinto cercado mencionado ao final.
- source_word: πρὸς παραδειγματισμὸν
  choice: para fazer deles um exemplo
  rationale: Comunica a exposição pública com finalidade punitiva ou dissuasória.
- source_word: ἄγαν εὐκαιροτάτῳ
  choice: extremamente apropriado
  rationale: Mantém tanto a intensificação de ἄγαν quanto a forte ideia de adequação expressa pelo superlativo.
- source_word: καταπορευομένοις εἰς τὴν πόλιν
  choice: desciam para a cidade
  rationale: Preserva, de maneira natural, a orientação descendente do verbo composto καταπορεύομαι.
- source_word: στελλομένοις πρὸς ἐκδημίαν
  choice: eram enviados ao interior em viagem
  rationale: Retém as ideias de serem despachados e de viajar para fora, enquanto χώρα é vertido contextualmente como o interior em contraste com a cidade.
- source_word: μηδὲ ταῖς δυνάμεσιν αὐτοῦ κοινωνεῖν
  choice: não teriam contato com as tropas do rei
  rationale: No contexto de separação física, κοινωνεῖν indica associação ou contato, e δυνάμεις refere-se às forças militares reais.
- source_word: μηδὲ τὸ σύνολον καταξιῶσαι περιβόλῳ
  choice: nem seriam sequer considerados dignos de um recinto cercado
  rationale: A formulação mantém a força enfática de τὸ σύνολον e o sentido de negar-lhes até mesmo uma área delimitada ou protegida.
