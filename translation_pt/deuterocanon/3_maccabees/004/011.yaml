revisions:
- from: Depois que foram levados ao lugar chamado Esquédia e terminada a viagem, conforme o rei havia decretado, ele ordenou que acampassem no hipódromo[a] diante da cidade. O local tinha um perímetro aberto e era extremamente apropriado para fazer deles um exemplo, pois ficava à vista de todos os que desciam para a cidade e dos que dali eram enviados ao interior em viagem. Assim, eles não teriam contato com as tropas do rei nem seriam sequer considerados dignos de um recinto cercado.[b]
  to: Depois que foram levados ao lugar chamado Esquédia[a] e a viagem foi concluída, conforme o rei havia decretado, ele ordenou que acampassem no hipódromo diante da cidade, uma área aberta extremamente adequada para expô-los como exemplo, à vista de todos os que desciam para a cidade e dos que dali eram enviados ao interior em viagem, para que não se associassem às tropas do rei nem sequer fossem considerados dignos de um recinto cercado.[b]
  rationale: A revisão restaura a finalidade indicada pela construção grega πρὸς τὸ, substitui uma descrição espacial rígida e pouco natural por formulação mais cautelosa e fluente, e preserva as ambiguidades da cláusula final mediante nota explicativa. Os marcadores de nota permanecem corretamente ancorados.
