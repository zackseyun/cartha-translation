translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura longa do grego foi dividida em três frases para clareza, sem eliminar suas relações lógicas. Preservaram-se a direção de “desciam”, a intensidade do superlativo e a dificuldade interpretativa da descrição do espaço e da cláusula final.
