  yaml_path: translation/deuterocanon/3_maccabees/004/017.yaml
  text: But after the previously mentioned interval of time[a], the scribes reported to the king that it was no longer possible to carry out the registration of the Jews because of their countless multitude.
translation:
  language: pt
  text: Mas, depois do intervalo de tempo mencionado anteriormente, os escrivães informaram ao rei que já não era possível realizar o registro dos judeus[a], por causa de seu número incalculável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “realizar o recenseamento dos judeus”. O termo grego pode indicar registro, alistamento ou recenseamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Mas, depois
  rationale: μετά com acusativo indica sequência temporal, e δέ marca uma transição narrativa levemente contrastiva.
- source_word: τὸ προειρημένον τοῦ χρόνου διάστημα
  choice: o intervalo de tempo mencionado anteriormente
  rationale: Mantém explícita a referência retrospectiva de προειρημένον e traduz διάστημα como um intervalo ou período delimitado.
- source_word: προσηγγέλλον
  choice: informaram
  rationale: O verbo descreve uma comunicação oficial ao rei; o imperfeito grego pode apresentar a ação em curso, sem exigir uma forma progressiva pouco natural em português.
- source_word: οἱ γραμματεῖς
  choice: os escrivães
  rationale: No contexto, eram oficiais encarregados de documentos e registros. “Escrivães” preserva esse sentido administrativo melhor do que o potencialmente religioso “escribas”.
- source_word: μηκέτι ἰσχύειν
  choice: já não era possível
  rationale: A expressão comunica impossibilidade ou incapacidade prática; a construção impessoal é clara e natural em português.
- source_word: τὴν τῶν Ἰουδαίων ἀπογραφὴν ποιεῖσθαι
  choice: realizar o registro dos judeus
  rationale: ἀπογραφή pode designar registro, alistamento ou recenseamento; “registro” mantém a amplitude administrativa do termo, enquanto “realizar” expressa ποιεῖσθαι.
- source_word: διὰ τὴν ἀμέτρητον αὐτῶν πληθύν
  choice: por causa de seu número incalculável
  rationale: διά com acusativo indica causa. A formulação traduz de modo natural a ideia intensiva de uma multidão impossível de medir ou contar.
