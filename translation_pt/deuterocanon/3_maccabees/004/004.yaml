base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/004.yaml
  text: For with the bitter cruelty of a merciless spirit they were being sent out together by the generals in each city[a], so that, beyond the outrageous punishments, even some of their enemies, seeing the common pity before their eyes and considering the uncertain ruin of their life[b], were weeping over their wretched deportation.
translation:
  language: pt
  text: Pois eles eram enviados para fora, todos juntos, pelos comandantes de cada cidade, com a amarga crueldade de uma disposição sem compaixão[a], de modo que, além dos castigos desmedidos, até alguns dos inimigos, ao terem diante dos olhos a compaixão comum e ao considerarem o desfecho incerto da vida, choravam por sua miserável deportação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «eram mandados embora», «eram expulsos» ou «eram deportados». O verbo grego significa literalmente «enviar para fora», mas o contexto indica uma remoção forçada.'
    reason: lexical_alternative
  - marker: b
    text: «A compaixão comum» é a compaixão ordinariamente compartilhada pelos seres humanos. «O desfecho incerto da vida» também pode ser entendido como «a ruína incerta da vida» ou «o fim ainda desconhecido da vida».
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πικρίας ἀνοίκτου ψυχῆς
  choice: com a amarga crueldade de um coração sem compaixão
  rationale: Expressa de modo natural a disposição interior cruel e impiedosa indicada pelo conjunto da frase, sem reduzir ψυχή ao sentido técnico de «alma».
- source_word: οἱ κατὰ πόλιν στρατηγοί
  choice: os comandantes de cada cidade
  rationale: στρατηγός pode designar autoridade militar ou cívica. «Comandantes» conserva a ideia de autoridade sem determinar além do que o contexto permite.
- source_word: ὁμοθυμαδόν
  choice: todos juntos
  rationale: Comunica a ação coletiva e coordenada sofrida pelo grupo; evita sugerir que as vítimas agiam voluntariamente de comum acordo.
- source_word: ἐξαπεστέλλοντο
  choice: eram expulsos
  rationale: Embora o verbo signifique literalmente «eram enviados para fora», o contexto indica remoção coerciva. «Expulsos» preserva essa força, enquanto «deportação» no fim mantém o caráter oficial do ato.
- source_word: ἐπὶ ταῖς ἐξάλλοις τιμωρίαις
  choice: além dos castigos desmedidos
  rationale: Toma ἐπί em sentido aditivo e traduz ἐξάλλοις como algo que ultrapassa a medida normal.
- source_word: τὸν κοινὸν ἔλεον
  choice: a compaixão comum a todos
  rationale: Torna explícito em português corrente que se trata da compaixão humana compartilhada ou universal, não de uma piedade coletiva dirigida por uma instituição.
- source_word: τὴν ἄδηλον τοῦ βίου καταστροφήν
  choice: o destino incerto da vida deles
  rationale: A expressão grega admite «fim», «ruína» ou «reviravolta» desconhecida. «Destino incerto» conserva a indeterminação sem ocultar o tom ameaçador do contexto.
- source_word: δακρύειν
  choice: choravam por
  rationale: 'Reproduz naturalmente o resultado expresso pelo infinitivo: até inimigos foram levados às lágrimas.'
- source_word: τὴν δυσάθλιον ἐξαποστολήν
  choice: sua deplorável deportação
  rationale: «Deportação» comunica a remoção forçada e oficial; «deplorável» transmite a condição extremamente miserável indicada por δυσάθλιον.
