lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: E, quando isso aconteceu
  rationale: Expressa naturalmente a transição temporal; δέ tem aqui força conectiva leve, sem exigir contraste forte.
- source_word: ἀκούσας
  choice: ao saber
  rationale: Traduz o particípio aoristo como circunstância anterior ou concomitante, sem tornar explícito no próprio versículo o sujeito deixado ao contexto pelo grego.
- source_word: τοὺς ἐκ τῆς πόλεως ὁμοεθνεῖς
  choice: seus compatriotas da cidade
  rationale: ὁμοεθνεῖς designa pessoas do mesmo povo ou origem nacional; “compatriotas” é corrente e preserva essa solidariedade étnica.
- source_word: κρυβῇ ἐκπορευομένους
  choice: saíam às escondidas
  rationale: Mantém tanto o movimento para fora quanto o caráter secreto indicado por κρυβῇ.
- source_word: πυκνότερον ὑποδιδράσκειν
  choice: escapavam cada vez mais
  rationale: No contexto, πυκνότερον indica frequência ou incidência crescente, e ὑποδιδράσκειν sugere uma fuga furtiva. A expressão portuguesa evita uma duplicação artificial com a oração precedente.
- source_word: τὴν ἰχθεῖ τῶν ἀδελφῶν ταλαιπωρίαν
  choice: por causa do sofrimento de seus irmãos
  rationale: A forma transmitida ἰχθεῖ é obscura e torna a construção difícil. A tradução segue o sentido contextual aparente — o sofrimento dos irmãos como motivo da fuga — e assinala a dificuldade em nota.
