base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/016.yaml
  text: And the king[a], greatly and continually filled with joy, was arranging banquets before all the idols, with a mind far removed from the truth and with a profane mouth, praising deaf things that were unable to speak or help them[b], but speaking improper things against God.
translation:
  language: pt
  text: O rei, cheio de grande e contínua alegria, promovia banquetes diante de todos os ídolos[a]. Com a mente muito afastada da verdade e a boca profana, elogiava coisas surdas, incapazes de falar ou de lhes prestar socorro, mas dizia coisas impróprias contra Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em honra de todos os ídolos”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega “[o Deus]” aparece entre colchetes na edição-fonte, indicando incerteza textual.
    reason: textual_variant
lexical_decisions:
- source_word: Μεγάλως δὲ καὶ διηνεκῶς ... χαρᾷ πεπληρωμένος
  choice: cheio de uma alegria imensa e contínua
  rationale: Expressa tanto a intensidade de Μεγάλως como a duração de διηνεκῶς em português natural, mantendo o tom elevado.
- source_word: συμπόσια ... συνιστάμενος
  choice: promovia banquetes
  rationale: συμπόσια designa refeições festivas, possivelmente acompanhadas de bebida; no contexto régio e cultual, “banquetes” é mais adequado que “festas” ou “bebedeiras”. συνιστάμενος indica organizar ou realizar esses eventos.
- source_word: ἐπὶ πάντων τῶν εἰδώλων
  choice: diante de todos os ídolos
  rationale: Conserva o valor espacial/cultual básico de ἐπί com o genitivo sem tornar explícita como certa a interpretação mais ampla “em honra de”.
- source_word: πεπληρωμένῃ πόρρω τῆς ἀληθείας φρενί
  choice: com a mente muito afastada da verdade
  rationale: φρήν refere-se aqui à mente ou disposição interior. A formulação portuguesa comunica o afastamento radical da verdade e evita uma reprodução obscura da construção grega.
- source_word: βεβήλῳ στόματι
  choice: a boca profana
  rationale: “Profana” preserva o caráter religioso da irreverência indicada por βέβηλος sem acrescentar uma qualificação doutrinária.
- source_word: κωφὰ
  choice: coisas surdas
  rationale: Mantém o sentido literal e a forma neutra depreciativa do grego, em vez de inserir “ídolos” novamente ou trocar “surdas” por “mudas”.
- source_word: μὴ δυνάμενα αὐτοῖς λαλεῖν ἢ ἀρήγειν
  choice: incapazes de falar com seus adoradores ou de socorrê-los
  rationale: “Socorrer” transmite a força de ἀρήγειν. O referente contextual de αὐτοῖς é explicitado como os adoradores para evitar em português a possível leitura de que o pronome se refere aos próprios ídolos.
- source_word: ἐπαινῶν
  choice: elogiava
  rationale: Representa de modo direto a ação contínua do particípio, em contraste com a fala ofensiva contra Deus.
- source_word: εἰς δὲ [τὸν θεὸν]
  choice: mas dizia contra Deus
  rationale: No contexto hostil, εἰς com λαλῶν admite sentido adversativo. “Contra Deus” preserva o contraste com o elogio aos ídolos, enquanto a nota registra a incerteza textual da expressão entre colchetes.
- source_word: τὶ μὴ καθήκοντα
  choice: coisas impróprias
  rationale: Comunica aquilo que não convém ou não é apropriado, sem especificar além do grego o conteúdo das palavras.
theological_decisions:
- issue: Direção e caráter das palavras do rei a respeito de Deus
  choice: mas dizia contra Deus coisas impróprias
  alternative: mas dizia a respeito de Deus coisas que não convinham
  rationale: O contexto contrapõe o elogio aos ídolos à fala irreverente dirigida contra Deus. O sentido adversativo de εἰς é adequado aqui, mas a nota textual evita ocultar a incerteza manuscrita da expressão nominal.
- issue: Impotência dos ídolos
  choice: coisas surdas, incapazes de falar com seus adoradores ou de socorrê-los
  alternative: ídolos surdos, incapazes de falar com eles ou ajudá-los
  rationale: A redação mantém a personificação depreciativa e a incapacidade dos ídolos afirmadas pelo grego, sem ampliar a afirmação para uma formulação dogmática externa ao verso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe longa do grego foi dividida em duas frases para facilitar a leitura, preservando a progressão entre alegria, banquetes idólatras, elogio aos ídolos e fala contra Deus. “Coisas surdas” é deliberadamente mais literal e retoricamente áspero.
