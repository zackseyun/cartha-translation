    issue: “Depois de serem torturados” impõe anterioridade temporal.
    rationale: στρεβλούμεντας é um particípio presente e descreve as pessoas sendo torturadas em conexão com o desfecho, não necessariamente uma etapa concluída antes dele.
  - severity: low
    issue: “Conforme o trabalho de cada um” acrescenta “de cada um” e singulariza “trabalhos”.
    rationale: O grego traz τῶν ἔργων (“dos trabalhos/obras”) numa construção sintaticamente difícil. A versão deve evitar explicitar uma distribuição individual não marcada de modo inequívoco.
