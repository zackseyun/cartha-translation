  verdict: revise
  source_fidelity: 'A tradução preserva o sentido central: o registro nominal de todo o povo não tinha por finalidade o serviço previamente anunciado, mas sua destruição total em um só dia, mediante torturas. Contudo, “depois de serem torturados” introduz uma sequência temporal que o particípio grego não exige; ele descreve antes a condição ou o meio ligado à destruição.'
  naturalness: O texto é claro, mas a construção “mas para, depois de serem torturados ... , serem” é pesada e temporalmente mais específica que o original. Uma oração com “para que” e o particípio “torturados” é mais fluida em português moderno.
  terminology: “Todo o povo”, “registrado”, “crueldades ordenadas” e “exterminados” são adequados ao contexto. “Conforme o trabalho de cada um” explicita indevidamente a distributividade de “cada um” e reduz os plurais gregos; “conforme os trabalhos” preserva melhor a formulação difícil sem alegar precisão inexistente.
  issues:
