  text: and that the whole nation should be registered by name[a], not for the previously indicated brief service according to their work, but, by being tortured with the ordered cruelties[b], to be utterly destroyed in the course of a single day.
translation:
  language: pt
  text: e que todo o povo fosse registrado pelo nome[a], não para o breve serviço anteriormente indicado, conforme os trabalhos, mas para que, torturados com as crueldades ordenadas[b], fossem completamente exterminados no prazo de um único dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um por um, pelo nome”, explicitando a força individualizadora da expressão.'
    reason: lexical_alternative
  - marker: b
    text: A frase grega sobre o propósito anteriormente anunciado é difícil; provavelmente se refere a um breve período de trabalho ou serviço apresentado antes como pretexto, em contraste com o verdadeiro plano de extermínio.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπογραφῆναι
  choice: fosse registrado
  rationale: O infinitivo designa registro oficial; “registrado” é claro e natural no contexto administrativo.
- source_word: πᾶν τὸ φῦλον
  choice: todo o povo
  rationale: Aqui φῦλον se refere coletivamente ao povo judeu; “povo” evita tanto a ideia de uma única tribo quanto a conotação estatal moderna de “nação”.
- source_word: ἐξ ὀνόματος
  choice: pelo nome
  rationale: A expressão indica registro nominal e individual; a nota explicita sua possível força distributiva.
- source_word: οὐκ εἰς τὴν ἔμπροσθεν βραχεῖ προδεδηλωμένην τῶν ἔργων κατὰ τρόπον λατρείαν
  choice: não para o breve serviço anteriormente indicado, conforme o trabalho de cada um
  rationale: A formulação conserva a referência a um serviço breve anunciado antes e traduz a difícil relação entre serviço e trabalhos sem definir além do que o grego permite.
- source_word: στρεβλούμεντας
  choice: depois de serem torturados
  rationale: O verbo denota tormento ou tortura, possivelmente no potro; o português não especifica um instrumento ausente do texto.
- source_word: παρηγγελμέναις αἰκίαις
  choice: com as crueldades ordenadas
  rationale: Mantém tanto o caráter oficialmente determinado quanto a brutalidade dos maus-tratos.
- source_word: τὸ τέλος ἀφανίσαι
  choice: serem completamente exterminados
  rationale: ἀφανίσαι expressa destruição ou desaparecimento, e τὸ τέλος reforça a totalidade; “exterminados” corresponde ao propósito coletivo no contexto.
- source_word: μιᾶς ὑπὸ καιρὸν ἡμέρας
  choice: no espaço de um único dia
  rationale: Expressa a concentração temporal da destruição dentro do período de um só dia, preservando a construção incomum do grego.
