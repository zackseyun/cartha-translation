  text: Enraged[a], he ordered that these men too be treated in exactly the same way as those others, carefully, falling short in no way of their punishment.
translation:
  language: pt
  text: Furioso, ele ordenou que estes também fossem tratados cuidadosamente da mesma maneira que os outros[a], sem que, de modo algum, seu castigo ficasse aquém do castigo daqueles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que também se fizesse a estes, cuidadosamente, o mesmo que àqueles”. A expressão grega que contém τρόπων tem uma forma incomum, mas o sentido parece ser que este grupo deveria receber o mesmo castigo que o grupo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διοργισθείς
  choice: Furioso
  rationale: O particípio aoristo de διοργίζω expressa ira intensa. “Furioso” é natural, conciso e preserva essa força.
- source_word: προσέταξεν
  choice: ele ordenou
  rationale: Traduz diretamente a emissão de uma ordem autoritativa e se ajusta ao registro narrativo.
- source_word: καὶ τούτοις ὁμοῦ
  choice: estes também
  rationale: Mantém a referência ao grupo presente e a força aditiva de καί/ὁμοῦ, sem acrescentar um substantivo ausente do grego.
- source_word: τὸν αὐτὸν τρόπων
  choice: da mesma maneira
  rationale: A construção grega é formalmente incomum, mas parece indicar identidade de modo ou método no tratamento aplicado.
- source_word: ἐπιμελῶς
  choice: cuidadosamente
  rationale: Preserva a ideia de execução atenta e diligente; no contexto, sugere também rigor na aplicação da pena.
- source_word: ὡς ἐκείνοις ποιῆσαι
  choice: fossem tratados ... que os outros
  rationale: A formulação passiva resulta natural em português e comunica que este grupo deveria receber o mesmo tratamento do grupo anterior.
- source_word: μὴ λειπομένους κατὰ μηδένα τρόπον
  choice: sem que, de modo algum, ... ficasse aquém
  rationale: Reproduz a negação enfática e a noção de não faltar nem ser inferior em qualquer aspecto.
- source_word: τῆς ἐκείνων τιμωρίας
  choice: do castigo daqueles
  rationale: τιμωρία designa aqui tratamento punitivo, e ἐκείνων remete claramente ao grupo mencionado anteriormente.
