  text: But for the Jews there was unspeakable grief and an all-lamenting cry with tears, while their heart, burning on every side with groanings, bewailed the destruction unexpectedly and suddenly decreed against them.
translation:
  language: pt
  text: Mas, entre os judeus, havia uma dor indescritível e um clamor de completa lamentação, acompanhado de lágrimas[a]. Com o coração abrasado por todos os lados pelos gemidos, lamentavam a ruína que, inesperada e repentinamente, fora decretada contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um luto indizível e um clamor de total lamentação, com lágrimas”. O grego é muito retórico e condensado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλεκτον
  choice: indescritível
  rationale: Expressa algo que não pode ser adequadamente posto em palavras e soa natural no português atual, preservando a intensidade retórica.
- source_word: πένθος
  choice: dor
  rationale: No contexto, designa profundo pesar ou luto; “dor” transmite com naturalidade a experiência emocional, sem restringi-la ao aspecto ritual.
- source_word: πανόδυρτος
  choice: de completa lamentação
  rationale: O raro composto intensifica a ideia de lamentar. A locução evita um neologismo pouco natural e conserva a força abrangente do termo.
- source_word: βοή
  choice: clamor
  rationale: Indica um grito alto e coletivo de aflição; “clamor” mantém a força e o registro elevado.
- source_word: στεναγμοῖς
  choice: pelos gemidos
  rationale: O dativo pode indicar meio ou causa associada. A formulação mantém a ligação metafórica entre os gemidos e o coração abrasado.
- source_word: πεπυρωμένης
  choice: abrasado
  rationale: Preserva a metáfora do fogo aplicada à angústia interior e se ajusta ao tom retórico do grego.
- source_word: πάντοθεν
  choice: por todos os lados
  rationale: Conserva a imagem de uma aflição que envolve inteiramente o coração, sem reduzi-la apenas a intensidade genérica.
- source_word: καρδίας
  choice: coração
  rationale: Equivalente direto e transparente para a sede das emoções no contexto.
- source_word: ὀλοφυρομένων
  choice: lamentavam
  rationale: O particípio descreve a ação dos judeus de prantear a calamidade; a forma verbal explícita torna a sintaxe natural em português.
- source_word: ἀπροσδόκητον
  choice: inesperada
  rationale: Mantém a ideia de que a ruína não era prevista, sem fundi-la com a noção distinta de súbito.
- source_word: ἐξαίφνης
  choice: repentinamente
  rationale: Preserva a noção adicional de ocorrência súbita e a acumulação retórica do original.
- source_word: ἐπικριθεῖσαν
  choice: fora decretada contra
  rationale: Comunica uma decisão oficial ou judicial adversa já pronunciada contra eles.
- source_word: ὀλεθρίαν
  choice: ruína
  rationale: O adjetivo substantivado refere-se a uma calamidade destrutiva; “ruína” conserva a gravidade sem especificar além do grego.
