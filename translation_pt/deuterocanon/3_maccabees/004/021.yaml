  naturalness: «Ação invencível da providência» é mais natural e transparente em português moderno do que «atuação invencível da providência». A oração relativa «daquele que, do céu, ajuda os judeus» mantém boa fluência e deixa claro o vínculo principal adotado para «do céu».
