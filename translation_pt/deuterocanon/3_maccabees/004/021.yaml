  text: But this was the invincible working of the providence from heaven of the one helping the Jews[a].
translation:
  language: pt
  text: Mas isto era uma ação invencível da providência daquele que, do céu, ajuda os judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo «do céu» como qualificando «providência»: “Mas isto era uma ação invencível da providência do céu daquele que ajuda os judeus.”'
    reason: alternativa sintática
lexical_decisions:
- source_word: ἐνέργεια
  choice: atuação
  rationale: O substantivo indica ação eficaz ou poder em operação. “Atuação” é natural em português e evita restringir o sentido a um milagre específico.
- source_word: προνοίας
  choice: providência
  rationale: No contexto, designa o cuidado soberano e ativo de origem divina, não simples previsão ou planejamento humano.
- source_word: τοῦ βοηθοῦντος
  choice: daquele que ajuda
  rationale: Preserva o particípio presente substantivado sem nomear explicitamente Deus, mantendo a forma indireta do grego.
- source_word: τοῖς Ἰουδαίοις
  choice: os judeus
  rationale: Refere-se ao povo judeu como grupo étnico-religioso, e não apenas a habitantes da Judeia.
- source_word: ἐξ οὐρανοῦ
  choice: do céu
  rationale: Expressa a origem celeste ou divina da ajuda. Sua posição no grego permite também associá-la mais diretamente à providência, ambiguidade registrada em nota.
- source_word: ἀνίκητον
  choice: invencível
  rationale: Conserva a força da ideia de algo que não pode ser vencido ou frustrado. Embora a forma grega neutra se relacione formalmente com τοῦτο, em português a construção natural a vincula semanticamente à atuação.
theological_decisions:
- issue: Referente de “daquele que ajuda os judeus”
  choice: Referência implícita a Deus, sem inserir o nome divino no texto
  alternative: “de Deus, que ajuda os judeus do céu”
  rationale: O grego emprega um particípio substantivado e não nomeia Deus diretamente; a tradução mantém essa reserva, embora o referente divino seja sugerido pelo contexto.
- issue: Relação sintática de “do céu”
  choice: Ligação principal com a ação daquele que ajuda
  alternative: “da providência que vem do céu daquele que ajuda os judeus”
  rationale: A ordem grega admite relacionar ἐξ οὐρανοῦ tanto ao ato de ajudar quanto à providência. O texto principal adota a leitura mais fluente em português, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a referência indireta a Deus e registra em nota a ambiguidade sintática de “do céu”.
