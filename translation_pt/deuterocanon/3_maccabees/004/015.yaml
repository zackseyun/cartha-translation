  yaml_path: translation/deuterocanon/3_maccabees/004/015.yaml
  text: So the registration of these people was carried out with bitter urgency and zealous exertion[a], from the rising of the sun to its setting[c][b], reaching no completion for forty days.
translation:
  language: pt
  text: Assim, o registro dessas pessoas prosseguia com penosa urgência e zelo intenso, do nascer do sol ao pôr do sol,[a] sem chegar ao fim por quarenta dias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dos nascimentos do sol aos ocasos”; expressão que indica trabalho contínuo ao longo do dia.
    reason: cultural_note
  - marker: b
    text: Isto é, o processo não chegou à conclusão ao longo dos quarenta dias.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογραφὴ
  choice: registro
  rationale: Designa uma listagem administrativa oficial; “registro” preserva esse sentido sem especificar além do grego que se tratava de um censo populacional completo.
- source_word: πικρᾶς σπουδῆς
  choice: penosa urgência
  rationale: σπουδή reúne as ideias de pressa e esforço diligente, enquanto πικρός dá ao processo um caráter gravoso e doloroso; “penosa urgência” comunica ambos em português natural.
- source_word: φιλοτίμου προσθεσίας
  choice: empenho zeloso
  rationale: A expressão descreve aplicação intensa e empenhada. “Empenho zeloso” evita atribuir inequivocamente uma motivação negativa, sem apagar a força do esforço acrescentado.
- source_word: ἀπὸ ἀνατολῶν ἡλίου μέχρι δυσμῶν
  choice: desde o nascer do sol até o pôr do sol
  rationale: Preserva a imagem do original e expressa idiomaticamente trabalho contínuo ao longo de cada dia.
- source_word: ἀνήνυτον λαμβάνουσα τὸ τέλος
  choice: sem chegar ao fim
  rationale: Reproduz de modo natural a ideia de que o procedimento continuava sem alcançar sua conclusão.
- source_word: ἐπὶ ἡμέρας τεσσεράκοντα
  choice: durante quarenta dias
  rationale: Indica a duração do processo inconcluso e mantém a possibilidade contextual de que ele não tenha sido concluído nesse período.
