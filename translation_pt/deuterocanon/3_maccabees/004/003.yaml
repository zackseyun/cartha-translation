  source_fidelity: A enumeração retórica, os termos cívicos e a dupla expressão de luto são bem representados. Contudo, o imperfeito passivo grego (οὐκ ἐνεπιπλῶντο) é mais bem preservado por «não se enchiam» do que por «não ficaram cheios», que desloca o aspecto para um resultado pontual. «Mesmo» transmite de modo mais natural a força intensificadora de τὸ σύνολον neste contexto.
  naturalness: 'A redação é clara e de registro apropriado. «Não ficaram cheios» apresenta ainda discordância: «ruas» é feminino, e o particípio/adjetivo «cheios» não pode abranger naturalmente toda a série. A construção pronominal «não se enchiam de» elimina essa dificuldade e soa idiomática.'
  terminology: «Distrito», «cidade», «lugar habitado», «ruas», «pranto» e «lamentações» são escolhas adequadas. As notas preservam corretamente tanto a estranheza do adjetivo transmitido quanto a nuance ritual de κόπετος.
  issues:
