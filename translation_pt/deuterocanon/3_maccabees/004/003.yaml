  text: What district[a], or city, or indeed what inhabited place at all, or what streets[b], were not filled with mourning and lamentation over them?
translation:
  language: pt
  text: Que distrito, ou cidade, ou mesmo que lugar habitado[a], ou que ruas não se enchiam de pranto[b] e lamentações por causa deles?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O adjetivo grego traduzido por “habitado” é incomum neste testemunho; pelo contexto, parece referir-se a qualquer lugar onde viviam pessoas.
    reason: textual_variant
  - marker: b
    text: “Pranto” traduz um termo que pode evocar mais especificamente o luto ritual, inclusive o ato de bater no peito.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομός
  choice: distrito
  rationale: Em uso helenístico, pode designar uma divisão administrativa; “distrito” preserva esse sentido e é claro em português.
- source_word: πόλις
  choice: cidade
  rationale: Equivalente corrente do termo cívico grego e adequado à enumeração retórica.
- source_word: τὸ σύνολον
  choice: em suma
  rationale: A expressão tem força adverbial e amplia a pergunta para toda espécie de lugar; “em suma” reproduz naturalmente essa intensificação.
- source_word: οἰκτιστὸς τόπος
  choice: lugar habitado
  rationale: O adjetivo transmitido é incomum, mas o contexto aponta para qualquer local onde vivam pessoas; a nota preserva a incerteza textual.
- source_word: ἀγυιαί
  choice: ruas
  rationale: Designa vias públicas em áreas habitadas; “ruas” é a opção portuguesa mais natural.
- source_word: κοπετοῦ
  choice: pranto
  rationale: O termo denota luto exteriorizado e pode incluir o gesto ritual de bater no peito; “pranto” mantém o tom de aflição pública sem se confundir com γόων.
- source_word: γόων
  choice: lamentações
  rationale: Realça manifestações audíveis de dor; o plural é idiomático em português e distingue o termo de “pranto”.
- source_word: ἐπʼ αὐτοῖς
  choice: por causa deles
  rationale: A preposição com o dativo indica a ocasião ou causa da aflição; a tradução evita pressupor que todos já estivessem mortos.
- source_word: οὐκ ἐνεπιπλῶντο
  choice: não ficaram cheios
  rationale: O imperfeito passivo expressa que os lugares se enchiam; a concordância no masculino plural segue a enumeração de referentes de gêneros e números diferentes.
