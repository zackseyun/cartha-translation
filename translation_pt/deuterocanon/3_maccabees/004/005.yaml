  text: For an old man was being led along[a], full of gray hair, bent over by the weakness in his feet that comes with age, driven by the violent force of being thrown down[c][b], making use of a swift march without any regard for all dignity.
translation:
  language: pt
  text: Pois um homem idoso, de cabelos completamente brancos, era levado, encurvado pela debilidade dos pés causada pela velhice; impelido pelo violento ímpeto de ser derrubado[a], era forçado a avançar depressa[b], sem o menor respeito por qualquer dignidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é compacta e difícil; pode indicar o violento ímpeto de uma queda, a ação de derrubá-lo ou a pressão que o fazia avançar aos tropeções.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fazia uso de uma marcha rápida”. A construção pode ressaltar tanto o passo acelerado como a coerção que obrigava o idoso a mantê-lo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sem nenhum pudor” ou “sem qualquer respeito pelo decoro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγετο
  choice: era levado
  rationale: O imperfeito passivo retrata uma ação em curso e coerciva, sem especificar além do texto quem o levava.
- source_word: γέρων
  choice: um homem idoso
  rationale: Designa aqui um homem de idade avançada, não alguém que ocupe o cargo de presbítero ou ancião.
- source_word: πλήρης πολιᾶς
  choice: de cabelos completamente brancos
  rationale: Reproduz de modo natural a imagem enfática de alguém cheio de cãs.
- source_word: πεπυκασμένος ... ἐπικύφων
  choice: encurvado
  rationale: Os termos compõem a descrição de uma postura comprimida e inclinada; a tradução evita uma repetição pouco natural, sem perder a imagem física.
- source_word: τὴν ἐκ τοῦ γήρως νωθρίτητα ποδῶν
  choice: pela lentidão dos pés causada pela velhice
  rationale: Mantém o valor corporal de νωθρίτης — lentidão, torpor ou debilidade — e sua causa explicitamente ligada à idade.
- source_word: ἀνατροπῆς ὁρμῇ βιαίας
  choice: sob um impulso violento que o fazia tombar
  rationale: A expressão grega é compacta e difícil. A opção comunica tanto a violência exercida como o movimento de queda, sem lhe dar um sentido político estranho ao contexto.
- source_word: πρὸς ὀξεῖαν καταχρώμενος πορείαν
  choice: era forçado a avançar depressa
  rationale: Expressa o ritmo rápido e impróprio imposto ao idoso no contexto de sua condução coerciva. A nota preserva a possibilidade mais formal de ele estar 'fazendo uso' de uma marcha rápida.
- source_word: ἁπάσης αἰδοῦς ἄνευ
  choice: sem a menor consideração por sua dignidade
  rationale: αἰδώς pode indicar pudor, respeito ou decoro. No contexto, a formulação destaca a total falta de consideração dispensada ao idoso, preservando a força de ἁπάσης.
