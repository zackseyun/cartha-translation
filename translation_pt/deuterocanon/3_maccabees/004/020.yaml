translation:
  language: pt
  text: afirmando, com provas, que até o papiro e os cálamos de escrita que vinham usando já haviam acabado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as penas de junco». O grego diz literalmente «os cálamos de escrita».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγόντων
  choice: afirmando
  rationale: Particípio no genitivo plural que dá continuidade ao relato; «afirmando» expressa uma declaração sustentada, sem acrescentar certeza além do grego.
- source_word: μετὰ ἀποδείξεως
  choice: com provas
  rationale: ἀπόδειξις indica demonstração ou prova; o plural idiomático «com provas» comunica em português que a afirmação era comprovada.
- source_word: τὴν χαρτηρίαν
  choice: o papiro
  rationale: Designa material de escrita feito de papiro; a escolha preserva a precisão histórica e evita o anacronismo de «papel».
- source_word: τοὺς γραφικοὺς καλάμους
  choice: os cálamos de escrita
  rationale: Reproduz de perto a expressão grega «cálamos para escrever», mantendo o objeto antigo reconhecível; a nota oferece a formulação funcional mais comum.
- source_word: ἐν οἷς ἐχρῶντο
  choice: que vinham usando
  rationale: O imperfeito expressa uso contínuo anterior ao momento da declaração; «vinham usando» transmite essa duração naturalmente.
- source_word: ἐκλελοιπέναι
  choice: já haviam acabado
  rationale: O infinitivo perfeito indica que o esgotamento já estava consumado; «haviam acabado» é natural e abrange conjuntamente o papiro e os cálamos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Cálamos» conserva o referente histórico, enquanto a nota esclarece sua função. A construção permanece como fragmento sintaticamente dependente, acompanhando a forma do versículo grego e sua continuidade narrativa.
