base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/006.yaml
  text: And the young women who had just entered the bridal chamber for the sharing of life in marriage[a], taking up lamentation instead of joy, and with their perfume-drenched hair smeared with dust, were being led away unveiled, and with one accord raised a dirge instead of wedding songs[c][b], as though torn apart by abuse from foreigners.
translation:
  language: pt
  text: As jovens que acabavam de entrar no aposento nupcial para partilhar a vida no casamento[a] passaram a lamentar, em vez de se alegrar. Com os cabelos encharcados de perfume e cobertos de pó, eram levadas com a cabeça descoberta[b] e, todas juntas, entoavam uma lamentação em vez de cânticos nupciais, como se fossem dilaceradas pelos maus-tratos de estrangeiros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no leito nupcial”; a expressão grega pode designar o aposento ou o leito do casamento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “descobertas” ou “com a cabeça descoberta”, o que neste contexto representa humilhação pública.
    reason: cultural_note
  - marker: c
    text: Ou “por maus-tratos estrangeiros”; o grego pode caracterizar os maus-tratos como ligados a pessoas de outra nação, sem tornar inequívoca a relação sintática.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτι
  choice: acabavam de
  rationale: Expressa a recentidade imediata da entrada na vida conjugal e se integra naturalmente à construção portuguesa.
- source_word: πρὸς βίου κοινωνίαν
  choice: para partilhar a vida
  rationale: Preserva a ideia de participação e vida em comum, sem recorrer a uma formulação técnica ou confessional.
- source_word: γαμικὸν ... παστὸν
  choice: o aposento nupcial
  rationale: Representa o espaço nupcial indicado por παστός e evita reduzir a expressão especificamente ao leito.
- source_word: νεάνιδες
  choice: as jovens
  rationale: Mantém a referência à idade e ao gênero; o contexto já deixa clara a condição de recém-casadas.
- source_word: ἀντὶ τέρψεως μεταλαβοῦσαι γόους
  choice: receberam lamentos em vez de alegria
  rationale: Conserva o contraste de substituição expresso por ἀντί e o sentido de passar a ter parte em lamentos.
- source_word: μυροβρεχῆ ... κόμην
  choice: os cabelos encharcados de perfume
  rationale: Transmite de forma vívida e compreensível que os cabelos estavam impregnados de óleo perfumado, sem especificar uma substância não indicada.
- source_word: κόνει ... πεφυρμέναι
  choice: cobertos de pó
  rationale: Comunica naturalmente o aviltamento dos cabelos preparados para as núpcias; a construção grega sugere que foram sujos ou besuntados de pó.
- source_word: ἀκαλύπτως
  choice: com a cabeça descoberta
  rationale: Torna explícita a aparência pública indicada pelo advérbio e evita que 'sem véu' seja entendido apenas como ausência de véu nupcial.
- source_word: ἀγόμεναι
  choice: eram levadas
  rationale: Mantém a voz passiva e a coerção implícita sem acrescentar um grau de violência não expresso pelo verbo isoladamente.
- source_word: θρῆνον
  choice: uma lamentação
  rationale: Indica um canto fúnebre ou lamento solene em português corrente e digno.
- source_word: ὑμεναίων
  choice: cânticos nupciais
  rationale: Reproduz o sentido de canções próprias da celebração matrimonial em registro literário acessível.
- source_word: ὁμοθυμαδόν
  choice: todas juntas
  rationale: Expressa a ação coletiva e concorde das jovens em linguagem portuguesa natural.
- source_word: ὡς ἐσπαραγμέναι
  choice: como se fossem dilaceradas
  rationale: Preserva a comparação introduzida por ὡς e a força imagética de σπαράσσω, sem convertê-la em afirmação factual inequívoca.
- source_word: αἰκίαις ἀλλοεθνεῖσιν
  choice: pelos maus-tratos de estrangeiros
  rationale: Entende ἀλλοεθνεῖσιν em relação aos agentes dos maus-tratos, opção sintaticamente plausível, mantendo a alternativa em nota.
