base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/008.yaml
  text: And their relatives[a], with nooses wrapped around their necks instead of garlands, though in the full bloom of youth, spent the remaining days of their weddings in mourning instead of feasting and youthful ease, already seeing Hades lying at their feet.
translation:
  language: pt
  text: E os parentes deles, com laços enrolados em seus pescoços em vez de grinaldas, embora estivessem no pleno vigor da juventude, passavam em prantos os dias restantes das festas de casamento, em vez de se entregarem a banquetes e à despreocupação juvenil, já vendo Hades estendido a seus pés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a morte”, “a sepultura” ou “a morada dos mortos”. O grego usa Hades, preservando a imagem do mundo ou domínio dos mortos, sem especificar o castigo final.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγενεῖς
  choice: parentes
  rationale: Expressa de modo natural e abrangente os ligados por parentesco, sem restringir o termo aos homens.
- source_word: βρόχους
  choice: laços apertados
  rationale: Preserva a imagem sombria de laços que envolvem o pescoço e o contraste com as grinaldas nupciais; evita que o português sugira exclusivamente um método formal de execução.
- source_word: ὡς ἀντὶ στεφέων
  choice: em vez de grinaldas
  rationale: Comunica diretamente a inversão irônica dos adornos festivos próprios do casamento.
- source_word: τοὺς αὐχένας περιπεπλεγμένοι
  choice: apertados ao redor do pescoço
  rationale: Torna clara a imagem física dos laços enroscados ou cingidos ao pescoço, em português corrente.
- source_word: μετὰ ἀκμαίας νεανικῆς ἡλικίας
  choice: embora estivessem no pleno vigor da juventude
  rationale: Reproduz a ideia de juventude em seu auge e explicita o valor concessivo sugerido pelo contraste contextual.
- source_word: εὐωχίας
  choice: banquetes
  rationale: No contexto das festividades de casamento, designa vivamente a comida e a celebração festiva.
- source_word: νεωτερικῆς ῥᾳθυμίας
  choice: despreocupação juvenil
  rationale: Mantém a noção de ócio, leveza ou prazer despreocupado próprio da juventude, sem impor uma censura moral que o contexto não exige.
- source_word: τὰς ἐπιλοίπους τῶν γάμων ἡμέρας
  choice: os dias restantes das festas de casamento
  rationale: Interpreta o plural γάμων no sentido contextual das celebrações nupciais, e não do matrimônio como estado abstrato.
- source_word: ἐν θρήνοις διῆγον
  choice: passavam em prantos
  rationale: Expressa de maneira natural o ato de passar aqueles dias entre lamentações, preservando a intensidade de θρῆνοι.
- source_word: παρὰ πόδας ἤδη τὸν ἅδην ὁρῶντες κείμενον
  choice: já viam o Hades estendido aos seus pés
  rationale: Conserva o termo explícito Ἅιδης e a imagem personificada ou espacial de uma morte iminente diante deles.
theological_decisions:
- issue: Tradução de ἅδην
  choice: Hades
  alternative: morte; sepultura; morada dos mortos
  rationale: O grego emprega explicitamente Ἅιδης. Mantê-lo preserva a imagem da esfera dos mortos sem identificá-la indevidamente com o castigo final; a nota oferece equivalentes contextuais possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sintaxe conserva os contrastes fortes do grego entre laços e grinaldas, pranto e festa, juventude e morte iminente.
