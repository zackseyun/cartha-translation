  source_fidelity: A tradução preserva bem os contrastes centrais e mantém adequadamente «Hades». Contudo, «apertados» não traduz com precisão o particípio περιπεπλεγμένοι, que descreve os laços enrolados/emaranhados em volta dos pescoços. Além disso, «pois» torna a visão de Hades uma causa explicitamente enunciada, quando o particípio grego a apresenta como circunstância concomitante.
  naturalness: O português é claro, moderno e de registro apropriado. «Laços enrolados em seus pescoços» é mais idiomático e visualmente fiel do que «laços apertados ao redor do pescoço»; «já vendo» evita a inferência causal acrescentada por «pois».
  terminology: «Parentes», «grinaldas», «festas de casamento», «banquetes», «despreocupação juvenil» e «Hades» são escolhas adequadas. A nota mantém a ambiguidade sem introduzir uma leitura doutrinária de castigo final.
