lexical_decisions:
- source_word: καίπερ
  choice: embora
  rationale: Introduz com naturalidade a circunstância concessiva expressa pelo grego.
- source_word: ὄντων ἔτι κατὰ τὴν χώραν τῶν πλειόνων
  choice: a maioria ainda estivesse pelo país
  rationale: Traduz o genitivo absoluto e conserva o possível sentido distributivo de κατὰ τὴν χώραν sem restringir χώρα a uma região específica.
- source_word: τῶν μὲν κατὰ τὰς οἰκίας ἔτι συνεστηκότων
  choice: alguns ainda reunidos em suas casas
  rationale: Reproduz a divisão partitiva marcada por μὲν...δὲ; «reunidos» expressa o estado resultante de συνεστηκότων, e «em suas casas» comunica o valor distributivo da expressão.
- source_word: τῶν δὲ καὶ κατὰ τὸν τόπον
  choice: e outros também no local
  rationale: Mantém a formulação elíptica e pouco específica do grego, sem identificar indevidamente o lugar como praça, ponto de reunião ou localidade.
- source_word: ὡς ἀδυνάτου καθεστῶτος
  choice: visto que a situação se tornara impossível
  rationale: Torna explícito o referente implícito de ἀδυνάτου e expressa o provável valor causal de ὡς, preservando a noção de um estado de coisas já estabelecido.
- source_word: πᾶσιν τοῖς ἐπ᾽ Αἴγυπτον στρατηγοῖς
  choice: para todos os comandantes encarregados do Egito
  rationale: «Comandantes» comunica a função de στρατηγοῖς em linguagem atual; «encarregados do Egito» preserva a ideia de autoridade ou responsabilidade indicada por ἐπ᾽ Αἴγυπτον.
