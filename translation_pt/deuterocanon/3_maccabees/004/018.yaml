  source_fidelity: A tradução representa corretamente a construção concessiva (καίπερ), a maioria ainda presente na χώρα, a divisão μὲν...δὲ entre os que estavam reunidos em casas e os outros «no lugar», bem como a dificuldade para os στρατηγοί responsáveis pelo Egito. «Pelo país», porém, tende a introduzir o sentido distributivo de «por todo o país», enquanto o texto base permite mais diretamente «no país»; essa possibilidade deve ficar em nota como alternativa.
  naturalness: O português é em geral claro, mas «embora ... — ... —, visto que ...» combina duas subordinadas sem oração principal expressa e fica excessivamente truncado em português. O grego também é uma construção dependente, mas a relação causal pode ser expressa mais suavemente por «pois» sem resolver a elipse do trecho.
  terminology: «Comandantes encarregados do Egito» é uma boa tradução moderna e não excessivamente específica de τοῖς ἐπ᾽ Αἴγυπτον στρατηγοῖς. «Local» preserva adequadamente a indefinição de τὸν τόπον; a nota explica a elipse sem impor uma identificação.
