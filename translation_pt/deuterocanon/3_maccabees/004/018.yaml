  - severity: medium
    issue: Encadeamento sintático pouco natural de «embora» com «visto que».
    rationale: Embora o original seja uma construção elíptica e dependente, «pois» comunica de forma mais natural o valor explicativo/causal de ὡς sem acrescentar uma oração principal inexistente no texto.
