base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/004/001.yaml
  text: And everywhere this decree arrived[a], a public celebration was organized among the nations with shouting and joy[b], as though the hatred long before dancing in their minds against them were now being openly displayed with boldness.
translation:
  language: pt
  text: Em todo lugar onde esse decreto chegava, organizava-se entre os povos[a] uma festa pública[b], com gritos e alegria, como se o ódio contra eles, que há muito já saltitava em seus pensamentos[c], agora se manifestasse abertamente, com ousadia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os gentios”. Aqui, “os povos” provavelmente se refere à população não judaica.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega pode indicar uma festa realizada às custas do erário.
    reason: lexical_alternative
  - marker: c
    text: O particípio grego é vívido e difícil; retrata o ódio como algo que há muito já saltitava ou se agitava em seus pensamentos antes de vir a público.
    reason: textual_difficulty
lexical_decisions:
- source_word: Πάντῃ δὲ ὅπου
  choice: Por toda parte aonde
  rationale: Reproduz o alcance distributivo e a construção enfática do grego em português natural.
- source_word: προσέπιπτεν
  choice: chegava
  rationale: No contexto de um decreto que alcança sucessivos lugares, transmite idiomaticamente o sentido de “cair sobre” ou “alcançar”.
- source_word: πρόσταγμα
  choice: decreto
  rationale: Designa uma ordem oficial e preserva o registro administrativo do relato.
- source_word: δημοτελὴς ... εὐωχία
  choice: uma festa pública
  rationale: εὐωχία indica festejo com comida e bebida, enquanto δημοτελής sugere caráter cívico e possivelmente custeio público; a nota preserva essa nuance.
- source_word: τοῖς ἔθνεσιν
  choice: entre os povos
  rationale: Mantém o sentido básico de ἔθνη sem eliminar a provável referência contextual à população não judaica.
- source_word: ἀλαλαγμῶν καὶ χαρᾶς
  choice: com gritos e alegria
  rationale: Preserva tanto a intensidade sonora de ἀλαλαγμός quanto o caráter jubiloso expresso por χαρά.
- source_word: προκατεσκιρωμένης ... πάλαι κατὰ διάνοιαν
  choice: que havia muito saltitava no pensamento daqueles povos
  rationale: Conserva a imagem incomum e vívida do particípio, sem reduzi-la silenciosamente a uma formulação abstrata como “estava latente”.
- source_word: μετὰ παρρησίας νῦν ἐκφαινομένης
  choice: agora se manifestasse abertamente e com ousadia
  rationale: Expressa o contraste entre hostilidade interior e manifestação pública, preservando em παρρησία a ideia de franqueza destemida ou ousadia.
theological_decisions:
- issue: Sentido de τοῖς ἔθνεσιν no contexto judaico
  choice: entre os povos
  alternative: entre os gentios
  rationale: “Povos” preserva a amplitude lexical do grego, enquanto uma nota esclarece que, neste contexto narrativo, a expressão provavelmente aponta para a população não judaica, sem tornar a interpretação mais específica que o texto.
- issue: Imagem da hostilidade interior em προκατεσκιρωμένης
  choice: havia muito saltitava no pensamento
  alternative: havia muito se agitava no íntimo
  rationale: A formulação escolhida mantém a metáfora difícil e a tensão do original, em vez de resolver a imagem por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o movimento do período grego, mas evita rigidez excessiva. “Festa pública” comunica o caráter cívico do evento; “saltitava” é deliberadamente incomum para preservar a imagem marcada do original.
