  yaml_path: translation/deuterocanon/3_maccabees/004/019.yaml
  text: But they were persuaded against them all the more harshly[a], on the ground that they had been bribed as part of a scheme for escape, and it clearly happened that he was convinced of this.
translation:
  language: pt
  text: Mas foram convencidos ainda mais severamente contra eles[a], sob a alegação de que haviam sido subornados como parte de um plano de fuga; e tornou-se claro que ele fora convencido disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A sintaxe grega neste trecho é condensada e um tanto difícil. A oração final também pode ser traduzida: “e ficou claro que ele estava convencido disso”.'
    reason: alternativa sintática e lexical
lexical_decisions:
- source_word: ἐπείσθησαν
  choice: foram convencidos
  rationale: O aoristo passivo de πείθω conserva a voz passiva e não explicita quem os convenceu.
- source_word: αὐτοῖς
  choice: contra eles
  rationale: Embora o dativo admita outras relações com πείθομαι, o contexto lhe dá força adversativa; a tradução mantém o referente pronominal sem o identificar além do grego.
- source_word: σκληρότερον
  choice: com severidade ainda maior
  rationale: Reproduz o valor adverbial e comparativo de σκληρότερον, permitindo que a severidade qualifique o processo de convencimento ou a atitude resultante.
- source_word: δεδωροκημένοις
  choice: haviam sido subornados
  rationale: O particípio perfeito passivo exprime a acusação de que eles tinham sido comprados mediante suborno.
- source_word: εἰς μηχανὴν τῆς ἐκφυγῆς
  choice: como parte de um plano de fuga
  rationale: μηχανή designa um expediente ou plano, e ἐκφυγή, uma fuga; a formulação é natural e preserva o tom acusatório.
- source_word: συνεβῆ σαφῶς
  choice: aconteceu claramente
  rationale: Mantém tanto o sentido impessoal de συνέβη quanto o advérbio σαφῶς, sem eliminar a construção comprimida do grego.
- source_word: πιστωθῆναι
  choice: ficou convencido
  rationale: O infinitivo aoristo passivo de πιστόω indica que o referente masculino singular foi levado a ter certeza da acusação.
