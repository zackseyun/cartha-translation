  text: and with the dense planking above arranged so that[a], their eyes being darkened on every side, they might receive a transport fit for plotters throughout the whole voyage.
translation:
  language: pt
  text: Além disso, uma cobertura compacta de tábuas foi disposta acima deles, para que, privados de luz por todos os lados, fossem submetidos, durante toda a travessia marítima, a um transporte próprio de conspiradores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fossem transportados como conspiradores durante toda a travessia marítima”. O termo grego traduzido por “conspiradores” é pejorativo e também pode designar pessoas traiçoeiras ou consideradas perigosas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθύπερθε
  choice: por cima
  rationale: Indica a posição da cobertura sobre os prisioneiros, em formulação natural e direta em português.
- source_word: πυκνῷ σανιδώματι
  choice: uma compacta cobertura de tábuas
  rationale: σανίδωμα designa uma estrutura feita de tábuas, e πυκνός indica que eram cerradas ou compactamente dispostas; “cobertura de tábuas” esclarece a função no contexto sem especificar em excesso a arquitetura da embarcação.
- source_word: διακειμένῳ
  choice: disposta
  rationale: O particípio descreve como a estrutura estava instalada ou arranjada, com finalidade expressa pela oração seguinte.
- source_word: ὅπως πάντοθεν ἐσκοτισμένοι τοὺς ὀφθαλμούς
  choice: de modo que, privados de luz por todos os lados
  rationale: Expressa a finalidade de impedir a visão a partir de qualquer direção. A formulação portuguesa comunica o efeito sobre os olhos sem rigidez sintática.
- source_word: ἀγωγήν
  choice: tratamento
  rationale: Neste contexto, ἀγωγή pode indicar o modo de conduzir ou transportar alguém. “Tratamento” combina naturalmente com “próprio de conspiradores” e ressalta as condições impostas durante o transporte.
- source_word: ἐπιβόλων
  choice: próprio de conspiradores
  rationale: ἐπίβολος tem sentido pejorativo e pode designar pessoas que tramam ou são consideradas perigosas. A escolha preserva a caracterização hostil sem reduzi-la ao termo genérico “criminosos”.
- source_word: ἐν παντὶ τῷ κατάπλῳ
  choice: durante toda a travessia marítima
  rationale: κατάπλους se refere especificamente a uma viagem ou passagem por mar; a tradução preserva tanto o meio quanto a duração completa.
