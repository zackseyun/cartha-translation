  text: And as prisoners they were dragged by force in public until their embarkation onto the ship[a].
translation:
  language: pt
  text: E, como prisioneiros, eram arrastados à força em público até serem colocados no navio[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até serem metidos no navio”. A expressão grega se refere literalmente ao ato de fazê-los entrar, ou de lançá-los, para dentro da embarcação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιοι
  choice: como prisioneiros
  rationale: O termo designa pessoas presas ou mantidas em correntes; a construção «como prisioneiros» preserva sua função predicativa e soa natural em português.
- source_word: δημοσίᾳ
  choice: em público
  rationale: Neste contexto, o advérbio indica que o ato ocorria publicamente, à vista de todos; o possível sentido de «às custas públicas» não se ajusta ao movimento coercivo descrito.
- source_word: μέχρι τῆς εἰς τὸ πλοῖον ἐμβολῆς
  choice: até serem colocados no navio
  rationale: A expressão indica o ato de fazê-los entrar no navio. Esta formulação é clara e idiomática, enquanto a nota preserva a força mais concreta de ἐμβολή, que pode sugerir introdução ou arremesso para dentro.
- source_word: εἵλκοντο
  choice: eram arrastados
  rationale: O imperfeito passivo descreve uma ação contínua sofrida pelos prisioneiros; «arrastados» transmite adequadamente o movimento forçado.
- source_word: μετὰ βίας
  choice: à força
  rationale: A locução expressa coerção e violência; «à força» é conciso, natural e fiel ao contexto.
