  text: 'And they were brought down, driven like beasts by the compulsion of iron chains: some with their necks fastened to the yokes of the ships, and others with their feet secured in unbreakable fetters,'
translation:
  language: pt
  text: 'E foram levados para baixo, conduzidos como feras sob a coerção de correntes de ferro[a]: uns, com o pescoço preso[c] aos jugos dos navios[b]; outros, com os pés firmemente presos em grilhões inquebráveis,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sob a coerção de vínculos de ferro”. A expressão grega reúne de modo condensado as ideias de restrição de ferro e compulsão.'
    reason: lexical_alternative
  - marker: b
    text: Os “jugos dos navios” talvez fossem traves ou barras das embarcações às quais os prisioneiros eram presos; o grego conserva a imagem do jugo imposto a animais.
    reason: cultural_note
  - marker: c
    text: “Preso” também pode ser traduzido por “pregado”, caso o verbo seja entendido em seu sentido mais forte; o contexto imediato, porém, não exige essa interpretação mais específica.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήχθησαν
  choice: foram levados para baixo
  rationale: Preserva a voz passiva e a força direcional de κατάγω sem especificar um destino que o grego não declara.
- source_word: θηρίων τρόπον
  choice: como feras
  rationale: Expressão comparativa natural em português, mantendo a imagem desumanizadora.
- source_word: ἀγόμενοι
  choice: conduzidos
  rationale: Mantém o sentido básico e relativamente neutro de ἄγω; a coerção já é explicitada pela expressão seguinte, evitando intensificação redundante.
- source_word: σιδηροδέσμοις ἀνάγκαις
  choice: sob a coerção de correntes de ferro
  rationale: Procura conservar tanto a restrição física de ferro quanto a ideia de força ou necessidade compulsória presente na construção grega condensada.
- source_word: τοῖς ζυγοῖς τῶν πλοίων
  choice: aos jugos dos navios
  rationale: Conserva o sentido literal e a imagem animal de ζυγός, sem decidir no corpo do texto se eram traves ou barras náuticas específicas.
- source_word: προσηλωμένοι
  choice: preso
  rationale: Expressa fixação firme sem afirmar necessariamente que o pescoço tenha sido pregado.
- source_word: τοὺς τραχήλους
  choice: com o pescoço
  rationale: O singular distributivo é idiomático em português para cada integrante do grupo e traduz claramente o acusativo de relação.
- source_word: ἀρρήκτοις
  choice: inquebráveis
  rationale: Equivalente direto para aquilo que não pode ser rompido ou quebrado.
- source_word: κατησφαλισμένοι
  choice: firmemente presos
  rationale: Reproduz a ideia intensiva de estarem completamente fixados ou assegurados.
- source_word: πέδαις
  choice: grilhões
  rationale: Termo corrente e preciso para instrumentos de restrição aplicados aos pés.
