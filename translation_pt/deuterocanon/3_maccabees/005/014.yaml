  yaml_path: translation/deuterocanon/3_maccabees/005/014.yaml
  text: And when it was already nearly the middle of the sixth hour[a], the man appointed over the summonses, seeing those who had been summoned assembled in a mass, came up and signaled to the king.
translation:
  language: pt
  text: Quando já estava quase no meio da sexta hora[a], o homem encarregado das convocações, vendo reunidos em massa os que haviam sido convocados, aproximou-se e fez um sinal ao rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “por volta do meio da sexta hora”. Na contagem antiga, isso corresponde aproximadamente ao meio-dia.
    reason: cultural_note
lexical_decisions:
- source_word: μεσούσης δὲ ἤδη ἑκάτης ὥρας σχεδόν
  choice: Quando já estava quase no meio da sexta hora
  rationale: Preserva a referência temporal antiga e os matizes de ἤδη ('já') e σχεδόν ('quase'), sem convertê-la diretamente em horário moderno.
- source_word: ὁ πρὸς ταῖς κλήσεσιν τεταγμένος
  choice: o homem encarregado das convocações
  rationale: τεταγμένος indica alguém designado ou encarregado, e κλήσεις tem aqui sentido administrativo de convocações.
- source_word: ἀθρόους
  choice: reunidos em massa
  rationale: Conserva a imagem de pessoas agrupadas num só corpo, com mais força do que apenas 'juntos'.
- source_word: τοὺς κλητούς
  choice: os que haviam sido convocados
  rationale: Expressa pessoas chamadas por autoridade, e não convidados em contexto social.
- source_word: προσελθὼν ... ἔνευσε
  choice: aproximou-se e fez um sinal
  rationale: Transforma naturalmente o particípio e o verbo principal numa sequência verbal em português, sem especificar se o sinal foi um aceno, gesto ou movimento da cabeça.
