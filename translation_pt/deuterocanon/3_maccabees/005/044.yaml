  text: Then the friends and relatives[a], overjoyed, having regained confidence, stationed the forces in the most suitable places of the city for guard duty.
translation:
  language: pt
  text: Então, radiantes de alegria, os amigos e parentes, depois de se dispersarem, posicionaram, com fé[a], as forças nos lugares mais adequados da cidade para a guarda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com confiança” ou “fielmente”. O grego diz literalmente “com fé” (μετὰ πίστεως), expressão que pode indicar tanto a confiança deles quanto a maneira fiel de agir.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιχαρεῖς
  choice: radiantes de alegria
  rationale: Expressa de modo natural em português a alegria intensa indicada pelo adjetivo grego.
- source_word: ἀναλύσαντες
  choice: depois de se retirarem
  rationale: O particípio pode indicar partir, retirar-se ou dispersar-se; “retirarem” preserva o movimento de afastamento sem acrescentar a ideia de recuperar a confiança, que não está no verbo.
- source_word: οἱ φίλοι καὶ συγγενεῖς
  choice: os amigos e parentes
  rationale: Mantém diretamente os dois grupos sociais nomeados no grego, em linguagem corrente.
- source_word: μετὰ πίστεως
  choice: com fé
  rationale: Preserva a forma nominal de πίστις e sua possível ressonância teológica, enquanto a nota registra os sentidos contextuais de confiança e fidelidade.
- source_word: διέτασσον
  choice: posicionaram
  rationale: No contexto de forças destinadas à vigilância, o verbo denota sua disposição organizada em postos determinados.
- source_word: τὰς δυνάμεις
  choice: as forças
  rationale: Equivalente amplo que se ajusta ao contexto militar ou de segurança sem especificar indevidamente tropas regulares.
- source_word: ἐπὶ τοὺς εὐκαιροτάτους τόπους
  choice: nos lugares mais adequados
  rationale: Comunica o superlativo e a conveniência especial dos locais sem impor o sentido técnico de “estratégicos”.
- source_word: πρὸς τὴν τήρησιν
  choice: para a vigilância
  rationale: Expressa a finalidade de guardar ou manter sob observação em português claro e conciso.
theological_decisions:
- issue: Sentido de πίστις em μετὰ πίστεως
  choice: com fé
  alternative: com confiança; fielmente
  rationale: A narrativa permite entender a expressão como confiança interior ou como modo fiel de agir. O texto principal conserva “fé”, sem eliminar essas leituras, que são registradas em nota.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais. A ambiguidade de μετὰ πίστεως foi mantida por meio de nota, e ἀναλύσαντες foi traduzido como movimento de retirada, sem incorporar a noção não lexical de “recuperar a confiança”.
