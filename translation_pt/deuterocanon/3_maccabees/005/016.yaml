  text: When the king considered this[a], and turned to drinking, he ordered those who had come to the banquet to recline around him.
translation:
  language: pt
  text: Depois de considerar isso, o rei voltou-se para a bebida e ordenou aos que tinham vindo ao banquete que se reclinassem ao redor dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase final é textual e sintaticamente difícil no grego. Refere-se aos convidados tomando seus lugares, reclinados, em relação ao rei; “ao redor dele” é uma tradução contextual. Outras possibilidades são “perto dele” ou “junto ao lugar dele à mesa”.
    reason: textual_variant
lexical_decisions:
- source_word: λογισάμενος
  choice: depois de considerar isso
  rationale: O particípio aoristo médio de λογίζομαι expressa a consideração mental do assunto anterior antes da ação seguinte. A formulação conserva tanto a referência ao contexto quanto a sequência narrativa.
- source_word: τραπεὶς εἰς τὸν πότον
  choice: voltou-se para a bebida
  rationale: τραπείς indica uma mudança de direção ou atividade, e πότος designa o ato de beber ou uma ocasião de bebida. A tradução mantém a imagem verbal do grego sem restringir πότος especificamente ao vinho nem intensificá-lo necessariamente como embriaguez.
- source_word: παραγεγονότας
  choice: aos que tinham vindo
  rationale: O particípio perfeito preserva a ideia de pessoas que haviam chegado e continuavam presentes, em vez de reduzi-las simplesmente a 'os presentes'.
- source_word: ἐπὶ τὴν συμποσίαν
  choice: ao banquete
  rationale: συμποσία pode indicar banquete ou reunião para beber. 'Banquete' é claro e natural em português, enquanto a menção imediata à bebida mantém visível o caráter convivial da ocasião.
- source_word: ὑπὲρ ἀνακλίνα αὐτοῦ
  choice: que se reclinassem ao redor dele
  rationale: Embora a expressão transmitida seja textual e sintaticamente difícil, ela parece descrever os convidados assumindo a postura reclinada à mesa em relação à posição do rei. 'Ao redor dele' oferece uma representação contextual inteligível sem esconder a incerteza, que é registrada em nota.
