  text: They all called upon the almighty Lord[a], the sovereign over every dominion, their merciful God and Father, with tears and with an unceasing cry, begging him,
translation:
  language: pt
  text: 'Todos invocaram o Senhor Todo-Poderoso, aquele que exerce domínio sobre todo governante,[a] seu Deus misericordioso e Pai, com lágrimas e um clamor incessante, suplicando-lhe:'
