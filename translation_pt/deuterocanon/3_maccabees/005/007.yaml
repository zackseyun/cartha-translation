    reason: lexical_alternative
lexical_decisions:
- source_word: παντοκράτορα
  choice: Todo-Poderoso
  rationale: Título divino consagrado e direto para παντοκράτωρ, preservando a ideia de poder universal.
- source_word: κύριον
  choice: Senhor
  rationale: Equivalente natural e reverente de κύριος como título divino.
- source_word: πάσης δυνάστην δυναστεύοντα
  choice: aquele que exerce domínio sobre todo governante
  rationale: Preserva a relação etimológica entre δυνάστης e δυναστεύω por meio de “domínio” e “governante”, além de manter a supremacia divina sobre toda autoridade pessoal.
- source_word: ἐλεήμονα
  choice: misericordioso
  rationale: Correspondência direta e corrente, adequada ao caráter atribuído a Deus.
- source_word: θεὸν αὐτῶν καὶ πατέρα
  choice: seu Deus misericordioso e Pai
  rationale: O possessivo “seu” abrange naturalmente os dois substantivos, e “Pai” permanece explícito como no grego.
- source_word: δυσκαταπαύστῳ βοῇ
  choice: um clamor que não cessava
  rationale: Exprime em português natural um clamor persistente e difícil de fazer parar, sem reduzir a intensidade da expressão.
- source_word: πάντες
  choice: Todos
  rationale: A posição inicial conserva a ênfase coletiva do grego.
- source_word: μετὰ δακρύων
  choice: com lágrimas
  rationale: Tradução direta que mantém a imagem emocional.
- source_word: ἐπεκαλέσαντο
  choice: invocaram
  rationale: Verbo corrente no registro bíblico para um apelo dirigido a Deus.
- source_word: δεόμενοι
  choice: suplicaram-lhe
  rationale: Transmite a súplica urgente do particípio; a formulação verbal evita um gerúndio pesado e introduz naturalmente a continuação do pedido.
theological_decisions:
- issue: Acumulação dos títulos e descrições divinos
  choice: o Senhor Todo-Poderoso, aquele que exerce domínio sobre todo governante, seu Deus misericordioso e Pai
  alternative: o Senhor Todo-Poderoso e soberano sobre todo domínio, seu Deus misericordioso e Pai
  rationale: A tradução conserva a sequência cumulativa e o título “Pai”, sem condensar as designações. A opção escolhida também reflete a possível referência de δυνάστης a governantes ou autoridades pessoais.
- issue: Referente de πάσης na expressão πάσης δυνάστην δυναστεύοντα
  choice: todo governante
  alternative: todo domínio / toda autoridade
  rationale: δυνάστης pode designar quem detém poder, enquanto a construção cognata também admite uma compreensão mais abstrata. A nota registra a ambiguidade real sem enfraquecer a afirmação da supremacia de Deus.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi ajustada para fluência, sem eliminar a força acumulativa dos títulos divinos nem a intensidade da oração.
