base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/035.yaml
  text: And the Jews[a], when they heard what came from the king, were praising the manifest God, the Lord, the King of kings, since they had obtained this help from him.
translation:
  language: pt
  text: E os judeus, ao ouvirem o que vinha da parte do rei, louvavam o Deus que se manifestou, o Senhor, o Rei dos que reinam[a], pois haviam recebido dele esta ajuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, «o Rei dos reis». O grego diz literalmente «o Rei dos que reinam».
    reason: alternativa lexical
lexical_decisions:
- source_word: τὰ παρὰ τοῦ βασιλέως
  choice: o que vinha da parte do rei
  rationale: Mantém a amplitude da expressão grega, que pode indicar palavras, mensagem ou providência procedente do rei, sem especificá-la indevidamente como decreto.
- source_word: ἀκούσαντες
  choice: ao ouvirem
  rationale: Expressa com naturalidade o valor temporal do particípio aoristo.
- source_word: ἐπιφανῆ
  choice: que se manifestou
  rationale: Comunica que Deus se tornou evidente por sua atuação concreta; é mais natural em português corrente do que o adjetivo literal «manifesto».
- source_word: θεὸν Κύριον
  choice: o Deus que se manifestou, o Senhor
  rationale: Representa ambos os títulos e conserva sua relação apositiva.
- source_word: Βασιλέα τῶν βασιλευόντων
  choice: o Rei dos que reinam
  rationale: Preserva o particípio substantivado grego, literalmente «os que reinam», sem normalizá-lo silenciosamente para a fórmula tradicional «Rei dos reis».
- source_word: ᾔνουν
  choice: louvavam
  rationale: O imperfeito grego indica louvor em andamento, adequadamente expresso pelo pretérito imperfeito português.
- source_word: τῆσδε τῆς βοηθείας
  choice: essa ajuda
  rationale: Traduz diretamente βοήθεια sem acrescentar o sentido mais específico de «livramento».
- source_word: τετευχότες
  choice: haviam recebido
  rationale: Exprime o resultado já alcançado da forma perfeita; «recebido» é idiomático no contexto da ajuda concedida por Deus.
theological_decisions:
- issue: Tradução de κύριος como título divino
  choice: Senhor
  alternative: Soberano
  rationale: «Senhor» é o equivalente reverencial corrente e representa adequadamente κύριος aplicado a Deus.
- issue: Forma do título Βασιλέα τῶν βασιλευόντων
  choice: o Rei dos que reinam
  alternative: o Rei dos reis
  rationale: A forma principal conserva a particularidade do grego, que emprega o particípio «os que reinam»; a formulação tradicional e idiomática é registrada em nota.
- issue: Sentido de ἐπιφανῆ aplicado a Deus
  choice: o Deus que se manifestou
  alternative: o Deus manifesto
  rationale: A tradução escolhida relaciona o título à intervenção divina tornada evidente no contexto, sem introduzir uma designação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e leitura natural no Brasil e em outros contextos lusófonos. O marcador de nota foi colocado junto à expressão que ele explica.
