  yaml_path: translation/deuterocanon/3_maccabees/005/046.yaml
  text: Around dawn[a], when the city was already filled with innumerable crowds at the hippodrome, he entered the court and urged the king on concerning the matter at hand.
translation:
  language: pt
  text: Por volta do amanhecer, quando a cidade já estava cheia de multidões incontáveis por todo o hipódromo, ele entrou no pátio do palácio[a] e instigou o rei quanto ao assunto em pauta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no pátio” ou “na corte”; o grego αὐλή pode designar o pátio ou o recinto de uma residência real.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τὴν ἕω
  choice: Por volta do amanhecer
  rationale: Expressa de modo natural a aproximação temporal indicada por περί e o sentido de ἕως como o romper do dia.
- source_word: πλήθεσιν ἀναριθμήτοις
  choice: multidões incontáveis
  rationale: Mantém tanto a ideia coletiva de πλήθη quanto a força hiperbólica de ἀναρίθμητοι.
- source_word: κατὰ τοῦ ἱπποδρόμου καταμεστωμένης
  choice: apinhada ... na área do hipódromo
  rationale: “Apinhada” comunica a intensidade de καταμεστόω; “na área do hipódromo” preserva o valor espacial de κατά com o genitivo sem restringi-lo indevidamente ao interior da pista.
- source_word: εἰς τὴν αὐλήν
  choice: no pátio do palácio
  rationale: No contexto de acesso ao rei, αὐλή provavelmente designa o pátio ou recinto da residência real; a nota preserva a amplitude lexical.
- source_word: ἐπὶ τὸ προκείμενον
  choice: quanto ao assunto em pauta
  rationale: Traduz idiomaticamente aquilo que estava posto diante deles, isto é, a questão ou tarefa presente.
- source_word: ὤτρυνε
  choice: instigou
  rationale: Conserva a força de incitar ou impelir à ação, adequada ao contexto hostil, sem especificar uma ação que o grego não explicita.
