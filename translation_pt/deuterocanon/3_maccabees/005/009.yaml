    reason: lexical_alternative
lexical_decisions:
- source_word: λιτανία
  choice: súplica
  rationale: Designa um apelo ou pedido insistente; “súplica” conserva o caráter de rogo melhor que o termo mais amplo “oração”.
- source_word: ἐκτενῶς
  choice: intensamente
  rationale: O advérbio pode indicar intensidade, fervor ou extensão/duração. “Intensamente” oferece uma leitura natural sem eliminar a alternativa temporal, registrada em nota.
- source_word: ἀνέβαινεν
  choice: subia
  rationale: O imperfeito grego apresenta a ação em andamento; o imperfeito português “subia” preserva esse aspecto de modo conciso e natural.
- source_word: εἰς τὸν οὐρανόν
  choice: ao céu
  rationale: No contexto de súplica, οὐρανός se refere ao céu como destino da oração, e “ao céu” é idiomático em português.
- source_word: τούτων
  choice: deles
  rationale: O demonstrativo no genitivo retoma as pessoas mencionadas anteriormente; “deles” conserva a referência sem explicitação desnecessária.
- source_word: μὲν οὖν
  choice: Assim
  rationale: A combinação de partículas dá continuidade ao relato e marca uma transição consequente; “Assim” reproduz essa ligação com naturalidade.
