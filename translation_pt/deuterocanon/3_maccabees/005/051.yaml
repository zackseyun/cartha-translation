  yaml_path: translation/deuterocanon/3_maccabees/005/051.yaml
  text: They cried out very loudly[a], imploring the Sovereign of all to have mercy and visibly come to their aid, since they already stood at the gates of Hades.
translation:
  language: pt
  text: Eles clamaram em voz muito alta, suplicando ao Soberano de tudo que tivesse compaixão deles e se manifestasse em auxílio deles,[a] pois já se encontravam às portas do Hades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tivesse compaixão deles com uma manifestação”. A expressão grega pode destacar que a misericórdia pedida se tornasse manifesta, isto é, fosse demonstrada abertamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ σφόδρα
  choice: clamaram em voz muito alta
  rationale: Expressa o clamor coletivo e urgente, preservando tanto a imagem da voz quanto a forte intensificação de σφόδρα em português natural.
- source_word: τὸν τῆς ἁπάσης δυνάστην
  choice: o Soberano de tudo
  rationale: δυνάστης designa quem detém poder ou domínio; “Soberano” comunica autoridade suprema em registro digno. “De tudo” conserva o alcance abrangente de ἁπάσης.
- source_word: ἱκετεύοντες
  choice: suplicando
  rationale: O particípio indica um pedido insistente e humilde; “suplicando” é claro e adequado ao contexto de oração desesperada.
- source_word: οἰκτείραι μετὰ ἐπιφανείας αὐτούς
  choice: que tivesse compaixão deles e se manifestasse em seu auxílio
  rationale: A tradução preserva a compaixão dirigida a eles e comunica o caráter manifesto da intervenção pedida. A nota registra a construção grega mais compacta e sua ambiguidade.
- source_word: ἤδη πρὸς πύλας ᾅδου καθεστῶτας
  choice: pois já se encontravam às portas do Hades
  rationale: “Encontravam-se” exprime o estado presente indicado pelo particípio perfeito; “às portas do Hades” conserva a metáfora espacial de perigo extremo e proximidade da morte.
theological_decisions:
- issue: Sentido de μετὰ ἐπιφανείας na súplica por misericórdia
  choice: tivesse compaixão deles e se manifestasse em seu auxílio
  alternative: tivesse compaixão deles com uma manifestação
  rationale: A expressão pode qualificar a misericórdia como manifesta ou evocar uma aparição/intervenção evidente. O texto principal oferece português natural sem reduzir a ação a compaixão interior, enquanto a nota preserva a forma e a ambiguidade do grego.
- issue: Tradução de ᾅδου no contexto judaico-grego de 3 Macabeus
  choice: Hades
  alternative: morada dos mortos
  rationale: O termo grego é mantido para preservar a imagem própria do texto e evitar identificá-lo indevidamente com conceitos doutrinários posteriores ou simplesmente com a sepultura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Clamaram” e “suplicando” mantêm o tom solene sem arcaísmo excessivo; “Hades” conserva o termo e a imagem do original.
