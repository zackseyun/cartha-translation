  text: But this was the working of God[a], who rules over all, having implanted in the minds of those who had previously plotted against them a forgetfulness of their purpose.
translation:
  language: pt
  text: Mas isso foi obra de Deus, que governa sobre tudo e pôs o esquecimento na mente daqueles que antes haviam tramado contra ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O pronome grego é singular e tem Deus como antecedente gramatical mais próximo. No contexto, porém, alguns entendem a expressão como referência aos que haviam conspirado contra o povo judeu; nesse caso, pode-se traduzir: “contra eles”.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἐνέργεια
  choice: obra
  rationale: No contexto, indica a atuação eficaz de Deus. “Obra” é natural e digna em português e comunica o resultado de sua ação sem recorrer ao tecnicismo “operação”.
- source_word: τοῦ πάντα δεσποτεύοντος θεοῦ
  choice: de Deus, que governa sobre tudo
  rationale: δεσποτεύω expressa domínio ou senhorio. “Governa sobre tudo” preserva a soberania universal e evita as conotações modernas enganosas de “déspota”.
- source_word: τῶν πρὶν αὐτῷ μεμηχανημένων
  choice: dos que antes haviam tramado contra ele
  rationale: μηχανάομαι significa arquitetar ou tramar, aqui com intenção hostil. O singular de αὐτῷ é mantido como “ele”, sem substituí-lo no texto principal por um referente plural interpretativo.
- source_word: λήθην κατὰ διάνοιαν
  choice: esquecimento na mente
  rationale: A expressão apresenta o esquecimento como colocado no interior da mente. Esta formulação conserva a imagem grega com clareza em português.
- source_word: ἐντεθεικότος
  choice: pôs
  rationale: O particípio de ἐντίθημι indica colocar ou introduzir algo dentro de alguém. “Pôs” preserva a causalidade direta e soa mais natural que “implantou” neste contexto.
theological_decisions:
- issue: Causalidade divina no esquecimento
  choice: Deus pôs diretamente o esquecimento na mente dos conspiradores
  alternative: Deus apenas permitiu que esquecessem ou causou indiretamente uma confusão
  rationale: A construção atribui o acontecimento à ἐνέργεια de Deus e usa ἐντεθεικότος, que descreve Deus colocando o esquecimento na mente. A tradução não atenua essa agência direta.
- issue: Referente de αὐτῷ
  choice: Manter o pronome singular como “ele” e registrar a ambiguidade em nota
  alternative: Explicitar “contra eles”, entendendo como referência contextual ao povo judeu
  rationale: A forma grega é singular. Embora o contexto possa favorecer uma referência coletiva ao povo visado, trocar silenciosamente o número eliminaria uma ambiguidade real do texto.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A coordenação verbal evita uma cadeia pesada de particípios, sem enfraquecer a ação direta atribuída a Deus. O marcador [a] aparece no texto principal.
