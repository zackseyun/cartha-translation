  yaml_path: translation/deuterocanon/3_maccabees/005/006.yaml
  text: But the Jews[a], seeming to the nations to be deprived of every protection because of the necessity that surrounded them on every side with chains,
translation:
  language: pt
  text: Mas os judeus, que, aos olhos dos povos, pareciam estar privados de toda proteção[a], por causa da coação que os cercava de todos os lados com correntes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pareciam aos povos estar sem nenhum abrigo».'
    reason: Preserva a alternativa lexical de σκέπη, que pode indicar tanto abrigo quanto proteção.
lexical_decisions:
- source_word: σκέπης
  choice: proteção
  rationale: No contexto da vulnerabilidade dos judeus diante dos povos, o sentido figurado de proteção é mais natural; a possibilidade concreta de abrigo é preservada em nota.
- source_word: ἔρημοι
  choice: privados de
  rationale: Com o genitivo πάσης σκέπης, indica falta ou ausência de algo; «privados de» comunica esse estado em português corrente.
- source_word: δοκοῦντες εἶναι
  choice: pareciam estar
  rationale: Preserva a distinção entre a aparência percebida pelos observadores e a condição real dos judeus.
- source_word: τοῖς ἔθνεσιν
  choice: aos olhos dos povos
  rationale: Explicita de modo idiomático o dativo de perspectiva; «povos» mantém a referência ampla às populações circundantes sem impor um sentido teológico posterior.
- source_word: ἀνάγκην
  choice: coação
  rationale: Neste contexto de aprisionamento, o termo expressa uma imposição ou condição coerciva, mais do que mera necessidade abstrata.
- source_word: πάντοθεν περιέχουσαν αὐτοὺς μετὰ δεσμῶν
  choice: que os cercava de todos os lados com correntes
  rationale: Mantém tanto a imagem de confinamento por todos os lados quanto a referência concreta às correntes.
- source_word: δεσμῶν
  choice: correntes
  rationale: Torna clara e natural a imagem física de aprisionamento presente no substantivo grego.
