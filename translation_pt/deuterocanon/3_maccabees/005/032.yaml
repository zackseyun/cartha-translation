    rationale: A expressão interpreta o genitivo como origem do afeto e reduz συστροφή a convivência pessoal. O termo grego indica mais naturalmente uma reunião, ajuntamento ou aglomeração.
  - severity: medium
    issue: Alternativas «utilidade» e «serviço» para χρεία
    rationale: Embora χρεία possa ter empregos relacionados a uso ou serviço em outros contextos, aqui, na construção causal e no contexto imediato, «necessidade» é a equivalência segura. A nota amplia indevidamente a ambiguidade.
  - severity: low
    issue: «destes» para τούτων
    rationale: O grego usa demonstrativo neutro plural, sem o masculino introduzido em português. «Destas coisas» explicita apenas o valor plural já presente e mantém o referente contextual aberto.
