  text: Yet[a], if it were not for your affection because of the gathering together and the necessity[b], you would have been deprived of life instead of these things.
translation:
  language: pt
  text: Contudo, se não fosse por seu afeto pela reunião e pela necessidade[a], você teria sido privado da vida em vez destas coisas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase grega é concisa. «Reunião» também pode ser entendida como «ajuntamento» ou «aglomeração»; «pela necessidade» pode também ser traduzido como «por causa da necessidade».
    reason: lexical_alternative
  - marker: b
    text: 'O grego traz um demonstrativo neutro plural: «em vez destas coisas». Seu referente depende do contexto.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: καίπερ εἰ μή
  choice: Contudo, se não fosse
  rationale: A combinação introduz uma condição de sentido concessivo. A formulação conserva esse contraste e soa natural em português.
- source_word: διὰ τὴν ... στοργὴν
  choice: por causa do afeto / se não fosse o afeto
  rationale: διά com acusativo indica causa, enquanto στοργή expressa afeto ou apego. Na construção condicional portuguesa, “se não fosse” comunica naturalmente a causa que impede o resultado.
- source_word: τῆς συστροφῆς
  choice: decorrente da convivência
  rationale: συστροφή pode indicar reunião, associação ou convivência próxima. Neste contexto de relação pessoal, “convivência” evita tanto a ideia formal de assembleia quanto o tom pejorativo de multidão.
- source_word: τῆς χρείας
  choice: da necessidade
  rationale: χρεία pode significar necessidade, utilidade ou serviço. Mantém-se “necessidade” no texto, com a alternativa registrada em nota por causa da concisão e ambiguidade da construção grega.
- source_word: τὸ ζῆν ἐστερήθης
  choice: você teria sido privado da vida
  rationale: O infinitivo substantivado τὸ ζῆν significa literalmente “o viver”; com o passivo de στερέω, a expressão portuguesa “privado da vida” preserva a gramática e a gravidade da ameaça.
- source_word: ἀντὶ τούτων
  choice: em lugar destes
  rationale: ἀντί indica substituição. O demonstrativo plural masculino “destes” preserva a referência contextual sem convertê-la explicitamente em “coisas” ou identificar seus referentes.
