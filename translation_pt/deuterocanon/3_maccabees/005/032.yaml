  source_fidelity: A frase principal preserva a condição concessiva e a ameaça de privação da vida. Contudo, «decorrente da convivência» desloca τῆς συστροφῆς de uma reunião/aglomeração concreta para uma relação de convivência e faz os dois genitivos parecerem origem do afeto. «Em lugar destes» também introduz masculino não expresso pelo demonstrativo neutro plural grego.
  naturalness: A redação é compreensível, mas «o afeto decorrente da convivência e da necessidade» soa interpretativa e pouco natural no contexto. «Por seu afeto pela reunião e pela necessidade» é direto, moderno e conserva a concisão algo incomum do original.
  terminology: συστροφή é melhor representada por «reunião», com alternativas em nota para a nuance de aglomeração/multidão. χρεία deve permanecer «necessidade»; «utilidade» e «serviço» não são alternativas seguras neste contexto. O plural neutro τούτων é expresso naturalmente por «estas coisas».
