  yaml_path: translation/deuterocanon/3_maccabees/005/041.yaml
  text: For this reason the city is in turmoil because of the expectation[a], and as it grows with crowds[c][b], it is already in danger of being plundered many times.
translation:
  language: pt
  text: Por isso, a cidade está em tumulto por causa da expectativa[a] e, à medida que se enche de aglomerações[b], já corre repetidamente[c] o risco de ser saqueada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da antecipação” ou “por causa do suspense”; o termo grego indica um estado de expectativa.
    reason: lexical_alternative
  - marker: b
    text: Ou “de ajuntamentos” ou “de multidões”; o grego pode sugerir que a cidade se avolumava com grupos reunidos.
    reason: lexical_alternative
  - marker: c
    text: Ou “muitas vezes” ou “frequentemente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν χάριν
  choice: Por isso
  rationale: Expressa de modo idiomático e conciso a relação causal com as circunstâncias anteriores.
- source_word: ἡ πόλις
  choice: a cidade
  rationale: Preserva a imagem grega da cidade como um todo, incluindo por implicação seus habitantes.
- source_word: διὰ τὴν προσδοκίαν
  choice: por causa da expectativa
  rationale: Mantém o sentido amplo de προσδοκία, que pode envolver expectativa, antecipação ou suspense, sem especificar indevidamente seu caráter.
- source_word: ὀχλεῖ
  choice: está em tumulto
  rationale: Transmite a perturbação e a agitação pública indicadas por ὀχλέω em português natural.
- source_word: πληθύνουσα συστροφαῖς
  choice: à medida que se enche de aglomerações
  rationale: Reproduz o aumento progressivo expresso pelo particípio e entende συστροφαί como grupos ou multidões que se concentram, sem determinar se são reuniões ordeiras ou turbas.
- source_word: ἤδη
  choice: já
  rationale: Marca o perigo como presente e em desenvolvimento.
- source_word: κινδυνεύει
  choice: corre ... o risco
  rationale: Equivalente idiomático português do verbo que indica estar em perigo.
- source_word: πολλακὶς
  choice: repetidamente
  rationale: Expressa com naturalidade o valor de 'muitas vezes' ou 'frequentemente' e ressalta a recorrência do risco.
- source_word: διαρπασθῆναι
  choice: ser saqueada
  rationale: Verte diretamente a ameaça concreta de pilhagem contra a cidade.
