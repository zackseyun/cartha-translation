  text: And after barely rousing himself, he pointed out that the time for the banquet was already slipping by, making his speech about these matters.
translation:
  language: pt
  text: E, depois de despertar com dificuldade, ele fez notar que o tempo do banquete já estava passando[a], ao falar dessas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o tempo do festim já estava se esgotando”. O termo grego pode se referir a um banquete ou a um festim com bebidas, e o verbo retrata o tempo passando rapidamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις διεγείρας
  choice: mal conseguindo despertar
  rationale: Exprime tanto a dificuldade indicada por μόλις quanto a passagem do sujeito ao estado de vigília, mantendo de modo natural a relação participial.
- source_word: ὑπέδειξέ
  choice: observou
  rationale: No contexto, o verbo introduz a constatação de que o tempo estava passando; “observou” comunica isso com naturalidade, sem sugerir necessariamente um gesto físico.
- source_word: τὸν τῆς συμποσίας καιρόν
  choice: o tempo do banquete
  rationale: “Banquete” preserva o sentido amplo e digno de συμποσία, que também pode designar um festim com bebidas.
- source_word: ἤδη παρατρέχοντα
  choice: já estava passando
  rationale: Reproduz claramente a ideia de que o período oportuno avançava e se esgotava, sem intensificar além do que o grego exige.
- source_word: τὸν περὶ τούτων λόγον ποιούμενος
  choice: enquanto falava sobre essas coisas
  rationale: Vertido idiomaticamente como uma ação simultânea/circunstancial; evita a rigidez de “fazia um discurso” sem perder a referência ampla do demonstrativo.
