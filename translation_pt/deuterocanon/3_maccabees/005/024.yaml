  text: And the crowds throughout the city were gathering for the most pitiful spectacle[a], eagerly awaiting the morning.
translation:
  language: pt
  text: As multidões por toda a cidade tinham-se reunido para o mais lastimável espetáculo[a], aguardando ansiosamente a manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para contemplar a mais lastimável cena”. O termo grego θεωρία pode se referir tanto ao ato de contemplar quanto ao espetáculo contemplado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πλήθη
  choice: as multidões
  rationale: O plural πλήθη designa grandes grupos de pessoas; “as multidões” é natural, atual e preserva a pluralidade do grego.
- source_word: κατὰ τὴν πόλιν
  choice: de toda a cidade
  rationale: A expressão indica distribuição pela cidade. Em português, “as multidões de toda a cidade” comunica naturalmente a ampla participação da população, sem sugerir movimento ao redor dela.
- source_word: συνῄθροιστο
  choice: estavam se reunindo
  rationale: A forma verbal apresenta a reunião como processo em curso; a locução no imperfeito preserva esse aspecto durativo.
- source_word: πρὸς τὴν οἰκτρότατην θεωρίαν
  choice: para o mais lastimável espetáculo
  rationale: “Espetáculo” preserva o possível sentido de algo exposto à vista pública, enquanto “mais lastimável” representa o superlativo οἰκτρότατην e o caráter comovente e deplorável da cena.
- source_word: προσδοκῶντα
  choice: aguardando
  rationale: O particípio expressa expectativa voltada para algo futuro; “aguardando” combina de modo idiomático com a referência temporal seguinte.
- source_word: τὴν πρωίαν
  choice: a manhã
  rationale: A expressão se refere ao período da manhã sem exigir a especificidade de “aurora” ou “romper do dia”.
- source_word: μετὰ σπουδῆς
  choice: ansiosamente
  rationale: A locução pode exprimir empenho, pressa ou expectativa intensa. No contexto sombrio, “ansiosamente” evita a conotação necessariamente positiva de “com entusiasmo” e transmite expectativa diligente ou impaciente.
