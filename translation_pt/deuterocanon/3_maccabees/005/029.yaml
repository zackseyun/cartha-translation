translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A tradução segue a sintaxe mais provável do grego, tratando Hermon e todos os Amigos como sujeito composto; não introduz o pronome “lhes”, ausente do original. A inicial maiúscula em “Amigos” sugere, sem impor, o possível uso cortesão do termo.
