  text: 'Hermon was showing them the beasts and all the forces: “They are prepared[a], O king[c][b], according to that intention of yours.”'
translation:
  language: pt
  text: 'Hermon e todos os amigos mostravam[b] as feras e as forças: “Está tudo preparado, ó rei, de acordo com aquele seu propósito[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou “apresentavam” ou “indicavam”; o imperfeito grego sugere uma ação em andamento.
    reason: lexical_alternative
  - marker: c
    text: Ou “de acordo com aquele seu plano”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεδείκνυεν
  choice: mostravam
  rationale: O imperfeito exprime uma ação em curso. Embora o verbo grego esteja no singular e anteceda o sujeito composto, em português a concordância no plural torna clara e natural a participação de Hermon e de todos os Amigos, sem introduzir um objeto inexistente no texto.
- source_word: ὁ Ἕρμων καὶ πάντες οἱ φίλοι
  choice: Hermon e todos os Amigos
  rationale: A construção grega apresenta Hermon e todos os φίλοι como sujeito. “Amigos”, com inicial maiúscula, preserva o sentido literal e sinaliza discretamente a possível designação de associados da corte helenística, sem substituí-la pela interpretação “cortesãos”.
- source_word: τὰ θηρία
  choice: os animais
  rationale: No contexto, trata-se dos animais preparados para a execução, especificamente elefantes. “Animais” evita sugerir que sejam necessariamente feras selvagens, embora “feras” seja uma alternativa lexical possível.
- source_word: τὰς δυνάμεις
  choice: as forças
  rationale: O plural δύναμεις pode designar forças ou contingentes militares. “As forças” mantém a referência abrangente do grego, sem acrescentar “todas”, que não modifica este substantivo no original.
- source_word: Ἡτοίμασται
  choice: Estão preparados
  rationale: O perfeito passivo indica o estado presente resultante de preparação anterior. O plural retoma conjuntamente os animais e as forças.
- source_word: βασιλεῦ
  choice: ó rei
  rationale: Reproduz diretamente o vocativo grego em registro digno e compreensível, sem a paráfrase mais interpretativa “Vossa Majestade”.
- source_word: κατὰ τὴν σὴν ἐκείνην πρόθεσιν
  choice: de acordo com aquele seu propósito
  rationale: “Propósito” conserva a amplitude de πρόθεσις entre intenção e plano; “aquele” representa a força retrospectiva ou dêitica de ἐκείνην.
