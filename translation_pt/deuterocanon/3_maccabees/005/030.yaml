  text: 'But he, filled with heavy anger at what had been said, because all his purpose concerning these things had been frustrated by the providence of God, spoke with threats, pressing the matter hard:'
translation:
  language: pt
  text: 'Mas ele, cheio de profunda ira pelo que havia sido dito, porque todo o seu propósito a respeito dessas coisas havia sido frustrado pela providência de Deus, falou com ameaças, intensificando-as:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρεῖ χόλῳ
  choice: profunda ira
  rationale: Expressa a intensidade e o peso da ira em português natural e digno, sem recorrer ao pouco idiomático «ira pesada».
- source_word: προνοίᾳ θεοῦ
  choice: pela providência de Deus
  rationale: Correspondência direta à expressão grega, preservando a afirmação explícita da ação providencial divina.
- source_word: πᾶν αὐτοῦ νόημα
  choice: todo o seu propósito
  rationale: Neste contexto, νόημα indica a intenção ou o desígnio que ele pretendia executar; «propósito» mantém o sentido sem especificar indevidamente um plano formal.
- source_word: ἐντείνων
  choice: insistindo com veemência
  rationale: O particípio sugere intensificação ou pressão; a formulação comunica essa força de modo idiomático e preserva sua ligação com o ato de falar.
- source_word: μετὰ ἀπειλῆς εἶπεν
  choice: falou em tom ameaçador
  rationale: Reproduz naturalmente a ideia de falar com ameaça, sem acrescentar conteúdo à ameaça.
theological_decisions:
- issue: A providência divina como causa da frustração do propósito
  choice: porque, pela providência de Deus, todo o seu propósito [...] havia sido frustrado
  alternative: porque todo o seu propósito [...] havia sido frustrado, como resultado da providência de Deus
  rationale: A redação escolhida conserva a relação causal do grego e sua atribuição explícita à providência divina, sem explicar o modo dessa atuação.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência, preservando a sequência lógica: ira diante do relato, motivo providencial da frustração e resposta ameaçadora.'
