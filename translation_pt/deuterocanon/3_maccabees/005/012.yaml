base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/012.yaml
  text: And by the action of the Sovereign he was overcome with a most pleasant and deep stupor[b][a], having been greatly frustrated in his lawless purpose and utterly disappointed in his unchangeable resolve.
translation:
  language: pt
  text: E, pela ação do Soberano[b], ele foi dominado por um torpor extremamente agradável e profundo[a], tendo sido grandemente frustrado em seu propósito contrário à lei e muito decepcionado em sua resolução inabalável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega «extremamente agradável e profundo» sem explicitar o substantivo que descreve. «Torpor» é suprido conforme o contexto; também se pode entender uma ação suavíssima e profunda do Soberano que o dominou.
    reason: lexical_alternative
  - marker: b
    text: Ou «Senhor absoluto» ou «Mestre». O termo grego enfatiza autoridade soberana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἥδιστῳ
  choice: extremamente agradável
  rationale: Expressa o superlativo de ἡδύς em português corrente, sem eliminar o caráter incomum da descrição.
- source_word: βαθεῖ
  choice: profundo
  rationale: Mantém o sentido básico e a imagem de um estado profundo.
- source_word: κατεσχέθη
  choice: foi dominado
  rationale: Comunica a ideia passiva de ser tomado, retido ou vencido por uma força, adequando-se à intervenção divina no contexto.
- source_word: ἐνεργείᾳ
  choice: pela ação
  rationale: Representa a atuação eficaz do Soberano em linguagem natural, sem transformar o termo em conceito técnico.
- source_word: δεσπότου
  choice: Soberano
  rationale: Preserva a ênfase de δεσπότης em autoridade absoluta e mantém distinção em relação a κύριος.
- source_word: ἀθέσμου προθέσεως
  choice: propósito contrário à lei
  rationale: Torna explícita a força jurídica e moral de ἄθεσμος sem recorrer à formulação pouco natural 'propósito sem lei'.
- source_word: πολὺ διεσφαλμένος
  choice: em grande medida frustrado
  rationale: No contexto, o particípio indica que o propósito foi impedido de alcançar seu objetivo.
- source_word: ἀμεταθέτου λογισμοῦ
  choice: decisão inabalável
  rationale: Expressa uma deliberação fixa, que ele não pretendia alterar, preservando a tensão entre sua determinação e a intervenção divina.
- source_word: μεγάλως διεψευσμένος
  choice: completamente desmentida
  rationale: Comunica que os acontecimentos demonstraram ser vã a expectativa ligada à decisão dele; a construção evita reduzi-la apenas a um sentimento de decepção.
theological_decisions:
- issue: Tradução de δεσπότης como título divino
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: O termo ressalta autoridade absoluta e não é κύριος; 'Soberano' preserva essa nuance e evita apagar a distinção lexical.
- issue: Natureza do estado que domina o rei
  choice: torpor extremamente agradável e profundo
  alternative: a suavíssima e profunda ação do Soberano o dominou
  rationale: O contexto e a combinação de κατεσχέθη com ἥδιστῳ καὶ βαθεῖ favorecem a descrição de um estado profundo que o toma, mas o grego não traz um substantivo expresso para 'torpor'; por isso a alternativa formal é registrada em nota, sem transformar a inferência contextual em certeza absoluta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe narrativa fluente. A formulação conserva o contraste entre a determinação humana aparentemente inabalável e a ação eficaz de Deus. Os marcadores aparecem junto aos elementos que explicam e em ordem textual correspondente às notas.
