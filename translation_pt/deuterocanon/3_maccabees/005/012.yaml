  terminology: «Soberano» é uma boa tradução distinta para δεσπότης. «Propósito contrário à lei» comunica adequadamente ἀθέσμου προθέσεως. «Torpor extremamente agradável e profundo» conserva, com a necessária cautela, a imagem incomum; a nota deve deixar claro que «torpor» é uma explicitação contextual, não um substantivo presente no grego.
