base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/025.yaml
  text: But the Jews[a], as the indivisible time drew them together in soul, stretched out their hands to heaven and, with mournful songs, offered a tearful plea, begging the greatest God to help them again without delay.
translation:
  language: pt
  text: Os judeus, porém, durante aquele tempo indiviso, unidos de alma[a], estenderam as mãos para o céu e, com cânticos de lamento, elevaram uma súplica cheia de lágrimas, implorando ao grandíssimo Deus que os socorresse novamente, sem demora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mantendo-se unidos de alma durante aquele tempo ininterrupto”. A expressão grega é rara e compacta, associando a continuidade do período à unidade interior da comunidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμερῆ
  choice: indiviso
  rationale: O adjetivo significa literalmente “não dividido”. Aplicado a χρόνον, descreve um período contínuo ou ininterrupto e preserva a formulação incomum do grego.
- source_word: ψυχοκοινούμενοι
  choice: unidos de alma
  rationale: O raro composto expressa participação ou união no âmbito da ψυχή. “Unidos de alma” mantém a imagem de profunda unidade interior e comunitária sem explicá-la em excesso.
- source_word: πολυδάκρυν ἱκετίαν
  choice: uma súplica cheia de lágrimas
  rationale: A expressão caracteriza a súplica pela abundância de lágrimas. A formulação é natural em português e conserva a intensidade emocional.
- source_word: ἐν μέλεσιν γοεροῖς
  choice: com cânticos de lamento
  rationale: μέλη pode indicar cantos ou melodias, e γοερός lhes atribui caráter lamentoso. A escolha comunica que a oração era acompanhada por lamento cantado.
- source_word: τείνοντες τὰς χεῖρας εἰς τὸν οὐρανόν
  choice: estenderam as mãos para o céu
  rationale: Reproduz de modo direto e natural o gesto convencional de oração e sua direção ascendente.
- source_word: ἐδέοντο
  choice: implorando
  rationale: O verbo indica um pedido insistente e urgente. O gerúndio liga a imploração à súplica já mencionada, conforme a estrutura participial da frase em português.
- source_word: τοῦ μεγίστου θεοῦ
  choice: ao grandíssimo Deus
  rationale: Preserva o superlativo μέγιστος sem substituí-lo pelo título tradicional “Altíssimo”, que não é a forma lexical usada no texto grego.
- source_word: πάλιν
  choice: novamente
  rationale: Indica que pediam uma nova intervenção divina, pressupondo auxílio anterior.
- source_word: συντόμως
  choice: sem demora
  rationale: No contexto da súplica, o advérbio pede ação pronta e urgente; “sem demora” exprime esse valor com clareza.
theological_decisions:
- issue: Tradução de τοῦ μεγίστου θεοῦ
  choice: ao grandíssimo Deus
  alternative: ao Deus Altíssimo; ao Deus supremo
  rationale: A expressão grega apresenta um superlativo de μέγας (“grande”), não o título formado com ὕψιστος (“Altíssimo”). “Grandíssimo Deus” preserva essa distinção lexical e evita importar uma formulação teológica tradicional diferente.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva-se deliberadamente a formulação incomum “tempo indiviso” e a imagem “unidos de alma”, enquanto a nota registra uma leitura mais fluente sem eliminar a ambiguidade do original.
