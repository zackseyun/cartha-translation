base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/018.yaml
  text: But as the conversation kept dragging on[a], the king summoned Hermon and, with a bitter threat, asked for what reason the Jews had been spared, having survived beyond the appointed day.
translation:
  language: pt
  text: Mas, como a conversa continuava se prolongando, o rei mandou chamar Hermom e, em tom de amarga ameaça, perguntou por que motivo os judeus tinham sido poupados, tendo sobrevivido além do dia marcado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «por que os judeus tinham sido preservados/curados, tendo vivido durante o dia restante». A formulação grega é condensada e um tanto difícil; o texto principal a entende no sentido de que eles continuaram vivos além do dia determinado para sua morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ πλεῖον ... προσκοπτούσης
  choice: continuava se prolongando
  rationale: A construção indica que a conversa se estendia mais; a formulação preserva a ideia de prolongamento e possível entrave sem tornar o português excessivamente literal.
- source_word: ὁμιλίας
  choice: conversa
  rationale: No contexto narrativo, refere-se ao intercâmbio verbal em curso; «conversa» é atual, claro e natural.
- source_word: προσκαλεσάμενος
  choice: mandou chamar
  rationale: Expressa de modo idiomático a ação de um rei que faz Hermom comparecer diante dele.
- source_word: μετὰ πικρίας ἀπειλῆς
  choice: em tom de amarga ameaça
  rationale: Preserva a aspereza de πικρίας e apresenta naturalmente em português a maneira ameaçadora da pergunta.
- source_word: ἐπυνθάνετο
  choice: perguntou
  rationale: Equivalente narrativo direto e corrente; o caráter hostil da pergunta já é comunicado pela expressão anterior.
- source_word: τίνος ἕνεκεν αἰτίας
  choice: por que motivo
  rationale: Reproduz a ênfase causal da expressão grega com naturalidade em português.
- source_word: ἰάθησαν
  choice: tinham sido poupados
  rationale: Embora o sentido comum do verbo seja «foram curados», aqui não há doença em vista; o contexto exige a ideia de terem sido preservados da morte.
- source_word: περιοῦσαν ἡμέραν
  choice: dia marcado
  rationale: A expressão grega é comprimida e difícil. No contexto, parece apontar para o dia determinado para a execução, embora o valor literal possa ser entendido como «dia restante».
- source_word: περιβεβιωκότες
  choice: tendo sobrevivido além
  rationale: Conserva tanto a permanência em vida quanto a ideia de ultrapassar o limite temporal esperado.
