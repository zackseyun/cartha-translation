lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: chefe dos elefantes
  rationale: Expressa de modo natural e conciso a função oficial daquele que estava encarregado dos elefantes.
- source_word: τὰ θηρία
  choice: os animais
  rationale: No contexto, refere-se aos elefantes. “Animais” é claro em português atual sem introduzir a possível conotação de ferocidade inerente de “feras”.
- source_word: σχεδόν
  choice: quase
  rationale: Equivalente adverbial direto e natural.
- source_word: εἰς κατάστεμα μανιῶδες
  choice: a um estado de frenesi
  rationale: Conserva a ideia de condição ou estado caracterizado por loucura e agitação violenta.
- source_word: ἀγιοχὼς
  choice: depois de levar
  rationale: A forma transmitida é difícil; a escolha representa com cautela a provável ação preparatória do responsável em relação aos elefantes.
- source_word: εὐωδεστάτοις πόμασιν
  choice: por meio de bebidas muito aromáticas
  rationale: Mantém tanto a referência ao que se bebe quanto a forte ênfase no aroma.
- source_word: οἴνῳ λελιβανωμένῳ
  choice: com vinho misturado com incenso
  rationale: Representa concretamente o vinho tratado com λίβανος, sem excluir em nota o sentido de perfumado ou aromatizado.
- source_word: φοβερῶς κεκοσμημένα
  choice: adorná-los de modo aterrador
  rationale: Preserva simultaneamente a ideia de ornamentação e o efeito ameaçador ou aterrorizante.
- source_word: κατασκευαῖς
  choice: com seus aparatos
  rationale: Termo abrangente para o equipamento, os acessórios ou os adereços colocados nos elefantes, sem especificar além do grego.
