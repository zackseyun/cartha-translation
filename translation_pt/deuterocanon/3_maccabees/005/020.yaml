base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/020.yaml
  text: Having a savagery worse than Phalaris[a], he said that they should be thankful to sleep today; but, once they had been kept alive until the coming day[c][b], prepare the elephants in the same way for the destruction of the lawless Jews.
translation:
  language: pt
  text: 'Com uma crueldade maior que a de Fálaris[a], ele disse que eles deveriam agradecer pelo sono de hoje[b]; e ordenou: “Depois de serem mantidos vivos até o dia seguinte, prepare do mesmo modo os elefantes para a destruição dos judeus ímpios[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fálaris era lembrado na tradição grega como um governante de crueldade notória; a comparação intensifica a brutalidade do rei.
    reason: cultural_note
  - marker: b
    text: Mais literalmente, “deveriam mostrar gratidão pelo sono de hoje”; isto é, deveriam considerar um favor o fato de lhes ser permitido dormir naquele dia.
    reason: lexical_alternative
  - marker: c
    text: “Ímpios” traduz aqui um epíteto hostil usado pelo perseguidor. Também pode ser entendido como “transgressores” ou “sem lei”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠμότητα χείρονα Φαλάριδος
  choice: uma ferocidade pior que a de Fálaris
  rationale: ὠμότης expressa crueldade feroz e desumana; “ferocidade” conserva a força moral da comparação, enquanto “a de Fálaris” torna natural em português a referência ao grau de crueldade.
- source_word: τὸ τῆς σήμερον ὕπνῳ χάριν ἔχειν αὐτούς
  choice: eles deveriam agradecer por lhes ser permitido dormir naquele dia
  rationale: χάριν ἔχειν é uma expressão de gratidão por um favor. A formulação explicita naturalmente que o sono concedido naquele dia devia ser considerado um favor, sem acrescentar a ideia não expressa de descanso ou trégua.
- source_word: συντηρηθέντας
  choice: depois de mantê-los vivos
  rationale: O particípio passivo indica que as vítimas seriam conservadas até o dia seguinte; no contexto da execução planejada, “mantê-los vivos” comunica com clareza o sentido implícito.
- source_word: ὑποτέλλουσαν ἡμέραν
  choice: o dia seguinte
  rationale: A expressão designa o dia que se aproxima. “O dia seguinte” é idiomático em português e preserva o contraste temporal com “naquele dia”.
- source_word: κατὰ τὸ ὅμοιον
  choice: do mesmo modo
  rationale: A locução remete à preparação anterior dos elefantes e é traduzida de maneira concisa e formal.
- source_word: ἑτοίμασον
  choice: prepare
  rationale: O imperativo singular é preservado diretamente como ordem dirigida ao responsável pela preparação.
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: para a destruição
  rationale: ἀφανισμός indica destruição ou eliminação completa. “Destruição” mantém a força do termo sem intensificação interpretativa.
- source_word: ἀθεμίτων Ἰουδαίων
  choice: dos judeus ímpios
  rationale: ἀθέμιτος pode significar contrário ao que é lícito, sacrílego ou ímpio. No insulto proferido pelo perseguidor, “ímpios” preserva a carga religiosa e hostil sem apresentar o qualificativo como avaliação do narrador.
theological_decisions:
- issue: Epíteto hostil dirigido ao povo judeu
  choice: judeus ímpios
  alternative: judeus transgressores; judeus sem lei
  rationale: O epíteto deve permanecer no discurso do perseguidor, sem ser suavizado nem endossado. “Ímpios” representa um sentido legítimo de ἀθέμιτος e a nota esclarece sua função retórica.
- issue: Delimitação da fala do rei
  choice: introdução da ordem com dois-pontos e aspas
  alternative: manter toda a frase como discurso indireto sem aspas
  rationale: O grego passa de ἔφη, com construção indireta, ao imperativo direto ἑτοίμασον. A pontuação escolhida torna essa mudança compreensível em português sem eliminar a tensão sintática do original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção inicial conserva o juízo severo do grego; a transição para a ordem direta evita uma sequência sintaticamente obscura. Todos os marcadores de nota aparecem no texto principal junto ao elemento explicado.
