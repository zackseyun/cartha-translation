  yaml_path: translation/deuterocanon/3_maccabees/005/022.yaml
  text: And they did not spend the time of the night so much in sleep as in devising every kind of mockery for those who seemed miserable[a].
translation:
  language: pt
  text: E não passaram o tempo da noite tanto dormindo quanto planejando todo tipo de zombaria contra aqueles que lhes pareciam miseráveis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aqueles desgraçados”, no sentido de que os agressores viam as vítimas como miseráveis e as tratavam com escárnio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεχρίζαντο
  choice: passaram
  rationale: Com «o tempo da noite», o verbo descreve como ocuparam ou empregaram aquelas horas; «passaram» é natural em português e não acrescenta a ideia de desperdício.
- source_word: οὐχ οὕτως ... ὡς
  choice: não ... tanto ... quanto
  rationale: Reproduz de modo idiomático a comparação correlativa entre dormir e planejar zombarias.
- source_word: εἰς ὕπνον
  choice: dormindo
  rationale: Converte a expressão preposicional em uma forma verbal natural em português, mantendo o sono como a primeira maneira de passar a noite.
- source_word: παντοίως
  choice: toda espécie de
  rationale: Transmite a abrangência do advérbio em relação às zombarias tramadas.
- source_word: μηχανᾶσθαι
  choice: planejando
  rationale: Expressa a ação deliberada de conceber ou preparar as zombarias sem intensificá-la indevidamente como conspiração.
- source_word: τοῖς ταλαιπώροις
  choice: contra aqueles ... dignos de pena
  rationale: O dativo indica os alvos das zombarias; «dignos de pena» comunica a condição lastimável atribuída às vítimas.
- source_word: δοκοῦσιν
  choice: que lhes pareciam
  rationale: Preserva a perspectiva dos agentes, sem afirmar de modo absoluto a caracterização das vítimas.
- source_word: ἐμπαιγμούς
  choice: zombaria
  rationale: Termo coletivo que abrange atos e palavras de ridicularização e escárnio.
