review_pass:
  verdict: revise
  source_fidelity: A estrutura comparativa («não ... tanto ... quanto») e a oposição entre dormir e conceber zombarias refletem bem οὐχ οὕτως ... ὡς. «Contra» expressa de modo natural que os sofredores são o alvo dos ἐμπαιγμοί. Contudo, «dignos de pena» suaviza ταλαιπώροις, que caracteriza as vítimas como miseráveis/desgraçadas, e a nota atual também não preserva claramente a nuance perspectival de δοκοῦσιν.
  naturalness: O português é fluente e de registro apropriado. «Todo tipo de zombaria» é ligeiramente mais corrente do que «toda espécie de zombaria», sem perda de sentido. A redação revisada da nota evita a construção pouco natural «objetos lastimáveis de desprezo».
  terminology: «Zombaria» comunica adequadamente ἐμπαιγμούς; «planejando» reproduz a deliberação de μηχανᾶσθαι sem intensificação indevida. «Miseráveis» preserva melhor o tom de ταλαιπώροις, enquanto «lhes pareciam» mantém explícita a avaliação dos perseguidores indicada por δοκοῦσιν.
  issues:
  - severity: medium
    issue: «Dignos de pena» atenua o qualificativo ταλαιπώροις.
    rationale: A expressão portuguesa pode significar meramente «pitiable», ao passo que ταλαιπώροις traz a designação depreciativa de pessoas miseráveis ou desgraçadas, tal como vistas pelos agentes. A perspectiva é mantida por «lhes pareciam».
  - severity: low
    issue: A nota lexical é pouco idiomática e não torna explícita a aparência indicada por δοκοῦσιν.
    rationale: «Objetos lastimáveis de desprezo» soa forçado. Uma nota que use «desgraçados» e mencione que essa era a maneira como os agressores viam as vítimas preserva tanto a alternativa lexical quanto a nuance do particípio.
  revised_text: E não passaram o tempo da noite tanto dormindo quanto planejando todo tipo de zombaria contra aqueles que lhes pareciam miseráveis[a].
  revised_footnotes:
  - marker: a
    text: 'Ou: “aqueles desgraçados”, no sentido de que os agressores viam as vítimas como miseráveis e as tratavam com escárnio.'
    reason: lexical_alternative
