revisions:
- from: E não passaram o tempo da noite tanto dormindo quanto planejando toda espécie de zombaria contra aqueles que lhes pareciam dignos de pena[a].
  to: E não passaram o tempo da noite tanto dormindo quanto planejando todo tipo de zombaria contra aqueles que lhes pareciam miseráveis[a].
  rationale: A revisão substitui uma expressão mais branda por «miseráveis», que corresponde mais diretamente a ταλαιπώροις, e conserva a avaliação subjetiva dos perseguidores em «lhes pareciam». Ajusta também a nota para uma alternativa lexical natural e fiel ao escárnio implicado no contexto.
