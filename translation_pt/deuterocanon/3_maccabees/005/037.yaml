  text: Then, summoning Hermon with a threat, he said, “How many times must I command you about these very matters, you most wretched man?”
translation:
  language: pt
  text: 'Então, tendo mandado chamar Hermom com uma ameaça, disse: “Quantas vezes é preciso que eu lhe dê ordens sobre estas mesmas coisas, ó o mais miserável dos homens?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ... Ἕρμωνα
  choice: Hermom
  rationale: Transliteração portuguesa tradicional e natural do nome grego Ἕρμων, sem traduzir o nome próprio.
- source_word: προσκαλεσάμενος
  choice: mandando chamar
  rationale: O particípio aoristo médio indica que ele convocou Hermom para junto de si; a formulação é idiomática em português e preserva a ação anterior ao discurso.
- source_word: μετὰ ἀπειλῆς
  choice: em tom ameaçador
  rationale: A expressão significa literalmente 'com ameaça'; esta formulação comunica de modo natural que a convocação ou fala foi acompanhada de ameaça, sem especificar palavras não registradas.
- source_word: Ποσάκις ... δεῖ
  choice: Quantas vezes ainda terei de
  rationale: Reproduz a pergunta indignada sobre a repetição necessária das ordens. 'Ainda' explicita em português a reiteração já implícita na pergunta contextual.
- source_word: σοι ... προστάττειν
  choice: lhe dar ordens
  rationale: προστάττειν denota ordenar ou mandar. A construção com 'lhe' é clara e digna no registro narrativo.
- source_word: περὶ τούτων αὐτῶν
  choice: sobre essas mesmas coisas
  rationale: Preserva a referência enfática às próprias coisas já mencionadas, sem transformar o referente genérico em uma abstração mais interpretativa.
- source_word: ἀθλιώτατε
  choice: seu miserável
  rationale: O vocativo superlativo é um insulto forte. Em português corrente, 'seu miserável' transmite diretamente a censura extrema, embora o superlativo seja expresso de maneira idiomática, não morfológica.
