  text: But when the one who had pointed out that during the night the order had been carried through to completion[a], and their friends had borne witness to it,
translation:
  language: pt
  text: Mas, quando aquele que havia indicado que, durante a noite, a ordem fora executada até o fim[a], e os amigos deles também haviam dado testemunho disso,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma verbal grega traduzida por “fora executada” é textual e morfologicamente difícil no testemunho de Swete, mas a oração como um todo indica claramente que, segundo o relato, a ação ordenada havia sido concluída durante a noite.
    reason: textual_variant
lexical_decisions:
- source_word: ὑποδείξαντος
  choice: havia indicado
  rationale: Mantém o sentido de dar a conhecer ou assinalar algo, sem transformar a ação em uma proclamação formal.
- source_word: νυκτός
  choice: durante a noite
  rationale: Expressa naturalmente em português o genitivo grego de tempo.
- source_word: τὸ προσταγέν
  choice: a ordem
  rationale: O particípio substantivado designa aquilo que foi ordenado; “a ordem” é conciso e adequado ao contexto oficial.
- source_word: ἐπὶ τέλος
  choice: até o fim
  rationale: Conserva a imagem e o sentido de conclusão ou pleno cumprimento, sem acrescentar a ideia avaliativa de êxito.
- source_word: ἠγοχέναι
  choice: fora executada
  rationale: Embora a forma grega seja textual e morfologicamente difícil, o contexto aponta para a realização da ação ordenada; a voz passiva produz uma formulação portuguesa natural em relação a “a ordem”.
- source_word: προσμαρτυρησάντων
  choice: também deram testemunho disso
  rationale: O composto comunica testemunho adicional ou corroborador; “também” representa essa força, e “disso” explicita em português o conteúdo testemunhado.
- source_word: φίλων
  choice: amigos
  rationale: Preserva o sentido comum do substantivo; o contexto não exige a opção mais institucional “associados”.
