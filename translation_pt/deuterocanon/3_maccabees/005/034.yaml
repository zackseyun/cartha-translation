translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção plural “os amigos, um por um” preserva tanto o valor distributivo da expressão inicial quanto o verbo grego no plural. O imperfeito mantém o caráter contínuo da cena.
