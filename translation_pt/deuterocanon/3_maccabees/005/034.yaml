translation:
  language: pt
  text: Mas cada um dos amigos, afastando-se de semblante sombrio[a], dispensava os que estavam reunidos, cada qual para os seus próprios afazeres.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma grega traduzida por “afastando-se” (ὑπεκρέων) é incomum, e a transcrição da fonte está sinalizada com uma pequena divergência. Pode também sugerir que eles se retiravam discretamente.
    reason: textual_variant
  - marker: b
    text: Ou “para as suas próprias ocupações” ou “para os seus próprios assuntos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθ᾽ εἷς τῶν φίλων
  choice: os amigos, um por um
  rationale: A expressão distributiva apresenta individualmente os membros do grupo. A formulação portuguesa também acomoda com naturalidade o verbo grego no plural, sem apagar a ideia de ação individual.
- source_word: σκυθρωπῶς
  choice: com o semblante sombrio
  rationale: O advérbio descreve uma aparência carregada, abatida ou severa. A expressão escolhida comunica de modo natural esse aspecto visível.
- source_word: ὑπεκρέων
  choice: retiravam-se
  rationale: A forma grega é incomum e a transcrição da fonte tem sinalização de pequena divergência. O contexto favorece a noção de afastar-se ou retirar-se; a tradução evita acrescentar a ideia mais específica de fuga furtiva.
- source_word: τοὺς συνθροισμένους
  choice: os que estavam reunidos
  rationale: O particípio designa as pessoas que se encontravam reunidas, sem exigir que a tradução determine se elas próprias se reuniram ou foram convocadas.
- source_word: ἀπέλυαν
  choice: dispensavam
  rationale: O verbo significa soltar, despedir ou mandar embora. Neste contexto, trata-se de dispersar os presentes, e o imperfeito português preserva o aspecto de ação em curso ou repetida.
- source_word: ἕκαστον
  choice: cada um
  rationale: O singular distributivo indica que as pessoas reunidas eram dispensadas individualmente.
- source_word: ἐπὶ τὴν ἰδίαν ἀσχολίαν
  choice: para seus próprios afazeres
  rationale: ἀσχολία pode indicar ocupação, atividade, negócios ou assuntos. “Afazeres” é atual, abrangente e adequado ao retorno de cada pessoa às próprias atividades.
