  source_fidelity: A tradução preserva a pergunta retórica, a ação contínua de «διαπειράζεις», a ordem real repetida e a reversão das decisões. Contudo, «agora» não exprime adequadamente ἤδη, que marca que a ordem já chegou à terceira ocorrência; «já» é mais fiel. «Destruídos» reproduz ἀφανίσαι sem tornar necessariamente mais explícita a ideia de extermínio.
  naturalness: A construção é clara e mantém o registro solene. «Continuarás a nos pôr à prova» é natural para leitores brasileiros e conserva o valor durativo da pergunta. «As decisões que tomaste» é mais idiomático do que «as determinações que tomaste», sem excluir o possível sentido oficial, que a nota registra.
  terminology: «Ó rei» e «ordenando» são adequados ao registro. «Destruídos» é uma opção semanticamente segura para ἀφανίσαι. A nota preserva a alternativa de entender τὰ σοὶ δεδογμένα como decretos reais oficiais.
