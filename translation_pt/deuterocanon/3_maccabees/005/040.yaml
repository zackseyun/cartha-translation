    rationale: Embora possa caber no contexto, «exterminados» torna mais específica e intensa a formulação. «Destruídos» transmite o sentido básico sem estreitar o termo.
  - severity: low
    issue: «determinações que tomaste»
    rationale: É compreensível, mas «decisões que tomaste» é mais natural no português atual e corresponde ao sentido não exclusivamente técnico de δεδογμένα; a nota mantém a leitura «decretos».
