  yaml_path: translation/deuterocanon/3_maccabees/005/040.yaml
  text: O king[a], how long will you keep testing us, now commanding for the third time that they be destroyed, and then again, in the matter at hand, reversing by a change of mind the decisions you have made?
translation:
  language: pt
  text: Ó rei, até quando continuarás a nos pôr à prova, ordenando já pela terceira vez que eles sejam destruídos e, de novo, no caso em questão, desfazendo, por uma mudança de decisão, as decisões que tomaste[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os decretos que promulgaste”. O grego pode referir-se especificamente a decretos oficiais do rei, e não apenas a decisões pessoais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπειράζεις
  choice: continuarás a pôr-nos à prova
  rationale: O presente, em combinação com μέχρι τίνος, expressa uma ação persistente; a formulação preserva tanto a ideia de provar quanto a força da pergunta retórica.
- source_word: προστάσσων
  choice: ordenando
  rationale: O particípio explica de que modo o rei os põe à prova e mantém o caráter oficial da ordem.
- source_word: ἤδη τρίτον
  choice: agora, pela terceira vez
  rationale: A expressão indica que a ação já chegou à terceira ocorrência; esta forma é clara e natural em português.
- source_word: αὐτοὺς ἀφανίσαι
  choice: que eles sejam exterminados
  rationale: No contexto, ἀφανίζω significa fazer desaparecer ou destruir por completo um grupo; a construção passiva mantém o foco nas vítimas.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: no caso em questão
  rationale: A expressão aponta para a situação concreta em discussão, sem ampliar indevidamente o sentido.
- source_word: ἐκ μεταβολῆς
  choice: por uma mudança de decisão
  rationale: Torna explícita a mudança de intenção ou de rumo sugerida pelo grego, sem atribuir uma motivação adicional.
- source_word: ἀναλύων
  choice: desfazendo
  rationale: O verbo descreve a anulação prática das determinações anteriores; “desfazendo” preserva a imagem e a censura do discurso.
- source_word: τὰ σοὶ δεδογμένα
  choice: as determinações que tomaste
  rationale: δεδογμένα pode designar decisões estabelecidas ou decretos oficiais. “Determinações” conserva o peso régio sem limitar o grego exclusivamente à terminologia jurídica.
