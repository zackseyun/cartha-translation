base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/047.yaml
  text: But he[a], filled with heavy wrath and impious in mind, rushed out with all his force along with the beasts[b], wanting with unfeeling heart and with the pupils of his eyes to look upon the painful and miserable destruction of those who had been marked out.
translation:
  language: pt
  text: Mas ele, tendo enchido sua mente ímpia de ira intensa, partiu impetuosamente, com toda a força, junto com as feras, querendo contemplar, com o coração insensível[a] e com as pupilas dos olhos[b], a dolorosa e miserável destruição dos que haviam sido marcados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com o coração não ferido” ou “não traspassado”; provavelmente indica um coração que a compaixão não conseguia tocar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com as pupilas dos olhos”, expressão enfática que indica que ele queria ver tudo pessoalmente e de modo direto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργῇ βαρείᾳ γεμίσας δυσσεβῆ φρένα
  choice: tendo enchido de ira intensa sua mente ímpia
  rationale: 'Preserva a relação sintática do grego: a mente ou disposição ímpia é aquilo que ele enche de ira. “Intensa” comunica naturalmente a força metafórica de βαρείᾳ (“pesada”) em português.'
- source_word: παντὶ τῷ βάρει
  choice: com toda a força
  rationale: Expressa o ímpeto total do movimento sem impor ao português o pouco natural “com todo o peso”.
- source_word: σὺν τοῖς θηρίοις
  choice: junto com as feras
  rationale: “Feras” mantém o caráter ameaçador dos animais destinados à execução.
- source_word: ἐξώρμησε
  choice: lançou-se
  rationale: Comunica movimento súbito, impetuoso e dirigido para fora, em linguagem portuguesa natural.
- source_word: ἀτρώτῳ καρδίᾳ
  choice: com o coração insensível
  rationale: O sentido contextual é o de um coração não atingido pela compaixão. A nota preserva a imagem mais literal de algo não ferido ou não traspassado.
- source_word: κόραις ὀφθαλμῶν
  choice: com as pupilas dos próprios olhos
  rationale: Mantém a expressão visual enfática do grego e deixa claro que ele desejava presenciar pessoalmente a cena.
- source_word: θεάσασθαι
  choice: contemplar
  rationale: Verbo digno e corrente que sugere observação deliberada, adequada ao desejo expresso no contexto.
- source_word: τὴν ἐπίπονον καὶ ταλαίπωρον ... καταστροφήν
  choice: a dolorosa e miserável destruição
  rationale: Conserva os dois qualificativos e a gravidade de καταστροφή sem suavizar a calamidade.
- source_word: τῶν προσεσημαμμένων
  choice: dos que haviam sido marcados
  rationale: 'O mais-que-perfeito composto reflete o particípio perfeito: essas pessoas já tinham sido previamente marcadas ou designadas.'
theological_decisions:
- issue: Força moral e religiosa de δυσσεβῆ
  choice: ímpia
  alternative: perversa; sem Deus
  rationale: “Ímpia” conserva a dimensão de irreverência religiosa do termo grego, sem reduzi-lo à maldade genérica nem acrescentar formulação doutrinária.
- issue: Sentido de ἀτρώτῳ καρδίᾳ
  choice: coração insensível, com explicação da imagem literal em nota
  alternative: coração não ferido; coração impenetrável
  rationale: A tradução principal comunica de modo natural um coração não tocado pela compaixão, enquanto a nota reconhece a metáfora e a ambiguidade lexical do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi ajustada para mostrar que, no grego, a ira enche a mente ímpia. As imagens incomuns foram preservadas no texto quando inteligíveis e esclarecidas por notas quando a literalidade poderia obscurecer o sentido.
