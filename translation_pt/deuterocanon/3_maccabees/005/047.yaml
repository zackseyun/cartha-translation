  naturalness: A redação é em geral moderna e compreensível. A revisão melhora a fluidez sintática e evita o acréscimo desnecessário «próprios» na expressão literalmente intensiva «pupilas dos olhos».
  terminology: «Mente ímpia», «feras», «coração insensível», «contemplar», «dolorosa e miserável destruição» e «haviam sido marcados» são escolhas adequadas. As notas mantêm de modo útil as imagens literais e não impõem interpretação doutrinária.
