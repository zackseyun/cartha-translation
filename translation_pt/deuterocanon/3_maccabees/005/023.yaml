revisions:
- from: Mas, naquele exato momento, quando um galo havia cantado ao amanhecer, Hermom, depois de equipar as feras, fazia-as se movimentar no grande pátio cercado de colunas.[a]
  to: Mas, justamente então, quando um galo havia cantado ao amanhecer, Hermom, depois de armar as feras, movimentava-as no grande pátio cercado de colunas.[a]
