  text: But just then[a], when the rooster had crowed at dawn, Hermon, having armed the beasts, was driving them on in the great colonnade.
translation:
  language: pt
  text: Mas, justamente então, quando um galo havia cantado ao amanhecer, Hermom, depois de armar as feras, movimentava-as no grande pátio cercado de colunas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no grande peristilo” ou “na grande colunata”. O termo grego designa um espaço arquitetônico cercado de colunas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Mas, naquele exato momento
  rationale: ἄρτι expressa imediatismo, enquanto δέ marca uma transição narrativa levemente adversativa; a formulação preserva ambos e soa natural em português.
- source_word: ἀλεκτρυὼν ἐκέκραγεν ὄρθρος
  choice: quando um galo havia cantado ao amanhecer
  rationale: ἀλεκτρυών, sem artigo, é naturalmente vertido como “um galo”; ἐκέκραγεν admite valor anterior no cenário narrativo, e ὄρθρος situa o canto ao amanhecer.
- source_word: τὰ θηρία
  choice: as feras
  rationale: No contexto da execução planejada, θηρία designa animais perigosos; “feras” conserva essa força sem especificar uma espécie no próprio versículo.
- source_word: καθωπλικὼς
  choice: depois de equipar
  rationale: A forma de καθοπλίζω indica que Hermom havia aparelhado ou preparado as feras. “Equipar” preserva o sentido sem sugerir necessariamente que receberam armas literais.
- source_word: διεκίνει
  choice: fazia-as se movimentar
  rationale: διακινέω pode significar mover, pôr em movimento ou fazer mover de um lado para outro. A escolha mantém a ação causativa e evita acrescentar uma finalidade não explícita.
- source_word: ἐν τῷ μεγάλῳ περιστυλίῳ
  choice: no grande pátio cercado de colunas
  rationale: περιστύλιον designa um espaço arquitetônico com colunas ao redor. A expressão é clara para leitores atuais e comunica melhor o referente do que o termo técnico “peristilo”.
- source_word: ὁ Ἕρμων
  choice: Hermom
  rationale: Transliteração portuguesa corrente do nome próprio grego Ἕρμων.
