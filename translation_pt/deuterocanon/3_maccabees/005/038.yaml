translation:
  language: pt
  text: Arma imediatamente os elefantes, para amanhã, para a destruição[a] dos judeus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aniquilação”. O substantivo grego pode indicar destruição completa ou desaparecimento.
    reason: lexical_alternative
  - marker: b
    text: Ou “judeanos”; neste contexto, porém, é mais provável o sentido étnico-religioso mais amplo, “judeus”.
    reason: alternative_reading
lexical_decisions:
- source_word: καθόπλισον
  choice: Arma
  rationale: O imperativo se refere ao preparo e aparelhamento militar dos elefantes. “Arma” é conciso, natural e preserva a força marcial do verbo.
- source_word: ἔτι καὶ νῦν
  choice: agora mesmo
  rationale: A expressão dá ênfase ao momento presente e comunica urgência. “Agora mesmo” é idiomático em português e evita o sentido potencialmente ambíguo de “já agora”.
- source_word: εἰς τὴν αὔριον
  choice: para amanhã
  rationale: A locução indica que os elefantes devem ser preparados tendo em vista o dia seguinte. “Para amanhã” preserva com naturalidade essa referência temporal.
- source_word: ἐπὶ τὸν ... ἀφανισμόν
  choice: para a destruição de
  rationale: ἀφανισμός pode indicar destruição, desaparecimento ou aniquilação. “Destruição” mantém a intensidade sem impor uma especificação moderna mais estreita; a alternativa mais forte é registrada em nota.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Neste contexto helenístico da diáspora, o termo designa o povo judeu em sentido étnico-religioso, e não apenas os habitantes da Judeia.
theological_decisions:
- issue: Sentido de Ἰουδαῖοι em contexto helenístico da diáspora
  choice: judeus
  alternative: judeanos
  rationale: O contexto trata de um povo identificado por sua pertença étnica e religiosa sob o domínio ptolemaico, não apenas por procedência geográfica. A alternativa é preservada em nota.
- issue: Intensidade de ἀφανισμός
  choice: destruição
  alternative: aniquilação
  rationale: O substantivo admite a noção de destruição completa ou apagamento. O texto principal usa uma equivalência forte, porém menos interpretativamente estreita, e registra a leitura mais intensa em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Agora mesmo” transmite a ênfase urgente do grego de modo natural; a repetição de “para” conserva a estrutura de preparação temporal seguida de finalidade, sem obscurecer o sentido.
