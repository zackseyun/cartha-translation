  yaml_path: translation/deuterocanon/3_maccabees/005/026.yaml
  text: But the sun’s rays had not yet spread out[a], and while the king was receiving his friends, Hermon came forward and summoned them to the departure[b], pointing out that the king’s eagerness was in readiness.
translation:
  language: pt
  text: Mas os raios do sol ainda não se haviam espalhado e, enquanto o rei recebia seus amigos[a], Hermon se apresentou e os convocou para a partida[b], indicando que o rei estava disposto e pronto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus cortesãos”. Na linguagem da corte helenística, “amigos” podia funcionar como título oficial dos companheiros do rei.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega significa literalmente “convocou para a saída” e provavelmente indica que Hermon chamou os presentes para partir.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω δὲ ἡλίου βολαὶ κατεσπείροντο
  choice: Mas os raios do sol ainda não se haviam espalhado
  rationale: Conserva a imagem das βολαί como raios e o aspecto narrativo do imperfeito κατεσπείροντο, com formulação natural em português.
- source_word: τοῦ βασιλέως τοὺς φίλους ἐκδεχόμενον
  choice: enquanto o rei recebia seus amigos
  rationale: ἐκδέχομαι pode significar esperar ou receber; com τοὺς φίλους como objeto e em contexto cortesão, 'recebia' é a leitura contextual mais provável, sem eliminar totalmente a nuance de acolhimento ou admissão.
- source_word: τοὺς φίλους
  choice: seus amigos
  rationale: Traduz diretamente φίλους; uma nota registra que, na linguagem da corte helenística, o termo também podia designar oficialmente cortesãos ou companheiros do rei.
- source_word: ὁ Ἕρμων παραστὰς
  choice: Hermom se apresentou
  rationale: O particípio aoristo indica que Hermom se aproximou ou tomou seu lugar diante do rei; 'se apresentou' é claro, digno e idiomático.
- source_word: ἐπικαλεῖ πρὸς τὴν ἔξοδον
  choice: os convocou para a partida
  rationale: Expressa a convocação para sair ou partir. O pronome explicita em português o objeto implícito no grego, cuja referência exata permanece contextual.
- source_word: ὑποδεικνὺς
  choice: indicando
  rationale: Reproduz de modo conciso a função explicativa do particípio.
- source_word: τὸ πρόθυμον τοῦ βασιλέως
  choice: a prontidão do rei
  rationale: πρόθυμον abrange disposição, empenho e prontidão; 'prontidão' combina melhor com o estado de preparação expresso na oração seguinte.
- source_word: ἐν ἑτοίμῳ κεῖσθαι
  choice: já estava preparada
  rationale: A expressão idiomática significa estar de prontidão ou preparado. A formulação mantém a construção abstrata algo incomum do grego sem recorrer ao literalismo 'jazia pronta'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa fluente. Mantém-se a leve estranheza da referência abstrata à prontidão do rei, presente no grego, sem lhe atribuir uma interpretação teológica.
