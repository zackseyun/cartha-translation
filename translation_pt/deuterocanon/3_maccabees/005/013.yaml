  yaml_path: translation/deuterocanon/3_maccabees/005/013.yaml
  text: And the Jews[a], having escaped the appointed hour, again were imploring their holy God to show to the proud nations, in magnificent generosity[c][b], the might of his hand.
translation:
  language: pt
  text: E os judeus, tendo escapado da hora previamente marcada, voltaram a suplicar a seu Deus, o Santo[a], favorável a atender ao apelo[b], que mostrasse de modo grandioso o poder de sua mão às nações arrogantes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao Santo, isto é, ao seu Deus”. O grego contém uma partícula explicativa que identifica “o Santo” como o Deus deles.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “pronto a se deixar aplacar” ou “pronto a se reconciliar”. A palavra grega descreve uma disposição favorável em resposta a um apelo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “aos gentios arrogantes”. A palavra grega pode significar tanto “nações” como, no uso judaico, “gentios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαφυγόντες
  choice: tendo escapado
  rationale: O particípio indica que os judeus conseguiram passar além de um perigo ou prazo ameaçador; “escapado” preserva com naturalidade a ideia de livramento.
- source_word: τὴν προσημανθεῖσαν ὥραν
  choice: da hora previamente marcada
  rationale: A expressão designa uma hora assinalada de antemão. “Previamente marcada” explicita o valor temporal do prefixo προ- sem sugerir necessariamente um decreto divino.
- source_word: τὸν ἅγιον ἤγουν θεὸν αὐτῶν
  choice: ao Santo, isto é, ao seu Deus
  rationale: Mantém o substantivo ἅγιον e conserva de forma explícita a partícula explicativa ἤγουν, em vez de reduzir a construção a “seu Deus santo”.
- source_word: καὶ πάλιν ἤξιουν
  choice: voltaram a suplicar
  rationale: “Voltaram a” expressa πάλιν, enquanto “suplicar” comunica a insistência do verbo e o aspecto continuado do imperfeito em português corrente.
- source_word: τὸν εὐκατάλλακτον
  choice: sempre disposto a conceder favor
  rationale: A expressão comunica a disposição favorável de Deus para atender à súplica, evitando a impressão de instabilidade que uma tradução isolada como “facilmente aplacável” poderia produzir. A alternativa mais literal fica registrada em nota.
- source_word: μεγαλοφθενῶς
  choice: de modo grandioso
  rationale: O advérbio raro denota grandeza ou nobre magnificência; a formulação preserva seu valor adverbial e não o funde silenciosamente com εὐκατάλλακτον.
- source_word: ἑαυτοῦ χειρὸς κράτος
  choice: o poder de sua mão
  rationale: Preserva a imagem bíblica concreta da mão como manifestação do poder divino.
- source_word: ἔθνεσιν ὑπερηφάνοις
  choice: às nações arrogantes
  rationale: “Nações” mantém o sentido amplo de ἔθνη, enquanto “arrogantes” comunica mais precisamente a soberba hostil de ὑπερήφανος.
theological_decisions:
- issue: A descrição de Deus por εὐκατάλλακτον
  choice: sempre disposto a conceder favor
  alternative: facilmente aplacável; pronto a se reconciliar; benigno
  rationale: A tradução principal expressa a disposição favorável invocada na oração sem importar uma teoria posterior da expiação nem retratar Deus como volúvel. A nota preserva a tensão e o sentido mais literal do termo.
- issue: A função de ἤγουν na identificação divina
  choice: ao Santo, isto é, ao seu Deus
  alternative: ao seu Deus santo
  rationale: 'A forma explícita conserva a relação explicativa ambígua do grego: “o Santo” é identificado como o Deus deles, em vez de a santidade ser apresentada apenas como adjetivo.'
- issue: O destinatário ou âmbito da demonstração divina em ἔθνεσιν
  choice: às nações arrogantes
  alternative: aos gentios arrogantes; contra as nações arrogantes
  rationale: O dativo permite a ideia de manifestação perante ou às nações, sem exigir o sentido adversativo “contra”. “Nações” também evita decidir silenciosamente se ἔθνη funciona aqui como termo técnico para gentios.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência, mas a partícula explicativa, a repetição da súplica, o adjetivo aplicado a Deus, o advérbio de grandeza e a imagem do poder da mão permanecem representados.
