  text: But when the Jews saw the elephants coming out to the gate[a], and the dust from the advancing armed force and from the movement of the crowd, and heard a loud tumult,
translation:
  language: pt
  text: Mas, quando os judeus viram os elefantes saindo em direção ao portão, a poeira levantada pela força armada que vinha atrás deles e pelo avanço da multidão, e ouviram um ruído retumbante[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um tumulto intenso” ou “um ruído grave”. A expressão grega destaca o peso ou a ressonância do som.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mas, quando
  rationale: Preserva tanto a ligação com a narrativa anterior quanto o valor temporal da expressão.
- source_word: τῶν ἐλεφάντων ἐξιόντων ἐπὶ πύλην
  choice: os elefantes saindo em direção ao portão
  rationale: Reproduz o movimento de saída e mantém o sentido direcional de ἐπί com acusativo, sem afirmar necessariamente que os elefantes já haviam chegado ao portão.
- source_word: τῆς ἑπομένης ἐνόπλου δυνάμεως
  choice: a força armada que vinha atrás deles
  rationale: Expressa de modo natural que a tropa seguia os elefantes, preservando a sequência espacial indicada por ἑπομένης.
- source_word: τῆς τε τοῦ πλήθους πορείας
  choice: pelo avanço da multidão
  rationale: πορεία indica deslocamento ou marcha; “avanço” comunica o movimento coletivo sem impor uma formação militar à multidão.
- source_word: κονιορτόν
  choice: a poeira levantada
  rationale: “Poeira” é o sentido direto do substantivo; “levantada” torna explícita em português a relação natural entre a poeira e o deslocamento das forças, sem acrescentar uma imagem como “nuvem”.
- source_word: βαρυχῆ θόρυβον
  choice: um estrondo profundo
  rationale: “Estrondo” transmite o ruído intenso, enquanto “profundo” preserva a ideia de peso ou ressonância sonora presente em βαρυχής.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: No contexto, designa o povo judeu como grupo étnico-religioso no Egito, não apenas habitantes da Judeia.
