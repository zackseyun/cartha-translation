base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/049.yaml
  text: Considering that moment to be for them the final turn of life[a], the end of their most miserable expectation, they turned to pity and lamentation and kept kissing one another, embracing their relatives, falling upon their necks—parents upon children and mothers upon young daughters; and others, holding infant babies to their breasts[c][b], were drawing out their last milk.
translation:
  language: pt
  text: Julgando que aquele momento era para eles o último instante da vida, o fim de sua espera tão angustiante[a], cederam à compaixão e aos lamentos. Beijavam-se repetidamente, abraçavam seus parentes e lançavam-se ao pescoço uns dos outros[b] — pais aos filhos e mães às filhas jovens[c]. Outras, porém, tinham junto ao peito seus bebês recém-nascidos, que sugavam o leite pela última vez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o fim de sua expectativa tão angustiante”; o grego προσδοκία pode indicar expectativa, suspense ou espera pelo que está prestes a acontecer.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “caindo sobre os pescoços”; expressão grega para lançar-se ao abraço de alguém em aflição ou afeto.
    reason: cultural_note
  - marker: c
    text: Ou “às jovens mulheres”; a sequência de relações familiares favorece “às filhas jovens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστάτην βίου ῥοπὴν
  choice: o último instante da vida
  rationale: ῥοπή pode designar um momento decisivo ou ponto crítico; em português, “último instante da vida” comunica com naturalidade a iminência da morte, enquanto ὑστάτην preserva o caráter derradeiro.
- source_word: δόξαντες
  choice: Julgando
  rationale: O particípio expressa a percepção ou conclusão dos personagens diante da situação, sem afirmar que a morte realmente ocorreria.
- source_word: τὸ τέλος τῆς ἀθλιωτάτης προσδοκίας
  choice: o fim de sua espera tão angustiante
  rationale: προσδοκία admite “expectativa”, “espera” ou “antecipação”. No contexto da execução iminente, “espera angustiante” é idiomático e conserva a ideia de suspense penoso.
- source_word: εἰς οἶκτον καὶ γόους τραπέντες
  choice: entregaram-se à comiseração e aos lamentos
  rationale: οἶκτος indica compaixão ou comiseração diante do sofrimento, e γόοι, lamentos ou prantos. A formulação mantém distintos os dois elementos.
- source_word: κατεφίλουν
  choice: Beijavam-se repetidamente
  rationale: O imperfeito e a força intensiva do verbo retratam beijos insistentes e contínuos de despedida.
- source_word: περιπλεκόμενοι τοῖς συγγενέσιν
  choice: abraçavam seus parentes
  rationale: A tradução comunica de modo corrente o ato de envolver fisicamente os familiares em um abraço.
- source_word: ἐπὶ τοὺς τραχήλους ἐπιπίπτοντες
  choice: lançavam-se ao pescoço uns dos outros
  rationale: Preserva a imagem concreta do idioma grego, esclarecendo pela reciprocidade que se trata de um abraço emotivo.
- source_word: νεάνισιν
  choice: filhas jovens
  rationale: O termo pode significar “jovens mulheres”; na sequência de vínculos familiares, “filhas jovens” torna explícita a relação contextual sem apagar a alternativa lexical, registrada em nota.
- source_word: νεογνὰ ... βρέφη
  choice: bebês recém-nascidos
  rationale: A combinação dos dois termos enfatiza a tenra idade e vulnerabilidade das crianças; a expressão portuguesa é natural e preserva essa ênfase.
- source_word: τελευταῖον ἕλκοντα γάλα
  choice: sugavam o leite pela última vez
  rationale: ἕλκω descreve aqui o ato de extrair ou sugar leite do seio, e τελευταῖον indica que aquela mamada era tida como a última. A formulação é clara e emotivamente fiel.
