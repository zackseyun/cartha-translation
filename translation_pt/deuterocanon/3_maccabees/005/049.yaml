  to: Julgando que aquele momento era para eles o último instante da vida, o fim de sua espera tão angustiante[a], cederam à compaixão e aos lamentos. Beijavam-se repetidamente, abraçavam seus parentes e lançavam-se ao pescoço uns dos outros[b] — pais aos filhos e mães às filhas jovens[c]. Outras, porém, tinham junto ao peito seus bebês recém-nascidos, que sugavam o leite pela última vez.
