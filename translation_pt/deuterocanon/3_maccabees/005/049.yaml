translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com fluidez brasileira. A frase longa do grego foi dividida para facilitar a leitura sem alterar a progressão da cena. Mantiveram-se a intensidade do lamento, os abraços familiares e a imagem final da última amamentação.
