lexical_decisions:
- source_word: συνανακείμενοι
  choice: que estavam reclinados à mesa com ele
  rationale: Preserva a referência específica ao costume antigo de tomar a refeição reclinado, enquanto «à mesa» esclarece naturalmente o contexto para o leitor moderno.
- source_word: συγγενεῖς
  choice: parentes
  rationale: Equivalente moderno, claro e não arcaico para os membros da família ou parentela.
- source_word: ἄσταθη
  choice: instável
  rationale: Expressa o caráter vacilante ou inconstante da disposição mental descrita pelo grego, sem especificar uma causa.
- source_word: διάνοιαν
  choice: mente
  rationale: Mantém de modo conciso o sentido básico de faculdade ou disposição mental e permite que a combinação «mente instável» preserve a formulação grega.
- source_word: θαυμάζοντες
  choice: admirados
  rationale: Comunica espanto ou surpresa sem atribuir necessariamente aprovação, correspondendo à ambiguidade do particípio.
- source_word: προεφέροντο
  choice: continuavam dizendo
  rationale: Reflete o aspecto durativo ou reiterado do imperfeito e introduz com naturalidade a fala subsequente.
- source_word: τάδε
  choice: o seguinte
  rationale: Fórmula portuguesa natural que aponta prospectivamente para as palavras que vêm depois.
