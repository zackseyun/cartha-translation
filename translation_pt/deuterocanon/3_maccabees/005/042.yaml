  text: Ὅθεν ὁ κατὰ πάντα Φάλαρις βασιλεὺς ἐνπληθυνθεὶς ἀλογιστίας, καὶ τὰς γινομένας πρὸς ἐπισκοπὴν τῶν Ἰουδαίων ἐν αὐτῷ μεταβολὰς τῆς ψυχῆς παρ' οὐδὲν ἡγούμενος, ἀτελέστατον βεβαίως ὅρκον ὁρισάμενος τούτους μὲν ἀνυπερθέτως πέμψειν εἰς ἅιδην ἐν γόνασιν καὶ ποσὶν θηρίων ἠκισμένους,
