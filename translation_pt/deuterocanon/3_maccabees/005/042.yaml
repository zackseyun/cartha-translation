base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/042.yaml
  text: Therefore the king[a], a Phalaris in every way, filled with irrationality and counting as nothing the changes of soul occurring within him for oversight of the Jews, firmly setting an utterly unfulfillable oath, that he would without delay send these men to Hades, cruelly mangled in the knees and feet by beasts[c][b],
translation:
  language: pt
  text: 'Por isso, o rei, um verdadeiro Fálaris em todos os sentidos[a], tomado pela insensatez e não dando importância alguma às mudanças de ânimo que ocorriam nele a respeito da supervisão dos judeus[b], fez com toda a firmeza um juramento absolutamente impossível de cumprir: enviaria sem demora esses homens ao Hades[c], com os joelhos e os pés dilacerados pelas feras,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Fálaris foi um tirano da Sicília que se tornou proverbial por sua extrema crueldade; o texto compara o rei a ele.
    reason: cultural_note
  - marker: b
    text: Literalmente, “mudanças da alma”. A expressão indica mudanças interiores ou de disposição. O termo traduzido por “supervisão” também pode significar inspeção, visitação ou cuidado.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o mundo dos mortos; não necessariamente o “inferno” no sentido teológico posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Por isso
  rationale: Expressa de modo natural a conclusão inferencial que liga o versículo ao relato anterior.
- source_word: ὁ κατὰ πάντα Φάλαρις βασιλεὺς
  choice: o rei, um verdadeiro Fálaris em todos os sentidos
  rationale: Mantém a comparação histórica com Fálaris e comunica que o rei se assemelhava inteiramente ao tirano proverbial.
- source_word: ἐνπληθυνθεὶς ἀλογιστίας
  choice: tomado pela insensatez
  rationale: Reproduz o estado resultante expresso pelo particípio e o sentido de falta de razão ou juízo, em português corrente.
- source_word: τὰς ... μεταβολὰς τῆς ψυχῆς
  choice: as mudanças de ânimo
  rationale: Traduz o sentido interior e psicológico de ψυχή neste contexto sem sugerir alterações ontológicas da alma; a literalidade é registrada em nota.
- source_word: πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  choice: para a proteção dos judeus
  rationale: No contexto, ἐπισκοπή aponta para uma intervenção atenta em benefício dos judeus; 'proteção' torna clara essa orientação, embora a amplitude lexical seja preservada em nota.
- source_word: παρ' οὐδὲν ἡγούμενος
  choice: não dando importância alguma
  rationale: Equivalente idiomático da expressão que significa considerar algo sem valor ou relevância.
- source_word: ἀτελέστατον ... ὅρκον
  choice: um juramento absolutamente impossível de cumprir
  rationale: Preserva a força superlativa de ἀτελέστατον e a ironia narrativa de um juramento que não chegaria a ser executado, sem inverter o sentido para 'completo'.
- source_word: βεβαίως ὅρκον ὁρισάμενος
  choice: fez com toda a firmeza um juramento
  rationale: Expressa idiomaticamente tanto a determinação de fixar o juramento quanto a firmeza indicada por βεβαίως.
- source_word: ἀνυπερθέτως
  choice: sem demora
  rationale: Transmite a ideia de não adiar ou postergar.
- source_word: πέμψειν εἰς ἅιδην
  choice: enviaria ... ao Hades
  rationale: Conserva a imagem grega do domínio dos mortos e evita substituí-la por conceitos teológicos posteriores associados a 'inferno'.
- source_word: ἐν γόνασιν καὶ ποσὶν θηρίων ἠκισμένους
  choice: depois de terem os joelhos e os pés dilacerados pelas feras
  rationale: Torna explícita a relação temporal implícita do particípio perfeito e preserva as partes do corpo e a violência física da ação.
theological_decisions:
- issue: Sentido de ἅιδης na narrativa grega
  choice: Hades
  alternative: mundo dos mortos
  rationale: A transliteração preserva a cosmologia e a ambiguidade do texto grego, sem identificar automaticamente Hades com o inferno em sentido teológico posterior.
- issue: Sentido de πρὸς ἐπισκοπὴν τῶν Ἰουδαίων
  choice: para a proteção dos judeus
  alternative: com respeito à supervisão dos judeus
  rationale: O contexto narrativo favorece mudanças interiores que serviam à preservação dos judeus; a opção evita uma formulação administrativa obscura, enquanto a nota reconhece a amplitude do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente reorganizada para clareza, sem eliminar a longa progressão retórica do grego. A vírgula final foi mantida porque o versículo termina em construção sintaticamente continuada no texto-fonte.
