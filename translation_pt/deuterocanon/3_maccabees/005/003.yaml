  yaml_path: translation/deuterocanon/3_maccabees/005/003.yaml
  text: So the one who had been given these orders turned to feasting[a], gathering those of his friends and of the army who were most hostile toward the Jews.
translation:
  language: pt
  text: Então, aquele que havia recebido essas ordens voltou-se para o banquete[a], reunindo, dentre os seus amigos e as tropas, os que eram mais hostis aos judeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «entregou-se aos festejos».'
    reason: Alternativa lexical que ressalta εὐωχία como a atividade de festejar e comer, em vez do banquete como ocasião concreta.
lexical_decisions:
- source_word: ὁ ... προσταχθεὶς
  choice: aquele que havia recebido essas ordens
  rationale: O particípio articular identifica a pessoa anteriormente incumbida, e τάδε retoma as ordens mencionadas. A formulação preserva a voz passiva com naturalidade.
- source_word: ἐτρέπετο
  choice: voltou-se para
  rationale: O imperfeito médio descreve a pessoa dirigindo-se ou dedicando-se à atividade seguinte; «voltou-se para» conserva esse movimento sem explicitação excessiva.
- source_word: τὴν εὐωχίαν
  choice: o banquete
  rationale: O substantivo pode designar banquete, festejo ou ato de comer e beber festivamente. «O banquete» é digno, claro e preserva a forma nominal e definida do grego.
- source_word: συναγαγὼν
  choice: reunindo
  rationale: O particípio aoristo apresenta uma ação associada à principal; «reunindo» mantém fluidez em português sem impor uma sequência temporal rígida.
- source_word: τοὺς μάλιστα τῶν φίλων καὶ τῆς στρατιᾶς
  choice: dentre os seus amigos e as tropas, os que eram mais
  rationale: A construção seleciona, dos dois grupos — amigos e forças militares — aqueles que possuíam em maior grau a disposição descrita em seguida.
- source_word: ἀπεχθῶς ἔχοντας πρὸς τοὺς Ἰουδαίους
  choice: hostis aos judeus
  rationale: A expressão idiomática indica uma disposição de inimizade. «Hostis aos judeus» transmite diretamente essa força sem ampliá-la para uma afirmação psicológica mais específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível tanto no Brasil quanto em outros contextos lusófonos. «Tropas» evita a possível leitura de que toda a instituição militar foi reunida e concorda com a seleção de indivíduos expressa no grego.
