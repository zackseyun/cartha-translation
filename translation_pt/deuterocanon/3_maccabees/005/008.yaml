  text: to turn back the unholy plan against them[a], and to rescue them with a magnificent manifestation from the death ready at their feet.
translation:
  language: pt
  text: para reverter o plano ímpio contra eles e resgatá-los, por meio de uma manifestação majestosa[a], da morte iminente, já aos seus pés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um aparecimento glorioso” ou “uma intervenção majestosa”. A palavra grega ἐπιφάνεια pode indicar uma aparição marcante, frequentemente associada ao auxílio divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστρέψαι
  choice: reverter
  rationale: O infinitivo indica fazer o plano mudar de rumo ou desfazê-lo; “reverter” é claro e mantém a ideia de inversão.
- source_word: βουλὴν ἀνοσίαν
  choice: plano ímpio
  rationale: “Plano” comunica a intenção hostil, e “ímpio” preserva tanto a censura moral quanto a dimensão de afronta a Deus presente em ἀνοσίαν.
- source_word: ῥύσασθαι
  choice: resgatá-los
  rationale: O verbo expressa livramento de perigo imediato; “resgatar” é natural em português e adequado diante da morte iminente.
- source_word: μεγαλομεροῦς ἐπιφανείας
  choice: por meio de uma manifestação majestosa
  rationale: “Manifestação” conserva a linguagem de aparecimento ou intervenção notável de ἐπιφάνεια sem definir seu mecanismo; “majestosa” exprime a grandeza indicada por μεγαλομεροῦς.
- source_word: μόρου
  choice: morte
  rationale: Embora μόρος também possa significar destino funesto ou ruína, o contexto apresenta concretamente uma ameaça de morte.
- source_word: παρὰ πόδας ἐν ἑτοίμῳ
  choice: já pronta aos seus pés
  rationale: A formulação preserva a imagem espacial vívida e comunica que a morte estava preparada e era iminente.
theological_decisions:
- issue: Natureza de ἐπιφάνεια no contexto
  choice: manifestação majestosa
  alternative: aparecimento glorioso; intervenção majestosa
  rationale: A expressão aponta para uma intervenção divina marcante. “Manifestação” preserva a linguagem de aparecimento sem importar um sentido doutrinário técnico nem especificar como ocorreu o livramento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o caráter de continuação sintática do versículo e conserva a imagem concreta da morte pronta “aos seus pés”.
