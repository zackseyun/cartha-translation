  text: Hermon, porém, o comandante dos elefantes[a], cumpria com exatidão[b] a ordem recebida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o elefantarca” ou “o oficial encarregado dos elefantes”.
