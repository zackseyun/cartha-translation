lexical_decisions:
- source_word: ἐλεφαντάρχης
  choice: comandante dos elefantes
  rationale: O composto grego designa o oficial encarregado dos elefantes. A expressão é clara em português atual e preserva a função militar específica.
- source_word: τὸ προσταγὲν
  choice: a ordem recebida
  rationale: O particípio passivo substantivado significa literalmente “aquilo que havia sido ordenado”. “A ordem recebida” expressa isso de modo natural, sem rigidez desnecessária.
- source_word: ἀραρότως
  choice: com exatidão
  rationale: O advérbio pode indicar firmeza, adequação ou precisão. No contexto da execução de uma ordem, “com exatidão” comunica seu cumprimento preciso, preservando em nota outras nuances possíveis.
- source_word: συνετέλει
  choice: cumpria
  rationale: O verbo indica levar uma ação até sua realização. O imperfeito “cumpria” preserva o aspecto durativo do grego e se combina naturalmente com “ordem”.
- source_word: Ἕρμων
  choice: Hermon
  rationale: Transliteração simples do nome pessoal grego, em forma legível para o público de língua portuguesa.
