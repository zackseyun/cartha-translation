  yaml_path: translation/deuterocanon/3_maccabees/005/005.yaml
  text: And in addition[a], the attendants, going out at evening, bound the hands of those who were suffering, and contrived the rest of the nighttime security concerning them[b], thinking that they would together bring the race to the end of destruction.
translation:
  language: pt
  text: Além disso, ao cair da tarde, os encarregados saíam, amarravam as mãos dos aflitos e tomavam as demais medidas de segurança para a noite em relação a eles, julgando que, de uma só vez, levariam todo o povo[a] ao fim da destruição.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a nação” ou “a raça”. O termo grego φῦλον refere-se aqui ao povo judeu como um todo.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega inclui o verbo “receber” ou “tomar” e, de modo compacto, “o fim” ou “a consumação da destruição”. A construção pode também sugerir que eles esperavam entregar o povo à destruição completa.
    reason: textual_ambiguity
lexical_decisions:
- source_word: οἵ τε πρὸς τούτοις λειτουργοὶ
  choice: Além disso, ... os encarregados
  rationale: λειτουργοί designa aqui agentes que executavam uma tarefa sob autoridade, não ministros de culto. “Encarregados” evita conotação eclesiástica; πρὸς τούτοις é entendido como expressão aditiva.
- source_word: κατὰ τὴν ἑσπέραν ἐξιόντες
  choice: ao cair da tarde, ... saíam
  rationale: Expressa com naturalidade a circunstância temporal e o particípio ἐξιόντες, sem tornar a frase excessivamente literal.
- source_word: τὰς τῶν ταλαιπωρουμένων ... χεῖρας
  choice: as mãos dos aflitos
  rationale: ταλαιπωρουμένων descreve pessoas submetidas a sofrimento e miséria; “aflitos” é conciso, digno e adequado ao contexto.
- source_word: ἐδέσμευον
  choice: amarravam
  rationale: O imperfeito indica ação em andamento ou repetida; “amarravam” traduz diretamente o ato de prender as mãos.
- source_word: τὴν τε λοιπὴν ἐμηχανῶντο περὶ αὐτοὺς ἀσφάλειαν ἔννυχον
  choice: planejavam as demais medidas para mantê-los sob guarda durante a noite
  rationale: A expressão grega é compacta e indica a preparação intencional de segurança adicional em torno dos presos durante a noite. A formulação portuguesa explicita apenas o necessário para ser compreensível.
- source_word: δοξαντες
  choice: supondo
  rationale: Introduz a expectativa ou convicção dos agentes, sem afirmar que o resultado efetivamente ocorreria.
- source_word: ὁμοῦ
  choice: de uma só vez
  rationale: No contexto, indica que o destino coletivo do grupo seria consumado conjuntamente; a formulação preserva a ideia de simultaneidade.
- source_word: τὸ φύλον
  choice: o povo inteiro
  rationale: φῦλον refere-se coletivamente ao povo judeu. “Povo” é mais natural e menos sujeito a sentidos modernos inadequados do que “raça”; “inteiro” torna explícita a abrangência coletiva sugerida pelo contexto e por ὁμοῦ.
- source_word: λήμψεσθαι ... πέρας τῆς ὀλεθρίας
  choice: chegaria ... ao termo da destruição
  rationale: A construção é incomum e admite alguma incerteza sintática. “Chegar ao termo” representa a ideia de atingir a consumação ou desfecho da ruína, sem reduzir a expressão simplesmente a “ser destruído”.
theological_decisions:
- issue: Referência coletiva de τὸ φύλον
  choice: o povo inteiro
  alternative: a nação inteira; a raça inteira
  rationale: O termo identifica corporativamente o povo judeu visado. “Povo” preserva o sentido étnico-coletivo sem introduzir as associações modernas de “raça”; a nota registra alternativas legítimas.
- issue: Sentido da cláusula λήμψεσθαι τὸ φύλον πέρας τῆς ὀλεθρίας
  choice: o povo inteiro chegaria ... ao termo da destruição
  alternative: levariam o povo ao fim da destruição; o povo sofreria destruição completa
  rationale: A sintaxe permite mais de uma análise. A tradução mantém o povo como sujeito lógico da oração infinitiva e conserva a imagem do “termo” ou consumação da destruição, evitando resolver silenciosamente a tensão da construção.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “encarregados” em vez de um termo cultual, preserva o aspecto narrativo dos imperfeitos e mantém em nota a ambiguidade da cláusula final.
