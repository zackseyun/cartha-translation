  yaml_path: translation/deuterocanon/3_maccabees/005/043.yaml
  text: But if he should campaign against Judea[a], he would quickly make it level with fire and spear, and after burning their sanctuary—untrodden by us[b]—with fire, he would put a stop forever to those who perform sacrifice there.
translation:
  language: pt
  text: Mas, se ele empreendesse uma campanha contra a Judeia, rapidamente a deixaria arrasada com fogo e lança; e, depois de rapidamente incendiar com fogo o santuário deles — inacessível para nós[b] —, poria fim para sempre aos que ali realizam sacrifícios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma grega traduzida por “incendiar” apresenta pequena incerteza na transcrição de Swete, mas o sentido de atear fogo é claro.
    reason: textual_variant
  - marker: b
    text: O grego ἄβατον significa literalmente “não pisável” ou “onde não se pode entrar”; também pode ser traduzido por “vedado para nós” ou “onde não nos é permitido pôr os pés”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρατεύσαντα
  choice: se ele empreendesse uma campanha contra
  rationale: O particípio pertence ao discurso reportado e descreve uma ação militar cogitada. A construção condicional produz português natural sem reduzir a ação a uma única batalha.
- source_word: ἰσόπεδον ... στήσεσθαι
  choice: a deixaria arrasada
  rationale: A expressão indica reduzir a Judeia a uma condição plana ou nivelada. “Deixaria arrasada” comunica idiomaticamente a devastação e o resultado, sem recorrer a uma formulação artificial.
- source_word: πυρὶ καὶ δόρατι
  choice: com fogo e lança
  rationale: Mantém os dois instrumentos concretos da devastação e traduz δόρατι como “lança”, sem substituí-lo pela expressão convencional “fogo e espada”.
- source_word: διὰ τάχους / ἐν τάχει
  choice: rapidamente / rapidamente
  rationale: As duas expressões de rapidez foram preservadas, pois o grego enfatiza a prontidão tanto da devastação da Judeia quanto do incêndio do santuário.
- source_word: ναόν
  choice: santuário
  rationale: ναός pode designar mais especificamente o edifício sagrado ou santuário, em contraste com todo o complexo do templo; o contexto de acesso restrito favorece essa precisão.
- source_word: ἄβατον ἡμῖν
  choice: inacessível para nós
  rationale: É uma formulação portuguesa natural para aquilo em que não se pode entrar ou pisar, preservando a perspectiva em primeira pessoa dos estrangeiros.
- source_word: πρήσαντα
  choice: depois de ... incendiar
  rationale: Expressa claramente a ação de atear fogo indicada pelo particípio, ao mesmo tempo que a nota registra a pequena incerteza material da transcrição.
- source_word: τῶν συντελούντων ἐκεῖ θυσίαν
  choice: aos que ali realizam sacrifícios
  rationale: Mantém o sentido concreto de executar ou levar a cabo o serviço sacrificial, sem acrescentar uma identificação sacerdotal não explícita.
- source_word: εἰς τὸν ἅπαντα χρόνον καταστήσειν
  choice: poria fim para sempre
  rationale: Comunica de modo claro e atual a cessação permanente expressa pelo idioma grego.
theological_decisions:
- issue: Referência da primeira pessoa do plural em ἄβατον ἡμῖν
  choice: “inacessível para nós”, mantendo a perspectiva do falante e de seu grupo
  alternative: “onde não nos é permitido pôr os pés” ou “vedado a nós”
  rationale: A tradução conserva a separação entre os estrangeiros e o santuário judaico sem definir se a inacessibilidade é principalmente ritual, jurídica ou física.
- issue: Alcance de ναός
  choice: santuário
  alternative: templo
  rationale: “Santuário” preserva a possível referência ao edifício sagrado propriamente dito, sem transformar essa precisão lexical em afirmação doutrinária.
- issue: Valor sintático da sequência participial no discurso reportado
  choice: 'construção condicional: “se ele empreendesse...”'
  alternative: 'sequência temporal: “depois de marchar contra...”'
  rationale: A construção adotada segue o caráter de ação projetada no contexto reportado, mas evita acrescentar certeza histórica à ameaça descrita.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem da frase preserva a ameaça militar, as duas referências à rapidez e a repetição do fogo, enquanto “fogo e lança” evita substituir a imagem específica do original por um clichê português.
