  text: But the age-old ordinance of time[a], beautifully alternating in night and day by the One who grants sleep to all, to whomever he himself wills, sent a portion of sleep upon the king[b];
translation:
  language: pt
  text: Mas a antiga ordem criada do tempo[a], que sobrevém belamente entre noite e dia, por aquele que concede sono a todos aqueles a quem ele mesmo o quer conceder, enviou ao rei uma porção de sono[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a criação do tempo desde tempos antigos”. A expressão grega é poética e compacta e descreve a ordem criada e há muito estabelecida do tempo, manifesta na noite e no dia.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “enviou uma porção de sono para dentro do rei” ou “ao rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... ἀπʼ αἰῶνος κτίσμα χρόνου
  choice: a antiga ordem criada do tempo
  rationale: κτίσμα designa algo criado; ligado a χρόνου e ao ritmo de noite e dia, aponta para a ordem criada do tempo. “Antiga” comunica a longa duração de ἀπʼ αἰῶνος sem impor a ideia metafísica mais forte de eternidade.
- source_word: καλὸν ἐν νυκτὶ καὶ ἡμέρᾳ ἐπιβαλλόμενον
  choice: que sobrevém belamente na noite e no dia
  rationale: “Sobrevém” conserva o movimento sugerido por ἐπιβαλλόμενον, enquanto “belamente” retém a força estética de καλόν sem reduzir a expressão a uma alternância técnica.
- source_word: ὑπὸ τοῦ χαριζομένου πᾶσιν, οἷς ἂν αὐτὸς θελήσῃ
  choice: por ação daquele que concede o sono a todos a quem ele mesmo quiser
  rationale: A construção passiva ὑπό indica a atuação do doador. O objeto “sono”, expresso logo depois, é explicitado em português para tornar inteligível a oração; “ele mesmo” preserva a ênfase de αὐτός.
- source_word: ὕπνον μέρος
  choice: uma porção de sono
  rationale: Mantém a imagem concreta de μέρος, “parte” ou “porção”, em vez de nivelá-la simplesmente para “algum sono”.
- source_word: ἀπέστειλεν εἰς τὸν βασιλέα
  choice: enviou ao rei
  rationale: Reproduz diretamente a ação de enviar e verte εἰς de modo idiomático em português, sem alterar a personificação poética da ordem do tempo.
theological_decisions:
- issue: Referência implícita a Deus em τοῦ χαριζομένου πᾶσιν
  choice: daquele que concede o sono a todos
  alternative: daquele que concede graciosamente a todos
  rationale: O contexto identifica o doador como Deus e o sono como aquilo que ele concede, mas a tradução evita acrescentar um título divino ausente do grego.
- issue: Sentido temporal de ἀπʼ αἰῶνος
  choice: antiga
  alternative: desde a eternidade
  rationale: A opção expressa antiguidade e longa duração sem transformar a frase poética numa afirmação doutrinária inequívoca sobre eternidade metafísica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura poética preservada. “Ordem criada” evita que “criação do tempo” seja entendida apenas como o ato inicial de criar, e as notas registram as alternativas literais e a compactação do grego.
