  yaml_path: translation/deuterocanon/3_maccabees/005/050.yaml
  text: Yet nevertheless[a], when they also saw the help from heaven that had come to them before, they all together threw themselves down face-first, and separated the infants from the breasts[b],
translation:
  language: pt
  text: Contudo, ao perceberem também os socorros que antes lhes haviam vindo do céu, todos juntos se lançaram com o rosto em terra e afastaram do peito os bebês que mamavam,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “separaram os bebês dos peitos”, isto é, interromperam a amamentação.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴν δὲ ἀλλὰ καὶ
  choice: Contudo ... também
  rationale: Reproduz a forte transição adversativa e mantém o valor aditivo de καί sem criar uma redundância pouco natural em português.
- source_word: τὰς ἔμπροσθεν αὐτῶν γεγενημένας ἀντιλήψεις
  choice: os socorros que antes lhes haviam vindo
  rationale: O plural ἀντιλήψεις indica atos de auxílio ou socorro; a formulação conserva tanto a pluralidade quanto a referência retrospectiva e o benefício recebido por eles.
- source_word: ἐξ οὐρανοῦ
  choice: do céu
  rationale: Mantém literalmente o idioma grego, que sugere auxílio divino sem explicitar um agente que o texto não nomeia.
- source_word: συνιδόντες
  choice: ao perceberem
  rationale: O verbo pode envolver não apenas visão, mas reconhecimento ou compreensão conjunta; 'perceberem' comunica esse sentido no contexto.
- source_word: πρηνεῖς ὁμοθυμαδὸν ῥίψαντες ἑαυτούς
  choice: todos juntos se lançaram com o rosto em terra
  rationale: Preserva a ação unânime, sua intensidade reflexiva e a postura prostrada, em português natural e vívido.
- source_word: τὰ νήπια χωρίσαντες τῶν μαστῶν
  choice: afastaram do peito os bebês que mamavam
  rationale: Torna claro o contexto de amamentação sem acrescentar explicitamente 'das mães'; 'bebês' corresponde naturalmente a νήπια neste contexto.
theological_decisions:
- issue: Se o auxílio celestial deve ser identificado explicitamente como ação de Deus
  choice: do céu
  alternative: de Deus / do Senhor no céu
  rationale: O grego diz apenas ἐξ οὐρανοῦ. A tradução preserva a alusão reverente à intervenção divina sem inserir um nome ou título ausente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando a longa sequência participial e a vírgula final do fragmento versicular.
