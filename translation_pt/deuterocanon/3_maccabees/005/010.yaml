base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/010.yaml
  text: But Hermon[a], after giving the savage elephants drink, with them filled from the abundant supply of wine and saturated with frankincense[b], came early in the morning to the court to report these things to the king.
translation:
  language: pt
  text: Mas Hermom, depois de dar de beber aos elefantes ferozes[a], deixando-os cheios da abundante provisão de vinho e impregnados de olíbano[b], chegou de manhã cedo à corte para relatar essas coisas ao rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cruéis” ou “impiedosos”. O adjetivo grego pode salientar uma ferocidade sem piedade.
    reason: lexical_alternative
  - marker: b
    text: “Olíbano” é a resina aromática também conhecida como franquincenso; o termo grego é específico, não uma designação genérica para qualquer incenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηλεῖς
  choice: ferozes
  rationale: O adjetivo indica ferocidade cruel ou impiedosa. “Ferozes” é natural em português para animais perigosos, enquanto a nota preserva a nuança de ausência de piedade.
- source_word: ποτίσας
  choice: depois de dar de beber
  rationale: O particípio indica uma ação anterior pela qual Hermom fez os elefantes beberem; a formulação é clara e idiomática em português.
- source_word: πεπληρωμένους τῆς τοῦ οἴνου πολλῆς χορηγίας
  choice: deixando-os cheios da abundante provisão de vinho
  rationale: A expressão conserva tanto a grande quantidade de vinho quanto a ideia de provisão presente em χορηγία, e o pronome esclarece que os elefantes, não Hermom, ficaram cheios.
- source_word: τοῦ λιβάνου μεμεστωμένους
  choice: impregnados de olíbano
  rationale: λίβανος designa especificamente o olíbano, e “impregnados” comunica que os elefantes ficaram intensamente tomados por essa substância ou seu aroma.
- source_word: ὄρθριος
  choice: de manhã cedo
  rationale: Expressa com naturalidade a chegada nas primeiras horas da manhã sem precisar determinar um horário exato.
- source_word: αὐλήν
  choice: corte
  rationale: No contexto régio, αὐλή pode designar a corte ou o recinto palaciano; “corte” preserva essa amplitude melhor que “pátio”.
- source_word: προσαγγεῖλαι
  choice: para relatar
  rationale: O infinitivo exprime a finalidade da chegada de Hermom e se ajusta ao caráter oficial da comunicação ao rei.
