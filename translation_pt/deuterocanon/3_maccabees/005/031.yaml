revisions:
- from: Todos os pais que estavam presentes, ou os descendentes dos filhos[a], prepararam este farto banquete para as feras selvagens, em lugar dos judeus, que se mostraram irrepreensíveis diante de mim e de meus antepassados; pois tenho neles plena e firme confiança[b].
  to: Todos os pais que ali estavam, ou os descendentes dos filhos[a], prepararam este farto banquete para as feras selvagens, em lugar dos judeus, que foram comprovados diante de mim e de meus antepassados como irrepreensíveis; pois tenho neles confiança plena e firme[b].
  rationale: A revisão conserva a ambiguidade genealógica e a disjunção «ou» da tradição grega, mas torna mais exato o perfeito ἀποδεδειγμένων e deixa inequívoco, tanto no texto quanto na nota, que o particípio ἔχων atribui a confiança ao locutor. As escolhas lexicais mantêm o registro solene e a legibilidade em português contemporâneo.
