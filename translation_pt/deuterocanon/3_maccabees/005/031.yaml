base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/031.yaml
  text: All the parents who were present[a], and the children with them, have prepared this lavish feast for the wild beasts, instead of the Jews[b], who have been shown to me and to my forefathers to possess complete and steadfast faithfulness beyond reproach.
translation:
  language: pt
  text: Todos os pais que ali estavam, ou os descendentes dos filhos[a], prepararam este farto banquete para as feras selvagens, em lugar dos judeus, que foram comprovados diante de mim e de meus antepassados como irrepreensíveis; pois tenho neles confiança plena e firme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é incomum e de sentido incerto; pode referir-se amplamente aos filhos ou descendentes presentes com os pais.
    reason: lexical_alternative
  - marker: b
    text: Ou «fé plena e firme». O grego indica que o locutor tem essa confiança nos judeus; neste contexto, ela parece referir-se à confiança baseada na fidelidade comprovada deles, e não especificamente à fé religiosa.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅσοι γονεῖς παρῆσαν
  choice: Todos os pais que estavam presentes
  rationale: Ὅσοι abrange a totalidade do grupo em vista, e παρῆσαν indica presença no local. A formulação é clara e natural em português.
- source_word: ἢ παίδων γόνοι
  choice: ou os descendentes dos filhos
  rationale: Mantém o valor disjuntivo de ἢ e preserva a expressão grega incomum, sem definir indevidamente o parentesco exato.
- source_word: θηρσὶν ἀγρίοις
  choice: para as feras selvagens
  rationale: O dativo indica destinação; a escolha conserva o tom elevado e ameaçador do contexto.
- source_word: δαψιλῆ θοῖναν
  choice: este farto banquete
  rationale: δαψιλής denota abundância, e θοίνη uma refeição festiva ou banquete. A expressão mantém a ironia sombria de pessoas servindo de alimento aos animais.
- source_word: ἀντὶ τῶν ... Ἰουδαίων
  choice: em lugar dos judeus
  rationale: 'ἀντί expressa substituição: outros acabaram destinados às feras no lugar dos judeus.'
- source_word: ἀνεγκλήτων ... ἀποδεδειγμένων
  choice: que se mostraram irrepreensíveis
  rationale: A formulação comunica o resultado comprovado expresso pelo particípio perfeito e o sentido forense de ἀνέγκλητος, isto é, sem acusação válida.
- source_word: ὁλοσχερῆ βεβαίαν πίστιν ἔχων
  choice: pois tenho neles plena e firme confiança
  rationale: ἔχων está no nominativo singular e, portanto, descreve o locutor, não os judeus. πίστις designa aqui confiança baseada na fidelidade já demonstrada; 'plena e firme' representa ὁλοσχερῆ e βεβαίαν.
theological_decisions:
- issue: Sentido e sujeito de πίστις em contexto político
  choice: pois tenho neles plena e firme confiança
  alternative: que possuem fidelidade completa e constante
  rationale: O particípio ἔχων é nominativo singular e aponta para o locutor como aquele que tem πίστις. Neste contexto, πίστις é confiança nos judeus em razão de sua conduta comprovada, sem impor o sentido doutrinário posterior de fé religiosa.
- issue: Relação expressa por ἢ em ἢ παίδων γόνοι
  choice: ou os descendentes dos filhos
  alternative: e os filhos que estavam com eles
  rationale: O texto grego traz ἢ, normalmente 'ou', e a expressão παίδων γόνοι é difícil. A tradução preserva a disjunção e deixa a amplitude genealógica indicada pelo original, com esclarecimento em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a construção disjuntiva e a dificuldade genealógica do grego, mas esclarece a sintaxe de ἔχων para não atribuir aos judeus um particípio que gramaticalmente se refere ao locutor.
