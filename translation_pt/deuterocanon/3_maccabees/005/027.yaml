base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/005/027.yaml
  text: But when he had accepted it and was struck with astonishment at the lawless outcome[a], being in every way overcome by ignorance[b], he kept asking whether what had been decreed had indeed been carried out for him with urgency.
translation:
  language: pt
  text: Mas, depois de receber isso e ficar atônito com aquele desfecho contrário à lei[a], inteiramente dominado pela ignorância, ele perguntava repetidamente se aquilo que havia sido determinado[b] tinha de fato sido cumprido para ele, com urgência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resultado contrário à lei” ou, mais literalmente, “saída contrária à lei”. O termo grego traduzido por “desfecho” também pode significar literalmente “saída”, embora aqui provavelmente se refira ao resultado dos acontecimentos.
    reason: lexical_alternative
  - marker: b
    text: Ou “aquilo que havia sido registrado por escrito” ou “a ordem que havia sido emitida”. O grego pode referir-se especificamente a uma determinação escrita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποδεξαμένου
  choice: depois de aceitar isso
  rationale: O particípio aoristo médio de ἀποδέχομαι pode indicar receber, acolher ou aceitar. “Aceitar isso” conserva a amplitude do verbo sem pressupor uma aprovação formal.
- source_word: καταπλαγέντος
  choice: ficar atônito
  rationale: Expressa o forte espanto e o caráter passivo da reação, em português natural.
- source_word: ἀνόμῳ ἐξόδῳ
  choice: diante daquele desfecho contrário à lei
  rationale: ἄνομος indica o que é contrário à lei; ἔξοδος pode significar saída, resultado ou desfecho. Neste contexto narrativo, “desfecho” comunica melhor a provável referência ao resultado chocante, sem ocultar a alternativa lexical em nota.
- source_word: κατὰ πάντα ἀγνωσίᾳ κεκρατημένος
  choice: completamente dominado pela falta de conhecimento
  rationale: κατὰ πάντα intensifica a condição, enquanto o perfeito passivo de κρατέω com ἀγνωσία retrata alguém sob o domínio da ignorância ou falta de conhecimento. A formulação evita converter o termo, sem aviso, em mera confusão emocional.
- source_word: ἐπυνθάνετο
  choice: perguntava repetidamente
  rationale: O imperfeito de πυνθάνομαι sugere uma indagação contínua ou reiterada.
- source_word: τὸ διαγραμμένον
  choice: aquilo que havia sido determinado
  rationale: O particípio perfeito pode designar algo registrado por escrito e, em contexto administrativo, uma ordem ou decreto. “Determinado” mantém a referência oficial sem exigir que o texto explicite aqui a forma escrita.
- source_word: ἔτι
  choice: de fato já
  rationale: A combinação preserva a força confirmatória adotada no contexto e também uma possível nuance temporal de ἔτι, sem tornar a frase artificial.
- source_word: μετὰ σπουδῆς
  choice: com urgência
  rationale: σπουδή pode expressar pressa, empenho ou diligência; no cumprimento de uma ordem real, “com urgência” reúne velocidade e seriedade.
- source_word: τετέλεσται
  choice: tinha sido cumprido
  rationale: O perfeito passivo de τελέω indica que algo foi levado a termo. “Cumprido” combina naturalmente com uma determinação e evita a ambiguidade de “executado”.
