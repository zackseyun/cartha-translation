  text: Then the king[a], having arranged the whole banquet according to the same rules, urged them to turn to rejoicing.
translation:
  language: pt
  text: Depois de organizar todo o banquete segundo as mesmas normas[a], o rei os incentivava a se voltarem para a alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as mesmas leis”. A palavra grega νόμοι pode designar leis, normas ou regulamentos costumeiros; neste contexto de banquete, o sentido de procedimento parece mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ τοὺς αὐτοὺς νόμους
  choice: segundo as mesmas normas
  rationale: κατά com o acusativo indica conformidade. Neste contexto de organização de um banquete, “normas” comunica melhor prescrições ou procedimentos do que o termo mais estritamente jurídico “leis”, sem eliminar essa possibilidade lexical.
- source_word: συστησάμενος
  choice: depois de organizar
  rationale: O particípio aoristo indica uma ação anterior à exortação do rei. A construção temporal é natural em português e preserva essa sequência.
- source_word: πᾶν τὸ συμπόσιον
  choice: todo o banquete
  rationale: συμπόσιον designa um banquete ou festa com bebida; “banquete” é claro e digno, e “todo” representa πᾶν.
- source_word: εἰς εὐφροσύνην τραπῆναι
  choice: a se voltarem para a alegria
  rationale: A formulação conserva tanto o movimento figurado de τρέπω quanto a direção expressa por εἰς. “Alegria” traduz εὐφροσύνη de modo corrente sem restringi-la apenas à diversão ruidosa.
- source_word: παρεκάλει
  choice: os incentivava
  rationale: O imperfeito descreve a ação do rei em curso, e παρακαλέω, no ambiente festivo, expressa encorajamento ou insistência. O pronome “os” explicita em português o objeto subentendido no grego.
