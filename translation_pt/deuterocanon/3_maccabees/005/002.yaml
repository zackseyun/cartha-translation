  text: He ordered that[a], by the coming day, all the elephants—five hundred in number—be given drink with generous draughts of frankincense and much unmixed wine, and that, once made savage by the abundant supply of drink, they be brought in for the destruction of the Jews.
translation:
  language: pt
  text: Ordenou que, para o dia seguinte, dessem a todos os elefantes — quinhentos ao todo — generosas porções de olíbano e muito vinho não diluído e que, depois de os enfurecerem com a abundante provisão de bebida, os conduzissem para a destruição dos judeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «para um encontro com a ruína/morte dos judeus». A expressão incomum indica a destruição ou morte que se pretendia infligir-lhes.
    reason: Preserva a formulação incomum de πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων e a amplitude semântica de μόρος.
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: Ordenou
  rationale: Expressa diretamente a ordem autoritativa do aoristo de κελεύω, em português natural e digno.
- source_word: ὑπὸ τὴν ἐρχομένην ἡμέραν
  choice: até o dia seguinte
  rationale: Comunica de modo idiomático o limite temporal voltado para o dia que se aproximava.
- source_word: δαψιλέσι δράκεσι λιβανωτοῦ
  choice: generosas porções de olíbano
  rationale: δαψιλέσι indica abundância; δράκεσι designa porções ou punhados, e λιβανωτός é especificamente olíbano. «Porções» evita sugerir que o olíbano fosse, por si só, um gole líquido.
- source_word: οἴνῳ πλείονι ἀκράτῳ
  choice: muito vinho não diluído
  rationale: Preserva tanto a grande quantidade quanto o dado culturalmente significativo de que o vinho não seria misturado com água.
- source_word: ἅπαντας τοὺς ἐλέφαντας ... πεντακοσίους
  choice: todos os elefantes — quinhentos ao todo —
  rationale: Mantém a totalidade e a informação parentética do número em formulação fluente.
- source_word: ἀγριωθέντας
  choice: quando estivessem enfurecidos
  rationale: O particípio passivo descreve os animais levados a um estado feroz; «enfurecidos» é natural no contexto sem perder a ideia de ferocidade induzida.
- source_word: τῇ τοῦ πόματος ἀφθόνῳ χορηγίᾳ
  choice: pela abundância da bebida
  rationale: Reproduz a relação causal e a provisão copiosa, evitando uma repetição pesada de «fornecimento abundante».
- source_word: εἰσαγαγεῖν
  choice: deveriam conduzi-los
  rationale: Retoma o conteúdo da ordem e indica que os elefantes seriam levados ao local da execução.
- source_word: πρὸς συνάντησιν τοῦ μόρου τῶν Ἰουδαίων
  choice: para a destruição dos judeus
  rationale: Comunica o resultado letal pretendido no contexto, enquanto a nota conserva a construção grega incomum e a amplitude de μόρος.
theological_decisions:
- issue: Sentido da expressão τοῦ μόρου em um contexto de execução coletiva
  choice: para a destruição dos judeus
  alternative: ao encontro do destino fatal dos judeus / para a morte dos judeus
  rationale: μόρος pode designar morte, ruína ou destino fatal. O contexto torna clara a intenção letal, mas a nota preserva a forma comprimida e pouco usual da expressão grega sem lhe impor uma nuance doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. «Olíbano» mantém a precisão lexical; a sintaxe foi levemente reorganizada para evitar ambiguidades sobre os elefantes e sobre a sequência da ordem.
