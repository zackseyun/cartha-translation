  - severity: medium
    issue: “Celebrando por bastante tempo” torna γεραιρομένους uma celebração ativa da ocasião e omite a nuance de tê-la em honra.
    rationale: γεραιρόω expressa honrar, estimar ou tratar com veneração; “honrando havia muito” preserva melhor o valor lexical e a relação do particípio com os destinatários de παρῄνει.
