  source_fidelity: O rascunho acerta a sequência temporal inicial, o sentido festivo de εὐωχία e a força de καταθέσθαι ... εἰς εὐφροσύνην. Contudo, desloca τὸ παρὸν τῆς συμποσίας ἐπὶ πολὺ γεραιρομένους para uma oração de “celebrar” a ocasião e faz de μέρος uma porção nova a ser reservada. No grego, o mesmo referente — a presente ocasião/parte do banquete — é o que se descreve como honrado por longo tempo e o que se destina à alegria. A redação revista conserva essa ligação, sem resolver além do necessário a construção compacta.
  naturalness: “Instou” é natural em registro narrativo elevado e internacional. “A presente ocasião do banquete” é um pouco formal, mas claro e próximo do grego; o pronome “a” evita repetição e mantém a coesão sintática.
  terminology: “Banquete”, “honrado” e “alegria” correspondem adequadamente a συμποσία, γεραιρόω e εὐφροσύνη. “Destinar ... à alegria” transmite bem a expressão idiomática καταθέσθαι μέρος εἰς εὐφροσύνην, cuja imagem de ‘parte’ é explicitada na nota.
