  text: And when this had happened, he urged them, having given themselves over to feasting, to devote the present occasion of the banquet, long honored, to gladness.
translation:
  language: pt
  text: E, quando isso aconteceu, ele os instou, enquanto se entregavam ao banquete e honravam havia muito a presente ocasião do banquete, a destiná-la à alegria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a separar a presente parte do banquete para a alegria”. A expressão grega καταθέσθαι μέρος é condensada e pode indicar separar, designar ou destinar uma parte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ δὲ καὶ γενομένου
  choice: E, depois que isso aconteceu
  rationale: Expressa a sequência temporal de um acontecimento já concluído sem especificar além do grego a que “isso” se refere.
- source_word: παρῄνει
  choice: ele os incentivou
  rationale: O verbo indica aconselhar ou instar. “Incentivou” preserva o tom de encorajamento no contexto festivo sem adquirir a conotação religiosa que “exortou” pode ter no português corrente.
- source_word: εἰς εὐωχίαν δόντας ἑαυτούς
  choice: a se entregarem ao banquete
  rationale: Reproduz a ideia reflexiva de dedicar-se à comida e à celebração, sem sugerir necessariamente excesso ou devassidão.
- source_word: τὸ παρὸν τῆς συμποσίας
  choice: aquela ocasião festiva
  rationale: τὸ παρόν aponta para a ocasião então presente, e συμποσία designa o convívio de banquete, com comida, bebida e celebração. A formulação evita a rigidez de “o presente do banquete”.
- source_word: ἐπὶ πολὺ γεραιρομένους
  choice: celebrando por bastante tempo
  rationale: O particípio acusativo masculino plural se refere às pessoas incentivadas, não à ocasião neutra singular. γεραιρόω traz a noção de honrar ou celebrar, e ἐπὶ πολὺ pode ter força durativa.
- source_word: εἰς εὐφροσύνην καταθέσθαι μέρος
  choice: a reservarem uma parte para a alegria
  rationale: Mantém μέρος de modo explícito e traduz a expressão condensada καταθέσθαι μέρος como separar ou destinar uma parte, preservando a finalidade indicada por εἰς εὐφροσύνην.
