  yaml_path: translation/deuterocanon/3_maccabees/001/033.yaml
  text: They had been instructed to obtain support[a], and they loathed those who withdrew from them, judging them as enemies of the nation[b], and depriving them of common association and serviceability.
translation:
  language: pt
  text: Tinham sido instruídos a obter apoio[a]; detestavam os que se afastavam deles, julgavam-nos inimigos da nação e os privavam do convívio comum e da utilidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ajuda” ou “assistência”.
    reason: lexical_alternative
  - marker: b
    text: A expressão indica exclusão das relações sociais habituais e da participação útil ou benéfica na vida da comunidade; o sentido exato de “utilidade” é condensado no grego.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνπαιδεῖς … καθηστήκεισαν
  choice: tinham sido instruídos
  rationale: A combinação expressa um estado já estabelecido como resultado de formação ou instrução anterior; o mais-que-perfeito preserva esse valor temporal em português natural.
- source_word: ἀντιλήψεως τεύξεσθαι
  choice: obter apoio
  rationale: ἀντίληψις designa apoio, ajuda ou assistência, e τεύγχανω com genitivo indica alcançar, obter ou receber.
- source_word: ἀποχωροῦντας
  choice: os que se afastavam
  rationale: Preserva tanto a ideia de retirada quanto a ruptura relacional com o grupo, sem reduzir o verbo a mero deslocamento físico.
- source_word: ἐβδελύσσοντο
  choice: detestavam
  rationale: Expressa a forte repulsa do verbo grego em linguagem atual e digna.
- source_word: πολεμίους τοῦ ἔθνους
  choice: inimigos da nação
  rationale: Mantém a força política e comunitária da acusação e o sentido coletivo de ἔθνος.
- source_word: κοινῆς συναναστροφῆς
  choice: convívio comum
  rationale: Refere-se às relações sociais compartilhadas e ordinárias, sem introduzir linguagem eclesiástica ausente do texto.
- source_word: εὐχρηστίας
  choice: utilidade
  rationale: Conserva a formulação ampla e algo condensada do grego, que pode envolver proveito, prestação útil ou participação benéfica na vida comunitária.
- source_word: ἐστέροῦν
  choice: privavam
  rationale: Reproduz diretamente a ideia de negar ou tirar de alguém algo de que participava.
theological_decisions:
- issue: Identidade coletiva expressa por ἔθνος
  choice: nação
  alternative: povo
  rationale: “Nação” preserva a dimensão coletiva e sociopolítica da comunidade judaica no contexto, sem acrescentar uma definição denominacional.
- issue: Alcance da exclusão em κοινῆς συναναστροφῆς καὶ εὐχρηστίας
  choice: convívio comum e utilidade
  alternative: relações sociais e participação benéfica
  rationale: A redação mantém a tensão e a concisão do original; a nota esclarece o provável alcance comunitário sem inseri-lo de modo categórico no corpo do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação mantém tom formal e digno, com períodos coordenados claros e sem terminologia confessional.
