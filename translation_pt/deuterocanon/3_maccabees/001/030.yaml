base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/030.yaml
  text: 'But so that he might not become hateful to everyone by being hostile[a], he issued a written order: “But if any of them choose to conduct themselves among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: pt
  text: 'Mas, para que não se tornasse odioso a todos por agir com hostilidade, determinou por escrito: “Mas, se alguns deles escolherem viver entre os iniciados nos ritos[a], ele lhes concede cidadania em pé de igualdade com os alexandrinos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os iniciados nos mistérios”. O grego emprega linguagem própria de iniciação cultual.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ μὴ
  choice: Mas, para que não
  rationale: Preserva a finalidade expressa por ἵνα e o valor discursivo de δέ em português natural.
- source_word: τοῖς πᾶσιν
  choice: a todos
  rationale: O dativo indica a relação com todas as pessoas, mantendo o alcance universal da expressão.
- source_word: ἐχθόμενος ... ἐχθαίνηται
  choice: por agir com hostilidade ... se tornasse odioso
  rationale: Reproduz, na medida do possível, a ligação retórica entre as formas cognatas gregas, sem eliminar a tensão entre demonstrar hostilidade e provocar aversão.
- source_word: ὑπέγραψεν
  choice: determinou por escrito
  rationale: No contexto administrativo, introduz o conteúdo de uma determinação oficial e comunica tanto o ato escrito quanto sua força normativa.
- source_word: Ἐὰν δέ τινες ἐξ αὐτῶν προαιρῶνται
  choice: Mas, se alguns deles escolherem
  rationale: προαιρῶνται indica escolha deliberada; “escolherem” é claro e preserva a condicionalidade.
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: entre os iniciados nos ritos
  rationale: Mantém a linguagem cultual de iniciação sem impor no texto principal o termo técnico “mistérios”.
- source_word: ἀναστρέφεσθαι
  choice: viver
  rationale: O verbo pode designar modo de vida, conduta ou convivência; “viver entre” é natural em português e conserva a dimensão social da expressão.
- source_word: τούτους ἰσοπολίτας Ἀλεξανδρεῦσι ποιεῖ
  choice: ele lhes concede cidadania em pé de igualdade com os alexandrinos
  rationale: Expressa com clareza o estatuto cívico igual indicado por ἰσοπολίτας, preservando o presente formular do decreto.
theological_decisions:
- issue: Referência da linguagem de iniciação cultual
  choice: “iniciados nos ritos” no texto principal
  alternative: “iniciados nos mistérios”
  rationale: τελεταί e μεμυημένοις evocam iniciação cultual, possivelmente em cultos de mistério, mas o texto não exige que essa formulação técnica seja explicitada sem ressalva.
translation_notes:
  register: Português moderno, digno e acessível, com formulação administrativa clara. A repetição de “Mas” preserva os dois δέ do grego, inclusive no início da determinação citada.
