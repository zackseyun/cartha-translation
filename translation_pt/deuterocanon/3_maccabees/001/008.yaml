base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/008.yaml
  text: But when the Jews had sent to him[a], from the council of elders and the elders, men to greet him, bring gifts of hospitality, and rejoice over what had happened[b], it happened that he became all the more eager to come to them as quickly as possible.
translation:
  language: pt
  text: Mas, quando os judeus lhe enviaram, da parte do Conselho de Anciãos[a] e dos anciãos, homens para saudá-lo, levar presentes de hospitalidade[b] e alegrar-se com o que havia acontecido, aconteceu que ele ficou ainda mais desejoso de ir até eles o mais depressa possível.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Senado»; o termo grego γερουσία designa um corpo institucional de anciãos.
    reason: lexical_alternative
  - marker: b
    text: Os «presentes de hospitalidade» eram dádivas relacionadas ao acolhimento ou à honra prestada a um hóspede.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεμψαμένων
  choice: enviaram
  rationale: O genitivo absoluto indica uma ação anterior ou circunstancial dos judeus; a construção com «quando» comunica essa relação com naturalidade em português.
- source_word: γερουσίας
  choice: Conselho de Anciãos
  rationale: Designa um corpo institucional judaico formado por anciãos. A expressão é acessível e evita a associação predominantemente romana de «senado».
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Mantém este grupo distinto da γερουσία, como no grego, sem fundir os dois termos.
- source_word: τοὺς ἀσπασομένους αὐτόν
  choice: homens para saudá-lo
  rationale: Expressa naturalmente a finalidade ou função dos enviados; «homens» explicita as pessoas indicadas pelo artigo grego.
- source_word: ξένια
  choice: presentes de hospitalidade
  rationale: Preserva a ideia cultural de dádivas oferecidas no contexto de acolhimento ou honra a um hóspede.
- source_word: κομιοῦντας
  choice: levar
  rationale: No contexto, os enviados transportariam os presentes até o rei; «levar» é idiomático segundo a perspectiva narrativa.
- source_word: ἐπὶ τοῖς συμβεβηκόσιν
  choice: com o que havia acontecido
  rationale: Conserva a referência geral aos acontecimentos anteriores sem especificá-los além do texto.
- source_word: χαρησομένους
  choice: alegrar-se
  rationale: Reproduz o sentido do particípio futuro e se encaixa naturalmente na série de finalidades dos enviados.
- source_word: συνέβη
  choice: aconteceu que
  rationale: Mantém de modo direto a formulação impessoal que introduz o resultado.
- source_word: μᾶλλον ... προθυμηθῆναι
  choice: ficou ainda mais desejoso
  rationale: Preserva tanto a força comparativa de μᾶλλον quanto a disposição voluntária expressa por προθυμέομαι.
- source_word: ὡς τάχιστα
  choice: o mais depressa possível
  rationale: Comunica claramente a urgência do idiomatismo grego em português atual.
- source_word: πρὸς αὐτοὺς παραγενέσθαι
  choice: ir até eles
  rationale: Expressa a chegada à presença deles de forma natural, adotando a perspectiva do sujeito que se desloca.
