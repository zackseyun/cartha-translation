  text: But since you were pleased to set your glory among your people Israel, you sanctified this place.
translation:
  language: pt
  text: Mas, visto que te agradaste da tua glória no meio do teu povo Israel, santificaste este lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ᾽
  choice: Mas
  rationale: Introduz o contraste com o contexto anterior de modo direto e natural em português.
- source_word: ἐπεὶ
  choice: visto que
  rationale: Expressa aqui a relação causal ou explicativa, sem reduzi-la a um sentido meramente temporal.
- source_word: εὐδόκησας
  choice: te agradaste de estabelecer
  rationale: Preserva a ideia de beneplácito ou decisão favorável; o infinitivo 'estabelecer' explicita naturalmente em português a relação com a glória situada entre o povo, sem transformar εὐδοκέω em simples escolha.
- source_word: τὴν δόξαν σου
  choice: a tua glória
  rationale: Mantém o sentido religioso de δόξα como a glória divina, em registro bíblico claro e corrente.
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  choice: entre o teu povo Israel
  rationale: '''Entre'' é idiomático em português quando se fala da presença ou manifestação da glória no meio de um povo; ''Israel'' funciona como aposição a ''teu povo''.'
- source_word: ἡγίασας
  choice: santificaste
  rationale: Conserva explicitamente a linguagem cultual de ἁγιάζω, isto é, tornar ou separar como santo.
- source_word: τὸν τόπον τοῦτον
  choice: este lugar
  rationale: Traduz τόπος sem especificá-lo indevidamente como templo ou santuário.
theological_decisions:
- issue: Linguagem de santidade aplicada ao lugar sagrado
  choice: santificaste este lugar
  alternative: consagraste este lugar / tornaste santo este lugar
  rationale: '''Santificaste'' preserva diretamente a categoria teológica e cultual expressa por ἁγιάζω, sem estreitar o sentido a um rito específico.'
- issue: Relação entre o beneplácito divino e a glória entre Israel
  choice: te agradaste de estabelecer a tua glória entre o teu povo Israel
  alternative: te agradaste da tua glória entre o teu povo Israel
  rationale: A construção com infinitivo produz português natural e segue a leitura contextual de que Deus quis situar ou manifestar sua glória entre Israel, sem definir de que modo essa presença se realiza.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas de segunda pessoa singular próprias da oração dirigida a Deus. A formulação mantém o vocabulário bíblico 'glória' e 'santificaste', evitando especificar 'lugar' como 'templo' ou 'santuário'.
