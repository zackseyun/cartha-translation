base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/001.yaml
  text: Philopator[a], having learned from those who had returned of the seizure by Antiochus of the regions under his rule, gave orders to all his infantry and cavalry forces, took along his sister Arsinoe, and set out as far as the region of Raphia, where those with Antiochus had encamped.
translation:
  language: pt
  text: Filopátor, tendo sabido pelos que haviam retornado que Antíoco estava tomando os territórios sob seu domínio, deu ordens a todas as suas forças de infantaria e cavalaria, levou consigo sua irmã Arsínoe e partiu até a região de Ráfia, onde os que estavam com Antíoco[a] haviam acampado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “os que estavam ao redor de Antíoco”, expressão idiomática que pode designar o grupo ou as forças de Antíoco e pode incluir o próprio Antíoco.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δὲ Φιλοπάτωρ
  choice: Filopátor
  rationale: O nome é transliterado; δέ apenas dá continuidade à narrativa e não exige um marcador explícito em português.
- source_word: παρὰ τῶν ἀνακομισθέντων μαθών
  choice: tendo sabido pelos que haviam retornado
  rationale: Preserva a construção participial e não transforma explicitamente os que voltaram em mensageiros, algo apenas implícito no contexto.
- source_word: τὴν γινομένην ... ἀφαίρεσιν ὑπὸ Ἀντιόχου
  choice: que Antíoco estava tomando
  rationale: A formulação verbal é natural em português e conserva o caráter progressivo da ação indicado por γινομένην.
- source_word: τῶν ἐπ᾽ αὐτοῦ κρατουμένων τόπων
  choice: os territórios sob seu domínio
  rationale: Expressa com clareza o controle político exercido por Filopátor sobre essas regiões.
- source_word: παραγγείλας ταῖς πάσαις δυνάμεσιν πεζικαῖς καὶ ἱππικαῖς
  choice: deu ordens a todas as suas forças de infantaria e cavalaria
  rationale: Mantém o sentido de comando militar e os dois tipos de tropas em linguagem corrente e precisa.
- source_word: τὴν ἀδελφὴν Ἀρσινόην συνπαραλαβών
  choice: levou consigo sua irmã Arsínoe
  rationale: Reproduz o sentido de tomar alguém consigo; o possessivo é exigido naturalmente pelo contexto.
- source_word: ἐξώρμησεν μέχρι τῶν κατὰ Ῥαφίαν τόπων
  choice: partiu até a região de Ráfia
  rationale: Traduz o movimento da expedição sem acrescentar uma especificidade militar não necessária e apresenta a área ao redor de Ráfia de modo idiomático.
- source_word: οἱ περὶ Ἀντίοχον
  choice: os que estavam com Antíoco
  rationale: Conserva a amplitude da expressão idiomática grega, que pode designar o grupo ou as forças de Antíoco e pode incluí-lo.
