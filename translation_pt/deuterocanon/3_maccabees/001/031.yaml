  yaml_path: translation/deuterocanon/3_maccabees/001/031.yaml
  text: But some, lightly despising the supports of the city's piety, readily gave themselves over, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: pt
  text: Mas alguns, desprezando levianamente os sustentáculos da piedade da cidade,[a] prontamente se entregavam, como se fossem participar de algum grande prestígio decorrente da futura associação com o rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os alicerces da piedade da cidade”. O grego emprega uma metáfora de estruturas de sustentação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “da futura convivência com o rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: alguns
  rationale: Indica um grupo indefinido dentro da população e mantém de modo natural o contraste introduzido por δέ.
- source_word: ἐπιπολαίως
  choice: levianamente
  rationale: Exprime uma atitude superficial, irrefletida ou descuidada; “levianamente” combina com “desprezando” sem definir além do texto a motivação dessas pessoas.
- source_word: στυγοῦντες
  choice: desprezando
  rationale: Embora o verbo possa significar “odiar” ou “detestar”, o modificador ἐπιπολαίως favorece aqui a ideia de rejeição desdenhosa, preservada por “desprezando”.
- source_word: τὰς τῆς πόλεως εὐσεβείας ἐπιβάθρας
  choice: os sustentáculos da piedade da cidade
  rationale: ἐπιβάθραι designa apoios ou estruturas de sustentação e é empregado metaforicamente; “sustentáculos” conserva a imagem e um registro digno.
- source_word: εὐσεβείας
  choice: piedade
  rationale: No contexto judaico helenístico, denota devoção religiosa reverente; “piedade” mantém tanto a seriedade religiosa quanto sua dimensão cívica.
- source_word: εὐχερῶς ἑαυτοὺς ἐδίδοσαν
  choice: prontamente se entregavam
  rationale: Conserva a disposição voluntária e o valor reflexivo da expressão, sem especificar indevidamente a forma concreta dessa entrega.
- source_word: ὡς ... κοινωνήσοντες
  choice: como se fossem participar
  rationale: Mantém o caráter subjetivo da expectativa dessas pessoas, em vez de apresentá-la como resultado certo.
- source_word: μεγάλης τινὸς ... εὐκλείας
  choice: algum grande prestígio
  rationale: εὐκλεία refere-se a boa fama, renome ou distinção social; “prestígio” é natural em português e evita associações teológicas indevidas de “glória”.
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: por causa da futura convivência com o rei
  rationale: συναναστροφή indica trato, convívio ou associação social. “Convivência” comunica contato continuado sem pressupor intimidade, e “futura” reflete ἐσομένης.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto cívico-religioso judaico helenístico
  choice: piedade
  alternative: devoção religiosa; religião; reverência
  rationale: “Piedade” preserva a devoção reverente e sua incorporação à vida da cidade, sem restringir o termo a um sentido cristão posterior nem reduzi-lo a uma instituição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora arquitetônica foi mantida em “sustentáculos”; “convivência” preserva a amplitude social de συναναστροφή sem sugerir intimidade especial.
