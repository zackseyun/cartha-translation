  source_fidelity: A tradução transmite adequadamente o contraste, o desprezo leviano, a metáfora dos apoios da piedade cívica, a entrega voluntária e a expectativa de partilhar prestígio. Contudo, “convivência” pode sugerir coabitação ou contato cotidiano e, assim, estreita συναναστροφή, que aqui indica associação ou trato social-político. A relação de ἀπό com a honra esperada também fica mais clara como honra decorrente dessa associação.
  naturalness: O texto é fluente e de registro apropriado. “Decorrente da futura associação com o rei” é mais natural e preciso neste contexto do que “por causa da futura convivência com o rei”, sem perder a legibilidade moderna.
  terminology: “Piedade”, “sustentáculos”, “desprezando”, “prontamente se entregavam” e “prestígio” são escolhas defensáveis e adequadas. “Associação” conserva a amplitude de συναναστροφή melhor que “convivência”.
  issues:
