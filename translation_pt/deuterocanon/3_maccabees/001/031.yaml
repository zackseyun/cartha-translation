  to: Mas alguns, desprezando levianamente os sustentáculos da piedade da cidade,[a] prontamente se entregavam, como se fossem participar de algum grande prestígio decorrente da futura associação com o rei.[b]
  rationale: Substituí “por causa da futura convivência com o rei” por “decorrente da futura associação com o rei”. A revisão preserva a expectativa subjetiva introduzida por ὡς, representa συναναστροφή de modo mais abrangente e exprime com maior clareza que o prestígio esperado procederia da associação futura com o rei. A nota b foi ajustada para apresentar “convivência” como alternativa, não como leitura principal.
