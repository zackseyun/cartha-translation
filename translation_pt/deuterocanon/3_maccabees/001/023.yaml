  text: But when they cried out to make a rush for the weapons, and to die courageously under the ancestral law, they caused considerable turmoil in the place, and only with difficulty by the old men and the elders
translation:
  language: pt
  text: Mas, ao gritarem que se lançariam para as armas[b] e morreriam corajosamente pela lei ancestral[c], provocaram grande tumulto naquele lugar; e, só com muita dificuldade, pelos homens idosos e pelos anciãos...[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho grego fornecido termina no meio da frase, depois de “pelos homens idosos e pelos anciãos”. Por isso, a tradução preserva a interrupção em vez de acrescentar palavras ausentes do excerto.
    reason: textual_variant
  - marker: b
    text: 'Ou: “em direção às armas”, provavelmente com a ideia de correr para apoderar-se delas.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sob a lei ancestral” ou “por causa da lei ancestral”. A expressão grega pode indicar que morreriam em lealdade à lei recebida dos antepassados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: clamando
  rationale: O particípio aoristo expressa um brado urgente que desencadeia a ação; “clamando” mantém a força vocal sem tornar a frase excessivamente coloquial.
- source_word: τὴν ὁρμὴν ... ποιήσασθαι
  choice: que avançassem
  rationale: A expressão descreve um ímpeto ou movimento impetuoso. “Avançassem” produz português natural e não especifica indevidamente um ataque militar.
- source_word: ἐπὶ τὰ ὅπλα
  choice: sobre as armas
  rationale: Com ὁρμή, ἐπί indica movimento dirigido às armas, provavelmente para apoderar-se delas. A nota registra a alternativa mais explícita.
- source_word: θαρραλέως
  choice: corajosamente
  rationale: Preserva o sentido de coragem resoluta diante da morte e o tom solene do texto.
- source_word: ὑπὸ τοῦ πατρῴου νόμου
  choice: pela lei ancestral
  rationale: A construção comprimida pode indicar morrer por causa da lei ou em lealdade a ela. “Pela lei ancestral” é natural em português, enquanto a nota conserva outras possibilidades.
- source_word: τελευτᾷν
  choice: morressem
  rationale: Verbo direto e não interpretativo para o término da vida.
- source_word: ἱκανὴν ... τραχύτητα
  choice: grande tumulto
  rationale: Embora τραχύτης denote literalmente aspereza, no contexto narrativo indica perturbação ou comoção séria; “grande tumulto” comunica esse sentido com clareza.
- source_word: μόλις
  choice: só com muita dificuldade
  rationale: Expressa que a ação subsequente, ausente do excerto fornecido, ocorreu dificilmente, sem inventar seu desfecho.
- source_word: γεραιῶν
  choice: homens idosos
  rationale: Mantém a referência à idade e a distingue de πρεσβυτέρων, que pode designar líderes reconhecidos.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Preserva a possível função comunitária ou oficial do termo e sua distinção em relação aos simples homens idosos.
theological_decisions:
- issue: Sentido de πατρῷος νόμος
  choice: lei ancestral
  alternative: lei dos antepassados
  rationale: A expressão aponta para a lei judaica recebida dos antepassados. “Lei ancestral” preserva a dimensão herdada sem introduzir terminologia confessional posterior.
- issue: Força de ὑπὸ τοῦ πατρῴου νόμου
  choice: pela lei ancestral
  alternative: sob a lei ancestral / por causa da lei ancestral
  rationale: O grego é semanticamente comprimido. O texto principal comunica morte em lealdade à lei, enquanto a nota preserva a ambiguidade causal ou normativa.
- issue: Frase incompleta no testemunho grego fornecido
  choice: preservar a interrupção e sinalizá-la com reticências e nota
  alternative: completar a oração com base em outra edição ou tradução
  rationale: O excerto termina depois de “pelos homens idosos e pelos anciãos”, sem o verbo ou complemento esperado. Não se acrescenta material ausente da fonte apresentada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A distinção entre “homens idosos” e “anciãos” reproduz a diferença lexical do grego. As reticências são editoriais e tornam visível a interrupção do excerto, explicada na nota [a].
