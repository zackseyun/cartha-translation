base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/010.yaml
  text: And when he had marveled also at the good order of the sanctuary[a], he considered making plans to enter the temple.
translation:
  language: pt
  text: Depois de admirar também a boa ordem do recinto sagrado[a], ele pensou em traçar planos para entrar no templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega aqui dois termos diferentes: ἱερόν para o recinto ou conjunto sagrado e ναός para o templo propriamente dito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμάσας
  choice: Depois de admirar
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. A formulação expressa essa sequência com naturalidade, sem intensificar o sentido como faria “ficar espantado”.
- source_word: εὐταξίαν
  choice: boa ordem
  rationale: Preserva tanto a ideia de disposição ordenada quanto a avaliação positiva presente no substantivo grego.
- source_word: ἱεροῦ
  choice: recinto sagrado
  rationale: Ἱερόν designa aqui o conjunto ou recinto sagrado em sentido amplo, em contraste com ναός, o edifício do templo propriamente dito.
- source_word: ἐνεθυμήθη
  choice: pensou
  rationale: Expressa a reflexão interior sem transformar o pensamento em decisão já tomada.
- source_word: βουλεύσασθαι
  choice: em fazer planos
  rationale: Mantém a nuance adicional de deliberação e planejamento do infinitivo, evitando fundi-lo simplesmente com “entrar”.
- source_word: ναὸν
  choice: templo
  rationale: Ναός se refere ao templo propriamente dito, distinguindo-se do recinto sagrado mencionado antes.
- source_word: εἰσελθεῖν
  choice: para entrar
  rationale: Tradução direta e natural do infinitivo de movimento, preservando a finalidade do planejamento.
theological_decisions:
- issue: Distinção entre ἱερόν e ναός no mesmo versículo
  choice: Traduzir ἱερόν por “recinto sagrado” e ναός por “templo”
  alternative: Traduzir ambos por “templo”
  rationale: Os dois termos gregos designam espaços sagrados relacionados, mas não idênticos. A distinção mostra que a admiração pelo conjunto sagrado levou ao plano de entrar no edifício do templo propriamente dito.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. “Depois de admirar” torna explícita a anterioridade do particípio aoristo; “pensou em fazer planos” conserva os dois níveis verbais de reflexão e deliberação presentes no grego, embora mantenha deliberadamente uma leve repetição conceitual.
