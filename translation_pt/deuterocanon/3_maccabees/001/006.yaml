  text: But after gaining control of the plot[b][a], he decided to visit the neighboring cities and encourage them.
translation:
  language: pt
  text: Mas, depois de prevalecer sobre a trama[a], decidiu ir às cidades vizinhas e encorajá-las.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de obter vantagem sobre a trama” ou “depois de debelar a trama”. O verbo grego pode indicar obter domínio ou vantagem sobre um plano hostil.
    reason: lexical_alternative
  - marker: b
    text: Ou “exortá-las” ou “fazer-lhes um apelo”. O verbo grego pode expressar encorajamento, exortação ou apelo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρατήσας
  choice: depois de frustrar
  rationale: O particípio aoristo de κατακρατέω, regendo o genitivo, indica que ele obteve vantagem ou domínio sobre o plano hostil. “Depois de frustrar” expressa em português natural o resultado de prevalecer sobre a trama, sem especificar o meio.
- source_word: ἐπιβουλῆς
  choice: a trama
  rationale: ἐπιβουλή designa um plano hostil ou ardil. “Trama” é conciso e não pressupõe uma conspiração formal.
- source_word: ἔκρινεν
  choice: decidiu
  rationale: Com o infinitivo, κρίνω tem aqui o sentido de tomar uma decisão ou resolução, não o de proferir julgamento.
- source_word: τὰς πλησίον πόλεις
  choice: as cidades vizinhas
  rationale: A expressão indica cidades situadas nas proximidades; “cidades vizinhas” é corrente e digna.
- source_word: ἐπελθὼν
  choice: ir às
  rationale: O particípio indica o deslocamento até as cidades e funciona como ação associada a παρακαλέσαι. A formulação “ir às” preserva claramente esse movimento.
- source_word: παρακαλέσαι
  choice: encorajá-las
  rationale: παρακαλέω pode significar encorajar, exortar ou fazer um apelo. “Encorajá-las” mantém o sentido amplo; o pronome retoma metonimicamente as cidades, isto é, seus habitantes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e legibilidade brasileira. A tradução conserva a sequência entre a superação da trama, a decisão, o deslocamento e a exortação, sem tornar mais específico o conteúdo do apelo.
