  text: so that the lawless might not boast in their wrath[a], nor exult in the arrogance of their tongue, saying[b],
translation:
  language: pt
  text: 'para que os transgressores da lei não se vangloriem em sua ira[a], nem exultem na arrogância de sua língua[b], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em seu furor».'
