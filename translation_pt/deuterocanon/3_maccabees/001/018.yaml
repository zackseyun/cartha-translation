  - marker: b
    text: Literalmente, «na arrogância de sua língua», expressão que se refere à fala orgulhosa ou insolente.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Preserva de modo natural em português a finalidade expressa pela conjunção com negação.
- source_word: καυχήσωνται
  choice: se vangloriem
  rationale: Comunica autoexaltação ou jactância, mantendo o tom solene sem recorrer a linguagem arcaica.
- source_word: οἱ παράνομοι
  choice: os transgressores da lei
  rationale: Mantém a relação explícita de παράνομος com lei ou ordem, em vez de ampliar o sentido para o genérico «perversos».
- source_word: ἐν θυμῷ αὐτῶν
  choice: em sua ira
  rationale: «Ira» expressa a paixão hostil intensa de θυμός e conserva a construção preposicional do grego.
- source_word: μηδὲ
  choice: nem
  rationale: Coordena naturalmente a segunda finalidade negativa.
- source_word: ἀγαλλιάσωνται
  choice: exultem
  rationale: Preserva a ideia de alegria intensa e triunfante, bem como o registro elevado do verbo.
- source_word: ἐν ὑπερηφανίᾳ
  choice: na arrogância
  rationale: Retrata o orgulho altivo e moralmente censurável indicado por ὑπερηφανία.
- source_word: γλώσσης αὐτῶν
  choice: de sua língua
  rationale: Conserva a imagem concreta e o singular coletivo do grego; no contexto, «língua» representa a fala insolente.
- source_word: λέγοντες
  choice: 'dizendo:'
  rationale: Introduz diretamente as palavras que seguem; os dois-pontos são a pontuação natural em português antes de uma citação.
