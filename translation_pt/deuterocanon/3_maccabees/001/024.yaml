lexical_decisions:
- source_word: ἀποτραπέντες
  choice: depois de voltarem atrás
  rationale: O particípio aoristo preserva a relação temporal com o verbo principal. “Voltarem atrás” expressa naturalmente a ideia contextual de mudança de direção sem especificar um agente externo.
- source_word: παρῆσαν
  choice: retomaram
  rationale: Neste contexto, πάρειμι com ἐπὶ e acusativo indica a chegada ou o retorno a uma condição anterior. “Retomaram” comunica essa força de recomeço em português corrente.
- source_word: στάσιν
  choice: postura
  rationale: στάσις pode indicar posição corporal ou, de modo mais amplo, estado ou condição. “Postura” mantém a possível dimensão física sem excluir a atitude interior.
- source_word: δεήσεως
  choice: súplica
  rationale: δέησις designa uma petição insistente ou urgente; “súplica” preserva essa intensidade melhor do que o termo mais geral “oração”.
- source_word: ἐπὶ τὴν αὐτὴν ... στάσιν
  choice: a mesma postura
  rationale: A expressão indica que eles reassumiram a condição ou posição de súplica mencionada anteriormente.
