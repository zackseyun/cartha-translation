  text: And he inquired for what reason no one among those present had prevented him from entering any sanctuary[a].
translation:
  language: pt
  text: E ele perguntava por que razão ninguém dentre os presentes o havia impedido de entrar em qualquer santuário[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em todo recinto sagrado”. O grego τέμενος pode designar de modo amplo um lugar consagrado, não apenas o edifício de um templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπυνθάνετο
  choice: perguntava
  rationale: O imperfeito de πυνθάνομαι indica uma indagação em curso ou reiterada; “perguntava” é natural em português e mantém esse aspecto.
- source_word: διὰ τίνα αἰτίαν
  choice: por que razão
  rationale: Reproduz explicitamente a ideia de causa ou motivo presente na expressão grega, sem a comprimir simplesmente em “por quê”.
- source_word: αὐτὸν εἰσερχόμενον
  choice: o havia impedido de entrar
  rationale: O particípio εἰσερχόμενον modifica αὐτόν e se liga a ἐκώλυσεν; em português, a construção idiomática com “impedir de entrar” transmite com clareza essa relação.
- source_word: πᾶν τέμενος
  choice: qualquer santuário
  rationale: Neste contexto negativo, “qualquer santuário” expressa naturalmente a abrangência de πᾶν. “Santuário” conserva a amplitude de τέμενος melhor que “templo”, que poderia sugerir apenas o edifício.
- source_word: οὐθεὶς ἐκώλυσεν
  choice: ninguém ... o havia impedido
  rationale: κωλύω significa impedir, deter ou obstar. O mais-que-perfeito composto deixa clara, no discurso indireto, a anterioridade da omissão questionada.
- source_word: τῶν παρόντων
  choice: dentre os presentes
  rationale: O genitivo partitivo identifica o grupo do qual ninguém agiu; “dentre os presentes” preserva essa relação de modo natural e preciso.
