lexical_decisions:
- source_word: σύν τε τούτοις
  choice: Além desses
  rationale: Preserva a força aditiva da expressão grega e sua ligação com os referentes anteriores sem especificá-los além do texto.
- source_word: οἱ περὶ τῶν πολιτῶν θρασυνθέντες
  choice: os que haviam ganhado ousadia em relação aos cidadãos
  rationale: Expressa a mudança indicada pelo particípio e mantém aberta a relação de περὶ com “os cidadãos”, que pode apontar tanto para o assunto da ousadia quanto para atuação em favor deles.
- source_word: οὐκ ἠνείχοντο
  choice: já não suportavam a situação
  rationale: O imperfeito comunica uma reação contínua; “já não” transmite que chegaram ao limite, e “a situação” fornece em português o complemento implícito no grego.
- source_word: τέλεον αὐτοῦ ἐπικειμένου
  choice: enquanto ele pressionava a questão ao máximo
  rationale: A construção genitiva absoluta é vertida como circunstância simultânea; “pressionava a questão” comunica a insistência de ἐπίκειμαι, e “ao máximo” preserva a intensificação de τέλεον.
- source_word: τὸ τῆς προθέσεως ἐκπληροῦν διανοουμένου
  choice: e pretendia levar seu propósito a cabo
  rationale: Reproduz a intenção deliberada de διανοουμένου e a execução completa do plano indicada por ἐκπληροῦν, em linguagem portuguesa natural.
