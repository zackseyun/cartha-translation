  text: Along with these[a], those who had become emboldened concerning the citizens could no longer endure it when he pressed the matter completely and intended to carry out his purpose.
translation:
  language: pt
  text: Além disso, os que se haviam tornado audaciosos a respeito dos cidadãos[a] já não suportavam a situação, enquanto ele insistia com toda a força e pretendia levar seu propósito a cabo.
