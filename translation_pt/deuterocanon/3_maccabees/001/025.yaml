  text: And the multitude, as before, kept on with these men, pleading; but the elders around the king were trying in many ways to turn his arrogant mind away from the plot he had conceived.
translation:
  language: pt
  text: E a multidão, como antes, continuava junto a esses homens, suplicando; mas os anciãos junto ao rei tentavam, de muitas maneiras, desviar a mente arrogante do rei da conspiração que ele havia concebido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεστρέφετο
  choice: permanecia
  rationale: No contexto, o verbo no imperfeito indica continuidade da ação ou permanência junto aos homens mencionados, sem exigir o sentido literal de movimentar-se de um lado para outro.
- source_word: δεόμενον
  choice: suplicando
  rationale: O particípio expressa um apelo insistente; «suplicando» preserva a intensidade e concorda com o coletivo «multidão».
- source_word: οἱ ... πρεσβύτεροι
  choice: os anciãos
  rationale: Equivalente corrente para homens de posição ou idade elevada ligados à corte, sem especificar um cargo não expresso no grego.
- source_word: ἀγέρωχον ... νοῦν
  choice: mente arrogante
  rationale: ἀγέρωχος tem sentido negativo de altivez ou arrogância, e νοῦς designa aqui a disposição mental do rei.
- source_word: ἐξιστάνειν ... τῆς ... ἐπιβουλῆς
  choice: desviar ... da conspiração
  rationale: A construção indica afastar a mente do plano hostil concebido; «conspiração» mantém a ideia de trama ou intento nocivo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com estrutura próxima do grego. O aspecto durativo dos imperfeitos foi preservado por «permanecia» e «tentavam». «Esses homens» mantém a referência anafórica de τούτοις sem identificar além do que o versículo afirma.
