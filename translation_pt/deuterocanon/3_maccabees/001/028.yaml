  source_fidelity: 'A tradução preserva a estrutura deliberadamente redundante do grego: uma κραυγή das multidões, descrita como πυκνοτάτη e ἔμπονος, da qual resulta uma βοή ἀνείκαστος. “Densíssimo” conserva, de modo adequadamente marcado, o superlativo e a imagem de concentração sonora; “penoso” pode abarcar o esforço e a tensão de ἐμπόνου. “Que se erguia das multidões” é uma solução idiomática fiel ao valor contextual de συναγομένης.'
