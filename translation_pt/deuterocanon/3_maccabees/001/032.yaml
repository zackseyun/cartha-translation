  yaml_path: translation/deuterocanon/3_maccabees/001/032.yaml
  text: But most of them[a] took courage with a noble spirit, did not depart from piety[c][b], exchanging even their possessions for life, and boldly sought to rescue themselves from the registrations.
translation:
  language: pt
  text: Mas a maioria deles tomou coragem com espírito nobre e não se afastou da piedade[a]; trocando até os seus bens pela própria vida, procurou, sem medo, livrar-se dos registros[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não abandonou a devoção a Deus”. O termo grego εὐσέβεια pode indicar reverência, devoção ou piedade para com Deus.
    reason: lexical_alternative
  - marker: b
    text: A frase grega traduzida por “procurou, sem medo, livrar-se” é difícil no texto transmitido, especialmente por causa do verbo ἐτιμῶντο. A tradução expressa o provável sentido de um esforço ativo para obter a libertação.
    reason: textual_variant
  - marker: c
    text: “Registros” refere-se ao processo oficial de inscrição ou inclusão em listas que lhes foi imposto, não necessariamente a um censo populacional no sentido moderno.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: Mas a maioria deles
  rationale: A expressão indica a maior parte do grupo; δέ marca o contraste com o contexto anterior.
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: tomou coragem com espírito nobre
  rationale: O dativo expressa modo, e a combinação descreve firmeza interior e coragem, sem empregar “alma” em sentido técnico.
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: não se afastou da piedade
  rationale: διίστημι com genitivo admite o sentido de afastar-se; εὐσέβεια designa reverência e fidelidade religiosa a Deus.
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: trocando até os seus bens pela própria vida
  rationale: χρήματα refere-se a bens ou posses; περὶ τοῦ ζῇν indica a preservação da vida, e τε acrescenta a ideia de “até” ou “também”.
- source_word: ἀδέως
  choice: sem medo
  rationale: O advérbio comunica ausência de temor ou atuação destemida; “sem medo” é claro e natural em português.
- source_word: ἐτιμῶντο ... ῥύσασθαι
  choice: procuravam ... livrar-se
  rationale: Embora ἐτιμῶντο seja difícil no texto transmitido, a construção parece indicar que consideravam importante ou buscavam efetivamente obter a própria libertação.
- source_word: ἐκ τῶν ἀπογραφῶν
  choice: dos registros
  rationale: ἀπογραφαί são registros ou inscrições oficiais; o plural do grego foi preservado sem sugerir necessariamente um censo populacional moderno.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto judaico de perseguição
  choice: piedade
  alternative: devoção; reverência a Deus
  rationale: “Piedade” conserva a dimensão religiosa e ética da fidelidade a Deus sem introduzir terminologia doutrinária posterior.
- issue: Interpretação da construção difícil com ἐτιμῶντο
  choice: procuravam, sem medo, livrar-se
  alternative: consideravam livrar-se; julgavam importante livrar-se
  rationale: A tradução comunica o provável sentido de esforço ativo, enquanto a nota registra honestamente a dificuldade do texto grego e evita apresentar a interpretação como indiscutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. Conserva o contraste inicial, o plural de ἀπογραφῶν e a ambiguidade textual por meio de nota, sem suavizar a tensão entre fidelidade religiosa e perda dos bens.
