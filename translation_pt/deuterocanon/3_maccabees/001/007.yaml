  text: Depois de fazer isso e de distribuir presentes aos santuários, ele encheu de confiança os que estavam sob seu domínio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας δὲ τοῦτο
  choice: Depois de fazer isso
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a formulação expressa com clareza a sequência e preserva a referência retrospectiva de τοῦτο.
- source_word: τοῖς τεμένεσι
  choice: aos santuários
  rationale: τέμενος designa um lugar ou recinto consagrado. “Santuários” é natural e mantém a amplitude do termo sem restringi-lo a um edifício específico.
- source_word: δωρεὰς ἀπονείμας
  choice: de distribuir presentes
  rationale: δωρεά indica dádivas ou benefícios, enquanto ἀπονέμω comunica atribuir ou repartir. “Distribuir presentes” preserva o contexto de concessões sem acrescentar uma conotação sacrificial.
- source_word: εὐθαρσεῖς
  choice: encheu de confiança
  rationale: O adjetivo descreve pessoas animadas, seguras ou confiantes. Com κατέστησεν, a expressão portuguesa comunica de modo idiomático o estado resultante.
- source_word: τοὺς ὑποτεταγμένους
  choice: os que estavam sob seu domínio
  rationale: O particípio perfeito passivo designa os que haviam sido colocados sob autoridade. A escolha transmite subordinação política sem recorrer a uma designação mais específica que o grego.
- source_word: κατέστησεν
  choice: ele encheu de confiança
  rationale: Neste uso causativo, καθίστημι significa fazer com que alguém fique em determinado estado. A construção escolhida é natural em português e conserva essa força causativa.
