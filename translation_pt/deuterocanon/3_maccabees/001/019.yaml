  text: We trampled the house of holiness[b][a], as the houses of abominations are trampled.
translation:
  language: pt
  text: Pisoteamos a casa da consagração[a], como são pisoteadas as casas de abominações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a casa da santificação», «a casa de santidade» ou «o santuário». O grego diz literalmente «a casa da santificação».
    reason: lexical_alternative
  - marker: b
    text: O raro termo grego traduzido por «abominações» também pode significar «coisas destinadas à destruição» ou, mais amplamente, coisas detestáveis ou malditas.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν
  choice: pisoteamos
  rationale: Preserva a imagem concreta e violenta de calcar ou pisar repetidamente, sem substituir o ato por sua consequência interpretativa, como «profanamos».
- source_word: οἶκον τοῦ ἁγιασμοῦ
  choice: a casa de santidade
  rationale: Mantém a metáfora de «casa» e expressa o caráter sagrado do edifício em português natural, sem reduzi-lo simplesmente a «templo» ou «santuário».
- source_word: ὡς
  choice: como
  rationale: Introduz diretamente a comparação presente no grego.
- source_word: καταπατοῦνται
  choice: são pisoteadas
  rationale: Conserva a voz passiva e o presente generalizador da comparação, além de repetir a imagem do primeiro verbo.
- source_word: προσολοθρευμάτων
  choice: coisas abomináveis
  rationale: O substantivo raro parece designar coisas detestáveis, malditas ou destinadas à destruição. «Coisas abomináveis» comunica a repulsa sem ocultar a incerteza lexical, registrada em nota.
theological_decisions:
- issue: Identificação do edifício sagrado
  choice: casa de santidade
  alternative: santuário; casa da consagração; casa santa
  rationale: A tradução conserva a formulação reverente e incomum do grego, evitando explicitar além do texto que se trata do templo, embora esse seja o referente contextual.
- issue: Sentido do raro προσολοθρευμάτων
  choice: coisas abomináveis
  alternative: coisas destinadas à destruição; coisas malditas; coisas detestáveis
  rationale: O contexto estabelece um contraste entre a casa sagrada e casas associadas ao que é detestável ou condenado. A escolha preserva a força pejorativa, enquanto a nota mantém abertas as principais possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A repetição de «pisoteamos/pisoteadas» reproduz deliberadamente o paralelismo grego. Os marcadores foram posicionados junto às expressões que explicam.
