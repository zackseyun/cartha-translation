  yaml_path: translation/deuterocanon/3_maccabees/001/029.yaml
  text: For it seemed that not only the people[a], but even the walls and the whole ground, were resounding[c][b], since then all things were being changed to death instead of the profanation of the place.
translation:
  language: pt
  text: Pois parecia que não só as pessoas, mas até as muralhas e todo o chão ressoavam[a], visto que, naquele momento, todos estavam sendo entregues à morte em vez da profanação do lugar[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ecoavam”. O verbo grego descreve um som que ressoa ou reverbera.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é incomum e metafórica. Também pode ser entendida como “todos estavam sendo transformados em morte” ou, tomando “todos” em sentido neutro, “todas as coisas estavam sendo entregues à morte”, em vez da profanação do lugar.
    reason: lexical_alternative
  - marker: c
    text: “O lugar” refere-se, pelo contexto, ao recinto sagrado, provavelmente à área do templo; o grego não emprega aqui a palavra mais específica para “templo”.
    reason: cross_reference
lexical_decisions:
- source_word: δοκεῖν γὰρ ἦν
  choice: Pois parecia
  rationale: Reproduz de modo idiomático a construção impessoal e mantém a ligação explicativa de γάρ.
- source_word: τοὺς ἀνθρώπους
  choice: as pessoas
  rationale: Expressa o coletivo humano sem restringi-lo aos homens do sexo masculino.
- source_word: τὰ τείχη
  choice: as muralhas
  rationale: No cenário urbano e sagrado, traduz naturalmente as estruturas circundantes evocadas pela hipérbole sonora.
- source_word: τὸ πᾶν ἔδαφος
  choice: todo o chão
  rationale: Mantém o sentido físico imediato de ἔδαφος, sem ampliá-lo indevidamente para 'toda a terra'.
- source_word: ἠχεῖν
  choice: ressoavam
  rationale: Comunica som forte e reverberante e aplica-se naturalmente às pessoas, às muralhas e ao chão na imagem retórica.
- source_word: ἅτε δὴ
  choice: visto que
  rationale: Preserva a força explicativa e causal da expressão grega em português corrente e digno.
- source_word: τῶν πάντων
  choice: todos
  rationale: A forma pode ser masculina ou neutra; o contexto favorece referência a todas as pessoas envolvidas, mas a nota registra a possibilidade mais abrangente.
- source_word: τότε θάνατον ἀλλασσομένων ἀντὶ τῆς τοῦ τόπου βεβηλώσεως
  choice: naquele momento, todos trocavam a profanação do lugar pela morte
  rationale: Conserva a metáfora incomum de troca e a oposição entre morte e profanação, formulando em português com clareza que a morte era aceita em lugar da profanação.
- source_word: τοῦ τόπου
  choice: do lugar
  rationale: Mantém o substantivo amplo empregado no grego, sem substituir explicitamente por 'templo'.
theological_decisions:
- issue: Referente de τοῦ τόπου
  choice: o lugar
  alternative: o templo; o lugar santo
  rationale: O contexto aponta para o recinto sagrado, provavelmente a área do templo, mas o texto grego diz apenas 'o lugar'; a tradução preserva essa generalidade.
- issue: Sentido de τῶν πάντων e da metáfora de troca
  choice: todos trocavam a profanação do lugar pela morte
  alternative: tudo estava sendo transformado em morte em vez da profanação do lugar
  rationale: O genitivo absoluto se encaixa melhor no contexto como referência às pessoas que preferiam a morte à profanação. Como a construção grega é incomum e permite leitura mais abrangente, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O período conserva o tom elevado e a hipérbole do original, evitando tanto arcaísmos quanto uma explicitação denominacional.
