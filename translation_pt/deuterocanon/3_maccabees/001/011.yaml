base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/011.yaml
  text: But when some said that this ought not to be done[a], because not even the Gentiles enter, nor all the priests, but only the high priest who is over all—and he only once a year—he would not be persuaded at all.
translation:
  language: pt
  text: Mas, quando alguns disseram que isso não devia ser feito[a], pois nem mesmo os gentios entram, nem todos os sacerdotes, mas somente o sumo sacerdote que está à frente de todos — e ele apenas uma vez por ano —, ele não se deixou convencer de modo algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não era apropriado fazer isso”. O grego enfatiza o que é conveniente ou apropriado.'
    reason: alternativa lexical
lexical_decisions:
- source_word: μὴ καθήκειν γίνεσθαι τοῦτο
  choice: isso não devia ser feito
  rationale: καθήκειν expressa o que é apropriado ou conveniente; no contexto, a expressão apresenta o ato pretendido como impróprio, sem explicitar além do grego uma categoria jurídica.
- source_word: τοῖς ἔθνεσιν
  choice: os gentios
  rationale: No contexto de acesso ao templo, ἔθνη designa os não judeus, e não nações em sentido abstrato.
- source_word: εἰσιέναι
  choice: entram
  rationale: Traduz diretamente o ato de entrar, sem acrescentar uma nuance modal de permissão que não está expressa no verbo.
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: todos os sacerdotes
  rationale: Mantém o contraste coletivo entre o sacerdócio em geral e a única exceção mencionada em seguida.
- source_word: μόνῳ τῷ προηγουμένῳ πάντων ἀρχιερεῖ
  choice: somente o sumo sacerdote que preside sobre todos
  rationale: προηγουμένῳ πάντων descreve aquele que está à frente de todos; “preside sobre todos” comunica a ideia com naturalidade e preserva a hierarquia explícita.
- source_word: κατ᾽ ἐνιαυτὸν ἅπαξ
  choice: uma vez por ano
  rationale: É a expressão temporal portuguesa corrente e corresponde precisamente à frequência anual indicada.
- source_word: οὐδαμῶς ἐπείθετο
  choice: não se deixou convencer de modo algum
  rationale: Preserva o sentido de não ser persuadido e a ênfase absoluta de οὐδαμῶς, sem transformar a frase apenas em recusa a ouvir.
theological_decisions:
- issue: Linguagem da restrição de acesso ao templo
  choice: 'Manter a progressão do argumento: nem os gentios, nem todos os sacerdotes, mas somente o sumo sacerdote uma vez por ano.'
  alternative: Generalizar a objeção como simples ilegalidade ou proibição de entrada.
  rationale: O grego fundamenta a objeção na ordem cultual e em graus de acesso ao santuário. A tradução conserva essa estrutura sem acrescentar explicações doutrinárias posteriores.
- issue: Força de καθήκειν
  choice: 'Traduzir em termos de conveniência ou dever: “não devia ser feito”.'
  alternative: “era proibido” ou “era ilícito”.
  rationale: καθήκειν enfatiza o que convém ou é apropriado; termos estritamente jurídicos tornariam o sentido mais específico do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o encadeamento argumentativo do grego e evita modalizar “entram” como “podem entrar”.
