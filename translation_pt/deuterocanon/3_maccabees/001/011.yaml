  text: τῶν δὲ εἰπόντων μὴ καθήκειν γίνεσθαι τοῦτο, διὰ τὸ μηδὲ τοῖς ἔθνεσιν εἰσιέναι, μηδὲ πᾶσιν τοῖς ἱερεῦσιν, ἀλλ᾽ ἢ μόνῳ τῷ προηγουμένῳ πάντων ἀρχιερεῖ, καὶ τούτῳ κατ᾽ ἐνιαυτὸν ἅπαξ, ὁ δὲ οὐδαμῶς ἐπείθετο.
