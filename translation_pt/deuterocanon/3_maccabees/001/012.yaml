  - severity: medium
    issue: A elipse «eu não devo ser» é obscura em português
    rationale: Embora tente reproduzir ἐμὲ δὲ οὐ δεῖ, em português ela pode significar que o falante não deveria existir. O contexto recupera «ser privado desta honra»; a tradução deve explicitá-lo, enquanto a nota registra a elipse do original.
