  text: And even when the law had been read out[a], he still did not stop insisting that he ought to enter, saying, “Even if they have been deprived of this honor, I ought not to be.”
translation:
  language: pt
  text: 'E, mesmo depois de a Lei ter sido lida, nem assim ele parou de insistir que devia entrar, dizendo: “Ainda que eles tenham sido privados desta honra, eu não deveria ser privado dela.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é elíptico; literalmente: “mas, quanto a mim, não deve [ser assim]”. Ou: “quanto a mim, isso não deveria acontecer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... νόμου
  choice: a Lei
  rationale: Neste contexto, νόμος designa a norma judaica que acabara de ser citada; “a Lei” preserva seu caráter normativo.
- source_word: παραναγνωσθέντος
  choice: depois de ... lhe ter sido lida
  rationale: O particípio indica que a Lei foi lida diante dele ou para ele; a formulação é natural em português e mantém essa relação.
- source_word: οὐδ᾽ ὣς
  choice: nem assim
  rationale: Expressa que ele persistiu apesar da leitura da Lei.
- source_word: ἀπέλειπεν προφερόμενος
  choice: ele parou de insistir
  rationale: Com a negação, transmite a ação contínua de não cessar de apresentar sua pretensão; “insistir” é idiomático e fiel ao contexto.
- source_word: ἑαυτὸν δεῖν εἰσελθεῖν
  choice: que devia entrar
  rationale: δεῖ exprime necessidade ou obrigação; “devia” preserva a alegação de que lhe cabia entrar sem intensificá-la como compulsão absoluta.
- source_word: ἐστέρηνται
  choice: tenham sido privados
  rationale: Preserva a voz passiva e o estado resultante expresso pelo perfeito grego.
- source_word: ταύτης τῆς τιμῆς
  choice: desta honra
  rationale: “Honra” corresponde diretamente a τιμή e conserva a noção de distinção associada ao acesso.
- source_word: ἐμὲ δὲ οὐ δεῖ
  choice: eu não devo ser
  rationale: Mantém, tanto quanto o português permite, a elipse enfática do grego, cujo predicado deve ser recuperado da oração anterior.
