base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/020.yaml
  text: And the mothers and nurses besides these[a], leaving behind the newborn children, some in their houses and others in the streets[b], kept gathering without turning back to the all-supreme sanctuary.
translation:
  language: pt
  text: Além dessas, as mães e as amas de leite[a], deixando para trás os filhos recém-nascidos — umas em casa, outras nas ruas —, afluíam sem voltar atrás para o santuário supremamente exaltado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amas”; o termo grego pode designar especificamente mulheres que amamentavam bebês.
    reason: lexical_alternative
  - marker: b
    text: Ou “o templo altíssimo” ou “o santuário supremo acima de tudo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεογνά
  choice: recém-nascidos
  rationale: Expressa a pouca idade das crianças e preserva a força emotiva da cena em português natural.
- source_word: τιθηνοί
  choice: amas de leite
  rationale: O termo designa mulheres encarregadas de cuidar e, muitas vezes, amamentar bebês; a formulação específica evita o sentido médico moderno de “enfermeiras”.
- source_word: παραλείπουσαι
  choice: deixando para trás
  rationale: Mantém a ideia concreta de partir deixando as crianças, sem acrescentar o juízo moral mais forte de “abandonando”.
- source_word: ἄλλως καὶ ἄλλως … αἱ μὲν … αἱ δὲ
  choice: umas em casa, outras nas ruas
  rationale: Reproduz de modo idiomático a distribuição expressa pelo grego. O feminino “umas/outras” acompanha as mães e amas, preservando a estrutura sintática do original.
- source_word: ἀγυιάς
  choice: ruas
  rationale: Equivalente moderno e claro para as vias públicas da cidade.
- source_word: ἀνεπιστρέπτως
  choice: sem voltar atrás
  rationale: Preserva a imagem de não retornar e comunica o movimento resoluto das mulheres sem transformar o advérbio em uma avaliação psicológica.
- source_word: πανυπέρτατον
  choice: supremamente exaltado
  rationale: Conserva a intensificação superlativa do composto grego em linguagem elevada, mas compreensível.
- source_word: ἱερόν
  choice: santuário
  rationale: Refere-se ao local ou recinto sagrado sem especificar indevidamente uma parte arquitetônica do templo.
- source_word: ἠθροίζοντο
  choice: afluíam
  rationale: Comunica o movimento coletivo e contínuo em direção ao santuário indicado pelo imperfeito e por εἰς.
theological_decisions:
- issue: Sentido da expressão πανυπέρτατον ἱερόν
  choice: o santuário supremamente exaltado
  alternative: o templo altíssimo; o santuário supremo acima de tudo
  rationale: A tradução mantém a retórica cultual intensificada sem converter o adjetivo em um título divino nem decidir se a exaltação é espacial ou honorífica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Afluíam” mantém o tom narrativo elevado e a ação coletiva contínua; os travessões esclarecem a construção distributiva sem eliminar sua leve ambiguidade.
