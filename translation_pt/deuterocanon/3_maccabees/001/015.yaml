  text: For your dwelling place is the heaven of heaven[b][a], unreachable by men.
translation:
  language: pt
  text: Pois a tua morada é o mais alto céu[a], inacessível aos seres humanos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o céu do céu”; expressão de caráter semítico que se refere ao mais alto céu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  choice: morada
  rationale: Designa o lugar onde alguém habita. “Morada” é natural, digna e preserva o sentido concreto do substantivo grego.
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: o céu dos céus
  rationale: A expressão de caráter semítico indica o céu supremo. “O céu dos céus” conserva sua forma e ressonância tradicionais em português sem perder a inteligibilidade.
- source_word: ἀνέφικτος
  choice: inacessível
  rationale: O adjetivo indica aquilo que não pode ser alcançado ou atingido. “Inacessível” exprime de modo conciso a impossibilidade de acesso humano.
- source_word: ἀνθρώποις
  choice: aos seres humanos
  rationale: O plural grego refere-se genericamente à humanidade, não apenas aos homens do sexo masculino; a formulação inclusiva comunica esse alcance com precisão.
theological_decisions:
- issue: Sentido de οὐρανὸς τοῦ οὐρανοῦ como expressão da transcendência divina
  choice: o céu dos céus
  alternative: o mais alto céu
  rationale: A tradução mantém a expressão semítica e a imagem transcendente do texto sem convertê-la em uma explicação interpretativa. A forma literalmente singular do grego é registrada em nota.
- issue: Alcance genérico de ἀνθρώποις
  choice: aos seres humanos
  alternative: aos homens
  rationale: O referente é a humanidade em geral. A escolha evita uma possível leitura restrita ao sexo masculino, sem acrescentar conteúdo teológico.
translation_notes:
  register: Português atual, claro e solene, adequado ao contexto de oração. Conserva a imagem concreta da morada divina e a expressão tradicional “céu dos céus”, empregando linguagem inclusiva onde o grego designa a humanidade em geral.
