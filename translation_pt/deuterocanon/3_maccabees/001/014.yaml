lexical_decisions:
- source_word: ἀπρονοήτως
  choice: sem pensar
  rationale: Expressa de modo natural a falta de reflexão ou previsão, sem acrescentar uma censura moral mais forte do que o grego exige.
- source_word: ἔφη
  choice: disse
  rationale: Equivalente simples e direto do verbo de fala, sem intensificá-lo como “declarou” ou “afirmou”.
- source_word: κακῶς
  choice: de modo monstruoso
  rationale: Mantém a força negativa do advérbio em associação com τερατεύεσθαι; aqui, “mal” seria pouco expressivo e “perversamente” poderia moralizar em excesso.
- source_word: αὐτὸ τοῦτο
  choice: justamente isso
  rationale: Reproduz naturalmente em português a ênfase da expressão grega.
- source_word: τερατεύεσθαι
  choice: estava sendo apresentado de modo monstruoso
  rationale: Preserva a forma passiva e a amplitude do verbo, que pode indicar tratar ou narrar algo como prodígio, portento ou monstruosidade, sem reduzir obrigatoriamente o sentido a uma simples deturpação.
