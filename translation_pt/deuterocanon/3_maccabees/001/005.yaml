base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/005.yaml
  text: And so it happened that the opponents were destroyed in hand-to-hand combat[a], and many were also captured as prisoners of war.
translation:
  language: pt
  text: E assim aconteceu que os adversários foram destruídos no combate corpo a corpo, e muitos também foram capturados como prisioneiros de guerra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «capturados pela lança», expressão militar para pessoas feitas prisioneiras de guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβη
  choice: aconteceu
  rationale: Preserva a fórmula narrativa impessoal que introduz o resultado dos acontecimentos, em português natural.
- source_word: ἀντιπάλους
  choice: os adversários
  rationale: Designa os que se opunham ao outro lado no conflito sem restringir indevidamente o termo ao singular coletivo «inimigo».
- source_word: ἐν χειρονομίαις
  choice: no combate corpo a corpo
  rationale: No contexto militar, a expressão indica luta travada de perto; uma tradução literal ligada a gestos ou movimentos das mãos seria enganosa.
- source_word: διαφθαρῆναι
  choice: foram destruídos
  rationale: Mantém o sentido amplo de serem levados à destruição no contexto da batalha, sem substituir explicitamente o verbo por «foram mortos», embora a morte provavelmente esteja implícita.
- source_word: πολλούς
  choice: muitos
  rationale: Equivalente quantitativo direto, claro e idiomático.
- source_word: δοριαλώτους
  choice: como prisioneiros de guerra
  rationale: Expressa de modo natural o termo militar para pessoas capturadas em guerra; a imagem literal da captura pela lança é preservada em nota.
- source_word: συλλημφθῆναι
  choice: foram capturados
  rationale: Conserva a voz passiva e o sentido militar, em paralelo com «foram destruídos».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção foi tornada natural sem eliminar a amplitude semântica de διαφθαρῆναι. O marcador da nota foi colocado junto de «prisioneiros de guerra», pois a nota explica δοριαλώτους, e não a expressão referente ao combate corpo a corpo.
