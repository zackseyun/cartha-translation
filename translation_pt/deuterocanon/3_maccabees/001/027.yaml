  yaml_path: translation/deuterocanon/3_maccabees/001/027.yaml
  text: Therefore[a], when those around him saw these things[b], they turned to join our people in calling on the one who has all power to help in the present circumstances and not overlook the lawless and arrogant deed.
translation:
  language: pt
  text: Por isso, ao verem essas coisas, também os que estavam ao redor dele passaram a invocar, junto com os nossos[a], aquele que detém todo o poder, pedindo-lhe que viesse em auxílio nas circunstâncias presentes[b] e não deixasse passar sem intervenção esse ato contrário à lei e arrogante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto com o nosso povo”; no grego, o referente de “os nossos” fica implícito.
    reason: lexical_alternative
  - marker: b
    text: Ou “viesse em auxílio dos que estavam presentes”; a expressão grega pode referir-se às circunstâncias do momento ou às pessoas presentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα οὖν καὶ
  choice: Por isso ... essas coisas, também
  rationale: Mantém a ligação conclusiva de οὖν, o plural de ταῦτα e a força inclusiva de καί, que indica que também os integrantes do séquito reagiram.
- source_word: οἱ περὶ αὐτὸν ὄντες
  choice: os que estavam ao redor dele
  rationale: Reproduz a expressão descritiva sem especificar indevidamente se eram cortesãos, auxiliares ou companheiros.
- source_word: θεωροῦντες
  choice: ao verem
  rationale: Expressa de modo natural o particípio circunstancial, preservando a relação entre o que testemunharam e sua reação.
- source_word: ἐτράπησαν εἰς τὸ ... ἐπικελεῦσθαι
  choice: passaram a invocar
  rationale: Comunica a mudança de atitude indicada pela construção grega e o caráter de apelo dirigido a Deus.
- source_word: σὺν τοῖς ἡμετέροις
  choice: junto com os nossos
  rationale: Preserva o possessivo substantivado e seu referente implícito; a nota oferece a explicitação contextual provável.
- source_word: τὸν πὰν κράτος ἔχοντα
  choice: aquele que detém todo o poder
  rationale: Mantém a descrição atributiva do grego sem convertê-la desnecessariamente em um título divino fixo.
- source_word: τοῖς παροῦσιν ἐπαμῦναι
  choice: que os socorresse na situação presente
  rationale: Entende τοῖς παροῦσιν como as circunstâncias presentes e explicita o objeto humano implícito de socorrer para produzir português natural; a ambiguidade gramatical é registrada em nota.
- source_word: μὴ περιιδεῖν
  choice: não tolerasse
  rationale: No contexto de uma súplica, traduz a ideia de não olhar passivamente nem permitir que o ato fique sem intervenção.
- source_word: τὴν ἄνομον καὶ ὑπερήφανον πρᾶξιν
  choice: esse ato contrário à lei e arrogante
  rationale: Verte diretamente os dois qualificativos e usa “esse” para ligar o ato à ação anteriormente narrada.
theological_decisions:
- issue: Descrição divina τὸν πὰν κράτος ἔχοντα
  choice: aquele que detém todo o poder
  alternative: o Todo-Poderoso
  rationale: O grego apresenta uma descrição de Deus por seu poder, não necessariamente um título lexicalizado; a tradução conserva essa forma e evita acrescentar terminologia posterior.
- issue: Referente de σὺν τοῖς ἡμετέροις
  choice: junto com os nossos
  alternative: junto com o nosso povo
  rationale: O contexto provavelmente aponta para o povo judeu, mas o substantivo permanece implícito no grego; o texto mantém essa abertura e a nota fornece a leitura contextual.
- issue: Referente de τοῖς παροῦσιν
  choice: na situação presente
  alternative: aos que estavam presentes
  rationale: A forma pode ser entendida como neutra, referindo-se às circunstâncias, ou masculina, referindo-se às pessoas presentes. A leitura circunstancial se ajusta bem à crise narrada, sem ocultar a alternativa.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe narrativa fluente. Evitou-se transformar a descrição de Deus em título fixo e conservaram-se em notas as ambiguidades reais dos referentes implícitos.
