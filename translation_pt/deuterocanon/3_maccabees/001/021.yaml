base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/021.yaml
  text: And varied was the plea of those who had gathered for this[b][a], concerning those who were being impiously handed over by him.
translation:
  language: pt
  text: Diversa, porém, era a súplica[a] dos que haviam se reunido para esse fim, a respeito daqueles que estavam sendo entregues por ele de maneira ímpia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedido insistente” ou “apelo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “de maneira perversa”; o termo também pode destacar a violação do que é santo ou moralmente devido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποικίλη
  choice: diversa
  rationale: Mantém o predicativo singular e expressa que a súplica assumia formas variadas, sem introduzir um plural ausente no grego.
- source_word: δέησις
  choice: súplica
  rationale: Indica um pedido insistente e angustiado; não exige que se trate especificamente de oração dirigida a Deus.
- source_word: συλλεγέντων
  choice: haviam se reunido
  rationale: Forma corrente em português que comunica a reunião do grupo, sem identificar um agente externo, que o texto grego também não explicita.
- source_word: εἰς τοῦτο
  choice: para esse fim
  rationale: Reproduz de modo idiomático a expressão de finalidade, remetendo ao propósito indicado pelo contexto.
- source_word: ἐπὶ τοῖς ... κατεγχειρουμένοις
  choice: a respeito daqueles que estavam sendo ... entregues
  rationale: Conserva a relação ampla da súplica com as pessoas atingidas, sem restringir ἐπί exclusivamente a causa ou benefício.
- source_word: ἀνοσίως
  choice: de maneira ímpia
  rationale: Preserva o caráter moral e religioso da violação sugerida pelo advérbio, em vez de reduzi-lo apenas à ilegalidade.
- source_word: κατεγχειρουμένοις
  choice: estavam sendo entregues
  rationale: Mantém a voz passiva e o aspecto de ação em curso, bem como a imagem de colocar alguém nas mãos ou sob o poder de outro.
- source_word: ὑπʼ ἐκείνου
  choice: por ele
  rationale: Retoma naturalmente em português a figura masculina já mencionada, sem acrescentar identificação ausente no versículo.
theological_decisions:
- issue: Possível sentido religioso de ἀνοσίως
  choice: de maneira ímpia
  alternative: de maneira perversa / ilegalmente
  rationale: O termo pode denunciar uma transgressão do que é santo ou moralmente devido. A tradução escolhida conserva essa dimensão sem especificar uma doutrina.
- issue: Relação expressa por ἐπί com dativo
  choice: a respeito daqueles
  alternative: em favor daqueles / por causa daqueles
  rationale: A formulação escolhida preserva a amplitude da construção grega e evita decidir se a súplica é apresentada estritamente como intercessão ou como reação ao que lhes acontecia.
translation_notes:
  register: Português moderno, claro e digno, com ordem levemente marcada para conservar a ênfase inicial em ποικίλη. A construção passiva foi mantida para acompanhar de perto o grego.
