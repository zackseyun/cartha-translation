base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/003.yaml
  text: Dositheus[a], the one called son of Drimylus, a Jew by birth, but later having changed his customs and become estranged from the ancestral beliefs, lodged some obscure man in the tent in his place[c][b]; and it happened that this man received that one's punishment.
translation:
  language: pt
  text: Enquanto escoltava este homem, Dositeu, conhecido como filho de Drímilo[a], judeu de nascimento, mas que depois mudou os costumes e se afastou das crenças ancestrais[b], fez deitar em seu lugar, na tenda, um homem sem importância[c]; e aconteceu que esse homem recebeu o castigo destinado a Dositeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dositeu, chamado filho de Drímilo”. A formulação grega provavelmente fornece uma identificação patronímica.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “tendo mudado as normas ou os costumes e tendo-se tornado alheio aos ensinamentos ancestrais”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “um homem desconhecido” ou “um homem sem distinção”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δωσίθεος ὁ Δριμύλου λεγόμενος
  choice: Dositeu, chamado filho de Drímilo
  rationale: O genitivo Δριμύλου após λεγόμενος provavelmente expressa identificação patronímica. A formulação é natural em português e conserva a pequena incerteza mediante nota.
- source_word: τὸ γένος Ἰουδαῖος
  choice: judeu de nascimento
  rationale: A expressão indica origem étnica ou familiar, em contraste com o posterior abandono das práticas e crenças ancestrais.
- source_word: μεταβαλὼν τὰ νόμιμα
  choice: mudou as práticas prescritas
  rationale: τὰ νόμιμα abrange costumes, normas e observâncias tradicionais, especialmente no âmbito religioso. 'Práticas prescritas' preserva tanto a dimensão prática quanto a normativa.
- source_word: τῶν πατρίων δογμάτων ἀπηλλοτριωμένος
  choice: se afastou das crenças ancestrais
  rationale: ἀπαλλοτριόω exprime alienação ou afastamento, e πατρίων δογμάτων designa convicções ou ensinamentos herdados. A redação mantém o teor avaliativo sem impor categorias doutrinárias posteriores.
- source_word: ἄσημόν τινα
  choice: um homem sem importância
  rationale: ἄσημος pode indicar alguém sem distinção, notoriedade ou identificação. 'Sem importância' comunica sua baixa condição ou insignificância no contexto, com alternativas registradas em nota.
- source_word: κατέκλινεν ἐν τῇ σκηνῇ
  choice: colocou em seu lugar na tenda
  rationale: κατακλίνω significa literalmente fazer deitar ou reclinar. No contexto, Dositeu põe um substituto na posição vulnerável dentro da tenda; 'em seu lugar' é uma explicitação contextual.
- source_word: ὃν συνέβη κομίσασθαι τὴν ἐκείνου κόλασιν
  choice: e aconteceu que esse homem recebeu o castigo destinado a ele
  rationale: συνέβη preserva a apresentação do desfecho como algo que aconteceu; κομίσασθαι significa aqui receber ou sofrer. 'Destinado a ele' torna clara a referência de ἐκείνου e a substituição, sem alterar a ironia narrativa.
theological_decisions:
- issue: Caracterização do abandono da identidade religiosa ancestral de Dositeu
  choice: mudou as práticas prescritas e se afastou das crenças ancestrais
  alternative: mudou os costumes e se tornou alheio aos ensinamentos de seus antepassados
  rationale: A tradução mantém juntas a mudança de observância e a alienação das convicções herdadas, preservando a avaliação do texto sem importar terminologia confessional posterior.
- issue: Referência do castigo
  choice: o castigo destinado a ele
  alternative: o castigo daquele
  rationale: O grego τὴν ἐκείνου κόλασιν pode designar o castigo pertencente ou reservado a Dositeu. A redação explicita a substituição exigida pelo contexto, sem atribuir uma teoria teológica ao acontecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para evitar ambiguidade sobre quem foi colocado na tenda. As notas preservam as alternativas lexicais relevantes e todos os marcadores aparecem no texto principal.
