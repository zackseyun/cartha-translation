  terminology: «Judeu de nascimento» e «crenças ancestrais» são adequados. «Costumes» comunica τὰ νόμιμα de modo mais idiomático e suficientemente amplo. «Castigo destinado a Dositeu» explicita, em português, a referência contextual de ἐκείνου e evita que «ele» seja entendido como o homem substituto.
