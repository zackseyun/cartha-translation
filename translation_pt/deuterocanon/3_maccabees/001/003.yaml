  to: Enquanto escoltava este homem, Dositeu, conhecido como filho de Drímilo[a], judeu de nascimento, mas que depois mudou os costumes e se afastou das crenças ancestrais[b], fez deitar em seu lugar, na tenda, um homem sem importância[c]; e aconteceu que esse homem recebeu o castigo destinado a Dositeu.
