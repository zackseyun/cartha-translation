base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/002.yaml
  text: But a certain Theodotus[a], having planned to carry out the plot, took the best of the Ptolemaic weapons that had been assigned to him and was conveyed by night to Ptolemy’s tent, to kill him himself and in this way bring the war to an end.
translation:
  language: pt
  text: Mas certo Teódoto, tendo decidido executar a conspiração, tomou as melhores das armas ptolemaicas que lhe haviam sido previamente destinadas e foi levado, de noite, até a tenda de Ptolomeu, a fim de matá-lo ele próprio[a] e, desse modo, pôr fim à guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “matar somente a ele”. O grego μόνος pode enfatizar que Teódoto pretendia realizar pessoalmente o assassinato ou, menos provavelmente, que Ptolomeu seria o único a ser morto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπληρῶσαι τὴν ἐπιβουλήν
  choice: executar a conspiração
  rationale: No contexto de um atentado planejado, ἐκπληρῶσαι indica levar a efeito, e ἐπιβουλή designa uma trama hostil. A expressão é natural e mantém a gravidade do contexto sem acrescentar detalhes.
- source_word: διανοηθείς
  choice: tendo decidido
  rationale: O particípio comunica intenção deliberada. “Tendo decidido” expressa resolução consciente com mais naturalidade em português do que uma reprodução literal ligada apenas ao pensamento.
- source_word: τῶν προυποτεταγμένων αὐτῷ ὅπλων Πτολεμαικῶν τὰ κράτιστα
  choice: as melhores armas ptolemaicas que lhe haviam sido previamente designadas
  rationale: Preserva o superlativo τὰ κράτιστα, a anterioridade de προυποτεταγμένων e a identificação das armas como ptolemaicas.
- source_word: διεκομίσθη νύκτωρ
  choice: foi transportado durante a noite
  rationale: A forma passiva indica que Teódoto foi levado ou conduzido, em vez de simplesmente ter ido por conta própria; νύκτωρ é vertido de modo corrente.
- source_word: ἐπὶ τὴν τοῦ Πτολεμαίου σκηνήν
  choice: até a tenda de Ptolomeu
  rationale: Em contexto militar, σκηνή é naturalmente “tenda”; a construção portuguesa explicita com clareza o destino.
- source_word: ὡς μόνος κτεῖναι αὐτόν
  choice: a fim de matá-lo ele próprio
  rationale: ὡς com infinitivo exprime propósito, e μόνος provavelmente enfatiza que Teódoto pretendia realizar pessoalmente o assassinato. A nota conserva a alternativa sintática genuína.
- source_word: ἐν τούτῳ διαλῦσαι τὸν πόλεμον
  choice: e, desse modo, pôr fim à guerra
  rationale: A expressão apresenta o assassinato como o meio pretendido para encerrar o conflito; “pôr fim à guerra” é idiomático e fiel.
