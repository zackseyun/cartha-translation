base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/004.yaml
  text: And when the battle had become fierce and affairs were turning more strongly in Antiochus’s favor[a], Arsinoe went repeatedly among the troops and earnestly urged them, with pity and tears, her hair let down, to help themselves and their children and wives courageously, promising to give two minas of gold to each man if they won.
translation:
  language: pt
  text: 'Quando a batalha se tornou acirrada e a situação pendia cada vez mais a favor de Antíoco, Arsínoe percorreu as tropas e, com compaixão e lágrimas, os cabelos soltos, exortou-as fervorosamente a socorrer com coragem a si mesmas, seus filhos e suas mulheres. Ela prometeu dar duas minas de ouro[a] a cada um, caso vencessem.


    [a] A mina era uma antiga unidade de peso e de valor monetário; o texto promete a cada soldado duas minas de ouro em caso de vitória.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A mina era uma antiga unidade de peso e de valor monetário; o texto promete a cada soldado duas minas de ouro em caso de vitória.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης ... καρτερᾶς μάχης
  choice: Quando a batalha se tornou acirrada
  rationale: O genitivo absoluto estabelece a circunstância de fundo; “acirrada” comunica de modo natural a intensidade de καρτεράς.
- source_word: τῶν πραγμάτων μᾶλλον ἐρρωμένων τῷ Ἀντιόχῳ
  choice: a situação pendia cada vez mais a favor de Antíoco
  rationale: “Situação” representa o amplo πράγματα; “pendia cada vez mais a favor” conserva o comparativo μᾶλλον e expressa a vantagem crescente de Antíoco sem excessiva explicitação.
- source_word: ἐπιπορευσαμένη τὰς δυνάμεις
  choice: percorreu as tropas
  rationale: A expressão indica movimento por entre ou ao longo das forças militares. “Percorreu” é idiomático e não impõe a ideia incerta de repetição.
- source_word: ἱκανῶς ... παρεκάλει
  choice: exortou-as fervorosamente
  rationale: παρακαλέω aqui expressa apelo ou exortação, e ἱκανῶς intensifica a ação; “fervorosamente” combina com o contexto emocional.
- source_word: μετὰ οἴκτου καὶ δακρύων
  choice: com compaixão e lágrimas
  rationale: Mantém o valor afetivo de οἶκτος sem decidir além do texto se a compaixão era sentida por Arsínoe ou buscava ser despertada nos ouvintes.
- source_word: τοὺς πλοκάμους λελυμένη
  choice: os cabelos soltos
  rationale: Forma portuguesa natural que preserva o gesto visível de aflição ou súplica.
- source_word: βοηθεῖν ἑαυτοῖς τε καὶ τοῖς τέκνοις καὶ ταῖς γυναιξὶν θαρραλέως
  choice: a socorrer com coragem a si mesmas, seus filhos e suas mulheres
  rationale: “Socorrer” permanece próximo de βοηθεῖν, enquanto “com coragem” representa θαρραλέως. A concordância com “tropas” é natural em português; os referentes concretos continuam sendo os soldados.
- source_word: ἐπαγγελλομένη δώσειν
  choice: Ela prometeu dar
  rationale: Transformar o particípio em nova oração melhora a clareza em português sem mudar a relação lógica.
- source_word: νικήσασιν
  choice: caso vencessem
  rationale: 'O particípio aoristo dativo tem aqui sentido condicional: a recompensa dependia da vitória.'
- source_word: ἑκάστῳ δύο μνᾶς χρυσίου
  choice: duas minas de ouro a cada um
  rationale: Mantém a antiga unidade sem conversão especulativa e conserva a distribuição individual expressa por ἑκάστῳ.
