base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/001/009.yaml
  text: Then[a], after being conveyed to Jerusalem, and after sacrificing to the faithful God and offering thanks, and after doing something further for the place, indeed, when he came to the place and was struck with awe by its dignity and piety[c][b],
translation:
  language: pt
  text: Tendo sido levado, porém, a Jerusalém, ofereceu sacrifício ao Deus fiel[a], deu graças e fez ainda algo em favor do lugar[b]; e, chegando então ao lugar[c], ficou tomado de admiração por sua dignidade e piedade,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao Deus digno de confiança”. O adjetivo grego pode indicar fidelidade ou confiabilidade; “fiel” é a tradução mais direta aqui.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é indefinida e não esclarece o que ele fez adicionalmente em favor do lugar.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o local sagrado em Jerusalém, provavelmente o recinto do templo. O grego diz apenas “o lugar”.
    reason: cultural_note
lexical_decisions:
- source_word: διακομισθεὶς
  choice: tendo sido levado
  rationale: Preserva o sentido passivo de deslocamento de um lugar para outro sem especificar o meio de transporte.
- source_word: θύσας
  choice: ofereceu sacrifício
  rationale: Expressa de modo natural e inequívoco a ação cultual do particípio aoristo.
- source_word: τῷ πιστῷ θεῷ
  choice: ao Deus fiel
  rationale: Traduz πιστός diretamente como “fiel”, sem ampliar o sentido para “verdadeiro” nem eliminar a possível nuance de confiabilidade.
- source_word: χάριτας ἀποδιδοὺς
  choice: deu graças
  rationale: Equivalente idiomático corrente para a expressão grega de retribuir ou render agradecimentos.
- source_word: τῶν ἑξῆς τι
  choice: ainda algo
  rationale: Mantém a indefinição de τι e o sentido de uma ação adicional, sem determinar em que consistiu.
- source_word: τῷ τόπῳ ποιήσας
  choice: fez ... em favor do lugar
  rationale: Conserva a amplitude do verbo e entende o dativo como benefício ou consideração pelo local, sem inventar uma ação específica.
- source_word: τὸν τόπον
  choice: o lugar
  rationale: Mantém a designação genérica do grego, embora o contexto aponte para o recinto sagrado de Jerusalém.
- source_word: τῇ σπουδαιότητι
  choice: dignidade
  rationale: Comunica a gravidade, nobreza ou importância solene sugerida pelo termo no contexto sagrado, sem reduzi-lo a esplendor físico.
- source_word: εὐσεβείᾳ
  choice: piedade
  rationale: Preserva o vocabulário religioso e a relativa ambiguidade sobre se a qualidade caracteriza o lugar, seu ambiente ou o culto ali praticado.
- source_word: καταπληγείς
  choice: ficou tomado de admiração
  rationale: Indica que ele foi fortemente impressionado; a formulação é natural em português e apropriada ao contexto reverente.
theological_decisions:
- issue: Sentido de πιστῷ aplicado a Deus
  choice: Deus fiel
  alternative: Deus digno de confiança
  rationale: “Fiel” é a correspondência mais direta e preserva a linguagem teológica do texto sem convertê-la na afirmação distinta “Deus verdadeiro”.
- issue: Identificação de “o lugar”
  choice: o lugar
  alternative: o templo / o santuário
  rationale: Embora o contexto provavelmente indique o templo ou seu recinto, o grego emprega o termo genérico τόπος; a tradução não resolve no texto principal o que o original deixa implícito.
- issue: Relação de “dignidade e piedade” com o lugar
  choice: por sua dignidade e piedade
  alternative: pela dignidade e pela devoção ali demonstrada
  rationale: A construção mantém a atribuição gramatical compacta e a tensão do original, sem explicar “piedade” como referência obrigatória aos adoradores ou às práticas cultuais.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A longa sequência de particípios foi moderadamente reorganizada em verbos coordenados para fluidez, preservando a progressão narrativa e a vírgula final que liga o versículo ao período seguinte.
