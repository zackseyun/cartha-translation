  text: But after becoming emboldened and having by now sent everyone away, he was already making his approach, thinking to bring the matter spoken of before to completion.
translation:
  language: pt
  text: Mas, depois de se tornar ousado e de já ter mandado todos embora, ele já se aproximava, pensando levar a cabo o que havia sido mencionado antes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρασυνθεὶς
  choice: depois de ganhar ousadia
  rationale: Expressa a anterioridade do particípio aoristo e conserva a ideia de alguém que se tornou ousado ou audacioso, sem intensificá-la indevidamente como insolência.
- source_word: πάντας παραπέμψας
  choice: de já ter mandado todos embora
  rationale: Com πάντας como objeto, παραπέμψας indica aqui que ele dispensou ou afastou todos os presentes. A formulação é clara e natural em português.
- source_word: πρόσβασιν ... ἐποιεῖτο
  choice: começava então a se aproximar
  rationale: Traduz idiomaticamente a aproximação em curso indicada pelo substantivo πρόσβασιν com o imperfeito ἐποιεῖτο; «começava» comunica o movimento já iniciado sem sugerir que a entrada tivesse sido consumada.
- source_word: τέλος ἐπιθήσειν
  choice: levar a cabo
  rationale: A locução grega significa completar ou consumar uma ação pretendida, não interrompê-la. «Levar a cabo» preserva esse sentido e soa natural.
- source_word: τῷ προειρημένῳ
  choice: o que havia sido mencionado antes
  rationale: Mantém o particípio substantivado sem acrescentar um referente específico, como «plano» ou «assunto», que o grego não explicita.
