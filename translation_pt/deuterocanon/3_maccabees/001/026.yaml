translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. As duas ocorrências de ἤδη são representadas de modo não mecânico por «já» e «então», evitando uma repetição pesada sem perder a progressão temporal. Não foram necessárias notas de rodapé.
