  yaml_path: translation/deuterocanon/3_maccabees/007/019.yaml
  text: And after they had been brought down in peace[a], with the fitting thanksgivings[b], there also they resolved to keep these days as joyful ones for the whole time of their sojourning.
translation:
  language: pt
  text: Depois de terem sido conduzidos em paz, com as devidas ações de graças[a], ali também decidiram celebrar esses dias como dias alegres durante todo o tempo de sua permanência como estrangeiros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com os devidos louvores” ou “com as devidas confissões”. A palavra grega pode indicar confissão, louvor ou ação de graças; o contexto festivo favorece “ações de graças”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega se refere à condição de quem reside como estrangeiro ou vive temporariamente fora de sua terra; não implica necessariamente exílio formal.
    reason: cultural_note
lexical_decisions:
- source_word: καταχθέντες
  choice: depois de serem conduzidos de volta
  rationale: O particípio aoristo passivo de κατάγω pode indicar ser levado para baixo ou conduzido de volta. No contexto de retorno ao seu lugar, “conduzidos de volta” comunica o movimento sem especificar além do que o texto permite.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Expressa a condição ou a maneira pacífica e segura em que ocorreu o retorno.
- source_word: ἐν ταῖς πρεπούσαις ἐξομολογήσεσιν
  choice: com as devidas ações de graças
  rationale: ἐξομολόγησις pode significar confissão, louvor ou ação de graças. O contexto festivo favorece “ações de graças”, enquanto πρεπούσαις indica aquilo que é devido ou apropriado.
- source_word: ἔστησαν
  choice: decidiram
  rationale: Embora o verbo tenha o sentido básico de pôr ou ficar de pé, sua construção com o infinitivo aqui expressa uma decisão ou determinação.
- source_word: ἄγειν τὰς ἡμέρας
  choice: celebrar esses dias
  rationale: ἄγειν, quando empregado com dias festivos, significa observá-los ou celebrá-los. “Celebrar” combina naturalmente com o caráter alegre atribuído aos dias.
- source_word: ἐπὶ τὸν τῆς παροικίας αὐτῶν χρόνον
  choice: durante todo o tempo de sua permanência como estrangeiros
  rationale: παροικία designa a residência de quem vive fora de sua terra ou como estrangeiro. A formulação preserva essa nuance sem impor a ideia mais forte de exílio formal.
- source_word: εὐφροσύνους
  choice: com alegria
  rationale: O adjetivo caracteriza os dias como alegres. Em português, “celebrar esses dias com alegria” transmite de modo natural sua força predicativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Conduzidos de volta” evita o literalismo pouco natural de “levados para baixo”; “permanência como estrangeiros” preserva a nuance social e cultural de παροικία.
