    issue: “contaminados” para μεμιαμμένων
    rationale: No uso moderno, “contaminados” normalmente remete a contágio ou poluição material. O grego designa pessoas tidas como maculadas/impuras, com possível dimensão ritual ou moral.
  - severity: low
    issue: Explicitação de “público” no texto principal
    rationale: παραδειγματισμοί comporta a ideia de exemplo, advertência ou exposição desonrosa, frequentemente pública, mas o texto grego não exige que “público” seja explicitado na tradução principal. A nota pode registrar essa possibilidade.
