review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a ênfase de αὐτοὶ τε, o valor iterativo dos imperfeitos e o encontro casual expresso por τὸν ἐμπεσόντα. Contudo, “contaminados” tende, no português atual, a sugerir contaminação física; “impuros” comunica melhor a categoria de mácula ritual ou moral de μεμιαμμένων. A formulação final deve manter a força exemplar de μετὰ παραδειγματισμῶν sem afirmar como certo um modo específico de execução.
  naturalness: A frase é compreensível e de registro apropriado, mas “dentre os contaminados” soa menos idiomático e menos preciso no contexto religioso-moral. “Um compatriota dos impuros” é mais direto. “Fazendo dele um exemplo público” é natural, mas “de modo exemplar” preserva melhor a construção grega com μετά e evita uma explicitação pública excessivamente rígida no texto principal.
  terminology: “Impuros” é preferível a “contaminados” para μεμιαμμένων. “Compatriota” traduz bem ὁμοεθνῆ. “Eliminar” é possível para ἀνήρουν, mas “tiravam-lhes a vida” exprime inequivocamente o resultado letal e conserva a variação em relação a “matavam”.
  issues:
