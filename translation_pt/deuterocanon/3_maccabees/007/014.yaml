  text: They themselves also killed along the road any compatriot of the defiled people who had fallen in with them[a], and they did away with them as examples.
translation:
  language: pt
  text: Eles próprios também matavam, pelo caminho, qualquer compatriota dos impuros que encontrassem e lhes tiravam a vida de modo exemplar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com punições exemplares” ou “expondo-os à desonra pública”. A expressão grega pode enfatizar que eram tratados como exemplo ou advertência, possivelmente mediante humilhação pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ τε
  choice: Eles próprios também
  rationale: Preserva a ênfase no sujeito e a força conectiva da expressão grega em português natural.
- source_word: τὸν ἐμπεσόντα
  choice: que cruzasse com eles
  rationale: No contexto de um encontro durante a viagem, expressa a ocorrência casual sem acrescentar a ideia mais forte de captura.
- source_word: τῶν μεμιαμμένων
  choice: dentre os contaminados
  rationale: O particípio perfeito de μιαίνω descreve pessoas consideradas contaminadas ou impuras, em sentido ritual ou moral; o partitivo é preservado por “dentre”.
- source_word: ὁμοεθνῆ
  choice: qualquer compatriota
  rationale: Expressa alguém pertencente ao mesmo povo; “qualquer” torna natural em português o singular grego de valor genérico.
- source_word: κατὰ τὴν ὁδὸν
  choice: pelo caminho
  rationale: Mantém a circunstância espacial do encontro em formulação corrente e digna.
- source_word: ἀπέκτεννον
  choice: matavam
  rationale: Traduz diretamente o ato de matar, e o imperfeito português preserva o caráter repetido da ação.
- source_word: μετὰ παραδειγματισμῶν
  choice: fazendo dele um exemplo público
  rationale: Comunica a ideia de exposição exemplar como advertência, sem decidir se a ênfase recai principalmente sobre punição, publicidade ou desonra.
- source_word: ἀνήρουν
  choice: o eliminavam
  rationale: Preserva o segundo verbo letal do grego e evita repetir literalmente “matavam”.
