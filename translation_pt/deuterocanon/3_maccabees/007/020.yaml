base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/020.yaml
  text: After also inscribing these things on a pillar[a], and establishing a place of prayer at the site of the banquet, they departed unharmed, free, and overflowing with joy, being brought safely back by land and sea and rivers, by the king’s command[b],
translation:
  language: pt
  text: Depois de também registrarem essas coisas numa coluna[a] e estabelecerem um lugar de oração no local do banquete, partiram ilesos, livres e cheios de alegria, sendo conduzidos em segurança por terra, mar e rios, por ordem do rei[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consagrarem essas coisas numa estela”. O verbo grego pode indicar a exposição pública ou a dedicação de uma inscrição; “estela” é uma pedra erguida como monumento.
    reason: lexical_alternative
  - marker: b
    text: Ou “sendo preservados em segurança por terra, mar e rios”. O particípio grego enfatiza sua preservação ao longo da viagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιερώσαντες
  choice: registrarem
  rationale: No contexto de ἐν στήλῃ, indica tornar público e permanente o registro numa coluna ou estela; “registrarem” preserva a ação sem reduzir o verbo apenas ao ato material de gravar.
- source_word: στήλῃ
  choice: coluna
  rationale: Designa uma pedra erguida com função monumental ou epigráfica. “Coluna” é clara ao leitor comum; a nota registra a alternativa técnica “estela”.
- source_word: κατὰ τὸν τῆς συμποσίας τόπον
  choice: no local do banquete
  rationale: Expressa naturalmente o sentido locativo da frase e sua ligação com o banquete mencionado no contexto.
- source_word: προσευχῆς
  choice: de oração
  rationale: Com τόπον, forma a expressão natural “lugar de oração”.
- source_word: καθιδρύσαντες
  choice: estabelecerem
  rationale: Comunica a instalação duradoura do lugar, sem sugerir detalhes institucionais ausentes do grego.
- source_word: ἀνέλυσαν
  choice: partiram
  rationale: O verbo indica partir ou levantar acampamento; “partiram” evita acrescentar a ideia direcional de retorno.
- source_word: ἀσινεῖς
  choice: ilesos
  rationale: Expressa de modo conciso que não sofreram dano.
- source_word: ἐλεύθεροι
  choice: livres
  rationale: Correspondência direta que ressalta sua liberdade após o perigo e a restrição anteriores.
- source_word: ὑπέρχαρεις
  choice: cheios de alegria
  rationale: Transmite a intensidade do composto grego em português natural e digno.
- source_word: ἀνασωζόμενοι
  choice: sendo conduzidos em segurança
  rationale: Preserva o valor passivo de proteção e chegada segura sem introduzir explicitamente a noção de “volta”, que é contextual, mas não lexicalmente necessária.
- source_word: διὰ τε γῆς καὶ θαλάσσης καὶ ποταμῶν
  choice: por terra, mar e rios
  rationale: Mantém as três modalidades do percurso e o plural de ποταμῶν em formulação portuguesa fluente.
- source_word: τῇ τοῦ βασιλέως ἐπιταγῇ
  choice: por ordem do rei
  rationale: Traduz diretamente a ordem autoritativa do rei e conserva a relação instrumental ou causal da construção.
theological_decisions:
- issue: Ação religiosa comemorativa no local do banquete
  choice: O texto apresenta o estabelecimento duradouro de um lugar de oração ligado ao registro numa coluna.
  alternative: Entender que o lugar foi apenas designado temporariamente para oração.
  rationale: A combinação de καθιδρύσαντες com o registro monumental favorece uma ação estável, mas a tradução não acrescenta finalidade memorial explícita.
- issue: Agente da preservação em ἀνασωζόμενοι
  choice: Manter o particípio passivo sem nomear quem os protege ou conduz.
  alternative: Explicitar a ação providencial de Deus ou traduzir “sendo levados de volta em segurança”.
  rationale: Embora o contexto mais amplo trate de livramento divino, esta oração não nomeia Deus e associa a viagem segura à ordem do rei; a tradução preserva essa tensão e evita acrescentar um agente ou direção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a estrutura contínua do grego e a vírgula final, pois o versículo prossegue sintaticamente. Os marcadores [a] e [b] aparecem no texto principal.
