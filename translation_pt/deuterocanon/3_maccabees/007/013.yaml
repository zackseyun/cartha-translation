base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/013.yaml
  text: Then the priests of these people and the whole multitude[a], having praised him as was fitting, cried out[b], “Hallelujah!” and departed with joy.
translation:
  language: pt
  text: 'Então os sacerdotes desse povo e toda a multidão, depois de o[a] aclamarem como convinha, bradaram: “Aleluia!”[b] e partiram com alegria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “o” provavelmente se refere a Deus; o grego não repete o nome de modo explícito.
    reason: alternative_reading
  - marker: b
    text: Aclamação litúrgica de origem hebraica, com o sentido de “Louvem a Yah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατευφημήσαντες
  choice: depois de ... aclamarem
  rationale: O particípio expressa louvor público e enfático. “Aclamarem” preserva essa dimensão pública sem especificar indevidamente um ato litúrgico mais restrito.
- source_word: αὐτόν
  choice: o
  rationale: O grego traz um pronome masculino singular. O contexto provavelmente aponta para Deus, mas a tradução mantém o pronome para não explicitar no texto principal um referente que o original deixa implícito.
- source_word: ὡς πρέπει ἦν
  choice: como convinha
  rationale: A expressão indica aquilo que era apropriado ou devido; “como convinha” é natural, digna e conserva o valor do imperfeito.
- source_word: οἱ τούτων ἱερεῖς
  choice: os sacerdotes desse povo
  rationale: O demonstrativo no genitivo significa literalmente “os sacerdotes destes”. “Desse povo” torna clara a relação em português corrente sem reduzir a expressão a um pronome possessivo ambíguo.
- source_word: πᾶν τὸ πλῆθος
  choice: toda a multidão
  rationale: A tradução preserva tanto a totalidade indicada por πᾶν quanto o sentido coletivo de πλῆθος.
- source_word: ἐπιφωνήσαντες
  choice: bradaram
  rationale: O verbo descreve uma exclamação em voz alta. “Bradaram” mantém a intensidade e o tom elevado da cena.
- source_word: ἀλληλουιά
  choice: Aleluia
  rationale: Trata-se de uma aclamação litúrgica hebraica transliterada no grego. “Aleluia” é a forma consagrada e amplamente compreendida em português.
- source_word: μετὰ χαρᾶς
  choice: com alegria
  rationale: Reproduz diretamente a locução preposicional grega e mantém o substantivo “alegria”.
- source_word: ἀνέλυσαν
  choice: partiram
  rationale: No contexto do encerramento de uma reunião, o verbo significa partir, retirar-se ou dispersar-se. “Partiram” aplica-se naturalmente tanto aos sacerdotes quanto à multidão.
theological_decisions:
- issue: Referente de αὐτόν
  choice: O pronome é mantido como “o”, sem ser expandido para “Deus”.
  alternative: Deus
  rationale: Embora o contexto indique provavelmente Deus como referente, o grego usa apenas um pronome. A tradução preserva essa implicitude e registra a identificação provável em nota.
- issue: Forma de ἀλληλουιά
  choice: Aleluia
  alternative: Louvem a Yah
  rationale: A transliteração conserva o caráter de aclamação litúrgica presente no grego; a tradução etimológica é informativa, mas menos adequada ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem da frase foi ajustada para fluência, sem eliminar a sequência das ações nem a ambiguidade do referente pronominal.
