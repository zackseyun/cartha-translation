base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/012.yaml
  text: And when he accepted that they were speaking the truth and encouraged them[a], he gave them full permission, so that they might destroy those who had transgressed the law of God throughout every place under his kingdom, with boldness[b], without any royal authority or oversight.
translation:
  language: pt
  text: Ele, porém, reconheceu que eles diziam a verdade e os encorajou. Então lhes deu plena permissão para que destruíssem os que haviam transgredido a lei de Deus em todo lugar sob o seu domínio, agindo abertamente[a], sem qualquer autoridade ou supervisão real.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com ousadia” ou “com plena liberdade”. O termo grego pode indicar ação franca, aberta e livre de constrangimento.
    reason: lexical_alternative
  - marker: b
    text: 'A frase final também pode ser traduzida: “sem qualquer autoridade ou inspeção régia”. Pode enfatizar a ausência de exercício de autoridade e de supervisão oficial direta na execução da medida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τἀληθὲς αὐτοὺς λέγειν παραδεξάμενος
  choice: reconheceu que eles diziam a verdade
  rationale: Expressa naturalmente em português o particípio παραδεξάμενος como aceitação da veracidade do relato, enquanto τἀληθές substantivado com λέγειν significa “dizer a verdade”.
- source_word: παραινέσας
  choice: os encorajou
  rationale: O verbo pode indicar aconselhar, exortar ou encorajar; neste contexto, “encorajou” preserva o impulso dado por ele sem especificar além do grego.
- source_word: ἄδειαν πάντων
  choice: plena permissão
  rationale: ἄδεια denota licença ou liberdade, e πάντων amplia seu alcance; “plena permissão” é claro e idiomático.
- source_word: τοὺς παραβεβηκότας τοῦ θεοῦ τὸν νόμον
  choice: os que haviam transgredido a lei de Deus
  rationale: O particípio perfeito descreve pessoas cuja transgressão já ocorreu e as caracteriza; a formulação preserva tanto o aspecto quanto a gravidade formal.
- source_word: ἐξολεθρεύσωσιν
  choice: destruíssem
  rationale: O verbo exprime destruição completa. “Destruíssem” mantém a força do original sem substituí-la por um eufemismo ou por terminologia moderna mais específica.
- source_word: κατὰ πάντα τὸν ὑπὸ τῆς βασιλείας αὐτοῦ τόπον
  choice: em todos os lugares sob o seu reino
  rationale: Reproduz o alcance distributivo por todo o território sujeito ao reino, em português natural.
- source_word: μετὰ παρρησίας
  choice: agindo abertamente
  rationale: παρρησία pode exprimir franqueza, liberdade aberta ou ousadia. Aqui modifica a execução da medida; “agindo abertamente” é natural e conserva a ideia de ação sem ocultação ou constrangimento.
- source_word: ἄνευ πάσης βασιλικῆς ἐξουσίας καὶ ἐπισκέψεως
  choice: sem qualquer autorização ou supervisão do rei
  rationale: No contexto da permissão já concedida, ἐξουσία é plausivelmente autorização ou exercício direto de autoridade real, e ἐπίσκεψις é supervisão, inspeção ou intervenção. A formulação evita a impressão contraditória de ausência absoluta de permissão régia.
theological_decisions:
- issue: Enquadramento moral da destruição dos transgressores
  choice: Manter a declaração direta de que receberam permissão para destruí-los.
  alternative: Atenuar como “punir”, “afastar” ou “remover”.
  rationale: ἐξολεθρεύσωσιν é um verbo forte de destruição; a tradução não deve suavizar a violência nem acrescentar uma avaliação moral ausente do versículo.
- issue: Natureza da ausência de envolvimento real na frase final
  choice: Traduzir como ausência de autorização ou supervisão direta do rei, preservando a dificuldade contextual.
  alternative: “Sem qualquer autoridade ou fiscalização régia”, que pode sugerir que a ação carecia da permissão que o próprio rei acabara de conceder.
  rationale: O grego admite tensão entre a licença geral concedida e a falta de participação oficial direta. A tradução e a nota preservam essa tensão, sem resolvê-la doutrinariamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A divisão em duas frases evita um período excessivamente longo. “Do rei” é mais natural do que “real” neste contexto e esclarece que a frase final trata do envolvimento régio. Todos os marcadores de nota aparecem no texto.
