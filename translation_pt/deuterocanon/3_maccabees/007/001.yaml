    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεὺς
  choice: O rei
  rationale: O substantivo funciona como título real no cabeçalho da carta; em português, o artigo definido produz uma formulação natural.
- source_word: Πτολεμαῖος Φιλοπάτωρ
  choice: Ptolemeu Filópator
  rationale: O nome e o epíteto são transliterados segundo as formas consagradas em português, sem traduzir o sentido do epíteto.
- source_word: τοῖς κατʼ Αἴγυπτον στρατηγοῖς
  choice: aos generais no Egito
  rationale: στρατηγοῖς designa generais ou comandantes, e κατʼ Αἴγυπτον indica sua localização ou distribuição pelo Egito; a nota preserva a nuance distributiva possível.
- source_word: πᾶσιν τοῖς τεταγμένοις ἐπὶ πραγμάτων
  choice: a todos os encarregados dos assuntos administrativos
  rationale: τεταγμένοις indica pessoas designadas ou encarregadas, enquanto ἐπὶ πραγμάτων expressa responsabilidade por assuntos de governo; 'administrativos' explicita o contexto sem reduzir os destinatários a um cargo moderno específico.
- source_word: χαίρειν
  choice: saudações
  rationale: Na abertura epistolar grega, o infinitivo funciona como saudação convencional, e não como uma ordem literal para alegrar-se.
- source_word: ἐρρῶσθαι
  choice: boa saúde
  rationale: Na fórmula epistolar, expressa o desejo de que os destinatários estejam fortes, bem ou com saúde.
