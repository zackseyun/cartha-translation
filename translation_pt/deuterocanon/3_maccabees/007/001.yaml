  text: 'King Ptolemy Philopator to the generals in Egypt and to all who are appointed over affairs: greetings and good health[a][b].'
translation:
  language: pt
  text: 'O rei Ptolemeu Filópator, aos generais no Egito e a todos os encarregados de assuntos: saudações e boa saúde.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos generais por todo o Egito”; a expressão grega também pode ter sentido distributivo.'
    reason: lexical_alternative
  - marker: b
