base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/009.yaml
  text: For know that if we devise any evil against these people, or grieve them in any way at all, we will have against us for vengeance in these matters, utterly without escape and forever, not a man but God Most High, the one who rules over all power. Farewell.
translation:
  language: pt
  text: Pois saibam que, se tramarmos algum mal contra essas pessoas ou as afligirmos de qualquer modo, teremos contra nós, para nos punir por esses atos, não um ser humano, mas o Deus Altíssimo, que domina sobre todo poder, como adversário em todos os aspectos, inevitavelmente e para sempre. Passem bem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοτεχνήσωμεν πονηρόν
  choice: tramarmos algum mal
  rationale: Reproduz a ideia de arquitetar ou maquinar algo perverso, em linguagem portuguesa natural e clara.
- source_word: ἐπιλυπήσωμεν αὐτοὺς τὸ σύνολον
  choice: lhes causarmos qualquer tipo de sofrimento
  rationale: 'Expressa o ato de afligir ou entristecer, enquanto τὸ σύνολον reforça a abrangência: de qualquer modo ou absolutamente.'
- source_word: τὸν πάσης δεσπόζοντα δυνάμεως
  choice: que domina sobre todo poder
  rationale: Mantém a afirmação de soberania sobre toda força ou poder sem restringir δυνάμεως a um único sentido.
- source_word: ἐπʼ ἐκδίκησιν τῶν πραγμάτων
  choice: para vingar esses atos
  rationale: Entende πράγματα como os atos mencionados e ἐκδίκησις como retribuição punitiva ou vingança.
- source_word: κατὰ πᾶν ἀφεύκτως διὰ παντός
  choice: em todos os sentidos, inevitavelmente e para sempre
  rationale: Preserva a acumulação enfática do grego, que destaca o caráter total, inescapável e permanente da oposição divina.
- source_word: ἐρρῶσθε
  choice: Passem bem
  rationale: Fórmula epistolar de despedida, equivalente natural e digna em português.
theological_decisions:
- issue: Identidade daquele que se opõe aos perseguidores
  choice: não um ser humano, mas o Deus Altíssimo
  alternative: não um homem, mas o Deus Altíssimo
  rationale: Preserva o contraste explícito entre agente humano e divino, usando formulação inclusiva e corrente sem alterar o conteúdo teológico.
- issue: Relação de Deus com todo poder
  choice: que domina sobre todo poder
  alternative: Senhor de todo poder
  rationale: Conserva a forma verbal de δεσπόζοντα e a possível amplitude de δύναμις, evitando importar um título técnico não exigido pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A longa estrutura grega foi pontuada para clareza, mas sua sequência lógica e sua ênfase cumulativa foram preservadas.
