  naturalness: «Benevolência de amigo» e «como um pai em favor dos filhos» são compreensíveis, mas soam pouco idiomáticas no português moderno. «Boa vontade própria de um amigo» e «como um pai pelos filhos» comunicam o mesmo conteúdo de forma mais natural e digna.
  terminology: «Boa vontade» é uma equivalência clara e contemporânea para εὔνοια. «Absolvemos» corresponde bem ao contexto jurídico de ἀπολελύκαμεν, sem especificar indevidamente a natureza da acusação. A formulação final conserva a abrangência de πάσης καθʼ ὁντινοῦν αἰτίας τρόπον.
