base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/007.yaml
  text: Considering that he has always fought alongside us like a father for his sons[a], and reckoning the firm goodwill they have toward us and our forefathers as that of a friend[b], we have rightly released them in every way from any charge whatever.
translation:
  language: pt
  text: Considerando que ele tem sempre combatido ao nosso lado, como um pai pelos filhos, e a firme boa vontade própria de um amigo que eles têm para conosco e nossos antepassados, com justiça os absolvemos plenamente de toda e qualquer acusação[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de toda e qualquer causa de acusação, de qualquer modo”. A expressão grega final é enfática e reúne termos de alcance abrangente; em contexto jurídico, indica uma liberação completa de toda possível acusação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς πατέρα ὑπὲρ υἱῶν
  choice: como um pai em favor dos filhos
  rationale: ὡς introduz uma comparação, e ὑπέρ expressa ação em benefício ou defesa de alguém. A formulação preserva a imagem paterna sem acrescentar um possessivo ausente do grego.
- source_word: διὰ παντὸς συμμαχοῦντα
  choice: sempre combateu ao nosso lado
  rationale: διὰ παντός indica continuidade, enquanto συμμαχέω pode significar combater junto ou prestar auxílio como aliado. A opção conserva a nuance militar sem excluir a ideia mais ampla de apoio aliado.
- source_word: τήν τε τοῦ φίλου ... βεβαίαν ... εὔνοιαν
  choice: a firme benevolência de amigo
  rationale: βεβαίαν qualifica εὔνοιαν como firme ou constante; τοῦ φίλου caracteriza essa disposição como própria de um amigo. A expressão portuguesa mantém a construção relacional compacta do grego.
- source_word: ἣν ἔχουσιν ... πρὸς ἡμᾶς καὶ τοὺς προγόνους ἡμῶν
  choice: que eles mantêm para conosco e nossos antepassados
  rationale: ἔχω com εὔνοια denota nutrir ou manter uma disposição favorável, e πρός assinala aqueles a quem ela se dirige.
- source_word: ἀναλογιζόμενοι
  choice: Considerando ... e levando em conta
  rationale: O particípio apresenta as razões ponderadas para a decisão. A variação verbal em português torna claras as duas considerações coordenadas sem alterar sua relação sintática.
- source_word: δικαίως ἀπολελύκαμεν
  choice: com justiça os livramos
  rationale: δικαίως qualifica a decisão como justa; o perfeito ἀπολελύκαμεν descreve uma libertação ou desobrigação já efetuada, com resultado vigente.
- source_word: πάσης καθʼ ὁντινοῦν αἰτίας τρόπον
  choice: plenamente de toda e qualquer acusação
  rationale: A expressão grega é cumulativa e enfática. Em contexto jurídico, αἰτία pode indicar acusação ou imputação; “plenamente” comunica a abrangência reforçada por πάσης, καθʼ ὁντινοῦν e τρόπον sem reproduzir uma sequência pouco natural em português.
