base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/008.yaml
  text: And we have ordered each and every one to return to his own home[a], with absolutely no one in any way harming them[b], nor insulting them over the things that happened contrary to reason.
translation:
  language: pt
  text: E ordenamos que todos voltem, cada um para o que é seu[a], sem que absolutamente ninguém lhes cause dano de modo algum, nem os insulte por causa do que aconteceu contra a razão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para sua própria casa”, “para seus próprios lugares” ou “para seus bens”. A expressão grega pode designar aquilo que pertence a alguém, inclusive seu lar ou lugar próprio.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por causa do que aconteceu de maneira irracional” ou “por causa dos acontecimentos absurdos”. A expressão grega significa literalmente “contra a razão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προστετάχαμεν
  choice: ordenamos
  rationale: O perfeito grego apresenta uma ordem já emitida e ainda vigente; “ordenamos” preserva a força oficial com linguagem portuguesa natural.
- source_word: ἑκάστῳ πάντας
  choice: que todos voltem, cada um
  rationale: A formulação mantém tanto a totalidade expressa por πάντας quanto a distribuição individual de ἑκάστῳ, evitando reduzir um dos dois elementos.
- source_word: εἰς τὰ ἴδια ἐπιστρέφειν
  choice: voltem, cada um para o que é seu
  rationale: τὰ ἴδια pode referir-se ao lar, aos bens ou ao lugar próprio. A tradução conserva essa amplitude em vez de restringi-la apenas à casa.
- source_word: ἐν παντὶ τρόπῳ
  choice: de modo algum
  rationale: No contexto da proibição, a expressão reforça que nenhuma forma de dano é permitida.
- source_word: μηθενὸς αὐτοὺς τὸ σύνολον καταβλάπτοντος
  choice: sem que absolutamente ninguém lhes cause dano
  rationale: A construção absoluta é reproduzida por “sem que”; “absolutamente ninguém” comunica a negação enfática reforçada por τὸ σύνολον.
- source_word: μήτε ὀνειδίζοντος
  choice: nem os insulte
  rationale: ὀνειδίζω abrange censurar, lançar em rosto e insultar; “insulte” é claro e apropriado ao abuso verbal aqui proibido.
- source_word: περὶ τῶν γεγενημένων παρὰ λόγον
  choice: por causa do que aconteceu contra a razão
  rationale: A tradução mantém a referência aos acontecimentos já ocorridos e preserva a expressão avaliativa παρὰ λόγον sem decidir se significa irracionalidade, absurdo ou falta de razoabilidade.
