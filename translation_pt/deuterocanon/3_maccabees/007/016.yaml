base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/016.yaml
  text: But those who had held fast to God even to death[a], having obtained complete deliverance, departed from the city, strewn with all kinds of very fragrant flowers, with rejoicing and shouting, giving thanks with praises and full songs of hymns to God, the holy Savior of Israel[b], the God of their fathers.
translation:
  language: pt
  text: Mas aqueles que se haviam mantido fiéis a Deus até a morte, tendo alcançado completa libertação[a], partiram da cidade cobertos de toda espécie de flores muito perfumadas, com alegria e aclamações, dando graças, com louvores e hinos ricamente melodiosos, ao Deus de seus antepassados, o santo Salvador de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo desfrutado plena salvação”. A palavra grega pode indicar o livramento neste contexto e também carregar o sentido mais amplo de salvação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o santo Libertador de Israel”. O termo grego pode ser traduzido por “Salvador” ou “Libertador”, conforme se destaque o título divino ou o resgate imediato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέχρι θανάτου τὸν θεὸν ἐσχηκότες
  choice: se haviam mantido fiéis a Deus até a morte
  rationale: A construção com ἔχω é idiomática e expressa apego ou lealdade perseverante, não posse literal. “Até a morte” conserva o limite extremo sem afirmar que eles de fato morreram.
- source_word: παντελῆ σωτηρίαν ἀπόλαυσιν ἐσχηκότες
  choice: tendo alcançado completa libertação
  rationale: No contexto narrativo, σωτηρία designa o livramento da destruição ameaçada; “libertação” mantém a ressonância salvífica sem perder o sentido histórico imediato. παντελής é preservado por “completa”.
- source_word: ἀνέζευξαν
  choice: partiram
  rationale: O verbo pode indicar levantar acampamento ou pôr-se a caminho. “Partiram” comunica naturalmente a saída da cidade sem acrescentar uma forma específica de deslocamento.
- source_word: παντοίοις εὐωδεστάτοις ἄνθεσι κατεστρωμένοι
  choice: cobertos de toda espécie de flores muito perfumadas
  rationale: O particípio descreve os participantes ornamentados ou recobertos de flores. “Muito perfumadas” transmite a força superlativa de εὐωδεστάτοις em português natural.
- source_word: μετʼ εὐφροσύνης καὶ βοῆς
  choice: com alegria e aclamações
  rationale: εὐφροσύνη denota alegria festiva, enquanto βοή indica clamor em voz alta. “Aclamações” se ajusta ao contexto de celebração pública.
- source_word: ἐν αἴνοις καὶ παμμελέτοις ὕμνοις
  choice: com louvores e hinos em todos os tons
  rationale: αἶνοι são louvores; o raro παμμελέτοις sugere hinos dotados de toda melodia ou plenamente musicais. “Em todos os tons” conserva a amplitude musical sem impor uma forma litúrgica específica.
- source_word: τῷ θεῷ τῶν πατέρων αὐτῶν
  choice: ao Deus de seus antepassados
  rationale: A expressão ancestral e pactual é mantida em linguagem inclusiva e corrente; “antepassados” evita que “pais” seja entendido apenas como progenitores imediatos.
- source_word: ἁγίῳ σωτῆρι τοῦ Ἰσραήλ
  choice: o santo Salvador de Israel
  rationale: σωτήρ funciona aqui como título divino. “Salvador” preserva a dignidade teológica, enquanto a nota registra o sentido contextual alternativo de “Libertador”.
theological_decisions:
- issue: Sentido de σωτηρία e σωτήρ no relato de um livramento histórico
  choice: Traduzir σωτηρία por “libertação” e o título σωτήρ por “Salvador”
  alternative: Empregar “salvação/Salvador” em ambos os casos, ou “libertação/Libertador” em ambos
  rationale: O versículo une um resgate histórico concreto a uma doxologia elevada. A distinção lexical preserva simultaneamente o evento narrativo e a força titular de σωτήρ, sem separar artificialmente os dois sentidos.
- issue: Relação das designações divinas no encerramento
  choice: Tratar “o santo Salvador de Israel” como aposição a “o Deus de seus antepassados”
  alternative: Reordenar as designações ou entendê-las como destinatários distintos
  rationale: 'Os dativos gregos formam uma única identificação do destinatário da ação de graças: Deus é ao mesmo tempo o Deus dos antepassados deles e o santo Salvador de Israel.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase longa do grego foi dividida em duas para clareza, sem alterar a sequência dos acontecimentos. “Aclamações” evita a conotação negativa que “gritos” poderia adquirir, e “antepassados” comunica naturalmente a fórmula ancestral.
