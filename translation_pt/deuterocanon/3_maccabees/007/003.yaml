base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/003.yaml
  text: Some of our friends[a], being more constantly at our side out of malice, persuaded us that the Jews under our rule, after being gathered together in groups[b], should be punished with unusual penalties as rebels.
translation:
  language: pt
  text: Alguns dos nossos amigos, movidos por maldade e mantendo-se com mais frequência ao nosso lado, persuadiram-nos a punir os judeus sob o nosso domínio, depois de se organizarem em grupos[a], com castigos incomuns[b], por terem se revoltado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em associações” ou “em corpos organizados”. O termo grego pode designar um agrupamento ou uma associação organizada; seu sentido exato aqui é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “com castigos extraordinários”. O termo grego descreve os castigos como estranhos, excepcionais ou fora do comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν φίλων τινὲς
  choice: Alguns dos nossos amigos
  rationale: φίλοι significa normalmente “amigos”; embora possa designar cortesãos ou membros do círculo real, o texto não exige que se especifique um cargo.
- source_word: κατὰ κακοήθειαν
  choice: movidos por maldade
  rationale: A expressão indica que a conduta procedia de má índole ou má intenção; esta formulação comunica o motivo com naturalidade.
- source_word: πυκνότερον ἡμῖν παρακείμενοι
  choice: mantendo-se com mais frequência ao nosso lado
  rationale: παράκειμαι expressa proximidade, e o comparativo πυκνότερον acrescenta a ideia de frequência ou assiduidade; a tradução conserva ambos os elementos.
- source_word: συνέπεισαν ἡμᾶς
  choice: convenceram-nos
  rationale: O verbo composto denota persuadir ou induzir alguém, e “convenceram-nos” é claro e corrente.
- source_word: τοὺς ὑπὸ τὴν βασιλείαν Ἰουδαίους
  choice: os judeus sob o nosso domínio
  rationale: A expressão identifica os judeus sujeitos ao governo do rei; “nosso domínio” torna explícito o valor político sem acrescentar uma ideia religiosa.
- source_word: συναθροίσαντας
  choice: depois de reunidos
  rationale: O particípio aoristo sugere uma ação anterior à punição. A formulação passiva segue o sentido contextual de uma reunião efetuada pelas autoridades, sem sobrecarregar a frase.
- source_word: τὰ συστήματα
  choice: em grupos
  rationale: σύστημα pode designar um corpo organizado, associação ou agrupamento. “Em grupos” é natural em português e deixa a extensão exata do termo para a nota.
- source_word: ξενιζούσαις ... τιμωρίαις
  choice: com castigos incomuns
  rationale: ξενίζω pode transmitir a ideia de algo estranho, extraordinário ou fora do habitual; “castigos incomuns” preserva esse valor sem enfraquecer a severidade do contexto.
- source_word: ἀποστάντων
  choice: como revoltosos
  rationale: No contexto político e administrativo, o particípio de ἀφίστημι aponta para rebelião ou deserção. “Revoltosos” evita a conotação especificamente religiosa de “apóstatas”.
theological_decisions:
- issue: Sentido de ἀποστάντων
  choice: revolta ou deserção política
  alternative: apostasia religiosa
  rationale: O rei descreve a alegação usada para justificar uma punição estatal contra súditos judeus. O contexto favorece rebelião política, embora o verbo possa ter sentido religioso em outros contextos.
- issue: Sentido de τὰ συστήματα
  choice: grupos ou corpos organizados
  alternative: comunidades ou associações formais
  rationale: O substantivo pode indicar um agrupamento organizado, mas o grau de formalidade não é seguro; o texto principal usa uma expressão ampla e a nota preserva as alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente reorganizada para clareza, mantendo a voz régia no plural e a ambiguidade lexical relevante em notas.
