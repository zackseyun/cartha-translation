  text: declaring that they should never show favor either to those who[a], for the sake of their belly, had transgressed the divine commandments[b], or to the king’s decrees.
translation:
  language: pt
  text: declarando que aqueles que, por causa do ventre[a], haviam transgredido os mandamentos divinos jamais seriam favoráveis nem mesmo aos decretos do rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “por causa do ventre”; isto é, por causa do apetite ou da comida.
    reason: lexical_alternative
  - marker: b
    text: 'A construção grega é condensada: “ser favorável” rege também “aos decretos do rei”. Pode sugerir boa disposição ou apoio, sem dizer explicitamente “obedecer”.'
    reason: alternative_reading
lexical_decisions:
- source_word: προφερόμενοι
  choice: declarando
  rationale: O particípio introduz publicamente o conteúdo da afirmação; “declarando” conserva o tom formal sem acrescentar uma ideia alheia ao grego.
- source_word: τοὺς γαστρὸς ἕνεκεν
  choice: aqueles que, por causa do ventre
  rationale: O acusativo τοὺς funciona naturalmente como sujeito do infinitivo εὐνοήσειν, enquanto “por causa do ventre” preserva a imagem concreta e moralmente carregada do original.
- source_word: τὰ θεῖα παραβεβηκότας προστάγματα
  choice: haviam transgredido os mandamentos divinos
  rationale: O perfeito παραβεβηκότας descreve uma transgressão já cometida, e “mandamentos divinos” comunica com clareza a autoridade sagrada de προστάγματα.
- source_word: μηδέποτε εὐνοήσειν
  choice: jamais seriam leais
  rationale: No infinitivo futuro, εὐνοήσειν expressa a disposição favorável ou lealdade futura desses transgressores; “seriam leais” produz em português uma relação natural com as ordens reais.
- source_word: μηδὲ τοῖς τοῦ βασιλέως προστάγμασιν
  choice: nem sequer às ordens do rei
  rationale: 'O dativo depende de εὐνοήσειν e indica aquilo a que não mostrariam boa disposição ou lealdade. Neste contexto, μηδέ tem força enfática: nem mesmo às ordens do rei.'
theological_decisions:
- issue: Função sintática de τοὺς ... παραβεβηκότας e referente da cláusula final
  choice: Os que transgrediram os mandamentos divinos são o sujeito de “jamais seriam leais”; a falta de lealdade se dirige às ordens do rei.
  alternative: Eles nunca deveriam favorecer nem os transgressores nem os decretos do rei.
  rationale: 'A leitura escolhida respeita a marcação de caso: τοὺς ... παραβεβηκότας está no acusativo como sujeito esperado da construção de acusativo com infinitivo, enquanto τοῖς ... προστάγμασιν está no dativo regido por εὐνοήσειν. Assim, evita-se transformar o acusativo em objeto coordenado com um dativo e preserva-se a acusação do texto de que quem violou os mandamentos divinos por apetite também não seria confiável para o rei.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se “ventre” para manter a imagem grega sem a coloquialidade potencial de “barriga”. A construção foi traduzida segundo a sintaxe grega, corrigindo a leitura da camada inglesa que tratava os transgressores como objeto de “favorecer”.
