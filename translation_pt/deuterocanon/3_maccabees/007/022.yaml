base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/022.yaml
  text: And all of them recovered all their own property from the registration, so that those who had anything gave it back to them with the greatest fear, since the great God had fully accomplished mighty deeds for their deliverance.
translation:
  language: pt
  text: E todos recuperaram, a partir do registro[a], tudo o que lhes pertencia, de modo que os que tinham algo o devolveram a eles com extremo temor, porque o grande Deus havia realizado plenamente grandes feitos para o livramento deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a partir do inventário” ou “a partir do registro oficial”. O termo grego pode designar um registro administrativo de pessoas ou bens.
    reason: lexical_alternative
  - marker: b
    text: Ou “para a salvação deles”. O termo grego pode referir-se tanto ao livramento em uma situação concreta quanto à salvação em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκομίσαντο
  choice: recuperaram
  rationale: O médio indica que obtiveram de volta aquilo que lhes pertencia; “recuperaram” expressa de modo natural a restituição dos bens.
- source_word: ἐξ ἀπογραφῆς
  choice: com base no registro
  rationale: ἀπογραφή designa um registro administrativo de pessoas ou bens. A expressão portuguesa comunica que a restituição foi feita com base nessa documentação oficial sem especificar indevidamente um censo.
- source_word: πάντα τὰ ἑαυτῶν
  choice: tudo o que lhes pertencia
  rationale: Reproduz a totalidade e a ideia de posse com clareza, sem acrescentar uma categoria específica de bens ausente do grego.
- source_word: τοὺς ἔχοντάς τι
  choice: quem tinha alguma coisa
  rationale: Mantém a amplitude indefinida de τι e expressa naturalmente os que estavam de posse de algo pertencente ao grupo.
- source_word: μετὰ φόβου μεγίστου
  choice: com extremo temor
  rationale: Traduz a força superlativa da expressão e preserva o sentido de medo intenso diante da intervenção divina.
- source_word: ἀποδοῦναι αὐτοῖς
  choice: a devolveu a eles
  rationale: Expressa a restituição daquilo que lhes pertencia e mantém explícitos os beneficiários.
- source_word: τὰ μεγαλεῖα
  choice: feitos grandiosos
  rationale: O substantivo refere-se aos grandes atos de Deus; a escolha conserva o tom elevado sem restringi-los a milagres em sentido técnico.
- source_word: ποιήσαντος τελέως
  choice: havia realizado plenamente
  rationale: A construção genitiva apresenta a ação de Deus como completa e eficaz; “plenamente” preserva a força de τελέως.
- source_word: ἐπὶ σωτηρίᾳ αὐτῶν
  choice: para livrá-los
  rationale: No contexto narrativo, σωτηρία aponta diretamente para o resgate do povo em uma situação concreta, embora também possa ser traduzido pelo termo teologicamente mais amplo “salvação”.
theological_decisions:
- issue: Sentido de σωτηρία no contexto da narrativa
  choice: para livrá-los
  alternative: para a salvação deles
  rationale: O contexto celebra um resgate histórico e concreto realizado por Deus. “Livrá-los” comunica esse sentido imediato, enquanto a nota preserva a alternativa mais ampla “salvação”.
- issue: Relação causal da ação divina com a restituição
  choice: pois o grande Deus havia realizado plenamente feitos grandiosos
  alternative: quando o grande Deus realizou plenamente feitos grandiosos
  rationale: O genitivo absoluto admite uma relação circunstancial, mas o contexto favorece a causa do temor e da restituição. “Pois” explicita essa relação sem introduzir uma doutrina adicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para naturalidade, sem eliminar a relação de resultado expressa no grego. “Extremo temor” preserva a intensidade do superlativo, e “feitos grandiosos” mantém o tom elevado da ação divina.
