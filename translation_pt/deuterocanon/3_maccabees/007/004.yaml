lexical_decisions:
- source_word: προφερόμενοι
  choice: alegando
  rationale: O particípio introduz a afirmação apresentada como argumento ou acusação. “Alegando” é natural em português e não pressupõe que a afirmação seja verdadeira.
- source_word: μηδέποτε
  choice: jamais
  rationale: Expressa negação temporal absoluta; “jamais” mantém a força do grego em registro digno e corrente.
- source_word: εὐσταθήσειν τὰ πράγματα ἡμῶν
  choice: nossos assuntos jamais estariam seguros
  rationale: εὐσταθήσειν indica estabilidade ou firmeza, enquanto τὰ πράγματα ἡμῶν se refere amplamente à situação ou aos interesses públicos do grupo. “Estariam seguros” comunica essa estabilidade de modo idiomático.
- source_word: διʼ ἣν ἔχουσιν οὗτοι πρὸς τὰ ἔθνη δυσμένειαν
  choice: por causa da hostilidade que essas pessoas têm contra as nações
  rationale: δυσμένεια denota hostilidade ou inimizade. “Essas pessoas” traduz οὗτοι sem introduzir marca de gênero desnecessária, e “as nações” conserva a amplitude de τὰ ἔθνη.
- source_word: μέχρι ἂν συντελεσθῇ τοῦτο
  choice: até que isso se cumprisse
  rationale: O aoristo subjuntivo passivo exprime a conclusão ou realização do que foi proposto. “Se cumprisse” preserva a perspectiva futura dentro do discurso indireto.
theological_decisions:
- issue: Sentido de τὰ ἔθνη
  choice: as nações
  alternative: os gentios; os povos
  rationale: No contexto, trata-se de uma acusação política em ambiente judaico-helenístico. “As nações” permanece próximo do grego e conserva a abrangência da expressão, enquanto “os gentios” continua sendo uma leitura contextual plausível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O período foi mantido como continuação sintática do contexto anterior, conforme o particípio inicial do grego. A ambiguidade de τὰ ἔθνη foi preservada no texto e explicitada em nota.
