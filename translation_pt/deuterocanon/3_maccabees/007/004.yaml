translation:
  language: pt
  text: alegando que a nossa situação jamais estaria segura, por causa da hostilidade que essas pessoas têm contra as nações[a], até que isso fosse realizado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os gentios”. A expressão grega τὰ ἔθνη pode significar “as nações”, “os povos” ou, no uso judaico, “os gentios”.
