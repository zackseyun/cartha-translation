lexical_decisions:
- source_word: Εὐλογητός
  choice: Bendito seja
  rationale: Expressa naturalmente em português a fórmula de louvor que declara o libertador digno de bênção.
- source_word: ὁ ῥύστης
  choice: o libertador
  rationale: Traduz o substantivo como aquele que livra ou resgata, sem acrescentar especificação ausente no grego.
- source_word: εἰς τοὺς ἀεὶ χρόνους
  choice: para sempre
  rationale: Reproduz de modo idiomático o sentido temporal duradouro da expressão grega.
- source_word: ἀμήν
  choice: Amém
  rationale: Mantém a aclamação litúrgica tradicional e amplamente compreendida.
theological_decisions:
- issue: Identidade do libertador
  choice: Manter apenas o título «o libertador», sem inserir «Deus» ou outro nome
  alternative: «Bendito seja Deus, o libertador de Israel»
  rationale: Embora o referente seja entendido pelo contexto, o texto grego deste versículo não contém explicitamente θεός; a tradução preserva sua formulação.
