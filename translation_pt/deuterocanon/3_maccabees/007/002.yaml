  yaml_path: translation/deuterocanon/3_maccabees/007/002.yaml
  text: And we ourselves and our children are well[a], as the great God directs his commands for us, just as we choose.
translation:
  language: pt
  text: E nós mesmos e nossos filhos estamos bem, pois o grande Deus dirige para nós os seus mandamentos, conforme decidimos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «conforme pretendemos» ou «segundo o que nos propomos».'
    reason: Alternativas lexicais para καθὼς προαιρούμεθα, que pode indicar escolha, intenção ou propósito deliberado.
lexical_decisions:
- source_word: ἐρρώμεθα
  choice: estamos bem
  rationale: O perfeito de forma passiva é usado idiomaticamente com o sentido de estar forte, saudável ou bem; no contexto, «estamos bem» é natural e não restringe a afirmação apenas à saúde física.
- source_word: καὶ αὐτοὶ καὶ τὰ τέκνα ἡμῶν
  choice: nós mesmos e nossos filhos
  rationale: Preserva a ênfase de αὐτοὶ e traduz τέκνα pelo termo abrangente «filhos», entendido aqui como descendentes, sem limitá-lo aos homens.
- source_word: κατευθύνοντος
  choice: dirige
  rationale: O verbo significa tornar reto, guiar ou dirigir; «dirige» conserva a ideia de orientação ativa no genitivo absoluto.
- source_word: τοῦ μεγάλου θεοῦ
  choice: o grande Deus
  rationale: Reproduz de maneira direta e reverente a expressão titular grega.
- source_word: τὰ προστάγματα
  choice: os seus mandamentos
  rationale: πρόσταγμα designa uma ordem ou determinação. O possessivo explicita naturalmente em português a relação implícita com Deus.
- source_word: ἡμῖν
  choice: para nós
  rationale: Mantém o dativo de referência ou benefício sem definir de modo excessivo sua relação sintática com o verbo e os mandamentos.
- source_word: καθὼς προαιρούμεθα
  choice: conforme decidimos
  rationale: προαιρέομαι expressa escolha deliberada, decisão ou propósito; «decidimos» soa natural em português e conserva a volição humana.
theological_decisions:
- issue: Relação entre a direção divina e a vontade humana em καθὼς προαιρούμεθα
  choice: Mantêm-se lado a lado a ação de Deus («dirige») e a decisão humana («conforme decidimos»).
  alternative: conforme pretendemos; segundo o que nos propomos
  rationale: O grego justapõe a direção de Deus à προαίρεσις dos falantes. A tradução preserva essa tensão sem convertê-la em determinismo nem em autonomia absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi mantida próxima do grego, mas «pois» torna natural a relação circunstancial do genitivo absoluto. O marcador [a] aparece após a expressão a que se refere.
