  verdict: revise
  source_fidelity: A tradução preserva adequadamente a elipse de εἰς τὴν ἔμπροσθεν, o sentido relacional de ἐν τοῖς ἐχθροῖς e a ambiguidade de «glória e temor». Contudo, a frase final deve manter mais claramente o particípio plural aplicado às pessoas, com a esfera de «seus bens», sem sugerir que os bens sejam o sujeito diretamente abalado.
  naturalness: «Cada um para sua condição anterior» é compreensível, mas a pontuação como frase isolada e o acréscimo de «Assim» tornam uma construção grega contínua artificial em português. Uma única oração, com «sem que ninguém os abalasse em nada do que possuíam», é mais fluente e conserva a construção compacta.
  terminology: «Autoridade», «glória», «temor» e «bens/possuíam» são escolhas adequadas e de registro moderno. «Temor» preserva a indeterminação do genitivo/da relação implícita.
  issues:
  - severity: medium
    issue: Segmentação e acréscimo de «Assim»
    rationale: O texto grego apresenta uma sequência contínua e elíptica, sem equivalente explícito de «Assim». Separar «cada um para a sua condição anterior» como oração independente e acrescentar esse conector reduz a coesão da construção e introduz uma relação discursiva não expressa.
  - severity: medium
    issue: Formulação final pouco direta
    rationale: «Ninguém os abalou quanto ao conjunto de seus bens» tenta refletir a sintaxe difícil, mas soa pouco natural e deixa obscura a relação entre as pessoas, o ato de abalar/perturbar e suas posses. Uma formulação com «em nada do que possuíam» mantém o escopo dos bens sem alterar o sujeito do particípio.
  - severity: low
    issue: Nota c excede o escopo do texto
    rationale: 'A afirmação de que «eles e o conjunto de seus bens permaneceram sem ser molestados» é explicativa demais: o particípio concorda com as pessoas, enquanto τῶν ὑπαρχόντων delimita a esfera afetada. A nota deve explicitar a dificuldade sem ampliar o referente.'
