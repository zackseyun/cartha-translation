  text: each one to his former place[a], having obtained authority among their enemies with glory and fear[b], their whole body of possessions having been shaken by none.
translation:
  language: pt
  text: cada um para sua condição anterior,[a] tendo alcançado autoridade entre seus inimigos, com glória e temor,[b] sem que ninguém os abalasse em nada do que possuíam.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego é elíptico e pode significar “para o lugar anterior”, “para a posição anterior” ou “para o que antes lhes pertencia”.
    reason: lexical_alternative
  - marker: b
    text: “Temor” pode ser o temor inspirado nos inimigos ou o temor que acompanhava a situação restaurada; o grego não o especifica.
    reason: preserve_ambiguity
  - marker: c
    text: 'Ou: “não tendo sido abalados por ninguém quanto ao conjunto de seus bens”. A construção grega é compacta: o particípio se refere às pessoas, e a expressão sobre os bens indica a esfera em que não sofreram perturbação ou dano.'
    reason: textual_clarity
lexical_decisions:
- source_word: ἕκαστος εἰς τὴν ἔμπροσθεν
  choice: cada um para a sua condição anterior
  rationale: 'A expressão grega é elíptica: o artigo feminino com ἔμπροσθεν pressupõe algo como posição, condição ou situação. “Condição anterior” preserva a abertura entre lugar, posição e estado anterior sem introduzir um referente ausente.'
- source_word: ἐν τοῖς ἐχθροῖς ἐξουσίαν ἐσχηκότες
  choice: tendo alcançado autoridade entre os seus inimigos
  rationale: ἐξουσία indica autoridade ou poder efetivo, e o perfeito de ἔχω exprime a condição alcançada. “Entre” mantém o valor relacional ou social de ἐν com dativo, sem transformá-lo necessariamente em domínio direto “sobre” os inimigos.
- source_word: μετὰ δόξης καὶ φόβου
  choice: com glória e temor
  rationale: A tradução conserva os dois substantivos e não decide silenciosamente se o temor era sentido por eles ou inspirado nos outros.
- source_word: τὸ σύνολον ... τῶν ὑπαρχόντων
  choice: quanto ao conjunto de seus bens
  rationale: τὰ ὑπάρχοντα é uma expressão comum para bens ou posses; τὸ σύνολον salienta a totalidade. A construção portuguesa explicita a relação de respeito sem fazer o particípio masculino plural concordar indevidamente com “bens”.
- source_word: ὑπὸ μηδενὸς διασεισθέντες
  choice: ninguém os abalou
  rationale: O particípio passivo masculino plural se refere às pessoas, não aos bens neutros. “Abalou” preserva a imagem de διασείω, embora no contexto também possa comunicar perturbação, intimidação ou prejuízo.
