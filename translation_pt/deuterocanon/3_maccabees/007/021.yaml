translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e internacionalmente. Como o versículo começa com uma continuação sintática do contexto anterior, manteve-se a inicial minúscula; “Assim” foi acrescentado apenas para tornar legível a transição entre as duas construções participiais, sem resolver a elipse grega de modo excessivo.
