base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/006.yaml
  text: But we[a], after threatening them more harshly on account of these things, in keeping with the clemency we have toward all people, scarcely granted them their lives, and, recognizing that the heavenly God had surely defended the Jews[b],
translation:
  language: pt
  text: Quanto a nós, porém, depois de lhes fazermos ameaças mais severas por causa dessas coisas, de acordo com a clemência que temos para com todas as pessoas, mal lhes concedemos que continuassem vivos[a] e, reconhecendo que o Deus celestial[b] havia certamente defendido os judeus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “apenas lhes poupamos a vida”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o Deus do céu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτοις
  choice: por causa dessas coisas
  rationale: A preposição ἐπί com dativo, neste contexto, retoma os fatos anteriores como motivo das ameaças, não como termo de comparação.
- source_word: σκληρότερον διαπειλησάμενοι
  choice: depois de lhes fazermos ameaças mais severas
  rationale: Preserva o valor anterior do particípio aoristo e a intensidade tanto do comparativo σκληρότερον quanto do verbo composto διαπειλέομαι, em português natural.
- source_word: ἐπιείκειαν
  choice: clemência
  rationale: No contexto de uma declaração régia sobre poupar vidas, «clemência» expressa adequadamente a moderação ou indulgência indicada pelo termo.
- source_word: μόγις τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: mal lhes concedemos que continuassem vivos
  rationale: Mantém a ideia de uma concessão feita por pouco ou com forte relutância, sem substituir no texto principal a construção grega pela expressão mais idiomática «poupar a vida».
- source_word: ἐπουράνιον θεόν
  choice: o Deus celestial
  rationale: Reproduz a forma adjetiva do grego e conserva o tom elevado; «o Deus do céu» permanece como alternativa idiomática.
- source_word: ἐγνωκότες
  choice: reconhecendo
  rationale: O particípio perfeito indica um reconhecimento já estabelecido à luz do que ocorreu.
- source_word: ἀσφαλῶς
  choice: certamente
  rationale: Neste contexto, o advérbio comunica a certeza reconhecida da intervenção divina, e não apenas segurança física.
- source_word: ὑπερησπικότα τῶν Ἰουδαίων
  choice: havia certamente defendido os judeus
  rationale: O particípio perfeito descreve a defesa divina já realizada em favor dos judeus; «defendido» transmite com clareza a imagem de proteção do verbo composto.
theological_decisions:
- issue: Forma de verter ἐπουράνιον θεόν na carta régia
  choice: o Deus celestial
  alternative: o Deus do céu
  rationale: A opção principal preserva o adjetivo grego ἐπουράνιον sem introduzir uma formulação doutrinária adicional; a alternativa registra a expressão portuguesa mais idiomática.
- issue: Grau de explicitação em τὸ ζῆν αὐτοῖς χαρισάμενοι
  choice: mal lhes concedemos que continuassem vivos
  alternative: apenas lhes poupamos a vida
  rationale: A redação principal acompanha mais de perto a construção grega de conceder a continuação da vida, enquanto a nota oferece a equivalência idiomática sem apagar a nuance de concessão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o caráter encadeado do período grego e a vírgula final, pois o versículo termina como parte de uma frase que prossegue. Os marcadores foram posicionados junto às expressões a que suas notas realmente se referem.
