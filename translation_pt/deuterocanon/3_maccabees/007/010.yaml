base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/010.yaml
  text: But when they received this letter[a], they did not immediately hasten about the departure; instead, they urged the king that those from the Jewish race who had willfully transgressed the law of the holy God might, through them[c][b], receive the punishment that was due.
translation:
  language: pt
  text: Depois de receberem essa carta, não se apressaram de imediato em partir[a]. Em vez disso, pediram ao rei que aqueles dentre o povo judeu[b] que, por vontade própria, haviam transgredido a lei do Deus santo recebessem, por meio deles, o castigo devido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a regressar”. O termo grego pode indicar tanto a partida do lugar presente quanto o retorno a um lugar anterior.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aqueles provenientes da linhagem dos judeus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαβόντες δὲ τὴν ἐπιστολὴν ταύτην
  choice: Depois de receberem essa carta
  rationale: O particípio aoristo indica uma circunstância anterior à ação principal; a construção temporal é natural em português. δέ marca a progressão narrativa, sem exigir um adversativo explícito.
- source_word: οὐκ ἐσπούδασαν εὐθέως περὶ τὴν ἄφοδον
  choice: não se apressaram imediatamente a partir
  rationale: ἐσπούδασαν e εὐθέως expressam pressa e imediatidade. ἄφοδος pode indicar partida ou regresso; no contexto imediato, 'partir' produz uma frase clara, e a alternativa é preservada em nota.
- source_word: προσηξίωσαν τὸν βασιλέα
  choice: pediram ao rei que lhes permitisse
  rationale: O verbo expressa uma solicitação dirigida ao rei. A explicitação de permissão torna natural em português a relação entre o pedido e a ação punitiva pretendida, sem mudar seu conteúdo.
- source_word: τοὺς ἐκ τοῦ γένους τῶν Ἰουδαίων
  choice: aqueles dentre o povo judeu
  rationale: γένος designa aqui o grupo étnico ou povo. 'Dentre o povo judeu' preserva a ideia de membros desse povo sem a conotação moderna potencialmente inadequada de 'raça'.
- source_word: αὐθαιρέτως παραβεβηκότας
  choice: que, por vontade própria, haviam transgredido
  rationale: αὐθαιρέτως ressalta uma ação voluntária e deliberada; o perfeito παραβεβηκότας indica uma transgressão consumada com relevância presente.
- source_word: τοῦ θεοῦ τὸν νόμον
  choice: a lei do Deus santo
  rationale: Preserva a relação possessiva e mantém ἅγιον como descrição de Deus, sem transformá-la necessariamente em título fixo.
- source_word: τυχεῖν διʼ αὐτῶν τῆς ὀφειλομένης κολάσεως
  choice: lhes permitisse aplicar o devido castigo
  rationale: τυχεῖν com o genitivo indica receber ou encontrar o castigo, enquanto διʼ αὐτῶν apresenta o grupo solicitante como agente ou instrumento. A formulação portuguesa expressa de modo natural que o castigo seria aplicado por eles.
theological_decisions:
- issue: Identidade do Deus santo e natureza da transgressão
  choice: Apresentar os transgressores como judeus que violaram voluntariamente a lei do Deus santo
  alternative: Explicitar que se trata de apóstatas ou identificar mais precisamente a infração
  rationale: O grego condena uma violação voluntária da lei dentro do povo judeu, mas não usa aqui um rótulo teológico como 'apóstatas' nem especifica neste versículo a infração; a tradução não acrescenta essas conclusões.
- issue: Agência na aplicação do castigo
  choice: Indicar que os peticionários pretendiam aplicar o castigo com autorização do rei
  alternative: 'Traduzir de modo mais impessoal: ''recebessem por meio deles o devido castigo'''
  rationale: διʼ αὐτῶν permite uma leitura instrumental ou agentiva. A redação escolhida comunica a leitura contextual mais natural, sem atribuir a Deus diretamente a execução do castigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitaram-se tanto o arcaísmo 'epístola' quanto o uso potencialmente anacrônico de 'raça judaica'. A ordem foi levemente reestruturada para clareza, preservando a sequência narrativa, a voluntariedade da transgressão e a agência humana no castigo.
