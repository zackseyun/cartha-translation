  text: When they arrived at Ptolemais[a], which is called Rose-bearing because of the nature of the place, where the fleet waited for them for seven days by their common decision,
translation:
  language: pt
  text: Quando chegaram a Ptolemaida, chamada de Portadora de Rosas[a] por causa da característica própria do lugar, a frota esperou por eles ali durante sete dias, conforme uma decisão conjunta deles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que produz rosas”. O título grego ῥοδοφόρον descreve Ptolemaida em relação à característica própria do lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγενηθέντες
  choice: Quando chegaram
  rationale: O particípio aoristo de παραγίνομαι introduz temporalmente o acontecimento seguinte; esta formulação é natural em português e preserva essa relação.
- source_word: Πτολεμαΐδα
  choice: Ptolemaida
  rationale: Transliteração portuguesa clara do topônimo grego, sem traduzir o nome próprio.
- source_word: τὴν ὀνομαζομένην
  choice: chamada de
  rationale: Expressa de modo corrente a designação atribuída à cidade.
- source_word: διὰ τὴν τοῦ τόπου ἰδιότητα
  choice: por causa da característica própria do lugar
  rationale: ἰδιότης indica uma qualidade distintiva; a tradução mantém a imprecisão do grego quanto à natureza exata dessa característica.
- source_word: ῥοδοφόρον
  choice: Portadora de Rosas
  rationale: Reproduz o sentido composto de ῥοδοφόρος, literalmente aquilo que porta ou produz rosas, como título descritivo da cidade.
- source_word: ἐν ᾗ
  choice: ali
  rationale: Retoma Ptolemaida como o local em que a frota aguardou, evitando em português uma sequência ambígua de orações relativas.
- source_word: προσέμεινεν αὐτοὺς
  choice: esperou por eles
  rationale: Com αὐτούς como complemento, προσμένω indica permanecer à espera deles, e não apenas ficar no local.
- source_word: ὁ στόλος
  choice: a frota
  rationale: Equivalente direto e corrente para o conjunto de navios indicado por στόλος.
- source_word: κατὰ κοινὴν αὐτῶν βουλήν
  choice: conforme decisão tomada em conjunto
  rationale: Preserva a ideia de deliberação ou resolução comum, embora o referente exato de αὐτῶν não seja explicitado no versículo.
- source_word: ἡμέρας ἑπτά
  choice: durante sete dias
  rationale: Explicita naturalmente em português o acusativo grego de duração.
