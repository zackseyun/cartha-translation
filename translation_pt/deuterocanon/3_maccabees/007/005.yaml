base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/005.yaml
  text: These men[a], after bringing them down in chains with abuse, as slaves—or rather, as conspirators—attempted to destroy them without any hearing or examination[c][b], having clothed themselves in a savagery more brutal than the law of the Scythians.
translation:
  language: pt
  text: Esses homens, depois de os conduzirem acorrentados e com maus-tratos[a], como escravos — ou melhor, como conspiradores[b] —, tentaram matá-los sem nenhum interrogatório ou investigação. Estavam tomados por uma crueldade mais selvagem que a lei dos citas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com abusos” ou “com vexações”; a expressão grega indica tratamento cruel e degradante.
    reason: lexical_alternative
  - marker: b
    text: 'A expressão “ou melhor” intensifica a acusação: eles foram tratados não apenas como escravos, mas como pessoas acusadas de tramar contra outros.'
    reason: lexical_alternative
  - marker: c
    text: “Lei dos citas” também pode significar “costume dos citas”. Na retórica antiga, os citas eram frequentemente evocados como símbolo de crueldade extrema. A forma grega traduzida por “tomados” é incomum e de sentido incerto.
    reason: cultural_note
lexical_decisions:
- source_word: οἳ καὶ
  choice: Eles também
  rationale: Retoma os homens mencionados no contexto anterior e preserva o valor aditivo de καί sem tornar a frase artificial em português.
- source_word: δεσμίους καταγαγόντες αὐτούς
  choice: os levaram para lá acorrentados
  rationale: δεσμίους indica pessoas presas ou em grilhões; “acorrentados” conserva a imagem concreta. κατάγω contém ideia direcional, aqui expressa naturalmente por “levaram para lá”, sem especificar um destino ausente do versículo.
- source_word: μετὰ σκυλμῶν
  choice: em meio a maus-tratos
  rationale: No contexto, σκυλμοί designa vexações, abusos ou tratamento degradante. “Maus-tratos” comunica isso de modo claro e atual, mantendo em nota a amplitude lexical.
- source_word: ὡς ἀνδράποδα
  choice: como escravos
  rationale: ἀνδράποδα designa escravos, especialmente pessoas reduzidas à condição de propriedade humana; a tradução não suaviza a linguagem desumanizadora.
- source_word: μᾶλλον δὲ ὡς ἐπιβούλους
  choice: ou melhor, como conspiradores
  rationale: μᾶλλον δέ corrige e intensifica a comparação anterior; ἐπίβουλοι são pessoas acusadas de tramar contra alguém.
- source_word: ἄνευ πάσης ἀνακρίσεως καὶ ἐξετάσεως
  choice: sem qualquer interrogatório nem investigação
  rationale: Os dois substantivos descrevem procedimentos de apuração. A dupla tradução mantém a ausência completa de averiguação sem impor a noção mais específica de um julgamento formal.
- source_word: ἐπεχείρησαν ἀνελεῖν
  choice: tentaram matá-los
  rationale: Nesse contexto, ἀναιρέω significa tirar a vida. “Matá-los” é mais preciso que o possível, porém menos explícito, “destruí-los”.
- source_word: νόμου Σκυθῶν ἀγριοτέραν
  choice: mais selvagem que a lei dos citas
  rationale: Preserva νόμος como “lei” e a comparação retórica com os citas; uma nota esclarece que “costume” também é possível.
- source_word: ἐνπεπηρμένοι ὠμότητα
  choice: Estavam imbuídos de uma crueldade
  rationale: A forma participial é textual e semanticamente difícil, mas no contexto descreve os agentes como tomados ou revestidos de crueldade. “Imbuídos” preserva essa ideia sem fingir certeza sobre uma metáfora específica.
theological_decisions:
- issue: Linguagem desumanizadora em ὡς ἀνδράποδα
  choice: como escravos
  alternative: como cativos
  rationale: “Escravos” conserva a redução das vítimas à condição servil e a força da acusação; “cativos” atenuaria indevidamente o termo.
- issue: Caráter jurídico de ἀνάκρισις e ἐξέτασις
  choice: interrogatório nem investigação
  alternative: audiência nem exame
  rationale: A tradução preserva a falta de apuração e de processo sem acrescentar uma estrutura judicial mais definida do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e legibilidade brasileira. A primeira frase mantém o encadeamento dos particípios gregos sem excessiva rigidez; a última é separada para evitar um período pesado. “Citas” segue a forma portuguesa consagrada do gentílico.
