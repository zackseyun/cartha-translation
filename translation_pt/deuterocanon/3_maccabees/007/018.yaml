  yaml_path: translation/deuterocanon/3_maccabees/007/018.yaml
  text: There they held a saving banquet[a], since the king had generously supplied each of them with everything for the journey, all the way to his own house.
translation:
  language: pt
  text: Ali celebraram um banquete de libertação[a], pois o rei havia providenciado generosamente a cada um tudo o que era necessário para a viagem até à casa de cada um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um banquete de salvação” ou “um banquete salvador”. O grego relaciona explicitamente a celebração ao livramento deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότον
  choice: banquete
  rationale: Embora o substantivo se relacione literalmente ao ato de beber, aqui designa uma celebração festiva com bebida; “banquete” comunica naturalmente o sentido do evento.
- source_word: σωτήριον
  choice: de libertação
  rationale: O adjetivo associa explicitamente o banquete ao livramento recebido. “De libertação” é natural em português e mantém essa relação sem determinar de modo indevido a natureza exata da ação salvadora.
- source_word: χορηγήσαντος
  choice: havia providenciado
  rationale: O particípio indica que o rei forneceu, às suas custas, o necessário. “Havia providenciado” expressa com clareza a provisão anterior à viagem.
- source_word: εὐψύχως
  choice: generosamente
  rationale: O advérbio sugere disposição cordial e liberal; no contexto da provisão real, “generosamente” transmite bem a boa vontade e a liberalidade.
- source_word: τὰ πρὸς τὴν ἄφιξιν πάντα
  choice: tudo o que era necessário para a viagem
  rationale: Literalmente, a expressão trata de tudo o que dizia respeito à chegada. A formulação escolhida esclarece que se tratava dos recursos necessários para alcançar o destino, sem perder a referência à chegada explicitada na oração seguinte.
- source_word: ἑκάστῳ
  choice: a cada um
  rationale: Mantém o valor distributivo do dativo singular e deixa claro que a provisão foi individual.
- source_word: ἕως ἐπὶ τὴν ἰδίαν οἰκίαν
  choice: até que chegasse à sua própria casa
  rationale: A frase indica que a provisão se estendia até a casa de cada pessoa. O singular é preservado distributivamente em ligação com “a cada um”.
