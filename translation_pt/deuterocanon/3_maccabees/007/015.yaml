base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/007/015.yaml
  text: On that day they killed more than three hundred men[a], and they also made it a joyful celebration[b], having laid hands on the profane.
translation:
  language: pt
  text: Naquele dia, mataram mais de trezentos homens e também celebraram esse dia com alegria[a], depois de subjugarem os profanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é incomum e, mais literalmente, diz que eles “conduziram” ou “promoveram júbilo”; o sentido parece ser que celebraram aquele dia com alegria.
    reason: lexical_alternative
  - marker: b
    text: A oração final é difícil no texto grego. “Depois de subjugarem os profanos” também pode ser entendido como “tendo-se apoderado dos ímpios” ou “depois de porem os profanos sob seu poder”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεῖλον
  choice: mataram
  rationale: O aoristo de ἀναιρέω, neste contexto narrativo, tem o sentido comum de matar. “Mataram” é direto, atual e preserva a violência expressa pelo grego.
- source_word: ὑπὲρ τοὺς τριακοσίους ἄνδρας
  choice: mais de trezentos homens
  rationale: ὑπέρ com acusativo indica quantidade superior a um número; ἄνδρας especifica homens.
- source_word: ἣν καὶ ἤγαγον εὐφροσύνην μετὰ χαρᾶς
  choice: e também celebraram esse dia com alegria
  rationale: A construção transmitida é sintaticamente difícil. A tradução comunica o sentido festivo de ἄγω com εὐφροσύνη e mantém explícita a alegria de μετὰ χαρᾶς, sem ocultar a dificuldade, registrada em nota.
- source_word: βεβήλους
  choice: os profanos
  rationale: O adjetivo substantivado βέβηλος caracteriza pessoas como profanas ou irreverentes do ponto de vista religioso do narrador. “Os profanos” permanece próximo ao valor lexical sem acrescentar uma categoria teológica mais específica.
- source_word: χειρωσάμενοι
  choice: depois de subjugarem
  rationale: O particípio de χειρόω pode indicar pôr sob controle, dominar ou apoderar-se. “Subjugarem” produz uma frase natural e conserva a ideia de domínio, enquanto a nota registra outras possibilidades.
theological_decisions:
- issue: Caracterização moral e religiosa de βεβήλους
  choice: os profanos
  alternative: os ímpios; os irreverentes
  rationale: A escolha preserva a avaliação religiosa presente no termo grego sem intensificá-la para “sem Deus” nem definir de forma denominacional a culpa dessas pessoas.
- issue: Sentido da oração difícil ἣν καὶ ἤγαγον εὐφροσύνην μετὰ χαρᾶς βεβήλους χειρωσάμενοι
  choice: e também celebraram esse dia com alegria, depois de subjugarem os profanos
  alternative: e fizeram desse dia uma ocasião de júbilo, tendo-se apoderado dos ímpios; e celebraram com alegria, depois de porem os profanos sob seu poder
  rationale: O texto grego transmitido é pouco fluente e permite mais de uma maneira de relacionar o ato de celebrar ao particípio final. A redação principal oferece português coerente, mas as notas preservam a incerteza lexical e sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Evitou-se o arcaísmo “mataram à espada” ou “trucidaram” e preservou-se, em notas, a dificuldade real da construção grega.
