base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/032.yaml
  text: But most of them[a], took courage with a noble spirit, did not abandon their piety by exchanging their possessions for life[b], but boldly counted themselves worthy to escape the registration lists.
translation:
  language: pt
  text: Mas a maioria, tomando coragem, com nobre ânimo, não abandonou sua piedade ao trocar seus bens pela própria vida;[a] sem medo, considerou-se digna de se livrar das listas de registro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A ligação do particípio grego «trocando seus bens pela vida» é ambígua. Ele também pode ser entendido como ligado à ação seguinte: «e, trocando seus bens pela vida, considerou-se sem medo digna de se livrar das listas de registro».'
    reason: Preserva a ambiguidade sintática de ἀντικαταλλασσόμενοι sem acrescentar a ideia de «procurar».
  - marker: b
    text: As «listas de registro» eram os registros oficiais de inscrição mencionados no contexto, aparentemente usados para identificar os judeus sujeitos às medidas opressivas do rei.
    reason: Nota histórica e contextual.
lexical_decisions:
- source_word: οἱ δὲ πλεῖστοι
  choice: Mas a maioria
  rationale: πλεῖστοι designa a maior parte do grupo; “a maioria” é natural em português e mantém o contraste implícito com os demais.
- source_word: γενναίᾳ ψυχῇ ἐνίσχυσαν
  choice: tomando coragem com espírito nobre
  rationale: O dativo γενναίᾳ ψυχῇ exprime modo ou disposição interior, enquanto ἐνίσχυσαν indica fortalecimento moral. A formulação preserva tanto a coragem como a nobreza de ânimo.
- source_word: οὐ διέστησαν τῆς εὐσεβείας
  choice: não abandonou sua devoção a Deus
  rationale: διίστημι com o genitivo comunica afastamento ou abandono. Neste contexto judaico, εὐσέβεια é devoção reverente a Deus, não apenas respeitabilidade moral.
- source_word: τὰ τε χρήματα περὶ τοῦ ζῇν ἀντικαταλλασσόμενοι
  choice: ao trocar seus bens pela própria vida
  rationale: χρήματα abrange bens e posses, não somente dinheiro; a expressão apresenta esses bens como entregues em troca da preservação da vida. “Própria” torna clara em português a referência à sobrevivência sem acrescentar conteúdo doutrinário.
- source_word: ἀδέως
  choice: sem medo
  rationale: O advérbio expressa ausência de temor ou hesitação; “sem medo” é direto e preserva sua força.
- source_word: ἐτιμῶντο ἑαυτοὺς ῥύσασθαι
  choice: considerou-se digna de se livrar
  rationale: A voz média de τιμάω conserva uma avaliação de honra ou valor referente aos próprios agentes, e ῥύομαι indica livramento. A expressão portuguesa mantém essa nuance incomum sem reduzi-la simplesmente a capacidade.
- source_word: ἐκ τῶν ἀπογραφῶν
  choice: das listas de registro
  rationale: ἀπογραφαί são registros ou inscrições oficiais; no contexto, trata-se das listas usadas nas medidas opressivas do rei.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto de perseguição judaica
  choice: devoção a Deus
  alternative: piedade
  rationale: “Devoção a Deus” explicita a fidelidade religiosa exigida pelo contexto e evita que “piedade” seja entendida apenas como compaixão ou virtude genérica.
- issue: Relação do particípio ἀντικαταλλασσόμενοι com a oração precedente
  choice: ao trocar seus bens pela própria vida
  alternative: e, trocando seus bens pela vida, procurou livrar-se
  rationale: A sintaxe permite alguma incerteza quanto ao vínculo exato do particípio. O texto principal segue a leitura em que essa troca seria o meio de abandonar a devoção, enquanto a nota registra a alternativa que a liga ao esforço de escapar das listas.
- issue: Força avaliativa de ἐτιμῶντο
  choice: considerou-se digna
  alternative: considerou que podia
  rationale: A escolha preserva o campo semântico de honra e valor de τιμάω e evita converter a avaliação em mera capacidade, embora a construção grega seja incomum.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância no singular para “a maioria”. Evitou-se linguagem denominacional e preservaram-se em nota a ambiguidade sintática do particípio e a referência histórica das listas.
