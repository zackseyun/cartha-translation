  yaml_path: translation/deuterocanon/3_maccabees/002/012.yaml
  text: 'But look now, holy King: because of our many and great sins we are being oppressed, and we have been subjected to our enemies, and we are left in weakness.'
translation:
  language: pt
  text: Mas eis agora, ó Rei santo, por causa dos nossos muitos e grandes pecados, estamos sendo oprimidos, fomos submetidos aos nossos inimigos e estamos reduzidos à fraqueza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ δὲ νῦν
  choice: Mas agora
  rationale: No contexto da oração, a expressão introduz com ênfase a situação presente. Em português corrente, “Mas agora” transmite a transição sem o artificialismo de “eis agora”.
- source_word: ἅγιε Βασιλεῦ
  choice: ó Rei santo
  rationale: Mantém o vocativo dirigido a Deus, com capitalização reverencial de “Rei” e ordem natural em português.
- source_word: καταπονούμεθα
  choice: estamos sendo oprimidos
  rationale: O verbo indica sofrimento sob opressão ou aflição intensa; a forma passiva e presente preserva a ação em curso.
- source_word: ὑπετάγημεν
  choice: fomos submetidos
  rationale: Preserva o aoristo passivo e a ideia de terem sido postos sob o domínio dos inimigos.
- source_word: παρείμεθα ἐν ἀδυναμίαις
  choice: estamos reduzidos à fraqueza
  rationale: Expressa o estado de abatimento e impotência indicado por παρίημι com ἐν ἀδυναμίαις, de modo natural e digno em português.
theological_decisions:
- issue: Relação entre pecado e sofrimento nacional
  choice: por causa dos nossos muitos e grandes pecados
  alternative: por nossos numerosos e graves pecados
  rationale: Mantém explicitamente a confissão coletiva e a relação causal formulada no grego, sem acrescentar uma explicação doutrinária.
- issue: Identidade do destinatário divino
  choice: ó Rei santo
  alternative: ó santo Rei
  rationale: Preserva os dois títulos do texto e sua função vocativa, sem substituir “Rei” por outro título teológico.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação tripla do grego foi preservada, assim como a progressão entre opressão, sujeição aos inimigos e fraqueza.
