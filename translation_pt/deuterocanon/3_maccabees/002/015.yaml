  text: But since you were pleased to display your glory among your people Israel[a], you have sanctified this place.
translation:
  language: pt
  text: Mas, visto que te agradaste em manifestar a tua glória no meio do teu povo Israel[a], santificaste este lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “te agradaste da tua glória em teu povo Israel”. A construção grega é compacta e também pode ser entendida no sentido de que Deus se agradou em manifestar a sua glória entre o seu povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Introduz o contraste com o que precede e corresponde naturalmente à força adversativa do grego.
- source_word: ἐπεὶ
  choice: visto que
  rationale: Expressa a relação causal que fundamenta o apelo da oração, sem sugerir principalmente uma sequência temporal.
- source_word: εὐδόκησας
  choice: te agradaste em
  rationale: Preserva a ideia de prazer ou disposição favorável expressa pelo aoristo de εὐδοκέω e introduz de modo natural em português o sentido contextual da manifestação da glória.
- source_word: τὴν δόξαν σου
  choice: manifestar a tua glória
  rationale: O grego traz literalmente o substantivo «a tua glória», mas a construção compacta parece indicar que Deus se agradou em torná-la manifesta. A formulação verbal produz português natural sem apagar a expressão nominal, mantida na nota.
- source_word: ἐν τῷ λαῷ σου Ἰσραήλ
  choice: no meio do teu povo Israel
  rationale: Traduz ἐν como esfera relacional e comunica com clareza que a glória divina se manifesta entre o povo de Deus.
- source_word: ἡγίασας
  choice: santificaste
  rationale: Verbo preciso e corrente em contexto bíblico para ἁγιάζω, indicando que o lugar foi separado como santo.
- source_word: τὸν τόπον τοῦτον
  choice: este lugar
  rationale: Equivalência direta e natural para a expressão demonstrativa que se refere ao local sagrado no contexto.
theological_decisions:
- issue: A linguagem da glória divina em relação a Israel
  choice: te agradaste em manifestar a tua glória no meio do teu povo Israel
  alternative: te agradaste na tua glória no meio do teu povo Israel
  rationale: A sintaxe grega é compacta e admite uma versão mais formal, porém pouco natural. O texto principal explicita a provável ideia de manifestação da glória, enquanto a nota preserva a ambiguidade formal sem acrescentar uma afirmação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Santificaste» mantém a precisão cultual sem soar excessivamente técnico; «no meio do teu povo» é mais idiomático do que o decalque «em teu povo».
