  yaml_path: translation/deuterocanon/3_maccabees/002/003.yaml
  text: You destroyed those in former times who practiced unrighteousness—among whom were giants[b][a], trusting in their strength and boldness—by bringing immeasurable water upon them.
translation:
  language: pt
  text: Tu destruíste os que outrora praticaram a injustiça, entre os quais havia gigantes que confiavam em sua força e audácia[a], fazendo vir sobre eles água sem medida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atrevimento” ou “insolência”; neste contexto, o termo grego pode indicar arrogância temerária.
    reason: lexical_alternative
  - marker: b
    text: A expressão se refere às águas avassaladoras do dilúvio; literalmente, “água sem medida”.
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἔμπροσθεν
  choice: os que outrora
  rationale: 'O contexto exige sentido temporal: pessoas de uma época anterior. “Outrora” é conciso, natural e adequado ao registro da oração.'
- source_word: ἀδικίαν ποιήσαντας
  choice: praticaram a injustiça
  rationale: Reproduz a ideia de cometer ou praticar o que é injusto, sem restringir a expressão a um delito jurídico específico.
- source_word: γίγαντες
  choice: gigantes
  rationale: É o sentido lexical direto e preserva a alusão aos gigantes da geração primeva, sem substituí-los interpretativamente por “homens poderosos”.
- source_word: ῥώμῃ
  choice: força
  rationale: Expressa de modo claro o vigor ou poder no qual os gigantes depositavam confiança.
- source_word: θράσει
  choice: audácia
  rationale: Mantém a possível ambivalência do termo, embora o contexto de injustiça e juízo lhe dê provável conotação negativa; alternativas mais explicitamente negativas ficam na nota.
- source_word: πεποιθότες
  choice: confiavam em
  rationale: Comunica a confiança estabelecida indicada pelo particípio perfeito e forma uma expressão idiomática em português.
- source_word: διέφθειρας
  choice: destruíste
  rationale: Representa a ação decisiva de destruição atribuída a Deus no aoristo.
- source_word: ἐπαγαγὼν αὐτοῖς ἀμέτρητον ὕδωρ
  choice: fazendo vir sobre eles água sem medida
  rationale: Preserva “água”, em vez de explicitar interpretativamente “dilúvio”, e traduz o particípio como o meio pelo qual ocorreu a destruição.
theological_decisions:
- issue: Identificação dos julgados como a geração primeva que incluía gigantes
  choice: Manter “gigantes” e a imagem de “água sem medida”.
  alternative: Generalizar como “homens poderosos” e explicitar a água como “o dilúvio”.
  rationale: O texto evoca o juízo do dilúvio, mas emprega expressamente γίγαντες e ἀμέτρητον ὕδωρ. A tradução conserva essa formulação sem harmonizá-la inteiramente com a narrativa de Gênesis.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O uso de “Tu” acompanha a oração dirigida diretamente a Deus e preserva o tom solene sem recorrer a construções arcaicas.
