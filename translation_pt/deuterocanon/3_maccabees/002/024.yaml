  yaml_path: translation/deuterocanon/3_maccabees/002/024.yaml
  text: But after some time[a], when he had recovered himself, he in no way came to regret it when he was rebuked; rather, having issued a bitter threat[b], he departed.
translation:
  language: pt
  text: Passado algum tempo, porém, depois de se recompor[a], ele de modo algum chegou a se arrepender ao ser repreendido[b]. Pelo contrário, fez uma dura ameaça e partiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de recobrar o domínio de si”. A expressão grega provavelmente indica que ele recuperou a compostura depois do episódio anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não mudou de ideia de modo algum”. A expressão pode indicar tanto ausência de remorso como recusa em reconsiderar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν χρόνῳ δὲ ὕστερον
  choice: Passado algum tempo, porém
  rationale: Expressa o avanço temporal da narrativa e conserva a leve força contrastiva de δέ.
- source_word: ἀναλεξάμενος αὐτόν
  choice: quando se recompôs
  rationale: 'A construção é mais naturalmente entendida em sentido reflexivo: ele recuperou o domínio de si após o episódio anterior. A formulação portuguesa é clara e idiomática.'
- source_word: οὐδαμῶς εἰς μετάμελον ἦλθεν
  choice: não chegou de modo algum a se arrepender
  rationale: Mantém a imagem de 'chegar ao arrependimento' e a negação enfática οὐδαμῶς, sem excluir totalmente a nuance de reconsideração.
- source_word: ἐπιτιμηθείς
  choice: ele foi repreendido
  rationale: Traduz o particípio aoristo passivo com clareza. A coordenação em oração finita evita uma sequência pesada de particípios em português.
- source_word: μετὰ ἀπειλῆς δὲ πικρᾶς θέμενος
  choice: Pelo contrário, fez uma dura ameaça
  rationale: θέμενος com ἀπειλή equivale idiomaticamente a 'fazer uma ameaça'; 'dura' comunica a severidade de πικρᾶς de modo natural.
- source_word: ἀνέλυσεν
  choice: partiu
  rationale: No contexto narrativo, o verbo indica que ele se retirou ou foi embora; 'partiu' é conciso e digno.
