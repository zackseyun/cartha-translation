  text: We trampled the house of holiness[b][a], just as the houses of the people of Jerusalem are trampled.
translation:
  language: pt
  text: Nós pisoteamos a casa da santidade[a], assim como são pisoteadas as casas dos habitantes de Jerusalém[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a casa da consagração” ou “o templo da santidade”; também, conforme o contexto, “o santuário”. O grego diz literalmente “a casa da santificação”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, dos moradores de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεπατήσαμεν / καταπατοῦνται
  choice: pisoteamos / são pisoteadas
  rationale: Preserva o sentido concreto de καταπατέω e a repetição retórica do mesmo verbo nas formas ativa e passiva.
- source_word: τὸν οἶκον
  choice: a casa
  rationale: Traduz literalmente οἶκος e mantém o vínculo lexical com o plural οἱ οἶκοι na segunda oração; o contexto e o complemento indicam que se trata do templo.
- source_word: τοῦ ἁγιασμοῦ
  choice: da santidade
  rationale: Expressa de modo natural em português o substantivo abstrato ἁγιασμός, que aqui comunica santidade ou consagração cultual, sem reduzi-lo simplesmente ao adjetivo 'santa'.
- source_word: ὡς
  choice: assim como
  rationale: Marca com clareza e naturalidade a comparação introduzida por ὡς.
- source_word: οἱ οἶκοι
  choice: as casas
  rationale: É a tradução direta do plural de οἶκος e conserva a repetição de 'casa/casas' presente no grego.
- source_word: τῶν προσολυμίων
  choice: dos habitantes de Jerusalém
  rationale: O gentílico designa os moradores de Jerusalém; esta formulação é clara e corrente em português.
theological_decisions:
- issue: Se οἶκος deve ser traduzido literalmente como 'casa' ou explicitado como 'templo'
  choice: a casa da santidade
  alternative: o templo santo; o santuário
  rationale: O grego emprega οἶκος, 'casa', seguido de um genitivo que assinala seu caráter sagrado. A tradução conserva a imagem e evita explicitar no corpo do texto mais do que a fonte diz.
- issue: Como representar ἁγιασμός no contexto do templo
  choice: santidade
  alternative: consagração; santificação
  rationale: '''Santidade'' preserva o substantivo abstrato e soa mais natural neste contexto cultual. ''Consagração'' também é possível, enquanto ''santificação'' pode sugerir em português sobretudo um processo.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a repetição deliberada de 'casa/casas' e de 'pisotear', bem como o contraste entre a ação confessada na primeira oração e o passivo da comparação.
