base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/028.yaml
  text: Let no one who does not sacrifice enter their sanctuaries[a], but let all the Jews be subjected to registration and slave status[c][b], and let those who object be taken by force and put to death.
translation:
  language: pt
  text: Que ninguém que não ofereça sacrifícios entre nos santuários deles[a]; que todos os judeus sejam submetidos ao registro[b] e à condição de escravos[c]; e que os que se opuserem sejam levados à força e mortos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugares sagrados deles”. O grego também pode referir-se às coisas ou aos ritos sagrados.
    reason: lexical_alternative
  - marker: b
    text: O “registro” pode referir-se mais especificamente à inscrição oficial para controle estatal, censo ou tributação.
    reason: cultural_note
  - marker: c
    text: A expressão grega indica a condição atribuída a escravos domésticos.
    reason: lexical_clarification
  - marker: d
    text: Literalmente, “afastados da vida”, isto é, mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδένα τῶν μὴ θυόντων
  choice: Que ninguém que não ofereça sacrifícios
  rationale: A construção infinitiva tem força de ordem proibitiva no contexto do decreto. A formulação identifica os excluídos por sua não participação nos sacrifícios, sem acrescentar um objeto não expresso no grego.
- source_word: ἐπὶ τὰ ἱερὰ αὐτῶν εἰσιέναι
  choice: entre nos santuários deles
  rationale: 'Com εἰσιέναι, o sentido espacial de τὰ ἱερά é o mais natural: lugares ou recintos sagrados. A nota preserva a amplitude lexical do termo, que também pode abranger coisas ou ritos sagrados.'
- source_word: λαογραφίαν
  choice: registro
  rationale: Designa a inscrição oficial da população, possivelmente para controle estatal, censo ou tributação. “Registro” evita especificar uma finalidade que o versículo não declara.
- source_word: οἰκετικὴν διάθεσιν
  choice: condição de escravos
  rationale: A expressão impõe uma condição social própria de escravos domésticos. A tradução comunica claramente a degradação jurídica e social, sem suavizá-la como simples serviço.
- source_word: ἀχθῆναι
  choice: sejam submetidos
  rationale: Embora o verbo signifique literalmente “ser conduzidos”, aqui introduz estados impostos pelo decreto; “sejam submetidos” é natural em português e conserva a coerção.
- source_word: τοὺς δὲ ἀντιλέγοντας
  choice: os que se opuserem
  rationale: ἀντιλέγω pode significar contradizer, contestar ou resistir. “Opor-se” preserva essa abrangência no contexto coercitivo.
- source_word: βίᾳ φερομένους
  choice: sejam levados à força
  rationale: Expressa captura ou remoção coercitiva e mantém tanto a passividade quanto a violência explícita da frase.
- source_word: τοῦ ζῇν μεταστῆσαι
  choice: mortos
  rationale: A expressão idiomática significa literalmente afastar alguém da vida. “Mortos” comunica de modo direto o resultado pretendido, enquanto a forma do idioma grego é registrada em nota.
theological_decisions:
- issue: Natureza da condição imposta em οἰκετικὴν διάθεσιν
  choice: condição de escravos
  alternative: condição servil
  rationale: “Condição de escravos” preserva com clareza a força opressiva da expressão e sua ligação com a escravidão doméstica; “condição servil” poderia soar abstrata ou atenuada em português atual.
- issue: Amplitude de τὰ ἱερά
  choice: santuários
  alternative: coisas sagradas ou ritos sagrados
  rationale: O verbo “entrar” favorece uma referência espacial, mas a polissemia do substantivo é preservada em nota, sem resolver além da evidência a possível abrangência cultual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de decreto marcada pela repetição de “que”. Preferiu-se vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. As notas preservam as ambiguidades lexicais relevantes sem sobrecarregar o texto principal.
