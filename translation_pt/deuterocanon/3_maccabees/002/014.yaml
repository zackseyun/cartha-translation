  text: For your dwelling place is the heaven of heaven, unreachable by men.
translation:
  language: pt
  text: Pois a tua morada é o céu do céu[a], inacessível aos seres humanos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o céu dos céus” ou “o mais alto céu”. O grego preserva uma expressão semítica que designa o céu supremo, a morada transcendente de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικητήριόν
  choice: morada
  rationale: O substantivo designa o lugar onde alguém habita. “Morada” é natural, digna e preserva o sentido locativo concreto.
- source_word: οὐρανὸς τοῦ οὐρανοῦ
  choice: o céu do céu
  rationale: A tradução conserva a forma singular incomum do grego e sua expressão superlativa de fundo semítico, sem reduzi-la silenciosamente a uma explicação.
- source_word: ἀνέφικτος
  choice: inacessível
  rationale: O adjetivo indica aquilo que não pode ser alcançado ou a que não se pode ter acesso; “inacessível” é preciso e natural neste contexto.
- source_word: ἀνθρώποις
  choice: aos seres humanos
  rationale: O plural refere-se genericamente à humanidade, não apenas a pessoas do sexo masculino. A formulação comunica esse alcance com clareza no português atual.
theological_decisions:
- issue: Expressão superlativa semítica οὐρανὸς τοῦ οὐρανοῦ
  choice: o céu do céu
  alternative: o céu dos céus; o mais alto céu
  rationale: A forma literal mantém a estranheza e a ressonância bíblica do grego; a nota oferece as interpretações idiomáticas sem fixar uma delas no texto.
- issue: Alcance genérico de ἀνθρώποις
  choice: aos seres humanos
  alternative: aos homens; às pessoas
  rationale: O referente é a humanidade em geral. A escolha evita uma leitura indevidamente restrita ao sexo masculino e preserva o contraste teológico entre a morada transcendente de Deus e a incapacidade humana de alcançá-la.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A sintaxe segue de perto o grego, enquanto “morada” e “aos seres humanos” evitam rigidez desnecessária.
