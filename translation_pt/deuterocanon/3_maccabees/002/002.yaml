  text: For you are the one who created all things and rules over all; you are a righteous sovereign[a], and you judge those who do anything in insolence and arrogance.
translation:
  language: pt
  text: Pois tu és aquele que criou todas as coisas e dominas sobre tudo; és um soberano justo[a] e julgas os que praticam atos de insolência e arrogância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “és um governante reto”. O grego permite traduzir δίκαιος por “justo” ou “reto”, e δυνάστης por “soberano” ou “governante”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ γὰρ εἶ
  choice: Pois tu és
  rationale: Mantém o valor explicativo de γάρ e a ênfase do pronome explícito σὺ, com fluidez adequada ao contexto de oração.
- source_word: ὁ κτίσας τὰ πάντα
  choice: aquele que criou todas as coisas
  rationale: Preserva a força verbal do particípio substantivado e o alcance abrangente de τὰ πάντα.
- source_word: τῶν ὅλων ἐπικρατῶν
  choice: dominas sobre tudo
  rationale: Expressa o exercício ativo de poder e domínio indicado por ἐπικρατέω, sem introduzir terminologia teológica posterior.
- source_word: δυνάστης δίκαιος
  choice: um soberano justo
  rationale: δυνάστης designa quem detém poder ou governo, e δίκαιος, neste contexto de julgamento, é naturalmente expresso por 'justo'; a formulação também pode ser entendida como 'governante justo'.
- source_word: τοὺς ... τι πράσσοντας
  choice: os que fazem qualquer coisa
  rationale: Conserva o caráter indefinido de τι e a ação expressa pelo particípio πράσσοντας, embora 'os que agem' seja uma alternativa mais idiomática.
- source_word: ὕβρει καὶ ἀγερωχίᾳ
  choice: com insolência e arrogância
  rationale: Reproduz a combinação de conduta ultrajante ou insolente e altivez arrogante, em português atual e claro.
- source_word: κρίνεις
  choice: julgas
  rationale: Mantém o sentido judicial amplo de κρίνω sem antecipar necessariamente condenação.
theological_decisions:
- issue: Sentido de δίκαιος ao qualificar o governo e o julgamento de Deus
  choice: justo
  alternative: reto
  rationale: Ambas as opções comunicam correção moral; 'justo' se encaixa naturalmente no contexto explícito de julgamento, sem reduzir o termo a mera imparcialidade processual.
- issue: Força governamental de δυνάστης
  choice: soberano
  alternative: governante
  rationale: '''Soberano'' preserva o caráter elevado da oração e a ideia de autoridade poderosa; ''governante'' permanece lexicalmente possível.'
translation_notes:
  register: Português moderno, claro e digno, com cadência de oração solene. Emprega 'tu' para conservar o discurso direto enfático do grego e evita vocabulário arcaico.
