base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/026.yaml
  text: He was not only inflamed with shameless debaucheries[a], but also advanced to such a degree of audacity that slanders were being stirred up in the places, and many of his friends, straining toward the king’s purpose[b], were themselves following his will.
translation:
  language: pt
  text: Ele não apenas foi consumido por devassidões desavergonhadas, mas chegou a tal grau de atrevimento que começaram a surgir calúnias nas diversas localidades[a], e muitos de seus amigos, empenhando-se em favor do propósito do rei[b], também seguiam a vontade dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos lugares” ou “pelos distritos”. A expressão grega não define com precisão o alcance geográfico.
    reason: lexical_alternative
  - marker: b
    text: Ou “esforçando-se na direção do propósito do rei”. A expressão indica esforço ativo para promover ou acompanhar a intenção real.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηκέσθη
  choice: se deixou consumir
  rationale: O verbo evoca literalmente ser mordido ou corroído. Em português, “se deixou consumir” transmite de modo natural a ação interior e destrutiva dos vícios, sem recorrer à imagem pouco idiomática de ser “mordido” por eles.
- source_word: ἀναισχύστοις ἀσελγείαις
  choice: devassidões desavergonhadas
  rationale: Mantém o plural, a forte censura moral de ἀσέλγεια e a ideia explícita de ausência de vergonha em ἀναισχύστοις.
- source_word: ἐπὶ τοσοῦτον θράσους προῆλθεν
  choice: chegou a tal grau de atrevimento
  rationale: Conserva tanto a progressão indicada pelo verbo quanto a intensificação da ousadia insolente, em português corrente e digno.
- source_word: δυσφημίας ... συνίστασθαι
  choice: começaram a surgir calúnias
  rationale: δυσφημία pode indicar fala difamatória ou relatos maldosos, e συνίστασθαι sugere que isso se formava ou era posto em movimento. A formulação portuguesa evita especificar além do texto quem as difundia.
- source_word: ἐν τοῖς τόποις
  choice: nas diversas localidades
  rationale: A expressão grega é geral e pode referir-se a lugares, localidades ou distritos. “Nas diversas localidades” é natural sem fixar uma divisão administrativa específica.
- source_word: ἐντείνοντας εἰς τὴν τοῦ βασιλέως πρόθεσιν
  choice: empenhando-se em favor do propósito do rei
  rationale: O particípio expressa esforço dirigido ao propósito real. “Empenhando-se em favor” preserva tanto o esforço quanto o alinhamento ativo, sem a estranheza de uma reprodução literal como “esticando-se para”.
- source_word: ἕπεσθαι τῇ ἐκείνου θελήσει
  choice: passaram a seguir a vontade dele
  rationale: Expressa a adesão à vontade da figura real mencionada imediatamente antes; “dele” evita repetir “rei” e mantém clara a referência no contexto.
theological_decisions:
- issue: Força da caracterização moral
  choice: “devassidões desavergonhadas”
  alternative: “comportamentos imorais”
  rationale: O grego emprega vocabulário moralmente forte. A tradução conserva essa severidade sem acrescentar categorias doutrinárias posteriores.
- issue: Referente de ἐκείνου na oração final
  choice: A expressão “a vontade dele” retoma o rei.
  alternative: Entender ἐκείνου como referência a outra pessoa implícita.
  rationale: O rei é o antecedente masculino singular mais imediato e a leitura mais natural da construção, embora o pronome grego, isoladamente, não nomeie de novo seu referente.
- issue: Sentido institucional de φίλων
  choice: “seus amigos” em sentido não tecnicamente marcado
  alternative: “os Amigos”, como título de cortesãos reais
  rationale: O termo pode designar membros do círculo cortesão, mas o versículo não exige que a tradução portuguesa imponha um título oficial. A formulação preserva a leitura comum e continua compatível com associados da corte.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período longo do grego foi preservado, mas com encadeamento claro. O tom é digno e moralmente incisivo, sem arcaísmos nem terminologia confessional.
