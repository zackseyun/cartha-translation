  source_fidelity: A tradução representa bem a progressão da frase, a força moral de ἀναισχύστοις ἀσελγείαις, a escalada em θράσος e a referência final à vontade do rei. Contudo, “se deixou consumir” introduz uma nuance reflexiva e volitiva que não está expressa no passivo ἐδηκέσθη. Além disso, “passaram a seguir” sugere um ingresso temporal não indicado por ἕπεσθαι.
  naturalness: O português é claro, moderno e adequado ao registro do livro. “Foi consumido por devassidões desavergonhadas” é igualmente natural e evita a implicação indevida de que ele deliberadamente permitiu ser consumido. “Seguindo também a vontade dele” preserva melhor o aspecto não ingressivo do original.
  terminology: “Devassidões desavergonhadas”, “atrevimento”, “calúnias”, “propósito” e “vontade” mantêm adequadamente a carga semântica e o tom moral do grego. “Localidades” é uma opção legítima para a expressão geográfica geral, com nota que preserva as alternativas.
