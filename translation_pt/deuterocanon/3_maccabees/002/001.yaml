base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/001.yaml
  text: Lord[a], Lord, king of the heavens and master of all creation, holy among the holy ones, sole ruler, Almighty[b], pay attention to us who are being oppressed by an unholy and profane man, swollen with arrogance and strength.
translation:
  language: pt
  text: Senhor, Senhor, rei dos céus e soberano de toda a criação, santo entre os santos[a], único governante, Todo-Poderoso, atende-nos, pois somos oprimidos por um homem ímpio e profano[b], inflado de arrogância e força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «santo nos santos». A expressão grega é compacta e pode indicar tanto a presença no meio dos santos como uma relação interior com eles.'
    reason: lexical_alternative
  - marker: b
    text: O grego não traz explicitamente a palavra «homem»; os termos masculinos no singular descrevem uma única pessoa hostil.
    reason: supplied_word
lexical_decisions:
- source_word: Κύριε, Κύριε
  choice: Senhor, Senhor
  rationale: Mantém a repetição enfática do vocativo divino e emprega o título tradicional, natural e digno em português.
- source_word: βασιλεῦ τῶν οὐρανῶν
  choice: rei dos céus
  rationale: Preserva o plural explícito do grego e corresponde ao uso bíblico natural em português.
- source_word: δέσποτα πάσης τῆς κτίσεως
  choice: soberano de toda a criação
  rationale: Expressa a autoridade absoluta de δεσπότης sem repetir «Senhor» e sem a conotação doméstica que «dono» ou «amo» poderia ter.
- source_word: ἅγιε ἐν ἁγίοις
  choice: santo entre os santos
  rationale: Lê ἐν em sentido associativo, produzindo uma formulação litúrgica natural e preservando a referência plural aos santos.
- source_word: μόναρχε
  choice: único governante
  rationale: Comunica que Deus governa de modo único e exclusivo, evitando restringir o termo à instituição política moderna da monarquia.
- source_word: παντοκράτωρ
  choice: Todo-Poderoso
  rationale: É a forma consagrada e compreensível do título divino, adequada ao alcance de παντοκράτωρ.
- source_word: πρόσχες ἡμῖν
  choice: atende-nos
  rationale: Reproduz de modo conciso e digno o pedido para que Deus preste atenção aos suplicantes.
- source_word: καταπονουμένοις
  choice: somos oprimidos
  rationale: Expressa a pressão e o sofrimento severos causados pelo perseguidor no contexto.
- source_word: ἀνοσίου καὶ βεβήλου
  choice: ímpio e profano
  rationale: 'Mantém distintos os dois qualificativos religiosos e morais: falta de reverência e profanação do sagrado.'
- source_word: θράσει καὶ σθένει πεφρυασμένου
  choice: inflado de arrogância e força
  rationale: Conserva a imagem de alguém ensoberbecido ou inchado e dá a θράσος seu valor negativo no contexto hostil.
theological_decisions:
- issue: Sequência de títulos divinos na invocação
  choice: 'Manter títulos distintos: «Senhor... rei dos céus... soberano... santo... único governante... Todo-Poderoso»'
  alternative: Reduzir ou uniformizar os títulos sob «Senhor» ou «soberano»
  rationale: O acúmulo de epítetos é parte da força retórica e teológica da oração; distingui-los preserva as nuances de κύριος, δεσπότης, μόναρχος e παντοκράτωρ.
- issue: Sentido de ἅγιε ἐν ἁγίοις
  choice: «santo entre os santos»
  alternative: «santo nos santos»
  rationale: O grego compacto admite mais de uma relação para ἐν. A leitura associativa é natural no contexto da invocação, mas a alternativa mais literal é preservada em nota.
- issue: Sujeito humano implícito após ὑπό
  choice: Explicitar «um homem»
  alternative: Traduzir substantivamente como «por um ímpio e profano»
  rationale: Os qualificativos e o particípio masculinos singulares apontam para um perseguidor individual; «homem» torna a frase natural em português sem acrescentar uma identificação ausente do texto.
translation_notes:
  register: Português moderno, solene e acessível, com cadência de oração. «Atende-nos» mantém dignidade sem arcaísmo excessivo; os títulos divinos permanecem distintos, e as ambiguidades relevantes são registradas em notas.
