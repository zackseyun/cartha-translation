lexical_decisions:
- source_word: εὐέλπιδές τε καθιστήκεισαν
  choice: continuavam esperançosos
  rationale: Expressa o estado persistente indicado por καθιστήκεισαν, em português natural, sem intensificar a esperança.
- source_word: ἀντιλήμψεως τεύξασθαι
  choice: obter ajuda
  rationale: ἀντίλημψις designa auxílio ou socorro, e τεύξασθαι indica alcançá-lo ou obtê-lo.
- source_word: ἐβδελύσσοντο
  choice: sentiam repulsa
  rationale: Preserva a forte aversão do verbo grego sem recorrer a uma formulação artificial no português atual.
- source_word: τοὺς ἀποχωροῦντας ἐξ αὐτῶν
  choice: os que se afastavam do meio deles
  rationale: Mantém tanto a ideia de retirada ou separação quanto a origem no interior do próprio grupo.
- source_word: τῆς κοινῆς συναναστροφῆς
  choice: do convívio comum
  rationale: Representa a convivência e interação social compartilhada indicadas por συναναστροφή.
- source_word: εὐχρηστίας
  choice: ajuda mútua
  rationale: No contexto comunitário, o termo aponta para utilidade prática, serviço ou auxílio; 'ajuda mútua' comunica esse apoio concreto sem reduzi-lo apenas a companheirismo.
