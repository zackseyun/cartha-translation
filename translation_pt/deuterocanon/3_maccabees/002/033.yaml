  text: And they remained hopeful of obtaining help, and they loathed those who were withdrawing from among them, and judged them as enemies of the nation, and deprived them of common association and support.
translation:
  language: pt
  text: E continuavam esperançosos de obter ajuda. Sentiam repulsa pelos que se afastavam do meio deles, consideravam-nos inimigos da nação e os privavam do convívio comum e do apoio.
