  yaml_path: translation/deuterocanon/3_maccabees/002/021.yaml
  text: There the God who watches over all[a], the holy forefather among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness[b],
translation:
  language: pt
  text: Foi então que Deus, aquele que vela por todos, o santo antepassado[b] entre os santos[a], tendo ouvido a súplica legítima, açoitou aquele que estava grandemente inflado de insolência e ousadia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “nos lugares santos”, se ἐν ἁγίοις for entendido em sentido locativo, e não como “entre os santos”.
    reason: alternative_reading
  - marker: b
    text: O título grego incomum προπάτωρ significa literalmente “antepassado” ou “ancestral”; também poderia ser traduzido por “pai ancestral”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνταῦθα
  choice: Foi então que
  rationale: Marca com naturalidade o ponto da narrativa em que ocorre a intervenção divina, preservando a possível força temporal do advérbio sem excluir sua ligação com a cena.
- source_word: ὁ πάντων ἐπόπτης θεός
  choice: Deus, aquele que vela por todos
  rationale: ἐπόπτης designa quem observa ou supervisiona. “Vela por todos” mantém tanto a vigilância quanto o cuidado sugeridos pelo título.
- source_word: προπάτωρ
  choice: antepassado
  rationale: É o equivalente lexical direto do título incomum aplicado a Deus. Embora a formulação seja deliberadamente estranha em português, ela preserva a imagem ancestral do grego sem acrescentar uma qualificação ausente.
- source_word: ἅγιος ἐν ἁγίοις
  choice: o santo ... entre os santos
  rationale: A leitura pessoal se ajusta à sequência de títulos divinos, mas a forma dativa também permite a leitura locativa “nos lugares santos”; essa ambiguidade é registrada em nota.
- source_word: εἰσακούσας
  choice: tendo ouvido
  rationale: Reproduz o particípio aoristo e, no contexto da oração atendida, comunica uma escuta favorável.
- source_word: τῆς ἐνθέσμου λιτανείας
  choice: a súplica legítima
  rationale: λιτανεία é uma súplica ou petição; ἐνθέσμος caracteriza aquilo que está de acordo com a norma, o costume ou a ordem devida. “Legítima” evita restringir o sentido a uma lei específica.
- source_word: ἐμάστιξεν
  choice: açoitou
  rationale: Conserva a imagem forte e concreta do verbo grego, empregado aqui para a ação punitiva de Deus.
- source_word: τὸν ὕβρει καὶ θράσει μεγάλως ἐπηρμένον
  choice: aquele que se havia exaltado grandemente em insolência e ousadia
  rationale: Preserva a metáfora de elevar-se em orgulho e distingue a arrogância ultrajante de ὕβρις da audácia temerária de θράσος.
theological_decisions:
- issue: O título divino προπάτωρ
  choice: antepassado
  alternative: pai ancestral; progenitor
  rationale: O grego atribui a Deus um título ancestral incomum. A tradução direta conserva a tensão e evita inserir “soberano” ou outra explicação que não aparece no texto.
- issue: O sentido de ἅγιος ἐν ἁγίοις
  choice: o santo entre os santos
  alternative: o Santo nos lugares santos
  rationale: A leitura pessoal combina melhor com a cadeia de epítetos divinos, mas a morfologia permite uma leitura locativa genuína, preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe narrativa fluente. Mantiveram-se o título ancestral incomum, a ambiguidade de ἐν ἁγίοις em nota e a vívida imagem de punição em “açoitou”. A vírgula final reflete a continuidade sintática do texto grego para o versículo seguinte.
