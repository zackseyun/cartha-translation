base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/008.yaml
  text: You[a], O King, having created the boundless and immeasurable earth, chose this city and made this place holy for your name, though you have no need of anything[b], O God of all, and glorified it with majestic manifestation, having established it for the glory of your great and honored name.
translation:
  language: pt
  text: Tu, ó Rei, que criaste a terra ilimitada e imensurável, escolheste esta cidade e santificaste este lugar para o teu nome — tu, Deus de todas as coisas, que de nada necessitas[a] — e o glorificaste com uma manifestação majestosa[b], estabelecendo-o para a glória do teu grande e honrado nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego nesta expressão é sintaticamente difícil e não traz explicitamente o substantivo «Deus». A tradução entende a expressão como uma aposição dirigida a Deus: aquele que não necessita de nada e é Deus de todas as coisas.'
    reason: alternative_reading
  - marker: b
    text: Ou «com uma aparição majestosa»; a expressão grega pode referir-se a uma epifania divina visível.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦ
  choice: ó Rei
  rationale: Preserva o vocativo dirigido a Deus e o tom elevado da oração, de modo natural em português.
- source_word: κτίσας
  choice: depois de criares
  rationale: Expressa a anterioridade do particípio aoristo em relação aos verbos principais sem tornar a frase artificial.
- source_word: ἀπέρατον καὶ ἀμέτρητον γῆν
  choice: a terra sem limites e imensurável
  rationale: Mantém os dois qualificativos intensificadores e o alcance cósmico de γῆ neste contexto de criação.
- source_word: ἐξελέξω
  choice: escolheste
  rationale: É a equivalência corrente e direta para a escolha divina da cidade, sem tecnicismo teológico adicional.
- source_word: ἡγίασας
  choice: santificaste
  rationale: Conserva de modo conciso e reconhecível a ideia de tornar santo ou consagrar.
- source_word: εἰς σὸν ὄνομά
  choice: para o teu nome
  rationale: Preserva a formulação teológica e a noção de dedicação ao nome de Deus.
- source_word: τῷ τῶν ἁπάντων ἀπροσδεεῖ
  choice: tu, o Deus de todas as coisas, que de nada necessitas
  rationale: Torna inteligível a aposição dativa e comunica tanto a universalidade quanto a ausência de necessidade, sem esconder a dificuldade sintática do grego, registrada em nota.
- source_word: παρεδόξασας
  choice: o glorificaste
  rationale: Mantém o campo semântico de glória e entende o pronome como retomando o lugar, interpretação contextual natural.
- source_word: ἐν ἐπιφανείᾳ μεγαλοπρεπεῖ
  choice: com uma manifestação majestosa
  rationale: Conserva a possível nuance de epifania visível e o caráter magnificente da manifestação.
- source_word: σύστασιν ποιησάμενος αὐτοῦ
  choice: estabelecendo-o
  rationale: Reproduz de forma idiomática a construção comprimida que indica a fundação ou consolidação do lugar.
- source_word: πρὸς δόξαν τοῦ μεγάλου καὶ ἐντίμου ὀνόματός σου
  choice: para a glória do teu grande e honrado nome
  rationale: Mantém a finalidade expressa por πρὸς e o vocabulário recorrente de glória, honra e nome.
theological_decisions:
- issue: Sentido e relação sintática de τῷ τῶν ἁπάντων ἀπροσδεεῖ
  choice: tu, o Deus de todas as coisas, que de nada necessitas
  alternative: tu, que não necessitas de nenhuma de todas as coisas
  rationale: O texto grego é sintaticamente difícil e não traz explicitamente o substantivo “Deus”. A redação escolhida entende a expressão como aposição ao destinatário da oração e explicita o referente para clareza, enquanto a nota preserva a incerteza e a alternativa mais estritamente literal.
- issue: Natureza de ἐπιφάνεια
  choice: manifestação majestosa
  alternative: aparição majestosa
  rationale: “Manifestação” preserva a possibilidade de uma epifania divina perceptível sem afirmar além do texto a forma exata dessa manifestação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” coerente com a oração direta. A estrutura participial foi suavizada para fluência, enquanto os termos teológicos centrais — santificar, nome e glória — foram preservados.
