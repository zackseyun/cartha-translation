  source_fidelity: 'A tradução transmite adequadamente a sequência principal: Deus cria a terra, escolhe a cidade, santifica o lugar e o torna glorioso para a glória de seu nome. A aposição referente àquele que não necessita de nada é uma solução contextual defensável para a sintaxe difícil do grego. A nota a, porém, chama de mais literal uma formulação que acrescenta «tu» e apresenta de modo impreciso a construção grega; deve descrever a dificuldade sem oferecer uma falsa literalidade.'
  naturalness: O registro oracional é digno e claro. «Que criaste» é mais direto e natural do que «depois de criares» neste período, preservando a relação participial sem uma construção temporal que possa parecer excessivamente marcada. «Ilimitada» soa um pouco mais corrente que «sem limites» neste par de adjetivos.
  terminology: «Ó Rei», «santificaste», «nome», «glória» e «manifestação majestosa» preservam bem o vocabulário religioso sem impor interpretação confessional. «Deus de todas as coisas» explicita o referente subentendido; a nota deve deixar claro que essa explicitação é interpretativa.
  issues:
