  text: They too, when they saw the works of your hand, praised you, the Almighty.
translation:
  language: pt
  text: Eles também, ao verem as obras da tua mão, louvaram-te, o Todo-Poderoso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ καὶ
  choice: Eles também
  rationale: Retoma o grupo mencionado no contexto e conserva a força aditiva de καί em português natural.
- source_word: συνιδόντες
  choice: ao verem
  rationale: O particípio aoristo indica a percepção que antecede ou acompanha o louvor; a construção temporal mantém essa relação sem tornar explícita uma nuance além do grego.
- source_word: ἔργα σῆς χειρός
  choice: as obras da tua mão
  rationale: Conserva tanto o sentido comum de ἔργα como a metáfora bíblica da mão divina, sem reduzi-la interpretativamente a “poder”.
- source_word: ἤνεσάν σε
  choice: louvaram a ti
  rationale: Expressa diretamente o ato de louvar e mantém o pronome de segunda pessoa como objeto, permitindo que o título seguinte permaneça em aposição clara.
- source_word: τὸν παντοκράτορα
  choice: o Todo-Poderoso
  rationale: Equivalente bíblico corrente de παντοκράτωρ, comunicando poder universal e preservando sua função de título divino.
theological_decisions:
- issue: Tradução do título divino παντοκράτωρ
  choice: o Todo-Poderoso
  alternative: o Soberano de tudo
  rationale: “Todo-Poderoso” é uma forma estabelecida, clara e fiel à ênfase do título no poder universal de Deus, sem acrescentar conteúdo doutrinário ausente do grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência bíblica moderada. A expressão “tua mão” preserva o antropomorfismo do original, e “ao verem” reproduz de modo natural a construção participial grega.
