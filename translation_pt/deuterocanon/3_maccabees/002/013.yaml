revisions:
- from: Mas, enquanto estamos prostrados, este homem insolente e profano procura ultrajar o lugar santo que, na terra, foi designado pelo nome da tua glória.[a]
  to: Mas, em nossa queda, este homem insolente e profano procura ultrajar o lugar santo na terra, designado pelo nome da tua glória.[a]
