  source_fidelity: A redação transmite adequadamente a caracterização do homem e sua intenção de ultrajar o lugar santo. Contudo, «enquanto estamos prostrados» transforma o sintagma nominal ἐν τῇ ἡμετέρᾳ καταπτώσει em uma oração temporal e atribui uma imagem corporal mais específica do que «em nossa queda/ruína». Além disso, a posição de «na terra» dentro da relativa pode fazê-lo incidir sobre «foi designado», quando no grego qualifica mais naturalmente «lugar santo».
  naturalness: «Mas, em nossa queda» é uma formulação digna, clara e mais próxima da construção grega. «O lugar santo na terra, designado pelo nome da tua glória» preserva a solenidade sem a ambiguidade sintática desnecessária da versão apresentada.
  terminology: «Insolente», «profano», «procura ultrajar», «lugar santo» e «pelo nome da tua glória» são escolhas adequadas. A nota deve evitar «santuário santo», combinação redundante em português; «santuário» é alternativa suficiente para ἅγιον τόπον.
