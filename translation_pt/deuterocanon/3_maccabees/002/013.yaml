base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/013.yaml
  text: But in our downfall this bold and profane man is attempting to insult the holy place on earth appointed by the name of your glory[a].
translation:
  language: pt
  text: Mas, em nossa queda, este homem insolente e profano procura ultrajar o lugar santo na terra, designado pelo nome da tua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o santuário na terra, assinalado pelo nome da tua glória”.'
    reason: Registra alternativas legítimas para ἅγιον τόπον e ἀναδεδειγμένον, sem restringir a referência a uma área específica do templo.
lexical_decisions:
- source_word: καταπτώσει
  choice: prostrados
  rationale: O substantivo indica queda ou abatimento. A formulação verbal natural em português expressa a condição humilhada e aflitiva do povo sem pressupor sua destruição total.
- source_word: θρασὺς
  choice: insolente
  rationale: No contexto, o adjetivo não elogia coragem, mas descreve ousadia desavergonhada; “insolente” comunica claramente essa força negativa.
- source_word: βέβηλος
  choice: profano
  rationale: O termo caracteriza quem não respeita o que é sagrado e mantém o contraste explícito com “lugar santo”.
- source_word: ἐπιτηδεύει
  choice: procura
  rationale: Com o infinitivo, o verbo expressa empenho deliberado ou propósito ativo. “Procura” é corrente e não limita a ação a uma tentativa possivelmente ineficaz.
- source_word: καθυβρίσαι
  choice: ultrajar
  rationale: O verbo intensivo denota tratamento arrogante, ofensivo e desonroso. “Ultrajar” acomoda naturalmente um lugar sagrado como objeto.
- source_word: ἀναδεδειγμένον
  choice: foi designado
  rationale: O particípio perfeito pode indicar algo publicamente assinalado, declarado ou designado. “Foi designado” é natural e preserva a ideia de identificação pública, sem introduzir uma manifestação visual.
- source_word: τῷ ὀνόματι τῆς δόξης σου
  choice: pelo nome da tua glória
  rationale: A tradução conserva a estrutura comprimida e solene do grego, sem reduzir “nome” e “glória” ao mais interpretativo “teu nome glorioso”.
- source_word: ἅγιον τόπον
  choice: lugar santo
  rationale: É uma correspondência direta e reconhecível que não restringe a referência ao recinto interior do santuário.
theological_decisions:
- issue: Referência do lugar sagrado
  choice: “lugar santo” refere-se ao templo de Jerusalém sem especificar uma de suas áreas internas
  alternative: “santuário santo”, entendido mais especificamente como o recinto sagrado
  rationale: O grego emprega a expressão geral ἅγιον τόπον, e não um termo técnico que exija restringir a referência ao santuário interior.
- issue: Relação entre o lugar e o nome da glória divina
  choice: manter a formulação “designado pelo nome da tua glória”
  alternative: explicitar como “dedicado ao teu nome glorioso”
  rationale: A construção grega é semanticamente comprimida. A redação escolhida conserva a ambiguidade entre designação, identificação pública e associação cultual, sem decidir que o dativo indica exclusivamente finalidade ou dedicação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com ordem ajustada para evitar que “na terra” pareça modificar apenas a designação. “Insolente” recupera a carga pejorativa de θρασύς, que “ousado” poderia enfraquecer. O marcador [a] aparece no texto principal.
