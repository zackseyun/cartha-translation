base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/006.yaml
  text: And when he pursued him with chariots and a multitude of people[a], you overwhelmed him in the depths of the sea; but those who had put their trust in you, who rule over all creation[b], you brought safely through.
translation:
  language: pt
  text: E, quando ele o perseguiu com carros de guerra e uma grande multidão[a], tu o submergiste nas profundezas do mar; mas aqueles que tinham confiado em ti, que governas toda a criação[b], tu os conduziste em segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O versículo alude ao êxodo: o perseguidor egípcio foi submerso no mar, enquanto o povo de Deus foi conduzido em segurança.'
    reason: cross_reference
  - marker: b
    text: 'Ou: «que exerces domínio sobre toda a criação».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδιώξαντα
  choice: quando ele o perseguiu
  rationale: O particípio descreve uma perseguição hostil. A formulação preserva os pronomes do grego sem inserir explicitamente Faraó ou Israel.
- source_word: σὺν ἅρμασιν καὶ ὄχλων πλήθει
  choice: com carros e uma grande multidão
  rationale: «Carros» traduz ἅρμασιν no contexto militar, e «uma grande multidão» expressa de modo natural o volume numérico de ὄχλων πλήθει.
- source_word: ἐπέκλυσας
  choice: tu o submergiste
  rationale: O verbo indica cobrir ou inundar com água; «submergiste» comunica com clareza a ação no contexto do mar.
- source_word: βάθει θαλάσσης
  choice: nas profundezas do mar
  rationale: A expressão conserva a imagem espacial do abismo marinho e admite a nuance locativa do dativo.
- source_word: ἐμπιστεύσαντας ἐπὶ σοὶ
  choice: aqueles que haviam depositado a confiança em ti
  rationale: A construção denota pôr a confiança em alguém; o mais-que-perfeito mantém a anterioridade dessa confiança em relação ao livramento.
- source_word: τῷ τῆς ἁπάσης κτίσεως δυναστεύοντι
  choice: que dominas sobre toda a criação
  rationale: δυναστεύω exprime domínio ou governo. A oração relativa liga naturalmente a descrição a Deus e preserva a afirmação de domínio universal.
- source_word: σώους διεκόμισας
  choice: tu os conduziste em segurança para o outro lado
  rationale: σώους indica preservação incólume, enquanto διακομίζω sugere condução através ou para o outro lado; a tradução reúne ambas as ideias no contexto da travessia.
theological_decisions:
- issue: Identificação da alusão histórica
  choice: Manter implícitos o perseguidor e o perseguido no texto principal.
  alternative: Inserir «Faraó» e «Israel».
  rationale: O grego emprega pronomes sem nomear as personagens neste versículo. A nota esclarece a alusão ao êxodo sem acrescentar nomes ao texto traduzido.
- issue: Linguagem do domínio divino
  choice: «que dominas sobre toda a criação»
  alternative: «soberano de toda a criação»
  rationale: A opção escolhida conserva a forma verbal de δυναστεύοντι e apresenta com clareza o domínio universal de Deus, sem introduzir uma formulação confessional adicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas verbais em «tu» por se tratar de oração dirigida diretamente a Deus. A sintaxe mantém a solenidade do período grego sem sacrificar a clareza.
