translation:
  language: pt
  text: Apaga os nossos pecados[a], dispersa os nossos desatinos[b] e faze resplandecer a tua misericórdia nesta hora.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «elimina os nossos pecados».'
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode significar «erros», «insensatezes» ou «imprudências».
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «neste momento».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάλειψον
  choice: apaga
  rationale: O imperativo de ἀπαλείφω descreve apagar ou remover por completo. «Apaga» conserva a imagem e soa natural numa súplica em português.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: os nossos pecados
  rationale: Ἁμαρτία tem aqui seu sentido moral e religioso habitual; «pecados» é a tradução direta e adequada ao contexto penitencial.
- source_word: διασκέδασον
  choice: dispersa
  rationale: O verbo significa espalhar ou dispersar. «Dispersa» preserva a metáfora concreta do grego, embora «dissipa» também fosse idiomático.
- source_word: τὰς ἀμβλακίας ἡμῶν
  choice: os nossos desatinos
  rationale: O substantivo raro ἀμβλακία pode indicar erros, insensatezes ou atos de imprudência culpável. «Desatinos» mantém sua dimensão moral sem reduzi-la a mero equívoco intelectual.
- source_word: ἐπίφανον
  choice: faze resplandecer
  rationale: O imperativo de ἐπιφαίνω pode exprimir fazer aparecer, manifestar ou brilhar. «Faze resplandecer» conserva a imagem epifânica e rege naturalmente «misericórdia».
- source_word: τὸ ἔλεός σου
  choice: a tua misericórdia
  rationale: «Misericórdia» é a equivalência corrente de ἔλεος e se ajusta à súplica por perdão e socorro divinos.
- source_word: κατὰ τὴν ὥραν ταύτην
  choice: nesta hora
  rationale: A expressão temporal aponta para o momento presente e urgente da oração; «nesta hora» é direta, digna e natural.
theological_decisions:
- issue: Relação entre ἁμαρτίας e ἀμβλακίας na confissão
  choice: Distinguir «pecados» de «desatinos».
  alternative: Traduzir ambos por termos quase sinônimos, como «pecados» e «transgressões», ou verter ἀμβλακίας por «erros» ou «insensatezes».
  rationale: O grego emprega dois substantivos diferentes numa acumulação retórica. A distinção preserva a textura da confissão sem impor uma classificação teológica técnica entre duas espécies de culpa.
- issue: Imagem de ἐπίφανον aplicada à misericórdia divina
  choice: Preservar a linguagem de manifestação luminosa com «faze resplandecer».
  alternative: Usar «mostra» ou «manifesta».
  rationale: O verbo permite tanto a ideia de aparecer quanto a de brilhar. A formulação escolhida conserva essa força imagética sem afirmar uma doutrina específica de manifestação divina.
translation_notes:
  register: Português moderno, claro e solene, com cadência de oração. Mantiveram-se os imperativos paralelos e as imagens concretas do grego, evitando arcaísmos excessivos e terminologia confessional específica.
