  yaml_path: translation/deuterocanon/3_maccabees/002/020.yaml
  text: There the God who watches over all[a], the holy ancestor among the holy ones, having heard the lawful supplication, scourged him who had been greatly puffed up with insolence and boldness,
translation:
  language: pt
  text: Ali, Deus, que vela por todos, o santo antepassado entre os santos[a], depois de ouvir a súplica legítima, açoitou aquele que, por sua insolência e audácia, se havia exaltado tanto,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o santo antepassado nas coisas santas” ou “nos lugares santos”. A expressão grega é ambígua e pode ter sentido cúltico.'
    reason: Registra as leituras não pessoais ou locais possíveis de ἅγιος ἐν ἁγίοις sem impô-las ao texto principal.
lexical_decisions:
- source_word: Ἐνταῦθα
  choice: Ali
  rationale: Preserva o valor espacial e narrativo do advérbio, apontando para a cena mencionada imediatamente antes.
- source_word: ὁ πάντων ἐπόπτης θεὸς
  choice: Deus, que vela por todos
  rationale: Expressa de modo natural a ideia de Deus como aquele que observa e supervisiona todas as pessoas e coisas, sem o tom institucional de “supervisor”.
- source_word: προπάτωρ
  choice: antepassado
  rationale: Mantém o epíteto ancestral incomum do grego, sem substituí-lo pela fórmula mais conhecida, mas não explícita, “Deus de nossos pais”.
- source_word: ἅγιος ἐν ἁγίοις
  choice: o santo antepassado entre os santos
  rationale: Entende a expressão como uma descrição pessoal de Deus e conserva sua formulação comprimida; a possível leitura cúltica é registrada em nota.
- source_word: εἰσακούσας
  choice: depois de ouvir
  rationale: Torna clara e natural em português a relação circunstancial do particípio aoristo, em contexto de resposta favorável à oração.
- source_word: εὐθέσμου λιτανείας
  choice: súplica legítima
  rationale: “Legítima” comunica conformidade com a lei, a ordem ou o costume, enquanto “súplica” expressa uma petição fervorosa dirigida a Deus.
- source_word: ἐμάστιξεν
  choice: açoitou
  rationale: Preserva a imagem forte e concreta de castigo presente no verbo grego, que pode descrever uma punição divina severa.
- source_word: ὕβρει καὶ θράσει
  choice: por sua insolência e audácia
  rationale: “Insolência” transmite arrogância ofensiva, e “audácia” assume aqui, pela associação e pelo contexto, o sentido negativo de atrevimento presunçoso.
- source_word: μεγάλως ἐπηρμένον
  choice: se havia exaltado tanto
  rationale: Reproduz a imagem metafórica de alguém elevado pelo orgulho e representa o valor intensificador de μεγάλως em português idiomático.
theological_decisions:
- issue: O epíteto divino προπάτωρ no contexto da oração judaica
  choice: antepassado
  alternative: Deus de nossos pais; Pai ancestral; progenitor
  rationale: O texto diz θεὸς καὶ προπάτωρ e emprega um título deliberadamente incomum. A tradução mantém a ressonância ancestral sem expandi-la para uma fórmula teológica mais familiar que não aparece no grego.
- issue: O sentido de ἅγιος ἐν ἁγίοις
  choice: santo entre os santos
  alternative: santo nas coisas santas; santo nos lugares santos
  rationale: A sintaxe imediata favorece uma descrição pessoal ligada a Deus. Como ἐν ἁγίοις também admite uma leitura cúltica ou local, essa ambiguidade genuína é conservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. A ordem foi ajustada moderadamente para fluência, mas foram preservados o título ancestral incomum, a ambiguidade da expressão sobre santidade e a imagem concreta do açoite. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto seguinte.
