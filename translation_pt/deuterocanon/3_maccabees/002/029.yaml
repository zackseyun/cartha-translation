  text: and that those who registered should also be branded on the body with the ivy-leaf emblem of Dionysus by fire[c][b][a], and should also be enrolled in his reduced status of authority.
translation:
  language: pt
  text: e que os que se registrassem[a] fossem também marcados a fogo no corpo com o emblema de Dioniso, uma folha de hera,[b] e fossem ainda inscritos numa condição reduzida de autoridade.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que fossem registrados” ou “os que fossem inscritos”.'
    reason: lexical_alternative
  - marker: b
    text: A folha de hera era um sinal distintivo associado ao culto de Dioniso; aqui, seria gravada no corpo por queimadura.
    reason: cultural_note
  - marker: c
    text: A expressão grega é difícil e pode também significar “numa situação cívica restrita” ou “numa posição jurídica limitada”; mais literalmente, “numa autoridade reduzida”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπογραφομένους
  choice: os que se registrassem
  rationale: O particípio médio/passivo pode indicar os que se registravam ou eram registrados; a forma portuguesa preserva o sentido administrativo e se ajusta à formulação do decreto.
- source_word: χαράσσεσθαι καὶ διὰ πυρός
  choice: fossem também marcados a fogo
  rationale: Com a menção do fogo, χαράσσω descreve uma marca corporal produzida por queimadura. “Marcados a fogo” é corrente e evita sugerir um instrumento específico não expresso.
- source_word: εἰς τὸ σῶμα
  choice: no corpo
  rationale: Reprodução direta e natural da localização corporal da marca.
- source_word: παρασήμῳ Διονύσου κισσοφύλλῳ
  choice: com o emblema de Dioniso, uma folha de hera
  rationale: παράσημον indica sinal distintivo ou emblema, e κισσόφυλλον identifica esse emblema como uma folha de hera ligada a Dioniso.
- source_word: προκαταχωρίσαι
  choice: fossem ainda inscritos
  rationale: O verbo expressa a entrada oficial em uma categoria ou registro; “inscritos” mantém o caráter burocrático sem acrescentar uma sequência temporal incerta.
- source_word: προσυνεσταλμένην αὐθεντίαν
  choice: numa condição jurídica inferior
  rationale: A expressão grega é comprimida e difícil. συνεσταλμένην comunica redução ou restrição, enquanto αὐθεντία pode referir-se a autoridade, posição ou condição. A tradução explicita com cautela o provável efeito jurídico-social, mantendo alternativas na nota.
theological_decisions:
- issue: Marca cultual associada a Dioniso
  choice: Manter explicitamente Dioniso e a folha de hera como seu emblema.
  alternative: Generalizar como “marca pagã” ou “símbolo idolátrico”.
  rationale: O grego nomeia tanto a divindade quanto o sinal distintivo; generalizá-los apagaria informação histórica e religiosa do texto.
- issue: Sentido de προσυνεσταλμένην αὐθεντίαν
  choice: “condição jurídica inferior”, com nota registrando a incerteza.
  alternative: “autoridade reduzida”, “situação cívica restrita” ou “posição legal limitada”.
  rationale: A expressão admite sentidos relacionados a autoridade, posição e condição legal. O contexto aponta para rebaixamento administrativo, mas a nota evita apresentar essa interpretação como indiscutível.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe adequada ao teor de um decreto. “Dioniso” segue a forma portuguesa consagrada. A redação evita tanto o tecnicismo excessivo quanto uma falsa precisão na cláusula administrativa final.
