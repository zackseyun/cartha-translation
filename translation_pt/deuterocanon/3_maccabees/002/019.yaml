base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/019.yaml
  text: Let your mercies quickly come before us[a]; and put praise in the mouth of those who have fallen and whose souls are crushed[b], having made peace for us.
translation:
  language: pt
  text: Que as tuas misericórdias venham depressa ao nosso encontro[a]. Põe louvores na boca dos que estão prostrados e têm a alma esmagada[b], tendo estabelecido a paz para nós[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que as tuas misericórdias se antecipem depressa em nosso favor”. O verbo grego pode indicar chegar antes, antecipar-se ou alcançar.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “dos que caíram e foram esmagados quanto à alma”.'
    reason: literal_rendering
  - marker: c
    text: 'Ou: “depois de estabeleceres a paz para nós”. O particípio grego apresenta a ação como realizada e pode indicar anterioridade ou uma ação estreitamente associada ao pedido.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: προκαταλαβέτωσαν
  choice: venham depressa ao nosso encontro
  rationale: O verbo pode indicar chegar antes, antecipar-se ou alcançar. No contexto da oração, a formulação expressa de modo natural o pedido para que as misericórdias de Deus cheguem prontamente aos suplicantes, sem eliminar a ideia de antecipação.
- source_word: οἰκτιρμοί
  choice: misericórdias
  rationale: Mantém o plural grego e soa natural no registro bíblico e de oração em português atual.
- source_word: αἰνέσεις
  choice: louvores
  rationale: Preserva o plural do substantivo grego e a imagem concreta de Deus pôr expressões de louvor na boca dos aflitos.
- source_word: καταπεπτωκότων
  choice: os que estão prostrados
  rationale: O particípio perfeito descreve pessoas que caíram e permanecem abatidas. “Estão prostrados” comunica esse estado resultante sem restringi-lo necessariamente a uma queda física.
- source_word: συντετριμμένων τὰς ψυχάς
  choice: têm a alma esmagada
  rationale: Reproduz a referência explícita à ψυχή e a intensidade de συντρίβω em linguagem portuguesa clara e natural.
- source_word: ποιήσας ἡμῖν εἰρήνην
  choice: ao estabeleceres a paz para nós
  rationale: A construção liga a concessão do louvor à ação divina de produzir paz. “Estabelecer a paz” traduz ποιέω com εἰρήνη de forma idiomática, enquanto a oração reduzida mantém a relação participial sem forçar uma sequência temporal exclusiva.
theological_decisions:
- issue: Sentido antropológico de ψυχή
  choice: alma
  alternative: vida; interior
  rationale: “Alma” mantém de modo transparente o termo antropológico do grego e sua força emocional, sem definir uma doutrina técnica sobre a constituição humana.
- issue: Relação do particípio ποιήσας com a petição principal
  choice: ao estabeleceres a paz para nós
  alternative: depois de estabeleceres a paz para nós; estabelecendo a paz para nós
  rationale: O particípio aoristo pode ser entendido como ação associada ou anterior à petição. A tradução principal preserva a ligação sem impor rigidamente uma cronologia; a nota registra a possível leitura anterior ou completiva.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém as imagens concretas de misericórdias que chegam, louvores postos na boca e alma esmagada. Evita arcaísmos como “compaixões” e não resolve de modo dogmático a relação temporal do particípio final.
