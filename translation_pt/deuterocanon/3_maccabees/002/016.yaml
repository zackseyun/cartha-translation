  yaml_path: translation/deuterocanon/3_maccabees/002/016.yaml
  text: Do not punish us for their uncleanness[a], nor call us to account for profanation, lest the lawless boast in their wrath and exult in the pride of their tongue, saying[b],
translation:
  language: pt
  text: 'Não nos castigues pela impureza deles[a], nem nos chames a prestar contas pela profanação[b], para que os que violam a lei não se vangloriem em sua ira, nem exultem na arrogância de sua língua, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não te vingues de nós na impureza destes”. O verbo grego pode transmitir a ideia de executar justiça ou exercer vingança, e “destes” também é uma tradução possível do pronome.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dessacralização”. O substantivo se refere a tratar como comum aquilo que é santo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδίκησῃς
  choice: castigues
  rationale: O verbo pode indicar fazer justiça, punir ou exercer vingança. No contexto da oração, “castigues” expressa com clareza a ação retributiva sem atribuir a Deus uma atitude de vindita pessoal.
- source_word: ἀκαθαρσίᾳ
  choice: impureza
  rationale: O termo abrange impureza ritual ou moral. “Impureza” conserva o registro religioso e é natural no português atual.
- source_word: εὐθύνῃς
  choice: chames a prestar contas
  rationale: A expressão mantém a nuance judicial do verbo, que pode significar exigir contas ou responsabilizar, sem reduzi-lo ao sentido genérico de julgar.
- source_word: βεβηλώσει
  choice: profanação
  rationale: O substantivo se refere ao tratamento do que é santo como comum ou profano. “Profanação” distingue esse sacrilégio da “impureza” mencionada antes.
- source_word: παράνομοι
  choice: os que violam a lei
  rationale: A formulação preserva a força moral e jurídica do adjetivo substantivado e soa mais clara em português moderno do que “os sem lei”.
- source_word: καυχήσωνται
  choice: se vangloriem
  rationale: O verbo denota gloriar-se ou orgulhar-se. “Vangloriem-se” mantém distinção em relação ao júbilo intenso expresso pelo verbo seguinte.
- source_word: ἀγαλλιάσωνται
  choice: exultem
  rationale: O verbo comunica alegria intensa e triunfante. “Exultem” corresponde ao tom elevado da oração.
- source_word: θυμῷ αὐτῶν
  choice: sua ira
  rationale: θυμός pode significar ira, fúria ou impulso apaixonado. “Ira” é conciso, digno e adequado ao contexto hostil.
- source_word: ὑπερηφανίᾳ γλώσσης αὐτῶν
  choice: na arrogância de sua língua
  rationale: A tradução conserva a imagem concreta da língua e a construção marcada do grego, sem transformá-la apenas em uma referência genérica à fala arrogante.
theological_decisions:
- issue: Se a petição pede que Deus não castigue os suplicantes por causa da impureza e da profanação de outros
  choice: 'τούτων é entendido como referência pessoal aos outros: “deles”.'
  alternative: “destes” ou, de modo mais abstrato, “destas coisas”.
  rationale: O contraste imediato entre “nós” e “os que violam a lei” favorece uma referência a pessoas hostis. A nota registra uma formulação alternativa sem acrescentar ao texto quem são essas pessoas nem eliminar a tensão da súplica.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A construção conserva o paralelismo da oração grega, a distinção entre impureza e profanação e a imagem da língua arrogante.
