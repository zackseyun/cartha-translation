base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/030.yaml
  text: 'But so that he might not appear hateful to everyone[a], he added in writing: “But if some of them choose to live among those initiated in the rites, he makes these equal citizens with the Alexandrians.”'
translation:
  language: pt
  text: 'Mas, para não parecer odioso a todos, acrescentou por escrito: “Mas, se alguns deles preferirem viver entre os iniciados nos ritos[a], ele os torna cidadãos com direitos iguais aos dos alexandrinos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “iniciados nos mistérios”. O grego emprega linguagem própria de iniciação cultual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεχθόμενος
  choice: odioso
  rationale: Com φαίνηται, o particípio descreve como ele seria visto pelos demais; “parecer odioso” preserva esse sentido passivo de causar aversão.
- source_word: ὑπέγραψεν
  choice: acrescentou por escrito
  rationale: No contexto de um decreto, indica a inserção de uma cláusula escrita, sem exigir o tecnicismo “subscreveu”.
- source_word: προαιρῶνται
  choice: preferirem
  rationale: O verbo expressa escolha deliberada ou preferência; “preferirem” soa natural no contexto da opção oferecida.
- source_word: ἐν τοῖς κατὰ τελετὰς μεμυημένοις
  choice: com os iniciados nos ritos
  rationale: Mantém a linguagem de iniciação cultual de μεμυημένοις e o caráter ritual de τελετάς, sem especificar indevidamente um culto particular.
- source_word: ἀναστρέφεσθαι
  choice: conviver
  rationale: Com ἐν e um grupo de pessoas, comunica associação e modo de vida entre elas, de maneira mais natural que “conduzir-se”.
- source_word: ἰσοπολίτας
  choice: cidadania em igualdade
  rationale: Explicita a força jurídico-cívica do termo, isto é, condição de cidadania igual, evitando a possível ambiguidade de “cidadãos iguais”.
- source_word: Ἀλεξανδρεῦσι
  choice: com os alexandrinos
  rationale: 'O dativo estabelece o padrão de igualdade cívica: igualdade com os alexandrinos.'
- source_word: ποιεῖ
  choice: ele lhes concederá
  rationale: Em português, o futuro dentro da cláusula do decreto expressa naturalmente seu efeito normativo, embora o grego empregue o presente “faz”.
theological_decisions:
- issue: Linguagem cultual em narrativa judaica helenística
  choice: iniciados nos ritos
  alternative: iniciados nos mistérios
  rationale: A tradução preserva inequivocamente a iniciação cultual, mas evita tornar “mistérios” uma identificação técnica mais específica do que o contexto exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação jurídica foi tornada idiomática sem eliminar a natureza cultual da condição imposta.
