    reason: lexical_alternative
lexical_decisions:
- source_word: Διακομισθεὶς
  choice: depois de ser levado
  rationale: O particípio aoristo passivo indica que ele foi transferido para o Egito, sem especificar o meio de transporte.
- source_word: ἐπαύξων
  choice: aumentava ainda mais
  rationale: O particípio presente expressa uma intensificação em curso; «ainda mais» comunica o valor aumentativo do verbo no contexto.
- source_word: κακίας
  choice: maldade
  rationale: O termo designa aqui corrupção ou perversidade moral em sentido amplo, não apenas um ato malicioso isolado.
- source_word: προαποδεδειγμένων
  choice: já mencionados
  rationale: O particípio remete a pessoas anteriormente indicadas na narrativa; esta formulação é clara e idiomática em português.
- source_word: συνποτῶν
  choice: companheiros de bebida
  rationale: Preserva a referência concreta aos que bebiam com ele e a conotação negativa do convívio descrito.
- source_word: ἑταίρων
  choice: associados
  rationale: Expressa companheirismo ou ligação social sem sugerir necessariamente amizade genuína.
- source_word: τοῦ παντὸς δικαίου κεχωρισμένων
  choice: alheios a toda justiça
  rationale: O particípio perfeito descreve um estado consolidado de afastamento, e a expressão mantém o alcance moral abrangente do grego.
