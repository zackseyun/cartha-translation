  text: But after he had been conveyed to Egypt[a], and was increasing his wickedness through the previously mentioned drinking companions and associates, who had been estranged from all justice[c][b],
translation:
  language: pt
  text: Mas, depois de ser levado para o Egito[a], ele aumentava ainda mais sua maldade por meio dos já mencionados companheiros de bebida[b] e associados, alheios a toda justiça[c],
