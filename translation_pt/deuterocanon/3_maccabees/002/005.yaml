base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/005.yaml
  text: You made known your power against the bold Pharaoh, when he had enslaved your holy people Israel, testing him with varied and many punishments; by these you made known your great might.
translation:
  language: pt
  text: Foste tu que fizeste o insolente faraó[a], que havia escravizado Israel, teu povo santo, conhecer o teu poder, pondo-o à prova com muitos e variados castigos[b]; por meio deles, deste a conhecer o teu grande poderio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “audacioso faraó”. O adjetivo grego pode indicar ousadia atrevida ou insolente.
    reason: lexical_alternative
  - marker: b
    text: O grego diz “pondo-o à prova com castigos variados e muitos”, expressão que pode sugerir que Deus provou o faraó por meio de sucessivos atos de juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρασὺν
  choice: insolente
  rationale: O adjetivo θρασύς pode expressar ousadia em sentido negativo, como atrevimento ou insolência. “Insolente” comunica essa nuance no contexto da oposição do faraó a Deus, sem acrescentar uma qualificação alheia ao termo.
- source_word: καταδουλωσάμενον
  choice: havia escravizado
  rationale: O particípio descreve uma ação anterior do faraó e contém a ideia explícita de reduzir alguém à escravidão. O mais-que-perfeito composto torna clara essa relação temporal.
- source_word: λαόν σου τὸν ἅγιον Ἰσραήλ
  choice: Israel, teu povo santo
  rationale: Mantém Israel em aposição e conserva explicitamente tanto λαός, “povo”, quanto ἅγιος, “santo”, em uma ordem natural em português.
- source_word: ποικίλαις καὶ πολλαῖς
  choice: muitos e variados
  rationale: Preserva os dois adjetivos e sua ênfase cumulativa, com a ordem mais idiomática em português.
- source_word: δοκιμάσας
  choice: depois de pô-lo à prova
  rationale: Conserva o sentido próprio de testar ou provar e explicita que o objeto é o faraó. “Depois de” expressa naturalmente a circunstância anterior do particípio aoristo, sem reduzir o verbo à simples ideia de punir.
- source_word: τιμωρίαις
  choice: castigos
  rationale: No contexto das pragas e do juízo contra o faraó, “castigos” expressa de modo claro e atual os atos punitivos indicados por τιμωρίαις.
- source_word: ἐγνώρισας
  choice: fizeste ... conhecer / deste a conhecer
  rationale: As duas formulações portuguesas preservam o valor causativo de “tornar conhecido”. Na primeira ocorrência, a construção “fizeste o faraó conhecer” acomoda naturalmente os acusativos gregos; na segunda, “deste a conhecer” evita uma frase artificial, sem alterar o sentido.
- source_word: δύναμιν
  choice: poder
  rationale: Designa a capacidade eficaz de Deus manifestada em seus atos de juízo; “poder” é a correspondência direta e natural.
- source_word: κράτος
  choice: poderio
  rationale: “Poderio” preserva a distinção retórica em relação a δύναμις, traduzido por “poder”, e comunica força manifesta ou soberana.
- source_word: ἐφʼ αἷς
  choice: por meio deles
  rationale: O pronome retoma os castigos como o meio pelo qual o grande poderio de Deus foi dado a conhecer. O masculino plural em português concordorda com “castigos”.
theological_decisions:
- issue: Relação sintática do faraó com a primeira ocorrência de ἐγνώρισας
  choice: O faraó é apresentado como aquele a quem Deus fez conhecer seu poder.
  alternative: Deus tornou conhecido seu poder contra o faraó.
  rationale: 'O acusativo τὸν ... Φαραώ junto de τὴν ... δύναμιν admite naturalmente a construção causativa com pessoa e coisa: Deus fez o faraó conhecer seu poder. Essa leitura segue de perto a sintaxe grega sem excluir que o poder tenha sido exercido contra ele.'
- issue: Força negativa de θρασὺν
  choice: insolente
  alternative: audacioso
  rationale: O contexto de escravização e castigo favorece a nuance censurável de θρασύς. A nota registra a alternativa menos explicitamente negativa, preservando a extensão semântica do termo.
- issue: Repetição de ἐγνώρισας e distinção entre δύναμις e κράτος
  choice: Preservar as duas declarações, distinguindo “poder” de “poderio”.
  alternative: Fundir as duas orações ou repetir “poder” em ambas.
  rationale: A repetição enfática pertence ao texto grego. Mantê-la conserva sua retórica e sua tensão, enquanto “poder” e “poderio” refletem os dois substantivos diferentes sem impor uma distinção doutrinária rígida.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura enfática “Foste tu que” representa o pronome grego σὺ. Empregou-se “faraó” em minúscula como título, e evitou-se linguagem denominacional ou interpretação doutrinária adicional.
