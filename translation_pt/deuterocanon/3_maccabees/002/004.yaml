base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/004.yaml
  text: You burned up the Sodomites[a], who practiced arrogance and had become notorious for their evils, with fire and sulfur[b], setting them forth as an example for those who would come afterward.
translation:
  language: pt
  text: Tu consumiste com fogo e enxofre os habitantes de Sodoma, que praticavam a arrogância e se haviam tornado notórios por suas maldades[a], fazendo deles um exemplo para os que viriam depois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego desta expressão é compacto e difícil. A palavra aqui traduzida por “notórios” costuma significar “não manifesto”, “obscuro” ou “desconhecido”; neste contexto, porém, é frequentemente entendida como indicando que eles se tornaram evidentes ou notórios por suas maldades.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπερηφανίαν ἐργαζομένους
  choice: que praticava a arrogância
  rationale: Preserva a ideia de conduta habitual expressa por ἐργάζομαι, em linguagem natural, sem reduzir ὑπερηφανία a mero sentimento interior.
- source_word: Σοδομίτας
  choice: o povo de Sodoma
  rationale: Expressa diretamente o gentílico grego e evita as conotações especializadas que “sodomitas” adquiriu no português posterior; neste contexto, a referência é aos habitantes de Sodoma.
- source_word: ἀδήλους ταῖς κακίαις γενομένους
  choice: se tornara marcado por suas maldades
  rationale: A formulação grega transmitida é comprimida e difícil. “Marcado por suas maldades” mantém a relação entre a condição adquirida e os atos maus sem resolver de modo excessivamente específico se o sentido contextual é notoriedade, exposição ou desfiguração moral.
- source_word: πυρὶ καὶ θείῳ
  choice: com fogo e enxofre
  rationale: θείον significa enxofre; a expressão é transparente no português moderno e preserva a alusão ao juízo sobre Sodoma.
- source_word: κατέφλεξας
  choice: consumiste
  rationale: O verbo intensivo indica destruição pelo fogo. Com “com fogo e enxofre”, “consumiste” comunica a totalidade do juízo sem redundância pesada.
- source_word: παράδειγμα
  choice: um exemplo
  rationale: É o equivalente nuclear do substantivo; o caráter de advertência já decorre claramente do contexto punitivo.
- source_word: τοῖς ἐπιγινομένοις
  choice: para os que viriam depois
  rationale: Conserva a referência aberta às pessoas ou gerações posteriores sem especificar além do grego.
theological_decisions:
- issue: Descrição do pecado e do juízo de Sodoma sem importar associações doutrinárias posteriores
  choice: O texto menciona arrogância e maldades em termos gerais, e “povo de Sodoma” identifica os habitantes da cidade.
  alternative: Usar “sodomitas” em seu sentido moderno especializado ou ampliar a lista de pecados.
  rationale: O versículo enfatiza a arrogância e as maldades, sem nomear aqui uma transgressão sexual específica. A tradução não acrescenta ao texto uma interpretação posterior.
- issue: Sentido da difícil expressão ἀδήλους ταῖς κακίαις γενομένους
  choice: “se tornara marcado por suas maldades”, com nota que registra a dificuldade lexical
  alternative: “se tornara notório por suas maldades” ou, mais literalmente, “se tornara desconhecido/não manifesto por suas maldades”
  rationale: O sentido comum de ἄδηλος cria tensão com a leitura contextual de exposição ou notoriedade. Uma formulação moderadamente aberta no texto e uma nota explícita preservam a dificuldade em vez de escondê-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “Tu” por se tratar de oração dirigida a Deus e mantém as formas verbais correspondentes. “Povo de Sodoma” evita uma associação moderna indevida, enquanto a nota conserva a tensão lexical do texto grego.
