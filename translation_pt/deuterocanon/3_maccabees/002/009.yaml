base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/009.yaml
  text: And because I love the house of Israel[a], I have promised that if a turning away comes upon us and distress overtakes us, and we come to our place and pray[b], I will hear our prayer.
translation:
  language: pt
  text: E, por amares a casa de Israel, prometeste que, se houver um afastamento da nossa parte[a] e a angústia nos alcançar, e se viermos ao nosso lugar[b] e suplicarmos, ouvirás a nossa súplica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apostasia” ou “deserção”. O termo grego pode indicar afastamento ou defecção, mas aqui não especifica de modo inequívoco uma apostasia em sentido técnico.
    reason: lexical_alternative
  - marker: b
    text: Isto é, provavelmente, o lugar santo ou o templo; o grego diz literalmente “nosso lugar”.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἀγαπῶν
  choice: por amares
  rationale: O particípio circunstancial pode exprimir a motivação do sujeito. “Por amares” soa natural em português e mantém o amor pela casa de Israel como fundamento da promessa, sem criar uma oração independente.
- source_word: οἶκον τοῦ Ἰσραήλ
  choice: a casa de Israel
  rationale: Preserva a expressão bíblica coletiva e pactual, sem reduzi-la apenas a “povo” ou “família”.
- source_word: ἐπηγγείλω
  choice: prometeste
  rationale: 'A forma grega é a segunda pessoa do singular do aoristo médio de ἐπαγγέλλομαι. Portanto, a oração se dirige a Deus: “prometeste”, e não “prometi”.'
- source_word: ἀποστροφή
  choice: um afastamento da nossa parte
  rationale: Mantém a ideia ampla de desvio ou afastamento e liga o genitivo ἡμῶν ao grupo que ora, sem impor no texto principal o termo teológico mais técnico “apostasia”.
- source_word: καταλάβῃ ἡμᾶς στενοχωρία
  choice: a angústia nos alcançar
  rationale: “Alcançar” conserva a imagem de uma aflição que sobrevém ou apanha o povo; “angústia” comunica a pressão e aflição de στενοχωρία.
- source_word: τὸν τόπον ἡμῶν
  choice: ao nosso lugar
  rationale: Traduz diretamente a expressão grega, sem explicitar “santuário” ou “templo”, identificação sugerida pelo contexto mas não declarada pelo substantivo.
- source_word: δεηθῶμεν
  choice: supliquemos
  rationale: O verbo denota oração de petição; “suplicar” preserva essa nuance específica.
- source_word: εἰσακούσῃ τῆς δεήσεως ἡμῶν
  choice: ouvirás a nossa súplica
  rationale: No contexto da promessa feita pelo interlocutor divino, a oração comunica que ele atenderá favoravelmente à súplica. A segunda pessoa mantém a continuidade da invocação.
theological_decisions:
- issue: Pessoa do autor da promessa e daquele que ouve
  choice: 'Segunda pessoa dirigida a Deus: “prometeste ... ouvirás”.'
  alternative: 'Primeira pessoa: “prometi ... ouvirei”.'
  rationale: ἐπηγγείλω é morfologicamente segunda pessoa do singular, e o contexto é de oração dirigida a Deus. εἰσακούσῃ é formalmente um aoristo subjuntivo de terceira pessoa, mas, dentro da oração subordinada introduzida pela promessa e da construção grega, o sentido esperado em português é “ouvirás/atenderás”. A primeira pessoa da camada inglesa não corresponde à forma grega de ἐπηγγείλω.
- issue: Natureza de ἀποστροφή
  choice: “afastamento da nossa parte”, expressão ampla.
  alternative: “apostasia” ou “deserção”.
  rationale: O vocábulo admite a ideia de afastamento ou defecção, mas o verso não define tecnicamente sua natureza. A tradução mantém essa abertura sem minimizar a possibilidade de infidelidade.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa (“amares”, “prometeste”, “ouvirás”) apropriadas à oração dirigida diretamente a Deus. A repetição de “suplicarmos/súplica” reflete deliberadamente a repetição lexical grega.
