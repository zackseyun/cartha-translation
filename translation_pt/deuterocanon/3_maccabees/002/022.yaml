  text: Therefore his friends and bodyguards[a], seeing the acute distress that had come upon him, hurried to set matters straight[b], fearing that even his life might fail.
translation:
  language: pt
  text: Por isso, os amigos e os guarda-costas, vendo a severa punição[a] que o havia atingido, temendo que até a vida lhe faltasse[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “severa correção”. O grego apresenta εὔθυναν como substantivo, e não como o verbo “puseram em ordem”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que até o viver faltasse”. Isto é, temiam que ele morresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz uma conclusão causal a partir do acontecimento anterior, de modo natural em português.
- source_word: φίλοι
  choice: amigos
  rationale: Preserva o sentido básico do termo; embora possa designar pessoas ligadas à corte em contexto régio, o grego não exige a interpretação mais específica de “cortesãos”.
- source_word: σωματοφύλακες
  choice: guarda-costas
  rationale: Equivalente português claro e direto para os guardas pessoais do rei.
- source_word: ὀξεῖαν ... εὔθυναν
  choice: a severa punição
  rationale: ὀξεῖαν e καταλαβοῦσαν concordam com o substantivo feminino εὔθυναν, aqui entendido como correção ou punição severa. Não se toma εὔθυναν como verbo, pois a forma verbal narrativa esperada teria aumento.
- source_word: καταλαβοῦσαν αὐτόν
  choice: que o havia atingido
  rationale: Expressa uma condição ou punição que sobreveio ao rei e o alcançou, sem acrescentar diagnóstico médico.
- source_word: φοβούμενοι
  choice: temeram
  rationale: O particípio indica a reação motivada pelo que viram. A forma finita produz uma oração completa e natural em português, embora o grego mantenha a construção participial ligada à continuação do relato.
- source_word: μὴ καὶ τὸ ζῆν ἐκλείπῃ
  choice: que até a vida lhe faltasse
  rationale: Mantém a imagem grega de a vida cessar ou faltar, em vez de reduzi-la simplesmente a “que morresse”.
theological_decisions:
- issue: Natureza do que atingiu o rei
  choice: punição
  alternative: aflição
  rationale: A leitura nominal de εὔθυναν aponta para correção, prestação de contas ou punição; “aflição” apagaria esse aspecto retributivo presente no vocábulo, embora se evite especificar além disso a origem ou o mecanismo do ocorrido.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A tradução corrige a análise sintática da camada inglesa: εὔθυναν é o substantivo modificado por ὀξεῖαν e καταλαβοῦσαν, não um verbo que significaria “puseram as coisas em ordem”.'
