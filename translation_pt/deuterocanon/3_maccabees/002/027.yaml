  source_fidelity: 'A abertura do rascunho («expôr o povo à desonra») comunica hostilidade pública, mas perde o sentido explícito de διαδοῦναι ψόγον: propagar/divulgar uma censura ou reprovação contra o povo. A revisão preserva esse ato de divulgação. «Decidiu» representa adequadamente προέθετο como propósito ou resolução. A estela é erguida antes de a inscrição ser gravada, e «na torre junto ao pátio» mantém a localização sem especificar indevidamente a natureza de αὐλή.'
