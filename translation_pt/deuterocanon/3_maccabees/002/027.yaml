  text: He publicly proposed to spread reproach against the nation; having set up a stele on the tower by the court, he engraved an inscription
translation:
  language: pt
  text: Decidiu divulgar publicamente uma censura contra o povo; depois de erguer uma estela[a] na torre junto ao pátio[b], gravou nela uma inscrição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma coluna» ou «um monumento». O grego se refere a uma pedra erguida, própria para receber uma inscrição.
    reason: lexical_alternative
  - marker: b
    text: «Pátio» também pode se referir ao pátio de um palácio ou a um recinto fechado; o grego, por si só, não permite precisar a estrutura arquitetônica.
    reason: cultural_note
lexical_decisions:
- source_word: προέθετο
  choice: decidiu
  rationale: O médio de προτίθημι expressa aqui propósito ou decisão. «Decidiu» comunica a intenção definida sem sugerir uma proposta submetida a outros.
- source_word: δημοσίᾳ
  choice: publicamente
  rationale: Mantém de modo natural o sentido adverbial de ação pública ou aberta.
- source_word: κατὰ τοῦ ἔθνους διαδοῦναι ψόγον
  choice: expor publicamente o povo à desonra
  rationale: A formulação portuguesa transmite a disseminação pública de censura e descrédito contra a coletividade, evitando uma construção rígida como «espalhar reprovação contra».
- source_word: ἔθνους
  choice: o povo
  rationale: No contexto, designa o povo judeu como coletividade. «Povo» é mais natural no português bíblico atual do que «nação» neste enunciado.
- source_word: πύργου
  choice: torre
  rationale: Corresponde ao sentido básico de πύργος, sem acrescentar a ideia não expressa de fortaleza.
- source_word: στήλην
  choice: uma estela
  rationale: É o termo preciso para uma pedra ou monumento erguido e destinado a receber uma inscrição; a nota oferece equivalentes mais conhecidos.
- source_word: ἀναστήσας
  choice: depois de erguer
  rationale: Expressa com clareza a anterioridade do particípio aoristo em relação ao ato de gravar.
- source_word: ἐκόλαψεν γραφὴν
  choice: gravou nela uma inscrição
  rationale: No contexto epigráfico, o verbo indica entalhar ou gravar, e γραφή é a inscrição. «Nela» explicita em português o suporte já indicado pela estela, sem mudar o sentido.
- source_word: ἐπὶ τοῦ κατὰ τὴν αὐλὴν πύργου
  choice: na torre junto ao pátio
  rationale: Preserva a relação espacial sem determinar além do grego se αὐλή é pátio comum, pátio palaciano ou recinto.
