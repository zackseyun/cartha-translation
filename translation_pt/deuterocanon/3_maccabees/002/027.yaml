  terminology: «Estela» é o equivalente técnico preciso para στήλη; as alternativas na nota são úteis. «Pátio» preserva a ambiguidade de αὐλή. «Censura» traduz ψόγος sem introduzir uma acusação jurídica ou uma imputação específica não presente no texto.
