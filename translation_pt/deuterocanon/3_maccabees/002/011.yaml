  yaml_path: translation/deuterocanon/3_maccabees/002/011.yaml
  text: For even when our fathers were often afflicted[b][a], you helped them in their humiliation and rescued them from great evils.
translation:
  language: pt
  text: Pois, de fato, muitas vezes, quando nossos pais[a] foram afligidos, tu os ajudaste em sua humilhação e os livraste de grandes males[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossos antepassados”. O grego diz literalmente “nossos pais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “grandes desgraças” ou “grandes calamidades”. Aqui, “males” provavelmente se refere a circunstâncias gravemente danosas, e não apenas ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: Pois também
  rationale: Introduz a razão que sustenta a oração e mantém tanto a força explicativa quanto a ideia de acréscimo, em português natural.
- source_word: πλεονάκις
  choice: muitas vezes
  rationale: Expressa com clareza a repetição indicada pelo advérbio grego.
- source_word: θλιβέντων
  choice: foram afligidos
  rationale: Mantém o sentido passivo de sofrer pressão ou tribulação sem especificar indevidamente a natureza do sofrimento.
- source_word: τῶν πατέρων ἡμῶν
  choice: nossos pais
  rationale: Reproduz diretamente a expressão masculina plural do grego para os antepassados do povo.
- source_word: ἐβοήθησας αὐτοῖς
  choice: tu os ajudaste
  rationale: Tradução direta e corrente do auxílio prestado por Deus; o uso de “tu” condiz com a oração dirigida diretamente a ele.
- source_word: ἐν τῇ ταπεινώσει
  choice: em sua humilhação
  rationale: Preserva a ideia de abatimento ou condição rebaixada e evita fundi-la com a aflição já expressa por θλιβέντων.
- source_word: ἐρρύσω
  choice: os livraste
  rationale: Expressa resgate de perigos e adversidades em registro bíblico digno, sem impor aqui um sentido técnico de salvação.
- source_word: ἐκ μεγάλων κακῶν
  choice: de grandes males
  rationale: Mantém a amplitude de κακά, que no contexto pode abranger danos, desgraças ou calamidades, e não apenas o mal moral.
theological_decisions:
- issue: Linguagem ancestral marcada pelo gênero
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O texto grego emprega πατέρων, literalmente “pais”. A tradução principal conserva essa forma, enquanto a nota esclarece o referente ancestral.
- issue: Sentido de κακῶν na oração sobre livramentos históricos
  choice: grandes males
  alternative: grandes desgraças ou grandes calamidades
  rationale: “Males” preserva a amplitude lexical e a tensão do original; a nota impede que o termo seja entendido exclusivamente como maldade moral.
- issue: Sentido de ταπείνωσις
  choice: humilhação
  alternative: abatimento ou condição humilde
  rationale: O substantivo pode indicar humilhação, rebaixamento ou condição abatida. “Humilhação” preserva essa abertura sem repetir simplesmente a ideia de aflição.
translation_notes:
  register: Português moderno, claro e digno, com forma de oração em segunda pessoa singular. A ordem foi ajustada levemente para fluência, sem eliminar a repetição temporal nem a distinção entre aflição, humilhação e livramento.
