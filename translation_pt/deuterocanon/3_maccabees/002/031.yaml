base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/002/031.yaml
  text: But some[a], lightly despising the foundations of the city's piety, readily gave themselves up, as though they would share in some great renown from the association with the king that was to come.
translation:
  language: pt
  text: Alguns, porém, desprezando levianamente os sustentáculos[a] da devoção da cidade, entregavam-se prontamente, como se viessem a partilhar de grande renome por causa de sua futura associação com o rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bases” ou “apoios”. O termo grego emprega uma metáfora para aquilo que serve de base ou sustentação à devoção da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνιοι
  choice: Alguns
  rationale: Indica de maneira natural um grupo indefinido dentro da população.
- source_word: ἐπιπολαίως
  choice: levianamente
  rationale: Expressa uma atitude superficial e irrefletida, sem atribuir aos envolvidos um motivo não declarado no texto.
- source_word: στυγοῦντες
  choice: desprezando
  rationale: Conserva a forte rejeição do verbo no contexto, enquanto sua combinação com ἐπιπολαίως favorece a ideia de desprezo leviano, não necessariamente de ódio emocional intenso.
- source_word: ἐπιβάθρας
  choice: sustentáculos
  rationale: Mantém a metáfora de bases ou apoios que sustentam a devoção da cidade; a nota registra alternativas plausíveis.
- source_word: τὰς τῆς πόλεως εὐσεβείας
  choice: da devoção da cidade
  rationale: εὐσέβεια designa devoção ou piedade religiosa; 'devoção' é natural em português e preserva o caráter religioso sem reduzi-lo a uma instituição.
- source_word: εὐχερῶς
  choice: prontamente
  rationale: Comunica tanto disposição quanto ausência de hesitação.
- source_word: ἑαυτοὺς ἐδίδοσαν
  choice: entregavam-se
  rationale: Preserva o sentido reflexivo e voluntário, bem como o aspecto imperfeito do verbo grego.
- source_word: κοινωνήσοντες
  choice: fossem participar de
  rationale: O particípio futuro exprime a participação esperada pelos envolvidos.
- source_word: εὐκλείας
  choice: renome
  rationale: Refere-se à boa fama ou reputação pública, evitando a carga teológica que 'glória' poderia adquirir.
- source_word: ἀπὸ τῆς ἐσομένης τῷ βασιλεῖ συναναστροφῆς
  choice: graças à futura convivência com o rei
  rationale: Expressa a associação social esperada com o rei e seu caráter futuro, sem sugerir necessariamente amizade íntima.
theological_decisions:
- issue: Sentido de εὐσεβείας no contexto cívico-religioso
  choice: devoção da cidade
  alternative: piedade da cidade; práticas religiosas da cidade
  rationale: A formulação conserva a dimensão religiosa e moral do termo, sem transformá-lo apenas em religião institucional nem lhe impor um sentido doutrinário posterior.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A estrutura mantém o contraste inicial, o aspecto contínuo de ἐδίδοσαν e a expectativa irônica expressa por ὡς com o particípio futuro.
