  text: So he said these things[a]; but they, having been released in a moment, blessed their holy Savior God[b], having just escaped death.
translation:
  language: pt
  text: Ele, pois, tomou essa decisão. Eles, porém, libertados num instante[a], bendiziam seu santo Deus Salvador[b], pois acabavam de escapar da morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem demora” ou “em pouquíssimo tempo”. A expressão grega indica um intervalo muito breve.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu Deus santo e Salvador”. A expressão grega reúne de forma compacta esses títulos ou descrições de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλεξεν
  choice: disse
  rationale: Neste contexto narrativo, o verbo indica que ele enunciou as palavras anteriores; “disse” é natural e fiel, sem acrescentar solenidade indevida.
- source_word: ἐν ἀμερεῖ χρόνῳ
  choice: num instante
  rationale: A expressão idiomática indica um intervalo extremamente breve. “Num instante” comunica a rapidez da libertação em português corrente.
- source_word: λυθέντες
  choice: libertados
  rationale: O particípio passivo descreve pessoas soltas de sua restrição e perigo; “libertados” preserva tanto a passividade quanto o sentido de livramento.
- source_word: τὸν ἅγιον σωτῆρα θεὸν αὐτῶν
  choice: seu santo Deus Salvador
  rationale: A formulação mantém juntos os termos gregos como uma descrição compacta de Deus, sem decidir silenciosamente que “Deus” e “Salvador” são dois títulos coordenados.
- source_word: ηὐλόγουν
  choice: bendiziam
  rationale: “Bendiziam” conserva o sentido religioso usual do verbo e seu aspecto durativo no imperfeito, evitando reduzi-lo apenas a “louvar”.
- source_word: ἄρτι
  choice: acabavam de
  rationale: 'A locução portuguesa expressa com naturalidade a imediatidade indicada pelo advérbio: o escape havia ocorrido naquele exato período.'
- source_word: τὸν θάνατον ἐκπεφυγότες
  choice: escapar da morte
  rationale: A expressão comunica o escape já consumado e sua consequência presente; combinada com “acabavam de”, preserva a proximidade temporal.
theological_decisions:
- issue: Tradução de σωτῆρα aplicado a Deus
  choice: Salvador
  alternative: Libertador
  rationale: “Salvador” preserva o peso teológico normal do substantivo e se ajusta ao livramento concreto narrado, sem excluir esse sentido histórico.
- issue: Relação sintática entre ἅγιον, σωτῆρα e θεὸν
  choice: seu santo Deus Salvador
  alternative: seu Deus santo e Salvador
  rationale: O grego permite entender a sequência como uma descrição compacta ou como títulos estreitamente coordenados. O texto principal conserva a compactação, e a nota registra a alternativa sem resolver além da evidência.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Bendiziam” mantém o registro bíblico sem arcaísmo excessivo; a divisão em duas frases evita um período artificialmente pesado.
