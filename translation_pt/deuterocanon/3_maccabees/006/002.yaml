  text: O King[a], mighty in power, Most High, almighty God, governing all creation with mercies[b],
translation:
  language: pt
  text: Ó Rei de imenso poder, Altíssimo, Deus Todo-Poderoso, que governas toda a criação[a] com misericórdia abundante[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a ordem criada”.'
    reason: lexical_alternative
  - marker: b
    text: O grego traz o substantivo no plural, literalmente “com misericórdias” ou “em compaixões”, podendo destacar os atos de misericórdia de Deus ou a abundância de sua compaixão.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῦ
  choice: Ó Rei
  rationale: O vocativo abre uma oração dirigida diretamente a Deus; “Ó Rei” preserva tanto a invocação quanto o tom elevado.
- source_word: μεγαλοκράτωρ
  choice: de imenso poder
  rationale: O composto ressalta grandeza de poder e domínio. A expressão é clara e digna em português sem confundi-la com o título παντοκράτωρ que vem depois.
- source_word: ὕψιστε
  choice: Altíssimo
  rationale: É o equivalente bíblico consagrado do superlativo usado como título divino e mantém sua forma de tratamento direto.
- source_word: παντοκράτωρ
  choice: Todo-Poderoso
  rationale: Título divino tradicional e inteligível em português, capaz de expressar poder e soberania universais.
- source_word: δέε
  choice: Deus
  rationale: O substantivo está no vocativo. Depois de “Todo-Poderoso”, a forma “Deus Todo-Poderoso” constitui uma invocação natural em português.
- source_word: τὴν πᾶσαν ... κτίσιν
  choice: toda a criação
  rationale: κτίσις designa aqui o conjunto da ordem criada; “toda a criação” é fiel, corrente e abrangente.
- source_word: διακυβερνῶν
  choice: que governas
  rationale: O particípio evoca dirigir ou conduzir como quem pilota. A oração relativa na segunda pessoa torna explícita em português sua relação com os vocativos sem perder a ideia de governo providencial.
- source_word: ἐν οἰκτιρμοῖς
  choice: com misericórdia abundante
  rationale: O plural grego οἰκτιρμοῖς pode salientar manifestações repetidas ou a abundância da compaixão divina. Esta formulação é natural em português e conserva essa força, enquanto a nota registra alternativas mais formais.
theological_decisions:
- issue: Acúmulo de títulos divinos na invocação
  choice: Preservar separadamente “Rei de imenso poder, Altíssimo, Deus Todo-Poderoso”
  alternative: Fundir ou reduzir os títulos a uma única descrição de soberania
  rationale: O grego acumula deliberadamente títulos honoríficos. Mantê-los conserva a retórica da oração e não apaga as nuances distintas de μεγαλοκράτωρ, ὕψιστος e παντοκράτωρ.
- issue: Sentido do título παντοκράτωρ
  choice: Todo-Poderoso
  alternative: Soberano de tudo
  rationale: Ambas as ideias pertencem ao campo semântico do título. “Todo-Poderoso” é bíblico, reconhecível e adequado ao contexto, sem exigir que a tradução escolha exclusivamente entre poder universal e domínio universal.
- issue: Plural de οἰκτιρμοί aplicado ao governo divino
  choice: misericórdia abundante
  alternative: misericórdias; atos de misericórdia; compaixão
  rationale: O plural pode indicar abundância ou múltiplas manifestações de compaixão. A tradução evita uma expressão pouco idiomática, e a nota conserva a forma e a amplitude do grego.
translation_notes:
  register: Português atual, solene e acessível, com legibilidade brasileira. A sequência de vocativos foi preservada; o particípio grego foi vertido como oração relativa na segunda pessoa, mais natural numa oração dirigida diretamente a Deus. A vírgula final indica que o versículo continua na unidade sintática seguinte.
