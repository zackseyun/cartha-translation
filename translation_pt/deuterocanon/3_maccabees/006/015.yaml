base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/015.yaml
  text: Let it be shown to all the nations that you are with us[a], Lord, and that you have not turned your face away from us; but just as you said, ‘Not even when they were in the land of their enemies did I disregard them,’ so accomplish it[b], Lord.
translation:
  language: pt
  text: 'Que seja mostrado a todas as nações que estás conosco, Senhor, e que não afastaste de nós o teu rosto; mas, assim como disseste: “Nem mesmo quando estavam na terra dos seus inimigos eu os ignorei”[a], assim leva isso a termo[b], Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A declaração citada retoma a linguagem da aliança sobre Deus não rejeitar seu povo nem mesmo na terra de seus inimigos. O verbo grego também pode ser traduzido como “desconsiderei” ou “negligenciei”.
    reason: cross_reference
  - marker: b
    text: 'Ou: “faz isso se cumprir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δειχθήτω
  choice: Que seja mostrado
  rationale: Preserva tanto a força de súplica do imperativo aoristo passivo quanto a forma passiva, em português natural.
- source_word: πᾶσιν ἔθνεσιν
  choice: a todas as nações
  rationale: Traduz diretamente a referência ampla aos povos que testemunhariam a ação de Deus, sem impor o contraste mais específico sugerido por “gentios”.
- source_word: μεθʼ ἡμῶν εἶ
  choice: estás conosco
  rationale: Expressa de modo idiomático a presença divina e conserva a ressonância de aliança.
- source_word: οὐκ ἀπέστρεψας τὸ πρόσωπόν σου ἀφʼ ἡμῶν
  choice: não afastaste de nós o teu rosto
  rationale: Mantém a menção explícita ao rosto e a metáfora bíblica de favor ou desfavor divino.
- source_word: ὑπεριδον
  choice: ignorei
  rationale: No dito divino citado, comunica que Deus não desconsiderou nem abandonou seu povo; evita a intensidade afetiva maior de “desprezei”.
- source_word: καθὼς εἶπας
  choice: assim como disseste
  rationale: Introduz naturalmente a fala divina direta e preserva a força comparativa de καθώς.
- source_word: οὕτως ἐπίτελεσον
  choice: assim leva isso a termo
  rationale: Expressa o pedido para que Deus concretize plenamente o que declarou, preservando οὕτως e o sentido de conclusão de ἐπιτελέω.
theological_decisions:
- issue: Tradução de κύριε
  choice: Senhor
  alternative: Soberano
  rationale: No contexto de oração, κύριε funciona como título divino; “Senhor” é a tradução direta, tradicional e não sectária.
- issue: Forma da citação sobre o exílio
  choice: Discurso direto entre aspas
  alternative: Discurso indireto parafrástico
  rationale: εἶπας introduz naturalmente uma declaração divina direta. As aspas preservam o apelo à palavra anterior de Deus sem resolver além do texto a relação exata entre promessa e cumprimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a imagem bíblica de Deus afastar o rosto, o tratamento singular dirigido a Deus e a estrutura de súplica da oração.
