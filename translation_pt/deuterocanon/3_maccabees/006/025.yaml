review_pass:
  verdict: revise
  source_fidelity: 'A redação proposta altera de modo indevido a relação sintática dos termos difíceis: faz de “os que, dentre nós” os ocupantes das fortalezas e introduz “dentre nós”, que não é uma tradução segura de ἡμῶν neste encadeamento. Também apresenta “do lar” como complemento não assinalado de afastar, embora a construção grega permaneça altamente incerta. Uma tradução deve conservar essa dificuldade sem afirmar essa interpretação particular como a leitura principal.'
  naturalness: A frase atual é compreensível, mas “os que, dentre nós, mantinham ... as fortalezas” e “afastou do lar” produzem uma cena diferente e sintaticamente mais determinada que o grego. A revisão é fluente em português moderno e mantém o caráter retórico.
  terminology: “Fortalezas” traduz adequadamente ὀχυρώματα; “terra” e “casa” preservam χώρα e οἰκία sem expandi-las para uma interpretação social específica. Para ἐν πίστει, “na fé” conserva a correspondência lexical adotada no audit trail e a nota registra alternativas não doutrinárias.
  issues:
  - severity: high
    issue: Reanálise não sinalizada de τοὺς κρατήσαντας ἡμῶν e de ἀποστήσας
    rationale: “os que, dentre nós, mantinham” toma ἡμῶν como partitivo e transforma os indivíduos reunidos em guardiões das fortalezas. Essa resolução não é exigida pelo texto e se afasta da ambiguidade reconhecida pela tradição de auditoria.
  - severity: medium
    issue: “do lar” resolve τῆς οἰκίας como complemento de separação sem preservar a ambiguidade
    rationale: A posição e a dependência de τῆς οἰκίας são problemáticas no grego. A tradução principal deve evitar apresentar essa ligação como certa; a nota deve explicitar a dificuldade.
  - severity: medium
    issue: Nota a oferece “na fé”, mas o texto principal escolhe “com fidelidade”
    rationale: A escolha principal é possível em contexto, mas o audit trail preserva deliberadamente πίστις como “faith”. “Na fé”, com alternativas em nota, reproduz essa cautela lexical.
  revised_text: Quem afastou cada pessoa das fortalezas de nossa terra e de nossa casa, onde nos mantinham na fé[a], e a reuniu aqui sem motivo?[b]
  revised_footnotes:
  - marker: a
    text: Ou “com fidelidade”, “em confiança” ou, possivelmente, “em segurança”. A expressão grega ἐν πίστει é incomum neste contexto.
    reason: lexical_alternative
  - marker: b
    text: A sintaxe grega deste trecho é difícil. A construção pode também ser entendida como dizendo que as pessoas foram afastadas dos lugares seguros de sua terra e de suas casas e reunidas aqui sem motivo.
    reason: textual_difficulty
  revision_rationale: 'A revisão segue a leitura conservadora registrada no audit trail: as pessoas são afastadas de fortalezas ligadas à terra e à casa, depois reunidas. Não tenta resolver definitivamente quem são os que “nos mantinham” nem a função precisa de todos os genitivos. “Cada pessoa ... a reuniu” reproduz de modo natural a força distributiva de ἕκαστον sem alternar de modo confuso entre singular e plural.'
