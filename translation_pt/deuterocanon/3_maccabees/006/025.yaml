review_pass:
  verdict: revise
  source_fidelity: 'A redação proposta altera indevidamente as relações sintáticas: faz de «os que ... mantinham» o objeto de «afastou do lar», mas o particípio κρατήσαντας, com ἡμῶν, designa mais naturalmente os que nos tinham sob seu domínio/cuidado. Além disso, «as fortalezas da terra» não deve ser apresentada como o objeto que essas pessoas mantinham. A construção grega permanece difícil, e a tradução deve sinalizar essa dificuldade sem adotar essa reordenação pouco sustentável.'
  naturalness: A frase atual é legível, mas «afastou do lar os que ... mantinham ... as fortalezas» cria uma imagem pouco coerente e obscurece a pergunta retórica. A revisão oferece português moderno e conserva a construção cautelosa.
  terminology: «Fortalezas» é adequado para ὀχυρώματα; «terra» é adequado para χώρα. Para ἐν πίστει, «com fidelidade» é uma possibilidade contextual, mas não deve eliminar «na fé» do corpo principal quando a ambiguidade é relevante. «Casa» traduz τῆς οἰκίας sem a expansão interpretativa de «lar».
  issues:
  - severity: high
    issue: Reanálise sintática de τοὺς κρατήσαντας ἡμῶν
    rationale: A tradução faz «os que ... mantinham» referir-se a membros do grupo que guardavam fortalezas. No texto, o particípio com o genitivo ἡμῶν é mais naturalmente entendido como «os que nos tinham sob seu poder/cuidado», ainda que a construção seja difícil.
  - severity: high
    issue: Vínculo indevido entre κρατήσαντας e τὰ ... ὀχυρώματα
    rationale: O rascunho torna «as fortalezas da terra» o complemento de «mantinham». Essa relação não é exigida pelo grego e produz uma leitura mais específica que o testemunho difícil permite.
  - severity: medium
    issue: Tratamento de ἐν πίστει
    rationale: «Com fidelidade» é possível, mas a escolha exclusiva resolve uma expressão reconhecidamente ambígua. «Na fé» preserva a forma e a ambiguidade; alternativas contextuais devem constar em nota.
  - severity: medium
    issue: Posição de τῆς οἰκίας e ἕκαστον
    rationale: A redação atual toma «do lar» como complemento simples de «afastou», mas não explicita que a ligação de «casa» e «cada um» é disputada. A nota deve descrever a dificuldade sem afirmar uma reconstrução como certa.
  revised_text: Quem, depois de afastar cada um de sua casa, reuniu aqui sem motivo os que nos mantinham na fé, nas fortalezas de nossa terra?[a]
  revised_footnotes:
  - marker: a
    text: A sintaxe grega é difícil, especialmente na relação entre “os que nos mantinham”, “na fé”, “as fortalezas de nossa terra” e “casa”. “Na fé” também pode significar “com fidelidade”, “em confiança” ou, possivelmente, “em segurança”. Outra compreensão entende que as pessoas foram afastadas dos lugares seguros de sua terra e de suas casas e reunidas aqui sem causa.
    reason: textual_difficulty
  revision_rationale: A revisão não transforma os atingidos em guardas das fortalezas e mantém o particípio relativo a «nós». Como a ordem e as relações dos complementos no grego de Swete são difíceis, a tradução adota uma leitura gramaticalmente possível e conservadora, preservando em nota as alternativas relevantes, inclusive a compreensão refletida no audit trail inglês.
