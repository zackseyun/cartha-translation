base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/025.yaml
  text: Who was it that removed each one from the secure strongholds of our homeland and household[a], where they had held us in faith[b], and gathered them here without reason?
translation:
  language: pt
  text: Quem afastou do lar os que, dentre nós, mantinham com fidelidade[a] as fortalezas da terra e, sem motivo, reuniu cada um aqui?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na fé”, “em confiança” ou, possivelmente, “em segurança”. A expressão grega ἐν πίστει é incomum neste contexto.
    reason: lexical_alternative
  - marker: b
    text: A sintaxe grega deste trecho é difícil. Outra possível organização da frase entende que as pessoas foram afastadas dos lugares seguros de sua terra e de seus lares e reunidas aqui sem motivo.
    reason: textual_difficulty
lexical_decisions:
- source_word: τίς
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; a forma direta é natural em português.
- source_word: τοὺς κρατήσαντας ἡμῶν
  choice: os que, dentre nós, mantinham
  rationale: Entende ἡμῶν como genitivo partitivo, “dentre nós”, e κρατήσαντας como referência aos que mantinham ou controlavam as fortificações. Essa leitura segue de perto a estrutura grega, embora a construção seja difícil.
- source_word: ἐν πίστει
  choice: com fidelidade
  rationale: Neste contexto administrativo e militar, a expressão descreve provavelmente a maneira confiável ou fiel de manter as fortificações. “Com fidelidade” conserva a ligação lexical com πίστις sem transformar a frase em afirmação doutrinária; outras possibilidades são registradas em nota.
- source_word: τὰ τῆς χώρας ὀχυρώματα
  choice: as fortalezas da terra
  rationale: ὀχυρώματα designa lugares fortificados ou defensivos, e χώρα, a terra ou região. “Fortalezas da terra” preserva a imagem concreta e o tom elevado.
- source_word: τῆς οἰκίας ἀποστήσας
  choice: afastou do lar
  rationale: 'Toma τῆς οἰκίας como complemento de separação de ἀποστήσας: alguém os fez sair de casa ou do lar. A colocação dos termos permite essa leitura, que produz uma frase coerente sem emendar o texto.'
- source_word: ἕκαστον
  choice: cada um
  rationale: Mantém a força distributiva do singular grego, individualizando as pessoas reunidas.
- source_word: ἀλόγως
  choice: sem motivo
  rationale: Exprime falta de razão, justificativa ou causa; “sem motivo” é corrente e preserva o protesto moral da pergunta.
- source_word: ἤθροισεν ἐνθάδε
  choice: reuniu ... aqui
  rationale: 'ἀθροίζω significa reunir ou ajuntar, e ἐνθάδε aponta para o lugar presente: “aqui”.'
theological_decisions:
- issue: Sentido de πίστις em contexto não doutrinário
  choice: com fidelidade
  alternative: na fé; em confiança; em segurança
  rationale: A ligação com o ato de manter fortalezas favorece valor adverbial de lealdade ou confiabilidade. A tradução evita impor um sentido religioso específico, mas a nota conserva a ambiguidade lexical.
- issue: Construção sintática difícil de τοὺς κρατήσαντας ἡμῶν ... τῆς οἰκίας ἀποστήσας
  choice: “os que, dentre nós, mantinham ...”; “afastou do lar”
  alternative: “afastou cada um das fortalezas seguras de nossa terra e de nossos lares, onde nos mantinham...”
  rationale: A redação adotada lê ἡμῶν como partitivo e τῆς οἰκίας com o verbo de separação. É gramaticalmente plausível e próxima da ordem grega, mas a nota reconhece que o testemunho de Swete admite outra organização sintática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Lar”, “fortalezas” e a pergunta retórica preservam o tom solene; as notas mantêm visíveis as ambiguidades lexical e sintática do grego.
