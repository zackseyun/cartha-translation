base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/039.yaml
  text: In these things also[a], after gloriously revealing his mercy[c][b], the Sovereign of all rescued them all together without stumbling.
translation:
  language: pt
  text: Nessas circunstâncias também, manifestando gloriosamente[a] a sua misericórdia, o Soberano de todos os resgatou, todos juntos[b], sem que tropeçassem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo manifestado gloriosamente”. O particípio grego enfatiza que Deus tornou visível a sua misericórdia; não exige necessariamente uma sequência temporal rígida.
    reason: lexical_alternative
  - marker: b
    text: Ou “em plena união” ou “de comum acordo”. O termo grego pode indicar tanto ação coletiva quanto unidade de ânimo.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sem tropeçar”. No contexto, a expressão provavelmente indica que foram libertos ilesos, sem sofrer dano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: Nessas circunstâncias
  rationale: A expressão relativa retoma acontecimentos ou circunstâncias anteriores. Esta formulação mantém a ligação com o contexto sem especificar além do que o grego permite.
- source_word: καὶ
  choice: também
  rationale: Aqui καὶ marca continuidade ou acréscimo em relação ao que precede; “também” expressa isso naturalmente.
- source_word: μεγαλοδόξως
  choice: gloriosamente
  rationale: O advérbio comunica uma manifestação magnífica e revestida de glória, preservando o tom elevado do texto.
- source_word: ἐπιφάνας
  choice: manifestando
  rationale: Com “a sua misericórdia” como objeto, o particípio de ἐπιφαίνω indica tornar manifesta ou visível. O gerúndio preserva a relação participial sem impor uma sequência temporal rígida.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: a sua misericórdia
  rationale: “Misericórdia” é uma tradução bíblica clara e corrente de ἔλεος e se ajusta ao contexto de livramento.
- source_word: ὁ τῶν πάντων δυνάστης
  choice: o Soberano de todos
  rationale: δυνάστης designa alguém investido de poder e autoridade. “Soberano de todos” preserva o título de governo sem substituí-lo pelo título distinto “Todo-Poderoso”.
- source_word: ἐρρύσατο
  choice: resgatou
  rationale: O verbo descreve livrar alguém de perigo. “Resgatou” é vívido, natural e adequado à cena.
- source_word: ὁμοθυμαδόν
  choice: todos juntos
  rationale: O advérbio pode indicar ação coletiva ou unidade de ânimo. “Todos juntos” se encaixa naturalmente com o resgate coletivo, enquanto a nota preserva a outra nuance possível.
- source_word: ἀπταίστους
  choice: sem que tropeçassem
  rationale: A expressão conserva a imagem literal de não tropeçar ou cair. Uma nota informa o provável sentido contextual de serem libertos sem dano.
theological_decisions:
- issue: Tradução do título divino ὁ τῶν πάντων δυνάστης
  choice: o Soberano de todos
  alternative: o governante de todas as coisas; o poderoso governante de todos
  rationale: O grego emprega δυνάστης, título ligado a poder e governo, e não παντοκράτωρ. A tradução evita importar o título teologicamente mais específico “Todo-Poderoso”.
- issue: Sentido de ἀπταίστους no livramento
  choice: sem que tropeçassem
  alternative: ilesos; sem sofrer dano
  rationale: A tradução principal preserva a metáfora grega, enquanto a nota reconhece que, no contexto, ela provavelmente descreve um livramento completo e sem dano.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo o particípio, o título divino e as imagens do grego. As notas preservam as ambiguidades de ὁμοθυμαδόν e ἀπταίστους.
