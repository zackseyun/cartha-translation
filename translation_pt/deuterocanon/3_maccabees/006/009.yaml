base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/009.yaml
  text: And now[a], hater of insolence, abundant in mercy, judge of all, quickly appear to the holy ones of Israel’s race, who are being mistreated by the abominable[c][b], lawless nations.
translation:
  language: pt
  text: E agora, tu que odeias a insolência, rico em misericórdia, juiz de todos, manifesta-te sem demora aos santos da linhagem de Israel, que estão sendo ultrajados pelos povos abomináveis e sem lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que estão sendo tratados com insolência pelos gentios abomináveis e sem lei”. O verbo grego indica abuso ultrajante ou humilhante, e “povos” se refere aqui a povos não israelitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισόβρι
  choice: tu que odeias a insolência
  rationale: Expressa o raro vocativo composto de modo natural em português, preservando a ideia de que Deus odeia a arrogância abusiva.
- source_word: πολυέλεε
  choice: rico em misericórdia
  rationale: Conserva a noção de misericórdia abundante numa formulação corrente, digna e compacta.
- source_word: τῶν ὅλων δίκαστα
  choice: juiz de todos
  rationale: Mantém de modo conciso o alcance universal da expressão grega.
- source_word: τάχος
  choice: sem demora
  rationale: Empregado adverbialmente, comunica a urgência do pedido em português natural.
- source_word: ἐπιφάνηθι
  choice: manifesta-te
  rationale: No contexto de oração, pede que Deus se torne visivelmente presente em ação; a escolha preserva essa nuance melhor do que o simples 'aparece'.
- source_word: τοῖς ἁγίοις
  choice: aos santos
  rationale: O adjetivo substantivado designa os integrantes consagrados do povo de Deus; no contexto, eles são identificados como pertencentes à linhagem de Israel.
- source_word: Ἰσραὴλ γένους
  choice: da linhagem de Israel
  rationale: Preserva a dimensão de descendência e pertencimento étnico-genealógico de γένος, evitando a possível conotação racial moderna de 'raça'.
- source_word: ὑπὸ ἐβδελυγμένων ἀνόμων ἐθνῶν
  choice: pelos povos detestáveis e sem lei
  rationale: Retém a forte censura dos dois qualificativos e traduz ἔθνη como povos não israelitas, opção mais natural aqui do que 'nações'.
- source_word: ὑβριζομένοις
  choice: que estão sendo ultrajados
  rationale: Transmite o abuso insolente e humilhante implicado pelo verbo, com mais força e precisão do que o genérico 'maltratados'.
theological_decisions:
- issue: Designação pactual τοῖς ἁγίοις aplicada a Israel
  choice: aos santos
  alternative: ao teu povo santo
  rationale: A tradução mantém o substantivo implícito no adjetivo grego sem acrescentar o possessivo 'teu'; o contexto imediato identifica esses santos com a linhagem de Israel.
- issue: Força étnico-genealógica de γένος
  choice: da linhagem de Israel
  alternative: do povo de Israel
  rationale: '''Linhagem'' conserva explicitamente a noção de descendência, sem reduzir a expressão a uma categoria apenas religiosa nem introduzir as conotações modernas de ''raça''.'
- issue: Referência de ἔθνη
  choice: povos
  alternative: gentios
  rationale: No contexto, são povos não israelitas, mas 'povos' preserva a expressão lexical sem transformar a distinção contextual em um termo técnico religioso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A invocação conserva a sequência solene dos vocativos gregos; 'manifesta-te sem demora' comunica tanto a intervenção visível quanto a urgência da súplica.
