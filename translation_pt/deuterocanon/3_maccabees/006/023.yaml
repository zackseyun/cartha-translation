  text: For when he heard the outcry[a], and saw all of them prostrate for destruction, he wept in anger and threatened his friends, saying,
translation:
  language: pt
  text: 'Pois, ao ouvir o clamor e ver todos prostrados para serem destruídos, ele derramou lágrimas de ira e ameaçou seus amigos[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em um contexto de corte, o grego φίλοι pode designar não apenas amigos pessoais, mas também associados do rei ou cortesãos.
    reason: cultural_note
lexical_decisions:
- source_word: ἀκούσας
  choice: ao ouvir
  rationale: O particípio aoristo introduz a circunstância temporal da ação principal; «ao ouvir» é natural e conciso em português.
- source_word: κραυγῆς
  choice: o clamor
  rationale: κραυγή designa um grito forte ou clamor coletivo; «clamor» preserva o tom público e desesperado do contexto.
- source_word: συνιδὼν
  choice: ver
  rationale: O verbo composto pode incluir a ideia de perceber ao observar; neste contexto, «ver» comunica adequadamente o sentido, complementado pelo que foi visto.
- source_word: πρηνεῖς
  choice: prostrados
  rationale: πρηνής descreve pessoas deitadas com o rosto voltado para o chão; «prostrados» é claro, digno e adequado ao registro narrativo.
- source_word: ἅπαντας
  choice: todos
  rationale: O acusativo plural abrange a totalidade do grupo já mencionado no contexto.
- source_word: εἰς τὴν ἀπώλειαν
  choice: para serem destruídos
  rationale: A expressão indica a finalidade ou o destino iminente dos que estavam prostrados. Esta formulação conserva o sentido grave de ἀπώλεια e evita a construção pouco natural «para a destruição».
- source_word: δακρύσας
  choice: derramou lágrimas
  rationale: O particípio indica o ato de verter lágrimas; a expressão é direta e mantém um tom narrativo digno.
- source_word: μετʼ ὀργῆς
  choice: de ira
  rationale: A formulação liga a ira às lágrimas conforme a sequência imediata do grego, sem eliminar a possível relação dessa emoção com a ameaça que se segue.
- source_word: τοῖς φίλοις
  choice: seus amigos
  rationale: Mantém o sentido básico de φίλοι e deixa para a nota a possível acepção técnica de associados ou cortesãos do rei.
- source_word: διηπείλει
  choice: ameaçou
  rationale: O imperfeito pode sugerir ação continuada ou reiterada, mas o pretérito perfeito oferece uma narrativa natural em português sem excluir que a ameaça tenha se prolongado.
- source_word: λέγων
  choice: dizendo
  rationale: Reproduz naturalmente o particípio que introduz o discurso direto do versículo seguinte.
