base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/012.yaml
  text: But you[a], who possess all might and dominion, unceasing One, eternal One, look now; have mercy on us[c][b], who through the insolent violence of lawless men are being irrationally removed from life in the manner of plotters.
translation:
  language: pt
  text: Mas tu, que possuis toda força e domínio, ó Incansável[a], ó Eterno, olha agora; tem misericórdia de nós, que, pela violência insolente dos que não têm lei, estamos sendo, sem razão, arrancados da vida[b], à maneira de conspiradores[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ó Incessante”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “removidos do viver”; no contexto, trata-se de serem mortos.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “como conspiradores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλκήν
  choice: força
  rationale: Expressa vigor ou poder efetivo e forma, com “domínio”, um par distinto e natural em português.
- source_word: δυναστείαν
  choice: domínio
  rationale: Indica poder soberano ou autoridade para governar, sem se confundir com a força expressa por ἀλκήν.
- source_word: ἀπάναυε
  choice: ó Incansável
  rationale: Mantém o vocativo como título divino e comunica a ideia daquele que não cessa nem se fatiga; a alternativa lexical é registrada em nota.
- source_word: αἰώνιε
  choice: ó Eterno
  rationale: Preserva o segundo vocativo paralelo, em linguagem solene e corrente.
- source_word: ἐπίδε
  choice: olha agora
  rationale: Conserva a urgência do imperativo sem acrescentar um objeto que o grego deixa implícito.
- source_word: καθʼ ὕβριν
  choice: pela violência insolente
  rationale: Reúne os sentidos de abuso arrogante e violência contidos em ὕβρις.
- source_word: ἀνόμων
  choice: dos que não têm lei
  rationale: Traduz substantivamente “os sem lei”, sem reduzir o termo ao sentido genérico de “maus”.
- source_word: ἀλόγιστον
  choice: sem razão
  rationale: Como expressão adverbial, transmite o caráter irracional, insensato ou injustificável da ação em português natural.
- source_word: ἐκ τοῦ ζῆν μεθισταμένους
  choice: estamos sendo arrancados da vida
  rationale: Preserva a imagem de remoção para fora da vida e, no contexto de execução iminente, comunica claramente a morte violenta.
- source_word: ἐν ἐπιβούλων τρόπῳ
  choice: à maneira de conspiradores
  rationale: Mantém a formulação modal do grego e sua possível ambiguidade entre o modo de tratamento e a caracterização imposta às vítimas.
theological_decisions:
- issue: Forma dos vocativos divinos ἀπάναυε e αἰώνιε
  choice: 'Dois títulos em invocação direta: “ó Incansável, ó Eterno”.'
  alternative: “ó Deus incansável e eterno” ou tomar ἀπάναυε adverbialmente.
  rationale: As duas formas gregas são vocativas e paralelas. Mantê-las separadas preserva a estrutura solene da oração e evita inserir “Deus”, palavra não repetida neste trecho.
- issue: Sentido de ἐκ τοῦ ζῆν μεθισταμένους
  choice: 'Remoção da vida, isto é, morte: “arrancados da vida”.'
  alternative: “afastados de nosso modo de vida” ou simplesmente “mortos”.
  rationale: O contexto aponta para execução, mas a tradução conserva a imagem expressiva do original em vez de substituí-la por uma explicação.
- issue: Relação expressa por ἐν ἐπιβούλων τρόπῳ
  choice: “à maneira de conspiradores”.
  alternative: “como se fôssemos conspiradores” ou “de modo traiçoeiro”.
  rationale: A formulação escolhida não decide se o texto descreve o modo da ação dos perseguidores ou o tratamento das vítimas sob a acusação de conspiração.
translation_notes:
  register: Português moderno, solene e acessível, com imperativos diretos próprios de uma oração. Os vocativos são preservados sem acrescentar um nome divino ausente do grego, e a linguagem mantém as imagens e ambiguidades relevantes do texto-fonte.
