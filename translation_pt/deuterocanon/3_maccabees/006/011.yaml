  yaml_path: translation/deuterocanon/3_maccabees/006/011.yaml
  text: Let not the empty-headed bless the empty things over the destruction of those beloved by you[a], saying[c][b], “Not even their God rescued them.”
translation:
  language: pt
  text: 'Que os de mente vã[b] não bendigam as coisas vãs[a] por ocasião da destruição dos teus amados, dizendo: “Nem mesmo o Deus deles os livrou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas vazias”, “coisas inúteis” ou “ídolos”. O grego diz literalmente “as coisas vãs”, provavelmente com força polêmica.
    reason: lexical_alternative
  - marker: b
    text: Ou “os de pensamento vazio”. No grego, esta expressão forma um jogo de palavras com “coisas vãs”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... εὐλογησάτωσαν
  choice: Que ... não bendigam
  rationale: O imperativo de terceira pessoa com μή expressa uma proibição em forma de apelo. A construção portuguesa preserva o tom de oração sem transformá-lo numa ordem direta aos adversários.
- source_word: τοῖς ματαίοις
  choice: as coisas vãs
  rationale: O adjetivo substantivado pode designar coisas vazias, inúteis ou, em contexto polêmico, ídolos. “Coisas vãs” mantém a generalidade do grego e permite conservar a relação verbal com ματαιόφρονες.
- source_word: οἱ ματαιόφρονες
  choice: os de mente vã
  rationale: O composto descreve pessoas de pensamento vão ou vazio. A formulação é compreensível, digna e reproduz o jogo de palavras com “coisas vãs” sem recorrer ao coloquial “cabeças vazias”.
- source_word: ἐπὶ τῇ ... ἀπωλείᾳ
  choice: por causa da destruição
  rationale: ἐπί com dativo indica aqui a ocasião ou o fundamento do ato de bendizer. A tradução explicita essa relação sem acrescentar a ideia mais específica de triunfo.
- source_word: τῶν ἠγαπημένων σου
  choice: dos teus amados
  rationale: O particípio perfeito passivo apresenta esse povo como amado por Deus. “Teus amados” conserva de modo conciso tanto a relação pessoal quanto a perspectiva passiva.
- source_word: Οὐδὲ ὁ θεὸς αὐτῶν ἐρύσατο αὐτούς
  choice: Nem mesmo o Deus deles os livrou
  rationale: ἐρύσατο significa resgatar ou livrar de um perigo. “Livrou” é natural no registro bíblico moderno e mantém a referência concreta ao salvamento ameaçado.
theological_decisions:
- issue: Se τοῖς ματαίοις deve ser entendido especificamente como ídolos ou, de modo mais geral, como coisas vãs
  choice: coisas vãs
  alternative: ídolos
  rationale: Embora μάταια possa designar ídolos em polêmica judaica, o versículo não os nomeia explicitamente. A tradução mais geral conserva a ambiguidade lexical e evita restringir o sentido além da evidência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “mente vã/coisas vãs” preserva o recurso retórico do grego; “bendigam” mantém o valor de εὐλογέω, enquanto a nota registra sem impor a possível referência a ídolos.
