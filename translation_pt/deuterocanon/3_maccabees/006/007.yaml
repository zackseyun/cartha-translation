base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/007.yaml
  text: You brought Daniel up into the light unharmed[b][a], when he had been thrown to the lions on the ground as food for the beasts through the slanders of envy.
translation:
  language: pt
  text: Tu trouxeste Daniel à luz, ileso, depois de ele ter sido lançado aos leões, no chão,[a] como alimento para as feras, por causa de calúnias motivadas pela inveja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “no chão” é difícil. Ela foi mantida sem ser harmonizada com o relato de Daniel.
    reason: textual_variant
  - marker: b
    text: 'Ou: “por causa de acusações motivadas pela inveja”. A expressão grega combina a ideia de calúnias ou acusações hostis com a de inveja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβολαῖς φθόνου
  choice: por causa de acusações nascidas da inveja
  rationale: A expressão reúne acusações hostis e sua fonte ou caráter invejoso. Esta formulação preserva ambos os elementos e o valor causal/instrumental do dativo, sem pressupor no texto principal que toda acusação fosse necessariamente falsa.
- source_word: λέουσι
  choice: aos leões
  rationale: O dativo indica os animais aos quais Daniel foi entregue; 'aos leões' é direto e natural em português.
- source_word: κατὰ γῆς
  choice: no chão
  rationale: A tradução conserva a indicação espacial difícil do texto transmitido, sem harmonizá-la com o relato conhecido de Daniel.
- source_word: ῥιφέντα
  choice: depois que ele foi lançado
  rationale: O particípio aoristo passivo exprime uma ação sofrida por Daniel anterior ao resgate; a oração temporal é natural em português e mantém a força de 'lançar'.
- source_word: θηρσὶ βορὰν
  choice: como alimento para as feras
  rationale: βορά designa alimento ou presa, e θηρσί, feras ou animais selvagens. A expressão comunica claramente o fim mortal pretendido.
- source_word: εἰς φῶς
  choice: à luz
  rationale: Preserva a imagem de ser trazido da escuridão ou da morte para a luz, em formulação idiomática portuguesa.
- source_word: ἀνήγαγες
  choice: trouxeste
  rationale: No contexto de εἰς φῶς, o verbo descreve Deus trazendo Daniel para fora e para a luz. 'Trouxeste' é natural; a direção ascendente fica implícita no resgate, sem uma construção artificial.
- source_word: ἀσινῆ
  choice: sem nenhum ferimento
  rationale: Expressa de maneira clara e corrente o sentido de 'ileso, sem dano', dando ênfase ao resgate completo.
theological_decisions:
- issue: Alusão ao livramento de Daniel dos leões
  choice: Manter a referência direta a Daniel, aos leões e ao ato divino de trazê-lo à luz sem ferimento.
  alternative: Acrescentar 'cova dos leões' com base no relato de Daniel.
  rationale: O grego não menciona explicitamente uma cova. A tradução preserva a alusão sem importar detalhes narrativos ausentes deste versículo.
- issue: Tratamento da expressão difícil κατὰ γῆς
  choice: Traduzir conservadoramente como 'no chão' e assinalar a dificuldade em nota.
  alternative: Omitir a expressão ou substituí-la por 'na cova'.
  rationale: A expressão faz parte do texto grego fornecido. Mantê-la respeita a evidência textual e evita harmonização silenciosa.
- issue: Relação entre διαβολαῖς e φθόνου
  choice: Traduzir como 'acusações nascidas da inveja'.
  alternative: Traduzir como 'calúnias da inveja'.
  rationale: A opção escolhida mantém a ideia de acusações maliciosas e explicita com naturalidade sua origem invejosa, preservando a tensão lexical sem impor além do necessário a qualificação de falsidade.
translation_notes:
  register: 'Português moderno, claro e digno, com forma de tratamento singular ''Tu'' adequada à oração dirigida a Deus. A sintaxe foi levemente reorganizada para fluência, preservando a ordem lógica: perigo, intenção mortal, causa e livramento. Todos os elementos difíceis do grego foram mantidos ou documentados.'
