revisions:
- from: Quando puseram fim à melodia profundamente dolorosa de suas lamentações, entoaram um cântico ancestral[a], louvando a Deus, o salvador de Israel e realizador de maravilhas. Depois de afastarem todo gemido e todo pranto, formaram grupos de dança[b], como sinal de uma alegria vivida em paz.
  to: Quando terminaram sua canção de lamento extremo, entoaram um cântico ancestral[a], louvando a Deus, o salvador de Israel e realizador de maravilhas; e, depois de afastarem todo gemido e pranto, formaram grupos de dança[b], como sinal de alegria pacífica.
  rationale: A revisão torna mais explícita a intensidade lamentosa de πανόδυρτον, sem perder a ideia de canto expressa por μέλος, e traduz εὐφροσύνης εἰρηνικῆς de modo mais direto. Conserva-se a escolha lexical defensável para o cântico ancestral e para os grupos de dança, bem como as respectivas notas de alternativa.
