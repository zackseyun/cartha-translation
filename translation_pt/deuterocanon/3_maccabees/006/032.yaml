base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/032.yaml
  text: And when they had ended their utterly mournful song of lamentation[a], they took up the song of their fathers, praising God, the savior of Israel and worker of wonders; and having cast off every cry of grief and wailing[b], they formed dances as a sign of peaceful rejoicing.
translation:
  language: pt
  text: Quando terminaram sua canção de lamento extremo, entoaram um cântico ancestral[a], louvando a Deus, o salvador de Israel e realizador de maravilhas; e, depois de afastarem todo gemido e pranto, formaram grupos de dança[b], como sinal de alegria pacífica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um cântico de seus antepassados”. O adjetivo grego pode indicar aquilo que pertence aos pais, aos antepassados ou à tradição herdada.
    reason: lexical_alternative
  - marker: b
    text: Ou “formaram coros”. A palavra grega pode designar coros ou grupos de dança; o contexto de celebração favorece aqui a referência à dança.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλήξαντες
  choice: Quando puseram fim
  rationale: O particípio aoristo indica uma ação anterior a ἀνέλαβον; a formulação conserva a sequência temporal com naturalidade em português.
- source_word: θρήνων πανόδυρτον μέλος
  choice: à melodia profundamente dolorosa de suas lamentações
  rationale: μέλος mantém a imagem musical; θρήνων explicita o caráter de lamentação, e πανόδυρτον intensifica a dor sem exigir uma reprodução morfologicamente rígida do composto grego.
- source_word: ἀνέλαβον
  choice: entoaram
  rationale: No contexto de um cântico, o verbo comunica de modo natural que começaram ou levantaram o canto.
- source_word: ᾠδὴν πάτριον
  choice: um cântico ancestral
  rationale: πάτριος designa aquilo que pertence aos antepassados ou à tradição herdada. “Ancestral” é claro e evita a possível leitura estritamente masculina de “dos pais”.
- source_word: σωτῆρα
  choice: salvador
  rationale: Equivalente direto de σωτήρ, adequado ao tom de louvor e sem ampliação doutrinária.
- source_word: τερατοποιὸν
  choice: realizador de maravilhas
  rationale: O composto descreve aquele que produz feitos extraordinários ou portentos; a expressão é compreensível e digna em português atual.
- source_word: οἰμωγὴν ... καὶ κωκυτὸν
  choice: todo gemido e todo pranto
  rationale: Os dois substantivos descrevem manifestações audíveis de sofrimento. A repetição de “todo” comunica o alcance de πᾶσαν e dá equilíbrio à frase.
- source_word: ἀπωσάμενοι
  choice: Depois de afastarem
  rationale: Expressa a rejeição deliberada ou o abandono das manifestações de luto, preservando a anterioridade do particípio.
- source_word: χοροὺς συνίσταντο
  choice: formaram grupos de dança
  rationale: χορός pode designar tanto um coro quanto um grupo que dança; o contexto festivo favorece a dança, enquanto “grupos” preserva a ideia de organização contida em συνίσταντο.
- source_word: εὐφροσύνης εἰρηνικῆς σημεῖον
  choice: como sinal de uma alegria vivida em paz
  rationale: A formulação preserva σημεῖον, a alegria de εὐφροσύνη e a qualidade pacífica de εἰρηνικός, evitando que “alegria pacífica” soe apenas como contraste com violência.
theological_decisions:
- issue: Referência de “salvador de Israel e realizador de maravilhas”
  choice: Os dois títulos são aplicados diretamente a Deus.
  alternative: Tratar um ou ambos como referência a outro agente não expresso.
  rationale: A construção grega põe τὸν Ἰσραὴλ σωτῆρα καὶ τερατοποιὸν em relação direta com θεόν. A tradução mantém essa identificação sem acrescentar desenvolvimento cristológico ou denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a progressão do lamento para o cântico e a celebração, bem como a ambiguidade lexical de χορός por meio de nota. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
