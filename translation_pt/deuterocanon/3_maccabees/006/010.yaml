base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/010.yaml
  text: But if our way of life in the place of our exile has been caught up in ungodliness[a], then, after rescuing us from the hand of our enemies, destroy us by whatever death you choose[b], Master.
translation:
  language: pt
  text: Mas, se nosso modo de viver no lugar do nosso exílio[a] se envolveu em impiedade, então, depois de nos resgatares da mão dos inimigos, destrói-nos com a morte que escolheres, Soberano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em nossa colônia” ou “em nosso assentamento”; o termo grego pode designar uma colônia ou comunidade estabelecida fora da terra de origem, mas aqui provavelmente se refere à vida da comunidade no exílio.
    reason: lexical_alternative
  - marker: b
    text: Ou “Mestre” ou “Senhor”; o vocativo grego é δέσποτα, que ressalta autoridade soberana, e não κύριος.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβείας
  choice: impiedade
  rationale: Expressa de modo direto a irreverência e infidelidade para com Deus, preservando a força religiosa e moral do termo grego.
- source_word: κατὰ τὴν ἀποικίαν
  choice: no lugar do nosso exílio
  rationale: Embora ἀποικία possa designar colônia ou assentamento, o contexto é a vida da comunidade judaica fora de sua terra; a formulação explicita esse cenário sem sugerir colonização política moderna.
- source_word: ὁ βίος ἡμῶν
  choice: nosso modo de viver
  rationale: βίος pode indicar não apenas a vida em si, mas a maneira de conduzi-la; esta opção preserva a dimensão ética.
- source_word: ἐνέσχηκται
  choice: se envolveu
  rationale: O perfeito indica o estado resultante de ter entrado ou ficado implicado em algo; 'se envolveu' mantém essa ideia sem definir além do texto a natureza do envolvimento.
- source_word: ῥυσάμενος
  choice: depois de nos resgatares
  rationale: O particípio aoristo apresenta o resgate como anterior ao imperativo principal; a construção portuguesa torna clara essa sequência.
- source_word: ἀπὸ ἐχθρῶν χειρός
  choice: da mão dos inimigos
  rationale: Preserva o conhecido idioma bíblico de libertação do poder dos inimigos, sem acrescentar um possessivo ausente no grego.
- source_word: ᾧ προαιρῇ ... μόρῳ
  choice: com a morte que escolheres
  rationale: Reúne em português os elementos separados no grego e comunica que a modalidade da morte fica à escolha divina.
- source_word: δέσποτα
  choice: Soberano
  rationale: Distingue δέσποτα de κύριος e expressa autoridade absoluta em linguagem de oração mais natural e digna do que 'Dono'.
- source_word: ἀπόλεσον ἡμᾶς
  choice: destrói-nos
  rationale: Mantém a formulação forte do imperativo ἀπόλεσον e não suaviza o pedido para que Deus lhes ponha fim após livrá-los dos inimigos.
theological_decisions:
- issue: Sentido de ἀποικία na oração da comunidade judaica fora de sua terra
  choice: no lugar do nosso exílio
  alternative: em nossa colônia / em nosso assentamento
  rationale: O texto situa a conduta comunitária fora da pátria. A tradução escolhida comunica essa realidade diaspórica, enquanto a nota preserva o valor lexical mais formal.
- issue: Tratamento do vocativo δέσποτα
  choice: Soberano
  alternative: Mestre / Senhor
  rationale: O grego emprega δέσποτα, não κύριος. 'Soberano' preserva a ênfase na autoridade absoluta e evita apagar a distinção lexical; a nota registra alternativas legítimas.
- issue: Força do pedido ἀπόλεσον ἡμᾶς
  choice: destrói-nos
  alternative: faz-nos morrer / dá-nos a morte
  rationale: A opção mantém a severidade e a tensão teológica do pedido, sem convertê-lo em uma formulação mais branda.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o idioma bíblico 'da mão dos inimigos', a força de 'destrói-nos' e a sequência retórica da oração. A colocação pronominal em 'resgatares' e 'destrói-nos' sustenta um registro solene sem arcaísmo excessivo.
