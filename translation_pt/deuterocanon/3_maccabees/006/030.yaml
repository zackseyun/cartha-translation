base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/030.yaml
  text: Then the king[a], after summoning to the city the one in charge of the revenues, ordered that wine and the other provisions suitable for feasting be supplied to the Jews for seven days, deciding that in the very place where they had expected to meet destruction, in that place they should celebrate their deliverance with all rejoicing.
translation:
  language: pt
  text: Então o rei mandou chamar para a cidade o responsável pelas receitas e ordenou que se fornecessem aos judeus, durante sete dias, vinho e os demais mantimentos apropriados para um banquete. Ele decidiu que, justamente no lugar onde haviam esperado encontrar a destruição, ali mesmo celebrassem sua libertação[a] com toda a alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “salvação”. O termo grego pode indicar libertação ou salvação; aqui se refere à celebração por terem sido resgatados da destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐπὶ τῶν προσόδων
  choice: o encarregado das receitas
  rationale: Expressa com clareza a função administrativa ligada às receitas, sem impor um título técnico mais específico do que o grego.
- source_word: προσκαλεσάμενος
  choice: mandou chamar
  rationale: Comunica naturalmente a convocação anterior à ordem principal e se ajusta ao contexto de autoridade régia.
- source_word: οἴνους
  choice: vinho
  rationale: Embora o grego use o plural, o singular coletivo é a forma idiomática em português neste contexto.
- source_word: τὰ λοιπὰ πρὸς εὐωχίαν ἐπιτήδεια
  choice: os demais mantimentos apropriados para um banquete
  rationale: Mantém tanto a ideia de provisões quanto sua finalidade festiva.
- source_word: χορηγεῖν
  choice: que se fornecessem
  rationale: Preserva o fornecimento oficial determinado pelo rei e produz uma construção natural em português.
- source_word: κρίνας
  choice: Ele decidiu
  rationale: Explicita em nova oração a determinação ponderada do rei, evitando um período excessivamente carregado.
- source_word: ἔδοξαν
  choice: haviam esperado
  rationale: No contexto, indica aquilo que os judeus julgavam que lhes aconteceria; 'esperado' preserva esse sentido, embora com valor negativo.
- source_word: τὸν ὄλεθρον ἀναλαμβάνειν
  choice: encontrar a destruição
  rationale: Reproduz de maneira inteligível o destino fatal que esperavam enfrentar, sem literalismo obscuro.
- source_word: σωτήρια ἀγαγεῖν
  choice: celebrassem sua libertação
  rationale: Expressa uma celebração pela salvação concreta diante da morte; a nota conserva a alternativa lexical 'salvação'.
- source_word: ἐν εὐφροσύνῃ πάσῃ
  choice: com toda a alegria
  rationale: Transmite de modo natural a intensidade plena do júbilo.
theological_decisions:
- issue: Sentido de σωτήρια no contexto narrativo de resgate
  choice: libertação
  alternative: salvação
  rationale: O contexto imediato é o livramento da destruição ameaçada. 'Libertação' torna esse referente claro sem eliminar o alcance soteriológico possível do termo, registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe longa do grego foi dividida em duas frases para maior clareza, sem alterar as relações lógicas. O marcador [a] aparece imediatamente após o termo anotado.
