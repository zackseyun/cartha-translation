    rationale: O imperfeito descreve uma ação em curso durante o período indicado. «Festejaram» pode ser lido como evento pontual ou perfectivo; «banqueteavam-se» preserva melhor a ação continuada e o componente de refeição festiva.
  - severity: low
    issue: Restrição interpretativa de πάντα
    rationale: «Tudo de que precisavam» introduz a noção de necessidade, ausente do grego. «Providos pelo rei de tudo» traduz a abrangência de πάντα sem acréscimo.
