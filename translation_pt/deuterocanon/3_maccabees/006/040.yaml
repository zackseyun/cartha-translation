base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/040.yaml
  text: And they all feasted[a], being supplied by the king, until the fourteenth day, on which they also made their petition concerning their release.
translation:
  language: pt
  text: E eles se banqueteavam, providos pelo rei de tudo, até o décimo quarto dia. Nesse dia, também fizeram um pedido[a] acerca de sua libertação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apresentaram seu pedido de libertação”. A expressão grega pode indicar uma petição ou um apelo formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐωχοῦντο
  choice: festejaram
  rationale: O verbo indica participar de um banquete ou refeição festiva. “Festejaram” comunica de modo natural a celebração acompanhada de comida, sem reduzir o sentido a mero entretenimento.
- source_word: πάνθʼ ὑπὸ τοῦ βασιλέως χορηγούμενοι
  choice: recebendo do rei tudo de que precisavam
  rationale: 'πάνθ’ é melhor entendido aqui como a forma elidida do neutro plural πάντα, ligada ao particípio χορηγούμενοι: o rei lhes fornecia tudo. A formulação portuguesa torna explícita essa relação sem especificar além do texto quais provisões foram dadas.'
- source_word: μέχρι τῆς τεσσαρεσκαιδεκάτης
  choice: até o décimo quarto dia
  rationale: O ordinal feminino pressupõe “dia” no contexto. Acrescentar o substantivo em português evita obscuridade.
- source_word: ἐν ᾗ
  choice: Nesse dia
  rationale: O relativo retoma o décimo quarto dia. A divisão em duas frases e “Nesse dia” preservam a referência com fluência em português.
- source_word: τὴν ἐντυχίαν ἐποιήσαντο
  choice: apresentaram sua petição
  rationale: A expressão pode indicar uma petição, apelo ou solicitação formal dirigida a uma autoridade. “Apresentaram sua petição” conserva o caráter formal sem pressupor uma audiência pessoal.
- source_word: περὶ τῆς ἀπολύσεως αὐτῶν
  choice: acerca da própria libertação
  rationale: ἀπόλυσις significa soltura, dispensa ou libertação. “Própria libertação” deixa claro que a solicitação dizia respeito à libertação deles mesmos e mantém a construção com περί.
