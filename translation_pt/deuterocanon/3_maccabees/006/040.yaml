translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução entende πάνθ’ como πάντα (“tudo”), sintaticamente ligado a χορηγούμενοι, em vez de como referência distributiva a “todos”.
