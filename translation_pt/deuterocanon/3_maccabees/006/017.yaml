base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/017.yaml
  text: And when the Jews saw it[a], they cried out loudly to heaven, so that even the neighboring courtyards, echoing with them[b], produced uncontrollable terror throughout the whole camp.
translation:
  language: pt
  text: E, ao verem aquilo, os judeus clamaram bem alto ao céu, de modo que até os pátios adjacentes[a] ressoaram junto com eles e provocaram um pânico impossível de conter em todo o acampamento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os espaços cercados próximos”. O termo grego pode designar pátios ou áreas delimitadas adjacentes.
    reason: lexical_alternative
  - marker: b
    text: Ou “um terror impossível de conter”. A palavra grega pode indicar susto, terror ou pânico.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρήσαντες
  choice: ao verem aquilo
  rationale: O particípio aoristo apresenta a circunstância anterior ao verbo principal. “Aquilo” torna natural em português o objeto implícito, sem especificá-lo além do grego.
- source_word: μέγα
  choice: bem alto
  rationale: Usado adverbialmente com ἀνέκραξαν, exprime a grande intensidade sonora do clamor.
- source_word: εἰς οὐρανόν
  choice: ao céu
  rationale: Preserva a direção do clamor e não explicita Deus, que permanece implícito no texto grego.
- source_word: ἀνέκραξαν
  choice: clamaram
  rationale: Expressa um brado forte e, no contexto, uma súplica dirigida ao céu, em registro digno e corrente.
- source_word: τοὺς παρακειμένους αὐλῶνας
  choice: os pátios adjacentes
  rationale: παρακείμενος indica proximidade, e αὐλών pode designar pátio ou espaço delimitado. A escolha se ajusta ao cenário e permanece clara.
- source_word: συνηχήσαντας
  choice: ressoaram junto com eles
  rationale: O verbo denota soar em conjunto ou reverberar; a formulação conserva a imagem dos espaços próximos repercutindo o clamor.
- source_word: ἀκατάσχετον πτοήν
  choice: um pânico impossível de conter
  rationale: πτοή designa susto, terror ou pânico, enquanto ἀκατάσχετος indica aquilo que não pode ser detido ou contido.
- source_word: παντὶ τῷ στρατοπέδῳ
  choice: em todo o acampamento
  rationale: Reproduz de modo natural a abrangência do efeito sobre o acampamento inteiro.
theological_decisions:
- issue: Força religiosa implícita de εἰς οὐρανόν
  choice: ao céu
  alternative: a Deus
  rationale: O contexto sugere um apelo a Deus, mas o grego menciona diretamente o céu. A tradução mantém essa formulação sem tornar explícito o referente divino.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção foi levemente reorganizada para fluência, preservando a imagem incomum dos pátios que reverberam o clamor e, assim, espalham o pânico pelo acampamento.
