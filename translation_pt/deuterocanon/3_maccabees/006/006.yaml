base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/006.yaml
  text: You rescued the three companions in Babylonia[a], who had willingly given up their lives to the fire so as not to worship empty things; after cooling the blazing furnace, you delivered them all unharmed[b], and sent a flame upon all their adversaries.
translation:
  language: pt
  text: Tu resgataste os três companheiros na Babilônia, que voluntariamente entregaram a vida ao fogo para não adorar coisas vazias[a]; depois de refrescares a fornalha ardente, livraste a todos sem que perdessem sequer um fio de cabelo[b] e lançaste uma chama sobre todos os seus adversários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Coisas vazias” refere-se a falsos objetos de adoração; também se pode traduzir por “coisas vãs” ou, de modo mais interpretativo, “ídolos”.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “livraste a todos até um fio de cabelo”, isto é, sem que perdessem nem mesmo um fio de cabelo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑταίρους
  choice: companheiros
  rationale: Expressa associados ou companheiros e mantém a alusão aos três jovens sem acrescentar nomes ou outra identificação ausente do grego.
- source_word: πυρὶ τὴν ψυχὴν αὐθαιρέτως δεδωκότας
  choice: voluntariamente entregaram a vida ao fogo
  rationale: Conserva tanto a ação voluntária quanto a entrega da própria vida à morte; «vida» é mais natural neste contexto do que «alma».
- source_word: τοῖς κενοῖς
  choice: coisas vazias
  rationale: Preserva a formulação polemicamente literal do grego, que caracteriza os falsos objetos de culto como vazios, sem substituí-la diretamente por «ídolos».
- source_word: διάπυρον ... κάμινον
  choice: a fornalha ardente
  rationale: Comunica de modo natural a intensidade do fogo indicada por διάπυρον.
- source_word: δροσίσας
  choice: depois de refrescares
  rationale: O verbo sugere tornar fresco ou proporcionar alívio semelhante ao orvalho; «refrescares» preserva essa imagem melhor do que simplesmente «esfriares».
- source_word: ἐρρύσω μέχρι τριχὸς ἁπάντων
  choice: livraste a todos sem que perdessem sequer um fio de cabelo
  rationale: Torna explícita e natural em português a expressão concreta μέχρι τριχός, que indica preservação completa.
- source_word: φλόγα πᾶσιν ἐπιπέμψας τοῖς ὑπεναντίοις
  choice: e lançaste uma chama sobre todos os seus adversários
  rationale: Mantém «chama», a direção contra os oponentes e a coordenação desse particípio com os demais atos divinos.
- source_word: κατὰ τὴν Βαβυλωνίαν
  choice: na Babilônia
  rationale: Localiza o acontecimento de maneira direta e idiomática; em português bíblico corrente, «Babilônia» pode designar a região neste contexto.
theological_decisions:
- issue: Alusão à história dos três jovens na fornalha
  choice: Manter «três companheiros», sem inserir nomes nem ampliar o relato.
  alternative: Identificá-los nominalmente ou chamá-los de «três jovens».
  rationale: O grego pressupõe que o leitor reconheça a história e não fornece os nomes; a tradução conserva essa alusão sem harmonização.
- issue: Sentido de τοῖς κενοῖς
  choice: Traduzir como «coisas vazias».
  alternative: «ídolos» ou «coisas vãs».
  rationale: A expressão caracteriza teologicamente os objetos falsos de adoração, mas não emprega o substantivo grego comum para «ídolos»; a versão conserva essa tensão e força retórica.
- issue: Ação de δροσίσας na fornalha
  choice: Traduzir como «refrescares».
  alternative: «esfriares».
  rationale: A escolha conserva a possível nuance de frescor ou orvalho presente no verbo, sem reduzir a imagem à simples diminuição de temperatura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por «tu» mantém o discurso direto da oração e permite uma formulação solene sem arcaísmos excessivos. Os marcadores das notas foram posicionados junto às expressões que explicam.
