  yaml_path: translation/deuterocanon/3_maccabees/006/001.yaml
  text: 'A certain Eleazar, a distinguished man among the Jews of the country, already advanced in age and adorned with every virtue in life, quieted the elders around him to call upon the holy God, and prayed as follows:'
translation:
  language: pt
  text: 'Certo Eleazar, homem de destaque entre os judeus da região, já de idade avançada e adornado de todas as virtudes ao longo da vida, acalmou os anciãos ao seu redor, invocou o Deus santo e orou assim:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίσημος
  choice: de destaque
  rationale: Expressa notoriedade e distinção pública em português atual, sem sugerir necessariamente cargo oficial.
- source_word: τῶν ἀπὸ τῆς χώρας Ἰουδαίων
  choice: entre os judeus da região
  rationale: Reproduz a pertença ao grupo local indicada pelo grego e evita o sentido moderno mais restrito de “país”.
- source_word: ἐν πρεσβείῳ τὴν ἡλικίαν ἤδη λελογχώς
  choice: já de idade avançada
  rationale: Forma natural e digna de comunicar que Eleazar já havia alcançado a velhice.
- source_word: πάσῃ τῇ κατὰ τὸν βίον ἀρετῇ κεκοσμημένος
  choice: adornado de todas as virtudes ao longo da vida
  rationale: Mantém a metáfora de κεκοσμημένος e relaciona as virtudes à conduta durante a vida.
- source_word: τοὺς περὶ αὐτὸν καταστείλας πρεσβυτέρους
  choice: acalmou os anciãos que estavam ao seu redor
  rationale: Traduz o particípio como ação anterior à oração e explicita naturalmente o grupo circundante.
- source_word: ἐπικαλεῖσθαι τὸν ἅγιον θεόν
  choice: para que invocassem o Deus santo
  rationale: O acusativo πρεσβυτέρους funciona naturalmente como sujeito do infinitivo; a oração finita em português torna essa relação clara.
- source_word: προσηύξατο τάδε
  choice: orou assim
  rationale: Introdução idiomática e fiel à oração que vem em seguida.
theological_decisions:
- issue: Sujeito de ἐπικαλεῖσθαι
  choice: os anciãos invocariam o Deus santo
  alternative: Eleazar invocaria o Deus santo
  rationale: A construção com πρεσβυτέρους no acusativo seguido do infinitivo favorece os anciãos como sujeito de ἐπικαλεῖσθαι, enquanto προσηύξατο declara separadamente que Eleazar orou.
- issue: Ordem de ἅγιον θεόν
  choice: o Deus santo
  alternative: o santo Deus
  rationale: “O Deus santo” soa natural, conserva o adjetivo predicativo/descritivo e não acrescenta conteúdo confessional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. A frase longa do grego foi preservada sem se tornar excessivamente rebuscada.
