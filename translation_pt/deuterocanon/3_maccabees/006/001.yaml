  rationale: A revisão conserva todos os elementos descritivos do original, mas corrige a atribuição indevida da invocação aos anciãos. A coordenação de «invocou» e «orou» apresenta de modo natural em português as ações de Eleazar e está de acordo com a leitura mais provável da sintaxe grega e com a trilha inglesa.
