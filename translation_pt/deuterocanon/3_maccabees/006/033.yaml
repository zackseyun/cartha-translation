base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/033.yaml
  text: Likewise, the king also, holding a great banquet because of these things, was continually offering exalted thanksgiving to heaven for their astonishing deliverance that had taken place.
translation:
  language: pt
  text: Do mesmo modo, também o rei, celebrando por causa desses acontecimentos um grande banquete,[a] dava continuamente grandiosas ações de graças ao céu pela extraordinária libertação que lhes havia ocorrido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um banquete suntuoso”; literalmente, “um banquete pesado”, expressão que indica um banquete grandioso ou abundante.
    reason: lexical_alternative
  - marker: b
    text: Ou “pela extraordinária salvação que lhes havia ocorrido”. Neste contexto, “libertação” destaca o resgate concreto narrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Do mesmo modo
  rationale: Introduz uma ação paralela à anterior e preserva de forma natural a força comparativa do advérbio.
- source_word: περὶ τούτων
  choice: por causa desses acontecimentos
  rationale: No contexto do banquete, a expressão indica a ocasião ou causa ligada aos fatos narrados; “acontecimentos” explicita o referente sem acrescentar conteúdo.
- source_word: συμπόσιον βαρὺ
  choice: um grande banquete
  rationale: συμπόσιον designa um banquete, e βαρύς, literalmente “pesado”, qualifica aqui sua grandeza ou abundância, não seu peso físico.
- source_word: ἀδιαλείπτως
  choice: continuamente
  rationale: Conserva a ideia de ação persistente ou reiterada expressa pelo advérbio e pelo imperfeito.
- source_word: εἰς οὐρανόν
  choice: ao céu
  rationale: Mantém o referente explícito do grego e sua possível função reverencial, sem substituí-lo interpretativamente por “a Deus”.
- source_word: ἀνθωμολογεῖτο
  choice: dava ... ações de graças
  rationale: No contexto de uma libertação celebrada, o verbo médio no imperfeito exprime reconhecimento agradecido contínuo, não confissão de pecado.
- source_word: μεγαλομερῶς
  choice: grandiosas
  rationale: O adjetivo aplicado a “ações de graças” reproduz de modo idiomático o advérbio raro, que intensifica a magnitude ou elevação do agradecimento.
- source_word: παραδόξῳ
  choice: extraordinária
  rationale: Expressa aquilo que ultrapassa a expectativa ou causa admiração, preservando o tom elevado sem exagero.
- source_word: γενηθείσῃ αὐτῶν σωτηρίᾳ
  choice: libertação que lhes havia ocorrido
  rationale: σωτηρία refere-se aqui ao resgate concreto narrado; o particípio aoristo γενηθείσῃ é representado como um acontecimento já realizado.
theological_decisions:
- issue: Sentido de σωτηρία no contexto de resgate narrativo
  choice: libertação
  alternative: salvação
  rationale: O contexto imediato celebra o resgate histórico do povo. “Libertação” comunica esse sentido sem eliminar a possível ressonância teológica indicada em nota.
- issue: Referente de εἰς οὐρανόν
  choice: ao céu
  alternative: a Deus
  rationale: O grego diz literalmente “ao céu”, provavelmente como metonímia reverencial, mas a tradução evita tornar explícito aquilo que o texto deixa implícito.
- issue: Força de μεγαλομερῶς
  choice: grandiosas ações de graças
  alternative: muitas ações de graças
  rationale: A opção preserva a intensidade qualitativa e o registro elevado do termo, sem reduzi-lo necessariamente a quantidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a relação causal, a ação contínua e o tom solene do grego.
