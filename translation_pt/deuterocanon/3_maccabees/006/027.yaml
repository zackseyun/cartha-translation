  text: Release[a], release the unjust bonds; send them away to their own homes in peace[b], setting aside what has been ordered.
translation:
  language: pt
  text: Soltem, desfaçam as amarras injustas; mandem-nos de volta para o que é deles[a], em paz, deixando de lado as ordens dadas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para suas casas” ou “para seus próprios lugares”. A expressão grega pode indicar, de modo mais amplo, aquilo que lhes pertence ou seu próprio ambiente familiar.
    reason: lexical_alternative
  - marker: b
    text: Ou “deixando de lado o que havia sido ordenado”. O particípio se refere ao abandono de determinações anteriormente emitidas.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύσατε
  choice: Soltem
  rationale: Imperativo plural que ordena libertar ou desatar; “soltem” é natural, direto e mantém a força da ordem.
- source_word: ἐκλύσατε
  choice: desfaçam
  rationale: O segundo imperativo reforça o primeiro e sugere soltar plenamente; a variação evita uma repetição pouco natural em português sem perder a intensificação.
- source_word: ἄδικα δεσμά
  choice: as amarras injustas
  rationale: δεσμά abrange vínculos ou restrições concretas e figuradas; “amarras” preserva essa amplitude, enquanto ἄδικα expressa seu caráter moralmente injusto.
- source_word: εἰς τὰ ἴδια
  choice: para o que é seu
  rationale: A expressão pode indicar os próprios bens, lugar, casa ou âmbito familiar. A tradução conserva essa abertura sem restringi-la necessariamente a “lares”.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Expressão idiomática clara e digna que corresponde diretamente ao grego.
- source_word: ἐξαποστείλατε
  choice: mandem-nos de volta
  rationale: O verbo ordena que sejam enviados dali; o pronome explicita em português o objeto implícito, e “de volta” se ajusta ao destino indicado por εἰς τὰ ἴδια.
- source_word: τὰ προστεταγμένα
  choice: as ordens dadas
  rationale: Particípio perfeito passivo substantivado que se refere ao que havia sido ordenado anteriormente, sem identificar quem deu as ordens.
- source_word: παραιτησάμενοι
  choice: deixando de lado
  rationale: O particípio indica abandonar, retirar ou não levar adiante as determinações anteriores; “deixando de lado” é natural e não acrescenta uma renúncia formal além do texto.
