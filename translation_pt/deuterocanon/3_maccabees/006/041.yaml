translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente. “Comandantes” evita tecnicismo excessivo e a nota registra a amplitude administrativa e militar de στρατηγοί. A construção final mantém a ligação gramatical do particípio ἔχουσαν com “carta” e preserva o tom elevado de μεγαλοψύχως.
