  yaml_path: translation/deuterocanon/3_maccabees/006/041.yaml
  text: 'And when the king agreed with them[a], he wrote them the following letter to the generals in each city[b], magnanimously setting out the full account:'
translation:
  language: pt
  text: 'Depois de concordar com eles, o rei lhes escreveu a carta apresentada a seguir[a], dirigida aos comandantes de cada cidade[b] e contendo, com grandeza de espírito, uma exposição detalhada:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a carta escrita abaixo” ou “a carta anexada”.
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode ser traduzido como “generais” ou, em certos contextos administrativos, “governadores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναινέσας
  choice: Depois de concordar com eles
  rationale: O particípio aoristo indica que o rei deu seu assentimento à proposta anteriormente apresentada. A formulação é natural em português e conserva a referência explícita a αὐτοῖς.
- source_word: ἔγραψεν αὐτοῖς
  choice: lhes escreveu
  rationale: Reproduz de modo conciso e idiomático o verbo com o dativo αὐτοῖς.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: a carta apresentada a seguir
  rationale: ὑπογεγραμμένην significa literalmente algo escrito abaixo ou anexado. A escolha expressa com naturalidade a função da frase, que introduz o texto da carta.
- source_word: πρὸς τοὺς κατὰ πόλιν στρατηγούς
  choice: dirigida aos comandantes de cada cidade
  rationale: κατὰ πόλιν tem valor distributivo, 'em/de cada cidade'. στρατηγοί pode designar autoridades militares e administrativas; 'comandantes' mantém essa amplitude melhor que o estritamente militar 'generais'.
- source_word: μεγαλοψύχως
  choice: com grandeza de espírito
  rationale: A locução conserva o sentido de nobreza, generosidade ou magnanimidade sem recorrer ao advérbio menos corrente 'magnanimamente'.
- source_word: τὴν ἐκτενῆ ἔχουσαν
  choice: contendo ... uma exposição detalhada
  rationale: A expressão grega é condensada e caracteriza a carta como portadora de conteúdo extenso ou desenvolvido. A tradução comunica a ideia de exposição plena e detalhada sem sugerir apenas extensão física.
