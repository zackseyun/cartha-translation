  yaml_path: translation/deuterocanon/3_maccabees/006/008.yaml
  text: and Jonah[a], who was wasting away in the belly of the sea-fed monster, you brought forth unharmed in abundance to all his own people, Father[b],
translation:
  language: pt
  text: e Jonas[a], que definhava no ventre do monstro das profundezas, fizeste aparecer ileso diante de todos os seus, com generosidade[b], ó Pai,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “criatura marinha” ou “grande peixe”. O grego κῆτος designa uma grande criatura do mar; “baleia” é possível na tradição, mas é mais específico do que o termo grego.
    reason: lexical_alternative
  - marker: b
    text: O grego é condensado. A expressão pode indicar abundância, liberalidade ou uma ação realizada sem relutância; outra tradução possível é “em abundância”.
    reason: source_ambiguity
lexical_decisions:
- source_word: βυθοτρεφοῦς
  choice: nutrido pelas profundezas
  rationale: O composto associa βυθός, “profundeza”, a τρέφω, “nutrir”. A formulação conserva a imagem de uma grande criatura marinha pertencente às profundezas sem reduzi-la simplesmente a “peixe”.
- source_word: κήτους
  choice: monstro
  rationale: κῆτος designa uma grande criatura marinha e pode ter a força de “monstro marinho”. “Monstro” preserva a amplitude e o peso do termo, enquanto o modificador já deixa claro o ambiente marinho.
- source_word: τηκόμενον
  choice: definhava
  rationale: O particípio de τήκω exprime consumir-se, derreter-se ou definhar. “Definhava” comunica de modo natural o estado de deterioração e aflição de Jonas.
- source_word: ἀφθόνῳ
  choice: com generosidade
  rationale: ἀφθόνος pode expressar abundância, liberalidade ou ausência de recusa/inveja. O dativo tem força adverbial pouco explícita neste contexto; “com generosidade” preserva a ideia de uma ação divina não mesquinha sem produzir o português pouco natural “em abundância” aplicado ao aparecimento de Jonas.
- source_word: ἀσήμαντον
  choice: ileso
  rationale: Literalmente, o termo sugere alguém “sem marca” ou “sem sinal”; no contexto da libertação, indica que Jonas foi apresentado sem dano.
- source_word: πᾶσιν οἰκείοις
  choice: diante de todos os seus
  rationale: οἰκεῖοι pode referir-se aos familiares, à casa ou, de modo mais amplo, às pessoas ligadas a alguém. “Todos os seus” mantém essa abrangência; “diante de” explicita a relação natural com “fizeste aparecer” sem restringi-la à família biológica.
- source_word: ἀναδείξας
  choice: fizeste aparecer
  rationale: ἀναδείκνυμι significa mostrar, manifestar ou trazer à vista. Aqui, “fizeste aparecer” reúne a saída do monstro e a manifestação pública de Jonas.
- source_word: πάτερ
  choice: ó Pai
  rationale: É vocativo dirigido a Deus. A partícula “ó” torna a função vocativa clara e solene em português.
theological_decisions:
- issue: Identificação da criatura que engoliu Jonas
  choice: monstro nutrido pelas profundezas
  alternative: grande peixe; monstro marinho; baleia
  rationale: O grego κῆτος não identifica uma espécie precisa. Evita-se harmonizar o texto com “grande peixe” ou com a tradição específica de “baleia”, preservando a linguagem própria desta passagem.
- issue: Força de ἀφθόνῳ na ação libertadora
  choice: com generosidade
  alternative: em abundância; livremente; sem relutância
  rationale: A construção grega é condensada e permite mais de uma nuance relacionada a abundância ou liberalidade. A tradução conserva essa qualidade da ação sem transformá-la em afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a sintaxe de oração e o vocativo “ó Pai”. “Monstro” retém a força de κῆτος, enquanto a nota evita especificidade zoológica indevida. A posição de “com generosidade” foi escolhida para ligá-la ao ato de fazer Jonas aparecer, não ao estado de estar ileso.
