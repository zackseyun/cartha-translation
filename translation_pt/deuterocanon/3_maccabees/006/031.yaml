base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/031.yaml
  text: Then those who had formerly been disgraced and were near Hades—or rather[a], had already stepped onto it—in place of a bitter and hard-to-drink fate, prepared a saving drinking-bout, divided up as dining-couches, full of joy[c][b], the place prepared for them for downfall and a grave.
translation:
  language: pt
  text: Então, aqueles que antes tinham sido desonrados e estavam perto do Hades[a] — ou melhor, já haviam posto os pés nele[b] —, em vez de um destino amargo e difícil de beber, organizaram uma celebração de libertação regada a bebida[c] e, cheios de alegria, repartiram em lugares para se reclinarem à mesa o local que lhes fora preparado para a ruína e a sepultura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «perto da morte» ou «perto da sepultura»; em grego, literalmente, «perto do Hades».
    reason: lexical_alternative
  - marker: b
    text: A expressão grega diz literalmente que eles já haviam «pisado nele», uma imagem vívida de estarem praticamente mortos.
    reason: cultural_note
  - marker: c
    text: A palavra grega pode designar mais especificamente uma festa regada a bebida ou um banquete festivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπονείδιστοι
  choice: desonrados
  rationale: Expressa a condição pública de vergonha ou opróbrio de modo natural em português, sem restringir o sentido ao ato verbal de serem censurados.
- source_word: πλησίον τοῦ ᾅδου
  choice: perto do Hades
  rationale: Mantém o termo explícito ᾅδης e a imagem grega do domínio dos mortos, sem reduzi-la silenciosamente a 'morte' ou 'sepultura'.
- source_word: ἐπʼ αὐτῷ βεβηκότες
  choice: já haviam posto os pés nele
  rationale: 'Preserva a imagem vívida do particípio perfeito de βαίνω com ἐπί: eles são retratados como já tendo pisado no próprio Hades.'
- source_word: μόρου
  choice: destino
  rationale: μόρος pode indicar destino funesto, desgraça ou morte; 'destino' conserva a formulação metafórica sem explicitar além do grego.
- source_word: πικροῦ καὶ δυσαπότικου
  choice: amargo e difícil de beber
  rationale: Conserva a metáfora de beber, que prepara o contraste deliberado com κῶθων.
- source_word: κῶθωνα σωτήριον
  choice: festa de libertação
  rationale: No contexto de organização e lugares reclinados à mesa, κῶθων aponta para uma ocasião festiva com bebida, enquanto σωτήριον caracteriza a festa como celebração de livramento. A nota preserva a nuance mais específica.
- source_word: συστησάμενοι
  choice: organizaram
  rationale: Comunica naturalmente o sentido de providenciar ou montar para si mesmos a celebração.
- source_word: εἰς πτῶσιν αὐτοῖς καὶ τάφον ἡτοιμασμένον
  choice: preparado para a sua ruína e sepultura
  rationale: Mantém a dupla imagem sombria do local destinado à queda fatal e ao túmulo, em português idiomático.
- source_word: κλισίας κατεμέρισαν
  choice: repartiram em lugares para se reclinar à mesa
  rationale: κλισία designa aqui a disposição reclinada própria de uma refeição; a formulação torna inteligível ao leitor moderno a transformação do lugar em espaço de banquete.
- source_word: πλήρεις χαρμονῆς
  choice: cheios de alegria
  rationale: Tradução direta e natural que ressalta a reversão emocional da cena.
theological_decisions:
- issue: Tradução de ᾅδης
  choice: Hades
  alternative: morte; mundo dos mortos; sepultura
  rationale: O texto grego nomeia explicitamente o Hades. Mantê-lo preserva a imagem do domínio dos mortos e evita impor uma identificação doutrinária mais estreita.
- issue: Valor de σωτήριον
  choice: de libertação
  alternative: salvadora; que trouxe salvação
  rationale: Neste contexto narrativo, o adjetivo descreve uma celebração ligada ao livramento experimentado. 'De libertação' evita sugerir uma definição técnica de salvação que o verso não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe longa do grego foi preservada em uma única frase, mas organizada com travessões e ordem natural. As imagens incomuns de beber o destino, pisar no Hades e reclinar-se à mesa foram mantidas, com notas apenas onde a alternativa lexical é relevante.
