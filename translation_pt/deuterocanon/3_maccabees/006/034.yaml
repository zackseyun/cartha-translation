base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/034.yaml
  text: And those who had previously been reckoning them for destruction and to be devoured by birds[a], and had registered them with joy, groaned deeply, clothing themselves with shame[b], and their fire-breathing boldness was vigorously quenched.
translation:
  language: pt
  text: E aqueles que antes os consideravam destinados à destruição e a serem devorados pelas aves[a], e que os haviam registrado com alegria, gemeram profundamente, cobrindo-se de vergonha, e viram sua ousadia que respirava fogo[b] ser vigorosamente apagada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O particípio grego aqui traduzido por “consideravam destinados” é textual e sintaticamente difícil no testemunho de Swete. A oração em seu conjunto indica claramente que essas pessoas antes consideravam os judeus destinados à destruição e a serem deixados como alimento para as aves.
    reason: textual_variant
  - marker: b
    text: Ou “ousadia ardente”. A imagem grega é metafórica e tem forte sentido negativo no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε πρὶν
  choice: E aqueles que antes
  rationale: Expressa com naturalidade o contraste temporal marcado por πρίν.
- source_word: εἰς ὄλεθρον
  choice: destinados à destruição
  rationale: Preserva a ideia de que os judeus eram tidos como encaminhados à ruína, sem especificar além do grego.
- source_word: οἰωνόβρωτους
  choice: a serem devorados pelas aves
  rationale: Explicita em português corrente o raro composto que descreve cadáveres deixados como alimento para aves.
- source_word: ἐξεσθιέμενοι
  choice: os consideravam destinados
  rationale: A forma transmitida por Swete é textual e sintaticamente difícil; esta tradução comunica cautelosamente a avaliação hostil indicada pela oração.
- source_word: ἀπογραφάμενοι
  choice: os haviam registrado
  rationale: Mantém o sentido burocrático de inscrição ou registro no contexto da lista destinada à execução.
- source_word: μετὰ χαρᾶς
  choice: com alegria
  rationale: Tradução direta e natural da expressão grega.
- source_word: κατεστέναξαν
  choice: gemeram profundamente
  rationale: O verbo composto tem força intensiva, bem representada pelo advérbio.
- source_word: αἰσχύνην ἐφʼ ἑαυτοῖς περιβαλόμενοι
  choice: cobrindo-se de vergonha
  rationale: Conserva de modo idiomático a imagem de envolver-se ou vestir-se de vergonha.
- source_word: πυρόπνουν τόλμαν
  choice: ousadia que respirava fogo
  rationale: Preserva a metáfora vívida de πυρόπνους e a força contextual negativa de τόλμα sem transformá-la numa abstração.
- source_word: ἀκμαίως ἐσβεσμένοι
  choice: tiveram vigorosamente apagada
  rationale: Mantém a imagem de extinguir fogo e traduz ἀκμαίως como intensidade vigorosa, não como totalidade.
