    issue: «Ó Digno de honra» não equivale precisamente a ἔντιμε.
    rationale: A perífrase exprime dignidade ou merecimento de honra; o grego qualifica o destinatário como honrado, estimado ou venerável.
  - severity: low
    issue: «Forças» é ambíguo neste contexto.
    rationale: Pode ser entendido como tropas ou força física. O plural grego δυνάμεις pode funcionar como expressão de poder/capacidade, para a qual «poder» é a solução portuguesa mais natural.
  - severity: low
    issue: O marcador da nota lexical está deslocado.
    rationale: A nota explica γένος/«linhagem», portanto o marcador deve estar ancorado nesse sintagma.
