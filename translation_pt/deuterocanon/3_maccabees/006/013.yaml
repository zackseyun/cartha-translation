base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/013.yaml
  text: But let the nations cower today before your invincible power[a], O honored one, having power for the salvation of the race of Jacob.
translation:
  language: pt
  text: Mas que hoje as nações se encolham de medo diante do teu poder invencível, ó honrado, tu que tens poder para a salvação da linhagem de Jacó[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do povo de Jacó”. O grego γένος pode designar linhagem, família ou povo descendente de um ancestral comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτηξάτω
  choice: que ... se encolham de medo
  rationale: O imperativo aoristo exprime recuo ou submissão provocada pelo medo. A formulação comunica tanto o temor quanto o ato de se retrair.
- source_word: ἔθνη
  choice: as nações
  rationale: Refere-se coletivamente aos povos ao redor, sem exigir aqui o sentido teológico mais específico de “gentios”.
- source_word: σὴν δύναμιν ἀνίκητον
  choice: teu poder invencível
  rationale: Preserva o substantivo δύναμις e a força de ἀνίκητος, aquilo que não pode ser vencido.
- source_word: σήμερον
  choice: hoje
  rationale: Equivalente temporal direto e natural.
- source_word: ἔντιμε
  choice: ó Digno de honra
  rationale: Mantém a forma incomum de tratamento direto, baseada no adjetivo “honrado, estimado”, sem substituí-la por um título divino ausente do grego.
- source_word: δυνάμεις ἔχων
  choice: tu que tens forças
  rationale: Representa a construção participial e conserva o plural δυνάμεις, sem acrescentar explicitamente uma relação causal.
- source_word: ἐπὶ σωτηρίαν
  choice: para a salvação
  rationale: A preposição com acusativo indica finalidade ou direção, e a tradução conserva a forma nominal de σωτηρία.
- source_word: Ἰακὼβ γένους
  choice: da linhagem de Jacó
  rationale: γένος pode indicar descendência, estirpe, família ou povo oriundo de um ancestral. “Linhagem” preserva a ideia genealógica sem as conotações modernas potencialmente enganosas de “raça”.
theological_decisions:
- issue: Forma de tratamento divino ἔντιμε
  choice: ó Digno de honra
  alternative: ó Honrado; ó Venerável
  rationale: O grego dirige a Deus um adjetivo de honra, e não um título divino convencional. A tradução preserva essa particularidade sem normalizá-la como “Senhor”.
- issue: Relação do particípio δυνάμεις ἔχων com a petição
  choice: tu que tens forças
  alternative: pois tens forças
  rationale: A construção relativa preserva o particípio sem tornar obrigatoriamente causal uma relação que o grego deixa implícita.
translation_notes:
  register: Português atual, solene e acessível. Conserva-se o vocativo incomum dirigido a Deus e o plural de δυνάμεις. “Se encolham de medo” torna explícito o componente de temor inerente ao verbo, sem reduzir a imagem a mero tremor.
