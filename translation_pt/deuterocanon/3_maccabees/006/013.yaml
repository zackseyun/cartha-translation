review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a petição imperativa, o temor/recuo de πτηξάτω, «nações», «hoje», o poder invencível e a finalidade salvífica. Contudo, «Digno de honra» significa aquele que merece honra, ao passo que ἔντιμε significa «honrado/estimado»; convém preservar o adjetivo atributivo/vocativo sem essa alteração semântica. «Forças», embora tente refletir o plural δυνάμεις, em português tende a sugerir tropas ou vigor físico; «poder» comunica melhor o sentido abstrato exigido pelo contexto.
  naturalness: «Mas que hoje as nações se encolham de medo» é natural e mantém o registro solene. «Ó honrado» é incomum, como o próprio vocativo grego, mas é mais fiel e menos perifrástico que «ó Digno de honra». «Tu que tens poder» é claro e idiomático em português internacional.
  terminology: «Poder invencível», «salvação» e «linhagem de Jacó» são adequados. A alternativa «povo de Jacó» é pertinente para γένος. O marcador da nota deve seguir imediatamente «linhagem de Jacó», o termo a que a nota se refere, e não a pontuação final.
  issues:
