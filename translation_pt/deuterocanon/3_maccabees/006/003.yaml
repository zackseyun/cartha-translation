base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/003.yaml
  text: Look upon the offspring of Abraham[a], the children of Jacob who has been sanctified, your sanctified allotted people, perishing unjustly as strangers in a foreign land.
translation:
  language: pt
  text: Olha para a descendência de Abraão, para os filhos de Jacó, que foi santificado,[a] para o teu povo, tua porção santificada, que está perecendo injustamente como estrangeiro em terra estrangeira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os filhos santificados de Jacó”. A construção grega é comprimida, e “santificado” pode qualificar os filhos, em vez de Jacó.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπιδε
  choice: Olha para
  rationale: O imperativo, no contexto de oração, apela a Deus para que atente à situação; a formulação é clara, digna e preserva o tom de súplica.
- source_word: σπέρμα
  choice: descendência
  rationale: Expressa naturalmente o coletivo singular e evita o sentido excessivamente literal de “semente”.
- source_word: ἡγιασμένου
  choice: que foi santificado
  rationale: Preserva o valor verbal do particípio perfeito passivo e, no texto principal, liga-o a Jacó, sem ocultar a alternativa sintática.
- source_word: τέκνα Ἰακώβ
  choice: os filhos de Jacó
  rationale: “Filhos” é uma designação coletiva natural para os descendentes de Jacó neste contexto e não exige restringir a referência aos homens.
- source_word: μερίδος ἡγιασμένης σου λαὸν
  choice: o teu povo, tua porção santificada
  rationale: Trata “porção” como expressão em aposição a “povo”, reproduzindo melhor a sequência grega e a ideia de pertencimento especial a Deus.
- source_word: ἐν ξένῃ γῇ
  choice: em terra estrangeira
  rationale: Formulação corrente que mantém o cenário de alienação fora da própria terra.
- source_word: ξένως
  choice: tratado como estrangeiro
  rationale: No contexto de destruição injusta, torna inteligível o advérbio e preserva a condição hostil de estrangeiro sem recorrer ao opaco “estranhamente”.
- source_word: ἀδίκως
  choice: injustamente
  rationale: Explicita de modo direto a injustiça cometida contra o povo.
- source_word: ἀπολλύμενον
  choice: está sendo destruído
  rationale: Preserva o aspecto contínuo e a possibilidade passiva do particípio, adequada ao perigo infligido ao povo.
theological_decisions:
- issue: Referência de ἡγιασμένου na expressão comprimida ἐφ’ ἡγιασμένου τέκνα Ἰακώβ
  choice: 'Ligá-lo a Jacó: “os filhos de Jacó, que foi santificado”.'
  alternative: 'Ligá-lo aos filhos: “os filhos santificados de Jacó”.'
  rationale: A concordância genitiva e a ordem das palavras favorecem a ligação com Jacó, mas a sintaxe é comprimida e permite que o particípio caracterize coletivamente os filhos; a alternativa é mantida em nota.
- issue: Relação de μερίδος ἡγιασμένης σου com λαόν
  choice: “o teu povo, tua porção santificada” como aposição.
  alternative: “teu povo santificado, que te coube por porção”.
  rationale: A aposição conserva “porção” como substantivo e mantém a imagem de Israel como porção pertencente a Deus, sem converter silenciosamente o termo em mero adjetivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “estrangeiro” reproduz deliberadamente o jogo lexical ξένῃ/ξένως; a sequência de objetos após “Olha para” mantém o caráter acumulativo da súplica.
