base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/005.yaml
  text: You shattered Sennacherib[a], the mighty king of the Assyrians, who had become arrogant because of his innumerable forces, who had already brought the whole land under his hand by the spear, and who had exalted himself against your holy city, speaking grievous things with boasting and insolence—you, Master[c][b], making your power plain to many nations.
translation:
  language: pt
  text: Tu, ó Soberano[c], esmagaste Senaqueribe, o temível[a] rei dos assírios, que, orgulhoso de suas forças incontáveis, já havia submetido toda a terra ao seu domínio pela lança[b] e se levantado contra a tua cidade santa, proferindo palavras duras com arrogância e insolência; assim tornaste evidente o teu poder a muitas nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “severo” ou “opressivo”; o adjetivo grego pode descrever alguém pesado, duro ou formidável.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “já havia tomado toda a terra sob a sua mão pela lança”.
    reason: lexical_alternative
  - marker: c
    text: O título grego é despótēs, que enfatiza autoridade soberana, e não o mais comum kýrios, “Senhor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναριθμήτοις δυνάμεσιν
  choice: forças incontáveis
  rationale: No contexto militar, δυνάμεις designa tropas ou forças armadas; ἀναρίθμητος indica quantidade impossível de contar.
- source_word: γαυρωθέντα
  choice: se ensoberbeceu
  rationale: Expressa a altivez arrogante do particípio grego em registro digno e corrente.
- source_word: βαρὺν
  choice: temível
  rationale: Aplicado ao rei assírio, o adjetivo caracteriza alguém formidável, severo ou opressivo; “temível” preserva essa amplitude melhor que uma descrição puramente física.
- source_word: ὑποχείριον ... δόρατι
  choice: submetido ... ao seu domínio pela lança
  rationale: Comunica o sentido idiomático de estar sob a mão de alguém, preservando também a imagem militar concreta da lança.
- source_word: μετεωρισθέντα ἐπὶ
  choice: se levantado contra
  rationale: Preserva tanto a elevação presunçosa quanto a direção hostil contra a cidade, sem impor apenas uma leitura psicológica.
- source_word: βαρέα λαλοῦντα
  choice: proferindo palavras terríveis
  rationale: Mantém o peso e o caráter ameaçador da fala, sem acrescentar conteúdo não especificado pelo grego.
- source_word: κόμπῳ καὶ θράσει
  choice: com arrogância e insolência
  rationale: Reproduz o par de ostentação presunçosa e audácia desmedida em português natural.
- source_word: ἔθραυσας
  choice: esmagaste
  rationale: Verbo forte que comunica a derrota decisiva de Senaqueribe.
- source_word: ἔκδηλον δεικνὺς τὸ σὸν κράτος
  choice: assim tornaste evidente o teu poder
  rationale: A construção explicita o resultado público do ato divino. “Poder” é claro e adequado para κράτος como força manifestada.
theological_decisions:
- issue: Título divino δέσποτα
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: “Soberano” distingue δέσποτα do mais comum κύριος e comunica autoridade absoluta em linguagem natural de oração.
- issue: Alusão histórica ao ataque de Senaqueribe
  choice: Traduzir somente os elementos presentes no versículo
  alternative: Explicitar Jerusalém ou acrescentar detalhes de 2 Reis e Isaías
  rationale: A tradução preserva a alusão sem importar pormenores narrativos ausentes do texto grego.
- issue: Relação do particípio ἔκδηλον δεικνύς com ἔθραυσας
  choice: Explicitar o resultado com “assim tornaste evidente”
  alternative: “mostrando claramente”
  rationale: A formulação portuguesa torna clara a ligação entre a derrota do rei e a manifestação pública do poder divino, sem alterar a afirmação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com cadência apropriada a uma oração solene. A sintaxe foi moderadamente reorganizada para fluidez, mantendo a ênfase no ato de Deus e as imagens militares do original.
