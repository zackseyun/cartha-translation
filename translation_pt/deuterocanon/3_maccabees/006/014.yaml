  text: The whole multitude of the little children and their parents entreats you with tears.
translation:
  language: pt
  text: Toda a multidão das crianças pequenas e seus pais te suplicam com lágrimas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκετεύει
  choice: suplicam
  rationale: O verbo expressa um pedido intenso e humilde. “Suplicam” conserva a urgência e a dignidade do apelo; o plural é natural em português porque o sujeito reúne as crianças e seus pais.
- source_word: τὸ πᾶν πλῆθος
  choice: toda a multidão
  rationale: Preserva tanto a ideia coletiva de πλῆθος quanto a totalidade enfatizada por πᾶν, em formulação clara e solene.
- source_word: τῶν νηπίων
  choice: das crianças pequenas
  rationale: νήπια pode designar bebês ou crianças muito novas. “Crianças pequenas” mantém essa amplitude sem restringir o grupo exclusivamente a recém-nascidos.
- source_word: οἱ τούτων γονεῖς
  choice: os pais delas
  rationale: τούτων retoma as crianças. “Os pais delas” explicita a relação de maneira natural e evita possível ambiguidade.
- source_word: μετὰ δακρύων
  choice: em lágrimas
  rationale: Expressão idiomática e vívida em português, que comunica a circunstância emocional do pedido sem perder a imagem concreta das lágrimas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leve solenidade adequada a uma súplica pública. A concordância verbal no plural representa naturalmente o sujeito composto, embora o grego empregue o singular por concordância com o núcleo coletivo πλῆθος.
