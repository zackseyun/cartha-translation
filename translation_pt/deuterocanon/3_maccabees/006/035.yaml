  yaml_path: translation/deuterocanon/3_maccabees/006/035.yaml
  text: And the Jews[a], as we said before, having formed the previously mentioned chorus, spent their time with feasting, in joyful thanksgivings and psalms[b],
translation:
  language: pt
  text: E os judeus, como dissemos anteriormente, depois de formarem o grupo de canto já mencionado[a], passavam o tempo em banquetes, com alegres ações de graças[b] e salmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «depois de organizarem o coro já mencionado». O grego χορός pode indicar um coro ou um grupo que canta e possivelmente dança.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida por «alegres louvores». Neste contexto, a palavra grega provavelmente indica agradecimento ou louvor, e não confissão de pecados.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ τε Ἰουδαῖοι
  choice: E os judeus
  rationale: No contexto de 3 Macabeus, o termo designa a comunidade étnico-religiosa judaica no Egito; «judeus» é claro e natural em português.
- source_word: καθὼς προειρήκαμεν
  choice: como dissemos anteriormente
  rationale: Preserva a referência retrospectiva do narrador em linguagem corrente e digna.
- source_word: συστησάμενοι
  choice: depois de formarem
  rationale: Expressa a ação anterior do particípio aoristo e combina naturalmente com a formação de um grupo.
- source_word: τὸν προειρημένον χορὸν
  choice: o grupo de canto já mencionado
  rationale: χορὸς pode indicar coro ou companhia que canta e possivelmente dança; «grupo de canto» evita a possível leitura moderna de «coro» como mera composição musical, sem fechar toda a amplitude do grego.
- source_word: μετʼ εὐωχίας
  choice: em banquetes
  rationale: εὐωχία denota celebração festiva, especialmente com comida; o plural idiomático comunica a atividade continuada.
- source_word: ἐν ἐξομολογήσεσιν ἱλαραῖς
  choice: com alegres ações de graças
  rationale: Neste contexto cultual, ἐξομολόγησις provavelmente significa agradecimento ou louvor, não confissão de pecados; ἱλαραῖς acrescenta alegria.
- source_word: καὶ ψαλμοῖς
  choice: e salmos
  rationale: É a correspondência direta e tradicional para ψαλμοῖς, adequada ao contexto de celebração religiosa.
- source_word: διῆγον
  choice: passavam o tempo
  rationale: Reproduz de modo idiomático o aspecto durativo do imperfeito.
