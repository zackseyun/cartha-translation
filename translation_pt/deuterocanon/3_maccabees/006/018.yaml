  yaml_path: translation/deuterocanon/3_maccabees/006/018.yaml
  text: Then the greatly glorious, almighty, and true God, revealing his holy face, opened the gates of heaven, from which two glorious angels of fearful appearance came down, visible to everyone except the Jews,
translation:
  language: pt
  text: Então o Deus de imensa glória, Todo-Poderoso e verdadeiro, revelando seu santo rosto[a], abriu as portas celestiais. Delas desceram dois anjos gloriosos e de aparência aterradora, visíveis a todos, menos aos judeus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua santa presença” ou “sua santa face”.
    reason: Alternativas lexicais para πρόσωπον, cujo sentido básico é “rosto”, mas que também pode representar a presença pessoal.
lexical_decisions:
- source_word: μεγαλοδόξος
  choice: de imensa glória
  rationale: Preserva a intensificação da glória divina em português natural e solene, sem transformar o adjetivo em título convencional.
- source_word: παντοκράτωρ
  choice: Todo-Poderoso
  rationale: Equivalente consagrado e inteligível para o título divino, abrangendo poder e soberania universais.
- source_word: ἀληθινὸς θεός
  choice: Deus ... verdadeiro
  rationale: Mantém a força teológica e contrastiva de ἀληθινός, com ordem natural em português.
- source_word: ἐπιφάνας
  choice: revelando
  rationale: Expressa a manifestação divina em relação ao objeto explícito, seu santo rosto.
- source_word: τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: seu santo rosto
  rationale: Conserva a imagem concreta e antropomórfica de πρόσωπον, sem substituí-la silenciosamente pela interpretação 'presença'.
- source_word: ἠνέῳξε τὰς οὐρανίους πύλας
  choice: abriu as portas celestiais
  rationale: Reproduz diretamente o adjetivo οὐρανίους e soa natural no registro narrativo elevado.
- source_word: δεδοξασμένοι
  choice: gloriosos
  rationale: Comunica o esplendor conferido aos anjos de modo idiomático; 'glorificados' poderia sugerir em português um processo teológico mais específico do que o contexto exige.
- source_word: φοβεροειδεῖς
  choice: de aparência aterradora
  rationale: Expressa que a aparência dos anjos inspirava medo, preservando o caráter descritivo do composto.
- source_word: φανεροὶ πᾶσιν πλὴν τοῖς Ἰουδαίοις
  choice: visíveis a todos, menos aos judeus
  rationale: Torna clara a perceptibilidade visual indicada pelo contexto e mantém sem explicação adicional a exceção expressa no grego.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus em τὸ ἅγιον αὐτοῦ πρόσωπον
  choice: seu santo rosto
  alternative: sua santa presença; sua santa face
  rationale: O texto grego emprega a imagem concreta de 'rosto'. A tradução a preserva no texto principal, enquanto a nota registra a extensão semântica possível ligada à presença.
- issue: Cláusula de visibilidade que exclui os judeus
  choice: visíveis a todos, menos aos judeus
  alternative: manifestos a todos, exceto aos judeus
  rationale: Mantém a afirmação narrativa explícita sem explicar, atenuar ou harmonizar a exclusão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A frase foi dividida após 'portas celestiais' para evitar encadeamento excessivo, sem alterar as relações sintáticas. A vírgula final foi mantida porque o versículo continua no contexto imediato.
