    rationale: O grego traz o singular τὴν δύναμιν («a força», isto é, o contingente). «A força dos adversários» é mais fiel e mais claro.
  - severity: medium
    issue: «Medo» enfraquece δειλία.
    rationale: δειλία denota timidez, falta de coragem ou covardia; «covardia» preserva melhor o contraste e a escolha lexical do original.
