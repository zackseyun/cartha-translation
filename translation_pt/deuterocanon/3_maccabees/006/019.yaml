  text: And they rose up[a], and filled the force of their adversaries with confusion and cowardice[b], and bound them with immovable fetters.
translation:
  language: pt
  text: E eles se levantaram[a], encheram de confusão e covardia a força dos adversários[b] e os prenderam com grilhões inamovíveis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “resistiram” ou “tomaram posição contra eles”. O verbo grego pode indicar levantar-se, opor-se ou oferecer resistência.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “encheram de confusão e covardia a força dos adversários”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: se levantaram contra os adversários
  rationale: O aoristo de ἀνθίστημι expressa tomar posição contra ou resistir. A formulação mantém tanto a imagem de se levantar quanto o sentido explícito de oposição no contexto.
- source_word: δύναμιν τῶν ὑπεναντίων
  choice: as forças deles
  rationale: Aqui δύναμις designa o contingente militar dos adversários, não poder abstrato. O plural idiomático 'forças' comunica naturalmente esse sentido em português.
- source_word: ταραχῆς καὶ δειλίας
  choice: confusão e medo
  rationale: ταραχή indica perturbação ou confusão, e δειλία, temor ou falta de coragem. 'Medo' evita atribuir uma falha moral por meio de 'covardia' e preserva a reação produzida nos adversários.
- source_word: ἀκινήτοις ... πέδαις
  choice: grilhões que não podiam ser movidos
  rationale: πέδαις são grilhões ou ataduras, especialmente para os pés; ἀκινήτοις ressalta que eram imóveis ou inamovíveis. A oração relativa é clara e natural, sem apagar a imagem concreta.
