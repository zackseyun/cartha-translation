  source_fidelity: A tradução acompanha a sequência verbal e a imagem militar do grego, mas introduz «contra os adversários» no texto principal para ἀντέστησαν, embora essa relação permaneça uma possibilidade lexical e não seja expressa como complemento no grego. Além disso, o singular «a força» traduz com maior precisão τὴν δύναμιν, e δειλία é mais bem mantido por «covardia» do que pelo mais amplo «medo».
  naturalness: A redação revista conserva um português moderno e fluente. «Grilhões inamovíveis» é conciso, claro no contexto e preserva o caráter enfático de ἀκινήτοις.
  terminology: «Força dos adversários» mantém o sentido coletivo militar de δύναμις; «confusão e covardia» reproduz ταραχή e δειλία sem paráfrase. «Grilhões» é apropriado para πέδαι.
