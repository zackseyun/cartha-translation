  text: And they approached the king[a], asking for their release to their own homes.
translation:
  language: pt
  text: Então, dirigiram-se ao rei e pediram que os deixasse voltar para casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o que lhes pertencia” ou “para seus próprios lugares”. A expressão grega pode referir-se, de modo mais amplo, ao que é próprio de alguém, embora aqui provavelmente indique o retorno para casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέτυχον
  choice: dirigiram-se
  rationale: O verbo pode indicar encontrar-se com alguém, aproximar-se ou apresentar-lhe um pedido. “Dirigiram-se ao rei” conserva o contato direto e, com a oração seguinte, deixa claro que se tratava de uma solicitação.
- source_word: τῷ βασιλεῖ
  choice: ao rei
  rationale: Tradução direta do dativo com artigo, sem acrescentar nuance de título não expressa no grego.
- source_word: τὴν ἀπόλυσιν αὐτῶν
  choice: que os deixasse voltar
  rationale: ἀπόλυσις designa soltura, dispensa ou autorização para partir. A formulação verbal é natural em português e expressa, no contexto, o pedido de permissão para regressar, sem sugerir emancipação jurídica mais ampla.
- source_word: εἰς τὰ ἴδια
  choice: para casa
  rationale: A expressão idiomática pode indicar o retorno ao que é próprio, especialmente ao próprio lugar ou lar. “Para casa” comunica com naturalidade o sentido mais provável no contexto.
- source_word: αἰτούμενοι
  choice: pediram
  rationale: O particípio expressa a solicitação feita ao rei. A coordenação verbal produz português corrente e preserva claramente a força de pedido.
