lexical_decisions:
- source_word: μετεστράφη
  choice: transformou-se
  rationale: Expressa naturalmente a reversão sofrida pela ira do rei, sem especificar quem provocou a mudança.
- source_word: ἡ ὀργή
  choice: a ira
  rationale: Equivalente corrente e digno de ὀργή no contexto narrativo.
- source_word: εἰς οἶκτον καὶ δάκρυα
  choice: em compaixão e lágrimas
  rationale: οἶκτον denota sobretudo compaixão ou piedade; a formulação conserva a mudança emocional da ira para a compaixão dolorosa.
- source_word: ὑπὲρ
  choice: por causa de
  rationale: Introduz aqui aquilo que ocasionou a reação compassiva do rei.
- source_word: τῶν ἔμπροσθεν αὐτῷ μεμηχανευμένων
  choice: do que antes havia sido tramado diante dele
  rationale: 'Reproduz a construção grega comprimida: ἔμπροσθεν indica anterioridade e/ou a presença do rei, enquanto μεμηχανευμένων descreve algo planejado ou tramado.'
