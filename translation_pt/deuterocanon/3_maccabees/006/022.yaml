  language: pt
  text: E a ira do rei transformou-se em compaixão e lágrimas por aquilo que antes havia sido planejado diante dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em pesar e lágrimas pelo que antes havia sido planejado em sua presença”. A construção grega é condensada e admite alguma variação quanto à emoção do rei e ao sentido de “diante dele”.'
