  yaml_path: translation/deuterocanon/3_maccabees/006/038.yaml
  text: Copies were made for them from the twenty-fifth of Pachon until the fourth of Epiphi[a], over forty days; and they appointed their destruction from the fifth of Epiphi until the seventh[b], in three days.
translation:
  language: pt
  text: Foram feitas cópias para eles[b], desde o dia vinte e cinco de Paquom até o dia quatro de Epifi[a], durante quarenta dias; e determinaram sua destruição, do dia cinco ao dia sete de Epifi, ao longo de três dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paquom e Epifi são nomes de meses egípcios usados na datação administrativa da narrativa.
    reason: cultural_note
  - marker: b
    text: O verbo grego pode indicar que se fizeram cópias ou que se prepararam documentos oficiais; o versículo não declara explicitamente o que foi copiado ou preparado.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντιγράφονται
  choice: Fizeram-se cópias
  rationale: Preserva o sentido passivo e documental de ἀντιγράφω sem especificar se eram ordens, listas ou outro tipo de documento, pois o objeto não aparece no grego.
- source_word: αὐτοῖς
  choice: para eles
  rationale: Mantém o dativo de modo simples, sem substituir o pronome por um referente mais explícito do que o texto fornece.
- source_word: ἀπὸ πέμπτης τοῦ Παχὼν καὶ εἰκάδος
  choice: desde o dia vinte e cinco de Paquom
  rationale: Expressa naturalmente em português a fórmula grega para o vigésimo quinto dia do mês.
- source_word: ἕως τῆς τετάρτης τοῦ Ἐπιφὶ
  choice: até o dia quatro de Epifi
  rationale: Conserva o nome egípcio do mês por transliteração e apresenta a data em forma corrente e clara.
- source_word: ἐπʼ ἡμέρας τεσσαράκοντα
  choice: durante quarenta dias
  rationale: Traduz diretamente a duração do período, sem sugerir mais de quarenta dias.
- source_word: συνίστανται
  choice: determinaram
  rationale: No contexto administrativo, comunica a ação de estabelecer ou fixar oficialmente o que ocorreria, sem a coloquialidade de 'programaram'.
- source_word: τὴν ἀπώλειαν
  choice: a destruição deles
  rationale: ἀπώλεια indica aqui a ruína ou eliminação pretendida; 'destruição' mantém a força do termo sem acrescentar uma formulação doutrinária.
- source_word: ἀπὸ πέμπτης τοῦ Ἐπιφὶ ἕως ἑβδόμης
  choice: do dia cinco ao dia sete de Epifi
  rationale: Reproduz com clareza e concisão o intervalo de datas.
- source_word: ἡμέραις τρισίν
  choice: em três dias
  rationale: Mantém a expressão temporal final do grego e a relação com o período estabelecido.
