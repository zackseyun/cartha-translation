base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/024.yaml
  text: You have exceeded kings and surpassed tyrants in cruelty; and you are now even attempting to remove me myself[a], your benefactor, from power and from life, secretly plotting what is not advantageous to the kingdom.
translation:
  language: pt
  text: Vocês ultrapassaram os reis e superaram os tiranos em crueldade; e já tentam destituir-me do poder e tirar-me a vida[a] — a mim mesmo, seu benfeitor —, tramando às escondidas o que não convém ao reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, literalmente: “remover-me do poder e do espírito/sopro”. A palavra grega traduzida por “vida” também pode significar “espírito” ou “sopro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραβεβασιλεύετε
  choice: Vocês ultrapassaram os reis
  rationale: O perfeito intensifica uma acusação de ter ido além do padrão dos reis; esta formulação preserva o paralelismo comparativo com a oração seguinte.
- source_word: τυράννους ὑπερβεβήκατε ὠμότητι
  choice: superaram os tiranos em crueldade
  rationale: Reproduz com clareza o sentido comparativo de exceder os tiranos na qualidade negativa expressa por ὠμότης.
- source_word: ἐμὲ αὐτὸν
  choice: até de mim
  rationale: Expressa em português natural a ênfase indignada do pronome grego.
- source_word: τὸν ὑμῶν εὐεργέτην
  choice: que sou seu benfeitor
  rationale: Mantém o título helenístico εὐεργέτης e esclarece naturalmente sua relação a ἐμὲ αὐτόν.
- source_word: ἐπιχειρεῖτε
  choice: agora tentam
  rationale: O presente indica uma tentativa em curso; ἤδη é representado por «agora».
- source_word: τῆς ἀρχῆς ... μεθιστᾶν
  choice: destituir do poder
  rationale: No contexto régio, ἀρχή designa poder ou governo, e «destituir» comunica de modo idiomático a remoção dessa posição.
- source_word: τοῦ πνεύματος μεθιστᾶν
  choice: tirar a vida
  rationale: Em associação com uma conspiração contra o governante, πνεῦμα tem naturalmente o sentido de sopro vital ou vida; a alternativa literal é preservada em nota.
- source_word: λάθρα μηχανώμενοι
  choice: tramando às escondidas
  rationale: Conserva tanto a ideia de maquinação hostil quanto seu caráter secreto.
- source_word: τὰ μὴ συμφέροντα τῇ βασιλείᾳ
  choice: o que não convém ao reino
  rationale: Traduz a ausência de benefício ou conveniência para o reino sem intensificá-la automaticamente para dano explícito.
theological_decisions:
- issue: Sentido de πνεῦμα na acusação
  choice: vida
  alternative: espírito ou sopro
  rationale: O contexto de destituição política e conspiração secreta favorece o sentido de vida ou sopro vital. A nota conserva a polissemia grega sem impor uma conclusão antropológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção foi levemente desdobrada («destituir do poder e tirar a vida») para evitar a combinação pouco natural de um único verbo português com ambos os complementos gregos, sem perder o paralelismo.
