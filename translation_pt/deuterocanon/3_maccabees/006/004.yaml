base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/004.yaml
  text: Father[a], you who destroyed Pharaoh—the former ruler of this Egypt—when he was exalted with lawless arrogance and boastful speech, increasing in reckless acts, together with his proud army, drowning them in the sea, and who shone forth the light of mercy upon the people of Israel[c][b],
translation:
  language: pt
  text: Pai, tu que destruíste o faraó — o antigo governante deste Egito —, quando ele, exaltado com audácia sem lei e palavras jactanciosas, multiplicava atos de insolência[a], juntamente com seu exército orgulhoso, engolidos pelo mar[b], e fizeste resplandecer sobre o povo de Israel a luz da misericórdia[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é difícil; também pode ser traduzida por “aumentava em feitos temerários”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “destruíste [os] engolidos pelo mar”, imagem do faraó e de seu exército sendo tragados pelo mar.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “fizeste resplandecer a luz da misericórdia” sobre Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Pai
  rationale: Vocativo direto em uma oração; forma natural, solene e fiel ao grego.
- source_word: τὸν πρὶν Αἰγύπτου ταύτης δυνάστην
  choice: o antigo governante deste Egito
  rationale: Mantém tanto o sentido temporal de πρίν quanto o demonstrativo ταύτης, sem intensificar δυνάστης para “tirano”.
- source_word: πληθύνοντα θράμασιν
  choice: multiplicava atos de insolência
  rationale: A expressão é difícil; a tradução preserva a ideia de conduta audaciosa e insolente que se multiplica, sem ocultar a incerteza lexical.
- source_word: ἐπαρθέντα ἀνόμῳ θράσει
  choice: exaltado em arrogância contrária à lei
  rationale: Preserva a imagem de elevação de ἐπαρθέντα e o peso moral de ἀνόμῳ, enquanto θράσει assume aqui sentido negativo de arrogância insolente.
- source_word: γλώσσῃ μεγαληγόμονι
  choice: com palavras jactanciosas
  rationale: Expressa em português corrente a ideia de uma língua que profere discursos grandiosos e soberbos.
- source_word: σὺν τῇ ὑπερηφάνῳ στρατιᾷ
  choice: juntamente com seu exército orgulhoso
  rationale: Tradução direta e natural; “seu” é explicitado pelo contexto.
- source_word: ποντοβρόχους ἀπώλεσας
  choice: fazendo com que fossem tragados pelo mar
  rationale: Conserva a imagem vívida do adjetivo composto, em vez de reduzi-la simplesmente a “afogados”.
- source_word: φέγγος ἐπιφάνας ἐλέους
  choice: fizeste resplandecer ... a luz da misericórdia
  rationale: Mantém a metáfora luminosa explícita de φέγγος e ἐπιφαίνω.
- source_word: Ἰσραὴλ γένει
  choice: sobre o povo de Israel
  rationale: γένος designa aqui o povo ou linhagem de Israel; “povo” evita conotações raciais modernas e soa natural.
theological_decisions:
- issue: Contraste entre o juízo contra o faraó e a misericórdia concedida a Israel.
  choice: Preservar ambas as ações divinas em uma única frase contínua e conservar a imagem da luz da misericórdia.
  alternative: Dividir a frase ou substituir a metáfora por “mostraste misericórdia”.
  rationale: A estrutura da oração contrapõe de modo deliberado a destruição do opressor arrogante e a manifestação luminosa da misericórdia sobre Israel; simplificá-la enfraqueceria essa tensão retórica e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe extensa da oração grega foi mantida, mas organizada com travessões e vírgulas. “Jactanciosas” conserva o tom elevado sem recorrer a linguagem arcaica excessiva.
