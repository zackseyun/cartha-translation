base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/036.yaml
  text: And having established a common ordinance concerning these things for all their community throughout their generations[a], they decreed that the previously mentioned days should be observed as days of rejoicing, not for the sake of drinking and gluttony, but because of the deliverance that had come to them through God.
translation:
  language: pt
  text: Depois de estabelecerem, a respeito dessas coisas, uma norma comum para toda a sua comunidade, por todas as gerações, decretaram que os dias mencionados anteriormente fossem celebrados como dias de alegria, não por causa da bebida e da gula, mas por causa do livramento que lhes sobreveio por meio de deuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “por meio de deuses” (διὰ θεῶν). No contexto judaico do relato, é provável que o livramento seja atribuído ao Deus único; o plural pode refletir a forma textual transmitida ou um uso incomum da expressão.
    reason: Preservar com transparência o plural da fonte grega e, ao mesmo tempo, informar a tensão com o contexto literário e teológico.
lexical_decisions:
- source_word: κοινὸν ... θεσμὸν
  choice: uma norma comum
  rationale: Expressa uma regra formal compartilhada por toda a comunidade, com linguagem atual e sem o tom excessivamente técnico de “estatuto” ou “ordenança”.
- source_word: παροικίαν
  choice: comunidade
  rationale: No contexto, designa o corpo coletivo que vivia como população residente fora de sua terra; “comunidade” comunica isso naturalmente, sem inserir explicitamente “diáspora”.
- source_word: εἰς γενεάς
  choice: por todas as gerações
  rationale: Preserva a ideia de vigência e observância contínuas ao longo das gerações sucessivas.
- source_word: ἄγειν ... εὐφροσύνους
  choice: fossem celebrados como dias de alegria
  rationale: Com referência a dias festivos, ἄγειν significa guardar ou celebrar; a formulação traduz também o caráter alegre expresso por εὐφροσύνους.
- source_word: πότου καὶ λιχνείας
  choice: da bebida e da gula
  rationale: Mantém a referência direta ao beber e à indulgência excessiva no comer, sem intensificar πότος para “bebedeira”.
- source_word: σωτηρίας
  choice: livramento
  rationale: Neste relato histórico, refere-se concretamente ao resgate diante do perigo, embora conserve a dimensão de ação divina.
- source_word: διὰ θεῶν
  choice: por meio de deuses
  rationale: Traduz diretamente o plural θεῶν da edição grega indicada, em vez de convertê-lo silenciosamente no singular apesar do contexto judaico.
theological_decisions:
- issue: O plural θεῶν em um relato de contexto judaico
  choice: por meio de deuses
  alternative: por meio de Deus
  rationale: A fonte impressa traz inequivocamente o genitivo plural θεῶν. Embora o contexto favoreça a atribuição do livramento ao Deus único e possa apontar para uma forma transmitida ou expressão incomum, a tradução principal preserva a tensão textual, e a nota esclarece a dificuldade sem corrigir silenciosamente o grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi reorganizada de modo natural, mas a relação lógica e a formalidade comunitária do grego foram mantidas. O plural teologicamente difícil da fonte foi preservado no texto e explicado em nota.
