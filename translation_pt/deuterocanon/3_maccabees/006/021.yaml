  text: And the beasts turned against the armed forces following them[a], and they trampled them and destroyed them.
translation:
  language: pt
  text: E os animais se voltaram contra as forças armadas que os acompanhavam[a], e pisoteavam-nas e as destruíam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as tropas armadas que os seguiam». O particípio grego pode significar «acompanhar» ou «seguir junto».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστρεψαν
  choice: se voltaram contra
  rationale: O verbo ativo, com os animais como sujeito, indica mudança de direção para um alvo; «contra» expressa naturalmente o movimento hostil confirmado pelo contexto.
- source_word: τὰ θηρία
  choice: os animais
  rationale: Neste contexto, refere-se aos elefantes; «animais» é natural e exato em português, sem sugerir indevidamente que fossem feras selvagens.
- source_word: ἐπὶ
  choice: contra
  rationale: Com verbo de movimento e diante do ataque descrito em seguida, a preposição tem sentido hostil.
- source_word: τὰς συνεπομένας ἔνοπλους δυνάμεις
  choice: as forças armadas que os acompanhavam
  rationale: Preserva tanto o sentido militar de ἔνοπλους δυνάμεις como a possível nuance de acompanhar ou seguir junto expressa pelo particípio.
- source_word: κατεπάτουν
  choice: pisoteando-as
  rationale: Retrata a ação contínua dos animais esmagando as forças sob os pés; a forma coordenada em português mantém a progressão da frase.
- source_word: ὠλέθρευον
  choice: destruindo-as
  rationale: Conserva a intensidade ampla do verbo grego, que denota destruição ou extermínio, sem restringi-lo apenas ao ato de matar.
