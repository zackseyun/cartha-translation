  yaml_path: translation/deuterocanon/3_maccabees/006/016.yaml
  text: But just as Eleazar was finishing his prayer[a], the king came along by the hippodrome with the beasts and all the tumult of his forces.
translation:
  language: pt
  text: Mas, justamente quando Eleazar terminava a oração, o rei passava junto ao hipódromo, com as feras e com todo o alarde de suas tropas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λήγοντος ἄρτι
  choice: justamente quando ... terminava
  rationale: 'O genitivo absoluto com ἄρτι indica simultaneidade imediata: a chegada do rei ocorre no exato momento em que a oração se aproxima do fim.'
- source_word: προσευχῆς
  choice: oração
  rationale: Equivalente corrente e direto de προσευχή neste contexto.
- source_word: παρῆγεν
  choice: avançou
  rationale: παράγω descreve aqui o deslocamento do rei em procissão ou passagem; «avançou» soa natural e preserva a ideia de movimento sem definir em excesso o trajeto.
- source_word: κατὰ τὸν ἱππόδρομον
  choice: junto ao hipódromo
  rationale: κατά com acusativo tem sentido local, mas não esclarece inequivocamente se o deslocamento ocorreu dentro, ao longo ou ao lado do hipódromo; «junto ao» conserva essa cautela.
- source_word: θηρίοις
  choice: os animais
  rationale: No contexto, são os animais perigosos preparados para a execução. «Animais» é claro e natural, enquanto o contexto mantém seu caráter ameaçador sem a necessidade de acrescentar «selvagens».
- source_word: παντὶ τῷ τῆς δυνάμεως φρύαγματι
  choice: todo o alvoroço ameaçador de suas tropas
  rationale: φρύαγμα evoca resfolegar, bramir, arrogância ou tumulto ruidoso, e δύναμις designa aqui a força militar. A expressão escolhida comunica tanto o ruído coletivo quanto sua carga intimidatória.
