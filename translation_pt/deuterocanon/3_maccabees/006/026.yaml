review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a pergunta retórica, a antiguidade da boa vontade, a comparação com todos os povos e a imagem de cercar com crueldades. Contudo, «demonstraram seu valor» interpreta indevidamente o particípio ἐπιδειγμένους, introduzindo a noção de coragem ou mérito pessoal que o grego não explicita. «Perigos humanos» mantém de modo útil a dificuldade de ἀνθρώπων, desde que a formulação verbal seja corrigida.
  naturalness: O texto tem registro digno e é compreensível. «De modo tão contrário à lei» é um pouco pesado, mas aceitável; «de maneira tão contrária à lei» flui melhor. A locução «boa vontade para conosco» é correta, embora «em relação a nós» seja mais natural para o português moderno internacional.
  terminology: «Maus-tratos» transmite adequadamente αἰκίαις, e «os mais graves perigos» transmite bem χειρίστους κινδύνους. A nota sobre διαφέροντας é pertinente. A nota sobre a expressão com ἀνθρώπων deve permanecer, pois a construção grega é difícil e não comporta resolução dogmática ou excessivamente específica.
