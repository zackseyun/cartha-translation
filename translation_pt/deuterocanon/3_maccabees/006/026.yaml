base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/026.yaml
  text: Who has so lawlessly surrounded with cruelties those who from the beginning have surpassed all nations in goodwill toward us in every respect, and who have repeatedly shown themselves to face the worst dangers among men?
translation:
  language: pt
  text: Quem cercou de maneira tão contrária à lei, com maus-tratos, aqueles que, desde o princípio, têm superado todos os povos em todos os aspectos[a] na boa vontade em relação a nós e que muitas vezes enfrentaram os mais graves perigos humanos?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “têm-se distinguido de todos os povos em todos os aspectos”; o verbo grego pode significar tanto “diferir” como, neste contexto, “superar” ou “sobressair”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega traduzida como “os mais graves perigos humanos” é difícil. Pode referir-se aos perigos mais graves encontrados nas relações humanas ou aos perigos que os seres humanos sofrem.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Quem envolveu
  rationale: Introduz uma pergunta retórica; a forma direta é natural em português e mantém a força interrogativa do grego.
- source_word: τοὺς ἐξ ἀρχῆς
  choice: aqueles que, desde o princípio
  rationale: A expressão articulada refere-se a um grupo cuja conduta vem de longa data, sem especificar além do texto.
- source_word: εὐνοίᾳ πρὸς ἡμᾶς
  choice: na boa vontade para conosco
  rationale: εὔνοια indica boa vontade, benevolência ou disposição favorável; a formulação conserva a orientação para o grupo que fala.
- source_word: κατὰ πάντα διαφέροντας πάντων ἐθνῶν
  choice: têm superado todos os povos em todos os aspectos
  rationale: No contexto, διαφέρω provavelmente tem sentido de exceder ou destacar-se; a nota preserva a possibilidade lexical de apenas diferir.
- source_word: τοὺς ... ἐπιδειγμένους
  choice: demonstraram seu valor
  rationale: O particípio médio sugere que eles se mostraram ou provaram quem eram; 'demonstraram seu valor' é idiomático e evita a construção pouco natural 'mostraram-se perigos'.
- source_word: χειρίστους ... κινδύνους
  choice: os mais graves perigos
  rationale: O superlativo χειρίστους qualifica perigos extremos; 'mais graves' soa digno e natural em português.
- source_word: πλεονάκις
  choice: muitas vezes
  rationale: Reproduz claramente a ideia de repetição frequente.
- source_word: ἀνθρώπων
  choice: humanos
  rationale: O genitivo é sintaticamente difícil; 'perigos humanos' conserva uma relação ampla com a experiência humana sem fixar uma única interpretação.
- source_word: οὕτως ἀθέσμως
  choice: de modo tão contrário à lei
  rationale: ἀθέσμως expressa ação contrária à lei, à ordem ou ao que é justo; a locução é mais corrente que 'ilegalmente' neste registro retórico.
- source_word: περιέβαλεν αἰκίαις
  choice: envolveu ... em maus-tratos
  rationale: Mantém a imagem de cercar ou envolver expressa por περιβάλλω, enquanto 'maus-tratos' comunica com clareza os abusos ou ultrajes de αἰκίαι.
