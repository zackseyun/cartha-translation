base_translation:
  language: en
  yaml_path: translation/deuterocanon/3_maccabees/006/028.yaml
  text: Release the sons of the almighty[a], heavenly, living God[b], who from the time of our ancestors until now has brought unimpeded stability with glory to our affairs.
translation:
  language: pt
  text: Libertem os filhos do Deus todo-poderoso, celestial e vivo[a], que, desde o tempo de nossos antepassados até agora, tem proporcionado estabilidade sem impedimentos e com glória aos nossos assuntos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego acumula os títulos aplicados a Deus: “todo-poderoso, celestial e vivo”.'
    reason: A nota preserva a forma compacta e algo ambígua da sequência de descritores no original.
  - marker: b
    text: “Estabilidade sem impedimentos” também pode ser traduzido como “segurança sem obstáculos” ou “prosperidade constante”; “nossos assuntos” pode incluir os negócios ou a situação do reino.
    reason: A nota registra a amplitude semântica de ἀπαραπόδιστον εὐστάθειαν e πράγματα sem estreitar o texto principal.
lexical_decisions:
- source_word: ἀπολύσατε
  choice: Libertem
  rationale: Imperativo plural que ordena a soltura imediata; é direto e natural em português.
- source_word: τοὺς υἱοὺς
  choice: os filhos
  rationale: Mantém o substantivo masculino explícito do grego, sem neutralizá-lo como “filhos e filhas” ou “descendentes”.
- source_word: τοῦ παντοκράτορος
  choice: todo-poderoso
  rationale: Equivalente português consagrado do título divino παντοκράτωρ, aqui em função adjetiva.
- source_word: ἐπουρανίου
  choice: celestial
  rationale: Preserva como adjetivo um dos descritores coordenados de Deus e evita que “do céu” pareça modificar apenas o título anterior.
- source_word: θεοῦ ζῶντος
  choice: Deus ... vivo
  rationale: Conserva a expressão bíblica e a força teológica do Deus que vive.
- source_word: ἀφʼ ἡμετέρων μέχρι τοῦ νῦν προγόνων
  choice: desde o tempo de nossos antepassados até agora
  rationale: Explicita de modo idiomático a continuidade temporal comprimida na construção grega.
- source_word: ἀπαραπόδιστον εὐστάθειαν
  choice: estabilidade sem impedimentos
  rationale: Mantém tanto a ideia central de firmeza e estabilidade quanto a ausência de obstáculos, sem restringi-la a prosperidade material.
- source_word: μετὰ δόξης
  choice: com glória
  rationale: Retém a construção preposicional e sua ambiguidade entre glória, honra e esplendor.
- source_word: προφέρει
  choice: tem proporcionado
  rationale: Expressa uma ação benéfica contínua desde os antepassados até o presente, sem impor a imagem mais específica de concessão jurídica.
- source_word: τοῖς ἡμετέροις πράγμασιν
  choice: aos nossos assuntos
  rationale: Preserva a amplitude de πράγματα, que pode abranger negócios, circunstâncias e assuntos públicos, sem estreitar para “reino” ou “Estado”.
theological_decisions:
- issue: Sequência de títulos divinos παντοκράτορος ἐπουρανίου θεοῦ ζῶντος
  choice: do Deus todo-poderoso, celestial e vivo
  alternative: do Deus todo-poderoso do céu, o Deus vivo
  rationale: Preserva os três descritores aplicados a Deus e reproduz a acumulação solene do grego em português natural, sem criar duas designações divinas separadas.
- issue: Termo filial masculino υἱούς
  choice: filhos
  alternative: descendentes
  rationale: O grego emprega explicitamente o masculino plural; a tradução conserva essa forma sem determinar além do texto se o grupo incluía ou não mulheres.
- issue: Natureza do benefício divino em εὐστάθειαν
  choice: estabilidade
  alternative: segurança ou prosperidade
  rationale: “Estabilidade” preserva o núcleo semântico político e circunstancial e evita interpretar o benefício necessariamente como riqueza ou êxito material.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a solenidade da proclamação, mas evita arcaísmos; as notas registram ambiguidades lexicais genuínas.
