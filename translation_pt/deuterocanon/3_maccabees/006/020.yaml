  text: And even the king’s body became seized with shuddering[b][a], and his heavy-hearted boldness was overcome by forgetfulness.
translation:
  language: pt
  text: Até o corpo do rei foi tomado de tremores, e o esquecimento[a] se apoderou de sua audácia sombria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a confusão”. A palavra grega significa literalmente “esquecimento”, mas, neste contexto, pode descrever uma desorientação mental súbita que desfez a determinação do rei.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida como “atrevimento obstinado”, “insolência sombria” ou “audácia de ânimo pesado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόφρικον
  choice: tomado de tremores
  rationale: Expressa a reação física intensa de estremecer ou arrepiar-se de pavor, sem reduzi-la a um medo meramente interior.
- source_word: σῶμα
  choice: corpo
  rationale: Mantém a referência grega explícita ao corpo do rei e, assim, o destaque dado à manifestação física.
- source_word: λήθη
  choice: esquecimento
  rationale: É o sentido lexical direto do substantivo; a nota registra que, no contexto, ele também pode indicar desorientação ou confusão mental súbita.
- source_word: θράσος
  choice: audácia
  rationale: O termo designa ousadia com matiz frequentemente negativo, adequado à presunção arrogante do rei.
- source_word: βαρύθυμον
  choice: sombria
  rationale: Comunica o temperamento pesado, austero ou sinistro sugerido pelo composto grego, de modo natural em português, sem transformá-lo simplesmente em obstinação.
- source_word: ἔλαβεν
  choice: se apoderou de
  rationale: Preserva a estrutura ativa em que λήθη é o sujeito que toma ou domina a audácia do rei, com formulação idiomática em português.
