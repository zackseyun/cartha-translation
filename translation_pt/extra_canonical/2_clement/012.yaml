base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/012.yaml
  text: 'Therefore let us await the kingdom of God betimes in love and righteousness, since we do not know the day of God’s appearing.


    For the Lord himself, being asked by a certain person when his kingdom would come, said, “When the two shall be one, and the outside as the inside, and the male with the female, neither male nor female.”


    Now the two are one when we speak truth among ourselves, and in two bodies there shall be one soul, without dissimulation.


    And by the outside as the inside he means this: by the inside he means the soul, and by the outside the body. Therefore, in like manner as the body appears, so also let your soul be manifest by its good works.


    And by the male with the female, neither male nor female, he means this: that a brother seeing a sister should have no thought of her as a female, and that a sister seeing a brother should have no thought of him as a male.


    “These things, if you do,” he says, “the kingdom of my Father shall come.”'
translation:
  language: pt
  text: '12 Portanto, aguardemos a cada momento o reino de Deus, em amor e justiça, pois não sabemos o dia da manifestação de Deus.


    Pois o próprio Senhor, quando alguém lhe perguntou quando viria o seu reino, disse: “Quando os dois forem um, o exterior for como o interior, e o masculino estiver com o feminino, não havendo nem masculino nem feminino”.[a]


    Ora, os dois são um quando falamos a verdade uns com os outros e, em dois corpos, há uma só alma, sem fingimento.


    E “o exterior como o interior” significa isto: o interior é a alma, e o exterior, o corpo. Portanto, assim como o seu corpo é visível, também a sua alma se torne visível por meio de suas boas obras.


    E “o masculino com o feminino, não havendo nem masculino nem feminino” significa isto: que um irmão, ao ver uma irmã, não pense nela como mulher, e que uma irmã, ao ver um irmão, não pense nele como homem.


    “Se vocês fizerem essas coisas”, diz ele, “o reino de meu Pai virá”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este dito atribuído ao Senhor não aparece nessa forma nos evangelhos canônicos; também é conhecido por antigas tradições cristãs associadas ao Evangelho dos Egípcios.
    reason: Ajuda o leitor a reconhecer a origem tradicional e não canônica da citação sem harmonizá-la nem desqualificá-la.
lexical_decisions:
- source_word: καθ’ ὥραν (presumptive Greek behind “betimes”)
  choice: a cada momento
  rationale: Conserva a ideia de expectativa contínua sugerida pela tradição grega, evitando o arcaísmo e a ambiguidade do inglês “betimes”.
- source_word: ἐπιφάνεια / “appearing”
  choice: manifestação
  rationale: Termo natural e digno que preserva o sentido de aparecimento ou revelação divina sem especificar além do texto.
- source_word: τὸ ἔξωθεν / τὸ ἔσωθεν
  choice: o exterior / o interior
  rationale: Mantém o paralelismo enigmático do dito e permite que a explicação subsequente identifique corpo e alma.
- source_word: ἄρσεν / θῆλυ
  choice: masculino / feminino
  rationale: Preserva a formulação categorial e incomum do dito. Na explicação concreta, “homem” e “mulher” soam mais naturais em português.
- source_word: ἀνυπόκριτος / “without dissimulation”
  choice: sem fingimento
  rationale: Expressa com clareza moderna a ausência de hipocrisia ou duplicidade, sem perder a força ética do termo.
theological_decisions:
- issue: Caráter incomum do dito atribuído ao Senhor
  choice: Preservar a formulação e a interpretação oferecida pelo próprio escrito
  alternative: Harmonizar o dito com passagens dos evangelhos canônicos ou explicá-lo segundo uma doutrina posterior
  rationale: O texto apresenta uma tradição própria e depois a interpreta; a tradução não deve apagar sua estranheza nem impor uma leitura denominacional.
- issue: “Nem masculino nem feminino”
  choice: Manter a tensão literal do dito e a explicação ética do autor
  alternative: Interpretar explicitamente como abolição ontológica do sexo, celibato ou mera igualdade social
  rationale: A explicação do escrito se concentra no modo como irmãos e irmãs se veem, mas não autoriza a tradução a resolver todas as implicações da frase.
- issue: Vinda do reino
  choice: “o reino de meu Pai virá”
  alternative: “vocês farão vir o reino” ou uma formulação escatológica ampliada
  rationale: Mantém a relação condicional e a voz do dito sem definir mecanicamente a causalidade entre as obras e a vinda do reino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Os paralelismos e as expressões deliberadamente enigmáticas foram conservados. Como o material fornecido informa que a revisão direta do grego ainda está pendente, escolhas pontuais — sobretudo “a cada momento” — devem ser verificadas na etapa de crítica textual e revisão da língua-fonte.
