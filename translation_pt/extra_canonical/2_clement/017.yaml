  yaml_path: translation/extra_canonical/2_clement/017.yaml
  text: 'Therefore, let us repent with our whole heart, so that none of us perishes along the way. For if we have received commands to make it our business to draw people away from idols and instruct them, how much more wrong is it for a soul that already knows God to perish!


    Therefore, let us help one another, so that we may also lead the weak upward toward what is good, so that we may all be saved. And let us convert and admonish one another.


    Let us not think that we need to pay attention and believe only now. When we have gone home, let us remember the commandments of the Lord and not allow ourselves to be dragged in the other direction by our worldly desires. Instead, let us come here more frequently and strive to advance in the commandments of the Lord, so that, all having the same mind, we may be gathered together into life.


    For the Lord said, “I come to gather together all the nations, tribes, and languages.” Here he speaks about the day of his appearing, when he will come and redeem us, each person according to his works.


    And the unbelievers will see his glory and his power, and they will be amazed when they see the kingdom of the world given to Jesus. They will say, “Woe to us, for you wast, and we did not know it or believe, and we did not obey the presbyters when they told us about our salvation.” And “Their worm will not die, and their fire will not be quenched, and they will be a spectacle to all flesh.”


    He speaks about that day of judgment, when people will see those among us who live ungodly lives and have dealt falsely with the commandments of Jesus Christ.


    But when the righteous—who have done good, endured torments, and hated the pleasures of the soul—see those who have done wrong and denied Jesus by their words or their deeds being punished with severe torments in unquenchable fire, they will give glory to God and say, “There will be hope for the one who has served God with his whole heart.”'
translation:
  language: pt
  text: '17 Portanto, arrependamo-nos de todo o coração, para que nenhum de nós pereça pelo caminho. Pois, se recebemos ordens de nos empenhar em afastar as pessoas dos ídolos e instruí-las, quanto mais errado é deixar perecer uma alma que já conhece a Deus!


    Portanto, ajudemo-nos uns aos outros, para que também condu­zamos os fracos para o alto, em direção ao bem, a fim de que todos sejamos salvos. Convertamo-nos e admoestemo-nos uns aos outros.


    Não pensemos que devemos prestar atenção e crer somente agora. Depois de voltarmos para casa, lembremo-nos dos mandamentos do Senhor e não permitamos que os desejos mundanos nos arrastem para o outro caminho. Pelo contrário, venhamos aqui com mais frequência e nos esforcemos para avançar nos mandamentos do Senhor, a fim de que, tendo todos o mesmo modo de pensar, sejamos reunidos para a vida.


    Pois o Senhor disse: “Venho reunir todas as nações, tribos e línguas”.[a] Ele fala aqui do dia de sua manifestação, quando virá e nos redimirá, retribuindo a cada um segundo as suas obras.[b]


    Os que não creem verão sua glória e seu poder e ficarão espantados ao verem o reino do mundo entregue a Jesus. Dirão: “Ai de nós! Tu existias, e nós não o sabíamos, não cremos e não obedecemos aos presbíteros quando nos falavam de nossa salvação”. E: “O verme deles não morrerá, e o fogo deles não se apagará; eles servirão de espetáculo a toda a humanidade”.[c]


    Ele fala daquele dia do juízo, quando as pessoas verão aqueles dentre nós que vivem de modo ímpio e agem de maneira desleal para com os mandamentos de Jesus Cristo.


    Mas os justos, que praticaram o bem, suportaram tormentos e odiaram os prazeres da alma,[d] ao verem os que fizeram o mal e negaram Jesus por palavras ou por atos serem castigados com tormentos severos no fogo inextinguível, darão glória a Deus e dirão: “Haverá esperança para aquele que serviu a Deus de todo o coração”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação remete a Isaías 66:18 e reúne, em forma de citação, “nações, tribos e línguas”.
    reason: Identificar a provável alusão bíblica sem forçar identidade verbal com uma versão específica.
  - marker: b
    text: A expressão “segundo as suas obras” pode ligar-se à vinda, à redenção ou à retribuição no juízo. A tradução explicita a ideia de retribuição, mas não define a relação teológica entre obras e redenção.
    reason: Sinalizar uma ambiguidade sintática e teológica importante, sobretudo porque a revisão direta do grego está pendente.
  - marker: c
    text: A linguagem combina Isaías 66:24 com a expectativa do juízo final. “Toda a humanidade” traduz literalmente a ideia idiomática de “toda carne”.
    reason: Explicar a alusão e uma equivalência idiomática relevante.
  - marker: d
    text: “Prazeres da alma” foi mantido por refletir o testemunho disponível; a expressão pode referir-se a desejos interiores ou prazeres egoístas, mas o sentido exato requer conferência do grego.
    reason: Preservar a ambiguidade lexical em vez de impor uma interpretação ascética ou antropológica.
lexical_decisions:
- source_word: repent
  choice: arrependamo-nos
  rationale: Mantém o chamado moral e religioso à mudança sem reduzir o termo a mero remorso.
- source_word: convert
  choice: convertamo-nos
  rationale: Preserva a distinção do testemunho entre arrependimento e voltar-se ou converter-se, embora o grego ainda precise ser conferido.
- source_word: presbyters
  choice: presbíteros
  rationale: Conserva o título antigo sem substituí-lo por uma estrutura eclesiástica denominacional moderna.
- source_word: appearing
  choice: manifestação
  rationale: Expressa uma aparição pública e escatológica em português natural e digno.
- source_word: pleasures of the soul
  choice: prazeres da alma
  rationale: Retém a formulação antropológica potencialmente ambígua do testemunho, sem interpretá-la como prazeres físicos ou pecaminosos em geral.
theological_decisions:
- issue: Relação entre redenção, obras e juízo
  choice: “nos redimirá, retribuindo a cada um segundo as suas obras”
  alternative: “nos redimirá, cada um segundo as suas obras”
  rationale: Torna legível a relação sintática sugerida pelo testemunho sem definir se as obras são causa, critério ou evidência da redenção; a ambiguidade teológica permanece.
- issue: Exortação à salvação comunitária
  choice: “a fim de que todos sejamos salvos”
  alternative: “para que possamos salvar a todos”
  rationale: Segue o testemunho recebido, no qual o sujeito coletivo é também beneficiário da salvação, evitando atribuir aos exortadores poder salvífico autônomo.
- issue: Negar Jesus por palavras ou atos
  choice: Preservada literalmente
  alternative: Interpretar a negação apenas como apostasia verbal
  rationale: Mantém a tensão moral do texto, que inclui tanto confissão verbal quanto conduta.
- issue: Esperança para quem serve a Deus
  choice: “Haverá esperança para aquele que serviu a Deus de todo o coração”
  alternative: “Há esperança...”
  rationale: Conserva a orientação futura do testemunho no contexto do juízo, sem harmonizá-la com uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom exortativo e digno. Empregam-se “pessoas” e “humanidade” onde o inglês antigo usa termos masculinos genéricos, sem alterar o alcance universal. “Presbíteros” e “fogo inextinguível” preservam o registro histórico e escatológico. Esta é uma redação provisória baseada no testemunho inglês público fornecido; a revisão direta da tradição manuscrita grega continua necessária. O trecho aparentemente corrompido “while we have departed home” foi entendido, conforme a ponte inglesa auditada e o fluxo do discurso, como contraste entre ouvir na reunião e lembrar em casa.
