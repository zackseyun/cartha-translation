base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/020.yaml
  text: 'Do not let this trouble your minds either: that we see the unrighteous possessing wealth while the servants of God suffer hardship.


    Therefore, let us have faith, brothers and sisters. We are being trained by this present life so that we may be crowned in the life to come.


    No righteous person has quickly reaped the fruit but waits for it.


    For if God had quickly given the righteous their reward, we would immediately have been training ourselves in commerce rather than godliness. We would appear to be righteous, though we were pursuing not what is godly but what is profitable. For this reason, divine judgment overtakes a spirit that is not just and weighs it down with chains.


    To the only invisible God, the Father of truth, who sent to us the Savior and Prince of immortality, through whom he also revealed to us the truth and the heavenly life—to him be the glory forever and ever. Amen.'
translation:
  language: pt
  text: 'Não deixem também que isto perturbe a mente de vocês: vermos os injustos na riqueza, enquanto os servos de Deus passam por dificuldades.


    Portanto, tenhamos fé, irmãos e irmãs. Somos treinados por esta vida presente para sermos coroados na vida futura.


    Nenhuma pessoa justa colhe rapidamente o fruto; antes, espera por ele.


    Pois, se Deus concedesse depressa aos justos a recompensa, logo estaríamos nos exercitando no comércio, e não na piedade. Pareceríamos justos, embora buscássemos não o que agrada a Deus, mas o que traz lucro. Por essa razão, o juízo divino alcança o espírito que não é justo e o sobrecarrega de correntes.


    Ao único Deus invisível, o Pai da verdade, que nos enviou o Salvador e Príncipe da imortalidade, por meio de quem também nos revelou a verdade e a vida celestial — a ele seja a glória para todo o sempre. Amém.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: straitened
  choice: passam por dificuldades
  rationale: Expressa de modo natural a condição de aflição ou privação, sem restringi-la indevidamente à pobreza material.
- source_word: trained
  choice: treinados / nos exercitando
  rationale: Preserva a imagem de disciplina e preparação presente no testemunho, com formas idiomáticas adequadas aos dois contextos.
- source_word: commerce
  choice: comércio
  rationale: Mantém a metáfora de uma prática religiosa motivada por troca e vantagem, em contraste com a piedade.
- source_word: godliness / godly
  choice: piedade / o que agrada a Deus
  rationale: ‘Piedade’ é digna e tradicional; no segundo uso, a formulação explicita em português corrente o sentido ético-religioso sem introduzir uma doutrina específica.
- source_word: Prince of immortality
  choice: Príncipe da imortalidade
  rationale: Conserva o título elevado e sua possível amplitude sem o reduzir a ‘autor’ ou ‘originador’.
theological_decisions:
- issue: A demora da recompensa dos justos
  choice: Preservar a recompensa futura e o treinamento na vida presente
  alternative: Apresentar a prosperidade atual como recompensa normal da justiça
  rationale: O argumento contrasta explicitamente as dificuldades presentes com a futura coroação e adverte contra uma piedade orientada pelo lucro.
- issue: Referente de ‘spirit that is not just’
  choice: o espírito que não é justo
  alternative: a pessoa injusta
  rationale: Mantém a formulação antropológica do testemunho e evita decidir se ‘espírito’ significa a disposição interior ou a pessoa inteira.
- issue: Agente da revelação em ‘through whom’
  choice: por meio de quem também nos revelou
  alternative: por meio de quem também foi revelada a nós
  rationale: Mantém Deus como sujeito mais provável no testemunho fornecido, sem ampliar o conteúdo cristológico além da evidência disponível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação é provisória porque a revisão direta do grego ainda está pendente; por isso, preserva imagens e ambiguidades relevantes do testemunho inglês em vez de reconstruir detalhes gregos não fornecidos.
