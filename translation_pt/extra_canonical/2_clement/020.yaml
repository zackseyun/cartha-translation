    Nenhuma pessoa justa colhe rapidamente o fruto, mas espera por ele.


    Pois, se Deus concedesse depressa aos justos a recompensa, logo estaríamos nos exercitando no comércio, e não na piedade. Pareceríamos justos, embora buscássemos não o que é próprio da piedade, mas o que traz lucro. Por essa razão, o juízo divino alcança o espírito que não é justo e o sobrecarrega de correntes.


