review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido e preserva adequadamente o contraste entre a aflição presente e a recompensa futura, bem como a linguagem cautelosa sobre o «espírito» injusto. Ajustes pontuais são necessários para reproduzir com mais precisão «possessing wealth», a construção introdutória e o contraste entre o que é piedoso e o que é lucrativo. A revisão direta do grego continua pendente.
  naturalness: O registro é geralmente claro e apropriado. Contudo, «vermos os injustos na riqueza» é pouco idiomático, e «nos exercitando no comércio» soa excessivamente literal em português. As revisões tornam o texto mais natural sem reduzir suas imagens ou ambiguidades.
  terminology: «Piedade», «Príncipe da imortalidade», «juízo divino» e «vida celestial» são escolhas adequadas. Em «o que agrada a Deus», o rascunho explicita um pouco além de «godly»; «aquilo que é piedoso» preserva melhor o paralelismo lexical com «piedade» e o caráter genérico da formulação.
  issues:
  - severity: medium
    issue: Construção inicial pouco natural e «na riqueza» impreciso.
    rationale: '«Não deixem também que isto perturbe a mente de vocês: vermos os injustos na riqueza» mistura construções e não expressa naturalmente a ideia de os injustos possuírem riquezas. «Não permitam que isto também volte a perturbá-los: o fato de vermos os injustos possuindo riquezas» conserva o sentido e melhora a fluência.'
  - severity: low
    issue: «Nos exercitando no comércio» é uma combinação pouco idiomática.
    rationale: O testemunho emprega uma metáfora de dedicação/prática em busca de ganho. «Nos dedicando ao comércio» comunica o contraste sem a aspereza da combinação literal.
  - severity: low
    issue: «O que agrada a Deus» torna explícito o referente de «godly».
    rationale: Embora seja semanticamente próximo, substitui o adjetivo ético-religioso por uma formulação relacional mais interpretativa. «Aquilo que é piedoso» mantém melhor a formulação e o paralelismo do texto.
  revised_text: 'Não permitam que isto também volte a perturbá-los: o fato de vermos os injustos possuindo riquezas, enquanto os servos de Deus passam por dificuldades.


    Portanto, tenhamos fé, irmãos e irmãs. Somos treinados por esta vida presente para sermos coroados na vida futura.


    Nenhuma pessoa justa colhe depressa o fruto; antes, espera por ele.


    Pois, se Deus concedesse depressa aos justos a recompensa, logo estaríamos nos dedicando ao comércio, e não à piedade. Pareceríamos justos, embora buscássemos não aquilo que é piedoso, mas o que é lucrativo. Por essa razão, o juízo divino alcança o espírito que não é justo e o sobrecarrega de correntes.


    Ao único Deus invisível, o Pai da verdade, que nos enviou o Salvador e Príncipe da imortalidade, por meio de quem também nos revelou a verdade e a vida celestial — a ele seja a glória para todo o sempre. Amém.'
  revised_footnotes: []
  revision_rationale: Foram feitas somente revisões seguras de idiomaticidade e de precisão semântica em relação ao testemunho inglês. Mantêm-se «espírito», «Príncipe da imortalidade» e a atribuição de «revelou» a Deus, conforme a leitura sintática mais provável do testemunho, sem pretender solucionar questões que dependam da consulta direta à tradição grega.
