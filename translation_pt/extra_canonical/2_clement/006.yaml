  yaml_path: translation/extra_canonical/2_clement/006.yaml
  text: 'But the Lord says, “No servant can serve two masters.” If we desire to serve both God and wealth, it is of no benefit to us.


    For what advantage is there if someone gains the whole world and forfeits his soul?


    Now this age and the age to come are two enemies.


    The one speaks of adultery, defilement, greed, and deceit, but the other bids these things farewell.


    Therefore, we cannot be friends with both. We must bid farewell to one and keep company with the other.


    Let us consider that it is better to hate the things that are here, because they are worthless, short-lived, and perishable, and to love the things that are there, because they are good and imperishable.


    For if we do the will of Christ, we will find rest. But if we do not, then nothing will deliver us from eternal punishment if we disobey his commandments.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel should rise up, they will not deliver their children in the captivity.”


    But if even righteous men such as these cannot deliver their children by their righteous deeds, with what confidence will we enter the kingdom of God if we do not keep our baptism pure and undefiled? Or who will be our advocate unless we are found to have holy and righteous works?'
translation:
  language: pt
  text: 'Mas o Senhor diz: “Nenhum servo pode servir a dois senhores”.[a] Se desejamos servir tanto a Deus quanto às riquezas, isso não nos traz proveito algum.


    Pois que vantagem há em alguém ganhar o mundo inteiro e perder a sua alma?[b]


    Ora, esta era e a era futura são duas inimigas.


    Uma fala de adultério, corrupção, ganância e engano; a outra, porém, despede-se dessas coisas.


    Portanto, não podemos ser amigos de ambas; devemos renunciar a uma e apegar-nos à outra.


    Consideremos que é melhor odiar as coisas que estão aqui, pois são desprezíveis, passageiras e perecíveis, e amar as coisas que estão lá, pois são boas e imperecíveis.


    Pois, se fizermos a vontade de Cristo, encontraremos descanso. Mas, caso contrário, nada nos livrará do castigo eterno, se desobedecermos aos seus mandamentos.


    A Escritura também diz em Ezequiel: “Ainda que Noé, Jó e Daniel se levantassem, não livrariam seus filhos no cativeiro”.[c]


    Mas, se nem mesmo homens justos como esses podem livrar seus filhos por sua justiça, com que confiança entraremos no Reino de Deus, se não conservarmos puro e imaculado o nosso batismo? Ou quem será nosso defensor, a menos que sejamos encontrados com obras santas e justas?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase retoma o ensino de Jesus preservado em Mateus 6:24 e Lucas 16:13.
    reason: Identifica a alusão bíblica explícita sem inseri-la no corpo do texto.
  - marker: b
    text: A pergunta retoma, com pequenas variações, Mateus 16:26; Marcos 8:36; Lucas 9:25.
    reason: Registra a fonte tradicional da citação ou alusão.
  - marker: c
    text: A formulação atribuída a Ezequiel combina livremente elementos de Ezequiel 14:14, 18 e 20. Nesses versículos, a tradição bíblica usual menciona Noé, Daniel e Jó e diz que eles não livrariam filhos nem filhas. A ordem dos nomes e a referência ao cativeiro refletem a forma citada em 2 Clemente.
    reason: Sinaliza as diferenças reais entre a citação patrística e o texto conhecido de Ezequiel, sem corrigir silenciosamente o autor.
lexical_decisions:
- source_word: mammon
  choice: riquezas
  rationale: Expressa em português corrente o sentido de bens materiais ou riqueza personificada, sem conservar um arcaísmo pouco transparente.
- source_word: soul
  choice: alma
  rationale: Mantém a formulação tradicional e a possível amplitude antropológica da expressão recebida.
- source_word: this age / the future
  choice: esta era / a era futura
  rationale: Preserva o contraste escatológico entre a ordem presente e a vindoura, sem reduzi-lo simplesmente a 'mundo' e 'céu'.
- source_word: hold companionship
  choice: manter comunhão
  rationale: Comunica vínculo e participação contínuos, em registro religioso natural, sem tornar a relação meramente social.
- source_word: mean
  choice: desprezíveis
  rationale: Neste contexto, indica baixo valor, não mesquinhez moral; a escolha acompanha o contraste com aquilo que é bom e imperecível.
- source_word: rest
  choice: descanso
  rationale: Conserva a linguagem escatológica aberta do testemunho, sem explicá-la como salvação, céu ou paz.
- source_word: advocate
  choice: defensor
  rationale: Termo claro e digno para quem pleiteia em favor de alguém, sem impor uma identificação teológica não explicitada.
theological_decisions:
- issue: Relação entre obras, batismo e entrada no Reino
  choice: Preservar as afirmações condicionais e exortativas do texto
  alternative: Reformular para harmonizá-las explicitamente com uma doutrina denominacional da justificação ou da segurança da salvação
  rationale: O texto vincula diretamente obediência, obras justas, pureza batismal e confiança para entrar no Reino; a tradução deve manter essa tensão sem comentário doutrinário embutido.
- issue: A vontade de Cristo
  choice: “se fizermos a vontade de Cristo”
  alternative: “se fizermos a vontade de Deus por meio de Cristo”
  rationale: Mantém Cristo como referente direto, conforme o testemunho fornecido, sem expansão interpretativa.
- issue: O contraste entre as duas eras
  choice: Personificar ambas como inimigas e possíveis objetos de amizade
  alternative: Transformar o trecho numa oposição abstrata entre valores terrenos e celestiais
  rationale: A personificação estrutura a retórica do autor e deve permanecer visível.
- issue: Pureza do batismo
  choice: “conservarmos puro e imaculado o nosso batismo”
  alternative: “vivermos de modo fiel à nossa profissão batismal”
  rationale: A alternativa explicaria a metáfora e limitaria seu alcance; a forma escolhida preserva a expressão recebida e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a retórica exortativa, os paralelismos e a linguagem escatológica. A tradução é necessariamente provisória porque o material fornecido identifica apenas um testemunho inglês de domínio público e informa que a revisão direta do grego ainda está pendente.
