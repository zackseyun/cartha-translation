review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho fornecido e preserva adequadamente as imagens e a argumentação. Contudo, “abandonada” na citação antecipa e confunde a distinção do texto entre “desolada” e “abandonada por Deus”; “já” em “já está de pé” acrescenta uma nuance temporal ausente; e a redação da oração sobre as mulheres em trabalho de parto pode indicar com maior clareza que a comparação difícil pertence à própria construção do autor.
  naturalness: O português é claro e moderno. A substituição de “você que é” por vocativos poéticos breves torna a citação mais natural, solene e adequada ao paralelismo profético sem recorrer a arcaísmo. “Coisas que estão de pé” preserva melhor o plural e o contraste metafórico do original.
  terminology: “Desolada”, “simplicidade”, “perecendo” e “firmar” são escolhas adequadas. “Igreja” é mantida como autodesignação comunitária do autor, sem ampliar sua aplicação teológica. A nota sobre a palavra de Jesus deve referir precisamente a forma paralela de Lucas, em vez de atribuir genericamente o acréscimo a testemunhos.
  issues:
  - severity: medium
    issue: “Mulher abandonada” na citação
    rationale: O testemunho distingue a mulher “desolada” da posterior explicação de que o povo parecia “abandonado por Deus”. Traduzir ambos os elementos por “abandonada” reduz essa distinção e introduz antecipadamente a ideia da aplicação.
  - severity: low
    issue: “O que já está de pé”
    rationale: “Já” não corresponde a elemento do testemunho e enfraquece a formulação proverbial e contrastiva do texto.
  - severity: low
    issue: Nota c sobre “ao arrependimento”
    rationale: A formulação com esse complemento está explicitamente em Lucas 5:32; a nota deve identificá-lo como paralelo evangélico, não como uma variação textual não especificada do texto em exame.
  revised_text: '“Alegre-se, ó estéril, você que não deu à luz! Rompa em júbilo e clame em alta voz, você que não sentiu dores de parto, pois os filhos da desolada são mais numerosos do que os daquela que tem marido.”[a] Ao dizer: “Alegre-se, ó estéril, você que não deu à luz”, ele falava de nós, pois nossa Igreja era estéril antes que lhe fossem dados filhos.


    E, ao dizer: “Clame em alta voz, você que não sentiu dores de parto”, ele quis dizer o seguinte: não nos cansemos, como mulheres em trabalho de parto, de oferecer nossas orações a Deus com simplicidade.[b]


    Novamente, ao dizer: “Pois os filhos da desolada são mais numerosos do que os daquela que tem marido”, ele falou assim porque nosso povo parecia desolado e abandonado por Deus. Agora, porém, depois de crermos, tornamo-nos mais numerosos do que aqueles que pareciam ter Deus.


    Outra passagem da Escritura diz: “Não vim chamar os justos, mas os pecadores.”[c]


    Ele quer dizer o seguinte: é justo salvar os que estão perecendo.


    Pois esta é, de fato, uma obra grande e maravilhosa: firmar não as coisas que estão de pé, mas as que estão caindo.


    Assim também Cristo quis salvar aquilo que estava perecendo. E salvou muitos, vindo e chamando-nos quando já estávamos perecendo.'
  revised_footnotes:
  - marker: a
    text: Citação de Isaías 54:1; compare Gálatas 4:27. A redação segue a forma citada pelo autor e pode refletir a tradição grega antiga.
    reason: Identifica a fonte e esclarece, sem alegação excessiva, por que a redação pode não coincidir exatamente com versões traduzidas do texto hebraico.
  - marker: b
    text: A construção é difícil. Também pode ser entendida como uma exortação a não desanimar na apresentação a Deus de orações feitas com simplicidade; a comparação com mulheres em trabalho de parto foi preservada sem harmonização.
    reason: Sinaliza a dificuldade sintática e semântica sem resolver indevidamente a ambiguidade.
  - marker: c
    text: Palavra de Jesus preservada em Mateus 9:13, Marcos 2:17 e Lucas 5:32. Em Lucas 5:32, a formulação inclui “ao arrependimento”.
    reason: Fornece os paralelos e descreve com precisão a diferença de formulação.
  revision_rationale: A revisão preserva o sentido do testemunho de base, melhora a precisão da imagem de Isaías e do contraste “desolada/abandonado por Deus”, elimina um acréscimo temporal e conserva o plural metafórico em “as coisas”. Também torna as notas mais precisas e não interpretativas. A redação da comparação com o trabalho de parto permanece deliberadamente próxima e é explicada em nota, pois a revisão direta do grego ainda está pendente.
