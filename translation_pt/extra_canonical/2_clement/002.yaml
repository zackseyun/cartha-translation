base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/002.yaml
  text: '“Rejoice, you barren woman who never gave birth. Break out and cry aloud, you who were never in labor, for the children of the desolate woman are more numerous than the children of the woman who has a husband.” When he said, “Rejoice, you barren woman who never gave birth,” he was speaking about us, for our church was barren before children were given to her.


    And when he said, “Cry aloud, you who were never in labor,” he meant this: Let us not grow weary, like women in labor, of offering our prayers to God with simplicity.


    Again, when he said, “For the children of the desolate woman are more numerous than those of the woman who has a husband,” he spoke this way because our people seemed desolate and abandoned by God. But now, having believed, we have become more numerous than those who seemed to have God.


    Again, another Scripture says, “I did not come to call the righteous, but sinners.”


    He means this: It is right to save those who are perishing.


    For this truly is a great and marvelous work: to establish not the things that are standing, but the things that are falling.


    So Christ also desired to save the things that were perishing. And he saved many, coming and calling us when we were already perishing.'
translation:
  language: pt
  text: '“Alegre-se, você que é estéril e nunca deu à luz! Exulte e clame em alta voz, você que nunca sentiu dores de parto, pois os filhos da mulher abandonada são mais numerosos do que os daquela que tem marido.”[a] Ao dizer: “Alegre-se, você que é estéril e nunca deu à luz”, ele falava de nós, pois nossa igreja era estéril antes que lhe fossem dados filhos.


    E, ao dizer: “Clame em alta voz, você que nunca sentiu dores de parto”, ele quis dizer o seguinte: não nos cansemos de apresentar nossas orações a Deus com simplicidade, como mulheres que enfrentam as dores do parto.[b]


    Novamente, ao dizer: “Pois os filhos da mulher abandonada são mais numerosos do que os daquela que tem marido”, ele falou assim porque nosso povo parecia desolado e abandonado por Deus. Agora, porém, depois de crermos, tornamo-nos mais numerosos do que aqueles que pareciam ter Deus.


    Outra passagem da Escritura diz: “Não vim chamar os justos, mas os pecadores.”[c]


    Ele quer dizer o seguinte: é justo salvar os que estão perecendo.


    Pois esta é, de fato, uma obra grande e maravilhosa: firmar não o que já está de pé, mas o que está caindo.


    Assim também Cristo quis salvar o que estava perecendo. E salvou muitos, vindo e chamando a nós quando já estávamos perecendo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citação de Isaías 54:1; compare Gálatas 4:27. A redação segue a forma citada pelo autor, que pode refletir a tradição grega antiga.
    reason: Identifica a fonte escriturística e sinaliza que a formulação da citação não precisa coincidir palavra por palavra com traduções modernas do texto hebraico.
  - marker: b
    text: A construção também pode ser entendida como uma exortação a não desanimar ao dirigir a Deus orações sinceras; a comparação com as dores de parto é difícil e foi preservada sem harmonização.
    reason: O testemunho inglês fornecido apresenta uma formulação sintaticamente tensa, e a revisão direta do grego ainda está pendente.
  - marker: c
    text: Citação de uma palavra de Jesus preservada em Mateus 9:13, Marcos 2:17 e Lucas 5:32. Alguns testemunhos acrescentam “ao arrependimento”.
    reason: Fornece a referência e registra uma conhecida variação textual sem inseri-la no corpo da tradução.
lexical_decisions:
- source_word: ἔρημος / desolate (conforme o testemunho fornecido)
  choice: mulher abandonada; desolado
  rationale: Na citação, “mulher abandonada” expressa naturalmente a imagem pessoal; na aplicação ao povo, “desolado e abandonado por Deus” preserva tanto a condição quanto a aparente rejeição.
- source_word: ἁπλότης / simplicity (conforme o testemunho fornecido)
  choice: simplicidade
  rationale: Mantém o sentido ético-devocional de sinceridade e inteireza sem acrescentar uma interpretação denominacional.
- source_word: ἀπόλλυμι / perishing (conforme o testemunho fornecido)
  choice: perecendo
  rationale: Preserva o aspecto contínuo e a tensão entre ruína presente e salvação, sem restringir o termo a morte física ou condenação final.
- source_word: στηρίζειν / establish (conforme o testemunho fornecido)
  choice: firmar
  rationale: Soa natural em português e conserva o contraste metafórico entre aquilo que está de pé e aquilo que está caindo.
theological_decisions:
- issue: Identidade da mulher estéril e abandonada
  choice: Manter a aplicação explícita do autor à “nossa igreja” sem definir uma teologia de substituição.
  alternative: Identificar diretamente a mulher com a Igreja em contraste teológico absoluto com Israel.
  rationale: O texto aplica a profecia à comunidade do autor, mas não exige que a tradução formule uma doutrina mais ampla sobre Israel e a Igreja.
- issue: “Aqueles que pareciam ter Deus”
  choice: Preservar “pareciam ter Deus”.
  alternative: Explicitar o grupo como judeus, Israel ou outro povo religioso.
  rationale: O referente permanece implícito no texto fornecido; nomeá-lo resolveria indevidamente uma ambiguidade histórica e teológica.
- issue: Salvar os que perecem
  choice: Conservar a linguagem de salvação e perdição em sentido amplo.
  alternative: Interpretar exclusivamente como conversão espiritual, resgate moral ou salvação escatológica.
  rationale: O contexto admite sobreposição desses sentidos e não deve ser estreitado na tradução.
- issue: Pronomes divinos na explicação da citação
  choice: Usar “ele” em minúscula.
  alternative: Empregar “Ele” como referência inequívoca a Deus.
  rationale: O antecedente pode ser entendido como a Escritura, Deus ou o locutor profético; a minúscula evita impor uma identificação devocional não marcada.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução usa equivalência ótima: conserva paralelismos e metáforas centrais, mas evita sintaxe arcaica. Como a revisão direta da tradição manuscrita grega está pendente e o material fornecido é um testemunho inglês de domínio público, decisões lexicais gregas são tratadas como provisórias e explicitamente qualificadas.'
