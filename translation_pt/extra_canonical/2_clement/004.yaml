    E não devemos temer as pessoas, mas a Deus.


    Pois, se vocês fizerem essas coisas, o Senhor disse: “Mesmo que vocês estejam reunidos comigo em meu seio,[a] e não cumpram os meus mandamentos, eu os rejeitarei e lhes direi: ‘Afastem-se de mim! Não sei de onde vocês são, vocês que praticam a injustiça.’”'
