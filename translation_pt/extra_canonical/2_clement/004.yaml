review_pass:
  verdict: revise
  source_fidelity: A redação acompanha de perto a testemunha fornecida e preserva adequadamente o contraste entre confissão verbal, prática da justiça e salvação. Contudo, omite na última unidade a cláusula condicional «if ye do these things» («se vocês fizerem essas coisas»), que deve ser mantida, embora sua relação precisa com a citação seguinte seja sintaticamente difícil. A explicitação «que ele é o Senhor» em «confessemos» excede o objeto expresso («confess him») e é desnecessária.
  naturalness: O português é em geral claro e contemporâneo. «Ter solidariedade uns com os outros» comunica melhor o sentido recíproco de fellow-feeling do que «compadecer-se uns dos outros». «Em meu seio» é mais fiel que «junto ao meu peito» e permanece compreensível com a nota.
  terminology: «Senhor», «pratica a justiça», «adultério», «temperantes», «misericordiosos» e «os que praticam a injustiça» mantêm o registro exortativo e os contrastes lexicais do texto. «Confessemos a ele por meio de nossas obras» preserva o objeto direto sem introduzir uma formulação cristológica adicional.
  issues:
  - severity: high
    issue: Omissão de «if ye do these things» na frase que introduz a citação final.
    rationale: A tradução passa diretamente de «Por isso» para «o Senhor disse», eliminando uma cláusula presente na testemunha. Mesmo que a construção resulte tensa em conjunto com a condição interna da citação, a ambiguidade deve ser preservada, não removida.
  - severity: medium
    issue: «Confessemos que ele é o Senhor» explicita conteúdo que o texto não expressa nessa frase.
    rationale: O original/testemunha diz simplesmente «confess him». O contexto inclui o título Senhor, mas acrescentá-lo ao objeto da confissão estreita e interpreta a formulação.
  - severity: low
    issue: «Junto ao meu peito» é uma paráfrase mais livre de «em meu seio».
    rationale: «Em meu seio» preserva a imagem corporal e a formulação tradicional, enquanto a nota pode esclarecer o uso incomum.
  revised_text: '4 Portanto, não nos limitemos a chamá-lo de Senhor, pois isso não nos salvará.


    Pois ele diz: “Nem todo aquele que me diz: ‘Senhor’ será salvo, mas aquele que pratica a justiça.”


    Assim, irmãos, confessemos a ele por meio de nossas obras: amando uns aos outros, não cometendo adultério, não falando mal uns dos outros nem tendo inveja, mas sendo temperantes, misericordiosos e bondosos. Devemos ter solidariedade uns com os outros e não ser gananciosos. Confessemo-lo por meio dessas obras, e não pelo contrário.


    Não devemos temer os seres humanos, mas a Deus.


    Por isso, se vocês fizerem essas coisas, o Senhor disse: “Ainda que estejam reunidos comigo em meu seio,[a] se não cumprirem os meus mandamentos, eu os rejeitarei e lhes direi: ‘Afastem-se de mim! Não sei de onde vocês são, vocês que praticam a injustiça.’”'
  revised_footnotes:
  - marker: a
    text: Literalmente, “em meu seio”. A imagem indica proximidade íntima. A redação desta citação não corresponde exatamente a uma passagem preservada nos Evangelhos canônicos.
    reason: Esclarece a imagem pouco usual sem substituir a expressão literal no texto e informa, de modo comedido, a relação não exata com os Evangelhos canônicos.
  revision_rationale: A revisão restaura a cláusula condicional omitida na introdução da fala do Senhor e conserva a construção difícil tal como atestada, sem tentar harmonizá-la. Também remove uma explicitação interpretativa do objeto de «confessar», melhora a reciprocidade de fellow-feeling e torna «bosom» mais literalmente por «seio».
