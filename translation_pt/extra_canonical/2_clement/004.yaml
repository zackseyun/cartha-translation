base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/004.yaml
  text: 'Therefore, let us not only call him Lord, for this will not save us:


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but the one who does righteousness.”


    So then, brethren, let us confess him by our works: by loving one another, by not committing adultery, nor speaking evil against one another, nor envying, but by being temperate, merciful, and kind. We ought to have fellow-feeling for one another and not be covetous. By these works let us confess him, and not by the contrary.


    And we ought to fear not men but God.


    For this cause, if you do these things, the Lord said, “Though you are gathered together with me in my bosom, if you do not do my commandments, I will cast you away and say to you, ‘Depart from me; I do not know you, whence you are, workers of iniquity.’”'
translation:
  language: pt
  text: '4 Portanto, não nos limitemos a chamá-lo de Senhor, pois isso não nos salvará.


    Pois ele diz: “Nem todo aquele que me diz: ‘Senhor’ será salvo, mas aquele que pratica a justiça.”


    Assim, irmãos, confessemos que ele é o Senhor por meio de nossas obras: amando uns aos outros, não cometendo adultério, não falando mal uns dos outros nem tendo inveja, mas sendo moderados, misericordiosos e bondosos. Devemos nos compadecer uns dos outros e não ser gananciosos. Confessemo-lo por meio dessas obras, e não por meio das obras contrárias.


    Não devemos temer as pessoas, mas a Deus.


    Por isso, o Senhor disse: “Ainda que vocês estejam reunidos comigo junto ao meu peito,[a] se não cumprirem os meus mandamentos, eu os rejeitarei e lhes direi: ‘Afastem-se de mim! Não sei de onde vocês são, vocês que praticam a injustiça.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em meu seio”. A imagem expressa extrema proximidade e acolhimento. A redação desta citação não corresponde exatamente a uma passagem preservada nos Evangelhos canônicos.
    reason: A expressão é incomum em português e a provável citação extracanônica ou forma tradicional combinada requer transparência textual.
lexical_decisions:
- source_word: Lord
  choice: Senhor
  rationale: Mantém o título cristológico tradicional e a ligação verbal com a declaração citada.
- source_word: doeth righteousness
  choice: pratica a justiça
  rationale: Expressa ação habitual e preserva o campo semântico de justiça, sem reduzir a frase a uma noção genérica de bom comportamento.
- source_word: confess Him in our works
  choice: confessemos que ele é o Senhor por meio de nossas obras
  rationale: Torna explícito em português o conteúdo contextual da confissão, isto é, reconhecê-lo como Senhor, e mantém as obras como o meio visível dessa confissão.
- source_word: temperate
  choice: moderados
  rationale: Termo corrente e abrangente para domínio próprio, adequado ao registro exortativo.
- source_word: fellow-feeling
  choice: nos compadecer uns dos outros
  rationale: Comunica solidariedade afetiva e compaixão em linguagem natural.
- source_word: covetous
  choice: gananciosos
  rationale: Representa o desejo ávido de possuir, com clareza para leitores modernos.
- source_word: workers of iniquity
  choice: vocês que praticam a injustiça
  rationale: Preserva o contraste com 'pratica a justiça' e evita uma formulação portuguesa excessivamente arcaica.
theological_decisions:
- issue: Relação entre chamar Jesus de Senhor, obras e salvação
  choice: Preservar a afirmação direta de que a mera confissão verbal não salva e de que é necessário praticar a justiça.
  alternative: Atenuar a frase para dizer apenas que as obras demonstram uma salvação já recebida.
  rationale: O texto formula deliberadamente uma tensão entre profissão verbal, obediência e salvação; a tradução não deve resolvê-la mediante uma estrutura teológica externa.
- issue: Objeto da confissão por meio das obras
  choice: Verter como 'confessemos que ele é o Senhor por meio de nossas obras'.
  alternative: Traduzir literalmente 'confessemo-lo em nossas obras'.
  rationale: O contexto imediato é chamá-lo de Senhor; a explicitação produz português compreensível sem acrescentar uma identidade diferente à confissão.
- issue: Temor devido a Deus em contraste com seres humanos
  choice: 'Traduzir de modo categórico: ''Não devemos temer as pessoas, mas a Deus.'''
  alternative: Interpretar 'temer' como reverenciar ou prestar culto.
  rationale: A testemunha permite o sentido amplo de temor; convém preservar esse sentido sem estreitá-lo a uma categoria doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitaram-se arcaísmos como “concupiscentes” e “obreiros da iniquidade”. Como o material fornecido declara que a revisão direta do grego ainda está pendente, esta redação deve ser tratada como provisória e baseada na testemunha inglesa pública, consultada criticamente.
