base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/001.yaml
  text: 'Brethren, we ought to think of Jesus Christ as of God, as the Judge of the living and the dead.


    And we ought not to think mean things of our Salvation; for when we think mean things of Him, we also expect to receive mean things. And those who listen as concerning mean things do wrong; and we ourselves do wrong, not knowing whence and by whom and unto what place we were called, and how many things Jesus Christ endured to suffer for our sakes.


    What recompense, then, shall we give to Him? Or what fruit worthy of His own gift to us? And how many mercies do we owe to Him!


    For He bestowed the light upon us; He spoke to us as a father to his sons; He saved us when we were perishing.


    What praise, then, shall we give to Him? Or what payment of recompense for those things which we received?


    We were maimed in our understanding, and worshipped stocks and stones and gold and silver and bronze, the works of men; and our whole life was nothing else but death. While we were thus wrapped in darkness and oppressed with this thick mist in our vision, we recovered our sight, putting off by His will the cloud in which we were wrapped.


    For He had mercy on us and, in His compassion, saved us, having beheld in us much error and perdition, even when we had no hope of salvation except that which came from Him.


    For He called us when we were not, and from not being He willed us to be.'
translation:
  language: pt
  text: 'Irmãos, devemos pensar a respeito de Jesus Cristo como a respeito de Deus, como o Juiz dos vivos e dos mortos.


    E não devemos pensar de modo mesquinho sobre a nossa salvação; pois, quando pensamos de modo mesquinho a respeito dele, também esperamos receber pouco. E os que escutam como se o assunto fosse de pouca importância pecam; nós mesmos também pecamos, por não sabermos de onde, por quem e para que lugar fomos chamados, nem quantas coisas Jesus Cristo suportou sofrer por nossa causa.


    Que retribuição, então, lhe daremos? Ou que fruto digno da dádiva que ele mesmo nos concedeu? E quantas misericórdias lhe devemos!


    Pois ele nos concedeu a luz; falou conosco como um pai fala com seus filhos; salvou-nos quando estávamos perecendo.


    Que louvor, então, lhe daremos? Ou que pagamento em retribuição por aquilo que recebemos?


    Tínhamos o entendimento mutilado e adorávamos madeira, pedra, ouro, prata e bronze — obras humanas —, e toda a nossa vida não era outra coisa senão morte. Enquanto estávamos assim envolvidos em trevas e, em nossa visão, oprimidos por essa névoa espessa, recuperamos a vista, pois, por sua vontade, nos despimos da nuvem em que estávamos envolvidos.


    Pois ele teve misericórdia de nós e, movido de compaixão, nos salvou, vendo em nós muito erro e perdição, quando não tínhamos nenhuma esperança de salvação, a não ser a que vinha dele.


    Pois ele nos chamou quando não éramos e, quando não existíamos, quis que viéssemos a existir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase pode evocar tanto a criação — Deus trazendo à existência o que não existia — quanto o chamado pelo qual pessoas sem identidade como povo passam a existir como comunidade de Deus. O texto não precisa ser limitado a apenas um desses sentidos.
    reason: Preservar a ambiguidade teológica da declaração final sem impor uma leitura denominacional.
lexical_decisions:
- source_word: Brethren
  choice: Irmãos
  rationale: Forma tradicional, digna e amplamente compreensível para a interpelação comunitária; no contexto antigo pode abranger toda a comunidade.
- source_word: think mean things
  choice: pensar de modo mesquinho / como se o assunto fosse de pouca importância
  rationale: Preserva a ideia de estimar abaixo do devido, variando a formulação para manter naturalidade nos dois contextos.
- source_word: quick and dead
  choice: vivos e mortos
  rationale: Equivalente português corrente da fórmula antiga que designa vivos e falecidos.
- source_word: stocks and stones
  choice: madeira, pedra
  rationale: Expressa os materiais dos ídolos sem usar o pouco natural 'troncos' e mantém o paralelismo com os metais.
- source_word: maimed in our understanding
  choice: Tínhamos o entendimento mutilado
  rationale: Mantém a imagem forte de incapacidade ou dano mental, sem suavizá-la para mera ignorância.
- source_word: from not being He willed us to be
  choice: quando não existíamos, quis que viéssemos a existir
  rationale: Conserva a linguagem ontológica e sua possível tensão entre criação e chamado para uma nova condição.
theological_decisions:
- issue: Identificação de Jesus Cristo com Deus e com o Juiz
  choice: “como a respeito de Deus, como o Juiz dos vivos e dos mortos”
  alternative: “como Deus e como Juiz dos vivos e dos mortos”
  rationale: Mantém a construção comparativa repetida no testemunho fornecido e não qualifica nem enfraquece sua elevada cristologia.
- issue: Referente de “dele” no parágrafo sobre a salvação
  choice: Mantido o pronome “dele”
  alternative: Substituir por “de Cristo” ou “da salvação”
  rationale: Preserva a ligação provável com Jesus Cristo e evita resolver explicitamente uma referência cuja forma depende da tradição grega a ser revista.
- issue: Sentido do chamado dos que “não eram”
  choice: Formulação existencial mantida, com nota de ambiguidade
  alternative: Interpretar como passagem da inexistência física à criação ou da condição pagã à existência como povo de Deus
  rationale: O contexto permite ressonâncias de criação e de constituição salvífica/comunitária; a tradução não escolhe silenciosamente uma delas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e alguma solenidade apropriada a uma antiga exortação cristã. O rascunho parte do testemunho inglês público fornecido, pois a revisão direta do grego está indicada como pendente; por isso, evita reconstruções lexicais gregas não comprovadas.
