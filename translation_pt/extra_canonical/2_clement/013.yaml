base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/013.yaml
  text: 'Therefore, brothers and sisters, let us repent at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
translation:
  language: pt
  text: '**2 Clemente 13**


    Portanto, irmãos e irmãs, arrependamo-nos sem demora. Sejamos lúcidos para o bem, pois estamos cheios de muita insensatez e maldade. Apaguemos de nós os pecados anteriores e não sejamos encontrados buscando agradar às pessoas. Não procuremos agradar somente uns aos outros, mas também aos de fora, por meio de nossa justiça, para que o Nome não seja blasfemado por nossa causa.


    Pois o Senhor diz: “De todas as maneiras, meu Nome é blasfemado entre todos os gentios”; e também: “Ai daquele por cuja causa meu Nome é blasfemado”. Como é blasfemado? Porque vocês não fazem as coisas que eu desejo.


    Pois, quando os gentios ouvem de nossa boca os oráculos de Deus, admiram-se da beleza e da grandeza deles. Então, quando descobrem que nossas obras não são dignas das palavras que proferimos, logo se voltam para a blasfêmia, dizendo que é uma história vã e um engano.


    Pois, quando ouvem de nós que Deus diz: “Não há mérito em amar os que amam vocês; mas há mérito em amar seus inimigos e os que odeiam vocês”, ao ouvirem essas coisas, digo eu, admiram-se de sua extraordinária bondade. Mas, quando veem que não apenas deixamos de amar os que nos odeiam, mas nem sequer amamos os que nos amam,[a] zombam de nós, e o Nome é blasfemado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A testemunha inglesa fornecida está truncada neste ponto (“não apenas não amamos...”); a frase foi completada conforme a redação grega usual: “não apenas deixamos de amar os que nos odeiam, mas nem sequer amamos os que nos amam”.'
    reason: Assinala com transparência a restauração apoiada pela tradição grega, sem ocultar a lacuna da testemunha inglesa fornecida.
lexical_decisions:
- source_word: ἀδελφοί / brethren
  choice: irmãos e irmãs
  rationale: Expressa de modo natural o provável alcance comunitário do vocativo, sem restringi-lo aos homens.
- source_word: νήφω / be sober
  choice: estejamos atentos
  rationale: Transmite a ideia ética de lucidez, vigilância e domínio de si sem sugerir apenas abstinência de álcool.
- source_word: ἀνθρωπάρεσκοι / men pleasers
  choice: buscando agradar às pessoas
  rationale: Evita um substantivo artificial em português e conserva a crítica à busca de aprovação humana.
- source_word: τὸ ὄνομα / the Name
  choice: o Nome
  rationale: Mantém a forma reverencial e absoluta do texto, que remete ao nome de Deus sem explicitá-lo além do original.
- source_word: τὰ λόγια τοῦ θεοῦ / the oracles of God
  choice: os oráculos de Deus
  rationale: Preserva o sentido de declarações divinas autorizadas e o registro solene da passagem.
- source_word: χάρις / thank, credit
  choice: mérito
  rationale: No contexto da máxima ética, indica aquilo que é digno de aprovação ou reconhecimento; evita 'graça', que poderia introduzir aqui uma leitura teológica mais específica.
- source_word: ἔθνη / Gentiles
  choice: nações
  rationale: Conserva o sentido básico e coletivo do termo, abrangendo os povos de fora da comunidade, sem impor terminologia religiosa especializada.
theological_decisions:
- issue: Identidade do “Nome”
  choice: manter “o Nome” sem explicitação
  alternative: traduzir “o nome de Deus” ou inserir um nome divino específico
  rationale: O texto emprega a designação absoluta e reverencial; explicitá-la resolveria algo que o autor deixa implícito.
- issue: Natureza das citações atribuídas ao Senhor e a Deus
  choice: apresentá-las como citações no fluxo do argumento, sem referências bíblicas acrescentadas
  alternative: identificá-las ou harmonizá-las explicitamente com Isaías, Ezequiel ou os Evangelhos
  rationale: A forma da obra combina ou adapta tradições escriturísticas; a tradução não deve impor uma identificação ou harmonização no corpo do texto.
- issue: χάρις na instrução sobre amar inimigos
  choice: traduzir como “mérito” em sentido de aprovação
  alternative: “graça”, “recompensa” ou “crédito”
  rationale: O contraste trata do valor moral reconhecível da conduta, sem exigir uma afirmação técnica sobre mérito salvífico ou graça.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi moderadamente simplificada, mas conservaram-se a exortação coletiva, as repetições retóricas, a linguagem de blasfêmia e a designação reverencial “o Nome”. A tradução dá prioridade à redação grega usual onde a testemunha inglesa fornecida está manifestamente truncada, registrando isso em nota.
