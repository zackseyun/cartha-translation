  source_fidelity: 'O texto português acompanha com precisão o testemunho inglês fornecido: preserva a insistência em “carne”, as perguntas retóricas sobre salvação e recuperação da visão, a formulação deliberadamente pouco específica de “virão na carne”, a sequência “primeiro era espírito e depois se fez carne”, e a metáfora da retribuição explicitada como arrependimento. A revisão direta do grego permanece pendente, conforme indicado no próprio material de base; não há, no entanto, divergência identificável em relação ao testemunho disponível.'
  naturalness: O português é moderno, claro e adequado a leitores brasileiros e internacionais. “Carne”, “retribuição”, “coloquemo-nos” e “ofereçamos-lhe” mantêm um registro exortativo digno sem artificialidade. As perguntas “Em que vocês foram salvos?” e “Em que recuperaram a visão?” reproduzem apropriadamente a construção retórica do texto.
  terminology: “Carne” preserva o vocabulário argumentativo central; “arrependimento de coração sincero” comunica bem a resposta requerida; “filhos” é uma tradução natural e inclusiva de “sons” no uso português contemporâneo. As notas evitam transformar as formulações cristológicas e escatológicas do escrito em definições doutrinárias externas.
