base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/009.yaml
  text: 'Let none of you say that this flesh is not judged and does not rise again.


    Understand this: In what were you saved? In what did you recover your sight, if not in this flesh?


    Therefore, we ought to guard the flesh as a temple of God.


    For just as you were called in the flesh, you will also come in the flesh.


    If Christ the Lord, who saved us, was first spirit and then became flesh, and called us in that way, in the same way we also will receive our reward in this flesh.


    Therefore, let us love one another, so that we all may enter the kingdom of God.


    While we have time to be healed, let us place ourselves in the hands of God the physician, giving him something in return.


    What shall we give in return? Repentance from a sincere heart.


    For he discerns all things beforehand and knows what is in our hearts.


    Therefore, let us give him eternal praise, not only from our lips but also from our hearts, so that he may receive us as sons.


    For the Lord also said, “These are my brothers, those who do the will of my Father.”'
translation:
  language: pt
  text: 'Que nenhum de vocês diga que esta carne não é julgada nem ressuscita.


    Entendam: em que vocês foram salvos? Em que recuperaram a visão, senão nesta carne?


    Portanto, devemos guardar a carne como templo de Deus.


    Pois, assim como vocês foram chamados na carne, também virão na carne.[a]


    Se Cristo, o Senhor que nos salvou, primeiro era espírito e depois se fez carne, e assim nos chamou, do mesmo modo também nós receberemos nossa recompensa nesta carne.[b]


    Portanto, amemos uns aos outros, para que todos nós entremos no reino de Deus.


    Enquanto temos tempo para ser curados, coloquemo-nos nas mãos de Deus, o médico, dando-lhe algo em retribuição.


    Que retribuição? Arrependimento de coração sincero.


    Pois ele discerne todas as coisas de antemão e sabe o que há em nosso coração.


    Portanto, ofereçamos-lhe louvor eterno, não apenas com os lábios, mas também com o coração, para que ele nos receba como filhos.


    Pois o Senhor também disse: “Estes são meus irmãos: os que fazem a vontade de meu Pai.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Virão na carne” traduz literalmente a formulação do testemunho disponível. A expressão pode apontar para a ressurreição e a apresentação diante de Deus, mas o texto não explicita aqui o referente.
    reason: Preservar uma ambiguidade relevante sem tornar a frase obscura ao leitor.
  - marker: b
    text: A sequência “primeiro era espírito e depois se fez carne” reproduz a argumentação deste escrito. Ela não deve ser usada isoladamente para definir toda a cristologia do autor; a revisão direta do grego ainda está pendente.
    reason: Sinalizar a tensão teológica e a limitação documental da base de tradução.
  - marker: c
    text: Compare Mateus 12:50; Marcos 3:35; Lucas 8:21. A redação aqui corresponde à forma citada em 2 Clemente.
    reason: Identificar o paralelo evangélico sem harmonizar o texto.
lexical_decisions:
- source_word: flesh
  choice: carne
  rationale: Mantém o termo corporal e teologicamente carregado do testemunho, sem o suavizar para “corpo”.
- source_word: guard
  choice: guardar
  rationale: Preserva a ideia de cuidar e proteger a carne como templo de Deus.
- source_word: come
  choice: virão
  rationale: Conserva a formulação do testemunho, cuja referência exata permanece pouco explícita.
- source_word: recompense / something in return
  choice: algo em retribuição / retribuição
  rationale: Expressa a imagem retórica de dar uma resposta a Deus, esclarecida imediatamente como arrependimento, sem sugerir pagamento meritório.
- source_word: repentance
  choice: arrependimento
  rationale: Equivalente português corrente para a mudança sincera de coração requerida no contexto.
- source_word: sons
  choice: filhos
  rationale: Mantém a metáfora familiar do texto e seu sentido coletivo tradicional.
theological_decisions:
- issue: Ressurreição e julgamento da carne
  choice: “esta carne não é julgada nem ressuscita”
  alternative: “este corpo não é julgado nem ressuscita”
  rationale: A repetição de “carne” é central ao argumento e deve permanecer visível.
- issue: Vir na carne
  choice: “também virão na carne”
  alternative: “também comparecerão na carne”
  rationale: O testemunho fornecido diz “come”; evitou-se definir se a expressão se refere especificamente à ressurreição, ao juízo ou à entrada no Reino.
- issue: Cristo primeiro espírito e depois carne
  choice: Tradução direta com nota de cautela
  alternative: Reformular como “Cristo, sendo divino, assumiu a carne”
  rationale: A reformulação resolveria uma tensão cristológica que o texto transmitido deixa aberta; a tradução preserva sua sequência verbal sem importar uma explicação denominacional.
- issue: Retribuição oferecida a Deus
  choice: Manter a metáfora e identificá-la como arrependimento
  alternative: Eliminar a linguagem de retribuição
  rationale: O próprio texto explica a retribuição como arrependimento sincero, não como compra da cura ou da salvação.
- issue: Citação das palavras do Senhor
  choice: '“Estes são meus irmãos: os que fazem a vontade de meu Pai”'
  alternative: Harmonizar integralmente com uma versão bíblica específica
  rationale: Mantém a forma citada pelo autor sem impor a redação de uma tradução canônica moderna.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” para o plural e “coloquemo-nos”/“ofereçamos” nas exortações coletivas. O rascunho é necessariamente provisório: foi produzido a partir do testemunho inglês público fornecido e da camada inglesa auditada; a revisão direta da tradição manuscrita grega permanece pendente.'
