    E não fiquemos descontentes nem irritados, insensatos que somos, quando alguém nos adverte e nos desvia da injustiça para a justiça. Às vezes, enquanto praticamos o mal, não nos damos conta disso por causa da duplicidade e da incredulidade que há em nosso coração; e nosso entendimento fica obscurecido por nossos desejos fúteis.


    Pratiquemos, portanto, a justiça, para que sejamos salvos até o fim. Felizes os que obedecem a estes preceitos! Ainda que sofram por pouco tempo neste mundo, colherão o fruto imortal da ressurreição.


