review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva em geral a estrutura exortativa e as formulações fortes sobre arrependimento, salvação, justiça e ressurreição. Contudo, há desvios relevantes do testemunho: a primeira frase transforma a construção passiva e ambígua em “depois de termos ouvido”; “study” foi mudado para “conhecimento”; e a condição final “if he is miserable” foi interpretada como passar por aflições.'
  naturalness: O português é moderno, claro e apropriado ao registro parenético. Os ajustes propostos mantêm essa legibilidade, ao mesmo tempo que evitam explicações introduzidas no corpo do texto.
  terminology: “Exortação”, “justiça”, “preceitos”, “ressurreição” e “vida piedosa” são adequados. “Estudo da piedade” corresponde melhor ao testemunho que “conhecimento da vida piedosa”. A expressão passiva incomum relativa ao Deus da verdade deve permanecer assinalada em nota, sem definir quem o ouviu.
  issues:
  - severity: medium
    issue: A construção passiva inicial foi convertida em uma primeira pessoa inclusiva.
    rationale: “Depois de termos ouvido o Deus da verdade” acrescenta que o autor e os destinatários são os ouvintes. O testemunho diz literalmente que o Deus da verdade “foi ouvido”; a nota reconhece a dificuldade, mas o texto a resolve indevidamente.
  - severity: medium
    issue: “No conhecimento da vida piedosa” não corresponde a “in the study of godliness”.
    rationale: A mudança de “estudo” para “conhecimento” altera a atividade descrita. Além disso, “vida piedosa” torna mais explícito do que o substantivo “piedade” do testemunho.
  - severity: high
    issue: A última condição foi alterada de “se ele é infeliz/miserável nos tempos presentes” para “se passa por aflições”.
    rationale: O texto não especifica a causa da condição nem a limita a aflições. A paráfrase reduz a amplitude da afirmação.
  revised_text: '**2 Clemente 19**


    Portanto, irmãos e irmãs, depois de ter sido ouvido o Deus da verdade,[a] leio para vocês uma exortação, a fim de que prestem atenção ao que está escrito, para que salvem tanto a si mesmos como aquele que lê entre vocês.[b] Pois lhes peço, como recompensa, que se arrependam de todo o coração e deem a si mesmos salvação e vida. Fazendo isso, estabeleceremos um alvo para todos os jovens que desejam se empenhar no estudo da piedade e da bondade de Deus.


    E não fiquemos descontentes nem irritados, insensatos que somos, sempre que alguém nos adverte e nos desvia da injustiça para a justiça. Pois, às vezes, enquanto praticamos o mal, não o percebemos por causa da disposição dividida e da incredulidade que há em nosso íntimo, e nosso entendimento é obscurecido por nossos desejos vãos.


    Pratiquemos, portanto, a justiça, para que sejamos salvos até o fim. Felizes os que obedecem a estes preceitos! Embora sofram aflição por pouco tempo no mundo, colherão o fruto imortal da ressurreição.


    Portanto, a pessoa piedosa não fique triste se é infeliz nos tempos presentes: um tempo bendito a aguarda. Ela viverá novamente no céu com os nossos pais e se alegrará por toda uma eternidade sem tristeza.'
  revised_footnotes:
  - marker: a
    text: 'A construção transmitida pelo testemunho consultado é incomum: literalmente, “depois de ter sido ouvido o Deus da verdade”. Ela provavelmente se refere ao que a comunidade acabara de ouvir em sua reunião, mas não explicita quem o ouviu nem o sentido preciso da expressão.'
    reason: Preservar a construção passiva e sua ambiguidade, sobretudo porque a revisão direta do grego ainda está pendente.
  - marker: b
    text: Isto é, a pessoa que lê o texto em voz alta no meio da comunidade.
    reason: Esclarecer a função comunitária do leitor sem acrescentar um cargo eclesiástico que o texto não especifica.
  revision_rationale: 'A revisão corrige três alterações de sentido: restaura a voz passiva ambígua da abertura, traduz “study” por “estudo” e preserva a condição ampla de ser infeliz nos tempos presentes. Também ajusta “double-mindedness” para “disposição dividida”, mais próximo da imagem de uma interioridade dividida, sem perder clareza. As notas mantêm a incerteza textual relevante sem introduzir interpretação doutrinária.'
