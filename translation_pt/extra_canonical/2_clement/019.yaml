source:
  text: 'Therefore, brothers and sisters, after the God of truth hath been heard, I read unto you an exhortation to the end that ye may give heed to the things which are written, for that ye may save both yourselves and him that readeth in the midst of you. For I ask of you as a reward that ye repent with your whole heart, and give salvation and life to yourselves. For doing this we shall set a goal for all the young who desire to toil in the study of piety and of the goodness of God.


    And let is not be displeased and vexed, fools that we are, whensoever any one admonish us and turneth us aside from unrighteousness unto righteousness. For sometimes while we do evil things, we perceive it not by reason of the double-mindedness and unbelief which is in our breasts, and we are darkened in our understanding by our vain lusts.


    Let us therefore practice righteousness that we may be saved unto the end. Blessed are they that obey these ordinances. Though they may endure affliction for a short time in the world, they will gather the immortal fruit of the resurrection.


    Therefore let not the godly be grieved, if he be miserable in the times that now are: a blessed time awaiteth him. He shall live again in heaven with our fathers, and shall have rejoicing throughout a sorrowless eternity.'
