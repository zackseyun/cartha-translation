base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/019.yaml
  text: 'Therefore, brothers and sisters, after the God of truth has been heard, I read you an exhortation so that you may pay attention to what is written, for you may save both yourselves and the one who reads among you. For I ask you, as a reward, to repent with your whole heart and give salvation and life to yourselves. By doing this, we will set a goal for all the young people who desire to labor in the study of godliness and of the goodness of God.


    And let us not be displeased and annoyed, foolish as we are, whenever anyone warns us and turns us away from unrighteousness toward righteousness. For sometimes, while we do evil things, we do not realize it because of the divided minds and unbelief within our hearts, and our understanding is darkened by our vain lusts.


    Therefore, let us practice righteousness so that we may be saved to the end. Blessed are those who obey these ordinances. Though they may endure affliction for a short time in the world, they will gather the immortal fruit of the resurrection.


    Therefore, let the godly person not be grieved if he is miserable in the present times; a blessed time awaits him. He will live again in heaven with our fathers and will rejoice throughout a sorrowless eternity.'
translation:
  language: pt
  text: '**2 Clemente 19**


    Portanto, irmãos e irmãs, depois de termos ouvido o Deus da verdade,[a] leio para vocês uma exortação, a fim de que prestem atenção ao que está escrito, pois assim poderão salvar tanto a si mesmos como aquele que faz a leitura entre vocês.[b] Peço-lhes, como recompensa, que se arrependam de todo o coração e deem a si mesmos salvação e vida. Ao fazermos isso, estabeleceremos um alvo para todos os jovens que desejam se empenhar no conhecimento da vida piedosa e da bondade de Deus.


    E não fiquemos descontentes nem irritados, insensatos que somos, quando alguém nos adverte e nos desvia da injustiça para a justiça. Às vezes, enquanto praticamos o mal, não nos damos conta disso por causa da indecisão e da incredulidade que há em nosso íntimo; e nosso entendimento fica obscurecido por nossos desejos inúteis.


    Pratiquemos, portanto, a justiça, para que sejamos salvos até o fim. Felizes os que obedecem a estes preceitos! Ainda que sofram por pouco tempo neste mundo, colherão o fruto imortal da ressurreição.


    Portanto, quem vive de modo piedoso não fique triste se passa por aflições no tempo presente, pois um tempo bendito o aguarda. Ele voltará a viver no céu com os nossos pais e se alegrará por toda uma eternidade sem tristeza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção transmitida pelo testemunho consultado é incomum: “depois de o Deus da verdade ter sido ouvido”. Ela provavelmente se refere ao que a comunidade acabara de ouvir em sua reunião, mas o objeto exato da audição não é explicitado.'
    reason: Preservar a dificuldade e a ambiguidade da frase, especialmente porque a revisão direta do grego ainda está pendente.
  - marker: b
    text: Isto é, a pessoa que lê o texto em voz alta no meio da comunidade.
    reason: Esclarecer a função comunitária do “leitor” sem acrescentar um cargo eclesiástico que o texto não especifica.
lexical_decisions:
- source_word: brothers and sisters
  choice: irmãos e irmãs
  rationale: Mantém explicitamente a inclusão de ambos os grupos, em linguagem natural e comunitária.
- source_word: exhortation
  choice: exortação
  rationale: Preserva o caráter pastoral e admonitório do discurso, sem reduzi-lo a mera instrução.
- source_word: double-mindedness
  choice: indecisão
  rationale: Comunica a ideia de uma disposição interior dividida ou vacilante em português corrente; evita uma tradução excessivamente literal e pouco natural.
- source_word: ordinances
  choice: preceitos
  rationale: Expressa normas que devem ser obedecidas sem introduzir uma conotação técnica sacramental ou denominacional.
- source_word: immortal fruit of the resurrection
  choice: fruto imortal da ressurreição
  rationale: Conserva a metáfora agrícola e a associação explícita entre imortalidade e ressurreição.
- source_word: sorrowless eternity
  choice: eternidade sem tristeza
  rationale: Reproduz de modo claro e digno a ausência definitiva de pesar, sem ornamentação interpretativa.
theological_decisions:
- issue: A afirmação de que os ouvintes podem salvar a si mesmos e ao leitor
  choice: 'Mantida em linguagem direta: “poderão salvar tanto a si mesmos como aquele que faz a leitura”'
  alternative: Explicar como cooperação, perseverança ou efeito instrumental da exortação
  rationale: O texto atribui essa ação aos ouvintes de forma tensa e não explica sua relação com a ação divina; a tradução não deve resolver a tensão por meio de uma doutrina posterior.
- issue: O imperativo para que os ouvintes deem a si mesmos salvação e vida
  choice: “deem a si mesmos salvação e vida”
  alternative: “acolham a salvação e a vida”
  rationale: A alternativa seria mais idiomática, mas atenuaria a formulação forte e a agência humana presentes no testemunho fornecido.
- issue: Vida futura no céu com os pais
  choice: “voltará a viver no céu com os nossos pais”
  alternative: “ressuscitará e estará no céu com os nossos antepassados”
  rationale: Mantém a formulação do testemunho sem identificar de modo mais específico quem são os “pais” nem substituir “voltará a viver” por terminologia dogmática mais definida.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. Mantiveram-se as exortações na primeira pessoa do plural e as formulações teologicamente fortes sobre salvação, arrependimento e ressurreição. Como a revisão direta da tradição manuscrita grega está indicada como pendente, as decisões mais incertas foram tratadas com cautela e, quando necessário, assinaladas em nota.
