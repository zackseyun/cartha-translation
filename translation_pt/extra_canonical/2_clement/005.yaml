review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a progressão exortativa, as imagens de cordeiros e lobos, a advertência sobre alma, corpo e Geena, e a oposição entre a breve condição corpórea presente e a promessa escatológica. Contudo, «pequena e breve» enfraquece o primeiro qualificativo da condição/peregrinação da carne: no testemunho inglês ele é «mean», isto é, humilde, insignificante ou de pouca importância, não primariamente pequeno em tamanho. «Humilde e breve» transmite melhor esse contraste sem introduzir uma condenação do corpo.'
  naturalness: O texto é claro e tem registro apropriado. «A permanência desta carne neste mundo» é compreensível, mas pouco idiomática; «a passagem desta carne por este mundo» é mais natural e conserva a noção de estadia transitória. Ajustei também a colocação dos indicadores de nota para que se liguem diretamente aos trechos a que se referem.
  terminology: «Geena de fogo», «alma e corpo», «santidade e justiça», «descanso», «reino» e «vida eterna» são escolhas adequadas. Mantém-se «aquele» sem identificação doutrinária acrescentada. A nota sobre a tradição de palavras de Jesus é útil, desde que explicite que há paralelos canônicos de partes da fala, mas não da cena e da formulação inteira.
  issues:
  - severity: medium
    issue: «pequena e breve» para a condição da carne
    rationale: «Breve» reproduz adequadamente a curta duração, mas «pequena» pode sugerir dimensão. O sentido atestado pelo testemunho inglês («mean») pede antes «humilde», «modesta» ou «insignificante». «Humilde e breve» conserva o tom sem exacerbar uma depreciação corporal.
  - severity: low
    issue: Nota b pode ser lida como se nenhuma parte da fala tivesse paralelo canônico
    rationale: A forma completa, com a pergunta de Pedro e a resposta composta, não ocorre nos Evangelhos canônicos; porém, os motivos dos cordeiros entre lobos e do temor daquele que pode lançar na Geena têm paralelos canônicos. Convém registrar essa distinção.
