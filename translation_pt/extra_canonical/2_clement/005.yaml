translation:
  language: pt
  text: '**2 Clemente 5**


    Portanto, irmãos, deixemos para trás nossa permanência neste mundo, façamos a vontade daquele que nos chamou e não tenhamos medo de partir deste mundo.


    Pois o Senhor diz: “Vocês serão como cordeiros no meio de lobos.”


    Pedro, porém, lhe perguntou: “E se os lobos despedaçarem os cordeiros?”


    Jesus disse a Pedro: “Depois de mortos, os cordeiros não devem temer os lobos. Do mesmo modo, vocês não tenham medo dos que os matam e nada mais podem fazer contra vocês; temam, porém, aquele que, depois que vocês morrerem, tem autoridade sobre a alma e o corpo para lançá-los na Geena de fogo[a].”[b]


    E vocês sabem, irmãos, que a passagem desta carne por este mundo é humilde e breve, mas a promessa de Cristo é grande e maravilhosa: o descanso do reino que há de vir e da vida eterna.


    Portanto, o que podemos fazer para alcançar essas coisas, senão viver em santidade e justiça, considerar alheias a nós as coisas deste mundo e não as desejar?


    Pois, quando desejamos possuir essas coisas, afastamo-nos do caminho justo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Geena: nome associado ao vale de Hinom, nos arredores de Jerusalém, usado aqui como imagem do juízo de fogo.'
    reason: O topônimo pode não ser conhecido por leitores modernos e foi mantido sem substituição interpretativa.
  - marker: b
    text: A cena com Pedro e esta formulação completa da fala de Jesus não aparecem dessa forma nos Evangelhos canônicos preservados, embora partes dela tenham paralelos neles.
    reason: Esclarece o caráter não canônico da forma composta da citação sem negar os paralelos canônicos de alguns de seus elementos.
lexical_decisions:
- source_word: παροικία
  choice: permanência
  rationale: Expressa a estadia temporária no mundo sem introduzir, no corpo do texto, uma metáfora mais específica do que o contexto exige.
- source_word: ἄρνες
  choice: cordeiros
  rationale: Equivalente corrente e natural para a imagem de animais vulneráveis em contraste com os lobos.
- source_word: γέεννα πυρός
  choice: Geena de fogo
  rationale: Mantém o topônimo tradicional e a formulação concreta do texto, em vez de substituí-lo interpretativamente por “inferno”.
- source_word: ἐπιδημία ... τῆς σαρκὸς ταύτης
  choice: a permanência desta carne
  rationale: Conserva a linguagem corporal e temporária da expressão, sem parafraseá-la como uma doutrina completa sobre a vida terrena.
- source_word: μικρά ... καὶ ὀλιγοχρόνιος
  choice: pequena e breve
  rationale: 'Reproduz os dois qualificativos: pouca em dimensão ou importância e curta em duração.'
- source_word: ἀνάπαυσις
  choice: descanso
  rationale: Preserva a imagem escatológica de repouso sem expandi-la para uma interpretação denominacional.
- source_word: ἀναστρέφεσθαι
  choice: viver
  rationale: Em contexto ético, o verbo designa a maneira de conduzir a vida; “viver” é claro e idiomático em português moderno.
- source_word: ἀλλότρια
  choice: alheias a nós
  rationale: Comunica que as coisas mundanas não devem ser tratadas como pertencentes ao fiel, preservando a ideia de estranhamento.
theological_decisions:
- issue: Identidade daquele que tem autoridade após a morte
  choice: “aquele que” em minúscula, sem identificação acrescentada
  alternative: “Deus” ou pronome reverencial com maiúscula
  rationale: O referente pode ser inferido teologicamente, mas não é nomeado explicitamente nesta frase; a tradução preserva essa forma e a tensão do texto.
- issue: Natureza da Geena
  choice: manter o nome “Geena”
  alternative: traduzir como “inferno”
  rationale: O uso do topônimo evita impor uma sistematização posterior e permite que a imagem tradicional do texto permaneça visível.
- issue: Relação entre promessa, reino e vida eterna
  choice: apresentar o descanso do reino futuro e da vida eterna como conteúdo da grande promessa
  alternative: fazer apenas do reino o conteúdo da promessa e tratar a vida eterna separadamente
  rationale: A construção associa estreitamente a promessa de Cristo ao descanso escatológico, ao reino vindouro e à vida eterna; a redação portuguesa mantém essa ligação sem eliminar sua compactação sintática.
- issue: Valor da vida corporal presente
  choice: “a permanência desta carne neste mundo é pequena e breve”
  alternative: “a vida na carne é vil e curta”
  rationale: “Pequena” preserva melhor a amplitude de μικρά e evita converter uma comparação de escala e duração em condenação inequívoca do corpo.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais de ampla legibilidade brasileira. O tratamento “vocês” evita formas arcaicas. A tradução busca equivalência ótima e preserva referências não explicitadas e imagens escatológicas. Como o material fornecido declara pendente a revisão direta da fonte grega, decisões lexicais foram mantidas cautelosas e alinhadas tanto ao testemunho inglês fornecido quanto à forma grega tradicionalmente atestada para o capítulo.
