base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/007.yaml
  text: 'So then, my brethren, let us compete, knowing that the contest is near at hand; and though many resort to corruptible contests, not all are crowned, but only those who have toiled hard and competed bravely.


    Let us then compete, that we all may be crowned.


    Therefore let us run in the straight course, the incorruptible contest. Let us resort to it in throngs and compete, that we too may be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that one who competes in a corruptible contest, if found dealing corruptly with it, is first flogged and then removed and driven out of the racecourse.


    What do you think? What shall be done to one who has dealt corruptly with the contest of incorruption?


    For concerning those who have not kept the seal, he says, “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle unto all flesh.”'
translation:
  language: pt
  text: '**2 Clemente 7**


    1 Portanto, meus irmãos, lutemos, sabendo que a competição está próxima. Muitos comparecem às competições que perecem, mas nem todos recebem a coroa; somente os que se esforçaram muito e lutaram com bravura.


    2 Lutemos, pois, para que todos recebamos a coroa.


    3 Corramos, portanto, pelo caminho reto, na competição que não perece. Acorramos a ela em grande número e lutemos, para que nós também recebamos a coroa. E, se não pudermos todos recebê-la, ao menos cheguemos perto dela.


    4 Devemos saber que, se alguém que participa de uma competição perecível for apanhado agindo de modo desonesto nela, primeiro será açoitado; depois, será retirado e expulso da pista.


    5 O que vocês acham? O que acontecerá com quem agiu de modo desonesto na competição que não perece?


    6 Pois, a respeito dos que não guardaram o selo,[a] ele diz: “O verme deles não morrerá, o fogo deles não se apagará, e eles serão um espetáculo para toda carne”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto não explica aqui o que significa “o selo”; a expressão deve permanecer aberta, sem ser identificada automaticamente com um rito específico.
    reason: Preservar uma referência teologicamente significativa, mas não explicitada no contexto.
  - marker: b
    text: Citação de Isaías 66:24. “Toda carne” preserva a formulação coletiva da citação.
    reason: Identificar a alusão bíblica e conservar a expressão textual, sem restringi-la a uma interpretação específica.
lexical_decisions:
- source_word: ἀγών / ἀγωνίζομαι (refletidos no testemunho como “contest / contend”)
  choice: competição / lutar
  rationale: Mantém a metáfora atlética contínua sem recorrer ao arcaísmo “contender”; “lutar” também comunica esforço intenso e corajoso.
- source_word: φθαρτός / ἄφθαρτος (refletidos como “corruptible / incorruptible”)
  choice: que perece / que não perece
  rationale: No contexto das competições e da coroa, a oposição aponta para o que é perecível e imperecível. Essa formulação é natural em português e evita sugerir primariamente corrupção moral, reservada ao jogo verbal posterior.
- source_word: στεφανόω / στέφανος (refletidos como “be crowned / crown”)
  choice: receber a coroa / coroa
  rationale: Preserva a imagem do prêmio atlético e soa mais natural do que “ser coroado” em todas as ocorrências.
- source_word: seal (provável σφραγίς na tradição grega)
  choice: selo
  rationale: Conserva o símbolo sem identificá-lo explicitamente com um rito ou doutrina específica.
- source_word: all flesh
  choice: toda a humanidade
  rationale: Transmite em português corrente o sentido coletivo da expressão sem produzir a leitura estranha de “toda carne” como matéria corporal.
theological_decisions:
- issue: Identidade do “selo”
  choice: Manter apenas “o selo”, com nota de ambiguidade
  alternative: Interpretar como batismo, confissão de fé ou marca de pertença divina
  rationale: O trecho não define o referente; explicitar uma identificação importaria uma conclusão teológica não demonstrada pelo contexto imediato.
- issue: Possibilidade de nem todos receberem a coroa
  choice: Preservar literalmente a tensão entre “para que todos” e “se não pudermos todos”
  alternative: Reformular como mera exortação individual ou eliminar a aparente tensão
  rationale: A oscilação faz parte da retórica do texto e não deve ser harmonizada.
- issue: Destino dos que agem desonestamente na competição imperecível
  choice: Manter a pergunta seguida da citação de juízo
  alternative: Acrescentar uma explicação doutrinária sobre punição final
  rationale: O autor deixa que a imagem e a citação produzam o efeito retórico sem definir aqui todos os detalhes do juízo.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora atlética foi mantida de modo coerente: competição, luta, coroa e pista. Evitaram-se tanto arcaísmos como “contender” quanto explicações confessionais. Como o material fornecido declara que a revisão direta do grego ainda está pendente, a redação permanece cautelosa nos pontos em que o testemunho inglês pode ocultar nuances do original.'
