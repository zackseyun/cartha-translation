review_pass:
  verdict: revise
  source_fidelity: 'O texto acompanha de perto o sentido do testemunho e os elementos gregos indicados: ἐγκράτεια é adequadamente amplo em “domínio próprio”; a relação forte entre praticar o conselho e salvar o ouvinte e o conselheiro foi preservada; e “peçamos com confiança” reflete melhor a construção subjacente do que a formulação inglesa provisória “be with boldness”. Contudo, “alegria” atenua ἡδονή / “pleasure”, que neste contexto deve ser traduzido como “prazer”.'
  naturalness: O registro é claro, contemporâneo e adequado. “Não privemos a nós mesmos de alcançar” é inteligível, mas “não nos privemos de alcançar” é mais idiomático, sem perda de sentido. A citação pode ser levemente ajustada para uma dicção mais natural e solene.
  terminology: “Domínio próprio”, “retribuição”, “confiança”, “salva”, “condenação” e “bondade” são escolhas adequadas. A nota sobre domínio próprio preserva corretamente a possível abrangência sexual de ἐγκράτεια sem a reduzir a ela.
  issues:
  - severity: low
    issue: “alegria” para o prazer produzido pelas palavras
    rationale: O termo traduzido no testemunho como “pleasure” (correspondente ao grego ἡδονή) designa prazer, satisfação ou deleite. “Alegria” desloca levemente o sentido para uma emoção mais elevada ou jubilosa; “prazer” mantém a repetição e a força antitética com a condenação.
  - severity: low
    issue: Construção reflexiva pouco idiomática
    rationale: “Não privemos a nós mesmos” é compreensível, mas “não nos privemos” é a forma portuguesa mais natural e conserva integralmente o sentido de φθονεῖν ἑαυτοῖς no contexto.
