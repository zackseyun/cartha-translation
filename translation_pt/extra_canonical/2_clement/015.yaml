base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/015.yaml
  text: 'Now I do not think that I have given any insignificant counsel concerning self-control, and whoever performs it will not regret it, but will save both himself and me, his counselor. For it is no small reward to convert a wandering and perishing soul, so that it may be saved.


    For this is the recompense that we are able to pay to God who created us: if he who speaks and he who hears both speak and hear with faith and love.


    Let us therefore abide in the things we have believed, in righteousness and holiness, that we may be with boldness before God, who says, “While you are still speaking, I will say, ‘Behold, I am here.’”


    For this word is the token of a great promise; for the Lord says of himself that he is more ready to give than the one who asks is to ask.


    Seeing, then, that we are partakers of so great kindness, let us not begrudge ourselves the obtaining of so many good things. For in proportion as the pleasure is great which these words bring to those who have performed them, so also is the condemnation great which they bring to those who have disobeyed.'
translation:
  language: pt
  text: '**2 Clemente 15**


    Agora, não penso que tenha dado um conselho insignificante a respeito do domínio próprio;[a] quem o puser em prática não se arrependerá, mas salvará tanto a si mesmo como a mim, que o aconselhei. Pois não é pequena a recompensa de reconduzir uma alma que anda perdida e está perecendo, para que seja salva.


    Esta é, de fato, a retribuição que podemos oferecer a Deus, que nos criou: que tanto quem fala como quem ouve fale e ouça com fé e amor.


    Permaneçamos, portanto, naquilo em que cremos, sendo justos e santos, para que peçamos com confiança a Deus, que diz: “Enquanto você ainda estiver falando, eu direi: ‘Eis-me aqui.’”[b]


    Essa palavra é sinal de uma grande promessa, pois o Senhor diz a respeito de si mesmo que está mais pronto a dar do que aquele que pede está a pedir.


    Visto, então, que participamos de tão grande bondade, não nos privemos de alcançar tantos bens. Pois, assim como é grande o prazer que essas palavras trazem aos que as põem em prática, também é grande a condenação que trazem aos que desobedecem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “autocontrole” ou “continência”. O termo abrange o domínio sobre desejos e condutas e pode incluir a abstinência.'
    reason: Registrar a amplitude semântica do termo e evitar uma restrição silenciosa ao campo sexual.
  - marker: b
    text: Alusão a Isaías 58:9; a forma da citação aqui difere da redação de algumas traduções modernas do Antigo Testamento.
    reason: Identificar a Escritura citada e alertar para a diferença de forma textual sem harmonizá-la.
lexical_decisions:
- source_word: ἐγκράτεια (refletido no testemunho como “continence/self-control”)
  choice: domínio próprio
  rationale: Expressa de modo amplo e atual o controle de desejos e condutas, sem restringir indevidamente o termo apenas à abstinência sexual.
- source_word: ἐπιστρέψαι (refletido no testemunho como “convert”)
  choice: reconduzir
  rationale: Preserva a ideia de fazer voltar uma alma errante, sem impor ao contexto um sentido técnico denominacional de conversão.
- source_word: παρρησία (subjacente à expressão do testemunho “with boldness”)
  choice: confiança
  rationale: No contexto da oração dirigida a Deus, comunica franqueza e segurança de acesso com naturalidade em português.
- source_word: ἀντιμισθία (refletido no testemunho como “recompense”)
  choice: retribuição
  rationale: Mantém a linguagem de resposta ou compensação oferecida a Deus sem sugerir que a criatura possa quitar uma dívida em sentido estrito.
- source_word: φθονεῖν ἑαυτοῖς (refletido no testemunho como “begrudge ourselves”)
  choice: privemos a nós mesmos
  rationale: Reproduzir literalmente a ideia de ‘ter inveja de nós mesmos’ seria obscuro; a formulação escolhida comunica o sentido contextual de impedir a si próprio de receber o bem.
theological_decisions:
- issue: A afirmação de que quem pratica o conselho salvará a si mesmo e ao conselheiro
  choice: 'Preservar literalmente a linguagem causal: “salvará tanto a si mesmo como a mim”'
  alternative: Atenuar para “contribuirá para a salvação” ou explicar o verbo em termos apenas exemplares
  rationale: O texto apresenta deliberadamente uma relação forte entre prática, aconselhamento e salvação. A tradução não deve resolver essa tensão por meio de uma paráfrase doutrinária.
- issue: A retribuição oferecida ao Deus criador
  choice: Manter “retribuição que podemos oferecer a Deus” e explicitar a oração seguinte como seu conteúdo
  alternative: Reformular como simples gratidão ou pagamento de uma dívida
  rationale: A redação conserva a metáfora de reciprocidade do texto sem transformá-la em doutrina de mérito nem esvaziá-la em sentimento subjetivo.
- issue: Pedido confiante a Deus no terceiro parágrafo
  choice: “para que peçamos com confiança a Deus”
  alternative: Seguir a redação provisória inglesa “para que estejamos com ousadia diante de Deus”
  rationale: A leitura com o verbo ‘pedir’, coerente com a continuação sobre Deus estar pronto a dar e o ser humano a pedir, oferece a conexão argumentativa mais forte e corresponde à evidência grega conhecida; ainda assim, a revisão integral da tradição manuscrita permanece pendente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil e inteligíveis internacionalmente. Mantiveram-se a repetição retórica, a linguagem de salvação e condenação e a tensão da reciprocidade com Deus. O rascunho foi cotejado com a evidência grega reconhecível por trás do testemunho fornecido, mas, conforme os metadados da solicitação, a revisão direta e completa da tradição manuscrita grega ainda está pendente.
