base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/003.yaml
  text: 'Seeing, then, that he showed us such great mercy—first of all, that we who are alive do not sacrifice to these dead gods or worship them, but through him have come to know the Father of truth—what else is this knowledge toward him except not denying him through whom we have known him?


    Yes, he himself says, “Whoever confesses me, I will confess before the Father.”


    This, then, is our reward, if we truly confess him through whom we were saved.


    But how do we confess him? By doing what he says, not disobeying his commandments, and honoring him not only with our lips but with our whole heart and our whole mind.


    Now he also says in Isaiah, “This people honors me with their lips, but their heart is far from me.”'
translation:
  language: pt
  text: 'Visto, portanto, que ele nos concedeu tão grande misericórdia — sobretudo porque nós, que estamos vivos, não oferecemos sacrifícios a esses deuses mortos nem os adoramos, mas, por meio dele, conhecemos o Pai da verdade —, que outra coisa significa, de nossa parte, conhecê-lo, senão não negar aquele por meio de quem o conhecemos?


    Sim, ele mesmo diz: “Quem me confessar, eu também o confessarei diante do Pai”.


    Esta, portanto, é a nossa recompensa, se de fato confessarmos aquele por meio de quem fomos salvos.


    Mas como o confessamos? Fazendo o que ele diz, não desobedecendo aos seus mandamentos e honrando-o não somente com os lábios, mas de todo o coração e com toda a nossa mente.


    Ele também diz em Isaías: “Este povo me honra com os lábios, mas seu coração está longe de mim”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mercy
  choice: misericórdia
  rationale: Mantém o campo semântico religioso e relacional do testemunho, em linguagem corrente e digna.
- source_word: Father of truth
  choice: Pai da verdade
  rationale: Preserva a construção incomum do testemunho sem substituí-la pela expressão interpretativa “Pai verdadeiro”.
- source_word: confess
  choice: confessar
  rationale: Conserva a repetição central e o sentido público de reconhecer e declarar lealdade, sem reduzi-lo a mera admissão verbal.
- source_word: reward
  choice: recompensa
  rationale: Verte de modo direto a ideia de retribuição, sem especificar indevidamente sua natureza.
- source_word: whole mind
  choice: toda a nossa mente
  rationale: Expressão natural e abrangente em português moderno, mantendo-a distinta de “coração”.
theological_decisions:
- issue: Referentes pronominais em “conhecê-lo” e “por meio de quem o conhecemos”
  choice: Manter a sequência pronominal e a fórmula “por meio de quem”
  alternative: Identificar explicitamente cada referente como o Pai ou Cristo
  rationale: O texto alterna referentes de modo teologicamente carregado; explicitá-los resolveria uma ambiguidade que o testemunho fornecido não esclarece por completo.
- issue: Natureza da confissão
  choice: Usar “confessar” e explicá-la pelo próprio contexto de obediência e honra integral
  alternative: Traduzir por “reconhecer publicamente” ou “declarar fidelidade”
  rationale: A repetição é estrutural, e o parágrafo já define a confissão por atos, evitando uma paráfrase doutrinariamente estreita.
- issue: Relação entre obediência e recompensa
  choice: Preservar a afirmação condicional “se de fato confessarmos”
  alternative: Reformular como simples evidência de salvação já consumada
  rationale: A condição e a tensão exortativa pertencem ao argumento e não devem ser harmonizadas com um sistema teológico posterior.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A redação é provisória porque o material fornecido identifica o testemunho inglês de domínio público como base e informa que a revisão direta do grego ainda está pendente. Evitaram-se notas não sustentadas pelo material apresentado.
