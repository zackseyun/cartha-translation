base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/014.yaml
  text: 'Therefore, brothers and sisters, if we do the will of God our Father, we will belong to the first church, which is spiritual and was created before the sun and the moon. But if we do not do the will of the Lord, we will belong to the scripture that says, “My house was made a den of robbers.” So then, let us choose instead to belong to the church of life, so that we may be saved.


    I do not suppose that you are unaware that the living church is the body of Christ, for the scripture says, “God made the human being male and female.” The male is Christ, and the female is the church. And the Books and the Apostles plainly declare that the church does not exist now for the first time, but has existed from the beginning. For she was spiritual, just as our Jesus also was spiritual, but she was revealed in the last days so that he might save us.


    Now the church, being spiritual, was revealed in the flesh of Christ, thereby showing us that if any of us guards her in the flesh and does not defile her, that person will receive her again in the Holy Spirit. For this flesh is the counterpart and copy of the spirit. Therefore, no one who has defiled the copy will receive the original as their portion. This, then, is what he means, brothers and sisters: “Guard the flesh, so that you may partake of the spirit.”


    But if we say that the flesh is the church and the spirit is Christ, then whoever has treated the flesh wantonly has treated the church wantonly. Such a person, therefore, will not partake of the spirit, which is Christ>.


    So excellent are the life and immortality that this flesh can receive as its portion if the Holy Spirit is joined to it. No one can declare or tell the things that the Lord has prepared for his elect.'
translation:
  language: pt
  text: '14 Portanto, irmãos e irmãs, se fizermos a vontade de Deus, nosso Pai, pertenceremos à primeira Igreja, que é espiritual e foi criada antes do sol e da lua. Mas, se não fizermos a vontade do Senhor, estaremos incluídos na palavra da Escritura que diz: “Minha casa tornou-se um covil de ladrões”. Portanto, escolhamos pertencer à Igreja da vida, para sermos salvos.


    Não creio que vocês ignorem que a Igreja viva é o corpo de Cristo, pois a Escritura diz: “Deus fez o ser humano, homem e mulher”. O homem é Cristo, e a mulher é a Igreja. Além disso, os Livros e os Apóstolos declaram claramente que a Igreja não passou a existir apenas agora, mas existe desde o princípio. Ela era espiritual, assim como nosso Jesus também era espiritual, mas foi manifestada nos últimos dias para nos salvar.


    Ora, a Igreja, sendo espiritual, foi manifestada na carne de Cristo. Isso nos mostra que, se algum de nós a guardar na carne e não a profanar, a receberá novamente no Espírito Santo; pois esta carne é a contraparte e a cópia do espírito. Portanto, ninguém que tenha profanado a cópia receberá o original como sua porção. É isto, pois, que ele quer dizer, irmãos e irmãs: “Guardem a carne, para que participem do espírito”.


    Mas, se dizemos que a carne é a Igreja e o espírito é Cristo, então quem abusou da carne abusou da Igreja. Tal pessoa, portanto, não participará do espírito, que é Cristo.


    Quão excelentes são a vida e a imortalidade que esta carne pode receber como sua porção, se o Espírito Santo se unir a ela! Ninguém pode declarar nem descrever as coisas que o Senhor preparou para os seus eleitos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφοί (presumido por trás de “brethren”)
  choice: irmãos e irmãs
  rationale: Expressa em português atual o uso coletivo do termo de parentesco, sem restringir a exortação aos homens.
- source_word: ἐκκλησία (presumido)
  choice: Igreja
  rationale: Mantém o referente corporativo e personificado do argumento; a inicial maiúscula ajuda a indicar a realidade teológica específica apresentada pelo autor.
- source_word: σπήλαιον λῃστῶν (provável fórmula bíblica)
  choice: covil de ladrões
  rationale: Preserva a imagem bíblica tradicional e é natural em português.
- source_word: ἀντίτυπον / ἀντίτυπος (provável termo por trás de “counterpart”)
  choice: figura
  rationale: Evita a rigidez de “contraparte” e conserva a relação tipológica com o original, em paralelo com “cópia”.
- source_word: κληρονομεῖν / μέρος (conceito por trás de “receive ... as their portion”)
  choice: receber como sua porção
  rationale: Mantém a linguagem de participação ou herança sem reduzi-la a uma formulação doutrinária mais específica.
- source_word: καταχράομαι ou equivalente (incerto, por trás de “dealt wantonly”)
  choice: tratar de modo indigno
  rationale: Comunica abuso ou conduta desonrosa sem impor uma especificidade sexual que a evidência fornecida não permite confirmar.
theological_decisions:
- issue: Preexistência da Igreja
  choice: “foi criada antes do sol e da lua” e “existe desde o princípio”
  alternative: Atenuar como mero plano divino anterior
  rationale: O texto apresenta explicitamente uma Igreja espiritual primordial; a tradução preserva essa afirmação e sua tensão sem reinterpretá-la.
- issue: Relação entre Cristo, a Igreja, homem e mulher
  choice: “O homem é Cristo, e a mulher é a Igreja”
  alternative: Explicar a frase como alegoria ou tipologia dentro do corpo do texto
  rationale: Mantém a identificação surpreendente e teologicamente tensa do autor sem acrescentar uma solução interpretativa.
- issue: Alternância pronominal em “foi manifestada ... para que ele nos salvasse”
  choice: Preservar “ela” para a Igreja e “ele” para Jesus
  alternative: Uniformizar o sujeito como Cristo ou como Igreja
  rationale: A mudança de referente já aparece no testemunho e pode refletir a sintaxe ou a argumentação antiga; não deve ser silenciosamente harmonizada.
- issue: Carne, Igreja, espírito e Cristo
  choice: Manter as equivalências declaradas pelo autor sem sistematizá-las
  alternative: Distinguir explicitamente corpo individual, corpo eclesial e Espírito Santo
  rationale: O parágrafo entrelaça deliberadamente essas categorias; uma explicação dogmática resolveria uma ambiguidade genuína.
- issue: Salvação condicionada à preservação da carne/Igreja
  choice: Traduzir diretamente a exortação e sua consequência
  alternative: Reformular em categorias confessionais de santificação ou mérito
  rationale: A formulação ética e participativa do texto deve permanecer sem importação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a personificação feminina da Igreja, a repetição argumentativa e as tensões entre carne, Igreja, espírito e Cristo. Esta é uma versão provisória baseada no testemunho inglês de domínio público e na camada inglesa auditada; a revisão direta do texto grego continua necessária. O sinal “>” após “Christ” foi tratado como artefato tipográfico.
