translation:
  language: pt
  text: 'Enquanto estamos na terra, portanto, arrependamo-nos, pois somos barro nas mãos do artífice.


    Quando o oleiro está fazendo um vaso e este se deforma ou se quebra em suas mãos, ele o molda de novo. Mas, depois de colocá-lo no forno de fogo, já não pode consertá-lo. Assim também nós, enquanto estamos neste mundo, arrependamo-nos de todo o coração do mal que fizemos no corpo, para que sejamos salvos pelo Senhor enquanto ainda temos tempo para o arrependimento.


    Pois, depois que partirmos deste mundo, já não poderemos confessar nossos pecados nem nos arrepender.


    Portanto, irmãos, se fizermos a vontade do Pai, conservarmos puro o corpo e guardarmos os mandamentos do Senhor, receberemos a vida eterna.


    Pois o Senhor diz no Evangelho: “Se vocês não guardaram o que é pequeno, quem lhes dará o que é grande? Pois eu lhes digo: quem é fiel no mínimo também é fiel no muito.”


    Portanto, o que ele quer dizer é: “Conservem puro o corpo e imaculado o selo[a], para que recebamos a vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O selo” é uma imagem preservada do texto antigo. Nesta passagem, seu referente exato não é explicado.
    reason: Evita impor uma interpretação doutrinária específica a uma metáfora genuinamente ambígua.
lexical_decisions:
- source_word: craftsman / τεχνίτης (source-language correspondence provisional)
  choice: artífice
  rationale: Preserva a imagem de alguém que trabalha e molda o barro, com registro digno e natural.
- source_word: flesh / σάρξ (source-language correspondence provisional)
  choice: corpo
  rationale: Neste contexto ético e concreto, “corpo” comunica com clareza o sentido de vida corporal sem sugerir que a matéria seja intrinsecamente má; a revisão direta do grego ainda é necessária.
- source_word: make confession / ἐξομολογεῖσθαι (source-language correspondence provisional)
  choice: confessar nossos pecados
  rationale: Explicita o objeto implícito da confissão em português natural, sem definir forma ritual ou eclesiástica específica.
- source_word: seal / σφραγίς (source-language correspondence provisional)
  choice: selo
  rationale: Mantém a metáfora antiga e sua ambiguidade, sem identificá-la automaticamente com batismo, pertença, fé ou outra interpretação específica.
theological_decisions:
- issue: Relação entre arrependimento, obediência e salvação
  choice: Preservar as afirmações condicionais e exortativas do texto
  alternative: Reformular para harmonizá-las explicitamente com um sistema soteriológico posterior
  rationale: O texto associa arrependimento, pureza, obediência e recebimento da vida; a tradução não deve dissolver essa tensão nem importar uma estrutura denominacional.
- issue: Sentido de “o selo”
  choice: Manter a expressão sem identificar seu referente
  alternative: Traduzir ou explicar no corpo do texto como batismo, Espírito, fé ou marca de pertença
  rationale: O referente não é explicitado nesta passagem, e sua ambiguidade histórica deve ser preservada.
- issue: Possibilidade de arrependimento após a morte
  choice: Traduzir diretamente a negação apresentada pelo autor
  alternative: Atenuar a declaração ou conciliá-la com doutrinas posteriores
  rationale: A afirmação é central ao argumento da passagem e deve permanecer teologicamente nítida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” na citação para evitar formas arcaicas. O texto é um rascunho provisório fundamentado principalmente na testemunha inglesa pública fornecida; as correspondências gregas indicadas exigem conferência direta da tradição manuscrita.
