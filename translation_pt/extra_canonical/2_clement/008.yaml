review_pass:
  verdict: revise
  source_fidelity: Revisão provisória baseada na testemunha inglesa fornecida, pois não foi disponibilizado texto grego para conferência direta. A principal correção necessária é manter «carne» para flesh/σάρξ nas três ocorrências, em vez de uniformizá-la como «corpo». Isso preserva a terminologia e o vínculo lexical do argumento sem impor uma antropologia posterior. «Fazer confissão» conserva a formulação sem acrescentar «nossos pecados», objeto que a testemunha não explicita.
  naturalness: 'O texto revisto conserva um português moderno e claro, com ajustes pontuais: «forno ardente» é mais idiomático que «forno de fogo», e «Com isso, ele quer dizer» introduz naturalmente a explicação final.'
  terminology: Mantêm-se «artífice», «carne», «arrependimento», «mandamentos», «vida eterna» e «selo». «Selo» continua sem interpretação no texto e com nota explicativa não doutrinária.
  issues:
  - severity: medium
    issue: «flesh» foi traduzido por «corpo» em todas as ocorrências.
    rationale: A testemunha emprega «flesh» de modo consistente, inclusive na exortação final. «Corpo» é uma possível interpretação contextual, mas elimina a repetição terminológica e reduz a fidelidade formal à formulação recebida.
  - severity: low
    issue: «confessar nossos pecados» explicita o objeto de «make confession».
    rationale: Embora seja uma inferência compreensível no contexto, o objeto não aparece na testemunha. «Fazer confissão» preserva a concisão e evita especificar o ato além do texto.
  - severity: low
    issue: «forno de fogo» é pouco natural em português contemporâneo.
    rationale: «Forno ardente» transmite a mesma imagem de um forno submetido ao fogo, com formulação portuguesa mais fluente.
  revised_text: 'Enquanto estamos na terra, portanto, arrependamo-nos, pois somos barro na mão do artífice.


    Quando o oleiro está fazendo um vaso e este se deforma ou é esmagado em suas mãos, ele o molda de novo. Mas, depois de colocá-lo no forno ardente, já não pode consertá-lo. Assim também nós, enquanto estamos neste mundo, arrependamo-nos de todo o coração dos males que cometemos na carne, para que sejamos salvos pelo Senhor, enquanto ainda temos tempo para o arrependimento.


    Pois, depois que tivermos partido deste mundo, já não poderemos fazer confissão nem nos arrepender.


    Portanto, irmãos, se fizermos a vontade do Pai, conservarmos a carne pura e guardarmos os mandamentos do Senhor, receberemos a vida eterna.


    Pois o Senhor diz no Evangelho: “Se vocês não guardaram o que é pequeno, quem lhes dará o que é grande? Pois eu lhes digo: quem é fiel no mínimo também é fiel no muito.”


    Com isso, ele quer dizer: “Conservem a carne pura e o selo[a] sem mancha, para que recebamos a vida.”'
  revised_footnotes:
  - marker: a
    text: “O selo” é uma imagem preservada do texto antigo. Nesta passagem, seu referente exato não é explicado.
    reason: Preserva a metáfora e sua ambiguidade, sem identificá-la com uma interpretação doutrinária específica.
  revision_rationale: A revisão restaura «carne» como equivalente consistente de flesh/σάρξ, remove uma explicitação não exigida em «fazer confissão» e aprimora algumas formulações idiomáticas. A estrutura argumentativa — urgência do arrependimento enquanto se está no mundo, obediência e vida, e a imagem do selo — permanece inalterada. A nota do selo é mantida.
