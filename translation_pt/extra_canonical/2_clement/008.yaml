review_pass:
  verdict: revise
  source_fidelity: A revisão preserva a estrutura argumentativa e as afirmações sobre arrependimento, obediência e vida. Contudo, é mais fiel manter «carne» para σάρξ/flesh nos três usos, especialmente nas formulações éticas paralelas; «corpo» reduz a continuidade lexical e pode deslocar o campo semântico. «Confessar» sem objeto conserva a concisão e a possível amplitude de ἐξομολογεῖσθαι. A imagem do vaso deve indicar deformação ou amassamento, não quebra.
  naturalness: O texto é geralmente claro e moderno. «Forno de fogo» é pouco idiomático em português atual; «forno ardente» transmite naturalmente a imagem. «Se entorta ou é amassado» e «Ele quer dizer o seguinte» são formulações mais fluidas e precisas.
  terminology: «Artífice», «oleiro», «arrependimento», «vida eterna» e «selo» são escolhas adequadas. «Carne» é preferível a «corpo» aqui por correspondência terminológica com o testemunho e pela repetição intencional da exortação. A nota sobre «selo» preserva corretamente a ambiguidade, sem impor identificação doutrinária.
  issues:
  - severity: medium
    issue: «corpo» substitui «flesh/carne» em todas as ocorrências.
    rationale: A troca perde a repetição lexical do texto e é menos diretamente fiel à terminologia transmitida. «Carne» é português moderno e compreensível neste registro, sobretudo em «praticamos na carne» e «manter a carne pura».
  - severity: low
    issue: «se deforma ou se quebra» para «get twisted or crushed».
    rationale: «Quebra» introduz uma ruptura que não corresponde bem a «crushed»; «é amassado» preserva a imagem do barro deformado nas mãos do oleiro.
  - severity: low
    issue: «forno de fogo» é formulação pouco natural.
    rationale: «Forno ardente» comunica a mesma imagem sem estranheza desnecessária.
  - severity: low
    issue: «confessar nossos pecados» explicita um objeto não expresso no enunciado-fonte.
    rationale: Embora a inferência seja plausível, «confessar» preserva melhor a formulação concisa e não especificada do texto.
  revised_text: 'Enquanto estamos na terra, portanto, arrependamo-nos, pois somos barro nas mãos do artífice.


    Quando o oleiro está fazendo um vaso, e ele se entorta ou é amassado em suas mãos, ele o molda de novo. Mas, depois de colocá-lo no forno ardente, já não pode consertá-lo. Assim também nós, enquanto estamos neste mundo, arrependamo-nos de todo o coração das más ações que praticamos na carne, para que sejamos salvos pelo Senhor, enquanto ainda temos tempo para o arrependimento.


    Pois, depois que tivermos partido deste mundo, já não poderemos confessar nem nos arrepender.


    Portanto, irmãos, se fizermos a vontade do Pai, mantivermos pura a carne e guardarmos os mandamentos do Senhor, receberemos a vida eterna.


    Pois o Senhor diz no Evangelho: “Se vocês não guardaram o que é pequeno, quem lhes dará o que é grande? Pois eu lhes digo: quem é fiel no mínimo também é fiel no muito.”


    Portanto, ele quer dizer o seguinte: “Mantenham pura a carne e o selo[a] sem mancha, para que recebamos a vida.”'
  revised_footnotes:
  - marker: a
    text: “O selo” é uma imagem preservada do texto antigo. Nesta passagem, seu referente exato não é explicado.
    reason: Evita impor uma interpretação doutrinária específica a uma metáfora genuinamente ambígua.
  revision_rationale: A revisão corrige pequenas imprecisões na imagem do oleiro e melhora a naturalidade, sobretudo em «forno ardente». Restaura-se também «carne» como termo recorrente, preservando a continuidade lexical e ética do texto-fonte. A expressão «o selo» e sua nota são mantidas sem interpretação adicional. Como o material fornecido declara que a conferência direta da tradição grega ainda está pendente, esta avaliação permanece condicionada ao testemunho público em inglês e às correspondências gregas indicadas provisoriamente.
