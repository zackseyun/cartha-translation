  naturalness: O texto é claro e tem registro exortativo apropriado. Ajusta-se a frase condicional final para explicitar melhor que o contraste é entre praticar o mal em âmbito privado e ensiná-lo a outros, sem acrescentar uma interpretação doutrinária.
  terminology: “Virtude/vício”, “impiedade”, “almas inocentes”, “promessa futura” e “condenação em dobro” são escolhas adequadas, naturais e consistentes com o tom do testemunho.
  issues:
  - severity: low
    issue: “apenas por conta própria” pode sugerir iniciativa autônoma, em vez de a prática limitada a eles mesmos.
    rationale: O contexto contrapõe fazer tais coisas somente entre si a ensinar o mal a almas inocentes. “Sozinhas” comunica esse contraste de modo mais direto.
  revised_text: 'Por isso, meus irmãos, façamos a vontade do Pai que nos chamou, para que vivamos. Busquemos, antes, a virtude; abandonemos o vício, precursor dos nossos pecados, e fujamos da impiedade, para que os males não nos alcancem.


    Pois, se formos zelosos em fazer o bem, a paz nos seguirá.


    É por essa razão que uma pessoa não consegue alcançar a felicidade: as pessoas invocam os temores humanos[a], preferindo o prazer presente à promessa futura.


    Elas não sabem quanto tormento o prazer presente traz, nem quanta alegria a promessa futura traz.


    E, se de fato fizessem essas coisas sozinhas, isso seria tolerável. Agora, porém, persistem em ensinar o mal a almas inocentes, sem saber que receberão condenação em dobro[b]: elas e seus ouvintes.'
  revised_footnotes:
  - marker: a
    text: A expressão traduzida como “invocam os temores humanos” é obscura no testemunho disponível e também pode sugerir que essas pessoas acolhem ou dão lugar ao medo dos seres humanos.
    reason: Preservar a dificuldade textual e semântica sem impor uma interpretação única antes da revisão direta do grego.
  - marker: b
    text: Ou, possivelmente, “uma dupla condenação, tanto elas como seus ouvintes”. A formulação pode indicar uma pena agravada ou a condenação que alcança os dois grupos.
    reason: Registrar uma ambiguidade relevante para a interpretação moral e teológica da passagem.
  revision_rationale: A única alteração é “por conta própria” para “sozinhas”, que torna mais nítido o contraste contextual entre o mal praticado sem envolver outros e o ensino do mal a pessoas inocentes. Mantêm-se a formulação difícil sobre os temores humanos e a nota de ambiguidade sobre a condenação duplicada.
