review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido. Mantém adequadamente as imagens morais («virtude/vício», a paz que «nos seguirá») e a ambiguidade de «temores humanos» mediante nota. Contudo, «apenas por conta própria» pode sugerir agir de modo independente, ao passo que «by themselves alone» contrasta o dano limitado a elas mesmas com o ensino que prejudica outros.
  naturalness: O português é claro, digno e amplamente legível. A alteração para «se praticassem essas coisas apenas para si mesmas» é mais natural e mais precisa no contraste retórico do período final.
  terminology: «Pai», «virtude», «vício», «impiedade», «almas inocentes» e «condenação em dobro» são escolhas adequadas. «Temores humanos» preserva de forma sóbria a expressão difícil; a nota continua necessária.
  issues:
  - severity: medium
    issue: «Apenas por conta própria» em 2 Clem. 10, último parágrafo
    rationale: Em português, a expressão normalmente significa fazer algo sem ajuda ou por iniciativa própria. O sentido do testemunho é que, se tais pessoas praticassem o mal somente para si, sem ensiná-lo a outros, isso seria mais tolerável.
  revised_text: 'Por isso, meus irmãos, façamos a vontade do Pai que nos chamou, para que vivamos. Busquemos, antes, a virtude; abandonemos o vício, precursor dos nossos pecados, e fujamos da impiedade, para que os males não nos alcancem.


    Pois, se formos zelosos em fazer o bem, a paz nos seguirá.


    É por essa razão que uma pessoa não consegue alcançar a felicidade: as pessoas invocam os temores humanos[a], preferindo o prazer presente à promessa futura.


    Elas não sabem quanto tormento o prazer presente traz, nem quanta alegria a promessa futura traz.


    E, se de fato praticassem essas coisas apenas para si mesmas, isso seria tolerável. Agora, porém, persistem em ensinar o mal a almas inocentes, sem saber que receberão condenação em dobro[b]: elas e seus ouvintes.'
  revised_footnotes:
  - marker: a
    text: A expressão traduzida como “invocam os temores humanos” é obscura no testemunho disponível e também pode sugerir que essas pessoas acolhem ou dão lugar ao medo dos seres humanos.
    reason: Preservar a dificuldade textual e semântica sem impor uma interpretação única antes da revisão direta do grego.
  - marker: b
    text: Ou, possivelmente, “uma dupla condenação, tanto elas como seus ouvintes”. A formulação pode indicar uma pena agravada ou a condenação que alcança os dois grupos.
    reason: Registrar uma ambiguidade relevante para a interpretação moral e teológica da passagem.
