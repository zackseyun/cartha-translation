base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/010.yaml
  text: 'Wherefore, my brethren, let us do the will of the Father who called us, that we may live; and let us rather pursue virtue, but forsake vice as the forerunner of our sins, and let us flee from ungodliness, lest evils overtake us.


    For if we are diligent in doing good, peace will pursue us.


    For this cause a person is unable to attain happiness, seeing that they call in the fears of men, preferring the enjoyment that is here to the promise that is to come.


    For they do not know how great a torment the enjoyment that is here brings, and what delight the promise that is to come brings.


    And if indeed they were doing these things by themselves alone, it would have been tolerable; but now they continue teaching evil to innocent souls, not knowing that they shall have their condemnation doubled, both themselves and their hearers.'
translation:
  language: pt
  text: 'Por isso, meus irmãos, façamos a vontade do Pai que nos chamou, para que vivamos. Busquemos, antes, a virtude; abandonemos o vício, precursor dos nossos pecados, e fujamos da impiedade, para que os males não nos alcancem.


    Pois, se formos zelosos em fazer o bem, a paz nos seguirá.


    É por essa razão que uma pessoa não consegue alcançar a felicidade: as pessoas invocam os temores humanos[a], preferindo o prazer presente à promessa futura.


    Elas não sabem quanto tormento o prazer presente traz, nem quanta alegria a promessa futura traz.


    E, se de fato fizessem essas coisas apenas por conta própria, isso seria tolerável. Agora, porém, persistem em ensinar o mal a almas inocentes, sem saber que receberão condenação em dobro[b]: elas e seus ouvintes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida como “invocam os temores humanos” é obscura no testemunho disponível e também pode sugerir que essas pessoas acolhem ou dão lugar ao medo dos seres humanos.
    reason: Preservar a dificuldade textual e semântica sem impor uma interpretação única antes da revisão direta do grego.
  - marker: b
    text: Ou, possivelmente, “uma dupla condenação, tanto elas como seus ouvintes”. A formulação pode indicar uma pena agravada ou a condenação que alcança os dois grupos.
    reason: Registrar uma ambiguidade relevante para a interpretação moral e teológica da passagem.
lexical_decisions:
- source_word: virtue
  choice: virtude
  rationale: Conserva o contraste moral direto com “vício” e mantém o tom exortativo do testemunho fornecido.
- source_word: vice
  choice: vício
  rationale: Reproduz o par antitético “virtude/vício” sem restringir o sentido a um pecado específico.
- source_word: ungodliness
  choice: impiedade
  rationale: Termo corrente e digno que expressa oposição prática e religiosa a Deus sem acrescentar uma definição denominacional.
- source_word: enjoyment which is here
  choice: prazer presente
  rationale: Expressa de modo natural o contraste temporal entre a satisfação desta vida e a promessa futura.
- source_word: innocent souls
  choice: almas inocentes
  rationale: Mantém a linguagem antropológica e moral do testemunho, sem substituir “almas” por uma paráfrase interpretativa.
theological_decisions:
- issue: Relação entre obediência à vontade do Pai e vida
  choice: “façamos a vontade do Pai que nos chamou, para que vivamos”
  alternative: “porque assim viveremos”
  rationale: Mantém a construção final e sua tensão teológica, sem explicar se a vida é resultado, finalidade ou manifestação da obediência.
- issue: A paz como agente que segue quem faz o bem
  choice: “a paz nos seguirá”
  alternative: “encontraremos a paz”
  rationale: Preserva a personificação marcante do testemunho em vez de transformá-la numa afirmação genérica.
- issue: Condenação dos mestres e dos ouvintes
  choice: '“receberão condenação em dobro: elas e seus ouvintes”'
  alternative: “tanto elas como seus ouvintes serão condenados”
  rationale: Conserva a linguagem de duplicação presente no testemunho, embora a relação exata entre a dupla condenação e os dois grupos permaneça incerta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. A redação permanece provisória porque o material fornecido identifica o testemunho inglês de domínio público como base e informa que a revisão direta do grego ainda está pendente. A aparente mudança entre o singular genérico (“uma pessoa”) e o plural (“as pessoas”) foi suavizada apenas o necessário para a naturalidade em português, sem eliminar o caráter geral da advertência.
