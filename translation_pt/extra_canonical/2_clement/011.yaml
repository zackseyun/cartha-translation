base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/011.yaml
  text: 'Therefore, let us serve God with a pure heart, and we shall be righteous; but if we do not serve him because we do not believe the promise of God, we shall be wretched.


    For the word of prophecy also says: “Wretched are the double-minded, who doubt in their hearts and say, ‘We heard these things long ago, in the days of our fathers also; yet we have waited day after day and seen none of them.’”


    You fools! Compare yourselves to a tree; take a vine. First it sheds its leaves, then a shoot comes, after this a sour berry, then a fully ripe grape.


    So likewise my people had tumults and afflictions, but afterward they shall receive good things.


    Therefore, my brethren, let us not be double-minded, but endure patiently in hope, that we also may obtain our reward.


    For faithful is he who promised to pay to each person the recompense of their works.


    Therefore, if we shall have wrought righteousness in the sight of God, we shall enter into his kingdom and receive the promises which ear has not heard, nor eye seen, nor eye seen, neither has it entered into the heart of man.'
translation:
  language: pt
  text: '**2 Clemente 11**


    Portanto, sirvamos a Deus com coração puro, e seremos justos. Mas, se não o servirmos por não crermos na promessa de Deus, seremos miseráveis.


    Pois a palavra profética também diz: “Miseráveis são os de ânimo dividido[a], os que duvidam no coração e dizem: ‘Ouvimos estas coisas também no tempo de nossos pais; nós, porém, esperamos dia após dia e não vimos nenhuma delas.’


    “Insensatos! Comparem a si mesmos com uma árvore; tomem como exemplo uma videira. Primeiro, ela perde as folhas; depois surge um broto; em seguida, uma uva verde[b]; por fim, uma uva plenamente madura.


    “Assim também meu povo passou por desordens e aflições, mas depois receberá coisas boas.”


    Por isso, meus irmãos, não sejamos de ânimo dividido, mas perseveremos pacientemente na esperança, para que também recebamos nossa recompensa.


    Pois fiel é aquele que prometeu retribuir a cada um segundo as suas obras.


    Portanto, se praticarmos a justiça diante de Deus, entraremos no seu Reino e receberemos as promessas que ouvido algum ouviu, olho algum viu e que jamais subiram ao coração humano.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, pessoas interiormente divididas, indecisas entre confiar e duvidar.
    reason: Esclarece uma expressão grega compacta cuja tradução literal, “de duas almas”, seria pouco natural e poderia ser mal compreendida.
  - marker: b
    text: 'Ou: “uma uva ainda não madura”.'
    reason: Explicita que a imagem descreve uma etapa do amadurecimento da videira.
  - marker: c
    text: A testemunha inglesa fornecida repete “nem olho viu”. A forma grega corrente desta passagem traz a expressão uma só vez.
    reason: Registra uma divergência textual relevante e explica por que a duplicação inglesa não foi reproduzida.
lexical_decisions:
- source_word: καθαρᾷ καρδίᾳ
  choice: com coração puro
  rationale: Mantém a imagem antropológica e moral do coração como centro interior, em linguagem portuguesa natural e tradicional.
- source_word: δίψυχοι / διψυχῶμεν
  choice: os de ânimo dividido / não sejamos de ânimo dividido
  rationale: Expressa literalmente a ideia de duplicidade ou divisão interior sem reduzi-la apenas a dúvida intelectual; a repetição preserva a ligação interna do capítulo.
- source_word: ὄμφαξ
  choice: uva verde
  rationale: Designa a uva ainda não madura; esta forma é mais clara no português corrente do que “uva azeda”, que poderia indicar sabor ou variedade, não estágio de crescimento.
- source_word: ἀκαταστασίας
  choice: desordens
  rationale: Preserva o campo semântico de instabilidade, perturbação ou tumulto, sem especificar indevidamente se eram conflitos políticos, sociais ou religiosos.
- source_word: μακροθυμήσαντες ἐπ᾽ ἐλπίδι
  choice: perseveremos pacientemente na esperança
  rationale: Comunica tanto a constância paciente quanto a orientação da espera para a esperança.
- source_word: ἀντιμισθίας
  choice: retribuir
  rationale: Mantém a noção de recompensa ou retorno correspondente às obras, evitando restringir o termo a pagamento monetário.
theological_decisions:
- issue: Relação entre servir a Deus e ser justo
  choice: “sirvamos a Deus com coração puro, e seremos justos”
  alternative: “sirvamos a Deus com coração puro, mostrando que somos justos”
  rationale: A formulação mantém a sequência e a tensão do texto, sem inserir uma explicação teológica que transforme o segundo enunciado em mera evidência do primeiro.
- issue: Retribuição segundo as obras
  choice: “retribuir a cada um segundo as suas obras”
  alternative: “dar a cada um a recompensa por suas boas obras”
  rationale: A opção não limita antecipadamente as obras às boas nem define a natureza da retribuição, preservando a amplitude do enunciado.
- issue: Entrada no Reino condicionada à prática da justiça
  choice: “se praticarmos a justiça diante de Deus, entraremos no seu Reino”
  alternative: “se formos considerados justos diante de Deus, entraremos no seu Reino”
  rationale: O verbo indica fazer ou praticar a justiça; a tradução evita substituir a ação por uma declaração forense não explicitada nesta frase.
- issue: Número de ocorrências de “olho algum viu” na frase final
  choice: Uma ocorrência, conforme a forma grega conhecida da passagem
  alternative: Repetir a expressão, acompanhando literalmente a testemunha inglesa fornecida
  rationale: A repetição na testemunha inglesa parece ser duplicação de transmissão ou edição e não pertence à forma grega corrente; a nota registra a divergência com transparência.
translation_notes:
  register: Português moderno, digno e acessível, com construções de ampla compreensão internacional e boa legibilidade brasileira. Preservaram-se as imagens agrícolas, as repetições argumentativas e as afirmações teologicamente tensas. As citações proféticas foram pontuadas como um bloco contínuo. Como o material fornecido declara pendente a revisão direta do grego, as decisões foram confrontadas com a forma grega corrente conhecida de 2 Clemente 11 e a divergência mais visível da testemunha inglesa foi documentada em nota.
