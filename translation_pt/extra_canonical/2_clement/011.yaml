  verdict: revise
  source_fidelity: A tradução preserva bem a argumentação, as imagens e os termos principais do capítulo. Contudo, em 11.3, “cacho maduro” altera a imagem do original/testemunha, que contrasta uma uva verde (ou azeda, ainda imatura) com uma uva plenamente madura; não se deve mudar o fruto para um cacho. A omissão de “todas” em 11.2 evita uma pequena explicitação não necessária.
  naturalness: O português é moderno, claro e de registro apropriado. “Ouvido algum ouviu, olho algum viu” é uma formulação solene, mas natural no contexto de citação profética. “Uva plenamente madura” mantém paralelismo e precisão agrícola melhores que “cacho maduro”.
  terminology: “Coração puro”, “ânimo dividido”, “justiça”, “Reino” e “recompensa” são escolhas adequadas e coerentes. “Uva verde” para ὄμφαξ é uma boa solução. A nota sobre a repetição de “nem olho viu” documenta com transparência a divergência da testemunha inglesa, sem introduzir leitura doutrinária.
