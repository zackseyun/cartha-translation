review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o testemunho inglês fornecido e preserva adequadamente a distinção entre os que serviram a Deus e os ímpios que são julgados, bem como o caráter futuro do juízo. Contudo, “instrumentos do diabo” não representa naturalmente “engines/devices of the devil” neste contexto: trata-se de suas maquinações ou artifícios, não de instrumentos que lhe pertençam. A revisão direta do grego continua pendente, conforme indicado no contexto.'
  naturalness: O texto é geralmente claro e de registro apropriado. “Um pecador por completo” soa pouco idiomático em português contemporâneo; “um grande pecador” comunica a intensificação sem artificialidade. “Em meio às maquinações do diabo” é simultaneamente mais natural e mais fiel à imagem de artifícios ou estratagemas.
  terminology: “Dar graças”, “ímpios”, “justiça” e “juízo” são escolhas estáveis, compreensíveis e adequadas ao tom exortativo. “Maquinações do diabo” evita interpretar a expressão como uma categoria doutrinária específica, preservando sua abertura imagética.
  issues:
  - severity: medium
    issue: “instrumentos do diabo” para “engines/devices of the devil”
    rationale: Em português, a expressão sugere ferramentas utilizadas pelo diabo ou pessoas que lhe servem como instrumentos. O contexto descreve o autor como estando em meio a suas maquinações/artifícios; essa formulação conserva melhor a relação e a imagem do testemunho.
  - severity: low
    issue: “um pecador por completo”
    rationale: A formulação é compreensível, mas pouco natural no português moderno. “Um grande pecador” mantém a forte autodepreciação de “utter sinner” com fluência idiomática.
  revised_text: 'Portanto, sejamos também contados entre os que dão graças, entre os que têm servido a Deus, e não entre os ímpios que são julgados.


    Pois eu mesmo também sou um grande pecador e ainda não escapei da tentação, mas continuo em meio às maquinações do diabo. Mesmo assim, esforço-me para buscar a justiça, a fim de conseguir ao menos aproximar-me dela, pois temo o juízo que há de vir.'
  revised_footnotes: []
  revision_rationale: Foram feitas apenas correções seguras de idiomaticidade e de precisão imagética. “Maquinações” traduz de modo natural o campo semântico de devices/engines, sem especificar se são armadilhas, ataques ou tentações. “Grande pecador” substitui uma construção pouco idiomática sem atenuar a intensidade da autodescrição. “Juízo” é preferível aqui como termo bíblico-literário corrente, mantendo o sentido judicial e escatológico de “judgment”.
