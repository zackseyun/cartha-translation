base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/018.yaml
  text: 'Therefore, let us also be found among those who give thanks, among those who have served God, and not among the ungodly who are judged.


    For I myself am also an utter sinner. I have not yet escaped temptation but am still surrounded by the devices of the devil. Yet I strive to pursue righteousness, so that I may at least succeed in coming near to it, because I fear the judgment to come.'
translation:
  language: pt
  text: 'Portanto, sejamos também contados entre os que dão graças, entre os que têm servido a Deus, e não entre os ímpios que são julgados.


    Pois eu mesmo também sou um pecador por completo e ainda não escapei da tentação, mas continuo em meio aos instrumentos do diabo. Mesmo assim, esforço-me para buscar a justiça, a fim de conseguir ao menos chegar perto dela, pois temo o julgamento que há de vir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: give thanks
  choice: dão graças
  rationale: Expressão portuguesa natural que conserva o sentido de gratidão ativa presente no testemunho.
- source_word: utter sinner
  choice: um pecador por completo
  rationale: Mantém a forte autocaracterização do autor sem recorrer a uma formulação excessivamente técnica ou denominacional.
- source_word: engines of the devil
  choice: instrumentos do diabo
  rationale: Preserva a imagem concreta e relativamente aberta do testemunho, sem especificá-la indevidamente como armadilhas, ataques ou tentações.
- source_word: follow after righteousness
  choice: buscar a justiça
  rationale: Comunica esforço persistente em direção à justiça em português corrente e digno.
- source_word: judgment to come
  choice: julgamento que há de vir
  rationale: Conserva a orientação futura e o tom escatológico sem acrescentar uma definição doutrinária.
theological_decisions:
- issue: Natureza da tentação ainda não superada
  choice: ainda não escapei da tentação
  alternative: ainda não venci a tentação
  rationale: “Escapar” acompanha mais de perto o testemunho e evita sugerir que o autor esteja definindo a experiência exclusivamente como uma vitória moral interior.
- issue: Relação entre esforço humano e justiça
  choice: esforço-me para buscar a justiça
  alternative: procuro alcançar a justiça
  rationale: Mantém o esforço e a direção expressos no texto, sem afirmar aquisição meritória ou perfeição já alcançada.
- issue: Condição dos ímpios diante do juízo
  choice: os ímpios que são julgados
  alternative: os ímpios que serão condenados
  rationale: Preserva a formulação judicial sem transformar “julgados” em “condenados”, resultado mais específico que o texto fornecido não exige.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom exortativo e digno. A redação é provisória porque o material fornecido identifica como base imediata um testemunho inglês de domínio público e informa que a revisão direta do grego ainda está pendente. Por isso, foram evitadas decisões excessivamente específicas nos pontos imagéticos ou teológicos potencialmente dependentes do texto grego.
