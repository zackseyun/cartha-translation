base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/016.yaml
  text: 'Therefore, brothers and sisters, since we have found no small opportunity for repentance, seeing that we have time, let us return to God who called us, while we still have One who receives us.


    For if we bid farewell to these enjoyments and conquer our soul by refusing to fulfill its evil desires, we shall be partakers of the mercy of Jesus.


    But you know that the day of judgment comes even now as a burning oven, and the powers of the heavens shall melt, and all the earth as lead melting on the fire; and then the secret and open works of human beings shall appear.


    Almsgiving, therefore, is a good thing, even as repentance from sin&gt; Fasting is better than prayer, but almsgiving better than both. And love covers a multitude of sins, but prayer out of a good conscience delivers from death. Blessed is everyone found full of these. For almsgiving lifts off the burden of sin.'
translation:
  language: pt
  text: 'Portanto, irmãos e irmãs, já que encontramos uma oportunidade nada pequena para o arrependimento e ainda temos tempo, voltemos para Deus, que nos chamou, enquanto ainda há quem nos receba.


    Pois, se renunciarmos a estes prazeres e dominarmos nossa alma, recusando-nos a satisfazer seus maus desejos, participaremos da misericórdia de Jesus.


    Mas vocês sabem que o dia do juízo já vem como uma fornalha ardente; as forças dos céus se derreterão, e toda a terra será como chumbo que se derrete no fogo. Então serão reveladas as obras humanas, tanto as ocultas como as manifestas.


    Dar esmolas, portanto, é algo bom, assim como arrepender-se do pecado. O jejum é melhor do que a oração, mas dar esmolas é melhor do que ambos.[a] O amor cobre uma multidão de pecados, e a oração feita com boa consciência livra da morte. Feliz é todo aquele que for encontrado cheio dessas coisas, pois dar esmolas alivia o peso do pecado.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto afirma diretamente esta ordem de valor entre jejum, oração e esmolas; ela foi preservada sem harmonização teológica.
    reason: A formulação pode causar tensão teológica e deve permanecer transparente ao leitor.
  - marker: b
    text: 'Também se pode traduzir: “remove o fardo do pecado”.'
    reason: Registra uma alternativa mais formal para a metáfora do testemunho e evita sugerir uma precisão doutrinária ausente.
lexical_decisions:
- source_word: brethren
  choice: irmãos e irmãs
  rationale: Expressa naturalmente o sentido comunitário inclusivo do vocativo, com ampla legibilidade em português moderno.
- source_word: repentance
  choice: arrependimento / arrepender-se
  rationale: Mantém a linguagem moral e religiosa tradicional sem recorrer a terminologia denominacional específica.
- source_word: conquer our soul
  choice: dominarmos nossa alma
  rationale: Preserva a imagem forte de subjugar os desejos da própria alma, sem suavizá-la para mero autocontrole.
- source_word: powers of the heavens
  choice: forças dos céus
  rationale: Conserva a amplitude da expressão, que pode referir-se às potências ou estruturas celestes, sem decidir entre essas leituras.
- source_word: almsgiving
  choice: dar esmolas
  rationale: Forma verbal clara e corrente que comunica a prática concreta de auxílio aos necessitados.
- source_word: love
  choice: amor
  rationale: Preserva a formulação proverbial e sua ressonância bíblica.
theological_decisions:
- issue: Relação entre esmolas, pecado e misericórdia
  choice: Manter as afirmações de que dar esmolas é superior ao jejum e à oração e alivia o peso do pecado
  alternative: Atenuar como simples evidência de arrependimento ou boa obra
  rationale: O texto apresenta essas relações diretamente; reinterpretá-las introduziria uma harmonização teológica alheia ao testemunho fornecido.
- issue: A oração que livra da morte
  choice: Traduzir literalmente como “livra da morte”
  alternative: Especificar morte espiritual, condenação ou perigo físico
  rationale: O referente de “morte” permanece aberto no testemunho, e a tradução não deve resolver essa ambiguidade.
- issue: “One who receives us”
  choice: “enquanto ainda há quem nos receba”
  alternative: Identificar explicitamente Deus, Cristo ou um mediador
  rationale: A formulação conserva a referência implícita e evita acrescentar uma identificação não expressa no testemunho disponível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais para leitores brasileiros. O testemunho fornecido é uma tradução inglesa de domínio público, e a revisão direta do grego ainda está pendente; por isso, decisões que dependem da forma grega devem ser consideradas provisórias. O erro tipográfico “sin&gt;” foi entendido como fim de frase.
