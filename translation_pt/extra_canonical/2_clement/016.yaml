review_pass:
  verdict: revise
  source_fidelity: A redação segue de perto o testemunho inglês e preserva adequadamente as formulações moralizantes e escatológicas, inclusive a comparação da terra ao chumbo derretido e a ordem explícita entre jejum, oração e esmolas. Contudo, «enquanto ainda há quem nos receba» torna impessoal uma construção que diz que «ainda temos Aquele/quem nos recebe».
  naturalness: O português é moderno, claro e apropriado ao registro exortativo. «Enquanto ainda temos quem nos receba» é simultaneamente mais idiomático e mais próximo da relação possessiva expressa no testemunho.
  terminology: «Arrependimento», «alma», «juízo», «esmolas», «boa consciência» e «morte» são escolhas adequadas. «Forças dos céus» mantém prudentemente a abertura de «powers of the heavens».
  issues:
  - severity: medium
    issue: Referência impessoal em «enquanto ainda há quem nos receba»
    rationale: O testemunho afirma «while we still have One that receiveth us». A forma impessoal «há quem» enfraquece e altera a relação expressa por «temos», além de poder sugerir mera disponibilidade genérica. «Ainda temos quem nos receba» preserva a construção sem identificar indevidamente o referente implícito.
