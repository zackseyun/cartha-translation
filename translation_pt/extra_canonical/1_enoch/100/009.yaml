base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/009.yaml
  text: 'Woe to you[a], sinners, because of the words of your mouth and because of the deeds of your hands[b], which your wickedness has done: in the heat of a flame more burning than fire you shall burn.'
translation:
  language: pt
  text: 'Ai de vocês, pecadores, por causa das palavras de sua boca e das obras de suas mãos, que a sua impiedade produziu[a]: no calor de uma chama mais ardente que o fogo, vocês arderão[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção que relaciona a impiedade às palavras e às obras é sintaticamente difícil. Também pode ser traduzida de modo mais literal: “que sua impiedade fez”.'
    reason: syntactic_ambiguity
  - marker: b
    text: A transcrição fornecida traz uma forma verbal que pode ser entendida como “arderá”, mas a leitura da edição crítica citada nos dados é “vocês arderão”.
    reason: textual_variant
lexical_decisions:
- source_word: አሌ
  choice: Ai de vocês
  rationale: Preserva a fórmula de denúncia e juízo, mais forte que uma simples expressão de lamento.
- source_word: ኃጥኣን
  choice: pecadores
  rationale: Designação direta e corrente para os destinatários do juízo.
- source_word: ዲበ
  choice: por causa de
  rationale: Explicita a força causal que apresenta os motivos da condenação.
- source_word: ነገረ አፉክሙ
  choice: as palavras de sua boca
  rationale: Mantém a imagem corporal concreta e o paralelismo com as obras das mãos.
- source_word: ተግባረ እዴክሙ
  choice: as obras de suas mãos
  rationale: Conserva o paralelismo formal e a expressão semítica de agência.
- source_word: ርስዓኒክሙ
  choice: sua impiedade
  rationale: Comunica tanto maldade quanto irreverência religiosa, sem restringir o termo à mera ausência de crença.
- source_word: በዋዕየ ላህብ እምእሳት
  choice: no calor de uma chama mais ardente que o fogo
  rationale: Preserva a intensidade da imagem e a força comparativa de እም, atestada na revisão crítica.
- source_word: ይውዒ
  choice: vocês arderão
  rationale: Segue a leitura crítica de segunda pessoa do plural indicada nos dados, em vez da forma singular aparente da transcrição.
theological_decisions:
- issue: Se o vício que produz palavras e obras deve ser expresso em termos apenas morais ou também religiosos
  choice: sua impiedade
  alternative: sua maldade
  rationale: “Impiedade” preserva a dimensão religioso-moral do termo, sem importar uma categoria doutrinária posterior.
- issue: Relação sintática da impiedade com as palavras e as obras
  choice: feitas por sua impiedade
  alternative: que sua impiedade fez
  rationale: A construção etíope é difícil; esta redação liga a impiedade ao conjunto das palavras e obras, mas a nota registra a incerteza.
- issue: Pessoa e número do verbo final
  choice: vocês arderão
  alternative: arderá
  rationale: Adota a leitura da edição crítica mencionada na revisão, ትውዕዩ, coerente com o destinatário plural, enquanto registra em nota a divergência da transcrição fornecida.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento por “vocês”. Preservam-se o paralelismo entre boca e mãos, a intensidade apocalíptica e as ambiguidades sintática e textual por meio de notas.
