  naturalness: O português é claro, moderno e apropriado ao registro apocalíptico. “Filhos da terra” conserva deliberadamente a expressão característica sem prejudicar a compreensão. “Tudo o que diz este livro” é uma forma natural de comunicar a abrangência de “todo assunto/coisa deste livro”.
  terminology: “Homens sábios”, “filhos da terra”, “riquezas”, “salvá-los” e “pecados” são escolhas consistentes e compreensíveis. A formulação “da destruição causada por seus pecados” interpreta de modo explícito uma relação provável, e a nota oferece as alternativas mais formais necessárias para preservar a ambiguidade sintática.
