base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/006.yaml
  text: And wise men will see[a], and all the children of the earth will understand every matter of this book[c][b], and they will know that their wealth cannot save them from the destruction of their sins.
translation:
  language: pt
  text: E homens sábios verão[a], e todos os filhos da terra compreenderão tudo o que diz este livro, e saberão que suas riquezas não poderão salvá-los da destruição causada por seus pecados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “verão verdadeiramente” ou, possivelmente, “verão a verdade”. A função de እሙነ nesta frase é incerta.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “não poderão salvá-los na ruína de seus pecados” ou “da ruína de seus pecados”.'
    reason: source_ambiguity
lexical_decisions:
- source_word: እሙነ፡ ይሬእዩ፡ ሰብአ፡ ጠቢባን
  choice: E homens sábios verão
  rationale: A sequência contém dificuldade textual e lexical. ሰብአ ጠቢባን designa claramente homens ou pessoas sábias, e ይሬእዩ significa 'verão'. እሙነ pode ser entendido como 'verdadeiramente' ou possivelmente 'a verdade', mas sua função não é segura; por isso, o texto principal não acrescenta um objeto incerto e registra as opções em nota.
- source_word: ውሉደ፡ ምድር
  choice: todos os filhos da terra
  rationale: Mantém a expressão antropológica característica do registro apocalíptico, em vez de achatá-la para 'habitantes da terra'.
- source_word: ኵሎ፡ ነገረ፡ ዛቲ፡ መጽሐፍ
  choice: tudo o que diz este livro
  rationale: ነገር possui amplitude semântica ('coisa', 'assunto', 'palavra'). A formulação portuguesa é natural e comunica o conteúdo integral do livro sem restringi-lo apenas a palavras isoladas.
- source_word: ያእምሩ
  choice: saberão
  rationale: O verbo expressa conhecimento ou compreensão. 'Saberão' distingue esta segunda percepção da compreensão do conteúdo do livro na oração anterior.
- source_word: ብዕሎሙ
  choice: suas riquezas
  rationale: O termo significa os bens ou a riqueza deles e funciona como sujeito da incapacidade de salvar, não como pronome reflexivo.
- source_word: ኢይክል፡ ብዕሎሙ፡ አድኅኖቶሙ
  choice: suas riquezas não poderão salvá-los
  rationale: Preserva tanto o sujeito explícito, 'suas riquezas', quanto o objeto, 'salvá-los', corrigindo a leitura que faria da expressão uma tentativa de salvar a si mesmos.
- source_word: በመዳቀ፡ ኃጢአቶሙ
  choice: da destruição causada por seus pecados
  rationale: መዳቀ aponta para queda, esmagamento ou ruína, e não para negação dos pecados. A formulação explicita em português a relação provável entre os pecados e a destruição, enquanto uma alternativa mais formal é preservada em nota.
theological_decisions:
- issue: O agente da salvação frustrada
  choice: A riqueza deles é incapaz de salvá-los.
  alternative: Eles não conseguem salvar a si mesmos.
  rationale: ብዕሎሙ significa 'suas riquezas' e deve permanecer como sujeito. Assim, o verso denuncia a impotência da riqueza diante do juízo, sem transformar a frase numa afirmação geral sobre autossalvação.
- issue: A relação entre pecados e destruição
  choice: A destruição é apresentada como decorrente dos pecados.
  alternative: A riqueza não pode salvá-los 'na ruína de seus pecados' ou 'da ruína de seus pecados'.
  rationale: A construção ge'ez é compacta e admite mais de uma articulação em português. O texto principal oferece a relação causal mais inteligível no contexto de juízo, mas a nota conserva uma tradução mais formal e a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva-se 'filhos da terra' pelo caráter apocalíptico da expressão. As duas dificuldades principais — እሙነ no início e a relação sintática da frase final — são documentadas sem impor certeza indevida.
