base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/005.yaml
  text: And he will appoint guardians from among the holy angels over all the righteous and holy ones[a], and they will guard them like the pupil of an eye, until every evil and every sin comes to an end. And even if the righteous sleep a long sleep[c][b], they have nothing to fear.
translation:
  language: pt
  text: E ele designará guardiões dentre os santos anjos para cuidar de todos os que são justos e santos, e eles os guardarão como a pupila do olho[a], até que todo mal e todo pecado cheguem ao fim. E, mesmo que os justos durmam um longo sono[b], nada terão a temer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Como a pupila do olho” é uma imagem de algo protegido com extremo cuidado; compare a expressão bíblica mais conhecida “como a menina dos olhos”.
    reason: lexical_alternative
  - marker: b
    text: O “longo sono” provavelmente se refere à morte ou ao estado dos mortos, mas o próprio texto conserva o eufemismo do sono.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዐቀብተ
  choice: guardiões
  rationale: Expressa o sentido nominal de pessoas encarregadas de guardar, sem confundir o termo com a designação técnica dos Vigilantes em 1 Enoque.
- source_word: ይሁብ
  choice: designará
  rationale: Embora o verbo possa significar literalmente “dará”, a construção indica atribuição de uma função de proteção.
- source_word: ጻድቃን ወቅዱሳን
  choice: todos os que são justos e santos
  rationale: Apresenta os dois qualificativos como descrição da comunidade protegida e evita sugerir, por uma colocação ambígua, que essas pessoas pertençam aos anjos.
- source_word: እመላእክት ቅዱሳን
  choice: dentre os santos anjos
  rationale: 'A expressão indica a procedência dos guardiões: eles são escolhidos entre os anjos santos.'
- source_word: የዐቅብዎሙ
  choice: eles os guardarão
  rationale: Mantém a repetição da raiz ligada a guardar e torna explícita a ação protetora dos guardiões.
- source_word: ከመ ብንተ ዐይን
  choice: como a pupila do olho
  rationale: Conserva a imagem concreta da parte do olho protegida com extremo cuidado, sem substituí-la automaticamente pela expressão tradicional “menina dos olhos”.
- source_word: እስከ ይዌድእ ኵሉ እኩየ ወኵሉ ኃጢአተ
  choice: até que todo mal e todo pecado cheguem ao fim
  rationale: Preserva a formulação relativamente neutra do texto quanto ao agente e ao modo pelo qual o mal e o pecado terminam.
- source_word: እመኒ
  choice: mesmo que
  rationale: Marca naturalmente em português a concessão introduzida no final do versículo.
- source_word: ይነውሙ ጻድቃን ንዋመ ነዋኅ
  choice: os justos durmam um longo sono
  rationale: Mantém a metáfora e sua ambiguidade, sem converter no texto principal o sono diretamente em morte.
- source_word: አልቦ ዘይፈረሁ
  choice: nada terão a temer
  rationale: Forma idiomática em português para a ausência de qualquer motivo ou objeto de temor.
theological_decisions:
- issue: Proteção angélica literal ou simples metáfora do cuidado divino
  choice: Manter a designação explícita de guardiões dentre os santos anjos
  alternative: Generalizar a imagem como proteção divina
  rationale: O texto identifica os guardiões como provenientes dos santos anjos; a tradução conserva essa concepção apocalíptica sem desmitologizá-la.
- issue: Sentido do longo sono
  choice: Conservar “durmam um longo sono” no texto principal
  alternative: Traduzir diretamente como “morram” ou “durmam na morte”
  rationale: A linguagem de sono pode aludir à morte ou ao estado dos mortos, mas o texto não abandona o eufemismo; preservá-lo mantém a imagem e a tensão interpretativa.
- issue: Agente do fim do mal e do pecado
  choice: Usar a construção não agentiva “cheguem ao fim”
  alternative: “Ele ponha fim a todo mal e a todo pecado”
  rationale: A forma fonte permite expressar o término sem tornar explícito um sujeito; a tradução evita acrescentar uma identificação que o versículo não formula diretamente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Para cuidar de” esclarece a relação dos guardiões com os justos sem alterar a ação principal, retomada de modo formal por “eles os guardarão”. Mantiveram-se a imagem apocalíptica, o paralelismo “todo mal e todo pecado” e a ambiguidade do sono.
