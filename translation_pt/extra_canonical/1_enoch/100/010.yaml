base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/010.yaml
  text: And now[a], know that your deeds will be investigated by the angels in heaven, and by the sun and the moon and the stars, concerning your sins[b], because upon the earth you execute judgment upon the righteous.
translation:
  language: pt
  text: E agora, saibam que as suas obras serão examinadas[a] pelos anjos no céu, pelo sol, pela lua e pelas estrelas, a respeito dos seus pecados, pois, na terra, vocês executam juízo contra os justos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão investigadas” ou “serão procuradas”. O verbo etíope admite a ideia de busca, averiguação ou exame.
    reason: lexical_ambiguity
  - marker: b
    text: 'O texto etíope apresentado para este versículo está truncado depois de “E agora, saibam”. A continuação aqui traduzida é preservada na transcrição mais ampla do mesmo texto: ela declara que as obras serão examinadas pelas testemunhas celestiais a respeito dos pecados cometidos contra os justos.'
    reason: textual_variant
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Preserva a fórmula de transição e a passagem para uma advertência, sem acrescentar uma ênfase que o português não exige.
- source_word: አእምሩ
  choice: saibam
  rationale: É um imperativo plural do verbo que significa saber ou compreender. “Saibam” comunica diretamente a exortação e deixa claro o número plural.
- source_word: ይትኀሠሥ
  choice: serão examinadas
  rationale: O verbo pode indicar procurar, averiguar ou investigar. No contexto das obras submetidas ao testemunho celestial, “serão examinadas” é natural e conserva o sentido de averiguação.
- source_word: ምግባሪክሙ
  choice: as suas obras
  rationale: “Obras” expressa os atos ou a conduta dos destinatários e mantém o vocabulário ético do texto.
- source_word: በእንተ፡ ኃጢአቲክሙ
  choice: por causa dos seus pecados
  rationale: A locução introduz a matéria ou causa da averiguação. Esta formulação é clara em português, embora “a respeito dos seus pecados” também seja possível.
- source_word: ትገብሩ፡ ኵነኔ
  choice: vocês proferem sentença
  rationale: A expressão significa fazer ou executar juízo. “Proferem sentença” evita sugerir apenas uma avaliação mental e ressalta a ação judicial praticada contra os justos.
- source_word: ጻድቃን
  choice: os justos
  rationale: É a designação plural comum para pessoas justas; a tradução preserva seu sentido moral e judicial sem especificar uma identidade confessional.
theological_decisions:
- issue: Agentes ou testemunhas celestiais do exame
  choice: pelos anjos no céu, pelo sol, pela lua e pelas estrelas
  alternative: diante dos anjos no céu, do sol, da lua e das estrelas
  rationale: A construção com preposições de origem ou agência permite entender esses seres e luminares como participantes do exame. A tradução mantém essa leitura sem explicar como corpos celestes poderiam exercer tal função.
- issue: Natureza do juízo praticado contra os justos
  choice: proferem sentença contra os justos
  alternative: executam juízo sobre os justos
  rationale: A escolha conserva a acusação de uma ação judicial hostil sem decidir se se trata de condenação formal, perseguição ou julgamento injusto em sentido mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para tornar explícito o plural do imperativo e dos sufixos. A sintaxe conserva o encadeamento solene da advertência apocalíptica, mas evita construções excessivamente literais ou arcaicas.
