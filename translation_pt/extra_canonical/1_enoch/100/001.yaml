base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/001.yaml
  text: And in those days[a], in one place, fathers together with their sons will be struck down[d][c][b], and brothers together with their companions will fall in death until a stream flows from their blood.
translation:
  language: pt
  text: E, naqueles dias, num só lugar[a], pais com seus filhos serão abatidos[b][d], e irmãos com seus companheiros cairão mortos, até que uma torrente corra do sangue deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão etíope neste ponto é textualmente difícil; “num só lugar” é uma tradução locativa cautelosa.
    reason: textual_variant
  - marker: b
    text: Também poderia ser traduzido por “serão feridos de morte”. A forma passiva não identifica quem os ataca.
    reason: lexical_alternative
  - marker: c
    text: 'A imagem é intencionalmente intensa: o derramamento de sangue é tão grande que forma uma torrente.'
    reason: cultural_note
  - marker: d
    text: A transcrição disponível traz uma forma que já foi entendida como “golpearão uns aos outros”; contudo, a leitura corrigida do testemunho favorece “serão abatidos”.
    reason: previous_rendering
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: naqueles dias
  rationale: Mantém a fórmula temporal apocalíptica e seu tom profético solene.
- source_word: በ፻መካን
  choice: num só lugar
  rationale: A forma transmitida é textualmente difícil, mas parece ter sentido locativo singular; a tradução é deliberadamente cautelosa.
- source_word: አበው ምስለ ውሉዶሙ
  choice: pais com seus filhos
  rationale: Preserva os termos concretos de parentesco e o forte paralelismo familiar.
- source_word: ይትኃድኡ (provável erro de transcrição por ይትጐድኡ)
  choice: serão abatidos
  rationale: A leitura corrigida representa uma forma passiva de violência, em conformidade com a revisão textual; 'abatidos' comunica tanto o golpe quanto seu resultado fatal sem impor ação recíproca.
- source_word: አኀው ምስለ ቢጾሙ
  choice: irmãos com seus companheiros
  rationale: '''Companheiros'' conserva a amplitude relacional do substantivo, sem restringi-lo a amigos íntimos ou vizinhos.'
- source_word: ይወድቁ በሞት
  choice: cairão mortos
  rationale: Expressa em português natural a imagem solene de cair na morte.
- source_word: እስከ ይውኅዝ ትክዚ እምደመ ዚአሆሙ
  choice: até que uma torrente corra do sangue deles
  rationale: Conserva a sequência e a hipérbole concreta do ge'ez, sem transformá-la explicitamente em comparação.
theological_decisions:
- issue: Natureza da imagem de violência
  choice: colapso social concreto expresso por hipérbole apocalíptica
  alternative: discórdia puramente metafórica ou descrição estritamente militar
  rationale: O texto retrata parentes e companheiros mortos e sangue correndo em abundância. A formulação mantém a violência concreta e a intensidade apocalíptica sem reduzir a cena a uma abstração nem especificar um campo de batalha.
- issue: Agente da morte dos pais e filhos
  choice: manter a construção passiva, sem identificar o agente
  alternative: apresentá-los como pessoas que golpeiam umas às outras
  rationale: A leitura textual revisada favorece o passivo. Não se acrescenta um agente nem se transforma a ação em violência recíproca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe preserva as duas orações paralelas do ge'ez e mantém a força da imagem apocalíptica sem recorrer a linguagem arcaica.
