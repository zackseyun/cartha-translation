base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/004.yaml
  text: In those days the angels will descend into the hidden places and gather together into one place all those who led others into sin[c][b][a]; and the Most High will arise on that day of judgment to execute great judgment in the midst of the sinners.
translation:
  language: pt
  text: Naqueles dias, os anjos descerão aos lugares ocultos[a] e reunirão num só lugar todos os que levaram outros a pecar[b]; e o Altíssimo se levantará naquele dia de julgamento para executar um grande julgamento em meio aos pecadores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lugares ocultos” também pode ser traduzido como “lugares secretos” ou “esconderijos”.
    reason: lexical_alternative
  - marker: b
    text: A expressão é difícil. Mais literalmente, pode significar “todos os que ajudaram o pecado”; também pode ser entendida como “os que favoreceram o pecado”.
    reason: lexical_and_textual_difficulty
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e o substantivo concreto “dias”.
- source_word: መላእክት
  choice: os anjos
  rationale: Neste cenário de descida e julgamento, o referente sobrenatural é o sentido contextual mais provável.
- source_word: ይወርዱ
  choice: descerão
  rationale: Mantém a imagem vertical da vinda dos seres celestiais.
- source_word: ውስተ ምኅባእት
  choice: aos lugares ocultos
  rationale: Expressa o valor local plural sem especificar indevidamente que tipo de esconderijo está em vista.
- source_word: ወይገብእዎሙ በአሐዱ መካን
  choice: e reunirão num só lugar
  rationale: Comunica tanto a reunião quanto o movimento para um local comum, de modo natural em português.
- source_word: ለእሉ እለ ይወርደዋ ለኃጢአት
  choice: aqueles que fizeram o pecado descer
  rationale: A transcrição fornecida contém uma forma ligada a “descer”; a tradução conserva essa imagem difícil em vez de reduzi-la simplesmente a “pecadores”. Uma nota registra a variante manuscrita e as possíveis interpretações.
- source_word: ወይትነሣእ ልዑል
  choice: e o Altíssimo se levantará
  rationale: “Levantar-se” introduz naturalmente a ação divina, enquanto “Altíssimo” preserva o título tradicional sem acrescentar identificação doutrinária.
- source_word: በይእቲ ዕለት ኵነኔ
  choice: naquele dia de julgamento
  rationale: Mantém explicitamente tanto “dia” quanto “julgamento” na fórmula solene.
- source_word: ከመ ይግበር ኵነኔ ዐቢየ
  choice: para executar um grande julgamento
  rationale: Representa de maneira idiomática a realização efetiva do ato judicial e conserva a repetição de “julgamento”.
- source_word: እማእከሎሙ ለኃጥኣን
  choice: em meio aos pecadores
  rationale: Preserva a imagem de que o julgamento ocorre no meio deles, em vez de enfraquecê-la para uma relação meramente genérica.
theological_decisions:
- issue: Identidade das pessoas reunidas pelos anjos
  choice: Pessoas especificamente associadas à descida do pecado
  alternative: “os que ajudaram o pecado” ou, em interpretação explicativa, “os que levaram outros a pecar”
  rationale: A cláusula é textual e sintaticamente difícil. O texto principal segue a forma da fonte fornecida, enquanto a nota preserva a variante manuscrita e evita transformar silenciosamente o grupo em pecadores genéricos.
- issue: Título divino ልዑል
  choice: o Altíssimo
  alternative: o Exaltado
  rationale: “Altíssimo” é claro, corrente e preserva o peso do título divino sem importar uma identificação teológica posterior.
- issue: Ação do Altíssimo no julgamento
  choice: se levantará ... para executar um grande julgamento
  alternative: será exaltado ... para realizar um grande julgamento
  rationale: A leitura como ação de levantar-se se encaixa no início da intervenção judicial divina, sem eliminar a possível amplitude semântica do verbo.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a repetição deliberada de “julgamento” e a imagem apocalíptica da descida, sem resolver silenciosamente a dificuldade textual da cláusula central.
