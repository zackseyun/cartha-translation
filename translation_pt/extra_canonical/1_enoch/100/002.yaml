base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/002.yaml
  text: For a man will not withhold his hand from his sons[a], nor from the sons of his sons, to kill them; and the sinner will not withhold his hand from his honored brother[b]. From dawn until the sun sets they will slaughter one another.
translation:
  language: pt
  text: Pois o homem não refreará a mão contra seus filhos[a], nem contra os filhos de seus filhos, para matá-los; e o pecador não refreará a mão contra seu irmão honrado[b]. Desde o amanhecer até o pôr do sol, eles matarão uns aos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus descendentes”; o termo ge'ez pode ter sentido mais amplo do que descendência exclusivamente masculina.
    reason: lexical_alternative
  - marker: b
    text: “Seu irmão honrado” também pode ser traduzido por “seu irmão nobre”, conforme a ênfase recaia na honra pessoal ou na posição social.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢይከልእ እዴሁ
  choice: não conterá a mão
  rationale: Preserva a imagem concreta do idioma ge'ez de não reter ou refrear a mão, mantendo sua força violenta sem explicá-la em excesso.
- source_word: እምውሉዱ
  choice: contra seus filhos
  rationale: A preposição ligada ao idioma da mão é expressa naturalmente em português por “contra”; “filhos” mantém a concretude familiar, com a possível abrangência registrada em nota.
- source_word: ውሉደ ውሉዱ
  choice: os filhos de seus filhos
  rationale: Reproduz a estrutura repetitiva e a cadência familiar do ge'ez, em vez de condensá-la em “netos” ou “descendentes”.
- source_word: ከመ ይቅትሎ
  choice: para matá-los
  rationale: Expressa de modo conciso a finalidade ou o resultado da mão não contida.
- source_word: ኃጥእ
  choice: o pecador
  rationale: Mantém a categoria moral singular característica da linguagem enóquica de juízo.
- source_word: እኍሁ ክቡር
  choice: seu irmão honrado
  rationale: “Honrado” preserva a amplitude semântica de dignidade e honra sem determinar indevidamente uma posição social de nobreza.
- source_word: እምጎሕ እስከ ትዐርብ ፀሐይ
  choice: Desde o amanhecer até o pôr do sol
  rationale: Comunica o período inteiro do dia em linguagem natural e dignificada, conservando a imagem solar.
- source_word: ይትቃተሉ
  choice: matarão uns aos outros
  rationale: Representa a ação recíproca e letal do verbo; evita enfraquecê-la como mera luta e soa mais natural em português do que uma formulação excessivamente carregada.
theological_decisions:
- issue: Alcance da violência descrita
  choice: O versículo retrata um colapso social no qual nem os vínculos familiares nem a honra entre irmãos impedem o homicídio.
  alternative: Restringir a cena à violência de um campo de batalha ou entendê-la como provérbio hiperbólico sem referência familiar literal.
  rationale: A repetição específica de filhos, filhos dos filhos e irmão deve ser preservada como parte da imagem apocalíptica de juízo, sem ser reduzida a conflito genérico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é solene sem ser arcaico; conserva a repetição familiar, a imagem concreta da mão e a intensidade da cena apocalíptica.
