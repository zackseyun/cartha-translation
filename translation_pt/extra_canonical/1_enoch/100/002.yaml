  source_fidelity: A tradução preserva corretamente a sucessão de violência contra filhos, filhos dos filhos e irmão honrado, bem como a duração da matança e sua reciprocidade. «Pois» é compatível com a conjunção causal inicial. Contudo, «conterá a mão contra» não reproduz com naturalidade em português o idiomatismo de não reter/refrear a mão.
