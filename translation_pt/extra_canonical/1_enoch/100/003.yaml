base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/003.yaml
  text: And a horse will walk up to its chest in the blood of sinners[d][c][b][a], and chariots will sink up to their tops.
translation:
  language: pt
  text: E um cavalo avançará pelo sangue dos pecadores até o peito[a][b], e os carros afundarão até o topo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seu peito”, isto é, o peito do cavalo. Algumas traduções antigas trazem “freio”, possivelmente por aproximação com Apocalipse 14:20, mas o termo ge'ez aqui designa o peito ou tórax.
    reason: lexical_alternative
  - marker: b
    text: A forma traduzida por “avançará” é difícil. Ela pode ser entendida como verbo, “andará/irá”, como nesta tradução; outra análise a relaciona com “brancura”, o que produziria algo como “um cavalo branco”. O paralelismo com os carros que afundam favorece a leitura verbal.
    reason: textual_ambiguity
  - marker: c
    text: 'Ou: “até as partes superiores”. A expressão descreve os carros quase ou totalmente submersos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: የሐውር
  choice: avançará
  rationale: Entendido como forma verbal de ሐወረ, “andar/ir”. “Avançará” expressa o movimento do cavalo através do sangue e soa natural em português; a análise alternativa, ligada a “brancura”, é registrada em nota.
- source_word: ፈረስ
  choice: um cavalo
  rationale: Preserva o singular do ge'ez. O contexto pode conferir-lhe valor representativo, mas não é necessário convertê-lo em plural.
- source_word: እስከ እንግድዓሁ
  choice: até o peito
  rationale: እስከ marca o limite, e እንግድዓሁ é entendido como “seu peito”. Evita-se harmonizar o termo com os “freios” de Apocalipse 14:20.
- source_word: ውስተ ደመ ኃጥኣን
  choice: pelo sangue dos pecadores
  rationale: A preposição locativa descreve o sangue como o meio pelo qual o cavalo avança. “Pecadores” mantém a categoria moral explícita do original.
- source_word: ሰረገላት
  choice: os carros
  rationale: “Carros” é a forma portuguesa corrente para veículos de guerra antigos no registro bíblico; o contexto distingue-os do uso automobilístico moderno.
- source_word: እስከ መልዕልታ ትሰጠም
  choice: afundarão até o topo
  rationale: O contexto líquido favorece a imagem de submersão. መልዕልታ indica a parte superior ou o topo dos carros.
theological_decisions:
- issue: Categoria moral de ኃጥኣን
  choice: pecadores
  alternative: culpados; transgressores
  rationale: “Pecadores” traduz diretamente a categoria ética do texto sem acrescentar uma definição doutrinária posterior.
- issue: Relação com Apocalipse 14:20
  choice: manter “peito” conforme o léxico ge'ez
  alternative: “freio”, por harmonização com Apocalipse 14:20
  rationale: A semelhança das imagens não justifica substituir o termo anatômico desta testemunha por um elemento do equipamento equestre presente em outro texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para tornar inequívoco que “até o peito” se refere ao cavalo. Conservam-se o singular “um cavalo”, a hipérbole apocalíptica e a incerteza lexical relevante em nota.
