base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/007.yaml
  text: Woe to you[a], sinners, when you oppress the righteous on the day of fierce distress, and burn them with fire[b]; then you will be repaid according to your deeds.
translation:
  language: pt
  text: Ai de vocês, pecadores, quando oprimirem[a] os justos no dia de intensa aflição[b] e os queimarem com fogo! Então vocês serão retribuídos segundo as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode ser traduzido como “afligirem” ou “perseguirem”, conforme o grau de especificidade atribuído à violência contra os justos.
    reason: lexical_alternative
  - marker: b
    text: A expressão indica literalmente um “dia” marcado por aflição ou sofrimento de grande intensidade. “Dia de severa aflição” ou “dia de grande tribulação” também são traduções possíveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e a interpelação direta, em português atual e amplamente compreensível.
- source_word: ኃጥኣን
  choice: pecadores
  rationale: Mantém a designação moral e religiosa direta do texto, sem reduzi-la a mera transgressão social.
- source_word: ሶበ
  choice: quando
  rationale: Expressa naturalmente a circunstância temporal introduzida pelo termo ge'ez.
- source_word: ታመኒድብዎሙ
  choice: oprimirem
  rationale: Comunica tratamento cruel e aflitivo continuado sem limitar o sentido a uma forma específica de perseguição.
- source_word: ጻድቃን
  choice: os justos
  rationale: Conserva uma categoria ética central do vocabulário enóquico e bíblico.
- source_word: በዕለተ፡ ጻዕብ፡ ኃያል
  choice: no dia de intensa aflição
  rationale: Reproduz a ideia de um dia marcado por sofrimento de grande intensidade, evitando transformar 'tribulação' em termo técnico posterior.
- source_word: ታነድድዎሙ፡ በእሳት
  choice: os queimarem com fogo
  rationale: Mantém concreta e sem atenuação a imagem violenta do original.
- source_word: ወትትፈደዩ
  choice: vocês serão retribuídos
  rationale: Preserva a ideia passiva de retribuição e sua força judicial, sem explicitar um agente que o texto não nomeia.
- source_word: ከመ፡ ምግባራቲክሙ
  choice: segundo as suas obras
  rationale: Mantém a fórmula de correspondência entre a conduta e a retribuição; 'obras' é claro e conserva o peso moral do termo.
theological_decisions:
- issue: Agente e destinatários da retribuição final
  choice: Os próprios pecadores serão retribuídos segundo suas obras, sem identificação explícita de quem executa a retribuição.
  alternative: Entender a oração como uma declaração impessoal de retribuição ou atribuir expressamente a ação a Deus.
  rationale: A sequência verbal em segunda pessoa continua a interpelação aos pecadores. A construção passiva mantém certa a retribuição, mas preserva o silêncio do texto quanto ao agente e ao modo.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. O uso de “vocês” evita formas verbais arcaizantes, enquanto “Ai de”, “justos”, “aflição” e “obras” preservam o tom profético e judicial. A divisão antes de “Então” esclarece a passagem da violência praticada à retribuição, sem alterar a relação lógica do original.
