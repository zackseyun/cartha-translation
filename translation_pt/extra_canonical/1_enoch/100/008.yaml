base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/008.yaml
  text: 'Woe to you[a], hard of heart, who stay awake to devise evil: fear will come upon you[c][b], and there will be no one to help you.'
translation:
  language: pt
  text: Ai de vocês, duros de coração, que ficam acordados para planejar o mal[a]! O medo virá sobre vocês[b], e não haverá quem os ajude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode significar «ficam vigilantes» ou sugerir que permanecem à espreita; aqui, trata-se de uma atenção deliberadamente voltada para o mal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o medo alcançará vocês» ou «o medo os apanhará». O verbo pode significar encontrar, alcançar ou sobrevir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo, em linguagem bíblica clara e corrente.
- source_word: ግዙፋነ ልብ
  choice: duros de coração
  rationale: Expressa obstinação interior e insensibilidade moral sem reduzir a frase a mera emoção ou orgulho.
- source_word: ትተግሁ
  choice: ficam acordados
  rationale: Reflete o sentido de estar desperto ou vigilante e, neste contexto, a dedicação intencional ao mal, evitando a ideia específica de exercer a função de sentinela.
- source_word: ከመ ትሰብውዎ ለእኩይ
  choice: para planejar o mal
  rationale: A construção indica propósito; «planejar» comunica a elaboração deliberada do mal em português natural.
- source_word: ፍርሀት
  choice: o medo
  rationale: Mantém o valor amplo do substantivo, que pode variar entre medo e terror, sem intensificação indevida.
- source_word: ይረክብክሙ
  choice: virá sobre vocês
  rationale: Formulação natural que conserva a ideia de o medo alcançar ou sobrevir aos destinatários.
- source_word: ወአልቦ ዘይረድአክሙ
  choice: e não haverá quem os ajude
  rationale: Comunica claramente a ausência de auxílio ou livramento no juízo anunciado.
theological_decisions:
- issue: Natureza da denúncia
  choice: Uma declaração profética de desgraça contra pessoas moralmente obstinadas que enfrentam um juízo inevitável
  alternative: Um lamento geral pelos pecadores ou uma advertência meramente psicológica sobre a ansiedade
  rationale: A interjeição inicial, a descrição dos destinatários e a afirmação de que ninguém os ajudará formam um oráculo judicial, sem apagar sua tensão apocalíptica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa do plural foi vertida por «vocês», e os pronomes correspondentes por «os», evitando regionalismos marcados. A formulação conserva o tom profético e apocalíptico.
