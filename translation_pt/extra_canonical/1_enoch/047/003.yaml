base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/003.yaml
  text: In those days I saw the Head of Days[a], as he sat on the throne of his glory, and the books of the living were opened before him; and all his host, which is in the heights of heaven[e][d][c][b], and his council stood before him.
translation:
  language: pt
  text: Naqueles dias, vi o Cabeça dos Dias[a], quando ele se assentou no trono de sua glória, e os livros dos vivos[b] foram abertos diante dele; todo o seu exército, que está nas alturas do céu[c], e sua corte[d] estavam de pé diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Cabeça dos Dias”. O título também costuma ser aproximado de “Antigo de Dias”, mas aqui se conserva de perto a forma do ge'ez.
    reason: lexical_alternative
  - marker: b
    text: Ou “os livros da vida”. O ge'ez traz uma expressão plural, mais literalmente “os livros dos vivos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “acima dos céus” ou “nos mais altos céus”.
    reason: lexical_alternative
  - marker: d
    text: O termo pode significar “o círculo ao redor dele”, “seu conselho” ou “sua assembleia”, referindo-se à corte celestial que cerca a figura entronizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e a repetição concreta de “dias”.
- source_word: ለርእሰ መዋዕል
  choice: o Cabeça dos Dias
  rationale: Reproduz de perto os componentes do título etíope sem o harmonizar automaticamente com o título tradicional de Daniel.
- source_word: ሶበ ነበረ መንበረ ስብሐቲሁ
  choice: quando ele se assentou no trono de sua glória
  rationale: Trata ነበረ como verbo ativo, tendo a figura entronizada como sujeito, e መንበረ como o lugar onde ela se assenta.
- source_word: መጻሕፍተ ሕያዋን
  choice: os livros dos vivos
  rationale: Mantém tanto o plural “livros” quanto o genitivo literal “dos vivos”, evitando harmonização com a expressão posterior “livro da vida”.
- source_word: በቅድሜሁ ተከሥቱ
  choice: foram abertos diante dele
  rationale: No contexto de registros celestiais, “abertos” expressa naturalmente a manifestação dos livros para o julgamento.
- source_word: ኵሉ ኃይሉ
  choice: todo o seu exército
  rationale: Interpreta o substantivo coletivo como a hoste celestial presente na cena, não como poder abstrato.
- source_word: ዘመልዕልተ ሰማያት
  choice: que está nas alturas do céu
  rationale: Conserva a imagem espacial elevada sem converter a expressão em uma classificação teológica.
- source_word: አውደ ዚአሁ
  choice: sua corte
  rationale: “Corte” se ajusta à visão do trono e preserva melhor que “conselho” a ideia de um círculo ou séquito reunido ao redor da figura entronizada.
- source_word: ይቀውሙ በቅድሜሁ
  choice: estavam de pé diante dele
  rationale: Expressa claramente a postura cerimonial da corte celestial e concorda com o sujeito composto.
theological_decisions:
- issue: Tradução do título divino ርእሰ መዋዕል
  choice: Cabeça dos Dias
  alternative: Antigo de Dias
  rationale: A forma escolhida segue a dicção própria do testemunho etíope e evita impor ao texto uma harmonização direta com a formulação tradicional de Daniel.
- issue: Tradução de መጻሕፍተ ሕያዋን
  choice: livros dos vivos
  alternative: livros da vida
  rationale: A opção preserva o plural e a relação genitiva do ge'ez, sem importar a conhecida fórmula canônica no singular.
- issue: Identidade da assembleia celestial em አውደ ዚአሁ
  choice: sua corte
  alternative: seu conselho
  rationale: '“Corte” mantém aberta a combinação de sentido espacial e institucional: o grupo que circunda e serve a figura entronizada.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. Mantiveram-se construções distintivas do ge'ez quando teologicamente ou imageticamente relevantes; notas esclarecem alternativas sem resolver indevidamente as ambiguidades.
