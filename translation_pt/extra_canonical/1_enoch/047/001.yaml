base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/001.yaml
  text: And in those days[c][b][a], the prayer of the righteous and the blood of the righteous ascended from the earth before the Lord of Spirits.
translation:
  language: pt
  text: E naqueles dias, a oração dos justos e o sangue do justo[a] subiram da terra à presença do Senhor dos Espíritos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o sangue dos justos”. O termo traduzido por “justo” está no singular, mas pode ter sentido representativo ou coletivo, em paralelo com “a oração dos justos”.'
    reason: lexical_alternative
  - marker: b
    text: O ge’ez emprega um único verbo no perfeito (“subiu”) antes de “a oração” e não o repete diante de “o sangue”. A tradução entende os dois elementos como um sujeito composto e, por isso, usa “subiram”.
    reason: grammar
lexical_decisions:
- source_word: መዋዕል
  choice: dias
  rationale: Na fórmula apocalíptica በውእቱ መዋዕል, “naqueles dias” é natural em português e preserva o marcador temporal recorrente da visão.
- source_word: ዐርገት
  choice: subiram
  rationale: A forma é perfeita e expressa movimento ascendente. O plural em português acomoda naturalmente o sujeito composto, sem alterar o aspecto passado do ge’ez.
- source_word: ጸሎተ ጻድቃን
  choice: a oração dos justos
  rationale: “Oração” é a correspondência ampla e natural, enquanto “dos justos” conserva a força coletiva do plural e sua ressonância apocalíptica.
- source_word: ደሙ ጻድቅ
  choice: o sangue do justo
  rationale: A expressão apresenta formas singulares, inclusive ጻድቅ. A tradução mantém esse dado formal no texto principal e registra em nota a possível compreensão coletiva.
- source_word: እምነ ምድር
  choice: da terra
  rationale: “Terra” preserva o alcance cósmico do cenário melhor que uma leitura territorial como “país”.
- source_word: ቅድመ
  choice: à presença de
  rationale: Expressa de modo natural em português a ideia relacional de estar diante de alguém, evitando que “antes de” seja entendido temporalmente.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Preserva de forma transparente e solene o título divino enóquico.
theological_decisions:
- issue: Se ጻድቅ depois de “sangue” designa um indivíduo ou funciona como singular representativo/coletivo.
  choice: o sangue do justo
  alternative: o sangue dos justos
  rationale: O singular é formalmente explícito no ge’ez e não deve ser apagado, embora o paralelismo com “a oração dos justos” favoreça uma possível leitura coletiva; a nota preserva ambas as possibilidades.
- issue: Relação do único verbo com os dois sintagmas coordenados.
  choice: oração e sangue como sujeito composto de “subiram”
  alternative: “a oração subiu, e o sangue...” em construção elíptica
  rationale: O ge’ez traz um só verbo, no perfeito, antes dos elementos coordenados. Em português, o sujeito composto com verbo no plural comunica a estrutura com clareza sem acrescentar uma segunda ação.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A formulação preserva o título apocalíptico e explicita em nota, sem resolver, a tensão entre o singular formal e a leitura coletiva.
