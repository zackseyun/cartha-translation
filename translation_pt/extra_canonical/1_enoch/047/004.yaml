base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/004.yaml
  text: And the hearts of the holy ones shall be filled with joy[a], because the number of the righteous has drawn near, and the prayer of the righteous has been heard[c][b], and the blood of the righteous has been avenged before the Lord of Spirits.
translation:
  language: pt
  text: E os corações dos santos se encherão de alegria, porque o número dos justos se aproximou[a], a oração dos justos foi ouvida, e o sangue dos justos foi reclamado diante do Senhor dos Espíritos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a prestação de contas dos justos se aproximou”, caso o substantivo seja entendido em sentido judicial, e não como total numérico.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida, conforme o sentido judicial no contexto, como “o sangue dos justos foi vingado”. Literalmente, o verbo indica que esse sangue foi procurado ou requerido, isto é, que se exigiu prestação de contas por ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: ልቦሙ
  choice: os corações
  rationale: Preserva a imagem bíblica do coração como centro da emoção e do pensamento, usando o plural exigido pelo referente coletivo.
- source_word: ቅዱሳን
  choice: os santos
  rationale: É a equivalência bíblica corrente em português para a comunidade santa, sem acrescentar uma identificação eclesiástica específica.
- source_word: ትመልእ ፍሥሐ
  choice: se encherão de alegria
  rationale: Reproduz naturalmente a ideia de serem cheios de alegria e mantém a orientação futura da frase.
- source_word: ቀርበ
  choice: se aproximou
  rationale: Mantém o aspecto perfectivo e a ideia apocalíptica de algo que já chegou perto.
- source_word: ኍልቈ ለጻድቅ
  choice: o número dos justos
  rationale: O substantivo denota primariamente número ou contagem; a formulação preserva a possível ideia de um total determinado sem explicitá-la.
- source_word: ጻድቅ / ጻድቃን
  choice: os justos
  rationale: É o equivalente bíblico natural e consistente para o termo-chave referente aos que são considerados retos.
- source_word: ጸሎቶሙ ተሰምዐ
  choice: a oração dos justos foi ouvida
  rationale: Conserva o singular coletivo do ge'ez e expressa de modo idiomático a acolhida divina da oração.
- source_word: ደሙ ለጻድቅ
  choice: o sangue dos justos
  rationale: O contexto favorece uma referência coletiva ao sangue derramado dos justos, sem introduzir um mártir individual não especificado.
- source_word: ተፈቅደ
  choice: foi reclamado
  rationale: O verbo pode indicar que o sangue foi procurado ou requerido, no sentido judicial de se exigir prestação de contas. “Reclamado” conserva essa força e permite que a vindicação implícita permaneça sem transformar o verbo diretamente em “vingado”.
- source_word: እግዚአ መናፍስት
  choice: o Senhor dos Espíritos
  rationale: Mantém o título divino característico de 1 Enoque em forma clara e reconhecível.
theological_decisions:
- issue: Sentido de “o número dos justos se aproximou”
  choice: O número ou total dos justos chegou perto de sua realização.
  alternative: A prestação de contas ou o julgamento relacionado aos justos se aproximou.
  rationale: O sentido numérico é o mais direto, mas a nota conserva a possível nuance judicial sem decidir além do que o termo permite.
- issue: Força judicial da expressão sobre o sangue dos justos
  choice: O sangue derramado foi reclamado diante de Deus, exigindo prestação de contas e implicando vindicação.
  alternative: O sangue dos justos foi vingado diante do Senhor dos Espíritos.
  rationale: “Vingado” explicita bem o resultado contextual, mas é mais forte que a ideia lexical de procurar ou requerer. A tradução principal preserva a formulação judicial e a nota registra a leitura contextual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação foi mantida simples e solene; evitou-se linguagem arcaica, bem como a explicitação de conclusões teológicas além do que o ge'ez sustenta.
