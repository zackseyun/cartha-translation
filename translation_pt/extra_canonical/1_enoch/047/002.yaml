  naturalness: O registro é claro, moderno e apropriadamente solene. «Sangue dos justos que foi derramado» é mais inequívoco e natural no contexto. «Não precisem esperar para sempre» comunica idiomaticamente a imagem de paciência/espera sem alterar o sentido.
  terminology: «Senhor dos Espíritos», «justos», «suplicarão», «darão graças» e «bendirão» são escolhas adequadas. «Santos» conserva uma ambiguidade possível, explicitada de modo útil na nota.
