base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/002.yaml
  text: In those days the holy ones who dwell in the heights of heaven shall unite with one voice[a], and they shall plead and pray and praise and give thanks and bless the name of the Lord of Spirits, on account of the blood of the righteous that has been poured out, and that the prayer of the righteous may not be in vain before the Lord of Spirits, that judgment may be executed for them[d][c][b], and that patience may not be theirs forever.
translation:
  language: pt
  text: Naqueles dias, os santos que habitam nas alturas do céu se unirão a uma só voz[a]. Eles suplicarão, orarão, louvarão, darão graças e bendirão o nome do Senhor dos Espíritos, por causa do sangue dos justos que foi derramado, e para que a oração dos justos não seja inútil diante do Senhor dos Espíritos[b], para que se faça justiça em favor deles[c] e para que não precisem esperar para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “os seres santos”. Por habitarem nas alturas do céu, podem ser anjos, justos que estão no céu, ou ambos.
    reason: lexical_alternative
  - marker: b
    text: O verbo etíope desta expressão é incerto. O sentido provável é que a oração dos justos não fique sem resposta nem efeito diante do Senhor dos Espíritos.
    reason: textual_variant
  - marker: c
    text: 'Ou: “para que se execute o julgamento em favor deles”. O termo pode indicar tanto uma sentença judicial quanto a realização da justiça em favor dos justos. A expressão final também pode ser traduzida mais literalmente: “e para que a paciência não seja deles para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: የኃብሩ
  choice: se unirão
  rationale: Expressa a ideia de juntar-se ou unir-se; com በ፩ቃል, indica ação coletiva e unanimidade vocal.
- source_word: ቅዱሳን
  choice: os santos
  rationale: É uma formulação natural em português para 'os que são santos', sem especificar se são anjos, justos celestiais ou ambos; a nota preserva essa ambiguidade.
- source_word: የኃድሩ
  choice: que habitam
  rationale: Verbo corrente de residência, adequado ao registro elevado e ao cenário celestial.
- source_word: በመልዕልተ ሰማያት
  choice: nas alturas do céu
  rationale: Preserva a imagem espacial do elevado domínio celestial sem impor uma cosmologia mais definida.
- source_word: በ፩ቃል
  choice: a uma só voz
  rationale: Equivalente idiomático de 'com uma palavra/voz', comunicando unanimidade na súplica coletiva.
- source_word: ያስተበቍዑ
  choice: suplicarão
  rationale: Transmite uma petição intensa e urgente, apropriada ao contexto do sangue derramado dos justos.
- source_word: ይጼልዩ
  choice: orarão
  rationale: Mantém distinto o verbo de oração na sequência deliberada de ações litúrgicas.
- source_word: ይሴብሑ
  choice: louvarão
  rationale: Equivalente do verbo doxológico e natural em linguagem bíblica portuguesa.
- source_word: የአኵቱ
  choice: darão graças
  rationale: Distingue a ação de agradecer do louvor mencionado imediatamente antes.
- source_word: ይባርኩ
  choice: bendirão
  rationale: Preserva o idioma bíblico de bendizer o nome divino e evita a possível leitura de conceder bênção a Deus.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém de modo solene e conciso o título recorrente nas Parábolas de Enoque.
- source_word: ኵነኔ
  choice: justiça
  rationale: No contexto de vindicação, comunica ação judicial em favor dos justos; a nota registra a alternativa 'julgamento'.
- source_word: ትዕግሥት
  choice: ter de esperar
  rationale: No contexto, a 'paciência' imposta aos justos representa a continuação da espera pela vindicação; a expressão portuguesa transmite naturalmente essa força sem ocultar o sentido literal em nota.
theological_decisions:
- issue: Identidade de ቅዱሳን na cena celestial
  choice: os santos, com nota explicativa
  alternative: os seres santos; os anjos
  rationale: O contexto os situa nas alturas do céu, mas não determina de forma inequívoca se são anjos, justos celestiais ou ambos. A tradução evita especificá-los como anjos.
- issue: Sentido da petição relativa à oração dos justos
  choice: não seja inútil
  alternative: não seja silenciada; não cesse; não seja rejeitada
  rationale: A forma etíope é incerta. A tradução expressa que a oração não deve ficar sem efeito ou resposta, enquanto a nota conserva a incerteza textual.
- issue: Valor de ኵነኔ no contexto de vindicação
  choice: se faça justiça em favor deles
  alternative: se execute o julgamento em favor deles
  rationale: A expressão comunica claramente a intervenção judicial divina em favor dos justos, sem determinar se o substantivo enfatiza sentença ou execução da justiça.
- issue: Relação sintática das orações introduzidas por ከመ
  choice: 'orações paralelas de finalidade: ''para que'''
  alternative: 'ler a primeira como causal: ''porque'''
  rationale: O emprego de ከመ com formas subjuntivas favorece finalidade ou conteúdo da intercessão, não causalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração litúrgica do original foi preservada. Empregou-se 'bendirão' para o idioma bíblico de bendizer o nome divino, e 'Senhor dos Espíritos' como título formal recorrente. As três orações finais foram apresentadas como finalidades paralelas, de acordo com a sintaxe etíope.
