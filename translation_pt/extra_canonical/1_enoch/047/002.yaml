  - severity: low
    issue: «Não tenham de esperar para sempre» é menos direto para a formulação sobre paciência/espera.
    rationale: «Não precisem esperar para sempre» expressa com maior naturalidade a petição para que a espera dos justos não continue indefinidamente, preservando a ambiguidade moderada do original.
