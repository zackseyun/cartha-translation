base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/003.yaml
  text: And all of them shall fall down and worship the Lord of Spirits[a]. And this is the end of the second parable.
translation:
  language: pt
  text: E todos eles cairão por terra e adorarão o Senhor dos Espíritos. E este é o fim da segunda parábola.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o fim de outra parábola» ou «o fim da outra parábola», caso ካልእ seja entendido em sentido não sequencial, em vez de «segunda».
    reason: alternativa lexical
lexical_decisions:
- source_word: ይወድቁ
  choice: cairão por terra
  rationale: Preserva o gesto físico de cair em reverência sem especificar em excesso uma prostração ritual.
- source_word: ኵሎሙ
  choice: todos eles
  rationale: Mantém explícito o sufixo pronominal e a força totalizante, além da continuidade com o contexto anterior.
- source_word: ይሰግዱ
  choice: adorarão
  rationale: No contexto, diante do Senhor dos Espíritos, o verbo tem força cultual e reverencial; o gesto corporal já é expresso por «cairão por terra».
- source_word: ለእግዚአ መናፍስት
  choice: o Senhor dos Espíritos
  rationale: Conserva o título divino característico de 1 Enoque em forma natural e reconhecível em português.
- source_word: ዝንቱ ውእቱ
  choice: este é
  rationale: Reproduz de modo claro e conciso a fórmula de identificação do ge'ez.
- source_word: ተፍጻሜተ
  choice: o fim
  rationale: Expressa naturalmente a conclusão da seção e corresponde ao sentido literário da fórmula.
- source_word: ካልእ ምሳሌ
  choice: a segunda parábola
  rationale: Neste encerramento estrutural do Livro das Parábolas, o valor sequencial de ካልእ é o mais provável; a possível leitura não sequencial é registrada em nota.
theological_decisions:
- issue: Tradução do título divino ለእግዚአ መናፍስት
  choice: o Senhor dos Espíritos
  alternative: o Senhor dos espíritos
  rationale: Preserva como título a expressão teológica própria de 1 Enoque, sem harmonizá-la com fórmulas posteriores nem reduzi-la a uma frase genérica.
- issue: Sentido de ካልእ na fórmula de encerramento
  choice: a segunda parábola
  alternative: outra parábola / a outra parábola
  rationale: A função de encerramento de seção favorece a leitura sequencial, mas a ambiguidade lexical genuína é preservada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Cairão por terra» evita a ambiguidade de uma simples queda acidental, enquanto «adorarão» comunica a força reverencial do contexto.
