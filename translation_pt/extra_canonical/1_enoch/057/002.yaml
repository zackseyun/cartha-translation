base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/002.yaml
  text: And the sound of their chariots was heard[a]; and when this turmoil came to be, the holy ones in heaven took notice, and the pillars of the earth were shaken from their foundations[e][d][c][b], and it was heard from one end of heaven to the other in one day.
translation:
  language: pt
  text: E ouviu-se o som de suas carruagens[a]. Quando surgiu essa agitação, os santos no céu perceberam, e as colunas da terra foram abaladas em suas bases. E ouviu-se de uma extremidade do céu à outra[c], em um só dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «o som do ruído de suas carruagens». O ge''ez emprega dois termos auditivos em sequência.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: «das extremidades do céu até a extremidade»; isto é, por toda a extensão do céu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተሰምዐ / ተሰምዓ
  choice: ouviu-se / isso foi ouvido
  rationale: Mantém a fórmula auditiva passiva e o estilo de relato visionário do ge'ez.
- source_word: ቃለ ድምፀ
  choice: o som
  rationale: A expressão combina dois termos auditivos; em português, «o som» comunica o sentido naturalmente, enquanto a duplicação literal («o som do ruído») seria pesada. A nota registra a forma mais literal.
- source_word: ሰረገላቲሆሙ
  choice: seus carros
  rationale: «Carros» preserva a imagem antiga de veículos puxados, sem acrescentar uma função militar não explicitada.
- source_word: ዝሀውክ
  choice: essa agitação
  rationale: O termo indica perturbação ou comoção; «agitação» preserva a amplitude sem definir se se trata especificamente de tumulto, ruído ou confusão.
- source_word: ቅዱሳን
  choice: os santos
  rationale: Reproduz o título substantivado sem explicitar «anjos»; sua localização no céu orienta o leitor, mas a identidade permanece formalmente aberta.
- source_word: አእመሩ
  choice: perceberam
  rationale: Expressa tomada de conhecimento ou percepção no contexto do acontecimento cósmico.
- source_word: ዐምደ ምድር
  choice: as colunas da terra
  rationale: Preserva a imagem da arquitetura cósmica sem racionalizá-la.
- source_word: ተሐውሰ
  choice: foram sacudidas
  rationale: Comunica de modo natural o movimento violento ou abalo das colunas.
- source_word: እመንበሩ
  choice: desde suas bases
  rationale: O substantivo pode significar lugar, assento ou base; em relação a colunas, «bases» é coerente e evita converter a expressão em terminologia teológica de «fundamentos».
- source_word: እምአጽናፈ ሰማይ እስከ አጽናፍ
  choice: de uma extremidade do céu à outra
  rationale: Transmite em português corrente o merismo espacial expresso pela repetição de «extremidade» no ge'ez.
- source_word: በአሐቲ ዕለት
  choice: em um só dia
  rationale: Forma temporal clara e enfática, correspondente a «em um dia» ou «num único dia».
theological_decisions:
- issue: Identidade de «os santos»
  choice: Manter «os santos» e sua localização «no céu», sem acrescentar «anjos».
  alternative: Traduzir «os seres santos» ou explicitar «os anjos».
  rationale: O contexto favorece seres celestiais, mas o termo em si não exige que a tradução resolva sua identidade de maneira explícita.
- issue: Imagem das colunas da terra
  choice: Preservar literalmente a cosmologia figurada como «as colunas da terra».
  alternative: Interpretar como «os fundamentos da terra» ou como uma descrição geral de terremoto.
  rationale: A tradução não deve desmitologizar nem harmonizar a imagem cósmica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e as formas passivas conservam o andamento visionário. «Carros» deve ser entendido no sentido antigo de veículos semelhantes a carruagens, não como automóveis.
