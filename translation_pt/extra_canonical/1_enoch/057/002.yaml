revisions:
- from: E ouviu-se o som dos seus carros[a]. Quando surgiu essa agitação, os santos no céu perceberam, e as colunas da terra foram sacudidas desde suas bases[b]. E isso foi ouvido de uma extremidade do céu à outra[c], em um só dia.
  to: E ouviu-se o som de suas carruagens[a]. Quando surgiu essa agitação, os santos no céu perceberam, e as colunas da terra foram abaladas em suas bases. E ouviu-se de uma extremidade do céu à outra[c], em um só dia.
  rationale: A revisão substitui «carros» por «carruagens» para evitar o sentido moderno de automóveis, melhora a expressão do abalo das colunas e conserva a construção auditiva impessoal do ge'ez. Mantêm-se a ambiguidade de «santos», a cosmologia figurada e o merismo final.
