    rationale: A preposição «desde» sugere ponto de partida temporal ou espacial. «Foram abaladas em suas bases» expressa naturalmente o abalo das colunas em sua sustentação.
  - severity: low
    issue: A nota b introduz uma alternativa singular que não é necessária na tradução adotada.
    rationale: A tradução plural segue a leitura de trabalho e a nota não é essencial para esclarecer uma ambiguidade relevante ao leitor. Sua remoção torna o aparato mais enxuto sem alterar o sentido.
