base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/001.yaml
  text: And after that I saw another host of chariots, and men riding in them; and they were coming upon the winds from the east and from the west, as far as the south.
translation:
  language: pt
  text: Depois disso, vi outra multidão de carruagens, com homens montados nelas; e vinham sobre os ventos, do leste e do oeste, até o sul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “até o meio-dia”; aqui, uma designação do sul.
    reason: Registra o idioma direcional do geês, que seria obscuro se traduzido literalmente no corpo do texto.
lexical_decisions:
- source_word: ትዕይንተ፡ ሠረገላት
  choice: multidão de carruagens
  rationale: No contexto, ትዕይንት admite a ideia de agrupamento ou hoste; “multidão” comunica uma grande formação de carruagens sem acrescentar caráter militar não expresso de modo inequívoco.
- source_word: ይጼዐኑ፡ ሰብእ፡ ውስቴቶሙ
  choice: com homens montados nelas
  rationale: Expressa de modo natural que as carruagens levavam homens em seu interior, em consonância com o sentido contextual de homens que as ocupavam ou nelas iam montados.
- source_word: ዲበ፡ ነፋሳት
  choice: sobre os ventos
  rationale: Preserva a imagem incomum do original, sem normalizá-la para uma simples indicação de direção ou impulso.
- source_word: መንፈቀ፡ ዕለት
  choice: sul
  rationale: A expressão literal “metade do dia/meio-dia” funciona como designação direcional do sul; a nota conserva a forma da expressão-fonte.
theological_decisions:
- issue: Natureza do deslocamento das carruagens
  choice: elas vinham sobre os ventos
  alternative: elas vinham impulsionadas pelos ventos
  rationale: A tradução mantém a imagem visionária e sua ambiguidade espacial, sem explicar o mecanismo do movimento.
translation_notes:
  register: Português atual, digno e acessível. A pontuação separa com clareza a visão, seus ocupantes e o movimento, preservando o caráter imagético do relato.
