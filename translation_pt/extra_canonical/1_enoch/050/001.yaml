  text: And in those days a change shall come for the holy ones and the chosen ones[a][b].
translation:
  language: pt
  text: E, naqueles dias, haverá uma mudança para os santos e os escolhidos.[a] A luz dos dias permanecerá sobre eles, e glória e honra retornarão aos santos. No dia da aflição, o mal será reservado para os pecadores; e os justos triunfarão em nome do Senhor dos Espíritos. Ele o mostrará aos outros, para que se arrependam e abandonem as obras de suas mãos. Haverá honra para eles diante do Senhor dos Espíritos, e, em seu nome, serão salvos. O Senhor dos Espíritos terá misericórdia deles, pois grande é a sua misericórdia. Ele é justo em seu juízo, e, diante de sua glória, a injustiça não subsistirá; quem não se arrepender diante dele perecerá. “Daqui em diante não terei misericórdia deles”, diz o Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma reviravolta” ou “uma reversão”. A palavra ge’ez designa uma mudança ou uma volta de situação; não significa “misericórdia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e a imagem recorrente de “dias”, em vez de suavizá-la para “tempos”.
- source_word: ሚጠት
  choice: mudança
  rationale: O substantivo deriva da ideia de voltar ou mudar e significa “mudança”, “virada” ou “reversão”; não significa “misericórdia”.
- source_word: ትከውን
  choice: haverá
  rationale: Expressa de modo natural em português o verbo comum “ser/tornar-se”, indicando que a mudança passará a existir ou ocorrerá.
- source_word: ለቅዱሳን
  choice: para os santos
  rationale: Traduz de forma concisa as pessoas caracterizadas como santas; neste contexto, a expressão não pressupõe a noção eclesiástica posterior de canonização.
- source_word: ወለኅሩያን
  choice: e os escolhidos
  rationale: Mantém uma designação central de 1 Enoque em linguagem clara, sem as possíveis associações sistemáticas posteriores de “eleitos”.
theological_decisions:
- issue: Sentido de ሚጠት no cenário de juízo e vindicação
  choice: mudança
  alternative: misericórdia
  rationale: A forma ge’ez indica mudança ou reversão, enquanto “misericórdia” corresponderia a outro substantivo. A tradução evita transformar a reversão anunciada numa afirmação doutrinária de graça ou misericórdia não expressa por esta palavra.
- issue: Identidade dos “santos” e “escolhidos”
  choice: manter as duas designações sem identificá-las ou diferenciá-las explicitamente
  alternative: fundir os termos num único grupo ou defini-los teologicamente
  rationale: O texto coordena as duas expressões, mas não esclarece aqui se são dois grupos ou duas designações do mesmo grupo; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Haverá uma mudança” é mais idiomático do que o decalque “uma mudança virá”, sem perder a noção de algo que passa a ocorrer.
