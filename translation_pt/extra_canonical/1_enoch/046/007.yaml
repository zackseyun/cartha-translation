  text: And these are those who judge the stars of heaven[a][b].
translation:
  language: pt
  text: E estes são os que julgam as estrelas do céu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode ser entendido como “reger” ou “governar”. Como esta seção foi preservada, na prática, somente em ge’ez, a nuance exata deve ser considerada com alguma cautela.
    reason: lexical_alternative
  - marker: b
    text: Na literatura apocalíptica, “estrelas” pode designar corpos celestes ou simbolizar seres celestiais; o texto não obriga o tradutor a decidir entre essas possibilidades aqui.
    reason: cultural_note
lexical_decisions:
- source_word: እሙንቱ
  choice: estes
  rationale: Pronome demonstrativo plural; “estes” preserva a força dêitica do relato visionário.
- source_word: ኮኑ
  choice: são
  rationale: Forma do verbo “ser/tornar-se”; neste enunciado de identificação, o presente “são” expressa naturalmente a descrição visionária.
- source_word: እለ
  choice: os que
  rationale: Marcador relativo que introduz a oração identificadora; “os que” mantém clara a estrutura da frase.
- source_word: ይኴንኑ
  choice: julgam
  rationale: “Julgar” preserva o sentido lexical principal e a imagem judicial, sem excluir completamente as nuances possíveis de reger ou governar.
- source_word: ከዋክብተ ሰማይ
  choice: as estrelas do céu
  rationale: Tradução direta da construção nominal, mantendo a linguagem cósmica e o registro apocalíptico.
theological_decisions:
- issue: Se a ação deve ser suavizada para governo cósmico em vez de julgamento
  choice: julgam as estrelas do céu
  alternative: regem as estrelas do céu; governam as estrelas do céu
  rationale: O verbo ge’ez é bem representado por “julgar”. Manter a linguagem judicial preserva a tensão teológica do texto e não reduz a cena a mera administração cósmica.
- issue: Se “estrelas” deve ser interpretado explicitamente como seres celestiais
  choice: estrelas
  alternative: seres celestiais
  rationale: A imagem apocalíptica pode referir-se a astros ou simbolizar seres celestiais; a tradução conserva a ambiguidade do texto.
translation_notes:
  register: Português moderno, claro e digno, com construção próxima do original. “Do céu” mantém o tom apocalíptico sem soar artificial; as notas preservam as ambiguidades lexical e simbólica.
