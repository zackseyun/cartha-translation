base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/001.yaml
  text: And there I saw one who had a head of days[a], and his head was like white wool; and with him was another, whose face was like the appearance of a man, and his face was full of grace[c][b], like one of the holy angels.
translation:
  language: pt
  text: E ali vi alguém que tinha uma cabeça de dias[a], e sua cabeça era como lã branca. Com ele estava outro, cujo rosto era como a aparência de um homem[b]; seu rosto estava cheio de graça[c], como o de um dos santos anjos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Ancião de Dias”. O ge''ez diz mais literalmente “cabeça de dias”, expressão preservada no texto principal.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir de modo mais fluente: “cujo rosto tinha aparência humana”. O texto principal preserva a comparação explícita do ge''ez.'
    reason: previous_rendering
  - marker: c
    text: A expressão “cheio de graça” traduz diretamente o ge'ez; não deve ser entendida como empréstimo deliberado de uma formulação posterior do Novo Testamento.
    reason: cross_reference
lexical_decisions:
- source_word: በህየ፡ ርኢኩ
  choice: E ali vi
  rationale: Mantém de forma natural e direta a indicação de lugar e o relato visionário em primeira pessoa.
- source_word: ዘሎቱ፡ ርእሰ፡ መዋዕል
  choice: alguém que tinha uma cabeça de dias
  rationale: Preserva a construção etíope incomum e evita substituí-la silenciosamente pelo título tradicional de Daniel.
- source_word: ወርእሱ፡ ከመ፡ ፀምር፡ ጻዕዳ
  choice: e sua cabeça era como lã branca
  rationale: Traduz ርእስ como 'cabeça', sem explicitar 'cabelo', e conserva a comparação introduzida por ከመ.
- source_word: ወምስሌሁ፡ ካልእ
  choice: Com ele estava outro
  rationale: Expressa com clareza a presença de uma segunda figura sem identificá-la além do que o versículo declara.
- source_word: ዘገጹ፡ ከመ፡ ርእየተ፡ ሰብእ
  choice: cujo rosto era como a aparência de um homem
  rationale: Conserva o comparativo explícito ከመ e o paralelismo das comparações presentes no versículo.
- source_word: ወምሉእ፡ ጸጋ፡ ገጹ
  choice: seu rosto estava cheio de graça
  rationale: Traduz diretamente ጸጋ como 'graça', sem depender de formulações posteriores do Novo Testamento.
- source_word: ከመ፡ ፩እመላእክት፡ ቅዱሳን
  choice: como o de um dos santos anjos
  rationale: Preserva tanto a comparação quanto a construção partitiva 'um dos santos anjos'; 'o de' retoma naturalmente 'rosto' em português.
theological_decisions:
- issue: Tradução de ርእሰ መዋዕል como título tradicional
  choice: cabeça de dias
  alternative: Ancião de Dias
  rationale: A tradução principal conserva o idioma peculiar do ge'ez e não harmoniza automaticamente o texto com o título tradicional de Daniel; a alternativa é registrada em nota.
- issue: Identificação da segunda figura
  choice: outro, cujo rosto era como a aparência de um homem
  alternative: o Filho do Homem
  rationale: O versículo apresenta a figura por descrição, não por título. A formulação mantém essa tensão e não antecipa uma identificação teológica.
- issue: Sentido de ጸጋ
  choice: graça
  alternative: favor
  rationale: '''Graça'' representa diretamente o campo semântico do termo, mas a nota esclarece que a expressão procede do próprio texto etíope e não constitui harmonização com linguagem neotestamentária.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi mantida clara, mas as imagens incomuns e as três comparações explícitas do ge'ez foram preservadas. Empregou-se 'homem' em vez de identificar a figura como 'Filho do Homem', e 'santos anjos' mantém a linguagem angelológica sem acrescentar interpretação denominacional.
