base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/005.yaml
  text: And he will cast down the kings from their thrones and from their kingdoms[a], because they do not exalt him, and do not praise him[c][b], and do not acknowledge from where the kingdom was given to them.
translation:
  language: pt
  text: E ele derrubará os reis de seus tronos e de seus reinos, porque não o exaltam, nem o louvam, nem reconhecem[a] de onde[b] lhes foi dado o reino[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem se submetem” ou “nem se curvam”. O verbo pode envolver reconhecimento acompanhado de submissão ou reverência.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de quem”. A expressão geʽez pode indicar a fonte em sentido geral (“de onde”) ou, no contexto, uma fonte pessoal (“de quem”).'
    reason: lexical_alternative
  - marker: c
    text: “O reino” também pode ser entendido como “a realeza” ou “a autoridade real”, e não apenas como um território.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገፈትኦሙ
  choice: derrubará
  rationale: Expressa remoção enérgica ou queda e preserva a força da imagem apocalíptica, sem reduzi-la ao sentido administrativo de “depor”.
- source_word: ነገሥት
  choice: reis
  rationale: Mantém o sentido régio específico, reforçado no contexto por “tronos” e “reinos”.
- source_word: መናብርቲሆሙ
  choice: seus tronos
  rationale: No contexto de julgamento de reis, “tronos” preserva a imagem concreta e simbólica da autoridade régia.
- source_word: መንገሥቲሆሙ
  choice: seus reinos
  rationale: Conserva o paralelismo com “seus tronos” e a noção de esfera de governo, embora o termo também possa indicar reinado ou domínio.
- source_word: ኢያሌዕልዎ
  choice: não o exaltam
  rationale: Retém a ideia de elevar ou exaltar, mais forte e específica que simplesmente “honrar”.
- source_word: ኢይሴብሕዎ
  choice: nem o louvam
  rationale: “Louvar” comunica de modo claro e digno o sentido de elogiar ou glorificar.
- source_word: ኢይገንዩ
  choice: nem reconhecem
  rationale: No contexto, indica a recusa em admitir a fonte da autoridade recebida. A nota preserva a possível nuance de submissão ou reverência ligada ao verbo.
- source_word: እምአይቴ
  choice: de onde
  rationale: Traduz de maneira direta a expressão de procedência ou fonte, sem eliminar a leitura pessoal possível, “de quem”.
- source_word: ተውህበት ሎሙ መንግሥት
  choice: lhes foi dado o reino
  rationale: Preserva a construção passiva e o vocabulário régio; a nota registra que “reino” pode designar a própria realeza ou autoridade real.
theological_decisions:
- issue: Referente de “ele/o” e fonte da autoridade régia
  choice: Manter os pronomes sem identificar explicitamente o referente
  alternative: Nomear o Altíssimo, o Senhor ou o Eleito
  rationale: O versículo não apresenta um título explícito. O contexto aponta para uma fonte divina da autoridade, mas nomeá-la aqui resolveria uma tensão referencial que o texto preserva.
translation_notes:
  register: Português moderno, claro e solene, com construção profética fluente. Mantiveram-se a imagem régia, a passiva divina implícita e a ambiguidade do referente pronominal. As notas registram alternativas lexicais relevantes sem impor uma interpretação denominacional.
