base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/002.yaml
  text: And I asked one of the angels who was going with me[a], and who was showing me all the hidden things, concerning that Son of Man—who he was, and from where he came[c][b], and why he was going with the Head of Days.
translation:
  language: pt
  text: 'E perguntei a um dos anjos que ia comigo e me mostrava todas as coisas ocultas[a] a respeito daquele Filho do Homem: quem ele era, de onde vinha e por que ia com o Cabeça de Dias[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os segredos”. O termo ge'ez se refere a realidades celestes ocultas que são reveladas na visão.
    reason: lexical_alternative
  - marker: b
    text: “Cabeça de Dias” reproduz diretamente a expressão etíope. A tradução tradicional “Ancião de Dias” é influenciada pela formulação de Daniel.
    reason: cross_reference
lexical_decisions:
- source_word: ተስእልክዎ
  choice: perguntei
  rationale: Expressa de modo direto e natural a indagação de Enoque ao anjo, sem acrescentar intensidade ausente do texto.
- source_word: ፩እመላእክት
  choice: um dos anjos
  rationale: Preserva naturalmente em português a construção partitiva do ge'ez, sem acrescentar “santos”.
- source_word: ዘየሐውር ምስሌየ
  choice: que ia comigo
  rationale: Mantém o valor durativo do movimento na visão e a ideia de que o anjo seguia ao lado de Enoque.
- source_word: ኵሎ ኅቡኣተ
  choice: todas as coisas ocultas
  rationale: Designa realidades celestes escondidas e reveladas na visão; evita impor o sentido técnico que “mistérios” poderia sugerir.
- source_word: ዘያርእየኒ
  choice: me mostrava
  rationale: Conserva tanto o caráter visual quanto o aspecto contínuo da revelação.
- source_word: ወልደ ሰብእ
  choice: Filho do Homem
  rationale: O demonstrativo e o contexto apontam para uma figura visionária determinada; as maiúsculas indicam essa função literária sem definir uma identificação doutrinária posterior.
- source_word: እምአይቴ ይከውን
  choice: de onde vinha
  rationale: Comunica em português corrente a pergunta sobre origem ou procedência, sem a rigidez de uma tradução estritamente literal.
- source_word: ርእሰ መዋዕል
  choice: Cabeça de Dias
  rationale: Traduz de modo transparente a expressão etíope e evita harmonizá-la silenciosamente com o título tradicional de Daniel.
- source_word: ምስለ ... የሐውር
  choice: ia com
  rationale: Preserva a repetição do verbo de movimento e a associação marcante entre o Filho do Homem e o Cabeça de Dias.
theological_decisions:
- issue: Se ወልደ ሰብእ deve ser entendido como título ou expressão humana genérica
  choice: aquele Filho do Homem
  alternative: aquele filho de homem; aquele ser humano
  rationale: Neste contexto, a expressão com valor demonstrativo aponta para uma figura específica da visão. A capitalização marca sua proeminência textual, sem impor uma conclusão cristológica posterior.
- issue: Se ርእሰ መዋዕል deve ser harmonizado com o título tradicional de Daniel
  choice: Cabeça de Dias
  alternative: Ancião de Dias; Cabeça dos Dias
  rationale: A redação principal segue a forma etíope, que significa literalmente “Cabeça de Dias”, enquanto a forma tradicional ligada a Daniel é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação foi levemente simplificada para fluência, sem eliminar as relações sintáticas nem a repetição significativa do verbo de movimento. Os marcadores [a] e [b] aparecem no texto principal; a nota inglesa [c] foi omitida porque deriva de uma redação anterior e não corresponde a uma variante lexical substantiva do versículo.
