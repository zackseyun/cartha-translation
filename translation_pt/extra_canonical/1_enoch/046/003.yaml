base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/003.yaml
  text: And he answered me and said to me[a], “This is the Son of Man, to whom righteousness belongs, and righteousness dwells with him; and he will reveal all the treasuries of what is hidden, because the Lord of Spirits has chosen him[c][b], and his lot has prevailed before the Lord of Spirits forever in uprightness.”
translation:
  language: pt
  text: 'E ele me respondeu e me disse: “Este é o Filho do Homem, a quem pertence a justiça, e a justiça habita com ele. Ele revelará todos os tesouros das coisas ocultas[a], porque o Senhor dos Espíritos o escolheu e cujo quinhão prevaleceu[b] diante do Senhor dos Espíritos para sempre, em retidão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os depósitos” ou “os tesouros do que está oculto”. A imagem é a de realidades escondidas, guardadas em reserva celestial, e não apenas de “segredos” abstratos.'
    reason: lexical_alternative
  - marker: b
    text: A oração final é difícil no ge'ez. “Cujo quinhão prevaleceu” também pode ser traduzido por “cuja porção triunfou”; é menos provável que a expressão se refira ao quinhão daqueles associados a ele.
    reason: alternative_reading
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: o Filho do Homem
  rationale: A expressão ge'ez corresponde a “filho do homem” e, nesta identificação visionária, funciona como designação titular. A inicial maiúscula sinaliza esse uso sem acrescentar formulações doutrinárias posteriores.
- source_word: ዘሎቱ ኮነ ጽድቅ
  choice: a quem pertence a justiça
  rationale: Preserva a construção de posse ou associação, em vez de reduzi-la a um simples adjetivo.
- source_word: ወጽድቅ ምስሌሁ ኃደረ
  choice: e a justiça habita com ele
  rationale: Mantém tanto o sentido de habitar/permanecer quanto a personificação marcante da justiça.
- source_word: መዛግብተ ዘኅቡእ
  choice: os tesouros das coisas ocultas
  rationale: Conserva a imagem apocalíptica de realidades escondidas e guardadas em reserva; “tesouros” é mais natural em português corrente do que “tesourarias”.
- source_word: ይከሥት
  choice: ele revelará
  rationale: Expressa com clareza o sentido futuro de descobrir ou tornar manifesto.
- source_word: እግዚአ መንፈሳት
  choice: o Senhor dos Espíritos
  rationale: Preserva o título divino recorrente e distintivo de 1 Enoque.
- source_word: ኀረዮ ኃርየ
  choice: o escolheu
  rationale: Comunica naturalmente o ato intensificado de escolha indicado pelas formas cognatas repetidas no ge'ez.
- source_word: ወዘክፍሉ ሞአ
  choice: e a porção que lhe cabe prevaleceu
  rationale: “Porção que lhe cabe” conserva a imagem de quinhão ou parte designada e permite representar a relação relativa de ዘ sem produzir uma construção portuguesa truncada.
- source_word: በርቱዕ ለዓለም
  choice: para sempre, em retidão
  rationale: Mantém tanto a duração eterna quanto a qualidade moral, evitando repetir “justiça” pela terceira vez sem necessidade.
theological_decisions:
- issue: Se ወልደ ሰብእ deve ser entendido como título ou descrição humana genérica
  choice: “o Filho do Homem”, como designação titular
  alternative: “um filho do homem” ou “o ser humano”
  rationale: O contexto visionário identifica uma figura determinada com funções próprias. A tradução mantém essa identificação sem harmonizá-la indevidamente com usos cristãos posteriores.
- issue: A repetição da linguagem de justiça
  choice: Manter “a quem pertence a justiça” e “a justiça habita com ele”
  alternative: Condensar as duas expressões em “o justo”
  rationale: A repetição é deliberada e intensifica a associação da figura com a justiça; condensá-la apagaria uma ênfase teológica do texto.
- issue: O sentido da oração final sobre a porção ou quinhão
  choice: “a porção que lhe cabe prevaleceu”
  alternative: “seu quinhão triunfou” ou referência à porção daqueles ligados a ele
  rationale: O ge'ez é difícil e a relação exata permanece incerta. A redação escolhida acompanha de perto a gramática aparente e registra a incerteza em nota, sem impor uma solução doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a repetição solene, os títulos próprios de 1 Enoque e a ambiguidade da oração final. Os marcadores [a] e [b] aparecem no texto principal.
