  terminology: «Filho do Homem», «justiça», «Senhor dos Espíritos» e «tesouros das coisas ocultas» são escolhas consistentes e adequadas. «Quinhão» conserva melhor que «porção que lhe cabe» a imagem de lote/parte atribuída, mantendo a estranheza poética controlada do original.
