base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/006.yaml
  text: And he will cast down the face of the strong ones[a], and he will fill them with shame; and darkness shall become their dwelling, and worms their bed. And they shall have no hope of rising from their beds[c][b], because they do not exalt the name of the Lord of Spirits.
translation:
  language: pt
  text: Ele abaterá o rosto dos fortes e os encherá de vergonha; as trevas se tornarão sua morada, e os vermes[a], seu leito. Eles não terão esperança de se levantar de seus leitos[b], porque não exaltam o nome do Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma da palavra traduzida como “vermes” apresenta alguma incerteza no testemunho ge'ez transcrito; esse sentido, porém, corresponde à imagem de corrupção num leito semelhante à sepultura.
    reason: textual_variant
  - marker: b
    text: “Levantar-se de seus leitos” pode significar simplesmente erguer-se, mas, neste contexto de juízo, também pode sugerir a ausência de restauração ou ressurreição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገጸ፡ ጽኑዓን፡ ይገፈትእ
  choice: Ele abaterá o rosto dos fortes
  rationale: Mantém o sujeito masculino singular e a voz ativa dos verbos em ge'ez, preservando também a imagem concreta do rosto e a queda humilhante dos que são fortes ou poderosos. “Abaterá” comunica tanto golpe quanto rebaixamento sem restringir o grupo a governantes.
- source_word: ይመልኦሙ፡ ኃፍረተ
  choice: os encherá de vergonha
  rationale: A vergonha funciona como aquilo com que ele os enche; a formulação portuguesa conserva o sujeito ativo e a imagem de vergonha avassaladora.
- source_word: ጽልመት፡ ይከውኖሙ፡ መንደሪሆሙ
  choice: as trevas se tornarão sua morada
  rationale: Reproduz diretamente a imagem apocalíptica de escuridão como lugar de habitação, em linguagem natural e solene.
- source_word: ዕፀያት፡ ይከውኖሙ፡ ምስካቦሙ
  choice: os vermes, seu leito
  rationale: Conserva a imagem grave de corrupção e juízo, sem transformar explicitamente o leito em sepultura; a forma lexical do testemunho transcrito apresenta alguma incerteza.
- source_word: ኢይሴፈዉ፡ ከመ፡ ይትነሥኡ፡ እምስካቦቲሆሙ
  choice: não terão esperança de se levantar de seus leitos
  rationale: '“Levantar-se” preserva a amplitude do verbo: pode indicar simplesmente erguer-se, mas o contexto de trevas e vermes permite uma ressonância de restauração ou ressurreição sem torná-la explícita.'
- source_word: ኢያሌዕሉ፡ ስሞ
  choice: não exaltam o nome
  rationale: “Exaltar” mantém o sentido de engrandecer ou elevar e conserva o registro elevado da expressão.
- source_word: እግዚአ፡ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Preserva literalmente o título divino recorrente e característico de 1 Enoque.
theological_decisions:
- issue: Possível referência à ressurreição em ይትነሥኡ
  choice: se levantar de seus leitos
  alternative: ser ressuscitados de seus leitos
  rationale: O cenário sugere morte e juízo, mas o verbo não exige por si só uma referência técnica à ressurreição. A tradução mantém deliberadamente essa tensão.
- issue: Identidade de ጽኑዓን
  choice: os fortes
  alternative: os poderosos ou os governantes poderosos
  rationale: O termo caracteriza essas pessoas por sua força ou poder, mas neste versículo não as identifica expressamente como reis ou governantes.
- issue: Agente das duas primeiras ações
  choice: Ele abaterá... e os encherá
  alternative: O rosto dos fortes será abatido, e a vergonha os encherá
  rationale: As formas verbais são ativas, na terceira pessoa masculina singular, e continuam as ações da figura masculina do contexto anterior; a tradução não as converte em passivas.
translation_notes:
  register: Português moderno, claro e solene, de leitura natural no Brasil e compreensível internacionalmente. A construção mantém as imagens concretas e a ambiguidade escatológica do ge'ez, evitando linguagem arcaica e especificações doutrinárias não exigidas pelo texto.
