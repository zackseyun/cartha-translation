base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/004.yaml
  text: And this Son of Man whom you have seen will raise up kings and the mighty from their couches, and the strong from their thrones; and he will loosen the loins of the strong, and crush the teeth of sinners.
translation:
  language: pt
  text: E este Filho do Homem que você viu fará os reis e os poderosos se levantarem de seus leitos[a], e os fortes, de seus tronos; ele soltará os lombos dos fortes[b] e esmagará os dentes dos pecadores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugares de repouso”. A imagem é a de governantes obrigados a se levantar de uma posição de descanso ou segurança.
    reason: lexical_alternative
  - marker: b
    text: O termo ge'ez transmitido neste trecho é incerto. “Soltar os lombos” provavelmente descreve a perda da força e da firmeza dos poderosos; também foram propostas leituras relacionadas a rédeas, freios ou correias.
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: Filho do Homem
  rationale: Preserva a forma semítica e seu uso semelhante a um título para a figura específica da visão, sem acrescentar formulações cristológicas posteriores.
- source_word: ዘርኢከ
  choice: que você viu
  rationale: Liga naturalmente a figura à visão anterior de Enoque e mantém a referência direta da segunda pessoa.
- source_word: ያነሥኦሙ
  choice: fará ... se levantarem
  rationale: Reproduz o sentido causativo de fazer levantar, preservando a imagem concreta e evitando decidir silenciosamente que o verbo significa simplesmente depor ou remover.
- source_word: እምስካበቲሆሙ
  choice: de seus leitos
  rationale: O substantivo designa cama ou lugar de repouso; 'leitos' é digno e inteligível, mantendo a imagem de repouso ou segurança.
- source_word: ጽኑዓን
  choice: os fortes
  rationale: Mantém o sentido concreto e a repetição do termo no versículo.
- source_word: መናብርቲሆሙ
  choice: de seus tronos
  rationale: No contexto régio e judicial, 'tronos' expressa adequadamente os assentos de poder.
- source_word: ይፈትሕ
  choice: soltará
  rationale: Traduz o ato de soltar ou desatar e conserva a imagem corporal do juízo.
- source_word: ኃማተ
  choice: os lombos
  rationale: Segue a revisão textual e o provável eco da expressão bíblica de soltar os lombos de reis; uma nota registra a incerteza do termo ge'ez transmitido.
- source_word: ይደቅቅ
  choice: esmagará
  rationale: Preserva a força violenta da imagem apocalíptica de juízo.
- source_word: አስናነ ኃጥኣን
  choice: os dentes dos pecadores
  rationale: Mantém a imagem concreta da destruição da capacidade predatória ou opressora dos pecadores.
theological_decisions:
- issue: Se ወልደ ሰብእ deve ser entendido como título ou como referência humana genérica
  choice: Filho do Homem, com iniciais maiúsculas, referente à figura escatológica específica da visão
  alternative: um filho de homem; o humano
  rationale: A figura já está individualizada no contexto das Parábolas. A forma tradicional preserva a expressão semítica sem importar além do texto uma identificação doutrinária posterior.
- issue: Como expressar a ação de juízo contra reis e poderosos
  choice: Manter a imagem de fazê-los levantar de seus leitos e tronos
  alternative: remover ou depor reis e poderosos
  rationale: O verbo ge'ez é causativo e sugere literalmente fazê-los levantar. A formulação escolhida preserva a vividez e também a possível ambiguidade, sem transformar a metáfora em explicação abstrata.
- issue: Como interpretar ኃማተ
  choice: lombos
  alternative: rédeas; correias; freios
  rationale: A leitura 'lombos' corresponde ao provável idioma de despojar governantes de força e evita que 'soltar as rédeas' sugira, em português moderno, conceder maior liberdade ou poder. A incerteza textual é explicitada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega 'você' por naturalidade na fala direta e mantém o paralelismo e as imagens concretas do texto apocalíptico.
