base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/002.yaml
  text: And he lifted up his feet from there and went as far as the ends of the earth[a], and he cried out to his grandfather Enoch, and Noah said with a bitter voice, “Hear me, hear me[d][c][b], hear me,” three times.
translation:
  language: pt
  text: 'E ele levantou os pés dali e foi até os confins da terra. Então clamou a seu avô Enoque[a], e Noé disse com voz amargurada: “Escuta-me, escuta-me, escuta-me!”, três vezes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a seu antepassado Enoque”. O termo também pode designar um ancestral; genealogicamente, Enoque é bisavô de Noé.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: አንሥአ፡ እገሪሁ
  choice: levantou os pés
  rationale: Preserva a imagem corporal concreta do ge'ez, em vez de reduzi-la a uma expressão genérica como “partiu”.
- source_word: እምህየ
  choice: dali
  rationale: Expressa de modo natural em português o movimento de saída do lugar em que ele se encontrava.
- source_word: ሖረ
  choice: foi
  rationale: Verbo simples de movimento, sem acrescentar uma maneira de viajar que o texto não especifica.
- source_word: እስከ፡ አጽናፈ፡ ምድር
  choice: até os confins da terra
  rationale: Mantém a expressão cosmogeográfica elevada e corrente em linguagem bíblica, com clareza para leitores modernos.
- source_word: ጸርኀ
  choice: clamou
  rationale: Comunica um chamado em voz alta e conserva a dignidade narrativa melhor do que uma formulação coloquial.
- source_word: ለአምኄው፡ ሄኖክ
  choice: a seu avô Enoque
  rationale: አምኄው designa o avô ou antepassado, não o filho. “Avô” traduz diretamente o termo de parentesco, enquanto a nota registra sua possível extensão semântica.
- source_word: ወይቤ፡ ኖኅ
  choice: e Noé disse
  rationale: Reconhece corretamente Noé como sujeito posposto do verbo, conforme a ordem verbo-sujeito normal do ge'ez.
- source_word: በቃል፡ መሪር
  choice: com voz amargurada
  rationale: Conserva a intensidade emocional de መሪር (“amarga”), usando em português uma qualificação natural para a voz de quem sofre.
- source_word: ስምዐኒ
  choice: Escuta-me
  rationale: Imperativo direto com objeto de primeira pessoa; a forma mantém a urgência e soa natural no português atual.
- source_word: ሥልሰ
  choice: três vezes
  rationale: Explicita que o apelo foi repetido três vezes, como indica o advérbio final.
theological_decisions:
- issue: Relação genealógica entre Noé e Enoque
  choice: Traduzir አምኄው por “seu avô”, com nota sobre o sentido mais amplo “antepassado”.
  alternative: Harmonizar para “bisavô” ou traduzir genericamente como “antepassado”.
  rationale: O termo fonte pode designar avô ou ancestral. Embora Enoque seja apresentado genealogicamente como bisavô de Noé, a tradução não substitui o termo do testemunho por uma precisão genealógica harmonizadora.
- issue: Identificação do sujeito em ወይቤ፡ ኖኅ
  choice: “e Noé disse”
  alternative: Tratar “Noé” como vocativo dentro da fala.
  rationale: A construção segue a ordem verbal normal do ge'ez, na qual Noé é o sujeito explícito de “disse”; não há razão textual para inseri-lo na citação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Preservou-se a imagem incomum “levantou os pés”, mas a pontuação foi ajustada para tornar clara a sequência narrativa. “Voz amargurada” comunica sofrimento intenso sem recorrer a formulação excessivamente arcaica.
