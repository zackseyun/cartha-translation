base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/004.yaml
  text: And after that time there came a great upheaval upon the earth[a], and a voice was heard from heaven[b], and I fell on my face.
translation:
  language: pt
  text: E, depois daquele tempo, houve um grande tumulto na terra[a]; ouviu-se uma voz vinda do céu, e eu caí com o rosto em terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido como “tumulto” também pode significar “agitação”, “confusão” ou “abalo”.
    reason: lexical_alternative
  - marker: b
    text: 'O texto transmitido é difícil neste ponto: a forma verbal parece estar no plural (“eles caíram”), mas o sufixo em “meu rosto” indica a primeira pessoa do singular. A tradução segue o sentido que melhor se ajusta ao contexto narrativo imediato.'
    reason: textual_variant
lexical_decisions:
- source_word: በድኅሬ ውእቱ ጊዜ
  choice: depois daquele tempo
  rationale: Preserva a sequência temporal e a força demonstrativa de ውእቱ em português natural.
- source_word: ሀውክ ዐቢይ
  choice: um grande tumulto
  rationale: ሀውክ denota perturbação, desordem ou agitação. “Tumulto” conserva a intensidade apocalíptica sem especificar indevidamente um terremoto.
- source_word: ዲበ ምድር
  choice: na terra
  rationale: Expressão espacial corrente que, neste contexto apocalíptico, mantém o alcance mais amplo de “terra”, em vez do sentido localizado de “território”.
- source_word: ተሰምዐ ቃል እምሰማይ
  choice: ouviu-se uma voz vinda do céu
  rationale: Embora ቃል possa significar “palavra”, “voz” ou “som”, “voz” comunica melhor a manifestação celestial neste contexto sem acrescentar conteúdo não expresso.
- source_word: ወወደቁ በገጽየ
  choice: e eu caí com o rosto em terra
  rationale: A forma verbal transmitida parece plural, mas o sufixo de primeira pessoa singular em “meu rosto” e o contexto narrativo favorecem a ação de Enoque. A formulação portuguesa expressa a prostração de modo natural, e a dificuldade textual é registrada em nota.
theological_decisions:
- issue: Natureza da perturbação indicada por ሀውክ
  choice: tumulto de alcance apocalíptico, sem especificar sua natureza
  alternative: confusão, agitação ou abalo físico
  rationale: A escolha mantém a amplitude da imagem e sua tensão apocalíptica, sem reduzi-la a desordem política nem defini-la como terremoto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva-se a abertura coordenativa do ge’ez e evita-se identificar o tumulto especificamente como terremoto.
