base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/001.yaml
  text: In those days Noah saw that the earth had sunk down[a], and that its destruction was near.
translation:
  language: pt
  text: Naqueles dias, Noé viu que a terra havia afundado[a] e que sua destruição estava próxima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por «havia afundado» é lexicalmente difícil no testemunho etíope e também pode sugerir que a terra havia cedido, desabado ou sido violentamente abalada.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e seu registro elevado e recorrente, em português natural.
- source_word: ርእየ
  choice: viu
  rationale: Expressa de modo direto o verbo de percepção, sem recorrer a uma forma arcaizante como «contemplou».
- source_word: ኖኅ
  choice: Noé
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: ምድረ
  choice: a terra
  rationale: O contexto de juízo apocalíptico favorece o âmbito cósmico de «terra», em vez de apenas «solo» ou «território».
- source_word: ከመ፡ አጽነነት
  choice: que a terra havia afundado
  rationale: A expressão etíope é lexicalmente difícil, mas parece retratar a terra cedendo ou perdendo sua estabilidade física. «Havia afundado» conserva a imagem vívida sem definir com precisão indevida o mecanismo.
- source_word: ወከመ፡ ቅሩብ፡ ሐጕላ
  choice: e que sua destruição estava próxima
  rationale: «Próxima» comunica claramente a ideia de iminência, enquanto «sua destruição» liga a ruína vindoura à terra mencionada anteriormente.
theological_decisions:
- issue: Se a condição da terra deve ser entendida como corrupção moral ou desestabilização física
  choice: 'Desestabilização física: «a terra havia afundado»'
  alternative: «a terra estava corrompida» ou «a terra havia sido abalada»
  rationale: A formulação ge'ez descreve algo que Noé viu e favorece uma imagem física ligada ao cataclismo iminente. A tradução mantém essa tensão e não reduz a linguagem apocalíptica a uma afirmação abstrata sobre maldade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo do original sem soar arcaica.
