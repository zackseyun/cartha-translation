base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/003.yaml
  text: And I said to him[a], “Tell me, what is this that is being done upon the earth? For the earth has labored thus and has been shaken[c][b]; perhaps I will perish with it.”
translation:
  language: pt
  text: 'E eu lhe disse: “Diga-me: o que é isso que está acontecendo sobre a terra? Pois a terra sofreu assim[a] e foi abalada; talvez eu pereça com ela[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois a terra sentiu assim dores de parto”. O verbo ge''ez é difícil neste contexto e pode evocar o penoso trabalho do parto.'
    reason: lexical_alternative
  - marker: b
    text: 'A oração final também pode ser entendida como expressão mais explícita de temor: “pois temo que eu pereça com ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግረኒ
  choice: Diga-me
  rationale: O imperativo com sufixo de primeira pessoa pede uma formulação direta; “Diga-me” é natural e preserva o pedido ao interlocutor.
- source_word: ምንት ውእቱ ዘይትገበር
  choice: o que é isso que está acontecendo
  rationale: Preserva a força deíctica de ውእቱ e apresenta a ação como presente ou em curso, sem tratá-la como acontecimento já concluído.
- source_word: ዲበ ምድር
  choice: sobre a terra
  rationale: Expressa a relação locativa e mantém um registro digno, adequado ao discurso apocalíptico.
- source_word: እስመ ከመዝ ሰርሐት ምድር
  choice: Pois a terra sofreu assim
  rationale: O verbo é difícil neste contexto. “Sofreu” comunica a aflição personificada da terra sem impor de modo exclusivo a imagem obstétrica possível em “sentiu dores de parto”.
- source_word: ወአንቀልቅለት
  choice: e foi abalada
  rationale: Comunica movimento violento ou convulsão e permite tanto a dimensão sísmica quanto a cósmica da imagem.
- source_word: ዮጊ አነ እትኃጐል ምስሌሃ
  choice: talvez eu pereça com ela
  rationale: “Talvez” conserva o valor de apreensão de ዮጊ e evita uma ligação final ou purposiva indevida com o abalo da terra; “ela” retoma “terra”.
theological_decisions:
- issue: Natureza da aflição da terra
  choice: A terra é retratada de modo personificado como sofrendo uma convulsão cósmica.
  alternative: Entender a frase apenas como corrupção moral ocorrida na terra ou somente como um terremoto natural.
  rationale: A combinação do sofrimento da terra com seu abalo favorece uma imagem apocalíptica ampla. A tradução não reduz essa tensão nem a uma abstração moral nem a um fenômeno exclusivamente natural.
- issue: Força de ዮጊ na oração final
  choice: 'Expressar possibilidade apreensiva: “talvez eu pereça”.'
  alternative: “para que eu não pereça” ou “com medo de que eu pereça”.
  rationale: A leitura escolhida preserva a incerteza real da partícula e produz uma relação sintática clara, sem sugerir que a terra foi abalada com a finalidade de evitar a morte do falante.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem direta favorece a oralidade solene do diálogo; “pereça” e “foi abalada” preservam o tom apocalíptico sem arcaísmo excessivo.
