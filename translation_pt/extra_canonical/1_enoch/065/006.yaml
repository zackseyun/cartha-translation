base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/006.yaml
  text: And a command went out from before the Lord against those who dwell on the dry land[a], that their end should come; for they knew all the hidden things of the angels, and all the violence of the satans[c][b], and all their secret powers.
translation:
  language: pt
  text: E saiu uma ordem da presença do Senhor[a] contra os que habitam na terra seca, para que o fim deles chegasse; pois conheceram todas as coisas ocultas dos anjos, toda a violência dos satãs[b] e todo o seu poder oculto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de diante da face do Senhor”; trata-se de uma fórmula reverencial para algo que procede da presença de Deus.
    reason: lexical_alternative
  - marker: b
    text: “Satãs” traduz uma forma plural, e não o nome próprio singular “Satanás”. Também se poderia traduzir por “adversários”.
    reason: lexical_alternative
  - marker: c
    text: As palavras finais são difíceis neste testemunho etíope. O sentido pode ser “todo o seu poder oculto” ou “todos os seus poderes ocultos”; alguns entendem que há uma referência a praticantes de artes ocultas ou feitiçaria.
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: ordem
  rationale: Expressa uma determinação revestida de autoridade sem dar ao termo um sentido jurídico mais específico do que o texto exige.
- source_word: ወጽአ እምቅድመ ገጸ እግዚአ
  choice: saiu da presença do Senhor
  rationale: Reproduz de modo natural em português a fórmula semítica que descreve algo procedente de diante da face ou presença divina.
- source_word: ዲበ እለ የሐድሩ የብስ
  choice: contra os que habitam em terra seca
  rationale: Mantém tanto a força adversativa da ordem quanto a imagem literal da terra seca, especialmente significativa no contexto do dilúvio.
- source_word: ከመ ውእቱ ይኩን ሕልቀትሙ
  choice: para que chegasse o fim deles
  rationale: Preserva a ideia de término ou destruição sem especificar além do que permite o substantivo etíope.
- source_word: አእመሩ
  choice: conheceram
  rationale: O passado simples se ajusta à oração causal e comunica a aquisição ou posse de conhecimento ilícito.
- source_word: ኵሎ ኅቡኣተ መላእክት
  choice: todas as coisas ocultas dos anjos
  rationale: Mantém o sentido concreto e amplo de coisas escondidas ou secretas, sem introduzir o termo técnico “mistérios”.
- source_word: ግፍዐ ሰይጣናት
  choice: a violência dos satãs
  rationale: “Violência” conserva a ideia de opressão ou injustiça, e “satãs” representa explicitamente o plural do texto, sem convertê-lo no nome próprio singular Satanás.
- source_word: ኃይሎሙ ኅቡአ ኅቡኣት
  choice: todo o seu poder oculto
  rationale: Traduz o núcleo claro da expressão — poder ou força escondida — enquanto a nota registra a dificuldade causada pelas formas finais do testemunho etíope.
theological_decisions:
- issue: Plural de ሰይጣናት
  choice: satãs
  alternative: Satanás; adversários; demônios
  rationale: A forma etíope é plural. Mantê-la como substantivo comum preserva a configuração demonológica própria da passagem e evita harmonizá-la com o nome próprio singular de tradições posteriores.
- issue: Alcance de “os que habitam em terra seca”
  choice: manter a imagem terrestre ligada ao juízo do dilúvio
  alternative: habitantes da terra; uma classe específica de pecadores
  rationale: No contexto noáquico, a terra seca evoca os seres humanos expostos ao dilúvio vindouro. A tradução conserva essa imagem sem definir além do texto quem está incluído.
- issue: Sentido das palavras finais
  choice: poder oculto, com nota de incerteza textual
  alternative: poderes ocultos; praticantes de artes ocultas ou feitiçaria
  rationale: O testemunho fornecido sustenta claramente a associação entre poder e ocultamento, mas sua terminação repetida é difícil. A tradução evita inserir explicitamente feiticeiros sem apoio textual seguro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sintaxe mantém o tom apocalíptico sem reproduzir mecanicamente a expressão semítica “de diante da face”. O plural incomum “satãs” é deliberado e esclarecido em nota.
