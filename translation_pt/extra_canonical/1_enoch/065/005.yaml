base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/005.yaml
  text: And my grandfather Enoch came and stood beside me[a], and he said to me[b], “Why have you cried out to me with a bitter cry and weeping?”
translation:
  language: pt
  text: 'E meu avô Enoque veio, pôs-se ao meu lado e me disse: “Por que você clamou a mim com um grito amargo e pranto?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽአ
  choice: veio
  rationale: Verbo narrativo básico de movimento; “veio” é a correspondência direta e natural.
- source_word: እምሐው*የ
  choice: meu avô
  rationale: Embora a transcrição contenha um sinal de incerteza, a leitura corrigida como termo de parentesco com sufixo de primeira pessoa é apoiada pelo contexto próximo e evita a análise anterior, equivocada, como “da minha morada”.
- source_word: ቆመ ኀቤየ
  choice: pôs-se ao meu lado
  rationale: Expressa tanto o ato de se posicionar quanto a proximidade física, em português narrativo natural.
- source_word: በምንት
  choice: por que
  rationale: Interrogativo causal direto, apropriado à pergunta no diálogo.
- source_word: ጸራሕከ
  choice: você clamou
  rationale: O verbo indica um brado forte; “clamou” conserva essa intensidade. O uso de “você” favorece ampla legibilidade brasileira sem perder dignidade.
- source_word: ጽራኀ መሪረ
  choice: com um grito amargo
  rationale: Mantém a imagem compacta de um brado marcado por profunda aflição.
- source_word: ብካየ
  choice: e pranto
  rationale: “Pranto” preserva o sentido de choro lamentoso e acompanha com naturalidade “grito amargo”.
theological_decisions:
- issue: Identificação de Enoque como avô do narrador
  choice: meu avô Enoque
  alternative: Enoque, vindo da minha morada
  rationale: A leitura contextual e filológica corrigida entende a forma incerta como “meu avô”. A antiga divisão como preposição “de” mais um suposto termo para morada resultava de erro de reconhecimento textual e deve ser rejeitada.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação conserva a intensidade dupla do original — grito e pranto — sem acrescentar explicação denominacional.
