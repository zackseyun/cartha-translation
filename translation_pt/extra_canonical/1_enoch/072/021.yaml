base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/021.yaml
  text: And the sun comes out from that gate[a], and sets in the west, and returns to the east, and comes out from the third gate for thirty mornings[c][b], and sets in the west at the third gate.
translation:
  language: pt
  text: E o sol sai por aquela porta, põe-se no oeste, volta para o leste[a], sai pela terceira porta durante trinta manhãs e põe-se no oeste, na terceira porta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “volta pela manhã”. O termo etíope pode significar tanto “manhã” como “leste”, o lugar do nascer do sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ፡ ፀሐይ
  choice: E o sol sai
  rationale: O verbo expressa sair ou vir para fora. “Sai” comunica de modo natural o movimento concreto do sol e permite preservar sua repetição posterior.
- source_word: እምይእቲ፡ ኆኅት
  choice: por aquela porta
  rationale: ኆኅት designa porta ou portal, e não a janela distinta mencionada na arquitetura cósmica do Livro Astronômico. A preposição é vertida como “por” para indicar a passagem do sol pela abertura.
- source_word: ወያዓርብ፡ በምዕራብ
  choice: põe-se no oeste
  rationale: No contexto do percurso solar, o verbo é naturalmente expresso por “pôr-se”; ምዕራብ indica o oeste.
- source_word: ወይገብእ፡ በጽባሕ
  choice: volta para o leste
  rationale: O verbo pode indicar retornar, e ጽባሕ, literalmente associado à manhã, também designa o leste como lugar do nascer do sol. O paralelismo espacial com “oeste” favorece “leste”, sem eliminar a alternativa temporal.
- source_word: በሣልስት፡ ኆኅት
  choice: pela terceira porta / na terceira porta
  rationale: A primeira ocorrência acompanha o ato de sair e, por isso, recebe “pela”; a segunda acompanha o pôr do sol e recebe “na”. Essa variação explicita em português a relação exigida por cada verbo sem alterar a porta referida.
- source_word: ሠላሳ፡ ጸባሐ
  choice: durante trinta manhãs
  rationale: Mantém a contagem concreta do texto, “trinta manhãs”, em vez de normalizá-la silenciosamente para “trinta dias”.
theological_decisions:
- issue: Arquitetura cósmica do Livro Astronômico
  choice: porta
  alternative: janela
  rationale: O termo etíope empregado é ኆኅት, “porta/portal”, enquanto o livro dispõe de vocábulo distinto para “janela”. “Porta” preserva a imagem cosmológica específica sem modernizá-la.
- issue: Sentido de በጽባሕ
  choice: para o leste
  alternative: pela manhã
  rationale: O contraste com o oeste e a descrição do circuito solar favorecem o sentido espacial “leste”. Como o vocábulo também significa “manhã”, a nota conserva a ambiguidade lexical legítima.
translation_notes:
  register: Português atual, digno e acessível, com “põe-se” como expressão astronômica corrente. A repetição de “porta” e do movimento do sol foi mantida por fazer parte da estrutura do relato.
