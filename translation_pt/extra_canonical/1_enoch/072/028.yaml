base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/028.yaml
  text: And on that day the night decreases from its length by a ninth part[a], that is, one part, and the night becomes eleven parts[b], and the day seven parts.
translation:
  language: pt
  text: Naquele dia, a duração da noite diminui em uma nona parte de sua duração, isto é, uma parte; a noite passa a ter onze partes, e o dia, sete partes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope apresenta dificuldades textuais nesta expressão. A leitura adotada entende que a duração da noite se reduz em uma nona parte — isto é, uma das partes do esquema —, ficando a noite com onze partes, enquanto o dia tem sete.
    reason: textual_variant
lexical_decisions:
- source_word: ኀፀፀት
  choice: diminui
  rationale: Expressa redução ou encurtamento e se ajusta ao contexto de medição da duração da noite.
- source_word: ሌሊት
  choice: noite
  rationale: Tradução direta do período contraposto ao dia.
- source_word: እምኑኃ
  choice: de sua duração
  rationale: A forma é entendida como 'de sua extensão/duração', com o sufixo feminino referindo-se à noite, e não como o numeral 'nove'.
- source_word: ታስዕተ እደ
  choice: em uma nona parte
  rationale: Indica a medida em que a duração da noite diminui; a glosa seguinte identifica essa nona parte como uma parte do esquema.
- source_word: ክፍለ አሐደ
  choice: uma parte
  rationale: Preserva a terminologia técnica do sistema de divisão do dia e da noite.
- source_word: ወኮነት
  choice: e passa a ter
  rationale: Comunica com naturalidade o estado resultante após a diminuição.
- source_word: ፲ወ፪ተ ወአሐደ ክፍለ
  choice: onze partes
  rationale: Representa a duração resultante da noite conforme o esquema numérico do contexto.
- source_word: መዓልት
  choice: dia
  rationale: Mantém a contraposição direta entre noite e dia.
- source_word: ሰብዓተ ክፍለ
  choice: sete partes
  rationale: Conserva sem modernização a divisão numérica apresentada no texto.
theological_decisions:
- issue: Linguagem das divisões astronômicas
  choice: Manter o termo técnico 'partes'.
  alternative: Converter as divisões em horas ou proporções de luz e escuridão.
  rationale: O texto apresenta um esquema cosmológico próprio; 'partes' preserva sua forma de medição sem impor o sistema moderno de horas.
- issue: Relação sintática entre a noite e o dia na frase final
  choice: Usar 'enquanto o dia tem sete partes'.
  alternative: 'Repetir literalmente a coordenação: ''e o dia, sete partes''.'
  rationale: A formulação explicita em português o verbo elíptico sem alterar a relação numérica ou resolver qualquer tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Conserva-se 'partes' como termo técnico, evitando a substituição anacrônica por 'horas'.
