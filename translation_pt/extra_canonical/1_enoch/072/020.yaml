base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/020.yaml
  text: On that day the day becomes equal with the night[a], [and it becomes even], and the night becomes nine parts[c][b], and the day also nine parts.
translation:
  language: pt
  text: Naquele dia, o dia se torna igual à noite; [e se torna equilibrado][a]. A noite se torna nove partes[b], e o dia também se torna nove partes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “e se torna equilibrado” aparece entre colchetes no testemunho-fonte e pode representar um acréscimo textual ou uma leitura incerta; por transparência, foi mantida entre colchetes.
    reason: textual_variant
  - marker: b
    text: As “partes” são divisões esquemáticas empregadas nas descrições calendáricas do Livro dos Luminares, e não horas no sentido moderno.
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: Naquele dia
  rationale: Expressa de modo natural a locução temporal demonstrativa e mantém o contexto de observação calendárica.
- source_word: ይትዓረይ
  choice: se torna igual
  rationale: Preserva o sentido de passar a estar em igualdade, apropriado à equiparação astronômica entre dia e noite.
- source_word: መዓልት፡ ምስለ፡ ሌሊት
  choice: o dia se torna igual à noite
  rationale: A construção comparativa é vertida em português corrente sem alterar os dois termos cósmicos contrastados.
- source_word: '[ወይከውን፡ ዕሩየ፡]'
  choice: '[e fica equilibrado]'
  rationale: Mantém entre colchetes a expressão incerta do testemunho. “Equilibrado” comunica igualdade de proporções sem repetir literalmente a oração anterior.
- source_word: ተስዓተ፡ ክፍለ
  choice: nove partes
  rationale: Conserva a terminologia esquemática de divisão usada no Livro dos Luminares.
- source_word: ወትከውን፡ ሌሊት ... ወመዓልትኒ
  choice: A noite se torna ... e o dia também
  rationale: Reproduz o verbo formulaico de ser/tornar-se e a correspondência marcada por “também”, mantendo consistência com as proporções mutáveis descritas no capítulo.
theological_decisions:
- issue: Linguagem de igualdade astronômica
  choice: Ler o versículo como descrição calendárica da igualdade esquemática entre dia e noite.
  alternative: Entender a igualdade como imagem figurada de harmonia cósmica.
  rationale: O contexto imediato do Livro dos Luminares é técnico e astronômico; por isso, a tradução não espiritualiza a descrição.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A redação conserva o caráter técnico e formulaico da passagem, bem como os colchetes que sinalizam incerteza textual.
