base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/026.yaml
  text: And on that day the night increases and becomes nine parts[a], and the night becomes twelve parts and two parts exactly[d][c][b], and the day six parts.
translation:
  language: pt
  text: E, naquele dia, a noite diminui e passa a ter nove partes do dia[a]; a noite passa a ter doze partes e duas partes, exatamente[b], e o dia, seis partes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação numérica deste versículo é difícil no testemunho etíope. O texto parece apresentar uma medição esquemática do dia e da noite em partes, mas a sintaxe e a aritmética são irregulares; alguns intérpretes normalizam os números com base no contexto.
    reason: textual_variant
  - marker: b
    text: Isto é, com exatidão ou precisão. A expressão modifica a contagem das partes, embora a construção da frase permaneça difícil.
    reason: lexical_clarification
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: naquele dia
  rationale: Preserva o demonstrativo e a fórmula temporal recorrente do relato astronômico.
- source_word: ትነሡኅ፡ ሌሊት
  choice: a noite diminui
  rationale: O verbo indica redução ou diminuição; esta leitura também se ajusta ao movimento descrito no contexto astronômico, sem transformar o texto em paráfrase.
- source_word: ክፍለ
  choice: partes
  rationale: Mantém a terminologia esquemática usada para medir a duração do dia e da noite.
- source_word: ፲ወ፪ተ፡ ወ፪እቲ
  choice: doze partes e duas partes
  rationale: Conserva separadamente os números transmitidos, em vez de somá-los ou harmonizá-los, pois a formulação etíope é difícil.
- source_word: ጥንቅቀ
  choice: exatamente
  rationale: O termo funciona adverbialmente com o sentido de exatidão ou precisão.
- source_word: ማዓልት፡ ስድስተ፡ ክፍለ
  choice: o dia, seis partes
  rationale: Preserva a concisão elíptica da cláusula, empregando pontuação natural em português sem acrescentar uma relação não expressa.
theological_decisions:
- issue: Possível harmonização da sequência numérica astronômica
  choice: Manter a sequência difícil tal como transmitida, com esclarecimento em nota
  alternative: Normalizar os números com base no contexto astronômico circundante
  rationale: Embora não seja uma questão doutrinária direta, a harmonização ocultaria uma dificuldade real do testemunho etíope. A tradução preserva a tensão textual sem impor uma reconstrução.
translation_notes:
  register: Português moderno, digno e acessível, com cadência compatível com um relatório astronômico antigo. Emprega-se “diminui”, em vez de “aumenta”, por corresponder melhor ao verbo etíope apresentado. A elipse final é mantida de forma inteligível, e a irregularidade numérica não é corrigida silenciosamente.
