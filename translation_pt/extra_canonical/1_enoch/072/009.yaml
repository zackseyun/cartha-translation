base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/009.yaml
  text: And in those days the day grows longer from day to day[a], and the night grows shorter from night to night[c][b], until thirty mornings.
translation:
  language: pt
  text: E naqueles dias, o dia se alonga de um dia para o outro[a], e a noite se encurta de uma noite para a outra, até se completarem trinta manhãs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez repete literalmente “dia” numa construção comparativa. O sentido provável é que cada dia sucessivo se torna mais longo.
    reason: lexical_alternative
  - marker: b
    text: Ou “até trinta auroras”. O termo significa literalmente “manhã” ou “aurora” e provavelmente assinala uma etapa contada no esquema dos luminares.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: naqueles dias
  rationale: Expressão temporal corrente que preserva o tom elevado e apocalíptico do texto.
- source_word: ትነኍኅ
  choice: se alonga
  rationale: Comunica naturalmente o aumento da duração do dia no contexto astronômico.
- source_word: ዕለት እምዕለት
  choice: de um dia para o outro
  rationale: Mantém a comparação progressiva entre dias sucessivos sem reproduzir em português uma construção excessivamente obscura.
- source_word: ተኃጽር ሌሊት እምሌሊት
  choice: a noite se encurta de uma noite para a outra
  rationale: Preserva o paralelismo com a primeira oração e exprime a diminuição sucessiva da duração das noites.
- source_word: እስከ ሠላሳ ጽባሕ
  choice: até se completarem trinta manhãs
  rationale: Conserva o sentido concreto de 'manhãs' e torna explícito, sem alterar a imagem, que se trata de uma contagem até trinta.
theological_decisions:
- issue: Como representar a construção comparativa repetitiva 'dia de/desde dia' e 'noite de/desde noite'
  choice: de um dia para o outro / de uma noite para a outra
  alternative: dia após dia / noite após noite; mais longo que o dia / mais curta que a noite
  rationale: O contexto descreve alterações medidas e sucessivas na duração do dia e da noite. A formulação escolhida preserva a progressão comparativa e o paralelismo sem resolver o texto em uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo entre dia e noite. A locução “se alonga/se encurta” mantém o caráter observacional e astronômico.
