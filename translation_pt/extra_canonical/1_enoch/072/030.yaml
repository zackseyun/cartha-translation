base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/030.yaml
  text: And on that day the night is shortened from its length[a], and the night becomes ten parts[b], and the day eight parts.
translation:
  language: pt
  text: E naquele dia, a noite se encurta em sua duração[a] e passa a ter dez partes[b], e o dia, oito partes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O Livro Astronômico divide esquematicamente o conjunto do dia e da noite em dezoito “partes” para descrever as mudanças sazonais; não se trata de horas de relógio.
    reason: cultural_note
  - marker: b
    text: 'A transcrição etíope fornecida traz literalmente “doze partes”, mas “dez partes” é adotado aqui por concordar com a sequência calendárica do contexto e completar, com as oito partes do dia, o total fixo de dezoito. Outra tradução possível segundo essa transcrição: “doze partes”.'
    reason: textual_variant
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: naquele dia
  rationale: Expressa naturalmente em português a referência temporal demonstrativa do geʽez.
- source_word: ተኃጽጸ፡ ሌሊት
  choice: a noite se encurta
  rationale: Preserva a ideia de redução da noite no contexto das variações sazonais.
- source_word: እምኑኃ
  choice: em sua duração
  rationale: Neste contexto, a extensão da noite é temporal; “duração” é mais claro e idiomático que “comprimento”.
- source_word: ትከውን፡ ሌሊት፡ ፲ወ፪ተ፡ ክፍለ
  choice: passa a ter dez partes
  rationale: “Passa a ter” comunica o estado resultante. Adota-se “dez” conforme a revisão textual e a sequência do sistema de dezoito partes, embora a transcrição fornecida leia “doze”.
- source_word: ማዓልት፡ ፰ክፍለ
  choice: e o dia, oito partes
  rationale: Mantém o paralelismo compacto do original, com o verbo subentendido de modo natural em português.
