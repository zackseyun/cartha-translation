base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/022.yaml
  text: And on that day the night exceeds the day[a], and the night increases from night to night, and the day grows shorter from day to day, until thirty mornings, and the night becomes exactly ten parts[e][d][c][b], and the day eight parts.
translation:
  language: pt
  text: E naquele dia, a noite excede o dia e aumenta de noite em noite, enquanto o dia se torna mais curto de dia em dia, até trinta manhãs[a]; então a noite passa a ter exatamente[b] dez partes, e o dia, oito partes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trinta manhãs” pode designar a contagem de trinta dias ou amanheceres sucessivos no ciclo sazonal; o ge'ez diz literalmente “trinta manhãs”.
    reason: cultural_note
  - marker: b
    text: O termo ge'ez aqui traduzido por “exatamente” pode também ter o sentido de “por completo” ou “em medida completa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: naquele dia
  rationale: Expressão temporal natural em português, preservando a sequência da descrição astronômica.
- source_word: ሌሊት እምዕለት ትነሡኅ
  choice: a noite excede o dia
  rationale: Comunica de modo claro a força comparativa da construção sem recorrer a uma formulação artificial.
- source_word: ወሌሊት እምሌሊት ትነሡኅ
  choice: aumenta de noite em noite
  rationale: A repetição do substantivo com እም indica progressão sucessiva; a formulação portuguesa mantém esse movimento.
- source_word: ወተሐጽር ዕለት እምዕለት
  choice: o dia se torna mais curto de dia em dia
  rationale: Preserva tanto a ideia de diminuição da duração quanto a progressão diária.
- source_word: እስከ ሠላሳ ጸባሕ
  choice: até trinta manhãs
  rationale: Mantém o sentido literal de ጸባሕ, sem converter interpretativamente a contagem em dias.
- source_word: ጥንቁቀ
  choice: exatamente
  rationale: O termo qualifica a medida como exata ou precisa, nuance relevante no esquema astronômico.
- source_word: ዐሠርተ ክፍለ / ስመንተ ክፍለ
  choice: dez partes / oito partes
  rationale: Conserva a terminologia técnica do sistema proporcional apresentado no Livro Astronômico, sem substituí-la por horas modernas.
theological_decisions:
- issue: Linguagem de medição astronômica
  choice: Manter “partes” como unidade esquemática do dia e da noite.
  alternative: Converter as medidas em horas ou apenas dizer que as noites ficam mais longas e os dias mais curtos.
  rationale: A tradução preserva a cosmologia e o sistema de medição próprios do texto, evitando impor categorias modernas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação repetitiva do original foi parcialmente preservada, mas organizada com “enquanto” e ponto e vírgula para tornar a progressão astronômica mais inteligível.
