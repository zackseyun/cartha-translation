base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/031.yaml
  text: And on that day the sun goes out from that gate and sets in the west[a], and returns to the east and rises through the third gate for thirty-one mornings[b], and sets in the west of heaven.
translation:
  language: pt
  text: E naquele dia o sol sai por aquela porta, põe-se no oeste[a], retorna ao leste e nasce pela terceira porta durante trinta e uma manhãs[b]; então se põe no oeste do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Depois de “põe-se no oeste”, o texto ge’ez emprega um verbo que pode significar “entra” ou “retorna”. Aqui foi traduzido como “retorna”, pois a sequência descreve o movimento cíclico do sol de volta ao leste para o nascimento seguinte.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “trinta e uma manhãs”. O texto conta o período por alvoradas sucessivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወፅእ
  choice: sai
  rationale: Expressa de modo concreto e natural a saída do sol pela porta celeste, sem arcaísmo desnecessário.
- source_word: ኆኅት
  choice: porta
  rationale: Preserva a imagem arquitetônica do cosmos no Livro Astronômico, em vez de modernizá-la como janela ou horizonte.
- source_word: የዓርብ
  choice: põe-se
  rationale: É o equivalente astronômico idiomático em português para o movimento do sol no ocidente.
- source_word: ይገብእ
  choice: retorna
  rationale: O verbo também pode significar entrar; no encadeamento do ciclo solar, retorna comunica o movimento de volta ao leste, mantendo a alternativa em nota.
- source_word: በምስራቅ
  choice: ao leste
  rationale: A construção é entendida direcionalmente após o pôr do sol, indicando o destino do retorno.
- source_word: ይሠርቅ
  choice: nasce
  rationale: É o termo corrente e preciso para o surgimento do sol.
- source_word: በሣልስት ኆኅት
  choice: pela terceira porta
  rationale: Indica a abertura celeste pela qual o sol passa ao nascer; pela é natural em português e conserva a noção de passagem.
- source_word: ሠላሳ ወአሐደ ጸባሐ
  choice: durante trinta e uma manhãs
  rationale: Mantém a contagem literal por manhãs sucessivas, característica da textura observacional da passagem.
- source_word: ምዕራብ ሰማይ
  choice: o oeste do céu
  rationale: Conserva a representação concreta do céu como espaço estruturado, sem substituí-la por horizonte.
theological_decisions:
- issue: Arquitetura cósmica dos céus
  choice: Manter “porta” e “o oeste do céu” como imagens visionárias e astronômicas concretas.
  alternative: Modernizar a descrição com “horizonte” ou simplesmente “céu ocidental”.
  rationale: A passagem apresenta um cosmos estruturado por portas celestes; a tradução preserva essa visão em vez de adaptá-la à terminologia astronômica moderna.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A sintaxe acompanha a sequência reiterativa do ge’ez, enquanto o ponto e vírgula evita uma cadeia excessivamente pesada. A terminologia preserva a cosmologia concreta e a ambiguidade lexical relevante.
