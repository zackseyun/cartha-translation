lexical_decisions:
- source_word: መጽሐፈ ሚጠተ ብርሃናት ሰማይ
  choice: O livro dos percursos dos luminares do céu
  rationale: “Livro” preserva o título da seção; “percursos” comunica o movimento ordenado dos astros sem recorrer ao anacrônico “órbitas”; “luminares” mantém o registro cósmico e elevado.
- source_word: በበሕዝቢሆሙ
  choice: cada qual segundo sua companhia
  rationale: O substantivo tem o sentido básico de “povo/assembleia” e, aplicado aos luminares, denota agrupamentos. “Companhia” conserva melhor a metáfora coletiva do que o termo taxonômico “classe”.
- source_word: ሥልጣኖሙ
  choice: seu domínio
  rationale: Expressa poder, autoridade ou esfera de governo atribuída aos luminares, preservando o registro solene.
- source_word: ዘመኖሙ
  choice: suas estações
  rationale: No contexto astronômico e calendárico, o termo se refere a tempos ou períodos determinados; “estações” comunica essa função cíclica.
- source_word: ሙላዳቲሆሙ
  choice: suas origens
  rationale: O sentido literal inclui “nascimentos”; “origens” evita antropomorfismo indevido e deixa aberta a possível referência astronômica aos nascimentos ou pontos de surgimento.
- source_word: አውራኂሆሙ
  choice: seus caminhos
  rationale: Mantém a imagem antiga de vias ou trajetos celestes sem introduzir terminologia científica moderna.
- source_word: ኵሎ መጽሐፎሙ
  choice: todo o registro a respeito deles
  rationale: O substantivo está no singular, literalmente “todo o livro deles”. “Registro a respeito deles” é natural em português e evita sugerir que os próprios luminares possuam um livro.
- source_word: ግብር ኃዲስ
  choice: uma nova obra
  rationale: É a tradução lexicalmente direta e preserva a abertura semântica entre obra, ato e criação.
theological_decisions:
- issue: Sentido escatológico de ግብር ኃዲስ
  choice: uma nova obra
  alternative: uma nova criação
  rationale: A formulação parece apontar para um ato futuro e duradouro, mas o texto não define explicitamente se se trata da criação renovada ou de uma nova ordenação cósmica. “Nova obra” preserva essa tensão.
- issue: Agente da nova obra
  choice: 'construção impessoal: “até que se realize”'
  alternative: “até que Deus realize”
  rationale: Embora o contexto possa pressupor ação divina, o texto não nomeia o agente nesta oração; a tradução não o explicita.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A sintaxe longa do original foi dividida em dois períodos, sem apagar as relações entre o título, a revelação de Uriel e o ciclo anual. Evitaram-se tanto arcaísmos desnecessários quanto termos astronômicos anacrônicos.
