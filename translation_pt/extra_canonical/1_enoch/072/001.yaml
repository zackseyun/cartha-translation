base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/001.yaml
  text: The book of the courses of the luminaries of heaven[a], how they are, each according to their companies, and according to their dominion and their seasons, according to their names and their origins, and according to their paths, which Uriel, the holy angel who was with me, showed me—he who is their guide—and the whole record of them, as he showed me, and how it is with regard to every year of the world and forever[h][g][f][e][d][c][b], until a new work is accomplished which will endure forever.
translation:
  language: pt
  text: 'O livro dos percursos dos luminares do céu: como eles são, cada qual segundo sua companhia[a], seu domínio e suas estações; segundo seus nomes, suas origens[b] e seus caminhos. Uriel, o santo anjo que estava comigo — aquele que os guia —, mostrou-me isso e todo o registro deles[c], conforme ele mo mostrou, e como é em cada ano do mundo e para sempre[d], até que se realize uma nova obra[e] que permanecerá para sempre.


    [a] Literalmente, “seu povo/sua assembleia”; o termo social é aplicado aqui, em sentido figurado, aos agrupamentos dos corpos celestes. Também poderia ser traduzido por “grupo” ou “hoste”.


    [b] O termo significa literalmente “nascimentos” ou “origens”; no contexto astronômico, pode aludir aos pontos de onde os luminares surgem.


    [c] O geʿez traz, no singular, uma expressão que significa literalmente “todo o livro deles” ou “todo o seu registro”.


    [d] “Cada ano do mundo” diz respeito ao ciclo anual completo descrito nesta seção. A construção do geʿez é condensada e também pode ser entendida como “como é todo o ano do mundo”.


    [e] “Uma nova obra” também pode ser entendida como “uma nova criação”, isto é, um ato divino novo e permanente.'
  philosophy: optimal-equivalence
  footnotes:
