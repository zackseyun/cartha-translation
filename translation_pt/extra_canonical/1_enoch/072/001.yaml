    issue: A construção referente ao que Uriel mostrou está pouco fielmente articulada.
    rationale: O original associa Uriel, que é o guia dos luminares, ao ato de mostrar tanto o arranjo descrito quanto o livro/registro inteiro. “essas coisas ... tal como me mostrou” acrescenta um demonstrativo sem correspondente e deixa o segundo “me mostrou” sem objeto claramente expresso.
  - severity: low
    issue: A ancoragem da nota sobre o registro não recai diretamente sobre a expressão traduzida.
    rationale: A nota [c] deve acompanhar “registro deles”, a expressão que verte o singular geʿez “todo o livro deles”, e não o fim mais amplo da oração.
