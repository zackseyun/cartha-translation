base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/029.yaml
  text: And the sun returns and enters the second gate[a], which is in the east; and it returns to that principal course for thirty mornings[c][b], rising and setting.
translation:
  language: pt
  text: E o sol retorna e entra pelo segundo portal, que fica no leste; e retorna àquele percurso principal durante trinta manhãs, nascendo e se pondo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብአ
  choice: retorna
  rationale: O verbo indica retorno; no contexto astronômico, descreve o sol voltando ao leste, não o seu nascer, expresso mais adiante por ይሠርቅ.
- source_word: ቦአ ውስተ
  choice: entra pelo
  rationale: Preserva o movimento para dentro do portal e soa natural em português na imagem dos portais celestes.
- source_word: ካልእ ኆኅት
  choice: segundo portal
  rationale: No contexto sequencial dos portais, ካልእ tem valor ordinal, confirmado pela progressão subsequente.
- source_word: እንተ በምሥራቅ
  choice: que fica no leste
  rationale: Identifica de modo claro e natural a localização do portal.
- source_word: ይገብእ ዲበ ዝኩ አርእስቲሁ
  choice: retorna àquele percurso principal
  rationale: Mantém o segundo verbo de retorno, o demonstrativo e a referência a አርእስቲሁ como percurso principal, sem reproduzir servilmente a preposição ge'ez.
- source_word: ሠላሳ ጸባሐ
  choice: durante trinta manhãs
  rationale: Expressa a duração calendárica de maneira clara, preservando literalmente a unidade 'manhãs'.
- source_word: ይሠርቅ ወየዓርብ
  choice: nascendo e se pondo
  rationale: Conserva o par astronômico de nascer e pôr-se com ritmo natural em português.
