base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/011.yaml
  text: And the sun comes out from that fourth gate[a], and sets in the fourth gate, and returns to the fifth gate of the east for thirty mornings[c][b]; then it comes out from it and sets in the fifth gate.
translation:
  language: pt
  text: E o sol sai daquele quarto portão e se põe no quarto portão; depois, retorna ao quinto portão do leste por trinta manhãs[a]. Então sai dele e se põe no quinto portão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “trinta manhãs”; algumas traduções dizem “trinta dias”.
    reason: lexical_alternative
  - marker: b
    text: A oração final repete o quinto portão. A formulação concisa pode resumir a continuação do percurso do sol depois das trinta manhãs, sem necessariamente descrever outro movimento separado em detalhe.
    reason: textual_clarity
lexical_decisions:
- source_word: ወይወፅእ ፀሐይ
  choice: E o sol sai
  rationale: Mantém o sentido concreto de sair ou emergir, natural no contexto do nascer do sol, sem substituir a imagem cosmológica pelo termo interpretativo “nasce”.
- source_word: እምዘክቱ ራብዕ ኆኅት
  choice: daquele quarto portão
  rationale: O demonstrativo retoma o portão anteriormente mencionado; “portão” preserva a imagem recorrente do texto astronômico.
- source_word: ወየዓርብ
  choice: e se põe
  rationale: No percurso diário do sol, o verbo descreve seu ocaso; “pôr-se” é corrente e digno em português.
- source_word: በራብዕት
  choice: no quarto portão
  rationale: Repõe o substantivo elíptico para dar clareza em português sem alterar a referência.
- source_word: ወይገብእ
  choice: depois, retorna
  rationale: Aqui o verbo indica o retorno do sol para o lado oriental após seu ocaso, conforme a sequência cosmológica do capítulo, e não simplesmente sua entrada.
- source_word: ውስተ ኃምስ ኆኅት እንተ ጽባሕ
  choice: ao quinto portão do leste
  rationale: Preserva tanto a numeração do portão quanto o modificador direcional oriental presente no ge'ez.
- source_word: ሠላሳ ጽባሐ
  choice: por trinta manhãs
  rationale: Conserva a forma característica de contagem por manhãs, em vez de nivelá-la para “dias”.
- source_word: እምኔሃ
  choice: dele
  rationale: O pronome retoma “portão”; em português, o gênero masculino exige “dele”.
- source_word: ኃምስት ኆኅት
  choice: o quinto portão
  rationale: Mantém a terminologia técnica e a repetição do texto-fonte.
theological_decisions:
- issue: Tratamento da cosmologia visionária
  choice: Preservar os “portões” e o movimento do sol entre eles
  alternative: Modernizar a descrição com termos como “setor”, “posição” ou uma paráfrase astronômica
  rationale: A tradução deve conservar a concepção cosmológica e a imagem apocalíptica do testemunho, sem harmonizá-las com a astronomia moderna.
- issue: Sentido do retorno ao portão oriental
  choice: Traduzir ይገብእ como “retorna” e explicitar “do leste”
  alternative: Traduzir como “entra no quinto portão” e omitir a orientação
  rationale: A sequência descreve o retorno do sol ao leste após pôr-se, e o ge'ez traz um modificador oriental que não deve ser omitido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A repetição de “portão” é mantida por clareza e fidelidade à terminologia cosmológica; “depois” explicita apenas a progressão discursiva já indicada pela sequência verbal.
