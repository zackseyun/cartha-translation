base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/018.yaml
  text: On that day the day diminishes by two parts[a], and the day becomes ten parts[b], and the night eight parts.
translation:
  language: pt
  text: Naquele dia, o dia diminui em duas partes[a] e passa a ter dez partes, e a noite, oito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O Livro Astronômico mede regularmente o período diurno e a noite em “partes” numeradas. O versículo descreve a diminuição sazonal da luz do dia: o dia fica com dez partes, e a noite, com oito.'
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: Naquele dia
  rationale: Fórmula temporal natural em português, mantendo a força demonstrativa do ge'ez.
- source_word: ተሐፅፅ
  choice: diminui
  rationale: Expressa a redução sazonal da duração do dia e mantém a terminologia recorrente do contexto astronômico.
- source_word: ተክልኤተ ክፍል
  choice: duas partes
  rationale: Indica a medida da diminuição; em português, o verbo 'diminuir' admite naturalmente a medida sem preposição.
- source_word: ወትከውን ዕለት
  choice: e passa a ter dez partes
  rationale: Mantém 'o dia' como sujeito e comunica com naturalidade o estado resultante, sem sugerir que o próprio dia se transforme literalmente em partes.
- source_word: ዕለት ዓሠርተ ክፍለ
  choice: dez partes
  rationale: Preserva o sistema técnico de contagem da luz diurna em partes.
- source_word: ወሌሊት ስመንተ ክፍለ
  choice: e a noite, oito
  rationale: A elipse do verbo é natural em português e conserva o paralelismo conciso do original.
