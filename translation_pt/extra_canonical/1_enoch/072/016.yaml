base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/016.yaml
  text: And when thirty mornings are completed[a], the day decreases by exactly one part, and the day becomes eleven parts[c][b], and the night seven.
translation:
  language: pt
  text: E, quando se completam trinta manhãs[a], o dia diminui exatamente uma parte, e o dia passa a ter onze partes[b], e a noite, sete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “trinta manhãs”. Nesta seção, a expressão funciona como um intervalo contado no calendário solar.
    reason: lexical_alternative
  - marker: b
    text: O capítulo mede repetidamente o dia e a noite em “partes” numeradas. Aqui, o período de luz do dia passa a ter onze partes, e a noite, sete.
    reason: cultural_note
lexical_decisions:
- source_word: ተፈጸመ
  choice: se completam
  rationale: Expressa a conclusão de um período contado, preservando o sentido formal de completar-se.
- source_word: ሠላሳ ጽባሕ
  choice: trinta manhãs
  rationale: Mantém o substantivo concreto do ge'ez, embora neste contexto ele funcione como unidade de contagem do calendário solar.
- source_word: ተሐፅፅ ማዓልት
  choice: o dia diminui
  rationale: Conserva o caráter quantitativo e esquemático da redução da duração diurna.
- source_word: ክፍለ አሐደ ጥንቁቀ
  choice: exatamente uma parte
  rationale: Inclui o valor de precisão de ጥንቁቀ e a unidade de redução indicada por ክፍለ አሐደ.
- source_word: ወትከውን ዕለት ዓሠርተ ወአሐደ ክፍለ
  choice: e o dia passa a ter onze partes
  rationale: Trata 'o dia' como sujeito e exprime naturalmente em português o estado resultante, sem sugerir que o dia literalmente se transforma em partes.
- source_word: ወሌሊት ስብዓተ
  choice: e a noite, sete
  rationale: Preserva a formulação elíptica do original; 'partes' é recuperado claramente da oração anterior.
