base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/007.yaml
  text: And in that fourth gate[a], from which the sun comes out in the first month, there are twelve open windows[c][b], from which a flame comes out when they are opened at their appointed times.
translation:
  language: pt
  text: E naquela quarta porta, pela qual o sol sai no primeiro mês, há doze janelas abertas[a], das quais sai uma chama quando elas se abrem nos tempos que lhes foram determinados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto transcrito apresenta uma provável falha de OCR: መላክወ em lugar de መሳክወ, “janelas”. Com ርኅዋተ, a expressão significa “janelas abertas”.'
    reason: textual_note
lexical_decisions:
- source_word: ኆኅት ራብዕት
  choice: quarta porta
  rationale: Mantém a imagem arquitetônica recorrente do Livro Astronômico, na qual os luminares atravessam portas celestes.
- source_word: ይወፅእ ፀሐይ
  choice: o sol sai
  rationale: Expressa de modo natural e concreto o movimento do sol para fora da porta.
- source_word: በወርኅ ቀዳማዊ
  choice: no primeiro mês
  rationale: Tradução temporal direta e idiomática.
- source_word: ባቲ ፲፪ መስኮተ መላክወ ርኅዋተ
  choice: há doze janelas abertas
  rationale: A revisão textual identifica መላክወ como erro de OCR por መሳክወ; ርኅዋተ qualifica as janelas como abertas. Assim, evita-se a interpretação anterior e infundada ligada a domínio, vento ou anjos.
- source_word: ዘእምኔሆን ይወፅእ ላህብ
  choice: das quais sai uma chama
  rationale: Preserva a relação relativa e a imagem vívida da chama que procede das janelas.
- source_word: ሶበ ይትረሐዉ
  choice: quando elas se abrem
  rationale: Conserva o sentido passivo/reflexivo e a imagem das aberturas celestes em operação.
- source_word: እምዘመነ ዚአሆሙ
  choice: nos tempos que lhes foram determinados
  rationale: Comunica tempos próprios ou designados dentro da ordem calendárica do texto sem exigir que seja um único momento.
theological_decisions:
- issue: Se a expressão corrompida pelo OCR deve ser entendida como referência a vento, domínio ou anjos
  choice: janelas abertas
  alternative: domínio do vento; anjos dos ventos
  rationale: A leitura revista reconhece መላክወ como erro de OCR por መሳክወ, ‘janelas’, enquanto ርኅዋተ significa ‘abertas’. Não há, portanto, base suficiente nesta frase para introduzir vento, domínio ou seres angélicos.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de fácil leitura no Brasil e compreensão internacional. A formulação conserva as imagens cosmológicas concretas do texto e corrige a leitura anterior baseada em OCR defeituoso.
