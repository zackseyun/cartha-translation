base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/013.yaml
  text: And it enters at dawn and goes out through the sixth[a], and it goes out and sets in the sixth gate for thirty-two mornings[d][c][b], according to its sign.
translation:
  language: pt
  text: E, ao amanhecer, ele entra e sai pela sexta porta; então sai e se põe na sexta porta durante trinta e duas manhãs[a], por causa de seu sinal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “trinta e duas manhãs”; o texto conta o período por manhãs, e não pelo termo mais genérico “dias”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “segundo seu sinal” ou “com respeito ao seu sinal”. A expressão ge''ez pode indicar causa ou relação; traduções anteriores a entenderam como conformidade com o sinal.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ይገብእ
  choice: entra
  rationale: Mantém o verbo concreto de movimento e a linguagem arquitetônica do percurso do astro.
- source_word: ጽባሐ
  choice: ao amanhecer
  rationale: Expressa de modo natural o valor temporal de “manhã/amanhecer” neste aviso astronômico.
- source_word: ይወፅእ
  choice: sai
  rationale: Preserva as duas ocorrências do verbo no texto ge'ez e sua repetição técnica, sem omitir a segunda.
- source_word: ውስተ ሳድስት
  choice: pela sexta
  rationale: A referência a uma abertura ou porta está elíptica. “Pela” comunica o movimento através dela sem acrescentar o substantivo ao texto principal.
- source_word: የዓርብ
  choice: se põe
  rationale: No contexto do curso solar, o verbo descreve naturalmente o ocaso, não apenas uma descida genérica.
- source_word: ኆኅት
  choice: portão
  rationale: Conserva a arquitetura cósmica concreta do Livro dos Luminares; “janela” ou “abertura” também seriam possíveis, mas são menos coerentes com a imagem recorrente dos portões.
- source_word: ሠላሳ ወ፪ ጽባሕ
  choice: trinta e duas manhãs
  rationale: Mantém a unidade de contagem expressa no original, em vez de normalizá-la para “dias”.
- source_word: በእንተ ትእምርተ ዚአሃ
  choice: por causa de seu sinal
  rationale: በእንተ tem primariamente valor causal ou relacional (“por causa de”, “a respeito de”). A nota registra a leitura de conformidade favorecida por traduções anteriores.
theological_decisions:
- issue: Imagem astronômica de aberturas celestes
  choice: Conservar “portão” e os verbos concretos de movimento.
  alternative: Naturalizar como setor, posição ou estação astronômica.
  rationale: A passagem descreve uma arquitetura cósmica revelada. Modernizá-la apagaria a forma visionária do texto.
- issue: Relação entre o período e o “sinal”
  choice: 'Traduzir a expressão com valor causal: “por causa de seu sinal”.'
  alternative: “segundo seu sinal” ou “de acordo com seu sinal”.
  rationale: O valor causal é lexicalmente forte em በእንተ, mas a construção pode ser entendida em sentido relacional; a alternativa é preservada em nota, sem transformar a ambiguidade em afirmação doutrinária.
translation_notes:
  register: Português atual, digno e acessível, com leve repetição deliberada para refletir a formulação técnica do ge'ez. O pronome “ele” retoma o astro, provavelmente o sol, sem explicitar no versículo um referente que o trecho isolado não nomeia.
