base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/027.yaml
  text: And the sun completes its courses[a], and again it travels upon those courses; and it enters through that gate for thirty mornings[e][d][c][b], and in the west it sets opposite it.
translation:
  language: pt
  text: E o sol completa seus percursos e novamente percorre esses percursos; entra por aquela porta durante trinta manhãs[a] e, no oeste, põe-se em frente a ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “trinta manhãs”; no contexto, a expressão provavelmente indica trinta dias de aparições pela mesma porta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈጸመ
  choice: completa
  rationale: O presente descreve o movimento solar recorrente e harmoniza-se com os verbos seguintes, que apresentam ações habituais.
- source_word: አርእስቲሁ
  choice: seus percursos
  rationale: A forma plural, literalmente ligada a «cabeças», designa aqui os percursos ou trajetórias do sol; o plural deve ser preservado.
- source_word: ዳግመ የሐውር ዲበ ዝኩ አርእስቲሁ
  choice: torna a seguir por esses percursos
  rationale: Expressa repetição cíclica e mantém a referência demonstrativa aos percursos já mencionados.
- source_word: ኆኅት
  choice: porta
  rationale: Preserva a imagem cosmológica concreta das portas celestes característica do Livro Astronômico.
- source_word: ሠላሳ ጸባሐ
  choice: durante trinta manhãs
  rationale: Mantém a imagem literal de «manhãs», embora no contexto a expressão conte provavelmente um período de trinta dias.
- source_word: በምዕራብኒ ... የዓርብ
  choice: no oeste, põe-se
  rationale: «Pôr-se» é a expressão portuguesa natural para a descida do sol e preserva a localização ocidental.
- source_word: በመንጸሩ (leitura corrigida da edição)
  choice: diante dela
  rationale: A leitura da edição significa «em frente dela/oposta a ela» e se refere à porta; evita atribuir sentido ao erro de transcrição በምንዳቤሁ.
theological_decisions:
- issue: Imagem cosmológica do sol movendo-se por percursos e portas
  choice: Manter a linguagem concreta de percursos e porta
  alternative: Reformular como descrição astronômica moderna e abstrata
  rationale: A passagem apresenta uma cosmologia visionária estruturada; modernizá-la apagaria a forma literária e conceitual do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação e o ponto e vírgula conservam o encadeamento da descrição. «Diante dela» é mais natural em português do que «oposta a ela», sem eliminar a relação espacial.
