  verdict: revise
  source_fidelity: 'O texto preserva adequadamente a sequência do ge''ez: o sol completa os seus percursos, volta a mover-se por eles, entra pela porta durante trinta manhãs e se põe no oeste em relação oposta à porta. O plural de አርእስቲሁ foi corretamente mantido em «percursos», e «trinta manhãs» conserva a formulação literal.'
  naturalness: «Torna a seguir por esses percursos» não é uma construção natural em português moderno; «novamente percorre esses percursos» transmite com clareza o movimento reiterado. Para a relação espacial final, «em frente a ela» é mais idiomático que «diante dela» e conserva melhor o sentido de «oposto a ela».
  terminology: «Percursos», «porta», «manhãs» e «põe-se» são escolhas claras e adequadas ao registro cosmológico da passagem. Não há necessidade de modernizar a imagem das portas celestes.
