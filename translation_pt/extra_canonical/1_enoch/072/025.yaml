base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/025.yaml
  text: And on that day the sun comes out from that second gate[a], and sets in the west at the second gate, and returns to the east at the first gate for thirty-one mornings[d][c][b], and sets at the first gate in the west of heaven.
translation:
  language: pt
  text: E naquele dia o sol sai por aquele segundo portal e se põe no ocidente, no segundo portal; então entra no oriente pelo primeiro portal durante trinta e uma manhãs[a] e se põe no primeiro portal, no ocidente do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “trinta e uma manhãs”; no esquema dos luminares, a expressão funciona como uma contagem de dias.
    reason: cultural_note
lexical_decisions:
- source_word: ይወፅእ
  choice: sai
  rationale: Verbo concreto e natural para o surgimento do sol por uma abertura celeste, preservando a imagem espacial do texto.
- source_word: ኆኅት
  choice: portal
  rationale: No Livro Astronômico, designa uma abertura fixa do céu pela qual o sol transita. “Portal” comunica melhor essa arquitetura celeste do que “porta”, sem modernizá-la como “janela”.
- source_word: ያዓርብ
  choice: se põe
  rationale: Com o sol como sujeito e o ocidente como contexto, o verbo tem naturalmente o sentido astronômico de pôr-se.
- source_word: ይገብእ
  choice: retorna
  rationale: Embora o verbo possa significar entrar, a sequência cíclica favorece “retorna”; não se acrescenta um particípio como “entrando”, ausente no ge’ez.
- source_word: በአሐቲ ኆኅት
  choice: ao primeiro portal / no primeiro portal
  rationale: Na sequência enumerativa dos portais, አሐቲ funciona como ordinal, “primeiro”, e não apenas como o cardinal indefinido “um”. A preposição é vertida conforme a relação exigida em cada oração portuguesa.
- source_word: ሠላሳ ወ፩ ጸባሐ
  choice: durante trinta e uma manhãs
  rationale: ጸባሐ significa literalmente “manhã”; no esquema calendárico, as manhãs funcionam como contagem de dias, mas a imagem original é preservada.
- source_word: ምዕራበ ሰማይ
  choice: o ocidente do céu
  rationale: Mantém a expressão cosmológica e a arquitetura celeste do trecho; “céu” é natural em português e não reduz a frase a uma indicação meteorológica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe coordenada que preserva a sequência repetitiva do ge’ez. Emprega-se “portal” para a cosmologia das aberturas celestes e mantém-se “manhãs” em vez de normalizar silenciosamente para “dias”.
