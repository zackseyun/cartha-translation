base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/010.yaml
  text: On that day the day becomes longer than the night by a ninth part[a], and the day becomes exactly ten parts[c][b], and the night becomes exactly eight parts.
translation:
  language: pt
  text: '**1 Enoque 72:10** — Nesse dia, o dia se torna mais longo[a] que a noite em uma nona parte[b]; o dia passa a ter exatamente dez partes, e a noite, exatamente oito partes.


    [a] O texto etíope traz, depois de “se torna mais longo”, uma palavra entre colchetes cuja leitura e função são incertas. Ela não é necessária para o sentido básico da frase.


    [b] As “partes” são as divisões convencionais usadas neste capítulo para comparar a duração do dia e da noite. “Uma nona parte” corresponde à diferença de duas partes num total de dezoito: dez partes de dia e oito de noite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope traz, depois de “se torna mais longo”, uma palavra entre colchetes cuja leitura e função são incertas. Ela não é necessária para o sentido básico da frase.
    reason: textual_variant
  - marker: b
    text: 'As “partes” são as divisões convencionais usadas neste capítulo para comparar a duração do dia e da noite. “Uma nona parte” corresponde à diferença de duas partes num total de dezoito: dez partes de dia e oito de noite.'
    reason: cultural_note
lexical_decisions:
- source_word: በውእቱ፡ ዕለት፡
  choice: Nesse dia
  rationale: Mantém a fórmula temporal e a força demonstrativa em português natural.
- source_word: ትነኍኅ፡
  choice: se torna mais longo
  rationale: Expressa a ideia de aumento ou prolongamento e se ajusta ao contexto astronômico.
- source_word: እምሌሊት፡
  choice: que a noite
  rationale: 'A preposição tem aqui valor comparativo: a duração do dia excede a da noite.'
- source_word: ታስዕተ፡ እደ፡
  choice: em uma nona parte
  rationale: 'A expressão indica uma fração de um nono, não nove partes. Isso também corresponde ao esquema de dezoito partes: dez para o dia e oito para a noite.'
- source_word: ጥንቁቀ፡
  choice: exatamente
  rationale: O termo assinala precisão no cálculo e ocorre nas declarações sobre o dia e a noite.
- source_word: ዓሠርተ፡ ክፍለ፡
  choice: dez partes
  rationale: “Partes” comunica com clareza as divisões técnicas recorrentes do capítulo.
- source_word: ስመንተ፡ ክፍለ፡
  choice: oito partes
  rationale: Mantém a mesma tradução do termo técnico para assegurar consistência.
- source_word: '[ካዕበተ፡]'
  choice: não representado no corpo do texto
  rationale: A palavra entre colchetes é textualmente incerta e sua possível função, como “novamente” ou “uma segunda vez”, não é exigida pela sintaxe segura ao redor; a incerteza é registrada em nota.
theological_decisions:
- issue: Natureza da linguagem numérica do versículo
  choice: Tratar os números como divisões astronômicas técnicas do dia e da noite.
  alternative: Interpretá-los como numerologia apocalíptica simbólica ou como descrição apenas aproximada da mudança sazonal.
  rationale: O contexto do capítulo 72 apresenta medições do curso do sol e da variação da duração do dia e da noite. A tradução conserva esse caráter técnico dentro da cosmologia da obra, sem impor interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Nesse dia” e “passa a ter” evitam rigidez excessiva, enquanto “exatamente” preserva o tom preciso do cálculo astronômico. A ambiguidade da palavra etíope entre colchetes é mantida em nota, sem reconstrução conjectural no texto principal.
