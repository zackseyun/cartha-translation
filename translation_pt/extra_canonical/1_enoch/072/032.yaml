base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/032.yaml
  text: On that day the night decreases and becomes nine parts[a], and the day becomes nine parts, and the night equals the day[b], and the year becomes exact.
translation:
  language: pt
  text: Nesse dia, a noite diminui e passa a ter nove partes[a], e o dia passa a ter nove partes; a noite se iguala ao dia, e o ano se torna exato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A repetição de “nove partes” reflete a divisão esquemática do dia e da noite em porções numeradas no sistema astronômico do livro.
    reason: cultural_note
  - marker: b
    text: A expressão final também pode ser traduzida como “o ano se torna preciso” ou “o ano se completa”, conforme se entenda o termo ge'ez relacionado à exatidão e à completude.
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: Nesse dia
  rationale: Expressa de modo natural em português a referência temporal definida e preserva a força demonstrativa da expressão ge'ez.
- source_word: ትኃፅፅ፡ ሌሊት
  choice: a noite diminui
  rationale: Mantém o sentido mensurável de redução próprio do contexto astronômico, sem o transformar em descrição meramente figurada.
- source_word: ትስዓተ፡ ክፍለ
  choice: nove partes
  rationale: O Livro dos Luminares divide esquematicamente o dia e a noite em porções numeradas; “partes” é claro, conciso e adequado ao registro técnico.
- source_word: ይትዓረይ፡ ሌሊት፡ ምስለ፡ ማዓልት
  choice: a noite se iguala ao dia
  rationale: Preserva a relação explícita de igualdade entre noite e dia e soa natural em português contemporâneo.
- source_word: ዓመት፡ ጥንቅቀ
  choice: o ano se torna exato
  rationale: Conserva a ideia calendárica de exatidão ou medida correta sem eliminar a possível nuance de completude.
theological_decisions:
- issue: Afirmação calendárica no equilíbrio entre noite e dia
  choice: Apresentar a frase como observação astronômica e calendárica sobre a igualdade mensurada entre noite e dia.
  alternative: Interpretar “o ano se torna exato” como afirmação teológica sobre a perfeição cósmica ou tomar a igualdade apenas como aproximação sazonal.
  rationale: O contexto imediato do Livro dos Luminares é técnico e calendárico; não há motivo textual suficiente para introduzir simbolismo teológico ou litúrgico.
translation_notes:
  register: Português moderno, digno e acessível, com leve precisão técnica apropriada ao contexto astronômico. “Passa a ter” evita a formulação pouco natural “torna-se nove partes”, enquanto “se torna exato” preserva deliberadamente a tensão lexical da cláusula final.
