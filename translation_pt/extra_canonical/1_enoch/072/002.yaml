base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/002.yaml
  text: 'And this is the first law of the luminaries: the sun, a light, has its rising in the portals of heaven on the east, and its setting in the western portals of heaven.'
translation:
  language: pt
  text: E esta é a primeira lei dos luminares:[a] o sol, uma luz, tem seu nascimento[c] nos portais celestes do leste,[b] e seu ocaso nos portais celestes do oeste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ordenança” ou “regra” dos luminares. O termo indica a ordem fixa que rege os corpos celestes.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na direção da aurora”.
    reason: lexical_alternative
  - marker: c
    text: A transcrição fornecida traz aqui uma leitura defeituosa que poderia sugerir “entra”; a leitura corrigida descreve o nascimento do sol no leste, em paralelo com seu ocaso no oeste.
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: lei
  rationale: No Livro Astronômico, o termo designa a ordem fixa que rege os corpos celestes, e não uma ordem pontual dirigida a alguém.
- source_word: ቀዳማዊ
  choice: primeira
  rationale: Introduz o primeiro item de uma sequência de disposições astronômicas.
- source_word: ብርሃናት
  choice: luminares
  rationale: Mantém o registro astronômico e elevado do contexto, referindo-se aos corpos celestes.
- source_word: ፀሐይ
  choice: o sol
  rationale: Identificação direta do corpo celeste em questão.
- source_word: ብርሃን
  choice: uma luz
  rationale: Preserva o substantivo em aposição a “o sol”, sem explicação adicional.
- source_word: መዋፅኢሁ (leitura corrigida do texto impresso; a transcrição traz መባእ)
  choice: nasce
  rationale: A leitura corrigida significa a saída ou o surgimento do sol e forma paralelo nominal com seu ocaso; “nasce” expressa naturalmente o fenômeno em português.
- source_word: ኃዋኅወ
  choice: portais
  rationale: Conserva a imagem cosmológica de aberturas estruturadas por onde passam os astros.
- source_word: መንገለ ጽባሕ
  choice: a leste
  rationale: A expressão está ligada à direção da manhã ou aurora; “a leste” comunica claramente a orientação sem apagar essa relação.
- source_word: ወምዕራቢሁ
  choice: e se põe
  rationale: Refere-se nominalmente ao ocaso do sol e estabelece o contraste correto com seu nascimento no leste.
- source_word: ዘምዕራብ
  choice: ocidentais
  rationale: Forma adjetival natural em português, preservando o contraste direcional com o leste.
theological_decisions:
- issue: Natureza da linguagem sobre a ordem cósmica
  choice: “lei” para ትእዛዝ
  alternative: “ordenança”, “ordem” ou “regra”
  rationale: O versículo descreve a estrutura estabelecida da criação, não um mandamento moral dirigido aos seres humanos.
- issue: Movimento solar na cosmologia do texto
  choice: nascimento no leste e ocaso no oeste
  alternative: entrada no leste e saída no oeste, baseada na transcrição defeituosa
  rationale: A leitura corrigida do texto de Charles e o paralelismo nominal indicam o surgimento do sol nos portais orientais e seu ocaso nos ocidentais; isso evita inverter o movimento descrito.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário cosmológico preservado. “Luminares” e “portais” mantêm o tom apocalíptico; “nasce” e “se põe” oferecem naturalidade sem perder o sentido nominal do original.
