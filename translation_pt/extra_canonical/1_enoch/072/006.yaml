base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/006.yaml
  text: Thus it comes out in the first month through the great gate[b][a], which is the fourth of those six gates that are toward the sunrise.
translation:
  language: pt
  text: Assim, no primeiro mês, o sol sai pelo grande portal[a], que é o quarto daqueles seis portais voltados para o nascer do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cláusula final sobre «aqueles seis portais voltados para o nascer do sol» aparece entre colchetes no testemunho fornecido. Pode ser uma ampliação explicativa ou uma expressão textualmente incerta, embora corresponda à descrição recorrente dos seis portais orientais neste capítulo.
    reason: textual_variant
lexical_decisions:
- source_word: ከመዝ
  choice: Assim
  rationale: Preserva o conectivo de modo ou sequência em português natural e digno.
- source_word: ይወፅእ
  choice: ele sai
  rationale: Mantém a imagem concreta do astro saindo por uma abertura, sem substituí-la pela interpretação mais moderna «nasce».
- source_word: በወርኅ ቀዳማዊ
  choice: no primeiro mês
  rationale: Tradução temporal direta e idiomática.
- source_word: በኆኅት ዓቢይ
  choice: pelo grande portal
  rationale: «Portal» comunica uma grande abertura e preserva a imagem cosmológica recorrente; «pelo» expressa a passagem através dela.
- source_word: እንተ ይእቲ ራብዕት
  choice: que é o quarto
  rationale: Identifica o portal dentro da série numerada, ajustando o gênero ao substantivo português «portal».
- source_word: እልኩ ኃዋኅወ ፮
  choice: daqueles seis portais
  rationale: Exprime naturalmente a relação partitiva entre o quarto portal e o conjunto de seis.
- source_word: እለ መንገለ ምሥራቀ ፀሐይ
  choice: voltados para o nascer do sol
  rationale: Traduz ምሥራቀ ፀሐይ como o nascer do sol e comunica a orientação dos portais sem a expressão inadequada «leste do sol».
theological_decisions:
- issue: Imagem astronômica do sol movendo-se através de portais
  choice: Manter a descrição concreta de ele sair por um portal numerado.
  alternative: Parafrasear como o sol nascendo em determinado setor do céu.
  rationale: A imagem dos portais pertence à cosmologia deliberada do Livro Astronômico e não deve ser nivelada à linguagem astronômica moderna.
- issue: Relação entre o quarto portal e os seis portais
  choice: 'Expressar uma relação partitiva: «o quarto daqueles seis portais».'
  alternative: Tratar «aqueles seis portais» como uma explicação solta após travessão.
  rationale: A leitura partitiva oferece a sintaxe mais coerente, embora a condição entre colchetes da cláusula final seja explicitada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O pronome «ele» retoma o sol no contexto imediato; «portal» preserva a dignidade e a imagem cosmológica. Os marcadores seguem a ordem do texto de consulta, [b][a].
