base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/004.yaml
  text: And first a great light comes forth[a], whose name is the sun, and its disk is like the disk of heaven[c][b], and it is wholly full of fire that gives light and heat.
translation:
  language: pt
  text: E primeiro surge uma grande luz[c], cujo nome é Sol; seu disco é como o disco do céu[a], e está inteiramente cheio de fogo que ilumina e aquece[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu círculo” ou “sua órbita”; o termo ge'ez pode designar uma forma redonda ou um circuito. Aqui se escolheu “disco” porque a comparação parece referir-se à forma visível.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “que brilha e queima” ou “que dá luz e calor”.
    reason: lexical_alternative
  - marker: c
    text: 'Outra tradução possível: “E o primeiro surge como uma grande luz”.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ቀዳማዊ
  choice: primeiro
  rationale: O ordinal é vertido adverbialmente, de modo que “uma grande luz” permaneça como sujeito de “surge”, em conformidade com a sintaxe mais provável do trecho.
- source_word: ይወፅእ
  choice: surge
  rationale: Expressa de maneira natural e vívida o aparecimento ou a saída do luminar, sem acrescentar uma origem não indicada no texto.
- source_word: ብርሃን ዓቢይ
  choice: uma grande luz
  rationale: Reproduz diretamente a imagem cósmica do ge'ez; “luminar” seria possível, mas tornaria a formulação mais técnica.
- source_word: ዘስሙ ፀሐይ
  choice: cujo nome é Sol
  rationale: Preserva a fórmula nominal relativa do original e sua tonalidade visionária.
- source_word: ክበቡ
  choice: seu disco
  rationale: No contexto astronômico, “disco” comunica ao leitor moderno a forma redonda visível do Sol, embora o termo também possa significar círculo, órbita ou circuito.
- source_word: ከመ ክበበ ሰማይ
  choice: como o disco do céu
  rationale: Mantém a repetição lexical e a comparação cósmica, mesmo que a imagem permaneça incomum.
- source_word: ኵሉ ምሉእ
  choice: inteiramente cheio
  rationale: Conserva a intensificação de totalidade presente na combinação dos dois termos.
- source_word: እሳት
  choice: fogo
  rationale: Mantém a imagem elementar direta do original, sem a enfraquecer para “calor” ou “brilho”.
- source_word: ዘያበርህ ወያውዒ
  choice: que ilumina e aquece
  rationale: Traduz os dois efeitos do fogo em português natural, preservando o paralelismo verbal e sem intensificá-los para “abrasar” ou “queimar”.
theological_decisions:
- issue: Natureza da descrição do Sol
  choice: Apresentar o Sol como uma grande luz de natureza ígnea, dentro da cosmologia visionária do texto, sem lhe atribuir divindade.
  alternative: Interpretar a fórmula “cujo nome é Sol” como personificação mais forte do astro.
  rationale: A linguagem é imagética e apocalíptico-astronômica, mas o versículo não exige que o Sol seja entendido como divindade; a tradução conserva a imagem sem convertê-la em prosa científica moderna.
- issue: Referente da expressão “inteiramente cheio”
  choice: Deixar o sujeito implícito em português, permitindo que a descrição se vincule naturalmente ao disco ou ao Sol mencionado.
  alternative: Explicitar “o disco está inteiramente cheio” ou “o Sol está inteiramente cheio”.
  rationale: O original permite uma continuidade referencial que não deve ser estreitada desnecessariamente pela tradução.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluida para leitores brasileiros e compreensão ampla no espaço lusófono. Preservaram-se a estranheza da imagem “disco do céu”, a fórmula de nomeação e a ambiguidade referencial da oração final.
