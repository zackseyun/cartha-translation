base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/015.yaml
  text: And the sun rises so that the day grows shorter and the night lengthens[a], and the sun returns to the east and enters into the sixth gate[c][b], and rises from it and sets for thirty mornings.
translation:
  language: pt
  text: E o sol nasce, de modo que o dia se torna mais curto e a noite se prolonga. Então o sol retorna ao leste, entra pelo sexto portão[a], nasce dele e se põe durante trinta manhãs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os “portões” fazem parte da representação do cosmos no Livro Astronômico e são elementos concretos do mundo contemplado na visão, não apenas uma metáfora para as estações.
    reason: cultural_note
  - marker: b
    text: A formulação etíope no final do versículo é difícil. “Durante trinta manhãs” provavelmente designa um período de trinta dias no percurso do sol por este portão.
    reason: textual_variant
lexical_decisions:
- source_word: ይትነሣእ
  choice: nasce
  rationale: No contexto astronômico, o verbo descreve o erguer-se do sol; “nasce” é a expressão portuguesa natural.
- source_word: ትሕጽር ዕለት
  choice: o dia se torna mais curto
  rationale: Expressa com clareza a diminuição sazonal da duração do dia.
- source_word: ትኑኅ ሌሊት
  choice: a noite se prolonga
  rationale: Mantém o paralelismo com o encurtamento do dia e indica aumento de duração.
- source_word: ይገብእ ፀሐይ በጽባሕ
  choice: o sol retorna ao leste
  rationale: ይገብእ indica retorno, e “manhã” funciona espacialmente como o lugar do nascente, isto é, o leste.
- source_word: ይበውእ ውስተ ሳድስት ኆኅት
  choice: entra pelo sexto portão
  rationale: Distingue o verbo de entrada do retorno anterior e preserva a imagem concreta dos portões celestes.
- source_word: ይሠርቅ እምኔሃ
  choice: nasce dele
  rationale: Refere-se ao aparecimento do sol a partir do sexto portão; o pronome retoma “portão”.
- source_word: የዓርብ ሠላሳ ጽባሐ
  choice: durante trinta manhãs, nasce dele e se põe
  rationale: A duração provavelmente abrange o ciclo completo de nascer e pôr-se associado ao portão; a colocação da expressão temporal torna esse sentido natural sem ocultar a dificuldade textual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia astronômica natural. “Portão” preserva a concretude de ኆኅት; “retorna ao leste” reflete a distinção entre o verbo de retorno e o verbo subsequente de entrada. A posição de “durante trinta manhãs” evita a impressão semanticamente estranha de que apenas o pôr do sol seja contado, mantendo a nota sobre a dificuldade textual.
