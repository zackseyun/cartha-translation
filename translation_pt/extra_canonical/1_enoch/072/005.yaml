base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/005.yaml
  text: And the chariots by which it ascends are driven by the wind[a], and the sun goes down from the sky and returns through the north in order to reach the east[e][d][c][b]; and it is led so that it may enter the gate and shine on the face of heaven.
translation:
  language: pt
  text: E as carruagens pelas quais ele sobe são impelidas pelo vento[a]. O sol desce do céu[b] e retorna pelo norte, a fim de chegar ao leste; e é conduzido para entrar pelo portal[c] e brilhar sobre a face do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão em ge'ez é difícil e também pode sugerir “o vento da subida” ou “o vento ascendente”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “céu” também pode ser entendido como a extensão celeste visível.
    reason: lexical_ambiguity
  - marker: c
    text: Literalmente, “o portão” ou “a porta”; trata-se de um dos acessos celestes descritos nesta seção.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰረገላት
  choice: carros
  rationale: O substantivo plural designa veículos ou carros. “Carros” conserva a imagem cósmica sem sugerir necessariamente carruagens modernas.
- source_word: የዓርግ ነፋስ ይነፍኅ
  choice: são impelidos pelo vento
  rationale: A expressão etíope é difícil e envolve o sopro do vento associado à subida. A forma passiva produz uma frase natural em português e mantém a ideia de movimento impulsionado pelo vento, sem ocultar a incerteza, registrada em nota.
- source_word: የዓርብ ፀሐይ
  choice: O sol desce
  rationale: Preserva o movimento concreto de descida indicado pelo verbo, em vez de reduzi-lo simplesmente ao sentido idiomático de “pôr-se”.
- source_word: እምሰማይ
  choice: do céu
  rationale: “Céu” é natural em português tanto para a extensão celeste visível quanto para o domínio celeste, preservando a amplitude semântica do termo.
- source_word: ወይገብእ እንተ መስዕ
  choice: e retorna pelo norte
  rationale: No contexto do percurso solar, “retorna” comunica a retomada do trajeto, enquanto “pelo norte” expressa a região atravessada.
- source_word: ከመ ይሑር ምሥራቀ
  choice: a fim de chegar ao leste
  rationale: Expressa claramente a finalidade e o movimento em direção ao leste.
- source_word: ወይትመራኅ
  choice: é conduzido
  rationale: Mantém a forma passiva e a noção de um percurso ordenado, sem identificar quem ou o que conduz o sol.
- source_word: ኆኅተ
  choice: o portal
  rationale: A forma é singular e designa um portal ou portão. “Portal” preserva melhor a arquitetura celeste característica desta seção do que o termo genérico “abertura”.
- source_word: ያበርህ በገጸ ሰማይ
  choice: brilhar sobre a face do céu
  rationale: Conserva a imagem semítica “face do céu” e traduz a preposição de maneira direta.
theological_decisions:
- issue: Identidade do agente que conduz o sol
  choice: Manter a construção passiva “é conduzido”
  alternative: Explicitar Deus, um anjo ou os ventos como agente
  rationale: O texto não nomeia o agente. Preservar a passiva evita inserir uma explicação cosmológica ou doutrinária ausente da fonte.
- issue: Sentido de ሰማይ no contexto astronômico
  choice: Usar “céu” nas duas ocorrências
  alternative: Alternar entre “céu” e “firmamento” ou empregar “paraíso”
  rationale: Em português, “céu” abrange naturalmente tanto a esfera visível quanto o domínio celeste e mantém a repetição lexical do original sem impor uma distinção teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação divide o longo encadeamento etíope em duas frases, preservando a progressão do movimento. Mantiveram-se as imagens concretas dos carros, do portal e da face do céu.
