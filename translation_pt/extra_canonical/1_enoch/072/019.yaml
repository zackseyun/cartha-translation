base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/019.yaml
  text: And the sun comes out from that fifth gate[a], and sets in the fifth gate in the west, and rises in the fourth gate according to its signs for thirty-one mornings[d][c][b], and sets in the west.
translation:
  language: pt
  text: E o sol sai daquele quinto portal e se põe no quinto portal, no oeste; depois nasce no quarto portal, segundo os seus sinais,[a] por trinta e uma manhãs,[b] e se põe no oeste.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida como “por causa de seus sinais”. O sentido exato da relação entre o percurso do sol e esses sinais não é inteiramente claro.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “trinta e uma manhãs”, e não simplesmente “trinta e um dias”.
    reason: source_clarity
  - marker: c
    text: A cláusula final diz apenas “e se põe no oeste”. Alguns tradutores subentendem “naquele portal”, mas o termo “portal” não é repetido aqui.
    reason: alternative_reading
lexical_decisions:
- source_word: ይወፅእ
  choice: sai
  rationale: O verbo descreve o movimento de sair ou emergir; “sai” é concreto, natural e adequado ao percurso do sol.
- source_word: ኆኅት
  choice: portal
  rationale: “Portal” preserva a imagem cosmológica de aberturas celestes sem reduzi-la a linguagem astronômica moderna.
- source_word: የዓርብ / ያዓርብ
  choice: se põe
  rationale: No contexto do curso diário do sol, o verbo se refere ao ocaso; “se põe” é o equivalente idiomático preciso.
- source_word: ምዕራብ
  choice: o oeste
  rationale: Mantém a referência explícita à direção ou região ocidental.
- source_word: ይሠርቅ
  choice: nasce
  rationale: No contexto solar, “nasce” expressa com naturalidade o aparecimento do sol no horizonte.
- source_word: በራብዕት ኆኅት
  choice: no quarto portal
  rationale: A mesma construção preposicional é usada pouco antes com o quinto portal; a tradução paralela evita criar uma distinção espacial ausente do texto.
- source_word: በእንተ ትእምርታቲሃ
  choice: segundo os seus sinais
  rationale: A expressão pode indicar causa, referência ou conformidade. “Segundo os seus sinais” é natural no contexto do curso regulado do sol e não apresenta os sinais como finalidade.
- source_word: ሠላሳ ወአሐዱ ጽባሕ
  choice: por trinta e uma manhãs
  rationale: O texto diz literalmente “trinta e uma manhãs”; conserva-se essa perspectiva observacional, em vez de generalizá-la para “dias”.
theological_decisions:
- issue: A arquitetura cósmica dos portais celestes
  choice: Conservar a imagem literal de “portal”
  alternative: abertura ou janela
  rationale: O Livro Astronômico apresenta o cosmos em linguagem visionária e estruturada. A imagem não deve ser substituída silenciosamente por terminologia astronômica moderna.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “portal” foi mantida por refletir a formulação esquemática do texto. O ponto e vírgula organiza a longa sequência sem apagar seu caráter cumulativo.
