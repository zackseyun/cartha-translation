base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/003.yaml
  text: And I saw six portals from which the sun rises[a], and six portals where the sun sets, and the moon rises and sets in those portals. And the leaders of the stars, together with those whom they lead, are six in the east and six in the west; and all of them, one after another, in exact order[c][b], with many windows to the right and to the left of those portals.
translation:
  language: pt
  text: E vi seis portais dos quais o sol nasce[a], e seis portais onde o sol se põe; e a lua nasce e se põe nesses portais. Os guias das estrelas, juntamente com os que eles guiam, são seis no leste e seis no oeste; e todos eles se sucedem, um após outro, em ordem exata, com muitas janelas à direita e à esquerda desses portais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez emprega aqui um termo para as seis grandes aberturas cósmicas (“portais”) e, no fim do versículo, uma expressão diferente e difícil, que talvez designe aberturas menores ou janelas ao lado delas.
    reason: lexical_alternative
  - marker: b
    text: A oração final é textualmente difícil. O sentido parece ser que os portais estão dispostos em sequência regular, com muitas aberturas laterais à direita e à esquerda.
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: Mantém explícito o relato visionário em primeira pessoa, com linguagem moderna e digna.
- source_word: ኃዋኅወ
  choice: portais
  rationale: Designa as grandes aberturas cósmicas do horizonte pelas quais os luminares transitam; “portais” preserva melhor a imagem apocalíptica do que “portas” ou “janelas”.
- source_word: እለ ኀበ ይወፅእ ፀሐይ
  choice: dos quais o sol nasce
  rationale: Expressa em português natural o movimento de saída do sol por esses portais.
- source_word: እለ ኀበ የዓርብ ፀሐይ
  choice: onde o sol se põe
  rationale: Respeita a separação sintática entre o pôr do sol e a oração seguinte, cujo sujeito é a lua.
- source_word: ወወርኅ በውእቶን ኃዋኅወ ይሠርቅ ወየዓርብ
  choice: e a lua nasce e se põe nesses portais
  rationale: Conserva a lua como sujeito explícito dos dois verbos, conforme a sintaxe do ge'ez.
- source_word: መራኄሆሙ ለከዋክብት
  choice: os guias das estrelas
  rationale: Traduz a função de condução sem identificar os guias explicitamente como anjos.
- source_word: ምስለ እለ ይመርኅዎሙ
  choice: juntamente com os que eles guiam
  rationale: Preserva a relação entre os guias e os seres ou corpos conduzidos sem especificar além do texto.
- source_word: ፮በጽባሕ ወ፮በምዕራብ
  choice: seis no leste e seis no oeste
  rationale: Emprega os pontos cardeais usuais e mantém a estrutura numérica da cosmologia do trecho.
- source_word: ኵሎሙ ፩፩እምድኅረ ካልኡ
  choice: todos eles ficam um após outro
  rationale: Comunica a sucessão ordenada indicada pelo original em português corrente.
- source_word: ርቱዕ
  choice: em ordem exata
  rationale: No contexto astronômico, transmite a ideia de regularidade, correção e disposição apropriada.
- source_word: መላክወ ብዙኃት
  choice: muitas janelas
  rationale: A expressão é difícil, mas parece indicar aberturas secundárias junto aos portais principais; a nota registra a incerteza.
theological_decisions:
- issue: Identidade dos “guias das estrelas”
  choice: Manter “os guias das estrelas” sem acrescentar que são anjos.
  alternative: “os guias angélicos das estrelas” ou “os anjos que guiam as estrelas”
  rationale: O contexto pode sugerir agentes angélicos, mas o ge'ez deste versículo não exige que essa identificação seja explicitada.
translation_notes:
  register: Português moderno, claro e solene, de leitura natural no Brasil e compreensível internacionalmente. A repetição de “seis” e a organização espacial foram preservadas por serem essenciais ao esquema astronômico. A pontuação separa o pôr do sol da oração em que a lua é o sujeito de “nasce e se põe”.
