base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/017.yaml
  text: And the sun goes out from the west[a], from that sixth gate, and travels eastward, and rises in the fifth gate for thirty mornings[b], and sets again in the west in the fifth western gate.
translation:
  language: pt
  text: E o sol sai do oeste, daquela sexta porta, segue para o leste e nasce na quinta porta por trinta manhãs[a]; depois, volta a se pôr no oeste, na quinta porta ocidental.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “trinta manhãs”. A expressão pode funcionar como uma contagem de trinta dias, mas a formulação do ge’ez foi preservada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ፡ ፀሐይ፡ እምነ፡ ምዕራብ
  choice: E o sol sai do oeste
  rationale: Mantém o sentido de sair ou proceder para fora e traduz እምነ ምዕራብ simplesmente como “do oeste”, sem acrescentar um advérbio equivalente a “dali”, ausente no ge’ez.
- source_word: እምይእቲ፡ ሳድስት፡ ኆኅት
  choice: daquela sexta porta
  rationale: “Porta” preserva a imagem cosmológica técnica e recorrente do Livro Astronômico.
- source_word: ወየሐውር፡ ምሥራቀ
  choice: segue para o leste
  rationale: Expressa de modo natural o movimento em direção ao leste, sem tornar o verbo mais técnico do que no original.
- source_word: ወይሠርቅ፡ በኃምስት፡ ኆኅት
  choice: e nasce na quinta porta
  rationale: No contexto solar, o verbo indica o nascer do sol; “na” conserva o valor locativo da construção.
- source_word: ሠላሳ፡ ጽባሐ
  choice: por trinta manhãs
  rationale: Conserva o substantivo concreto “manhãs” em vez de normalizá-lo silenciosamente como “dias”.
- source_word: ወየዓርብ፡ በምዕራብ፡ ካዕበ
  choice: depois, volta a se pôr no oeste
  rationale: O contexto paralelo ao nascer do sol exige o sentido de pôr-se; “volta a” representa ካዕበ, que assinala repetição.
- source_word: ኃምስተ፡ ኆኅተ፡ እንተ፡ ምዕራብ
  choice: na quinta porta ocidental
  rationale: Mantém explícita a correspondência com o sistema de portas do oeste.
theological_decisions:
- issue: Imagem cosmológica das portas
  choice: Conservar literalmente “porta” e a movimentação do sol entre portas orientais e ocidentais.
  alternative: Interpretar as portas como “aberturas”, “horizontes” ou uma descrição astronômica moderna.
  rationale: O texto apresenta uma cosmologia visionária estruturada. Preservar sua imagem própria evita resolver ou modernizar aquilo que a fonte descreve em linguagem apocalíptica.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário acessível. A ordem dos movimentos e a terminologia cosmológica foram mantidas; a pontuação foi ajustada para tornar legível a longa sequência coordenada.
