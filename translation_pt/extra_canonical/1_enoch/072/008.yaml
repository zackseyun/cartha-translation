base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/008.yaml
  text: And when the sun rises from the sky[a], it goes out through that fourth gate for thirty mornings[c][b], and through the fourth gate in the west of the sky it goes down exactly.
translation:
  language: pt
  text: E, quando o sol nasce no céu, sai por aquela quarta porta durante trinta manhãs[a] e desce precisamente pela quarta porta no oeste do céu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “durante trinta dias”. O ge'ez diz literalmente “trinta manhãs”, unidade de tempo usada nesta sequência astronômica.
    reason: lexical_alternative
  - marker: b
    text: Ou “desce diretamente” ou “desce em linha reta”; o termo indica exatidão ou regularidade do percurso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሠርቅ
  choice: nasce
  rationale: Com o sol como sujeito neste contexto astronômico, o verbo indica o nascer do sol, não apenas seu brilho ou aparecimento.
- source_word: ይወፅእ
  choice: sai
  rationale: Preserva o movimento concreto de saída por uma porta, elemento importante da cosmologia do trecho.
- source_word: ኆኅት
  choice: porta
  rationale: Mantém a imagem recorrente das aberturas celestes como portas na seção astronômica.
- source_word: ራብዕት
  choice: quarta
  rationale: Reproduz literalmente a designação ordinal da porta na sequência.
- source_word: ሠላሳ ጽባሐ
  choice: durante trinta manhãs
  rationale: O ge'ez diz literalmente 'trinta manhãs'; a expressão funciona como unidade de tempo nesta sequência astronômica.
- source_word: ምዕራበ ሰማይ
  choice: no oeste do céu
  rationale: Tradução direta e natural da expressão espacial, preservando a imagem cosmológica.
- source_word: ርቱዐ
  choice: precisamente
  rationale: Expressa exatidão ou regularidade espacial, evitando o sentido temporal de 'imediatamente'.
- source_word: ይወርድ
  choice: desce
  rationale: Conserva o movimento cosmológico explícito do verbo, em vez de substituí-lo pelo idiomático 'se põe'.
theological_decisions:
- issue: Imagem cosmológica das portas celestes
  choice: Manter literalmente as portas e a linguagem de movimento.
  alternative: Interpretar como simples linguagem fenomenológica sobre o nascer e o pôr do sol.
  rationale: A seção astronômica apresenta uma cosmologia visionária estruturada; a tradução não deve reduzir essa imagem a uma descrição meteorológica comum.
- issue: Nuance de ርቱዐ
  choice: Traduzir por 'precisamente', preservando a ideia de exatidão espacial ou regularidade.
  alternative: Traduzir por 'diretamente' ou 'em linha reta'.
  rationale: O termo admite mais de uma formulação em português; 'precisamente' mantém a exatidão sem introduzir uma leitura temporal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe conserva a sequência do ge'ez sem reproduzir mecanicamente estruturas pouco naturais em português.
