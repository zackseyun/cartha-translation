base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/014.yaml
  text: On that day the day becomes longer than the night[a], and the day becomes twice the night, and the day becomes twelve parts[b], and the night grows shorter and becomes six parts.
translation:
  language: pt
  text: Naquele dia, o dia se torna mais longo que a noite e passa a ter o dobro da duração da noite; o dia fica com doze partes, e a noite se torna mais curta e fica com seis partes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O versículo emprega o sistema esquemático deste capítulo, que divide o dia e a noite em “partes”. A transcrição disponível traz uma forma que pode parecer incluir o numeral nove, mas a leitura corrigida “dobro” concorda com as doze partes do dia e as seis da noite.
    reason: textual_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: Naquele dia
  rationale: Fórmula temporal natural em português, preservando a sequência da descrição astronômica.
- source_word: ትነውኅ ዕለት እምሌሊት
  choice: o dia se torna mais longo que a noite
  rationale: Expressa o processo de alongamento e toma a preposição em sentido comparativo, conforme o contexto.
- source_word: ዕፅበተ ሌሊት (leitura corrigida do texto transcrito ፱ዕበተ ሌሊት)
  choice: passa a ter o dobro da duração da noite
  rationale: A leitura ዕፅበተ, 'dobro', explica a proporção de doze partes para seis; a formulação portuguesa evita a expressão pouco natural 'torna-se duas vezes a noite'.
- source_word: ክፍለ ፲ወ፪
  choice: doze partes
  rationale: Mantém a terminologia esquemática pela qual o capítulo divide o dia e a noite em partes.
- source_word: ትኃጽር
  choice: se torna mais curta
  rationale: Preserva o contraste processual com o dia que se torna mais longo.
- source_word: ስድስተ ክፍል
  choice: seis partes
  rationale: Tradução direta da divisão técnica do período noturno.
theological_decisions:
- issue: Se a linguagem proporcional deveria ser convertida em prosa astronômica moderna
  choice: Preservar o sistema repetitivo de partes e a relação de dobro
  alternative: Resumir como 'o dia dura doze unidades e a noite, seis'
  rationale: A formulação esquemática pertence ao registro cosmológico do Livro Astronômico e não deve ser nivelada nem reinterpretada segundo modelos modernos.
- issue: Leitura da forma transcrita ፱ዕበተ
  choice: Adotar a emenda paleográfica ዕፅበተ, 'dobro'
  alternative: Traduzir literalmente a transcrição como 'nove partes da noite'
  rationale: A confusão visual entre ፅ e o numeral ፱ é plausível, e a proporção explicitada logo depois — doze partes de dia e seis de noite — confirma a leitura 'dobro'.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição foi moderadamente suavizada para naturalidade, sem apagar a estrutura proporcional do ge'ez; a nota registra a questão textual relevante.
