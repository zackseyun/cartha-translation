base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/012.yaml
  text: And at that time the day grows longer by two parts[a], and the day becomes eleven parts[b], and the night grows shorter and becomes seven parts.
translation:
  language: pt
  text: E então o dia se alonga em duas partes[a] e passa a ter onze partes, enquanto a noite se encurta e passa a ter sete partes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra etíope traduzida por “duas” está assinalada como leitura incerta neste testemunho.
    reason: textual_variant
lexical_decisions:
- source_word: ወእሜሃ
  choice: E então
  rationale: Preserva a fórmula de transição temporal e o andamento sequencial da descrição astronômica.
- source_word: ይነኍኅ ዕለት
  choice: o dia se alonga
  rationale: O verbo indica aumento de extensão ou duração; no contexto, a duração do período diurno cresce até totalizar onze partes.
- source_word: †ክልኤ† እደ
  choice: em duas partes
  rationale: Explicita a unidade subentendida pelo sistema de medição do capítulo. A leitura do numeral está assinalada como incerta no testemunho.
- source_word: ወትከውን ዕለት ዓሠርተ ወአሐደ ክፍለ
  choice: e passa a ter onze partes
  rationale: Expressa em português natural o total alcançado pelo dia, sem perder a fórmula resultativa do ge'ez.
- source_word: ወተሐጽር ሌሊት
  choice: enquanto a noite se encurta
  rationale: Mantém o contraste simultâneo entre o alongamento do dia e o encurtamento da noite.
- source_word: ወትከውን ሰብዓተ ክፍለ
  choice: e passa a ter sete partes
  rationale: Conserva a terminologia técnica de medição e apresenta com clareza o total correspondente à noite.
