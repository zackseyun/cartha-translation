base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/023.yaml
  text: And the sun comes out from that third gate[a], and sets in the third gate in the west, and returns to the east, and comes out from the second gate in the east for thirty mornings; and in this way it sets in the second gate in the west of heaven.
translation:
  language: pt
  text: E o sol sai daquela terceira porta e se põe na terceira porta, no oeste; e retorna para o leste e sai da segunda porta, no leste, durante trinta manhãs[a]. E assim se põe na segunda porta, no oeste do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “trinta manhãs”. A expressão provavelmente indica um intervalo de trinta dias no percurso do sol, mas o texto principal conserva a formulação da fonte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወፅእ
  choice: sai
  rationale: Expressa de modo natural o movimento de sair ou surgir por uma porta, preservando o verbo repetido no texto ge’ez.
- source_word: ፀሐይ
  choice: o sol
  rationale: É o referente astronômico direto do texto, sem personificação adicional.
- source_word: ሣልስት ኆኅት
  choice: terceira porta
  rationale: Mantém a imagem cosmológica concreta e a sequência numerada das portas celestes.
- source_word: ያዓርብ
  choice: se põe
  rationale: No percurso diário do sol, é a forma portuguesa mais natural e precisa para o movimento associado ao oeste e ao entardecer.
- source_word: በዐረብ
  choice: no oeste
  rationale: A expressão tem função espacial neste contexto e corresponde à orientação leste-oeste do percurso solar.
- source_word: ይገብእ
  choice: retorna
  rationale: Embora o verbo possa significar entrar, a sequência descreve o movimento cíclico do sol de volta ao leste.
- source_word: ውስተ ምሥራቅ
  choice: ao leste
  rationale: Forma direcional idiomática em português que preserva a orientação cosmológica.
- source_word: ካልእ ኆኅት
  choice: segunda porta
  rationale: O contexto exige a segunda porta da série ordenada, e não apenas outra porta indeterminada.
- source_word: ሠላሳ ጸባሐ
  choice: durante trinta manhãs
  rationale: Preserva a expressão literal do ge’ez e seu modo de contar o intervalo do percurso solar, sem substituí-la silenciosamente por trinta dias.
- source_word: በምዕራበ ሰማይ
  choice: no oeste do céu
  rationale: Mantém tanto a localização ocidental quanto o cenário celeste da cosmologia do texto.
theological_decisions:
- issue: Imagem cosmológica das portas solares
  choice: Manter as portas concretas e o movimento direcional descrito
  alternative: Interpretar dinamicamente as portas como pontos de nascer e pôr do sol no horizonte
  rationale: O Livro Astronômico apresenta uma cosmologia celeste estruturada. A tradução preserva essa imagem apocalíptica, sem adaptá-la à linguagem astronômica moderna.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe foi levemente segmentada para clareza, sem eliminar a repetição técnica das portas nem a imagem cosmológica do original.
