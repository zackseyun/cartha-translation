translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima do ge'ez. A forma “se torna” preserva o caráter progressivo da descrição astronômica; a vírgula em “o dia, sete partes” sinaliza a elipse do verbo sem tornar a frase artificial.
