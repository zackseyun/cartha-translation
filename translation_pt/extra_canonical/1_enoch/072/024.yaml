base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/024.yaml
  text: And on that day the night becomes eleven parts[b][a], and the day seven parts.
translation:
  language: pt
  text: E naquele dia, a noite passa a ter onze partes[a], e o dia, sete partes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O versículo mede a noite e o dia em “partes” numeradas, um recurso técnico do calendário esquemático do Livro Astronômico, e não em horas comuns.
    reason: cultural_note
lexical_decisions:
- source_word: ወበይእቲ፡ ዕለት
  choice: E naquele dia
  rationale: Preserva a fórmula temporal e a força demonstrativa do ge'ez em português natural.
- source_word: ትከውን
  choice: se torna
  rationale: Expressa o sentido imperfeito de mudança progressiva no ciclo astronômico e mantém a coerência com as fórmulas do contexto.
- source_word: ሌሊት
  choice: a noite
  rationale: O artigo definido apresenta a noite como um dos dois períodos medidos no esquema calendárico.
- source_word: ዓሠርተ፡ ወአሐደ፡ ክፍለ፡
  choice: onze partes
  rationale: Reproduz a soma literal de dez e um e conserva o termo técnico da divisão esquemática.
- source_word: ወዕለት፡ ሰብዓተ፡ ክፍለ
  choice: e o dia, sete partes
  rationale: Mantém o paralelismo conciso do original; a elipse verbal é clara e natural em português.
