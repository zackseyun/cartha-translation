base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/002.yaml
  text: And from there I went toward the east to the ends of heaven[a], and I saw three open portals of heaven toward the east[b], and above them small portals.
translation:
  language: pt
  text: E dali fui em direção ao sul, até os confins da terra. Ali vi três portais do céu abertos, e deles saem o vento do sul[a], o orvalho, a chuva e o vento. Dali fui em direção ao nascente[b], até os confins do céu. Ali vi três portais do céu abertos na direção do nascente e, acima deles, portais menores. Por cada um desses portais menores passam as estrelas do céu e seguem para o oeste pelo caminho que lhes foi mostrado. Quando vi isso, bendisse o Senhor da glória; e, em todo tempo, bendigo o Senhor da glória, que fez maravilhas grandes e gloriosas para mostrar a grandeza de sua obra aos seus anjos e às almas dos seres humanos, a fim de que louvem sua obra e tudo o que ele fez, vejam a ação de seu poder, louvem a grande obra de suas mãos e o bendigam para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo etíope também pode ser entendido simplesmente como «sul»; neste contexto, parece indicar o vento que vem do sul.
    reason: lexical_ambiguity
  - marker: b
    text: Literalmente, «em direção à manhã» ou «ao nascer do dia», isto é, ao leste.
    reason: source_idiom
lexical_decisions:
- source_word: አዜብ
  choice: sul / vento sul
  rationale: O termo designa o sul e também pode denotar o vento proveniente dessa direção. A primeira ocorrência indica o rumo da viagem; na lista do que sai dos portais, “vento sul” explicita naturalmente o sentido meteorológico sem apagar a relação lexical.
- source_word: አጽናፈ፡ ምድር
  choice: confins da terra
  rationale: A expressão refere-se às extremidades ou limites da terra. “Confins da terra” preserva a imagem cosmológica e mantém um registro digno e compreensível.
- source_word: ጽባሕ
  choice: nascente
  rationale: Literalmente ligado à manhã ou ao nascer do dia, o termo funciona aqui como indicação do leste. “Nascente” conserva essa imagem, ao passo que “leste” seria mais puramente direcional.
- source_word: ኀዋኅወ፡ ሰማይ
  choice: portais do céu
  rationale: “Portais” comunica aberturas arquitetônicas de passagem na visão cosmológica e distingue melhor essas estruturas de simples portas domésticas.
- source_word: እግዚአ፡ ስብሐት
  choice: Senhor da glória
  rationale: A construção genitiva é vertida diretamente e preserva o título reverencial sem acrescentar identificação teológica não expressa.
- source_word: ነፍሳተ፡ ሰብእ
  choice: almas dos seres humanos
  rationale: A tradução mantém o substantivo “almas” e verte o coletivo humano de modo inclusivo e corrente, sem decidir além do texto questões antropológicas.
- source_word: ግበረ፡ ኀይሉ
  choice: ação de seu poder
  rationale: A formulação preserva a relação entre obra/ação e poder, evitando reduzir a expressão apenas a “poder” ou interpretá-la como um milagre específico.
theological_decisions:
- issue: Objeto e alcance do louvor
  choice: Manter anjos e almas humanas como destinatários da revelação da grandeza da obra divina e como agentes do louvor.
  alternative: Reformular de modo que apenas os seres humanos louvem ou que os anjos sejam parte da obra contemplada.
  rationale: A sintaxe apresenta os anjos e as almas dos seres humanos em paralelo depois de “mostrar”, e as orações finais subsequentes podem abranger ambos. A tradução preserva esse alcance sem o restringir.
- issue: Antropologia de “almas dos seres humanos”
  choice: Traduzir literalmente como “almas dos seres humanos”.
  alternative: “seres humanos” ou “espíritos humanos”.
  rationale: A escolha conserva a terminologia do texto e não resolve se “alma” denota a pessoa inteira, uma parte constitutiva ou o estado pós-morte.
translation_notes:
  register: Português moderno, claro e solene, com cadência adequada a uma visão apocalíptica. Empregaram-se “portais”, “confins”, “nascente” e “bendizer” para preservar a imagética e o tom elevado sem recorrer a sintaxe arcaica. A tradução segue todo o texto ge’ez fornecido, que é substancialmente mais extenso que a camada inglesa de consulta.
