base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/001.yaml
  text: And from there I went toward the south[a], to the ends of the earth; and there I saw three open portals of heaven, and from there come out the south wind, and dew, and rain[c][b], and wind.
translation:
  language: pt
  text: E dali fui em direção ao sul, até os confins da terra; ali vi três portais abertos do céu, e deles saem o vento do sul, o orvalho, a chuva e o vento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão “três portais abertos do céu” reflete a geografia cósmica da visão: o céu é retratado como tendo aberturas pelas quais saem fenômenos meteorológicos.'
    reason: cultural_note
lexical_decisions:
- source_word: እምህየ
  choice: dali
  rationale: Expressa de modo natural e conciso a transição narrativa e o movimento a partir do lugar anterior.
- source_word: ሖርኩ
  choice: fui
  rationale: Mantém o verbo simples de movimento na primeira pessoa, sem acrescentar a ideia de viagem prolongada.
- source_word: መንገለ አዜብ
  choice: em direção ao sul
  rationale: Preserva a orientação geográfica indicada pela expressão.
- source_word: በአጽናፈ ምድር
  choice: até os confins da terra
  rationale: Conserva a linguagem geográfica e cosmológica da visão em português corrente e digno.
- source_word: ሠለስተ ኆዋኅወ ሰማይ ርኁዋተ
  choice: três portais abertos do céu
  rationale: Mantém a imagem arquitetônica de aberturas celestes e traduz explicitamente o qualificativo 'abertos'.
- source_word: ወይወፅእ እምህየ
  choice: e deles saem
  rationale: O presente descritivo combina com fenômenos recorrentes; 'deles' retoma naturalmente os portais.
- source_word: አዜብ
  choice: o vento sul
  rationale: Nesta enumeração meteorológica, o termo designa adequadamente o vento proveniente do sul.
- source_word: ጠል
  choice: o orvalho
  rationale: É o sentido lexical específico mais provável e preserva o orvalho como elemento meteorológico distinto na cosmologia do texto.
- source_word: ዝናም
  choice: a chuva
  rationale: Equivalente direto e comum para o fenômeno meteorológico.
- source_word: ነፋስ
  choice: o vento
  rationale: O contexto meteorológico exige o sentido físico, não 'espírito'.
theological_decisions:
- issue: Imagem da arquitetura cósmica
  choice: portais abertos do céu
  alternative: janelas abertas do céu; aberturas do céu
  rationale: Preserva a representação visionária do céu como dotado de saídas estruturadas para os fenômenos meteorológicos, sem a reduzir a uma descrição moderna nem importar uma formulação confessional.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira; tom narrativo digno. A repetição de “vento” foi mantida porque o texto distingue “vento sul” de “vento” no fim da enumeração.
