base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/006.yaml
  text: In those days you will give your names to an everlasting curse for all the righteous[a], and the sinners will curse you[d][c][b]; and for you there will be a joining together with sinners.
translation:
  language: pt
  text: Naqueles dias, seus nomes serão entregues a uma maldição eterna para todos os justos[a], e os pecadores amaldiçoarão vocês; e vocês terão associação com os pecadores[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase provavelmente quer dizer que os nomes deles se tornarão uma fórmula ou exemplo usado ao proferir maldições, como sinal público de desonra e juízo. A relação também pode ser traduzida como “entre todos os justos”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “vocês serão contados entre os pecadores” ou “vocês serão reunidos com os pecadores”.
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ፡ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e o plural do texto etíope em linguagem natural e solene.
- source_word: ትሁቡ፡ ስመ፡ ዚአክሙ
  choice: vocês entregarão seus nomes
  rationale: Mantém a referência explícita aos nomes e segue a leitura verbal dirigida à segunda pessoa do plural, sem substituir 'nomes' por 'reputação'.
- source_word: በርገመት፡ ዘለዓለም
  choice: a uma maldição eterna
  rationale: Expressa o destino ou uso a que os nomes serão entregues e conserva o peso judicial da expressão.
- source_word: ለኵሉ፡ ጻድቃን
  choice: diante de todos os justos
  rationale: A preposição etíope permite mais de uma relação contextual. 'Diante de' comunica a esfera pública da desonra sem fazer dos justos, de modo inequívoco, autores ou beneficiários da maldição.
- source_word: ወኪያክሙ፡ ይረግሙ፡ ኃጥኣን
  choice: e os pecadores amaldiçoarão vocês
  rationale: Trata ኪያክሙ como pronome acusativo independente, objeto direto do verbo, conforme a gramática da forma etíope transmitida.
- source_word: ተኅቡረ፡ ምስለ፡ ኃጥኣን
  choice: vocês serão reunidos com os pecadores
  rationale: Torna natural em português a expressão nominal de associação, preservando a ideia de agrupamento e sem especificar além do texto se se trata de companhia, classificação ou destino comum.
theological_decisions:
- issue: Função dos nomes na maldição
  choice: Os nomes dos condenados se tornarão ligados a uma fórmula ou exemplo permanente de maldição.
  alternative: Os justos pronunciarão diretamente uma maldição eterna sobre eles.
  rationale: A menção expressa dos 'nomes' favorece a imagem de vergonha pública e proverbial, mas a tradução principal evita explicar em excesso a mecânica da maldição.
- issue: Relação final com os pecadores
  choice: O grupo interpelado será reunido ou associado aos pecadores.
  alternative: Eles serão contados entre os pecadores ou terão convivência com eles.
  rationale: O contexto sugere destino compartilhado no juízo, porém a formulação conserva a amplitude semântica da associação indicada pelo etíope.
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para legibilidade brasileira e compreensão internacional. A tradução mantém a repetição de 'pecadores' e a imagem concreta dos 'nomes', evitando terminologia confessional e esclarecendo em notas as ambiguidades reais.
