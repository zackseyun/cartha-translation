  text: And they shall not again sin[c][b][a], and they shall not be condemned all the days of their life.
translation:
  language: pt
  text: E não voltarão a pecar[a][c], e não serão condenados durante todos os dias de sua vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não pecarão mais». A formulação em ge''ez inclui a ideia de repetição ou continuidade: «de novo».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «durante todos os dias de suas vidas». O texto-fonte emprega «vida» no singular numa expressão idiomática com referente plural.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «E não voltarão a cometer pecado».'
    reason: previous_rendering
lexical_decisions:
- source_word: ኢይደግሙ
  choice: não voltarão a
  rationale: A forma negativa plural contém a ideia de repetição ou continuidade. «Não voltarão a» preserva esse valor iterativo em português natural.
- source_word: አብሶ
  choice: pecar
  rationale: O termo expressa pecado ou transgressão. O verbo «pecar» comunica diretamente a força verbal e mantém a repetição da mesma expressão presente no contexto imediato.
- source_word: ኢይትኴነኑ
  choice: não serão condenados
  rationale: A formulação passiva conserva o sentido judicial do original, sem reduzi-lo à ideia mais ampla de punição.
- source_word: ኵሎ መዋዕለ ሕይወቶሙ
  choice: durante todos os dias de sua vida
  rationale: Preserva a expressão temporal semítica e o singular «vida» com referente plural, construção compreensível em português como referência distributiva à vida de cada um.
theological_decisions:
- issue: Se a frase promete transformação moral ou apenas o fim de atos sujeitos a punição
  choice: A primeira oração é apresentada como promessa de que não voltarão a pecar; a segunda, como ausência de condenação.
  alternative: A primeira oração poderia ser traduzida por «não voltarão a fazer o mal», e a segunda por «não serão punidos».
  rationale: As duas orações distinguem a conduta do veredito judicial. Manter «pecar» e «ser condenados» preserva a tensão ética e judicial sem fazer de uma oração mera explicação da outra.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Voltarão a pecar» conserva a força iterativa do ge'ez sem soar excessivamente literal; «serão condenados» mantém o registro judicial.
