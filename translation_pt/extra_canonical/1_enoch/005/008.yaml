base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/008.yaml
  text: And then wisdom will be given to the chosen[a], and all these will live and will not again sin, whether through ungodliness or through pride[b]; but those who possess wisdom will be humble.
translation:
  language: pt
  text: E então será dada sabedoria aos escolhidos[a], e todos eles viverão e não voltarão a pecar, seja por impiedade, seja por orgulho; mas os que possuem sabedoria serão humildes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos eleitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'A cláusula final também pode ser entendida assim: “mas eles serão humildes, porque possuem sabedoria”.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: እሜሃ
  choice: então
  rationale: Marca a sequência temporal no contexto apocalíptico precedente, de modo conciso e natural.
- source_word: ይትወሀቦሙ
  choice: será dada
  rationale: Preserva a forma passiva e apresenta a sabedoria como dádiva recebida, não como conquista própria.
- source_word: ለሕሩያን
  choice: aos escolhidos
  rationale: Expressa a designação do grupo sem depender da carga teológica posterior que 'eleitos' pode assumir.
- source_word: ጥበብ
  choice: sabedoria
  rationale: É o equivalente natural no contexto moral e apocalíptico.
- source_word: ኵሎሙ እሉንቱ
  choice: todos eles
  rationale: Retoma claramente os escolhidos mencionados imediatamente antes, evitando a rigidez de 'todos estes' em português.
- source_word: የሐይዉ
  choice: viverão
  rationale: Mantém a afirmação simples do texto sem explicitar se se trata de sobrevivência, longevidade ou vida na ordem renovada.
- source_word: ወኢይደግሙ አብሶ
  choice: e não voltarão a pecar
  rationale: Reproduz de maneira idiomática a negação acompanhada da ideia de repetição.
- source_word: እበረሲዕ
  choice: por impiedade
  rationale: Conserva a dimensão religiosa e moral do termo, mais precisamente que o genérico 'maldade'.
- source_word: እበኅዕቢት
  choice: por orgulho
  rationale: Transmite a disposição arrogante e mantém o contraste com a humildade.
- source_word: አላ
  choice: mas
  rationale: Marca diretamente o contraste entre o pecado e a condição humilde dos sábios.
- source_word: ይገንዩ
  choice: serão humildes
  rationale: É uma expressão moderna e clara para a condição de humildade ou baixeza voluntária indicada pelo verbo.
- source_word: ዘቦሙ ጥበበ
  choice: os que possuem sabedoria
  rationale: Entende a construção relativa como identificação dos humildes por sua posse de sabedoria, sem apagar a possível relação causal preservada em nota.
theological_decisions:
- issue: Tradução de ሕሩያን
  choice: os escolhidos
  alternative: os eleitos
  rationale: Mantém a categoria apocalíptica local em linguagem acessível, sem importar indevidamente conotações de sistemas teológicos posteriores.
- issue: Transformação moral após a dádiva da sabedoria
  choice: uma condição futura em que os escolhidos não voltarão a pecar, com impiedade e orgulho mencionados em particular
  alternative: uma descrição hiperbólica de justiça geral, ou apenas a cessação dos pecados específicos de impiedade e orgulho
  rationale: A formulação preserva tanto a declaração ampla sobre não voltar a pecar quanto os vícios nomeados, sem restringir nem sistematizar além do texto.
- issue: Relação entre sabedoria e humildade na cláusula final
  choice: os possuidores de sabedoria serão humildes
  alternative: eles serão humildes porque possuem sabedoria
  rationale: A sintaxe admite mais de uma articulação entre a oração relativa e a humildade; o texto principal segue a leitura identificadora e a nota conserva a possível leitura causal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação 'seja por impiedade, seja por orgulho' torna natural a enumeração sem reduzir o alcance da afirmação anterior. Todos os marcadores de nota aparecem no texto.
