base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/007.yaml
  text: And for the chosen there shall be light and joy and peace[a], and they shall inherit the earth. But for you, the wicked[b], there shall be a curse.
translation:
  language: pt
  text: E para os escolhidos haverá luz, alegria e paz, e eles herdarão a terra[a]. Mas para vocês, os perversos, haverá maldição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo ge'ez traduzido por «terra» também pode designar uma terra ou território. Contudo, o contexto apocalíptico mais amplo favorece o sentido de «terra» em alcance universal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕሩያን
  choice: os escolhidos
  rationale: O plural designa os que foram escolhidos. «Os escolhidos» conserva a designação coletiva do contexto apocalíptico sem acrescentar conotações doutrinárias posteriores.
- source_word: ብርሃን
  choice: luz
  rationale: É o sentido básico do termo e preserva diretamente a imagem na sequência de bênçãos.
- source_word: ፍሥሐ
  choice: alegria
  rationale: Tradução clara e natural para o estado de júbilo expresso pelo substantivo.
- source_word: ሰላም
  choice: paz
  rationale: Expressa de modo transparente a ideia de paz e bem-estar e se ajusta à tríade «luz, alegria e paz».
- source_word: ይወርስዋ ለምድር
  choice: herdarão a terra
  rationale: O verbo exprime herança ou posse, e ምድር pode significar «terra» tanto em sentido amplo quanto territorial. O contexto apocalíptico favorece aqui o alcance mais amplo.
- source_word: ረሲዓን
  choice: os perversos
  rationale: Conserva a designação moral e judicial do grupo oposto aos escolhidos em português atual e digno.
- source_word: ርገመት
  choice: maldição
  rationale: É a equivalência direta e idiomática para o substantivo que denota maldição ou imprecação.
theological_decisions:
- issue: Alcance de ምድር
  choice: terra
  alternative: país; território
  rationale: Embora o substantivo também possa indicar uma terra ou território, o cenário apocalíptico e universal favorece «terra», sem eliminar a ambiguidade lexical, registrada em nota.
- issue: Designação ሕሩያን
  choice: os escolhidos
  alternative: os eleitos
  rationale: «Os escolhidos» mantém a designação própria da passagem de maneira transparente, evitando carregar o termo com associações confessionais posteriores.
- issue: Estrutura contrastiva das conjunções
  choice: «E» na primeira oração; «Mas» na segunda
  alternative: «Mas» nas duas orações
  rationale: O texto começa com a conjunção simples ወ e reserva a força adversativa de -ሰ para a referência aos perversos; a tradução preserva essa progressão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece digno e conciso; «vocês» reproduz explicitamente a segunda pessoa do plural sem recorrer ao lusitanismo «vós».
