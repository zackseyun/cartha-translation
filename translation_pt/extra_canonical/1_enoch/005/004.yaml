base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/004.yaml
  text: But you have not endured[a], and you have not done the command of the Lord; rather, you have transgressed and spoken proud and harsh words with your unclean mouths against his greatness. Because of the hardness of your heart[d][c][b], you will have no peace.
translation:
  language: pt
  text: Mas vocês não perseveraram[a] nem cumpriram o mandamento do Senhor; pelo contrário, desviaram-se e proferiram, com suas bocas impuras, palavras arrogantes e duras contra a grandeza dele. Duros de coração, vocês não terão paz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não suportaram” ou “não foram pacientes”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “paz” pode abranger não apenas tranquilidade interior, mas também bem-estar e um desfecho favorável.
    reason: cultural_note
lexical_decisions:
- source_word: አተዓገሥክሙ
  choice: não perseveraram
  rationale: Expressa a falta de constância ou firmeza sugerida pelo verbo, de modo natural em português.
- source_word: ትእዛዘ እግዚእ
  choice: a ordem do Senhor
  rationale: Mantém o singular do ge'ez e verte o título divino no registro bíblico corrente.
- source_word: ተዓደውክሙ
  choice: desviaram-se
  rationale: Preserva a ideia de afastamento moral ou transgressão sem especificar além do texto.
- source_word: ሐመይክሙ
  choice: difamaram
  rationale: Recupera a força hostil do verbo, que pode indicar falar mal, caluniar ou difamar, em vez de reduzi-lo ao simples ato de falar.
- source_word: ዓበይተ ወድሩካተ ቃላተ
  choice: com palavras arrogantes e duras
  rationale: Reproduz as duas qualificações da fala em português claro e digno.
- source_word: ርኵሳት
  choice: impuras
  rationale: Conserva a ressonância moral e ritual da impureza.
- source_word: ዕበዩ ዚአሁ
  choice: a grandeza dele
  rationale: É a correspondência mais direta, preservando a possibilidade contextual de entender também 'majestade'.
- source_word: ይቡሳነ ልብ
  choice: Duros de coração
  rationale: Mantém a imagem bíblica de obstinação e insensibilidade moral, sem transformar a expressão em uma relação causal não explicitada.
- source_word: ኢትከውኑክሙ ሰላም
  choice: vocês não terão paz
  rationale: Preserva a fórmula profética de juízo e a amplitude semântica de paz como bem-estar e destino favorável.
theological_decisions:
- issue: Alcance de 'paz' na sentença final
  choice: vocês não terão paz
  alternative: não haverá bem-estar para vocês
  rationale: A forma escolhida conserva tanto o sentido comum quanto a dimensão judicial e abrangente da fórmula apocalíptica.
- issue: Relação sintática de 'duros de coração' com a negação da paz
  choice: Duros de coração, vocês não terão paz
  alternative: Por causa da dureza do coração de vocês, vocês não terão paz
  rationale: O ge'ez apresenta uma interpelação nominal, não um conector causal explícito; a tradução mantém essa tensão sintática.
- issue: Objeto da fala hostil
  choice: difamaram ... a grandeza dele
  alternative: proferiram palavras arrogantes e duras contra a grandeza dele
  rationale: A escolha procura preservar a força lexical de ሐመይክሙ e a ligação com a grandeza divina, sem introduzir uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega segunda pessoa plural com “vocês”, mantém cadência profética e linguagem digna, e evita arcaísmos desnecessários.
