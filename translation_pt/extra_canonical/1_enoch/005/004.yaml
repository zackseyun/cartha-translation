  source_fidelity: 'A sequência e o sentido geral do ge''ez estão bem preservados: falta de perseverança, desobediência ao mandamento do Senhor, desvio, fala arrogante e dura contra a grandeza divina, e a sentença final de ausência de paz. Contudo, «difamaram ... a grandeza dele» altera a construção do objeto e é menos seguro que conservar as «palavras» como objeto de «proferiram» e «contra a grandeza dele» como seu alvo.'
  naturalness: «Difamaram com palavras arrogantes e duras, pronunciadas por suas bocas impuras, a grandeza dele» é sintaticamente pesado e pouco idiomático em português, pois «difamar a grandeza» não é uma combinação natural. A reorganização proposta é fluente, mantém o tom solene e evita a redundância de «com palavras» / «pronunciadas».
  terminology: «Mandamento do Senhor», «bocas impuras», «grandeza dele», «duros de coração» e «paz» preservam adequadamente o registro bíblico e as imagens do texto. «Mandamento» é mais preciso e natural que «ordem» para o singular de ትእዛዘ neste contexto.
