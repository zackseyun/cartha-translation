revisions:
- from: Mas vocês não perseveraram[a] nem cumpriram a ordem do Senhor; pelo contrário, desviaram-se e difamaram com palavras arrogantes e duras, pronunciadas por suas bocas impuras, a grandeza dele. Duros de coração, vocês não terão paz.[b]
  to: Mas vocês não perseveraram[a] nem cumpriram o mandamento do Senhor; pelo contrário, desviaram-se e proferiram, com suas bocas impuras, palavras arrogantes e duras contra a grandeza dele. Duros de coração, vocês não terão paz.[b]
  rationale: A revisão conserva a ambiguidade lexical do verbo de fala hostil sem impor «difamar» como leitura única. Ela torna explícito, por meio de uma construção portuguesa natural, que as palavras arrogantes e duras são proferidas contra a grandeza de Deus. Também substitui «ordem» por «mandamento», opção mais idiomática e mais adequada ao registro do preceito divino, mantendo o singular do ge'ez. As âncoras das notas e o sentido do versículo foram preservados.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:59:26Z'
