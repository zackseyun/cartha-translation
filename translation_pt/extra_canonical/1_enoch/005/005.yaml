base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/005.yaml
  text: And because of this[a], you will curse your days, and you will shorten the years of your life; and the years of your destruction will increase in an eternal curse[b], and there will be no mercy for you.
translation:
  language: pt
  text: E, por causa disso, vocês amaldiçoarão os seus dias e encurtarão os anos da sua vida[b]; os anos da sua perdição se multiplicarão sob uma maldição eterna[a], e não haverá misericórdia para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração “os anos da sua perdição se multiplicarão” é textualmente difícil. O substantivo também pode ser entendido como “ruína” ou “perecimento”.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: “e os anos da sua vida perecerão”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወበእንተዝ
  choice: E, por causa disso
  rationale: Mantém a relação causal explícita com a acusação anterior, sem reduzi-la a uma conclusão meramente inferida.
- source_word: መዋዕሊክሙ
  choice: os seus dias
  rationale: Reproduz a expressão idiomática e solene do texto, em vez de nivelá-la para “a vida de vocês”.
- source_word: ትረግሙ
  choice: vocês amaldiçoarão
  rationale: 'Preserva a segunda pessoa do plural ativa: os destinatários amaldiçoarão os próprios dias em seu lamento.'
- source_word: ዓመታት ሕይወትክሙ ትኃጕሉ
  choice: encurtarão os anos da sua vida
  rationale: Trata o verbo como segunda pessoa plural ativa, conforme a morfologia etíope e o apoio do grego ἀπολεῖτε. “Encurtarão” expressa de modo natural a perda ou destruição dos anos de vida sem fazer de “anos” o sujeito.
- source_word: ዓመታት ኀጕልክሙ
  choice: os anos da sua perdição
  rationale: “Perdição” conserva o campo semântico de ruína, destruição ou perecimento e mantém a formulação difícil do texto.
- source_word: ይበዝኅ
  choice: se multiplicarão
  rationale: Expressa o sentido de tornar-se numeroso ou aumentar e preserva a imagem paradoxal de uma ruína prolongada.
- source_word: በርገመት ዘለዓለም
  choice: sob uma maldição eterna
  rationale: “Sob” é idiomático em português para a condição imposta pela maldição, enquanto “eterna” mantém a força apocalíptica de duração.
- source_word: ወኢይከውነክሙ ሣህል
  choice: e não haverá misericórdia para vocês
  rationale: Conserva a construção existencial negativa e sua conclusão severa, em português natural e digno.
theological_decisions:
- issue: Se os destinatários amaldiçoam os próprios dias ou são amaldiçoados por outros
  choice: Os destinatários amaldiçoam os próprios dias em lamento sob o juízo
  alternative: Os destinatários serão amaldiçoados por outros, ou uma maldição cairá sobre eles
  rationale: A forma verbal etíope é mais naturalmente lida como segunda pessoa plural ativa; a tradução mantém essa voz sem transformar a frase em passiva.
- issue: Força temporal de ዘለዓለም na fórmula de maldição
  choice: maldição eterna
  alternative: maldição perpétua ou duradoura
  rationale: No contexto apocalíptico de juízo, “eterna” comunica com clareza a duração enfática da expressão sem acrescentar uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com “vocês” para a segunda pessoa plural. A ordem e o paralelismo do texto foram preservados, mas com sintaxe natural. Os marcadores foram colocados junto às orações às quais suas notas efetivamente se referem.
