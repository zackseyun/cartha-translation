base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/001.yaml
  text: Observe how the trees are covered with green leaves and bear fruit[c][b][a], and understand concerning everything that the Ever-Living One has made all these things.
translation:
  language: pt
  text: Observem como as árvores se cobrem de folhas verdes e dão fruto; considerem tudo isso e saibam que Aquele que vive para sempre[b] fez todas essas coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma verbal transmitida em ge'ez é difícil e, tomada isoladamente, pode sugerir “vocês fizeram”. O contexto e a evidência textual comparativa favorecem a leitura “fez”, tendo como sujeito Aquele que vive para sempre.
    reason: textual_variant
  - marker: b
    text: Literalmente, “o que vive para sempre”; no contexto, a expressão se refere ao Criador.
    reason: alternative_reading
lexical_decisions:
- source_word: ጠይቁ እፎ
  choice: Observem como
  rationale: O imperativo plural introduz um apelo à contemplação, e እፎ exprime “como”. Em português, “observem como” comunica naturalmente o convite a aprender com a criação.
- source_word: ዕፀው
  choice: as árvores
  rationale: Designa árvores ou plantas lenhosas; “as árvores” é a expressão comum e adequada ao contexto.
- source_word: በሐመልማለ አቍጽል ይትከደኑ
  choice: se cobrem de folhas verdes
  rationale: A sequência descreve as árvores revestidas de folhagem verde. A forma reflexiva preserva a imagem de serem cobertas ou vestidas.
- source_word: ወይፈሪዩ
  choice: e dão fruto
  rationale: Tradução idiomática e concreta do verbo de frutificar.
- source_word: ወለበዉ በእንተ ኵሉ ወአእምሩ
  choice: considerem tudo isso e saibam
  rationale: 'Mantém os dois imperativos plurais dirigidos aos ouvintes: ponderar ou compreender e, em seguida, reconhecer ou saber.'
- source_word: ዘሕያው ለዓለም
  choice: Aquele que vive para sempre
  rationale: A expressão funciona no contexto como designação de Deus. A tradução conserva a formulação verbal do ge'ez em vez de substituí-la por um título teológico mais interpretativo.
- source_word: ገበርክሙ ለአሉንቱ ኵሎሙ
  choice: fez todas essas coisas
  rationale: O texto transmitido apresenta dificuldade morfológica, mas o contexto e a evidência textual comparativa sustentam o sentido de que o Vivente eterno fez todas essas coisas.
theological_decisions:
- issue: Referente de ዘሕያው ለዓለም
  choice: Aquele que vive para sempre
  alternative: os que vivem para sempre / para a vida eterna
  rationale: A sintaxe revisada e o contexto identificam a expressão mais provavelmente como referência ao Criador. A tradução evita acrescentar explicitamente “Deus”, preservando a forma e a leve tensão da expressão original.
- issue: Sujeito do verbo “fez” no trecho textualmente difícil
  choice: Aquele que vive para sempre fez todas essas coisas
  alternative: uma leitura literal da forma transmitida poderia sugerir “vocês fizeram”
  rationale: A forma ge'ez transmitida parece corrompida ou irregular; o fluxo do discurso sobre a ordem da criação e a evidência textual antiga favorecem o Criador como sujeito.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural (“observem”, “considerem”, “saibam”) e vocabulário acessível. A pontuação conserva a progressão entre observar a natureza, refletir sobre ela e reconhecer seu Criador.
