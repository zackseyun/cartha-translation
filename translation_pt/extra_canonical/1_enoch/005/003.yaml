lexical_decisions:
- source_word: ርእዩ
  choice: Vejam
  rationale: Imperativo plural que preserva o chamado direto para observar a ordem da criação.
- source_word: እፎ
  choice: como
  rationale: Introduz aquilo que deve ser observado e reproduz naturalmente a força exclamativa ou demonstrativa da expressão.
- source_word: አብሕርት
  choice: os mares
  rationale: Plural de ባሕር, «mar»; a leitura aquática é lexicalmente direta e se ajusta ao catálogo da natureza.
- source_word: ወአፍላግ
  choice: e os rios
  rationale: Plural de ፈልግ, «rio»; mantém o par formado por corpos e cursos de água.
- source_word: ኅቡረ
  choice: juntos
  rationale: Expressa ação conjunta ou coordenada de modo claro e idiomático em português.
- source_word: ይፌጽሙ
  choice: realizam
  rationale: Comunica o sentido de levar a efeito ou cumprir, evitando uma formulação pouco natural como «completam a sua obra».
- source_word: ግብሮሙ
  choice: a sua obra
  rationale: Refere-se à atividade própria dos mares e rios; «obra» preserva a linguagem digna e o tema da ordem criada.
