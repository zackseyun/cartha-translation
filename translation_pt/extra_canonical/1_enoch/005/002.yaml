base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/002.yaml
  text: And his works are before him for every year that shall be[a], and all his works are subject to him and do not change; but as God has ordained[b], so everything is done.
translation:
  language: pt
  text: E suas obras estão diante dele em cada ano que há de vir[a]; todas as suas obras lhe estão sujeitas[b] e não mudam. Mas, conforme Deus determinou, assim tudo se realiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ano após ano, no futuro”. A expressão em ge’ez aponta para o curso contínuo dos anos vindouros.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o servem”, “lhe obedecem” ou “estão ordenadas para ele”. A expressão ressalta que a criação permanece em conformidade com a ordem estabelecida por Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምግባሩ
  choice: suas obras
  rationale: O substantivo pode designar obras, feitos ou ações. “Obras” preserva sua repetição no versículo e se ajusta ao contexto da ordem da criação.
- source_word: ቅድሜሁ
  choice: diante dele
  rationale: Mantém a expressão espacial e relacional do ge’ez, com linguagem elevada, mas natural em português.
- source_word: ለለ ዓመት ዘይከውን
  choice: em cada ano que há de vir
  rationale: Expressa a sucessão contínua dos anos futuros sem transformar a frase em uma afirmação mais ampla do que o original.
- source_word: ይትቀነይ ሎቱ
  choice: lhe estão sujeitas
  rationale: O verbo comunica serviço, sujeição ou conformidade à ordem divina. Esta formulação é idiomática e preserva a relação ordenada, sem exigir que a personificação “servem a ele” seja tomada em sentido estrito.
- source_word: ኢይትመየጥ
  choice: não mudam
  rationale: Traduz com clareza a estabilidade e a ausência de alteração na ordem criada.
- source_word: ሠርዐ አምላክ
  choice: Deus determinou
  rationale: O verbo tem o sentido de ordenar, estabelecer ou determinar. “Determinou” comunica uma disposição fixada por Deus sem acrescentar terminologia confessional.
- source_word: ይትገበር ኵሉ
  choice: tudo se realiza
  rationale: Reproduz a expressão passiva ampla sobre a execução da ordem estabelecida e soa mais natural em português do que “tudo é feito” neste contexto.
theological_decisions:
- issue: Referente do sufixo de terceira pessoa em “suas obras”
  choice: O sufixo é entendido como referência a Deus, de modo que o versículo fala das obras de Deus na criação.
  alternative: Em tese, o sufixo poderia retomar outro antecedente do contexto imediato, como o céu ou algum elemento criado.
  rationale: A menção explícita de Deus na oração final e o tema da ordem anual estável favorecem fortemente Deus como referente, em harmonia com o contexto próximo, que convida a observar a regularidade da criação.
- issue: Natureza da relação expressa por ይትቀነይ ሎቱ
  choice: “lhe estão sujeitas”, preservando a ideia de sujeição e conformidade das obras à ordem divina.
  alternative: “o servem” ou “lhe obedecem”.
  rationale: O campo semântico permite serviço, obediência ou sujeição. A opção escolhida mantém essa amplitude e evita resolver a imagem como serviço pessoal estrito.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência levemente solene. A repetição de “suas obras” foi mantida por corresponder à repetição do texto-fonte; “em cada ano que há de vir” conserva a orientação futura da frase.
