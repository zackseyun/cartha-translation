base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/004.yaml
  text: He showed me everything[a], and wrote it down for me; and again he wrote down for me their names, and their commands[c][b], and their companies.
translation:
  language: pt
  text: Ele me mostrou tudo e o registrou para mim; além disso, registrou para mim os nomes deles, suas ordens[a] e seus agrupamentos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus mandamentos”, “suas determinações” ou “suas normas prescritas”. O termo ge’ez pode indicar instruções autoritativas ou regulações estabelecidas.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas assembleias”, “seus grupos” ou “suas divisões”. A expressão provavelmente indica conjuntos organizados no cenário celestial da visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ
  choice: tudo
  rationale: Mantém a força abrangente do termo e funciona naturalmente como objeto daquilo que foi mostrado.
- source_word: አርአየኒ
  choice: ele me mostrou
  rationale: Preserva o caráter visual e concreto da cena visionária, sem acrescentar a interpretação de que se tratou de uma revelação verbal.
- source_word: ጸሐፈ ሊተ
  choice: registrou para mim
  rationale: Expressa o ato de pôr por escrito em benefício de Enoque, sem especificar um suporte não mencionado na fonte.
- source_word: ወዓዲ
  choice: além disso
  rationale: Marca a adição de um segundo registro e evita sugerir que todo o ato anterior foi simplesmente repetido.
- source_word: አስማቲሆሙ
  choice: os nomes deles
  rationale: Reproduz diretamente o substantivo plural com seu sufixo possessivo.
- source_word: ትእዛዞሙ
  choice: suas ordens
  rationale: “Ordens” conserva tanto o sentido de determinações autoritativas quanto, no contexto cósmico, a possível ideia de ordenações prescritas, sem restringir o termo a leis astronômicas.
- source_word: ማኅበራቲሆሙ
  choice: seus agrupamentos
  rationale: Indica conjuntos organizados ou divisões, adequando-se ao cenário celestial sem introduzir a conotação militar de “hostes” nem a ambiguidade comercial de “companhias” em português moderno.
theological_decisions:
- issue: Se os possessivos se referem a seres ou fenômenos celestes organizados em categorias determinadas
  choice: Manter “ordens” e “agrupamentos”, preservando a organização cósmica sem identificar explicitamente os referentes como anjos, estrelas ou hostes.
  alternative: Traduzir como “leis” e “hostes”.
  rationale: O contexto visionário favorece referentes celestes, mas o versículo não os nomeia aqui. “Leis” resolveria ትእዛዞሙ como regulações cósmicas, e “hostes” acrescentaria uma imagem militar/celestial mais específica do que a fonte exige.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência narrativa. “Registrou” evita a formulação mais coloquial “anotou”, enquanto “agrupamentos” comunica organização sem soar empresarial ou excessivamente militar.
