  source_fidelity: A tradução preserva a sequência visionária, o destino cósmico («os confins da terra»), a distinção recíproca entre os grandes animais e a estrutura repetida aplicada às aves e às suas vozes. Mantém adequadamente o valor aditivo de «também» em relação às aves e às vozes. «Aparência» é uma contextualização defensável de «rostos», explicitamente documentada em nota; «formas» conserva prudentemente a incerteza de ስኖሙ sem paráfrase indevida.
