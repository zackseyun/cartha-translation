base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/001.yaml
  text: And from there I went to the ends of the earth[a], and there I saw great beasts, and they differed from one another; and the birds also differed in their appearance and their forms[c][b], and their voices also differed one from another.
translation:
  language: pt
  text: E dali fui até os confins da terra, e ali vi grandes animais selvagens, que diferiam uns dos outros. As aves também diferiam em sua aparência[a] e em suas formas[b], e suas vozes também diferiam umas das outras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “seus rostos”. Aqui, “aparência” expressa de modo mais amplo a característica visível pela qual as aves se distinguiam.
    reason: lexical_alternative
  - marker: b
    text: O termo traduzido como “formas” é incerto neste testemunho e pode se referir à forma, configuração ou constituição corporal das aves.
    reason: textual_uncertainty
lexical_decisions:
- source_word: እምህየ
  choice: dali
  rationale: Expressa de modo natural o ponto de partida e mantém a progressão da jornada visionária.
- source_word: ሖርኩ
  choice: fui
  rationale: Reproduz com simplicidade o verbo de movimento na primeira pessoa, sem acrescentar nuances ausentes no texto.
- source_word: አጽናፈ ምድር
  choice: os confins da terra
  rationale: Preserva a imagem cosmológica e apocalíptica do original em uma expressão portuguesa corrente e digna.
- source_word: አራዊተ ዐበይተ
  choice: grandes animais selvagens
  rationale: Comunica tanto o grande porte quanto o caráter não doméstico sugerido pelo substantivo, evitando que “feras” implique necessariamente ferocidade.
- source_word: ይትዌለጥ
  choice: diferiam
  rationale: Mantém a ideia de distinção e, na parte referente às aves e às vozes, preserva a repetição explícita do verbo no ge'ez.
- source_word: ፩እምካልኡ
  choice: uns dos outros / umas das outras
  rationale: É a forma recíproca natural em português; a concordância varia conforme o referente, animais ou vozes.
- source_word: አዕዋፍሂ
  choice: As aves também
  rationale: Conserva o sentido aditivo da partícula enclítica e introduz naturalmente o segundo grupo observado.
- source_word: ገጾሙ
  choice: sua aparência
  rationale: Embora o sentido literal seja “seus rostos”, o contexto compara características visíveis das aves; “aparência” comunica essa extensão sem ocultar a alternativa literal, registrada em nota.
- source_word: ስኖሙ
  choice: suas formas
  rationale: Reproduz de maneira concisa a provável referência à configuração ou forma corporal, sem ampliar o texto para “a forma de seus corpos”.
- source_word: ቃሎሙሂ
  choice: suas vozes também
  rationale: Preserva tanto “vozes” quanto a partícula aditiva, que destaca que as diferenças incluíam igualmente os sons das aves.
theological_decisions:
- issue: Alcance cosmológico de አጽናፈ ምድር
  choice: os confins da terra
  alternative: as extremidades da terra
  rationale: “Confins da terra” mantém a geografia cósmica da visão sem reduzi-la a simples regiões distantes nem impor uma interpretação cosmológica posterior.
- issue: Sentido de ገጾሙ na descrição das aves
  choice: sua aparência
  alternative: seus rostos
  rationale: A tradução principal comunica a função descritiva do termo no contexto, enquanto a nota preserva sua concretude lexical e a genuína possibilidade de leitura literal.
translation_notes:
  register: Português moderno, amplamente compreensível e de leitura natural no Brasil, com cadência narrativa digna. A repetição de “também diferiam” foi mantida para refletir a estrutura enfática do ge'ez, e as incertezas lexicais foram preservadas em notas, sem harmonização doutrinária.
