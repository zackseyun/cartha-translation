  terminology: «Confins da terra», «animais selvagens», «aves», «aparência», «formas» e «vozes» são escolhas consistentes e semanticamente cautelosas. As notas cobrem as duas principais dificuldades lexicais e seus marcadores estão corretamente ancorados.
