base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/002.yaml
  text: And to the east of these beasts I saw the ends of the earth[a], where the heaven rests[d][c][b], and the open gates of heaven.
translation:
  language: pt
  text: E a leste desses animais vi os confins da terra[a], onde o céu repousa[b], e os portões abertos do céu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as extremidades da terra». A expressão ge'ez indica os limites mais distantes do mundo.
    reason: lexical_alternative
  - marker: b
    text: A imagem reflete uma cosmologia antiga na qual o céu tem um lugar de repouso ou apoio nos limites do mundo.
    reason: cultural_note
  - marker: c
    text: «Portões do céu» também pode ser traduzido como «janelas» ou «aberturas do céu», conforme se entenda a arquitetura celeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽባሖሙ ለእሉ አርዌ
  choice: a leste desses animais
  rationale: Preserva a direção cardinal e o substantivo explícito no ge'ez, corrigindo a generalização anterior «além destes».
- source_word: አጽናፈ ምድር
  choice: os confins da terra
  rationale: Expressa de modo natural e digno os limites extremos do mundo na geografia apocalíptica, sem modernizar a imagem.
- source_word: በኀበ ሰማይ የዐርፍ
  choice: onde o céu repousa
  rationale: Mantém o sentido concreto de repousar ou assentar e a cosmologia antiga apresentada pela visão.
- source_word: ኀዋኅወ ሰማይ ርኁዋተ
  choice: os portões abertos do céu
  rationale: «Portões» comunica aberturas transitáveis na arquitetura celeste; «abertos» reproduz claramente o estado descrito.
theological_decisions:
- issue: Imagem cosmológica antiga do céu repousando nos confins da terra
  choice: onde o céu repousa
  alternative: onde o céu encontra a terra
  rationale: A tradução conserva a cosmografia concreta da visão, em vez de reinterpretá-la como horizonte ou metáfora moderna.
- issue: Natureza das aberturas celestes
  choice: portões abertos do céu
  alternative: janelas abertas do céu
  rationale: O termo admite mais de uma concepção arquitetônica; «portões» se ajusta ao contexto visionário sem impor uma leitura meteorológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da frase e as imagens concretas do ge'ez foram preservadas sem arcaísmos desnecessários.
