base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/003.yaml
  text: And I saw the portals from which the stars of heaven come out[a], and I wrote down all their outlets, each one by itself, according to their number and their names, by their order and their activity and their times and their months, as Uriel, the holy angel who was with me[c][b], showed me.
translation:
  language: pt
  text: E vi como saem as estrelas do céu e contei os portais[a] dos quais elas saem. Anotei todas as suas saídas, cada uma separadamente, conforme o número e os nomes delas, sua ordem, sua atividade[b], seus tempos e seus meses, como me mostrou Uriel, o santo anjo que estava comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portas”. O termo designa aberturas arquitetônicas da cosmologia visionária de 1 Enoque.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu funcionamento” ou “suas funções”.
    reason: lexical_alternative
lexical_decisions:
- source_word: አፎ
  choice: como
  rationale: Neste contexto, አፎ funciona como advérbio interrogativo ou modal, “como”, e não como o substantivo plural “bocas”. Assim, Enoque vê como as estrelas saem.
- source_word: ይወጽኡ / ይወፅኡ
  choice: saem
  rationale: Os dois verbos descrevem a saída das estrelas. A repetição de “saem” preserva a coesão do texto sem criar uma distinção lexical que o português não exige.
- source_word: ከዋክብተ ሰማይ
  choice: as estrelas do céu
  rationale: Tradução direta e natural que conserva o cenário cósmico e o registro elevado.
- source_word: ወኍለቁ ... ኀዋኅወ
  choice: e contei os portais
  rationale: A sequência é entendida como verbo de contagem seguido do objeto plural “portais” ou “portas”, em conformidade com a sintaxe e com a cosmologia arquitetônica de 1 Enoque.
- source_word: ጸሐፍኩ ኵሎ ሙፃኣቲሆሙ
  choice: Anotei todas as suas saídas
  rationale: A expressão se refere aos pontos ou atos de saída. “Saídas” mantém a imagem concreta e é mais transparente em português do que uma formulação excessivamente técnica.
- source_word: ለለ፩፩
  choice: cada uma separadamente
  rationale: A expressão distributiva indica registro individual, uma por uma.
- source_word: በኍልቆሙ ወእስማቲሆሙ
  choice: conforme o número e os nomes delas
  rationale: A formulação preserva a enumeração ordenada e deixa claro que os possessivos se referem às estrelas ou às suas saídas, sem forçar além do contexto.
- source_word: በደርጎሙ
  choice: sua ordem
  rationale: “Ordem” preserva a amplitude semântica entre sequência, disposição e categoria.
- source_word: ወምገባሮሙ
  choice: sua atividade
  rationale: O termo designa o que fazem ou como atuam. “Atividade” mantém essa generalidade sem impor a leitura mais técnica de “função”.
- source_word: ወጊዜሆሙ ወአውራኂሆሙ
  choice: seus tempos e seus meses
  rationale: A tradução direta preserva a regularidade temporal do catálogo celeste sem acrescentar “determinados” ou “lunares”, ideias possíveis, mas não necessárias.
- source_word: ኡርኤል መልአክ ዘምስሌየ ቅዱስ
  choice: Uriel, o santo anjo que estava comigo
  rationale: A ordem foi ajustada ao português natural, mantendo todos os elementos do original.
theological_decisions:
- issue: Imagem cósmica da saída das estrelas
  choice: Preservar os portais concretos e a saída das estrelas.
  alternative: Modernizar como simples observação do lugar onde as estrelas nascem no horizonte.
  rationale: A passagem descreve uma cosmologia visionária com estruturas celestes concretas. A tradução não deve convertê-la silenciosamente em astronomia moderna.
- issue: Sentido de አፎ na oração inicial
  choice: Traduzir como o advérbio “como”.
  alternative: Entender como “bocas” e traduzir “as bocas das quais saem as estrelas”.
  rationale: A forma e a sintaxe desta passagem favorecem o valor adverbial “como”; o plural substantival esperado para “bocas” seria outra forma. Essa decisão também evita duplicar indevidamente os portais mencionados em seguida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura enumerativa foi mantida, mas a longa frase foi dividida em duas para facilitar a leitura. Os pronomes femininos acompanham naturalmente “estrelas” e “saídas”, sem resolver de modo excessivo a referência exata de cada possessivo.
