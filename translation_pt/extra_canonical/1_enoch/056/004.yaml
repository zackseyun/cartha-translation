base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/004.yaml
  text: And in those days that valley will be filled with the chosen and with their beloved ones[a], and the days of their lives will be ended[f][e][d][c][b], and the days of their wandering will no longer be counted from then on.
translation:
  language: pt
  text: E, naqueles dias, aquele vale[a] se encherá dos escolhidos e de seus amados[b]. Os dias da vida deles chegarão ao fim, e, desde então, os dias de seu extravio[c] não serão mais contados[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo ge’ez significa aqui “vale”, embora possa ter uso mais amplo para uma região ou área.
    reason: lexical_alternative
  - marker: b
    text: A expressão “seus amados” é difícil; provavelmente se refere a pessoas queridas aos escolhidos ou ligadas a eles, mas a relação exata não é clara.
    reason: lexical_alternative
  - marker: c
    text: Ou “erro”, “desvio” ou “errância”.
    reason: lexical_alternative
  - marker: d
    text: O verbo pode também ser entendido como “computados” ou “levados em conta”. A frase final é obscura no texto etíope.
    reason: alternative_reading
lexical_decisions:
- source_word: እሜሃ
  choice: naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e seu tom visionário.
- source_word: ውእቱ ቈላ
  choice: aquele vale
  rationale: ቈላ designa aqui um vale, em continuidade com a topografia do contexto imediato; a nota registra a possível amplitude lexical.
- source_word: ሕሩያን
  choice: os escolhidos
  rationale: Mantém a força de designação coletiva característica das Parábolas, em linguagem clara e sem impor terminologia confessional.
- source_word: ፍቁራነ ዚአሆሙ
  choice: seus amados
  rationale: Reproduz a relação possessiva e o registro elevado, embora a identidade exata dessas pessoas permaneça incerta.
- source_word: ይትዌዳእ
  choice: chegarão ao fim
  rationale: Traduz o verbo de conclusão ou término como predicado próprio dos dias da vida, sem fundi-lo com o verbo da oração seguinte.
- source_word: ዕለተ ስሕተቶሙ
  choice: os dias de seu extravio
  rationale: Expressa a ideia de desvio ou errância moral e espiritual sem especificá-la além do que o substantivo permite.
- source_word: እምይእዜ ኢትትኌለቍ
  choice: desde então ... não serão mais contados
  rationale: Conserva a fórmula de cessação temporal e o sentido mais provável de contar ou computar, assinalando em nota a dificuldade verbal.
theological_decisions:
- issue: Designação ሕሩያን nas Parábolas
  choice: os escolhidos
  alternative: os eleitos
  rationale: “Os escolhidos” preserva o peso titular do termo, é natural em português atual e evita associações doutrinárias desnecessárias que “os eleitos” pode sugerir.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com cadência apocalíptica preservada. As duas orações verbais finais foram mantidas distintas: a vida chega ao fim, enquanto os dias de extravio deixam de ser contados.'
