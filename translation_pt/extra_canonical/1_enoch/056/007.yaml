base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/007.yaml
  text: And the city of my righteous ones shall be a hindrance to their horses[a]; and they will stir up slaughter among themselves, and their right hand will be strong against them. And a man will not know his brother, nor a son his father or his mother, until the number of the corpses from their death is complete[d][c][b], and their punishment will not be in vain.
translation:
  language: pt
  text: E a cidade dos meus justos será um obstáculo para os cavalos deles[a]. Eles provocarão matança entre si[b], e a mão direita deles será forte contra eles. Homem algum conhecerá seu irmão[c], nem um filho conhecerá o próprio pai ou a própria mãe, até que se complete o número dos cadáveres resultantes da morte deles[d]; e o castigo deles não será em vão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “impedimento” ou “armadilha” para os cavalos deles; o termo ge’ez sugere algo que bloqueia ou prende.
    reason: lexical_alternative
  - marker: b
    text: 'A construção também foi entendida como “eles se incitarão à matança entre si”; aqui, o verbo é tomado transitivamente: “provocarão matança”.'
    reason: previous_rendering
  - marker: c
    text: A expressão traduzida por “conhecerá seu irmão” também pode ter o sentido de “reconhecer” neste contexto.
    reason: lexical_alternative
  - marker: d
    text: A frase acerca do “número dos cadáveres” é textualmente difícil no etíope e foi mantida de forma transparente, sem ser simplificada para “o número dos mortos”.
    reason: textual_variant
lexical_decisions:
- source_word: ሀገረ፡ ጻድቃነ፡ ዚአየ
  choice: a cidade dos meus justos
  rationale: “Cidade” preserva a imagem concreta de um lugar habitado, e “meus justos” conserva a força possessiva da expressão etíope.
- source_word: ማዕቀፈ
  choice: obstáculo
  rationale: O termo indica algo que detém, bloqueia ou prende. “Obstáculo” mantém essa amplitude sem especificar uma armadilha literal.
- source_word: አፍራሲሆሙ
  choice: os cavalos deles
  rationale: A forma designa cavalos; a tradução literal preserva a imagem militar sem interpretá-la como “cavalaria”.
- source_word: ያነሥኡ፡ በበ፡ ቢይናቲሆሙ፡ ቀትለ
  choice: eles provocarão matança entre si
  rationale: O verbo é tomado transitivamente, com “matança” como objeto; a expressão recíproca indica violência interna.
- source_word: ትጸንዕ፡ የማኖሙ፡ ዲቤሆሙ
  choice: a mão direita deles se fortalecerá contra eles
  rationale: Mantém o idioma marcial da mão direita como símbolo de força e conserva a referência pronominal tensa do original.
- source_word: ኢያእምር፡ ብእሲ፡ ለአኁሁ
  choice: homem algum conhecerá seu irmão
  rationale: “Conhecer” traduz diretamente o verbo e permite também a nuance contextual de reconhecer.
- source_word: ወኢወልድ፡ ለአቡሁ፡ ወለእሙ
  choice: nem o filho conhecerá seu pai ou sua mãe
  rationale: A sintaxe é condensada; a repetição do verbo em português torna a relação filial clara sem alterar o sentido.
- source_word: ኍልቈ፡ አብድነት፡ እሞቶሙ
  choice: o número dos cadáveres resultantes da morte deles
  rationale: A formulação deliberadamente pouco polida procura preservar a combinação difícil de número, cadáveres e morte presente no testemunho etíope.
- source_word: መቅሰፍቶሙ፡ ኢትኩን፡ በከ
  choice: o castigo deles não será em vão
  rationale: “Castigo” abrange a ideia de punição ou flagelo, e “não será em vão” conserva a afirmação de que o juízo terá efeito.
theological_decisions:
- issue: Força possessiva em “cidade dos meus justos”
  choice: 'Conservar a primeira pessoa: “meus justos”'
  alternative: “os justos” ou “os justos dele”
  rationale: O testemunho etíope fornecido favorece a primeira pessoa. Mantê-la preserva a relação de pertença e proteção sem inserir terminologia doutrinária posterior.
- issue: Natureza do conflito
  choice: Matança recíproca entre os próprios grupos envolvidos
  alternative: Matança causada exclusivamente por forças externas
  rationale: A expressão recíproca “entre si” e o colapso subsequente dos vínculos familiares favorecem uma cena de violência interna.
- issue: Referência de “contra eles”
  choice: Preservar os pronomes do texto sem identificar mais precisamente os grupos
  alternative: Explicitar que cada combatente prevalece contra os demais
  rationale: O original mantém referências pronominais compactas e potencialmente tensas; explicitá-las resolveria uma ambiguidade que o texto não resolve.
- issue: Formulação da contagem dos cadáveres
  choice: Manter a dificuldade textual de modo transparente
  alternative: Suavizar para “até que se complete o número dos mortos”
  rationale: A redação etíope combina de maneira difícil as noções de contagem, cadáveres e morte. A tradução evita eliminar silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva o tom apocalíptico e a aspereza da cláusula textualmente difícil, evitando tanto arcaísmos desnecessários quanto explicações doutrinárias no corpo do texto.
