base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/005.yaml
  text: And in those days the angels will return and turn their heads toward the east[a], toward the people of Parthia and Media. They will stir up the kings, and a spirit of turmoil will come upon them; it will unsettle them from their thrones, and they will go out like lions from their lairs[c][b], and like hungry wolves in the midst of their pasture.
translation:
  language: pt
  text: E, naqueles dias, os anjos voltarão e virarão a cabeça para o leste, em direção ao povo da Pártia e da Média. Eles incitarão os reis[a], e um espírito de tumulto[b] virá sobre eles e os desalojará de seus tronos; eles sairão como leões de suas tocas e como lobos famintos em meio à sua pastagem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra que funciona como objeto de “incitarão” é textualmente difícil. “Os reis” é uma leitura provável, pois a oração seguinte menciona que eles serão desalojados de seus tronos.
    reason: textual_variant
  - marker: b
    text: Ou “um espírito de confusão”. A expressão em ge’ez pode indicar um agente ou impulso espiritual, mas também uma força ou condição de desordem; o texto não resolve essa distinção.
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e o plural do ge’ez em português natural.
- source_word: ይገብኡ መላእክት
  choice: os anjos voltarão
  rationale: A forma verbal do texto-base fornecido deriva de ገብአ, “voltar”; evita importar a variante reflexiva com o sentido de “reunir-se”.
- source_word: ይወድዩ አርእስቲሆሙ
  choice: virarão a cabeça
  rationale: Mantém a imagem corporal explícita do original, com concordância coletiva idiomática em português.
- source_word: ለምሥራቅ
  choice: para o leste
  rationale: Conserva a orientação geográfica concreta em linguagem corrente.
- source_word: ለኀበ ሰብአ ጳርቴ ወሙዴ
  choice: em direção ao povo da Pártia e da Média
  rationale: Retém tanto a referência ao povo quanto os nomes geográficos, sem reduzi-los apenas a etnônimos.
- source_word: የሐውክዎሙ
  choice: incitarão
  rationale: Expressa o valor causativo de agitar, perturbar ou lançar em desordem, adequado ao movimento político e militar do contexto.
- source_word: ለዝንቱ
  choice: os reis
  rationale: A leitura transmitida neste ponto é difícil; o contexto subsequente de tronos favorece governantes como referente, assinalado em nota.
- source_word: መንፈሰ ሀውክ
  choice: um espírito de tumulto
  rationale: Mantém a intensidade apocalíptica e a ambiguidade entre agente espiritual e força ou condição de desordem.
- source_word: የሀውክዎሙ እመንበረሆሙ
  choice: ele os desalojará de seus tronos
  rationale: “Desalojará” comunica a remoção violenta; “tronos” preserva a imagem régia indicada pelo contexto.
- source_word: ከመ አናብስት እምስካባቲሆሙ
  choice: como leões de suas tocas
  rationale: Reproduz a comparação predatória em português claro, evitando o literalismo enganoso de “leitos”.
- source_word: ከመ አዝእብት ርኁባን
  choice: como lobos famintos
  rationale: Preserva de modo direto o animal e sua fome, sem intensificação desnecessária.
- source_word: ማእከለ መርዔት ዚአሆሙ
  choice: no meio de suas pastagens
  rationale: Conserva a imagem do lugar de pastoreio sem acrescentar explicitamente rebanhos que o texto não nomeia de forma inequívoca.
theological_decisions:
- issue: Se መንፈሰ ሀውክ designa um agente espiritual pessoal ou uma força/condição de desordem
  choice: um espírito de tumulto
  alternative: um espírito de confusão
  rationale: O artigo indefinido e a inicial minúscula preservam a tensão do original, sem converter a expressão nem em ser demoníaco definido nem em abstração puramente psicológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “leste”, “tocas” e “lobos famintos” por clareza corrente, preservando a cadência apocalíptica, as imagens concretas e as incertezas textual e teológica relevantes.
