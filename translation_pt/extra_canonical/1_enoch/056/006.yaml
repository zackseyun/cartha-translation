base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/006.yaml
  text: And they shall go up and tread upon the land of his chosen ones[b][a], and the land of his chosen ones shall become before them a trampled place and a beaten path.
translation:
  language: pt
  text: E eles subirão e pisarão a terra dos seus escolhidos[a], e a terra dos seus escolhidos se tornará, diante deles, um lugar pisoteado e um caminho batido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “subirão e marcharão pela terra dos seus escolhidos”. Os verbos podem descrever tanto o avanço militar quanto o ato literal de caminhar ou pisar.'
    reason: lexical_alternative
  - marker: b
    text: 'A redação em ge''ez é difícil. As duas expressões finais provavelmente intensificam a imagem: a terra se torna algo pisoteado, como uma trilha ou um caminho batido.'
    reason: textual_variant
lexical_decisions:
- source_word: የዓርግዋ
  choice: subirão
  rationale: Preserva o movimento ascendente do verbo e, no contexto militar apocalíptico, também permite a ideia de avançar contra uma terra sem explicitá-la em excesso.
- source_word: ይከይድዋ
  choice: avançarão sobre
  rationale: O verbo pode indicar ir, caminhar ou pisar. A formulação comunica avanço militar e mantém a possibilidade do movimento físico sobre a terra; a alternativa mais literal é registrada em nota.
- source_word: ምድረ
  choice: terra
  rationale: Refere-se aqui ao território dos escolhidos, não necessariamente à totalidade do mundo; “terra” é natural e conserva a amplitude do termo.
- source_word: ኅሩያነ
  choice: escolhidos
  rationale: Mantém a designação enoquiana de modo claro e corrente, sem introduzir formulação doutrinária posterior.
- source_word: ዚአሁ
  choice: seus
  rationale: Conserva o pronome possessivo do ge'ez sem identificar explicitamente seu antecedente.
- source_word: በቅድሜሆሙ
  choice: diante deles
  rationale: Retém o valor espacial e situacional da expressão, apresentando a terra exposta aos invasores.
- source_word: ምካይደ
  choice: um lugar pisoteado
  rationale: Preserva a relação lexical com a ideia anterior de caminhar ou pisar e exprime a devastação produzida pelo avanço hostil.
- source_word: አሰረ
  choice: um caminho batido
  rationale: Representa concretamente uma trilha ou caminho formado pelo trânsito repetido e reforça a imagem de pisoteio.
theological_decisions:
- issue: Referente de “seus” em “seus escolhidos”
  choice: Manter apenas o possessivo “seus”, sem identificar o referente.
  alternative: “os escolhidos de Deus” ou “os escolhidos do Senhor”
  rationale: O ge'ez apresenta o pronome, mas este versículo não nomeia seu antecedente. Acrescentar “Deus” ou “Senhor” resolveria uma referência que o testemunho textual deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva a repetição de “a terra dos seus escolhidos”, o pronome de referente não explicitado e a imagem concreta do avanço devastador.
