base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/008.yaml
  text: And in those days Sheol will open its mouth[a], and they will sink down into it; and destruction will pursue them[c][b]; Sheol will swallow up the sinners from before the face of the chosen ones.
translation:
  language: pt
  text: E naqueles dias, o Sheol abrirá a boca, e eles afundarão nele; a destruição os perseguirá; o Sheol engolirá os pecadores, afastando-os da presença dos escolhidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de diante da face dos escolhidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica recorrente em linguagem elevada e natural.
- source_word: ትፈትሕ ሲኦል አፉሃ
  choice: o Sheol abrirá a boca
  rationale: Mantém a voz ativa e a personificação vívida do Sheol como reino devorador.
- source_word: ወይስጠሙ ውስቴታ
  choice: e eles afundarão nele
  rationale: Expressa o movimento descendente para dentro do Sheol sem acrescentar uma interpretação doutrinária.
- source_word: ወትትሎሙ ኀጕሎን
  choice: a destruição os perseguirá
  rationale: Traduz o verbo como ação explícita e verte de modo natural a imagem de a destruição ir no encalço deles.
- source_word: ሲኦል ይውሕጦሙ
  choice: o Sheol engolirá
  rationale: Conserva a forte imagem de devoração presente na personificação.
- source_word: ለኃጥኣን
  choice: os pecadores
  rationale: Corresponde diretamente ao substantivo, sem substituí-lo por uma caracterização interpretativa como 'ímpios'.
- source_word: እምቅድመ ገጸ ኅሩያን
  choice: afastando-os da presença dos escolhidos
  rationale: Comunica em português corrente o sentido do idioma literal 'de diante da face dos escolhidos', preservado em nota.
theological_decisions:
- issue: Tradução de ሲኦል
  choice: Sheol
  alternative: inferno; sepultura; mundo dos mortos
  rationale: O termo preserva a concepção antiga de um domínio personificado que abre a boca e engole, sem importar associações doutrinárias posteriores de 'inferno'.
- issue: Tradução de ኅሩያን
  choice: os escolhidos
  alternative: os eleitos
  rationale: A escolha é clara e localmente adequada ao contexto enoquiano, evitando carga teológica posterior desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva 'Sheol' e a personificação apocalíptica; a expressão semítica final é vertida idiomaticamente no texto e registrada literalmente em nota.
