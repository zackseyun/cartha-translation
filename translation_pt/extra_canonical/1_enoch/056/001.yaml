base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/001.yaml
  text: And there I saw the angels of punishment going about[c][b][a], and they were holding scourges and chains of iron and bronze.
translation:
  language: pt
  text: E ali vi os exércitos dos anjos de castigo andando de um lado para outro; eles seguravam açoites e correntes de ferro e bronze.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'A identificação dos instrumentos não é totalmente segura: os termos podem designar açoites, chicotes, correntes, grilhões ou outros instrumentos de castigo. A relação exata de “ferro e bronze” com cada instrumento também é ambígua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ በህየ
  choice: E ali vi
  rationale: Mantém a fórmula visionária na primeira pessoa e o advérbio locativo, com sintaxe natural em português.
- source_word: ትዕይንታተ፡ መላእክት፡ መቅሠፍት
  choice: os exércitos dos anjos de castigo
  rationale: Neste contexto, ትዕይንታተ é entendido como coletivos ou formações numerosas, isto é, “exércitos”; መላእክት፡ መቅሠፍት designa anjos incumbidos do castigo. A dificuldade de ትዕይንታተ é registrada em nota, sem ocultá-la.
- source_word: እንዘ፡ የሐውሩ
  choice: andando de um lado para outro
  rationale: Expressa movimento contínuo na cena sem especificar destino ou modo além do que o texto permite.
- source_word: ወይአሕዙ
  choice: eles seguravam
  rationale: O imperfeito descreve uma ação em curso; “seguravam” é direto e adequado aos instrumentos mencionados.
- source_word: መቅሠፍተ፡ ወመማግረ
  choice: açoites e correntes
  rationale: Conserva a ordem dos dois instrumentos no texto ge'ez. Os substantivos pertencem ao campo de instrumentos punitivos, embora sua identificação exata não seja inteiramente segura.
- source_word: ሐጺን፡ ውብርት
  choice: de ferro e bronze
  rationale: Preserva literalmente os dois metais e deixa que a coordenação qualifique o conjunto dos instrumentos, sem impor uma distribuição não explicitada.
theological_decisions:
- issue: Natureza dos seres angelicais
  choice: anjos incumbidos de executar castigo
  alternative: anjos destruidores ou anjos de aflição
  rationale: “Anjos de castigo” preserva o caráter judicial e apocalíptico da expressão sem acrescentar categorias demonológicas posteriores.
- issue: Sentido de ትዕይንታተ
  choice: exércitos
  alternative: visões, aparições ou formações
  rationale: A leitura coletiva “exércitos” se ajusta à construção com “anjos” e tem apoio na tradição textual da passagem, mas a forma é difícil; por isso, a alternativa permanece explícita em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Castigo” conserva a força judicial da cena; “açoites” mantém o tom bíblico sem soar excessivamente arcaico. As ambiguidades lexicais reais são preservadas em notas.
