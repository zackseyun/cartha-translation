base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/002.yaml
  text: And I asked the angel of peace who went with me, saying, “To whom are they going, these who hold the scourges?”
translation:
  language: pt
  text: 'E perguntei ao anjo da paz que ia comigo: “Para quem vão estes que seguram os instrumentos de castigo[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os açoites” ou “os meios de punição”. O termo em ge'ez pode indicar o próprio castigo ou aquilo com que ele é aplicado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: perguntei
  rationale: Expressa de modo direto e natural o ato de dirigir uma pergunta ao anjo.
- source_word: መልአክ ሰላም
  choice: anjo da paz
  rationale: Preserva a construção genitiva e a expressão enóquica, sem reduzi-la a um simples adjetivo.
- source_word: ዘየሐውር ምስሌየ
  choice: que ia comigo
  rationale: Mantém a ideia de deslocamento do anjo junto ao vidente e soa natural em português.
- source_word: እንዘ እብል
  choice: introdução direta da fala por dois-pontos
  rationale: A fórmula equivalente a “dizendo” introduz a pergunta; em português atual, os dois-pontos evitam uma construção pesada sem perder sua função discursiva.
- source_word: ለመኑ የሐውሩ
  choice: Para quem vão
  rationale: Conserva tanto a preposição de direção ou destinação quanto o verbo “ir”, evitando interpretar a pergunta como referente à identidade dos seres.
- source_word: እሉ እለ
  choice: estes que
  rationale: Retém a força dêitica do demonstrativo, indicando figuras presentes na visão.
- source_word: ይአኅዙ
  choice: seguram
  rationale: É uma tradução concreta e neutra, sem decidir se os objetos apenas são portados ou estão prontos para uso.
- source_word: መቅሠፍተ
  choice: instrumentos de castigo
  rationale: O verbo “seguram” favorece um sentido concreto e instrumental, mas o termo não identifica necessariamente um objeto específico como um açoite.
theological_decisions:
- issue: Sentido abstrato ou instrumental de መቅሠፍተ
  choice: instrumentos de castigo
  alternative: castigos; açoites
  rationale: A sintaxe apresenta algo que os seres seguram, favorecendo o sentido instrumental. A tradução evita especificar além da evidência do ge'ez, preservando a imagem apocalíptica.
- issue: Objeto da pergunta de Enoque
  choice: 'destino ou alvo: “Para quem vão”'
  alternative: 'identidade: “Quem são eles?”'
  rationale: O texto contém o verbo “ir” e a expressão preposicional “para quem”; portanto, a pergunta trata do destino ou alvo dos portadores, não de sua identidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem da pergunta foi ajustada ao uso natural do português, preservando o demonstrativo e a ambiguidade lexical do objeto mediante nota.
