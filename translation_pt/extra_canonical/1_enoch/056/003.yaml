base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/003.yaml
  text: And he said to me[a], 'To their chosen ones and to their beloved ones[c][b], so that they may be cast into the chasm of the abyss of the valley.'
translation:
  language: pt
  text: 'E ele me disse[a]: “Aos seus escolhidos e aos seus amados, para que sejam lançados na fenda[b] do abismo do vale.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A fala continua a pergunta do versículo anterior, mas a construção é difícil quando lida isoladamente; o referente de “seus” não é explicitado neste versículo.
    reason: contextual_ambiguity
  - marker: b
    text: Ou “na abertura” ou “na rachadura”. A expressão descreve uma formação profunda e ameaçadora no vale, mas sua configuração exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: E ele me disse
  rationale: Fórmula narrativa direta que introduz a explicação recebida pelo visionário.
- source_word: ለሕሩያነ፡ ዚአሆሙ
  choice: aos escolhidos deles
  rationale: O prefixo preposicional ለ expressa aqui direção, em resposta à pergunta do contexto anterior, e ዚአሆሙ funciona como possessivo de terceira pessoa do plural, não como demonstrativo.
- source_word: ወለፍቁራኒሆሙ
  choice: e aos amados deles
  rationale: Mantém o paralelismo e o possessivo plural, sem definir se os amados são parentes, aliados ou associados.
- source_word: ከመ፡ ይትወደዩ
  choice: para que sejam lançados
  rationale: Reproduz a finalidade e a forma passiva da ação punitiva sem intensificá-la desnecessariamente.
- source_word: ውስተ፡ ንቅዐተ
  choice: na fenda
  rationale: O substantivo designa uma abertura, rachadura ou desfiladeiro; “fenda” conserva a imagem topográfica sem impor dimensões não explicitadas.
- source_word: ማዕምቅ፡ ዘቈላ
  choice: do abismo do vale
  rationale: Preserva a cadeia genitiva e a paisagem visionária de profundidade associada ao vale.
theological_decisions:
- issue: Identidade dos “escolhidos” e dos “amados”
  choice: Manter os grupos indefinidos e conservar o possessivo “deles”.
  alternative: Identificá-los explicitamente como uma elite governante destinada ao juízo ou como pessoas selecionadas para punição.
  rationale: O versículo isolado não estabelece com segurança quem são esses grupos; explicitar sua identidade eliminaria uma tensão real do texto.
translation_notes:
  register: Português moderno, digno e acessível, com repetição deliberada de “deles” para conservar os dois possessivos e evitar que “seus” crie ambiguidade adicional.
