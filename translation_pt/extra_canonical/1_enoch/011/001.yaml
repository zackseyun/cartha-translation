base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/001.yaml
  text: And in those days I will open the storehouses of blessing that are in heaven[a], so that I may bring them down upon the earth, upon their work and upon their labor[g][f][e][d][c][b], for the children of men.
translation:
  language: pt
  text: E naqueles dias abrirei os depósitos de bênção que estão no céu, para fazê-los descer sobre a terra, sobre a obra e o trabalho dos filhos dos homens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: naqueles dias
  rationale: Fórmula temporal apocalíptica corrente; መዋዕል significa “dias”, não “portas”.
- source_word: እፈትሕ
  choice: abrirei
  rationale: Imperfeito na primeira pessoa do singular com sentido futuro.
- source_word: መዛግብተ
  choice: depósitos
  rationale: Designa lugares onde algo é armazenado; “depósitos” conserva a imagem concreta sem introduzir portas inexistentes no texto.
- source_word: በረከት
  choice: bênção
  rationale: Mantém o singular abstrato do ge'ez, que pode ter valor coletivo.
- source_word: በሰማይ
  choice: no céu
  rationale: Reproduz naturalmente o substantivo no singular e o contexto cósmico.
- source_word: ከመ፡ አውርዶሙ
  choice: para fazê-los descer
  rationale: Preserva tanto a finalidade expressa por ከመ quanto a forma causativa de “descer”, com objeto plural.
- source_word: ዲበ፡ ምድር
  choice: sobre a terra
  rationale: Mantém o sentido espacial e cósmico da expressão.
- source_word: ግብሮሙ
  choice: a obra
  rationale: O termo pode indicar obra, trabalho ou atividade; “obra” ajuda a conservar a distinção em relação ao termo seguinte.
- source_word: ፃማሆሙ
  choice: o trabalho
  rationale: Significa labor, esforço ou trabalho; não “semente” nem “descendência”.
- source_word: ለውሉደ፡ ሰብእ
  choice: dos filhos dos homens
  rationale: Conserva a fórmula tradicional de Enoque sem explicitar além do texto.
theological_decisions:
- issue: Identidade do falante na primeira pessoa
  choice: Manter apenas a primeira pessoa verbal, sem nomear o falante
  alternative: Acrescentar “Deus” ou “o Altíssimo”
  rationale: O contexto favorece um falante divino, mas o versículo não fornece aqui um nome; não se deve suprir essa identificação no texto.
- issue: Expressão “filhos dos homens”
  choice: Conservar a expressão formulaica
  alternative: “seres humanos” ou “humanidade”
  rationale: A formulação preserva o sabor literário e a linguagem convencional de Enoque, permanecendo compreensível em português.
- issue: Número de “bênção”
  choice: Singular coletivo “bênção”
  alternative: Plural “bênçãos”
  rationale: O ge'ez apresenta o singular abstrato; ele pode abranger benefícios múltiplos sem que a tradução altere o número.
- issue: Referente do pronome plural em “fazê-los descer”
  choice: Preservar o pronome plural conforme a morfologia do ge'ez
  alternative: Reformular no singular como “fazê-la descer”, referindo-se explicitamente à bênção
  rationale: A forma verbal traz objeto plural, criando uma tensão com o singular coletivo “bênção”; a tradução conserva essa irregularidade ou ambiguidade em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais. A repetição “sobre... sobre...” preserva a estrutura do original. Não se incluem notas herdadas que propunham “portas” ou “descendência”, pois essas opções não têm apoio no texto ge'ez.
