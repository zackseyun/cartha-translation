base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/002.yaml
  text: And peace and truth shall be partners throughout all the days of the world and throughout all the generations of the world[a][b][c][d].
translation:
  language: pt
  text: E a paz e a verdade estarão unidas[a] durante todos os dias do mundo[b] e durante todas as gerações do mundo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estarão associadas” ou “estarão juntas”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em todos os dias do mundo”; a expressão pode também ser entendida como “por todos os dias da eternidade”.
    reason: idiom_clarification
  - marker: c
    text: Isto é, por todas as gerações sucessivas.
    reason: scope_clarification
lexical_decisions:
- source_word: ሰላም
  choice: paz
  rationale: Equivalente corrente e direto; no par com “verdade”, comunica paz e ordem íntegra.
- source_word: ርትዕ
  choice: verdade
  rationale: Preserva o sentido básico do substantivo ge'ez e a formulação tradicional “paz e verdade”.
- source_word: ሱቱፋነ ይከውኑ
  choice: serão companheiras
  rationale: 'Lê ሱቱፋነ como participação ou associação e conserva a personificação: paz e verdade estarão associadas uma à outra. A expressão é mais fiel à forma atestada do que uma paráfrase que as faça simplesmente “aumentar”.'
- source_word: በኵሉ መዋዕለ ዓለም
  choice: por todos os dias do mundo
  rationale: መዋዕል é o plural de “dia”; a expressão tem alcance temporal abrangente. “Por todos” soa natural em português e mantém a totalidade indicada por በኵሉ.
- source_word: በኵሉ ትውልደ ዓለም
  choice: por todas as gerações do mundo
  rationale: Mantém a repetição enfática e o alcance universal da construção ge'ez, sem restringi-la a uma única época.
theological_decisions:
- issue: Alcance temporal da união entre paz e verdade
  choice: 'Abrangência contínua: “por todos os dias do mundo” e “por todas as gerações do mundo”.'
  alternative: Restringir a afirmação a uma única era escatológica.
  rationale: A dupla construção com o quantificador universal enfatiza totalidade através do tempo; a tradução não impõe um cronograma escatológico específico.
- issue: Relação entre paz e verdade
  choice: Conservar a imagem de que são “companheiras”.
  alternative: Traduzir que paz e verdade “se multiplicarão” ou “serão abundantes”.
  rationale: A forma ሱቱፋነ favorece associação, participação ou companheirismo; a tradução preserva a personificação e registra em nota a leitura alternativa.
translation_notes:
  register: Português moderno, claro e digno, com cadência coordenada próxima à do ge'ez. “Serão companheiras” preserva a personificação sem soar excessivamente técnica; a repetição de “por todas” conserva a ênfase abrangente do original.
