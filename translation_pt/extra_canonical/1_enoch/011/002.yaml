  source_fidelity: A construção ge'ez ሱቱፋነ ይከውኑ descreve paz e verdade como associadas/unidas; a tradição de Charles a traduz como “associated together”. “Serão companheiras” é possível, mas em português pode sugerir uma relação social menos direta. “Estarão unidas” comunica com maior precisão a associação personificada. As duas expressões temporais preservam corretamente a repetição enfática e o alcance abrangente do original.
  naturalness: “Estarão unidas” é mais idiomático e claro no português moderno do que “serão companheiras” neste contexto. “Durante todos os dias do mundo” mantém a literalidade de “dias” e flui melhor que “por todos os dias”.
  terminology: “Paz” e “verdade” são adequadas e mantêm a colocação tradicional. “Dias do mundo” e “gerações do mundo” preservam a terminologia e a cadência da fonte sem impor uma leitura escatológica específica.
