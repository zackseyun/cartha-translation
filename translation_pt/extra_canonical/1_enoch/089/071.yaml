base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/071.yaml
  text: And the book was read before the Lord of the sheep[a], and he took the book from his hand and read it, and sealed it[c][b], and set it down.
translation:
  language: pt
  text: E o livro foi lido diante do Senhor das ovelhas; então ele tomou o livro da mão dele[a], leu-o, selou-o e o pôs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto não identifica expressamente a pessoa cuja mão segurava o livro.
    reason: alternative_reading
lexical_decisions:
- source_word: መጽሐፍ
  choice: livro
  rationale: É o termo ge'ez comum para livro ou documento escrito; “livro” não especifica indevidamente o formato material.
- source_word: ተነበ
  choice: foi lido
  rationale: 'Embora a forma transmitida pareça incompleta, a evidência de revisão identifica o verbo como ተነበበ, “foi lido”. A repetição com o verbo seguinte é intencional: primeiro o livro é lido diante do Senhor, depois ele próprio o toma e lê.'
- source_word: በቅድመ
  choice: diante de
  rationale: Expressa presença e mantém naturalmente o cenário solene da visão.
- source_word: እግዚአ አባግዕ
  choice: Senhor das ovelhas
  rationale: Preserva tanto o título elevado quanto a metáfora contínua do Apocalipse dos Animais.
- source_word: ነሥአ
  choice: tomou
  rationale: Verbo narrativo direto que indica tomar o livro da posse de outra figura.
- source_word: እምእዱ
  choice: da mão dele
  rationale: Mantém a imagem concreta e a ambiguidade do pronome no texto ge'ez, que não torna a identificar expressamente o possuidor.
- source_word: አንበበ
  choice: leu-o
  rationale: Indica diretamente a leitura do registro escrito.
- source_word: ኀተማ
  choice: selou-o
  rationale: Conserva a imagem documental e seu possível valor jurídico, sem reduzi-la a mera autenticação.
- source_word: አንበረ
  choice: o colocou de lado
  rationale: Comunica a ação concreta de pôr ou depositar o livro após lê-lo e selá-lo, em português natural.
theological_decisions:
- issue: Título እግዚአ አባግዕ no Apocalipse dos Animais
  choice: Senhor das ovelhas
  alternative: dono das ovelhas
  rationale: “Senhor” mantém a autoridade e o registro elevado da figura divina, enquanto “das ovelhas” preserva a linguagem figurada da visão.
- issue: Repetição da leitura do livro
  choice: manter ambas as ações de ler
  alternative: traduzir a primeira ação como “foi aberto”
  rationale: A leitura passiva inicial e a leitura posterior pelo Senhor representam ações sucessivas. Manter a repetição segue a identificação revisada do verbo e evita resolver a sequência por conjectura estilística.
translation_notes:
  register: Português atual, claro e solene, com legibilidade brasileira. A coordenação narrativa foi suavizada com “então”, sem alterar a sequência. O pronome ambíguo foi preservado, e a repetição do ato de ler foi mantida por ser significativa no texto-fonte.
