base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/018.yaml
  text: And one sheep went to the wolves at the word of the Lord[a], and another sheep met him and went with him. And the two of them went together and entered into the assembly of those wolves, and they spoke to them and made them hear[d][c][b], that from then on they should not ravage the sheep.
translation:
  language: pt
  text: E uma ovelha foi até os lobos por ordem do Senhor[a], e outra ovelha encontrou-se com ela e foi com ela. As duas foram juntas e entraram na assembleia daqueles lobos; falaram com eles e os advertiram[b] de que, daquele momento em diante, não mais devastassem as ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo a palavra do Senhor”. A expressão ge''ez pode indicar uma ação realizada em resposta à fala ou à ordem divina.'
    reason: lexical_alternative
  - marker: b
    text: A expressão ge'ez é literalmente próxima de “fizeram-nos ouvir contra eles”. Neste contexto, a construção tem a força de uma advertência dirigida aos lobos.
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: ovelha
  rationale: Mantém a figura animal genérica e simbólica do Apocalipse dos Animais, sem especificar sexo ou idade.
- source_word: አዝእብት
  choice: lobos
  rationale: É o sentido normal do termo e preserva a imagem predatória do texto.
- source_word: በቃለ እግዚእ
  choice: por ordem do Senhor
  rationale: No contexto, a expressão indica ação em resposta à fala ou ordem divina; esta formulação é natural em português e mantém a autoridade divina. A alternativa mais formal consta em nota.
- source_word: ተረክቦ
  choice: encontrou-se com ela
  rationale: Expressa o encontro da segunda ovelha com a primeira sem antecipar a ideia de acompanhamento, que aparece em seguida.
- source_word: ምስሌሁ
  choice: com ela
  rationale: Traduz diretamente a ideia de acompanhamento; o feminino natural de 'ovelha' exige a concordância portuguesa.
- source_word: ኅቡረ
  choice: juntas
  rationale: Realça a ação conjunta das duas ovelhas em português corrente.
- source_word: ማኅበሮሙ
  choice: assembleia
  rationale: Preserva o sentido formal de reunião ou grupo organizado sem introduzir conotação eclesiástica específica.
- source_word: ወተናገርዎሙ
  choice: falaram com eles
  rationale: Reproduz de modo direto a sequência narrativa e o ato de dirigir a palavra aos lobos.
- source_word: ወአስምዑ ዲቤሆሙ
  choice: os advertiram
  rationale: A construção causativa com ዲቤሆሙ, literalmente próxima de 'fizeram ouvir contra/sobre eles', tem aqui força adversativa de advertência; a tradução idiomática evita o português obscuro 'fizeram-nos ouvir' sem apagar a nuance em nota.
- source_word: ከመ እምይእዜ
  choice: de que, daquele momento em diante
  rationale: Marca tanto o conteúdo da advertência quanto o início temporal da proibição continuada.
- source_word: ኢይግሥሥዎሙ
  choice: não atacassem
  rationale: No cenário de lobos e ovelhas, comunica violência predatória de modo natural e claro; não reduz a ação a dano genérico.
- source_word: አባግዕት
  choice: as ovelhas
  rationale: Mantém explicitamente a repetição da imagem animal, em vez de substituí-la por 'rebanho'.
theological_decisions:
- issue: Sentido de እግዚእ no contexto da visão apocalíptica
  choice: o Senhor
  alternative: o senhor / o mestre
  rationale: A missão da ovelha procede de autoridade divina no contexto da visão. 'O Senhor' conserva o peso reverencial sem impor uma identificação denominacional mais específica.
- issue: Força da proibição final
  choice: não atacassem as ovelhas
  alternative: não mais devastassem as ovelhas
  rationale: O subjuntivo dependente da advertência preserva a força injuntiva do texto; 'atacassem' mantém a violência predatória com clareza contemporânea, enquanto a alternativa é mais literal e intensa.
translation_notes:
  register: Português moderno, digno e acessível, com encadeamento narrativo fluente. Empregou-se o feminino gramatical para a ovelha sem inferir sexo no símbolo. A repetição de 'ovelha(s)' e 'lobos' foi preservada. A construção idiomática de advertência foi vertida pelo sentido contextual, com a forma mais literal registrada em nota.
