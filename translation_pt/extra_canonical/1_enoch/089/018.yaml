revisions:
- from: E uma ovelha foi até os lobos por ordem do Senhor[a], e outra ovelha encontrou-se com ela e foi com ela. As duas foram juntas e entraram na assembleia daqueles lobos; falaram com eles e os advertiram[b] de que, daquele momento em diante, não atacassem as ovelhas.
  to: E uma ovelha foi até os lobos por ordem do Senhor[a], e outra ovelha encontrou-se com ela e foi com ela. As duas foram juntas e entraram na assembleia daqueles lobos; falaram com eles e os advertiram[b] de que, daquele momento em diante, não mais devastassem as ovelhas.
  rationale: A revisão limita-se a fortalecer o verbo final para refletir a violência predatória expressa no original e a explicitar «não mais», mantendo a tradução contextual e natural da expressão idiomática como «os advertiram». A nota b foi ajustada para explicar a construção sem sobrecarregá-la com uma paráfrase menos segura.
