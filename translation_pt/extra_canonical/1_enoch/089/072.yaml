base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/072.yaml
  text: And again I saw the shepherds pasturing for twelve hours, and behold, three of those sheep returned, and they arrived and entered, and they began to build up all that had fallen down of that house.
translation:
  language: pt
  text: Então vi novamente os pastores apascentando durante doze horas. E eis que três daquelas ovelhas voltaram, chegaram, entraram e começaram a reconstruir tudo o que havia desabado daquela casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምኔሁ
  choice: Então... novamente
  rationale: A sequência narrativa admite valor continuativo ou reiterativo; esta formulação preserva a leitura «again» da camada de consulta sem produzir uma ligação artificial em português.
- source_word: ይርዐዩ
  choice: apascentando
  rationale: O verbo descreve a atividade dos pastores de conduzir e alimentar o rebanho; «apascentar» é preciso, digno e amplamente compreensível.
- source_word: ፲ወ፪ ሰዓተ
  choice: durante doze horas
  rationale: Mantém literalmente a medida temporal simbólica do texto, sem interpretá-la como anos ou outro período.
- source_word: ገብኡ
  choice: voltaram
  rationale: No contexto, o movimento das ovelhas é entendido como retorno; «voltaram» reproduz a leitura contextual adotada pela edição de consulta.
- source_word: ሐንጹ
  choice: reconstruir
  rationale: Como o objeto é aquilo que havia desabado, «reconstruir» comunica naturalmente a restauração implícita no ato de edificar de novo.
theological_decisions:
- issue: Valor simbólico das doze horas e das três ovelhas
  choice: Conservar as imagens e os números sem identificação histórica explícita
  alternative: Identificar no corpo do texto períodos históricos ou personagens específicos
  rationale: O versículo apresenta uma visão alegórica, mas não fornece aqui a interpretação; explicitá-la resolveria indevidamente a ambiguidade.
- issue: Natureza da casa reconstruída
  choice: Manter «casa» sem especificar templo, cidade ou comunidade
  alternative: Traduzir interpretativamente como «templo» ou «Jerusalém»
  rationale: A imagem de «casa» deve permanecer aberta, preservando a tensão e o alcance simbólico do texto.
translation_notes:
  register: Português moderno, fluente e digno, com legibilidade brasileira e vocabulário bíblico corrente. A coordenação verbal preserva a progressão rápida da visão sem acrescentar explicações interpretativas.
