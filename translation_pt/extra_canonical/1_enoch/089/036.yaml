base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/036.yaml
  text: And I saw in the vision until that sheep became a man[a], and built a house for the Lord of the sheep[c][b], and he placed all the sheep in that house.
translation:
  language: pt
  text: E vi, na visão, até que aquela ovelha se tornou um homem[a], construiu uma casa para o Senhor das ovelhas[b] e colocou todas as ovelhas naquela casa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A transformação da ovelha em «um homem» faz parte do simbolismo da visão; o texto não identifica aqui essa figura.
    reason: cultural_note
  - marker: b
    text: «Casa» provavelmente tem aqui conotações de santuário ou templo, embora o termo ge'ez empregado signifique simplesmente «casa».
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «fez todas as ovelhas ficarem de pé naquela casa». O verbo também pode significar colocar ou estabelecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: ovelha
  rationale: Mantém a imagem genérica do rebanho ao longo do Apocalipse dos Animais, sem especificar idade ou sexo como fariam «cordeiro» ou «carneiro».
- source_word: ኮነ ብእሴ
  choice: se tornou um homem
  rationale: Expressa naturalmente a transformação simbólica da ovelha em figura humana e preserva o caráter surpreendente da visão.
- source_word: ሐነጸ ቤተ
  choice: construiu uma casa
  rationale: Traduz diretamente «construiu uma casa», preservando a imagem lexical do ge'ez; a provável conotação de templo ou santuário fica indicada em nota.
- source_word: ለእግዚአ አባግዕ
  choice: para o Senhor das ovelhas
  rationale: «Senhor» conserva o registro elevado e a função da figura divina, enquanto «das ovelhas» reproduz a relação expressa no original.
- source_word: አቀሞሙ
  choice: pôs todas as ovelhas
  rationale: O causativo pode significar fazer ficar de pé, colocar ou estabelecer. «Pôs» é natural no contexto espacial sem apagar por completo a ideia de posicionamento; a tradução mais formal é registrada em nota.
- source_word: በውእቱ ቤት
  choice: naquela casa
  rationale: Conserva o demonstrativo e a referência narrativa à casa recém-construída.
theological_decisions:
- issue: Traduzir ቤተ como «casa» ou interpretá-lo como «templo»
  choice: casa
  alternative: templo; santuário
  rationale: O termo imediato é «casa». Embora o contexto sugira função cultual, inserir «templo» no texto resolveria uma conotação que o original deixa implícita.
- issue: Identidade da ovelha que se tornou homem
  choice: não identificar a figura
  alternative: Moisés; um líder que represente Moisés ou a liderança cultual de Israel
  rationale: A identificação pertence à interpretação da alegoria. A tradução mantém a transformação simbólica tal como aparece no texto.
- issue: Amplitude semântica de አቀሞሙ
  choice: pôs
  alternative: fez ficar de pé; colocou; estabeleceu
  rationale: «Pôs» comunica a colocação do rebanho dentro da casa em português corrente, enquanto a nota preserva a formulação causativa mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição de «ovelhas» e «casa» foi mantida por sua importância na alegoria. «Continuei olhando» representa com naturalidade a construção visionária durativa, e as notas preservam as ambiguidades lexical, simbólica e cultual.
