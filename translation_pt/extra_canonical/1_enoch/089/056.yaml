base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/056.yaml
  text: And I saw that he abandoned that house of theirs and their tower and all their beloved ones into the hand of the lions[a], so that they might tear them apart, and into the hands of all the wild beasts[c][b], so that they might devour them.
translation:
  language: pt
  text: E vi que ele abandonou aquela casa deles e a torre deles[a], e entregou todos eles nas mãos dos leões e nas mãos de todos os animais selvagens[b], para que os dilacerassem e devorassem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Casa” e “torre” preservam as imagens da própria visão; a tradução não as identifica aqui como templo, aprisco ou comunidade.
    reason: cultural_note
  - marker: b
    text: “Nas mãos de” é uma expressão que indica ser entregue ao poder ou controle de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሐደጎ
  choice: abandonou
  rationale: O verbo expressa deixar ou desamparar; “abandonou” conserva a força de juízo presente no contexto.
- source_word: ቤተ
  choice: casa
  rationale: Mantém o sentido concreto básico e a imagem própria da visão, sem interpretá-la no texto principal como templo ou comunidade.
- source_word: ማኅፈዶሙ
  choice: a torre deles
  rationale: Conserva a imagem arquitetônica de uma estrutura protetora associada à casa; “aprisco” ou “cercado” interpretariam mais diretamente o símbolo.
- source_word: ወወደዮሙ ለኵሎሙ
  choice: e entregou todos eles
  rationale: A sequência é entendida como ação de entregar todos eles, em ligação com a expressão seguinte “nas mãos de”; evita introduzir “seus amados”, leitura que deixa sem verbo claro a oração.
- source_word: ዲበ እደ / ውስተ እደዊሆሙ
  choice: nas mãos de
  rationale: Preserva em português uma expressão bíblica compreensível para sujeição ao poder ou controle de alguém.
- source_word: አናብስት
  choice: leões
  rationale: É o referente animal concreto do texto e deve permanecer sem decodificação simbólica.
- source_word: ይምሥጥዎሙ
  choice: os dilacerassem
  rationale: Expressa a ação predatória violenta e mantém distinção em relação ao verbo seguinte, “devorar”.
- source_word: ይብልዕዎሙ
  choice: os devorassem
  rationale: Reproduz o sentido de comer ou consumir no cenário de ataque por feras.
- source_word: አራዊት
  choice: animais selvagens
  rationale: É natural em português moderno e distingue essas criaturas dos animais domesticados da visão.
theological_decisions:
- issue: Identificação simbólica da casa e da torre
  choice: Manter “casa” e “torre” como imagens da visão.
  alternative: Traduzir interpretativamente como “templo”, “comunidade”, “aprisco” ou “cercado”.
  rationale: O texto apresenta símbolos concretos, e sua identificação histórica ou teológica não deve ser inserida silenciosamente na tradução.
- issue: Expressão de entrega ao poder dos animais
  choice: Usar “nas mãos dos leões” e “nas mãos de todos os animais selvagens”.
  alternative: Usar “ao poder dos leões” ou simplesmente “aos leões”.
  rationale: A formulação preserva a textura semítica e judicial da passagem, permanecendo inteligível em português.
- issue: Relação das duas orações finais com seus respectivos animais
  choice: Associar “dilacerassem” aos leões e “devorassem” a todos os animais selvagens.
  alternative: Manter a ordem mais estritamente linear, na qual ambas as ações podem parecer ligadas aos leões antes da menção dos outros animais.
  rationale: A disposição escolhida torna clara a estrutura da frase, mas a nota registra a possibilidade de uma leitura linear diferente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para ligar cada grupo de animais à ação correspondente, sem eliminar a alternativa na nota. O vocabulário conserva o caráter apocalíptico e concreto da visão.
