base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/026.yaml
  text: And when they saw the Lord of the sheep, And when they saw the Lord of the sheep, they turned back so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves. so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves.
translation:
  language: pt
  text: E, quando viram o Senhor das ovelhas, entraram[a] para fugir de diante de sua face. Então aquele curso de água[b] reuniu-se, tornou-se veloz conforme a sua natureza, encheu-se de água e subiu até cobrir aqueles lobos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram entrando” ou “entraram”. O lugar em que entraram não é explicitado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “canal de água” ou “leito da torrente”. O termo pode indicar um curso que se enche repentinamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕት
  choice: o Senhor das ovelhas
  rationale: Mantém a relação de domínio expressa pela construção e preserva tanto o peso teológico quanto a imagem recorrente da alegoria animal.
- source_word: ገብኡ
  choice: recuaram
  rationale: No contexto, o movimento introduz a fuga diante do Senhor das ovelhas. A tradução contextual evita a construção pouco natural 'entraram para fugir', mas a acepção lexical básica é preservada em nota.
- source_word: ከመ ይጕየዩ እምቅድመ ገጹ
  choice: para fugir de diante de sua face
  rationale: Conserva o idioma semítico ligado à presença e ao juízo, sem reduzi-lo simplesmente a 'fugir dele'.
- source_word: ዝኩ ዐይገ ማይ
  choice: aquele curso de água
  rationale: Expressão suficientemente ampla para designar um canal, leito ou torrente que se avoluma, sem definir em excesso a topografia da visão.
- source_word: ተጋብአ
  choice: acumulou suas águas
  rationale: Expressa de modo natural em português a ideia de águas que se juntam ou se concentram, mantendo como sujeito o curso de água do texto.
- source_word: ከመ ፍጥረቱ ፍጡነ
  choice: tornou-se veloz conforme a sua natureza
  rationale: Preserva a formulação incomum do ge'ez, que relaciona a rapidez do curso de água à sua própria natureza, sem explicá-la excessivamente.
- source_word: መልአ ማይ
  choice: encheu-se de água
  rationale: Tradução direta e natural da imagem da enchente.
- source_word: ተላዐለ እስከ ከደኖሙ ለእልኩ አዝእብት
  choice: subiu até cobrir aqueles lobos
  rationale: Analisa ከደኖሙ como o verbo 'cobrir' com sufixo de objeto plural, retomado pelo objeto explícito 'aqueles lobos'; assim, não introduz uma falsa ambiguidade com 'abrigo' ou 'cobertura'.
theological_decisions:
- issue: Designação da figura divina na alegoria animal
  choice: o Senhor das ovelhas
  alternative: o dono das ovelhas; o senhor delas, das ovelhas
  rationale: '''Senhor'' conserva a dignidade teológica e a função literária da figura sem abandonar a linguagem interna da alegoria.'
- issue: Idioma de presença em uma cena de juízo
  choice: de diante de sua face
  alternative: de sua presença; de diante dele
  rationale: A formulação mais literal preserva a força da manifestação divina e o estilo semítico da visão apocalíptica.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível ao leitor comum. Mantém-se deliberadamente o idioma imagético “diante de sua face” e a expressão incomum “conforme a sua natureza”, enquanto pequenas adaptações tornam natural a descrição do curso de água.
