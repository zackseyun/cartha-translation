base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/070.yaml
  text: And thus in the vision I saw that the one who wrote wrote down every one that was destroyed by those shepherds[a], day by day, and he brought up and laid down and showed that whole book to the Lord of the sheep, all that they had done, and all that each one of them had made away with[d][c][b], and all that they had given over to destruction.
translation:
  language: pt
  text: 'E assim, na visão, vi como aquele que escrevia registrava, dia após dia, cada um que era destruído por aqueles pastores[a]. Ele levou aquele livro para o alto, depositou-o e o mostrou por inteiro ao Senhor das ovelhas[b]: tudo o que eles haviam feito, tudo o que cada um deles havia retirado[c] e tudo o que haviam entregado à destruição.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção etíope admite outra segmentação: «cada um daqueles pastores que era destruído, dia após dia».'
    reason: Ambiguidade sintática e de referente no testemunho etíope.
  - marker: b
    text: A repetição do ato de escrever e a apresentação do livro retratam um registro celestial das ações dos pastores levado perante o juízo divino.
    reason: Esclarecimento da imagem apocalíptica sem substituir a formulação do texto.
  - marker: c
    text: Ou «havia removido» ou «havia feito desaparecer». O termo etíope é difícil e pode se referir mais especificamente ao que cada pastor tirou do rebanho ou fez desaparecer.
    reason: Alternativa lexical genuína.
lexical_decisions:
- source_word: ርኢክዎ
  choice: vi
  rationale: Verbo comum de relato visionário; mantém a narração direta sem arcaísmo.
- source_word: ዘይጽሕፍ … ይጽሕፍ
  choice: aquele que escrevia registrar
  rationale: Preserva tanto a caracterização funcional da figura quanto a repetição da raiz «escrever», evitando identificá-la explicitamente como escriba ou anjo.
- source_word: ዘይትሐጐል
  choice: era destruído
  rationale: Expressa o valor passivo ligado a perecer ou ser destruído e conserva a linguagem de juízo da visão.
- source_word: በኵሉ ዕለት
  choice: dia após dia
  rationale: Comunica a continuidade e o caráter minucioso do registro.
- source_word: ያዓርግ
  choice: levava o livro para o alto
  rationale: A forma causativa indica fazer subir ou levar para cima, e não simplesmente subir; «o livro» explicita em português o objeto apresentado na sequência.
- source_word: ያዓርፍ
  choice: depositava-o
  rationale: Mantém a ação concreta de colocar ou assentar o registro, sem reduzi-la apenas à ideia abstrata de apresentá-lo.
- source_word: መጽሐፈ
  choice: livro
  rationale: Traduz o objeto explicitamente mencionado no texto etíope e preserva a imagem do registro celestial.
- source_word: ለእግዚአ አባግዕ
  choice: ao Senhor das ovelhas
  rationale: Conserva literalmente o título divino próprio da alegoria animal.
- source_word: ዘአእተተ
  choice: havia retirado
  rationale: A forma é lexicalmente difícil; «retirado» preserva a noção provável de remoção sem especificar indevidamente morte, roubo ou desaparecimento.
- source_word: ለሐጕል
  choice: à destruição
  rationale: Mantém a formulação nominal e a força judicial da conclusão.
theological_decisions:
- issue: Identidade daquele que escreve
  choice: Uma figura celestial definida apenas por sua atividade de registrar e apresentar o livro
  alternative: Um escriba celestial nomeado, um anjo em geral ou o próprio Enoque
  rationale: O versículo distingue essa figura por suas ações, mas não lhe dá título nem identidade explícita; a tradução não vai além do texto.
- issue: Sentido de «Senhor das ovelhas»
  choice: Manter o título alegórico como designação de Deus
  alternative: Substituir por «Deus» ou entender apenas como um senhor humano dentro do sonho
  rationale: O título pertence à linguagem da alegoria animal e comunica ao mesmo tempo posse, governo e juízo divinos.
- issue: Cena do livro apresentado
  choice: Preservar as ações concretas de levar para o alto, depositar e mostrar
  alternative: Resumir a sequência como uma simples prestação de contas
  rationale: A sequência sustenta a imagem apocalíptica de um registro apresentado na corte celestial e não deve ser achatada em prosa genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe longa do original foi dividida em duas frases, mas a enumeração judicial foi mantida. Evitaram-se «escriba» e «corte celestial» no corpo do versículo para não acrescentar identificações ou cenários além do que o texto afirma diretamente.
