  naturalness: O português é atual e claro. «Enquanto os olhos das ovelhas estavam cegos» é compreensível, mas «enquanto estavam com os olhos cegos» é mais idiomático e fluente, sem alterar o caráter circunstancial da frase.
  terminology: «Ovelha/ovelhas», «caminho», «rocha» e «não soube disso» mantêm adequadamente a linguagem figurativa e não acrescentam juízo de negligência. A nota sobre a rocha preserva de modo apropriado a amplitude lexical de ድማኅ.
