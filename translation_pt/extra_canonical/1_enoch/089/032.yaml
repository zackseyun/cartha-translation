base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/032.yaml
  text: And that sheep that led them returned and went up upon that rock[a]; and the sheep, while their eyes were blinded, went astray from the path that he had shown them[b], but that sheep did not know it.
translation:
  language: pt
  text: E aquela ovelha que os guiava voltou e subiu sobre aquela rocha[a]. Enquanto estavam com os olhos cegos[b], as ovelhas se desviaram do caminho que ela lhes havia mostrado, mas aquela ovelha não soube disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre aquela elevação rochosa” ou “sobre aquele penhasco”; o termo ge’ez pode designar uma elevação de rocha, e não apenas uma pedra isolada.
    reason: lexical_alternative
  - marker: b
    text: Ou “enquanto os olhos delas estavam sendo cegados”.
    reason: previous_rendering
lexical_decisions:
- source_word: ገብአ
  choice: voltou
  rationale: Embora o verbo possa significar “veio” ou “entrou”, a sequência narrativa indica o retorno da ovelha depois de guiar as demais.
- source_word: በግዕ / አባግዕ
  choice: ovelha / ovelhas
  rationale: Mantém de modo direto a imagem ovina do Apocalipse dos Animais, sem especificar sexo ou idade que o texto não marca.
- source_word: ዘይመርሖሙ
  choice: que os guiava
  rationale: Expressa o papel contínuo de condução atribuído à ovelha e preserva a imagem concreta do percurso.
- source_word: ዐርገ
  choice: subiu
  rationale: Reproduz de forma natural o movimento ascendente sem acrescentar a ideia específica de escalada.
- source_word: በድማኅ
  choice: àquela rocha
  rationale: “Rocha” conserva a imagem concreta, embora o termo também possa designar uma elevação rochosa.
- source_word: እንዘ ይጸልሉ አዕይንቲሆሙ
  choice: enquanto os olhos das ovelhas estavam cegos
  rationale: Apresenta a cegueira como condição concomitante, evitando sugerir de modo indevido um agente que as estivesse cegando naquele instante.
- source_word: ይስሕቱ እምፍኖት
  choice: se desviaram do caminho
  rationale: Preserva tanto o sentido espacial quanto a força simbólica do afastamento da rota indicada.
- source_word: እንተ አርአዮሙ
  choice: que ela lhes havia mostrado
  rationale: A forma causativa é vertida como “mostrado”; o pronome feminino retoma naturalmente “ovelha” em português.
- source_word: ኢያእመረ
  choice: não soube disso
  rationale: Mantém a simples falta de conhecimento ou percepção, sem transformá-la em descuido deliberado.
theological_decisions:
- issue: Se a ignorância da ovelha-guia deve ser interpretada como negligência
  choice: “aquela ovelha não soube disso”
  alternative: “aquela ovelha não percebeu” ou “não deu atenção”
  rationale: O ge’ez afirma falta de conhecimento, não necessariamente desatenção culpável; a formulação escolhida preserva a tensão narrativa sem impor juízo moral adicional.
- issue: Se a cegueira deve ser apresentada como ação externa em curso ou como estado
  choice: “os olhos das ovelhas estavam cegos”
  alternative: “os olhos das ovelhas estavam sendo cegados”
  rationale: A construção circunstancial permite um estado concomitante. A opção evita introduzir um agente externo não explicitado, enquanto a nota registra a alternativa gramatical.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe clara. A repetição de “ovelha” foi preservada por fazer parte da estrutura simbólica do texto. O gênero gramatical feminino exige “ela” para retomar a ovelha-guia, sem afirmar sexo biológico.
