base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/061.yaml
  text: And he called to another and said to him[a], “Take note and see all that the shepherds are doing to these sheep[c][b]; for they are destroying among them more than I commanded them.”
translation:
  language: pt
  text: 'Então ele chamou outro e lhe disse: “Preste atenção[a] e veja tudo o que os pastores estão fazendo contra estas ovelhas[b], pois estão fazendo perecer mais ovelhas do rebanho do que eu lhes ordenei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ponha isso no coração”. O imperativo transmite a ideia de voltar a mente ou o coração para uma observação cuidadosa.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “sobre estas ovelhas”; no contexto, a expressão pode ter sentido adversativo: “contra estas ovelhas”.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ለካልእ
  choice: outro
  rationale: ካልእ designa outra figura sem especificar sua identidade; “outro” preserva essa indefinição e a sequência narrativa.
- source_word: ለቡ
  choice: Preste atenção
  rationale: O imperativo remete a dirigir o coração ou a mente para algo; a expressão portuguesa comunica atenção cuidadosa com naturalidade.
- source_word: ወርኢ
  choice: e veja
  rationale: Mantém concreto o verbo de visão e o caráter testemunhal da ordem.
- source_word: ኖሎት
  choice: os pastores
  rationale: Preserva a metáfora estabelecida do Apocalipse dos Animais sem introduzir conotação eclesiástica específica.
- source_word: ዲበ እሉ አባግዕ
  choice: contra estas ovelhas
  rationale: Embora ዲበ possa ter valor espacial (“sobre”), o contexto destrutivo favorece a força adversativa; a nota conserva a alternativa mais literal.
- source_word: ያሐጕሉ
  choice: estão fazendo perecer
  rationale: Expressa a ação destrutiva sem restringi-la necessariamente a uma forma específica de matança.
- source_word: እምውስተቶሙ
  choice: dentre elas
  rationale: 'A combinação de “desde/de” com “no meio” tem força partitiva: membros do rebanho são feitos perecer dentre o próprio conjunto.'
- source_word: ፈድፋደ እምዘ አዘዝክዎሙ
  choice: mais do que eu lhes ordenei
  rationale: Preserva tanto a autoridade da ordem quanto o excesso culpável dos pastores, sem eliminar a tensão de que alguma medida destrutiva lhes fora permitida.
theological_decisions:
- issue: Natureza da transgressão dos pastores
  choice: Os pastores ultrapassam a medida da ação destrutiva que lhes foi ordenada.
  alternative: Os pastores apenas negligenciam seu dever, ou a comparação é somente numérica e sem censura moral.
  rationale: O verbo destrutivo unido a “mais do que eu lhes ordenei” indica excesso culpável. A tradução mantém, sem explicar ou suavizar, a tensão de que havia uma ordem limitada que eles excederam.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção “fazendo perecer” conserva a amplitude do verbo etíope e permite que “dentre elas” mantenha sua força partitiva sem produzir uma frase artificial.
