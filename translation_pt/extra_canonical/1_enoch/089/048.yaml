base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/048.yaml
  text: And afterward that ram arose and led the sheep[a]; and that ram fathered many sheep and lay down. And a little sheep became a ram in its place[d][c][b], and it became ruler and leader of those sheep.
translation:
  language: pt
  text: E aquele carneiro que veio depois se levantou e conduziu as ovelhas; esse carneiro gerou muitas ovelhas e se deitou.[a] Então uma ovelha pequena[b] tornou-se carneiro em seu lugar e passou a ser governante e líder daquelas ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Se deitou” provavelmente funciona, nesta visão, como imagem da morte do carneiro; o texto principal conserva a expressão literal.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma ovelha jovem”. O adjetivo pode indicar tanto tamanho pequeno quanto pouca idade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳሓራዊ
  choice: que veio depois
  rationale: O adjetivo qualifica o carneiro como posterior, em contraste com o carneiro anterior; a formulação evita tratá-lo como mero advérbio temporal e soa natural em português.
- source_word: ሐርጌ
  choice: carneiro
  rationale: Mantém a distinção simbólica do macho que exerce liderança na visão dos animais.
- source_word: ተንሥአ
  choice: se levantou
  rationale: Reproduz o verbo narrativo de erguer-se sem acrescentar interpretação.
- source_word: መርሖሙ
  choice: conduziu
  rationale: Expressa a ação de guiar as ovelhas e preserva a possível dimensão pastoral e política.
- source_word: አባግዕ
  choice: ovelhas
  rationale: Conserva o referente animal concreto da alegoria, sem substituí-lo pelo coletivo “rebanho”.
- source_word: ወሊደ
  choice: gerou
  rationale: Mantém o sentido procriador explícito do verbo e a relação do sujeito masculino com sua descendência.
- source_word: ብዙኃነ
  choice: muitas
  rationale: Equivalente quantitativo direto e corrente.
- source_word: ሰከበ
  choice: se deitou
  rationale: Preserva literalmente a imagem visionária, embora no contexto ela provavelmente indique a morte.
- source_word: በግዕ ንኡስ
  choice: uma ovelha pequena
  rationale: Mantém a imagem e a ambiguidade entre tamanho reduzido e pouca idade; a alternativa “jovem” é indicada em nota.
- source_word: ህየንቴሁ
  choice: em seu lugar
  rationale: Expressa substituição ou sucessão sem explicitar uma interpretação histórica.
- source_word: መኰንነ
  choice: governante
  rationale: Indica autoridade de modo amplo, sem importar um título político ou religioso técnico.
- source_word: መራሔ
  choice: líder
  rationale: Designa a função de liderança sem forçar o termo a significar “pastor”, imagem não explicitada pelo substantivo neste ponto.
theological_decisions:
- issue: Se a sucessão deve ser apresentada em termos políticos ou históricos explícitos
  choice: uma ovelha pequena tornou-se carneiro em seu lugar
  alternative: uma ovelha jovem tornou-se carneiro como seu sucessor
  rationale: A passagem representa a sucessão por meio da transformação animal. A tradução conserva a forma simbólica e não identifica diretamente as personagens históricas.
- issue: Se “se deitou” deve ser traduzido diretamente como morte
  choice: se deitou
  alternative: morreu
  rationale: Embora a expressão provavelmente funcione como imagem da morte na visão, o texto principal mantém a formulação concreta e deixa a implicação em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A abertura trata ዳሓራዊ como qualificador do carneiro (“que veio depois”), não como simples marcador adverbial. O adjetivo singular entre colchetes após o primeiro plural “ovelhas” foi omitido por ser uma provável interpolação gramaticalmente discordante. A repetição semítica de “tornou-se/passou a ser” foi levemente acomodada sem eliminar a progressão entre carneiro, governante e líder.
