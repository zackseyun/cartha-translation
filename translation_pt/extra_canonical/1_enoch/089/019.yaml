base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/019.yaml
  text: And from it I saw the wolves[a], and they became exceedingly strong against the sheep with all their power[c][b], and the sheep cried out.
translation:
  language: pt
  text: E dali[a] vi os lobos, e eles se tornaram extremamente fortes contra as ovelhas, com toda a sua força, e as ovelhas clamaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dele” ou “disso”; o sufixo pronominal permite mais de uma referência, que depende do contexto mais amplo da visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: dali
  rationale: A preposição እም com sufixo pronominal pode significar “dele”, “disso” ou, conforme o contexto, “dali”. “Dali” mantém aberta a referência do antecedente e soa natural em português.
- source_word: ርኢክዎሙ
  choice: vi
  rationale: Forma direta e corrente para o relato visionário em primeira pessoa.
- source_word: አዝእብት
  choice: os lobos
  rationale: O termo é plural de “lobo”; esta tradução preserva corretamente o código animal da visão.
- source_word: አፎ
  choice: e eles
  rationale: Embora አፎ possa introduzir a maneira (“como”), em português a oração coordenada “e eles se tornaram” transmite diretamente o conteúdo visto, de acordo com a estrutura verbal do contexto.
- source_word: ጸንዑ
  choice: se tornaram fortes
  rationale: Expressa o fortalecimento ou a aquisição de firmeza, sem introduzir a ideia distinta de vitória.
- source_word: ፈድፋደ
  choice: extremamente
  rationale: O advérbio intensifica ጸንዑ; não constitui um segundo verbo com o sentido de multiplicar-se.
- source_word: ዲበ አባግዕ
  choice: contra as ovelhas
  rationale: Embora ዲበ tenha sentido espacial básico de “sobre”, o contexto hostil dos lobos favorece “contra”.
- source_word: በኵሉ ኃይሎሙ
  choice: com toda a sua força
  rationale: Mantém a totalidade e a intensidade da força hostil. O singular coletivo é idiomático em português.
- source_word: አባግዕ ጸርኁ
  choice: as ovelhas clamaram
  rationale: “Clamaram” comunica um grito alto e urgente sem decidir se se trata especificamente de lamento, alarme ou pedido de socorro.
theological_decisions:
- issue: Imagens animais simbólicas no Apocalipse dos Animais
  choice: Manter “lobos” e “ovelhas” como imagens concretas
  alternative: Interpretar diretamente os animais como povos, governantes ou Israel
  rationale: O texto relata a visão em linguagem alegórica; a tradução deve preservar suas imagens sem impor no corpo do texto uma identificação histórica ou doutrinária.
- issue: Natureza do clamor das ovelhas
  choice: Usar “clamaram” sem explicitar o destinatário ou a finalidade
  alternative: “pediram socorro”, “lamentaram” ou “clamaram a Deus”
  rationale: O verbo indica um grito, mas este versículo isolado não define inequivocamente sua função nem seu destinatário.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem narrativa e a repetição de “ovelhas” foram preservadas para manter o estilo visionário e a clareza simbólica.
