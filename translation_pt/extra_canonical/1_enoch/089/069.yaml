base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/069.yaml
  text: And beyond their prescribed measure they kept killing and destroying[d][c][b][a], and I was weeping and crying out because of those sheep.
translation:
  language: pt
  text: E, ultrapassando a medida que lhes fora prescrita[a], continuavam matando e destruindo; e eu chorava e clamava por causa daquelas ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ultrapassando a ordem que lhes fora determinada” ou “a quantidade que lhes fora fixada”. O termo ge''ez pode indicar ordem, norma, disposição ou medida prescrita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈድፋደ እምሥርዓቶሙ
  choice: ultrapassando a medida que lhes fora prescrita
  rationale: ፈድፋደ com እም expressa excesso, enquanto ሥርዓት pode indicar ordem, norma, disposição ou medida determinada. A formulação preserva tanto a ideia de excesso quanto o caráter previamente fixado do limite.
- source_word: ይቀትል
  choice: continuavam matando
  rationale: O imperfeito no relato visionário admite sentido durativo ou reiterado; a escolha comunica a continuidade da matança.
- source_word: ያሐጕል
  choice: destruindo
  rationale: O verbo denota ruína ou tratamento destrutivo. “Destruindo” conserva a amplitude sem alegar precisão maior que a permitida pelo testemunho textual.
- source_word: እንዘ እብኪ ወአዐውዩ
  choice: eu chorava e clamava
  rationale: O texto, apesar da forma OCR እንዝኩ, corresponde a እንዘ introduzindo verbos de ação concomitante e contínua; não contém verbo com o sentido de dormir.
- source_word: አባግዕ
  choice: ovelhas
  rationale: Mantém a imagem animal própria da visão, sem substituir seu possível referente simbólico no corpo da tradução.
theological_decisions:
- issue: Identificação simbólica das ovelhas
  choice: Manter “ovelhas”
  alternative: Explicitar “Israel”, “Judá” ou “aquele povo”
  rationale: A tradução preserva a linguagem da visão apocalíptica e não resolve no texto principal a identificação interpretativa do símbolo.
- issue: Natureza do limite transgredido pelos pastores
  choice: “medida que lhes fora prescrita”
  alternative: “número deles” ou “ordem que lhes fora dada”
  rationale: A escolha conserva a noção de limite autorizado sem determinar se ሥርዓት se refere estritamente a uma quantidade numérica ou, de modo mais amplo, a uma ordem estabelecida.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. O aspecto contínuo foi expresso por “continuavam matando” e pelos imperfeitos “chorava e clamava”. O ponto e vírgula separa com clareza a violência observada da reação do visionário.
