base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/040.yaml
  text: And I saw the sheep until they entered into a good place[a], and into a pleasant and glorious land; and I saw until the sheep were satisfied[c][b], and that house was in their midst in the pleasant land.
translation:
  language: pt
  text: E vi as ovelhas até entrarem num bom lugar, numa terra agradável e gloriosa; e vi até que as ovelhas ficaram satisfeitas, e aquela casa[a] estava no meio delas, na terra agradável.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “casa” pode representar o santuário ou o templo dentro do simbolismo da visão.
    reason: lexical_alternative
  - marker: b
    text: A expressão “terra agradável” se repete no fim do versículo em ge'ez, reforçando o cenário restaurado e abençoado.
    reason: cross_reference
lexical_decisions:
- source_word: አባግዕ
  choice: ovelhas
  rationale: Mantém literalmente a imagem animal sustentada ao longo do Apocalipse dos Animais, sem antecipar a identificação simbólica.
- source_word: መካን ሠናይ
  choice: um bom lugar
  rationale: Reproduz diretamente o substantivo 'lugar' e o sentido amplo de 'bom/belo', sem especificar além do ge'ez.
- source_word: ምድር ኃዋዝ
  choice: terra agradável
  rationale: Trata ኃዋዝ como adjetivo de 'terra', conforme a sintaxe, e conserva a repetição da expressão no fim do versículo.
- source_word: ስብሕት
  choice: gloriosa
  rationale: O adjetivo concorda com 'terra' e preserva o sentido elevado de glória ou esplendor.
- source_word: ጸግቡ
  choice: ficaram satisfeitas
  rationale: Expressa o estado de plenitude ou saciedade sem restringi-lo explicitamente à alimentação.
- source_word: ቤት
  choice: casa
  rationale: Preserva a designação concreta da visão; 'templo' seria uma identificação interpretativa possível, mas não explícita no termo.
- source_word: ማእከሎሙ
  choice: no meio delas
  rationale: Comunica com naturalidade tanto a localização central quanto a presença entre as ovelhas.
theological_decisions:
- issue: Identificação da 'casa' com o santuário ou templo
  choice: Manter 'casa' no texto principal
  alternative: Traduzir diretamente como 'templo' ou 'santuário'
  rationale: Embora a casa possa simbolizar o santuário ou templo, o texto da visão emprega o termo comum para 'casa'. A tradução conserva a imagem e deixa a identificação para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A construção proléptica do ge'ez foi preservada de modo natural em 'vi as ovelhas até entrarem'. 'Continuei olhando' torna idiomática a repetição de 'vi até' sem apagar o aspecto continuativo da visão. Todos os marcadores de nota aparecem no texto principal.
