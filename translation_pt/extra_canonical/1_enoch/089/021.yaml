base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/021.yaml
  text: And I saw the sheep until they came out from the wolves[a]; and the eyes of the wolves were blinded[b], and those wolves went out following the sheep with all their power.
translation:
  language: pt
  text: E vi as ovelhas, até que saíram do meio dos lobos[a]; os olhos dos lobos ficaram cegos[b], e aqueles lobos saíram seguindo as ovelhas com toda a sua força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pelo contexto, o sujeito de “saíram seguindo” é mais provavelmente “aqueles lobos”. Contudo, a sequência compacta do ge'ez permite uma leitura menos explícita, como uma cena contínua de movimento envolvendo os dois grupos.
    reason: alternative_reading
  - marker: b
    text: 'Outra tradução, baseada numa análise anterior da construção, seria: “as ovelhas, até que saíram do meio dos lobos; e os lobos cegaram os olhos delas, e saíram seguindo aquelas ovelhas”. A forma verbal ge''ez, porém, favorece a leitura passiva ou intransitiva: “os olhos dos lobos ficaram cegos”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: E vi
  rationale: Mantém a fórmula narrativa visionária na primeira pessoa, de maneira direta e natural em português.
- source_word: ለአባግዕ
  choice: as ovelhas
  rationale: Preserva a imagem simbólica contínua do Apocalipse dos Animais sem acrescentar uma identificação interpretativa.
- source_word: እስከ ወፁኡ እምአዝእብት
  choice: até que saíram do meio dos lobos
  rationale: Expressa a saída da esfera ou presença dos lobos; “do meio de” é idiomático em português e explicita adequadamente a relação marcada pela preposição ge'ez.
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: os olhos dos lobos ficaram cegos
  rationale: Respeita o valor passivo/intransitivo da forma verbal e conserva a imagem concreta de cegueira, sem convertê-la em uma explicação abstrata como “foram enganados”.
- source_word: ወወፁኡ እንዘ ይትልውዎሙ
  choice: saíram seguindo
  rationale: Reproduz tanto o movimento de saída quanto a ação simultânea de seguir, sem intensificar interpretativamente o verbo para “perseguir”.
- source_word: ዝኩ አዝእብት
  choice: aqueles lobos
  rationale: Retém a força demonstrativa e torna explícito o sujeito da oração final.
- source_word: በኵሉ ኃይሎሙ
  choice: com toda a sua força
  rationale: Conserva a ideia de emprego total da força dos lobos em linguagem portuguesa corrente e digna.
theological_decisions:
- issue: Se a cegueira dos olhos deve permanecer como imagem visionária concreta ou ser explicada como engano
  choice: Conservar “os olhos dos lobos ficaram cegos”
  alternative: Traduzir interpretativamente como “os lobos foram enganados” ou “ficaram desorientados”
  rationale: A visão comunica realidades por imagens animais concretas. Preservar a cegueira mantém o caráter apocalíptico e evita impor uma interpretação teológica específica.
- issue: Se o ato dos lobos deve ser caracterizado explicitamente como perseguição hostil
  choice: Traduzir ይትልውዎሙ por “seguindo”
  alternative: “perseguindo”
  rationale: “Seguindo” corresponde mais diretamente ao verbo e preserva a possibilidade de o contexto comunicar a hostilidade sem inseri-la no próprio termo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A repetição de “lobos” e “ovelhas” foi mantida por clareza referencial e fidelidade ao estilo visionário. A pontuação conserva o fluxo encadeado do relato sem produzir uma frase excessivamente opaca.
