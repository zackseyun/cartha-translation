base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/009.yaml
  text: And that white bull[a], which had become a man, went out from that enclosure, and with him came three bulls. And one of those three bulls was white, resembling that white bull, and one of them was red like blood, and one was black[c][b]; and that white bull departed from among them.
translation:
  language: pt
  text: E aquele touro branco, que se tornara homem, saiu daquela embarcação[a], e com ele vieram três touros. Um desses três touros era branco e se parecia com aquele touro branco; um deles era vermelho como sangue, e outro era preto. Então aquele touro branco afastou-se do meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra correspondente está corrompida ou foi transcrita de modo incerto. O contexto favorece “embarcação”, isto é, a arca; também se propôs “recinto”.
    reason: textual_variant
lexical_decisions:
- source_word: ላህም
  choice: touro
  rationale: Mantém a figura bovina masculina recorrente na visão e é mais específica do que “animal bovino” ou “gado”.
- source_word: ጸዐዳ
  choice: branco
  rationale: Traduz diretamente o termo de cor e preserva o contraste simbólico entre os animais.
- source_word: ዘኮነ ብእሴ
  choice: que se tornara homem
  rationale: Expressa a transformação e situa sua ocorrência antes da saída narrada, sem explicar a identidade da figura.
- source_word: ወጽአ እምዝኩ መስቀር
  choice: saiu daquela embarcação
  rationale: A forma final da transcrição é problemática, mas a correção textual para መርከብ, apoiada pelo contexto imediato da narrativa, indica uma embarcação. A nota registra a incerteza sem ocultá-la.
- source_word: ፪አልህምት
  choice: três touros
  rationale: O número esperado pela construção subsequente e pela sequência narrativa é três; a representação numérica da transcrição parece corrompida.
- source_word: ጸዐዳ ይመስሎ ለዝኩ ላህም
  choice: era branco e se parecia com aquele touro branco
  rationale: Mantém tanto a predicação explícita da cor do primeiro dos três touros quanto a afirmação separada de sua semelhança com o touro anterior.
- source_word: ቀይሕ ከመ ደም
  choice: vermelho como sangue
  rationale: Conserva a comparação explícita e vívida do texto.
- source_word: ጸሊም
  choice: preto
  rationale: Traduz diretamente o termo de cor e preserva o contraste com branco e vermelho.
- source_word: ኀለፈ እምኔሆሙ
  choice: afastou-se do meio deles
  rationale: Comunica separação ou partida sem dar ao verbo o sentido mais específico de morte.
theological_decisions:
- issue: Identidade do touro branco que se tornou homem e dos três touros
  choice: Preservar as figuras animais e a transformação tal como aparecem na visão, sem identificá-las no texto.
  alternative: Substituir ou explicar as figuras como Noé e seus filhos, ou vinculá-las nominalmente a personagens patriarcais.
  rationale: A passagem apresenta uma narrativa apocalíptica simbólica; explicitar identidades resolveria no corpo da tradução aquilo que o próprio versículo deixa em linguagem visionária.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e vocabulário acessível. “Touro” mantém a força da imagem apocalíptica; a repetição de “touro branco” foi conservada para clareza referencial e fidelidade ao simbolismo das cores.
