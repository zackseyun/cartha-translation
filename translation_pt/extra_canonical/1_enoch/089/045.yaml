base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/045.yaml
  text: And the Lord of the sheep sent a sheep to another sheep[a], and raised him up so that he might become a ram and might lead the sheep in place of that ram[c][b], which had abandoned his glory.
translation:
  language: pt
  text: E o Senhor das ovelhas enviou uma ovelha a outra ovelha e a levantou, para que se tornasse um carneiro e conduzisse as ovelhas no lugar daquele carneiro que havia abandonado a sua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a sua honra” ou “o seu esplendor”. O termo pode indicar a posição e a dignidade do carneiro, e não apenas brilho visível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: o Senhor das ovelhas
  rationale: Preserva o título elevado e explicita o grupo regido, conforme a construção e o contexto da Apocalipse dos Animais.
- source_word: በግዕ ... ካልእ በግዕ
  choice: uma ovelha a outra ovelha
  rationale: O substantivo singular designa ovelha; esta tradução mantém a continuidade da alegoria e não introduz a ideia de idade implicada por “cordeiro”.
- source_word: አንሥአ
  choice: a levantou
  rationale: Conserva tanto a imagem concreta de elevação quanto a promoção de condição, sem reduzi-la interpretativamente a uma nomeação.
- source_word: ከመ ይኩን ሐርጌ
  choice: para que se tornasse um carneiro
  rationale: Expressa a mudança de condição dentro do simbolismo animal; “carneiro” distingue o líder das demais ovelhas.
- source_word: ይመርሖሙ ለአባግዕ
  choice: conduzisse as ovelhas
  rationale: Traduz naturalmente a ação de guiar ou liderar, preservando simultaneamente as dimensões pastoral e política.
- source_word: ህየንተ ዝኩ ሐርጌ
  choice: no lugar daquele carneiro
  rationale: Indica sucessão ou substituição sem explicar além do que a expressão afirma.
- source_word: ዘሐደገ ስብሐቲሁ
  choice: que havia abandonado a sua glória
  rationale: “Glória” mantém a amplitude semântica e a ressonância apocalíptica do termo, enquanto “abandonado” comunica a ação deliberada sugerida pelo verbo.
theological_decisions:
- issue: Identidade e função do animal elevado
  choice: Manter a figura como uma ovelha que se torna carneiro.
  alternative: Traduzir a ovelha como “cordeiro” ou substituir “carneiro” por “líder”.
  rationale: A visão comunica por meio de um código animal contínuo. A tradução concreta preserva a distinção simbólica sem impor uma identificação ou interpretação externa.
- issue: Sentido de ስብሐቲሁ na oração final
  choice: Traduzir por “a sua glória”.
  alternative: “a sua honra” ou “o seu esplendor”.
  rationale: “Glória” preserva a tensão entre dignidade, posição e esplendor; a nota registra alternativas legítimas sem decidir qual nuance domina.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. A repetição de “ovelha(s)” e “carneiro” foi mantida por ser estrutural à alegoria. O marcador [a] aparece no texto principal junto à expressão anotada.
