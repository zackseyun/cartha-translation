base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/023.yaml
  text: And the wolves began to pursue those sheep until they overtook them at a spring of water[a][b].
translation:
  language: pt
  text: E os lobos começaram a perseguir aquelas ovelhas, até alcançá-las junto a uma nascente de água[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até alcançá-las junto a um reservatório de água”. O termo ge’ez pode designar uma nascente, um poço ou outro lugar onde há água.'
    reason: lexical_alternative
  - marker: b
    text: 'Uma tradução anterior dizia: “até as empurrarem para dentro de um reservatório de água”; porém, o verbo significa “alcançar”, e a preposição indica localização (“junto a” ou “em”), não movimento para dentro.'
    reason: previous_rendering
lexical_decisions:
- source_word: አዝእብት
  choice: os lobos
  rationale: Mantém a espécie animal concreta do texto e a imagética contínua do Apocalipse dos Animais, sem interpretar o símbolo historicamente no corpo do versículo.
- source_word: አሐዙ
  choice: começaram
  rationale: 'Antes da ação verbal seguinte, a forma tem valor incoativo: indica o início da perseguição.'
- source_word: ይትልውዎሙ
  choice: a perseguir
  rationale: O contexto predatório exige uma ação hostil e continuada; “perseguir” é mais preciso que o neutro “seguir”.
- source_word: ዝኩ አባግዕት
  choice: aquelas ovelhas
  rationale: Preserva o demonstrativo que retoma o grupo específico já presente na narrativa visionária.
- source_word: እስክ ተረክብዎሙ
  choice: até alcançá-las
  rationale: O verbo ረከበ exprime encontrar, alcançar ou chegar até; aqui, como resultado de uma perseguição, “alcançar” é natural e não introduz o sentido causativo indevido de “empurrar”.
- source_word: በአሐቲ ዐይገ ማይ
  choice: junto a uma nascente de água
  rationale: A preposição indica localização, não movimento para dentro. “Nascente de água” representa a leitura lexical principal de ዐይገ, mantendo em nota a possibilidade de um reservatório ou poço de água.
theological_decisions:
- issue: Simbolismo animal nas Visões dos Sonhos
  choice: Manter literalmente lobos e ovelhas no texto principal.
  alternative: Substituir os animais pelos grupos humanos ou históricos que eles possam representar.
  rationale: A visão comunica seu sentido por meio de uma alegoria animal contínua. Decodificar os símbolos na tradução eliminaria a forma literária e resolveria interpretativamente algo que o texto apresenta como imagem.
- issue: Relação das ovelhas com a água
  choice: Os lobos alcançam as ovelhas junto à água.
  alternative: Os lobos conduzem ou empurram as ovelhas para dentro da água.
  rationale: O verbo indica alcançar, e a preposição marca localização. Esta formulação também preserva a sequência narrativa, sem antecipar uma entrada na água.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “até alcançá-las” evita repetição pronominal pesada e conserva a progressão da perseguição. As notas registram a incerteza lexical real sem enfraquecer o texto principal.
