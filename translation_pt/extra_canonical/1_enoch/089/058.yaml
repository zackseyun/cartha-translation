base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/058.yaml
  text: And he kept still as he watched[a], and he rejoiced because they were devoured and swallowed up and carried off[c][b]; and he abandoned them into the hand of all the beasts for food.
translation:
  language: pt
  text: E ele permaneceu em silêncio enquanto observava e se alegrou porque elas foram devoradas, engolidas e levadas à força[a]; e as abandonou nas mãos de todos os animais selvagens, para servirem de alimento.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arrebatadas” ou “carregadas para longe”. O último verbo indica que foram tomadas e levadas à força, não apenas destruídas.'
    reason: lexical_alternative
  - marker: b
    text: “Nas mãos” é uma expressão que significa ficar sob o poder ou controle de alguém.
    reason: idiom_explanation
lexical_decisions:
- source_word: አርመመ
  choice: permaneceu em silêncio
  rationale: Expressa silêncio ou quietude deliberada e mantém a força narrativa sem restringir o sentido à mera ausência de fala.
- source_word: እንዘ ይሬኢ
  choice: enquanto observava
  rationale: A construção indica ação simultânea; esta formulação é natural em português e adequada ao relato visionário.
- source_word: ተፈሥሐ
  choice: se alegrou
  rationale: Verte diretamente a ideia de alegria, preservando o tom elevado da narrativa apocalíptica.
- source_word: ተበልዑ
  choice: foram devoradas
  rationale: Conserva a imagem violenta de predação própria da alegoria dos animais.
- source_word: ተውሕጡ
  choice: engolidas
  rationale: Mantém o segundo elemento da sequência cumulativa de predação sem tornar a expressão artificial em português.
- source_word: ተሀይዱ
  choice: levadas à força
  rationale: Reflete o sentido específico de serem arrebatadas, tomadas ou carregadas à força, em vez de reduzir o verbo ao resultado genérico de destruição.
- source_word: ኃደጎሙ
  choice: as abandonou
  rationale: Preserva o ato severo de deixá-las expostas, sem importar a fórmula teológica mais específica 'entregou-as'.
- source_word: ውስተ እዴ
  choice: nas mãos
  rationale: Mantém o idioma semítico de poder ou controle numa expressão bíblica ainda natural em português.
- source_word: ኵሎሙ አራዊት
  choice: todos os animais selvagens
  rationale: Distingue os predadores das ovelhas dentro da alegoria e evita que 'feras' soe excessivamente arcaico.
- source_word: ለመብልዕ
  choice: para lhes servirem de alimento
  rationale: Explicita naturalmente em português a finalidade ou o resultado de serem deixadas sob o poder dos animais.
theological_decisions:
- issue: Se o abandono pelo agente deve soar como entrega judicial ativa ou como retirada que as deixa expostas
  choice: as abandonou nas mãos de todos os animais selvagens
  alternative: entregou-as ao poder de todos os animais selvagens
  rationale: O ge'ez sustenta um ato forte de deixá-las expostas ao juízo. 'Abandonou' conserva essa severidade sem introduzir uma fórmula teológica posterior que o texto não exige.
- issue: Se a sequência de três verbos deve ser condensada em uma única ideia de destruição
  choice: devoradas, engolidas e levadas à força
  alternative: devoradas e destruídas
  rationale: A sequência tríplice preserva a intensificação e a imagética predatória do texto, inclusive o sentido distintivo do último verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a repetição cumulativa e a imagem de predação, evitando tanto arcaísmos desnecessários quanto linguagem teológica mais específica do que o ge'ez.
