base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/037.yaml
  text: And I watched until that sheep lay down—the one that had met that sheep which led them—and I watched until all the great and small sheep were stirred up in their place[d][c][b][a], and they entered into the pasture and came near the stream of water.
translation:
  language: pt
  text: E observei até que aquela ovelha se deitou — a que havia encontrado a ovelha que os conduzia. E observei até que todas as ovelhas grandes pereceram, e as pequenas se levantaram em lugar delas[a]; então entraram na pastagem e se aproximaram da corrente de água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em vez delas”. O texto distingue as ovelhas grandes, que perecem, das pequenas, que se levantam no lugar delas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰከበ
  choice: se deitou
  rationale: O perfeito ativo significa “deitar-se” ou “jazer”; a tradução mantém a voz ativa e não explicita a possível alusão à morte.
- source_word: በግዕ
  choice: ovelha
  rationale: “Ovelha” é a designação ampla e coerente com o simbolismo animal do contexto.
- source_word: ዘተረክበ
  choice: havia encontrado
  rationale: Exprime de modo natural o encontro anterior que identifica a ovelha.
- source_word: ዘመርሖሙ
  choice: que os conduzia
  rationale: Preserva o sentido de guiar ou conduzir sem acrescentar a imagem interpretativa de pastorear.
- source_word: ተኃጕሉ
  choice: pereceram
  rationale: A leitura de ኀጕለ como “perecer, ser destruído” corresponde à forma e permite distinguir esta oração da seguinte.
- source_word: ተንሥኡ
  choice: se levantaram
  rationale: Traduz explicitamente o verbo “levantar-se, surgir”, evitando omiti-lo ou fundi-lo com a oração anterior.
- source_word: ህየንቴሆሙ
  choice: em lugar delas
  rationale: O sufixo plural retoma as ovelhas grandes; o sentido substitutivo é natural após “as pequenas se levantaram”.
- source_word: መርዔት
  choice: pastagem
  rationale: Designa um lugar de pasto e conserva a imagem animal com linguagem portuguesa corrente.
- source_word: ፈለገ ማይ
  choice: corrente de água
  rationale: Mantém a imagem concreta de um curso ou canal de água sem especificar indevidamente seu tamanho.
theological_decisions:
- issue: Se a ação da primeira ovelha deve ser explicitada como morte
  choice: se deitou
  alternative: morreu / foi morta
  rationale: A forma ge'ez é ativa e significa literalmente “deitou-se”; embora possa funcionar como eufemismo de morte no contexto, a tradução não resolve essa implicação no texto principal.
- issue: Relação entre as ovelhas grandes e pequenas
  choice: as grandes pereceram, e as pequenas se levantaram em lugar delas
  alternative: todas as ovelhas grandes e pequenas foram agitadas em seu lugar
  rationale: A sintaxe preserva duas orações, incluindo o verbo explícito ተንሥኡ, e mantém a tensão simbólica da substituição sem identificar historicamente as figuras.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção narrativa clara. Conserva-se a repetição visionária “E observei até que” e evita-se explicar o referente histórico das ovelhas.
