base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/022.yaml
  text: And the Lord of the sheep went with them as he led them[a], and all his sheep followed him[b]; and his face was glorious and splendid and terrible to behold.
translation:
  language: pt
  text: E o Senhor das ovelhas foi com elas, conduzindo-as, e todas as suas ovelhas o seguiram. Seu rosto era glorioso, esplêndido[a] e terrível de se contemplar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “majestoso”; o adjetivo ge'ez também pode expressar honra ou dignidade, além de magnificência visível.
    reason: lexical_alternative
  - marker: b
    text: “Terrível de se contemplar” expressa temor reverente e assombro, não maldade moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: o Senhor das ovelhas
  rationale: Preserva a relação genitiva, o registro teológico elevado e a imagem animal que estrutura a visão.
- source_word: ሖረ ምስሌሆሙ
  choice: foi com elas
  rationale: Expressa de modo direto o movimento e a companhia, sem acrescentar uma direção não indicada pelo texto.
- source_word: እንዘ ይመራሖሙ
  choice: conduzindo-as
  rationale: Reproduz a ação simultânea de guiar as ovelhas com formulação natural em português.
- source_word: ኵሎሙ አባግዒሁ
  choice: todas as suas ovelhas
  rationale: Mantém tanto o possessivo explícito quanto a imagem concreta das ovelhas.
- source_word: ተለውዎ
  choice: o seguiram
  rationale: Comunica com clareza o sentido relacional e direcional apropriado à cena.
- source_word: ገጹ
  choice: seu rosto
  rationale: Conserva o detalhe concreto e antropomórfico da visão, em vez de diluí-lo como mera aparência.
- source_word: ስቡሕ
  choice: glorioso
  rationale: Transmite honra e esplendor no contexto da descrição do rosto da figura soberana.
- source_word: ክቡር
  choice: esplêndido
  rationale: Distingue este segundo adjetivo de 'glorioso' e comunica magnificência; o campo semântico também admite 'majestoso'.
- source_word: ግሩም ለርእይ
  choice: terrível de se contemplar
  rationale: Preserva a combinação de temor e assombro própria da linguagem visionária, bem como a referência explícita ao ato de ver.
theological_decisions:
- issue: Identidade da figura que conduz as ovelhas no Apocalipse dos Animais
  choice: Senhor das ovelhas
  alternative: senhor delas; dono ou pastor das ovelhas
  rationale: A tradução mantém a identificação elevada da figura e, ao mesmo tempo, não desfaz em explicação direta o simbolismo animal da visão.
- issue: Sentido de 'terrível' na descrição do rosto
  choice: terrível de se contemplar
  alternative: temível de se contemplar; assombroso à vista
  rationale: Mantém a tensão entre majestade, temor e assombro numinoso sem atribuir maldade moral à figura.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com leitura natural no Brasil. A repetição concreta de “ovelhas” e a descrição visionária do rosto foram preservadas; “conduzindo-as” evita uma expansão interpretativa como “pastoreando-as”.
