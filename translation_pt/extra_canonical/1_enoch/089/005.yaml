  to: E todos os animais do rebanho que estavam naquele cercado se reuniram, até que eu os vi afundar, ser engolidos e perecer naquela água.[a]
  rationale: A revisão limita-se a explicitar o traço de rebanho contido no substantivo ge'ez e a preferir uma formulação mais corrente para a reunião dos animais. Mantêm-se a sintaxe imediata de «eu os vi», a tríade verbal, o singular «água» e a continuidade espacial de «cercado».
