base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/005.yaml
  text: And all the cattle in that enclosure were gathered together[a], until I saw them sink, and be swallowed up[d][c][b], and be destroyed in that water.
translation:
  language: pt
  text: E todos os animais do rebanho que estavam naquele cercado se reuniram, até que eu os vi afundar, ser engolidos e perecer naquela água.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ser destruídos». Os três verbos formam uma sequência intensificadora: eles afundam, são engolidos e perecem na água.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ አላህምት
  choice: todos os animais
  rationale: O substantivo designa animais de rebanho ou gado; no contexto da visão, «animais» preserva a imagem coletiva sem restringi-la indevidamente a bois.
- source_word: እለ ውእቱ ዐጸድ
  choice: que estavam naquele cercado
  rationale: A expressão identifica os animais associados ao mesmo ዐጸድ dos versículos anteriores. «Cercado» mantém a continuidade espacial da visão; o verbo «estavam» é suprido naturalmente em português.
- source_word: ተጋብኡ
  choice: se ajuntaram
  rationale: Expressa reunião coletiva com valor reflexivo ou passivo e conserva a cadência narrativa.
- source_word: እስክነ ርኢክዎሙ
  choice: até que eu os vi
  rationale: O sufixo objeto em ርኢክዎሙ exige «os vi»; os verbos seguintes funcionam como complementos do ato de ver.
- source_word: ይሠጠሙ
  choice: afundar
  rationale: Reproduz de modo direto a ideia de submersão na água.
- source_word: ይትወንጡ
  choice: ser engolidos
  rationale: Preserva a voz passiva e a imagem forte de serem tragados ou engolfados.
- source_word: ይትኃጐሉ
  choice: perecer
  rationale: Conclui a sequência de maneira climática e natural, preservando o sentido de destruição sem intensificação excessiva.
- source_word: በውእቱ ማይ
  choice: naquela água
  rationale: Mantém o demonstrativo e o singular explícitos no ge'ez.
theological_decisions:
- issue: Simbolismo animal nas Visões dos Sonhos
  choice: Manter a referência concreta aos animais, sem identificar no texto o grupo humano simbolizado.
  alternative: Traduzir interpretativamente como «pessoas» ou outro referente humano.
  rationale: A passagem comunica por meio de uma alegoria animal contínua; decodificá-la na tradução eliminaria deliberadamente o veículo simbólico.
- issue: Valor contextual de ዐጸድ
  choice: Traduzir como «cercado» para manter a continuidade espacial com os versículos anteriores.
  alternative: «campo» ou «pastagem»
  rationale: Embora o termo possa designar campo ou terreno, aqui ele retoma o espaço delimitado que se enche de água; «cercado» preserva melhor a coerência da cena sem interpretar seu significado teológico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe visual imediata («eu os vi afundar») e cadência apocalíptica discreta. «Se ajuntaram» é amplamente compreensível em português internacional e natural para leitores brasileiros.
