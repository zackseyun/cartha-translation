  - severity: low
    issue: «Se ajuntaram» é levemente menos idiomático no registro moderno geral.
    rationale: «Se reuniram» conserva o sentido coletivo/reflexivo e soa mais natural no português contemporâneo amplamente internacional.
  revised_text: E todos os animais do rebanho que estavam naquele cercado se reuniram, até que eu os vi afundar, ser engolidos e perecer naquela água.[a]
