base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/067.yaml
  text: And I grieved greatly because of the tower[a], for that house of the sheep had been torn down[e][d][c][b]; and from among them I was not able to see whether those sheep entered that house.
translation:
  language: pt
  text: E fiquei profundamente triste por causa do cercado[a], pois aquela casa das ovelhas havia sido demolida[b]; e, dentre elas, não consegui ver se aquelas ovelhas entravam naquela casa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez traz “cercado” ou “recinto”, não “torre”. A imagem passa de um cercado para a “casa das ovelhas”; por isso, as duas expressões foram mantidas.
    reason: lexical_alternative
  - marker: b
    text: Ou “havia sido arrasada” ou “derrubada”. O verbo pode descrever uma construção escavada, minada ou demolida.
    reason: lexical_alternative
  - marker: c
    text: A oração final é difícil. Também pode significar que o vidente não conseguia ver aquelas ovelhas — possivelmente quando ou se entrassem naquela casa —, em vez de não conseguir verificar se elas entravam.
    reason: alternative_reading
lexical_decisions:
- source_word: ወሐዘንኩ፡ ብዙኃ፡ ጥቀ
  choice: E fiquei profundamente triste
  rationale: Reproduz a tristeza pessoal do visionário e a força dos dois intensificadores em português natural e digno.
- source_word: ማኅፈድ
  choice: cercado
  rationale: Designa um recinto fechado, especialmente para animais. “Cercado” preserva a imagem sem fundi-la de antemão com a expressão seguinte, “casa das ovelhas”.
- source_word: ተከርየ
  choice: havia sido demolida
  rationale: No contexto de uma construção, o passivo indica que ela foi escavada, arrasada ou derrubada. “Demolida” comunica de modo natural a destruição da casa.
- source_word: ቤት ዘአባግዐ
  choice: casa das ovelhas
  rationale: Mantém a metáfora arquitetônica transparente e próxima da formulação ge'ez.
- source_word: ኢክህልኩ ርእዮቶሙ
  choice: não consegui ver
  rationale: Preserva tanto a incapacidade quanto o caráter visual do relato da visão.
- source_word: ለእልኩ አባግዕ
  choice: aquelas ovelhas
  rationale: Conserva o demonstrativo que remete a um grupo específico dentro da visão.
- source_word: ይበውኡ ኀበ ዝኩ ቤት
  choice: entravam naquela casa
  rationale: Expressa de forma corrente o movimento para dentro da casa, mantendo a referência demonstrativa.
theological_decisions:
- issue: Relação entre o cercado e a casa das ovelhas
  choice: 'Manter as duas expressões: “cercado” e “casa das ovelhas”'
  alternative: Uniformizar ambas como “aprisco”
  rationale: A formulação preserva a variação das imagens apocalípticas e evita identificar ou interpretar excessivamente o referente simbólico.
- issue: Natureza do dano causado à casa
  choice: “havia sido demolida”
  alternative: “havia sido cortada” ou “havia sido removida”
  rationale: Aplicado a uma construção, o verbo comunica arrasamento ou demolição; esta opção preserva a violência concreta da cena sem usar uma combinação pouco natural em português.
- issue: Sentido da oração final
  choice: “não consegui ver se aquelas ovelhas entravam naquela casa”
  alternative: “não consegui ver aquelas ovelhas, caso entrassem naquela casa”
  rationale: A sintaxe permite dúvida quanto ao alcance de “ver”. O texto principal apresenta a leitura contextual mais inteligível, enquanto a nota conserva a alternativa genuína.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem e as imagens do ge'ez foram preservadas sempre que isso não prejudicava a clareza; a ambiguidade sintática final foi registrada em nota.
