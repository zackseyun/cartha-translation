base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/014.yaml
  text: And the Lord brought the twelve sheep so that they might dwell with it and graze with it among the wolves[c][b][a]; and they multiplied and became many flocks of sheep.
translation:
  language: pt
  text: E o Senhor trouxe as doze ovelhas, para que habitassem com ela[a] e pastassem com ela no meio dos lobos.[b] Elas se multiplicaram e se tornaram muitos rebanhos de ovelhas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Com ela” provavelmente retoma a ovelha individual mencionada no versículo anterior. O texto etíope emprega um sufixo masculino singular que também poderia ser entendido como “com ele”, mas essa leitura poderia ligá-lo ao Senhor.
    reason: textual_variant
  - marker: b
    text: 'O trecho central do texto etíope é difícil. Também pode ser traduzido: “para que vivessem com ela e se alimentassem com ela entre os lobos”.'
    reason: alternative_reading
  - marker: c
    text: A frase final é textualmente incerta, mas parece descrever as doze ovelhas aumentando até formarem numerosos grupos ou rebanhos de ovelhas.
    reason: textual_variant
lexical_decisions:
- source_word: እግዚአ
  choice: o Senhor
  rationale: Preserva a autoridade e o tom elevado da figura divina ou senhorial na visão, sem desfazer a linguagem simbólica.
- source_word: አምጽኦሙ
  choice: trouxe
  rationale: Expressa de modo natural a ação de fazer as ovelhas chegarem ao lugar ou à companhia indicada.
- source_word: ፲ወ፪ አባግዕ
  choice: as doze ovelhas
  rationale: Mantém o número explícito e a imagem animal estabelecida no contexto, sem especificar indevidamente o sexo dos animais.
- source_word: ከመ ይኅደሩ ምስሌሁ
  choice: para que habitassem com ela
  rationale: Reproduz a relação de finalidade e conserva o sentido de permanecer ou viver em companhia. Em português, o pronome feminino retoma naturalmente a ovelha individual do contexto anterior.
- source_word: ይትረዐዩ ምስሌሁ
  choice: pastassem com ela
  rationale: Mantém a imagem concreta de alimentação própria das ovelhas e soa natural no registro narrativo-apocalíptico.
- source_word: ማእከለ አዝእት
  choice: no meio dos lobos
  rationale: Conserva tanto a localização espacial quanto o caráter ameaçador da cena.
- source_word: በዝኁ
  choice: se multiplicaram
  rationale: É a formulação bíblica corrente para crescimento numérico e preserva a ação expressa pelo verbo.
- source_word: ኮኑ መራዕየ ብዙኃተ ዘአባግዕ
  choice: se tornaram muitos rebanhos de ovelhas
  rationale: Representa a expansão em numerosos agrupamentos de ovelhas, mantendo a imagem pastoril apesar da dificuldade textual da frase.
theological_decisions:
- issue: Identidade do “Senhor” na visão dos animais
  choice: o Senhor
  alternative: o dono; Deus
  rationale: “O Senhor” preserva o peso teológico e a apresentação indireta da figura soberana, sem converter a metáfora em explicação.
- issue: Referente do sufixo singular em “com ela”
  choice: a ovelha individual mencionada anteriormente
  alternative: o Senhor
  rationale: O contexto narrativo favorece a ovelha singular do versículo anterior como referente; a nota preserva a dificuldade, evitando criar uma ligação sintática enganosa com “o Senhor”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Empregou-se “habitar” para conservar o tom elevado e “pastar” para manter a imagem animal concreta. A repetição de “com ela” foi preservada por corresponder à estrutura da fonte e por esclarecer o referente no contexto.
