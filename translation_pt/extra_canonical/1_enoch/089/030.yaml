base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/030.yaml
  text: And among them I saw the Lord of the sheep[a], standing before them; and they saw that he was great and fearsome and mighty[b], and all those sheep saw him and were afraid before him.
translation:
  language: pt
  text: E, entre elas, vi o Senhor das ovelhas[a], de pé diante delas. Sua aparência era grande, temível e poderosa; todas aquelas ovelhas o viram e tiveram medo de sua presença.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o dono das ovelhas” ou “o mestre das ovelhas”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tiveram medo de sua face”; aqui, “face” indica sua presença imediata.
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: o Senhor das ovelhas
  rationale: Preserva o título de autoridade e a imagem animal da visão; no contexto do Apocalipse dos Animais, a expressão designa o governante divino.
- source_word: ዘቆመ ቅድሜሆሙ
  choice: de pé diante delas
  rationale: Reproduz de modo natural a postura e a posição da figura na cena visionária.
- source_word: ራእዩ
  choice: sua aparência
  rationale: Entende a forma como substantivo com sufixo possessivo, isto é, aquilo que era visível nele, em vez de convertê-la no verbo 'viram'.
- source_word: ዐቢይ ወግሩም ወኃያል
  choice: grandiosa, temível e poderosa
  rationale: Mantém a sequência de grandeza, temor e poder em português corrente e digno, sem reduzir ግሩም apenas a admiração ou apenas a terror.
- source_word: ኵሎሙ ዝኩ አባግዕ
  choice: todas aquelas ovelhas
  rationale: Conserva o demonstrativo que remete ao grupo já presente na visão.
- source_word: ፈርሁ እምገጹ
  choice: ficaram com medo de sua presença
  rationale: A preposição እም marca aqui aquilo que provoca o medo; ገጽ significa literalmente 'face', mas também expressa presença. A tradução evita interpretar እም incorretamente como 'diante de'.
theological_decisions:
- issue: Valor do título እግዚአ አባግዕ
  choice: o Senhor das ovelhas
  alternative: o dono das ovelhas; o mestre das ovelhas
  rationale: “Senhor” preserva o peso teológico do título divino e, ao mesmo tempo, traduz a autoridade inerente à metáfora pastoral, sem acrescentar uma identificação doutrinária além do próprio contexto da visão.
translation_notes:
  register: Português moderno, amplamente compreensível e com cadência digna. A redação conserva a imagética apocalíptica, o demonstrativo “aquelas” e a força cumulativa dos três adjetivos. A pontuação divide a longa coordenação do ge'ez sem alterar sua progressão narrativa.
