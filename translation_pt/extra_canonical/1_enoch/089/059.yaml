base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/059.yaml
  text: And he summoned seventy shepherds and gave over those sheep to them, that they might pasture them. And he said to the shepherds and to their companions, “From now on, each of you shall pasture the sheep, and do all that I command you.”
translation:
  language: pt
  text: 'Então ele convocou setenta pastores e lhes entregou aquelas ovelhas, para que as apascentassem. E disse aos pastores e aos seus companheiros[a]: “De agora em diante, todos os setenta de vocês[b] apascentarão as ovelhas. Façam tudo o que eu lhes ordenar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “seus companheiros” é um tanto incerta; provavelmente se refere aos que estavam associados aos pastores.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “todos os setenta de vocês”. A expressão também pode ter força distributiva: “cada um de vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጸውዐ
  choice: convocou
  rationale: Expressa um chamado formal para uma incumbência e é mais preciso neste contexto do que o simples “chamou”.
- source_word: ኖላዊያነ
  choice: pastores
  rationale: Preserva a imagem simbólica constante do Apocalipse dos Animais sem identificar interpretativamente seus referentes.
- source_word: ገደፎሙ ሎሙ
  choice: lhes entregou
  rationale: Comunica transferência de responsabilidade ou custódia em português natural, sem acrescentar a ideia mais específica de confiança implícita em “confiou aos cuidados”.
- source_word: አባግዕ
  choice: ovelhas
  rationale: Mantém concreta a figura animal do texto, em vez de abstraí-la como “rebanho”.
- source_word: ከመ ይርዐይዎሙ
  choice: para que as apascentassem
  rationale: Conserva a ação própria dos pastores e a continuidade da metáfora; “apascentar” é digno, preciso e amplamente compreensível no registro bíblico.
- source_word: ለጸማዶሙ
  choice: aos seus companheiros
  rationale: Mantém o sentido relacional de pessoas ligadas ou associadas aos pastores, sem definir de modo indevido a natureza dessa associação.
- source_word: ኵሉ ፯፯ እምኔክሙ
  choice: todos os setenta de vocês
  rationale: Preserva no texto principal a repetição explícita do número setenta e a totalidade expressa no ge'ez; uma nota registra a possível força distributiva.
- source_word: እምይእዜ
  choice: de agora em diante
  rationale: Marca com clareza o início da incumbência em português moderno.
- source_word: ኵሎ ዘአአዝዘክሙ አነ ግበሩ
  choice: Façam tudo o que eu lhes ordenar
  rationale: Mantém o imperativo direto e a autoridade solene do falante.
theological_decisions:
- issue: Preservar a linguagem animal ou identificar diretamente os referentes históricos ou celestiais
  choice: Manter “pastores” e “ovelhas” como imagens da visão
  alternative: Explicitar os pastores como governantes ou seres angélicos e as ovelhas como Israel ou o povo
  rationale: A passagem pertence a uma visão alegórica sustentada. Identificar os referentes no texto principal eliminaria deliberadamente a abertura simbólica do original.
- issue: Força coletiva ou distributiva da expressão que repete setenta
  choice: Traduzir formalmente “todos os setenta de vocês” e registrar a possível força distributiva em nota
  alternative: Traduzir apenas “cada um de vocês”
  rationale: O ge'ez contém tanto a ideia de totalidade quanto o numeral setenta. Preservar ambos evita apagar uma repetição textual potencialmente significativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Apascentar” foi mantido por sua precisão na metáfora pastoril; a sintaxe ao redor permanece simples para assegurar compreensão corrente.
