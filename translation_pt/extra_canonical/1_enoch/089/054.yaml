base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/054.yaml
  text: And after that I saw when they abandoned the house of the Lord and his tower[a], and they all went astray, and their eyes were blinded. And I saw the Lord of the sheep bring about a great slaughter among them in their pasture[f][e][d][c][b], until those sheep cried out because of that slaughter and abandoned his place.
translation:
  language: pt
  text: Depois disso, vi que eles abandonaram a casa do Senhor e a sua torre[a]; todos se desviaram, e seus olhos ficaram cegos. Vi também o Senhor das ovelhas causar uma grande matança entre elas, no pasto delas, até que aquelas ovelhas atraíram para si aquela matança[b] e traíram o lugar dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu aprisco” ou “seu recinto”. O termo provavelmente faz parte da imagem do complexo simbólico do santuário.
    reason: lexical_alternative
  - marker: b
    text: 'A construção também tem sido entendida como “clamaram por causa daquela matança”. O etíope, porém, parece tratar “aquela matança” como objeto do verbo: literalmente, “chamaram aquela matança”.'
    reason: textual_difficulty
  - marker: c
    text: A expressão final é difícil. Também pode ser traduzida como “entregaram o lugar dele”; algumas leituras anteriores a entendem como “abandonaram o lugar dele” ou “entraram no lugar dele”.
    reason: textual_variant
lexical_decisions:
- source_word: ኃደጉ
  choice: abandonaram
  rationale: O verbo indica deixar ou abandonar; neste contexto de afastamento culpável, “abandonaram” comunica melhor a força do ato.
- source_word: ቤተ ለእግዚአ
  choice: a casa do Senhor
  rationale: Mantém a imagem simbólica do santuário e segue de perto a construção do texto etíope, sem acrescentar um referente denominacional.
- source_word: ማኅፈዶ
  choice: a sua torre
  rationale: “Torre” preserva a imagem arquitetônica do complexo simbólico, embora “aprisco” ou “recinto” também sejam possíveis.
- source_word: ስሕቱ
  choice: todos se desviaram
  rationale: “Desviaram-se” é natural na alegoria das ovelhas e conserva os sentidos espacial e moral do verbo; “todos” representa እምኵሉ no contexto.
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: seus olhos ficaram cegos
  rationale: Expressa de modo claro a perda passiva da visão presente na imagem de juízo.
- source_word: እግዚአ አባግዕ
  choice: o Senhor das ovelhas
  rationale: Conserva o título recorrente da seção conhecida como Apocalipse dos Animais e seu registro elevado.
- source_word: ገብረ ቀትለ ብዙኃ
  choice: causar uma grande matança
  rationale: Mantém a agência ativa do Senhor das ovelhas e a intensidade do juízo, sem atenuá-la para simples permissão.
- source_word: በመራዕይሆሙ
  choice: em seu pasto
  rationale: O substantivo designa o lugar onde as ovelhas pastam; o singular coletivo é natural em português e corresponde à forma contextual.
- source_word: ይጼውዕዎ ... ለዝኩ ቀትል
  choice: chamaram para si aquela matança
  rationale: A forma verbal traz objeto masculino singular, e ለዝኩ ቀትል identifica “aquela matança” como aquilo que as ovelhas chamaram; “para si” torna a relação idiomática em português sem eliminar a estranheza da imagem.
- source_word: አግብኡ መካኖ
  choice: traíram o lugar dele
  rationale: A forma causativa pode comunicar entregar ou trair. Neste contexto, “traíram” representa a entrega desleal do lugar pertencente ao Senhor, embora a passagem seja difícil.
theological_decisions:
- issue: Agência na matança
  choice: o Senhor das ovelhas causar uma grande matança
  alternative: o Senhor das ovelhas permitir uma grande matança
  rationale: O texto apresenta o Senhor como agente ativo. A tradução preserva essa tensão teológica em vez de convertê-la em mera permissão.
- issue: Responsabilidade das ovelhas pelo juízo
  choice: chamaram para si aquela matança
  alternative: clamaram por causa daquela matança
  rationale: A morfologia favorece “aquela matança” como objeto do verbo. A opção escolhida preserva a participação culpável das ovelhas, mas a leitura alternativa é registrada devido à dificuldade sintática e à tradição divergente de tradução.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe mantém a sequência visionária e a alegoria das ovelhas, enquanto as notas preservam as ambiguidades lexicais e textuais genuínas.
