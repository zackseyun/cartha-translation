base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/057.yaml
  text: And I began to cry out with all my strength[a], and I called to the Lord of the sheep and showed him concerning the sheep[b], that they were being devoured by all the wild beasts.
translation:
  language: pt
  text: E comecei a clamar com todas as minhas forças. Chamei pelo Senhor das ovelhas e mostrei-lhe o que estava acontecendo com elas, pois estavam sendo devoradas por todos os animais selvagens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os animais do campo” ou “todos os animais do deserto”. A expressão ge''ez designa animais não domesticados e pode evocar o campo aberto ou uma região deserta.'
    reason: alternativa lexical que preserva a amplitude de አራዊተ ገዳም
lexical_decisions:
- source_word: አኃዝኩ እጽራሕ
  choice: comecei a clamar
  rationale: 'A construção é inceptiva: marca o início da ação. “Clamar” comunica tanto a voz elevada quanto a aflição do vidente.'
- source_word: በኵሉ ኃይልየ
  choice: com todas as minhas forças
  rationale: Expressão portuguesa corrente que preserva a totalidade e a intensidade do apelo.
- source_word: አጸውዖ
  choice: chamei pelo
  rationale: 'Mantém a distinção em relação a “clamar”: primeiro vem o brado, depois o apelo dirigido ao Senhor das ovelhas.'
- source_word: ለእግዚአ አባግዕ
  choice: Senhor das ovelhas
  rationale: Preserva o título elevado e a função de autoridade divina dentro da alegoria animal.
- source_word: አርእዮ በእንተ አባግዕት
  choice: mostrei-lhe o que estava acontecendo com elas
  rationale: Traduz de modo natural o sentido de mostrar ou apresentar ao Senhor a situação das ovelhas; o pronome evita repetição pesada sem mudar o referente.
- source_word: ተበልዑ
  choice: estavam sendo devoradas
  rationale: Preserva o aspecto contínuo e a violência da imagem predatória.
- source_word: እምኵሎሙ አራዊተ ገዳም
  choice: por todos os animais selvagens
  rationale: Comunica claramente que se trata de animais não domesticados e predadores; ገዳም também pode evocar campo aberto ou região deserta, nuance registrada em nota.
theological_decisions:
- issue: Título divino na alegoria
  choice: Senhor das ovelhas
  alternative: dono das ovelhas
  rationale: “Senhor” conserva tanto a autoridade quanto o registro elevado da figura divina, sem reduzi-la à ideia de um proprietário humano comum.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A divisão em duas frases reduz o encadeamento pesado sem eliminar a progressão das ações. O marcador [a] aparece junto à expressão a que a nota se refere.
