base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/017.yaml
  text: And he called that sheep which had escaped from the wolves[a], and spoke with him about the wolves, so that he might hear concerning them[d][c][b], that they might not oppress the sheep.
translation:
  language: pt
  text: E ele chamou aquela ovelha que havia escapado dos lobos e falou com ela a respeito dos lobos, para que ouvisse acerca deles[a], a fim de que não maltratassem as ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão etíope é sintaticamente difícil. Também pode ser entendida como “para que ouvisse contra eles” ou “para que ouvisse uma acusação contra eles”.
    reason: alternative_reading
lexical_decisions:
- source_word: ጸውዖ
  choice: chamou
  rationale: Conserva o sentido narrativo básico de chamar ou convocar, sem acrescentar uma formalidade ausente do texto.
- source_word: በግዕ
  choice: ovelha
  rationale: O termo designa uma ovelha; esta tradução mantém o vocabulário zoomórfico recorrente da visão sem especificar indevidamente um carneiro.
- source_word: ዘተኃጥአ እምአዝእብት
  choice: que havia escapado dos lobos
  rationale: Neste contexto, a forma verbal indica escapar, e አዝእብት significa lobos. A tradução evita a leitura anterior que entendia a expressão como pecado entre as ovelhas.
- source_word: ተናገሮ በእንተ አዝእብት
  choice: falou com ela a respeito dos lobos
  rationale: Expressa naturalmente o ato de dirigir-se à ovelha sobre os lobos, preservando o referente explícito.
- source_word: ከመ ይስምዕ ዲቤሆሙ
  choice: para que ouvisse acerca deles
  rationale: A construção é sintaticamente difícil. Esta formulação mantém o verbo ouvir e a relação com os lobos, sem definir se se trata de advertência ou de acusação; a nota registra a ambiguidade.
- source_word: ኢይግስስዎሙ
  choice: não maltratassem
  rationale: No contexto dos lobos e das ovelhas, comunica ação hostil sem restringi-la a tocar, despedaçar ou devastar.
- source_word: አባግዕ
  choice: as ovelhas
  rationale: Mantém o substantivo plural e a terminologia simbólica uniforme da visão.
theological_decisions:
- issue: A identidade e a condição moral da ovelha destacada
  choice: ovelha que havia escapado dos lobos
  alternative: ovelha que havia pecado dentre as ovelhas
  rationale: A sequência etíope, considerada no contexto e com o substantivo 'lobos', descreve escape, não pecado. Assim, não se introduz uma acusação moral que o texto não exige.
- issue: O sentido da oração sobre ouvir
  choice: ouvisse acerca deles
  alternative: ouvisse contra eles / ouvisse uma acusação contra eles
  rationale: A preposição admite uma relação mais adversativa, mas a sintaxe permanece incerta. O texto principal conserva a indeterminação, e a nota apresenta as possibilidades sem escolher uma interpretação teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome feminino acompanha naturalmente o substantivo português “ovelha”, sem pretender definir o sexo do referente simbólico. A repetição de “lobos” e “ovelhas” foi mantida para preservar o padrão imagético da passagem.
