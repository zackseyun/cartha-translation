base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/010.yaml
  text: 'And they began to bring forth the beasts of the field and the birds[a]; and from among them there came forth every kind of the nations: lions, leopards, wolves, dogs, hyenas, wild boars, foxes, swine, falcons, vultures, kites, eagles, and ravens[c][b]; and in their midst a white bull was born.'
translation:
  language: pt
  text: 'E eles começaram a gerar os animais do campo e as aves; e, dentre eles, surgiram todos os tipos de povos[a]: leões, leopardos, lobos, cães, hienas, javalis, raposas, lebres, porcos, falcões, abutres, milhafres, águias e corvos[b]. E, no meio deles, nasceu um touro branco.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão etíope é difícil. Também pode ser entendida de modo mais geral como “toda espécie” ou “toda classe”; contudo, o termo correspondente a “povos” ou “nações” está presente no texto.
    reason: lexical_alternative
  - marker: b
    text: A identificação exata de vários animais desta lista é incerta. Entre as alternativas propostas estão “chacais” para “hienas” ou “raposas”, “coelhos” para “lebres”, “gaviões” para “falcões” e “gralhas” para “corvos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሐዙ፡ ይለዱ
  choice: começaram a gerar
  rationale: Preserva tanto o aspecto incoativo quanto a ideia de produzir descendência, sem atribuir maternidade biológica específica aos animais simbólicos.
- source_word: አራዊተ፡ ገዳም
  choice: os animais do campo
  rationale: Mantém a expressão concreta e o tom elevado da visão, sem reduzi-la simplesmente a “animais selvagens”.
- source_word: አዕዋፈ
  choice: as aves
  rationale: Tradução direta; não se acrescenta “do céu”, ausente no testemunho fornecido.
- source_word: ዘእምኵሉ፡ ኅብር፡ አሕዛብ
  choice: todos os tipos de povos
  rationale: A expressão etíope é difícil. Esta formulação conserva a ideia classificatória de ኅብር e a referência explícita a povos ou nações em አሕዛብ, com português natural.
- source_word: አናብስት፡ ወአናምርት፡ ወአዝእብት፡ ወአካልት
  choice: leões, leopardos, lobos, cães
  rationale: Identificações zoológicas diretas e correntes no contexto da lista alegórica.
- source_word: አጽባዕት
  choice: hienas
  rationale: Identificação tradicional plausível, embora a espécie exata permaneça discutível.
- source_word: ሐራዊ፡ ገዳም
  choice: javalis
  rationale: O composto designa porcos selvagens; “javalis” é conciso e idiomático.
- source_word: ቂናጽል
  choice: raposas
  rationale: Identificação plausível, mantendo em nota a possibilidade de canídeos semelhantes, como chacais.
- source_word: ገሐያት
  choice: lebres
  rationale: A evidência lexical favorece “lebres” ou “coelhos”; “lebres” é adotado como identificação principal.
- source_word: ሐንዘር
  choice: porcos
  rationale: Distingue os porcos domésticos dos javalis anteriormente mencionados.
- source_word: ሲሲት፡ ወአንሰርት፡ ወሆባይ፡ ወፍቃንስ፡ ወቋዓት
  choice: falcões, abutres, milhafres, águias e corvos
  rationale: Segue identificações zoológicas plausíveis para a sequência de aves, reconhecendo em nota a incerteza exata de algumas espécies.
- source_word: ላህም፡ ጸዓዳ
  choice: um touro branco
  rationale: Tradução direta que preserva o referente masculino e sua cor, importantes para a narrativa simbólica.
theological_decisions:
- issue: Força simbólica da lista de animais como representação de grupos humanos
  choice: todos os tipos de povos
  alternative: todas as espécies ou todos os tipos de animais
  rationale: O termo አሕዛብ designa povos ou nações e deve permanecer perceptível. A tradução conserva essa dimensão coletiva sem explicar no corpo do texto quais povos cada animal simboliza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém o movimento cumulativo da visão, mas evita arcaísmos. A lista inclui “lebres”, correspondente a ገሐያት, que consta no testemunho etíope embora tenha sido omitido na camada inglesa apresentada.
