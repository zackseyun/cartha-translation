base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/068.yaml
  text: And the shepherds and their companions handed over those sheep to all the wild beasts of the desert[a], so that they might devour them; and all of them, each in its time, was delivered over by number—sixty from among them—while the record of the others was written down in the book[d][c][b], how many were destroyed from among them.
translation:
  language: pt
  text: E os pastores e seus companheiros entregaram aquelas ovelhas a todos os animais selvagens do deserto, para que as devorassem. E todas elas, cada uma a seu tempo, eram entregues segundo uma contagem — sessenta dentre elas[a] —, enquanto se registrava no livro[b] quantas das demais eram destruídas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O numeral e a linguagem de contagem ao redor são difíceis neste testemunho. O texto etíope fornecido parece indicar “sessenta”, mas a contagem pode estar corrompida ou ser incerta. O ponto principal é que a entrega das ovelhas ocorre segundo um cômputo registrado.
    reason: textual_variant
  - marker: b
    text: Literalmente, “era escrito no livro”; a expressão continua o tema visionário de uma destruição contada e registrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: os pastores
  rationale: Preserva a metáfora dominante do Apocalipse dos Animais sem identificar no texto os agentes simbolizados.
- source_word: ጸማዶሙ
  choice: seus companheiros
  rationale: Expressa os que estão associados aos pastores sem definir além do que o texto permite.
- source_word: መጠውዎሙ / ይትሜጠው
  choice: entregaram / eram entregues
  rationale: Mantém a repetição do motivo da transferência das ovelhas ao poder dos predadores e verte naturalmente a mudança de voz.
- source_word: እእኩ አባግዕ
  choice: aquelas ovelhas
  rationale: Reproduz diretamente a figura animal empregada na visão.
- source_word: አራዊተ ገዳም
  choice: animais selvagens do deserto
  rationale: Conserva tanto o caráter predatório quanto o cenário ermo da expressão etíope.
- source_word: ከመ ይብልዕዎሙ
  choice: para que as devorassem
  rationale: Comunica a finalidade da entrega e a violência da imagem animal.
- source_word: በጊዜሁ
  choice: cada uma a seu tempo
  rationale: Preserva o provável sentido distributivo e sequencial da expressão.
- source_word: በኍልቍ
  choice: segundo uma contagem
  rationale: Torna claro o sentido de cômputo numérico sem recorrer a formulação arcaica.
- source_word: ፷፻ እምኔሆሙ
  choice: sessenta dentre elas
  rationale: Segue conservadoramente o numeral visível no testemunho fornecido, assinalando em nota a dificuldade textual.
- source_word: ለካልኡ በመጽሐፍ ይጸሐፍ / ሚመጠነ ያሐጕል እምኔሆሙ
  choice: se registrava no livro quantas das demais eram destruídas
  rationale: Reúne em português natural a escrita no livro e o cômputo das perdas, sem eliminar o motivo judicial do registro.
theological_decisions:
- issue: Identidade dos pastores
  choice: Manter a figura visionária como “pastores”
  alternative: Explicitar “anjos supervisores” ou “governantes estrangeiros”
  rationale: A tradução deve preservar a ambiguidade simbólica do Apocalipse dos Animais, sem impor uma identificação histórica ou teológica específica.
- issue: Sentido do registro no livro
  choice: Apresentá-lo como registro das ovelhas destruídas
  alternative: Explicá-lo como decreto divino de juízo
  rationale: O texto sustenta a imagem de contagem e registro, mas não exige que a tradução acrescente uma interpretação doutrinária de sua função.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sintaxe foi levemente reorganizada para esclarecer o vínculo entre a contagem, as demais ovelhas e o registro no livro, preservando a incerteza do numeral em nota.
