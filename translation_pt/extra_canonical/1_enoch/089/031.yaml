base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/031.yaml
  text: And all those feared and trembled before him[a], and they followed after that ram that was with them [that was in their midst][c][b], because it was not able to stand before our Lord and look at him.
translation:
  language: pt
  text: E todos aqueles[c] tiveram medo e tremeram diante dele; e seguiram aquele carneiro que estava com eles [que estava no meio deles][a][b], pois ele não conseguia permanecer de pé diante de nosso Senhor nem olhar para ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração “que estava no meio deles” aparece entre colchetes no testemunho utilizado e pode representar uma leitura secundária ou incerta.
    reason: textual_variant
  - marker: b
    text: A construção traduzida por “seguiram aquele carneiro” é difícil no ge'ez. Também pode sugerir que clamaram ou suplicaram atrás dele, ou que o procuraram por causa do carneiro.
    reason: lexical_alternative
  - marker: c
    text: 'A forma que acompanha “todos” é difícil; o sentido provável é uma referência ao grupo mencionado anteriormente: “todos aqueles”.'
    reason: lexical_uncertainty
lexical_decisions:
- source_word: ኵሎሙ እልኩ
  choice: todos aqueles
  rationale: Preserva a referência coletiva e anafórica sem reproduzir de modo artificial a forma difícil እልኩ.
- source_word: ይፈርሁ ወይርዐዱ
  choice: tiveram medo e tremeram
  rationale: Mantém os dois verbos, distinguindo o temor da reação física, em português natural.
- source_word: እምኔሁ
  choice: diante dele
  rationale: No contexto, expressa o temor provocado pela presença da figura; a forma também pode ser entendida como “por causa dele”.
- source_word: ወደርኁ ድኅሬሁ ለዝኩ በግዕ
  choice: e suplicaram, indo atrás dele, por aquele carneiro
  rationale: A expressão é difícil. Esta tradução conserva tanto a possível ideia de petição quanto a noção espacial de ir atrás, sem reduzir o trecho a um simples ato de seguir o carneiro.
- source_word: ምስሌሆሙ
  choice: que estava com eles
  rationale: Expressa claramente a associação do carneiro com o grupo.
- source_word: ዘሀሎ ማእከሎሙ
  choice: que estava no meio deles
  rationale: Traduz literalmente a oração locativa e a mantém entre colchetes por estar assim assinalada no testemunho fornecido.
- source_word: እስመ ኢንክል ቀዊመ
  choice: pois ele não conseguia permanecer de pé
  rationale: A oração causal explica a súplica; “ele” concorda naturalmente com “carneiro”, embora a figura animal represente um agente pessoal.
- source_word: ቅድመ እግዚእነ
  choice: diante de nosso Senhor
  rationale: Conserva o possessivo explícito e o título do texto, sem identificar interpretativamente a figura além do que está escrito.
- source_word: አነጽሮቶ
  choice: olhar para ele
  rationale: Emprega uma expressão moderna e clara para o ato de contemplar ou fixar os olhos na figura.
theological_decisions:
- issue: Referente de “nosso Senhor” na visão dos animais
  choice: nosso Senhor
  alternative: Deus; o Senhor das ovelhas; o soberano celestial
  rationale: O ge'ez traz explicitamente “nosso Senhor”; manter o título evita resolver a identidade simbólica além do texto.
- issue: Referência pessoal do sujeito na oração final
  choice: ele, em referência imediata ao carneiro
  alternative: uma formulação impessoal ou uma identificação explícita com a pessoa simbolizada
  rationale: O antecedente gramatical imediato é o carneiro. O pronome masculino em português preserva simultaneamente a imagem animal e a possível dimensão pessoal.
- issue: Sentido da ação em ወደርኁ ድኅሬሁ
  choice: súplica associada ao movimento de ir atrás dele
  alternative: eles o seguiram; gritaram atrás dele; procuraram-no por causa do carneiro
  rationale: A construção é lexicalmente incerta. A redação principal não a reduz a mero acompanhamento físico e a nota registra as alternativas relevantes.
translation_notes:
  register: Português moderno, digno e acessível, com cadência narrativa adequada à visão apocalíptica. Mantiveram-se a duplicação “tiveram medo e tremeram”, o título “nosso Senhor” e os colchetes do testemunho. A construção deliberadamente cautelosa na segunda oração reflete a incerteza lexical do ge'ez.
