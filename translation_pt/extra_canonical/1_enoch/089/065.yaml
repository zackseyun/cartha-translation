base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/065.yaml
  text: And I saw until those shepherds pastured in their season, and they began to kill and destroy much more than they had been commanded, and they abandoned those sheep into the hand of the lions.
translation:
  language: pt
  text: E continuei olhando até que aqueles pastores cuidaram do rebanho no tempo que lhes cabia[a]. Então começaram a matar e destruir muito além do que lhes havia sido ordenado[b] e abandonaram aquelas ovelhas nas mãos dos leões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no seu tempo” ou “na sua época”. A expressão indica o período correspondente à atuação dos pastores. Literalmente, o verbo mantém a imagem de apascentar o rebanho.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser vertida como “muito mais do que lhes havia sido ordenado”; indica que ultrapassaram a ordem recebida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: pastores
  rationale: Preserva a metáfora interna do Apocalipse dos Animais, em que os supervisores designados são representados como pastores.
- source_word: ይርዐዩ
  choice: apascentaram
  rationale: Mantém a imagem pastoril e expressa naturalmente em português a ação dos pastores para com o rebanho.
- source_word: በጊዜሁ
  choice: no tempo que lhes cabia
  rationale: Comunica um período próprio ou atribuído aos pastores sem afirmar mais precisamente do que a expressão permite se era uma estação ou um prazo formalmente designado.
- source_word: ወአኃዙ
  choice: começaram
  rationale: O verbo funciona aqui de maneira incoativa, introduzindo as ações de matar e destruir.
- source_word: ይቅትሉ
  choice: matar
  rationale: Equivalente direto e atual, sem estilização desnecessária.
- source_word: ያሕጕሉ
  choice: destruir
  rationale: Preserva a intensificação produzida pelo par verbal sem impor a ideia mais absoluta de aniquilação.
- source_word: ብዙኃ እምትእዛዞሙ
  choice: muito além do que lhes havia sido ordenado
  rationale: Trata ብዙኃ com እም como construção comparativa adverbial, indicando que a extensão da violência excedeu a ordem recebida.
- source_word: ኃደጉ
  choice: abandonaram
  rationale: Expressa a entrega culpável do rebanho, mais forte do que simplesmente deixá-lo.
- source_word: ዝኩ አባግዐ
  choice: aquelas ovelhas
  rationale: Conserva a referência demonstrativa ao rebanho específico confiado aos pastores.
- source_word: ውስተ እደ አናብስት
  choice: nas mãos dos leões
  rationale: Preserva tanto o idioma de sujeição ao poder de alguém quanto a identificação específica dos leões na visão animal.
theological_decisions:
- issue: Se a violência dos pastores permaneceu dentro da autorização recebida ou a excedeu
  choice: “muito além do que lhes havia sido ordenado”
  alternative: “segundo a ordem que haviam recebido” ou “mataram muitos além do número ordenado”
  rationale: A construção comparativa indica excesso em relação à ordem. A tradução mantém a tensão entre autoridade delegada e abuso culpável, sem definir além do texto se o excesso dizia respeito somente à quantidade ou também ao modo de agir.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente compreensível. “Continuei olhando” torna natural a fórmula visionária; “apascentaram” e “nas mãos dos leões” preservam a textura pastoril e apocalíptica.
