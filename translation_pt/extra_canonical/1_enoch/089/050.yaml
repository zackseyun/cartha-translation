base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/050.yaml
  text: And that house became great and broad, and it was built for those sheep; and a lofty and great tower was built upon the house for the Lord of the sheep. And that house was low, but the tower was raised up and became lofty; and the Lord of the sheep stood upon that tower, and they set a full table before him.
translation:
  language: pt
  text: E aquela casa tornou-se grande e ampla, e foi construída para aquelas ovelhas; e sobre a casa foi construída uma torre alta e grande para o Senhor das ovelhas. A casa era baixa, mas a torre se elevou e tornou-se alta; e o Senhor das ovelhas ficou de pé sobre aquela torre, e puseram diante dele uma mesa repleta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢየ፡ ወርኅበ
  choice: grande e ampla
  rationale: Preserva os dois qualificativos distintos, expressando tanto grandeza quanto largura/espaço em português natural.
- source_word: ማኅፈድ፡ ነዋኅ፡ ወዐቢይ
  choice: uma torre alta e grande
  rationale: Mantém a imagem arquitetônica e a ordem básica dos qualificativos sem tornar a frase artificial.
- source_word: እግዚአ፡ አባግዕ
  choice: Senhor das ovelhas
  rationale: Reproduz literalmente o título recorrente da alegoria animal, sem identificar explicitamente a personagem além do que o texto faz.
- source_word: ተላዐለ፡ ወኮነ፡ ነዋኅ
  choice: se elevou e tornou-se alta
  rationale: Conserva os dois movimentos verbais do original, apesar da leve repetição intencional.
- source_word: ማእደ፡ ምልእተ
  choice: uma mesa repleta
  rationale: Mantém a ideia de plenitude sem acrescentar aquilo de que a mesa estava cheia, pois o original não o especifica.
theological_decisions:
- issue: Identidade do Senhor das ovelhas
  choice: Manter o título figurado «Senhor das ovelhas»
  alternative: Explicitar «Deus» ou outro referente
  rationale: A alegoria emprega o título sem explicação neste versículo; a tradução preserva essa forma e evita resolver implicitamente a identificação teológica.
- issue: Sentido simbólico da casa, da torre e da mesa
  choice: Traduzir as imagens sem interpretação incorporada
  alternative: Substituí-las por seus possíveis referentes históricos ou cultuais
  rationale: O texto apresenta uma visão alegórica, e a tradução deve conservar sua tensão simbólica em vez de impor uma leitura específica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa clara. A repetição de «alta» foi mantida porque reflete a progressão enfática do original; «mesa repleta» preserva a indefinição do conteúdo.
