base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/062.yaml
  text: 'And all the excess and destruction that was done by the shepherds[a], the scribe wrote down: how many they destroyed by my command, and how many they destroyed of their own accord[e][d][c][b]; all the destruction of those seventy shepherds was recorded against them.'
translation:
  language: pt
  text: 'O escriba registrou toda a cegueira[a] e destruição[b] causadas pelos pastores: quantos eles destruíram por minha ordem e quantos destruíram por sua própria responsabilidade[c]. Toda a destruição causada pelos setenta pastores foi registrada contra eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encobrimento” ou “ato de cegar”. O termo ge'ez é difícil neste contexto.
    reason: lexical_alternative
  - marker: b
    text: A raiz aqui traduzida por “destruição” pode também transmitir a ideia de remoção violenta, ruína ou extermínio.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “por/sobre suas cabeças”; a expressão provavelmente indica que a responsabilidade recaía sobre eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽጋበ
  choice: cegueira
  rationale: O substantivo parece designar, neste contexto de juízo, o estado ou ato de cegar. A tradução mantém a imagem concreta sem transformá-la em uma interpretação teológica.
- source_word: ሐጕለ / ያሐጕሉ / ያሐጕሎሙ
  choice: destruição / destruíram
  rationale: A raiz repetida abrange ruína ou remoção violenta. A repetição de formas de “destruir” preserva a ligação lexical e o caráter contábil do versículo.
- source_word: በኖሎት
  choice: pelos pastores
  rationale: ኖሎት é forma plural relacionada a ኖላዊ, “pastor”; com a preposição, indica os agentes da ação. Isso também mantém a continuidade simbólica da visão.
- source_word: ጻሐፍ
  choice: registrou / foi registrada
  rationale: O verbo de escrever é expresso de modo natural como registro, em harmonia com o motivo do livro celestial. A variação de voz evita ambiguidade artificial em português sem mudar o conteúdo.
- source_word: ሚመጠነ
  choice: quantos
  rationale: A forma repetida introduz a contagem das perdas e ressalta a prestação de contas.
- source_word: በትእዛዝየ
  choice: por minha ordem
  rationale: Preserva a primeira pessoa e o sentido direto de uma ordem autorizadora.
- source_word: በርእሶሙ
  choice: por sua própria responsabilidade
  rationale: A expressão significa literalmente “sobre/por suas cabeças”. No contraste com “por minha ordem”, ela provavelmente atribui aos pastores a responsabilidade pelos atos excedentes, sem afirmar de modo excessivamente específico que se tratou apenas de vontade ou iniciativa.
- source_word: ፯፯ ኖላዊ
  choice: os setenta pastores
  rationale: Mantém o número e a figura simbólica estabelecida no Apocalipse dos Animais.
- source_word: ዲቤሆሙ
  choice: contra eles
  rationale: No contexto judicial e contábil, a preposição indica que o registro pesa contra os pastores, e não que seja apenas uma anotação neutra a respeito deles.
theological_decisions:
- issue: Agência e responsabilidade no juízo
  choice: Distinguir o que os pastores destruíram por ordem do falante daquilo que destruíram sob sua própria responsabilidade.
  alternative: Entender ambas as cláusulas como destruição ordenada, ou tomar “sobre suas cabeças” apenas como referência à punição posterior.
  rationale: O paralelismo entre “por minha ordem” e “por/sobre suas cabeças” indica uma distinção de responsabilidade. “Por sua própria responsabilidade” preserva a tensão entre a ordem soberana e a culpa dos agentes sem reduzir a expressão a uma afirmação filosófica sobre livre-arbítrio.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao leitor brasileiro e inteligível em âmbito lusófono. A formulação conserva a repetição judicial de “destruição”, a imagem dos pastores e a distinção entre ordem recebida e responsabilidade própria.
