lexical_decisions:
- source_word: በግዕ (bagʿ)
  choice: ovelha
  rationale: Mantém a imagem animal e corresponde diretamente ao substantivo etíope no singular.
- source_word: ድማኃ (damāḥa)
  choice: cume
  rationale: No contexto da subida à rocha, designa sua parte superior; «cume» é claro e natural em português.
- source_word: ኰኵሕ ነዋሕ (kwǝḥ nawāḥ)
  choice: rocha elevada
  rationale: Preserva o substantivo «rocha» e o sentido espacial de grande altura expresso pelo adjetivo.
- source_word: ፈነዎ ኀቤሆሙ (fannawo ḫabehomu)
  choice: a enviou até elas
  rationale: Reproduz o objeto singular e o destino plural; os pronomes femininos concordam naturalmente com «ovelha(s)» em português.
theological_decisions:
- issue: Designação do soberano das ovelhas
  choice: o Senhor das ovelhas
  alternative: o senhor das ovelhas
  rationale: A maiúscula sinaliza que a expressão funciona como título divino na alegoria, sem substituir o título por um nome próprio nem explicitar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A concordância pronominal feminina decorre da gramática portuguesa e não altera os referentes do texto etíope.
