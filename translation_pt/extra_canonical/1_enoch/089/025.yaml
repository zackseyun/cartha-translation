base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/025.yaml
  text: And those wolves again showed themselves to the sheep[a], and they went into the midst of that stream of water[d][c][b]; and those wolves followed the sheep and ran after them into that stream of water.
translation:
  language: pt
  text: E aqueles lobos voltaram a perseguir as ovelhas[a]. As ovelhas entraram no meio daquela corrente de água, e aqueles lobos seguiram as ovelhas e correram atrás delas para dentro daquela corrente de água.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A transcrição etiópica disponível neste ponto parece conter erros de OCR e pode sugerir «mostraram-se às ovelhas». A leitura do texto impresso, porém, é entendida como: «E novamente aqueles lobos perseguiram as ovelhas».'
    reason: Dificuldade textual e provável erro de transcrição/OCR no testemunho fornecido.
  - marker: b
    text: A parte final é repetitiva e pouco fluida no etíope, retomando «aqueles lobos», «as ovelhas» e «aquela corrente de água». A tradução conserva essa repetição essencial.
    reason: Dificuldade textual
lexical_decisions:
- source_word: ወ*ጓዲሆሙ፡ ዝኩ፡ አዝእብት
  choice: E aqueles lobos tornaram a
  rationale: A tradição textual/transcrição neste ponto é incerta; “tornaram a” comunica a provável ideia de repetição (“de novo”), sem sobrecarregar a frase.
- source_word: አርእይዎሙ፡ ለአባግዕ
  choice: se mostrar às ovelhas
  rationale: O verbo transcrito tem forma causativa ligada a “ver”. A construção reflexiva portuguesa expressa de modo natural “fazer-se ver/aparecer”, enquanto a nota registra a dificuldade textual e a leitura alternativa “perseguir” proposta a partir do impresso.
- source_word: አዝእብት
  choice: lobos
  rationale: Mantém a imagem animal concreta e recorrente do Apocalipse dos Animais, sem substituí-la por sua possível referência histórica.
- source_word: ለአባግዕ
  choice: ovelhas
  rationale: Preserva a imagem simbólica específica, em vez de generalizá-la como “rebanho” ou interpretar seus referentes.
- source_word: ማእከለ፡ ዝኩ፡ ዐይገ፡ ማይ
  choice: no meio daquela corrente de água
  rationale: Conserva tanto a indicação espacial de interioridade quanto a expressão concreta para o curso de água, sem defini-lo mais precisamente como rio ou torrente.
- source_word: ተለውዎሙ፡ ለአባግዕ
  choice: seguiram as ovelhas
  rationale: O verbo ተለወ pode denotar seguir ou perseguir. “Seguiram” preserva seu valor básico, enquanto “correram atrás” na oração seguinte explicita a perseguição.
- source_word: ወረጹ፡ ድኅሬሆሙ
  choice: e correram atrás delas
  rationale: Tradução direta do verbo de movimento e da expressão “atrás delas”, mantendo a vivacidade e a repetição da narrativa visionária.
theological_decisions:
- issue: Simbolismo do Apocalipse dos Animais
  choice: Manter “lobos”, “ovelhas” e “corrente de água” como imagens concretas
  alternative: Substituir as figuras por egípcios, israelitas e mar Vermelho
  rationale: A tradução deve conservar a forma da visão e não incorporar ao texto sua interpretação histórica.
- issue: Agente do movimento para a água
  choice: “Elas entraram” retoma as ovelhas
  alternative: Deixar o sujeito pronominal potencialmente indistinto
  rationale: A concordância e a sequência narrativa indicam as ovelhas como referente, sem acrescentar uma explicação histórica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi levemente naturalizada, mas a repetição visionária e a incerteza textual foram preservadas.
