base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/038.yaml
  text: And that sheep who was leading them[a], who had become a man, was separated from them and lay down[c][b]; and all the sheep sought him and cried out over him with a great cry.
translation:
  language: pt
  text: E aquela ovelha que os conduzia, que se tornara homem[a], foi separada deles e se deitou[b]; e todas as ovelhas a procuraram e clamaram por ela com um grande clamor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A ovelha que «se tornara homem» passa por uma transformação simbólica dentro da própria visão; a narrativa continua em seu registro alegórico.
    reason: cultural_note
  - marker: b
    text: Aqui, «se deitou» provavelmente representa a morte da ovelha que servia de líder, mas o texto exprime isso por meio da imagem da visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: E aquela
  rationale: O termo é a conjunção seguida do demonstrativo («e aquela»), não a fórmula visionária «e eu vi». Assim, a ovelha permanece como sujeito da oração.
- source_word: በግዕ
  choice: ovelha
  rationale: O singular designa a figura representativa já conhecida no contexto da visão; o demonstrativo fornece a determinação em português.
- source_word: ዘይመርሖሙ
  choice: que os conduzia
  rationale: A construção relativa descreve a função contínua da ovelha como guia, preservando a ordem das orações relativas no ge'ez.
- source_word: ዘኮነ ብእሴ
  choice: que se tornara homem
  rationale: Expressa uma condição adquirida ou transformação anterior dentro da sequência narrativa da visão.
- source_word: ተሌለየ እምኔሆሙ
  choice: foi separada deles
  rationale: A forma passiva conserva a ideia de afastamento sem acrescentar um agente não especificado pelo texto.
- source_word: ወሰከበ
  choice: e se deitou
  rationale: Mantém o sentido concreto básico do verbo e a imagem visionária, sem explicitar no corpo do texto a provável referência à morte.
- source_word: ኃሠሥዎ
  choice: a procuraram
  rationale: Verbo direto e natural para a busca da figura ausente.
- source_word: ወጸርኁ ዲቤሁ
  choice: e clamaram por ela
  rationale: Comunica o clamor dirigido a respeito da ovelha e sua carga de pesar sem impor a noção mais específica de um lamento ritual.
- source_word: ጽራኀ ዐቢየ
  choice: com um grande clamor
  rationale: Preserva a repetição enfática e o tom solene da linguagem apocalíptica.
theological_decisions:
- issue: Se o ato de a ovelha-homem se deitar deve ser explicitado como morte
  choice: Conservar «se deitou» no texto principal
  alternative: Traduzir «morreu» ou «adormeceu»
  rationale: O verbo permite a imagem literal, embora o contexto provavelmente indique a morte do líder. A tradução preserva a tensão e o simbolismo da visão, deixando a explicação para a nota.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. Conservam-se a estrutura simbólica da visão, a ordem das duas orações relativas e a repetição enfática «clamaram... com um grande clamor».
