base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/008.yaml
  text: And the water began to descend into them until the earth was laid bare[a]; and that vessel rested upon the earth, and darkness was removed[d][c][b], and light came to be.
translation:
  language: pt
  text: E a água começou a descer para dentro deles[a], até que a terra ficou a descoberto; e aquela embarcação repousou sobre a terra, e as trevas foram removidas, e a luz veio a existir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A transcrição traz literalmente uma forma que normalmente significa “enquanto”; pelo contexto e pela construção verbal, ela é provavelmente um erro textual por uma forma que significa “começou”. “Deles” retoma os abismos mencionados anteriormente.
    reason: textual_variant
  - marker: b
    text: A passagem das trevas para a luz pode evocar criação ou restauração. A tradução mantém a formulação própria deste texto, sem ajustá-la à redação tradicional de Gênesis.
    reason: cross_reference
lexical_decisions:
- source_word: ወአንዘ፡ ማይ፡ ይረድ
  choice: E a água começou a descer
  rationale: A leitura contextual adotada entende ወአንዘ como provável erro de transcrição por ወአኀዘ; com o imperfeito ይረድ, forma uma construção incoativa, isto é, “começou a descer”. A nota registra a forma efetivamente transcrita.
- source_word: ውስቴቶሙ
  choice: para dentro deles
  rationale: O pronome plural retoma, no contexto anterior, os abismos abertos para receber as águas. “Para dentro deles” conserva tanto o movimento para o interior quanto o referente pronominal.
- source_word: ተከሥተ፡ ምድር
  choice: a terra ficou descoberta
  rationale: Expressa de modo natural o sentido de a terra tornar-se exposta ou visível com a descida das águas.
- source_word: ውእቱ፡ መስቀር
  choice: aquela embarcação
  rationale: No contexto da visão do dilúvio, o termo designa a embarcação anteriormente mencionada. “Aquela” reproduz o valor demonstrativo de ውእቱ.
- source_word: ነበረ፡ ውስተ፡ ምድር
  choice: repousou sobre a terra
  rationale: “Repousou” comunica que a embarcação se assentou e permaneceu em terra, em registro digno e natural.
- source_word: ተገኅሰት፡ ጽልመት
  choice: as trevas foram removidas
  rationale: Mantém a ideia passiva de afastamento ou remoção sem especificar indevidamente o agente ou o mecanismo.
- source_word: ኮነ፡ ብርሃን
  choice: a luz veio a existir
  rationale: Preserva de perto o sentido de “veio a ser”, permitindo a ressonância com a criação sem substituir a expressão por uma fórmula tradicional de Gênesis.
theological_decisions:
- issue: Possível eco da criação na passagem das trevas para a luz
  choice: a luz veio a existir
  alternative: houve luz; a luz apareceu
  rationale: A formulação conserva a ressonância de criação ou restauração, mas não harmoniza o texto com uma redação consagrada de Gênesis nem reduz o verbo a mera percepção visual.
- issue: Referente do pronome plural em “para dentro deles”
  choice: manter o pronome masculino plural
  alternative: explicitar “para dentro dos abismos”
  rationale: Embora o contexto anterior aponte para os abismos, manter o pronome respeita a forma do verso e evita inserir no corpo do texto um substantivo que não está repetido aqui.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e alcance internacional. A sintaxe coordenada preserva o andamento visionário do ge’ez; escolhas como “embarcação”, “repousou” e “veio a existir” evitam tanto coloquialismo excessivo quanto arcaísmo.
