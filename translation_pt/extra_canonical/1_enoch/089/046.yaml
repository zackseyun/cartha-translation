base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/046.yaml
  text: And he went to it and spoke to it alone[a], and raised up that ram, and made it ruler and leader of the sheep; and through all this[c][b], the dogs were afflicting the sheep.
translation:
  language: pt
  text: E ele foi até ele e falou com ele a sós; então levantou aquele carneiro e o fez governante e líder das ovelhas. Durante tudo isso, os cães afligiam as ovelhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖረ፡ ኀቤሁ
  choice: E ele foi até ele
  rationale: O verbo comum de movimento seguido da expressão direcional indica que ele foi até o referente animal. Em português, o pronome masculino concorda naturalmente com “carneiro”, mantendo a referência da visão.
- source_word: ወተናገረ፡ ለባሕቲቱ
  choice: e falou com ele a sós
  rationale: ለባሕቲቱ expressa exclusividade ou privacidade (“com ele somente”, “a sós”), e não identifica por si só “aquele carneiro” como objeto lexical explícito.
- source_word: ወአንሥአ፡ ለውእቱ፡ ሐርጌ
  choice: então levantou aquele carneiro
  rationale: Aqui ሐርጌ designa o carneiro, enquanto ለ marca o objeto definido; portanto, a construção não fala de levantar um “chifre para ele”. “Levantou” preserva a imagem e pode abranger elevação ou promoção sem explicá-la excessivamente.
- source_word: ወገብረ፡ መኰንነ፡ ወመራሔ፡ ለአባግዕ
  choice: e o fez governante e líder das ovelhas
  rationale: Os dois títulos exprimem governo e direção. “Governante e líder” conserva a dupla designação e soa clara no português contemporâneo.
- source_word: ወበኵሉዝ
  choice: Durante tudo isso
  rationale: A expressão funciona temporalmente, com o sentido de “em/durante tudo isso”, e não como quantificador de “cães”.
- source_word: አክላብ፡ ያጸህቅዎሙ፡ ለአባግዕ
  choice: os cães afligiam as ovelhas
  rationale: O verbo comunica pressão, opressão ou aflição continuada. O imperfeito português representa adequadamente a ação em curso; “afligiam” preserva sua força sem especificar indevidamente o modo da agressão.
theological_decisions:
- issue: Se o texto deve introduzir a imagem de um chifre como símbolo de poder
  choice: Traduzir ሐርጌ como “carneiro” e não introduzir “chifre”
  alternative: “levantou para ele um chifre”
  rationale: A análise morfossintática desta passagem sustenta “aquele carneiro” como objeto definido. Introduzir um chifre criaria neste versículo uma imagem simbólica que não é exigida pelo texto ge’ez.
- issue: Se “levantou” deve ser interpretado diretamente como nomeação política
  choice: 'Manter “levantou” na oração e explicitar a função apenas na sequência: “o fez governante e líder”'
  alternative: “promoveu aquele carneiro”
  rationale: A formulação preserva a imagem verbal e deixa que a oração seguinte exponha a autoridade concedida, sem reduzir antecipadamente sua possível amplitude simbólica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém-se a sequência narrativa e o simbolismo animal, evitando tanto arcaísmo desnecessário quanto paráfrase interpretativa.
