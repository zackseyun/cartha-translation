base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/011.yaml
  text: And they began to gore one another[a]; and that white bull which was born in their midst begot a wild ass and a white bull with it[c][b], and the wild asses multiplied.
translation:
  language: pt
  text: E começaram a chifrar uns aos outros[a]. E aquele touro branco que nasceu no meio deles gerou um jumento selvagem e, com ele, um touro branco[b]; e os jumentos selvagens se multiplicaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma textual desta oração é difícil. O verbo parece descrever uma ação violenta recíproca entre os animais; também poderia ser traduzido por “golpear” ou “dar cabeçadas uns nos outros”.
    reason: textual_variant
  - marker: b
    text: Isto é, o touro branco gerou um jumento selvagem e também um touro branco associado a ele. A formulação concisa do original não identifica no próprio texto as figuras históricas simbolizadas pelos animais.
    reason: ambiguity
lexical_decisions:
- source_word: ይትናሰኩ
  choice: começaram a chifrar uns aos outros
  rationale: O verbo recíproco descreve uma ação violenta mútua. “Chifrar” conserva a imagem concreta dos bovinos, embora a forma textual transmitida apresente dificuldade.
- source_word: ላህም ጸዓዳ
  choice: touro branco
  rationale: O substantivo bovino pode ter sentido amplo, mas aqui a genealogia simbólica e o verbo ativo “gerou” favorecem “touro”; a cor branca deve ser preservada literalmente.
- source_word: ዘተወልደ ማእከሎሙ
  choice: que nasceu no meio deles
  rationale: A expressão funciona como oração relativa que qualifica o touro branco, e não como o verbo principal da frase.
- source_word: ወለደ
  choice: gerou
  rationale: É o verbo principal ativo e introduz a descendência do touro branco.
- source_word: አድገ ገዳም
  choice: jumento selvagem
  rationale: A expressão singular designa um asno ou jumento do ermo; “jumento selvagem” é claro e natural em português e mantém a espécie animal da visão.
- source_word: ላህመ ጸዓዳ ምስሌሁ
  choice: com ele, um touro branco
  rationale: Mantém a associação expressa por “com ele” sem transformar a imagem animal em identificação histórica.
- source_word: በዝኁ አእዱገ ገዳም
  choice: os jumentos selvagens se multiplicaram
  rationale: O plural de “jumento selvagem” é sujeito do verbo de aumento; “se multiplicaram” expressa diretamente o crescimento numérico.
theological_decisions:
- issue: Preservação da genealogia animal simbólica
  choice: Manter literalmente “touro branco”, “jumento selvagem” e “jumentos selvagens”
  alternative: Substituir os animais pelas figuras ou povos históricos que podem representar
  rationale: A tradução deve conservar a superfície narrativa da visão apocalíptica e não impor no texto principal uma decodificação histórica ou doutrinária.
- issue: Referente de “com ele”
  choice: Ligar a expressão ao jumento selvagem sem explicitar uma interpretação genealógica
  alternative: Reformular para identificar diretamente personagens humanos ou resolver em excesso a relação temporal/genealógica
  rationale: A construção permite acompanhar a sequência dos animais, mas convém preservar sua concisão e a tensão própria da alegoria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “jumento selvagem” em vez de uma forma mais regional ou arcaica e preserva a imagem concreta e a sintaxe genealógica do texto etíope.
