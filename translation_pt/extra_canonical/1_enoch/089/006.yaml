base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/006.yaml
  text: And that vessel floated upon the water[a], and all the bulls and elephants and camels and donkeys were swallowed up into the earth; and all the beasts—I could not see them—and they were not able to come out[e][d][c][b], but perished and sank into the depths.
translation:
  language: pt
  text: E aquela embarcação flutuava sobre as águas[a], e todos os touros, elefantes, camelos e jumentos foram tragados pela terra; e todos os animais — eu não conseguia vê-los — não puderam sair, mas pereceram e afundaram nas profundezas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo etíope pode designar uma embarcação e talvez, em outro entendimento, uma peça de madeira vertical, como um mastro ou uma viga; o objeto exato na visão não é inteiramente certo.
    reason: lexical_alternative
  - marker: b
    text: Ou “no abismo”, “no fundo” ou “no mar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: መሥቀር
  choice: mastro
  rationale: O termo parece indicar uma peça de madeira vertical no cenário do dilúvio. “Mastro” preserva a imagem concreta, embora a identificação exata permaneça incerta.
- source_word: ይጼቢ
  choice: afundou
  rationale: O verbo exprime movimento descendente na água; “afundou” é direto, vívido e natural em português.
- source_word: አልህምት
  choice: touros
  rationale: Mantém a classe animal específica e a importância da figura bovina no Apocalipse dos Animais.
- source_word: ነጊያት
  choice: camelos
  rationale: Equivalência direta do nome do animal.
- source_word: አገማል
  choice: jumentos
  rationale: Termo moderno, claro e digno, amplamente compreensível em português.
- source_word: ኅሠጥሙ
  choice: foram tragados
  rationale: Preserva a imagem vigorosa de serem engolidos ou absorvidos pela terra, sem reduzir a expressão a uma simples submersão.
- source_word: እንስሳ
  choice: animais
  rationale: Neste ponto integra a lista das criaturas atingidas; “animais” evita restringir indevidamente o termo a gado doméstico.
- source_word: ወአክህልክ ርእዮቶሙ
  choice: eu não conseguia vê-los
  rationale: Segue a correção textual provável ወኢክህልኩ e entende ርእዮቶሙ como infinitivo, evitando a leitura equivocada de አክህልክ como “aves”.
- source_word: ስእኑ ወጺአ
  choice: não puderam sair
  rationale: Expressa de maneira natural a incapacidade concreta de emergir ou escapar.
- source_word: ተኃጐሉ
  choice: pereceram
  rationale: Transmite a perda catastrófica com naturalidade e mantém o tom solene da narrativa.
- source_word: ቀላይ
  choice: profundezas
  rationale: Conserva a imagem aquática e ameaçadora sem impor a noção mais específica e teologicamente carregada de “abismo”.
theological_decisions:
- issue: Se a expressão final deve ser apresentada como água profunda ou como um abismo apocalíptico
  choice: profundezas
  alternative: abismo
  rationale: “Profundezas” preserva a força ominosa e apocalíptica da cena, mas mantém a amplitude semântica do termo, que também pode indicar o fundo, as águas profundas ou o mar.
- issue: Identidade do objeto que afunda nas águas
  choice: mastro
  alternative: viga ou peça de madeira vertical
  rationale: O contexto favorece um objeto vertical associado ao cenário do dilúvio, mas a tradução não deve transformar essa identificação provável em certeza absoluta; a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, solene e acessível, com cadência narrativa clara. A pontuação parentética preserva a sequência da lista e deixa explícito que “eu não conseguia vê-los” é uma observação do visionário. A tradução prioriza o texto ge'ez e a correção textual indicada pela revisão, sem reproduzir a aparente leitura OCR que transformaria a frase em referência a aves.
