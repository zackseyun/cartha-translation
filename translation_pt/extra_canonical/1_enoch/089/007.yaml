base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/007.yaml
  text: And again I saw in the vision, until all the streams withdrew from that lofty roof, and the fissures of the earth were leveled, and other abysses were opened.
translation:
  language: pt
  text: Vi novamente, na visão, até que todos os cursos de água se retiraram daquele teto elevado, as fissuras da terra foram niveladas e outros abismos se abriram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰሰሉ
  choice: se retiraram
  rationale: O verbo descreve o recuo ou a retirada das águas; a formulação mantém o movimento sem especificar além do texto se elas secaram ou foram absorvidas.
- source_word: አዕራብት
  choice: cursos de água
  rationale: No contexto da visão do dilúvio, o termo designa correntes ou canais de água. “Cursos de água” é natural em português e evita restringi-lo a riachos pequenos.
- source_word: ናሕስ ልዑል
  choice: teto elevado
  rationale: Preserva a imagem arquitetônica da visão e o sentido de altura, sem substituir “teto” por uma interpretação cosmológica mais explícita.
- source_word: ንቅዐተ ምድር
  choice: fissuras da terra
  rationale: Reproduz a ideia de aberturas ou fendas no solo, adequada ao cenário visionário.
- source_word: ዐረዩ
  choice: foram niveladas
  rationale: Expressa que as fissuras foram tornadas planas ou igualadas, em vez de apenas desaparecerem.
- source_word: መዓምቃት ካልአት
  choice: outros abismos
  rationale: Mantém a pluralidade e a imagem de profundezas abertas no cenário visionário.
theological_decisions:
- issue: Imagem cosmológica do “teto elevado”
  choice: Manter literalmente “teto elevado”
  alternative: Interpretar como “céu elevado” ou “firmamento”
  rationale: O texto apresenta uma imagem visionária concreta e ambígua; traduzi-la por uma categoria cosmológica específica resolveria indevidamente essa ambiguidade.
- issue: Destino das águas
  choice: “se retiraram”
  alternative: “foram engolidas” ou “secaram”
  rationale: A escolha conserva a noção de recuo presente no verbo sem acrescentar um mecanismo não declarado.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluida. A coordenação foi ajustada para leitura natural, preservando a sequência das três ações e a imagética incomum do original.
