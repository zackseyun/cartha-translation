base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/041.yaml
  text: And sometimes their eyes were opened[a], and sometimes they were blinded, until another sheep arose and led them and brought them all in[c][b], and their eyes were opened.
translation:
  language: pt
  text: E às vezes os olhos delas eram abertos[a], e às vezes elas ficavam cegas, até que se levantou outra ovelha, que as conduziu e as trouxe todas para dentro[b]; então os olhos delas foram abertos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A repetida imagem dos olhos sendo abertos provavelmente tem valor simbólico na visão — como despertar, reconhecimento ou discernimento restaurado —, mas o próprio texto não a explica.
    reason: cultural_note
  - marker: b
    text: A expressão traduzida como “as trouxe todas para dentro” também pode ser entendida, conforme a nuance atribuída ao verbo ge'ez, como “reuniu todas elas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ቦ ሰበ ... ወቦ ሶበ
  choice: às vezes ... e às vezes
  rationale: A construção idiomática expressa alternância temporal, e não dois grupos indefinidos.
- source_word: ይትከሠታ አዕይንቲሆሙ
  choice: os olhos delas eram abertos
  rationale: Preserva a imagem reiterada de abertura dos olhos e o aspecto recorrente no contexto da alternância.
- source_word: ይጼልሙ
  choice: elas ficavam cegas
  rationale: Expressa de modo natural a perda de visão ou percepção no cenário visionário, sem reduzir a imagem a uma interpretação exclusivamente física ou espiritual.
- source_word: ተንሥአ ካልእ በግዕ
  choice: se levantou outra ovelha
  rationale: Mantém literalmente o símbolo animal e a fórmula de surgimento ou sucessão.
- source_word: መርሖሙ
  choice: as conduziu
  rationale: Verbo corrente de liderança que evita acrescentar a nuance pastoral mais específica de 'pastorear'.
- source_word: አግብኦሙ ለኵሎሙ
  choice: as trouxe todas para dentro
  rationale: Conserva a provável força causativa e direcional do verbo; a possibilidade contextual de reunião é indicada em nota.
- source_word: ተከሥታ አዕይንቲሆሙ
  choice: os olhos delas foram abertos
  rationale: Repete literalmente o motivo central da visão e não explicita seu significado simbólico.
theological_decisions:
- issue: Sentido dos olhos abertos na visão dos animais
  choice: Manter a imagem literal dos olhos abertos
  alternative: Explicitar como iluminação do entendimento, arrependimento ou restauração
  rationale: O texto emprega uma imagem visionária de provável força simbólica, mas não define aqui seu referente; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O pronome feminino retoma as ovelhas. A alternância temporal do idioma ge'ez foi preservada, e a imagem simbólica não foi interpretada no corpo do texto.
