base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/051.yaml
  text: And again I saw those sheep[a], how they went astray and walked in many paths, and they abandoned that house of their Lord. And the Lord of the sheep called some from among the sheep and sent them to the sheep[c][b], but the sheep began to kill them.
translation:
  language: pt
  text: 'E vi novamente aquelas ovelhas: como se desviaram, seguiram por muitos caminhos e abandonaram aquela casa de seu Senhor[a]. Então o Senhor das ovelhas chamou algumas dentre elas e as enviou às ovelhas; mas as ovelhas começaram a matá-las.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de seu dono”. O termo ge’ez pode designar um senhor ou dono; “Senhor” foi escolhido porque, na visão, essa figura representa Deus como governante do rebanho.'
    reason: lexical_alternative
  - marker: b
    text: 'A última oração também pode ser entendida de modo mais concreto: “mas as ovelhas as agarraram para matá-las”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ ካዕበ ለዝኩ አባግዕ ካዕበ
  choice: E vi novamente aquelas ovelhas
  rationale: Conserva a fórmula visionária e o valor remissivo do demonstrativo. A repetição de ካዕበ é representada uma só vez em português para evitar uma formulação artificial, sem perda perceptível de sentido.
- source_word: ከመ ስሕቱ
  choice: como se desviaram
  rationale: Mantém simultaneamente a imagem concreta das ovelhas que se afastam e o sentido moral ou religioso do verbo.
- source_word: ወሖሩ በብዙሕ ፍናዋት
  choice: seguiram por muitos caminhos
  rationale: Preserva a figura concreta dos muitos caminhos em português natural, sem reduzi-la a uma paráfrase abstrata de desobediência.
- source_word: ወሐደጉ ዝኩ ቤተ ዚአሆሙ
  choice: e abandonaram aquela casa
  rationale: “Abandonaram” comunica uma ruptura mais forte do que uma simples saída, enquanto “aquela” retém a força demonstrativa do texto.
- source_word: ወእግዚኦሙ ለአባግዕ
  choice: do seu Senhor / o Senhor das ovelhas
  rationale: “Senhor” mantém tanto a autoridade do dono do rebanho na alegoria quanto a identidade divina da figura, sem eliminar totalmente a possibilidade lexical de “dono” ou “senhor” em sentido comum.
- source_word: ጸውዐ እምውስተቶሙ ለአባግዕ
  choice: chamou algumas dentre elas
  rationale: O complemento “algumas” explicita de modo idiomático que foram escolhidas ovelhas do meio do próprio rebanho; o pronome feminino deixa claro o referente em português.
- source_word: ወለአኮሙ ኀበ አባግዕ
  choice: e as enviou às ovelhas
  rationale: “Enviou” expressa com clareza a comissão, e “às ovelhas” conserva o destino indicado no ge’ez.
- source_word: ወአባግዕ አኃዙ ይቅትልዎሙ
  choice: mas as ovelhas começaram a matá-las
  rationale: A tradução principal segue a possível leitura incoativa da construção comprimida; a alternativa concreta de agarrar para matar é registrada em nota.
theological_decisions:
- issue: Tradução de እግዚእ na alegoria das ovelhas
  choice: Senhor
  alternative: dono; senhor
  rationale: A figura representa Deus como governante e proprietário do rebanho. “Senhor” preserva esse peso teológico e ainda funciona dentro da metáfora pastoril, enquanto a nota reconhece a amplitude lexical.
- issue: Identidade das ovelhas chamadas e enviadas
  choice: algumas dentre elas
  alternative: ovelhas dentre elas
  rationale: O texto apresenta os enviados como membros do próprio rebanho. A formulação evita identificá-los explicitamente com uma categoria teológica posterior, preservando a alegoria.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantêm-se a repetição característica de “ovelhas”, a imagem dos muitos caminhos e a linguagem alegórica. Os pronomes femininos referem-se às ovelhas chamadas e enviadas.
