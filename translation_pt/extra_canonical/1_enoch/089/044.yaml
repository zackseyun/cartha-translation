base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/044.yaml
  text: And that sheep[a], whose eyes had been opened, saw that ram in the midst of the sheep, which had abandoned its glory, and it began to gore those sheep and trample them[d][c][b], and it went about without restraint.
translation:
  language: pt
  text: E aquela ovelha, cujos olhos tinham sido abertos, viu o carneiro que estava no meio das ovelhas e que havia abandonado sua glória.[a] Então o carneiro começou a golpeá-las com os chifres e a pisoteá-las, e andava sem dignidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Glória” também pode significar honra ou esplendor; a visão não esclarece precisamente o que ela representa.
    reason: cultural_note
  - marker: b
    text: 'Ou: “andava de modo impróprio”. O ge’ez indica falta de dignidade ou decoro, não necessariamente ausência de quem o impedisse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: ovelha
  rationale: Mantém a imagem animal contínua do Apocalipse dos Animais e designa naturalmente um indivíduo do rebanho.
- source_word: ዘተፈትሐ አዕይንቲሁ
  choice: cujos olhos tinham sido abertos
  rationale: Conserva o sentido passivo e a ideia de percepção concedida, sem transformá-la em mero ato de olhar.
- source_word: ሐርጌ
  choice: carneiro
  rationale: Equivalente português natural para o macho da ovelha, preservando o simbolismo animal.
- source_word: ዘማእከለ አባግዕ
  choice: no meio das ovelhas
  rationale: Reproduz a localização do carneiro dentro do rebanho de maneira clara e visual.
- source_word: ዘሐደገ ስብሐተ
  choice: que havia abandonado sua glória
  rationale: Preserva tanto a ação de deixar quanto a amplitude simbólica de ስብሐት, que pode envolver glória, honra ou esplendor.
- source_word: አሐዘ ይጉድኦሙ
  choice: começou a golpeá-las com os chifres
  rationale: Expressa concretamente a agressão própria de um carneiro e mantém o aspecto incoativo de አሐዘ.
- source_word: ወኬዶሙ
  choice: e a pisoteá-las
  rationale: Dá continuidade à ação violenta por meio de uma imagem animal concreta e natural em português.
- source_word: ዘእንበለ ተደላ
  choice: sem dignidade
  rationale: O substantivo ተደላ está ligado ao que é apropriado ou decoroso; por isso, a expressão descreve conduta indigna ou imprópria, não ausência de impedimento físico.
theological_decisions:
- issue: Sentido da “glória” abandonada pelo carneiro
  choice: Manter “glória” sem definir seu referente simbólico
  alternative: esplendor, honra ou dignidade régia
  rationale: A linguagem visionária permite mais de uma referência simbólica; especificá-la como realeza, força ou posição perdida resolveria indevidamente a ambiguidade.
- issue: Sentido da conduta final do carneiro
  choice: “andava sem dignidade”
  alternative: “andava de modo impróprio” ou “comportava-se sem decoro”
  rationale: A tradução segue o campo semântico de propriedade e decoro sustentado pelo ge’ez, evitando a leitura interpretativa de que ninguém o continha.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe clara e vocabulário amplamente compreensível. A repetição de “o carneiro” evita ambiguidade pronominal entre a ovelha que vê e o carneiro que agride.
