base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/055.yaml
  text: And he gave them over into the hand of the lions and the leopards and the wolves and the hyenas[a], and into the hand of the foxes, and to all the wild beasts[e][d][c][b]; and those beasts of the field began to tear apart those sheep.
translation:
  language: pt
  text: E ele os entregou às mãos dos leões, dos leopardos, dos lobos e das hienas[a], às mãos das raposas[b] e a todos os animais selvagens; e aqueles animais do campo começaram a despedaçar aquelas ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chacais”; a identificação exata deste animal é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “chacais”; o termo pode designar um canídeo semelhante à raposa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐደጎሙ
  choice: E ele os entregou
  rationale: O verbo pode significar deixar ou abandonar, mas, neste contexto de juízo, “entregou” preserva a ação de colocá-los sob poder hostil.
- source_word: ውስተ እደ
  choice: às mãos de
  rationale: Mantém a expressão idiomática concreta de sujeição ao poder de alguém e soa natural em português.
- source_word: አናብስት
  choice: leões
  rationale: Designação contextual e lexicalmente adequada do primeiro grupo de predadores.
- source_word: አንምርት
  choice: leopardos
  rationale: “Leopardos” corresponde melhor ao termo semítico cognato e evita o anacronismo zoológico de “tigres”.
- source_word: አዝእብት
  choice: lobos
  rationale: Equivalente direto e apropriado no catálogo de predadores.
- source_word: አጽዕብት
  choice: hienas
  rationale: Identificação provável, embora “chacais” continue sendo uma alternativa lexical possível; a incerteza é preservada em nota.
- source_word: ቈናጽል
  choice: raposas
  rationale: Tradução tradicional e plausível do canídeo mencionado; “chacais” é uma alternativa possível, registrada em nota.
- source_word: ኵሉ አራዊት
  choice: todos os animais selvagens
  rationale: Amplia a enumeração dos predadores para a classe geral dos animais selvagens.
- source_word: ዝኩ አራዊተ ገዳም
  choice: aqueles animais do campo
  rationale: Preserva a distinção do original em relação à expressão anterior “todos os animais selvagens” e mantém o demonstrativo.
- source_word: አሐዙ
  choice: começaram
  rationale: 'Com a forma verbal seguinte, apresenta valor incoativo: passaram a realizar a ação.'
- source_word: ይምሥጥዎሙ
  choice: a despedaçar
  rationale: Expressa de modo concreto a violência de rasgar ou dilacerar, sem reduzir o verbo ao sentido mais amplo de destruir.
- source_word: እልኩ አባግዕ
  choice: aquelas ovelhas
  rationale: Mantém o símbolo estabelecido no Apocalipse dos Animais e conserva o demonstrativo.
theological_decisions:
- issue: Agência na imagem de juízo
  choice: ele os entregou às mãos dos predadores
  alternative: ele os deixou nas mãos dos predadores
  rationale: “Entregou” preserva a agência judicial ativa sugerida pelo contexto, sem explicar nem identificar alegoricamente as figuras.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “às mãos” conserva a imagem apocalíptica sem produzir uma sequência excessivamente pesada; “animais do campo” mantém a distinção lexical presente no ge’ez.
