base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/013.yaml
  text: And when those twelve sheep had grown, they handed over one of them to the donkeys, and those donkeys in turn handed over that sheep to the wolves, and that sheep grew up in the midst of the wolves.
translation:
  language: pt
  text: Quando aquelas doze ovelhas cresceram, entregaram uma delas aos jumentos; e esses jumentos, por sua vez, entregaram aquela ovelha aos lobos, e ela cresceu no meio dos lobos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዕ
  choice: ovelhas
  rationale: Equivalente natural e consistente para o plural de «ovelha» na alegoria animal.
- source_word: አእዱግ
  choice: jumentos
  rationale: Reproduz diretamente o referente animal do texto etíope, em linguagem corrente e digna.
- source_word: አዝእብት
  choice: lobos
  rationale: Mantém a imagem zoológica e alegórica do original.
- source_word: ካዕበ
  choice: por sua vez
  rationale: Expressa naturalmente a ideia de repetição ou etapa subsequente («de novo/por sua vez») no encadeamento das entregas.
- source_word: ማእከለ
  choice: no meio de
  rationale: Tradução direta que conserva a ideia espacial e relacional do crescimento entre os lobos.
theological_decisions:
- issue: Identidade alegórica dos animais
  choice: Manter somente as figuras animais, sem identificar personagens ou povos históricos no corpo do versículo.
  alternative: Explicitar as identificações históricas pressupostas por determinada interpretação da alegoria.
  rationale: O versículo apresenta a narrativa em símbolos e não fornece aqui as identificações; explicitá-las resolveria indevidamente a alegoria.
- issue: Sujeito de «entregaram»
  choice: Conservar o sujeito implícito na forma verbal plural.
  alternative: Acrescentar um sujeito explícito, como «as doze ovelhas» ou um grupo histórico identificado.
  rationale: O texto-fonte emprega uma forma verbal plural sem exigir que a tradução determine mais precisamente o referente.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A construção preserva o encadeamento repetitivo e solene da visão, enquanto o ponto e vírgula evita fragmentação excessiva.
