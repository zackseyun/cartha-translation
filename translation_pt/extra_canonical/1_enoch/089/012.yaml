base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/012.yaml
  text: And that bull which was born from him begot a black wild boar and a white sheep[a]; and that wild boar produced many boars[c][b], and that sheep produced twelve sheep.
translation:
  language: pt
  text: E aquele touro que nasceu dele gerou um javali preto e uma ovelha branca[a]. E aquele javali gerou muitos javalis, e aquela ovelha gerou doze ovelhas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradução conserva as figuras animais e o contraste entre preto e branco, que pertencem à genealogia simbólica desenvolvida nesta visão.
    reason: cultural_note
  - marker: b
    text: Neste contexto visionário, “ovelha” é empregada como designação genérica da figura ovina; não se pretende especificar o sexo dos descendentes representados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ላህም፡ ዘተወልደ፡ እምኔሁ
  choice: aquele touro que nasceu dele
  rationale: A concordância masculina do demonstrativo e da forma relativa favorece “touro”, não “novilha”. A formulação conserva tanto a genealogia quanto a figura animal da visão.
- source_word: ሐራዊያ፡ ገዳም፡ ጸሊመ
  choice: um javali preto
  rationale: O termo designa um suíno selvagem, e a cor preta é expressa e relevante para o contraste simbólico.
- source_word: በግዐ፡ ጸዐዳ
  choice: uma ovelha branca
  rationale: “Ovelha” é o termo corrente em português para o animal e não pretende determinar aqui o sexo do referente simbólico; a cor branca foi mantida explicitamente.
- source_word: አሕርወ፡ ብዙኃነ
  choice: muitos javalis
  rationale: Mantém a continuidade lexical e imagética com o javali mencionado antes.
- source_word: ዐሠርተ፡ ወክልኤተ፡ አባግዐ
  choice: doze ovelhas
  rationale: O numeral é literalmente “dez e duas”, isto é, doze; “ovelhas” preserva a designação animal sem acrescentar a ideia de filhotes.
theological_decisions:
- issue: Identidade das figuras animais na visão apocalíptica
  choice: Manter literalmente touro, javali e ovelha no texto principal.
  alternative: Substituir as figuras por seus possíveis referentes genealógicos ou históricos.
  rationale: A passagem comunica sua mensagem por meio de uma alegoria animal contínua. Identificar diretamente as personagens resolveria no texto uma interpretação que a própria visão deixa em forma simbólica.
translation_notes:
  register: Português moderno, claro e digno, com repetição deliberada de “gerou” para preservar a estrutura genealógica. Emprega-se “javali” em vez de “porco selvagem” por naturalidade e precisão, e “ovelha” como designação corrente da espécie.
