base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/001.yaml
  text: And one of those four went to that white bull and taught him a mystery[a], while he was not trembling; and that bull was born and became a man, and built for himself a great vessel and dwelt upon it. And three bulls were with him on that vessel[c][b], and they were covered over above them.
translation:
  language: pt
  text: E um daqueles quatro foi até aquele touro branco e lhe ensinou um mistério[a], enquanto ele não tremia. Então aquele touro nasceu e tornou-se homem; construiu para si uma grande embarcação e habitou sobre ela. Três touros estavam com ele naquela embarcação[b], e foram cobertos por cima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A fonte transcrita traz literalmente “enquanto ele não tremia”. Em leituras anteriores, a partícula negativa foi considerada incerta, dando origem à alternativa “enquanto ele tremia”.
    reason: textual_variant
  - marker: b
    text: A grande embarcação alude à embarcação do dilúvio, mas a visão mantém a narrativa em sua linguagem simbólica e não identifica aqui o homem pelo nome.
    reason: cross_reference
lexical_decisions:
- source_word: ላህም ጸዓዳ
  choice: touro branco
  rationale: O substantivo designa um bovino; o masculino preserva a correspondência simbólica da visão entre esse animal e a figura masculina que se torna homem, sem substituir a imagem por seu referente narrativo.
- source_word: መሀሮ ምሥጢረ
  choice: lhe ensinou um mistério
  rationale: Mantém tanto o sentido pedagógico do verbo como a ideia apocalíptica de conhecimento oculto, em português natural e digno.
- source_word: እንዘ ኢይርዕድ
  choice: enquanto ele não tremia
  rationale: A transcrição fornecida contém a partícula negativa ኢ; a tradução conserva essa negação e não transforma o verbo em medo de maneira interpretativa.
- source_word: ተወልደ ወኮነ ሰብአ
  choice: nasceu e tornou-se homem
  rationale: Preserva a transição surpreendente do símbolo animal para a forma humana, sem explicá-la nem identificar nominalmente a personagem.
- source_word: መስቀረ ዐቢየ
  choice: uma grande embarcação
  rationale: Expressa uma construção destinada à navegação sem introduzir no texto principal o termo teologicamente carregado 'arca', embora a alusão ao dilúvio seja reconhecível.
- source_word: ነበረ ዲቤሃ
  choice: passou a habitar sobre ela
  rationale: A preposição indica posição sobre a embarcação; 'habitar' mantém o caráter duradouro e o registro elevado da cena.
- source_word: ፫አላህምት
  choice: três touros
  rationale: Conserva a imagem bovina e sua referência masculina coerente com o código simbólico do Apocalipse dos Animais.
- source_word: ተከድኑ ላዕሌሆሙ
  choice: ficaram cobertos por cima
  rationale: Retém a construção passiva e a noção de cobertura superior, inclusive a estranheza própria da descrição visionária.
theological_decisions:
- issue: Identificação da figura transformada com Noé e da embarcação com a arca
  choice: Preservar no texto a transformação do touro em homem e a imagem genérica da grande embarcação
  alternative: Nomear Noé e traduzir a embarcação como 'arca'
  rationale: A alusão ao relato do dilúvio é clara, mas a passagem a apresenta mediante símbolos visionários. Explicitar os referentes no corpo do texto eliminaria deliberadamente essa forma simbólica.
- issue: Polaridade da oração relativa ao tremor
  choice: 'Traduzir a partícula negativa: ''não tremia'''
  alternative: 'Traduzir positivamente: ''tremia'' ou ''estava com medo'''
  rationale: A fonte transcrita contém uma negação explícita. Embora o histórico editorial registre dificuldade textual, não se deve corrigir conjecturalmente a leitura para adequá-la ao contexto.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. O tom permanece digno e visionário. Evitaram-se tanto arcaísmos desnecessários como a explicitação interpretativa de Noé e da arca. A repetição de 'touro' e 'embarcação' foi mantida por sua função simbólica e coesiva.
