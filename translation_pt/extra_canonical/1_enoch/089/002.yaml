base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/002.yaml
  text: And again I lifted up my eyes toward heaven[a], and I saw a lofty roof, and seven streams upon it[c][b]; and those streams flowed into an enclosure with much water.
translation:
  language: pt
  text: E outra vez levantei os olhos em direção ao céu e vi uma cobertura elevada[a], com sete correntes de água sobre ela; e essas correntes fluíam para dentro de um recinto[b] com muita água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O substantivo ge'ez traduzido por “cobertura” também pode significar “teto” ou uma estrutura superior; a imagem arquitetônica exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “pátio cercado”. O termo designa um pátio, cercado ou recinto delimitado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: e outra vez
  rationale: Preserva a fórmula narrativa repetitiva que introduz uma nova ação visionária.
- source_word: አልዓልኩ አዕይንትየ
  choice: levantei os olhos
  rationale: Mantém a expressão visionária concreta, sem reduzi-la simplesmente a “olhei”.
- source_word: መንገለ ሰማይ
  choice: em direção ao céu
  rationale: Expressa claramente a força direcional de መንገለ em português natural.
- source_word: ናሕሰ ልዑለ
  choice: uma cobertura elevada
  rationale: “Cobertura” conserva a amplitude do substantivo, que pode indicar teto ou estrutura superior, enquanto “elevada” retém a ideia de altura.
- source_word: ወ፯አስራብ ዲቤሁ
  choice: com sete correntes de água sobre ela
  rationale: “Correntes de água” torna a imagem compreensível sem decidir em excesso entre cursos naturais e canais; “sobre ela” preserva a relação locativa.
- source_word: እልኩ አስራብ
  choice: essas correntes
  rationale: Reproduz a referência anafórica às sete correntes já mencionadas.
- source_word: ይውሕዙ
  choice: fluíam
  rationale: Verbo natural para o movimento contínuo da água e pouco interpretativo.
- source_word: ዐጸድ
  choice: recinto
  rationale: Conserva a ideia de um espaço delimitado e mantém a ligação lexical com o local retomado nos versículos seguintes.
- source_word: ማየ ብዙሐ
  choice: com muita água
  rationale: Preserva de modo direto a noção concreta de abundância de água.
