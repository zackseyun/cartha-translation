base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/043.yaml
  text: And that ram began to gore on this side and on that side those dogs and foxes and wild boars[c][b][a], until he had destroyed them all.
translation:
  language: pt
  text: E aquele carneiro começou a atacar com os chifres aqueles cães, raposas e javalis, de um lado e de outro, até destruí-los todos.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido como “raposas” também pode designar, de modo mais amplo, canídeos selvagens, como os chacais.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “deste lado e daquele lado”, indicando ataques em ambas as direções ou ao redor.
    reason: lexical_alternative
  - marker: c
    text: 'Algumas traduções anteriores trazem: “E vi aquele chifre guerreando, deste lado e daquele, contra os cães, as raposas e os javalis”; porém, o texto etíope aqui favorece “aquele carneiro começou a atacar com os chifres”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወዝኩ
  choice: E aquele
  rationale: O texto etíope não contém aqui um verbo equivalente a “vi”; a expressão dá continuidade à narrativa e retoma a figura já mencionada.
- source_word: ሐርጌ
  choice: carneiro
  rationale: Neste contexto, o termo designa o carneiro da visão, e não o chifre; assim se mantém coerência com a imagem animal dos versículos próximos.
- source_word: አኃዘ ይወግእ
  choice: começou a atacar com os chifres
  rationale: A construção indica o início da ação de marrar ou ferir com os chifres. A formulação portuguesa conserva a ação própria do carneiro sem sugerir apenas uma guerra genérica.
- source_word: እምዝየ ወእምዝየ
  choice: deste lado e daquele
  rationale: Preserva a repetição direcional do ge’ez e sugere ataques vindos de ambos os lados ou dirigidos ao redor.
- source_word: ዝኩ አክላብ
  choice: aqueles cães
  rationale: O demonstrativo foi mantido, pois o texto aponta para os cães já presentes na visão.
- source_word: ቈናጽል
  choice: raposas
  rationale: É uma identificação plausível do animal, embora o termo possa abranger outro canídeo selvagem; a incerteza é registrada em nota.
- source_word: ሐራዊያ ገዳም
  choice: javalis
  rationale: A expressão denota porcos selvagens; “javalis” é a forma natural e concreta em português.
- source_word: እስከ ለኵሎሙ አኅጐሎሙ
  choice: até destruir todos eles
  rationale: A oração apresenta como completo o triunfo violento do carneiro sobre todos os animais hostis.
theological_decisions:
- issue: Interpretar historicamente os animais simbólicos no texto principal
  choice: Manter literalmente os cães, as raposas e os javalis
  alternative: Substituir os animais pelos povos ou grupos históricos que possivelmente representam
  rationale: A tradução deve conservar a tensão e a imagética da alegoria apocalíptica; identificações históricas pertencem ao comentário, não ao texto do versículo.
- issue: Entender a figura atacante como carneiro ou como chifre
  choice: carneiro
  alternative: chifre
  rationale: A leitura “carneiro” corresponde ao termo etíope e à continuidade da figura animal nos versículos próximos, ao passo que “chifre” exigiria outro vocábulo.
translation_notes:
  register: Português atual, digno e de leitura ampla, com vocabulário concreto. “Atacar com os chifres” comunica com clareza a ação zoomórfica sem recorrer ao menos comum “marrar”. A ordem marcada de “aqueles cães” preserva o demonstrativo do original.
