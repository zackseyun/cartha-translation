base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/016.yaml
  text: And a sheep that had been rescued from the wolves fled and passed into the wild asses of the wilderness[a], and I saw the sheep as they lamented and cried out and petitioned their Lord with all their strength, until that Lord of the sheep came down at the voice of the sheep from his lofty dwelling[d][c][b], and he came to them and saw them.
translation:
  language: pt
  text: E uma ovelha que havia sido livrada dos lobos fugiu e passou para o meio dos jumentos selvagens do deserto[a]. Vi as ovelhas lamentando, clamando e suplicando ao seu Senhor com todas as suas forças, até que aquele Senhor das ovelhas desceu de sua elevada morada, ao ouvir a voz delas[b]. Ele veio até elas e as viu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida mais literalmente como “passou para dentro dos jumentos selvagens do deserto”. A sintaxe é difícil e provavelmente descreve a ovelha entrando na região ou no meio de outro grupo de animais da visão.
    reason: textual_variant
  - marker: b
    text: Mais literalmente, “desceu à voz das ovelhas, de sua elevada morada”. A construção em ge’ez é compacta; “elevada morada” também pode ser traduzido como “salão elevado”, “câmara elevada” ou “palácio elevado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: uma ovelha
  rationale: O substantivo e os verbos iniciais estão no singular, em contraste com as referências plurais às ovelhas na sequência. A tradução conserva essa distinção formal e narrativa.
- source_word: ዘድኅነ
  choice: que havia sido livrada
  rationale: A forma relativa indica um livramento já ocorrido. “Livrada” mantém a ideia concreta de retirada do perigo sem acrescentar um agente não expresso.
- source_word: እምነ አዝእብት
  choice: dos lobos
  rationale: A preposição expressa separação dos predadores hostis; esta é a formulação portuguesa direta e vívida.
- source_word: ነፈፀ
  choice: fugiu
  rationale: O verbo comunica movimento urgente para longe do perigo; “fugiu” é natural e não especifica indevidamente o modo exato.
- source_word: ኀለፈ ውስተ አእዱገ ገዳም
  choice: passou para o meio dos jumentos selvagens do deserto
  rationale: A expressão parece indicar a entrada na região ou no grupo representado por outros animais. “Para o meio de” torna inteligível a direção de ውስተ, enquanto a nota preserva a dificuldade sintática.
- source_word: የአወይዉ
  choice: lamentando
  rationale: O verbo denota manifestação audível de aflição; “lamentando” mantém o tom elevado sem soar arcaico.
- source_word: ይጸርኁ
  choice: clamando
  rationale: “Clamar” exprime um grito urgente dirigido a alguém e se ajusta ao contexto de súplica.
- source_word: ይስእልዎ ለእግዚኦሙ
  choice: suplicando ao seu Senhor
  rationale: O pedido é intenso, não casual. “Suplicando” comunica a urgência, e “Senhor” preserva o título divino no sistema simbólico da visão.
- source_word: በኵሉ ኃይሎሙ
  choice: com todas as suas forças
  rationale: Esta formulação idiomática conserva tanto a totalidade quanto a intensidade do esforço das ovelhas.
- source_word: ዝኩ እግዚአ አባግዕ
  choice: aquele Senhor das ovelhas
  rationale: “Aquele” representa o demonstrativo, e “Senhor das ovelhas” conserva o título recorrente e a imagem própria da visão.
- source_word: ወረደ
  choice: desceu
  rationale: Mantém explicitamente o movimento vertical associado à intervenção procedente da morada elevada.
- source_word: ኀበ ቃሎሙ ለአባግዕ
  choice: ao ouvir a voz delas
  rationale: A construção comprimida liga a descida à voz das ovelhas. A formulação portuguesa comunica a resposta ao clamor, enquanto a nota registra a alternativa mais literal.
- source_word: እምጽርኁ ልዑል
  choice: de sua elevada morada
  rationale: ጽርሕ com sufixo masculino singular refere-se à sua sala, câmara, palácio ou morada, e ልዑል a qualifica como elevada. “Morada” é ampla, natural e apropriada ao contexto celeste.
theological_decisions:
- issue: Título divino na visão dos animais
  choice: Senhor das ovelhas
  alternative: dono das ovelhas
  rationale: “Senhor” preserva a soberania divina e o título reiterado da visão, sem reduzir a expressão a uma simples relação de propriedade.
- issue: Relação entre a voz das ovelhas e a descida divina
  choice: desceu ... ao ouvir a voz delas
  alternative: desceu à voz das ovelhas
  rationale: A construção fonte é compacta e admite uma versão mais formal. A redação escolhida expressa uma resposta à voz sem especificar além disso o mecanismo ou a natureza teológica da intervenção; a nota conserva a forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se a distinção entre a ovelha singular inicial e as ovelhas plurais posteriores. As imagens animais e o título “Senhor das ovelhas” permanecem explícitos; as duas construções mais difíceis recebem notas sem sobrecarregar o texto principal.
