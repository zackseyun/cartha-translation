base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/035.yaml
  text: And that ram took other sheep with him[a], and came upon those sheep that had gone astray; and he began to kill them. And the sheep were afraid before him, and that ram made those sheep that had gone astray return[b], and they went back into their folds.
translation:
  language: pt
  text: E aquele carneiro levou consigo outras ovelhas[a] e foi ao encontro das ovelhas que haviam se desviado; então começou a matá-las[b]. As ovelhas ficaram com medo diante dele, e aquele carneiro fez voltar as ovelhas que haviam se desviado, e elas retornaram aos seus apriscos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez traz o plural “outras ovelhas”; algumas versões anteriores entenderam a expressão no singular, “outra ovelha”.
    reason: grammar_number
  - marker: b
    text: 'Ou: “agarrou-as para matá-las”. A construção ge''ez pode enfatizar o começo da ação violenta ou o ato de agarrá-las com a intenção de matá-las.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: carneiro
  rationale: No Apocalipse dos Animais, o termo designa aqui a ovelha macho que lidera o grupo; “carneiro” mantém essa distinção narrativa.
- source_word: ነሥአ ምስሌሁ ባዕደ አባግዐ
  choice: levou consigo outras ovelhas
  rationale: O verbo expressa tomar ou levar em companhia, e አባግዐ é plural. A formulação é natural em português e preserva tanto a ação quanto o número gramatical.
- source_word: ቦአ ዲበ
  choice: foi ao encontro de
  rationale: A expressão indica movimento em direção ao grupo, com possível força confrontadora, sem exigir que se explicite um ataque militar.
- source_word: እለ ስሕቱ
  choice: que haviam se desviado
  rationale: Preserva simultaneamente a imagem concreta de ovelhas desgarradas e a possível ressonância moral da alegoria.
- source_word: አኀዘ ይቅትሎሙ
  choice: começou a matá-las
  rationale: A construção pode marcar o início da ação verbal. Esta tradução conserva de modo claro a violência explícita do verbo “matar”.
- source_word: ፈርሁ እምገጹ
  choice: ficaram com medo diante dele
  rationale: Reproduz de maneira digna e compreensível a ideia de temer diante da face ou presença do carneiro.
- source_word: አግብኦሙ
  choice: fez voltar
  rationale: 'Mantém o valor causativo: o carneiro provoca ou impõe o retorno das ovelhas, em vez de apenas acompanhá-las.'
- source_word: አዕጻዲሆሙ
  choice: seus apriscos
  rationale: “Apriscos” preserva com precisão a ambientação pastoril da visão e permanece inteligível no registro bíblico moderno.
theological_decisions:
- issue: A violência do carneiro contra as ovelhas desviadas
  choice: Manter no texto principal a afirmação explícita de que ele começou a matá-las.
  alternative: Abrandar para “castigá-las” ou “feri-las”.
  rationale: O texto ge'ez emprega o verbo “matar”. Suavizá-lo reduziria indevidamente a severidade da cena de juízo na alegoria apocalíptica.
- issue: Possível sentido moral de “desviar-se”
  choice: Usar uma expressão que comporte tanto o extravio literal das ovelhas quanto o erro figurado.
  alternative: Explicitar “pecaram” ou limitar a expressão a “se perderam”.
  rationale: O original permite a sobreposição entre imagem animal e significado moral; a tradução não deve resolver essa tensão de modo interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Apriscos” conserva o tom pastoril e bíblico sem arcaísmo excessivo; as repetições de “ovelhas” e “carneiro” foram mantidas por sua função na alegoria.
