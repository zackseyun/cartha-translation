base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/063.yaml
  text: And read out before me by number how many they destroy[a], and how many they hand over to destruction, so that this may be a testimony for me against them, that I may know all the deeds of the shepherds, and assess them, and see what they do—whether they abide by my command that I commanded them[c][b], or not.
translation:
  language: pt
  text: E lê diante de mim, por número, quantos eles destroem e quantos entregam à destruição[a], para que isto me sirva de testemunho contra eles[b], a fim de que eu conheça todas as obras dos pastores, os avalie[c] e veja o que fazem — se se mantêm fiéis ao meu mandamento, que lhes ordenei, ou não.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O início do versículo é difícil no etíope. A repetição de termos ligados a contar ou medir provavelmente descreve uma apuração numérica dos que os pastores destroem e dos que entregam à destruição.
    reason: textual_variant
  - marker: b
    text: 'Mais literalmente, «testemunho sobre eles»; no contexto, a expressão tem força acusatória: um testemunho que pesa contra eles.'
    reason: lexical_alternative
  - marker: c
    text: Ou «os conte». O verbo pode significar contar, medir ou avaliar, mantendo aqui a linguagem de prestação de contas.
    reason: lexical_alternative
lexical_decisions:
- source_word: አንበብ፡ ቅድሜየ
  choice: lê diante de mim
  rationale: O verbo é entendido como imperativo dirigido ao escriba, e o sufixo de primeira pessoa em ቅድሜየ exige «diante de mim».
- source_word: ወበኍልቈ፡ ... ሚመጠነ
  choice: em números, quantos
  rationale: Preserva a linguagem de contagem e prestação de contas sem introduzir como objeto explícito «os pastores», ausente nesta oração.
- source_word: የኃጕሉ
  choice: eles destroem
  rationale: O verbo indica fazer perecer ou destruir; o presente conserva o aspecto da forma e não especifica indevidamente o modo da morte.
- source_word: ይሚጥዉ፡ ለኃጕል
  choice: entregam à destruição
  rationale: 'Mantém distinta a segunda ação: não apenas destruir, mas entregar outros a um destino destrutivo.'
- source_word: ስምዐ፡ ዲቤሆሙ
  choice: testemunho ... contra eles
  rationale: «Testemunho» preserva o valor probatório, enquanto «contra eles» explicita a força acusatória contextual de «sobre eles».
- source_word: ግብሮሙ፡ ለኖላዊያን
  choice: todas as obras dos pastores
  rationale: «Obras» é natural no registro moral e judicial; «pastores» conserva o grupo simbólico fixo do Apocalipse dos Animais.
- source_word: እመጥኖሙ
  choice: os avalie
  rationale: O verbo pertence ao campo de medir e contar. Neste contexto de exame judicial, «avaliar» comunica a ideia de aferição sem eliminar a possível imagem de contagem, registrada em nota.
- source_word: በትእዛዝየ፡ ዘአዘዝክዎሙ
  choice: no meu mandamento que lhes ordenei
  rationale: Conserva a repetição deliberada entre «mandamento» e «ordenei», que destaca o padrão divino pelo qual os pastores são examinados.
- source_word: እመ፡ አልቦ
  choice: ou não
  rationale: Fecha de modo claro e natural a alternativa entre obediência e desobediência.
theological_decisions:
- issue: Função judicial da contagem e do testemunho
  choice: A fala ordena uma prestação de contas formal que servirá de testemunho contra os pastores.
  alternative: Um simples relato informativo dos acontecimentos.
  rationale: A concentração de termos ligados a número, testemunho, obras, avaliação e mandamento aponta para fiscalização e julgamento divinos.
- issue: Identidade do falante e destinatário
  choice: O Senhor fala ao escriba e manda que ele leia diante dele.
  alternative: O narrador afirma que leu diante de outra personagem.
  rationale: O sufixo de primeira pessoa em «diante de mim» e as referências posteriores a «meu mandamento» favorecem claramente a leitura imperativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A formulação conserva o tom judicial e a imagem apocalíptica, mantém a repetição enfática de «mandamento/ordenei» e sinaliza em notas as dificuldades reais do etíope.
