base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/027.yaml
  text: And I saw until all the wolves that followed those sheep perished and were drowned[a][b].
translation:
  language: pt
  text: E vi até que todos os lobos que seguiam aquelas ovelhas pereceram e se afogaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወርኢኩ
  choice: E continuei olhando
  rationale: Expressa a fórmula visionária em primeira pessoa e, no contexto de እስከ, comunica naturalmente a continuidade da visão até o acontecimento seguinte.
- source_word: እስከ
  choice: até que
  rationale: Marca o desenvolvimento da visão até o evento resultante, preservando a construção temporal do ge'ez em português idiomático.
- source_word: ተሐጕሉ
  choice: pereceram
  rationale: Mantém o primeiro dos dois resultados coordenados como destruição ou morte, sem o confundir com o afogamento expresso pelo verbo final.
- source_word: ኵሎሙ አዝእብት
  choice: todos os lobos
  rationale: አዝእብት designa especificamente lobos neste contexto; conserva-se literalmente a imagem animal do Apocalipse dos Animais.
- source_word: እለ ተለውዎሙ
  choice: que seguiam
  rationale: Representa o sentido de seguir aquelas ovelhas, sem introduzir a intensidade interpretativa de 'perseguir' nem inverter a direção da ação.
- source_word: ለዝኩ አባግዕ
  choice: aquelas ovelhas
  rationale: O demonstrativo retoma as ovelhas já presentes na visão; 'aquelas' preserva essa referência em português natural.
- source_word: ወተሠጥሙ
  choice: e se afogaram
  rationale: Preserva o segundo verbo e sua imagem distinta de afundar ou morrer por submersão, em vez de o fundir com o verbo anterior.
theological_decisions:
- issue: Explicitar ou não os referentes históricos dos animais
  choice: Manter literalmente 'lobos' e 'ovelhas'
  alternative: Substituir os animais pelos povos que simbolizam ou explicar essa identificação no texto principal
  rationale: A passagem comunica por meio de uma alegoria animal contínua. Explicitar os referentes eliminaria a forma apocalíptica e acrescentaria interpretação ao texto.
- issue: Entender a ação dos lobos como simples seguimento ou perseguição hostil
  choice: Traduzir por 'seguiam'
  alternative: Traduzir por 'perseguiam'
  rationale: O contexto pode sugerir hostilidade, mas a formulação lexical mais próxima permite 'seguiam'. A tradução preserva essa margem sem tornar explícito no verbo o que o cenário apenas pode implicar.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação distingue os dois verbos finais — perecer e afogar-se — e preserva a sequência visionária e a simbologia animal sem expansão interpretativa.
