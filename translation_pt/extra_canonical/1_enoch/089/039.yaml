base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/039.yaml
  text: And I saw until they grew quiet from the outcry for that sheep[a], and they crossed that stream of water. And the other two sheep, which were leading them, stood in place of those who had lain down[e][d][c][b], and they led them.
translation:
  language: pt
  text: E vi que eles deixaram de clamar por aquela ovelha[a] e atravessaram aquele curso de água[b]. E as outras duas ovelhas, que as guiavam, tomaram o lugar das que haviam se deitado[c] e as conduziram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção é difícil. Também pode ser entendida como: «depois do clamor por aquela ovelha» ou, possivelmente, «do clamor daquela ovelha».'
    reason: A relação expressa pela preposição e o referente do clamor admitem mais de uma análise; o texto principal preserva o sentido mais direto de cessar o clamor em favor da ovelha.
  - marker: b
    text: 'Ou: «corrente de água» ou «rio».'
    reason: A expressão designa um curso de água corrente, sem especificar seu porte.
  - marker: c
    text: 'Ou: «das que estavam deitadas» ou «das que haviam caído». O contexto pode sugerir colapso ou morte, mas o verbo significa literalmente deitar-se.'
    reason: A formulação preserva a ambiguidade lexical e narrativa relevante.
lexical_decisions:
- source_word: አርመሙ
  choice: se aquietaram
  rationale: Preserva o sentido processual de tornar-se quieto ou cessar o tumulto, sem sugerir necessariamente que uma força externa os silenciou.
- source_word: እምጽራኁ
  choice: depois do clamor
  rationale: «Clamor» comunica a força coletiva e angustiada do substantivo; «depois de» expressa em português natural a passagem do clamor para a quietude.
- source_word: ለዝኩ በግዕ
  choice: por aquela ovelha
  rationale: Mantém o referente singular e concreto da visão animal, sem substituir a imagem por sua possível identificação histórica.
- source_word: ውሒዘ ማይ
  choice: corrente de água
  rationale: Expressa um curso de água corrente sem especificar indevidamente seu tamanho como rio ou torrente.
- source_word: ቆሙ
  choice: ficaram
  rationale: No contexto locativo, «ficaram no lugar» traduz de modo natural o ato de assumir a posição antes ocupada por outras, sem eliminar a ideia de permanecer ou tomar posição.
- source_word: ካልኤሆሙ
  choice: as outras duas ovelhas
  rationale: Conserva o contraste com as ovelhas mencionadas anteriormente e a referência a duas líderes.
- source_word: ይመርሕዎሙ / መርሕዎሙ
  choice: os guiavam / os conduziram
  rationale: Os dois verbos pertencem ao mesmo campo de conduzir ou guiar. A leve variação evita rigidez em português, preservando tanto a função contínua quanto a ação narrativa final.
- source_word: ተክሎሙ
  choice: no lugar das
  rationale: O termo é entendido como a expressão preposicional «no lugar deles», e não como um verbo com o sentido de plantar ou colocar.
- source_word: ለእለ ሰከቡ
  choice: das que haviam se deitado
  rationale: Mantém o sentido lexical de deitar-se sem decidir no texto se a imagem indica repouso, queda, colapso ou morte.
theological_decisions:
- issue: Preservação do simbolismo animal da visão
  choice: Manter «ovelha/ovelhas» e a sequência de ações sem identificar as figuras historicamente.
  alternative: Substituir as ovelhas por rótulos interpretativos, como «o povo», «os israelitas» ou líderes específicos.
  rationale: A passagem comunica por meio de uma alegoria animal contínua. Decodificá-la no corpo da tradução apagaria a forma retórica da visão e imporia uma interpretação.
- issue: Sentido das ovelhas que «haviam se deitado»
  choice: Conservar a descrição concreta e ambígua.
  alternative: Traduzir explicitamente como «haviam morrido» ou «haviam caído».
  rationale: Embora o contexto possa sugerir queda ou morte, o verbo em si significa deitar-se. A tradução não deve resolver silenciosamente essa tensão.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. A estrutura repetitiva do relato visionário foi preservada, mas com leve variação entre «guiavam» e «conduziram» para evitar artificialidade. Os pronomes masculinos plurais em «os guiavam/os conduziram» referem-se ao grupo representado pelas ovelhas, seguindo a concordância conceitual do conjunto; se o contexto editorial exigir concordância estritamente gramatical com «ovelhas», pode-se uniformizar para «as».
