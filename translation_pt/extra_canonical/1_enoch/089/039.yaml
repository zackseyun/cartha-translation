revisions:
- from: E vi até que eles se aquietaram depois do clamor por aquela ovelha[a] e atravessaram aquela corrente de água[b]. Então as outras duas ovelhas, que os guiavam, ficaram no lugar das que haviam se deitado[c] e os conduziram.
  to: E vi que eles deixaram de clamar por aquela ovelha[a] e atravessaram aquele curso de água[b]. E as outras duas ovelhas, que as guiavam, tomaram o lugar das que haviam se deitado[c] e as conduziram.
  rationale: A revisão conserva a interpretação já corretamente adotada de ተክሎሙ como «no lugar delas», não como um verbo «colocar» ou «plantar». Corrige apenas a relação entre o cessar/aquietar-se e o clamor, melhora a concordância portuguesa e torna a nota textual independente do histórico editorial. A imagem alegórica das ovelhas permanece concreta e sem identificação doutrinária ou histórica acrescentada.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:00:26Z'
