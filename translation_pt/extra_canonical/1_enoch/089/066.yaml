base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/066.yaml
  text: And the lions and the leopards devoured and swallowed up most of those sheep[a], and the wild boars of the desert ate with them[c][b], and they burned that tower and tore down that house.
translation:
  language: pt
  text: E os leões e os leopardos devoraram e engoliram a maior parte daquelas ovelhas, e os javalis do deserto comeram com eles; e queimaram aquela torre e derrubaram aquela casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “casa” provavelmente representa o santuário ou templo dentro da visão; o texto principal conserva, porém, a imagem narrativa.
    reason: cultural_note
lexical_decisions:
- source_word: በልዑ ወውሕጡ
  choice: devoraram e engoliram
  rationale: Mantém os dois verbos coordenados e a intensificação da destruição causada pelos predadores.
- source_word: መብዝሕቶሙ ለዝኩ አባግዐ
  choice: a maior parte daquelas ovelhas
  rationale: Expressa claramente a maioria do grupo e conserva a imagem animal concreta da visão.
- source_word: አናብስት
  choice: leões
  rationale: É a identificação zoológica normal do termo e preserva o predador específico.
- source_word: አነምርት
  choice: leopardos
  rationale: O termo designa leopardos ou panteras; 'leopardos' é claro em português e evita a identificação menos adequada como tigres.
- source_word: ሐራዊያ ገዳም
  choice: javalis do deserto
  rationale: Conserva tanto a imagem dos suínos selvagens quanto sua associação com uma região erma.
- source_word: በልዑ ምስሌሆሙ
  choice: comeram com eles
  rationale: Preserva a segunda oração e seu verbo próprio, sem fundi-la indevidamente com os atos anteriores dos felinos.
- source_word: አውዐይዎ ለዝኩ ማኅፈድ
  choice: queimaram aquela torre
  rationale: Tradução direta que mantém a estrutura arquitetônica simbólica sem explicá-la no corpo do texto.
- source_word: ከረይዎ ለዝኩ ቤት
  choice: derrubaram aquela casa
  rationale: Reproduz concretamente a destruição e mantém o sentido básico de 'casa', sem antecipar sua possível interpretação simbólica.
theological_decisions:
- issue: Se ቤት deve ser traduzido literalmente ou interpretado como templo/santuário
  choice: casa
  alternative: templo ou santuário
  rationale: A narrativa visionária emprega uma imagem arquitetônica cujo referente provável não deve substituir o termo da visão no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O ponto e vírgula e a nova frase distinguem as ações dos felinos, dos javalis e dos destruidores das estruturas. A ambiguidade do sujeito plural na oração final é preservada.
