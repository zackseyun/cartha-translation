base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/060.yaml
  text: “And I will hand them over to you by number[a], and I will tell you which of them are to be destroyed[c][b], and those you shall destroy.” And he handed over to them those sheep.
translation:
  language: pt
  text: “Eu os entregarei a vocês conforme o número[a] e lhes direi quais deles devem ser destruídos; e esses vocês destruirão.” Então ele lhes entregou aquelas ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por número” ou “em número determinado”. A expressão indica que a entrega é feita segundo uma contagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሜጥወክሙ
  choice: Eu os entregarei a vocês
  rationale: O verbo deriva de መጠወ e expressa entrega, com objeto de segunda pessoa do plural; o pronome “os” explicita em português o grupo retomado pelo contexto.
- source_word: በኍልቍ
  choice: conforme o número
  rationale: A expressão indica contagem ou número, não veracidade. “Conforme o número” conserva a ideia de uma entrega numericamente determinada.
- source_word: እነግረክሙ
  choice: lhes direi
  rationale: Verbo de comunicação na primeira pessoa com destinatário plural; “lhes direi” é direto, natural e mantém o discurso prospectivo.
- source_word: ዘይትኃጐል እምኔሆሙ
  choice: quais deles devem ser destruídos
  rationale: A oração relativa identifica, dentre o grupo, os destinados à destruição. A formulação portuguesa preserva a referência partitiva sem especificar o agente da forma passiva.
- source_word: ኪያሆሙ አኅጕሉ
  choice: esses vocês destruirão
  rationale: O pronome enfático retoma precisamente os indivíduos indicados, e o verbo ordena sua destruição. A anteposição de “esses” conserva a ênfase.
- source_word: ወመጠወ ሎሙ ዝኩ አባግዐ
  choice: Então ele lhes entregou aquelas ovelhas
  rationale: A forma verbal é ativa, na terceira pessoa masculina singular. Embora o demonstrativo pareça formalmente singular, o contexto e a leitura textual recebida apontam para o conjunto das ovelhas entregues.
theological_decisions:
- issue: Agente implícito em “devem ser destruídos”
  choice: Manter a construção passiva sem identificar o agente
  alternative: Traduzir como “quais deles vocês devem destruir”
  rationale: A fonte distingue a identificação daqueles destinados à destruição da ordem subsequente aos destinatários. Manter a passiva preserva essa tensão e evita atribuir antecipadamente a ação.
- issue: Natureza da entrega das ovelhas
  choice: “entregou”
  alternative: “confiou”
  rationale: No contexto judicial e destrutivo do Apocalipse dos Animais, “entregou” comunica transferência sem suavizar a cena nem definir além do texto a finalidade teológica do ato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A fala direta é mantida como continuação do versículo anterior; a repetição de “entregar” preserva a ligação lexical do texto etíope.
