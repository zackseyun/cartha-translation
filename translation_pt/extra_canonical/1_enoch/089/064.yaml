base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/064.yaml
  text: And let them not know[a], and do not show them, and do not rebuke them; but write down all the destruction of the shepherds, each one in its time[c][b], and bring all of it up before me.
translation:
  language: pt
  text: E que eles não saibam; não lhes mostres nem os repreendas.[c] Mas registra toda a destruição dos pastores, cada um em seu tempo,[b] e faz subir tudo até mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode ser traduzido por “apresenta tudo diante de mim”. A tradução no texto mantém a imagem de fazer subir para uma apresentação celestial.
    reason: lexical_alternative
  - marker: b
    text: A expressão distributiva é textualmente difícil no testemunho disponível; parece indicar um registro sequencial, de cada um em seu respectivo tempo.
    reason: textual_variant
  - marker: c
    text: 'Uma tradução anterior entendia estas palavras como relato passado: “E eles não souberam, e eu não lhes mostrei, e eu não os repreendi”. As formas verbais favorecem, porém, as proibições adotadas no texto.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወኢያእምሩ
  choice: E que eles não saibam
  rationale: A forma é um jussivo negativo na terceira pessoa do plural. A tradução preserva a proibição, sem convertê-la em simples relato passado; “saibam” exprime diretamente o sentido básico de conhecer.
- source_word: ወኢታርእዮሙ
  choice: não lhes mostres
  rationale: A forma verbal tem sujeito na segunda pessoa do singular e objeto plural. “Mostrar” conserva o sentido concreto de fazer ver ou revelar.
- source_word: ወኢትዝለፎሙ
  choice: nem os repreendas
  rationale: O verbo denota censurar ou repreender. “Repreender” mantém o tom judicial e a coordenação natural com a proibição anterior.
- source_word: አላ፡ ጸሐፍ
  choice: Mas registra
  rationale: A conjunção adversativa introduz a ordem positiva após as proibições. “Registra” comunica de modo natural a escrita destinada à prestação de contas.
- source_word: ኵሎ፡ ሐጕለ፡ ኖላዊያን
  choice: toda a destruição dos pastores
  rationale: A expressão portuguesa conserva o genitivo conciso do ge'ez e não decide além do texto se se trata da destruição ligada aos pastores, causada por eles ou sofrida por eles.
- source_word: በጊዜሁ፡ ለለ፡ ፩፩
  choice: cada um em seu tempo
  rationale: A formulação mantém tanto a força distributiva quanto a referência temporal, sem explicar excessivamente a notação repetitiva do testemunho.
- source_word: ወአዐርግ፡ ኵሎ፡ ኀቤየ
  choice: e faz subir tudo até mim
  rationale: O verbo causativo contém a imagem de fazer subir. A tradução preserva essa dimensão vertical no contexto de uma apresentação celestial.
theological_decisions:
- issue: Não intervenção imediata diante dos pastores
  choice: 'As formas são traduzidas como proibições dirigidas ao escriba: os pastores não devem saber, nem receber revelação ou repreensão nessa etapa; suas ações devem ser registradas.'
  alternative: 'Ler as três primeiras formas como relato passado: “eles não souberam, eu não lhes mostrei e eu não os repreendi”.'
  rationale: A morfologia favorece o jussivo negativo na terceira pessoa do plural e os verbos na segunda pessoa do singular. Essa leitura mantém a tensão entre a ausência de intervenção imediata e o registro para o julgamento posterior.
- issue: Sentido de “destruição dos pastores”
  choice: Manter o genitivo semanticamente aberto em português.
  alternative: Explicitar “a destruição causada pelos pastores” ou “a destruição dos próprios pastores”.
  rationale: O texto não exige que a relação genitiva seja resolvida, e explicitá-la importaria uma interpretação que pode estreitar indevidamente a imagem judicial.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes (“mostres”, “repreendas”) para refletir o destinatário individual. A pontuação separa as proibições da ordem de registrar, e as notas preservam as dificuldades lexical, textual e gramatical sem sobrecarregar o versículo.
