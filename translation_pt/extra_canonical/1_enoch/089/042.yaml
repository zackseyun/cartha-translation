base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/042.yaml
  text: And dogs and foxes and wild boars of the field began to devour those sheep[b][a], until the Lord of the sheep raised up from among them one ram to lead them.
translation:
  language: pt
  text: E cães, raposas[b] e javalis do campo começaram a devorar aquelas ovelhas, até que o Senhor das ovelhas levantou dentre elas um carneiro[a] para conduzi-las.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão entre colchetes na fonte transcrita traz uma leitura difícil ou variante, equivalente a «outra ovelha», antes de «um carneiro». O texto preservado ainda apresenta o líder como surgindo dentre o rebanho.
    reason: textual_variant
  - marker: b
    text: O termo traduzido como «raposas» pode, em alguns contextos, ter um sentido mais amplo de canídeos predadores ou necrófagos, como «chacais».
    reason: lexical_alternative
lexical_decisions:
- source_word: አኃዙ
  choice: começaram
  rationale: Na construção com o verbo seguinte, exprime o início da ação; «começaram a devorar» é natural e preserva o aspecto ingressivo.
- source_word: አክላብ
  choice: cães
  rationale: É o equivalente comum e não acrescenta a especificidade de cães de caça.
- source_word: ቈናጽል
  choice: raposas
  rationale: É a identificação tradicional do canídeo predador, embora o termo possa abranger chacais; a alternativa é registrada em nota.
- source_word: ሐራዊያ ሐቅል
  choice: javalis do campo
  rationale: Preserva tanto a referência a porcos selvagens quanto a expressão locativa da imagem animal.
- source_word: ይብልዕዎሙ
  choice: devorar
  rationale: Comunica a violência predatória do contexto melhor que o termo neutro «comer».
- source_word: ዝኩ አባግዕ
  choice: aquelas ovelhas
  rationale: Mantém a força demonstrativa referente ao grupo já apresentado na visão.
- source_word: እስከ አንሥአ
  choice: até que ... levantou
  rationale: Conserva a intervenção do Senhor ao suscitar um líder sem explicitar indevidamente uma nomeação formal.
- source_word: እግዚአ አባግዕ
  choice: o Senhor das ovelhas
  rationale: Preserva o título recorrente, sua autoridade teológica e a metáfora do Apocalipse dos Animais.
- source_word: ፩እምኔሆሙ
  choice: dentre elas um
  rationale: Torna explícito que o líder surge do meio do próprio rebanho.
- source_word: ሐርጌ
  choice: carneiro
  rationale: Designa naturalmente uma ovelha macho e mantém sua distinção simbólica em relação ao rebanho.
- source_word: ዘይመርሖሙ
  choice: para conduzi-las
  rationale: Expressa liderança e direção sem importar linguagem pastoril mais específica que não está explícita no verbo.
theological_decisions:
- issue: Título divino na alegoria
  choice: o Senhor das ovelhas
  alternative: o dono das ovelhas
  rationale: «Senhor» preserva o peso teológico, a autoridade elevada e o título recorrente da visão, sem reduzir a figura à mera posse.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a repetição da imagem animal nem a ambiguidade lexical e textual indicada nas notas.
