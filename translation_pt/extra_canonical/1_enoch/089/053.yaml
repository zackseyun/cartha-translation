base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/053.yaml
  text: And he sent many other sheep to those sheep[d][c][b][a], that they might hear and cry out over them.
translation:
  language: pt
  text: E ele enviou muitas outras ovelhas àquelas ovelhas, para que se fizessem ouvir[a] e clamassem a respeito delas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A forma verbal é causativa: literalmente, “fizessem ouvir”. Também pode ser entendida como “proclamassem” ou “dessem testemunho”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “clamassem sobre elas”; conforme a relação indicada pela preposição, também se pode entender “clamassem por elas” ou “contra elas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልኣነ አባግዕ ብዙኃነ
  choice: muitas outras ovelhas
  rationale: Mantém a distinção em relação ao grupo anterior, a quantidade e a imagem animal constante da visão.
- source_word: ፈነወ
  choice: ele enviou
  rationale: A forma verbal é o perfeito na terceira pessoa masculina singular, não na primeira pessoa.
- source_word: ኀቤሆሙ ለዝኩ አባግዕ
  choice: àquelas ovelhas
  rationale: Expressa de modo natural em português o movimento em direção ao grupo de ovelhas já mencionado.
- source_word: ያስምዑ
  choice: fizessem ouvir a sua voz
  rationale: A forma causativa de ሰምዐ indica fazer ouvir ou tornar audível. A formulação preserva essa força sem decidir entre proclamação, testemunho e simples emissão de voz.
- source_word: የአውይዉ
  choice: clamassem
  rationale: O verbo indica um grito forte, que pode expressar aflição, protesto ou alarme; “clamar” mantém essa amplitude.
- source_word: ዲቤሆሙ
  choice: a respeito delas
  rationale: No contexto, a preposição pode indicar relação ou referência às ovelhas. Esta escolha é natural em português e evita definir o clamor como necessariamente hostil ou intercessório.
theological_decisions:
- issue: Identidade simbólica das “outras ovelhas”
  choice: Conservar literalmente a imagem das ovelhas, sem identificar seus referentes históricos.
  alternative: Explicitar que representam profetas, líderes fiéis ou um grupo reformador em Israel.
  rationale: A passagem pertence à visão simbólica do Apocalipse dos Animais; identificar diretamente as figuras eliminaria uma ambiguidade interpretativa que o texto preserva.
- issue: Função das ovelhas enviadas
  choice: Traduzir a forma causativa como “fizessem ouvir a sua voz”.
  alternative: “proclamassem” ou “dessem testemunho”
  rationale: As alternativas são contextualmente plausíveis, mas podem especificar demais a função profética; a redação escolhida mantém a força causativa do verbo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “ovelhas” foi mantida para preservar a estrutura e o simbolismo da visão; os pronomes femininos retomam esse substantivo.
