base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/015.yaml
  text: And the wolves began to terrify them and to oppress them[a], until they destroyed their little ones and cast their little ones into a stream of much water[c][b]. And those sheep began to cry out because of their little ones and to lament before their Lord.
translation:
  language: pt
  text: E os lobos começaram a temê-las e a oprimi-las[a], até destruírem seus pequenos e os lançarem numa corrente de águas abundantes[b]. Então aquelas ovelhas começaram a clamar por causa de seus pequenos e a se lamentar diante de seu Senhor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a atacá-las”; o verbo ge'ez pode indicar uma ação hostil e violenta.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “num rio de muitas águas” ou “numa torrente de águas abundantes”.
    reason: lexical_alternative
  - marker: c
    text: “Seu Senhor” também pode ser entendido, dentro da imagem do rebanho, como “seu dono”; o contexto favorece a referência divina.
    reason: alternative_reading
lexical_decisions:
- source_word: አዝእብት
  choice: os lobos
  rationale: Mantém literalmente a designação animal da visão, sem substituir seu referente alegórico.
- source_word: ይፈርህዎሙ
  choice: começaram a temê-las
  rationale: A construção com ወወጠኑ favorece o sentido ingressivo, e o verbo preserva a imagem paradoxal de os lobos temerem as ovelhas. Embora seja possível entender a forma como causativa, 'atemorizá-las', essa leitura não é imposta ao texto.
- source_word: አጠቅዎሙ
  choice: a oprimi-las
  rationale: Expressa ação hostil e contínua, sem restringir o verbo a um único ataque; a alternativa é registrada em nota.
- source_word: እስከ ያኅልቅ
  choice: até destruírem
  rationale: Comunica de modo natural o resultado total da violência descrita.
- source_word: ደቂቆሙ
  choice: seus pequenos
  rationale: Preserva ao mesmo tempo a relação familiar e a imagem animal, evitando tanto o termo exclusivamente humano 'filhos' quanto o estritamente zoológico 'filhotes'.
- source_word: ወገደፉ
  choice: os lançarem
  rationale: O verbo indica movimento forçado para dentro da corrente e pede uma formulação digna e vívida.
- source_word: በውኂዘ ማይ ብዙኅ
  choice: numa corrente de águas abundantes
  rationale: Mantém a ideia de um curso de água volumoso sem decidir indevidamente entre rio e torrente.
- source_word: እልኩ አባግዕ
  choice: aquelas ovelhas
  rationale: Conserva a força demonstrativa que retoma o grupo já mencionado na visão.
- source_word: ይጸርኁ
  choice: a clamar
  rationale: Transmite um grito intenso de dor e apelo sem soar coloquial.
- source_word: በእንተ ደቂቆሙ
  choice: por causa de seus pequenos
  rationale: 'A preposição indica naturalmente a causa do clamor: o que aconteceu com as crias.'
- source_word: ይስክዩ
  choice: a se lamentar
  rationale: Expressa a manifestação vocal de tristeza diante do Senhor, sem reduzi-la a uma simples queixa.
- source_word: ኀበ እግዚኦሙ
  choice: diante de seu Senhor
  rationale: Preserva tanto a postura de apelo quanto a força teológica do título no contexto da visão.
theological_decisions:
- issue: Se እግዚኦሙ deve ser traduzido como 'Senhor' ou 'dono' na alegoria das ovelhas
  choice: seu Senhor
  alternative: seu dono
  rationale: No contexto das Visões de Sonhos, o clamor das ovelhas se dirige ao soberano divino do rebanho. 'Senhor' conserva essa dimensão, enquanto a nota mantém disponível a leitura própria da moldura animal.
- issue: Se ይፈርህዎሙ descreve os lobos temendo as ovelhas ou aterrorizando-as
  choice: começaram a temê-las
  alternative: começaram a aterrorizá-las
  rationale: A leitura simples do verbo e o início marcado por 'começaram' sustentam 'temê-las', apesar da tensão produzida na imagem. A tradução não elimina essa tensão em favor de uma leitura causativa contextualmente mais fácil.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição de 'seus pequenos' preserva a coesão e a carga afetiva do original; 'corrente de águas abundantes' mantém deliberadamente aberta a natureza exata do curso de água.
