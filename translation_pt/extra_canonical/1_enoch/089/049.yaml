  terminology: “Ovelhas”, “cães”, “raposas”, “javalis selvagens”, “carneiro” e “feras” conservam com precisão a alegoria animal. As notas sobre raposas/chacais, javalis/porcos selvagens do ermo e o ataque do carneiro são pertinentes e não impõem identificação histórica ou doutrinária.
