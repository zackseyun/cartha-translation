base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/049.yaml
  text: And those sheep grew and multiplied[a], and all those dogs and foxes and wild boars of the field feared and fled from them. And that ram gored and killed all the beasts, and those beasts were no longer able again to be in the midst of the sheep[e][d][c][b], and they did not seize anything from them.
translation:
  language: pt
  text: E aquelas ovelhas cresceram e se multiplicaram, e todos aqueles cães, raposas[a] e javalis selvagens[b] tiveram medo delas e fugiram. Aquele carneiro chifrou[c] e matou todas as feras; elas já não conseguiam voltar a ficar no meio das ovelhas e não lhes arrancavam mais coisa alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chacais”; a identificação zoológica exata do termo é incerta.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “porcos selvagens do ermo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “golpeou”; no contexto de um carneiro, o golpe provavelmente é dado com os chifres.
    reason: lexical_alternative
lexical_decisions:
- source_word: ልህቁ / በዝኁ
  choice: cresceram e se multiplicaram
  rationale: Mantém os dois verbos quase sinônimos e sua intensificação, com formulação natural em português.
- source_word: አባግዕ
  choice: ovelhas
  rationale: Conserva a imagem animal concreta da visão, em vez de substituí-la pelo coletivo abstrato “rebanho”.
- source_word: አክላብ
  choice: cães
  rationale: Correspondência direta que preserva o elenco zoológico da alegoria.
- source_word: ቈናጽል
  choice: raposas
  rationale: É uma tradução corrente para o animal semelhante a uma raposa, embora “chacais” também seja possível.
- source_word: ሐራዊያ ገዳም
  choice: javalis selvagens
  rationale: Expressa suínos não domesticados do campo ou ermo sem a expressão redundante “javalis do campo”.
- source_word: ፈርሁ ወነፍጹ እምኔሁ
  choice: tiveram medo delas e fugiram
  rationale: Preserva tanto a reação de medo quanto a retirada, entendendo a referência como dirigida às ovelhas coletivamente.
- source_word: ሐርጌ
  choice: carneiro
  rationale: Designa com precisão a ovelha macho e mantém a figura concreta do líder animal.
- source_word: ጐድአ
  choice: chifrou
  rationale: No contexto da ação de um carneiro, traduz de modo concreto o golpe dado com os chifres; o sentido mais geral “golpeou” permanece possível.
- source_word: አራዊተ / አራዊት
  choice: feras
  rationale: Comunica o caráter selvagem e hostil desses animais melhor que o termo genérico “animais”.
- source_word: አክህሉ ዳግመ ... ማእከለ አባግዕ
  choice: já não conseguiam voltar a ficar no meio das ovelhas
  rationale: Preserva a incapacidade subsequente e o elemento reiterativo de ዳግመ em português idiomático.
- source_word: ምንትኒ ገሙራ ኢመሠጡ እምኔሆሙ
  choice: nem lhes arrancar coisa alguma
  rationale: Ressalta a cessação completa da ação predatória, usando um verbo adequado ao contexto de feras que arrebatam presas.
theological_decisions:
- issue: Se a tradução deve identificar diretamente os referentes históricos dos animais
  choice: Preservar literalmente as imagens de ovelhas, cães, raposas, javalis, carneiro e feras.
  alternative: Substituir os animais por povos, governantes ou facções historicamente identificados.
  rationale: A passagem comunica sua mensagem por meio de uma alegoria animal contínua; decodificá-la no texto principal eliminaria a abertura interpretativa da visão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe fluente e preservação das imagens apocalípticas concretas. “Chifrou” foi preferido a “corneou” por ser mais imediatamente compreensível ao leitor comum.
