base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/034.yaml
  text: And when they saw him[a], they were afraid and trembled before his face[b], and they desired to return to their own folds.
translation:
  language: pt
  text: E, quando o viram, ficaram com medo e tremeram diante de sua face[a] e quiseram voltar aos seus próprios apriscos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante de sua face”, uma expressão vívida para estar na presença dele.
    reason: lexical_alternative
  - marker: b
    text: O termo provavelmente indica recintos para animais, como apriscos; a tradução preserva a simbologia animal da visão.
    reason: cultural_note
lexical_decisions:
- source_word: ርእይዎ
  choice: o viram
  rationale: 'O verbo é o termo comum para “ver”, e o sufixo pronominal indica o objeto masculino singular: “o”.'
- source_word: ፈርሁ ወርዕዱ
  choice: ficaram com medo e tremeram
  rationale: Preserva tanto o temor quanto sua manifestação física, em linguagem atual e digna.
- source_word: እምቅድመ ገጹ
  choice: diante do seu rosto
  rationale: Mantém a expressão vívida do ge'ez, literalmente ligada à face, sem reduzi-la simplesmente a “diante dele”.
- source_word: ወፈቀዱ
  choice: e quiseram
  rationale: Expressa de modo natural o sentido de querer ou desejar, sem elevar desnecessariamente o registro.
- source_word: ከመ ይግብኡ
  choice: voltar
  rationale: O verbo pode exprimir entrar ou retornar; o contexto favorece o movimento de volta a um lugar anterior.
- source_word: ለአዕጻዲ ዚአሆሙ
  choice: aos seus próprios apriscos
  rationale: “Apriscos” preserva a imagem de recintos para animais e a simbologia contínua do Apocalipse dos Animais; “próprios” representa o elemento possessivo.
theological_decisions:
- issue: Se a imagem animal deve ser generalizada como movimento humano comum
  choice: manter “apriscos”
  alternative: suas casas; seus lugares; seus recintos
  rationale: A visão desenvolve sua mensagem por meio de imagens animais contínuas. Generalizar o termo apagaria parte de sua textura literária e simbólica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. A construção semítica “diante do seu rosto” foi preservada deliberadamente, enquanto “quiseram” evita um tom excessivamente arcaico. Todos os marcadores de nota aparecem junto às expressões correspondentes.
