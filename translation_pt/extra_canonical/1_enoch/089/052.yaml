base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/052.yaml
  text: And one of them escaped and was not killed[a]; and it cried out over the sheep, and they wanted to kill it, but the Lord of the sheep saved it from among the sheep[c][b], and brought it up to me and set it down.
translation:
  language: pt
  text: E uma delas escapou e não foi morta; levantou-se de um salto e clamou sobre as ovelhas[a]. Elas quiseram matá-la, mas o Senhor das ovelhas a salvou do meio das ovelhas[b], levou-a para junto de mim e a colocou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “clamou às ovelhas” ou “clamou a respeito das ovelhas”; aqui, a preposição ge’ez admite mais de uma relação.
    reason: lexical_alternative
  - marker: b
    text: A expressão ge’ez diz literalmente “salvou-a deles, as ovelhas”, numa construção em que o substantivo esclarece o pronome antecipado.
    reason: grammar_clarification
lexical_decisions:
- source_word: ድኅነ
  choice: escapou
  rationale: No encadeamento com “não foi morta”, exprime naturalmente que uma das ovelhas sobreviveu ou escapou do ataque; a salvação divina posterior recebe formulação própria.
- source_word: ኢተቀትለ
  choice: não foi morta
  rationale: Reproduz de modo direto a forma passiva negativa, com concordância natural com “uma [das ovelhas]”.
- source_word: ቀነጸ
  choice: levantou-se de um salto
  rationale: Conserva a ideia de movimento súbito para cima sem recorrer a uma expressão pouco natural em português.
- source_word: ጸርኀ ዲበ አባግዕ
  choice: clamou sobre as ovelhas
  rationale: “Clamou” mantém a intensidade do verbo, e “sobre” preserva a abertura semântica da preposição ዲበ, em vez de decidir se o clamor foi dirigido às ovelhas ou feito a respeito delas.
- source_word: ፈቀዱ ይቅትልዎ
  choice: quiseram matá-la
  rationale: Expressa com clareza e naturalidade a intenção hostil.
- source_word: እግዚአ አባግዕ
  choice: o Senhor das ovelhas
  rationale: Mantém o título divino recorrente e o registro reverente da visão animal.
- source_word: አድኃኖ
  choice: a salvou
  rationale: Distingue a intervenção explícita do Senhor do escape narrado no início e preserva o peso soteriológico do verbo.
- source_word: እምኔሆሙ ለአባግዕት
  choice: do meio das ovelhas
  rationale: Entende o sufixo pronominal como antecipado e esclarecido pelo substantivo seguinte; “do meio de” comunica separação do grupo atacante com naturalidade.
- source_word: አዕረጎ ኀቤየ
  choice: levou-a para junto de mim
  rationale: Preserva o movimento em direção ao vidente; “para junto de mim” é idiomático e não apaga inteiramente a perspectiva espacial.
- source_word: አንበሮ
  choice: a colocou ali
  rationale: Representa o ato concreto de colocá-la depois de levá-la ao vidente, evitando sugerir necessariamente que ela se sentou ou passou a morar ali.
theological_decisions:
- issue: Título divino na Apocalipse dos Animais
  choice: o Senhor das ovelhas
  alternative: o dono das ovelhas
  rationale: O título funciona como designação reverente de Deus dentro do simbolismo da visão; “Senhor” conserva tanto a autoridade quanto o teor teológico do original.
- issue: Identidade dos agentes que tentam matar a ovelha
  choice: Elas quiseram matá-la
  alternative: Eles quiseram matá-la
  rationale: O antecedente imediato no contexto figurado são as ovelhas; o feminino torna a referência explícita em português sem identificar historicamente as personagens nem resolver a alegoria no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. Mantém-se a imagem animal por meio de pronomes femininos e conserva-se a ambiguidade do clamor em nota, sem identificar a personagem alegórica.
