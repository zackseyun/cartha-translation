base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/003.yaml
  text: And again I saw[a], and behold, springs were opened upon the earth in that great enclosure, and that water was bubbling up and rising over the earth, and that enclosure appeared[e][d][c][b], until all its land was covered with water.
translation:
  language: pt
  text: 'E vi novamente: eis que fontes[a] se abriram sobre a terra, naquele grande recinto. Enquanto aquela água brotava e se elevava sobre a terra, o recinto estava visível[b], até que todo o seu terreno[c] ficou coberto de água.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nascentes” ou “mananciais”.
    reason: lexical_alternative
  - marker: b
    text: A construção é sintaticamente difícil. Mais literalmente, “o recinto foi visto”; também pode indicar que ele apareceu ou se tornou visível enquanto as águas subiam.
    reason: alternative_reading
  - marker: c
    text: Ou “toda a terra”, conforme se entenda o sufixo pronominal.
    reason: alternative_reading
lexical_decisions:
- source_word: አንቅዕታት
  choice: fontes
  rationale: Designa fontes naturais de água que se abrem no solo; “fontes” é claro e preserva a imagem sem sugerir uma construção arquitetônica.
- source_word: ተርሕዉ
  choice: se abriram
  rationale: Reproduz a forma passiva do verbo e se ajusta à imagem das fontes que se abrem no início da inundação.
- source_word: ዐጸድ ዐቢይ
  choice: grande recinto
  rationale: Mantém a ideia de uma área delimitada sem defini-la indevidamente como campo cultivado, pátio ou jardim.
- source_word: ወአንዘ ... ይፈልሕ ... ይትነሣእ
  choice: Enquanto ... brotava e se elevava
  rationale: ወአንዘ introduz uma oração temporal; os dois verbos descrevem a água que emerge e sobe, sem acrescentar a ideia não expressa de que ela “começou” a fazê-lo.
- source_word: ተአርአየ ለውእቱ ዐጸድ
  choice: o recinto estava visível
  rationale: Expressa de modo natural a ideia de que o recinto era visto enquanto as águas subiam, preservando a dificuldade da construção sem impor uma reconstrução mais específica.
- source_word: ኵሉ ምድሩ
  choice: todo o seu terreno
  rationale: O sufixo pronominal provavelmente retoma o recinto; “terreno” comunica a área de terra pertencente a ele, sem excluir em nota a leitura mais ampla.
theological_decisions:
- issue: Alcance da inundação na visão
  choice: A inundação cobre todo o terreno do recinto simbólico.
  alternative: A água cobre toda a terra, em sentido universal.
  rationale: A forma pronominal pode retomar o recinto mencionado imediatamente antes, embora o substantivo também permita uma compreensão mais ampla. O texto principal conserva a referência local mais provável, e a nota registra a alternativa universal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pontuação que esclarece a sequência da visão. “Eis que” preserva o marcador visionário, e “recinto” mantém deliberadamente a imagem espacial sem especificação excessiva.
