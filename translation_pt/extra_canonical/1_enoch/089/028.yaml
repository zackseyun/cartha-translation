base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/028.yaml
  text: But the sheep passed from that water and went out into a wilderness where there was no water or grass[a]; and they began to open their eyes and to see. And I saw the Lord of the sheep shepherding them and giving them water and grass[d][c][b], and that sheep going and leading them.
translation:
  language: pt
  text: Mas aquelas ovelhas partiram daquela água e saíram para um deserto onde não havia água nem capim. Então começaram a abrir os olhos e a ver.[a] E vi o Senhor das ovelhas pastoreando-as e dando-lhes água e capim,[b] e aquela ovelha caminhando e conduzindo-as.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A abertura dos olhos provavelmente representa despertar ou percepção renovada dentro da visão; a tradução preserva, porém, a imagem explícita das ovelhas.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pasto” ou “forragem”. O termo ge''ez designa vegetação que serve de alimento ao rebanho.'
    reason: lexical_alternative
  - marker: c
    text: 'A construção ge''ez apresenta a ovelha caminhando e conduzindo o rebanho como parte daquilo que o vidente viu; também seria possível traduzir de modo menos estrito: “enquanto aquela ovelha caminhava e as conduzia”.'
    reason: previous_rendering
lexical_decisions:
- source_word: አባግዕሰ
  choice: aquelas ovelhas
  rationale: Preserva a força demonstrativa e a referência ao grupo de ovelhas já mencionado na visão.
- source_word: ኃለፉ እምዝኩ ማይ
  choice: partiram daquela água
  rationale: Expressa o afastamento do lugar aquático anterior sem especificar indevidamente uma travessia.
- source_word: ውስተ በድው
  choice: para um deserto
  rationale: É uma formulação natural em português e mantém o cenário ermo da narrativa, sem exigir uma paisagem inteiramente arenosa.
- source_word: ኀበ አልቦ ማየ ወሣዕረ
  choice: onde não havia água nem capim
  rationale: A construção com 'nem' exprime naturalmente a dupla privação; 'capim' é claro para leitores brasileiros e adequado como alimento do rebanho.
- source_word: አኃዙ ይክሥቱ አዕይንቲሆሙ ወይሬእዩ
  choice: começaram a abrir os olhos e a ver
  rationale: Mantém tanto a imagem animal literal quanto sua possível dimensão simbólica de percepção ou despertar.
- source_word: እግዚኦሙ ለአባግዕ
  choice: o Senhor das ovelhas
  rationale: Conserva o título próprio da visão sem substituir a metáfora por uma identificação interpretativa.
- source_word: ይርዕዮሙ
  choice: pastoreando-as
  rationale: Preserva a ação pastoral ativa, mais ampla do que simplesmente alimentar.
- source_word: ይሁቦሙ ማየ ወሣዕረ
  choice: dando-lhes água e capim
  rationale: Reproduz diretamente a provisão que reverte a privação do deserto.
- source_word: ዝኩ በግዕ
  choice: aquela ovelha
  rationale: Mantém a referência demonstrativa a uma ovelha específica já presente na sequência visionária.
- source_word: እንዘ የሐውር ወይመራሖሙ
  choice: caminhando e conduzindo-as
  rationale: Como complemento de 'vi', os gerúndios preservam a ação em curso e o paralelismo com 'pastoreando' e 'dando'.
theological_decisions:
- issue: Identidade do 'Senhor das ovelhas'
  choice: Manter 'o Senhor das ovelhas' sem explicação no corpo do texto
  alternative: Deus, o pastor de Israel
  rationale: Embora a figura seja divina no contexto da visão, a tradução deve conservar a metáfora apocalíptica em vez de substituí-la por uma interpretação.
- issue: Sentido de as ovelhas abrirem os olhos
  choice: Conservar a formulação visionária literal
  alternative: Elas adquiriram entendimento
  rationale: A expressão pode representar despertar ou percepção renovada, mas o texto sustenta uma tensão intencional entre imagem literal e significado simbólico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Capim' foi preferido a 'erva' por comunicar de modo imediato a vegetação consumida pelas ovelhas; 'pasto' permanece em nota como alternativa. Os gerúndios após 'vi' mantêm a estrutura de percepção e as ações simultâneas do original.
