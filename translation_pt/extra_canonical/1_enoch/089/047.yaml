base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/047.yaml
  text: And the first ram pursued that later ram[a], and that later ram rose up and fled from before his face[c][b]; and I saw until those dogs brought down the first ram.
translation:
  language: pt
  text: O primeiro carneiro[a] perseguiu aquele carneiro seguinte[b], e aquele carneiro seguinte se levantou e fugiu de diante dele[c]; e vi até que aqueles cães derrubaram o primeiro carneiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo aqui traduzido como “carneiro” pode ter outro sentido zoológico em contextos diferentes, mas nesta parte da visão designa o carneiro que lidera as ovelhas.
    reason: lexical_alternative
  - marker: b
    text: Ou “carneiro subsequente”; o termo indica aquele que veio depois, em contraste com o “primeiro”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “fugiu de diante do seu rosto”, expressão semítica que significa fugir ou recuar diante de alguém.
    reason: literal_expression
lexical_decisions:
- source_word: ሐርጌ
  choice: carneiro
  rationale: Embora o vocábulo possa ter outros sentidos zoológicos em diferentes contextos, nesta passagem da alegoria animal ele designa os carneiros que aparecem entre as ovelhas. “Carneiro” preserva a coerência das figuras no contexto imediato.
- source_word: ቀዳማዊ
  choice: primeiro
  rationale: Marca a precedência de um dos dois carneiros e contrasta diretamente com ዳሓራዊ/ዳሕራዊ.
- source_word: ዳሓራዊ / ዳሕራዊ
  choice: posterior
  rationale: Indica o carneiro que vem depois, sem afirmar necessariamente que seja o último de toda a série.
- source_word: ሰደዶ
  choice: perseguiu
  rationale: Expressa perseguição ativa e mantém o tom narrativo digno.
- source_word: ተንሥአ
  choice: se levantou
  rationale: Reproduz o movimento expresso pelo verbo antes da fuga.
- source_word: ነፍጸ
  choice: fugiu
  rationale: No contexto, descreve retirada diante do perseguidor, não apenas uma evasão abstrata.
- source_word: እምቅድመ ገጹ
  choice: de diante dele
  rationale: Transmite em português natural a expressão semítica que, literalmente, diz “de diante do seu rosto”.
- source_word: አክላብ
  choice: cães
  rationale: É o correspondente direto do substantivo plural e preserva a figura animal da visão.
- source_word: አውደቅዎ
  choice: derrubaram
  rationale: Comunica de modo natural o sentido causativo de fazer cair ou abater.
theological_decisions:
- issue: Identidade das figuras animais na alegoria
  choice: Manter “carneiro” e “cães” no texto, sem substituí-los por personagens ou povos históricos.
  alternative: Identificar diretamente as figuras como governantes, nações ou outros agentes históricos.
  rationale: A tradução deve conservar a retórica simbólica da visão e não transformar uma possível interpretação histórica em parte do texto.
- issue: Sentido contextual de ሐርጌ
  choice: Traduzir como “carneiro” nesta passagem.
  alternative: Traduzir como “javali”, com base em outro sentido lexical possível.
  rationale: O código zoomórfico e o contexto próximo apresentam esses animais como carneiros entre as ovelhas; “javali” confundiria esta figura com os animais selvagens mencionados em outro ponto da visão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação narrativa do ge’ez foi preservada, mas “e vi até que” foi vertido idiomaticamente como “e continuei olhando até que”. A repetição de “carneiro” foi mantida por clareza e para conservar o contraste entre o primeiro e o posterior.
