base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/033.yaml
  text: And the Lord of the sheep was exceedingly angry with them[a], and that sheep knew it, and came down from the summit of the rock, and came to the sheep[c][b], and found the greater part of them with their eyes blinded, and those who had gone astray.
translation:
  language: pt
  text: E o Senhor das ovelhas ficou extremamente irado com elas. Aquela ovelha percebeu isso, desceu do cume da rocha, foi até as ovelhas e encontrou a maior parte delas com os olhos obscurecidos[a], bem como as que haviam se desviado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os olhos escurecidos”. A expressão indica visão obscurecida ou impedida, não necessariamente cegueira total.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: o Senhor das ovelhas
  rationale: Preserva a relação de posse e o registro elevado da figura divina no Apocalipse dos Animais, sem substituir a imagem por uma interpretação.
- source_word: ተምዐዐ ዲቤሆሙ መዐተ ዐቢየ
  choice: ficou extremamente irado com elas
  rationale: Expressa com naturalidade a construção intensiva de ira, mantendo sua força.
- source_word: ወአእመረ ዝኩ በግዕ
  choice: Aquela ovelha percebeu isso
  rationale: A expressão 'aquela ovelha' funciona como sujeito do verbo. 'Percebeu isso' comunica o reconhecimento da situação e corresponde ao contraste narrativo com a falta de conhecimento anterior.
- source_word: ወወረደ እምነ ድማኅ ለኵኵሕ
  choice: desceu do cume da rocha
  rationale: Traduz explicitamente ድማኅ como 'cume' e mantém a rocha como referência topográfica, sem introduzir o adjetivo 'alta'.
- source_word: ኀበ አባግዕት
  choice: foi até as ovelhas
  rationale: Mantém a direção do movimento e a linguagem simbólica de ovelhas.
- source_word: ዘመብዝኅቶሙ
  choice: a maior parte delas
  rationale: Representa o sentido quantitativo de maioria sem ampliar para a totalidade.
- source_word: ዘጽሉለ አዕይንቲሆሙ
  choice: com os olhos obscurecidos
  rationale: Preserva a imagem de visão impedida e a forma resultativa/passiva, sem afirmar necessariamente cegueira completa e permanente.
- source_word: እለ ስሕቱ
  choice: as que haviam se desviado
  rationale: Conserva tanto a imagem literal de ovelhas que se afastam quanto sua dimensão moral, sem explicitar uma interpretação.
theological_decisions:
- issue: Título da figura que governa as ovelhas
  choice: Senhor das ovelhas
  alternative: dono das ovelhas / mestre das ovelhas
  rationale: '''Senhor'' mantém o registro teológico e régio do contexto visionário, sem acrescentar identificação cristológica.'
- issue: Sujeito que percebe e desce da rocha
  choice: aquela ovelha
  alternative: o Senhor das ovelhas
  rationale: A ordem e a função gramatical de ዝኩ በግዕ apontam para 'aquela ovelha' como sujeito de 'percebeu'; a continuidade verbal favorece o mesmo sujeito para a descida.
- issue: Natureza da deficiência visual
  choice: olhos obscurecidos
  alternative: olhos cegos
  rationale: A formulação preserva a imagem de obscurecimento ou impedimento da visão sem transformar uma expressão potencialmente graduada em cegueira absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de 'ovelhas' foi mantida por fazer parte da estrutura simbólica da visão. A pontuação divide a longa cadeia narrativa sem alterar a sequência dos acontecimentos.
