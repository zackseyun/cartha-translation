base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/020.yaml
  text: And the Lord of the sheep came to them[a], and while they were striking those wolves, and the wolves were crying out, the sheep became silent[c][b], and from that time they cried out no more.
translation:
  language: pt
  text: E o Senhor das ovelhas veio até elas e, enquanto golpeavam aqueles lobos e os lobos gritavam, as ovelhas ficaram em silêncio e, desde então, não voltaram a gritar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A transcrição fornecida traz, no fim, uma forma que pode ser entendida como «gritaram», o que entra em tensão com «ficaram em silêncio». A leitura crítica provável é «cessaram»; por isso, o texto traduz a ideia como «não voltaram a gritar».
    reason: textual_variant
lexical_decisions:
- source_word: እግዚኦሙ
  choice: o Senhor das ovelhas
  rationale: Explicita o referente do possessivo dentro da simbologia animal do contexto, sem acrescentar linguagem doutrinária posterior.
- source_word: መጽአ፡ ኀቤሆሙ
  choice: veio até elas
  rationale: Expressa naturalmente o movimento em direção às ovelhas; o pronome feminino concorda com o referente em português.
- source_word: አባግዕ
  choice: ovelhas
  rationale: Mantém a identidade simbólica reiterada dos animais, em vez de suavizá-la com o coletivo «rebanho».
- source_word: ይዝብጥዎሙ፡ ለእልኩ፡ አዝእብት
  choice: eles golpeavam aqueles lobos
  rationale: Trata ለ como marcador do objeto e, portanto, os lobos como aqueles que recebem os golpes. «Golpeavam» comunica violência física sem especificar indevidamente o modo da ação.
- source_word: አዝእብት፡ እንዘ፡ የአውይዉ
  choice: os lobos gritavam
  rationale: Preserva os lobos como sujeito do clamor e usa um verbo amplo, que não restringe o som a uivo ou lamento.
- source_word: አባግዕ፡ አርመሙ
  choice: as ovelhas ficaram em silêncio
  rationale: Comunica a passagem ao silêncio e conserva o contraste narrativo com o grito dos lobos.
- source_word: ወእምሶቤሃ፡ አፀርኁ
  choice: e, desde então, não tornaram a gritar
  rationale: Segue a leitura crítica provável «cessaram», em lugar da forma transcrita por OCR que produziria «gritaram». Explicita de modo natural a ação elíptica que cessou, mas registra a dificuldade textual em nota.
theological_decisions:
- issue: Identificação da figura divina na visão dos animais
  choice: o Senhor das ovelhas
  alternative: o senhor delas
  rationale: O contexto da visão apresenta o soberano das ovelhas como figura divina. A formulação mantém a metáfora e torna clara a relação possessiva sem introduzir uma identificação cristológica ou confessional específica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente e preservação da repetição simbólica de «ovelhas» e «lobos». O sujeito de «golpeavam» permanece deliberadamente não identificado, como no texto-fonte.
