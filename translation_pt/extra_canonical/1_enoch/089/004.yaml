base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/004.yaml
  text: And water[a], and darkness, and mist increased upon it; and I looked at the height of that water, and that water rose above that enclosure[d][c][b], and it poured over the enclosure and stood upon the earth.
translation:
  language: pt
  text: E a água, a escuridão e a névoa[a] aumentaram sobre ele.[b] E observei a altura daquela água; ela se elevou acima daquele cercado[c], derramou-se sobre o cercado e permaneceu sobre a terra.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “neblina”. O termo ge’ez indica uma obscuridade vaporosa associada à água e à escuridão.
    reason: lexical_alternative
  - marker: b
    text: A transcrição disponível traz uma forma provavelmente corrompida; a leitura reconhecida como subjacente significa “aumentaram” ou “multiplicaram-se”.
    reason: textual_note
  - marker: c
    text: “Cercado” também pode ser entendido como “pátio”, “redil” ou, mais especificamente no simbolismo animal da visão, “aprisco”.
    reason: lexical_alternative
  - marker: d
    text: O singular “água” é mantido do ge’ez. O contexto sugere uma inundação, mas o texto não emprega aqui um termo explícito para “dilúvio”.
    reason: cultural_note
lexical_decisions:
- source_word: ወበዝን (provável erro de transcrição por ወበዝኀ)
  choice: aumentaram
  rationale: A leitura corrigida corresponde ao verbo ‘aumentar, multiplicar-se’ e concorda com a água, a escuridão e a névoa, preservando a intensificação da cena.
- source_word: ማይ
  choice: água
  rationale: O substantivo aparece no singular e pode ser mantido naturalmente em português como nome de massa, sem explicitar de modo interpretativo ‘dilúvio’ ou ‘águas da inundação’.
- source_word: ጽልመት
  choice: escuridão
  rationale: Equivalente direto que conserva a atmosfera ameaçadora da visão.
- source_word: ጊሜ
  choice: névoa
  rationale: Expressa a obscuridade vaporosa associada à água e à escuridão; ‘neblina’ também é possível.
- source_word: አሬኢ
  choice: observei
  rationale: Mantém a narração visionária em primeira pessoa e introduz naturalmente o objeto observado.
- source_word: መልዕልተ
  choice: altura
  rationale: Preserva a dimensão vertical do termo e prepara a afirmação de que a água se elevou acima do cercado.
- source_word: ተላዐለ
  choice: se elevou acima
  rationale: Reproduz o movimento ascendente sem acrescentar uma identificação explícita com o dilúvio.
- source_word: ዐጸድ
  choice: cercado
  rationale: Designa de maneira ampla um espaço delimitado e se ajusta ao simbolismo animal sem impor a tradução mais específica ‘aprisco’.
- source_word: ይከዑ
  choice: derramou-se sobre
  rationale: Comunica o movimento vigoroso da água por cima do cercado e a inundação resultante.
- source_word: ቆመ
  choice: permaneceu
  rationale: Neste contexto, o verbo indica que a água ficou estabelecida ou retida sobre a terra; uma reprodução literal como ‘ficou de pé’ seria pouco natural em português.
theological_decisions:
- issue: Explicitar ou não a imagem do dilúvio
  choice: Manter ‘água’ no singular.
  alternative: ‘águas da inundação’ ou ‘dilúvio’
  rationale: Embora o contexto evoque claramente uma inundação, o testemunho ge’ez repete ‘água’. A tradução deixa que o leitor reconheça a imagem sem inseri-la explicitamente.
- issue: Especificidade do espaço delimitado na visão animal
  choice: Traduzir ዐጸድ por ‘cercado’.
  alternative: ‘aprisco’, ‘pátio’ ou ‘redil’
  rationale: ‘Cercado’ conserva a referência a um recinto delimitado sem decidir que se trata especificamente de um aprisco, interpretação possível mas não exigida pelo versículo.
- issue: Sentido de ቆመ aplicado à água
  choice: Usar ‘permaneceu’.
  alternative: ‘ficou’ ou, literalmente, ‘parou/ficou de pé’
  rationale: ‘Permaneceu’ comunica que a água se manteve sobre a terra e preserva a imagem visionária sem produzir uma formulação artificial.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. Conservou-se a repetição de ‘cercado’ e o singular coletivo ‘água’ para refletir a forma do testemunho ge’ez. ‘Observei a altura’ mantém a imagem vertical, ainda que seja uma formulação um pouco mais solene do que a fala cotidiana.
