base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/024.yaml
  text: And that pool of water was split[a], and the water stood on this side and on that side before their faces; and their Lord, while he was leading them[e][d][c][b], stood between them and the wolves.
translation:
  language: pt
  text: E aquele curso de água se dividiu[a], e a água ficou erguida deste lado e daquele, diante deles; e o senhor deles, enquanto os conduzia, ficou entre eles e os lobos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “canal de água”. A expressão ge’ez designa um curso ou uma passagem delimitada de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዐይገ፡ ማይ
  choice: porção de água
  rationale: O sintagma designa uma extensão ou corpo delimitado de água. “Porção de água” mantém a imagem concreta e permite a alternativa “reservatório de água” em nota, sem impor a ideia mais específica de canal.
- source_word: ተሠጠ
  choice: se dividiu
  rationale: O verbo exprime separação ou abertura. “Se dividiu” é natural em português e preserva a imagem visionária.
- source_word: ቆመ፡ ማይ
  choice: a água ficou erguida
  rationale: Literalmente, a água “ficou de pé”. A formulação escolhida comunica água mantida verticalmente, sem soar involuntariamente cômica em português.
- source_word: እምዝየ፡ ወእምዝየ
  choice: deste lado e daquele
  rationale: Reproduz com clareza a distribuição espacial da água nos dois lados.
- source_word: በቅድመ፡ ገጾሙ
  choice: diante deles
  rationale: A expressão é literalmente “diante de seus rostos”, mas “diante deles” preserva o sentido espacial em português corrente sem artificialidade.
- source_word: እግዚኦሙ
  choice: o senhor deles
  rationale: Mantém a relação de autoridade no nível narrativo da alegoria. A inicial minúscula evita decidir que aqui se trata diretamente de um título divino.
- source_word: እንዘ፡ ይመራሖሙ
  choice: enquanto os conduzia
  rationale: A construção indica ação simultânea e continuada; “enquanto” conserva esse valor aspectual.
- source_word: ወቆመ፡ ማእከሎሙ፡ ወማእከለ፡ አዝእብት
  choice: ficou entre eles e os lobos
  rationale: O sujeito do segundo verbo é “o senhor deles”, e não a água. A tradução conserva sua posição de separação entre o grupo e os lobos.
theological_decisions:
- issue: Referente de “o senhor deles” na alegoria
  choice: manter “senhor” em minúscula, como designação do líder do rebanho dentro da visão
  alternative: “o Senhor deles”, como referência direta a Deus, ou uma sobreposição intencional entre o líder alegórico e a orientação divina
  rationale: A sintaxe faz de “o senhor deles” o sujeito de “ficou” e o associa à ação de conduzi-los. A minúscula preserva o nível imediato da alegoria sem excluir possíveis ressonâncias divinas.
- issue: Sujeito da segunda ocorrência de ቆመ
  choice: “o senhor deles” ficou entre eles e os lobos
  alternative: a água ficou entre eles e os lobos
  rationale: A sequência sintática introduz ወእግዚኦሙ como sujeito do segundo ወቆመ. Isso deve ser explicitado em português para evitar a leitura sintaticamente incorreta de que a água seja o sujeito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Evitou-se o literalismo pouco natural “diante de seus rostos”, mas conservaram-se a estrutura visionária, a repetição da água e a ambiguidade do título “senhor”.
