base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/001.yaml
  text: At that time I said[a], “For what reason is this blessed land, all of it full of trees[b], and this accursed valley in their midst?”
translation:
  language: pt
  text: 'Naquele tempo, eu disse: “Por que esta terra é abençoada, e toda ela está cheia de árvores,[a] e este vale, no meio delas, é amaldiçoado?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão relativa à vegetação é textualmente difícil neste testemunho; o sentido geral é que a terra está abundantemente coberta de árvores ou outra vegetação.
    reason: textual_variant
lexical_decisions:
- source_word: ውእቱ ጊዜ
  choice: Naquele tempo
  rationale: Preserva a fórmula temporal narrativa e o registro elevado sem soar arcaico.
- source_word: እቤ
  choice: eu disse
  rationale: Traduz diretamente a fórmula de fala; a pergunta permanece expressa no discurso direto.
- source_word: በእንተ ምንት
  choice: Por que
  rationale: Expressa naturalmente em português a investigação de causa ou finalidade.
- source_word: ዛቲ ምድር ቡርክት
  choice: esta terra é abençoada
  rationale: Mantém o cenário localizado e o contraste valorativo com o vale amaldiçoado.
- source_word: ወኵለንታሃ ምልእት
  choice: e toda ela está cheia
  rationale: Conserva tanto a conjunção quanto a ideia de totalidade da expressão ge'ez.
- source_word: ዕፀወ ወዛ ቈላ
  choice: de árvores
  rationale: Comunica a imagem vegetativa principal sem especificar excessivamente uma sequência cuja leitura é textualmente difícil.
- source_word: ርጉምት
  choice: amaldiçoado
  rationale: Preserva a forte oposição moral e sacral a “abençoada”.
- source_word: ማእከሎሙ
  choice: no meio delas
  rationale: Mantém a localização espacial do vale entre as árvores ou no cenário descrito, sem eliminar a possível ambiguidade do referente plural.
theological_decisions:
- issue: Contraste valorativo entre a terra e o vale
  choice: abençoada / amaldiçoado
  alternative: fértil / estéril
  rationale: O texto apresenta uma polaridade moral-sacral ligada ao juízo, não apenas uma diferença agrícola.
- issue: Relação sintática entre a terra abençoada e o vale amaldiçoado
  choice: enquanto
  alternative: e
  rationale: “Enquanto” torna inteligível em português o contraste implícito na pergunta, sem explicar a razão teológica do contraste.
