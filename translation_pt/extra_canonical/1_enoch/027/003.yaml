base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/003.yaml
  text: In the latter days this will become for them a spectacle of righteous judgment in the presence of the righteous forever[a]; all the days here the wise will bless the Lord of glory[d][c][b], the eternal King.
translation:
  language: pt
  text: Nos últimos dias, isto se tornará para eles um espetáculo de julgamento justo diante dos justos para sempre[a]; aqui, todos os dias, os sábios abençoarão o Senhor da glória, o Rei eterno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “para sempre” está entre colchetes no testemunho etíope e, portanto, é textualmente incerta. Sua ligação exata com as palavras anteriores também não é segura.
    reason: textual_variant
  - marker: b
    text: “Os sábios” também pode ser entendido, conforme a análise da forma etíope, como “os misericordiosos” ou “os que receberam misericórdia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: በዳኃሪ፡ መዋዕል
  choice: Nos últimos dias
  rationale: Preserva o horizonte futuro e escatológico da expressão em linguagem apocalíptica natural.
- source_word: ይከውን፡ ላዕሌሆሙ
  choice: isto se tornará para eles
  rationale: Mantém o valor futuro de tornar-se e a relação expressa pela preposição, sem forçar um sentido exclusivamente espacial.
- source_word: አርአያ
  choice: um espetáculo
  rationale: Conserva a dimensão visível e pública do termo, que também pode significar sinal, aparência ou exemplo.
- source_word: ኵነኔ፡ ዘበ፡ ጽድቅ
  choice: de julgamento justo
  rationale: Expressa de modo conciso que o julgamento se caracteriza pela justiça.
- source_word: በቅድመ፡ ጻድቃን
  choice: diante dos justos
  rationale: Reproduz a ideia espacial e pública da cena sem ampliar o texto.
- source_word: ለዓለም
  choice: para sempre
  rationale: É a tradução idiomática do valor durativo provável; a incerteza do testemunho é indicada em nota.
- source_word: ኵሎ፡ መዋዕለ፡ ዝየ
  choice: durante todos os dias aqui
  rationale: Traduz ዝየ espacialmente como “aqui”, conforme a leitura lexical mais direta, e liga a expressão temporal ao verbo seguinte.
- source_word: ምሑራን
  choice: os sábios
  rationale: Segue a leitura contextual adotada pela camada de consulta revisada; a possível análise como “os misericordiosos” ou “os que receberam misericórdia” é preservada em nota.
- source_word: ይባርክዎ
  choice: abençoarão
  rationale: Mantém o sentido verbal direto de bendizer ou abençoar.
- source_word: ለእግዚአ፡ ስብሐት
  choice: o Senhor da glória
  rationale: Traduz diretamente o título divino, preservando seu registro elevado.
- source_word: ንጉሥ፡ ዘለዓለም
  choice: o Rei eterno
  rationale: Conserva a afirmação da realeza divina caracterizada pela eternidade.
theological_decisions:
- issue: Forma dos títulos divinos
  choice: o Senhor da glória, o Rei eterno
  alternative: o Senhor da majestade, o Rei para sempre
  rationale: Mantém os dois títulos em aposição e evita harmonizá-los desnecessariamente com fórmulas confessionais posteriores.
- issue: Identidade de ምሑራን
  choice: os sábios
  alternative: os misericordiosos / os que receberam misericórdia
  rationale: A tradição lexical e as revisões fornecidas divergem quanto à raiz e ao sentido. A leitura contextual “os sábios” é mantida no texto, enquanto a ambiguidade real é explicitada em nota, sem transformá-la em afirmação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve elevação adequada ao gênero apocalíptico. A sintaxe semicolonada conserva a continuidade do original, e as notas registram as incertezas textual e lexical relevantes.
