base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/002.yaml
  text: At that time Uriel[a], one of the holy angels who was with me, answered me and said to me, “This accursed valley is for those who are accursed forever. Here all those will be gathered who speak with their mouths improper words against the Lord, and who utter harsh things concerning his glory. Here they will be gathered[b], and here will be their place of judgment.”
translation:
  language: pt
  text: 'Naquele tempo, Uriel, um dos santos anjos que estava comigo, respondeu-me e disse: “Este vale amaldiçoado é destinado aos que estão amaldiçoados para sempre. Aqui serão reunidos todos os que proferem com a própria boca palavras impróprias contra o Senhor e dizem coisas terríveis a respeito da glória dele.[a] Aqui os reunirão,[b] e aqui será o lugar do julgamento deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Palavras impróprias” também pode ser traduzido por “palavras indignas” ou “palavras que não são corretas”. “Coisas terríveis” indica fala chocante, grave ou insolente a respeito da glória do Senhor.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo ge''ez é causativo: a ideia é que essas pessoas serão reunidas ali. O agente da ação não é identificado.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: አውሥአኒ
  choice: respondeu-me
  rationale: Preserva o sentido usual de responder e o contexto dialogal da visão.
- source_word: ቅዱሳን መላእክት
  choice: santos anjos
  rationale: É a designação apocalíptica transparente e corrente em português.
- source_word: ዛቈላ
  choice: vale
  rationale: Representa naturalmente a geografia visionária sem estreitar o termo a desfiladeiro ou ravina.
- source_word: ርጉምት
  choice: amaldiçoado
  rationale: Mantém o tom solene e judicial, indicando que o lugar está sob maldição.
- source_word: ለርጉማን እስከ ለዓለም
  choice: destinado aos que estão amaldiçoados para sempre
  rationale: Identifica os ocupantes do vale e conserva a duração expressa pela frase; 'destinado' torna natural em português a relação indicada pelo dativo.
- source_word: ይትጋብኡ
  choice: serão reunidos
  rationale: A forma passiva/reflexiva combina com a reunião escatológica para julgamento.
- source_word: በአፉሆሙ
  choice: com a própria boca
  rationale: Conserva a imagem corporal explícita e torna idiomática a formulação em português.
- source_word: ላዕለ እግዚአብሔር
  choice: contra o Senhor
  rationale: O contexto de fala condenável favorece a força adversativa da preposição.
- source_word: ቃለ ዘኢይደሉ
  choice: palavras impróprias
  rationale: Comunica fala inadequada ou indigna sem definir o delito com precisão maior que a do texto.
- source_word: ስብሐቲ ዚአሁ
  choice: a glória dele
  rationale: Neste contexto, 'glória' é o equivalente bíblico mais claro; 'dele' evita possível ambiguidade referencial de 'sua'.
- source_word: ይትናገሩ ዕፁብተ
  choice: dizem coisas terríveis
  rationale: Exprime a força chocante, grave ou insolente da fala em português natural, sem reduzi-la apenas a palavras de tom áspero.
- source_word: ያስተጋብእዎሙ
  choice: eles serão reunidos
  rationale: Embora a forma possa sugerir reunião causativa, a construção passiva em português conserva o motivo da reunião e evita introduzir agentes não identificados.
- source_word: ምኵናኒሆሙ
  choice: o lugar do julgamento deles
  rationale: Em ligação com o 'aqui' repetido, apresenta o vale como local do julgamento sem identificá-lo simplesmente com a condenação.
theological_decisions:
- issue: Natureza da fala condenada
  choice: Fala imprópria contra o Senhor e terrível a respeito da glória dele
  alternative: Blasfêmia em sentido técnico ou fala perversa em geral
  rationale: A tradução preserva os dois aspectos da formulação ge'ez sem impor uma categoria doutrinária ou jurídica posterior.
- issue: Força da cláusula final sobre o julgamento
  choice: O vale é o lugar em que os amaldiçoados são reunidos e julgados
  alternative: O próprio vale é a condenação deles, ou a referência ao julgamento é apenas abstrata
  rationale: A repetição de 'aqui' dá destaque à localização na geografia da visão, enquanto o substantivo mantém a dimensão judicial.
- issue: Duração da maldição
  choice: para sempre
  alternative: por uma era ou por tempo indeterminado
  rationale: A expressão እስከ ለዓለም, neste contexto escatológico, aponta naturalmente para duração permanente, sem acrescentar uma teoria sobre a natureza da pena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a repetição solene de “aqui” e o paralelismo da fala de Uriel. Os marcadores [a] e [b] aparecem no texto principal.
