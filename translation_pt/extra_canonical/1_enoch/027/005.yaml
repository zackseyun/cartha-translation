base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/005.yaml
  text: At that time I blessed the Lord of glory[b][a], and I spoke and sang praise as is fitting for his majesty.
translation:
  language: pt
  text: Naquele tempo, abençoei o Senhor da glória, proclamei a sua glória[a] e entoei louvores, como convém à sua majestade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A transcrição etíope fornecida traz aqui uma forma difícil, que poderia sugerir “falei dele” ou “falei com ele”. Contudo, o texto etíope padrão desta edição e o testemunho grego apoiam “proclamei a sua glória”.
    reason: variante textual e correção provável de transcrição/OCR
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: Naquele tempo
  rationale: Preserva a fórmula temporal narrativa em português natural e solene.
- source_word: ባረክዎ
  choice: bendisse
  rationale: Mantém o sentido verbal direto de abençoar a Deus, sem confundi-lo com os verbos posteriores de proclamação e canto.
- source_word: ለእግዚአ፡ ስብሐት
  choice: o Senhor da glória
  rationale: Reproduz de modo compacto o título divino formado por 'Senhor' e 'glória', com registro doxológico natural.
- source_word: ወስብሐቲሁ፡ ነገርኩ
  choice: proclamei a sua glória
  rationale: Adota a leitura documentada do texto padrão de Charles, apoiada pelo grego τὴν δόξαν αὐτοῦ, em vez da forma problemática ወተሎቱ da transcrição fornecida. 'Proclamei' comunica o ato público de declarar ou relatar.
- source_word: ወዘመርኩ
  choice: e entoei louvores
  rationale: Expressa o canto em contexto de adoração sem recorrer à formulação menos natural 'fiz melodia'.
- source_word: በከመ፡ ይደሉ
  choice: como convém
  rationale: Transmite com concisão a ideia de propriedade, adequação ou dignidade.
- source_word: ለዕበዩ
  choice: à sua majestade
  rationale: O substantivo pode indicar grandeza ou majestade; 'majestade' se ajusta ao contexto elevado e evita repetição de 'glória'.
theological_decisions:
- issue: Título divino እግዚአ
  choice: Senhor
  alternative: Soberano
  rationale: '''Senhor'' é a tradução estabelecida e natural em linguagem de adoração; ''Soberano'' explicitaria uma nuance possível, mas alteraria a forma do título.'
- issue: Sentido da frase após 'Senhor da glória'
  choice: proclamei a sua glória
  alternative: falei dele / falei com ele
  rationale: A leitura 'sua glória' possui apoio na forma etíope padrão de Charles e no testemunho grego, enquanto as alternativas dependem da transcrição problemática fornecida. A nota preserva transparência quanto à divergência.
translation_notes:
  register: Português moderno, claro e digno, com cadência doxológica. Emprega 'bendisse', 'proclamei' e 'entoei louvores' para distinguir os três movimentos verbais sem linguagem arcaizante excessiva.
