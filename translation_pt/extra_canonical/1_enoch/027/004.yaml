base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/004.yaml
  text: In the days of their judgment they will bless him for the mercy[b][a], according as he has apportioned to them.
translation:
  language: pt
  text: Nos dias do julgamento deles, eles o bendirão pela misericórdia, conforme ele lhes repartiu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto não declara expressamente o que ele lhes repartiu; pode estar em vista uma medida, sorte ou porção de misericórdia ou bênção.
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕለ
  choice: dias
  rationale: Mantém o plural temporal concreto e o marcador apocalíptico do texto, sem generalizá-lo como “tempo”.
- source_word: ኵነኔሆሙ
  choice: julgamento deles
  rationale: Conserva o sentido judicial amplo do substantivo e não o restringe a “condenação” ou “castigo”.
- source_word: ይባርክዎ
  choice: eles o bendirão
  rationale: 'A forma verbal tem sujeito na terceira pessoa do plural e sufixo de objeto masculino singular: “eles bendirão a ele”. “Bendizer” expressa naturalmente em português a bênção dirigida a Deus.'
- source_word: በምሕረት
  choice: pela misericórdia
  rationale: 'Neste contexto, a preposição é entendida em sentido causal: eles o bendizem por causa da misericórdia recebida. O substantivo “misericórdia” é mantido explicitamente.'
- source_word: በከመ
  choice: conforme
  rationale: Expressa a relação de correspondência ou medida introduzida pela conjunção, com linguagem portuguesa natural.
- source_word: ከፈሎሙ
  choice: ele lhes repartiu
  rationale: Preserva o sentido de dividir ou distribuir e mantém implícito, como no ge’ez, aquilo que foi repartido.
theological_decisions:
- issue: Se o julgamento deve ser entendido especificamente como condenação ou castigo
  choice: julgamento
  alternative: condenação; castigo
  rationale: O termo ge’ez é judicial e mais amplo. A referência imediata à misericórdia favorece a preservação dessa amplitude, sem antecipar uma interpretação estritamente punitiva.
- issue: Quem bendiz quem em ይባርክዎ
  choice: eles o bendirão
  alternative: ele os abençoará
  rationale: A morfologia indica sujeito plural e objeto masculino singular. Essa leitura também preserva o movimento teológico do grupo que responde à misericórdia bendizendo aquele que a concedeu.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Bendizer” foi preferido a “abençoar” porque, neste caso, seres humanos dirigem a bênção a Deus. A construção final permanece deliberadamente elíptica para não acrescentar um objeto ausente no ge’ez.
