- from: 'Registrei a petição de vocês e, em minha visão, isto me foi mostrado: a petição de vocês não lhes será concedida por todos os dias da eternidade[a]; a sentença contra vocês foi consumada[b], e ela não lhes será concedida.'
  to: 'Registrei a petição de vocês e, em minha visão, foi-me mostrado o seguinte: a petição de vocês não lhes será concedida em todos os dias da eternidade[a], e o julgamento contra vocês foi concluído[b], e ela não lhes será concedida.'
  rationale: A revisão preserva a repetição enfática e a construção visionária do texto, mas substitui “sentença ... consumada” por uma formulação judicial que em português transmite conclusão definitiva, sem sugerir a execução da pena. Também aprimora a fluência da fórmula introdutória e da duração eterna.
