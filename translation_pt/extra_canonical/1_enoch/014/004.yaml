base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/004.yaml
  text: 'I wrote down your petition[a], and in my vision it was shown thus: that your petition will not be granted to you for all the days of eternity, and the sentence against you has been completed[c][b], and it will not be granted to you.'
translation:
  language: pt
  text: 'Registrei a petição de vocês e, em minha visão, foi-me mostrado o seguinte: a petição de vocês não lhes será concedida em todos os dias da eternidade[a], e o julgamento contra vocês foi concluído[b], e ela não lhes será concedida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em todos os dias da era/eternidade”, fórmula enfática de duração sem fim.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a sentença contra vocês foi concluída” ou “a decisão contra vocês foi finalizada”. A tradição textual desta expressão é difícil, mas o sentido é o de um julgamento judicial já definitivamente estabelecido contra vocês.'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: ስእለትክሙ
  choice: a petição de vocês
  rationale: Expressa uma súplica formal dirigida a uma autoridade e preserva o tom judicial do apelo dos Vigilantes.
- source_word: ጻሐፍኩ
  choice: Registrei
  rationale: Comunica de modo natural o ato de pôr por escrito a petição, sem acrescentar conteúdo.
- source_word: በራእየየ
  choice: em minha visão
  rationale: Mantém o caráter de revelação visionária da passagem em português corrente.
- source_word: ከመዝ ያስተርኢ
  choice: isto me foi mostrado
  rationale: Preserva a fórmula revelatória e sua construção passiva sem identificar um agente que o texto não explicita.
- source_word: እስመ
  choice: ':'
  rationale: 'Os dois-pontos introduzem naturalmente em português o conteúdo mostrado na visão; o valor introdutório de ''que'' permanece estruturalmente representado sem a sequência pouco idiomática ''isto: que''.'
- source_word: ኢትከውነክሙ
  choice: não lhes será concedida
  rationale: No contexto, refere-se à petição; 'concedida' transmite a recusa judicial melhor que uma tradução estritamente literal como 'não será para vocês'.
- source_word: መዋዕለ ዓለም
  choice: por todos os dias da eternidade
  rationale: Conserva a fórmula enfática de duração, literalmente ligada aos 'dias' e à 'eternidade/era', bem como sua cadência apocalíptica.
- source_word: ፍጽምት
  choice: foi consumada
  rationale: Retém a ideia básica de conclusão e caráter definitivo, aplicada aqui à sentença judicial, sem convertê-la em uma paráfrase como 'plenamente decretada'.
- source_word: ላዕሌክሙ
  choice: contra vocês
  rationale: No contexto de julgamento, exprime naturalmente a força adversa da preposição 'sobre/contra'.
- source_word: ወኢይከውነ ክሙ
  choice: e ela não lhes será concedida
  rationale: Conserva a repetição enfática da recusa e explicita pelo pronome feminino que se retoma a petição.
theological_decisions:
- issue: Natureza da recusa da petição dos Vigilantes
  choice: 'Recusa judicial: “a petição de vocês não lhes será concedida”'
  alternative: “a oração de vocês não será ouvida”
  rationale: A formulação escolhida mantém o contexto jurídico-apocalíptico e não introduz a linguagem devocional de uma oração que Deus se recusaria a ouvir.
- issue: Sentido da expressão de conclusão ligada ao julgamento
  choice: “a sentença contra vocês foi consumada”
  alternative: “o julgamento foi concluído contra vocês” ou “a decisão contra vocês foi definitivamente decretada”
  rationale: “Sentença” torna claro o referente judicial, enquanto “consumada” preserva a noção de conclusão definitiva e evita resolver em excesso a forma textual difícil.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com preferência por “vocês” para legibilidade brasileira e internacional. A repetição final foi mantida por seu valor enfático; “consumada” conserva a solenidade apocalíptica sem recorrer a linguagem denominacional.
