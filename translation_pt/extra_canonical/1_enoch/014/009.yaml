base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/009.yaml
  text: And I went in until I drew near to a wall built of stones of hail[a], and a tongue of fire surrounded it[e][d][c][b], and it began to make me afraid.
translation:
  language: pt
  text: '**1 Enoque 14:9** — E entrei, até me aproximar de um muro[a] construído de pedras de granizo[b]. Uma língua de fogo o cercava, e isso começou a me causar medo.[c]


    [a] Ou «uma estrutura». Embora «muro» se ajuste ao contexto arquitetônico, o termo etíope pode designar de modo mais amplo algo construído.


    [b] Literalmente, «pedras de granizo». A expressão incomum foi mantida para preservar a imagem visionária; também poderia ser entendida como «pedras de gelo» ou simplesmente «granizo».


    [c] A forma da última oração é textualmente difícil neste testemunho. O sentido geral é que aquilo que Enoque viu começou a amedrontá-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma estrutura». Embora «muro» se ajuste ao contexto arquitetônico, o termo etíope pode designar de modo mais amplo algo construído.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «pedras de granizo». A expressão incomum foi mantida para preservar a imagem visionária; também poderia ser entendida como «pedras de gelo» ou simplesmente «granizo».
    reason: lexical_alternative
  - marker: c
    text: A forma da última oração é textualmente difícil neste testemunho. O sentido geral é que aquilo que Enoque viu começou a amedrontá-lo.
    reason: textual_variant
lexical_decisions:
- source_word: ወቦእኩ
  choice: E entrei
  rationale: Reproduz diretamente o verbo de entrada e mantém a progressão simples da visão.
- source_word: እስከ እቀርብ
  choice: até me aproximar
  rationale: Expressa o movimento continuado até a proximidade, em português natural e digno.
- source_word: ጥቅም
  choice: um muro
  rationale: O contexto arquitetônico e a evidência comparativa favorecem «muro», sem ocultar em nota a possibilidade mais ampla de «estrutura».
- source_word: ዘሕንጽት
  choice: construído
  rationale: Mantém a qualificação do muro como algo edificado, com concordância natural em português.
- source_word: በእእባነ በረድ
  choice: de pedras de granizo
  rationale: Preserva literalmente a estranha materialidade da imagem apocalíptica, em vez de reduzi-la a «granizo».
- source_word: ልሳነ እሳት
  choice: Uma língua de fogo
  rationale: Conserva o singular do etíope e a imagem concreta, importante também para a continuidade narrativa.
- source_word: የዓውዳ
  choice: o cercava
  rationale: Traduz claramente a ação de rodear ou circundar; o pronome retoma o muro.
- source_word: ወጠነ ያፍርሀኒ
  choice: começou a me causar medo
  rationale: Mantém o aspecto incoativo e o sentido causativo de provocar medo sem elevar indevidamente a intensidade para «aterrorizar».
theological_decisions:
- issue: Preservação da arquitetura visionária
  choice: muro construído de pedras de granizo ... uma língua de fogo o cercava
  alternative: estrutura feita de granizo ... chamas a rodeavam
  rationale: A redação preserva tanto a concretude arquitetônica quanto o caráter incomum das imagens, sem normalizar a visão nem lhe impor uma interpretação doutrinária.
- issue: Referente da oração final
  choice: sujeito implícito em «começou a me causar medo»
  alternative: explicitar «a língua de fogo» ou «a visão» como sujeito
  rationale: O etíope e a transmissão apresentada não permitem determinar com plena segurança o referente; evitar um substantivo explícito preserva essa ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A sintaxe é clara e digna, sem arcaísmos; as imagens apocalípticas incomuns e a ambiguidade textual real foram preservadas.
