base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/006.yaml
  text: And before this[a], you will have seen the destruction of your beloved sons, and you will not have them for yourselves[c][b], but they will fall before you by the sword.
translation:
  language: pt
  text: E, antes disso, vocês terão visto[a] a destruição de seus filhos amados e não os terão para si[b]; eles cairão diante de vocês pela espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês verão”. A forma verbal também pode ser entendida como futuro simples.'
    reason: lexical_alternative
  - marker: b
    text: O texto etíope desta expressão é difícil. A redação preservada em grego pode ser entendida como “não terão prazer ou benefício neles”; a forma etíope também foi interpretada como referência aos bens ou às posses deles.
    reason: textual_variant
lexical_decisions:
- source_word: እምቅድመ ዝንቱ
  choice: antes disso
  rationale: Expressa de modo natural a sequência temporal indicada pela locução etíope, sem especificar além do texto.
- source_word: ርኢክሙ
  choice: vocês terão visto
  rationale: O futuro perfeito comunica a leitura preditiva do perfeito no contexto e indica que eles testemunharão a destruição antes do acontecimento seguinte.
- source_word: ሐጕለ
  choice: destruição
  rationale: Preserva a gravidade da calamidade e combina com a morte violenta mencionada no fim do versículo, sem tornar o termo mais específico do que o original.
- source_word: ውሉድክሙ ፍቁራን
  choice: seus filhos amados
  rationale: No contexto, refere-se à descendência masculina dos Vigilantes; “filhos amados” é claro, natural e mantém o valor afetivo do adjetivo.
- source_word: አልብክሙ †ጥራያኒሆሙ
  choice: não os terão para si
  rationale: Segue a redação de consulta revisada e exprime privação sem transformar o termo etíope textualmente difícil em uma referência segura a bens materiais. A incerteza é registrada em nota.
- source_word: ይወድቁ ቅድሜክሙ በሰይፍ
  choice: eles cairão diante de vocês pela espada
  rationale: Mantém a fórmula vívida de juízo, a presença dos destinatários como testemunhas e o instrumento da morte.
theological_decisions:
- issue: Referente de “seus filhos amados”
  choice: Os descendentes dos Vigilantes nascidos de suas uniões ilícitas
  alternative: Filhos ou descendentes em sentido geral
  rationale: O contexto imediato é o anúncio de juízo contra os Vigilantes e sua descendência; a tradução mantém esse referente narrativo sem acrescentar categorias doutrinárias posteriores.
- issue: Sentido da cláusula após “filhos amados”
  choice: “não os terão para si”
  alternative: “não terão prazer/benefício neles” ou “não terão os bens deles”
  rationale: A forma etíope está assinalada como textualmente problemática. A tradução principal preserva uma ideia ampla de perda, enquanto a nota expõe as principais possibilidades sem decidir silenciosamente a tensão textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural. A frase conserva o tom profético e a imagem de cair pela espada; a dificuldade textual central é explicitada em nota, sem sobrecarregar o corpo do versículo.
