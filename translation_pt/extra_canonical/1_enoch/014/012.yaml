translation:
  language: pt
  text: E um fogo ardia ao redor dos muros, e debaixo deles havia um fogo ardente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra leitura, apoiada pelo testemunho grego e por uma emenda do texto etíope, é: «e suas portas ardiam em fogo».'
    reason: textual_variant
lexical_decisions:
- source_word: እሳት
  choice: fogo
  rationale: Termo comum para fogo, preservado nas duas ocorrências para manter a repetição e a intensidade da imagem apocalíptica.
- source_word: ዘይነድድ
  choice: ardia
  rationale: Expressa de modo natural em português a ação contínua do fogo no cenário da visão.
- source_word: በአውደ
  choice: ao redor
  rationale: Comunica a extensão circundante sem recorrer a linguagem arcaica.
- source_word: አረፍት
  choice: os muros
  rationale: Tomado como plural de 'muro/parede', em consonância com o uso arquitetônico no contexto próximo.
- source_word: ወጥሕቱ
  choice: e debaixo deles
  rationale: Traduz diretamente a leitura do texto fornecido, com o pronome retomando naturalmente os muros em português.
- source_word: ይውዒ በእሳት
  choice: resplandecia uma chama de fogo
  rationale: Representa a atividade intensa do fogo em português corrente, sem introduzir portas que não constam da leitura etíope fornecida.
theological_decisions:
- issue: Identificação do elemento cercado pelo fogo
  choice: os muros
  alternative: a estrutura / ao redor dela
  rationale: A leitura lexical de አረፍት como plural de 'muro' permite explicitar o referente arquitetônico, evitando a ambiguidade criada por um simples pronome.
- issue: Leitura de ወጥሕቱ diante da variante proposta por outras testemunhas
  choice: debaixo deles
  alternative: suas portas ardiam em fogo
  rationale: O texto principal segue a forma efetivamente apresentada na fonte etíope transcrita; a variante 'portas' é registrada em nota por contar com apoio do testemunho grego e de uma emenda textual conhecida.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. A repetição de “fogo” foi mantida por seu valor imagético; a variante textual relevante foi preservada em nota, sem substituir silenciosamente a leitura etíope fornecida.
