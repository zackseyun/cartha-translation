base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/015.yaml
  text: And behold[a], another house, greater than that one, and every doorway stood open before me[c][b]; and it was built with tongues of fire.
translation:
  language: pt
  text: E eis que havia outra casa, maior do que aquela, e todas as portas estavam abertas diante de mim; e ela era construída com línguas de fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com chamas de fogo”. “Línguas de fogo” preserva a imagem concreta do ge''ez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ናሁ
  choice: e eis que
  rationale: Preserva a força dêitica e visionária da expressão, comum na narrativa apocalíptica, sem reduzi-la a uma simples transição.
- source_word: ካልእ ቤት
  choice: outra casa
  rationale: Mantém o sentido arquitetônico direto de 'casa' e não explicita como templo ou palácio aquilo que o texto deixa implícito.
- source_word: ዘየዓቢ እምዝክቱ
  choice: maior do que aquela
  rationale: O comparativo pode envolver tamanho e grandeza; 'aquela' corresponde ao demonstrativo distante ዝክቱ e retoma a casa anterior.
- source_word: ኵሉ ኆኅተ
  choice: todas as portas
  rationale: Expressa de modo natural em português a totalidade distributiva das aberturas ou portas da casa, sem acrescentar um possessivo explícito.
- source_word: ርኁት በቅድሜየ
  choice: estavam abertas diante de mim
  rationale: Conserva o estado das portas e a perspectiva espacial do visionário em português corrente.
- source_word: ሕኑጽ
  choice: era construída
  rationale: Mantém o sentido arquitetônico e a forma descritiva do estado ou constituição da casa.
- source_word: በልሳናተ እሳት
  choice: com línguas de fogo
  rationale: Preserva a imagem concreta e incomum do original, sem suavizá-la para a expressão genérica 'chamas de fogo'.
theological_decisions:
- issue: Natureza da arquitetura visionária
  choice: casa
  alternative: palácio ou templo
  rationale: O substantivo ge'ez significa diretamente 'casa'. Embora o contexto possa sugerir um templo ou palácio celestial, a tradução não resolve essa identificação teológica no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a cadência visionária de “e eis que”, emprega “aquela” para o demonstrativo distante e conserva a imagem marcante de “línguas de fogo”.
