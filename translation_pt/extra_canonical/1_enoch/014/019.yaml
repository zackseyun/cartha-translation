translation:
  language: pt
  text: E de debaixo do trono saía[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A breve oração em ge'ez não diz o que saía; a linha seguinte, no contexto, completa a imagem. A tradução mantém a frase em aberto, sem acrescentar um objeto.
    reason: lexical_alternative
