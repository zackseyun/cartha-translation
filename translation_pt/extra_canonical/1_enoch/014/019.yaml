lexical_decisions:
- source_word: እምታሕተ
  choice: de debaixo
  rationale: A forma preposicional reúne a ideia de procedência (“de”) e a posição inferior (“debaixo”), preservando a imagem espacial do ge'ez.
- source_word: መንበሩ
  choice: o trono
  rationale: Neste contexto de visão celestial, መንበር designa adequadamente um trono. O sufixo masculino singular pode funcionar como marca definida anafórica, retomando o trono elevado do contexto anterior, sem exigir aqui a tradução possessiva “seu trono”.
- source_word: ይወፅእ
  choice: saía
  rationale: O verbo expressa sair ou proceder. O imperfeito português apresenta a cena visionária em andamento e permite conservar a oração sem objeto expresso, como no ge'ez.
theological_decisions:
- issue: Valor do sufixo em መንበሩ
  choice: Traduzir de modo definido como “o trono”.
  alternative: Traduzir como “seu trono”.
  rationale: O sufixo de terceira pessoa masculina singular pode exercer função definida e retomar o trono já mencionado; esta opção evita antecipar explicitamente a identidade de seu ocupante.
- issue: Aquilo que saía de debaixo do trono
  choice: Deixar o referente sem expressão.
  alternative: Completar a oração com a imagem fornecida pela linha seguinte do contexto.
  rationale: A breve oração ge'ez não declara o que saía. Preservar essa abertura evita introduzir material contextual no versículo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe concisa para refletir a brevidade e a abertura da oração ge'ez. “De debaixo” foi mantido por sua clareza espacial e naturalidade no português de ampla compreensão.
