base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/002.yaml
  text: I saw in my sleep what I now speak with a tongue of flesh and with my spirit[a], which the Great One has given to men as a mouth[c][b], so that they might speak with it and understand in the heart.
translation:
  language: pt
  text: Eu vi durante o sono aquilo que agora digo com uma língua de carne e com o meu espírito[a], que o Grande deu aos seres humanos como boca[b], para que falem por meio dele e compreendam no coração[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o meu sopro” ou “a minha respiração”. O termo ge''ez pode significar espírito, sopro ou respiração; a referência à língua, à boca e à fala favorece a ideia de sopro, mas não elimina o sentido de espírito.'
    reason: lexical_alternative
  - marker: b
    text: A redação ge'ez diz literalmente que o Grande o deu “como boca aos seres humanos”. A construção é difícil e pode refletir uma corrupção textual, mas foi preservada na tradução.
    reason: textual_note
  - marker: c
    text: Aqui, “coração” designa o centro interior da compreensão e do pensamento, não apenas das emoções.
    reason: cultural_note
lexical_decisions:
- source_word: ርኢኩ
  choice: Eu vi
  rationale: Traduz diretamente o perfeito de ver, com clareza e naturalidade, preservando a forma de relato visionário.
- source_word: በንዋምየ
  choice: durante o sono
  rationale: Mantém o estado visionário sem decidir além do texto se se trata especificamente do conteúdo de um sonho.
- source_word: ይእዜ እነግር
  choice: agora digo
  rationale: Conserva a passagem da visão passada para a narração presente e se harmoniza com a linguagem de fala do restante do versículo.
- source_word: በልሳን ዘሥጋ
  choice: com uma língua de carne
  rationale: Preserva a imagem antropológica concreta e o tom apocalíptico do ge'ez.
- source_word: ወበመንፈስየ
  choice: e com o meu espírito
  rationale: መንፈስ pode significar espírito, sopro ou respiração. O texto fornecido e sua tradição recente favorecem 'espírito', enquanto a alternativa contextual 'sopro' é preservada em nota.
- source_word: ዘወሀበ ዓቢይ አፈ ለሰብእ
  choice: que o Grande deu aos seres humanos como boca
  rationale: Inclui explicitamente አፈ, 'boca', anteriormente omitido, e mantém a construção difícil do ge'ez sem corrigi-la silenciosamente segundo uma possível Vorlage grega.
- source_word: ይትናገሩ ቦቱ
  choice: para que por meio dele falem
  rationale: Expressa a finalidade e conserva o referente singular, embora sua relação exata com os elementos anteriores permaneça sintaticamente difícil.
- source_word: ወይለብዉ በልብ
  choice: e compreendam no coração
  rationale: Mantém o coração como centro do entendimento interior na antropologia antiga, em vez de reduzi-lo à emoção.
theological_decisions:
- issue: Sentido de መንፈስ na descrição das faculdades humanas
  choice: espírito
  alternative: sopro ou respiração
  rationale: O termo admite os dois campos semânticos. 'Espírito' preserva sua amplitude antropológica e teológica; a proximidade de língua, boca e fala torna 'sopro' uma alternativa real, registrada em nota.
- issue: Título divino ዓቢይ
  choice: o Grande
  alternative: o Grande Ser; Deus
  rationale: Preserva o epíteto divino do texto sem substituí-lo por um nome genérico nem introduzir uma formulação excessivamente interpretativa.
- issue: Construção com አፈ, 'boca'
  choice: deu aos seres humanos como boca
  alternative: 'deu aos seres humanos; possível texto subjacente: ''o sopro da minha boca'''
  rationale: A tradução conserva a redação ge'ez atestada, mesmo sendo difícil e possivelmente resultante de corrupção textual, em vez de emendá-la no corpo do versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com léxico simples e preservação das imagens semíticas e do tom visionário. Emprega 'seres humanos' para o sentido coletivo de ሰብእ e mantém deliberadamente a estranheza de 'língua de carne' e 'como boca'.
