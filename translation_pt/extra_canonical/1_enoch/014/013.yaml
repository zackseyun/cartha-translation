base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/013.yaml
  text: And I went into that house[a], and it was hot like fire and cold like ice, and there was no delight of life within it; fear covered me, and trembling seized me.
translation:
  language: pt
  text: E entrei naquela casa. Ela era quente como fogo e fria como gelo, e não havia nela nenhum deleite da vida[a]. O medo me cobriu, e o tremor se apoderou de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge'ez traduzida por “deleite da vida” é difícil. Pode significar que não havia dentro da casa nenhum bem-estar vivificante ou, de modo mais amplo, nenhum conforto próprio da vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወቦእኩ
  choice: E entrei
  rationale: Expressa diretamente o verbo na primeira pessoa do singular e mantém a progressão do movimento visionário.
- source_word: ውእቱ ቤት
  choice: naquela casa
  rationale: Preserva a força demonstrativa da expressão, que retoma a estrutura descrita anteriormente.
- source_word: ምውቅ
  choice: quente
  rationale: O adjetivo simples combina naturalmente com a comparação intensificadora “como fogo”, sem redundância.
- source_word: ቈሪር
  choice: fria
  rationale: Mantém o contraste paradoxal com o calor e concorda com “casa” em português.
- source_word: በረድ
  choice: gelo
  rationale: Embora a palavra também possa designar granizo, “gelo” exprime melhor, neste contexto, a oposição entre calor e frio.
- source_word: ወኢምንተ ፍግዐ ሕይወት አልቦቱ ውስቴቱ
  choice: e não havia nela nenhum deleite da vida
  rationale: Conserva a formulação incomum e a possível ideia de ausência de bem-estar ou agradável vitalidade, sem reduzi-la simplesmente à inexistência de vida.
- source_word: ፍርሃት ከደነኒ
  choice: O medo me cobriu
  rationale: Preserva a imagem concreta do verbo, que sugere cobrir ou envolver, em vez de substituí-la por uma explicação abstrata.
- source_word: ወረዓድ አኃዘኒ
  choice: e o tremor se apoderou de mim
  rationale: Comunica tanto a reação física quanto a força do verbo que indica agarrar ou tomar posse.
theological_decisions:
- issue: Sentido da difícil expressão que descreve o que não existia dentro da casa
  choice: não havia nela nenhum deleite da vida
  alternative: não havia nela nenhum prazer da vida; não havia nela nada vivo
  rationale: A expressão parece negar alguma forma de agradabilidade, bem-estar ou vitalidade ligada à vida, mas seu sentido exato é incerto. A tradução mantém essa tensão e evita declarar de modo mais específico que a casa era simplesmente desprovida de vida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe é natural, mas a expressão deliberadamente incomum “deleite da vida” preserva a ambiguidade do ge'ez e recebe esclarecimento em nota.
