base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/011.yaml
  text: Its ceiling was like the path of the stars and the lightnings[a], and among them were fiery cherubim[c][b], and their heaven was water.
translation:
  language: pt
  text: Seu teto era como o percurso das estrelas e dos relâmpagos[a]; entre eles havia querubins de fogo, e o céu deles era água[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida como “a trajetória das estrelas e dos relâmpagos” ou, mais literalmente, “a corrida das estrelas e dos relâmpagos”.
    reason: lexical_alternative
  - marker: b
    text: “O céu deles era água” é uma expressão difícil. Pode referir-se ao céu aquoso associado aos querubins de fogo ou à região superior da estrutura contemplada na visão.
    reason: alternative_reading
lexical_decisions:
- source_word: ጠፈሩ
  choice: seu teto
  rationale: No contexto arquitetônico da visão, designa a cobertura superior da estrutura; “teto” é mais natural e preciso do que o termo cósmico “firmamento”.
- source_word: ሩጸተ ከዋክብት
  choice: percurso das estrelas
  rationale: ሩጸተ expressa movimento, corrida ou curso. “Percurso” conserva a ideia dinâmica e combina naturalmente com as estrelas.
- source_word: መበርቅት
  choice: os relâmpagos
  rationale: Mantém a força plural da forma etíope e produz uma imagem visionária clara em português.
- source_word: ማእከሎሙ
  choice: entre eles
  rationale: Preserva a relação espacial sem definir de modo indevido se o pronome retoma as estrelas e os relâmpagos em conjunto ou os fenômenos mais próximos.
- source_word: ኪሩቤን ዘእሳት
  choice: querubins de fogo
  rationale: A construção genitiva é vertida diretamente; “de fogo” mantém aberta a nuance entre constituição e característica ígnea.
- source_word: ሰማዮሙ
  choice: o céu deles
  rationale: Conserva o possessivo explícito e a estranheza da imagem, sem normalizá-la como “o céu acima deles”.
- source_word: ማይ
  choice: água
  rationale: Reproduz o substantivo coletivo no singular de maneira simples e natural.
theological_decisions:
- issue: A relação do “céu” com os querubins ou com a região visionária
  choice: o céu deles era água
  alternative: o céu acima deles era água
  rationale: O texto etíope contém um possessivo, cuja referência exata permanece difícil. A tradução o preserva e não resolve silenciosamente a cosmologia da visão.
- issue: A natureza dos querubins associados ao fogo
  choice: querubins de fogo
  alternative: querubins ardentes
  rationale: “De fogo” segue de perto a construção do original e evita decidir se os seres eram feitos de fogo ou apenas tinham aparência ígnea.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário visionário preservado. A repetição e a coordenação simples do original são mantidas sem tornar a frase artificial; as ambiguidades do possessivo e da imagem cosmológica não são eliminadas.
