base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/016.yaml
  text: And in every respect it excelled in splendor and glory and greatness[d][c][b][a], so that I am unable to tell you about its splendor and about its greatness.
translation:
  language: pt
  text: E, em tudo, ela sobressaía em esplendor, glória e grandeza,[a] de modo que não consigo lhes falar do seu esplendor e da sua grandeza.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “transbordava de esplendor, glória e grandeza”. O verbo também pode ressaltar abundância efusiva, embora “sobressaía” corresponda melhor ao sentido comparativo neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: O pronome provavelmente se refere à estrutura celestial descrita, mas o texto não distingue de modo explícito o esplendor do lugar daquele da presença divina.
    reason: alternative_reading
lexical_decisions:
- source_word: በኵሉ
  choice: em tudo
  rationale: Expressa abrangência — “em todos os aspectos” — sem introduzir a ideia espacial de “ao redor”.
- source_word: ይፈደፍድ
  choice: excedia
  rationale: O verbo reduplicado indica excelência ou abundância em grau extraordinário; “excedia” se ajusta ao complemento e à intensidade da visão.
- source_word: በስብሐት
  choice: em esplendor
  rationale: Neste contexto visionário, designa magnificência ou brilho manifesto, distinguindo-se do termo seguinte para “glória”.
- source_word: በክብር
  choice: glória
  rationale: Preserva a ideia de dignidade e magnificência de peso régio ou celestial.
- source_word: በዕበይ
  choice: grandeza
  rationale: Mantém o sentido básico de magnitude exaltada e permite reproduzir a repetição no fim do versículo.
- source_word: እስከ ኢይክል
  choice: de modo que não consigo
  rationale: A construção indica resultado ou grau; a formulação portuguesa comunica naturalmente que a visão ultrapassa a capacidade de relato.
- source_word: ዜንዎተክሙ
  choice: lhes falar
  rationale: 'A forma é entendida, à luz da correspondência textual e do contexto, como fala dirigida a um grupo: “contar-lhes/falar-lhes”, e não como referência aos olhos dos destinatários.'
- source_word: በእንተ ስብሐቲሁ
  choice: do seu esplendor
  rationale: A preposição introduz o assunto do relato impossível; o pronome mantém sem explicitação o referente do sufixo de terceira pessoa.
theological_decisions:
- issue: Referente do sufixo de terceira pessoa em “seu esplendor” e “sua grandeza”
  choice: Manter o pronome sem nomear explicitamente o referente
  alternative: Explicitar a estrutura celestial, a presença divina ou ambas
  rationale: O ge’ez não repete o substantivo referente. Embora a estrutura visionária seja o antecedente imediato mais provável, a linguagem pode aproximar o esplendor do lugar e o da presença divina; explicitar um deles eliminaria uma tensão genuína do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Ela” retoma a estrutura celestial no contexto precedente; “lhes” conserva o destinatário plural. A repetição de “esplendor” e “grandeza” foi mantida por refletir a forma e a ênfase da fonte.
