base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/007.yaml
  text: And your petition on their behalf will not be granted; nor on your own behalf; and you yourselves, while you weep and make supplication, will not speak a single word from the book that I wrote.
translation:
  language: pt
  text: E a petição de vocês em favor deles não será atendida[a], nem a petição em favor de vocês mesmos; e vocês mesmos, enquanto choram e suplicam, não pronunciarão uma única palavra do livro que escrevi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se realizará”. O ge’ez diz literalmente “não será”, mas, no contexto de uma petição, provavelmente significa que ela não será atendida.'
    reason: lexical_alternative
  - marker: b
    text: A cláusula final é difícil. Pode indicar que os Vigilantes não poderão apresentar, repetir ou usar diante de Deus a petição escrita por Enoque.
    reason: alternative_reading
lexical_decisions:
- source_word: ስእለትክሙ
  choice: a petição de vocês
  rationale: O substantivo designa um pedido ou súplica; “petição” preserva o tom formal de intercessão e é claro em português moderno.
- source_word: በእንቲአሆሙ
  choice: em favor deles
  rationale: A expressão indica representação ou intercessão; “em favor deles” comunica esse sentido com naturalidade.
- source_word: ኢይከውን
  choice: não será atendida
  rationale: Literalmente, “não será”; no contexto de uma petição, a formulação idiomática indica que ela não terá acolhimento, sem especificar além do texto a causa da recusa.
- source_word: በእንቲአክሙ
  choice: em favor de vocês mesmos
  rationale: Mantém o paralelismo com “em favor deles” e explicita a mudança para os próprios destinatários.
- source_word: አንትሙሂ
  choice: vocês
  rationale: O pronome é enfático; a presença explícita de “vocês” após “vocês mesmos” conserva o contraste sem produzir a construção pouco natural “vocês mesmos, vocês”.
- source_word: እንዘ ትበክዩ ወታስተበቍዑ
  choice: enquanto choram e suplicam
  rationale: “Enquanto” preserva a relação circunstancial introduzida por እንዘ, e “suplicam” transmite de modo digno e corrente o forte pedido de auxílio.
- source_word: ወኢትተናገሩ ወኢምንተ ቃለ
  choice: não pronunciarão uma única palavra
  rationale: “Pronunciar” combina naturalmente com “palavra”, enquanto “uma única palavra” conserva a força enfática da negação.
- source_word: እምውስተ መጽሐፍ ዘጻሐፍኩ
  choice: do livro que escrevi
  rationale: Conserva explicitamente tanto o documento escrito quanto a oração relativa em primeira pessoa.
theological_decisions:
- issue: Sentido da cláusula final sobre falar palavras do livro escrito por Enoque
  choice: Os destinatários não pronunciarão uma única palavra do livro.
  alternative: Eles não terão permissão para falar; ou não obterão resposta por meio do livro.
  rationale: O ge’ez nega diretamente o ato de falar. A tradução mantém esse sentido superficial e não decide se a impossibilidade decorre de proibição, inutilidade ou exclusão.
- issue: Relação de “em favor de vocês mesmos” com a petição anterior
  choice: 'A frase completa o paralelismo: a petição não será atendida nem em favor deles nem em favor dos próprios destinatários.'
  alternative: 'Ligar a expressão à oração seguinte: “e, em favor de vocês mesmos, vocês chorarão...”'
  rationale: A estrutura paralela de በእንቲአሆሙ e በእንቲአክሙ favorece sua ligação com a negativa referente à petição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Petição”, “suplicam” e “pronunciarão” preservam o tom solene sem arcaísmo. O paralelismo sintático e a ambiguidade da cláusula final foram mantidos.
