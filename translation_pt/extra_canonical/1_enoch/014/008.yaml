base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/008.yaml
  text: 'And a vision showed me thus: behold[a], in the vision the clouds were calling me, and the mist was calling me; and the course of the stars and the lightnings were driving me and urging me on, and in the vision the winds were making me fly, and carrying me off[c][b], and lifting me upward into heaven.'
translation:
  language: pt
  text: 'E uma visão me mostrou isto: eis que, na visão, as nuvens me chamavam, e a névoa me chamava; o curso das estrelas e os relâmpagos me impeliam e me faziam avançar; e, na visão, os ventos[b] me faziam voar, me arrebatavam[c] e me elevavam para o alto, para o céu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Ventos” também pode ser traduzido como “espíritos”, mas o contexto imediato favorece forças atmosféricas que participam da ascensão de Enoque.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “me levavam embora” ou “me arrastavam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ራእይ
  choice: visão
  rationale: Termo corrente no contexto apocalíptico; sua repetição preserva o enquadramento visionário do versículo.
- source_word: አስተአርአየኒ
  choice: me mostrou
  rationale: Expressa naturalmente a forma causativa do verbo ligado a ver, sem perder sua força visual e reveladora.
- source_word: ደመናት
  choice: nuvens
  rationale: Mantém o sentido básico do substantivo, sem acrescentar uma intensidade tempestuosa não exigida pelo texto.
- source_word: ይጼውዑኒ / ይጼውዐኒ
  choice: me chamavam / me chamava
  rationale: Preserva a repetição do verbo e a ideia de convocação ativa, com concordância portuguesa para nuvens e névoa.
- source_word: ጊሜ
  choice: névoa
  rationale: Reflete o termo singular referente a vapor ou neblina e se ajusta ao paralelismo atmosférico.
- source_word: ሩጸተ ከዋክብት
  choice: o curso das estrelas
  rationale: Conserva a noção de movimento ou corrida celeste de modo idiomático, sem reduzir a expressão a estrelas estáticas.
- source_word: መበርቅት
  choice: os relâmpagos
  rationale: Reproduz o fenômeno atmosférico plural em linguagem portuguesa natural e digna.
- source_word: ይንጐዑኒ
  choice: me impeliam
  rationale: Comunica propulsão vigorosa e se combina naturalmente com o verbo intensificador seguinte.
- source_word: ወተያድህቁኒ
  choice: me faziam avançar
  rationale: Preserva a progressão e a pressão para seguir adiante sem repetir exatamente o sentido de 'impeliam'.
- source_word: ነፋሳት
  choice: ventos
  rationale: O contexto imediato reúne nuvens, névoa, estrelas e relâmpagos; 'ventos' mantém essa imagética, sem eliminar a alternativa lexical 'espíritos'.
- source_word: ያበርሩኒ
  choice: me faziam voar
  rationale: Mantém explicitamente a ideia de voo presente no verbo, em vez de reduzi-la a transporte genérico.
- source_word: ያንጉጹኒ
  choice: me arrebatavam
  rationale: Expressa transporte vigoroso e súbito, adequado à ascensão visionária, sem especificar o agente além do texto.
- source_word: ላዕለ፡ ውስተ፡ ሰማይ
  choice: para o alto, para dentro do céu
  rationale: Procura representar os dois elementos direcionais do ge'ez, tanto a subida quanto a entrada no céu.
theological_decisions:
- issue: Se ነፋሳት deve ser traduzido como 'ventos' ou 'espíritos'
  choice: ventos
  alternative: espíritos
  rationale: A sequência de agentes meteorológicos e cósmicos favorece 'ventos'. A alternativa é registrada em nota para preservar a ambiguidade lexical sem introduzir uma angelologia mais definida do que o texto exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e a repetição do original foram mantidos, enquanto a pontuação organiza a longa sequência visionária. A formulação final conserva de modo perceptível a subida e a entrada no céu.
