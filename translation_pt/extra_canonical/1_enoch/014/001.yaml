base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/001.yaml
  text: This is the book of the words of righteousness and of the reproof of the vigilant ones who are from eternity[c][b][a], just as the Holy and Great One commanded in that vision.
translation:
  language: pt
  text: Este é o livro das palavras de justiça e da repreensão dos Vigilantes[a], que são desde a eternidade[b], assim como[c] o Santo e o Grande ordenou naquela visão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que estão despertos” ou “os que vigiam”; o termo ge'ez designa literalmente aqueles que permanecem despertos ou vigilantes.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode significar “desde tempos antigos”, destacando uma origem remota, e não necessariamente eternidade absoluta.
    reason: lexical_alternative
  - marker: c
    text: Ou “conforme”.
    reason: lexical_alternative
lexical_decisions:
- source_word: መጽሐፈ
  choice: livro
  rationale: Equivalente direto e natural para um documento escrito, adequado ao caráter de título ou introdução do versículo.
- source_word: ቃለ
  choice: palavras
  rationale: Embora a forma seja singular, pode ter sentido coletivo; “palavras” introduz naturalmente o conteúdo do livro.
- source_word: ጽድቅ
  choice: justiça
  rationale: Preserva o peso moral e teológico do termo e soa mais natural em português nesta construção do que “retidão”.
- source_word: ዘለፋ
  choice: repreensão
  rationale: Expressa censura ou admoestação solene sem tornar o registro excessivamente arcaico.
- source_word: ትጉሃን
  choice: Vigilantes
  rationale: Conserva tanto o sentido lexical de seres despertos ou vigilantes quanto a força técnica do nome dado a esses seres celestes em 1 Enoque.
- source_word: እለ እምዓለም
  choice: que são desde a eternidade
  rationale: Mantém a linguagem elevada e a ambiguidade entre eternidade absoluta e antiguidade primordial, esclarecida em nota.
- source_word: አዘዘ
  choice: ordenou
  rationale: Verbo direto de comando, apropriado à autoridade da figura divina.
- source_word: ቅዱስ ወዓቢይ
  choice: o Santo e Grande
  rationale: Trata os dois epítetos como um título composto de uma única figura divina, sem sugerir dois personagens.
- source_word: በይእቲ ራእይ
  choice: naquela visão
  rationale: Preserva a leitura locativa menos interpretativa da preposição, embora um sentido instrumental também seja possível.
- source_word: በከመ
  choice: assim como
  rationale: Reproduz de modo natural a força comparativa de “como” ou “conforme”, sem arcaísmo artificial.
theological_decisions:
- issue: Identidade de ትጉሃን
  choice: Vigilantes, como designação dos seres celestes conhecidos na obra
  alternative: os vigilantes; os despertos; os diligentes
  rationale: O contexto do Livro dos Vigilantes favorece a referência à classe de seres angélicos. A forma com inicial maiúscula preserva essa função técnica, enquanto a nota registra o sentido lexical.
- issue: Sentido de እለ እምዓለም
  choice: que são desde a eternidade
  alternative: que são desde tempos antigos; que são de outrora; que são eternos
  rationale: A expressão provavelmente apresenta esses seres como primordiais, mas não determina com segurança eternidade absoluta. A tradução mantém essa tensão e a nota explicita a alternativa.
- issue: Relação de “repreensão” com os Vigilantes
  choice: da repreensão dos Vigilantes
  alternative: da repreensão dirigida aos Vigilantes
  rationale: O genitivo da fonte permite entender a repreensão como referente aos Vigilantes. A formulação escolhida conserva a concisão e alguma ambiguidade estrutural, sem acrescentar explicitamente uma relação objetiva não marcada na forma.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. “Vigilantes” é usado como nome técnico, enquanto “o Santo e Grande” preserva os epítetos unidos de uma só figura. As notas mantêm as ambiguidades lexical e temporal do ge'ez.
