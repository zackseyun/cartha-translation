base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/018.yaml
  text: And I looked and saw within it a lofty throne[a]; and its appearance was like crystal, and its wheels like the shining sun[d][c][b], and the voice of the cherubim.
translation:
  language: pt
  text: E olhei e vi, dentro dela, um trono elevado; sua aparência era como cristal[a], suas rodas, como o sol resplandecente[b], e ouvia-se o som dos querubins[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido como “cristal” também pode sugerir gelo, geada ou uma substância cristalina brilhante; a imagem é de transparência e brilho intensos.
    reason: lexical_alternative
  - marker: b
    text: O termo ge’ez também pode significar “seu círculo”, “sua circunferência” ou “aquilo que o cercava”; aqui, os testemunhos grego e aramaico favorecem “suas rodas”.
    reason: textual_and_lexical_alternative
  - marker: c
    text: 'Literalmente: “e a voz [ou: o som] dos querubins”. A frase é breve e não contém verbo explícito no ge’ez.'
    reason: source_syntax
lexical_decisions:
- source_word: ነጸርኩ / ርኢኩ
  choice: olhei e vi
  rationale: Mantém o par de verbos visionários do ge’ez, preservando o estilo enfático do relato apocalíptico.
- source_word: ውስቴቱ
  choice: dentro dela
  rationale: Expressa naturalmente a localização no interior da casa ou estrutura mencionada no contexto anterior.
- source_word: መንበረ ልዑለ
  choice: um trono elevado
  rationale: Preserva tanto a ideia espacial de altura quanto a majestade do trono, sem transformar o adjetivo em título teológico.
- source_word: ራእዩ
  choice: sua aparência
  rationale: Refere-se de modo claro ao aspecto visível do trono.
- source_word: አስሐትያ
  choice: cristal
  rationale: Comunica a imagem luminosa e translúcida, embora o termo também possa designar gelo, geada ou matéria cristalina.
- source_word: ክበቡ
  choice: suas rodas
  rationale: Embora o ge’ez possa significar círculo ou circunferência, os testemunhos grego e aramaico e o contexto da visão do trono favorecem rodas; o plural acompanha esses testemunhos e a imagem tradicional do trono-carro.
- source_word: ፀሐይ ዘያበርህ
  choice: o sol resplandecente
  rationale: Traduz de forma concisa a comparação com o sol que brilha ou dá luz.
- source_word: ቃለ ኪሩቤን
  choice: o som dos querubins
  rationale: ቃል pode significar voz ou som. Neste fragmento nominal e sem verbo explícito, “som” evita sugerir necessariamente fala articulada; “ouvia-se” produz português natural sem eliminar a concisão da fonte.
theological_decisions:
- issue: Descrição do trono
  choice: um trono elevado
  alternative: um trono exaltado
  rationale: “Elevado” conserva a altura visível e a majestade, sem impor que o termo funcione como afirmação doutrinária ou título.
- issue: Identificação de ክበቡ
  choice: suas rodas
  alternative: sua circunferência / aquilo que o cercava
  rationale: A leitura “rodas” é favorecida pelo contexto do trono visionário e pelos testemunhos grego e aramaico, mas a nota registra a amplitude lexical do ge’ez.
- issue: Relação sintática da frase final
  choice: e ouvia-se o som dos querubins
  alternative: e a voz dos querubins
  rationale: A fonte termina com uma expressão nominal concisa. A tradução explicita minimamente sua função auditiva para soar natural em português, enquanto a nota preserva a forma literal e sua ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva a repetição visionária “olhei e vi” e evita vocabulário denominacional. A pontuação organiza a série descritiva sem ocultar a forma concisa do original.
