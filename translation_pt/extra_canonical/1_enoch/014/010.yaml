base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/010.yaml
  text: And I went into the tongue of fire[a], and I drew near to a great house built of hailstones; and the roof of that house was like a mosaic of hailstones[c][b], and its floor was hail.
translation:
  language: pt
  text: Entrei na língua de fogo e me aproximei de uma grande casa construída com pedras de granizo. As paredes[a] daquela casa eram como um mosaico[b] de pedras de granizo, e seu piso era granizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma ge’ez transmitida neste ponto é difícil. Provavelmente se refere às paredes ou a uma superfície estrutural da casa; também foi entendida de outras maneiras, inclusive como “teto”.
    reason: textual_variant
  - marker: b
    text: “Mosaico” indica aqui pedras ou placas dispostas em padrão, isto é, uma obra tessellada, e não necessariamente um mosaico moderno de vidro.
    reason: cultural_note
lexical_decisions:
- source_word: ልሳነ እሳት
  choice: língua de fogo
  rationale: Preserva a imagem concreta e incomum do ge’ez, sem generalizá-la como simples “chama”.
- source_word: ቤት ዓቢይ
  choice: uma grande casa
  rationale: Mantém o sentido amplo de ቤት e o tom elevado da visão, sem especificar indevidamente “templo”, “palácio” ou “salão”.
- source_word: ዘኅኑጽ በእእባነ በረድ
  choice: construída de pedras de granizo
  rationale: Expressa de modo claro que a casa foi edificada com esse material extraordinário e conserva a imagem explícita do granizo.
- source_word: አረፍተ ውእቱ ቤት
  choice: o teto daquela casa
  rationale: Segue a leitura contextual do elemento estrutural superior da casa, mas sinaliza em nota a dificuldade textual e lexical da forma transmitida.
- source_word: ከመ ጸፍጸፈ ሳሌዳት
  choice: era como um mosaico
  rationale: Comunica em português atual a ideia de pedras ou placas dispostas em padrão, sem introduzir a comparação confusa com um piso moderno.
- source_word: በእእባን ዘእምበረድ
  choice: de pedras de granizo
  rationale: Repete deliberadamente a matéria visionária mencionada antes, em vez de suavizá-la para “gelo” ou “cristal”.
- source_word: ምድረ በረድ
  choice: seu chão era granizo
  rationale: No interior de uma casa, “chão” é a acepção contextual mais natural de ምድር; a construção predicativa preserva a formulação abrupta e vívida do texto.
theological_decisions:
- issue: Normalizar a arquitetura visionária como templo ou palácio
  choice: Conservar “grande casa” e as imagens de pedras de granizo e de um chão de granizo.
  alternative: Traduzir a construção como “templo” ou “palácio” com base no contexto mais amplo.
  rationale: O versículo descreve a visão sem dar aqui à construção um nome teologicamente mais específico; evitar essa normalização preserva a estranheza apocalíptica e não antecipa uma interpretação.
- issue: Identificação do elemento estrutural descrito após a casa
  choice: Usar “teto” no texto e registrar a incerteza em nota.
  alternative: Traduzir como “paredes”, “parede”, “interior” ou, mais genericamente, “superfície”.
  rationale: A evidência fornecida favorece a cobertura superior, mas a forma textual é difícil; a nota preserva a ambiguidade em vez de ocultá-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe foi levemente dividida para fluidez, mas as imagens concretas e estranhas da visão foram preservadas.
