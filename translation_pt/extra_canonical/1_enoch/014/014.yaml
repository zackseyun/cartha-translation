base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/014.yaml
  text: And as I shook and trembled[a], I fell on my face and saw in the vision.
translation:
  language: pt
  text: E, enquanto eu me agitava e tremia[a], caí com o rosto em terra e vi na visão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu estava perturbado e estremecia”. Os dois verbos têm sentidos próximos e, juntos, exprimem intensa perturbação ou medo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እንዘ
  choice: enquanto
  rationale: Introduz uma circunstância simultânea e preserva o caráter contínuo da reação que acompanha a queda e a visão.
- source_word: እትሀወክ
  choice: eu me agitava
  rationale: Expressa perturbação interior sem se confundir com o segundo verbo, que descreve mais diretamente o tremor físico.
- source_word: እርዕድ
  choice: tremia
  rationale: Conserva a reação corporal intensa e, em par com “me agitava”, evita reduzir ambos os verbos a um termo genérico de medo.
- source_word: ወድቁ
  choice: caí
  rationale: Mantém o verbo básico de movimento; a expressão seguinte já indica a postura prostrada.
- source_word: በገጽየ
  choice: com o rosto em terra
  rationale: É uma forma portuguesa natural e digna de exprimir literalmente a queda sobre o rosto, sem afirmar que a prostração foi deliberada.
- source_word: እሬኢ
  choice: vi
  rationale: Tradução direta e corrente do verbo visionário, sem arcaísmo desnecessário.
- source_word: በራእይ
  choice: na visão
  rationale: Preserva o sintagma definido e seu sentido técnico no contexto visionário imediato.
theological_decisions:
- issue: Se os dois verbos de reação devem ser traduzidos como medo interior genérico ou como perturbação acompanhada de reação corporal
  choice: “eu me agitava e tremia”
  alternative: “eu estava perturbado e com medo” / “eu estremecia e tremia”
  rationale: A formulação mantém distintos os dois verbos e conserva tanto a agitação interior quanto a dimensão corporal, sem interpretar a cena apenas como emoção abstrata.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Com o rosto em terra” preserva a imagem apocalíptica de prostração de maneira idiomática; a repetição semântica dos dois primeiros verbos foi mantida intencionalmente.
