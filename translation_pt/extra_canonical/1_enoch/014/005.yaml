  source_fidelity: A tradução preserva adequadamente a sentença dirigida a um plural, a oposição cósmica entre céu e terra, a voz passiva que não nomeia a autoridade e as duas fórmulas de duração. «Amarrados» mantém a imagem concreta de serem ligados, embora «presos» fosse menos preciso. A revisão ajusta apenas a formulação locativa e temporal para refletir mais claramente o escopo de «na terra» e obter português mais idiomático.
  naturalness: «E foi declarado na terra» é compreensível, mas «e, na terra, foi declarado» reproduz com maior nitidez a colocação enfática do sintagma locativo. «Por todos os dias da eternidade» é inteligível, porém pouco natural; «durante todos os dias da eternidade» conserva a repetição judicial e soa melhor em português moderno.
  terminology: «Céu», «eternidade» e «amarrados» são escolhas adequadas ao contexto apocalíptico. A voz passiva deve permanecer sem agente expresso, como no texto-fonte.
