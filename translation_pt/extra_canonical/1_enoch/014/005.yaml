base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/005.yaml
  text: And from now on you shall not ascend into heaven for all eternity[b][a], and on the earth it has been declared that you shall be bound for all the days of eternity.
translation:
  language: pt
  text: E, de agora em diante, vocês não subirão ao céu por toda a eternidade[a]; e, na terra, foi declarado[b] que vocês serão amarrados durante todos os dias da eternidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O etíope emprega neste versículo duas fórmulas de duração que se sobrepõem: uma após a proibição de subir ao céu e outra após a sentença de ser amarrado. A tradução preserva ambas, em vez de reuni-las em um único «para sempre».'
    reason: lexical_alternative
  - marker: b
    text: A expressão passiva «foi declarado» não identifica quem fez a declaração. O contexto sugere um decreto judicial celestial.
    reason: cultural_note
lexical_decisions:
- source_word: እምይእዜ
  choice: de agora em diante
  rationale: Marca o início de uma nova condição imposta pela sentença e soa natural no português atual.
- source_word: ኢትዓርጉ
  choice: vocês não subirão
  rationale: O futuro negativo preserva a força solene de uma proibição pronunciada como sentença, sem reduzi-la a uma ordem simples.
- source_word: ውስተ ሰማይ
  choice: ao céu
  rationale: O contexto apocalíptico estabelece o contraste cósmico entre céu e terra; por isso, «céu» é preferível a «firmamento» ou «céus».
- source_word: እስከ ኵሉ ዓለም
  choice: por toda a eternidade
  rationale: Expressa a duração total da sentença em português idiomático, mantendo sua força absoluta.
- source_word: ወውስተ ምድር ተነግረ
  choice: e foi declarado na terra
  rationale: Mantém a construção passiva e o tom judicial, sem identificar explicitamente a autoridade que fez a declaração.
- source_word: ይእስርክሙ
  choice: vocês serão amarrados
  rationale: Preserva a imagem concreta de atar ou prender, recorrente no julgamento dos Vigilantes, em vez de substituí-la pela ideia mais genérica de encarceramento.
- source_word: በኵሉ መዋዕለ ዓለም
  choice: por todos os dias da eternidade
  rationale: Conserva a segunda fórmula de duração e sua repetição enfática, sem fundi-la com a fórmula anterior.
theological_decisions:
- issue: Se a punição deve ser expressa de maneira genérica ou pela imagem apocalíptica concreta
  choice: vocês serão amarrados
  alternative: vocês serão aprisionados
  rationale: A imagem de seres celestes rebeldes amarrados pertence à linguagem própria do texto. Mantê-la evita transformar a figura judicial em uma explicação doutrinária mais abstrata.
- issue: Identidade da autoridade que emite a declaração
  choice: manter a voz passiva sem nomear o agente
  alternative: Deus declarou
  rationale: A forma passiva do texto deixa implícito quem decretou a sentença. Embora o contexto sugira autoridade celestial, a tradução não deve explicitar o que a redação preserva em aberto.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O plural «vocês» torna explícito o destinatário coletivo indicado pela forma verbal etíope. A repetição de «eternidade» foi mantida por seu valor rítmico e judicial.
