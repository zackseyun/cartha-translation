base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/003.yaml
  text: As he created and gave to humankind to understand the word of knowledge[a], so also he created me and gave me reproof for the Watchers[c][b], the sons of heaven.
translation:
  language: pt
  text: Assim como criou os seres humanos e lhes concedeu compreender a palavra do conhecimento,[a] também me criou e me concedeu repreendê-los:[b] os Vigilantes, os filhos do céu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra do entendimento”. A expressão ge'ez conserva literalmente a ideia de “palavra” e pode indicar conhecimento, inteligência ou entendimento.
    reason: lexical_alternative
  - marker: b
    text: 'O texto etíope transmitido neste ponto é difícil, e a transcrição parece conter um erro. A tradução segue a leitura gramatical “também me criou e me concedeu repreendê-los”. Outra leitura possível seria: “também me criou e me deu reprovação para eles”.'
    reason: textual_variant
  - marker: c
    text: “Vigilantes” traduz um termo relacionado a estar desperto ou vigilante; neste livro, ele designa os seres angélicos também chamados aqui de “filhos do céu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰብእ
  choice: os seres humanos
  rationale: O termo tem sentido coletivo e genérico; esta forma é natural em português moderno e evita uma referência exclusivamente masculina.
- source_word: ቃለ አእምሮ
  choice: a palavra do conhecimento
  rationale: Preserva o substantivo concreto ቃል, “palavra”, enquanto አእምሮ pode exprimir conhecimento ou entendimento. A nota registra a alternativa legítima.
- source_word: ወለቲኒ
  choice: também me criou
  rationale: O texto transcrito parece refletir uma forma corrompida ou erro de leitura; no contexto e na análise gramatical, a cláusula introduz Enoque em primeira pessoa como destinatário de uma comissão paralela à dádiva feita à humanidade.
- source_word: እዝልፎሙ
  choice: me concedeu repreendê-los
  rationale: 'A forma é entendida como verbo de primeira pessoa com sufixo de terceira pessoa plural: “que eu os repreendesse”. Essa análise explica a referência subsequente aos Vigilantes melhor do que tratá-la como um substantivo, “reprovação”.'
- source_word: ትጉሃን
  choice: os Vigilantes
  rationale: A palavra denota os que permanecem despertos ou vigilantes e, neste contexto, funciona como designação do grupo angélico central à narrativa. A inicial maiúscula indica o uso como título tradicional sem apagar o sentido lexical.
- source_word: ውሉደ ሰማይ
  choice: os filhos do céu
  rationale: Tradução formal que preserva a imagem de filiação e a origem celeste do grupo.
theological_decisions:
- issue: Identidade de ትጉሃን ውሉደ ሰማይ
  choice: “os Vigilantes, os filhos do céu” identifica descritivamente o grupo angélico repreendido por Enoque.
  alternative: “os vigilantes filhos do céu” ou “os despertos, filhos do céu”.
  rationale: O contexto do Livro dos Vigilantes favorece o título tradicional, mas a nota conserva seu sentido lexical e evita definir além do que o verso afirma.
- issue: Natureza da incumbência dada a Enoque
  choice: Deus concede a Enoque a tarefa de repreender os Vigilantes.
  alternative: Deus dá a Enoque “reprovação para os Vigilantes”.
  rationale: A leitura verbal de እዝልፎሙ e a primeira pessoa restauram a comissão de Enoque. A dificuldade da forma transmitida é explicitada em nota, sem transformar a alternativa nominal em sentido principal.
translation_notes:
  register: 'Português moderno, digno e acessível, com construção paralela clara. “Concedeu” mantém o tom elevado sem arcaísmo excessivo. A ambiguidade textual central não é ocultada: o texto principal adota a análise verbal e de primeira pessoa mais coerente, enquanto a alternativa nominal é preservada em nota.'
