base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/017.yaml
  text: And its floor was of fire[a], and above it were lightnings and the path of the stars[b], and its ceiling was blazing fire.
translation:
  language: pt
  text: E seu piso era de fogo; acima dele havia relâmpagos e o curso das estrelas[a], e seu teto[b] era fogo ardente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida como “o curso das estrelas” também pode ser entendida como “o caminho das estrelas”, referindo-se ao movimento ordenado delas pelos céus.
    reason: lexical_alternative
  - marker: b
    text: A palavra traduzida como “teto” também pode significar “telhado” ou, com menor probabilidade neste contexto, “abóbada/firmamento”, conforme a imagem seja entendida de modo mais arquitetônico ou mais cósmico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምድሩሰ
  choice: seu piso
  rationale: O substantivo significa literalmente “terra/solo”; no contexto arquitetônico da casa celestial, “piso” expressa a superfície interior sem especificar um pavimento trabalhado.
- source_word: ዘእሳት
  choice: de fogo
  rationale: Preserva de modo direto a construção genitiva e a imagem apocalíptica concisa.
- source_word: መልዕልቴሁ
  choice: acima dele
  rationale: Comunica naturalmente a relação espacial indicada pelo termo, sem transformar a expressão em uma parte estrutural específica.
- source_word: መበርቅት
  choice: relâmpagos
  rationale: O plural mantém a multiplicidade da visão e é corrente em português moderno.
- source_word: ምርዋፀ
  choice: o curso
  rationale: O termo pode designar caminho, curso ou trajetória. “Curso” soa natural para o movimento ordenado dos astros e preserva a dimensão dinâmica da imagem.
- source_word: ከዋክብት
  choice: das estrelas
  rationale: Tradução direta do substantivo plural, integrada naturalmente à locução “curso das estrelas”.
- source_word: ጠፈሩኒ
  choice: seu teto
  rationale: No cenário interior da construção celestial, “teto” é a opção arquitetônica mais natural, embora “telhado” ou “abóbada/firmamento” continuem possíveis.
- source_word: እሳት ዘይነድድ
  choice: fogo ardente
  rationale: A construção significa literalmente “fogo que arde”. “Fogo ardente” conserva a repetição intensificadora e mantém linguagem digna e compreensível.
theological_decisions:
- issue: Imagens arquitetônicas e cósmicas na estrutura celestial
  choice: Empregar termos de um espaço interior (“piso”, “acima dele”, “teto”) e manter os elementos cósmicos (“relâmpagos”, “curso das estrelas”).
  alternative: Traduzir ጠፈር de modo mais cósmico como “abóbada” ou “firmamento”, ou tornar toda a descrição estritamente arquitetônica.
  rationale: O texto funde uma casa ou sala do trono com fenômenos celestes. A tradução conserva essa tensão apocalíptica sem reduzir a visão a um edifício comum nem a um cenário exclusivamente cósmico.
