base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/005.yaml
  text: You have made all things[a], and authority over all is with you; and all things are uncovered and laid bare before you, and you see all things, and there is nothing that can hide itself from you.
translation:
  language: pt
  text: Tu fizeste todas as coisas, e a autoridade sobre tudo está contigo; tudo está descoberto e manifesto diante de ti[a]. Tu vês todas as coisas, e nada pode esconder-se de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tudo está descoberto diante de ti e manifesto”. As duas expressões paralelas intensificam a imagem da exposição total diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርከ
  choice: fizeste
  rationale: O verbo significa fazer ou realizar. Com “todas as coisas” como objeto, “fizeste” comunica a obra divina abrangente sem impor a ideia mais específica de criação a partir do nada.
- source_word: ስልጣነ
  choice: autoridade
  rationale: Designa poder de governo ou domínio; “autoridade” preserva tanto a soberania quanto o poder legítimo.
- source_word: ምስሌከ
  choice: está contigo
  rationale: Mantém a expressão concreta “contigo”, que aqui indica que toda autoridade reside em Deus ou lhe pertence.
- source_word: ክሡት
  choice: descoberto
  rationale: Preserva a imagem concreta daquilo que está exposto, em vez de reduzi-la à noção abstrata de ser conhecido.
- source_word: ግሁድ
  choice: manifesto
  rationale: Em paralelo com “descoberto”, reforça a completa exposição de todas as coisas diante de Deus.
- source_word: ትሬኢ
  choice: vês
  rationale: Tradução direta e natural do verbo de visão, mantendo a afirmação concreta da percepção divina.
- source_word: ዘይትከሀል
  choice: pode
  rationale: Expressa de modo claro e natural a capacidade ou possibilidade negada pela oração.
- source_word: ይትኀባእ
  choice: esconder-se
  rationale: Preserva a nuance reflexiva de ocultar a si mesmo ou escapar da vista.
theological_decisions:
- issue: Se a linguagem deve ser vertida por termos doutrinários abstratos sobre onipotência e onisciência
  choice: Conservar a linguagem concreta de fazer, exercer autoridade, estar exposto e ver.
  alternative: “Tu és onipotente e onisciente” ou “Todas as coisas são conhecidas por ti”.
  rationale: Embora o versículo implique soberania e conhecimento divinos abrangentes, o ge'ez os expressa por imagens e predicados concretos, que devem ser preservados sem substituição por fórmulas teológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A colocação do marcador após a expressão dupla vincula claramente a nota às palavras que ela explica.
