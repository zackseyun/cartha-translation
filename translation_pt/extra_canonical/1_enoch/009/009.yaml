base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/009.yaml
  text: and the women have borne giants[b][a], and by this the whole earth has been filled with blood.
translation:
  language: pt
  text: e as mulheres deram à luz gigantes[a][b], e, por isso, toda a terra ficou cheia de sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase provavelmente se refere aos gigantes gerados pelas uniões ilícitas dos Vigilantes com as mulheres no contexto imediato; aqui, o ge'ez declara o resultado de modo conciso.
    reason: cross_reference
  - marker: b
    text: 'Ou: “e mulheres deram à luz gigantes”.'
    reason: previous_rendering
lexical_decisions:
- source_word: አንስት
  choice: as mulheres
  rationale: O substantivo plural significa “mulheres”. O artigo definido preserva a ligação anafórica, reforçada pela partícula tópica -ሰ, com as mulheres mencionadas no contexto anterior, sem especificá-las como esposas.
- source_word: ወለዳ
  choice: deram à luz
  rationale: Expressa diretamente o ato de gerar ou dar à luz; o pretérito perfeito é natural em português e mantém o valor resultativo da ação.
- source_word: ረዓይተ
  choice: gigantes
  rationale: No contexto das uniões ilícitas dos Vigilantes, designa a descendência gigantesca; conserva o sentido tradicional e contextual sem paráfrase desnecessária.
- source_word: በዘ
  choice: por isso
  rationale: Mantém de forma compacta a relação causal ou resultativa indicada pelo conectivo ge'ez.
- source_word: መልአት
  choice: ficou cheia
  rationale: Comunica o resultado de ter sido enchida e soa natural em português, sem perder o aspecto resultativo da acusação.
- source_word: ኵላ ምድር
  choice: toda a terra
  rationale: Preserva o alcance abrangente e cósmico da expressão; “terra” é preferível a “região” neste contexto.
- source_word: ደመ
  choice: de sangue
  rationale: Traduz literalmente “sangue” e conserva a imagem apocalíptica forte, sem substituí-la pela interpretação “derramamento de sangue”.
theological_decisions:
- issue: Grau de explicitação da relação causal entre o nascimento dos gigantes e a terra cheia de sangue
  choice: e, por isso, toda a terra ficou cheia de sangue
  alternative: e, desse modo, toda a terra foi cheia de sangue
  rationale: “Por isso” torna inteligível a relação causal ou resultativa presente no ge'ez, mas não acrescenta uma explicação sobre como os gigantes produziram a violência.
- issue: Identificação das mulheres
  choice: as mulheres
  alternative: mulheres
  rationale: O artigo definido reflete a retomada contextual sugerida pela partícula tópica e evita entender a declaração como referente a mulheres em geral; a nota registra a forma menos definida possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A frase permanece em minúscula por continuar sintaticamente o versículo anterior, conforme o texto de consulta. A construção “deu à luz” foi flexionada no plural, e a imagem literal da terra cheia de sangue foi preservada.
