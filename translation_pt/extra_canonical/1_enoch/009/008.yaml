base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/008.yaml
  text: And they went to the daughters of men on the earth[a], and they lay with them, with those women[c][b], and they defiled themselves and revealed to them every sin.
translation:
  language: pt
  text: E foram até as filhas dos homens na terra e se deitaram com elas, com aquelas mulheres[a]; contaminaram-se e lhes revelaram[b] todo pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com aquelas esposas”.'
    reason: O substantivo ge'ez pode significar “mulheres” ou “esposas”; o contexto não decide de forma conclusiva.
  - marker: b
    text: 'Ou: “deram a conhecer”.'
    reason: O verbo abrange os sentidos de tornar manifesto, dar a conhecer e revelar.
lexical_decisions:
- source_word: ወሖሩ ኀበ አዋልደ ሰብእ
  choice: E foram até as filhas dos homens
  rationale: Mantém o verbo simples de movimento e a expressão tradicional que contrasta as mulheres humanas com os seres celestes, sem acrescentar ao primeiro verbo uma conotação sexual já expressa na oração seguinte.
- source_word: በዲበ ምድር
  choice: na terra
  rationale: Reproduz de modo natural a localização e conserva o contraste cósmico entre céu e terra.
- source_word: ወስከቡ ምስሌሆን
  choice: e se deitaram com elas
  rationale: Expressa com clareza e dignidade a união sexual indicada pelo contexto, sem recorrer a formulação coloquial.
- source_word: ምስለ እልኩ አንስት
  choice: com aquelas mulheres
  rationale: Preserva a repetição enfática do ge'ez. O substantivo pode designar mulheres ou esposas; o contexto não exige que se imponha a ideia de casamento.
- source_word: ወረኵሱ
  choice: contaminaram-se
  rationale: Conserva o sentido reflexivo e a ressonância simultaneamente moral e ritual do verbo.
- source_word: ወአግሀዱ ሎን
  choice: e lhes revelaram
  rationale: Traduz o sentido de tornar manifesto ou revelar e se ajusta ao contexto apocalíptico da divulgação de conhecimento proibido.
- source_word: ኵሎ ኃጢአተ
  choice: todo pecado
  rationale: Mantém a formulação abrangente do singular coletivo sem restringi-la a uma classe específica de práticas.
theological_decisions:
- issue: Natureza da corrupção introduzida pelos Vigilantes
  choice: O texto apresenta tanto a união sexual ilícita quanto a revelação do pecado.
  alternative: Entender a última expressão apenas como referência a artes mágicas ou conhecimentos técnicos específicos.
  rationale: O ge'ez menciona explicitamente o ato sexual, a contaminação e a revelação de “todo pecado”. A tradução mantém a amplitude e a tensão do texto, sem reduzir a acusação a uma única categoria.
- issue: Condição das mulheres como esposas
  choice: mulheres
  alternative: esposas
  rationale: Embora አንስት possa assumir ambos os sentidos, o contexto imediato não determina inequivocamente uma relação matrimonial; “mulheres” evita acrescentá-la.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A estrutura conserva a repetição enfática do original e evita tanto coloquialismo quanto explicitação doutrinária indevida.
