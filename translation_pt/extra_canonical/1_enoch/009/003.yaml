base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/003.yaml
  text: And now[a], to you, the holy ones of heaven, the souls of men make their plea, saying[b], ‘Bring our case before the Most High.’
translation:
  language: pt
  text: 'E agora, as almas dos seres humanos fazem seu apelo a vocês, santos do céu, dizendo: “Levem nossa causa[a] perante o Altíssimo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Façam justiça por nós perante o Altíssimo” ou “Apresentem nosso caso perante o Altíssimo”. A expressão ge’ez é jurídica e pode abranger tanto a apresentação de uma causa quanto o pedido de justiça ou vindicação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Preserva a transição temporal e discursiva do apelo sem sobrecarregar a partícula.
- source_word: ለክሙ ለቅዱሳነ ሰማይ
  choice: a vocês, os santos do céu
  rationale: Mantém o destinatário plural e a designação apocalíptica dos seres celestiais. Aqui, “santos” funciona como substantivo para seres santos, não como título eclesiástico.
- source_word: ይስእዩ
  choice: apresentam sua súplica
  rationale: Exprime o ato de suplicar ou peticionar, com naturalidade em português e em harmonia com o contexto forense.
- source_word: ነፍሳተ ሰብእ
  choice: as almas dos seres humanos
  rationale: Conserva a linguagem antropológica de “almas” e traduz ሰብእ de modo inclusivo e corrente, sem restringi-lo ao sexo masculino.
- source_word: እንዘ ይብሉ
  choice: dizendo
  rationale: Introdução participial direta e natural da fala.
- source_word: አብኡ ለነ ፍትሐ
  choice: Levem nossa causa
  rationale: “Causa” preserva o sentido jurídico de uma demanda levada para julgamento, sem sugerir que já exista uma sentença definitiva.
- source_word: ኀበ ልዑል
  choice: perante o Altíssimo
  rationale: Representa a direção à corte divina e mantém o cenário jurídico da apresentação da causa.
theological_decisions:
- issue: Identidade dos “santos do céu”
  choice: seres santos celestiais, provavelmente anjos, interpelados pelas almas
  alternative: santos humanos no céu
  rationale: O contexto imediato apresenta uma corte celestial e mediadores celestes. A tradução mantém a expressão ampla, sem substituir o termo por uma identificação interpretativa explícita.
- issue: Sentido de ፍትሐ no apelo
  choice: causa jurídica que busca julgamento e justiça
  alternative: justiça, vindicação ou julgamento
  rationale: “Causa” comunica a petição forense ainda não decidida e preserva a tensão entre apresentação do caso, julgamento e vindicação; a nota registra as nuances possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e “seres humanos” para evitar a possível leitura exclusivamente masculina de “homens”. O marcador [a] foi colocado após a fala inteira, onde esclarece a expressão jurídica.
