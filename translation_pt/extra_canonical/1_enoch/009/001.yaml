base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/001.yaml
  text: And then Michael[a], Uriel, Raphael, and Gabriel looked down from heaven and saw much blood being poured out upon the earth[b], and all the lawlessness being done upon the earth.
translation:
  language: pt
  text: Então, do céu, Miguel, Uriel, Rafael e Gabriel olharam para baixo e viram muito sangue sendo derramado sobre a terra[a], e toda a iniquidade que se cometia sobre a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sendo vertido”. O verbo ge’ez é difícil; alguns intérpretes também o relacionam à ideia de o sangue clamar. O texto principal mantém a imagem mais imediata de sangue derramado sobre a terra.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “sobre a terra” é repetida no original, enfatizando a terra como cenário da violência e da transgressão.
    reason: literary_note
lexical_decisions:
- source_word: እሜሃ
  choice: Então
  rationale: Marca com naturalidade a sequência temporal e introduz a nova cena.
- source_word: ሐወጹ ... እምሰማይ
  choice: olharam do céu para baixo
  rationale: Expressa a visão dirigida desde o céu para a esfera terrestre, preservando a perspectiva vertical da narrativa apocalíptica.
- source_word: ወርእዩ
  choice: viram
  rationale: Verbo narrativo simples e direto, adequado ao português atual.
- source_word: ብዙሐ ደመ
  choice: muito sangue
  rationale: Mantém a imagem concreta e forte do texto, sem substituí-la pela abstração “derramamento de sangue”.
- source_word: ዘይትከዓው
  choice: sendo derramado
  rationale: Com “sangue” como referente e “sobre a terra” como complemento, comunica de forma natural a imagem física do sangue derramado, sem ocultar a dificuldade lexical indicada em nota.
- source_word: በዲበ ምድር
  choice: sobre a terra
  rationale: Conserva a locução nas duas ocorrências, respeitando a repetição enfática do original.
- source_word: ኵሎ ዓመፃ
  choice: toda a iniquidade
  rationale: Abrange transgressão, injustiça e maldade sem restringir o sentido apenas à violência física; o termo mantém um registro digno e amplamente compreensível.
- source_word: ዘይትገበር
  choice: que se cometia
  rationale: Reproduz de modo idiomático o valor passivo e durativo da forma relativa, apresentando a iniquidade como ação em curso.
theological_decisions:
- issue: Forma dos nomes angélicos
  choice: Miguel, Uriel, Rafael e Gabriel
  alternative: Mikael, Uriel, Raphael e Gabriel
  rationale: Empregam-se as formas portuguesas estabelecidas onde existem, favorecendo leitura natural sem acrescentar interpretação doutrinária.
- issue: Imagem concreta do sangue
  choice: muito sangue sendo derramado
  alternative: muito derramamento de sangue; sangue clamando
  rationale: A redação principal preserva a imagem concreta da visão e evita resolver de forma especulativa a dificuldade do verbo; a alternativa relevante é registrada em nota.
- issue: Amplitude moral de ዓመፃ
  choice: iniquidade
  alternative: violência; injustiça; transgressão
  rationale: “Iniquidade” preserva o alcance moral amplo do termo e evita limitá-lo à violência física já sugerida pelo sangue.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes familiares aos leitores lusófonos. A ordem narrativa, a perspectiva celeste e a repetição final do original foram preservadas; evitou-se tanto linguagem excessivamente arcaica quanto uma paráfrase interpretativa.
