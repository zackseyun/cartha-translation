base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/006.yaml
  text: You see what Azazel has done[a]—how he has taught all unrighteousness upon the earth and revealed the hidden things of the world that are done in the heavens[c][b], which men learned.
translation:
  language: pt
  text: 'Tu vês o que Azazel fez: ele ensinou toda iniquidade na terra e revelou as coisas ocultas do mundo[a], que se realizam nos céus[b] e que os seres humanos conheceram.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “do mundo” também pode significar “da era” ou “da eternidade”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que são realizadas nos céus”. A construção pode descrever coisas, atos ou operações celestes.'
    reason: translation_clarification
  - marker: c
    text: A cláusula final é difícil no texto etíope. A forma preservada favorece “que os seres humanos conheceram” ou “aprenderam”; outra tradição textual traz a ideia de que eles “procuravam aprender”.
    reason: textual_variant
lexical_decisions:
- source_word: ርኢከ
  choice: Tu vês
  rationale: A forma de segunda pessoa introduz a súplica dirigida ao destinatário celestial. O presente conserva a vivacidade da acusação; “viste” também seria possível.
- source_word: ዘገብረ
  choice: o que ... fez
  rationale: A construção relativa aponta para a ação consumada de Azazel. O pretérito perfeito é natural em português e mantém a relevância da denúncia no contexto.
- source_word: አዛዝኤል
  choice: Azazel
  rationale: O nome próprio é transliterado segundo sua forma tradicional e reconhecível em português.
- source_word: ዘመሀረ
  choice: ensinou
  rationale: O verbo denota ensino ou instrução e preserva a acusação de transmissão ativa de conhecimento proibido.
- source_word: ኵሎ ዓመፃ
  choice: toda iniquidade
  rationale: A expressão abrange a perversidade moral em sentido amplo. “Iniquidade” conserva o peso ético e teológico sem restringir o sentido à violência física ou à injustiça social.
- source_word: በዲበ ምድር
  choice: na terra
  rationale: Expressa a esfera terrestre corrompida pelo ensino de Azazel de modo natural e claro em português moderno.
- source_word: ወአግሀደ
  choice: e revelou
  rationale: O verbo indica tornar manifesto aquilo que estava oculto; “revelou” convém ao registro apocalíptico e ao caráter ilícito da divulgação.
- source_word: ኅቡኣተ ዓለም
  choice: as coisas ocultas do mundo
  rationale: ዓለም pode designar mundo, era ou eternidade. “Mundo” preserva a leitura contextual sem impor um sentido técnico mais específico; a ambiguidade é registrada em nota.
- source_word: እለ ይትገበሩ በሰማያት
  choice: que se realizam nos céus
  rationale: A construção passiva ou impessoal se refere a realidades ou operações celestes. “Se realizam” evita sugerir fabricação material, e o plural “céus” mantém o registro cosmológico semítico-apocalíptico.
- source_word: አመረ ሰብእ
  choice: que os seres humanos conheceram
  rationale: A cláusula final difícil aponta, na forma etíope transmitida, para seres humanos que vieram a conhecer essas coisas. “Conheceram” evita importar a ideia de esforço ou busca, ausente do verbo preservado.
theological_decisions:
- issue: Amplitude moral de ዓመፃ
  choice: toda iniquidade
  alternative: toda injustiça; toda transgressão; toda violência
  rationale: A denúncia parece abranger corrupção moral generalizada. “Iniquidade” conserva essa amplitude e seu peso teológico sem reduzir a acusação a uma categoria específica.
- issue: Natureza das coisas ocultas
  choice: as coisas ocultas do mundo, que se realizam nos céus
  alternative: os segredos da era; as coisas ocultas da eternidade; os mistérios realizados no céu
  rationale: A formulação mantém a tensão entre “mundo/era/eternidade” e a esfera celeste, sem identificar essas coisas com uma doutrina posterior nem decidir além do que o texto permite.
- issue: Conhecimento humano na cláusula final
  choice: que os seres humanos conheceram
  alternative: que os seres humanos aprenderam; que os seres humanos procuravam aprender
  rationale: A leitura segue a evidência da forma etíope, que comunica conhecer ou aprender. A alternativa “procuravam aprender” depende de outra tradição textual e acrescenta uma noção de esforço não expressa claramente no testemunho fornecido.
translation_notes:
  register: Português moderno, digno e acessível, com leve elevação própria da literatura apocalíptica. “Tu vês” preserva a interpelação direta; “na terra” evita solenidade artificial; “iniquidade” mantém a amplitude moral do termo-fonte. As notas conservam as ambiguidades lexical e textual sem sobrecarregar o versículo.
