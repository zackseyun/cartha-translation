  text: And they said among themselves[b][a], “The voice of their outcry has reached the gates of heaven.”
translation:
  language: pt
  text: 'E disseram entre si: “A voz do clamor deles subiu, e a terra clamou até os portões do céu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto etíope apresenta duas ações paralelas: o clamor deles sobe, e a própria terra clama. A forma transcrita ዐረቀ provavelmente representa ዐርገ, “subiu”.'
    reason: textual_and_grammatical_clarification
lexical_decisions:
- source_word: ወይቤሉ
  choice: E disseram
  rationale: Forma narrativa natural em português para introduzir a fala, preservando a coordenação com o contexto anterior.
- source_word: በበይናቲሆሙ
  choice: entre si
  rationale: Expressão recíproca idiomática e adequada a um grupo de falantes.
- source_word: ቃለ ጽራኃቲሆሙ
  choice: A voz do clamor deles
  rationale: Mantém tanto o substantivo 'voz' quanto a força coletiva e urgente do clamor dos que sofrem.
- source_word: ዐረቀ
  choice: subiu
  rationale: A forma transcrita parece refletir ዐርገ, verbo masculino singular que concorda com 'voz' e descreve seu movimento ascendente; 'subiu' preserva essa imagem melhor que apenas 'chegou'.
- source_word: ጸርሐት ምድር
  choice: a terra clamou
  rationale: ጸርሐት é analisado como verbo perfeito feminino singular, tendo 'terra' como sujeito; a tradução conserva a personificação e não reduz a expressão a um segundo substantivo para 'clamor'.
- source_word: እስከ አንቀጸ ሰማይ
  choice: até os portões do céu
  rationale: Preserva a imagem espacial apocalíptica concreta; 'portões' é claro e digno em português contemporâneo.
theological_decisions:
- issue: O clamor procede apenas das vítimas ou a própria terra também clama?
  choice: 'Traduzir duas orações paralelas: o clamor deles sobe e a terra clama.'
  alternative: Entender 'clamor da terra' como uma aposição ou descrição única do clamor das vítimas.
  rationale: A morfologia de ጸርሐት favorece sua leitura como verbo feminino singular com 'terra' por sujeito. Assim, o texto mantém ao mesmo tempo o clamor humano e a personificação da terra, sem fundi-los artificialmente.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. 'Clamor' mantém a urgência da cena, enquanto 'portões do céu' conserva sua imagem apocalíptica concreta.
