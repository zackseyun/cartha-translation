base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/007.yaml
  text: And Semyaza[c][b][a], to whom you gave authority to rule over those who are with him.
translation:
  language: pt
  text: E Semyaza, a quem deste autoridade para governar os que estão com ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão final também pode ser traduzida como “os que estão reunidos com ele”. O texto descreve os companheiros ou associados de Semyaza, provavelmente os Vigilantes sob sua liderança.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: Semyaza
  rationale: Translitera o nome próprio de modo coerente com a forma ge'ez e com a política do projeto.
- source_word: ዘአንተ ወሀብኮ
  choice: a quem deste
  rationale: A construção relativa e a forma verbal de segunda pessoa indicam que Deus, a quem os anjos se dirigem, concedeu algo a Semyaza; evita-se a inversão anterior de sujeito e objeto.
- source_word: ስልጣነ
  choice: autoridade
  rationale: Expressa poder delegado ou jurisdição, sem sugerir domínio soberano intrínseco.
- source_word: ይኵንን
  choice: para governar
  rationale: Mantém explicitamente o valor verbal de reger ou governar, em vez de absorvê-lo apenas numa preposição.
- source_word: እለ ምስሌሁ ኅቡረ
  choice: os que estão com ele
  rationale: Reproduz naturalmente a ideia de companheiros ou associados reunidos com Semyaza, sem definir além do que o texto permite.
theological_decisions:
- issue: Natureza da autoridade de Semyaza
  choice: Autoridade concedida por Deus para governar os associados de Semyaza
  alternative: Autoridade para julgar os que estão com ele; autoridade entre os que estão com ele
  rationale: A formulação preserva a autoridade como delegada e mantém a distinção entre a soberania divina e a função de liderança atribuída a Semyaza.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. O pronome implícito em “deste” conserva a fala dirigida a Deus; “governar” explicita o verbo presente no ge'ez.
