base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/004.yaml
  text: And they said to their Lord[a], the King, “For you are Lord of lords, God of gods, and King of kings, and the throne of your glory is through all the generations of eternity, and your name is holy and glorious through all eternity[d][c][b], and blessed.”
translation:
  language: pt
  text: 'E disseram ao Senhor dos reis[a]: “Pois tu és Senhor dos senhores, Deus dos deuses e Rei dos reis; o trono da tua glória permanece por todas as gerações da eternidade, e o teu nome é santo e glorioso por toda a eternidade, e bendito[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão inicial é sintaticamente comprimida no geʽez. Também pode ser entendida como “ao seu Senhor, o Rei”.
    reason: alternative_reading
  - marker: b
    text: Uma leitura etíope assinalada como incerta acrescenta “e honrado” ou “e glorioso” depois de “bendito”.
    reason: textual_variant
lexical_decisions:
- source_word: ለእግዚኦሙ ለነገሥት
  choice: ao Senhor dos reis
  rationale: A construção com sufixo antecipatório é entendida como ‘ao Senhor dos reis’, preservando o plural e a sintaxe régia do geʽez; a forma comprimida admite discussão, registrada em nota.
- source_word: እስመ
  choice: Pois
  rationale: Mantém a conjunção causal que introduz a razão ou aclamação doxológica.
- source_word: እግዚኦሙ ለአጋእዝት / አምላኮሙ ለአማልክት / ንጉሦሙ ለነገሥት
  choice: Senhor dos senhores, Deus dos deuses e Rei dos reis
  rationale: Conserva o paralelismo tríplice e a afirmação de supremacia presentes nos títulos divinos.
- source_word: መንበረ ስብሐቲከ
  choice: o trono da tua glória
  rationale: Preserva a imagem concreta do trono e a construção nominal solene.
- source_word: ውስተ ኵሉ ትውልደ ዓለም
  choice: por todas as gerações da eternidade
  rationale: Neste contexto doxológico, ዓለም tem sentido temporal de era ou eternidade, não espacial de mundo.
- source_word: ስምከ ቅዱስ ወስቡሕ ውስተ ኵሉ ዓለም ወቡሩክ
  choice: o teu nome é santo e glorioso por toda a eternidade, e bendito
  rationale: Mantém a ordem dos predicados no geʽez e verte ስቡሕ por ‘glorioso’, adequado ao vocabulário doxológico, sem deslocar ‘bendito’.
theological_decisions:
- issue: Forma dos três títulos de supremacia divina
  choice: Manter ‘Senhor dos senhores, Deus dos deuses e Rei dos reis’
  alternative: Resumir como ‘Senhor e Deus supremo’
  rationale: A repetição formal integra a retórica e a teologia da aclamação celestial e não deve ser achatada.
- issue: Sentido de ዓለም nas duas expressões
  choice: Interpretar temporalmente como ‘eternidade’
  alternative: Traduzir espacialmente como ‘mundo’
  rationale: O contexto doxológico e a evidência antiga favorecem o valor de era ou eternidade, embora o termo possa ter amplitude semântica maior em outros contextos.
- issue: Termo final entre colchetes, ወከቡድ
  choice: Não incluí-lo no texto principal
  alternative: Acrescentar ‘e honrado’ ou ‘e glorioso’
  rationale: Como a edição sinaliza o termo como incerto, a leitura segura permanece no texto e a variante é documentada em nota.
translation_notes:
  register: Português atual, solene e acessível, com tratamento por ‘tu’ coerente com a oração direta. O paralelismo régio e divino foi preservado, e a pontuação foi ajustada para clareza sem dissolver a cadência doxológica.
