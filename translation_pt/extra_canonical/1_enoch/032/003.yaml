base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/003.yaml
  text: And I came into the garden of righteousness[a], and I saw beyond those trees many large trees growing there, with good fragrance, great and very beautiful and glorious; and the tree of wisdom[c][b], from which those who eat know great wisdom.
translation:
  language: pt
  text: Entrei no jardim da retidão e vi, além daquelas árvores[a], muitas árvores grandes que cresciam ali. Sua fragrância era agradável; eram imponentes, muito belas e gloriosas. Vi também a árvore da sabedoria[b], da qual aqueles que comem conhecem grande sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão espacial no testemunho etíope é difícil; também pode ser entendida como “entre aquelas árvores” ou “junto daquelas árvores”.
    reason: textual_variant
  - marker: b
    text: A expressão evoca a imagem do jardim primordial, mas o texto diz “árvore da sabedoria” e não repete a designação completa encontrada em Gênesis.
    reason: cross_reference
lexical_decisions:
- source_word: ገነት ጽድቅ
  choice: jardim da justiça
  rationale: “Jardim” preserva a imagem concreta de um espaço cultivado e a alusão primordial; “justiça” expressa o campo moral de ጽድቅ sem acrescentar uma interpretação doutrinária.
- source_word: ከሐክቲሆሙ ለእልክቱ ዕፀው
  choice: além daquelas árvores
  rationale: Mantém a progressão espacial provável da visão, enquanto a nota registra que a expressão etíope é difícil e admite outras relações espaciais.
- source_word: ዕፀወ ብዙኃነ ወዐቢይነ ይበቍሉ
  choice: muitas árvores grandes que cresciam
  rationale: Conserva tanto a quantidade e o tamanho quanto o sentido verbal de crescimento.
- source_word: ጼናሆሙ ሠናይ
  choice: sua fragrância era agradável
  rationale: Formulação portuguesa natural que preserva o elemento sensorial positivo do texto.
- source_word: ዐቢያን ወሥናሙ ብዙኅ ወስቡሓን
  choice: eram imponentes, muito belas e gloriosas
  rationale: Representa separadamente a grandeza, a beleza intensa e o atributo adicional de esplendor expresso por ወስቡሓን, sem reduzir os três a uma única qualidade.
- source_word: ዕፀ ጥበብ
  choice: a árvore da sabedoria
  rationale: Tradução direta da construção nominal, preservando a terminologia própria do versículo e sua alusão ao jardim primordial.
- source_word: ዘእምኔሁ በሊዖሙ ይአምርዋ ለጥበብ ዐቢይ
  choice: da qual aqueles que comem conhecem grande sabedoria
  rationale: Mantém explícito o objeto “grande sabedoria” e apresenta a alimentação como o ato que resulta nesse conhecimento, sem substituir a expressão por “tornam-se sábios”.
theological_decisions:
- issue: Relação entre a árvore da sabedoria e a imagem do Éden
  choice: árvore da sabedoria
  alternative: árvore do conhecimento
  rationale: O texto ge’ez emprega o termo para “sabedoria”, não a fórmula completa de Gênesis sobre o conhecimento do bem e do mal. A tradução conserva a alusão sem harmonizar os textos.
- issue: Sentido moral de ጽድቅ no nome do jardim
  choice: jardim da justiça
  alternative: jardim da retidão
  rationale: “Justiça” é uma equivalência ampla e reconhecível para ጽድቅ; evita restringir o termo apenas à conduta individual, embora “retidão” também seja lexicalmente possível.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente tanto no Brasil quanto em outros contextos lusófonos. A divisão em três períodos esclarece a longa sequência etíope sem alterar sua progressão visionária; “imponentes” evita a repetição pouco natural de “grandes” e ainda comunica magnitude.
