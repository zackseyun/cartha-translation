base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/004.yaml
  text: And it looked like the carob tree[a], and its fruit was like clusters of good grapes, very beautiful[d][c][b]; and the fragrance of that tree spread far away.
translation:
  language: pt
  text: E ela se parecia com uma alfarrobeira, e seu fruto era como cachos de uvas muito belos; o perfume daquela árvore se espalhava a grande distância.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመስል
  choice: se parecia com
  rationale: Preserva a comparação visual expressa pelo verbo e soa natural em português moderno.
- source_word: ሐመረ ጽራእ
  choice: alfarrobeira
  rationale: A expressão designa a alfarrobeira (Ceratonia siliqua), identificação também apoiada pelo fragmento grego que traz κερατία.
- source_word: ፍሬሁ
  choice: seu fruto
  rationale: Mantém o singular coletivo do ge'ez e identifica diretamente o fruto da árvore.
- source_word: ከመ እስካለ ወይን
  choice: como cachos de uvas
  rationale: Comunica de modo idiomático a comparação com o fruto da videira, preservando a imagem de cachos.
- source_word: ሠናይ ጥቀ
  choice: muito belos
  rationale: Entende ጥቀ como intensificador de ሠናይ, em conformidade com o grego καλοὶ λίαν, evitando transformar um único qualificativo intensificado em duas qualidades distintas.
- source_word: ወጼናሁ
  choice: o perfume ... se espalhava
  rationale: Expressa naturalmente a emanação e difusão do aroma.
- source_word: ለውእቱ ዕፅ
  choice: daquela árvore
  rationale: Conserva a referência demonstrativa explícita à árvore descrita.
- source_word: የሐውር ነዋኃ
  choice: a grande distância
  rationale: Preserva a ideia de que o aroma alcançava longe, em registro digno e corrente.
