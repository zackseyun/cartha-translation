base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/001.yaml
  text: And after these[a], toward the south, as I looked over the mountains, I saw seven mountains full of choice nard and fragrant trees[c][b], and cinnamon and pepper.
translation:
  language: pt
  text: Depois dessas coisas, em direção ao sul, enquanto eu olhava por cima das montanhas, vi sete montanhas cheias de nardo precioso[a], árvores aromáticas, canela e pimenta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida como “nardo precioso” é incerta. Provavelmente indica uma planta aromática ou especiaria cara; “aromas preciosos” também é possível.
    reason: lexical_alternative
  - marker: b
    text: O ge’ez apresenta uma sequência de produtos aromáticos valiosos, ressaltando a abundância e o caráter exótico da paisagem visionária, e não necessariamente oferecendo uma classificação botânica moderna.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረ እሉ
  choice: depois dessas coisas
  rationale: Preserva a fórmula temporal e o demonstrativo plural, remetendo às cenas anteriores sem acrescentar um substantivo não expresso de modo seguro.
- source_word: አፈው ለመስዕ
  choice: em direção ao sul
  rationale: Expressa o movimento espacial da visão conforme a leitura contextual adotada para a frase, sem inserir “especiarias” após o demonstrativo.
- source_word: እንዘ እኔጽር
  choice: enquanto eu olhava
  rationale: Reproduz a construção circunstancial de ação contínua e mantém a perspectiva imediata do visionário.
- source_word: መልዕልተ አድባር
  choice: por cima das montanhas
  rationale: Conserva explicitamente a relação espacial de olhar sobre ou além de um conjunto de montanhas.
- source_word: ፯አድባረ
  choice: sete montanhas
  rationale: Mantém o numeral explícito e a escala elevada da geografia visionária.
- source_word: ምሉኣነ
  choice: cheias de
  rationale: Transmite de modo natural a ideia de abundância que introduz a lista de plantas aromáticas.
- source_word: ሰንብላተ ቅድዋተ
  choice: nardo precioso
  rationale: Mantém uma identificação botânica concreta, mas sinaliza em nota a incerteza lexical; “precioso” comunica a qualidade superior ou o alto valor do produto.
- source_word: ዕፀ መዓዛ
  choice: árvores aromáticas
  rationale: Representa naturalmente a expressão literal ligada a árvores ou madeira de fragrância, preservando a imagem vegetal.
- source_word: ቀናንሞን
  choice: canela
  rationale: É o equivalente português comum do empréstimo que designa essa especiaria.
- source_word: ፐፐሬ
  choice: pimenta
  rationale: É o equivalente português direto do termo emprestado para a especiaria, sem especificar desnecessariamente grãos ou variedade.
