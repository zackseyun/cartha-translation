base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/002.yaml
  text: And from there I went above the summits of those mountains[a], far to the east, and I crossed over the Erythraean Sea; and I went far from it[c][b], and passed above the angel Zutel.
translation:
  language: pt
  text: E dali fui por cima dos cumes daqueles montes, para longe, rumo ao leste, e atravessei o mar Eritreu[a]. Afastei-me muito dele[b] e passei por cima do anjo Zutel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mar Vermelho”. O antigo nome “mar Eritreu” podia abranger uma região marítima mais ampla que o atual mar Vermelho.
    reason: lexical_alternative
  - marker: b
    text: A cláusula traduzida como “Afastei-me muito dele” é difícil no testemunho etíope; o sentido geral parece ser a continuação da viagem para longe do mar.
    reason: textual_variant
  - marker: c
    text: O nome do anjo também pode ser vocalizado em outras edições ou traduções como “Zutael”.
    reason: textual_variant
lexical_decisions:
- source_word: መልዕልተ፡ ርእሶሙ፡ ለእልኩ፡ አድባር
  choice: por cima dos cumes daqueles montes
  rationale: መልዕልተ indica posição ou movimento acima de algo; ርእሶሙ, literalmente “suas cabeças”, designa idiomaticamente os cumes dos montes. “Por cima” conserva o movimento elevado da visão sem especificar além do texto se o percurso era vertical ou simplesmente sobre eles.
- source_word: እንዘ፡ ርሑቅ፡ ውእቱ፡ ለጽባሕ
  choice: para longe, rumo ao leste
  rationale: ጽባሕ pode apontar para o nascer do sol e, por extensão, para o leste. A formulação portuguesa mantém tanto a distância quanto a orientação, sem confundi-la com uma referência ao período da manhã.
- source_word: ባሕረ፡ ኤርትራ
  choice: o mar Eritreu
  rationale: Mantém o antigo nome geográfico refletido no ge'ez e evita restringir indevidamente sua extensão ao atual mar Vermelho.
- source_word: ወእምኔሁ፡ ርሑቀ፡ ተከንኩ
  choice: Afastei-me muito dele
  rationale: A cláusula é difícil no testemunho etíope, mas o contexto indica continuação da viagem para longe do mar. Esta versão é clara e comedida, sem impor um modo específico de deslocamento.
- source_word: መልዕልተ፡ ለመልአክ፡ ዙጥኤል
  choice: por cima do anjo Zutel
  rationale: Repete-se a relação espacial expressa por መልዕልተ. O nome próprio é transliterado de modo conservador, não traduzido.
theological_decisions:
- issue: Identificação do mar mencionado
  choice: mar Eritreu
  alternative: mar Vermelho
  rationale: A designação antiga preserva o horizonte geográfico do relato apocalíptico e não reduz a referência à configuração geográfica moderna.
- issue: Relação espacial com o anjo
  choice: passei por cima do anjo
  alternative: passei além do anjo
  rationale: A preposição etíope favorece a ideia de posição acima, embora a imagem seja incomum. A tradução mantém essa tensão em vez de normalizá-la como simples passagem para além dele.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções correntes no Brasil e compreensíveis internacionalmente. Preservaram-se o nome geográfico antigo, o movimento visionário elevado e as dificuldades reais do texto; as notas foram vinculadas aos termos correspondentes no corpo do versículo.
