  text: And I said[b][a], “It is beautiful.”
translation:
  language: pt
  text: 'E eu disse: “Isto é belo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto ge’ez fornecido é muito breve: literalmente, “e eu disse: belo/bom [é] isto”. “Bom” ou “agradável” também são possíveis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእቤ
  choice: E eu disse
  rationale: A conjunção ወ dá continuidade simples à narrativa, e እቤ é a forma da primeira pessoa do singular de “dizer/falar”. “E eu disse” preserva a sequência e a concisão do ge’ez.
- source_word: ሠናይዝ
  choice: Isto é belo
  rationale: A expressão pode ser segmentada como ሠናይ ዝ, literalmente “belo/bom [é] isto”, com ዝ como demonstrativo “isto/este”. O português requer a cópula “é”. “Belo” se ajusta à reação diante de algo contemplado, sem excluir totalmente o campo semântico de “bom/agradável”.
theological_decisions:
- issue: Fala direta elíptica e identificação do demonstrativo
  choice: Isto é belo.
  alternative: É belo. / Isto é bom. / Belo!
  rationale: A tradução conserva o demonstrativo aparentemente presente em ዝ e acrescenta apenas a cópula exigida pelo português. Não se explicita “árvore” ou outro referente porque ele não aparece no trecho ge’ez fornecido.
translation_notes:
  register: Português moderno, claro e digno, com construção breve que acompanha o caráter elíptico do original. Preferiu-se “belo” a “bonito” por seu tom literário natural, sem arcaísmo.
