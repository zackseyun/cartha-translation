- source_word: እሌ
  choice: Ai
  rationale: Neste contexto, እሌ funciona como interjeição de lamento ou condenação e integra a fórmula recorrente «Ai de vocês», não como pronome demonstrativo.
- source_word: ለክሙ
  choice: de vocês
  rationale: A preposição com o pronome da segunda pessoa do plural completa idiomaticamente em português a expressão «Ai de vocês»; uma reprodução mecânica como «para vocês» seria menos natural.
- source_word: እለ
  choice: …
