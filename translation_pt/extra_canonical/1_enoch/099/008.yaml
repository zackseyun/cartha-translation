base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/008.yaml
  text: And they will become senseless because of the madness of their heart[c][b][a], and their eyes will grow dark through the fear of their heart and through the visions of their dreams.
translation:
  language: pt
  text: E eles perderão o juízo por causa da loucura do seu coração, e seus olhos se escurecerão[a] por causa do medo do seu coração e das visões dos seus sonhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus olhos serão escurecidos”. A imagem pode indicar visão enfraquecida pelo terror ou, em sentido figurado, perda de clareza.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “visões dos seus sonhos” conserva tanto a linguagem de ver quanto a de sonhar presente no ge'ez, em vez de reduzi-la simplesmente a “sonhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትረሰዑ
  choice: perderão o juízo
  rationale: O verbo é o passivo/reflexivo de ረሰዐ, «esquecer», e neste contexto indica perder a razão ou ficar sem discernimento. «Perderão o juízo» é natural em português e corresponde ao paralelismo com «loucura»; não se adota a leitura anterior «ficarão aterrorizados».
- source_word: እበደ
  choice: loucura
  rationale: Preserva a intensidade da ideia de desordem mental ou irracionalidade; «insensatez» seria possível, mas atenuaria a expressão.
- source_word: ልቦሙ
  choice: seu coração
  rationale: Mantém a linguagem antropológica semítica, na qual o coração abrange pensamento, vontade e emoção, sem reduzi-lo a «mente».
- source_word: ይጼለሉ
  choice: se escurecerão
  rationale: Conserva a imagem concreta do escurecimento e permite tanto uma percepção física obscurecida quanto uma perda figurada de clareza.
- source_word: አዕይንቲሆሙ
  choice: seus olhos
  rationale: Retém o substantivo concreto do texto, em vez de abstraí-lo como «visão» ou «vista».
- source_word: በፍርሃተ ልቦሙ
  choice: por causa do medo do seu coração
  rationale: A preposição admite valor causal ou instrumental. «Por causa de» expressa naturalmente a causa em português e conserva a repetição de «coração».
- source_word: በርእየ ሕልሞሙ
  choice: das visões dos seus sonhos
  rationale: Preserva conjuntamente a linguagem de visão e de sonho, sem nivelar a frase para apenas «sonhos».
theological_decisions:
- issue: Natureza da aflição descrita
  choice: O versículo apresenta perda de juízo, percepção obscurecida, medo interior e visões oníricas como efeitos ligados ao juízo, sem definir a origem das visões.
  alternative: Entender as visões como revelações punitivas enviadas diretamente por Deus, ou como simples produto psicológico de uma consciência culpada.
  rationale: O texto descreve os efeitos, mas não explica se os sonhos são enviados por Deus, gerados interiormente ou envolvem ambos os aspectos; a tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e a repetição de «coração» preservam o caráter semítico do verso; «perderão o juízo» evita uma formulação excessivamente técnica.
