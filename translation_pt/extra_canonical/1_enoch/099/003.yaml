base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/003.yaml
  text: In those days[a], you righteous, prepare yourselves to raise your prayers as a memorial, and place them as a testimony before the angels[c][b], that they may place the sin of sinners before the Most High as a memorial.
translation:
  language: pt
  text: Naqueles dias, vocês, justos, preparem-se para elevar suas orações como memorial e apresentá-las como testemunho diante dos anjos,[a] para que eles apresentem o pecado dos pecadores diante do Altíssimo como memorial.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os verbos traduzidos por “apresentá-las” e “apresentem” estão danificados neste testemunho transcrito. Também podem ter o sentido de “colocar”, “trazer”, “ler” ou “recitar”.
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e a imagem concreta de “dias”.
- source_word: ተደለዉ፡ ጻድቃን
  choice: vocês, justos, preparem-se
  rationale: Lê o verbo como imperativo na segunda pessoa do plural e “justos” como vocativo, conforme a revisão gramatical mais recente.
- source_word: ከመ፡ ትንሥኡ፡ ጸሎታቲከሙ
  choice: para elevar suas orações
  rationale: 'Mantém o sujeito humano do verbo ativo: os justos elevam suas orações.'
- source_word: በተዝካር
  choice: como memorial
  rationale: Conserva a linguagem cultual e judicial de algo trazido à lembrança na corte celestial.
- source_word: ሰማዕተ
  choice: como testemunho
  rationale: Traduz o substantivo como “testemunho”, distinguindo-o da frase explícita seguinte, “diante dos anjos”.
- source_word: አንብ...ሙ / ያንብ...ሙ
  choice: apresentá-las / apresentem
  rationale: O testemunho está corrompido na transcrição, mas o contexto judicial favorece o sentido geral de colocar ou apresentar; a nota registra a incerteza.
- source_word: በቅድመ፡ መላእክት
  choice: diante dos anjos
  rationale: Traduz explicitamente a referência aos seres angélicos, que não deve ser confundida com “testemunho”.
- source_word: ለኃጢአተ፡ ኃጥኣን
  choice: o pecado dos pecadores
  rationale: Segue o singular “pecado” refletido na revisão mais recente e evita acrescentar uma preposição acusatória que não é indispensável.
- source_word: በቅድመ፡ ልዑል
  choice: diante do Altíssimo
  rationale: Preserva o título divino tradicional e o cenário da corte celestial.
theological_decisions:
- issue: Função das orações dos justos na corte celestial
  choice: As orações são elevadas como memorial e apresentadas como testemunho, enquanto os anjos apresentam o pecado dos pecadores diante do Altíssimo.
  alternative: As orações apenas sobem para serem lembradas por Deus, sem função judicial explícita.
  rationale: A repetição de “memorial”, a palavra “testemunho” e a apresentação do pecado diante do Altíssimo sustentam a imagem judicial, sem definir além do texto o mecanismo da intercessão ou acusação.
- issue: Agência dos anjos
  choice: Os anjos são o sujeito da apresentação final diante do Altíssimo.
  alternative: As próprias orações, ou os justos, seriam o sujeito da ação final.
  rationale: A leitura revisada da sintaxe entende a cláusula final como ação dos anjos e preserva a sequência do cenário celestial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O vocativo “vocês, justos” torna explícita a segunda pessoa do plural sem recorrer a “vós”. “Memorial” foi mantido por seu peso cultual e judicial.
