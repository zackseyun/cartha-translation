base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/004.yaml
  text: In those days nations shall be thrown into confusion, and the clans of the nations shall rise up on the day of destruction.
translation:
  language: pt
  text: Naqueles dias, as nações serão mergulhadas na confusão, e os clãs das nações[a] se levantarão no dia da destruição.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os grupos de parentesco das nações” ou “as tribos das nações”. O termo ge''ez pode designar grupos unidos por parentesco ou povos relacionados.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no dia da chacina” ou “da ruína”, conforme a intensidade atribuída ao substantivo final.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e o sentido plural de «dias/tempos» em português natural e solene.
- source_word: ይትሀወኩ
  choice: serão lançadas em confusão
  rationale: Expressa a ideia de tumulto ou desordem e conserva a força passiva do verbo.
- source_word: አሕዛብ
  choice: nações
  rationale: É o equivalente coletivo mais natural neste contexto de juízo e evita introduzir o contraste teológico posterior sugerido por «gentios».
- source_word: ወይትነሥኡ
  choice: se levantarão
  rationale: Mantém o movimento ativo e ameaçador do original sem especificá-lo como revolta, mobilização militar ou reunião.
- source_word: አዝማደ፡ አሕዛብ
  choice: os clãs das nações
  rationale: Representa grupos unidos por parentesco dentro de coletividades maiores; a nota registra outras possibilidades lexicais.
- source_word: በዕለት፡ እንተ፡ ሐጕል
  choice: no dia da destruição
  rationale: Comunica uma catástrofe culminante sem limitar o substantivo à matança, embora «chacina» ou «ruína» sejam possíveis.
theological_decisions:
- issue: Alcance de አሕዛብ no oráculo apocalíptico de juízo
  choice: nações, em sentido coletivo
  alternative: povos; gentios
  rationale: O contexto retrata convulsão entre coletividades, não exige um contraste teológico entre judeus e gentios.
- issue: Sentido do levantamento dos clãs
  choice: se levantarão
  alternative: se revoltarão; serão incitados para a batalha; se reunirão
  rationale: A tradução conserva a ambiguidade do movimento sem acrescentar uma finalidade militar ou política não explicitada.
- issue: Força de ሐጕል
  choice: destruição
  alternative: chacina; ruína
  rationale: A opção principal mantém amplo o alcance da calamidade; a nota preserva as leituras mais específicas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência profética. «Serão lançadas em confusão» conserva a força passiva; «se levantarão» preserva a ambiguidade do original. Todos os marcadores de nota aparecem no texto.
