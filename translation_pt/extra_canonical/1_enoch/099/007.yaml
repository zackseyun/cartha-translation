base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/007.yaml
  text: And those who bow down to stone[a], and those who make images of gold and silver and wood and clay[d][c][b], and those who bow down to evil spirits and demons and to every idol without understanding—they will find no help at all from them.
translation:
  language: pt
  text: E aqueles que se prostram diante da pedra[a], e aqueles que fazem uma imagem de ouro, de prata, de madeira e de barro, e aqueles que se prostram diante de espíritos maus[b], de demônios e de todo ídolo, sem entendimento — não encontrarão ajuda alguma da parte deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante da pedra”; o singular provavelmente representa, de modo geral, objetos de culto feitos de pedra.
    reason: lexical_alternative
  - marker: b
    text: Ou “almas más” ou “almas dos maus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሰግዱ
  choice: se prostram diante de
  rationale: Preserva o gesto físico de submissão reverente e sua dimensão cultual, sem reduzir todas as ocorrências ao termo mais interpretativo “adorar”.
- source_word: ለአብን
  choice: diante da pedra
  rationale: Mantém o substantivo material do ge’ez, provavelmente usado de modo genérico para objetos cultuais de pedra, sem acrescentar “ídolo” neste ponto.
- source_word: ይገብሩ ምስለ
  choice: fazem uma imagem
  rationale: Entende ምስለ como forma do substantivo “imagem”, singular, e ይገብሩ como “fazem”; evita suprir um plural não expresso.
- source_word: ዘወርቅ ወዘብሩር ወዘዕፅ ወዘልሕኵት
  choice: de ouro, de prata, de madeira e de barro
  rationale: Reproduz a lista de materiais e, mediante a repetição de “de”, reflete de modo natural em português a estrutura reiterada do original.
- source_word: ነፍሳት እኩያት
  choice: espíritos maus
  rationale: A leitura sobrenatural se ajusta ao contexto de culto, à coordenação com demônios e ídolos e ao uso possível de ነፍሳት, sem ocultar em nota a alternativa literal “almas más”.
- source_word: አጋንንት
  choice: demônios
  rationale: É a designação corrente e direta para seres sobrenaturais malignos, adequada ao registro apocalíptico.
- source_word: ጣዖት
  choice: ídolo
  rationale: Equivalente claro e convencional para um objeto de culto no contexto da denúncia da idolatria.
- source_word: ኢበተምሃር
  choice: sem entendimento
  rationale: Conserva a dimensão cognitiva da expressão negativa sem restringi-la indevidamente ao sentido pedagógico de “não instruídos”.
- source_word: ወኵሎ ረድኤተ ኢይረክቡ እምኔሆሙ
  choice: não encontrarão ajuda alguma da parte deles
  rationale: Traduz o verbo como “encontrarão” e expressa com “ajuda alguma” a negação total, mantendo a ironia de que os objetos e seres cultuados não podem socorrer seus devotos.
theological_decisions:
- issue: Se o primeiro objeto deve ser explicitado como um ídolo de pedra
  choice: pedra
  alternative: ídolo de pedra
  rationale: O ge’ez apresenta diretamente o substantivo “pedra”. A formulação preserva a crueza da referência ao material e evita inserir uma identificação não explícita.
- issue: Identidade de ነፍሳት እኩያት
  choice: espíritos maus
  alternative: almas más / almas dos maus
  rationale: A coordenação imediata com demônios e todo ídolo favorece uma referência sobrenatural, mas a amplitude lexical de “alma/espírito” é preservada em nota.
- issue: Número da imagem feita com os materiais enumerados
  choice: uma imagem
  alternative: imagens
  rationale: A forma nominal ምስለ é singular. Embora a enumeração possa sugerir vários objetos na situação descrita, a tradução conserva o número gramatical do texto disponível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe coordenada que conserva a cadência acumulativa do ge’ez. “Prostram-se diante de” explicita em português o complemento natural do gesto. A pontuação antes da conclusão destaca a sentença de inutilidade dos objetos e seres cultuados.
