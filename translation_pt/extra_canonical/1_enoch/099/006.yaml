base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/006.yaml
  text: 'And again I swear to you[a], sinners: sin has been prepared for the day of blood that does not cease.'
translation:
  language: pt
  text: 'E mais uma vez juro a vocês, pecadores: o pecado[a] foi preparado para o dia do sangue que não cessa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o castigo — ou o juízo — foi preparado para o dia do derramamento de sangue”. O texto ge''ez diz literalmente “pecado”, mas o termo pode estar sendo usado de modo condensado para indicar sua consequência.'
    reason: Registra uma alternativa lexical e sintática plausível sem apagar do texto principal a leitura direta e teologicamente tensa do ge'ez.
lexical_decisions:
- source_word: ወካዕበ
  choice: E novamente
  rationale: Preserva tanto a conjunção quanto a ideia de repetição, mantendo a cadência do discurso profético.
- source_word: እኔ፡ እምሕል፡ ለክሙ
  choice: juro a vocês
  rationale: Expressa uma declaração solene sob juramento, com mais força do que simplesmente “digo”; “a vocês” oferece leitura natural no português brasileiro atual.
- source_word: ለኃጥኣን
  choice: pecadores
  rationale: Mantém o destinatário em forma de vocativo, sem acrescentar elementos ausentes no texto.
- source_word: ለዕለተ፡ ደም
  choice: para o dia do sangue
  rationale: Conserva a formulação concreta e literal do ge'ez, evitando resolver “sangue” interpretativamente como “derramamento de sangue” no texto principal.
- source_word: ዘአየሀድአ
  choice: que não cessa
  rationale: Reproduz a forma relativa e a ideia de continuidade sem a expansão interpretativa “incessante derramamento de sangue”.
- source_word: ተደለወት
  choice: foi preparado
  rationale: Mantém o sentido passivo de algo deixado pronto de antemão, sem especificar quem o preparou.
- source_word: ኃጢአት
  choice: o pecado
  rationale: Traduz o valor lexical direto do substantivo e preserva a expressão difícil, em vez de substituí-la no texto por sua possível consequência judicial.
theological_decisions:
- issue: Se ኃጢአት designa o pecado propriamente dito ou, por metonímia, sua consequência judicial
  choice: Manter “o pecado” no texto principal
  alternative: “o castigo” ou “o juízo pelo pecado” foi preparado
  rationale: O ge'ez traz diretamente “pecado”. A formulação pode personificar o pecado ou empregar o termo de modo condensado para sua consequência; a tradução preserva essa tensão e registra a leitura alternativa em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Juro a vocês” evita tanto o tom excessivamente arcaico de “juro-vos” quanto a perda de solenidade de “afirmo”. A expressão incomum “dia do sangue que não cessa” foi mantida deliberadamente para refletir a linguagem comprimida e ameaçadora do original.
