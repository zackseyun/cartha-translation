base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/001.yaml
  text: 'Woe to you who do wickedness[a], and who praise and honor the word of falsehood: you will perish[b], and no good life will be yours.'
translation:
  language: pt
  text: '**1 Enoque 99:1** — Ai de vocês que praticam a maldade e louvam e honram a palavra de mentira[a]: vocês perecerão[b] e não terão uma vida boa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um assunto falso” ou “a fala enganosa”. O termo ge’ez está no singular e pode significar “palavra”, “assunto” ou “fala”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “serão destruídos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo, em português atual e amplamente compreensível.
- source_word: እለ፡ ትገብሩ፡ ርሰናናተ
  choice: que praticam a maldade
  rationale: Expressa uma conduta ativa e habitual sem especificar uma forma particular de transgressão não indicada com segurança pelo texto.
- source_word: ወበነገረ፡ ሐሰት
  choice: a palavra da mentira
  rationale: Mantém o substantivo singular em estado construto. “Palavra” conserva a formulação do texto, enquanto a nota registra que ነገር também pode significar assunto ou fala.
- source_word: ትሴብሑ፡ ወታከብሩ
  choice: louvam e honram
  rationale: Reproduz o paralelismo de aprovação pública com verbos naturais e dignos em português.
- source_word: ተሐጕልክሙ
  choice: Vocês perecerão
  rationale: Comunica de modo direto a ruína anunciada, deixando “serão destruídos” como alternativa lexical possível.
- source_word: ወአልብክሙ፡ ሕይወተ፡ ሠናይተ
  choice: e não terão uma vida boa
  rationale: Preserva a negação da posse de uma vida boa em linguagem portuguesa clara, sem definir se a referência é apenas terrena ou também escatológica.
theological_decisions:
- issue: Alcance da expressão “vida boa”
  choice: Manter “vida boa” sem explicar no corpo do versículo seu alcance temporal ou escatológico
  alternative: Interpretar como prosperidade nesta vida ou, de modo exclusivo, como vida futura
  rationale: No contexto dos oráculos de condenação, a expressão pode carregar peso moral e escatológico, mas o versículo não resolve explicitamente o alcance; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas de tratamento amplamente inteligíveis no Brasil e em outros contextos lusófonos. A sintaxe mantém o caráter incisivo do oráculo de condenação sem recorrer a terminologia denominacional.
