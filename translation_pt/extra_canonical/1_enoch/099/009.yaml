base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/009.yaml
  text: They will forget and be afraid[a], because they did all their works in falsehood, and they worshiped a stone[d][c][b], and they will perish in an instant.
translation:
  language: pt
  text: Eles se esquecerão e terão medo, pois fizeram todas as suas obras em falsidade, adoraram uma pedra[a] e perecerão num instante.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “adoraram uma pedra”; a expressão provavelmente se refere à adoração de um ídolo ou imagem de pedra.
    reason: cultural_note
  - marker: b
    text: 'Ou: “perecerão de repente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይረሰዑ
  choice: eles se esquecerão
  rationale: O verbo é mais naturalmente entendido como futuro ativo plural, “esquecerão”; a construção pronominal é idiomática em português e evita a leitura passiva “serão esquecidos”.
- source_word: ይፈርሁ
  choice: terão medo
  rationale: Preserva o sentido simples de temer sem intensificá-lo como “ficarão aterrorizados”.
- source_word: ኵሎ፡ ገብሮሙ፡ በሐሰት
  choice: fizeram todas as suas obras na falsidade
  rationale: Mantém a totalidade das ações e o valor moral da expressão preposicional, em linguagem de julgamento.
- source_word: ለአብን
  choice: uma pedra
  rationale: Conserva o objeto concreto e singular do ge'ez, sem explicitar no texto principal que se trata de um ídolo.
- source_word: ይትሐጐሉ
  choice: perecerão
  rationale: Expressa ruína ou destruição sem determinar o modo exato, de acordo com o sentido apocalíptico do verbo.
- source_word: በምዕር
  choice: num instante
  rationale: Segue a revisão lexical mais recente, que identifica a expressão como temporal, “num instante” ou “subitamente”, e não como “em vergonha”.
theological_decisions:
- issue: Imagem idolátrica no singular
  choice: adoraram uma pedra
  alternative: adoraram um ídolo de pedra
  rationale: O ge'ez traz um objeto singular e concreto. Mantê-lo evita acrescentar uma interpretação explicativa ao texto principal.
- issue: Natureza da sentença final
  choice: perecerão num instante
  alternative: perecerão de repente
  rationale: A tradução comunica tanto a ruína quanto a rapidez do juízo, sem introduzir a ideia de vergonha, que depende de outra análise lexical.
translation_notes:
  register: Português moderno, digno e acessível, com cadência de pronunciamento profético. O singular concreto “uma pedra” e a formulação moral “na falsidade” foram preservados.
