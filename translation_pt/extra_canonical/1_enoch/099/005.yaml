base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/005.yaml
  text: And in those days those who are pregnant will go out and cast away their children[a], and they will abandon them; and their offspring will slip from them. And while nursing, they will cast away their children and will not return to them[e][d][c][b], and they will have no mercy on their beloved ones.
translation:
  language: pt
  text: E, naqueles dias, as que estiverem grávidas sairão e rejeitarão seus filhos[a]; elas os abandonarão, e sua prole lhes escapará. Mesmo enquanto os amamentarem, rejeitarão seus filhos e não voltarão para eles[b]; não terão compaixão de seus entes queridos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sequência inicial do texto etíope é difícil. Também pode ser entendida com verbos como “dar à luz”, “trazer para fora” ou “tomar à força”; o sentido geral é de nascimento ou gravidez seguidos de rejeição violenta dos filhos.
    reason: textual_variant
  - marker: b
    text: 'As referências repetidas à gravidez, à amamentação, aos filhos e aos entes queridos intensificam a cena de juízo: até a compaixão familiar mais elementar entra em colapso.'
    reason: cultural_note
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e seu registro profético, em português corrente e solene.
- source_word: እለ፡ ይጼንሱ
  choice: as que estiverem grávidas
  rationale: O contexto subsequente de filhos e amamentação favorece o estado de gravidez, sem restringir o sentido à mera concepção.
- source_word: ይወፅኡ
  choice: sairão
  rationale: Adota o sentido lexical direto de sair, evitando incorporar ao verbo uma violência que pode pertencer ao verbo seguinte; a dificuldade da sequência é indicada em nota.
- source_word: ይመሥጡ፡ ደቂቆሙ
  choice: rejeitarão seus filhos
  rationale: A sequência aponta para retirada ou rejeição violenta dos filhos. 'Rejeitarão' mantém a dureza sem especificar um modo físico incerto.
- source_word: ይገድፍዎሙ
  choice: elas os abandonarão / rejeitarão seus filhos
  rationale: O verbo recorrente expressa lançar fora ou abandonar. A variação portuguesa evita repetição excessivamente mecânica, preservando a recorrência temática.
- source_word: ይደህፁ፡ ውሉዶሙ
  choice: seus descendentes lhes escaparão
  rationale: Segue com cautela a ideia de afastamento ou perda presente na leitura de consulta, sem transformar o trecho incerto numa descrição explícita de morte ou aborto.
- source_word: እንዘ፡ ይጠብዉ
  choice: mesmo enquanto os amamentarem
  rationale: O verbo ጠበወ refere-se a sugar, aleitar ou amamentar. A construção destaca que o abandono ocorre apesar do vínculo de cuidado ainda existente.
- source_word: ኢይገብኡ፡ ኀቤሆሙ
  choice: não voltarão para eles
  rationale: Expressa de modo idiomático o não retorno aos filhos depois do abandono.
- source_word: ኢይምሕርዎሙ፡ ለፍቁራኒሆሙ
  choice: não terão compaixão de seus entes queridos
  rationale: Mantém a linguagem de misericórdia e o peso afetivo do termo para aqueles que lhes são queridos, em português natural.
theological_decisions:
- issue: Se a cena descreve violência social genérica ou a ruína da afeição familiar em contexto de juízo
  choice: A tradução destaca o abandono dos próprios filhos e a perda da compaixão familiar.
  alternative: Generalizar a passagem como mera violência social ou defini-la especificamente como uma cena de aborto e infanticídio.
  rationale: As referências repetidas à gravidez, aos filhos, à amamentação, ao retorno e aos entes queridos situam a imagem na desintegração dos vínculos familiares. A tradução não especifica além do que o texto incerto permite.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva cadência profética e gravidade sem arcaísmos. A ambiguidade textual da primeira metade é preservada e explicitada em nota, enquanto o sentido correto de ጠበወ como amamentar é incorporado ao texto principal.
