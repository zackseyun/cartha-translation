base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/012.yaml
  text: Woe to you who make the measure of sin and deceit[a], and who cause bitterness upon the earth[c][b], for by it they will be destroyed.
translation:
  language: pt
  text: Ai de vocês que fazem da medida instrumento de pecado e engano[a] e que causam amargura sobre a terra[b], pois por isso serão destruídos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção etíope é difícil e diz literalmente algo próximo de “fazem a medida pecado e engano”. Provavelmente denuncia o uso fraudulento de pesos ou medidas; também se pode traduzir: “fazem a medida de pecado e engano”.'
    reason: lexical_alternative
  - marker: b
    text: A leitura “causam amargura” segue uma correção do texto transcrito. A forma apresentada na transcrição é incerta e já foi entendida como “provocam” ou “incitam” esse mal.
    reason: textual_uncertainty
  - marker: c
    text: 'Ou: “pois por meio disso serão destruídos”. O pronome pode retomar a prática corrupta ou o mal mencionado anteriormente.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: Ai de vocês
  rationale: Conserva a fórmula profética de denúncia e juízo em português atual e solene.
- source_word: ትገብርዋ፡ ለመስፈርት፡ ኃጢአት፡ ወሐሱት
  choice: fazem da medida instrumento de pecado e engano
  rationale: Mantém os elementos concretos 'fazer', 'medida', 'pecado' e 'engano', mas explicita idiomaticamente que a medida é empregada para a fraude. Evita a leitura pouco natural de 'praticar a medida do pecado' e também não reduz o texto apenas a 'medida falsa'.
- source_word: ታምርሩ
  choice: causam amargura
  rationale: Segue a leitura corrigida atestada na revisão da fonte, derivada da raiz associada a tornar amargo ou causar amargura, em vez da forma corrompida da transcrição fornecida.
- source_word: ዲበ፡ ምድር
  choice: sobre a terra
  rationale: Preserva o alcance espacial e o tom elevado da expressão enoquita.
- source_word: እስመ፡ ቦቱ፡ ይትዌደኡ
  choice: pois por isso serão destruídos
  rationale: A expressão pode ser instrumental ou causal. 'Por isso' preserva a ligação entre a conduta denunciada e a destruição sem fixar de modo excessivo o antecedente do pronome.
theological_decisions:
- issue: Se a expressão da medida deve ser entendida genericamente como pecado ou concretamente como fraude comercial
  choice: fazem da medida instrumento de pecado e engano
  alternative: fazem a medida de pecado e engano
  rationale: A referência concreta à medida é preservada, e o português explicita o uso corrupto dela sem transformar a passagem numa declaração moral genérica.
- issue: Se a destruição ocorre pelo próprio mal ou por juízo divino
  choice: pois por isso serão destruídos
  alternative: pois por meio disso serão destruídos
  rationale: A gramática liga a ruína ao mal precedente, mas não exige que se exclua o juízo divino como agente último. A formulação mantém essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência brasileira em “vocês”. O texto mantém a imagem concreta da medida, a força profética de “Ai” e a ambiguidade causal do encerramento.
