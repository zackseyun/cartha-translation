base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/002.yaml
  text: Woe to those who pervert the word of righteousness and the eternal ordinance[a], and reckon themselves not to be sinners[c][b]; they shall be trampled upon the earth.
translation:
  language: pt
  text: Ai dos que pervertem a palavra da justiça e a ordenança eterna, e consideram que não são pecadores[a]; serão pisoteados sobre a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido por “pecadores” está marcado como textualmente incerto na edição etíope. A construção parece indicar que essas pessoas se consideram livres de pecado, e não que o narrador confirme a inocência delas.
    reason: textual_variant
lexical_decisions:
- source_word: አሌ
  choice: Ai
  rationale: Preserva a fórmula profética de denúncia e juízo, em linguagem solene e natural em português.
- source_word: ይዌልጥዎሙ
  choice: pervertem
  rationale: Expressa a ideia de desviar ou deformar aquilo que é reto, adequada ao contexto moral e judicial.
- source_word: ለነገረ ርትዕ
  choice: a palavra da justiça
  rationale: Mantém a amplitude de ነገር, que pode indicar palavra, mensagem ou assunto, sem restringir indevidamente o sentido.
- source_word: ሥርዐተ እንተ ለዓለም የኃልዉ
  choice: a ordenança eterna
  rationale: Conserva o sentido normativo e solene de ሥርዐት e traduz de modo conciso a permanência expressa pela oração seguinte.
- source_word: ወይሬስዩ ርእሶሙ ዘአኮኑ [ኃጥኣነ]
  choice: e consideram que não são pecadores
  rationale: Entende a construção reflexiva ረስየ ርእሶ como ‘considerar-se’, evitando a tradução corporal equivocada ‘virar a cabeça’ e preservando a alegação de inocência feita pelos próprios condenados.
- source_word: ይትከየዱ
  choice: serão pisoteados
  rationale: Mantém a voz passiva e a imagem concreta de humilhação e castigo no oráculo de juízo.
theological_decisions:
- issue: Natureza da denúncia contra os que corrompem a justiça e a ordenança
  choice: Oráculo de juízo contra pessoas que distorcem a mensagem justa e a ordem permanente
  alternative: Simples lamento ético sem conotação judicial
  rationale: A fórmula ‘Ai’ e a punição final situam o verso entre denúncias apocalípticas de juízo.
- issue: Sentido da expressão reflexiva com ‘não pecadores’
  choice: Os condenados consideram a si mesmos não pecadores
  alternative: Eles realmente não eram pecadores na terra
  rationale: A construção reflexiva favorece uma declaração de autoavaliação ou pretensão de inocência; essa leitura também preserva a tensão entre a alegação deles e o juízo anunciado.
- issue: Incerteza textual do termo ‘pecadores’
  choice: Manter ‘pecadores’ no texto e sinalizar sua condição textual em nota
  alternative: Omitir o termo ou reconstruir silenciosamente a frase
  rationale: O substantivo é necessário para a leitura transmitida, mas aparece marcado como textualmente incerto na edição; a nota oferece transparência sem apagar o sentido provável.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com leitura natural no Brasil. Conservam-se a fórmula profética “Ai”, o vocabulário judicial e a imagem concreta do castigo, sem arcaísmos desnecessários.
