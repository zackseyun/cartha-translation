review_pass:
  verdict: revise
  source_fidelity: É necessária uma correção textual no segundo membro. A leitura «por seus próximos» depende de tratar በቢጸል como repetição do termo para «próximo/companheiro», mas a forma é provavelmente uma falha de transcrição/OCR por በሲኦል («no Sheol»). A tradução histórica de Charles para este versículo confirma a leitura «in Sheol». O primeiro membro é bem expresso como mal dirigido aos próximos, sem necessidade de converter a preposição em associação no texto principal.
  naturalness: «Ai de vocês» e «espalham o mal contra seus próximos» são naturais, atuais e conservam o tom de denúncia. «Serão mortos no Sheol» é claro e mantém o registro apocalíptico; «Sheol» deve permanecer como nome do lugar dos mortos, sem explicação interpretativa no corpo do versículo.
  terminology: «Sheol» é o termo apropriado para a leitura ሲኦል e não deve ser substituído por «inferno». «Próximos» comunica adequadamente o referente relacional do primeiro membro e evita a conotação excessivamente restrita de «companheiros».
  issues:
  - severity: high
    issue: O texto principal traduz በቢጸል como «por seus próximos».
    rationale: Essa leitura reproduz uma provável corrupção de OCR/transcrição. Neste versículo, a leitura sustentada pela edição/tradução de Charles é በሲኦል, «no Sheol». Portanto, a atual retribuição por vizinhos/companheiros e o suposto jogo retórico não têm base textual segura.
  - severity: medium
    issue: As notas a e b apresentam «companheiro/associado» e uma leitura associativa ou instrumental como alternativas salientes.
    rationale: Elas dão peso indevido a uma interpretação que não é necessária para o primeiro membro e que reforça artificialmente a leitura equivocada do segundo. A incerteza relevante é a forma textual final e deve ser registrada de modo preciso.
  - severity: medium
    issue: A nota c trata «no Sheol» apenas como emenda proposta.
    rationale: Dadas a falha reconhecível na transcrição e a leitura da edição de Charles, «no Sheol» deve estar no texto principal; a nota deve documentar a discrepância da transcrição fornecida.
  revised_text: Ai de vocês que espalham o mal contra seus próximos, pois serão mortos no Sheol.[a]
  revised_footnotes:
  - marker: a
    text: A sequência final da transcrição fornecida (በቢጸል) parece refletir uma falha de transcrição ou OCR. A leitura በሲኦል significa “no Sheol” e é a que fundamenta esta tradução.
    reason: textual_variant
  revision_rationale: A revisão restabelece a leitura «no Sheol», atestada para o versículo na tradição editorial de Charles, em vez de construir uma retribuição por «próximos/companheiros» a partir de uma forma transcrita provavelmente corrompida. Mantém-se a denúncia dirigida aos que propagam o mal contra os seus próximos e registra-se de forma transparente a dificuldade da transcrição, sem transformar Sheol em uma categoria doutrinária posterior.
