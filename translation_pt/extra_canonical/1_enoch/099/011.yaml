translation:
  language: pt
  text: Ai de vocês que espalham o mal contra os seus próximos[a][b], pois vocês serão mortos por seus próximos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido por “próximos” também pode significar “companheiros”, “associados” ou “semelhantes”.
    reason: lexical_alternative
  - marker: b
    text: A primeira expressão também pode ser entendida como “espalham o mal com os seus companheiros” ou “por meio dos seus companheiros”, pois a preposição admite valor associativo ou instrumental.
    reason: lexical_alternative
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: Ai de vocês
  rationale: Preserva a força denunciadora da fórmula profética de juízo em português natural e solene.
- source_word: እለ፡ ትሰፍሕዋ፡ ለእኩይ
  choice: que espalham o mal
  rationale: O verbo comunica a ideia de estender, alargar ou fazer propagar; “espalham” conserva essa imagem sem soar artificial.
- source_word: በቢጽክሙ
  choice: contra o seu próximo
  rationale: No contexto, o termo relacional pode designar próximos, companheiros ou semelhantes. “Contra” apresenta essas pessoas como atingidas pelo mal, conforme a leitura contextual adotada, sem ocultar em nota a possível força associativa ou instrumental da preposição.
- source_word: እስመ
  choice: pois
  rationale: Introduz de modo direto a razão do anúncio de desgraça.
- source_word: በቢጸል
  choice: por seus próximos
  rationale: A leitura do texto fornecido favorece um termo da mesma esfera lexical de “próximo/companheiro”, com preposição instrumental. A repetição mantém a reversão retórica entre o mal dirigido ao próximo e a morte causada por próximos.
- source_word: ትትቀተሉ
  choice: vocês serão mortos
  rationale: Expressa claramente o passivo com valor futuro no contexto de juízo, em registro digno e atual.
theological_decisions:
- issue: Natureza da retribuição
  choice: 'O dito apresenta uma retribuição correspondente: quem espalha o mal contra o próximo será morto por próximos.'
  alternative: O mal é espalhado com ou por meio de companheiros, e os culpados acabam mortos por companheiros.
  rationale: A formulação principal acompanha a leitura contextual mais recente, mas as notas preservam a ambiguidade preposicional e lexical do ge’ez, sem transformar uma possibilidade gramatical em conclusão doutrinária.
- issue: Possível leitura “no Sheol”
  choice: Traduzir በቢጸል conforme o texto fornecido, como referência a próximos ou companheiros.
  alternative: “no Sheol”, caso በቢጸል seja erro de transcrição por በሲኦል.
  rationale: O testemunho transcrito apresentado contém በቢጸል, não በሲኦል. Como a confiança da fonte é média e há histórico de suspeita de OCR, a variante é registrada em nota, mas não substitui silenciosamente o texto-fonte disponível.
translation_notes:
  register: Português moderno, internacional e de fácil leitura no Brasil. “Ai de vocês” conserva o tom profético; “próximo” mantém a relação ética entre as pessoas e permite repetir o campo lexical na retribuição. As notas registram tanto a ambiguidade da preposição quanto a possível dificuldade textual, sem resolvê-las de modo silencioso.
