base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/010.yaml
  text: And in those days[a], blessed are all those who accept the word of wisdom, and understand it, and do it, and follow the way of the Most High, and walk in the way of his righteousness, and do not act wickedly with those who act wickedly[d][c][b]; for they shall be saved.
translation:
  language: pt
  text: E, naqueles dias, bem-aventurados todos os que acolhem a palavra de sabedoria[a], a compreendem e a põem em prática, seguem o caminho do Altíssimo, andam no caminho da sua justiça e não agem perversamente com os que agem perversamente[b], pois serão salvos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mensagem de sabedoria”. O termo ge’ez pode significar “palavra”, “assunto” ou “mensagem”.
    reason: lexical_alternative
  - marker: b
    text: O verbo repetido também pode carregar as ideias de tornar-se corrupto, desviar-se ou chegar à ruína; aqui, seu sentido mais direto é agir perversamente ou com impiedade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: bem-aventurados
  rationale: Conserva o registro sapiencial e escatológico de favor divino, em vez de reduzir o sentido a um estado emocional como “felizes”.
- source_word: ይትሜጠዉ
  choice: acolhem
  rationale: Expressa receber e aceitar de modo responsivo a sabedoria; é natural em português e mantém a ideia de adesão.
- source_word: ነገረ ጥበብ
  choice: a palavra de sabedoria
  rationale: Preserva a forma singular e o tom elevado; ነገር também pode significar “mensagem” ou “assunto”, alternativa registrada em nota.
- source_word: ያእምርዎን
  choice: a compreendem
  rationale: No encadeamento acolher–compreender–praticar, indica compreensão efetiva, não mero conhecimento abstrato.
- source_word: ይገብርዎን
  choice: a põem em prática
  rationale: Torna claro em português que a sabedoria recebida deve ser realizada, preservando a força ética do verbo “fazer”.
- source_word: ፍኖተ ልዑል
  choice: o caminho do Altíssimo
  rationale: Mantém a imagem bíblica do caminho como conduta e verte ልዑል como título divino.
- source_word: የሐውሩ በፍኖተ ጽድቅ ዚአሁ
  choice: andam no caminho da sua justiça
  rationale: Reproduz a metáfora ética de andar em um caminho e conserva “justiça” como termo teológico sem paráfrase interpretativa.
- source_word: ኢይረሰዑ ... እለ ይረሰዑ
  choice: não agem perversamente com os que agem perversamente
  rationale: O verbo ረሰዐ denota agir de modo perverso ou ímpio; a repetição foi mantida para preservar o vínculo verbal e o contraste ético.
- source_word: ይድኅኑ
  choice: serão salvos
  rationale: Mantém o peso escatológico do resgate prometido, sem especificar o modo ou formular uma doutrina posterior.
theological_decisions:
- issue: Sentido da repetição de ረሰዐ em contraste com justiça e salvação
  choice: agir perversamente
  alternative: tornar-se corrupto, desviar-se ou perecer
  rationale: O valor ativo e ético de “agir perversamente” corresponde melhor ao verbo e à sua relação lexical com “os perversos”; a nota preserva as nuances possíveis de corrupção, extravio e ruína.
- issue: Alcance de ይድኅኑ
  choice: serão salvos
  alternative: serão libertos ou escaparão
  rationale: “Serão salvos” preserva a abertura do verbo a resgate e livramento escatológicos sem definir além do que o verso afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Bem-aventurados”, “Altíssimo”, “justiça” e “serão salvos” preservam o registro sapiencial-apocalíptico. A coordenação verbal foi mantida clara e fluente, sem eliminar a repetição enfática do original.
