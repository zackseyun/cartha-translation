base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/004.yaml
  text: But seek and choose for yourselves righteousness and a good life[a], and walk in the paths of peace[c][b], so that you may live and prosper.
translation:
  language: pt
  text: Mas busquem e escolham para vocês a retidão e uma vida boa[a], e andem pelas veredas da paz[b], para que vivam e prosperem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação etíope em torno de “uma vida boa” é difícil neste testemunho transcrito; o sentido parece ser uma vida caracterizada pela bondade ou retidão.
    reason: textual_variant
  - marker: b
    text: 'Ou: “pelos caminhos da paz”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e vivam e prosperem”. O etíope também pode ser entendido como simples continuação da exortação, em vez de finalidade ou resultado.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: እላ
  choice: Mas
  rationale: 'Entendido, conforme a revisão textual mais recente, como forma corrompida no testemunho transcrito de አላ, introduzindo contraste: “mas”.'
- source_word: ፍቅዱ
  choice: busquem
  rationale: Imperativo plural de ፈቀደ, com o sentido de buscar ou desejar; “busquem” preserva a exortação ativa e evita a leitura incorreta “amem”.
- source_word: ወኀረዩ
  choice: e escolham
  rationale: Expressa escolha moral deliberada e coordena-se naturalmente com “busquem”.
- source_word: ለክሙ
  choice: para vocês
  rationale: Torna explícito o valor benefactivo/reflexivo em português moderno de ampla compreensão.
- source_word: ጽድቀ
  choice: a justiça
  rationale: Conserva o conceito ético-religioso abrangente de retidão/justiça; “justiça” é natural no registro bíblico em português, sem restringir o sentido ao âmbito jurídico.
- source_word: ወሕይወተ ኄራተ
  choice: e uma vida boa
  rationale: Lê a expressão como vida caracterizada pela bondade, mantendo em nota a dificuldade do testemunho transcrito.
- source_word: ወሖሩ
  choice: e andem
  rationale: Preserva a metáfora bíblica de caminhar como modo de conduta.
- source_word: በፍኖዋተ ሰላም
  choice: pelas veredas da paz
  rationale: Mantém o plural e a imagem sapiencial dos caminhos, em linguagem digna e inteligível.
- source_word: ወተሐደዉ
  choice: para que vivam
  rationale: Apresenta a vida como resultado ou finalidade da conduta exortada, sem decidir rigidamente entre essas duas nuances.
- source_word: ወትደለዉ
  choice: e prosperem
  rationale: Expressa êxito ou florescimento em sentido sapiencial amplo, não necessariamente riqueza material.
theological_decisions:
- issue: Tradução de ጽድቀ como “justiça” ou “retidão”
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a amplitude ético-religiosa tradicional do termo e é corrente no registro bíblico português; “retidão” continua sendo uma alternativa lexical legítima.
- issue: Relação entre a exortação e os verbos finais
  choice: para que vivam e prosperem
  alternative: e vivam e prosperem
  rationale: A construção foi vertida como finalidade ou resultado provável, mas a simples coordenação permanece gramaticalmente possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais na terceira pessoa do plural. A tradução preserva a metáfora bíblica do caminhar e evita tanto arcaísmos desnecessários quanto uma leitura materialista de “prosperar”.
