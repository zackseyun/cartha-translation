  source_fidelity: A tradução preserva adequadamente a denúncia dirigida aos ricos, a confiança nas riquezas, a separação futura delas, a falha em lembrar-se do Altíssimo e a referência ao período de prosperidade. Contudo, a ordem e a construção de «de suas riquezas partirão» soam pouco naturais no português moderno e podem sugerir que a riqueza é o ponto de partida, em vez de o objeto do qual se afastarão.
  naturalness: «Ai de vocês, ricos» e «o Altíssimo» são naturais no registro profético. «Se afastarão de suas riquezas» comunica de modo claro e idiomático a imagem de movimento/separação sem determinar se ela se dá pela morte, pela perda dos bens ou por outra forma de juízo.
  terminology: «Ricos», «riquezas» e «Altíssimo» são escolhas adequadas e consistentes. Mantém-se «riquezas» nas três ocorrências para refletir a repetição retórica do ge'ez.
