base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/008.yaml
  text: Woe to you[a], rich ones, for you have trusted in your riches, and from your riches you will depart[b], because you did not remember the Most High in the days of your riches.
translation:
  language: pt
  text: Ai de vocês, ricos, pois confiaram em suas riquezas e se afastarão de suas riquezas[a], porque não se lembraram do Altíssimo nos dias de suas riquezas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sairão de suas riquezas” ou “partirão de suas riquezas”. A expressão pode indicar que serão privados delas ou, de modo mais amplo, que as deixarão para trás no juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo, em linguagem bíblica clara e corrente.
- source_word: አብዕልት
  choice: ricos
  rationale: Traduz diretamente o vocativo plural e soa mais natural em português do que uma reprodução como “ó ricos” ou “ricos”. Porém, combinado com “vocês”, mantém o endereço direto.
- source_word: ብዕልክሙ
  choice: suas riquezas / sua riqueza
  rationale: O termo designa riqueza ou bens. A repetição lexical foi mantida, com ajuste de número na última ocorrência para a expressão temporal soar natural em português.
- source_word: ተወከልክሙ
  choice: confiaram
  rationale: Expressa confiança ou dependência e conserva a crítica à segurança depositada na riqueza.
- source_word: ትወፅኡ
  choice: partirão
  rationale: Verbo de movimento que, com እምነ, indica sair ou afastar-se de algo. “Partirão” preserva a imagem e a ambiguidade sem especificar morte, perda ou exílio.
- source_word: ለልዑል
  choice: o Altíssimo
  rationale: Título divino tradicional, claro e amplamente reconhecido em português.
- source_word: ኢተዘከርክምዎ
  choice: não se lembraram
  rationale: Mantém o sentido direto de recordar ou ter em mente, preservando a acusação ética do texto.
- source_word: በመዋዕለ፡ ብዕልክሙ
  choice: nos dias de sua riqueza
  rationale: Preserva a expressão temporal solene e a ligação lexical com as ocorrências anteriores de riqueza.
theological_decisions:
- issue: Sentido de “de suas riquezas partirão”
  choice: Manter a imagem literal de separação das riquezas.
  alternative: Explicitar que morrerão e deixarão as riquezas, que serão privados delas ou que sairão da prosperidade.
  rationale: O ge'ez é conciso e não determina o modo exato do juízo. A tradução conserva a tensão entre perda dos bens, separação deles e partida em juízo.
translation_notes:
  register: Português moderno, digno e acessível, com cadência profética. A repetição de “riqueza(s)” foi preservada por sua função retórica; evitou-se explicar além do que o ge'ez afirma.
