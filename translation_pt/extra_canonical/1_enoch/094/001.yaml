base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/001.yaml
  text: 'And now I say to you[a], my children: love righteousness and walk in it; for the paths of righteousness are worthy and acceptable[c][b], but the paths of iniquity will quickly be destroyed and vanish.'
translation:
  language: pt
  text: 'E agora lhes digo, meus filhos: amem a retidão e andem nela, pois os caminhos da retidão são dignos e aceitáveis[a]; mas os caminhos da iniquidade serão rapidamente destruídos e desaparecerão.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão em ge'ez traduzida por “dignos e aceitáveis” é de interpretação difícil; também pode ter o sentido de “apropriados e aprovados”.
    reason: lexical_alternative
  - marker: b
    text: “Iniquidade” também pode ser entendida como injustiça ou prática do mal; em alguns contextos, a palavra pode incluir violência.
    reason: lexical_alternative
lexical_decisions:
- source_word: እብለክሙ
  choice: eu lhes digo
  rationale: Preserva a fórmula direta de fala e o tom de exortação paterna em português natural.
- source_word: ደቂቅየ
  choice: meus filhos
  rationale: Mantém o tratamento familiar e instrutivo sem restringir explicitamente os destinatários aos homens.
- source_word: አፍቅርዋ ለጽድቅ
  choice: amem a justiça
  rationale: Neste contexto ético, “justiça” expressa de modo claro e abrangente a conduta reta, sem limitar o sentido à esfera jurídica.
- source_word: ወባቲ ሖሩ
  choice: e andem nela
  rationale: Conserva a metáfora bíblica do andar como modo de vida; o pronome retoma “justiça”.
- source_word: ፍኖዋተ ጽድቅ
  choice: os caminhos da justiça
  rationale: Preserva a imagem concreta dos caminhos morais e sua correspondência com a exortação a andar.
- source_word: ይደሉ ወይትወከፍ
  choice: são dignos e aceitáveis
  rationale: Mantém os dois predicados avaliativos do ge'ez, embora a formulação textual seja difícil.
- source_word: ፍኖዋተ ዓመፃ
  choice: os caminhos da iniquidade
  rationale: Representa o amplo mal moral de ዓመፃ e estabelece o contraste direto com “justiça”, sem confundi-lo necessariamente com o termo específico para violência empregado no versículo seguinte.
- source_word: ፍጡነ
  choice: depressa
  rationale: Comunica com naturalidade a rapidez e urgência indicadas pelo advérbio.
- source_word: ይትሐጐላ ወየሐፅፃ
  choice: serão destruídos e desaparecerão
  rationale: Conserva a expressão verbal dupla, distinguindo ruína de desaparecimento.
theological_decisions:
- issue: Sentido de ጽድቅ na exortação sapiencial-apocalíptica
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é corrente, abrangente e compreensível em português bíblico moderno; aqui inclui a vida moral reta, não apenas decisões jurídicas.
- issue: Sentido de ዓመፃ em contraste com ጽድቅ
  choice: iniquidade
  alternative: injustiça ou violência
  rationale: “Iniquidade” preserva o contraste moral amplo com “justiça”. “Violência” é possível em certos contextos, mas pode estreitar o sentido e confundi-lo com um vocábulo distinto no versículo seguinte.
- issue: Força do par avaliativo ይደሉ ወይትወከፍ
  choice: dignos e aceitáveis
  alternative: apropriados e aprovados
  rationale: A tradução mantém os dois elementos sem resolver excessivamente uma construção ge'ez de interpretação lexical difícil.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega “vocês” de modo implícito nas formas “lhes/amem/andem”, conserva a metáfora dos caminhos e evita linguagem denominacional.
