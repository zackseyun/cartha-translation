base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/003.yaml
  text: 'And now I say to you[a], the righteous: do not walk in the paths of evil, nor in the paths of death, and do not draw near to them[b], lest you be destroyed.'
translation:
  language: pt
  text: 'E agora digo a vocês, os justos: não andem pelas veredas[a] do mal nem pelas veredas da morte, e não se aproximem deles[b], para não serem destruídos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “caminhos”; a imagem descreve um modo ou curso de vida.
    reason: lexical_alternative
  - marker: b
    text: “Deles” provavelmente se refere às pessoas que seguem essas veredas; também pode abranger, de modo figurado, as próprias veredas do mal e da morte.
    reason: referential_ambiguity
  - marker: c
    text: Também pode ser traduzido por “para não perecerem” ou “para não serem arrastados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Marca naturalmente a transição para uma nova exortação e preserva a ligação com o contexto anterior.
- source_word: እብል ለክሙ ለጻድቃን
  choice: digo a vocês, os justos
  rationale: Mantém a fala direta e identifica com clareza o grupo destinatário, em português atual e amplamente compreensível.
- source_word: ኢትሖሩ
  choice: não andem
  rationale: Conserva a metáfora ética de caminhar por determinado curso de vida, reforçada pelo substantivo 'veredas'.
- source_word: በፍኖዋተ
  choice: pelas veredas
  rationale: Preserva a imagem concreta e sapiencial de caminhos morais; 'caminhos' também seria possível.
- source_word: እኩይ
  choice: mal
  rationale: Expressa aqui a realidade moral abstrata sem personificá-la como 'o Maligno'.
- source_word: ሞት
  choice: morte
  rationale: Tradução direta que mantém o forte contraste ético e escatológico do texto.
- source_word: ኢትቅረቡ ኀቤሆሙ
  choice: não se aproximem deles
  rationale: Preserva o pronome plural masculino do ge'ez, que provavelmente aponta para pessoas associadas a tais veredas, sem eliminar a possibilidade de uma referência mais ampla.
- source_word: ከመ ኢትትሐጐሉ
  choice: para não serem destruídos
  rationale: Reproduz a finalidade ou consequência negativa e mantém aberta a natureza da ruína — física, judicial ou mais abrangente.
theological_decisions:
- issue: Referente do pronome em 'não se aproximem deles'
  choice: Manter o pronome masculino plural 'deles', sugerindo pessoas caracterizadas pelas veredas do mal e da morte.
  alternative: Entender o pronome metaforicamente como referência às próprias veredas, ou como referência abrangente tanto às veredas quanto aos que as seguem.
  rationale: A forma pronominal favorece referentes pessoais, mas o encadeamento da frase permite uma abrangência maior; a nota preserva essa tensão sem fixar uma interpretação denominacional.
- issue: Alcance de 'serem destruídos'
  choice: Manter a formulação ampla 'serem destruídos'.
  alternative: Traduzir por 'perecerem' ou 'serem arrastados'.
  rationale: O contexto de juízo admite ruína física ou judicial, mas o texto não exige que sua natureza seja especificada.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas correntes no Brasil e inteligíveis internacionalmente. A metáfora de caminhar por veredas foi mantida, assim como as ambiguidades do referente pronominal e da natureza da destruição.
