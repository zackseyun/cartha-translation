base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/005.yaml
  text: And command them in the thought of your hearts[a], and do not let my words be blotted out from your hearts; for I know that sinners will tempt men to practice evil wisdom, and no place will be found for it[f][e][d][c][b], and no temptation will diminish.
translation:
  language: pt
  text: E ordenem-lhes[d][e] no pensamento do coração de vocês[a], e não deixem que minhas palavras sejam apagadas do coração de vocês; pois sei que os pecadores tentarão as pessoas a praticar uma sabedoria perversa, e nenhum lugar será encontrado para ela[b], e nenhuma tentação[f] diminuirá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na intenção do coração de vocês”. O ge''ez combina pensamento ou intenção interior com o coração como sede da resolução.'
    reason: lexical_alternative
  - marker: b
    text: A frase “nenhum lugar será encontrado para ela” é difícil. “Lugar” pode indicar um local literal, espaço ou oportunidade para essa sabedoria perversa.
    reason: alternative_reading
  - marker: c
    text: A cláusula final é incerta; também pode significar que nenhuma aflição a removerá ou a abreviará.
    reason: textual_variant
  - marker: d
    text: 'Ou: “E deem-lhes uma ordem”.'
    reason: previous_rendering
  - marker: e
    text: 'Ou: “deem-lhes instruções”.'
    reason: previous_rendering
  - marker: f
    text: 'Ou: “provação”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ትእዛዙ
  choice: ordenem-nas
  rationale: Preserva a força imperativa do verbo de ordenar ou incumbir. O pronome mantém a referência plural do ge'ez sem explicitar um antecedente que o verso não identifica claramente.
- source_word: በሐሊና ልብክሙ
  choice: no pensamento do coração de vocês
  rationale: Mantém a combinação semítica de pensamento ou intenção com o coração como sede da reflexão e da resolução interior, usando uma forma compreensível no português moderno.
- source_word: ኢይደምስስ ነገርየ እምልብክሙ
  choice: não deixem que minhas palavras sejam apagadas do coração de vocês
  rationale: Conserva a imagem vívida de apagar ou eliminar as palavras da memória e da disposição interior.
- source_word: አአምር
  choice: sei
  rationale: Equivalente direto e natural da declaração de conhecimento em primeira pessoa.
- source_word: ያሜክሮዎሙ ኃጥኣን ለሰብእ
  choice: os pecadores tentarão as pessoas
  rationale: A forma causativa do radical m-k-r exprime tentar, provar ou seduzir, não simplesmente instruir. “Tentarão” também preserva a ligação lexical com መከራ no fim do verso.
- source_word: ይግበሩ ጥበበ እኩየ
  choice: a praticar uma sabedoria perversa
  rationale: “Praticar” comunica o fazer ativo, enquanto “sabedoria perversa” conserva a inversão irônica do termo sapiencial sem reduzi-lo a maldade genérica.
- source_word: ኵሉ መካን ኢይትረከብ ላቲ
  choice: nenhum lugar será encontrado para ela
  rationale: Segue de perto a construção difícil do ge'ez e permite que “lugar” signifique local, espaço ou oportunidade, sem decidir entre essas possibilidades.
- source_word: ኵሉ መከራ አያሐፅፅ
  choice: nenhuma tentação diminuirá
  rationale: “Tentação” preserva a relação lexical com o verbo anterior. O verbo final permanece deliberadamente geral porque sua semântica e a construção da cláusula são incertas.
theological_decisions:
- issue: Se a advertência trata apenas de comportamento mau ou da corrupção da própria sabedoria
  choice: sabedoria perversa
  alternative: astúcia perversa
  rationale: 'A manutenção de “sabedoria” conserva a tensão sapiencial do texto: os pecadores levam outros a uma forma moralmente pervertida daquilo que se apresenta como sabedoria.'
- issue: Relação entre a ação dos pecadores e a cláusula final
  choice: tentarão / tentação
  alternative: seduzirão / aflição
  rationale: A repetição em português procura refletir a ligação lexical entre as formas ge'ez, sem eliminar a incerteza quanto ao sentido preciso da cláusula final.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa plural construídas com “vocês” para boa legibilidade brasileira. A sintaxe ligeiramente incomum da primeira e da última cláusulas foi mantida porque o ge'ez é difícil nesses pontos; as notas registram alternativas sem resolver silenciosamente a ambiguidade.
