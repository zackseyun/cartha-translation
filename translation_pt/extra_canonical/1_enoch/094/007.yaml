base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/007.yaml
  text: Woe to those who build their houses by sin, for they will be torn down from all their foundations; [and they will fall by the sword;] and those who acquire gold and silver will quickly be destroyed in judgment.
translation:
  language: pt
  text: Ai daqueles que constroem suas casas por meio do pecado, pois elas serão arrancadas de todos os seus alicerces; [e eles cairão à espada][a]. E os que adquirem ouro e prata perecerão depressa no julgamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase “e eles cairão à espada” aparece entre colchetes na edição-fonte, indicando incerteza textual ou editorial.
    reason: Preservar de modo transparente o status editorial do trecho sem omiti-lo do texto principal.
lexical_decisions:
- source_word: በኃጢአት
  choice: por meio do pecado
  rationale: Expressa o valor instrumental do prefixo በ- e evita a possível impressão, em “com pecado”, de que o pecado seja apenas uma circunstância acompanhante.
- source_word: ይትነሠቱ
  choice: serão arrancadas
  rationale: Preserva a imagem forte de remoção desde os alicerces, em vez de reduzi-la simplesmente a “serão destruídas”.
- source_word: በሰይፍ፡ ይወድቁ
  choice: cairão à espada
  rationale: Formulação portuguesa natural e dignificada que mantém a imagem semítica de morrer pela espada.
- source_word: በጽነኔ
  choice: no julgamento
  rationale: Segue a leitura refletida na camada inglesa auditada e liga a expressão ao perecimento subsequente, sem acrescentar uma causa moral não explicitada no texto fornecido.
- source_word: ፍጡነ፡ ይትሐጐሉ
  choice: perecerão depressa
  rationale: Reproduz o advérbio de rapidez e o sentido de ruína ou perecimento do verbo, sem intensificação desnecessária.
theological_decisions:
- issue: Relação entre pecado e construção das casas
  choice: “por meio do pecado”
  alternative: “em pecado” ou “com pecado”
  rationale: Mantém a força instrumental ou causal provável da construção etíope, sem especificar um tipo particular de exploração ou injustiça.
- issue: Relação de “no julgamento” com a oração
  choice: A expressão modifica “perecerão”
  alternative: “os que adquirem ouro e prata no julgamento”
  rationale: A posição e o sentido favorecem associá-la ao perecimento, como faz a camada inglesa auditada; não se acrescenta identificação do agente ou da forma desse julgamento.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conserva o paralelismo de condenação, a imagem dos alicerces e a formulação aberta sobre o julgamento; o trecho editorialmente incerto permanece entre colchetes e recebe nota.
