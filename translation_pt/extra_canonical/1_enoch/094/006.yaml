base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/006.yaml
  text: Woe to those who build up unrighteousness and oppression[a], and who lay the foundation of deceit, for they will be swiftly overthrown[b], and they will have no peace.
translation:
  language: pt
  text: Ai dos que edificam a injustiça e a opressão e lançam o alicerce do engano[a], pois serão rapidamente derrubados e não terão paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A redação em ge''ez desta oração é um tanto incerta, mas parece dar continuidade à imagem de construção e associá-la ao engano ou à fraude. Outra tradução possível é: «estabelecem a fraude».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Ai
  rationale: Introduz uma denúncia profética de juízo; «Ai» é a fórmula natural e solene em português.
- source_word: የሐንጽዋ
  choice: edificam
  rationale: Preserva a metáfora arquitetônica e mantém um registro digno e compreensível.
- source_word: ለዓመፃ
  choice: a injustiça
  rationale: Expressa a ampla força moral e judicial do termo sem restringi-lo a uma única espécie de transgressão.
- source_word: ወለግፍዕ
  choice: e a opressão
  rationale: Comunica o mal coercivo e abusivo associado à injustiça.
- source_word: ወይሣርርዋ ለጕሕሉት
  choice: e lançam o fundamento do engano
  rationale: Mantém a imagem de construção e traduz ጕሕሉት como substantivo abstrato, «engano», em vez de convertê-lo em adjetivo.
- source_word: ፍጡነ
  choice: rapidamente
  rationale: Transmite de modo natural a ideia de rapidez ou iminência.
- source_word: ይትነሠቱ
  choice: serão derrubados
  rationale: No contexto arquitetônico, sugere o colapso daquilo que foi edificado, preservando também o sentido passivo de juízo.
- source_word: ወአልቦሙ ሰላመ
  choice: e não terão paz
  rationale: Reproduz diretamente a fórmula conclusiva de juízo.
theological_decisions:
- issue: Manter ou abstrair a metáfora de construção
  choice: Manter a sequência «edificam», «fundamento» e «derrubados»
  alternative: Traduzir de maneira abstrata como «praticam a injustiça e o engano»
  rationale: O texto etíope emprega linguagem arquitetônica recorrente, e a queda anunciada responde retoricamente à construção do mal.
- issue: Valor de ጕሕሉት na segunda oração
  choice: Traduzir como o substantivo «engano»
  alternative: Traduzir adjetivamente como «fundamentos enganosos»
  rationale: A forma é um substantivo abstrato, embora a sintaxe da expressão e a relação exata com a imagem de fundação apresentem alguma incerteza.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e compreensão internacional. A metáfora arquitetônica foi preservada sem acrescentar interpretação denominacional.
