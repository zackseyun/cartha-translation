base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/002.yaml
  text: And to wise men from a generation[a], the paths of violence and death will be revealed[b], and they will keep far from them and will not follow them.
translation:
  language: pt
  text: E a certos homens de uma geração[a] serão reveladas as veredas da violência e da morte; eles se manterão longe delas e não as seguirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a homens sábios de uma geração”. O termo ge''ez também foi entendido como “sábios”, mas pode funcionar idiomaticamente no sentido de “certos” ou “determinados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙራን
  choice: certos
  rationale: O particípio plural pode ter o sentido idiomático de “conhecidos/determinados”, isto é, “certos”. Essa leitura segue a análise lexical mais específica do testemunho ge'ez e evita identificar o termo sem necessidade com “sábios”.
- source_word: ለሰብእ
  choice: a ... homens
  rationale: A construção tem força dativa; em português, “a certos homens” expressa naturalmente os destinatários da revelação.
- source_word: እምትውልድ
  choice: de uma geração
  rationale: A expressão singular indica origem ou pertencimento a uma geração. Não se acrescenta o sentido iterativo “de geração em geração”, que não está explicitado na forma ge'ez.
- source_word: ይትከሠት
  choice: serão reveladas
  rationale: A forma indica manifestação ou desvelamento. “Serão reveladas” preserva o valor passivo e o registro apocalíptico sem explicar além do texto.
- source_word: ፍኖዋተ
  choice: as veredas
  rationale: O plural concreto designa caminhos ou sendas e funciona aqui como imagem moral. “Veredas” mantém a metáfora com dignidade literária e concorda naturalmente com os pronomes femininos subsequentes.
- source_word: ግፍዕ
  choice: violência
  rationale: O termo abrange violência, opressão e injustiça violenta. “Violência” conserva a força direta da imagem, sem estreitar o sentido a uma modalidade específica de opressão.
- source_word: ሞት
  choice: morte
  rationale: É o equivalente direto do substantivo ge'ez; o contexto não exige paráfrase como “destruição”.
- source_word: ይርኅቁ እምኔሆሙ
  choice: se manterão longe delas
  rationale: Expressa afastamento continuado e, no contexto das veredas, também sugere evitação moral sem torná-la explícita por paráfrase.
- source_word: ኢይትለውዎሙ
  choice: não as seguirão
  rationale: O verbo significa seguir ou ir atrás. O pronome retoma “veredas” e preserva coerentemente a metáfora do percurso moral.
theological_decisions:
- issue: Imagem concreta das veredas ou paráfrase ética abstrata
  choice: Conservar “as veredas da violência e da morte”
  alternative: condutas violentas que levam à morte
  rationale: O ge'ez emprega um substantivo concreto plural para caminhos. Manter essa imagem respeita o estilo sapiencial-apocalíptico e não introduz uma relação causal além do que o verso declara.
- issue: Identidade dos destinatários
  choice: “certos homens”
  alternative: “homens sábios”
  rationale: A leitura “certos” reflete a análise de እሙራን como particípio com função idiomática indefinida. Como a tradição de análise apresentada diverge, a alternativa é registrada em nota, sem transformar a ambiguidade lexical em afirmação teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o paralelismo e a imagem moral do original, com pontuação clara. “Veredas” oferece registro digno sem ser arcaísmo obscuro.
