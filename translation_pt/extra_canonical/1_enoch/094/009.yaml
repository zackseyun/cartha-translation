base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/009.yaml
  text: You have committed reproach and violence[a], and you have made yourselves ready for the day of the shedding of blood, and for the day of darkness[c][b], and for the day of the great judgment.
translation:
  language: pt
  text: Vocês cometeram ultraje[a] e violência[b] e ficaram prontos para o dia do derramamento de sangue, para o dia das trevas e para o dia do grande julgamento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “afronta”, “insulto” ou “desonra”.
    reason: lexical_alternative
  - marker: b
    text: Também pode significar “opressão” ou, de modo mais amplo, “injustiça”.
    reason: lexical_alternative
  - marker: c
    text: Ou “da grande condenação” ou “da grande sentença”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርክምዋ፡ ለጽርፈት፡ ወለዓመፃ
  choice: Vocês cometeram ultraje e violência
  rationale: O sufixo pronominal proléptico de ገበርክምዋ antecipa os objetos introduzidos por ለ; por isso, ለ não é entendido aqui como indicação de finalidade. O verbo ገበረ assume o sentido idiomático de praticar ou cometer. “Ultraje” conserva a ideia de afronta ou insulto, e “violência” mantém a força da acusação apocalíptica.
- source_word: ወድልዋነ፡ ኮንክሙ
  choice: e ficaram prontos
  rationale: A construção expressa que os destinatários se tornaram preparados ou aptos. “Ficaram prontos” é natural em português e evita definir além do texto se isso resultou de preparação deliberada ou de sua condição moral.
- source_word: ለዕለተ፡ ክዕወት፡ ደም
  choice: para o dia do derramamento de sangue
  rationale: A formulação explicita o sangue sendo vertido e preserva a solenidade e a imagem concreta da expressão etíope.
- source_word: ወለዕለተ፡ ጽልመት
  choice: para o dia das trevas
  rationale: Tradução direta da fórmula apocalíptica; “trevas” soa mais solene e idiomático neste contexto do que “escuridão”.
- source_word: ወለዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: para o dia do grande julgamento
  rationale: ኵነኔ pode denotar julgamento, sentença ou condenação. “Grande julgamento” preserva o evento judicial sem antecipar no próprio substantivo o resultado da sentença.
theological_decisions:
- issue: Se a sequência final descreve calamidades históricas gerais ou juízo escatológico
  choice: Preservar a tríplice fórmula dos dias, culminando no “grande julgamento”.
  alternative: Generalizar a passagem como referência a calamidade e punição históricas.
  rationale: A repetição de “dia”, junto com as trevas e o grande julgamento, caracteriza linguagem apocalíptica. A tradução mantém essa tensão e não reduz as imagens a punições genéricas.
- issue: Se ኵነኔ deve ser traduzido como julgamento ou condenação
  choice: julgamento
  alternative: condenação
  rationale: “Julgamento” conserva o aspecto judicial amplo e evita declarar antecipadamente a sentença, embora “condenação” seja lexicalmente possível.
translation_notes:
  register: Português moderno, solene e acessível, com tratamento por “vocês” adequado a um público amplo e com a repetição apocalíptica de “para o dia” preservada. A tradução segue prioritariamente a sintaxe do ge’ez e incorpora a revisão gramatical mais recente do objeto proléptico.
