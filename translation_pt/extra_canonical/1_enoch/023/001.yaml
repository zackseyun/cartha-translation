  text: E dali fui para outro lugar, em direção ao oeste, até os confins da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: dali
  rationale: Expressa de modo natural o ponto de partida em relação ao lugar anteriormente descrito.
- source_word: ሖርኩ
  choice: fui
  rationale: Preserva a forma simples e direta do relato de deslocamento visionário.
- source_word: ካልአ መካነ
  choice: outro lugar
  rationale: Indica um local diferente do cenário anterior, sem exigir o sentido ordinal mais específico de “segundo lugar”.
- source_word: መንገለ ዓረብ
  choice: em direção ao oeste
  rationale: መንገለ indica direção, e ዓረብ designa o oeste, associado ao pôr do sol. A escolha segue o texto ge'ez e corrige a alternativa anterior “leste”.
- source_word: እስከ አጽናፈ ምድር
  choice: até os confins da terra
  rationale: Mantém a imagem geográfica ampla e apocalíptica das extremidades do mundo em português bíblico atual e compreensível.
theological_decisions:
- issue: Geografia cósmica da viagem visionária
  choice: até os confins da terra
  alternative: até a fronteira distante da terra
  rationale: A formulação preserva a amplitude cósmica da visão e evita reduzir a cena a uma viagem por uma região meramente local.
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa simples. “Confins da terra” conserva o registro apocalíptico sem soar excessivamente arcaico.
