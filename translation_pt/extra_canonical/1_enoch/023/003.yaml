base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/003.yaml
  text: And I asked[a], saying[b], “What is this that has no rest?”
translation:
  language: pt
  text: 'E perguntei, dizendo: “O que é isto[a], que não tem descanso[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este” ou “esta coisa”; o demonstrativo ge'ez aponta para o fenômeno que Enoque acaba de ver.
    reason: lexical_alternative
  - marker: b
    text: “Não tem descanso” também pode ser traduzido como “não tem repouso” ou “está sem repouso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልኩ
  choice: perguntei
  rationale: Forma perfeita na primeira pessoa do singular do verbo “perguntar, indagar”. “Perguntei” é direto, natural e adequado ao relato visionário.
- source_word: እንዘ እብል
  choice: dizendo
  rationale: Construção quotativa que introduz o discurso direto. “Dizendo” conserva sua forma explícita sem tornar a frase obscura.
- source_word: ዝንቱ
  choice: isto
  rationale: Demonstrativo que aponta para o fenômeno que Enoque acaba de ver. “Isto” preserva a referência dêitica sem acrescentar um substantivo ausente do texto.
- source_word: ምንት ውእቱ
  choice: o que é
  rationale: Interrogativo seguido de cópula. A expressão portuguesa “o que é isto?” reproduz de modo claro e idiomático a pergunta.
- source_word: ዘአልቦ ዕረፍተ
  choice: que não tem descanso
  rationale: A construção relativa expressa ausência de descanso ou repouso. Esta tradução mantém a imagem de atividade incessante sem explicar indevidamente sua natureza.
theological_decisions:
- issue: Sentido de ዕረፍተ
  choice: descanso
  alternative: repouso; cessação
  rationale: “Descanso” preserva o sentido imediato e a tensão da imagem, sem introduzir ideias mais específicas, como paz, nem identificar o fenômeno além do que o versículo declara.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se “dizendo” para representar a construção quotativa do ge'ez, enquanto “isto” evita acrescentar ao demonstrativo um referente que o original não especifica.
