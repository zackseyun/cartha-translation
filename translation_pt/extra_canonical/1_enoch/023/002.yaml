review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a visão em primeira pessoa, o fogo que arde e se move, a ausência de descanso e a duração contínua. Contudo, «nem interromper seu curso» deixa sem sujeito expresso a segunda ação e soa como se o fogo fosse o agente que interromperia o próprio curso; a construção ge'ez afirma que ele não cessava de seu curso. A revisão torna essa relação mais direta sem reduzir a ambiguidade do termo para movimento/curso.
  naturalness: O texto é claro e de registro apropriado. «Não parava nem se desviava de seu curso» é mais natural e sintaticamente preciso em português do que «sem descansar nem interromper seu curso».
  terminology: «Fogo», «ardia», «corria», «curso» e «de dia ou de noite» são escolhas adequadas. «Corria» mantém a imagem incomum e o vínculo lexical com «curso». A nota a deve ser ajustada porque «Literalmente» é excessivamente categórico para uma expressão cujo valor pode abranger correr, avançar ou fluir.
  issues:
  - severity: medium
    issue: Construção verbal ambígua em «sem descansar nem interromper seu curso».
    rationale: O segundo infinitivo pode atribuir ao fogo a ação transitiva de interromper seu próprio curso. O original nega que o fogo cesse/pare em relação ao seu curso ou movimento. Uma formulação com «não parava» comunica isso com maior clareza.
  - severity: low
    issue: A nota a usa «Literalmente, “corria”».
    rationale: Embora «corria» seja uma boa opção principal, o verbo admite nuances de movimento e fluxo; a nota deve apresentar a escolha como tradução, não como única equivalência literal.
