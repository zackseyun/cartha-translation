base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/002.yaml
  text: And I saw a fire that burned and flowed[a], and it did not rest or cease from its course by day or by night[c][b], but continued in the same way.
translation:
  language: pt
  text: E vi um fogo que ardia e corria[a], e não descansava nem parava em seu curso[b], de dia ou de noite, mas continuava do mesmo modo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Corria» também pode sugerir que o fogo avançava ou fluía continuamente; o mesmo campo lexical reaparece em «curso».
    reason: lexical_alternative
  - marker: b
    text: «Seu curso» também pode ser entendido como «sua corrida», «seu caminho» ou «seu fluxo», enfatizando o movimento ininterrupto do fogo.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão final em ge’ez é difícil e também pode ser traduzida: «mas assim permanecia» ou «mas era assim».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: Preserva a fórmula visionária na primeira pessoa com linguagem portuguesa clara e corrente.
- source_word: እሳተ
  choice: um fogo
  rationale: Apresenta o fogo como novo objeto da visão, sem pressupor que já tenha sido identificado.
- source_word: ዘይነድድ
  choice: que ardia
  rationale: Mantém a força verbal da construção relativa e descreve a atividade contínua do fogo.
- source_word: ዘይረውፅ
  choice: e corria
  rationale: O verbo está ligado à ideia de correr ou mover-se rapidamente e forma uma conexão lexical com ሩፀት, empregado depois para o curso do fogo; evita a leitura menos precisa «flamejava».
- source_word: እንዘ ኢያዓርፍ
  choice: sem descansar
  rationale: Expressa a ação contínua e ininterrupta de maneira natural, preservando a imagem de que o fogo não repousava.
- source_word: ወኢይነትግ
  choice: nem interromper
  rationale: Em paralelo com «sem descansar» e seguido pela referência ao curso, indica que o fogo não suspendia seu movimento, sem especificar que se apagava.
- source_word: እምሩፀቱ
  choice: seu curso
  rationale: O substantivo pode indicar corrida, fluxo ou movimento contínuo; «curso» é natural em português e retém essa amplitude.
- source_word: መዐልተ ወሌሊተ
  choice: de dia ou de noite
  rationale: Comunica duração ininterrupta nos dois períodos e acompanha a polaridade negativa do contexto.
- source_word: አላ ከማሁሙ
  choice: mas continuava do mesmo modo
  rationale: Traduz a difícil expressão conclusiva como persistência no estado já descrito, sem impor uma análise excessivamente específica.
