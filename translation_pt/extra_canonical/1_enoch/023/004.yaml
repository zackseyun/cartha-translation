base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/004.yaml
  text: And at that time Raguel[a], one of the holy angels who was with me, answered me and said to me, “This course of fire which you saw toward the west[c][b], it is the fire that drives all the lights of heaven.”
translation:
  language: pt
  text: 'Naquele tempo, Raguel, um dos santos anjos que estava comigo, respondeu-me e disse: “Este trajeto de fogo que você viu em direção ao oeste[a] é o fogo que impele todas as luzes do céu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo caminho do fogo do oeste”. A expressão pode indicar tanto a direção ocidental quanto uma rota ou região de fogo no oeste da geografia da visão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: respondeu-me
  rationale: Preserva o sentido dialogal de responder, adequado à explicação dada pelo anjo.
- source_word: ቅዱሳን መላእክት
  choice: santos anjos
  rationale: Mantém a designação apocalíptica tradicional em português claro e digno.
- source_word: ዘርኢከ
  choice: que você viu
  rationale: A forma corresponde ao relativo seguido do verbo 'ver' na segunda pessoa masculina singular, não a 'espírito'.
- source_word: ሩጸተ
  choice: curso
  rationale: O substantivo deriva do campo semântico de correr e, neste contexto cósmico, descreve o percurso ou movimento do fogo.
- source_word: መንገለ ዐረብ
  choice: em direção ao oeste
  rationale: Expressa naturalmente a orientação ocidental da visão sem impor a leitura mais específica de uma rota pelo fogo ocidental.
- source_word: ይሰድድ
  choice: impulsiona
  rationale: Comunica movimento causado com força, evitando a possível conotação moderna de conduzir um veículo presente em 'dirige'.
- source_word: ብርሃናተ ሰማይ
  choice: todas as luzes do céu
  rationale: Tradução clara da expressão cósmica para os corpos luminosos celestes, preservando a imagem do texto.
theological_decisions:
- issue: Natureza do fenômeno cósmico descrito
  choice: curso de fogo
  alternative: espírito ou vento que desencaminha
  rationale: A leitura morfológica de ዘርኢከ como 'que você viu' e de ሩጸተ como 'curso' sustenta um fenômeno ígneo em movimento, sem introduzir uma entidade espiritual ou demonológica ausente dessas formas.
- issue: Relação do fogo com as luzes celestes
  choice: o fogo que impulsiona todas as luzes do céu
  alternative: o fogo que persegue ou dispersa todas as luzes do céu
  rationale: Mantém a agência cósmica do fogo e a força do verbo, sem determinar se o movimento das luzes é perseguição, dispersão ou simples propulsão.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação conserva o tom visionário e solene, mas evita arcaísmos. O pronome “você” torna explícita a segunda pessoa singular com naturalidade brasileira; a construção foi levemente enxugada, sem reproduzir de modo artificial a duplicação semítica de “respondeu-me e disse-me”.
