base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/012.yaml
  text: And thus a division has been made for the souls of those who make their complaint[d][c][b][a], who make known their destruction when they were slain in the days of the sinners.
translation:
  language: pt
  text: E assim foi feita uma separação para as almas dos que apresentam sua queixa[a] e dão a conhecer sua destruição[b], quando foram mortos nos dias dos pecadores.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos que clamam” ou “dos que apresentam acusação”. O verbo ge'ez pode indicar lamento, queixa ou protesto.
    reason: lexical_alternative
  - marker: b
    text: “Sua destruição” pode referir-se especificamente à maneira violenta como morreram, e não à destruição em sentido mais amplo.
    reason: lexical_alternative
  - marker: c
    text: O versículo continua a descrição dos lugares separados para os mortos no Sheol, onde os que foram mortos aguardam julgamento e vindicação.
    reason: cross_reference
lexical_decisions:
- source_word: ተፈልጠ
  choice: foi feita uma separação
  rationale: O passivo expressa separação ou divisão; no contexto dos compartimentos destinados aos mortos, esta formulação preserva tanto o aspecto espacial quanto o judicial sem especificá-lo em excesso.
- source_word: ለነፍሰ
  choice: para as almas
  rationale: A preposição tem valor dativo, indicando a quem se destina a separação; o plural é exigido pelas orações relativas seguintes.
- source_word: እለ ይስክዩ
  choice: dos que apresentam sua queixa
  rationale: O verbo pode indicar lamentação, clamor, queixa ou acusação. A expressão conserva simultaneamente a dor e o protesto de caráter forense.
- source_word: እለ ያርእዩ
  choice: dos que dão a conhecer
  rationale: O verbo significa mostrar, revelar ou tornar conhecido. Esta opção é natural em português e mantém a ideia de manifestação sem restringi-la a um testemunho formal.
- source_word: በእንተ ሕጉለት
  choice: sua destruição
  rationale: A expressão pode designar destruição, ruína ou fim violento. A tradução ampla preserva a ambiguidade do substantivo, enquanto a nota registra a nuance contextual.
- source_word: አመ ተቀትሉ
  choice: quando foram mortos
  rationale: A forma passiva refere-se claramente à morte causada por terceiros. 'Foram mortos' é dignificado, atual e não acrescenta uma qualificação jurídica como 'assassinados'.
- source_word: በመዋዕለ ኃጥኣን
  choice: nos dias dos pecadores
  rationale: A frase é temporal e caracteriza o período por seus pecadores, conservando o contraste moral próprio da linguagem apocalíptica.
theological_decisions:
- issue: Se as almas clamam em lamento geral ou apresentam uma acusação por sangue derramado injustamente
  choice: apresentam sua queixa
  alternative: clamam; apresentam acusação
  rationale: A formulação mantém juntas a lamentação e a dimensão forense, coerente com o contexto do sangue dos mortos que clama por justiça, sem decidir além do que permite o texto.
translation_notes:
  register: Português moderno, claro e dignificado, com leitura natural no Brasil e compreensão internacional. Mantiveram-se a estrutura repetitiva do ge'ez e a ambiguidade entre lamento e acusação; evitou-se o arcaísmo 'foram mortos à espada' ou 'foram imolados' por não estar lexicalmente exigido.
