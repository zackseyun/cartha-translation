base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/010.yaml
  text: And so it was made for sinners[a], when they die and are buried in the earth[c][b], and judgment has not come upon them during their lifetime.
translation:
  language: pt
  text: E assim foi feito para os pecadores[a], quando morrem e são sepultados na terra[c][b], e o juízo não veio sobre eles durante a vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão inicial, «E assim», provavelmente retoma a descrição anterior dos lugares separados para os mortos e indica que este caso corresponde àquela disposição.
    reason: cross_reference
  - marker: b
    text: «Foi feito» também pode ser traduzido como «foi designado» ou «foi criado»; o texto não repete expressamente o substantivo subentendido pelo contexto.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «foi feito para os pecadores: quando morrem e são sepultados na terra, e o juízo não veio sobre eles».'
    reason: previous_rendering
lexical_decisions:
- source_word: በከመ / ከማሁ
  choice: E assim
  rationale: Conserva tanto a ligação com o contexto anterior quanto a ideia de correspondência, sem tornar explícita uma relação que o ge'ez deixa implícita.
- source_word: ተፈጥረ
  choice: foi feito
  rationale: Reproduz o perfeito passivo de modo amplo, sem impor nem o sentido metafísico mais forte de «foi criado» nem o sentido mais interpretativo de «foi designado».
- source_word: ለኃጥኣን
  choice: para os pecadores
  rationale: Expressa diretamente a construção dativa e mantém o vocabulário judicial e moral do contexto.
- source_word: ሶበ፡ ይመውቱ፡ ወይትቀበሩ
  choice: quando morrem e são sepultados
  rationale: Mantém a oração temporal e a voz passiva do sepultamento em português natural.
- source_word: ውስተ፡ ምድር
  choice: na terra
  rationale: Preserva a imagem concreta e elementar da terra como lugar de sepultamento; «no chão» seria mais idiomático, porém menos solene.
- source_word: ወኵነኔ፡ ኢኮነ፡ በላዕሌሆሙ
  choice: e o juízo não veio sobre eles
  rationale: Conserva a imagem de um juízo que sobrevém a alguém e evita restringir ኵነኔ a «condenação».
- source_word: በሕይወቶሙ
  choice: durante a vida
  rationale: Marca claramente o contraste temporal entre a vida terrena e a condição após a morte, com formulação corrente em português.
theological_decisions:
- issue: Natureza da condição dos pecadores após a morte
  choice: O versículo descreve uma disposição destinada aos pecadores que não sofreram juízo em vida, sem definir aniquilação, absolvição final ou a natureza exata do lugar.
  alternative: Traduzir explicitamente «este lugar foi criado para os pecadores» ou entender a frase apenas como referência à morte e ao sepultamento.
  rationale: O sujeito de «foi feito» não é repetido no versículo e depende da descrição anterior dos lugares separados para os mortos. A tradução preserva essa dependência contextual e a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem dos marcadores [c][b] acompanha o texto de consulta fornecido; a pontuação mantém a ambiguidade sintática genuína, esclarecida pelas notas.
