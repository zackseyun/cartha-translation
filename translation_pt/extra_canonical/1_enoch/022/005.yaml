base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/005.yaml
  text: And I saw the spirits of the children of men who were dead[b][a], and their voice reached to heaven and cried out.
translation:
  language: pt
  text: E vi os espíritos dos filhos dos homens que estavam mortos, e a voz deles chegou até o céu e clamou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a voz deles chegou ao céu e apresentou uma queixa»; também pode ter o sentido de petição ou acusação. O verbo final é difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: vi
  rationale: Verbo visionário simples na primeira pessoa; «vi» mantém o estilo direto do relato.
- source_word: መናፍስተ
  choice: os espíritos
  rationale: Preserva o referente antropológico do texto apocalíptico sem o interpretar como «almas».
- source_word: ውሉደ ሰብእ
  choice: dos filhos dos homens
  rationale: Conserva a expressão semítica coletiva e o registro elevado, sem transformá-la em título.
- source_word: እንዘ ሙታን ውእቶሙ
  choice: que estavam mortos
  rationale: Português natural que mantém a condição de morte atribuída aos seres humanos cujos espíritos são vistos.
- source_word: ቃሎሙ
  choice: a voz deles
  rationale: Mantém o sentido básico de «voz», deixando a nota registrar a possível nuance de clamor ou queixa.
- source_word: ይበጽሕ እስከ ሰማይ
  choice: chegou até o céu
  rationale: Preserva a imagem vertical da voz que alcança o céu.
- source_word: ወይስኪ
  choice: clamou
  rationale: Solução direta e relativamente neutra, adequada ao contexto de apelo por justiça; a possível força de queixa, petição ou acusação é preservada em nota.
theological_decisions:
- issue: Natureza da fala dos mortos dirigida ao céu
  choice: A voz dos espíritos chega ao céu e clama, sugerindo um apelo sem definir precisamente sua categoria.
  alternative: Traduzir explicitamente como «apresentou uma petição», «queixou-se» ou «fez uma acusação».
  rationale: O contexto é compatível com pedido de reparação ou acusação, mas o texto não deve ser usado para resolver questões doutrinárias mais amplas sobre o estado intermediário; «clamou» conserva a tensão e a nota explicita a dificuldade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção «filhos dos homens» preserva deliberadamente o sabor semítico do original.
