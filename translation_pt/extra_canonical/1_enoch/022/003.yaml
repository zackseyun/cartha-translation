base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/003.yaml
  text: 'And at that time Raphael[a], one of the holy angels who was with me, answered and said to me, “These hollow places were made so that the spirits, the souls of the dead, might be gathered into them[c][b]. For this purpose they were created here: that they might gather all the souls of the children of men.”'
translation:
  language: pt
  text: 'Naquele tempo, Rafael, um dos santos anjos que estava comigo, respondeu e me disse: “Estes belos lugares[a] foram feitos para que neles se reunissem os espíritos, isto é, as almas dos mortos[b]. Para esse fim foram criados aqui: para que reunissem todas as almas dos filhos dos homens.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O geês preservado pode significar “belos lugares” ou “bons lugares”. Uma leitura grega frequentemente proposta traz “lugares ocos”, em harmonia com as cavidades descritas no contexto.
    reason: textual_variant
  - marker: b
    text: O verso emprega tanto “espíritos” quanto “almas”; provavelmente são expressões em aposição, e não duas categorias nitidamente distintas.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: respondeu
  rationale: O verbo introduz uma resposta em contexto narrativo; preserva a sequência semítica “respondeu e disse”, vertida naturalmente como “respondeu e me disse”.
- source_word: ቅዱሳን መላእክት
  choice: santos anjos
  rationale: Mantém a designação apocalíptica tradicional e seu peso religioso.
- source_word: ዝመካናት ሰናያት
  choice: estes lugares ocos
  rationale: O geês transmitido traz um adjetivo que pode significar “belos”, “bons” ou “agradáveis”, mas “ocos” reflete a provável leitura grega subjacente κοῖλοι e concorda com as cavidades descritas no contexto. A variante etíope é registrada em nota.
- source_word: ይትጋብኡ ዲቤሆን
  choice: para que neles se reunissem
  rationale: Expressa de modo natural o movimento ou recolhimento dos espíritos nesses lugares, sem definir com excessiva precisão a força da preposição.
- source_word: መናፍስት ለነፍሶሙ ለምዉታን
  choice: os espíritos, isto é, as almas dos mortos
  rationale: Conserva os dois termos antropológicos e representa a provável relação apositiva entre eles.
- source_word: ሎቱ ዝንቱ
  choice: Para esse fim
  rationale: Traduz o valor final ou explicativo da expressão de maneira idiomática.
- source_word: ተፈጥሩ
  choice: foram criados
  rationale: Preserva a linguagem explícita de criação ou formação intencional.
- source_word: ያስተጋብኡ
  choice: para reunir
  rationale: Comunica a nuance causativa de ajuntar ou trazer conjuntamente, evitando uma construção portuguesa pouco natural na qual os lugares agiriam literalmente.
- source_word: ኵሎ ነፍሰ ውሉደ ሰብእ
  choice: todas as almas dos filhos dos homens
  rationale: Mantém tanto a abrangência coletiva quanto a fórmula antropológica antiga, sem reduzi-la simplesmente a “almas humanas”.
theological_decisions:
- issue: Relação entre “espíritos” e “almas dos mortos”
  choice: 'Manter ambos em aposição explicativa: “os espíritos, isto é, as almas dos mortos”.'
  alternative: Reduzir a expressão a “os espíritos dos mortos” ou tratar espíritos e almas como categorias distintas.
  rationale: O geês emprega ambos os vocábulos. A aposição preserva a dupla terminologia sem impor uma distinção antropológica que o verso não exige.
- issue: Âmbito de “filhos dos homens”
  choice: Conservar a expressão “filhos dos homens”.
  alternative: Verter como “seres humanos” ou “humanidade”.
  rationale: A formulação é própria do registro apocalíptico antigo e continua compreensível em português, sem definir além do texto possíveis questões de gênero ou extensão.
- issue: Leitura “ocos” em contraste com o geês “belos/bons”
  choice: Adotar “ocos” no texto e documentar a leitura etíope em nota.
  alternative: Traduzir estritamente o manuscrito geês como “belos lugares” ou “bons lugares”.
  rationale: A leitura “ocos” corresponde à provável Vorlage grega e ao cenário imediato de cavidades destinadas aos mortos; a nota mantém visível a evidência divergente da fonte etíope.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a solenidade narrativa e a fórmula antiga “filhos dos homens”, enquanto a sintaxe foi ajustada para soar natural. Todos os marcadores de nota aparecem no texto.
