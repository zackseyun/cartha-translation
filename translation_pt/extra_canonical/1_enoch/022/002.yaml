base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/002.yaml
  text: And there were four hollow places in it[a], deep and wide and very smooth; three of them were dark, and one was bright, and water was springing up in its midst. And I said, “How smooth these hollow places are[c][b], and deep and dark to look at.”
translation:
  language: pt
  text: 'Havia nela quatro cavidades, profundas, largas e muito lisas[a]. Três delas eram escuras, e uma era luminosa; no meio brotava água[b]. Então eu disse: “Como são lisas estas cavidades[c], e profundas e escuras ao olhar!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope deste versículo é difícil em vários pontos, sobretudo na descrição das cavidades como “lisas”. O sentido provável é que tinham aparência polida ou paredes muito regulares e íngremes.
    reason: lexical_alternative
  - marker: b
    text: Alguns intérpretes entendem que a água brotava no meio da cavidade luminosa, como uma fonte ou corrente.
    reason: alternative_reading
  - marker: c
    text: 'Outra tradução possível: “Como são profundas e muito lisas estas cavidades”.'
    reason: previous_rendering
lexical_decisions:
- source_word: አርባዕቱ፡ መካናት
  choice: quatro cavidades
  rationale: No contexto do interior da formação vista por Enoque, “cavidades” comunica recessos ou espaços ocos melhor que o genérico “lugares”.
- source_word: ዕሙቀ፡ ወርኂበ፡ ወልሙጸ፡ ጥቀ
  choice: profundas, largas e muito lisas
  rationale: Mantém os três descritores físicos distintos do texto etíope — profundidade, largura e lisura — bem como a intensificação de “lisas”.
- source_word: ጸልማት / ብርህት
  choice: escuras / luminosa
  rationale: Reproduz o contraste visual direto entre as três cavidades sem luz e a única caracterizada por claridade.
- source_word: ነቅዐ፡ ማይ
  choice: brotava água
  rationale: Expressa água que surge ou irrompe, em vez de água meramente parada.
- source_word: በማእከላ
  choice: no meio
  rationale: A formulação concisa preserva alguma abertura quanto ao referente espacial, esclarecida em nota sem ser resolvida à força no texto.
- source_word: ለነጽሮ
  choice: ao olhar
  rationale: Forma portuguesa natural que conserva o caráter visual da descrição.
theological_decisions:
- issue: Fórmula de reação do vidente após a descrição
  choice: Então eu disse
  alternative: Então eu vi; ou uma exclamação sem fórmula de fala
  rationale: Conserva a resposta em primeira pessoa e a estrutura retórica do relato visionário transmitido, sem reduzir a frase a mera descrição.
translation_notes:
  register: Português atual, digno e de leitura ampla, com vocabulário concreto próprio de uma visão apocalíptica. A coordenação dos adjetivos conserva o ritmo cumulativo do ge’ez; “no meio” evita especificar além do que a construção permite com segurança.
