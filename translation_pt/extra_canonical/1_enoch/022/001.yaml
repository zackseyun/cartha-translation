base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/001.yaml
  text: And from there I went to another place[a], and he showed me in the west a great and high mountain[b], and a hard rock.
translation:
  language: pt
  text: E dali fui para outro lugar, e ele me mostrou, no oeste, uma montanha grande e alta[a] e uma rocha dura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão conserva duas qualidades distintas: a montanha é grande e também alta.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “rocha sólida” ou “rocha firme”.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: dali
  rationale: Marca a passagem espacial desde o cenário visionário anterior; “dali” é natural e conciso em português.
- source_word: ሖርኩ
  choice: fui
  rationale: Reproduz diretamente o verbo de movimento na primeira pessoa, sem acrescentar a ideia de uma viagem prolongada.
- source_word: ካልአ መካነ
  choice: para outro lugar
  rationale: Indica um local diferente do cenário anterior e mantém a expressão idiomática em português.
- source_word: አርአየኒ
  choice: ele me mostrou
  rationale: Preserva a fórmula de visão guiada e o sujeito masculino implícito, sem identificar o guia além do que o texto diz.
- source_word: በምዕራብ
  choice: no oeste
  rationale: Mantém o sentido locativo e a geografia visionária de modo conciso.
- source_word: ደብረ ዐቢየ ወነዋኅ
  choice: uma montanha grande e alta
  rationale: Conserva separadamente as qualidades de grandeza e altura expressas no ge'ez.
- source_word: ኵኵሐ ጽኑዐ
  choice: uma rocha dura
  rationale: Expressa a força e solidez física da rocha, preservando a imagem austera da paisagem.
theological_decisions:
- issue: Se o sujeito que guia Enoque deve ser explicitamente identificado como um anjo
  choice: Manter “ele me mostrou”, sem especificar “o anjo”.
  alternative: “o anjo me mostrou” ou “meu guia me mostrou”
  rationale: O verbo em ge'ez traz apenas um sujeito masculino de terceira pessoa. Embora o contexto possa sugerir um guia angelical, este versículo não o nomeia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação simples preserva o ritmo direto do relato visionário.
