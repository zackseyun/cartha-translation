base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/013.yaml
  text: And thus it has been made for the souls of the people who are not righteous[a], but sinners, who are complete in transgression, and they will be with the lawless like them[d][c][b]. But as for their souls...
translation:
  language: pt
  text: E assim foi destinado[a] às almas dos seres humanos[c] que não são justos, mas pecadores, consumados na transgressão; eles estarão com os ímpios e serão como eles[b]. Quanto, porém, às almas deles[d]...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo etíope também pode ser traduzido por «foi feito», «foi preparado» ou «foi estabelecido». Neste contexto de lugares reservados aos mortos, «foi destinado» expressa melhor sua função.
    reason: lexical_alternative
  - marker: b
    text: A cláusula é difícil e condensada. Pode significar «estarão com os ímpios», «serão como eles» ou reunir as duas ideias.
    reason: alternative_reading
  - marker: c
    text: Literalmente, também se pode traduzir por «os filhos dos homens» ou simplesmente «as pessoas».
    reason: lexical_alternative
  - marker: d
    text: A expressão inicia um novo tópico, cuja continuação vem depois; por isso, a frase permanece inacabada aqui. Não significa «e também as almas deles».
    reason: grammar
lexical_decisions:
- source_word: ተፈጥረ
  choice: foi destinado
  rationale: Embora o verbo possa significar «foi feito» ou «foi criado», o contexto dos lugares reservados aos mortos favorece o sentido funcional de algo estabelecido ou destinado.
- source_word: ለነፍሶሙ
  choice: às almas
  rationale: A construção com ለ indica o destinatário daquilo que foi destinado; a formulação portuguesa evita a repetição pouco natural de «deles».
- source_word: ለሰብእ
  choice: dos seres humanos
  rationale: Exprime o referente humano genérico de modo natural e inclusivo, sem restringi-lo a pessoas do sexo masculino.
- source_word: ኢኮኑ ጻድቃነ አላ ኃጥኣነ
  choice: que não são justos, mas pecadores
  rationale: Mantém diretamente o contraste moral característico entre justos e pecadores.
- source_word: ፍጹማነ እበሳ
  choice: consumados na transgressão
  rationale: Preserva a força intensificadora de ፍጹም e o tom judicial do termo para transgressão, sem recorrer à expressão portuguesa ambígua «perfeitos no pecado».
- source_word: አባሲያን
  choice: os ímpios
  rationale: O termo designa pessoas marcadas por impiedade ou desobediência; «ímpios» conserva o tom moral e apocalíptico e distingue o grupo do termo anterior «pecadores».
- source_word: ይከውኑ ከማሆሙ
  choice: estarão com os ímpios e serão como eles
  rationale: A formulação conserva os dois elementos sugeridos pela expressão comprimida — associação e semelhança — sem especificar uma forma de castigo não declarada pelo texto.
- source_word: ወነፍሶሙሰ
  choice: Quanto, porém, às almas deles...
  rationale: O enclítico -ሰ tem força topicalizadora ou adversativa. A frase introduz um novo tópico cuja continuação ocorre adiante, em vez de acrescentar «também as almas deles» à oração anterior.
theological_decisions:
- issue: Se o verbo descreve a criação das almas ou a destinação de um lugar ou sorte para elas
  choice: destinação de algo às almas dos pecadores
  alternative: criação ou feitura das próprias almas
  rationale: O contexto imediato trata de compartimentos reservados aos mortos. «Foi destinado» comunica essa função contextual sem afirmar que o texto ensina a criação ontológica dessas almas neste ponto.
- issue: Sentido preciso da cláusula final sobre os ímpios
  choice: preservar tanto a ideia de associação quanto a de semelhança
  alternative: entender apenas «estarão com os ímpios» ou apenas «serão como eles»
  rationale: A construção etíope é condensada e incerta; não se deve importar uma doutrina mais específica de punição, destruição ou transformação.
- issue: Função de -ሰ em ወነፍሶሙሰ
  choice: partícula topicalizadora/adversativa que inicia uma oração ainda incompleta
  alternative: 'partícula aditiva: «e também as almas deles»'
  rationale: A análise gramatical favorece «quanto, porém, às almas deles», mantendo a transição e a interrupção sintática do testemunho.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação esclarece a sequência sem apagar a construção interrompida no fim do versículo; as reticências preservam sua continuidade para o versículo seguinte.
