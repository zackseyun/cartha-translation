base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/011.yaml
  text: Here their souls are set apart in this great affliction until the great day of judgment and punishment and affliction for those who curse forever; and vengeance on their souls. There he will bind them forever.
translation:
  language: pt
  text: Aqui as almas deles são separadas neste grande sofrimento até o grande dia de juízo, castigo e sofrimento para os que são amaldiçoados para sempre[a], e de vingança contra as almas deles. Ali ele os atará para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os que amaldiçoam para sempre». A forma também pode ser entendida em sentido ativo, embora o sentido passivo se ajuste melhor ao contexto de juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'Uma oração entre colchetes no testemunho acrescenta: «e isto [era] desde antes do mundo». O texto é incerto e, por isso, não foi incluído na tradução principal.'
    reason: textual_variant
lexical_decisions:
- source_word: ይትፈለጠ
  choice: são separadas
  rationale: Expressa diretamente o sentido passivo/reflexivo de separar ou reservar para um lugar ou estado distinto, sem definir além do texto o mecanismo dessa separação.
- source_word: ነፍሳቲሆሙ
  choice: as almas deles
  rationale: No contexto dos mortos que aguardam o juízo, «almas» comunica com clareza as pessoas desencarnadas em vista.
- source_word: ዐቢይ ጻዕር
  choice: grande sofrimento
  rationale: O termo abrange dor, aflição e tormento; «sofrimento» é natural em português e mantém tanto a realidade da dor quanto a amplitude semântica.
- source_word: ኵነኔ
  choice: juízo
  rationale: Preserva o sentido judicial amplo do termo, que aparece em sequência com o castigo.
- source_word: መቅሠፍት
  choice: castigo
  rationale: Embora possa designar golpe ou flagelo, neste encadeamento apocalíptico-jurídico comunica melhor a consequência penal.
- source_word: ይረግሙ
  choice: são amaldiçoados
  rationale: A leitura passiva se ajusta melhor ao contexto de juízo, mas a possibilidade ativa é preservada em nota.
- source_word: በቀል
  choice: vingança
  rationale: Mantém a forma nominal do ge'ez e sua força retributiva, sem convertê-la indevidamente em uma oração verbal independente.
- source_word: ይእስሮሙ
  choice: ele os prenderá
  rationale: Conserva o agente singular não identificado e a imagem concreta de sujeição; «prender» soa mais natural em português atual do que «atar» neste contexto.
- source_word: እስከ ለዓለም
  choice: para sempre
  rationale: É a formulação portuguesa corrente para duração contínua e preserva a solenidade e a finalidade da expressão.
theological_decisions:
- issue: Se as almas apenas ficam separadas ou já sofrem antes do juízo final
  choice: «são separadas neste grande sofrimento [...] até o grande dia de juízo»
  alternative: «são separadas para este grande juízo», o que reduziria a ideia de sofrimento presente; ou «são separadas neste grande tormento», o que a intensificaria
  rationale: O ge'ez reúne linguagem de separação e de sofrimento. A tradução mantém essa tensão sem transformar o estado em mera custódia neutra nem definir plenamente a natureza da pena anterior ao grande dia.
- issue: Voz do verbo relativo aos amaldiçoados
  choice: 'leitura passiva: «os que são amaldiçoados para sempre»'
  alternative: 'leitura ativa: «os que amaldiçoam para sempre»'
  rationale: A leitura passiva harmoniza-se melhor com o contexto judicial, mas a forma admite discussão; por isso a alternativa é registrada em nota.
- issue: Identidade do sujeito de «ele os prenderá»
  choice: 'manter o pronome singular não identificado: «ele»'
  alternative: explicitar «Deus» ou empregar a passiva «eles serão presos»
  rationale: A forma verbal aponta para um agente singular, mas o versículo não o nomeia. A tradução não acrescenta uma identificação teológica ausente do texto.
- issue: Relação sintática de «vingança contra as almas deles»
  choice: manter como elemento nominal coordenado ao conteúdo do grande dia
  alternative: «ali ele se vingará das almas deles»
  rationale: A construção ge'ez é nominal e integra a série de juízo, castigo, sofrimento e vingança; verbalizá-la introduziria um verbo e possivelmente um advérbio inexistentes nessa oração.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções transparentes. «Sofrimento» evita o tom excessivamente técnico de «aflição» e a intensificação interpretativa de «tormento». A repetição de «sofrimento» acompanha a repetição lexical da fonte. Os marcadores [a] e [b] aparecem no texto principal.
