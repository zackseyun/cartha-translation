  source_fidelity: A tradução preserva adequadamente a fórmula introdutória duplicada, incluindo o destinatário de primeira pessoa, e representa de forma fiel o particípio introdutório por meio dos dois-pontos. “Espírito”, “saiu de Abel”, a identificação de Qayin como irmão e o caráter continuativo da acusação correspondem ao ge'ez e ao histórico de decisões em inglês. A explicitação de Qayin em vez do pronome em “apresenta acusação contra Qayin” é segura e evita ambiguidade. O paralelismo da eliminação da linhagem é mantido.
  naturalness: O português é moderno, claro e de registro apropriado. “Da face da terra” é uma equivalência idiomática e solene para a fórmula semítica, e “descendência” mantém a repetição e o sentido genealógico sem o artificialismo de “semente” neste contexto.
  terminology: “Espírito”, “apresenta acusação”, “descendência”, “destruída” e “apagada” são escolhas consistentes, transparentes e não impõem interpretação doutrinária. A transliteração “Qayin” está coerente com a tradição-fonte e com o rastro de auditoria inglês.
