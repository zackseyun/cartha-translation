base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/007.yaml
  text: And he answered me and said to me[a], “This is the spirit that came out from Abel, whom Qayin his brother killed; and it makes accusation against him until his seed is destroyed from before the face of the earth[d][c][b], and his seed is blotted out from among the seed of men.”
translation:
  language: pt
  text: 'E ele me respondeu e me disse[a]: “Este é o espírito que saiu de Abel, a quem seu irmão Qayin matou. Ele apresenta acusação contra Qayin[b] até que a descendência dele seja destruída da face da terra e seja apagada dentre a descendência dos seres humanos[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A fórmula recebida traz “respondeu-me” e também, entre colchetes no testemunho utilizado, “disse-me”. A tradução conserva os dois verbos; a expressão seguinte, literalmente “dizendo”, é representada pelos dois-pontos.
    reason: textual_variant
  - marker: b
    text: '“Apresenta acusação” expressa o sentido judicial: o espírito de Abel atua como acusador que clama por julgamento, e não apenas como alguém que relata uma queixa.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “semente” nas duas ocorrências. “Descendência” foi usada para comunicar em português atual a referência à linhagem, preservando a repetição do termo.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ / ወይቤለኒ / እንዘ ይብል
  choice: ele me respondeu e me disse
  rationale: Conserva os dois verbos da fórmula de introdução da fala e o objeto de primeira pessoa. O particípio idiomático final é absorvido pela pontuação, evitando o redundante “disse-me, dizendo” sem perder sua função introdutória.
- source_word: መንፈስ
  choice: espírito
  rationale: No contexto visionário dos mortos, designa a presença pessoal incorpórea de Abel, não vento ou simples respiração.
- source_word: ዘወጽአ እምአቤል
  choice: que saiu de Abel
  rationale: Mantém de modo claro a imagem concreta do espírito que procede de Abel.
- source_word: ዘቀተሎ ቃየን እኁሁ
  choice: a quem seu irmão Qayin matou
  rationale: Reproduz a relação sintática e identifica o assassino como irmão de Abel. “Qayin” translitera de perto a forma do nome presente na tradição-fonte.
- source_word: ይሰኪ ኪያሁ
  choice: apresenta acusação contra Qayin
  rationale: Preserva o valor judicial e contínuo da ação. A repetição do nome esclarece em português que a acusação é dirigida contra Qayin, evitando a ambiguidade de dois pronomes masculinos consecutivos.
- source_word: ዘርኡ / ዘርአ ሰብእ
  choice: a descendência dele / a descendência dos seres humanos
  rationale: “Descendência” comunica naturalmente em português o sentido genealógico de “semente” e mantém a repetição lexical central ao juízo sobre a linhagem.
- source_word: ይትኀጐል / ይማስን
  choice: seja destruída / seja apagada
  rationale: Mantém o paralelismo progressivo das duas expressões de eliminação sem reduzi-las a uma única formulação.
- source_word: እምቅድመ ገጸ ለምድር
  choice: da face da terra
  rationale: Equivalente português consagrado e digno para a expressão semítica, sem a construção pouco natural “de diante da face”.
theological_decisions:
- issue: Natureza da presença póstuma de Abel
  choice: espírito
  alternative: alma; voz; sombra
  rationale: O substantivo ge'ez é explícito, e “espírito” conserva a antropologia e o realismo apocalíptico do texto sem os reinterpretar.
- issue: Função do espírito de Abel
  choice: apresenta acusação contra Qayin
  alternative: acusa Qayin; queixa-se dele; clama contra ele
  rationale: A formulação conserva a dimensão forense da denúncia contínua por justiça, sem definir além do texto o mecanismo ou o tribunal dessa acusação.
- issue: Alcance do juízo sobre a linhagem de Qayin
  choice: a descendência dele seja destruída ... e seja apagada
  alternative: seus descendentes pereçam; sua posteridade seja eliminada
  rationale: A repetição preserva a dimensão corporativa e genealógica do juízo, sem transformá-la numa afirmação doutrinária mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência apocalíptica moderada. Evitaram-se tanto o literalismo pouco natural (“semente dos homens”, “de diante da face da terra”) quanto a suavização do vocabulário judicial e da eliminação da linhagem.
