base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/006.yaml
  text: At that time I asked Raphael[a], the angel who was with me, and I said to him[c][b], “This spirit whose voice reaches thus and accuses—to whom does it belong?”
translation:
  language: pt
  text: 'Naquele tempo, perguntei a Rafael, o anjo que estava comigo, e lhe disse: “Este espírito, cuja voz chega assim e acusa[a] — a quem pertence?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apresenta uma queixa”. O verbo tem sentido forense, embora também possa envolver um apelo ou uma súplica urgente.
    reason: lexical_alternative
  - marker: b
    text: A pergunta busca identificar o espírito cujo clamor é ouvido; o versículo seguinte o identifica como o espírito de Abel.
    reason: cross_reference
lexical_decisions:
- source_word: ውእቱ ጊዜ
  choice: Naquele tempo
  rationale: Fórmula narrativa temporal que preserva o tom elevado sem soar arcaica.
- source_word: ተስእልክዎ
  choice: perguntei
  rationale: Expressa de modo direto e natural o ato de Enoque dirigir uma pergunta ao anjo intérprete.
- source_word: ለሩፋኤል መልአክ
  choice: a Rafael, o anjo
  rationale: Mantém o nome próprio transliterado e a construção apositiva do ge'ez.
- source_word: እንዘ ሀሎ ምስሌየ
  choice: que estava comigo
  rationale: Identifica Rafael como o guia presente de Enoque em português idiomático.
- source_word: ዝመንፈስ
  choice: Este espírito
  rationale: ‘Espírito’ corresponde naturalmente a መንፈስ e preserva a linguagem antropológica da visão sem impor uma definição posterior mais específica.
- source_word: ዘመኑ
  choice: a quem pertence
  rationale: Torna natural em português a pergunta genitiva acerca da identidade do espírito.
- source_word: ዘከመዝ ቃሉ ይበጽሕ
  choice: cuja voz chega assim
  rationale: ‘Voz’ corresponde ao clamor audível no contexto, e ‘chega’ conserva a ideia de alcançar ou vir até o ouvinte.
- source_word: ወይሰኪ
  choice: e acusa
  rationale: Preserva o sentido forense de apresentar queixa ou acusação e a ligação contextual com o clamor de Abel contra Caim.
theological_decisions:
- issue: Se መንፈስ deve ser traduzido como ‘espírito’ ou ‘alma’ na cena do mundo dos mortos
  choice: espírito
  alternative: alma
  rationale: ‘Espírito’ é a correspondência lexical mais direta e evita impor ao texto uma precisão antropológica posterior.
- issue: Como representar o verbo final que caracteriza o clamor do espírito
  choice: acusa
  alternative: apresenta uma queixa; suplica
  rationale: O contexto de Abel clamando contra Caim favorece o sentido forense, embora a nota preserve a possibilidade de que a ação inclua apelo ou súplica urgente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da pergunta foi mantida próxima ao ge'ez, mas com pontuação natural em português; a ambiguidade lexical do verbo final é registrada em nota.
