base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/009.yaml
  text: And he answered me and said to me[a], “These three have been made so that the spirits of the dead might be separated. And thus a division has been made for the spirits of the righteous, where there is a spring of water[e][d][c][b], with light above it.”
translation:
  language: pt
  text: 'E ele me respondeu e me disse: “Estas três foram feitas para que os espíritos dos mortos fossem separados. E assim foram separados os espíritos dos justos[a], onde há uma nascente de água[b], com luz sobre ela[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, a construção ge'ez diz algo como “assim foi separado para os espíritos dos justos”. A tradução torna explícito em português o grupo implicado pelo passivo e preserva a repetição da raiz usada em “fossem separados”.
    reason: alternative_reading
  - marker: b
    text: Ou “uma fonte de água”.
    reason: lexical_alternative
  - marker: c
    text: A frase ge'ez é concisa, literalmente algo como “sobre ela, luz”; a luz pode estar sobre a nascente ou, de modo mais amplo, sobre o lugar destinado aos justos.
    reason: alternative_reading
lexical_decisions:
- source_word: ፫ትገብሩ
  choice: Estas três foram feitas
  rationale: Preserva o numeral e o sentido passivo de fazer, sem inserir no texto um substantivo como “divisões”, que é fornecido pelo contexto, mas não está expresso nesta forma.
- source_word: ይትፈለጠ / ተፈልጠ
  choice: fossem separados / foi separado
  rationale: Mantém a repetição verbal deliberada da mesma raiz ge'ez, ainda que a segunda construção permaneça incomum e ambígua em português.
- source_word: መንፈሶሙ ለምዉታን
  choice: os espíritos dos mortos
  rationale: “Espíritos” representa diretamente o termo ge'ez e conserva a linguagem antropológica da visão.
- source_word: ጻድቃን
  choice: os justos
  rationale: Equivalente corrente e digno para o grupo moralmente reto neste cenário de juízo.
- source_word: ነቅዐ ማይ
  choice: uma nascente de água
  rationale: Expressa concretamente uma fonte natural de água e soa natural em português contemporâneo.
- source_word: በላዕሌሁ ብርሃን
  choice: com luz sobre ela
  rationale: Conserva a imagem concisa de luz acima da nascente, sem explicar além do que a sintaxe permite.
theological_decisions:
- issue: Termo antropológico aplicado aos mortos
  choice: espíritos dos mortos
  alternative: almas dos mortos
  rationale: A escolha preserva o vocabulário próprio do texto visionário sem substituí-lo por uma formulação teológica posterior mais familiar.
- issue: Identidade do referente separado para os justos
  choice: foi separado para os espíritos dos justos
  alternative: uma divisão foi feita para os espíritos dos justos
  rationale: A formulação conserva o verbo passivo repetido e a ambiguidade do sujeito implícito, em vez de introduzir explicitamente “divisão” no corpo do texto.
- issue: Âmbito da luz
  choice: luz sobre a nascente
  alternative: luz sobre toda a divisão dos justos
  rationale: O pronome é ligado ao referente feminino mais próximo em português, mas a nota registra que o ge'ez pode permitir um alcance espacial mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “respondeu e me disse” e de “separados/foi separado” foi mantida por corresponder à estrutura enfática do ge'ez; a relativa estranheza da segunda construção preserva uma ambiguidade real do texto.
