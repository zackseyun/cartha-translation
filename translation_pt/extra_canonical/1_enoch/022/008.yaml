base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/008.yaml
  text: 'And at that time I asked concerning him and concerning the judgment of all: for what reason were they separated[c][b][a], one from another?'
translation:
  language: pt
  text: 'Naquele tempo, perguntei a respeito dele e do julgamento de todos: por que razão foram separados uns dos outros?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: Naquele tempo
  rationale: Preserva a fórmula temporal narrativa e o tom elevado do relato visionário, em português natural.
- source_word: ተስእልኩ
  choice: perguntei
  rationale: Expressa diretamente o verbo na primeira pessoa, deixando que as locuções seguintes indiquem o assunto da pergunta.
- source_word: በእንቲአሁ
  choice: a respeito dele
  rationale: O sufixo é masculino singular e remete ao referente masculino do contexto anterior, provavelmente o espírito de Abel; evita-se a leitura plural transmitida em uma nota inglesa anterior.
- source_word: በእንተ
  choice: do
  rationale: Na construção portuguesa «perguntei a respeito dele e do julgamento», a contração transmite com naturalidade a relação temática indicada pela preposição ge'ez repetida.
- source_word: ኵነኔ
  choice: julgamento
  rationale: Mantém o sentido judicial amplo sem restringi-lo indevidamente a punição ou condenação.
- source_word: ኵሉ
  choice: de todos
  rationale: Conserva o alcance abrangente da expressão ligada a «julgamento».
- source_word: በእንተ፡ ምንት
  choice: por que razão
  rationale: Comunica a pergunta pela causa da separação, com registro claro e dignificado.
- source_word: ተፈልጡ
  choice: foram separados
  rationale: Preserva a voz passiva e permite tanto a dimensão espacial quanto a judicial da distinção.
- source_word: ፩እምነ፡ ፩
  choice: uns dos outros
  rationale: É a formulação recíproca idiomática em português e expressa claramente a separação mútua.
theological_decisions:
- issue: Alcance de «julgamento de todos»
  choice: julgamento de todos
  alternative: punição de todos / sentença de todos
  rationale: O substantivo ge'ez comporta um sentido judicial mais amplo que não se limita à condenação; «julgamento» preserva a tensão do contexto escatológico.
- issue: Referente de በእንቲአሁ
  choice: a respeito dele
  alternative: a respeito deles
  rationale: A forma ge'ez contém sufixo masculino singular e concorda com a evidência grega περὶ αὐτοῦ; o contexto anterior favorece referência ao espírito de Abel.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe conserva a solenidade narrativa sem arcaísmo. Não se acrescentaram notas, pois a leitura masculina singular está suficientemente sustentada pelo texto-fonte e a ambiguidade relevante de «julgamento» foi preservada no corpo da tradução.
