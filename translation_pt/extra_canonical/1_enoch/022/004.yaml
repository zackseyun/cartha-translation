base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/004.yaml
  text: And these places were made for them to dwell in until the day of their judgment[a], and until their appointed time, and that appointed time is long[c][b], until the time of the great judgment upon them.
translation:
  language: pt
  text: E estes lugares foram feitos[a] para eles habitarem neles até o dia do julgamento deles e até o prazo que lhes foi determinado[b]; e esse prazo é grande[c], até o tempo do grande julgamento sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma etíope traduzida por “foram feitos” é textualmente incerta. O sentido da frase parece ser que esses lugares foram feitos ou destinados para que eles ali habitassem até o julgamento.
    reason: textual_variant
  - marker: b
    text: A expressão também pode ser traduzida por “sua idade”, “sua duração de vida” ou “seu prazo”. Aqui parece indicar o período que lhes foi fixado antes do julgamento final.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “esse prazo é grande”. No contexto, o adjetivo também pode sugerir que o período é longo.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: መካናት
  choice: lugares
  rationale: O substantivo designa lugares ou moradas. “Lugares” preserva a amplitude do termo e se ajusta à topografia visionária sem acrescentar uma interpretação.
- source_word: ይነብርዎሙ
  choice: para que eles habitassem neles
  rationale: O verbo pode indicar habitar, permanecer ou residir. “Habitassem” expressa a permanência nesses lugares e concorda naturalmente com a construção final introduzida por “para que”.
- source_word: እስከ ዕለተ ኵነኔሆሙ
  choice: até o dia do seu julgamento
  rationale: ኵነኔ tem sentido judicial. “Julgamento” mantém o registro apocalíptico sem restringir antecipadamente o resultado a condenação.
- source_word: አመ ዕድሜሆሙ
  choice: até o tempo que lhes foi determinado
  rationale: ዕድሜ pode significar idade, duração de vida ou período. No contexto, refere-se ao prazo que lhes cabe antes do juízo; esta formulação comunica essa ideia em português corrente.
- source_word: ዘየዓቢ
  choice: será longo
  rationale: O termo significa literalmente “é grande”, mas, aplicado a um período, pode indicar longa duração. “Será longo” explicita a leitura temporal mais natural, enquanto a nota preserva a alternativa literal.
- source_word: ኵነኔ ዐቢይ በላዕሌሆሙ
  choice: o grande julgamento sobre eles
  rationale: A formulação conserva tanto o caráter culminante do julgamento quanto a preposição “sobre”, sem introduzir um verbo como “vir” que não aparece expressamente no texto.
- source_word: †ገብሩ†
  choice: foram feitos
  rationale: Embora a forma assinalada seja textualmente incerta, o sentido verbal de fazer ou preparar se ajusta à sintaxe e evita omitir um elemento presente no testemunho etíope.
theological_decisions:
- issue: Traduzir ኵነኔ como “julgamento” ou como “condenação”
  choice: julgamento
  alternative: condenação; sentença
  rationale: O contexto é judicial e escatológico, mas o termo não exige que o resultado seja especificado como condenação. “Julgamento” preserva a tensão do texto.
- issue: Entender ዘየዓቢ como grandeza ou duração
  choice: será longo
  alternative: é grande
  rationale: A referência imediata a um tempo ou prazo favorece a duração, mas a alternativa mais literal permanece indicada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário judicial e apocalíptico preservado. A sintaxe foi levemente ajustada para soar natural, sem eliminar a incerteza textual nem a ambiguidade entre grandeza e duração.
