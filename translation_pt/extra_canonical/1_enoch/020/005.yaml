base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/005.yaml
  text: Mikael[a], one of the holy angels[b], who is set over the good of mankind and over the people.
translation:
  language: pt
  text: Miguel, um dos santos anjos, encarregado do bem da humanidade e do povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “que foi posto sobre o bem dos seres humanos e sobre o povo”. A expressão também tem sido entendida como referência aos bons dentre a humanidade ou à melhor parte dela.'
    reason: Registra a construção mais formal e preserva a ambiguidade histórica de ‘o bem da humanidade’ sem incorporá-la silenciosamente ao texto principal.
lexical_decisions:
- source_word: ሚካኤል
  choice: Miguel
  rationale: Usa a forma portuguesa tradicional e amplamente reconhecida do nome semítico preservado em ge’ez como Mikael.
- source_word: ፩እምነ መላእክት ቅዱሳን
  choice: um dos santos anjos
  rationale: Expressa naturalmente a pertença de Miguel ao grupo dos anjos santos e conserva a identificação explícita desses seres.
- source_word: ተሰይመ (leitura recuperada no lugar do OCR ትእዛዚ)
  choice: encarregado
  rationale: Comunica nomeação e responsabilidade delegada em português corrente; evita traduzir como ‘mandamento’ uma forma resultante de erro de transcrição/OCR.
- source_word: ሠናይቱ ለሰብእ
  choice: do bem da humanidade
  rationale: Preserva ‘o bem’ como esfera da responsabilidade de Miguel sem restringi-lo aos ‘bons’ ou à ‘melhor parte’ dos seres humanos.
- source_word: ወዲበ ሕዝብ (leitura recuperada)
  choice: e do povo
  rationale: Mantém a segunda esfera coordenada de responsabilidade. Em português, a regência de ‘encarregado de’ torna desnecessário repetir ‘sobre’.
theological_decisions:
- issue: Âmbito da missão de Miguel
  choice: Miguel é responsável pelo bem da humanidade e pelo povo.
  alternative: Miguel está sobre os bons dentre a humanidade, ou sobre a melhor parte dela.
  rationale: A leitura recuperada e o testemunho grego favorecem ‘o bem da humanidade’ como domínio de responsabilidade. A tradução não identifica esse bem com um grupo eleito nem introduz uma interpretação doutrinária específica.
- issue: Erro de OCR na transcrição fornecida
  choice: Adotar a leitura verbal ‘foi posto/encarregado’ e a coordenação ‘e sobre’.
  alternative: Traduzir ትእዛዚ como ‘mandamento’ e produzir ‘o bom mandamento para o povo’.
  rationale: A revisão textual informa que ትእዛዚ é uma leitura espúria produzida por OCR; traduzi-la inventaria um ‘mandamento’ ausente do texto subjacente e obscureceria a função atribuída a Miguel.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com a forma tradicional ‘Miguel’. ‘Encarregado’ oferece fluidez sem apagar a ideia de autoridade delegada; a nota conserva a formulação literal e a alternativa interpretativa.
