base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/007.yaml
  text: Gabriʾel[a], one of the holy angels, who is over Paradise and the serpents and the cherubim.
translation:
  language: pt
  text: Gabriel, um dos santos anjos, que está encarregado do Paraíso, das serpentes[a] e dos querubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido como “serpentes” é lexicalmente difícil na transmissão etíope. Permanece alguma incerteza, embora o sentido tradicional neste versículo aponte para seres serpentinos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገብርኤል
  choice: Gabriel
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português, correspondente ao nome etíope.
- source_word: ፩እምነ
  choice: um dos
  rationale: Expressa de modo direto a pertença a um grupo.
- source_word: መላእክት ቅዱሳን
  choice: santos anjos
  rationale: Preserva a designação enóquica tradicional e o registro apocalíptico.
- source_word: ዘዲበ
  choice: que está encarregado de
  rationale: A construção indica autoridade ou responsabilidade sobre determinados domínios; esta formulação é natural e clara em português.
- source_word: ገነት
  choice: Paraíso
  rationale: Neste catálogo de anjos e seus domínios, o termo aponta para o âmbito paradisíaco, não para um jardim comum.
- source_word: አክይስት
  choice: serpentes
  rationale: Embora o termo seja lexicalmente difícil na transmissão etíope, a interpretação tradicional neste contexto indica seres serpentinos; “serpentes” mantém o registro elevado.
- source_word: ኪሩቤን
  choice: querubins
  rationale: É a designação tradicional em português para esses seres celestiais e preserva o plural.
theological_decisions:
- issue: Se ገነት deve ser entendido genericamente ou como um lugar cósmico e teológico
  choice: Paraíso
  alternative: o jardim; Éden
  rationale: No contexto da lista de arcanjos e dos domínios celestiais que lhes são confiados, o termo designa mais naturalmente o âmbito paradisíaco, sem exigir detalhes doutrinários posteriores.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Está encarregado de” comunica a noção de autoridade sem excessiva rigidez; os termos tradicionais “Paraíso” e “querubins” preservam o ambiente apocalíptico.
