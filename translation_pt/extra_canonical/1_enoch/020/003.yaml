  text: Rafael, um dos santos anjos, que está encarregado dos espíritos dos seres humanos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሩፋኤል
  choice: Rafael
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português, em vez de uma transliteração direta como “Rufael”.
- source_word: ፩እምነ
  choice: um dos
  rationale: O numeral com a preposição partitiva indica pertencimento ao grupo; “um dos” é natural e preserva esse sentido.
- source_word: ቅዱሳን፡ መላእክት
  choice: santos anjos
  rationale: Tradução direta e consagrada da expressão, adequada ao registro apocalíptico.
- source_word: ዘ
  choice: que
  rationale: O marcador relativo retoma Rafael; “que” produz uma construção corrente e digna em português.
- source_word: መናፍስተ
  choice: espíritos
  rationale: Preserva o termo cosmológico mais direto, sem restringi-lo interpretativamente a “almas”.
- source_word: ሰብእ
  choice: seres humanos
  rationale: O substantivo tem sentido coletivo referente à humanidade, não necessariamente limitado ao sexo masculino.
- source_word: ዘመናፍስተ፡ ሰብእ
  choice: que está encarregado dos espíritos dos seres humanos
  rationale: Expressa a esfera de responsabilidade ou autoridade atribuída a Rafael, em português natural, sem acrescentar uma função não declarada no texto.
theological_decisions:
- issue: Âmbito da responsabilidade de Rafael
  choice: Rafael está encarregado dos espíritos dos seres humanos.
  alternative: Rafael está encarregado das almas dos mortos ou da cura e da vida interior da humanidade.
  rationale: O ge'ez menciona apenas os “espíritos dos seres humanos”; não especifica mortos, cura ou vida interior. A redação mantém o alcance amplo e evita importar tradições interpretativas posteriores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Mantém-se a forma concisa de uma lista angelológica; “seres humanos” comunica naturalmente o valor coletivo de ሰብእ.
