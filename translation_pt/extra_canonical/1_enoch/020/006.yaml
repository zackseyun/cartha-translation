  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/006.yaml
  text: Saraqael[a], one of the holy angels[b], who is over the spirits of the children of men who sin.
translation:
  language: pt
  text: Saraqael[a], um dos santos anjos, que está encarregado dos espíritos dos filhos dos homens que pecam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também chamado Sariel em outras tradições textuais.
    reason: textual_variant
  - marker: b
    text: O trecho central da transcrição etiópica por OCR parece conter um erro de leitura; a expressão provavelmente significa “filhos dos homens”, isto é, seres humanos. A sintaxe também pode ser entendida como “os espíritos dos seres humanos que pecam”.
    reason: textual_variant
lexical_decisions:
- source_word: ሰራቃኤል
  choice: Saraqael
  rationale: Translitera o nome próprio de modo próximo à forma etíope fornecida, sem substituí-lo pela variante tradicional Sariel.
- source_word: ፩እምነ፡ መላእክት፡ ቅዱሳን
  choice: um dos santos anjos
  rationale: Reproduz a expressão partitiva e mantém a fórmula apocalíptica tradicional em português natural.
- source_word: ዘዲበ
  choice: que está encarregado de
  rationale: Expressa a autoridade ou supervisão indicada pela preposição, com mais naturalidade em português do que o literal 'que está sobre'.
- source_word: መናፍስት
  choice: os espíritos
  rationale: Mantém explicitamente o substantivo plural e sua referência a uma classe determinada.
- source_word: '[እስለ፡ እመሕያው፡]'
  choice: dos filhos dos homens
  rationale: O trecho de OCR provavelmente representa a expressão ge'ez እጓለ፡ እመሕያው, idiomática para 'filhos dos homens' ou humanidade, também apoiada pela tradição textual paralela.
- source_word: ዘመናፍስት፡ ያኃጥኡ
  choice: que pecam
  rationale: Conserva a ação moral do verbo e entende a oração relativa como qualificadora de 'filhos dos homens', sem acrescentar a expressão não sustentada 'no espírito'.
theological_decisions:
- issue: Identidade dos seres sob a responsabilidade de Saraqael
  choice: os espíritos dos filhos dos homens que pecam
  alternative: os espíritos que pecam
  rationale: A leitura escolhida preserva o domínio humano indicado pela expressão etíope restaurável e deixa a relação sintática suficientemente próxima do testemunho, sem definir além do texto a natureza ou o estado desses espíritos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Está encarregado de' comunica supervisão sem rigidez excessiva; 'filhos dos homens' conserva o registro antigo e apocalíptico, explicado em nota.
