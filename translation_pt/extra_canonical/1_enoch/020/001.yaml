base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/001.yaml
  text: And these are the names of the holy angels who keep watch[a].
translation:
  language: pt
  text: E estes são os nomes dos anjos santos que vigiam[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo traduzido por «vigiam» também pode ser entendido como «estão vigilantes» ou «mantêm vigilância». No contexto mais amplo de 1 Enoque, essa linguagem se relaciona com a ideia dos Vigilantes celestiais, mas aqui o versículo a apresenta como uma descrição dos anjos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝንቱ
  choice: E estes são
  rationale: A conjunção com o demonstrativo introduz uma lista ou identificação; o plural concorda com አስማቲሆሙ, «nomes».
- source_word: አስማቲሆሙ
  choice: os nomes
  rationale: A forma significa literalmente «seus nomes», mas, nesta fórmula introdutória, «os nomes» é natural em português, e a relação possessiva fica clara pela oração seguinte.
- source_word: ለእለ
  choice: dos ... que
  rationale: O marcador relativo liga «nomes» à descrição subsequente; a construção portuguesa «dos santos anjos que» expressa essa relação com clareza.
- source_word: ይተግሁ
  choice: mantêm vigilância
  rationale: O verbo denota estar desperto, atento ou vigilante. A formulação preserva o valor verbal e não o transforma indevidamente no título técnico «Vigilantes».
- source_word: ቅዱሳን
  choice: santos
  rationale: Equivalente corrente e digno para o adjetivo que caracteriza esses seres celestiais como santos.
- source_word: መላእክት
  choice: anjos
  rationale: Neste contexto apocalíptico, a referência é claramente a seres celestiais, de modo que «anjos» é mais adequado que o genérico «mensageiros».
theological_decisions:
- issue: Se os anjos que vigiam devem ser designados pelo termo técnico «Vigilantes»
  choice: que mantêm vigilância
  alternative: os Vigilantes; os que estão vigilantes
  rationale: O texto ge'ez emprega uma descrição verbal, não necessariamente um título fixo. A tradução conserva o sentido de vigilância e a possível ressonância com os Vigilantes no contexto mais amplo, sem impor essa identificação ao versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura introdutória foi mantida, e a ambiguidade entre uma ação de vigiar e uma possível alusão aos Vigilantes foi preservada em nota.
