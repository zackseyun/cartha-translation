base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/004.yaml
  text: Raguel[a], one of the holy angels[b], who takes vengeance on the world and on the luminaries.
translation:
  language: pt
  text: Raguel, um dos santos anjos, que executa vingança[a] contra o mundo e contra os luminares[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que vinga”. O verbo subjacente tem sentido retributivo e judicial.'
    reason: lexical_alternative
  - marker: b
    text: “Luminares” são as luzes celestes, provavelmente o sol, a lua e as estrelas, concebidos como corpos cósmicos na visão de mundo apocalíptica.
    reason: cultural_note
lexical_decisions:
- source_word: ራጉኤል
  choice: Raguel
  rationale: O nome próprio é transliterado segundo a forma convencional em português e na tradição enóquica.
- source_word: ፩እምነ
  choice: um dos
  rationale: Expressa de modo natural a relação partitiva, isto é, a pertença de Raguel ao grupo mencionado.
- source_word: መላእክት ቅዱሳን
  choice: santos anjos
  rationale: Preserva diretamente tanto o substantivo quanto o qualificativo, em linguagem corrente e digna.
- source_word: ዘይትቤቀሎ
  choice: que executa vingança
  rationale: Mantém o sentido judicial e retributivo do verbo sem o reduzir à ideia mais genérica de castigar.
- source_word: ለዓለም
  choice: contra o mundo
  rationale: Neste catálogo de atribuições angélicas, “mundo” comunica melhor o alcance cósmico do juízo; a preposição “contra” torna natural em português a regência da expressão escolhida.
- source_word: ለብርሃናት
  choice: contra os luminares
  rationale: “Luminares” conserva a imagem dos corpos celestes e evita a leitura de simples luzes comuns.
theological_decisions:
- issue: Alcance da função punitiva de Raguel
  choice: 'Raguel executa vingança contra dois objetos coordenados: o mundo e os luminares.'
  alternative: Raguel poderia ser entendido como supervisor da ordem do mundo e dos luminares, ou como agente de punição por transgressões relacionadas a eles.
  rationale: A sintaxe ge'ez vincula mais naturalmente os dois objetos ao mesmo verbo de sentido retributivo. A formulação preserva a linguagem austera de juízo própria da visão apocalíptica, sem suavizá-la como mera supervisão.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural para brasileiros. O registro é digno e direto; “executa vingança” preserva a força judicial do original, e “luminares” mantém sua imagem cosmológica.
