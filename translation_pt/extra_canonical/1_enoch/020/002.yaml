  text: Uriel[a], one of the holy angels[b], who is over the world and over Tartarus.
translation:
  language: pt
  text: Uriel, um dos santos anjos,[a] que está encarregado do mundo e do Tártaro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também é possível pontuar: “Uriel, um dos santos anjos — ele está encarregado do mundo e do Tártaro”.'
    reason: previous_rendering
  - marker: b
    text: A expressão final é textualmente difícil. Pode referir-se ao Tártaro — a região de prisão dos seres celestiais rebeldes — ou, de modo mais geral, ao abismo; também foram propostas as ideias de terror ou tremor.
    reason: textual_variant
lexical_decisions:
- source_word: ኡርኤል
  choice: Uriel
  rationale: O nome próprio é transliterado segundo a forma já consagrada em português, sem traduzir seu possível significado.
- source_word: ፩እመላእክት
  choice: um dos anjos
  rationale: O numeral com a preposição indica que Uriel pertence ao grupo mencionado; «anjos» corresponde ao contexto apocalíptico.
- source_word: ቅዱሳን
  choice: santos
  rationale: Conserva a designação tradicional dos seres celestiais nesse catálogo de anjos.
- source_word: እሰመ
  choice: que está encarregado de
  rationale: Expressa em português natural a esfera de responsabilidade ou autoridade atribuída a Uriel, sem explicitar uma nomeação que o texto não declara.
- source_word: ዘዓለም
  choice: o mundo
  rationale: No contexto das jurisdições cósmicas dos anjos, «mundo» é o sentido mais provável, embora o termo também possa ter valor temporal em outros contextos.
- source_word: ወዘተረዓድ
  choice: e do Tártaro
  rationale: A leitura contextual mais provável identifica um domínio cósmico inferior, o Tártaro; a incerteza textual e a possibilidade de «abismo» são registradas em nota.
theological_decisions:
- issue: Identificação do segundo domínio de Uriel
  choice: Tártaro
  alternative: abismo; terror ou tremor
  rationale: Um lugar cósmico concreto se ajusta ao catálogo de jurisdições angelicais e ao imaginário apocalíptico do Segundo Templo. Como a forma textual é difícil, a alternativa não é ocultada.
- issue: Relação sintática entre Uriel e sua esfera de responsabilidade
  choice: 'oração relativa: «que está encarregado»'
  alternative: 'oração independente: «ele está encarregado»'
  rationale: A oração relativa preserva a estrutura formulaica do catálogo e corresponde à leitura relativa indicada pelo testemunho em ge'ez, sem eliminar a possível leitura mais solta.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. «Está encarregado de» evita o decalque pouco idiomático «está sobre», mas mantém a noção de jurisdição. «Tártaro» conserva o referente cosmológico antigo, enquanto a nota torna transparente a incerteza textual.
