  text: From its fruit life shall be given to the chosen ones[a], and it shall be planted toward the north[b], upon...
translation:
  language: pt
  text: De seu fruto será dada vida aos escolhidos, e a árvore será plantada em direção ao norte, sobre...[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho ge'ez fornecido termina com a preposição “sobre”, antes de seu complemento; por isso, a frase permanece incompleta.
    reason: textual_variant
lexical_decisions:
- source_word: ፍሬ
  choice: fruto
  rationale: Preserva a imagem concreta do fruto da árvore no contexto visionário.
- source_word: ይትወሀብ
  choice: será dada
  rationale: Reproduz o sentido passivo e futuro da forma ge'ez sem ampliar a promessa.
- source_word: ኅሩያን
  choice: os escolhidos
  rationale: Mantém a designação apocalíptica local em linguagem clara, sem lhe impor um sentido técnico de sistemas teológicos posteriores.
- source_word: ሐይወት
  choice: vida
  rationale: Traduz diretamente o substantivo e não especifica se se trata de vida eterna, cura ou restauração.
- source_word: መንገለ መስዕ
  choice: em direção ao norte
  rationale: Conserva a nuance direcional de መንገለ e o sentido de መስዕ, “norte”.
- source_word: ይተከል
  choice: será plantada
  rationale: Mantém a imagem arbórea e o valor passivo-futuro do verbo; “a árvore” explicita em português o sujeito implícito indicado pelo contexto.
- source_word: ዲበ
  choice: sobre...
  rationale: Trata ዲበ como preposição, não como advérbio. As reticências sinalizam que o trecho fornecido termina antes do complemento exigido.
theological_decisions:
- issue: Identidade de ኅሩያን
  choice: os escolhidos
  alternative: os eleitos; os justos
  rationale: A opção conserva a categoria apocalíptica de 1 Enoque sem importar conotações técnicas posteriores nem apagar a ideia de escolha.
- issue: Natureza da vida prometida
  choice: vida
  alternative: vida eterna; cura; restauração
  rationale: Embora o contexto sugira vida escatológica ou exaltada, o testemunho apresentado diz apenas “vida”; a tradução preserva essa abertura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, e “a árvore” explicita o sujeito implícito para evitar que “vida” pareça ser o sujeito de “será plantada”.
