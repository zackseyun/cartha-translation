base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/002.yaml
  text: At that time I[a], Enoch, answered him, saying, “I desire to know about everything[b], but especially about this tree.”
translation:
  language: pt
  text: 'Naquele tempo, eu, Enoque, respondi-lhe, dizendo: “Desejo saber a respeito de tudo, mas especialmente a respeito desta árvore.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A sintaxe do ge''ez no fim do versículo é um tanto difícil. Também pode ser traduzida: “Desejo saber a respeito de tudo e, ainda mais, a respeito desta árvore.”'
    reason: textual_variant
lexical_decisions:
- source_word: አውሣእክዎ
  choice: respondi-lhe
  rationale: O verbo significa responder e traz um sufixo de objeto masculino singular; “respondi-lhe” preserva tanto o caráter dialogal quanto o referente pessoal.
- source_word: እንዘ፡ እብል
  choice: dizendo
  rationale: A construção introduz a fala direta. “Dizendo” é natural em português e mantém a cadência narrativa elevada.
- source_word: በእንተ፡ ኵሉ
  choice: a respeito de tudo
  rationale: A expressão tem referência ampla e contrasta com a menção específica da árvore no fim do versículo.
- source_word: እፈቅድ፡ ኣእምር
  choice: Desejo saber
  rationale: A combinação expressa vontade de adquirir conhecimento. “Desejo saber” é direta, digna e menos interpretativa que “desejo compreender”.
- source_word: ወፈድፋደሰ
  choice: mas especialmente
  rationale: A forma intensifica e destaca o interesse de Enoque pela árvore. No contexto sintático, “mas especialmente” comunica com clareza o contraste entre o todo e o elemento particular.
- source_word: በእንተዝ፡ ዕፅ
  choice: a respeito desta árvore
  rationale: A expressão aponta especificamente para a árvore da visão; “árvore” é o sentido exigido pelo contexto.
theological_decisions:
- issue: Se o pedido de Enoque deve soar como curiosidade geral ou como desejo intensificado de conhecimento revelado sobre a árvore
  choice: Desejo saber a respeito de tudo, mas especialmente a respeito desta árvore
  alternative: Desejo saber a respeito de tudo e, ainda mais, a respeito desta árvore
  rationale: A redação conserva tanto a amplitude do pedido quanto a ênfase particular na árvore, sem reduzir o interesse de Enoque a mera curiosidade nem definir em que consiste o conhecimento buscado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A forma “respondi-lhe” conserva o objeto masculino singular do verbo ge'ez; a fala direta evita arcaísmos desnecessários e preserva a ênfase contrastiva do original.
