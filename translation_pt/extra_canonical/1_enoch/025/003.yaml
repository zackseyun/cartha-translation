base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/003.yaml
  text: And he answered me[a], saying, “This high mountain that you have seen, whose summit is like the throne of the Lord, is his throne, where the Holy and Great One, the Lord of Glory, the Eternal King[c][b], will dwell when he comes down to visit the earth with goodness.”
translation:
  language: pt
  text: 'E ele me respondeu: “Este monte elevado que você viu, cujo cume é como o trono do Senhor, é o trono dele, onde habitará o Santo e Grande, o Senhor da Glória, o Rei Eterno, quando descer para visitar a terra com bondade.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase final também pode ser traduzida como “inspecionar a terra para o bem” ou “visitar a terra em bondade”. O sentido é o de uma visitação divina beneficente.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: respondeu
  rationale: Verbo narrativo comum para uma resposta; mantém o caráter dialogal da visão.
- source_word: ደብር
  choice: monte
  rationale: No cenário topográfico e apocalíptico, designa uma elevação grandiosa; “monte” é natural na tradição bíblica em português.
- source_word: ነዋኅ
  choice: elevado
  rationale: Expressa a grande altura do monte em linguagem atual e digna.
- source_word: ዘርእሱ
  choice: cujo cume
  rationale: O termo significa literalmente “cabeça/topo”; “cume” se ajusta naturalmente à imagem do monte.
- source_word: መንበረ / መንበሩ ውእቱ
  choice: trono / é o trono dele
  rationale: Preserva a repetição explícita da imagem do trono e a identificação enfática presente no ge'ez.
- source_word: ኀበ ይነብር
  choice: onde habitará
  rationale: Reflete o sentido locativo e habitacional do verbo sem reduzi-lo simplesmente ao ato de sentar-se.
- source_word: ቅዱስ ወዐቢይ
  choice: o Santo e Grande
  rationale: Trata a expressão como título substantivado, em aposição aos títulos divinos seguintes.
- source_word: እግዚአ ስብሐት
  choice: o Senhor da Glória
  rationale: Mantém o título divino, sua solenidade e sua ressonância bíblica.
- source_word: ንጉሥ ዘለዓለም
  choice: o Rei Eterno
  rationale: Preserva de forma compacta tanto a realeza quanto a duração perpétua.
- source_word: የኀውጻ ለምድር በሠናይ
  choice: visitar a terra com bondade
  rationale: Comunica uma visitação divina beneficente e mantém a possível nuance modal de በሠናይ.
theological_decisions:
- issue: Identificação do monte com o trono divino
  choice: “é o trono dele, onde habitará”
  alternative: “é o lugar onde se assentará” ou “é seu trono, onde habita”
  rationale: A formulação conserva tanto a identificação explícita “é o trono dele” quanto a tensão entre a habitação divina e a futura descida mencionada no fim do versículo.
- issue: Função de ቅዱስ ወዐቢይ
  choice: 'Título substantivado: “o Santo e Grande”'
  alternative: 'Adjetivos ligados diretamente a “Senhor”: “o santo e grande Senhor”'
  rationale: A construção pode ser lida como epíteto independente em aposição a “Senhor da Glória” e “Rei Eterno”; essa opção preserva a sequência enfática de títulos.
- issue: Natureza da visitação divina
  choice: “visitar a terra com bondade”
  alternative: “inspecionar a terra para o bem” ou “visitar a terra em bondade”
  rationale: Evita apresentar a descida como mero deslocamento e conserva seu caráter beneficente sem definir além do que o texto permite.
translation_notes:
  register: Português moderno, reverente e amplamente compreensível, com leitura natural no Brasil. Mantêm-se a repetição de “trono”, a sucessão solene dos títulos divinos e a ambiguidade controlada da frase final.
