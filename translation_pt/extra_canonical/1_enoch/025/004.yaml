base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/004.yaml
  text: And this fragrant tree—no flesh has authority to touch it until the great judgment[a], when all will be avenged and brought to completion forever[d][c][b]; then it will be given to the righteous and the humble.
translation:
  language: pt
  text: E esta árvore perfumada — nenhuma carne tem autoridade para tocá-la até o grande julgamento[a], quando ele se vingará de todos e a levará à plena consumação para sempre[b]; essa árvore será dada aos justos e aos humildes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nenhuma carne tem autoridade”. Aqui, “carne” designa os seres humanos mortais, não a carne como substância.
    reason: lexical_alternative
  - marker: b
    text: A cláusula referente ao grande julgamento é difícil. O texto apresenta um sujeito singular não expresso que se vinga de todos e leva a matéria em questão à consumação; o referente do objeto de “levará” não é expresso e pode ser entendido de modo mais geral.
    reason: textual_variant
lexical_decisions:
- source_word: ዕፀ መዓዛ
  choice: árvore perfumada
  rationale: Expressa naturalmente uma árvore caracterizada por aroma, preservando a imagem concreta.
- source_word: አልሐዱ
  choice: tocar
  rationale: Mantém a ideia de contato ou acesso proibido sem especificar indevidamente que se trata de comer.
- source_word: ዘሥጋ
  choice: nenhuma carne
  rationale: Preserva a formulação antropológica apocalíptica do ge'ez; a nota esclarece que se refere aos mortais.
- source_word: ሥልጣነ
  choice: autoridade
  rationale: Comunica direito ou autorização, e não apenas capacidade física.
- source_word: ኵነኔ
  choice: julgamento
  rationale: É a opção ampla e adequada ao contexto do grande juízo escatológico.
- source_word: ይትቤቀል
  choice: ele se vingará
  rationale: Conserva a força ativa do verbo e seu sujeito singular implícito sem nomeá-lo além do que permite o texto.
- source_word: ኵሎ
  choice: de todos
  rationale: Mantém amplo o alcance da vingança no contexto judicial, embora o referente exato possa ser pessoas ou a totalidade julgada.
- source_word: ይፌጽም
  choice: levará tudo à plena consumação
  rationale: Expressa conclusão ou cumprimento completo sem reduzir a ação a mero término cronológico.
- source_word: ለዓለም
  choice: para sempre
  rationale: Equivalente corrente e digno para duração perpétua.
- source_word: ጻድቃን
  choice: os justos
  rationale: Preserva o termo identitário característico da literatura apocalíptica.
- source_word: ትሑታን
  choice: os humildes
  rationale: Representa a humildade ou condição rebaixada sem importar linguagem confessional posterior.
- source_word: ይትወሀብ
  choice: será dada
  rationale: Mantém a voz passiva e o sentido de concessão futura.
- source_word: ዝኩ
  choice: aquela
  rationale: Traduz o demonstrativo que retoma a árvore, evitando introduzir um advérbio temporal ausente.
theological_decisions:
- issue: Sentido de “carne” na proibição de acesso
  choice: Manter “nenhuma carne” no texto e explicar que designa seres humanos mortais.
  alternative: Traduzir diretamente como “nenhum mortal” ou “nenhum ser humano”.
  rationale: A forma literal preserva o contraste antropológico apocalíptico, enquanto a nota impede que “carne” seja entendida apenas como substância corporal.
- issue: Sujeito da cláusula de vingança
  choice: 'Usar o sujeito singular implícito: “ele se vingará”.'
  alternative: Empregar uma construção impessoal ou passiva, como “a vingança será executada”.
  rationale: A forma verbal permite um sujeito singular implícito; “ele” conserva essa força sem acrescentar explicitamente “Deus” ao texto.
- issue: Referente do demonstrativo final
  choice: Traduzir ዝኩ como “aquela”, retomando a árvore.
  alternative: “Então ela”, com valor temporal.
  rationale: O termo é demonstrativo, não advérbio temporal; a tradução evita introduzir uma sequência temporal que não está lexicalmente expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva a estranheza deliberada de “nenhuma carne” e a ambiguidade controlada da cláusula escatológica. O demonstrativo final foi vertido como “aquela” para retomar explicitamente a árvore.
