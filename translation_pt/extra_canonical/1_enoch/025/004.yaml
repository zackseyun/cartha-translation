revisions:
- from: E esta árvore perfumada — nenhuma carne tem autoridade para tocá-la até o grande julgamento[a], quando ele se vingará de todos e levará tudo à plena consumação para sempre[b]; aquela será dada aos justos e aos humildes.
  to: E esta árvore perfumada — nenhuma carne tem autoridade para tocá-la até o grande julgamento[a], quando ele se vingará de todos e a levará à plena consumação para sempre[b]; essa árvore será dada aos justos e aos humildes.
  rationale: A revisão remove «tudo», que estreitava uma ambiguidade sintática do ge'ez, e substitui a retomada demonstrativa pouco natural por «essa árvore», conservando o referente de ዝኩ e evitando introduzir «então». Mantêm-se a formulação literal «nenhuma carne», o sujeito singular implícito e a força judicial de «se vingará».
