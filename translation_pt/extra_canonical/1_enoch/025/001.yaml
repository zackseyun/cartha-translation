base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/001.yaml
  text: And he said to me[a], “Enoch, why do you ask about the fragrance of this tree, and inquire so that you may know?”
translation:
  language: pt
  text: 'E ele me disse: “Enoque, por que você pergunta sobre o aroma[a] desta árvore e indaga para saber?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cheiro”. O termo ge''ez pode designar cheiro ou fragrância; “aroma” foi escolhido por se ajustar ao contexto elevado e maravilhoso da cena.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይቤለኒ
  choice: ele me disse
  rationale: Preserva a fórmula narrativa direta de introdução da fala, sem ampliação desnecessária.
- source_word: ሄኖክ
  choice: Enoque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ምንተ ትስእል
  choice: por que você pergunta
  rationale: Embora ምንተ corresponda literalmente a “o que”, a construção, seguida pelo objeto e pela finalidade da pergunta, funciona idiomaticamente como “por que” neste contexto.
- source_word: በእንተ መዓዛሁ ለዝ ዕፅ
  choice: sobre o aroma desta árvore
  rationale: “Aroma” comunica de modo natural o cheiro possivelmente agradável indicado por መዓዛ, enquanto “árvore” é o referente concreto mais adequado para ዕፅ nesta visão.
- source_word: ወትጠየቅ
  choice: e indaga
  rationale: Mantém distinto o segundo verbo de perguntar, preservando a repetição deliberada do texto-fonte.
- source_word: ከመ ታእምር
  choice: para saber
  rationale: Expressa de forma simples e direta a oração de finalidade e conserva a ênfase no conhecimento.
theological_decisions:
- issue: Tom da resposta do interlocutor angelical
  choice: Uma interpelação moderada sobre a pergunta de Enoque
  alternative: Uma repreensão severa por curiosidade imprópria ou um simples pedido de esclarecimento
  rationale: A repetição dos verbos de perguntar e a oração de finalidade sondam a intenção de Enoque sem afirmar que sua curiosidade seja pecaminosa.
translation_notes:
  register: Português moderno, claro e digno, com “você” para legibilidade brasileira ampla. A repetição entre “pergunta” e “indaga” foi conservada porque corresponde à estrutura do ge'ez, mesmo produzindo uma formulação um pouco solene.
