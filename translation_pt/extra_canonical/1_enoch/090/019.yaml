base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/019.yaml
  text: And I saw until a great sword was given to the sheep[a], and the sheep went out against all the beasts of the field to kill them; and all the beasts and the birds of heaven fled from before their face.
translation:
  language: pt
  text: E vi até que uma grande espada foi dada às ovelhas, e as ovelhas saíram contra todos os animais selvagens do campo para matá-los; e todos os animais e as aves do céu fugiram de diante delas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fugiram de diante da face delas”; trata-se de uma expressão semítica que significa fugir da presença de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: continuei olhando
  rationale: No contexto da fórmula visionária com እስከ, expressa a observação contínua até o acontecimento decisivo, em português natural.
- source_word: እስከ ተውህበ
  choice: até que ... foi dada
  rationale: Preserva a progressão temporal da visão e a voz passiva do texto ge'ez.
- source_word: ለአባግዕ
  choice: às ovelhas
  rationale: Representa o dativo e mantém sem decodificação a imagem simbólica do Apocalipse dos Animais.
- source_word: ሰይፍ ዐቢይ
  choice: uma grande espada
  rationale: Conserva tanto a possível noção de tamanho quanto a força simbólica, sem restringir o sentido a 'poderosa'.
- source_word: ወወፅኡ አባግዕ
  choice: e as ovelhas saíram
  rationale: Tradução direta e corrente do movimento das ovelhas para a ação.
- source_word: ዲበ ኵሉ አራዊተ ገዳም
  choice: contra todos os animais do campo
  rationale: A preposição 'contra' comunica o avanço hostil; 'animais do campo' preserva a terminologia concreta da visão.
- source_word: ከመ ይቅትልዎሙ
  choice: para matá-los
  rationale: Exprime com clareza a finalidade e mantém sem atenuação a violência da cena.
- source_word: አዕዋፈ ሰማይ
  choice: as aves do céu
  rationale: Formulação bíblica natural em português, com registro elevado mas acessível.
- source_word: ነፍጹ እምቅድመ ገጾሙ
  choice: fugiram de diante delas
  rationale: Preserva de modo idiomático em português a expressão semítica concreta 'de diante da face delas', cujo referente plural são as ovelhas.
theological_decisions:
- issue: Decodificação da simbologia animal no texto principal
  choice: Manter literalmente 'ovelhas', 'animais' e 'aves' como símbolos visionários
  alternative: Traduzir interpretativamente como Israel, nações hostis e poderes aliados
  rationale: A tradução deve conservar os termos próprios da visão apocalíptica, sem substituir suas imagens por uma interpretação teológica.
- issue: Agente implícito que entrega a espada
  choice: Preservar a construção passiva 'foi dada'
  alternative: Explicitar Deus como aquele que deu a espada
  rationale: O texto não nomeia o agente; explicitá-lo resolveria uma ambiguidade que o original deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a cadência visionária, as imagens animais e a passiva teológica, evitando arcaísmos desnecessários e explicações interpretativas no corpo do texto.
