base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/035.yaml
  text: And the eyes of them all were opened[a], and they saw well[b], and there was not one among them that did not see.
translation:
  language: pt
  text: E os olhos de todos eles foram abertos, e eles enxergaram bem[a]; entre eles, não havia ninguém que não enxergasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “viram o que era bom” ou “viram coisas boas”. O termo ge''ez também pode ser entendido substantivamente, embora o contexto favoreça o sentido adverbial “bem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አዕይን
  choice: olhos
  rationale: Mantém a imagem corporal concreta do texto e se ajusta ao simbolismo visionário do Apocalipse dos Animais.
- source_word: ተከሥታ
  choice: foram abertos
  rationale: Expressa naturalmente a ação passiva sobre os olhos e preserva o motivo apocalíptico da percepção restaurada.
- source_word: ሠናየ
  choice: bem
  rationale: O acusativo pode ter função adverbial, e o contexto de cegueira anterior favorece a ideia de passar a enxergar bem; a possível leitura substantiva é registrada em nota.
- source_word: ዘኢይሬኢ አልቦ
  choice: não havia ninguém que não enxergasse
  rationale: Reproduz a construção negativa enfática sem transformá-la explicitamente em uma afirmação sobre cegueira.
- source_word: በማእከሎሙ
  choice: entre eles
  rationale: É a forma portuguesa natural de exprimir a localização distributiva indicada pela expressão ge'ez.
theological_decisions:
- issue: Natureza da visão restaurada
  choice: Conservar a imagem narrativa de olhos abertos e capacidade de enxergar restaurada.
  alternative: Explicitar a passagem como iluminação ou entendimento espiritual concedido a todos.
  rationale: No contexto das Visões dos Sonhos, a imagem funciona dentro do mundo simbólico da narrativa. A tradução não resolve sua força teológica nem impõe uma alegorização específica.
- issue: Sentido de ሠናየ
  choice: 'Entender o termo adverbialmente: “bem”.'
  alternative: 'Entendê-lo substantivamente: “o que era bom” ou “coisas boas”.'
  rationale: A função adverbial do acusativo e o contraste contextual com a cegueira favorecem “bem”, mas a alternativa lexical genuína permanece indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Passaram a enxergar” torna natural o resultado da abertura dos olhos sem abandonar a imagem concreta; a segunda oração mantém a ênfase negativa do original.
