base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/029.yaml
  text: And I saw until the Lord of the sheep brought a new house[a], greater and loftier than the first, and set it up in the place of the first, which had been folded up; and all its pillars were new, and its ornaments were new and greater than those of the first old one that he had taken away[b], and all the sheep were within it.
translation:
  language: pt
  text: E continuei olhando, até que o Senhor das ovelhas trouxe uma casa nova, maior e mais alta que a primeira, e a colocou no lugar da primeira, que havia sido dobrada[a]. Todas as suas colunas eram novas, e seus ornamentos eram novos e maiores que os da velha primeira casa, que ele havia retirado[b]; e todas as ovelhas estavam dentro dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enrolada” ou “envolvida”. O verbo ge'ez é difícil e pode descrever a casa anterior como dobrada, enrolada ou envolvida antes de ser substituída.
    reason: lexical_alternative
  - marker: b
    text: A “casa” provavelmente simboliza o santuário restaurado ou escatológico, mas a tradução mantém a imagem própria da visão.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: o Senhor das ovelhas
  rationale: Preserva o título elevado e a imagem recorrente do Apocalipse dos Animais, sem reduzir o sentido a mero proprietário.
- source_word: ቤት ኀዲስ
  choice: uma casa nova
  rationale: Traduz diretamente o substantivo 'casa' e mantém a linguagem simbólica da visão, sem interpretá-la no texto principal como 'templo'.
- source_word: ዓቢይ ... ልዑል
  choice: maior e mais alta
  rationale: Expressa de modo natural em português tanto a grandeza quanto a elevação da nova casa.
- source_word: አቀሞ ውስተ መካነ ቀዳማዊት
  choice: a colocou no lugar da primeira
  rationale: Comunica claramente que a nova casa é instalada no mesmo lugar da anterior.
- source_word: እንተ ትጠብለለት
  choice: que havia sido dobrada
  rationale: Conserva a imagem concreta e incomum do ge'ez, em vez de substituí-la por uma interpretação como 'demolida'; a nota registra alternativas lexicais.
- source_word: አዕማዲ
  choice: colunas
  rationale: Termo arquitetônico corrente e natural em português para os suportes da casa.
- source_word: ስና
  choice: ornamentos
  rationale: Mantém o provável sentido de elementos de adorno arquitetônico sem especificar excessivamente sua natureza.
- source_word: ብሊት
  choice: a velha
  rationale: Conserva o contraste explícito entre a casa nova e a anterior, agora caracterizada como velha.
- source_word: አውፅአ
  choice: havia retirado
  rationale: No contexto da substituição da casa, expressa remoção sem acrescentar a ideia mais forte de destruição.
- source_word: ማእከላ
  choice: dentro dela
  rationale: Reproduz com clareza a localização de todas as ovelhas no interior da nova casa.
theological_decisions:
- issue: Traduzir ቤት literalmente ou explicitar o provável referente cultual
  choice: casa
  alternative: templo ou santuário
  rationale: A visão emprega imagens simbólicas; manter 'casa' preserva sua textura apocalíptica e evita transformar uma interpretação provável no referente explícito do texto.
- issue: Explicitar o destino da primeira casa em እንተ ትጠብለለት
  choice: que havia sido dobrada
  alternative: que havia sido enrolada, removida ou demolida
  rationale: O verbo ge'ez apresenta uma imagem concreta lexicalmente difícil. A tradução preserva essa estranheza e não resolve silenciosamente a ambiguidade como destruição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura 'continuei olhando' reproduz naturalmente a fórmula visionária continuativa; o período longo conserva o fluxo cumulativo do relato apocalíptico.
