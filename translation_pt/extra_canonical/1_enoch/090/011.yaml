base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/011.yaml
  text: And with that[a], all those eagles and vultures and ravens and kites kept snatching away the sheep even until now, and swooping down upon them and devouring them; but the sheep remained silent[e][d][c][b], and the rams lamented and cried out.
translation:
  language: pt
  text: E, com isso, todas aquelas águias, abutres, corvos e milhafres continuaram arrebatando as ovelhas até agora, lançando-se sobre elas e devorando-as. As ovelhas, porém, permaneceram caladas, e os carneiros lamentaram e clamaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንስርት
  choice: águias
  rationale: Mantém uma ave concreta e distinta do termo seguinte para preservar o catálogo animal da visão.
- source_word: አውስት
  choice: abutres
  rationale: Designa aqui uma ave necrófaga distinta das águias, preservando a diferenciação da lista.
- source_word: ቋዓት
  choice: corvos
  rationale: Segue a revisão lexical mais recente, que identifica o termo como 'corvos', na ordem em que aparece no ge'ez.
- source_word: ሆባይ
  choice: milhafres
  rationale: Segue a revisão lexical mais recente, que identifica o termo como 'milhafres'; a escolha mantém a imagem de aves predadoras.
- source_word: ይመስጥዎሙ
  choice: continuaram arrebatando
  rationale: Expressa a ação violenta e continuada de tomar ou levar embora, indicada pelo contexto e pelo aspecto verbal.
- source_word: ይሰርሩ ዲቤሆሙ
  choice: lançando-se sobre elas
  rationale: No contexto de aves de rapina, o verbo indica voar ou precipitar-se sobre as ovelhas, não pisoteá-las.
- source_word: ይበልዕዎሙ
  choice: devorando-as
  rationale: Preserva a intensidade da ação predatória, com mais vivacidade do que simplesmente 'comendo-as'.
- source_word: ያረምሙ
  choice: permaneceram caladas
  rationale: Reproduz de modo natural o estado de silêncio ou mudez atribuído às ovelhas.
- source_word: ይቤላት
  choice: os carneiros
  rationale: Entendido como substantivo plural, identifica um grupo diferente das ovelhas e elimina a contradição criada ao atribuir os clamores a elas.
- source_word: የአወይዉ ወይጸርኁ
  choice: lamentaram e clamaram
  rationale: Conserva as duas expressões de aflição e sua sequência coordenada.
theological_decisions:
- issue: Relação entre o silêncio das ovelhas e os lamentos e clamores subsequentes
  choice: Atribuir o silêncio às ovelhas e os lamentos e clamores aos carneiros
  alternative: Atribuir ambas as ações às ovelhas e preservar uma suposta tensão entre silêncio e clamor
  rationale: O ge'ez contém ይቤላት, entendido como o plural de 'carneiro'. Assim, os sujeitos são distintos, e não há base textual para introduzir uma contradição teológica ou retórica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A enumeração concreta das aves e a violência progressiva das ações foram preservadas. 'Até agora' mantém a perspectiva temporal do visionário; 'com ele' conserva a referência anafórica do início sem explicá-la além do texto.
