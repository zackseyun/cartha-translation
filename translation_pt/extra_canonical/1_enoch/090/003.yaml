base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/003.yaml
  text: And the sheep cried out because their flesh was being devoured by the birds[b][a], and I looked and lamented in my sleep over that shepherd who was shepherding the sheep.
translation:
  language: pt
  text: E as ovelhas gritaram porque a carne delas estava sendo devorada pelas aves[a]; então olhei e lamentei, em meu sono[b], por aquele pastor que pastoreava as ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto diz apenas “aves”; a ideia de aves de rapina é sugerida pelo fato de elas devorarem a carne.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em meu sonho”. A expressão se refere literalmente ao sono no qual ocorre a visão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አባግዕ
  choice: as ovelhas
  rationale: Preserva explicitamente a imagem animal do apocalipse, sem substituí-la por seu possível referente histórico.
- source_word: ጸርኁ
  choice: gritaram
  rationale: Expressa um clamor audível de aflição em português corrente e digno.
- source_word: ይትበልዑ ሥጋሆሙ
  choice: sua carne estava sendo devorada
  rationale: Mantém tanto o aspecto passivo e contínuo quanto a imagem visceral de 'carne'.
- source_word: እምነ አዕዋፍ
  choice: pelas aves
  rationale: Representa a agência na construção passiva sem especificar além do texto que sejam aves de rapina.
- source_word: ነጸርኩ
  choice: olhei
  rationale: Verbo simples e direto, apropriado à sequência da visão.
- source_word: አውየውኩ
  choice: lamentei
  rationale: Distingue a reação pesarosa do vidente do grito anterior das ovelhas e conserva o registro solene.
- source_word: በንዋምየ
  choice: durante o meu sono
  rationale: Conserva a referência concreta ao sono, sem convertê-la interpretativamente em 'sonho'.
- source_word: ኖላዊ ዘይርዕዮሙ ለአባግዕ
  choice: pastor que cuidava das ovelhas
  rationale: Preserva o substantivo 'pastor' e verte a atividade pastoral com naturalidade, evitando a repetição pouco idiomática 'pastoreava' logo após 'pastor'.
theological_decisions:
- issue: Interpretar ou não os animais como seus referentes históricos no texto principal
  choice: Manter as imagens literais de ovelhas, aves e pastor
  alternative: Substituir as imagens por povo, inimigos e governante
  rationale: A passagem é uma visão apocalíptica; traduzir diretamente os referentes eliminaria a forma simbólica e resolveria uma interpretação que o texto não explicita aqui.
- issue: Especificar as aves como aves de rapina
  choice: Usar apenas 'aves' no texto principal
  alternative: Usar 'aves de rapina'
  rationale: A ação de devorar implica predação, mas o substantivo da fonte não traz essa especificação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece sóbrio e visionário; a ordem foi levemente ajustada com 'então' para tornar clara a progressão, sem eliminar a tensão do relato.
