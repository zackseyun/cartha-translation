base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/018.yaml
  text: And I saw until the Lord of the sheep came to them, and he took in his hand the staff of wrath and struck the earth; and the earth split open, and all the beasts and all the birds of heaven fell away from among those sheep and sank into the earth, and it covered over them.
translation:
  language: pt
  text: E continuei olhando, até que o Senhor das ovelhas veio até elas. Ele tomou na mão o cajado da ira[c] e golpeou a terra; então a terra se abriu[a], e todos os animais selvagens[b] e todas as aves do céu caíram do meio daquelas ovelhas, afundaram na terra, e ela os cobriu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra foi fendida”. A construção ge''ez é difícil, mas as linhas seguintes indicam que o solo se abre, permitindo que os animais e as aves afundem nele.'
    reason: lexical_alternative
  - marker: b
    text: Os “animais selvagens” e as “aves do céu” dão continuidade ao simbolismo do Apocalipse dos Animais e representam poderes hostis, não apenas animais comuns.
    reason: cultural_note
  - marker: c
    text: Outra tradução possível é “a vara da ira”. O ge'ez diz literalmente “da ira”, sem o possessivo “sua”.
    reason: previous_rendering
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: o Senhor das ovelhas
  rationale: Preserva tanto o peso do título quanto a figura central da alegoria animal; “Senhor” é natural e teologicamente sóbrio em português.
- source_word: በትር መዓተ
  choice: o cajado da ira
  rationale: “Cajado” mantém viva a imagem pastoril; “da ira” reproduz a construção sem acrescentar o possessivo “sua”, ausente no ge'ez.
- source_word: ዘበጣ ለምድር
  choice: golpeou a terra
  rationale: Expressa um golpe forte e deliberado, em linguagem atual, sem o arcaísmo de “feriu” no sentido físico.
- source_word: ተሰጠተ ምድር
  choice: a terra se abriu
  rationale: O contexto imediato — os seres afundam e a terra os cobre — favorece a ideia de abertura ou fenda, embora a forma ge'ez seja difícil.
- source_word: ወድቁ እምዝኩ አባግዕ
  choice: caíram do meio daquelas ovelhas
  rationale: Conserva tanto o movimento de queda quanto a separação em relação ao grupo das ovelhas.
- source_word: ተሰጥሙ በምድር
  choice: afundaram na terra
  rationale: Mantém a sequência visual sem decidir se foram tragados passivamente ou se desabaram para dentro da abertura.
- source_word: ከደነት ዲቤሆሙ
  choice: ela os cobriu
  rationale: O pronome retoma naturalmente “a terra” e preserva a imagem de soterramento.
theological_decisions:
- issue: Título divino dentro da alegoria animal
  choice: o Senhor das ovelhas
  alternative: o dono das ovelhas
  rationale: “Senhor” mantém a soberania divina e o registro apocalíptico sem inserir identificação cristológica posterior.
- issue: Instrumento do juízo
  choice: o cajado da ira
  alternative: a vara da ira
  rationale: “Cajado” se harmoniza com o cenário pastoril, enquanto “ira” conserva a força judicial; não se acrescenta “sua”, pois o original não traz sufixo possessivo.
- issue: Identidade dos animais e das aves
  choice: manter as figuras animais no texto e explicar seu papel simbólico em nota
  alternative: substituí-las diretamente por “poderes inimigos”
  rationale: A formulação concreta preserva a linguagem própria do Apocalipse dos Animais e evita resolver a alegoria dentro da tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação narrativa foi mantida, mas dividida em duas frases para fluidez. “Continuei olhando” traduz a fórmula visionária de modo natural; “cajado” preserva a coerência pastoril da alegoria.
