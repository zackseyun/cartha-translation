base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/013.yaml
  text: And I saw until the shepherds and the eagles and the vultures and the kites came[a], and they cried out to the ravens to break the horn of that ram; and they fought and battled with him, and he fought with them[c][b], and cried out that his help might come.
translation:
  language: pt
  text: E continuei olhando até que vieram os pastores, as águias, os abutres e os milhafres. Eles gritaram aos corvos que quebrassem o chifre daquele carneiro[a]; então lutaram e travaram batalha contra ele, e ele lutou contra eles e gritou para que viesse o seu auxílio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “daquele bode”. A identificação exata do macho com chifre não é inteiramente segura.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que viesse o seu ajudador”. O termo pode designar tanto auxílio quanto aquele que auxilia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: os pastores
  rationale: Preserva a metáfora técnica dos supervisores na visão dos animais, sem substituí-la por uma identificação histórica.
- source_word: አንስርት
  choice: as águias
  rationale: É a identificação contextual mais comum e mantém distinta esta ave de rapina dentro da enumeração.
- source_word: አውስት
  choice: os abutres
  rationale: A revisão da sequência etíope confirma que os abutres pertencem à lista dos que chegam, e não os corvos.
- source_word: ወሀባይ
  choice: e os milhafres
  rationale: “Milhafres” oferece uma designação portuguesa reconhecível para a ave de rapina, embora a espécie exata permaneça incerta.
- source_word: ቋዓት
  choice: aos corvos
  rationale: Os corvos são o objeto indireto do clamor e recebem a ordem de quebrar o chifre.
- source_word: ይቀትቅጥዎ
  choice: que quebrassem
  rationale: Expressa a ação violenta de partir ou esmagar sem tornar a intensidade mais específica do que o texto permite.
- source_word: ቀርኖ
  choice: o chifre
  rationale: Mantém o substantivo singular e a imagem central do ataque ao animal.
- source_word: ይቤላ
  choice: daquele carneiro
  rationale: “Carneiro” segue a leitura contextual adotada, enquanto a possível identificação como bode é preservada em nota.
- source_word: ረዳኢቱ
  choice: o seu auxílio
  rationale: Conserva no texto principal o sentido abstrato de ajuda, sem excluir a possibilidade de um ajudador pessoal.
theological_decisions:
- issue: Identidade histórica das figuras atacantes na visão dos animais
  choice: Manter literalmente pastores, águias, abutres, milhafres, corvos e carneiro.
  alternative: Inserir no texto identificações com governantes, povos ou exércitos históricos.
  rationale: A passagem comunica sua tensão por meio de imagens apocalípticas; explicá-las historicamente no corpo da tradução resolveria uma identificação que o texto não explicita.
- issue: Referente do sujeito plural em “lutaram”
  choice: Preservar o pronome plural sem explicitar se ele se refere especificamente aos corvos ou ao conjunto dos atacantes.
  alternative: Nomear os corvos ou todas as aves como sujeito.
  rationale: A sucessão de sujeitos permite alguma ambiguidade; acrescentar um referente nominal a eliminaria sem apoio suficiente.
- issue: Natureza do socorro solicitado
  choice: Traduzir ረዳኢቱ por “o seu auxílio”.
  alternative: “o seu ajudador”.
  rationale: O substantivo pode indicar tanto ajuda quanto quem ajuda; a leitura principal conserva a abstração, e a nota registra a alternativa pessoal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Continuei olhando até que” reproduz de modo natural a fórmula visionária, e “travaram batalha” conserva a intensificação do par verbal etíope.
