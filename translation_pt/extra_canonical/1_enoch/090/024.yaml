base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/024.yaml
  text: And judgment took place first upon the stars[a], and they were judged and were found to be sinners, and they went to the place of judgment; and they cast them into an abyss, full of fire and flaming[c][b], and full of pillars of fire.
translation:
  language: pt
  text: Primeiro, houve julgamento das estrelas[a]. Elas foram julgadas e consideradas pecadoras; então foram para o lugar de julgamento, e eles as lançaram num abismo cheio de fogo e chamas, e cheio de colunas de fogo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção também pode ser entendida literalmente como “diante das estrelas” ou “na presença das estrelas”. No encadeamento da visão, porém, “primeiro” indica que as estrelas — que representam seres celestiais — são o primeiro grupo submetido a julgamento.
    reason: lexical_alternative
  - marker: b
    text: A repetição de “julgamento” reproduz a linguagem judicial reiterada no texto ge'ez, em vez de substituí-la por “condenação”. O sujeito de “eles as lançaram” não é identificado no versículo.
    reason: cultural_note
lexical_decisions:
- source_word: ኵነኔ
  choice: julgamento
  rationale: Preserva o caráter judicial e escatológico do substantivo sem antecipar o resultado como “condenação”; também permite manter a repetição da raiz ao longo do versículo.
- source_word: ቅድመ እምከዋክብት
  choice: primeiro contra as estrelas
  rationale: No encadeamento narrativo, ቅድመ tem valor sequencial (“primeiro”), enquanto a expressão seguinte identifica as estrelas como o primeiro grupo submetido ao julgamento. “Contra” expressa naturalmente em português o objeto de uma ação judicial adversa.
- source_word: ተኰነኑ
  choice: foram julgadas
  rationale: Mantém a linguagem de processo judicial; a declaração subsequente de que eram pecadoras apresenta separadamente a constatação de culpa.
- source_word: ኃጥኣነ
  choice: pecadoras
  rationale: Conserva a dimensão moral e religiosa do termo e concorda com “estrelas”, personificadas no feminino em português.
- source_word: ሖሩ መካነ ኵነኔ
  choice: foram para o lugar de julgamento
  rationale: Reproduz o movimento concreto da visão e conserva a repetição intencional de “julgamento”.
- source_word: ወደይዎሙ
  choice: foram lançadas
  rationale: O passivo evita um sujeito plural indeterminado potencialmente confuso em português, sem perder a ideia de ação coerciva contra as estrelas.
- source_word: ውስተ ዕሙቅ
  choice: num abismo
  rationale: Comunica uma profundidade punitiva e mantém a força da imagem apocalíptica sem recorrer a um rótulo doutrinário posterior.
- source_word: ምሉእ እሳት ወይላህብ
  choice: cheio de fogo e chamas
  rationale: “Fogo e chamas” é idiomático, vívido e mantém a acumulação de imagens ígneas do ge'ez.
- source_word: አዕማደ እሳት
  choice: colunas de fogo
  rationale: Representa estruturas verticais na cena visionária; “colunas” é claro e corrente em português, sem eliminar a imagem arquitetônica.
theological_decisions:
- issue: Processo judicial ou resultado condenatório
  choice: Manter “julgamento” e “foram julgadas”, seguido de “consideradas pecadoras”.
  alternative: Usar “condenação” e “foram condenadas”.
  rationale: O ge'ez repete a linguagem judicial e declara separadamente a condição pecaminosa. A tradução preserva essa sequência, sem fundir processo e veredito.
- issue: Sentido de ቅድመ እምከዋክብት no contexto da visão
  choice: “primeiro contra as estrelas”
  alternative: “diante das estrelas” ou “na presença das estrelas”
  rationale: 'A sequência narrativa favorece a leitura temporal: as estrelas são o primeiro grupo julgado, antes dos grupos seguintes. A nota registra a possibilidade formal da leitura espacial.'
- issue: Designação do lugar de punição
  choice: Preservar as imagens de abismo, fogo, chamas e colunas de fogo.
  alternative: Traduzir por um termo doutrinário sintético, como “inferno”.
  rationale: A fonte descreve imagens apocalípticas concretas e não emprega aqui um rótulo teológico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a repetição judicial e a intensidade da imagética apocalíptica, evitando tanto arcaísmos desnecessários quanto terminologia doutrinária importada.
