revisions:
- from: E continuei vendo até o tempo em que vinte e três apascentavam; e eles completaram, cada um no seu tempo, cinquenta e oito períodos.[a]
  to: E vi até o tempo em que vinte e três pastoreavam, e eles completaram, cada um em seu tempo, cinquenta e oito períodos.[a]
