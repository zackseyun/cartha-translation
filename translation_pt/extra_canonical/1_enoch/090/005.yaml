base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/005.yaml
  text: And I saw until the time when twenty-three were shepherding[a], and they completed, in their respective times[c][b], fifty-eight times.
translation:
  language: pt
  text: E vi até o tempo em que vinte e três pastoreavam, e eles completaram, cada um em seu tempo, cinquenta e oito períodos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cinquenta e oito tempos”. O termo pode indicar períodos ou intervalos determinados; o texto não especifica sua duração.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: E continuei vendo
  rationale: Mantém a fórmula de relato visionário e, neste contexto, expressa naturalmente a continuidade da visão até o limite temporal indicado.
- source_word: እስከ፡ ዘመን፡ እስከ
  choice: até o tempo em que
  rationale: Reproduz o limite temporal da sequência sem tornar pesada, em português, a repetição de እስከ.
- source_word: ይሬዐዩ
  choice: apascentavam
  rationale: A forma contém ዐ e pertence ao campo de pastorear/apascentar, não ao verbo 'ver' escrito com እ; o contexto dos pastores no Apocalipse dos Animais confirma esse sentido.
- source_word: ፳ወ፫
  choice: vinte e três
  rationale: Tradução direta do numeral ge'ez.
- source_word: ወፈጸሙ
  choice: e eles completaram
  rationale: Conserva o sentido de levar a termo ou perfazer a contagem.
- source_word: በበጊዜሆሙ
  choice: cada um no seu tempo
  rationale: A repetição distributiva በበ- indica que os participantes cumprem suas funções sucessivamente, cada qual em seu período correspondente.
- source_word: ፶ወ፰ጊዜያተ
  choice: cinquenta e oito períodos
  rationale: ጊዜያት pode designar tempos ou períodos contados; 'períodos' é natural em português e evita a impressão de ações repetidas causada por 'vezes', sem definir a duração histórica dessas unidades.
theological_decisions:
- issue: Natureza das unidades numeradas na cronologia do Apocalipse dos Animais
  choice: cinquenta e oito períodos
  alternative: cinquenta e oito vezes; cinquenta e oito tempos; cinquenta e oito períodos de pastoreio
  rationale: A tradução mantém as unidades cronológicas indefinidas. Não as identifica com anos nem com mandatos específicos, preservando a abertura simbólica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Apascentavam' preserva a metáfora pastoril do contexto; 'cada um no seu tempo' comunica de modo natural a força distributiva da expressão ge'ez.
