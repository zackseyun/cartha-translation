  source_fidelity: A identificação de ይሬዐዩ como forma do verbo «pastorear/shepherd» está correta e corrige a antiga confusão com «ver». A tradução de ጊዜያተ por «períodos» preserva adequadamente a natureza não especificada das unidades. Porém, ወርኢኩ é a fórmula simples «E vi», não exige o aspecto continuativo acrescentado em «continuei vendo».
  naturalness: «Apascentavam» é compreensível e de registro elevado, mas «pastoreavam» exprime mais diretamente a atividade dos pastores e evita uma possível leitura transitiva que peça um objeto. «E vi» é mais conciso, natural e fiel à fórmula visionária.
  terminology: «Pastoreavam» mantém o vocabulário pastoril do Apocalipse dos Animais sem interpretar os vinte e três como um grupo histórico específico. «Períodos» é uma escolha apropriada para a contagem de cinquenta e oito unidades, desde que a nota preserve a alternativa literal «tempos».
