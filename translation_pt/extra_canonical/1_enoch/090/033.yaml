base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/033.yaml
  text: And all those that had been scattered and dispersed[a], and all the beasts of the field and all the birds of heaven, were gathered into that house; and the Lord of the sheep rejoiced with great joy[c][b], because they had all become good and had entered into his house.
translation:
  language: pt
  text: E todos os que haviam perecido e sido dispersos[a], todos os animais selvagens e todas as aves do céu reuniram-se naquela casa[b]. E o Senhor das ovelhas alegrou-se com grande alegria, porque todos eles se haviam tornado bons e tinham entrado em sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O primeiro verbo também pode significar “haviam sido destruídos” ou “haviam se perdido”; o segundo descreve os que foram dispersos. A tradução mantém distintos os dois aspectos.
    reason: lexical_alternative
  - marker: b
    text: “Naquela casa” e, depois, “sua casa” pertencem à imagem da morada restaurada nesta visão e podem evocar o templo, não apenas uma construção comum.
    reason: cultural_note
lexical_decisions:
- source_word: ተሐጕሉ
  choice: haviam perecido
  rationale: O verbo, de ሐጕለ, pode exprimir perecer, ser destruído ou perder-se. Aqui, distingui-lo do verbo seguinte preserva a sequência de ruína e dispersão e evita transformar os dois verbos em sinônimos.
- source_word: ተዘርዘሩ
  choice: sido dispersos
  rationale: Expressa dispersão ou espalhamento; a forma passiva mantém o estado anterior descrito no ge'ez.
- source_word: አራዊተ ገዳም
  choice: animais selvagens
  rationale: Representa naturalmente os animais não domesticados associados ao campo, ermo ou deserto, sem especificar indevidamente um terreno.
- source_word: አዕዋፈ ሰማይ
  choice: aves do céu
  rationale: Mantém de perto a fórmula elevada e imagética do texto apocalíptico.
- source_word: ተጋብኡ
  choice: reuniram-se
  rationale: O plural verbal pode ser vertido de modo natural como reunião coletiva, sem explicitar um agente não mencionado.
- source_word: በውእቱ ቤት
  choice: naquela casa
  rationale: Com o verbo de reunião, a frase indica o lugar ou destino da reunião; 'naquela casa' é natural em português e mantém o demonstrativo.
- source_word: እግዚኦሙ ለአባግዕ
  choice: o Senhor das ovelhas
  rationale: Conserva o título simbólico recorrente da visão e seu registro teológico elevado.
- source_word: ተፈሥሐ ዐቢየ ፍሥሐ
  choice: alegrou-se com grande alegria
  rationale: Preserva a construção cognata e sua forte intensificação, em vez de reduzi-la a um simples advérbio.
- source_word: ኄራነ
  choice: bons
  rationale: Mantém o sentido amplo de bondade ou condição restaurada, sem impor o termo teológico mais específico 'justos'.
- source_word: ገብኡ ውስተ ቤቱ
  choice: tinham entrado em sua casa
  rationale: Expressa a entrada já consumada e conserva a referência possessiva ao Senhor das ovelhas.
theological_decisions:
- issue: Sentido de ተሐጕሉ e possível motivo de restauração dos que pereceram
  choice: haviam perecido
  alternative: haviam sido espalhados
  rationale: A raiz admite o campo semântico de perecer, ser destruído ou perder-se, enquanto o verbo seguinte já comunica dispersão. A tradução conserva a distinção lexical e a possível tensão narrativa, sem acrescentar explicitamente 'ressuscitados'.
- issue: Referente de 'o Senhor das ovelhas'
  choice: Manter o título simbólico 'o Senhor das ovelhas'
  alternative: o senhor delas / o dono das ovelhas
  rationale: A expressão funciona como designação divina recorrente na alegoria animal; conservar a imagem evita achatar o simbolismo.
- issue: Natureza da transformação em ኄራነ
  choice: bons
  alternative: justos
  rationale: '''Bons'' preserva a amplitude moral e restauradora do termo sem convertê-lo em categoria teológica técnica.'
- issue: Sentido da casa
  choice: Preservar 'naquela casa' e 'sua casa' no texto, com esclarecimento em nota
  alternative: templo restaurado
  rationale: O texto mantém deliberadamente a linguagem simbólica de casa; identificá-la diretamente como templo no corpo da tradução resolveria uma imagem que deve permanecer aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se o paralelismo, o título apocalíptico e a repetição enfática 'alegrou-se com grande alegria'. Os marcadores [a] e [b] aparecem no texto principal em ordem.
