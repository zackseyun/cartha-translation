base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/030.yaml
  text: And I saw all the sheep that were left[a], and every beast that was upon the earth, and all the birds of heaven, falling down and bowing to those sheep, and making petition to them[b], and obeying them in every word.
translation:
  language: pt
  text: E vi todas as ovelhas que haviam restado; e todos os animais que estavam sobre a terra e todas as aves do céu se prostravam e se curvavam diante daquelas ovelhas, faziam-lhes súplicas e obedeciam a cada palavra delas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo traduzido por “obedeciam” significa literalmente “ouviam”. Neste contexto de prostração e súplica, pode ter o sentido de dar ouvidos ou obedecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: E vi
  rationale: Mantém a primeira pessoa do relato visionário e traduz de modo natural o verbo de percepção, incluindo o sufixo de objeto retomado pelas ovelhas.
- source_word: ኵሎሙ አባግዕ እለ ተርፉ
  choice: todas as ovelhas que haviam restado
  rationale: Preserva a ideia de remanescente sem especificar indevidamente a natureza de sua sobrevivência.
- source_word: ኵሉ እንስሳ ዘዲበ ምድር
  choice: todos os animais que estavam sobre a terra
  rationale: Reproduz a expressão espacial do ge'ez em linguagem clara; “animais” é natural em português e continua adequado ao simbolismo da visão.
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: todas as aves do céu
  rationale: Conserva a dicção bíblica e apocalíptica da expressão.
- source_word: ይወድቁ ወይሰግዱ
  choice: se prostravam e se curvavam
  rationale: Expressa os dois gestos corporais de submissão sem introduzir o sentido teológico mais específico de “adorar”.
- source_word: ለእልኩ አባግዕ
  choice: diante daquelas ovelhas
  rationale: O demonstrativo retoma as ovelhas remanescentes, e “diante de” comunica naturalmente a direção da prostração.
- source_word: ያስተበቍዕዎሙ
  choice: faziam-lhes súplicas
  rationale: Preserva o sentido de petição insistente e o tom solene da cena.
- source_word: ይሰምዕዎሙ በኵሉ ቃል
  choice: obedeciam a cada palavra delas
  rationale: No contexto de prostração e súplica, “ouvir” assume provavelmente o sentido de dar ouvidos ou obedecer; “a cada palavra” mantém a formulação concreta do ge'ez.
theological_decisions:
- issue: Se a submissão dos animais e das aves às ovelhas deve ser descrita como adoração
  choice: Apresentá-la como prostração, reverência, súplica e obediência
  alternative: Traduzir o gesto explicitamente como “adoravam aquelas ovelhas”
  rationale: A sequência indica submissão abrangente, mas o texto não exige o termo teologicamente mais forte “adorar”. A formulação escolhida preserva a tensão da imagem sem impor uma categoria posterior.
- issue: Relação sintática entre as ovelhas, os animais e as aves
  choice: Tratar “todas as ovelhas” como objeto de “vi” e os animais e as aves como sujeitos dos verbos seguintes, usando ponto e vírgula para clareza
  alternative: Tratar ovelhas, animais e aves como uma única série de objetos de “vi”
  rationale: A marcação do objeto no ge'ez recai sobre as ovelhas, enquanto animais e aves aparecem sem essa marca e governam os verbos de prostração, súplica e obediência.
translation_notes:
  register: Português moderno, claro e solene, com dicção bíblico-apocalíptica moderada. O ponto e vírgula evita que animais e aves sejam lidos como parte do objeto direto de “vi” e torna explícita a estrutura sintática do ge'ez.
