base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/007.yaml
  text: And they cried out to them[a], but they did not heed their words; rather, they were exceedingly deaf[c][b], and their eyes were exceedingly blinded.
translation:
  language: pt
  text: E eles clamaram a elas, mas elas não deram ouvidos às suas palavras; pelo contrário, estavam extremamente surdas[a], e os olhos delas estavam extremamente cegados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O etíope repete o intensificador “extremamente” tanto com a surdez quanto com a cegueira dos olhos, ressaltando sua total insensibilidade.
    reason: lexical_alternative
  - marker: b
    text: Nesta visão, a surdez e a cegueira provavelmente têm sentido moral e espiritual; a tradução, porém, conserva a linguagem sensorial concreta do etíope.
    reason: cultural_note
lexical_decisions:
- source_word: አስርኅዎሙ
  choice: clamaram a elas
  rationale: O verbo indica um clamor em voz alta; a forma tem sujeito na terceira pessoa do plural e objeto também na terceira pessoa do plural. No contexto da visão, os referentes são apresentados como ovelhas, por isso o português emprega o feminino.
- source_word: ኢያጽምኡ ነገሮሙ
  choice: não deram ouvidos às suas palavras
  rationale: Expressa que não ouviram ou não atenderam às palavras deles. A formulação preserva a recusa culpável sugerida pelo contexto sem tornar explícita a ideia mais forte de desobediência.
- source_word: ፈድፋደ
  choice: extremamente
  rationale: O advérbio intensifica tanto a surdez quanto a cegueira e aparece duas vezes no texto etíope; a repetição foi mantida.
- source_word: ተጸመሙ
  choice: estavam surdas
  rationale: Conserva a imagem concreta de surdez e lê a forma como descrição de estado, sem acrescentar a interpretação de endurecimento espiritual.
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: seus olhos ficaram extremamente cegos
  rationale: A construção descreve os olhos como privados de visão ou obscurecidos. 'Ficaram cegos' mantém a força da imagem e comunica naturalmente a mudança de condição.
- source_word: ተወንየሉ
  choice: pelo contrário
  rationale: 'Marca a progressão adversativa após a recusa em ouvir: em vez de atenderem, revelaram extrema surdez e cegueira.'
theological_decisions:
- issue: Se a surdez e a cegueira devem ser explicitamente interpretadas como insensibilidade espiritual culpável
  choice: 'Manter a linguagem sensorial concreta: não deram ouvidos, estavam surdas e seus olhos ficaram cegos.'
  alternative: Explicitar que estavam espiritualmente endurecidas e desobedientes.
  rationale: A visão provavelmente atribui força moral e espiritual às imagens corporais, mas a tradução não resolve a metáfora em uma paráfrase doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O feminino plural acompanha as ovelhas do contexto imediato. A repetição enfática do original foi preservada.
