base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/027.yaml
  text: And I saw those sheep while they were burning[a], and their bones were burning.
translation:
  language: pt
  text: E vi aquelas ovelhas enquanto ardiam[a], e os ossos delas ardiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O etíope repete “ardiam” tanto para as ovelhas como para os ossos delas, intensificando a severidade da visão; a repetição foi preservada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢክዎሙ
  choice: vi aquelas
  rationale: O verbo de visão está na primeira pessoa e leva sufixo de objeto; em português, o objeto é expresso naturalmente junto ao sintagma nominal seguinte.
- source_word: እልኩ አባግዕ
  choice: aquelas ovelhas
  rationale: Preserva o demonstrativo e a imagem simbólica estabelecida das ovelhas no Apocalipse dos Animais.
- source_word: እንዘ ይውዕዩ
  choice: enquanto ardiam
  rationale: A construção indica uma ação simultânea e em curso na visão, sem decidir além do texto se os animais ardiam ou eram queimados por um agente expresso.
- source_word: አዕፅምቲሆሙ
  choice: os ossos delas
  rationale: Mantém o termo anatômico concreto e concorda com o referente feminino 'ovelhas' em português.
- source_word: ይውዕዩ
  choice: ardiam
  rationale: Repete o mesmo verbo da oração anterior, preservando a intensificação severa da imagem.
theological_decisions:
- issue: Se a imagem de juízo deve ser suavizada como destruição genérica
  choice: Manter explicitamente a imagem de queimar
  alternative: eram destruídas / eram consumidas
  rationale: A repetição do fogo, estendida até aos ossos, constitui a força da cena visionária; generalizá-la apagaria a tensão do texto apocalíptico.
- issue: Se o verbo deve ser vertido explicitamente na voz passiva
  choice: Usar a forma intransitiva 'ardiam'
  alternative: estavam sendo queimadas
  rationale: A forma portuguesa escolhida preserva a ambiguidade quanto à atuação de um agente, sem impor uma voz passiva mais definida do que a evidência apresentada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva-se a coordenação simples e repetitiva própria da narração visionária.
