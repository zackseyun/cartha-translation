base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/017.yaml
  text: And I saw until that man[a], who was writing a book by the word of the Lord, opened that book of destruction which those twelve shepherds had wrought[e][d][c][b], and he showed before the Lord of the sheep that they had destroyed much more than those before them.
translation:
  language: pt
  text: E continuei olhando, até que aquele homem[a], que escrevia um livro pela palavra do Senhor, abriu aquele livro de destruição que os doze pastores haviam causado[b]; e mostrou diante do Senhor das ovelhas[c] que eles haviam destruído muito mais do que os que vieram antes deles[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A visão o chama simplesmente de “homem”; o termo não especifica aqui se ele é um anjo ou escriba celestial.
    reason: cultural_note
  - marker: b
    text: 'O etíope é difícil. Mais literalmente: “o livro de destruição que aqueles doze pastores haviam destruído”. O sentido provável é o livro que registra a destruição causada por eles.'
    reason: textual_variant
  - marker: c
    text: “Senhor das ovelhas” é o título usado pela própria visão dentro de seu simbolismo animal.
    reason: cultural_note
  - marker: d
    text: Isto é, mais do que os pastores que os precederam. Outra interpretação contextual entende que eles destruíram além do limite que lhes havia sido atribuído.
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢክዎ ... እስከ
  choice: E continuei olhando, até que
  rationale: Preserva a fórmula visionária com እስከ (“até que”) e expressa em português natural a continuidade implícita da visão.
- source_word: ብእሲ
  choice: homem
  rationale: O termo significa normalmente “homem” ou “ser humano”; evita identificar interpretativamente a figura como anjo.
- source_word: ዘይጽሕፍ መጽሐፈ
  choice: que escrevia um livro
  rationale: Mantém a ação em curso e a imagem concreta do registro escrito.
- source_word: በቃለ እግዚአ
  choice: pela palavra do Senhor
  rationale: Conserva a formulação solene e sua possível nuance de autorização ou ordem.
- source_word: ፈትሖ ለውእቱ መጽሐፈ
  choice: abriu aquele livro
  rationale: Traduz diretamente o verbo sem acrescentar a ideia não explícita de romper um selo.
- source_word: መጽሐፈ ሐጕል
  choice: livro de destruição
  rationale: Reproduz o sentido de destruição ou ruína sem recorrer a terminologia teológica posterior.
- source_word: ዘአሕጐሉ እልኩ ፲ወ፪የአቱ ይኃርያን
  choice: que os doze pastores haviam causado
  rationale: Liga o livro à destruição produzida pelos doze pastores, evitando a leitura pouco natural de que teriam destruído o próprio livro.
- source_word: አርአዩ
  choice: mostrou
  rationale: O singular retoma naturalmente o homem que escrevia e preserva a força demonstrativa da cena de julgamento.
- source_word: ፈድፋደ እምቅድሜሆሙ
  choice: muito mais do que os que vieram antes deles
  rationale: Segue o valor literal de “mais do que os anteriores a eles”, sem interpolar uma ordem ou medida não expressa no texto.
- source_word: ቅድመ እግዚአ አባግዕ
  choice: diante do Senhor das ovelhas
  rationale: Mantém o título próprio da visão dos animais e seu universo simbólico.
theological_decisions:
- issue: Identidade do homem que escreve
  choice: aquele homem
  alternative: aquele anjo; aquele escriba celestial
  rationale: O ge'ez diz “homem”. A tradução não define sua natureza celestial de modo mais específico que a fonte.
- issue: Relação entre o livro e a destruição dos pastores
  choice: livro de destruição que os doze pastores haviam causado
  alternative: livro de destruição que os doze pastores haviam destruído
  rationale: A construção etíope é difícil. A opção principal entende que o livro registra a destruição causada por eles; a alternativa literal é documentada em nota.
- issue: Referência da comparação final
  choice: mais do que os que vieram antes deles
  alternative: além do limite que lhes fora determinado
  rationale: እምቅድሜሆሙ aponta literalmente para os predecessores. A leitura de excesso de mandato é contextual, mas não deve substituir a formulação da fonte.
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência visionária. “Continuei olhando, até que” preserva a fórmula narrativa sem produzir o português truncado de uma tradução excessivamente literal. Os marcadores aparecem no texto em ordem alfabética.
