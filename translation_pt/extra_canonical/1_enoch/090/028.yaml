base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/028.yaml
  text: And I stood watching until that old house was folded up[a]; and they carried out all the pillars, and all the beams and ornaments of that house were folded up with it[c][b], and they carried it out and set it down in one place in the south of the land.
translation:
  language: pt
  text: E permaneci de pé, observando, até que aquela casa velha foi dobrada[a]; então retiraram todas as colunas, e todas as plantas e vigas daquela casa foram dobradas junto com ela[b]. Depois, levaram-na para fora e a depositaram num lugar ao sul da terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “foi enrolada” ou “foi desmontada”. A imagem é de uma estrutura recolhida e removida, não apenas destruída.
    reason: lexical_alternative
  - marker: b
    text: A construção etíope associa “todas as plantas e vigas” ao verbo “foram dobradas”; “todas as colunas” é o objeto de “retiraram”. O termo traduzido por “plantas” também pode referir-se a vegetação ou plantações.
    reason: textual_grammar_and_lexical_alternative
  - marker: c
    text: Literalmente, “à direita da terra”. Na linguagem direcional de estilo bíblico, a direita, quando se olha para o leste, frequentemente indica o sul.
    reason: lexical_alternative
lexical_decisions:
- source_word: ቆምኩ አርእይ
  choice: fiquei observando
  rationale: 'Reproduz naturalmente a fórmula visionária continuativa: Enoque permanece atento ao desenrolar da visão.'
- source_word: ተጠወም / ተጠውሙ
  choice: foi dobrada / foram dobradas
  rationale: Conserva a imagem apocalíptica concreta e a repetição do verbo, sem reduzi-la a simples destruição.
- source_word: ቤት ብሉይ
  choice: casa velha
  rationale: Traduz diretamente os termos e permite que a possível ressonância de templo surja do contexto, sem inseri-la no texto.
- source_word: አውፅእዎሙ
  choice: retiraram
  rationale: Expressa o causativo de fazer sair/remover e se ajusta à retirada física das colunas.
- source_word: አዕማድ
  choice: colunas
  rationale: Termo arquitetônico claro e corrente em português.
- source_word: አትክልት
  choice: plantas
  rationale: Mantém o sentido lexical comum e a estranheza da imagem, evitando interpretar o termo como ornamentos.
- source_word: ሤስ
  choice: vigas
  rationale: Designa naturalmente elementos estruturais de madeira e se harmoniza com as colunas.
- source_word: ምስሌሁ
  choice: junto com ela
  rationale: Indica que esses elementos foram dobrados juntamente com a própria casa.
- source_word: ወወደይዎ
  choice: a depositaram
  rationale: Preserva a ação física de colocar o objeto em determinado local depois de levá-lo para fora.
- source_word: በ፪መካን
  choice: num lugar
  rationale: Representa um único local sem tornar a frase portuguesa artificial.
- source_word: በየማነ ምድር
  choice: ao sul da terra
  rationale: Usa o valor direcional idiomático de 'à direita' em orientação voltada para o leste, preservando a leitura literal em nota.
theological_decisions:
- issue: Possível ressonância de templo na expressão 'casa velha'
  choice: casa velha
  alternative: templo antigo
  rationale: O texto emprega o termo genérico 'casa'. A tradução não explicita uma identificação teológica que a própria visão deixa a cargo do contexto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A repetição de “dobrada” e a referência inesperada a “plantas” foram mantidas para preservar a imagem e a ambiguidade do ge'ez.
