base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/022.yaml
  text: And he said to that man who was writing before him[a], who was one of those seven white ones, and he said to him, “Take those seventy shepherds to whom I delivered the sheep; and they, taking them[c][b], killed many more than I commanded them.”
translation:
  language: pt
  text: 'E ele disse àquele homem que escrevia diante dele — um daqueles sete seres vestidos de branco — e lhe disse: “Leve estes setenta pastores, aos quais confiei as ovelhas[a]; e eles, tendo-os tomado, mataram muitas mais do que eu lhes havia ordenado[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos quais entreguei as ovelhas”. O verbo pode destacar a entrega de algo aos cuidados e à responsabilidade de outra pessoa.'
    reason: lexical_alternative
  - marker: b
    text: A expressão indica que os pastores ultrapassaram o limite do que lhes havia sido ordenado, não necessariamente que agiram sem ordem alguma.
    reason: alternative_reading
lexical_decisions:
- source_word: ብእሲ
  choice: homem
  rationale: O substantivo designa normalmente uma figura humana masculina e preserva a forma antropomórfica do escriba celestial na visão.
- source_word: ዘይጽሕፍ
  choice: que escrevia
  rationale: A forma relativa imperfectiva admite uma ação em curso no passado; esta formulação é natural no contexto narrativo.
- source_word: በቅድሜሁ
  choice: diante dele
  rationale: Mantém tanto o sentido espacial de estar à frente quanto a possível nuance de presença numa cena de tribunal.
- source_word: ፯እምነ ዝኩ ፯ጻዕዳው
  choice: um daqueles sete seres vestidos de branco
  rationale: Conserva a identificação do escriba com o grupo celestial e o simbolismo da cor, evitando a expressão pouco natural e potencialmente racializada “sete brancos” em português moderno.
- source_word: ንሥኦሙ
  choice: Leve
  rationale: O imperativo pode significar tomar, levar ou apreender. “Leve” preserva a ordem judicial sem explicitar indevidamente o modo de custódia.
- source_word: ፸ኖሎት
  choice: setenta pastores
  rationale: Preserva a metáfora estruturante do Apocalipse dos Animais, sem identificar interpretativamente os pastores como anjos ou governantes.
- source_word: መጠውክዎሙ
  choice: confiei
  rationale: Expressa a entrega das ovelhas ao cuidado e à responsabilidade dos pastores; a nota registra a alternativa mais concreta “entreguei”.
- source_word: አባግዐተ
  choice: as ovelhas
  rationale: Mantém a imagem simbólica recorrente em vez de substituí-la pelo coletivo “rebanho”.
- source_word: ነሢኦሙ ቀተሉ
  choice: tomando-as sob seu cuidado, mataram
  rationale: Representa a sequência participial seguida do verbo finito e torna inteligível em português que o pronome retoma as ovelhas confiadas aos pastores.
- source_word: ብዙኃነ እምዘ አዘዝክዎሙ
  choice: mataram muito mais do que eu lhes havia ordenado
  rationale: Comunica excesso quantitativo em relação à ordem recebida, preservando a culpabilidade dos agentes por ultrapassarem o limite.
theological_decisions:
- issue: Identidade dos setenta pastores
  choice: Manter o título simbólico “setenta pastores” sem explicação no texto principal.
  alternative: “setenta anjos” ou “setenta governantes”
  rationale: A visão emprega deliberadamente imagens pastoris e animais; explicitar uma identidade achataria a retórica apocalíptica e resolveria uma questão interpretativa.
- issue: Alcance da ordem relativa à morte das ovelhas
  choice: Indicar que os pastores excederam uma ordem real.
  alternative: “mataram sem que eu lhes tivesse ordenado”
  rationale: A construção em ge’ez indica mais naturalmente que mataram além do limite ordenado, não que agiram sem qualquer autorização. Assim se preserva a tensão entre comissão e abuso da autoridade delegada.
- issue: Repetição da fórmula de fala
  choice: Preservar “e ele disse... e lhe disse”.
  alternative: Suprimir a segunda fórmula para obter uma frase mais fluida.
  rationale: O texto contém uma retomada explícita do verbo de fala depois da oração que identifica o escriba; mantê-la conserva a sintaxe narrativa enfática do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição da fórmula de fala foi mantida por fidelidade ao ge’ez. “Seres vestidos de branco” evita a estranheza e a possível leitura racial de “os sete brancos”, sem converter explicitamente as figuras em anjos. A pontuação destaca a oração identificadora sem eliminar sua função narrativa.
