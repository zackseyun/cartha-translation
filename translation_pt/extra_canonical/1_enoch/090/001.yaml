base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/001.yaml
  text: And I saw until the time when thirty-seven shepherds were pasturing in this way[a], and they all completed their periods, each in its time, like the former ones; and others received them into their hands, to pasture them in their times[c][b], each shepherd in its time.
translation:
  language: pt
  text: E eu vi até o tempo em que trinta e sete pastores apascentavam desse modo[a]. Todos eles completaram seus períodos, cada qual no seu tempo, como os anteriores; e outros os receberam em suas mãos para apascentá-los nos seus respectivos tempos[b][c], cada pastor no seu tempo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até aquele tempo, enquanto trinta e sete pastores apascentavam desse modo”. A construção temporal do ge''ez é compacta.'
    reason: previous_rendering
  - marker: b
    text: A cláusula da passagem de responsabilidade é um tanto condensada no ge'ez; o sentido parece ser que um grupo termina seu período e outro recebe sucessivamente o encargo de apascentar.
    reason: textual_variant
  - marker: c
    text: A repetição de “tempo” destaca períodos distintos de atuação para cada pastor, não uma atividade de duração indefinida.
    reason: cultural_note
lexical_decisions:
- source_word: ወርኢኩ
  choice: E eu vi
  rationale: Preserva a fórmula narrativa da visão e a ligação com o contexto anterior.
- source_word: እስከ ዘመን ዘከመዝ
  choice: até o tempo em que ... desse modo
  rationale: Mantém tanto a progressão temporal de እስከ ዘመን quanto a força demonstrativa de ከመዝ, que remete ao modo de apascentar já descrito.
- source_word: ይርዕዩ
  choice: apascentavam
  rationale: Conserva a imagem concreta dos pastores e do rebanho, central à alegoria animal.
- source_word: ፴ወ፯ ኖላዊያን
  choice: trinta e sete pastores
  rationale: Escreve o numeral por extenso para fluidez literária e mantém a figura alegórica sem explicá-la como anjos, governantes ou supervisores.
- source_word: ፈጸሙ ኵሎሙ በበጊዜሆሙ
  choice: Todos eles completaram seus períodos, cada qual no seu tempo
  rationale: Expressa a conclusão sucessiva dos períodos atribuídos, suprindo de maneira moderada o objeto temporal implícito.
- source_word: ከመ ቀዳማዊያን
  choice: como os anteriores
  rationale: Retoma naturalmente os pastores previamente mencionados.
- source_word: በዐዳን ተመጠውዎሙ ውስተ እደዊሆሙ
  choice: outros os receberam em suas mãos
  rationale: Preserva a imagem da entrega nas mãos e não elimina a construção comprimida do ge'ez.
- source_word: ከመ ይርዐይዎሙ በበጊዜሆሙ
  choice: para apascentá-los nos seus respectivos tempos
  rationale: Mantém a oração de finalidade e explicita de modo natural a distribuição sucessiva dos tempos.
- source_word: ኵሉ ኖላዊ በጊዜሁ
  choice: cada pastor no seu tempo
  rationale: Conserva a expressão distributiva que ressalta a sucessão dos encargos.
theological_decisions:
- issue: Natureza dos “pastores”
  choice: pastores, sem expansão interpretativa
  alternative: anjos, governantes ou supervisores
  rationale: O texto apresenta esses agentes por meio da imagem alegórica. A tradução preserva a imagem e a tensão interpretativa, sem identificar sua referência no corpo do versículo.
- issue: Caráter dos períodos de atuação
  choice: períodos e tempos distribuídos sucessivamente
  alternative: mandatos explicitamente “designados” ou “decretados”
  rationale: A repetição temporal sugere períodos delimitados, mas a tradução evita acrescentar uma qualificação teológica que o versículo não declara expressamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Apascentar” foi mantido por ser corrente no registro bíblico e preservar a alegoria pastoral. A pontuação divide o período longo sem apagar sua estrutura cumulativa.
