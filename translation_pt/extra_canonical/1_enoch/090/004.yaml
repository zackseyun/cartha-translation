base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/004.yaml
  text: And I saw until those sheep were devoured by the dogs and by the eagles and by the kites[a], and they left them no flesh at all, nor skin, nor sinew, until only their bones stood there; and even their bones fell upon the earth[e][d][c][b], and the sheep became few.
translation:
  language: pt
  text: E vi até que aquelas ovelhas foram devoradas pelos cães, pelas águias e pelos milhafres[a]. Eles não lhes deixaram carne alguma, nem pele, nem tendão, até que somente seus ossos ficaram de pé; e até seus ossos caíram por terra[b], e as ovelhas se tornaram poucas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido como “milhafres” pode designar de modo mais amplo algum tipo de gavião ou outra ave de rapina.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quanto aos seus ossos, caíram por terra”. A partícula ge’ez pode marcar ênfase ou contraste; no contexto, “até seus ossos” expressa o clímax da devastação.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ተበልዑ
  choice: foram devoradas
  rationale: O passivo e o contexto predatório pedem um verbo forte; “devoradas” conserva a brutalidade da visão.
- source_word: አክልብት
  choice: cães
  rationale: Mantém o termo animal comum e literal dentro do simbolismo da visão.
- source_word: አንስርት
  choice: águias
  rationale: É a identificação tradicional mais provável; não há evidência suficiente para substituí-la por outra ave de rapina no texto principal.
- source_word: ሆባይ
  choice: milhafres
  rationale: Designa uma ave de rapina distinta da anterior e corresponde de modo natural ao provável referente, embora a espécie exata permaneça incerta.
- source_word: ኢኃደጉ ሎሙ ሥጋ ግሙራ
  choice: não lhes deixaram carne alguma
  rationale: Expressa a negação completa; ግሙራ intensifica a ausência, em vez de qualificar a carne como “inteira”.
- source_word: ማእሰ
  choice: pele
  rationale: É o equivalente português mais imediato e natural na imagem de animais devorados.
- source_word: ሥርወ
  choice: tendão
  rationale: Conserva a sequência anatômica e é mais corrente no português moderno do que “nervo” ou “ligamento” neste contexto.
- source_word: ቆሙ ባሕቲቶ አዕፅምቲሆሙ
  choice: somente seus ossos ficaram de pé
  rationale: Preserva a imagem visual incomum e vívida do ge’ez, sem reduzi-la simplesmente a “restaram”.
- source_word: ወአዕፅምቲሆሙሰ ወደቁ ዲበ ምድር
  choice: e até seus ossos caíram por terra
  rationale: '“Até” transmite o clímax enfático: depois de permanecerem de pé, os próprios ossos também caem.'
- source_word: ወንእሱ አባግዕ
  choice: e as ovelhas se tornaram poucas
  rationale: Segue de perto a formulação simples e abrupta da redução numérica no texto-fonte.
theological_decisions:
- issue: Imagens animais simbólicas narradas literalmente
  choice: Manter no texto principal cães, águias, milhafres e ovelhas.
  alternative: Substituir os animais por interpretações como povos, governantes, exércitos ou Israel.
  rationale: A visão comunica seu sentido por meio de uma alegoria animal contínua; traduzi-la interpretativamente apagaria sua forma literária e resolveria além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação repetida e a imagem áspera dos ossos foram preservadas para manter o ritmo e a força da visão apocalíptica.
