base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/036.yaml
  text: And I saw that that house became great and broad and exceedingly full[a][b][c].
translation:
  language: pt
  text: E vi que aquela casa se tornou grande, ampla e extremamente cheia[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No Apocalipse dos Animais, “casa” pode simbolizar o santuário ou templo; contudo, o texto ge'ez deste versículo diz simplesmente “casa”.
    reason: cross_reference
  - marker: b
    text: O texto não declara aqui do que a casa estava cheia. Pelo contexto anterior, provavelmente se refere às ovelhas, mas a tradução preserva a expressão sem complemento.
    reason: source_ambiguity
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: Preserva a fórmula visionária em primeira pessoa e a cadência narrativa sem recorrer a linguagem arcaica.
- source_word: ከመ ኮነ
  choice: se tornou
  rationale: Expressa mudança de estado na visão, em vez de uma condição meramente estática.
- source_word: ውእቱ ቤት
  choice: aquela casa
  rationale: Representa o demonstrativo e mantém o sentido lexical direto de 'casa', sem especificá-la no texto principal como templo ou santuário.
- source_word: ዐቢየ
  choice: grande
  rationale: Conserva tanto a dimensão espacial quanto a possível conotação elevada da imagem.
- source_word: ወርኂበ
  choice: ampla
  rationale: Comunica largura ou espaçosidade em português natural e forma um paralelo fluente com 'grande'.
- source_word: ወምሉአ
  choice: e cheia
  rationale: Trata o termo como adjetivo predicativo coordenado com 'grande' e 'ampla', conforme a sintaxe da oração.
- source_word: ፈድፋደ
  choice: extremamente
  rationale: Interpreta corretamente o termo como advérbio intensificador de 'cheia', e não como o substantivo 'abundância'.
theological_decisions:
- issue: Se ቤት deve ser traduzido de modo mais específico como 'templo' no contexto do Apocalipse dos Animais
  choice: casa
  alternative: templo ou santuário
  rationale: Embora o contexto simbólico possa apontar para o templo ou santuário restaurado, o texto ge'ez diz simplesmente 'casa'; a tradução mantém essa abertura e registra a identificação contextual em nota.
- issue: Objeto implícito de 'cheia'
  choice: não explicitar no texto principal
  alternative: cheia de ovelhas
  rationale: O contexto anterior pode fornecer as ovelhas como referente, mas este versículo não repete o complemento; preserva-se a formulação elíptica da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação simples preserva a cadência visionária. 'Extremamente cheia' reproduz a função adverbial de ፈድፋደ e evita a leitura sintaticamente inadequada 'cheia de abundância'.
