base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/008.yaml
  text: And I saw in the vision that ravens flew down upon those lambs[b][a], and they seized one of those lambs and dashed the sheep to pieces and devoured them.
translation:
  language: pt
  text: E vi, na visão, que corvos desceram sobre aqueles cordeiros[a] e agarraram um deles. Então despedaçaram as ovelhas e as devoraram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O etíope emprega aqui um termo que pode designar cordeiros ou membros jovens do rebanho e depois usa outro termo para “ovelhas”; a tradução preserva essa mudança de vocabulário.
    reason: lexical_alternative
  - marker: b
    text: 'Embora primeiro seja agarrado um só cordeiro, o texto etíope passa depois ao plural: “despedaçaram as ovelhas e as devoraram”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወርኢኩ፡ በራእይ
  choice: E vi, na visão
  rationale: Preserva a fórmula de relato visionário em primeira pessoa e a continuidade desta sequência de visões, em português natural.
- source_word: ቋዓተ
  choice: corvos
  rationale: Mantém a espécie de ave predadora indicada pelo texto e sua função concreta na simbologia animal.
- source_word: ከመ፡ ሰረሩ፡ ዲበ
  choice: desceram voando sobre
  rationale: Expressa o movimento hostil vindo de cima e conserva explicitamente a imagem aviária, sem intensificá-la para um mergulho rasante inequívoco.
- source_word: እልክቱ፡ መዓስእ
  choice: aqueles cordeiros
  rationale: Representa os membros menores ou mais jovens do rebanho e preserva a possível distinção em relação a አባግዕ, traduzido depois como 'ovelhas'.
- source_word: ወአኀዝዎ፡ ለአሐዱ፡ እምዝኩ፡ መዓስእ
  choice: e agarraram um deles
  rationale: Indica claramente que os corvos tomaram um indivíduo dentre os cordeiros; 'agarraram' comunica a ação predatória com naturalidade.
- source_word: ወቀጥቀጥዎሙ፡ ለአባግዕ
  choice: Então despedaçaram as ovelhas
  rationale: O verbo reduplicado descreve violência intensa; 'despedaçaram' preserva essa força, enquanto 'ovelhas' reflete a mudança lexical do etíope.
- source_word: ወበልዕዎሙ
  choice: e as devoraram
  rationale: Mantém a imagem vívida de predação e concorda com o referente plural feminino 'ovelhas'.
theological_decisions:
- issue: Interpretação da simbologia animal
  choice: Conservar literalmente corvos, cordeiros e ovelhas
  alternative: Substituir os animais pelos povos, governantes ou grupos que possam simbolizar
  rationale: A visão comunica seu sentido por meio de uma alegoria animal contínua. A tradução deve preservar a imagem textual e não incorporar uma interpretação histórica ou doutrinária ao corpo do versículo.
- issue: Oscilação entre um cordeiro agarrado e o plural das ovelhas atacadas
  choice: Preservar a mudança de número tal como aparece no testemunho etíope
  alternative: Harmonizar toda a ação no singular ou fazer dos cordeiros, sem distinção, o objeto de todos os verbos
  rationale: O texto primeiro destaca um cordeiro, mas depois emprega formas plurais para as ovelhas e para os pronomes verbais. Essa tensão deve permanecer visível, não ser corrigida silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem interpretar os símbolos. Os marcadores [a] e [b] aparecem no texto principal.
