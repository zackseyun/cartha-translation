base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/012.yaml
  text: And those ravens fought and battled with him[a], and they wanted to remove his horn[c][b], but they did not prevail against him.
translation:
  language: pt
  text: E aqueles corvos lutaram e combateram contra ele[a]; queriam remover seu chifre[b][c], mas não prevaleceram contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com ele”. A preposição ge'ez significa literalmente “com”, mas o contexto descreve um conflito hostil.
    reason: lexical_alternative
  - marker: b
    text: “Chifre” foi mantido literalmente como parte da imagem simbólica da visão, em vez de ser interpretado como “poder” ou “força”.
    reason: cultural_note
  - marker: c
    text: Ou “tirar” ou “retirar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: እልኩ፡ ቋዓት
  choice: aqueles corvos
  rationale: Preserva concretamente a espécie de ave da visão simbólica, em vez de generalizá-la como “aves”.
- source_word: ይትጋደሉ፡ ወይትባአሱ
  choice: lutaram e combateram
  rationale: Mantém os dois verbos coordenados e sua intensificação repetitiva, com linguagem portuguesa natural.
- source_word: ምስሌሁ
  choice: contra ele
  rationale: Embora a preposição tenha sentido básico de “com”, o contexto verbal é de confronto hostil; a nota conserva a alternativa formal.
- source_word: ፈቀዱ
  choice: queriam
  rationale: Expressa vontade ou intenção sem acrescentar certeza quanto ao resultado.
- source_word: ያእትቱ
  choice: remover
  rationale: Reflete o sentido causativo de retirar ou tirar, evitando a interpretação idiomática “abater”.
- source_word: ቀርኖ
  choice: seu chifre
  rationale: Conserva literalmente a imagem apocalíptica, sem substituí-la por uma interpretação como “poder” ou “força”.
- source_word: አእህሉዎ
  choice: não prevaleceram contra ele
  rationale: Comunica que os atacantes não conseguiram alcançar seu objetivo e preserva a referência pessoal final.
theological_decisions:
- issue: Interpretação simbólica de “chifre” no texto principal
  choice: Manter “chifre” literalmente
  alternative: Traduzir como “poder”, “força” ou “domínio”
  rationale: A visão comunica por imagens simbólicas; explicitar uma interpretação no corpo do texto eliminaria parte de sua abertura e iria além da redação da testemunha ge'ez.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com legibilidade brasileira. A repetição verbal do original foi preservada, assim como a imagem concreta do chifre.
