base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/023.yaml
  text: And behold[a], I saw all the prisoners, and they all stood before him.
translation:
  language: pt
  text: E eis que vi todos os prisioneiros[a], e todos eles estavam de pé diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que estavam presos” ou “os cativos”. O termo ge'ez ressalta que eram mantidos sob restrição.
    reason: Alternativa lexical que preserva a amplitude de እሱራነ.
lexical_decisions:
- source_word: ወናሁ
  choice: E eis que
  rationale: Preserva a fórmula dêitica da visão e o registro apocalíptico, em vez de reduzi-la a uma simples ligação narrativa.
- source_word: ኵሎሙ
  choice: todos / todos eles
  rationale: Mantém a ênfase totalizante nas duas ocorrências, com leve ajuste idiomático na segunda.
- source_word: እሱራነ
  choice: os prisioneiros
  rationale: O substantivo designa pessoas presas, amarradas ou mantidas em cativeiro. “Prisioneiros” comunica com naturalidade sua condição de detidos sem definir sua identidade alegórica.
- source_word: ርኢኩ
  choice: vi
  rationale: É a forma natural, em português, do relato visionário em primeira pessoa e preserva a sequência narrativa.
- source_word: ወቆሙ
  choice: e ... ficaram de pé
  rationale: O verbo pode significar estar de pé, pôr-se de pé ou levantar-se. Neste cenário judicial, “ficaram de pé” expressa de modo natural a apresentação diante de uma autoridade, sem acrescentar movimento além do necessário.
- source_word: ቅድሜሁ
  choice: diante dele
  rationale: Tradução direta e formal que conserva a postura semelhante à de um tribunal perante a figura masculina já estabelecida pelo contexto.
theological_decisions:
- issue: Identidade e caracterização do grupo detido
  choice: Traduzir እሱራነ como “os prisioneiros”, sem especificar no texto principal se são estrelas, pastores ou transgressores angélicos.
  alternative: “os que estavam presos” ou “os cativos”
  rationale: O texto ge'ez identifica o grupo por sua condição de detenção; sua identidade alegórica depende do contexto mais amplo. A tradução preserva a imagem direta e não resolve silenciosamente essa questão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E eis que” conserva o tom visionário; a repetição de “todos” reproduz a ênfase do original sem tornar a frase artificial.
