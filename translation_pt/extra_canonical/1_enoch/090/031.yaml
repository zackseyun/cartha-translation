base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/031.yaml
  text: And after that[a], those three clothed in white who had taken me by the hand, who had brought me up before, and the hand of that ram holding me[c][b], brought me up and set me down in the midst of those sheep before the judgment took place.
translation:
  language: pt
  text: E depois disso,[a] aqueles três vestidos de branco, que me haviam tomado pela mão e antes me haviam levado para cima, juntamente com a mão daquele carneiro que me segurava,[b] levaram-me para cima e me colocaram no meio daquelas ovelhas,[c] antes que acontecesse o julgamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida por “e, depois daquilo”. Ela indica sequência temporal.
    reason: textual_variant
  - marker: b
    text: A leitura “carneiro” segue uma correção da forma aparentemente corrompida no testemunho transcrito. A construção da frase é incomum e destaca a mão do carneiro segurando o vidente.
    reason: textual_variant
  - marker: c
    text: As “ovelhas” pertencem ao simbolismo do Apocalipse dos Animais, no qual grupos humanos são representados por animais; a imagem é mantida sem explicação no texto principal.
    reason: cultural_note
lexical_decisions:
- source_word: ወእምኔሁ
  choice: E depois disso
  rationale: Expressa a sequência temporal do idioma ge'ez, evitando a leitura equivocada “dentre eles”.
- source_word: እልኩ ፫እለ ይለብሱ ጸዓዳወ
  choice: aqueles três vestidos de branco
  rationale: Mantém as três figuras sem identificá-las como homens ou anjos e preserva a imagem da veste branca.
- source_word: አኃዙኒ በእዴየ
  choice: me haviam tomado pela mão
  rationale: Verte naturalmente o gesto concreto de condução, sem a dureza indevida de “agarrado”.
- source_word: እለ ቀደሙ አዕረጉኒ
  choice: antes me haviam levado para cima
  rationale: Entende ቀደሙ em sentido temporal, “antes/anteriormente”, e conserva o movimento ascendente do verbo.
- source_word: እዴሁ ለውእቱ ዴቤላ እንዘ ትእኅዘኒ
  choice: a mão daquele carneiro que me segurava
  rationale: Segue a correção textual que reconhece “carneiro” na leitura corrompida do testemunho transcrito e preserva a sintaxe incomum da mão como agente de sustentação.
- source_word: አዕረጉኒ ወአንበሩኒ
  choice: levaram-me para cima e me colocaram
  rationale: 'Conserva os dois verbos principais: ascender sob condução e ser colocado no local da cena.'
- source_word: ማእከሎሙ ለዝኩ አባግዕት
  choice: no meio daquelas ovelhas
  rationale: Preserva literalmente a figura animal do Apocalipse dos Animais, sem explicá-la no corpo do texto.
- source_word: እንበለ ትኩን ኵነኔ
  choice: antes que acontecesse o julgamento
  rationale: Mantém a força temporal e a expectativa da cena judicial sem acrescentar formulação doutrinária.
theological_decisions:
- issue: Identidade das três figuras vestidas de branco
  choice: “aqueles três vestidos de branco”, sem identificá-los
  alternative: “três anjos” ou “três homens”
  rationale: O trecho fornecido destaca sua roupa e sua função, mas não declara explicitamente sua natureza; a tradução conserva essa abertura.
- issue: Identidade da figura animal singular
  choice: “daquele carneiro”
  alternative: “daquele” ou “daquele ser”
  rationale: A correção textual indicada e o contexto simbólico do Apocalipse dos Animais favorecem “carneiro”; omitir o animal apagaria um elemento importante da visão.
- issue: Força temporal da cláusula final
  choice: “antes que acontecesse o julgamento”
  alternative: “até que viesse o julgamento”
  rationale: A leitura adotada apresenta a colocação de Enoque entre as ovelhas como anterior ao julgamento, preservando a sequência narrativa sem desenvolver uma doutrina do juízo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe suavizada sem eliminar a estrutura acumulativa da visão. Usa “carneiro” e “ovelhas” para conservar o simbolismo animal e evita identificar as figuras de branco além do que o texto permite.
