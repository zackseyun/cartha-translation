base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/014.yaml
  text: And I saw until that man came[a], the one who had written down the names of the shepherds, and he brought them up before the Lord of the sheep; and he helped him and rescued him[c][b], and he showed him everything concerning the downfall of his helper.
translation:
  language: pt
  text: E vi até que chegou aquele homem[b] que havia anotado os nomes dos pastores e os fez subir à presença do Senhor das ovelhas. Ele ajudou aquele carneiro, livrou-o e mostrou-lhe toda a descida de seu ajudador.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A última expressão é difícil no etíope transmitido. “Descida” também pode ser entendida como “intervenção” ou, segundo outra leitura, “queda” ou “derrocada”.
    reason: textual_variant
  - marker: b
    text: O homem que havia anotado os nomes dos pastores é o registrador celestial que já atua na cena de julgamento desta visão.
    reason: cross_reference
  - marker: c
    text: 'Outra tradução possível é: “e mostrou àquele carneiro tudo a respeito da intervenção de seu ajudador”.'
    reason: alternative_rendering
lexical_decisions:
- source_word: ብእሲ
  choice: homem
  rationale: O termo designa normalmente um homem. Embora o contexto sugira um agente celestial, a tradução conserva a imagem concreta e não acrescenta a identificação “anjo”.
- source_word: ዘጸሐፈ፡ አስማቲሆሙ፡ ለኖሎት
  choice: que havia anotado os nomes dos pastores
  rationale: O mais-que-perfeito indica a ação anterior pela qual o homem é identificado; “anotado” preserva a dimensão documental e judicial.
- source_word: ያዐርግ፡ ቅድሜሁ፡ ለእግዚአ፡ አባግዕ
  choice: os fez subir à presença do Senhor das ovelhas
  rationale: Mantém tanto o movimento ascendente do verbo quanto a apresentação perante o juiz divino; o pronome retoma naturalmente os nomes.
- source_word: ረዳኦ፡ ወአድኃኖ
  choice: ajudou ... livrou-o
  rationale: Conserva a distinção entre prestar auxílio e efetuar livramento, sem impor terminologia soteriológica posterior.
- source_word: ለዝኩ፡ ይቤላ
  choice: àquele carneiro
  rationale: O substantivo ይቤላ identifica o referente como o carneiro já presente na visão, em vez de uma ovelha genérica; em português, o referente foi explicitado no início da sequência para evitar pronomes ambíguos.
- source_word: ኵሎ፡ መራደ፡ ለረዳኢቱ
  choice: toda a descida de seu ajudador
  rationale: Trata መራደ como substantivo ligado à ideia de descer e conserva a formulação difícil, sem convertê-la silenciosamente em “tudo” nem decidir se se trata de descida, intervenção ou queda.
theological_decisions:
- issue: Identidade daquele homem
  choice: aquele homem
  alternative: aquele anjo
  rationale: O texto local diz “homem”; sua possível condição celestial decorre do contexto e não deve ser inserida na tradução.
- issue: Título divino እግዚአ አባግዕ
  choice: Senhor das ovelhas
  alternative: dono das ovelhas
  rationale: “Senhor” mantém a designação recorrente, o registro elevado e a força da soberania divina na alegoria.
- issue: Identidade do beneficiário do auxílio
  choice: aquele carneiro
  alternative: ele
  rationale: A explicitação reconhece ይቤላ e liga a ação ao carneiro da cena anterior, sem identificar teologicamente essa personagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “E continuei olhando até que” reproduz de modo natural a fórmula visionária; “fez subir à presença” conserva a imagem espacial do original. A cláusula final permanece deliberadamente incomum porque o texto etíope é comprimido e ambíguo.
