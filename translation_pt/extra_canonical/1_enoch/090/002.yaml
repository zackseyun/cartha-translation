base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/002.yaml
  text: And after that I saw in my vision all the birds of heaven coming—eagles[a], vultures, kites, and ravens—and the eagles led all the birds. And they began to devour those sheep[c][b], and to peck out their eyes and devour their flesh.
translation:
  language: pt
  text: Depois disso, vi em minha visão todas as aves do céu chegarem — águias, abutres, milhafres e corvos[a] —, e as águias conduziam todas as aves. Elas começaram a devorar aquelas ovelhas[b], a arrancar-lhes os olhos a bicadas e a devorar-lhes a carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação moderna dessas aves não é inteiramente certa. Os termos ge'ez designam aves predadoras e corvídeos; “milhafres” também poderia ser traduzido como “gaviões”, e “corvos”, como “corvos-pretos”.
    reason: lexical_alternative
  - marker: b
    text: 'A abertura do ataque também pode ser entendida como: “agarraram aquelas ovelhas e as devoraram”, conforme a maneira de interpretar a sequência verbal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ በራእየየ
  choice: vi em minha visão
  rationale: Preserva o relato visionário em primeira pessoa e o possessivo explícito, em português natural.
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: todas as aves do céu
  rationale: Mantém o registro apocalíptico elevado e a abrangência da expressão etiópica.
- source_word: አንስርት
  choice: águias
  rationale: É a identificação tradicional e provável neste contexto, embora o campo semântico possa abranger grandes aves de rapina.
- source_word: አውስት
  choice: abutres
  rationale: A opção se ajusta ao catálogo de aves predadoras e à imagem de devoração, sem eliminar a incerteza taxonômica indicada em nota.
- source_word: ሆባይ
  choice: milhafres
  rationale: Designa de modo cauteloso uma ave de rapina menor; outras identificações, como gaviões, continuam possíveis.
- source_word: ቋዓት
  choice: corvos
  rationale: É uma tradução corrente para o corvídeo mencionado e conserva o tom sombrio da visão.
- source_word: ወአንስርት ይመረሕዎሙ ለኵሎሙ አዕዋፍ
  choice: e as águias conduziam todas as aves
  rationale: Interpreta corretamente a segunda ocorrência de 'águias' como sujeito explícito do verbo, e não como um quinto item redundante da lista.
- source_word: አኃዙ ይብልዕዎሙ
  choice: começaram a devorar
  rationale: Expressa a provável força incoativa da sequência verbal, mantendo em nota a possibilidade de entendê-la como apreensão seguida de devoração.
- source_word: ዝኩ አባግዕ
  choice: aquelas ovelhas
  rationale: O demonstrativo remete às ovelhas já presentes na sequência da visão.
- source_word: ይክረዩ አዕይንቲሆሙ
  choice: arrancar-lhes os olhos a bicadas
  rationale: Torna explícita, de maneira natural em português, a ação concreta praticada por aves.
- source_word: ይበልዕዎሙ ለሥጋሆሙ
  choice: devorar-lhes a carne
  rationale: Conserva tanto a repetição do motivo da devoração quanto a violência visceral da imagem.
theological_decisions:
- issue: Simbolismo do Apocalipse dos Animais
  choice: Manter literalmente as imagens de aves e ovelhas no texto.
  alternative: Substituir os animais por identificações históricas ou políticas interpretativas.
  rationale: A tradução deve preservar a forma e a tensão da visão alegórica, sem incorporar ao versículo uma identificação histórica ou doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Preserva-se o tom visionário e violento do original sem inserir explicações históricas no corpo do versículo. A pontuação destaca o catálogo de aves sem tratar a segunda ocorrência de “águias” como mais um item da lista.
