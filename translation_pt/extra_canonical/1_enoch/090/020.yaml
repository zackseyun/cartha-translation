base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/020.yaml
  text: And I saw until a throne was set up in the pleasant land[a], and the Lord of the sheep sat upon it[b]; and he took all the sealed books and opened those books before the Lord of the sheep.
translation:
  language: pt
  text: E continuei olhando até que um trono foi erguido na terra aprazível[a], e o Senhor das ovelhas se assentou sobre ele[b]. Ele tomou todos os livros selados e os abriu diante do Senhor das ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra etíope traduzida por “terra aprazível” é incerta neste testemunho; pode indicar uma terra especialmente favorecida, e não a terra em geral.
    reason: lexical_alternative
  - marker: b
    text: O versículo repete “o Senhor das ovelhas” tanto para aquele que se assenta no trono como para aquele diante de quem os livros são abertos. A tradução mantém essa repetição em vez de suavizá-la.
    reason: textual_variant
lexical_decisions:
- source_word: መንበር
  choice: trono
  rationale: No cenário apocalíptico de julgamento, o termo indica um assento régio e judicial; “trono” preserva essa imagem.
- source_word: ተሐንጸ
  choice: foi erguido
  rationale: A forma passiva apresenta o trono como preparado ou estabelecido. “Foi erguido” é natural em português e não especifica em excesso o modo de construção.
- source_word: ሐዋዝ
  choice: terra aprazível
  rationale: O vocábulo etíope é difícil neste testemunho. A escolha preserva tanto o sentido territorial concreto quanto a possível ideia de uma terra favorecida ou agradável, sem reduzi-la à terra em geral.
- source_word: እግዚአ አባግዕ
  choice: Senhor das ovelhas
  rationale: Mantém de modo consistente o título recorrente no Apocalipse dos Animais e conserva seu tom elevado e sua ênfase em autoridade.
- source_word: መጻሕፍተ ኅትማተ
  choice: livros selados
  rationale: A expressão descreve livros marcados por selos, provavelmente registros celestiais. “Livros selados” reproduz diretamente a formulação etíope sem substituir “livros” por “rolos”.
- source_word: ፈትሖን
  choice: os abriu
  rationale: Embora os livros sejam selados, o verbo empregado tem o sentido comum de abrir. A tradução conserva o verbo e deixa que a menção anterior aos selos forneça a imagem de abertura.
theological_decisions:
- issue: Identidade da figura entronizada e daquele diante de quem os livros são abertos
  choice: 'Manter a redação etíope: o Senhor das ovelhas se assenta no trono, e os livros são abertos diante do Senhor das ovelhas.'
  alternative: Emendar uma das ocorrências para que outra figura celestial se assente ou para que os livros sejam abertos diante de outro agente.
  rationale: Embora a repetição possa parecer incomum, o testemunho-base é suficientemente coerente para ser traduzido sem harmonização ou emenda silenciosa. A formulação pode enfatizar o Senhor das ovelhas como juiz entronizado e destinatário dos registros.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. “E continuei olhando até que” reproduz a continuidade da visão sem rigidez excessiva; “terra aprazível” conserva o registro elevado e a incerteza lexical indicada em nota. Todos os marcadores aparecem no texto principal.
