base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/009.yaml
  text: And I saw until horns came out for those lambs[a], and the ravens cast down their horns. And I saw until one great horn sprouted on one of those sheep[c][b], and their eyes were opened.
translation:
  language: pt
  text: E continuei olhando, até que nasceram chifres naqueles cordeiros[a], e os corvos derrubaram os chifres deles. Continuei olhando, até que um grande chifre brotou em uma daquelas ovelhas, e os olhos deles se abriram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo etíope designa aqui cordeiros ou animais jovens, isto é, a prole das ovelhas na visão.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os olhos deles se abriram”; a imagem pode indicar percepção ou consciência restaurada dentro da visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅርንት / ቀርን
  choice: chifres / chifre
  rationale: Preserva a imagem apocalíptica recorrente de força e governo, bem como a distinção entre o plural inicial e o único grande chifre.
- source_word: መኃስእ
  choice: cordeiros
  rationale: A revisão lexical mais recente identifica o termo como cordeiros ou animais jovens; no contexto, são a prole das ovelhas, e não cervídeos.
- source_word: ቋንት
  choice: corvos
  rationale: É o equivalente português natural para a ave corvídea hostil da visão e mantém a imagem apocalíptica tradicional.
- source_word: ያወድቅዎሙ
  choice: derrubaram
  rationale: Expressa o sentido causativo de fazer cair com força vívida, sem especificar um mecanismo não presente no texto.
- source_word: በቈለ
  choice: brotou
  rationale: Mantém a metáfora orgânica de algo que germina ou surge.
- source_word: ፩ቀርን ዓቢይ
  choice: um grande chifre
  rationale: Conserva o numeral explícito e o peso simbólico de 'grande'.
- source_word: አባግዕ
  choice: ovelhas
  rationale: Traduz diretamente o referente coletivo sem dissolver a imagem em 'rebanho'.
- source_word: ተከሥተ አዕይንቲሆሙ
  choice: os olhos deles se abriram
  rationale: Reproduz a expressão passiva/reflexiva de modo natural em português e preserva sua possível nuance de percepção restaurada.
theological_decisions:
- issue: Identidade histórica do grande chifre
  choice: Manter apenas a descrição simbólica no texto
  alternative: Identificá-lo explicitamente como Judas Macabeu ou outro líder
  rationale: O versículo apresenta uma visão, não sua interpretação histórica; explicitar uma identificação eliminaria uma ambiguidade genuína.
- issue: Valor simbólico dos chifres
  choice: Traduzir literalmente como 'chifres'
  alternative: Substituir por uma interpretação como 'poder' ou 'governantes'
  rationale: A imagem concreta deve ser preservada, sem transformar a tradução em comentário.
- issue: Identificação dos animais jovens
  choice: Usar 'cordeiros'
  alternative: Usar 'cervos'
  rationale: A evidência lexical revisada e a continuidade zoomórfica do contexto favorecem 'cordeiros', descendentes das ovelhas.
translation_notes:
  register: Português moderno, claro e digno, com cadência visionária preservada pela repetição de “Continuei olhando”. Evitaram-se termos arcaicos e identificações interpretativas. Todos os marcadores de nota aparecem no texto principal.
