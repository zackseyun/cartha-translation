base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/006.yaml
  text: And behold[a], lambs were born from those white sheep, and their eyes began to be opened, and they saw[b], and they cried out to the sheep.
translation:
  language: pt
  text: E eis que nasceram cordeiros daquelas[a] ovelhas brancas; eles começaram a abrir os olhos[b], a ver e a clamar às ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destas ovelhas brancas”, caso o demonstrativo seja entendido como proximal.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus olhos começaram a se abrir”; a construção também pode ser entendida de modo mais passivo.
    reason: source_ambiguity
lexical_decisions:
- source_word: ነዋ
  choice: e eis que
  rationale: Mantém a partícula de apresentação própria do relato visionário e o encadeamento narrativo.
- source_word: መንስኣት
  choice: cordeiros
  rationale: Preserva a imagem animal concreta e contínua do Apocalipse dos Animais, em vez de generalizá-la como “filhotes” ou “descendentes”.
- source_word: ተወልዱ
  choice: nasceram
  rationale: Expressa de modo natural em português o nascimento indicado pela forma verbal passiva do ge'ez.
- source_word: እምዝኩ አባግዕት ጻዓዳ
  choice: daquelas ovelhas brancas
  rationale: Conserva o demonstrativo, o referente retomado e a cor, importante para o simbolismo da visão.
- source_word: አኃዙ
  choice: começaram
  rationale: Marca o aspecto incoativo e rege naturalmente, em português, a série de ações seguintes.
- source_word: አዕይንቲሆሙ ይከሠቱ
  choice: a abrir os olhos
  rationale: Integra a expressão à construção incoativa e mantém a imagem do despertar da visão; a possível leitura mais passiva é registrada em nota.
- source_word: ወይርእዩ
  choice: a ver
  rationale: Mantém o verbo dependente de “começaram” e paralelo às demais ações da sequência.
- source_word: ወይጸርኁ
  choice: a clamar
  rationale: Preserva a dependência sintática em relação a “começaram” e comunica um chamado intenso sem especificar indevidamente um balido.
- source_word: ኀበ አባግዕ
  choice: às ovelhas
  rationale: Traduz a direção do clamor de modo conciso e natural.
theological_decisions:
- issue: Preservação da imagética animal no apocalipse simbólico
  choice: cordeiros ... ovelhas brancas ... ovelhas
  alternative: filhotes ... animais brancos ... rebanho
  rationale: A visão comunica seu sentido por uma sequência deliberada de figuras animais; a tradução não as converte em referentes humanos nem as torna abstratas.
- issue: Escopo do verbo incoativo sobre a sequência verbal
  choice: começaram a abrir os olhos, a ver e a clamar
  alternative: seus olhos começaram a se abrir, eles viram e clamaram
  rationale: Os três imperfeitos podem ser entendidos como complementos paralelos de አኃዙ, “começaram”. A versão principal preserva essa relação sem resolver a imagem em termos teológicos.
translation_notes:
  register: Português atual, digno e de leitura ampla, com leve solenidade em “e eis que” para conservar o tom visionário. A pontuação separa o nascimento da série incoativa sem romper o fluxo do versículo.
