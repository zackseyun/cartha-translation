base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/025.yaml
  text: And those shepherds were judged and were found to be sinners[c][b][a], and they were cast into that abyss of fire.
translation:
  language: pt
  text: E aqueles pastores[a] foram julgados e considerados pecadores[b], e foram lançados naquele abismo de fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma preservada na transcrição apresenta sinais de corrupção textual, mas a leitura «pastores» corresponde ao termo etíope reconhecível e ao grupo julgado no contexto.
    reason: textual_variant
  - marker: b
    text: Mais literalmente, «tornaram-se pecadores»; no contexto do julgamento, a expressão pode indicar que foram reconhecidos ou declarados pecadores.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: E aqueles
  rationale: A forma é demonstrativa, não o verbo «ver». Retoma o grupo mencionado no contexto e preserva a ligação narrativa.
- source_word: ኖላዊያን
  choice: pastores
  rationale: O termo designa os pastores do julgamento narrado nesta seção; não se refere a elefantes.
- source_word: ተኰነኑ
  choice: foram julgados
  rationale: O passivo judicial mantém o cenário de julgamento sem antecipar indevidamente a ideia mais específica de sentença ou condenação.
- source_word: ወኮኑ ኃጥኣነ
  choice: considerados pecadores
  rationale: No contexto judicial, a expressão indica que eles foram reconhecidos ou declarados pecadores. A nota preserva a formulação mais literal «tornaram-se pecadores».
- source_word: ወተወድዩ
  choice: foram lançados
  rationale: Expressa a ação passiva e coercitiva do juízo em português natural e digno.
- source_word: እሙንቱ
  choice: eles
  rationale: O pronome retoma os pastores; em português, está naturalmente incorporado no sujeito oculto de «foram lançados».
- source_word: ውስተ'ዛ ማዕምቀ እሳት
  choice: naquele abismo de fogo
  rationale: Preserva a imagem do abismo e do fogo sem acrescentar o adjetivo redundante «profundo» nem interpretar a imagem como «inferno».
theological_decisions:
- issue: Identidade do grupo julgado
  choice: Manter «pastores» como a figura simbólica do texto
  alternative: Substituir a figura por sua possível identidade histórica ou angelical
  rationale: A tradução deve conservar a linguagem simbólica do Apocalipse dos Animais, sem converter a imagem em uma interpretação histórica ou teológica.
- issue: Sentido moral ou judicial de ወኮኑ ኃጥኣነ
  choice: «considerados pecadores» no texto principal
  alternative: «tornaram-se pecadores»
  rationale: O contexto é judicial, mas a expressão conserva a categoria moral de «pecadores». A tradução principal comunica a declaração de culpa sem reduzi-la ao termo abstrato «culpados», e a nota registra a leitura mais literal.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível a leitores brasileiros e amplamente compreensível no espaço lusófono. A repetição de «foram» preserva o ritmo judicial e a sequência das ações do original.
