base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/037.yaml
  text: And I saw that a white bull was born[a], and its horns were great[c][b]; and all the beasts of the field and all the birds of heaven feared it and entreated it at all times.
translation:
  language: pt
  text: E vi que nasceu um touro branco[a], e seus chifres eram grandes. Todas as feras do campo e todas as aves do céu o temiam e lhe suplicavam[b] em todo tempo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O touro branco é uma figura simbólica no Apocalipse dos Animais; a tradução preserva a imagem sem identificar aqui quem ele representa.
    reason: cultural_note
  - marker: b
    text: Ou “lhe faziam súplicas” ou “lhe imploravam”. O verbo indica um apelo insistente e deferente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተወልደ
  choice: nasceu
  rationale: Expressa diretamente a forma passiva de nascimento no relato visionário, sem acrescentar uma identificação interpretativa.
- source_word: ላህም
  choice: touro
  rationale: Indica naturalmente um bovino macho e corresponde à menção subsequente de seus grandes chifres, preservando a imagem da visão.
- source_word: ጻዕዳ
  choice: branco
  rationale: Mantém literal a cor, que tem relevância simbólica na sequência visionária.
- source_word: አቅርንቲሁ
  choice: seus chifres
  rationale: Preserva a imagem concreta; o possessivo masculino é natural em português por concordar com “touro”.
- source_word: ዐበይት
  choice: eram grandes
  rationale: Conserva tanto a ideia de tamanho quanto a possível proeminência simbólica, sem interpretar os chifres como poder militar.
- source_word: አራዊተ ገዳም
  choice: as feras do campo
  rationale: Designa os animais selvagens e mantém a taxonomia elevada e tradicional da visão em português claro.
- source_word: አዕዋፈ ሰማይ
  choice: as aves do céu
  rationale: Preserva a expressão concreta e o registro bíblico-apocalíptico sem soar arcaico.
- source_word: ይፈርህዎ
  choice: o temiam
  rationale: Reproduz de modo simples e forte o temor universal dirigido ao touro recém-nascido.
- source_word: ያስተበቍዕዎ
  choice: lhe suplicavam
  rationale: O verbo ge'ez denota rogar, implorar ou fazer súplica; “suplicavam” conserva essa força deferente melhor do que uma paráfrase mais branda.
- source_word: በኵሉ ጊዜ
  choice: em todo tempo
  rationale: Mantém a força abrangente e reiterativa da expressão, com dignidade e clareza em português.
theological_decisions:
- issue: Se a identidade do touro branco deve ser explicitada na tradução
  choice: Manter o símbolo animal sem identificar a figura no texto principal.
  alternative: Traduzir interpretativamente como um governante humano ou figura messiânica, ou acrescentar uma identificação explicativa.
  rationale: O Apocalipse dos Animais apresenta sua mensagem por meio de imagens simbólicas. Identificar o touro no próprio versículo resolveria uma questão interpretativa que o texto deixa aberta.
- issue: Força religiosa ou cortesã do verbo de súplica
  choice: Traduzir por “lhe suplicavam”, preservando a intensidade do pedido sem definir o ato como culto.
  alternative: “Buscavam seu favor” ou “o adoravam”.
  rationale: “Suplicavam” comunica rogo deferente e intenso, mas não impõe uma conclusão teológica sobre adoração; assim, preserva a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva o caráter visionário e o paralelismo do ge'ez, evitando tanto arcaísmos desnecessários quanto explicações doutrinárias no texto principal.
