base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/016.yaml
  text: And all the eagles and the vultures and the ravens and the kites gathered together and came with them, with all the wild sheep; and they all came together and helped one another so as to break the horn of that ram.
translation:
  language: pt
  text: E todas as águias, os abutres, os corvos e os milhafres se reuniram e vieram com eles, junto com todas as ovelhas selvagens. Todos vieram juntos e ajudaram uns aos outros a quebrar o chifre daquele carneiro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንስርት፡ ወዓውስት፡ ወቋዓት፡ ወሀባይ
  choice: as águias, os abutres, os corvos e os milhafres
  rationale: Mantém a enumeração das quatro aves de rapina ou necrófagas do texto etíope, usando nomes correntes em português.
- source_word: አባግዕ፡ ገዳም
  choice: ovelhas selvagens
  rationale: Traduz diretamente a expressão referente às ovelhas do campo ou ermo e preserva sua distinção em relação ao carneiro.
- source_word: ይቀትቅጥዎ
  choice: quebrar
  rationale: O verbo expressa esmagar, despedaçar ou quebrar; “quebrar” é claro, natural e adequado ao objeto “chifre”, sem intensificar além do necessário.
- source_word: ቀርነ
  choice: chifre
  rationale: “Chifre” é a forma comum e imediatamente compreensível em português para o símbolo animal desta visão.
- source_word: ይቤላ
  choice: carneiro
  rationale: No contexto da visão animal, identifica o animal macho portador do chifre; “carneiro” mantém a imagem concreta.
theological_decisions:
- issue: Identidade simbólica dos animais e do chifre
  choice: Preservar integralmente as figuras animais sem explicá-las no corpo do versículo
  alternative: Substituir ou ampliar as figuras com suas possíveis identificações históricas
  rationale: O versículo apresenta uma visão simbólica e não explicita aqui os referentes; interpretá-los na tradução eliminaria a ambiguidade deliberada do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e ampla inteligibilidade internacional. A repetição de “todos” e a sequência de reunião, vinda e auxílio mútuo foram preservadas por sua função narrativa.
