  terminology: «Abismo», «ovelhas cegadas», «julgadas», «pecadoras», «lançadas» e «arderam» são escolhas consistentes com a imagética e o tom judicial do texto. «Consideradas pecadoras» comunica adequadamente o valor constatativo/declarativo possível no contexto judicial; a nota conserva a possibilidade mais literal.
