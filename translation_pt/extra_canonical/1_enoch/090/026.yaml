base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/026.yaml
  text: And I saw at that time that a similar deep abyss was opened in the middle of the earth[a], full of fire; and they brought those blinded sheep, and all of them were judged and were found to be sinners, and they were cast into that deep abyss of fire, and they burned[f][e][d][c][b]. And this abyss came to be at the right side of that house.
translation:
  language: pt
  text: E vi, naquele tempo, ser aberto no meio da terra um abismo profundo semelhante[a], cheio de fogo. Então trouxeram aquelas ovelhas cegadas[b]; todas foram julgadas e consideradas pecadoras[c], e foram lançadas naquele profundo abismo de fogo, onde arderam. E este abismo estava à direita daquela casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande profundidade semelhante” ou “uma cova profunda semelhante”. O termo ge'ez designa grande profundidade; “abismo” preserva o caráter apocalíptico da visão.
    reason: lexical_alternative
  - marker: b
    text: “Ovelhas cegadas” faz parte do simbolismo animal da visão e se refere a pessoas, não a animais literais. Também se pode traduzir “ovelhas cegas”.
    reason: cultural_note
  - marker: c
    text: Literalmente, “foram julgadas e se tornaram pecadoras”. No contexto judicial, a expressão pode indicar que foram reconhecidas ou declaradas pecadoras, e não que começaram a pecar naquele momento.
    reason: alternative_reading
lexical_decisions:
- source_word: ተርኅወ
  choice: abrir-se
  rationale: Preserva a forma passiva/intransitiva da abertura visionária sem especificar quem abriu o abismo.
- source_word: ማዕምቅ
  choice: abismo profundo
  rationale: “Abismo” mantém a força apocalíptica, e “profundo” expressa a ideia intensiva de grande profundidade.
- source_word: ምሉዕ እሳተ
  choice: cheio de fogo
  rationale: Tradução concreta e direta, conservando o substantivo coletivo no singular.
- source_word: አምጽእዎሙ
  choice: trouxeram
  rationale: Mantém os agentes implícitos, como no ge'ez, e expressa de modo natural a ideia de fazê-las vir.
- source_word: እልኩ አባግዕ ጽዑላነ
  choice: aquelas ovelhas cegadas
  rationale: “Cegadas” preserva a possível nuance resultativa do particípio e sua ligação com acontecimentos anteriores da visão.
- source_word: ተኰነኑ
  choice: foram julgadas
  rationale: Conserva o sentido judicial sem antecipar o resultado, expresso na oração seguinte.
- source_word: ወኮኑ ኃጥኣነ
  choice: consideradas pecadoras
  rationale: No contexto judicial, comunica que foram reconhecidas ou declaradas pecadoras, evitando sugerir que o julgamento as fez pecar.
- source_word: ተወድዩ
  choice: foram lançadas
  rationale: Mantém a voz passiva e o tom solene da cena de juízo.
- source_word: ውዕዩ
  choice: arderam
  rationale: Reproduz de forma breve e vívida a ação expressa no ge'ez, sem acrescentar a ideia de consumo total.
- source_word: ዝንቱ ... በየማኑ ለዝኩ ቤት
  choice: este abismo ... à direita daquela casa
  rationale: Preserva o contraste entre o demonstrativo próximo aplicado ao abismo e o demonstrativo distante aplicado à casa.
theological_decisions:
- issue: Se a cegueira das ovelhas é apenas uma condição ou o resultado de uma ação anterior na alegoria
  choice: ovelhas cegadas
  alternative: ovelhas cegas
  rationale: A forma escolhida conserva a possível nuance de condição produzida anteriormente, sem explicar sua causa nem fixar uma interpretação moral específica.
- issue: Sentido da sequência judicial “foram julgadas e se tornaram/foram pecadoras”
  choice: foram julgadas e consideradas pecadoras
  alternative: foram julgadas e se tornaram pecadoras
  rationale: O contexto judicial favorece o sentido declarativo ou constatativo, mas a nota registra a tradução mais literal e mantém visível a tensão do original.
- issue: Relação entre o abismo e a casa
  choice: localização espacial concreta à direita daquela casa
  alternative: interpretação simbólica da posição à direita
  rationale: O texto fornece uma localização, mas não explica seu significado; a tradução evita importar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva a progressão solene da visão, mas evita uma longa cadeia excessiva de coordenações. Os marcadores [a], [b] e [c] aparecem no texto principal.
