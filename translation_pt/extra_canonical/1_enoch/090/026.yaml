revisions:
- from: E vi, naquele tempo, abrir-se no meio da terra um abismo igualmente profundo[a], cheio de fogo. Então trouxeram aquelas ovelhas cegadas[b]; todas foram julgadas e consideradas pecadoras[c], e foram lançadas naquele profundo abismo de fogo, onde arderam. E este abismo ficava à direita daquela casa.
  to: E vi, naquele tempo, ser aberto no meio da terra um abismo profundo semelhante[a], cheio de fogo. Então trouxeram aquelas ovelhas cegadas[b]; todas foram julgadas e consideradas pecadoras[c], e foram lançadas naquele profundo abismo de fogo, onde arderam. E este abismo estava à direita daquela casa.
  rationale: A revisão substitui a comparação excessivamente específica «igualmente profundo» por «profundo semelhante», em conformidade com o comparativo do ge'ez e com a trilha de auditoria inglesa. Ajusta também a nota correspondente e torna a construção passiva e a localização final mais naturais em português, sem alterar o sentido.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:00:12Z'
