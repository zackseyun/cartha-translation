base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/034.yaml
  text: And I saw until they laid aside that sword which had been given to the sheep[a], and they brought it into the house and sealed it before the face of the Lord; and all the sheep were summoned into that house[e][d][c][b], and it did not contain them.
translation:
  language: pt
  text: E continuei olhando, até que depuseram aquela espada que havia sido dada às ovelhas e a levaram para dentro da casa, e a selaram diante da face do Senhor[a]. Todas as ovelhas foram convocadas para aquela casa[b], e ela não as comportava[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Diante da face do Senhor” é uma expressão literal que significa “na presença do Senhor”.
    reason: lexical_alternative
  - marker: b
    text: Na simbologia da visão, “a casa” pode evocar o templo ou a morada escatológica do povo de Deus; o texto, porém, diz apenas “casa”.
    reason: cultural_note
  - marker: c
    text: 'Isto é, a casa não conseguia conter todas as ovelhas. Também se poderia traduzir: “não era suficiente para acolhê-las”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሰከብዎ
  choice: depuseram
  rationale: O verbo expressa fazer repousar ou pôr abaixo. Em relação à espada, “depuseram” preserva a imagem concreta e sugere que ela foi posta de lado sem acrescentar a ideia de destruição.
- source_word: ሰይፍ
  choice: espada
  rationale: Equivalente corrente e concreto, necessário para conservar a imagética apocalíptica.
- source_word: ተውህበ ለአባግዕ
  choice: havia sido dada às ovelhas
  rationale: A forma passiva remete à entrega anterior da espada; o mais-que-perfeito composto torna essa relação temporal clara em português.
- source_word: አባግዕ
  choice: ovelhas
  rationale: Mantém de modo consistente o simbolismo animal da visão, sem substituí-lo pelo termo coletivo “rebanho”.
- source_word: አግብእዎ ውስተ ቤት
  choice: a levaram para dentro da casa
  rationale: O pronome retoma naturalmente “espada”; “levaram para dentro” expressa o movimento indicado pelo texto sem acrescentar a noção de retorno.
- source_word: ኀተማ እምቅድመ ገጹ ለእግዚእ
  choice: a selaram diante da face do Senhor
  rationale: Conserva a ação de selar e o idioma semítico literal “diante da face”, deixando a nota esclarecer que significa presença.
- source_word: ተጸውዑ
  choice: foram convocadas
  rationale: Preserva a voz passiva e o tom formal da reunião, com maior precisão que o genérico “foram chamadas”.
- source_word: ወኢያገምሮሙ
  choice: e ela não as comportava
  rationale: Traduz diretamente o verbo “conter/comportar”; “ela” explicita em português que o antecedente mais próximo é a casa, sem alterar o sentido.
theological_decisions:
- issue: Tradução de ለእግዚእ no cenário visionário enoquiano
  choice: o Senhor
  alternative: o Soberano
  rationale: Traduz o título de modo solene e corrente, sem lhe impor uma identificação cristológica posterior.
- issue: Identificação simbólica da casa
  choice: a casa
  alternative: o templo
  rationale: O texto diz apenas “casa”. A tradução preserva essa imagem e deixa aberta sua possível referência ao templo ou à morada escatológica.
- issue: Sentido da expressão “diante da face do Senhor”
  choice: manter o idioma no texto e explicá-lo em nota
  alternative: na presença do Senhor
  rationale: A formulação literal preserva o colorido semítico e a solenidade da cena, enquanto a nota assegura compreensão imediata.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. A sintaxe conserva a progressão visionária e a repetição simbólica de “ovelhas” e “casa”. O idioma “diante da face” foi deliberadamente mantido e esclarecido em nota.
