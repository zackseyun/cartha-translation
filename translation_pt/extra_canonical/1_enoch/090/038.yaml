base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/038.yaml
  text: And I saw until all their kinds were transformed[a], and they all became white cattle; and the first among them became a wild ox, and that wild ox became a great beast[d][c][b], and it had great black horns on its head.
translation:
  language: pt
  text: E continuei olhando, até que todas as suas espécies foram transformadas, e todos se tornaram gado branco. O primeiro entre eles tornou-se um boi selvagem[a], e esse boi selvagem tornou-se um grande animal. Ele tinha grandes chifres negros em sua cabeça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto etíope preservado traz literalmente «palavra» (também possível: «coisa» ou «assunto») nas duas ocorrências, e a primeira está marcada como corrupta. «Boi selvagem» é uma reconstrução provável do animal originalmente pretendido, de acordo com o contexto zoomórfico.'
    reason: textual_variant
  - marker: b
    text: A transcrição fornecida termina em «ele tinha», mas a edição de Charles continua com as palavras etíopes correspondentes a «grandes chifres negros em sua cabeça».
    reason: source_restoration
lexical_decisions:
- source_word: ተወለጠ
  choice: foram transformadas
  rationale: No contexto das metamorfoses visionárias do Apocalipse dos Animais, indica mudança de forma ou estado, não novo nascimento literal.
- source_word: ኵሉ አዝማዲሆሙ
  choice: todas as espécies deles
  rationale: Preserva a referência às diferentes classes ou espécies representadas por animais e soa natural em português.
- source_word: አልህምተ ጻዕዳ
  choice: gado branco
  rationale: Mantém a imagem bovina coletiva sem especificar indevidamente sexo ou idade.
- source_word: ቀዳማዊ ... ማእከሎሙ
  choice: o primeiro entre eles
  rationale: Expressa diretamente tanto a primazia quanto a posição no meio do grupo.
- source_word: †ነገር ... ነገር
  choice: um boi selvagem ... esse boi selvagem
  rationale: Embora o etíope transmitido signifique literalmente “palavra”, “coisa” ou “assunto”, o primeiro termo está assinalado com obelo, e a leitura é incoerente com o código zoomórfico. “Boi selvagem” representa a provável forma animal subjacente, sem ocultar em nota a corrupção do testemunho.
- source_word: አርዌ ዐቢየ
  choice: um grande animal
  rationale: Reproduz o sentido amplo de animal ou fera e evita acrescentar uma ferocidade não exigida pelo contexto.
- source_word: አቅርንት ጸሊም ዐቢይ ዲበ ርእሱ
  choice: grandes chifres negros na cabeça
  rationale: Restaura a continuação atestada na edição de Charles, que completa a frase truncada no trecho fornecido.
theological_decisions:
- issue: Tratamento da repetição difícil de ነገር na cena de transformação
  choice: Adotar no texto “boi selvagem”, com nota que registra a leitura literal do etíope
  alternative: Traduzir literalmente “palavra” ou “coisa”
  rationale: A leitura literal rompe a sequência estritamente zoomórfica, e o próprio texto crítico marca a primeira ocorrência como corrupta. A reconstrução contextual preserva a imagem provavelmente pretendida, enquanto a nota mantém transparente a incerteza textual e evita associar “palavra” a um conceito teológico posterior.
translation_notes:
  register: Português atual, claro e digno, com sintaxe narrativa natural. “Continuei olhando” transmite a duração de “vi até que”; “gado branco” conserva o coletivo bovino. As notas tornam explícitas tanto a reconstrução de “boi selvagem” quanto a restauração do final truncado.
