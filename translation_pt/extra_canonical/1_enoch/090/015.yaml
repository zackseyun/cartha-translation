  source_fidelity: O texto preserva a progressão da visão, a vinda do Senhor das ovelhas em ira, a fuga dos que o veem e a dupla totalização (“todos”). “Para longe de sua face” representa de modo compreensível a força ablativa de እምቅድመ (“de diante de”), sem eliminar a imagem antropomórfica. “Na sombra” mantém a imagem não especificada de ውስተ ጽላሎት; a nota registra adequadamente a nuance direcional literal.
  naturalness: Português moderno, claro e de registro solene. “E fiquei observando” é natural no enquadramento visionário. A divisão em duas frases melhora a legibilidade sem alterar a relação sequencial das ações. Embora “para longe de sua face” seja deliberadamente imagético e um pouco elevado, é apropriado ao registro e evita reduzir “face” a uma abstração.
  terminology: “Senhor das ovelhas” mantém com consistência o título alegórico e seu peso soberano, sem impor identificação doutrinária posterior. “Ira”, “fugiram”, “caíram” e “sombra” são escolhas fiéis e adequadas. As notas distinguem corretamente a literalidade de “para dentro da sombra” e o idiomatismo de “de diante de sua face”.
