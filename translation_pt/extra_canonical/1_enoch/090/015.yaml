base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/015.yaml
  text: And I watched until the Lord of the sheep came to them in wrath[a], and all who saw him fled[c][b], and they all fell into the shadow before his face.
translation:
  language: pt
  text: E fiquei observando até que o Senhor das ovelhas veio até eles com ira. Todos os que o viram fugiram, e todos caíram na sombra[a], para longe de sua face[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para dentro da sombra”. A imagem pode indicar um lugar sombrio de queda, mas o texto não o identifica de modo mais específico.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de diante de sua face”; isto é, afastando-se de sua presença.
    reason: source_idiom
lexical_decisions:
- source_word: ርኢኩ
  choice: fiquei observando
  rationale: No relato visionário, o verbo introduz uma observação continuada até o acontecimento decisivo; a locução comunica esse aspecto com naturalidade em português.
- source_word: እስከ መጽአ
  choice: até que ... veio
  rationale: Preserva a progressão temporal da visão até a chegada que altera a cena.
- source_word: እግዚአ አባግዕ
  choice: o Senhor das ovelhas
  rationale: Mantém o título central da alegoria animal, sua autoridade e a imagem do rebanho, sem acrescentar identificação cristológica posterior.
- source_word: በመዓት
  choice: com ira
  rationale: Expressa o modo de sua vinda e conserva a força judicial do termo em português atual e digno.
- source_word: እለ ርእይዎ ኵሎሙ
  choice: todos os que o viram
  rationale: Reproduz com clareza a construção relativa coletiva do ge'ez.
- source_word: ነፍጹ
  choice: fugiram
  rationale: Comunica a retirada súbita e amedrontada diante da manifestação do Senhor.
- source_word: ወወድቁ ኵሎሙ
  choice: e todos caíram
  rationale: Conserva a repetição totalizante de “todos” e a sequência do juízo.
- source_word: ውስተ ጽላሎት
  choice: na sombra
  rationale: Mantém a imagem literal e ominosa de “sombra” sem especificá-la indevidamente como trevas, morte ou mundo dos mortos.
- source_word: እምቅድመ ገጹ
  choice: para longe de sua face
  rationale: Torna explícita a força ablativa de እም (“de, desde”) em português natural, preservando ao mesmo tempo a imagem antropomórfica da face.
theological_decisions:
- issue: Identidade do “Senhor das ovelhas”
  choice: Título divino do soberano e juiz dentro do Apocalipse dos Animais
  alternative: “dono das ovelhas” como figura meramente interna à alegoria
  rationale: O contexto mais amplo apresenta essa figura como o governante transcendente que intervém para julgar. “Senhor” conserva esse peso sem introduzir uma identificação cristológica posterior.
- issue: Sentido de “sombra”
  choice: Preservar a imagem sem identificar seu referente
  alternative: Interpretar como “trevas”, lugar de destruição ou mundo dos mortos
  rationale: O termo ge'ez permite uma imagem ominosa, mas o versículo não define de maneira inequívoca o lugar ou estado representado.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A pontuação divide a longa coordenação do ge'ez sem alterar sua sequência. “Fiquei observando” sustenta o tom visionário, e as notas preservam as imagens e ambiguidades do original.
