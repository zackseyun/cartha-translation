base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/010.yaml
  text: And it looked at them[a], [and their eyes were opened,] and it cried out to the sheep and said to them[c][b], “Look!” and they all ran to it.
translation:
  language: pt
  text: 'E ele olhou para elas[a], [e os olhos delas se abriram,][b] e gritou para as ovelhas e lhes disse: “Olhem!” Então todas correram até ele.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito singular não é repetido nominalmente no versículo. A tradução segue a leitura verbal “ele olhou”, em vez de “eu vi”.
    reason: lexical_alternative
  - marker: b
    text: A oração “e os olhos delas se abriram” aparece entre colchetes porque o testemunho etíope fornecido a assinala como textualmente incerta ou instável.
    reason: textual_variant
  - marker: c
    text: Lit. “em direção a ele”. O pronome singular também poderia ser vertido segundo o gênero do animal entendido como antecedente; a identidade da figura não é explicitada aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርእየ፡ ቦሙ
  choice: E ele olhou para elas
  rationale: A forma verbal é entendida como terceira pessoa do singular, não como a fórmula narrativa na primeira pessoa (“eu vi”); ቦሙ é tomado como complemento do olhar, “para elas”.
- source_word: ወተፈትሐ፡ አዕይንቲሆሙ
  choice: '[e os olhos delas se abriram]'
  rationale: A construção passiva é reproduzida diretamente, e os colchetes preservam a incerteza textual indicada no testemunho fornecido.
- source_word: ወጸርኀ፡ ሎሙ፡ ለአባግዕ
  choice: e gritou para as ovelhas
  rationale: “Gritou” comunica a força do verbo vocal, enquanto “para as ovelhas” mantém explícitos os destinatários na cena animal.
- source_word: ወይቤላት፡ ርእይዎ
  choice: 'e lhes disse: “Olhem!”'
  rationale: 'Segue a análise contextual adotada pela revisão mais recente: verbo de fala com destinatário pronominal, seguido de uma ordem breve de percepção.'
- source_word: ወሮጹ፡ ኵሎሙ፡ ኀቤሁ
  choice: Então todas correram até ele
  rationale: Mantém o movimento concreto de correr em direção à figura singular; “todas” concorda naturalmente com “ovelhas”, e “ele” traduz o referente singular masculino sem identificá-lo fora da imagem visionária.
theological_decisions:
- issue: Identidade da figura singular para a qual as ovelhas correm
  choice: Manter apenas o pronome “ele” no texto principal
  alternative: Explicitar a figura como um líder humano ou usar “ela”, entendendo o referente como uma ovelha
  rationale: O texto preserva a superfície simbólica da visão e não identifica antecipadamente a figura com um personagem ou papel teológico específico. Em português, “ele” também corresponde ao pronome masculino singular do ge’ez, embora o referente simbólico permaneça discutível.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário acessível. A repetição de “e” preserva em parte o encadeamento visionário do ge’ez, enquanto “Então” torna natural a transição final. Os colchetes foram mantidos no corpo do texto para tornar visível a incerteza textual.
