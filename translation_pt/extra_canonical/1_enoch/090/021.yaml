base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/021.yaml
  text: And the Lord of the sheep called those seven first white ones and commanded that they bring before him[a], beginning with the first star that went before those stars whose private parts were like those of horses, that first one which went out before them[e][d][c][b]; and they brought them before him.
translation:
  language: pt
  text: E o Senhor das ovelhas chamou aqueles sete primeiros homens brancos e ordenou que trouxessem à sua presença, começando pela primeira estrela que ia adiante daquelas estrelas cujas partes íntimas eram como as dos cavalos[b][c], aquela primeira estrela que saiu à frente delas[a]; e eles as trouxeram à sua presença.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho “aquela primeira estrela que saiu à frente delas” é textualmente difícil neste testemunho etíope e talvez apenas volte a identificar a estrela que liderava as demais, em vez de introduzir outra figura.
    reason: textual_variant
  - marker: b
    text: Nesta visão, as “estrelas” representam simbolicamente seres celestiais; a tradução conserva a imagem do texto.
    reason: cross_reference
  - marker: c
    text: A comparação com cavalos é uma imagem sexual deliberadamente vergonhosa, provavelmente relacionada à transgressão dos seres celestiais rebeldes.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ ሰብኡ
  choice: o Senhor das ovelhas
  rationale: Mantém o título elevado e a imagem própria do Apocalipse dos Animais, no qual o referente é Deus.
- source_word: ሰብአ ፯ጸዓድወ ቀዳማዊያን
  choice: aqueles sete primeiros homens brancos
  rationale: ሰብአ explicita “homens”; “brancos” preserva a característica visual dos seres e “primeiros” mantém a noção de precedência.
- source_word: ያምጽኡ ቅድሜሁ
  choice: que trouxessem à sua presença
  rationale: Expressa com naturalidade em português a apresentação dos acusados diante do juiz, sem perder o caráter processual da cena.
- source_word: እምክቡበ ቀዳማዊ ዘይቀድም እምነ ዝኩ ከዋክብት
  choice: começando pela primeira estrela que ia adiante daquelas estrelas
  rationale: Interpreta እም em sentido inceptivo, indicando a ordem da apresentação, e conserva a ideia de precedência ou liderança.
- source_word: ከዋክብት
  choice: estrelas
  rationale: Preserva a imagem apocalíptica do texto, em vez de substituí-la diretamente pela interpretação “seres celestiais”.
- source_word: ኃፍረቶሙ ከመ ኃፍረተ አፍራስ
  choice: cujas partes íntimas eram como as dos cavalos
  rationale: Comunica claramente a imagem sexual e vergonhosa do original, sem recorrer a uma formulação excessivamente clínica.
- source_word: '[ወሰነኩበ፡ ቀዳማዊ፡ ዘወፅአ፡ ቅድመ፡]'
  choice: aquela primeira estrela que saiu à frente delas
  rationale: Segue a leitura provável do trecho corrompido ou mal transcrito, no qual o termo subjacente parece ser “estrela”, e conserva a repetição identificadora.
- source_word: ወአምጽእዎሙ ለእሎሙ ቅድሜሁ
  choice: e eles as trouxeram à sua presença
  rationale: O pronome feminino plural retoma naturalmente as estrelas; a repetição da ação preserva a cadência judicial da narrativa.
theological_decisions:
- issue: Se “estrelas” deve ser interpretado diretamente como “anjos” no texto principal
  choice: Manter “estrelas”
  alternative: Traduzir como “anjos” ou “seres celestiais”
  rationale: A visão comunica seu sentido por imagens simbólicas. Manter “estrelas” respeita a forma literária e evita transformar interpretação em tradução.
- issue: Como traduzir a descrição sexual dos seres rebeldes
  choice: “partes íntimas eram como as dos cavalos”
  alternative: Usar “órgãos genitais” ou uma expressão mais eufemística
  rationale: A formulação conserva a força vergonhosa e bestial da imagem, mas permanece digna e compreensível para leitores modernos.
- issue: Se ሰብአ deve aparecer como substantivo explícito
  choice: Traduzir por “homens”
  alternative: Traduzir apenas por “seres” ou “aqueles”
  rationale: O substantivo ge’ez está expresso no texto. Além disso, “homens” integra o código figurativo da visão, no qual seres celestiais aparecem sob forma humana.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe conserva a repetição solene do procedimento judicial e a estranheza própria da visão, sem suavizar sua imagem sexual nem resolver a dificuldade textual do trecho entre colchetes.
