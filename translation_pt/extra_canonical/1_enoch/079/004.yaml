base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/004.yaml
  text: And the waning that is done in the first gate in its season until one hundred and seventy-seven days are completed—by the reckoning of weeks, twenty-five and two days.
translation:
  language: pt
  text: E a diminuição que ocorre no primeiro portal, em seu tempo, até se completarem cento e setenta e sete dias — pela contagem das semanas, vinte e cinco semanas e dois dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታሕጻጼት
  choice: o minguar
  rationale: Expressa de modo natural a diminuição progressiva do astro, preservando a linguagem astronômica do contexto.
- source_word: ይትገበር
  choice: ocorre
  rationale: Embora a forma tenha sentido passivo próximo de “é feito”, “ocorre” comunica em português corrente o processo descrito sem sugerir um agente não explicitado.
- source_word: ቡኖኅት፡ ቀዳሚት
  choice: no primeiro portal
  rationale: Segue a terminologia cosmológica de 1 Enoque; “portal” é mais adequado e tradicional neste contexto do que “porta”.
- source_word: በዘመኑ፡ ዚአሁ
  choice: em seu tempo
  rationale: Mantém a referência ao período próprio ou determinado do fenômeno.
- source_word: ሥርዓተ፡ ሰንበት
  choice: pela contagem das semanas
  rationale: Reproduz a ideia de ordenação ou cálculo por ciclos semanais em português claro.
