base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/003.yaml
  text: And the moon wanes[a], which takes place through the sixth gate; for in this sixth gate its light is completed[c][b], and from it comes the beginning of the waning.
translation:
  language: pt
  text: E a lua míngua[a], o que ocorre pela sexta porta; pois é nessa sexta porta que sua luz se completa[b], e dela vem o início da diminuição[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diminui”. O verbo descreve o minguar da lua.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “chega à plenitude”. O verbo indica que a luz alcança sua medida completa.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a cabeça da diminuição”, isto é, o começo do decréscimo da lua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሐጸጸ
  choice: míngua
  rationale: Verbo simples que expressa a diminuição gradual da lua; “míngua” preserva o sentido lunar específico e corresponde diretamente à forma verbal do ge’ez.
- source_word: ወርኅ
  choice: a lua
  rationale: Termo comum para a lua neste contexto astronômico.
- source_word: ዘይትገበር
  choice: ocorre
  rationale: A forma passiva/reflexiva descreve um processo que se realiza. Em português, “ocorre” é natural sem perder o caráter processual.
- source_word: በሳድስት ኆኅት
  choice: pela sexta porta
  rationale: A preposição apresenta a porta como passagem do astro. “Pela” conserva a imagem cosmológica de movimento através de uma porta.
- source_word: ይትፌጸም
  choice: se completa
  rationale: Indica que a luz chega à sua medida plena ou conclusão antes do início da diminuição.
- source_word: ብርሃኑ ዚአሁ
  choice: sua luz
  rationale: Tradução direta da expressão referente à luz da lua.
- source_word: እምኔሁ
  choice: a partir dela
  rationale: O pronome retoma mais naturalmente a sexta porta e indica o ponto de partida da fase seguinte.
- source_word: ርእሰ ታሕጻጼት
  choice: tem início a diminuição
  rationale: A expressão significa literalmente “cabeça da diminuição”; a formulação portuguesa transmite de modo idiomático o começo ou desencadeamento do decréscimo.
theological_decisions:
- issue: Linguagem cosmológica das portas celestes
  choice: Manter a lua passando “pela sexta porta” e a conclusão de sua luz nessa porta.
  alternative: Parafrasear o versículo apenas como descrição moderna das fases da lua.
  rationale: O texto descreve os movimentos celestes mediante portas e processos ordenados. Preservar essa imagem respeita a cosmologia apocalíptica do testemunho sem harmonizá-la com concepções astronômicas posteriores.
- issue: Relação entre a luz completa e o início da diminuição
  choice: Preservar lado a lado a conclusão da luz e o começo da diminuição.
  alternative: Explicar que a lua começa a minguar imediatamente depois de atingir a plenitude.
  rationale: A explicação cronológica é plausível, mas vai além da formulação concisa do ge’ez. A tradução conserva a tensão e a sequência do texto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A construção preserva a linguagem processual e a imagem das portas celestes, evitando tanto o artificialismo de uma tradução excessivamente literal quanto uma atualização para categorias astronômicas modernas.
