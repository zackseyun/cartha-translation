base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/002.yaml
  text: And he showed me all their ordinances—those for every day and every season[a], and for every year, and for its going out and its command[c][b], in every month and every sabbath.
translation:
  language: pt
  text: 'E ele me mostrou todas as suas ordenanças: as de cada dia, de cada período de domínio[a] e de cada ano, bem como sua saída e seu mandamento[b], em cada mês e em cada sábado.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão etíope também pode ser entendida como “cada tempo de autoridade” ou “cada estação de domínio”. Os sinais numéricos presentes na transcrição parecem ser números de linha incorporados ao texto, não uma referência a 365.
    reason: textual_variant
  - marker: b
    text: O etíope passa aqui do plural (“suas ordenanças”) para formas singulares (“sua saída” e “seu mandamento”). O referente singular exato não é explicitado nesta frase.
    reason: grammatical_ambiguity
  - marker: c
    text: O termo traduzido por “sábado” também pode designar, de modo mais amplo, a “semana” em um contexto calendárico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአርአየኒ
  choice: E ele me mostrou
  rationale: Expressa com naturalidade a apresentação visionária, sem transformar o verbo em uma fórmula técnica de revelação.
- source_word: ኵሎ ሥርዓቶሙ
  choice: todas as suas ordenanças
  rationale: No contexto astronômico, ሥርዓት indica disposições fixas ou normas que regem os astros; “ordenanças” conserva esse caráter regulador.
- source_word: በኵሉ ዕለት
  choice: de cada dia
  rationale: Mantém a enumeração dos ciclos temporais em português corrente.
- source_word: በኵሉ ዘመን ዘበሥልጣን
  choice: de cada período de domínio
  rationale: ዘመን pode ser “tempo”, “período” ou “estação”, enquanto ሥልጣን exprime domínio ou autoridade. A formulação preserva a relação entre ambos sem inserir o número 365, proveniente de marcas editoriais/OCR.
- source_word: በኵሉ ዓመት
  choice: de cada ano
  rationale: Reproduz diretamente o item anual da lista calendárica.
- source_word: ወበሙጻኡ
  choice: bem como sua saída
  rationale: O termo deriva do verbo “sair” e o sufixo é singular. “Saída” deixa em aberto se se trata tecnicamente de surgimento, ascensão ou partida de um astro.
- source_word: ወበትእዛዙ
  choice: e seu mandamento
  rationale: Conserva tanto o sentido autoritativo de ትእዛዝ quanto o sufixo singular, sem suavizá-lo para mera “disposição”.
- source_word: በኵሉ ወርኅ
  choice: em cada mês
  rationale: Equivalência direta e natural para a indicação calendárica.
- source_word: ኵሉ ሰንበት
  choice: cada sábado
  rationale: Mantém o sentido lexical primário e a dimensão sabática do termo, deixando a possível acepção “semana” em nota.
theological_decisions:
- issue: Sentido de ሰንበት no catálogo calendárico
  choice: sábado
  alternative: semana
  rationale: O termo designa literalmente o sábado, embora possa estender-se à semana. Preserva-se no texto a linguagem sabática, sem decidir silenciosamente a ambiguidade contextual.
- issue: Interpretação das formas numerais aparentes no texto transcrito
  choice: tratá-las como números de linha incorporados pelo OCR e não traduzi-las
  alternative: entender ፴፭ como parte de uma referência a 365
  rationale: As formas ፴, ፴፭ e ፵ aparecem em posições que correspondem a marcas editoriais, e a leitura “365” exigiria combinar indevidamente esses artefatos. A tradução segue o texto lexical recuperável e evita introduzir uma cifra ausente.
- issue: Mudança de referentes plurais para sufixos singulares
  choice: preservar “sua” e “seu” no singular
  alternative: harmonizar como “suas saídas” e “seus mandamentos”
  rationale: Os sufixos de ሙጻኡ e ትእዛዙ são singulares. A mudança permanece visível, pois pode apontar para um corpo celeste específico no contexto anterior.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura enumerativa preservada. Evitaram-se tanto a reconstrução indevida de “365” quanto a harmonização dos sufixos singulares. “Ordenanças” e “mandamento” mantêm o campo semântico de ordem cósmica e autoridade sem impor uma leitura confessional.
