base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/001.yaml
  text: And now[a], my son, I have shown you everything[b], and the order of all the stars of heaven has been completed.
translation:
  language: pt
  text: E agora[a], meu filho, eu lhe mostrei tudo, e a ordem de todas as estrelas do céu foi completada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “E neste momento”.
    reason: Alternativa lexical para o marcador temporal e discursivo.
  - marker: b
    text: Ou “foi cumprida”. A expressão pode referir-se tanto à conclusão da descrição quanto ao cumprimento da própria ordem celestial.
    reason: Preserva a ambiguidade do verbo completivo e do referente da conclusão.
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Funciona como marcador de transição ou conclusão e mantém o fluxo direto do discurso.
- source_word: ወልድየ
  choice: meu filho
  rationale: Preserva o tratamento filial próprio de uma instrução sapiencial e revelatória.
- source_word: ኵሎ
  choice: tudo
  rationale: É o objeto totalizante de “mostrei” e soa natural em português.
- source_word: አርአይኩከ
  choice: eu lhe mostrei
  rationale: Expressa o ato de mostrar ou revelar e conserva a referência explícita ao destinatário.
- source_word: ተፈጸመት
  choice: foi completada
  rationale: Mantém o sentido passivo e completivo sem sugerir necessariamente a extinção ou cessação dos astros.
- source_word: ሥርዓተ
  choice: ordem
  rationale: Designa a disposição ou sistema regulado dos corpos celestes; “ordem” é natural e mantém a amplitude semântica.
- source_word: ኵሉ ከዋክብተ ሰማያት
  choice: todas as estrelas do céu
  rationale: Conserva a totalidade e o registro cósmico da expressão, sem duplicar ኵሉ com “toda a ordem”.
theological_decisions:
- issue: Se a oração descreve a conclusão da exposição revelada ou o cumprimento da própria ordem celestial
  choice: a ordem de todas as estrelas do céu foi completada
  alternative: foi concluída a exposição da ordem de todas as estrelas do céu
  rationale: A formulação conserva a construção passiva do ge’ez e sua ambiguidade genuína. O contexto instrutivo favorece a conclusão da exposição, mas o texto também pode ser ouvido como referência ao cumprimento da própria ordem celestial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação “eu lhe mostrei” evita excessiva informalidade sem recorrer a linguagem arcaica; a passiva conserva a tensão interpretativa do original.
