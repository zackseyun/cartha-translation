base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/003.yaml
  text: And by the edges of those valleys I saw fragrant cinnamon[c][b][a], and beyond them I went toward the east.
translation:
  language: pt
  text: E, às bordas daqueles vales[a], vi canela perfumada; e, para além deles[b], segui em direção ao leste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida por “junto às margens daqueles vales”.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “passando por eles” ou “em direção ao que fica além deles”.
    reason: lexical_alternative
  - marker: c
    text: O verbo também pode ser traduzido por “aproximei-me do leste” ou “avancei em direção ao leste”.
    reason: lexical_alternative
lexical_decisions:
- source_word: መንገለ
  choice: junto a / depois de / em direção a
  rationale: 'A forma prepositiva aparece três vezes, com força espacial ajustada ao contexto: proximidade às bordas dos vales, movimento para além deles e direção ao leste. Uma única tradução rígida seria pouco natural em português.'
- source_word: ክንፈሩ
  choice: bordas
  rationale: Neste contexto topográfico, o termo indica as bordas ou margens dos vales, não uma asa literal; “bordas” preserva com precisão a imagem espacial.
- source_word: ቈላት
  choice: vales
  rationale: É um termo de relevo que pode designar vales, ravinas ou uádis; “vales” é claro, natural e adequado à geografia visionária.
- source_word: ርኢኩ
  choice: vi
  rationale: Mantém a forma direta e corrente do relato visionário em primeira pessoa.
- source_word: ቀናንሞስ
  choice: canela
  rationale: O empréstimo designa uma especiaria aromática do tipo canela ou cássia; “canela” é o equivalente concreto mais reconhecível em português.
- source_word: ዘመዓዛ
  choice: perfumada
  rationale: A expressão caracteriza a canela por seu aroma; “perfumada” conserva de modo natural a dimensão sensorial.
- source_word: ቀረብኩ
  choice: segui
  rationale: O verbo denota aproximação ou avanço. No encadeamento geográfico do versículo, “segui” comunica movimento continuado sem sugerir que o narrador já tenha chegado ao destino.
- source_word: ጽባሕ
  choice: leste
  rationale: No contexto geográfico, refere-se à direção ou região do nascente; “em direção ao leste” é claro e idiomático.
theological_decisions:
- issue: Identificação da planta aromática na paisagem apocalíptica
  choice: canela
  alternative: cássia ou uma planta aromática não especificada
  rationale: O termo ge’ez aponta para uma especiaria aromática conhecida. A tradução concreta preserva a imagem visionária, enquanto a alternativa genérica a enfraqueceria.
translation_notes:
  register: Português moderno, digno e acessível, com cadência narrativa simples. “Bordas” mantém a precisão topográfica; “canela perfumada” conserva a imagem sensorial concreta; as notas registram sem resolver em excesso as ambiguidades de movimento e direção.
