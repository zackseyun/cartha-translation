base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/001.yaml
  text: And above them[a], above those mountains of the east, not far away, I saw another place, a valley of waters[c][b], as though it were inexhaustible.
translation:
  language: pt
  text: 'E acima deles, acima daqueles montes[a] do leste, não muito longe, vi outro lugar: um vale de águas, como se fosse inesgotável[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma etíope transmitida antes de “montes” é incerta. A leitura adotada entende a expressão como “acima daqueles montes do leste”; também se poderia traduzir simplesmente “acima dos montes do leste”.
    reason: textual_variant
  - marker: b
    text: A cláusula final em etíope é difícil. Também pode significar “como se não pudesse ser esvaziado” ou “como se não se esgotasse”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ላዕሌሁ / ላዕለ
  choice: acima deles / acima de
  rationale: A repetição da preposição preserva a elevação espacial e a progressão da geografia visionária.
- source_word: እሙንቱ
  choice: deles / daqueles
  rationale: Mantém a referência anafórica plural sem identificar além do que o contexto permite.
- source_word: ተደብረ ጽባሕ
  choice: montes do leste
  rationale: Segue a revisão filológica que reconhece em ጽባሕ a indicação do leste e entende a forma anterior, corrompida no testemunho OCR, como 'montes de'.
- source_word: አኮ ርሑቀ
  choice: não muito longe
  rationale: Expressa com naturalidade a proximidade espacial relativa e conserva sua posição antes do relato de visão.
- source_word: ወርኢኩ
  choice: vi
  rationale: É a fórmula direta e natural do relato visionário em português atual.
- source_word: መካነ ካልአ
  choice: outro lugar
  rationale: Preserva a passagem sequencial para uma nova localidade da visão.
- source_word: ቈላ
  choice: vale
  rationale: Designa de modo amplo uma região baixa ou depressão, sem estreitar a imagem para ravina ou desfiladeiro.
- source_word: ማያት
  choice: águas
  rationale: Mantém o plural do ge'ez e o tom elevado da imagem visionária.
- source_word: ከመ ዘኢይትዌጸእ
  choice: como se fosse inesgotável
  rationale: Conserva o caráter impressionista da cláusula difícil sem decidir entre as possibilidades de não se esvaziar ou não se esgotar.
theological_decisions:
- issue: Concretude da geografia visionária
  choice: 'Apresentar o cenário como um lugar efetivamente visto na visão: ''outro lugar: um vale de águas''.'
  alternative: Interpretar o vale simbolicamente ou generalizá-lo como 'um lugar com água'.
  rationale: A tradução preserva a topografia concreta do discurso apocalíptico e não introduz uma interpretação alegórica no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de 'acima' e o plural 'águas' foram mantidos para conservar a estrutura e a textura visionária do ge'ez.
