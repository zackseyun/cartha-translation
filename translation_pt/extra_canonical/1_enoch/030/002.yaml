  text: And I saw a beautiful tree[a], which resembled a fragrant tree[b], like the mastic tree.
translation:
  language: pt
  text: E vi uma bela árvore, que se parecia com uma árvore aromática[a], como o lentisco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujo aroma era semelhante ao do lentisco”. A construção também pode ser entendida como uma comparação centrada na fragrância.'
    reason: lexical_alternative
  - marker: b
    text: A identificação da planta é incerta. Provavelmente se trata do lentisco, também conhecido como árvore-da-mástique, cuja resina é aromática.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: Mantém a conjunção narrativa e traduz diretamente o verbo visionário na primeira pessoa.
- source_word: ዕፀ ሠናየ
  choice: uma bela árvore
  rationale: ዕፀ designa árvore ou madeira, e ሠናየ expressa beleza ou excelência; “bela árvore” é claro e natural.
- source_word: ዘይመስል
  choice: que se parecia com
  rationale: Preserva explicitamente a ideia de semelhança expressa pelo verbo, sem a reduzir apenas a uma comparação de aromas.
- source_word: ዕፀ መዓዛ
  choice: uma árvore aromática
  rationale: Reproduz o segundo termo “árvore” e entende መዓዛ como aroma ou fragrância, mantendo a formulação concreta do ge’ez.
- source_word: ከመ
  choice: como
  rationale: Equivalente comparativo direto e natural em português.
- source_word: እንተ ዘስኪኖን
  choice: o lentisco
  rationale: O nome vegetal é incerto, mas costuma ser associado ao lentisco, árvore cuja resina aromática é chamada mástique; a incerteza é indicada em nota.
