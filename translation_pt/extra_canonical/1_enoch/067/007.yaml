base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/007.yaml
  text: And through its valleys come rivers of fire, where those angels shall be judged who led astray those who dwell upon the dry land.
translation:
  language: pt
  text: E por seus vales correm rios de fogo,[a] onde serão julgados aqueles anjos que desencaminharam os que habitam sobre a terra seca.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “correntes de fogo”.
    reason: lexical_alternative
  - marker: b
    text: A expressão significa literalmente “os que habitam sobre a terra seca” e pode referir-se, de modo geral, aos habitantes humanos da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: እነተ፡ ቈላት፡ ዚአሃ
  choice: por seus vales
  rationale: 'Segue a análise contextual mais recente: ቈላት é o plural de “vale”, recorrente nos versículos anteriores, e ዚአሃ retoma a terra mencionada no contexto. “Por seus vales” preserva a relação espacial.'
- source_word: አፍላገ፡ እሳት
  choice: rios de fogo
  rationale: Mantém literalmente a imagem apocalíptica de corpos de fogo que correm pelos vales; “correntes de fogo” é uma alternativa possível.
- source_word: ይመጽኡ
  choice: correm
  rationale: O imperfeito admite valor presente ou futuro na narrativa visionária. Com “rios”, “correm” expressa naturalmente o movimento sem convertê-lo em passado.
- source_word: ኀበ
  choice: onde
  rationale: Introduz o lugar associado ao julgamento e produz uma construção idiomática em português.
- source_word: ይትኴነኑ
  choice: serão julgados
  rationale: Conserva o sentido passivo e judicial sem antecipar explicitamente o resultado como condenação.
- source_word: እልኩቱ፡ መላእክት
  choice: aqueles anjos
  rationale: No contexto apocalíptico de 1 Enoque, “anjos” é mais preciso que o genérico “mensageiros”; o demonstrativo foi preservado.
- source_word: አስሐትዎሙ
  choice: desencaminharam
  rationale: 'Preserva o valor causativo: os anjos fizeram outros se desviar. A forma é natural e moralmente significativa em português.'
- source_word: ለእለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: os que habitam sobre a terra seca
  rationale: Mantém a formulação cosmológica concreta do ge'ez, em vez de reduzi-la simplesmente a “os habitantes da terra”.
theological_decisions:
- issue: Identidade dos anjos julgados
  choice: Traduzir apenas como “aqueles anjos que desencaminharam”
  alternative: Identificá-los explicitamente como os Vigilantes da tradição de Gênesis 6
  rationale: O versículo não oferece essa identificação específica. A tradução preserva a referência local e evita importar uma interpretação teológica mais estreita.
- issue: Natureza do julgamento
  choice: “serão julgados”
  alternative: “serão condenados”
  rationale: O verbo expressa julgamento; embora o contexto possa sugerir condenação, o texto não exige que o resultado seja explicitado na tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens concretas do ge'ez foram preservadas, enquanto “correm” torna natural em português o movimento dos rios no presente visionário.
