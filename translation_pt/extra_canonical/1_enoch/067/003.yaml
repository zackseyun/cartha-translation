base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/003.yaml
  text: And I will establish your offspring before me forever and ever[a], and I will make those who dwell with you fruitful. It shall not be barren upon the face of the dry ground[c][b], but it shall be blessed and multiplied on the dry ground in the name of the Lord.
translation:
  language: pt
  text: E firmarei a tua descendência diante de mim para todo o sempre, e semearei os que habitam contigo. Ela não será estéril[a][c] sobre a face do solo seco[b], mas será abençoada e se multiplicará no solo seco, em nome do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez transmitido nesta cláusula é incerto e está marcado como problemático. A tradução adota uma emenda graficamente próxima com o sentido de “não será estéril”, favorecida pelo contraste com “abençoada” e “se multiplicará”.
    reason: textual_variant
  - marker: b
    text: “Solo seco” traduz literalmente a expressão ge'ez. Aqui ela também pode ter o sentido mais geral de “terra” ou “solo”.
    reason: lexical_alternative
  - marker: c
    text: 'A leitura transmitida seria aproximadamente: “Ela não aconselhará sobre a face do solo seco”. O sentido dessa leitura no contexto é obscuro.'
    reason: previous_rendering
lexical_decisions:
- source_word: አጸንዖ
  choice: firmarei
  rationale: Expressa a ideia de tornar firme ou estabelecer; “firmarei” conserva a força da promessa e soa natural em português.
- source_word: ዘርእከ
  choice: a tua descendência
  rationale: Preserva o sentido coletivo de “semente” como linhagem, sem sugerir apenas um descendente individual.
- source_word: በቅድሜየ
  choice: diante de mim
  rationale: Tradução direta que mantém tanto a dimensão de presença quanto o registro solene.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Fórmula portuguesa corrente que comunica a intensificação da expressão etíope de perpetuidade.
- source_word: አዘርኦሙ
  choice: farei frutificar
  rationale: O verbo pertence ao campo de semear ou produzir descendência. No contexto de esterilidade, bênção e multiplicação, “farei frutificar” exprime naturalmente seu valor causativo positivo.
- source_word: እለ ያኃድሩ ምስሌከ
  choice: os que habitam contigo
  rationale: Mantém a ideia de coabitação e o tom elevado sem linguagem arcaica excessiva.
- source_word: †ኢይመክር
  choice: não será estéril
  rationale: O texto transmitido, marcado como problemático, parece dizer literalmente “não aconselhará”; adota-se a emenda graficamente próxima que significa “não será estéril”, por sua coerência com bênção e multiplicação, registrando-se a incerteza em nota.
- source_word: ገጸ የብስ
  choice: a face do solo seco
  rationale: Conserva a imagem concreta da expressão literal, em vez de reduzi-la silenciosamente a “terra”.
- source_word: ይትባረክ
  choice: será abençoada
  rationale: O singular concorda com “descendência”, e a voz passiva é a leitura mais natural no contexto.
- source_word: ይትባዛሕ
  choice: se multiplicará
  rationale: Reproduz a linguagem habitual de aumento da descendência e mantém a referência singular coletiva.
- source_word: በስሙ ለእግዚአ
  choice: em nome do Senhor
  rationale: É a formulação portuguesa natural para a esfera ou agência associada ao nome divino.
theological_decisions:
- issue: Se a promessa deve ser formulada explicitamente em termos de aliança
  choice: Mantida como “firmarei a tua descendência diante de mim para todo o sempre”
  alternative: “Estabelecerei uma aliança eterna com a tua descendência”
  rationale: A linguagem tem peso de promessa e permanência, mas o texto não menciona explicitamente uma aliança; acrescentá-la resolveria teologicamente mais do que a fonte permite.
- issue: Como tratar a cláusula textual difícil †ኢይመክር
  choice: Adotar no texto “não será estéril”, com notas transparentes
  alternative: “não aconselhará” ou “não deliberará”
  rationale: A leitura transmitida é semanticamente difícil e está assinalada como suspeita. A emenda para “ser estéril” é graficamente próxima e se ajusta ao contraste com bênção e multiplicação, mas a leitura literal foi preservada nas notas para não ocultar a incerteza.
- issue: Referente dos verbos singulares de bênção e multiplicação
  choice: “Ela”, retomando a descendência coletiva
  alternative: “Eles”, retomando os que habitam contigo
  rationale: As formas verbais estão no masculino singular e se ligam mais naturalmente ao substantivo coletivo singular “descendência”, evitando deslocar a promessa para o grupo plural.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Emprega “tu” por corresponder ao singular da fonte e evita arcaísmos desnecessários. A repetição de “solo seco” foi mantida para refletir a repetição do original.
