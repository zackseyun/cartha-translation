base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/001.yaml
  text: And in those days the word of the Lord came to me[a], and he said to me, “Noah, your portion has come up before me—a portion without blame[b], a portion of love and uprightness.”
translation:
  language: pt
  text: 'E naqueles dias, a palavra do Senhor veio a mim e me disse: “Noé, tua porção subiu até mim[a] — uma porção sem culpa[b], uma porção de amor e retidão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tua sorte ascendeu diante de mim”. O ge’ez conserva a imagem de movimento para cima, até a presença divina.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida por “sem culpa” também pode significar “irrepreensível” ou “sem censura”. Como esta parte das Parábolas está preservada, na prática, apenas em ge’ez, a nuance deve ser considerada com alguma cautela.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበእማንቱ፡ መዋዕል
  choice: E naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica recorrente e seu registro elevado, em português natural.
- source_word: ቃለ፡ እግዚአብሔር
  choice: a palavra do Senhor
  rationale: Mantém a fórmula profética de revelação sem reduzir o termo a uma fala qualquer.
- source_word: ኀቤየ
  choice: a mim
  rationale: Com o verbo 'veio', expressa naturalmente em português o movimento da palavra em direção ao narrador.
- source_word: ኖኅ
  choice: Noé
  rationale: Forma bíblica convencional do nome em português.
- source_word: ክፍልከ
  choice: a sua porção
  rationale: Preserva a amplitude entre parte atribuída, sorte, herança e condição designada; 'sua' favorece legibilidade internacional e brasileira.
- source_word: ዐርገ፡ ኀቤየ
  choice: subiu até a minha presença
  rationale: Conserva explicitamente a imagem vertical do verbo e torna idiomático o sentido de chegada perante Deus.
- source_word: ዘአልቦቱ፡ ሒስ
  choice: sem culpa
  rationale: Retém a nuance judicial ou reputacional da ausência de acusação, sem afirmar de modo inequívoco perfeição moral absoluta.
- source_word: ፍቅር
  choice: amor
  rationale: Mantém o substantivo e a estrutura paralela da caracterização da porção.
- source_word: ወርትዕ
  choice: retidão
  rationale: Expressa correção ética e integridade sem impor uma formulação doutrinária posterior.
theological_decisions:
- issue: Sentido da 'porção' de Noé no contexto revelatório e judicial
  choice: a sua porção subiu até a minha presença
  alternative: a sua sorte ascendeu diante de mim
  rationale: A formulação conserva a ambiguidade entre herança, lugar atribuído e condição reconhecida diante de Deus, além da imagem de movimento ascendente.
- issue: Se a expressão ዘአልቦቱ ሒስ declara perfeição moral absoluta
  choice: sem culpa
  alternative: irrepreensível
  rationale: '''Sem culpa'' preserva a força elogiosa e a possível nuance forense, mas evita resolver a expressão como uma afirmação técnica de impecabilidade.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo solene do texto, sem arcaísmos. Os marcadores [a] e [b] aparecem no texto principal e correspondem às notas.
