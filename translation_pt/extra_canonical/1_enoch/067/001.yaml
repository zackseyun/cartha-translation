  naturalness: O registro é digno e claro. A substituição de «a sua» por «a tua» no discurso direto elimina uma possível leitura de terceira pessoa e soa natural em registro bíblico-literário compreensível tanto no Brasil quanto internacionalmente. «Subiu até mim» também é mais fluente.
