base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/009.yaml
  text: And as the burning of their bodies is very great[a], so a change comes upon them in spirit forever and ever[c][b], because before the Lord of Spirits there is none who speaks a vain word.
translation:
  language: pt
  text: E, assim como o ardor de seus corpos é muito intenso, também lhes sobrevém uma mudança no espírito para todo o sempre[a], porque diante do Senhor dos Espíritos não há ninguém que diga uma palavra vã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha etíope é difícil. A oração também pode ser entendida mais literalmente assim: “desse modo, há para eles uma mudança de espírito para todo o sempre”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ውዕየ
  choice: ardor
  rationale: Expressa calor abrasador ou queima de modo concreto e natural em português, preservando a imagem apocalíptica sem recorrer ao termo técnico e pouco idiomático “combustão”.
- source_word: ሥጋሆሙ
  choice: seus corpos
  rationale: Embora o sentido literal seja “sua carne”, “seus corpos” comunica com clareza o referente físico no contexto de juízo e mantém a força corporal da expressão.
- source_word: ተውላጠ
  choice: lhes sobrevém uma mudança
  rationale: Preserva o sentido resultativo de alteração sem especificar indevidamente a natureza ou o agente dessa mudança.
- source_word: ለመንፈስ
  choice: no espírito
  rationale: Entende a expressão preposicional como esfera ou aspecto da mudança, mantendo o contraste com o ardor corporal; a construção também admite a leitura “mudança de espírito”, registrada em nota.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: É uma expressão portuguesa corrente e solene para a fórmula enfática de duração ilimitada.
- source_word: እግዚአ መንፈሳት
  choice: Senhor dos Espíritos
  rationale: Mantém como título divino reconhecível a fórmula característica das Parábolas de Enoque.
- source_word: ዘይነግር ነገረ በከ
  choice: que diga uma palavra vã
  rationale: Reproduz a construção cognata ligada ao ato de falar e entende በከ como “vão, vazio”, evitando a antiga leitura indevida “contra eles”.
theological_decisions:
- issue: Natureza da mudança relacionada ao espírito
  choice: Uma mudança lhes sobrevém no espírito
  alternative: Há para eles uma mudança de espírito
  rationale: A sintaxe etíope é difícil e permite mais de uma relação entre “mudança” e “espírito”. O texto principal apresenta uma leitura natural sem definir se há transformação ontológica, enquanto a nota preserva a alternativa mais literal.
- issue: Alcance temporal da mudança
  choice: para todo o sempre
  alternative: pela era das eras
  rationale: A fórmula foi entendida segundo seu valor idiomático enfático, sem introduzir uma teoria específica sobre eras ou estados intermediários.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. Conservou-se o paralelismo entre o sofrimento corporal e a mudança no espírito, bem como a ambiguidade sintática real da segunda oração.
