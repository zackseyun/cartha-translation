base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/008.yaml
  text: And in those days those waters will be for the kings and the mighty and the exalted[a], and for those who dwell on the dry ground, for the healing of the body and for the punishment of the spirit; and their spirit will be full of pleasure, so that their bodies may be judged, because they have denied the Lord of Spirits, and they see their judgment every day[d][c][b], yet they do not believe in his name.
translation:
  language: pt
  text: E naqueles dias, aquelas águas servirão aos reis, aos poderosos e aos exaltados, e aos que habitam em terra seca, para a cura do corpo e para o castigo do espírito; e o espírito deles ficará cheio de prazer[a], para que seus corpos sejam julgados, porque negaram o Senhor dos Espíritos e veem seu julgamento todos os dias, mas não creem em seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “cheio de prazer” é difícil neste contexto de castigo e julgamento. O ge’ez parece empregar um termo positivo, que também pode ser entendido como “deleite” ou “doçura”; por isso, a tensão foi preservada em vez de se impor um sentido negativo por conjectura.
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica recorrente em linguagem portuguesa natural.
- source_word: ማያት
  choice: aquelas águas
  rationale: Mantém o plural e a referência às águas já presentes no contexto.
- source_word: ለነገሥት ወለዐዚዛን ወለልዑላን
  choice: aos reis, aos poderosos e aos exaltados
  rationale: Conserva os três grupos e o registro elevado sem fundir os termos.
- source_word: ወለእለ የኃድሩ ዲበ የብስ
  choice: e aos que habitam em terra seca
  rationale: Retém a imagem concreta da terra seca em contraste com as águas.
- source_word: ለፈውሰ ሥጋ
  choice: para a cura do corpo
  rationale: Expressa o sentido físico de cura; 'corpo' é mais natural e menos sujeito a conotações moralizadas que 'carne'.
- source_word: ወለአዝነ መንፈስ
  choice: e para o castigo do espírito
  rationale: Reflete a força punitiva do termo no contexto de juízo, sem suavizá-lo como mera correção pedagógica.
- source_word: ወትውኔተ ይመልእ መንፈሶሙ
  choice: e o espírito deles ficará cheio de prazer
  rationale: Mantém o provável sentido positivo do termo difícil, deixando explícita em nota a tensão com o contexto punitivo.
- source_word: ከመ ይትኰነኑ ሥጋሆሙ
  choice: para que seus corpos sejam julgados
  rationale: Preserva a construção final e o valor judicial sem intensificá-lo para 'condenados'.
- source_word: እስመ ክሕድዎ ለእግዚአ መንፈሳት
  choice: porque negaram o Senhor dos Espíritos
  rationale: Traduz diretamente a forte oposição expressa pelo verbo e conserva o título característico da obra.
- source_word: ወይሬእዩ ኵነኔሆሙ እንተ ኵሉ ዕለት
  choice: e veem seu julgamento todos os dias
  rationale: Mantém o sentido forense e verte a expressão temporal de modo idiomático.
- source_word: ወኢየአምኑ በስሙ
  choice: mas não creem em seu nome
  rationale: O adversativo explicita naturalmente em português o contraste já presente na sequência, sem alterar seu conteúdo.
theological_decisions:
- issue: Caráter benéfico ou punitivo das águas
  choice: Conservar lado a lado 'cura do corpo' e 'castigo do espírito'.
  alternative: Interpretar toda a linguagem de cura ironicamente ou tornar toda a ação exclusivamente punitiva.
  rationale: O texto combina cura, castigo e juízo. Preservar essa tensão evita impor uma harmonização doutrinária.
- issue: Sentido de ትውኔተ na cláusula difícil
  choice: Traduzir por 'prazer' e assinalar a dificuldade em nota.
  alternative: Deleite, doçura, indulgência ou uma conjectura de sentido negativo.
  rationale: O valor positivo é lexicalmente plausível, embora inesperado no contexto; a nota comunica a incerteza sem emendar silenciosamente o texto.
- issue: Distinção entre corpo e espírito
  choice: Manter ambos como referentes distintos na formulação.
  alternative: Fundir os termos numa única metáfora antropológica.
  rationale: O verso atribui cura ao corpo, castigo ao espírito e juízo aos corpos; a tradução deve conservar essa estrutura sem construir uma doutrina antropológica além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe longa e solene conserva o fluxo visionário do texto, enquanto escolhas como “terra seca”, “corpo”, “espírito” e “Senhor dos Espíritos” mantêm suas imagens e terminologia próprias.
