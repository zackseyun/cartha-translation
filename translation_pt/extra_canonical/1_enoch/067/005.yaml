  text: And I saw that valley in which there was a great convulsion and a convulsion of waters[a].
translation:
  language: pt
  text: E vi aquele vale, onde havia uma grande agitação e uma agitação das águas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma grande convulsão ... e uma convulsão das águas». O termo ge''ez repetido parece enfatizar uma perturbação violenta no vale, mas seu sentido exato pode variar entre agitação, tumulto e convulsão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዋ
  choice: E vi
  rationale: Mantém a conjunção que dá sequência à visão e traduz de modo direto o verbo de percepção.
- source_word: ለይእቲ ቈላ
  choice: aquele vale
  rationale: ቈላ designa uma região baixa ou depressão; «vale» é natural em português e se ajusta à paisagem do contexto.
- source_word: እንተ ሀውከ ዓቢይ ባቲ
  choice: onde havia uma grande convulsão
  rationale: A construção relativa localiza o fenômeno no vale. «Convulsão» preserva a força física e apocalíptica de ሀውከ sem especificar indevidamente um terremoto.
- source_word: ወሀውከ ማያት
  choice: e uma convulsão de águas
  rationale: Repete «convulsão» para conservar o efeito retórico do termo ge'ez repetido e mantém o plural «águas».
theological_decisions:
- issue: Natureza da perturbação no vale
  choice: Imagem de perturbação físico-cósmica expressa por «convulsão»
  alternative: grande agitação; grande comoção; grande reviravolta
  rationale: O contexto visionário favorece uma perturbação concreta e violenta da criação, mas a tradução evita acrescentar a ideia específica de terremoto, que não está explícita no ge'ez.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição incomum foi preservada por corresponder à retórica do texto-fonte; «águas» conserva o plural original.
