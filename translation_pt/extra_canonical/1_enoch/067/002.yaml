base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/002.yaml
  text: And now the angels are making a wooden structure[a]; and when the angels have finished that, I will place my hand upon it and guard it, and from it there will come the seed of life, and a transformation will occur[e][d][c][b], so that the dry ground may not remain barren.
translation:
  language: pt
  text: E agora os anjos estão fazendo uma estrutura de madeira[a]; e, quando os anjos a tiverem terminado, porei minhas mãos sobre ela e a guardarei[b]. Dela procederá a semente da vida[c], e ocorrerá uma transformação, para que a terra seca não permaneça estéril.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez desta passagem é difícil. O termo pode designar madeira, madeiras, uma obra de madeira ou uma estrutura de madeira; no contexto, provavelmente alude à arca de Noé.
    reason: lexical_alternative
  - marker: b
    text: 'A construção de algumas cláusulas é incerta. Uma possibilidade é: “e, quando tiverem terminado tudo isso, os anjos porão minhas mãos sobre ela e a guardarão”.'
    reason: textual_variant
  - marker: c
    text: “Semente da vida” traduz literalmente a expressão. Ela pode indicar descendência que traz vida, poder gerador ou fertilidade renovada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብሩ
  choice: estão fazendo
  rationale: O imperfeito pode expressar ação em curso ou iminente na narrativa visionária; a forma progressiva preserva a vivacidade da cena.
- source_word: መላእክት
  choice: anjos
  rationale: No contexto apocalíptico de 1 Enoque, trata-se de seres celestiais, não meramente de mensageiros humanos.
- source_word: ዕፀወ
  choice: uma estrutura de madeira
  rationale: O termo pertence ao campo semântico de madeira/árvore e pode indicar madeiras ou obra de madeira. O contexto de Noé e os pronomes femininos singulares subsequentes favorecem uma construção única, sem inserir explicitamente 'arca' no texto.
- source_word: ወድኡ
  choice: a tiverem terminado
  rationale: 'O verbo indica conclusão e se encaixa na sequência temporal: os anjos constroem, terminam e então ocorre a ação seguinte.'
- source_word: እወዲ እዴየ ዲቤሃ
  choice: porei minha mão sobre ela
  rationale: A cláusula contém primeira pessoa, referência à mão e a expressão 'sobre ela'. O texto apresentado traz እዴየ, normalmente 'minhas mãos', mas a tradição de tradução e a sintaxe são difíceis; o singular produz português natural sem ocultar a incerteza, registrada em nota.
- source_word: እዐቅባ
  choice: a guardarei
  rationale: O verbo denota guardar, vigiar ou preservar; 'guardar' mantém de modo conciso o sentido protetor.
- source_word: ዘርአ ሕይወት
  choice: a semente da vida
  rationale: A tradução literal preserva a imagem e deixa em aberto se ela indica descendência vivificante, potência geradora ou fertilidade renovada.
- source_word: ተወላጥ ይባእ
  choice: ocorrerá uma transformação
  rationale: A expressão difícil aponta para mudança ou surgimento resultante. Esta formulação é natural e evita especificar indevidamente crescimento agrícola.
- source_word: የብስ ዕራቆ
  choice: a terra seca não permaneça estéril
  rationale: Os termos evocam secura e falta de produtividade; a formulação conserva a imagem concreta ligada à fertilidade.
theological_decisions:
- issue: Renovação agrícola literal ou imagem simbólica de vida emergente no cenário visionário
  choice: Manter as imagens concretas de estrutura de madeira, semente da vida e terra seca sem explicá-las como mera agricultura nem como símbolo inequívoco de ressurreição ou nova criação.
  alternative: Interpretar toda a passagem como preparação literal para cultivo, ou como representação puramente simbólica de ressurreição/nova criação.
  rationale: O texto permite uma imagem visionária em camadas e não obriga a uma única leitura teológica.
- issue: Identificação explícita da estrutura como a arca de Noé
  choice: Traduzir 'uma estrutura de madeira' e deixar a identificação contextual implícita.
  alternative: Traduzir diretamente 'a arca'.
  rationale: O contexto e os pronomes singulares favorecem a arca, mas o substantivo fonte designa madeira ou obra de madeira, não emprega de modo inequívoco o nome 'arca'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa foi preservada, e as dificuldades do ge'ez foram expostas em notas sem sobrecarregar o texto principal.
