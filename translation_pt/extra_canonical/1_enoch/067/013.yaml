base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/013.yaml
  text: For these waters of judgment are for the healing of the flesh of the kings and for the lust of their flesh[b][a]; and because of this they do not see and do not believe that those waters will change and become a fire that burns forever and ever.
translation:
  language: pt
  text: Pois estas águas de juízo[b][a] destinam-se à cura da carne dos reis e ao desejo da carne deles; por isso, eles não veem nem creem que aquelas águas se transformarão e se tornarão um fogo que arde para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «esta água de juízo», se o termo em ge'ez for entendido coletivamente; mantém-se o plural para preservar a imagem da cena.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução do trecho inicial: «Pois estas são águas de juízo».'
    reason: previous_rendering
lexical_decisions:
- source_word: እስመ
  choice: pois
  rationale: Introduz uma explicação ou fundamento e conserva o tom elevado sem tornar a relação mais específica do que o ge'ez permite.
- source_word: እሉ
  choice: estas
  rationale: Demonstrativo plural que aponta para as águas presentes na visão imediata.
- source_word: ማየ
  choice: águas
  rationale: O plural preserva a imagem apocalíptica concreta; o singular coletivo também é possível e fica registrado em nota.
- source_word: ኵነኔ
  choice: juízo
  rationale: Mantém a amplitude judicial e apocalíptica do termo, sem restringi-lo a condenação ou castigo.
- source_word: ፍትወተ
  choice: desejo
  rationale: Preserva a possível amplitude do termo entre desejo e cobiça carnal; «luxúria» ou «concupiscência» resolveriam a nuance de modo mais estreito e confessional.
- source_word: ለፈውሰ
  choice: à cura
  rationale: Expressa a finalidade indicada pelo texto e mantém a tensão entre a aparente função curativa das águas e sua transformação posterior em fogo.
theological_decisions:
- issue: Se ኵነኔ deve indicar o ato judicial amplo ou apenas seu resultado punitivo
  choice: juízo
  alternative: condenação; castigo
  rationale: «Juízo» conserva tanto a ação judicial divina quanto seu possível resultado punitivo, sem antecipar uma interpretação mais estreita.
- issue: Se o desejo da carne deve ser explicitamente caracterizado como pecaminoso
  choice: desejo da carne deles
  alternative: luxúria da carne deles; concupiscência da carne deles
  rationale: A formulação escolhida preserva a tensão e a ambiguidade lexical, evitando inserir terminologia doutrinária posterior.
- issue: Relação entre cura e juízo
  choice: manter ambas as ideias sem explicação harmonizadora
  alternative: interpretar a cura como punição ou alívio enganoso
  rationale: O texto contrapõe a finalidade associada à cura e ao desejo carnal à futura transformação das águas em fogo; a tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a repetição de «carne», o vocabulário judicial de «juízo» e a fórmula enfática «para todo o sempre». A tradução incorpora a continuação do versículo atestada após a mudança de página, embora o campo de fonte original apresentado esteja truncado.
