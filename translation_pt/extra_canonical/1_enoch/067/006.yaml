base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/006.yaml
  text: And when all this happened[a], from that fiery stream and their convulsion in that place, a smell of sulfur was produced and joined with those waters[c][b]; and that valley of the angels who led astray burns beneath that land.
translation:
  language: pt
  text: E, quando tudo isso aconteceu, daquela torrente de fogo e da convulsão deles naquele lugar surgiu um cheiro de enxofre[a], que se uniu àquelas águas[b][c]; e aquele vale dos anjos que desencaminharam arde debaixo daquela terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo subjacente também pode ser expresso pela palavra tradicional inglesa “brimstone”, isto é, “enxofre”.
    reason: lexical_alternative
  - marker: b
    text: O ge'ez deste versículo é difícil em alguns pontos; “se uniu àquelas águas” também pode ser entendido como “misturou-se àquelas águas”.
    reason: alternative_reading
  - marker: c
    text: 'Outra possível segmentação da frase é: “E, quando tudo isso aconteceu, daquela torrente de fogo, e naquele lugar surgiu um cheiro de enxofre”. Essa leitura não traduz de modo explícito a referência à convulsão deles.'
    reason: alternative_reading
lexical_decisions:
- source_word: ነጠብጣብ እሳት
  choice: torrente de fogo
  rationale: Expressa o fluxo contínuo de fogo sugerido pela imagem etíope, em português natural e sem reduzir a expressão a simples gotas.
- source_word: ሀውኮሙ
  choice: convulsão deles
  rationale: Conserva o sentido forte de agitação ou convulsão e o sufixo possessivo plural, sem suavizar a dificuldade da construção.
- source_word: መካን
  choice: lugar
  rationale: Termo locativo amplo e natural, adequado ao cenário visionário.
- source_word: ተወልደ
  choice: surgiu
  rationale: Embora o verbo possa significar literalmente 'nasceu', 'surgiu' descreve naturalmente a formação do odor e mantém a imagem de algo que passa a existir.
- source_word: ጼና ተይ
  choice: cheiro de enxofre
  rationale: Mantém tanto a referência à substância quanto o aspecto sensorial, com vocabulário moderno e facilmente compreensível.
- source_word: ተኃብረ ምስለ እልኩ ማያት
  choice: que se uniu àquelas águas
  rationale: Preserva a ideia ampla de união ou associação, sem decidir se houve mistura física completa.
- source_word: ቈላ
  choice: vale
  rationale: É a designação mais clara e corrente para a depressão topográfica do cenário enoquiano.
- source_word: እንተ መላእክት እለ አስሐቱ
  choice: dos anjos que desencaminharam outros
  rationale: O verbo relativo é mais naturalmente ativo. 'Outros' explicita apenas o objeto implícito exigido pelo português, sem identificar quem foi desencaminhado.
- source_word: ትነድድ መትሕተ ይእቲ ምድር
  choice: arde debaixo daquela terra
  rationale: Retrata uma queima contínua e subterrânea; 'daquela terra' aponta para o terreno local, não necessariamente para o mundo inteiro.
theological_decisions:
- issue: Identidade e papel dos anjos punidos
  choice: os anjos que desencaminharam outros
  alternative: os anjos que foram desencaminhados
  rationale: A forma verbal relativa favorece a leitura ativa, na qual os anjos são agentes do desvio; a tradução não harmoniza a frase com fórmulas demonológicas posteriores.
- issue: Natureza da união com as águas
  choice: o cheiro de enxofre se uniu às águas
  alternative: o enxofre ou a emanação se misturou às águas
  rationale: O referente exato e o tipo de união não são inteiramente claros. A redação conserva a ligação gramatical imediata com o cheiro e registra a possível mistura em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção inicial permanece deliberadamente densa para conservar a sintaxe e a ambiguidade do ge'ez; as notas registram alternativas sem resolver silenciosamente as dificuldades textuais.
