base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/012.yaml
  text: And I heard Michael answering and saying[a], “This judgment by which the angels are judged is a testimony against the kings and the mighty[b], those who possess the dry land.”
translation:
  language: pt
  text: 'E ouvi Miguel responder e dizer: “Este juízo, pelo qual os anjos são julgados, é um testemunho[a] contra os reis e os poderosos, aqueles que possuem a terra seca[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma testemunha contra os reis e os poderosos”. O substantivo em ge'ez pode significar tanto “testemunho” quanto “testemunha” em sentido forense.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a terra seca”. A expressão pode designar a terra habitada sob o domínio humano, e não necessariamente toda a terra em sentido cósmico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕክዎ፡ ለሚካኤል
  choice: E ouvi Miguel
  rationale: Preserva a narrativa na primeira pessoa e identifica Miguel como aquele cuja fala foi ouvida, em português natural.
- source_word: ያውሥእ፡ ወይብል
  choice: responder e dizer
  rationale: Mantém a fórmula dupla de fala e o tom elevado do texto apocalíptico, sem fundir os dois verbos.
- source_word: ኵነኔ፡ ዛቲ
  choice: Este juízo
  rationale: “Juízo” conserva a amplitude judicial do termo, que pode abranger tanto o ato de julgar quanto seu resultado, sem especificar indevidamente “condenação” ou “sentença”.
- source_word: እንተ፡ ይትኴነኑ፡ መላእክት
  choice: pelo qual os anjos são julgados
  rationale: Conserva a construção relativa e a voz passiva, sem intensificar o sentido para “são condenados”.
- source_word: ሰማዕተ
  choice: um testemunho contra
  rationale: Expressa o sentido forense da passagem; a nota preserva a possibilidade lexical de entender o substantivo como “testemunha”.
- source_word: ለነገሥት፡ ወለዐዚዛን
  choice: contra os reis e os poderosos
  rationale: Representa as autoridades e elites terrenas em linguagem atual e digna; “poderosos” mantém a força sociopolítica da designação apocalíptica.
- source_word: እለ፡ ይእኅዝዋ፡ ለየብስ
  choice: aqueles que possuem a terra seca
  rationale: Preserva tanto o sentido de deter ou possuir quanto a imagem concreta de terra seca, sem ampliar automaticamente o referente para o mundo inteiro.
theological_decisions:
- issue: Alcance da oração sobre testemunho
  choice: O juízo dos anjos serve de testemunho contra os governantes terrenos.
  alternative: Os anjos seriam testemunhas contra os reis e os poderosos, ou “testemunho” seria apenas uma aposição destinada a eles.
  rationale: A sintaxe liga mais naturalmente “testemunho” ao juízo mencionado, enquanto as expressões seguintes indicam aqueles contra quem ele depõe. A nota lexical, porém, evita eliminar a ambiguidade forense do substantivo.
- issue: Alcance de “terra seca”
  choice: Manter a expressão concreta “terra seca”.
  alternative: Traduzir por “terra” em sentido amplo ou entender a expressão como o território habitado sob domínio humano.
  rationale: A forma concreta corresponde diretamente ao ge'ez e evita impor um alcance plenamente cósmico onde o texto pode aludir à terra habitada e governada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o paralelismo solene de “responder e dizer”, o vocabulário judicial e a imagem concreta de “terra seca”, evitando arcaísmos desnecessários e explicitações doutrinárias.
