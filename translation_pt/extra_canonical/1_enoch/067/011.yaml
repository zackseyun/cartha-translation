base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/011.yaml
  text: And the waters themselves will be changed in those days[a], for when those angels are judged in those waters, these springs of water will change, and when the angels ascend[c][b], that water of the springs will change and grow cold.
translation:
  language: pt
  text: E as próprias águas mudarão naqueles dias, pois, quando aqueles anjos forem julgados nessas águas, estas nascentes de água mudarão; e, quando os anjos subirem[a], a água das nascentes mudará e ficará fria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “quando os anjos subirem” traduz literalmente o movimento para cima. O texto etíope não deixa claro de onde eles sobem nem qual é exatamente a relação desse movimento com as nascentes.
    reason: alternative_reading
lexical_decisions:
- source_word: ኪያሁ ማያት
  choice: as próprias águas
  rationale: Preserva a ênfase sobre as águas como sujeito da mudança e mantém o plural concreto.
- source_word: ተውላጠ
  choice: mudarão
  rationale: Expressa de modo natural o processo de alteração sem sugerir necessariamente uma transformação total ou um agente explícito.
- source_word: ይትኴነኑ
  choice: forem julgados
  rationale: Mantém o sentido judicial sem antecipar o veredito como condenação.
- source_word: በውእቱ ማያት
  choice: nessas águas
  rationale: Retém a locução preposicional que situa o julgamento dos anjos nas águas.
- source_word: ዐያኖሙ እልኩ አንቅዐተ ማያት
  choice: estas nascentes de água
  rationale: Traduz o substantivo como nascentes, em vez de inferir 'calor', e apresenta de modo fluente a expressão explicativa relativa às fontes de água.
- source_word: የዐርጉ
  choice: subirem
  rationale: Conserva o movimento ascendente literal sem determinar de onde ou para onde os anjos sobem.
- source_word: ይቈርሩ
  choice: ficará fria
  rationale: Comunica o resultado térmico explícito em português corrente e concorda com o singular 'água'.
theological_decisions:
- issue: Natureza do julgamento dos anjos
  choice: os anjos forem julgados
  alternative: os anjos forem condenados
  rationale: O verbo é judicial; embora o contexto seja punitivo, o texto não exige que o veredito seja incorporado à tradução.
- issue: Relação entre os anjos e a mudança das águas
  choice: preservar a associação temporal entre julgamento, subida e mudança das águas
  alternative: explicar as águas como instrumento de punição
  rationale: O versículo associa esses acontecimentos, mas não esclarece seu mecanismo; a tradução evita sistematizar a imagem apocalíptica.
- issue: Sentido da subida dos anjos
  choice: quando os anjos subirem
  alternative: quando os anjos saírem das águas
  rationale: O verbo indica movimento para cima, mas o ponto de partida não é expresso com segurança.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa clara. A tradução mantém a repetição de 'águas/água' e 'mudarão/mudará', própria da imagem apocalíptica, e evita a leitura conjectural de 'calor' no meio do versículo.
