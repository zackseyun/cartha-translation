base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/004.yaml
  text: And they bound those angels who had shown lawlessness in that burning valley which my grandfather Enoch had previously shown me in the west[d][c][b][a], by the mountains of gold and silver and iron and soft metal and lead.
translation:
  language: pt
  text: E eles encerrarão aqueles anjos que haviam manifestado a iniquidade naquele vale em chamas, que meu avô Enoque já me havia mostrado no oeste[a], junto às montanhas de ouro, prata, ferro, metal macio[b] e chumbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em direção ao oeste”. O termo também pode significar “ao entardecer”, mas os indicadores geográficos do contexto favorecem uma localização ocidental.'
    reason: lexical_alternative
  - marker: b
    text: A identificação deste metal é incerta; entre as possibilidades propostas estão estanho, eletro ou algum outro metal refinado ou macio.
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐጽዎሙ
  choice: eles encerrarão
  rationale: A forma verbal é imperfeita e, no contexto do juízo futuro, aponta naturalmente para uma ação futura. “Encerrarão” conserva a ideia de fechar ou confinar, sem reduzi-la apenas ao ato físico de amarrar.
- source_word: እሙንቱ መላእክት
  choice: aqueles anjos
  rationale: O contexto apocalíptico identifica seres celestiais submetidos a juízo, não mensageiros humanos.
- source_word: እለ አርአይዋ ለዓመፃ
  choice: que haviam manifestado a iniquidade
  rationale: “Manifestado” preserva o sentido do verbo “mostrar/tornar visível”, evitando interpretar a expressão especificamente como “ensinaram” ou simplesmente “cometeram”. “Iniquidade” mantém a força moral e judicial do substantivo.
- source_word: ቈላ እንተ ትነድድ
  choice: vale em chamas
  rationale: Expressa de modo natural a imagem topográfica de um vale que arde continuamente.
- source_word: እንተ አርአየኒ ቀዳሚ እምሔውየ ሄኖክ
  choice: que meu avô Enoque já me havia mostrado
  rationale: A construção apresenta “meu avô Enoque” como sujeito de “mostrou-me”. O mais-que-perfeito composto deixa clara a referência a uma visão anterior.
- source_word: በዓረብ
  choice: no oeste
  rationale: Os marcadores geográficos seguintes favorecem o sentido espacial, embora o termo também possa ter valor direcional ou temporal.
- source_word: አድባረ ወርቅ ወብሩር ወሐፂን
  choice: montanhas de ouro, prata, ferro
  rationale: A sequência descreve montanhas associadas a metais; “montanhas” preserva a escala grandiosa da visão.
- source_word: ነጠብጣብ
  choice: metal macio
  rationale: A identificação exata do metal é incerta neste testemunho. Uma designação genérica evita precisão indevida, e a nota registra possibilidades tradicionais.
- source_word: ናእስ
  choice: chumbo
  rationale: O termo é normalmente entendido como chumbo em listas de metais e se ajusta à sequência.
theological_decisions:
- issue: Natureza da ofensa dos anjos
  choice: os anjos haviam manifestado a iniquidade
  alternative: os anjos haviam cometido ou ensinado a iniquidade
  rationale: O texto ge’ez enfatiza que eles a mostraram ou tornaram manifesta. A tradução conserva essa formulação sem decidir se isso significa ensino, revelação ou prática.
- issue: Tempo e caráter do confinamento
  choice: eles encerrarão
  alternative: eles prenderam
  rationale: A forma imperfeita, lida no contexto de juízo futuro, favorece o futuro. “Encerrar” também reflete mais diretamente a ideia de fechar ou confinar do que o pretérito “prenderam”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem eliminar as ambiguidades relevantes do ge’ez.
