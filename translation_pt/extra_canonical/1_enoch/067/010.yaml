base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/010.yaml
  text: For judgment will come upon them[a], because they trust in the indulgence of their flesh and deny the Spirit of the Lord.
translation:
  language: pt
  text: Pois o juízo virá sobre eles, porque confiam na satisfação dos desejos de sua carne[a] e negam o Espírito do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido por “satisfação dos desejos” é incerto nesta seção preservada apenas em ge'ez. Também pode sugerir prazer, libertinagem ou, possivelmente, engano associado à carne deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: pois / porque
  rationale: A primeira ocorrência liga o anúncio ao contexto anterior; a segunda introduz explicitamente a causa do juízo.
- source_word: ትመጽእ
  choice: virá
  rationale: O futuro é natural na fórmula apocalíptica de anúncio do juízo.
- source_word: ኵነኔ
  choice: juízo
  rationale: Preserva a amplitude judicial e escatológica sem restringir o termo à condenação ou à sentença.
- source_word: ዲቤሆሙ
  choice: sobre eles
  rationale: Reproduz naturalmente a relação preposicional da fórmula de juízo.
- source_word: የአምኑ
  choice: confiam
  rationale: Expressa melhor a ideia de confiança ou dependência mal direcionada do que o simples ato de crer.
- source_word: በተውኔተ
  choice: na satisfação dos desejos de
  rationale: O substantivo é incerto; em ligação com 'carne', esta formulação comunica autogratificação sensual sem ocultar a incerteza, registrada em nota.
- source_word: ሥጋሆሙ
  choice: da própria carne
  rationale: Mantém o termo antropológico concreto e sua força moral; 'própria' torna natural em português a referência à carne deles.
- source_word: ወመንፈሰ
  choice: e o Espírito
  rationale: O substantivo pode significar espírito ou sopro; o genitivo seguinte o relaciona especificamente ao Senhor.
- source_word: እግዚአ
  choice: do Senhor
  rationale: É o título divino usual e deve ser traduzido, não transliterado.
- source_word: ይክሕዱ
  choice: negam
  rationale: Preserva a força de repúdio em contexto teológico.
theological_decisions:
- issue: Sentido de “o Espírito do Senhor”
  choice: Referência ao Espírito pertencente ao Senhor, que eles negam em contraste com a confiança na carne
  alternative: O espírito humano dado por Deus, ou o caminho espiritual pertencente ao Senhor
  rationale: A construção genitiva aponta mais naturalmente para o Espírito do Senhor. A tradução mantém o contraste entre carne e Espírito sem o sistematizar nem importar fórmulas doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção conserva o tom oracular e a ambiguidade lexical relevante; “Espírito” recebe inicial maiúscula por se referir formalmente ao Espírito do Senhor.
