  text: And from there I went on a journey..[a][b].
translation:
  language: pt
  text: E dali fui em direção ao leste, para o meio da montanha do deserto. Vi uma região deserta, isolada e solitária, cheia de árvores e vegetação.[a] Dela jorrava água do alto, e acima dela apareciam correntes como uma torrente abundante que corria para o noroeste.[b] De todos os lados, água e orvalho também subiam dali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “árvores e semente”; o segundo termo pode referir-se a plantas, vegetação ou ao que brota da semente.
    reason: lexical_ambiguity
  - marker: b
    text: O texto menciona separadamente as direções norte e oeste; “noroeste” exprime a combinação de forma idiomática.
    reason: directional_clarification
lexical_decisions:
- source_word: እምህየ፡ ሖርኩ፡ መንገለ፡ ጽባሕ
  choice: E dali fui em direção ao leste
  rationale: መንገለ funciona aqui como preposição direcional, e ጽባሕ fornece o destino, “leste”; a tradução evita tratar መንገለ como o substantivo “caminho”.
- source_word: ማእከላ፡ ለደብረ፡ መድበራ
  choice: até o meio da montanha do deserto
  rationale: Mantém o substantivo singular ደብር, “montanha”, e a relação genitiva com መድበር, “deserto”, sem ampliar explicitamente para “cordilheira”.
- source_word: ገዳመ፡ ባሕቲቶ፡ ወባሕቱ
  choice: uma região deserta, isolada e solitária
  rationale: Expressa tanto o lugar ermo quanto a dupla ênfase de isolamento do texto etíope, em português natural.
- source_word: ምሉእ፡ ዕፀወ። እምነ፡ ዝንቱ፡ ዘርዕ
  choice: cheia de árvores dessa espécie
  rationale: ዘርዕ significa literalmente “semente” e pode indicar origem, tipo ou espécie; “dessa espécie” comunica o sentido provável sem introduzir “plantas” como segundo substantivo coordenado.
- source_word: ወማይ፡ ይፈለፍል፡ በላዕሉ
  choice: A água jorrava de cima sobre ela
  rationale: Preserva o movimento vigoroso de ይፈለፍል e a localização superior marcada por በላዕሉ.
- source_word: አስራብ፡ ከመ፡ ብዙኅ፡ ዘይሰርብ
  choice: uma torrente caudalosa
  rationale: A expressão descreve um curso ou fluxo abundante; “torrente caudalosa” é corrente, vívido e não acrescenta uma estrutura hídrica artificial.
- source_word: መንገለ፡ መስዕ፡ መንገለ፡ ዐረብ
  choice: para o noroeste
  rationale: A combinação das direções norte e oeste é vertida naturalmente como “noroeste”.
- source_word: ወእምኵለሄኒ፡ የዐርግ፡ ወእምህየኒ፡ ማይ፡ ወጠል
  choice: De todos os lados, água e orvalho subiam dali
  rationale: Conserva os dois elementos, água e orvalho, e o verbo de ascensão, sem substituí-los por “nuvens”.
