base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/002.yaml
  text: And the Head of Days was sitting on the throne of his glory[a], and the angels and the righteous were standing around him.
translation:
  language: pt
  text: E a Cabeça dos Dias estava sentada no trono de sua glória[a], e os anjos e os justos estavam de pé ao redor dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Ancião de Dias”. O título ge'ez é traduzido aqui mais literalmente como “a Cabeça dos Dias”, a fim de preservar a formulação desta passagem sem importar a expressão familiar de Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: o Cabeça dos Dias
  rationale: Traduz literalmente o título ge'ez e conserva sua formulação própria, sem substituí-la de imediato pela expressão mais conhecida de Daniel. O artigo masculino apresenta “Cabeça” como título pessoal e mantém a concordância com o referente masculino.
- source_word: መንበረ ስብሐቲሁ
  choice: o trono da sua glória
  rationale: Preserva a construção nominal e a imagem concreta de entronização, em registro apocalíptico elevado.
- source_word: ይነብር
  choice: estava sentado
  rationale: No contexto da visão, descreve a postura contínua da figura entronizada e mantém o valor cênico do verbo.
- source_word: መላእክት
  choice: os anjos
  rationale: No cenário da corte celestial, “anjos” é a tradução contextual mais natural e específica.
- source_word: ጻድቃን
  choice: os justos
  rationale: Designa pessoas caracterizadas pela justiça; “os justos” é claro, corrente e adequado ao registro bíblico em português.
- source_word: አውዶ
  choice: ao redor dele
  rationale: Expressa claramente que os presentes circundavam a figura entronizada.
- source_word: ይቆውሙ
  choice: estavam de pé
  rationale: Retrata a postura contínua dos assistentes e forma um paralelo natural com “estava sentado”.
theological_decisions:
- issue: Tradução do título divino ርእሰ መዋዕል em relação à tradição de Daniel
  choice: o Cabeça dos Dias
  alternative: o Ancião de Dias
  rationale: A tradução mais literal preserva a expressão distintiva do texto ge'ez e evita harmonizá-la silenciosamente com a formulação familiar de Daniel. A equivalência tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com cadência narrativa apocalíptica. “O Cabeça dos Dias” é deliberadamente incomum por refletir o título ge'ez; a alternativa tradicional aparece na nota.
