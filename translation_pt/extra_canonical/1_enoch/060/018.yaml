base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/018.yaml
  text: And the spirit of the hail departed by the force of his might[a], and its spirit is by itself; and what goes up from it is like smoke[f][e][d][c][b], and its name is Frost.
translation:
  language: pt
  text: E o espírito do granizo saiu pela força do seu poder, e o espírito que nele há está por si mesmo[a]; e o que dele sobe é como fumaça, e seu nome é Orvalho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase é difícil em ge''ez. Também pode ser entendida como: “o espírito que nele há está separado” ou “é distinto”.'
    reason: lexical_alternative
  - marker: b
    text: 'A cláusula final pode identificar como “Orvalho” aquilo que sobe do granizo. O pronome também pode ser entendido de modo mais pessoal: “o nome dele é Orvalho”.'
    reason: alternative_reading
lexical_decisions:
- source_word: መንፈሰ
  choice: espírito
  rationale: Preserva a personificação das forças cósmicas no contexto apocalíptico; “vento” ou “sopro” estreitariam ou enfraqueceriam essa imagem.
- source_word: ሐመዳ
  choice: granizo
  rationale: No catálogo de fenômenos meteorológicos, designa com maior probabilidade o granizo, em vez de geada ou gelo.
- source_word: ሐደገ
  choice: saiu
  rationale: Mantém a imagem concreta de movimento para fora sem decidir se se trata de origem, partida ou envio.
- source_word: በእንተ ኃይለ ዚአሁ
  choice: pela força do seu poder
  rationale: Conserva a linguagem enfática de força e poder e a ideia de causa ou agência eficaz.
- source_word: ቦቱ ባሕቲቱ
  choice: que nele há está por si mesmo
  rationale: Expressa a localização no granizo e o sentido literal de estar sozinho, separado ou por si mesmo, sem introduzir a nuance analítica de “distinto”.
- source_word: ዘየዐርግ እምኔሁ
  choice: o que dele sobe
  rationale: Preserva a construção relativa, a ambiguidade do antecedente e a imagem de movimento ascendente.
- source_word: ከመ ጢስ
  choice: como fumaça
  rationale: Reproduz diretamente a comparação visual forte do texto, sem suavizá-la para “vapor”.
- source_word: ስሙ ደይክ
  choice: seu nome é Orvalho
  rationale: A fórmula de nomeação provavelmente identifica o fenômeno ascendente. “Orvalho” é mantido como nome personificado, embora o referente do pronome permaneça ambíguo.
theological_decisions:
- issue: Se os “espíritos” meteorológicos devem ser reduzidos a processos naturais impessoais
  choice: Manter “espírito” e a nomeação personificada
  alternative: Traduzir como vento ou corrente de granizo e tratar o orvalho apenas como fenômeno meteorológico comum
  rationale: A linguagem visionária apresenta fenômenos cósmicos como realidades ordenadas e personificadas; conservá-la evita impor uma cosmologia moderna ao texto.
- issue: Referente e grau de separação de ባሕቲቱ
  choice: “está por si mesmo”
  alternative: “é distinto” ou “está separado”
  rationale: A opção escolhida conserva o sentido concreto de solidão ou existência à parte e evita transformá-lo em uma afirmação metafísica mais definida.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe próxima do ge'ez onde a ambiguidade é significativa. Mantiveram-se “espírito”, a comparação com fumaça e o nome personificado “Orvalho”; as notas foram reduzidas às ambiguidades textuais relevantes.
