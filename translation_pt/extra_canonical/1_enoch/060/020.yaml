base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/020.yaml
  text: And the spirit of the dew has its dwelling at the ends of heaven[a], and it is joined with the storehouses of the rain; and its course is in winter and in summer, and its clouds and the clouds of the mist are joined together[d][c][b], and one gives to another.
translation:
  language: pt
  text: O espírito do orvalho tem sua morada nos confins do céu[a] e está unido aos depósitos da chuva. Segue seu curso no inverno e no verão[b]; suas nuvens e as nuvens da névoa[c] estão unidas, e uma dá à outra[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas extremidades do céu”. “Morada” traduz um termo diferente daquele traduzido por “depósitos” na mesma frase.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu percurso”, “seu circuito” ou “seu caminho”; o sentido exato do movimento nesta cosmologia meteorológica é incerto.
    reason: lexical_alternative
  - marker: c
    text: O termo traduzido por “névoa” também pode significar “neblina” ou “bruma”.
    reason: lexical_alternative
  - marker: d
    text: A cláusula final também pode ser entendida como “cada uma dá à outra”; talvez descreva uma troca recíproca entre os fenômenos atmosféricos ligados entre si.
    reason: lexical_alternative
lexical_decisions:
- source_word: መንፈሰ ጠል
  choice: espírito do orvalho
  rationale: Preserva a personificação cosmológica e o registro apocalíptico; መንፈስ também pode significar “vento” ou “sopro”, mas reduziria aqui a força personificada do fenômeno.
- source_word: ማኅደሩ
  choice: sua morada
  rationale: O termo indica morada ou habitação e deve permanecer distinto de መዛግብት, “depósitos”, usado em seguida para a chuva.
- source_word: በአጽናፈ ሰማይ
  choice: nos confins do céu
  rationale: Expressa as extremidades cósmicas do céu em linguagem elevada, mas natural em português.
- source_word: መዛግብተ ዝናም
  choice: os depósitos da chuva
  rationale: Mantém a imagem apocalíptica de lugares celestes onde os fenômenos naturais são armazenados, sem confundir o termo com “morada” na oração anterior.
- source_word: ምሕዋረ ዚአሃ
  choice: seu percurso
  rationale: O substantivo pode indicar curso, circuito ou caminho; “percurso” conserva a noção de movimento sem especificá-la em excesso.
- source_word: በክረምት ወበሐጋይ
  choice: no inverno e no verão
  rationale: Reproduz diretamente o par sazonal do texto, sem substituí-lo por uma interpretação climática regional como “estação chuvosa e estação seca”.
- source_word: ደመና ጊሜ
  choice: a nuvem da névoa
  rationale: Mantém a construção e a imagem atmosférica do ge'ez; “neblina” ou “bruma” também seriam possíveis para ጊሜ.
- source_word: አሐዱ ለአሐዱ ይሁብ
  choice: uma dá à outra
  rationale: Conserva o gênero gramatical dos referentes imediatos, “nuvem” e “nuvem”, e deixa em aberto se a ação descreve troca recíproca ou transmissão de uma para a outra.
theological_decisions:
- issue: Entender መንፈሰ como força meteorológica impessoal ou como agente cósmico personificado
  choice: “espírito do orvalho”
  alternative: “vento do orvalho” ou “sopro do orvalho”
  rationale: O contexto enumera forças e depósitos celestes em linguagem apocalíptica personificada. “Espírito” preserva essa apresentação sem lhe impor um sentido doutrinário posterior.
- issue: Determinar se a cláusula final descreve reciprocidade plena
  choice: “uma dá à outra”
  alternative: “cada uma dá à outra”
  rationale: A formulação escolhida preserva a indeterminação do original e não torna necessariamente recíproca uma relação que também pode ser sequencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve elevação compatível com a cosmologia apocalíptica. A repetição de “nuvem” foi mantida para refletir a formulação do ge'ez, e a variação entre “morada” e “depósitos” preserva a distinção lexical do original.
