base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/007.yaml
  text: 'And on that day the two monsters were separated[a]: a female monster whose name is Lewyatan, to dwell in the abyss of the sea[d][c][b], above the springs of the waters.'
translation:
  language: pt
  text: 'E naquele dia os dois monstros foram separados: um dos quais era fêmea, e seu nome é Lewyatan[a], para habitar no abismo do mar[b], acima das fontes das águas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lewyatan é o nome da conhecida criatura marinha, tradicionalmente vertido em português como “Leviatã”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na profundeza do mar”; o termo ge''ez designa uma região profunda ou abissal.'
    reason: lexical_alternative
  - marker: c
    text: A expressão situa seu domínio em relação às “fontes das águas” e preserva uma antiga imagem cosmológica, não uma descrição geográfica moderna.
    reason: cultural_note
lexical_decisions:
- source_word: ተካፈሉ
  choice: foram separados
  rationale: O perfeito na terceira pessoa do plural indica uma ação passada. A forma passiva preserva a ideia de separação ou repartição dos dois seres.
- source_word: በይእቲ ዕለት
  choice: naquele dia
  rationale: Fórmula temporal apocalíptica natural em português, sem alterar o valor demonstrativo do ge'ez.
- source_word: ክልኤቱ ዐናብርት
  choice: os dois monstros
  rationale: “Monstros” comunica o caráter extraordinário e cósmico desses seres melhor que termos que os reduziriam a animais comuns.
- source_word: ዐንበሪ አንስትያዊት
  choice: um monstro fêmea
  rationale: A expressão identifica pelo sexo um dos dois seres e conserva explicitamente o substantivo presente no ge'ez.
- source_word: ዘስማ ሌዋያታን
  choice: cujo nome é Lewyatan
  rationale: Mantém a forma do nome mediada pelo testemunho etíope, enquanto a nota fornece a forma tradicionalmente reconhecida em português.
- source_word: ከመ ትኅድር
  choice: para habitar
  rationale: Expressa naturalmente o valor final ou de propósito e conserva o registro elevado.
- source_word: በልጕተ ባሕር
  choice: no abismo do mar
  rationale: “Abismo” preserva a força apocalíptica e a antiga geografia cósmica do termo para profundidade ou região profunda.
- source_word: መልዕልተ አነቅዕተ ማያት
  choice: acima das fontes das águas
  rationale: Reproduz a relação espacial e mantém a imagem cosmológica das fontes ou nascentes das águas.
theological_decisions:
- issue: Designação dos seres na cosmologia apocalíptica
  choice: os dois monstros
  alternative: os dois animais; as duas criaturas
  rationale: A escolha conserva a estranheza e a escala mítica dos seres primordiais sem acrescentar uma interpretação doutrinária posterior.
- issue: Forma do nome próprio mediado pelo ge'ez
  choice: Lewyatan
  alternative: Leviatã
  rationale: O texto principal translitera a forma atestada no testemunho etíope; a forma portuguesa tradicional aparece em nota para reconhecimento.
- issue: Tempo da separação
  choice: foram separados
  alternative: serão separados
  rationale: O verbo ge'ez está no perfeito e apresenta a separação como ação passada; o futuro produziria uma mudança temporal não sustentada pela forma verbal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a aposição do original e o imaginário apocalíptico sem modernizá-lo indevidamente.
