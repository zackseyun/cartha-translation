base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/004.yaml
  text: And Michael sent another angel from among the holy ones[a], and he lifted me up. And when he lifted me up, my spirit entered in[c][b], for I was not able to endure the sight of that power and its shaking and the quaking of heaven.
translation:
  language: pt
  text: E Miguel enviou outro anjo dentre os santos, e ele me levantou. Quando ele me levantou, meu espírito entrou[a], pois eu não conseguia suportar a visão daquele poder, de sua agitação e do tremor do céu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge'ez é difícil. Literalmente, «meu espírito entrou»; pode ser entendida como a entrada do espírito em um novo estado visionário ou, de modo mais interpretativo, como a recuperação do vidente.
    reason: lexical_alternative
  - marker: b
    text: 'A construção é condensada. Também se pode traduzir: «a visão daquele poder e de sua agitação, e o tremor do céu». A relação exata entre «poder», «agitação» e «céu» permanece incerta.'
    reason: alternative_reading
lexical_decisions:
- source_word: ፈነወ
  choice: enviou
  rationale: Expressa de modo direto o ato de mandar ou despachar alguém.
- source_word: ካልአ መልአከ
  choice: outro anjo
  rationale: Indica um anjo adicional, distinto de Miguel; é mais natural que “um segundo anjo” neste contexto.
- source_word: እምቅዱሳን
  choice: dentre os santos
  rationale: Preserva o sentido de procedência do meio de um grupo e o registro apocalíptico; no contexto, “santos” designa seres celestiais.
- source_word: አንሥአኒ
  choice: me levantou
  rationale: Mantém a imagem espacial de erguer o vidente, com linguagem natural em português.
- source_word: መንፈስየ ገብአት
  choice: meu espírito voltou
  rationale: ገብአ exprime voltar ou retornar, e o contexto favorece a recuperação após o colapso; uma nota registra a dificuldade histórica de interpretação.
- source_word: ኢክህልኩ ተዓግሦ
  choice: eu não conseguia suportar
  rationale: Comunica a incapacidade de resistir à experiência visionária esmagadora.
- source_word: ራእየ ዝኩ ኃይል
  choice: a visão daquele poder
  rationale: Conserva a referência ao que foi visto e a força sem identificar de maneira indevida o referente.
- source_word: ሀውከ
  choice: agitação
  rationale: Abrange perturbação, tumulto ou abalo sem impor exclusivamente um movimento físico.
- source_word: አንቀልቅለ ሰማይ
  choice: o tremor do céu
  rationale: Preserva a imagem apocalíptica de convulsão cósmica em português claro.
theological_decisions:
- issue: Identidade dos “santos”
  choice: seres santos celestiais, provavelmente anjos
  alternative: santos humanos ou uma assembleia mista
  rationale: Miguel envia “outro anjo” do meio deles, de modo que o contexto imediato aponta para a corte celestial; a tradução não acrescenta “anjos” ao substantivo.
- issue: Sentido de “meu espírito voltou”
  choice: traduzir ገብአ como “voltou”
  alternative: “meu espírito entrou” ou “entrou em mim”
  rationale: A distinção lexical entre ገብአ, “voltar”, e ቦአ, “entrar”, favorece “voltou”; isso também se ajusta à recuperação do vidente, sem explicitar “voltou a mim” no texto.
- issue: Relação entre poder, agitação e tremor celeste
  choice: apresentar os três elementos como objetos coordenados da incapacidade de suportar
  alternative: 'ligar “agitação” apenas ao poder: “a visão daquele poder e de sua agitação, e o tremor do céu”'
  rationale: A sintaxe etíope é comprimida. A coordenação em português conserva os elementos sem definir excessivamente suas relações.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Dentre os santos” mantém o tom apocalíptico e evita especificar no texto aquilo que o contexto apenas sugere. A repetição de “me levantou” reproduz deliberadamente a progressão narrativa.
