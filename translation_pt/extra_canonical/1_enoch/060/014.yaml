base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/014.yaml
  text: For resting places have been given to the thunder with patience for the sound of its voice[a]; and the thunder and the lightning are not separated, and though they are not one[d][c][b], by the Spirit the two of them go together and are not separated.
translation:
  language: pt
  text: Pois foram dados ao trovão lugares de repouso[d], com paciência, para o som de sua voz[a]; o trovão e o relâmpago não se separam e, embora não sejam um só[c], por meio do espírito[b] os dois seguem juntos e não se separam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com tolerância” ou “em paciência”. A expressão é difícil neste contexto e talvez descreva a contenção ordenada do som do trovão.'
    reason: lexical_alternative
  - marker: b
    text: O termo ge'ez traduzido como “espírito” também pode significar “sopro” ou “vento”. A frase pode indicar ação divina ou uma força que faz o trovão e o relâmpago seguirem juntos.
    reason: lexical_alternative
  - marker: c
    text: A expressão traduzida como “embora não sejam um só” é textualmente difícil neste testemunho. O sentido parece ser que o trovão e o relâmpago permanecem distintos, embora sigam juntos e não se separem.
    reason: textual_variant
  - marker: d
    text: 'Ou: “Pois há lugares de repouso para o trovão”.'
    reason: previous_rendering
lexical_decisions:
- source_word: እስመ
  choice: pois
  rationale: Introduz a explicação que fundamenta a afirmação anterior, sem tornar a relação causal mais específica do que o texto permite.
- source_word: ለነጐድጓድ ምዕረፋተ
  choice: ao trovão lugares de repouso
  rationale: Mantém o trovão como destinatário e traduz o substantivo no plural, de acordo com a forma ge'ez, preservando a imagem cosmológica concreta.
- source_word: በትዕግሥት
  choice: com paciência
  rationale: Conserva de modo deliberadamente próximo uma expressão obscura no contexto; a nota registra outras nuances possíveis.
- source_word: ለቃለ ዚአሁ
  choice: para o som de sua voz
  rationale: No contexto do trovão, 'som' é natural, enquanto 'sua voz' preserva a personificação vívida do original.
- source_word: ወኢይትሌለዩ
  choice: não se separam
  rationale: A mesma formulação é repetida nas duas ocorrências para conservar a repetição retórica.
- source_word: እነጐድጓድ ወእመብረቅ
  choice: o trovão e o relâmpago
  rationale: Traduz diretamente o par de fenômenos apresentados como agentes coordenados.
- source_word: ወእም፪ኒ
  choice: embora não sejam um só
  rationale: A leitura, embora textualmente difícil, expressa o contraste entre a distinção dos dois fenômenos e sua atuação inseparável.
- source_word: በመንፈስ
  choice: pelo Espírito
  rationale: Mantém a possibilidade de agência divina e o registro elevado, sem ocultar em nota que o termo também pode significar espírito, sopro ou vento.
- source_word: ክልኤሆሙ የሐውሩ
  choice: os dois seguem juntos
  rationale: Explicita a dualidade indicada pelo ge'ez e expressa em português corrente seu movimento coordenado.
theological_decisions:
- issue: Sentido de በመንፈስ na descrição cosmológica
  choice: pelo Espírito
  alternative: por um espírito, pelo sopro ou pelo vento
  rationale: A inicial maiúscula preserva a possibilidade de uma agência divina ordenadora, mas a nota mantém aberta a amplitude semântica do termo e evita transformar essa possibilidade em certeza.
- issue: Relação entre trovão e relâmpago
  choice: distintos, mas inseparáveis em seu movimento
  alternative: identificados como uma única realidade
  rationale: A cláusula difícil parece contrastar o fato de não serem um só com o fato de seguirem juntos; a tradução conserva essa tensão sem fundi-los.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição final foi preservada por seu efeito retórico, e as ambiguidades lexicais e textuais foram mantidas nas notas em vez de resolvidas silenciosamente.
