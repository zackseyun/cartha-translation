base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/006.yaml
  text: And when the day and the power and the punishment and the judgment come, which the Lord of Spirits has prepared for those who do not bow down to the righteous law, and for those who deny the righteous judgment, and for those who take his name in vain—that day has been prepared for the chosen as a covenant, and for sinners as an inquiry.
translation:
  language: pt
  text: E, quando vierem o dia, o poder, o castigo e o juízo que o Senhor dos Espíritos preparou para os que não se curvam diante do Senhor da justiça, para os que negam o Senhor da justiça e para os que usam o nome dele em vão — esse dia foi preparado como aliança para os escolhidos e como investigação para os pecadores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአ፡ መንፈሳት
  choice: Senhor dos Espíritos
  rationale: Reproduz de modo formal e inteligível o título etíope, sem substituir sua formulação característica.
- source_word: መቅሠፍት
  choice: castigo
  rationale: Expressa a sanção punitiva no contexto escatológico com linguagem corrente e digna.
- source_word: ኵነኔ
  choice: juízo
  rationale: Preserva o sentido judicial e a distinção em relação a “castigo”.
- source_word: ይነሥኡ፡ ስሞ፡ በከ
  choice: usam o nome dele em vão
  rationale: Verte naturalmente a expressão de tomar ou empregar o nome de modo vão, deixando explícito em português o referente pronominal.
- source_word: መሐላ
  choice: aliança
  rationale: O termo pode envolver juramento ou vínculo solene; “aliança” se ajusta ao paralelismo e à tradição textual consultada.
- source_word: ሐተታ
  choice: investigação
  rationale: Mantém a ideia de averiguação ou inquirição judicial sem intensificá-la para “inquisição”, termo carregado em português.
theological_decisions:
- issue: Sentido das expressões com እግዚ፡ ጽድቅ
  choice: lei justa / juízo justo
  alternative: Senhor da justiça
  rationale: A sequência etíope é textualmente difícil e admite leitura mais literal ligada a “Senhor da justiça”; a tradução principal segue a leitura contextual e a tradição crítica refletida na camada inglesa, distinguindo a norma justa do juízo justo, sem ocultar a alternativa.
- issue: Função do dia para escolhidos e pecadores
  choice: aliança para os escolhidos e investigação para os pecadores
  alternative: juramento para os escolhidos e inquirição para os pecadores
  rationale: Preserva o contraste do texto sem explicar de modo denominacional a natureza da aliança ou o resultado da investigação.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom solene sem arcaísmos. A enumeração do original foi mantida; “dele” evita a ambiguidade gráfica de “Seu”, e o travessão destaca a retomada de “esse dia”.
