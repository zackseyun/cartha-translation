  source_fidelity: A tradução de «Senhor dos Espíritos» é adequada. Contudo, o ge'ez preservado em ambas as ocorrências traz literalmente «Senhor da justiça» (እግዚ፡ጽድቅ), não «lei justa» e «juízo justo». A nota reconhece a leitura, mas a tradução principal privilegia uma reconstrução interpretativa diferente nas duas ocorrências e, portanto, não representa de modo suficiente a redação-fonte disponível. «Aliança» para መሐላ e «investigação» para ሐተታ são opções semanticamente defensáveis, embora o primeiro termo também possa significar «juramento».
  naturalness: O português é claro, solene e de leitura natural. A enumeração com «quando vierem o dia, o poder, o castigo e o juízo» é aceitável e reproduz a construção coletiva do original; o travessão também organiza bem a retomada de «esse dia».
  terminology: «Senhor dos Espíritos», «castigo», «juízo», «escolhidos» e «pecadores» mantêm registro consistente. «Senhor da justiça» deve ser mantido nas duas ocorrências para refletir o título/expressão do texto, sem impor a leitura interpretativa «lei»/«juízo».
