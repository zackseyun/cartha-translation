base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/012.yaml
  text: And the treasuries of the spirits[a], and how the spirits are divided, and how they are weighed out, and the portals of the spirits are reckoned, each according to the power of the spirit, and their powers for the light of the moon, and according to the power of righteousness[c][b], and the divisions of the stars by their names—every division shall be apportioned.
translation:
  language: pt
  text: E os tesouros dos espíritos[a], e como os espíritos são divididos, e como são medidos, e como os portais dos espíritos são contados, cada um segundo o poder do espírito; e os poderes deles para a luz da lua, e segundo o poder da retidão[b], e as divisões das estrelas segundo seus nomes — cada divisão será repartida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Espíritos” também pode ser entendido como “ventos” ou “sopros”; o termo ge'ez pode ter esses sentidos, e o contexto pode aproximar poderes cósmicos e forças atmosféricas. Algumas expressões deste versículo são textual e sintaticamente difíceis; “medidos” e “contados” também podem ser entendidos, de modo mais específico, como “pesados” e “calculados”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: tesouros
  rationale: Conserva a imagem de reservas celestes e o registro apocalíptico elevado; 'depósitos' seria possível, mas mais prosaico.
- source_word: መንፈሳት
  choice: espíritos
  rationale: O termo pode significar espíritos, ventos ou sopros. 'Espíritos' preserva melhor a ambiguidade entre poderes cósmicos e forças atmosféricas.
- source_word: ወአፎ
  choice: e como
  rationale: አፎ introduz aqui perguntas indiretas coordenadas ('como'), não significa 'nuvens'.
- source_word: ይትካፈሉ
  choice: são divididos
  rationale: Expressa a distribuição ordenada em partes sem acrescentar uma interpretação específica.
- source_word: ይደሉ
  choice: são medidos
  rationale: O verbo é lexicalmente difícil; 'medidos' mantém a ideia geral de determinação exata sem impor a imagem mais específica de pesagem.
- source_word: ይኄለቁ
  choice: são contados
  rationale: Reproduz de modo claro a ideia de cálculo, enumeração ou registro.
- source_word: አናቅፅ
  choice: portais
  rationale: Plural de um termo que designa portais ou entradas, importante na cosmologia enoquiana; evita a leitura incorreta 'câmaras'.
- source_word: በበኀይለ መንፈስ
  choice: cada um segundo o poder do espírito
  rationale: A forma distributiva በበ é representada por 'cada um segundo', enquanto 'espírito' conserva a ambiguidade lexical do substantivo.
- source_word: ለብርሃነ ወርኅ
  choice: para a luz da lua
  rationale: Tradução direta que preserva a construção e a imagem cósmica.
- source_word: ኀይለ ጽድቅ
  choice: poder da justiça
  rationale: Neste contexto de ordenação cósmica, 'justiça' é natural em português e mantém a dimensão de retidão normativa.
- source_word: ክፍላተ ከዋክብት
  choice: divisões das estrelas
  rationale: Mantém o tema recorrente da organização e distribuição dos corpos celestes.
- source_word: በበ ስሞሙ
  choice: segundo seus nomes
  rationale: Expressa a classificação distributiva das estrelas em relação aos respectivos nomes.
- source_word: ኵሉ ክፍለ ይትከፈል
  choice: cada divisão será repartida
  rationale: Preserva o jogo lexical entre divisão e repartição, bem como a noção de atribuição ordenada.
theological_decisions:
- issue: Se መንፈሳት deve ser entendido como 'espíritos' ou como 'ventos'
  choice: espíritos
  alternative: ventos; sopros
  rationale: A linguagem cosmológica pode reunir poderes pessoais e fenômenos naturais. 'Espíritos' mantém essa tensão, explicitando a alternativa em nota.
- issue: Se ጽድቅ deve ser traduzido por 'justiça' ou 'retidão'
  choice: justiça
  alternative: retidão
  rationale: O contexto trata da ordem cósmica, e 'justiça' comunica em português tanto a norma justa quanto a força ordenadora, sem limitar o termo ao âmbito judicial.
translation_notes:
  register: Português moderno, digno e acessível, com cadência apocalíptica preservada. A longa coordenação do original foi mantida, mas organizada com pontuação para legibilidade. Evitaram-se as leituras já corrigidas de ወአፎ como 'nuvens' e de አናቅፅ como 'câmaras'.
