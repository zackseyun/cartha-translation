base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/019.yaml
  text: And the spirit of the mist is not joined with them in their storehouses[a], but its own storehouse is by itself; for its course is glorious in it, both in light and in darkness, and in winter and in summer[c][b], and its storehouse is an angel.
translation:
  language: pt
  text: E o espírito da névoa não se une a eles nos depósitos deles, mas tem seu próprio depósito à parte; pois seu curso é glorioso nele, tanto na luz como nas trevas, tanto no inverno como no verão, e seu depósito é um anjo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A oração final é difícil. O ge’ez diz literalmente: “seu depósito é um anjo”. Isso talvez identifique um ser angélico com o depósito designado para a névoa, mas o texto não esclarece a relação.'
    reason: textual_variant
lexical_decisions:
- source_word: መንፈሰ፡ ጊሜ
  choice: o espírito da névoa
  rationale: መንፈስ pode significar espírito, vento ou sopro, mas a cosmologia personificada do contexto favorece “espírito”; ጊሜ designa névoa ou neblina, não mar.
- source_word: ኢይትኃበር፡ ምስሌሆሙ፡ ውስተ፡ መዛግብቲሆሙ
  choice: não se une a eles nos depósitos deles
  rationale: Conserva tanto a ideia de associação ou união quanto a expressão locativa “nos depósitos deles”.
- source_word: መዛግብቲሆሙ / መዝገበ
  choice: depósitos
  rationale: O termo indica depósitos, armazéns ou tesouros cósmicos. “Depósitos” é concreto e natural em português, sem sugerir riqueza monetária.
- source_word: መዝገበ፡ ቦቱ፡ ባሕቲቱ
  choice: tem seu próprio depósito à parte
  rationale: Expressa idiomaticamente a existência de um depósito próprio e separado, preservando a ênfase de ባሕቲቱ.
- source_word: ምሕዋረ፡ ዚአሁ
  choice: seu curso
  rationale: O substantivo pode indicar curso, circuito ou trajeto; “curso” preserva a imagem do movimento cósmico sem especificá-la demais.
- source_word: ስብሐት፡ ቦ
  choice: é glorioso nele
  rationale: Mantém tanto a noção de glória ou esplendor quanto a partícula locativa, apesar da formulação incomum.
- source_word: በብርሃን፡ ወበጽልመት፡ ወበክረምት፡ ወበንጋይ
  choice: tanto na luz como nas trevas, tanto no inverno como no verão
  rationale: Reproduz os dois pares contrastantes. A última forma transmitida é melhor entendida como erro visual por ሐጋይ, “verão”, par habitual de ክረምት, “inverno”.
- source_word: መዝገበ፡ ዚአሃ፡ መልአክ፡ ውእቱ
  choice: seu depósito é um anjo
  rationale: A sintaxe direta produz essa identificação surpreendente. A tradução a conserva, em vez de inserir sem apoio que o depósito é guardado ou administrado por um anjo.
theological_decisions:
- issue: Se o “espírito da névoa” deve ser reduzido a um fenômeno natural impessoal
  choice: Conservar “o espírito da névoa” como realidade cósmica personificada
  alternative: o vento da névoa; a força da névoa
  rationale: O contexto descreve depósitos cósmicos e administração angélica. A personificação pertence à cosmovisão apocalíptica do texto e não deve ser racionalizada.
- issue: Como traduzir a identificação final entre o depósito e um anjo
  choice: Manter no texto principal “seu depósito é um anjo”
  alternative: seu depósito está sob a autoridade de um anjo; um anjo guarda seu depósito
  rationale: Embora conceitualmente difícil, esta é a leitura mais direta da construção ge’ez. As alternativas suavizam a dificuldade acrescentando relações que o texto não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem das imagens e a estranheza apocalíptica foram preservadas, com leve ajuste sintático para naturalidade.
