  source_fidelity: 'A tradução acompanha adequadamente o ge’ez e as correções do histórico de auditoria: ጊሜ é vertido como “névoa”, não “mar”; a relação “com eles, nos depósitos deles” é preservada; e ክረምት/ሐጋይ é corretamente apresentado como “inverno” e “verão”. A formulação final, deliberadamente difícil, “seu depósito é um anjo”, conserva a sintaxe e a estranheza do texto sem introduzir uma explicação não atestada.'
