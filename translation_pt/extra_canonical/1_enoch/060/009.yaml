base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/009.yaml
  text: And I asked another angel that he should show me the power of those monsters[a], how they were separated on one day and were cast[d][c][b], one into the depths of the sea and one onto the dry land of the wilderness.
translation:
  language: pt
  text: 'E perguntei a outro anjo que me mostrasse o poder daqueles monstros[a]: como foram separados num só dia e lançados, um nas profundezas do mar e o outro na terra seca do deserto.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O contexto ao redor identifica mais especificamente essas duas criaturas cósmicas, mas este versículo se refere a elas apenas como “aqueles monstros”.
    reason: cross_reference
  - marker: b
    text: A expressão final é difícil. O ge'ez parece contrapor o mar a uma região seca e desértica; literalmente, algo como “na terra seca, no deserto”.
    reason: textual_variant
lexical_decisions:
- source_word: ተስእእክዎ
  choice: perguntei
  rationale: Expressa de modo natural e direto a pergunta ou solicitação de Enoque ao anjo.
- source_word: ካልእ መልአክ
  choice: outro anjo
  rationale: Preserva a mudança narrativa para um guia angelical diferente sem exigir a ideia mais específica de 'segundo'.
- source_word: ያርእየኒ
  choice: para que me mostrasse
  rationale: Mantém a dependência verbal daquilo que Enoque pediu ao anjo, em português corrente.
- source_word: ኃይሎሙ
  choice: o poder
  rationale: O termo denota primariamente poder ou força; a construção portuguesa 'o poder daqueles monstros' representa a relação possessiva do texto.
- source_word: ዐናብርት
  choice: monstros
  rationale: No cenário apocalíptico de criaturas cósmicas ligadas ao mar e ao deserto, 'monstros' conserva melhor o caráter extraordinário e ameaçador do termo do que 'animais'.
- source_word: ተሌለዩ
  choice: foram separados
  rationale: 'Preserva a voz passiva: as criaturas são separadas por uma ação externa.'
- source_word: በአሐቲ ዕለት
  choice: num só dia
  rationale: Reproduz o valor temporal e a unidade do dia sem especificar se se trata de duração ou de um dia determinado.
- source_word: ተወድዩ
  choice: lançados
  rationale: O verbo está no plural e se aplica às duas criaturas, indicando colocação passiva e enérgica.
- source_word: በልጕተ ባሕር
  choice: nas profundezas do mar
  rationale: Comunica a região profunda do mar com clareza e dignidade, sem impor um sentido técnico de 'abismo'.
- source_word: በየብስ በድው
  choice: na terra seca do deserto
  rationale: Conserva os dois elementos da expressão — terra seca e região desértica — em contraste com o mar.
theological_decisions:
- issue: Identificação das duas criaturas
  choice: Referi-las genericamente como 'monstros' no texto principal.
  alternative: Nomeá-las como Leviatã e Beemote à luz do contexto próximo.
  rationale: O versículo fornecido não apresenta os nomes próprios; manter a designação genérica preserva sua formulação local e evita importar para ele informação dos versículos ao redor.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao leitor brasileiro e compreensível internacionalmente. A formulação mantém a voz passiva, o plural do segundo verbo e a geografia contrastante do texto ge'ez.
