base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/008.yaml
  text: And the name of the male was Behemoth[a], who occupies with his breast an unseen wilderness named Dundayin, east of the garden, where the chosen and the righteous dwell, where my great-grandfather was taken up, the seventh from Adam[e][d][c][b], the first of men whom the Lord of Spirits made.
translation:
  language: pt
  text: E o nome do macho era Beemote[d], que, com o peito, ocupa um deserto que não se vê[a][e], chamado Dundayin, a leste do jardim[b], onde habitam os escolhidos e os justos e onde foi levado meu avô[c], o sétimo desde Adão, o primeiro homem que o Senhor dos Espíritos fez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A descrição deste lugar é incerta. O ge'ez pode indicar um deserto que não é visto, invisível ou inacessível.
    reason: textual_variant
  - marker: b
    text: “Jardim” traduz literalmente o ge'ez. O texto não diz explicitamente “Éden”.
    reason: lexical_alternative
  - marker: c
    text: O avô mencionado é Enoque, identificado como “o sétimo desde Adão”. A expressão final “o primeiro homem” refere-se a Adão.
    reason: cross_reference
  - marker: d
    text: 'Outra tradução possível: “E o nome do segundo era Beemote”.'
    reason: previous_rendering
  - marker: e
    text: 'Outra tradução possível: “um deserto desolado”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወለተ ባዕታይ፡ ስሙ፡ ብሔሞት
  choice: E o macho se chamava Beemote
  rationale: A construção identifica pelo nome o ser masculino mencionado no contexto. “Macho” conserva a distinção sexual expressa no texto; “Beemote” translitera o nome próprio sem o traduzir. A leitura alternativa “o segundo” é registrada em nota.
- source_word: ዘይአኅዝ፡ በእንግ ድዓሁ
  choice: com o peito, ele ocupa
  rationale: O verbo tem sentido espacial de tomar ou manter um lugar. “Peito” preserva a imagem corporal estranha e concreta da visão, em vez de generalizá-la como “corpo”.
- source_word: በበድው፡ ዘኢያስተርኢ
  choice: uma região deserta que não se vê
  rationale: A oração relativa significa literalmente algo como “que não é vista”. A formulação mantém essa característica visionária sem decidir se o lugar é invisível, oculto ou inacessível; “região deserta” comunica com naturalidade o espaço ermo.
- source_word: ዱንዳይን
  choice: Dundayin
  rationale: É nome de lugar e, por isso, foi transliterado, não traduzido.
- source_word: በምሥራቀ፡ ገነት
  choice: a leste do jardim
  rationale: “Jardim” traduz literalmente o termo ge'ez, sem acrescentar “Éden”, que não aparece explicitamente no verso.
- source_word: በኀበ፡ ይነብሩ፡ ኅሩያን፡ ወጻድቃን
  choice: onde habitam os escolhidos e os justos
  rationale: “Onde” expressa o valor local da construção. “Escolhidos” e “justos” conservam os termos apocalípticos sem lhes impor uma interpretação confessional posterior.
- source_word: ተመጠወ
  choice: foi levado
  rationale: A forma passiva indica remoção ou traslado. “Foi levado” preserva a linguagem narrativa sem introduzir terminologia teológica técnica.
- source_word: እምኄውየ
  choice: meu antepassado
  rationale: O termo de parentesco pode ser entendido de modo mais amplo que uma relação genealógica moderna exata. “Antepassado” evita precisão indevida, enquanto a frase seguinte identifica a pessoa como o sétimo desde Adão.
- source_word: ሳብዕ፡ እምአዳም
  choice: o sétimo desde Adão
  rationale: A expressão genealógica é vertida diretamente e identifica o antepassado mencionado.
- source_word: ቀዳሚሆሙ፡ ለሰብእ፡ ዘገብረ፡ እግዚአ፡ መናፍስት
  choice: o primeiro dos homens que o Senhor dos Espíritos fez
  rationale: A construção remete a Adão como o primeiro dos seres humanos. “Senhor dos Espíritos” mantém o título característico do livro.
theological_decisions:
- issue: Identidade do antepassado levado e referência de “o sétimo desde Adão”
  choice: A expressão identifica como Enoque o antepassado levado, sem inserir o nome no corpo do verso.
  alternative: Entender o narrador como o próprio Enoque ou traduzir o parentesco com um grau específico, como “avô” ou “bisavô”.
  rationale: A identificação “o sétimo desde Adão” aponta para Enoque, mas o termo de parentesco não precisa ser forçado a uma categoria genealógica portuguesa exata. A nota esclarece a referência sem reescrever o texto.
- issue: Sentido da descrição do deserto
  choice: “uma região deserta que não se vê” no texto principal, com as possibilidades semânticas registradas em nota.
  alternative: “um deserto invisível”, “uma região inacessível” ou “um deserto desolado”.
  rationale: A negação ligada ao verbo de ver ou aparecer deve permanecer perceptível. A tradução não decide silenciosamente se a invisibilidade é literal, se indica ocultamento ou se sugere inacessibilidade.
- issue: Referência de “o primeiro dos homens”
  choice: Manter a sequência sintática, entendendo que a expressão caracteriza Adão.
  alternative: Reformular explicitamente como “Adão, o primeiro homem que o Senhor dos Espíritos fez”.
  rationale: A formulação preserva a estrutura e a tensão sintática do texto, sem acrescentar explicitação interpretativa ao corpo do verso.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A pontuação divide a longa cadeia de relativas sem eliminar sua textura visionária. Mantiveram-se os nomes e o título divino tradicionais, e as incertezas lexicais foram expostas em notas em vez de resolvidas de forma dogmática.
