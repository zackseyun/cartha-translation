base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/015.yaml
  text: For when the lightning flashes[a], the thunder gives its voice, and the spirit rests at its appointed time, and it divides equally among them; for the treasury of their times is of sand, and the two of them are restrained with a bridle and turned back by the power of the spirit[d][c][b], and they are driven on likewise according to the many regions of the earth.
translation:
  language: pt
  text: Pois, quando o relâmpago lampeja, o trovão dá a sua voz, e o espírito[a] repousa no tempo determinado, ele reparte igualmente entre eles[c]; pois o tesouro dos tempos deles é de areia, e os dois são contidos por um freio[d] e feitos recuar pelo poder do espírito; e, do mesmo modo, são impelidos adiante, segundo as muitas regiões da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vento”, aqui e na expressão “pelo poder do espírito”; o termo ge'ez pode significar vento, sopro ou espírito, e o verso se desenvolve em meio a imagens de tempestade.
    reason: lexical_alternative
  - marker: b
    text: A expressão final é difícil; “regiões” também pode ser entendida como “quadrantes” ou “partes da terra”.
    reason: textual_difficulty
  - marker: c
    text: 'A oração traduzida como “ele reparte igualmente entre eles” é incerta; uma alternativa mais cautelosa seria: “ele distribui entre eles”.'
    reason: alternative_reading
  - marker: d
    text: Mais literalmente, “os dois são segurados por uma rédea”; o português do texto principal preserva a imagem de modo mais natural.
    reason: literal_rendering
lexical_decisions:
- source_word: ይበርቅ መብረቅ
  choice: o relâmpago lampeja
  rationale: Mantém a construção verbal-nominal enfática do ge'ez e a vivacidade da imagem, sem reduzi-la simplesmente a “relampeja”.
- source_word: ነጐድጓድ ቃሎ ይሁብ
  choice: o trovão dá a sua voz
  rationale: Preserva a formulação concreta e personificada do original, em vez de a substituir pelo simples verbo “troveja”.
- source_word: መንፈስ
  choice: espírito
  rationale: O vocábulo pode significar espírito, vento ou sopro. “Espírito” conserva a amplitude cosmológica e a agência expressa no verso; “vento” permanece registrado em nota por causa do contexto meteorológico.
- source_word: በጊዜሃ ያዐርፍ
  choice: repousa no tempo determinado
  rationale: Expressa tanto o repouso quanto a ordem temporal estabelecida para os fenômenos cósmicos.
- source_word: ዐሩየ ይከፍል ማእከሎሙ
  choice: ele reparte igualmente entre eles
  rationale: O verbo indica divisão ou distribuição, e o advérbio procura representar a ideia de repartição equitativa, embora a construção admita uma tradução mais cautelosa.
- source_word: መዝገበ ጊዜያቲሆሙ ዘኆጻ ውእቱ
  choice: o tesouro dos tempos deles é de areia
  rationale: “Tesouro” preserva a imagem cosmológica concreta de um depósito, e ዘኆጻ é traduzido lexicalmente como “de areia”, sem a antiga emenda interpretativa “fixo”.
- source_word: ፪፪እምኔሆሙ በአጓም ይትነኃዙ
  choice: os dois são contidos por um freio
  rationale: Conserva a referência aos dois e a imagem de controle por freio ou rédea, com uma construção natural em português.
- source_word: ወይትመየጡ በኃይለ መንፈስ
  choice: e feitos recuar pelo poder do espírito
  rationale: Representa o movimento de retorno imposto pela força do espírito, sem confundi-lo com mera agitação.
- source_word: ወይትነጸኡ
  choice: são impelidos adiante
  rationale: O verbo indica impulsionar ou fazer avançar, e não purificar; a tradução explicita esse movimento.
- source_word: ብዙኃ አድዋስ ምድር
  choice: as muitas regiões da terra
  rationale: “Regiões” comunica o sentido geográfico de partes ou quadrantes da terra melhor que “moradas”.
theological_decisions:
- issue: Se መንፈስ deve ser traduzido em sentido meteorológico como “vento” ou em sentido mais amplo como “espírito”
  choice: espírito
  alternative: vento; sopro
  rationale: O cenário de tempestade favorece “vento”, mas a agência, o tempo próprio e o poder atribuídos ao termo sustentam “espírito”. A tradução principal conserva essa dimensão cosmológica mais ampla, enquanto a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe solene compatível com literatura apocalíptica. Mantiveram-se as imagens concretas do trovão que dá voz, do tesouro de areia e do freio, sem importar terminologia confessional. Os pronomes foram empregados com cautela para não identificar além do que o contexto permite os dois seres ou fenômenos controlados.
