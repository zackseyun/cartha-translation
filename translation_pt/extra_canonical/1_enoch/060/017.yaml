base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/017.yaml
  text: And the spirit of the hoarfrost is its own angel[c][b][a], and the spirit of the hail is a good angel.
translation:
  language: pt
  text: E o espírito da geada é seu próprio anjo, e o espírito do granizo é um anjo bom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሰ
  choice: o espírito de/da
  rationale: A forma repetida introduz forças meteorológicas personificadas; “espírito de/da” conserva essa imagem apocalíptica.
- source_word: አስሐትያ
  choice: geada
  rationale: O termo é um substantivo meteorológico que designa geada ou geada branca, não um nome angélico próprio.
- source_word: መልአክ
  choice: anjo
  rationale: No catálogo apocalíptico de agentes cósmicos, “anjo” exprime naturalmente o papel sobrenatural do termo.
- source_word: ዚአሁ
  choice: seu próprio
  rationale: Na construção መልአክ ዚአሁ ውእቱ, o elemento possessivo indica que o espírito da geada é o anjo que lhe pertence, expresso idiomaticamente como “seu próprio anjo”.
- source_word: ውእቱ
  choice: é
  rationale: A cópula é vertida diretamente por “é” nas duas orações.
- source_word: በረድ
  choice: granizo
  rationale: Este é o sentido meteorológico comum e adequado à sequência.
- source_word: ኄር
  choice: bom
  rationale: Trata-se do adjetivo ge'ez “bom”, concordando semanticamente com “anjo”, e não de um nome próprio.
theological_decisions:
- issue: Relação entre os espíritos meteorológicos e os anjos
  choice: Preservar a afirmação de que o espírito da geada é seu próprio anjo e que o espírito do granizo é um anjo bom.
  alternative: Interpretar as palavras meteorológica e adjetiva como nomes próprios de anjos.
  rationale: A morfologia e o léxico ge'ez favorecem substantivo meteorológico e adjetivo comum. A tradução mantém a identificação incomum do texto sem convertê-la em uma fórmula de nomeação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do original. “Geada” oferece ampla compreensão; “seu próprio anjo” preserva de modo natural a fórmula possessiva e copular do ge'ez.
