base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/010.yaml
  text: And he said to me[a], “You, son of man[c][b], here you desire to understand what is hidden.”
translation:
  language: pt
  text: 'E ele me disse: “Você, filho do homem[a], deseja compreender aqui o que está oculto[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser humano” ou “mortal”. Aqui, “filho do homem” é uma forma de se dirigir ao vidente, não necessariamente uma referência à figura exaltada chamada “o Filho do Homem” em outras partes das Parábolas.
    reason: lexical_alternative
  - marker: b
    text: A expressão final também pode ser traduzida como “conhecer a coisa oculta” ou “aprender o que está escondido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: E ele me disse
  rationale: Reproduz a fórmula narrativa de fala do ge'ez em português natural e digno.
- source_word: አንተ
  choice: Você
  rationale: Mantém o pronome explícito e sua ênfase diante da forma de tratamento; “você” oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: ወልደ ሰብእ
  choice: filho do homem
  rationale: Preserva literalmente o idiomatismo semítico e o registro apocalíptico, deixando ao contexto distinguir esta interpelação ao vidente do título exaltado usado em outras passagens.
- source_word: በዝየ
  choice: aqui
  rationale: Conserva de modo conciso a referência ao lugar ou ao cenário visionário imediato.
- source_word: ትፈቅድ
  choice: deseja
  rationale: Expressa volição em registro digno, sem reduzir o sentido a mera permissão.
- source_word: ታእምር
  choice: compreender
  rationale: Comunica apreensão cognitiva no contexto da revelação de coisas ocultas.
- source_word: ዘኅቡእ
  choice: o que está oculto
  rationale: Traduz transparentemente a construção relativa e evita introduzir o termo técnico “mistério” sem necessidade contextual.
theological_decisions:
- issue: Sentido de ወልደ ሰብእ nas Parábolas
  choice: filho do homem
  alternative: ser humano; mortal
  rationale: Neste versículo, a expressão se dirige ao vidente, e não necessariamente à figura exaltada chamada “o Filho do Homem” em outras partes das Parábolas. A tradução tradicional preserva a tensão e o registro do texto, enquanto a nota esclarece sua função local sem impor uma identificação cristológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação de “aqui” conserva a força dêitica e a leve estranheza do original, sem tornar a frase ininteligível.
