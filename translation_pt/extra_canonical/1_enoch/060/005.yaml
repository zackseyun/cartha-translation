base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/005.yaml
  text: And Michael said to me[a], “Why are you troubled by such a vision? Until today the day of his mercy has lasted[c][b], and he has been merciful and slow to wrath toward those who dwell upon the dry land.”
translation:
  language: pt
  text: 'E Miguel me disse: “Por que você está perturbado com uma visão assim?[a] Até hoje, o dia da sua misericórdia tem durado, e ele tem sido misericordioso e tardio em irar-se contra os que habitam na terra seca.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Por que, diante de uma visão como esta, você está perturbado?” A construção da pergunta em ge''ez é difícil.'
    reason: lexical_alternative
  - marker: b
    text: “Terra seca” pode ser significativo neste contexto, em contraste com o mar e suas criaturas na passagem ao redor.
    reason: cultural_note
lexical_decisions:
- source_word: ወይቤለኒ፡ ሚካኤል
  choice: E Miguel me disse
  rationale: Mantém a introdução narrativa simples e translitera o nome pessoal na forma portuguesa consagrada.
- source_word: ምንተ፡ ርእየ፡ ዘከመዝ፡ ተሀውከ
  choice: Por que você está perturbado com uma visão assim?
  rationale: Lê ርእየ como forma acusativa do substantivo “visão”, e não como verbo; expressa em português natural a difícil construção interrogativa do ge'ez.
- source_word: እስከ፡ ዮም፡ ሀለወት
  choice: Até hoje tem durado
  rationale: Preserva tanto a referência temporal quanto a ideia de continuidade.
- source_word: ዕለተ፡ ምሕረቱ
  choice: o dia da sua misericórdia
  rationale: Conserva a imagem escatológica de um período divinamente determinado e o possessivo presente no texto.
- source_word: ወሀሎ፡ መሓሪ
  choice: e ele tem sido misericordioso
  rationale: Mantém a continuidade da misericórdia durante o período mencionado.
- source_word: ወርኁቀ፡ መዓት
  choice: e tardio em irar-se
  rationale: A expressão significa literalmente estar distante da ira; esta formulação portuguesa comunica a demora em exercer a ira sem eliminar sua possibilidade futura.
- source_word: ላዕለ፡ እለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: contra os que habitam em terra seca
  rationale: Preserva o sentido específico de የብስ, “terra seca”, relevante no contraste contextual com o mar; “contra” reflete a orientação potencial da ira.
theological_decisions:
- issue: Referente do possessivo em “sua misericórdia”
  choice: Manter o possessivo com referente divino implícito
  alternative: Traduzir de modo impessoal como “o dia da misericórdia”
  rationale: O ge'ez contém o possessivo, e o contexto associa misericórdia, contenção da ira e juízo ao governo de Deus, embora Deus não seja nomeado novamente neste versículo.
- issue: Relação entre misericórdia presente e ira futura
  choice: Manter “tardio em irar-se”
  alternative: Traduzir como “longe da ira”
  rationale: A escolha conserva a tensão entre a misericórdia atual e a possibilidade de juízo, sem transformar a expressão em ausência absoluta de ira.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução segue equivalência ótima: preserva “dia da sua misericórdia” e “terra seca”, mas apresenta a pergunta inicial em ordem natural. Todos os marcadores de nota aparecem no texto.'
