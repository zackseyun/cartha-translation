base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/003.yaml
  text: And as for me[a], a great trembling seized me, and fear took hold of me; and my loins were broken, and my kidneys were loosened[d][c][b], and I fell on my face.
translation:
  language: pt
  text: Quanto a mim, um grande tremor apoderou-se de mim, e o medo me dominou; meus lombos foram quebrados[b], meus rins se soltaram[a], e caí com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “meus rins se soltaram”. Na antiga linguagem corporal de matriz semítica, os rins podiam representar o íntimo ou as emoções profundas.
    reason: cultural_note
  - marker: b
    text: A expressão também pode ser entendida como “meus quadris cederam” ou “a força dos meus lombos desmoronou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ረዓድ ዐቢይ
  choice: um grande tremor
  rationale: Preserva tanto a intensidade do modificador quanto a reação física, sem reduzir a expressão ao sentido mais interpretativo de “terror”.
- source_word: ነሥአኒ
  choice: apoderou-se de mim
  rationale: Com “tremor” como sujeito, exprime de modo natural em português que o tremor tomou conta do narrador.
- source_word: ፍርሃት አሐዘኒ
  choice: o medo me dominou
  rationale: Mantém a imagem concreta de uma força que toma o narrador, evitando a formulação mais fraca “fiquei com medo”.
- source_word: ሐቌየ ተቀጽዐ
  choice: meus lombos foram quebrados
  rationale: O verbo passivo indica quebrar, esmagar ou despedaçar; “foram quebrados” distingue-o do verbo seguinte e conserva a forte imagem corporal.
- source_word: ኵልያትየ ተፈትሑ
  choice: meus rins se soltaram
  rationale: Mantém o termo anatômico concreto e verte o verbo como soltar ou afrouxar, preservando a estranheza da linguagem corporal antiga.
- source_word: ወወደቁ በገጽየ
  choice: e caí com o rosto em terra
  rationale: No encadeamento em primeira pessoa, a expressão descreve a queda ou prostração do próprio narrador; esta formulação é natural e digna em português.
theological_decisions:
- issue: Preservar “rins” como termo antropológico literal ou substituí-lo por uma expressão moderna
  choice: Manter “rins” no texto principal
  alternative: minhas entranhas se desfizeram; meu coração se derreteu
  rationale: A imagem concreta pertence à antiga linguagem corporal sobre o íntimo e as emoções. Substituí-la por “coração” resolveria interpretativamente uma figura que o texto mantém vívida e incomum.
- issue: Interpretar a ruptura dos lombos como descrição literal ou como perda de força
  choice: Conservar a imagem literal “meus lombos foram quebrados”
  alternative: meus quadris cederam; perdi a força dos lombos
  rationale: A tradução mantém a violência da reação visionária e a forma passiva da fonte, enquanto a nota registra uma leitura idiomática possível.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o ritmo cumulativo da reação corporal, com vocabulário digno e concreto. Os marcadores foram colocados junto às expressões que efetivamente explicam.
