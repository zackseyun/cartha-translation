base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/001.yaml
  text: In the five-hundredth year, in the seventh month, on the fourteenth day of the month, in the life of Henok, in that parable I saw that the heaven of heavens was shaken with a great shaking, and the host of the Most High, and the angels, thousands of thousands and ten thousand times ten thousand, were stirred in a great turmoil.
translation:
  language: pt
  text: No ano quingentésimo, no sétimo mês, no décimo quarto dia do mês, em vida de Enoque, naquela parábola vi que o céu dos céus[a] foi abalado com um grande abalo[c]; e o exército do Altíssimo[b] e os anjos — milhares de milhares e dez mil vezes dez mil — foram agitados em grande tumulto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mais alto céu”. O ge'ez diz literalmente “o céu dos céus”, expressão superlativa para a mais elevada região celestial.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida como “o exército do Altíssimo” também pode ser entendida de maneira mais abstrata como “o poder do Altíssimo”; porém, a referência imediata aos anjos em número imenso favorece o sentido coletivo de exército celestial.
    reason: lexical_alternative
  - marker: c
    text: Ou “foi violentamente abalado”. A tradução no texto procura conservar a construção enfática do ge'ez, literalmente semelhante a “foi abalado com um grande abalo”.
    reason: previous_rendering
lexical_decisions:
- source_word: በዓመት ፭ምእት
  choice: No ano quingentésimo
  rationale: Expressa de modo natural e solene a data ordinal indicada pelo ge'ez.
- source_word: በወርኅ ሳብዕ ... አመ ዐሡሩ ወረቡዑ ለወርኅ
  choice: no sétimo mês, no décimo quarto dia do mês
  rationale: Mantém com precisão os dois elementos da data e sua repetição formal.
- source_word: በሕይወተ ሄኖክ
  choice: em vida de Enoque
  rationale: Conserva a referência explícita à vida de Enoque em português corrente e digno.
- source_word: በውእቱ አምሳል
  choice: naquela parábola
  rationale: Mantém o termo tradicional desta seção de 1 Enoque sem reduzi-lo simplesmente a 'visão'.
- source_word: ሰማየ ሰማያት
  choice: o céu dos céus
  rationale: Preserva literalmente a expressão superlativa e a imagem cosmológica distintiva do texto.
- source_word: ታድለቀልቅ ... ይልቅልቅ ዐቢይ
  choice: foi abalado com um grande abalo
  rationale: Reproduz o substantivo cognato e o adjetivo 'grande', mantendo a intensificação retórica do ge'ez.
- source_word: ኀይሉ ልዑል
  choice: o exército do Altíssimo
  rationale: O contexto imediato de incontáveis anjos favorece o sentido coletivo de hoste ou exército, sem ocultar a alternativa abstrata.
- source_word: መላእክት አእላፈ አእላፍ ወትእልፊተ ትእልፊት
  choice: os anjos — milhares de milhares e dez mil vezes dez mil —
  rationale: Conserva a repetição numérica e a escala imensa da fórmula apocalíptica, com pontuação que torna a enumeração legível.
- source_word: ትሀውኩ ሁከተ ዐቢየ
  choice: foram agitados em grande tumulto
  rationale: Mantém tanto o movimento intenso quanto o substantivo de perturbação, em formulação clara e solene.
theological_decisions:
- issue: Se ኀይሉ ልዑል designa o poder abstrato de Deus ou seu exército celestial
  choice: o exército do Altíssimo
  alternative: o poder do Altíssimo
  rationale: A menção imediatamente seguinte aos anjos em números incontáveis favorece uma referência coletiva ao exército celeste; a nota preserva a ambiguidade lexical.
- issue: Como representar ሰማየ ሰማያት
  choice: o céu dos céus
  alternative: o mais alto céu
  rationale: A formulação literal preserva a elevação teológica e a imagem cósmica do original em vez de converter silenciosamente a expressão em um superlativo comum.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom solene apropriado à literatura apocalíptica. Emprega “Enoque”, forma portuguesa corrente do nome, e preserva deliberadamente as repetições enfáticas e a imagética cósmica do ge'ez.
