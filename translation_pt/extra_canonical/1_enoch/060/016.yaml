base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/016.yaml
  text: And the spirit of the sea is male and strong[a], and according to the might of its strength he holds it back with a rein[c][b], and thus it is driven out and scattered among all the mountains of the earth.
translation:
  language: pt
  text: E o espírito do mar é masculino e forte[a]; conforme o poder da força do mar[c], ele o contém com uma rédea[b]. E assim o mar é impelido para fora e disperso por todos os montes da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o vento do mar”. A palavra ge'ez traduzida por “espírito” também pode significar “vento” ou “sopro”; o contexto personificado favorece “espírito”.
    reason: lexical_alternative
  - marker: b
    text: A imagem parece retratar a força do mar sendo refreada e depois impelida ou dispersa pelos montes, talvez como névoa, borrifo ou nuvens de tempestade. O funcionamento exato da imagem não é inteiramente claro no testemunho ge'ez.
    reason: cultural_note
  - marker: c
    text: Lit. “conforme o poder da força dela”; a forma feminina remete ao mar.
    reason: grammar_clarification
lexical_decisions:
- source_word: መንፈሰ፡ ባሕር
  choice: o espírito do mar
  rationale: መንፈስ pode significar espírito, vento ou sopro. “Espírito” preserva melhor a personificação da força cósmica, sem eliminar a alternativa meteorológica.
- source_word: ተባዕታይ
  choice: macho
  rationale: O termo indica explicitamente o sexo masculino. “Macho” mantém a distinção entre o espírito masculino e o mar retomado pelas formas femininas no ge'ez.
- source_word: ዕኑፅ
  choice: forte
  rationale: Expressa força ou dureza; “forte” é claro e combina com a expressão intensificadora seguinte sem exagerá-la.
- source_word: ኃይለ፡ ጽንዐታ
  choice: o poder da força do mar
  rationale: A expressão reúne dois substantivos de força. O sufixo feminino em ጽንዐታ remete ao mar, e não ao espírito masculino; explicitar “do mar” evita uma referência pronominal ambígua em português.
- source_word: በአንቍ፡ ይገብእ
  choice: ele o contém com uma rédea
  rationale: Preserva a imagem de dominar uma força poderosa como quem controla um animal, enquanto “contém” exprime naturalmente a ideia de refrear ou reter.
- source_word: ትትነጻእ
  choice: o mar é impelido para fora
  rationale: As formas verbais femininas retomam o mar. A formulação conserva o movimento de saída ou expulsão e explicita o referente para evitar atribuí-lo ao espírito.
- source_word: ትዘራእ
  choice: disperso
  rationale: Embora o verbo possa significar literalmente “semeado”, aqui descreve uma propagação ampla; “disperso” comunica essa imagem com naturalidade.
- source_word: በአሉ፡ አድባረ፡ ምድር
  choice: por todos os montes da terra
  rationale: Mantém o alcance universal e o registro cosmológico; “por” expressa a dispersão através ou sobre o conjunto dos montes sem definir excessivamente sua mecânica.
theological_decisions:
- issue: Personificação das forças cósmicas
  choice: Manter o espírito do mar como agente masculino e poderoso
  alternative: Traduzir de modo impessoal como “vento do mar” ou omitir a indicação de sexo
  rationale: O texto apresenta uma força cósmica personificada e distingue gramaticalmente o espírito masculino do mar retomado por formas femininas. A tradução conserva essa tensão visionária sem reduzi-la a mera descrição meteorológica.
- issue: Referente da força e dos verbos femininos
  choice: Entender “sua força” e os verbos de saída e dispersão como referentes ao mar
  alternative: Entendê-los como referentes ao espírito do mar
  rationale: O sufixo feminino de ጽንዐታ e as formas femininas ትትነጻእ e ትዘራእ apontam para ባሕር, enquanto o espírito é explicitamente masculino e rege ይገብእ.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A ordem foi levemente ajustada e os referentes foram explicitados para preservar a distinção gramatical do ge'ez. “Macho” é deliberadamente direto e incomum, pois o original marca explicitamente o sexo da figura personificada.
