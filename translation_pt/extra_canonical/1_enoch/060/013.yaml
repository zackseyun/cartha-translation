base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/013.yaml
  text: And the thunder[a], according to their places of striking, and for every division that is divided by the lightning, so that it may flash—and their restraint[d][c][b], so that they may hear quickly.
translation:
  language: pt
  text: E os trovões, conforme seus respectivos lugares onde caem[a]; e para cada divisão que é dividida pelo relâmpago[b], para que relampeje; e a contenção deles[c], para que ouçam prontamente[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez é difícil. A expressão significa literalmente algo como “segundo seus respectivos lugares de queda”; também já foi entendida como “em seus lugares” ou “segundo suas medidas”.
    reason: lexical_alternative
  - marker: b
    text: “Cada divisão que é dividida” conserva a repetição do original. A expressão talvez se refira a cada parte delimitada ou distribuída dos fenômenos da tempestade.
    reason: lexical_alternative
  - marker: c
    text: O termo traduzido por “contenção” também pode significar “paciência”, “perseverança” ou “espera”.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “para que ouçam prontamente”. No contexto, “ouvir” pode incluir a ideia de responder ou obedecer sem demora.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጐድጓድ
  choice: os trovões
  rationale: O substantivo denota trovão ou trovoada. O plural em português acomoda os sufixos plurais do contexto e a distribuição pelos respectivos lugares, sem transformar a imagem em uma explicação meteorológica.
- source_word: በበመዳቃቲሆሙ
  choice: conforme seus respectivos lugares de impacto
  rationale: A preposição distributiva duplicada favorece “respectivos”, e መዳቃ designa concretamente o lugar onde algo cai ou atinge. “Lugares de impacto” preserva essa imagem melhor que “estações”.
- source_word: ኵሉ ክፍለ ዘይትከፈል
  choice: cada divisão que é dividida
  rationale: Mantém a repetição cognata e a formulação incomum do texto, em vez de suavizá-la como mera referência a partes ou seções.
- source_word: በመብረቅ
  choice: pelo relâmpago
  rationale: 'A construção admite valor instrumental: a divisão é efetuada ou assinalada pelo relâmpago.'
- source_word: ከመ ይበርቅ
  choice: para que ele fulgure
  rationale: O verbo é cognato da ideia de relâmpago e brilho. “Fulgure” conserva a imagem súbita e intensa sem acrescentar uma direção inexistente no texto.
- source_word: ትዕግሥቶሙ
  choice: a contenção deles
  rationale: O termo pode expressar paciência, perseverança, espera ou domínio. Neste contexto de forças cósmicas controladas, “contenção” é a opção mais concreta, mas a ambiguidade é registrada em nota.
- source_word: ፍጡነ ይስምዑ
  choice: para que ouçam prontamente
  rationale: Preserva o sentido lexical básico de ouvir, enquanto “prontamente” comunica rapidez e permite, sem impor, a possível nuance semítica de responder ou obedecer.
theological_decisions:
- issue: Se a cláusula final deve ser interpretada explicitamente como obediência das forças cósmicas à ordem divina
  choice: Manter “para que ouçam prontamente” no texto principal
  alternative: “para que obedeçam prontamente”
  rationale: O verbo significa primariamente ouvir ou escutar, embora possa implicar resposta obediente. A tradução não deve resolver a favor de uma leitura teológica mais específica aquilo que permanece ambíguo no texto.
- issue: Se a sequência obscura deve ser parafraseada como uma descrição geral da ordem dos fenômenos atmosféricos
  choice: Conservar a enumeração concreta e fragmentária de trovões, lugares de impacto, divisões, relâmpago e contenção
  alternative: Parafrasear como “e como todos os fenômenos da tempestade cumprem ordenadamente suas funções”
  rationale: A paráfrase eliminaria a dificuldade real do ge'ez e acrescentaria relações lógicas que o verso não explicita.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com pontuação semicolonada para tornar legível a enumeração fragmentária sem criar conexões ausentes no ge'ez. “Fulgure” é levemente elevado, mas corrente em registro bíblico-literário e adequado à imagem do relâmpago.
