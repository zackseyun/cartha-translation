base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/011.yaml
  text: And another angel[a], who went with me and showed me what is hidden, told me what is first and what is last in heaven, in the height, and beneath the earth in the depth, and at the ends of heaven[c][b], and at the foundations of heaven.
translation:
  language: pt
  text: E outro anjo, que ia comigo e me mostrava o que está oculto, disse-me o que é primeiro e o que é último[a] no céu, nas alturas, debaixo da terra, nas profundezas, nos confins do céu e nos fundamentos do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O que é primeiro e o que é último” também pode ser traduzido por “o primeiro e o último”. Aqui, a expressão é entendida de modo descritivo, como parte da enumeração dos extremos cósmicos revelados a Enoque, e não como um título.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: disse-me
  rationale: Preserva a fórmula narrativa simples e, em português, permite que a oração seguinte funcione naturalmente como seu complemento.
- source_word: መልአክ ካልእ
  choice: outro anjo
  rationale: Indica um anjo adicional, sem impor o sentido ordinal de “segundo”.
- source_word: ዘምስሌየ የሐውር
  choice: que ia comigo
  rationale: Mantém o sentido de acompanhamento e movimento, com aspecto natural em português.
- source_word: ወዘኅቡእ ያርእየኒ
  choice: e me mostrava o que está oculto
  rationale: Segue a leitura restaurada indicada pela revisão textual, em vez da forma corrompida da transcrição, e preserva a função reveladora do anjo.
- source_word: ቀዳሜ ወድኃሬ
  choice: o que é primeiro e o que é último
  rationale: Conserva o caráter descritivo do par e evita transformá-lo indevidamente em título teológico.
- source_word: በሰማየ
  choice: no céu
  rationale: Expressa o valor locativo e acompanha o singular da forma etíope.
- source_word: በውስተ ላዕሉ
  choice: nas alturas
  rationale: Comunica a região cósmica superior em linguagem natural e digna.
- source_word: ወበታሕተ ምድር በመዓምቅ
  choice: debaixo da terra, nas profundezas
  rationale: Adota a restauração textual “terra” registrada na revisão e conserva o sentido espacial de profundidade sem especificá-lo como “abismo”.
- source_word: በአጽናፈ ሰማይ
  choice: nos confins do céu
  rationale: “Confins” preserva a imagem das extremidades cósmicas com registro apocalíptico natural em português.
- source_word: በመሠረተ ሰማይ
  choice: nos fundamentos do céu
  rationale: Mantém diretamente a imagem arquitetônica da cosmologia apocalíptica.
theological_decisions:
- issue: Se ቀዳሜ ወድኃሬ deve ser traduzido como expressão titular (“o Primeiro e o Último”)
  choice: o que é primeiro e o que é último
  alternative: o primeiro e o último
  rationale: No contexto, a expressão integra a enumeração do que o anjo revela e não constitui claramente uma autodesignação divina. A formulação descritiva evita harmonização teológica posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o tom solene da visão e a enumeração cosmológica, mas usa “nas alturas”, “nas profundezas” e “confins” para evitar construções excessivamente literais ou pouco idiomáticas.
