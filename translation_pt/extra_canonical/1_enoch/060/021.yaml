base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/021.yaml
  text: And when the spirit of the rain is stirred from its storehouse[a], the angels come and open the storehouse and bring it out. And when it is scattered upon all the dry ground, it is joined with the water that is upon the dry ground; and whenever it is joined with the water upon the dry ground . [d][c][b]. .
translation:
  language: pt
  text: E, quando o espírito da chuva é posto em movimento a partir de seu depósito, os anjos vêm, abrem o depósito e o fazem sair. E, quando ele é espalhado[b][d] sobre toda a terra seca, une-se à água que está sobre a terra seca; e, sempre que se une à água que está sobre a terra seca...[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge’ez repete a oração sobre a união com a água que está sobre a terra seca. O fim da frase é difícil e o texto parece interromper-se; pode indicar união recorrente ou permanência contínua depois que a chuva se junta às águas da superfície.
    reason: textual_variant
  - marker: b
    text: Mais literalmente, “é semeado”, imagem aplicada à chuva distribuída sobre a terra.
    reason: lexical_alternative
  - marker: c
    text: 'Outra tradução possível para o trecho final: “e, quando se une à água que está sobre a terra seca, permanece unido a ela continuamente”.'
    reason: previous_rendering
  - marker: d
    text: Ou “é derramado”.
    reason: previous_rendering
lexical_decisions:
- source_word: መንፈሱ፡ ለዝናም
  choice: o espírito da chuva
  rationale: Mantém o sentido de መንፈስ como espírito, vento ou sopro e preserva a personificação cosmológica do fenômeno, sem reduzi-lo a linguagem meteorológica moderna.
- source_word: ይትኃወስ
  choice: é posto em movimento
  rationale: Expressa movimento ou agitação e soa mais natural em português do que uma tradução excessivamente literal como “é agitado” neste contexto.
- source_word: መዝገበ
  choice: depósito
  rationale: Conserva a imagem concreta de um reservatório celestial. “Tesouro” seria possível, mas poderia sugerir riquezas em vez de armazenamento.
- source_word: ይመጽኡ፡ መላእክት
  choice: os anjos vêm
  rationale: Preserva a atuação pessoal e explícita dos anjos na administração do depósito.
- source_word: ያርኅዉ፡ መዝገበ
  choice: abrem o depósito
  rationale: Verte diretamente a ação sem acrescentar a ideia mais específica de destrancar.
- source_word: ያወጽእዎ
  choice: o fazem sair
  rationale: Retém o valor causativo do verbo e deixa o referente masculino ligado ao “espírito da chuva”.
- source_word: ይዘራእ
  choice: é espalhado
  rationale: O verbo tem o sentido básico de semear ou espalhar. “Espalhado” preserva a distribuição da chuva sobre o solo sem impor uma metáfora agrícola pouco natural em português.
- source_word: የብስ
  choice: terra seca
  rationale: Mantém o contraste entre a porção seca da terra e a água presente sobre ela.
- source_word: ይትኃበር፡ ምስለ፡ ማይ
  choice: une-se à água
  rationale: Reproduz o sentido passivo-reflexivo de juntar-se ou combinar-se, com formulação natural em português.
- source_word: በኵሉ፡ ጊዜ
  choice: sempre que
  rationale: Integra a expressão temporal à repetição de “quando”, comunicando recorrência. Como a construção final é difícil, uma leitura de continuidade é registrada em nota.
theological_decisions:
- issue: Se a atuação da chuva deve ser convertida em linguagem meteorológica impessoal
  choice: Manter “o espírito da chuva” e a administração angelical do depósito
  alternative: Traduzir como “quando a chuva sai de seu reservatório” ou “quando a tempestade é liberada”
  rationale: O texto apresenta uma cosmologia apocalíptica na qual fenômenos naturais são associados a forças e agentes celestiais. A tradução conserva essa concepção textual sem afirmá-la ou reinterpretá-la doutrinariamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva a repetição solene do original, enquanto as reticências e as notas deixam visível a dificuldade do final transmitido.
