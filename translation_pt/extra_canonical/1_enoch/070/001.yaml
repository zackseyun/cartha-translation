  to: E aconteceu, depois disso, que o nome dele foi elevado,[a] enquanto ele ainda vivia, para junto daquele Filho do Homem e do Senhor dos Espíritos, longe dos que habitam sobre a terra seca.[b]
  rationale: A revisão elimina a implicação reflexiva de «afastando-se», melhora a fluidez da coordenação e reposiciona a nota lexical junto à expressão que ela esclarece. Mantêm-se a ambiguidade do «nome» elevado, o valor temporal de «ainda vivia» e a linguagem espacial do original.
