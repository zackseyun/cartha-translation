base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/001.yaml
  text: And it came to pass after this that his name was lifted up during his lifetime before that Son of Man and before the Lord of Spirits[b][a], away from those who dwell on the dry ground.
translation:
  language: pt
  text: E aconteceu, depois disso, que o nome dele foi elevado,[a] enquanto ele ainda vivia, para junto daquele Filho do Homem e do Senhor dos Espíritos, longe dos que habitam sobre a terra seca.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «o nome dele foi elevado». A expressão pode indicar que o próprio Enoque foi levado, ainda em vida, à presença do Filho do Homem e do Senhor dos Espíritos.
    reason: lexical_alternative
  - marker: b
    text: Ou «dos que habitam sobre a terra». O ge'ez diz mais especificamente «sobre a terra seca».
    reason: lexical_alternative
lexical_decisions:
- source_word: ተለዓለ፡
  choice: foi elevado
  rationale: Preserva a imagem de movimento para o alto sem decidir se se trata especificamente de arrebatamento, exaltação ou de ambos.
- source_word: ስሙ፡
  choice: o nome dele
  rationale: Traduz literalmente o substantivo, embora o nome possa representar a própria pessoa ou identidade no idioma do texto.
- source_word: ሕያው፡
  choice: enquanto ele ainda vivia
  rationale: Expressa de modo natural o valor temporal do termo e evita a leitura pouco provável de que «vivo» qualifique «nome».
- source_word: በኀቤሁ፡ ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው፡
  choice: para junto daquele Filho do Homem
  rationale: Comunica movimento em direção à figura ou à sua presença; mantém o demonstrativo e o caráter titular da expressão.
- source_word: እግዚአ፡ መናፍስት፡
  choice: Senhor dos Espíritos
  rationale: Conserva o título solene e recorrente em 1 Enoque.
- source_word: እምእለ፡ የኃድሩ፡ ዲበ፡ የብስ።
  choice: afastando-se dos que habitam sobre a terra seca
  rationale: Mantém o contraste espacial entre a elevação de Enoque e os habitantes terrestres, além da imagem concreta de terra seca.
theological_decisions:
- issue: Se «o nome dele foi elevado» deve ser mantido como expressão literal ou interpretado diretamente como a elevação do próprio Enoque
  choice: Manter «o nome dele foi elevado» no texto principal
  alternative: «ele foi levado para o alto ainda em vida» ou «sua fama foi exaltada»
  rationale: O ge'ez menciona explicitamente o nome; preservar a formulação mantém aberta a sobreposição apocalíptica entre nome, identidade e pessoa, sem reduzir o sentido a fama nem especificar o modo da elevação.
- issue: Como representar ወልደ እጓለ እመሕያው
  choice: «daquele Filho do Homem»
  alternative: «daquele filho do homem» ou «daquele ser humano»
  rationale: No contexto das Parábolas, a expressão tem força de título apocalíptico. A inicial maiúscula sinaliza essa função, enquanto «daquele» preserva o demonstrativo do ge'ez sem impor uma identificação doutrinária posterior.
translation_notes:
  register: Português moderno, solene e acessível, com sintaxe narrativa natural. «Para junto de» preserva tanto o movimento quanto a ideia de ingresso na presença; «terra seca» conserva a imagem cosmológica concreta do original.
