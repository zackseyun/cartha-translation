revisions:
- from: Depois disso, seu nome foi elevado, ainda em vida, à presença daquele Filho do Homem e do Senhor dos Espíritos, dentre os que habitam sobre a terra. Ele foi elevado nas carruagens do espírito, e seu nome saiu do meio deles.[a] Desde aquele dia, já não fui contado entre eles. Ele me colocou entre os dois ventos, entre o norte e o oeste, onde os anjos tomaram as cordas para medir para mim um lugar destinado aos escolhidos e aos justos. Ali vi os primeiros pais e os justos que habitam naquele lugar desde os tempos antigos.
  to: Depois disso, seu nome foi elevado, ainda vivo, para junto daquele Filho do Homem e do Senhor dos Espíritos, dentre os que habitam na terra. Ele foi elevado em carruagens de espírito, e seu nome saiu dentre eles.[a] Desde aquele dia, já não fui contado entre eles. Ele me colocou entre os dois espíritos, entre o norte e o oeste, onde os anjos tomaram cordas para medir para mim um lugar destinado aos escolhidos e aos justos. Ali vi os antepassados antigos e os justos, que habitam naquele lugar desde o princípio.
  rationale: A revisão mantém a extensão integral do texto-fonte fornecido, inclusive a mudança pronominal e as imagens apocalípticas. Corrige “ventos” para “espíritos”, substitui “primeiros pais” por uma expressão não restritiva e ajusta a nota para refletir com precisão a formulação ge'ez e sua possível leitura idiomática. Não se resolve a natureza da elevação nem se identifica “espíritos” com ventos.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:00:26Z'
