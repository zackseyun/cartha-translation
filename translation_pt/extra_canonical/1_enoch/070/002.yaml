base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/002.yaml
  text: And he was lifted up on the chariot of the spirit[b][a], and his name vanished from among them.
translation:
  language: pt
  text: Depois disso, seu nome foi elevado, ainda vivo, para junto daquele Filho do Homem e do Senhor dos Espíritos, dentre os que habitam na terra. Ele foi elevado em carruagens de espírito, e seu nome saiu dentre eles.[a] Desde aquele dia, já não fui contado entre eles. Ele me colocou entre os dois espíritos, entre o norte e o oeste, onde os anjos tomaram cordas para medir para mim um lugar destinado aos escolhidos e aos justos. Ali vi os antepassados antigos e os justos, que habitam naquele lugar desde o princípio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope usa literalmente o verbo “sair” e diz que o nome saiu “entre eles”. A formulação pode ser entendida idiomaticamente como “seu nome desapareceu do meio deles”; outras formas textuais e traduções também trazem essa leitura.
    reason: textual_variant
lexical_decisions:
- source_word: ተለዐለ
  choice: foi elevado
  rationale: A forma verbal expressa movimento ascendente com valor passivo ou reflexivo. “Foi elevado” conserva tanto a subida quanto a ação recebida, sem decidir se a cena descreve transporte corporal, visão ou exaltação.
- source_word: በሠረገላተ፡ መንፈስ
  choice: nas carruagens do espírito
  rationale: O plural ሠረገላተ é mantido, ao contrário do singular da camada inglesa. A construção genitiva é vertida diretamente, sem identificar ou personificar “espírito” além do que o texto permite.
- source_word: ወወፅአ፡ ስም፡ በማእከሎሙ
  choice: e seu nome saiu do meio deles
  rationale: A redação fornecida usa o verbo “sair/partir” e a forma ስም, não o verbo “desaparecer” da leitura citada na revisão anterior. A tradução mantém a formulação incomum e evita substituir o testemunho apresentado por uma variante mais fluente.
- source_word: ኢተስሕብኩ፡ በማእከሎሙ
  choice: já não fui contado entre eles
  rationale: No contexto, a forma indica deixar de ser incluído ou contado no grupo. A primeira pessoa é preservada, inclusive a mudança abrupta em relação à terceira pessoa anterior.
- source_word: መስዕ፡ ወዐረብ
  choice: o norte e o oeste
  rationale: Os dois termos designam direções, tradicionalmente entendidas aqui como norte e oeste. A ordem do texto-fonte é preservada.
- source_word: ይስፍሩ፡ ሊተ፡ መካነ
  choice: medir para mim um lugar
  rationale: Mantém-se a imagem concreta da medição de um lugar para o narrador, em conexão com as cordas tomadas pelos anjos.
- source_word: እምዓለም
  choice: desde os tempos antigos
  rationale: A expressão pode indicar “desde a antiguidade”, “desde o princípio” ou “desde a eternidade”. A opção escolhida preserva a antiguidade indefinida sem impor uma afirmação metafísica mais forte.
theological_decisions:
- issue: Natureza da elevação de Enoque
  choice: Linguagem de elevação sem especificar o modo
  alternative: Ascensão corporal, transporte visionário ou exaltação honorífica
  rationale: O verbo e as carruagens do espírito sugerem movimento ascendente, mas não determinam de modo inequívoco a natureza da experiência.
- issue: Mudança da terceira para a primeira pessoa
  choice: Preservar “seu/ele” e depois “fui/me”
  alternative: Harmonizar toda a passagem na primeira pessoa
  rationale: A alternância está no testemunho fornecido e pode refletir a forma literária ou a transmissão do texto. Harmonizá-la eliminaria uma tensão genuína.
- issue: Destino do lugar medido
  choice: “um lugar destinado aos escolhidos e aos justos”
  alternative: “o lugar dos escolhidos e dos justos”
  rationale: A formulação escolhida comunica a relação do lugar com esses grupos sem acrescentar uma definição escatológica mais precisa do que a fonte oferece.
translation_notes:
  register: Português moderno, digno e acessível, com ordem narrativa próxima do ge'ez. Foram preservados o plural “carruagens”, a expressão apocalíptica “Senhor dos Espíritos” e a mudança inesperada da terceira para a primeira pessoa. Embora a referência fornecida seja 1 Enoque 70:2, o bloco-fonte contém material correspondente a uma unidade mais extensa; por isso, o rascunho traduz integralmente o texto ge'ez apresentado.
