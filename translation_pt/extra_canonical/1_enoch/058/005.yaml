  text: And after this it will be said to the holy ones in heaven[c][b][a],
translation:
  language: pt
  text: E, depois disso, será dito aos santos no céu[a][b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isso será dito”. A construção em geʽez é passiva e impessoal e não identifica quem fala.'
    reason: lexical_alternative
  - marker: b
    text: “Santos” pode referir-se a seres celestiais ou aos justos que estão no céu; esta oração, por si só, não especifica a identidade deles.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “será falado”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: E, depois disso
  rationale: A expressão temporal composta liga esta declaração à etapa seguinte da visão. “Depois disso” é natural em português e preserva a sequência narrativa.
- source_word: ይትበሀል
  choice: será dito
  rationale: O verbo é uma forma passiva de “dizer”. A construção impessoal conserva a ausência de um falante expresso no geʽez e é idiomática em português.
- source_word: ለቅዱሳን
  choice: aos santos
  rationale: Traduz diretamente o termo referente aos “santos” ou “sagrados”, sem especificar se são seres celestiais ou justos no céu. A preposição “a” se ajusta naturalmente ao verbo passivo.
- source_word: በሰማይ
  choice: no céu
  rationale: O substantivo está no singular no testemunho fornecido; “no céu” mantém esse número e soa natural em português.
theological_decisions:
- issue: Identidade dos “santos”
  choice: Manter “os santos” sem identificar o grupo com maior precisão
  alternative: “os seres santos”, “os anjos” ou “os justos”
  rationale: A breve oração não determina se a expressão designa seres celestiais, justos que estão no céu ou outro grupo santificado. A tradução preserva essa abertura teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem da oração permanece próxima do geʽez. A vírgula final indica que o enunciado continua no versículo seguinte.
