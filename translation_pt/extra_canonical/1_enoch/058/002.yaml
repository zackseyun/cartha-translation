base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/002.yaml
  text: Blessed are you[a], O righteous and chosen ones, for your portion is glorious.
translation:
  language: pt
  text: Bem-aventurados são vocês, ó justos e escolhidos, pois a porção de vocês é gloriosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a parte de vocês” ou “o quinhão de vocês”. O termo ge'ez designa uma porção atribuída, semelhante a uma parte de herança.
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: Bem-aventurados
  rationale: Preserva a força de uma fórmula de bênção e o registro elevado; “felizes” seria possível, mas atenuaria a ressonância bíblica e apocalíptica.
- source_word: አንትሙ
  choice: são vocês
  rationale: Expressa de modo claro e atual o destinatário plural da bênção, com boa legibilidade brasileira e compreensão ampla no português moderno.
- source_word: ጻድቃን
  choice: justos
  rationale: É o termo bíblico corrente para aqueles caracterizados pela justiça e mantém o contraste recorrente entre justos e ímpios.
- source_word: ወኅሩያን
  choice: escolhidos
  rationale: Conserva o valor substantivado e a ideia de pessoas escolhidas sem introduzir no texto principal a carga doutrinária posterior que “eleitos” pode adquirir.
- source_word: እስመ
  choice: pois
  rationale: Introduz com concisão e naturalidade o fundamento da bênção.
- source_word: ስቡሕ
  choice: gloriosa
  rationale: Exprime glória ou esplendor e se ajusta naturalmente à descrição predicativa da porção destinada aos justos.
- source_word: ክፍልክሙ
  choice: a porção que lhes cabe
  rationale: Preserva a imagem de uma parte atribuída ou semelhante a uma herança, ao mesmo tempo que evita a possível sugestão de acaso associada a “sorte”.
theological_decisions:
- issue: Designação do grupo em ወኅሩያን
  choice: escolhidos
  alternative: eleitos
  rationale: “Escolhidos” mantém o peso pactual e escatológico do termo no contexto sem resolver a expressão por meio de categorias sistemático-teológicas posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Bem-aventurados” preserva o tom de beatitude; “vocês” evita uma conjugação excessivamente arcaica, enquanto o vocativo “ó justos e escolhidos” conserva a solenidade do discurso apocalíptico.
