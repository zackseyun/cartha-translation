base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/001.yaml
  text: And I began to speak the third parable concerning the righteous and concerning the chosen[a].
translation:
  language: pt
  text: E comecei a proferir a terceira parábola[a] a respeito dos justos e dos escolhidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a terceira similitude». O termo ge'ez pode designar um discurso apresentado como parábola ou similitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: አኀዝኩ
  choice: comecei
  rationale: O verbo pode significar tomar, agarrar ou começar; neste cabeçalho narrativo, o sentido incoativo é o mais adequado.
- source_word: እበል
  choice: a proferir
  rationale: Como complemento de «comecei», introduz um discurso extenso. «Proferir» preserva o ato de falar e mantém um registro digno e natural.
- source_word: ሣልሰ ምሳሌ
  choice: a terceira parábola
  rationale: ምሳሌ pode designar parábola, similitude ou discurso figurado. «Parábola» é claro para leitores modernos, e a alternativa lexical é preservada em nota.
- source_word: በእንተ ጻድቃን
  choice: a respeito dos justos
  rationale: በእንተ marca o assunto, «a respeito de»; ጻድቃን é mantido como a designação coletiva «os justos».
- source_word: ወበእንተ ኅሩያን
  choice: e dos escolhidos
  rationale: A elipse de «a respeito» é natural em português, e «escolhidos» preserva a designação apocalíptica sem acrescentar associações doutrinárias posteriores.
theological_decisions:
- issue: Designação coletiva ኅሩያን
  choice: os escolhidos
  alternative: os eleitos
  rationale: «Escolhidos» conserva o sentido local da categoria e evita a carga sistemática que «eleitos» pode adquirir em tradições teológicas posteriores.
- issue: Rótulo literário ምሳሌ
  choice: parábola
  alternative: similitude
  rationale: «Parábola» oferece maior clareza ao leitor moderno, enquanto a nota mantém a alternativa «similitude» e a amplitude semântica do termo ge'ez.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação mantém o paralelismo temático do ge'ez sem importar terminologia confessional.
