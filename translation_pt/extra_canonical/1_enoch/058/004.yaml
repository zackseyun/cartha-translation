base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/004.yaml
  text: And they will seek the light and find righteousness with the Lord of Spirits[c][b][a]. Peace be to the righteous in the name of the Lord of Eternity.
translation:
  language: pt
  text: Eles buscarão a luz e encontrarão a justiça[a] junto ao Senhor dos Espíritos[b]. Paz aos justos, em nome do Senhor da Eternidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obterão a justiça”; o verbo ge''ez pode significar tanto encontrar quanto obter.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “diante do Senhor dos Espíritos”. A preposição também pode indicar presença ou procedência.'
    reason: lexical_alternative
  - marker: c
    text: O título também pode ser traduzido como “Senhor eterno”, “Senhor do Mundo” ou “Senhor da Era”; o termo ge'ez abrange as ideias de eternidade, mundo e era.
    reason: lexical_alternative
lexical_decisions:
- source_word: የኃሥሡ
  choice: buscarão
  rationale: A forma verbal plural expressa buscar ou procurar; o futuro se ajusta à sequência visionária do contexto.
- source_word: ለብርሃን
  choice: a luz
  rationale: A marca de objeto favorece entender “luz” como aquilo que é buscado, preservando a imagem apocalíptica.
- source_word: ይረክቡ
  choice: encontrarão
  rationale: O verbo pode significar encontrar ou obter. “Encontrarão” mantém a correspondência natural com “buscarão” sem excluir totalmente a ideia de alcançar ou receber.
- source_word: ጽድቀ
  choice: a justiça
  rationale: “Justiça” comunica em português tanto a dimensão moral quanto a relacional do termo e se liga naturalmente a “justos” na frase seguinte.
- source_word: በኀበ
  choice: junto ao
  rationale: A preposição indica proximidade ou relação com uma pessoa. “Junto ao” preserva a abertura entre presença, localização relacional e procedência.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém o título divino característico de 1 Enoque e seu alcance cósmico.
- source_word: ሰላም ለጻድቃን
  choice: Paz aos justos
  rationale: A construção nominal concisa conserva a força de bênção ou proclamação do original.
- source_word: በስመ
  choice: em nome de
  rationale: Preserva de modo transparente a expressão formular do texto.
- source_word: እግዚአ ዓለም
  choice: Senhor da Eternidade
  rationale: O substantivo ዓለም pode designar era, mundo ou eternidade. Neste título divino, “da Eternidade” exprime adequadamente o alcance temporal e cósmico sem sugerir domínio limitado a uma única era.
theological_decisions:
- issue: Sentido de ጽድቀ após o verbo “encontrar”
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a amplitude moral e relacional do termo; “retidão” é possível, mas estreitaria sua ressonância.
- issue: Relação da justiça com o Senhor dos Espíritos
  choice: junto ao Senhor dos Espíritos
  alternative: diante do Senhor dos Espíritos / proveniente do Senhor dos Espíritos
  rationale: “Junto ao” evita decidir se a justiça é encontrada na presença de Deus ou recebida dele.
- issue: Título divino final እግዚአ ዓለም
  choice: Senhor da Eternidade
  alternative: Senhor eterno / Senhor do Mundo / Senhor da Era
  rationale: A escolha acolhe o valor de duração ilimitada apropriado ao título, enquanto a nota registra a polissemia real de ዓለም e evita ocultar a tensão temporal e cósmica.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe concisa adequada à proclamação apocalíptica. “Paz aos justos” preserva deliberadamente a forma nominal e beneditória do ge'ez.
