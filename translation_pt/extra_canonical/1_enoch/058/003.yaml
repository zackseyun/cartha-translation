base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/003.yaml
  text: And the righteous shall be in the light of the sun[a], and the chosen in the light of eternal life; and there shall be no end to the days of their life[b], and the holy ones shall have days without number.
translation:
  language: pt
  text: E os justos estarão na luz do sol, e os escolhidos, na luz da vida eterna; os dias de sua vida não terão fim, e os santos terão dias sem número.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para os santos não haverá número de dias”; isto é, seus dias não poderão ser contados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጻድቃን
  choice: os justos
  rationale: Forma substantivada natural em português bíblico moderno, preservando o sentido ético de pessoas caracterizadas pela justiça.
- source_word: በብርሃነ ፀሐይ
  choice: na luz do sol
  rationale: Mantém de perto a imagem cósmica e visionária do ge'ez sem reduzi-la simplesmente a claridade.
- source_word: ኅሩያን
  choice: os escolhidos
  rationale: Expressa a condição de pessoas escolhidas por Deus de modo acessível e evita a carga doutrinária mais específica que 'eleitos' pode adquirir.
- source_word: በብርሃነ ሕይወት ዘለዓለም
  choice: na luz da vida eterna
  rationale: Preserva a imagem apocalíptica da luz associada à vida eterna e acompanha a estrutura da expressão-fonte.
- source_word: ማኅለቆተ አልቦቱ
  choice: não terão fim
  rationale: Comunica naturalmente em português a ausência absoluta de término ou limite.
- source_word: መዋዕለ ሕይወቶሙ
  choice: os dias de sua vida
  rationale: Conserva a imagem temporal explícita e a forma coletiva do original.
- source_word: ቅዱሳን
  choice: os santos
  rationale: É a designação substantivada corrente e inteligível em português; aqui indica os que são santos, sem especificar uma categoria eclesiástica posterior.
- source_word: ኍልቈ መዋዕለ አልቦሙ
  choice: terão dias sem número
  rationale: Reproduz o idioma de duração incontável sem a ambiguidade indesejada de uma formulação como 'não terão número de dias', que poderia sugerir ausência de dias.
theological_decisions:
- issue: Tradução de ኅሩያን
  choice: os escolhidos
  alternative: os eleitos
  rationale: A opção escolhida mantém a categoria teológica do texto, mas evita importar associações confessionais posteriores ligadas ao termo 'eleitos'.
- issue: Sentido da cláusula final sobre os dias dos santos
  choice: os santos terão dias sem número
  alternative: os dias dos santos serão incontáveis
  rationale: A formulação conserva os elementos e o paralelismo do ge'ez, ao mesmo tempo que comunica claramente duração ilimitada.
- issue: Relação entre justos, escolhidos e santos
  choice: manter as três designações distintas
  alternative: harmonizá-las como referência explícita a um único grupo
  rationale: O verso usa três títulos e não esclarece plenamente se são categorias idênticas ou grupos correlatos; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação realça o paralelismo das duas primeiras orações. O marcador [a] aparece no texto principal e explica apenas o idioma incomum da cláusula final.
