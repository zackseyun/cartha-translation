base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/008.yaml
  text: And into darkness and into a snare and into a blazing fire your spirits shall enter[a], into the great judgment; and the great judgment shall be for all the generations of eternity. Woe to you[e][d][c][b], for you have no peace.
translation:
  language: pt
  text: O espírito de vocês entrará nas trevas, numa armadilha e num fogo ardente, rumo ao grande juízo[a]; e o grande juízo será para todas as gerações da eternidade[b]. Ai de vocês, pois não têm paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge’ez traz “espírito” e o verbo no singular, mas o possessivo se refere a várias pessoas; por isso, literalmente, “o espírito de vocês”. A preposição que introduz “o grande juízo” exprime direção e também pode ser traduzida como “para o grande juízo”.
    reason: grammatical_note; alternative_reading
  - marker: b
    text: A expressão “todas as gerações da eternidade” é incomum e enfatiza a duração ou o alcance permanente do juízo; também poderia ser vertida como “por todas as gerações, para sempre”.
    reason: cultural_note
lexical_decisions:
- source_word: በጽልመት
  choice: nas trevas
  rationale: A preposição ocorre numa sequência ligada ao verbo “entrar” e indica ingresso em um domínio ou condição. “Nas trevas” é natural em português e mantém a imagem apocalíptica.
- source_word: በመርበብት
  choice: numa armadilha
  rationale: O substantivo está no singular e evoca algo usado para capturar. “Armadilha” comunica melhor essa função em português corrente do que o concreto e potencialmente ambíguo “rede”.
- source_word: በላህብ ዘይነድድ
  choice: num fogo ardente
  rationale: A expressão combina o nome “chama/fogo” com uma forma relativa, “que arde”. A formulação escolhida preserva a intensidade sem perder naturalidade.
- source_word: ትበውእ መንፈስክሙ
  choice: entrará o espírito de vocês
  rationale: O nome e o verbo estão no singular, enquanto o sufixo possessivo se dirige a várias pessoas. A tradução mantém essa concordância sem transformar “espírito” em uma afirmação antropológica mais ampla.
- source_word: ኀበ ኵነኔ ዐባይ
  choice: rumo ao grande juízo
  rationale: ኀበ tem força direcional. “Rumo ao” preserva o movimento em direção ao juízo e evita interpretá-lo como mera finalidade.
- source_word: ኵነኔ ዐባይ
  choice: grande juízo
  rationale: “Juízo” conserva a amplitude judicial do termo, que pode abranger julgamento, sentença e resultado punitivo, sem estreitá-lo a “condenação”.
- source_word: ለኵሉ ትውልደ ዓለም
  choice: para todas as gerações da eternidade
  rationale: A construção solene e incomum do ge’ez é preservada, em vez de ser reduzida simplesmente a “para sempre”.
- source_word: ኴሌ ለክሙ
  choice: Ai de vocês
  rationale: É a fórmula portuguesa corrente de denúncia profética e conserva a força da exclamação.
- source_word: እስመ አልብክሙ ሰላመ
  choice: pois não têm paz
  rationale: A frase expressa diretamente a privação da paz como fundamento do “ai” e permanece clara para leitores modernos.
theological_decisions:
- issue: O sentido de “o espírito de vocês” no contexto do juízo
  choice: Manter “o espírito de vocês”, no singular gramatical, sem explicar uma doutrina da condição pós-morte.
  alternative: “os espíritos de vocês” ou “vocês mesmos”
  rationale: O ge’ez apresenta “espírito” e o verbo no singular, mas dirige o possessivo a um grupo. Preservar essa forma evita resolver silenciosamente questões sobre alma, corpo ou estado intermediário.
- issue: A amplitude de ኵነኔ
  choice: Traduzir por “juízo”.
  alternative: “condenação” ou “sentença”
  rationale: Embora o contexto seja punitivo, “juízo” mantém a amplitude judicial do termo e não impõe uma conclusão teológica mais estreita.
- issue: Relação entre a entrada e o grande juízo
  choice: Preservar o sentido direcional com “rumo ao grande juízo”.
  alternative: “para o grande juízo”, entendido como finalidade
  rationale: A preposição ge’ez favorece direção ou aproximação. A escolha mantém a imagem de movimento sem decidir se o juízo é também a finalidade da entrada.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com “vocês” para boa legibilidade brasileira e internacional. A ordem marcada da primeira oração foi parcialmente conservada para manter o movimento acumulativo das imagens. Evitaram-se tanto arcaísmos como harmonizações doutrinárias.
