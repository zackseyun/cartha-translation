base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/002.yaml
  text: For I know the mystery[a], and I have read the tablets of heaven, and I have seen the holy writings[c][b], and I found written in them and understood concerning them.
translation:
  language: pt
  text: Pois conheço o mistério[a], li as tábuas do céu[b] e vi a escritura sagrada[c]. Nelas encontrei o que estava escrito e compreendi o que lhes dizia respeito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o segredo”.
    reason: lexical_alternative
  - marker: b
    text: As “tábuas do céu” representam registros ou decretos celestes no imaginário apocalíptico; a expressão não exige que sejam entendidas como objetos materiais.
    reason: cultural_note
  - marker: c
    text: Também se pode traduzir por “o escrito sagrado”. O original traz uma expressão no singular, não “a escritura dos santos”.
    reason: lexical_and_grammatical_note
lexical_decisions:
- source_word: ምሥጢረ
  choice: o mistério
  rationale: Conserva o sentido de conhecimento oculto agora conhecido pelo visionário e o registro apocalíptico; “segredo” também seria possível.
- source_word: ፀፍፀፈ ሰማይ
  choice: as tábuas do céu
  rationale: Mantém a imagem concreta dos registros celestes, frequente na literatura enoquiana, sem reduzi-la ao termo genérico “livros”.
- source_word: ጽሕፈተ ቅድስተ
  choice: a escritura sagrada
  rationale: Os termos formam um sintagma nominal no feminino singular, com substantivo e adjetivo concordantes. A tradução segue essa gramática, corroborada pelo fragmento grego, em vez de entender a expressão como “a escritura dos santos” ou pluralizá-la.
- source_word: ውስቴቶሙ
  choice: nelas
  rationale: O pronome plural retoma naturalmente “as tábuas do céu”; a colocação no início da frase em português esclarece essa referência sem mudar seu conteúdo.
- source_word: አኩዐ
  choice: compreendi
  rationale: Expressa a apreensão do conteúdo revelado após sua leitura e observação, sem acrescentar uma interpretação específica.
- source_word: በእንቲአሆሙ
  choice: o que lhes dizia respeito
  rationale: Reproduz o sentido relacional de “a respeito delas” em português natural, preservando a referência pronominal do texto.
theological_decisions:
- issue: Interpretação de ጽሕፈተ ቅድስተ
  choice: a escritura sagrada
  alternative: a escritura dos santos
  rationale: A concordância feminina singular indica substantivo seguido de adjetivo, não uma construção com “santos” ou “seres santos”. Assim, não se introduzem anjos, santos ou outra identidade teológica ausente da expressão.
- issue: Natureza das tábuas celestes
  choice: preservar a imagem como “tábuas do céu”
  alternative: registros ou decretos celestes
  rationale: A formulação concreta pertence ao imaginário apocalíptico. A tradução não decide se as tábuas devem ser entendidas de modo material, visionário ou simbólico.
translation_notes:
  register: Português atual, digno e de leitura ampla, com leve elevação apropriada à fala visionária. A coordenação foi dividida em duas frases para evitar uma sequência pesada, mantendo a progressão conhecer–ler–ver–encontrar–compreender. “Escritura” permanece em minúscula para não impor uma identificação automática com um cânon bíblico posterior.
