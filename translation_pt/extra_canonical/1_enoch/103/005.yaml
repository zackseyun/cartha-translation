  source_fidelity: 'A tradução preserva os elementos essenciais: a invectiva dirigida aos «pecadores mortos», a repetição deliberadamente tensa com «quando morrerem», a provável leitura «na riqueza dos seus pecados», a fala de pessoas semelhantes aos destinatários e o idiomatismo final sobre terem «visto todos os seus dias». A correção provável de uma leitura defeituosa do testemunho transcrito é adequadamente assinalada em nota.'
  naturalness: 'Há uma inadequação sintática em «e os que são como vocês disserem a seu respeito»: sem uma estrutura condicional ou temporal que reja o subjuntivo futuro, «disserem» soa incorreto. O presente do indicativo («dizem») reproduz naturalmente a coordenação do original. «Pecadores mortos, quando morrerem» é propositalmente incomum, mas deve ser mantido por fidelidade à repetição do texto.'
  terminology: «Bem-aventurados» representa mais precisamente o termo de bem-aventurança do original e preserva o registro solene e irônico da declaração, sem impor uma interpretação doutrinária. «Na riqueza dos seus pecados» mantém a leitura contextual e textualmente provável.
