base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/005.yaml
  text: Woe to you[a], dead sinners, when you die in the wealth of your sins, and those like you say about you, ‘Blessed are these sinners[d][c][b]; they have seen all their days.’
translation:
  language: pt
  text: 'Ai de vocês, pecadores mortos, quando morrerem na riqueza dos seus pecados[a], e os que são como vocês dizem a seu respeito: “Bem-aventurados são estes pecadores; eles viram todos os seus dias.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho transcrito traz uma forma difícil, provavelmente resultante de erro de leitura. A leitura corrigida significa “na riqueza dos seus pecados”; outra possibilidade é “em seus pecados”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “eles viveram até ver todos os seus dias”, isto é, foram considerados afortunados por parecerem ter desfrutado uma vida completa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo em português natural e solene.
- source_word: ምውታን፡ ኃጥኣን
  choice: pecadores mortos
  rationale: Mantém o adjetivo explícito ምውታን e sua repetição retórica com a oração seguinte, apesar da estranheza deliberada.
- source_word: ሶበ፡ ትመውቱ
  choice: quando morrerem
  rationale: Expressa diretamente a oração temporal sem eliminar a tensão com “pecadores mortos”.
- source_word: በብዕሲ፡ ኃጢአትክሙ
  choice: na riqueza dos seus pecados
  rationale: Segue a correção textual provável በብዕለ, “na riqueza de”, coerente com a crítica à prosperidade dos pecadores no contexto imediato; a dificuldade do testemunho é indicada em nota.
- source_word: ወይብሉ፡ ዲቤክሙ
  choice: e ... disserem a seu respeito
  rationale: Reproduz o sentido de fala acerca dos destinatários com formulação portuguesa clara.
- source_word: እለ፡ ከማክሙ
  choice: os que são como vocês
  rationale: Conserva a comparação moral e social sem a reduzir a uma categoria interpretativa.
- source_word: ብፁዓን፡ እሙንቱ፡ ኃጥኣን
  choice: Felizes são estes pecadores
  rationale: “Felizes” comunica em português corrente a declaração de bem-aventurança posta ironicamente na boca dos semelhantes dos pecadores.
- source_word: ኵሎ፡ መዋዕሎሙ፡ ርእዩ
  choice: eles viram todos os seus dias
  rationale: Preserva o idioma concreto e sua ambiguidade, em vez de explicitar no texto que tiveram vida longa ou completaram seus dias.
theological_decisions:
- issue: O veredito dos semelhantes sobre os pecadores mortos
  choice: 'Manter a bem-aventurança irônica: “Felizes são estes pecadores”'
  alternative: Explicitar que foram considerados afortunados por terem desfrutado vida longa e próspera
  rationale: O contraste entre o “ai” divino e a avaliação humana deve permanecer perceptível sem ser explicado ou resolvido dentro do texto.
- issue: A riqueza associada aos pecados
  choice: “na riqueza dos seus pecados”
  alternative: “em seus pecados”
  rationale: A leitura provável enfatiza riqueza/prosperidade e sustenta a crítica econômica do contexto, sem identificar automaticamente riqueza e pecado além do que a construção permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conservam-se a repetição incomum “pecadores mortos, quando morrerem”, a ironia do elogio e o idioma ambíguo “viram todos os seus dias”.
