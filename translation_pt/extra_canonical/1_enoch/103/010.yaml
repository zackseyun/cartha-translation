base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/010.yaml
  text: And we were destroyed, and there was no one to help us with a word; and we found nothing. We were tormented and destroyed, and we had no hope of seeing life from day to day.
translation:
  language: pt
  text: E fomos arruinados,[a] e não havia ninguém que nos ajudasse sequer com uma palavra;[b] e nada encontramos.[c] Fomos atormentados e arruinados, e não tínhamos esperança de ver a vida de um dia para o outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruídos” ou “levados à ruína”. O mesmo verbo aparece novamente neste versículo.
    reason: lexical_alternative
  - marker: b
    text: “Com uma palavra” provavelmente indica que ninguém nos prestou auxílio nem mesmo por meio de fala, apelo ou defesa.
    reason: cultural_note
  - marker: c
    text: Esta cláusula é textual e sintaticamente difícil; também pode significar “nada obtivemos” ou “de modo algum encontramos alívio”.
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕልነ
  choice: fomos arruinados
  rationale: O verbo, repetido no versículo, expressa ruína ou destruição. “Arruinados” preserva a intensidade e a repetição sem sugerir necessariamente morte física consumada.
- source_word: አልቦ ዘይረድአነ
  choice: não havia ninguém que nos ajudasse
  rationale: A construção indica a ausência de uma pessoa que prestasse auxílio; a formulação é direta e natural em português.
- source_word: በነገር
  choice: sequer com uma palavra
  rationale: Mantém a referência explícita à palavra ou fala e torna claro, sem eliminar a imagem, que nem mesmo auxílio verbal lhes foi oferecido.
- source_word: ወኢበምንትኒ ኢረከብነ
  choice: e nada encontramos
  rationale: A cláusula é difícil, mas comunica que nada foi encontrado ou obtido. A tradução concisa evita inserir um objeto como “alívio”, que não está expresso.
- source_word: ተጸዐርነ
  choice: fomos atormentados
  rationale: Preserva o tom intensificado do lamento, embora o verbo também possa abranger aflição ou opressão.
- source_word: ኢተስፈውነ
  choice: já não tínhamos esperança
  rationale: Expressa naturalmente a ausência de esperança no contexto de sofrimento contínuo; “já” reforça o estado resultante sem alterar o conteúdo central.
- source_word: ከመ ንርአይ ሕይወተ ዕለት እምዕለት
  choice: de ver a vida de um dia para o outro
  rationale: Conserva a imagem de “ver a vida” e comunica a incerteza quanto a continuar vivo até o dia seguinte.
theological_decisions:
- issue: Manter ou suavizar a repetição da linguagem de ruína e a desesperança do lamento
  choice: Manter “arruinados” nas duas ocorrências e declarar explicitamente a falta de esperança
  alternative: Condensar a repetição em uma descrição geral de sofrimento ou miséria
  rationale: A repetição intensifica a retórica do lamento apocalíptico. Preservá-la evita reduzir a força do texto ou impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a repetição, a imagem de ajuda “com uma palavra” e a dificuldade da cláusula intermediária, explicada em nota.
