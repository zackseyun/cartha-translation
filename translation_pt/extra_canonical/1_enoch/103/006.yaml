base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/006.yaml
  text: And now they have died in prosperity and in wealth and they did not see distress and slaughter in their lifetime[a]; and they died in honor[c][b], and judgment was not executed against them in their lifetime.
translation:
  language: pt
  text: E agora eles morreram em prosperidade[a] e riqueza, sem terem visto aflição nem massacre[b] durante a vida; morreram honrados, e nenhum julgamento foi levado a efeito contra eles durante a vida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas boas” em vez de “prosperidade”; o termo ge'ez pode indicar, de modo mais amplo, aquilo que é bom ou favorável.
    reason: lexical_alternative
  - marker: b
    text: 'Uma leitura anterior entendia a frase como “e em aflição, e viram massacre”. A leitura adotada reconhece no texto transmitido um provável erro de transcrição e entende: “não viram aflição nem massacre”.'
    reason: textual_alternative
  - marker: c
    text: A frase diz que nenhum julgamento foi levado a efeito contra eles durante a vida terrena; não nega um julgamento posterior.
    reason: theological_clarification
lexical_decisions:
- source_word: ሠናይ
  choice: prosperidade
  rationale: No paralelismo com riqueza e honra, indica circunstâncias favoráveis ou bem-estar, e não apenas bondade moral.
- source_word: ብዕል
  choice: riqueza
  rationale: Expressa abundância material de modo claro e natural no contexto.
- source_word: ምንዳቤ
  choice: aflição
  rationale: Comunica sofrimento ou adversidade grave em registro bíblico atual, sem restringir indevidamente o sentido.
- source_word: ቀትለ
  choice: massacre
  rationale: Preserva a força violenta do substantivo, mais intensa que uma referência genérica à morte.
- source_word: ስብሐት
  choice: honrados
  rationale: Neste contexto, aponta para estima ou condição honrosa na morte, mais naturalmente que glória divina ou esplendor.
- source_word: ኵነኔ
  choice: julgamento
  rationale: Mantém o sentido forense amplo da prestação de contas judicial.
- source_word: ኢትገብረ ሎሙ
  choice: nenhum julgamento foi executado contra eles
  rationale: Explicita que a sentença judicial não foi levada a efeito contra eles durante a vida.
theological_decisions:
- issue: Se o versículo afirma que os ímpios escaparam de todo julgamento ou somente do julgamento durante a vida terrena
  choice: A afirmação limita a ausência de julgamento ao período da vida deles.
  alternative: Nenhum julgamento jamais lhes sobreveio.
  rationale: A repetição explícita de “durante a vida” restringe a observação à experiência terrena, sem negar nem afirmar diretamente o juízo posterior.
- issue: Leitura da sequência sobre aflição e massacre
  choice: Eles não viram aflição nem massacre.
  alternative: Eles morreram em aflição e viram massacre.
  rationale: A revisão textual identifica አርአዩ como erro de transcrição por ኢርእዩ (“não viram”); além disso, os substantivos seguintes funcionam como objetos diretos, e o contexto descreve sua aparente impunidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “Sem terem visto” torna natural a relação sintática do negativo com os dois objetos; “morreram honrados” evita a expressão menos idiomática “morreram em honra”. Todos os marcadores de nota aparecem no texto.
