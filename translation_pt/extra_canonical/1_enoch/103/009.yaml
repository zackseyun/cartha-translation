base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/009.yaml
  text: Do not say[a], you righteous and good who are in life, “In the days of our affliction we toiled hard, and we saw every trouble, and we encountered many evils, and we were oppressed and made few[d][c][b], and our spirit became small.”
translation:
  language: pt
  text: 'Não digam[a], justos e bons que estão vivos: “Nos dias da nossa aflição, labutamos duramente; vimos toda espécie de sofrimento, encontramos muitos males, fomos oprimidos[b] e reduzidos a poucos[c], e nosso espírito se tornou pequeno[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção também pode ser entendida como: “Não digam a respeito dos justos e bons que estão vivos” ou “Não digam aos justos e bons que estão vivos”.'
    reason: ambiguity
  - marker: b
    text: O verbo pode envolver a ideia de sofrer violência ou injustiça. Uma tradução anterior trazia “fomos levados à ruína”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “fomos feitos poucos”; também pode significar “fomos diminuídos” ou “reduzidos”.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “nosso espírito se tornou pequeno”, imagem que pode sugerir desânimo, fraqueza ou perda de coragem sem se limitar a uma dessas ideias.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትበልዎሙ፡ ለጻድቃን፡ ወኄራን
  choice: Não digam, vocês, justos e bons
  rationale: Mantém a proibição no plural e a leitura da frase como apelo direto aos justos e bons, sem ocultar em nota a possibilidade de que o sufixo e a preposição indiquem fala a respeito deles ou dirigida a eles.
- source_word: እለ፡ ሀለዉ፡ ውስተ፡ ሕይወት
  choice: que estão em vida
  rationale: Conserva a expressão preposicional do ge’ez e seu tom elevado, sem defini-la como referência à vida futura ou à vida espiritual.
- source_word: በመዋዕለ፡ ሥራሕነ፡ ዳማ፡ ጻመውነ
  choice: Nos dias da nossa aflição, labutamos duramente
  rationale: Expressa a combinação textualmente difícil de aflição e esforço intenso; “labutamos duramente” comunica trabalho penoso em português corrente.
- source_word: ወኵሎ፡ ሥራኀ፡ ርኢነ
  choice: vimos toda espécie de sofrimento
  rationale: Preserva literalmente o verbo “ver” no sentido semítico de experimentar, enquanto “toda espécie de sofrimento” oferece uma leitura natural do substantivo contextual de trabalho penoso ou tribulação.
- source_word: ወእኩያተ፡ ብዙኃተ፡ ረከብነ
  choice: encontramos muitos males
  rationale: Mantém tanto o verbo de encontrar/deparar-se quanto o substantivo amplo “males”, sem reduzi-lo apenas a infortúnios.
- source_word: ወተወጻዕነ
  choice: fomos oprimidos
  rationale: Reflete o valor passivo de sofrer opressão, violência ou injustiça, evitando a intensificação indevida de “fomos arruinados”.
- source_word: ወውኅድነ
  choice: reduzidos a poucos
  rationale: Conserva a imagem concreta de redução numérica, embora a forma também possa indicar diminuição de condição ou força.
- source_word: ወንእስት፡ መንፈስነ
  choice: nosso espírito se tornou pequeno
  rationale: Retém a metáfora vívida do original em vez de substituí-la no texto por uma interpretação psicológica única, como desânimo ou fraqueza.
theological_decisions:
- issue: O sentido de “os que estão em vida”
  choice: A expressão é mantida como “que estão em vida”, referindo-se localmente aos justos e bons em sua condição presente.
  alternative: Os que estão na vida futura ou os que possuem “vida verdadeira” em sentido espiritual.
  rationale: A queixa sobre aflição, trabalho penoso e opressão se ajusta à experiência presente dos justos; a tradução não acrescenta uma definição doutrinária ausente da frase.
- issue: Quem profere ou recebe a queixa introduzida por “não digam”
  choice: O texto principal apresenta os justos e bons como destinatários de uma exortação direta.
  alternative: “Não digam a respeito dos justos e bons” ou “não digam aos justos e bons”.
  rationale: A construção admite mais de uma análise por causa do sufixo verbal e da preposição. A leitura direta produz uma exortação coerente, mas a alternativa é registrada para preservar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o paralelismo acumulativo da lamentação e algumas imagens semíticas marcantes, explicando em notas apenas as ambiguidades que afetariam a leitura.
