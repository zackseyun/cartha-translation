base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/003.yaml
  text: For every good thing and joy and glory have been prepared and written down for the spirits of those who died in righteousness[a]; and much good will be given to you as the fruit of your labor[c][b], and your portion will abound beyond the portion of the living.
translation:
  language: pt
  text: Pois todo bem, alegria e glória foram preparados e registrados[a] para os espíritos dos que morreram em justiça; e muito bem lhes será dado como fruto do seu trabalho[b], e a porção de vocês será muito maior que a porção dos vivos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escritos”. A expressão pode evocar um registro celestial daquilo que está reservado aos justos que morreram.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fruto do seu trabalho”. A imagem apresenta o labor como algo que produz uma colheita futura.
    reason: lexical_alternative
  - marker: c
    text: Ou “a parte de vocês excederá a parte dos vivos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Mantém a função explicativa ou fundamentadora do conectivo sem tornar a relação mais causal do que o texto exige.
- source_word: ኵሉ ሠናይ
  choice: todo bem
  rationale: Expressão abrangente e natural que evita a interpretação mais específica de “toda bênção”.
- source_word: ፍሥሓ
  choice: alegria
  rationale: Equivalente corrente e digno, adequado à série formada com “bem” e “glória”.
- source_word: ክብር
  choice: glória
  rationale: Preserva o peso e a possível dimensão radiante do termo no contexto de recompensa apocalíptica.
- source_word: ተደለወ ወተጽሕፈ
  choice: foram preparados e registrados
  rationale: Os passivos indicam aquilo que foi previamente disposto e escrito; “registrados” comunica com naturalidade a imagem de uma inscrição sem explicitar livros celestiais.
- source_word: ለመንፈሳቲሆሙ
  choice: para os espíritos
  rationale: Traduz diretamente o termo antropológico e evita substituí-lo por “almas”, que poderia introduzir uma nuance posterior.
- source_word: ለእለ ሞቱ በጽድቅ
  choice: dos que morreram em justiça
  rationale: Conserva a formulação substantiva e a ambiguidade entre o modo de vida justo e a esfera ou condição de justiça.
- source_word: ይትወሀብ ለክሙ
  choice: lhes será dado
  rationale: Preserva o futuro passivo da promessa e retoma naturalmente os destinatários em português.
- source_word: ተክለ ጻማክሙ
  choice: como fruto do seu trabalho
  rationale: Mantém a metáfora agrícola do produto gerado pelo labor, sem reduzi-la ao conceito abstrato de recompensa.
- source_word: ክፍልክሙ
  choice: a porção de vocês
  rationale: “Porção” preserva o sentido de parte atribuída e o tom bíblico sem ser obscuro.
- source_word: ፈድፋደ እምክፍለ ሕያዋን
  choice: será muito maior que a porção dos vivos
  rationale: Expressa de modo claro a intensidade e a comparação do texto, sem acrescentar quem são especificamente “os vivos”.
theological_decisions:
- issue: Termo antropológico aplicado aos mortos
  choice: espíritos
  alternative: almas
  rationale: O geʽez sustenta mais diretamente “espíritos”; “almas” poderia importar uma formulação antropológica que o verso não exige.
- issue: Natureza do que foi escrito
  choice: registrados
  alternative: inscritos nos livros celestiais
  rationale: A redação pode evocar um registro celestial, mas não identifica explicitamente livros nem o local do registro.
- issue: Sentido de morrer “em justiça”
  choice: em justiça
  alternative: justamente / como justos
  rationale: A tradução formal conserva a tensão da expressão substantiva, sem decidir se ela descreve principalmente a conduta, o estado moral ou a condição dos mortos.
- issue: Identidade dos “vivos”
  choice: os vivos
  alternative: os que agora vivem
  rationale: O texto não define expressamente se a referência é apenas aos contemporâneos ainda vivos; mantém-se a designação aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural dos destinatários e conserva termos bíblicos transparentes como “glória”, “espíritos”, “justiça” e “porção”.
