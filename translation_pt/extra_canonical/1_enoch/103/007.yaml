  source_fidelity: 'A oração inicial, a preservação de «Sheol» e «almas» (com alternativa em nota) refletem bem o ge’ez. A parte final, porém, distingue dois elementos: እኩያተ descreve o estado das almas («serão miseráveis/desventuradas»), e ምንዳቤሆሙ é a «tribulação» delas, qualificada como grande. «Ficarão em aflição» é possível como paráfrase, mas deixa menos visível essa distinção e se sobrepõe semanticamente a «tribulação».'
  naturalness: O texto é claro e de registro apropriado. «Serão miseráveis» é uma formulação moderna e direta que preserva melhor a predicação do original do que «ficarão em aflição». «Farão descer» é aceitável em português bíblico contemporâneo e mantém o agente plural não identificado.
  terminology: «Sheol» deve ser mantido. «Almas» é uma escolha legítima para መናፍስት, com «espíritos» em nota. «Tribulação» traduz adequadamente ምንዳቤ; não deve ser substituído por «recompensa».
