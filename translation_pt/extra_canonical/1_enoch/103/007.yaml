base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/007.yaml
  text: Know that they will bring your souls down to Sheol[e][d][c][b][a], and their recompense will be evil and great.
translation:
  language: pt
  text: Saibam que farão descer suas almas ao Sheol[a][b], e elas serão miseráveis, e grande será a sua tribulação.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus espíritos”. O termo ge’ez pode significar “almas” ou “espíritos”.
    reason: lexical_alternative
  - marker: b
    text: Sheol é o domínio dos mortos na tradição judaica; o termo foi mantido para não reduzir o sentido a “sepultura”.
    reason: cultural_note
  - marker: c
    text: 'Ou: “e elas estarão em desgraça, e grande será a sua aflição”. A sintaxe e o vocabulário descrevem o estado das almas e a grande tribulação delas.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ታእምርዎሙ፡ እስመ
  choice: Saibam que
  rationale: O sufixo de objeto antecipa a oração seguinte; em português, “Saibam que” comunica naturalmente a construção sem o literalismo obscuro “conheçam-nos, pois”.
- source_word: ለሲኦል
  choice: ao Sheol
  rationale: Mantém o termo judaico para o domínio dos mortos e preserva o contexto apocalíptico, sem reduzi-lo a “sepultura”.
- source_word: ያወርዶዎሙ
  choice: farão descer
  rationale: Preserva tanto o movimento descendente quanto o sujeito plural indicado pela forma verbal, sem acrescentar a violência de “lançar”.
- source_word: ለመናፍስቲክሙ
  choice: suas almas
  rationale: No contexto do destino após a morte, “almas” é natural; o termo também admite “espíritos”, registrado em nota.
- source_word: እኩያተ ይከውና
  choice: elas ficarão em aflição
  rationale: A forma verbal feminina plural concorda naturalmente com “almas”; a expressão descreve seu estado adverso, evitando transformar a oração em uma afirmação sobre “recompensa”.
- source_word: ምንዳቤሆሙ ዐቢየ
  choice: grande será a sua tribulação
  rationale: ምንዳቤ denota tribulação, aflição ou angústia; ዐቢየ acrescenta a ideia de grandeza ou intensidade.
theological_decisions:
- issue: Como verter ሲኦል
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: A transliteração conserva a textura teológica judaica do texto e evita identificar o conceito simplesmente com uma sepultura física.
- issue: Como verter መናፍስት
  choice: almas
  alternative: espíritos
  rationale: “Almas” se ajusta bem à descida ao Sheol, mas a alternativa permanece legítima e é indicada em nota.
- issue: Sentido de ምንዳቤ
  choice: tribulação
  alternative: aflição; angústia
  rationale: A evidência lexical favorece sofrimento ou aflição, não “recompensa”; a formulação preserva o juízo pós-morte sem introduzir uma categoria retributiva ausente desse substantivo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A inversão final “grande será” conserva a ênfase conclusiva sem soar excessivamente arcaica.
