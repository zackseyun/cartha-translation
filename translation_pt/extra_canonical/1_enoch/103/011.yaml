base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/011.yaml
  text: We hoped to become the head[a], and we became the tail; we toiled, but we did not gain mastery over our labor; and we became food for sinners and for the lawless[c][b], and they laid their yoke heavily upon us.
translation:
  language: pt
  text: Esperávamos tornar-nos a cabeça, e nos tornamos a cauda; trabalhamos arduamente, e não tivemos domínio sobre o nosso trabalho[a]; tornamo-nos alimento para os pecadores e os transgressores[b], e eles fizeram pesar sobre nós o seu jugo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão etíope é difícil. Também pode significar “não tivemos domínio sobre o fruto do nosso trabalho” ou “sobre a nossa remuneração”.
    reason: lexical_alternative
  - marker: b
    text: '“Alimento” é uma metáfora concreta: eles se tornaram presa dos pecadores e dos transgressores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ንሴፎ
  choice: Esperávamos
  rationale: Expressa a expectativa coletiva no contexto de lamento, com naturalidade em português.
- source_word: ንኩን ርእሰ ... ወኮነ ዘነበ
  choice: tornar-nos a cabeça ... nos tornamos a cauda
  rationale: Preserva a antítese concreta e proverbial do texto, sem reduzi-la a categorias sociais abstratas.
- source_word: ጻመውነ እንዘ ንትጌበር
  choice: trabalhamos arduamente
  rationale: Condensa em português natural a expressão intensiva e parcialmente redundante de labuta, sem introduzir a negação ou a voz passiva ausentes no ge'ez.
- source_word: ወኢሠለጥነ ዲበ ዳማነ
  choice: mas não tivemos domínio sobre o nosso trabalho
  rationale: Mantém o sentido de não exercer poder ou controle; a referência de ዳማነ é difícil e pode envolver o trabalho, seu produto ou sua remuneração.
- source_word: መብልዕተ
  choice: alimento
  rationale: Conserva a metáfora concreta do original; 'presa' explicitaria o sentido figurado.
- source_word: ለኃጥኣን ወለዓማፅያን
  choice: para os pecadores e os transgressores
  rationale: Distingue os dois grupos moralmente caracterizados e comunica com clareza a força ética do segundo termo.
- source_word: አክበዱ ላዕሌነ አርዑተ ዚአሆሙ
  choice: fizeram pesar sobre nós o seu jugo
  rationale: Preserva a imagem de dominação opressiva e reproduz a ideia verbal de tornar pesado.
theological_decisions:
- issue: Preservar ou interpretar socialmente a inversão entre cabeça e cauda
  choice: 'Preservar a imagem concreta: ''a cabeça ... a cauda'''
  alternative: chefes ... últimos; líderes ... subordinados
  rationale: A formulação figurada sustenta a força poética do lamento e evita impor uma interpretação sociológica específica.
- issue: Forma de traduzir a imagem final da opressão
  choice: fizeram pesar sobre nós o seu jugo
  alternative: oprimiram-nos duramente; sobrecarregaram-nos
  rationale: O jugo é uma imagem retoricamente significativa de sujeição; mantê-la evita transformar a linguagem figurada em abstração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantidas as imagens concretas de cabeça/cauda, alimento e jugo; a dificuldade lexical da cláusula sobre o trabalho foi preservada em nota.
