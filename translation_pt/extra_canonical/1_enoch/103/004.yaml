base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/004.yaml
  text: And your spirits will live[a], you who died in righteousness, and they will rejoice and be glad, and their spirits will not perish, and their remembrance will be before the face of the Great One for all the generations of eternity. And now[e][d][c][b], do not fear their humiliation.
translation:
  language: pt
  text: E os espíritos de vocês viverão[a] — vocês que morreram em justiça —, e eles se alegrarão e ficarão contentes. Seus espíritos não perecerão, e a lembrança deles estará diante da face do Grande[b] por todas as gerações da eternidade[c]. E agora, não temam a humilhação deles[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção ge''ez também pode ser entendida: “E o espírito de vocês viverá — daqueles cuja morte foi em justiça”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante da face do Grande”, fórmula que indica presença em linguagem de corte celestial.
    reason: cultural_note
  - marker: c
    text: Ou “por todas as gerações da era”; o termo também pode significar “mundo” em outros contextos.
    reason: lexical_alternative
  - marker: d
    text: Ou “a reprovação deles” ou “a desonra deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: የሐይዉ መንፈስክሙ
  choice: os espíritos de vocês viverão
  rationale: Preserva o sentido futuro e consolador e traduz መንፈስ por “espírito”, sem introduzir uma concepção posterior mais específica de “alma”. O plural harmoniza a referência coletiva aos destinatários, embora a construção admita outra análise, registrada em nota.
- source_word: ለእለ ሞትክሙ በጽድቅ
  choice: vocês que morreram em justiça
  rationale: Identifica os destinatários como aqueles cuja morte ocorreu em estado ou caminho de justiça. A forma nominal “em justiça” mantém a força teológica de ጽድቅ.
- source_word: ይትፌሥሑ ወይትሐሠዩ
  choice: se alegrarão e ficarão contentes
  rationale: Mantém os dois verbos de alegria sem reduzir a duplicação expressiva, em linguagem atual e clara.
- source_word: ወኢይትሐጐሉ መንፈሳቲሆሙ
  choice: Seus espíritos não perecerão
  rationale: “Perecer” conserva de maneira concisa a força escatológica da negação futura.
- source_word: ወእቲዝካሮሙ
  choice: a lembrança deles
  rationale: Expressa a recordação ou memorial permanente dos justos, sem restringir o termo a uma memória meramente psicológica.
- source_word: እምቅድመ ገጸ ለዐቢይ
  choice: diante da face do Grande
  rationale: Conserva a imagem da presença ou corte celestial e mantém “o Grande” como título divino, em vez de substituí-lo por “Deus”.
- source_word: ለኵሉ ትውልደ ዓለም
  choice: por todas as gerações da eternidade
  rationale: 'O contexto formular e a evidência grega subjacente favorecem o sentido temporal de ዓለም: a lembrança perdura por todas as gerações da era ou eternidade.'
- source_word: ኢትፍርህዎ ለኀሣሮሙ
  choice: não temam a humilhação deles
  rationale: “Humilhação” se ajusta ao sofrimento e à vergonha presentes dos justos; as possibilidades “reprovação” e “desonra” permanecem em nota.
theological_decisions:
- issue: Termo antropológico para a existência após a morte
  choice: espíritos
  alternative: almas; sopros de vida
  rationale: “Espíritos” corresponde diretamente a መንፈስ e preserva a linguagem antropológica do texto sem impor precisão doutrinária posterior.
- issue: Título divino ለዐቢይ
  choice: o Grande
  alternative: o Grande Deus; Deus
  rationale: O original emprega um epíteto, não o substantivo explícito “Deus”. A manutenção do título preserva o registro apocalíptico enoquiano.
- issue: Valor temporal de ዓለም
  choice: eternidade
  alternative: mundo; era
  rationale: Neste enunciado sobre lembrança permanente, e à luz da expressão grega correspondente, o sentido temporal é o mais provável, sem eliminar as alternativas lexicais.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A sintaxe conserva a mudança do tratamento direto (“vocês”) para a referência na terceira pessoa (“eles/deles”), presente no texto, e mantém a duplicação dos verbos de alegria e a imagem solene “diante da face”.
