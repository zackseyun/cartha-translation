base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/001.yaml
  text: And now I know this mystery for you[a], O righteous ones, by the glory of the Great and Honored and Mighty One in dominion[c][b], and by his greatness I know it for you.
translation:
  language: pt
  text: E agora conheço este mistério[a] a respeito de vocês, ó justos, pela glória do Grande, Honrado e Poderoso em domínio[b], e, pela sua grandeza, o conheço a respeito de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação ge'ez é condensada e um tanto difícil. O verbo repetido pode significar simplesmente «conheço» ou, mais especificamente, «conheço este mistério revelado». A expressão traduzida por «a respeito de vocês» também pode ter o sentido de «para vocês».
    reason: lexical_alternative
  - marker: b
    text: '«Domínio» também pode ser entendido como «reino» ou «reinado». Outra análise possível da frase é: «pela glória do Grande, e do reino honrado e poderoso, e em grandeza».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto a introdução temporal enfática.
- source_word: እምሕል
  choice: conheço ... este mistério
  rationale: No contexto apocalíptico, o verbo pode indicar conhecimento de um segredo revelado; a nota mantém a possibilidade do sentido simples de conhecer.
- source_word: ለክሙ
  choice: para vocês
  rationale: Expressa a direção ou o benefício indicado pela preposição com sufixo e mantém a repetição do original.
- source_word: ጻድቃን
  choice: justos
  rationale: Termo coletivo natural em português para o grupo dos que vivem em justiça.
- source_word: በስብሐቱ
  choice: pela glória
  rationale: Mantém a força instrumental da preposição dentro da fórmula solene.
- source_word: ለዐቢይ፡ ወለክቡር፡ ወዕዙዘ
  choice: do Grande, Honrado e Poderoso
  rationale: Trata os três adjetivos coordenados como títulos ou atributos do mesmo referente divino, sem substituí-los por um nome explícito.
- source_word: መንግሥት
  choice: domínio
  rationale: Neste encadeamento, qualifica o poder régio do referente; 'domínio' produz em português a leitura atributiva mais clara, sem sugerir um reino separado.
- source_word: ወበዕበዩ
  choice: e pela sua grandeza
  rationale: Dá continuidade à fórmula instrumental e identifica naturalmente a grandeza como pertencente ao mesmo referente.
theological_decisions:
- issue: Conhecimento simples ou conhecimento de um mistério revelado
  choice: O texto principal explicita «este mistério».
  alternative: «Sei isto para vocês» ou «conheço para vocês».
  rationale: O contexto enóquico favorece o conhecimento revelado, mas a nota reconhece que a formulação ge'ez é condensada e lexicalmente difícil.
- issue: Referente dos títulos majestáticos
  choice: Mantêm-se os títulos «Grande, Honrado e Poderoso» sem acrescentar «Deus».
  alternative: Explicitar «Deus» ou ler os adjetivos como qualificadores de um reino independente.
  rationale: O referente é provavelmente divino, porém a tradução conserva a forma titulária do texto e evita resolver além da evidência.
- issue: Relação de መንግሥት com a sequência de atributos
  choice: «Poderoso em domínio».
  alternative: «o reino honrado e poderoso».
  rationale: A leitura adotada coordena os três descritores do mesmo referente e entende o substantivo como esfera de poder régio, evitando convertê-lo em uma entidade separada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para a segunda pessoa plural. A repetição de «para vocês» e do verbo «conheço» foi preservada por refletir a solenidade e a estrutura do ge'ez. Os títulos majestáticos permanecem substantivados, sem explicitação denominacional do referente.
