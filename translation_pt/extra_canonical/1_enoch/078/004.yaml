base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/004.yaml
  text: In the disk of the sun there are seven portions of light which are added to it beyond the moon[e][d][c][b][a], and in measure they are added until the seventh portion of the sun is completed.
translation:
  language: pt
  text: No disco do sol há sete porções de luz, que lhe são acrescentadas além da lua[a]; e, segundo uma medida, elas são acrescentadas até que se complete a sétima porção do sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sintaxe etíope desta expressão é difícil. “Além da lua” provavelmente indica que a luz do sol excede a da lua; também se pode traduzir “a partir da lua” ou “mais do que a lua”.
    reason: textual_variant
  - marker: b
    text: O verbo também pode ser entendido como “até que a sétima porção do sol seja ultrapassada” ou “tenha passado”.
    reason: textual_variant
lexical_decisions:
- source_word: በክበበ፡ ፀሐይ
  choice: No disco do sol
  rationale: Embora ክበብ possa designar círculo, circunferência ou percurso circular, aqui as porções de luz pertencem ao corpo circular do luminar; “disco” expressa esse sentido sem introduzir a noção moderna de órbita.
- source_word: ሰብዓቱ፡ ክፍለ፡ ብርሃን
  choice: sete porções de luz
  rationale: Mantém o caráter quantitativo e esquemático de ክፍል (“parte”, “porção”, “divisão”) e traduz diretamente ብርሃን (“luz”).
- source_word: ዘይትዌሰክ፡ ቦቱ
  choice: que lhe são acrescentadas
  rationale: Preserva o sentido passivo de acréscimo; o pronome retoma naturalmente o sol.
- source_word: እምወርኅ
  choice: além da lua
  rationale: እም pode indicar origem ou comparação. “Além da lua” conserva a provável ideia de que a luz solar excede a lunar, sem apagar a ambiguidade, registrada em nota.
- source_word: መስፈርት
  choice: segundo uma medida
  rationale: Expressa uma progressão regulada e quantificada, coerente com a cosmologia ordenada desta seção.
- source_word: ትትወደይ
  choice: elas são acrescentadas
  rationale: A repetição do vocabulário de acréscimo preserva o estilo esquemático do texto e evita especificar indevidamente outro tipo de movimento.
- source_word: እስከ፡ የሐልፍ
  choice: até que se complete
  rationale: No contexto da progressão por sete porções, “complete” produz uma frase portuguesa inteligível; como o verbo também pode indicar passar ou ultrapassar, essa possibilidade é mantida em nota.
- source_word: ሳብዕ፡ ክፍለ፡ ፀሐይ
  choice: a sétima porção do sol
  rationale: ሳብዕ é ordinal, “sétima”, e remete às sete porções já mencionadas, não à fração indefinida “um sétimo”.
theological_decisions:
- issue: Natureza da afirmação cosmológica
  choice: Apresentar o versículo como descrição antiga e esquemática da luminosidade e das medidas dos luminares.
  alternative: Modernizar a linguagem em termos astronômicos atuais ou tratá-la como simbolismo puro.
  rationale: O Livro Astronômico descreve os fenômenos celestes em categorias antigas de ordem e medida. A tradução preserva esse universo conceitual sem convertê-lo em ciência moderna nem alegorizá-lo.
- issue: Relação quantitativa entre o sol e a lua
  choice: Conservar no texto a formulação comparativa pouco usual e explicar sua ambiguidade em nota.
  alternative: Explicitar que o sol possui exatamente sete porções de luz a mais que a lua.
  rationale: A sintaxe etíope é difícil e እም admite tanto valor de origem quanto de comparação; uma formulação matemática mais precisa excederia a evidência textual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. A redação conserva a repetição e o caráter mensurativo do original, enquanto as notas registram as principais ambiguidades sintáticas e lexicais.
