base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/011.yaml
  text: And throughout the time when the moon is waning[a], it diminishes its light before the sun until fourteen days [its light is completed]; and when it is extinguished[d][c][b], all its light is completed in the sky.
translation:
  language: pt
  text: E durante todo o período em que a lua míngua, ela transfere sua luz diante do sol[a] até catorze dias [sua luz se completa]; e, quando se apaga, toda a sua luz se completa no céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante do sol”. A expressão pode indicar a presença do sol ou uma relação com o percurso dele; a formulação preserva a imagem cosmológica do texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ፡ ዘመነ፡ ዘተነሡር፡ ወርኅ፡
  choice: durante todo o período em que a lua míngua
  rationale: Expressa a totalidade do período e usa a forma portuguesa corrente para a fase de diminuição aparente da lua.
- source_word: ብርሃነ፡ ዚአሃ፡
  choice: sua luz
  rationale: Indica a luz pertencente à lua sem acrescentar personificação.
- source_word: ትወዲ፡
  choice: transfere
  rationale: Segue o valor lexical de pôr, lançar ou transferir atribuído ao verbo ወድየ e preserva o modelo cosmológico concreto do texto, em vez de substituí-lo por uma descrição astronômica moderna.
- source_word: በቅድመ፡ ፀሐይ፡
  choice: diante do sol
  rationale: Mantém o sentido espacial e relacional literal, deixando aberta a nuance cosmológica exata.
- source_word: እስከ፡ ፲ወ፬መዋዕል፡
  choice: até catorze dias
  rationale: Conserva a construção temporal sem fazer de 'dias' o sujeito do verbo de completar.
- source_word: '[ይትፌጸም፡ ብርሃና፡]'
  choice: '[sua luz se completa]'
  rationale: Mantém os colchetes da fonte e restaura 'sua luz' como sujeito explícito da oração incerta.
- source_word: ወሶበ፡ ይውዒ፡
  choice: e, quando se apaga
  rationale: Preserva a imagem concreta de extinção da luz, sem normalizá-la como linguagem científica moderna.
- source_word: ኵሉ፡ ይትፌጸም፡ ብርሃኑ፡
  choice: toda a sua luz se completa
  rationale: Reproduz a linguagem esquemática de completude do texto, apesar de sua estranheza deliberada em português.
- source_word: ውስተ፡ ሰማይ።
  choice: no céu
  rationale: No contexto astronômico, designa naturalmente a esfera celeste visível.
theological_decisions:
- issue: Transferência ou diminuição da luz lunar
  choice: transfere sua luz
  alternative: diminui sua luz
  rationale: A leitura 'transfere' preserva o possível mecanismo cosmológico próprio do texto e segue a análise lexical específica de ትወዲ, sem harmonizá-lo com a astronomia moderna.
- issue: Estado final da lua no período de míngua
  choice: quando se apaga
  alternative: quando escurece / quando se põe
  rationale: Mantém a imagem cósmica vívida e não resolve a descrição em termos astronômicos comuns.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do ge'ez. A formulação conserva a estranheza da cosmologia antiga e a incerteza do trecho entre colchetes.
