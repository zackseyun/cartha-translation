  source_fidelity: A tradução preserva bem a contagem de quinze partes, a conclusão da luz e sua função como sinal do ano. Contudo, «a lua cresce» explicita um processo de aumento que o verbo ge'ez ይከውን expressa mais diretamente como ‘vem a ser’/‘se forma’. A construção fracionária final deve permanecer estranha e cautelosa, pois é sintaticamente difícil, mas não deve ser substituída por uma afirmação inequívoca sobre crescimento.
  naturalness: O português é claro, moderno e apropriado ao registro astronômico. «A lua se forma por metade de uma sétima parte» é menos idiomático que «cresce», mas representa mais fielmente a formulação técnica e difícil do original; a nota explica essa dificuldade.
  terminology: «Partes de luz», «sinal do ano» e «metade de uma sétima parte» são escolhas adequadas. «Lua» é preferível a «mês» na cláusula final, conforme o contexto das fases lunares.
