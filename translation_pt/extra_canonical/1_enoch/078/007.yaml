revisions:
- from: E quinze partes de luz lhe são acrescentadas até o décimo quinto dia, quando sua luz se completa como sinal do ano; ela chega a quinze partes,[a] e a lua cresce à razão de metade de uma sétima parte.[b]
  to: E quinze partes de luz lhe são acrescentadas até o décimo quinto dia, quando sua luz se completa como sinal do ano; ela chega a quinze partes,[a] e a lua se forma por metade de uma sétima parte.[b]
  rationale: A revisão substitui «cresce» por «se forma», preservando o sentido básico de ይከውን (‘vem a ser’) e evitando transformar uma cláusula difícil em uma afirmação explícita sobre o crescimento lunar. A nota foi ajustada para conservar a incerteza sintática do original.
