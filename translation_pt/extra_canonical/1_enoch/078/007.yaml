base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/007.yaml
  text: And fifteen parts of light are added within it until the fifteenth day[a]; and its light is completed as a sign of the year, and it becomes fifteen parts[c][b], and the moon comes into being by half of a seventh part.
translation:
  language: pt
  text: E quinze partes de luz lhe são acrescentadas até o décimo quinto dia, quando sua luz se completa como sinal do ano; ela chega a quinze partes,[a] e a lua se forma por metade de uma sétima parte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A repetição de “quinze” provavelmente se refere às quinze partes de luz lunar contadas neste capítulo, e não apenas à data do mês.
    reason: cultural_note
  - marker: b
    text: Literalmente, “por metade de uma sétima parte”. A expressão é sintaticamente difícil; a fração equivale a um décimo quarto e parece relacionar-se ao cálculo da luz lunar no contexto, mas sua relação exata com a cláusula permanece incerta.
    reason: textual_variant
lexical_decisions:
- source_word: ፲ትኅምስት ብርሃን
  choice: quinze partes de luz
  rationale: O numeral é quantitativo e, no contexto do capítulo, conta as porções da luz lunar; “partes” explicita a unidade subentendida.
- source_word: ይትወደደ ውስቴታ
  choice: lhe são acrescentadas
  rationale: Expressa o aumento gradual da luz e mantém a imagem concreta de acréscimo, com o pronome retomando a lua.
- source_word: እስከ ዐሡር ወኃሙስ
  choice: até o décimo quinto dia
  rationale: A expressão diz literalmente “até dez e cinco”; o contexto da fase crescente sustenta a explicitação temporal de “dia”.
- source_word: ይትፈጸም ብርሃነ ዚአሁ
  choice: sua luz se completa
  rationale: O verbo indica que a luz atinge sua medida plena.
- source_word: ለትእምርተ ዓመት
  choice: como sinal do ano
  rationale: Preserva a função calendárica da luz lunar sem impor leitura alegórica ou de presságio.
- source_word: ወይከውን ለ፲፲ትኅምስት
  choice: ela chega a quinze partes
  rationale: A sintaxe é difícil, mas parece reiterar a medida completa da luz; “chega a” comunica naturalmente a obtenção desse total.
- source_word: ወርኅ
  choice: a lua
  rationale: Embora o termo também possa significar “mês”, aqui a lua é o sujeito de suas fases e do aumento fracionário de luz.
- source_word: በመንፈቀ ሳብዕ እደ
  choice: à razão de metade de uma sétima parte
  rationale: 'Mantém a formulação fracionária do ge’ez: metade de um sétimo, isto é, um décimo quarto, a fração usada no cálculo lunar do contexto.'
theological_decisions:
- issue: Função da luz lunar completa no calendário
  choice: como sinal do ano
  alternative: como presságio do ano
  rationale: O contexto astronômico apresenta os luminares como marcadores da ordem calendárica; “sinal” conserva a linguagem cosmológica sem introduzir uma interpretação divinatória.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A terminologia de partes e frações foi preservada por ser essencial ao cálculo astronômico do trecho.
