base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/015.yaml
  text: And it makes three months of thirty days[a], and in its season[d][c][b], when its waning occurs.
translation:
  language: pt
  text: E faz três meses de trinta dias e, no seu tempo[a], quando ocorre a sua diminuição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas suas estações” ou “nos seus tempos determinados”. O termo ge’ez pode designar tempos, épocas ou estações fixadas.
    reason: lexical_alternative
  - marker: b
    text: A cláusula final é difícil. Também pode ser entendida como “quando se completa o seu cômputo” ou “quando termina o seu cálculo”, em referência ao sistema calendárico.
    reason: textual_difficulty
lexical_decisions:
- source_word: ሠለስተ፡ ወርኀ
  choice: três meses
  rationale: O numeral ሠለስተ rege o substantivo “mês”; o plural em português é exigido e mantém a referência calendárica.
- source_word: ይገብር
  choice: ele forma
  rationale: O verbo está na terceira pessoa masculina singular e significa “fazer, produzir, formar”. “Ele forma” conserva o sujeito singular implícito e soa natural na descrição de um ciclo calendárico.
- source_word: ፴መዋዕለ
  choice: trinta dias
  rationale: A expressão combina o numeral trinta com o plural de “dia”, preservando a precisão do cálculo astronômico.
- source_word: በአዝማነ፡ ዚአሁ
  choice: no seu tempo
  rationale: አዝማን pode indicar tempo, época ou estação determinada. A formulação no singular acompanha o referente imediato sem eliminar a amplitude lexical, registrada em nota.
- source_word: ሶበ
  choice: quando
  rationale: Conjunção temporal que introduz a última oração.
- source_word: ታኀጻጺተ፡ ዚአሁ
  choice: ocorre a sua diminuição
  rationale: A forma rara e difícil parece apontar para diminuição ou deficiência no ciclo, isto é, o minguar. A tradução mantém essa leitura no texto e registra em nota a interpretação alternativa ligada ao cômputo calendárico.
theological_decisions:
- issue: Sentido da cláusula calendárica final
  choice: quando ocorre a sua diminuição
  alternative: quando se completa o seu cômputo
  rationale: A cláusula etíope é obscura e admite análise relacionada tanto à diminuição quanto à conclusão de um cálculo. A leitura de diminuição se ajusta ao contexto lunar, mas a alternativa técnica é preservada explicitamente para não resolver uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se o sujeito singular implícito do ge’ez mediante “ele”, e a construção um pouco abrupta da cláusula final foi mantida em vez de ser harmonizada.
