base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/003.yaml
  text: These are the two great luminaries[a]; their disks are like the disk of heaven[b], and the size of the disks of the two of them is equal.
translation:
  language: pt
  text: Estes são os dois grandes luminares; seus discos são como o disco do céu, e a medida dos discos de ambos é igual.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O sentido exato dos termos traduzidos por “discos” e da oração final é incerto. Também se pode traduzir: “seus circuitos são como o circuito do céu, e a medida do circuito de ambos é a mesma”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ብርሃናት
  choice: luminares
  rationale: No Livro Astronômico, o termo designa os corpos celestes que dão luz; “luminares” conserva o registro cosmológico e elevado.
- source_word: ዐበይት
  choice: grandes
  rationale: Qualifica naturalmente os dois corpos celestes sem introduzir a ideia de poder contida em alternativas como “poderosos”.
- source_word: ክበቦሙ
  choice: seus discos
  rationale: O termo pode indicar círculo, circunferência ou disco. Neste contexto, “discos” comunica de modo natural a forma e a extensão visível dos dois luminares, embora “circuitos” continue sendo possível.
- source_word: ከመ፡ ክበበ፡ ሰማይ
  choice: como o disco do céu
  rationale: Mantém a comparação introduzida por ከመ e reproduz a imagem circular com a mesma escolha lexical aplicada ao substantivo repetido.
- source_word: ወእምጣነ
  choice: e a medida
  rationale: “Medida” preserva mais diretamente a ideia de extensão mensurada do que “tamanho”, sem perder clareza em português.
- source_word: ለክልኤሆሙ፡ ዕሩይ
  choice: de ambos é igual
  rationale: A expressão final parece afirmar igualdade ou identidade de medida entre os dois luminares; a formulação conserva a referência explícita a ambos.
