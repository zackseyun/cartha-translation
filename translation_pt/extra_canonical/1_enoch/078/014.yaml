base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/014.yaml
  text: From where the light comes to the moon, from there again it wanes until all the light is finished, and the days of the month pass, and its disk remains empty, without light.
translation:
  language: pt
  text: De onde vem a luz para a lua, dali a lua volta a diminuir até que toda a luz se acabe; passam os dias do mês, e seu disco[a] permanece vazio, sem luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seu disco” também pode ser traduzido como “seu círculo” ou “seu orbe”; a imagem é a forma redonda e visível da lua deixada sem luz.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኀበ ... እምህየ
  choice: De onde ... dali
  rationale: Preserva a construção correlativa relativa-demonstrativa do ge'ez e indica que a diminuição ocorre a partir do mesmo lugar de onde a luz chega.
- source_word: ይመጽእ ብርሃን ለወርኅ
  choice: vem a luz para a lua
  rationale: Mantém o movimento da luz em direção à lua sem introduzir uma explicação cosmológica moderna.
- source_word: ካዕበ የሐፅፅ
  choice: ela volta a diminuir
  rationale: No contexto das fases lunares, expressa naturalmente a diminuição da luz e conserva o sentido cíclico de ካዕበ.
- source_word: እስከ ይትዌዳእ ኵሉ ብርሃን
  choice: até que toda a luz se acabe
  rationale: Reproduz a conclusão do processo de diminuição sem ampliar o mecanismo descrito.
- source_word: ወየኀልፍ መዋዕለ ወርኅ
  choice: passam os dias do mês
  rationale: Adota o sentido temporal de ወርኅ, adequado ao ciclo mensal descrito.
- source_word: ክበቡ ባክ ዘእንበለ ብርሃን
  choice: seu disco permanece vazio, sem luz
  rationale: “Disco” comunica a forma redonda visível da lua; “vazio, sem luz” conserva a imagem enfática do original.
theological_decisions:
- issue: Natureza da descrição da luz lunar
  choice: Descrição observacional da lua recebendo e perdendo luz
  alternative: Interpretar a luz simbolicamente ou explicar o fenômeno como reflexão da luz solar
  rationale: O texto descreve o ciclo celeste em linguagem visionária e astronômica própria da obra; a tradução não deve alegorizar nem modernizar seu mecanismo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e preservação da correlação espacial do ge'ez. A repetição de “luz” foi mantida por sua função descritiva e enfática.
