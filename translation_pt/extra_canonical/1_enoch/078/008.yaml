base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/008.yaml
  text: And in its waning[a], on the first day it diminishes to fourteen parts of its light, and on the second it diminishes to thirteen parts of light, and on the third it diminishes to twelve, and on the fourth to eleven parts, and on the fifth it diminishes to ten parts, and on the sixth it diminishes to nine parts, and on the seventh it diminishes to eight parts, and on the eighth it diminishes to seven, and on the ninth it diminishes to six, and on the tenth it diminishes to five, and on the eleventh it diminishes to four, and on the twelfth it diminishes to three, and on the thirteenth it diminishes to two, and on the fourteenth it diminishes to half of a seventh part of all its light[d][c][b]; and on the fifteenth day that which remains from the whole is consumed.
translation:
  language: pt
  text: E, durante o seu minguar[a], no primeiro dia sua luz diminui para catorze partes; no segundo, diminui para treze partes de luz; no terceiro, diminui para doze; no quarto, diminui para onze partes; no quinto, diminui para dez partes; no sexto, diminui para nove partes; no sétimo, diminui para oito partes; no oitavo, diminui para sete; no nono, diminui para seis; no décimo, diminui para cinco; no décimo primeiro, diminui para quatro; no décimo segundo, diminui para três; no décimo terceiro, diminui para duas; e, no décimo quarto, diminui para metade de uma sétima parte de toda a sua luz[b]. No décimo quinto dia, o que resta do total é consumido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, durante a fase em que a luz da lua vai diminuindo.
    reason: lexical_alternative
  - marker: b
    text: “Metade de uma sétima parte” traduz literalmente uma expressão fracionária matematicamente incomum no texto ge'ez.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕጸጸ / የኀጽጽ
  choice: minguar / diminui
  rationale: O substantivo e o verbo descrevem a redução progressiva da luz lunar. “Minguar” é idiomático no contexto lunar, enquanto “diminui” mantém clara a fórmula numérica repetida.
- source_word: እደ / ክፍለ
  choice: partes
  rationale: Os dois termos designam divisões mensuradas da luz; “partes” é natural, claro e não acrescenta precisão técnica indevida.
- source_word: ብርሃኑ / ብርሃን
  choice: sua luz / luz
  rationale: Tradução direta do elemento visível e mensurável descrito no texto.
- source_word: መንፈቀ፡ ሳብዐቱ
  choice: metade de uma sétima parte
  rationale: Conserva a expressão fracionária incomum do ge'ez sem corrigi-la ou suavizá-la.
- source_word: ይትዌዳእ
  choice: se extingue
  rationale: O verbo, derivado de ወደአ, indica que o restante acaba, é consumido ou se esgota; “se extingue” se ajusta naturalmente à luz lunar no décimo quinto dia.
- source_word: ዘተረፈ፡ እምኵሉ
  choice: o que resta do todo
  rationale: Preserva a referência ao resíduo final da quantidade integral de luz.
theological_decisions:
- issue: Natureza da sequência numérica
  choice: Descrição observacional e astronômica da luz lunar restante
  alternative: Ler os números simbolicamente ou resumir a passagem como simples diminuição da lua
  rationale: A enumeração e a repetição verbal apresentam medidas sucessivas. A tradução preserva esse sentido direto sem impor interpretação alegórica.
- issue: Sentido da redução medida
  choice: “diminui para”, indicando a quantidade de luz restante
  alternative: “diminui em”, indicando a quantidade subtraída
  rationale: A sequência de catorze até duas partes descreve os estados sucessivos aos quais a luz é reduzida; tratá-los como valores subtraídos prejudicaria a progressão astronômica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “diminui” foi mantida deliberadamente para refletir a estrutura formular do original; os números foram grafados por extenso para fluidez literária.
