base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/002.yaml
  text: 'And the moon has four names: the first is Asonya[a], the second Abla, the third Benase[b], and the fourth Erae.'
translation:
  language: pt
  text: 'E a lua[a] tem quatro nomes: o primeiro é Asonya, o segundo é Abla, o terceiro é Benase[b] e o quarto é Erae.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em ge’ez, ወርኅ pode significar tanto «lua» como «mês». Aqui se prefere «lua» porque o versículo atribui quatro nomes ao astro.
    reason: lexical_alternative
  - marker: b
    text: Os quatro nomes são transliterações das formas em ge’ez. Suas formas mais antigas subjacentes, se existiram, são incertas.
    reason: cultural_note
lexical_decisions:
- source_word: ወርኅ
  choice: lua
  rationale: O termo ge’ez pode designar tanto a lua quanto o mês. Neste contexto, porém, os quatro nomes são atribuídos ao astro, por isso «lua» é a opção mais adequada.
- source_word: አርባዕተ አስማተ
  choice: quatro nomes
  rationale: Tradução direta e natural da expressão enumerativa.
- source_word: ቦቱ
  choice: tem
  rationale: A forma preposicional e pronominal exprime posse, literalmente algo como «há para ela» ou «pertencem a ela»; «tem» comunica esse sentido com naturalidade em português.
- source_word: ፩ስሙ፡ ... ወካልእ፡ ... ወሣልስ፡ ... ወራብዕ፡
  choice: o primeiro é... o segundo... o terceiro... e o quarto...
  rationale: Mantém com clareza e concisão a sequência enumerativa do ge’ez.
- source_word: አሶንያ
  choice: Asonya
  rationale: Transliteração conservadora do nome próprio, preservando a sequência consonantal e o som representado por «ya».
- source_word: አብላ
  choice: Abla
  rationale: Transliteração direta e legível da forma etíope.
- source_word: ብናሴ
  choice: Benase
  rationale: Transliteração conservadora; a vocalização exata do nome é incerta.
- source_word: ኤራእ
  choice: Erae
  rationale: Forma legível e conservadora para o nome próprio, cuja representação final admite incerteza.
theological_decisions:
- issue: Se ወርኅ deve ser traduzido como «lua» ou «mês»
  choice: lua
  alternative: mês
  rationale: Embora o vocábulo possa ter ambos os sentidos, a atribuição de quatro nomes no contexto do Livro dos Luminares aponta para o corpo celeste. A alternativa lexical é registrada em nota para não ocultar a amplitude do original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe enumerativa natural. Os nomes próprios foram mantidos em transliteração conservadora, sem lhes atribuir significados conjecturais.
