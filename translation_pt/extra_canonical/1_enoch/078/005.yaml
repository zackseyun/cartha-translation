base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/005.yaml
  text: And they set[a], and they enter the western portals, and make their circuit by the north[b], and by the eastern portals they come out upon the face of the sky.
translation:
  language: pt
  text: E eles se põem[a], entram pelos portais do ocidente, fazem seu percurso pelo norte[b] e saem pelos portais do oriente sobre a face do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem repetida dos portais reflete a descrição do Livro Astronômico, segundo a qual o céu possui aberturas fixas pelas quais os luminares se movem.
    reason: cultural_note
  - marker: b
    text: A expressão traduzida como “fazem seu percurso pelo norte” é concisa no ge'ez e também pode indicar que eles contornam ou seguem ao longo do lado norte.
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርቡ
  choice: se põem
  rationale: No contexto astronômico, descreve os luminares no ocaso; a formulação preserva o sentido técnico e permite que o sujeito plural permaneça implícito no contexto.
- source_word: ይበውኡ
  choice: entram
  rationale: Verbo simples de movimento que corresponde naturalmente à passagem pelos portais celestes.
- source_word: ኆዋኅወ
  choice: portais
  rationale: Mantém a imagem arquitetônica das aberturas fixas do céu, recorrente no Livro Astronômico, sem reduzi-las a portas comuns.
- source_word: ምዕራብ
  choice: do ocidente
  rationale: Expressa com naturalidade em português a localização dos portais, preservando a orientação oeste.
- source_word: የአውዱ
  choice: fazem seu percurso
  rationale: Comunica o movimento de contornar ou circular sem impor que se trate necessariamente de um circuito completo.
- source_word: እንተ መስዕ
  choice: pelo norte
  rationale: Preserva de modo conciso a ideia de rota ou movimento ao longo do lado norte, cuja formulação em ge'ez é breve.
- source_word: እንተ ኆዋኅወ ምሥራቅ
  choice: pelos portais do oriente
  rationale: Mantém o paralelismo com os portais do ocidente e, junto de 'saem', deixa claro que a saída ocorre por essas aberturas.
- source_word: ይወፅኡ
  choice: saem
  rationale: É o correspondente natural de 'entram' e conserva a sequência de movimento pelos portais.
- source_word: ዲበ ገጸ ሰማይ
  choice: sobre a face do céu
  rationale: Preserva a expressão cósmica concreta do original, em vez de nivelá-la para o simples 'no céu'.
