base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/013.yaml
  text: 'It is completed with exactness: by day the sun goes down in the west[a], and from the east the moon rises by night and gives light all night, until the sun rises before it[c][b], and the moon is seen before the sun.'
translation:
  language: pt
  text: 'Isto se realiza com exatidão: de dia, o sol desce no oeste; e, do leste, a lua sobe durante a noite[a] e dá luz a noite inteira, até que o sol nasça diante dela[b], e a lua seja vista diante do sol.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “do leste ... durante a noite” é difícil no contexto. A formulação ge'ez foi traduzida de modo transparente, sem harmonizá-la com uma descrição astronômica esperada.
    reason: textual_variant
  - marker: b
    text: O verbo traduzido por “nasça” tem forma textual difícil. Neste contexto, o sentido provável é o aparecimento ou nascimento do sol. “Diante dela” também pode indicar posição ou precedência temporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትፌጸም
  choice: isso se cumpre
  rationale: A forma passiva/reflexiva indica conclusão ou cumprimento. “Cumpre-se” preserva essa ideia no contexto do ciclo celeste sem exigir conotação profética.
- source_word: ጥንቀቀ
  choice: com exatidão
  rationale: Expressa cuidado ou precisão e combina com a regularidade técnica e calendárica da passagem.
- source_word: ይወርድ
  choice: desce
  rationale: Mantém diretamente a imagem vertical do verbo, sem substituí-la pelo termo astronômico mais interpretativo “se põe”.
- source_word: ዐረብ
  choice: oeste
  rationale: Em paralelo com “leste”, o sentido direcional é o mais adequado.
- source_word: ምሥራቅ
  choice: leste
  rationale: Designa a direção ou região do nascente.
- source_word: የዐርግ
  choice: sobe
  rationale: O verbo significa subir ou ascender. O sujeito posposto é entendido como “a lua”, conforme a sintaxe ge'ez da cadeia verbal.
- source_word: በሌሊት
  choice: durante a noite
  rationale: Tradução natural que conserva o contraste explícito com “de dia”.
- source_word: ያበርህ
  choice: dá luz
  rationale: Reproduz a nuance causativa de iluminar ou fazer brilhar.
- source_word: በኵሉ ሌሊት
  choice: a noite inteira
  rationale: Preserva a abrangência de toda a noite em português corrente.
- source_word: ይሠርቅ
  choice: nasça
  rationale: Embora a forma seja textualmente difícil, o contexto solar favorece o sentido de surgir ou nascer.
- source_word: በቅድሜሁ
  choice: diante dela
  rationale: Conserva a possível dimensão espacial ou temporal de “diante de/antes de”, com o pronome retomando a lua.
- source_word: ይትረአይ
  choice: seja vista
  rationale: Mantém a forma passiva/reflexiva de visibilidade, em vez de suavizá-la como “apareça”.
- source_word: በቅድመ ፀሐይ
  choice: diante do sol
  rationale: Tradução transparente que preserva a formulação espacial ou temporal incomum do texto.
theological_decisions:
- issue: Se a sequência celeste deve ser harmonizada com uma descrição astronômica moderna
  choice: Preservar a sequência e a repetição incomuns do texto ge'ez.
  alternative: Parafrasear como uma descrição geral do pôr do sol, do luar e do nascer do sol.
  rationale: A passagem pertence a uma exposição técnica dos luminares. Sua tensão e possível ambiguidade devem permanecer visíveis, sem correção silenciosa segundo expectativas astronômicas modernas.
- issue: Sujeito do verbo የዐርግ
  choice: 'Entender “a lua” como sujeito posposto: “a lua sobe”.'
  alternative: 'Entender o sol como sujeito: “do leste ele sobe durante a noite”.'
  rationale: A construção ge'ez permite que o sujeito apareça depois de uma cadeia de verbos; “a lua” rege naturalmente tanto “sobe” quanto “dá luz”, além de formar o contraste dia/noite.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A tradução conserva a linguagem de movimento celeste (“desce”, “sobe”) e evita harmonizar a descrição com terminologia astronômica moderna.
