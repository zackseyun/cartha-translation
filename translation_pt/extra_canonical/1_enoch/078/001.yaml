  text: 'And these are the names of the sun: one is Aryares[a], and the second, Tomas.'
translation:
  language: pt
  text: 'E estes são os nomes do sol: um é Aryares[a], e o segundo, Tomas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os dois nomes solares são preservados como transliterações do testemunho ge'ez. A forma exata que tinham em etapas anteriores do texto é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: አስማቲሁ ለፀሐይ
  choice: os nomes do sol
  rationale: O substantivo plural com sufixo, seguido de «sol», forma aqui uma expressão possessiva natural em português.
- source_word: ከመዝ
  choice: estes são
  rationale: Introduz a enumeração e preserva a construção demonstrativa do ge'ez em português claro.
- source_word: ፩
  choice: um
  rationale: Reproduz diretamente o numeral que introduz o primeiro nome, sem convertê-lo em «o primeiro».
- source_word: አርያሬስ
  choice: Aryares
  rationale: Nome próprio transliterado segundo a forma preservada no testemunho ge'ez, sem tradução etimológica especulativa.
- source_word: ካልእ
  choice: o segundo
  rationale: No contexto enumerativo, indica o segundo elemento do par.
- source_word: ቶማስ
  choice: Tomas
  rationale: Mantém a transliteração do nome próprio e evita identificá-lo indevidamente com a grafia portuguesa do nome apostólico, «Tomé».
theological_decisions:
- issue: Normalização ou interpretação dos nomes solares
  choice: Manter Aryares e Tomas como nomes próprios transliterados
  alternative: Traduzir etimologicamente os nomes ou normalizar Tomas como Tomé
  rationale: A transliteração conserva a terminologia da cosmologia apocalíptica e evita associações posteriores ou significados conjecturais.
translation_notes:
  register: Português moderno, claro e digno, com leve caráter enumerativo. A ordem «E estes são» acompanha de perto a construção da fonte sem soar arcaica; os nomes permanecem transliterados.
