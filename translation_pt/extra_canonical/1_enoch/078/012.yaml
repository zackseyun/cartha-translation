base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/012.yaml
  text: On the first day she is called the new moon[d][c][b][a], because on that day light rises upon her.
translation:
  language: pt
  text: No primeiro dia, ela é chamada de lua nova[a], porque nesse dia a luz surge sobre ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a lua no início de sua fase crescente. O termo também pode ser entendido como “a que cresce” ou “a que nasce”.
    reason: cultural_note
  - marker: b
    text: 'Ou: “a luz aparece sobre ela”. A expressão ge''ez retrata a claridade surgindo sobre a lua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በቀዳሚት፡ ዕለት
  choice: No primeiro dia
  rationale: Expressa de modo natural em português a indicação temporal do primeiro dia da sequência lunar.
- source_word: ሠርቀ
  choice: lua nova
  rationale: No contexto calendárico do Livro Astronômico, o termo designa tecnicamente a lua nova, embora também possa evocar o nascer ou o crescimento da luz lunar.
- source_word: ትሠመይ
  choice: ela é chamada
  rationale: A forma verbal feminina remete à lua; o pronome feminino é também natural em português e preserva a personificação do texto.
- source_word: እስመ
  choice: porque
  rationale: Introduz diretamente a explicação do nome dado à lua no primeiro dia.
- source_word: ይትነሣእ፡ ላዕሌሃ፡ ብርሃን
  choice: a luz surge sobre ela
  rationale: Conserva a imagem da luz aparecendo ou elevando-se sobre a lua, com formulação clara e corrente em português.
theological_decisions:
- issue: Referência feminina ao luminar
  choice: Manter o feminino em “ela”
  alternative: Repetir “a lua” ou evitar o pronome
  rationale: As formas ge'ez são femininas, e o português igualmente trata “lua” como substantivo feminino; a escolha preserva a textura personificada sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A referência feminina é mantida por corresponder tanto ao ge'ez quanto ao gênero de “lua” em português.
