base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/006.yaml
  text: And when the moon rises[a], it appears in the sky as half of a seventh part[c][b], [and all the light is in it,] and it completes its light as fourteen parts.
translation:
  language: pt
  text: Quando a lua nasce, aparece no céu como metade de uma sétima parte[a], [e toda a luz está nela,][b] e ela completa sua luz em catorze partes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “metade de uma sétima parte”. O texto emprega um cálculo fracionário próprio desta descrição astronômica.
    reason: ambiguity
  - marker: b
    text: Esta oração aparece entre colchetes na fonte ge'ez utilizada, indicando incerteza textual; sua sintaxe é condensada, mas o sentido provável é que toda a luz está nela.
    reason: textual_variant
  - marker: c
    text: As “catorze partes” pertencem ao sistema esquemático pelo qual o Livro Astronômico mede a iluminação lunar; não constituem uma descrição científica moderna.
    reason: cultural_note
lexical_decisions:
- source_word: ይትነሣእ
  choice: nasce
  rationale: Em contexto astronômico, o verbo indica o movimento ascendente ou o aparecimento de um astro; “nasce” é a expressão portuguesa natural para a lua no horizonte.
- source_word: ወርኅ
  choice: a lua
  rationale: O contexto trata da aparência visível e da iluminação do astro, portanto o substantivo significa “lua”, e não “mês”.
- source_word: ያስተርኢ በሰማይ
  choice: aparece no céu
  rationale: Preserva o caráter visual e observacional da expressão ge'ez em português corrente.
- source_word: መንፈቀ ሳብዕተ እደ
  choice: metade de uma sétima parte
  rationale: Mantém a formulação fracionária e técnica do sistema esquemático de iluminação lunar, sem convertê-la em terminologia científica moderna.
- source_word: ብርሃን
  choice: luz
  rationale: É o termo simples e concreto adequado à iluminação visível da lua.
- source_word: ብርሃን ይከውን ቦቱ ኵሉ
  choice: e toda a luz está nela
  rationale: Traduz separadamente a oração entre colchetes, conservando tanto sua totalidade quanto sua relação locativa, sem fundi-la com a oração seguinte.
- source_word: ከመ ዐሡር ወረቡዕ
  choice: em catorze partes
  rationale: Expressa o número catorze dentro do sistema de partes pressuposto pelo contexto; “em” evita acrescentar a ideia interpretativa de “medida” e resulta mais natural em português.
- source_word: ይፈጽም ብርሃኖ
  choice: ela completa sua luz
  rationale: Conserva a voz ativa e a noção de completar ou levar a luz à plenitude, em distinção da oração textual entre colchetes.
theological_decisions:
- issue: Preservar ou substituir o cálculo numérico da iluminação lunar por linguagem comum sobre as fases da lua
  choice: Preservar “metade de uma sétima parte” e “catorze partes”
  alternative: Parafrasear como uma fase parcial da lua ou como lua cheia
  rationale: A passagem apresenta um cálculo cosmológico esquemático. Manter suas frações e partes evita impor uma harmonização científica ou uma interpretação não expressa no texto.
- issue: Relação entre a oração entre colchetes e a conclusão do versículo
  choice: Traduzir as duas orações distintamente
  alternative: Fundir ambas como “toda a sua luz se completa em catorze partes”
  rationale: O testemunho distingue a afirmação de que toda a luz está nela da afirmação de que a lua completa sua luz; a tradução conserva essa tensão textual sem resolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário acessível. A formulação numérica incomum e a oração textualmente incerta foram preservadas, com esclarecimentos em notas, em vez de serem normalizadas ou harmonizadas.
