  text: And in certain months[a], the month has twenty-nine days[c][b], and once twenty-eight.
translation:
  language: pt
  text: Em certos meses, o mês terá vinte e nove dias e, uma vez, terá vinte e oito dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A parte final está mal preservada na transcrição OCR do testemunho etíope, que parece trazer «cinco semanas». A leitura «vinte e oito» decorre da provável correção do numeral e se ajusta ao contexto, que descreve a duração dos meses lunares.
    reason: textual_variant
lexical_decisions:
- source_word: አውራኅ
  choice: meses
  rationale: A forma é entendida como plural de «mês»; o contexto trata da duração variável dos meses lunares.
- source_word: እሙራን
  choice: certos
  rationale: O termo qualifica os meses como determinados ou específicos, sem introduzir «luminares».
- source_word: ይከውን
  choice: terá
  rationale: O futuro do verbo copulativo é expresso naturalmente em português como «terá» numa declaração sobre a duração do mês.
- source_word: ፳ወ፱መዋዕል
  choice: vinte e nove dias
  rationale: Tradução direta do numeral e do substantivo, em formulação calendárica idiomática.
- source_word: ለወርኅ
  choice: o mês
  rationale: No contexto, a expressão indica a quantidade de dias atribuída ao mês; a sintaxe foi naturalizada sem alterar o sentido.
- source_word: ፳ወ፰ (leitura textual reconstruída)
  choice: vinte e oito
  rationale: A leitura contextual e a revisão do testemunho indicam o numeral 28; a transcrição OCR «፭ወሳሙን» («cinco semanas») provavelmente resulta de reconhecimento defeituoso.
