  register: Português moderno, claro e digno, com terminologia calendárica comum. A repetição de «meses» e «mês» foi mantida por refletir a estrutura e o contraste do texto-fonte. A incerteza textual da frase final é explicitada em nota, sem inserir no corpo uma leitura contextual inadequada.
