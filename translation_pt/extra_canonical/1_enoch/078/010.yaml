  naturalness: 'O início é natural e adequado ao registro. A segunda coordenação, porém, é pesada e pouco clara: “de onde ... a partir do sol” combina duas expressões de origem sem uma relação portuguesa inteligível. Uma leve reordenação preserva a concisão e torna explícito que a questão é o ponto/lado de recebimento em relação ao sol.'
