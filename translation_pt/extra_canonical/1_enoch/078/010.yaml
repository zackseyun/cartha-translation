base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/010.yaml
  text: 'And Uriel showed me another law: when light is transferred into the moon[c][b][a], and from where it is transferred from the sun.'
translation:
  language: pt
  text: 'E Uriel me mostrou outra lei[a]: quando a luz é transferida para a lua e de que lado ela é transferida, a partir do sol.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “outra ordem”, “outra regra” ou “outra determinação”. O termo ge’ez pode designar uma regra ordenada ou uma disposição fixa do cosmos.
    reason: lexical_alternative
  - marker: b
    text: A formulação é condensada. O sentido parece ser que Uriel mostrou a Enoque a regra relativa à transferência da luz para a lua a partir do sol. A expressão traduzida por “de que lado” também pode ser entendida como “de onde” ou “de que direção”.
    reason: alternative_reading
lexical_decisions:
- source_word: ካልእት፡ ሥርዓተ
  choice: outra lei
  rationale: A expressão apresenta mais uma regra na sequência astronômica. “Lei” conserva o sentido de ordem cósmica fixa, enquanto a nota registra alternativas legítimas.
- source_word: አርአየኒ
  choice: me mostrou
  rationale: Reproduz de modo direto o verbo do relato visionário, sem acrescentar a ideia mais específica de revelação.
- source_word: ይትወደይ
  choice: é transferida
  rationale: Mantém a forma passiva e o movimento da luz entre os luminares indicado pelo contexto.
- source_word: ብርሃን
  choice: a luz
  rationale: É o equivalente mais claro e menos interpretativo para a luminosidade mencionada.
- source_word: ውስተ፡ ወርኅ
  choice: para a lua
  rationale: Expressa movimento em direção ao interior ou âmbito da lua com naturalidade em português.
- source_word: እምኀበ
  choice: de onde
  rationale: Preserva a força espacial da expressão sem decidir de modo excessivo entre origem, lado e direção.
- source_word: እምፀሐይ
  choice: a partir do sol
  rationale: Identifica o sol como a origem da transferência da luz e evita, tanto quanto possível, a repetição pouco natural de duas ocorrências consecutivas de “de”.
theological_decisions:
- issue: Natureza da luz da lua
  choice: O versículo apresenta a luz da lua como transferida a partir do sol.
  alternative: O texto poderia apenas indicar uma relação espacial entre a luz lunar e a solar, ou conservar uma nuance astronômica técnica hoje obscura.
  rationale: A repetição do verbo passivo, junto de “para a lua” e “a partir do sol”, favorece a ideia de luminosidade derivada. A formulação permanece cosmológica e não introduz simbolismo teológico posterior.
- issue: Sentido espacial de እምኀበ
  choice: “de onde”
  alternative: “de que lado” ou “de que direção”
  rationale: “De onde” conserva a ambiguidade lexical e a estrutura comprimida do ge’ez; explicitar “lado” ou “direção” poderia resolver indevidamente uma nuance espacial apenas possível.
translation_notes:
  register: Português atual, digno e acessível, com estrutura próxima do ge’ez. A repetição de “transferida” foi mantida para refletir o paralelismo da fonte, embora produza uma frase deliberadamente condensada.
