base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/051/001.yaml
  text: And in those days the earth will give back from its womb[c][b][a], and Sheol will give back what it has received, .
translation:
  language: pt
  text: 'Naqueles dias, a terra devolverá o que está em seu ventre[a]; o Sheol devolverá o que recebeu, e a Perdição devolverá o que deve. Ele escolherá dentre eles os justos e os santos, pois está próximo o dia em que serão salvos.


    Naqueles dias, o Escolhido se assentará em seu trono, e de sua boca sairão todos os pensamentos de sabedoria, pois o Senhor dos Espíritos lhe concedeu isso e o glorificou.


    Naqueles dias, os montes saltarão como carneiros, e as colinas pularão como cordeiros saciados de leite. Todos os anjos estarão no céu, e seus rostos resplandecerão de alegria, pois naqueles dias o Escolhido se levantará. A terra se alegrará; os justos habitarão sobre ela, e os escolhidos andarão e passearão nela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “a terra devolverá aquilo que lhe foi confiado”. O termo etíope pode ser entendido em relação a um depósito confiado, mas também preserva a imagem do ventre da terra; o paralelismo com o que o Sheol recebeu e com o que a Perdição deve sustenta a alternativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula apocalíptica recorrente e a cadência do texto.
- source_word: ታገብእ / ያገብእ
  choice: devolverá
  rationale: O verbo repetido descreve a restituição daquilo que estava sob custódia da terra, do Sheol e da Perdição.
- source_word: ማሕፀንታ
  choice: aquilo que lhe foi confiado
  rationale: No paralelismo com ‘o que recebeu’ e ‘o que deve’, a forma designa mais provavelmente um depósito ou bem confiado; a imagem alternativa do ventre é preservada em nota.
- source_word: ሲኦል
  choice: Sheol
  rationale: Mantém o termo do mundo conceitual judaico antigo sem o identificar automaticamente com sepultura, inferno ou condenação final.
- source_word: ሀጕል
  choice: a Perdição
  rationale: O substantivo expressa destruição ou perdição e aparece personificado como um domínio que restitui o que deve.
- source_word: ኅሩይ
  choice: o Escolhido
  rationale: Título definido da figura escatológica no contexto das Parábolas de Enoque.
- source_word: ኵሎ ኅሊናተ ጥበብ እምኅሊና አፉሁ ያወፅእ
  choice: de sua boca sairão todos os pensamentos de sabedoria e conselho
  rationale: Conserva a associação entre sabedoria, conselho e a fala do Escolhido, em português natural.
- source_word: ያንሶስዉ
  choice: passearão
  rationale: Expressa movimento livre ou circulação pela terra restaurada, em paralelo com ‘andarão’.
theological_decisions:
- issue: Identidade do domínio dos mortos em ሲኦል
  choice: Sheol
  alternative: mundo dos mortos
  rationale: A transliteração conserva a categoria apocalíptica antiga e evita impor a noção cristã posterior de inferno.
- issue: Sentido de ማሕፀንታ
  choice: aquilo que lhe foi confiado
  alternative: o que guardava em seu ventre
  rationale: O paralelismo jurídico de receber, dever e devolver favorece a ideia de depósito, mas a proximidade gráfica e semântica com a imagem do ventre justifica registrar a alternativa.
- issue: Referente de ‘ele escolherá’
  choice: manter o pronome sem explicitar o referente
  alternative: o Escolhido escolherá
  rationale: O texto apresenta o sujeito pronominal antes de mencionar expressamente o Escolhido; explicitar a identificação eliminaria uma pequena ambiguidade textual.
- issue: Relação entre o Senhor dos Espíritos e o Escolhido
  choice: ‘os deu a ele e o glorificou’
  alternative: ‘lhe concedeu isso e o glorificou’
  rationale: Mantém a distinção entre as figuras e a concessão divina de sabedoria e conselho sem desenvolver uma formulação doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência apocalíptica. ‘Sheol’, ‘Perdição’, ‘Escolhido’ e ‘Senhor dos Espíritos’ foram mantidos como termos conceituais ou títulos. A segmentação segue todo o oráculo fornecido na fonte etíope, embora a referência editorial o identifique como 1 Enoque 51:1.
