base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/013.yaml
  text: For abundant is the mercy of the Lord of Spirits[a], and he is slow to anger[c][b]; and all his works and all the measure of what he has made he has revealed to the righteous and the chosen in the name of the Lord of Spirits.
translation:
  language: pt
  text: Pois abundante é a misericórdia do Senhor dos Espíritos, e ele demora a irar-se[a]; e revelou aos justos e aos escolhidos todas as suas obras e toda a medida do que fez[b], em nome do Senhor dos Espíritos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e sua ira está distante”. A expressão também funciona como idioma bíblico para a demora em irar-se.'
    reason: lexical_alternative
  - marker: b
    text: A expressão em ge'ez é difícil. Também pode significar “cada medida do que fez” e talvez se refira à extensão ou à ordem estabelecida de suas obras.
    reason: lexical_alternative
  - marker: c
    text: “Em nome do Senhor dos Espíritos” pode indicar a esfera, a autoridade ou a invocação sob a qual ocorre essa revelação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ብዙኅ ምሕረቱ
  choice: abundante é a misericórdia
  rationale: Preserva a ideia quantitativa de grande plenitude e mantém o tom elevado da afirmação sobre a clemência divina.
- source_word: ለእግዚአ መናፍስት
  choice: do Senhor dos Espíritos
  rationale: Mantém o título divino característico de 1 Enoque, sem explicá-lo ou reinterpretá-lo.
- source_word: ወርሑቅ መዓት
  choice: e ele demora a irar-se
  rationale: Expressa em português natural o idioma semítico e etíope tradicional de lentidão para a ira, conservando em nota a leitura formal possível.
- source_word: ወኵሉ ግብሩ
  choice: todas as suas obras
  rationale: Abrange tanto a atividade quanto a criação divina e corresponde ao sentido amplo do termo no contexto.
- source_word: ወኵሉ እምጣነ ገብረ
  choice: toda a medida do que fez
  rationale: Retém a formulação enigmática do ge'ez, que pode indicar medida, extensão ou ordem das obras divinas, sem impor uma interpretação.
- source_word: ከሠተ
  choice: revelou
  rationale: Verbo apropriado ao contexto visionário, no qual realidades antes ocultas são dadas a conhecer.
- source_word: ለጻድቃን ወለኅሩያን
  choice: aos justos e aos escolhidos
  rationale: Usa termos atuais e claros, preservando tanto a linguagem de justiça quanto o motivo enóquico da escolha.
- source_word: በስሙ
  choice: em nome
  rationale: É a correspondência formal mais direta e deixa aberta a relação exata de autoridade, esfera ou invocação.
theological_decisions:
- issue: Sentido da expressão relativa à ira
  choice: Entendê-la como descrição de Deus, que demora a irar-se.
  alternative: “e sua ira está distante”
  rationale: A expressão corresponde a um idioma bíblico tradicional sobre a paciência divina; a alternativa literal é preservada em nota para não apagar a forma e a tensão do ge'ez.
- issue: Sentido de “toda a medida do que fez”
  choice: Conservar uma tradução transparente e relativamente formal.
  alternative: “toda a ordem que estabeleceu” ou “o número total de suas criaturas”
  rationale: O texto pode aludir à extensão, proporção ou estrutura ordenada das obras de Deus. A evidência não justifica escolher apenas uma dessas interpretações.
- issue: Função de “em nome do Senhor dos Espíritos”
  choice: Manter a expressão sem determinar sintaticamente um único sentido.
  alternative: Explicitar que a revelação ocorre pela autoridade, na esfera ou mediante a invocação desse nome.
  rationale: O ge'ez permite mais de uma nuance, e explicitar uma delas eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase foi levemente ajustada para clareza, sem eliminar as ambiguidades substantivas do ge'ez.
