base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/004.yaml
  text: And the chosen ones shall dwell with the chosen ones[a], and these are the measures that shall be given for faith[d][c][b], and they shall strengthen righteousness.
translation:
  language: pt
  text: E os escolhidos começarão a habitar com os escolhidos, e estas são as medidas[a] que serão dadas para a fé[b]; e elas fortalecerão a justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Medidas» também pode significar porções medidas, partes atribuídas ou padrões; a nuance exata desta linha é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou «para a fidelidade» ou «para a firmeza».
    reason: lexical_alternative
lexical_decisions:
- source_word: ይዌጥኑ፡ ወየሐድሩ
  choice: começarão a habitar
  rationale: O primeiro verbo, de ወጠነ, expressa o começo de uma ação, e o segundo, de ሐደረ, indica habitar ou permanecer. A construção portuguesa reúne naturalmente os dois verbos sem omitir o aspecto incoativo.
- source_word: ኅሩያን
  choice: os escolhidos
  rationale: Designação apocalíptica transparente e natural em português, sem acrescentar conotações confessionais a «eleitos».
- source_word: እሉ
  choice: estas
  rationale: O demonstrativo é próximo e plural; «estas» reproduz seu valor mais direto e concorda com «medidas».
- source_word: እምጣናት
  choice: medidas
  rationale: Mantém a imagem concreta e a ambiguidade entre quantidades medidas, porções atribuídas e padrões.
- source_word: ይትወሀቡ
  choice: serão dadas
  rationale: Reprodução direta da forma passiva, adequada ao registro revelatório.
- source_word: ለሃይማኖት
  choice: para a fé
  rationale: Tradução direta do termo semanticamente amplo, sem excluir os sentidos contextuais de fidelidade ou firmeza, registrados em nota.
- source_word: ያፀንዕዋ
  choice: fortalecerão
  rationale: Preserva a força ativa de tornar firme ou forte.
- source_word: ለጽድቅ
  choice: a justiça
  rationale: «Justiça» é natural em português e conserva o campo moral e judicial do termo; «retidão» também seria possível.
theological_decisions:
- issue: Sentido de ሃይማኖት no contexto apocalíptico
  choice: fé
  alternative: fidelidade ou firmeza
  rationale: O termo admite mais de um valor. O texto principal mantém a tradução direta, enquanto a nota preserva a possibilidade de fidelidade perseverante sem decidir a questão doutrinariamente.
- issue: Relação entre os dois verbos iniciais
  choice: começarão a habitar
  alternative: começarão e habitarão
  rationale: A formulação escolhida representa ambos os verbos e expressa em português corrente a relação incoativa mais provável, sem confundir o primeiro verbo com «descansar».
- issue: Valor de ጽድቅ
  choice: justiça
  alternative: retidão
  rationale: «Justiça» preserva a amplitude moral e judicial do termo; a alternativa ressalta mais diretamente a conduta correta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a solenidade apocalíptica sem reproduzir mecanicamente a coordenação do ge'ez. Todas as ambiguidades relevantes são mantidas no texto ou explicitadas em notas.
