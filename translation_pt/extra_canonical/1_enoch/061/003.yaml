base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/003.yaml
  text: And the angel who went with me said to me[a], “These are the measures of the righteous and the cords of the righteous; they will come to the righteous[d][c][b], so that they may rely on the name of the Lord of Spirits forever and ever.”
translation:
  language: pt
  text: 'E o anjo que caminhava comigo me disse: “Estas são as medidas dos justos e as cordas dos justos; elas virão aos justos[a], para que eles se apoiem[b] no nome do Senhor dos Espíritos para todo o sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “elas vêm aos justos”. O verbo pode ser entendido como presente ou futuro.'
    reason: verbal_aspect
  - marker: b
    text: O sujeito parece ser “os justos”. O verbo também pode significar “confiem”, “encontrem apoio” ou “sejam sustentados”; a construção permite alguma ambiguidade quanto ao sujeito.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ዘምስሌየ የሐውር
  choice: que caminhava comigo
  rationale: Expressa naturalmente o verbo de ir ou caminhar e preserva a fórmula do anjo-guia que acompanha Enoque.
- source_word: እሙንቱ
  choice: estas são
  rationale: O demonstrativo identifica elementos que acabaram de ser mostrados na visão.
- source_word: እምጣነ ጻድቃን
  choice: as medidas dos justos
  rationale: እምጣነ é entendido como forma plural em estado construto de ምጣን, “medida”, em continuidade com a cena de medição dos versículos anteriores, e não como a preposição “de” seguida de “abundância”.
- source_word: ማእሰረ ጻድቃን
  choice: as cordas dos justos
  rationale: O substantivo designa cordas, laços ou faixas; “cordas” preserva a imagem concreta dos instrumentos de medição no contexto imediato.
- source_word: ይመጽኡ ለጻድቃን
  choice: elas virão aos justos
  rationale: O verbo está no imperfeito e indica vinda presente ou futura; o feminino pronominal em português retoma naturalmente “medidas” e “cordas”. A preposição é mantida como direção aos justos, sem convertê-la em uma ideia mais específica de provisão.
- source_word: ከመ ይትመረጐዙ
  choice: para que eles se apoiem
  rationale: O verbo pode comunicar apoiar-se, encontrar sustentação ou confiar. “Apoiar-se” conserva a metáfora e não reduz sua amplitude à confiança interior.
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: no nome do Senhor dos Espíritos
  rationale: Mantém o título divino característico das Parábolas de Enoque e a construção de dependência em relação ao nome.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Equivalente português corrente e solene para o idiomatismo de perpetuidade.
theological_decisions:
- issue: Função das medidas e cordas em relação aos justos
  choice: O texto identifica as medidas e cordas como pertencentes aos justos e afirma que elas virão a eles.
  alternative: Poder-se-ia interpretar as expressões como abundância e depósitos destinados aos justos.
  rationale: A morfologia dos substantivos e o contexto das cordas de medir em 61:1–2 favorecem “medidas” e “cordas”; evita-se transformar a imagem em recursos armazenados.
- issue: Sujeito da oração final e sentido do apoio
  choice: “Eles” é entendido como os justos, que se apoiam no nome divino.
  alternative: Gramaticalmente, o plural pode parecer retomar as medidas e cordas; o verbo também pode ser expresso como “confiar” ou “ser sustentado”.
  rationale: O sentido contextual favorece os justos como aqueles que encontram apoio no nome do Senhor, mas a nota registra a possível ambiguidade sintática e lexical sem convertê-la em afirmação doutrinária exclusiva.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe de ampla legibilidade brasileira. Mantiveram-se a imagem concreta das cordas de medir, o título “Senhor dos Espíritos” e as ambiguidades relevantes do verbo final.
