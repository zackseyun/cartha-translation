base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/002.yaml
  text: And I asked the angel[a], saying, “Why have they taken these cords and gone?” And he said to me[c][b], “They have gone so that they may measure.”
translation:
  language: pt
  text: 'E perguntei ao anjo: “Por que eles pegaram essas cordas e partiram?” Ele me disse: “Eles partiram para medir.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተስአልክዎ
  choice: perguntei
  rationale: Forma narrativa na primeira pessoa; “perguntei” exprime de modo direto e natural a consulta ao intérprete celestial.
- source_word: መላእክ
  choice: ao anjo
  rationale: O singular definido corresponde ao interlocutor celestial já presente no contexto visionário.
- source_word: እንዘ እብሎ
  choice: 'perguntei ao anjo:'
  rationale: A construção introduz a fala. Em português, os dois-pontos evitam o pouco natural “perguntei... dizendo”, sem perder sua função discursiva.
- source_word: ነሡ
  choice: pegaram
  rationale: Forma do verbo ነሥአ, “tomar, pegar”, e não do verbo “levantar-se”; refere-se às cordas mencionadas em seguida.
- source_word: እሎንቱ አኅበለ
  choice: estas cordas
  rationale: O substantivo designa cordas, em continuidade com as cordas compridas de 1 Enoque 61:1; o demonstrativo aponta para esses objetos no contexto imediato.
- source_word: ሖሩ
  choice: partiram
  rationale: Verbo de movimento que pode significar ir ou partir. “Partiram” funciona naturalmente tanto na pergunta quanto na resposta.
- source_word: ከመ ይመጥኑ
  choice: para medir
  rationale: 'A forma verbal é ativa: eles partem com a finalidade de medir. O infinitivo português preserva o propósito sem introduzir um objeto não expresso.'
theological_decisions:
- issue: Objeto e finalidade da ação dos agentes celestiais
  choice: “pegaram estas cordas” e “para medir”
  alternative: “aqueles grupos se levantaram” e “para que fossem medidos”
  rationale: A morfologia e o contexto favorecem o verbo “tomar”, o substantivo “cordas” e a voz ativa “medir”. A tradução não especifica o que será medido, pois o versículo não o declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção participial de introdução à fala foi vertida idiomaticamente por pontuação direta. Conservou-se a repetição de “partiram”, presente no diálogo, e não se acrescentou objeto a “medir”.
