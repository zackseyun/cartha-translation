base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/011.yaml
  text: On that day they shall raise one voice[a], and they shall bless and praise and exalt in the spirit of faith, and in the spirit of wisdom, and in the spirit of patience, and in the spirit of mercy, and in the spirit of righteousness and peace, and in the spirit of goodness; and all of them shall say with one voice, ‘Blessed be he[e][d][c][b], and blessed be the name of the Lord of Spirits forever and ever.’
translation:
  language: pt
  text: 'Naquele dia, eles erguerão uma só voz e bendirão, louvarão e exaltarão no espírito de fé[a], no espírito de sabedoria, no espírito de paciência, no espírito de misericórdia, no espírito de justiça e paz e no espírito de bondade[b][c]. E todos dirão a uma só voz: “Bendito é ele, e bendito seja o nome do Senhor dos Espíritos para todo o sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no espírito de fidelidade”; o termo ge'ez pode indicar tanto fé como fidelidade.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “benevolência” ou “bondade compassiva”; o termo ge'ez tem sentido amplo.
    reason: lexical_alternative
  - marker: c
    text: A expressão repetida “espírito de...” foi mantida de modo transparente. Ela pode indicar a disposição de quem louva, qualidades concedidas por Deus ou dons celestes mais personificados.
    reason: alternative_reading
lexical_decisions:
- source_word: ይነሥኡ አሐደ ቃለ
  choice: erguerão uma só voz
  rationale: Preserva o idioma coletivo e litúrgico de levantar a voz, bem como a unidade da aclamação.
- source_word: ወይባርኩ ወይሴብሑ ወያሌዕሉ
  choice: bendirão, louvarão e exaltarão
  rationale: Mantém distintos e cumulativos os três verbos do texto ge'ez.
- source_word: በመንፈሰ ሃይማኖት
  choice: no espírito de fé
  rationale: Reproduz a fórmula preposicional repetida; ሃይማኖት pode significar fé ou fidelidade, alternativa registrada em nota.
- source_word: በመንፈሰ ትዕግሥት
  choice: no espírito de paciência
  rationale: É uma formulação natural em português, embora o termo também possa abranger perseverança e constância.
- source_word: በመንፈሰ ምሕረት
  choice: no espírito de misericórdia
  rationale: Conserva o registro moral e teológico do substantivo.
- source_word: በመንፈሰ ጽድቅ ወሰላም
  choice: no espírito de justiça e paz
  rationale: Preserva ambas as virtudes sob uma única ocorrência de 'espírito'; 'justiça' comunica naturalmente o campo semântico de ጽድቅ em português.
- source_word: መንፈሰ ኂሩት
  choice: no espírito de bondade
  rationale: Bondade conserva melhor a amplitude de ኂሩት do que a opção mais estreita 'generosidade'.
- source_word: ቡሩክ ወይትባረክ
  choice: Bendito seja ele, e bendito seja
  rationale: Expressa naturalmente a fórmula de bênção em português. O pronome é suprido para explicitar o referente implícito da primeira expressão.
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: o nome do Senhor dos Espíritos
  rationale: Mantém o título característico desta seção de 1 Enoque.
- source_word: ለዓለም ወእስከ ለዓለም
  choice: para todo o sempre
  rationale: Equivalente doxológico corrente e solene em português.
theological_decisions:
- issue: Sentido das expressões repetidas 'espírito de...'
  choice: Preservar literalmente a fórmula, sem definir se descreve uma disposição, dons concedidos ou realidades celestes personificadas.
  alternative: Interpretá-las explicitamente como virtudes interiores ou como espíritos celestes distintos.
  rationale: O ge'ez permite mais de uma compreensão, e a tradução não deve resolver uma tensão metafísica que o texto deixa aberta.
- issue: Referente da primeira fórmula de bênção
  choice: Suprir 'ele', entendendo a aclamação como referente ao Senhor dos Espíritos, seguida da bênção de seu nome.
  alternative: Entender a primeira expressão como exclamação sem referente explícito ou como referência antecipada ao nome.
  rationale: A sequência imediata favorece a referência ao Senhor dos Espíritos, mas o pronome não está expresso no ge'ez.
translation_notes:
  register: Português moderno, solene e acessível, com cadência litúrgica. A repetição de “no espírito de” foi conservada para refletir a estrutura do ge'ez, sem tornar a frase artificial.
