base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/012.yaml
  text: All who do not sleep in the heights of heaven shall bless him[a]; all the holy ones who are in heaven shall bless him, and all the chosen ones who dwell in the garden of life; and every spirit of light that is able to bless and glorify and exalt and sanctify your blessed name[d][c][b]; and all flesh shall exceedingly and with power praise and bless your name forever and ever.
translation:
  language: pt
  text: Todos os que não dormem nas alturas do céu o bendirão[a]; todos os santos que estão no céu o bendirão, assim como todos os escolhidos que habitam no jardim da vida e todo espírito de luz capaz de bendizer, glorificar, exaltar e santificar o teu nome bendito; e toda carne louvará e bendirá, sobremaneira e com poder, o teu nome para todo o sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Os que não dormem” provavelmente são seres celestes que permanecem despertos em contínua assistência, e não apenas seres humanos vigilantes. O original diz “o bendirão”, passando depois à forma direta “teu nome”.
    reason: cultural_note
  - marker: b
    text: Literalmente, “para a era da era”, fórmula que expressa duração perpétua. A formulação etíope traduzida por “sobremaneira e com poder” é difícil, mas é entendida aqui como qualificando “louvará e bendirá”.
    reason: translation_note
lexical_decisions:
- source_word: ይባርክዎ / ትባርክ
  choice: o bendirão / bendirá o teu nome
  rationale: Mantém a repetição litúrgica da raiz de bênção e preserva a mudança deliberada do objeto de terceira pessoa (“o”) para a referência de segunda pessoa (“teu nome”).
- source_word: እለ ኢይነውሙ
  choice: os que não dormem
  rationale: Reproduz de modo sóbrio a imagem apocalíptica de seres celestes sempre despertos, sem intensificá-la para “nunca dormem”.
- source_word: በመልዕልተ ሰማይ
  choice: nas alturas do céu
  rationale: Conserva a imagem espacial sem impor um nível cosmológico técnico, como “o mais alto céu”.
- source_word: ቅዱሳን
  choice: santos
  rationale: É a forma portuguesa natural para “os santos”, sem explicitar se são anjos, seres celestes ou justos glorificados.
- source_word: ኅሩያን
  choice: escolhidos
  rationale: Preserva o termo enóquico sem harmonizá-lo com uma formulação doutrinária posterior.
- source_word: ገነት ሕይወት
  choice: jardim da vida
  rationale: Mantém diretamente a imagem edênica e apocalíptica do ge'ez, sem substituí-la pelo termo tradicional “paraíso”.
- source_word: መንፈሰ ብርሃን
  choice: espírito de luz
  rationale: Tradução direta que conserva a imagética cósmica e sua abertura referencial.
- source_word: ዘትክል
  choice: capaz de
  rationale: Expressa capacidade ou aptidão com naturalidade e sem ampliar o sentido.
- source_word: ባርኮተ ወሰብሖተ ወአልዕሎተ ወቀድሶተ
  choice: bendizer, glorificar, exaltar e santificar
  rationale: Preserva os quatro verbos distintos e a cadência doxológica da sequência.
- source_word: ለስምከ ቡሩክ
  choice: o teu nome bendito
  rationale: A construção qualifica naturalmente o nome e mantém a expressão doxológica compacta.
- source_word: ኵሉ ሥጋ
  choice: toda carne
  rationale: Conserva a expressão bíblica e apocalíptica, em vez de generalizá-la como “toda criatura”.
- source_word: '[ዘ]ፈድፋደ እምኃይል'
  choice: sobremaneira e com poder
  rationale: Entende as palavras difíceis como modificadores adverbiais dos verbos seguintes, conforme a sintaxe mais provável, mas registra a dificuldade textual em nota.
- source_word: ትሴብሕ
  choice: louvará
  rationale: Distingue este verbo do anterior traduzido por “glorificar” e representa melhor seu valor de louvor no último membro.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Equivalente português corrente, digno e idiomático para a fórmula de duração perpétua.
theological_decisions:
- issue: Identidade dos “santos” e dos “escolhidos”
  choice: Manter os dois títulos sem identificar seus referentes com precisão.
  alternative: Explicar “santos” exclusivamente como anjos e “escolhidos” exclusivamente como seres humanos redimidos.
  rationale: A visão enumera grupos celestes, mas não estabelece uma distinção ontológica rígida entre eles.
- issue: Mudança de terceira para segunda pessoa
  choice: Preservar “o bendirão” e depois “o teu nome”.
  alternative: 'Harmonizar toda a passagem na segunda pessoa: “te bendirão”.'
  rationale: O sufixo verbal inicial é de terceira pessoa masculina singular, enquanto a passagem posterior se dirige diretamente à personagem por meio de “teu nome”; a tensão pronominal pertence ao texto.
- issue: Imagem de ገነት ሕይወት
  choice: jardim da vida
  alternative: paraíso da vida
  rationale: A forma escolhida segue a imagem concreta do original e evita introduzir associações tradicionais que o termo não exige.
translation_notes:
  register: Português moderno, internacional e solene, com boa legibilidade brasileira. A pontuação preserva o movimento enumerativo e doxológico; termos bíblico-apocalípticos como “toda carne”, “santos” e “escolhidos” foram mantidos sem explicações doutrinárias dentro do texto.
