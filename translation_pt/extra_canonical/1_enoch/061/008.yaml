base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/008.yaml
  text: And the Lord of Spirits seated the Chosen One on the throne of glory[a], and he will judge all the works of the holy ones in the height of heaven[d][c][b], and he will weigh their deeds in the balance.
translation:
  language: pt
  text: E o Senhor dos Espíritos fez o Escolhido[a] sentar-se no trono de glória. Ele julgará todas as obras dos santos[b] no alto do céu e pesará seus atos na balança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “o Eleito”. O termo ge’ez ኅሩይ funciona aqui como título.
    reason: lexical_alternative
  - marker: b
    text: “Os santos” pode designar a comunidade santa, seres celestiais santos ou abranger ambos; o ge’ez não exige uma identificação mais restrita.
    reason: alternative_reading
  - marker: c
    text: 'A balança representa a avaliação judicial dos atos. O verbo ge’ez está na voz ativa: “ele pesará”, e não “serão pesados”.'
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ፡ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Preserva o título divino recorrente em 1 Enoque e seu registro apocalíptico elevado. A construção portuguesa sem artigo antes de “Espíritos” funciona naturalmente como título.
- source_word: መንበረ፡ ስብሐት
  choice: trono de glória
  rationale: Mantém a imagem concreta da entronização e corresponde naturalmente à construção nominal em ge’ez, sem reduzi-la a um simples adjetivo.
- source_word: አንበረ፡ ለኅሩይ
  choice: fez o Escolhido sentar-se
  rationale: Expressa de modo claro a força causativa do verbo (“fez sentar”, “assentou”) e evita que “assentou” seja entendido apenas como “estabeleceu”.
- source_word: ኅሩይ
  choice: o Escolhido
  rationale: Conserva a força titular de uma figura específica no contexto das Parábolas. “O Eleito” seria possível, mas é menos transparente para muitos leitores atuais.
- source_word: ይኴንን
  choice: julgará
  rationale: Reproduz diretamente o sentido judicial e futuro da forma verbal, sem expansão interpretativa.
- source_word: ኵሎ፡ ግብሮሙ
  choice: todas as obras
  rationale: “Obras” conserva o sentido amplo do primeiro substantivo e permite distingui-lo de ምግባሮሙ, traduzido depois como “atos”.
- source_word: ለቅዱሳን
  choice: os santos
  rationale: É uma designação portuguesa concisa que pode abranger humanos santos, seres celestiais santos ou ambos; a nota explicita que o referente não deve ser estreitado.
- source_word: በመልዕልተ፡ ሰማይ
  choice: no alto do céu
  rationale: Preserva a imagem espacial elevada em português corrente e digno, sem transformar a expressão especificamente em “o mais alto céu”.
- source_word: በመዳልው
  choice: na balança
  rationale: Mantém a imagem judicial concreta da pesagem, em vez de substituí-la por uma abstração como “avaliação”.
- source_word: ይደሉ፡ ምግባሮሙ
  choice: pesará seus atos
  rationale: 'A forma verbal é ativa, na terceira pessoa masculina do singular: “ele pesará”. “Atos” diferencia este termo das “obras” da oração anterior e preserva a imagem forense.'
theological_decisions:
- issue: Identidade de ቅዱሳን (“os santos”)
  choice: Manter “os santos” sem identificar o grupo de maneira mais estreita
  alternative: “os justos”, “os anjos santos” ou “a comunidade santa”
  rationale: O termo pode designar seres humanos santos, seres celestiais santos ou incluir ambos. O versículo não exige uma identificação única.
- issue: Valor titular de ኅሩይ
  choice: “o Escolhido” como título definido
  alternative: “o Eleito” ou “um escolhido”
  rationale: A entronização e a função judicial apontam para uma figura específica e reconhecida no contexto, não para um indivíduo indefinido.
- issue: Sujeito de “pesará”
  choice: Conservar a oração ativa com “Ele” como sujeito continuado
  alternative: “seus atos serão pesados”
  rationale: O verbo ge’ez está na terceira pessoa masculina singular ativa. A tradução não deve convertê-lo em passivo nem ocultar o papel pessoal do juiz.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A redação preserva a imagem da entronização, o título “Escolhido”, a ambiguidade de “os santos” e a ação pessoal de pesar os atos.
