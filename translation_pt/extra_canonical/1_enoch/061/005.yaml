base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/005.yaml
  text: And these measures shall reveal all the hidden things in the depth of the earth[a], and those who were destroyed in the wilderness, and those who were devoured by wild beasts, and those who were devoured by the fish of the sea, so that they may return and be supported on the day of the Chosen One; for none shall perish before the Lord of Spirits[d][c][b], and none can perish.
translation:
  language: pt
  text: E essas medidas revelarão tudo o que está oculto nas profundezas da terra, bem como os que foram destruídos no deserto, os que foram devorados por animais selvagens e os que foram devorados pelos peixes do mar, para que retornem e sejam amparados[a] no dia do Escolhido[b]; pois ninguém perecerá diante do Senhor dos Espíritos, e ninguém pode perecer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo ge'ez é difícil neste contexto. Também pode ser traduzido por “sejam sustentados”, “sejam fortalecidos” ou, possivelmente, “sejam reunidos”.
    reason: lexical_alternative
  - marker: b
    text: “O Escolhido” é um título usado nas Parábolas para a figura escatológica associada ao julgamento e à vindicação.
    reason: cross_reference
  - marker: c
    text: A cláusula final é condensada no ge'ez e repete a ideia de perecer ou ser destruído. A tradução conserva essa formulação enfática sem explicitar mais do que o texto.
    reason: textual_difficulty
lexical_decisions:
- source_word: እሉ፡ እምጣን
  choice: essas medidas
  rationale: Mantém o demonstrativo e o substantivo explícito እምጣን, retomando as medidas mencionadas no contexto anterior.
- source_word: ይከሥቱ
  choice: revelarão
  rationale: Expressa a ação futura da visão apocalíptica e a manifestação daquilo que estava oculto.
- source_word: ኵሎ፡ ኅቡኣተ፡ ለዕመቀ፡ ምድር
  choice: tudo o que está oculto nas profundezas da terra
  rationale: A formulação portuguesa é natural e conserva a imagem do que se encontra escondido no profundo da terra.
- source_word: ተኃጕሉ፡ እምበድው
  choice: foram destruídos no deserto
  rationale: Preserva o caráter violento da morte e traduz በድው por um termo corrente e adequado ao cenário.
- source_word: እምአራዊት
  choice: por animais selvagens
  rationale: Comunica com clareza a referência a feras sem recorrer a linguagem arcaica.
- source_word: እምዓሣ፡ ባሕር
  choice: pelos peixes do mar
  rationale: Mantém a formulação cumulativa e concreta do texto ge'ez.
- source_word: ከመ፡ ይግብኡ
  choice: para que retornem
  rationale: Conserva a relação de finalidade e a imagem de restauração ou retorno, sem explicitar além do texto o modo desse retorno.
- source_word: ይትመረጐዙ
  choice: sejam amparados
  rationale: O verbo é difícil; 'amparados' preserva a ideia possível de sustentação sem decidir entre fortalecimento, apoio e reunião.
- source_word: በዕለተ፡ ኅሩይ
  choice: no dia do Escolhido
  rationale: Conserva como título a designação singular da figura escatológica própria das Parábolas.
- source_word: እግዚአ፡ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém o título divino característico da obra e sua forma tradicional em português.
- source_word: አልቦቱ፡ ዘይትኃጐል ... ወአልቦ፡ ዘይክል፡ ተኃጕሎተ
  choice: ninguém perecerá ... e ninguém pode perecer
  rationale: Reproduz a repetição enfática e a formulação comprimida do ge'ez, evitando resolver plenamente a tensão da cláusula final.
theological_decisions:
- issue: Sentido da restauração dos mortos dispersos
  choice: Traduzir a sequência como retorno e amparo daqueles que morreram em lugares ou condições que tornariam seus restos inacessíveis.
  alternative: Entender a passagem apenas como exposição de restos ocultos para julgamento ou como reunião de sobreviventes.
  rationale: A enumeração dos devorados e destruídos, seguida de 'retornem' e da negação de que alguém pereça diante do Senhor dos Espíritos, favorece uma imagem de restauração escatológica, sem exigir que a tradução acrescente explicitamente 'ressurreição'.
- issue: Título ኅሩይ
  choice: Escolhido
  alternative: Eleito
  rationale: '''Escolhido'' é claro, atual e preserva a força titular local sem impor uma harmonização denominacional.'
- issue: Alcance da negação final
  choice: 'Preservar a declaração absoluta e repetida: ''ninguém perecerá ... e ninguém pode perecer''.'
  alternative: Parafrasear como 'ninguém poderá permanecer perdido na presença do Senhor dos Espíritos'.
  rationale: A sintaxe final é compacta; a tradução mantém sua tensão e evita definir se a afirmação se refere especificamente aos mortos enumerados ou possui alcance mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação extensa conserva o ritmo enumerativo apocalíptico. Preferiu-se 'animais selvagens' a 'feras' e 'amparados' a uma solução mais técnica. Todos os marcadores de nota aparecem no texto principal.
