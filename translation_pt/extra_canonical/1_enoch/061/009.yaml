base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/009.yaml
  text: And when he lifts up his face to judge their hidden ways by the word of the name of the Lord of Spirits[a], and their conduct by the path of righteousness of the Lord of Spirits, then all of them will speak with one voice[d][c][b], and they will bless and praise and exalt and sanctify the name of the Lord of Spirits.
translation:
  language: pt
  text: E quando ele erguer o rosto para julgar os caminhos ocultos deles pela palavra do nome do Senhor dos Espíritos[a], e os passos deles pelo caminho de justiça do Senhor dos Espíritos[b], então todos falarão a uma só voz, e bendirão, louvarão, exaltarão e santificarão o nome do Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge'ez traduzida por “pela palavra do nome” é difícil. Pode indicar a palavra, a declaração, a ordem ou a autoridade associada ao nome divino.
    reason: alternative_reading
  - marker: b
    text: “Os passos deles” também pode ter o sentido de “a conduta deles” ou “o rastro deles”. A expressão é um segundo objeto de “julgar”, em paralelo com “os caminhos ocultos deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ያሌዕል ገጾ
  choice: ele erguer o rosto
  rationale: Preserva a imagem corporal e solene do ge'ez, sem reduzi-la a um simples olhar ou aparecimento.
- source_word: ይኰንን
  choice: julgar
  rationale: O contexto favorece a ação judicial, sem especificar indevidamente condenação.
- source_word: ፍኖቶሙ እንተ ኅቡእ
  choice: os caminhos ocultos deles
  rationale: Mantém a metáfora moral do caminho e a ideia de algo encoberto que é submetido a juízo.
- source_word: በነገረ ስሙ
  choice: pela palavra do nome
  rationale: Segue de perto a construção difícil do ge'ez e conserva sua associação solene com a autoridade do nome divino.
- source_word: አሰረ ዚአሆሙ
  choice: os passos deles
  rationale: Trata corretamente a expressão como sintagma nominal paralelo a 'os caminhos ocultos deles', e não como verbo; 'passos' preserva a imagem de pegadas ou curso de vida.
- source_word: በፍኖተ ጽድቅ
  choice: pelo caminho de justiça
  rationale: Conserva a metáfora do caminho e permite que justiça inclua retidão moral e padrão judicial, sem estreitar o sentido.
- source_word: በ፩ቃል
  choice: a uma só voz
  rationale: Expressa naturalmente em português a aclamação unânime indicada literalmente por 'uma palavra/voz'.
- source_word: ይባርኩ ወይሴብሑ ወያሌዕሉ ወይቄድሱ
  choice: bendirão, louvarão, exaltarão e santificarão
  rationale: Retém sem compressão a sequência quádrupla de louvor característica do estilo.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém de modo consistente o título divino distintivo de 1 Enoque.
theological_decisions:
- issue: Referente dos verbos no singular
  choice: Manter 'ele' sem identificar explicitamente o referente.
  alternative: Identificá-lo como o Senhor dos Espíritos ou como o Eleito/Filho do Homem.
  rationale: O verso apresenta ação verbal no singular, mas não repete o sujeito; identificá-lo resolveria uma ambiguidade contextual e teológica que o texto preserva.
- issue: Sentido de 'pela palavra do nome do Senhor dos Espíritos'
  choice: Conservar uma formulação instrumental e transparente.
  alternative: Traduzir como 'por ordem do Senhor dos Espíritos' ou 'pela autoridade de seu nome'.
  rationale: A construção ge'ez é difícil e pode envolver palavra, declaração, ordem ou autoridade associada ao nome divino; a tradução não deve selecionar silenciosamente apenas uma dessas possibilidades.
- issue: Relação sintática de 'os passos deles'
  choice: Entender a expressão como segundo objeto de 'julgar', em paralelo com 'os caminhos ocultos deles'.
  alternative: 'Ler como uma ação verbal: ''e ele os põe no caminho de justiça''.'
  rationale: A forma ge'ez é mais bem analisada como substantivo no acusativo seguido de possessivo independente, não como verbo com pronome objeto.
translation_notes:
  register: Português moderno, solene e acessível, com ordem sintática moderadamente formal para preservar o paralelismo apocalíptico. A repetição do título divino e os quatro verbos de louvor foram mantidos deliberadamente.
