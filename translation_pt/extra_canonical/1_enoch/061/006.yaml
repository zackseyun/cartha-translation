base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/006.yaml
  text: And all those in the height of heaven received a command[a], and power, and a voice[c][b], and light like fire.
translation:
  language: pt
  text: E todos os que estavam nas alturas do céu receberam uma ordem, poder, voz e luz como fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A parte final deste testemunho etíope é difícil. Outra análise possível é: “e o poder e a voz da luz eram como fogo”; “luz” também pode ser traduzida por “claridade” ou “resplendor”.'
    reason: textual_variant
lexical_decisions:
- source_word: ወነሥኡ
  choice: receberam
  rationale: O verbo pode significar “tomar” ou “receber”; com “ordem” e os demais objetos coordenados, “receberam” expressa naturalmente o sentido contextual.
- source_word: ትእዛዘ
  choice: uma ordem
  rationale: O substantivo indica uma determinação dotada de autoridade. “Ordem” mantém o registro solene e é mais natural neste contexto do que “instrução”.
- source_word: እለ በ‘መልዕልተ ሰማይ ኵሎሙ
  choice: todos os que estavam nas alturas do céu
  rationale: A expressão identifica coletivamente seres situados na região elevada do céu sem especificar uma ordem angelical. “Nas alturas do céu” conserva a imagem espacial e evita transformar a expressão, sem necessidade, em um superlativo absoluto.
- source_word: ኃይለ
  choice: poder
  rationale: O termo designa força ou capacidade. “Poder” é claro, digno e permite que o contexto determine se se trata de força própria ou concedida.
- source_word: ቃለ
  choice: voz
  rationale: O substantivo pode indicar voz, palavra ou som. “Voz” corresponde bem à linguagem visionária e não acrescenta um conteúdo verbal ausente do texto.
- source_word: ብርሃነ
  choice: luz
  rationale: O termo admite “luz”, “claridade” ou “resplendor”. “Luz” é a opção mais direta, enquanto a dificuldade desta parte do testemunho é registrada em nota.
- source_word: ከመ እሳት
  choice: como fogo
  rationale: A tradução preserva diretamente a comparação e deixa sua força imagética intacta, sem explicar a natureza do fogo.
theological_decisions:
- issue: Identidade dos que estavam nas alturas do céu
  choice: Referência geral a seres celestiais
  alternative: Uma ordem angelical específica ou, coletivamente, os exércitos celestes
  rationale: O versículo não nomeia uma classe específica. A formulação ampla evita introduzir uma hierarquia angelológica que o texto não explicita.
- issue: Relação sintática entre poder, voz e luz
  choice: Tratados como objetos coordenados do verbo “receberam”
  alternative: 'Entender “o poder e a voz da luz” como sujeito de uma nova oração: “eram como fogo”'
  rationale: As formas etíopes favorecem a leitura dos substantivos como objetos coordenados, mas a dificuldade textual e a análise alternativa são preservadas em nota.
translation_notes:
  register: Português moderno, solene e acessível, com coordenação simples para reproduzir o ritmo cumulativo do texto. O referente celestial permanece deliberadamente amplo, e a nota conserva a incerteza da parte final.
