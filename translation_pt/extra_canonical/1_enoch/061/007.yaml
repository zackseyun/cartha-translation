base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/007.yaml
  text: And to him belongs the first word[a]; they shall bless and exalt and praise with wisdom[c][b], and they shall be wise in speech and in the spirit of life.
translation:
  language: pt
  text: E a ele pertence a primeira palavra[a]; eles bendirão, exaltarão e louvarão com sabedoria[b], e serão sábios na fala e no espírito de vida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o início do discurso”. A expressão ge’ez መቅድመ ቃለ também pode ter esse sentido.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “em sabedoria”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “no sopro de vida”. Nesta expressão, o termo ge’ez pode significar tanto “espírito” como “sopro”.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ወለዉእቱ፡ መቅድመ፡ ቃለ
  choice: E a ele pertence a primeira palavra
  rationale: ወለዉእቱ significa “e a ele”, enquanto መቅድመ ቃለ forma uma expressão construta, “a primeira palavra” ou “o início do discurso”. O verbo “pertence” é suprido em português para tornar explícita a relação nominal sem transformar መቅድመ em preposição.
- source_word: ይባርኩ
  choice: bendirão
  rationale: Preserva o sentido doxológico do verbo e se integra naturalmente à sequência de ações futuras.
- source_word: ያሌዕሉ
  choice: exaltarão
  rationale: Expressa a ideia de elevar ou engrandecer e mantém o registro solene da tríade.
- source_word: ይሴብሑ
  choice: louvarão
  rationale: É a equivalência portuguesa direta e corrente para o verbo doxológico.
- source_word: በጥበብ
  choice: com sabedoria
  rationale: Mantém o substantivo “sabedoria” e comunica de modo natural a maneira pela qual se realiza o louvor.
- source_word: ይጠብቡ
  choice: serão sábios
  rationale: Preserva a ligação lexical com ጥበብ, “sabedoria”, em vez de reduzir o verbo a uma formulação apenas adverbial.
- source_word: በነገር
  choice: na fala
  rationale: Neste contexto, ነገር é entendido como fala ou discurso. “Na fala” distingue este lexema de ቃለ, anteriormente traduzido por “palavra”.
- source_word: መንፈሰ፡ ሕይወት
  choice: espírito de vida
  rationale: Conserva o registro religioso e apocalíptico, sem apagar na nota a possibilidade concreta de “sopro de vida”.
theological_decisions:
- issue: Se መንፈሰ ሕይወት deve ser entendido como “espírito de vida” ou “sopro de vida”
  choice: espírito de vida
  alternative: sopro de vida
  rationale: O contexto de louvor celestial favorece a formulação elevada “espírito de vida”, mas o campo semântico de መንፈስ inclui “sopro”; por isso, a alternativa é preservada em nota, sem resolver indevidamente a tensão.
- issue: Sentido e sintaxe de መቅድመ ቃለ
  choice: a primeira palavra
  alternative: o início do discurso
  rationale: A construção é tratada como expressão nominal pertencente a “ele”, e não como “diante dele” nem como indicação de que se bendiz “com a voz”. A alternativa registra a amplitude semântica da expressão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A coordenação verbal reproduz o ritmo doxológico do ge’ez; “na fala” é corrente sem ser coloquial, e as notas preservam as ambiguidades lexicais relevantes.
