base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/010.yaml
  text: And all the hosts of the heavens shall cry out[a], and all the holy ones above, and the host of the Lord—the Keruben, the Seraphen, and the Ophannin—and all the angels of power, and all the angels of principalities, and the Chosen One[d][c][b], and the other powers that are on the dry land and over the water.
translation:
  language: pt
  text: E clamarão todos os exércitos dos céus[a], e todos os santos que estão nas alturas, e o exército do Senhor — os Keruben, os Serafen e os Ofannin[b] —, e todos os anjos de poder, e todos os anjos dos principados[c], e o Escolhido, e os outros poderes que estão na terra seca e sobre as águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «chamarão em alta voz»; o verbo ge'ez indica um clamor ou chamado vocal.
    reason: lexical_alternative
  - marker: b
    text: «Ofannin» é o nome transliterado de uma ordem celestial; alguns o interpretam como «rodas», por associação com as visões do trono.
    reason: lexical_alternative
  - marker: c
    text: «Anjos dos principados» também pode ser traduzido como «anjos dos domínios» ou «anjos das autoridades»; a expressão se refere a ordens governantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይጼውዑ
  choice: clamarão
  rationale: O verbo indica chamar ou clamar em voz alta. «Clamarão» conserva a manifestação vocal sem confundi-la com o idioma distinto «levantar a voz», empregado no versículo seguinte.
- source_word: ኵሉ ኃይለ ሰማያት
  choice: todos os exércitos dos céus
  rationale: Neste catálogo de seres celestes, ኃይል tem sentido coletivo de hostes ou exércitos; «exércitos» é claro em português e mantém a imagem cósmica.
- source_word: ቅዱሳን በመልዕልተ
  choice: todos os santos que estão nas alturas
  rationale: A expressão designa seres santos celestes. A oração relativa torna o sentido espacial natural em português, sem identificar esses seres com santos humanos.
- source_word: ኃይለ እግዚአብሔር
  choice: o exército do Senhor
  rationale: O contexto favorece um coletivo celestial pertencente ao Senhor, não o atributo abstrato de poder.
- source_word: ኪሩቤን / ሱራፌን / እፋኒን
  choice: Keruben, Serafen e Ofannin
  rationale: As formas são transliteradas a partir do testemunho ge'ez, com adaptação ortográfica mínima para leitura portuguesa, evitando substituí-las pelas formas tradicionais derivadas do hebraico ou interpretar Ofannin como «rodas».
- source_word: መላእክተ ኃይል
  choice: anjos de poder
  rationale: A formulação nominal preserva o caráter titular e ordenado da classe angélica.
- source_word: መላእክተ አጋእዝት
  choice: anjos dos principados
  rationale: O termo sugere ordens governantes ou graus de autoridade; «principados» conserva esse sentido sem especificar além da fonte.
- source_word: ኅሩይ
  choice: o Escolhido
  rationale: No contexto das Parábolas, a palavra funciona como título da figura escatológica singular; a inicial maiúscula sinaliza o uso titular sem impor identificação doutrinária posterior.
- source_word: ካእአ ኃይል
  choice: os outros poderes
  rationale: A expressão introduz um grupo adicional, mas permanece semanticamente ampla; «poderes» conserva essa indeterminação.
- source_word: እለ ውስተ የብስ ወዲበ ማይ
  choice: que estão em terra seca e sobre as águas
  rationale: የብስ denota especificamente terra seca em contraste com água; o plural «águas» soa natural no registro cósmico e não altera a oposição espacial.
theological_decisions:
- issue: Se ኅሩይ é título de uma figura escatológica singular ou simples adjetivo dentro da enumeração
  choice: o Escolhido
  alternative: o escolhido; o Eleito
  rationale: O emprego recorrente nas Parábolas favorece a leitura titular. Mantém-se, porém, o título sem identificar explicitamente a figura com personagem posterior.
- issue: Como representar as classes celestes nomeadas sem assimilá-las à angelologia tradicional posterior
  choice: Keruben, Serafen e Ofannin
  alternative: querubins, serafins e rodas; Querubim, Serafim e Ofanim
  rationale: A transliteração conserva a forma e a estranheza do testemunho ge'ez, enquanto a nota explica apenas a possível associação interpretativa de Ofannin.
translation_notes:
  register: Português moderno, solene e legível, com sintaxe de enumeração preservada. O verbo foi colocado no início, acompanhando a ordem ge'ez e evitando que o leitor espere até o fim da longa lista. As formas celestes foram transliteradas do ge'ez, e as ambiguidades lexicais relevantes foram mantidas em notas.
