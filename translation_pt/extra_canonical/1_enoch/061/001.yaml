base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/001.yaml
  text: And I saw in those days that long cords were given to those angels[a], and they took for themselves wings and flew[b], and they went toward the north.
translation:
  language: pt
  text: E vi, naqueles dias, que foram dadas cordas compridas[a] àqueles anjos[b]; eles tomaram para si asas, voaram e seguiram em direção ao norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão em ge’ez traduzida como “cordas compridas” também pode ser entendida mais especificamente como “cordas longas” ou, possivelmente, “cordas de medir”.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida como “àqueles anjos” também pode ser entendida como “aos outros anjos”, conforme o valor atribuído ao demonstrativo.
    reason: alternative_reading
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: Preserva a fórmula visionária em primeira pessoa de modo claro, natural e digno.
- source_word: በእማንቱ መዋዕል
  choice: naqueles dias
  rationale: Mantém a fórmula temporal apocalíptica recorrente e seu registro elevado.
- source_word: ተውህበ
  choice: foram dadas
  rationale: Reproduz a construção passiva; o plural concorda naturalmente com “cordas” em português.
- source_word: ለአልእቱ መላእክት
  choice: àqueles anjos
  rationale: “Anjos” é o sentido contextual de መላእክት, enquanto “aqueles” evita impor uma distinção específica entre grupos.
- source_word: አሕባል ነዋኃን
  choice: cordas compridas
  rationale: Conserva a imagem concreta e a ideia de extensão sem acrescentar a função de medir, que não é explícita.
- source_word: ወነሡአ ሎሙ ክንፈ
  choice: eles tomaram para si asas
  rationale: Preserva a nuance reflexiva de ሎሙ e verte naturalmente o uso coletivo de “asa”.
- source_word: ወሰረሩ
  choice: voaram
  rationale: É a equivalência mais direta e natural no contexto imediato de tomarem asas.
- source_word: ወሖሩ ሰመንገለ መስዕ
  choice: seguiram em direção ao norte
  rationale: Expressa movimento direcional sem afirmar necessariamente que o norte era o destino final.
theological_decisions:
- issue: Identidade dos anjos
  choice: àqueles anjos
  alternative: aos outros anjos
  rationale: O versículo não identifica mais precisamente o grupo. A formulação escolhida preserva essa indeterminação e não introduz uma classe específica de anjos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação narrativa conserva o ritmo visionário do ge’ez sem rigidez excessiva.
