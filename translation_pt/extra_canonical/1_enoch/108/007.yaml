base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/007.yaml
  text: For there are writings and records concerning them in heaven above[a], so that the angels may read them and know what will come upon the sinners, and upon the humble in spirit, and upon those who afflicted their bodies and received recompense from God[d][c][b], and those who were put to shame by evil men.
translation:
  language: pt
  text: Pois há, a respeito deles, escritos e registros[a] no céu acima, para que os anjos os leiam e saibam o que sobrevirá aos pecadores, aos espíritos humildes[b], aos que afligiram os seus corpos e receberam de Deus a recompensa, e aos que foram desprezados por homens maus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “escritos e registros” é difícil. O segundo termo pode também ser relacionado a “males” ou “coisas más”; “registros” foi adotado porque a oração seguinte diz que os anjos os leem.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “espíritos humildes”; também se pode entender “almas humildes”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “censurados” ou “humilhados por homens maus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽሑፋን ወእኩያን
  choice: escritos e registros
  rationale: O primeiro termo designa materiais escritos. O segundo é lexicalmente difícil, mas o contexto de objetos que os anjos leem favorece o sentido de registros celestes, sem especificá-los como livros de juízo.
- source_word: ላዕለ በሰማይ
  choice: no alto, no céu
  rationale: Conserva os dois elementos locativos e o tom apocalíptico, com ordem natural em português.
- source_word: መናፍስት ትኁታን
  choice: espíritos humildes
  rationale: Reproduz diretamente a construção substantivo-adjetivo do ge'ez e preserva a referência a espíritos como entidades, em vez de transformá-la apenas numa disposição interior.
- source_word: እለ አሕመሙ ሥጋሆሙ
  choice: os que afligiram o próprio corpo
  rationale: Mantém a intensidade do sofrimento ou da privação corporal sem definir se se trata especificamente de ascetismo voluntário.
- source_word: ወተፈድዩ በኀበ አምላክ
  choice: e receberam de Deus a recompensa
  rationale: Expressa a ideia de retribuição divina; o contexto favorece recompensa e vindicação, embora o vocábulo pertença ao campo mais amplo da paga ou retribuição.
- source_word: እለ ኀሥሡ እምእኩያን ሰብእ
  choice: os que foram desprezados por homens maus
  rationale: Transmite de modo natural a hostilidade sofrida, mantendo na nota as possibilidades próximas de serem censurados ou humilhados.
theological_decisions:
- issue: Natureza dos itens escritos no céu
  choice: Registros celestes que os anjos leem
  alternative: Escritos sobre males ou, mais especificamente, livros judiciais
  rationale: A oração de finalidade liga diretamente esses itens à leitura pelos anjos e ao conhecimento do destino dos grupos mencionados; isso favorece a imagem documental sem determinar uma categoria específica de livro celeste.
- issue: Identidade de መናፍስት ትኁታን
  choice: espíritos humildes
  alternative: humildes de espírito ou almas humildes
  rationale: A concordância nominal do ge'ez sustenta literalmente 'espíritos humildes'. Essa forma também preserva o possível contraste escatológico com outros espíritos, sem reduzir a expressão a uma qualidade psicológica.
- issue: Sentido da recompensa divina
  choice: Recompensa ou vindicação positiva
  alternative: Retribuição em sentido neutro, ou paga por mortificação ascética
  rationale: Os grupos associados aos pecadores passam a ser pessoas humildes ou maltratadas; por isso, o contexto favorece uma resposta divina positiva, sem importar uma doutrina posterior de ascetismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe conserva a longa enumeração apocalíptica do original, enquanto a pontuação esclarece as relações entre os grupos mencionados.
