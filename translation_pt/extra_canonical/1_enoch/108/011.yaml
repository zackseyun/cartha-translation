base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/011.yaml
  text: And now I will summon the spirits of the good ones from the generation of light, and I will transform those who were born in darkness[c][b][a], who in their flesh were not repaid with honor as their faith deserved.
translation:
  language: pt
  text: E agora convocarei os espíritos dos bons da geração da luz e transformarei os que nasceram nas trevas[b], os quais, em sua carne, não foram recompensados com a honra que sua fé merecia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que sua fidelidade merecia”. O termo geʿez pode indicar tanto fé quanto fidelidade perseverante.'
    reason: lexical_alternative
  - marker: b
    text: 'O verbo traduzido por “transformarei” é difícil. Também pode envolver uma imagem mais específica: “farei brilhar” ou “iluminarei”.'
    reason: textual_variant
lexical_decisions:
- source_word: እጼውዕ
  choice: convocarei
  rationale: Expressa um chamado solene e preserva o futuro do imperfeito no quadro escatológico.
- source_word: መናፍስቲሆሙ ለኄራን
  choice: os espíritos dos bons
  rationale: Reflete a construção do sufixo pronominal antecipatório seguido de la- como genitivo definido, evitando lê-la como pronome independente e aposto.
- source_word: እምትውልድ እንተ ብርሃን
  choice: da geração da luz
  rationale: Mantém a imagem apocalíptica de origem ou pertencimento, em contraste com o nascimento nas trevas.
- source_word: እዊልጥ
  choice: transformarei
  rationale: O verbo é difícil; esta opção comunica a mudança ou reversão operada sem restringi-la à imagem mais específica de iluminação.
- source_word: ተወልዱ በጽልመት
  choice: nasceram nas trevas
  rationale: Reprodução direta e natural do contraste simbólico entre luz e trevas.
- source_word: በሥጋሆሙ
  choice: em sua carne
  rationale: Preserva a linguagem corporal e mortal do texto sem impor uma distinção antropológica posterior.
- source_word: ኢተፈደዩ ክብር
  choice: não foram recompensados com a honra
  rationale: Conserva a noção de retribuição devida, expressa por meio de honra.
- source_word: ከመ ይደሉ ለሃይማኖቶሙ
  choice: que sua fé merecia
  rationale: Formula em português natural a ideia de honra devida ou adequada à fé deles; a possibilidade de fidelidade é mantida em nota.
theological_decisions:
- issue: Sentido de ሃይማኖት no contexto ético-apocalíptico
  choice: fé
  alternative: fidelidade
  rationale: “Fé” mantém o sentido amplo e não elimina a dimensão de confiança ou crença; “fidelidade”, igualmente possível, fica registrada em nota.
- issue: Relação entre “os bons, da geração da luz” e “os que nasceram nas trevas”
  choice: Preservar a sequência sintática sem declarar explicitamente se são exatamente o mesmo grupo
  alternative: Interpretá-los como um único grupo sob a imagem de reversão, ou como dois grupos distintos
  rationale: Embora a leitura de reversão seja plausível, a sintaxe não exige que a tradução resolva definitivamente a identidade dos grupos.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Os bons” foi mantido por proximidade lexical, em vez do termo teologicamente mais técnico “os justos”. A pontuação acompanha a leitura genitiva de “os espíritos dos bons” e conserva a possível ambiguidade quanto à relação entre os grupos.
