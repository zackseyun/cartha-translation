base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/004.yaml
  text: And there I saw something like an invisible cloud[a], for because of its depth I was unable to look upon it; and I saw a flame of fire burning gloriously[d][c][b], and something like glorious mountains was circling and moving this way and that way.
translation:
  language: pt
  text: Ali vi algo semelhante a uma nuvem invisível[a], pois, por causa de sua profundidade, não consegui contemplá-la[b]. Vi também uma chama de fogo que ardia gloriosamente; e coisas semelhantes a montanhas gloriosas giravam e se moviam de um lado para outro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma nuvem que não é vista”. A expressão preserva o caráter paradoxal da visão.
    reason: lexical_alternative
  - marker: b
    text: 'Este trecho é textualmente difícil. O ge''ez preservado também pode ser entendido como: “pois, de sua profundidade, consegui olhar acima de sua extensão [ou aparência]”.'
    reason: textual_variant
  - marker: c
    text: 'Ou: “giravam e eram agitadas de um lado para outro”. Os verbos no ge''ez estão no plural e descrevem movimento repetido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ በህየ
  choice: Ali vi
  rationale: Mantém o relato visionário em primeira pessoa e expressa com naturalidade o advérbio locativo.
- source_word: ከመ ደመና ዘኢይትረአይ
  choice: algo semelhante a uma nuvem invisível
  rationale: ከመ introduz comparação, não identidade; a formulação conserva o paradoxo visionário de algo visto que é descrito como invisível.
- source_word: እምዕሙቁ
  choice: por causa de sua profundidade
  rationale: Expressa a ideia de profundidade e, no contexto da leitura adotada, sua função causal.
- source_word: ላህበ እሳት
  choice: uma chama de fogo
  rationale: Preserva a expressão semítica enfática, em vez de reduzi-la simplesmente a “fogo”.
- source_word: እንዘ ይነድድ ስቡሕ
  choice: que ardia gloriosamente
  rationale: Reproduz o aspecto contínuo do incêndio e o vocabulário de glória ou esplendor sem restringi-lo apenas a brilho físico.
- source_word: ከመ አድባር ስቡሓን
  choice: coisas semelhantes a montanhas gloriosas
  rationale: “Coisas” explicita com cautela as entidades visionárias comparadas a montanhas; o plural concorda com os verbos seguintes.
- source_word: ይትከበቡ
  choice: giravam
  rationale: O verbo plural pode descrever movimento circular sem exigir um objeto expresso.
- source_word: ይትሀወኩ ለፌ ወለፌ
  choice: se moviam de um lado para outro
  rationale: Comunica o movimento repetido e alternado de maneira clara em português atual.
theological_decisions:
- issue: O paradoxo de uma nuvem vista, mas descrita como invisível
  choice: algo semelhante a uma nuvem invisível
  alternative: algo semelhante a uma nuvem que não podia ser vista
  rationale: A imagem apocalíptica é mantida sem explicar ou eliminar sua tensão.
- issue: A leitura da oração textualmente difícil sobre a profundidade e o ato de olhar
  choice: não consegui contemplá-la
  alternative: de sua profundidade, consegui olhar acima de sua extensão
  rationale: A leitura principal acompanha o sentido contextual tradicional, mas a forma ge'ez preservada parece conter um verbo positivo de capacidade e uma expressão incerta; a alternativa é registrada em nota, sem ocultar o problema textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das imagens e a repetição de “gloriosamente/gloriosas” preservam o caráter visionário do texto. As ambiguidades textuais e lexicais relevantes são mantidas em notas, sem impor uma interpretação doutrinária.
