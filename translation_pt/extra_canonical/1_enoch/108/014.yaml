base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/014.yaml
  text: And they will see those who were born in darkness cast into darkness[e][d][c][b][a], while the righteous shine.
translation:
  language: pt
  text: E eles verão[a] os que nasceram nas trevas serem lançados nas trevas, enquanto os justos resplandecem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eu vi”.'
    reason: Leitura alternativa para o início do versículo.
  - marker: b
    text: 'Ou: “enquanto os justos são iluminados”.'
    reason: Alternativa lexical para o verbo que descreve o brilho dos justos.
lexical_decisions:
- source_word: ወይሬ እይዎሙ
  choice: E eles verão
  rationale: A forma transmitida e o contexto futuro favorecem a terceira pessoa, «eles verão», embora a segmentação permita que se registre em nota a leitura tradicional «E eu vi».
- source_word: ለእለ ተወልዱ በጽልመት
  choice: os que nasceram nas trevas
  rationale: Preserva a construção relativa, a passiva de «nascer» e a esfera figurada indicada por «nas trevas».
- source_word: ይትወደዩ በጽልመት
  choice: serem lançados nas trevas
  rationale: O verbo é entendido como o passivo imperfeito de ወደየ, «pôr, lançar», e a preposição assume valor direcional neste contexto.
- source_word: እንዘ ይትወሐውሑ
  choice: enquanto ... resplandecem
  rationale: A oração circunstancial introduzida por እንዘ contrasta simultaneamente o destino dos primeiros com o brilho dos justos; o presente português acompanha naturalmente o valor contextual do imperfeito ge'ez.
- source_word: ጻድቃን
  choice: os justos
  rationale: Termo corrente e digno para a categoria moral recorrente em 1 Enoque.
theological_decisions:
- issue: Contraste escatológico entre os nascidos nas trevas e os justos
  choice: Manter o contraste explícito entre serem lançados nas trevas e os justos resplandecerem.
  alternative: Interpretar o primeiro verbo como «serem amados nas trevas».
  rationale: A análise lexical do ge'ez identifica ይትወደዩ como forma passiva de «lançar», não como verbo de amor. A tradução conserva o paralelismo de trevas e luz sem acrescentar explicação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Conserva a repetição de «trevas» e usa «resplandecem» para o contraste apocalíptico com a luz.
