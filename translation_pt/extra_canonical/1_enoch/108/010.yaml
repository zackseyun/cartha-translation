base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/010.yaml
  text: And I have spoken of all their blessings in the books, and he has rewarded them themselves, because these are found to love heaven more than their life in the world; and while they are trodden down by evil men, they hear from them abuse and reviling and are put to shame while blessing me.
translation:
  language: pt
  text: Relatei nos livros todas as suas bênçãos e os designei para seus líderes,[a] pois se reconhece que amam o céu mais do que sua vida neste mundo.[b] E, enquanto são oprimidos por homens maus, ouvem deles insultos e injúrias e são humilhados, ao mesmo tempo que me bendizem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “para suas cabeças”. A expressão pode significar “para seus líderes” ou “para seus chefes”; a redação ge''ez é difícil. Outra possibilidade é: “e os dispus para seus líderes”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “mais do que sua respiração no mundo”. Aqui, “respiração” é entendida como uma maneira de dizer “vida”.
    reason: lexical_alternative
  - marker: c
    text: O texto diz “ao mesmo tempo que me bendizem”. O objeto na primeira pessoa foi mantido como está escrito, embora o referente seja incomum e alguns considerem a passagem difícil ou corrompida.
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎ በረከቶሙ
  choice: todas as bênçãos deles
  rationale: Preserva o plural concreto e o registro apocalíptico de በረከት, sem converter a expressão na abstração “bem-aventurança”.
- source_word: ነገርኩ በመጻሕፍት
  choice: falei nos livros
  rationale: Mantém a primeira pessoa, o verbo de declaração e o plural “livros”, conservando a autorreferência literária.
- source_word: ዐሰዮሙ ለአርእስቲሆሙ
  choice: as destinei aos seus líderes
  rationale: A forma verbal é entendida na primeira pessoa, com sentido de pôr, dispor ou destinar; አርእስት significa literalmente “cabeças” e pode designar líderes. A nota preserva a dificuldade.
- source_word: ተረክቡ
  choice: são reconhecidos como pessoas que
  rationale: Exprime naturalmente o valor passivo “são encontrados/constatados” sem sugerir descoberta física.
- source_word: ያፈቅርዎ ለሰማይ
  choice: amam o céu
  rationale: Conserva “céu” como objeto direto e a orientação vertical do texto apocalíptico.
- source_word: እምእስትንፋሶሙ ዘበዓለም
  choice: mais do que sua vida neste mundo
  rationale: “Respiração” funciona metonimicamente como vida; a formulação comunica o idioma em português e mantém o contraste entre céu e mundo.
- source_word: ይትከየዱ
  choice: são oprimidos
  rationale: Transmite o sentido de serem pisados ou maltratados em português natural, sem enfraquecer o contexto de perseguição.
- source_word: እምእኩያን ሰብእ
  choice: por homens maus
  rationale: Reproduz a caracterização moral direta do sintagma ge'ez e seu registro solene.
- source_word: ትዕይርተ ወጽርፈተ
  choice: insultos e injúrias
  rationale: Mantém o par de substantivos referentes à fala hostil, sem introduzir o sentido especificamente religioso de “blasfêmias”.
- source_word: ኀሥሡ
  choice: são humilhados
  rationale: Segue a identificação contextual da forma como derivada de ኀስረ, “ser envergonhado/desonrado”, em vez de “suportar”.
- source_word: እንዘ ይባርኩኒ
  choice: enquanto me bendizem
  rationale: Retém explicitamente o objeto de primeira pessoa e a construção circunstancial, apesar de sua dificuldade contextual.
theological_decisions:
- issue: Referente da primeira pessoa em “enquanto me bendizem”
  choice: Manter “me” conforme a gramática do texto, sem substituir o referente por Deus
  alternative: Traduzir “enquanto bendizem a Deus/o Senhor” ou entender que “me” se refere indiretamente a Deus
  rationale: O discurso imediato está na primeira pessoa e a leitura é teologicamente incomum. Preservar o pronome e registrar a dificuldade em nota evita corrigir ou harmonizar silenciosamente o texto.
- issue: Sentido de “cabeças” em ለአርእስቲሆሙ
  choice: Traduzir idiomaticamente como “líderes”, com nota sobre o sentido literal
  alternative: “cabeças”, “chefes” ou uma leitura segundo a qual Deus os recompensou pessoalmente
  rationale: “Líderes” representa uma extensão semântica atestada de “cabeças”, mas a sintaxe permanece difícil; por isso, a tradução não apresenta a solução como indiscutível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. “Bendizer” foi usado na cláusula final para preservar o tom religioso e distinguir o ato verbal de uma simples aprovação. As notas concentram-se nas três dificuldades reais do ge'ez, sem sobrecarregar o versículo.
