revisions:
- from: E falei nos livros de todas as bênçãos deles e as destinei aos seus líderes,[a] porque estes são reconhecidos como pessoas que amam o céu mais do que sua vida neste mundo.[b] E, enquanto são oprimidos por homens maus, ouvem deles insultos e injúrias e são humilhados, enquanto me bendizem.[c]
  to: Relatei nos livros todas as suas bênçãos e os designei para seus líderes,[a] pois se reconhece que amam o céu mais do que sua vida neste mundo.[b] E, enquanto são oprimidos por homens maus, ouvem deles insultos e injúrias e são humilhados, ao mesmo tempo que me bendizem.[c]
  rationale: A revisão corrige o referente gramatical do objeto no trecho textual mais difícil, melhora a fluência da abertura e conserva tanto a ambiguidade do ge'ez quanto a primeira pessoa incomum da cláusula final. Não resolve doutrinariamente nem emenda de modo silencioso as dificuldades do texto.
