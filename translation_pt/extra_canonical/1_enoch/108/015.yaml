base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/015.yaml
  text: And the sinners will cry out and see them while they shine[a], and they themselves will go to where the days and the times have been written down for them[e][d][c][b]. The vision of the hidden things of Enoch.
translation:
  language: pt
  text: E os pecadores clamarão e os verão enquanto eles resplandecem[a]; eles próprios irão para onde lhes foram registrados os dias e os tempos[b]. A visão das coisas ocultas de Enoque.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma etíope é difícil. Também tem sido entendida como referência a movimento inquieto, agitação ou vagueação; o referente de “eles” depende do contexto anterior.
    reason: lexical_alternative
  - marker: b
    text: O registro dos “dias e tempos” evoca a ideia apocalíptica de períodos de juízo previamente fixados e inscritos.
    reason: cultural_note
  - marker: c
    text: Esta frase nominal parece funcionar como subscrição ou título conclusivo. Literalmente, também pode ser entendida como “Visão das coisas ocultas pertencente a Enoque”.
    reason: textual_note
lexical_decisions:
- source_word: ወይጸርኁ
  choice: E ... clamarão
  rationale: O verbo indica um clamor forte, possivelmente de lamento. “Clamarão” mantém a intensidade sem especificar além do texto a natureza do grito.
- source_word: ወይሬእይዎሙ
  choice: e os verão
  rationale: Traduz diretamente o verbo “ver” com o sufixo de objeto plural, preservando a referência pronominal do original.
- source_word: ኃጥኣን
  choice: os pecadores
  rationale: É a designação apocalíptica comum para esse grupo e funciona naturalmente como sujeito explícito em português.
- source_word: እንዘ ይትወሐውሑ
  choice: enquanto eles resplandecem
  rationale: A forma é difícil e sua referência pronominal não é totalmente transparente. A tradução segue a leitura contextual de brilho ou esplendor, sem substituir o pronome por um referente interpretado.
- source_word: ወየሐውሩ እሙንቱሂ
  choice: eles próprios irão
  rationale: “Irão” expressa o movimento em direção ao destino seguinte, e “eles próprios” conserva a ênfase do pronome com partícula.
- source_word: በኀበ
  choice: para onde
  rationale: A expressão portuguesa marca de modo natural a direção para um destino.
- source_word: ተጽሕፉ ሎሙ መዋዕለ ወእዝማን
  choice: lhes foram registrados os dias e os tempos
  rationale: O passivo com dativo apresenta dias e tempos previamente inscritos para eles; “registrados” preserva a imagem apocalíptica de determinação escrita.
- source_word: ራእየ ኅቡኣት ዘሄኖክ
  choice: A visão das coisas ocultas de Enoque
  rationale: A frase nominal não contém preposição equivalente a “em” nem verbo equivalente a “viu”; por isso, é apresentada como subscrição ou título conclusivo separado.
theological_decisions:
- issue: Função da frase final ራእየ ኅቡኣት ዘሄኖክ
  choice: 'Tratada como subscrição ou título conclusivo: “A visão das coisas ocultas de Enoque”'
  alternative: Integrá-la à oração anterior, como referência à visão na qual os acontecimentos foram vistos
  rationale: A construção é uma frase nominal autônoma e não traz a preposição nem o verbo necessários para a leitura integrada. A nota preserva, contudo, a incerteza de função literária.
- issue: Referente dos pronomes em “os verão enquanto eles resplandecem”
  choice: Manter os pronomes sem explicitar quem resplandece
  alternative: Substituir “eles” por “os justos” ou outro grupo inferido do contexto
  rationale: O versículo isolado não nomeia diretamente o referente do objeto plural; explicitá-lo resolveria uma ambiguidade que o texto mantém.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluência brasileira. Mantiveram-se a ênfase de “eles próprios”, a linguagem apocalíptica do registro dos tempos e a ambiguidade dos pronomes. A frase final foi pontuada como unidade nominal independente, em conformidade com a sintaxe ge’ez.
