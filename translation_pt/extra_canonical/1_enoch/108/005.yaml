base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/005.yaml
  text: And I asked the two holy angels who were with me[a], and I said to him, “What is this glorious thing? For it is not heaven, but only a burning flame of fire[c][b], and the sound of weeping and crying out and lamentation and grievous pain.”
translation:
  language: pt
  text: 'E perguntei aos dois santos anjos que estavam comigo e disse a ele[a]: “O que é esta coisa gloriosa[b]? Pois não é o céu, mas somente uma chama de fogo ardente[c], e o som de choro, gritos, lamentação e dor intensa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez diz “disse a ele”, embora a frase anterior mencione “os dois santos anjos”. Enoque pode ter se dirigido a um deles como porta-voz, ou pode haver aqui uma irregularidade textual.
    reason: textual_variant
  - marker: b
    text: “Coisa gloriosa” também pode ser traduzido como “lugar glorioso” ou “esplendor”. A formulação permanece ampla porque o próprio versículo ainda não identifica explicitamente o referente.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “somente uma chama de fogo que arde”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: perguntei
  rationale: Expressa de modo direto e natural a indagação de Enoque aos guias angélicos.
- source_word: ፪አመላእክት ቅዱሳን
  choice: aos dois santos anjos
  rationale: Preserva tanto o numeral explícito quanto o qualificativo apocalíptico ቅዱሳን.
- source_word: እለ ምስሌየ
  choice: que estavam comigo
  rationale: Identifica naturalmente os anjos como os acompanhantes de Enoque.
- source_word: እቤሎ
  choice: disse a ele
  rationale: Mantém o pronome singular do ge'ez apesar do antecedente plural, sem corrigir silenciosamente a irregularidade textual.
- source_word: ምንት ውእቱ ዝስቡሕ
  choice: O que é esta coisa gloriosa?
  rationale: Mantém amplo o referente ainda não identificado; ዝስቡሕ comporta as ideias de glória, esplendor ou algo glorioso.
- source_word: አኮኑ ሰማየ
  choice: não é o céu
  rationale: Preserva o contraste entre a visão e o céu propriamente dito.
- source_word: ላህበ እሳት ባሕቲቱ ዘይነድድ
  choice: somente uma chama de fogo ardente
  rationale: Conserva a imagem cumulativa de 'chama de fogo' e a ideia explícita de que ela arde, em português corrente e solene.
- source_word: ቃለ ብካይ
  choice: o som de choro
  rationale: Em uma enumeração auditiva, 'som' traduz ቃለ com naturalidade, e 'choro' preserva a ação de prantear.
- source_word: ጽራሕ
  choice: gritos
  rationale: Transmite a intensidade do clamor sem impor uma descrição mais específica do tom.
- source_word: አውያት
  choice: lamentação
  rationale: Distingue este elemento do choro e dos gritos, mantendo o registro elevado.
- source_word: ሕማም ኀያል
  choice: dor intensa
  rationale: Comunica claramente a força e a gravidade do sofrimento em português moderno.
theological_decisions:
- issue: Se a cena deve ser resumida como tormento ou punição
  choice: Manter as imagens concretas de fogo, choro, gritos, lamentação e dor
  alternative: Resumir a cena com termos gerais como 'tormento' ou 'punição'
  rationale: A força do versículo está na acumulação sensorial da visão; resumi-la acrescentaria uma interpretação e enfraqueceria sua linguagem apocalíptica.
- issue: Identidade do destinatário singular depois da menção de dois anjos
  choice: Preservar 'disse a ele' e explicar em nota
  alternative: Regularizar como 'disse a eles'
  rationale: O ge'ez apresenta uma forma singular. Ela pode indicar que Enoque se dirigiu a um dos anjos como porta-voz, mas o texto não resolve a questão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A ordem e a repetição da imagem apocalíptica foram preservadas sem tornar a frase excessivamente literal.
