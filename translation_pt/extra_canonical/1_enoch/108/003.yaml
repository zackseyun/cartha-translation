base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/003.yaml
  text: But you[a], wait until sin passes away; for their names will be blotted out from the book of life and from the books of the holy ones, and their offspring will be destroyed forever. And their spirits will be slain, and they will cry out and lament in a desolate place that is unseen, and in burning fire[d][c][b]; for there is no earth there.
translation:
  language: pt
  text: Mas vocês, esperem até que o pecado passe; pois os nomes deles serão apagados do livro da vida e dos livros dos santos, e a descendência deles será destruída para sempre. Seus espíritos serão mortos, e eles clamarão e se lamentarão num lugar desolado que não se vê[a] e em fogo ardente; pois ali não há terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que não aparece” ou “invisível”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ali não há chão”. A expressão é incomum e foi mantida literalmente como parte da descrição visionária do lugar de castigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽንሑ
  choice: esperem
  rationale: Imperativo plural de ጸንሐ, “esperar, aguardar”. Mantém a repetição do verbo empregado no versículo anterior e evita confundi-lo com o verbo semelhante que significa “ser firme”.
- source_word: ተሐልፍ ኃጢአት
  choice: até que o pecado passe
  rationale: Conserva a imagem apocalíptica do pecado chegando ao fim, sem reduzi-la à ideia de perdão individual.
- source_word: ይደመስስ
  choice: serão apagados
  rationale: Com “nomes” como sujeito e registros celestes como contexto, “apagados” comunica naturalmente a remoção de uma inscrição.
- source_word: እመጽሐፈ ሕይወት
  choice: do livro da vida
  rationale: Reproduz de modo transparente a conhecida imagem apocalíptica de um registro celeste.
- source_word: እመጻሕፍተ ቅዱሳን
  choice: dos livros dos santos
  rationale: Preserva o plural “livros”. Em português atual, “santos” é a forma mais natural de designar os que são santos, sem definir se os livros lhes pertencem ou tratam deles.
- source_word: ዘርኦሙ ይትሐጐል ለዓለም
  choice: a descendência deles será destruída para sempre
  rationale: “Descendência” expressa claramente a linhagem, e “destruída para sempre” mantém a severidade e a duração da sentença.
- source_word: መንፈሳቲሆሙ ይትቀተሉ
  choice: Seus espíritos serão mortos
  rationale: Mantém “espíritos”, sem normalizar o termo como “almas”, e preserva a forte imagem de morte presente no verbo.
- source_word: ይጸርኁ ወየአውይዉ
  choice: clamarão e se lamentarão
  rationale: Reproduz o par de verbos de aflição em português digno e compreensível.
- source_word: በመካነ ባድው
  choice: num lugar desolado
  rationale: Expressa um local vazio e ermo de maneira vívida e natural.
- source_word: ዘኢያስተርኢ
  choice: que não se vê
  rationale: O verbo significa aparecer ou ser visível. A formulação evita a tradução morfologicamente inadequada “que não pode ser mostrado” e conserva a leve indeterminação entre invisibilidade e não aparecimento.
- source_word: በእሳተ ነዱ
  choice: em fogo ardente
  rationale: Preserva a intensificação da imagem do fogo sem produzir uma construção artificial em português.
- source_word: ኢሀሎ ህየ ምድር
  choice: ali não há terra
  rationale: Mantém literalmente a imagem cósmica, estranha e incerta, em vez de limitá-la antecipadamente a solo ou terreno.
theological_decisions:
- issue: Sentido dos registros celestes dos quais os nomes são apagados
  choice: O texto menciona distintamente o “livro da vida” e os “livros dos santos”, preservando a imagem de registros celestes de pertencimento e juízo.
  alternative: Os livros podem pertencer aos santos, registrar os santos ou designar mais amplamente escritos sagrados.
  rationale: A relação expressa por “dos santos” permanece aberta; a tradução não funde os vários livros num único conceito nem especifica sua posse ou conteúdo.
- issue: Natureza do castigo dos espíritos
  choice: Preservar conjuntamente as imagens de morte, clamor, lamento, desolação e fogo.
  alternative: Entender a linguagem como ruína total metafórica ou como descrição sistemática de punição consciente após a morte.
  rationale: O versículo reúne imagens que podem parecer tensas entre si. A tradução não as harmoniza com uma doutrina posterior da vida após a morte.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece solene sem arcaísmos. A sintaxe conserva a sequência acumulativa da visão, enquanto pontuação e pronomes tornam o texto claro para leitores comuns.
