base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/006.yaml
  text: 'And he said to me, “This is the place that you see: here the spirits of sinners and blasphemers and those who do evil will be cast, and those who twist everything that the Lord has spoken by the mouth of the prophets—all the things that are to be done.”'
translation:
  language: pt
  text: 'E ele me disse: “Este lugar que você vê é onde serão lançados os espíritos dos pecadores e dos blasfemos, dos que praticam o mal e dos que distorcem tudo o que o Senhor falou pela boca dos profetas — tudo o que há de se cumprir.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትወደዩ
  choice: serão lançados
  rationale: Reproduz o sentido passivo e futuro da forma ge'ez, em português natural.
- source_word: ጽኁፋን
  choice: blasfemos
  rationale: Segue o valor contextual tradicional do termo neste verso, em paralelo com “pecadores” e “os que praticam o mal”.
- source_word: ይመይጡ
  choice: distorcem
  rationale: Expressa a ideia de alterar ou perverter o que foi dito, sem especificar indevidamente o método ou a intenção.
- source_word: ይትገበር
  choice: há de se cumprir
  rationale: No contexto da palavra profética, o passivo de “fazer/realizar” é vertido idiomaticamente como cumprimento, preservando a referência ao que ainda será realizado.
theological_decisions:
- issue: Natureza da fala profética
  choice: “tudo o que há de se cumprir”
  alternative: “tudo o que deve ser feito”
  rationale: O ge'ez permite uma formulação ligada a “ser feito/realizado”; no contexto das palavras dos profetas, “cumprir-se” comunica melhor o sentido sem acrescentar uma doutrina específica.
- issue: Tratamento do título divino
  choice: “o Senhor”
  alternative: “Deus” ou um nome divino específico
  rationale: Corresponde diretamente a እግዚእ e evita introduzir uma identificação mais específica do que a fonte apresenta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sequência de grupos condenados foi preservada, assim como a tensão entre distorcer a palavra profética e seu cumprimento.
