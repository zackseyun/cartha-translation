  text: those who love God[a], and did not love gold or silver or any of the good things that are in the world[b], but gave their bodies to affliction.
translation:
  language: pt
  text: os que amam a Deus e não amaram o ouro, a prata, nem nenhum dos bens que há no mundo[a], mas entregaram seus corpos à aflição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão etíope traduzida por «nenhum dos bens que há no mundo» apresenta dificuldade textual no testemunho disponível; provavelmente se refere, de modo amplo, aos bens desejáveis do mundo.
    reason: textual_variant
  - marker: b
    text: O termo ge’ez ሥጋ pode significar «carne» ou «corpo». Aqui se emprega «corpos», sem eliminar a ênfase no sofrimento físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: እለ
  choice: os que
  rationale: Marcador relativo plural que apresenta o grupo descrito; «os que» é direto e natural em português.
- source_word: ያፈቅርዎ ለአምላክ
  choice: amam a Deus
  rationale: O verbo expressa amor ou devoção a Deus. O presente conserva o caráter descritivo da oração e a regência é natural em português.
- source_word: ወኢወርቀ ወኢብሩረ አፍቀሩ
  choice: não amaram o ouro, a prata
  rationale: Mantém o verbo «amar», preservando o contraste lexical entre amar a Deus e amar riquezas, bem como a referência explícita aos dois metais preciosos.
- source_word: ወኢኵሎ ሠናየ ዘውስተ ዓለም
  choice: nem nenhum dos bens que há no mundo
  rationale: Expressa a provável referência abrangente às coisas desejáveis deste mundo, sem transformar o trecho em uma afirmação sobre sua maldade intrínseca; a formulação reconhece a dificuldade textual do testemunho.
- source_word: አላ
  choice: mas
  rationale: Conjunção adversativa forte que contrapõe o desapego dos bens mundanos à aceitação do sofrimento.
- source_word: ወሀቡ ሥጋሆሙ
  choice: entregaram seus corpos
  rationale: «Corpos» comunica com clareza a dimensão física de ሥጋ, enquanto «entregaram» preserva a ideia de dar ou colocar a si mesmos em condição de sofrimento.
- source_word: ለጻዕር
  choice: à aflição
  rationale: O substantivo abrange sofrimento, dificuldade e penúria; «aflição» conserva essa amplitude e o tom solene do contexto.
theological_decisions:
- issue: Se o contraste descreve renúncia deliberada aos bens materiais ou apenas falta de riqueza
  choice: Conservar a linguagem de amor contrastante, que sugere desapego deliberado por devoção a Deus
  alternative: Interpretar a frase apenas como descrição de pessoas pobres ou como condenação genérica da ganância
  rationale: A repetição do campo semântico de «amar» contrapõe diretamente o amor a Deus ao amor pelo ouro, pela prata e pelos bens do mundo. A entrega do corpo à aflição reforça a ideia de sofrimento aceito, mas a tradução não especifica se ele foi ascético, persecutório ou de outra natureza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se a alternância verbal do texto — «amam» e «não amaram» — em vez de uniformizá-la silenciosamente. «Aflição» mantém o alcance semântico sem restringir o sofrimento a trabalho árduo, perseguição ou prática ascética.
