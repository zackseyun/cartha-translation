base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/002.yaml
  text: You who have done good[a], wait for those days until those who do evil are brought to an end[c][b], and the power of the sinners comes to an end.
translation:
  language: pt
  text: Vocês que fizeram o bem, esperem por aqueles dias[a], até que os que praticam o mal sejam levados a seu fim[b], e chegue ao fim o poder dos pecadores.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode ser entendido como “permaneçam firmes”, “perseverem” ou “tenham paciência”; a ideia é perseverar pacientemente até a queda dos maus.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cheguem ao fim”. A forma verbal indica que os próprios praticantes do mal chegam ao seu término, não apenas que deixam de fazer o mal.'
    reason: lexical_alternative
  - marker: c
    text: 'A oração final repete a ideia de término: tanto os que praticam o mal quanto o poder dos pecadores chegam ao fim.'
    reason: cross_reference
lexical_decisions:
- source_word: እለ ገበርክሙ ሠናየ
  choice: Vocês que fizeram o bem
  rationale: Reproduz a construção relativa e o perfeito, dirigindo-se ao grupo caracterizado pela prática do bem, além de manter o contraste com os que praticam o mal.
- source_word: ትጸንሑ
  choice: esperem
  rationale: No contexto da expressão temporal e da expectativa apocalíptica, transmite perseverança paciente sem excluir a nuance de permanecer firme.
- source_word: ለእሉ መዋዕል
  choice: por aqueles dias
  rationale: Mantém a referência a dias ou tempos e deixa que a oração seguinte delimite a duração da espera; a construção é deliberadamente preservada apesar de sua leve estranheza.
- source_word: እስከ ይትፌጸሙ እለ ይገብሩ እኩየ
  choice: até que os que praticam o mal sejam levados ao fim
  rationale: Expressa o valor passivo de chegar à terminação e evita a leitura ambígua de que apenas deixariam de praticar o mal.
- source_word: ወይትፌጸም ኃይሎሙ ለመአብሳን
  choice: e chegue ao fim o poder dos pecadores
  rationale: Preserva tanto a repetição do verbo de conclusão quanto o sentido de ኃይል como poder ou força e de መአብሳን como pecadores.
theological_decisions:
- issue: Tradução de መአብሳን
  choice: pecadores
  alternative: ímpios
  rationale: O termo caracteriza essas pessoas por pecado ou culpa em registro moral-religioso; “pecadores” mantém essa nuance, enquanto “os que praticam o mal” já traduz a oração verbal anterior.
- issue: Destino dos que praticam o mal
  choice: sejam levados ao fim
  alternative: sejam destruídos
  rationale: A formulação conserva a imagem lexical de conclusão ou término presente no ge'ez sem explicitar “destruição” além do que o verbo exige.
translation_notes:
  register: Português atual, digno e acessível, com “vocês” para marcar naturalmente o plural explícito. A repetição de “fim” foi mantida por corresponder à repetição lexical do ge'ez. “Praticam o mal” soa mais caracterizador e habitual que “fazem o mal”, sem perder o paralelismo ético.
