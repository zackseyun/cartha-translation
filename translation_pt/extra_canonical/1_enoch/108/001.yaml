base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/001.yaml
  text: Another book that Enoch wrote for his son Methuselah[a], and for those who will come after him and keep the ordinance in the latter days.
translation:
  language: pt
  text: Outro livro que Enoque escreveu para seu filho Matusalém e para os que virão depois dele e guardarão a norma[a] nos últimos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a ordem”, “a regra” ou “o caminho prescrito”. O termo ge'ez pode indicar uma norma ou um padrão estabelecido que deve ser observado.
    reason: Preservar a amplitude lexical de ሥርዐተ.
lexical_decisions:
- source_word: ካልእ
  choice: Outro
  rationale: Introduz um escrito adicional e distinto do que o precede, sem especificar rigidamente que seja o segundo de uma sequência.
- source_word: መጽሐፍ
  choice: livro
  rationale: É o equivalente corrente e adequado ao caráter de título ou subscrição da frase.
- source_word: ዘጸሐፈ
  choice: que ... escreveu
  rationale: Reproduz de modo natural a construção relativa e o sentido direto do verbo.
- source_word: ለወልዱ ማቱሳላ
  choice: para seu filho Matusalém
  rationale: A preposição expressa o destinatário ou beneficiário do escrito; “para” é natural em português.
- source_word: ለእለ ይመጽኡ እምድኅሬሁ
  choice: para os que virão depois dele
  rationale: Mantém a orientação futura e a referência pronominal do ge'ez, sem substituir as pessoas por uma interpretação explícita como “gerações”.
- source_word: የዓቅቡ
  choice: guardarão
  rationale: O verbo pode significar guardar, observar ou conservar. “Guardarão” preserva sua amplitude e concorda com a orientação futura da frase.
- source_word: ሥርዐተ
  choice: a norma
  rationale: O substantivo designa uma ordem, regra ou padrão estabelecido. “Norma” comunica o caráter prescritivo sem reduzi-lo necessariamente a um decreto legal específico.
- source_word: በደኃሪ መዋዕል
  choice: nos últimos dias
  rationale: Preserva a ressonância apocalíptica da expressão e é uma formulação bíblica natural em português.
theological_decisions:
- issue: Intensidade escatológica de በደኃሪ መዋዕል
  choice: nos últimos dias
  alternative: em tempos posteriores; no fim dos dias
  rationale: O contexto apocalíptico favorece uma expressão com ressonância escatológica, mas a tradução não define um esquema doutrinário específico.
- issue: Natureza daquilo que será guardado em ሥርዐተ
  choice: a norma
  alternative: a ordem; a regra; a prescrição
  rationale: “Norma” mantém a noção de padrão estabelecido a ser observado, sem decidir se se trata de uma lei isolada, de uma ordenança ritual ou de uma ordem mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência bíblica. “Matusalém” segue a forma tradicional amplamente reconhecida. A coordenação simples conserva o caráter de título do original.
