  terminology: «Julgamento», «justo», «fé», «fiéis» e «retidão» são escolhas coerentes e não impõem interpretação confessional. As notas b e c esclarecem, respectivamente, a amplitude semântica de «fé» e a imagem locativa concreta sem substituir o texto por uma paráfrase.
