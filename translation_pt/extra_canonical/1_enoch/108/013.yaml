  source_fidelity: A tradução segue adequadamente a leitura crítica plausível ኵነኔሁ («seu julgamento») por trás da forma transcrita አነኒሁ, resultando em «o julgamento de Deus é justo». A nota identifica de modo transparente a dificuldade textual e conserva a alternativa derivada da transcrição. «Se alegrarão», «por tempos incontáveis», «fé aos fiéis» e «na morada dos caminhos da retidão» refletem bem o sentido e as imagens do ge'ez. Em especial, «aos fiéis» preserva corretamente o par cognato com «fé».
