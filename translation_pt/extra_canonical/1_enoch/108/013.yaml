base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/013.yaml
  text: And they will shine in times without number[a], for the righteousness belongs to God[f][e][d][c][b]; for he will give faith to the faithful in the dwelling of the paths of uprightness.
translation:
  language: pt
  text: E eles se alegrarão por tempos incontáveis, pois o julgamento de Deus é justo[a]; porque ele dará fé aos fiéis[b] na morada dos caminhos da retidão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A transcrição apresentada traz አነኒሁ, provavelmente um erro de leitura por ኵነኔሁ, “seu julgamento”. Com essa correção, a frase diz: “o julgamento de Deus é justo”. Sem ela, já se traduziu: “a justiça pertence a Deus”.'
    reason: textual_variant
  - marker: b
    text: '“Fé” também pode ter aqui o sentido de “fidelidade” ou “firmeza”. O original emprega palavras da mesma raiz: literalmente, Deus dá fé ou fidelidade aos fiéis.'
    reason: lexical_alternative
  - marker: c
    text: 'A expressão conserva a imagem concreta do original: uma morada definida por caminhos de retidão.'
    reason: cultural_note
lexical_decisions:
- source_word: ይትወሐውሑ
  choice: se alegrarão
  rationale: O verbo, em sua forma futura/reflexivo-passiva, exprime alegria ou exultação. “Se alegrarão” é natural, digno e mais bem sustentado lexicalmente do que “brilharão”.
- source_word: በእዝማን ዘአልቦ ኍልቈ
  choice: por tempos incontáveis
  rationale: A expressão combina “tempos/eras” com a ideia de ausência de número ou contagem. A formulação conserva o sentido temporal sem especificar indevidamente “eternidade”.
- source_word: ጽድቅ ኵነኔሁ ለአምላክ
  choice: o julgamento de Deus é justo
  rationale: Adota-se a leitura corrigida ኵነኔሁ (“seu julgamento”), reconhecida como subjacente ao texto transcrito አነኒሁ, que resulta de erro visual de OCR/transcrição. A construção atribui justiça ao julgamento de Deus.
- source_word: ለመሃይምናን
  choice: aos fiéis
  rationale: O termo designa os que creem ou são fiéis e forma um par etimológico deliberado com ሃይማኖተ (“fé/fidelidade”). Não significa “sábios”.
- source_word: ሃይማኖተ
  choice: fé
  rationale: “Fé” reproduz diretamente o substantivo e preserva o jogo cognato com “fiéis”; a possível nuance de fidelidade ou firmeza é mantida em nota.
- source_word: በማኅደረ ፍናዋተ ርትዕ
  choice: na morada dos caminhos da retidão
  rationale: Mantém a imagem concreta e densa de uma morada caracterizada por caminhos retos, sem reduzi-la a uma abstração moral.
theological_decisions:
- issue: Natureza do dom concedido por Deus aos fiéis
  choice: fé
  alternative: fidelidade ou firmeza
  rationale: O substantivo pode abranger fé, fidelidade e constância. O texto principal preserva o cognato “fé aos fiéis”, enquanto a nota mantém aberta a nuance ética de perseverança.
- issue: Fundamento da alegria futura
  choice: o julgamento de Deus é justo
  alternative: a justiça pertence a Deus
  rationale: A alternativa decorre da transcrição defeituosa አነኒሁ. A leitura textual corrigida ኵነኔሁ, “seu julgamento”, é paleograficamente plausível e produz a construção coerente “o julgamento de Deus é justo”.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Preserva-se a imagética apocalíptica e o jogo cognato entre “fé” e “fiéis”, enquanto a dificuldade textual é explicitada sem ocultar a alternativa.
