base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/012.yaml
  text: And I will bring out into bright light those who loved my holy name[c][b][a], and I will seat each one on the throne of his glory.
translation:
  language: pt
  text: E farei sair para a luz resplandecente aqueles que amaram o meu santo nome, e farei cada um sentar-se no trono de sua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O pronome em «sua glória» é entendido no texto principal como retomando distributivamente «cada um». Também pode ser entendido como referência a Deus ou ao Senhor: «no trono da glória dele». Outra possibilidade é «no trono glorioso».'
    reason: alternative_reading
lexical_decisions:
- source_word: እወፅኦሙ
  choice: farei sair
  rationale: Expressa o sentido causativo de levar ou fazer um grupo sair, mantendo de modo natural o movimento indicado pelo verbo.
- source_word: በብሩህ ብርሃን
  choice: para a luz resplandecente
  rationale: Conserva a imagem intensificada de luminosidade; «para» combina com o movimento de saída sem transformar a expressão em mero instrumento.
- source_word: ለእለ አፍቀርዎ ለስምየ ቅዱስ
  choice: aqueles que amaram o meu santo nome
  rationale: Toma ለእለ como marca do objeto retomado antecipadamente pelo sufixo verbal, conforme a análise gramatical mais recente, e preserva o valor reverencial de amar o nome santo.
- source_word: አነብር
  choice: farei ... sentar-se
  rationale: No contexto de entronização, indica causar que alguém se assente ou seja colocado, mais especificamente do que simplesmente fazê-lo habitar.
- source_word: አሐደ አሐደ
  choice: cada um
  rationale: Reproduz naturalmente em português o valor distributivo da repetição ge'ez.
- source_word: መንበረ ክብር
  choice: o trono de ... glória
  rationale: Mantém a construção genitiva e a imagem régia ou judicial de መንበር, sem reduzi-la ao adjetivo «glorioso».
- source_word: ዚአሁ
  choice: sua
  rationale: O pronome singular concorda naturalmente com o distributivo «cada um»; em português, porém, «sua» também pode ser entendido como referência ao falante divino, razão pela qual a ambiguidade é registrada em nota.
theological_decisions:
- issue: Referente do pronome em «sua glória»
  choice: O pronome é mantido e, na leitura principal, retoma distributivamente «cada um».
  alternative: O pronome pode ser entendido como referência a Deus ou ao Senhor, de modo que o trono esteja associado à glória divina; também se pode verter a expressão como «o trono glorioso».
  rationale: A terceira pessoa singular segue imediatamente o distributivo «cada um», favorecendo essa retomada. Como a referência permanece discutível e o português «sua» conserva alguma abertura, a tradução não elimina a tensão, e a nota apresenta as demais leituras.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção causativa natural. «Luz resplandecente» preserva a intensidade poética sem expansão excessiva; «cada um» comunica com clareza o distributivo ge'ez.
