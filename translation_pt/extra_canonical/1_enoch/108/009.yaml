base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/009.yaml
  text: those who[a], from the time they came to be, did not desire the food that is on the earth, but regarded their souls as a passing breath, and kept this, and the Lord tested them greatly, and their spirits were found pure[c][b], so that they might bless his name.
translation:
  language: pt
  text: aqueles que, desde que vieram a existir, não desejaram o alimento que há sobre a terra, mas consideraram suas almas como um sopro passageiro[a] e mantiveram isso. O Senhor os provou intensamente, e seus espíritos foram achados puros, para que bendissessem o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como um espírito que passa” ou “como um vento passageiro”. A palavra ge''ez pode significar espírito, vento ou sopro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢፈተዉ
  choice: não desejaram
  rationale: Preserva a ideia de desejo ou deleite interior, em vez de indicar apenas recusa externa.
- source_word: መብልዕተ ዘውስተ ምድር
  choice: o alimento que há sobre a terra
  rationale: Mantém a referência concreta ao alimento e a imagem espacial do ge'ez, sem generalizá-la como simples prazer mundano.
- source_word: ረሰዩ ነፍሳቶሙ ከመ መንፈስ እንተ ተሐልፍ
  choice: consideraram suas almas como um sopro passageiro
  rationale: ረሰዩ com ከመ exprime aqui considerar ou ter por; 'almas' conserva a correspondência lexical com ነፍሳቶሙ, e 'sopro passageiro' comunica a transitoriedade da comparação.
- source_word: ዐቀቡ
  choice: mantiveram isso
  rationale: Conserva aberto se o objeto é uma disciplina, atitude ou prática, refletindo a concisão do original.
- source_word: ብዙኃ አመከሮሙ
  choice: os provou intensamente
  rationale: Expressa uma prova rigorosa e evita entender o verbo apenas como instrução ou disciplina.
- source_word: ተረክቡ መንፈሳቲሆሙ ንጹሕተ
  choice: seus espíritos foram achados puros
  rationale: 'Mantém o sentido passivo e probatório: depois da prova, constatou-se a pureza dos espíritos.'
- source_word: ከመ ይባርክዎ ለስሙ
  choice: para que bendissessem o seu nome
  rationale: Preserva a possível nuance de propósito ou resultado e o idioma bíblico de bendizer o nome divino.
theological_decisions:
- issue: Natureza da renúncia ao alimento terreno
  choice: Manter a referência concreta ao alimento e à consideração da própria alma como transitória.
  alternative: Interpretar como rejeição geral dos prazeres mundanos ou como jejum até a morte.
  rationale: O texto sugere renúncia radical, mas não define uma instituição ascética nem afirma explicitamente martírio ou privação mortal.
- issue: Sentido de መንፈስ na comparação
  choice: sopro
  alternative: espírito ou vento
  rationale: Na comparação, a qualidade passageira parece central; 'sopro' exprime brevidade e fragilidade, enquanto a nota preserva a amplitude semântica.
- issue: Relação entre alma e espírito
  choice: Traduzir ነፍሳቶሙ por 'almas' e መንፈሳቲሆሙ por 'espíritos'.
  alternative: Traduzir o primeiro termo por 'vidas'.
  rationale: A distinção lexical do verso é preservada sem transformá-la numa antropologia técnica ou denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção bíblica natural. A longa coordenação do ge'ez foi levemente dividida para melhorar a leitura sem alterar a sequência lógica.
