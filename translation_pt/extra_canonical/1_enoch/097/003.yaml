base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/003.yaml
  text: What will you do[a], you sinners, and where will you flee on that day of judgment[b], when you hear the voice of the prayer of the righteous?
translation:
  language: pt
  text: O que vocês farão, pecadores, e para onde fugirão naquele dia de juízo[a], quando ouvirem a voz[b] da oração dos justos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “castigo”, “condenação” ou “aflição”.'
    reason: O substantivo ge'ez pode carregar matizes de julgamento punitivo, castigo ou angústia.
  - marker: b
    text: 'Ou: “o som”; o termo ge''ez também pode significar “palavra”.'
    reason: A palavra ቃል possui o campo semântico de voz, som e palavra; “voz” é a opção contextual principal.
lexical_decisions:
- source_word: ምንተ፡ ትገብሩ
  choice: O que vocês farão
  rationale: A construção interrogativa com verbo no imperfeito tem força futura neste contexto de juízo iminente. “Vocês” torna explícito o plural e mantém a linguagem corrente.
- source_word: ኃጥኣን
  choice: pecadores
  rationale: Preserva o vocativo direto e o tom de confronto profético.
- source_word: አይቴ፡ ትጐይዩ
  choice: para onde fugirão
  rationale: O verbo indica movimento apressado; “fugirão” expressa naturalmente a tentativa de escapar no cenário de juízo.
- source_word: በይእቲ፡ ዕለት፡ እንተ፡ ጽነፄ
  choice: naquele dia de juízo
  rationale: Mantém a expressão temporal apocalíptica e comunica a ideia de acerto de contas punitivo sem especificar além do que o contexto permite.
- source_word: ሶበ፡ ትሰምዑ
  choice: quando ouvirem
  rationale: A oração temporal tem referência futura; o futuro do subjuntivo é a forma portuguesa natural.
- source_word: ቃለ፡ ጸሎቶሙ፡ ለጻድቃን
  choice: a voz da oração dos justos
  rationale: “Voz” conserva o sentido vocal e suplicante de ቃል melhor que uma formulação meramente acústica, enquanto “dos justos” preserva o plural substantivado.
theological_decisions:
- issue: Função da oração dos justos na cena de juízo
  choice: Os pecadores ouvem a oração dos justos no contexto da reversão judicial.
  alternative: Entender a expressão como o clamor direto, a acusação ou o testemunho dos próprios justos.
  rationale: O texto ge'ez menciona explicitamente a oração. A tradução direta preserva a imagem dos justos apelando por justiça sem identificar a oração com uma fórmula intertextual ou doutrina posterior.
- issue: Sentido de ጽነፄ na expressão sobre aquele dia
  choice: juízo
  alternative: aflição, castigo ou condenação
  rationale: O contexto é judicial e punitivo, mas o campo semântico admite nuances próximas; a nota mantém essa abertura sem enfraquecer o cenário apocalíptico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O vocativo mantém o tom profético; “vocês” evita uma forma regional ou arcaizante e deixa explícito o plural.
