base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/004.yaml
  text: 'And you will become like them[d][c][b][a], against whom this word will be a witness: ‘You have become companions of sinners.’'
translation:
  language: pt
  text: 'E vocês se tornarão como aqueles contra os quais esta palavra servirá de testemunho: “Vocês se tornaram companheiros de pecadores.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Esta palavra” também pode ser traduzida por “esta declaração” ou “este assunto”.
    reason: lexical_alternative
  - marker: b
    text: “Companheiros de pecadores” também pode ser entendido como “associados a pecadores” ou “participantes com pecadores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትከውኑ
  choice: se tornarão
  rationale: Preserva o valor futuro e a ideia de entrada em um estado, adequada ao tom de advertência.
- source_word: ከማሆሙ
  choice: como aqueles
  rationale: Expressa naturalmente a comparação e permite que a oração relativa identifique o grupo mencionado.
- source_word: ሰማዕተ ይከውን ዴቤሆሙ ዝንቱ ነገር
  choice: contra os quais esta palavra servirá de testemunho
  rationale: Reconhece ሰማዕተ como 'testemunho' e preserva a força judicial da expressão, em vez de derivá-la do verbo 'ouvir'.
- source_word: ዝንቱ ነገር
  choice: esta palavra
  rationale: ነገር pode designar palavra, declaração ou assunto; 'palavra' mantém a formulação concisa e a possível dimensão declarativa.
- source_word: ሱቱፋነ
  choice: companheiros
  rationale: Comunica participação e associação moral sem impor um sentido teológico técnico.
- source_word: ኮንክሙ
  choice: vocês se tornaram
  rationale: Reproduz o estado resultante expresso pela forma verbal e retoma deliberadamente o verbo da advertência inicial.
- source_word: ለኃጥኣን
  choice: de pecadores
  rationale: Depois de 'companheiros', esta construção portuguesa expressa associação de maneira idiomática, embora 'associados a pecadores' também seja possível.
theological_decisions:
- issue: Natureza da advertência
  choice: Advertência moral de que os destinatários se tornarão semelhantes aos condenados ao se associarem aos pecadores.
  alternative: Uma simples afirmação de que já são pecadores, ou uma declaração judicial sem ênfase na associação.
  rationale: O paralelismo entre 'se tornarão como aqueles' e 'se tornaram companheiros de pecadores' sustenta uma advertência ética com força judicial, sem desenvolver uma doutrina além do verso.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para o plural. A redação conserva a força judicial de “testemunho” e a repetição intencional de “tornar-se”.
