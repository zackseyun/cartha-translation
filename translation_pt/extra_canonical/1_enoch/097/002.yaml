base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/002.yaml
  text: Know that the Most High remembers your destruction[c][b][a], and the angels of heaven rejoice over your destruction.
translation:
  language: pt
  text: Saibam que o Altíssimo se lembra da destruição de vocês[a], e os anjos do céu se alegram com a destruição de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da ruína de vocês” ou “da queda de vocês”, nas duas ocorrências da expressão traduzida por “destruição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙረ ይከውን ለክሙ
  choice: Saibam
  rationale: A expressão funciona idiomaticamente como uma fórmula de certeza ou conhecimento dirigida aos destinatários. “Saibam” é natural em português, mantém o tom direto de advertência e introduz adequadamente a oração completiva com እስመ.
- source_word: ልዑል
  choice: o Altíssimo
  rationale: Título divino consagrado e natural em português, adequado ao registro apocalíptico.
- source_word: ይዜከር
  choice: se lembra
  rationale: Preserva o aspecto vívido e a certeza presente do juízo, sem excluir uma referência futura contextual.
- source_word: ሐጕልክሙ / ሐጕለ ዚአክሙ
  choice: a destruição de vocês
  rationale: O substantivo indica ruína ou calamidade severa. “Destruição” conserva a força do contexto e permite reproduzir a repetição do original.
- source_word: ይትፌሥሑ
  choice: se alegram
  rationale: Verbo explícito de alegria; a tradução mantém a imagem apocalíptica incisiva sem suavizá-la.
- source_word: መላእክተ ሰማይ
  choice: os anjos do céu
  rationale: Reproduz naturalmente a construção genitiva e conserva a referência aos seres celestiais.
theological_decisions:
- issue: Os seres celestiais se alegram com o juízo dos destinatários
  choice: Manter que os anjos do céu se alegram com a destruição deles.
  alternative: Interpretar ou explicitar que eles se alegram apenas com a justiça divina.
  rationale: O verbo de alegria e sua relação com a destruição são explícitos no ge'ez. A formulação preserva a tensão teológica e a severidade da retórica apocalíptica sem inserir uma explicação ausente no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “vocês” comunica claramente o destinatário plural. A repetição de “destruição de vocês” foi mantida por corresponder à repetição enfática do ge'ez.
