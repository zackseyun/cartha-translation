base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/009.yaml
  text: And now let us do what we planned[a], for we have gathered silver, and we have filled our storehouses like water[d][c][b], and many are the laborers of our houses.
translation:
  language: pt
  text: E agora façamos o que planejamos[a], pois ajuntamos prata e enchemos os nossos depósitos como água[b], e muitos são os lavradores de nossas casas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que pensamos” ou “o que concebemos”. O verbo ge'ez pode indicar tanto o pensamento quanto o planejamento.
    reason: lexical_alternative
  - marker: b
    text: “Como água” reproduz o símile literal, provavelmente uma imagem de grande abundância ou transbordamento.
    reason: cultural_note
  - marker: c
    text: “Lavradores” também pode ser entendido de modo mais amplo como “trabalhadores agrícolas”; “casas” pode, neste contexto, referir-se às unidades domésticas ou propriedades pertencentes aos ricos. A relação exata entre os termos permanece incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግበር
  choice: façamos
  rationale: A forma exortativa na primeira pessoa do plural preserva o sentido coortativo e o tom de autoconfiança dos ricos.
- source_word: ዘኀለይነ
  choice: o que planejamos
  rationale: O verbo abrange pensar, conceber e planejar; neste contexto, “planejamos” exprime melhor um propósito deliberado sem excluir a ambiguidade, registrada em nota.
- source_word: ብሩረ
  choice: prata
  rationale: Mantém o substantivo concreto e a imagem material do texto, em vez de generalizá-lo como “dinheiro”.
- source_word: አስተጋባእነ
  choice: ajuntamos
  rationale: Expressa diretamente a ação de reunir ou acumular, em linguagem natural e dignificada.
- source_word: መዛግብቲነ
  choice: os nossos depósitos
  rationale: O termo plural designa lugares onde bens ou tesouros são guardados; “depósitos” conserva a imagem física sem restringi-la a tesourarias monetárias.
- source_word: ከመ ማይ
  choice: como água
  rationale: Preserva o símile literal e incomum, provavelmente alusivo à abundância, sem explicá-lo dentro do texto.
- source_word: ሐራስተ
  choice: lavradores
  rationale: O termo aponta para pessoas que lavram ou cultivam a terra; “lavradores” é preciso e mantém a dimensão agrícola.
- source_word: አብያቲነ
  choice: nossas casas
  rationale: Conserva o sentido lexical básico. “Propriedades” ou “domínios” tornaria explícita uma interpretação contextual que o original não exige.
theological_decisions:
- issue: Tom da fala dos ricos no contexto de condenação
  choice: 'Autoconvocação confiante: “façamos o que planejamos”'
  alternative: 'Declaração neutra de intenção: “faremos o que pensamos”'
  rationale: O coortativo preserva a força retórica da jactância dos ricos no contexto de juízo, sem acrescentar qualificações morais ausentes deste versículo.
- issue: Relação entre os lavradores e as “casas”
  choice: Preservar a formulação literal e explicar a possível extensão de sentido em nota
  alternative: Interpretar diretamente como “trabalhadores rurais de nossas propriedades”
  rationale: “Casas” pode designar casas, famílias, unidades domésticas ou propriedades. A tradução não deve resolver silenciosamente essa tensão.
translation_notes:
  register: Português moderno, amplamente internacional e legível no Brasil, com tom solene sem arcaísmo excessivo. A ordem e as imagens do ge'ez foram mantidas sempre que compreensíveis; as ambiguidades de “planejar/pensar”, do símile “como água” e de “lavradores de nossas casas” foram preservadas e esclarecidas em notas.
