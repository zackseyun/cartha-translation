base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/008.yaml
  text: Woe to you who acquire silver and gold not by righteousness[a], and say, ‘We have become rich with wealth, and we have acquired possessions[c][b], and we have acquired everything we desired.’
translation:
  language: pt
  text: 'Ai de vocês que adquirem prata e ouro sem justiça[a] e dizem: “Nós nos enriquecemos com riquezas, os bens passaram a ser nossos[b] e adquirimos tudo o que desejamos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não de modo justo” ou “sem retidão”; a expressão pode indicar o modo de adquirir a riqueza ou, mais amplamente, o caráter moral desse ganho.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e bens vieram a ser para nós”; isto é, “e passamos a possuir bens”.
    reason: source_clarification
lexical_decisions:
- source_word: አሌ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo, em linguagem bíblica clara e atual.
- source_word: ታጠርዩ / አጥረይነ
  choice: adquirem / adquirimos
  rationale: Mantém a repetição retórica do mesmo verbo de obtenção ou acumulação no início e no fim do versículo.
- source_word: ብሩረ ወወርቀ
  choice: prata e ouro
  rationale: Reproduz diretamente o par de metais preciosos usado como expressão de riqueza.
- source_word: ዘአኮ በጽድቅ
  choice: sem justiça
  rationale: Conserva a categoria ética do original e permite que a frase qualifique tanto o modo de adquirir quanto o caráter moral do ganho.
- source_word: ብዕልነ ብዕለ
  choice: nós nos enriquecemos com riquezas
  rationale: Preserva a ênfase e a redundância deliberada da jactância no texto etíope.
- source_word: ወኮነ ለነ ንዋይ
  choice: os bens passaram a ser nossos
  rationale: Representa como oração própria a afirmação de que os bens vieram a pertencer aos ricos, sem omitir esse segundo elemento da jactância.
- source_word: ኵሎ ዘፈቀድነ
  choice: tudo o que desejamos
  rationale: Mantém a abrangência totalizante e o vocabulário de desejo ou vontade.
theological_decisions:
- issue: Sentido moral de በጽድቅ na denúncia da riqueza adquirida
  choice: sem justiça
  alternative: de modo injusto; sem retidão
  rationale: “Justiça” preserva a amplitude moral e teológica do termo, enquanto a construção “sem justiça” evita restringi-lo apenas à legalidade ou apenas ao método de aquisição.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fórmula “Ai de vocês” mantém o tom profético; a redundância “nos enriquecemos com riquezas” foi preservada por refletir a ênfase do original. As três afirmações da jactância permanecem distintas.
