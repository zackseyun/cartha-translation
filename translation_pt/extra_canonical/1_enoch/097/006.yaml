base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/006.yaml
  text: And all the words of your lawlessness shall be read out before the Great Holy One[a], and your faces shall be put to shame[c][b], and every deed that is founded in lawlessness shall be rejected.
translation:
  language: pt
  text: E todas as palavras da injustiça de vocês serão lidas diante do Grande Santo[a]; seus rostos serão envergonhados, e toda obra firmada na injustiça será rejeitada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante do Grande e Santo”. O texto citado não traz uma conjunção explícita entre os dois termos.'
    reason: lexical_alternative
  - marker: b
    text: 'A última oração também pode ser traduzida: “toda obra feita na injustiça será lançada fora”. O verbo parece sugerir algo firmado ou estabelecido, mas a nuance exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነበብ
  choice: serão lidas
  rationale: Conserva o sentido passivo de leitura pública no cenário de juízo, sem acrescentar explicitamente uma ideia de proclamação.
- source_word: ኵሉ ነገረ
  choice: todas as palavras
  rationale: ነገር admite 'palavra', 'assunto' ou 'coisa'; em combinação com 'serão lidas', 'palavras' preserva bem a imagem de um registro ou acusação lida publicamente.
- source_word: ዓመፃክሙ
  choice: da injustiça de vocês
  rationale: O termo pode abranger transgressão, rebeldia, violência e injustiça. 'Injustiça' mantém sua força moral e judicial em português corrente, sem restringi-lo à violência física.
- source_word: ቅድመ ዐቢይ ቅዱስ
  choice: diante do Grande Santo
  rationale: Reproduz a sequência sem acrescentar uma conjunção e trata a expressão como título divino no contexto apocalíptico.
- source_word: ይትኀፈር ገጽክሙ
  choice: o rosto de vocês será envergonhado
  rationale: Preserva o rosto como portador visível da desonra e evita introduzir a metáfora ausente de ser 'coberto' de vergonha. O singular coletivo é mais natural em português com 'vocês'.
- source_word: ይገደፍ
  choice: será rejeitada
  rationale: Expressa repúdio ou descarte em contexto judicial, sem especificar indevidamente condenação ou destruição.
- source_word: ተግባረ
  choice: obra
  rationale: '''Obra'' mantém o sentido de ação ou feito moral e combina naturalmente com a ideia de algo firmado ou estabelecido.'
- source_word: ዘጸንዐ በዓመፃ
  choice: firmada na injustiça
  rationale: Preserva a noção mais forte de algo estabelecido, consolidado ou fundamentado, em vez de reduzi-la simplesmente a algo 'feito' na injustiça.
theological_decisions:
- issue: Tradução do título divino ዐቢይ ቅዱስ
  choice: o Grande Santo
  alternative: o Grande e Santo
  rationale: A expressão funciona como título divino reverente. 'Grande Santo' segue a ordem do ge'ez e não insere a conjunção ausente do texto citado.
- issue: Amplitude moral de ዓመፃ
  choice: injustiça
  alternative: transgressão
  rationale: '''Injustiça'' preserva a dimensão moral e judicial e pode incluir opressão ou violência, sem reduzir o termo à infração de uma lei explicitamente mencionada.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para explicitar o plural do ge'ez, mantém a cadência solene do juízo e conserva as ambiguidades lexicais relevantes em notas.
