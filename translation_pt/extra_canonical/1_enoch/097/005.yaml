base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/005.yaml
  text: And in those days the prayers of the holy ones will reach the Lord[b][a], and the days of your judgment will come upon you.
translation:
  language: pt
  text: E naqueles dias, as orações dos santos[a] chegarão ao Senhor, e chegarão a vocês os dias do seu julgamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as orações dos que são santos”. O termo ge''ez significa literalmente “santos” ou “seres santos”.'
    reason: lexical_alternative
  - marker: b
    text: A frase final é textualmente difícil neste testemunho. É provável que se refira à chegada dos dias de prestação de contas ou de punição para os perversos aqui interpelados.
    reason: textual_variant
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e a repetição de «dias» no versículo.
- source_word: ትበጽኅ ጸሎቶሙ
  choice: as orações ... chegarão
  rationale: O verbo expressa chegada a um destino; «chegarão ao Senhor» conserva a imagem das súplicas que o alcançam.
- source_word: ለቅዱሳን
  choice: dos santos
  rationale: É uma forma natural e reconhecível em português para o sentido literal de pessoas santas, sem definir se são seres humanos ou celestiais; a nota registra a alternativa mais transparente.
- source_word: ኀበ እግዚእ
  choice: ao Senhor
  rationale: Expressa de modo natural a direção indicada pela preposição diante de «Senhor».
- source_word: ይበጽሕ መዋዕለ ኵነክሙ
  choice: chegarão a vocês os dias do seu julgamento
  rationale: Mantém a repetição do verbo de chegada e verte o substantivo textualmente difícil como «julgamento», adequado ao contexto judicial e apocalíptico sem especificar destruição física.
theological_decisions:
- issue: Identidade de ቅዱሳን
  choice: «santos», sem restringir explicitamente a referência
  alternative: «os que são santos»; anjos; uma categoria ampla de seres santos celestiais e terrenos
  rationale: O contexto provavelmente aponta para os justos oprimidos cujas orações chegam a Deus, mas a expressão, por si só, não exclui outra identificação. A tradução preserva essa abertura.
- issue: Sentido da frase final textualmente difícil
  choice: «os dias do seu julgamento»
  alternative: «os dias da sua destruição»; «os dias do seu castigo»
  rationale: «Julgamento» conserva a força de prestação de contas adversa no contexto dos ais sem resolver a dificuldade textual em favor de uma forma específica de punição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a cadência apocalíptica por meio da repetição de «dias» e «chegarão». Os marcadores aparecem junto aos termos que explicam.
