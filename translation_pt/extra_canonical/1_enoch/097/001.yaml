base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/001.yaml
  text: Trust[a], you righteous, for sinners will become a disgrace[b], and they will perish on the day of iniquity.
translation:
  language: pt
  text: Confiem[a], ó justos, pois os pecadores se tornarão objeto de desprezo[b] e perecerão no dia da iniquidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenham confiança” ou “Creiam”. O objeto da confiança não é expresso no texto.'
    reason: lexical_ambiguity
  - marker: b
    text: Também pode ser traduzido por “motivo de vergonha” ou “destinados ao opróbrio”.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ተአመኑ
  choice: Confiem
  rationale: Imperativo plural do verbo ligado a crer e confiar. “Confiem” mantém a exortação e não explicita um objeto que o texto ge'ez deixa implícito.
- source_word: ጻድቃን
  choice: ó justos
  rationale: Preserva o vocativo plural e mantém clara a oposição ética entre os justos e os pecadores.
- source_word: ለጽእለት
  choice: objeto de desprezo
  rationale: Expressa o destino de vergonha, opróbrio ou desprezo indicado pela construção, sem reduzir o sentido a uma emoção subjetiva.
- source_word: ይከውኑ
  choice: se tornarão
  rationale: Reproduz o valor futuro de vir a ser e se ajusta naturalmente ao predicativo “objeto de desprezo”.
- source_word: ኃጥኣን
  choice: os pecadores
  rationale: É a designação moral e religiosa corrente e conserva o contraste apocalíptico com “os justos”.
- source_word: ወይትሐጕሉ
  choice: e perecerão
  rationale: O verbo deriva da raiz ሐጕለ, associada a perecer ou ser destruído. O contexto imediato, inclusive o vocabulário de destruição no versículo seguinte, apoia “perecerão”.
- source_word: በዕለተ ዓመፃ
  choice: no dia da iniquidade
  rationale: ዓመፃ denota iniquidade, transgressão ou injustiça. “Iniquidade” preserva o tom solene de juízo e evita restringir o termo à violência física.
theological_decisions:
- issue: Se o imperativo inicial indica confiança interior ou fé religiosa especificamente dirigida a Deus
  choice: Confiem
  alternative: Creiam; tenham coragem
  rationale: “Confiem” conserva tanto a dimensão de fé quanto a de segurança diante do juízo, sem acrescentar um objeto não expresso no ge'ez.
- issue: Se o fim dos pecadores deve ser entendido como entrega judicial ou destruição
  choice: perecerão
  alternative: serão destruídos
  rationale: A raiz verbal favorece claramente a ideia de perecer ou ser destruído. A forma intransitiva portuguesa preserva a formulação do texto sem identificar um agente.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e compreensão internacional. O vocativo “ó justos” conserva a dignidade do registro apocalíptico sem soar excessivamente arcaico.
