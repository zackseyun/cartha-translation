base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/007.yaml
  text: Woe to you[a], sinners, who are in the midst of the sea and upon the dry land[b], whose memory is evil against you.
translation:
  language: pt
  text: Ai de vocês, pecadores, que estão no meio do mar e sobre a terra seca[a], cuja lembrança é má contra vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A combinação “no meio do mar e sobre a terra seca” provavelmente amplia a denúncia a toda parte onde as pessoas estejam ou viajem.
    reason: cultural_note
  - marker: b
    text: A oração final é difícil. Também pode significar “a memória de vocês é má”, “o memorial de vocês é mau” ou “uma lembrança má se apega a vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Ai de vocês
  rationale: Conserva a fórmula profética de denúncia e juízo, em linguagem corrente e solene.
- source_word: ኃጥኣን
  choice: pecadores
  rationale: Tradução direta da categoria moral designada no texto.
- source_word: ማእከለ፡ ባሕር
  choice: no meio do mar
  rationale: Mantém a imagem espacial concreta do ge’ez, sem generalizá-la como mera referência a viagens marítimas.
- source_word: ወዲበ፡ የብስ
  choice: e sobre a terra seca
  rationale: Preserva o contraste marcado entre mar e terra firme.
- source_word: ዝክርሙ
  choice: a lembrança de vocês
  rationale: Mantém aberta a possibilidade de memória, reputação lembrada ou memorial, evitando restringir o termo a uma lembrança subjetiva.
- source_word: እኩይ
  choice: má
  rationale: Expressa de modo simples o juízo moral negativo do predicado.
- source_word: ዴቤክሙ
  choice: contra vocês
  rationale: Reproduz a provável força adversativa da forma difícil, sem explicitar além do texto como essa lembrança atua contra os pecadores.
theological_decisions:
- issue: Sentido da oração final referente à lembrança
  choice: a lembrança de vocês é má contra vocês
  alternative: a memória de vocês é má; o memorial de vocês é mau; uma lembrança má se apega a vocês
  rationale: A formulação preserva a dificuldade lexical e sintática do ge’ez e seu possível tom judicial, sem transformar explicitamente a lembrança em acusação nem decidir se se trata de memória, reputação ou memorial.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A construção incomum da oração final foi mantida de propósito para não eliminar a ambiguidade do texto-fonte.
