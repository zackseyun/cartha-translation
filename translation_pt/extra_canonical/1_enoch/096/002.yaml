base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/002.yaml
  text: And on the day of the judgment of sinners[a], your children will rise up and be lifted up like eagles, and your nest will be higher than the vultures. You will go up and enter the clefts of the earth and the fissures of the rock forever, like coneys before the lawless[f][e][d][c][b]; and the sirens will groan over you and weep.
translation:
  language: pt
  text: E, no dia da aflição dos pecadores[a], seus filhos se erguerão e serão elevados como águias, e o abrigo de vocês ficará acima dos abutres[b]. Vocês subirão e entrarão nas fendas da terra e nas rachaduras da rocha para sempre, como hiraxes[c] fugindo da presença dos transgressores; e as sereias[d] gemerão sobre vocês e chorarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no dia do castigo dos pecadores”. O termo etíope pode indicar aflição, angústia ou sofrimento punitivo.
    reason: lexical_alternative
  - marker: b
    text: O termo traduzido por “abrigo” é textualmente difícil e também pode indicar um lugar sombreado, uma morada ou, no contexto da imagem das águias, um ninho.
    reason: textual_variant
  - marker: c
    text: Os hiraxes são pequenos mamíferos que vivem entre rochas; em traduções antigas, o termo costuma aparecer como “coelhos” ou “coelhos-das-rochas”.
    reason: cultural_note
  - marker: d
    text: Aqui, “sereias” designa criaturas lamentadoras associadas a lugares desolados na antiga tradição grega e bíblica, não necessariamente as figuras marinhas do imaginário moderno.
    reason: cultural_note
lexical_decisions:
- source_word: ምንዳቤሆሙ
  choice: aflição dos pecadores
  rationale: O substantivo pode indicar aflição, angústia ou sofrimento punitivo. “Aflição” conserva tanto a experiência de sofrimento quanto a possível dimensão judicial, sem restringir o sentido a uma sentença formal.
- source_word: ይትሌዐሉ / ይትነሥኡ
  choice: se erguerão e serão elevados
  rationale: Mantém os dois verbos e o paralelismo enfático de elevação, sem reduzi-los a uma única ação.
- source_word: አንስርት
  choice: águias
  rationale: É o sentido zoológico usual e preserva a imagem de elevação majestosa.
- source_word: እጐለ ዚአክሙ
  choice: seus filhos
  rationale: Expressa de modo natural a descendência pertencente aos destinatários no plural.
- source_word: ምጽላልክሙ
  choice: o abrigo de vocês
  rationale: A forma é difícil e pode designar um lugar sombreado, morada ou refúgio. “Abrigo” preserva essa amplitude melhor que a especificação metafórica “ninho”.
- source_word: ንደብታተ ምድር
  choice: as fendas da terra
  rationale: Reproduz os lugares partidos ou abertos do solo e mantém a imagem de refúgio.
- source_word: ንቅዓታተ ኰኵሕ
  choice: as rachaduras da rocha
  rationale: Designa aberturas ou fissuras na rocha em linguagem clara e concreta.
- source_word: ጊሔ
  choice: hiraxes
  rationale: O referente mais provável é o pequeno mamífero que vive entre rochas, tradicionalmente chamado “coelho-das-rochas” ou “daman”; “hiraxes” evita identificá-lo erroneamente como coelho.
- source_word: እምቅድመ ዓማፅያን
  choice: fugindo da presença dos transgressores
  rationale: እምቅድመ significa literalmente “de diante de” e, neste contexto de busca de refúgio, comunica afastamento ou fuga da presença de malfeitores.
- source_word: ጼደናት
  choice: sereias
  rationale: É um empréstimo relacionado ao grego σειρῆνες, usado para criaturas lamentadoras de regiões desoladas; não deriva do termo etíope para “justo”.
theological_decisions:
- issue: Identidade dos destinatários e contraste com os pecadores
  choice: As formas da segunda pessoa do plural são entendidas como dirigidas à comunidade contrastada com os pecadores, cuja descendência é elevada.
  alternative: As referências na segunda pessoa podem ser tomadas de modo mais geral, sobretudo por causa das dificuldades textuais da parte central.
  rationale: O contexto literário contrapõe os pecadores aos destinatários, mas a tradução não acrescenta uma identificação doutrinária mais específica.
- issue: Valor judicial de ምንዳቤሆሙ
  choice: aflição
  alternative: julgamento ou castigo
  rationale: O termo comporta sofrimento aflitivo e punitivo. A opção escolhida preserva a tensão entre experiência de angústia e juízo, em vez de resolver a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa no plural expressas por “vocês”. A tradução conserva o paralelismo, as imagens animais e a estranheza apocalíptica do texto, esclarecendo em notas os termos zoológicos e textualmente incertos.
