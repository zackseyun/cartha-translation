base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/003.yaml
  text: But you[a], do not fear—you who have suffered—for healing will come to you, and a bright light will shine for you[b], and you will hear the voice of rest from heaven.
translation:
  language: pt
  text: Mas vocês, que têm sofrido[a], não tenham medo, pois haverá cura para vocês; uma luz brilhante resplandecerá para vocês, e vocês ouvirão do céu uma voz de descanso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vocês que estão aflitos” ou “vocês que sentem dor”; a expressão em ge'ez pode abranger sofrimento, dor ou aflição de modo geral.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “voz/palavra de descanso”. A expressão foi mantida próxima do ge'ez, em vez de ser parafraseada como “paz” ou “consolo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: não tenham medo
  rationale: Imperativo negativo plural dirigido aos ouvintes; é natural em português atual e conserva a força direta da exortação.
- source_word: እለ ሐመምክሙ
  choice: vocês, que têm sofrido
  rationale: Identifica os destinatários por sua experiência de sofrimento ou aflição, sem limitar o sentido à dor física.
- source_word: ፈውስ
  choice: cura
  rationale: Preserva tanto a ideia de cura quanto a de restauração mais ampla, adequada ao contexto de consolo.
- source_word: ይከውነክሙ
  choice: haverá ... para vocês
  rationale: O verbo tem o sentido amplo de ser, tornar-se ou acontecer; esta formulação portuguesa mantém a promessa sem especificar indevidamente o modo de sua realização.
- source_word: ብርሃነ ብሩህ
  choice: uma luz brilhante
  rationale: Reproduz a imagem enfática de luz intensa em linguagem clara e natural.
- source_word: ያበርህ ለክሙ
  choice: resplandecerá para vocês
  rationale: Conserva a imagem iluminadora e a orientação pessoal expressa pelo dativo.
- source_word: ቃለ ዕረፍት
  choice: uma voz de descanso
  rationale: Mantém a imagem auditiva e o sentido primário de descanso ou repouso, sem substituí-lo interpretativamente por paz ou consolo.
- source_word: እምሰማይ
  choice: do céu
  rationale: Forma idiomática em português para indicar a origem celeste da voz.
theological_decisions:
- issue: Se ቃለ ዕረፍት deve receber uma formulação teológica mais interpretativa
  choice: uma voz de descanso
  alternative: uma voz de paz; uma palavra de consolo
  rationale: O ge'ez aponta primeiramente para descanso ou repouso. Preservar essa expressão mantém a promessa própria do texto e evita harmonizá-la com linguagem religiosa posterior.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de “vocês” para o plural. A construção incomum “voz de descanso” foi preservada deliberadamente por sua concretude e ambiguidade no texto-fonte.
