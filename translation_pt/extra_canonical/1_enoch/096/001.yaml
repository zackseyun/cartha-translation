base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/001.yaml
  text: Hope[a], you righteous, for the sinners will swiftly be destroyed from before you, and authority over them will be yours[c][b], according to your desire.
translation:
  language: pt
  text: Tenham esperança, justos,[a] pois os pecadores serão rapidamente destruídos de diante de vocês,[b] e vocês terão autoridade sobre eles,[c] conforme o desejo de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Tenham confiança, ó justos». O imperativo inicial dirige-se diretamente aos justos.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «de diante de vocês»; a expressão preserva a imagem dos pecadores sendo removidos da presença dos justos.
    reason: lexical_alternative
  - marker: c
    text: 'A expressão «autoridade sobre eles» descreve uma inversão apocalíptica: os justos recebem domínio sobre aqueles que agora são julgados, sem que o versículo explique como esse domínio será exercido.'
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: Tenham esperança
  rationale: O imperativo plural exorta diretamente os destinatários a esperar ou confiar; a formulação mantém essa força sem acrescentar uma interpretação.
- source_word: ጻድቃን
  choice: justos
  rationale: O substantivo plural funciona como vocativo, identificando os destinatários da exortação.
- source_word: ፍጡነ
  choice: rapidamente
  rationale: Conserva o valor adverbial ligado à destruição e indica rapidez, sem transformar a afirmação em uma indicação necessariamente cronológica de proximidade como faria «em breve».
- source_word: ይትሀጐሉ
  choice: serão destruídos
  rationale: A forma verbal, neste contexto de juízo, comunica ruína ou destruição; a voz passiva preserva a formulação do texto sem especificar o agente ou o modo.
- source_word: ኃጥኣን
  choice: os pecadores
  rationale: Designa o grupo posto em contraste com os justos e submetido ao juízo.
- source_word: እምቅድሜክሙ
  choice: de diante de vocês
  rationale: Mantém a imagem espacial concreta de retirada da presença dos justos, em vez de suavizá-la para uma paráfrase abstrata.
- source_word: ሥልጣን
  choice: autoridade
  rationale: Expressa poder de governo ou domínio, e não apenas força bruta ou simples vindicação.
- source_word: ይከውን ለክሙ ዲቤሆሙ
  choice: vocês terão autoridade sobre eles
  rationale: Reproduz de modo natural em português tanto a posse futura da autoridade quanto sua relação com aqueles que estão sob ela.
- source_word: በከመ ፈቀድክሙ
  choice: conforme o desejo de vocês
  rationale: Preserva a correspondência entre a autoridade prometida e o desejo ou vontade dos justos, sem tornar a expressão coloquial nem definir além do texto a natureza desse desejo.
theological_decisions:
- issue: Natureza da futura relação dos justos com os pecadores
  choice: Afirmar que os justos terão verdadeira autoridade sobre os pecadores julgados.
  alternative: Entender a expressão apenas como triunfo moral ou vindicação pública dos justos.
  rationale: O substantivo ሥልጣን, acompanhado da expressão «sobre eles», indica mais que consolo ou reconhecimento. A tradução conserva a inversão apocalíptica de posições sem especificar como essa autoridade será exercida.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção natural para leitores brasileiros. O vocativo «justos» mantém o discurso direto; «rapidamente» evita confundir velocidade com a ideia temporal específica de «em breve». A expressão espacial «de diante de vocês» foi mantida por sua força imagética, e a linguagem de autoridade foi preservada sem suavização doutrinária.
