base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/007.yaml
  text: And those toward the east were of colored stone, and one was of pearl stone, and one of healing stone; and those toward the south were of red stone.
translation:
  language: pt
  text: E as que davam para o leste eram de pedra colorida; uma era de pedra de pérola, e outra, de pedra de cura. As que davam para o sul eram de pedra vermelha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽባሕ
  choice: leste
  rationale: No contexto direcional, o termo ligado à manhã/nascente indica o leste.
- source_word: እብነ ሕብር
  choice: pedra colorida
  rationale: Tradução direta da expressão formada por “pedra” e “cor/colorido”, sem especificar uma tonalidade ausente no texto.
- source_word: እብነ ባሕርይ
  choice: pedra de pérola
  rationale: Conserva a identificação tradicional com pérola e a construção explícita com “pedra” presente no ge'ez.
- source_word: እብነ ፈውስ
  choice: pedra de cura
  rationale: ፈውስ designa cura/remédio; “de cura” preserva o sentido sem substituir por “preciosa”.
- source_word: አዜብ
  choice: sul
  rationale: Termo direcional para o sul.
- source_word: እብነ ቀይሕ
  choice: pedra vermelha
  rationale: Representa diretamente “pedra” e o adjetivo “vermelha”.
