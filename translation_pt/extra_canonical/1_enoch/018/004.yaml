base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/004.yaml
  text: And I saw the winds that turn the sky and cause the disk of the sun and all the stars to set[a][b].
translation:
  language: pt
  text: E vi os ventos que fazem o céu girar e levam o disco do sol e todas as estrelas a se pôr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazem o céu se mover”. O verbo descreve movimento ou rotação; “girar” preserva a imagem cósmica, mas o grau exato desse movimento não é inteiramente certo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: Preserva a fórmula narrativa visionária na primeira pessoa em português natural e digno.
- source_word: ነፋሳተ
  choice: os ventos
  rationale: No contexto cosmológico imediato, o sentido concreto de forças do vento é preferível a “espíritos”, que introduziria personificação não explícita.
- source_word: እለ ይመይጥዋ ለሰማይ
  choice: que fazem o céu girar
  rationale: Expressa o movimento causativo ou impulsionado do céu e mantém a imagem cósmica, sem recorrer a terminologia astronômica excessivamente técnica.
- source_word: ወእለ ያዐርቡ
  choice: e levam ... a se pôr
  rationale: 'Entende ያዐርቡ como forma causativa do verbo usado para o ocaso dos astros: os ventos fazem ou levam os luminares a se pôr.'
- source_word: ለክበበ ፀሐይ
  choice: o disco do sol
  rationale: ክበበ designa algo circular ou envolvente; “disco” conserva a imagem visível sem impor um sentido astronômico posterior.
- source_word: ወኵሎ ከዋክብተ
  choice: e todas as estrelas
  rationale: Reproduz naturalmente em português o valor coletivo e abrangente da expressão.
theological_decisions:
- issue: Se ነፋሳተ designa ventos cósmicos impessoais ou espíritos/seres angélicos
  choice: ventos cósmicos
  alternative: espíritos ou espíritos dos ventos
  rationale: A descrição imediata trata das forças que movem o céu e os luminares; “ventos” preserva a cosmologia apocalíptica sem acrescentar agência pessoal não indicada no versículo.
- issue: Sentido de ያዐርቡ em relação ao sol e às estrelas
  choice: levam ... a se pôr
  alternative: fazem ... se aproximar
  rationale: A leitura pelo verbo ዐረበ, usado para o ocaso ou descida dos astros, explica a forma causativa e evita confundi-la com outra raiz que significa aproximar-se.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o tom visionário solene, evita arcaísmos e conserva a imagem cosmológica do texto.
