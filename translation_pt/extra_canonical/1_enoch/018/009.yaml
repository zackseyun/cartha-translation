translation:
  language: pt
  text: E vi um fogo ardente que estava dentro de todos os montes[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cláusula traduzida como “que estava” é difícil neste testemunho etíope e pode refletir uma redação abreviada ou corrompida. O sentido parece indicar algo presente no interior dos montes, relacionado ao fogo.
    reason: textual_variant
  - marker: b
    text: 'Ou: “E vi um fogo ardendo e o que estava dentro de todos os montes.”'
    reason: previous_rendering
lexical_decisions:
- source_word: እሳተ
  choice: um fogo
  rationale: Mantém o substantivo singular e indefinido, sem especificar a origem ou a função do fogo além do que diz o texto.
- source_word: ዘይነድድ
  choice: ardente
  rationale: Expressa de modo natural o estado contínuo do fogo, preservando a força da imagem visionária.
- source_word: ርኢኩ
  choice: vi
  rationale: Verbo na primeira pessoa, próprio do relato visionário; a formulação simples preserva o estilo recorrente do livro.
- source_word: ወዘሀሎ
  choice: que estava
  rationale: Entendido como uma segunda oração relativa que retoma “fogo”; contudo, a dificuldade textual é registrada em nota.
- source_word: ውስተ፡ ኵሉ፡ አድባር
  choice: dentro de todos os montes
  rationale: Preserva a localização interior indicada por ውስተ e a abrangência coletiva de ኵሉ, sem reduzir a imagem a uma posição superficial.
theological_decisions:
- issue: Natureza da imagem do fogo nos montes
  choice: Manter a imagem apocalíptica concreta de fogo dentro dos montes.
  alternative: Interpretá-la como símbolo geral de juízo divino ou como fenômeno natural subterrâneo.
  rationale: O contexto apresenta uma topografia visionária; a tradução relata o que foi visto sem alegorizar nem explicar naturalisticamente a cena.
- issue: Relação sintática da cláusula ወዘሀሎ com o fogo
  choice: 'Entendê-la como oração relativa que descreve o fogo: “que estava”.'
  alternative: 'Entendê-la como um segundo objeto: “e o que estava dentro”.'
  rationale: A leitura relativa produz uma construção coerente, paralela à primeira oração relativa, mas a alternativa continua possível diante da forma difícil do testemunho e por isso é preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Montes” foi preferido a “montanhas” para conservar um tom bíblico moderado sem arcaísmo excessivo. As notas mantêm visível a ambiguidade textual e sintática do ge'ez.
