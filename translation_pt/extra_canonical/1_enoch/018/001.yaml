base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/001.yaml
  text: And I saw the storehouses of all the winds[b][a], and I saw how with them he adorned all creation and the foundations of the earth.
translation:
  language: pt
  text: E vi os depósitos[a] de todos os ventos; e vi como, por meio deles, ele adornou[b] toda a criação e os fundamentos da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «armazéns» ou «tesouros». A imagem é de recintos celestes onde os ventos são guardados.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ter o sentido de «ordenou» ou «estabeleceu», e não apenas o de «adornou».
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: depósitos
  rationale: O substantivo designa tesouros, armazéns ou depósitos. «Depósitos» conserva a imagem concreta de recintos celestes onde os ventos são guardados, sem a conotação predominantemente financeira de «tesouros».
- source_word: ኵሉ ነፋሳት
  choice: todos os ventos
  rationale: Embora ነፋሳት também possa significar «espíritos» ou «sopros», o contexto cosmológico e a imagem de depósitos celestes favorecem «ventos».
- source_word: ከመ
  choice: como
  rationale: Introduz o conteúdo da visão e expressa a maneira pela qual os ventos participam da ordenação da criação.
- source_word: ቦሙ
  choice: por meio deles
  rationale: Retoma os ventos com valor instrumental. A formulação explicita com naturalidade que eles são o meio empregado, sem alterar o referente.
- source_word: አሰርገወ
  choice: adornou
  rationale: Preserva o sentido vívido de adornar ou embelezar presente no verbo ge'ez. Uma nota registra que o termo também pode envolver a ideia de ordenar ou estabelecer.
- source_word: ኵሎ ፍጥረተ
  choice: toda a criação
  rationale: A expressão coletiva e universal é natural em português e corresponde ao alcance cósmico da passagem.
- source_word: መሰረታቲሃ ለምድር
  choice: os fundamentos da terra
  rationale: Mantém a imagem arquitetônica concreta da cosmografia apocalíptica e entende o sufixo como referente à terra.
theological_decisions:
- issue: Se ነፋሳት deve ser traduzido como «ventos» ou «espíritos»
  choice: ventos
  alternative: espíritos; sopros
  rationale: A sequência descreve fenômenos e estruturas cósmicas. «Ventos» se ajusta melhor aos depósitos celestes e evita introduzir uma leitura angelológica que o contexto não exige.
- issue: Se አሰርገወ descreve o embelezamento ou o estabelecimento da criação
  choice: adornou
  alternative: ordenou; estabeleceu; embelezou
  rationale: O testemunho ge'ez sustenta a imagem de adornar ou embelezar. Como o objeto inclui os fundamentos da terra, também pode haver uma nuance de ordenação ou estabelecimento; a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se a repetição «E vi», própria do relato visionário, e a imagem cosmológica concreta do original.
