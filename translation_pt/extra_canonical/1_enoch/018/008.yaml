base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/008.yaml
  text: And the middle one reached to heaven[a], like the throne of the Lord, which was of crystal stone[d][c][b], and the top of the throne was of sapphire stone.
translation:
  language: pt
  text: E o do meio[a] se elevava até o céu, como o trono do Senhor, que era de pedra cristalina[b]; e o topo do trono[c] era de pedra de safira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, no meio, ele se elevava”. O referente e a construção exata da expressão são incertos.'
    reason: alternative_reading
  - marker: b
    text: O termo traduzido como “cristalina” é lexicalmente incerto; parece designar um material brilhante ou precioso.
    reason: lexical_alternative
  - marker: c
    text: A expressão traduzida como “o topo do trono” é difícil; pode referir-se, de modo mais geral, à parte superior ou ao cume da estrutura associada ao trono.
    reason: alternative_reading
lexical_decisions:
- source_word: ማእከላይሰ
  choice: o do meio
  rationale: A expressão designa o elemento central da visão sem explicitar um referente que este versículo não nomeia. A formulação também permite a leitura espacial registrada em nota.
- source_word: ይጐድእ እስከ ሰማይ
  choice: se elevava até o céu
  rationale: O verbo descreve extensão ou ascensão para cima, e እስከ marca o limite alcançado. A expressão portuguesa conserva tanto a direção vertical quanto a extensão até o céu.
- source_word: ከመ መንበረ ለእግዚአብሔር
  choice: como o trono do Senhor
  rationale: ከመ introduz uma comparação. A tradução mantém a imagem como símile, sem identificar o objeto contemplado com o próprio trono divino.
- source_word: እምእብነ ፑክ
  choice: de pedra cristalina
  rationale: O nome do material é incerto, mas parece indicar uma pedra clara, brilhante ou preciosa. “Pedra cristalina” preserva a imagem mineral e evita tratá-la com certeza excessiva como cristal em sentido técnico.
- source_word: ይማሑ ለመንበሩ
  choice: o topo do trono
  rationale: A frase parece indicar a parte superior ou o cume associado ao trono. A tradução oferece uma imagem arquitetônica inteligível, enquanto a nota preserva a dificuldade da construção.
- source_word: እምእብነ ሰንፔር
  choice: de pedra de safira
  rationale: O nome da gema é tradicionalmente entendido como safira. A presença de “pedra” reproduz a ênfase material da construção em ge’ez.
theological_decisions:
- issue: Tradução de እግዚአብሔር
  choice: o Senhor
  alternative: Deus; o Senhor Deus
  rationale: “O Senhor” traduz o título divino de modo reverente e reconhecível, sem acrescentar “Deus”, palavra que não aparece separadamente nesta expressão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e imagética. “O do meio” evita inserir “montanha” no texto deste versículo, e as notas conservam as principais incertezas do ge’ez.
