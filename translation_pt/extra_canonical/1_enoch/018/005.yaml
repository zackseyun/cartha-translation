base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/005.yaml
  text: I saw the winds upon the earth[a], which bear the clouds; I saw the paths of the angels[d][c][b]; I saw at the end of the earth the firm support of the heaven above.
translation:
  language: pt
  text: Vi os ventos sobre a terra[a], que carregam as nuvens; vi os caminhos dos anjos[b]; vi, na extremidade da terra, o firme suporte do céu lá no alto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção inicial é textual e sintaticamente difícil. Também pode ser traduzida de modo mais literal: “os ventos que estão sobre a terra, carregando as nuvens”.'
    reason: textual_variant
  - marker: b
    text: Ou “as rotas dos anjos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o alicerce do céu lá no alto”. O termo geʽez pode indicar firmeza, força sustentadora ou fundamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: vi
  rationale: Preserva a fórmula visionária na primeira pessoa e sua repetição enfática, sem arcaísmo.
- source_word: ነፋሳተ
  choice: os ventos
  rationale: O contexto descreve fenômenos e estruturas cósmicas; o sentido físico é mais adequado que “espíritos”.
- source_word: ዘዲበ ምድር
  choice: sobre a terra
  rationale: A expressão preposicional modifica “os ventos”; “terra” não é objeto do verbo seguinte. A construção também concorda com o testemunho grego citado na revisão textual.
- source_word: ዘይጸውር በደመናት
  choice: que carregam as nuvens
  rationale: Expressa a ação de levar ou sustentar as nuvens e respeita a relação sintática entre verbo e objeto.
- source_word: ፍናወ
  choice: os caminhos
  rationale: Mantém a imagem espacial concreta de rotas percorridas pelos seres celestes.
- source_word: መላእክት
  choice: dos anjos
  rationale: No contexto apocalíptico de 1 Enoque, refere-se claramente a seres celestes.
- source_word: ውስተ ጽንፈ ምድር
  choice: na extremidade da terra
  rationale: Conserva a imagem cosmológica do limite distante do mundo sem recorrer a uma expressão excessivamente idiomática.
- source_word: ጽንዐ
  choice: o firme suporte
  rationale: Comunica tanto a firmeza quanto a função de sustentação, sem restringir o termo à imagem arquitetônica de um alicerce.
- source_word: ዘሰማይ መልዕልተ
  choice: do céu lá no alto
  rationale: Torna explícita a dimensão vertical da expressão em português natural e solene.
theological_decisions:
- issue: Se ነፋሳተ deve ser traduzido por “ventos” ou “espíritos”
  choice: ventos
  alternative: espíritos
  rationale: A sequência visionária cataloga elementos da ordem cósmica — ventos, caminhos angélicos e o suporte do céu. “Ventos” preserva esse sentido local sem introduzir uma leitura espiritual ou demonológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição assindética de “vi” reproduz o ritmo breve e enfático do geʽez. A pontuação organiza as três visões sem acrescentar conjunções ausentes no texto-fonte.
