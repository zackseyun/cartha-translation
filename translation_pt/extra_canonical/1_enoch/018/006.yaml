base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/006.yaml
  text: And I went on toward the south[a], and I saw a place burning day and night[b], where there were seven mountains of precious stone—three toward the east and three toward the south.
translation:
  language: pt
  text: 'E prossegui em direção ao sul e vi um lugar que ardia dia e noite, onde havia sete montanhas de pedras preciosas[b]: três em direção ao leste e três em direção ao sul.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez transmitido menciona sete montanhas, mas especifica apenas três em direção ao leste e três em direção ao sul. Neste versículo, tal como foi preservado, não se informa a localização da sétima montanha.
    reason: textual_variant
  - marker: b
    text: “Pedras preciosas” também pode ser traduzido como “pedras valiosas” ou “pedras esplêndidas”; o ge'ez ressalta seu valor ou esplendor excepcional.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሐለፍኩ
  choice: prossegui
  rationale: Expressa a continuação do deslocamento na narrativa visionária de modo natural, sem acrescentar conteúdo.
- source_word: መንገለ አዜብ
  choice: em direção ao sul
  rationale: Preserva o valor direcional de መንገለ e o sentido geográfico de አዜብ neste contexto.
- source_word: ወርኢኩ መካነ
  choice: e vi um lugar
  rationale: Introduz naturalmente o cenário da visão sem impor uma definitude que o ge'ez não exige com clareza.
- source_word: ዘይነድድ
  choice: que ardia
  rationale: Mantém a ação contínua e a imagem vívida do lugar em chamas, sem intensificação interpretativa.
- source_word: መዐልተ ወሌሊተ
  choice: dia e noite
  rationale: Reproduz de forma concisa o par temporal que comunica continuidade.
- source_word: ኀበ ሰብዓቱ አድባር
  choice: onde havia sete montanhas
  rationale: Entende ኀበ em seu valor locativo e apresenta com clareza a relação entre o lugar e as montanhas.
- source_word: ዘእምእብን ክቡር
  choice: de pedras preciosas
  rationale: እብን significa pedra, e ክቡር pode indicar algo precioso, valioso ou esplêndido; a expressão preserva bem a imagem mineral apocalíptica.
- source_word: ፫መንገለ ጽባሕ
  choice: três em direção ao leste
  rationale: No paralelismo direcional, ጽባሕ é mais claramente entendido como leste, embora também se relacione à manhã ou ao nascer do sol.
- source_word: ወ፫መንገለ አዜብ
  choice: e três em direção ao sul
  rationale: Conserva o paralelismo direcional e a contagem transmitida, sem tentar identificar a sétima montanha.
theological_decisions:
- issue: Topografia cósmica do lugar ardente e das montanhas de pedras preciosas
  choice: Preservar literalmente a paisagem visionária.
  alternative: Generalizar como uma região de fogo ou interpretar as montanhas como estruturas celestiais.
  rationale: O versículo descreve imagens apocalípticas concretas, mas não fornece sua interpretação; traduzi-las literalmente preserva a tensão e evita impor um simbolismo doutrinário.
- issue: Contagem das sete montanhas
  choice: Manter sete no total, seguido de três ao leste e três ao sul.
  alternative: Corrigir a soma, acrescentar uma localização para a sétima ou alterar o total para seis.
  rationale: O texto ge'ez preservado apresenta essa assimetria. A tradução não deve harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prossegui” mantém o tom narrativo elevado sem soar arcaico. Os marcadores foram colocados junto às expressões que cada nota esclarece.
