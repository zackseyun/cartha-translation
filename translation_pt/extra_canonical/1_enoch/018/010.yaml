lexical_decisions:
- source_word: ወርኢኩ
  choice: E ... vi
  rationale: Preserva a fórmula narrativa da visão em linguagem portuguesa clara e digna.
- source_word: ህየ
  choice: ali
  rationale: O advérbio espacial ocorre duas vezes; repetir “ali” mantém a estrutura deíctica do original.
- source_word: መካነ
  choice: um lugar
  rationale: O substantivo introduz uma nova localização e não traz marca explícita de determinação; “um lugar” reflete essa indefinição.
- source_word: ማዕዶተ
  choice: além de
  rationale: A leitura lexical mais provável é “do outro lado de/além de”, correspondente à ideia de πέραν; a dificuldade textual é registrada em nota.
- source_word: ዐቢይ ምድር
  choice: a grande terra
  rationale: Tradução direta que conserva a geografia cósmica e o registro visionário do texto.
- source_word: ይትጋብኡ
  choice: eles se reúnem
  rationale: A forma admite valor reflexivo ou médio; “se reúnem” é natural em português e mantém a ação coletiva sem especificar um agente externo.
theological_decisions:
- issue: Geografia cósmica da expressão ligada à grande terra
  choice: além da grande terra
  alternative: nos confins da grande terra
  rationale: “Além de” segue melhor o provável valor lexical de ማዕዶተ e preserva a imagem cosmológica concreta, sem a reduzir a linguagem genérica; a alternativa tradicional é mantida em nota por causa da dificuldade do testemunho.
