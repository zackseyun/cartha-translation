base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/003.yaml
  text: And I saw how the winds support the heights of heaven[a], and they stand between heaven and earth; these are the pillars of heaven.
translation:
  language: pt
  text: E vi como os ventos sustentam as alturas do céu[a] e estão entre o céu e a terra; estes são as colunas do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo ge'ez aqui traduzido por “sustentam” é difícil e também pode ter o sentido de “estendem” ou indicar uma ação semelhante exercida sobre as alturas do céu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነፋሳት
  choice: os ventos
  rationale: No contexto desta visão cosmológica, o plural designa mais naturalmente os ventos como forças cósmicas, sem introduzir uma referência específica a espíritos pessoais.
- source_word: ይረብብዋ
  choice: sustentam
  rationale: O verbo é difícil e admite sentidos como estender ou sustentar. O contexto da estrutura celeste favorece aqui “sustentam”, mas a incerteza lexical é preservada em nota.
- source_word: አዕልና ሰማይ
  choice: as alturas do céu
  rationale: A expressão é mantida distinta das “colunas do céu” mencionadas na identificação final, evitando fundir antecipadamente os dois elementos da visão.
- source_word: ይቀውሙ
  choice: permanecem
  rationale: Expressa a ideia de estar ou manter-se em posição, com naturalidade em português e sem perder a imagem espacial.
- source_word: ማእከለ ሰማይ ወምድር
  choice: entre o céu e a terra
  rationale: É a forma idiomática e clara de transmitir a localização descrita literalmente como no meio do céu e da terra.
- source_word: እሙንቱ ውእቶሙ
  choice: essas são
  rationale: Conserva a força enfática e identificadora da construção, remetendo ao que acaba de ser visto.
- source_word: አዕማደ ሰማይ
  choice: as colunas do céu
  rationale: “Colunas” comunica com clareza os elementos estruturais cósmicos e mantém o tom elevado da visão.
theological_decisions:
- issue: Se ነፋሳት deve ser traduzido como “ventos” ou “espíritos”
  choice: ventos
  alternative: espíritos; ventos/espíritos
  rationale: A descrição trata da arquitetura e das forças do cosmos. “Ventos” se ajusta melhor à imagem física local e evita impor uma especificidade angelológica que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantém-se a repetição de “céu” e a identificação final próprias da visão apocalíptica; a ambiguidade do verbo central é explicitada em nota.
