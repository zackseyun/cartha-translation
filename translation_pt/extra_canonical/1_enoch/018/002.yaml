base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/002.yaml
  text: And I saw the cornerstones of the earth[c][b][a], and I saw the four winds that bear up the earth and the firmament of heaven.
translation:
  language: pt
  text: E vi as pedras angulares da terra[a]; vi também os quatro ventos[b] que sustentam a terra e o firmamento do céu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as pedras dos cantos da terra”. A expressão em ge’ez é arquitetônica e pode designar, na imagem visionária, as extremidades fundamentais da terra.'
    reason: lexical_alternative
  - marker: b
    text: O termo traduzido por “ventos” também pode, em outros contextos, ter os sentidos de “espíritos” ou “sopros”; aqui, o cenário cosmológico favorece “ventos”.
    reason: lexical_alternative
  - marker: c
    text: “Firmamento do céu” conserva a antiga imagem cósmica de uma expansão ou abóbada celeste estruturada.
    reason: cultural_note
lexical_decisions:
- source_word: እብነ ማእዘንተ ምድር
  choice: as pedras angulares da terra
  rationale: A construção reúne “pedras” e “cantos/ângulos”. “Pedras angulares” conserva de modo natural em português a imagem arquitetônica das extremidades fundamentais da terra.
- source_word: ምድር
  choice: terra
  rationale: O contexto é cosmológico e favorece “terra”, não o sentido local de “região” ou “solo”.
- source_word: አርባዕተ ነፋሳተ
  choice: os quatro ventos
  rationale: Embora o substantivo possa abranger vento, sopro ou espírito, o número quatro e o cenário cosmológico favorecem “ventos”, sem acrescentar “do céu”, que não está explícito.
- source_word: ይጸውርዋ
  choice: sustentam
  rationale: O verbo expressa carregar ou dar suporte. “Sustentam” é claro e preserva a figura de suporte cósmico.
- source_word: ወጽንዐ ሰማይ
  choice: e o firmamento do céu
  rationale: “Firmamento” mantém a imagem antiga de uma expansão ou abóbada celeste estruturada, em vez de reduzi-la simplesmente a “céu”.
theological_decisions:
- issue: Imagem cosmológica antiga da estrutura do mundo
  choice: Manter as imagens concretas das “pedras angulares”, dos ventos que “sustentam” e do “firmamento”.
  alternative: Generalizar como “extremidades da terra” e “forças que governam o mundo”.
  rationale: A visão apresenta uma arquitetura cósmica concreta. Preservá-la evita modernizar ou desmitologizar silenciosamente o texto apocalíptico.
- issue: Possível sobreposição semântica entre ventos, sopros e espíritos
  choice: Traduzir ነፋሳተ por “ventos”.
  alternative: Traduzir por “espíritos” ou “sopros”.
  rationale: A combinação com “quatro” e a função cosmológica torna “ventos” a leitura contextual mais provável, enquanto a nota conserva a alternativa lexical genuína.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição verbal do original foi levemente articulada com “também”, sem eliminar a sequência da visão. As imagens cosmológicas e a ambiguidade lexical relevante foram preservadas no texto e nas notas.
