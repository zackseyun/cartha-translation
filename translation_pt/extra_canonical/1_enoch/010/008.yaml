base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/008.yaml
  text: And the whole earth has been corrupted by the teaching of the works of Azazel[c][b][a]; and to him ascribe all sin.
translation:
  language: pt
  text: E toda a terra foi corrompida pelo ensino das práticas de Azazel[a]; e registra contra ele todo pecado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela instrução em seus atos”. A expressão ge''ez reúne as ideias de ensino e de atos ou práticas concretas.'
    reason: lexical_alternative
  - marker: b
    text: A cláusula também pode ser entendida como “atribui a ele todo pecado”; no contexto de juízo, porém, o verbo evoca o registro formal da culpa contra Azazel.
    reason: alternative_reading
lexical_decisions:
- source_word: ማሰነት
  choice: foi corrompida
  rationale: O verbo comunica corrupção ou ruína. A forma portuguesa preserva a força moral e cósmica do contexto de juízo.
- source_word: ኵላ ምድር
  choice: toda a terra
  rationale: Neste contexto apocalíptico, a expressão tem alcance universal, e não apenas local.
- source_word: በትምህርተ ግብሩ
  choice: pelo ensino das práticas
  rationale: A tradução mantém tanto a ideia de instrução quanto a de atos ou práticas concretas, mas evita uma construção excessivamente artificial em português.
- source_word: ለአዛዝኤል
  choice: de Azazel
  rationale: Liga as práticas a Azazel de modo conciso e natural.
- source_word: ወላዕሌሁ
  choice: e contra ele
  rationale: Preserva a conjunção e traduz ላዕሌሁ em seu sentido forense de algo registrado contra alguém.
- source_word: ጸሐፍ
  choice: registra
  rationale: O imperativo se refere ao registro formal da culpa na cena judicial; 'registra' é atual, claro e digno.
- source_word: ኵሎ ኃጢአተ
  choice: todo pecado
  rationale: Mantém a abrangência enfática da imputação sem acrescentar explicações ao texto.
theological_decisions:
- issue: Se a cláusula final manda registrar todo pecado contra Azazel ou apenas atribuí-lo a ele de modo geral
  choice: registra contra ele todo pecado
  alternative: atribui a ele todo pecado
  rationale: A preposição favorece o sentido forense de 'contra ele', e o verbo significa literalmente escrever ou registrar. A tradução conserva a imagem de um registro judicial sem diluí-la em mera atribuição abstrata.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe conserva a coordenação do ge'ez e a linguagem judicial da cláusula final.
