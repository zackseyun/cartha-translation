base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/014.yaml
  text: And when he burns and perishes[c][b][a], from now on they shall be bound together with them until the completion of the generations of generations.
translation:
  language: pt
  text: E, quando ele arder e perecer,[a] daí em diante eles serão amarrados todos juntos com eles, até se completar a sucessão das gerações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A primeira forma verbal está marcada como textualmente difícil na edição. A leitura aqui adotada é “arder”; a tradução mais antiga “levantar-se” não é seguida.
    reason: textual_variant
  - marker: b
    text: Literalmente, “até o completamento das gerações de gerações”, expressão que indica uma longa sucessão de gerações.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: E, quando
  rationale: Preserva a conjunção e o valor temporal que introduzem a etapa seguinte do juízo.
- source_word: †ይውዒ፡†
  choice: ele arder
  rationale: Apesar da marca de dificuldade textual na edição, a forma é mais bem entendida a partir do verbo 'arder', conforme a revisão filológica mais recente.
- source_word: ወይማስን
  choice: e perecer
  rationale: Representa o verbo 'perecer/ser destruído', sem importar a leitura anterior e incorreta sobre filhos.
- source_word: እምይእዜ
  choice: daí em diante
  rationale: Expressa naturalmente em português o sentido temporal de 'desde agora/em diante'.
- source_word: ምስሌሆሙ
  choice: com eles
  rationale: Mantém a associação dos condenados no castigo sem identificar além do que o contexto permite.
- source_word: ኅቡረ
  choice: todos juntos
  rationale: Conserva a força coletiva do advérbio, distinguindo-a da simples companhia expressa por 'com eles'.
- source_word: ይትአሰሩ
  choice: serão amarrados
  rationale: Mantém a imagem concreta de restrição ou encarceramento, sem substituí-la por uma interpretação mais específica.
- source_word: እስከ፡ ተፍጻሜተ
  choice: até se completar
  rationale: Reproduz o limite temporal e a noção de chegada a um termo determinado em português natural.
- source_word: ትውልደ፡ ትውልድ
  choice: a sucessão das gerações
  rationale: Comunica o idiomatismo repetido como uma longa sequência de gerações, enquanto a nota registra a forma literal.
theological_decisions:
- issue: Duração e alcance do castigo
  choice: A prisão coletiva dura até o termo de uma sucessão determinada de gerações.
  alternative: Prisão eterna ou prisão apenas até o juízo final.
  rationale: A expressão etíope combina 'até se completar' com um idiomatismo de gerações repetidas; a tradução conserva esse limite temporal sem convertê-lo em uma categoria doutrinária posterior.
- issue: Identidade dos referentes pronominais
  choice: Manter 'ele', 'eles' e 'com eles' sem explicitar suas identidades no versículo.
  alternative: Inserir nomes ou grupos inferidos do contexto.
  rationale: Os referentes dependem do contexto anterior, e explicitá-los no corpo do texto eliminaria uma ambiguidade real da forma transmitida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural no Brasil. 'Amarrados' preserva a imagem concreta do original; 'todos juntos com eles' mantém separadamente as ideias de coletividade e associação. Os marcadores [a] e [b] aparecem no texto principal.
