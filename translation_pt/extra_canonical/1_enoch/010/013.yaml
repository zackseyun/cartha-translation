base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/013.yaml
  text: And in those days they will lead them down into the abyss of fire[a], and into torment and the prison-house[b]; and there they will be shut up forever.
translation:
  language: pt
  text: E, naqueles dias, eles os levarão ao abismo de fogo[a], ao tormento e à casa de confinamento[b]; e serão encerrados para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida como «o abismo de fogo» indica literalmente um lugar inferior ou profundo de fogo; também pode ser entendida como «a profundeza de fogo» ou «a região inferior de fogo».
    reason: lexical_alternative
  - marker: b
    text: '«Casa de confinamento» preserva a imagem concreta do original: literalmente, uma casa de reclusão ou aprisionamento.'
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕል
  choice: dias
  rationale: Preserva a fórmula apocalíptica temporal «naqueles dias», natural e reconhecível em português.
- source_word: ይወስድዎሙ
  choice: eles os levarão
  rationale: Mantém indefinidos os agentes e expressa o ato de conduzir os condenados ao lugar de punição.
- source_word: መትሕተ እሳት
  choice: as profundezas de fogo
  rationale: Representa o sentido espacial de um lugar inferior ou profundo ligado ao fogo, sem importar o termo doutrinário posterior «inferno»; o plural idiomático produz uma imagem natural em português.
- source_word: በጻዕር
  choice: para o tormento
  rationale: Comunica sofrimento intenso em contexto punitivo e conserva a progressão da cena de juízo.
- source_word: ቤት ሞቅሕ
  choice: a casa de confinamento
  rationale: Preserva a imagem concreta e quase literal de uma casa destinada à reclusão, em vez de reduzi-la simplesmente a «prisão».
- source_word: ይትዓፀዉ
  choice: serão encerrados
  rationale: Expressa a voz passiva e a imagem vigorosa de fechamento e reclusão definitiva.
- source_word: ለዓለም
  choice: para sempre
  rationale: É a expressão portuguesa mais natural para a duração contínua indicada nesta fórmula de juízo.
theological_decisions:
- issue: Designação do lugar de fogo
  choice: as profundezas de fogo
  alternative: o inferno; o abismo de fogo; a profundeza de fogo
  rationale: O ge'ez oferece uma imagem espacial de profundidade ou região inferior associada ao fogo, não um rótulo doutrinário técnico. A tradução conserva a imagem e a ambiguidade lexical.
- issue: Duração do confinamento
  choice: para sempre
  alternative: pela eternidade; pela era
  rationale: No contexto punitivo, ለዓለም indica mais naturalmente duração permanente. A formulação mantém a força do texto sem desenvolver uma doutrina além do que ele afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a solenidade apocalíptica sem arcaísmos. Os marcadores [a] e [b] aparecem no texto principal.
