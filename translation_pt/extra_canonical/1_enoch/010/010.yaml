base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/010.yaml
  text: And these things that they ask of you shall not be granted to their fathers on their behalf[a]; for they hope to live an everlasting life[d][c][b], and each one of them will live five hundred years.
translation:
  language: pt
  text: E estas coisas que eles te pedem não serão concedidas aos pais deles em favor deles[a], pois esperam viver uma vida eterna; e cada um deles viverá quinhentos anos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “em favor deles” conserva a referência pronominal comprimida do ge'ez; pelo contexto, pode apontar para aqueles em cujo benefício os pais fazem os pedidos.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “quinhentos invernos”, modo idiomático de contar anos.
    reason: cultural_note
lexical_decisions:
- source_word: ዘይስእሉከ
  choice: que eles te pedem
  rationale: O verbo expressa pedir, com sufixo de segunda pessoa; a construção relativa qualifica “estas coisas”. “Te pedem” é natural e mantém a direção do pedido.
- source_word: ኢይከውኑ፡ ለአበዊሆሙ
  choice: não serão concedidas aos pais deles
  rationale: Com a preposição ለ, o verbo “ser/tornar-se” assume aqui o sentido de algo vir a caber ou ser dado a alguém. “Serão concedidas” explicita em português a relação idiomática sem introduzir a antiga leitura comparativa “tornar-se como”.
- source_word: በእንቲአሆሙ
  choice: em favor deles
  rationale: A expressão indica benefício ou consideração por alguém. O pronome permanece repetido e contextualmente comprimido, como no ge'ez.
- source_word: ይሴፈዉ
  choice: esperam
  rationale: O verbo deriva de ተሴፈወ, “esperar/ter esperança”, e não denota ser eliminado ou destruído.
- source_word: ይኅየዉ፡ ሕይወተ፡ ዘለዓለም
  choice: viver uma vida eterna
  rationale: Reproduz de perto a expressão “viver uma vida de eternidade”, evitando transformá-la automaticamente na fórmula teológica posterior “ter a vida eterna”.
- source_word: አሐዱ፡ አሐዱ፡ እምኔሆሙ
  choice: cada um deles
  rationale: A repetição de “um” tem força distributiva; “cada um deles” a representa com naturalidade em português.
- source_word: ኃምስተ፡ ምእተ፡ ክረምተ
  choice: quinhentos anos
  rationale: Embora o termo literal seja “invernos”, ele funciona idiomaticamente como contagem de anos; a imagem literal é preservada em nota.
theological_decisions:
- issue: Relação entre os pedidos, os pais e os beneficiários
  choice: Os pedidos feitos a “ti” não serão concedidos aos pais em favor dos representados pelo pronome final.
  alternative: “Os que perguntam a teu respeito não se tornarão como seus pais por causa deles.”
  rationale: A construção de ከውነ com ለ favorece o sentido de concessão ou atribuição, e ዘይስእሉከ designa aquilo que pedem ao destinatário. A tradução conserva a compressão referencial dos pronomes em vez de identificar expressamente os grupos.
- issue: Tensão entre a esperança de vida eterna e os quinhentos anos
  choice: Manter as duas afirmações ligadas por “e”, sem conciliá-las.
  alternative: Acrescentar uma oposição, como “mas cada um viverá apenas quinhentos anos”.
  rationale: O ge'ez traz uma conjunção simples, não uma adversativa nem “apenas”. A redação preserva a tensão textual entre a esperança declarada e a duração subsequente.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega “te” de modo natural para o singular e evita terminologia denominacional. A coordenação simples preserva a tensão do original.
