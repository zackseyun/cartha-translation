base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/001.yaml
  text: 'Then the Most High[a], the Great and Holy One, spoke and sent Uriel to the son of Lamech[b], and said to him:'
translation:
  language: pt
  text: 'Então o Altíssimo, o Grande e Santo, falou e enviou Uriel[a] ao filho de Lameque[b], e lhe disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome “Uriel” é inferido deste ponto do texto etíope, cuja forma transmitida parece estar levemente corrompida; o contexto imediato, que descreve o anjo comissionado, sustenta fortemente essa leitura.
    reason: textual_variant
  - marker: b
    text: Neste versículo, o destinatário é identificado apenas como “o filho de Lameque”; o contexto mais amplo deixa claro que se trata de Noé.
    reason: cross_reference
lexical_decisions:
- source_word: አሜሃ
  choice: Então
  rationale: Introduz a ação seguinte na sequência narrativa sem especificar além do necessário a relação temporal.
- source_word: ልዑል
  choice: o Altíssimo
  rationale: Título divino tradicional e inteligível, que preserva a ideia de supremacia e elevação.
- source_word: ዓቢይ፡ ወቅዱስ
  choice: o Grande e Santo
  rationale: Mantém os epítetos divinos coordenados e o registro solene, sem transformar a expressão em mera descrição adjetival.
- source_word: ተናገረ
  choice: falou
  rationale: Equivalente direto e natural para o verbo de fala, adequado ao tom narrativo elevado.
- source_word: ወፈነወ
  choice: e enviou
  rationale: Expressa de modo claro o envio ou comissionamento do anjo.
- source_word: አሰርየ፡ ልዩር
  choice: Uriel
  rationale: O trecho transmitido parece apresentar corrupção ou ruído de transcrição, mas o nome Uriel é fortemente sustentado pelo contexto imediato; nomes próprios são transliterados.
- source_word: ኀበ፡ ወልደ፡ ላሜክ
  choice: ao filho de Lameque
  rationale: Preserva a designação filial explícita do texto, sem inserir o nome Noé no corpo do versículo.
- source_word: ወይቤሎ
  choice: e lhe disse
  rationale: Representa tanto o verbo de fala quanto o sufixo pronominal referente ao destinatário.
theological_decisions:
- issue: Sequência de epítetos divinos
  choice: o Altíssimo, o Grande e Santo
  alternative: o Altíssimo, o Grande e o Santo
  rationale: A formulação escolhida conserva a acumulação solene de títulos e qualidades divinas, ao mesmo tempo que soa natural em português e não introduz distinções teológicas ausentes do texto.
- issue: Identidade do filho de Lameque
  choice: manter apenas “o filho de Lameque” no texto principal
  alternative: identificá-lo como Noé no texto principal
  rationale: O versículo não apresenta o nome Noé; sua identificação decorre do contexto mais amplo e, por isso, é registrada em nota, sem resolver silenciosamente a referência.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem dos títulos e a designação indireta de Noé foram preservadas; as notas foram posicionadas junto aos elementos a que efetivamente se referem.
