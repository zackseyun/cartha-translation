base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/016.yaml
  text: Destroy all violence from the face of the earth[a], and every evil deed shall come to an end; and the plant of righteousness and uprightness shall appear[b], and it shall become a blessing.
translation:
  language: pt
  text: Destrua toda a violência da face da terra, e toda obra má chegará ao fim; então aparecerá a planta da justiça e da retidão[a], e ela se tornará uma bênção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o plantio da justiça e da retidão”. O substantivo ge'ez pode designar tanto aquilo que é plantado quanto o ato ou resultado de plantar.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሕጕል
  choice: Destrua
  rationale: A forma é um imperativo ativo na segunda pessoa masculina singular, em continuidade com as ordens dirigidas ao anjo no contexto. A tradução preserva tanto o comando direto quanto a voz ativa.
- source_word: ኵሎ ግፍዓ
  choice: toda a violência
  rationale: ግፍዓ pode indicar violência, opressão ou injustiça. “Violência” conserva aqui a força social e moral do termo e se ajusta ao cenário de juízo e purificação da terra.
- source_word: እምገጸ ምድር
  choice: da face da terra
  rationale: A expressão inclui literalmente “face”. A formulação portuguesa mantém o idiomatismo semítico e o tom elevado do texto apocalíptico.
- source_word: ኵሉ ምግባረ እኩይ
  choice: toda obra má
  rationale: A expressão tem sentido abrangente e coletivo. “Toda obra má” é natural em português e mantém a referência concreta às ações perversas.
- source_word: ይኅልቅ
  choice: chegará ao fim
  rationale: O verbo pode significar perecer, acabar ou ser consumado. Com “obra má” como sujeito, “chegará ao fim” expressa claramente a cessação sem introduzir personificação.
- source_word: ያስተርኢ
  choice: aparecerá
  rationale: O verbo indica tornar-se visível ou manifesto. “Aparecerá” preserva de modo conciso a imagem do surgimento da planta.
- source_word: ተክለ
  choice: a planta
  rationale: O substantivo pode designar aquilo que foi plantado ou o ato e resultado de plantar. “A planta” conserva a imagem agrícola concreta, enquanto a alternativa é registrada em nota.
- source_word: ጽድቅ ወርትዕ
  choice: da justiça e da retidão
  rationale: ጽድቅ denota justiça ou condição justa; ርትዕ comunica retidão, integridade ou conformidade ao que é reto. A dupla mantém a distinção ética entre os termos.
- source_word: ይከውን ለበረከት
  choice: ela se tornará uma bênção
  rationale: A construção significa literalmente que algo será ou se tornará para bênção. A formulação escolhida é idiomática em português e conserva o sentido resultativo.
theological_decisions:
- issue: Sentido da imagem agrícola ligada à justiça e à retidão
  choice: Manter a imagem concreta como “a planta da justiça e da retidão”.
  alternative: “o plantio da justiça e da retidão”
  rationale: O substantivo ge'ez admite mais de uma nuance, mas não convém reduzir a imagem apocalíptica à afirmação abstrata de que a justiça florescerá. O texto principal retém a figura vegetal e a nota preserva a alternativa lexical.
- issue: Força verbal da ordem inicial
  choice: 'Traduzir como imperativo ativo singular: “Destrua”.'
  alternative: “Toda a violência será removida”
  rationale: A morfologia e a sequência contextual indicam uma ordem direta dirigida ao agente celestial, não uma previsão passiva. Essa escolha preserva o agente implícito e a continuidade do discurso sem identificá-lo dentro do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “face da terra” preserva o tom semítico e apocalíptico; o imperativo “Destrua” mantém a ordem direta do original. O pronome “ela” retoma claramente “a planta”.
