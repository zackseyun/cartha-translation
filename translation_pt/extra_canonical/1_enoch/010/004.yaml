base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/004.yaml
  text: And again the Lord said to Raphael[a], “Bind Azazel by his hands and his feet, and cast him into the darkness; and open the desert that is in Dudael[b], and cast him there.”
translation:
  language: pt
  text: 'E o Senhor disse novamente a Rafael[a]: “Amarre Azazel pelas mãos e pelos pés e lance-o nas trevas; abra o deserto que fica em Dudael[b] e lance-o ali.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rafael é mantido como nome próprio.
    reason: cultural_note
  - marker: b
    text: Dudael é mantido como nome de lugar. A ordem de “abrir o deserto” é textualmente difícil; pode indicar abrir ou preparar ali um lugar semelhante a uma cova, mas esse detalhe não é explicitado com segurança no testemunho ge’ez.
    reason: textual_variant
lexical_decisions:
- source_word: ካዕበ
  choice: novamente
  rationale: Marca a retomada da fala na sequência narrativa; “novamente” preserva a repetição sem torná-la artificial.
- source_word: እግዚእ
  choice: o Senhor
  rationale: Funciona como título divino na fórmula de fala e mantém um registro elevado e corrente.
- source_word: እሰሮ
  choice: amarre
  rationale: Expressa concretamente a ordem de imobilizar, sem ampliá-la para o conceito mais geral de encarcerar.
- source_word: በእዴሁ ወእግሩ
  choice: pelas mãos e pelos pés
  rationale: Preserva as duas partes do corpo mencionadas explicitamente e a concretude da punição.
- source_word: ወድዮ
  choice: lance-o
  rationale: Mantém a ideia de remoção forçada e a repetição do imperativo, em linguagem digna e natural.
- source_word: ውስተ ጽልመት
  choice: nas trevas
  rationale: É uma formulação portuguesa natural que conserva o caráter sombrio e punitivo da expressão.
- source_word: አብቅዋ ለገዳም
  choice: abra o deserto
  rationale: Conserva a ordem concreta de abrir o deserto sem acrescentar explicitamente uma cova, detalhe não inequívoco no testemunho ge'ez.
- source_word: እንተ ሀለወት በዱዳኤል
  choice: que fica em Dudael
  rationale: Localiza naturalmente o deserto e mantém Dudael transliterado como topônimo.
- source_word: ህየ
  choice: ali
  rationale: Retoma de modo claro e conciso o lugar que acaba de ser indicado.
theological_decisions:
- issue: Natureza da punição de Azazel
  choice: Ato concreto de amarrar e banir para um lugar desértico e escuro
  alternative: Prisão genérica ou entrega puramente simbólica às trevas espirituais
  rationale: Mãos, pés, trevas, deserto e os imperativos repetidos formam uma cena física de juízo; a tradução preserva essa imagem apocalíptica sem alegorizá-la.
- issue: Natureza do lugar aberto em Dudael
  choice: Preservar a imagem difícil de abrir o deserto
  alternative: Explicitar uma cova ou prisão subterrânea no deserto
  rationale: O texto admite a ideia de abrir ou preparar um espaço, mas não exige que a tradução identifique esse espaço como uma cova; a ambiguidade é mantida e explicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação dos imperativos conserva o ritmo solene da ordem judicial e evita tanto arcaísmos desnecessários quanto explicações inseridas no corpo do versículo.
