  text: And on the great day of judgment he shall be sent away into the fire[a][b].
translation:
  language: pt
  text: E, no grande dia do julgamento, ele será enviado para o fogo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito é singular no ge'ez («ele será enviado») e retoma a figura mencionada no contexto anterior.
    reason: cross_reference
  - marker: b
    text: A expressão «grande dia do julgamento» é aqui uma fórmula apocalíptica de juízo; em sentido judicial mais restrito, «julgamento» também poderia ser traduzido por «sentença».
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለት
  choice: no dia
  rationale: A preposição temporal com ዕለት indica quando a ação ocorrerá; em português, «no dia» é a formulação mais natural.
- source_word: ዓባይ
  choice: grande
  rationale: O adjetivo intensifica o dia de julgamento em registro apocalíptico sem acrescentar uma interpretação alheia ao texto.
- source_word: ኵነኔ
  choice: julgamento
  rationale: Neste contexto, o substantivo designa de modo amplo o acontecimento judicial e pode abranger também a sentença, sem se limitar ao veredito condenatório.
- source_word: ይትፈኖ
  choice: ele será enviado
  rationale: A forma passiva singular expressa que ele será mandado ou destinado a esse lugar; «será enviado» preserva o movimento sem introduzir a imagem mais específica de ser lançado.
- source_word: ውስተ
  choice: para
  rationale: Com um verbo de envio, a preposição marca movimento em direção ao interior de um destino; «para o fogo» é natural em português e mantém esse valor direcional.
- source_word: ዋዕይ
  choice: o fogo
  rationale: O termo apresenta a imagem concreta do fogo como destino punitivo, que deve ser preservada em vez de substituída por uma abstração.
theological_decisions:
- issue: Se o destino deve ser expresso como punição genérica ou pela imagem apocalíptica concreta
  choice: para o fogo
  alternative: para o castigo
  rationale: O ge'ez emprega um substantivo concreto para fogo; conservar essa imagem evita reduzir a linguagem apocalíptica a uma explicação abstrata.
- issue: Amplitude de ኵነኔ na fórmula judicial
  choice: julgamento
  alternative: sentença
  rationale: «Julgamento» preserva a amplitude do evento judicial, enquanto «sentença» poderia restringir o sentido apenas ao veredito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para soar natural em português, preservando o sujeito singular, a fórmula apocalíptica e a imagem concreta do fogo.
