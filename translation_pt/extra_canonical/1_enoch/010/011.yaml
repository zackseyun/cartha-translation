base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/011.yaml
  text: And to Michael the Lord said[a], “Go, bind Shemihazah and the others with him[c][b], who joined themselves with women so as to defile themselves with them in their uncleanness.”
translation:
  language: pt
  text: 'E o Senhor disse a Miguel[a]: “Vá, prenda[b] Semiaza e os outros que estão com ele, os quais se uniram a mulheres para se contaminarem com elas na impureza delas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma do nome no ge’ez é Mikael; Miguel é a forma tradicional em português.
    reason: lexical_alternative
  - marker: b
    text: A forma do verbo traduzido como “prenda” é textualmente difícil na transcrição disponível; o contexto do capítulo e o testemunho textual mais amplo sustentam esse sentido.
    reason: textual_variant
lexical_decisions:
- source_word: ለሚካኤል
  choice: a Miguel
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome do anjo, cuja forma ge’ez é Mikael.
- source_word: ይቤ እግዚእ
  choice: o Senhor disse
  rationale: Mantém o sujeito explícito እግዚእ, “o Senhor”, e usa a fórmula narrativa natural em português.
- source_word: እግዚእ ሑር †አይድዕ†
  choice: Vá, prenda
  rationale: O primeiro imperativo comissiona Miguel a partir; a forma do segundo comando é textualmente difícil na transcrição, mas o contexto do juízo e o testemunho textual mais amplo sustentam o sentido de prender ou amarrar.
- source_word: ለስምያዛ
  choice: Semiaza
  rationale: Forma portuguesa legível e reconhecível do nome do chefe dos Vigilantes, próxima da tradição de transliteração do ge’ez.
- source_word: ወለካልኣን እለ ምስሌሁ
  choice: e os outros que estão com ele
  rationale: Preserva a referência coletiva aos companheiros de Semiaza sem lhes atribuir uma posição ou função não expressa no texto.
- source_word: እለ ሐብሩ ምስለ አንስት
  choice: os quais se uniram a mulheres
  rationale: Expressa a união deliberada indicada pelo verbo, sem tornar a formulação mais explícita nem mais eufemística que a fonte.
- source_word: ከመ ይማስኑ
  choice: para se contaminarem
  rationale: Conserva a possível nuance de propósito ou resultado ligada à contaminação, em linguagem corrente e digna.
- source_word: ምስሌሆን በርኵሶ ዚአሆን
  choice: com elas na impureza delas
  rationale: Mantém os referentes femininos plurais do ge’ez e o vocabulário de impureza, sem acrescentar o intensificador “toda”, ausente da fonte.
theological_decisions:
- issue: Natureza da transgressão na união com as mulheres
  choice: Descrever a união como causa ou finalidade de contaminação na impureza delas
  alternative: Especificar “corrupção sexual”, “impureza ritual” ou “maldade em geral”
  rationale: O texto associa a união à contaminação e à impureza, mas não define aqui uma categoria doutrinária posterior; a tradução conserva essa tensão.
- issue: Referente de “impureza delas”
  choice: Manter a referência gramatical às mulheres
  alternative: Generalizar como “na impureza de todos eles” ou “em sua própria impureza”
  rationale: As formas pronominais femininas plurais apontam para as mulheres; a redação portuguesa preserva esse dado sem explicar além do que o verso afirma.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. Usa “Miguel” e “Semiaza” como formas acessíveis ao leitor lusófono; conserva a linguagem de contaminação e impureza e evita acrescentar “toda”, que não aparece no ge’ez.
