base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/012.yaml
  text: And when all their sons have slain one another[a], and when they have seen the destruction of their beloved ones, bind them for seventy generations beneath the hills of the earth, until the day of their judgment and of their consummation[c][b], until the judgment that is for all eternity is completed.
translation:
  language: pt
  text: E, quando todos os filhos deles tiverem matado uns aos outros, e quando eles tiverem visto a destruição de seus entes queridos, amarre-os por setenta gerações sob as colinas da terra[a], até o dia do julgamento deles e de sua consumação[b], até que se complete o julgamento que durará por toda a eternidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob as montanhas da terra”. O termo ge'ez pode designar colinas ou montanhas.
    reason: lexical_alternative
  - marker: b
    text: “Consumação” também pode ser entendida como “fim” ou “conclusão final”.
    reason: lexical_alternative
  - marker: c
    text: A frase final emprega uma fórmula enfática de eternidade, literalmente próxima de “o julgamento da era da eternidade” ou “das eras eternas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትራገዙ
  choice: tiverem matado uns aos outros
  rationale: O contexto descreve a destruição recíproca e violenta dos filhos dos Vigilantes. A formulação explicita a reciprocidade do verbo sem enfraquecê-lo para uma simples disputa.
- source_word: ሐጕሎሙ
  choice: a destruição
  rationale: Mantém o sentido amplo de ruína ou destruição, sem especificar indevidamente o modo pelo qual os entes queridos perecem.
- source_word: ለፍቁራኒሆሙ
  choice: de seus entes queridos
  rationale: Expressão corrente e emocionalmente clara em português, equivalente à ideia de pessoas amadas ou queridas.
- source_word: እሰሮሙ
  choice: amarre-os
  rationale: Preserva a imagem concreta de atar ou prender presente na ordem, em vez de substituí-la pelo conceito mais abstrato de encarceramento.
- source_word: ለ፸ ትውልድ
  choice: por setenta gerações
  rationale: Reproduz diretamente a fórmula temporal apocalíptica.
- source_word: በመትሕተ አውግርተ ምድር
  choice: debaixo das colinas da terra
  rationale: Conserva a localização subterrânea e segue de perto o termo ge'ez, que também pode ser entendido como 'montanhas'.
- source_word: ዕለተ ኵነኔሆሙ
  choice: o dia do julgamento deles
  rationale: Mantém o caráter judicial da expressão sem restringi-la a condenação ou sentença.
- source_word: ተፍጻሜቶሙ
  choice: sua consumação
  rationale: Preserva a ambiguidade entre conclusão, fim e cumprimento final, bem como o registro escatológico solene.
- source_word: ኵነኔ ዘለዓለመ ዓለም
  choice: o julgamento que durará por toda a eternidade
  rationale: Comunica em português natural a força da fórmula enfática de eternidade, sem reduzi-la a uma referência temporal fraca.
theological_decisions:
- issue: Se os filhos apenas lutam entre si ou matam uns aos outros
  choice: matam uns aos outros
  alternative: lutam uns contra os outros
  rationale: A destruição recíproca e letal corresponde ao contexto imediato do juízo sobre a descendência dos Vigilantes; a alternativa mais branda diminuiria a severidade da cena.
- issue: Sentido de “sua consumação”
  choice: manter a noção formal de conclusão ou fim escatológico
  alternative: seu castigo final
  rationale: O termo-fonte pode indicar conclusão, cumprimento ou fim. A tradução evita decidir se se trata especificamente de aniquilação, punição final ou conclusão do processo judicial.
- issue: Força da fórmula final de eternidade
  choice: julgamento que durará por toda a eternidade
  alternative: julgamento eterno
  rationale: A formulação desenvolvida preserva a ênfase da expressão ge'ez baseada na repetição de termos relativos a era e eternidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A sintaxe conserva o encadeamento solene do original, enquanto “entes queridos” e “por toda a eternidade” evitam arcaísmo desnecessário. Os pronomes foram mantidos sem acrescentar identificações ausentes deste versículo.
