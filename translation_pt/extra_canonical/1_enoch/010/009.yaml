base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/009.yaml
  text: And to Gabriel the Lord said[a], “Go against the bastards and the reprobates, and against the children of fornication; destroy the children of fornication and the children of the Watchers from among humankind. Send them out against one another, and let them perish in battle[d][c][b]; for length of days shall not be theirs.”
translation:
  language: pt
  text: 'E o Senhor disse a Gabriel: “Vai contra os bastardos[a], os réprobos e os filhos da prostituição; destrói os filhos da prostituição e os filhos dos Vigilantes[b] dentre os seres humanos. Lança-os uns contra os outros[c], e que pereçam em combate[d], pois não terão vida longa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os ilegítimos”. O termo ge'ez é uma designação dura para os descendentes de uma união ilícita.
    reason: lexical_alternative
  - marker: b
    text: O texto é difícil nesta expressão. O testemunho traz ለውሉደ፡ ትጉሃን, interpretado aqui, à luz do contexto imediato, como “os filhos dos Vigilantes”; permanece alguma incerteza textual.
    reason: textual_variant
  - marker: c
    text: Uma leitura entre colchetes no testemunho inclui outro verbo com o sentido de “enviá-los”. Embora a sequência verbal exata seja incerta, o conflito entre eles é claro.
    reason: textual_variant
  - marker: d
    text: O contexto também permite explicitar o resultado como “que destruam uns aos outros em combate”; contudo, o verbo ge'ez propriamente dito significa “perecer” ou “ser destruído”.
    reason: translation_alternative
lexical_decisions:
- source_word: ወለገብርኤል፡ ይቤሎ፡ እግዚእ፡
  choice: E o Senhor disse a Gabriel
  rationale: Emprega a ordem natural do português e traduz እግዚእ pelo título divino tradicional “Senhor”, adequado ao contexto de juízo.
- source_word: ሑር፡ ዲቤሆሙ፡
  choice: Vai contra
  rationale: A expressão indica movimento hostil em direção aos alvos do juízo, não simples deslocamento.
- source_word: ለመንዝራን፡
  choice: os bastardos
  rationale: Mantém o caráter deliberadamente duro e estigmatizante do termo aplicado à descendência de uma união ilícita; a nota registra uma alternativa menos áspera.
- source_word: ወለማኑናን፡
  choice: os réprobos
  rationale: Conserva a ideia de pessoas rejeitadas ou destinadas à condenação, embora a nuance exata do vocábulo seja incerta.
- source_word: ወዲበ፡ ውሉደ፡ ዘማ፡
  choice: e os filhos da prostituição
  rationale: Preserva tanto a dimensão genealógica quanto a condenação sexual expressa por ዘማ, sem introduzir terminologia doutrinária posterior.
- source_word: ወአኅጕሎሙ፡
  choice: destrói
  rationale: O verbo forte corresponde ao caráter exterminador da ordem de juízo.
- source_word: ለውሉደ፡ ትጉሃን፡ እምሰብእ፡
  choice: os filhos dos Vigilantes dentre os seres humanos
  rationale: “Vigilantes” preserva o termo estabelecido no contexto imediato de 1 Enoque. A forma textual é difícil, por isso a incerteza é indicada em nota.
- source_word: ወአውፅኦሙ፡ [ወፈንዎሙ፡] በበይናቲሆሙ፡
  choice: Lança-os uns contra os outros
  rationale: Exprime de modo natural a ação de pô-los em conflito recíproco, sem ocultar a incerteza da sequência verbal do testemunho.
- source_word: እሙንቱ፡ ወስሊሆሙ፡ በቀትል፡ ይትሐጐሉ፡
  choice: e que pereçam em combate
  rationale: Traduz ይትሐጐሉ como verbo passivo/intransitivo, “perecer”, respeitando a voz gramatical; o contexto de conflito mútuo permanece claro.
- source_word: እስመ፡ ኑሐ፡ መዋዕል፡ አልቦሙ።
  choice: pois não terão vida longa
  rationale: Comunica com clareza moderna a fórmula segundo a qual a longevidade não lhes pertence, preservando seu tom solene.
theological_decisions:
- issue: Identidade dos que são julgados
  choice: A ordem visa especificamente à descendência ilícita associada aos Vigilantes e às suas uniões com seres humanos.
  alternative: Entender o texto como juízo contra a humanidade pecadora em geral ou somente contra gigantes sem referência à sua origem.
  rationale: A sequência “bastardos”, “filhos da prostituição” e “filhos dos Vigilantes” delimita os alvos dentro da narrativa local, sem ampliar o juízo além do que o versículo afirma.
- issue: Linguagem genealógica moralmente carregada
  choice: Manter no texto principal a severidade de “bastardos” e “filhos da prostituição”.
  alternative: Suavizar sistematicamente para “descendentes ilegítimos” ou “descendência de união ilícita”.
  rationale: Trata-se de um oráculo apocalíptico de juízo, e a suavização apagaria parte de sua força retórica; a alternativa menos dura fica disponível em nota.
- issue: Reciprocidade da destruição
  choice: Traduzir o verbo principal como “pereçam”, sem convertê-lo em um verbo ativo recíproco.
  alternative: “Que destruam uns aos outros em combate.”
  rationale: Embora o contexto implique conflito mútuo, a forma ge'ez é passiva/intransitiva. A tradução preserva essa gramática e deixa a implicação contextual sem transformá-la em afirmação verbal explícita.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de ordem judicial. Mantiveram-se “bastardos” e “prostituição” por refletirem a aspereza do original, enquanto as notas registram alternativas e incertezas. “Vigilantes” funciona como designação contextual própria do livro, e “dentre os seres humanos” evita o uso marcado de “homens” no sentido genérico.
