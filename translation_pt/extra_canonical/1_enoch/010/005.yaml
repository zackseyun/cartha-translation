base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/005.yaml
  text: And heap jagged and sharp stones upon him[a], and cover him with darkness; and there he shall remain forever[c][b]. And cover his face so that he may not see light.
translation:
  language: pt
  text: E amontoa sobre ele pedras ásperas e afiadas[a], e cobre-o de escuridão; e ali ele permanecerá para sempre. Cobre-lhe o rosto, para que não veja a luz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os dois termos descrevem as mesmas pedras e ressaltam sua aspereza e seu caráter cortante; também se pode traduzir por “pedras irregulares e pontiagudas”.
    reason: lexical_alternative
  - marker: b
    text: 'Cobrir o rosto reforça a imagem de confinamento total: o condenado fica privado de toda luz.'
    reason: cultural_note
lexical_decisions:
- source_word: ደይ
  choice: amontoa
  rationale: No contexto do confinamento punitivo, expressa a ordem de acumular pedras sobre ele, e não apenas colocá-las.
- source_word: እብነ ጠያያተ ወበሊሓተ
  choice: pedras ásperas e afiadas
  rationale: Mantém um só substantivo qualificado por dois termos, comunicando tanto a superfície rude quanto a capacidade cortante das pedras.
- source_word: ክድኖ
  choice: cobre-o / Cobre-lhe
  rationale: 'Preserva a repetição do verbo no ge''ez, com ajustes pronominais naturais em português conforme os objetos: a pessoa e o rosto.'
- source_word: ጽልመተ
  choice: escuridão
  rationale: É uma tradução direta e solene da imagem apocalíptica de privação da luz.
- source_word: ይኅድር ለዓለም
  choice: ele permanecerá para sempre
  rationale: No contexto de aprisionamento, 'permanecerá' exprime melhor a continuidade do confinamento do que o mais neutro 'habitará'.
- source_word: ለገጹ
  choice: o rosto
  rationale: A leitura concreta corresponde à cláusula seguinte, que declara que ele não deve ver a luz.
- source_word: ከመ ኢይርአይ ብርሃነ
  choice: para que não veja a luz
  rationale: Conserva a construção de finalidade e a formulação direta da fonte, sem acrescentar interpretação teológica.
theological_decisions:
- issue: Natureza das imagens de punição
  choice: Conservar literalmente as pedras, a escuridão, o rosto coberto e a privação da luz como imagens concretas de juízo.
  alternative: Parafrasear como sofrimento metafórico ou prisão genérica.
  rationale: A sequência de ordens concretas no ge'ez produz uma imagem severa de confinamento. Torná-la abstrata enfraqueceria o texto e resolveria indevidamente sua força apocalíptica.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação de imperativos foi preservada; a pontuação divide as ordens sem suavizar sua intensidade.
