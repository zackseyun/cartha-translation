base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/015.yaml
  text: And destroy these spirits of the bastards and the children of the Watchers, because they have oppressed humankind.
translation:
  language: pt
  text: E destrói estes espíritos dos filhos ilegítimos[a] e os filhos dos Vigilantes[c], porque eles oprimiram a humanidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos bastardos”. O termo ge'ez é severo e provavelmente se refere à descendência ilícita ou mista gerada pelos Vigilantes.
    reason: lexical_alternative
  - marker: b
    text: Ou “praticaram violência contra a humanidade”. O verbo pode indicar maus-tratos violentos, e não apenas injustiça em sentido geral.
    reason: lexical_alternative
  - marker: c
    text: 'A construção também pode ser entendida como uma explicação do mesmo grupo: “os espíritos dos filhos ilegítimos, isto é, dos filhos dos Vigilantes”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አኅጕሎሙ
  choice: destrói
  rationale: Preserva a força imperativa ou jussiva do contexto de juízo e a severidade do verbo, sem especificar o modo da destruição.
- source_word: መናፍስተ
  choice: espíritos
  rationale: No contexto apocalíptico, designa seres espirituais, provavelmente vinculados à descendência ilícita, e não apenas “almas” em sentido genérico.
- source_word: ተውኔት
  choice: filhos ilegítimos
  rationale: Comunica de modo claro e digno a ideia de descendência ilícita ou mista. A alternativa mais áspera, “bastardos”, é registrada em nota para preservar a força polêmica do termo.
- source_word: ውሉዶሙ
  choice: filhos
  rationale: É o equivalente filial mais direto e natural em português, sem restringir indevidamente o referente a filhos do sexo masculino em sentido biológico estrito.
- source_word: ትጉሃን
  choice: Vigilantes
  rationale: Mantém a designação apocalíptica tradicional dos seres angélicos desta seção e sua ligação literária com o Livro dos Vigilantes.
- source_word: ገፍዕዎሙ
  choice: oprimiram
  rationale: Expressa maus-tratos graves e violentos com mais força que “prejudicaram” ou “fizeram mal”, sem limitar o verbo exclusivamente à violência física.
- source_word: ሰብእ
  choice: a humanidade
  rationale: Representa naturalmente o sentido coletivo e inclusivo do termo ge'ez.
theological_decisions:
- issue: Identidade e relação entre os espíritos, os filhos ilegítimos e os filhos dos Vigilantes
  choice: Mantêm-se no texto tanto “os espíritos dos filhos ilegítimos” quanto “os filhos dos Vigilantes”, sem explicar se são dois grupos distintos ou duas descrições relacionadas.
  alternative: 'Entender a segunda expressão como aposição: “os espíritos dos filhos ilegítimos, isto é, dos filhos dos Vigilantes”.'
  rationale: A formulação ge'ez é compacta e admite tensão quanto à relação exata entre os referentes. A tradução evita impor uma identificação ou uma distinção que o verso não esclarece plenamente.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. “Vigilantes” é empregado como título tradicional do grupo angélico; “filhos ilegítimos” evita que um insulto moderno obscureça o referente, enquanto a nota conserva a aspereza lexical do original.
