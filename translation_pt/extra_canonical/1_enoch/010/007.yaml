base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/007.yaml
  text: And heal the earth which the angels have corrupted[a], and make known the healing of the earth, so that they may heal the earth, and all the children of men may not perish through all the secrets that the Watchers have disclosed[f] and taught to their sons.
translation:
  language: pt
  text: Cura a terra que os anjos corromperam e torna conhecida a restauração da terra,[a] para que curem a terra e todos os filhos dos homens não pereçam por causa de todos os segredos[b] que os Vigilantes revelaram[c] e ensinaram a seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão é textual e sintaticamente difícil. Mais literalmente, pode ser entendida como “a vida da terra”.
    reason: textual_variant
  - marker: b
    text: Aqui, “segredos” são conhecimentos ocultos e ilícitos transmitidos pelos Vigilantes nesta narrativa, não necessariamente mistérios divinos legitimamente revelados.
    reason: cultural_note
  - marker: c
    text: 'O texto ge’ez diz literalmente “mataram” (ዘቀተሉ), provavelmente em consequência de uma corrupção anterior na transmissão grega: “feriram/mataram” em lugar de “mostraram/revelaram”.'
    reason: textual_variant
lexical_decisions:
- source_word: አሕይዋ
  choice: Cura
  rationale: Expressa de modo natural o imperativo causativo no contexto da recuperação da terra, sem perder a imagem de cura.
- source_word: አማሰኑ
  choice: corromperam
  rationale: Abrange tanto o dano moral quanto a devastação cósmica causada pelos anjos, sem restringir o sentido à impureza ritual.
- source_word: ሕይወታ
  choice: restauração
  rationale: O termo está ligado literalmente a “vida”, mas, no paralelismo com a cura da terra, “restauração” comunica melhor a ideia contextual e preserva a dificuldade em nota.
- source_word: አይድዕ ከመ
  choice: torna conhecida ... para que
  rationale: Mantém a força causativa da divulgação ordenada e a relação de finalidade com a oração seguinte.
- source_word: ይሕይዋ ለምድር
  choice: curem a terra
  rationale: Traduz explicitamente ለምድር, “a terra”, conforme o texto etíope, sem importar a variante grega “a praga”. A ausência de sujeito expresso em português preserva a ambiguidade referencial do plural.
- source_word: ኢይትሐጐሉ
  choice: não pereçam
  rationale: Formulação corrente e digna para o verbo de destruição em contexto de juízo apocalíptico.
- source_word: በምሥጢር ኵሉ
  choice: por causa de todos os segredos
  rationale: “Segredos” conserva o registro apocalíptico; a relação causal é a leitura mais natural no contexto, sem limitar o conteúdo apenas à magia.
- source_word: ትጉሃን
  choice: os Vigilantes
  rationale: Emprega o título tradicional desses seres angélicos em 1 Enoque e preserva a terminologia interna da obra.
- source_word: መሀሩ ለውሉዶሙ
  choice: ensinaram a seus filhos
  rationale: Reproduz a linguagem familiar literal do testemunho etíope em português natural.
theological_decisions:
- issue: Natureza da restauração da terra
  choice: A terra corrompida é apresentada como objeto real de cura e restauração.
  alternative: Entender a passagem apenas como reforma moral da humanidade ou traduzir simplesmente “fazer a terra viver”.
  rationale: A repetição explícita de “terra” como objeto favorece a dimensão cósmica da restauração, sem excluir efeitos sobre a humanidade.
- issue: Identidade dos transmissores dos segredos
  choice: Os Vigilantes são os que revelaram os segredos e os ensinaram a seus filhos.
  alternative: Entender os segredos apenas como conhecimentos ocultos que circulavam genericamente entre os seres humanos.
  rationale: A oração final atribui diretamente aos Vigilantes a revelação e o ensino desse conhecimento.
- issue: Leitura do verbo ዘቀተሉ
  choice: revelaram
  alternative: mataram
  rationale: O etíope preservado diz literalmente “mataram”, mas isso torna a construção incoerente e reflete uma conhecida corrupção na transmissão grega. O texto principal apresenta o sentido contextual recuperado, enquanto a leitura literal é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A repetição de “terra” foi mantida por refletir a ênfase do original. A oração “para que curem” conserva deliberadamente a ambiguidade do sujeito plural.
