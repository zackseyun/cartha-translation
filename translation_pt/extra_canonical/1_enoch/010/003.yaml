base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/003.yaml
  text: And now instruct him[c][b][a], that he may flee and preserve his seed for all the generations forever.
translation:
  language: pt
  text: E agora instrui-o, para que fuja e sua descendência[a] permaneça por todas as gerações, para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sua semente”; isto é, sua linhagem ou seus descendentes.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “por todas as gerações da eternidade”. A expressão acumula termos para enfatizar duração contínua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሀሮ
  choice: instrui-o
  rationale: O imperativo comunica uma ordem para transmitir orientação, sem restringir o sentido a uma simples advertência.
- source_word: ይጐይዝ
  choice: fuja
  rationale: No contexto do juízo iminente, o verbo expressa afastamento urgente do perigo; “fuja” é mais preciso que o neutro “parta”.
- source_word: ይገበር (provável erro de transcrição por ይተርፍ)
  choice: permaneça
  rationale: A forma nominal ዘርኡ está no nominativo e, portanto, funciona naturalmente como sujeito. Além disso, a leitura corrigida ይተርፍ, “permaneça/sobreviva”, concorda com a antiga evidência grega μενεῖ e produz uma construção coerente.
- source_word: ዘርኡ
  choice: sua descendência
  rationale: Embora o sentido literal seja “sua semente”, trata-se de um termo de linhagem; “sua descendência” comunica esse sentido com naturalidade no português atual.
- source_word: ለኵሎሙ ትውልድ ለዓለም
  choice: por todas as gerações, para sempre
  rationale: A formulação conserva tanto a referência à sucessão das gerações quanto a intensificação temporal final.
theological_decisions:
- issue: Sobrevivência física imediata ou continuidade duradoura da linhagem
  choice: sua descendência permaneça
  alternative: preserve sua descendência
  rationale: A tradução mantém juntas a sobrevivência ao juízo e a continuidade da linhagem, sem transformar explicitamente a descendência em objeto de uma ação nem limitar a promessa a um sentido apenas biológico ou espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “descendência” em vez do literalismo menos natural “semente”. A pontuação preserva o paralelismo entre a fuga do homem e a permanência de sua linhagem.
