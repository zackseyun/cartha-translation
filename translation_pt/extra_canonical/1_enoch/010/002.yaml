base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/002.yaml
  text: Go to Noah and say to him in my name[a], 'Hide yourself!' And reveal to him the end that is coming; for the whole earth will be destroyed, and a flood is about to come upon all the earth[c][b], and it will destroy whatever is in it.
translation:
  language: pt
  text: 'Vá até Noé[a] e diga-lhe, em meu nome: “Esconda-se!” E revele-lhe o fim que está por vir, pois toda a terra será destruída; um dilúvio de águas[b] está prestes a vir sobre toda a terra e destruirá tudo o que nela existe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras iniciais “Vá até Noé e” aparecem entre parênteses na edição ge’ez consultada.
    reason: textual_note
  - marker: b
    text: Literalmente, “um dilúvio de águas”; em português, também se pode traduzir simplesmente por “um dilúvio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሖር፡ ለኖኅ፡ ወበሎ
  choice: Vá até Noé e diga-lhe
  rationale: Preserva o imperativo inicial ሖር, ‘vá’, e distingue a ida até Noé do ato de lhe transmitir a mensagem.
- source_word: በስመ፡ ዚአየ
  choice: em meu nome
  rationale: Fórmula portuguesa natural que expressa a autoridade delegada do emissor sem acrescentar conteúdo.
- source_word: ኅባእ፡ ርእሰከ
  choice: Esconda-se!
  rationale: Traduz diretamente a ordem reflexiva de ocultar-se e conserva sua urgência.
- source_word: ወአግህድ፡ ሎቱ
  choice: Depois, revele-lhe
  rationale: A ordem continua dirigida ao mensageiro, e o pronome remete a Noé; a separação evita fazer de Noé o sujeito de ‘revelar’.
- source_word: ፍጻሜ፡ ዘይመጽእ
  choice: o fim que está por vir
  rationale: Mantém tanto o sentido de fim ou consumação quanto seu caráter iminente, sem convertê-lo em termo escatológico técnico.
- source_word: ይትኃጐል፡ ምድር፡ ኵሉ
  choice: toda a terra será destruída
  rationale: Reproduz o alcance total da afirmação e o valor passivo do verbo de destruição.
- source_word: ማየ፡ አይኅ
  choice: um dilúvio de águas
  rationale: Conserva a formulação enfática do ge’ez, embora ‘dilúvio’ sozinho seja mais idiomático em português.
- source_word: ሀሎ፡ ዲበ፡ ኵሉ፡ ምድር
  choice: está prestes a vir sobre toda a terra
  rationale: Expressa a iminência da chegada e mantém a repetição de ‘toda a terra’ presente no texto.
- source_word: ያኀጕል፡ ዘሀሎ፡ ውስቴታ
  choice: destruirá tudo o que nela existe
  rationale: Mantém o alcance abrangente da expressão sem especificar categorias que o original não nomeia.
theological_decisions:
- issue: Alcance de ‘o fim’
  choice: Entendido no contexto imediato como o fim destrutivo que vem por meio do dilúvio.
  alternative: ‘a consumação’ ou ‘o fim final’, com sentido escatológico técnico.
  rationale: O contexto imediato anuncia o juízo do dilúvio; a tradução preserva a gravidade apocalíptica sem importar uma sistematização posterior.
- issue: Sujeito da ordem ‘revele-lhe’
  choice: A ordem é dirigida ao mensageiro, que deve revelar a Noé o fim vindouro.
  alternative: Incluir ‘revele-lhe’ nas palavras ditas a Noé, fazendo de Noé o sujeito da ordem.
  rationale: A forma verbal e o pronome fazem melhor sentido como continuação da comissão ao mensageiro; a leitura alternativa deixaria sem referente lógico a pessoa a quem Noé deveria revelar a mensagem.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais para leitores brasileiros. A pontuação delimita a fala dirigida a Noé e deixa claro que a ordem seguinte continua sendo dada ao mensageiro. Conservou-se a expressão marcada ‘dilúvio de águas’, acompanhada de nota.
