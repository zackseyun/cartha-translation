  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/008.yaml
  text: And on that day it rises with exactly seven parts[b][a], and it comes out.
translation:
  language: pt
  text: E, naquele dia, nasce com exatamente sete partes[a] e sai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, sete porções; no contexto, provavelmente porções da luminosidade do astro.
    reason: contextual_clarification
lexical_decisions:
- source_word: ይሠርቅ
  choice: nasce
  rationale: O verbo descreve o nascer de um astro. Em português, «nascer» é a expressão astronômica corrente e preserva a imagem do movimento celeste.
- source_word: በይእቲ ዕለት
  choice: naquele dia
  rationale: A preposição, o demonstrativo e o substantivo formam naturalmente a indicação temporal «naquele dia».
- source_word: ሳብዐተ እደ
  choice: sete partes
  rationale: A expressão indica sete porções ou partes; evita-se a leitura anterior «sétimo dia», que não corresponde à divisão das palavras no texto ge'ez.
- source_word: ጥንቁቀ
  choice: exatamente
  rationale: O termo comunica exatidão ou precisão na quantidade indicada.
- source_word: ይወፅእ
  choice: sai
  rationale: Verbo comum de movimento para fora. A formulação breve conserva a sequência repetitiva da descrição astronômica.
theological_decisions:
- issue: Referente e gênero do sujeito dos verbos
  choice: Deixar o sujeito implícito
  alternative: Empregar «ele» ou explicitar «a lua»
  rationale: Os verbos ge'ez estão no masculino singular, mas o referente contextual é um luminar, provavelmente a lua, substantivo feminino em português. O sujeito implícito preserva a continuidade contextual sem impor uma mudança de gênero nem acrescentar ao versículo um substantivo ausente.
- issue: Sentido das «sete partes»
  choice: Manter «sete partes» sem explicitar de que são partes
  alternative: Traduzir interpretativamente como «sete partes de luz»
  rationale: O contexto sugere porções da luminosidade lunar, mas «de luz» não aparece nesta frase. A tradução mantém a concisão e a abertura do texto.
translation_notes:
  register: Português atual, digno e acessível. «Nasce» emprega o uso astronômico normal do verbo. A repetição de movimento em «nasce… e sai» foi mantida por refletir a formulação esquemática do original.
