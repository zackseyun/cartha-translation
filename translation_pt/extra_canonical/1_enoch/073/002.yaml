base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/002.yaml
  text: And its circuit is like the circuit of heaven[a], and its chariots, by which it goes out, are driven by the wind[c][b]; and light is given to it by measure.
translation:
  language: pt
  text: E seu circuito é como o circuito do céu, e seus carros, nos quais ele sai, são impelidos pelo vento[a]; e a luz lhe é dada segundo uma medida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção etíope é difícil. Também pode ser entendida no sentido de que os carros seguem para onde o vento sopra ou são levados pelos ventos.
    reason: textual_variant
  - marker: b
    text: Ou “conforme uma medida” ou “segundo uma medida fixa”. A expressão ressalta a distribuição regulada e ordenada da luz.
    reason: lexical_alternative
lexical_decisions:
- source_word: ክበቡ
  choice: seu circuito
  rationale: Preserva tanto a ideia de extensão circular quanto a de percurso, sem introduzir o conceito astronômico moderno e mais específico de órbita.
- source_word: ከመ ክበበ ሰማይ
  choice: como o circuito do céu
  rationale: Mantém a comparação explícita e o registro cósmico da passagem.
- source_word: ሰረገላተ ዚአሁ
  choice: seus carros
  rationale: Conserva a imagem apocalíptica de veículos celestes; em português, “carros” é mais natural nesse contexto antigo do que “carruagens”, sem eliminar a imagem.
- source_word: በኀበ ይጼዓን ነፋስ ትነፍስ
  choice: nos quais ele sai, são impelidos pelo vento
  rationale: Representa a referência à saída do astro por meio de seus carros e entende a linguagem repetida de vento como força que os move, mas sinaliza em nota a dificuldade sintática do testemunho etíope.
- source_word: በመስፈርት
  choice: segundo uma medida
  rationale: Expressa medida, regra ou proporção e preserva a ideia de distribuição ordenada da luz.
- source_word: ይትወሀብ ሎቱ ብርሃን
  choice: a luz lhe é dada
  rationale: Mantém a forma passiva do original, sem transformar a expressão em afirmação de geração inerente da luz.
theological_decisions:
- issue: Representação do movimento do astro em linguagem cosmológica antiga
  choice: Manter “circuito” e “carros”
  alternative: Empregar “órbita” e “veículos” ou simplesmente “trajetória”
  rationale: A escolha conserva a linguagem visionária e cósmica do texto, evitando impor categorias científicas modernas.
- issue: Origem ou recepção da luz
  choice: Manter a construção passiva “a luz lhe é dada”
  alternative: Traduzir “ele recebe luz”
  rationale: A passiva corresponde mais diretamente ao texto e preserva sua formulação sem especificar quem dá a luz nem desenvolver uma conclusão teológica além do que está expresso.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário cósmico tradicional. A sintaxe foi mantida relativamente formal para preservar a sequência e as imagens do original, enquanto as incertezas reais foram registradas em notas.
