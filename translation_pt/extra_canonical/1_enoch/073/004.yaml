base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/004.yaml
  text: And in this way it rises[a], and its front, which is toward the east, comes out on the thirtieth morning, and on that day it becomes visible, and it shall be for you the head of the month, on the thirtieth day with the sun[e][d][c][b], in the gate from which the sun comes out.
translation:
  language: pt
  text: Assim ela fica oculta[a]; e sua frente[b], voltada para o leste, sai na trigésima manhã. Naquele dia, ela se torna visível e, para vocês, será o início do mês[c], no trigésimo dia[d], junto com o sol, no portal[e] pelo qual o sol sai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “nasce” ou “surge”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua cabeça”; também pode ser entendido como “seu começo” ou “sua frente”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “a cabeça do mês”, expressão concreta para o começo do mês.
    reason: lexical_alternative
  - marker: d
    text: 'Literalmente, “trinta dias”; no contexto, a expressão pode funcionar como data: “no trigésimo dia”.'
    reason: grammatical_note
  - marker: e
    text: O “portal” faz parte da imagem recorrente do Livro Astronômico, segundo a qual os astros saem por portais ordenados do céu.
    reason: cultural_note
lexical_decisions:
- source_word: ይሠርቅ
  choice: nasce
  rationale: No contexto do movimento de um astro, o verbo descreve seu surgimento. “Nasce” é a expressão portuguesa natural para um luminar que aparece no horizonte, enquanto a variante “fica oculta” é registrada em nota por constar da tradição de tradução fornecida.
- source_word: ርእሱ
  choice: sua parte dianteira
  rationale: O sentido literal é “sua cabeça”; aqui, porém, a expressão aponta para a parte frontal ou primeira porção visível da lua. A formulação mantém o valor espacial sem soar artificial em português.
- source_word: ዘመንገለ ጽባሕ
  choice: voltada para o leste
  rationale: A locução indica a direção da manhã ou do nascer do sol, isto é, o leste.
- source_word: በሠላሳ ጽባሕ
  choice: na trigésima manhã
  rationale: A construção temporal assinala a manhã de número trinta no ciclo descrito.
- source_word: ያስተርኢ
  choice: ela se torna visível
  rationale: O causativo exprime manifestação ou visibilidade; no contexto da fase lunar, esta formulação comunica com clareza o resultado observado.
- source_word: ርእሰ ወርኅ
  choice: o início do mês
  rationale: Literalmente, “a cabeça do mês”. “Início do mês” transmite em português corrente o idioma calendárico sem apagar a imagem original, que é preservada em nota.
- source_word: ሠላሳ ዕለት
  choice: no trigésimo dia
  rationale: Embora a forma seja literalmente cardinal, “trinta dias”, neste contexto calendárico funciona como data ordinal, em paralelo com “na trigésima manhã”.
- source_word: ምስለ ፀሐይ
  choice: junto com o sol
  rationale: A preposição indica associação ou simultaneidade entre a aparição da lua e a do sol.
- source_word: በኆኅት
  choice: no portal
  rationale: “Portal” conserva a imagem cosmológica recorrente do Livro Astronômico e tem registro mais digno que “porta” neste contexto.
- source_word: እንተ ይወፅእ ፀሐይ
  choice: pelo qual o sol sai
  rationale: A oração relativa identifica o portal por meio do movimento concreto do sol ao sair.
theological_decisions:
- issue: Se a linguagem cosmológica antiga deveria ser normalizada segundo a astronomia moderna
  choice: Conservar o portal celeste e o movimento do sol ao sair
  alternative: Substituir por “horizonte oriental” e “ponto do nascer do sol”
  rationale: O texto apresenta seu sistema cosmológico por imagens concretas. Modernizá-las transformaria tradução em interpretação e apagaria parte do mundo literário da obra.
- issue: Se ርእሰ ወርኅ deve ser reproduzido literalmente
  choice: Usar “início do mês” no texto e registrar “cabeça do mês” em nota
  alternative: Usar “cabeça do mês” diretamente no texto
  rationale: A solução comunica o idioma calendárico a leitores modernos e, ao mesmo tempo, torna transparente a metáfora da fonte.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e legibilidade brasileira. O pronome “ela” retoma a lua, indicada pelo contexto do capítulo. Mantiveram-se a orientação para o leste, a contagem calendárica e a imagem do portal, sem convertê-las em terminologia astronômica moderna.
