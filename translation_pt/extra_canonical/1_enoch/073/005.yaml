base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/005.yaml
  text: And its distant half is one seventh part[a], and all its disk is empty, without light[c][b], except for a seventh part of it—a fourteenth part of its light.
translation:
  language: pt
  text: E a metade mais distante é uma sétima parte[a], e todo o seu disco está vazio, sem luz[b][c], exceto por uma sétima parte dele — uma décima quarta parte de sua luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação numérica do testemunho etíope é difícil. O termo traduzido por “parte” significa literalmente “mão”, mas aqui funciona como unidade ou fração no ciclo medido do astro.
    reason: lexical_alternative
  - marker: b
    text: O versículo parece descrever as porções iluminadas e escuras da lua no estilo esquemático do Livro Astronômico, e não em termos da ciência moderna.
    reason: cultural_note
  - marker: c
    text: 'Uma tradução anterior, que toma as expressões numéricas como contagens não fracionárias, seria: “sete partes de um, e todo o seu disco está vazio de luz, exceto por sete partes dele — catorze partes de sua luz”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: መንፈቀ
  choice: metade
  rationale: O substantivo indica metade ou porção dividida; no contexto lunar, “metade” preserva a descrição quantitativa.
- source_word: ርኁቅ
  choice: mais distante
  rationale: Mantém o sentido espacial de algo remoto e concorda naturalmente com “metade”.
- source_word: ሳብዐተ፡ እደ፡ አሐደ
  choice: uma sétima parte
  rationale: A construção fracionária etíope é entendida, no esquema lunar do capítulo, como um sétimo da metade, em vez de sete partes.
- source_word: ኵሉ፡ ክበበ፡ ዚአሁ
  choice: todo o seu disco
  rationale: Embora ክበብ designe literalmente círculo ou forma redonda, “disco” é natural no contexto de um corpo celeste visível.
- source_word: ባክ፡ ዘአልቦ፡ ብርሃነ
  choice: está vazio, sem luz
  rationale: Preserva tanto a ideia de privação expressa por ባክ quanto a declaração explícita de ausência de luz.
- source_word: ዘእንበለ
  choice: exceto por
  rationale: Expressa com clareza moderna a relação exceptiva.
- source_word: ሳብዐተ፡ እዴሁ
  choice: uma sétima parte dele
  rationale: Lê a expressão como fração e mantém o referente pronominal ao disco ou corpo descrito.
- source_word: ዐሠርተ፡ ራብዐተ፡ እደ፡ ብርሃኑ
  choice: uma décima quarta parte de sua luz
  rationale: A expressão funciona como medida fracionária da luz total da lua; a formulação conserva a aritmética do ciclo de catorze partes.
theological_decisions:
- issue: Natureza da descrição do astro
  choice: Manter a descrição astronômica apocalíptica em termos de frações e medidas.
  alternative: Parafrasear como uma explicação geral da lua crescente ou normalizar o texto segundo a astronomia moderna.
  rationale: O Livro Astronômico descreve os ciclos celestes por contagens esquemáticas. Preservar suas frações respeita a cosmologia e a retórica próprias do texto sem lhes impor uma explicação moderna.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe repetitiva e técnica foi mantida para refletir o caráter esquemático do texto, enquanto as expressões numéricas foram vertidas como frações conforme o contexto do ciclo lunar.
