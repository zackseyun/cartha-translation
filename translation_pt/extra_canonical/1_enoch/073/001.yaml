base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/001.yaml
  text: And after this law I saw another law for the lesser light[b][a], whose name is the moon.
translation:
  language: pt
  text: E depois dessa lei, vi outra lei[a] referente à luz menor, cujo nome é a Lua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ordem”, “determinação” ou “mandamento”, nas duas ocorrências; o termo ge'ez pode indicar tanto uma diretiva quanto uma disposição prescrita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወድኅሬሁ
  choice: E, depois dessa
  rationale: Mantém a fórmula temporal que liga esta visão à disposição celeste anterior, em português natural.
- source_word: ትእዛዝ
  choice: lei
  rationale: No Livro Astronômico, o termo designa a disposição prescrita e regular que governa os luminares. “Lei” comunica essa ordem cósmica contínua e permite conservar a repetição do original.
- source_word: ርኢኩ
  choice: vi
  rationale: Forma direta e corrente para o relato visionário em primeira pessoa.
- source_word: ካልአ
  choice: outra
  rationale: Indica uma disposição correspondente que vem depois da anterior, sem exigir o sentido ordinal mais restrito de “segunda”.
- source_word: ለብርሃን ንኡስ
  choice: para a luz menor
  rationale: Preserva a relação marcada pela preposição e a imagem comparativa do luminar de menor grandeza, sem substituir “luz” por um termo técnico.
- source_word: ዘስሙ
  choice: cujo nome é
  rationale: Reproduz naturalmente a construção relativa que introduz o nome do luminar.
- source_word: ወርኅ
  choice: Lua
  rationale: Equivalente português usual do termo ge'ez; a inicial maiúscula convém ao uso como nome identificador nesta frase.
theological_decisions:
- issue: Sentido de ትእዛዝ no Livro Astronômico
  choice: lei
  alternative: ordem, determinação ou mandamento
  rationale: “Lei” expressa uma disposição cósmica prescrita e recorrente. A nota conserva a possibilidade lexical de uma ordem ou diretiva, evitando transformar a escolha contextual em interpretação exclusiva.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência apocalíptica. Conserva-se a repetição de “lei” e a expressão imagética “luz menor” do texto-fonte.
