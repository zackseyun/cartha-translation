base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/007.yaml
  text: And it sets with the sun[a]; and when the sun rises, the moon rises with it and takes half a portion of light. And on that night, at the beginning of its morning, before the day[c][b], the moon sets with the sun and is dark through that night—seven parts and a half.
translation:
  language: pt
  text: 'E ela se põe com o sol[a]; e, quando o sol nasce, a lua nasce com ele e recebe meia parte de luz[b]. E, naquela noite, no começo de sua manhã, antes do dia[c], a lua se põe com o sol e fica escura durante aquela noite: sete partes e meia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação em ge'ez é difícil no meio deste versículo, especialmente na expressão «no começo de sua manhã, antes do dia». A tradução conserva a sequência temporal de modo relativamente literal, sem convertê-la numa explicação astronômica moderna.
    reason: textual_variant
  - marker: b
    text: O capítulo mede repetidamente a luz da lua em «partes» numeradas. «Meia parte de luz» provavelmente pertence ao mesmo sistema de iluminação fracionada.
    reason: cultural_note
  - marker: c
    text: A expressão «antes do dia» também pode ser ligada diretamente a «a lua se põe», em vez de a «no começo de sua manhã».
    reason: previous_rendering
lexical_decisions:
- source_word: የዓርብ
  choice: se põe
  rationale: No contexto astronômico, designa o ocaso de um astro; «pôr-se» é a expressão portuguesa natural e preserva o sentido técnico.
- source_word: ይሠርቅ
  choice: nasce
  rationale: Aplicado repetidamente ao sol e à lua em contraste com o ocaso; «nascer» é o termo astronômico corrente em português.
- source_word: ምስሌሁ
  choice: com ele
  rationale: O pronome retoma «o sol», substantivo masculino em português, sem implicar personificação.
- source_word: ይነሥእ
  choice: recebe
  rationale: A lua adquire uma quantidade medida de luz; «recebe» comunica isso naturalmente sem explicar o mecanismo.
- source_word: መንፈቀ እደ ብርሃን
  choice: meia parte de luz
  rationale: Mantém tanto a fração quanto a linguagem de unidades de luz empregada no capítulo.
- source_word: በርእሰ ጽባሐ ዚአሁ
  choice: no começo de sua manhã
  rationale: Reproduz de modo inteligível o idioma literal «na cabeça/no princípio de sua manhã», sem eliminar a dificuldade temporal.
- source_word: በቅድመ ዕለቱ
  choice: antes do dia
  rationale: Conserva a formulação temporal concisa do ge'ez e evita acrescentar uma relação possessiva incerta.
- source_word: ይጸልም
  choice: fica escura
  rationale: Expressa o estado de escuridão ou obscurecimento da lua sem introduzir uma explicação astronômica moderna.
- source_word: ፯ሳብዓተ እደ ወንፍቃ
  choice: sete partes e meia
  rationale: Preserva explicitamente o sistema de unidades contadas usado para medir a iluminação lunar no capítulo.
theological_decisions:
- issue: Descrição cosmológica antiga e visionária
  choice: Conservar o nascer e o pôr dos astros e as «partes» medidas de luz
  alternative: Parafrasear em termos de fases lunares, conjunção ou eclipse
  rationale: O texto apresenta a ordem celeste em sua própria linguagem cosmológica; modernizá-la resolveria indevidamente a imagem e sua possível tensão com explicações astronômicas atuais.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Empregaram-se os termos astronômicos correntes «nascer» e «pôr-se», preservando-se, porém, a linguagem cosmológica antiga e a sequência temporal difícil do original.
