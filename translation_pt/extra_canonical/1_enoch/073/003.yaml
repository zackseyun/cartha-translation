base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/003.yaml
  text: And in every month its going out and its returning vary[a], and its days are like the days of the sun; and when its light is full[c][b], it is a seventh part of the light of the sun.
translation:
  language: pt
  text: E, a cada mês, sua saída e seu retorno variam[a], e seus dias são como os dias do sol; quando sua luz está plena[b], ela é a sétima parte da luz do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O versículo emprega linguagem astronômica para a “saída” e o “retorno” do astro. “Nascer” e “ocaso” são interpretações possíveis, mas mais específicas do que o ge'ez exige.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “quando sua luz se torna clara”. A expressão descreve a luminosidade plena do astro, provavelmente a lua cheia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሙፃኢሁ
  choice: sua saída
  rationale: Preserva o sentido básico de saída ou movimento para fora sem especificar demais como “nascer”, embora o contexto seja astronômico.
- source_word: ምብዋኢሁ
  choice: seu retorno
  rationale: Mantém o paralelismo com “saída” e evita impor a interpretação mais específica “ocaso”.
- source_word: ይትዌለጥ
  choice: variam
  rationale: Expressa alteração ou diferenciação de modo natural no contexto dos ciclos mensais.
- source_word: መዋዕሊሁ
  choice: seus dias
  rationale: Segue o sentido direto do substantivo, sem acrescentar “designados” ou uma explicação sobre a duração do ciclo.
- source_word: ከመ መዋዕለ ፀሐይ
  choice: como os dias do sol
  rationale: Conserva a comparação introduzida por ከመ sem convertê-la numa afirmação mais precisa de igualdade calendárica.
- source_word: ይፄሪ
  choice: está plena
  rationale: No contexto da luminosidade lunar, o verbo indica claridade ou brilho pleno, conforme o uso citado para este versículo, e não escurecimento.
- source_word: ከዊነ ብርሃኑ ይከውን
  choice: sua luz está plena / ela é
  rationale: A construção descreve o estado pleno da luz e, em seguida, identifica diretamente sua proporção em relação à luz solar.
- source_word: ሳብዓደ እደ
  choice: a sétima parte
  rationale: Representa de forma idiomática e transparente a fração de um sétimo.
- source_word: እምብርሃነ ፀሐይ
  choice: da luz do sol
  rationale: Combina naturalmente com “a sétima parte” e preserva a relação de proporção ou origem expressa pela preposição.
