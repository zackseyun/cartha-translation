base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/006.yaml
  text: And on the day it takes up a seventh part of half of its light[c][b][a], and its light becomes one and a half seventh parts.
translation:
  language: pt
  text: E, nesse dia, ela recebe um sétimo da metade de sua luz[a], e sua luz passa a ser um sétimo e meio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “um sétimo” contém literalmente a palavra “mão”, usada aqui como unidade ou porção de medida.
    reason: lexical_alternative
  - marker: b
    text: A formulação numérica etíope é compacta e difícil. Traduz-se literalmente no sentido de “um sétimo e meio”, isto é, uma vez e meia a unidade de um sétimo; o versículo provavelmente descreve um aumento fracionário da luz da lua.
    reason: textual_variant
lexical_decisions:
- source_word: በዕለተ
  choice: nesse dia
  rationale: Expressa a circunstância temporal concreta do discurso calendárico; “nesse dia” é natural em português e mantém a referência ao dia em questão.
- source_word: ትነሥእ
  choice: ela recebe
  rationale: Neste contexto, o verbo descreve a aquisição de uma porção de luz pela lua. Uma única forma verbal é traduzida, sem duplicá-la como “ergue-se e recebe”.
- source_word: ሳብዐተ እደ
  choice: a sétima parte
  rationale: Embora እደ signifique literalmente “mão”, a expressão funciona aqui como unidade de medida e, no contexto da progressão astronômica, indica uma fração de um sétimo.
- source_word: መንፈቀ
  choice: metade
  rationale: Conserva diretamente o valor fracionário da expressão etíope.
- source_word: ብርሃኑ
  choice: sua luz
  rationale: O substantivo significa “luz” ou “brilho”; “sua luz” mantém a repetição do original e evita explicitação desnecessária.
- source_word: ይከውን
  choice: passa a ser
  rationale: Marca o estado resultante da luminosidade e soa natural no português atual.
- source_word: አሐተ ወመንፈቃ
  choice: uma parte e meia
  rationale: Representa “uma e meia” como quantidade de unidades fracionárias; a formulação completa esclarece que se trata de partes de um total de sete.
theological_decisions:
- issue: Referência ao luminar
  choice: Empregar o pronome feminino “ela”, referindo-se naturalmente à lua em português
  alternative: Usar uma construção impessoal ou repetir “a lua”
  rationale: O gênero feminino decorre da gramática portuguesa e não atribui personalidade ou natureza divina ao astro; a escolha mantém fluidez sem acrescentar doutrina.
- issue: Ambiguidade da expressão numérica final
  choice: Traduzir como “uma parte e meia de sete partes”
  alternative: “sete partes, uma e meia” ou “uma sétima parte e meia”
  rationale: A formulação adotada preserva a leitura fracionária exigida pela progressão astronômica e evita sugerir uma soma incoerente de um sétimo com metade do total.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A redação conserva o caráter técnico do calendário lunar, mas esclarece discretamente a expressão fracionária sem eliminar sua dificuldade textual.
