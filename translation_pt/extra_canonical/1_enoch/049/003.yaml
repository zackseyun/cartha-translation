base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/003.yaml
  text: And in him dwells the spirit of wisdom[a], and the spirit that gives understanding, and the spirit of instruction and might[d][c][b], and the spirit of those who sleep in righteousness.
translation:
  language: pt
  text: E nele habita o espírito de sabedoria[a], o espírito que dá entendimento[b], o espírito de instrução e poder, e o espírito dos que dormem em justiça[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nele permanece”. O verbo ge''ez pode indicar habitar, permanecer ou alojar-se. Uma tradução tradicional é “sobre ele repousa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o espírito de entendimento”. A expressão pode indicar tanto um espírito caracterizado pelo entendimento como um espírito que o concede.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “os que dormem em justiça”. A expressão provavelmente se refere aos justos mortos, embora também possa ser entendida como “os que repousam em justiça”.
    reason: alternative_reading
lexical_decisions:
- source_word: የኃድር
  choice: habita
  rationale: O imperfeito expressa uma realidade presente ou contínua, e ቦቱ indica «nele». «Habita» comunica permanência sem converter a ação em passado.
- source_word: መንፈሰ
  choice: espírito
  rationale: No contexto de qualidades concedidas, «espírito» preserva o sentido elevado e carismático.
- source_word: ጥበብ
  choice: sabedoria
  rationale: É a correspondência natural para a qualidade moral e intelectual indicada pelo termo.
- source_word: ዘያሌቡ
  choice: que dá entendimento
  rationale: Preserva a força verbal da expressão, que pode caracterizar o espírito pelo entendimento que ele comunica.
- source_word: ትምህርት
  choice: instrução
  rationale: Abrange ensino e formação e se ajusta com naturalidade à sequência de qualidades.
- source_word: ኃይል
  choice: poder
  rationale: Expressa força ou potência em registro elevado, mas corrente e amplamente compreensível em português.
- source_word: እለ ኖሙ በጽድቅ
  choice: os que dormem em justiça
  rationale: Mantém literalmente a imagem apocalíptica do sono e não explicita além do texto se a referência é aos justos mortos.
theological_decisions:
- issue: Sentido da expressão final sobre o espírito
  choice: o espírito dos que dormem em justiça
  alternative: o espírito dos que repousam em justiça; o espírito dos justos mortos
  rationale: «Dormem» preserva a provável alusão aos mortos justos, sem eliminar a ambiguidade entre sono, repouso e morte.
- issue: Relação do espírito com a figura mencionada
  choice: nele habita
  alternative: sobre ele repousa
  rationale: A preposição ቦቱ favorece «nele», enquanto o imperfeito indica estado presente ou contínuo. A alternativa tradicional é registrada sem substituir a construção mais diretamente apoiada pelo texto.
- issue: Função do espírito ligado ao entendimento
  choice: que dá entendimento
  alternative: de entendimento
  rationale: A formulação verbal pode indicar um espírito que concede entendimento, mas a leitura atributiva continua possível e por isso é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo preservado. «Poder» foi preferido a «força» por combinar melhor com a enumeração de dons; as ambiguidades relevantes foram mantidas em notas.
