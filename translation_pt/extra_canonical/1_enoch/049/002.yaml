base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/002.yaml
  text: For he is mighty in all the hidden things of righteousness[a], and lawlessness will pass away like a shadow and have no permanence; for the Chosen One stands before the Lord of Spirits, and his glory is forever and ever[d][c][b], and his power from generation to generation.
translation:
  language: pt
  text: Pois ele é poderoso em todas as coisas ocultas da justiça[a], e a iniquidade passará como uma sombra e não terá permanência[b]; pois o Escolhido[c] está de pé[d] diante do Senhor dos Espíritos, e sua glória é para todo o sempre, e seu poder, de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “realidades ocultas da justiça”. A expressão ge'ez pode indicar aspectos escondidos ou segredos pertencentes à justiça.
    reason: lexical_alternative
  - marker: b
    text: Ou “não poderá permanecer”. A expressão nega literalmente à iniquidade a capacidade de ficar em pé ou subsistir.
    reason: lexical_alternative
  - marker: c
    text: “Escolhido” é um título recorrente nas Parábolas para a figura exaltada associada ao juízo e à vindicação.
    reason: cross_reference
  - marker: d
    text: Ou “tem estado de pé”. A forma verbal também pode destacar uma situação estabelecida que continua no presente.
    reason: aspectual_alternative
lexical_decisions:
- source_word: ኃያል
  choice: poderoso
  rationale: Expressa força ou poder e conserva o tom elevado do texto sem sugerir onipotência.
- source_word: ኅቡአተ
  choice: coisas ocultas
  rationale: Preserva o plural concreto e a ideia de realidades escondidas, sem impor o termo técnico “mistérios”.
- source_word: ጽድቅ
  choice: justiça
  rationale: Abrange aqui a retidão moral e a ordem justa, em contraste com a iniquidade.
- source_word: ዓመፃ
  choice: iniquidade
  rationale: Termo português amplo para conduta contrária à justiça; evita limitar o sentido apenas à violência física ou à infração jurídica.
- source_word: ጽላሎት
  choice: sombra
  rationale: Mantém simples e concreta a comparação do original.
- source_word: የኃልፍ
  choice: passará
  rationale: Conserva a orientação futura do contexto de juízo sem explicitar aniquilação.
- source_word: ምቅዋመ አልቦ
  choice: não terá permanência
  rationale: Comunica de modo natural que a iniquidade não subsistirá, preservando em nota a imagem mais literal de não permanecer em pé.
- source_word: ኅሩይ
  choice: o Escolhido
  rationale: Mantém como título recorrente nas Parábolas a designação da figura exaltada ligada ao juízo e à vindicação.
- source_word: ቆመ
  choice: está de pé
  rationale: O perfeito de um verbo de postura pode ter valor estativo presente; esta formulação preserva tanto a postura quanto o estado contínuo.
- source_word: በቅድመ
  choice: diante de
  rationale: Retém a imagem espacial e cortesã da presença divina.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Preserva o título divino característico de 1 Enoque em forma natural no português bíblico.
- source_word: ስብሐቲሁ
  choice: sua glória
  rationale: É a equivalência mais adequada ao registro bíblico-apocalíptico e à fórmula de duração eterna.
theological_decisions:
- issue: Se ኅሩይ deve ser traduzido como título ou simples descrição
  choice: “o Escolhido”, com inicial maiúscula
  alternative: “o escolhido” ou “o Eleito”
  rationale: No contexto das Parábolas, a palavra funciona repetidamente como título. A tradução não identifica essa figura com nenhuma formulação cristológica posterior.
- issue: Valor aspectual de ቆመ diante do Senhor dos Espíritos
  choice: “está de pé”
  alternative: “tem estado de pé”, “permanece” ou “pôs-se de pé”
  rationale: Verbos de postura no perfeito ge'ez frequentemente descrevem um estado presente. “Está de pé” evita transformar esse estado contínuo em ação passada já concluída.
- issue: Sentido de ዓመፃ em oposição a ጽድቅ
  choice: “iniquidade”
  alternative: “violência”, “maldade”, “injustiça” ou “transgressão da lei”
  rationale: O contraste é amplo, entre a justiça e aquilo que se opõe a ela. “Iniquidade” preserva essa amplitude sem restringir o termo a violência ou ilegalidade formal.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário bíblico amplamente compreensível. A estrutura paralela e a imagem da sombra foram preservadas; ambiguidades lexicais e aspectuais relevantes foram mantidas nas notas.
