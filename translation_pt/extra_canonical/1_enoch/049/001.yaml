base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/001.yaml
  text: For wisdom has been poured out like water[c][b][a], and glory will not fail before him forever and ever.
translation:
  language: pt
  text: Pois a sabedoria foi derramada como água[c], e a glória não cessará[b] diante dele[a], para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O referente de “dele” não é especificado em ge'ez neste versículo. O contexto mais amplo pode apontar para uma figura exaltada mencionada anteriormente, mas o próprio versículo não a identifica.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a glória não terá fim diante dele”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “será derramada”, conforme uma interpretação anterior da forma verbal; o perfeito ge''ez favorece “foi derramada”.'
    reason: previous_rendering
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Mantém a função explicativa ou causal da conjunção e soa natural no registro elevado do contexto.
- source_word: ጥበብ
  choice: sabedoria
  rationale: É o sentido comum do substantivo e preserva o caráter sapiencial da passagem sem ampliação interpretativa.
- source_word: ክዕወ
  choice: foi derramada
  rationale: Reproduz o perfeito ge'ez como ação consumada ou estado estabelecido, distinguindo-o do verbo subsequente de valor futuro.
- source_word: ከመ፡ ማይ
  choice: como água
  rationale: Conserva diretamente a comparação e sua imagem de abundância.
- source_word: ወስብሐት
  choice: e a glória
  rationale: “Glória” corresponde ao registro celestial e exaltado, embora o termo também possa abranger esplendor ou louvor.
- source_word: ኢትኃልቅ
  choice: não cessará
  rationale: Expressa a ideia de não terminar nem se esgotar e mantém o valor futuro em contraste com o perfeito anterior.
- source_word: ቅድሜሁ
  choice: diante dele
  rationale: Preserva o sentido espacial e relacional da expressão, sem identificar interpretativamente o referente do pronome.
- source_word: ለዓለመ፡ ዓለም
  choice: para todo o sempre
  rationale: Equivalente idiomático, digno e corrente da fórmula enfática de duração eterna.
theological_decisions:
- issue: Referente de “dele” em “diante dele”
  choice: Manter o pronome sem identificar seu antecedente no texto principal.
  alternative: “diante do Senhor dos Espíritos” ou “diante do Escolhido/Filho do Homem”
  rationale: O versículo ge'ez apresenta apenas o pronome. Como os antecedentes podem mudar no contexto próximo, explicitar uma figura resolveria uma ambiguidade que a fonte preserva.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura paralela e a imagem apocalíptica foram preservadas; evitou-se explicitar o antecedente teológico do pronome.
