base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/004.yaml
  text: And he will judge the hidden things[a], and no one will be able to speak an empty word before him, for he is the Chosen One before the Lord of Spirits[c][b], according as he has willed.
translation:
  language: pt
  text: E ele julgará as coisas ocultas, e ninguém poderá proferir uma palavra vazia diante dele[a], pois ele é o Escolhido diante do Senhor dos Espíritos, conforme ele quis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação em ge'ez é difícil neste testemunho. A expressão também pode ser entendida como “ninguém poderá proferir falsidade diante dele”.
    reason: textual_variant
  - marker: b
    text: O pronome de “ele quis” não identifica expressamente seu referente; pode apontar para o Senhor dos Espíritos ou para o Escolhido.
    reason: ambiguity
lexical_decisions:
- source_word: ይኴንን
  choice: julgará
  rationale: O verbo denota julgar ou proferir decisão; o futuro se ajusta ao contexto escatológico e preserva a dimensão judicial.
- source_word: ዘኅቡአተ
  choice: as coisas ocultas
  rationale: Mantém o sentido concreto e apocalíptico daquilo que está escondido, sem restringi-lo a segredos verbais.
- source_word: በከ፡ አልቦ፡ ዘይክል፡ ብሂለ፡ በቅድሜሁ
  choice: ninguém poderá proferir uma palavra vazia diante dele
  rationale: A sequência é textualmente difícil, mas parece negar a possibilidade de fala vã, vazia ou falsa na presença dessa figura. A formulação preserva a imagem literal sem excluir a conotação de falsidade.
- source_word: ኅሩይ
  choice: o Escolhido
  rationale: O termo funciona como título recorrente da figura escatológica nas Parábolas; a inicial maiúscula indica esse uso titular sem impor identificação doutrinária posterior.
- source_word: እግዚአ፡ መናፍስት
  choice: o Senhor dos Espíritos
  rationale: Preserva o título apocalíptico característico de 1 Enoque em forma natural e solene em português.
- source_word: በከመ፡ ውእቱ፡ ፈቀደ
  choice: conforme ele quis
  rationale: Reproduz de modo conciso a referência pronominal do ge'ez e não resolve silenciosamente a possível ambiguidade quanto ao antecedente.
theological_decisions:
- issue: Caráter titular e capitalização de ኅሩይ
  choice: o Escolhido
  alternative: o escolhido; o Eleito
  rationale: No contexto das Parábolas, a expressão é uma designação titular da figura escatológica. A tradução evita tanto banalizar o título quanto harmonizá-lo com fórmulas cristológicas posteriores.
- issue: Antecedente do pronome em በከመ፡ ውእቱ፡ ፈቀደ
  choice: conforme ele quis
  alternative: conforme o Senhor dos Espíritos quis; conforme o Escolhido quis
  rationale: O texto mantém uma referência pronominal que pode ser associada ao referente imediatamente anterior ou entendida no quadro mais amplo da vontade divina. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. “Proferir” sustenta o tom judicial sem soar arcaico; “palavra vazia” conserva a imagem do texto e sua possível carga moral de vaidade ou falsidade.
