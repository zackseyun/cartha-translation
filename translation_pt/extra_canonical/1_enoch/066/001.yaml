base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/066/001.yaml
  text: And after this he showed me the angels of punishment[c][b][a], who are prepared to come and release all the power of the waters.
translation:
  language: pt
  text: Depois disso, ele me mostrou os anjos do castigo, que estão preparados[a] para vir e liberar toda a força das águas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma ge'ez é difícil; também pode ser traduzida por “que estão prontos” ou “que estão sendo preparados”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “abrir toda a força das águas”; no contexto, a expressão provavelmente significa soltar ou liberar toda a sua força.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ ዝ
  choice: Depois disso
  rationale: Expressa de modo natural a fórmula temporal que dá sequência ao relato visionário.
- source_word: አርአየኒ
  choice: ele me mostrou
  rationale: Preserva o caráter visual e direto do verbo sem ampliá-lo para “revelou”.
- source_word: መላእክተ መቅሠፍት
  choice: os anjos do castigo
  rationale: Mantém a construção genitiva e o tom judicial-apocalíptico; “castigo” é claro e menos restrito fisicamente que “flagelo”.
- source_word: እለ ይልዋን
  choice: que estão preparados
  rationale: Representa a ideia provável de prontidão ou preparação, mantendo em nota a dificuldade da forma ge'ez.
- source_word: ከመ ይምጽኡ
  choice: para vir
  rationale: Traduz de maneira concisa a relação de finalidade ligada à preparação dos anjos.
- source_word: ወይፍትሑ
  choice: e liberar
  rationale: O verbo pode significar “abrir”, “soltar” ou “liberar”; com “força das águas”, “liberar” é a combinação idiomática mais natural em português e conserva a imagem de forças contidas.
- source_word: ኵሎ ኀይለ ማይ
  choice: toda a força das águas
  rationale: “Força” comunica naturalmente a potência destrutiva do elemento aquático, enquanto o plural “águas” preserva a imagem cósmica do contexto.
theological_decisions:
- issue: Natureza dos agentes de castigo
  choice: Seres angélicos encarregados de executar o castigo e liberar as forças das águas
  alternative: Mensageiros humanos ou anjos ligados apenas a uma correção disciplinar mais branda
  rationale: O contexto apocalíptico apresenta seres celestiais administrando o juízo cósmico; a ação sobre as águas favorece a leitura de agentes angélicos sobrenaturais, sem especificar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o tom visionário e judicial, evitando arcaísmos e explicações doutrinárias no corpo do versículo.
