base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/044/001.yaml
  text: 'And another thing I saw concerning the lightning: how some of the stars arise and become lightning[b][a], and they are not able to leave it.'
translation:
  language: pt
  text: 'E vi ainda outra coisa a respeito do relâmpago: como algumas das estrelas se erguem e se tornam relâmpagos, e não conseguem deixá-lo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração final é incerta. O ge'ez provavelmente significa que elas não conseguem deixá-lo ou abandoná-lo; também é possível entender que não conseguem cessar ou partir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእተ
  choice: outra coisa
  rationale: Introduz um novo elemento da visão e preserva o estilo cumulativo do relato apocalíptico.
- source_word: ርኢኩ
  choice: vi
  rationale: Forma natural e direta da fórmula visionária em português moderno.
- source_word: በእንተ
  choice: a respeito de
  rationale: Expressa a relação temática sem determinar além do que permite a sintaxe.
- source_word: መብረቅ
  choice: relâmpago / relâmpagos
  rationale: É o sentido comum no contexto e mantém a mesma imagem nas duas ocorrências; o plural na segunda ocorrência concorda naturalmente com o sujeito plural em português.
- source_word: እፎ
  choice: como
  rationale: Introduz de maneira vívida o conteúdo daquilo que foi visto.
- source_word: ይቀውሙ
  choice: se erguem
  rationale: Comunica a ideia de levantar-se ou surgir, evitando o sentido português de ganhar destaque.
- source_word: እምከዋክብተ
  choice: algumas das estrelas
  rationale: Trata እም como partitivo neste contexto, conforme a revisão mais recente, em vez de indicar separação espacial.
- source_word: ወይከውኑ
  choice: e se tornam
  rationale: Preserva a noção de vir a ser e a possível transformação presente na imagem.
- source_word: ወኢይክሉ
  choice: e não conseguem
  rationale: Expressa com naturalidade a incapacidade explícita no ge'ez.
- source_word: ኃዲገ
  choice: deixá-lo
  rationale: Mantém o sentido transitivo provável de deixar ou abandonar, com pronome retomando o estado ou fenômeno do relâmpago, sem ocultar a dificuldade textual.
theological_decisions:
- issue: Natureza da imagem das estrelas e dos relâmpagos
  choice: Manter a imagem como transformação cósmica visionária, sem identificar as estrelas como anjos ou espíritos.
  alternative: Interpretar as estrelas como seres angélicos, ou tomar a passagem apenas como descrição de fenômenos naturais.
  rationale: O versículo não identifica explicitamente os referentes; a tradução conserva a abertura interpretativa da imagem apocalíptica.
- issue: Referente e sentido da oração final
  choice: Traduzir com o objeto pronominal ambíguo “deixá-lo” e explicar a incerteza em nota.
  alternative: Traduzir como “cessar” ou “partir”.
  rationale: O verbo provavelmente significa deixar ou abandonar, mas o referente não está expresso de modo inteiramente claro; a nota preserva as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com formulação acessível ao leitor brasileiro e compreensível internacionalmente. A sintaxe visionária foi preservada sem transformar a imagem em explicação cosmológica ou angelológica.
