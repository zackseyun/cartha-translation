base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/008.yaml
  text: And the congregation of the chosen and the holy ones shall be sown[c][b][a], and all the chosen shall stand before him on that day.
translation:
  language: pt
  text: E a comunidade[a] dos escolhidos e dos santos[b] será semeada, e todos os escolhidos ficarão de pé diante dele naquele dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assembleia”, em vez de “comunidade”.'
    reason: lexical_alternative
  - marker: b
    text: “Santos” pode designar a comunidade santificada, embora, na literatura apocalíptica, o termo também possa abranger seres celestiais santos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይዘራእ
  choice: será semeada
  rationale: O verbo é entendido como passivo de “semear”. A tradução conserva a metáfora enóquica em vez de a substituir por “será vista”.
- source_word: ማኅበረ
  choice: comunidade
  rationale: Designa um grupo reunido. “Comunidade” é natural em português atual e mantém o sentido coletivo; “assembleia” também é possível.
- source_word: ኅሩያን
  choice: escolhidos
  rationale: Expressa diretamente a ideia de pessoas escolhidas sem a carga doutrinária que “eleitos” pode assumir.
- source_word: ቅዱሳን
  choice: santos
  rationale: Mantém o substantivo plural e não determina se são seres humanos santificados ou seres celestiais.
- source_word: ወይቀውሙ
  choice: estarão
  rationale: No contexto da expressão locativa “diante dele”, comunica naturalmente que tomarão posição ou permanecerão em pé na presença dele.
- source_word: በቅድሜሁ
  choice: diante dele
  rationale: Preserva de modo conciso a linguagem de presença, apropriada à cena de juízo.
- source_word: ኵሎሙ
  choice: todos
  rationale: Mantém explicitamente a universalidade do texto.
- source_word: በይእቲ ዕለት
  choice: naquele dia
  rationale: Fórmula temporal idiomática que preserva o tom escatológico.
theological_decisions:
- issue: Se ቅዱሳን se refere aos fiéis humanos ou a seres celestiais santos
  choice: “santos”, sem especificar o referente
  alternative: “santificados” para os justos humanos, ou “seres santos” para os seres celestiais
  rationale: A associação com os escolhidos favorece a comunidade dos justos, mas a linguagem apocalíptica permite sobreposição ou abertura; a tradução não resolve essa tensão.
- issue: Sentido de ወይዘራእ
  choice: “será semeada”
  alternative: “será vista”
  rationale: A análise morfológica mais recente identifica o verbo como passivo de “semear”; a metáfora deve ser preservada, embora exista uma tradução anterior divergente.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A metáfora “será semeada” foi mantida deliberadamente; evitou-se linguagem denominacional.
