translation:
  language: pt
  text: E ele os entregará aos anjos para o castigo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele os entregará aos anjos com castigo”. A construção em ge’ez pode indicar finalidade ou resultado (“para o castigo”) ou ter sentido mais instrumental (“com castigo”).'
