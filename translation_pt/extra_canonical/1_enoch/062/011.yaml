lexical_decisions:
- source_word: ወይሜጥዎሙ
  choice: E ele os entregará
  rationale: O verbo indica fazer alguém passar ao poder ou à custódia de outro. “Entregará” conserva o sentido judicial e a conjunção prefixada é representada por “E”.
- source_word: ለመላእክት
  choice: aos anjos
  rationale: A preposição marca os anjos como destinatários da entrega. A formulação direta evita acrescentar a ideia não expressa de uma classe especial de anjos.
- source_word: በመቅሠፍት
  choice: para o castigo
  rationale: O substantivo pode designar castigo, punição ou flagelação. “Para o castigo” mantém o sentido judicial e lê a construção como finalidade ou resultado, sem especificar indevidamente uma forma física de tormento.
theological_decisions:
- issue: Identidade e função dos anjos
  choice: Os anjos são apresentados sem qualificação como destinatários da entrega ligada ao castigo.
  alternative: Identificá-los explicitamente como “anjos punidores”.
  rationale: O ge’ez diz apenas “os anjos”; a tradução preserva essa indeterminação, sem importar uma categoria angelológica específica.
- issue: Relação sintática de በመቅሠፍት com a entrega
  choice: “para o castigo”, como finalidade ou resultado
  alternative: “com castigo”, em sentido mais instrumental
  rationale: A construção admite mais de uma nuance. O texto principal adota a leitura contextual mais natural em português, enquanto a nota conserva a alternativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução segue estritamente a cláusula em ge’ez fornecida; não incorpora a continuação atribuída ao versículo em outra revisão, pois ela não consta do texto-fonte apresentado.
