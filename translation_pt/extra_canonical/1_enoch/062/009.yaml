base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/009.yaml
  text: And all the kings and the mighty and the exalted[a], and those who rule the dry land, shall fall down before him on their faces, and they shall bow down and set their hope on that Son of Man[c][b], and they shall petition him and seek mercy from him.
translation:
  language: pt
  text: E todos os reis, os poderosos, os exaltados e os que governam a terra seca[a] cairão diante dele com o rosto em terra. Eles se prostrarão[b] e porão sua esperança naquele Filho do Homem; suplicarão a ele e lhe pedirão misericórdia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os que governam a terra». O ge'ez diz literalmente «a terra seca», imagem concreta do domínio terrestre.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como «lhe prestarão homenagem» ou, em sentido mais forte, «o adorarão».
    reason: lexical_alternative
  - marker: c
    text: 'O original repete o verbo «pedir»: literalmente, «pedirão a ele e lhe pedirão misericórdia».'
    reason: source_nuance
lexical_decisions:
- source_word: ይወድቁ
  choice: cairão
  rationale: Conserva a ação física intensa de cair diante dele; a expressão seguinte, «com o rosto em terra», deixa claro que se trata de prostração.
- source_word: ነገሥት፡ ወመዛዝእት፡ ወልዑላን
  choice: os reis, os poderosos, os exaltados
  rationale: Mantém as três categorias de autoridade e posição social, bem como a ironia de os exaltados serem humilhados.
- source_word: እለ፡ ይመልከዋ፡ ለየብስ
  choice: os que governam a terra seca
  rationale: Preserva a imagem concreta do ge'ez, que se refere ao domínio sobre a terra seca, sem reduzi-la simplesmente a «terra».
- source_word: በቅድሜሁ፡ በገጾሙ
  choice: diante dele com o rosto em terra
  rationale: Expressa de modo natural em português a postura corporal vívida indicada pelas duas locuções.
- source_word: ይሰግዱ
  choice: se prostrarão
  rationale: Abrange reverência, homenagem e possível adoração sem decidir em favor de apenas uma dessas nuances.
- source_word: ይሴፈዉ
  choice: porão sua esperança
  rationale: Comunica o ato de depositar esperança ou confiança em alguém e conserva a força direcional da expressão.
- source_word: ለዝኩ፡ ወልደ፡ እጓለ፡ እመሕያው
  choice: naquele Filho do Homem
  rationale: Preserva o demonstrativo e o uso titular da expressão no contexto das Parábolas de Enoque.
- source_word: ይስእልዎ፡ ወይስእሉ፡ ኀቤሁ፡ ምሕረተ
  choice: suplicarão a ele e lhe pedirão misericórdia
  rationale: Mantém os dois atos paralelos de pedir sem produzir em português uma repetição excessivamente rígida; a nota registra a repetição lexical do original.
theological_decisions:
- issue: Se a homenagem ao Filho do Homem deve ser explicitada como adoração
  choice: se prostrarão
  alternative: o adorarão; lhe prestarão homenagem
  rationale: O verbo ge'ez pode indicar prostração reverente, homenagem ou adoração. «Se prostrarão» preserva essa tensão sem impor uma conclusão teológica.
- issue: Como apresentar o título ወልደ፡ እጓለ፡ እመሕያው
  choice: naquele Filho do Homem
  alternative: naquele filho do homem; naquele filho da descendência dos viventes
  rationale: A expressão funciona como título apocalíptico nesta seção. A inicial maiúscula indica esse uso local sem acrescentar ao versículo uma formulação cristológica posterior.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluência brasileira. A pontuação divide o longo período para facilitar a leitura sem alterar sua progressão. Mantêm-se a imagem concreta de «terra seca», o título «Filho do Homem» e a ambiguidade entre prostração, homenagem e adoração.
