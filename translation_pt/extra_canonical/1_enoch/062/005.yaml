base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/005.yaml
  text: And one half of them shall look at the other half[a], and they shall be terrified, and their faces shall fall[b], and pain shall seize them when they see that Son of Man sitting on the throne of his glory.
translation:
  language: pt
  text: Uma metade deles olhará para a outra metade, e eles ficarão aterrorizados; baixarão o rosto[a], e a dor se apoderará deles quando virem aquele Filho do Homem[b] sentado no trono de sua glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus rostos serão abaixados”. A expressão etíope provavelmente descreve a manifestação visível de vergonha ou pavor.'
    reason: lexical_alternative
  - marker: b
    text: “Filho do Homem” é mantido como título apocalíptico nas Parábolas, sem importar para este texto formulações doutrinárias posteriores.
    reason: cross_reference
lexical_decisions:
- source_word: መንፈቆሙ ... ለመንፈቆሙ
  choice: uma metade deles ... a outra metade
  rationale: A repetição do substantivo com sufixo pronominal descreve mais naturalmente duas metades ou grupos. A tradução conserva a imagem concreta da companhia dividida, sem reduzi-la a uma expressão recíproca genérica.
- source_word: ይሬእዩ
  choice: olhará para / virem
  rationale: É o verbo comum de ver. “Olhará para” se ajusta à relação entre as duas metades na primeira oração, enquanto “virem” introduz naturalmente a visão do Filho do Homem.
- source_word: ይደነግጹ
  choice: ficarão aterrorizados
  rationale: O contexto é de pavor escatológico diante do juízo; “aterrorizados” preserva a intensidade melhor do que opções mais brandas como “alarmados” ou “perturbados”.
- source_word: ይቴሕቱ ገጾሙ
  choice: seus rostos se abaterão
  rationale: A expressão retrata rostos caídos ou abaixados por vergonha e medo. Esta formulação mantém a imagem vívida e continua inteligível em português atual.
- source_word: ይእኅዞሙ ሕማም
  choice: a dor se apoderará deles
  rationale: A construção significa literalmente que dor, enfermidade ou sofrimento os agarrará. “Dor” mantém aberta a dimensão física e emocional, e “se apoderará” reproduz a força do verbo.
- source_word: ወልደ ብእሲ
  choice: Filho do Homem
  rationale: Nas Parábolas, a expressão funciona como título de uma figura escatológica específica. A capitalização assinala essa função local sem acrescentar formulações doutrinárias posteriores.
- source_word: ይነብር
  choice: sentado
  rationale: Embora o verbo possa significar permanecer, habitar ou sentar-se, a presença do trono torna claro o sentido de estar sentado. O substantivo “trono” já comunica entronização.
- source_word: መንበረ ስብሐቲሁ
  choice: o trono de sua glória
  rationale: A tradução preserva a estrutura genitiva e a fórmula apocalíptica de entronização. “Glória” corresponde de modo mais direto ao substantivo etíope do que “majestade”.
theological_decisions:
- issue: Se ወልደ ብእሲ deve ser traduzido como título ou como expressão humana genérica
  choice: “aquele Filho do Homem”, como título
  alternative: “aquele filho de homem” ou “aquele ser humano”
  rationale: No contexto das Parábolas, trata-se de um agente escatológico distinto e recorrente. “Aquele” também preserva a força dêitica de ለዝኩ, sem harmonizar excessivamente o texto com usos cristãos posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a imagem concreta das duas metades, o paralelismo profético e a ambiguidade de “dor” entre sofrimento físico e emocional. Os marcadores de nota foram posicionados junto às expressões efetivamente comentadas.
