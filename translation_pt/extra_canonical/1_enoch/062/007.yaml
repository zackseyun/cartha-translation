base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/007.yaml
  text: For from the beginning the Son of Man was hidden[a], and the Most High kept him in the presence of his power[b], and revealed him to the chosen ones.
translation:
  language: pt
  text: Pois, desde o princípio, o Filho do Homem estava oculto, e o Altíssimo o guardou na presença de seu poder[a] e o revelou aos escolhidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante de seu poder” ou “diante de sua força”. A expressão ge'ez é difícil; esta tradução preserva sua imagem em vez de explicá-la por meio de uma paráfrase.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Mantém a força explicativa do conectivo e soa natural em português digno.
- source_word: እምቅድሙ
  choice: desde o princípio
  rationale: Interpreta corretamente o advérbio em sentido temporal, conforme a revisão mais recente, preservando o motivo de ocultação anterior à revelação.
- source_word: ኅቡእ ኮነ
  choice: estava oculto
  rationale: Expressa um estado de ocultação sem sugerir, desnecessariamente, que ele passou a ficar oculto naquele momento.
- source_word: ወልደ እጓለ እመሕያው
  choice: o Filho do Homem
  rationale: É a designação apocalíptica reconhecível neste contexto; a capitalização indica uso titular sem acrescentar identificação doutrinária posterior.
- source_word: ዐቀቦ
  choice: o guardou
  rationale: Preserva o campo semântico de guardar, conservar ou reservar e mantém explícito o objeto pronominal.
- source_word: ልዑል
  choice: o Altíssimo
  rationale: Equivalente português natural e tradicional do título divino, sem especificação confessional adicional.
- source_word: በቅድመ ኃይሉ
  choice: diante de seu poder
  rationale: Mantém a difícil imagem espacial e o substantivo concreto “poder”, evitando dissolvê-los numa paráfrase interpretativa.
- source_word: ከሠቶ
  choice: o revelou
  rationale: Cria o contraste direto com a ocultação inicial e preserva o motivo apocalíptico da revelação.
- source_word: ለኅሩያን
  choice: aos escolhidos
  rationale: Forma substantivada clara e corrente em português, adequada à comunidade eleita mencionada no texto.
theological_decisions:
- issue: Valor titular de ወልደ እጓለ እመሕያው
  choice: o Filho do Homem
  alternative: o filho do homem; o filho da descendência dos viventes
  rationale: A expressão funciona nas Parábolas como designação apocalíptica reconhecível. A tradução não acrescenta uma identificação cristológica além do que o contexto local afirma.
- issue: Alcance do motivo de ocultação desde o princípio
  choice: desde o princípio ... estava oculto ... o guardou ... o revelou
  alternative: estava oculto desde a eternidade; foi reservado pelo Altíssimo
  rationale: O texto apresenta uma ocultação anterior seguida de revelação, mas não deve ser ampliado para uma afirmação metafísica mais específica do que sua própria formulação.
- issue: Sentido da expressão በቅድመ ኃይሉ
  choice: diante de seu poder
  alternative: na presença de seu poder; perante sua força; com seu poder
  rationale: A formulação conserva a dificuldade e a imagem do ge'ez em vez de resolver silenciosamente a relação entre presença, poder e preservação.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O período mantém cadência apocalíptica digna, com vocabulário corrente. “Estava oculto” é mais natural para um estado continuado; “diante de seu poder” permanece deliberadamente concreto e ambíguo.
