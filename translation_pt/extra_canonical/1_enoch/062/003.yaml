base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/003.yaml
  text: And in that day all the kings and the mighty and the exalted[a], and those who possess the earth, shall stand up, and they shall see and recognize that he sits on the throne of his glory; and righteousness shall be judged before him[b], and no lying word shall be spoken before him.
translation:
  language: pt
  text: E naquele dia, todos os reis, os poderosos, os exaltados e os que possuem a terra[a] se levantarão. Eles verão e reconhecerão que ele está sentado no trono da sua glória; e a justiça será julgada diante dele[b], e nenhuma palavra mentirosa será dita diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que detêm a terra” ou “os que governam a terra/o mundo”. O verbo ge'ez pode indicar segurar, possuir ou exercer controle.
    reason: lexical_alternative
  - marker: b
    text: A oração “a justiça será julgada diante dele” é textual e sintaticamente difícil no etíope. A tradução conserva o sentido judicial da expressão, em vez de substituí-la por uma formulação mais habitual.
    reason: textual_variant
lexical_decisions:
- source_word: ወይቀውሙ
  choice: se levantarão
  rationale: Preserva a imagem corporal e judicial de levantar-se ou pôr-se de pé, sem interpretá-la como ressurreição.
- source_word: በይእቲ ዕለት
  choice: naquele dia
  rationale: Fórmula temporal apocalíptica natural em português, com ressonância profética.
- source_word: ኵሎሙ ነገሥት ወዐዚዛን ወልዑላን
  choice: todos os reis, os poderosos, os exaltados
  rationale: Mantém as três categorias da elite político-social e a progressão retórica do texto.
- source_word: ወእለ ይእኅዝዋ ለምድር
  choice: e os que dominam a terra
  rationale: Expressa de modo natural o exercício de posse ou controle implicado pelo verbo, sem restringir a expressão a proprietários de terras; a nota registra a amplitude lexical.
- source_word: ወይሬእይዎ ወያአምርዎ
  choice: Eles verão e reconhecerão
  rationale: Reproduz a dupla ideia de percepção e reconhecimento, mais forte que mero conhecimento intelectual.
- source_word: ከመ ይነብር ዲበ መንበረ ስብሐቲሁ
  choice: que ele está sentado no trono da sua glória
  rationale: Conserva a imagem de entronização em linguagem portuguesa clara e digna.
- source_word: ወጽድቅ ቅድሜሁ ይትኴነን
  choice: e a justiça será julgada diante dele
  rationale: Mantém o substantivo 'justiça' e o sentido judicial do verbo, sem suavizar uma construção etíope textual e sintaticamente difícil.
- source_word: ወነገረ በከ አልቦ ዘይትበሀል በቅድሜሁ
  choice: e nenhuma palavra mentirosa será dita diante dele
  rationale: Preserva a negação de todo discurso falso em sua presença e o tom solene de tribunal.
theological_decisions:
- issue: Identidade da figura entronizada
  choice: Manter o pronome “ele”.
  alternative: Identificá-lo explicitamente como o Filho do Homem ou o Senhor dos Espíritos.
  rationale: O versículo emprega uma referência pronominal e não repete um título; a tradução preserva essa ambiguidade local.
- issue: Sentido de “os que dominam a terra”
  choice: Manter uma expressão ampla, referente a posse, controle ou domínio.
  alternative: Restringir a proprietários da terra ou identificar especificamente governantes do mundo.
  rationale: A expressão ge'ez admite posse e exercício de controle; o contexto apocalíptico não exige uma delimitação mais estreita.
- issue: A justiça como objeto de julgamento
  choice: Conservar a formulação difícil “a justiça será julgada”.
  alternative: Interpretar como “o julgamento justo será realizado” ou “a justiça será estabelecida”.
  rationale: A forma escolhida retém a tensão sintática e o caráter judicial do texto, sem introduzir uma solução teológica não explicitada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e apocalíptico, sem arcaísmos desnecessários. A pontuação em duas frases reduz a extensão do período sem alterar sua progressão.
