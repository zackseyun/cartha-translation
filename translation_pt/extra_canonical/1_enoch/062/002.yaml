base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/002.yaml
  text: And the Lord of Spirits seated him on the throne of his glory[a], and the spirit of righteousness was poured out upon him, and the word of his mouth slays all the sinners[d][c][b], and all the lawless are destroyed from before his face.
translation:
  language: pt
  text: E o Senhor dos Espíritos o fez sentar-se no trono da sua glória, e o espírito de justiça foi derramado sobre ele[a]. A palavra da sua boca mata todos os pecadores, e todos os transgressores são destruídos de diante da sua face[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome «ele» não é identificado explicitamente neste versículo; pelo contexto, pode referir-se à figura entronizada mencionada anteriormente.
    reason: referential_ambiguity
  - marker: b
    text: Literalmente, «de diante da sua face»; expressão de juízo que descreve destruição e remoção da presença da figura entronizada.
    reason: cultural_note
lexical_decisions:
- source_word: አንበረ
  choice: o fez sentar-se
  rationale: O causativo transitivo indica que o Senhor dos Espíritos faz o referente masculino implícito sentar-se, isto é, o entroniza; evita-se o intransitivo incorreto «sentou-se».
- source_word: እግዚእ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém o título estabelecido nas Parábolas de 1 Enoque e seu registro apocalíptico solene.
- source_word: መንበረ ስብሐቲሁ
  choice: o trono da sua glória
  rationale: Preserva a construção genitiva e a imagem visionária do trono associado à glória.
- source_word: መንፈሰ ጽድቅ
  choice: o espírito de justiça
  rationale: «Justiça» comunica em português corrente tanto a retidão quanto a dimensão judicial de ጽድቅ, sem restringir a expressão a uma qualidade meramente moral.
- source_word: ተክዕወ ዲቤሁ
  choice: foi derramado sobre ele
  rationale: Conserva a imagem forte de algo derramado e o pronome masculino do testemunho ge'ez.
- source_word: ነገረ አፉሁ
  choice: a palavra da sua boca
  rationale: Mantém a expressão concreta e solene segundo a qual a fala do entronizado executa o juízo.
- source_word: ይቀትል ኵሎሙ ኃጥኣነ
  choice: mata todos os pecadores
  rationale: O presente traduz o imperfeito ge'ez e conserva sua força característica, contínua ou futura; «mata» retém o sentido explicitamente letal.
- source_word: ዐማፂያን
  choice: os transgressores
  rationale: Expressa oposição à ordem divina sem limitar o termo a rebelião política; também evita a formulação substantivada menos natural «os sem lei».
- source_word: እምገጹ ይትሐጐሉ
  choice: são destruídos diante da sua face
  rationale: O presente representa o imperfeito, enquanto «diante da sua face» preserva a imagem espacial e judicial do original.
theological_decisions:
- issue: Referente de «ele» em «foi derramado sobre ele»
  choice: Manter o pronome masculino «sobre ele» sem identificar expressamente o referente.
  alternative: «sobre o Eleito/Filho do Homem» ou «sobre o trono»
  rationale: O ge'ez apresenta um pronome masculino singular, e o contexto sugere um referente sem que este versículo o nomeie; a tradução conserva essa ambiguidade.
- issue: Agente e objeto do entronizamento
  choice: Traduzir o Senhor dos Espíritos como agente que faz um referente implícito sentar-se no trono.
  alternative: «o Senhor dos Espíritos sentou-se no trono»
  rationale: A forma verbal é causativa e transitiva; a alternativa intransitiva altera a cena e elimina o objeto implícito retomado do contexto.
- issue: Eficácia judicial da palavra da boca
  choice: «a palavra da sua boca mata»
  alternative: «ele pronuncia uma sentença, e os pecadores morrem»
  rationale: A formulação conserva a personificação ou eficácia direta da palavra sem harmonizá-la com tradições posteriores nem explicar além do texto.
- issue: Valor aspectual dos verbos finais
  choice: 'Usar o presente: «mata» e «são destruídos».'
  alternative: Passado («matou», «foram destruídos») ou futuro («matará», «serão destruídos»)
  rationale: Os imperfeitos ge'ez permitem valor característico, contínuo ou futuro. O presente preserva melhor essa abertura e o contraste com os perfectivos anteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação longa do ge'ez foi dividida em duas frases para maior clareza, sem alterar a progressão do pensamento. Mantiveram-se o título apocalíptico, a imagem concreta do derramamento e a expressão semítica «diante da sua face».
