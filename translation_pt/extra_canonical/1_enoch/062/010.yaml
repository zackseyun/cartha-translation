base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/010.yaml
  text: And the Lord of Spirits will drive them so that they hasten and go out from before his face[a], and their faces will be filled with shame[c][b], and darkness will be added to their faces.
translation:
  language: pt
  text: E o Senhor dos Espíritos os impelirá, para que se apressem e saiam de diante de sua face[a]; os rostos deles se encherão de vergonha, e trevas serão acrescentadas aos rostos deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de sua presença”. Mais literalmente, o geʿez diz: “de diante de sua face”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, as trevas aumentarão sobre os rostos deles. O verbo indica acréscimo ou intensificação, não necessariamente cobertura.
    reason: lexical_clarification
lexical_decisions:
- source_word: ይጐጕኦሙ
  choice: os impelirá
  rationale: Expressa a ação coerciva de pôr em movimento sem restringir o sentido a terror emocional ou perseguição.
- source_word: እግዚአ መናፍስት
  choice: o Senhor dos Espíritos
  rationale: Preserva o título apocalíptico recorrente em 1 Enoque.
- source_word: ከመ ይፍጥኑ
  choice: para que se apressem
  rationale: Mantém a relação final ou resultativa e a ideia de pressa forçada.
- source_word: ወይፃኡ እምቅድመ ገጹ
  choice: e saiam de diante de sua face
  rationale: Conserva a imagem explícita da face e a linguagem de comparecimento perante uma autoridade.
- source_word: ገጾሙ ይመልእ ኃፍረተ
  choice: o rosto deles se encherá de vergonha
  rationale: Mantém a imagem facial e a dimensão pública da desonra no julgamento.
- source_word: ጽልመት ይትዌሰክ ገጾሙ
  choice: trevas serão acrescentadas ao rosto deles
  rationale: Traduz o sentido de adição ou aumento, sem introduzir a noção distinta de cobrir nem a metáfora física de empilhar.
theological_decisions:
- issue: Expressão antropomórfica da presença divina
  choice: de diante de sua face
  alternative: de sua presença
  rationale: O ge'ez menciona expressamente a face. A tradução conserva essa imagem apocalíptica sem convertê-la silenciosamente em linguagem abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o paralelismo e as imagens concretas do ge'ez; “rosto deles” evita a ambiguidade possessiva que “seus rostos” poderia criar.
