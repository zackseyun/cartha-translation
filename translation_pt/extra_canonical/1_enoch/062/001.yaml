base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/001.yaml
  text: And thus the Lord commanded the kings and the mighty and the exalted[a], and those who dwell on the earth, and said, “Open your eyes and lift up your horns[b], if you are able to recognize the Chosen One.”
translation:
  language: pt
  text: 'E assim o Senhor deu ordem aos reis, aos poderosos, aos que ocupam posições elevadas e aos que habitam a terra. Ele disse: “Abram os olhos e ergam seus chifres[a], se forem capazes de reconhecer o Escolhido[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ergam seus chifres” provavelmente emprega os chifres como imagem de força, posição ou poder orgulhoso; a tradução mantém a imagem em vez de substituí-la por um termo abstrato.
    reason: cultural_note
  - marker: b
    text: Ou “o Eleito”. O termo ge’ez funciona como título formal nas Parábolas, e não apenas como adjetivo descritivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: አዘዘ
  choice: deu ordem
  rationale: Expressa uma determinação forte e solene, adequada ao cenário judicial e apocalíptico, sem tornar a frase artificial em português.
- source_word: እግዚእ
  choice: o Senhor
  rationale: Preserva o título divino e sua força soberana no contexto.
- source_word: ነገሥት
  choice: reis
  rationale: Mantém a referência política concreta do termo, em vez de generalizá-lo como governantes.
- source_word: ዐዚዛን
  choice: poderosos
  rationale: Designa pessoas dotadas de poder ou força e é natural no português atual.
- source_word: ልዑላን
  choice: os que ocupam posições elevadas
  rationale: Comunica alta posição ou status sem restringir indevidamente o termo a uma classe específica, como nobres.
- source_word: እለ የሐድርዋ ለምድር
  choice: os que habitam a terra
  rationale: Reproduz de modo natural a expressão apocalíptica relativa aos habitantes da terra.
- source_word: ክሥቱ አዕይንቲክሙ
  choice: Abram os olhos
  rationale: Mantém a ordem de abrir ou desvelar os olhos no contexto de percepção e revelação.
- source_word: አንሥኡ አቅርንቲክሙ
  choice: ergam seus chifres
  rationale: Conserva a imagem apocalíptica concreta dos chifres, em vez de substituí-la por uma interpretação abstrata.
- source_word: ትክሉ
  choice: se forem capazes
  rationale: Preserva a condição que põe à prova a capacidade dos destinatários.
- source_word: አእምሮቶ
  choice: reconhecer
  rationale: No contexto, indica identificar corretamente a figura revelada, não apenas adquirir conhecimento abstrato.
- source_word: ሐሩይ
  choice: o Escolhido
  rationale: Trata a expressão como título formal e emprega uma formulação clara e corrente em português.
theological_decisions:
- issue: Tradução do título ሐሩይ nas Parábolas
  choice: o Escolhido
  alternative: o Eleito
  rationale: Ambas as traduções são possíveis. “O Escolhido” é transparente no português contemporâneo e preserva a função titular sem impor terminologia doutrinária posterior.
- issue: Interpretação da ordem de erguer os chifres
  choice: manter a imagem literal “ergam seus chifres”
  alternative: “mostrem seu poder” ou “ergam-se com orgulho”
  rationale: A imagem pode evocar força, posição ou poder orgulhoso, mas o texto não explicita apenas um desses sentidos. Mantê-la preserva a ambiguidade e o registro apocalíptico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi dividida em duas frases para evitar uma construção pesada, sem alterar a sequência do original. As formas verbais no plural evitam regionalismos excessivos, e as imagens apocalípticas foram preservadas.
