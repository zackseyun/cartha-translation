base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/006.yaml
  text: And the kings and the mighty and all who possess the earth shall bless and praise and exalt him who rules over all that is hidden[a][b].
translation:
  language: pt
  text: E os reis, os poderosos e todos os que possuem a terra abençoarão, louvarão e exaltarão aquele que reina sobre tudo o que está oculto.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os que detêm a terra”. O verbo ge'ez pode indicar segurar ou possuir; neste contexto, provavelmente se refere aos que exercem poder terreno.
    reason: lexical_alternative
  - marker: b
    text: A expressão “aquele que reina sobre tudo o que está oculto” permanece descritiva porque o versículo não atribui um título explícito a essa figura.
    reason: alternative_reading
lexical_decisions:
- source_word: ይባርክዎ
  choice: abençoarão
  rationale: O imperfeito precedido de conjunção dá continuidade à sequência visionária futura; “abençoarão” preserva o tom elevado e litúrgico.
- source_word: ይሴብሕዎ
  choice: louvarão
  rationale: O verbo expressa louvor ou aclamação doxológica; “louvarão” é claro e natural em português.
- source_word: የልዕልዎ
  choice: exaltarão
  rationale: O verbo comunica elevar ou engrandecer; “exaltarão” mantém o registro régio e apocalíptico sem soar arcaico.
- source_word: ነገሥት
  choice: os reis
  rationale: Mantém o sentido comum e a concretude política da cena.
- source_word: መዛዝእት
  choice: os poderosos
  rationale: No contexto de juízo, designa pessoas detentoras de poder ao lado dos reis; “os poderosos” é corrente e socialmente explícito.
- source_word: ኵሎሙ እለ ይእሕዝዋ ለምድር
  choice: todos os que possuem a terra
  rationale: O verbo pode significar segurar ou possuir. A formulação conserva a ideia de domínio terreno sem introduzir necessariamente a nuance de conquista violenta.
- source_word: ለዘይመልክ
  choice: aquele que reina
  rationale: A construção relativa descreve uma figura singular por seu governo régio; “reina” preserva essa nuance melhor do que o mais genérico “governa”.
- source_word: ኵሎ ዘኅቡእ
  choice: tudo o que está oculto
  rationale: A expressão é abrangente e não deve ser reduzida apenas a “segredos”; a tradução preserva seu alcance cósmico e revelatório.
theological_decisions:
- issue: Identidade da figura singular que reina sobre tudo o que está oculto
  choice: Traduzir por uma descrição, sem identificar explicitamente a figura no texto principal.
  alternative: Identificá-la como o Senhor dos Espíritos, o Filho do Homem/Eleito ou Deus.
  rationale: O ge'ez emprega uma oração relativa, não um título explícito. A tradução preserva a tensão teológica do contexto e evita harmonização interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação tripla “abençoarão, louvarão e exaltarão” conserva o ritmo solene do original; “aquele que reina” mantém o caráter régio sem resolver a identidade da figura.
