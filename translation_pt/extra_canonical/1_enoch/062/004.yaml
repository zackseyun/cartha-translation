base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/004.yaml
  text: And pain shall come upon them as upon a woman in labor[a], when her child comes to the mouth of the womb[c][b], and she is constrained in giving birth.
translation:
  language: pt
  text: E a dor virá sobre eles como sobre uma mulher em trabalho de parto[a], quando seu filho chega à abertura do ventre; e ela sofre para dar à luz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma mulher que está em trabalho de parto”.'
    reason: lexical_alternative
  - marker: b
    text: Uma frase entre colchetes no testemunho de origem indica incerteza textual na descrição da aflição da mulher durante o parto; a tradução apresenta o sentido recebido sem definir em excesso a sintaxe.
    reason: textual_variant
lexical_decisions:
- source_word: ሕማም
  choice: dor
  rationale: O termo indica dor ou aflição corporal; no símile do parto, “dor” mantém sua força concreta e também comporta a angústia apocalíptica.
- source_word: ማሕምም
  choice: em trabalho de parto
  rationale: A expressão descreve a mulher acometida pelas dores do parto. Esta formulação é corrente, clara e preserva a imagem concreta.
- source_word: የዓፅብ / ተዐፅብ
  choice: sofre
  rationale: O verbo comunica aperto, dificuldade ou aflição. “Sofre” produz português natural no contexto sem reduzir a intensidade física do parto.
- source_word: ወሊድ
  choice: dar à luz
  rationale: O substantivo pertence ao campo semântico do parto; a locução verbal é idiomática em português e mantém a ação concreta.
- source_word: በአፈ ማሕፀን
  choice: à abertura do ventre
  rationale: A expressão é literalmente “à boca do ventre”. “Abertura do ventre” conserva a referência anatômica com clareza e dignidade em português moderno.
theological_decisions:
- issue: Generalizar a imagem do parto como terror abstrato ou conservar o símile concreto
  choice: Conservar a comparação concreta com a dor e a dificuldade do parto
  alternative: Traduzir de modo geral como “a angústia se apoderará deles como de uma mulher em dores de parto”, omitindo o detalhe anatômico
  rationale: O versículo sustenta a imagem do parto até a chegada da criança à abertura do ventre. Preservá-la mantém a retórica apocalíptica e evita uma paráfrase doutrinariamente carregada.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A redação mantém tom digno e a imagem física do texto, evitando o arcaísmo “dores de parto” como única formulação e preferindo a expressão corrente “trabalho de parto”.
