base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/001.yaml
  text: And I saw one of those four who had come out first, and he seized that first star which had fallen from heaven, and bound its hands and its feet, and threw it into the abyss. And that abyss was narrow and deep and dreadful and dark.
translation:
  language: pt
  text: Então vi um daqueles quatro que tinham saído primeiro[c]. Ele agarrou aquela primeira estrela que havia caído do céu, amarrou-lhe as mãos e os pés[a] e a lançou no abismo[b]. E aquele abismo era estreito, profundo, terrível e escuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “estrela” é apresentada com mãos e pés, indicando que, na visão, o símbolo representa um ser celestial pessoal submetido a julgamento.
    reason: cultural_note
  - marker: b
    text: Ou “profundeza”. O termo geʽez designa uma grande profundidade; “abismo” preserva aqui a ideia apocalíptica de um lugar de confinamento.
    reason: lexical_alternative
  - marker: c
    text: Ou “que tinham saído anteriormente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Então vi
  rationale: Mantém a fórmula narrativa da visão em português natural; “então” dá continuidade ao relato sem a solenidade arcaizante de “e eis que vi”.
- source_word: አሐደ፡ እምእልኩ፡ ፬እለ
  choice: um daqueles quatro
  rationale: Expressa a seleção de um integrante de um grupo já mencionado e conserva a força anafórica de “aqueles”.
- source_word: ወፅኡ፡ እምቅዳሚ
  choice: que tinham saído primeiro
  rationale: O mais-que-perfeito composto situa a saída antes da ação vista, e “primeiro” traduz o valor adverbial de እምቅዳሚ sem acrescentar um pronome ausente do geʽez.
- source_word: አሐዘ
  choice: agarrou
  rationale: Comunica uma tomada firme e coercitiva, apropriada à sequência de captura, amarração e encarceramento.
- source_word: ለዝኩ፡ ኮከብ፡ ቀዳማይ
  choice: aquela primeira estrela
  rationale: Preserva tanto o demonstrativo, que remete a uma figura já vista, como o ordinal, sem substituir o símbolo por sua interpretação.
- source_word: ዘወድቀ፡ እምሰማየ
  choice: que havia caído do céu
  rationale: Apresenta a queda como anterior à captura e conserva a imagem vertical do texto apocalíptico.
- source_word: ወአሰረ፡ እደዊሁ፡ ወእገሪሁ
  choice: amarrou-lhe as mãos e os pés
  rationale: É uma construção portuguesa clara e idiomática que mantém os membros pessoais atribuídos à estrela na visão.
- source_word: ወወደዮ፡ ውስተ፡ ማዕምቅ
  choice: e a lançou no abismo
  rationale: “Lançou” transmite a ação enérgica e punitiva; o pronome feminino concorda gramaticalmente com “estrela” sem trocar o símbolo por “anjo”.
- source_word: ማዕምቅ
  choice: abismo
  rationale: Conserva a ideia de profundidade extrema e a conotação apocalíptica de um lugar de confinamento.
- source_word: ጸቢብ፡ ወዕሙቅ፡ ወዕጹብ፡ ወጽልመት
  choice: estreito, profundo, terrível e escuro
  rationale: Reproduz a sequência cumulativa de qualificativos com vocabulário moderno, digno e prontamente compreensível.
theological_decisions:
- issue: Se a “estrela” caída deve ser identificada explicitamente como um anjo no texto principal
  choice: Manter “estrela” e deixar que mãos e pés indiquem o caráter pessoal da figura simbólica.
  alternative: Traduzir diretamente como “anjo” ou empregar uma designação masculina para a figura.
  rationale: O geʽez diz “estrela”. Explicitar “anjo” resolveria interpretativamente um símbolo que o próprio texto preserva; a tradução mantém a tensão entre a imagem celeste e a atuação pessoal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno sem arcaísmos. A estrutura conserva a progressão rápida da visão e seus símbolos, enquanto a pontuação evita uma sequência excessivamente pesada de conjunções.
