base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/002.yaml
  text: And one of them drew a sword and gave it to those elephants and camels and donkeys[a], and they began to strike one another.
translation:
  language: pt
  text: E um deles desembainhou uma espada e a entregou àqueles elefantes, camelos e jumentos; então eles começaram a ferir-se uns aos outros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação etíope no final do versículo é difícil. O sentido parece ser que, depois de receberem a espada, esses animais passaram a praticar violência uns contra os outros; “começaram a ferir-se uns aos outros” é uma tradução cautelosa.
    reason: textual_variant
lexical_decisions:
- source_word: መላሕ
  choice: desembainhou
  rationale: Em associação com “espada”, exprime naturalmente o ato de tirá-la da bainha; é mais preciso e vívido que o genérico “pegou”.
- source_word: ሰይፈ
  choice: espada
  rationale: É o termo concreto comum para a arma e preserva literalmente a imagem apocalíptica.
- source_word: ወወሀቦሙ
  choice: a entregou
  rationale: Comunica de modo natural a transferência da espada, mantendo a simplicidade narrativa do verbo.
- source_word: ለእልኩ ነጌያት ወአገማል ወአእዱግ
  choice: àqueles elefantes, camelos e jumentos
  rationale: Mantém os animais da visão sem interpretar seus possíveis referentes históricos; “jumentos” é corrente e amplamente compreensível em português.
- source_word: አንዘ እንዘ ይትደአ
  choice: então eles começaram a ferir uns aos outros
  rationale: A formulação cautelosa representa o início da violência recíproca sem tentar eliminar a dificuldade do texto etíope.
theological_decisions:
- issue: Natureza das imagens de animais
  choice: Manter no texto principal os nomes literais dos animais como símbolos visionários.
  alternative: Identificar diretamente os animais como nações ou exércitos.
  rationale: O Apocalipse dos Animais comunica por imagens simbólicas; a tradução deve preservar a imagem e não substituir o símbolo por uma interpretação histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração foi pontuada naturalmente, e a imagem visionária foi preservada sem explicação denominacional.
