revisions:
- from: 'E vi escrito sobre eles[a] que, geração após geração, transgredirá, até que se levante uma geração de justiça; então a iniquidade será destruída, o pecado será apagado da face da terra, e todo bem virá sobre ela.


    Agora, meu filho, vá e dê a conhecer a seu filho Lameque que este menino que nasceu é verdadeiramente filho dele, e isso não é mentira. Quando Matusalém ouviu as palavras de seu pai Enoque — pois ele lhe havia mostrado em segredo todas as coisas —, voltou depois de vê-lo e deu àquele menino o nome de Noé, pois ele fará a terra se alegrar depois de toda a destruição.[b]'
  to: 'E vi escrito sobre eles[a] que, geração após geração, transgredirá, até que se levante uma geração de justiça, a iniquidade seja destruída, o pecado seja apagado da face da terra e todo bem venha sobre ela.


