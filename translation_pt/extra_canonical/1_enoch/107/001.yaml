  naturalness: O português é fluente e adequado ao registro. «Dê a conhecer a seu filho» é compreensível, mas «informe seu filho» é mais natural e elimina uma construção algo pesada. A explicitação de Lameque na referência possessiva evita ambiguidade desnecessária.
  terminology: «Iniquidade», «pecado», «justiça», Enoque, Matusalém, Lameque e Noé estão adequados. «Este filho que nasceu» preserva melhor ወልድ do que «este menino» e mantém a repetição enfática do original.
