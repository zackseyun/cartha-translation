base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/107/001.yaml
  text: And I saw written upon them that generation after generation will transgress[a], until a generation of righteousness arises, and iniquity is destroyed, and sin passes away from the earth[b], and every good thing comes upon it.
translation:
  language: pt
  text: 'E vi escrito sobre eles[a] que, geração após geração, transgredirá, até que se levante uma geração de justiça, a iniquidade seja destruída, o pecado seja apagado da face da terra e todo bem venha sobre ela.


    Agora, meu filho, vá e informe seu filho Lameque de que este filho que nasceu é verdadeiramente filho de Lameque e não é falso. Quando Matusalém ouviu as palavras de seu pai Enoque — pois ele lhe havia mostrado em segredo todas as coisas —, voltou depois de vê-lo e deu àquele filho o nome de Noé, pois ele fará a terra alegrar-se, livre de toda a destruição.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome «eles» retoma, no contexto anterior, as tábuas que Enoque contemplou.
    reason: contextual_antecedent
  - marker: b
    text: 'A expressão final também pode ser traduzida: «pois ele fará a terra alegrar-se de toda a destruição».'
    reason: translation_ambiguity
lexical_decisions:
- source_word: ወርኢኩ፡ ጽሑፈ፡ በላዕሌሆሙ
  choice: E vi escrito sobre eles
  rationale: Mantém a fórmula visionária e o particípio passivo do texto etíope, sem substituir o pronome plural por um antecedente não expresso neste versículo.
- source_word: ትውልድ፡ እምትውልድ፡ ትኤብስ
  choice: geração após geração, transgredirá
  rationale: Reproduz a sucessão reiterada das gerações e verte o verbo como transgressão moral, em consonância com o contraste subsequente entre justiça, iniquidade e pecado.
- source_word: ትውለደ፡ ጽድቅ
  choice: uma geração de justiça
  rationale: 'Preserva a construção genitiva e sua possível amplitude: uma geração caracterizada pela justiça, sem transformá-la em uma designação doutrinária mais específica.'
- source_word: ኀጢአት፡ ትትለሐስ፡ እምዲበ፡ ምድር
  choice: o pecado será apagado da face da terra
  rationale: O verbo transmite a imagem de remover ou apagar; 'da face da terra' expressa naturalmente a construção espacial etíope.
- source_word: ዝ፡ ወልድ፡ ዘተወልደ
  choice: este menino que nasceu
  rationale: Embora ወልድ possa ser vertido literalmente por 'filho', 'menino' evita em português a repetição confusa antes da afirmação de que ele é filho de Lameque.
- source_word: ኖኅ
  choice: Noé
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome bíblico.
- source_word: ያስተፌሥሓ፡ ለምድር
  choice: fará a terra se alegrar
  rationale: Verte diretamente a forma causativa associada a alegrar-se, preservando o jogo explicativo ligado ao nome sem substituí-lo pelo verbo 'consolar' de Gênesis.
theological_decisions:
- issue: Caráter da futura geração justa
  choice: uma geração de justiça
  alternative: a geração dos justos
  rationale: A construção fonte é genitiva e pode indicar qualidade ou pertencimento. A formulação escolhida mantém essa abertura em vez de identificar de modo mais definido seus integrantes.
- issue: Afirmação da paternidade de Lameque
  choice: é verdadeiramente filho dele, e isso não é mentira
  alternative: é realmente seu filho e não um engano
  rationale: Preserva a insistência do oráculo na paternidade real do menino sem explicar a razão da suspeita nem introduzir uma interpretação sobre sua origem.
- issue: Explicação do nome Noé
  choice: ele fará a terra se alegrar
  alternative: ele consolará a terra
  rationale: A escolha segue o verbo etíope de alegria. 'Consolará' aproximaria o texto da formulação de Gênesis e poderia ocultar a distinção lexical do testemunho etíope.
translation_notes:
  register: Português moderno, digno e de leitura fluente, com formas nominais reconhecíveis no Brasil e em outras comunidades lusófonas. A tradução mantém a progressão apocalíptica, a referência pronominal do original e a tensão lexical do jogo com o nome Noé, evitando arcaísmos e harmonização automática com Gênesis.
