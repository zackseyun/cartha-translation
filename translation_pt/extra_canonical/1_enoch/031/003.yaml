  text: And when they crush that fruit[c][b][a], it is better than every fragrance.
translation:
  language: pt
  text: E, quando esfregam esse fruto[a], ele é melhor[b] do que qualquer fragrância[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A leitura do verbo é incerta. A forma corrigida sugerida para o texto pode significar «esfregam»; «esmagam» também é possível. Conforme a transcrição preservada, também seria possível: «quando tomam esse fruto».'
    reason: textual_variant
  - marker: b
    text: A frase talvez indique especificamente que o aroma do fruto é superior, e não sua qualidade em sentido geral; o contexto descreve árvores aromáticas.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «do que todos os perfumes». A expressão ge''ez é difícil e compara o fruto com toda fragrância ou aroma.'
    reason: textual_variant
lexical_decisions:
- source_word: ተይነሥእዎ (leitura transmitida; possivelmente corrupção de ይሔስዎ)
  choice: esmagam
  rationale: A revisão do texto-base propõe um verbo com o sentido de esfregar ou esmagar, ação que liberaria o aroma do fruto e se ajusta ao contexto das árvores aromáticas. Como a transcrição fornecida parece corrompida e também pode ser entendida como «tomam/levantam», a incerteza é registrada em nota.
- source_word: ፍሬ
  choice: fruto
  rationale: Equivalente corrente do substantivo no contexto botânico e visionário.
- source_word: ይኄይስ
  choice: é melhor
  rationale: Preserva o valor comparativo e o aspecto não passado da forma verbal, sem decidir se a superioridade diz respeito apenas ao aroma ou à qualidade geral.
- source_word: እምኵሉ አፈው
  choice: do que qualquer fragrância
  rationale: Expressa naturalmente a comparação com a totalidade dos aromas, mantendo a imagem sensorial. «Do que todos os perfumes» também seria possível.
