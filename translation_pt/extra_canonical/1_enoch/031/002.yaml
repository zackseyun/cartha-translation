base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/002.yaml
  text: And upon that mountain I saw another mountain[a], and within it were trees; and those trees were full and strong[c][b], like almond trees.
translation:
  language: pt
  text: E sobre aquele monte vi outro monte[a], e dentro dele havia árvores; e aquelas árvores eram frondosas e robustas, como amendoeiras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “dentro dele” traduz literalmente a localização das árvores em relação ao monte; também pode ser entendida de modo mais amplo como “nele”.
    reason: lexical_alternative
  - marker: b
    text: O termo ge'ez pode designar a amêndoa ou a amendoeira. A comparação exata — com a árvore, seu fruto ou sua forma — não é inteiramente clara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲበ፡ ውእቱ፡ ደብር
  choice: sobre aquele monte
  rationale: Mantém a localização espacial e o referente demonstrativo do relato visionário em português natural.
- source_word: ደብረ፡ ካልአ
  choice: outro monte
  rationale: Expressa uma elevação distinta na sequência narrativa; “monte” preserva o vocabulário topográfico sem exagerar sua dimensão.
- source_word: ወውስቴቱ
  choice: e dentro dele
  rationale: Conserva a imagem incomum do texto, sem decidir se as árvores estavam no interior físico ou na área do monte.
- source_word: ዕፀወ / ዕፀው
  choice: árvores
  rationale: O termo designa árvores ou vegetação lenhosa; a repetição é mantida conceitualmente e retomada pelo demonstrativo.
- source_word: ወእልኩ
  choice: e aquelas
  rationale: Entende እልኩ como demonstrativo plural, em conformidade com a revisão filológica mais recente, e não como referência a plantas aromáticas.
- source_word: ምሉኣን
  choice: frondosas
  rationale: No contexto de árvores, comunica plenitude ou abundância de modo natural, preservando a qualidade visual sem especificar frutos.
- source_word: ዘከመ፡ ከርካዕ
  choice: como amendoeiras
  rationale: Segue a identificação botânica revisada de ከርካዕ como amêndoa/amendoeira; a forma plural ajusta a comparação às árvores.
- source_word: ጽኑዕተ
  choice: robustas
  rationale: Transmite firmeza, força ou resistência física das árvores em português idiomático.
