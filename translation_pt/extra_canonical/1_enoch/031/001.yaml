  naturalness: A redação revista é clara, moderna e idiomática em português internacional. «De lá saía» evita tanto a discordância portuguesa de «dele» com «montes» quanto a harmonização interpretativa de «deles».
  terminology: «Serera» deve permanecer transliterado, pois sua identificação é incerta. «Gálbano» é o equivalente português estabelecido para kelbene/galbanum; a nota adequadamente registra a alternativa de transliteração. «Néctar» mantém o caráter comparativo e concreto da substância.
