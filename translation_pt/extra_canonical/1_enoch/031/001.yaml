base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/001.yaml
  text: And I saw other mountains[a], in which there were trees, and from them there came out something like nectar[c][b], whose name was serera and galbanum.
translation:
  language: pt
  text: E vi outros montes[c], nos quais havia árvores; de lá saía algo semelhante a néctar, chamado serera[a] e gálbano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação botânica de serera é incerta; o ge'ez parece conservar o nome de uma substância aromática, não um substantivo descritivo comum.
    reason: lexical_alternative
  - marker: b
    text: O gálbano é uma resina aromática conhecida das antigas tradições de incenso; o termo ge'ez também pode ser transliterado como kelbene.
    reason: cultural_note
  - marker: c
    text: 'Algumas traduções anteriores trazem o singular: «outro monte, no qual». O ge''ez, porém, apresenta «outros montes» e «neles» no plural; mais adiante, usa uma forma pronominal formalmente singular para aquilo que saía. «De lá» evita resolver essa oscilação de número.'
    reason: textual_grammar_note
lexical_decisions:
- source_word: ወርኢኩ
  choice: Vi também
  rationale: Mantém a fórmula narrativa visionária na primeira pessoa; “também” expressa naturalmente a continuação introduzida pela conjunção.
- source_word: ካልአነ አደባረ
  choice: outros montes
  rationale: Os dois termos estão no plural, leitura confirmada pelo sufixo plural de ውስቴቶሙ; “montes” é corrente e preserva o relevo elevado da visão.
- source_word: ዘቦ ውስቴቶሙ ዕፀወ
  choice: nos quais havia árvores
  rationale: Reproduz a localização das árvores nos montes em sintaxe portuguesa natural.
- source_word: ወይወፅእ እምኔሁ
  choice: deles saía
  rationale: Conserva a imagem concreta de algo que procede do cenário descrito. O português faz a concordância referencial com “montes”, embora o sufixo ge'ez desta expressão seja formalmente singular.
- source_word: ከመ ኔቄጥር
  choice: algo semelhante a néctar
  rationale: Preserva a comparação e evita afirmar uma identificação botânica exata para a substância doce ou aromática.
- source_word: ሰረራ
  choice: serera
  rationale: Transliteração prudente, pois a identificação botânica da substância aromática é incerta.
- source_word: ከልበኔ
  choice: gálbano
  rationale: Emprega o nome português tradicional de uma resina aromática antiga, sem ocultar na nota a possibilidade de transliteração.
theological_decisions:
- issue: Se a imagem aromática deve ser generalizada como cheiro ou perfume
  choice: 'Manter a imagem de uma substância que saía dos montes: “deles saía algo semelhante a néctar”'
  alternative: “deles vinha um aroma” ou “produziam perfume”
  rationale: A formulação concreta conserva melhor a paisagem natural e maravilhosa da visão apocalíptica, sem converter uma exsudação em mera fragrância.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. Mantêm-se os nomes aromáticos antigos e a concretude da visão, com notas breves para as incertezas lexicais e a oscilação de número no ge'ez.
