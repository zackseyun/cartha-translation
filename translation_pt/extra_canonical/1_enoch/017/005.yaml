base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/005.yaml
  text: And I came to a river of fire[a], whose fire flowed like water, and it emptied into the great sea toward the west.
translation:
  language: pt
  text: E cheguei a um rio de fogo, cujo fogo corria como água e que desaguava no grande mar, em direção ao ocidente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão final diz literalmente algo como “em direção a ʿArab”. Ela pode indicar o quadrante ocidental, como traduzido aqui, mas também pode ser entendida como uma referência geográfica à Arábia.
    reason: lexical_alternative
lexical_decisions:
- source_word: መጻእኩ
  choice: cheguei
  rationale: Verbo narrativo na primeira pessoa em uma sequência de viagem visionária; “cheguei” é natural em português e não acrescenta direção ao movimento.
- source_word: ፈለገ እሳት
  choice: rio de fogo
  rationale: Preserva diretamente a imagem apocalíptica e a escala sugerida pelo curso que deságua no grande mar.
- source_word: ዘይውሕዝ እሳቱ ከመ ማይ
  choice: cujo fogo corria como água
  rationale: Mantém tanto a relação possessiva quanto a comparação estranha e deliberada entre o movimento do fogo e o da água.
- source_word: ይትከዐው
  choice: desaguava
  rationale: Expressa de modo idiomático em português o derramamento de um curso no mar, sem eliminar o caráter visionário da cena.
- source_word: ባሕር ዐቢይ
  choice: o grande mar
  rationale: Tradução formal que conserva o registro elevado e a possível designação geográfica convencional.
- source_word: መንገለ ዐረብ
  choice: em direção ao ocidente
  rationale: A expressão pode indicar o quadrante ocidental; a formulação direcional preserva essa leitura sem torná-la excessivamente específica, enquanto a nota registra a possível referência à Arábia.
theological_decisions:
- issue: Tratar o rio de fogo como símbolo interpretado ou como geografia visionária apresentada pelo narrador
  choice: 'Preservar a descrição concreta da visão: “um rio de fogo, cujo fogo corria como água”.'
  alternative: Explicitar o rio como metáfora do juízo.
  rationale: O texto relata a paisagem impossível como realidade contemplada na visão; a tradução não deve desmitologizar nem impor uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Ocidente” mantém um tom ligeiramente elevado adequado à literatura apocalíptica; a ambiguidade geográfica do original é preservada em nota.
