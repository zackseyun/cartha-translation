base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/003.yaml
  text: And I saw the places of the lights and of the thunder[a], in the extremities, in the depth, where there was a bow of fire, and arrows and their quiver, and a sword of fire[d][c][b], and all the lightnings.
translation:
  language: pt
  text: E vi os lugares das luzes e do trovão, nos confins, nas profundezas, onde havia um arco de fogo, flechas e sua aljava, uma espada de fogo e todos os relâmpagos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os depósitos das luzes e do trovão”. O texto descreve separadamente “os confins” e “as profundezas” e conserva a sequência de imagens bélicas: arco, flechas, aljava e espada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መካናተ
  choice: lugares
  rationale: O termo pode indicar lugares, moradas ou depósitos. “Lugares” segue o sentido básico e evita impor a interpretação específica de depósitos cósmicos.
- source_word: ብርሃናት
  choice: luzes
  rationale: Mantém o sentido amplo de fenômenos ou corpos luminosos e não o confunde com os relâmpagos mencionados no fim.
- source_word: ነጐድጓድ
  choice: trovão
  rationale: Equivalente natural em português para o fenômeno nomeado pelo substantivo ge'ez.
- source_word: ውስተ አጽናፍ፡ ኀበ፡ ዕመቃ
  choice: nos confins, nas profundezas
  rationale: Preserva como expressões espaciais distintas os extremos e a profundidade, sem fundi-los numa única locução.
- source_word: ቀሥተ እሳት
  choice: um arco de fogo
  rationale: Tradução transparente que conserva a imagem bélica da visão.
- source_word: ሐጾ ወምጕንጻቲሆሙ
  choice: flechas e sua aljava
  rationale: Mantém a sequência concreta de armas e entende o recipiente como a aljava associada às flechas.
- source_word: ሰይፈ እሳት
  choice: uma espada de fogo
  rationale: Reproduz diretamente a forte imagem apocalíptica.
- source_word: መበርቅት ኵሉ
  choice: todos os relâmpagos
  rationale: Conserva a pluralidade e a ideia de totalidade expressas no original.
theological_decisions:
- issue: Natureza dos lugares cósmicos
  choice: lugares das luzes e do trovão
  alternative: depósitos das luzes e do trovão
  rationale: O contexto admite a concepção de reservatórios cósmicos, mas o substantivo também significa simplesmente “lugares”. A tradução principal preserva essa ambiguidade sem transformar a interpretação contextual em afirmação explícita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe enumerativa próxima do original. “Confins” preserva o caráter cósmico e remoto da visão; “aljava” é termo preciso e ainda compreensível no registro bíblico-literário.
