base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/004.yaml
  text: And they took me as far as the living waters[a], and as far as the fire of the west[c][b], which receives every setting of the sun.
translation:
  language: pt
  text: E eles me levaram até as águas vivas[a][b] e até o fogo do ocidente[c], que recebe cada ocaso do sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra etíope entre colchetes depois de “águas vivas” é incerta neste testemunho; pode significar “que falam” ou refletir uma leitura corrompida. Por isso, não foi incluída no texto principal.
    reason: textual_variant
  - marker: b
    text: 'Ou: “águas que dão vida”. A expressão etíope significa literalmente “águas vivas” e pode sugerir águas dotadas de vida ou que comunicam vida.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “fogo do poente” ou “fogo do pôr do sol”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: E eles me levaram
  rationale: O verbo ነሥአ pode significar tomar, carregar ou levar. Neste contexto de deslocamento visionário guiado, “levaram” é natural em português sem especificar indevidamente o modo do transporte.
- source_word: እስከ
  choice: até
  rationale: A preposição repetida indica limite ou destino. “Até” reproduz com clareza o movimento rumo a locais visionários sucessivos.
- source_word: ማያት ሕያዋን
  choice: as águas vivas
  rationale: A expressão é uma construção de substantivo e adjetivo, literalmente “águas vivas”. Esta forma preserva a gramática do ge’ez e a imagem apocalíptica sem convertê-la em um genitivo interpretativo.
- source_word: '[ዘይትናገር]'
  choice: omitido do texto principal
  rationale: A forma aparece entre colchetes no testemunho e é incerta; uma tradução como “que falam” seria difícil no contexto. A incerteza é preservada em nota textual.
- source_word: እሳት ዐረብ
  choice: o fogo do ocidente
  rationale: Aqui, ዐረብ designa provavelmente o oeste, região do entardecer. A tradução mantém a geografia cósmica concreta da visão.
- source_word: ዘውእቱ ይነሥእ ኵሎ ዕርበተ ፀሐይ
  choice: que recebe cada ocaso do sol
  rationale: A oração descreve o fogo ocidental recebendo o sol quando este se põe. “Cada ocaso do sol” conserva a imagem e o caráter reiterado de ኵሎ, com dicção digna e compreensível.
theological_decisions:
- issue: Representação da geografia cósmica na jornada visionária de Enoque
  choice: Conservar “águas vivas” e “fogo do ocidente” como lugares concretos da visão
  alternative: Interpretar as expressões simbolicamente ou reduzi-las a fenômenos naturais comuns
  rationale: O texto apresenta uma cosmografia revelada. A tradução deve preservar sua concretude e estranheza apocalípticas, sem impor uma explicação simbólica ou modernizante.
translation_notes:
  register: Português moderno, internacional e legível no Brasil, com registro digno e levemente elevado. A redação conserva o paralelismo de “até... e até...” e a imagem cosmológica do original. “Ocaso” foi escolhido por concisão e solenidade, sem obscurecer o sentido.
