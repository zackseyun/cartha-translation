base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/001.yaml
  text: And they took me into a place where those who were there were like burning fire[a], and whenever they wished, they appeared like men.
translation:
  language: pt
  text: E eles me levaram a um lugar onde os que ali estavam eram como fogo ardente e, sempre que queriam, mostravam-se[a] como seres humanos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apareciam como seres humanos”. O verbo pode indicar que eles se faziam visíveis em forma humana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: E eles me levaram
  rationale: O verbo denota tomar, carregar ou conduzir. “Levaram” comunica naturalmente o transporte visionário sem especificar o modo.
- source_word: ውስተ አሐዱ መካን
  choice: a um lugar
  rationale: Embora a expressão seja literalmente “a/dentro de um lugar”, o numeral tem aqui valor indefinido; “a um lugar” preserva o sentido e soa natural em português.
- source_word: ኀበ እለ ሀለዉ ህየ
  choice: onde os que ali estavam
  rationale: Mantém a referência descritiva aos habitantes do lugar e a força locativa, sem identificá-los além do que o versículo afirma.
- source_word: ከመ እሳት ዘይነድድ
  choice: eram como fogo ardente
  rationale: Preserva a comparação explícita e a imagem intensa de fogo que queima.
- source_word: ወሶበ ይፈቅዱ
  choice: e, sempre que queriam
  rationale: Expressa tanto a vontade dos seres quanto a possibilidade repetida indicada pela construção temporal.
- source_word: ያስተርእዩ
  choice: mostravam-se
  rationale: Reproduz melhor que o simples “apareciam” a nuance causativa ou reflexiva de se fazerem visíveis.
- source_word: ከመ ሰብእ
  choice: como seres humanos
  rationale: Transmite claramente a aparência humana sem restringir o termo ao sexo masculino, preservando o contraste com a aparência ígnea.
theological_decisions:
- issue: Identidade dos seres de fogo
  choice: “os que ali estavam”, sem classificá-los
  alternative: anjos, espíritos ou vigilantes
  rationale: O versículo descreve sua aparência, mas não nomeia sua classe; a tradução evita importar uma identificação do contexto mais amplo.
- issue: Natureza da manifestação humana
  choice: “mostravam-se como seres humanos”
  alternative: “apareciam como seres humanos”
  rationale: A formulação preserva a possível nuance de manifestação voluntária sem definir se houve transformação ontológica ou apenas aparência visível.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o caráter visionário e evita identificar os seres além do que o texto ge'ez explicita.
