base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/002.yaml
  text: And they took me to a place of whirlwind[b][a], and to a mountain whose summit reached to heaven.
translation:
  language: pt
  text: E eles me levaram a um lugar de redemoinho[a] e a uma montanha cujo cume chegava até o céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um lugar de tempestade” ou “um lugar de tormenta”. O termo ge'ez sugere violenta agitação atmosférica. A preposição também pode ser entendida como “para dentro de um lugar de redemoinho e para dentro de uma montanha”.
    reason: Registra tanto as alternativas lexicais para ዘዐውሎ quanto a possível leitura ingressiva de ውስተ, sem tornar o texto principal artificial.
lexical_decisions:
- source_word: ወወሰዱኒ
  choice: E eles me levaram
  rationale: O verbo denota levar ou conduzir; “me levaram” é natural em português e não especifica indevidamente se Enoque foi guiado ou carregado.
- source_word: መካን
  choice: lugar
  rationale: Termo locativo amplo, traduzido pela opção mais transparente e menos interpretativa.
- source_word: ዘዐውሎ
  choice: de redemoinho
  rationale: Preserva a imagem vívida de movimento atmosférico violento; “tempestade” e “tormenta” permanecem alternativas possíveis.
- source_word: ደብር
  choice: montanha
  rationale: É a designação clara e natural para a elevação descrita na paisagem visionária.
- source_word: ዘክተማ ርእሱ
  choice: cujo cume
  rationale: A expressão refere-se literalmente à cabeça ou ao topo da montanha; “cume” transmite a imagem de modo idiomático e digno.
- source_word: ይበጽሕ እስከ ሰማይ
  choice: chegava até o céu
  rationale: Expressa a extensão vertical até o céu e conserva a imagem cósmica sem tornar a frase artificial em português.
theological_decisions:
- issue: Sentido de ሰማይ no contexto de uma ascensão apocalíptica
  choice: céu
  alternative: firmamento
  rationale: “Céu” preserva tanto a amplitude semântica do termo quanto o registro apocalíptico, sem impor uma cosmologia doutrinária mais específica.
- issue: Valor direcional de ውስተ diante de “lugar” e “montanha”
  choice: a
  alternative: para dentro de
  rationale: A preposição pode indicar movimento para ou para dentro de algo. Aqui, “a uma montanha” evita sugerir indevidamente a entrada no interior da montanha, embora a leitura mais estritamente ingressiva seja registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo simples do ge'ez, a imagética apocalíptica e a ambiguidade relevante da preposição por meio de nota.
