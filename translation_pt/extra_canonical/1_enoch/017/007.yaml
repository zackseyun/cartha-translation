base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/007.yaml
  text: And I saw the mountains of the darkness of winter and the place where all the waters of the deep flow[a][b].
translation:
  language: pt
  text: E vi as montanhas[b] da escuridão do inverno e o lugar onde fluem todas as águas do abismo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A transcrição etíope fornecida para este versículo termina depois de “E vi as montanhas”, aparentemente por truncamento. A continuação aqui traduzida segue a linha etíope mais completa de Charles: “as montanhas da escuridão do inverno...”.'
    reason: textual_variant
  - marker: b
    text: O fragmento grego de Panópolis (Akhmim) traz “os ventos” em vez de “as montanhas”.
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: A conjunção seguida do verbo na primeira pessoa introduz de modo simples o relato visionário de Enoque; “E vi” é natural e conserva a força narrativa.
- source_word: አድባረ
  choice: as montanhas
  rationale: O substantivo plural designa montanhas e preserva a paisagem apocalíptica concreta. A forma construta também combina com a continuação “da escuridão do inverno” atestada na linha mais completa citada na tradição editorial.
- source_word: ጽልመተ፡ ክረምት
  choice: da escuridão do inverno
  rationale: Tradução formal e inteligível da expressão etíope, sem tentar explicar ou suavizar sua imagem incomum.
- source_word: ወኀበ፡ ይውሕዝ፡ ኵሉ፡ ማያተ፡ ቀላይ
  choice: e o lugar de onde fluem todas as águas do abismo
  rationale: Reproduz a referência espacial e o movimento das águas; “abismo” comunica o reservatório profundo ou abissal sugerido por ቀላይ neste contexto cosmológico.
