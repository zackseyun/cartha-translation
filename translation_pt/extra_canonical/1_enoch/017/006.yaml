base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/006.yaml
  text: And I saw great rivers[a], and I reached as far as the great darkness[c][b], and I went to where no flesh walks.
translation:
  language: pt
  text: E vi grandes rios, e cheguei até a grande escuridão, e fui até onde nenhuma carne caminha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto etíope transcrito apresenta uma leitura incerta no verbo final, mas provavelmente se deve ler o prefixo negativo: “onde nenhuma carne caminha”. A testemunha grega também traz a negação. “Carne” pode designar a humanidade ou, mais amplamente, os seres vivos.'
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: Verbo comum de visão em narrativa; a forma simples preserva a sequência do relato visionário.
- source_word: ዐበይተ አፍላገ
  choice: grandes rios
  rationale: Mantém a imagem cosmogeográfica e a noção de magnitude.
- source_word: ወእስከ ዐቢይ ጽልመት በጻሕኩ
  choice: e cheguei até a grande escuridão
  rationale: Expressa chegada ao limite do percurso e conserva a linguagem apocalíptica sem interpretar a escuridão metaforicamente.
- source_word: ወሖርኩ ኀበ
  choice: e fui até onde
  rationale: Reproduz de modo natural a progressão repetitiva do itinerário.
- source_word: ኵሉ ሥጋ
  choice: nenhuma carne
  rationale: No contexto de uma oração negativa, a expressão semítica literalmente correspondente a 'toda carne não caminha' é vertida idiomaticamente como 'nenhuma carne caminha', sem restringir o referente à humanidade.
- source_word: ኢያንሶሱ (provável leitura subjacente ao OCR (አ)ያንሶሱ)
  choice: caminha
  rationale: A correção do prefixo negativo é apoiada pela testemunha grega, ὅπου πᾶσα σὰρξ οὐ περιπατεῖ; 'caminha' traduz o movimento sem introduzir a ideia incorreta de vaguear.
theological_decisions:
- issue: Amplitude de 'toda/nenhuma carne'
  choice: nenhuma carne
  alternative: nenhum ser vivo
  rationale: Conserva a expressão bíblico-semítica e sua ambiguidade entre seres humanos e criaturas vivas em sentido mais amplo.
- issue: Presença da negação no verbo final
  choice: onde nenhuma carne caminha
  alternative: onde toda carne vagueia
  rationale: A provável leitura etíope com prefixo negativo, confirmada pelo grego, exige a negação; a alternativa inverteria o sentido e eliminaria a ideia de uma região inacessível aos mortais.
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa simples. Preservou-se 'carne' por sua ressonância bíblica e amplitude semântica; a nota documenta tanto a incerteza textual quanto a alternativa lexical.
