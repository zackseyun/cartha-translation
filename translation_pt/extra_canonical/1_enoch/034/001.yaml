base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/034/001.yaml
  text: And from there I went toward the north[a], to the ends of the earth[c][b], and there I saw a great wonder.
translation:
  language: pt
  text: E dali fui em direção ao norte, até os confins da terra, e ali vi uma grande maravilha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: dali
  rationale: Expressa de modo natural e conciso o ponto de partida ligado ao local anterior da jornada visionária.
- source_word: ሖርኩ
  choice: fui
  rationale: Preserva o relato simples de deslocamento em primeira pessoa, sem acrescentar solenidade ausente do verbo.
- source_word: መንገለ መስዕ
  choice: em direção ao norte
  rationale: መንገለ marca direção, e መስዕ significa ‘norte’; esta leitura corrige a antiga inversão para ‘sul’.
- source_word: በአጽናፈ ምድር
  choice: até os confins da terra
  rationale: Mantém a imagem cosmogeográfica apocalíptica em português corrente e digno; ‘até’ se ajusta ao movimento narrado.
- source_word: ርኢኩ
  choice: vi
  rationale: Equivalente direto e natural do verbo comum de percepção empregado no relato visionário.
- source_word: መንክረ ዐቢየ
  choice: uma grande maravilha
  rationale: A leitura textual correta é መንክረ, ‘maravilha, prodígio’, seguida de ‘grande’; o texto transcrito ምሕረ resulta de erro de reconhecimento gráfico e não sustenta ‘lugar de descanso’.
theological_decisions:
- issue: Natureza daquilo que Enoque vê
  choice: uma grande maravilha
  alternative: um grande lugar de descanso
  rationale: A leitura corrigida do texto etíope designa uma maravilha, sem identificar sua natureza. A tradução conserva essa indeterminação e evita introduzir uma localização escatológica sem base lexical.
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa simples. ‘Confins da terra’ preserva o registro apocalíptico tradicional sem soar arcaico.
