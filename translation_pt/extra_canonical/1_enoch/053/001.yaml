base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/001.yaml
  text: There my eyes saw a valley whose mouths were open and deep; and all who dwell on the dry land and the sea and the islands will bring gifts and offerings and presents to it, yet that deep valley will not be filled.
translation:
  language: pt
  text: Ali meus olhos viram um vale cujas bocas eram abertas e profundas[a][c]; e todos os que habitam na terra seca, no mar e nas ilhas lhe trarão dádivas, ofertas e presentes[b]; contudo, aquele vale profundo não ficará cheio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez é difícil na expressão que descreve as “bocas” do vale. A tradução conserva a imagem de um vale com bocas abertas e profundas.
    reason: textual_variant
  - marker: b
    text: Os três substantivos traduzidos por “dádivas, ofertas e presentes” têm sentidos próximos neste contexto e podem designar tributos trazidos de todas as regiões do mundo.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “um vale profundo com bocas abertas”.'
    reason: previous_rendering
lexical_decisions:
- source_word: በህየ
  choice: Ali
  rationale: Mantém a força locativa que introduz a cena visionária, com naturalidade em português.
- source_word: ርእያ አዕይንትየ
  choice: meus olhos viram
  rationale: Preserva a formulação ocular enfática do ge'ez, em vez de reduzi-la simplesmente a “eu vi”.
- source_word: ቈላ
  choice: vale
  rationale: É a designação ampla e fiel para a formação topográfica visionária; “ravina” ou “desfiladeiro” seriam mais específicos.
- source_word: ርኁወ ወዕሙቀ አፈዊሁ
  choice: cujas bocas eram abertas e profundas
  rationale: Conserva a imagem concreta de “bocas” e a coordenação dos adjetivos “abertas e profundas”, sem redistribuí-los silenciosamente entre o vale e suas aberturas.
- source_word: የኃድሩ
  choice: habitam
  rationale: Verbo corrente de habitação, apropriado ao registro elevado sem soar arcaico.
- source_word: ዲበ የብስ ወባሕር ወደሰያት
  choice: na terra seca, no mar e nas ilhas
  rationale: Preserva a tríade geográfica abrangente e a oposição explícita entre terra seca e mar.
- source_word: አምኃ ወአስካዓ ወጋዳ
  choice: dádivas, ofertas e presentes
  rationale: Mantém a acumulação de três substantivos próximos em sentido, sem os fundir em uma única categoria.
- source_word: ይመጽኡ ሎቱ
  choice: lhe trarão
  rationale: Embora o verbo básico expresse movimento, a presença dos objetos enumerados favorece em português a noção contextual de trazê-los ao vale.
- source_word: ወዝኩስ ዕሙቅ ቈላ ኢይመልእ
  choice: contudo, aquele vale profundo não ficará cheio
  rationale: Reproduz o contraste e a imagem ominosa da incapacidade futura do vale de ficar cheio, sem acrescentar uma explicação alegórica.
theological_decisions:
- issue: Natureza daquilo que os habitantes levam ao vale
  choice: Bens concretos — dádivas, ofertas e presentes — são levados ao próprio vale.
  alternative: Os habitantes apenas se dirigem ao vale, ou os itens representam atos metafóricos de homenagem.
  rationale: A sequência ge'ez enumera três substantivos concretos antes do verbo de movimento. Preservar esses objetos como tributo material mantém a força da visão apocalíptica sem alegorizá-la.
- issue: Referente e sentido das “bocas” do vale
  choice: Manter a imagem de bocas abertas e profundas.
  alternative: Substituir a imagem por “aberturas” ou interpretar “profundo” apenas como atributo do vale.
  rationale: O texto coordena os adjetivos e emprega literalmente a linguagem de “bocas”; a tradução conserva essa tensão imagética e remete a dificuldade à nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe visionária e a repetição enfática foram preservadas; “bocas” mantém a metáfora do original, enquanto as notas reconhecem sua dificuldade.
