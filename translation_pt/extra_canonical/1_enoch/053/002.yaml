base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/002.yaml
  text: And their hands commit lawless deeds[a], and all who support their lawless deeds the sinners devour. And the sinners shall be destroyed from before the Lord of Spirits, and from the face of his earth they shall be uprooted[d][c][b], and they shall not remain forever and ever.
translation:
  language: pt
  text: E as mãos deles farão minhas correntes; e todos os que têm fome de minhas correntes — os pecadores — as comerão.[a] Os pecadores serão expulsos da presença do Senhor dos Espíritos e arrancados da face de sua terra;[b] e não permanecerão para todo o sempre.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O começo do versículo é difícil no ge'ez. Mais literalmente, fala de “minhas correntes”, das mãos deles, de pessoas que têm fome dessas correntes e de pecadores que as comem. Outra compreensão associa as palavras a atos de transgressão praticados ou apoiados; a tradução mantém a imagem concreta sem tentar explicá-la.
    reason: lexical_alternative
  - marker: b
    text: O verbo preservado na transcrição parece corrompido ou mal reconhecido. A provável leitura do manuscrito significa “ser arrancado” ou “ser desarraigado”; também se poderia traduzir o sentido geral como “ser removido” ou “ser banido”.
    reason: textual_variant
  - marker: c
    text: 'A partícula negativa está textualmente incerta. Com ela, a frase diz: “não permanecerão para todo o sempre”; sem ela ou com outra reconstrução, algumas versões exprimem o resultado como “perecerão para todo o sempre”.'
    reason: textual_variant
lexical_decisions:
- source_word: ጌጋየ / ለጌጋይ
  choice: minhas correntes / de minhas correntes
  rationale: O substantivo com sufixo de primeira pessoa aponta para correntes ou grilhões. A repetição explícita conserva a ligação entre as duas ocorrências e a imagem punitiva, embora a frase seja difícil.
- source_word: እደዊሆሙ ይገብሩ
  choice: as mãos deles farão
  rationale: Mantém o termo concreto “mãos” e o sentido básico do verbo “fazer”, sem acrescentar um objeto diferente do que aparece no texto.
- source_word: ዘይጻምዉ
  choice: os que têm fome de
  rationale: Preserva a metáfora forte de fome ou apetite, em vez de reduzi-la a simples desejo.
- source_word: ኃጥኣን ይበልዑ
  choice: os pecadores — as comerão
  rationale: Conserva tanto a designação moral quanto o verbo literal “comer”. Os travessões esclarecem a aposição possível sem eliminar a estranheza da construção.
- source_word: እምገጸ ለእግዚአ መነፈሳት
  choice: diante do Senhor dos Espíritos
  rationale: Expressa em português natural a fórmula de afastamento da presença divina, preservando o título característico de 1 Enoque.
- source_word: ይትሐጐሉ
  choice: serão destruídos
  rationale: No contexto de juízo, comunica desaparecimento ou eliminação forçada, sem definir a natureza metafísica do destino final.
- source_word: እምገጸ ምድረ ዚአሁ
  choice: da face da terra dele
  rationale: Retém a imagem espacial e o pronome possessivo do texto, apesar de a formulação ser mais marcada do que “da sua terra”.
- source_word: ይትቀወሙ (provável erro por ይትነቀሉ)
  choice: arrancados
  rationale: A leitura transmitida parece resultar de erro de transcrição/OCR; a provável forma subjacente significa “ser arrancado/desarraigado” e se ajusta à fórmula de remoção da terra.
- source_word: ወ[ኢ]ያነልቁ ለዓለመ ዓለም
  choice: e não permanecerão para todo o sempre
  rationale: Segue a leitura com a partícula negativa assinalada como incerta e evita transformar a cláusula em uma afirmação mais específica de aniquilação.
theological_decisions:
- issue: Sentido das correntes e da ação de comê-las
  choice: Manter literalmente as correntes, a fome e o ato de comer
  alternative: Entender o trecho como atos de injustiça cometidos e sustentados pelos pecadores
  rationale: O texto etíope é difícil, mas a imagem concreta possui apoio lexical e não deve ser substituída silenciosamente por uma interpretação moralizante.
- issue: Natureza do juízo final
  choice: Destruição, expulsão da presença divina e remoção permanente da terra, sem definir o mecanismo ou a condição ontológica final
  alternative: Declarar explicitamente aniquilação eterna ou apenas banimento contínuo
  rationale: As cláusulas exprimem juízo irreversível, mas a incerteza textual da conclusão não permite resolver toda a tensão entre destruição, exclusão e não permanência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preservaram-se o título “Senhor dos Espíritos”, a imagem apocalíptica incomum das correntes e a ambiguidade textual da cláusula final. A pontuação ajuda a tornar legível a sintaxe etíope comprimida sem normalizar seu conteúdo.
