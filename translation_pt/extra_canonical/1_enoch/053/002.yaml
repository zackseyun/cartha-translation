review_pass:
  verdict: revise
  source_fidelity: A abertura do rascunho segue uma análise lexical que não se sustenta bem no contexto nem na tradição textual de 1 Enoque 53:2. A sequência corresponde à fórmula em que as mãos praticam iniquidade e os pecadores devoram aqueles a quem oprimem injustamente; transformá-la em «minhas correntes» cria uma imagem que não é exigida pelo versículo e altera seus participantes e ações. As cláusulas de juízo, remoção da terra e não permanência podem ser mantidas, com a incerteza final assinalada.
  naturalness: O português do rascunho é em geral fluente, mas «as mãos deles farão minhas correntes» soa artificial e obscuro por refletir uma leitura lexical indevida. A revisão oferece sintaxe moderna e clara, sem reduzir o tom apocalíptico.
  terminology: «Senhor dos Espíritos» é o título estabelecido e deve ser preservado. «Iniquidade», «pecadores», «oprimem injustamente» e «arrancados» mantêm o registro de juízo sem impor uma formulação doutrinária sobre o destino final.
  issues:
  - severity: high
    issue: A primeira oração foi traduzida como se falasse de «minhas correntes».
    rationale: 'A leitura contextual e a tradição de tradução de 1 Enoque 53:2 indicam atos de iniquidade cometidos pelas mãos e a opressão praticada pelos pecadores. A versão com correntes não é uma ambiguidade segura a preservar: ela substitui o sentido da unidade e introduz uma imagem punitiva estranha ao versículo.'
  - severity: medium
    issue: A nota a defende uma leitura de correntes e uma alternativa de apoio a atos ilícitos.
    rationale: Como a leitura principal deve ser corrigida para atos de iniquidade e opressão, essa nota passa a desinformar e deve ser removida. As notas sobre a leitura provável de «arrancados» e sobre a negação final continuam pertinentes.
  revised_text: Suas mãos praticam atos de iniquidade, e os pecadores devoram todos os que oprimem injustamente. Os pecadores serão destruídos diante do Senhor dos Espíritos e arrancados da face da sua terra;[b] não permanecerão para todo o sempre.[c]
  revised_footnotes:
  - marker: b
    text: O verbo preservado na transcrição parece corrompido ou mal reconhecido. A provável leitura significa “ser arrancado” ou “ser desarraigado”; o sentido geral também pode ser expresso por “ser removido” ou “ser banido”.
    reason: textual_variant
  - marker: c
    text: 'A partícula negativa está textualmente incerta. Com ela, a frase diz: “não permanecerão para todo o sempre”; sem ela, ou sob outra reconstrução, algumas versões exprimem o resultado como “perecerão para todo o sempre”.'
    reason: textual_variant
  revision_rationale: A revisão restitui o sentido contextual da primeira metade do versículo — iniquidade praticada e opressão sofrida — em vez da leitura de «correntes», que decorre de uma análise insegura da transcrição. Mantêm-se a leitura provável «arrancados» na cláusula de remoção e a formulação não metafisicamente específica «não permanecerão», com nota para a incerteza da negação final.
