base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/003.yaml
  text: For I saw all the angels of punishment lodging there and preparing all the instruments of Satan[a][b][c].
translation:
  language: pt
  text: Pois vi todos os anjos do castigo permanecendo ali[b] e preparando todos os instrumentos de Satanás[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A transcrição ge'ez fornecida está incompleta depois de «e preparando». A continuação «todos os instrumentos de Satanás» segue a leitura ኵሎ ንዋየ ሰይጣን, atestada nas edições críticas.
    reason: textual_variant
  - marker: b
    text: Ou «ficando alojados ali». O verbo ge'ez indica ficar ou permanecer em determinado lugar, sem esclarecer se a permanência é temporária ou duradoura.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Mantém a função explicativa do conectivo em relação ao que precede, com fluência e dignidade em português.
- source_word: ርኢክዎሙ ለኵሎሙ
  choice: vi todos
  rationale: Expressa diretamente o relato visionário em primeira pessoa e conserva o alcance total indicado pelo quantificador.
- source_word: መላእክተ መቅሠፍት
  choice: os anjos do castigo
  rationale: Preserva a construção genitival e seu sentido judicial, sem especificar além do texto a maneira como esses anjos executam a punição.
- source_word: እንዘ የኃድሩ
  choice: permanecendo ali
  rationale: Comunica a ideia de ficar ou permanecer num lugar. É mais natural em português amplo do que «alojados», sem sugerir residência definitiva.
- source_word: ወያስተዴ[ልዉ]
  choice: e preparando
  rationale: A forma, embora truncada na transcrição fornecida, indica preparação ou disposição; «preparando» mantém a amplitude semântica.
- source_word: ኵሎ ንዋየ ሰይጣን
  choice: todos os instrumentos de Satanás
  rationale: Segue a continuação atestada nas edições críticas indicada pela revisão mais recente, incluindo o quantificador «todos» e vertendo ንዋይ por «instrumentos» no contexto de meios preparados para o castigo.
theological_decisions:
- issue: O objeto da preparação não aparece na linha ge'ez transcrita fornecida
  choice: Incluir «todos os instrumentos de Satanás» no texto principal, com nota textual
  alternative: Encerrar com «e preparando», sem objeto expresso
  rationale: A transcrição fornecida termina no verbo e parece estar incompleta; contudo, a revisão crítica informa a continuação ge'ez ኵሎ ንዋየ ሰይጣን. A leitura é adotada por oferecer o texto completo conhecido, mas a nota preserva transparência quanto ao estado da fonte apresentada.
- issue: Relação dos instrumentos com Satanás
  choice: de Satanás
  alternative: satânicos
  rationale: O genitivo mantém aberta a relação exata — posse, associação ou serviço — em vez de interpretá-la mediante um adjetivo.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e alcance internacional. «Pois» conserva a ligação argumentativa; «permanecendo ali» evita tanto o arcaísmo quanto uma interpretação excessivamente permanente; «instrumentos» mantém o caráter geral dos meios de punição.
