base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/004.yaml
  text: And the God of eternity[a], from there, will tread upon Mount Sinai; he will appear with his host[d][c][b], and he will appear in the strength of his might from heaven.
translation:
  language: pt
  text: E o Deus da eternidade[a] avançará dali sobre o monte Sinai[b]; aparecerá com o seu exército[c] e aparecerá, vindo do céu, na força do seu poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão também pode ser entendida como “Deus do mundo” ou “Deus da era”. Aqui, ዓለም é tomado em sentido temporal: “eternidade”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ser traduzido como “irá”, “marchará” ou “pisará”. “Avançará” conserva a ideia de movimento solene sem definir além do necessário a maneira desse movimento.
    reason: lexical_alternative
  - marker: c
    text: O termo etíope indica “acampamento, hoste, exército”; o grego correspondente também pode ter esses sentidos. A preposição permite entender “com o seu exército” ou “em meio ao seu acampamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምላከ ፡ ዓለም (ወ+አምላከ ዓለም)
  choice: E o Deus da eternidade
  rationale: Entende-se a forma inicial como a conjunção ወ, “e”, seguida de አምላክ, “Deus”. ዓለም pode indicar eternidade, era ou mundo; neste título, “Deus da eternidade” preserva a construção e não a substitui por um nome divino ausente do texto.
- source_word: እምህየ
  choice: dali
  rationale: Expressa procedência de um lugar anteriormente mencionado. “Dali” é natural em português e mantém a referência retrospectiva.
- source_word: ይከይድ
  choice: avançará
  rationale: O verbo descreve movimento intencional e pode ser vertido por “irá”, “marchará” ou “pisará”. “Avançará” conserva a solenidade e o movimento vigoroso sem impor a imagem mais específica de pisar.
- source_word: ዲበ ፡ ሲና ፡ ደብር
  choice: sobre o monte Sinai
  rationale: ዲበ indica posição ou movimento sobre uma superfície, e ሲና ደብር corresponde a “monte Sinai”. A ordem foi ajustada ao uso normal do português.
- source_word: ያስተርኢ
  choice: aparecerá
  rationale: A forma causativa pode significar “fazer-se ver”, “ser visto” ou “aparecer”. “Aparecerá” comunica com clareza a manifestação divina e permite preservar a repetição do original.
- source_word: በትዕይንቱ
  choice: com o seu exército
  rationale: A leitura lexical adotada entende ትዕይንት como “acampamento, hoste, exército”, em acordo com o paralelo grego παρεμβολή. “Exército” é atual e inteligível; a preposição በ admite aqui o sentido de acompanhamento.
- source_word: በኃይለ ፡ ጽንዑ
  choice: na força do seu poder
  rationale: A combinação intensiva reúne termos de força, poder e firmeza. A formulação portuguesa mantém a ênfase sem achatar os dois elementos em uma única palavra.
- source_word: እምሰማይ
  choice: vindo do céu
  rationale: 'A preposição እም indica origem: “do céu”. O particípio “vindo” torna explícita em português a relação com o segundo “aparecerá”, sem acrescentar um novo agente ou lugar.'
theological_decisions:
- issue: Título divino አምላክ ዓለም
  choice: Deus da eternidade
  alternative: Deus do mundo / Deus da era / Deus eterno
  rationale: “Deus da eternidade” preserva a forma nominal e a amplitude temporal provável, sem introduzir um nome de aliança nem eliminar as alternativas lexicais de ዓለም.
- issue: Imagem associada à aparição divina
  choice: com o seu exército
  alternative: em sua manifestação
  rationale: A leitura “exército/acampamento” se apoia na identificação lexical de ትዕይንት e no paralelo grego. Não se especifica “anjos” ou “exército celestial”, pois essas qualificações não aparecem expressamente nesta frase.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e compreensão internacional. Conservou-se a repetição de “aparecerá”, característica da estrutura etíope, e evitou-se o arcaísmo “hoste” no texto principal.
