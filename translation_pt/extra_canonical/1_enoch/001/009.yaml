base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/009.yaml
  text: And behold[a], he comes with myriads of holy ones, to execute judgment upon them, and to destroy the wicked[c][b], and to rebuke all flesh for everything that the sinful and wicked have done and spoken against him.
translation:
  language: pt
  text: E eis que ele vem com miríades de santos[a] para executar juízo sobre eles, destruir os ímpios[c] e repreender toda carne[b] por tudo o que os pecadores e os ímpios fizeram e disseram contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com dezenas de milhares de santos”. A expressão ge'ez indica uma hoste imensa e pode refletir uma fórmula numérica tradicional.
    reason: lexical_alternative
  - marker: b
    text: “Toda carne” é uma expressão tradicional que se refere a toda a humanidade; a tradução conserva a linguagem concreta do texto-fonte.
    reason: cultural_note
  - marker: c
    text: Este versículo encontra eco em Judas 14–15, mas aqui a redação foi traduzida do testemunho ge'ez, sem ser ajustada à formulação posterior do Novo Testamento.
    reason: cross_reference
lexical_decisions:
- source_word: ወናሁ
  choice: E eis que
  rationale: Preserva a força deíctica e visionária da fórmula apocalíptica em linguagem bíblica ainda compreensível no português atual.
- source_word: መጽአ
  choice: ele vem
  rationale: Mantém o presente vívido próprio do discurso profético, sem decidir entre valor passado ou futuro.
- source_word: በትእልፊተ ቅዱሳን
  choice: com miríades de santos
  rationale: Conserva tanto o sabor numérico-apocalíptico quanto a designação ampla do séquito santo, sem especificá-lo como anjos ou santos humanos.
- source_word: ይግበር ፍትሐ
  choice: executar juízo
  rationale: Expressa uma ação judicial efetiva, não apenas a ideia abstrata de justiça.
- source_word: ላዕሌሆሙ
  choice: sobre eles
  rationale: Reproduz a relação preposicional sem restringi-la indevidamente a hostilidade ou domínio.
- source_word: ይሕጕሎሙ ለረሲዓን
  choice: destruir os ímpios
  rationale: Preserva a força punitiva do verbo no cenário de juízo, mais intensa que simples censura ou condenação verbal.
- source_word: ይዘልፍ ኵሎ ዘሥጋ
  choice: repreender toda carne
  rationale: Mantém o idioma bíblico concreto “toda carne” e a ideia de censura pública em contexto forense.
- source_word: ኵሉ ዘገብሩ ወረሰዩ
  choice: tudo o que ... fizeram e disseram
  rationale: Representa os dois verbos e, seguindo a leitura textual adotada na revisão, distingue atos de palavras dirigidas contra o juiz.
- source_word: ኃጥኣን ወረሲዓን
  choice: os pecadores e os ímpios
  rationale: Retém os dois termos e a duplicação enfática da acusação moral.
- source_word: ላዕሌሁ
  choice: contra ele
  rationale: Conserva o pronome masculino singular e a noção de afronta pessoal sem inserir uma identificação ausente da forma textual fornecida.
theological_decisions:
- issue: Identidade daquele que vem
  choice: Manter apenas o pronome “ele”
  alternative: Explicitar “o Senhor” ou “Deus”
  rationale: O texto ge'ez fornecido traz sujeito implícito na terceira pessoa. O contexto pode indicar uma teofania, mas inserir um título resolveria uma identificação que o versículo não explicita.
- issue: Identidade dos santos
  choice: Traduzir ቅዱሳን como “santos”
  alternative: “anjos”, “seres santos” ou “santos humanos”
  rationale: No contexto apocalíptico, provavelmente se trata de um séquito celestial, mas o termo-fonte não define expressamente sua identidade; a tradução preserva essa amplitude.
- issue: Alcance de “toda carne”
  choice: Conservar o idioma concreto “toda carne”
  alternative: Interpretar como “toda a humanidade”
  rationale: A formulação tradicional comunica alcance humano universal sem eliminar a imagem corporal do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se deliberadamente o tom visionário de “eis que”, o idioma bíblico “toda carne” e as ambiguidades relativas à identidade daquele que vem e dos “santos”.
