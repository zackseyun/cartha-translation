base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/002.yaml
  text: 'And Enoch answered and said: "A righteous man[a], whose eyes were opened by God, saw a holy vision in the heavens, which the angels showed me; and from them I heard everything, and I understood what I saw—but not for this generation[d][c][b], but for a distant one that is to come."'
translation:
  language: pt
  text: 'E Enoque respondeu e disse: “Um homem justo, cujos olhos foram abertos por Deus,[a] viu uma visão santa nos céus,[b] que os anjos me mostraram; deles ouvi tudo e compreendi o que vi — não para esta geração, mas para uma geração distante que há de vir.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação do texto etíope é sintaticamente difícil, mas o sentido é que Deus abriu ou desvelou os olhos de Enoque para a visão.
    reason: textual_variant
  - marker: b
    text: “Céus”, no plural, reflete uma forma cosmológica comum em textos semíticos e apocalípticos.
    reason: cultural_note
  - marker: c
    text: 'Ou: “mas para uma geração longínqua que virá”. A expressão final indica uma geração futura vista como distante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ ወይቤ
  choice: respondeu e disse
  rationale: Preserva a fórmula narrativa semítica, ainda que não haja pergunta explícita no contexto imediato.
- source_word: ብእሲ ጻድቅ
  choice: um homem justo
  rationale: Mantém a caracterização moral e teológica do substantivo com o adjetivo, sem torná-la título definido.
- source_word: ዘእምኀበ እግዚአብሔር [እንዘ] አዕይንቲሁ ክሡታት
  choice: cujos olhos foram abertos por Deus
  rationale: Expressa a abertura divina da percepção visionária e acomoda de modo natural a construção subordinada do ge'ez.
- source_word: ራእየ ቅዱሰ
  choice: uma visão santa
  rationale: A sintaxe favorece que 'santa' qualifique a visão, sem introduzir a leitura mais específica 'visão do Santo'.
- source_word: ዘበሰማያት
  choice: nos céus
  rationale: Conserva o plural cosmológico característico da linguagem semítica e apocalíptica.
- source_word: ዘአርአዩኒ መላእክት
  choice: que os anjos me mostraram
  rationale: Mantém a mediação angélica e o contraste retórico entre a terceira pessoa inicial ('viu') e a primeira pessoa ('me').
- source_word: ወሰማዕኩ እምኀቤሆሙ ኵሎ
  choice: deles ouvi tudo
  rationale: Preserva tanto a totalidade de ኵሎ como a origem angélica do que foi ouvido.
- source_word: ወአእመርኩ አነ ዘእሬኢ
  choice: e compreendi o que vi
  rationale: Distingue entendimento de mera percepção visual, elemento importante da revelação apocalíptica.
- source_word: ወአኮ ለዛ ትውልድ አላ ለዘ ይመጽእ ርኁቃት
  choice: não para esta geração, mas para uma geração distante que há de vir
  rationale: Conserva o contraste temporal, a ideia de distância e a provável referência singular a uma geração futura.
theological_decisions:
- issue: Se ራእየ ቅዱሰ significa 'visão santa' ou 'visão do Santo'
  choice: uma visão santa
  alternative: uma visão do Santo
  rationale: A leitura adjetival é sintaticamente mais direta e evita acrescentar uma identificação teológica não exigida pelo texto.
- issue: Mudança da terceira para a primeira pessoa na fala
  choice: preservar 'um homem justo... viu' e depois 'me mostraram... ouvi... compreendi'
  alternative: 'uniformizar tudo na primeira pessoa: ''eu, um homem justo... vi'''
  rationale: O verbo de ver está na terceira pessoa no ge'ez, enquanto as formas seguintes passam à primeira; a tradução preserva essa tensão retórica em vez de corrigi-la silenciosamente.
- issue: Orientação futura da revelação
  choice: não para esta geração, mas para uma geração distante que há de vir
  alternative: não para esta geração, mas para gerações futuras
  rationale: Mantém a provável singularidade de 'geração' e a noção explícita de distância, sem generalizar o horizonte apocalíptico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se a fórmula semítica 'respondeu e disse', o plural 'céus' e a mudança incomum da terceira para a primeira pessoa. A pontuação esclarece a fala sem eliminar sua tensão sintática.
