base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/005.yaml
  text: And all will fear[a], and the vigilant ones will tremble[c][b]; and fear and great trembling will seize them as far as the ends of the earth.
translation:
  language: pt
  text: E todos ficarão com medo, e os vigilantes[a] tremerão; o medo e um grande tremor se apoderarão deles até os confins da terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os Vigilantes”. O termo significa pessoas ou seres despertos e vigilantes e, em 1 Enoque, pode designar a classe de seres angelicais conhecida como os Vigilantes.
    reason: lexical_and_referential_ambiguity
  - marker: b
    text: '“Até os confins da terra” expressa alcance universal: a terra inteira, até seus limites mais distantes.'
    reason: cultural_note
lexical_decisions:
- source_word: ይፈርሁ
  choice: ficarão com medo
  rationale: O imperfeito na cena teofânica admite valor futuro e resultativo; a expressão é natural em português e descreve o estado provocado pela manifestação.
- source_word: ኵሉ
  choice: todos
  rationale: Quantificador universal empregado substantivamente.
- source_word: ይደለቀለቁ
  choice: tremerão
  rationale: A forma reduplicada tem força intensiva; “tremerão” comunica de modo claro a reação física de abalo.
- source_word: ትጉሃን
  choice: os vigilantes
  rationale: O termo deriva da ideia de estar desperto ou vigilante e pode funcionar como designação dos seres conhecidos como Vigilantes; a minúscula preserva a tensão entre sentido descritivo e título técnico.
- source_word: ይነሥኦሙ
  choice: se apoderarão deles
  rationale: Expressão idiomática portuguesa para medo e tremor que tomam ou dominam pessoas, preservando o objeto plural.
- source_word: ፍርሃት
  choice: o medo
  rationale: Equivalente corrente do substantivo ge'ez para medo.
- source_word: ወረዓድ ዓቢይ
  choice: e um grande tremor
  rationale: Mantém a coordenação e a intensificação do segundo substantivo sem suavizar a repetição temática.
- source_word: እስከ አጽናፈ ምድር
  choice: até os confins da terra
  rationale: Reproduz a extensão até os limites mais distantes da terra em linguagem bíblica ainda compreensível hoje.
theological_decisions:
- issue: Sentido e referente de ትጉሃን
  choice: os vigilantes
  alternative: os Vigilantes; os poderosos
  rationale: A etimologia e o uso enoquiano favorecem “vigilantes”, possivelmente como título dos Vigilantes. A grafia em minúscula conserva a ambiguidade entre descrição e nome de uma classe angelical; “poderosos” não representa adequadamente o valor lexical.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Confins da terra” conserva o caráter apocalíptico sem soar arcaico demais; a construção evita definir além do texto a identidade dos vigilantes.
