base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/003.yaml
  text: 'Concerning the Chosen Ones I said, and I uttered a parable concerning them: The Holy and Great One will go forth from his dwelling.'
translation:
  language: pt
  text: 'A respeito dos escolhidos, eu disse e pronunciei uma parábola[a] sobre eles: O Santo e Grande sairá de sua morada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um dito figurado” ou “um oráculo”. O termo pode designar uma parábola, comparação, provérbio ou pronunciamento solene.'
    reason: Preserva a amplitude semântica de ምስለ e evita restringi-lo indevidamente a uma história alegórica.
lexical_decisions:
- source_word: ኅሩያን
  choice: os escolhidos
  rationale: Reproduz o sentido plural de pessoas escolhidas, sem acrescentar uma identificação teológica não expressa no verso.
- source_word: እቤ
  choice: eu disse
  rationale: Tradução direta do verbo na primeira pessoa, preservando sua distinção em relação ao verbo seguinte.
- source_word: ወአውሣእኩ ... ምስለ
  choice: e pronunciei uma parábola
  rationale: Expressa de modo natural o ato de proferir ou apresentar um mashal, mantendo a categoria literária tradicional sem tratá-la necessariamente como narrativa alegórica.
- source_word: ይወፅእ
  choice: sairá
  rationale: Preserva o movimento de sair ou vir para fora e o valor futuro da forma verbal.
- source_word: ቅዱስ ወዐቢይ
  choice: O Santo e Grande
  rationale: Mantém os dois qualificativos como designação substantivada de uma única figura, sem inserir um título divino ausente no texto.
- source_word: እማኅደሩ
  choice: de sua morada
  rationale: Equivalente claro e digno para o lugar onde essa figura habita.
theological_decisions:
- issue: Identidade do “Santo e Grande”
  choice: Manter a designação sem identificar explicitamente a figura
  alternative: Traduzir como “o Deus Santo e Grande” ou empregar um nome divino
  rationale: O verso apresenta qualificativos, mas não explicita aqui um nome nem a palavra “Deus”; a tradução evita resolver além do texto.
- issue: Referente dos escolhidos
  choice: Manter apenas “os escolhidos”
  alternative: Especificar “os justos”, “os santos” ou outro grupo
  rationale: A identificação mais precisa depende do contexto e não deve ser importada para este verso.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção “O Santo e Grande” conserva a forma titular concisa do ge’ez; “morada” mantém um registro digno sem soar arcaico.
