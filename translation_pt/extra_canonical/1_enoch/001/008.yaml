base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/008.yaml
  text: And he will make peace for the righteous[a], and he will guard the chosen ones; and favor will be upon them, and they will all be God's, and they will prosper and be blessed[c][b], and the light of God will shine upon them.
translation:
  language: pt
  text: E ele concederá paz aos justos[a] e guardará os escolhidos. O favor estará sobre eles; todos pertencerão a Deus, prosperarão[b] e serão abençoados, e a luz de Deus brilhará sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras iniciais do testemunho etíope estão textualmente truncadas ou desajeitadas, mas o sentido da frase se volta claramente para o favor de Deus aos justos.
    reason: textual_variant
  - marker: b
    text: O verbo também pode significar, de modo mais geral, “irão bem” ou “florescerão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰላመ፡ ይገብር
  choice: concederá paz
  rationale: Expressa naturalmente em português a ação de estabelecer ou dar paz aos justos. Evita a expressão “fará as pazes com”, que sugeriria reconciliação após hostilidade e não corresponde ao dativo ለጻድቃን.
- source_word: የዓቅቦሙ
  choice: guardará
  rationale: Preserva o sentido de proteção e conservação apropriado ao contexto de juízo e livramento.
- source_word: ሕሩያን
  choice: os escolhidos
  rationale: Mantém o peso do título enoquiano em linguagem transparente, sem a carga doutrinária posterior que “eleitos” pode assumir.
- source_word: ሣህል
  choice: favor
  rationale: Designa a benevolência que repousa sobre eles sem restringir o termo aos sentidos mais específicos de “graça”, “misericórdia” ou “compaixão”.
- source_word: ዘአምላክ
  choice: pertencerão a Deus
  rationale: Torna explícita, em português idiomático, a relação genitiva de posse ou pertencimento, sem acrescentar o substantivo “povo” nem reduzir a expressão a uma qualidade moral.
- source_word: ይሴርሑ
  choice: prosperarão
  rationale: Comunica a ideia provável de ir bem ou florescer; a nota preserva a amplitude e a incerteza lexical sem limitar a prosperidade à riqueza material.
- source_word: ይትባረኩ
  choice: serão abençoados
  rationale: Reproduz diretamente a forma passiva e conserva o tom formular de bênção.
- source_word: ይበርህ ሎሙ ብርሃነ አምላክ
  choice: a luz de Deus brilhará sobre eles
  rationale: Preserva a imagem apocalíptica da iluminação divina e a relação espacial indicada pelo texto.
theological_decisions:
- issue: Designações do grupo fiel
  choice: Manter “os justos” e “os escolhidos” como designações paralelas e distintas
  alternative: Fundir as duas expressões como sinônimos ou traduzir ሕሩያን por “os eleitos”
  rationale: O versículo emprega ambos os títulos em sequência. Preservá-los mantém a textura retórica e teológica do texto sem importar terminologia confessional posterior.
- issue: Sentido de ዘአምላክ
  choice: “todos pertencerão a Deus”
  alternative: “todos serão piedosos” ou “todos serão o povo de Deus”
  rationale: A construção expressa mais naturalmente posse ou pertencimento. As alternativas acrescentariam, respectivamente, uma qualidade moral ou um substantivo não expresso.
- issue: Relação entre Deus e os justos na concessão da paz
  choice: “concederá paz aos justos”
  alternative: “fará as pazes com os justos”
  rationale: A preposição ለ indica que a paz é estabelecida para ou dada aos justos; não sugere que Deus esteja encerrando uma hostilidade com eles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide a longa cadeia de orações sem apagar seu paralelismo. “Concederá paz” evita uma ambiguidade indesejada de “fará as pazes”, e “pertencerão a Deus” comunica a relação de posse com naturalidade.
