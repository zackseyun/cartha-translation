base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/007.yaml
  text: And the earth shall be rent asunder[a], and everything that is in the earth shall be destroyed[c][b], and judgment shall come upon all.
translation:
  language: pt
  text: E a terra será fendida[a], e tudo o que há dentro da terra[b] será destruído, e o juízo[c] virá sobre todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será partida” ou “será rasgada”. Algumas traduções anteriores trazem “será abalada”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tudo o que está na terra”; também pode ser entendido como “tudo o que há sobre a terra”.
    reason: lexical_alternative
  - marker: c
    text: O termo também pode significar “justiça” ou “retidão”; neste contexto, parece indicar um ato de juízo que sobrevém a todos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትሠጠጥ
  choice: será fendida
  rationale: A forma passiva descreve a terra sendo rasgada ou partida. “Será fendida” preserva a imagem apocalíptica específica sem reduzi-la a mero tremor.
- source_word: ምድር
  choice: a terra
  rationale: O contexto de juízo universal favorece “terra”, e não o sentido mais local de “país” ou “região”.
- source_word: ኵሉ ዘውስተ ምድር
  choice: tudo o que há dentro da terra
  rationale: A expressão diz literalmente “tudo o que está na/dentro da terra”. A formulação mantém essa imagem incomum, mas compreensível, sem corrigi-la silenciosamente para “sobre a terra”.
- source_word: ይትሐጐል
  choice: será destruído
  rationale: O verbo comunica ruína ou perecimento; “será destruído” é claro e adequado à sequência de juízo.
- source_word: ፍትሕ
  choice: o juízo
  rationale: Embora também possa significar “justiça” ou “retidão”, a construção “virá sobre todos” favorece aqui um ato judicial vindouro.
- source_word: ላዕለ ኵሉ
  choice: sobre todos
  rationale: Mantém o valor natural da preposição e a abrangência universal da declaração.
theological_decisions:
- issue: Se ፍትሕ designa uma qualidade moral ou um ato escatológico.
  choice: juízo
  alternative: justiça ou retidão
  rationale: A oração “virá sobre todos” sugere um acontecimento de prestação de contas. A nota preserva, porém, a amplitude semântica do termo.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível. “Será fendida” conserva a imagem concreta do texto-fonte; as notas registram as alternativas lexicais reais sem resolver indevidamente a ambiguidade.
