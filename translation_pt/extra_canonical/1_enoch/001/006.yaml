  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo poético foi preservado, assim como o movimento entre tremor, rebaixamento e derretimento. O pronome “elas” retoma gramaticalmente “as altas colinas”, embora a imagem possa abranger o relevo mencionado em conjunto.
