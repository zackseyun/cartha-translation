base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/006.yaml
  text: And the lofty mountains will quake, and the high hills will be brought low; they will melt like wax before the blaze.
translation:
  language: pt
  text: E os montes elevados tremerão[a], e as altas colinas serão rebaixadas[b]; uns e outras se derreterão como cera diante da chama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: serão sacudidos; estremecerão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: serão abaixadas; serão humilhadas.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: como cera na presença do fogo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይደነግፁ (yǝdänägǝṣu)
  choice: tremerão
  rationale: Mantém o sentido intransitivo do verbo e a força da imagem apocalíptica, sem introduzir um agente.
- source_word: አድባር (ʾadbar)
  choice: montes
  rationale: Representa naturalmente as elevações montanhosas e forma um paralelismo claro com “colinas”.
- source_word: ነዋኀን / ነዋኃት (newaḥn / newaḥat)
  choice: elevados / altas
  rationale: Preserva a noção concreta de altura nos dois membros, com variação idiomática em português.
- source_word: ይቴሐቱ (yǝtēḥatu)
  choice: serão rebaixadas
  rationale: Conserva o valor passivo e a inversão de altura expressa pelo verbo, sem optar pela interpretação mais figurada “humilhadas”.
- source_word: አውግር (ʾawgr)
  choice: colinas
  rationale: Equivalente topográfico corrente que sustenta o paralelismo com “montes”.
- source_word: ይትመሰዉ (yǝtmäsäw)
  choice: se derreterão
  rationale: Expressa diretamente a transformação física evocada pela comparação com a cera.
- source_word: መዓረ (mäʿärä)
  choice: cera
  rationale: Equivalente exato e suficiente, sem especificar desnecessariamente “cera de abelha”.
- source_word: ግራ (gǝra)
  choice: diante de
  rationale: Reproduz naturalmente o sentido espacial ou presencial de “perante/na presença de”.
- source_word: እም ላህብ (ʾǝm lāhb)
  choice: da chama
  rationale: “Chama” corresponde de perto ao substantivo e preserva a imagem concreta que faz derreter a cera.
theological_decisions: []
