  naturalness: «A palavra da bênção de Henoc, com a qual ele abençoou...» é português moderno, claro e suficientemente solene para um cabeçalho antigo. A repetição de artigo em «os perversos e os ímpios» é fluente e torna mais nítida a coordenação das duas designações.
  terminology: «Henoc» é uma forma portuguesa tradicional utilizável para o nome ge'ez Henok; a nota deve descrevê-la como forma portuguesa correspondente, não como representação direta da forma ge'ez. «Justos», «escolhidos», «aflição», «perversos» e «ímpios» são escolhas adequadas e não impõem interpretação doutrinária.
