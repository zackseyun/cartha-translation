base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/001.yaml
  text: The words of the blessing of Henok[a], with which he blessed the chosen and the righteous who will be present on the day of affliction[c][b], for the removal of all the wicked and godless.
translation:
  language: pt
  text: A palavra da bênção de Henoc[a], com a qual ele abençoou os escolhidos e os justos que estarão presentes no dia da aflição[b], para a remoção de todos os perversos e os ímpios[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Henoc” é a forma portuguesa tradicional correspondente ao nome ge'ez Henok; em algumas tradições e edições, aparece como “Enoque” ou “Enoch”.
    reason: lexical_alternative
  - marker: b
    text: “Dia da aflição” também pode ser entendido como “dia da angústia” ou “dia da tribulação”.
    reason: lexical_alternative
  - marker: c
    text: O texto emprega dois termos coordenados, aqui traduzidos como “perversos” e “ímpios”, preservando a distinção entre as duas designações.
    reason: cultural_note
lexical_decisions:
- source_word: ቃለ ፡ በረከት
  choice: Palavras da bênção
  rationale: Embora ቃለ esteja no singular e possa ser vertido como “palavra”, a expressão funciona como título ou fórmula introdutória; “Palavras da bênção” soa natural em português e comunica o conteúdo pronunciado sem expandi-lo para “mensagem”.
- source_word: ዘሄኖክ
  choice: de Henoc
  rationale: “Henoc” preserva de modo reconhecível a forma do nome no ge'ez e corresponde ao uso português tradicional, evitando a forma inglesa “Enoch”.
- source_word: በከመ ፡ ባረከ
  choice: com as quais ele abençoou
  rationale: A construção retoma as palavras da bênção como conteúdo ou meio pelo qual Henoc abençoou; o plural concorda naturalmente com a formulação portuguesa.
- source_word: ኅሩያነ
  choice: os escolhidos
  rationale: Expressa os que foram escolhidos sem recorrer a “eleitos”, termo que pode trazer associações doutrinárias posteriores.
- source_word: ወጻድቃነ
  choice: e os justos
  rationale: “Justos” é a designação moral e religiosa corrente em português e mantém o termo coordenado, sem fundi-lo com “escolhidos”.
- source_word: እለ ፡ ሀለዉ ፡ ይኩኑ
  choice: que estarão presentes
  rationale: A expressão aponta para pessoas que estarão naquele tempo ou ocasião futura; “estarão presentes” preserva melhor o sentido situacional do que simplesmente “existirão”.
- source_word: በዕለተ ፡ ምንዳቤ
  choice: no dia da aflição
  rationale: O sintagma designa um dia de sofrimento ou angústia. “Aflição” conserva a gravidade apocalíptica sem transformar o termo em um rótulo escatológico técnico.
- source_word: ለአሰስሎ
  choice: para a remoção de
  rationale: Mantém a construção de finalidade e o estilo solene do cabeçalho, sem especificar além do texto se a ação consiste em expulsão, eliminação ou retirada.
- source_word: ኵሎ ፡ እኩያነ
  choice: todos os perversos
  rationale: Traduz o plural coletivo com força totalizante. “Perversos” distingue com clareza a categoria moral da categoria religiosa seguinte.
- source_word: ወረሲዓነ
  choice: e ímpios
  rationale: “Ímpios” preserva a dimensão de irreverência ou falta de devoção e mantém distinta essa classe dos “perversos”.
theological_decisions:
- issue: Identidade do grupo abençoado por Henoc
  choice: os escolhidos e os justos
  alternative: os justos escolhidos
  rationale: O ge'ez coordena os dois termos. Mantê-los distintos preserva a possível referência a duas classes ou a duas descrições coordenadas, sem impor uma identificação completa.
- issue: Sentido escatológico de በዕለተ ምንዳቤ
  choice: no dia da aflição
  alternative: no dia da tribulação; no dia do juízo
  rationale: O substantivo indica aflição, angústia ou sofrimento. O contexto pode envolver juízo, mas traduzi-lo diretamente como “juízo” resolveria uma implicação que o léxico não explicita.
- issue: Destino dos perversos e ímpios
  choice: para a remoção de
  alternative: para eliminar; para expulsar
  rationale: “Remoção” mantém aberta a natureza precisa do ato de julgamento e não determina se se trata de expulsão, destruição ou outra forma de retirada.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção mantém o caráter de superscrição e conserva as ambiguidades lexicais e teológicas relevantes.
