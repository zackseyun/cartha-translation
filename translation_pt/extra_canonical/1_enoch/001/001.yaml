    rationale: «Henoc» não é uma transliteração estrita da forma ge'ez ሄኖክ (Henok), mas uma forma portuguesa tradicional correspondente. A nota atual afirma uma relação mais direta do que os dados permitem.
  - severity: low
    issue: Posição da chamada c
    rationale: A chamada explicativa dos dois termos finais deve ficar ligada a «ímpios», antes do ponto final, em vez de parecer uma nota da frase inteira.
