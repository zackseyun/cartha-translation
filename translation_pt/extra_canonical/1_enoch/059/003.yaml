base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/003.yaml
  text: And after this all the hidden things of the lights and of the lightnings were shown to me[c][b][a]; they flash for blessing and for abundance.
translation:
  language: pt
  text: Depois disso, foram-me mostradas todas as coisas ocultas[a] das luzes[b] e dos relâmpagos; fulguram para bênção e abundância.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os seus segredos”. A expressão ge’ez significa literalmente “todas as suas coisas ocultas” e pode indicar os mecanismos escondidos desses fenômenos celestes.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto visionário, “luzes” pode designar mais especificamente os luminares celestes.
    reason: cultural_note
  - marker: c
    text: O sujeito de “fulguram” não é expresso novamente no ge’ez. Pode retomar coletivamente as luzes e os relâmpagos.
    reason: source_ambiguity
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: Depois disso
  rationale: Preserva a fórmula temporal e a sequência visionária em português atual e digno.
- source_word: ትርእየ ሊተ
  choice: foram-me mostradas
  rationale: Segue a leitura contextual de ተርእየ como forma passiva/reflexiva, provavelmente deturpada na transcrição como ትርእየ, com ሊተ indicando o destinatário da revelação.
- source_word: ኵሉ ኅቡኣቲሆሙ
  choice: todas as coisas ocultas
  rationale: Reproduz o sentido concreto de coisas escondidas sem converter necessariamente a expressão no termo técnico apocalíptico 'segredos'.
- source_word: ለብርሃናት
  choice: das luzes
  rationale: Mantém o termo amplo do ge'ez; o contexto cósmico permite entendê-lo como astros ou luminares, sem impor essa especificação no texto.
- source_word: ወለመባርቅት
  choice: e dos relâmpagos
  rationale: Conserva o plural e a imagem cósmica vívida.
- source_word: ወለበረከት ወለጽጋብ
  choice: para bênção e abundância
  rationale: Interpreta a preposição como finalidade ligada ao verbo seguinte, em paralelo com o contexto do capítulo, e evita a noção moderna e econômica de 'prosperidade'.
- source_word: ይበርቁ
  choice: fulguram
  rationale: Expressa o brilho súbito e intenso do verbo, em registro elevado mas compreensível.
theological_decisions:
- issue: Se as realidades reveladas devem ser chamadas tecnicamente de 'segredos' cósmicos
  choice: coisas ocultas
  alternative: segredos
  rationale: A formulação mais concreta preserva a amplitude do ge'ez e evita impor uma categoria técnica apocalíptica, embora essa leitura permaneça possível.
- issue: Relação de 'bênção e abundância' com o restante da frase
  choice: 'finalidade do fulgurar: ''para bênção e abundância'''
  alternative: 'itens coordenados: ''coisas ocultas [...] da bênção e da abundância'''
  rationale: A função final da preposição oferece a análise gramatical mais coerente e corresponde ao paralelismo contextual, sem transformar bênção e abundância em novos objetos cujos segredos são revelados.
- issue: Referente do sujeito implícito de 'fulguram'
  choice: retomada coletiva das luzes e dos relâmpagos por 'estes'
  alternative: retomada das coisas ocultas ou sujeito não especificado
  rationale: A retomada coletiva se ajusta ao plural verbal e à imagem de fenômenos luminosos, mas a nota preserva a falta de sujeito nominal explícito no ge'ez.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém solenidade moderada; 'fulguram' conserva a força da imagem apocalíptica sem recorrer a sintaxe arcaica. A colocação 'foram-me mostradas' é formal, mas corrente no registro bíblico digno.
