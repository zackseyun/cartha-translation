  naturalness: O português do rascunho é claro e de registro apropriado. “Eles fulguram” conserva a vivacidade do verbo e abrange tanto relâmpagos quanto luzes; “conforme o Senhor dos Espíritos quis” expressa diretamente o perfeito verbal da fonte.
