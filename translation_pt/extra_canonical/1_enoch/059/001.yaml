base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/001.yaml
  text: In those days my eyes saw the secrets of the lightnings and the lights[a], and their courses, and they flash forth for blessing and for curse[d][c][b], as the Lord of Spirits has willed.
translation:
  language: pt
  text: Naqueles dias, meus olhos viram os segredos dos relâmpagos e das luzes, e seus percursos[a]; eles fulguram para bênção e para maldição, conforme o Senhor dos Espíritos quis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua ordem” ou “sua disposição”. O sentido exato do termo ge'ez é incerto, mas parece indicar o arranjo ou movimento regular desses fenômenos celestes.
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica recorrente e seu registro elevado.
- source_word: ርእያ፡ አዕይንትየ
  choice: meus olhos viram
  rationale: Mantém a menção explícita aos olhos e a vivacidade da fórmula visionária.
- source_word: ኅቡኣተ
  choice: segredos
  rationale: O plural construto designa segredos ou coisas ocultas; evita confundi-lo com o termo etíope específico para depósitos ou tesouros celestes.
- source_word: መባርቅት፡ ወብርሃናት
  choice: dos relâmpagos e das luzes
  rationale: Conserva os plurais e não restringe as luzes a astros específicos.
- source_word: ወኵነኔሆሙ (leitura impressa indicada nas revisões; a transcrição fornecida traz ወአክኒሆሙ)
  choice: e os juízos que eles executam
  rationale: A leitura impressa relatada deriva da raiz 'julgar' e corresponde ao sentido de juízos realizados pelos fenômenos; a nota preserva a incerteza criada pela transcrição divergente.
- source_word: ወይበርቁ
  choice: eles relampejam
  rationale: Verbo vívido e natural em português, apropriado aos relâmpagos e às manifestações luminosas do contexto.
- source_word: ለበረከት፡ ወለመረገም
  choice: para bênção e para maldição
  rationale: Mantém a forte polaridade entre favor e juízo sem explicar além do texto.
- source_word: በከመ፡ ፈቀደ፡ እግዚአ፡ መናፍስት
  choice: conforme a vontade do Senhor dos Espíritos
  rationale: Expressa de modo idiomático que a ação se dá segundo a vontade divina e preserva o título enóquico tradicional.
theological_decisions:
- issue: A relação entre os fenômenos cósmicos, a bênção, a maldição e a vontade divina
  choice: Os fenômenos atuam para bênção e para maldição conforme a vontade do Senhor dos Espíritos.
  alternative: Entender bênção e maldição apenas como efeitos naturais desprovidos de comissão divina explícita.
  rationale: A oração final liga diretamente sua manifestação à vontade do Senhor dos Espíritos; a tradução conserva essa agência sem desenvolver uma doutrina além do enunciado.
- issue: Sentido do elemento textual após 'luzes'
  choice: juízos que eles executam
  alternative: seus percursos, sua ordem ou sua disposição
  rationale: As revisões fornecidas registram que o texto impresso de Charles e Dillmann tem uma forma derivada de 'julgar', embora a transcrição eletrônica apresentada seja divergente. A escolha segue o testemunho impresso relatado, e a alternativa é documentada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe mantém a cadência visionária sem reproduzir mecanicamente todas as conjunções do ge'ez. O título “Senhor dos Espíritos” foi preservado de modo consistente.
