base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/002.yaml
  text: And there I saw the hidden chambers of the thunder[a], and how, when it crashes in the height of heaven, its sound is heard; and he showed me the dwellings of the dry land, and the sound of the thunder, whether for peace and blessing or for a curse[c][b], according to the word of the Lord of Spirits.
translation:
  language: pt
  text: E ali vi as câmaras ocultas do trovão e como, quando ele estronda nas alturas do céu, seu som é ouvido; e ele me mostrou as moradas da terra seca[a] e o som do trovão[b], quer para a paz e a bênção, quer para a maldição, segundo a palavra do Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “moradas da terra seca” é textual e lexicalmente difícil; também pode indicar, de modo mais geral, os lugares habitados da terra.
    reason: lexical_alternative
  - marker: b
    text: No testemunho, a expressão “e o som do trovão” aparece entre colchetes. A repetição pode ser original ou uma ampliação de copista; ela foi mantida no texto.
    reason: textual_variant
lexical_decisions:
- source_word: ኅቡኣተ ነጐድጓድ
  choice: câmaras ocultas do trovão
  rationale: O plural ኅቡኣተ designa coisas ou lugares escondidos. Neste cenário cosmológico, a formulação locativa “câmaras ocultas” expressa melhor os reservatórios secretos do trovão do que o abstrato “segredos”.
- source_word: ነጐድጓድ
  choice: trovão
  rationale: O termo denota normalmente o trovão; o contexto destaca seu som e sua função, não uma tempestade inteira.
- source_word: ይደቅቅ
  choice: estronda
  rationale: O verbo traz a ideia de golpear, quebrar ou esmagar. Aplicado ao trovão, “estronda” comunica sua força e seu efeito sonoro sem tornar a frase artificial.
- source_word: መልዕልተ ሰማይ
  choice: nas alturas do céu
  rationale: A expressão indica a altura ou região superior do céu. A tradução mantém a imagem cosmológica vertical sem acrescentar uma ideia de origem ausente do texto.
- source_word: ተመመንደርት የብስ
  choice: as moradas da terra seca
  rationale: A expressão, lexicalmente difícil, parece indicar moradas ou lugares habitados associados à terra firme. A tradução conserva a imagem concreta e deixa a alternativa mais geral para a nota.
- source_word: አስተአርአየኒ
  choice: ele me mostrou
  rationale: A forma causativa significa diretamente “mostrou-me”; o agente pessoal é mantido conforme o estilo do relato visionário.
- source_word: ለሰላም ወለበረከት ወእመ ለረገም
  choice: quer para a paz e a bênção, quer para a maldição
  rationale: A construção preserva tanto o par benéfico “paz e bênção” quanto seu contraste com “maldição”, sem decidir se são efeitos ou significados distintos do trovão.
- source_word: በቃለ እግዚአ መናፍስት
  choice: segundo a palavra do Senhor dos Espíritos
  rationale: “Segundo a palavra” conserva a referência à fala ou ao decreto divino sem reduzi-la ao sentido mais específico de “ordem”. O título é vertido de modo consistente como “Senhor dos Espíritos”.
theological_decisions:
- issue: Função benéfica ou punitiva do trovão
  choice: O som do trovão é relacionado à paz, à bênção ou à maldição sob a palavra divina.
  alternative: O trovão apenas acompanha anúncios desses resultados, ou sons distintos do trovão sinalizam resultados distintos.
  rationale: A sintaxe associa o som do trovão aos resultados determinados pela palavra do Senhor dos Espíritos, mas não especifica exatamente a natureza dessa relação. A tradução mantém essa tensão.
- issue: Título እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  alternative: Senhor de Espíritos
  rationale: “Senhor dos Espíritos” é uma forma clara e estável para o título recorrente em 1 Enoque, sem impor uma identificação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe visionária preservada. Empregaram-se “estronda” e “nas alturas do céu” para manter a força poética e cosmológica sem arcaísmo excessivo; a formulação deliberadamente incomum “moradas da terra seca” conserva a dificuldade do original e é esclarecida em nota.
