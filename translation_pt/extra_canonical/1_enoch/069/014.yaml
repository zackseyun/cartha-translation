base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/014.yaml
  text: This one asked Mikael to show him the hidden name[a], so that they might remember it in the oath, and so that they might tremble before that name and oath[d][c][b], those who revealed to the children of men all that is hidden.
translation:
  language: pt
  text: Este pediu a Mikael que lhe mostrasse o nome oculto[a], para que o mencionassem no juramento[b] e tremessem diante daquele nome e juramento — aqueles que revelaram aos filhos dos homens tudo o que está oculto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o nome escondido” ou “o nome secreto”. O termo significa oculto ou encoberto e não exige um sentido místico técnico posterior.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode sugerir que o nome era invocado numa adjuração solene, e não apenas lembrado ou mencionado.
    reason: lexical_alternative
  - marker: c
    text: 'A oração final provavelmente identifica os que deveriam tremer: aqueles que revelaram coisas ocultas à humanidade. A sintaxe, porém, é condensada, e o plural pode ter alcance mais geral.'
    reason: alternative_reading
lexical_decisions:
- source_word: ዝንቱ
  choice: Este
  rationale: Preserva a força demonstrativa da abertura e remete à figura mencionada anteriormente, sem substituí-la por um simples pronome.
- source_word: ይቤሎ፡ ለሚካኤል፡ ያርእዮ
  choice: pediu a Mikael que lhe mostrasse
  rationale: A construção combina o verbo de fala com uma forma jussiva/subjuntiva de terceira pessoa e sufixo de objeto. A formulação portuguesa expressa naturalmente o pedido ou comando indireto, sem convertê-lo em imperativo direto. “Lhe” conserva a referência pronominal sem identificar além do que o texto permite.
- source_word: ስመ፡ ኅቡአ
  choice: o nome oculto
  rationale: “Oculto” comunica o sentido de escondido ou encoberto sem impor ao termo um sentido técnico esotérico posterior.
- source_word: ከመ፡ ይዝክርዎ፡ በመሐላ
  choice: para que o mencionassem no juramento
  rationale: O verbo pertence ao campo de lembrar e mencionar. No contexto de um nome usado em juramento, “mencionassem” é idiomático e mantém aberta a possível ideia de invocação solene.
- source_word: መሐላ
  choice: juramento
  rationale: É o sentido primário no contexto; a força temível associada ao juramento não exige traduzi-lo como “maldição”.
- source_word: ከመ፡ ይርዓዱ፡ እምውእቱ፡ ስም፡ ወማሐላ
  choice: e tremessem diante daquele nome e juramento
  rationale: “Tremessem” conserva a reação física e temerosa do verbo, enquanto “diante de” expressa de modo natural a relação com o nome e o juramento.
- source_word: እለ፡ አርአዩ፡ ለውሉደ፡ ሰብእ፡ ኵሎ፡ ዘበኅቡእ
  choice: aqueles que revelaram aos filhos dos homens tudo o que está oculto
  rationale: A oração relativa identifica, na leitura sintática mais provável, os transgressores que divulgaram conhecimentos ocultos à humanidade. “Filhos dos homens” preserva o idioma antropológico tradicional do texto.
theological_decisions:
- issue: Identidade do sujeito plural de “mencionassem” e “tremessem”
  choice: A oração final identifica o sujeito como aqueles que revelaram coisas ocultas aos filhos dos homens.
  alternative: O plural pode referir-se mais amplamente aos que ouvem ou empregam o juramento; a sintaxe condensada também pode permitir mudança de sujeito.
  rationale: A proximidade da oração relativa e o contexto dos seres celestes que divulgaram conhecimentos proibidos favorecem a primeira leitura. O travessão explicita essa ligação sem eliminar a alternativa, que é registrada em nota.
- issue: Natureza da fala dirigida a Mikael
  choice: 'pedido ou determinação indireta: “pediu a Mikael que lhe mostrasse”'
  alternative: “disse a Mikael que lhe mostrasse” ou uma fala direta equivalente a “Mostra-lhe”.
  rationale: A forma verbal de terceira pessoa favorece uma construção indireta, não um imperativo direto. “Pediu” oferece português natural, embora o verbo de fala possa também introduzir uma ordem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se “Mikael” como transliteração da forma ge’ez e “filhos dos homens” como expressão tradicional. O travessão ajuda a tornar legível a oração relativa final sem apagar a ambiguidade sintática, documentada em nota.
