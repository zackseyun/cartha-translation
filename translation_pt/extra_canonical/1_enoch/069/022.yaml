base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/022.yaml
  text: And likewise heaven[a], the spirits of the winds, and all the spirits[d][c][b], and their paths from all the gatherings of spirits.
translation:
  language: pt
  text: 'E igualmente: o céu, os espíritos dos ventos[a], todos os espíritos e seus caminhos[b], de todos os agrupamentos de espíritos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida mais literalmente como «os ventos dos ventos». O termo aqui empregado pode significar vento, sopro ou espírito, e a construção ge'ez é incomum.
    reason: lexical_alternative
  - marker: b
    text: Ou «seus cursos», «seus trajetos» ou «seus movimentos».
    reason: lexical_alternative
  - marker: c
    text: Ou «de todas as companhias» ou «de todas as assembleias de espíritos». O versículo tem a forma de uma lista sem verbo expresso, e sua relação sintática final permanece difícil.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ሰማይ
  choice: o céu
  rationale: O singular designa naturalmente o âmbito celeste ou cósmico. «Céu» preserva o registro visionário e, neste contexto, é preferível a «firmamento» ou «céus».
- source_word: ነፋሳቲሆሙ ለነፋሳት
  choice: os espíritos dos ventos
  rationale: A construção é entendida como genitivo antecipatório, e não como afirmação de que o céu «recebeu» algo. O primeiro termo admite o sentido de sopro, vento ou espírito; «espíritos dos ventos» conserva essa distinção possível e segue a leitura revisada, enquanto a nota registra a alternativa mais literal «ventos dos ventos».
- source_word: መንፈሳት
  choice: espíritos
  rationale: O termo repetido favorece «espíritos» no registro cosmológico e apocalíptico. «Almas» imporia uma distinção antropológica que o texto não exige.
- source_word: ወፍናዋቲሆሙ
  choice: e seus caminhos
  rationale: A forma obscura parece indicar caminhos, cursos, movimentos ou trajetos. «Caminhos» mantém a imagem sem transformá-la em terminologia cosmológica excessivamente técnica.
- source_word: እምኵሉ ኅብራት
  choice: de todos os agrupamentos
  rationale: A expressão aponta para conjuntos, companhias ou assembleias. «Agrupamentos» é amplo e não decide se o autor tem em vista classes, hostes ou reuniões de espíritos.
theological_decisions:
- issue: Distinguir «espíritos» de «almas» em um contexto apocalíptico
  choice: Traduzir መንፈሳት por «espíritos»
  alternative: Traduzir por «almas» ou alternar entre «almas» e «espíritos»
  rationale: A linguagem do versículo é cósmica e não estabelece uma antropologia técnica. «Espíritos» preserva a tensão e evita introduzir um esquema posterior de corpo e alma.
- issue: Tratar o versículo como oração verbal ou como lista cósmica
  choice: Preservar a estrutura nominal, sem acrescentar um verbo como «recebeu»
  alternative: Suprir «o céu recebeu» para formar uma oração completa
  rationale: O texto ge'ez não contém um verbo de recepção; sua forma é uma enumeração elíptica. Acrescentá-lo alteraria o sentido e converteria a lista em uma afirmação teológica não explicitada pela fonte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência de enumeração apocalíptica. A formulação preserva deliberadamente a estrutura nominal e algo fragmentária do ge'ez, sem inventar o verbo «receber». As notas tornam transparentes as principais ambiguidades lexicais e sintáticas.
