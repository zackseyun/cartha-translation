base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/019.yaml
  text: And by that oath the depths were made firm[c][b][a], and they stand and do not move from their place from eternity to eternity.
translation:
  language: pt
  text: E por esse juramento as profundezas foram firmadas[a], e permanecem de pé e não se movem do seu lugar[b], de eternidade a eternidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram fortalecidas” ou “se tornaram firmes”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “das suas posições”, com possível referência a posições cósmicas fixas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ
  choice: juramento
  rationale: No contexto, designa o juramento vinculante mencionado na passagem; “juramento” preserva sua força jurídica e apocalíptica.
- source_word: ቀላይ
  choice: as profundezas
  rationale: O substantivo significa “profundeza”, “abismo” ou “mar profundo”. O plural em português acomoda os verbos e o pronome plurais que se seguem, sem omitir o sujeito cósmico.
- source_word: ፀንዐት
  choice: foram firmadas
  rationale: Expressa o resultado de tornar firme, fortalecer ou estabelecer; a forma concorda no gueês com o substantivo coletivo/singular, enquanto o português segue o plural contextual “profundezas”.
- source_word: ወቆሙ
  choice: e permanecem de pé
  rationale: O verbo literalmente indica que estão ou ficam de pé. “Permanecem de pé” comunica estabilidade contínua sem acrescentar uma interpretação abstrata.
- source_word: ወኢይትሐወሱ
  choice: e não se movem
  rationale: 'A forma verbal descreve uma realidade contínua: não se deslocam nem são perturbadas.'
- source_word: እመካኖሙ
  choice: do seu lugar
  rationale: “Lugar” preserva a amplitude da imagem; “posições” seria possível, mas explicitaria mais a ordem cósmica.
- source_word: እምዓለም ወእስከ ለዓለም
  choice: de eternidade a eternidade
  rationale: Reproduz mais de perto a estrutura enfática da expressão de origem a destino temporal.
theological_decisions:
- issue: Identidade do sujeito estabelecido pelo juramento
  choice: As profundezas são firmadas e permanecem imóveis em seu lugar.
  alternative: O próprio juramento é firme e permanece; ou uma formulação impessoal sobre estabilidade.
  rationale: O substantivo ቀላይ não deve ser omitido, e a sequência verbal plural com o pronome “seu/deles” aponta para realidades cósmicas como referentes. A tradução conserva essa imagem sem especificar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe preserva a cadência apocalíptica e a continuidade temporal dos verbos, evitando tanto arcaísmo excessivo quanto explicitação doutrinária.
