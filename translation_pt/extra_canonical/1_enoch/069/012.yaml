base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/012.yaml
  text: 'And the fifth was named Kasdeya[a]. This is the one who showed the children of men all the evil blows of spirits and of demons, and the blows in the womb, so that the embryo miscarries, and the blow upon the soul: the bite of the serpent[f][e][d][c][b], and the blow that comes at noon—the son of the serpent whose name is Taba''et.'
translation:
  language: pt
  text: 'E o quinto chamava-se Kasdeya. Foi ele quem mostrou aos filhos dos homens todos os golpes[a] malignos dos espíritos e dos demônios, os golpes contra o embrião no ventre, para fazê-lo cair[b], o golpe contra a alma[c] — a mordida da serpente — e o golpe que ocorre ao meio-dia: o filho da serpente, cujo nome é Taba’et[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo ge’ez repetido aqui como “golpes” também pode significar “ataques”, “feridas” ou, em sentido mais amplo, “aflições”.
    reason: lexical_alternative
  - marker: b
    text: A construção referente ao ventre é difícil. Literalmente, ela associa os golpes ao embrião no ventre e diz que ele “cai”, imagem que parece indicar a perda da gestação.
    reason: textual_variant
  - marker: c
    text: A expressão traduzida como “o golpe contra a alma” está textualmente incerta neste testemunho.
    reason: textual_variant
  - marker: d
    text: A sintaxe final é condensada e incerta. “O filho da serpente, cujo nome é Taba’et” pode identificar o golpe do meio-dia ou um ser ligado a esse golpe; também é possível relacionar o nome à própria serpente.
    reason: alternative_reading
lexical_decisions:
- source_word: ኃምስ፡ ስሙ፡ ካስድያእ
  choice: o quinto chamava-se Kasdeya
  rationale: Mantém a fórmula ordinal da lista em português natural e translitera o nome próprio sem traduzi-lo.
- source_word: ዘአርአዩ
  choice: mostrou
  rationale: O verbo tem o sentido concreto de fazer ver ou dar a conhecer; “mostrou” evita especificar indevidamente um ensino formal.
- source_word: ለውሉደ፡ ሰብእ
  choice: aos filhos dos homens
  rationale: Preserva a expressão apocalíptica tradicional e elevada, em vez de reduzi-la simplesmente a “seres humanos”.
- source_word: ዝብጠታተ / ዝብጠተ
  choice: golpes / golpe
  rationale: Reproduz a imagem reiterada de ferir ou atingir e conserva a alternância do plural para o singular presente no texto ge’ez.
- source_word: ዘነፍሳት፡ ወዘአጋንንት
  choice: dos espíritos e dos demônios
  rationale: Mantém distintos os dois termos relativos a agentes ou poderes espirituais nocivos.
- source_word: ባእባአ፡ ማሕፀን፡ ከመ፡ ይደቅ
  choice: contra o embrião no ventre, para fazê-lo cair
  rationale: Representa o embrião como alvo dos golpes e conserva a imagem verbal de “cair”, sem ocultar que a passagem descreve a perda da gestação.
- source_word: '[ዝብጠተ፡ ነፍስ፡]'
  choice: o golpe contra a alma
  rationale: Mantém o singular e o sentido provável da expressão, embora a leitura esteja textualmente assinalada como incerta.
- source_word: ንስክተ፡ አርዌ
  choice: a mordida da serpente
  rationale: Expressa de modo direto a agressão concreta atribuída à serpente.
- source_word: ዘይከውን፡ በቀትር
  choice: que ocorre ao meio-dia
  rationale: Preserva literalmente a referência temporal, que pode ter valor sinistro no contexto apocalíptico.
- source_word: ወልዳ፡ ለአርዌ፡ ዘስሙ፡ ተባዕት
  choice: o filho da serpente, cujo nome é Taba’et
  rationale: Conserva a identificação final e translitera o nome, sem eliminar a ambiguidade de sua relação sintática com o golpe do meio-dia.
theological_decisions:
- issue: Natureza dos males revelados por Kasdeya
  choice: Uma série de golpes ou aflições malignas ligados a espíritos, demônios, perda gestacional, alma, serpente e meio-dia
  alternative: Conhecimento geral sobre armas, ferimentos físicos ou fórmulas mágicas
  rationale: A repetição do termo para “golpe”, junto às referências a espíritos, demônios, ventre, alma e serpente, favorece uma lista de aflições ou poderes nocivos, sem exigir que sejam definidos apenas como técnicas mágicas.
- issue: Relação da mordida da serpente com o golpe contra a alma
  choice: A pontuação apresenta a mordida como explicação ou especificação possível do golpe contra a alma
  alternative: A mordida da serpente constitui um item inteiramente separado da lista
  rationale: A sintaxe é comprimida; o travessão permite a leitura apositiva mais provável sem transformar a relação em afirmação dogmática.
- issue: Referência da expressão final sobre Taba’et
  choice: A expressão é apresentada como possível identificação do golpe que ocorre ao meio-dia
  alternative: Taba’et é uma figura separada ou o nome da própria serpente
  rationale: Os dois-pontos refletem a provável aposição, enquanto a nota registra que a sintaxe não permite resolver a identificação com plena certeza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a expressão apocalíptica “filhos dos homens”, a repetição enfática de “golpe(s)” e a linguagem espiritual do texto. A pontuação organiza a enumeração sem apagar suas incertezas textuais e sintáticas.
