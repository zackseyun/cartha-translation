base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/001.yaml
  text: And after this judgment[a], they will terrify them and oppress them[d][c][b], because they showed this to those who dwell upon the dry land.
translation:
  language: pt
  text: E depois deste juízo[a], eles os aterrorizarão e oprimirão, porque mostraram isto[c] aos que habitam sobre a terra seca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois desta condenação” ou “depois desta sentença”. O termo ge''ez tem sentido judicial.'
    reason: lexical_alternative
  - marker: b
    text: “Terra seca” é mais literal do que simplesmente “terra” e pode preservar um contraste cosmológico com o mar ou as águas.
    reason: lexical_alternative
  - marker: c
    text: O referente de “isto” não é especificado neste versículo; provavelmente remete ao que foi revelado anteriormente.
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረ ዝ ኵነኔ
  choice: depois deste juízo
  rationale: Mantém ዝ ኵነኔ como uma unidade nominal, “este juízo”, e evita fazer de “juízo” o sujeito singular dos verbos plurais seguintes.
- source_word: ያደነገፅዎሙ
  choice: eles os aterrorizarão
  rationale: O verbo exprime causar medo ou espanto; a forma verbal indica sujeito na terceira pessoa do plural e objeto também plural.
- source_word: ያምዕፅዎሙ
  choice: oprimirão
  rationale: O valor lexical é oprimir, violentar ou agir injustamente contra alguém; “oprimirão” é natural e preserva a força do termo.
- source_word: እስመ
  choice: porque
  rationale: Introduz de modo claro a razão da ação anunciada.
- source_word: ዘንተ አርአዩ
  choice: mostraram isto
  rationale: Traduz de perto a ideia de mostrar ou tornar visível, sem especificar o referente implícito de “isto”.
- source_word: ለእለ የኀድሩ
  choice: aos que habitam
  rationale: Preserva a expressão participial e o registro elevado da prosa apocalíptica.
- source_word: ዲበ የብስ
  choice: sobre a terra seca
  rationale: Mantém a imagem concreta da terra firme em possível contraste cosmológico com as águas, em vez de reduzi-la ao sentido genérico de “terra”.
theological_decisions:
- issue: Valor de ኵነኔ no contexto apocalíptico
  choice: este juízo
  alternative: esta condenação; esta sentença
  rationale: “Juízo” conserva a dimensão judicial apocalíptica sem definir além do texto se o termo enfatiza o ato judicial, a sentença ou a condenação.
- issue: Identidade dos sujeitos e objetos dos verbos plurais
  choice: manter os pronomes implícitos como “eles” e “os”
  alternative: identificar explicitamente os grupos com base no contexto anterior
  rationale: O versículo isolado não nomeia os referentes. Explicitar identidades resolveria uma ambiguidade que o ge'ez deixa dependente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve elevação própria da literatura apocalíptica. A colocação “eles os” explicita a morfologia verbal sem identificar indevidamente os referentes. Todos os marcadores de nota aparecem no texto principal.
