base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/015.yaml
  text: And this is the power of this oath, for it is mighty and firm; and he placed this oath, Aka'e, into the hand of Mika'el.
translation:
  language: pt
  text: E este é o poder deste juramento, pois ele é poderoso e firme; e ele pôs este juramento, Aka’e, na mão de Mika’el.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na mão de Mika’el”; expressão que pode indicar que o juramento lhe foi confiado ou colocado sob sua autoridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃይሉ
  choice: o poder
  rationale: O substantivo denota força ou poder; “poder” comunica melhor a eficácia solene do juramento neste contexto apocalíptico.
- source_word: ማሐላ
  choice: juramento
  rationale: É a tradução direta e contextualmente estável do termo repetido, sem especificá-lo indevidamente como juramento imprecatório.
- source_word: ኃያል
  choice: poderoso
  rationale: O adjetivo predicativo ressalta a potência do juramento e mantém um registro elevado, mas natural em português.
- source_word: ፅኑዕ
  choice: firme
  rationale: Expressa estabilidade, solidez e caráter inabalável, combinando naturalmente com “poderoso”.
- source_word: አንበሮ
  choice: pôs
  rationale: Preserva o sentido concreto de colocar ou pôr, sem converter a imagem em uma interpretação abstrata como “confiou”.
- source_word: አካእ
  choice: Aka’e
  rationale: Mantém o nome próprio explícito no texto ge’ez e representa sua forma por transliteração.
- source_word: በእዴሁ
  choice: nas mãos
  rationale: Conserva a imagem concreta da mão e soa idiomático em português; o sentido provável de entrega ou autoridade é explicado em nota.
- source_word: ለሚካኤል
  choice: de Mika’el
  rationale: A transliteração acompanha a forma ge’ez e evita substituir o nome pela forma portuguesa tradicional.
theological_decisions:
- issue: Traduzir concretamente ou interpretar a expressão relativa à mão
  choice: nas mãos de Mika’el
  alternative: sob a autoridade de Mika’el / aos cuidados de Mika’el
  rationale: O ge’ez emprega uma imagem concreta que provavelmente indica entrega ou colocação sob autoridade. O texto principal preserva essa imagem, enquanto a nota esclarece seu alcance idiomático sem eliminar a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preserva-se a estrutura solene do original, os dois demonstrativos (“deste/este”), o nome Aka’e e a imagem concreta da mão.
