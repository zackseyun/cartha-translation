base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/006.yaml
  text: And the third was named Gadreel[a]; this is the one who showed all the blows of death to the children of men, and he led Eve astray[c][b], and he showed the weapons of death to the sons of men—the shield and the breastplate and the sword for slaughter—and all the weapons of death to the children of men.
translation:
  language: pt
  text: E o terceiro chamava-se Gadreel. Foi ele quem mostrou todos os golpes de morte aos filhos dos homens e levou Eva ao erro; e foi ele quem mostrou aos seres humanos os instrumentos de morte[a] — o escudo, a couraça e a espada para matar — e todos os instrumentos de morte aos filhos dos homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida como “armas de morte”. O texto ge'ez é difícil neste ponto e repete a expressão depois da lista; a tradução conserva tanto a lista específica quanto a repetição final.
    reason: textual_variant
lexical_decisions:
- source_word: ሣልስ፡ ስሙ፡ ጋድርኤል
  choice: o terceiro chamava-se Gadreel
  rationale: Reproduz naturalmente em português a fórmula ordinal e nominal do ge'ez, transliterando o nome próprio.
- source_word: ዘአርአየ
  choice: quem mostrou
  rationale: Mantém o sentido básico e a repetição do verbo 'mostrar', sem especificar indevidamente um ensino formal.
- source_word: ኵሎ፡ ዝብጠተ፡ ሞት
  choice: todos os golpes de morte
  rationale: Preserva a construção nominal com 'morte' e sua repetição enfática ao longo do versículo; 'golpes' conserva a imagem de agressões ou ferimentos.
- source_word: ለውሉደ፡ ሰብእ
  choice: aos filhos dos homens
  rationale: Mantém o registro apocalíptico tradicional e o sentido coletivo da expressão.
- source_word: አስሐታ፡ ለሔዋን
  choice: desviou Eva
  rationale: Expressa a ação de levar ao erro sem acrescentar uma formulação doutrinária posterior.
- source_word: ንዋየ፡ ሞት
  choice: instrumentos de morte
  rationale: O termo pode abranger armas e apetrechos; 'instrumentos' preserva essa amplitude, enquanto a lista seguinte esclarece o contexto militar.
- source_word: ለደቂቀ፡ ሰብእ
  choice: aos seres humanos
  rationale: Expressa o coletivo humano em português atual e reflete a pequena variação lexical do ge'ez em relação à expressão anterior.
- source_word: ወለታ፡ ወድርዐ፡ ወሰይፈ
  choice: o escudo, a couraça e a espada
  rationale: Equivalentes claros e naturais para a sequência de equipamento militar defensivo e ofensivo.
- source_word: ለቀተል
  choice: para matar
  rationale: Conserva diretamente a finalidade violenta indicada pela expressão, em linguagem portuguesa corrente e digna.
theological_decisions:
- issue: Atribuição do desvio de Eva a Gadreel
  choice: desviou Eva
  alternative: enganou Eva
  rationale: O ge'ez atribui diretamente a Gadreel essa ação. A tradução mantém a tensão com outras tradições sem harmonizá-la nem identificar Gadreel com outra figura.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação apocalíptica. Conservou-se a repetição deliberada de 'morte' e a alternância entre 'filhos dos homens' e 'seres humanos'. O único marcador de nota aparece no texto principal.
