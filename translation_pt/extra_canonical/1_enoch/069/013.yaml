base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/013.yaml
  text: This is the secret of Kasbeel[a], the chief of the oath which he showed to the holy ones when he dwelt in glory on high[d][c][b], and its name is Biqa.
translation:
  language: pt
  text: Este é o segredo[a] de Kasbeel, o chefe do juramento[b] que ele revelou aos seres santos[c] quando habitava no alto, em glória; e seu nome é Biqa.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «número» ou «soma». O sentido de ጐልቁ neste contexto é discutido; «segredo» segue a leitura contextual, sem excluir o valor ligado a contar ou enumerar.
    reason: lexical_alternative
  - marker: b
    text: Ou «o chefe da adjuração». Aqui, «juramento» talvez designe uma fórmula solene vinculada a um nome revelado.
    reason: lexical_alternative
  - marker: c
    text: Neste cenário visionário, a expressão provavelmente se refere a seres celestiais. A tradução evita identificá-los de modo mais específico.
    reason: cultural_note
  - marker: d
    text: O possessivo em «seu nome» pode referir-se ao elemento revelado anteriormente ou, com menor probabilidade, ao próprio Kasbeel.
    reason: alternative_reading
lexical_decisions:
- source_word: ጐልቁ
  choice: número
  rationale: O termo deriva da raiz ligada a contar ou enumerar e significa literalmente “número” ou “soma”. Embora uma revisão inglesa recente proponha “segredo”, essa acepção não está suficientemente apoiada pelo dado lexical apresentado; por isso, conserva-se “número”, apesar da dificuldade contextual.
- source_word: ካስብኤል
  choice: Kasbeel
  rationale: O nome próprio é transliterado de modo próximo à forma ge'ez, sem ser traduzido.
- source_word: ርእሰ ማሐላ
  choice: o chefe do juramento
  rationale: ርእሰ significa literalmente “cabeça” e pode indicar primazia; “chefe” expressa isso naturalmente. ማሐላ tem como sentido básico “juramento”.
- source_word: ዘአርአዩ
  choice: que ele revelou
  rationale: O verbo causativo significa mostrar ou fazer ver; “revelou” comunica de modo natural sua força no contexto visionário, sem acrescentar conteúdo ao objeto revelado.
- source_word: ለቅዱሳን
  choice: aos santos
  rationale: A expressão significa literalmente “aos santos” ou “aos seres santos”. A forma concisa preserva o termo, enquanto a nota esclarece que, neste cenário, provavelmente se trata de seres celestiais.
- source_word: ሶበ ኆደሩ
  choice: quando habitava
  rationale: A oração indica a circunstância temporal e emprega um verbo que pode significar permanecer ou habitar.
- source_word: በልዑል በስብሐት
  choice: nas alturas, em glória
  rationale: A tradução mantém tanto a ideia de elevação quanto a de glória, com sintaxe natural em português.
- source_word: ወስሙ ቢቃ
  choice: e seu nome é Biqa
  rationale: O sufixo pronominal pode referir-se ao elemento revelado anteriormente ou, com menor probabilidade, a Kasbeel. O possessivo português conserva essa ambiguidade referencial.
theological_decisions:
- issue: Identidade dos “santos”
  choice: manter “santos” no texto e indicar como provável a referência a seres celestiais
  alternative: seres santos; santos humanos
  rationale: O cenário visionário favorece seres celestiais, mas o substantivo não deve ser ampliado no corpo do texto de modo a eliminar toda ambiguidade.
- issue: Sentido de ማሐላ no contexto de um nome revelado
  choice: juramento
  alternative: adjuração; fórmula solene de juramento
  rationale: “Juramento” é o sentido lexical direto. A possível ideia de uma fórmula de adjuração é registrada em nota, sem importar terminologia esotérica para o texto.
- issue: Referente de “seu” na cláusula final
  choice: preservar a ambiguidade pronominal
  alternative: explicitar que se refere ao número, ao juramento ou a Kasbeel
  rationale: A forma ge'ez não exige que a tradução fixe de maneira inequívoca o referente; explicitar um deles resolveria uma tensão textual genuína.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A formulação mantém a estranheza do original onde a sintaxe e os referentes são incertos, evitando corrigi-los por conjectura.
