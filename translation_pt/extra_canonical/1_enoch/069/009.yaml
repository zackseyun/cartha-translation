base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/009.yaml
  text: And he taught humankind writing with ink and paper[a], and because of this many have gone astray from eternity to eternity[c][b], even to this day.
translation:
  language: pt
  text: E ele ensinou à humanidade a escrita com tinta e papel[a]; por causa disso, muitos têm se desviado de eternidade a eternidade[b], até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A forma etiópica disponível nesta transcrição contém erros graves de transcrição. A leitura recuperada é: «ensinou-lhes a escrita com tinta e papel»; «papiro» também é possível para o último termo. Uma leitura baseada apenas na forma corrompida produziria algo como «deu à humanidade escritos de amargura e engano».'
    reason: textual_variant
  - marker: b
    text: 'Ou: «de era em era». O termo repetido pode significar tanto «era» como «eternidade».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሀሮሙ (leitura corrigida de አበወዎሙ)
  choice: ensinou à humanidade
  rationale: A leitura corrigida do texto etíope significa “ensinou-lhes”; o contexto identifica a humanidade como destinatária. A correção é preferível ao OCR corrompido, que sugere “deu-lhes”.
- source_word: ጽሕፈት / expressão contextual de escrita
  choice: a escrita
  rationale: Expressa a arte ou prática transmitida, em linguagem natural e sem restringi-la a um tipo específico de documento.
- source_word: በቀለም፡ ወበክርታስ (leitura corrigida da sequência corrompida)
  choice: com tinta e papel
  rationale: A leitura recuperada designa os materiais da escrita; “papel” é a equivalência moderna mais clara para o suporte de escrita, embora “papiro” seja possível.
- source_word: ብዙኃን
  choice: muitos
  rationale: Mantém diretamente o valor quantitativo e o tom de advertência.
- source_word: እለ፡ ይስሕቱ
  choice: têm se desviado
  rationale: O verbo comunica afastamento ou erro moral e intelectual; o perfeito composto português liga o processo passado à expressão “até o dia de hoje”.
- source_word: እምዓለም፡ ወእስከ፡ ለዓለም
  choice: de eternidade em eternidade
  rationale: Preserva a repetição elevada e a cadência apocalíptica, sem reduzir a expressão a um simples “para sempre”.
- source_word: ወእስከ፡ ዛቲ፡ ዕለት
  choice: até o dia de hoje
  rationale: Equivalente português corrente e digno da fórmula temporal etíope.
theological_decisions:
- issue: Natureza do conhecimento transmitido à humanidade
  choice: A tecnologia ou prática da escrita com tinta e papel
  alternative: Tábuas ou escritos de amargura e engano
  rationale: A forma fornecida contém erros graves de transcrição/OCR. A leitura textual corrigida, apoiada pelo contexto imediato, aponta para “ensinou” e “com tinta e papel”. A nota mantém transparente a dificuldade textual sem transformar a passagem em uma afirmação doutrinária mais específica.
- issue: Sentido temporal de ዓለም repetido
  choice: de eternidade em eternidade
  alternative: de era em era
  rationale: A expressão pode denotar eras ou eternidade. A tradução principal conserva o registro apocalíptico elevado, enquanto a nota registra a alternativa genuína.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A construção conserva a cadência apocalíptica sem arcaísmos desnecessários; as incertezas textuais e lexicais são explicitadas em notas.
