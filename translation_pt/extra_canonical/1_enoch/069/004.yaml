base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/004.yaml
  text: And the name of the first was Yeqon[a]; this is the one who led all the children of the angels astray, and brought them down upon the dry land[d][c][b], and led them astray through the daughters of men.
translation:
  language: pt
  text: E o nome do primeiro era Yeqon[a]; foi ele quem desencaminhou todos os filhos dos anjos[b], fez com que descessem à terra seca[c] e os desencaminhou por meio das filhas dos seres humanos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yeqon é uma transliteração da forma ge'ez; também se encontram grafias como Yequn.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “filhos dos anjos”. Alguns entendem a expressão de modo mais amplo, como referência aos anjos ou ao exército angélico.
    reason: lexical_alternative
  - marker: c
    text: “À terra seca” também pode ser traduzido como “à terra firme” ou “sobre a terra”; a expressão ge'ez aponta concretamente para o domínio terrestre.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “por meio das filhas dos seres humanos”; a preposição indica o meio pelo qual Yeqon os desencaminhou, não que elas fossem o agente da ação.
    reason: ambiguity_preservation
lexical_decisions:
- source_word: ወስሙ፡ ለቀዳማዊ
  choice: E o nome do primeiro era
  rationale: Preserva a fórmula de nomeação e o estilo de catálogo, expressando naturalmente em português a relação genitiva e a identificação do primeiro personagem da sequência.
- source_word: ይቁን
  choice: Yeqon
  rationale: Mantém o nome próprio por transliteração da forma ge'ez, sem tentar lhe atribuir um significado incerto.
- source_word: ዝውእቱ
  choice: foi ele quem
  rationale: Reproduz a identificação enfática do demonstrativo com cópula em português atual e natural.
- source_word: ዘአስሐተ ... ወአስሐቶሙ
  choice: desencaminhou ... os desencaminhou
  rationale: O mesmo verbo português é repetido para refletir a repetição da raiz ge'ez e conservar a estrutura retórica da acusação.
- source_word: ደቂቀ፡ መላእክት
  choice: os filhos dos anjos
  rationale: Conserva a expressão familiar incomum do ge'ez, sem reduzi-la interpretativamente a “os anjos” ou “o exército angélico”.
- source_word: ወአውረዶሙ
  choice: fez com que descessem
  rationale: Expressa a forma causativa do verbo de descida sem acrescentar a ideia não exigida de expulsão violenta.
- source_word: ዲበ፡ የብስ
  choice: à terra seca
  rationale: Mantém a imagem concreta de descida ao domínio terrestre e o sentido de solo ou terra seca.
- source_word: በአዋልደ፡ ሰብእ
  choice: por meio das filhas dos seres humanos
  rationale: Torna explícito o valor instrumental da preposição ge'ez, evitando sugerir que as filhas fossem o agente do desencaminhamento; “seres humanos” comunica o sentido coletivo de ሰብእ.
theological_decisions:
- issue: Identidade dos “filhos dos anjos”
  choice: Conservar no texto a expressão familiar literal “filhos dos anjos”.
  alternative: “os anjos”, “o exército angélico” ou “os filhos do céu”
  rationale: A formulação ge'ez é uma característica textual e interpretativa real; simplificá-la resolveria indevidamente a identidade do grupo.
- issue: Força dos dois verbos de engano
  choice: Repetir “desencaminhou”.
  alternative: “enganou ... seduziu” ou “fez errar ... enganou”
  rationale: O ge'ez repete a mesma ideia verbal; a repetição preserva a unidade lexical e o peso moral sem introduzir nuances distintas.
- issue: Papel das filhas dos seres humanos
  choice: Traduzir a preposição instrumental como “por meio de”.
  alternative: “pelas filhas dos seres humanos”
  rationale: A construção identifica Yeqon como agente e as filhas como meio ou ocasião; “por meio de” preserva essa relação sem criar ambiguidade de agência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe esclarece os referentes sem eliminar as formulações incomuns do ge'ez; evita arcaísmos e terminologia denominacional.
