base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/010.yaml
  text: 'For men were not born for this: to strengthen their faith with pen and ink[a][b][c].'
translation:
  language: pt
  text: 'Pois os seres humanos não nasceram para isto: fortalecer sua fé com pena e tinta.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “pena e tinta” diz literalmente “com qäläm e com água de fel”. No contexto, pode designar os instrumentos e materiais da escrita, talvez a tinta feita à base de galhas.
    reason: cultural_note
  - marker: b
    text: “Fé” também pode significar aqui “confiança” ou “fidelidade”; o contexto de escritos e compromissos permite essas nuances.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Mantém a força explicativa ou causal do conectivo no contexto.
- source_word: ኢተወልዱ፡ ሰብእ
  choice: os seres humanos não nasceram
  rationale: Expressa naturalmente a forma passiva negativa e deixa claro que ሰብእ designa a humanidade em sentido coletivo.
- source_word: በዘ፡ ከመዝ
  choice: para isto
  rationale: Conserva a relação de finalidade sem explicitar além do necessário.
- source_word: በቀለም፡ ወበማየ፡ ሐመት
  choice: com pena e tinta
  rationale: 'No contexto de escrita, a combinação pode designar idiomaticamente os instrumentos e materiais da escrita: pena e tinta; a nota preserva a forma literalmente difícil do segundo elemento.'
- source_word: ያጽንዑ
  choice: fortalecer
  rationale: Reproduz o sentido de tornar firme ou forte e evita restringi-lo a mera confirmação formal.
- source_word: ሃይማኖቶሙ
  choice: sua fé
  rationale: Preserva o sentido religioso ou fiduciário amplo do substantivo, sem impor a leitura mais específica de 'boa-fé'.
theological_decisions:
- issue: Sentido de fortalecer a fé por meios de escrita
  choice: Manter 'fortalecer sua fé', sem explicar no corpo do texto se se trata de fé religiosa, confiança ou fidelidade.
  alternative: confirmar sua boa-fé
  rationale: O contexto pode envolver compromissos escritos, mas o léxico permite 'fé', 'confiança' ou 'fidelidade'. A tradução mantém a tensão e evita reduzir o termo a uma fórmula jurídica.
- issue: Interpretação de pena e tinta
  choice: Empregar a expressão contextual 'pena e tinta', registrando a literalidade em nota.
  alternative: com tinta e água de fel
  rationale: A expressão concreta provavelmente se refere à escrita e possivelmente à tinta ferrogálica; a nota permite ao leitor ver a formulação etíope sem tornar o texto principal obscuro.
translation_notes:
  register: Português moderno, digno e acessível, com 'seres humanos' em sentido inclusivo. A formulação mantém a estrutura explicativa do ge'ez e conserva em notas as ambiguidades lexical e cultural.
