  source_fidelity: 'O texto preserva adequadamente a estrutura causal e final do ge''ez: a humanidade “não nasceu para isto”, isto é, para tornar firme a sua fé mediante os meios de escrita. “Pena e tinta” é uma boa tradução contextual para qäläm e “água de fel”, sem ocultar a formulação literal na nota. “Fortalecer sua fé” conserva a amplitude de yaṣnəʿu hāymānotomu melhor do que uma redução jurídica a “confirmar sua boa-fé”.'
