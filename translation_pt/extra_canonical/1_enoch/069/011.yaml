base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/011.yaml
  text: For human beings were not created except to be like the angels[a], so that they might remain pure and righteous; and death, which destroys everything, would not have touched them. But through this knowledge they are being destroyed[d][c][b], and through this power it is consuming me.
translation:
  language: pt
  text: Pois os seres humanos não foram criados senão para serem como os anjos[a], a fim de permanecerem puros e justos; e a morte, que destrói tudo, não os teria tocado. Mas, por meio desse conhecimento, eles estão sendo destruídos[b][c], e esse poder me devora[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também é possível traduzir o início: “Pois nenhum ser humano foi criado senão para ser como os anjos, a fim de que permanecesse...”. O substantivo etíope pode ter sentido coletivo.'
    reason: lexical_alternative
  - marker: b
    text: “Por meio desse conhecimento” também pode ser entendido como “por meio desse entendimento”; o referente exato não é explicitado.
    reason: lexical_alternative
  - marker: c
    text: Esta parte das Parábolas não dispõe, neste ponto, de apoio efetivo de manuscritos gregos ou de Qumran; por isso, a frase incerta foi traduzida com cautela a partir do etíope.
    reason: textual_variant
  - marker: d
    text: Literalmente, “me come” ou “me devora”. A frase final é vívida e passa inesperadamente para a primeira pessoa do singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢተፈጥረ
  choice: não foram criados
  rationale: Conserva a linguagem passiva e explícita de criação; o plural expressa naturalmente em português o sentido coletivo de ሰብእ.
- source_word: ሰብእ
  choice: os seres humanos
  rationale: Representa a humanidade em geral sem restringir a referência ao sexo masculino e evita discordância com os pronomes plurais seguintes.
- source_word: ዘእንበለ
  choice: senão para
  rationale: Preserva a força restritiva da construção e liga com naturalidade a criação à finalidade expressa no contexto.
- source_word: ከመ መላእክት
  choice: como os anjos
  rationale: Mantém a comparação entre seres humanos e anjos sem sugerir identidade ontológica.
- source_word: ይንበሩ
  choice: permanecerem
  rationale: No contexto, indica continuidade de estado, não residência ou localização.
- source_word: ንጹሓነ ወጻድቃነ
  choice: puros e justos
  rationale: Conserva o peso moral e religioso dos dois adjetivos em linguagem portuguesa corrente e digna.
- source_word: ሞት ዘኵሉ ያማሥን
  choice: a morte, que destrói tudo
  rationale: Preserva a personificação da morte e a abrangência enfática da oração relativa.
- source_word: እመ ኢገሰሶሙ
  choice: não os teria tocado
  rationale: Expressa o sentido contrafactual adequado ao argumento e mantém a imagem concreta do contato da morte com a humanidade.
- source_word: አእምሮቶሙ
  choice: esse conhecimento
  rationale: Conhecimento é a opção contextual mais transparente, embora o substantivo também possa indicar entendimento; a nota preserva essa incerteza.
- source_word: ይትሐጐሉ
  choice: estão sendo destruídos
  rationale: Mantém o valor passivo ou reflexivo de ruína e reforça o contraste com o estado original de pureza e justiça.
- source_word: ኃይል
  choice: poder
  rationale: Preserva a amplitude semântica e a força apocalíptica do termo, sem especificar indevidamente a natureza desse poder.
- source_word: ይበልዓኒ
  choice: me devora
  rationale: Reproduz de forma vívida e natural a imagem concreta do verbo, mais forte que uma formulação abstrata como 'me destrói'.
theological_decisions:
- issue: A condição para a qual a humanidade foi criada
  choice: A humanidade foi criada para ser como os anjos em pureza e justiça.
  alternative: Os seres humanos foram criados como seres angélicos.
  rationale: A construção comparativa favorece semelhança, não identidade; assim, conserva-se a antropologia elevada do texto sem apagar a distinção entre humanos e anjos.
- issue: O sentido causal de አእምሮቶሙ
  choice: por meio desse conhecimento, eles estão sendo destruídos
  alternative: por meio desse entendimento, eles perecem
  rationale: A formulação principal segue de perto o testemunho etíope e não identifica qual conhecimento está em vista; a alternativa lexical fica registrada em nota.
- issue: A força da declaração sobre a morte
  choice: a morte não teria tocado a humanidade se ela houvesse permanecido no estado pretendido
  alternative: a morte simplesmente não se aproximaria deles
  rationale: O valor contrafactual se ajusta ao encadeamento do verso, mas a tradução não desenvolve uma doutrina da mortalidade humana além do que a frase afirma.
translation_notes:
  register: Português moderno, de leitura ampla e natural no Brasil, com tom solene sem arcaísmos. Empregaram-se “seres humanos”, “puros e justos” e “me devora” para combinar clareza popular com fidelidade à dicção moral e à imagem vigorosa do etíope. As ambiguidades relevantes foram mantidas no texto ou registradas em notas.
