base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/024.yaml
  text: All these will believe and give thanks before the Lord of Spirits[a], and they will bless with all their power, and their food will be in all thanksgiving[c][b]; and they will give thanks and bless and exalt the name of the Lord of Spirits forever and ever.
translation:
  language: pt
  text: Todos estes crerão e darão graças diante do Senhor dos Espíritos. Eles o bendirão com toda a sua força, e seu alimento estará em toda ação de graças[a]. Darão graças, bendirão e exaltarão o nome do Senhor dos Espíritos para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão em ge'ez é condensada. Também pode ser entendida como “seu alimento será toda ação de graças” ou “seu alimento será acompanhado de toda ação de graças”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ያአምኑ
  choice: crerão
  rationale: Expressa diretamente crer ou confiar, sem acrescentar uma formulação doutrinária posterior.
- source_word: የአኵቱ / ወየአኵቱ
  choice: darão graças
  rationale: O substantivo próximo አኰቴት favorece o sentido de gratidão, embora o campo semântico também possa abranger louvor.
- source_word: በቅድመ
  choice: diante de
  rationale: Mantém o sentido espacial e cultual de estar perante a presença divina.
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Preserva a força titular da expressão divina recorrente nas Parábolas de 1 Enoque.
- source_word: ይሴብሑ / ወይሴብሑ
  choice: bendirão
  rationale: Distingue este verbo dos verbos de agradecer e exaltar presentes na mesma sequência litúrgica.
- source_word: በኵሉ ኃይሎሙ
  choice: com toda a sua força
  rationale: Transmite a totalidade da capacidade ou vigor dos adoradores em português natural.
- source_word: ሲሳዮሙ
  choice: seu alimento
  rationale: O substantivo designa alimento ou sustento, e não apenas riqueza ou bens; a escolha conserva a imagem de que a ação de graças constitui ou envolve seu sustento.
- source_word: በኵሉ አኰቴት
  choice: em toda ação de graças
  rationale: Conserva a preposição e a formulação comprimida do ge'ez, sem eliminar sua ambiguidade imagética.
- source_word: ያሌዕሉ
  choice: exaltarão
  rationale: Preserva o sentido de elevar ou engrandecer e o registro solene do louvor apocalíptico.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Equivalente idiomático e solene da fórmula de duração eterna.
theological_decisions:
- issue: Se ያአምኑ deve receber linguagem cristã explicitamente doutrinária
  choice: crerão
  alternative: confiarão; terão fé
  rationale: A forma simples preserva a resposta escatológica dos adoradores sem importar uma formulação posterior sobre fé salvífica.
- issue: Como traduzir o título divino እግዚአ መንፈሳት
  choice: Senhor dos Espíritos
  alternative: Senhor dos espíritos
  rationale: A capitalização preserva seu caráter de título divino recorrente, sem transformar a expressão em mera descrição genérica.
- issue: Como representar a relação entre alimento e ação de graças
  choice: seu alimento estará em toda ação de graças
  alternative: seu alimento será toda ação de graças; seu alimento será acompanhado de toda ação de graças
  rationale: A redação mantém a imagem incomum e a preposição do texto, evitando decidir se a ação de graças é o próprio sustento ou a circunstância em que ele é recebido.
translation_notes:
  register: Português moderno, solene e acessível, com cadência litúrgica. A repetição dos verbos de adoração foi mantida, assim como a imagem incomum que relaciona alimento e ação de graças.
