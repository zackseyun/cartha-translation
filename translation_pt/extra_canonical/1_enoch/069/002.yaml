base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/002.yaml
  text: 'And these are the names of those angels[a], and these are their names: the first of them was Semyaza, the second Artaqifa, the third Armen, the fourth Kokabel, the fifth Turiel, the sixth Rumyal, the seventh Daniyal, the eighth Neqael, the ninth Baraqel, the tenth Azazel, the eleventh Armaros, the twelfth Batariel, the thirteenth Basasael, the fourteenth Hananel, the fifteenth Turiel, the sixteenth Simipesiel, the seventeenth Yeterel, the eighteenth Tumael, the nineteenth Turiel, the twentieth Teremael[d][c][b], and the twenty-first Te''azazel.'
translation:
  language: pt
  text: 'E eis os nomes daqueles anjos[a], e estes são os nomes deles: o primeiro deles, Semyaza; o segundo, Artaqifa; o terceiro, Armen; o quarto, Kokabel; o quinto, Turiel; o sexto, Rumyal; o sétimo, Daniyal; o oitavo, Neqael; o nono, Baraqel; o décimo, Azazel; o décimo primeiro, Armaros; o décimo segundo, Batariel; o décimo terceiro, Basasael; o décimo quarto, Hananel; o décimo quinto, Turiel; o décimo sexto, Simipesiel; o décimo sétimo, Yeterel; o décimo oitavo, Tumael; o décimo nono, Turiel[b]; o vigésimo, Teremael[c]; e o vigésimo primeiro, Te''azazel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes neste versículo são incertos, pois esta parte de 1 Enoque foi preservada, para os fins desta tradução, praticamente apenas em ge'ez, e a transcrição do testemunho etíope apresenta dificuldades. As formas no texto permanecem próximas das formas etíopes visíveis, sem serem harmonizadas com grafias mais conhecidas.
    reason: textual_variant
  - marker: b
    text: O nome traduzido como “Turiel” aparece mais de uma vez na lista etíope, com pequenas variações de grafia. A repetição foi preservada, sem correção silenciosa.
    reason: textual_variant
  - marker: c
    text: Outras edições e traduções apresentam formas diferentes para alguns nomes desta lista. Em geral, essas diferenças refletem a incerteza das formas etíopes, não uma diferença de sentido deliberadamente adotada.
    reason: alternative_reading
lexical_decisions:
- source_word: ወነዋ
  choice: E eis
  rationale: Preserva a interjeição de apresentação do ge'ez e o tom solene próprio de uma revelação, sem fundi-la com a oração seguinte.
- source_word: አስማቲሆሙ፡ ለእሉክ፡ መላእክት
  choice: os nomes daqueles anjos
  rationale: A construção identifica a quem pertencem os nomes; “daqueles anjos” mantém a força demonstrativa e retrospectiva.
- source_word: ወዝንቱ፡ ውእቱ፡ አስማቲሆሙ
  choice: e estes são os nomes deles
  rationale: Mantém a segunda fórmula introdutória, distinta da primeira, com concordância natural em português.
- source_word: ቀዳማዊ፡ ዚአሆሙ
  choice: o primeiro deles
  rationale: Reproduz o ordinal e a relação partitiva sem acrescentar um verbo ausente e potencialmente temporal.
- source_word: ወካልእ / ሠሣልስ / ወራብዕ ...
  choice: o segundo / o terceiro / o quarto ...
  rationale: Conserva explicitamente a numeração formal da lista em vez de abreviá-la.
- source_word: ስምያዛ
  choice: Semyaza
  rationale: Transliteração conservadora da forma ge'ez, sem harmonização com formas difundidas em outras tradições.
- source_word: ኮከብኤል
  choice: Kokabel
  rationale: O nome é transliterado, não traduzido, embora pareça conter o elemento lexical relacionado a “estrela”.
- source_word: ጡሩኤል / ጡርኤል
  choice: Turiel
  rationale: As formas etíopes semelhantes são apresentadas sob uma transliteração uniforme, mantendo todas as suas ocorrências na lista.
- source_word: ሩምያል
  choice: Rumyal
  rationale: Segue diretamente a vocalização aparente do testemunho ge'ez, sem substituí-la pela forma mais conhecida “Ramiel”.
- source_word: ተአዛዜል
  choice: Te'azazel
  rationale: O apóstrofo sinaliza de modo simples a articulação interna perceptível na forma etíope e evita confundi-la com o nome anterior Azazel.
theological_decisions:
- issue: Normalização dos nomes angélicos conforme outras tradições enoquianas ou posteriores
  choice: Manter transliterações próximas do testemunho ge'ez
  alternative: Harmonizar, por exemplo, Daniyal com Daniel, Rumyal com Ramiel ou Kokabel com Kokabiel
  rationale: Nesta seção, preservada de modo efetivo em ge'ez, a harmonização ocultaria a incerteza textual e poderia criar identificações que o testemunho não exige.
- issue: Repetição de Turiel na lista
  choice: Preservar todas as ocorrências transmitidas
  alternative: Eliminar ou alterar ocorrências entendidas como erros de copista
  rationale: Sem apoio textual mais firme, uma emenda silenciosa resolveria indevidamente uma dificuldade real do texto transmitido.
translation_notes:
  register: Português moderno, claro e solene, com estrutura enumerativa formal. A duplicação introdutória do ge'ez foi mantida por ser significativa no estilo apocalíptico. Os nomes próprios permanecem deliberadamente próximos das formas etíopes, mesmo quando grafias mais familiares seriam possíveis.
