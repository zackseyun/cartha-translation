base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/018.yaml
  text: And by that oath the sea was created[a], and as its foundation for the time of wrath he set sand for it[c][b], and it does not pass beyond it from the creation of the world and forever.
translation:
  language: pt
  text: E por esse juramento o mar foi criado; e, como seu fundamento[b], para o tempo da ira[a], ele lhe estabeleceu areia[c]. O mar não ultrapassa esse limite desde a criação do mundo e para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “para o tempo da ira” é difícil no ge’ez e também pode ser entendida, de modo mais geral, como “para um tempo de juízo”.
    reason: lexical_alternative
  - marker: b
    text: “Fundamento” pode indicar a base ou a fronteira estável do mar; a imagem parece apresentar a areia como o limite que ele não pode atravessar.
    reason: lexical_alternative
  - marker: c
    text: Mais literalmente, “ele colocou areia para ele”.
    reason: literal_rendering
lexical_decisions:
- source_word: ማሐላ
  choice: juramento
  rationale: Neste contexto de elementos cósmicos estabelecidos por juramentos, “juramento” exprime melhor a função construtiva do termo do que a alternativa “maldição”.
- source_word: ተፈጥረት
  choice: foi criado
  rationale: Mantém a linguagem passiva de criação e sua força cosmológica.
- source_word: ባሕር
  choice: o mar
  rationale: O artigo definido é natural em português para o elemento cósmico específico em vista.
- source_word: መሠረታ
  choice: fundamento para ele
  rationale: Preserva o sentido concreto de fundamento ou base sem substituir diretamente a imagem pela interpretação “limite”; uma nota esclarece a provável função delimitadora.
- source_word: ለጊዜ መዓት
  choice: para o tempo da ira
  rationale: Conserva tanto o valor temporal quanto a ressonância apocalíptica de ira, sem excluir a possibilidade contextual de juízo.
- source_word: አንበረ ላቲ ኆፃ
  choice: ele lhe pôs areia
  rationale: Traduz o verbo de pôr ou estabelecer e mantém a areia como imagem concreta, em formulação idiomática e concisa.
- source_word: ወኢትኅልፍ
  choice: O mar não ultrapassa esse limite
  rationale: Explicita o sujeito em português e comunica a ideia de não transpor a fronteira indicada pela areia.
- source_word: እምፍጥረተ ዓለም ወእስከ ለዓለም
  choice: desde a criação do mundo e para sempre
  rationale: Exprime a duração contínua desde a criação até a eternidade em português corrente.
theological_decisions:
- issue: Se o limite do mar deve ser apresentado apenas como margem natural ou como fronteira cósmica imposta em contexto de ira ou juízo
  choice: Manter a areia, o fundamento e o tempo da ira no texto, com esclarecimentos em notas.
  alternative: Parafrasear como “ele fixou os limites naturais do mar” ou omitir a expressão obscura sobre a ira.
  rationale: O texto combina ordem criada, imagem física e linguagem apocalíptica. A tradução preserva essa tensão sem reduzi-la a uma descrição natural nem definir excessivamente a relação sintática entre seus elementos.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A pontuação divide a longa coordenação do ge’ez sem apagar sua progressão. “Ele lhe pôs areia” conserva a imagem concreta e evita uma paráfrase denominacional ou excessivamente interpretativa.
