base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/016.yaml
  text: And these are the hidden things of this oath [a]. . . and it is made firm by his oath, and heaven was suspended before the world was created[d][c][b], and by it forever.
translation:
  language: pt
  text: E estas são as coisas ocultas deste juramento[a]... e ele é firmado por seu juramento; o céu foi suspenso antes que o mundo fosse criado e permanece suspenso para sempre, por meio dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase inicial é textualmente difícil neste testemunho etíope. As reticências representam uma parte danificada ou de transmissão incerta depois de “deste juramento”. Também se pode traduzir “os segredos deste juramento”.
    reason: textual_variant
  - marker: b
    text: A frase final tem, de modo aproximado, o sentido de “e, para sempre, por meio dele”. A forma ge'ez pode ter valor instrumental ou locativo; o contexto favorece o sentido instrumental. O referente de “dele” provavelmente é o juramento, mas não é totalmente inequívoco.
    reason: alternative_reading
lexical_decisions:
- source_word: እሉንቱ እሙንቱ
  choice: estas são
  rationale: Mantém a construção demonstrativa e copulativa do ge'ez em português natural.
- source_word: ኅቡኣቲሁ ለዝ ማሐላ
  choice: as coisas ocultas deste juramento
  rationale: Preserva a ideia apocalíptica de realidades escondidas e liga o sufixo ao juramento sem reduzi-las a meras informações secretas.
- source_word: ፅኑዕ በመሐላሁ
  choice: ele é firmado por seu juramento
  rationale: Expressa a estabilidade resultante e o valor instrumental da preposição; o referente masculino permanece implícito, como no testemunho.
- source_word: ሰማይ ተሰቅለ
  choice: o céu foi suspenso
  rationale: Conserva a imagem cosmológica vívida de algo pendurado, em vez de generalizá-la como simples estabelecimento.
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: antes que o mundo fosse criado
  rationale: Representa naturalmente a anterioridade temporal; 'mundo' é a leitura contextual mais provável de ዓለም.
- source_word: ወእስከ ለዓለም ቦቱ
  choice: e, por meio dele, permanece assim para sempre
  rationale: Interpreta ቦቱ instrumentalmente, 'por meio dele', e explicita apenas o mínimo necessário para formar uma oração portuguesa, mantendo obscuro o referente do pronome.
theological_decisions:
- issue: Natureza das coisas ocultas ligadas ao juramento
  choice: coisas ocultas
  alternative: segredos ou palavras secretas do juramento
  rationale: A formulação mantém a concretude apocalíptica e não restringe o sentido a doutrinas ou fórmulas verbais.
- issue: Imagem cosmológica do céu
  choice: foi suspenso
  alternative: foi estabelecido ou fixado
  rationale: A tradução preserva a imagem visionária sugerida pelo verbo ge'ez, sem domesticá-la.
- issue: Agente ou meio que sustenta o céu para sempre
  choice: por meio dele, permanece assim para sempre
  alternative: e para sempre está nele
  rationale: A morfologia de ቦቱ favorece valor instrumental ou locativo. O contexto favorece o juramento como meio, mas a nota conserva a incerteza do referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com vocabulário de boa legibilidade brasileira. As reticências do testemunho foram preservadas; a sintaxe final recebeu explicitação mínima para ser inteligível sem ocultar a incerteza textual.
