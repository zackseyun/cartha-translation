base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/017.yaml
  text: And the earth was founded upon the waters[a], and from the hidden places of the mountains living waters come forth[e][d][c][b], from the creation of the world and forever.
translation:
  language: pt
  text: E a terra foi firmada sobre as águas, e dos lugares ocultos dos montes saem águas vivas[a], desde a criação do mundo e para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “águas vivas”; a expressão também pode sugerir águas frescas, correntes ou vivificantes.
    reason: lexical_alternative
  - marker: b
    text: A expressão temporal abrange o período desde a criação do mundo e se estende para sempre.
    reason: alternative_reading
lexical_decisions:
- source_word: ተሳረረት
  choice: foi firmada
  rationale: O verbo indica fundar, estabelecer ou assentar firmemente. “Foi firmada” preserva a forma passiva e a imagem cosmológica sem sugerir, indevidamente, que a terra foi rasgada.
- source_word: ዲበ ማይ
  choice: sobre as águas
  rationale: Reproduz de modo natural a relação espacial expressa pela preposição e conserva a imagem concreta do texto.
- source_word: ኅቡኣተ አድባር
  choice: dos lugares ocultos dos montes
  rationale: A expressão aponta para regiões ou recessos escondidos associados aos montes. “Lugares ocultos” mantém o caráter misterioso da cena.
- source_word: ኅሑያን ማያት
  choice: águas vivas
  rationale: Mantém de forma literal a expressão preservada no texto fornecido, sem restringi-la a “águas frescas”, “correntes” ou “vivificantes”.
- source_word: ይመፅኡ
  choice: saem
  rationale: O imperfeito ge'ez exprime ação presente ou contínua. “Saem” é natural em português e combina com a extensão temporal indicada no fim do versículo.
- source_word: እምፍጥረተ ዓለም
  choice: desde a criação do mundo
  rationale: “Desde” comunica com clareza o ponto inicial temporal e liga a ação contínua à origem do mundo.
- source_word: ወእስከ ለዓለም
  choice: e para sempre
  rationale: Expressa a duração indefinida da fórmula final em linguagem moderna, digna e corrente.
theological_decisions:
- issue: Imagem cosmológica da terra sobre as águas
  choice: Conservar literalmente a terra firmada sobre as águas.
  alternative: Interpretar a frase como metáfora da estabilidade da terra ou reformulá-la segundo uma cosmologia moderna.
  rationale: O texto apresenta uma imagem cosmológica concreta. A tradução deve preservá-la sem convertê-la em explicação científica ou metáfora teológica.
- issue: Sentido de “águas vivas”
  choice: Preservar a expressão sem definir se significa águas correntes, frescas ou vivificantes.
  alternative: Traduzir interpretativamente como “águas correntes”, “águas frescas” ou “águas que dão vida”.
  rationale: A formulação admite mais de uma nuance e pode ter força poética ou simbólica; especificá-la eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Empregou-se “montes” para manter o registro bíblico sem soar arcaico; “saem” evita o rebuscamento de “procedem” e representa a ação contínua do verbo.
