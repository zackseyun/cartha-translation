  source_fidelity: O texto reproduz adequadamente a relação instrumental de «por esse juramento», o cumprimento dos percursos pelo sol e pela lua e a negação temporal absoluta expressa pela construção final. «Jamais se desviam» representa bem o valor idiomático de እምዓለም com a negação e a construção de afastamento/desvio com እም.
