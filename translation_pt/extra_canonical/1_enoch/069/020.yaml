base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/020.yaml
  text: And by that oath the sun and the moon complete their courses[d][c][b][a], and they do not transgress their command forever.
translation:
  language: pt
  text: E por esse juramento, o sol e a lua completam seus percursos[a] e jamais se desviam da ordem que lhes foi dada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus circuitos”. O termo ge'ez se refere ao movimento regular dos corpos celestes.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “não transgridem sua ordem para sempre”. A expressão final, junto de um verbo negativo, pode ter o sentido idiomático de “jamais”.'
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ፡ ማሐላ
  choice: por esse juramento
  rationale: A preposição com o demonstrativo indica mais naturalmente meio ou instrumento, enquanto ማሐላ conserva a força solene e jurídica de “juramento”.
- source_word: ፀሐይ፡ ወወርኅ
  choice: o sol e a lua
  rationale: Mantém os dois corpos celestes como agentes definidos no quadro cósmico e personificado do texto.
- source_word: ይፌጽሙ፡ ምሕዋሮሙ
  choice: completam seus percursos
  rationale: O verbo exprime levar a termo, e o substantivo descreve o movimento regular dos astros; “percursos” é natural em português e não introduz precisão astronômica moderna.
- source_word: ወኢየሐልፉ፡ እምትእዛዞሙ
  choice: e jamais se desviam da ordem que lhes foi dada
  rationale: Com a preposição እም, o verbo expressa afastar-se ou desviar-se de algo. A formulação explicita que a ordem é imposta aos astros, evitando que “sua ordem” pareça uma ordem emitida por eles.
- source_word: እምዓለም
  choice: jamais
  rationale: Em combinação com o verbo negativo, a expressão funciona idiomaticamente como uma negação temporal absoluta, “jamais” ou “nunca”, em vez do pouco natural “desde a eternidade”.
theological_decisions:
- issue: Conservar ou neutralizar a linguagem jurídica da ordem cósmica
  choice: Conservar “juramento” e a ideia de não se desviar da ordem recebida
  alternative: Empregar linguagem puramente astronômica, como “seguem seus ciclos sem desvio”
  rationale: O texto apresenta a regularidade do sol e da lua em termos de juramento e submissão a uma ordem. A tradução preserva esse perfil apocalíptico sem identificar quem deu a ordem além do que a forma verbal exige.
- issue: Valor temporal de እምዓለም com o verbo negativo
  choice: jamais
  alternative: para sempre; desde a eternidade
  rationale: A leitura idiomática “jamais” integra a expressão à negação e evita impor uma afirmação metafísica sobre a eternidade passada, embora a noção de duração ilimitada permaneça possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Percursos” preserva a imagem cósmica sem anacronismo técnico; “jamais” dá fluência e representa a negação temporal absoluta. Os marcadores aparecem no texto em ordem alfabética.
