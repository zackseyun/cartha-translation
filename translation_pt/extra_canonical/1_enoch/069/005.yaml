  source_fidelity: A tradução preserva adequadamente a enumeração ordinal de ካልእ no contexto da lista, o nome Asbe’el, o ensino do conselho perverso, a formulação deliberadamente não harmonizada sobre os anjos, o desvio e a contaminação da carne com as filhas dos seres humanos. A nota a registra de forma apropriada a ambiguidade sintática do ge’ez.
  naturalness: A expressão “foi este que ensinou” é pouco idiomática em português moderno e introduz uma cópula desnecessária. “Este ensinou” transmite diretamente o demonstrativo enfático do original e soa natural. “A própria carne” esclarece que a carne contaminada é a dos referentes de “os”, sem alterar o sentido lexical.
  terminology: “Conselho perverso”, “filhos dos santos anjos”, “carne” e “filhas dos seres humanos” são escolhas defensáveis e consistentes com uma equivalência próxima. Não se deve substituir “anjos” por “Deus”, pois isso resolveria sem base segura a sintaxe difícil.
