base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/005.yaml
  text: And the second[a], whose name was Asbe'el—this one taught the evil counsel to the holy sons of God[c][b], and led them astray so that they defiled their bodies with the daughters of men.
translation:
  language: pt
  text: E o segundo, cujo nome era Asbe’el, este ensinou o conselho perverso aos filhos dos santos anjos[a] e os desviou, para que contaminassem a própria carne[b] com as filhas dos seres humanos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos santos filhos dos anjos”. A construção em ge’ez é sintaticamente difícil, e nesta passagem não há texto grego ou de Qumran que permita confirmar a relação exata entre as palavras.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “seus corpos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: o segundo
  rationale: 'Embora possa significar “outro”, o contexto imediato apresenta uma sequência enumerada: o primeiro, o terceiro e o quarto; por isso, aqui tem valor ordinal.'
- source_word: ስሙ አስብኤል
  choice: cujo nome era Asbe’el
  rationale: Reproduz de modo natural em português a fórmula de nomeação e translitera o nome próprio.
- source_word: ዝንቱ
  choice: foi este que
  rationale: Mantém a ênfase demonstrativa no personagem recém-nomeado sem produzir uma construção excessivamente rígida.
- source_word: አመርሙ
  choice: ensinou
  rationale: Expressa o sentido causativo e instrutivo de transmitir conhecimento ou orientação.
- source_word: ምክረ እኩየ
  choice: o conselho perverso
  rationale: “Conselho” preserva a ideia concreta de orientação corruptora; “perverso” é corrente, digno e moralmente preciso.
- source_word: ለደቂቀ መላእክት ቅዱሳን
  choice: aos filhos dos santos anjos
  rationale: Conserva todos os componentes lexicais e uma ligação sintática possível, sem substituir “anjos” por “Deus”. A ambiguidade da construção é registrada em nota.
- source_word: አስሐቶሙ
  choice: os desviou
  rationale: Abrange engano e desvio moral, adequando-se ao contexto da rebelião.
- source_word: ከመ ያማስኑ
  choice: para que contaminassem
  rationale: Preserva a possível nuance de finalidade ou resultado sem decidir além do que a construção permite.
- source_word: ሥጋሆሙ
  choice: sua carne
  rationale: Mantém a correspondência lexical direta e a imagem antropológica do texto; em português, “carne” continua inteligível no contexto.
- source_word: በአዋልደ ሰብእ
  choice: com as filhas dos seres humanos
  rationale: “Com” comunica a união sexual implícita; “seres humanos” representa o termo genérico sem restringi-lo ao sexo masculino.
theological_decisions:
- issue: Relação sintática em ለደቂቀ መላእክት ቅዱሳን
  choice: aos filhos dos santos anjos
  alternative: aos santos filhos dos anjos
  rationale: A construção ge’ez é difícil e não dispõe aqui de controle grego ou qumrânico. O texto principal adota uma análise possível, enquanto a nota preserva a alternativa, evitando a harmonização não lexical “filhos de Deus”.
- issue: Sentido de ሥጋ
  choice: carne
  alternative: corpos
  rationale: “Carne” é a tradução lexical mais transparente e preserva a imagem do original; “corpos” explicita melhor a referência física, mas reduz a correspondência verbal.
- issue: Valor de ከመ na oração final
  choice: para que
  alternative: de modo que
  rationale: A construção pode exprimir propósito ou resultado. “Para que” mantém a orientação intencional provável, sem excluir inteiramente o resultado dentro do contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A redação conserva a sequência ordinal, evita inserir “Deus” onde o ge’ez traz “anjos” e registra em nota a principal ambiguidade sintática.
