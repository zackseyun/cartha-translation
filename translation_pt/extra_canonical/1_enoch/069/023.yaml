base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/023.yaml
  text: And there are kept the sound of the thunder and the light of the lightning[a], and there are kept the storehouses of the hail and the storehouses of the hoarfrost, and the storehouses of the mist[b], and the storehouses of the rain and the dew.
translation:
  language: pt
  text: E ali se guardam a voz do trovão e a luz do relâmpago; e ali se guardam os depósitos do granizo, os depósitos da geada branca[a], os depósitos da névoa e os depósitos da chuva e do orvalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “geada”; possivelmente “gelo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: ali
  rationale: Advérbio locativo que retoma o lugar contemplado na visão; a repetição preserva a ênfase espacial do texto.
- source_word: ይትዓቀቡ / ይትዓቀብ
  choice: se guardam
  rationale: Mantém o sentido passivo-reflexivo de conservar ou armazenar sem definir em excesso o modo dessa guarda.
- source_word: ቃሉ ለነጐድጓድ
  choice: a voz do trovão
  rationale: ቃል pode significar palavra, voz ou som. 'Voz' preserva a imagem vívida e personificada do registro apocalíptico.
- source_word: ብርሃኑ ለመብረቅ
  choice: a luz do relâmpago
  rationale: Reproduz concretamente o paralelismo entre a voz do trovão e a luz do relâmpago.
- source_word: መዛግብተ
  choice: depósitos
  rationale: Expressa lugares concretos onde forças naturais ficam armazenadas, em linguagem corrente e digna; a repetição foi preservada.
- source_word: በረድ
  choice: granizo
  rationale: Equivalente meteorológico direto.
- source_word: አስሐትያ
  choice: geada branca
  rationale: A revisão lexical indica geada, geada branca ou gelo, e não névoa. 'Geada branca' distingue o termo da névoa seguinte sem impor 'gelo'.
- source_word: ጊሜ
  choice: névoa
  rationale: O termo designa névoa, nevoeiro ou nuvem; 'névoa' se ajusta à sequência atmosférica e à distinção em relação à geada.
- source_word: ዝናም
  choice: chuva
  rationale: Equivalente direto e usual.
- source_word: ጠል
  choice: orvalho
  rationale: Equivalente direto, preservando o último elemento da enumeração.
theological_decisions:
- issue: Preservação da cosmologia visionária dos depósitos celestes
  choice: Manter 'depósitos', 'voz do trovão' e 'luz do relâmpago' como imagens concretas
  alternative: Reformular em linguagem meteorológica moderna, como 'ali se produzem trovões e relâmpagos'
  rationale: O versículo descreve, em registro apocalíptico, reservas cósmicas das forças da criação. A tradução não deve desmitologizar nem achatar essa imagem.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O ponto e vírgula organiza as duas partes do versículo; a repetição de 'ali se guardam' e de 'depósitos' conserva a cadência enumerativa do ge'ez.
