base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/026.yaml
  text: And there was great joy among them[a], and they blessed and praised and exalted because the name of that Son of Man had been revealed to them.
translation:
  language: pt
  text: E houve grande alegria entre eles, e abençoaram, louvaram e exaltaram, porque lhes havia sido revelado o nome daquele Filho do Homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O título ge'ez traduzido como “Filho do Homem” é formalmente difícil. Uma tradução mais literal poderia ser “filho da humanidade” ou, com menor probabilidade, “filho dos viventes”; nas Parábolas, porém, a expressão funciona como um título exaltado reconhecido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮኖሙ
  choice: E houve ... entre eles
  rationale: A forma introduz uma situação resultante. Esta construção idiomática expressa o surgimento dessa condição entre eles sem sugerir mudança de identidade.
- source_word: ፍሥሐ፡ ዓቢይ
  choice: grande alegria
  rationale: A expressão denota alegria intensa e celebrativa; a formulação é clara, concisa e mantém o tom elevado.
- source_word: ባረኩ፡ ወሰቡ፡ ወአልዐሉ
  choice: bendisseram, louvaram e exaltaram
  rationale: Os três verbos são mantidos separadamente e na ordem da fonte, preservando a cadência litúrgica e sem explicitar um objeto que o texto não nomeia.
- source_word: በእንተ፡ ዘተከሥተ፡ ሎሙ
  choice: porque lhes havia sido revelado
  rationale: A oração indica o motivo da alegria e dos atos de louvor; a voz passiva conserva a ideia de revelação recebida.
- source_word: ስሙ
  choice: o nome
  rationale: O substantivo é definido pelo contexto e pela especificação genitiva seguinte. A opção preserva a ênfase na identidade ou autoridade revelada.
- source_word: ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው
  choice: daquele Filho do Homem
  rationale: Nas Parábolas, a expressão funciona como título reconhecido. “Filho do Homem” preserva o idioma apocalíptico consagrado, enquanto “daquele” representa o demonstrativo ውእቱ.
theological_decisions:
- issue: Tradução da expressão titular ወልደ እጓለ እመሕያው
  choice: daquele Filho do Homem
  alternative: daquele filho da humanidade; daquele filho dos viventes
  rationale: Embora a construção ge'ez seja formalmente difícil, nas Parábolas ela funciona como título da figura exaltada. A tradução mantém esse uso local sem acrescentar uma identificação doutrinária não explicitada no versículo.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência verbal foi preservada para manter a força litúrgica do original, e seu objeto permanece implícito, como no ge'ez.
