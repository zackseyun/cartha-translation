base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/008.yaml
  text: And the fourth—his name was Penemue—this one showed the children of men the bitter and the sweet[b][a], and he showed them all the secrets of their wisdom.
translation:
  language: pt
  text: E o quarto — seu nome era Penemue — mostrou aos filhos dos homens o amargo e o doce[a] e lhes mostrou todos os segredos da sabedoria deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a amargura e a doçura”. O par também pode ser entendido figuradamente como uma referência a conhecimentos de natureza diversa ou moralmente carregada; o texto ge'ez é conciso e não explica o contraste.
    reason: lexical_alternative
lexical_decisions:
- source_word: ራብዕ
  choice: o quarto
  rationale: Ordinal que introduz o próximo personagem de uma lista; o artigo é natural em português.
- source_word: ስሙ
  choice: seu nome era
  rationale: Fórmula de nomeação vertida no passado para se ajustar ao relato narrativo.
- source_word: ፔኔሙኤ
  choice: Penemue
  rationale: O nome próprio é transliterado, não traduzido.
- source_word: ዝንቱ አርአየ
  choice: mostrou
  rationale: O demonstrativo retoma enfaticamente o nomeado, mas sua tradução explícita seria pesada em português; o verbo conserva o sentido básico de mostrar ou dar a conhecer.
- source_word: ለውሉደ ሰብእ
  choice: aos filhos dos homens
  rationale: Preserva a expressão antropológica tradicional e o registro apocalíptico, sem reduzi-la simplesmente a 'seres humanos'.
- source_word: መሪረ ወመዓርፂረ
  choice: o amargo e o doce
  rationale: Os termos qualificativos funcionam substantivamente; a formulação mantém o contraste concreto e não o transforma em abstrações.
- source_word: ወአርአዮሙ
  choice: e lhes mostrou
  rationale: Repete o mesmo verbo da oração anterior, preservando a cadência e a ligação pronominal.
- source_word: ኵሎ ኅቡኣተ
  choice: todos os segredos
  rationale: Tradução idiomática do conjunto que denota a totalidade das coisas ocultas.
- source_word: ጥበቦሙ
  choice: da sabedoria deles
  rationale: Retém o sufixo pronominal plural e a acepção de sabedoria, deixando visível a relação sintática com os seres humanos.
theological_decisions:
- issue: Sentido do par መሪረ e መዓርፂረ
  choice: o amargo e o doce
  alternative: a amargura e a doçura; o mal e o bem
  rationale: A tradução conserva o contraste lexical e sua possível força figurada sem moralizá-lo explicitamente como 'mal e bem'.
- issue: Referência do sufixo em ጥበቦሙ
  choice: da sabedoria deles
  alternative: da sabedoria; da sua sabedoria
  rationale: O pronome explícito preserva a referência plural provável aos filhos dos homens e evita a ambiguidade referencial que 'sua' teria no português brasileiro.
translation_notes:
  register: Português moderno, digno e acessível, com leve elevação apocalíptica. A construção evita explicitar 'este' após Penemue por soar redundante, mas conserva a ênfase mediante os travessões. O marcador [a] aparece no texto principal.
