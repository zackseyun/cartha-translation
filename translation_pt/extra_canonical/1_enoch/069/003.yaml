base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/003.yaml
  text: And these are the chiefs of their angels[a], and their names, and the commanders of their hundreds, and the commanders of their fifties[c][b], and the commanders of their tens.
translation:
  language: pt
  text: E estes são os chefes dos anjos deles[a], e os nomes deles, e os comandantes das centenas deles, e os comandantes das cinquentenas deles[b], e os comandantes das dezenas deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O possessivo «deles» se repete ao longo do versículo no ge'ez. Seu referente exato é determinado pelo contexto ao redor.
    reason: lexical_alternative
  - marker: b
    text: 'O ge''ez apresenta uma hierarquia organizada em unidades numéricas: centenas, cinquentenas e dezenas. Provavelmente se trata de divisões ou companhias ordenadas, e não apenas de totais aritméticos.'
    reason: cultural_note
lexical_decisions:
- source_word: እሉ
  choice: estes
  rationale: Demonstrativo plural que introduz uma identificação ou lista imediata.
- source_word: አርእስተ
  choice: chefes
  rationale: Literalmente «cabeças»; «chefes» comunica de modo natural a posição de liderança.
- source_word: መላእክቲሆሙ
  choice: os anjos deles
  rationale: No contexto de 1 Enoque, o termo designa seres angélicos; mantém-se o possessivo, embora seu referente dependa do contexto.
- source_word: አስማቲሆሙ
  choice: os nomes deles
  rationale: Plural com possessivo, preservado porque o versículo introduz uma relação nominal.
- source_word: መኰንነ
  choice: comandantes
  rationale: A repetição ocorre numa sequência hierárquica de caráter militar ou administrativo; «comandantes» torna essa estrutura clara sem recorrer a terminologia eclesiástica posterior.
- source_word: ምእት
  choice: centenas
  rationale: Entendido como designação distributiva de unidades de cem.
- source_word: ኀምሳ
  choice: cinquentenas
  rationale: «Cinquentenas» expressa grupos ou unidades de cinquenta e mantém o paralelismo hierárquico.
- source_word: ዐሠርተ
  choice: dezenas
  rationale: Designação de unidades de dez, em paralelo com centenas e cinquentenas.
- source_word: ዚአሆሙ
  choice: deles
  rationale: O possessivo independente se repete após cada expressão de posto; a tradução mantém essa repetição e evita determinar seu referente.
theological_decisions:
- issue: Se a sequência de postos deve ser traduzida em linguagem explicitamente militar
  choice: comandantes das centenas deles ... das cinquentenas deles ... das dezenas deles
  alternative: chefes das centenas deles ... das cinquentenas deles ... das dezenas deles
  rationale: «Comandantes» preserva a cadeia formal de autoridade da imagem apocalíptica, sem importar uma hierarquia eclesiástica posterior.
- issue: Ligação sintática do possessivo repetido
  choice: das centenas deles ... das cinquentenas deles ... das dezenas deles
  alternative: os comandantes deles de centenas ... de cinquentenas ... de dezenas
  rationale: A formulação escolhida conserva de maneira inteligível a repetição do possessivo e a ambiguidade de seu referente. A alternativa pode refletir outra análise da ligação sintática, mas é menos natural em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Cinquentenas» é menos frequente no uso cotidiano, mas é preciso e preserva o paralelismo entre unidades hierárquicas. A coordenação repetitiva do original foi mantida.
