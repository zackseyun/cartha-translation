base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/021.yaml
  text: And by that oath the stars complete their courses[a], and their names are called[c][b], and they answer from age to age and forever.
translation:
  language: pt
  text: Por esse juramento, as estrelas completam seus percursos; seus nomes são chamados, e elas lhe respondem[a], de era em era e para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O ge''ez traz um objeto masculino singular: literalmente, “elas lhe respondem”. O referente não é nomeado neste versículo.'
    reason: grammatical_ambiguity
  - marker: b
    text: Literalmente, a expressão final emprega “era/mundo” numa fórmula de continuidade duradoura.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ፡
  choice: juramento
  rationale: Neste contexto, ማሐላ significa “juramento” e retoma o motivo central dos versículos anteriores; não designa o percurso das estrelas.
- source_word: ከዋክብት፡
  choice: estrelas
  rationale: É o equivalente direto e preserva a imagem cósmica concreta do texto apocalíptico.
- source_word: ይፌጽሙ፡ ምሕዋሪሆሙ፡
  choice: completam seus percursos
  rationale: A expressão descreve as estrelas levando a termo seu movimento ordenado. “Percursos” é natural em português e não impõe uma precisão astronômica estranha ao texto.
- source_word: አስማቲሆሙ፡ ይጼውዑ፡
  choice: seus nomes são chamados
  rationale: A formulação conserva a construção comprimida do ge'ez e evita introduzir um agente nominal que o verso não identifica expressamente.
- source_word: ያወሥእዎ፡
  choice: elas lhe respondem
  rationale: A forma verbal inclui um objeto masculino singular, expresso em português por “lhe”. O antecedente permanece implícito, como no texto transmitido.
- source_word: እምዓለም፡ ወእስከ፡ ለዓለም።
  choice: de era em era e para sempre
  rationale: A expressão idiomática comunica continuidade duradoura e mantém a cadência solene sem transformar cada ocorrência de ዓለም em uma afirmação metafísica técnica.
theological_decisions:
- issue: Se a ação das estrelas é puramente mecânica ou pessoalmente responsiva
  choice: Manter as estrelas como agentes que completam seus percursos e respondem quando seus nomes são chamados.
  alternative: Interpretar o verso como mera descrição astronômica ou identificar explicitamente anjos associados às estrelas.
  rationale: A linguagem apocalíptica apresenta uma ordem cósmica personificada. A tradução conserva essa tensão sem decidir se as estrelas são personificadas ou representam seres celestes.
- issue: Identidade daquele a quem as estrelas respondem
  choice: Representar o objeto masculino singular por “lhe”, sem nomear seu referente.
  alternative: Explicitar “ao Senhor” ou omitir inteiramente o objeto.
  rationale: O sufixo verbal favorece um referente masculino singular, mas este verso não o nomeia. “Lhe” preserva a informação gramatical sem acrescentar uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com preferência por “percursos” em vez de “circuitos”. A pontuação esclarece as orações sem eliminar a concisão e a personificação do original.
