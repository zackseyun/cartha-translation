  yaml_path: translation/extra_canonical/1_enoch/069/027.yaml
  text: And he sat upon the throne of his glory[a].
translation:
  language: pt
  text: E ele se assentou no trono da sua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode ter o sentido mais amplo de «estava» ou «permaneceu»; aqui é traduzido por «se assentou» porque se refere a um trono e a cena retrata uma entronização.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነበረ
  choice: se assentou
  rationale: Embora o verbo possa significar de modo mais amplo «estar», «permanecer» ou «habitar», com a preposição ዲበ e o substantivo መንበረ ele indica naturalmente estar sentado; «se assentou» preserva a imagem de entronização.
- source_word: ዲበ
  choice: 'no'
  rationale: Expressa posição sobre algo. Em português corrente, «no trono» é mais natural que «sobre o trono» e comunica a mesma relação espacial.
- source_word: መንበረ
  choice: trono
  rationale: O termo também pode designar um assento, mas o contexto visionário, régio e judicial favorece «trono».
- source_word: ስብሐቲሁ
  choice: da sua glória
  rationale: Traduz diretamente o substantivo relativo a glória ou esplendor com o sufixo possessivo, preservando a construção «trono da sua glória».
theological_decisions:
- issue: Entender a oração como simples localização ou como entronização
  choice: E ele se assentou no trono da sua glória.
  alternative: E ele estava no trono da sua glória; E ele permaneceu no trono da sua glória.
  rationale: A sintaxe permite o sentido mais amplo de estar ou permanecer, mas a referência ao trono favorece a postura sentada e a imagem de entronização, sem acrescentar uma identificação doutrinária do sujeito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «No trono» evita o tom artificial de «sobre o trono», enquanto «se assentou» mantém o registro solene e a nuance de entronização.
