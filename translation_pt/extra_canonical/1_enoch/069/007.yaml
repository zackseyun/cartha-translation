base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/007.yaml
  text: And from his hand they went out against those who dwell upon the dry ground[b][a], from that day and unto the age of ages.
translation:
  language: pt
  text: E da mão dele elas saíram contra os que habitam sobre a terra seca[a], desde aquele dia e pelos séculos dos séculos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que vivem na terra” ou “os que habitam na terra firme”. O ge’ez diz mais literalmente “os que habitam sobre a terra seca”.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምነ እዴሁ
  choice: da mão dele
  rationale: Preserva a imagem espacial e concreta do ge'ez, sem reduzir “mão” a uma abstração como “poder”.
- source_word: ወፅአ
  choice: elas saíram
  rationale: Embora a forma verbal seja singular, o antecedente contextual são as “armas de morte” do versículo anterior; o plural em português mantém essa cadeia anafórica e a concordância natural.
- source_word: ዲቤሆሙ
  choice: contra os
  rationale: No contexto hostil ou judicial, expressa ação dirigida contra os habitantes, em vez de simples posição sobre eles.
- source_word: ለእለ የኃድሩ ዲበ የብስ
  choice: os que habitam em terra seca
  rationale: Mantém a imagem concreta de habitar sobre a terra firme ou seca, sem generalizá-la silenciosamente para “terra” no sentido de mundo.
- source_word: እምይእቲ ዕለት
  choice: desde aquele dia
  rationale: Expressa de modo natural o início temporal de uma ação ou condição duradoura.
- source_word: እስከ ለዓለመ ዓለም
  choice: pelos séculos dos séculos
  rationale: Conserva a fórmula enfática baseada na repetição de “século/era”, em registro apocalíptico digno e reconhecível.
theological_decisions:
- issue: Se የብስ deve ser generalizado como “terra” ou mantido como “terra seca”
  choice: terra seca
  alternative: terra; terra firme
  rationale: A expressão concreta pode ter força cosmológica no discurso apocalíptico; por isso, a tradução evita apagá-la, enquanto a nota registra alternativas naturais.
- issue: Concordância do verbo singular ge'ez com o antecedente contextual plural
  choice: elas saíram
  alternative: isso saiu; ela saiu
  rationale: O antecedente no contexto são as “armas de morte”; o português exige concordância plural clara. A escolha é gramatical e contextual, não uma resolução doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Elas” retoma as armas de morte mencionadas no versículo anterior. A construção “pelos séculos dos séculos” preserva o tom apocalíptico e a estrutura enfática do original.
