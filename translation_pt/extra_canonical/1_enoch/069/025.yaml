base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/025.yaml
  text: And over them this oath became strong[a], and they are kept by it; and their paths are kept[c][b], and their courses do not perish.
translation:
  language: pt
  text: E sobre eles este juramento se tornou firme[a], e por meio dele são guardados; seus caminhos são guardados[b], e seus percursos não perecem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre eles este juramento se tornou firme”. A preposição também pode indicar a esfera em que o juramento vigora, embora “sobre eles” destaque melhor sua autoridade vinculante.'
    reason: lexical_alternative
  - marker: b
    text: O texto etíope desta linha é difícil. A conjunção e a repetição de “são guardados” aparecem como elementos textualmente incertos, mas podem indicar tanto que eles são guardados pelo juramento quanto que seus caminhos são mantidos sob ele.
    reason: textual_variant
  - marker: c
    text: 'Ou: “seus circuitos não falham”. Os termos podem descrever caminhos em sentido geral ou movimentos cósmicos ordenados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲቤሆሙ
  choice: sobre eles
  rationale: A preposição ዲበ expressa aqui a ideia de estar sobre alguém ou exercer alcance sobre ele. “Sobre eles” preserva a possível autoridade vinculante do juramento, sem excluir totalmente uma noção de esfera.
- source_word: ጸንዐ
  choice: se tornou firme
  rationale: O verbo comunica força, firmeza ou consolidação. “Tornou-se firme” é natural em português e evita restringir o sentido a uma fórmula exclusivamente jurídica.
- source_word: ዝማሐላ
  choice: este juramento
  rationale: O elemento demonstrativo ዝ é representado por “este”, e ማሐላ designa um juramento ou compromisso jurado.
- source_word: ይትዓቀቡ
  choice: são guardados
  rationale: A forma verbal imperfeita passiva/reflexiva indica ação contínua e pode envolver preservação, vigilância ou sujeição. “São guardados” mantém essa amplitude.
- source_word: ቦቱ
  choice: por meio dele
  rationale: Retoma o juramento e expressa seu papel instrumental. A formulação deixa claro o referente sem tornar a frase pesada.
- source_word: ፍናዊሆሙ
  choice: seus caminhos
  rationale: O termo significa caminhos, vias ou modos de percurso. “Caminhos” conserva a imagem concreta e a possível dimensão cósmica.
- source_word: ምሕዋራቲሆሙ
  choice: seus percursos
  rationale: O plural pode indicar movimentos ordenados, cursos ou circuitos. “Percursos” é compreensível e não impõe uma leitura exclusivamente astronômica.
- source_word: ኢይማስን
  choice: não perecem
  rationale: A forma negativa pode significar não perecer, não se corromper ou não falhar. “Não perecem” preserva o registro elevado e a ideia de continuidade.
theological_decisions:
- issue: Se o juramento impõe obediência, preserva seres ou sustenta a ordem cósmica
  choice: Manter simultaneamente a força vinculante do juramento, a guarda daqueles sob ele e a permanência de seus caminhos e percursos.
  alternative: Explicitar apenas que o juramento submete seres angelicais, ou apenas que estabiliza os movimentos cósmicos.
  rationale: A linguagem passiva de serem guardados pode sugerir proteção ou sujeição, enquanto “caminhos” e “percursos” aponta para movimento ordenado. O texto não exige que essas dimensões sejam separadas.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela que reflete o original. Emprega-se “são guardados” para preservar a ambiguidade entre proteção e sujeição, e “percursos” para manter aberta a possibilidade de referência cósmica sem impor terminologia astronômica.
