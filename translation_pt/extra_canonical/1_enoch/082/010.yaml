base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/010.yaml
  text: 'And these are the names of those who lead them: those who keep watch and go in at their appointed times, those who lead them in their stations and in their orders and in their times and in their months and in their authorities and in their positions.'
translation:
  language: pt
  text: 'E estes são os nomes dos que os conduzem: os que vigiam e entram nos tempos que lhes foram determinados, os que os conduzem em suas posições, em suas ordens, em seus tempos, em seus meses, em suas autoridades e em seus postos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርኅዎሙ
  choice: os conduzem
  rationale: Preserva o sentido de guiar ou dirigir e mantém o pronome plural do texto, sem especificar um referente que o versículo não nomeia.
- source_word: የዐቅቡ
  choice: vigiam
  rationale: Expressa de modo direto a ideia de guardar, observar ou manter vigilância.
- source_word: ይበውኡ
  choice: entram
  rationale: Mantém o sentido concreto de entrar, em vez de interpretar a ação como simples aparecimento ou início de serviço.
- source_word: በአዝማነ፡ ዚአሆሙ
  choice: nos tempos que lhes foram determinados
  rationale: Comunica que se trata dos períodos próprios ou designados para eles, de modo claro em português.
- source_word: በመካናቲሆሙ
  choice: em suas posições
  rationale: O termo designa lugares ou posições; 'posições' se ajusta ao contexto de ordem celeste sem excessiva concretização espacial.
- source_word: በሥርዓታቲሆሙ
  choice: em suas ordens
  rationale: Preserva a noção de disposições ou ordenações estabelecidas.
- source_word: በስልጣናቲሆሙ
  choice: em suas autoridades
  rationale: Mantém a linguagem de autoridade ou domínio do original, sem reduzi-la a uma função administrativa.
- source_word: በምቅዋማቲሆሙ
  choice: em seus postos
  rationale: Distingue o último termo da referência anterior a lugares ou posições e transmite a ideia de estações, postos ou lugares designados.
theological_decisions:
- issue: Referente dos pronomes plurais
  choice: Manter «os» e «suas» sem explicitar a que seres ou corpos se referem
  alternative: Acrescentar «astros», «luminares» ou «anjos»
  rationale: O versículo depende do contexto para o referente; explicitá-lo aqui resolveria uma ambiguidade que o texto preserva.
- issue: Natureza da ação descrita por «entram»
  choice: Conservar a imagem de entrada
  alternative: Traduzir como «aparecem», «iniciam seu serviço» ou «assumem suas funções»
  rationale: As alternativas são interpretações contextuais possíveis, mas o verbo-fonte expressa de forma mais imediata a ação de entrar.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura enumerativa próxima do ge'ez. A repetição de «os que os conduzem» foi mantida por sua função retórica e sintática. «Posições» e «postos» distinguem dois termos espaciais ou funcionais diferentes no original.
