base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/013.yaml
  text: 'And these are the names of the leaders who divide the four parts of the year[a], who are appointed: Milkiel, Helemmelek, Meleyal[b], and Narel.'
translation:
  language: pt
  text: 'E estes são os nomes dos líderes designados que dividem as quatro partes do ano[a]: Milkiel, Helemmelek, Meleyal[b] e Narel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as quatro divisões do ano»; a expressão ge'ez significa literalmente «as quatro partes do ano».
    reason: lexical_alternative
  - marker: b
    text: O segundo e o terceiro nomes são de leitura difícil neste testemunho; as transliterações seguem conservadoramente as formas ge'ez, sem reconstruir grafias mais conhecidas.
    reason: textual_variant
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: os nomes
  rationale: Na fórmula demonstrativa, o possessivo do ge'ez é expresso naturalmente em português por «os nomes dos líderes».
- source_word: መራሕያያን
  choice: líderes
  rationale: O termo deriva da ideia de conduzir ou guiar. «Líderes» preserva a função de autoridade sem definir essas figuras mais especificamente como anjos.
- source_word: ይፈልጡ
  choice: dividem
  rationale: O verbo indica separar ou dividir e, neste contexto, rege as quatro partes calendáricas do ano.
- source_word: ፬መክፈልተ ዓመት
  choice: as quatro partes do ano
  rationale: Tradução próxima da expressão ge'ez; «divisões» também é possível, enquanto «trimestres» seria mais interpretativo.
- source_word: ሥሩዓን
  choice: designados
  rationale: O particípio comunica que foram ordenados, estabelecidos ou incumbidos de uma função. «Designados» soa natural no contexto de oficiais cósmicos.
- source_word: ሚልኪኤል
  choice: Milkiel
  rationale: Transliteração conservadora do nome conforme a forma do testemunho ge'ez.
- source_word: ህልእምሜሌክ
  choice: Helemmelek
  rationale: Mantém de forma legível e conservadora a forma textual difícil, sem reconstruir silenciosamente outro nome.
- source_word: ሜሌአየል
  choice: Meleyal
  rationale: Transliteração conservadora da sequência ge'ez, cuja leitura exata é incerta no testemunho disponível.
- source_word: ናሬል
  choice: Narel
  rationale: Transliteração direta e legível do último nome.
theological_decisions:
- issue: Natureza das figuras nomeadas
  choice: líderes designados que administram divisões calendáricas
  alternative: marcadores astronômicos personificados ou chefes angélicos das estações
  rationale: «Líderes» conserva a imagem de oficiais celestes no Livro dos Luminares sem impor uma angelologia mais específica que o verso não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem foi ajustada para evitar a construção pouco natural «os líderes que dividem..., que são designados», sem alterar a relação sintática essencial. Os nomes próprios permanecem transliterados.
