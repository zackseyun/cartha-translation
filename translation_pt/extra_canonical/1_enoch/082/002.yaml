review_pass:
  verdict: revise
  source_fidelity: 'A tradução conserva os elementos essenciais do ge''ez: a sabedoria dada ao destinatário, aos seus filhos e à descendência futura (na leitura entre colchetes), com o propósito de ser passada às gerações seguintes. A opção “além da compreensão deles” acompanha a leitura interpretativa registrada na trilha inglesa para ዲበ ሕሊናሆሙ; a nota preserva uma alternativa mais literal.'
  naturalness: O texto é claro e de registro apropriado. Contudo, “por todas as gerações” pode soar como duração absoluta; “de geração em geração” exprime mais idiomaticamente a transmissão sucessiva indicada pelo plural “gerações”. A posição de “esta sabedoria” também fica mais fluente junto de “transmitam”.
  terminology: “Sabedoria” e “transmitam” são escolhas adequadas, sem restringir o conteúdo da sabedoria. “Compreensão” é natural para a faculdade mental expressa por ሕሊና.
  issues:
  - severity: low
    issue: Expressão temporal pouco idiomática
    rationale: “Por todas as gerações” é compreensível, mas “de geração em geração” comunica com maior naturalidade a sucessão geracional do texto.
  revised_text: Dei sabedoria a você[a], a seus filhos e aos que serão seus filhos, para que transmitam esta sabedoria, que está além da compreensão deles[b], a seus filhos, de geração em geração.
  revised_footnotes:
  - marker: a
    text: A expressão “e aos que serão seus filhos” aparece entre colchetes no testemunho etíope fornecido e pode se referir, de modo mais geral, aos futuros descendentes.
    reason: textual_variant
  - marker: b
    text: 'Ou: “esta sabedoria na mente deles”. A expressão etíope também pode ser traduzida mais literalmente como “sobre o pensamento deles”.'
    reason: lexical_alternative
