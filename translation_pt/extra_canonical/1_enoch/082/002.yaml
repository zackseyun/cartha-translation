base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/002.yaml
  text: Wisdom I have given to you[a], and to your children, and to those who shall be your children, so that they may give this wisdom, which is beyond their understanding[c][b], to their children throughout the generations.
translation:
  language: pt
  text: Dei sabedoria a você[a], a seus filhos e aos que serão seus filhos, para que transmitam esta sabedoria, que está além da compreensão deles[b], a seus filhos, de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “e aos que serão seus filhos” aparece entre colchetes no testemunho etíope fornecido e pode se referir, de modo mais geral, aos futuros descendentes.
    reason: textual_variant
  - marker: b
    text: 'Ou: “esta sabedoria na mente deles”. A expressão etíope também pode ser traduzida mais literalmente como “sobre o pensamento deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጥበበ
  choice: sabedoria
  rationale: O termo designa sabedoria ou entendimento; “sabedoria” preserva o caráter elevado e instrutivo da passagem sem restringi-la ao conhecimento astronômico.
- source_word: ወሀብኩ
  choice: Dei
  rationale: O perfeito ge'ez é expresso naturalmente pelo pretérito perfeito em português; a relevância presente da dádiva permanece clara pelo contexto.
- source_word: ወለውሉድከ
  choice: a seus filhos
  rationale: Traduz o plural de “filho/descendente” de modo amplo e corrente, enquanto a oração seguinte estende explicitamente a referência à descendência futura.
- source_word: '[ወለእለ፡ ይከውኑ፡ ለከ፡ ውሉደ፡]'
  choice: e aos que serão seus filhos
  rationale: Mantém relativamente de perto a formulação do testemunho ge'ez e preserva sua referência aos futuros filhos ou descendentes; a condição entre colchetes é registrada em nota.
- source_word: ከመ፡ የሀቡ፡
  choice: para que eles transmitam
  rationale: A construção exprime propósito. “Transmitam” comunica com naturalidade a entrega da sabedoria de uma geração à seguinte.
- source_word: ለትውልዳት
  choice: por todas as gerações
  rationale: Expressa a sucessão contínua de gerações em português claro e idiomático.
- source_word: ዲበ፡ ሕሊናሆሙ
  choice: além da compreensão deles
  rationale: Interpreta ዲበ no sentido de “acima de/além de” e ሕሊና como a faculdade de compreender. Como a expressão também pode ser entendida mais literalmente como “em/sobre a mente deles”, essa possibilidade é preservada em nota.
theological_decisions:
- issue: Natureza da sabedoria transmitida
  choice: Manter o termo amplo “sabedoria”
  alternative: Explicitar “instrução astronômica” ou tratar a expressão como inteligência prática geral
  rationale: O contexto do Livro dos Luminares pode particularizar o conteúdo como instrução calendárica e astronômica, mas o versículo emprega um termo mais amplo. A tradução não restringe aquilo que o texto deixa abrangente.
- issue: Relação da sabedoria com a compreensão humana
  choice: “que está além da compreensão deles”
  alternative: “que está na mente deles” ou “esta sabedoria sobre o pensamento deles”
  rationale: A combinação de ዲበ com ሕሊና pode indicar superioridade ou transcendência em relação ao entendimento. Como a sintaxe admite uma leitura mais literal ou locativa, a alternativa é apresentada em nota, sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para clareza, sem acrescentar a conjunção “E” no início. “Transmitam” torna explícita a passagem intergeracional implícita no verbo “dar”, e as ambiguidades textual e lexical relevantes foram mantidas em notas.
