base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/008.yaml
  text: And they have authority by night and by day in heaven[a], so that they may give light upon humankind—the sun and the moon and the stars and all the powers of heaven[b], which return in their courses.
translation:
  language: pt
  text: 'E ele tem autoridade, de noite e de dia, no céu, para que deem luz sobre a humanidade: o sol, a lua, as estrelas e todos os poderes do céu[a], que retornam em seus percursos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as autoridades do céu”. A expressão pode designar poderes ou forças celestes e não esclarece por si só se são seres pessoais.
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: ወስልጣነ፡ ቦቱ
  choice: E ele tem autoridade
  rationale: ቦቱ contém sufixo masculino singular e, neste contexto, a construção idiomática indica que a autoridade está nele ou lhe pertence; o referente contextual é Uriel. Isso evita a leitura plural gramaticalmente frágil.
- source_word: በሌሊት፡ ወበመዓልት
  choice: de noite e de dia
  rationale: Mantém o par temporal e sua cadência, em português corrente e digno.
- source_word: ውስተ፡ ሰማይ
  choice: no céu
  rationale: Preserva o âmbito cósmico-celestial do Livro Astronômico, em vez de restringi-lo ao céu meteorológico.
- source_word: ከመ፡ ያርኡ፡ ብርሃነ
  choice: para que deem luz
  rationale: A construção expressa finalidade; o plural do verbo se liga naturalmente aos luminares enumerados em seguida.
- source_word: ዲበ፡ ሰብእ
  choice: sobre a humanidade
  rationale: Conserva a referência coletiva aos seres humanos sob os luminares sem usar uma formulação marcada por gênero.
- source_word: ፀሐየ፡ ወወርኀ፡ ወከዋክብተ
  choice: o sol, a lua, as estrelas
  rationale: Apresenta de modo natural em português a enumeração dos luminares celestes.
- source_word: ኵሎሙ፡ ስልጣናት፡ ሰማይ
  choice: todos os poderes do céu
  rationale: Mantém o registro cósmico e deixa em aberto se são forças celestes, corpos celestes personificados ou autoridades pessoais.
- source_word: እለ፡ ይትመየጡ
  choice: que retornam
  rationale: O verbo sugere voltar ou tornar; no contexto astronômico, aponta para movimento recorrente sem impor uma teoria orbital moderna.
- source_word: በዓስቢሆሙ
  choice: em seus percursos
  rationale: Comunica cursos ou trajetos celestes recorrentes de maneira natural, sem tornar o termo mais tecnicamente circular do que o original exige.
theological_decisions:
- issue: Referente da autoridade no início do versículo
  choice: “ele tem autoridade”, referindo-se contextualmente a Uriel
  alternative: “eles têm autoridade”, referindo-se aos luminares
  rationale: O sufixo de ቦቱ é masculino singular, e o contexto anterior apresenta Uriel como aquele a quem foi confiado o comando. A tradução segue a gramática sem expandir a natureza dessa autoridade.
- issue: Natureza dos “poderes do céu”
  choice: Formulação ampla e não especificada
  alternative: “autoridades do céu”, entendidas explicitamente como seres angélicos
  rationale: O contexto enfatiza a ordem celeste, mas o verso não decide claramente entre agentes pessoais e forças ou operações cósmicas; “poderes” preserva essa tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção conserva o tom elevado e a sequência cósmica do ge'ez, mas usa pontuação atual para tornar claro que os luminares são o sujeito de “deem luz”.
