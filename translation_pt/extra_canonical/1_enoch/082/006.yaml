base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/006.yaml
  text: 'For they belong to the reckoning of the year[a], and they are truly fixed forever: one in the first gate, one in the third gate, one in the fourth, and one in the sixth[b]; and the year is completed in three hundred and sixty-four days.'
translation:
  language: pt
  text: 'Pois eles pertencem ao cômputo do ano[a] e estão verdadeiramente estabelecidos para sempre: um na primeira porta, um na terceira porta, um na quarta e um na sexta[b]; e o ano se completa em trezentos e sessenta e quatro dias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A repetição “um... um... um... um” se refere aos quatro dias adicionais distribuídos entre as quatro partes do ano solar no calendário enóquico de 364 dias.
    reason: cultural_note
  - marker: b
    text: Na linha de OCR do texto etíope, “porta” não se repete depois de “quarta” e “sexta”, mas a sequência indica claramente que o mesmo substantivo continua subentendido.
    reason: textual_variant
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Mantém a função explicativa ou causal da conjunção em português corrente e digno.
- source_word: ሀለዉ፡ በሐሳበ፡ ዓመት
  choice: eles pertencem ao cômputo do ano
  rationale: No contexto calendárico, expressa inclusão no cálculo anual, não mera existência; “cômputo” conserva o teor técnico.
- source_word: ወአማን፡ ልኩዓን፡ እሙንቱ፡ ለዓለም
  choice: e estão verdadeiramente estabelecidos para sempre
  rationale: Preserva a ênfase afirmativa, a ideia de disposição fixa e ordenada e sua permanência.
- source_word: አሐቲ
  choice: um
  rationale: A repetição distributiva é mantida e se refere aos quatro dias adicionais, sendo “dia” masculino em português.
- source_word: በቀዳሚት፡ ኆኅት ... በሣልስት፡ ኆኅት
  choice: no primeiro portal ... no terceiro portal
  rationale: “Portal” é natural na descrição cosmológica e mantém a localização sem impor uma ideia de movimento.
- source_word: በራብዕት ... በሳድስት
  choice: no quarto ... no sexto
  rationale: Conserva a elipse do substantivo presente na linha etíope transmitida, enquanto o contexto deixa claro que se trata dos portais.
- source_word: ወይትፌጸም፡ ዓመተ፡ መዋዕል
  choice: e o ano se completa
  rationale: Reproduz diretamente a conclusão do ciclo anual e a ênfase calendárica.
- source_word: ፫፻ወ፷ወረቡዕ
  choice: trezentos e sessenta e quatro dias
  rationale: Traduz explicitamente o total numérico do calendário enóquico.
theological_decisions:
- issue: Natureza da afirmação sobre a ordem dos luminares
  choice: Apresentar a disposição calendárica como estabelecida e permanente dentro da ordem cósmica revelada.
  alternative: Tratá-la apenas como observação astronômica provisória ou descrição neutra.
  rationale: Os termos enfáticos equivalentes a “verdadeiramente” e “para sempre”, juntamente com a conclusão do ano, atribuem estabilidade normativa à ordem descrita sem acrescentar uma doutrina externa.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. O tom é digno e levemente técnico; “cômputo” foi mantido por precisão calendárica. A repetição distributiva e a elipse do texto-fonte foram preservadas.
