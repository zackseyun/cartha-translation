base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/014.yaml
  text: And the names of those who lead them are Adnarel[a], Iyasusael, and Elomeel. These three follow after the leaders of the orders, and there are two that follow after the leaders of the orders, which follow after all the leaders of the fixed stations[c][b], who divide the four parts of the year.
translation:
  language: pt
  text: E os nomes dos que os conduzem são Adnarel, Iasusael e Elomeel. Esses três seguem os líderes das ordens; e há um que segue os três líderes das ordens, os quais seguem todos os líderes das posições fixas, que dividem as quatro partes do ano.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sintaxe das orações centrais é difícil, pois “seguem” se repete e há vários grupos de líderes. A tradução preserva essa sequência sem tentar definir por completo a hierarquia.
    reason: textual_ambiguity
  - marker: b
    text: A transcrição fornecida traz “dois” e, mais adiante, “setenta”, mas a edição crítica de Charles (1906) lê “um” e “três”; a tradução segue a leitura corrigida da edição.
    reason: source_correction
lexical_decisions:
- source_word: ይመርሃዎሙ
  choice: os conduzem
  rationale: Expressa direção ou liderança no movimento ordenado dos corpos celestes; “conduzem” é natural em português e mantém a ideia hierárquica.
- source_word: ይተልዉ
  choice: seguem
  rationale: Preserva a repetição do verbo e a sequência da procissão astronômica sem transformar a relação em uma hierarquia mais definida do que o texto permite.
- source_word: መራሕያነ
  choice: líderes
  rationale: Mantém o sentido de agentes que dirigem, apropriado ao contexto administrativo e cósmico.
- source_word: ሥርዓታት
  choice: ordens
  rationale: Designa disposições ou sistemas organizados; “ordens” conserva o caráter formal e cósmico do termo.
- source_word: ምቅዋማት
  choice: posições fixas
  rationale: Reflete lugares de permanência ou posições estabelecidas no contexto astronômico.
- source_word: ይፈልጡ
  choice: dividem
  rationale: Indica separação ou repartição e se ajusta diretamente às quatro partes do ano.
- source_word: አርባዕተ ክፍለ ለዓመት
  choice: as quatro partes do ano
  rationale: Tradução transparente da divisão calendárica, sem impor o termo técnico moderno “trimestres”.
theological_decisions:
- issue: Natureza dos seres nomeados
  choice: Os nomes são transliterados como nomes próprios de dirigentes celestes.
  alternative: Traduzir os nomes como epítetos ou emendar suas formas.
  rationale: O contexto apresenta indivíduos nomeados; a transliteração evita atribuir significados teológicos especulativos aos nomes.
- issue: Relação entre os grupos de líderes
  choice: A repetição de “seguem” e a cadeia de referentes são preservadas.
  alternative: Reformular a passagem como uma hierarquia celestial plenamente definida.
  rationale: A sintaxe etíope é difícil e não permite resolver com segurança todas as relações entre os grupos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A frase mantém deliberadamente a estrutura encadeada e algo obscura do ge’ez. Os nomes próprios são transliterados em formas simples, sem marcas eruditas.
