base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/005.yaml
  text: Because of them, people go astray and do not reckon them in the reckoning of all the world; for people err concerning them and do not know them exactly.
translation:
  language: pt
  text: Por causa deles, as pessoas se desviam e não os incluem no cálculo do mundo inteiro;[a] pois as pessoas erram a respeito deles e não os conhecem com precisão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge'ez é difícil. Também pode ser entendida como “no cômputo do mundo inteiro” ou, menos provavelmente neste contexto calendárico, “no pensamento do mundo inteiro”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois eles as desviam, e as pessoas não os conhecem com exatidão”. A palavra final também pode significar “cuidadosamente”.'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: በእንቲአሆሙ
  choice: Por causa deles
  rationale: Expressa naturalmente a relação causal ou de ocasião indicada pela preposição, sem explicitar o referente do pronome.
- source_word: ይጌግዩ
  choice: se desviam
  rationale: Preserva tanto a ideia de erro quanto a imagem de afastar-se do caminho correto.
- source_word: ኢየኀስብዎሙ
  choice: não os incluem no cálculo
  rationale: No contexto calendárico, o verbo indica contar ou computar; 'incluem no cálculo' é idiomático em português e mantém o objeto pronominal.
- source_word: ተበሐሳቤ ኵሉ ዓለም
  choice: no cálculo do mundo inteiro
  rationale: O substantivo ligado à raiz de calcular funciona tecnicamente no Livro Astronômico. A construção ge'ez é difícil, por isso a tradução principal conserva sua formulação ampla e uma nota registra a alternativa.
- source_word: ይጌግይዎሙ
  choice: erram a respeito deles
  rationale: A sintaxe e a tradição textual permitem incerteza entre erro acerca deles e uma leitura causativa; a principal segue a leitura contextual, e a alternativa é preservada em nota.
- source_word: ኢያእምርዎሙ
  choice: não os conhecem
  rationale: Mantém o sentido amplo do verbo de conhecer, sem estreitá-lo para reconhecer ou compreender.
- source_word: ጥንቁቀ
  choice: com precisão
  rationale: Comunica a ideia de conhecimento cuidadoso, exato ou preciso em linguagem portuguesa natural.
theological_decisions:
- issue: Referente dos pronomes plurais repetidos
  choice: Manter 'deles/os' sem identificar expressamente o referente
  alternative: Explicitar 'os luminares', 'os tempos estabelecidos' ou 'as divisões do calendário'
  rationale: O contexto aponta para os luminares celestes ou seus tempos e cursos estabelecidos, mas o versículo não nomeia o referente. Preservar os pronomes evita resolver uma ambiguidade genuína.
- issue: Agência na segunda ocorrência da raiz de errar
  choice: As pessoas erram a respeito deles
  alternative: Eles as desviam
  rationale: A forma pode admitir força causativa, mas a leitura contextual também pode expressar erro referente a eles. A alternativa é registrada sem impor uma interpretação teológica ou cosmológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Cálculo' preserva o teor técnico calendárico sem soar excessivamente arcaico; os pronomes mantêm a ambiguidade do original.
