base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/009.yaml
  text: And this is the order of the stars[a], those that set in their places, and in their times, and in their festivals[b], and in their months.
translation:
  language: pt
  text: E esta é a ordem das estrelas que se põem em seus lugares[a], em seus tempos, em suas festas[b] e em seus meses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em suas posições”; o ge'ez pode indicar os lugares designados no percurso ordenado das estrelas.
    reason: lexical_alternative
  - marker: b
    text: “Em suas festas” se refere aos tempos festivos do calendário, não a festas celebradas pelas próprias estrelas; o versículo relaciona a ordem celeste com a contagem dos tempos sagrados.
    reason: cultural_note
lexical_decisions:
- source_word: ሥርዓተ
  choice: ordem
  rationale: No Livro Astronômico, designa o padrão ordenado ou o arranjo estabelecido dos movimentos celestes; “ordem” preserva a ideia de estrutura e regularidade sem dar ao termo um tom excessivamente jurídico.
- source_word: ከዋክብት
  choice: estrelas
  rationale: É o referente direto do termo ge'ez; “corpos celestes” ampliaria indevidamente seu alcance e enfraqueceria a imagem astronômica concreta.
- source_word: የዐርቡ
  choice: se põem
  rationale: Neste contexto de luminares, o verbo indica mais naturalmente o ocaso das estrelas, isto é, sua descida ou entrada no horizonte; “se põem” é idiomático em português.
- source_word: በመካናቲሆሙ
  choice: em seus lugares
  rationale: O plural com sufixo pronominal aponta para lugares ou posições atribuídas. “Lugares” é claro e próximo do texto, enquanto “posições” explicita melhor o sentido astronômico e por isso é preservado em nota.
- source_word: በአዝማኒሆሙ
  choice: em seus tempos
  rationale: O termo pode indicar tempos ou períodos determinados. A tradução mantém a formulação simples e deixa implícita, sem eliminá-la, a noção de tempos estabelecidos.
- source_word: በበዓላቲሆሙ
  choice: em suas festas
  rationale: O substantivo costuma designar festas ou festivais. A escolha preserva a dimensão cultual e calendárica da passagem, sem transformar a expressão em mera referência genérica a períodos.
- source_word: በአውራኂሆሙ
  choice: em seus meses
  rationale: O termo significa “meses”. Não se acrescenta “lunares”, pois essa especificação não está explícita no versículo.
theological_decisions:
- issue: Se a linguagem calendárica deve ser vertida de modo puramente secular
  choice: Manter “festas” ao lado de “tempos” e “meses”
  alternative: Uniformizar os termos como “estações”, “épocas” ou “períodos”
  rationale: A passagem relaciona a ordem cósmica com a contagem de tempos sagrados. Preservar “festas” mantém visível essa dimensão cultual-calendárica, sem resolver além do texto a relação entre os astros e as celebrações.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do paralelismo do ge'ez. A repetição de “em seus/suas” foi mantida para refletir a estrutura cumulativa do original. O uso de “festas” é natural em português bíblico contemporâneo e conserva a nuance cultual sem recorrer a linguagem denominacional.
