base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/016.yaml
  text: 'And these are the signs of the days that appear on the earth in the days of his dominion: heat and warmth and calm[a]; and all the trees bear fruit, and leaves come forth on all the trees, and the harvest of wheat, and the blossom of the rose, and every flower that comes forth in the field[f][e][d][c][b]; but the trees of winter dry up.'
translation:
  language: pt
  text: 'E estes são os sinais dos dias que se manifestam[a] sobre a terra nos dias do seu domínio[b]: suor[f], calor e amenidade[c]. Todas as árvores dão fruto, folhas brotam em todas elas, chega a colheita do trigo, aparece a flor da rosa[d], e todas as flores brotam no campo[e]; mas as árvores do inverno secam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que são mostrados” ou “que se tornam visíveis sobre a terra”; o verbo ge’ez envolve a ideia de mostrar ou aparecer.'
    reason: lexical_alternative
  - marker: b
    text: “Seu domínio” provavelmente se refere ao período de governo do luminar tratado no contexto, mas o versículo não identifica expressamente o referente do pronome.
    reason: cross_reference
  - marker: c
    text: O termo traduzido por “amenidade” é incerto e pode indicar calma, brandura ou uma condição climática agradável.
    reason: lexical_alternative
  - marker: d
    text: “Rosa” é a identificação tradicional; o termo talvez designe de modo mais amplo uma planta florida.
    reason: lexical_alternative
  - marker: e
    text: O termo também pode significar região erma ou campo aberto; aqui, a imagem da vegetação favorece “campo”.
    reason: lexical_alternative
  - marker: f
    text: 'Ou: “calor”; o termo pode designar o calor da estação, embora também seja entendido concretamente como “suor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርተ
  choice: sinais
  rationale: Designa marcas ou indícios observáveis; “sinais” se ajusta ao contexto astronômico e calendárico.
- source_word: መዋዕለ
  choice: dias
  rationale: Preserva o sentido concreto do termo, embora no contexto possa abranger períodos ou estações.
- source_word: ያስተርእዩ
  choice: se manifestam
  rationale: Conserva a ideia de mostrar-se ou tornar-se visível sem impor uma voz passiva pouco natural em português.
- source_word: ስልጣኑ
  choice: seu domínio
  rationale: Mantém o pronome e o sentido de governo ou autoridade, sem identificar explicitamente seu referente.
- source_word: ሀፍ
  choice: suor
  rationale: O substantivo pode indicar concretamente o suor como sinal do período quente; a alternativa climática “calor” é registrada em nota por causa da incerteza lexical e da tradição de tradução.
- source_word: ሞቅ
  choice: calor
  rationale: Exprime calor ou aquecimento e permanece distinto do termo anterior.
- source_word: ዛሕን
  choice: amenidade
  rationale: O sentido exato é incerto; “amenidade” comunica uma condição climática branda ou agradável sem especificar vento ou temperatura.
- source_word: ይፈርዩ
  choice: dão fruto
  rationale: Equivalente português natural e concreto para a produção de fruto pelas árvores.
- source_word: ቈጽል ይወጽእ
  choice: folhas brotam
  rationale: Traduz de modo idiomático a saída ou aparecimento das folhas.
- source_word: ማእረረ ስርናይ
  choice: colheita do trigo
  rationale: Representa o produto ou estágio agrícola do trigo indicado pela expressão.
- source_word: ጽጌ ረዳ
  choice: floresce a rosa
  rationale: A identificação tradicional da planta é “rosa”; a formulação verbal produz uma sequência natural de sinais sazonais.
- source_word: ገዳም
  choice: campo
  rationale: Embora possa significar região erma ou campo aberto, a imagem de flores e vegetação favorece “campo” neste contexto.
- source_word: ዕፀወ ክረምት
  choice: árvores do inverno
  rationale: Preserva a expressão genitiva e sua possível categoria sazonal sem substituí-la por uma identificação botânica interpretativa.
theological_decisions:
- issue: Referente de “seu” em “nos dias do seu domínio”
  choice: Manter o pronome sem explicitar o referente.
  alternative: “nos dias do domínio do luminar” ou “do sol”
  rationale: O contexto mais amplo pode indicar o luminar em questão, mas o versículo não nomeia o referente; mantê-lo implícito preserva a ambiguidade textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência descritiva e vocabulário concreto. A pontuação divide a enumeração longa sem apagar seu paralelismo. As incertezas lexicais e o referente pronominal permanecem explícitos em notas.
