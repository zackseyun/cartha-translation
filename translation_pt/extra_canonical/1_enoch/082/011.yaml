base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/011.yaml
  text: And their four leaders enter first, those who divide the four parts of the year; and after them the twelve leaders of the orders, those who divide the months; and the three hundred and sixty-four heads of thousands, the ones who distinguish the days; and the four that are added with them, the leaders who distinguish the four divisions of the years.
translation:
  language: pt
  text: Seus quatro líderes entram primeiro, os que dividem as quatro partes do ano.[a] Depois deles, os doze líderes das ordens, os que dividem os meses; os trezentos e sessenta e quatro chefes de milhares,[b] os que distinguem os dias;[c] e os quatro que lhes são acrescentados, os líderes que distinguem as quatro divisões dos anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as quatro divisões do ano” ou “os quatro períodos do ano”. O ge''ez diz literalmente “quatro partes/divisões do ano”.'
    reason: lexical_alternative
  - marker: b
    text: O número 364 corresponde ao calendário esquemático de 364 dias usado no Livro Astronômico.
    reason: cultural_note
  - marker: c
    text: “Distinguem” também pode ser entendido como “marcam” ou “determinam” os dias.
    reason: lexical_alternative
lexical_decisions:
- source_word: መራሕያኒሆሙ / መራሕያን
  choice: líderes deles / líderes
  rationale: O termo deriva da ideia de conduzir ou guiar. “Líderes” preserva a hierarquia cósmico-administrativa e evita especificá-los como anjos sem que o versículo o faça.
- source_word: ይበውኡ ቀዳሚ
  choice: entram primeiro
  rationale: Mantém tanto o verbo de movimento quanto a sequência indicada no texto.
- source_word: ይሌልዩ
  choice: dividem
  rationale: No contexto do calendário, expressa com clareza a repartição do ano e dos meses.
- source_word: ፬ ክፍለ ዓመት
  choice: as quatro partes do ano
  rationale: Tradução próxima do sentido literal; não substitui a expressão pela interpretação mais específica “estações” ou “trimestres”.
- source_word: ዘሥርዓታት
  choice: das ordens
  rationale: Conserva a noção de arranjos ou sequências estabelecidas sem definir em excesso sua natureza.
- source_word: ፲፻ወ፷፬ አርእስት ፲፻
  choice: as trezentas e sessenta e quatro cabeças de milhares
  rationale: Preserva a metáfora literal “cabeças” e o elemento “milhares” presente no texto etíope transmitido.
- source_word: ይፈልጥዎሙ ለመዋዕል
  choice: distinguem os dias
  rationale: O verbo admite distinguir, marcar ou determinar; “distinguem” mantém sua amplitude sem resolver totalmente a função calendárica.
- source_word: ይትዌሰኩ ምስሌሆሙ
  choice: são acrescentados a eles
  rationale: Expressa o caráter suplementar desse grupo em relação aos anteriormente mencionados.
- source_word: ፬ መክፈልተ ዓመታት
  choice: as quatro divisões dos anos
  rationale: Mantém o plural “anos” do ge'ez e a linguagem recorrente de divisão calendárica.
theological_decisions:
- issue: Natureza dos personagens celestes
  choice: Designá-los como “líderes” e “cabeças”, sem chamá-los explicitamente de anjos.
  alternative: Identificá-los como anjos ou tratá-los como meras abstrações calendáricas.
  rationale: O versículo apresenta agentes de uma ordem cósmica, mas não define explicitamente sua ontologia; a tradução conserva essa tensão.
- issue: Relação sintática do último grupo com os líderes
  choice: “os quatro que são acrescentados a eles, os líderes que distinguem as quatro divisões dos anos”
  alternative: “os que distinguem os líderes das quatro divisões do ano”
  rationale: A leitura adotada segue a segmentação refletida pela evidência de consulta e conserva explicitamente መራሕያን, embora a cadeia sintática do ge'ez permita dificuldade interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A pontuação organiza a longa enumeração sem apagar seu paralelismo. Mantiveram-se os termos administrativos e a estranheza própria da cosmologia calendárica do texto.
