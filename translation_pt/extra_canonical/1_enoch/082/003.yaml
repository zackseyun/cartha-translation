base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/003.yaml
  text: And those who understand shall not sleep[a], but shall listen with their ears so as to learn this wisdom[d][c][b]; and it will be sweeter to them than good food is to those who eat.
translation:
  language: pt
  text: E os que entendem não dormirão, mas terão sede de ouvir[a], a fim de aprender esta sabedoria; e ela lhes será mais agradável do que a boa comida é agradável aos que comem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “terão sede com seus ouvidos”. A expressão indica desejo intenso de ouvir e aprender.
    reason: lexical_alternative
  - marker: b
    text: 'O sentido também pode ser expresso assim: “ela lhes agradará mais do que a boa comida agrada aos que comem”.'
    reason: translation_clarity
lexical_decisions:
- source_word: ኢይነውሙ
  choice: não dormirão
  rationale: Preserva o sentido comum de dormir e sua força metafórica de desatenção, sem substituir a imagem por uma paráfrase.
- source_word: እለ ይሌብዉ
  choice: os que entendem
  rationale: Mantém a ênfase cognitiva da expressão e soa claro em português moderno.
- source_word: ይጸምኡ በእዝናሆሙ
  choice: terão sede de ouvir
  rationale: O verbo está ligado a 'ter sede', e a expressão com os ouvidos descreve desejo intenso e atenção receptiva. A formulação portuguesa conserva tanto a metáfora quanto o sentido idiomático.
- source_word: ከመ ይትመሀርዋ
  choice: a fim de aprender
  rationale: Expressa naturalmente a finalidade do ouvir atento.
- source_word: ለዛ ጥበብ
  choice: esta sabedoria
  rationale: Conserva a força demonstrativa que remete ao ensinamento apresentado.
- source_word: ትደልዎሙ
  choice: ela lhes será mais agradável
  rationale: O verbo indica ser agradável, aprazível ou apropriado; 'mais agradável' preserva a comparação sem introduzir lexicalmente o sentido de doçura.
- source_word: እመበልዕት ሠናያት
  choice: do que boa comida
  rationale: Tradução concreta e idiomática da referência a coisas boas para comer.
- source_word: ለእለ ይበልዑ
  choice: para os que comem
  rationale: 'Mantém o paralelismo: a sabedoria agrada aos entendidos assim como a boa comida agrada aos que comem, sem fazer da sabedoria o objeto gramatical de ''comem''.'
theological_decisions:
- issue: Força metafórica das imagens de sono, sede e audição
  choice: Manter 'não dormirão' e 'terão sede de ouvir' como figuras de recepção atenta da sabedoria revelada.
  alternative: Parafrasear como 'permanecerão atentos e escutarão com cuidado'.
  rationale: As imagens corporais pertencem ao caráter sapiencial e apocalíptico do texto e devem ser preservadas em vez de reduzidas a uma exortação genérica.
- issue: Comparação entre sabedoria e alimento
  choice: Apresentar a sabedoria como mais agradável aos entendidos do que a boa comida é aos que comem.
  alternative: Dizer que a sabedoria será 'mais doce' ou que os entendidos a comem figuradamente.
  rationale: A construção conserva o paralelismo sintático e não transforma a metáfora em identificação além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. As imagens de dormir, ter sede e comer foram preservadas, enquanto a sintaxe da comparação final foi explicitada sem eliminar seu paralelismo.
