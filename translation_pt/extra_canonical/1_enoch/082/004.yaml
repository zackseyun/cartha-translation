base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/004.yaml
  text: Blessed are all the righteous who walk in the path of righteousness and have no sin like sinners[a], in the whole count of all their days, while the sun goes on its course in heaven, entering and going out through the gates for thirty days, together with the heads of the thousands of the order of the stars, and with the four that are added, which divide the four parts of the year[c][b], which lead them and enter with them on four days.
translation:
  language: pt
  text: Bem-aventurados todos os justos que andam no caminho da justiça e não têm pecado como os pecadores, durante toda a contagem de todos os seus dias, enquanto o sol segue seu curso no céu, entrando e saindo pelos portões durante trinta dias, juntamente com os chefes dos milhares da ordem das estrelas[a] e com os quatro que são acrescentados[b], os quais dividem as quatro partes do ano, os conduzem e entram com eles em quatro dias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os chefes dos milhares pertencentes à ordem das estrelas”. A expressão ge''ez é numérica e sintaticamente difícil; a tradução mantém visível sua imagem hierárquica.'
    reason: lexical_alternative
  - marker: b
    text: A transcrição etíope neste ponto parece apresentar um numeral equivalente a “dez”, que não se ajusta bem ao contexto. A referência às quatro partes do ano favorece a leitura tradicional de quatro elementos — provavelmente quatro dias — acrescentados.
    reason: textual_variant
  - marker: c
    text: Os referentes de “os” e “eles” na oração final são incertos; podem estar relacionados aos chefes, às estrelas ou aos quatro elementos acrescentados. A tradução preserva essa ambiguidade.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ብፁዓን
  choice: Bem-aventurados
  rationale: Preserva a forma elevada de uma bem-aventurança e sua ressonância bíblica, sem reduzir o sentido a mera felicidade.
- source_word: ጻድቃን
  choice: os justos
  rationale: Emprega a formulação bíblica corrente em português para o termo ético e teológico.
- source_word: የሐውሩ / የኀውር
  choice: andam / segue seu curso
  rationale: Mantém para as pessoas a metáfora moral de andar e, para o sol, expressa naturalmente o movimento celeste, conservando a correspondência entre os dois movimentos.
- source_word: በፍኖተ ጽድቅ
  choice: no caminho da justiça
  rationale: Preserva de modo claro e idiomático a metáfora do caminho moral.
- source_word: አልቦሙ ኃጢአት ከመ ኃጥኣን
  choice: não têm pecado como os pecadores
  rationale: Conserva tanto a força da afirmação quanto a comparação explícita, sem decidir se ela indica impecabilidade absoluta ou contraste de conduta.
- source_word: በኍልቈ ኵሉ መዋዕሊሆሙ
  choice: durante toda a contagem de todos os seus dias
  rationale: Retém a linguagem de enumeração própria do contexto calendárico, embora a repetição seja incomum em português.
- source_word: ለዘ የኀውር ፀሐይ በሰማይ
  choice: enquanto o sol segue seu curso no céu
  rationale: Expressa o movimento contínuo do sol e preserva uma correspondência discreta com o caminho dos justos.
- source_word: በአናቅጽ ይበውእ ወይወጽእ
  choice: entrando e saindo pelos portões
  rationale: Mantém a imagem cosmológica dos portões usada nesta seção.
- source_word: አርእስተ ፲፻ዘሥርዓቶሙ ለከዋክብት
  choice: os chefes dos milhares da ordem das estrelas
  rationale: Preserva a imagem hierárquica de chefes de milhares e o singular 'ordem', apesar da sintaxe difícil.
- source_word: ምስለ ፲ እለ ይትዌሰኩ
  choice: com os quatro que são acrescentados
  rationale: O numeral transmitido na transcrição é problemático, mas o contexto imediato das quatro divisões do ano favorece os quatro dias adicionais; a dificuldade é explicitada em nota.
- source_word: አርባዕተ መዋዕለ
  choice: em quatro dias
  rationale: Traduz diretamente a expressão temporal final sem explicar além do que o texto permite.
theological_decisions:
- issue: Se o versículo afirma impecabilidade absoluta dos justos
  choice: Manter a formulação forte 'não têm pecado como os pecadores'.
  alternative: Explicitar que os justos apenas não vivem habitualmente em pecado, ou afirmar impecabilidade completa.
  rationale: O ge'ez apresenta uma declaração forte, mas inclui uma comparação com os pecadores. A tradução conserva essa tensão sem importar uma solução doutrinária posterior.
- issue: Identidade das unidades calendáricas acrescentadas
  choice: Entendê-las como quatro elementos ou dias adicionais ligados às quatro partes do ano.
  alternative: Ler literalmente o numeral aparentemente equivalente a dez na transcrição ou entendê-los como dirigentes estelares adicionais.
  rationale: A menção imediata às quatro partes do ano e o contexto calendárico favorecem quatro dias intercalares, mas a instabilidade textual é informada em nota.
- issue: Referentes dos pronomes na oração final
  choice: Conservar os pronomes plurais sem identificar de maneira explícita seus referentes.
  alternative: Substituí-los por 'as estrelas', 'os chefes' ou 'os quatro dias'.
  rationale: A sintaxe da passagem não permite determinar com segurança todos os referentes; explicitá-los resolveria uma ambiguidade genuína do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantiveram-se deliberadamente a longa estrutura do período, a linguagem de contagem e a terminologia cosmológica, pois pertencem ao caráter técnico do Livro Astronômico; notas esclarecem as dificuldades sem alisar o texto.
