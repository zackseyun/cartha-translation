base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/018.yaml
  text: The second leader after him is Helemmelek[c][b][a], whose name they call the Sun.
translation:
  language: pt
  text: O segundo líder depois dele é Helemmelek[b], a quem eles chamam de Sol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «cujo nome eles chamam de Sol». A formulação do texto traduz o verbo ativo plural de modo mais natural em português.
    reason: lexical_alternative
  - marker: b
    text: O nome Helemmelek é transliterado do ge'ez; sua vocalização exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: o segundo
  rationale: O uso enumerativo apresenta o próximo líder de uma sequência; «o segundo» expressa isso com mais precisão do que «outro».
- source_word: መራሒ
  choice: líder
  rationale: O termo designa aquele que conduz ou governa um curso celeste; «líder» conserva esse sentido sem especificar indevidamente uma hierarquia.
- source_word: ዘድኅሬሁ
  choice: depois dele
  rationale: A expressão indica sucessão na lista ordenada e soa natural em português.
- source_word: ሄልእምሜሌክ
  choice: Helemmelek
  rationale: O nome próprio é transliterado, em coerência com sua ocorrência anterior; a vocalização exata do ge'ez permanece incerta.
- source_word: ዘይጼውዕዎ ስሞ
  choice: cujo nome eles chamam
  rationale: A formulação mantém tanto o sujeito plural implícito do verbo ativo («eles») quanto a menção explícita de «nome», ainda que produza uma fórmula de nomeação menos comum em português.
- source_word: ፀሐየ
  choice: Sol
  rationale: No catálogo da ordem celeste, o termo funciona como designação do astro; a inicial maiúscula preserva essa força denominativa sem impor personificação.
theological_decisions:
- issue: Se a designação final deve ser tratada como substantivo comum ou como nome formal de um astro
  choice: Sol
  alternative: sol; o sol
  rationale: O contexto cataloga líderes e luminares numa ordem cósmica estruturada. A maiúscula indica o astro nomeado, sem introduzir uma personificação teológica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe deliberadamente próxima da fórmula de nomeação do ge'ez. Mantém-se «eles» sem referente explícito porque o original também emprega uma forma verbal plural não especificada.
