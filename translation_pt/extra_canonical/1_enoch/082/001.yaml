base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/001.yaml
  text: And now[a], my son Methuselah, I tell you all these things, and I write them down for you, and I have revealed them all to you, and I have given you their books concerning all these things. Keep, my son, the book from the hand of your father[c][b], so that you may give it to the generations of the world.
translation:
  language: pt
  text: E agora, meu filho Matusalém, eu lhe conto todas estas coisas e as escrevo para você. Revelei todas elas a você e lhe dei os livros delas, referentes a todas estas coisas. Guarde, meu filho, o livro vindo da mão de seu pai[a], para que você o entregue[c] às gerações do mundo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o livro da mão de seu pai”; a expressão pode indicar um livro escrito pelo pai ou recebido diretamente de suas mãos.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “a todas as gerações para sempre” ou “às gerações da eternidade”.
    reason: lexical_alternative
  - marker: c
    text: Uma tradução alternativa é “e entregue-o”.
    reason: previous_rendering
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Preserva a fórmula de transição discursiva e o tom direto da exortação.
- source_word: ወልድየ፡ ማቱሳላ
  choice: meu filho Matusalém
  rationale: Mantém o vocativo paterno e emprega a forma portuguesa tradicional e reconhecível do nome.
- source_word: ኵሎሙ፡ እሉንተ
  choice: todas estas coisas
  rationale: Expressa naturalmente a totalidade dos assuntos anteriormente revelados.
- source_word: ለከ፡ እነግር
  choice: eu lhe conto
  rationale: Verbo corrente e claro para a comunicação direta do pai ao filho, sem elevar indevidamente o registro.
- source_word: ወእጽሕፍ፡ ለከ
  choice: e as escrevo para você
  rationale: O pronome retoma as coisas mencionadas e explicita de modo idiomático que elas são registradas por escrito.
- source_word: ወኵሎሙ፡ ከሠትኩ፡ ለከ
  choice: Revelei todas elas a você
  rationale: Conserva o sentido de descobrir ou tornar conhecido, apropriado ao contexto de revelação.
- source_word: ወወሀብኩከ፡ መጻሕፍቲሆሙ፡ ለእሉ፡ ኵሎሙ
  choice: e lhe dei os livros que tratam de todas elas
  rationale: A expressão ge'ez é compacta; esta formulação comunica a relação entre os livros e os assuntos revelados sem reproduzir um possessivo obscuro em português.
- source_word: ዕቀብ
  choice: Guarde
  rationale: Abrange tanto conservar consigo quanto preservar cuidadosamente o escrito.
- source_word: መጽሐፈ፡ እዴሁ፡ ለአቡከ
  choice: o livro vindo da mão de seu pai
  rationale: Preserva a imagem da mão paterna e a possível ideia de autoria ou transmissão direta, sem decidir entre elas.
- source_word: ወከመ፡ ትሀብ
  choice: para que você o entregue
  rationale: ከመ seguido do subjuntivo introduz uma oração de finalidade; a preservação do livro visa sua transmissão.
- source_word: ለትውለ፡ ዓለም
  choice: às gerações do mundo
  rationale: Mantém a linguagem de mundo/era e a amplitude temporal da expressão, sem reduzi-la simplesmente a 'para sempre'.
theological_decisions:
- issue: Alcance da transmissão em ለትውልደ፡ ዓለም
  choice: às gerações do mundo
  alternative: a todas as gerações para sempre; às gerações da eternidade
  rationale: A expressão pode apontar para as gerações do mundo ou para gerações duradouras ao longo dos tempos. A tradução conserva essa amplitude sem impor uma interpretação exclusivamente espacial ou temporal.
- issue: Relação entre guardar e transmitir o livro
  choice: para que você o entregue
  alternative: e entregue-o
  rationale: A construção com ከመ e subjuntivo indica finalidade, fazendo da transmissão o propósito da preservação, embora uma coordenação seja registrada como alternativa tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A repetição de “todas” foi mantida por refletir a ênfase do original; a pontuação divide o longo período ge'ez para melhorar a leitura sem alterar sua progressão.
