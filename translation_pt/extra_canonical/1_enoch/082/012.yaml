base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/012.yaml
  text: 'And these are the heads of a thousand: between leader and leader[a], six are added after the station[e][d][c][b]; and their leaders make the distinction.'
translation:
  language: pt
  text: 'E estes são os chefes de mil[a]: entre um líder e outro[b], seis são acrescentados depois da posição fixa[c]; e os líderes deles fazem a distinção[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cabeças de mil”. A expressão também pode ser entendida como “líderes de mil”.
    reason: lexical_alternative
  - marker: b
    text: A redação deste versículo é textual e sintaticamente difícil no testemunho etíope. Ela parece descrever divisões técnicas do esquema dos luminares, talvez unidades suplementares inseridas depois de uma posição determinada.
    reason: textual_variant
  - marker: c
    text: Ou “depois da estação” ou “depois do lugar de parada”.
    reason: lexical_alternative
  - marker: d
    text: Ou “os guias deles os separam” ou “os líderes deles os discernem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙንቱ
  choice: estes
  rationale: Demonstrativo plural que introduz os elementos em questão no contexto imediato.
- source_word: አርእስት፡ ፲፻
  choice: chefes de mil
  rationale: A expressão corresponde ao título administrativo ou militar semítico para responsáveis por grupos de mil. “Chefes” comunica a função natural e claramente em português, enquanto a nota preserva o literal “cabeças”.
- source_word: ማእከለ፡ መራኂ፡ ወመራኂ
  choice: entre um líder e outro
  rationale: A construção com o substantivo repetido e ligado por conjunção é idiomática e indica o intervalo entre um líder e outro.
- source_word: ይትዌሰኩ፡ ፮
  choice: seis são acrescentados
  rationale: Preserva o sentido passivo de adição sem identificar de forma especulativa o que constitui essas seis unidades.
- source_word: በድኅረ፡ ምቅዋም
  choice: depois da posição fixa
  rationale: O substantivo denota lugar de parada, posição ou estação. “Posição fixa” conserva a imagem concreta e se ajusta ao esquema astronômico.
- source_word: መራሕያኒሆሙ
  choice: os líderes deles
  rationale: Mantém a ligação lexical com o vocabulário anterior de condução e liderança sem especificar referentes não expressos.
- source_word: ይፈልጡ
  choice: fazem a distinção
  rationale: O verbo pode significar separar, distinguir ou discernir. A formulação escolhida preserva a linguagem técnica e a possível função de demarcação.
theological_decisions:
- issue: Se o versículo deve ser explicitado como uma explicação calendárica
  choice: Manter a formulação técnica e parcialmente obscura sobre chefes, líderes, adição e distinção.
  alternative: Parafrasear o texto como referência explícita a dias intercalados ou a divisões do ano.
  rationale: A sintaxe etíope é difícil e o versículo não identifica expressamente as seis unidades. Uma paráfrase calendárica resolveria uma ambiguidade que o testemunho textual preserva.
translation_notes:
  register: Português atual, digno e de leitura ampla, com terminologia deliberadamente técnica. A tradução evita suavizar a opacidade do original e não identifica por conjectura os referentes de “seis” ou de “deles”.
