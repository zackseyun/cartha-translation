base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/007.yaml
  text: And the matter is true[a], and the reckoning is exact; for Uriel showed me the luminaries, and the paths, and the appointed times, and the years, and the days, and breathed on me—Uriel[f][e][d][c][b], to whom the Lord of all creation of the world gave command concerning the host of heaven.
translation:
  language: pt
  text: E o relato é verdadeiro[a], e o cálculo estabelecido é exato; pois Uriel me mostrou os luminares, os meses[b], as festas[c], os anos[d] e os dias, e soprou sobre mim — Uriel, a quem o Senhor de toda a criação do mundo deu ordem a respeito do exército do céu[e].[f]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “o assunto é verdadeiro”.'
    reason: lexical_alternative
  - marker: b
    text: O termo ge'ez significa “meses”. Algumas traduções anteriores o entenderam como “caminhos” ou “cursos”, em referência aos trajetos dos luminares.
    reason: previous_rendering
  - marker: c
    text: Ou “os tempos determinados”. O termo pode designar festas ou festividades fixadas pelo calendário.
    reason: lexical_alternative
  - marker: d
    text: O termo também pode ser entendido como “estações” ou divisões sazonais do ano.
    reason: textual_variant
  - marker: e
    text: “Exército do céu” pode designar o conjunto celestial ordenado, incluindo os corpos celestes tratados nesta seção, sem necessariamente se limitar a eles.
    reason: cultural_note
  - marker: f
    text: 'A sintaxe da primeira parte também admite: “E este é o relato e o cálculo exato dos luminares, dos meses, das festas, dos anos e dos dias, conforme Uriel me mostrou”. Essa leitura, porém, torna menos explícita a conjunção causal “pois”.'
    reason: previous_rendering
lexical_decisions:
- source_word: አማን ነገሩ
  choice: o relato é verdadeiro
  rationale: አማን funciona aqui como predicado, “verdadeiro”, enquanto ነገሩ designa o relato ou assunto apresentado; a formulação conserva a afirmação solene do texto.
- source_word: ጥንቁቅ ሐሳቡ ዘልኩዕ
  choice: seu cálculo determinado é exato
  rationale: A expressão combina a ideia de cálculo cuidadoso ou exato com algo fixado ou determinado. “Cálculo” corresponde ao contexto calendárico, sem reduzir a frase a mero pensamento.
- source_word: ብርሃናት
  choice: luminares
  rationale: Designa as luzes ou corpos celestes ordenados; “luminares” mantém o registro astronômico e elevado.
- source_word: አውራኅ
  choice: meses
  rationale: É o plural de “mês” e, na enumeração calendárica, refere-se naturalmente aos meses, não às trajetórias dos astros.
- source_word: በዓላት
  choice: festas
  rationale: O termo normalmente indica festas ou festividades fixadas pelo calendário. A nota registra o sentido mais amplo possível de tempos determinados.
- source_word: ክረማት
  choice: anos
  rationale: No encadeamento de divisões calendáricas, “anos” é uma leitura contextual plausível; o termo também pode apontar para estações, possibilidade preservada em nota.
- source_word: መዋዕል
  choice: dias
  rationale: Depois das unidades calendáricas maiores, “dias” é a equivalência mais direta e natural.
- source_word: ነፍሐ ዲቤየ
  choice: soprou sobre mim
  rationale: Preserva a imagem concreta e incomum da ação de Uriel, sem interpretá-la antecipadamente como simples instrução ou inspiração.
- source_word: እግዚእ ኵሉ ፍጥረት ዓለም
  choice: o Senhor de toda a criação do mundo
  rationale: Mantém a construção ampla e solene do ge'ez, bem como o alcance cósmico da soberania divina.
- source_word: ሐይለ ሰማይ
  choice: exército do céu
  rationale: Equivalência tradicional e concreta para a hoste ou conjunto ordenado celestial, sem decidir se a referência inclui astros, seres celestes ou ambos.
theological_decisions:
- issue: Título divino እግዚእ
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” preserva o título de autoridade divina e o registro religioso elevado sem introduzir uma interpretação denominacional.
- issue: Natureza do “exército do céu”
  choice: manter a expressão sem especificar seus integrantes
  alternative: corpos celestes
  rationale: O texto permite entender a expressão como o conjunto celestial ordenado, possivelmente incluindo astros e seres celestes; a tradução conserva essa abertura.
- issue: Ação de Uriel ao soprar sobre Enoque
  choice: preservar a imagem literal
  alternative: inspirou-me ou instruiu-me
  rationale: A formulação concreta pertence à textura visionária do relato; explicá-la como inspiração resolveria uma ambiguidade que o original mantém.
translation_notes:
  register: Português moderno, solene e acessível, com vocabulário astronômico-calendárico claro. Conservam-se a imagem apocalíptica de Uriel soprando sobre o narrador e a ambiguidade de “exército do céu”. Os marcadores aparecem em ordem no texto principal.
