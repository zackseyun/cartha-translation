base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/015.yaml
  text: At the beginning of the year[a], first rises and rules Melkiyal, whose name is called Tam'ade'eni and the sun; and all the days of his dominion, while he rules[c][b], are ninety-one days.
translation:
  language: pt
  text: No início do ano, Melkiyal se levanta primeiro e governa; ele é chamado Tam'ade'eni e o sol[a]. Todos os dias do seu domínio, enquanto ele governa[b], são noventa e um dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cláusula de nomeação depois de “Melkiyal” é textualmente difícil. O ge'ez parece atribuir-lhe o nome ou a designação “Tam'ade'eni e o sol”; “Tam'ade'eni” foi transliterado, e não traduzido de modo conjectural.
    reason: textual_variant
  - marker: b
    text: O versículo personifica este primeiro período do ano como estando sob o governo de Melkiyal; sua duração total é de noventa e um dias.
    reason: cultural_note
lexical_decisions:
- source_word: በቅድመ፡ ዓመት
  choice: No início do ano
  rationale: O uso é temporal; esta formulação é natural em português e preserva a abertura do esquema anual.
- source_word: ቀዳማዊ፡ ይሠርቅ
  choice: primeiro se levanta
  rationale: O ordinal é entendido adverbialmente com o verbo, conforme a sintaxe e a revisão textual fornecida; “se levanta” convém ao contexto dos luminares.
- source_word: ወይመልክ
  choice: e governa
  rationale: Preserva a linguagem reiterada de governo e domínio sem transformá-la em mera indicação cronológica.
- source_word: ምልኪያል
  choice: Melkiyal
  rationale: Mantém a transliteração do nome próprio adotada na evidência de consulta, sem tradução especulativa.
- source_word: ዘይሠመይ፡ ስሞ
  choice: cujo nome é chamado
  rationale: Conserva a fórmula explícita de nomeação do ge'ez, ainda que seu encadeamento com os termos seguintes seja difícil.
- source_word: ተመአደኒ
  choice: Tam'ade'eni
  rationale: Provável nome próprio ou designação técnica; a transliteração evita uma tradução conjectural.
- source_word: ወፀሐይ
  choice: e o Sol
  rationale: Integra “e o Sol” à cláusula de nomeação, como indica a sequência do ge'ez e o paralelo assinalado em 1 Enoque 82:18, em vez de fazê-lo sujeito da contagem dos dias.
- source_word: ኵሎሙ፡ መዋዕለ
  choice: todos os dias
  rationale: Expressa diretamente a totalidade dos dias pertencentes ao período.
- source_word: ዘበስልጣኑ፡ ዚአሁ
  choice: do seu domínio
  rationale: Mantém o substantivo de autoridade em correspondência com o verbo “governa”.
- source_word: እለ፡ ይመልክ
  choice: enquanto ele governa
  rationale: Apresenta a oração relativa como delimitação do período de governo, preservando a repetição do radical.
- source_word: ፺ወ፩ ዕለት
  choice: noventa e um dias
  rationale: Reproduz a duração numérica explícita do texto.
theological_decisions:
- issue: Personificação da ordem calendárica
  choice: Conservar “governa” e “domínio” para Melkiyal.
  alternative: Neutralizar a imagem com “preside”, “assinala” ou “marca a estação”.
  rationale: O texto representa a ordem cósmica por meio de uma figura nomeada que exerce autoridade durante um período determinado. A tradução preserva essa imagem apocalíptica sem acrescentar uma angelologia posterior.
- issue: Identidade expressa pela cláusula de nomeação
  choice: Manter “Tam'ade'eni e o Sol” como parte da designação de Melkiyal.
  alternative: Associar “o Sol” aos dias seguintes ou interpretar Tam'ade'eni semanticamente.
  rationale: A sequência sintática e o paralelo interno favorecem sua inclusão na cláusula de nomeação, mas a nota registra a dificuldade textual sem resolver além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem marcada “primeiro se levanta e governa Melkiyal” conserva algo da ênfase e da estrutura do ge'ez sem se tornar ininteligível. Os nomes foram transliterados, e a ambiguidade da cláusula de nomeação foi preservada e explicada em nota.
