  naturalness: «Primeiro se levanta e governa Melkiyal» é uma inversão marcadamente artificial em português moderno. Além disso, «cujo nome é chamado» é um decalque pouco idiomático. «Melkiyal se levanta primeiro e governa, e é chamado...» comunica a mesma informação de modo claro, formal e natural.
  terminology: «Governa» e «domínio» preservam adequadamente a personificação cósmico-calendárica. A transliteração «Melkiyal» e «Tam'ade'eni» deve ser mantida. «Sol» deve ficar em minúscula, pois funciona como designação comum dentro da fórmula de nomeação, sem evidência de que a capitalização seja requerida.
