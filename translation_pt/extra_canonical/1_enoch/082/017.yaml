base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/017.yaml
  text: 'And these are the names of the leaders who are under them: Berkael[a], Zelbesael, and another who is added, the head of a thousand, whose name is Helyaseph[c][b]. And the days of the dominion of this one are completed.'
translation:
  language: pt
  text: 'E estes são os nomes dos líderes que estão sob eles: Berkael, Zelbesael e outro que é acrescentado, o chefe de mil, cujo nome é Helyaseph.[a] E completam-se os dias do domínio deste.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão que apresenta “outro que é acrescentado, o chefe de mil” é sintaticamente difícil no ge'ez e pode indicar um oficial adicional, de posição determinada, anexado à lista.
    reason: textual_variant
  - marker: b
    text: 'Ou: “E cumprem-se os dias da autoridade deste”. O termo ge''ez pode significar domínio, autoridade ou poder delegado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: os nomes
  rationale: O possessivo é expresso naturalmente pela construção introdutória portuguesa; o referente fica claro no contexto.
- source_word: መራሕያነ
  choice: líderes
  rationale: Designa os que conduzem ou dirigem e preserva a linguagem hierárquica sem especificar uma função militar ou sacerdotal.
- source_word: እለ መትሕቴሆሙ
  choice: que estão sob eles
  rationale: Mantém de modo claro a relação de subordinação indicada pelo ge'ez.
- source_word: ብርክኤል
  choice: Berkael
  rationale: Transliteração conservadora do nome próprio.
- source_word: ዜልብስኤል
  choice: Zelbesael
  rationale: Transliteração conservadora, sem tentar resolver a vocalização incerta.
- source_word: ዘይትዌሰክ
  choice: que é acrescentado
  rationale: Preserva o sentido passivo de alguém adicional incorporado à lista ou à hierarquia.
- source_word: ርእሰ ፲፻
  choice: o chefe de mil
  rationale: Expressa a imagem literal de 'cabeça de mil' em português natural, sem importar uma patente militar mais específica.
- source_word: ስሙ
  choice: cujo nome é
  rationale: Torna explícita a fórmula nominal presente no texto ge'ez.
- source_word: ሂሉያሴፍ
  choice: Helyaseph
  rationale: Transliteração conservadora do nome próprio, acompanhando de perto a forma ge'ez.
- source_word: ተፈጸመ መዋዕለ ስልጣኑ
  choice: completam-se os dias do domínio
  rationale: A formulação conserva a ideia de conclusão e o tom calendárico; o presente acomoda o contexto cíclico da passagem.
- source_word: ለዝ
  choice: deste
  rationale: Mantém a força demonstrativa e a provável referência ao último personagem mencionado, sem tornar o referente mais explícito do que o original.
theological_decisions:
- issue: Natureza dos títulos hierárquicos na ordem dos luminares
  choice: Empregar linguagem administrativo-hierárquica ('líderes', 'chefe de mil')
  alternative: Identificá-los explicitamente como chefes angélicos ou apenas como agentes astronômicos
  rationale: O versículo apresenta nomes e posições numa ordem cósmica, mas não define aqui, de maneira explícita, a natureza desses seres; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura formal da lista e o tom calendárico foram preservados sem explicitar uma interpretação angélica.
