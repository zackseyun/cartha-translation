lexical_decisions:
- source_word: መንገለ
  choice: a oeste de
  rationale: Neste contexto, funciona como expressão direcional, “para/no lado de”, em paralelo com os versículos anteriores; não como o substantivo “caminho”.
- source_word: ዐረቡ
  choice: oeste
  rationale: Designa explicitamente o oeste ou o lado ocidental na descrição topográfica da visão.
- source_word: ለዝ
  choice: deste
  rationale: A preposição ligada ao demonstrativo expressa aqui a relação espacial “deste”, isto é, a oeste do elemento anteriormente mencionado.
- source_word: ካልእ
  choice: outro
  rationale: O termo significa “outro”. Mantém-se substantivado, sem inserir no texto principal um referente nominal que não aparece neste fragmento em ge'ez.
theological_decisions:
- issue: Referente elíptico na descrição visionária
  choice: Manter “outro” sem acrescentar um substantivo.
  alternative: outro monte
  rationale: Embora o contexto mais amplo possa sugerir um monte, o trecho em ge'ez não fornece aqui o substantivo. A tradução preserva essa elipse e evita resolver indevidamente a ambiguidade textual.
translation_notes:
  register: Português moderno, claro e digno, com construção espacial natural. A ordem dos marcadores foi normalizada para [a][b], e a ambiguidade do referente foi preservada.
