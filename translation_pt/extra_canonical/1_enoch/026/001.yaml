base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/001.yaml
  text: And from there I went to the middle of the earth[a], and I saw a blessed place, shaded[c][b], in which there were trees with abiding and sprouting branches from a tree that had been cut down.
translation:
  language: pt
  text: E dali fui para o centro da terra[a] e vi um lugar abençoado, à sombra[b], onde havia árvores com ramos que permaneciam e brotavam de uma árvore que havia sido cortada.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meio da terra”.
    reason: lexical_alternative
  - marker: b
    text: A descrição botânica do texto etíope é difícil. A leitura “à sombra” se apoia em uma palavra transmitida entre colchetes; a sequência também pode ser entendida em ligação mais direta com os ramos.
    reason: textual_variant
  - marker: c
    text: A oração final provavelmente descreve crescimento novo procedente de uma árvore cortada, mas a relação exata entre os ramos, as árvores e a árvore cortada não é inteiramente clara no texto.
    reason: textual_variant
lexical_decisions:
- source_word: ማእከለ ምድር
  choice: o centro da terra
  rationale: Preserva o sentido geográfico-cósmico da jornada visionária; “terra” é preferível a “região” neste contexto apocalíptico.
- source_word: መካነ ቡሩከ
  choice: um lugar abençoado
  rationale: Mantém de modo conciso a ideia de um local caracterizado pela bênção, sem identificá-lo além do que o verso declara.
- source_word: ጥሉለ
  choice: coberto de sombra
  rationale: Expressa de modo natural a leitura etíope entre colchetes e conserva a imagem concreta de um lugar sombreado.
- source_word: ዕፀወ / አዕፁቀ
  choice: árvores com ramos
  rationale: Conserva os dois elementos botânicos explícitos, entendendo a segunda oração relativa como descrição das árvores.
- source_word: ዘይነብር ወይሠርፅ
  choice: que permaneciam vivos e brotavam
  rationale: O primeiro verbo indica permanência ou continuidade, e o segundo, brotar ou lançar rebentos; “vivos” torna inteligível a vitalidade implícita sem eliminar a ideia de permanência.
- source_word: እምዕፅ ዘተመተረ
  choice: de uma árvore que havia sido cortada
  rationale: Preserva a imagem provável de crescimento procedente de uma árvore previamente cortada, sem especificar se foi derrubada ou apenas podada.
theological_decisions:
- issue: Descrição de paisagem comum ou geografia sagrada simbólica
  choice: Manter a geografia visionária concreta — “centro da terra” e “lugar abençoado” — sem explicação alegórica.
  alternative: Identificar explicitamente o lugar como paraíso ou Éden, ou reduzi-lo a uma região fértil comum.
  rationale: O verso sugere uma topografia sagrada, mas não dá nome ao lugar; a tradução preserva essa tensão sem impor uma identificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém os elementos botânicos do etíope e sinaliza em notas suas dificuldades textuais, sem converter a cena explicitamente em Éden ou paraíso.
