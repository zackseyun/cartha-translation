base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/003.yaml
  text: And I saw another mountain toward the east[a], higher than this one; and between them was a deep ravine, but not wide[d][c][b], and water was flowing in it toward the mountain.
translation:
  language: pt
  text: E vi outro monte na direção do leste, mais alto do que este[a]; entre eles havia uma ravina profunda, mas não larga, e nela corria água em direção ao monte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como «mais comprido», «maior» ou «mais extenso do que este».
    reason: lexical_alternative
  - marker: b
    text: A última oração é difícil. Mais literalmente, o texto diz que havia água na ravina e que ela se movia «em direção ao monte».
    reason: textual_difficulty
lexical_decisions:
- source_word: መንገለ ጽባሕ
  choice: na direção do leste
  rationale: ጽባሕ designa a aurora/manhã e, como expressão direcional, o leste. A tradução evita a especificação não sustentada «nordeste» e mantém a referência espacial natural em português.
- source_word: ካልአ ደብረ
  choice: outro monte
  rationale: ካልአ indica outro ou um segundo elemento; «outro monte» é natural e preserva a sequência da visão.
- source_word: ዘይነውኅ እምዝ
  choice: mais alto do que este
  rationale: O verbo pode exprimir extensão, comprimento ou grandeza. No contexto da comparação entre montes, altura é o sentido topográfico mais provável, sem apagar as alternativas na nota.
- source_word: ማእከሎሙ
  choice: entre eles
  rationale: A forma pronominal plural situa a ravina no espaço entre os montes.
- source_word: ቈላ ዕሙቀ
  choice: uma ravina profunda
  rationale: A combinação descreve uma depressão funda do terreno; «ravina» comunica uma formação estreita e marcada, adequada à paisagem visionária.
- source_word: አልቦ ርሐበ
  choice: mas não larga
  rationale: A expressão significa literalmente que não havia largura. «Não larga» preserva sua forma negativa e o contraste conciso.
- source_word: ቦቱኒ ማይ የሐውር መንገለ ደብር
  choice: e nela corria água em direção ao monte
  rationale: O texto localiza a água na ravina e emprega um verbo geral de movimento. Com água como sujeito, «corria» é idiomático; a direção aparentemente difícil, «em direção ao monte», permanece explícita.
theological_decisions:
- issue: Caráter concreto da topografia visionária
  choice: Manter monte, ravina e água como elementos concretos da paisagem vista
  alternative: Parafrasear esses elementos como símbolos ou generalizá-los como um lugar ou uma região
  rationale: O texto apresenta a visão mediante imagens topográficas concretas. Traduzir essas imagens sem interpretação embutida preserva a tensão apocalíptica e deixa seu possível significado simbólico para a interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. «Monte» mantém o termo bíblico corrente; «ravina» oferece precisão topográfica sem linguagem excessivamente técnica.
