base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/002.yaml
  text: And there I saw a holy mountain[a], and beneath the mountain water from the east, and its flow toward the north.
translation:
  language: pt
  text: E ali vi um monte santo e, abaixo do monte, água vinda do leste[a], e seu curso em direção ao norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge’ez diz literalmente “água do leste”; a expressão seguinte esclarece que essa água segue em direção ao norte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ደብረ
  choice: monte
  rationale: O substantivo designa uma elevação ou montanha. “Monte” é natural no registro bíblico-apocalíptico em português e evita a solenidade excessiva de outras opções.
- source_word: ቅዱሰ
  choice: santo
  rationale: Preserva o sentido de algo consagrado ou separado e mantém a força teológica da visão.
- source_word: መትሕተ ደብር
  choice: abaixo do monte
  rationale: Expressa de modo claro e direto a relação espacial indicada pelo ge'ez.
- source_word: ማይ
  choice: água
  rationale: Mantém o substantivo básico sem transformá-lo indevidamente em “rio” ou “riacho”; a oração seguinte comunica seu movimento.
- source_word: እመንገለ ጽባሕ
  choice: vinda do leste
  rationale: Transmite naturalmente em português a procedência ou direção oriental expressa pela locução, literalmente associada ao leste ou ao nascer do sol.
- source_word: ውሕዘቱ
  choice: seu curso
  rationale: No contexto, refere-se ao fluxo ou trajeto da água. “Curso” conserva a imagem sem postular um corpo d’água específico.
- source_word: መንገለ ሰሜን
  choice: em direção ao norte
  rationale: Reproduz o valor direcional da expressão e combina naturalmente com “curso”.
theological_decisions:
- issue: Como traduzir ቅዱሰ com sua força teológica
  choice: monte santo
  alternative: montanha sagrada
  rationale: “Santo” preserva mais diretamente a ideia de consagração própria da geografia visionária de 1 Enoque, sem reduzir o termo a uma atmosfera religiosa genérica.
translation_notes:
  register: Português moderno, claro e digno, com leve ressonância bíblica. A coordenação final — “e seu curso em direção ao norte” — conserva a construção nominal do texto-fonte, que não apresenta ali um verbo explícito.
