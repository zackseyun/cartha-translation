base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/007.yaml
  text: And now[a], my father, I am here asking you and petitioning you, that you should go to Henok our father and hear from him the truth[b], for his dwelling is with the angels.
translation:
  language: pt
  text: E agora, meu pai, estou aqui, pedindo-te e suplicando-te que vás até Henok[a], nosso pai, e ouças dele a verdade, pois sua morada está com os anjos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Henok é a transliteração da forma do nome em ge'ez; em traduções bíblicas portuguesas, o nome costuma aparecer como “Enoque”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Preserva o marcador temporal e discursivo que introduz o apelo urgente.
- source_word: ሀለውኩ
  choice: estou aqui
  rationale: Expressa a presença atual do falante na cena, sem omitir a unidade lexical do ge'ez.
- source_word: አስተበቍዐከ ወእስእል
  choice: pedindo-te e suplicando-te
  rationale: Mantém os dois verbos de petição e sua intensificação retórica, em linguagem portuguesa atual e digna.
- source_word: ከመ ትሖር ኀበ
  choice: que vás até
  rationale: Apresenta naturalmente em português o conteúdo do pedido e o movimento em direção a Henok.
- source_word: ሄኖክ አቡነ
  choice: Henok, nosso pai
  rationale: Translitera ሄኖክ de acordo com sua forma em ge'ez e conserva a designação familiar e honorífica.
- source_word: ትስማዕ እምኀቤሁ አማነ
  choice: ouças dele a verdade
  rationale: Preserva o verbo concreto de ouvir, a procedência da informação e a ordem enfática da expressão em ge'ez.
- source_word: እስመ
  choice: pois
  rationale: Introduz com clareza a razão para consultar Henok.
- source_word: ውእቱ ምስለ መላእክት ምኅዳሩ
  choice: sua morada está com os anjos
  rationale: Mantém a construção nominal e a imagem apocalíptica de uma morada estabelecida junto aos anjos.
theological_decisions:
- issue: A relação de Henok com os anjos
  choice: sua morada está com os anjos
  alternative: ele habita com os anjos
  rationale: A formulação nominal do ge'ez destaca a morada de Henok. Conservá-la evita reduzir ou explicar em excesso a imagem apocalíptica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A colocação pronominal e o subjuntivo preservam a dignidade do apelo sem recorrer a vocabulário arcaico.
