base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/014.yaml
  text: And they will commit sin[a], and they will transgress the ordinance; and they will join themselves with women and commit sin with them, and they will take wives from among them[c][b], and they will beget children.
translation:
  language: pt
  text: E eles cometerão pecado e transgredirão a ordenança; irão se unir a mulheres e pecar com elas, tomarão para si esposas dentre elas e gerarão filhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገብሩ፡ ኀጢአተ
  choice: cometerão pecado
  rationale: A combinação idiomática do verbo “fazer” com “pecado” significa cometer pecado; a formulação portuguesa é natural e preserva o teor moral.
- source_word: የኀልፉ፡ ሥርዐተ
  choice: transgredirão a ordenança
  rationale: No contexto jurídico e moral, o verbo indica violar uma norma estabelecida; “ordenança” evita identificar especificamente essa norma com a Lei mosaica.
- source_word: ተደመሩ
  choice: irão se unir
  rationale: Preserva o sentido amplo de juntar-se ou unir-se, sem tornar a expressão sexualmente mais explícita do que o testemunho.
- source_word: አንስት
  choice: mulheres
  rationale: É o equivalente coletivo direto; “esposas” introduziria aqui uma condição matrimonial que só aparece na oração seguinte.
- source_word: አውሰቡ
  choice: tomarão para si esposas
  rationale: O verbo neste contexto significa casar-se ou tomar esposa, conforme a correção lexical sustentada pelo testemunho da edição.
- source_word: ወይወልዱ፡ ውሉደ
  choice: e gerarão filhos
  rationale: Segue a leitura corrigida do texto impresso de Charles, reconhecendo que a transcrição fornecida sofreu erro de OCR no encerramento do versículo.
theological_decisions:
- issue: Natureza da transgressão envolvendo mulheres
  choice: “irão se unir a mulheres e pecar com elas”
  alternative: Explicitar a união como relação sexual ou reduzi-la apenas a casamento
  rationale: A redação mantém tanto a amplitude lexical do verbo “unir-se” quanto a qualificação moral explícita do contexto, sem impor uma interpretação mais estreita.
- issue: Leitura da oração final danificada na transcrição
  choice: “tomarão para si esposas dentre elas e gerarão filhos”
  alternative: “serão separados delas e delas”
  rationale: A leitura alternativa resulta de erro de transcrição/OCR. A forma አውሰቡ denota tomar esposa/casar-se, e a edição impressa traz a oração “gerarão filhos”; portanto, a tradução segue a evidência textual corrigida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a repetição de “pecado/pecar” e distingue “mulheres” de “esposas”. Não se acrescentou nota no texto, pois a dificuldade decorre de erro conhecido da transcrição, não de ambiguidade genuína da leitura corrigida.
