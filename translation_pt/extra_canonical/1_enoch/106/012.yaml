base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/012.yaml
  text: And his father Lamech was afraid[a], and he fled to me, and he did not believe that he was from him, but that his likeness was like the angels of heaven. And behold[b], I have come to you so that you may make righteousness known to me.
translation:
  language: pt
  text: E seu pai, Lameque, ficou com medo e fugiu para junto de mim. Ele não acreditava que o menino fosse seu, mas que sua aparência fosse como a dos anjos do céu. E eis que vim até você para que me faça conhecer a verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a justiça”, “a retidão” ou “o que é certo”. O termo ge'ez pode ter sentido moral ou jurídico, mas aqui provavelmente se refere à explicação verdadeira que Lameque procura.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈርሀ
  choice: ficou com medo
  rationale: Expressa de modo natural o verbo de temor e preserva a reação narrativa de Lameque.
- source_word: ጐየ
  choice: fugiu
  rationale: Mantém a urgência do movimento no contexto do assombro de Lameque.
- source_word: ኀቤየ
  choice: para junto de mim
  rationale: Representa o movimento em direção ao narrador com português corrente e claro.
- source_word: ወኢአምነ (leitura corrigida do provável erro de transcrição ወአአምነ)
  choice: Ele não acreditava
  rationale: A leitura negativa, sustentada pela revisão textual fornecida, evita deslocar a negação para uma oração que no ge'ez não contém partícula negativa.
- source_word: ከመ እምኔሁ ውእቱ
  choice: que o menino fosse seu
  rationale: Comunica a ideia de origem ou paternidade de maneira idiomática; 'o menino' explicita apenas o referente já presente no contexto, sem afirmar paternidade angélica.
- source_word: አላ
  choice: mas
  rationale: Preserva o contraste adversativo entre a paternidade de Lameque e a aparência extraordinária da criança.
- source_word: አምሳሉ እመላእክተ ሰማይ
  choice: que sua aparência fosse como a dos anjos do céu
  rationale: Conserva o substantivo com sufixo, 'sua aparência/semelhança', e a comparação com os anjos, sem transformar semelhança em descendência.
- source_word: ናሁ መጻእኩ ኀቤከ
  choice: E eis que vim até você
  rationale: Retém o marcador discursivo solene e o movimento em direção ao interlocutor.
- source_word: ታይድዐኒ
  choice: para que me faça conhecer
  rationale: Preserva o valor causativo de 'fazer saber/conhecer' em linguagem digna e compreensível.
- source_word: ጽድቀ
  choice: a verdade
  rationale: Embora o substantivo possa significar 'justiça' ou 'retidão', no contexto Lameque pede a explicação verdadeira sobre a criança; a nota conserva a amplitude lexical.
theological_decisions:
- issue: Se o versículo afirma paternidade angélica ou apenas semelhança com anjos
  choice: A tradução diz que a aparência da criança era como a dos anjos do céu.
  alternative: A criança não era de Lameque, mas provinha dos anjos do céu.
  rationale: O texto emprega linguagem de aparência ou semelhança e não declara de forma explícita que os anjos geraram a criança. A tradução preserva a tensão sem acrescentar uma conclusão doutrinária.
- issue: Sentido contextual de ጽድቀ
  choice: a verdade
  alternative: a justiça; a retidão; o que é certo
  rationale: No pedido de esclarecimento sobre a origem e a aparência da criança, 'a verdade' é a formulação portuguesa mais natural, enquanto a nota registra os sentidos moral e jurídico possíveis.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. 'Eis que' conserva o tom apocalíptico elevado sem arcaísmo excessivo. A sintaxe foi dividida em períodos para clareza, e a formulação evita afirmar explicitamente uma origem angélica.
