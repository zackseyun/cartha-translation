base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/010.yaml
  text: 'And now[a], my father, hear me: a son has been born to Lamech my son, and his appearance and form are not like the form of a human being. His color is whiter than snow and redder than the blossom of a rose, and the hair of his head is whiter than white wool. And his eyes are like the rays of the sun[c][b]; and he opened his eyes and lit up the whole house.'
translation:
  language: pt
  text: 'E agora, meu pai, ouça-me: nasceu um filho para Lameque, meu filho, e sua aparência e sua forma não são como a forma de um ser humano. Sua cor é mais branca que a neve e mais vermelha que uma flor de rosa[a], e os cabelos de sua cabeça são mais brancos que a lã branca. Seus olhos são como os raios do sol[b]; e ele abriu os olhos e iluminou toda a casa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo floral é tradicionalmente entendido como rosa, mas a identificação exata da espécie é incerta.
    reason: lexical_alternative
  - marker: b
    text: A expressão em ge'ez é difícil; também pode ser entendida como “fachos do sol” ou, possivelmente, como referência ao disco solar. O sentido geral é de intenso brilho solar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምዐኒ
  choice: ouça-me
  rationale: Traduz diretamente o imperativo com sufixo de primeira pessoa e conserva o apelo urgente e filial.
- source_word: ተወልደ
  choice: nasceu
  rationale: O perfeito passivo anuncia um nascimento já ocorrido; o pretérito perfeito é a forma natural em português.
- source_word: ዘአምሳሉ ወፍጥረቱ
  choice: sua aparência e sua forma
  rationale: Mantém os dois termos correlatos — sem reduzi-los a uma ideia abstrata de natureza — e se ajusta ao contexto visual.
- source_word: ኢኮነ ከመ ፍጥረተ ሰብእ
  choice: não são como a forma de um ser humano
  rationale: Preserva a comparação extraordinária do texto sem concluir que a criança não seja humana em sentido ontológico.
- source_word: ኅብሩ
  choice: sua cor
  rationale: É a equivalência mais direta no contexto, que em seguida descreve brancura e vermelhidão.
- source_word: ይጸዐዳ እምአስኃትያ
  choice: é mais branca que a neve
  rationale: Reproduz de modo claro a construção comparativa de brancura.
- source_word: ይቀይሕ እምጽጌ ረዳ
  choice: mais vermelha que uma flor
  rationale: Conserva a imagem floral e a comparação de vermelhidão sem afirmar uma espécie botânica incerta.
- source_word: ጸጕረ ርእሱ
  choice: os cabelos de sua cabeça
  rationale: Formulação natural e digna que preserva o detalhe corporal explícito.
- source_word: እምፀምር ጸዐዳ
  choice: mais brancos que a lã branca
  rationale: Mantém tanto o comparativo quanto a repetição enfática da brancura presente no ge'ez.
- source_word: ከመ እግረን ለፀሐይ
  choice: como os raios do sol
  rationale: A expressão é difícil, mas o contexto aponta claramente para brilho solar; esta opção preserva a imagem sem especificação excessiva.
- source_word: ከሠተ አዕይንቲሁ
  choice: ele abriu os olhos
  rationale: Expressa naturalmente a ação narrativa e mantém a voz ativa sugerida pelo texto.
- source_word: አበርሀ ኵሎ ቤተ
  choice: iluminou toda a casa
  rationale: Reproduz de modo conciso o efeito luminoso atribuído à abertura dos olhos.
theological_decisions:
- issue: A diferença da criança em relação à humanidade comum
  choice: sua aparência e sua forma não são como a forma de um ser humano
  alternative: ele não é como um ser humano
  rationale: A redação escolhida mantém o foco descritivo na aparência e na forma, preservando o assombro do relato sem transformar a comparação em afirmação metafísica sobre a natureza da criança.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Preservaram-se a coordenação narrativa, as comparações intensificadas e a estranheza teológica do relato. Evitou-se identificar com certeza a flor como rosa e também se evitou uma afirmação ontológica além do que o ge'ez exige.
