base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/013.yaml
  text: And I[a], Enoch, answered and said to him, “The Lord will do a new thing on the earth; and this I have already seen in a vision, and I have made it known to you[e][d][c][b], because in the generation of Jared my father they transgressed the word of my Lord from the heights of heaven.”
translation:
  language: pt
  text: 'E eu, Enoque, respondi e lhe disse: “O Senhor fará algo novo[a] sobre a terra. Isso eu já vi numa visão e lhe dei a conhecer, pois, na geração de Jarede, meu pai, eles transgrediram a palavra do meu Senhor, vinda do alto do céu[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “renovará” ou “fará de novo”; o verbo e o substantivo ge'ez derivam da ideia de novidade.
    reason: lexical_alternative
  - marker: b
    text: A frase final também pode ser entendida como “a palavra do meu Senhor do alto do céu”. A sintaxe ge'ez é difícil, e a expressão espacial pode modificar “palavra” ou “Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: አውሣእኩ … ወእቤሎ
  choice: respondi e lhe disse
  rationale: Preserva a fórmula narrativa semítica dupla e seu tom solene, em português natural.
- source_word: ይኄድስ … ኀዳሳተ
  choice: fará algo novo
  rationale: Expressa a ideia conjunta de fazer e novidade sem restringi-la à renovação da própria terra; a alternativa lexical é registrada em nota.
- source_word: ዲበ ምድር
  choice: sobre a terra
  rationale: Representa a preposição espacial e mantém um registro digno, sem sugerir necessariamente o interior da terra.
- source_word: ወዳእኩ ርኢኩ በራእይ
  choice: Isso eu já vi numa visão
  rationale: Comunica a anterioridade da experiência e conserva explicitamente seu caráter visionário.
- source_word: አይዳዕኩከ
  choice: dei a conhecer a você
  rationale: Reproduz o sentido causativo de fazer alguém saber, com tom revelatório e compreensão ampla.
- source_word: በትውልዱ ለአያሬድ አቡየ
  choice: na geração de meu pai Jarede
  rationale: Mantém a moldura genealógica e identifica de modo natural Jarede como pai de Enoque.
- source_word: አኅለፉ
  choice: transgrediram
  rationale: Conserva a imagem de ultrapassar um limite e seu sentido contextual de violar a palavra divina.
- source_word: ነገረ ለእግዚእየ
  choice: a palavra do meu Senhor
  rationale: Mantém tanto o pronome possessivo do texto quanto a amplitude de 'palavra', sem especificá-la indevidamente como mandamento.
- source_word: እመልዕልተ ሰማይ
  choice: vinda das alturas do céu
  rationale: Traduz a expressão vertical como origem da palavra na leitura principal; a ligação sintática permanece incerta e é explicitada em nota.
theological_decisions:
- issue: Natureza do ato futuro do Senhor
  choice: O Senhor fará algo novo sobre a terra
  alternative: O Senhor renovará a terra
  rationale: A construção ligada à ideia de novidade admite renovação, mas não exige que a terra seja o objeto direto. A tradução evita afirmar aqui uma renovação cosmológica completa.
- issue: Natureza da transgressão na geração de Jarede
  choice: transgrediram a palavra do meu Senhor
  alternative: transgrediram o mandamento do Senhor
  rationale: O contexto pode evocar a rebelião dos Vigilantes, mas o versículo emprega uma expressão mais ampla; por isso, não se identifica uma ordem ou episódio específico.
- issue: Ligação sintática da expressão celestial
  choice: a palavra do meu Senhor vinda das alturas do céu
  alternative: meu Senhor, que está nas alturas do céu
  rationale: A sintaxe ge'ez permite que a expressão espacial modifique 'palavra' ou 'Senhor'. A leitura principal mantém a proximidade com 'palavra', enquanto a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A fórmula de fala foi preservada por seu valor literário; formas excessivamente arcaicas foram evitadas.
