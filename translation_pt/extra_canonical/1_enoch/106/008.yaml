base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/008.yaml
  text: And when Methuselah heard the words of his son[a], he came to me at the ends of the earth, because he had heard that I was there. And he cried out, and I heard his voice, and I came to him and said to him, “Behold, I am here, my son. Why have you come to me?”
translation:
  language: pt
  text: 'Quando Matusalém ouviu as palavras de seu filho, veio até mim, nos confins da terra, pois tinha ouvido que eu estava ali. Ele clamou, e eu ouvi sua voz; então fui até ele e lhe disse: “Eis-me aqui, meu filho. Por que você veio até mim?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A cláusula final é textualmente difícil em etíope. Traduzida de modo estritamente literal, seria: “pois/porque você veio até mim”. Pelo contexto, é mais bem entendida como uma pergunta sobre o motivo da vinda: “Por que você veio até mim?”'
    reason: textual_variant
lexical_decisions:
- source_word: ሰምዐ
  choice: ouviu / ouvi
  rationale: O verbo auditivo básico preserva com naturalidade a sequência narrativa nas duas ocorrências.
- source_word: ነገረ ወልዱ
  choice: as palavras de seu filho
  rationale: Mantém o caráter concreto de ነገር, que pode significar palavra, assunto ou mensagem, e soa natural em português.
- source_word: ኀቤየ
  choice: até mim
  rationale: Expressa adequadamente o sentido direcional da preposição no contexto de movimento.
- source_word: ውስተ አጽናፈ ምድር
  choice: nos confins da terra
  rationale: Conserva a força geográfica e apocalíptica da expressão sem reduzi-la à ideia genérica de um lugar distante.
- source_word: እስመ ሰምዐ ከመ ህየ ሀለውኩ
  choice: pois tinha ouvido que eu estava ali
  rationale: A oração explica a viagem de Matusalém; “ali” preserva a referência espacial de ህየ.
- source_word: ጸርኀ
  choice: clamou
  rationale: Transmite um chamado em voz alta com registro narrativo digno e não coloquial.
- source_word: ቃሎ
  choice: sua voz
  rationale: Após “clamou”, o sentido contextual mais natural é a voz ou o chamado ouvido.
- source_word: ናሁ ሀለውኩ
  choice: Eis-me aqui
  rationale: Fórmula portuguesa consagrada que preserva o tom elevado e a declaração de presença.
- source_word: ወልድየ
  choice: meu filho
  rationale: Preserva diretamente a relação familiar expressa no vocativo.
- source_word: እስመ መጻእከ ኀቤየ
  choice: Por que você veio até mim?
  rationale: Embora o etíope transmitido use uma construção literalmente causal e difícil, o contexto favorece uma pergunta sobre a razão ou finalidade da vinda.
theological_decisions:
- issue: Fórmula de localização cósmica
  choice: nos confins da terra
  alternative: numa região distante
  rationale: A tradução mantém o alcance apocalíptico da imagem e não a reduz a uma distância meramente genérica.
- issue: Cláusula final textualmente difícil
  choice: Por que você veio até mim?
  alternative: Porque você veio até mim
  rationale: A leitura interrogativa corresponde melhor ao diálogo, mas a dificuldade do texto etíope é explicitamente preservada em nota, sem apresentar a interpretação contextual como indiscutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Matusalém”, “confins da terra” e “Eis-me aqui” preservam o registro bíblico e apocalíptico sem recorrer a formas arcaicas; “você” mantém clareza contemporânea no discurso direto.
