base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/001.yaml
  text: And after some days my son Methuselah took a wife for his son Lamech[a], and she conceived by him and bore a son.
translation:
  language: pt
  text: Passado algum tempo[a], meu filho Matusalém tomou uma esposa para seu filho Lameque; ela concebeu dele e deu à luz um filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “depois de dias”; a expressão também pode ser entendida como “depois de algum tempo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ መዋዕል
  choice: Passado algum tempo
  rationale: A expressão temporal significa literalmente algo como “depois de dias”, mas funciona de modo mais amplo como indicação de um período transcorrido. “Passado algum tempo” é natural em português e preserva essa amplitude.
- source_word: ነሥአ
  choice: tomou
  rationale: No contexto matrimonial, o verbo indica tomar ou providenciar uma esposa. Com Matusalém como sujeito e Lameque como beneficiário, “tomou uma esposa para” reproduz de modo conciso a construção.
- source_word: ብእሲተ
  choice: uma esposa
  rationale: Embora o substantivo também possa significar “mulher”, o contexto de alguém ser tomada para Lameque favorece claramente o sentido matrimonial.
- source_word: ወፀንሰት
  choice: ela concebeu
  rationale: Tradução direta, clara e digna do verbo, adequada ao registro narrativo.
- source_word: እምኔሁ
  choice: dele
  rationale: A expressão assinala Lameque como pai. “Concebeu dele” conserva essa relação sem acrescentar explicação ao texto.
- source_word: ወወለደት ወልደ
  choice: e deu à luz um filho
  rationale: Expressa naturalmente em português o sentido narrativo da locução e mantém explícito que a criança era do sexo masculino.
theological_decisions:
- issue: Agência genealógica e matrimonial na oração inicial
  choice: Matusalém tomou uma esposa para seu filho Lameque
  alternative: O filho de Matusalém, Lameque, tomou uma esposa
  rationale: A sintaxe ge’ez favorece Matusalém como sujeito e Lameque como beneficiário da ação. A tradução preserva essa leitura direta sem impor uma tradição interpretativa posterior.
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira e vocabulário amplamente internacional. “Matusalém” e “Lameque” seguem as formas bíblicas portuguesas correntes. O ponto e vírgula separa a providência matrimonial de sua consequência sem fragmentar a narrativa.
