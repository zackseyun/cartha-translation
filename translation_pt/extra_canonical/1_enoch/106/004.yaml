base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/004.yaml
  text: And Lamech his father was afraid of him[b][a], and he fled and came to his father Methuselah.
translation:
  language: pt
  text: E Lameque, seu pai, teve medo dele[a] e fugiu, e foi até seu pai, Matusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “dele” refere-se mais naturalmente ao recém-nascido mencionado no contexto anterior.
    reason: cross_reference
lexical_decisions:
- source_word: ፈረሀ
  choice: teve medo
  rationale: Expressa diretamente a reação de temor e soa natural em português atual.
- source_word: እምኔሁ
  choice: dele
  rationale: Mantém o pronome masculino conciso do ge'ez e não explicita no corpo do texto um referente que a fonte deixa pronominal.
- source_word: ጐየ
  choice: fugiu
  rationale: Preserva a ideia de partida rápida motivada pelo medo, mais forte do que simplesmente 'foi embora'.
- source_word: መጽአ ኀበ
  choice: indo até
  rationale: Representa o movimento e a chegada ao destino de maneira idiomática, sem sugerir que Matusalém estivesse junto ao ponto de vista do narrador.
- source_word: አቡሁ
  choice: seu pai
  rationale: 'As duas ocorrências são preservadas: a primeira em aposição a Lameque e a segunda identifica Matusalém como pai dele.'
- source_word: ማቱሳላ
  choice: Matusalém
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
theological_decisions:
- issue: Referente do pronome ligado ao medo de Lameque
  choice: Manter 'dele' no texto, entendido contextualmente como o recém-nascido.
  alternative: Inserir explicitamente 'da criança' ou deixar sem qualquer nota interpretativa.
  rationale: O contexto anterior aponta naturalmente para o recém-nascido, mas o ge'ez usa apenas um pronome; por isso, a tradução conserva a concisão e a ambiguidade formal da fonte, esclarecendo o referente provável em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A aposição 'Lameque, seu pai' preserva a ênfase narrativa da primeira ocorrência de አቡሁ. A cadeia verbal foi levemente ajustada para evitar a ambiguidade de 'veio até' em português.
