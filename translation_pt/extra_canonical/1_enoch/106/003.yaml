base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/003.yaml
  text: And at that time[a], he rose from the hands of the midwife[b], and he opened his mouth and spoke to the Lord of righteousness.
translation:
  language: pt
  text: Então, ele se ergueu das mãos da parteira[a], abriu a boca e falou ao Senhor da justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “das mãos dela”; o contexto identifica a mulher como a assistente do parto, isto é, a parteira.
    reason: lexical_alternative
  - marker: b
    text: Ou “Senhor da retidão”. O termo ge'ez pode expressar tanto retidão moral quanto justiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶቤሃ
  choice: Então
  rationale: Marca a progressão temporal da narrativa de modo natural e conciso, preservando o caráter imediato do acontecimento.
- source_word: ተንሥአ
  choice: ele se ergueu
  rationale: Expressa o ato extraordinário de levantar-se sem especificar indevidamente que o recém-nascido ficou de pé.
- source_word: እምእዴሃ ለመውለዲት
  choice: das mãos da parteira
  rationale: Mantém a imagem concreta de sair das mãos da mulher que assistia ao parto e explicita naturalmente o referente feminino.
- source_word: ወከሠተ አፉሁ
  choice: abriu a boca
  rationale: Reproduz diretamente a fórmula de introdução à fala e conserva sua vivacidade no contexto.
- source_word: ተወተናገረ
  choice: falou
  rationale: Verbo simples e direto, adequado à sequência narrativa do ge'ez.
- source_word: ለእግዚአ ጽድቅ
  choice: ao Senhor da justiça
  rationale: Traduz እግዚአ pelo título religioso natural «Senhor» e emprega «justiça», termo português capaz de abranger dimensões morais e judiciais.
theological_decisions:
- issue: Sentido de ጽድቅ no título divino
  choice: justiça
  alternative: retidão
  rationale: «Justiça» preserva melhor, em português, a amplitude moral e judicial do termo; a nota registra «retidão» para não eliminar sua possível ênfase ética.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação narrativa. A coordenação verbal foi mantida sem arcaísmos; «se ergueu» evita definir além do texto a postura do recém-nascido.
