base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/006.yaml
  text: And it seems to me that he is not from me, but from the angels; and I fear that a wonder might be done in his days upon the earth.
translation:
  language: pt
  text: E parece-me que ele não vem de mim, mas dos anjos; e temo que, nos dias dele, aconteça algo extraordinário[a] sobre a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um prodígio”, “uma maravilha”. O termo ge''ez designa algo excepcional, assombroso ou inquietante.'
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível, seguindo uma leitura narrativa no passado: “E pareceu-me que ele não vinha de mim, mas dos anjos; e tive medo de que, nos dias dele, acontecesse algo extraordinário sobre a terra.” O presente, porém, corresponde melhor ao discurso direto e às formas verbais do texto.'
    reason: previous_rendering
lexical_decisions:
- source_word: ይመስለኒ
  choice: parece-me
  rationale: Preserva a fórmula de percepção em primeira pessoa e o valor presente do imperfeito no discurso direto, sem transformar a suspeita em certeza.
- source_word: አኮኑ እምኔየ
  choice: ele não vem de mim
  rationale: Expressa origem ou procedência e torna clara, em português natural, a dúvida de Lameque quanto à paternidade.
- source_word: እመላእክት
  choice: dos anjos
  rationale: Mantém o contraste explícito e surpreendente entre origem humana e angélica, sem confirmar como fato a percepção de Lameque.
- source_word: እፈረሀ
  choice: temo
  rationale: Conserva o presente do discurso direto e traduz de modo conciso a reação de medo.
- source_word: ኢይትገበር
  choice: aconteça
  rationale: O subjuntivo após 'temo que' comunica naturalmente em português a possibilidade receada e representa o sentido passivo ou impessoal sem uma construção artificial.
- source_word: መንክር
  choice: algo extraordinário
  rationale: Abrange a ideia de acontecimento maravilhoso, prodigioso ou inquietante sem sugerir necessariamente um milagre benéfico.
- source_word: በመዋዕሊሁ
  choice: nos dias dele
  rationale: Preserva o idioma temporal ligado à vida e à época da criança.
- source_word: ዲበ ምድር
  choice: sobre a terra
  rationale: Mantém o registro apocalíptico e o alcance cósmico mais provável de 'terra', em vez de restringir a uma região.
theological_decisions:
- issue: Natureza da origem da criança na suspeita de Lameque
  choice: Apresentar a origem angélica como percepção temerosa de Lameque, não como afirmação confirmada pelo narrador.
  alternative: Traduzir a frase como declaração objetiva de que a criança foi gerada por anjos.
  rationale: A introdução 'parece-me' qualifica toda a inferência e preserva a tensão narrativa e teológica sem impor uma conclusão doutrinária.
- issue: Natureza do acontecimento extraordinário
  choice: Manter a formulação aberta, sem definir o acontecimento como milagre, juízo ou presságio.
  alternative: Especificar 'milagre', 'prodígio maligno' ou 'juízo'.
  rationale: O termo etíope indica algo excepcional ou assombroso, mas o verso não determina sua natureza moral ou teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'aconteça algo extraordinário' evita o português pouco natural de 'seja feita uma maravilha', preservando a incerteza e o caráter incomum do evento. Os marcadores [a] e [b] aparecem no texto principal.
