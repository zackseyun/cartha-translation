base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/011.yaml
  text: And he rose up in the hands of the midwife[a], and he opened his mouth and blessed the Lord of heaven.
translation:
  language: pt
  text: E ele se levantou nas mãos da parteira[a], abriu a boca e abençoou o Senhor do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por «parteira» significa literalmente algo como «a mulher que dá à luz ou ajuda no parto»; nesta cena de nascimento, refere-se mais naturalmente à assistente que recebe a criança.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥአ
  choice: se levantou
  rationale: Conserva o sentido concreto de erguer-se e a força extraordinária da ação do recém-nascido, sem explicá-la além do texto.
- source_word: ውስተ እዴሃ
  choice: nas mãos da
  rationale: Representa literalmente a localização «em/dentro das mãos dela» de modo natural em português.
- source_word: መውላዲት
  choice: parteira
  rationale: No contexto da cena de nascimento, designa mais naturalmente a mulher que recebe e assiste o recém-nascido; a nota registra a amplitude lexical da expressão.
- source_word: ፈትሐ አፉሁ
  choice: abriu a boca
  rationale: Preserva a expressão concreta e formulaica, importante porque ressalta o caráter prodigioso da fala logo após o nascimento.
- source_word: ባረኮ
  choice: bendisse
  rationale: Mantém o sentido de proferir bênção e o registro bíblico, em vez de reduzi-lo a «louvou».
- source_word: እግዚአ ሰማይ
  choice: o Senhor do céu
  rationale: Traduz o título divino e a construção genitiva de forma corrente, digna e próxima do ge'ez.
theological_decisions:
- issue: Tradução do título divino
  choice: o Senhor do céu
  alternative: o Soberano do céu; o Senhor dos céus
  rationale: «Senhor» é a tradução natural do título de soberania divina, e o singular «céu» preserva diretamente a forma da expressão ge'ez sem impor uma formulação teológica distinta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente compreensível. A coordenação foi mantida, mas sem repetir desnecessariamente o pronome em cada oração.
