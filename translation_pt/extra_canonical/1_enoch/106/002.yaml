base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/002.yaml
  text: And his body was white like snow[a], and red like the blooming of a rose; and the hair of his head was like white wool, and his locks were beautiful. And his eyes were beautiful; and when he opened his eyes, he lit up the whole house like the sun[c][b], and the whole house became exceedingly bright.
translation:
  language: pt
  text: E seu corpo era branco como a neve e vermelho como uma rosa em flor[a]; os cabelos de sua cabeça eram como lã branca, e seus cachos eram belos. Seus olhos eram belos[b]; e, quando ele os abriu, iluminou toda a casa como o sol, e a casa inteira ficou intensamente iluminada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge'ez faz uma comparação floral ligada à cor vermelha. Também pode ser traduzida como “como a flor de uma rosa”.
    reason: lexical_alternative
  - marker: b
    text: A sequência ge'ez neste ponto é de interpretação difícil. O termo traduzido por “belos” também pode ter a nuance de “esplêndidos”; a tradução mantém a leitura em que ele qualifica os olhos.
    reason: textual_variant
lexical_decisions:
- source_word: ሥጋሁ
  choice: seu corpo
  rationale: O contexto descreve a aparência física visível como um todo; “corpo” é mais natural aqui do que “carne” e não introduz uma conotação teológica ausente.
- source_word: ጻዕዳ ከመ አስሐትያ
  choice: branco como a neve
  rationale: Preserva diretamente a comparação de cor e a imagem apocalíptica do texto.
- source_word: ቀይሕ ከመ ጽጌ ረዳ
  choice: vermelho como uma rosa em flor
  rationale: Expressa em português corrente a comparação floral ligada à vermelhidão, sem especificar além do que a expressão permite.
- source_word: ጸጕረ ርእሱ
  choice: os cabelos de sua cabeça
  rationale: Mantém a expressão plena e vívida do ge'ez, embora “seus cabelos” também fosse possível.
- source_word: ፀምር ጻዕዳ
  choice: lã branca
  rationale: Conserva tanto o material da comparação quanto a cor explicitamente atribuída a ele.
- source_word: ተወድምድማሁ
  choice: seus cachos
  rationale: Representa a referência às mechas ou cachos, elemento que não deve ser omitido; “madeixas” seria uma alternativa mais literária.
- source_word: ከሠተ አዕይንቲሁ
  choice: quando ele os abriu
  rationale: No contexto, o sentido idiomático é abrir os olhos; o pronome evita repetição pesada em português.
- source_word: አብርሀ ኵሎ ቤተ ከመ ፀሐይ
  choice: iluminou toda a casa como o sol
  rationale: Preserva a luminosidade física e extraordinária da cena, bem como a comparação explícita com o sol.
- source_word: ፈድፋደ በርሀ ኵሉ ቤት
  choice: a casa inteira ficou intensamente iluminada
  rationale: Transmite a intensificação do brilho sem enfraquecer a imagem concreta.
theological_decisions:
- issue: Preservação da luminosidade extraordinária do recém-nascido
  choice: Manter as descrições físicas concretas e afirmar que ele iluminou a casa como o sol.
  alternative: Generalizar a passagem como mera beleza ou glória incomum.
  rationale: A linguagem portentosa e apocalíptica do texto deve permanecer vívida, sem ser racionalizada nem convertida em abstração teológica.
- issue: Relação do adjetivo “belo” com os cachos e os olhos na sequência ge'ez
  choice: Traduzir os cachos como belos e conservar também a leitura tradicional de que os olhos eram belos, assinalando a dificuldade em nota.
  alternative: Aplicar “belos” somente aos cachos e ligar “seus olhos” diretamente à oração “quando os abriu”.
  rationale: A construção e a pontuação são difíceis, e a tradição textual consultada sustenta formulações concorrentes. A nota preserva a incerteza em vez de ocultá-la.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. Foram preservadas as repetições enfáticas de “toda a casa/a casa inteira” e as imagens apocalípticas concretas. “Cachos” foi preferido a “madeixas” por ser mais corrente, sem perder a referência específica às mechas do cabelo.
