base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/009.yaml
  text: And he answered me and said[a], “Because of a great trouble I have come to you[c][b], and because of a marvelous vision I have drawn near.”
translation:
  language: pt
  text: 'E ele me respondeu e disse: “Por causa de uma grande aflição[a], vim até você; e por causa de uma visão extraordinária, aproximei-me[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande ansiedade” ou “grande urgência”. O termo indica aflição ou pressão urgente.
    reason: lexical_alternative
  - marker: b
    text: Ou “cheguei perto”. O verbo significa aproximar-se e pode se sobrepor em sentido a “vim até você” na oração anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: me respondeu
  rationale: O verbo é o termo comum para responder, e o sufixo de objeto indica “me”.
- source_word: በእንተ
  choice: por causa de
  rationale: Neste contexto, a preposição introduz o motivo da vinda e da aproximação.
- source_word: ጻህቅ
  choice: aflição
  rationale: O termo deriva da ideia de estar ansioso, aflito ou premido pela urgência. “Aflição” expressa naturalmente o estado que motiva a visita, sem confundi-lo com ጽድቅ, “justiça/retidão”.
- source_word: ዐቢይ
  choice: grande
  rationale: Adjetivo comum que intensifica a aflição.
- source_word: መጻእኩ ኀቤከ
  choice: vim até você
  rationale: Reproduz de modo natural o verbo de vir seguido da expressão direcional “até você”.
- source_word: ራእይ
  choice: visão
  rationale: Preserva o sentido visionário e revelatório próprio do contexto apocalíptico.
- source_word: ዐፁብ
  choice: extraordinária
  rationale: Comunica o caráter admirável, espantoso ou fora do comum da visão em português atual.
- source_word: ቀረብኩ
  choice: aproximei-me
  rationale: Mantém o sentido próprio de chegar perto e também a distinção verbal em relação a “vim até você”.
theological_decisions:
- issue: Sentido de ጻህቅ
  choice: aflição
  alternative: justiça, retidão ou um justo
  rationale: A forma presente deve ser distinguida de ጽድቅ, termo ligado a justiça ou retidão. Traduzir aqui por “justiça” criaria uma leitura moral ou messiânica sem apoio lexical adequado.
- issue: Relação entre os dois motivos apresentados
  choice: 'manter duas orações paralelas: a aflição e a visão'
  alternative: fundir a aflição e a visão numa única causa
  rationale: A repetição de በእንተ e os dois verbos de movimento favorecem a preservação do paralelismo, sem decidir se a aflição foi causada pela visão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo do ge’ez foi preservado, enquanto “aproximei-me” mantém uma leve elevação apropriada ao discurso visionário.
