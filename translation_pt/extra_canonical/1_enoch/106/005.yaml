base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/005.yaml
  text: And he said to him[a], “I have begotten a strange son, and he is not like a human being; rather, he is like the children of the angels of heaven. And his nature is different, and he is not like us; and his eyes are like the rays of the sun[c][b], and his face is glorious.”
translation:
  language: pt
  text: 'E ele lhe disse: “Gerei um filho estranho[a], que não é como um ser humano; pelo contrário, é como os filhos dos anjos do céu[b]. Sua natureza é diferente, e ele não é como nós; seus olhos são como os raios do sol[c], e seu rosto é glorioso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um filho incomum”. O termo ge'ez ressalta que a criança é marcadamente diferente do normal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os filhos dos anjos do céu”. A expressão familiar preserva a comparação surpreendente feita por Lameque, em vez de reduzi-la a simplesmente “angelical”.
    reason: lexical_alternative
  - marker: c
    text: A expressão referente aos olhos os compara à luz emitida pelo sol; “feixes de luz do sol” é outra tradução possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለድኩ
  choice: Gerei
  rationale: A forma de primeira pessoa expressa gerar ou dar à luz. Na fala de Lameque, “gerei” preserva a afirmação de paternidade e o registro elevado sem soar excessivamente arcaico.
- source_word: ውሉጠ
  choice: estranho
  rationale: O termo destaca que o filho é marcadamente diferente do normal. “Estranho” preserva o espanto e a inquietação de Lameque sem decidir se essa diferença é admirável ou monstruosa.
- source_word: አኮኑ ከመ ሰብእ
  choice: não é como um ser humano
  rationale: A expressão contrasta a criança com a humanidade comum. “Ser humano” comunica essa oposição sem restringi-la desnecessariamente ao sexo masculino.
- source_word: ወይመ ስል
  choice: pelo contrário
  rationale: 'Introduz uma correção contrastiva enfática: a criança não se assemelha aos humanos, mas aos filhos dos anjos do céu.'
- source_word: ደቂቀ መላእክተ ሰማይ
  choice: os filhos dos anjos do céu
  rationale: Mantém a expressão filial explícita do ge'ez e sua força narrativa, em vez de reduzi-la ao adjetivo interpretativo “angelical”.
- source_word: ፍጥረቱ
  choice: sua natureza
  rationale: O substantivo pode indicar criação, forma, constituição ou natureza. Aqui, “natureza” exprime com clareza a constituição ou espécie singular da criança, preservando a força ontológica.
- source_word: ካልእት
  choice: diferente
  rationale: Empregado como predicativo da natureza da criança, o termo ressalta sua alteridade; “diferente” é a equivalência portuguesa mais natural.
- source_word: አዕይንቲሁ ከመ አገሪሁ ለፀሐይ
  choice: seus olhos são como os raios do sol
  rationale: A comparação parece referir-se à luz emitida pelo sol. “Raios do sol” conserva a imagem apocalíptica vívida e permanece natural em português.
- source_word: ገጹ ስቡሕ
  choice: seu rosto é glorioso
  rationale: O adjetivo denota glória, honra ou esplendor. “Glorioso” mantém o tom exaltado e não determina se a glória é apenas visual ou também ligada à condição da criança.
theological_decisions:
- issue: Se a comparação com “os filhos dos anjos do céu” deve ser suavizada para indicar apenas aparência angelical
  choice: Manter no texto principal a expressão familiar “os filhos dos anjos do céu”
  alternative: “os anjos do céu” ou “seres angelicais”
  rationale: O ge'ez emprega explicitamente uma expressão filial, e o contexto narrativo envolve inquietação quanto à origem incomum da criança. Suavizá-la eliminaria a tensão teológica e narrativa.
- issue: Se ሰብእ deve ser traduzido de modo especificamente masculino ou genérico
  choice: ser humano
  alternative: homem
  rationale: O contraste é entre a humanidade comum e a criança extraordinária, não entre pessoas do sexo masculino e a criança. A formulação genérica preserva melhor o sentido contextual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação e a repetição preservam o ritmo solene do relato, enquanto “pelo contrário” torna clara a progressão contrastiva. Os marcadores de nota foram posicionados junto às expressões que explicam.
