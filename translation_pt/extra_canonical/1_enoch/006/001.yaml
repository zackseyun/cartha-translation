base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/001.yaml
  text: And it came to pass[a], when the children of men had multiplied in those days, daughters were born to them, beautiful and comely.
translation:
  language: pt
  text: E aconteceu que, quando os filhos dos seres humanos[a] se multiplicaram naqueles dias, nasceram-lhes filhas belas e formosas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os filhos dos homens”. A expressão em ge’ez é uma designação convencional da humanidade e prepara o contraste com os Vigilantes nos versículos seguintes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮነ
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa que introduz um novo episódio, em linguagem elevada, porém corrente.
- source_word: እምዘ በዝኁ
  choice: quando ... se multiplicaram
  rationale: Expressa tanto a circunstância temporal quanto o aumento numérico indicado pela construção.
- source_word: ውሉደ ሰብእ
  choice: os filhos dos seres humanos
  rationale: Mantém a expressão antropológica e prepara o contraste com os seres celestes nos versículos seguintes, sem restringi-la indevidamente aos homens do sexo masculino.
- source_word: በእማንቱ መዋዕል
  choice: naqueles dias
  rationale: Reproduz a fórmula temporal típica da narrativa apocalíptica.
- source_word: ተወልዳ ሎሙ አዋልድ
  choice: nasceram-lhes filhas
  rationale: Conserva a relação de pertencimento expressa no texto e antecipa naturalmente o desenvolvimento do versículo seguinte.
- source_word: ሠናያት
  choice: belas
  rationale: Comunica de forma natural a beleza física indicada pelo primeiro adjetivo.
- source_word: ወላሕያት
  choice: formosas
  rationale: Preserva a descrição dupla e o tom literário sem fundir os dois adjetivos.
theological_decisions:
- issue: Expressão antropológica em contraste com os seres celestes
  choice: os filhos dos seres humanos
  alternative: os filhos dos homens
  rationale: A opção preserva a expressão relacional do ge'ez e o contraste contextual com os Vigilantes, sem sugerir que apenas descendentes masculinos se multiplicaram.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leve elevação própria da narrativa apocalíptica. A construção “nasceram-lhes” conserva concisão literária sem arcaísmo excessivo.
