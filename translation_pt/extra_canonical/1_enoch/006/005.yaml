  text: Then they all swore together and bound one another with a curse concerning it[a][b][c].
translation:
  language: pt
  text: Então, todos juraram juntos e vincularam-se uns aos outros sob maldição quanto a isso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e se comprometeram uns com os outros sob maldição quanto a isso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሜሃ
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e conciso.
- source_word: መሐሉ
  choice: juraram
  rationale: O verbo መሐለ significa prestar juramento; a escolha corrige a leitura inadequada como mero ato de falar e corresponde ao contexto do pacto.
- source_word: ኵሎሙ፡ ኅቡረ
  choice: todos ... juntos
  rationale: Mantém a dupla ênfase do texto na participação total e na ação coletiva.
- source_word: ወአውገዙ
  choice: e se vincularam ... por uma maldição
  rationale: O causativo አውገዘ expressa sujeição ou vinculação por maldição, não apenas um compromisso genérico.
- source_word: በበይናቲሆሙ
  choice: mutuamente
  rationale: 'Expressa de maneira idiomática a reciprocidade: cada um vinculou os demais e a si mesmo ao pacto.'
- source_word: ቦቱ
  choice: quanto a isso
  rationale: Retoma o plano mencionado no contexto sem especificar além do pronome do texto-fonte.
theological_decisions:
- issue: Explicitação da força imprecatória do pacto
  choice: se vincularam mutuamente por uma maldição
  alternative: se comprometeram uns com os outros sob maldição
  rationale: A formulação preserva tanto a reciprocidade quanto a força específica de maldição presente em ወአውገዙ, sem reduzir o ato a uma promessa comum.
- issue: Sentido de መሐሉ
  choice: juraram
  alternative: falaram
  rationale: A leitura 'juraram' é lexicalmente sustentada e coerente com o juramento proposto no versículo anterior; 'falaram' não preserva o sentido do verbo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. “Vincularam mutuamente” conserva a imagem jurídica e pactual do original; a nota oferece uma formulação mais idiomática sem enfraquecer a maldição.
