base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/006.yaml
  text: And all of them were two hundred[a], and they came down onto Ardis[b], which is the summit of Mount Hermon.
translation:
  language: pt
  text: E eram todos duzentos, e desceram em Ardis[a], que é o cume do monte Hermom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ardis” é um topônimo de forma incerta; o texto ge'ez o identifica com o cume do monte Hermom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ
  choice: todos eles
  rationale: Preserva a força coletiva explícita do sufixo pronominal e retoma naturalmente o grupo mencionado antes.
- source_word: ክልኤ ምእት
  choice: duzentos
  rationale: Expressão numérica direta; a forma concisa é clara e fiel.
- source_word: ወወረዱ
  choice: desceram
  rationale: Mantém o movimento para baixo e a dimensão vertical da narrativa dos Vigilantes em português natural e digno.
- source_word: ውስተ
  choice: sobre
  rationale: No contexto topográfico de um cume, indica chegada a uma superfície ou altura, evitando a ideia inadequada de entrar dentro do monte.
- source_word: አርዲስ
  choice: Ardis
  rationale: Translitera o topônimo em vez de traduzi-lo, preservando a forma atestada no ge'ez apesar da incerteza de vocalização.
- source_word: ዝውእቱ ድማኁ ለደብረ አርሞን
  choice: que é o cume do monte Hermom
  rationale: Conserva a oração relativa que identifica Ardis com o ponto mais alto do monte Hermom.
theological_decisions:
- issue: A descida dos Vigilantes
  choice: desceram
  alternative: baixaram / vieram para baixo
  rationale: “Desceram” preserva de modo direto o movimento cósmico de cima para baixo sem acrescentar linguagem doutrinária posterior.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom narrativo digno. Emprega “monte Hermom”, forma tradicional e reconhecível, e conserva o topônimo incerto “Ardis” com nota.
