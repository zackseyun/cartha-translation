revisions:
- from: E todos eles eram duzentos[a], e desceram sobre Ardis[b], que é o cume do monte Hermom.
  to: E eram todos duzentos, e desceram em Ardis[a], que é o cume do monte Hermom.
  rationale: A revisão desloca “todos” para deixar claro que o número se aplica ao conjunto dos personagens, não a cada um. Também substitui “sobre Ardis” por “em Ardis”, forma mais natural em português para a descida e chegada a uma localidade, preservando o movimento descendente expresso pelo verbo. Mantém-se a ambiguidade de transliteração do topônimo em nota.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:59:25Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a totalidade do grupo, a descida e a identificação de Ardis com o cume do monte Hermom. Contudo, “todos eles eram duzentos” pode sugerir, ainda que levemente, que cada indivíduo era duzentos; a ordem “eram todos duzentos” exprime sem ambiguidade o total coletivo de ኵሎሙ ክልኤ ምእት.
  naturalness: “Eram todos duzentos” é mais idiomático e claro. “Desceram em Ardis” é natural em português moderno para a chegada a esse lugar elevado, sem a conotação por vezes hostil de “desceram sobre”.
  terminology: “Ardis” deve permanecer transliterado e assinalado como topônimo de forma/vocalização incerta. “Monte Hermom” é uma forma portuguesa estabelecida e adequada. A nota numérica é dispensável, pois “duzentos” já é inequívoco na redação corrigida.
  issues:
  - severity: medium
    issue: Posição de “todos” em “todos eles eram duzentos”
    rationale: A construção é compreensível, mas é potencialmente distributiva ou menos precisa. O ge'ez apresenta o grupo inteiro como totalizando duzentos; “eram todos duzentos” reproduz essa força coletiva com clareza.
  - severity: low
    issue: Nota a sobre o numeral
    rationale: A nota apenas repete o sentido do numeral e deixa de ser necessária quando a formulação coletiva é corrigida. Sua remoção torna o aparato mais econômico sem perda de informação textual.
  revised_text: E eram todos duzentos, e desceram em Ardis[a], que é o cume do monte Hermom.
  revised_footnotes:
