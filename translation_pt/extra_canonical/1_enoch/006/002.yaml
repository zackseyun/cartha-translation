base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/002.yaml
  text: And the angels[a], the sons of heaven, saw them and desired them. And they said among themselves, “Come, let us choose for ourselves wives from the children of men[d][c][b], and let us beget children for ourselves.”
translation:
  language: pt
  text: 'E os anjos, os filhos do céu, viram-nas[a] e as desejaram. Então disseram entre si: “Venham, escolhamos para nós esposas dentre os filhos dos homens[b] e geremos filhos para nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “as” se refere às mulheres mencionadas no versículo anterior; o ge'ez não repete aqui a palavra “mulheres”.
    reason: cross_reference
  - marker: b
    text: Literalmente, “dentre os filhos dos homens”, expressão elevada que designa a humanidade e contrasta a descendência humana com os seres celestes desta narrativa. No contexto, as esposas escolhidas são mulheres humanas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርእዩ ኪያሆን
  choice: viram-nas
  rationale: Mantém o verbo narrativo direto e o objeto pronominal feminino plural, cujo referente são as mulheres mencionadas no versículo anterior.
- source_word: መላእክት ውሉደ ሰማያት
  choice: os anjos, os filhos do céu
  rationale: Preserva em aposição as duas designações explícitas do ge'ez, sem fundi-las nem omitir uma delas.
- source_word: ወፈተውዎን
  choice: e as desejaram
  rationale: Expressa desejo forte sem tornar a formulação mais sexualmente explícita do que o texto-fonte.
- source_word: በበይናቲሆሙ
  choice: entre si
  rationale: Forma natural e concisa em português para a fala recíproca dentro do grupo.
- source_word: ንዑ
  choice: Venham
  rationale: Reproduz a convocação exortativa dirigida pelos falantes uns aos outros.
- source_word: ንሕረይ ለነ አንስተ
  choice: escolhamos para nós esposas
  rationale: Conserva o sentido de escolher e a finalidade conjugal indicada pelo contexto.
- source_word: እምውሉደ ሰብእ
  choice: dentre as filhas dos seres humanos
  rationale: O substantivo 'esposas' requer aqui um grupo feminino como referente natural; 'seres humanos' comunica o sentido coletivo de humanidade sem usar 'homens' de modo potencialmente ambíguo. A nota registra a forma mais literal.
- source_word: ወንለድ ለነ ውሉደ
  choice: e geremos filhos para nós
  rationale: Verte de modo digno e corrente o sentido de procriar ou gerar descendência, preservando a repetição de 'para nós'.
theological_decisions:
- issue: Identificação dos seres como anjos e filhos do céu
  choice: 'Manter ambas as designações em aposição: “os anjos, os filhos do céu”'
  alternative: Reduzir a “anjos”, “filhos do céu” ou “anjos celestiais”
  rationale: O ge'ez traz explicitamente os dois títulos; mantê-los evita simplificar a caracterização sobrenatural do próprio texto.
- issue: Força sexual do verbo de desejo
  choice: “as desejaram”
  alternative: “cobiçaram-nas” ou “apaixonaram-se por elas”
  rationale: O contexto aponta para uma união ilícita, mas o verbo não exige nem a explicitação de luxúria nem a ideia romântica de paixão.
- issue: Expressão antropológica na origem das esposas
  choice: “dentre as filhas dos seres humanos” no texto, com a forma literal em nota
  alternative: “dentre os filhos dos homens”
  rationale: A redação principal deixa claro que as esposas são mulheres humanas, enquanto a nota conserva a expressão elevada e o contraste entre seres celestes e humanidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A ordem sintática identifica inequivocamente os anjos como sujeito. Mantiveram-se a aposição teológica, o pronome feminino e a repetição deliberada de “para nós”.
