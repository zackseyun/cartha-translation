base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/004.yaml
  text: And they all answered him and said[a], "Let us all swear an oath, and let us all bind one another with a curse, so that we do not turn back from this plan[b], but carry out this deed."
translation:
  language: pt
  text: 'E todos lhe responderam, dizendo[a]: “Juremos todos um juramento e sujeitemo-nos mutuamente a uma maldição, para que não voltemos atrás neste plano[b], mas realizemos este ato.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez emprega tanto “jurar um juramento” como “sujeitar-se mutuamente a uma maldição”, uma fórmula dupla que enfatiza a solenidade do pacto mútuo.
    reason: lexical_alternative
  - marker: b
    text: A frase final é repetitiva e apresenta dificuldade textual no testemunho (“este plano... este ato/ação”); a tradução preserva a passagem da deliberação à execução.
    reason: textual_variant
lexical_decisions:
- source_word: አውሥኡ
  choice: responderam
  rationale: Verbo narrativo que introduz a fala coletiva; mantém o tom formal do diálogo sem soar arcaico.
- source_word: መሐላ፡ ንምሐል
  choice: juremos ... um juramento
  rationale: Preserva a combinação enfática entre o substantivo e o verbo do ge'ez, embora a repetição seja marcada em português.
- source_word: ናውግዝ፡ ... በበይናቲነ
  choice: nos obriguemos uns aos outros sob maldição
  rationale: Expressa um pacto recíproco e autoimprecatório, mais forte que uma simples promessa ou maldição proferida contra terceiros.
- source_word: ከመ፡ ኢንምጠ
  choice: para que não voltemos atrás
  rationale: Conserva a ideia volitiva e direcional de recuar do compromisso já assumido.
- source_word: ለዛቲ፡ ምክር
  choice: neste plano
  rationale: No contexto, o termo designa a deliberação ou proposta coletiva; “plano” é claro e não acrescenta valoração moral além do texto.
- source_word: ንግብራ፡ ለዛቲ፡ [ምክር፡] ግብር
  choice: mas realizemos este ato
  rationale: Mantém o contraste entre deliberar e executar, ao mesmo tempo que verte naturalmente a formulação repetitiva e textualmente difícil do testemunho.
theological_decisions:
- issue: Natureza do juramento mútuo dos Vigilantes
  choice: Pacto vinculante reforçado por maldição recíproca
  alternative: Uma promessa simples ou uma maldição genérica
  rationale: A fórmula dupla de juramento e maldição apresenta uma conspiração solene e auto-obrigatória; essa gravidade jurídica e moral deve permanecer explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição pouco usual em “juremos... um juramento” foi mantida por corresponder à ênfase deliberada do original; “nos obriguemos... sob maldição” evita sugerir que eles apenas amaldiçoariam uns aos outros.
