base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/003.yaml
  text: And Semyaza[a], who was their leader, said to them, “I fear that you may not be willing to do this deed[b], and I alone will become liable for a great sin.”
translation:
  language: pt
  text: 'E Semiaza[a], que era o líder deles, disse-lhes: “Temo que vocês não estejam dispostos a realizar este ato e que somente eu tenha de responder[b] por um grande pecado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge’ez traduzida por “o líder deles” é, literalmente, mais próxima de “o anjo deles” ou “o mensageiro deles”; neste contexto, porém, identifica Semiaza como o chefe do grupo.
    reason: lexical_alternative
  - marker: b
    text: “Tenha de responder” também pode ser traduzido por “pague a pena” ou “seja responsabilizado”, pois o termo tem força jurídica e moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: Semiaza
  rationale: Transliteração clara do nome próprio em forma natural para leitores de português, sem traduzi-lo.
- source_word: መልአኮሙ
  choice: o líder deles
  rationale: Embora o termo esteja ligado literalmente a “anjo/mensageiro”, no contexto indica Semiaza como aquele que chefiava o grupo; a nota preserva a alternativa literal.
- source_word: እፈርህ
  choice: Temo
  rationale: Equivalente direto e digno do verbo na primeira pessoa, preservando a hesitação de Semiaza.
- source_word: ኢትፍቅዱ
  choice: vocês não estejam dispostos
  rationale: Expressa vontade ou consentimento, e não mera capacidade, mantendo o caráter apreensivo da oração.
- source_word: ይትገበር ዝንቱ ግብር
  choice: realizar este ato
  rationale: Reproduz de modo natural a ideia de efetuar a ação proposta, mantendo seu peso moral.
- source_word: ባሕቲትየ
  choice: somente eu
  rationale: Preserva a ênfase na responsabilidade solitária de Semiaza caso os demais desistam.
- source_word: ፈዳዪ
  choice: tenha de responder
  rationale: Comunica a força jurídico-moral de ser responsabilizado ou arcar com a pena sem definir além do que o termo permite.
- source_word: ለኃጢአት ዐባይ
  choice: por um grande pecado
  rationale: Tradução transparente que conserva a gravidade moral da expressão etíope.
theological_decisions:
- issue: Como descrever a posição de Semiaza perante os outros Vigilantes
  choice: o líder deles
  alternative: o anjo deles / o chefe deles
  rationale: O contexto apresenta Semiaza como cabeça do grupo. A tradução funcional evita sugerir, sem necessidade, que ele fosse um anjo pertencente aos demais, enquanto a nota conserva a forma mais literal.
- issue: Natureza da consequência temida por Semiaza
  choice: tenha de responder por um grande pecado
  alternative: pague a pena por um grande pecado / seja responsabilizado por um grande pecado
  rationale: A formulação mantém tanto a responsabilidade moral quanto a possível dimensão penal, sem resolver de modo indevido a amplitude do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e preserva em nota as ambiguidades lexicais relevantes do ge’ez.
