base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/001.yaml
  text: In those days[a], if a fierce fire descends upon you, where will you flee, and where will you be delivered? And when he lifts up his voice against you[d][c][b], will you not be shaken and fear?
translation:
  language: pt
  text: Naqueles dias, se um fogo terrível descer sobre vocês, para onde fugirão e onde serão libertos? E, quando ele levantar a sua voz contra vocês,[a] vocês não ficarão abalados e com medo?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando ele fizer ressoar a sua voz contra vocês”. A expressão descreve alguém emitindo ou erguendo a voz; no contexto, ela tem força de pronunciamento de juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'A pergunta é retórica: o sentido é que eles certamente ficarão abalados e com medo.'
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica recorrente em registro elevado, mas natural.
- source_word: ወረደ ዴቤክሙ
  choice: descer sobre vocês
  rationale: Mantém o movimento descendente e expressa de modo idiomático o objeto plural da ameaça.
- source_word: ዕፁብ እሳት
  choice: um fogo terrível
  rationale: O adjetivo pode indicar algo extraordinário, assombroso ou terrível; no contexto de juízo, “terrível” comunica tanto o caráter destrutivo quanto o assombro.
- source_word: በአይቴ ትነፍፁ
  choice: para onde fugirão
  rationale: Tradução direta e natural da pergunta retórica sobre fuga.
- source_word: በአይቴ ትድኅኑ
  choice: onde serão libertos
  rationale: Conserva o campo semântico de livramento sem restringi-lo a uma formulação doutrinária posterior.
- source_word: ይወዲ ቃሎ
  choice: ele levantar a sua voz
  rationale: Reflete a construção ativa, o sufixo possessivo de terceira pessoa masculina e o idioma de emitir ou erguer a voz.
- source_word: ዴቤክሙ
  choice: contra vocês
  rationale: Neste segundo uso, o sentido adversativo convém à voz pronunciada em juízo.
- source_word: አኮ ትትመሀከዉ
  choice: vocês não ficarão abalados
  rationale: Preserva a forma interrogativa negativa, que espera resposta afirmativa, e a ideia de perturbação intensa.
- source_word: ወትፈርሁ
  choice: e com medo
  rationale: Forma portuguesa natural em coordenação com “abalados”, mantendo o sentido simples do verbo de temer.
theological_decisions:
- issue: Se ቃሎ deve ser entendido como “palavra” judicial ou “voz” emitida por um sujeito masculino
  choice: “ele levantar a sua voz contra vocês”
  alternative: “a palavra dele vier contra vocês” ou “a sentença vier contra vocês”
  rationale: A gramática e o idioma favorecem uma ação transitiva de um sujeito masculino e “sua voz”. O contexto mantém implícita a força judicial sem transformar o substantivo em “sentença”.
- issue: Força da pergunta negativa final
  choice: 'Manter a pergunta retórica: “vocês não ficarão...?”'
  alternative: 'Converter em afirmação: “certamente ficarão...”'
  rationale: A pergunta do texto-fonte comunica certeza retórica, mas sua forma deve ser preservada para não eliminar a tensão e a vivacidade do aviso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e conserva a cadência interrogativa e o tom apocalíptico do texto.
