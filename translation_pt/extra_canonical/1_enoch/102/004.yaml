base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/004.yaml
  text: Do not fear[a], you souls of the righteous, and hope, you who have died in righteousness.
translation:
  language: pt
  text: Não tenham medo, almas dos justos[a], e tenham esperança, vocês que morreram em retidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espíritos dos justos”. O termo ge'ez pode designar alma, vida, pessoa ou espírito, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: አትፍርሁ
  choice: Não tenham medo
  rationale: Imperativo negativo no plural; a formulação é direta, natural em português moderno e preserva a força exortativa.
- source_word: አንትሙ
  choice: vocês
  rationale: O pronome explícito da segunda pessoa do plural é representado para manter a ênfase do chamado aos destinatários.
- source_word: ነፍሰ ጻድቃን
  choice: almas dos justos
  rationale: ነፍስ pode significar alma, vida, pessoa ou espírito. Neste contexto de exortação após a morte, “almas” preserva a referência aos justos falecidos sem impor uma distinção antropológica mais técnica do que o texto permite.
- source_word: ወተስፈዉ
  choice: tenham esperança
  rationale: Expressa naturalmente em português a exortação a esperar e mantém o paralelismo imperativo com “Não tenham medo”.
- source_word: እለ ሞትክሙ
  choice: vocês que morreram
  rationale: Reproduz a construção relativa com referência direta à segunda pessoa do plural.
- source_word: በጽድቅ
  choice: em justiça
  rationale: Mantém a forma nominal e deixa visível o termo teológico, sem reduzi-lo ao advérbio “justamente”.
theological_decisions:
- issue: Termo antropológico aplicado aos justos falecidos
  choice: almas dos justos
  alternative: espíritos dos justos
  rationale: “Almas” comunica a identidade continuada dos destinatários após a morte, mas a nota preserva a amplitude lexical do ge'ez e evita estabelecer uma distinção técnica entre alma e espírito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “vocês” conserva a ênfase do endereço plural e distingue os dois segmentos exortativos.
