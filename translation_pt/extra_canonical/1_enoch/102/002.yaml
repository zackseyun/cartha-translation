base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/002.yaml
  text: And all the luminaries shall be shaken with great fear[b][a], and the whole earth shall be shaken and tremble and quake.
translation:
  language: pt
  text: E todos os luminares[a] serão abalados com grande temor; toda a terra será abalada, tremerá e ficará aterrorizada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “luzes”. O termo etíope pode designar coisas luminosas em geral, mas aqui provavelmente se refere aos corpos celestes.
    reason: lexical_alternative
  - marker: b
    text: A forma preservada na transcrição parece estar corrompida. A leitura etíope provável significa “ficará aterrorizada” ou “ficará alarmada”; outra interpretação entende aqui uma intensificação do tremor físico.
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎሙ ብርሃናት
  choice: todos os luminares
  rationale: ብርሃናት designa luzes ou corpos luminosos. No cenário cósmico do versículo, “luminares” comunica de modo natural a provável referência aos astros sem excluir por completo o sentido mais amplo de “luzes”.
- source_word: ይትመሀከዉ / ትትመሀከው
  choice: serão abalados / será abalada
  rationale: A repetição do mesmo verbo no texto etíope cria um paralelo entre os luminares e a terra. Repetir “abalados/abalada” preserva essa estrutura e a imagem de perturbação cósmica.
- source_word: በፍርሀት ዐቢይ
  choice: por grande temor
  rationale: A expressão associa o abalo ao medo intenso. “Por grande temor” preserva a possível força causal da preposição e soa digna e clara em português.
- source_word: ኵላ ምድር
  choice: toda a terra
  rationale: O contexto de juízo cósmico favorece “terra” em sentido universal, e não “região” ou “país”.
- source_word: ትርዕድ
  choice: tremerá
  rationale: O verbo acrescenta uma ação distinta ao abalo já mencionado; “tremerá” mantém a progressão e a vivacidade da imagem.
- source_word: ወትኜጕድ (provável corrupção textual/OCR de ወትደነግፅ)
  choice: e ficará aterrorizada
  rationale: A forma transcrita é provavelmente resultado de reconhecimento defeituoso. A leitura etíope plausível ወትደነግፅ expressa terror ou alarme e explica a personificação da terra, em paralelo com o “grande temor” dos luminares.
theological_decisions:
- issue: Se ብርሃናት se refere a seres angélicos ou a corpos celestes
  choice: luminares, provavelmente corpos celestes
  alternative: luzes em geral ou seres resplandecentes de natureza angélica
  rationale: A associação imediata com toda a terra e o quadro de perturbação cósmica favorecem os corpos celestes. “Luminares” conserva alguma amplitude sem impor uma identificação angélica.
- issue: Se a ação final descreve apenas movimento físico ou terror personificado
  choice: a terra fica aterrorizada
  alternative: a terra estremece ou se convulsiona
  rationale: A provável leitura corrigida do verbo final pertence ao campo do medo e do alarme. Essa escolha preserva a personificação apocalíptica e o paralelo com o grande temor da primeira oração, sem reduzir toda a sequência a movimento sísmico.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. O futuro verbal mantém o tom profético, e a personificação da terra é conservada em vez de ser explicada ou suavizada.
