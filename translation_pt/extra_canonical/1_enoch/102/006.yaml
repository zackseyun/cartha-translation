base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/006.yaml
  text: And when you die[a], the sinners will say concerning you[b],
translation:
  language: pt
  text: E, quando vocês morrerem, os pecadores dirão a respeito de vocês:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os pecadores falarão contra vocês». A expressão traduzida por «a respeito de vocês» é, mais literalmente, «sobre vocês» e pode ter sentido hostil neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: E, quando
  rationale: A conjunção temporal com waw introduz a circunstância seguinte; «E, quando» preserva tanto a ligação com o contexto quanto o valor temporal.
- source_word: ትመውቱ
  choice: vocês morrerem
  rationale: O verbo está na segunda pessoa do plural e deriva da raiz comum para «morrer». O futuro do subjuntivo é a forma natural em português depois de «quando» para uma ocorrência futura.
- source_word: ይብሉ
  choice: dirão
  rationale: O verbo significa basicamente «dizer» e aqui funciona como fórmula que introduz a fala subsequente dos pecadores.
- source_word: ላዕሌክሙ
  choice: a respeito de vocês
  rationale: A preposição tem sentido amplo, literalmente «sobre», e neste quadro de fala indica com naturalidade o assunto do que será dito, sem excluir por nota a possível nuance hostil.
- source_word: ኃጥኣን
  choice: os pecadores
  rationale: Mantém a categoria moral recorrente da literatura apocalíptica e soa natural em português com o artigo definido.
theological_decisions:
- issue: Sentido da fala dos pecadores acerca dos destinatários
  choice: os pecadores dirão a respeito de vocês
  alternative: os pecadores falarão contra vocês
  rationale: A construção pode admitir uma nuance hostil no contexto, mas o verbo é uma fórmula comum de citação e a preposição também pode marcar o tema da fala. A tradução principal preserva essa função introdutória, enquanto a nota registra a leitura adversativa possível sem torná-la obrigatória.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para a segunda pessoa do plural. O dois-pontos indica que a frase introduz a fala que vem em seguida no contexto, sem tratar este fragmento como uma declaração concluída.
