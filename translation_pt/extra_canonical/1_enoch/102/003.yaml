base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/003.yaml
  text: And all the angels will carry out their commands[a], and they will seek to hide themselves from before the Great Glory; and the children of the earth will tremble and be thrown into confusion. But you sinners are accursed forever[d][c][b], and there will be no peace for you.
translation:
  language: pt
  text: E todos os anjos cumprirão a ordem deles e procurarão esconder-se de diante da Grande Glória[a]; os filhos da terra[b] tremerão e serão tomados de confusão. Mas vocês, pecadores, são amaldiçoados para sempre, e não haverá paz para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Grande Glória” provavelmente funciona aqui como título reverente para a presença ou majestade divina; o texto não diz explicitamente “Deus”.
    reason: theological_ambiguity
  - marker: b
    text: Expressão literal. “Filhos da terra” pode referir-se de modo amplo aos habitantes da terra, especialmente à humanidade sob juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእክት
  choice: anjos
  rationale: O contexto apocalíptico indica seres celestiais, e não mensageiros humanos.
- source_word: ይፌጽሙ ትእዛዞሙ
  choice: cumprirão a ordem deles
  rationale: O verbo expressa execução ou cumprimento. A forma nominal é singular com sufixo de terceira pessoa do plural, por isso se preserva “a ordem deles”, apesar da consulta inglesa oscilar entre singular e plural.
- source_word: ይፈቅዱ ከመ ይትኀብኡ
  choice: procurarão esconder-se
  rationale: O verbo pode significar desejar ou querer; seguido do ato de esconder-se, a formulação portuguesa comunica naturalmente a intenção ou tentativa.
- source_word: እምቅድመ ዐቢይ ስብሐት
  choice: de diante da Grande Glória
  rationale: “De diante de” conserva a expressão semítica de afastamento da presença, enquanto as maiúsculas refletem o provável uso titular da expressão.
- source_word: ደቂቀ ምድር
  choice: os filhos da terra
  rationale: Mantém a imagem filial característica da linguagem apocalíptica, sem reduzi-la interpretativamente a “habitantes” ou “humanidade”.
- source_word: ይትሀወኩ
  choice: serão tomados de confusão
  rationale: A expressão comunica perturbação, tumulto e desorientação provocados pelo juízo.
- source_word: ርጉማን ለዓለም
  choice: amaldiçoados para sempre
  rationale: Preserva de modo direto e solene a fórmula de condenação duradoura.
- source_word: ወአልብክሙ ሰላመ
  choice: e não haverá paz para vocês
  rationale: Formulação clara e direta que mantém a segunda pessoa do plural dirigida aos pecadores.
theological_decisions:
- issue: Referente de “Grande Glória”
  choice: Manter a circunlocução como título, “Grande Glória”
  alternative: Explicitar “Deus” ou entender a expressão apenas como esplendor celestial abstrato
  rationale: No contexto enoquiano, a expressão provavelmente designa a presença ou majestade divina, mas o texto não nomeia Deus diretamente. A tradução conserva essa tensão e não substitui a circunlocução por uma identificação explícita.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com legibilidade brasileira. Conservam-se a imagem apocalíptica “filhos da terra”, a expressão semítica “de diante de” e a circunlocução titular “Grande Glória”. Usa-se “vocês” para uma segunda pessoa plural natural no português brasileiro contemporâneo.
