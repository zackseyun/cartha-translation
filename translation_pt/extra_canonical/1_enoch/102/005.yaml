base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/005.yaml
  text: And do not grieve if your soul has gone down into Sheol in sorrow[a], and your flesh did not fare according to your goodness during your life; but wait for the day of the judgment of sinners[c][b], and for the day of curse and punishment.
translation:
  language: pt
  text: E não se entristeçam se a alma de vocês desceu ao Sheol[a] em tristeza e, durante a vida, sua carne não recebeu o que correspondia à sua bondade[b]. Pelo contrário, esperem pelo dia do julgamento dos pecadores e pelo dia de maldição e castigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sheol” designa o domínio dos mortos na tradição judaica; não equivale necessariamente ao conceito cristão posterior de inferno.
    reason: cultural_note
  - marker: b
    text: Literalmente, “sua carne não recebeu, durante a vida, segundo sua bondade”. O ge'ez não declara o objeto de “recebeu”; o sentido provável é que, nesta vida, eles não receberam o que correspondia à sua bondade.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: አት ኅዘኑ
  choice: não se entristeçam
  rationale: Expressa a proibição dirigida ao grupo em português natural, preservando a força emocional do verbo.
- source_word: ወረደት ነፍስክሙ ውስተ ሲኦል
  choice: a alma de vocês desceu ao Sheol
  rationale: Mantém tanto o movimento explícito de descida quanto o nome tradicional Sheol, sem o equiparar à sepultura ou ao inferno.
- source_word: በሐዘን
  choice: em tristeza
  rationale: Conserva o eco lexical e temático da ordem anterior para não se entristecerem.
- source_word: ኢረከበ ሥጋክሙ በሕይወትክሙ
  choice: durante a vida, sua carne não recebeu
  rationale: Preserva 'carne' e o verbo 'receber'; a continuação explicita apenas o complemento exigido pelo português, deixando sua natureza sem definição específica.
- source_word: በከመ ኂሩትክሙ
  choice: o que correspondia à sua bondade
  rationale: Comunica a ideia de correspondência com a bondade dos destinatários sem especificar se se trata de recompensa, prosperidade ou outra forma de retribuição.
- source_word: አላ ጽንሑ
  choice: Pelo contrário, esperem
  rationale: Marca a virada adversativa e expressa uma espera perseverante pelos dias futuros mencionados em seguida.
- source_word: ለዕለተ እንተ ኵነኔ ኃጥኣን
  choice: pelo dia do julgamento dos pecadores
  rationale: Conserva a fórmula apocalíptica formal e mantém explícitos os pecadores como alvo do julgamento.
- source_word: መርገም ወመቅሠፍት
  choice: maldição e castigo
  rationale: Reproduz de modo compacto o par judicial sem restringir o segundo termo a uma modalidade específica de sofrimento.
theological_decisions:
- issue: Sentido de ሲኦል
  choice: Sheol
  alternative: sepultura; mundo dos mortos; inferno
  rationale: A transliteração preserva o conceito judaico tradicional do domínio dos mortos e evita identificá-lo indevidamente com concepções cristãs posteriores do inferno.
- issue: Objeto implícito do verbo 'receber'
  choice: o que correspondia à sua bondade
  alternative: a recompensa merecida por sua bondade; foi tratada segundo sua bondade
  rationale: O contexto sugere que os justos não obtiveram em vida uma retribuição correspondente à sua bondade, mas o objeto não é declarado no ge'ez. A formulação mantém indefinido aquilo que não receberam.
- issue: Alvo do julgamento
  choice: julgamento dos pecadores
  alternative: dia em que os pecadores serão julgados
  rationale: A forma nominal conserva a concisão e a solenidade apocalíptica do texto, sem alterar o sentido judicial.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento na terceira pessoa do plural ('vocês') para ampla legibilidade brasileira. 'Carne' foi mantido por seu peso imagético e teológico; 'Sheol' foi transliterado e explicado em nota. A sintaxe foi levemente reorganizada para soar natural sem eliminar a ambiguidade do objeto não expresso no original.
