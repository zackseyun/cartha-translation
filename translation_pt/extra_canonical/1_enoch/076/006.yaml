base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/006.yaml
  text: And through the second middle gate abundance comes out[a], and from it come rain and fruit and peace and dew; and through the third gate, which is toward the south[c][b], frost comes out and dryness.
translation:
  language: pt
  text: E pela segunda porta central sai a abundância[a]; dela saem a chuva, o fruto, a paz e o orvalho. E pela terceira porta, voltada para o sul, saem a geada e a secura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo também pode exprimir «amplitude» ou «largueza». Pode ser confundido com uma forma semelhante entendida como «fome», o que tornaria abrupta a sequência antes de «chuva, fruto, paz e orvalho».
    reason: textual_variant
  - marker: b
    text: Ou «aridez».
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: porta
  rationale: Preserva a imagem cosmológica das aberturas celestes e corresponde ao uso recorrente do termo no Livro Astronômico.
- source_word: ማእከላዊት
  choice: do meio
  rationale: Expressa de modo natural a posição central da porta dentro da série.
- source_word: ርኅብ
  choice: abundância
  rationale: A leitura transmitida aponta para amplitude ou abundância, e o contexto subsequente de chuva, fruto, paz e orvalho favorece «abundância»; evita-se confundi-la com a forma semelhante que significa «fome».
- source_word: ዝናም
  choice: chuva
  rationale: Equivalente meteorológico direto e corrente.
- source_word: ፍሬ
  choice: fruto
  rationale: Mantém a concretude do termo, que no contexto também pode abranger a produção da terra.
- source_word: ሠላም
  choice: paz
  rationale: Preserva o sentido principal e a possível amplitude de bem-estar sem restringi-lo a «prosperidade».
- source_word: ጤለ
  choice: orvalho
  rationale: Equivalente específico e natural no contexto agrícola e meteorológico.
- source_word: መንገለ መስዕ
  choice: voltada para o sul
  rationale: Traduz a orientação espacial de forma idiomática em português.
- source_word: ቍር
  choice: geada
  rationale: No contexto climático, designa mais naturalmente a geada do que o frio em sentido genérico.
- source_word: የብስ
  choice: secura
  rationale: Mantém o sentido amplo de falta de umidade, sem intensificá-lo necessariamente para «seca».
theological_decisions:
- issue: Preservação da imagem das portas cósmicas
  choice: Manter «porta» e o movimento de coisas que «saem» por elas
  alternative: Usar «abertura» e reformular como «produz» ou «traz»
  rationale: O texto descreve um cosmos estruturado em que fenômenos saem por portas celestes; conservar essa imagem evita reduzir a linguagem apocalíptica a uma explicação meteorológica comum.
- issue: Sequência de benefícios que saem da porta
  choice: Conservar a enumeração «chuva, fruto, paz e orvalho»
  alternative: Explicitar uma relação causal ou substituir «paz» por «prosperidade»
  rationale: A formulação da fonte é enumerativa e permite mais de uma relação conceitual entre os itens; a tradução não deve resolver essa tensão silenciosamente.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe clara e repetição moderada. «Porta», «saem» e a lista dos fenômenos preservam a concretude da cosmologia da obra; «secura» evita o regionalismo ou a intensificação potencial de «seca».
