base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/005.yaml
  text: And the first wind goes out from those gates[a], whose name is the east wind, through the first gate that is toward the east; and turning toward the south, from it come forth desolation, drought, death[c][b], and destruction.
translation:
  language: pt
  text: E o primeiro vento sai daqueles portões, chamado vento oriental, pelo primeiro portão voltado para o leste; e, voltando-se para o sul[a], dele procedem desolação, seca, morte[b] e destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge'ez é difícil; também pode ser traduzida como “inclinando-se para o sul” ou “virando para o sul”.
    reason: lexical_alternative
  - marker: b
    text: O texto transmitido diz “morte”. Algumas leituras anteriores propuseram “calor” ou “calor abrasador” por causa do contexto climático, mas isso exige corrigir o termo ge'ez preservado.
    reason: textual_variant
lexical_decisions:
- source_word: ወይወፅእ
  choice: e ... sai
  rationale: Preserva a fórmula de movimento para fora dos portões em português direto e natural.
- source_word: ቀዳማይ ነፋስ
  choice: o primeiro vento
  rationale: Mantém a ordem explícita do catálogo dos ventos.
- source_word: እምእልክቱ ኃዋሳው
  choice: daqueles portões
  rationale: Conserva tanto o plural cosmográfico quanto o valor demonstrativo da expressão.
- source_word: ዘስሙ ጽባሓይ
  choice: chamado vento oriental
  rationale: Expressa naturalmente em português a fórmula de nomeação e identifica a direção do vento.
- source_word: በቀዳሚት ኆኅት
  choice: pelo primeiro portão
  rationale: Mantém a imagem recorrente dos portões e a sequência ordinal.
- source_word: እንተ መንገለ ጽባሕ
  choice: voltado para o leste
  rationale: Reproduz o sentido direcional de መንገለ sem introduzir a ideia mais literal, porém enganosa em português, de um caminho.
- source_word: ታጸንኑ ለአዜብ
  choice: desviando-se para o sul
  rationale: Preserva a noção de inclinação ou mudança direcional, deixando a dificuldade lexical registrada em nota.
- source_word: ድምሳሴ
  choice: desolação
  rationale: Mantém o tom grave e apocalíptico da consequência descrita.
- source_word: ናብስት
  choice: seca
  rationale: É a expressão portuguesa concreta e natural para a calamidade climática indicada.
- source_word: ሞት
  choice: morte
  rationale: Traduz diretamente o substantivo ge'ez transmitido, sem substituí-lo por uma conjectura meteorológica.
- source_word: ሐጕል
  choice: destruição
  rationale: Conserva o sentido amplo e ominoso do último termo da série.
theological_decisions:
- issue: Apresentar a passagem como meteorologia neutra ou como cosmologia apocalíptica de consequências calamitosas
  choice: Manter a sequência de calamidades, inclusive a morte, no âmbito da ordem cósmica apocalíptica
  alternative: Reduzir a lista a efeitos climáticos comuns ou emendar “morte” para “calor”
  rationale: O texto transmitido contém ሞት, “morte”, e a linguagem do Livro Astronômico atribui aos ventos efeitos destrutivos; não se deve suavizar essa tensão para obter uniformidade meteorológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Portões” preserva a imagem cosmográfica; “vento oriental” é natural e inequívoco. A sintaxe conserva o movimento sequencial do original sem artificialidade excessiva.
