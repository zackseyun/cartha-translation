base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/002.yaml
  text: Three of them are open at the face of heaven[a], and three in the west, and three at the right of heaven[c][b], and three at the left.
translation:
  language: pt
  text: Três delas estão abertas na face do céu[a], três no oeste, três à direita do céu[b] e três à esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na parte da frente do céu”. A expressão também pode ter valor direcional, possivelmente indicando o leste.
    reason: lexical_alternative
  - marker: b
    text: “À direita” e “à esquerda” podem corresponder, conforme a orientação cósmica pressuposta, ao sul e ao norte.
    reason: cultural_note
lexical_decisions:
- source_word: ፫እም ኔሆሙ
  choice: Três delas
  rationale: O numeral e o elemento partitivo retomam as portas anteriormente mencionadas. Em português, “três delas” expressa essa referência de modo natural e conciso.
- source_word: ርኅዋት
  choice: estão abertas
  rationale: O termo descreve as portas em estado de abertura, e não aberturas abstratas.
- source_word: በገጸ ሰማይ
  choice: na face do céu
  rationale: Mantém a imagem espacial corporificada do ge'ez e sua ambiguidade, sem substituir silenciosamente a expressão por uma direção cardinal.
- source_word: በምዕራብ
  choice: no oeste
  rationale: Tradução direta e idiomática do termo direcional.
- source_word: በየማነ ሰማይ
  choice: à direita do céu
  rationale: Preserva a expressão espacial literal e sua possível implicação direcional sem interpretá-la no corpo do texto.
- source_word: በፀጋም
  choice: à esquerda
  rationale: Conserva o paralelismo com “à direita”; o complemento “do céu” permanece naturalmente subentendido.
theological_decisions:
- issue: Normalização da linguagem corporal cósmica em direções cardeais
  choice: Manter “face”, “direita” e “esquerda” no texto principal
  alternative: Traduzir como “leste”, “sul” e “norte”
  rationale: O ge'ez apresenta o cosmos por meio de relações espaciais corporificadas. A tradução preserva essa imagem e deixa em aberto sua correspondência com os pontos cardeais.
translation_notes:
  register: Português moderno, claro e digno. A construção mantém a repetição enumerativa do original, mas omite conjunções excessivas onde o português as dispensa naturalmente. “Céu” preserva a imagem cosmológica sem impor uma interpretação técnica moderna.
