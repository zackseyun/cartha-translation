base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/009.yaml
  text: And through the third opening[a], toward the west, there come out from it dew and rain[b], and frost and destruction.
translation:
  language: pt
  text: E pela terceira abertura, voltada para o oeste, saem dela orvalho e chuva, geada[a] e destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gafanhotos”. O sentido do termo etíope é discutido neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት
  choice: terceira
  rationale: Ordinal que modifica “abertura”.
- source_word: ኆኅት
  choice: abertura
  rationale: Preserva a imagem de uma abertura celeste sem especificar uma estrutura como porta ou janela.
- source_word: መንገለ ምዕራብ
  choice: voltada para o oeste
  rationale: Expressa de modo natural a orientação espacial da abertura.
- source_word: ይወፅእ እምኔሃ
  choice: saem dela
  rationale: Mantém a imagem concreta de fenômenos que emergem da abertura; a concordância plural segue a lista em português.
- source_word: ጤለ
  choice: orvalho
  rationale: Neste contexto e à luz do uso nos versículos próximos, designa orvalho.
- source_word: ዝናም
  choice: chuva
  rationale: Equivalente direto e corrente do termo etíope.
- source_word: አናጽዕ
  choice: geada
  rationale: A evidência fornecida diverge entre “geada” e “gafanhotos”; o contexto meteorológico e a revisão mais recente favorecem “geada”, com a alternativa preservada em nota.
- source_word: ደምሳሴ
  choice: destruição
  rationale: Reflete o sentido de destruição ou desolação ligado à raiz etíope, evitando a leitura meteorológica anterior “neve”.
theological_decisions:
- issue: Sequência de dádivas e calamidades
  choice: Preservar “destruição” como item distinto na lista
  alternative: Harmonizar toda a lista como fenômenos meteorológicos
  rationale: O texto permite uma tensão entre fenômenos benéficos e calamitosos; não se deve nivelá-la por pressuposição contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Voltada para o oeste” evita a construção menos idiomática “em direção ao oeste”, e a nota conserva a incerteza lexical real.
