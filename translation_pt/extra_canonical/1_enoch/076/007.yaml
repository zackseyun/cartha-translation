base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/007.yaml
  text: And after these winds[a], by the way of the south they go out through two gates; through the first gate, which inclines toward the east[c][b], there comes out a wind of death.
translation:
  language: pt
  text: E depois desses ventos, eles saem pelo caminho do sul, através de duas portas; pela primeira porta, que se inclina para o leste, sai um vento de morte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um vento mortal”. A tradução mais literal, “um vento de morte”, preserva a linguagem cósmica e sombria da passagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ እሉ ነፋሳት
  choice: E depois desses ventos
  rationale: Mantém a sequência temporal e a referência imediata aos ventos anteriormente descritos.
- source_word: መንገለ አዜብ
  choice: pelo caminho do sul
  rationale: Preserva a imagem concreta de caminho ou direção no esquema cosmológico, sem reduzi-la apenas a um ponto cardeal.
- source_word: ይወፅኡ
  choice: eles saem
  rationale: Verbo comum de movimento para fora; o pronome retoma naturalmente os ventos em português.
- source_word: በ፪ኆኅት
  choice: através de duas portas
  rationale: ኆኅት designa uma abertura ou passagem; 'portas' comunica de modo claro a arquitetura cósmica do trecho e acompanha a revisão textual fornecida.
- source_word: ቀዳሚት ኆኅት
  choice: pela primeira porta
  rationale: Reproduz diretamente o ordinal feminino que concorda com a palavra para porta ou abertura.
- source_word: እምኔሆን እንተ ታጸንኑ ለመንገለ ምሥራቅ
  choice: que se inclina para o leste
  rationale: Segue a análise revisada segundo a qual o relativo feminino singular modifica 'a primeira porta'; evita a antiga leitura plural 'daquelas que ficam'.
- source_word: ነፋስ ሞት
  choice: um vento de morte
  rationale: Conserva a construção nominal e a força sombria da imagem apocalíptica, sem a reduzir ao adjetivo 'mortal'.
theological_decisions:
- issue: Se ነፋስ ሞት deve ser vertido por uma expressão nominal ou por um adjetivo idiomático
  choice: um vento de morte
  alternative: um vento mortal
  rationale: A expressão nominal preserva a classificação e a personificação cósmica dos ventos, bem como a tensão ominosa do texto, sem impor uma explicação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, mas a repetição de 'porta' e a imagem 'vento de morte' foram mantidas por fidelidade ao texto.
