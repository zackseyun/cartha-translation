base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/003.yaml
  text: And the first three are toward the east[a], and three toward the north, and three after these, on the left, toward the south[c][b], and three toward the west.
translation:
  language: pt
  text: E os três primeiros ficam em direção ao leste, três em direção ao norte, três depois destes, à esquerda, em direção ao sul[a], e três em direção ao oeste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “depois destes, à esquerda” está entre colchetes no testemunho etíope fornecido, o que indica incerteza textual. Além disso, numa orientação antiga em que se olha para o leste, a esquerda normalmente corresponde ao norte, não ao sul; a tradução preserva a leitura do texto sem harmonizá-la.
    reason: textual_variant
  - marker: b
    text: 'Outra tradução anteriormente proposta reorganizava os pontos cardeais assim: “E três deles ficam do lado leste, três do lado sul e, depois destes, à esquerda, três do lado norte e três do lado oeste”. Essa forma, porém, omite “primeiros” e harmoniza a sequência mediante a troca de norte e sul.'
    reason: previous_rendering
lexical_decisions:
- source_word: ቀዳማያት
  choice: os três primeiros
  rationale: O termo significa literalmente “primeiros” e deve ser preservado, em vez de ser transformado numa designação do lado oriental.
- source_word: መንገለ
  choice: em direção a
  rationale: Na enumeração dos pontos cardeais, expressa orientação espacial; “em direção a” é natural e mantém o movimento relacional do texto.
- source_word: ጽባሕ
  choice: leste
  rationale: Embora ligado literalmente à manhã ou ao nascer do sol, aqui designa o ponto cardeal leste.
- source_word: መስዕ
  choice: norte
  rationale: A evidência lexical adotada na revisão identifica o termo como norte; a tradução não o troca para harmonizar a frase seguinte.
- source_word: በድኅረ እሉ
  choice: depois destes
  rationale: Preserva a sequência explícita da enumeração.
- source_word: በፀጋም
  choice: à esquerda
  rationale: Conserva a orientação corporal presente no testemunho, mesmo produzindo tensão com o ponto cardeal subsequente.
- source_word: አዜብ
  choice: sul
  rationale: A evidência lexical adotada na revisão identifica o termo como sul; sua aparente tensão com “à esquerda” é mantida.
- source_word: ዓረብ
  choice: oeste
  rationale: Embora relacionado ao entardecer ou pôr do sol, no contexto designa claramente o oeste.
theological_decisions:
- issue: Preservar ou harmonizar a tensão entre “à esquerda” e “sul”
  choice: Manter “à esquerda” junto de “sul”
  alternative: Eliminar a orientação relativa ou trocar norte e sul para obter uma sequência espacial harmoniosa
  rationale: O testemunho fornecido contém ambos os elementos. A tradução preserva a tensão textual e cosmológica sem corrigi-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com estrutura enumerativa próxima do ge'ez. Repetiu-se “em direção a” onde necessário para conservar o paralelismo, sem suavizar a dificuldade interna do testemunho.
