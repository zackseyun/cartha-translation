base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/008.yaml
  text: And through the middle opening[a], which is beside it, there come out from it a pleasant fragrance, and dew, and rain, and peace[c][b], and life.
translation:
  language: pt
  text: E pela abertura central, que fica ao lado dela, saem dela uma fragrância agradável[a], orvalho, chuva, paz[b] e vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um bom aroma”. A expressão em ge’ez combina um substantivo que significa odor ou fragrância com um adjetivo que significa “bom” ou “agradável”.
    reason: lexical_alternative
  - marker: b
    text: “Paz” também pode incluir a ideia de bem-estar ou integridade, e não apenas a ausência de conflito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: abertura
  rationale: Termo amplo e natural para uma abertura ou passagem, sem especificar demais como “janela” ou “portão”.
- source_word: እንተ ኃቤሃ ማእከላዊት
  choice: central, que fica ao lado dela
  rationale: A forma feminina de “central” modifica “abertura”, enquanto o sufixo pronominal feminino em ኃቤሃ é preservado por “dela”, remetendo à abertura mencionada anteriormente.
- source_word: ይወፅእ እምኔሃ
  choice: saem dela
  rationale: Expressa que os elementos enumerados procedem da abertura; o plural é exigido naturalmente em português pela enumeração composta.
- source_word: መዐዛ ሠናይ
  choice: uma fragrância agradável
  rationale: Reproduz a combinação de um substantivo referente a odor ou fragrância com o adjetivo “bom/agradável”.
- source_word: ጤለ
  choice: orvalho
  rationale: É o sentido mais provável no contexto meteorológico e se harmoniza com a sequência de chuva e outras dádivas.
- source_word: ዝናም
  choice: chuva
  rationale: Equivalente português direto e corrente.
- source_word: ሰላም
  choice: paz
  rationale: Preserva a amplitude cósmica e teológica do termo, sem reduzi-lo a prosperidade material.
- source_word: ሕይወት
  choice: vida
  rationale: Equivalente direto que mantém o caráter culminante da enumeração.
theological_decisions:
- issue: Se ሰላም deve ser restringido ao sentido de prosperidade material nesta lista de benefícios meteorológicos
  choice: paz
  alternative: bem-estar; prosperidade
  rationale: “Paz” conserva a amplitude semântica e teológica do termo, inclusive sua possível ideia de integridade e bem-estar, sem estreitá-lo ao âmbito agrícola ou material.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “dela” preserva tanto a relação espacial quanto a origem dos elementos enumerados, sem resolver silenciosamente a referência pronominal.
