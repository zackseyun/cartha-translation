base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/010.yaml
  text: And after these[a], winds from the south—whose name is Sea[e][d][c][b], and which come out from the seventh opening that is toward the east—dew comes forth from it.
translation:
  language: pt
  text: E, depois destes, vêm os ventos do sul — cujo nome é Mar[a] e que saem da sétima abertura voltada para o leste[b] —; dela sai o orvalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase “cujo nome é Mar” faz parte de uma passagem textualmente difícil na tradição etíope e pode refletir uma variante ou expansão; foi mantida por constar no testemunho fornecido.
    reason: textual_variant
  - marker: b
    text: O texto transmitido também permite entender “das sete aberturas voltadas para o leste”. Há ainda uma expressão entre colchetes que pode significar “para o oeste”, mas sua posição é incerta e ela não foi incluída no texto principal.
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረ እሉ
  choice: depois destes
  rationale: Mantém a sequência temporal da descrição ordenada dos ventos.
- source_word: ነፋሳት
  choice: ventos
  rationale: No contexto meteorológico e cosmológico do Livro Astronômico, o sentido natural é “ventos”, não “espíritos”.
- source_word: ዘመንገለ መስዕ
  choice: do sul
  rationale: Identifica os ventos por sua região de origem, em português natural.
- source_word: ዘስሙ ባሕር
  choice: cujo nome é Mar
  rationale: Conserva literalmente a fórmula de nomeação e a terminologia cosmológica antiga, sem interpretá-la como “vento marítimo”.
- source_word: ወዘወፅአ
  choice: e que saem
  rationale: Expressa a saída dos ventos; a concordância plural em português segue o antecedente “ventos”, embora a transmissão seja sintaticamente difícil.
- source_word: እም፯ኆኅት
  choice: da sétima abertura
  rationale: O sinal numeral ፯ pode ser lido distributivamente no contexto como ordinal, e a forma feminina singular retomada mais adiante favorece “sétima abertura”; a alternativa plural é registrada em nota.
- source_word: እንተ መንገለ ምሥራቅ
  choice: voltada para o leste
  rationale: Localiza a abertura de modo claro, preservando a orientação espacial do ge'ez.
- source_word: ይወፅእ እምኔሃ ጤለ
  choice: dela sai o orvalho
  rationale: A ordem portuguesa deixa claro que “orvalho” é o sujeito singular de “sai” e que o sufixo feminino singular de እምኔሃ retoma “abertura”.
theological_decisions:
- issue: Fórmula cosmológica de nomeação do vento sul
  choice: manter literalmente “cujo nome é Mar”
  alternative: traduzir interpretativamente como “o vento marítimo” ou omitir a frase
  rationale: A literalidade preserva a imagem e a nomenclatura apocalíptica sem impor uma explicação doutrinária ou cosmológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção final foi formulada como “dela sai o orvalho” para refletir a sintaxe singular do ge'ez sem tornar a frase excessivamente rígida.
