base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/001.yaml
  text: And at the ends of the earth I saw twelve portals[a], and all of them were open for all the winds[b], from which the winds go out and blow upon the earth.
translation:
  language: pt
  text: E, nos confins da terra, vi doze portais[a], e todos eles[b] estavam abertos para todos os ventos, dos quais os ventos saem e sopram sobre a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portas” ou “aberturas”. “Portais” preserva a imagem arquitetônica da visão cósmica.
    reason: lexical_alternative
  - marker: b
    text: A forma ge’ez nesta transcrição é incerta; provavelmente deve ser lida como o plural de “portal”, dando o sentido “e esses portais”, aqui expresso como “e todos eles”. Outra leitura antiga a entendeu como “ao redor”.
    reason: textual_variant
lexical_decisions:
- source_word: አጽናፈ ምድር
  choice: nos confins da terra
  rationale: A expressão indica os limites extremos do mundo na geografia cósmica da visão. “Confins da terra” é natural, digna e preserva essa imagem sem sugerir apenas fronteiras políticas.
- source_word: ርኢኩ
  choice: vi
  rationale: Tradução direta da fórmula narrativa visionária na primeira pessoa.
- source_word: ፲፪ ኆኃተ
  choice: doze portais
  rationale: “Portais” conserva a imagem arquitetônica de aberturas cósmicas estruturadas; “portas” e “aberturas” continuam sendo possibilidades lexicais.
- source_word: ወእልኩ ኆኃው ርኅዋተ
  choice: e todos eles estavam abertos
  rationale: A leitura contextual entende a forma problemática da transcrição como referência plural aos portais. O masculino “eles” retoma naturalmente “portais” em português, e “estavam abertos” expressa o predicado nominal do ge’ez.
- source_word: ለኵሎሙ ነፋሳት
  choice: para todos os ventos
  rationale: No contexto meteorológico imediato, o termo designa ventos, não espíritos.
- source_word: እለ እምኔሆሙ ይወፅኡ ነፋሳት
  choice: dos quais os ventos saem
  rationale: A oração relativa identifica os portais como os pontos de onde os ventos procedem, mantendo explícita a repetição de “ventos” presente no texto.
- source_word: ወይነፍሱ ዲበ ምድር
  choice: e sopram sobre a terra
  rationale: No contexto, o verbo descreve a ação física dos ventos. “Sopram sobre a terra” é corrente e preserva o sentido meteorológico.
theological_decisions:
- issue: Se ነፋሳት deve ser traduzido por “ventos” ou “espíritos”
  choice: ventos
  alternative: espíritos
  rationale: Embora o campo semântico possa incluir vento, sopro e espírito, a descrição cosmológica de portais pelos quais eles saem e sopram sobre a terra favorece claramente “ventos”, sem impor ao trecho uma interpretação de seres espirituais.
- issue: Interpretação da forma transcrita ኃዋላው
  choice: 'referência plural aos portais: “todos eles”'
  alternative: “ao redor”
  rationale: A forma transmitida nesta transcrição é problemática e provavelmente reflete uma leitura defeituosa de ኆኃው, “portais”. A sintaxe e a revisão textual favorecem “e todos eles estavam abertos”, em vez de introduzir a ideia espacial “ao redor”.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase acompanha de perto o relato visionário, enquanto a pontuação evita uma sequência excessivamente rígida.
