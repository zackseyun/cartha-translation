base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/004.yaml
  text: Through four of them come forth winds of blessing and peace[a], and from those eight come forth winds of scourging; when they are sent out, they bring ruin upon all the earth and the water on it, and upon all who dwell on it[c][b], and upon everything that is in the water and on the dry land.
translation:
  language: pt
  text: Por quatro deles saem ventos de bênção e paz, e daqueles oito saem ventos de castigo[a]; quando são enviados, devastam toda a terra e a água que está sobre ela[b], todos os que nela habitam e tudo o que há na água e em terra seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ventos de flagelo”, “de punição” ou “de aflição”. O termo ge’ez descreve uma ação destrutiva de caráter punitivo.
    reason: lexical_alternative
  - marker: b
    text: A expressão “a água que está sobre ela” acompanha de perto o ge’ez e pode se referir às águas associadas à terra nesta descrição cosmológica.
    reason: cultural_note
lexical_decisions:
- source_word: በ፬እምኔሆሙ (texto corrigido; a transcrição fornecida traz በ፫እምኔሆሙ)
  choice: Por quatro deles
  rationale: 'A leitura corrigida ፬ (“quatro”) corresponde à estrutura de doze portais do contexto: quatro benéficos e oito destrutivos. “Por” preserva o valor instrumental/espacial de በ e sua distinção em relação ao እም subsequente, traduzido por “daqueles”.'
- source_word: ይወፅኡ
  choice: saem
  rationale: Expressa de modo natural o movimento dos ventos que procedem dos portais, sem acrescentar personificação.
- source_word: ነፋሳት
  choice: ventos
  rationale: O contexto trata de forças meteorológicas ordenadas que saem de portais cósmicos, não de espíritos pessoais.
- source_word: በረከት፡ ወሰላም
  choice: bênção e paz
  rationale: Mantém os termos religiosos e o caráter benéfico desses ventos sem reduzir “paz” a prosperidade material.
- source_word: እምእልኩ፡ ሰማንቱ
  choice: daqueles oito
  rationale: Conserva o demonstrativo e o numeral, que são importantes para a enumeração cosmológica.
- source_word: መቅሠፍት
  choice: castigo
  rationale: O termo indica uma aflição destrutiva de caráter punitivo. “Castigo” é claro e digno em português; a nota registra alternativas mais imagéticas.
- source_word: ሶበ፡ ይትፈነዉ
  choice: quando são enviados
  rationale: Preserva a construção passiva e a ideia de que os ventos são soltos ou despachados por uma agência não explicitada.
- source_word: ይደመስስዋ
  choice: devastam
  rationale: Comunica diretamente a ação destrutiva e combina naturalmente com a sequência de objetos.
- source_word: ለኵላ፡ ምድር፡ ወማይ፡ ዘዲቤሃ
  choice: toda a terra e a água que está sobre ela
  rationale: Mantém a formulação cosmológica incomum e a relação espacial expressa pelo ge’ez, sem explicar além do texto.
- source_word: ኵሉ፡ እለ፡ የኃድሩ፡ ዲቤሃ
  choice: todos os que nela habitam
  rationale: É uma formulação portuguesa natural e elevada, preservando a abrangência universal.
- source_word: ኵሉ፡ ዘሀሎ፡ ውስተ፡ ማይ፡ ወዲበ፡ የብስ
  choice: tudo o que há na água e em terra seca
  rationale: Preserva o merismo entre água e terra seca e a extensão total da devastação.
theological_decisions:
- issue: Se ነፋሳት deve ser entendido como “ventos” ou “espíritos”
  choice: ventos
  alternative: espíritos
  rationale: Os portais, as direções e as funções descritas nesta seção pertencem ao quadro meteorológico e cosmológico; “espíritos” personalizaria indevidamente a imagem.
- issue: Como representar a força punitiva de መቅሠፍት
  choice: castigo
  alternative: flagelo; punição; aflição
  rationale: “Castigo” conserva o caráter judicial e destrutivo sem introduzir uma fórmula doutrinária específica; “flagelo” permanece na nota como alternativa mais imagética.
- issue: Numeral do primeiro conjunto de portais
  choice: quatro
  alternative: três, conforme a transcrição ፫
  rationale: A evidência contextual e a revisão do numeral indicam que a transcrição confundiu ፬ (quatro) com ፫ (três). A divisão em quatro e oito completa os doze portais descritos no capítulo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe é natural, mas a expressão cosmológica “a água que está sobre ela” foi mantida deliberadamente próxima do ge’ez. A leitura “quatro” segue a correção textual/contextual do numeral, não a transcrição OCR apresentada.
