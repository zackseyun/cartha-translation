base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/003.yaml
  text: And the righteous one shall rise from sleep[a], and he shall arise and walk in the path of righteousness[d][c][b]; and all his path and his course shall be in goodness and in everlasting kindness.
translation:
  language: pt
  text: E o justo se levantará do sono[a], se erguerá e seguirá pelo caminho da justiça[b]; e todo o seu caminho e o seu proceder se darão em bondade e em misericórdia eterna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “do sono” pode indicar sono literal ou funcionar como imagem de um despertar para uma vida renovada; o versículo não determina uma única interpretação.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: “pelos caminhos da justiça”.'
    reason: textual_grammar_alternative
  - marker: c
    text: O termo traduzido como “misericórdia” também pode significar clemência, mansidão ou favor benevolente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነሣእ
  choice: se levantará / se erguerá
  rationale: Preserva a repetição retórica do verbo sem tornar explícita uma fórmula passiva de ressurreição. A ausência de conjunção antes da segunda ocorrência é refletida pela justaposição.
- source_word: ጻድቅ
  choice: o justo
  rationale: Mantém o singular individualizante de forma natural em português, sem impor uma identificação messiânica ou coletiva.
- source_word: እምንዋም
  choice: do sono
  rationale: Expressa diretamente a ideia de origem ou saída do sono, preservando a possível leitura literal ou figurada.
- source_word: የኃልፍ
  choice: seguirá
  rationale: No contexto da metáfora do caminho, comunica avançar ou andar por ele em português natural, sem reduzir o verbo a mera passagem.
- source_word: በፍኖተ ጽድቅ
  choice: pelo caminho da justiça
  rationale: Conserva a imagem ética do caminho. A forma transmitida permite divergência de número, registrada em nota.
- source_word: ኵሉ ፍኖቱ
  choice: todo o seu caminho
  rationale: Mantém o singular coletivo e a textura da fonte, em vez de normalizá-lo como 'todos os seus caminhos'.
- source_word: ምሕዋሩ
  choice: o seu proceder
  rationale: Abrange tanto o curso percorrido quanto a maneira de conduzir-se e soa mais claro em português do que uma repetição de 'caminho'.
- source_word: በኂሩት
  choice: pela bondade
  rationale: Preserva o sentido amplo de qualidade moral e beneficência, sem restringi-lo a uma única manifestação.
- source_word: በሣህል ዘለዓለም
  choice: pela misericórdia eterna
  rationale: O termo pode indicar misericórdia, clemência, mansidão ou favor benevolente. 'Misericórdia' é digna e corrente, mas a amplitude lexical é preservada em nota.
theological_decisions:
- issue: Se o levantar-se do sono ensina explicitamente a ressurreição dos mortos ou um despertar figurado
  choice: Preservar a imagem de levantar-se do sono sem explicá-la no texto principal.
  alternative: Traduzir de modo explícito como ressurreição corporal ou como despertar moral e espiritual.
  rationale: O ge'ez combina sono e levantar-se, mas neste versículo não menciona expressamente a morte nem define a imagem. A tradução mantém essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição inicial é mantida, mas com verbos portugueses próximos para evitar rigidez; a ambiguidade sobre ressurreição não é resolvida. Todos os marcadores de nota aparecem no texto principal.
