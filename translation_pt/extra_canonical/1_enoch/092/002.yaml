base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/002.yaml
  text: Do not let your spirit be grieved because of the times[a], for the Holy and Great One has appointed days for all.
translation:
  language: pt
  text: Não deixem que o espírito de vocês se entristeça por causa dos tempos, pois Aquele que é Santo e Grande determinou dias para todos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para cada um”, “para tudo” ou “para todas as coisas”. A expressão ge'ez é abrangente e pode referir-se tanto a todas as pessoas quanto, de modo geral, a todas as coisas.
    reason: lexical_alternative
lexical_decisions:
- source_word: አትሕዝኑ
  choice: Não deixem ... se entristeça
  rationale: O imperativo negativo expressa tristeza ou aflição. A construção com “deixem” soa natural em português e mantém “o espírito de vocês” como foco da experiência interior.
- source_word: መንፈስክሙ
  choice: o espírito de vocês
  rationale: O termo pode designar espírito, sopro ou disposição interior. “Espírito” preserva o registro antropológico e elevado, e “de vocês” torna claro o plural do sufixo ge'ez.
- source_word: በአዝማን
  choice: por causa dos tempos
  rationale: A preposição com o plural de “tempo” pode indicar a causa da tristeza. A formulação preserva a referência apocalíptica a períodos históricos difíceis.
- source_word: መዋዕለ
  choice: dias
  rationale: O substantivo significa literalmente “dias”, embora no contexto também possa sugerir períodos determinados.
- source_word: ወሀበ
  choice: determinou
  rationale: Embora o sentido básico seja “deu”, em associação com “dias” o verbo comunica a ideia de atribuição ou ordenação temporal. “Determinou” é idiomático sem ampliar excessivamente o texto.
- source_word: ቅዱስ ወዐቢይ
  choice: Aquele que é Santo e Grande
  rationale: Os adjetivos funcionam como um título divino conjunto. Esta forma mantém a reverência e soa mais natural em português do que “o Santo e Grande”.
- source_word: ለኵሉ
  choice: para todos
  rationale: A expressão é abrangente e não explicita se o referente são pessoas ou todas as coisas. A tradução concisa retém essa abertura, esclarecida em nota.
theological_decisions:
- issue: Alcance da determinação divina em ለኵሉ (“para todos/para tudo”)
  choice: para todos
  alternative: para tudo; para todas as coisas
  rationale: O ge'ez permite entender o alcance como todas as pessoas ou, mais amplamente, todas as coisas. O texto principal evita acrescentar um substantivo ausente na fonte, e a nota registra a amplitude cósmico-histórica possível sem excluir a aplicação humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “vocês” explicita o número presente no ge'ez; o título divino conserva o tom elevado. A ambiguidade final foi mantida no texto e documentada em nota.
