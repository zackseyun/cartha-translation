base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/001.yaml
  text: The book written by Hanok—[Hanok indeed wrote every sign of wisdom[a], praised among all people and a judge of all the earth]—for all my children who will dwell on the dry land[d][c][b], and for the generations to come who practice righteousness and peace.
translation:
  language: pt
  text: O livro escrito por Enoque — [Enoque, de fato, escreveu todo sinal de sabedoria[a], louvado entre todos os seres humanos e juiz de toda a terra] — para todos os meus filhos que habitarão em terra seca[b] e para as gerações futuras[c] que praticam a retidão e a paz.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração entre colchetes parece textualmente instável no testemunho etíope transcrito. Ela é mantida em forma cautelosamente literal, em vez de ser omitida.
    reason: textual_variant
  - marker: b
    text: Lit. “sobre a terra seca”. A expressão também pode ser vertida como “sobre a terra” ou “em terra firme”.
    reason: lexical_alternative
  - marker: c
    text: A transcrição apresentada traz uma forma que pode sugerir “escolhidos”; porém, a revisão textual a identifica como erro de OCR de uma palavra que significa “posteriores” ou “futuros”. Por isso, o texto principal diz “gerações futuras”. Outra leitura possível seria “uma geração futura, os escolhidos”.
    reason: textual_variant
  - marker: d
    text: A sintaxe é condensada. No texto principal, “que habitarão em terra seca” se liga a “todos os meus filhos”, enquanto “que praticam a retidão e a paz” se liga a “as gerações futuras”.
    reason: alternative_reading
lexical_decisions:
- source_word: ዘተጽሕፈ፡ እምሄኖክ፡ መጽሐፍ
  choice: O livro escrito por Enoque
  rationale: Conserva a forma passiva e o caráter de título do início etíope. Usa “Enoque”, a forma portuguesa tradicional e imediatamente reconhecível de Hanok.
- source_word: ኵሉ፡ ትእምርተ፡ ጥበብ
  choice: todo sinal de sabedoria
  rationale: Mantém o singular morfológico de “sinal” com o quantificador “todo”, sem reduzir a expressão elevada a uma paráfrase explicativa.
- source_word: እምኵሉ፡ ሰብእ፡ ስቡሕ
  choice: louvado entre todos os seres humanos
  rationale: “Louvado” comunica o valor passivo de ስቡሕ; “entre” preserva com cautela a relação sintática de እም sem impor uma leitura instrumental mais definida do que o testemunho permite.
- source_word: መኰንነ፡ ኵሉ፡ ምድር
  choice: juiz de toda a terra
  rationale: O substantivo expressa autoridade governante ou judicial. “Juiz” corresponde de perto à forma nominal e evita convertê-la sem necessidade em um particípio verbal.
- source_word: ለኵሎሙ፡ ውሉድየ
  choice: para todos os meus filhos
  rationale: Retém a posse explícita e o tom familiar, sem restringir a referência apenas a descendentes masculinos.
- source_word: እለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: que habitarão em terra seca
  rationale: Liga a oração relativa a “meus filhos”, seu antecedente mais imediato, e conserva a imagem concreta de terra seca em vez de nivelá-la para “mundo”.
- source_word: ለትውልድ፡ ይኃርያን
  choice: para as gerações futuras
  rationale: Segue a leitura revisada que entende a forma transcrita como corrupção de OCR de um termo relativo ao futuro. A incerteza entre essa leitura e uma referência aos escolhidos é preservada em nota.
- source_word: እለ፡ ይገብሩ፡ ርተዐ፡ ወሰላመ
  choice: que praticam a retidão e a paz
  rationale: “Praticam” traduz naturalmente o verbo “fazer” em relação a qualidades éticas; “retidão” mantém o peso moral sem introduzir um sentido jurídico exclusivo.
theological_decisions:
- issue: Possível referência aos escolhidos em ይኃርያን
  choice: gerações futuras
  alternative: a geração dos escolhidos / os escolhidos
  rationale: A revisão textual fornecida identifica a forma como erro de OCR por um termo que significa “posteriores/futuras”. Como a transcrição exibida também pode evocar a linguagem dos escolhidos, a alternativa teologicamente significativa não é apagada, mas registrada em nota.
- issue: Valor de ርተዐ
  choice: retidão
  alternative: justiça
  rationale: “Retidão” preserva o caráter ético amplo do termo. “Justiça” continua possível, mas poderia sugerir em português moderno um campo prioritariamente jurídico que o contexto não exige.
- issue: Função de መኰንነ
  choice: juiz
  alternative: governante
  rationale: A palavra abrange autoridade judicial e governante. “Juiz” preserva a formulação nominal e o tom apocalíptico, sem definir como se exerce essa autoridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação apresenta o versículo como um sobrescrito e os colchetes assinalam a instabilidade da oração interpolada. Evitaram-se tanto arcaísmos como “eleitos” quanto explicações doutrinárias no corpo do texto; as ambiguidades textual, sintática e lexical foram remetidas às notas.
