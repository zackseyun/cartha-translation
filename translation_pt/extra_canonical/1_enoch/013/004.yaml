base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/004.yaml
  text: And they asked me to write for them a petition of remembrance[a], so that there might be forgiveness for them[c][b], and that I might bring it up
translation:
  language: pt
  text: E eles me pediram que escrevesse para eles uma petição memorial[a], para que lhes fosse concedido perdão e para que eu a fizesse subir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma súplica para memória” ou “uma petição escrita para ser lembrada”. A expressão ge'ez reúne as ideias de memória ou memorial e de petição ou súplica.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “eu a fizesse subir” ou “eu a levasse para cima”. A forma causativa indica levar ou apresentar a petição; o destino não é expresso neste trecho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእሉኒ
  choice: me pediram
  rationale: Expressa com naturalidade o pedido dirigido a Enoque, sem intensificar indevidamente o verbo como “suplicaram”.
- source_word: እጽሐፍ
  choice: que escrevesse
  rationale: Depois de “pediram”, o subjuntivo é a construção idiomática em português e conserva o sentido de escrever ou registrar.
- source_word: ተዝካረ ስእለት
  choice: uma petição memorial
  rationale: 'Preserva os dois componentes da expressão ge''ez: memória ou memorial e petição ou súplica. A nota registra alternativas mais explícitas.'
- source_word: ይኩኖሙ ኅድገተ
  choice: para que lhes fosse concedido perdão
  rationale: Traduz o desejo de que houvesse perdão para eles em português claro, sem afirmar que o perdão foi efetivamente concedido.
- source_word: አዕርግ
  choice: eu a apresentasse nas alturas
  rationale: O causativo indica fazer subir ou levar para cima, não simplesmente Enoque ascender. “Apresentasse nas alturas” comunica a entrega da petição no âmbito celestial sem acrescentar um destinatário não expresso.
theological_decisions:
- issue: Natureza do documento solicitado pelos Vigilantes
  choice: uma petição memorial
  alternative: uma súplica para memória; uma petição escrita para ser lembrada
  rationale: A tradução mantém juntas as ideias de súplica e memorial, compatíveis com uma petição apresentada no cenário celestial, sem impor uma fórmula litúrgica posterior.
- issue: Possibilidade de perdão para os Vigilantes
  choice: para que lhes fosse concedido perdão
  alternative: para que obtivessem libertação
  rationale: O termo pode denotar perdão, remissão ou soltura. “Perdão” se ajusta ao contexto de culpa e juízo, enquanto o modo verbal conserva apenas a esperança deles, não uma promessa divina.
- issue: Ação final de Enoque
  choice: eu a apresentasse nas alturas
  alternative: eu a fizesse subir; eu a levasse para cima
  rationale: A forma causativa favorece levar ou fazer subir a petição. A redação evita a leitura intransitiva “eu subisse” e preserva a imagem do oferecimento celestial.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Petição memorial” mantém a concisão e a densidade da expressão original; a nota esclarece seu sentido. A frase é completa em português, mas continua naturalmente na narrativa seguinte.
