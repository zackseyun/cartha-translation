base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/001.yaml
  text: 'And Enoch went and said to Azazel[a], “You shall have no peace; a great sentence has gone out against you: you will be bound.”'
translation:
  language: pt
  text: 'Então Enoque foi e disse a Azazel: “Não haverá paz para você; uma grande sentença[a] foi proferida contra você: você será amarrado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “juízo” ou “decreto”. O termo ge’ez é jurídico e introduz a punição mencionada em seguida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃሊፎ
  choice: foi
  rationale: Expressa de modo natural o movimento de Enoque antes de falar, preservando a sequência narrativa sem especificar uma direção ausente do texto.
- source_word: ይቤሎ
  choice: disse a
  rationale: Verbo comum de fala, direto e sem acrescentar uma força retórica não explícita no ge’ez.
- source_word: አዛዝኤል
  choice: Azazel
  rationale: O nome próprio é transliterado, não traduzido.
- source_word: ኢይከውከ ሰላም
  choice: Não haverá paz para você
  rationale: Preserva a fórmula solene que nega paz, bem-estar ou desfecho favorável, em português atual e natural.
- source_word: ዓቢይ
  choice: grande
  rationale: Reproduz diretamente o intensificador sem definir além do texto em que sentido a sentença é grande.
- source_word: ኵነኔ
  choice: sentença
  rationale: O contexto é jurídico e a decisão acarreta uma pena concreta. “Juízo” e “decreto” continuam sendo alternativas possíveis e são registrados em nota.
- source_word: ወጽአ ላዕሌከ
  choice: foi proferida contra você
  rationale: Comunica que a decisão judicial já foi pronunciada e se dirige contra Azazel; evita uma tradução excessivamente literal e pouco idiomática de “saiu”.
- source_word: ይእስርከ
  choice: você será amarrado
  rationale: Mantém a imagem punitiva de prender ou atar e segue a leitura passiva contextual, sem especificar quem executará a ação.
theological_decisions:
- issue: Força da fórmula de paz no oráculo de julgamento
  choice: Não haverá paz para você
  alternative: Você não terá paz
  rationale: A frase constitui uma negação judicial de bem-estar ao condenado, e não uma saudação comum. A formulação escolhida mantém o tom profético-apocalíptico sem importar linguagem confessional posterior.
- issue: Nuance jurídica de ኵነኔ
  choice: sentença
  alternative: juízo; decreto; condenação
  rationale: “Sentença” expressa uma decisão judicial com consequência penal, adequada à menção imediata do aprisionamento, enquanto a nota conserva a amplitude lexical possível.
- issue: Forma da punição final
  choice: você será amarrado
  alternative: para amarrar você; para que seja amarrado
  rationale: A leitura passiva é clara no contexto e evita determinar o agente. A construção de finalidade permanece uma possibilidade sintática, mas é menos natural como conclusão da fala em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade internacional com leitura brasileira, preservando o tom solene por meio da estrutura da declaração judicial.
