base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/003.yaml
  text: Then I went and spoke to them all together[a], and they all feared, and fear and trembling seized them.
translation:
  language: pt
  text: Então fui e falei a todos eles reunidos; e todos ficaram com medo, e o medo e o tremor se apoderaram deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação acumula termos de temor: primeiro todos «ficaram com medo»; depois, «o medo e o tremor» se apoderaram deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሜሃ
  choice: Então
  rationale: Marca a sequência temporal da narrativa sem especificar mais do que o texto permite.
- source_word: ሐዊርየ
  choice: fui
  rationale: Tradução direta da forma verbal na primeira pessoa ligada à ideia de ir ou caminhar.
- source_word: ነገርክዎሙ
  choice: falei a eles
  rationale: Expressa o ato de falar ou comunicar algo aos destinatários no contexto imediato.
- source_word: ለኵሎሙ ኅቡረ
  choice: a todos eles reunidos
  rationale: Preserva tanto a abrangência de «todos» quanto a ideia de que estavam juntos como grupo.
- source_word: ወእሙንቱ ኵሎሙ ፈርሁ
  choice: e todos ficaram com medo
  rationale: Mantém a repetição de totalidade e comunica naturalmente o surgimento da reação de medo.
- source_word: ፍርሃት ነሥአሙ ወረዓድ
  choice: o medo e o tremor se apoderaram deles
  rationale: Conserva os dois termos de temor e a imagem vigorosa de uma emoção que toma posse deles.
theological_decisions:
- issue: Natureza da reação dos Vigilantes
  choice: «ficaram com medo, e o medo e o tremor se apoderaram deles»
  alternative: «foram tomados de terror e estremecimento»
  rationale: O ge'ez emprega primeiro um verbo de temer e depois os substantivos «medo» e «tremor». A tradução preserva essa intensificação apocalíptica sem reduzi-la a uma única expressão genérica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «todos» e de palavras relacionadas ao medo foi mantida por refletir a ênfase do original.
