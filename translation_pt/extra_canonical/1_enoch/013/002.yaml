base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/002.yaml
  text: And no mercy or petition will be granted to you[a], because of the violence that you have taught[c][b], and because of all the works of blasphemy and violence and sin that you have shown to humankind.
translation:
  language: pt
  text: E não lhe será concedida misericórdia nem petição[a], por causa da violência que você ensinou e por causa de todas as obras de blasfêmia, violência e pecado que mostrou à humanidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A primeira palavra do texto ge''ez transcrito parece conter um erro: ሣሕት provavelmente representa ሣህል, “misericórdia”, “clemência” ou “alívio”.'
    reason: textual_note
  - marker: b
    text: 'Ou: “que revelou à humanidade”. O verbo ge''ez pode significar fazer algo ser visto ou conhecido; no contexto, pode aludir à divulgação de conhecimento proibido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣሕት (provável erro de transcrição por ሣህል)
  choice: misericórdia
  rationale: A revisão textual identifica ሣሕት como provável leitura corrompida de ሣህል, “misericórdia, clemência, alívio”. A tradução segue essa correção, em vez de criar uma duplicação de “petição”.
- source_word: ስእለት
  choice: petição
  rationale: Designa um pedido ou súplica; “petição” conserva o tom formal e judicial do apelo feito em favor do sentenciado.
- source_word: ኢይከውከ
  choice: não lhe será concedida
  rationale: O imperfeito negativo do verbo “ser/tornar-se”, com valor dativo, indica que misericórdia e petição não serão obtidas nem terão efeito para o destinatário.
- source_word: ዘመሀርከ
  choice: que você ensinou
  rationale: Traduz diretamente o verbo de ensinar e preserva a segunda pessoa do singular indicada pela forma ge'ez.
- source_word: ግፍዐ / ወግፍዕ
  choice: violência / violência
  rationale: “Violência” expressa a força moral e social do termo; a repetição foi mantida por corresponder à repetição lexical do texto-fonte.
- source_word: ምግባረ
  choice: obras
  rationale: Mantém o sentido concreto e o registro elevado da fórmula de acusação.
- source_word: ጽርፈት
  choice: blasfêmia
  rationale: O vocábulo pode indicar fala ou conduta injuriosa e ímpia; “blasfêmia” se ajusta ao contexto religioso e judicial, sem excluir completamente a ideia mais ampla de ultraje.
- source_word: ወሓጢአት
  choice: e pecado
  rationale: “Pecado” é a equivalência ampla e natural, preservando o acúmulo culminante das acusações.
- source_word: ዘአርአይከ
  choice: que mostrou
  rationale: O verbo significa fazer ver ou conhecer. “Mostrou” preserva a amplitude lexical; a possibilidade de “revelou” é registrada em nota.
- source_word: ለሰብእ
  choice: à humanidade
  rationale: O referente é a humanidade em geral; esta formulação é inclusiva, natural e fiel ao substantivo coletivo.
theological_decisions:
- issue: Natureza da transgressão na oração final
  choice: O texto acusa o destinatário de transmitir à humanidade a violência e as práticas corruptas.
  alternative: A oração também pode ser entendida como referência a atos exibidos diante dos seres humanos, ou como revelação de conhecimento ilícito.
  rationale: O contexto dos Vigilantes destaca a instrução proibida transmitida aos seres humanos, e os verbos “ensinou” e “mostrou” favorecem essa leitura. Contudo, “mostrou” mantém aberta a tensão entre ensinar, revelar e exibir.
- issue: Número do destinatário
  choice: 'Segunda pessoa do singular: “lhe”, “você ensinou”, “mostrou”.'
  alternative: Uma tradução contextual poderia empregar o plural se entendesse a acusação como dirigida coletivamente aos Vigilantes.
  rationale: As formas verbais e os sufixos do texto ge'ez apresentado são de segunda pessoa do singular; por isso, a tradução não impõe um destinatário plural.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega-se “você” para tornar inequívoca a segunda pessoa do singular, evitando o regionalismo ou a solenidade excessiva de “tu” e “vós”. A coordenação negativa “nem... nem” reproduz naturalmente em português a negação dos dois elementos.
