base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/008.yaml
  text: From now on[b][a], know that all your violence that you commit is being written down every day until the day of your judgment.
translation:
  language: pt
  text: De agora em diante[b], saibam que toda a violência que vocês praticam[a] está sendo registrada todos os dias, até o dia do julgamento de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «toda a opressão que vocês exercem»; o termo ge'ez pode indicar injustiça violenta e opressiva, não apenas violência física.
    reason: lexical_alternative
  - marker: b
    text: A formulação evoca o tema apocalíptico de que os atos são registrados em preparação para o dia do julgamento.
    reason: cross_reference
lexical_decisions:
- source_word: እምይእዜ
  choice: De agora em diante
  rationale: Preserva o marcador temporal prospectivo e o tom urgente da advertência em português natural.
- source_word: ታእምሩ
  choice: saibam
  rationale: O imperativo plural corresponde à interpelação direta e mantém a força incisiva do texto.
- source_word: ግፍዕክሙ
  choice: a violência de vocês
  rationale: O substantivo designa injustiça violenta ou opressiva; «violência» conserva a gravidade da acusação, enquanto a nota registra a alternativa «opressão».
- source_word: ዘትገፍዑ
  choice: que vocês praticam
  rationale: A forma verbal relativa retoma a raiz do substantivo. «Praticam» produz uma frase natural sem repetir de modo artificial a palavra «violência».
- source_word: ይጸሐፍ
  choice: está sendo registrada
  rationale: A construção passiva e durativa indica um registro contínuo. «Registrada» preserva a imagem de atos lançados em um registro sem acrescentar explicitamente que ele é celestial.
- source_word: በኵሉ ዕለት
  choice: todos os dias
  rationale: Equivalente temporal claro e corrente, adequado à ideia de continuidade.
- source_word: እስከ ዕለተ ኵነኔክሙ
  choice: até o dia do julgamento de vocês
  rationale: Mantém a referência ao dia designado para o juízo e evita «condenação», que anteciparia o resultado de modo mais específico que o original.
theological_decisions:
- issue: Registro dos atos em vista do julgamento
  choice: Manter a imagem de um registro contínuo dos atos violentos até o julgamento final.
  alternative: Entender a escrita apenas como metáfora de que os atos são lembrados, ou como um registro jurídico humano.
  rationale: O passivo «está sendo registrada» e a expressão «até o dia do julgamento» correspondem ao motivo apocalíptico dos registros para o juízo. A tradução conserva a imagem sem inserir no corpo do versículo a palavra «celestial», que não está expressa.
- issue: Julgamento ou condenação
  choice: julgamento
  alternative: condenação
  rationale: «Julgamento» preserva a amplitude semântica do termo e não resolve antecipadamente a sentença, embora o contexto seja uma advertência dirigida aos violentos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para marcar com clareza o destinatário plural. A ordem dos marcadores foi normalizada para que [a] acompanhe a expressão lexical a que se refere e [b] acompanhe a alusão temática.
