base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/010.yaml
  text: And now know that you are prepared for the day of destruction[a], and do not hope that you sinners will live; rather, you will depart and die, for you do not know any ransom[d][c][b], because you have been made ready for it.
translation:
  language: pt
  text: E agora saibam que vocês estão prontos para o dia da destruição[a]. Não tenham esperança de viver, pecadores; pelo contrário, vocês partirão e morrerão, pois não conhecem resgate algum[b], porque foram preparados para isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o dia da matança”. O termo ge''ez pode indicar ruína destrutiva no juízo e também admitir o sentido mais específico de matança.'
    reason: lexical_alternative
  - marker: b
    text: “Resgate” designa aqui um preço ou meio de libertação do juízo que se aproxima; a formulação indica que não lhes resta meio conhecido de escapar.
    reason: cultural_note
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Mantém o marcador temporal que introduz a advertência solene.
- source_word: አእምሩ
  choice: saibam
  rationale: Reproduz o imperativo plural direto dirigido aos ouvintes.
- source_word: ድልዋን
  choice: estão prontos
  rationale: Expressa o estado de prontidão para o juízo em português natural, sem definir se se trata de nomeação ou preparação.
- source_word: ለዕለተ ሐጕል
  choice: para o dia da destruição
  rationale: Preserva o sentido amplo de ruína destrutiva no contexto de juízo; a possibilidade mais específica de matança fica registrada em nota.
- source_word: ወኢትስፈዉ
  choice: Não tenham esperança
  rationale: Conserva a linguagem de esperança, em vez de reduzi-la a mera expectativa.
- source_word: ከመ ትሕየዉ ኃጥኣን
  choice: de viver, pecadores
  rationale: O verbo está na segunda pessoa do plural; “pecadores” é entendido como vocativo ou aposto dos destinatários, não como sujeito de terceira pessoa.
- source_word: አላ ትሐውሩ ወትመውቱ
  choice: pelo contrário, vocês partirão e morrerão
  rationale: Mantém a sequência de partida e morte e o tom solene da advertência.
- source_word: ቤዛ
  choice: resgate
  rationale: Preserva a imagem concreta de um preço ou meio de libertação, sem convertê-la em uma formulação doutrinária posterior.
- source_word: ኢታእምሩ ቤዛ
  choice: não conhecem resgate algum
  rationale: Segue de perto a expressão difícil do ge'ez e comunica que os destinatários não conhecem meio algum de escapar.
- source_word: ተደለውክሙ
  choice: foram preparados para isso
  rationale: Mantém a voz passiva e retoma a ideia inicial de preparação, explicitando apenas o referente implícito.
theological_decisions:
- issue: Sentido de “resgate” no anúncio de juízo
  choice: resgate
  alternative: livramento
  rationale: “Resgate” conserva a metáfora de um meio ou preço de liberação e a tensão do texto, sem interpretá-la como uma doutrina posterior de expiação.
- issue: Identidade dos que não viverão
  choice: os próprios destinatários, chamados de “pecadores”
  alternative: uma afirmação geral sobre pecadores em terceira pessoa
  rationale: A forma verbal ge'ez é de segunda pessoa do plural; por isso, “pecadores” funciona como vocativo ou aposto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. A tradução mantém a segunda pessoa plural por meio de “vocês”, evita arcaísmos e preserva a linguagem concreta e severa do oráculo.
