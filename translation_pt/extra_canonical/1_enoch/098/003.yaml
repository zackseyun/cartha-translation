base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/003.yaml
  text: Therefore they have no instruction or wisdom[a]; and because of this they will perish together with their possessions, and with all their glory and their honor. And in shame, and in slaughter, and in great destitution[c][b], their spirits will be cast into the furnace of fire.
translation:
  language: pt
  text: Por isso, eles não têm instrução nem sabedoria[a]; e, por causa disso, perecerão juntamente com os seus bens, com toda a sua glória e a sua honra. Em vergonha, em matança e em grande miséria[b], os espíritos deles serão lançados na fornalha de fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ensinamento”. “Instrução e sabedoria” provavelmente forma uma expressão sapiencial, e não duas ideias rigidamente separadas.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida por “em grande miséria” é difícil; também pode significar “em grande privação”, “em grande pobreza” ou “em grande aflição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትምህርት
  choice: instrução
  rationale: Designa ensino ou instrução recebida; “instrução” se encaixa no contexto sapiencial e forma um par natural com “sabedoria”.
- source_word: ጥበብ
  choice: sabedoria
  rationale: Neste contexto moral e apocalíptico, indica sabedoria prática e ética, não habilidade técnica.
- source_word: ይትሐጐሉ
  choice: perecerão
  rationale: Preserva a força do juízo futuro sem especificar indevidamente o modo da destruição.
- source_word: ኅቡረ ምስለ
  choice: juntamente com
  rationale: Expressa claramente que eles e seus bens compartilham o mesmo destino.
- source_word: ንዋያቲሆሙ
  choice: os seus bens
  rationale: Abrange de modo natural as posses materiais sem restringir o sentido a dinheiro.
- source_word: ስብሐቶሙ
  choice: a sua glória
  rationale: Mantém o registro elevado e a ironia da glória terrena que desaparece no juízo.
- source_word: ክብሮሙ
  choice: a sua honra
  rationale: Conserva a distinção paralela entre glória e honra ou posição social.
- source_word: በጽእለት
  choice: em vergonha
  rationale: Preserva de modo conciso a dimensão pública e moral da humilhação.
- source_word: በቅትል
  choice: em matança
  rationale: Mantém a sequência nominal e a imagem contundente de morte violenta sem determinar o agente.
- source_word: በንዴት ዐቢይ
  choice: em grande miséria
  rationale: A expressão é difícil e pode indicar privação, aflição ou condição miserável; “grande miséria” preserva essa amplitude melhor que um termo estritamente econômico.
- source_word: ትትወደይ መንፈሶሙ
  choice: os espíritos deles serão lançados
  rationale: Reproduz o objeto explícito, “espíritos”, e a ideia de destinação forçada.
- source_word: እቶነ እሳት
  choice: a fornalha de fogo
  rationale: Reflete de perto a construção do ge'ez e conserva a imagem apocalíptica vívida.
theological_decisions:
- issue: Se a cláusula final descreve aniquilação ou destinação punitiva após a morte
  choice: os espíritos deles serão lançados na fornalha de fogo
  alternative: eles próprios serão destruídos no fogo
  rationale: O objeto expresso é “os espíritos deles”; a tradução mantém a tensão da imagem de juízo apocalíptico sem reduzi-la à morte física nem definir sua duração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A coordenação repetida preserva o tom cumulativo do anúncio de juízo. O presente “não têm” e o futuro “perecerão” mantêm a relação causal e temporal do ge'ez.
