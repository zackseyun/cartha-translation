base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/006.yaml
  text: I have sworn to you[a], sinners, by the Great Holy One, that all your evil deeds are revealed in the heavens[b], and none of your deeds of violence are covered or hidden.
translation:
  language: pt
  text: Jurei a vocês, pecadores, pelo Grande Santo, que todas as suas obras más estão expostas nos céus, e nenhuma das suas obras de violência está encoberta ou escondida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐልኩ
  choice: Jurei
  rationale: O perfeito de primeira pessoa do verbo ligado a juramento é vertido de modo direto e solene; em português, o pretérito perfeito expressa naturalmente o ato de jurar.
- source_word: ኃጥኣን
  choice: pecadores
  rationale: É a designação direta e corrente dos que praticam o mal no discurso de juízo.
- source_word: በቅዱስ ዐቢይ
  choice: pelo Grande Santo
  rationale: Preserva os dois elementos do título divino e a fórmula instrumental do juramento, com ordem natural em português e sem importar uma fórmula doutrinária posterior.
- source_word: ኵሉ ግብርክሙ እኩይ
  choice: todas as suas obras más
  rationale: Mantém a referência concreta às ações moralmente más; “obras” também conserva a repetição lexical de ግብር na cláusula seguinte.
- source_word: ክሡት ውእቱ በሰማያት
  choice: estão expostas nos céus
  rationale: O predicado comunica desvelamento ou exposição, e o plural “céus” acompanha a forma ge'ez e a linguagem apocalíptica.
- source_word: ግብረ ግፍዕ
  choice: obras de violência
  rationale: ግፍዕ pode designar violência, opressão ou injustiça; “violência” preserva a força concreta da denúncia.
- source_word: ወአልብክሙ ክዱነ ወእኁቡአ
  choice: e nenhuma das suas obras de violência está encoberta ou escondida
  rationale: Traduz o existencial negativo e os dois predicados de ocultação, mantendo o contraste com “expostas” e evitando a leitura incorreta de registro escrito.
theological_decisions:
- issue: Fórmula de juramento e título divino
  choice: pelo Grande Santo
  alternative: pelo Santo Grandioso
  rationale: “Grande Santo” conserva a dupla qualificação como título divino em linguagem elevada, sem harmonizá-la com títulos confessionais posteriores.
- issue: Exposição celestial das ações humanas
  choice: estão expostas nos céus
  alternative: são reveladas nos céus
  rationale: “Expostas” preserva mais claramente o contraste lexical e judicial com aquilo que não está “encoberto ou escondido”, sem explicar o mecanismo dessa manifestação.
- issue: Sentido da cláusula final
  choice: nenhuma das suas obras de violência está encoberta ou escondida
  alternative: não há entre as suas obras de violência nenhuma encoberta ou oculta
  rationale: A leitura segue o existencial negativo ወአልብክሙ e os termos de ocultação; rejeita a antiga interpretação como inscrição ou registro celestial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “obras” é mantida para refletir a recorrência de ግብር; “vocês” evita regionalismo excessivo e torna explícito o plural do destinatário.
