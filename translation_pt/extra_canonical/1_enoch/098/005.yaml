base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/005.yaml
  text: And barrenness was not given to a woman[a]; rather[c][b], because of the work of her hands she dies childless.
translation:
  language: pt
  text: E a esterilidade não foi dada a uma mulher[a]; antes, por causa da obra de suas mãos[b], ela morre sem filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a esterilidade não foi destinada à mulher”. O ge''ez contrapõe a esterilidade à morte sem filhos como consequência efetiva.'
    reason: lexical_alternative
  - marker: b
    text: “A obra de suas mãos” é uma expressão que significa seus feitos ou suas ações.
    reason: cultural_note
lexical_decisions:
- source_word: ምክነት
  choice: esterilidade
  rationale: Expressa de modo claro e atual a incapacidade reprodutiva, preservando o contraste com morrer sem filhos.
- source_word: ለብእሲት
  choice: a uma mulher
  rationale: A forma ge'ez não marca definitude; o indefinido convém ao caráter geral ou proverbial da afirmação.
- source_word: ኢተውህበት
  choice: não foi dada
  rationale: Mantém de maneira transparente a voz passiva e evita acrescentar a ideia mais específica de concessão ou determinação.
- source_word: አላ
  choice: antes
  rationale: Marca o contraste forte e corretivo entre a esterilidade e a consequência descrita em seguida.
- source_word: በእንተ
  choice: por causa de
  rationale: Torna explícita a relação causal indicada pela preposição.
- source_word: ግብረ እዴሃ
  choice: a obra de suas mãos
  rationale: Preserva a imagem concreta do idioma ge'ez, que se refere aos atos ou às ações dela.
- source_word: ትመውት
  choice: ela morre
  rationale: O presente de valor geral reproduz adequadamente o sentido gnômico do imperfeito no contexto.
- source_word: ዘእንበለ ውሉድ
  choice: sem filhos
  rationale: É uma tradução direta e natural da expressão que significa estar sem filhos ou descendência.
theological_decisions:
- issue: Natureza do juízo sobre a mulher
  choice: A esterilidade não lhe é simplesmente atribuída; ela morre sem filhos por causa de seus próprios atos.
  alternative: A frase pode ser entendida de modo mais geral como contraste entre a ausência de filhos e a morte que lhe cabe.
  rationale: A negação seguida do adversativo e da oração causal vincula a morte às ações da mulher. A tradução mantém essa retribuição moral sem especificar que tipo de atos está em vista.
- issue: Valor temporal de ትመውት
  choice: 'Presente gnômico: “ela morre”.'
  alternative: 'Futuro judicial: “ela morrerá”.'
  rationale: O contexto favorece uma máxima geral, mas a forma verbal também admite matiz futuro; a tradução principal conserva o valor gnômico sem negar a alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem e a imagem do ge'ez foram preservadas sempre que permanecem naturais em português.
