  to: 'Eu lhes juro, pecadores: assim como uma montanha não se tornou escrava, nem uma colina se torna serva de uma mulher,[a] também o pecado não foi enviado sobre a terra; pelo contrário, os seres humanos o criaram a partir de si mesmos,[b] e os que o praticam ficarão sob uma grande maldição.'
