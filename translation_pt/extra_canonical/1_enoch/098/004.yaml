base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/004.yaml
  text: 'I swear to you[a], sinners: as a mountain has not become a slave, and a hill does not become a maidservant of a woman, so sin was not sent upon the earth; rather, men created it from themselves[c][b], and those who do it will come under a great curse.'
translation:
  language: pt
  text: 'Eu lhes juro, pecadores: assim como uma montanha não se tornou escrava, nem uma colina se torna serva de uma mulher,[a] também o pecado não foi enviado sobre a terra; pelo contrário, os seres humanos o criaram a partir de si mesmos,[b] e os que o praticam ficarão sob uma grande maldição.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A comparação inicial é textualmente difícil em ge'ez. O sentido parece ser que, assim como uma montanha ou colina não assume condição servil, o pecado também não é algo imposto à criação.
    reason: textual_variant
  - marker: b
    text: O ge'ez emprega literalmente a palavra “cabeça” com sufixo pronominal, uma construção reflexiva comum. Com a preposição “de”, a expressão significa “a partir de si mesmos” ou “por iniciativa própria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐልኩ
  choice: Eu lhes juro
  rationale: Preserva a força de uma declaração solene dirigida aos pecadores e soa natural em português.
- source_word: ኃጥኣን
  choice: pecadores
  rationale: Mantém o sentido moral e judicial próprio do discurso de condenação.
- source_word: ደብር
  choice: montanha
  rationale: Conserva a imagem topográfica concreta do texto.
- source_word: ገብረ
  choice: se tornou escrava
  rationale: Neste trecho difícil, mantém a forte imagem de sujeição servil, sem suavizá-la para mero serviço.
- source_word: እማገር ለብእሲት
  choice: serva de uma mulher
  rationale: Preserva o paralelo feminino e a relação de sujeição, embora a construção original seja obscura.
- source_word: ኃጢአትኒ ኢተፈነወት ዲበ ምድር
  choice: o pecado não foi enviado sobre a terra
  rationale: Reproduz a voz passiva e a negação de que o pecado tenha sido imposto à terra por um agente externo.
- source_word: አላ ሰብእ እምርእሶሙ ፈጠርዋ
  choice: pelo contrário, os seres humanos o criaram por si mesmos
  rationale: Traduz እምርእሶሙ como o reflexivo idiomático 'por si mesmos', evitando o literalismo enganoso 'de suas próprias cabeças'; 'seres humanos' expressa aqui o valor genérico de ሰብእ.
- source_word: ለመርገም ዐቢይ ይከውኑ
  choice: ficarão sob uma grande maldição
  rationale: Formulação portuguesa idiomática que conserva o destino judicial anunciado para os praticantes do pecado.
theological_decisions:
- issue: Origem do pecado no versículo
  choice: O pecado não é apresentado como enviado à terra; sua criação é atribuída aos próprios seres humanos.
  alternative: Entender a frase apenas como negação de que o pecado seja uma característica natural da criação.
  rationale: O contraste explícito entre 'não foi enviado' e 'os seres humanos o criaram' destaca a agência humana em oposição a uma imposição externa, sem desenvolver além do texto uma doutrina completa sobre a origem do mal.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. A estranheza da comparação inicial foi preservada no texto e esclarecida em nota; evitou-se tanto a paráfrase doutrinária quanto o literalismo enganoso no reflexivo ge'ez.
