base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/002.yaml
  text: For you men love adornment on yourselves more than women[a], and companionship more than a virgin; in kingship and in greatness and in authority and in silver and gold and purple[d][c][b], and in splendor and in food they will be poured out like water.
translation:
  language: pt
  text: Pois vocês, homens, gostam de adornar-se mais do que as mulheres e de trajes coloridos mais do que uma virgem[a]; na realeza, na grandeza, na autoridade, na prata, no ouro, na púrpura[b], no esplendor e na comida, serão derramados como água[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão traduzida por “trajes coloridos” é difícil. A palavra também pode significar “companhia” ou “associação”; nesse caso: “e de companhia mais do que uma virgem”.'
    reason: lexical_alternative
  - marker: b
    text: “Púrpura” provavelmente se refere a tecido tingido de alto custo, símbolo de luxo e posição social.
    reason: cultural_note
  - marker: c
    text: A imagem final pode indicar que esses luxos são esbanjados como água ou que eles próprios se dissiparão como água. O referente do plural também não é inteiramente claro.
    reason: alternative_reading
lexical_decisions:
- source_word: ሥነ፡ ትወድዩ፡ ላዕሌክሙ
  choice: gostam de adornar-se
  rationale: Entende ሥነ no campo de beleza ou adorno e ትወድዩ como ‘amam/gostam’, com ላዕሌክሙ indicando que o adorno é posto sobre os próprios homens.
- source_word: አንትሙ፡ ዕደው
  choice: vocês, homens
  rationale: Trata ዕደው como ‘homens’, conforme a revisão filológica mais recente, e não como ‘obras’ ou ‘atos’.
- source_word: ፈድፋደ፡ እምአንስት
  choice: mais do que as mulheres
  rationale: Lê ፈድፋደ እም como construção comparativa, ‘mais do que’, em vez de ‘excesso vindo de’.
- source_word: ኅብረ፡ ፈድፋደ፡ እምድንግል
  choice: trajes coloridos mais do que uma virgem
  rationale: No paralelo com adorno, toma ኅብረ no sentido de cor ou vestimenta colorida; reconhece-se em nota a possibilidade lexical de ‘companhia/associação’.
- source_word: በመንንግሥት፡ ወበዕበይ፡ ወበሥልጣን
  choice: na realeza, na grandeza, na autoridade
  rationale: Preserva a sequência nominal e os campos de condição régia, eminência e poder governante.
- source_word: ወክብር
  choice: no esplendor
  rationale: No catálogo de luxo visível, ‘esplendor’ expressa melhor a magnificência concreta do que o sentido relacional de ‘honra’.
- source_word: ከመ፡ ማይ፡ ይትከዐዉ
  choice: essas coisas serão derramadas como água
  rationale: Mantém a imagem passiva e deixa em aberto se os luxos são prodigalizados ou se acabam por se dissipar.
theological_decisions:
- issue: Se a censura recai especificamente sobre imoralidade sexual ou sobre ostentação e luxo
  choice: A tradução principal entende o paralelismo como crítica à ostentação masculina, incluindo adornos e roupas coloridas, dentro de um catálogo mais amplo de poder e luxo.
  alternative: Ler ኅብረ como ‘companhia/associação’, o que poderia sugerir relações indulgentes ou ilícitas com mulheres e virgens.
  rationale: A análise lexical revista de ሥነ, ዕደው e da construção comparativa favorece a ostentação, mas a ambiguidade de ኅብረ não deve ser apagada.
- issue: Referente do plural em ‘serão derramadas’
  choice: ‘essas coisas’ retoma coletivamente os bens, sinais de status e prazeres enumerados.
  alternative: O sujeito pode ser implicitamente os próprios ricos, ou a figura pode enfatizar que eles esbanjam tais bens como água.
  rationale: O texto etíope permite tensão quanto ao referente e ao valor da metáfora; a formulação evita definir além da evidência.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A segunda pessoa plural foi vertida por “vocês”; a enumeração solene foi preservada. A redação principal segue a revisão filológica que identifica uma comparação entre a ostentação dos homens e a das mulheres/virgens, sem ocultar a dificuldade de ኅብረ.
