base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/001.yaml
  text: And now I swear to you[a], to the wise and to the foolish[b], that you will see much upon the earth.
translation:
  language: pt
  text: E agora eu juro a vocês, aos sábios e aos insensatos, que vocês verão muitas coisas sobre a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “muito”; a expressão ge'ez enfatiza a abundância daquilo que os ouvintes verão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Marca com naturalidade a transição para uma nova advertência solene.
- source_word: እኔ፡ እምሕል
  choice: eu juro
  rationale: Mantém o pronome enfático e traduz እምሕል segundo o sentido específico de prestar juramento, central à força retórica da passagem.
- source_word: ለክሙ
  choice: a vocês
  rationale: Forma corrente e amplamente inteligível em português moderno para o objeto indireto plural.
- source_word: ለጠቢባን፡ ወለአብዳን
  choice: aos sábios e aos insensatos
  rationale: Preserva o contraste moral e sapiencial entre os dois grupos; “insensatos” é digno e menos coloquial que “tolos”.
- source_word: እስመ
  choice: que
  rationale: No contexto do verbo de juramento, introduz naturalmente em português o conteúdo asseverado, sem forçar uma relação causal.
- source_word: ብዙኅ
  choice: muitas coisas
  rationale: Explicita de modo idiomático o adjetivo/substantivo de abundância como objeto de “verão”; a formulação mais literal “muito” permanece em nota.
- source_word: ትሬእዩ
  choice: vocês verão
  rationale: Expressa com clareza o valor futuro da advertência.
- source_word: ዲበ፡ ምድር
  choice: sobre a terra
  rationale: Preserva o alcance espacial amplo e o registro apocalíptico sem restringir o sentido a uma terra ou região específica.
theological_decisions:
- issue: Alcance dos destinatários “os sábios e os insensatos”
  choice: Manter a referência direta aos dois grupos, sem especificar sua identidade
  alternative: Entender os termos como duas classes dentro de Israel ou como referência irônica sobretudo aos ímpios
  rationale: O versículo estabelece um contraste abrangente, mas não identifica mais precisamente os grupos; a tradução conserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O juramento solene foi preservado sem arcaísmos; “vocês” evita ambiguidade quanto ao plural.
