base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/009.yaml
  text: Woe to you[a], fools, for you will perish in your folly, and you oppress the wise[c][b], and good will not come upon you.
translation:
  language: pt
  text: Ai de vocês, insensatos! Pois perecerão em sua insensatez, esquecerão os sábios[a], e o bem não os alcançará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desconsiderarão os sábios” ou “negligenciarão os sábios”. O verbo significa literalmente “esquecer”, mas pode indicar falta de consideração prática.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o bem não os encontrará”. “O bem” pode incluir bem-estar, prosperidade ou bênção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo em linguagem portuguesa natural e solene.
- source_word: አብዳን
  choice: insensatos
  rationale: Expressa a censura moral e espiritual do termo sem recorrer a linguagem coloquial meramente insultuosa.
- source_word: ትትሐጐሉ
  choice: perecerão
  rationale: O verbo deriva de ሐጕለ e indica perecer ou perder-se; não significa confiar ou gloriar-se.
- source_word: በአቢድክሙ
  choice: em sua insensatez
  rationale: A forma está ligada à ideia de insensatez ou loucura, em paralelo com o vocativo 'insensatos', e não a riqueza.
- source_word: ለጠበብን
  choice: os sábios
  rationale: A expressão aponta mais naturalmente para pessoas sábias, mantendo o contraste sapiencial do versículo.
- source_word: ትረሰዕዎሙ
  choice: esquecerão
  rationale: O verbo ረስዐ significa esquecer; no contexto, pode também implicar desconsiderar ou negligenciar. A tradução mantém o sentido lexical direto.
- source_word: ሠናይት
  choice: o bem
  rationale: Mantém a amplitude do termo, que pode abranger bondade, bem-estar, prosperidade ou bênção.
- source_word: ኢይረክበክሙ
  choice: não os alcançará
  rationale: O verbo pode significar encontrar, atingir ou alcançar; com 'o bem' como sujeito, 'alcançar' é idiomático e preserva essa imagem.
theological_decisions:
- issue: Fundamento da denúncia
  choice: A denúncia associa a insensatez à perdição e ao esquecimento ou desconsideração dos sábios.
  alternative: Entender o versículo como condenação da confiança nas riquezas e da opressão dos sábios.
  rationale: Os termos etíopes deste versículo indicam 'perecer', 'insensatez' e 'esquecer'; a leitura sobre confiança nas riquezas parece importar conteúdo que não está neste texto.
- issue: Alcance de 'o bem'
  choice: Manter a expressão ampla 'o bem'.
  alternative: Especificar 'prosperidade', 'bem-estar' ou 'bênção'.
  rationale: O texto permite essas nuances, mas não exige uma delas; a formulação ampla evita resolver indevidamente a tensão semântica.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. O paralelismo entre “insensatos” e “insensatez” foi preservado. Evitou-se a leitura sobre riquezas presente em uma camada inglesa anterior, pois ela não corresponde aos lexemas do texto etíope fornecido.
