base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/007.yaml
  text: And do not imagine in your spirit[a], and do not say in your heart[c][b], that you do not know and do not see that every sin is written in heaven every day before the Most High.
translation:
  language: pt
  text: E não imaginem em seu espírito[a], nem digam em seu coração que vocês não sabem nem veem que todo pecado está escrito no céu, dia após dia[b], diante do Altíssimo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em sua mente” ou “no íntimo”.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão também pode indicar presença contínua: o registro permanece diante do Altíssimo todos os dias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢታምስሉ
  choice: não imaginem
  rationale: Expressa a proibição de uma suposição interior e autenganosa; “imaginem” mantém a dimensão mental sem transformar o verbo em mera aparência exterior.
- source_word: በመንፈስክሙ
  choice: em seu espírito
  rationale: Preserva a formulação antropológica do ge'ez e o paralelismo com “em seu coração”; a nota registra uma alternativa idiomática.
- source_word: ኢትበሉ በልብክሙ
  choice: nem digam em seu coração
  rationale: Mantém a imagem bíblica do coração como sede do pensamento e da deliberação interior.
- source_word: ኢታእምሩ ወኢትሬእዩ
  choice: vocês não sabem nem veem
  rationale: Os verbos estão na segunda pessoa do plural. “Veem” conserva a imagem concreta, em vez de a reduzir a “percebem”.
- source_word: ኵሉ ኃጢአት
  choice: todo pecado
  rationale: Reproduz o singular distributivo, indicando que cada pecado está incluído no registro.
- source_word: በሰማይ ይጸሐፍ
  choice: está escrito no céu
  rationale: Conserva a imagem apocalíptica explícita de um registro escrito no céu, sem a diluir numa afirmação geral sobre o conhecimento divino.
- source_word: ሀሎ በኵሉ ዕለት
  choice: dia após dia
  rationale: Comunica tanto a recorrência quanto a presença contínua do registro; a nota preserva essa nuance.
- source_word: በቅድሜሁ ለልዑል
  choice: diante do Altíssimo
  rationale: Mantém o título divino e a imagem de um registro permanentemente presente perante Deus.
theological_decisions:
- issue: Registro celestial dos pecados
  choice: Afirmar que todo pecado está escrito no céu e permanece diante do Altíssimo.
  alternative: Entender a frase apenas como declaração geral de que Deus conhece os pecados.
  rationale: O verbo “escrever” e a localização “no céu” sustentam a imagem concreta de um registro celestial, característica do cenário apocalíptico de juízo.
- issue: Pessoa gramatical da alegação
  choice: 'Manter a segunda pessoa do plural: “vocês não sabem nem veem”.'
  alternative: 'Converter em fala direta na primeira pessoa: “Não sabemos nem vemos”.'
  rationale: As formas verbais do ge'ez são de segunda pessoa plural; a tradução não deve impor uma fala direta em primeira pessoa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para refletir explicitamente a segunda pessoa plural. Conservam-se “espírito”, “coração” e “Altíssimo” por seu valor antropológico e apocalíptico, enquanto “dia após dia” evita uma construção excessivamente rígida.
