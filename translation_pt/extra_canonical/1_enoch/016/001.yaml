base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/016/001.yaml
  text: From the days of the slaughter and destruction and death of the giants[a], the spirits that have gone out from the souls of their flesh shall destroy without incurring judgment; thus they shall destroy until the day of the completion of the great judgment[d][c][b], when the great age shall be brought to its end.
translation:
  language: pt
  text: Desde os dias da matança, da destruição e da morte dos gigantes,[a] os espíritos que saíram das almas de sua carne[b] destruirão sem julgamento; assim destruirão até o dia em que se completar o grande julgamento, quando a grande era chegar ao seu fim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A abertura do versículo é textualmente difícil no testemunho disponível. O sentido geral é que, desde o tempo marcado pela matança, destruição e morte dos gigantes, esses espíritos prosseguem em sua ação devastadora.
    reason: textual_variant
  - marker: b
    text: “Os espíritos que saíram das almas de sua carne” traduz de modo bastante literal uma expressão incomum. No contexto, provavelmente se refere aos espíritos desencarnados associados à descendência dos Vigilantes.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “quando a grande ordem do mundo chegar à sua consumação”. O termo ge''ez pode significar “era”, “mundo” ou “ordem do mundo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እመዋዕለ
  choice: Desde os dias de
  rationale: Expressa o ponto inicial temporal indicado pela preposição e preserva a relação dessa época com a atividade posterior dos espíritos.
- source_word: ቀትል ወሙስና ወሞተ ረዓይት
  choice: a matança, a destruição e a morte dos gigantes
  rationale: Mantém a tríade catastrófica e inclui ረዓይት como “gigantes”, de acordo com o contexto e com o testemunho grego paralelo.
- source_word: ወፅአ መናፍስት እምነፍሳት ሥጋሆሙ
  choice: os espíritos que saíram das almas de sua carne
  rationale: Conserva a construção genitiva incomum do ge'ez em vez de interpretá-la como duas origens distintas ou suavizá-la como simples saída dos corpos.
- source_word: ዘያማስን
  choice: destruirão
  rationale: O verbo descreve uma atividade devastadora e é repetido no texto; “destruir” combina com a matança e a ruína do contexto imediato.
- source_word: ዘእንበለ ኵነኔ
  choice: sem julgamento
  rationale: Tradução formal que preserva a concisão e a possível ambiguidade da expressão, sem especificar indevidamente se se trata de sentença, condenação ou restrição judicial.
- source_word: እስከ ዕለተ ተፍጻሜት ኵነኔ ዐቢይ
  choice: até o dia em que se completar o grande julgamento
  rationale: Reproduz o momento culminante do juízo em português natural, mantendo tanto o “dia” quanto a ideia de conclusão.
- source_word: አመ ዓለም ዐቢይ ይትፌጸም
  choice: quando a grande era chegar ao seu fim
  rationale: “Era” expressa o valor temporal e escatológico de ዓለም, enquanto “chegar ao seu fim” conserva a noção de consumação sem sugerir necessariamente a aniquilação da criação.
theological_decisions:
- issue: Identidade dos espíritos
  choice: Mantê-los como espíritos saídos “das almas de sua carne” no texto principal.
  alternative: Identificá-los explicitamente como os espíritos desencarnados dos gigantes ou, de modo genérico, como almas humanas separadas do corpo.
  rationale: O contexto dos Vigilantes associa esses espíritos à descendência dos gigantes, mas a formulação ge'ez é difícil. A tradução preserva a linguagem do testemunho e deixa a identificação contextual para a nota.
- issue: Atividade sem julgamento
  choice: “destruirão sem julgamento”
  alternative: “destruirão sem serem julgados” ou “destruirão sem condenação”
  rationale: A forma escolhida retém a tensão da expressão original e evita definir antecipadamente a natureza ou o momento da ação judicial.
- issue: Sentido escatológico de ዓለም
  choice: “a grande era”
  alternative: “o grande mundo”, “a grande ordem do mundo” ou “a grande eternidade”
  rationale: “Era” comunica melhor um período ou ordem temporal que alcança sua consumação, sem impor uma doutrina posterior sobre o destino material do mundo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por uma sintaxe natural sem eliminar as formulações difíceis do testemunho ge'ez. A repetição de “destruirão” foi mantida por corresponder à ênfase do original.
