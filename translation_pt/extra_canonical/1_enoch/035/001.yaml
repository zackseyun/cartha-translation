base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/035/001.yaml
  text: And from there I went toward the west[a], to the ends of the earth, and there I saw three open portals of heaven, like what I had seen in the east[d][c][b], corresponding to their portals and corresponding to their outlets.
translation:
  language: pt
  text: E dali fui em direção ao oeste, até os confins da terra, e ali vi três portais do céu abertos[a], como os que eu havia visto no leste, correspondentes aos portais e às suas saídas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portas do céu” ou “janelas do céu”; o termo ge'ez indica aberturas celestes e pode se referir às passagens pelas quais os corpos celestes entram ou saem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእምህየ
  choice: E dali
  rationale: Preserva a fórmula narrativa de transição e o movimento sequencial da visão em português natural.
- source_word: ሖርኩ
  choice: fui
  rationale: Traduz diretamente o verbo de movimento sem acrescentar a ideia específica de uma viagem prolongada.
- source_word: መንገለ ዐረብ
  choice: em direção ao oeste
  rationale: ዐረብ designa o oeste, associado ao pôr do sol; a leitura também mantém a sequência das direções cardeais nos capítulos 33–36.
- source_word: በአጽናፈ ምድር
  choice: até os confins da terra
  rationale: Mantém a geografia cósmica e o tom elevado da visão apocalíptica.
- source_word: ሠለስተ ኆዋኅወ ሰማይ
  choice: três portais do céu
  rationale: “Portais” conserva a imagem arquitetônica de grandes aberturas celestes sem a especificidade excessiva de “portas” nem a conotação doméstica de “janelas”.
- source_word: ርኁዋተ
  choice: abertos
  rationale: Expressa de modo direto o estado dos portais e concorda naturalmente com o substantivo em português.
- source_word: በከመ ርኢኩ በምሥራቅ
  choice: como os que eu havia visto no leste
  rationale: Torna explícita a comparação com os portais vistos anteriormente, sem mudar o referente.
- source_word: በአምጣነ ኆዋኅው
  choice: correspondentes aos portais
  rationale: Preserva a repetição lexical de “portais” e comunica equivalência de disposição ou medida sem impor uma interpretação técnica.
- source_word: ወበአምጣነ ሞፃእቱ
  choice: e às suas saídas
  rationale: Mantém a noção de lugares de saída no esquema cosmológico, provavelmente relacionados à passagem dos corpos celestes.
theological_decisions:
- issue: Geografia cósmica e arquitetura celeste
  choice: Manter literalmente “confins da terra” e “portais do céu” como imagens da visão
  alternative: Naturalizar como “região mais distante do oeste” e “aberturas no céu”
  rationale: O texto apresenta uma topografia cósmica estruturada. A tradução deve conservar essa linguagem apocalíptica sem reduzi-la a uma descrição espacial moderna.
- issue: Sentido da correspondência entre portais e saídas
  choice: Preservar a formulação comparativa sem definir se a correspondência é de número, medida ou disposição
  alternative: Explicitar que os portais tinham exatamente o mesmo tamanho ou arranjo
  rationale: A expressão etíope admite uma relação de correspondência ou proporção, mas não determina com precisão sua natureza.
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa simples. Conserva-se a imagética cosmológica antiga e evita-se explicar no corpo do versículo aquilo que o ge'ez deixa em aberto.
