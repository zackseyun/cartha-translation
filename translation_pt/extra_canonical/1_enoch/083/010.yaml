base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/010.yaml
  text: And after this I arose and prayed and entreated and asked[a], and I wrote down my prayer for the generations of the world; and I showed you everything[b], my son Methuselah.
translation:
  language: pt
  text: Depois disso, levantei-me, orei, supliquei e pedi; escrevi a minha oração para as gerações do mundo[a]. E mostrarei tudo a você[b], meu filho Matusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para todas as gerações futuras” ou “para as gerações para sempre”. A expressão ge'ez também pode indicar gerações que perduram além da era presente.
    reason: lexical_alternative
  - marker: b
    text: 'A forma verbal no texto ge''ez transcrito é problemática; uma correção textual amplamente adotada permite: “E mostrarei tudo a você”. A leitura transmitida também tem sido entendida como “e ele mostrou tudo a você”.'
    reason: textual_variant
lexical_decisions:
- source_word: እምኔሁ
  choice: Depois disso
  rationale: Marca com naturalidade a sequência narrativa após a experiência anterior, sem perder o valor temporal do ge'ez.
- source_word: ተንሣእኩ
  choice: levantei-me
  rationale: Preserva a reação corporal expressa pelo verbo e mantém um registro digno e corrente.
- source_word: ጸለይኩ፡ ወአስተብቋዕኩ፡ ወሰአልኩ
  choice: orei, supliquei e pedi
  rationale: Mantém os três atos de oração distintos e a acumulação retórica do original.
- source_word: ጸሎትየ፡ ጸሐፍኩ
  choice: escrevi a minha oração
  rationale: Expressa diretamente o registro escrito da oração; em português, acrescentar “por escrito” seria redundante.
- source_word: ለትውልደ፡ ዓለም
  choice: para as gerações do mundo
  rationale: Conserva de modo transparente a formulação do testemunho ge'ez e deixa em aberto se ዓለም indica mundo, era ou duração perpétua.
- source_word: ኵሎ፡ አርአየከ
  choice: mostrei tudo a você
  rationale: Segue a forma verbal transmitida no texto fornecido e a sequência no passado, sem adotar silenciosamente a conjectura prospectiva “mostrarei”.
- source_word: ወልድየ፡ ማቱሳላ
  choice: meu filho Matusalém
  rationale: Forma natural de vocativo em português, preservando a relação filial e a forma tradicional do nome.
theological_decisions:
- issue: Alcance temporal de ለትውልደ ዓለም
  choice: para as gerações do mundo
  alternative: para todas as gerações futuras; para as gerações para sempre
  rationale: O campo semântico de ዓለም pode envolver mundo, era ou duração indefinida. A tradução principal permanece próxima do ge'ez, e a nota registra as leituras temporais possíveis.
- issue: Tempo e pessoa de አርአየከ no testemunho fornecido
  choice: mostrei tudo a você
  alternative: mostrarei tudo a você
  rationale: O texto apresentado sustenta formalmente uma leitura passada, embora tenha sido proposta uma correção textual para uma forma de imperfeito/subjuntivo com sentido prospectivo. Como a evidência crítica dessa correção não integra diretamente o testemunho fornecido, preserva-se a leitura transmitida e registra-se a alternativa em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A sequência reiterativa dos verbos de oração foi preservada. O tratamento “a você” evita regionalismo excessivo e torna explícito o objeto do verbo.
