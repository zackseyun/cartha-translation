base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/004.yaml
  text: And when it fell upon the earth[a], I saw the earth being swallowed into a great abyss, and mountains were suspended upon mountains, and hills sank down upon hills[d][c][b], and tall trees were cut off from their trunks and were thrown down and sank into the abyss.
translation:
  language: pt
  text: E, quando ele caiu sobre a terra, vi a terra ser engolida por um grande abismo[a]; montanhas ficaram suspensas sobre montanhas[b], colinas afundaram sobre colinas, e árvores altas foram decepadas de suas bases[c], lançadas por terra e submersas no abismo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande profundidade” ou “um grande precipício”. O termo ge'ez designa uma vastidão profunda; “abismo” preserva a força apocalíptica.
    reason: lexical_alternative
  - marker: b
    text: A expressão incomum “montanhas ficaram suspensas sobre montanhas” reproduz deliberadamente a estranha imagem da visão.
    reason: cultural_note
  - marker: c
    text: Ou “de suas cepas”. O texto descreve as árvores como cortadas de sua parte inferior ou base; não diz que foram arrancadas pela raiz.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቅ
  choice: ele caiu
  rationale: O imperfeito em sequência narrativa é vertido como passado simples. O pronome preserva a referência anafórica implícita no contexto sem identificar além do que o texto permite.
- source_word: ትትወሐጥ
  choice: ser engolida
  rationale: Preserva a imagem passiva e vívida da terra sendo consumida, sem transformá-la em explicação.
- source_word: ቀላይ ዐቢይ
  choice: um grande abismo
  rationale: “Abismo” conserva melhor a força cósmica e apocalíptica de uma vasta profundidade.
- source_word: አድባር ዲበ አድባር ይስቀሉ
  choice: montanhas ficaram suspensas sobre montanhas
  rationale: Mantém a imagem visionária incomum de suspensão, em vez de normalizá-la como simples acúmulo.
- source_word: አውግር ዲበ አውግር ይሰጠሙ
  choice: colinas afundaram sobre colinas
  rationale: O verbo expressa afundamento ou submersão; a formulação conserva a estranheza espacial do original.
- source_word: ዕፀወ ነዋኃት
  choice: árvores altas
  rationale: Tradução clara e corrente do qualificativo de altura.
- source_word: ይትገዘሙ እምጕንዶቲሆሙ
  choice: foram cortadas de seus troncos
  rationale: O verbo significa cortar ou decepar, não arrancar pela raiz; “troncos” representa com cautela a base ou cepa especificada.
- source_word: ይትገደፉ
  choice: lançadas por terra
  rationale: Conserva a força passiva de lançar ou derrubar e soa natural em português.
- source_word: ይሰጠሙ ውስተ ቀላይ
  choice: submersas no abismo
  rationale: Expressa o sentido de afundar ou submergir e mantém a coerência da imagem do abismo.
theological_decisions:
- issue: Natureza das imagens da catástrofe cósmica
  choice: Apresentar concretamente o colapso visionário da criação, sem decodificar montanhas, colinas ou árvores como símbolos no texto principal.
  alternative: Interpretar as imagens como agitação política, terremoto ou inundação.
  rationale: A tradução deve preservar as imagens apocalípticas e sua tensão, deixando sua interpretação simbólica em aberto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe conserva o encadeamento da visão e suas imagens deliberadamente estranhas, sem arcaísmos desnecessários.
