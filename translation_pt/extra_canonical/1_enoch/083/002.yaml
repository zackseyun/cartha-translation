base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/002.yaml
  text: 'I saw two visions before I took a wife[a], and one of them was not like the other: the first when I was learning the book, and the second before I took your mother—I saw a mighty vision[d][c][b]; and concerning them I made supplication to the Lord.'
translation:
  language: pt
  text: 'Vi duas visões antes de me casar, e uma não se parecia com a outra. A primeira ocorreu quando eu aprendia o livro[a]; a segunda, antes de me casar com tua mãe: vi uma visão poderosa[b]. Por causa delas[c], supliquei ao Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando eu era instruído no livro”. O verbo ge’ez pode indicar tanto aprender quanto receber instrução.'
    reason: lexical_alternative
  - marker: b
    text: “Uma visão poderosa” também pode ser traduzida por “uma visão intensa” ou “severa”; o termo ressalta a força da experiência visionária.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a respeito delas”. A expressão pode indicar tanto o assunto da súplica quanto a causa que a motivou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ክልኤተ፡ ራእየ
  choice: duas visões
  rationale: Expressa diretamente as duas experiências visionárias e conserva o registro apocalíptico.
- source_word: ርኢኩ
  choice: vi
  rationale: Forma simples e natural para o relato visionário em primeira pessoa.
- source_word: እንበለ፡ እንሣእ፡ ብእሲተ
  choice: antes de tomar uma mulher por esposa
  rationale: Preserva o idioma matrimonial da fonte, mas o explicita de modo compreensível em português moderno.
- source_word: ወአሐዱሂ፡ እምኔሆሙ፡ ኢይትማሰል፡ ምስለ፡ ካልኡ
  choice: e uma delas não era semelhante à outra
  rationale: Mantém a comparação negativa explícita entre as duas visões.
- source_word: አመ፡ እትሜሀር፡ መጽሐፈ
  choice: quando eu aprendia o livro
  rationale: Conserva tanto o sentido de aprendizagem quanto a referência concreta a 'o livro'; a possível leitura passiva é registrada em nota.
- source_word: እንበለ፡ እንሥእ፡ ለእምከ
  choice: antes de tomar a sua mãe por esposa
  rationale: Mantém o idioma matrimonial e a referência familiar direta ao interlocutor.
- source_word: ራእየ፡ ጽኑዐ
  choice: uma visão poderosa
  rationale: Comunica a força e a intensidade de ጽኑዐ sem determinar que a visão tenha sido necessariamente aterradora ou severa.
- source_word: ወበእንቲአሆሙ፡ አስተብቋዕክዎ፡ ለእግዚእ
  choice: Por causa delas, supliquei ao Senhor
  rationale: Expressa uma relação causal plausível entre as visões e a súplica; a leitura temática alternativa é preservada em nota.
theological_decisions:
- issue: Tradução de ለእግዚእ
  choice: ao Senhor
  alternative: ao Soberano / ao Mestre
  rationale: No contexto de súplica dirigida a Deus, 'Senhor' é natural, digno e preserva o peso teológico sem introduzir formulação cristológica posterior.
- issue: Relação expressa por በእንቲአሆሙ
  choice: por causa delas
  alternative: a respeito delas
  rationale: A leitura causal apresenta as visões como motivo da súplica, mas a preposição também admite referência temática; essa ambiguidade é explicitada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com leve elevação própria de um relato apocalíptico. O idioma antigo de 'tomar por esposa' foi preservado em forma explicitada; a pontuação procura manter o paralelismo difícil da fonte sem apagar sua tensão sintática.
