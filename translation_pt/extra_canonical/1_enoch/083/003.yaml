base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/003.yaml
  text: I was lying down in the house of my grandfather Mahalalel[a], and I saw in a vision that the heaven was being cleansed and swept away[c][b], and it fell upon the earth.
translation:
  language: pt
  text: Eu estava deitado na casa de meu avô Maalalel e vi, numa visão, que o céu desabava, era levado embora e caía sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስኩበ፡ ኮንኩ
  choice: Eu estava deitado
  rationale: A construção perifrástica com o particípio e ኮንኩ apresenta um estado contínuo no passado, como pano de fundo para a visão, e não apenas o ato pontual de deitar-se.
- source_word: በቤት
  choice: na casa
  rationale: Preserva de modo natural o cenário doméstico concreto.
- source_word: መላሕእል
  choice: Maalalel
  rationale: Transliteração portuguesa corrente do nome ancestral, em harmonia com a tradição bíblica lusófona.
- source_word: እምሑውየ
  choice: de meu avô
  rationale: O termo designa um ascendente; no contexto genealógico de Enoque, Maalalel é especificamente seu avô.
- source_word: ርኢኩ፡ በራእይ
  choice: vi, numa visão
  rationale: Expressa naturalmente tanto o ato de ver quanto o meio visionário da percepção.
- source_word: ሰማይ
  choice: o céu
  rationale: Em português, «o céu» mantém o referente cósmico e a linguagem apocalíptica sem a estranheza de uma formulação excessivamente literal.
- source_word: ይትነጻጻ
  choice: desabava
  rationale: Adota a leitura textual corrigida associada a ይትነጻጸው e à raiz com sentido de ser derrubado ou desmoronar, coerente com a subsequente queda do céu; evita derivar o termo da raiz de purificação com base no OCR defeituoso.
- source_word: ወይትሀየድ
  choice: era levado embora
  rationale: Comunica remoção violenta ou arrebatamento sem especificar indevidamente o agente.
- source_word: ወይወድቅ፡ ዲበ፡ ምድር
  choice: e caía sobre a terra
  rationale: Preserva a sequência verbal e a escala cósmica da queda, usando o imperfeito para acompanhar a cena visionária em desenvolvimento.
theological_decisions:
- issue: Referente cósmico de ሰማይ
  choice: o céu como realidade cósmica
  alternative: o firmamento ou apenas o céu visível
  rationale: A visão retrata uma convulsão cósmica. «O céu» conserva a amplitude apocalíptica sem restringir a imagem a um fenômeno meteorológico.
- issue: Purificação ou colapso do céu
  choice: desabava
  alternative: estava sendo purificado
  rationale: A forma transmitida parece refletir erro de OCR; a leitura corrigida e o contexto imediato da queda favorecem colapso ou derrubada, não purificação. Isso evita introduzir uma interpretação cultual alheia à cena.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A coordenação verbal conserva a vividez da visão e a possível sobreposição entre desabamento, remoção e queda.
