base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/006.yaml
  text: And Malyal my grandfather lifted me up while I was lying beside him[a], and he said to me, “Why do you cry out like this, my son[c][b], and why do you lament like this?”
translation:
  language: pt
  text: 'E Malyal, meu avô, levantou-me enquanto eu estava deitado ao lado dele e me disse: “Por que você grita assim, meu filho, e por que se lamenta assim?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome “Malyal” provavelmente corresponde ao patriarca Mahalalel; aqui se conserva a forma encontrada no texto etíope.
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእያል
  choice: Malyal
  rationale: Mantém no texto principal a forma do nome preservada pela testemunha etíope, sem normalizá-la silenciosamente para Mahalalel.
- source_word: እምሔውየ
  choice: meu avô
  rationale: A forma é entendida como o substantivo 'avô' com sufixo de primeira pessoa, conforme a revisão filológica mais recente, e não como uma expressão locativa.
- source_word: አንሥአኒ
  choice: levantou-me
  rationale: Expressa de modo natural a ação física de erguer alguém, preservando a vivacidade do verbo.
- source_word: እንዘ እነ እስክብ
  choice: enquanto eu estava deitado
  rationale: Conserva o estado simultâneo de estar deitado sem acrescentar a ideia não explícita de sono.
- source_word: ኀቤሁ
  choice: ao lado dele
  rationale: Comunica concretamente a proximidade espacial indicada pela preposição.
- source_word: ትጸርኅ
  choice: você grita
  rationale: Representa um clamor em voz alta sem restringi-lo indevidamente a choro, dor ou proclamação.
- source_word: ወልድየ
  choice: meu filho
  rationale: É a forma portuguesa natural e digna para a interpelação familiar e afetuosa.
- source_word: ትአወዩ
  choice: se lamenta
  rationale: Distingue esta ação do grito anterior e preserva sua dimensão emocional e vocal.
theological_decisions:
- issue: Identidade de መላእያል
  choice: Manter “Malyal” no texto principal
  alternative: Normalizar como “Mahalalel”
  rationale: A forma etíope é preservada por primazia da testemunha-fonte; a provável identificação com o patriarca Mahalalel é informada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção preserva a sequência entre gritar e lamentar, evitando fundir as duas ações.
