base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/011.yaml
  text: And when I went out below and saw the heaven[a], and the sun rising in the east, and the moon setting in the west, and a few stars, and the whole earth, and everything as He had known it in the beginning, then I blessed the Lord of judgment and extolled Him, because He had brought forth the sun from the windows of the east, and it ascended and rose on the face of the heaven[c][b], and set out and followed the path which He showed it.
translation:
  language: pt
  text: E, quando saí para baixo[a] e vi o céu[b], o sol nascendo no leste, a lua se pondo no oeste, algumas estrelas, toda a terra e tudo tal como ele o conhecera no princípio[c], bendisse o Senhor do juízo e o exaltei, porque ele fizera o sol sair pelas janelas do leste. O sol subiu, elevou-se sobre a face do céu, pôs-se a caminho e seguiu a rota que ele lhe havia mostrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «embaixo» ou «para uma região inferior»; o cenário do sonho não permite determinar com precisão o lugar indicado.
    reason: lexical_alternative
  - marker: b
    text: O texto literalmente usa primeiro um pronome objeto, algo como «e o vi», e em seguida identifica o objeto como «o céu». Portanto, o pronome não precisa referir-se a uma figura masculina não identificada.
    reason: source_clarification
  - marker: c
    text: O referente de «ele» não é explicitado nesta frase; pode ser entendido a partir do contexto mais amplo, mas a tradução não o identifica.
    reason: ambiguity
lexical_decisions:
- source_word: ሶበ
  choice: quando
  rationale: Conjunção temporal que introduz a sequência; o waw precedente é representado por «E».
- source_word: ወፃእኩ
  choice: saí
  rationale: Forma perfeita na primeira pessoa do verbo «sair»; a opção é direta e não especifica indevidamente o ponto de partida.
- source_word: ታሕተ
  choice: para baixo
  rationale: Mantém o sentido espacial de movimento para baixo, sem definir um destino que o contexto imediato não explicita.
- source_word: ወርኢክዎ
  choice: e vi o céu
  rationale: O sufixo objeto masculino singular é entendido como pronome antecipatório retomado pelo substantivo «céu» na continuação textual atestada da edição, e não como referência independente a uma pessoa.
- source_word: ሰማይ
  choice: céu
  rationale: Equivalente corrente e natural para o substantivo etíope que designa o céu ou firmamento.
theological_decisions:
- issue: Identidade do objeto pronominal em ወርኢክዎ
  choice: 'Entender o sufixo como antecipação de «o céu»: «e vi o céu».'
  alternative: Traduzir isoladamente «e eu o vi», deixando aberta uma referência pessoal.
  rationale: A continuação do texto na edição de Charles traz «o céu» imediatamente após a forma verbal. A construção com pronome antecipatório explica o sufixo e evita criar uma figura masculina não identificada.
- issue: Referente de «ele» em «conforme ele o conhecera no princípio»
  choice: Preservar o pronome sem explicitar seu referente.
  alternative: Substituir o pronome por «Deus», «o Senhor» ou «Enoque».
  rationale: A formulação recebida não identifica inequivocamente o referente neste ponto; explicitá-lo resolveria uma ambiguidade genuína e poderia introduzir interpretação teológica.
- issue: Pronomes referentes ao Senhor e ao sol
  choice: Usar minúsculas e repetir «o sol» no início da última oração.
  alternative: Empregar maiúsculas reverenciais ou manter apenas pronomes masculinos sucessivos.
  rationale: As minúsculas seguem o uso moderno sem negar reverência. A repetição de «o sol» evita confundir seu movimento com a ação do Senhor, sem alterar o conteúdo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com «leste/oeste» em vez de formas mais literárias. Conserva imagens apocalípticas como «janelas do leste» e «face do céu». A redação restaura a continuação do versículo documentada na edição indicada, pois o recorte ge'ez fornecido termina prematuramente após a forma verbal.
