base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/009.yaml
  text: My son[a], from heaven all this will come upon the earth[c][b], and upon the earth there will be a great destruction.
translation:
  language: pt
  text: Meu filho, do céu tudo isso virá sobre a terra[a], e sobre a terra haverá grande destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Terra” também pode significar “região” ou “país” em certos contextos; aqui, o cenário apocalíptico favorece o sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወልድየ
  choice: Meu filho
  rationale: O sufixo indica posse na primeira pessoa. A expressão funciona como vocativo no contexto e não é interpretada como título messiânico.
- source_word: እምሰማይ
  choice: do céu
  rationale: Preserva de modo natural o sentido ablativo e a imagem vertical da visão apocalíptica.
- source_word: ይሄሉ
  choice: virá
  rationale: O verbo é entendido a partir de ሀለወ, 'ser, existir', e não como verbo de fala. Em combinação com 'do céu' e 'sobre a terra', 'virá' comunica naturalmente o movimento implícito sem inventar uma citação.
- source_word: ኵሉዝ
  choice: tudo isso
  rationale: Expressa totalidade com provável nuance dêitica, remetendo ao conteúdo da visão, embora o referente exato permaneça um pouco incerto.
- source_word: ዲበ
  choice: sobre
  rationale: Mantém nas duas ocorrências a relação espacial de algo que vem do céu e alcança a terra.
- source_word: ምድር
  choice: a terra
  rationale: O contexto apocalíptico favorece o sentido cósmico de 'terra', embora 'região' ou 'país' possa ocorrer em outros contextos.
- source_word: ይከውን
  choice: haverá
  rationale: A construção existencial é natural em português diante do sintagma nominal seguinte.
- source_word: ሐጕል
  choice: destruição
  rationale: Conserva a ideia ampla de ruína devastadora sem restringi-la a um cenário exclusivamente militar.
- source_word: ዐቢይ
  choice: grande
  rationale: É o intensificador mais transparente e natural para indicar a escala da destruição.
theological_decisions:
- issue: Identidade de “meu filho”
  choice: Manter literalmente a expressão familiar como vocativo, sem interpretá-la como título messiânico.
  alternative: “Meu filho” como designação de uma figura simbólica dentro do sonho.
  rationale: O versículo não oferece dados suficientes para definir a identidade da pessoa interpelada; a tradução preserva a abertura interpretativa.
- issue: Análise de ይሄሉ
  choice: Entender o verbo como forma de “ser/existir” e traduzi-lo contextualmente por “virá”.
  alternative: “dirá”, com a introdução de uma fala direta.
  rationale: A análise verbal e a sintaxe favorecem “ser/existir”; a alternativa cria um ato de fala e uma citação que não estão sustentados pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. A repetição de “sobre a terra” foi preservada por corresponder à estrutura enfática do texto ge'ez.
