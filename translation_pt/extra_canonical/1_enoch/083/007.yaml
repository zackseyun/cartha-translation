base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/007.yaml
  text: 'And I told him all the vision that I had seen[a], and he said to me, “Severe is the sight you have seen, my son, and mighty is the vision of your dream: it reveals all the hidden sin of the earth[f][e][d][c][b], and it is about to sink into the abyss and be destroyed with a great destruction.”'
translation:
  language: pt
  text: 'E eu lhe contei toda a visão que tinha visto. Então ele me disse: “É terrível o que você viu, meu filho, e poderosa é a visão do seu sonho: ela revela todo o pecado oculto da terra[a], e esta está prestes a afundar no abismo[b] e a sofrer uma grande destruição.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A cláusula etíope é difícil. O verbo parece pertencer ao campo de “ocultar” ou “esconder”; também se pode entender: “ela ocultou todo o pecado da terra” ou, mais amplamente, que a visão trata do pecado oculto da terra e de seu julgamento.'
    reason: lexical_alternative
  - marker: b
    text: “Abismo” traduz um termo que também pode significar “profundezas” ou “mar”.
    reason: lexical_alternative
  - marker: c
    text: O referente das formas pronominais nas cláusulas finais não é inteiramente claro; elas podem apontar para a terra, para o pecado ou para a realidade anunciada pela visão.
    reason: ambiguity
lexical_decisions:
- source_word: ነገርክዎ
  choice: lhe contei
  rationale: Expressa naturalmente o ato de relatar a visão, mantendo o destinatário indicado pelo sufixo pronominal.
- source_word: ራእየ
  choice: visão
  rationale: No contexto apocalíptico, designa uma experiência visionária, e não uma percepção visual comum.
- source_word: ጽኑዐ
  choice: terrível
  rationale: O adjetivo comunica a gravidade e o caráter assustador daquilo que Enoque viu; é mais natural em português do que uma reprodução literal como “dura” ou “severa”.
- source_word: ኃያለ
  choice: poderosa
  rationale: Preserva a ideia de força avassaladora atribuída à visão do sonho.
- source_word: ኅቡኣተ ኵሉ ኃጢአተ ምድር
  choice: ela revela todo o pecado oculto da terra
  rationale: A construção é difícil. Esta formulação mantém a noção lexical de ocultação e dá sentido contextual à visão, sem transformar o singular coletivo “pecado” em plural.
- source_word: ትሰጠም
  choice: está prestes a afundar
  rationale: Conserva a imagem de submersão e o aspecto iminente sugerido pela construção verbal.
- source_word: ቀላይት
  choice: abismo
  rationale: O termo pode indicar o mar ou as profundezas; “abismo” preserva melhor a dimensão cósmica e judicial da passagem.
- source_word: ተሐጕል ኅጕለ ዐቢየ
  choice: sofrer uma grande destruição
  rationale: A expressão emprega uma construção cognata do campo semântico de perecer ou destruir. A tradução conserva a intensidade sem recorrer à leitura incorreta de “grande escuridão”.
theological_decisions:
- issue: Referente dos elementos femininos nas cláusulas finais
  choice: Empregam-se “ela” e “esta”, deixando a visão e a terra disponíveis no encadeamento, embora “esta” aponte mais naturalmente para a terra.
  alternative: Identificar explicitamente a terra, o pecado ou a visão como sujeito de todas as cláusulas.
  rationale: A sequência etíope é sintaticamente condensada e não permite fixar com segurança um único referente para cada forma pronominal; a tradução evita impor uma interpretação teológica exclusiva.
- issue: Relação entre a visão e o pecado oculto
  choice: A visão revela o pecado oculto.
  alternative: A visão “ocultou todo o pecado da terra” ou trata dos segredos ligados ao pecado da terra.
  rationale: A leitura escolhida é coerente com a função reveladora do sonho, mas a dificuldade lexical é registrada em nota para não apagar a ambiguidade do texto etíope.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão ampla no espaço lusófono. A repetição semítica foi preservada quando contribui para a solenidade (“poderosa é a visão”), mas suavizada onde resultaria artificial (“É terrível o que você viu”).
