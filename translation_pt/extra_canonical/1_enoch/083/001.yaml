base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/001.yaml
  text: And now[a], my son Methuselah, I will show you all my visions that I have seen before you; I will recount them.
translation:
  language: pt
  text: E agora, meu filho Matusalém, mostrarei a você todas as visões que vi e as relatarei diante de você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto emprega dois verbos de comunicação: primeiro “mostrar” e depois “relatar”. A combinação ressalta tanto a apresentação das visões quanto sua narração em palavras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Funciona como marcador discursivo de transição e introduz naturalmente um novo ato de fala.
- source_word: አርእየከ፡
  choice: mostrarei a você
  rationale: Preserva o verbo causativo de mostrar e o objeto de segunda pessoa; o futuro se ajusta ao anúncio do que Enoque está prestes a revelar.
- source_word: ወልድየ፡ ማቱሳላ፡
  choice: meu filho Matusalém
  rationale: Mantém o tratamento filial direto e emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: ኵሎ፡ ራእያትየ፡
  choice: todas as visões
  rationale: Conserva o registro visionário e apocalíptico do substantivo, sem ampliá-lo para o sentido mais geral de revelações.
- source_word: እለ፡ ርኢኩ፡
  choice: que tive
  rationale: Em português, ter uma visão expressa de modo natural a experiência de vê-la, sem alterar seu caráter visionário.
- source_word: በቅድሜከ፡
  choice: diante de você
  rationale: Mantém a linguagem espacial ou presencial do ge'ez e sua ligação sintática com as visões anteriormente vistas, embora o sentido exato permaneça incomum.
- source_word: እነግር።
  choice: eu as relatarei
  rationale: Expressa o ato de contar ou narrar e o distingue do verbo anterior, mostrar.
theological_decisions:
- issue: Relação entre “mostrar” e “relatar”
  choice: 'Manter os dois verbos distintos: “mostrarei” e “relatarei”.'
  alternative: Fundir ambos em um único verbo, como “contarei” ou “revelarei”.
  rationale: O ge'ez apresenta dois atos de comunicação; preservar ambos mantém a tensão entre a apresentação visionária e sua narração verbal.
- issue: Ligação de “diante de você”
  choice: 'Ligá-lo à oração relativa: “as visões que tive diante de você”.'
  alternative: 'Ligá-lo ao verbo final: “eu as relatarei diante de você”.'
  rationale: A ordem do texto-fonte favorece sua ligação com o verbo “vi/tive”, ainda que a construção resultante seja semanticamente incomum; a tradução não a desloca para produzir uma leitura mais fácil.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe relativamente formal. “A você” favorece inteligibilidade internacional com boa legibilidade brasileira; “diante de você” preserva a formulação presencial do original sem resolver sua possível ambiguidade.
