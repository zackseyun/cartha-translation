base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/008.yaml
  text: And now[a], my son, rise and make your petition to the Lord of glory, since you are faithful[b], that a remnant may remain upon the earth and that he may not wipe out the whole earth.
translation:
  language: pt
  text: E agora, meu filho, levante-se e apresente sua súplica ao Senhor da glória[a], pois você é fiel[b], para que um remanescente permaneça[c] sobre a terra e para que ele não destrua toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Senhor da glória”; o título divino formal foi preservado.
    reason: cultural_note
  - marker: b
    text: O termo também pode transmitir as ideias de “crente” ou “digno de confiança”.
    reason: lexical_alternative
  - marker: c
    text: O ge’ez emprega palavras da mesma raiz, literalmente algo como “que permaneça um remanescente”, reforçando a ideia do que sobrevive ou é poupado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥእ
  choice: levante-se
  rationale: Expressa de modo natural e direto o imperativo de erguer-se, preservando a urgência da exortação.
- source_word: አስተብቍዖ
  choice: apresente sua súplica
  rationale: Conserva o sentido de pedido insistente e intercessório, com registro digno e mais específico que o simples verbo “orar”.
- source_word: ለእግዚአ ስብሐት
  choice: ao Senhor da glória
  rationale: Mantém formalmente o título divino genitivo do ge’ez, sem o reduzir a um adjetivo qualificativo.
- source_word: መሃይምን
  choice: fiel
  rationale: Preserva tanto a ideia de fé quanto a de constância ou confiabilidade, sem restringir o termo à crença intelectual.
- source_word: ይትረፍ ትራፍ
  choice: um remanescente permaneça
  rationale: Reproduz a ênfase da construção cognata do ge’ez e conserva o motivo apocalíptico de sobrevivência ao juízo.
- source_word: ወኢይደምስሳ ለኵላ ምድር
  choice: e para que ele não destrua toda a terra
  rationale: “Destrua” comunica com clareza a ideia de eliminação devastadora, enquanto “toda a terra” mantém o alcance total da expressão.
theological_decisions:
- issue: Se መሃይምን deve enfatizar crença interior ou confiabilidade religiosa
  choice: fiel
  alternative: crente; digno de confiança
  rationale: No contexto, a qualidade fundamenta a aptidão do filho para interceder. “Fiel” mantém juntas as dimensões de fé e constância sem resolver a tensão em favor de apenas uma delas.
- issue: Identidade do sujeito implícito do verbo de destruição
  choice: ele
  alternative: o Senhor
  rationale: O ge’ez deixa o sujeito na forma verbal e o contexto aponta para o Senhor; o pronome preserva essa referência contextual sem explicitar mais do que a fonte.
translation_notes:
  register: Português moderno, digno e acessível, com formas correntes no Brasil. A construção “Senhor da glória” conserva o tom apocalíptico formal; “você” e “levante-se” evitam uma alternância artificial com formas verbais de segunda pessoa. A repetição semântica em “um remanescente permaneça” é deliberada e reflete a ênfase do original.
