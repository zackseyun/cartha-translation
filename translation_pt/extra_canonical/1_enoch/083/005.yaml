base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/005.yaml
  text: And a word fell into my mouth because of it[a], and I lifted up a cry and said[d][c][b], “The earth is destroyed.”
translation:
  language: pt
  text: 'E, por causa disso[a], uma palavra caiu em minha boca[b], e levantei um clamor e disse: “A terra foi destruída.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a partir disso” ou “então”; a expressão pode indicar origem, causa ou sequência em relação à visão anterior.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma palavra caiu em minha boca”, expressão que descreve uma fala que sobreveio ao visionário.
    reason: cultural_note
  - marker: c
    text: O verbo também pode ser traduzido por “pereceu”. Aqui não se repete o verbo “engolir” empregado no versículo anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: por causa disso
  rationale: A preposição com sufixo pode indicar origem, causa ou sequência. No relato da visão, a leitura causal é natural, sem excluir as demais possibilidades, registradas em nota.
- source_word: ወድቀ ነገር ውስተ አፉየ
  choice: uma palavra caiu em minha boca
  rationale: Mantém a imagem incomum do ge'ez, que sugere uma fala que sobrevém ao visionário, em vez de reduzi-la simplesmente a “falei”.
- source_word: አንሣእኩ እጽራሕ
  choice: levantei um clamor
  rationale: Preserva o verbo de levantar/erguer e a força emocional de um grito ou clamor, sem especificar indevidamente se se trata de lamento, alarme ou proclamação.
- source_word: ተሐጕለት
  choice: foi destruída
  rationale: O verbo expressa destruição ou perecimento; esta tradução respeita a mudança lexical em relação ao verbo de engolir empregado no versículo anterior.
- source_word: ምድር
  choice: a terra
  rationale: No contexto da visão apocalíptica, “terra” preserva a amplitude cósmica possível do termo, embora “região” ou “país” possam ser sentidos mais restritos em outros contextos.
theological_decisions:
- issue: Amplitude de ምድር na visão apocalíptica do dilúvio
  choice: a terra
  alternative: a região / o país
  rationale: A linguagem visionária favorece a amplitude de “terra”, sem acrescentar uma definição doutrinária sobre a extensão histórica ou geográfica do acontecimento.
- issue: Natureza da fala de Enoque
  choice: preservar a expressão “uma palavra caiu em minha boca”
  alternative: comecei a falar / vieram-me palavras
  rationale: A formulação concreta conserva a possível ideia de uma declaração involuntária ou inspirada, mas não determina dogmaticamente sua origem.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção visionária deliberadamente incomum foi preservada, enquanto a pontuação e o encadeamento foram ajustados para fluência natural.
