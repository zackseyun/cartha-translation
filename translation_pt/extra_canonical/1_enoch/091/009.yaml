revisions:
- from: E todos os ídolos serão lançados fora juntamente com as nações[a], e os templos[b] serão queimados no fogo. Eles os removerão de toda a terra, e serão lançados no julgamento de fogo[c]; perecerão sob a ira e sob um julgamento poderoso, para sempre[d].
  to: E todos os ídolos serão lançados fora juntamente com as nações[a], e os templos[b] serão queimados no fogo. E os removerão de toda a terra, e serão lançados no juízo de fogo[c]; perecerão sob a ira e sob um juízo poderoso, para sempre[d].
  rationale: A revisão é limitada à coesão e à idiomaticidade do português. Remove-se o sujeito explícito sem antecedente claro, preservando o agente plural não identificado do original, e emprega-se «juízo» nas duas expressões judiciais. Mantêm-se as correções críticas de «ídolos» e «templos», bem como as notas que sinalizam a dificuldade de leitura e as alternativas relevantes.
