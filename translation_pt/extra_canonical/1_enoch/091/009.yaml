  source_fidelity: 'A tradução adota corretamente as correções críticas já registradas no histórico para a transcrição/OCR: «todos os ídolos» e o edifício cultual («templos», com «torres» como alternativa) em vez de uma tradução da sequência corrompida. Ela também conserva a cadeia de expulsão, juízo de fogo, ira, juízo poderoso e duração final. A construção verbal de ወይወፅእዎሙ preserva um agente plural não identificado e um objeto plural; o português pode fazê-lo sem introduzir o pronome «Eles», que não tem antecedente claro.'
