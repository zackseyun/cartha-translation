base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/009.yaml
  text: And all will be given over with the nations[a], and the towers will be burned with fire; and they will be removed from all the earth, and they will be cast into the judgment of fire[d][c][b], and they will perish in wrath and in mighty judgment forever.
translation:
  language: pt
  text: E todos os ídolos serão lançados fora juntamente com as nações[a], e os templos[b] serão queimados no fogo. E os removerão de toda a terra, e serão lançados no juízo de fogo[c]; perecerão sob a ira e sob um juízo poderoso, para sempre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “entre as nações”, conforme a relação atribuída à preposição no contexto.
    reason: lexical_alternative
  - marker: b
    text: A leitura do termo é difícil. “Torres” é uma alternativa possível; “templos” se ajusta à menção dos ídolos e reflete uma correção provável da transcrição etíope disponível.
    reason: textual_variant
  - marker: c
    text: 'Também: “no juízo do fogo” ou “em juízo de fogo”. A construção mantém unidas as ideias de sentença e fogo.'
    reason: lexical_alternative
  - marker: d
    text: “Para sempre” expressa a finalidade duradoura do juízo no verso, sem determinar por si só todos os pormenores de um sistema doutrinário posterior.
    reason: cultural_note
lexical_decisions:
- source_word: ጣዖት፡ ይትገደፍ (leitura crítica subjacente; a transcrição fornecida traz ይትወሀብ)
  choice: os ídolos serão lançados fora
  rationale: A revisão do texto da edição identifica na transcrição uma perda de ጣዖት e uma leitura equivocada do verbo. A formulação traduz a leitura crítica recuperada, coerente com o cenário de eliminação da idolatria.
- source_word: ምስለ፡ አሕዛብ
  choice: juntamente com as nações
  rationale: ምስለ normalmente indica companhia ou associação. “Nações” evita a conotação posterior e mais restrita de “gentios”.
- source_word: ማኅፈድ (leitura crítica subjacente; a transcrição fornecida traz ማኅፈሪ)
  choice: templos
  rationale: No contexto da destruição dos ídolos, “templos” oferece a leitura contextual mais provável, embora “torres” continue sendo uma alternativa lexical possível.
- source_word: በእሳት፡ ትነድድ
  choice: serão queimados no fogo
  rationale: Mantém a imagem explícita do fogo e verte naturalmente a forma verbal no plural exigido pelo referente português.
- source_word: ወይወፅእዎሙ፡ እምኵሉ፡ ምድር
  choice: Eles os removerão de toda a terra
  rationale: Preserva a distinção entre o sujeito plural e o sufixo de objeto no verbo, sem identificar além do que o contexto permite quem realiza a remoção.
- source_word: ወይትገደፉ፡ በኵነኔ፡ እሳት
  choice: e serão lançados no julgamento de fogo
  rationale: Conserva tanto a ação violenta de lançar quanto a construção judicial ligada ao fogo, sem reduzi-la simplesmente a “fogo”.
- source_word: ወይትሐጐሉ፡ በመዓት
  choice: perecerão sob a ira
  rationale: “Perecer” preserva a amplitude do verbo de destruição; “sob a ira” comunica em português corrente o contexto punitivo.
- source_word: ወበኵነኔ፡ ኃያል
  choice: e sob um julgamento poderoso
  rationale: Retém a força de ኃያል e o paralelismo com a ira, sem substituir o conceito judicial por uma interpretação doutrinária.
- source_word: እንተ፡ ለዓለም
  choice: para sempre
  rationale: É a expressão portuguesa natural para a duração escatológica indicada, preservando a força do texto.
theological_decisions:
- issue: Identidade dos condenados ao longo da sequência
  choice: Manter as mudanças entre “eles os removerão” e “serão lançados”, sem explicitar entre parênteses os agentes e pacientes.
  alternative: Identificar os povos das nações como os lançados no julgamento e os justos ou agentes divinos como os que removem os ídolos.
  rationale: As formas pronominais e a sucessão de referentes permitem inferências contextuais, mas não justificam inserir identificações que o verso não declara expressamente.
- issue: Natureza e duração do julgamento
  choice: Traduzir literalmente as imagens de fogo, ira, julgamento e “para sempre”.
  alternative: Explicar a passagem como tormento consciente sem fim ou, em sentido oposto, como mera hipérbole temporal.
  rationale: O verso afirma julgamento escatológico duradouro com linguagem intensa, mas não define por si só um sistema posterior sobre a modalidade da punição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência coordenada e repetitiva foi parcialmente mantida por ser característica da linguagem apocalíptica. O texto principal segue as correções críticas registradas para dois prováveis erros graves da transcrição/OCR, enquanto as incertezas relevantes são expostas em notas.
