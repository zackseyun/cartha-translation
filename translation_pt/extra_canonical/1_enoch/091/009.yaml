  terminology: «Ídolos», «nações», «fogo», «ira», «juízo» e «para sempre» são escolhas adequadas ao registro apocalíptico e à legibilidade moderna. «Templos» é aceitável como leitura contextual da forma crítica, desde que a nota mantenha a alternativa «torres» e a incerteza textual/lexical.
