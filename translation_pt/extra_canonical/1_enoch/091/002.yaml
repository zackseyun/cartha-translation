base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/002.yaml
  text: And after this[a], Methuselah went and called all his brothers to him[b], and gathered his kindred.
translation:
  language: pt
  text: Depois disso[a], Matusalém foi e chamou todos os seus irmãos para junto de si e reuniu seus parentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como «Então» ou «A partir desse momento».
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: Depois disso
  rationale: A forma preposicional tem literalmente o sentido de «a partir disso», mas aqui funciona como transição temporal narrativa; «Depois disso» é natural e preserva a sequência.
- source_word: ሖረ
  choice: foi
  rationale: Verbo simples de movimento; «foi» mantém a sobriedade narrativa sem acrescentar a ideia de partida definitiva.
- source_word: ማቱሳላ
  choice: Matusalém
  rationale: Forma bíblica tradicional e amplamente reconhecida em português.
- source_word: ጸውዖሙ
  choice: chamar
  rationale: O verbo admite «chamar» ou «convocar»; «chamar» conserva a amplitude do original sem sugerir uma convocação formal.
- source_word: ለኵሎሙ አኃዊሁ
  choice: todos os seus irmãos
  rationale: Tradução direta da expressão de parentesco, sem espiritualizá-la nem ampliá-la para companheiros ou membros do clã.
- source_word: ኀቤሁ
  choice: para junto de si
  rationale: Expressa movimento em direção à presença de Matusalém de modo claro e idiomático em português.
- source_word: አስተጋብኦሙ
  choice: reuniu
  rationale: O sentido causativo é o de fazer pessoas se juntarem; «reuniu» é conciso e natural.
- source_word: አዝማዲ ዚአሁ
  choice: seus parentes
  rationale: A expressão designa pessoas ligadas por parentesco. «Seus parentes» é atual, claro e fiel, ao passo que «sua família» poderia estreitar ou tornar impreciso o alcance.
theological_decisions:
- issue: Alcance da linguagem de parentesco
  choice: Entender «irmãos» e «parentes» como relações familiares literais.
  alternative: Interpretar «irmãos» como membros do clã, companheiros ou comunidade religiosa.
  rationale: A redação imediata é familiar e não oferece fundamento para uma leitura espiritualizada ou sectária.
- issue: Objeto locativo da reunião
  choice: Relacionar «para junto de si» somente ao chamado dos irmãos.
  alternative: Fazer a expressão também modificar a reunião dos parentes.
  rationale: O ge'ez ኀቤሁ pertence à primeira oração; a segunda traz apenas «seus parentes», sem nova expressão equivalente a «para junto de si».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação foi levemente ajustada para soar natural, sem acrescentar ao segundo verbo a expressão locativa presente apenas na primeira oração.
