base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/006.yaml
  text: And lawlessness will again increase[a], and it will be brought to completion upon the earth[c][b]; and every work of lawlessness and violence and sin will again take hold.
translation:
  language: pt
  text: E a iniquidade voltará a ocorrer[a] e chegará à sua plenitude sobre a terra[b]; e toda obra de iniquidade, violência e pecado voltará a se impor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “será repetida novamente”. A expressão indica que a iniquidade tornará a ocorrer; o texto não diz explicitamente que ela aumentará.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “será completada” ou “será consumada”; a ideia é que a iniquidade chega à sua medida plena.
    reason: lexical_alternative
  - marker: c
    text: O verbo traz a imagem de agarrar ou apoderar-se. A tradução “voltará a se impor” expressa a ideia de que essas obras más retomam seu domínio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትደገም ካዕበ
  choice: voltará a ocorrer
  rationale: A combinação do verbo ligado a repetir com o advérbio “novamente” exprime recorrência enfática. “Voltará a ocorrer” conserva essa força sem a tautologia pouco natural “será repetida novamente” e sem introduzir a ideia de aumento, que não é explícita no texto.
- source_word: ዓመፃ
  choice: iniquidade
  rationale: “Iniquidade” designa conduta contrária ao que é justo e mantém este termo distinto de ግፍዕ (“violência”) e አበሳ (“pecado”).
- source_word: ትትፈጸም
  choice: chegará à sua plenitude
  rationale: O verbo passivo pode significar ser completado, consumado ou levado ao fim. A formulação portuguesa comunica que a iniquidade alcança sua medida plena sem especificar um agente.
- source_word: ዲበ ምድር
  choice: sobre a terra
  rationale: Preserva o alcance amplo e apocalíptico da expressão, em vez de restringi-la a uma região ou território.
- source_word: ትትአኀዝ
  choice: voltará a se impor
  rationale: O verbo pertence ao campo semântico de agarrar, apoderar-se ou tomar domínio. “Se impor” expressa de modo natural o domínio renovado das obras más, mantendo em nota a imagem concreta.
- source_word: ኵሉ ግብረ
  choice: toda obra de
  rationale: Mantém o valor distributivo de ኵሉ e a referência às manifestações concretas do mal.
- source_word: ግፍዕ
  choice: violência
  rationale: Conserva a dimensão social e coercitiva do termo e evita fundi-lo com “iniquidade”.
- source_word: አበሳ
  choice: pecado
  rationale: É o equivalente moral e religioso mais claro em português moderno, permanecendo distinto dos outros dois membros da tríade.
- source_word: ካዕበተ
  choice: voltará
  rationale: O termo final assinala nova ocorrência; ligado ao verbo, é vertido naturalmente por “voltará a”. A possibilidade de uma leitura intensiva ou duplicada é registrada em nota.
theological_decisions:
- issue: Distinção entre os três termos coordenados para o mal
  choice: “iniquidade, violência e pecado”
  alternative: “perversidade, opressão e transgressão”
  rationale: A tríade etíope acumula termos relacionados, mas não idênticos. A tradução mantém sua força retórica e evita reduzi-los a uma única noção teológica.
- issue: Sentido da consumação da iniquidade
  choice: “chegará à sua plenitude”
  alternative: “será consumada” ou “será completada”
  rationale: A formulação preserva o aspecto ominoso de algo que alcança sua medida completa, sem afirmar que Deus seja o agente nem associar a frase a uma doutrina específica.
translation_notes:
  register: Português moderno, claro e digno, com cadência apocalíptica moderada. “Iniquidade” conserva precisão e solenidade sem tornar a frase excessivamente técnica; “voltará a ocorrer” e “voltará a se impor” evitam tautologias e arcaísmos.
