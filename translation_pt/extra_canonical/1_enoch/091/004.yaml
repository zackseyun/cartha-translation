base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/004.yaml
  text: And do not draw near to righteousness with a double heart[a], nor join yourselves with those who are of a double heart; but walk in righteousness, my children, and it will lead you on a good path[d][c][b], and righteousness will be your companion.
translation:
  language: pt
  text: E não se aproximem da retidão com o coração dividido, nem se associem aos que têm o coração dividido[a]; mas andem em justiça, meus filhos, e ela os guiará por um bom caminho, e a justiça será sua companheira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração “nem se associem aos que têm o coração dividido” aparece entre colchetes no testemunho etíope fornecido e pode representar uma variante textual ou uma expansão secundária; ela foi mantida porque se encaixa no paralelismo da advertência.
    reason: textual_variant
  - marker: b
    text: 'Ou: “a justiça estará unida a vocês” ou “será sua parceira”. O termo etíope pode indicar companhia, associação ou participação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትቅረቡ
  choice: não se aproximem
  rationale: Conserva a proibição e a imagem espacial do verbo sem recorrer a uma formulação arcaica.
- source_word: ርትዕ
  choice: retidão
  rationale: Expressa integridade moral e distingue este termo do ጽድቅ repetido posteriormente, traduzido como “justiça”.
- source_word: በክልኤ ልብ
  choice: com o coração dividido
  rationale: Preserva a imagem concreta do coração, mas comunica em português atual o sentido idiomático de lealdade dividida ou duplicidade interior.
- source_word: ኢትኅበሩ ምስለ እለ በክልኤ ልብ
  choice: nem se associem aos que têm o coração dividido
  rationale: Expressa com naturalidade a proibição de união ou convivência com pessoas de lealdade dividida.
- source_word: ሑሩ
  choice: andem
  rationale: Mantém a metáfora ética de caminhar, desenvolvida pela referência subsequente ao caminho.
- source_word: በጽድቅ
  choice: em justiça
  rationale: Mantém o substantivo ético e sua conexão lexical com a justiça que aparece como companheira no fim do versículo.
- source_word: ደቂቅየ
  choice: meus filhos
  rationale: Reproduz de modo natural o tratamento familiar e instrutivo.
- source_word: ትመርሐክሙ
  choice: ela os guiará
  rationale: O pronome feminino retoma naturalmente “justiça” em português e conserva a personificação sugerida pelo texto.
- source_word: በፍኖት ኄርት
  choice: por um bom caminho
  rationale: Respeita o singular do ge'ez e evita incorporar indevidamente o ወጽድቅ seguinte, que inicia a oração final.
- source_word: ወጽድቅ ይከውን ለክሙ ሱታፌ
  choice: e a justiça será sua companheira
  rationale: Traduz ሱታፌ pela imagem natural de companhia, preservando também possíveis sentidos de associação ou parceria em nota.
theological_decisions:
- issue: Como traduzir o idioma que descreve lealdade interior dividida
  choice: coração dividido
  alternative: coração duplo / ânimo dobre
  rationale: “Coração dividido” preserva a antropologia do texto e transmite com clareza a duplicidade moral, sem introduzir linguagem confessional ou arcaica.
- issue: Tratamento da oração entre colchetes no testemunho fornecido
  choice: incluída no texto principal com nota
  alternative: omiti-la como possível expansão secundária
  rationale: A oração consta no testemunho, reforça o paralelismo da exortação e deve ser mantida de modo transparente, enquanto a nota registra sua condição textual incerta.
- issue: Referente de “ela os guiará”
  choice: a justiça é entendida como o referente provável
  alternative: uma via implícita ou outro substantivo abstrato antecedente
  rationale: A concordância e o contexto permitem que a justiça seja personificada como guia, mas a tradução evita ampliar essa figura além do que o texto exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém as metáforas do coração, do caminhar e da justiça como guia e companheira, evitando tanto arcaísmos quanto explicações doutrinárias inseridas no texto.
