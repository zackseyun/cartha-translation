base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/013.yaml
  text: And at its completion[a], houses shall be chosen because of their righteousness[c][b], and the house of the great King shall be built in glory forever.
translation:
  language: pt
  text: E, em sua conclusão[a], serão escolhidas casas[b] por causa de sua justiça[c], e a casa do grande Rei será construída em glória para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao seu término” ou “em sua consumação”. O possessivo retoma a etapa ou o período mencionado no contexto.
    reason: lexical_alternative
  - marker: b
    text: “Casas” também pode ter o sentido de “moradas” ou “famílias”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “por causa da justiça que lhes pertence”. O referente de “lhes” não é explicitado na frase; também se pode entender a construção como “em justiça, para eles”.
    reason: textual_ambiguity
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: quando ela chegar ao fim
  rationale: Expressa de modo natural a locução temporal formada com o substantivo ligado à ideia de conclusão ou fim, preservando a referência feminina implícita ao período ou etapa do contexto.
- source_word: ይመረዩ
  choice: serão escolhidas
  rationale: Mantém o sentido passivo de seleção indicado pelo texto transmitido, sem adotar a conjectura de que o verbo significaria “adquirirão”.
- source_word: አብያተ
  choice: casas
  rationale: Conserva a imagem arquitetônica concreta e o plural do ge'ez, sem reduzir o termo a pessoas ou espiritualizá-lo.
- source_word: እምጽድቅ ዚአሆሙ
  choice: por causa da justiça delas
  rationale: Segue a leitura contextual segundo a qual a justiça constitui a razão da escolha e o pronome possessivo se refere às casas; a construção admite outra análise, registrada em nota.
- source_word: ወይትሐነጽ
  choice: será construída
  rationale: Reproduz o verbo de edificar e mantém seu paralelismo com a menção anterior às casas.
- source_word: ቤት ንጉሥ ዐቢይ
  choice: a casa do grande Rei
  rationale: Preserva “casa”, com suas possíveis ressonâncias de palácio, templo ou morada, e traduz literalmente o título real.
- source_word: በስብሐት
  choice: em glória
  rationale: Mantém a preposição e o campo semântico de glória, honra e esplendor em registro elevado.
- source_word: እስከ ለዓለም
  choice: para sempre
  rationale: É a forma portuguesa corrente e digna para a duração perpétua expressa pelo idioma ge'ez.
theological_decisions:
- issue: Identidade do “grande Rei”
  choice: Rei com inicial maiúscula, sem explicitação adicional
  alternative: rei com inicial minúscula ou identificação direta como Deus
  rationale: O contexto escatológico aponta provavelmente para Deus, mas a tradução conserva o título do texto e evita transformar uma identificação contextual em explicação inserida no versículo.
- issue: Sentido das casas escolhidas
  choice: manter casas como referente concreto ou simbólico da escolha
  alternative: parafrasear como “os justos serão escolhidos” ou “eles adquirirão casas”
  rationale: O texto transmitido contém explicitamente “casas” e uma forma verbal passiva; preservar essa formulação mantém a imagem arquitetônica e sua tensão interpretativa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o tom solene e visionário, a imagem concreta das casas e a ambiguidade sintática relevante, esclarecida em notas sem ser resolvida dogmaticamente.
