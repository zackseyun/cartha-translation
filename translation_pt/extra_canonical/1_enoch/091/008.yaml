base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/008.yaml
  text: In those days[a], violence shall be cut off from its roots[d][c][b], and iniquity together with deceit from under heaven.
translation:
  language: pt
  text: Naqueles dias, a violência será cortada pela raiz,[a] e a iniquidade e o engano serão eliminados de debaixo do céu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será eliminada desde suas raízes”. O verbo também pode ter o sentido de “ser abreviada” ou “chegar ao fim”.'
    reason: lexical_alternative
  - marker: b
    text: O ge’ez expressa um único verbo, “será cortada”; em português, “serão eliminados” torna explícita a remoção da iniquidade e do engano. A leitura do termo traduzido como “engano” é incerta; “dolo” ou “fraude” também são possíveis.
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: Naqueles dias
  rationale: A expressão demonstrativa temporal é o idioma normal para “naqueles dias”; evita a análise anterior, incorreta, de “nele, dias”.
- source_word: ትትገዘም፡ ግፍዕ
  choice: a violência será cortada
  rationale: O verbo passivo rege “violência” e comunica cortar, suprimir ou pôr fim; a formulação preserva a imagem de juízo.
- source_word: እምነ፡ ሥረዊሃ
  choice: pela raiz
  rationale: Mantém a metáfora de erradicação completa em português corrente, embora o ge’ez tenha forma literalmente compatível com “desde suas raízes”.
- source_word: ወዓመፃ
  choice: e a iniquidade
  rationale: Conserva este segundo substantivo moral, que não deve ser confundido com ግፍዕ, “violência”.
- source_word: ምስለ፡ ጕሕሉት
  choice: junto com o engano
  rationale: ምስለ indica associação; o último termo parece designar engano ou dolo, mas sua leitura no testemunho transcrito é incerta.
- source_word: እምታሕተ፡ ሰማይ
  choice: de debaixo do céu
  rationale: Preserva a expressão cósmica e o alcance abrangente da remoção do mal.
theological_decisions:
- issue: Alcance da eliminação do mal
  choice: A linguagem descreve a remoção abrangente da violência, da iniquidade e do engano de debaixo do céu.
  alternative: Uma reforma apenas local ou regional.
  rationale: A expressão “de debaixo do céu” amplia o horizonte, enquanto a imagem de cortar pela raiz sugere erradicação completa.
- issue: Verbo elíptico na segunda oração
  choice: Empregar “desaparecerá” para tornar explícita em português a remoção da iniquidade e do engano.
  alternative: Manter apenas o verbo “será cortada”, entendido por elipse também com os demais males.
  rationale: O ge’ez traz um único verbo expresso; o português requer uma ligação mais clara, mas a nota registra a elipse e evita apresentar o verbo acrescentado como lexicalmente independente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imagética apocalíptica preservada. “Pela raiz” oferece naturalidade brasileira e internacional; “de debaixo do céu” conserva o alcance cósmico sem recorrer a vocabulário confessional.
