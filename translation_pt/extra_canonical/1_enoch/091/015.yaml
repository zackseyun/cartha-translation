base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/015.yaml
  text: And after this[a], in the tenth week, in the seventh part, there shall be the eternal judgment [and it shall be executed by the watchers of the eternal heaven][b], a great judgment that will be exacted in the midst of the angels.
translation:
  language: pt
  text: E depois disso[a], na décima semana, em sua sétima parte, haverá o juízo eterno [e ele será executado pelos vigilantes do céu eterno][b], um grande juízo que será levado a efeito no meio dos anjos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradição textual deste trecho é incerta. Esta tradução segue a leitura ge'ez transmitida, que diz claramente “na décima semana” e menciona um juízo no meio dos anjos.
    reason: textual_variant
  - marker: b
    text: A oração entre colchetes — “e ele será executado pelos vigilantes do céu eterno” — tem situação textual incerta e pode representar uma expansão ou variante da tradição manuscrita.
    reason: textual_variant
lexical_decisions:
- source_word: ወእምድኅረ ዝ
  choice: E depois disso
  rationale: Fórmula temporal de transição que introduz a etapa seguinte da sequência apocalíptica.
- source_word: በሰንበት ዓሥርት ፯እደ
  choice: na décima semana, em sua sétima parte
  rationale: Segue diretamente o texto ge'ez, que menciona a décima semana e a sétima parte no esquema simbólico do Apocalipse das Semanas.
- source_word: ኵነኔ እንተ ለዓለም
  choice: o juízo eterno
  rationale: ኵነኔ designa julgamento ou juízo, enquanto እንተ ለዓለም lhe atribui caráter duradouro ou eterno.
- source_word: ወትትገበር እምትጉሃነ ሰማይ ዘለዓለም
  choice: e ele será executado pelos vigilantes do céu eterno
  rationale: Mantém a oração entre colchetes e reproduz sua agência explícita sem decidir se ela pertence ao texto original ou a uma expansão textual.
- source_word: ዐቢይ ዘይትቤቀል
  choice: um grande juízo que será aplicado
  rationale: Preserva o valor passivo indicado pela revisão crítica e evita acrescentar a ideia interpretativa de vingança, embora o verbo possa sugerir retribuição ou cobrança.
- source_word: እማእከሎሙ ለመላእክት
  choice: no meio dos anjos
  rationale: Tradução direta da expressão locativa, preservando a referência textual aos anjos.
theological_decisions:
- issue: Agentes do juízo eterno
  choice: vigilantes do céu eterno
  alternative: o próprio Deus, sem agentes mencionados
  rationale: A oração ge'ez entre colchetes nomeia vigilantes como agentes. Ela é mantida como variante textual, sem harmonização com uma doutrina específica do juízo.
- issue: Sentido da retribuição entre os anjos
  choice: um grande juízo que será aplicado no meio dos anjos
  alternative: um grande juízo que vingará ou castigará os anjos
  rationale: A formulação conserva a ambiguidade quanto à natureza exata e ao objeto da retribuição, sem inserir uma explicação teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Juízo” preserva o tom bíblico sem soar arcaico; “será aplicado” mantém a construção passiva e evita explicitar vingança. Os colchetes do testemunho fornecido foram conservados, e todos os marcadores de nota aparecem no texto principal.
