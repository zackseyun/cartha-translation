  to: E agora, meu filho Matusalém, chama para junto de mim todos os teus irmãos e reúne para junto de mim todos os filhos de tua mãe, pois uma palavra me chama, e um espírito foi derramado sobre mim[a], para que eu lhes mostre tudo o que lhes sobrevirá por toda a eternidade[b].
