    issue: Inconsistência de pessoa nos possessivos
    rationale: O imperativo se dirige diretamente a Matusalém; por isso, «todos os teus irmãos» e «os filhos de tua mãe» são mais naturais e coerentes que «seus/sua».
  - severity: low
    issue: Destino da segunda convocação ligeiramente atenuado
    rationale: «Diante de mim» é possível, mas «para junto de mim» reproduz mais diretamente o ሊተ («a mim/para mim») e conserva o paralelismo com a primeira ordem.
