base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/001.yaml
  text: And now[a], my son Methuselah, call all your brothers to me, and gather to me all the children of your mother; for a word calls me, and a spirit of uprightness is poured out upon me[d][c][b], so that I may show you everything that will come upon you forever.
translation:
  language: pt
  text: E agora, meu filho Matusalém, chama para junto de mim todos os teus irmãos e reúne para junto de mim todos os filhos de tua mãe, pois uma palavra me chama, e um espírito foi derramado sobre mim[a], para que eu lhes mostre tudo o que lhes sobrevirá por toda a eternidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode entender: “o Espírito foi derramado sobre mim”, caso a expressão se refira de modo personificado ao Espírito divino.'
    reason: theological_ambiguity
  - marker: b
    text: A expressão final também pode ser entendida como “até a eternidade”, “para sempre” ou, em sentido mais amplo, “para as gerações futuras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Mantém a transição discursiva simples e imediata do ge'ez.
- source_word: ማቱሳላ
  choice: Matusalém
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: ጸውዕ ሊተ
  choice: chame para junto de mim
  rationale: Expressa de modo natural a ordem de convocar alguém à presença de Enoque.
- source_word: ኵሎ አኃዊከ
  choice: todos os seus irmãos
  rationale: Conserva a referência familiar concreta, sem generalizá-la para parentes.
- source_word: አስተጋብእ ሊተ
  choice: reúna diante de mim
  rationale: Distingue o ato de reunir do ato anterior de chamar e indica a presença de Enoque como destino da reunião.
- source_word: ኵሎ ደቂቀ እምከ
  choice: todos os filhos de sua mãe
  rationale: ደቂቅ designa filhos ou descendência; a formulação portuguesa preserva o parentesco materno e pode funcionar coletivamente.
- source_word: እስመ ቃል ይጼውዐኒ
  choice: pois uma palavra me chama
  rationale: Mantém indefinida a origem da palavra e preserva a linguagem enigmática de chamado revelatório.
- source_word: መንፈስ ትክዕወት ላዕሌየ
  choice: um espírito foi derramado sobre mim
  rationale: Interpreta ትክዕወት como forma verbal feminina, concordando com መንፈስ, e não como substantivo com o sentido de retidão.
- source_word: ከመ አርእክሙ
  choice: para que eu lhes mostre
  rationale: Reproduz naturalmente a oração de finalidade sem eliminar sua força revelatória.
- source_word: ኵሎ ዘይበጽሐክሙ
  choice: tudo o que lhes sobrevirá
  rationale: O verbo exprime aquilo que chega, alcança ou sucede a alguém; “sobrevirá” conserva o tom profético.
- source_word: እስከ ለዓለም
  choice: por toda a eternidade
  rationale: Representa a extensão temporal solene da expressão, deixando em nota alternativas possíveis.
theological_decisions:
- issue: Se መንፈስ deve ser entendido como um espírito indeterminado ou como o Espírito divino personificado
  choice: um espírito
  alternative: o Espírito
  rationale: O texto não contém indicação inequívoca que obrigue a identificação com um título divino definido. A tradução principal conserva a indefinição gramatical e a nota registra a leitura personificada.
- issue: Se ትክዕወት significa “retidão” ou é uma forma do verbo “derramar”
  choice: foi derramado
  alternative: —
  rationale: A forma é verbal e concorda no feminino com “espírito”; traduzi-la por “retidão” criaria um substantivo não presente no texto.
translation_notes:
  register: Português atual, digno e acessível, com formas reconhecíveis no Brasil e inteligíveis internacionalmente. O paralelismo entre “chame” e “reúna” foi preservado, assim como o tom profético e a ambiguidade acerca da identidade do espírito.
