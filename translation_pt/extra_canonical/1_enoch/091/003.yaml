base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/003.yaml
  text: 'And he spoke to them all[a], to all the children of righteousness, and said, “Hear, children of Enoch, every word of your father, and listen to the upright words of my mouth; for I speak to you and tell you[c][b], beloved ones: love righteousness and walk in it.”'
translation:
  language: pt
  text: 'E ele falou a todos eles, a todos os filhos da justiça, e disse: “Ouçam, filhos de Enoque, cada palavra de seu pai, e escutem as palavras retas da minha boca[a], pois faço vocês ouvirem e lhes declaro[b]. Amados, amem a justiça e andem nela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão em ge’ez é difícil. Outra tradução possível é: “escutem corretamente as palavras da minha boca”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois eu falo a vocês e lhes conto”; também é possível entender o primeiro verbo como “eu os exorto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ ጽድቅ
  choice: filhos da justiça
  rationale: Preserva a construção relacional e o caráter programático da expressão enoquiana, em vez de reduzi-la a um simples adjetivo como “filhos justos”.
- source_word: ደቂቀ ሄኖክ
  choice: filhos de Enoque
  rationale: Traduz diretamente a expressão de descendência ou pertencimento e emprega a forma portuguesa consagrada do nome.
- source_word: ኵሎ ነገረ አቡክሙ
  choice: cada palavra de seu pai
  rationale: Mantém o sentido distributivo de ኵሎ e a solenidade da exortação, com formulação natural em português.
- source_word: አጽምኡ
  choice: escutem
  rationale: Funciona como segundo imperativo de atenção ao lado de “ouçam”, sem recorrer a linguagem arcaica.
- source_word: ርርትዐ ቃለ አፉየ
  choice: as palavras retas da minha boca
  rationale: A sintaxe e a forma transcrita são difíceis. Esta leitura associa a ideia de retidão às palavras, preservando o semitismo “da minha boca”; a alternativa adverbial é registrada em nota.
- source_word: አሰምዕ ... ወእነግረክሙ
  choice: eu as faço ouvir a vocês e as declaro
  rationale: Conserva a força causativa do primeiro verbo e o paralelismo enfático dos dois verbos, sem acrescentar explicitamente a noção interpretativa de exortação.
- source_word: ፍቁራን
  choice: Amados
  rationale: Vocativo afetuoso e solene, natural no registro bíblico moderno em português.
- source_word: ርትዕ
  choice: justiça
  rationale: Mantém a continuidade com ጽድቅ e representa aqui a qualidade ética e o caminho de vida, sem restringi-los à justiça jurídica.
- source_word: ባቲ ሑሩ
  choice: andem nela
  rationale: Preserva a metáfora ética de caminhar na justiça e a referência pronominal feminina exigida pelo português.
theological_decisions:
- issue: Tradução de ጽድቅ/ርትዕ como “justiça” ou “retidão”
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é o equivalente bíblico mais reconhecível em português para a qualidade ética e o modo de vida em vista. A escolha não limita o termo ao âmbito jurídico; “retidão” permanece uma alternativa lexical legítima.
- issue: Força de አሰምዕ no discurso de Enoque
  choice: eu as faço ouvir a vocês
  alternative: eu os exorto
  rationale: A tradução conserva a morfologia causativa e evita resolver o verbo em favor de uma função homilética específica, embora o contexto seja claramente exortativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se os paralelismos, o vocativo afetuoso e a metáfora bíblica de andar na justiça. As ambiguidades do trecho difícil e do verbo causativo foram preservadas em notas.
