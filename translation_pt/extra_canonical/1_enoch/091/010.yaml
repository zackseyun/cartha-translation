base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/010.yaml
  text: And the righteous one shall arise from their sleep[b][a], and wisdom shall arise and be given to them.
translation:
  language: pt
  text: E o justo[a] se levantará do sono deles[b], e a sabedoria se levantará e lhes será dada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão está no singular e pode indicar uma figura individual ou um justo que representa a comunidade; o texto não decide entre essas possibilidades.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “do sono deles”. A combinação do singular “o justo” com o pronome plural foi preservada por refletir a forma do texto ge’ez.
    reason: source_ambiguity
lexical_decisions:
- source_word: ይትነሣእ
  choice: se levantará
  rationale: O verbo, repetido nas duas orações, expressa levantar-se ou surgir. A repetição foi mantida para preservar o paralelismo e a personificação da sabedoria.
- source_word: ጻድቅ
  choice: o justo
  rationale: O termo está no singular. “O justo” conserva essa forma e deixa em aberto se a referência é a um indivíduo específico ou representativo.
- source_word: እምነዋሙ
  choice: do sono deles
  rationale: A expressão é entendida como a preposição “de”, seguida do substantivo “sono” com sufixo pronominal plural. A formulação incomum foi preservada, sem harmonizar o plural com “o justo”.
- source_word: ጥበብ
  choice: sabedoria
  rationale: Neste contexto, o termo designa sabedoria moral e revelatória; “sabedoria” é a correspondência portuguesa direta e natural.
- source_word: ይትወሀብ ሎሙ
  choice: lhes será dada
  rationale: A forma passiva seguida do objeto indireto indica que a sabedoria será dada a eles. A redação mantém essa relação sem especificar o agente.
theological_decisions:
- issue: Se ጻድቅ deve ser entendido coletivamente ou como figura individual
  choice: 'Mantido no singular: “o justo”'
  alternative: “os justos” ou “um justo”
  rationale: A forma ge’ez é singular. A tradução preserva possíveis sentidos individual, representativo ou messiânico sem escolher entre eles.
- issue: A aparente discordância entre “o justo” e “o sono deles”
  choice: Preservada no texto
  alternative: “seu sono” ou uma reformulação coletiva
  rationale: Ajustar os pronomes resolveria uma tensão presente na evidência textual. A tradução conserva o singular e o plural, esclarecendo-os em nota.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação apropriada ao contexto apocalíptico. A repetição de “se levantará” reproduz deliberadamente o paralelismo do original.
