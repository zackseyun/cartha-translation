base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/005.yaml
  text: For I know that violence will endure upon the earth[a], and a great scourge will be carried out upon the earth; and all lawlessness will be brought to completion and be cut off from its roots[c][b], and every structure will pass away.
translation:
  language: pt
  text: Pois sei que a violência persistirá sobre a terra, e um grande flagelo[a] se consumará sobre a terra; toda a iniquidade chegará à sua consumação[b] e será eliminada pela raiz, e toda construção[c] passará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma grande praga” ou “um grande castigo”; o termo ge'ez pode indicar uma aflição punitiva ou um flagelo em sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “toda a iniquidade será completada”. Pode indicar que o mal chega à sua medida plena antes do juízo, não que seja aprovado ou estabelecido.
    reason: alternative_reading
  - marker: c
    text: “Toda construção” também pode ser traduzido de modo mais concreto como “todo edifício”; o termo pode abranger tanto prédios quanto aquilo que foi construído ou estabelecido.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Mantém a função explicativa ou causal do conector e soa natural no registro solene do contexto.
- source_word: አእምር
  choice: sei
  rationale: Expressa de modo direto o conhecimento presente e a certeza profética do falante.
- source_word: ይጸንዕ
  choice: persistirá
  rationale: O verbo indica firmeza ou continuidade; “persistirá” comunica a permanência do mal sem sugerir sua aprovação.
- source_word: ሀላዌ ግፍዕ
  choice: a violência
  rationale: Resume a ideia da existência de opressão ou injustiça violenta, conservando a força do anúncio apocalíptico.
- source_word: በዲበ ምድር
  choice: sobre a terra
  rationale: Reproduz a expressão locativa em português corrente e digno.
- source_word: ትትፈጸም
  choice: se consumará
  rationale: Com “flagelo”, comunica que o acontecimento será levado a efeito, sem especificar além do texto quem o executa.
- source_word: መቅሠፍት ዐቢይ
  choice: um grande flagelo
  rationale: “Flagelo” preserva tanto o caráter punitivo quanto o catastrófico do termo, sem restringi-lo necessariamente a uma doença.
- source_word: ኵላ ዓመፃ
  choice: toda a iniquidade
  rationale: O termo abrange rebelião, transgressão e injustiça; “iniquidade” mantém o sentido moral amplo e o alcance totalizante.
- source_word: ትትፈጸም
  choice: chegará à sua consumação
  rationale: Conserva a possibilidade de a iniquidade atingir sua medida plena antes de ser eliminada, sem apresentar essa leitura como totalmente inequívoca.
- source_word: ትትገዘም እምሥረዊሃ
  choice: será cortada desde as raízes
  rationale: Preserva a imagem de remoção radical e definitiva, bem como o plural “raízes” do texto.
- source_word: ኵሉ ሕንጻ
  choice: toda construção
  rationale: Pode designar um edifício concreto ou, mais amplamente, algo construído; “construção” mantém abertas as duas possibilidades.
- source_word: የኃልፍ
  choice: passará
  rationale: Mantém o idioma solene de desaparecimento ou cessação sem decidir se a referência é literal ou figurada.
theological_decisions:
- issue: Se o mal apenas persiste ou se chega a uma medida plena antes de ser removido
  choice: A violência persiste, a iniquidade chega à sua consumação e depois é cortada desde as raízes.
  alternative: Entender a passagem apenas como destruição imediata do mal, sem um período de persistência ou consumação.
  rationale: A sequência verbal aponta para persistência, consumação e erradicação. A tradução conserva essa tensão apocalíptica sem explicar a consumação como aprovação divina.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A cadência profética foi preservada sem arcaísmos desnecessários. Os marcadores de nota foram posicionados junto aos termos que efetivamente explicam.
