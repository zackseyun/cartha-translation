base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/011.yaml
  text: And from it shall be cut off the roots of oppression[a], and sinners shall be delivered up to the sword. From the blasphemers they shall be cut off in every place[d][c][b], and those who devise violence and those who commit blasphemy shall be destroyed by the sword.
translation:
  language: pt
  text: E dele serão cortadas as raízes da opressão,[a] e os pecadores serão entregues à espada. Dos blasfemadores serão eliminados em todo lugar;[b] e os que planejam a violência e os que praticam blasfêmia[c] serão destruídos pela lâmina.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Raízes da opressão” preserva a imagem de extirpação associada ao verbo “cortar”.
    reason: lexical_alternative
  - marker: b
    text: 'A sintaxe etíope desta oração é difícil. Outra tradução possível é: “Dos blasfemadores serão eliminados, em todo lugar, os que planejam a violência e os que praticam blasfêmia”. A conjunção antes de “os que”, porém, pode indicar o começo de uma nova oração.'
    reason: textual_variant
  - marker: c
    text: “Blasfemadores” e “praticam blasfêmia” traduzem termos etíopes relacionados, preservando a ligação lexical do texto.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, a expressão pode indicar destruição “pela espada”, “pela faca” ou “pelo instrumento de matança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትገዘሙ
  choice: serão cortadas / serão eliminados
  rationale: O verbo passivo indica cortar, extirpar ou remover. “Cortadas” combina naturalmente com “raízes”; na segunda ocorrência, “eliminados” evita uma formulação artificial sem perder a força judicial.
- source_word: አሥራወ ዓመፃ
  choice: raízes da opressão
  rationale: No contexto e na construção nominal, አሥራወ é entendido como “raízes”, e ዓመፃ como violência, injustiça ou opressão. A escolha conserva a imagem de extirpação do mal e sua dimensão social.
- source_word: ኃጥኣን
  choice: pecadores
  rationale: Termo moral e religioso corrente nos oráculos de juízo de Enoque; “pecadores” preserva o registro apocalíptico.
- source_word: ይትሐጐሉ
  choice: serão entregues / serão destruídos
  rationale: O verbo pode expressar entrega, perda ou destruição. Na primeira ocorrência, “entregues à espada” mantém a nuance judicial; na última, a construção com o instrumento de morte favorece “destruídos pela lâmina”.
- source_word: በሰይፍ
  choice: à espada
  rationale: Mantém a imagem tradicional de juízo e forma em português a expressão natural “entregues à espada”.
- source_word: ጽሩፋን
  choice: blasfemadores
  rationale: Preserva a relação lexical com ጽርፈት e comunica a gravidade religiosa da injúria ou blasfêmia.
- source_word: በኵሉ መካን
  choice: em todo lugar
  rationale: Tradução direta da expressão locativa, conservando a abrangência universal do juízo.
- source_word: ይሔልይዋ ለግፍዕ
  choice: planejam a violência
  rationale: O verbo indica pensar, conceber ou tramar; “planejam” explicita a intenção deliberada sem reduzir ግፍዕ a mero pensamento interior.
- source_word: ይገብርዋ ለጽርፈት
  choice: praticam blasfêmia
  rationale: Expressão natural em português que mantém o vínculo com “blasfemadores” e o caráter ativo da ofensa.
- source_word: በመጥባሕት
  choice: pela lâmina
  rationale: O termo aponta para instrumento cortante, espada, faca ou matança. “Lâmina” preserva essa amplitude e distingue a expressão de በሰይፍ sem suavizar o juízo.
theological_decisions:
- issue: Amplitude moral e social de ዓመፃ
  choice: opressão
  alternative: injustiça ou violência
  rationale: “Opressão” reúne a ideia de injustiça e violência exercida contra outros, adequada ao contexto de juízo, sem restringir o termo a agressão física.
- issue: Nuance do verbo repetido ይትሐጐሉ
  choice: entregues na primeira ocorrência e destruídos na última
  alternative: mortos em ambas as ocorrências
  rationale: A formulação conserva, onde possível, a tensão entre ser entregue ao juízo e sofrer seu resultado, mas reconhece que a última construção com በመጥባሕት aponta explicitamente para destruição por instrumento cortante.
- issue: Sintaxe obscura da cláusula sobre os blasfemadores
  choice: manter o pronome “eles” e a relação “dentre os blasfemadores”
  alternative: identificar os que planejam violência como objeto direto de “serão eliminados”
  rationale: O texto etíope contém uma sequência difícil e uma conjunção antes de “os que”, favorecendo a separação das orações. A tradução evita resolver silenciosamente o antecedente do pronome.
translation_notes:
  register: Português moderno, digno e acessível, com cadência de oráculo apocalíptico. A construção incomum “Dentre os blasfemadores, eles...” foi mantida para não ocultar a dificuldade sintática e a incerteza do antecedente; a nota apresenta a principal alternativa.
