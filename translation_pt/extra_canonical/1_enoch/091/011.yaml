  terminology: “Opressão”, “pecadores”, “blasfemadores”, “violência” e “blasfêmia” são escolhas adequadas e mantêm o vínculo lexical entre os dois últimos termos. “Pela lâmina” representa de modo plausível o instrumento de abate indicado no último membro, sem o identificar indevidamente com a primeira ocorrência de “espada”.
