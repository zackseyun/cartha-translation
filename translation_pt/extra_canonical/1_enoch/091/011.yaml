revisions:
- from: E dele serão cortadas as raízes da opressão,[a] e os pecadores serão entregues à espada. Dentre os blasfemadores, eles serão eliminados em todo lugar;[b] e os que planejam a violência e os que praticam blasfêmia[c] serão destruídos pela lâmina.[d]
  to: E dele serão cortadas as raízes da opressão,[a] e os pecadores serão entregues à espada. Dos blasfemadores serão eliminados em todo lugar;[b] e os que planejam a violência e os que praticam blasfêmia[c] serão destruídos pela lâmina.[d]
  rationale: A revisão elimina um pronome português sem antecedente claro, mantendo por meio da voz passiva a ambiguidade sintática do original. Também substitui a nota lexicalmente insegura sobre “dez semanas” por uma explicação fiel da imagem de raízes cortadas. Não se altera o sentido do juízo, a relação lexical entre blasfemadores e blasfêmia, nem a distinção entre espada e o instrumento de abate final.
