  source_fidelity: 'A tradução preserva adequadamente a oração subordinada inicial, a enumeração de males, a origem celestial do castigo e a execução do juízo. Contudo, a repetição preposicional de በ (“em”) antes de “castigo” deve ser mantida: “em ira e em castigo”.'
