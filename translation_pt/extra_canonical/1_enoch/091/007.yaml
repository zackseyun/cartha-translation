base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/007.yaml
  text: And when sin and transgression and blasphemy and violence increase in every deed, and lawlessness and wrongdoing and uncleanness increase, a great punishment will come from heaven upon them all, and the Holy Lord will come forth in wrath and in punishment, to execute judgment upon the earth.
translation:
  language: pt
  text: E quando[b] o pecado, a transgressão, a blasfêmia e a violência aumentarem em toda obra, e a transgressão da lei, a maldade e a impureza aumentarem, um grande castigo[a] virá do céu sobre todos eles, e o Santo Senhor sairá em ira e em castigo, para executar juízo sobre a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande flagelo” ou “uma grande praga”; o termo ge'ez pode designar uma aflição punitiva, além de castigo.
    reason: lexical_alternative
  - marker: b
    text: 'A expressão inicial também pode ser entendida como “E se o pecado... aumentar”. Outra possível disposição sintática é: “E o pecado, a transgressão, a blasfêmia e a violência aumentarão em toda obra, e a transgressão da lei, a maldade e a impureza aumentarão; então um grande castigo virá...”.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ወእመኒ
  choice: E quando
  rationale: Preserva a partícula subordinativa que introduz a condição ou circunstância temporal, sem reduzir a frase a uma série de afirmações independentes.
- source_word: ትልህቅ / ትለህቅ
  choice: aumentarem
  rationale: O verbo repetido indica o crescimento ou agravamento dos males; o futuro do subjuntivo é natural depois de “quando” em português.
- source_word: ኃጢአት
  choice: pecado
  rationale: Mantém a força moral e religiosa do termo.
- source_word: ዓመፃ
  choice: transgressão
  rationale: Expressa violação ou rebelião contra a ordem justa e permanece distinta da maldade mencionada depois.
- source_word: ጽርፈት
  choice: blasfêmia
  rationale: No catálogo de vícios, comunica fala insultuosa e ímpia, inclusive em sua dimensão dirigida contra Deus.
- source_word: ግፍዕ
  choice: violência
  rationale: Termo direto e vigoroso que abrange injustiça brutal e opressiva.
- source_word: በኵሉ ተግባር
  choice: em toda obra
  rationale: Conserva o sentido distributivo e a formulação concreta do texto, em registro bíblico compreensível.
- source_word: ዕልወት
  choice: transgressão da lei
  rationale: Expressa o sentido de ilegalidade ou rejeição da ordem normativa sem confundi-lo com o primeiro termo genérico para pecado.
- source_word: አበሳ
  choice: maldade
  rationale: Funciona como termo moral amplo e natural em português, distinguindo-se de pecado e transgressão.
- source_word: ርኵስ
  choice: impureza
  rationale: Preserva possíveis conotações morais e rituais em português atual.
- source_word: መቅሠፍት ዐቢይ
  choice: um grande castigo
  rationale: O contexto explícito de ira e juízo favorece o sentido punitivo, enquanto a nota conserva os sentidos de flagelo e praga.
- source_word: ይከውን እምሰማይ
  choice: virá do céu
  rationale: Formulação natural que mantém a origem celestial da intervenção punitiva.
- source_word: እግዚእ ቅዱስ
  choice: o Santo Senhor
  rationale: Preserva a expressão como título divino compacto, reunindo santidade e senhorio.
- source_word: በመዓት ወበመቅሠፍት
  choice: em ira e castigo
  rationale: Mantém os dois meios ou modos paralelos da manifestação judicial divina.
- source_word: ከመ ይግበር ኵነኔ ዲበ ምድር
  choice: para executar juízo sobre a terra
  rationale: Reproduz claramente a finalidade da saída do Senhor e o alcance terrestre do juízo.
theological_decisions:
- issue: Sentido de መቅሠፍት
  choice: castigo
  alternative: praga; flagelo
  rationale: A culminação em juízo torna primário o aspecto punitivo, mas o termo pode designar também a aflição concreta pela qual o castigo se manifesta.
- issue: Forma do título divino እግዚእ ቅዱስ
  choice: o Santo Senhor
  alternative: o Senhor, o Santo
  rationale: A escolha trata a expressão como título compacto sem harmonizá-la com fórmulas canônicas posteriores; a alternativa sintática permanece possível.
- issue: Relação entre o aumento do mal e o castigo celestial
  choice: oração temporal introduzida por “quando”
  alternative: oração condicional introduzida por “se”
  rationale: A partícula inicial admite nuance temporal ou condicional. “Quando” preserva melhor o cenário apocalíptico anunciado como desenvolvimento esperado, sem eliminar por completo a alternativa, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve cadência bíblica. Emprega “juízo” e “Santo Senhor” para preservar o registro apocalíptico, evitando vocabulário excessivamente arcaico. Todos os marcadores de nota aparecem no texto principal.
