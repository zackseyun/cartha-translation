  terminology: “Pecado”, “transgressão”, “blasfêmia”, “violência”, “impureza”, “castigo”, “juízo” e “Santo Senhor” são escolhas defensáveis e distinguem, na medida do possível, os termos da lista. “Transgressão da lei” comunica adequadamente a ideia de ilegalidade/ausência de lei sem impor interpretação doutrinária.
  issues:
