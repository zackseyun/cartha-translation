    issue: O segundo complemento preposicionado foi omitido em “em ira e castigo”.
    rationale: O ge'ez traz በ antes de ambos os substantivos (በመዓት ወበመቅሠፍት), isto é, literalmente “em ira e em castigo”. A repetição deve ser refletida para preservar a estrutura e a ênfase do original.
  - severity: medium
