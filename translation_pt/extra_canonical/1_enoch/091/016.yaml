base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/016.yaml
  text: And the first heaven shall depart and pass away[a], and a new heaven shall appear[b], and all the powers of the heavens shall shine sevenfold forever.
translation:
  language: pt
  text: E o primeiro céu se retirará e passará, e um novo céu aparecerá; e todos os poderes dos céus[a] brilharão sete vezes mais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as hostes dos céus”. O termo ge’ez pode designar poderes, forças ou hostes celestes e talvez inclua tanto corpos celestes como seres celestes.
    reason: lexical_alternative
  - marker: b
    text: A expressão final é difícil. Pode significar “sete vezes mais” ou “com brilho sete vezes maior”; a redação etíope transmitida não é inteiramente clara.
    reason: textual_difficulty
lexical_decisions:
- source_word: ሰማይ፡ ቀዳማይ፡
  choice: o primeiro céu
  rationale: Preserva o sentido sequencial de ቀዳማይ e o contraste apocalíptico concreto com o novo céu.
- source_word: ይወፅእ፡ ወየኃልፍ፡
  choice: se retirará e passará
  rationale: Mantém os dois verbos de movimento e remoção sem afirmar aniquilação; a formulação é natural e solene em português.
- source_word: ሰማይ፡ ሐዲስ፡
  choice: um novo céu
  rationale: Traduz diretamente ሐዲስ como “novo”, sem decidir entre substituição absoluta e renovação.
- source_word: ይትረአይ፡
  choice: aparecerá
  rationale: Expressa naturalmente o sentido passivo/reflexivo de tornar-se visível ou ser visto.
- source_word: ኵሉ፡ ኃይለ፡ ሰማያት፡
  choice: todos os poderes dos céus
  rationale: Conserva a amplitude de ኃይለ, que pode indicar poderes, forças ou hostes, sem restringir a referência a astros ou seres celestes.
- source_word: ያበርህ፡
  choice: brilharão
  rationale: Reproduz de modo conciso a imagem de emitir luz ou resplandecer.
- source_word: ሰብዓተ፡ ምእዕቢተ።
  choice: sete vezes mais
  rationale: ሰብዓተ indica claramente sete; a forma seguinte parece exprimir aumento ou intensificação. “Sete vezes mais” oferece uma leitura portuguesa clara, mantendo em nota a dificuldade da expressão transmitida.
theological_decisions:
- issue: Substituição ou renovação do cosmos
  choice: 'Preservar a sequência visionária: o primeiro céu passa e um novo céu aparece.'
  alternative: Explicitar destruição e substituição total, ou interpretar o novo céu como renovação do mesmo cosmos.
  rationale: O texto descreve contraste e transição, mas não define sistematicamente a relação ontológica entre o primeiro céu e o novo.
- issue: Identidade dos “poderes dos céus”
  choice: Manter a expressão abrangente e ambígua.
  alternative: Traduzir especificamente como astros, forças cósmicas, anjos ou hostes celestes.
  rationale: O termo etíope admite mais de um referente, e o contexto não exige que a ambiguidade seja resolvida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação inicial e o paralelismo conservam o ritmo visionário. O ponto e vírgula organiza a longa sequência sem alterar sua continuidade.
