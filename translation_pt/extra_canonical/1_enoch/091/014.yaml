base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/014.yaml
  text: And after this[a], in the ninth week, the righteous judgment will be revealed to the whole world, and all the deeds of the wicked will depart from all the earth; and the world will be written down for destruction[d][c][b], and all people will look to the path of uprightness.
translation:
  language: pt
  text: E depois disso, na nona semana[a], o julgamento justo será revelado ao mundo inteiro, e todas as obras dos perversos desaparecerão de toda a terra; o mundo será inscrito para a destruição[b], e todos olharão para o caminho da retidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste esquema simbólico, “semana” designa uma época da história sagrada, não um período literal de sete dias.
    reason: cultural_note
  - marker: b
    text: A expressão é difícil no etíope. O testemunho aramaico de 4Q212 apoia a leitura “o mundo será inscrito para a destruição”; isto é, seu destino de destruição será registrado ou decretado.
    reason: textual_variant
lexical_decisions:
- source_word: በሰንበት ታስዕ
  choice: na nona semana
  rationale: No contexto do Apocalipse das Semanas, designa a nona época simbólica da história, não uma semana literal.
- source_word: ኵነኔ ጽድቅ
  choice: o julgamento justo
  rationale: Preserva a força judicial e apocalíptica da expressão em português natural.
- source_word: ትትከሠት
  choice: será revelado
  rationale: Reproduz o sentido passivo/reflexivo de manifestação ou revelação.
- source_word: ለኵሉ ዓለም
  choice: ao mundo inteiro
  rationale: Neste contexto, ዓለም indica mais naturalmente o mundo como âmbito universal da revelação.
- source_word: ተግባረ ረሲዓን
  choice: as obras dos perversos
  rationale: Mantém a referência concreta aos atos dos ímpios, em registro digno e corrente.
- source_word: ይወፅእ እምዲበ ኵሉ ምድር
  choice: desaparecerão de toda a terra
  rationale: Expressa a retirada das obras perversas sem acrescentar o agente ou o modo de sua remoção.
- source_word: ይጽሐፍ ለሐጕለ ዓለም
  choice: o mundo será inscrito para a destruição
  rationale: Segue a sintaxe esclarecida pelo testemunho aramaico de 4Q212, no qual o mundo é sujeito do verbo passivo; mantém explícita a imagem apocalíptica de inscrição e não define o modo da destruição.
- source_word: ይኔጽሩ ለፍኖተ ርትዕ
  choice: olharão para o caminho da retidão
  rationale: Preserva a orientação expressa pelo verbo e pela preposição sem converter o olhar explicitamente em obediência; o singular corresponde à morfologia de ፍኖተ.
theological_decisions:
- issue: Sentido da cláusula difícil ይጽሐፍ ለሐጕለ ዓለም
  choice: o mundo será inscrito para a destruição
  alternative: será escrito para a destruição da era; será registrado para a ruína do mundo
  rationale: O texto etíope é difícil, mas o aramaico de 4Q212 sustenta que “o mundo” é o sujeito do verbo passivo. A tradução conserva a metáfora do registro decretado e evita especificar “destruição eterna”.
- issue: Força moral de ይኔጽሩ
  choice: olharão para
  alternative: observarão; seguirão
  rationale: A formulação conserva a possível ideia de olhar, atentar ou orientar-se, sem resolver a ambiguidade em favor de obediência efetiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Perversos” evita um tom excessivamente arcaico; “retidão” distingue ርትዕ do termo anterior para justiça. Os marcadores aparecem no texto em ordem alfabética.
