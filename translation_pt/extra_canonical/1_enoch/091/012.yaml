base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/012.yaml
  text: And after this there shall be another week[a], the eighth, of righteousness; and a sword shall be given to it, so that righteous judgment may be carried out against the oppressors[b], and sinners shall be delivered into the hands of the righteous.
translation:
  language: pt
  text: E depois disso haverá outra semana[a], a oitava, de justiça; e uma espada lhe será dada, para que se execute um juízo justo contra os opressores, e os pecadores serão entregues nas mãos dos justos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma oitava semana”. No contexto, as semanas representam períodos simbólicos da história, não semanas comuns do calendário.'
    reason: lexical_alternative
  - marker: b
    text: “Nas mãos dos justos” é uma expressão que indica ser entregue ao poder ou controle deles.
    reason: cultural_note
lexical_decisions:
- source_word: ካልእት
  choice: outra
  rationale: Marca a sucessão dentro da série de períodos simbólicos; “outra” é natural em português e não sugere que se trate literalmente da segunda semana.
- source_word: ሳምንት ሰንበት
  choice: semana, a oitava
  rationale: Conserva tanto a designação do período como sua posição na sequência apocalíptica, com uma ordem clara em português.
- source_word: እንተ ጽድቅ
  choice: de justiça
  rationale: A construção caracteriza a semana. “Justiça” comunica de modo natural o sentido moral e normativo de ጽድቅ no português contemporâneo.
- source_word: ይትወሀብ ላቲ ሰይፍ
  choice: uma espada lhe será dada
  rationale: O pronome retoma “semana”. A tradução preserva a imagem explícita da espada sem decidir se ela é literal ou simbólica.
- source_word: ከመ ይትገበር ኵነኔ ጽድቅ
  choice: para que se execute um juízo justo
  rationale: Mantém a finalidade da oração e combina o aspecto judicial de ኵነኔ com a qualidade moral expressa por ጽድቅ.
- source_word: እምእለ ይገፍዑ
  choice: contra os opressores
  rationale: O verbo denota agir com violência, injustiçar ou oprimir; “opressores” expressa claramente a classe julgada no contexto.
- source_word: ይትሜጠዉ ኃጥኣን በእደዊሆሙ ለጻድቃን
  choice: os pecadores serão entregues nas mãos dos justos
  rationale: Preserva a imagem concreta e o idioma bíblico de transferência ao poder ou controle de alguém.
theological_decisions:
- issue: Como representar ጽድቅ na caracterização da semana e do juízo
  choice: “semana de justiça” e “juízo justo”
  alternative: “semana de retidão” e “juízo de retidão”
  rationale: A raiz comum continua semanticamente perceptível por meio de “justiça/justo”, enquanto a formulação permanece natural em português. Não se reduz o termo à justiça meramente civil.
- issue: Natureza da imagem da espada
  choice: Manter “uma espada lhe será dada”
  alternative: Interpretar como “será dada autoridade para julgar” ou “será concedida vitória”
  rationale: O texto ge'ez menciona expressamente uma espada. Preservar a imagem mantém a força e a abertura interpretativa da linguagem apocalíptica.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblica moderada. Mantêm-se as imagens apocalípticas e o paralelismo entre justiça e juízo, evitando explicações doutrinárias no corpo do texto.
