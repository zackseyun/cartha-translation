base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/001.yaml
  text: The second vision of wisdom that Enoch son of Jared[a], son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam[c][b], saw.
translation:
  language: pt
  text: A segunda visão[a] que ele viu, a visão de sabedoria que Enoque, filho de Jarede, filho de Maalalel, filho de Cainã, filho de Enos, filho de Sete, filho de Adão, viu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “outra visão”. O termo em ge'ez pode significar “outra” ou “segunda”; aqui, “segunda” foi adotado porque o cabeçalho parece indicar sequência.
    reason: lexical_alternative
  - marker: b
    text: A repetição de “filho de” reproduz a forma genealógica do cabeçalho.
    reason: cultural_note
lexical_decisions:
- source_word: ራእይ / ራእየ
  choice: visão
  rationale: O substantivo designa algo visto em contexto revelatório. A repetição de “visão” preserva as duas expressões distintas e o estilo apositivo do título em ge'ez.
- source_word: ዘርእየ
  choice: que ... teve
  rationale: A construção relativa significa literalmente “que ... viu”. Em português, “ter uma visão” é idiomático e mantém a repetição verbal nas duas orações sem produzir o pouco natural “ver uma visão”.
- source_word: ካልእ
  choice: segunda
  rationale: Neste cabeçalho, o termo provavelmente indica sequência, embora também possa significar “outra”; essa alternativa é preservada em nota.
- source_word: ጥበብ
  choice: sabedoria
  rationale: Mantém o sentido usual do termo e a caracterização própria da revelação como “visão de sabedoria”.
- source_word: ወልደ
  choice: filho de
  rationale: A fórmula genealógica explícita é repetida integralmente, sem ser generalizada como “descendente de”.
- source_word: ሄኖክ; ያሬድ; መላልኤል; ቃይናን; ሄኖስ; ሴት; አዳም
  choice: Enoque; Jarede; Maalalel; Cainã; Enos; Sete; Adão
  rationale: Empregam-se formas bíblicas portuguesas reconhecíveis, mantendo a identificação da genealogia transmitida pelo testemunho etíope.
theological_decisions:
- issue: Estrutura repetitiva do cabeçalho
  choice: Manter as duas ocorrências de “visão” e as duas orações relativas, em aposição.
  alternative: Fundir tudo em “A segunda visão de sabedoria que Enoque teve”.
  rationale: O ge'ez apresenta duas expressões distintas e repetitivas; fundi-las apagaria uma característica literária real do texto.
- issue: Forma da genealogia
  choice: Conservar toda a cadeia genealógica até Adão, repetindo “filho de”.
  alternative: Resumir a genealogia ou substituir a fórmula por “descendente de”.
  rationale: A genealogia situa Enoque na história primeva e integra o conteúdo do cabeçalho, não sendo mero dado dispensável.
- issue: Sentido de ካልእ
  choice: “segunda” no texto, com “outra” em nota.
  alternative: “outra” no texto principal.
  rationale: O contexto de um novo bloco visionário favorece valor sequencial, mas o campo semântico não exclui “outra”; a nota conserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas onomásticas bíblicas correntes no português brasileiro. O travessão sinaliza a aposição entre as duas formulações sem eliminar a repetição deliberada do original.
