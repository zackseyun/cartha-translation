base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/003.yaml
  text: It is better to speak to the former ones[b][a], but even from the latter ones we will not withhold the beginning of wisdom.
translation:
  language: pt
  text: É melhor falar aos primeiros[a], mas tampouco privaremos os últimos do princípio da sabedoria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos anteriores”. O texto não esclarece aqui a identidade exata dos “primeiros” e dos “últimos”.'
    reason: ambiguity
  - marker: b
    text: A palavra traduzida por “princípio” significa literalmente “cabeça” e também pode indicar o começo, o fundamento ou a parte principal da sabedoria.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: እሉ፡ ቀዳሚ
  choice: aos primeiros
  rationale: A expressão aponta para os anteriores ou primeiros mencionados no contexto. “Aos primeiros” preserva a relação temporal sem especificar indevidamente se são antepassados, gerações ou ouvintes.
- source_word: ይኄይስ
  choice: é melhor
  rationale: Forma do verbo ኀየሰ, com o sentido de ser bom ou melhor; não é o substantivo “parábola”.
- source_word: ብሂል
  choice: falar
  rationale: Infinitivo verbal com o sentido de dizer ou falar, complementando naturalmente “é melhor”.
- source_word: ወደኃርያንሂ
  choice: mas também ... os últimos
  rationale: Designa os posteriores ou últimos, com partícula enfática. “Mas também” exprime em português o contraste inclusivo entre os primeiros e os últimos.
- source_word: ኢንከልእ
  choice: não privaremos
  rationale: Primeira pessoa do plural do verbo “reter, negar, impedir”. A construção portuguesa “privar alguém de algo” comunica com naturalidade a ideia de não reter a sabedoria dos últimos.
- source_word: ርእሳ፡ ለጥበብ
  choice: o princípio da sabedoria
  rationale: ርእስ significa literalmente “cabeça”, podendo indicar início, parte principal ou princípio; “princípio da sabedoria” mantém a formulação sapiencial e sua abertura semântica.
theological_decisions:
- issue: Identidade dos “primeiros” e dos “últimos”
  choice: manter as designações relacionais sem identificar os grupos
  alternative: explicitar como antepassados e gerações posteriores
  rationale: O verso contrasta dois grupos temporais, mas não os identifica de modo inequívoco. A tradução evita introduzir uma referência histórica ou doutrinária que o texto não explicita.
- issue: Sentido de ርእሳ em relação à sabedoria
  choice: princípio da sabedoria
  alternative: início da sabedoria; parte principal da sabedoria; fundamento da sabedoria
  rationale: O termo literalmente relacionado a “cabeça” admite mais de uma extensão metafórica. “Princípio” conserva tanto a noção de começo quanto a de fundamento, enquanto a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém o contraste do ge’ez sem transformar ይኄይስ em um rótulo literário nem resolver a ambiguidade de “princípio”.
