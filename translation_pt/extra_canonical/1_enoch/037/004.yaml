base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/004.yaml
  text: Until now[a], it had not been given to me before the Lord of Spirits[b], what I have received.
translation:
  language: pt
  text: Até agora, aquilo que recebi[a] não me havia sido dado da parte do Senhor dos Espíritos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração final é difícil. O verbo pode significar “receber”, mas também pode ter sentidos como “tomar”, “erguer” ou, por extensão, “proferir” ou “iniciar” um discurso. O texto ge'ez apresentado não declara explicitamente o objeto.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: “Até agora, não me havia sido dado, da presença do Senhor dos Espíritos, aquilo que tomei.” A formulação “da presença de” reproduz mais de perto a expressão de procedência do ge''ez.'
    reason: previous_rendering
lexical_decisions:
- source_word: እስከ፡ ይእዜ
  choice: Até agora
  rationale: Expressa o limite temporal até o momento presente de modo claro e natural em português.
- source_word: ኢተውህበኒ
  choice: não me havia sido dado
  rationale: Mantém a voz passiva e o sufixo de primeira pessoa. O mais-que-perfeito situa a não concessão como estado anterior ao momento referido.
- source_word: እምቅድመ
  choice: da presença de
  rationale: Preserva tanto a ideia de procedência quanto a nuance espacial e cortesã da expressão etíope, embora a construção permaneça elevada e incomum em português.
- source_word: እግዚአ፡ መንፈሳት
  choice: Senhor dos Espíritos
  rationale: Conserva o título divino recorrente e característico de 1 Enoque.
- source_word: ዘነሣእኩ
  choice: aquilo que recebi
  rationale: Neste contexto, o verbo pode significar receber e forma um par lexical natural com o verbo passivo 'ser dado'. A formulação não explicita um objeto como 'parábola' ou 'discurso'.
theological_decisions:
- issue: Relação entre “não me havia sido dado” e “aquilo que recebi”
  choice: Preservar a tensão verbal no texto principal
  alternative: Interpretar a frase como referência a uma parábola, revelação ou discurso anteriormente não concedido
  rationale: O texto ge'ez fornecido não explicita tal objeto. Acrescentá-lo resolveria interpretativamente uma formulação difícil que deve permanecer visível ao leitor.
- issue: Sentido de እምቅድመ diante do título divino
  choice: da presença do Senhor dos Espíritos
  alternative: diante do Senhor dos Espíritos; da parte do Senhor dos Espíritos
  rationale: A escolha retém simultaneamente a procedência e a imagem da presença ou corte divina, sem reduzir a expressão apenas à agência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve elevação própria da literatura apocalíptica. A ordem da oração e a expressão “da presença de” conservam deliberadamente parte da estranheza do original, enquanto “aquilo que recebi” segue a leitura lexical contextual mais provável.
