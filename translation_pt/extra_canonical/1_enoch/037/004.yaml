  naturalness: A ordem atual — “não me havia sido dado, da presença ..., aquilo que recebi” — é compreensível, mas excessivamente truncada. Antepor “aquilo que recebi” torna a frase mais legível sem eliminar a tensão temporal do original. Os marcadores devem ficar junto aos segmentos que explicam.
