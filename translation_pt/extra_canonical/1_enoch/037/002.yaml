base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/002.yaml
  text: 'And this is the beginning of the word of wisdom that I lifted up to speak and say to those who dwell on the dry land: Hear[a], you former ones, and see, you latter ones[d][c][b], the holy words that I speak before the Lord of Spirits.'
translation:
  language: pt
  text: 'E este é o início da palavra de sabedoria que ergui para falar e dizer aos que habitam em terra seca[a]: “Ouçam, vocês de outrora, e vejam, vocês que virão depois[b], as palavras santas[d] que pronuncio diante do Senhor dos Espíritos[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos que vivem sobre a terra”. O geês diz, mais literalmente, “em terra seca”.'
    reason: lexical_alternative
  - marker: b
    text: “Os de outrora” e “os que virão depois” provavelmente indicam gerações anteriores e posteriores, formando uma convocação que atravessa o tempo.
    reason: cultural_note
  - marker: c
    text: 'Ou: “na presença do Senhor dos Espíritos”.'
    reason: lexical_alternative
  - marker: d
    text: Uma tradução anterior trazia “a palavra do Santo que falarei”; porém, a concordância gramatical e o relativo plural favorecem “as palavras santas que pronuncio”.
    reason: previous_rendering
lexical_decisions:
- source_word: ወዝ፡ ርእሱ
  choice: E este é o início
  rationale: Traduz o demonstrativo introdutório e o sentido idiomático de ርእስ, literalmente “cabeça”, como o começo do discurso.
- source_word: ነገረ፡ ጥበብ
  choice: a palavra de sabedoria
  rationale: Mantém o singular e o registro elevado de ነገር, sem ampliá-lo desnecessariamente para “discurso” ou “matéria”.
- source_word: ዘአንሣእኩ
  choice: que ergui
  rationale: Preserva a imagem de levantar ou erguer a palavra, própria de uma proclamação solene.
- source_word: እትናገር፡ [እብል]
  choice: para falar e dizer
  rationale: Conserva a repetição enfática do texto, embora o segundo verbo esteja assinalado como textualmente incerto na edição.
- source_word: ለእለ፡ ይነድሩ፡ ውስተ፡ የብስ
  choice: aos que habitam em terra seca
  rationale: Retém a imagem concreta de የብስ, “terra seca”, em vez de substituí-la no texto principal por “terra” ou “mundo”.
- source_word: ስምዑ፡ ቀደምት
  choice: Ouçam, vocês de outrora
  rationale: Expressa o imperativo plural e torna inteligível a designação dos que são anteriores, mantendo o contraste temporal.
- source_word: ወርእዩ፡ ደኃርያን
  choice: e vejam, vocês que virão depois
  rationale: Mantém o paralelismo entre os dois imperativos e comunica naturalmente a referência aos posteriores.
- source_word: ነገረ፡ ቅዱሰ፡ እለ፡ እትናገር
  choice: as palavras santas que pronuncio
  rationale: O adjetivo ቅዱሰ concorda com ነገረ, e o relativo plural እለ favorece “palavras santas”, não “palavra do Santo”.
- source_word: ቅድመ፡ እግዚአ፡ መንፈሳት
  choice: diante do Senhor dos Espíritos
  rationale: Traduz de modo direto o título divino característico de 1 Enoque e preserva o possível sentido espacial ou presencial de ቅድመ.
theological_decisions:
- issue: Sentido de ነገረ ቅዱሰ
  choice: “as palavras santas”, com “santas” qualificando “palavras”
  alternative: “a palavra do Santo”, entendendo “Santo” como título divino
  rationale: A concordância morfológica e o relativo plural apoiam a leitura adjetival. Assim, não se introduz um título divino que a gramática local não exige.
- issue: Alcance dos que habitam em terra seca
  choice: Manter a imagem concreta, com provável referência geral aos seres humanos que vivem na terra
  alternative: Explicitar “os habitantes da terra” ou “do mundo”
  rationale: A formulação concreta preserva a imagem do texto e evita transformar uma implicação contextual em paráfrase interpretativa.
- issue: Relação da proclamação com o Senhor dos Espíritos
  choice: “diante do Senhor dos Espíritos”
  alternative: “na presença do Senhor dos Espíritos”
  rationale: Ambas são possíveis; “diante de” conserva maior proximidade formal e deixa aberta a nuance de posição ou presença.
translation_notes:
  register: Português moderno, solene e acessível, com imperativos no plural e vocativos explícitos. Conserva-se a repetição semítica “falar e dizer” e a imagem incomum de erguer a palavra, enquanto “vocês de outrora” e “vocês que virão depois” tornam claro o paralelismo temporal para leitores contemporâneos.
