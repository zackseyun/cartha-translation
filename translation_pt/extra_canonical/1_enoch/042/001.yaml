base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/042/001.yaml
  text: Wisdom found no place where she might dwell[b][a], and her dwelling was in the heavens.
translation:
  language: pt
  text: A Sabedoria não encontrou lugar onde pudesse habitar, e[b] sua morada estava nos céus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O etíope usa o plural “céus”, modo comum de se referir ao âmbito celestial na literatura apocalíptica.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mas sua morada estava”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ጥበብ
  choice: a Sabedoria
  rationale: O substantivo é apresentado como figura atuante, que procura onde habitar; a inicial maiúscula preserva essa personificação.
- source_word: መካነ
  choice: lugar
  rationale: Termo espacial direto e natural em português; a ideia mais específica de moradia é desenvolvida pelo verbo e pelo substantivo seguintes.
- source_word: ኢረከበት
  choice: não encontrou
  rationale: Reproduz o sentido negativo do perfeito, tendo como objeto o “lugar” mencionado imediatamente antes.
- source_word: ኀበ ተኃድር
  choice: onde pudesse habitar
  rationale: Expressa o local procurado para residência e mantém a imagem de habitação em registro digno e corrente.
- source_word: ወሀለወ
  choice: e ... estava
  rationale: Preserva o valor primariamente copulativo e a construção paratática do Ge'ez, sem impor um contraste adversativo mais forte do que o texto exige.
- source_word: ማኅደራ
  choice: sua morada
  rationale: Mantém a personificação e retoma de modo natural a imagem do verbo “habitar”.
- source_word: ውስተ ሰማያት
  choice: nos céus
  rationale: Conserva o plural do Ge'ez e o registro cósmico-apocalíptico.
theological_decisions:
- issue: Preservar a Sabedoria como figura personificada ou reduzi-la a uma qualidade abstrata
  choice: A Sabedoria não encontrou lugar onde pudesse habitar
  alternative: Não havia lugar onde a sabedoria pudesse habitar
  rationale: O versículo apresenta a Sabedoria como sujeito atuante e atribui-lhe uma morada. A formulação conserva a personificação própria da tradição sapiencial sem defini-la doutrinariamente.
- issue: Valor da conjunção ወ
  choice: e sua morada estava
  alternative: mas sua morada estava
  rationale: A conjunção é primariamente copulativa e pode introduzir aqui a continuação ou consequência narrativa. A alternativa adversativa é possível e, por isso, é registrada em nota sem ser imposta ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a personificação da Sabedoria, a repetição semântica entre “habitar” e “morada” e a parataxe do original.
