base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/005.yaml
  text: Woe to you who repay evil to your neighbor, for you will be repaid according to your deeds.
translation:
  language: pt
  text: Ai de vocês que retribuem o mal ao seu próximo, pois vocês receberão retribuição conforme suas ações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A mesma raiz verbal ge''ez aparece nas duas orações: os que “retribuem” o mal receberão, eles mesmos, “retribuição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Ai de vocês
  rationale: Preserva a fórmula profética de denúncia e juízo em português bíblico atual e inteligível.
- source_word: ትፈድዩ
  choice: retribuem
  rationale: Mantém o sentido de dar em paga e permite reproduzir a mesma raiz verbal na segunda oração.
- source_word: እኩየ
  choice: o mal
  rationale: Conserva a amplitude moral e danosa do termo sem restringi-lo a dano físico.
- source_word: ለቢጽክሙ
  choice: ao seu próximo
  rationale: Expressa a relação interpessoal indicada pelo ge'ez e corresponde ao uso bíblico natural em português.
- source_word: ትትፈድዩ
  choice: vocês receberão retribuição
  rationale: Preserva a construção passiva e o eco lexical da primeira oração, sem declarar quem executará a retribuição.
- source_word: በከመ፡ ምግባሪክሙ
  choice: conforme suas ações
  rationale: Comunica a ideia de retribuição proporcional à conduta; 'ações' é concreto e evita conotações técnicas indevidas de 'obras'.
theological_decisions:
- issue: Agente e natureza da retribuição
  choice: Manter o agente implícito por meio de uma formulação passiva.
  alternative: Explicitar que Deus retribuirá, ou apresentar a consequência como retorno impessoal do mal.
  rationale: O contexto favorece uma fórmula de juízo, mas o texto não nomeia o agente; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de 'retribuir/retribuição' é deliberada para refletir a simetria retórica do ge'ez.
