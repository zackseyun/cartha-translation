base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/004.yaml
  text: Woe to you who pronounce curses that cannot be undone[c][b][a], and healing is far from you because of your sins.
translation:
  language: pt
  text: Ai de vocês que proferem maldições que não podem ser desfeitas[a]; a cura está longe de vocês por causa dos seus pecados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “anátemas que não podem ser revogados”. A expressão etíope descreve maldições ou fórmulas vinculantes que não podem ser soltas ou anuladas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Ai de vocês
  rationale: Reproduz a fórmula profética de denúncia em português corrente e solene.
- source_word: እለ፡ ታወግዙ፡ ግዘታተ
  choice: que proferem maldições
  rationale: Entende o verbo e seu objeto cognato no campo de amaldiçoar ou impor uma maldição, conforme a revisão filológica; evita a leitura anterior, inadequada, relacionada a pesar prata.
- source_word: ከመ፡ እ ይትፈትሑ
  choice: que não podem ser desfeitas
  rationale: Lê a sequência como contendo a negação ኢ e o passivo de 'soltar, desligar'; 'desfeitas' expressa em português natural a impossibilidade de revogar ou desfazer as maldições.
- source_word: ወፈውስ፡ ርኁቅ፡ እምኔክሙ
  choice: a cura está longe de vocês
  rationale: Mantém a metáfora espacial e a possível ressonância física, moral e restauradora de 'cura'.
- source_word: በእንተ፡ ኃጢአተ፡ ዚአክሙ
  choice: por causa dos seus pecados
  rationale: Traduz diretamente a relação causal e conserva o plural coletivo.
theological_decisions:
- issue: Natureza das palavras proferidas
  choice: maldições
  alternative: anátemas; juramentos vinculantes
  rationale: ‘Maldições’ é claro e natural, preservando o teor condenatório sem introduzir a carga técnica ou eclesiástica que ‘anátemas’ pode ter em português.
- issue: Sentido de ‘não podem ser desfeitas’
  choice: Conservar a linguagem de irreversibilidade sem explicar quem poderia desfazê-las
  alternative: não podem ser revogadas; não podem ser desligadas
  rationale: O texto não identifica explicitamente o agente nem define o mecanismo de liberação. A formulação mantém essa abertura e evita uma elaboração doutrinária.
- issue: Relação entre pecado e cura distante
  choice: Manter uma afirmação causal direta
  alternative: a cura foi afastada de vocês por seus pecados
  rationale: A construção traduz a causalidade do texto sem especificar se a cura é corporal, espiritual ou comunitária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A tradução segue a revisão filológica do etíope e não perpetua a leitura anterior de “pesar prata”. O ponto e vírgula liga as duas consequências do oráculo sem criar uma relação sintática além do texto.
