base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/003.yaml
  text: Do not fear the sinners[a], O righteous ones, for again the Lord will deliver them into your hands[c][b], so that you may execute judgment upon them according to your pleasure.
translation:
  language: pt
  text: Não tenham medo dos pecadores[a], ó justos, pois o Senhor tornará a entregá-los nas mãos de vocês[b], para que executem juízo sobre eles como quiserem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não tenham medo por causa dos pecadores”. Com o verbo de temor, a construção ge''ez com እም pode ser entendida mais literalmente como “por causa de” ou “da parte de”.'
    reason: lexical_alternative
  - marker: b
    text: “Nas mãos de vocês” é uma expressão que significa ser entregue ao poder ou controle de alguém.
    reason: cultural_note
  - marker: c
    text: 'Ou: “segundo a vontade de vocês” ou “conforme desejarem”. A frase retrata a reversão em que os justos recebem autoridade sobre aqueles que os oprimiam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: Não tenham medo
  rationale: Imperativo negativo plural dirigido aos justos; a formulação é natural em português e conserva a força direta da exortação.
- source_word: ጻድቃን
  choice: ó justos
  rationale: O substantivo plural designa o grupo dos justos e funciona aqui como vocativo; “ó justos” preserva o apelo solene sem deixar de ser claro.
- source_word: እምኃጥኣን
  choice: dos pecadores
  rationale: A preposição እም com o verbo de temor pode indicar origem ou causa (“por causa dos pecadores”); em português, “ter medo de” expressa idiomaticamente a relação sem eliminar os oponentes concretos.
- source_word: ካዕበ
  choice: tornará a
  rationale: Marca repetição ou renovação da ação. A perífrase portuguesa “tornará a entregá-los” comunica “entregará novamente” em registro digno e fluente.
- source_word: ያገብኦሙ
  choice: entregá-los
  rationale: Em conjunto com “nas mãos de vocês”, o verbo indica pôr alguém sob o poder de outro. “Entregar” preserva esse sentido judicial sem especificar indevidamente o modo.
- source_word: ውስተ እዴክሙ
  choice: nas mãos de vocês
  rationale: Mantém a imagem concreta do idioma de transferência ao poder ou controle de alguém e torna inequívoco que o pronome plural se refere aos justos.
- source_word: ከመ ትግበሩ
  choice: para que executem
  rationale: A construção exprime finalidade. Com “juízo” como objeto, “executar” é idiomático e conserva a participação ativa indicada pelo texto.
- source_word: ኵነኔ
  choice: juízo
  rationale: O termo pertence ao campo judicial. “Juízo” preserva o registro apocalíptico e deixa em aberto a amplitude entre sentença, julgamento e sua execução.
- source_word: በከመ ፈቀድክሙ
  choice: como quiserem
  rationale: A expressão indica conformidade com a vontade ou o desejo dos justos. “Como quiserem” é natural em português e preserva a amplitude da formulação ge'ez.
theological_decisions:
- issue: Se os justos participam ativamente do juízo dos pecadores ou apenas presenciam a vindicação divina
  choice: Os justos são apresentados como agentes que executarão juízo depois que o Senhor entregar os pecadores em suas mãos.
  alternative: Os justos apenas presenciam o juízo de Deus ou recebem autoridade sem exercer diretamente o julgamento.
  rationale: A oração final “para que executem juízo” e a expressão “nas mãos de vocês” apontam conjuntamente para participação ativa. A tradução conserva essa tensão apocalíptica, sem reduzi-la a mera vindicação passiva.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. O plural “vocês” evita a ambiguidade possessiva de “suas mãos”; o vocativo “ó justos” mantém o tom apocalíptico elevado. As notas preservam as alternativas reais do ge'ez sem impor uma interpretação denominacional.
