  text: Who has allowed you to do hatred and evil? And condemnation will overtake you sinners[a][b].
translation:
  language: pt
  text: Quem permitiu que vocês praticassem o ódio e o mal? A condenação alcançará vocês, pecadores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኑ
  choice: Quem
  rationale: Mantém a abertura interrogativa e a força direta da repreensão.
- source_word: ወሀበክሙ ከመ ትግበሩ
  choice: permitiu que vocês praticassem
  rationale: A construção com o verbo 'dar' e ከመ exprime aqui autorização; esta formulação é natural em português sem perder o desafio retórico.
- source_word: ጽልአ
  choice: ódio
  rationale: Equivalente direto que conserva o peso moral de hostilidade ou inimizade.
- source_word: ወእኩየ
  choice: e o mal
  rationale: Preserva o sentido moral amplo do termo e o registro apocalíptico.
- source_word: ይረከበክሙ
  choice: alcançará vocês
  rationale: O verbo pode significar encontrar, atingir ou alcançar; no contexto de juízo, 'alcançará' comunica a chegada inevitável da condenação.
- source_word: ለኃጥኣን
  choice: vocês, pecadores
  rationale: O prefixo ለ funciona como marcador acusativo na aposição ao sufixo pronominal plural do verbo, identificando os destinatários como pecadores, e não como dativo 'para pecadores'.
- source_word: ኵነኔ
  choice: condenação
  rationale: O contexto denunciador indica sentença adversa, não apenas avaliação judicial neutra.
theological_decisions:
- issue: Se ኵነኔ deve ser traduzido de modo geral como 'julgamento' ou especificamente como 'condenação'
  choice: condenação
  alternative: julgamento; sentença
  rationale: O contexto de denúncia contra malfeitores aponta para um veredito desfavorável; 'condenação' preserva essa força punitiva.
- issue: Como interpretar ለኃጥኣን em relação ao objeto plural de ይረከበክሙ
  choice: 'aposição de tratamento: ''vocês, pecadores'''
  alternative: para os pecadores
  rationale: A análise gramatical mais forte entende ለ como marcador acusativo em aposição ao objeto pronominal antecipado. A nota registra a leitura formal alternativa sem lhe dar prioridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para explicitar a segunda pessoa do plural. 'Praticassem o ódio e o mal' mantém o paralelismo moral e soa mais natural do que 'fizessem ódio'. A vírgula em 'vocês, pecadores' deixa clara a aposição.
