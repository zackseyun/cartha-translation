base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/001.yaml
  text: Who will grant me that my eyes might become a cloud of water[a], so that I may weep over you and pour out my tears like a cloud of water[c][b], and find rest from the sorrow of my heart?
translation:
  language: pt
  text: Quem me concederá que os meus olhos se tornem uma nuvem de água[a], para que eu chore por vocês[b], derrame as minhas lágrimas como uma nuvem de água e encontre descanso da tristeza do meu coração?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma nuvem de chuva”. A imagem do ge'ez aparece duas vezes e pode evocar os olhos transformados numa nuvem carregada de lágrimas.
    reason: lexical_alternative
  - marker: b
    text: O pronome está no plural e, pelo contexto, provavelmente se refere aos pecadores ou ímpios a quem se dirigem os ais próximos.
    reason: cross_reference
lexical_decisions:
- source_word: መኑ፡ ይሁበኒ
  choice: Quem me concederá
  rationale: Mantém a pergunta de lamento e o objeto de primeira pessoa expresso no verbo (“me”), transmitindo o desejo de que algo seja possibilitado sem transformar a frase numa invocação dirigida a alguém nomeado.
- source_word: ለአዕይንትየ፡ ከመ፡ ይኩና፡ ደመና፡ ማይ
  choice: que os meus olhos se tornem uma nuvem de água
  rationale: Preserva a imagem poética incomum e a referência explícita aos olhos. A concordância no singular segue o predicativo “uma nuvem”, embora “olhos” seja plural.
- source_word: እብኪ፡ ዲቤክሙ
  choice: eu chore por vocês
  rationale: “Por vocês” é natural em português para o choro motivado ou dirigido às pessoas lamentadas, sem definir em excesso se predomina compaixão, luto ou acusação. “Vocês” torna perceptível o plural do ge'ez.
- source_word: እክዐው፡ አንብዐየ
  choice: derrame as minhas lágrimas
  rationale: Conserva a intensidade da emissão ativa das lágrimas e se ajusta ao registro poético do lamento.
- source_word: ከመ፡ ደመና፡ ማይ
  choice: como uma nuvem de água
  rationale: Repete a mesma metáfora da primeira ocorrência, como no texto-fonte, em vez de variá-la ou reduzi-la a uma referência genérica à abundância de lágrimas.
- source_word: ወአዕርፍ፡ እምሐዘነ፡ ልብየ
  choice: e encontre descanso da tristeza do meu coração
  rationale: Mantém a imagem concreta do descanso e a ideia de afastamento ou alívio da tristeza, sem substituir o verbo por uma explicação psicológica.
theological_decisions:
- issue: Se a metáfora poética deve ser suavizada em linguagem idiomática
  choice: Manter “nuvem de água” no texto principal
  alternative: “nuvem de chuva” ou “olhos cheios de lágrimas”
  rationale: A expressão incomum é inteligível e reproduz uma imagem repetida e enfática do ge'ez. Suavizá-la apagaria parte da força poética do lamento.
- issue: Relação do choro com os destinatários plurais
  choice: “chore por vocês”
  alternative: “chore sobre vocês” ou “chore por causa de vocês”
  rationale: A preposição do texto-fonte permite uma relação ampla. A formulação escolhida conserva a possibilidade de lamento pelos destinatários sem decidir se o foco é exclusivamente compaixão, destino ou culpa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A estranheza intencional da metáfora foi preservada, e a sequência verbal foi mantida no subjuntivo sob “para que”.
