  text: I swear to you that in heaven the angels remember you for good before the glory of the Great One[a][b][c].
translation:
  language: pt
  text: Eu lhes juro que, no céu, os anjos se lembram de vocês em favor deles, diante da glória do Grande[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope fornecido termina de modo incompleto depois de «diante de». As palavras «a glória do Grande» refletem a restauração provável da frase com base no contexto e no testemunho textual paralelo.
    reason: textual_variant
lexical_decisions:
- source_word: እምሕል፡ ለክሙ፡
  choice: Eu lhes juro
  rationale: A expressão é uma fórmula de juramento na primeira pessoa dirigida ao plural; não significa «não pensem».
- source_word: በሰማይ፡
  choice: no céu
  rationale: Tradução direta da locução etíope, sem deslocá-la para a expressão posterior «diante da glória».
- source_word: ይዜከሩ፡ መላእክት፡
  choice: os anjos se lembram
  rationale: Preserva o sujeito explícito «anjos» e o sentido básico do verbo de lembrar, em vez de introduzir a imagem de um registro escrito.
- source_word: በእንቲአክሙ፡ ለሠናይ፡
  choice: de vocês para o bem
  rationale: Reproduz a ideia de lembrança favorável a respeito dos destinatários, mantendo a formulação pouco especificada do original.
- source_word: በ*ቅድመ፡
  choice: diante da glória do Grande
  rationale: O texto fornecido termina após «diante de», de modo que o complemento segue a restauração contextual e o testemunho paralelo refletidos na edição consultada; a incerteza é explicitada em nota.
theological_decisions:
- issue: Natureza da lembrança celestial
  choice: Os anjos se lembram favoravelmente dos destinatários no céu.
  alternative: A lembrança constitui um memorial escrito no tribunal celestial.
  rationale: O texto etíope preservado menciona explicitamente os anjos e o ato de lembrar. Embora o contexto possa sugerir uma dimensão judicial, a tradução não acrescenta a imagem de um livro ou registro que não aparece nesta linha.
- issue: Referente de «o Grande»
  choice: Manter o título «o Grande» sem explicação doutrinária no corpo do texto.
  alternative: Explicitar «o grande Deus».
  rationale: A forma titular conserva a linguagem reverente e a relativa abertura da expressão restaurada, sem inserir um substantivo ausente.
translation_notes:
  register: Português moderno, digno e acessível, com pronomes de ampla legibilidade brasileira. «Eu lhes juro» mantém a solenidade da fórmula sem soar arcaico; «se lembram de vocês para o bem» preserva a construção sem transformar implicitamente a lembrança em registro judicial.
