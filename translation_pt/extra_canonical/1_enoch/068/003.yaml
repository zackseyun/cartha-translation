base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/003.yaml
  text: And Mikael answered again and said to Rufael, "Who is he whose heart is not softened concerning it, and whose kidneys are not troubled by this word of severity and the sentence that has gone out against them because of those who brought them out thus?"
translation:
  language: pt
  text: 'E Mikael tornou a responder e disse a Rufael: “Quem é aquele cujo coração não se abranda quanto a isso e cujos rins[a] não se perturbam com esta palavra de rigor e com a sentença que saiu contra eles por causa daqueles que os fizeram sair assim?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujas partes íntimas não se perturbam”. O geês diz literalmente “rins”, imagem corporal tradicional para o íntimo da pessoa.'
    reason: lexical_alternative
  - marker: b
    text: A cláusula final é textualmente difícil no testemunho etíope, sobretudo por causa da palavra indicada entre colchetes na edição. Também poderia ser entendida, com cautela, como “dentre eles, assim”.
    reason: textual_variant
lexical_decisions:
- source_word: አውሥአ ካዕበ
  choice: tornou a responder
  rationale: Expressa de modo natural a repetição indicada por ካዕበ (‘novamente, uma segunda vez’) e preserva a fórmula narrativa.
- source_word: ሚካኤል ለሩፋኤል
  choice: Mikael ... a Rufael
  rationale: Mantém por transliteração as formas dos nomes presentes no texto etíope, sem normalizá-las segundo formas confessionais mais familiares.
- source_word: ዘኢይረክሕ ልቡ
  choice: cujo coração não se abranda
  rationale: Preserva a imagem concreta do coração que se torna brando ou terno, em vez de substituí-la por uma reação psicológica genérica.
- source_word: ዲቤሃ
  choice: quanto a isso
  rationale: Mantém indefinida a referência do pronome e evita decidir se a relação é estritamente causal.
- source_word: ኢይትሀወክ ኵልያቲሁ
  choice: cujos rins não se perturbam
  rationale: Conserva a antiga imagem corporal dos rins como sede da vida interior; a nota esclarece seu sentido figurado.
- source_word: ቃለ ጽነኒ
  choice: palavra de rigor
  rationale: Reproduz o caráter severo do pronunciamento com expressão portuguesa formal e inteligível, sem convertê-lo explicitamente em decreto.
- source_word: ፅእት ዲቤሆሙ
  choice: a sentença que saiu contra eles
  rationale: ‘Sentença’ comunica o contexto judicial, enquanto ‘saiu’ preserva a imagem de um pronunciamento que procede ou é emitido.
- source_word: '[እምኔሆሙ] ዘአውፅእዎሙ ከመ''ዝ'
  choice: por causa daqueles que os fizeram sair assim
  rationale: Inclui a oração relativa atestada e entende እም em sentido causal, mas sinaliza em nota a dificuldade textual e sintática da conclusão.
theological_decisions:
- issue: Imagens antropológicas do coração e dos rins
  choice: Manter os termos corporais concretos
  alternative: Substituí-los por ‘mente’, ‘espírito’ ou ‘íntimo’
  rationale: O texto emprega linguagem semítica corporal para a reação moral e emocional. Preservá-la evita reduzir a antropologia antiga a categorias psicológicas modernas.
- issue: Relação causal na cláusula final
  choice: ‘por causa daqueles que os fizeram sair assim’
  alternative: ‘dentre eles, assim’ ou ‘da parte deles’
  rationale: A leitura causal oferece uma frase portuguesa possível e corresponde a um uso atestado da preposição, mas a nota conserva a incerteza do testemunho etíope em vez de apresentar a reconstrução como indiscutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe preserva o tom retórico e judicial do texto, enquanto as notas explicam a imagem corporal incomum e a incerteza da cláusula final.
