base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/002.yaml
  text: And on that day Michael answered[a], saying to Raphael, “The power of the spirit seizes me and provokes me to anger because of the severity of the judgment concerning the hidden secrets. Who is there that can endure the severe judgment that has been executed[c][b], and before which they melt away?”
translation:
  language: pt
  text: 'E, naquele dia, Miguel respondeu, dizendo a Rafael: “O poder do espírito se apodera de mim e provoca a minha ira por causa da severidade do juízo a respeito dos segredos ocultos.[a] Quem é capaz de suportar o terrível juízo que foi executado[b] e diante do qual eles se derretem?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge’ez desta oração é difícil. A expressão também pode ser entendida mais literalmente como algo “terrível para o ouvido” a respeito das coisas ocultas.
    reason: textual_variant
  - marker: b
    text: 'Ou: “a coisa terrível que foi feita”. A formulação pode referir-se ao próprio juízo ou à manifestação dele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: respondeu
  rationale: Verbo narrativo que pode significar responder ou falar em réplica; “respondeu” preserva a situação de diálogo introduzida pelo texto.
- source_word: ኀይሉ ለመንፈስ
  choice: o poder do espírito
  rationale: Mantém a ideia de força ativa e não identifica de modo dogmático o espírito como o Espírito divino.
- source_word: ይመሥጠኒ
  choice: se apodera de mim
  rationale: Expressa uma ação intensa de tomar, agarrar ou dominar, conservando a vivacidade da linguagem apocalíptica.
- source_word: ያምዕዐኒ
  choice: me provoca à ira
  rationale: O causativo do verbo relacionado à ira ou indignação indica que essa força leva Miguel a irar-se, e não apenas que o impulsiona de maneira genérica.
- source_word: ዕፁቡ
  choice: severidade / terrível
  rationale: O termo denota algo duro, grave ou aterrador. As duas formas portuguesas evitam repetição rígida e preservam a intensidade judicial do contexto.
- source_word: እንተ ኅቡኣት
  choice: os segredos ocultos
  rationale: Representa o campo semântico de coisas escondidas ou secretas e mantém o tom de revelação apocalíptica.
- source_word: ተዐግሦተ
  choice: suportar
  rationale: Indica a capacidade de resistir ou aguentar algo esmagador; “suportar” é natural e preciso em português.
- source_word: ተገብረት
  choice: foi executado
  rationale: O perfeito passivo indica algo realizado ou levado a efeito; no contexto judicial, “executado” transmite essa nuance sem excluir o sentido mais geral de “feito”.
- source_word: ይትመሰዉ
  choice: eles se desfazem
  rationale: Conserva a imagem de dissolução ou definhamento diante do juízo, sem especificar além do texto quem são os sujeitos.
theological_decisions:
- issue: Identificação de መንፈስ como “espírito” ou “Espírito”
  choice: o espírito
  alternative: o Espírito
  rationale: O texto descreve uma força espiritual que domina Miguel, mas não identifica inequivocamente seu referente como o Espírito divino. A inicial minúscula preserva essa ambiguidade.
- issue: Se ዕፁቡ descreve o próprio juízo ou uma notícia terrível ouvida acerca das coisas ocultas
  choice: a severidade do juízo a respeito dos segredos ocultos
  alternative: algo terrível para o ouvido acerca das coisas ocultas
  rationale: A formulação etíope transmitida é difícil e parece conter uma referência repetida ao ouvido. A leitura judicial oferece o melhor sentido contextual, enquanto a nota preserva a possibilidade mais literal.
- issue: Referente do que foi realizado em ተገብረት
  choice: o terrível juízo que foi executado
  alternative: a coisa terrível que foi feita ou revelada
  rationale: O contexto favorece um juízo já levado a efeito, mas a gramática também admite uma referência mais geral ao acontecimento ou à sua revelação; a nota mantém essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas correntes no Brasil. Foram usados os nomes tradicionais portugueses “Miguel” e “Rafael”. A sintaxe conserva a solenidade do discurso apocalíptico sem reproduzir de modo mecânico as dificuldades do ge’ez.
