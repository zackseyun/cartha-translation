  yaml_path: translation/extra_canonical/1_enoch/068/005.yaml
  text: Because of this[b][a], everything hidden forever shall come upon them.
translation:
  language: pt
  text: Por causa disso, tudo o que está oculto para sempre virá sobre eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão final também pode ser entendida como “por toda a era”, “desde tempos antigos” ou ligada ao verbo principal: “tudo o que está oculto virá sobre eles para sempre”.'
    reason: A expressão ge'ez ለዓለመ admite diferentes nuances temporais e sua ligação sintática é incerta.
lexical_decisions:
- source_word: በእንተ'ዝ
  choice: Por causa disso
  rationale: Mantém a força causal explícita da expressão, sem reduzi-la a um simples conectivo conclusivo.
- source_word: ይመጽእ
  choice: virá
  rationale: Expressa de modo natural em português a força futura do verbo no contexto de juízo.
- source_word: ላዕሌሆሙ
  choice: sobre eles
  rationale: Preserva a ideia de algo que vem sobre os envolvidos, sem tornar a frase mais interpretativa com “contra eles”.
- source_word: ኵሉ ዘኅቡእ
  choice: tudo o que está oculto
  rationale: Reproduz a totalidade e a forma relativa do ge'ez, mantendo em aberto o que exatamente está oculto.
- source_word: ለዓለመ
  choice: para sempre
  rationale: Conserva o sentido possível de duração eterna; uma nota registra tanto outras nuances temporais quanto a possível ligação da expressão ao verbo principal.
theological_decisions:
- issue: Se a frase descreve a revelação do que estava oculto ou a vinda de realidades ou juízos ocultos sobre eles
  choice: Manter “virá sobre eles”, sem substituir o verbo por “será revelado”
  alternative: “Tudo o que estava oculto será revelado contra eles”
  rationale: O ge'ez afirma que algo virá sobre eles. A formulação preserva a força ominosa e judicial, mas não define se o referente são atos secretos, realidades ocultas ou juízos reservados.
- issue: Ligação sintática de ለዓለመ
  choice: Ligá-lo no texto principal a “oculto”
  alternative: 'Ligá-lo ao verbo principal: “virá sobre eles para sempre”'
  rationale: A posição final permite discussão, mas a proximidade com a expressão relativa e a tradição lexical favorecem “oculto para sempre”. A ambiguidade real é explicitada na nota, sem transformar uma análise disputada em certeza teológica.
translation_notes:
  register: Português moderno, claro e solene, com leve elevação apropriada ao contexto apocalíptico. Evitou-se o futuro excessivamente arcaizante e preservou-se a concisão do original.
