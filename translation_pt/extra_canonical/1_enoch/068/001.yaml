base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/001.yaml
  text: And after this my grandfather Hēnok gave me the sign of all the hidden things in a book[a], and the parables that had been given to him[c][b]; and they shall recount them to me in the account of the book of the Parable.
translation:
  language: pt
  text: E depois disso, meu avô Enoque me deu, num livro, o sinal de todas as coisas ocultas[a] e as parábolas que lhe haviam sido dadas[b]; e eles as relatarão a mim no relato do Livro da Parábola[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação deste versículo é difícil no testemunho em ge'ez. A tradução permanece próxima da construção preservada, sem regularizar inteiramente sua sintaxe.
    reason: textual_variant
  - marker: b
    text: 'Ou: “as similitudes que lhe haviam sido dadas”.'
    reason: lexical_alternative
  - marker: c
    text: A expressão também pode ser entendida como “nas palavras do Livro da Parábola” ou “no assunto do Livro da Parábola”. O singular “Parábola” segue a forma deste testemunho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርተ
  choice: o sinal
  rationale: O substantivo pode designar sinal, marca ou indício. “Sinal” conserva o registro revelatório sem introduzir a ideia não exigida de “explicação”.
- source_word: ኵሎሙ ኅቡኣት
  choice: todas as coisas ocultas
  rationale: Expressa de modo claro aquilo que estava escondido e foi revelado, sem recorrer ao termo teologicamente mais carregado “mistérios”.
- source_word: በመጽሐፍ
  choice: num livro
  rationale: A preposição situa o conteúdo no suporte escrito; o artigo indefinido acompanha a leitura contextual adotada, embora “no livro” também seja possível.
- source_word: እምሔውየ ሄኖክ
  choice: meu avô Enoque
  rationale: እምሔውየ é entendido como um único substantivo com sufixo possessivo de primeira pessoa, “meu avô” ou “meu antepassado”, e funciona com Enoque como sujeito explícito.
- source_word: ምሳሌያተ
  choice: as parábolas
  rationale: “Parábolas” é corrente, inteligível e preserva a designação tradicional desta seção; “similitudes” permanece uma alternativa possível.
- source_word: ተውህበ ሎቱ
  choice: que lhe haviam sido dadas
  rationale: A forma passiva apresenta Enoque como destinatário, e o mais-que-perfeito composto expressa naturalmente a anterioridade no relato.
- source_word: ይመርሙ ሊተ
  choice: eles as relatarão para mim
  rationale: A expressão é difícil. “Relatarão” preserva a ideia de expor o conteúdo sem decidir entre explicar, interpretar ou narrar, e mantém o sujeito plural do testemunho.
- source_word: ነገረ መጽሐፍ ዘምሳሌ
  choice: no relato do Livro da Parábola
  rationale: ነገር pode significar assunto, palavra ou relato; “relato” convém ao contexto literário. O singular “Parábola” segue a forma imediata do testemunho.
theological_decisions:
- issue: Como designar o conteúdo encoberto da revelação
  choice: coisas ocultas
  alternative: mistérios; segredos
  rationale: A formulação preserva a dimensão apocalíptica de revelação sem impor um sentido teológico técnico que o ge'ez não exige.
- issue: Sentido de ትእምርተ no contexto revelatório
  choice: sinal
  alternative: marca; indício; explicação
  rationale: “Sinal” corresponde melhor à faixa lexical atestada e conserva a ambiguidade do objeto recebido; “explicação” resolveria o sentido além do que a palavra permite.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com grafia brasileira de “Enoque”. A ordem foi levemente ajustada para clareza (“num livro”), mas a sintaxe incomum, o sujeito plural indefinido de “eles as relatarão” e a tensão lexical foram preservados.
