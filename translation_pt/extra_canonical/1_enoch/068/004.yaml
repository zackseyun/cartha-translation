base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/004.yaml
  text: 'And it came to pass[a], when he stood before the Lord of Spirits, that Michael said this to Raphael: “He will not be for them before the eye of the Lord, for the Lord of Spirits is angry with them[c][b], because they act as if they were the Lord.”'
translation:
  language: pt
  text: 'E aconteceu que, quando ele se pôs diante do Senhor dos Espíritos, Miguel disse isto a Rafael: “Ele não ficará do lado deles diante dos olhos do Senhor[a], pois o Senhor dos Espíritos está irado com eles, porque agem como se fossem o Senhor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase também pode ser traduzida mais literalmente: “Ele não será por eles diante dos olhos do Senhor”. O referente de “Ele” não é explicitado neste versículo; a ideia parece ser que ele não tomará o partido deles na presença de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “porque agem como senhores”. A expressão ge''ez é concisa e pode acusá-los de assumir uma autoridade divina ou uma autoridade de governantes que não lhes pertence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮነ፡ ሶበ፡
  choice: E aconteceu que, quando
  rationale: Mantém a transição narrativa e a oração temporal da fórmula etíope, em português atual e digno.
- source_word: ቆመ፡
  choice: ele se pôs
  rationale: Expressa o ato de tomar posição ou estar de pé, sem identificar o referente masculino que o contexto imediato não explicita.
- source_word: በቅድመ፡ እግዚአ፡ መናፍስት፡
  choice: diante do Senhor dos Espíritos
  rationale: Preserva o título divino característico de 1 Enoque e a dimensão espacial e judicial de estar perante Deus.
- source_word: ወከመ'ዝ፡ ይቤሎ፡
  choice: Miguel disse isto a Rafael
  rationale: Reproduz com naturalidade a transição para a fala e conserva a força demonstrativa de “assim/isto”.
- source_word: ወኢይከውን፡ ሎሙ፡ በውስተ፡ ዓይነ፡ እግዚአ፡
  choice: Ele não ficará do lado deles diante dos olhos do Senhor
  rationale: “Ficar do lado deles” comunica o valor idiomático de apoio ou defesa sem acrescentar explicitamente “interceder”; o pronome singular e seu referente incerto são preservados. “Diante dos olhos” mantém a imagem concreta do original.
- source_word: ተምዕዖሙ፡
  choice: está irado com eles
  rationale: Transmite claramente a ira divina e conserva o tom solene e judicial.
- source_word: እምሳለ፡ እግዚአ፡ ይገብሩ።
  choice: agem como se fossem o Senhor
  rationale: Mantém a acusação grave de assumirem uma prerrogativa divina, sem reduzi-la à ideia mais branda de simples autoridade humana.
theological_decisions:
- issue: Referente do pronome masculino singular na declaração de Miguel
  choice: Manter “Ele” sem identificar seu referente
  alternative: “Eu não ficarei do lado deles” ou “Ele não intercederá por eles”
  rationale: O texto ge'ez apresentado traz a terceira pessoa do singular, mas não fornece neste versículo um antecedente inequívoco. A tradução preserva essa ambiguidade e evita nomear um intercessor.
- issue: Natureza do apoio negado aos condenados
  choice: “não ficará do lado deles”
  alternative: “não será por eles”, “não os defenderá” ou “não intercederá por eles”
  rationale: A escolha comunica o provável sentido de tomar o partido de alguém em contexto judicial, mas não transforma essa possibilidade em uma doutrina explícita de intercessão.
- issue: Força da acusação final
  choice: “agem como se fossem o Senhor”
  alternative: “agem como senhores”
  rationale: A leitura escolhida preserva a tensão teológica de usurpação da autoridade divina; a alternativa permanece possível devido à concisão da expressão ge'ez.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é solene sem arcaísmos excessivos. As ambiguidades do pronome singular, do apoio judicial e da acusação final foram mantidas ou registradas em notas.
