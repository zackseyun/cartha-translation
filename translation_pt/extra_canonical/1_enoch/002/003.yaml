base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/003.yaml
  text: Look at the summer and the winter[a], how the whole earth is filled with water[b], and clouds and dew and rain rest upon it.
translation:
  language: pt
  text: 'Observem o verão e o inverno[a]: como toda a terra está cheia de água, e nuvens, orvalho[b] e chuva repousam sobre ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O par sazonal «verão e inverno» reproduz diretamente a formulação ge'ez. No contexto etíope, «inverno» pode evocar mais a estação chuvosa do que uma estação fria no sentido moderno.
    reason: cultural_note
  - marker: b
    text: O termo traduzido por «orvalho» é difícil quando considerado isoladamente; nesta enumeração de fenômenos atmosféricos, provavelmente designa umidade como o orvalho, e não um sentido não meteorológico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእይዎ
  choice: Observem
  rationale: O imperativo convoca coletivamente os ouvintes a contemplar a criação; «Observem» é natural, direto e preserva esse tom.
- source_word: ለሐጋይ ወለክረምት
  choice: o verão e o inverno
  rationale: Mantém o par sazonal expresso diretamente no ge'ez, sem substituí-lo por uma interpretação climática.
- source_word: ከመ
  choice: como
  rationale: Introduz aquilo que deve ser observado e conserva o caráter contemplativo da frase.
- source_word: ኵሉ ምድር
  choice: toda a terra
  rationale: A abrangência cósmica se ajusta ao contexto de observação da criação; «terra» é preferível a «região».
- source_word: መልአት ማየ
  choice: fica cheia de água
  rationale: Expressa de modo corrente o estado de plenitude indicado pelo predicado, preservando a imagem concreta da água.
- source_word: ወደመና
  choice: e nuvens
  rationale: Conserva o primeiro elemento da enumeração de fenômenos atmosféricos.
- source_word: ወጠለ
  choice: orvalho
  rationale: No contexto de água, nuvens e chuva, «orvalho» é o sentido meteorológico mais provável, embora o termo admita dificuldade lexical.
- source_word: ወዝናም
  choice: e chuva
  rationale: Equivalente direto e concreto do fenômeno meteorológico mencionado.
- source_word: ያዓርፍ ላዕሌሃ
  choice: repousam sobre ela
  rationale: Preserva a imagem de esses fenômenos assentarem ou permanecerem sobre a terra e mantém o registro elevado do texto.
theological_decisions: []
