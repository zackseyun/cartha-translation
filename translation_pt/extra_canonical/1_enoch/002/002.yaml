base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/002.yaml
  text: Look at the earth and understand concerning the works that are done upon it from the beginning to their completion[a], that none of the works of God changes[d][c][b], as they appear.
translation:
  language: pt
  text: Observem a terra e compreendam, a respeito das obras que nela se realizam desde o princípio até sua conclusão[a], que nenhuma das obras de Deus muda[b], conforme elas aparecem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O substantivo traduzido por “obras” está no singular com sentido coletivo, e o sufixo de “conclusão” também é singular; a expressão pode ser entendida como “a obra que nela se realiza, desde o princípio até sua conclusão”.
    reason: ambiguity
  - marker: b
    text: Literalmente, “toda obra de Deus não muda”; a expressão pode ser entendida coletiva ou distributivamente.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser traduzido por “enquanto elas aparecem” ou “enquanto se tornam visíveis”. O verbo tem sentido intransitivo ou passivo, não “enquanto ele as mostra”.
    reason: alternative_reading
lexical_decisions:
- source_word: ርእይዋ፡ ለምድር
  choice: Observem a terra
  rationale: O imperativo convoca os ouvintes a olhar atentamente. “Observem” é natural no português atual e preserva o caráter contemplativo do contexto; “terra” corresponde melhor ao cenário cósmico do que “território”.
- source_word: ወለብዉ
  choice: compreendam
  rationale: O verbo indica percepção refletida, passando da observação ao entendimento.
- source_word: በእንተ፡ ምግባር፡ ዘይትገበር፡ ላዕሌሃ
  choice: a respeito das obras que nela se realizam
  rationale: “Obras” mantém a ligação lexical com as “obras de Deus”; a formulação impessoal “se realizam” expressa o valor passivo sem introduzir um agente não explicitado.
- source_word: እምቀዳሚ፡ እስከ፡ ተፍጻሜቱ
  choice: desde o princípio até sua conclusão
  rationale: A expressão indica a totalidade do percurso. “Conclusão” preserva a ideia de acabamento ou consumação, em vez de simples cessação.
- source_word: ከመ፡ ኢይትመየጥ
  choice: que nenhuma ... muda
  rationale: A construção negativa é vertida de modo claro e natural, comunicando a constância observável sem ampliar a afirmação.
- source_word: ኵሉ፡ ምግባረ፡ ለአምላክ
  choice: nenhuma das obras de Deus
  rationale: A expressão singular com valor totalizante admite leitura distributiva ou coletiva. A negativa portuguesa “nenhuma ... muda” expressa naturalmente que cada obra permanece constante.
- source_word: እንዘ፡ ያስተርኢ
  choice: conforme elas aparecem
  rationale: O Ast-stem é intransitivo/passivo, com o sentido de “aparecer” ou “ser visto”, e não o ativo “mostrar”. “Conforme elas aparecem” também mantém o vínculo com a convocação inicial à observação.
theological_decisions:
- issue: Se o versículo afirma a imutabilidade absoluta de toda ação divina ou a regularidade observável da criação
  choice: Manter a afirmação sobre a constância das obras de Deus no contexto da observação da terra.
  alternative: Entender a frase como uma tese metafísica irrestrita de que Deus nunca altera coisa alguma, ou limitá-la apenas aos ciclos sazonais.
  rationale: O contexto imediato trata da observação da ordem criada. A tradução preserva a amplitude da frase “obras de Deus”, mas não importa uma formulação sistemática posterior nem a restringe além do que o texto diz.
- issue: Valor coletivo ou distributivo de ኵሉ ምግባረ ለአምላክ
  choice: “nenhuma das obras de Deus muda”
  alternative: “todas as obras de Deus não mudam” ou “cada obra de Deus não muda”
  rationale: A opção escolhida é idiomática em português e comunica a leitura distributiva, enquanto a nota registra a forma coletiva possível sem alterar a afirmação central.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com imperativos no plural (“observem”, “compreendam”). Evitaram-se tanto o arcaísmo “vede” quanto formulações excessivamente coloquiais. A repetição de “obras” preserva a coesão lexical do ge’ez.
