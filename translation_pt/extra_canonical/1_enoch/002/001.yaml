base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/001.yaml
  text: 'Consider all the works in heaven: how they do not alter their paths[a], and the lights in heaven, how all of them rise and set in order, each in its season[c][b], and do not transgress their appointed order.'
translation:
  language: pt
  text: 'Observem todas as obras que há no céu: como elas não mudam seus caminhos[a], e as luzes do céu, como todas nascem e se põem em ordem, cada uma em seu tempo, e não se desviam da ordem que lhes foi estabelecida[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não alteram seus percursos”. A expressão se refere aos trajetos fixos dos corpos celestes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não transgridem sua própria ordem”. “Ordem” também pode ser entendida como regra ou determinação estabelecida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ
  choice: Observem
  rationale: O imperativo plural convida os ouvintes a contemplar e refletir sobre a criação visível; “Observem” preserva essa força de modo natural em português.
- source_word: ግብረ
  choice: obras
  rationale: No contexto, designa as obras ou operações celestes; “obras” mantém a formulação concreta e elevada.
- source_word: ኢይመይጡ ፍናዊሆሙ
  choice: não mudam seus caminhos
  rationale: Conserva a imagem concreta dos trajetos fixos dos corpos celestes sem reduzir o sentido a uma explicação científica moderna.
- source_word: ብርሃናት
  choice: as luzes
  rationale: Refere-se aos luzeiros celestes, provavelmente sol, lua e estrelas; “luzes” é claro e permanece próximo do termo fonte.
- source_word: ይሠርቅ ወየዐርብ
  choice: nascem e se põem
  rationale: É a expressão portuguesa corrente para o aparecimento e ocaso regulares dos astros.
- source_word: ሥሩዕ
  choice: em ordem
  rationale: Expressa regularidade ordenada, e não apenas sucessão temporal.
- source_word: በበዘመኑ
  choice: cada uma em seu tempo
  rationale: Reproduz o valor distributivo e temporal sem restringir indevidamente ዘመን ao sentido moderno de estação do ano.
- source_word: ኢይትኀደዉ እምሥርዓቶሙ
  choice: não se desviam da ordem que lhes foi estabelecida
  rationale: O verbo com a preposição እም favorece a ideia de afastar-se de uma ordem; a formulação preserva tanto a regularidade cósmica quanto a noção de uma disposição fixada.
theological_decisions:
- issue: Regularidade celeste em linguagem meramente descritiva ou com ressonância normativa
  choice: não se desviam da ordem que lhes foi estabelecida
  alternative: não transgridem sua ordem
  rationale: A escolha mantém a imagem de criação obediente a uma ordem fixada, mas evita impor em português uma conotação moral mais explícita do que a construção etíope exige. A alternativa mais jurídica permanece registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com imperativo plural de alcance amplo. “Luzes do céu” mantém a imagem antiga; “cada uma” concorda naturalmente com “luzes”. A pontuação conserva a estrutura contemplativa do texto sem torná-la excessivamente pesada.
