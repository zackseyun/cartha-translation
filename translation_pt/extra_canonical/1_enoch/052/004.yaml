base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/004.yaml
  text: And he said to me[a], “All these that you have seen will belong to the dominion of his Anointed One[c][b], so that he may command and be mighty upon the earth.”
translation:
  language: pt
  text: 'E ele me disse: “Todas estas coisas que você viu ficarão sob o domínio do seu Ungido[a], para que ele dê ordens e exerça poder[b] sobre a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu Messias”. O termo ge’ez significa “Ungido” e traz o sufixo possessivo “seu”.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “seja poderoso” ou “prevaleça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: E ele me disse
  rationale: Preserva a fórmula narrativa direta do ge’ez em português natural.
- source_word: እሉ፡ ኵሎሙ፡ ዘርኢከ
  choice: Todas estas coisas que você viu
  rationale: Mantém a referência demonstrativa e totalizante aos objetos anteriormente vistos na visão.
- source_word: ለስልጣነ፡ መሲሑ፡ እሙንቱ፡ ይከውኑ
  choice: ficarão sob o domínio do seu Ungido
  rationale: Expressa de modo idiomático que as coisas vistas estarão sujeitas à autoridade governante; “seu” preserva o sufixo possessivo de መሲሑ, e “Ungido” traduz o título.
- source_word: ከመ፡ ይእዝዝ
  choice: para que ele dê ordens
  rationale: Conserva o sentido específico de ordenar ou comandar, sem ampliá-lo simplesmente para “governar”.
- source_word: ወይትኃየል
  choice: e exerça poder
  rationale: Comunica em português corrente a força verbal ligada a poder e vigor, preservando alternativas como “prevaleça”.
- source_word: ዲበ፡ ምድር
  choice: sobre a terra
  rationale: Preserva tanto a dimensão espacial quanto a possível nuance de autoridade exercida sobre a terra.
theological_decisions:
- issue: O título መሲሑ e seu sufixo possessivo
  choice: seu Ungido
  alternative: seu Messias
  rationale: “Ungido” traduz o título em vez de apenas transliterá-lo, enquanto “seu” conserva a ligação possessiva marcada no ge’ez sem identificar explicitamente o referente além do texto.
- issue: Relação entre as coisas vistas e o governo do Ungido
  choice: ficarão sob o domínio do seu Ungido
  alternative: pertencerão ao domínio do seu Ungido
  rationale: A formulação expressa sujeição à autoridade sem transformar necessariamente a relação em propriedade material.
- issue: Sentido de ይትኃየል
  choice: exerça poder
  alternative: prevaleça
  rationale: Mantém a ênfase no poder efetivo do Ungido, ao mesmo tempo que a nota registra a possível nuance de prevalecer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” evita a artificialidade regional de “tu” para o público internacional contemporâneo; “dê ordens” e “exerça poder” preservam o tom régio e visionário sem arcaísmo excessivo.
