base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/002.yaml
  text: 'There my eyes saw all the hidden things of heaven that are to come: a mountain of iron[a], and a mountain of copper, and a mountain of silver, and a mountain of gold, and a mountain of soft metal[b], and a mountain of lead.'
translation:
  language: pt
  text: 'Ali meus olhos viram todas as coisas ocultas do céu que hão de vir[a]: uma montanha de ferro, uma montanha de cobre, uma montanha de prata, uma montanha de ouro, uma montanha de metal macio[b] e uma montanha de chumbo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “que hão de vir” é difícil. Também pode ser entendida de modo mais estático como “que estavam ali” ou “que existem no céu”.
    reason: alternative_reading
  - marker: b
    text: O quinto termo referente a metal é incerto. Pode designar um metal macio ou uma liga metálica; alguns o identificam mais especificamente como estanho ou electro.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: Ali
  rationale: Advérbio locativo que introduz a cena visionária; “Ali” é natural e conserva a referência espacial.
- source_word: ርእዩ አዕይንትየ
  choice: meus olhos viram
  rationale: Mantém a menção explícita aos olhos do visionário, preservando a vivacidade da formulação em geês.
- source_word: ኵሎ ኅቡኣተ ሰማይ
  choice: todas as coisas ocultas do céu
  rationale: Expressa o sentido de coisas escondidas ou encobertas sem impor o valor técnico que “mistérios” poderia adquirir.
- source_word: ዘይኩን ሀሎ
  choice: que hão de vir
  rationale: Conserva a orientação futura e o tom profético sugeridos pelo contexto apocalíptico, sem esconder em nota a dificuldade gramatical da expressão.
- source_word: ደብረ
  choice: uma montanha de
  rationale: A repetição diante de cada material preserva o ritmo solene do catálogo visionário.
- source_word: ኃጺን
  choice: ferro
  rationale: Equivalente usual do metal indicado.
- source_word: ጸሪቅ
  choice: cobre
  rationale: O termo pode abranger cobre ou liga de cobre; “cobre” é a identificação básica menos específica.
- source_word: ብሩር
  choice: prata
  rationale: Equivalente usual do metal indicado.
- source_word: ወርቅ
  choice: ouro
  rationale: Equivalente usual do metal indicado.
- source_word: ነጠብጣብ
  choice: metal macio
  rationale: A identificação exata é incerta; a expressão genérica evita afirmar sem segurança que se trata de estanho ou electro.
- source_word: ዐረር
  choice: chumbo
  rationale: Equivalente usual, coerente com a sequência de metais.
theological_decisions:
- issue: Se as coisas ocultas celestes são realidades futuras ou coisas já existentes no céu
  choice: 'Leitura orientada para o futuro: “as coisas ocultas do céu que hão de vir”'
  alternative: “as coisas ocultas do céu que estavam ali” ou “as coisas ocultas que existem no céu”
  rationale: O contexto de revelação apocalíptica favorece a orientação futura, mas a expressão em geês é difícil; a nota mantém visível a leitura estática possível, sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva “meus olhos” e a repetição de “uma montanha de” para manter a vivacidade e o ritmo da visão, enquanto as incertezas textuais e lexicais permanecem explícitas nas notas.
