base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/006.yaml
  text: And those mountains that your eyes saw—the mountain of iron, and the mountain of copper, and the mountain of silver, and the mountain of gold, and the mountain of soft metal, and the mountain of lead—all these will be before the Chosen One like wax before the fire, and like water that runs down from above upon those mountains; and they will become weak before his feet.
translation:
  language: pt
  text: E aqueles montes que os teus olhos viram — o monte de ferro, o monte de cobre, o monte de prata, o monte de ouro, o monte de metal macio[a] e o monte de chumbo — todos eles serão, diante do Escolhido[b], como cera diante do fogo e como água que desce do alto sobre aqueles montes; e perderão as forças diante dos pés dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação exata deste quinto metal é incerta no texto etíope; entre as possibilidades propostas está o estanho ou outro metal mais macio.
    reason: lexical_alternative
  - marker: b
    text: Ou “o Eleito”. A expressão é um título importante nas Parábolas de Enoque.
    reason: lexical_alternative
lexical_decisions:
- source_word: አድባር
  choice: montes
  rationale: O plural designa grandes elevações na cena visionária; “montes” conserva a escala apocalíptica e soa natural em português bíblico contemporâneo.
- source_word: ኃጺን
  choice: ferro
  rationale: Termo direto para o material, mantido literalmente na sequência.
- source_word: ጸሪቅ
  choice: cobre
  rationale: Embora possa designar cobre ou uma liga de cobre, “cobre” é a opção mais ampla e menos interpretativa.
- source_word: ብሩር
  choice: prata
  rationale: Equivalente habitual do metal precioso.
- source_word: ወርቅ
  choice: ouro
  rationale: Equivalente habitual do metal precioso.
- source_word: ነጠብጣብ
  choice: metal macio
  rationale: A identificação exata é incerta; a expressão genérica preserva essa incerteza sem impor “estanho” ou outro metal específico.
- source_word: ዐረር
  choice: chumbo
  rationale: É a identificação mais bem sustentada no contexto da lista de metais.
- source_word: ለኅሩይ
  choice: o Escolhido
  rationale: A expressão funciona como título nas Parábolas; a inicial maiúscula assinala esse uso sem importar formulações posteriores.
- source_word: መዓረ፡ ግራ፡
  choice: cera
  rationale: Preserva de modo natural a imagem da substância que cede e derrete diante do fogo.
- source_word: ዘይወርድ፡ እምላዕሉ
  choice: que desce do alto
  rationale: Mantém o movimento descendente da imagem com formulação clara e digna.
- source_word: ድኩማነ
  choice: perderão as forças
  rationale: Expressa perda de vigor e incapacidade de resistir sem tornar explícito um desmoronamento físico que o termo não exige.
theological_decisions:
- issue: Tradução de ለኅሩይ nas Parábolas
  choice: o Escolhido
  alternative: o Eleito
  rationale: “O Escolhido” preserva o título enóquico local e evita harmonizá-lo automaticamente com terminologia teológica posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O período conserva a enumeração solene e as duas comparações do original, com vocabulário corrente e registro bíblico digno.
