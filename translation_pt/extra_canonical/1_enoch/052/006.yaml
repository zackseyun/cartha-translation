  to: E aqueles montes que os teus olhos viram — o monte de ferro, o monte de cobre, o monte de prata, o monte de ouro, o monte de metal macio[a] e o monte de chumbo — todos eles serão, diante do Escolhido[b], como cera diante do fogo e como água que desce do alto sobre aqueles montes; e perderão as forças diante dos pés dele.
