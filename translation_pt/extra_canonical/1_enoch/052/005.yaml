base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/005.yaml
  text: And that angel of peace answered[a], saying to me, 'Wait a little[c][b], and every hidden thing that the Lord of Spirits has enclosed will be revealed to you.'
translation:
  language: pt
  text: 'E aquele anjo da paz respondeu-me, dizendo: “Espere um pouco[a], e tudo o que está oculto e que o Senhor dos Espíritos encerrou[b] lhe será revelado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenha paciência por um tempo” ou “Permaneça um pouco”; o imperativo ge''ez pode indicar esperar, permanecer ou ter paciência.'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “encerrou” também pode ser entendido como “fechou” ou “manteve oculto”, ressaltando que essas realidades permanecem sob o controle do Senhor dos Espíritos até serem reveladas.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: respondeu
  rationale: Preserva o sentido narrativo e dialógico comum do verbo ge'ez, em vez do mais genérico “falou”.
- source_word: እንዘ ይብለኒ
  choice: dizendo
  rationale: Representa com naturalidade em português a construção idiomática de resposta seguida de fala dirigida ao vidente.
- source_word: መልአከ ሰላም
  choice: anjo da paz
  rationale: Mantém a construção genitiva e a designação enoquiana reconhecível, sem convertê-la em qualidade adjetival.
- source_word: ጽናሕ ንስቲተ
  choice: Espere um pouco
  rationale: Expressa a ordem de permanecer ou aguardar por breve tempo em português corrente e digno.
- source_word: ይትከሠት
  choice: será revelado
  rationale: Conserva o registro apocalíptico de manifestação daquilo que estava escondido.
- source_word: ኵሉ ዘኅቡእ
  choice: tudo o que está oculto
  rationale: Reproduz a abrangência e a indefinição da expressão com formulação natural em português.
- source_word: ዘከለለ
  choice: encerrou
  rationale: Mantém a imagem de algo fechado ou contido sob controle divino, sem especificar indevidamente que foi selado ou reservado.
- source_word: እግዚአ መናፈስት
  choice: Senhor dos Espíritos
  rationale: Preserva de modo consistente o título divino característico das Parábolas de Enoque.
theological_decisions:
- issue: Título divino እግዚአ መናፈስት
  choice: Senhor dos Espíritos
  alternative: Senhor dos espíritos
  rationale: A capitalização de “Espíritos” sinaliza que se trata de um título divino formulaico e distintivo, sem determinar além do texto a identidade dos espíritos.
- issue: Agência e tempo da revelação
  choice: 'voz passiva: “lhe será revelado”'
  alternative: “ele lhe revelará”
  rationale: A voz passiva preserva a formulação do texto e evita explicitar um agente imediato que a fonte não nomeia na oração.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A fala mantém solenidade moderada; “lhe será revelado” evita regionalismo marcado e conserva o tom apocalíptico. A construção “respondeu, dizendo” reflete o idioma narrativo sem reproduzir de modo rígido a sintaxe ge'ez.
