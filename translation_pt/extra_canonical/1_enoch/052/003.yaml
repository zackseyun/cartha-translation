base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/003.yaml
  text: And I asked the angel who went with me[a], saying, “What are these things that I have seen in secret?”
translation:
  language: pt
  text: 'Então perguntei ao anjo que ia comigo: “O que são estas coisas que vi em segredo[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “secretamente” ou “num lugar oculto”. A expressão em ge'ez indica algo escondido, mas não é inteiramente certo se descreve o lugar, a maneira de ver ou o caráter oculto das coisas vistas.
    reason: alternativa lexical e ambiguidade sintática
lexical_decisions:
- source_word: ተስእልክዎ
  choice: perguntei
  rationale: O verbo expressa perguntar ou indagar; “perguntei” é natural e digno no contexto narrativo.
- source_word: መልአክ
  choice: anjo
  rationale: No contexto apocalíptico, trata-se de um ser celestial, e não meramente de um mensageiro humano.
- source_word: ዘምስሌየ የሐውር
  choice: que ia comigo
  rationale: A oração identifica o anjo que acompanhava o vidente; o imperfeito comunica esse acompanhamento em curso de modo natural em português.
- source_word: እንዘ እብል
  choice: ':'
  rationale: A construção introduz a fala. Em português atual, os dois-pontos desempenham essa função com mais naturalidade do que o particípio “dizendo”.
- source_word: ምንት ውእቱ … እሙንቱ እሉ እለ
  choice: O que são estas coisas
  rationale: Embora parte da expressão tenha aparência singular, os demonstrativos e o referente contextual apontam para vários objetos; a formulação mantém a pergunta clara sem especificar sua natureza.
- source_word: በኅቡእ
  choice: em segredo
  rationale: A expressão indica ocultação ou segredo, mas pode qualificar o lugar, a maneira de ver ou a natureza oculta das coisas vistas; a tradução principal conserva essa abertura.
- source_word: ርኢኩ
  choice: vi
  rationale: O pretérito perfeito é a forma idiomática em português para a visão anterior que motiva a pergunta presente.
theological_decisions:
- issue: Sentido de በኅቡእ na visão apocalíptica
  choice: em segredo
  alternative: secretamente; num lugar oculto; ocultas
  rationale: A redação preserva o motivo de realidades escondidas que são reveladas, sem decidir se a ocultação diz respeito ao lugar, ao modo de ver ou às próprias coisas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala é introduzida por dois-pontos para evitar uma construção participial rígida; a ambiguidade de በኅቡእ é preservada por nota.
