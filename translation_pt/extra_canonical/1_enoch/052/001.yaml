base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/001.yaml
  text: And after those days[a], in that place where I had seen all the visions of what is hidden, for I had been snatched up by a whirlwind[c][b], and it had carried me westward—
translation:
  language: pt
  text: E depois daqueles dias, naquele lugar onde eu tinha visto todas as visões do que está oculto[a], pois eu havia sido arrebatado por um redemoinho[b], e ele me havia levado para o ocidente[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as visões ocultas”. A construção ge’ez pode ser entendida como “visões do que está oculto” ou “visões ocultas”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por um redemoinho de vento”, expressão enfática que descreve um transporte impetuoso pelo vento.
    reason: cultural_note
  - marker: c
    text: 'Ou: “para o oeste”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ እማንቱ መዋዕል
  choice: depois daqueles dias
  rationale: Preserva a fórmula temporal e a distância dêitica de እማንቱ, em português natural.
- source_word: በውእቱ መካን
  choice: naquele lugar
  rationale: Mantém concreta a referência espacial do cenário visionário.
- source_word: ርኢኩ ኵሎ ራእያተ ዘበኅቡእ
  choice: eu tinha visto todas as visões do que está oculto
  rationale: Conserva a possível referência a realidades ocultas sem eliminar a alternativa sintática de 'visões ocultas'.
- source_word: ተመሠጥኩ
  choice: eu havia sido arrebatado
  rationale: Expressa remoção súbita e poderosa; não determina se o transporte foi corporal ou extático.
- source_word: በአውሎጋኒ ነፋስ
  choice: por um redemoinho
  rationale: Reproduz de modo idiomático em português a imagem de vento violento; a expressão etíope enfática é esclarecida em nota.
- source_word: ወወሰደኒ ዓረበ
  choice: e ele me havia levado para o ocidente
  rationale: Toma ዓረበ em sentido direcional e explicita naturalmente que o redemoinho é o agente do deslocamento.
- source_word: እስመ
  choice: pois
  rationale: Preserva a conjunção causal que introduz a explicação de como Enoque chegou ao lugar.
theological_decisions:
- issue: Natureza do transporte visionário
  choice: eu havia sido arrebatado por um redemoinho
  alternative: eu havia sido tomado pelo espírito do vento
  rationale: A formulação mantém a imagem de transporte impetuoso pelo vento, sem decidir se a experiência foi corporal, espiritual ou extática.
- issue: Relação sintática com o versículo seguinte
  choice: oração de ambientação deixada em continuidade, marcada por travessões
  alternative: encerrar o versículo como uma frase independente
  rationale: O texto etíope funciona como preparação para a ação seguinte; a pontuação preserva esse caráter suspenso sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução mantém a conjunção causal, a ambiguidade das visões ocultas e o caráter não resolvido do transporte visionário. Os travessões sinalizam a explicação parentética e a continuidade sintática com o versículo seguinte.
