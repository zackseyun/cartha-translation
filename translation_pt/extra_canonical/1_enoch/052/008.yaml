  text: And iron shall not be for war[a].
translation:
  language: pt
  text: E o ferro não será para a guerra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez é muito breve; literalmente, “e o ferro não será para a guerra”. O sentido provável é que o ferro deixará de ser usado na guerra.
    reason: alternativa lexical e esclarecimento da construção concisa
lexical_decisions:
- source_word: ወኢይከውን
  choice: E ... não será
  rationale: A conjunção ወ com o imperfeito negado ኢይከውን expressa aqui um sentido futuro e preserva a cadência breve, profética e apocalíptica da frase.
- source_word: ኃጺን
  choice: ferro
  rationale: O substantivo designa diretamente ferro; não há necessidade de ampliar o sentido para metal em geral.
- source_word: ለፀብእ
  choice: para a guerra
  rationale: A preposição ለ indica finalidade ou uso, e o substantivo se refere a guerra ou combate. A formulação concisa mantém a construção ambígua do ge'ez sem inserir explicitamente a ideia de uso.
theological_decisions:
- issue: Alcance da negação na breve oração em ge'ez
  choice: 'Manter a formulação literal e funcional: “o ferro não será para a guerra”'
  alternative: “O ferro não será mais usado na guerra” ou “não haverá ferro”
  rationale: A expressão ለፀብእ favorece a ideia de finalidade bélica, não necessariamente o desaparecimento do ferro. Contudo, a tradução principal preserva a concisão e a tensão do original, enquanto a nota esclarece o sentido provável sem torná-lo definitivo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem simples e a expressão “para a guerra” preservam a concisão e a ambiguidade genuína do ge'ez.
