base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/007.yaml
  text: And in those days they will not be saved by gold or by silver[b][a], nor will they be able to flee.
translation:
  language: pt
  text: E naqueles dias eles não serão salvos pelo ouro nem pela prata[a], nem poderão fugir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “não ficarão a salvo por meio do ouro nem da prata”. O verbo ge''ez tem o sentido de ficar a salvo, escapar ou ser salvo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን
  choice: E ...
  rationale: A fórmula introdutória apocalíptica é incorporada naturalmente à expressão temporal, sem perder a continuidade narrativa.
- source_word: በእማንቱ፡ መዋዕል
  choice: naqueles dias
  rationale: Preserva a fórmula temporal profética recorrente e mantém um registro elevado, mas claro.
- source_word: ኢይድኅኑ
  choice: eles não serão salvos
  rationale: O verbo está no tema básico e tem sentido intransitivo, como 'ficar a salvo', 'escapar' ou 'ser salvo'; por isso, a forma passiva portuguesa representa melhor o ge'ez que a leitura reflexiva 'salvar a si mesmos'.
- source_word: እበወርቅ
  choice: pelo ouro
  rationale: A preposição indica meio ou instrumento; 'pelo ouro' expressa que a riqueza não servirá de meio de livramento.
- source_word: ወእበብሩር
  choice: nem pela prata
  rationale: Embora a conjunção seja formalmente aditiva, em português a coordenação negativa idiomática pede 'nem', preservando o sentido de ambos os meios negados.
- source_word: ወኢይክሉ
  choice: nem poderão
  rationale: Mantém o paralelismo negativo e a perspectiva futura do juízo.
- source_word: ጐይየ
  choice: fugir
  rationale: Conserva a imagem concreta de pôr-se em fuga, em vez de substituí-la pelo conceito mais geral de escapar.
theological_decisions:
- issue: Natureza do livramento que fracassa
  choice: O ouro e a prata não poderão pô-los a salvo do juízo.
  alternative: Eles não poderão salvar a si mesmos por meio do ouro e da prata.
  rationale: O contexto trata da incapacidade da riqueza de proporcionar livramento diante do juízo. A tradução 'não serão salvos' respeita o valor intransitivo do tema verbal sem impor um sentido doutrinário posterior de salvação espiritual.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. A construção conserva a ambiguidade entre ser salvo e ficar a salvo, enquanto evita a leitura reflexiva menos adequada ao tema verbal ge'ez.
