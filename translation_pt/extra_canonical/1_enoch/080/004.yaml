base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/004.yaml
  text: And the moon will alter its order[c][b][a], and it will not appear in its season.
translation:
  language: pt
  text: E a lua[a] mudará sua ordem[b] e não aparecerá no seu tempo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo ge’ez também pode significar “mês”; aqui, o contexto dos astros favorece “lua”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seu curso” ou “seu padrão estabelecido”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não será vista no seu tempo”. A frase pode enfatizar sua visibilidade no tempo próprio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኅ
  choice: a lua
  rationale: O termo pode significar “lua” ou “mês”, mas o contexto dos astros e a referência à visibilidade favorecem “lua”.
- source_word: ይዌልጥ
  choice: mudará
  rationale: Expressa mudança ou alteração e comunica, sem explicar além do texto, o desvio de um padrão estabelecido.
- source_word: ሥርዓቶ
  choice: sua ordem
  rationale: Designa uma disposição, norma ou padrão ordenado; “ordem” preserva tanto o sentido astronômico quanto a dimensão de regularidade cósmica.
- source_word: ወኢይትረአይ
  choice: e não aparecerá
  rationale: A forma verbal diz respeito a ser visto ou tornar-se visível; “não aparecerá” é natural para um corpo celeste e mantém o sentido visual.
- source_word: በዘመኑ ዚአሁ
  choice: no seu tempo
  rationale: Reproduz de modo conciso o sentido literal de “em seu próprio tempo”, sem acrescentar a ideia explícita de que esse tempo foi “designado” e preservando a repetição do contexto.
theological_decisions:
- issue: Se a alteração deve ser apresentada apenas como irregularidade astronômica ou como ruptura da ordem cósmica estabelecida
  choice: A lua “mudará sua ordem” e não aparecerá “no seu tempo”.
  alternative: Explicitar que a lua rompe uma ordem divinamente estabelecida, ou limitar a frase a uma mudança de fase ou de calendário.
  rationale: 'A formulação conserva a tensão do texto: há uma ordem regular que será alterada, mas o versículo não identifica expressamente sua causa nem define a mudança como simples variação de fase ou do cálculo do mês.'
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “No seu tempo” evita acrescentar “designado” ao ge’ez e preserva a repetição contextual; “ordem” mantém deliberadamente aberta a relação entre curso astronômico e ordem cósmica.
