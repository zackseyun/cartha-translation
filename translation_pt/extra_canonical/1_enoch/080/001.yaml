base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/001.yaml
  text: And in those days Uriel the angel answered me and said to me[a], “Behold, I have shown you everything, Enoch, and I have revealed everything to you, that you may look upon this sun and this moon and those who lead the stars of heaven[c][b], and all those who turn them—their works and their times and their risings.”
translation:
  language: pt
  text: 'Naqueles dias, o anjo Uriel me respondeu[a] e disse: “Eis que mostrei tudo a você, Enoque, e tudo lhe revelei, para que contemple este sol, esta lua, aqueles que conduzem[b] as estrelas do céu e todos os que as fazem girar — suas obras, seus tempos e seus ocasos.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “falou comigo”. O verbo normalmente significa “responder”, embora nenhuma pergunta apareça neste versículo.
    reason: lexical_alternative
  - marker: b
    text: Ou “guiam”. A formulação apresenta agentes pessoais dirigindo as estrelas, sem especificar aqui quem são eles.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “suas entradas”. No quadro astronômico de 1 Enoque, trata-se da entrada dos luminares nos portais ocidentais, isto é, de seus poentes ou ocasos.
    reason: source_clarification
lexical_decisions:
- source_word: አውሥአኒ
  choice: me respondeu
  rationale: Preserva o sentido comum de responder, mesmo sem haver pergunta explícita neste versículo, mantendo a textura discursiva da instrução angelical.
- source_word: ነዋ
  choice: Eis que
  rationale: Partícula de chamada de atenção vertida em registro bíblico digno, ainda compreensível no português moderno.
- source_word: አርአይኩከ
  choice: mostrei tudo a você
  rationale: Expressa diretamente o valor causativo visual do verbo e a revelação já realizada.
- source_word: ከሠትኩ ለከ
  choice: tudo lhe revelei
  rationale: Mantém a ideia de desvelamento própria do contexto apocalíptico e reproduz a repetição de “tudo” presente no texto-fonte.
- source_word: ትርአዮ
  choice: para que contemple
  rationale: Conserva a relação de finalidade e o tom visionário sem limitar a expressão à visão física casual.
- source_word: ይመርኅዎሙ
  choice: conduzem
  rationale: Traduz a ação de guiar ou dirigir e preserva a formulação pessoal do texto, sem substituí-la por leis astronômicas impessoais.
- source_word: ከዋክብተ ሰማይ
  choice: as estrelas do céu
  rationale: Equivalente direto da construção genitiva, com registro bíblico natural em português.
- source_word: ይመይጥዎሙ
  choice: as fazem girar
  rationale: Comunica a ação causadora sobre o movimento dos astros sem impor uma descrição orbital moderna.
- source_word: ግብሮሙ
  choice: suas obras
  rationale: Preserva a amplitude de “obras”, embora no contexto possa indicar funções ou operações.
- source_word: አዝማኖሙ
  choice: seus tempos
  rationale: Tradução direta que mantém aberta a possibilidade de tempos, épocas ou períodos determinados.
- source_word: ሙባኢሆሙ
  choice: seus ocasos
  rationale: O substantivo deriva da ideia de entrar; no sistema astronômico de 1 Enoque, refere-se à entrada dos luminares nos portais ocidentais, isto é, ao seu poente ou ocaso, e não ao nascer.
theological_decisions:
- issue: Identidade dos agentes ligados aos corpos celestes
  choice: 'Manter construções pessoais: “aqueles que conduzem” e “todos os que as fazem girar”.'
  alternative: Verter como leis, forças ou movimentos impessoais dos astros.
  rationale: O ge'ez emprega construções relativas pessoais. A tradução conserva a visão cosmológica apocalíptica sem definir além do texto a natureza ou a hierarquia desses agentes.
- issue: Sentido astronômico de ሙባኢሆሙ
  choice: “seus ocasos”
  alternative: “suas entradas” ou “seus poentes”; não “seus nascimentos”.
  rationale: A imagem é a da entrada dos luminares nos portais do ocidente. “Ocasos” comunica o referente astronômico em português, enquanto a nota preserva a metáfora concreta da entrada.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve elevação bíblico-apocalíptica. Emprega “Eis que” para a chamada de atenção e construções naturais como “mostrei tudo a você”; evita arcaísmos pronominais e não moderniza a cosmologia do texto.
