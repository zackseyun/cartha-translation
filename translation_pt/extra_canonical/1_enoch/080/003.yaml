base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/003.yaml
  text: And in those times the fruit of the earth will be delayed[a], and it will not sprout in its season[d][c][b]; and the fruit of the trees will be withheld in its season.
translation:
  language: pt
  text: Naqueles tempos, o fruto da terra virá tarde[a] e não brotará na sua estação[b]; e o fruto das árvores será retido na sua própria estação[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será tardio” ou “será atrasado”. O ge''ez ressalta que o fruto aparecerá depois do tempo devido.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “no seu tempo”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “será impedido em sua própria estação”. A expressão destaca que o fruto é detido justamente no tempo determinado para aparecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አዝማን
  choice: tempos
  rationale: Mantém a referência temporal ampla e apocalíptica, sem restringi-la a dias ou estações agrícolas.
- source_word: ፍሬ፡ ምድር
  choice: o fruto da terra
  rationale: Preserva a imagem agrícola concreta e a construção do ge'ez.
- source_word: ደሓራዊ፡ ይከውን
  choice: virá tarde
  rationale: Expressa diretamente que o fruto aparecerá depois do tempo esperado, preservando a ideia adjetiva de atraso.
- source_word: ወኢይበቍል
  choice: e não brotará
  rationale: O verbo indica brotar ou lançar rebentos; a opção conserva a imagem do crescimento esperado que não ocorre.
- source_word: በዘመኑ
  choice: na sua estação
  rationale: Representa o tempo agrícola próprio do fruto, com o sufixo singular ligado ao coletivo precedente.
- source_word: ፍሬ፡ ዕፅ
  choice: o fruto das árvores
  rationale: Neste contexto agrícola, 'árvores' comunica com clareza o sentido contextual de ዕፅ.
- source_word: ይትከላእ
  choice: será retido
  rationale: Conserva a ideia passiva de algo impedido ou detido, sem especificar uma causa não declarada.
- source_word: በዘመኑ፡ ዚአሁ
  choice: na sua própria estação
  rationale: O possessivo enfático ዚአሁ destaca o tempo próprio e determinado do fruto; 'própria' preserva essa ênfase.
theological_decisions:
- issue: Natureza do sinal de juízo
  choice: Manter literalmente a desordem agrícola e sazonal como imagem apocalíptica concreta.
  alternative: Interpretar a linguagem apenas como metáfora de decadência moral ou como simples relato de uma colheita ruim.
  rationale: O contexto do Livro Astronômico apresenta a ruptura da fertilidade e dos tempos regulares como sinal apocalíptico; a tradução não deve transformar essa imagem em abstração.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “estação” conserva o destaque do texto sobre a ruptura dos ciclos agrícolas, e “sua própria” reproduz a ênfase possessiva da cláusula final.
