base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/002.yaml
  text: And in the days of the sinners the years shall be shortened, and their seed shall be late upon their land and in their fields; and all the works that are on the earth shall change and shall not appear in their times, and the rain shall be withheld, and heaven shall hold back.
translation:
  language: pt
  text: E, nos dias dos pecadores, os anos serão abreviados, e a semente deles tardará em sua terra e em seus campos.[a] Todas as obras sobre a terra mudarão e não aparecerão em seus tempos;[b][c] a chuva será retida, e o céu a reterá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a descendência deles será retardada”. O termo ge'ez traduzido por “semente” pode referir-se tanto a descendentes quanto a semente ou produção agrícola neste contexto.
    reason: lexical_alternative
  - marker: b
    text: 'A frase retrata uma desordem cósmica e agrícola: aquilo que deveria aparecer em sua estação própria deixa de fazê-lo.'
    reason: cultural_note
  - marker: c
    text: Ou “toda obra que há sobre a terra mudará e não aparecerá em seu tempo”.
    reason: previous_rendering
lexical_decisions:
- source_word: መዋዕለ፡ ኃጥኣን
  choice: dias dos pecadores
  rationale: Preserva a fórmula apocalíptica temporal e o sentido moral e judicial do substantivo.
- source_word: ክረማት፡ የኀጽሩ
  choice: os anos serão abreviados
  rationale: Representa a alteração do ciclo anual e mantém a forma passiva e a imagem de tempo reduzido.
- source_word: ዘርአ፡ ዚአሆሙ
  choice: a semente deles
  rationale: Mantém a ambiguidade do termo, que pode indicar tanto descendência quanto semente ou produção agrícola.
- source_word: ዳኃራዊ
  choice: tardará
  rationale: Expressa atraso de modo natural em português, sem definir se o referente é descendência ou cultivo.
- source_word: በምድረሙ፡ ወበወፍሮሙ
  choice: em sua terra e em seus campos
  rationale: Conserva o paralelismo agrícola entre terra e área cultivada.
- source_word: ኵሉ፡ ግብር፡ ዘዲበ፡ ምድር
  choice: todas as obras sobre a terra
  rationale: A formulação ampla evita limitar o sentido a atos humanos e permite conservar naturalmente o plural da frase seguinte.
- source_word: ይትመየጥ፡ ወኢያስተርኢ፡ ለአዝማኖሙ
  choice: mudarão e não aparecerão em seus tempos
  rationale: Preserva tanto a ideia de alteração quanto o plural explícito de 'tempos', ligado à desordem dos ciclos próprios.
- source_word: ዝናም፡ ይትከላእ
  choice: a chuva será retida
  rationale: Comunica diretamente a cessação da chuva sem acrescentar uma causa não expressa.
- source_word: ወሰማይ፡ ታቀውም
  choice: e o céu a reterá
  rationale: Torna explícito em português o objeto recuperável pelo contexto imediato, mantendo o céu como sujeito da ação final.
theological_decisions:
- issue: Sentido de 'semente deles' no contexto de desordem agrícola
  choice: semente deles
  alternative: descendência deles; sua produção
  rationale: O contexto de terra, campos, ciclos e chuva favorece uma leitura agrícola, mas o vocábulo também pode referir-se a descendentes; a tradução conserva essa tensão.
- issue: Agente da retenção da chuva
  choice: não explicitar um agente divino
  alternative: Deus reterá a chuva
  rationale: Embora o passivo possa sugerir ação divina, o texto não nomeia Deus nesta oração; a tradução evita acrescentar uma identificação teológica.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação e o paralelismo do ge'ez foram preservados sem tornar a frase excessivamente literal.
