base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/007/001.yaml
  text: And all the others with them took wives for themselves[a], and each chose one for himself.
translation:
  language: pt
  text: E todos os demais que estavam com eles tomaram mulheres para si[a], e cada um escolheu uma para si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esposas”. O substantivo ge''ez pode designar mulheres em geral, mas, nesta construção, frequentemente tem o sentido de mulheres tomadas como esposas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ባዕዳን
  choice: os demais
  rationale: No contexto, refere-se aos membros restantes do grupo já mencionado; “os demais” expressa naturalmente essa referência coletiva.
- source_word: ኵሉ
  choice: todos
  rationale: Preserva a abrangência do termo, indicando que todo o restante do grupo participou da ação.
- source_word: ምስሌሆሙ
  choice: que estavam com eles
  rationale: Expressa a associação ou companhia indicada pelo ge'ez de modo claro e natural em português.
- source_word: ነሥኡ ሎሙ አንስተ
  choice: tomaram para si mulheres como esposas
  rationale: Preserva tanto o sentido básico de “mulheres” quanto o valor conjugal da construção, além da força reflexiva de ሎሙ.
- source_word: ኃረዩ
  choice: escolheu
  rationale: Verbo simples de escolha deliberada; o singular concorda com a construção distributiva seguinte.
- source_word: ለለ ርእሱ አሐተ
  choice: cada um escolheu uma para si
  rationale: Mantém o caráter distributivo e reflexivo da frase, inclusive a indicação de uma única mulher para cada membro do grupo.
theological_decisions:
- issue: Se አንስተ deve ser traduzido como “mulheres” ou “esposas”
  choice: mulheres como esposas
  alternative: esposas; mulheres
  rationale: A formulação conserva a referência lexical a mulheres e torna explícito o sentido conjugal assumido pela construção, sem legitimar moralmente essas uniões nem eliminar a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi ajustada à sintaxe natural do português sem perder a abrangência, a reflexividade e a distribuição individual do original.
