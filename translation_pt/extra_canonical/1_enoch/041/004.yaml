base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/004.yaml
  text: And there I saw the storehouses of the lightning[a], and from them are apportioned the wind from the storehouse of hail, and the wind from the storehouse of mist[d][c][b], and the cloud and its cloud remain over the earth from before the world.
translation:
  language: pt
  text: Ali vi os depósitos dos relâmpagos, e deles são distribuídos o vento do depósito do granizo e o vento do depósito da névoa[a], e aquele da nuvem; e sua nuvem permanece sobre a terra desde antes do mundo.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo ge’ez traduzido como “névoa” é incerto neste testemunho; também pode indicar geada, geada branca, orvalho ou fenômeno meteorológico semelhante.
    reason: lexical_alternative
  - marker: b
    text: A sequência etíope é elíptica e pode ser entendida de mais de uma maneira. “Aquele da nuvem” pode retomar o vento ou o depósito; a relação com “sua nuvem” também não é clara. A pontuação procura tornar a frase legível sem eliminar essa dificuldade.
    reason: textual_ambiguity
  - marker: c
    text: 'Ou: “desde antes da era”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: depósitos
  rationale: Designa lugares ou câmaras onde algo é guardado. “Depósitos” conserva a imagem concreta sem a possível conotação financeira de “tesouros”.
- source_word: ፀዳዋነ
  choice: relâmpagos
  rationale: No catálogo de fenômenos meteorológicos, o termo é entendido como relâmpagos; o plural corresponde naturalmente à forma e à imagem do texto.
- source_word: ይትከፈሉ
  choice: são distribuídos
  rationale: A forma verbal indica divisão ou distribuição passiva. A escolha comunica uma repartição ordenada proveniente dos depósitos celestes.
- source_word: ነፋስ
  choice: vento
  rationale: O contexto de granizo, névoa e nuvem favorece o sentido meteorológico, sem introduzir o sentido possível de “espírito” onde ele não é exigido.
- source_word: በረድ
  choice: granizo
  rationale: É o equivalente meteorológico direto e corrente em português.
- source_word: ጊሜ
  choice: névoa
  rationale: O referente meteorológico é incerto; “névoa” se ajusta ao contexto de nuvens, enquanto “geada”, “orvalho” ou “geada branca” continuam possíveis e são registrados em nota.
- source_word: ወዘደመና
  choice: e aquele da nuvem
  rationale: Mantém o elemento relativo/demonstrativo ዘ e a formulação elíptica do etíope, sem substituir silenciosamente a expressão por apenas “a nuvem”.
- source_word: ወደመና ዚአሁ
  choice: e sua nuvem
  rationale: Conserva a repetição e o pronome possessivo do texto, embora a relação exata entre os termos permaneça obscura.
- source_word: የኀድር
  choice: permanece
  rationale: Expressa a ideia de habitar, repousar ou continuar presente e respeita o número singular da forma verbal.
- source_word: እምቅድመ ዓለም
  choice: desde antes do mundo
  rationale: Preserva a força temporal primordial da expressão sem decidir se ዓለም deve ser entendido mais especificamente como mundo, era ou ordem cósmica.
theological_decisions:
- issue: Expressão temporal primordial no quadro cosmológico
  choice: desde antes do mundo
  alternative: desde antes da era
  rationale: A tradução conserva a cosmologia primordial do texto, sem transformá-la numa afirmação posterior e mais específica sobre eternidade ou criação a partir do nada.
- issue: Relação entre os depósitos, o vento e a nuvem
  choice: manter a construção elíptica “aquele da nuvem” e explicar sua ambiguidade
  alternative: alisar como “a nuvem e sua nuvem” ou explicitar “o vento da nuvem”
  rationale: O etíope contém um pronome relativo/demonstrativo e uma sequência sintaticamente difícil. Explicitá-la como vento ou depósito resolveria uma relação que o testemunho não deixa plenamente clara.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por vocabulário meteorológico comum. A construção incomum no centro do versículo foi mantida deliberadamente para refletir a elipse e a ambiguidade do testemunho etíope.
