base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/001.yaml
  text: And after this I saw all the hidden things of the heavens[a], and how the kingdom is divided[c][b], and how the deeds of human beings are weighed in the balance.
translation:
  language: pt
  text: Depois disso, vi todas as coisas ocultas dos céus[a], como o reino é dividido[b] e como as obras dos seres humanos são pesadas na balança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os segredos dos céus”. O termo em ge''ez pode indicar coisas ocultas da vista ou do conhecimento comum.'
    reason: lexical_alternative
  - marker: b
    text: A frase “como o reino é dividido” é difícil. Pode referir-se à organização ou à repartição do domínio celestial.
    reason: alternative_reading
  - marker: c
    text: O texto emprega literalmente a imagem de pesar numa balança, sugerindo juízo ou avaliação das ações humanas.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Depois disso
  rationale: Mantém a fórmula temporal que marca a sequência da visão, em português natural.
- source_word: ርኢኩ
  choice: vi
  rationale: Reproduz diretamente o verbo visionário na primeira pessoa, sem arcaísmo.
- source_word: ኵሎ ኅቡኣቲሁ ለሰማያት
  choice: todas as coisas ocultas dos céus
  rationale: Preserva o plural concreto e a ideia de realidades escondidas da vista ou do conhecimento comum.
- source_word: መንግሥተ
  choice: o reino
  rationale: Conserva o sentido político-cósmico mais comum do substantivo, sem defini-lo como uma ordem cosmológica específica.
- source_word: እፎ
  choice: como
  rationale: Introduz de maneira natural em português o conteúdo das duas cláusulas seguintes.
- source_word: ትትካፈል
  choice: é dividido
  rationale: Preserva o sentido passivo ou reflexivo de divisão ou repartição e não resolve a dificuldade da cláusula.
- source_word: ትገበረ ሰብእ
  choice: as obras dos seres humanos
  rationale: Expressa o que os humanos fazem e fornece um referente natural para a imagem subsequente da pesagem.
- source_word: በመዳልው
  choice: na balança
  rationale: Mantém a imagem concreta de um instrumento de pesagem e sua possível conotação de avaliação ou juízo.
- source_word: ይደለው
  choice: são pesadas
  rationale: Harmoniza-se com a imagem da balança e preserva a metáfora avaliativa do texto.
theological_decisions:
- issue: Sentido da cláusula sobre o reino
  choice: o reino é dividido
  alternative: o reino é repartido ou ordenado em suas partes
  rationale: O ge'ez é conciso e difícil; a tradução mantém a formulação aberta, sem impor uma cosmologia ou distribuição específica.
