base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/002.yaml
  text: There I saw the dwelling places of the sinners and the dwelling places of the holy ones[a]; and there my eyes saw all the sinners being driven away from there—those who deny the name of the Lord of Spirits—and they were being dragged off[d][c][b], and they could not stand because of the punishment that goes out from the Lord of Spirits.
translation:
  language: pt
  text: Ali vi as moradas dos pecadores e as moradas dos santos[a][b]; ali meus olhos viram todos os pecadores sendo expulsos daquele lugar — os que negam o nome do Senhor dos Espíritos —, e eles eram arrastados para longe, sem poder manter-se de pé[c], por causa do castigo que procede do Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também “habitações”. O ge’ez repete o mesmo substantivo para os dois grupos, destacando suas moradas distintas na visão.
    reason: lexical_alternative
  - marker: b
    text: “Os santos” pode referir-se a pessoas santificadas, a seres celestiais ou a ambos; o ge’ez não explicita o referente aqui.
    reason: alternative_reading
  - marker: c
    text: A expressão também pode significar “não podiam permanecer” ou “não havia lugar onde pudessem ficar de pé” sob o castigo procedente do Senhor dos Espíritos.
    reason: lexical_alternative
lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: as moradas
  rationale: O substantivo designa lugares de habitação. “Moradas” mantém a imagem espacial concreta e sua repetição para os dois grupos.
- source_word: ኃጥኣን
  choice: os pecadores
  rationale: É a designação moral corrente e preserva o contraste apocalíptico com os santos.
- source_word: ቅዱሳን
  choice: os santos
  rationale: É uma formulação ampla que não determina se o referente são seres humanos santificados, seres celestiais ou ambos.
- source_word: ይሰደዱ
  choice: sendo expulsos
  rationale: O sentido passivo e durativo indica remoção forçada e combina com o contexto judicial.
- source_word: ይክሕድዎ ለስመ
  choice: negam o nome de
  rationale: Preserva a menção explícita ao nome e seu peso de autoridade divina, sem reduzi-la a uma declaração genérica de incredulidade.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém o título divino característico de 1 Enoque em forma transparente e reconhecível.
- source_word: ይስሐቡ
  choice: eram arrastados para longe
  rationale: Reproduz a força vívida do verbo de puxar ou arrastar no contexto punitivo.
- source_word: ቀዊመ አልቦሙ
  choice: sem poder manter-se de pé
  rationale: Expressa naturalmente a impossibilidade de ficar de pé ou resistir, evitando uma formulação jurídica moderna e preservando a possível ideia de não conseguir permanecer.
- source_word: መቅሠፍት
  choice: castigo
  rationale: No cenário de juízo, comunica a aflição punitiva sem especificar indevidamente sua forma como praga ou tormento.
- source_word: ትወጽእ እምእግዚአ መናፍስት
  choice: que procede do Senhor dos Espíritos
  rationale: Mantém a imagem dinâmica de o castigo sair de sua fonte divina em português natural e digno.
theological_decisions:
- issue: Identidade dos “santos”
  choice: Mantida a designação ampla “os santos”, sem especificar seres humanos ou celestiais.
  alternative: “os anjos” ou “os justos santificados”
  rationale: O ge’ez não define explicitamente o referente neste versículo; uma identificação mais estreita resolveria indevidamente a ambiguidade.
- issue: Força de “negar o nome do Senhor dos Espíritos”
  choice: Mantida a negação do nome divino.
  alternative: “rejeitam o Senhor dos Espíritos” ou “não creem no Senhor dos Espíritos”
  rationale: O texto menciona expressamente o “nome”, com suas conotações de identidade e autoridade; generalizar para incredulidade apagaria esse elemento.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A repetição de “moradas” e o título “Senhor dos Espíritos” foram preservados por sua importância literária e teológica.
