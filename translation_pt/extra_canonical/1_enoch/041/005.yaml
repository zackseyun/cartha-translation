  naturalness: O português é claro e de registro apropriado. A revisão proposta torna a enumeração visionária mais fluente e evita a quebra um pouco abrupta criada pelos dois “como” sucessivos.
  terminology: “Depósitos”, “curso”, “bendito”, “fidelidade” e “juramento” são escolhas defensáveis e preservam o registro religioso e imagético do texto. “Tirar nada de seu curso” exprime de modo natural e explícito o par verbal de acrescentar/diminuir.
