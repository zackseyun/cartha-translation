    rationale: A primeira ação retoma o curso por pronome, mas a segunda não explicita a ideia de retirar/de diminuir algo dele. “Não acrescentam nada a ele nem tiram nada de seu curso” preserva melhor a estrutura negativa e o paralelismo do original.
