base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/005.yaml
  text: And I saw the storehouses of the sun and of the moon[a], where they come out and where they go in, and their glorious return; and one is more honored than the other. And their course is blessed, and they do not overstep their course, and they do not add to it, and they do not take away from their course[d][c][b]; and they keep faith with one another by an oath.
translation:
  language: pt
  text: Vi os depósitos do sol e da lua[a], de onde saem e onde entram, seu retorno glorioso e como um é mais honrado do que o outro[b]. O curso deles é bendito; não ultrapassam seu curso, não acrescentam nada a ele nem tiram nada de seu curso. E guardam fidelidade um para com o outro por meio de um juramento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tesouros”. A imagem é a de recintos celestes dos quais o sol e a lua saem e aos quais retornam.
    reason: lexical_alternative
  - marker: b
    text: A construção é difícil. Ela parece comparar a honra ou o esplendor relativos do sol e da lua, sem identificar aqui qual deles é superior.
    reason: alternative_reading
  - marker: c
    text: “Guardam fidelidade [...] por meio de um juramento” emprega linguagem de compromisso solene para descrever a ordem dos corpos celestes, e não apenas sua regularidade mecânica.
    reason: cultural_note
lexical_decisions:
- source_word: መዛግብተ
  choice: depósitos
  rationale: O termo designa tesouros, depósitos ou lugares de armazenamento. “Depósitos” conserva a imagem concreta de recintos celestes dos quais os luminares saem e aos quais retornam, sem transformar a expressão em linguagem astronômica moderna.
- source_word: እምአይቴ ይወፅኡ / ወአይቴ ይገብኡ
  choice: de onde eles saem / onde entram
  rationale: Mantém os verbos básicos de movimento e preserva a preposição እም, “de”, na primeira expressão, em vez de reduzir a imagem a “nascer” e “se pôr”.
- source_word: ግብኦቶሙ ስቡሕ
  choice: como é glorioso o retorno deles
  rationale: “Retorno” expressa a reentrada cíclica após a saída, enquanto “glorioso” conserva o sentido de esplendor e o registro elevado. A formulação com “como” acompanha a sequência de aspectos contemplados pelo visionário.
- source_word: አፎ ይከብር አሐዱ ለካልኡ
  choice: como um é mais honrado do que o outro
  rationale: Conserva a partícula interrogativa አፎ, “como”, e a comparação de honra entre os dois luminares, sem especificar qual deles possui a honra superior.
- source_word: ምሕዋሮሙ
  choice: o curso deles
  rationale: “Curso” é natural para o movimento dos astros e permanece mais amplo e menos anacrônico que “órbita”.
- source_word: ብፁዕ
  choice: bendito
  rationale: Preserva o teor religioso do adjetivo, apresentando a ordem celeste como abençoada, não apenas regular.
- source_word: ኢየኃልፉ ምሕዋረ
  choice: não ultrapassam seu curso
  rationale: Comunica que os luminares não passam além dos limites que lhes foram estabelecidos.
- source_word: ኢይዌስኩ ወኢያኃጽጹ
  choice: não acrescentam a ele nem diminuem seu curso
  rationale: Retém o par contrastante de acrescentar e diminuir e a referência explícita ao curso, sem neutralizá-lo como mera constância mecânica.
- source_word: ሃይማኖተ የዐቅቡ
  choice: guardam fidelidade
  rationale: Neste contexto, o substantivo indica fidelidade ou lealdade, não uma formulação doutrinária. “Guardam fidelidade” mantém sua força relacional e solene.
- source_word: በመሐላ
  choice: por meio de um juramento
  rationale: Expressa o valor instrumental da construção e preserva a imagem solene de um juramento que rege a fidelidade mútua.
theological_decisions:
- issue: Se a conduta dos luminares deve ser expressa em termos apenas astronômicos ou também religiosos e pactuais
  choice: Conservar “bendito”, “guardam fidelidade” e “juramento”.
  alternative: Empregar linguagem neutra, como “regular”, “mantêm seu acordo” ou “seguem um padrão fixo”.
  rationale: O ge’ez emprega termos de forte carga religiosa e relacional. A tradução preserva a apresentação apocalíptica da criação como obediente a uma ordem solene, sem explicar se essa linguagem é literal ou personificadora.
- issue: Identidade do luminar mais honrado
  choice: 'Manter a comparação indefinida: “um é mais honrado do que o outro”.'
  alternative: Identificar explicitamente o sol como superior à lua.
  rationale: O versículo compara os luminares, mas nesta cláusula não nomeia qual deles é o mais honrado. Identificá-lo eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluência brasileira. A sintaxe preserva a sequência visionária “de onde... onde... como... e como...”, e o vocabulário evita tanto arcaísmos desnecessários quanto termos astronômicos anacrônicos.
