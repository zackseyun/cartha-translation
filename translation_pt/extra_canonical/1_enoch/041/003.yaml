base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/003.yaml
  text: And there my eyes saw the hidden treasuries of the lightning and the thunder[a], and the hidden treasuries of the winds—how they are divided so that they may blow upon the earth—and the hidden treasuries of the clouds and the dew; and there I saw from where they come in that place[e][d][c][b], and from there they water the dust of the earth.
translation:
  language: pt
  text: E ali meus olhos viram os depósitos ocultos dos relâmpagos e dos trovões[a], os depósitos ocultos dos ventos — como suas bocas são divididas[b] para que soprem sobre a terra — e os depósitos ocultos das nuvens e do orvalho. Ali vi de onde eles vêm naquele lugar; e dali o pó da terra fica saciado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tesouros ocultos”. O termo ge'ez pode designar coisas ou lugares escondidos e reservados.
    reason: lexical_alternative
  - marker: b
    text: 'A imagem é literal: “suas bocas são divididas”, isto é, as aberturas ou saídas dos ventos.'
    reason: lexical_alternative
  - marker: c
    text: 'A oração final também tem sido entendida de modo ativo: “dali eles regam (ou saturam) o pó da terra”. A forma ge''ez favorece o sentido intransitivo “fica saciado” ou “fica cheio”, embora a construção seja difícil.'
    reason: alternative_reading
lexical_decisions:
- source_word: ኅቡኣተ
  choice: depósitos ocultos
  rationale: No catálogo cósmico, o termo indica coisas ou lugares reservados e escondidos. “Depósitos ocultos” conserva a imagem de forças naturais armazenadas sem recorrer ao menos corrente “tesouros”.
- source_word: መብረቅት ወነጐድጓድ
  choice: relâmpagos e trovões
  rationale: Os plurais portugueses são naturais neste catálogo de fenômenos e acompanham a forma plural de “relâmpagos” no ge'ez.
- source_word: ነፋሳት
  choice: ventos
  rationale: O contexto meteorológico e a oração que diz que sopram sobre a terra favorecem “ventos”, não “espíritos”.
- source_word: አፎ ይትከፈሉ
  choice: suas bocas são divididas
  rationale: Mantém a figura antropomórfica concreta das saídas dos ventos e a voz passiva do texto, em vez de explicá-la no corpo do versículo.
- source_word: ከመ ይንፍሑ ዲበ ምድር
  choice: para que soprem sobre a terra
  rationale: Expressa naturalmente a finalidade da divisão das bocas ou saídas dos ventos.
- source_word: ደመናት ወጠል
  choice: nuvens e orvalho
  rationale: Equivalentes meteorológicos diretos e correntes em português.
- source_word: እምኀበ ይመጽእ በውእቱ መካን
  choice: de onde eles vêm naquele lugar
  rationale: Conserva tanto a indicação de origem quanto a expressão locativa, entendendo o referente coletivamente como os fenômenos mencionados.
- source_word: ይፀግቡ ጸበለ ምድር
  choice: o pó da terra fica saciado de água
  rationale: Representa o sentido intransitivo de ficar cheio ou saciado e retém a imagem concreta do pó da terra; “de água” torna inteligível em português a metáfora no contexto de nuvens e orvalho.
theological_decisions:
- issue: Se ነፋሳት designa ventos ou espíritos
  choice: ventos
  alternative: espíritos
  rationale: A enumeração de relâmpagos, trovões, nuvens e orvalho, juntamente com o ato de soprar sobre a terra, determina um sentido meteorológico local.
- issue: Agência na oração final
  choice: o pó da terra fica saciado de água
  alternative: eles regam ou saturam o pó da terra
  rationale: A tradução evita transformar sem indicação inequívoca a forma verbal simples e intransitiva em uma ação causativa dos fenômenos, preservando ao mesmo tempo a tensão sintática do ge'ez.
translation_notes:
  register: Português moderno, digno e acessível, com cadência visionária. Preservou-se a repetição de “depósitos ocultos” e a imagem das “bocas” dos ventos. Empregou-se “sobre a terra”, de compreensão ampla no português internacional e natural para leitores brasileiros.
