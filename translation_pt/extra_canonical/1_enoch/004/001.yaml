base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/004/001.yaml
  text: And again[a], observe the days of summer—how the sun comes upon it at its beginning, and you seek shelter and shade because of the heat of the sun[c][b], and the earth is scorched with burning heat, and you cannot tread on the earth or upon a rock because of its heat.
translation:
  language: pt
  text: 'E, novamente, observem os dias do verão: como o sol incide sobre ela no começo[a], e vocês procuram abrigo e sombra[b] por causa do calor do sol; a terra fica abrasada pelo calor ardente, e vocês não conseguem pisar nem na terra nem numa rocha, por causa do calor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão em ge'ez é difícil. Também pode aludir mais especificamente à força do sol no começo do verão.
    reason: textual_variant
  - marker: b
    text: “Abrigo e sombra” preserva os dois termos paralelos empregados no texto em ge'ez.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳግመ
  choice: novamente
  rationale: Marca a introdução de outro exemplo paralelo e preserva o estilo reiterativo do discurso.
- source_word: ጠየቁ
  choice: observem
  rationale: Embora o verbo possa significar literalmente perguntar ou investigar, neste contexto de exame dos fenômenos naturais, e à luz do testemunho grego, “observem” comunica melhor a exortação.
- source_word: መዋዕለ ሐጋይ
  choice: os dias do verão
  rationale: Mantém a expressão temporal concreta do ge'ez e soa natural em português moderno.
- source_word: ከመ ኮነ ፀሓይ ላዕሌሃ በቅድሜሃ
  choice: como o sol vem sobre essa estação no seu início
  rationale: Preserva a imagem e a dificuldade sintática da cláusula, tornando explícito apenas o referente feminino provável, a estação de verão.
- source_word: ተኀሥሡ
  choice: vocês procuram
  rationale: Expressa a busca ativa por proteção contra o calor sem introduzir a ideia mais forte de fuga.
- source_word: ምጽላለ ወጽላሎተ
  choice: abrigo e sombra
  rationale: Preserva os dois termos correlatos do original em uma formulação idiomática portuguesa.
- source_word: በእንተ ዋዕየ ፀሓይ
  choice: por causa do calor do sol
  rationale: Transmite de modo claro e direto a causa da procura por proteção.
- source_word: ወምድርኒ ትውዒ እሙቀተ ሐሩር
  choice: a terra fica abrasada pelo calor ardente
  rationale: Conserva a intensidade e a imagem física da terra submetida ao calor do verão.
- source_word: ኢትክሉ ከይዶታ ለምድር ወኢ ኰኵሐ በእንተ ዋዕያ
  choice: vocês não conseguem pisar nem na terra nem numa rocha, por causa do calor
  rationale: Reproduz a cláusula final recuperada do texto completo e conserva a coordenação enfática entre terra e rocha.
theological_decisions:
- issue: A natureza como testemunho moral e teológico
  choice: Manter o versículo como descrição observacional das estações e de seus efeitos.
  alternative: Explicitar na tradução que o fenômeno natural ensina sobre a ordem divina ou o juízo.
  rationale: O versículo em si descreve a criação; sua força teológica decorre do contexto mais amplo e não deve ser acrescentada interpretativamente ao texto.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês” para refletir a segunda pessoa do plural. A pontuação organiza a longa sequência do original sem eliminar seu caráter cumulativo.
