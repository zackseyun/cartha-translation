base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/003/001.yaml
  text: Observe and see all the trees[a], how they appear withered, and all their leaves stripped off—except fourteen trees, which do not lose their leaves, but remain from the old until the new comes[c][b], through two and three winters.
translation:
  language: pt
  text: 'Observem e vejam todas as árvores: como parecem ressequidas e como todas as suas folhas foram arrancadas — exceto catorze árvores, que não perdem as folhas, mas permanecem desde o velho até que venha o novo[a], ao longo de dois e três invernos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “desde o velho até que venha o novo” é elíptica; provavelmente se refere à passagem da estação ou do ano velho e à chegada do novo.
    reason: cultural_note
  - marker: b
    text: “Ao longo de dois e três invernos” é uma expressão difícil. Também pode ser entendida como “por dois ou três invernos”, indicando estações repetidas antes da renovação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ ወርእዩ
  choice: Observem e vejam
  rationale: Os dois imperativos plurais formam uma convocação enfática à contemplação. Neste contexto, ጠይቁ tem o sentido de observar ou considerar, e não de formular uma pergunta; “vejam” conserva a força direta de ወርእዩ.
- source_word: ኵሎ ዕፀወ
  choice: todas as árvores
  rationale: Tradução natural do plural coletivo no contexto da observação da natureza.
- source_word: እፎ ያስተርእዩ ከመ ይቡስ
  choice: como parecem ressequidas
  rationale: “Como” preserva o valor de እፎ, enquanto “parecem ressequidas” comunica tanto a aparência visível quanto o estado de secura das árvores.
- source_word: ወኵሉ አቍጽሊሆሙ ንጉፍ
  choice: e como todas as suas folhas foram arrancadas
  rationale: A formulação mantém a imagem forte de folhas removidas ou despojadas, em vez de reduzir a expressão à simples queda sazonal.
- source_word: ዘእንበለ ፲ወ፬ ዕፀወ
  choice: exceto catorze árvores
  rationale: Reproduz de modo claro o contraste explícito entre o conjunto das árvores e a exceção numericamente definida.
- source_word: ዘኢይትነገፉ
  choice: que não perdem as folhas
  rationale: A expressão retoma negativamente a imagem anterior de despojamento. A menção das folhas, implícita pelo paralelismo, torna a frase natural em português sem alterar seu sentido.
- source_word: እላ ይጸንሑ
  choice: mas permanecem
  rationale: Expressa de maneira concisa a continuidade das árvores excepcionais e introduz naturalmente a indicação temporal seguinte.
- source_word: እምብሉይ እስከ ይመጽእ ኃዲስ
  choice: desde o velho até que venha o novo
  rationale: Conserva a elipse dos adjetivos substantivados “velho” e “novo”, provavelmente referentes a estações ou anos, sem determinar no texto aquilo que o original deixa implícito.
- source_word: እምክልኤ ወእም ፫ ክረምት
  choice: ao longo de dois e três invernos
  rationale: Mantém a difícil coordenação numérica do ge’ez. A nota registra a possibilidade idiomática de “dois ou três invernos” sem apagar a forma incomum do texto.
theological_decisions:
- issue: Possível sentido simbólico das árvores e das estações
  choice: Manter no texto apenas a descrição botânica e sazonal
  alternative: Interpretar as árvores como classes de pessoas, seres celestes ou ordens cósmicas
  rationale: O versículo convoca o leitor a observar a criação, mas não identifica expressamente as árvores com outra realidade. Uma interpretação alegórica no corpo da tradução acrescentaria conteúdo não declarado pelo texto.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural. A redação preserva as duas principais dificuldades do original — “o velho/o novo” e “dois e três invernos” — esclarecendo-as em notas, sem resolvê-las silenciosamente.
