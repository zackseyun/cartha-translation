base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/003.yaml
  text: For concerning the signs and the seasons and the years and the days[a], Uriel, the angel whom the Lord of glory appointed forever over all the luminaries of heaven in heaven and in the world, showed me how they rule over the face of heaven and are seen upon the earth[e][d][c][b], and become guides for day and for night—the sun and the moon and the stars and all the ministering powers that make their circuit in all the chariots of heaven.
translation:
  language: pt
  text: 'Pois, quanto aos sinais, às estações[a], aos anos e aos dias, Uriel — o anjo que o Senhor da glória estabeleceu para sempre sobre todos os luminares do céu, no céu e no mundo — mostrou-me como eles governam na face do céu[b], são vistos sobre a terra e se tornam guias do dia e da noite: o sol, a lua, as estrelas e todas as potências ministradoras[c] que percorrem seu circuito em todos os carros do céu[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tempos determinados”. O termo pode designar divisões fixas do tempo em sentido calendárico.
    reason: lexical_alternative
  - marker: b
    text: “Face do céu” é uma expressão literal para a extensão visível do céu.
    reason: cultural_note
  - marker: c
    text: A expressão “potências ministradoras” é incerta; pode referir-se a ordens celestes servidoras ou a funções associadas aos corpos celestes.
    reason: lexical_alternative
  - marker: d
    text: Os “carros do céu” podem representar os trajetos ordenados pelos quais os corpos celestes se movem; a tradução mantém a imagem do texto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርት
  choice: sinais
  rationale: No contexto astronômico, refere-se a indicadores celestes observáveis; “sinais” conserva essa função sem sugerir necessariamente presságios.
- source_word: አዝማን
  choice: estações
  rationale: Designa tempos ou divisões fixas da ordem cósmica; “estações” é natural em português, enquanto a nota preserva a nuance de “tempos determinados”.
- source_word: መዋዕል
  choice: dias
  rationale: Na sequência de unidades temporais, “dias” é a leitura mais direta.
- source_word: አርአየኒ
  choice: mostrou-me
  rationale: Verbo visionário vertido com clareza, sem acrescentar a nuance interpretativa de revelação.
- source_word: እግዚአ ስብሐት
  choice: Senhor da glória
  rationale: Preserva o título divino e o registro apocalíptico elevado.
- source_word: ብርሃናት ሰማይ
  choice: luminares do céu
  rationale: Mantém o sentido técnico-cósmico dos corpos celestes enquanto fontes ordenadas de luz.
- source_word: በሰማይ ወበዓለም
  choice: no céu e no mundo
  rationale: Segue de perto a distinção espacial do ge'ez sem reduzir “mundo” simplesmente a “terra”.
- source_word: ይምልኩ
  choice: governam
  rationale: Conserva a linguagem de domínio cósmico presente no verbo.
- source_word: ገጸ ሰማይ
  choice: face do céu
  rationale: Preserva literalmente a imagem do firmamento visível.
- source_word: መራሕያነ
  choice: guias
  rationale: Expressa a função diretiva e ordenadora dos luminares sem impor linguagem política mais forte.
- source_word: ቅንየታት
  choice: potências ministradoras
  rationale: A expressão é incerta; esta tradução mantém tanto a possível referência a seres celestes servidores quanto a funções ordenadas.
- source_word: የአውዱ
  choice: percorrem seu circuito
  rationale: Comunica o movimento circular ou processional adequado ao contexto astronômico.
- source_word: ለዓለም
  choice: para sempre
  rationale: Mantém explicitamente a duração permanente da nomeação de Uriel, presente no ge'ez.
- source_word: ሰረገላት ሰማይ
  choice: carros do céu
  rationale: Conserva a imagem apocalíptica concreta, em vez de substituí-la por “órbitas” ou “cursos”.
theological_decisions:
- issue: A função dos luminares em linguagem pessoal e governante
  choice: “eles governam” e “se tornam guias”
  alternative: “movem-se pelo céu e marcam o dia e a noite”
  rationale: O ge'ez emprega linguagem de governo e direção; preservá-la mantém a cosmologia animada do texto e evita modernizá-la de modo reducionista.
- issue: A imagem dos carros celestes
  choice: Manter “carros do céu” no texto principal
  alternative: “cursos do céu” ou “órbitas celestes”
  rationale: A imagem pertence ao texto e à sua visão apocalíptica; a possível função astronômica é esclarecida em nota sem apagar a metáfora.
- issue: Alcance de “para sempre”
  choice: Ligá-lo à nomeação de Uriel pelo Senhor da glória
  alternative: Relacioná-lo de modo mais amplo ao domínio sobre os luminares
  rationale: A ordem sintática favorece a duração permanente da nomeação, embora a construção compacta permita alguma proximidade semântica com a função exercida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe inicial acompanha a ordem do ge'ez sem produzir uma frase artificial; os travessões delimitam a descrição de Uriel. Mantêm-se os termos e imagens apocalípticos “luminares”, “face do céu”, “potências ministradoras” e “carros do céu”, com notas apenas onde a ambiguidade lexical ou cultural exige esclarecimento.
