base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/002.yaml
  text: 'And because of them people go astray concerning them[a], for these lights render service at the stations of the world in righteousness: one in the first portal, and one in the third portal of heaven, and one in the fourth portal, and one in the sixth portal[e][d][c][b]; and the careful ordering of the world is completed in three hundred and sixty-four stations of the world.'
translation:
  language: pt
  text: 'E, por causa delas, as pessoas se desviam a respeito delas[a][e], pois essas luzes prestam serviço nas estações do mundo em justiça[c]: uma no primeiro portal, duas no terceiro portal do céu, duas no quarto portal e duas no sexto portal[d]; e a cuidadosa ordenação do mundo se completa em trezentas e sessenta e quatro estações do mundo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as pessoas erram por causa delas, pois essas luzes mudam corretamente de lugar”. A frase contrasta o engano humano com a regularidade ordenada das luzes celestes.'
    reason: lexical_alternative
  - marker: b
    text: A oração final é difícil. Provavelmente alude ao ano esquemático enóquico de 364 posições ou dias ordenados; de modo mais literal, o ge'ez fala da cuidadosa ordenação do mundo completada em 364 “estações”.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “mudam suas estações”.'
    reason: previous_rendering
  - marker: d
    text: 'Outra leitura, possivelmente decorrente de tradição textual ou transcrição: “uma no primeiro portal, uma no terceiro portal do céu, uma no quarto portal e uma no sexto portal”.'
    reason: textual_or_transcription_alternative
  - marker: e
    text: 'Ou, de modo mais literal: “entre elas”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወበእንቲአሆሙ
  choice: E, por causa delas
  rationale: Mantém o valor causal mais provável da expressão preposicional no contexto, sem excluir por nota a possibilidade de uma relação mais geral.
- source_word: ይጌግዩ ... ቦሙ
  choice: as pessoas se desviam a respeito delas
  rationale: O verbo expressa erro ou desvio, e a expressão com sufixo pronominal indica aqui o objeto a respeito do qual as pessoas erram, não um lugar físico entre os astros.
- source_word: እሙንቱ ብርሃናት
  choice: essas luzes
  rationale: É uma designação direta e acessível dos corpos luminosos celestes tratados nesta seção; evita tecnicismo desnecessário.
- source_word: በጽድቅ
  choice: em justiça
  rationale: Preserva o vocábulo de justiça/retidão e sua dimensão moral-cósmica, em vez de reduzi-lo silenciosamente a mera regularidade mecânica.
- source_word: ይትቀየዩ መንበረ ዓለም
  choice: exercem seu serviço nas estações do mundo
  rationale: Segue a leitura contextual refletida na camada inglesa auditada, na qual as luzes cumprem sua função nas posições ordenadas do cosmos; a alternativa ligada à mudança de estações é preservada em nota.
- source_word: ኆኅት
  choice: portal
  rationale: Conserva a imagem apocalíptico-cosmológica das aberturas celestes e mantém consistência com o restante do Livro Astronômico.
- source_word: ይትፌጸም ጥንቃቄ ዓለም
  choice: a cuidadosa ordenação do mundo se completa
  rationale: Reproduz tanto a ideia de conclusão quanto a nuance de exatidão, cuidado ou precisão de ጥንቃቄ.
- source_word: ፻፷ወ፬ ... መንበረ ዓለም
  choice: trezentas e sessenta e quatro estações do mundo
  rationale: Mantém o número e a linguagem espacial do texto, sem substituir no corpo do versículo as estações por dias.
theological_decisions:
- issue: Sentido de በጽድቅ no contexto astronômico
  choice: em justiça
  alternative: corretamente; em ordem adequada; fielmente
  rationale: A formulação conserva a tensão entre justiça moral e ordem cósmica característica do texto, sem decidir que o termo seja apenas técnico.
- issue: Interpretação das 364 estações
  choice: estações que completam a cuidadosa ordenação do mundo
  alternative: 364 dias do ano esquemático enóquico; 364 partes do cômputo cósmico
  rationale: A tradução mantém a formulação concreta e algo opaca do ge'ez, enquanto a nota esclarece a provável referência calendárica sem inseri-la como certeza no texto.
- issue: Distribuição das luzes pelos portais
  choice: uma em cada um dos quatro portais mencionados
  alternative: uma no primeiro e duas no terceiro, no quarto e no sexto portais
  rationale: A leitura principal acompanha o texto corrido auditado e o conhecido esquema de quatro posições complementares; a tradição textual/transcrição permite uma leitura numeral alternativa, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Conservam-se “portal”, “em justiça” e “estações do mundo” para manter a imagética apocalíptica, a tensão teológica e a terminologia cosmológica do original. As repetições pronominais e de “mundo” foram mantidas por refletirem a estrutura e a opacidade reais do texto.
