base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/005.yaml
  text: and for the winds[a], and for the spirit of dew[c][b], when the openings are opened in heaven at the ends.
translation:
  language: pt
  text: e para os ventos, e para o espírito do orvalho[a], quando se abrem as aberturas no céu, nas extremidades.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “espírito do orvalho” é lexicalmente difícil e também pode ser entendida de modo mais físico, como “sopro do orvalho” ou um vento portador de orvalho.
    reason: lexical_alternative
  - marker: b
    text: A oração a partir de “quando” está entre colchetes no testemunho utilizado e é textualmente incerta. “Aberturas” também pode ser traduzido por “janelas” ou “respiradouros” do céu.
    reason: textual_variant
lexical_decisions:
- source_word: ነፋሳት
  choice: ventos
  rationale: No Livro Astronômico, o termo designa normalmente os ventos como fenômenos cósmicos; “ventos” preserva melhor esse sentido que o abstrato “espíritos”.
- source_word: መንፈሰ ጠል
  choice: espírito do orvalho
  rationale: A expressão é lexicalmente difícil. A tradução literal preserva sua imagem cosmológica sem reduzi-la a uma paráfrase puramente meteorológica.
- source_word: ሶበ
  choice: quando
  rationale: Conjunção temporal natural em português, introduzindo a circunstância em que as aberturas se abrem.
- source_word: ይትረኃዉ
  choice: se abrem
  rationale: O valor passivo ou reflexivo é bem expresso pelo português pronominal, sem introduzir um agente não declarado.
- source_word: ርኅወተ
  choice: as aberturas
  rationale: Termo amplo que evita especificar indevidamente “janelas”, “respiradouros” ou “portas”; não foi acrescentado possessivo.
- source_word: በሰማይ
  choice: no céu
  rationale: O substantivo está no singular; “no céu” mantém esse número e soa natural no português moderno.
- source_word: አጽናፈ
  choice: nas extremidades
  rationale: Expressa os limites ou confins da geografia cósmica; é mais claro em português do que o potencialmente ambíguo “nos fins”.
theological_decisions:
- issue: Se a referência ao orvalho deve ser desmitologizada como simples linguagem meteorológica
  choice: Manter “espírito do orvalho” no texto principal
  alternative: vento de orvalho; sopro do orvalho; orvalho
  rationale: O contexto cataloga agentes e mecanismos cósmicos. A formulação incomum preserva a imagem apocalíptica e a tensão lexical do texto.
translation_notes:
  register: 'Português moderno, digno e acessível, com legibilidade brasileira. A coordenação fragmentária iniciada por “e para” foi mantida por pertencer a uma enumeração mais ampla. Os marcadores foram posicionados junto às respectivas dificuldades: [a] após “ventos” introduz a nota sobre a expressão seguinte, conforme a tradição editorial fornecida; [b] ao fim assinala a incerteza da oração entre colchetes.'
