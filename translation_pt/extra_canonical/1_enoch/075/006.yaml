base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/006.yaml
  text: When the twelve other portals in heaven[a], at the ends of the earth, are opened[c][b], from which the sun and the moon and the stars come out.
translation:
  language: pt
  text: Quando se abrem os doze portais no céu[a], nos confins da terra[b], deles saem o sol, a lua e as estrelas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “aberturas” ou “janelas”; o termo designa passagens na estrutura celeste.
    reason: lexical_alternative
  - marker: b
    text: A expressão “confins da terra” reflete a imagem cosmológica antiga da passagem, não uma descrição científica moderna.
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: Quando
  rationale: Introduz uma oração temporal, de acordo com o valor normal da conjunção neste contexto.
- source_word: ይትረኃዉ
  choice: se abrem
  rationale: A forma verbal expressa a abertura dos portais; a construção pronominal é natural em português e evita sugerir mera existência.
- source_word: ፲ሥሩ ወካልእ
  choice: os outros doze
  rationale: Mantém o número doze e representa ካልእ como indicação de um conjunto adicional já pressuposto pelo contexto.
- source_word: ኃዋላወ
  choice: portais
  rationale: Designa aberturas ou passagens na estrutura celeste; “portais” preserva a imagem concreta e evita a repetição pouco natural “aberturas se abrem”.
- source_word: በሰማይ
  choice: no céu
  rationale: Conserva o registro cosmológico e apocalíptico do texto.
- source_word: ዲበ አጽናፈ ምድር
  choice: nos confins da terra
  rationale: Expressa as extremidades da terra na cosmologia antiga com formulação digna e corrente em português bíblico moderno.
- source_word: እለ እምኔሆሙ ይወፅእ
  choice: deles saem
  rationale: Liga diretamente os portais aos astros que deles emergem, com movimento concreto e sintaxe natural em português.
- source_word: ፀሐይ ወወርኅ ወከዋክብት
  choice: o sol, a lua e as estrelas
  rationale: Reproduz integralmente a enumeração dos corpos celestes em português natural.
theological_decisions:
- issue: Linguagem cosmológica de portais celestes
  choice: Manter as imagens concretas de “portais no céu” e “confins da terra”
  alternative: Reformular como direções, horizontes ou setores astronômicos
  rationale: A passagem descreve uma arquitetura cósmica antiga. Modernizá-la apagaria a forma própria da visão, sem que o texto autorize tal interpretação.
- issue: Relação sintática da oração temporal
  choice: Traduzir como uma oração temporal que desemboca em “deles saem...”
  alternative: 'Tratar a primeira expressão como uma afirmação existencial independente: “Então há...”'
  rationale: O valor temporal de ሶበ e o sentido verbal de abertura em ይትረኃዉ favorecem “Quando se abrem”; a formulação portuguesa completa o pensamento sem alterar a relação entre os portais e a saída dos astros.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para produzir uma oração completa e natural, preservando a sequência temporal, a imagem cosmológica concreta e a enumeração do ge'ez.
