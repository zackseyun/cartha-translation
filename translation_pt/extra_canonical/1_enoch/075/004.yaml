base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/004.yaml
  text: Likewise[a], Uriel showed me twelve openings in the circuit of the chariots of the sun in the sky, from which the rays of the sun go out[b], and from which warmth comes forth upon the earth when they are opened in the seasons appointed for them.
translation:
  language: pt
  text: Do mesmo modo, Uriel me mostrou doze aberturas no circuito dos carros do sol no céu, das quais saem os raios do sol[a] e das quais procede calor sobre a terra, quando são abertas nas estações que lhes foram determinadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão etíope é difícil e pode significar literalmente «os pés do sol»; neste contexto, provavelmente se refere aos seus raios ou feixes de luz.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፲ሥሩ ወካልእ … ርኅዋተ
  choice: doze aberturas
  rationale: A evidência crítica indicada aponta para uma corrupção na transcrição/OCR e para a leitura subjacente «doze aberturas», adequada ao sistema astronômico do capítulo.
- source_word: ኃዋላወ / leitura corrigida በአውደ
  choice: no circuito
  rationale: Preserva a imagem do percurso circular dos carros solares, seguindo a correção textual documentada em vez de tentar dar sentido ao OCR corrompido.
- source_word: ሰረገላት ፀሐይ
  choice: os carros do sol
  rationale: «Carros» mantém a imagem veicular e o registro apocalíptico, sendo mais natural em português atual do que «carruagens» neste contexto celeste.
- source_word: እገሪሃ ለፀሐይ
  choice: os raios do sol
  rationale: A forma transmitida pode significar literalmente «os pés dela», mas, no contexto da emissão solar, «raios» comunica o provável referente sem ocultar a dificuldade, registrada em nota.
- source_word: ሞቅ
  choice: calor
  rationale: Termo corrente e preciso para o efeito que procede das aberturas sobre a terra.
- source_word: በአዝማን እለ እሙራን ሎሙ
  choice: nas estações que lhes foram determinadas
  rationale: Conserva tanto a ordem temporal fixa quanto a referência pronominal às aberturas, sem explicitar quem as determinou.
theological_decisions:
- issue: Natureza do mecanismo celeste
  choice: Manter as imagens concretas das aberturas e dos carros solares.
  alternative: Reduzir a passagem a uma descrição abstrata da luz solar e das estações.
  rationale: O texto apresenta uma cosmologia apocalíptica concreta; modernizá-la como mera observação meteorológica eliminaria um elemento genuíno da passagem.
- issue: Agente que determina as estações
  choice: Usar a construção passiva «foram determinadas», sem nomear o agente.
  alternative: Dizer explicitamente que Deus determinou as estações.
  rationale: Embora o contexto possa pressupor agência divina, o versículo não a explicita; a tradução preserva essa reserva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe preserva a sequência da visão e a cosmologia concreta, evitando linguagem excessivamente arcaica.
