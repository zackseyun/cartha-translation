base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/001.yaml
  text: And the leaders of the heads of thousands[a], who are over all creation and over all the stars, together with those four that are added and do not separate from their service[e][d][c][b], according to the reckoning of the year—and these render service on the four days that are not counted in the reckoning of the year.
translation:
  language: pt
  text: E seus líderes, os chefes de milhares, que estão sobre toda a criação e sobre todas as estrelas, juntamente com aqueles quatro que são acrescentados[a], não se afastam de seu serviço, segundo o cômputo do ano — e estes cumprem sua função[b] nos quatro dias que não são contados no cômputo do ano.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que são unidos” ou “incorporados”; o ge'ez pode indicar sua ligação ao sistema ordenado do ano.
    reason: lexical_alternative
  - marker: b
    text: O verbo é difícil e também pode ter o sentido de “se revezam” ou “alternam em sua função”.
    reason: lexical_alternative
  - marker: c
    text: No esquema de 364 dias do Livro Astronômico, os “quatro dias que não são contados” são dias calendáricos adicionais ligados aos pontos de transição do ano. A relação exata entre esses dias e “aqueles quatro” na primeira parte do versículo permanece aberta.
    reason: cultural_note
lexical_decisions:
- source_word: መራሕያኒሆሙ
  choice: os líderes
  rationale: Preserva o sentido de condução ou direção e se ajusta ao contexto administrativo-cósmico.
- source_word: አርእስተ አእላፍ
  choice: os chefes de mil
  rationale: Reproduz de perto a expressão hierárquica literal, sem impor uma conotação militar mais forte.
- source_word: ዲበ ኵሉ ፍጥረት
  choice: sobre toda a criação
  rationale: Mantém o alcance cósmico de ፍጥረት e soa natural em português.
- source_word: ዲበ ኵሉ ከዋክብት
  choice: sobre todas as estrelas
  rationale: Tradução direta do plural universal no contexto astronômico.
- source_word: ምስለ እሉ ፬ እለ ይትዌሰኩ
  choice: juntamente com aqueles quatro que são acrescentados
  rationale: Conserva a oração relativa marcada por እለ, fazendo de “são acrescentados” uma descrição dos quatro.
- source_word: ኢይትሌለዩ እምነ ምግባሮሙ
  choice: não se afastam de seu serviço
  rationale: Mantém a ideia de não se separar da função ou atividade designada, sem especificar indevidamente sua natureza.
- source_word: በከመ ሐሳበ ዓመት
  choice: segundo o cômputo do ano
  rationale: “Cômputo” comunica o sentido técnico de cálculo calendárico e preserva a repetição da expressão.
- source_word: ይትቀየዩ
  choice: cumprem sua função
  rationale: Expressa participação funcional sem ocultar que o verbo pode envolver mudança, alternância ou turno.
- source_word: ፬ መዋዐለ እለ ኢይትኃሰቡ
  choice: os quatro dias que não são contados
  rationale: Apresenta com clareza a exclusão desses dias do cômputo ordinário do ano.
theological_decisions:
- issue: Natureza dos “quatro”
  choice: O texto principal mantém “aqueles quatro” sem defini-los imediatamente, embora a cláusula final os relacione funcionalmente aos quatro dias não contados.
  alternative: Entendê-los exclusivamente como dias intercalares, como dirigentes celestes ou como ambos em linguagem apocalíptica.
  rationale: O ge'ez primeiro menciona “aqueles quatro” e só depois fala explicitamente em “quatro dias”; preservar essa abertura evita resolver uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe formal moderada. “Cômputo” foi mantido como termo técnico calendárico; as notas preservam as principais incertezas lexicais e referenciais.
