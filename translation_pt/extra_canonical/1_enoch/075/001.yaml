    issue: Relação sintática indevida em “os líderes dos chefes de mil”.
    rationale: O sufixo em መራሕያኒሆሙ significa “seus”; “chefes de milhares” explica/apõe os líderes, em vez de constituir o possuidor de “líderes”.
  - severity: low
    issue: “chefes de mil” é menos idiomático e menos exato do que “chefes de milhares”.
    rationale: O plural አእላፍ corresponde a “milhares”; a expressão revista também evita sugerir que cada chefe seja apenas “de mil” como unidade isolada.
  - severity: low
