revisions:
- from: E os líderes dos chefes de mil, que estão sobre toda a criação e sobre todas as estrelas, juntamente com aqueles quatro que são acrescentados[a] e não se afastam de seu serviço, segundo o cômputo do ano — estes cumprem sua função[b] nos quatro dias que não são contados no cômputo do ano.[c]
  to: E seus líderes, os chefes de milhares, que estão sobre toda a criação e sobre todas as estrelas, juntamente com aqueles quatro que são acrescentados[a], não se afastam de seu serviço, segundo o cômputo do ano — e estes cumprem sua função[b] nos quatro dias que não são contados no cômputo do ano.[c]
  rationale: 'A revisão corrige a análise sintática da expressão inicial conforme o ge''ez: os líderes são identificados como “chefes de milhares”, não apresentados como líderes pertencentes a chefes. Preserva-se a oração relativa que qualifica os quatro, a ambiguidade referencial de “estes” e a cautela quanto ao verbo de sentido discutido. As notas continuam ancoradas nos mesmos pontos e a nota cultural passa a distinguir o dado explícito da inferência contextual.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:59:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'A abertura do rascunho, “os líderes dos chefes de mil”, introduz uma relação possessiva/hierárquica que o ge''ez não expressa. መራሕያኒሆሙ é “seus líderes”, e ለአርእስተ አእላፍ está em aposição: “seus líderes, os chefes de milhares”. A oração relativa “que são acrescentados” é corretamente aplicada aos quatro, não aos líderes. A referência de “estes” permanece aberta, como no original.'
  naturalness: A revisão substitui a construção pouco natural e semanticamente deslocada “líderes dos chefes de mil” por “seus líderes, os chefes de milhares”. Mantém um registro formal legível e o termo técnico “cômputo”.
  terminology: “Chefes de milhares” reproduz adequadamente “cabeças/chefes de milhares” em português. “Cumprem sua função” é uma solução prudente para o verbo difícil ይትቀየዩ, com a alternativa de alternância preservada em nota. A nota cultural é ajustada para não apresentar como identificação absoluta aquilo que o texto principal deixa inicialmente implícito.
  issues:
