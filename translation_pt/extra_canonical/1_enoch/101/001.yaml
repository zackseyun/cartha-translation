base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/001.yaml
  text: Observe heaven[a], you sons of heaven, and every work of the Most High; and fear him[b], and do not do evil before him.
translation:
  language: pt
  text: Observem o céu[a], vocês, filhos do céu, e toda obra do Altíssimo; temam-no[b] e não façam o mal diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Considerem o céu”. O verbo também pode significar “perguntem” ou “indaguem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “reverenciem-no”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቅዋ
  choice: Observem
  rationale: Neste contexto, o imperativo plural introduz um chamado a contemplar ou considerar, em paralelo com outras exortações do livro. “Observem” exprime isso com naturalidade, embora o verbo também possa ter o sentido de perguntar ou indagar.
- source_word: ለሰማይ
  choice: o céu
  rationale: “Céu” preserva o âmbito cósmico e apocalíptico; com o verbo entendido como “observar”, funciona como primeiro objeto da exortação.
- source_word: ውሉደ፡ ሰማይ
  choice: vocês, filhos do céu
  rationale: A formulação literal conserva o caráter elevado e a identidade ambígua dos destinatários, sem decidir se são seres celestes ou uma designação figurada de seres humanos.
- source_word: ወኵሎ፡ ግብር፡ ለልዑል
  choice: e toda obra do Altíssimo
  rationale: A conjunção é mantida, ligando “o céu” e “toda obra” como objetos coordenados. “Obra” conserva a amplitude do termo, e “Altíssimo” é a forma tradicional e adequada do título divino.
- source_word: ወፍርሁ፡ እምኔሁ
  choice: temam-no
  rationale: Mantém tanto a ideia de temor quanto sua possível nuance reverencial, em registro bíblico natural.
- source_word: ወኢትግበሩ፡ እኩየ፡ በቅድሜሁ
  choice: e não façam o mal diante dele
  rationale: Reproduz a proibição moral e conserva a expressão relacional “diante dele”, que sugere sua presença e seu escrutínio.
theological_decisions:
- issue: Identidade dos “filhos do céu”
  choice: Manter a designação literal “filhos do céu”
  alternative: “seres celestes” ou “filhos celestiais”
  rationale: O texto não identifica explicitamente os destinatários. A tradução literal preserva a tensão entre uma referência a seres celestes e uma possível designação figurada de seres humanos.
- issue: Natureza do temor ao Altíssimo
  choice: “temam-no”
  alternative: “reverenciem-no”
  rationale: “Temer” preserva a amplitude teológica do termo, que pode abranger medo e reverência, sem reduzir antecipadamente um aspecto ao outro.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem e a coordenação do ge’ez foram preservadas sem tornar a frase artificial; o vocativo foi pontuado para clareza.
