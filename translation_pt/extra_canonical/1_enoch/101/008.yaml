base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/008.yaml
  text: Was it not he who made heaven and earth and everything that is in them? Who gave instruction and wisdom to all who move upon the earth and to those at sea?[a][b][c]
translation:
  language: pt
  text: Não foi ele quem fez o céu, a terra e tudo o que neles existe?[a] Quem deu ensinamento e sabedoria a todos os que se movem sobre a terra e aos que estão no mar?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que há dentro deles”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “os que estão no mar” pode referir-se a navegantes ou, de modo mais amplo, aos que se relacionam com o mar; o ge'ez é conciso.
    reason: lexical_alternative
  - marker: c
    text: 'Algumas traduções ligam a segunda pergunta à primeira: “E quem deu...”.'
    reason: previous_rendering
lexical_decisions:
- source_word: አኮኑ
  choice: Não foi ele quem
  rationale: Introduz uma pergunta retórica que espera concordância e combina naturalmente com o sentido passado de ገብረ.
- source_word: ገብረ
  choice: fez
  rationale: Preserva o sentido amplo de fazer, sem impor o termo teologicamente mais específico «criou».
- source_word: ሰማየ ወምድረ
  choice: o céu, a terra
  rationale: Segue as formas singulares do ge'ez e expressa em português natural o par que abrange a ordem criada.
- source_word: ወኵሎ ዘሀሎ ውስቴቶሙ
  choice: e tudo o que neles existe
  rationale: Reproduz a abrangência da expressão; «neles» retoma céu e terra.
- source_word: ወሀበ
  choice: deu
  rationale: O pretérito perfeito coordena-se com «fez» e mantém a força direta da pergunta.
- source_word: ትምህርተ
  choice: ensinamento
  rationale: Comunica ensino ou instrução transmitida em linguagem corrente e digna.
- source_word: ጥበበ
  choice: sabedoria
  rationale: É a correspondência mais natural no contexto sapiencial e preserva a amplitude do termo.
- source_word: ለኵሉ እለ ይትኀወሱ ዲበ ምድር
  choice: a todos os que se movem sobre a terra
  rationale: Mantém a ideia de movimento sem restringir os referentes apenas a moradores ou seres humanos.
- source_word: ወለእለ ባሕር
  choice: e aos que estão no mar
  rationale: Conserva o contraste entre terra e mar e a concisão ambígua do ge'ez sem especificar marinheiros ou criaturas marinhas.
theological_decisions:
- issue: Uso de linguagem tecnicamente criacionista
  choice: fez
  alternative: criou
  rationale: O verbo ge'ez é mais amplo que um termo técnico para criação; «fez» preserva a afirmação de Deus como autor do cosmos sem acrescentar precisão doutrinária.
- issue: Identidade dos destinatários do ensinamento e da sabedoria
  choice: todos os que se movem sobre a terra e os que estão no mar
  alternative: todas as pessoas em terra e no mar; todas as criaturas da terra e do mar
  rationale: A redação é abrangente e não determina inequivocamente se se refere apenas a seres humanos, a navegantes ou a criaturas; a tradução mantém essa abertura.
- issue: Relação sintática da segunda pergunta
  choice: Quem deu
  alternative: E quem deu
  rationale: O texto ge'ez inicia a segunda pergunta com መኑ, sem conjunção, preservando sua força retórica abrupta.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e inteligível internacionalmente. A formulação mantém as duas perguntas retóricas, evita especificar indevidamente os referentes de «os que estão no mar» e conserva «fez» em vez do termo mais interpretativo «criou».
