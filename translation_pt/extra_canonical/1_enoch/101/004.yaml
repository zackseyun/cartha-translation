base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/004.yaml
  text: Have you not seen the captains of the ships[a], how they are tossed by the waves, and their ships are shaken by the winds[c][b], and they are distressed?
translation:
  language: pt
  text: Vocês não viram como os capitães dos navios[a] são sacudidos pelas ondas[b], como seus navios são abalados pelos ventos e como eles ficam aflitos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, a expressão também pode ser entendida como “os que governam os navios”; isto é, seus comandantes ou capitães.
    reason: lexical_alternative
  - marker: b
    text: A forma etíope preservada nesta transcrição parece defeituosa; o contexto e a provável leitura እምሞገድ sustentam “pelas ondas”.
    reason: textual_note
lexical_decisions:
- source_word: ኢትሬእይዎሙኑ
  choice: Vocês não viram
  rationale: A forma negativa interrogativa introduz uma pergunta retórica dirigida a um grupo. O pretérito perfeito é natural em português e mantém o apelo à experiência dos ouvintes.
- source_word: ለተነገሥተ፡ አሕማር
  choice: os capitães dos navios
  rationale: A expressão composta designa os que comandam navios, não literalmente “reis dos navios”. “Capitães” preserva a função concreta no cenário marítimo.
- source_word: እፎ
  choice: como
  rationale: Introduz o modo da ação seguinte e conserva o caráter vívido da observação.
- source_word: ይትሀወኩ
  choice: são sacudidos
  rationale: O verbo exprime agitação ou perturbação. No contexto de ondas e navios, “sacudidos” comunica naturalmente o movimento violento sem eliminar sua repercussão emocional.
- source_word: እምገደ
  choice: pelas ondas
  rationale: A leitura transmitida parece refletir uma forma corrompida ou abreviada de እምሞገድ, “pelas ondas”. Essa restauração é confirmada pela coerência do paralelismo marítimo.
- source_word: ወያንቀለቅሉ
  choice: são abalados
  rationale: O verbo descreve o forte balanço ou tremor das embarcações. “Abalados” mantém tanto a força física quanto o tom solene.
- source_word: እምነፋሳት
  choice: pelos ventos
  rationale: ነፋሳት é o plural de “vento” neste contexto, e a preposição indica a causa ou o agente do abalo.
- source_word: አሕማሮሙ
  choice: seus navios
  rationale: Trata-se de “navios” com sufixo possessivo masculino plural, não de “suas almas”. A tradução explicita o sujeito da segunda oração para evitar ambiguidade em português.
- source_word: ወይትመነደቡ
  choice: e como ficam aflitos
  rationale: O verbo final expressa angústia ou perturbação interior. “Ficam aflitos” conserva a intensidade sem ampliá-la indevidamente para terror absoluto.
theological_decisions:
- issue: Se o perigo marítimo deve ser convertido numa metáfora explícita sobre a instabilidade dos poderosos
  choice: Manter na tradução a cena marítima literal e deixar sua possível força moral ou simbólica implícita
  alternative: Explicar os capitães e os navios como imagem direta de governantes cuja segurança desmorona sob o juízo
  rationale: O texto apresenta concretamente capitães, navios, ondas e ventos. O contexto exortativo pode conferir valor figurado à cena, mas a tradução não deve impor uma identificação que o versículo não formula.
translation_notes:
  register: 'Português moderno, claro e solene, com tratamento plural por “vocês” para tornar explícito o destinatário coletivo. O paralelismo foi preservado: os capitães são sacudidos pelas ondas, seus navios são abalados pelos ventos, e eles ficam aflitos. A conjunção “enquanto” distingue com clareza os capitães das embarcações sem romper a sequência do original.'
