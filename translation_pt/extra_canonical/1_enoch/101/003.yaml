base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/003.yaml
  text: And if he sends his wrath upon you for all your deeds[a], will you not entreat him? For you speak great and harsh words against his righteousness[d][c][b], and you have no peace.
translation:
  language: pt
  text: E, se ele enviar sua ira sobre vocês por causa de todos os seus atos, vocês não lhe suplicarão? Pois vocês proferem palavras grandes e duras contra a justiça dele[a] e não têm paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a retidão dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈነወ
  choice: enviar
  rationale: Conserva o sentido básico de fazer seguir ou dirigir a ira contra os destinatários, sem intensificação indevida.
- source_word: መዐቶ
  choice: ira
  rationale: Mantém a força apocalíptica e judicial da indignação divina neste contexto.
- source_word: በኵሉ ምግባሪክሙ
  choice: por causa de todos os seus atos
  rationale: Expressa claramente a relação causal entre a conduta inteira dos ouvintes e a ira enviada sobre eles.
- source_word: ታስተበቍዕዎ
  choice: lhe suplicarão
  rationale: O verbo indica implorar ou fazer súplica; a forma futura em pergunta retórica comunica naturalmente que, ao vir o juízo, eles recorrerão a ele.
- source_word: ጽድቅ ዚአሁ
  choice: a justiça dele
  rationale: Neste contexto de juízo, 'justiça' é natural em português e ainda pode designar a retidão moral de Deus, sem restringir a expressão a um veredito judicial.
- source_word: ዐቢይተ ወጽኑዓተ
  choice: palavras grandes e duras
  rationale: Preserva de perto o idiomatismo enoquiano, em vez de convertê-lo interpretativamente em 'orgulhosas e insolentes'.
- source_word: አልብክሙ ሰላመ
  choice: não têm paz
  rationale: Mantém a fórmula breve e solene de juízo do texto.
theological_decisions:
- issue: Sentido de ጽድቅ no contexto de condenação
  choice: a justiça dele
  alternative: a retidão dele
  rationale: O contexto judicial favorece 'justiça', mas a nota registra 'retidão' para preservar a possível referência mais ampla à qualidade moral divina.
- issue: Referente do sujeito que envia a ira
  choice: ele enviar sua ira
  alternative: Deus enviar sua ira
  rationale: O texto ge'ez emprega sujeito pronominal, não um nome divino explícito; manter 'ele' evita acrescentar especificidade.
- issue: Função de አኮ
  choice: vocês não lhe suplicarão?
  alternative: vocês não podem lhe suplicar
  rationale: A partícula é entendida como introdutora de uma pergunta retórica que espera resposta afirmativa, em vez de uma negação simples; isso preserva a tensão de que os pecadores suplicarão quando o juízo vier.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural 'vocês' explicita o destinatário coletivo. A expressão deliberadamente incomum 'palavras grandes e duras' conserva o vocabulário técnico e recorrente de 1 Enoque.
