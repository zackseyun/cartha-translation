base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/006.yaml
  text: Is not the whole sea[a], and all its waters, and all its movements[c][b], the work of the Most High? And he has measured all its works and bound its shores with sand.
translation:
  language: pt
  text: Não é o mar inteiro, com todas as suas águas e todos os seus movimentos[a], obra do Altíssimo? Ele mediu todas as suas obras e delimitou suas margens com areia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo também pode designar mais especificamente a agitação, as vagas ou as ondas do mar.
    reason: lexical_alternative
  - marker: b
    text: A cláusula final é textualmente difícil. A forma transcrita pode ser entendida mais literalmente como “prendeu suas fundações com areia”; outra leitura do texto etíope dá o sentido de que Deus conteve inteiramente o mar com areia. A tradução no texto expressa a ideia contextual de um limite fixado para o mar.
    reason: textual_variant
lexical_decisions:
- source_word: አኮ
  choice: Não é
  rationale: Mantém a força de uma pergunta retórica que espera resposta afirmativa.
- source_word: ኵሉ ባሕር
  choice: o mar inteiro
  rationale: A leitura coletiva singular harmoniza com os sufixos femininos singulares que retomam o mar no restante do versículo.
- source_word: ማያቲሃ
  choice: todas as suas águas
  rationale: Conserva o plural do ge'ez e soa natural em português.
- source_word: ሑሳታ
  choice: todos os seus movimentos
  rationale: Expressa de modo amplo a agitação do mar sem restringir indevidamente o termo a ondas ou vagas.
- source_word: ግብረ ልዑል
  choice: obra do Altíssimo
  rationale: Identifica o mar e seus fenômenos como criação divina e preserva o título elevado de Deus.
- source_word: ዐቀመ
  choice: mediu
  rationale: Preserva a imagem cosmológica de Deus determinando a medida e a ordem do mar.
- source_word: አሰረ
  choice: delimitou
  rationale: Verte de forma idiomática, no contexto marítimo, a ideia de prender ou conter dentro de limites.
- source_word: እብንታሃ ቡኖባ
  choice: suas margens com areia
  rationale: Adota no texto principal a leitura contextual de que Deus conteve o mar pela areia, deixando em nota a dificuldade da forma transmitida e outras possibilidades.
theological_decisions:
- issue: Título divino ልዑል
  choice: o Altíssimo
  alternative: o Excelso
  rationale: “O Altíssimo” é um título divino reconhecível em português, conserva o peso teológico judaico-apocalíptico e não introduz formulação confessional posterior.
- issue: Referente de “suas obras”
  choice: as obras ou operações do mar
  alternative: as obras de Deus
  rationale: Os sufixos femininos singulares favorecem a referência ao mar; a formulação portuguesa conserva alguma tensão referencial sem explicá-la dentro do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica e a imagem poética do domínio divino sobre o mar foram preservadas; a dificuldade textual da cláusula final foi explicitada, não ocultada.
