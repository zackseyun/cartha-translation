base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/009.yaml
  text: Do not those kings of the sea fear the sea[b][a], while sinners do not fear the Most High?
translation:
  language: pt
  text: Não temem o mar aqueles reis dos navios[a], enquanto os pecadores não temem o Altíssimo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “reis dos navios”. A expressão etíope é textualmente difícil e parece designar os que comandam ou conduzem navios; “marinheiros” ou “navegantes” são traduções possíveis.
    reason: textual_variant
lexical_decisions:
- source_word: አኮኑ
  choice: Não ...?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; a construção negativa conserva essa força em português.
- source_word: ውእቶሙ
  choice: aqueles
  rationale: Preserva o valor demonstrativo do termo e o liga naturalmente à expressão nominal seguinte.
- source_word: ተነገሥተ አሕማር
  choice: reis dos navios
  rationale: Mantém a imagem incomum e a repetição da expressão que também ocorre no contexto próximo, sem substituí-la silenciosamente por uma interpretação como “marinheiros”. A dificuldade textual e semântica é indicada em nota.
- source_word: ይፈርህዋ ለባሕር
  choice: temem o mar
  rationale: Traduz diretamente o verbo comum para “temer” e preserva o objeto concreto do temor.
- source_word: ወኃጥኣን
  choice: enquanto os pecadores
  rationale: Expressa em português o contraste retórico introduzido pela conjunção, sem apagar seu valor coordenativo básico.
- source_word: ለልዑል
  choice: o Altíssimo
  rationale: Título divino bíblico corrente e natural em português, correspondente ao sentido de “o Mais Alto” ou “o Excelso”.
- source_word: ኢይፈርህዎ
  choice: não temem
  rationale: Repete o mesmo verbo empregado na primeira oração, conservando o paralelismo deliberado entre temer o mar e não temer o Altíssimo.
theological_decisions:
- issue: Tratamento de ልዑል como título divino
  choice: o Altíssimo
  alternative: o Excelso
  rationale: O contexto emprega o termo como título de Deus. “O Altíssimo” preserva o uso judaico bíblico e do período do Segundo Templo sem acrescentar formulação doutrinária posterior.
- issue: Contraste entre o temor do mar e o temor de Deus
  choice: Repetir “temem” nas duas orações
  alternative: Usar “têm medo” na primeira e “reverenciam” na segunda
  rationale: O texto repete o mesmo verbo; manter “temer” deixa intacta a tensão entre medo e reverência, sem decidir que os dois usos tenham sentidos distintos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da frase foi ajustada para soar natural, mas foram preservados a pergunta retórica, o paralelismo verbal e a imagem incomum do texto etíope.
