base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/005.yaml
  text: And because of this they fear[a], for all their good possessions go out into the sea with them, and they do not think good in their hearts[b], for the sea will swallow them and they will sink in it.
translation:
  language: pt
  text: E por causa disso eles têm medo,[a] pois todos os seus bens valiosos vão com eles para o mar, e eles não pensam em nada de bom no coração,[b] porque o mar os engolirá, e eles afundarão nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles temem”.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão também pode ser entendida como: “eles não pensam em seus bens no coração”. O termo traduzido por “bom” pode retomar os “bens valiosos” mencionados anteriormente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይፈርሁ
  choice: eles têm medo
  rationale: O imperfeito funciona aqui como presente gnômico, em continuidade com a descrição dos marinheiros; a expressão é natural em português moderno.
- source_word: ኵሉ ንዋዮሙ ሠናይ
  choice: todos os seus bens valiosos
  rationale: ንዋይ designa bens ou posses, e ሠናይ qualifica seu valor ou qualidade; a tradução evita confundir a expressão com bondade abstrata.
- source_word: ይወፅእ ውስተ ባሕር ምስሌሆሙ
  choice: vão com eles para o mar
  rationale: Mantém o sentido ativo de sair/ir e a ideia de que os bens acompanham seus donos, sem introduzir a noção passiva de serem lançados.
- source_word: ወሠናየ ኢይሐልዩ በልቦሙ
  choice: e eles não pensam em nada de bom no coração
  rationale: Expressa de modo natural a negação de pensar algo bom, preservando a referência ao coração e sem impor uma interpretação moral desenvolvida.
- source_word: ባሕር ይውኅጦሙ
  choice: o mar os engolirá
  rationale: Conserva a imagem concreta e vigorosa do mar que engole os marinheiros.
- source_word: ወይትኀጐሉ ውስቴታ
  choice: e eles afundarão nele
  rationale: No contexto marítimo, comunica de modo direto sua submersão ou ruína dentro do mar, sem ampliar para uma formulação abstrata.
theological_decisions:
- issue: Sentido de ሠናየ na cláusula sobre o pensamento do coração
  choice: algo bom, entendido de forma aberta como pensamento ou expectativa positiva
  alternative: seus bens, retomando as posses valiosas mencionadas antes
  rationale: A formulação principal preserva a leitura psicológica adequada à cena de terror no mar, mas a nota registra a possibilidade lexical de referência retrospectiva aos bens, sem transformar a frase em censura moral explícita.
- issue: Relação temporal entre o medo presente e o destino no mar
  choice: presente gnômico para a reação dos marinheiros e futuro para o resultado expresso por ‘engolirá’ e ‘afundarão’
  alternative: traduzir todos os imperfeitos como futuro
  rationale: O presente mantém a continuidade descritiva do contexto, enquanto o futuro em português apresenta naturalmente o perigo que eles antecipam como causa do medo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção conserva a repetição causal do ge’ez e mantém a ambiguidade da frase sobre o que se pensa no coração.
