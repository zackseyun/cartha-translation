base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/007.yaml
  text: And at his rebuke it will be afraid and dry up[a], and all its fish will die, and everything that is in it[c][b]. But you sinners who are upon the earth do not fear him.
translation:
  language: pt
  text: E, à sua repreensão, ela terá medo e secará[a]; todos os seus peixes morrerão, e tudo o que nela existe também morrerá. Mas vocês, pecadores que estão sobre a terra, não o temem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ela” se refere ao mar ou às águas mencionadas no contexto anterior. O ge'ez usa formas femininas para a reação dela e para o que há nela.
    reason: cross_reference
  - marker: b
    text: 'O objeto é masculino no ge''ez: os pecadores não temem a Deus, aquele cuja repreensão faz o mar ficar com medo e secar.'
    reason: lexical_clarification
lexical_decisions:
- source_word: በተግሣጹ
  choice: diante da repreensão dele
  rationale: A preposição በ admite valor circunstancial ou instrumental, e o sufixo -u é masculino singular, referindo-se a Deus, não ao mar. “Diante da repreensão dele” soa natural e preserva a reação da criação à censura divina.
- source_word: ትፈርህ ወትየብስ
  choice: ela ficará com medo e secará
  rationale: Os verbos femininos singulares retomam o mar ou corpo de água do contexto anterior. A tradução conserva tanto a personificação pelo medo quanto o sentido direto de tornar-se seco.
- source_word: ዓሣቲሃ
  choice: seus peixes
  rationale: O substantivo traz sufixo possessivo feminino singular, que remete ao mar.
- source_word: ይመውት
  choice: morrerão
  rationale: “Morrer” é concreto e direto; o plural em português concorda naturalmente com “peixes”.
- source_word: ኵሉ ዘሀሎ ውስቴታ
  choice: tudo o que nela existe
  rationale: Preserva a ampliação do juízo para além dos peixes e mantém explícito o referente feminino.
- source_word: ኃጥኣን
  choice: pecadores
  rationale: É a designação moral direta e recorrente no discurso apocalíptico.
- source_word: እለ ዲበ ምድር
  choice: que estão sobre a terra
  rationale: Representa o sentido locativo sem acrescentar a noção de habitar.
- source_word: ኢትፈርህዎ
  choice: não o temem
  rationale: O sufixo de objeto -wo é masculino singular e aponta para Deus, em contraste com os sufixos femininos que se referem ao mar.
theological_decisions:
- issue: Distinção entre o referente divino masculino e o mar feminino
  choice: “repreensão dele” e “não o temem” referem-se a Deus; “ela” e “nela” referem-se ao mar
  alternative: Tomar todos os pronomes como referências ao mar
  rationale: A morfologia ge'ez distingue o sufixo masculino singular em በተግሣጹ e ኢትፈርህዎ dos verbos e sufixos femininos ligados ao mar. A tradução deve conservar essa oposição.
- issue: Personificação do mar
  choice: “ela ficará com medo”
  alternative: “ele tremerá” ou uma formulação impessoal
  rationale: O verbo exprime medo e está no feminino singular. Manter a personificação preserva a força da imagem apocalíptica sem intensificá-la para “tremer”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A alternância entre “dele/o” para Deus e “ela/nela” para o mar reproduz uma distinção gramatical decisiva do texto ge'ez. Pronomes divinos permanecem em minúsculas conforme o uso editorial contemporâneo.
