base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/002.yaml
  text: If he shuts the windows of heaven[a], and withholds the rain and the dew so that it does not come down upon the earth because of you[c][b], what will you do?
translation:
  language: pt
  text: Se ele fechar as janelas do céu[a] e retiver a chuva e o orvalho, para que não desçam sobre a terra por causa de vocês, o que vocês farão?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “janelas do céu” preserva a antiga imagem cosmológica de aberturas celestes pelas quais vinha a chuva.
    reason: cultural_note
  - marker: b
    text: 'A frase final é uma pergunta retórica. Mais literalmente: “Que é que vocês farão?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዐፀወ
  choice: fechar
  rationale: Expressa diretamente a ação de fechar e combina naturalmente com a imagem concreta das janelas do céu.
- source_word: መስኮተ ሰማይ
  choice: as janelas do céu
  rationale: Preserva a imagem cosmológica antiga e sua ressonância bíblica, sem convertê-la em linguagem meteorológica moderna.
- source_word: ከለአ ዝናመ
  choice: retiver a chuva
  rationale: O verbo indica impedir ou reter; “retiver” comunica com naturalidade o controle da precipitação.
- source_word: ወጠለ
  choice: e o orvalho
  rationale: Mantém a segunda fonte de umidade mencionada no texto e o paralelismo agrícola entre chuva e orvalho.
- source_word: ከመ ኢይረድ ዲበ ምድር
  choice: para que não desçam sobre a terra
  rationale: O plural retoma explicitamente “a chuva e o orvalho” e preserva o sentido de ambos não descerem sobre a terra.
- source_word: በእንቲአክሙ
  choice: por causa de vocês
  rationale: No contexto de juízo, exprime de modo direto a relação causal entre os destinatários e a privação da chuva e do orvalho.
- source_word: ሚሀለወክሙ ትግበሩ
  choice: o que vocês farão?
  rationale: Reproduz a pergunta retórica e o desafio à impotência humana sem acrescentar um advérbio consequencial ausente do texto.
theological_decisions:
- issue: Agente que fecha o céu
  choice: Manter o sujeito pronominal singular “ele”
  alternative: Explicitar “Deus” ou “o Senhor”
  rationale: O ge'ez apresenta um sujeito singular sem nomeá-lo neste versículo. “Ele” preserva a sintaxe e evita inserir um título divino que o testemunho não traz explicitamente, embora o contexto sugira agência divina.
- issue: Valor de በእንቲአክሙ
  choice: “por causa de vocês”
  alternative: “por vocês” ou “em favor de vocês”
  rationale: O contexto de retenção da chuva favorece o sentido causal ligado ao juízo, mas a tradução não amplia a acusação além da expressão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva a imagem antiga, usa “vocês” para o plural e faz a concordância plural em “desçam” para retomar conjuntamente a chuva e o orvalho.
