base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/013.yaml
  text: And that Head of Days came with Michael and Raphael and Gabriel and Phanuel[c][b][a], and thousands and ten thousands of angels who have no number.
translation:
  language: pt
  text: E aquele, a Cabeça dos Dias, veio com Miguel, Rafael, Gabriel e Fanuel,[a][b] e com milhares e dezenas de milhares de anjos que não têm número.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O título «Cabeça dos Dias» também é traduzido tradicionalmente como «Ancião de Dias». Aqui se mantém uma forma mais próxima do ge'ez, sem harmonizá-la com a conhecida expressão de Daniel.
    reason: lexical_alternative
  - marker: b
    text: Os nomes dos anjos aparecem aqui em suas formas portuguesas correntes; o ge'ez traz formas correspondentes a Mikael, Rufael, Gabr'el e Fanuel.
    reason: cultural_note
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: Cabeça de Dias
  rationale: Mantém de perto a construção etíope e sua força titular, sem substituí-la pela formulação tradicional «Ancião de Dias», associada a Daniel.
- source_word: መጽአ
  choice: veio
  rationale: Verbo simples e natural de movimento, adequado à sequência da visão.
- source_word: ምስለ
  choice: com
  rationale: Expressa diretamente o acompanhamento; a segunda ocorrência antes da multidão angélica é explicitada em português para dar clareza à coordenação.
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: Miguel, Rafael, Gabriel e Fanuel
  rationale: Emprega as formas portuguesas correntes dos nomes, preservando Fanuel como forma reconhecível e próxima do testemunho etíope.
- source_word: አእላፍ ወትእልፊተ
  choice: milhares e dezenas de milhares
  rationale: Conserva concretamente os dois termos numéricos e o paralelismo apocalíptico, sem reduzi-los ao termo mais interpretativo «miríades».
- source_word: መላእክት
  choice: anjos
  rationale: No contexto da corte celestial, é a tradução contextual natural, em vez do sentido mais geral «mensageiros».
- source_word: እለ አልቦሙ ኍልቈ
  choice: cujo número não existe
  rationale: Reproduz a formulação abrupta do ge'ez e sua imagem de incontabilidade, evitando resolver a expressão apenas como «que não podiam ser contados».
theological_decisions:
- issue: Tradução do título divino ርእሰ መዋዕል
  choice: Cabeça de Dias
  alternative: Ancião de Dias
  rationale: A opção literal preserva a formulação distintiva do texto etíope e evita harmonizá-la silenciosamente com a linguagem tradicional de Daniel.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Conserva-se a estranheza intencional de «Cabeça de Dias» e da frase «cujo número não existe», enquanto os nomes próprios são apresentados nas formas portuguesas reconhecíveis.
