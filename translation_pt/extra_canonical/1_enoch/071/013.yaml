    issue: 'Construção titular pouco natural: «aquele Cabeça de Dias».'
    rationale: A construção não funciona bem em português moderno. Converter o título em aposição — «aquele, a Cabeça dos Dias,» — retém o demonstrativo e o título, sem introduzir interpretação teológica.
  - severity: medium
    issue: «Cujo número não existe» é uma formulação portuguesa inadequada para a incontabilidade da multidão.
    rationale: O ge'ez እለ አልቦሙ ኍልቈ expressa que os anjos não têm número/contagem. «Que não têm número» é próximo da fonte e compreensível sem sugerir que o conceito de número inexiste.
