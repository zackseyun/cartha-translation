base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/009.yaml
  text: And there came out from that house Mikael and Rufael and Gabr'el and Fanuel, and many holy angels without number.
translation:
  language: pt
  text: E saíram daquela casa Mikael, Rufael, Gabr'el e Fanuel,[a] e muitos santos anjos, inumeráveis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mikael, Rufael e Gabr'el transliteram as formas ge'ez, em vez de empregar as formas portuguesas mais conhecidas Miguel, Rafael e Gabriel; Fanuel é igualmente mantido conforme a forma ge'ez.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወወፅኡ
  choice: E saíram
  rationale: O verbo plural indica sair ou vir para fora; “saíram” conserva diretamente o movimento a partir da casa e é natural em português.
- source_word: እምኔ ውእቱ ቤት
  choice: daquela casa
  rationale: A expressão marca origem ou separação e remete a uma casa definida anteriormente; “daquela casa” preserva o valor dêitico.
- source_word: ሚካኤል
  choice: Mikael
  rationale: Transliteração orientada pela forma ge'ez, em vez da forma portuguesa tradicional “Miguel”.
- source_word: ሩፋኤል
  choice: Rufael
  rationale: Representa de modo simples a forma ge'ez, sem substituí-la pela forma portuguesa tradicional “Rafael”.
- source_word: ገብርኤል
  choice: Gabr'el
  rationale: Mantém o perfil consonantal da forma ge'ez; o apóstrofo assinala discretamente a separação silábica.
- source_word: ፋኑኤል
  choice: Fanuel
  rationale: Transliteração direta e legível da forma ge'ez.
- source_word: ብዙኃን ቅዱሳን መላእክት
  choice: muitos santos anjos
  rationale: Os adjetivos qualificam os anjos. “Santos anjos” mantém o registro apocalíptico e evita entender “santos” como um grupo humano separado.
- source_word: እለ አልቦሙ ኍልቈ
  choice: inumeráveis
  rationale: A oração relativa afirma idiomaticamente que eles não têm número; “inumeráveis” comunica isso com concisão e dignidade.
theological_decisions:
- issue: Sentido de ቅዱሳን no contexto angélico
  choice: santos anjos
  alternative: anjos que são santos
  rationale: Neste contexto, ቅዱሳን qualifica diretamente መላእክት. A tradução evita importar o sentido eclesial posterior de “santos” como categoria humana.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A colocação de “santos” antes de “anjos” preserva a unidade da expressão; “inumeráveis” evita uma construção excessivamente literal sem perder o sentido.
