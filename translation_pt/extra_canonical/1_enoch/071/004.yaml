base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/004.yaml
  text: And he showed me all the hidden things of the ends of heaven[a], and all the storehouses of the stars and the lights[c][b], from where they all come forth before the face of the holy ones.
translation:
  language: pt
  text: E ele me mostrou todas as coisas ocultas dos confins do céu e todos os depósitos das estrelas e das luzes[a], de onde todas elas saem na presença dos santos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das estrelas e dos luminares”. O ge'ez distingue as estrelas de uma categoria mais ampla de luzes celestes.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante da face dos santos”. A expressão significa “na presença dos santos”. Neste contexto, “santos” provavelmente designa seres celestes, mas o termo também pode referir-se aos justos, e o texto não os identifica mais precisamente.
    reason: ambiguity_and_idiom
lexical_decisions:
- source_word: አርአየኒ
  choice: ele me mostrou
  rationale: A forma causativa expressa fazer ver ou mostrar; esta escolha é natural em português e mantém a estrutura do relato visionário.
- source_word: ኵሎ ኅቡኣተ
  choice: todas as coisas ocultas
  rationale: Preserva a referência ampla a realidades escondidas, sem restringi-las a segredos esotéricos.
- source_word: አጽናፈ ሰማይ
  choice: os confins do céu
  rationale: Mantém a imagem cosmológica das extremidades ou fronteiras do céu em linguagem portuguesa digna e corrente.
- source_word: መዛግብተ
  choice: depósitos
  rationale: O termo designa lugares onde algo é guardado, isto é, tesouros ou armazéns; “depósitos” comunica a imagem das reservas celestes sem sugerir apenas riquezas.
- source_word: ከዋክብት ወብርሃናት
  choice: as estrelas e as luzes
  rationale: Conserva a distinção do ge'ez entre estrelas e uma categoria mais ampla de luzes celestes; “luminares” permanece como alternativa em nota.
- source_word: ኵሎሙ
  choice: todos eles
  rationale: Traduz a ênfase explícita de que todos os astros e luzes mencionados saem desses depósitos.
- source_word: እምኀበ ወፅኡ
  choice: de onde todos eles saem
  rationale: Expressa a procedência e o movimento indicados no original, em formulação clara e sem acrescentar destino não explicitado.
- source_word: ለገጸ ቅዱሳን
  choice: na presença dos santos
  rationale: Transmite naturalmente o semitismo literal “diante da face dos santos”, preservando “santos” sem definir se são seres celestes ou justos humanos.
theological_decisions:
- issue: Identidade dos “santos”
  choice: os santos
  alternative: os seres santos; os anjos; os consagrados
  rationale: O contexto celeste favorece seres santos do âmbito celestial, mas o texto não identifica o grupo de modo inequívoco. A tradução mantém a designação abrangente e registra a ambiguidade em nota.
translation_notes:
  register: Português moderno, claro e digno, com leve tonalidade apocalíptica. “Confins do céu” conserva a imagem cósmica; o semitismo ligado a “face” é esclarecido em nota, enquanto o texto principal emprega a expressão portuguesa natural “na presença”. Todos os marcadores de nota aparecem no texto principal.
