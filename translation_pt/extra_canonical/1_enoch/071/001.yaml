base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/001.yaml
  text: 'And after this it happened: my spirit was taken up[a], and it ascended into the heavens; and I saw the sons of the holy angels walking upon a flame of fire, and their garments were white[d][c][b], and their faces shone like snow.'
translation:
  language: pt
  text: Depois disso, aconteceu que meu espírito foi elevado e subiu aos céus. Vi os filhos dos santos anjos[a] caminhando sobre uma chama de fogo. Suas vestes eram brancas — e seus mantos também[b] —, e seus rostos resplandeciam como a neve[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge’ez “os filhos dos santos anjos” é incomum. Pode designar, de modo mais amplo, seres angélicos ligados aos santos anjos; a formulação literal foi preservada.
    reason: lexical_alternative
  - marker: b
    text: As palavras traduzidas por “e seus mantos também” aparecem entre colchetes na edição de base e podem ser uma glosa. Sem elas, o texto segue diretamente de “suas vestes eram brancas” para a descrição dos rostos.
    reason: textual_variant
  - marker: c
    text: “Como a neve” evoca aqui tanto o brilho quanto a brancura deslumbrante.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Depois disso
  rationale: Conserva a transição narrativa e a sequência da visão em português corrente.
- source_word: ትትከበት መንፈስየ
  choice: meu espírito foi elevado
  rationale: Expressa o transporte visionário por meio de uma construção passiva, sem definir além do texto quem realizou a ação.
- source_word: ተዐርገ ውስተ ሰማያት
  choice: subiu aos céus
  rationale: Mantém o plural de ሰማያት e evita achatar a cosmologia apocalíptica para o singular.
- source_word: ለውሉዶሙ ለመላእክት ቅዱሳን
  choice: os filhos dos santos anjos
  rationale: Preserva a expressão familiar incomum do ge’ez, em vez de normalizá-la para simplesmente ‘os santos anjos’.
- source_word: ይከይዱ ዲበ ላህበ እሳት
  choice: caminhando sobre uma chama de fogo
  rationale: Retém tanto a imagem concreta do movimento quanto a construção singular e vívida da chama.
- source_word: አልባሶሙ ጻዓዳ
  choice: Suas vestes eram brancas
  rationale: ‘Vestes’ é amplo, digno e não acrescenta uma espécie específica de roupa.
- source_word: '[ወዐጸፎሙ]'
  choice: e seus mantos também
  rationale: Representa no texto a palavra transmitida entre colchetes, entendida como ‘mantos’, enquanto ‘também’ fornece em português a elipse exigida pela construção incompleta; a nota registra a incerteza textual.
- source_word: ብሩሃን ገጾሙ ከመ በረድ
  choice: seus rostos resplandeciam como a neve
  rationale: Comunica luminosidade e brancura em português idiomático; ‘neve’ se ajusta à comparação visual do contexto.
theological_decisions:
- issue: Identidade dos ‘filhos dos santos anjos’
  choice: Manter a expressão familiar literal.
  alternative: os santos anjos
  rationale: A formulação ge’ez é incomum, mas inteligível. Preservá-la mantém a ambiguidade sobre a identidade desses seres sem harmonização doutrinária.
- issue: Agente da elevação do espírito de Enoque
  choice: Usar a voz passiva sem identificar o agente.
  alternative: Deus elevou meu espírito
  rationale: O texto descreve a elevação, mas não nomeia explicitamente quem a realizou; explicitar Deus resolveria uma questão deixada implícita.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A pontuação divide o longo encadeamento ge’ez em frases legíveis, enquanto os travessões deixam visível a inserção textual incerta. Evitaram-se arcaísmos como “semblantes” e especificações doutrinárias não presentes na fonte.
