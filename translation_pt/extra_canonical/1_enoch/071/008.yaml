revisions:
- from: E vi anjos que não podiam ser contados[a] — milhares de milhares e dez mil vezes dez mil — ao redor daquela casa. Mikael, Rufael, Gabr’el e Fanuel[b], juntamente com os santos anjos que estão acima dos céus, entravam e saíam daquela casa.
  to: E vi anjos que não podiam ser contados[a] — milhares de milhares e dez mil vezes dez mil —, que cercavam aquela casa. Mikael, Rufael, Gabr’el e Fan’uel[b], e os santos anjos que estão acima dos céus, entravam e saíam daquela casa.
  rationale: A revisão elimina uma explicitação sintática não exigida pela fonte, torna explícita a relação dos anjos com a ação de cercar a casa e uniformiza a transliteração dos dois nomes que contêm oclusiva glotal. Não resolve de modo interpretativo a imagem da casa nem a localização «acima dos céus».
  reviewer_model: gpt-5.6-terra
