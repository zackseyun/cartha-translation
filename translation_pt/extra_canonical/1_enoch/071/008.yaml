base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/008.yaml
  text: And I saw angels beyond number[a], thousands of thousands and ten thousand times ten thousand, surrounding that house; and Mikael and Rufael and Gabrʾel and Fanʾuel[b], and the holy angels who are above the heavens, were going in and coming out of that house.
translation:
  language: pt
  text: E vi anjos que não podiam ser contados[a] — milhares de milhares e dez mil vezes dez mil —, que cercavam aquela casa. Mikael, Rufael, Gabr’el e Fan’uel[b], e os santos anjos que estão acima dos céus, entravam e saíam daquela casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A fórmula numérica grandiosa é uma maneira apocalíptica convencional de retratar uma multidão celestial impossível de contar. A tradução mantém a expressão próxima do ge’ez, em vez de substituí-la por uma fórmula bíblica mais conhecida.
    reason: cultural_note
  - marker: b
    text: 'Os nomes seguem aqui as formas do ge’ez: Mikael, Rufael, Gabr’el e Fan’uel. As formas portuguesas tradicionais mais conhecidas são Miguel, Rafael, Gabriel e Fanuel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: Preserva a fórmula narrativa da visão em linguagem portuguesa natural e digna.
- source_word: መላእክተ
  choice: anjos
  rationale: O contexto celestial torna “anjos” mais preciso que o sentido lexical mais amplo de “mensageiros”.
- source_word: እለ ኢይትኌለቍ
  choice: que não podiam ser contados
  rationale: Traduz diretamente a impossibilidade de contar, sem reduzir a expressão a um simples adjetivo.
- source_word: አእላፈ አእላፍ ወትእልፊተ ትእልፊት
  choice: milhares de milhares e dez mil vezes dez mil
  rationale: Mantém a fórmula cumulativa de imensidão numérica e a torna transparente em português, sem substituí-la por fraseologia importada de outras passagens.
- source_word: የአውድዎ ለውእቱ ቤት
  choice: ao redor daquela casa
  rationale: Comunica a disposição dos anjos cercando a casa, com formulação natural; evita interpretar “casa” como palácio ou templo.
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: Mikael, Rufael, Gabr’el e Fanuel
  rationale: Translitera as formas ge’ez em grafia legível em português, em vez de normalizá-las silenciosamente para as formas bíblicas tradicionais.
- source_word: መላእክተ ቅዱሳን
  choice: os santos anjos
  rationale: Equivalência adjetival direta e idiomática em português.
- source_word: እለ መልዕልተ ሰማያት
  choice: que estão acima dos céus
  rationale: Conserva a imagem espacial e cosmológica sem convertê-la em um esquema técnico de níveis celestes.
- source_word: ይበውኡ ወይወፅኡ
  choice: entravam e saíam
  rationale: O imperfeito português apresenta como contínuo ou repetido o movimento observado na visão.
theological_decisions:
- issue: Normalização da fórmula de multidão celestial segundo expressões bíblicas mais familiares
  choice: milhares de milhares e dez mil vezes dez mil
  alternative: milhares de milhares e miríades de miríades
  rationale: A opção segue de perto a enumeração ge’ez e evita importar a redação tradicional de Daniel, Apocalipse ou versões litúrgicas.
- issue: Identidade da “casa” no cenário celestial
  choice: casa
  alternative: palácio ou templo
  rationale: Embora a casa funcione como morada celestial, o substantivo da fonte não exige uma identificação mais específica; a tradução preserva essa abertura.
- issue: Relação de “acima dos céus” com a oração final
  choice: a expressão qualifica os santos anjos
  alternative: a expressão localiza a casa acima dos céus
  rationale: A ordem e a estrutura relativa do ge’ez favorecem a ligação com “os santos anjos”, sem deslocar a expressão para caracterizar a casa.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é elevado sem arcaísmo. Os travessões ajudam a delimitar a extensa fórmula numérica, e “juntamente com” esclarece a coordenação da segunda série de seres celestiais sem alterar sua relação sintática essencial.
