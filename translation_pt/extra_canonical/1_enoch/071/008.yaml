  - severity: low
    issue: Transliteração inconsistente de Fanʾuel.
    rationale: A fonte contém ፋኑኤል (Fanʾuel); se Gabrʾel é grafado «Gabr’el», Fanʾuel deve ser grafado «Fan’uel» tanto no texto quanto na nota.
