review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a visão, a multidão incalculável, a fórmula numérica, a casa e o movimento de entrada e saída. Contudo, a construção «juntamente com» torna mais explícita do que o necessário a relação entre os quatro anjos nomeados e os anjos santos; a simples coordenação reproduz melhor a sintaxe da fonte. A transliteração de Fanʾuel também deve conservar de modo consistente a oclusiva glotal indicada na forma ge’ez, como já ocorre em Gabr’el.
  naturalness: O português é moderno, claro e apropriado ao registro visionário. «Que cercavam aquela casa» liga de forma mais direta os anjos à ação de rodear a casa do que o segmento solto «ao redor daquela casa».
  terminology: «Anjos», «casa», «santos anjos», «acima dos céus» e a fórmula «milhares de milhares e dez mil vezes dez mil» são escolhas fiéis e naturais. Mantêm-se Mikael e Rufael conforme a política de transliterar as formas ge’ez; Gabr’el e Fan’uel devem apresentar a mesma convenção para a oclusiva glotal.
  issues:
