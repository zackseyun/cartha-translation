base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/005.yaml
  text: And my spirit was covered in the heaven of heavens[a], and I saw there, in the midst of that light, something built of stones of hail[c][b], and in the midst of those stones were tongues of living fire.
translation:
  language: pt
  text: E o meu espírito foi ocultado no céu dos céus,[a] e ali vi, no meio daquela luz, algo construído com pedras de granizo;[b] e, no meio daquelas pedras, havia línguas de fogo vivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo desta linha é textualmente incerto. A tradução segue a leitura “foi ocultado”; também se propôs “foi elevado”.
    reason: textual_variant
  - marker: b
    text: “Pedras de granizo” também pode ser entendido como “saraiva” ou, possivelmente, “pedras de gelo”. A tradução conserva a imagem concreta e incomum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ከበቶ፡ መንፈስየ
  choice: o meu espírito foi ocultado
  rationale: A leitura revista entende o verbo a partir da raiz k-b-t, “ocultar, esconder”, possivelmente refletindo uma forma passiva corrompida na transcrição. “Foi ocultado” preserva o passivo e o vocabulário distintivo da trasladação visionária, sem decidir se a experiência foi corporal ou apenas interior.
- source_word: ውስተ፡ ሰማየ፡ ሰማያት
  choice: no céu dos céus
  rationale: Conserva o elevado semitismo superlativo do ge'ez, em vez de o reduzir interpretativamente a “céu mais alto”.
- source_word: ወርኢኩ፡ በህየ
  choice: e ali vi
  rationale: Forma direta e natural em português para a fórmula de relato visionário.
- source_word: ማእከለ፡ ዝኩ፡ ብርሃን
  choice: no meio daquela luz
  rationale: Mantém tanto a localização interna quanto a força demonstrativa da expressão.
- source_word: ከመ፡ ቦቱ፡ ዘይትነደቅ
  choice: algo construído
  rationale: A sintaxe e a transmissão da linha são difíceis. Esta formulação sugere uma construção sem definir indevidamente sua forma ou natureza.
- source_word: እምእብነ፡ አስሐትያ
  choice: com pedras de granizo
  rationale: Preserva a imagem apocalíptica concreta e estranha; “com” exprime de modo natural o material de construção em português.
- source_word: ልሳናተ፡ እሳት፡ ሕያው
  choice: línguas de fogo vivo
  rationale: Mantém literalmente a imagem de línguas ou formas de chama e a qualidade animada expressa por “vivo”.
theological_decisions:
- issue: Natureza da trasladação de Enoque
  choice: o meu espírito foi ocultado
  alternative: o meu espírito foi elevado / fui corporalmente elevado
  rationale: O ge'ez menciona explicitamente o espírito de Enoque e emprega linguagem passiva de ocultação. A tradução não determina se a experiência foi corporal, puramente interior ou de outra natureza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se o semitismo “céu dos céus”, a estranheza da imagem apocalíptica e a cautela exigida pela linha textualmente difícil.
