base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/010.yaml
  text: And with them was the Head of Days[a], and his head was like white and pure wool[c][b], and his garment cannot be described.
translation:
  language: pt
  text: E com eles estava a Cabeça dos Dias[a]. Sua cabeça era como lã branca e pura, e sua veste não podia ser descrita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Ancião de Dias”. A forma tradicional reflete a provável ressonância com Daniel, mas o ge''ez diz mais literalmente “a Cabeça dos Dias”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão final também pode ser entendida como “não podia ser explicada” ou “interpretada”. No contexto, indica que a veste ultrapassava uma descrição comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስሌሆሙ
  choice: com eles
  rationale: Traduz diretamente a preposição ምስለ, que expressa companhia ou associação; evita substituí-la por “entre eles”.
- source_word: ርእሰ መዋዕል
  choice: o Cabeça dos Dias
  rationale: Mantém a formulação própria do testemunho ge'ez e sua estranheza titular, sem harmonizá-la automaticamente com o título tradicional de Daniel.
- source_word: ፀምር
  choice: lã
  rationale: A comparação introduzida por ከመ aponta para a lã como objeto comparado, preservando a imagem concreta.
- source_word: ጻዕዳ ወንጹሕ
  choice: branca e pura
  rationale: Reproduz os dois qualificativos do ge'ez, conservando tanto a imagem visual quanto sua possível força simbólica sem especificá-la.
- source_word: ልብሱ
  choice: sua veste
  rationale: “Veste” é natural, digna e suficientemente ampla, sem restringir o termo a um tipo específico de roupa.
- source_word: ዘኢይትረጐም
  choice: não podia ser descrita
  rationale: No contexto visionário, comunica que a veste não admite descrição adequada, ao mesmo tempo que preserva em nota a possibilidade lexical de “explicada” ou “interpretada”.
theological_decisions:
- issue: Relação de ርእሰ መዋዕል com o título tradicional de Daniel 7
  choice: o Cabeça dos Dias
  alternative: o Ancião de Dias
  rationale: A tradução principal segue de perto o ge'ez local e evita resolver a ressonância daniélica por harmonização; a forma tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura foi levemente dividida em duas frases para fluência, sem eliminar o paralelismo visionário. O título incomum “Cabeça dos Dias” foi mantido deliberadamente para preservar a formulação da fonte.
