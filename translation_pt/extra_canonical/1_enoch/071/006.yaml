base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/006.yaml
  text: And my spirit saw the enclosure that surrounded that house of fire[a], and from its four sides were rivers full of living fire[d][c][b], and they surrounded that house.
translation:
  language: pt
  text: E meu espírito viu o recinto que cercava aquela casa de fogo[a] e rios que vinham de seus quatro lados[b], cheios de fogo vivo[c]; eles cercavam aquela casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “o circuito que circundava aquela casa de fogo”. O texto não especifica uma muralha.
    reason: alternative_reading
  - marker: b
    text: O termo traduzido por “lados” também pode significar extremidades, limites ou quadrantes; “quatro cantos” é possível, mas mais específico.
    reason: lexical_alternative
  - marker: c
    text: “Fogo vivo” traduz literalmente uma expressão incomum, que pode sugerir fogo animado, ativo ou intensamente vital.
    reason: lexical_alternative
lexical_decisions:
- source_word: መንፈስየ
  choice: meu espírito
  rationale: Em contexto visionário, መንፈስ designa naturalmente o espírito do vidente; a tradução conserva o espírito como sujeito da percepção.
- source_word: አውዶ / ዘየአውዶ
  choice: o recinto que cercava
  rationale: “Recinto” expressa algo que circunda ou delimita sem acrescentar a ideia específica de uma muralha, ausente do texto; “cercava” preserva a repetição da raiz de circundar.
- source_word: ቤተ እሳት
  choice: casa de fogo
  rationale: Mantém a construção genitiva e a imagem apocalíptica mais diretamente do que “casa ardente”.
- source_word: እምአርባዕቱ አጽናፊሁ
  choice: partindo de seus quatro lados
  rationale: “Lados” comunica os quatro limites ou quadrantes sem especificar indevidamente “cantos”; “partindo de” torna natural em português a relação indicada por እም.
- source_word: አፍላገ
  choice: rios
  rationale: O plural descreve cursos de água e “rios” preserva a grandeza da visão.
- source_word: ምሉኣነ እሳተ ሕያው
  choice: cheios de fogo vivo
  rationale: A expressão incomum é mantida literalmente, sem reduzi-la a simples fogo intenso ou flamejante.
- source_word: የአውድዎ
  choice: eles cercavam
  rationale: Retoma o motivo de circundar presente no início do versículo; o pronome se refere naturalmente aos rios.
theological_decisions:
- issue: Natureza da percepção visionária
  choice: E meu espírito viu
  alternative: E eu vi em espírito
  rationale: O texto ge'ez apresenta explicitamente “meu espírito” como sujeito de “viu”; conservar essa sintaxe preserva o modo apocalíptico da percepção e sua possível tensão antropológica.
- issue: Natureza do “fogo vivo”
  choice: fogo vivo
  alternative: fogo ardente
  rationale: A tradução não determina se o fogo é animado, ativo ou intensamente vital; preserva a formulação excepcional e sua ambiguidade.
- issue: Relação sintática dos rios com o verbo de visão
  choice: viu ... rios
  alternative: de seus quatro lados havia rios
  rationale: As formas acusativas favorecem entender “rios” como outro objeto de “viu”. A formulação portuguesa mantém essa relação, em vez de introduzir um verbo existencial não expresso.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi levemente ajustada com “partindo de” para evitar uma frase truncada, mas “rios” permanece como objeto de “viu”. A repetição de “cercava/cercavam” é intencional e reproduz a ênfase do original no envolvimento da casa.
