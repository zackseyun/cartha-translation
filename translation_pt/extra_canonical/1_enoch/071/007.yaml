base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/007.yaml
  text: And around it were the seraphim and the cherubim and the ophannim[b][a], and these are those who do not sleep and who keep watch over the throne of his glory.
translation:
  language: pt
  text: E ao redor dela estavam os serafins, os querubins e os ofanins[a], e estes são os que não dormem e vigiam o trono da glória dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ofanins” é a transliteração do nome de uma ordem celestial; o sentido subjacente está relacionado a “rodas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአውዶ
  choice: E ao redor dela estavam
  rationale: Preserva a disposição da cena e representa o sufixo pronominal de terceira pessoa singular, que retoma a estrutura mencionada no contexto anterior.
- source_word: ሱራፌን
  choice: serafins
  rationale: Emprega a designação tradicional dessa ordem celestial, mantendo o registro apocalíptico.
- source_word: ኪሩቤን
  choice: querubins
  rationale: Emprega a forma portuguesa estabelecida para essa classe celestial.
- source_word: አፋኒን
  choice: ofanins
  rationale: Translitera a designação de uma ordem celestial, em paralelo com serafins e querubins, sem reduzi-la à tradução literal «rodas».
- source_word: እሙንቱ
  choice: são eles
  rationale: Mantém a identificação enfática dos seres enumerados com a descrição que segue.
- source_word: እለ፡ ኢይነውሙ
  choice: os que não dormem
  rationale: Traduz diretamente a oração relativa negativa, sem acrescentar a ideia intensiva de «nunca».
- source_word: የዐቅቡ
  choice: vigiam
  rationale: Expressa vigilância atenta e guarda, de modo natural e conciso em português.
- source_word: መንበረ፡ ስብሐተ፡ ዚአሁ
  choice: o trono da glória dele
  rationale: Preserva a construção nominal «trono da glória» e mantém explícita a referência possessiva sem transformar a expressão em mero adjetivo.
theological_decisions:
- issue: Designação dos seres celestiais na visão do trono
  choice: Usar os nomes de classe «serafins», «querubins» e «ofanins»
  alternative: Traduzir አፋኒን literalmente como «rodas» ou generalizar todos como «seres celestiais»
  rationale: A enumeração apresenta ordens celestiais distintas. A transliteração conserva a especificidade cosmológica e a tensão entre nome de classe e sentido etimológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas tradicionais para serafins e querubins. O pronome «dela» retoma a estrutura do contexto anterior; «glória dele» evita uma possível ambiguidade referencial de «sua glória».
