base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/003.yaml
  text: And the angel Mika'el[a], one of the chief angels, took hold of my right hand and raised me up, and brought me out to all the hidden things; and he showed me all the hidden things of mercy[c][b], and he showed me all the hidden things of righteousness.
translation:
  language: pt
  text: E o anjo Mikael, um dos chefes dos anjos[a], segurou minha mão direita, ergueu-me e conduziu-me para fora, até todas as coisas ocultas[b]. Ele me mostrou todas as coisas ocultas da misericórdia e todas as coisas ocultas da retidão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “um dos cabeças dos anjos”; também se poderia traduzir “um dos arcanjos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os segredos”. O ge’ez repete neste versículo um termo que designa coisas escondidas ou encobertas.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “justiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ ሚካኤል
  choice: o anjo Mikael
  rationale: መልአከ designa aqui um ser celestial. A forma Mikael translitera o nome, evitando substituí-lo por uma forma portuguesa tradicional que obscureceria a correspondência com o original.
- source_word: ፩እምአርእስተ መላእክት
  choice: um dos chefes dos anjos
  rationale: A expressão indica literalmente alguém dentre as cabeças ou os chefes dos anjos. Esta formulação preserva a ideia de posição elevada sem impor o termo técnico posterior “arcanjo”.
- source_word: አኃዘኒ እዴየ ዘየማን
  choice: segurou minha mão direita
  rationale: O verbo expressa tomar ou segurar, e ዘየማን especifica a mão direita. A tradução mantém a ação concreta em português natural.
- source_word: አንሥአኒ
  choice: ergueu-me
  rationale: O verbo significa levantar ou erguer. “Ergueu-me” é claro, digno e adequado à sequência da visão.
- source_word: አውፅአኒ
  choice: levou-me
  rationale: A forma causativa comunica fazer sair ou conduzir para fora. No contexto, “levou-me até” expressa naturalmente o movimento em direção às realidades ocultas.
- source_word: ኀበ ኵሉ ኅቡአት
  choice: até todas as coisas ocultas
  rationale: ኅቡአት se refere a coisas escondidas ou encobertas. “Coisas ocultas” mantém o caráter apocalíptico e permite preservar a repetição lexical do versículo.
- source_word: ኅቡአተ ምሕረት
  choice: as coisas ocultas da misericórdia
  rationale: A construção liga diretamente aquilo que está oculto à misericórdia. “Misericórdia” traduz de modo direto ምሕረት, sem reduzi-la a mera bondade.
- source_word: ኅቡአተ ጽድቅ
  choice: as coisas ocultas da justiça
  rationale: ጽድቅ abrange retidão e justiça. Neste contexto, “justiça” é idiomático em português e forma um paralelo claro com “misericórdia”; a alternativa “retidão” é registrada em nota.
theological_decisions:
- issue: Designação da posição de Mikael entre os anjos
  choice: um dos chefes dos anjos
  alternative: um dos arcanjos; um dos cabeças dos anjos
  rationale: A tradução conserva a noção explícita de chefia presente no ge’ez sem transformar a expressão em uma categoria angelológica técnica mais definida do que o texto exige.
- issue: Sentido de ጽድቅ
  choice: justiça
  alternative: retidão
  rationale: O termo comporta ambos os sentidos. “Justiça” é natural no paralelo com misericórdia em português, enquanto “retidão” permanece uma alternativa legítima e é preservada na nota.
- issue: Repetição de ኅቡአት/ኅቡአተ
  choice: repetir “coisas ocultas” nas três ocorrências
  alternative: variar com “segredos” ou omitir parte da repetição
  rationale: A repetição estrutura o versículo e deve permanecer perceptível, mesmo que o português moderno pudesse estilisticamente reduzi-la.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem narrativa foi mantida, e a repetição deliberada de “coisas ocultas” preserva o paralelismo do ge’ez. Os pronomes enclíticos em “ergueu-me” e “levou-me” sustentam o registro literário sem recorrer a linguagem arcaica.
