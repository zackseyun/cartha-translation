base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/011.yaml
  text: And I fell on my face[a], and all my flesh melted away, and my spirit was transformed; and I cried out with a loud voice ... in the spirit of power[e][d][c][b], and I blessed and praised and exalted him.
translation:
  language: pt
  text: E caí com o rosto em terra, e toda a minha carne se derreteu, e meu espírito foi transformado[a]. Então clamei em alta voz...[b] no espírito de poder[c] e o abençoei, louvei e exaltei[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu espírito mudou”. O verbo ge''ez é difícil, e sua nuance exata é incerta.'
    reason: lexical_alternative
  - marker: b
    text: O texto da testemunha apresenta aqui uma aparente lacuna ou corrupção; as reticências refletem essa dificuldade textual.
    reason: textual_variant
  - marker: c
    text: 'Ou: “por um espírito de poder” ou “por meio do espírito de poder”. A expressão pode descrever tanto o estado interior de Enoque quanto o agente ou meio que lhe deu poder para falar.'
    reason: lexical_alternative
  - marker: d
    text: Literalmente, os três verbos finais não trazem objeto expresso; “o” foi suprido em português pelo contexto.
    reason: supplied_word
lexical_decisions:
- source_word: ወወደቁ፡ በገጽየ
  choice: E caí com o rosto em terra
  rationale: Expressa em português natural a postura concreta de cair sobre o rosto, sem decidir se foi prostração voluntária ou colapso involuntário.
- source_word: ኵሉ፡ ሥጋየ፡ ተመስወ
  choice: toda a minha carne se derreteu
  rationale: Conserva tanto o termo antropológico «carne» quanto a imagem apocalíptica vívida de dissolução diante da visão.
- source_word: መንፈስየ፡ ተወለጠ
  choice: meu espírito foi transformado
  rationale: Representa uma mudança interior significativa, mantendo em nota a incerteza do verbo ge'ez.
- source_word: ጸራኅኩ፡ በቃል፡ ዓቢይ
  choice: clamei em alta voz
  rationale: «Alta voz» comunica naturalmente o volume da voz em português e evita o literalismo pouco idiomático «grande voz».
- source_word: በመንፈሰ፡ ኃይል
  choice: no espírito de poder
  rationale: Mantém a formulação deliberadamente aberta, sem resolver se ela descreve o estado interior de Enoque ou o meio/agente capacitador.
- source_word: ወባረኩ፡ ወሰብሕኩ፡ ወአልዓልኩ
  choice: e o bendisse, louvei e exaltei
  rationale: Preserva a sequência tríplice de louvor em linguagem digna e natural; o pronome objeto é explicitado por exigência idiomática e assinalado em nota.
theological_decisions:
- issue: Força antropológica de «carne» no colapso visionário
  choice: toda a minha carne se derreteu
  alternative: todo o meu corpo se desfez
  rationale: O ge'ez emprega «carne»; retê-lo preserva a textura antropológica e a intensidade da experiência visionária.
- issue: Sentido do verbo difícil aplicado ao espírito
  choice: meu espírito foi transformado
  alternative: meu espírito mudou
  rationale: A tradução indica alteração interior sem identificar sua natureza; a nota registra uma alternativa mais neutra.
- issue: Função de «espírito de poder»
  choice: no espírito de poder
  alternative: por um espírito de poder
  rationale: A construção conserva a ambiguidade entre estado ou esfera interior e agência capacitadora, evitando uma definição teológica não exigida pelo texto.
- issue: Objeto dos verbos finais de louvor
  choice: suprir «o»
  alternative: deixar os verbos sem objeto expresso
  rationale: O texto ge'ez não traz objeto pronominal explícito, mas o português pede um complemento natural nesse encadeamento. A suplementação contextual é tornada transparente em nota.
translation_notes:
  register: Português moderno, amplo e digno, com legibilidade brasileira. A ordem e as imagens apocalípticas do ge'ez são preservadas, enquanto «alta voz» e «com o rosto em terra» evitam construções artificiais. As reticências marcam somente a lacuna textual atestada.
