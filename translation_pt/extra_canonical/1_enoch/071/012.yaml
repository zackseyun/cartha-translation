base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/012.yaml
  text: And those blessings that went out from my mouth became acceptable before that Head of Days[a][b][c].
translation:
  language: pt
  text: E aquelas bênçãos que saíram da minha boca tornaram-se aceitáveis diante daquela Cabeça de Dias[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram agradáveis diante daquela Cabeça de Dias”. O termo ge''ez traduzido por “tornaram-se aceitáveis” também pode ter o sentido de agradar ou ser recebido favoravelmente.'
    reason: lexical_alternative
  - marker: b
    text: “Cabeça de Dias” é o título empregado aqui no ge'ez. Ele permanece distinto do mais conhecido “Ancião de Dias”, para que a redação desta passagem não seja harmonizada silenciosamente com Daniel.
    reason: cross_reference
  - marker: c
    text: Algumas traduções anteriores trazem “a bênção que saiu”; contudo, o demonstrativo, o pronome relativo e os verbos correspondentes estão no plural no texto ge'ez.
    reason: previous_rendering
lexical_decisions:
- source_word: በረከት
  choice: bênçãos
  rationale: O substantivo designa bênção ou pronunciamento de bênção. O plural é exigido pelo demonstrativo, pelo relativo e pelas formas verbais plurais que o acompanham no ge'ez.
- source_word: ወፅኣ እምነ አፉየ
  choice: saíram da minha boca
  rationale: Preserva a imagem concreta e vívida de palavras que saem da boca, sem reduzir a expressão a simplesmente “falei”.
- source_word: ሥሙረተ
  choice: tornaram-se aceitáveis
  rationale: Expressa que as bênçãos encontraram aceitação ou favor. Mantém a força predicativa do original sem limitar o sentido a uma reação emocional.
- source_word: ቅድመ
  choice: diante de
  rationale: É uma formulação portuguesa natural para a relação espacial e cortesã de estar perante uma figura celestial.
- source_word: ዝኩ ርእሰ መዋዕል
  choice: aquela Cabeça de Dias
  rationale: “Aquela” representa o demonstrativo ዝኩ, e “Cabeça de Dias” conserva o título enóquico distintivo sem harmonizá-lo silenciosamente com Daniel.
theological_decisions:
- issue: Tradução do título divino ርእሰ መዋዕል
  choice: Cabeça de Dias
  alternative: Ancião de Dias
  rationale: A tradução segue a formulação do próprio texto ge'ez e preserva sua terminologia peculiar, em vez de importar o título mais conhecido de Daniel.
- issue: Número gramatical das bênçãos
  choice: aquelas bênçãos que saíram
  alternative: a bênção que saiu
  rationale: O demonstrativo እልኩ, o relativo እለ e as formas verbais ወፅኣ e ኮና apontam conjuntamente para o plural; por isso, a leitura singular não foi adotada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se a imagem concreta de algo que sai da boca e o título apocalíptico incomum “Cabeça de Dias”; as notas registram tanto a alternativa lexical legítima quanto a antiga leitura singular, gramaticalmente menos provável.
