base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/002.yaml
  text: And I saw two rivers of fire[a], and the light of that fire shone like hyacinth[b], and I fell on my face before the Lord of Spirits.
translation:
  language: pt
  text: E vi dois rios de fogo, e a luz daquele fogo[a] resplandecia como uma pedra de jacinto[b]; então caí com o rosto em terra diante do Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “a luz daquele fogo” é condensada no ge’ez e também pode ser entendida de modo mais livre como “seu fulgor de fogo”.
    reason: alternative_reading
  - marker: b
    text: O termo ge’ez provavelmente se refere a uma pedra preciosa tradicionalmente chamada jacinto; a identificação exata da gema antiga é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ክልኤተ፡ አፍላገ፡ እሳት
  choice: dois rios de fogo
  rationale: Mantém o numeral e a vívida imagem apocalíptica de cursos de fogo; “rios” comunica melhor sua grandeza do que “riachos” ou “correntes”.
- source_word: ብርሃነ፡ ዝኩ፡ እሳት
  choice: a luz daquele fogo
  rationale: Preserva o substantivo “luz”, a repetição de “fogo” e a força demonstrativa de ዝኩ, sem expandir a expressão condensada.
- source_word: ያክንት
  choice: uma pedra de jacinto
  rationale: O termo provavelmente designa a gema tradicionalmente chamada jacinto; acrescentar “pedra” evita que o leitor moderno pense primeiramente na flor, sem alegar uma identificação mineralógica exata.
- source_word: ያበርህ
  choice: resplandecia
  rationale: Expressa de modo natural e digno a emissão intensa de luz na visão.
- source_word: ወወደቁ፡ በገጽየ
  choice: então caí com o rosto em terra
  rationale: Reproduz a prostração física e reverente em português corrente; “então” liga naturalmente a reação à visão, sem alterar sua sequência.
- source_word: ቅድመ፡ እግዚአ፡ መንፈሳት
  choice: diante do Senhor dos Espíritos
  rationale: “Diante de” traduz a relação de presença, e “Senhor dos Espíritos” preserva o título divino recorrente nas Parábolas.
theological_decisions:
- issue: Forma do título divino እግዚአ መንፈሳት
  choice: Senhor dos Espíritos
  alternative: Senhor dos espíritos
  rationale: A capitalização assinala seu uso como título divino formulaico, sem definir quem são os “Espíritos” nem acrescentar uma interpretação denominacional.
- issue: Identificação da comparação com ያክንት
  choice: como uma pedra de jacinto
  alternative: como uma pedra preciosa
  rationale: Mantém o termo tradicional e a imagem específica do texto, enquanto a nota registra a incerteza quanto à identificação da gema antiga.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A coordenação visionária do original é preservada, enquanto o ponto e vírgula evita uma sequência excessivamente pesada.
