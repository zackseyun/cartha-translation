base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/029/001.yaml
  text: And from there I went into another place[a], away from the wilderness[c][b]; and I drew near to the east of this mountain.
translation:
  language: pt
  text: E dali fui para outro lugar, afastando-me da região deserta[a], e me aproximei do lado leste deste monte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do deserto” ou “da região erma”.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida como “lado leste” se refere literalmente à direção da manhã ou do nascer do sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእምህየኒ
  choice: E dali
  rationale: Mantém a transição narrativa e o ponto de partida indicado no contexto, em português atual e conciso.
- source_word: ሖርኩ ውስተ መካን ካልእ
  choice: fui para outro lugar
  rationale: Expressa o movimento para uma nova localização sem especificar indevidamente a natureza do lugar.
- source_word: እምነ መደባራ
  choice: afastando-me da região deserta
  rationale: Comunica a ideia de procedência ou afastamento de uma área erma; “região deserta” evita limitar o sentido a um deserto arenoso.
- source_word: ወመንገለ ጽባሕ
  choice: do lado leste
  rationale: A expressão se refere literalmente à direção da manhã ou do nascer do sol e, no contexto geográfico, indica o leste.
- source_word: ለደብር ዝንቱ ቀረብኩ
  choice: deste monte, me aproximei
  rationale: Preserva tanto o demonstrativo “deste” quanto o sentido de aproximação; a ordem final foi ajustada à sintaxe natural do português.
