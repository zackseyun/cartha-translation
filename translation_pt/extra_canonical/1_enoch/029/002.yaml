base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/029/002.yaml
  text: And there I saw trees of incense[a], with the fragrance of frankincense and myrrh, and trees also[c][b],
translation:
  language: pt
  text: E ali vi árvores de incenso[a], com intenso aroma de olíbano e mirra, e árvores também...[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra ge'ez transmitida aqui pode significar literalmente “julgamento” ou “condenação”. “Incenso” segue o contexto aromático; também se poderia traduzir “árvores aromáticas”. A palavra entre colchetes no meio do versículo é igualmente incerta.
    reason: textual_variant
  - marker: b
    text: 'O testemunho termina aqui com uma expressão incompleta: “e árvores também”. Outras formas do texto podem conservar uma descrição adicional, mas ela não foi acrescentada nesta tradução.'
    reason: alternative_reading
lexical_decisions:
- source_word: ወበህየ፡ ርኢኩ
  choice: E ali vi
  rationale: Reproduz de modo natural a transição narrativa e a fórmula visionária na primeira pessoa.
- source_word: ዕፀወ፡ ተኵነኔ
  choice: árvores de incenso
  rationale: O contexto aromático favorece esta leitura, adotada com nota porque a forma transmitida também pode ser entendida literalmente como «de julgamento».
- source_word: ተፈድፋደ፡ [ቈስቍስ፡] መዓዛ
  choice: com intenso aroma
  rationale: Expressa a intensificação do aroma sem atribuir valor lexical seguro à palavra entre colchetes, cuja leitura é incerta.
- source_word: ስኂን፡ ወከርቤ
  choice: de olíbano e mirra
  rationale: Identifica os dois aromas nomeados no ge'ez; «olíbano» distingue a resina específica do termo mais amplo «incenso».
- source_word: ወዕፀወሂ
  choice: e árvores também...
  rationale: Mantém a continuação aditiva e o caráter abrupto do fim do testemunho, sem completar a descrição por conjectura.
theological_decisions:
- issue: Possível associação cultual das árvores aromáticas
  choice: Manter apenas a imagem de árvores de incenso
  alternative: árvores sagradas de incenso
  rationale: O texto descreve árvores e aromas, mas não declara que sejam sagradas nem explica seu simbolismo; evita-se importar uma interpretação cultual.
- issue: Leitura de ተኵነኔ como «incenso» ou «julgamento»
  choice: «incenso» no texto, com transparência em nota
  alternative: «julgamento»
  rationale: A sequência sobre aroma, olíbano e mirra sustenta a leitura contextual «incenso», mas a dificuldade lexical real do testemunho não deve ser ocultada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. «Olíbano» foi usado para a resina específica, enquanto «incenso» permanece como designação mais ampla. As reticências assinalam a interrupção textual, não uma expansão interpretativa.
