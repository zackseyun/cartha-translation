base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/002.yaml
  text: And again I lifted up my eyes to heaven[a], and I saw in a vision—and behold, there came out from heaven beings in the likeness of white men; and four came out from that place[d][c][b], and three with them.
translation:
  language: pt
  text: 'Então, tornei a erguer os olhos para o céu e vi numa visão: eis que saíram do céu seres à semelhança de homens brancos[a]. Quatro saíram daquele lugar, e três com eles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida por “figuras à semelhança de homens brancos”. O texto descreve sua aparência por comparação e não as identifica explicitamente como anjos; também não esclarece em que sentido eram “brancos”.
    reason: lexical_alternative
  - marker: b
    text: 'A contagem é abrupta no etíope: “Quatro saíram daquele lugar, e três com eles”. É provável que se trate de sete figuras ao todo, mas a sintaxe da fonte foi preservada.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አንሣእኩ አዕይንትየ ካዕበ ውስተ ሰማየ
  choice: tornei a erguer os olhos para o céu
  rationale: Preserva tanto o verbo concreto de levantar os olhos quanto o valor reiterativo de ካዕበ, em uma formulação natural no registro visionário português.
- source_word: ወርኢኩ በራእይ
  choice: e vi numa visão
  rationale: Mantém explicitamente o enquadramento visionário; “numa visão” reflete de modo natural a expressão sem artigo definido no ge'ez.
- source_word: ወነዋ
  choice: eis que
  rationale: Conserva a interjeição de apresentação e a vivacidade própria da narrativa apocalíptica.
- source_word: ወፁኡ እምሰማይ
  choice: saíram do céu
  rationale: Reproduz o verbo plural de movimento para fora e a origem celestial sem acrescentar a ideia de queda ou descida.
- source_word: ከመ እምሳለ ሰብእ ጸዓዳ
  choice: seres à semelhança de homens brancos
  rationale: “À semelhança de” conserva o substantivo de comparação presente no ge'ez e evita identificar diretamente as figuras; “brancos” mantém a descrição visual sem inferir vestes, brilho ou etnia.
- source_word: ፬ ወፁኡ እምውእቱ መካን
  choice: Quatro saíram daquele lugar
  rationale: Mantém o numeral explícito, repete o movimento de saída e preserva a especificidade espacial do demonstrativo.
- source_word: ፫ ምስሌሆሙ
  choice: e três com eles
  rationale: Conserva deliberadamente a construção breve e abrupta do texto etíope, sem explicitar uma relação que a fonte não define.
theological_decisions:
- issue: Identidade das figuras humanas brancas vindas do céu
  choice: Descrevê-las como “seres à semelhança de homens brancos”, sem chamá-las de anjos.
  alternative: “anjos em forma de homens”
  rationale: O versículo informa sua origem e aparência, mas não nomeia sua classe. A tradução descritiva preserva a reserva simbólica e evita importar uma identificação interpretativa.
- issue: Sentido de “brancos”
  choice: Manter o adjetivo como descrição visual não explicada.
  alternative: “vestidos de branco” ou “resplandecentes”
  rationale: O ge'ez traz o adjetivo “branco”, mas não especifica se se refere à pele, às vestes ou a uma qualidade luminosa; explicitar qualquer dessas possibilidades resolveria indevidamente a ambiguidade.
- issue: Relação numérica entre os quatro e os três
  choice: Preservar “Quatro... e três com eles”.
  alternative: “sete seres saíram”
  rationale: Embora a frase provavelmente indique um total de sete figuras celestiais, a sintaxe da fonte apresenta os grupos separadamente e de modo abrupto.
translation_notes:
  register: Português moderno, claro e digno, com cadência visionária. “Eis que” preserva o tom apocalíptico sem tornar o restante da frase arcaico. A formulação evita tanto identificar as figuras como anjos quanto explicar indevidamente o adjetivo “brancos”.
