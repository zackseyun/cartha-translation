base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/001.yaml
  text: And again I saw them[a], and behold, they were butting one another and devouring one another[c][b], and the earth began to cry out.
translation:
  language: pt
  text: E novamente os vi; eles começaram[a] a dar chifradas uns nos outros[b] e a devorar uns aos outros[c], e a terra começou a clamar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A transcrição disponível parece ter confundido letras semelhantes e traz uma forma equivalente a “enquanto”. Adota-se aqui a leitura corrigida “começaram”, coerente com a construção verbal e com a forma paralela no fim do versículo.
    reason: textual_variant
  - marker: b
    text: O verbo também pode ser entendido de maneira mais geral como “ferir”, “golpear” ou “atacar”. “Dar chifradas” preserva a imagem de combate entre animais própria desta visão.
    reason: lexical_alternative
  - marker: c
    text: Ou “a engolir uns aos outros”. O verbo pode indicar tanto engolir ou tragar quanto devorar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወካዕበ፡ ርኢክዎሙ
  choice: E novamente os vi
  rationale: Mantém a fórmula narrativa que retoma a sequência da visão e traduz de modo direto o relato visionário em primeira pessoa.
- source_word: ወአኃዙ፡ እንዘ፡ ይወግኡ (leitura corrigida da transcrição ወአንዘ፡ እንዘ፡ ይወግኡ)
  choice: eles começaram a dar chifradas uns nos outros
  rationale: A leitura corrigida fornece a construção incoativa ‘começaram a’, seguida de uma ação violenta. ‘Dar chifradas’ conserva a imagem de combate animal sem tornar o verbo genericamente humano.
- source_word: ለካልኡ
  choice: uns nos outros / mutuamente
  rationale: Expressa a reciprocidade da violência em português natural e evita repetição estilisticamente pesada.
- source_word: ወይውሑጦ፡ ለካልኡ
  choice: e a devorar-se mutuamente
  rationale: O verbo pode indicar engolir, tragar ou devorar; ‘devorar’ preserva melhor a ferocidade da visão animal.
- source_word: ወምድር፡ አኃዘት፡ ትጽራኅ (leitura corrigida de አንዘት፡ ትጽራኅ)
  choice: e a terra começou a clamar
  rationale: Conserva tanto o aspecto incoativo quanto a personificação cósmica da terra. ‘Clamar’ é corrente, digno e mais expressivo que simplesmente ‘gritar’.
theological_decisions:
- issue: Personificação da terra diante da violência
  choice: a terra começou a clamar
  alternative: ouviu-se um clamor vindo da terra
  rationale: O texto apresenta a própria terra como sujeito ativo; a tradução preserva essa imagem apocalíptica sem a reduzir a uma descrição impessoal.
- issue: Relação temporal entre a violência dos animais e o clamor da terra
  choice: 'Duas ações coordenadas, ambas apresentadas como iniciadas: os animais começaram a atacar-se e a terra começou a clamar.'
  alternative: 'Subordinar a violência como ação simultânea: ‘enquanto davam chifradas... a terra começou a clamar’'
  rationale: A correção dos aparentes erros de transcrição/OCR aponta para formas incoativas paralelas e evita transformar indevidamente a primeira ação em oração subordinada.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. O ponto e vírgula separa a retomada visionária das ações observadas. Evitou-se acrescentar “eis que”, pois a leitura textual adotada entende a forma controversa como o verbo incoativo “começaram”, não como uma partícula de apresentação.
