base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/003.yaml
  text: And those three who came out afterward seized me by my hand[a], and they lifted me up from the offspring of the earth and brought me up onto a high place, and showed me a lofty tower above the earth[d][c][b], and all the hills became low.
translation:
  language: pt
  text: E aqueles três que saíram depois me seguraram pela mão e me ergueram dentre os nascidos da terra[a]. Levaram-me para o alto, até um lugar elevado, e me mostraram uma torre elevada acima da terra[b]; então todas as colinas ficaram baixas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre os gerados pela terra”. A expressão ge''ez fala literalmente de nascimento ou geração proveniente da terra.'
    reason: lexical_alternative
  - marker: b
    text: O substantivo traduzido por “torre” é difícil e também pode designar, de modo mais geral, uma estrutura elevada.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “todas as montanhas foram rebaixadas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፫እለ ወጽኡ ድኅረ
  choice: aqueles três que saíram depois
  rationale: Preserva a força anafórica do numeral, a função relativa de እለ e o sentido temporal de ድኅረ, sem especificar a natureza dos três seres.
- source_word: አሐዙኒ በእዴየ
  choice: me seguraram pela mão
  rationale: Expressa de modo natural o ato concreto de tomar pela mão; o substantivo ge'ez está no singular.
- source_word: አንሥኡኒ
  choice: me ergueram
  rationale: Mantém o movimento vertical e distingue este primeiro levantamento da subida subsequente.
- source_word: እምትውልደ ምድር
  choice: dentre os nascidos da terra
  rationale: Conserva a imagem literal de nascimento ou geração ligada à terra sem reduzi-la a uma referência meramente espacial.
- source_word: አልዐሉኒ ዲበ መካን ነዋኅ
  choice: Levaram-me para o alto, até um lugar elevado
  rationale: Reproduz o motivo da ascensão e verte o local elevado em português corrente, evitando a possível conotação cultual de 'lugar alto'.
- source_word: ማኅፈደ ነዋኅ
  choice: uma torre muito alta
  rationale: A palavra principal é difícil, mas provavelmente designa uma construção elevada; 'torre' comunica a imagem provável, enquanto a nota preserva a incerteza.
- source_word: ሕፁፀ ኵሉ አውግር
  choice: todas as colinas ficaram baixas
  rationale: Mantém a transformação topográfica da visão; 'colinas' é uma leitura possível do termo para elevações do terreno, sem exagerar sua escala.
theological_decisions:
- issue: Separação de Enoque dos seres ligados à terra
  choice: dentre os nascidos da terra
  alternative: da terra; dentre os habitantes da terra
  rationale: A formulação conserva a imagem genealógica do ge'ez e a tensão apocalíptica entre os seres terrenos e a perspectiva elevada, sem explicar de forma denominacional quem são eles.
- issue: Natureza da estrutura elevada
  choice: torre
  alternative: estrutura elevada; construção alta
  rationale: Adota a imagem contextual mais provável, mas registra em nota que o substantivo é incerto, evitando transformar a identificação em certeza teológica ou arquitetônica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A coordenação extensa do ge'ez foi levemente segmentada para clareza, sem alterar a sequência da visão. As ambiguidades relevantes foram mantidas em notas.
