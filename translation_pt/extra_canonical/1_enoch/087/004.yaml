base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/004.yaml
  text: And they said to me[a], “Remain here until you see everything that will come upon those elephants and camels and donkeys, and upon the stars and upon the cattle[c][b], and all of them.”
translation:
  language: pt
  text: 'E eles me disseram: “Permaneça aqui até ver tudo o que virá sobre aqueles elefantes, camelos e jumentos, sobre as estrelas, sobre o gado[a] e sobre todos eles.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os bovinos”. O termo se refere a gado bovino, e não a ovelhas.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “virá sobre” não especifica o que acontecerá a essas figuras. O contexto da visão pode sugerir juízo, mas o versículo não o declara diretamente.
    reason: alternative_reading
lexical_decisions:
- source_word: ይቤሉኒ
  choice: eles me disseram
  rationale: Preserva a fórmula narrativa e o sufixo de objeto indireto, expresso por “me”.
- source_word: ንበር ዝየ
  choice: Permaneça aqui
  rationale: Traduz a ordem de permanecer no lugar, em registro digno e natural.
- source_word: እስከ ትሬኢ ኵሎ ዘይመጽእ
  choice: até ver tudo o que virá
  rationale: Mantém tanto a duração da ordem quanto a orientação futura da visão.
- source_word: ዲበ
  choice: sobre
  rationale: A preposição repetida indica aquilo que será afetado, sem explicitar se o acontecimento é juízo, conflito ou outra coisa.
- source_word: እልኩ ነጌያት
  choice: aqueles elefantes
  rationale: Conserva a provável força dêitica referente aos animais já vistos na visão.
- source_word: አግማል
  choice: camelos
  rationale: Designação animal direta, mantida literalmente.
- source_word: አእዱግ
  choice: jumentos
  rationale: Termo moderno e amplamente compreensível para os animais mencionados.
- source_word: ከዋክብት
  choice: as estrelas
  rationale: Preserva literalmente a imagem visionária, sem substituí-la por uma interpretação simbólica.
- source_word: አልህምታት
  choice: o gado
  rationale: O termo designa bovinos ou gado, não ovelhas; a escolha respeita a distinção zoológica relevante na alegoria animal.
- source_word: ወኵሎሙ
  choice: e sobre todos eles
  rationale: Retém o resumo abrangente final e, em português, explicita a preposição naturalmente subentendida na coordenação.
theological_decisions:
- issue: Se o acontecimento futuro deve ser identificado explicitamente como punição
  choice: o que virá sobre
  alternative: o juízo que virá sobre
  rationale: O ge'ez não nomeia diretamente o acontecimento como juízo; a formulação preserva essa abertura sem eliminar a possível conotação contextual.
- issue: Se os símbolos animais e cósmicos devem ser interpretados no texto principal
  choice: manter elefantes, camelos, jumentos, estrelas e gado
  alternative: substituí-los pelos grupos históricos ou seres celestes que possam representar
  rationale: O versículo apresenta as figuras da visão, não sua decodificação; traduzi-las literalmente preserva a linguagem apocalíptica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe natural para leitores brasileiros. A repetição de “sobre” foi parcialmente preservada para conservar a estrutura e a ambiguidade do original, sem tornar a frase artificial.
