base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/002.yaml
  text: And when righteousness appears on the faces of the righteous[a], the chosen, whose deeds hang upon the Lord of Spirits, and light will appear to the righteous and to the chosen who dwell on the dry ground, where then is the dwelling of sinners[d][c][b], and where the resting place of those who denied the Lord of Spirits? It would have been better for them had they not been born.
translation:
  language: pt
  text: E, quando a justiça aparecer nos rostos dos justos, os escolhidos, cujas obras pendem do Senhor dos Espíritos[a], e a luz aparecer para os justos e para os escolhidos que habitam em terra seca[b], onde estará então a morada dos pecadores? E onde estará o lugar de descanso dos que negaram o Senhor dos Espíritos? Teria sido melhor para eles não terem nascido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «cujas obras pendem do Senhor dos Espíritos» é difícil. Também pode significar que suas obras dependem dele ou são sustentadas diante dele.
    reason: lexical_alternative
  - marker: b
    text: «Terra seca» traduz literalmente a expressão do texto; provavelmente se refere à terra habitada em contraste com as águas cósmicas.
    reason: cultural_note
lexical_decisions:
- source_word: ያስተርኢ
  choice: aparecer
  rationale: O verbo, empregado com «justiça» e «luz», indica aqui aparecer ou tornar-se visível. A repetição de «aparecer» conserva a correspondência lexical e evita o sentido causativo menos provável de «mostrar».
- source_word: ጽድቅ
  choice: justiça
  rationale: Conserva o termo central da linguagem enoquiana, incluindo tanto a retidão quanto sua vindicação manifesta no cenário escatológico.
- source_word: በገጾሙ
  choice: no rosto
  rationale: Mantém a imagem concreta e visível do original; o singular coletivo é natural em português.
- source_word: ጻድቃን
  choice: os justos
  rationale: É a designação portuguesa corrente e clara para o grupo caracterizado por justiça.
- source_word: ኅሩያን
  choice: os escolhidos
  rationale: Expressão transparente em português moderno, sem acrescentar conotações confessionais associadas a terminologia técnica posterior.
- source_word: ተግባሮሙ ስቁል በእግዚአ መናፍስት
  choice: cujas obras pendem do Senhor dos Espíritos
  rationale: «Pendem de» preserva a metáfora incomum de algo suspenso e também permite, sem impor, a ideia de dependência. A nota registra a dificuldade.
- source_word: ብርሃን
  choice: luz
  rationale: É o equivalente básico, claro e teologicamente expressivo, sem intensificação indevida.
- source_word: የኃድሩ ዲበ የብስ
  choice: que habitam em terra seca
  rationale: Preserva a referência específica à terra firme ou seca, em vez de generalizá-la como «mundo» ou simplesmente «terra».
- source_word: መኃደሪ
  choice: morada
  rationale: Mantém o sentido locativo e forma uma pergunta clara sobre o lugar destinado aos pecadores.
- source_word: ምዕራፎሙ
  choice: lugar de descanso
  rationale: Expressa tanto o repouso quanto a ideia de um lugar, em paralelo com «morada».
- source_word: ክሕድዎ
  choice: negaram
  rationale: Reproduz a força religiosa e judicial do verbo com «Senhor dos Espíritos» como objeto direto.
- source_word: እምኃየሶሙ ሶበ ኢተወልዱ
  choice: Teria sido melhor para eles não terem nascido
  rationale: Formulação contrafactual natural e severa em português, fiel ao juízo expresso pelo original.
theological_decisions:
- issue: Sentido da expressão difícil sobre as obras dos justos ou escolhidos
  choice: «cujas obras pendem do Senhor dos Espíritos»
  alternative: «cujas obras dependem do Senhor dos Espíritos» ou «cujas obras são sustentadas diante do Senhor dos Espíritos»
  rationale: A tradução principal conserva a metáfora concreta e sua ambiguidade, sem transformá-la numa afirmação doutrinária mais definida do que o texto permite.
- issue: Referência de «terra seca»
  choice: Manter literalmente «terra seca»
  alternative: «terra», «mundo habitado» ou «terra firme»
  rationale: A opção preserva a textura cosmológica da visão, embora a expressão provavelmente designe a região habitada em contraste com as águas.
- issue: Valor do segundo ያስተርኢ com «luz»
  choice: «a luz aparecer»
  alternative: «ele mostrará luz»
  rationale: A forma de «luz» e o valor do verbo favorecem entendê-la como sujeito. Assim, evita-se introduzir um agente não expresso e preserva-se o paralelismo com a justiça que aparece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém o caráter visionário e escatológico, enquanto as perguntas são pontuadas separadamente para maior clareza. «Senhor dos Espíritos» é preservado como título recorrente de 1 Enoque.
