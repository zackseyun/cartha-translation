base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/001.yaml
  text: The first parable[a]. When the assembly of the righteous appears, and sinners are judged for their sins, and are driven away from the face of the earth[b],
translation:
  language: pt
  text: A primeira parábola. Quando aparecer a assembleia dos justos, e os pecadores forem julgados por seus pecados e expulsos da face da terra[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da face do solo seco”. A expressão também pode ser entendida como “da superfície da terra” ou “da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምሳሌ፡ ቀዳማ
  choice: A primeira parábola
  rationale: O termo designa o primeiro discurso visionário desta seção. “Parábola” é corrente, inteligível e preserva a designação tradicional sem recorrer ao menos natural “similitude”.
- source_word: ሶበ
  choice: Quando
  rationale: Introduz uma oração temporal cuja continuação sintática vem no versículo seguinte; por isso, conserva-se a vírgula no final.
- source_word: ያስተርኢ
  choice: aparecer
  rationale: O verbo indica tornar-se visível ou aparecer. “Aparecer” mantém a distinção em relação a um verbo mais específico para “ser revelado” empregado posteriormente no capítulo.
- source_word: ማኅበረ፡ ጻድቃን
  choice: a assembleia dos justos
  rationale: Expressa uma reunião coletiva. “Assembleia” conserva o caráter comunitário e solene, permanecendo natural em português moderno.
- source_word: ወይትኴነኑ፡ ኃጥኣን
  choice: e os pecadores forem julgados
  rationale: A construção portuguesa pede o artigo para a classe mencionada neste contexto. “Forem julgados” preserva o sentido judicial sem antecipar explicitamente “condenados”.
- source_word: በኃጢአቶሙ
  choice: por seus pecados
  rationale: A preposição assinala naturalmente o fundamento do julgamento; a formulação é concisa e mantém o tom judicial.
- source_word: ወእምገጸ፡ የብስ
  choice: da face da terra
  rationale: A expressão concreta significa literalmente “da face do solo seco”, mas funciona de modo idiomático como referência à superfície da terra. A forma literal é registrada em nota.
- source_word: ይትሀወዙ
  choice: expulsos
  rationale: O contexto descreve remoção punitiva. “Expulsos” comunica a força passiva e coercitiva com maior naturalidade do que “levados para longe”.
theological_decisions:
- issue: Se o verbo judicial deve ser traduzido de modo neutro como “julgados” ou com o resultado explícito “condenados”
  choice: julgados
  alternative: condenados
  rationale: Embora a expulsão subsequente mostre um resultado punitivo, o verbo em si não exige que a sentença seja explicitada. “Julgados” preserva a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O título foi separado da oração temporal por ponto. A vírgula final foi mantida porque a oração iniciada por “Quando” continua no versículo seguinte.
