  naturalness: O português é solene, claro e amplamente compreensível. «Já não serão poderosos nem exaltados» é mais natural e explícito do que «já não serão assim», sem introduzir a noção indevida de aniquilação.
  terminology: «Senhor dos Espíritos», «santos», «justos» e «escolhidos» são escolhas consistentes e adequadas ao vocabulário enóquico. «Contemplar o rosto» mantém deliberadamente a imagem formal do original.
