    issue: Estrutura sujeito-predicado na primeira oração
    rationale: O ge'ez apresenta «os que possuem a terra» como sujeito e «poderosos e exaltados» como predicado negado. A tradução deve explicitar essa relação para evitar que «os poderosos e os exaltados» pareça ser o sujeito e que «assim» tenha antecedente pouco definido.
  - severity: low
