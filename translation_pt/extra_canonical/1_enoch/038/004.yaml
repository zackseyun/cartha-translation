revisions:
- from: E, de agora em diante, os poderosos e os exaltados que possuem a terra[a] já não serão assim[b], nem poderão contemplar o rosto dos santos[c], porque o Senhor dos Espíritos fez sua luz aparecer no rosto dos santos, dos justos e dos escolhidos[d].
  to: E, de agora em diante, os que possuem a terra[a] já não serão poderosos nem exaltados[b], nem poderão contemplar o rosto dos santos[c], porque o Senhor dos Espíritos fez sua luz aparecer sobre o rosto dos santos, dos justos e dos escolhidos[d].
  rationale: 'A revisão repõe em português a relação sintática atestada no ge''ez: aqueles que possuem a terra são os que já não serão poderosos nem exaltados. Isso evita tanto a ambiguidade anafórica de «assim» quanto a leitura incorreta de que o texto afirma que os poderosos deixarão de existir. «Sobre o rosto» torna um pouco mais visível a imagem espacial da luz, mantendo a ambiguidade interpretativa indicada na nota.'
