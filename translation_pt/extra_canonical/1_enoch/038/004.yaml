base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/004.yaml
  text: And from now on the mighty and exalted who possess the earth shall not be so[a], nor shall they be able to look on the face of the holy ones, because the Lord of Spirits has caused his light to appear on the face of the holy, the righteous[d][c][b], and the chosen.
translation:
  language: pt
  text: E, de agora em diante, os que possuem a terra[a] já não serão poderosos nem exaltados[b], nem poderão contemplar o rosto dos santos[c], porque o Senhor dos Espíritos fez sua luz aparecer sobre o rosto dos santos, dos justos e dos escolhidos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que detêm a terra” ou “que dominam a terra”. O verbo ge''ez pode indicar agarrar, reter ou manter sob controle.'
    reason: lexical_alternative
  - marker: b
    text: A construção indica que os que possuem a terra deixam de ser poderosos e exaltados; não exige o sentido de que deixarão de existir.
    reason: grammatical_clarification
  - marker: c
    text: “Contemplar o rosto” expressa encontro direto ou acesso à presença de alguém; a imagem concreta do original foi preservada.
    reason: cultural_note
  - marker: d
    text: A frase pode indicar que a luz do Senhor resplandece sobre o rosto dos santos, justos e escolhidos, assinalando sua vindicação. Também é possível entender que a luz aparece diante deles.
    reason: alternative_reading
lexical_decisions:
- source_word: ዐዚዛነ ወእልዑላነ
  choice: os poderosos e os exaltados
  rationale: Mantém os dois qualificativos distintos e preserva tanto a ideia de poder quanto a de posição elevada, sem restringir o grupo a reis ou militares.
- source_word: ይእኅዝዋ ለምድር
  choice: que possuem a terra
  rationale: O verbo expressa agarrar, deter ou manter sob controle. “Possuem” comunica domínio estabelecido sem acrescentar a ideia mais forte e incerta de conquista violenta.
- source_word: ኢይከውኑ ዐዚዛነ ወእልዑላነ
  choice: já não serão assim
  rationale: A formulação portuguesa conserva a referência anafórica aos estados de poder e exaltação e evita interpretar a negação como aniquilação dos indivíduos.
- source_word: ርእየ ገጸ ቅዱሳን
  choice: contemplar o rosto dos santos
  rationale: Preserva a imagem concreta e solene do rosto, que pode indicar encontro direto ou acesso à presença dos santos.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Conserva o título divino característico de 1 Enoque em forma reconhecível e dignificada.
- source_word: አርአየ ብርሃኖ
  choice: fez sua luz aparecer
  rationale: Reproduz o valor causativo do verbo e a imagem de manifestação visível, sem reduzi-la a uma revelação meramente intelectual.
- source_word: በገጸ ቅዱሳን ጻድቃን ወኅሩያን
  choice: no rosto dos santos, dos justos e dos escolhidos
  rationale: Mantém a imagem da luz sobre o rosto e conserva separadamente as três designações enóquicas.
theological_decisions:
- issue: Identidade e destino dos que possuem a terra
  choice: Poderosos e exaltados que perderão sua condição de poder e exaltação
  alternative: Os poderosos e exaltados deixarão de existir
  rationale: A construção com o verbo “ser” e os qualificativos predicativos favorece uma perda de condição ou posição, não necessariamente a aniquilação. “Já não serão assim” preserva essa leitura sem definir em excesso a identidade política do grupo.
- issue: Sentido da luz no rosto dos santos, justos e escolhidos
  choice: A luz do Senhor se manifesta no rosto da comunidade vindicada
  alternative: A luz aparece diante deles ou se reflete a partir do rosto deles
  rationale: A preposição e a imagem concreta apoiam mais diretamente uma manifestação sobre o rosto. A tradução mantém a imagem apocalíptica sem explicá-la como simples favor abstrato.
- issue: Contemplar o rosto dos santos
  choice: Manter a expressão concreta como encontro ou acesso direto
  alternative: Parafrasear como “estar na presença dos santos”
  rationale: A expressão do texto-fonte é preservada para não eliminar sua solenidade nem restringir sua possível força idiomática.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem retórica e as imagens de “rosto” e “luz” foram mantidas; “já não serão assim” comunica naturalmente a perda de status sem transformar o enunciado em afirmação explícita de aniquilação.
