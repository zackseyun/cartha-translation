base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/003.yaml
  text: When the hidden things of the righteous are revealed, sinners will be judged, and the wicked will be driven away from the face of the righteous and the chosen.
translation:
  language: pt
  text: Quando as coisas ocultas dos justos forem reveladas[a], os pecadores serão julgados, e os ímpios serão expulsos de diante dos justos e dos escolhidos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os segredos deles”. O ge''ez designa aquilo que esteve oculto, mas o versículo não especifica se são atos, identidades ou fundamentos de vindicação.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da face dos justos e dos escolhidos”; trata-se de uma fórmula de exclusão da presença, comum em cenas de juízo.
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: Quando
  rationale: Introduz uma oração temporal e preserva a estrutura de condição temporal seguida pelo juízo.
- source_word: ይትከሠት
  choice: forem reveladas
  rationale: A forma passiva e o contexto apocalíptico indicam que aquilo que estava oculto será manifestado.
- source_word: ኅቡኣቲሆሙ፡ ለጻድቃን
  choice: as coisas ocultas dos justos
  rationale: Preserva o plural e a relação possessiva sem definir se se trata de atos, segredos, identidade ou fundamento da vindicação.
- source_word: ይትኴነኑ
  choice: serão julgados
  rationale: Mantém o sentido judicial passivo sem antecipar no verbo o resultado mais forte de condenação.
- source_word: ኃጥኣን
  choice: os pecadores
  rationale: Equivalente direto e corrente para a categoria moral empregada no texto.
- source_word: ይትሀወዙ
  choice: serão expulsos
  rationale: Expressa remoção forçada, adequada à cena de juízo, em vez de simples afastamento voluntário.
- source_word: ረስዓን
  choice: os ímpios
  rationale: Conserva o contraste moral com os justos em registro bíblico claro e amplamente compreensível.
- source_word: እምገጸ
  choice: de diante de
  rationale: Traduz de modo natural em português a imagem literal de afastamento da face ou presença de alguém, preservando a ideia espacial de exclusão.
- source_word: ወኅሩያን
  choice: e dos escolhidos
  rationale: Comunica de forma acessível a categoria dos que foram escolhidos, sem recorrer ao termo mais técnico 'eleitos'.
theological_decisions:
- issue: Natureza da realidade oculta pertencente aos justos
  choice: as coisas ocultas dos justos
  alternative: os segredos dos justos; os ocultos entre os justos
  rationale: O plural ge'ez não exige que se trate especificamente de segredos nem identifica inequivocamente pessoas ocultas; a formulação ampla conserva a ambiguidade.
- issue: Força da fórmula final de exclusão
  choice: expulsos de diante dos justos e dos escolhidos
  alternative: afastados da presença dos justos e dos eleitos
  rationale: A redação mantém a remoção forçada e a imagem de exclusão da presença da comunidade vindicada, sem reduzi-la a vergonha emocional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção temporal com “Quando” preserva a sintaxe do ge'ez; “de diante de” mantém a imagem judicial e espacial sem soar excessivamente literal.
