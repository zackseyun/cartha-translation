  source_fidelity: A tradução conserva adequadamente «meus olhos viram», a dupla localização «ali, naquele lugar» e o objeto masculino singular do verbo final. Contudo, na redação corrida o sujeito elíptico de «o bendisseram» tende, em português, a ser entendido como «meus olhos», o que produz uma ligação sintática indevida. A incerteza indicada pelo asterisco no primeiro termo transmitido deve também estar ancorada junto ao ponto textual a que se refere, não junto a «lugar».
  naturalness: «Abençoaram» é mais corrente e imediatamente compreensível no português moderno do que «bendisseram», sem perder o registro bíblico sóbrio. Separar as duas orações impede que «meus olhos» funcione como sujeito natural da ação de abençoar, preservando o sujeito não expresso.
  terminology: «Abençoaram» transmite apropriadamente o verbo de bênção, e o pronome «o» mantém o referente masculino singular sem identificá-lo. A nota continua explicitando que os agentes não são nomeados; a menção a seres celestiais permanece apenas como possibilidade.
  issues:
