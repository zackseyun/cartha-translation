base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/010.yaml
  text: And my eyes saw in that place[a][him], and they blessed him.
translation:
  language: pt
  text: E meus olhos[a] viram ali, naquele lugar. E o abençoaram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O primeiro termo da linha transmitida apresenta incerteza textual, e algumas reconstruções propõem uma expressão adicional antes de “meus olhos”.
    reason: textual_uncertainty
  - marker: b
    text: O verbo está no plural e tem objeto masculino singular, mas o sujeito não é declarado nesta breve linha; o sentido pode ser que seres celestiais presentes ali o abençoaram.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእዩ፡ አዕይንትየ
  choice: meus olhos viram
  rationale: A expressão combina o verbo comum “ver” com “meus olhos”. A formulação direta conserva o caráter de relato visionário e a concordância plural do ge'ez.
- source_word: በውእቱ፡ መካን
  choice: ali, naquele lugar
  rationale: A tradução mantém tanto a força locativa quanto a referência demonstrativa ao lugar, sem recorrer a linguagem arcaica.
- source_word: ወባረክዎ
  choice: e o bendisseram
  rationale: A forma verbal indica uma ação plural de bendizer dirigida a um referente masculino singular. O português omite o pronome sujeito, preservando o fato de que os agentes não são identificados nesta breve linha.
theological_decisions:
- issue: Sujeito não expresso do verbo final
  choice: e o bendisseram
  alternative: e eu o bendisse
  rationale: A forma transmitida sustenta uma ação plural, mas não nomeia os agentes. A tradução não os identifica como seres celestiais nem converte a ação em um ato singular de Enoque.
- issue: Referente do objeto masculino no verbo final
  choice: o
  alternative: a ele
  rationale: O sufixo de objeto aponta para um referente masculino singular, mas este fragmento não o nomeia. O pronome conserva essa referência sem acrescentar uma identificação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A omissão do pronome sujeito em “o bendisseram” conserva melhor a ambiguidade do ge'ez do que a introdução explícita de “eles”.
