base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/007.yaml
  text: And I saw the dwelling-place beneath the wings of the Lord of Spirits[a]; and all the righteous and the chosen shone before him like the light of fire, and their mouths were filled with blessing, and their lips praised the name of the Lord of Spirits. And righteousness does not fail before him[c][b], and uprightness does not fail before him.
translation:
  language: pt
  text: E vi a morada debaixo das asas do Senhor dos Espíritos[a]; e todos os justos e os escolhidos brilhavam diante dele como a luz do fogo. A boca deles estava cheia de bênção, e seus lábios louvavam o nome do Senhor dos Espíritos. A justiça não se extingue diante dele[b], e a retidão não se extingue diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem “debaixo das asas” foi mantida literalmente para preservar o simbolismo visionário de abrigo e proximidade do Senhor dos Espíritos.
    reason: cultural_note
  - marker: b
    text: 'Ou: “não falha”, “não perece”, “não desaparece” ou “não chega ao fim”. O mesmo verbo é repetido na oração seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ማኅደረ
  choice: morada
  rationale: Designa um lugar de habitação; “morada” é concreto, digno e natural em português.
- source_word: መትሕተ አክናፈ
  choice: debaixo das asas
  rationale: Preserva literalmente a localização e o simbolismo visionário de abrigo e proximidade.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém o título recorrente de 1 Enoque sem explicação ou harmonização teológica.
- source_word: ጻድቃን ወኄሩያን
  choice: os justos e os escolhidos
  rationale: Preserva as duas classes nominais paralelas e evita a carga doutrinária potencialmente mais forte de “eleitos”.
- source_word: ይትሰሐዩ
  choice: brilhavam
  rationale: Expressa a radiância visionária com uma forma corrente e mantém o aspecto verbal compatível com a cena contemplada.
- source_word: ከመ ብርሃነ እሳት
  choice: como a luz do fogo
  rationale: Retém a comparação incomum do texto, sem reduzi-la a uma ideia genérica de brilho.
- source_word: አፉሆሙ ይመልእ በረከተ
  choice: A boca deles estava cheia de bênção
  rationale: Conserva “bênção”, em vez de substituí-la interpretativamente por “louvor”, e mantém a imagem corporal.
- source_word: ከናፍሪሆሙ ይሴብሑ
  choice: seus lábios louvavam
  rationale: Preserva o paralelismo poético entre boca e lábios.
- source_word: ጽድቅ
  choice: justiça
  rationale: Verte o substantivo abstrato em seu sentido moral amplo; o contexto não exige restringi-lo à justiça jurídica.
- source_word: ርትዕ
  choice: retidão
  rationale: Mantém a noção de correção moral e o paralelismo com “justiça”.
- source_word: ኢየኃልቅ
  choice: não se extingue
  rationale: Comunica a ideia de não perecer, não acabar ou não chegar ao fim, com boa adequação aos substantivos abstratos do contexto.
theological_decisions:
- issue: Sentido de ኄሩያን no contexto apocalíptico
  choice: os escolhidos
  alternative: os eleitos
  rationale: “Escolhidos” conserva a categoria do texto sem introduzir associações mais específicas de sistemas teológicos posteriores.
- issue: Alcance do verbo negativo repetido nas cláusulas finais
  choice: não se extingue
  alternative: não falha; não perece; não passa; não chega ao fim
  rationale: O verbo sugere permanência ou não cessação. “Não se extingue” preserva essa força sem definir de modo excessivamente estreito a natureza dessa permanência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura paralela de “os justos e os escolhidos” e as imagens de boca, lábios, fogo e asas foram conservadas. Os marcadores seguem a ordem de ocorrência no texto.
