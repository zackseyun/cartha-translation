base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/005.yaml
  text: There my eyes saw their dwelling places with the angels of righteousness, and their resting places with the holy ones; and they were asking and pleading and praying on behalf of the children of men, and righteousness was flowing before them like water, and mercy like dew upon the earth. So it is among them forever and ever.
translation:
  language: pt
  text: Ali, meus olhos viram as moradas deles junto aos anjos da justiça, e seus lugares de repouso[a] junto aos santos[b]. Eles pediam, suplicavam e oravam em favor dos filhos dos homens; e a justiça fluía diante deles como água, e a misericórdia, como orvalho sobre a terra. Assim é entre eles para todo o sempre.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seus leitos» ou «seus lugares onde repousam»; o termo ge'ez pode indicar um lugar para se deitar.
    reason: lexical_alternative
  - marker: b
    text: «Santos» pode referir-se a seres santos celestiais, aos justos na assembleia celestial ou a ambos; o texto não restringe o sentido.
    reason: alternative_reading
  - marker: c
    text: 'A frase final também pode ser entendida como: «Assim será no meio deles para todo o sempre».'
    reason: alternative_reading
lexical_decisions:
- source_word: በህየ
  choice: Ali
  rationale: Advérbio locativo que introduz a cena visionária; «Ali» é natural e direto em português.
- source_word: ርእያ አዕይንትየ
  choice: meus olhos viram
  rationale: Preserva a sintaxe enfática do ge'ez, na qual «meus olhos» é o sujeito explícito do verbo, em vez de transformar a expressão em «vi com meus olhos».
- source_word: ማኅደሮሙ
  choice: as moradas deles
  rationale: Expressa lugares de habitação ou permanência, com dignidade e clareza no cenário celestial.
- source_word: መላእክተ ጽድቅ
  choice: anjos da justiça
  rationale: Mantém a construção genitiva. «Justiça» comunica de modo natural em português o campo moral e cósmico de ጽድቅ e permite a repetição deliberada do termo mais adiante.
- source_word: ምስካቢሆሙ
  choice: seus lugares de repouso
  rationale: O substantivo pode indicar leitos ou lugares onde alguém se deita; a formulação evita especificar mobiliário em excesso e preserva a ideia de repouso.
- source_word: ቅዱሳን
  choice: os santos
  rationale: Equivalente português corrente para seres ou pessoas santas; a nota preserva a ambiguidade quanto à identidade do grupo.
- source_word: ይስእሉ ወያስተበቍዑ ወይጼልዩ
  choice: pediam, suplicavam e oravam
  rationale: Conserva os três verbos e sua acumulação retórica, sem reduzir a intensidade da intercessão.
- source_word: በእንተ ውሉደ ሰብእ
  choice: em favor dos filhos dos homens
  rationale: Mantém a expressão antropológica tradicional e o sentido de intercessão, em registro elevado mas compreensível.
- source_word: ጽድቅ ከመ ማይ ይውሕዝ ቅድሜሆሙ
  choice: a justiça corria diante deles como água
  rationale: Preserva a imagem concreta do fluxo, a posição «diante deles» e a correspondência lexical com «anjos da justiça».
- source_word: ምሕረት ከመ ጠል ውስተ ምድር
  choice: a misericórdia, como orvalho sobre a terra
  rationale: Mantém a comparação suave e vivificante; a elipse de «corria» é natural em português sem alterar o paralelismo.
- source_word: ከመዝ ውእቱ ማእከሎሙ ለዓለመ ዓለም
  choice: Assim é entre eles para todo o sempre
  rationale: Apresenta a frase como resumo de um estado duradouro e conserva a expressão enfática de perpetuidade.
theological_decisions:
- issue: Identidade dos que intercedem e da comunidade celestial
  choice: O texto mantém o pronome coletivo sem identificar mais precisamente os intercessores.
  alternative: Especificar que são somente anjos ou justos falecidos que intercedem.
  rationale: A sintaxe relaciona moradas, anjos da justiça e santos, mas não fixa inequivocamente o antecedente de «eles»; explicitar uma categoria importaria uma definição doutrinária posterior.
- issue: Identidade dos «santos»
  choice: A tradução usa «santos» e registra a amplitude do referente em nota.
  alternative: «seres santos» ou «santos celestiais»
  rationale: O ge'ez não obriga a decidir entre seres celestiais, os justos na assembleia celestial ou ambos.
- issue: Sentido de ጽድቅ
  choice: justiça
  alternative: retidão
  rationale: «Justiça» funciona naturalmente tanto no título dos anjos quanto na imagem que flui como água; «retidão» preservaria melhor uma nuance moral, mas seria menos idiomática na segunda imagem.
- issue: Valor temporal da cláusula final
  choice: 'presente: «Assim é»'
  alternative: 'futuro: «Assim será»'
  rationale: A forma pode resumir o estado contemplado, embora o contexto permita nuance futura; a nota conserva essa possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção incomum «meus olhos viram» foi mantida por refletir precisamente a sintaxe visionária enfática do ge'ez. O paralelismo e a repetição de «justiça» foram preservados.
