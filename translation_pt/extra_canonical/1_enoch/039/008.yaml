base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/008.yaml
  text: There I desired to dwell[a], and my spirit longed for that dwelling place; there my portion was before[c][b], for thus it was established for me before the Lord of Spirits.
translation:
  language: pt
  text: Ali desejei habitar, e meu espírito ansiou por aquela morada; ali já estava a minha porção[a], pois assim fora estabelecida para mim diante do Senhor dos Espíritos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ali minha porção existia anteriormente”. A formulação em ge''ez é compacta e também pode ser entendida, de modo mais interpretativo, como “ali minha porção já havia sido destinada”.'
    reason: lexical_alternative
  - marker: b
    text: “Senhor dos Espíritos” é um título divino característico das Parábolas de Enoque e deve ser entendido segundo o uso próprio desta obra.
    reason: cross_reference
lexical_decisions:
- source_word: ህየ
  choice: ali
  rationale: Preserva o valor locativo e deítico do advérbio no cenário visionário sem especificar além do texto.
- source_word: ፈቀድኩ አኅድር
  choice: desejei habitar
  rationale: Expressa a vontade de permanecer ou residir, em registro elevado, mas natural no português atual.
- source_word: ወፈተወት መንፈስየ
  choice: e meu espírito ansiou
  rationale: Conserva a força afetiva da inclinação interior do vidente, sem reduzir o verbo a mera preferência.
- source_word: ለውእቱ ማኅደር
  choice: por aquela morada
  rationale: Mantém a imagem concreta de um lugar de habitação e evita a repetição pouco natural de 'habitar' e 'lugar de habitação'.
- source_word: በህየ ኮነ ክፍለየ ቅድመ
  choice: ali já estava a minha porção
  rationale: Traduz ኮነ sem acrescentar a ação passiva de 'ser designada'; 'já' comunica de modo natural a anterioridade compactamente expressa por ቅድመ.
- source_word: እስመ ከመዝ ጸንዐ በእንቲአየ
  choice: pois assim fora estabelecida para mim
  rationale: Preserva a relação explicativa e a ideia de firme estabelecimento anterior, com o referente feminino 'porção' subentendido.
- source_word: በቅድመ እግዚአ መናፍስት
  choice: diante do Senhor dos Espíritos
  rationale: Aqui በቅድመ introduz naturalmente presença ou comparecimento diante da figura divina; o título recorrente é mantido segundo o idioma próprio das Parábolas.
theological_decisions:
- issue: Natureza da “porção” de Enoque na cena celestial
  choice: Manter a expressão concreta e não explicar se a porção é estritamente um lugar, uma herança ou uma sorte destinada.
  alternative: Explicitar como “lugar que me fora destinado”.
  rationale: A associação com a morada sugere uma participação ou lugar celestial, mas o substantivo ክፍል permanece semanticamente mais amplo; a tradução conserva essa tensão.
- issue: Anterioridade da porção
  choice: “ali já estava a minha porção”
  alternative: “ali minha porção havia sido designada anteriormente”
  rationale: O verbo ኮነ significa ser ou tornar-se, não designar. A alternativa introduziria uma ação distributiva que o contexto pode sugerir, mas que o texto não declara diretamente.
- issue: Título divino እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  alternative: Soberano dos Espíritos
  rationale: “Senhor dos Espíritos” preserva o título característico desta obra sem harmonizá-lo com fórmulas teológicas posteriores.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência visionária. “Morada” e “porção” conservam o campo imagético do original; “ali já estava” evita explicar em excesso o ge'ez compacto. Todos os marcadores de nota aparecem no texto.
