  source_fidelity: 'O sentido central é bem preservado: a personagem titular, a dupla «justiça e fé», a presença da justiça em seus dias e a multidão inumerável diante dele. Contudo, «A justiça haverá em seus dias» não é uma construção portuguesa aceitável para o valor existencial de ይከውን; «haverá justiça em seus dias» o transmite com fidelidade e naturalidade. A nota b também deve incluir «diante dele», elemento presente no enunciado literal ge''ez.'
  naturalness: O registro é adequadamente solene e acessível. A abertura sem vírgula após «E» é mais fluida, e «haverá justiça em seus dias» é a formulação idiomática moderna.
  terminology: «o Escolhido», «justiça», «fé», «os justos» e «os escolhidos» preservam adequadamente tanto a força titular quanto as repetições lexicais do texto. A alternativa «fidelidade» é corretamente mantida em nota, sem resolver indevidamente a ambiguidade.
