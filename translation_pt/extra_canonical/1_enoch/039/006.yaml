base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/006.yaml
  text: And in that place my eyes saw the Chosen One of righteousness and of faith[a], and righteousness shall be in his days[c][b]; and the righteous and the chosen will be without number before him forever and ever.
translation:
  language: pt
  text: E naquele lugar meus olhos viram o Escolhido da justiça e da fé[a]. Haverá justiça em seus dias[c], e os justos e os escolhidos serão incontáveis[b] diante dele para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da fidelidade”. O termo ge''ez pode indicar fé, fidelidade ou constância nesta expressão compacta, semelhante a um título.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “não haverá número para eles diante dele”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a justiça prevalecerá em seus dias”.'
    reason: previous_rendering
lexical_decisions:
- source_word: መካን
  choice: lugar
  rationale: Termo comum para um lugar ou localização; mantém o cenário espacial da visão sem especificá-lo além do texto.
- source_word: ኀሩየ
  choice: o Escolhido
  rationale: O termo funciona aqui como título substantivado. A inicial maiúscula sinaliza essa função literária sem identificar a personagem com uma figura doutrinária posterior.
- source_word: ለጽድቅ
  choice: da justiça
  rationale: O valor genitivo caracteriza o Escolhido pela justiça e preserva a construção compacta do original.
- source_word: ወዘሃይማኖት
  choice: e da fé
  rationale: Mantém a correspondência lexical mais direta, enquanto a nota registra o sentido igualmente possível de fidelidade.
- source_word: ይከውን
  choice: haverá
  rationale: O verbo é a forma usual de 'ser/tornar-se'. Em português, a construção existencial 'haverá justiça' comunica naturalmente que a justiça estará presente, sem acrescentar a ideia interpretativa de vitória.
- source_word: በመዋዕሊሁ
  choice: em seus dias
  rationale: Expressão temporal concisa que preserva a referência pronominal e a estrutura do original.
- source_word: ኄራያን
  choice: os escolhidos
  rationale: Conserva a continuidade lexical com o singular titular 'o Escolhido' e permanece natural em português.
- source_word: ኈልቈ አልቦሙ
  choice: serão incontáveis
  rationale: Expressa de modo idiomático a ausência de número; a formulação mais literal é registrada em nota.
- source_word: ቅድሜሁ
  choice: diante dele
  rationale: Preserva o sentido relacional e solene de estar perante a personagem exaltada.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Fórmula portuguesa corrente de duração eterna, adequada ao registro solene do texto.
theological_decisions:
- issue: Se ኀሩየ deve ser traduzido como título ou como simples adjetivo
  choice: o Escolhido, como título
  alternative: um escolhido; o eleito
  rationale: No contexto das Parábolas, o termo designa uma personagem distinta. A forma titular preserva essa função literária sem impor uma identificação cristológica posterior.
- issue: Sentido de ሃይማኖት na expressão associada à justiça
  choice: fé no texto principal, com fidelidade em nota
  alternative: fidelidade; constância
  rationale: O substantivo ge'ez admite tanto o sentido de fé quanto o de fidelidade. A ambiguidade teologicamente relevante é mantida de forma transparente.
- issue: Força de ይከውን na declaração sobre a justiça
  choice: haverá
  alternative: prevalecerá; estará
  rationale: A tradução segue o sentido básico de 'ser/existir' e evita introduzir a noção de triunfo. A leitura dinâmica tradicional fica disponível em nota.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem e a repetição conceitual do ge'ez foram preservadas, mas a construção existencial 'haverá justiça' evita uma formulação artificial em português. Os marcadores seguem a identificação da camada inglesa auditada, inclusive a ordem textual [a], [c], [b].
