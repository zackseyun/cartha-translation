base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/004.yaml
  text: 'And there I saw another vision: the dwelling places of the holy ones[a], and the resting places of the righteous.'
translation:
  language: pt
  text: 'E ali vi outra visão: as moradas dos santos e os lugares de repouso dos justos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida como “lugares de repouso” pode significar mais literalmente camas, leitos ou lugares onde alguém se deita.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: ali
  rationale: Advérbio locativo que situa a cena visionária; “ali” é natural e direto em português.
- source_word: ርኢኩ
  choice: tive ... visão
  rationale: Embora o verbo signifique literalmente “vi”, a construção portuguesa “tive outra visão” expressa com naturalidade o relato visionário em combinação com ራእየ ካልአ.
- source_word: ራእየ ካልአ
  choice: outra visão
  rationale: Indica uma nova revelação visionária; “outra” evita a precisão numérica potencialmente excessiva de “segunda”.
- source_word: ማኅደሪሆሙ
  choice: as moradas
  rationale: Transmite a ideia de habitações ou lugares onde se reside, com registro digno e corrente.
- source_word: ለቅዱሳን
  choice: dos santos
  rationale: Mantém a referência ampla aos que são santos sem explicitar se são seres celestes ou pessoas fiéis; em português, “santos” é a forma mais natural, embora possa ter associações eclesiásticas posteriores.
- source_word: ወምስካባቲሆሙ
  choice: e os lugares de repouso
  rationale: Preserva o campo semântico de deitar-se, cama e descanso, sem tornar a imagem excessivamente concreta no corpo do texto.
- source_word: ለጻድቃን
  choice: dos justos
  rationale: Equivalente português corrente para os moralmente retos, adequado à terminologia ética e apocalíptica do livro.
theological_decisions:
- issue: 'A identidade dos ቅዱሳን: seres celestes, fiéis falecidos ou povo vindicado de Deus.'
  choice: santos
  alternative: seres santos
  rationale: “Santos” conserva a designação sem identificar explicitamente o grupo. A tradução não resolve a ambiguidade apocalíptica do termo.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação apropriada à literatura visionária. A ordem e o paralelismo do ge'ez foram preservados, evitando arcaísmos.
