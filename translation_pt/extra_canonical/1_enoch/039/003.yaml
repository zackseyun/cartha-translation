base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/003.yaml
  text: And in those days a whirlwind of winds carried me away from the face of the earth and set me down at the end of the heavens[a].
translation:
  language: pt
  text: E naqueles dias, um turbilhão de ventos me levou da face da terra e me pôs no extremo dos céus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no limite dos céus”. A expressão em ge’ez indica a fronteira exterior ou o ponto mais distante na geografia da visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕል
  choice: dias
  rationale: Na fórmula temporal በውእቱ መዋዕል, “naqueles dias” preserva a expressão narrativa apocalíptica e soa natural em português.
- source_word: መሠጠኒ
  choice: me levou
  rationale: O verbo descreve o deslocamento de Enoque por uma força externa; “me levou” comunica o transporte sem impor exclusivamente ascensão vertical nem acrescentar violência não inequívoca.
- source_word: ዐውሎ ነፋሳት
  choice: um turbilhão de ventos
  rationale: Mantém a imagem intensificada da expressão etíope e seu caráter visionário, em vez de reduzi-la simplesmente a “vento”.
- source_word: እምገጸ ሰምድር
  choice: da face da terra
  rationale: Conserva a imagem semítica de “face” para a superfície da terra e o registro elevado do texto.
- source_word: አንበረኒ
  choice: me pôs
  rationale: No contexto, indica colocação no destino após o transporte; “me pôs” é claro, atual e suficientemente amplo.
- source_word: ጽንፈ ሰማያት
  choice: no extremo dos céus
  rationale: ጽንፍ designa extremidade, limite ou fronteira. “Extremo dos céus” preserva a geografia cósmica da visão e a forma plural de ሰማያት.
theological_decisions:
- issue: Geografia cósmica no transporte visionário
  choice: no extremo dos céus
  alternative: na borda do céu; no limite dos céus
  rationale: A redação conserva a representação espacial e apocalíptica do original, sem convertê-la em uma experiência celestial genérica nem definir além do texto a natureza dessa fronteira.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A sintaxe preserva o tom apocalíptico, a imagem “face da terra” e a linguagem espacial do original sem explicá-las dentro do versículo.
