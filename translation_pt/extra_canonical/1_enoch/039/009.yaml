base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/009.yaml
  text: In those days I praised and exalted the name of the Lord of Spirits with blessing and with praise[a], because he has strengthened me with blessing and with praise[b], according to the will of the Lord of Spirits.
translation:
  language: pt
  text: Naqueles dias, louvei e exaltei o nome do Senhor dos Espíritos com bênção e com louvor, porque ele me fortaleceu com bênção e com louvor[a], segundo a vontade do Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ele me firmou em bênção e em louvor” ou “ele me estabeleceu em bênção e em louvor”. O verbo ge'ez pode significar fortalecer, tornar firme ou estabelecer; a preposição também admite “em” em vez de “com”.
    reason: lexical_and_prepositional_ambiguity
lexical_decisions:
- source_word: በውእቱን መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica recorrente e o registro elevado do texto.
- source_word: ሰባሕኩ
  choice: louvei
  rationale: Expressa de modo direto e natural o perfeito na primeira pessoa, sem intensificação indevida.
- source_word: ወአልዐልኩ ስሞ
  choice: e exaltei o nome
  rationale: Mantém o idioma bíblico concreto de honrar e elevar o nome divino.
- source_word: ለእግዚአ መናፍስት
  choice: do Senhor dos Espíritos
  rationale: Conserva como título divino a fórmula característica de 1 Enoque.
- source_word: በረከተ ወስብሐተ
  choice: com bênção e com louvor
  rationale: Retém a repetição preposicional e o ritmo solene; 'bênção' designa aqui o ato de bendizer.
- source_word: እስመ
  choice: porque
  rationale: Torna explícita a relação causal em português moderno.
- source_word: አጽንዐኒ
  choice: ele me fortaleceu
  rationale: O causativo pode significar tornar firme, fortalecer ou estabelecer; 'fortaleceu' é natural no contexto, sem eliminar as alternativas lexicais.
- source_word: በበረከት ወስብሐት
  choice: com bênção e com louvor
  rationale: Preserva a repetição deliberada da expressão anterior e a leitura instrumental ou modal da preposição.
- source_word: በከመ ፈቃዱ
  choice: segundo a vontade
  rationale: Expressa conformidade com a vontade divina sem acrescentar formulação doutrinária posterior.
theological_decisions:
- issue: Sentido das expressões repetidas 'bênção e louvor'
  choice: Mantê-las como linguagem doxológica que descreve o modo ou âmbito do louvor e do fortalecimento de Enoque.
  alternative: Entendê-las como estado de bem-aventurança e glória, ou como capacitação divina para bendizer e louvar.
  rationale: A repetição em ge'ez favorece a preservação da linguagem litúrgica; a tradução evita reduzi-la a benefícios materiais ou resolver sua função preposicional.
- issue: Forma do título divino እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  alternative: Senhor dos espíritos
  rationale: A capitalização apresenta a expressão como título característico de 1 Enoque, sem redefinir quem são os espíritos.
- issue: Valor de አጽንዐኒ
  choice: fortaleceu
  alternative: firmou ou estabeleceu
  rationale: A opção principal comunica o sentido causativo de tornar firme, enquanto a nota conserva a possível ligação lexical com o campo semântico de estabelecer.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Mantêm-se a fórmula apocalíptica, o título divino e a repetição litúrgica do original.
