base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/001.yaml
  text: And it will happen in those days that the chosen and holy ones will descend from the high heaven[d][c][b][a], and their offspring will become one with the children of men.
translation:
  language: pt
  text: '**1 Enoque 39:1** — E acontecerá, naqueles dias, que filhos escolhidos e santos[a] descerão do alto céu[b], e a descendência deles se tornará uma só com os filhos dos homens.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos escolhidos e santos”. A forma etíope favorece a leitura dos termos “escolhidos” e “santos” como qualificativos de “filhos”. Algumas traduções antigas entendem a expressão como “filhos dos escolhidos e santos”.
    reason: lexical_alternative
  - marker: b
    text: A expressão indica origem celestial, mas este versículo, por si só, não identifica plenamente quem são esses filhos escolhidos e santos.
    reason: cultural_note
  - marker: c
    text: Literalmente, “a semente deles se tornará uma com os filhos dos homens”. A frase parece descrever alguma forma de união ou mistura, mas o texto etíope não declara aqui sua natureza exata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን፡ በዝኩ፡ መዋዕል
  choice: E acontecerá, naqueles dias
  rationale: Preserva a fórmula apocalíptica introdutória e seu valor futuro, em português natural e solene.
- source_word: ደቂቅ፡ ኅሩያን፡ ወቅዱሳን
  choice: filhos escolhidos e santos
  rationale: ደቂቅ está no estado absoluto, e os plurais ኅሩያን e ቅዱሳን funcionam naturalmente como adjetivos concordantes. “Filhos” conserva o sentido filial sem transformar os adjetivos em substantivos genitivos.
- source_word: ይወርዱ
  choice: descerão
  rationale: Mantém explicitamente o movimento vertical proveniente do céu.
- source_word: እምልዑል፡ ሰማይ
  choice: do alto céu
  rationale: Reproduz o céu singular e sua qualificação elevada sem impor uma cosmologia de vários céus ou o superlativo “mais alto”.
- source_word: ዘርኦሙ
  choice: a descendência deles
  rationale: Comunica em português atual o sentido genealógico de “semente”, evitando a possível leitura agrícola da tradução estritamente literal.
- source_word: አሐደ፡ ይከውን
  choice: se tornará uma só
  rationale: Conserva tanto o processo verbal de tornar-se quanto a ideia de unidade, sem explicitar o tipo de união.
- source_word: ምስለ፡ ውሉደ፡ ሰብእ
  choice: com os filhos dos homens
  rationale: Preserva a expressão antropológica tradicional e o contraste entre a origem celeste do primeiro grupo e a humanidade.
theological_decisions:
- issue: Identidade dos “filhos escolhidos e santos”
  choice: A tradução mantém a descrição do grupo sem identificá-lo expressamente como anjos, justos humanos ou outra classe celestial.
  alternative: “os filhos dos escolhidos e santos” ou “os escolhidos e santos”
  rationale: A forma absoluta de ደቂቅ favorece “filhos escolhidos e santos”; sua descida do céu sugere origem celestial, mas o versículo não define de modo suficiente a identidade do grupo.
- issue: Natureza da união com os filhos dos homens
  choice: “se tornará uma só com”
  alternative: “se misturará com”, “se unirá a” ou uma formulação explicitamente sexual
  rationale: O texto afirma unidade ou junção, mas não especifica neste versículo se ela ocorre por casamento, relação sexual, miscigenação ou outro tipo de associação. A formulação preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com cadência apocalíptica. Empregou-se “filhos dos homens” por seu valor literário e contrastivo, sem linguagem confessional posterior.
