base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/002.yaml
  text: And in those days Enoch received books of zeal and wrath[a], and books of tumult and confusion; and mercy shall not be upon them, says the Lord of Spirits.
translation:
  language: pt
  text: Naqueles dias, Enoque recebeu livros de zelo e ira, e livros de tumulto e confusão[a]; e não haverá misericórdia para eles, diz o Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação em ge’ez nesta parte do versículo é difícil no testemunho disponível. A expressão traduzida por «tumulto e confusão» também pode ser entendida, de modo mais geral, como perturbação, clamor ou desordem.
    reason: textual_variant
lexical_decisions:
- source_word: መዋዕል
  choice: dias
  rationale: Preserva a fórmula temporal apocalíptica «naqueles dias» sem especificar além do texto.
- source_word: ነሥአ
  choice: recebeu
  rationale: No contexto em que livros são dados a Enoque, exprime melhor sua condição de destinatário do que o literal «tomou».
- source_word: መጻሕፍተ
  choice: livros
  rationale: É a correspondência direta e legível para o plural, sem acrescentar a materialidade específica de «rolos».
- source_word: ቅንአት
  choice: zelo
  rationale: Mantém a amplitude do termo, que pode indicar zelo ou ciúme, e se ajusta ao contexto de juízo.
- source_word: መዐት
  choice: ira
  rationale: Conserva a força judicial e apocalíptica do termo em português corrente e digno.
- source_word: ጐጕአ
  choice: tumulto
  rationale: Representa de modo amplo a ideia provável de alvoroço, clamor ou perturbação diante da dificuldade da forma testemunhada.
- source_word: ሀውክ
  choice: confusão
  rationale: Comunica desordem e perturbação sem restringir excessivamente um vocábulo cuja leitura contextual permanece difícil.
- source_word: ምሕረት
  choice: misericórdia
  rationale: Termo tradicional e claro para a compaixão divina, preservando o contraste com o zelo e a ira.
- source_word: ኢይከውን ላዕሌሆሙ
  choice: não haverá misericórdia para eles
  rationale: Expressa em português natural a sentença de que a misericórdia não estará sobre eles, sem alterar seu sentido judicial.
- source_word: እግዚአ መናፈስት
  choice: Senhor dos Espíritos
  rationale: Preserva o título divino recorrente nas Parábolas e seu registro elevado.
theological_decisions:
- issue: Natureza dos «livros» mencionados
  choice: Enoque recebe mais de um conjunto de livros, caracterizados por zelo e ira, tumulto e confusão.
  alternative: A expressão pode descrever de forma composta um único conjunto de escritos; os termos difíceis também podem apontar para clamor ou perturbação.
  rationale: A repetição do plural መጻሕፍተ favorece a apresentação de conjuntos distintos, mas a tradução não define indevidamente seu conteúdo.
- issue: Referente de «eles»
  choice: O pronome se refere às pessoas submetidas ao juízo no contexto circundante.
  alternative: Uma ligação meramente linear poderia associá-lo aos itens imediatamente anteriores, embora isso produza sentido contextual pouco plausível.
  rationale: A declaração sobre a ausência de misericórdia funciona naturalmente como sentença contra pessoas, preservando a tensão judicial do contexto.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva o tom de oráculo judicial sem recorrer a formulações excessivamente arcaicas.
