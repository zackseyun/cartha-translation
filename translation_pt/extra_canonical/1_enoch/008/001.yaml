base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/008/001.yaml
  text: 'And Azazel taught men to make swords[a], and knives, and shields, and breastplates; and he showed them what was behind them and their works: bracelets, and ornaments, and the painting of the eyes, and the beautifying of the eyelids, and every kind of costly stone[b], and all coloring tinctures.'
translation:
  language: pt
  text: 'Azazel ensinou os homens a fabricar espadas, facas, escudos e couraças; e mostrou-lhes o que estava por trás deles[a] e as suas obras: braceletes, adornos, a pintura dos olhos, o embelezamento das pálpebras, toda espécie de pedra preciosa[b] e todas as tinturas coloridas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “o que estava por trás deles” corresponde a uma leitura etíope difícil (†ዘእምድኅሬሆሙ†). O texto pode estar corrompido ou referir-se ao que resultava dessas artes; algumas traduções adotam conjecturas mais fluidas, como uma referência aos metais.
    reason: textual_variant
  - marker: b
    text: Os termos cosméticos provavelmente descrevem a pintura dos olhos e práticas relacionadas de embelezamento, não apenas a ideia abstrata de beleza.
    reason: cultural_note
lexical_decisions:
- source_word: መሀሮሙ ለሰብእ
  choice: ensinou os homens
  rationale: Expressa diretamente o ensino de conhecimentos aos seres humanos; “homens” preserva o provável referente social imediato sem ampliar silenciosamente o texto.
- source_word: ገቢረ አሰይፍት
  choice: a fabricar espadas
  rationale: ገቢረ indica produção ou trabalho artesanal; “fabricar” deixa claro que se trata da confecção das armas.
- source_word: መጣብኅት
  choice: facas
  rationale: Termo amplo para instrumentos ou armas cortantes, sem especificar indevidamente adagas militares.
- source_word: ወወልታ ወድርዐ አንግድዓ
  choice: escudos e couraças
  rationale: Designa equipamento defensivo e armadura do torso; os equivalentes são claros e dignos em português atual.
- source_word: ዘእምድኅሬሆሙ
  choice: o que estava por trás dessas coisas
  rationale: Mantém a obscuridade da expressão etíope assinalada como difícil, evitando substituí-la pela conjectura interpretativa “seus metais”.
- source_word: ወምግባሮሙ
  choice: e como eram feitas
  rationale: Traduz idiomaticamente a ideia de obra, feitura ou trabalho, embora a sintaxe com a expressão precedente permaneça incerta.
- source_word: እውቃፋተ ወስርጐ
  choice: braceletes, adornos
  rationale: Termos acessíveis para objetos usados no braço e para enfeites em sentido mais geral.
- source_word: ወተጽሕሎተ ወአስንዮተ ቀርንብ
  choice: a pintura dos olhos, o embelezamento das pálpebras
  rationale: Conserva a referência concreta a práticas cosméticas, provavelmente pintura ao redor dos olhos.
- source_word: ወእብነ እምኵሉ እብን
  choice: toda espécie de pedra valiosa
  rationale: “Valiosa” preserva a noção de custo ou estima sem impor uma classificação mineralógica mais específica.
theological_decisions:
- issue: Apresentar o ensino de Azazel como artesanato neutro ou conhecimento corruptor proibido
  choice: Manter os verbos neutros “ensinou” e “mostrou”, deixando que a lista e o contexto narrativo transmitam a censura.
  alternative: Acrescentar qualificações como “para a guerra”, “sedutor” ou “proibido”.
  rationale: O versículo não emprega aqui um adjetivo moral explícito. Acrescentá-lo resolveria interpretativamente uma tensão que o texto preserva.
- issue: Sentido da expressão etíope obelizada ዘእምድኅሬሆሙ
  choice: Preservar uma tradução próxima e obscura, acompanhada de nota textual.
  alternative: Adotar a conjectura contextual “seus metais” ou reformular como “as consequências dessas artes”.
  rationale: A testemunha fornecida é difícil e de confiança média; uma conjectura fluente não deve ser apresentada como se fosse leitura segura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação em forma de lista acompanha o ritmo do ge'ez; a passagem textual obscura foi mantida no corpo e explicada em nota, sem falsa precisão.
