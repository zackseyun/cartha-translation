  text: And among them was a tree whose fragrance I had never smelled[a][b].
translation:
  language: pt
  text: E entre elas havia uma árvore cuja fragrância eu jamais havia sentido[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma final do testemunho transcrito parece estar corrompida. Uma leitura provável, apoiada pelo testemunho grego, significa “eu cheirei” ou “senti o cheiro” e produz o sentido “jamais havia sentido”. A interpretação anterior “como mirra” decorre, ao que tudo indica, dessa leitura defeituosa.
    reason: textual_variant
lexical_decisions:
- source_word: ወሀሎ
  choice: E ... havia
  rationale: A forma introduz a existência ou presença de algo e dá continuidade natural à narrativa.
- source_word: እምውስቴቶሙ
  choice: entre elas
  rationale: Indica localização no meio do grupo de árvores mencionado no contexto; o pronome feminino torna explícito esse referente em português.
- source_word: ዕፅ
  choice: uma árvore
  rationale: No cenário visionário e botânico, “árvore” é o sentido concreto mais adequado.
- source_word: ዘአልቦ ገሙራ
  choice: jamais
  rationale: A construção negativa, entendida à luz da leitura corrigida do trecho e do testemunho grego, expressa a ideia de “nunca” ou “em tempo algum”.
- source_word: አመ ጼወኒ (provavelmente por አመ ጼኖኩ)
  choice: eu ... havia sentido
  rationale: A forma final transmitida parece resultar de erro de leitura ou transcrição; ጼኖኩ significa “eu cheirei/senti o cheiro”. Em português, “sentir a fragrância” é mais natural do que “cheirar uma fragrância” e mantém a experiência sensorial.
- source_word: fragrância implícita na construção
  choice: cuja fragrância
  rationale: O objeto do olfato fica implícito no texto reconstruído. Explicitá-lo evita a formulação pouco natural “uma árvore que eu jamais havia cheirado”, sem acrescentar uma comparação com mirra ausente da leitura mais provável.
theological_decisions:
- issue: Natureza da característica distintiva da árvore
  choice: A árvore possuía uma fragrância que o visionário jamais havia sentido.
  alternative: A fragrância da árvore era semelhante à mirra.
  rationale: A leitura “mirra” depende de uma interpretação equivocada da forma final no testemunho transcrito. A provável correção para “eu cheirei”, apoiada pelo grego, produz de modo coerente o sentido “jamais havia sentido”. A nota preserva transparência quanto à dificuldade textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Jamais” preserva o tom elevado sem soar arcaico; “sentir a fragrância” é idiomático e evita a ambiguidade de “cheirar uma árvore”.
