base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/002.yaml
  text: And I went in that direction and saw seven glorious mountains[a], each one differing from the other; and their stones were glorious and beautiful, and all of them were glorious and splendid in appearance, and fair in face. Three were toward the east, one set upon another, and three toward the north, one set upon another, with deep and winding ravines[d][c][b], no one coming near to another.
translation:
  language: pt
  text: E segui pelo meu caminho[a] e vi sete montanhas gloriosas, cada uma diferente da outra. Suas pedras eram gloriosas e belas; todas eram gloriosas e esplêndidas de aparência e belas de rosto.[b] Três ficavam para o leste, firmes, uma sobre a outra, e três para o norte, uma sobre a outra, com ravinas profundas e sinuosas, sem que uma se aproximasse da outra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fui naquela direção”. Literalmente, “segui pelo meu caminho”.'
    reason: textual_ambiguity
  - marker: b
    text: Literalmente, “e belo era o rosto delas”. A imagem descreve as montanhas em termos quase personificados.
    reason: cultural_note
  - marker: c
    text: A descrição ge’ez é sintaticamente difícil. O texto menciona três montanhas para o leste e três para o norte, embora antes fale de sete; não explica aqui de modo inequívoco a posição da sétima. A frase final parece referir-se às ravinas.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ሖርኩ፡ መንገሌሁ
  choice: fui naquela direção
  rationale: Mantém o movimento da narrativa visionária e representa a expressão direcional sem tornar o português excessivamente literal.
- source_word: ሰብዐተ፡ አድባረ፡ ክቡራነ
  choice: sete montanhas gloriosas
  rationale: “Gloriosas” preserva o campo semântico de honra, esplendor e majestade de ክቡራነ, adequado ao registro apocalíptico.
- source_word: ወኵሉ፡ ፩እምነ፡ ፩እንዘ፡ ይትዌለጥ
  choice: cada uma diferente da outra
  rationale: Expressa a distinção entre as montanhas sem reduzi-la necessariamente a separação espacial.
- source_word: እእባኒ፡ ክቡራነ፡ ወሠናያነ
  choice: suas pedras eram gloriosas e belas
  rationale: Conserva a referência concreta às pedras e a dupla descrição de esplendor e beleza.
- source_word: ወኵሉ፡ ክቡር፡ ወስቡሕ፡ ራእዮሙ
  choice: todas tinham aparência gloriosa e esplêndida
  rationale: Reproduz a intensificação visual do original em português claro e digno.
- source_word: ወሠናይ፡ ገጾሙ
  choice: e rosto belo
  rationale: Mantém a imagem literalmente personificadora das montanhas, em vez de achatá-la como mera “boa aparência”.
- source_word: ፫መንገለ፡ ጽባሕ
  choice: três ficavam para o leste
  rationale: Interpreta ጽባሕ espacialmente como leste, mantendo a construção paralela com o norte.
- source_word: ጽኑዓን፡ ፩ዲበ፡ ፩
  choice: firmes, uma sobre a outra
  rationale: “Firmes” conserva a ideia da raiz de ጽኑዓን, enquanto “uma sobre a outra” preserva o arranjo vertical ou escalonado sem sugerir construção artificial.
- source_word: ቈላት፡ ዕሙቅ፡ ወጠዋያት
  choice: ravinas profundas e sinuosas
  rationale: Traduz ጠዋያት como “sinuosas”, não como “vale”, de acordo com seu sentido de tortuoso ou curvo.
- source_word: አሐቲ፡ ለአሐቲ፡ ኢይትቃረባ
  choice: sem que uma se aproximasse da outra
  rationale: O feminino singular retoma naturalmente “ravinas” em português e evita o antropomorfismo de “ninguém”.
