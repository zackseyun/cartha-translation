base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/003.yaml
  text: And the seventh mountain was in the midst of these[a], and its height surpassed them all, resembling the seat of a throne[c][b], and fragrant trees encircled it.
translation:
  language: pt
  text: E o sétimo monte estava no meio destes[a]; sua altura ultrapassava a de todos eles, e ele se assemelhava ao assento de um trono[b]; árvores aromáticas o cercavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez desta frase é difícil. O sentido de que o sétimo monte ultrapassava os demais em altura é apoiado pelo testemunho grego.
    reason: textual_variant
  - marker: b
    text: Literalmente, “assento de um trono”; a expressão dupla do ge'ez foi preservada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕ
  choice: o sétimo
  rationale: Adjetivo ordinal que introduz o último monte da sequência; o artigo é natural em português.
- source_word: ደብር
  choice: monte
  rationale: Termo comum para monte ou montanha; “monte” mantém o tom bíblico sem deixar de ser corrente.
- source_word: ማእከሎሙ ለእሎንቱ
  choice: no meio destes
  rationale: Preserva tanto a localização central quanto o demonstrativo referente aos montes já mencionados.
- source_word: ኖኆሙ ዘይትማሰሉ [ኵሎሙ]
  choice: sua altura ultrapassava a de todos eles
  rationale: A forma etíope transmitida é difícil, mas o testemunho grego sustenta o sentido comparativo de que o sétimo monte excedia os demais em altura; a nota registra a incerteza textual.
- source_word: መንበረ አትራኖስ
  choice: assento de um trono
  rationale: Mantém a expressão dupla do ge'ez, em vez de reduzi-la simplesmente a “trono”.
- source_word: የአውድዎ
  choice: o cercavam
  rationale: Expressa de modo natural o ato de rodear o monte.
- source_word: ዕጸወ መዓዛ
  choice: árvores aromáticas
  rationale: Transmite a ideia de árvores caracterizadas por seu aroma; é uma formulação corrente e digna em português.
