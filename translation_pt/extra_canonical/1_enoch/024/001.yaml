base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/001.yaml
  text: And from there I went to another place of the earth[a], and he showed me a mountain of fire that blazed day and night.
translation:
  language: pt
  text: E dali fui para outro lugar da terra, e ele me mostrou uma montanha de fogo que flamejava dia e noite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito de “ele me mostrou” está implícito no ge’ez; o contexto sugere que seja o guia angelical de Enoque.
    reason: alternativa lexical e esclarecimento do sujeito implícito
lexical_decisions:
- source_word: እምህየ
  choice: dali
  rationale: Indica o prosseguimento espacial da jornada visionária; “dali” é natural e conciso em português.
- source_word: ሖርኩ
  choice: fui
  rationale: Preserva a forma direta da narrativa em primeira pessoa, sem acrescentar a ideia específica de viagem prolongada.
- source_word: ካልአ መካነ ምድር
  choice: outro lugar da terra
  rationale: Mantém de perto a construção “outro lugar de terra/da terra” e seu caráter geográfico-cósmico.
- source_word: አርአየኒ
  choice: ele me mostrou
  rationale: Expressa o verbo causativo de visão de modo idiomático; conserva o sujeito masculino implícito sem identificá-lo no corpo do texto.
- source_word: ደብረ እሳት
  choice: uma montanha de fogo
  rationale: Reproduz diretamente a construção nominal e preserva a imagem apocalíptica marcante.
- source_word: ዘያንበለብል
  choice: que ardia intensamente
  rationale: Comunica a ação contínua e vigorosa do fogo em português atual, sem reduzir a imagem a um simples adjetivo.
- source_word: መዐልተ ወሌሊተ
  choice: dia e noite
  rationale: Preserva o par temporal conciso, que sugere continuidade.
theological_decisions:
- issue: Sujeito implícito de “ele me mostrou”
  choice: Manter “ele” sem especificar sua identidade
  alternative: “o anjo me mostrou” ou “meu guia me mostrou”
  rationale: Embora o contexto provavelmente aponte para o guia angelical de Enoque, o versículo não o nomeia; a tradução preserva essa indeterminação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem narrativa e a imagem apocalíptica do ge’ez foram mantidas; evitou-se identificar explicitamente o guia no texto principal.
