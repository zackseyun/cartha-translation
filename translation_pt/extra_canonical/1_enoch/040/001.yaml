base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/001.yaml
  text: And after that I saw thousands of thousands and ten thousands of ten thousands[a], whose number and count were without end[e][d][c][b], standing before the Lord of Spirits.
translation:
  language: pt
  text: E, depois disso, vi milhares de milhares e dezenas de milhares de dezenas de milhares[a] — não havia número nem contagem deles[b] — em pé diante do Senhor dos Espíritos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “milhares de milhares e dezenas de milhares de dezenas de milhares”, fórmula que expressa uma multidão imensa.
    reason: lexical_clarification
  - marker: b
    text: A transcrição disponível marca como incerta a leitura de *ኍልቈ, aqui entendida como “número”. A frase também pode ser expressa como “não se podiam numerar nem contar”.
    reason: textual_variant
  - marker: c
    text: Compare Daniel 7:10, que apresenta uma visão semelhante de uma multidão incontável diante do tribunal divino. Também seria possível traduzir o título por “Senhor de Espíritos”, pois o ge’ez não possui artigo definido.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ እምድኅረዝ
  choice: E, depois disso, vi
  rationale: Preserva a coordenação narrativa de ወ-, o perfeito de primeira pessoa de רʾy/ርእይ, «ver», e o valor temporal de እምድኅረዝ, em português natural e solene.
- source_word: አእላፈ፡ አእላፍ
  choice: milhares de milhares
  rationale: Reproduz a construção numérica intensiva do ge’ez sem substituí-la por uma expressão interpretativa como «inúmeros».
- source_word: ትእልፊተ፡ ትእልፊት
  choice: dezenas de milhares de dezenas de milhares
  rationale: O substantivo designa dez mil; a repetição comunica uma multidão imensa e mantém o paralelismo apocalíptico.
- source_word: '*ኍልቈ፡ ወኃሳበ፡ አልቦሙ'
  choice: dos quais não havia número nem contagem
  rationale: Representa os dois termos coordenados, «número» e «contagem/cômputo», e verte literalmente a construção existencial negativa com o sufixo plural, sem acrescentar explicitamente a ideia de «fim».
- source_word: እለ፡ ይቀውሙ፡ ቅድመ
  choice: em pé diante de
  rationale: A forma verbal plural descreve a postura dos integrantes da multidão; «em pé diante de» é idiomático e conserva o cenário solene de corte celestial.
- source_word: እግዚአ፡ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém como título divino a fórmula recorrente nas Parábolas de Enoque. O artigo contraído é natural em português, embora o ge’ez não marque artigo definido.
theological_decisions:
- issue: Referente e forma do título እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  alternative: Senhor de espíritos
  rationale: No contexto das Parábolas, a expressão funciona repetidamente como título do Deus Altíssimo, perante quem está a hoste celestial. A tradução conserva o título sem identificar os «espíritos» de maneira mais específica do que o texto permite.
- issue: Identidade da multidão
  choice: Não especificada além de sua posição diante do Senhor dos Espíritos
  alternative: Identificá-la expressamente como anjos ou santos
  rationale: Embora o contexto seja celestial, este versículo não nomeia a multidão. A tradução evita resolver essa ambiguidade por inferência teológica.
translation_notes:
  register: Português moderno, amplamente compreensível e de leitura natural no Brasil, com cadência solene adequada à visão apocalíptica. Conservam-se o paralelismo numérico, a ambiguidade quanto à identidade da multidão e a forma titular tradicional.
