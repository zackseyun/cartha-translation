  text: The voice of the first blesses the Lord of Spirits forever and ever[a][b].
translation:
  language: pt
  text: A voz do primeiro bendiz o Senhor dos Espíritos para todo o sempre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A fala do primeiro bendiz o Senhor dos Espíritos para todo o sempre”. O termo ge''ez pode indicar tanto voz quanto fala; “voz” combina melhor com a cena de vozes celestiais.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradução anterior: “A primeira voz”. A forma ge''ez está no estado construto e, mais literalmente, diz “a voz do primeiro”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ቃለ
  choice: voz
  rationale: O substantivo em estado construto significa aqui “voz de” ou “fala de”. “Voz” preserva melhor o caráter auditivo da cena visionária e sua ligação com aquele que fala.
- source_word: ቀዳማዊ
  choice: o primeiro
  rationale: O ordinal substantivado é regido pelo construto ቃለ, formando “a voz do primeiro”, provavelmente em referência à primeira das presenças mencionadas no contexto, e não simplesmente “a primeira voz”.
- source_word: ይባርኮ
  choice: bendiz
  rationale: O verbo finito expressa o ato de abençoar ou bendizer. “Bendiz” é natural em português para louvor dirigido a Deus e mantém o presente da visão.
- source_word: ለእግዚአ መናፍስት
  choice: o Senhor dos Espíritos
  rationale: Mantém o título divino recorrente e solene de 1 Enoque, sem o reduzir a uma descrição genérica.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Expressão portuguesa corrente e solene que comunica a duração ilimitada e a intensificação do idioma ge'ez.
theological_decisions:
- issue: Forma do título divino ለእግዚአ መናፍስት
  choice: o Senhor dos Espíritos
  alternative: o Soberano dos espíritos
  rationale: “Senhor dos Espíritos” conserva o peso teológico e a função titular da expressão recorrente nas Parábolas, sem acrescentar uma interpretação sobre a identidade dos espíritos.
- issue: Identidade de “o primeiro”
  choice: preservar a referência elíptica como “o primeiro”
  alternative: explicitar “o primeiro anjo” ou “a primeira presença”
  rationale: O texto deste versículo não fornece um substantivo explícito. A tradução conserva a elipse e evita definir além da fonte se o referente deve ser entendido como presença, figura ou anjo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Bendiz” mantém o registro litúrgico sem soar arcaico; a construção “a voz do primeiro” preserva a gramática e a ambiguidade referencial do ge'ez.
