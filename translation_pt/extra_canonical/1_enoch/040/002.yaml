base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/002.yaml
  text: And on the four sides of the Lord of Spirits I saw four other faces[a], different from those who do not sleep. And I learned their names[c][b], for the angel who came with me made their names known to me and showed me all the hidden things.
translation:
  language: pt
  text: E, nos quatro lados[c] do Senhor dos Espíritos, vi outros quatro rostos[a], diferentes daqueles que não dormem. Soube os nomes deles, pois o anjo que veio comigo me deu a conhecer os nomes deles e me mostrou todas as coisas ocultas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “outras quatro faces”. O ge''ez conserva a imagem concreta de rostos ou faces, em vez de empregar um termo abstrato como “presenças”.'
    reason: lexical_alternative
  - marker: b
    text: “As coisas ocultas” também pode ser traduzido por “os segredos”, expressão frequente na literatura apocalíptica para mistérios celestiais revelados numa visão.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “junto às quatro asas”. A palavra ge''ez pode significar “asa”, mas também “extremidade” ou “lado”; a construção não determina com plena segurança qual imagem se pretende.'
    reason: source_ambiguity
lexical_decisions:
- source_word: በአርባዕቱ ክነፊሁ
  choice: nos quatro lados
  rationale: Embora ክነፍ tenha o sentido concreto de “asa”, também pode designar extremidade ou lado. Neste quadro espacial ao redor do Senhor dos Espíritos, “nos quatro lados” evita atribuir-lhe asas sem apagar a imagem alternativa, registrada em nota.
- source_word: ለእግዚአ መናፍስት
  choice: do Senhor dos Espíritos
  rationale: Mantém o título divino característico de 1 Enoque em forma traduzida e reconhecível.
- source_word: አርባዕተ ገጸ ካልአ
  choice: outros quatro rostos
  rationale: ገጽ significa normalmente “rosto”. A tradução conserva a concretude visual da visão e não substitui o termo por uma abstração como “presenças”.
- source_word: እምነ እለ ኢይነውሙ
  choice: diferentes daqueles que não dormem
  rationale: Expressa de modo claro a distinção entre os quatro rostos vistos e os seres anteriormente mencionados que permanecem despertos.
- source_word: አእመርኩ
  choice: soube
  rationale: Comunica o ato de vir a conhecer no decorrer da visão, em português natural e digno.
- source_word: ዘአይዐኒ አስማቲሆሙ
  choice: me deu a conhecer os nomes deles
  rationale: Preserva o valor causativo da expressão e explicita como Enoque passou a saber os nomes.
- source_word: ኅቡኣተ
  choice: as coisas ocultas
  rationale: Mantém o sentido de realidades escondidas que são reveladas na visão, sem impor uma terminologia técnica posterior.
theological_decisions:
- issue: Tradução do título divino እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  alternative: Senhor dos espíritos
  rationale: A capitalização apresenta a expressão como o título divino recorrente em 1 Enoque, sem definir se “espíritos” abrange todos os espíritos ou uma classe celestial específica.
- issue: Possível atribuição de asas ao Senhor dos Espíritos
  choice: lados
  alternative: asas
  rationale: O sentido espacial é adequado ao contexto e evita resolver a construção mediante uma atribuição física incerta; a leitura concreta “asas” permanece documentada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com boa naturalidade brasileira. Conserva a repetição de “nomes deles”, presente na progressão do original, e mantém as imagens visionárias sem as converter em categorias teológicas mais específicas.
