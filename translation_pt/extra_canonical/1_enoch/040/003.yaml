base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/003.yaml
  text: And I heard the voices of those four beings as they gave praise before the Lord of glory[a][b][c].
translation:
  language: pt
  text: E ouvi as vozes daqueles quatro seres[a][b], enquanto louvavam diante do Senhor da glória[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “daquelas quatro faces”. A expressão parece referir-se às quatro figuras celestiais vistas na visão, e não a rostos isolados.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “daquelas quatro presenças”.'
    reason: previous_rendering
  - marker: c
    text: O título também pode ser traduzido como “Senhor do esplendor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕኩ
  choice: E ouvi
  rationale: Expressa diretamente o verbo na primeira pessoa e mantém o estilo de relato visionário.
- source_word: ቃሎሙ
  choice: as vozes
  rationale: O substantivo pode indicar voz, som ou palavra; no contexto do louvor celestial, “vozes” comunica melhor a cena audível sem especificar palavras não registradas.
- source_word: እልኩ ገጽ አርባዕቱ
  choice: daqueles quatro seres
  rationale: ገጽ significa literalmente “face”, mas aqui retoma quatro figuras celestiais da visão. “Seres” é natural em português e evita sugerir quatro rostos separados; a imagem literal e a alternativa “presenças” são preservadas em notas.
- source_word: እንዘ ይሴብሑ
  choice: enquanto louvavam
  rationale: Reproduz a ação simultânea indicada pela construção e emprega linguagem corrente e digna.
- source_word: ቅድመ
  choice: diante de
  rationale: Equivale a “perante” ou “na presença de” e preserva o cenário de corte celestial com naturalidade.
- source_word: እግዚአ ስብሐት
  choice: Senhor da glória
  rationale: Tradução natural do título divino, coerente com a dicção bíblica em português; “esplendor” continua possível para ስብሐት.
theological_decisions:
- issue: Se ገጽ deve ser traduzido literalmente como “faces” ou contextualmente como referência às quatro figuras celestiais
  choice: quatro seres
  alternative: quatro faces; quatro presenças
  rationale: O contexto aponta para figuras celestiais, não para rostos isolados. “Seres” oferece clareza sem identificá-los mais especificamente como anjos ou introduzir uma classificação doutrinária; a forma literal permanece documentada.
- issue: Como verter o título እግዚአ ስብሐት
  choice: Senhor da glória
  alternative: Senhor do esplendor
  rationale: “Glória” conserva a formulação bíblica tradicional e o caráter de título divino, enquanto “esplendor” representa uma nuance lexical legítima indicada em nota.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. A coordenação inicial e a primeira pessoa preservam o ritmo do relato visionário; “enquanto louvavam” torna explícita apenas a simultaneidade já presente na construção etíope.
