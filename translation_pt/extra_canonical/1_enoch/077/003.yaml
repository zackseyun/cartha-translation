base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/003.yaml
  text: 'And the fourth wind[a], whose name is the North, is divided into three parts: one part for a dwelling for humankind, and another is over the seas of water of water, and over the abysses, and over the forests, and over the rivers, and over darkness, and over mist[g][f][e][d][c][b]; and the third part is in the garden of righteousness.'
translation:
  language: pt
  text: 'E o quarto vento, cujo nome é Mesʿ[a], divide-se em três partes: uma delas é uma morada para a humanidade; outra está sobre os mares de água[b], sobre os vales, sobre o deserto, sobre os rios, sobre a escuridão e sobre a névoa[c]; e a terceira parte está no jardim da justiça[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mesʿ é a transliteração do nome em ge'ez; seu significado é incerto.
    reason: lexical_alternative
  - marker: b
    text: A expressão “mares de água” traduz literalmente a formulação do ge'ez; pode significar simplesmente “os mares”.
    reason: lexical_alternative
  - marker: c
    text: O termo traduzido como “névoa” é incerto e também pode indicar neblina, nuvem ou vapor atmosférico semelhante.
    reason: lexical_alternative
  - marker: d
    text: “Jardim da justiça” pode evocar o Éden ou o Paraíso, mas o texto não especifica essa identificação.
    reason: cross_reference
lexical_decisions:
- source_word: ራብዕ ነፋስ
  choice: o quarto vento
  rationale: O ordinal introduz o quarto elemento de uma sequência, e ነፋስ designa aqui um vento cósmico, não “espírito” ou “sopro”.
- source_word: ዘስሙ መስዕ
  choice: cujo nome é Mesʿ
  rationale: A expressão declara explicitamente o nome do vento. O nome ge'ez é transliterado, sem substituí-lo por um ponto cardeal não presente no texto-fonte.
- source_word: ይትከፈል ሠለስተ ክፍለ
  choice: divide-se em três partes
  rationale: Reproduz com clareza a forma passiva/reflexiva e a distribuição tripartida.
- source_word: ማኅደር ለሰብእ
  choice: é morada para a humanidade
  rationale: ማኅደር significa morada ou habitação, e ሰብእ tem referência humana coletiva; “humanidade” evita restringir desnecessariamente o sentido aos homens.
- source_word: አብሕርት ማይ
  choice: mares de água
  rationale: Mantém a formulação enfática ou pleonástica do ge'ez, embora em português “mares” fosse mais idiomático.
- source_word: ቀላያት
  choice: vales
  rationale: Designa provavelmente depressões de terreno, vales ou ravinas; “vales” é a opção ampla e natural.
- source_word: ፆም
  choice: deserto
  rationale: Refere-se a uma região árida ou desolada; “deserto” preserva o sentido geográfico sem acrescentar uma interpretação simbólica.
- source_word: አፍላግ
  choice: rios
  rationale: É o equivalente corrente para rios ou cursos de água.
- source_word: ጽልመት
  choice: escuridão
  rationale: A tradução direta conserva a amplidão cósmica da enumeração.
- source_word: ጊሜ
  choice: névoa
  rationale: O termo parece indicar vapor atmosférico, embora sua nuance exata entre névoa, neblina e nuvem seja incerta.
- source_word: ገነት ጽድቅ
  choice: jardim da justiça
  rationale: Tradução direta que preserva a expressão do ge'ez sem identificá-la explicitamente com o Éden ou o Paraíso.
theological_decisions:
- issue: Identidade do “jardim da justiça”
  choice: Manter a expressão literal “jardim da justiça”
  alternative: Identificá-lo no texto como Éden ou Paraíso
  rationale: A expressão pode evocar um lugar edênico ou paradisíaco, mas o ge'ez não exige uma identificação mais específica. A formulação literal preserva essa abertura interpretativa.
- issue: Nome do quarto vento
  choice: Transliterar Mesʿ
  alternative: Traduzir ou identificar o nome como “Norte”
  rationale: O texto ge'ez apresenta መስዕ como nome próprio. Substituí-lo por “Norte” resolveria uma identificação que não está explicitada nesta oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe fluente e leve solenidade. A repetição de “sobre” conserva o ritmo enumerativo do original. Foram acrescentadas cópulas exigidas pela naturalidade do português, sem alterar a estrutura das três partes.
