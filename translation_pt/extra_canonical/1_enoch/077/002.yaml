base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/002.yaml
  text: And the wind from the west is named Hegulā[b][a], because there all the lights of heaven fade and go down.
translation:
  language: pt
  text: E o vento que vem do oeste chama-se Hegulā, porque ali todas as luzes do céu perdem o brilho[a] e descem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minguam” ou “diminuem”. O verbo indica perda ou redução, aqui provavelmente do brilho aparente dos astros.
    reason: lexical_alternative
  - marker: b
    text: Isto é, provavelmente, “se põem” no oeste.
    reason: contextual_clarification
lexical_decisions:
- source_word: ነፋስ
  choice: vento
  rationale: No Livro Astronômico, o termo designa um vento direcional, não um espírito.
- source_word: እምዕራብ
  choice: que vem do oeste
  rationale: A preposição እም indica origem; esta formulação comunica isso com naturalidade em português.
- source_word: ስሙ
  choice: chama-se
  rationale: Reproduz de modo conciso e corrente a fórmula de nomeação.
- source_word: ኀጕላ
  choice: Hegulā
  rationale: Nome próprio do vento ocidental, transliterado em vez de traduzido.
- source_word: በህየ
  choice: ali
  rationale: Retoma a região ocidental mencionada imediatamente antes.
- source_word: የሐፅፁ
  choice: perdem o brilho
  rationale: O verbo exprime diminuição ou declínio; no contexto dos astros, esta opção é natural e evita a noção incorreta de que são apagados.
- source_word: ኵሉ ብርሃናት ሰማይ
  choice: todas as luzes do céu
  rationale: Mantém a imagem cosmológica do ge'ez em linguagem clara e digna.
- source_word: ወይወርዱ
  choice: e descem
  rationale: Preserva o sentido concreto de movimento descendente sem restringi-lo silenciosamente ao termo astronômico 'se põem'.
theological_decisions:
- issue: Emprego de linguagem astronômica técnica ou de imagem apocalíptico-cosmológica
  choice: todas as luzes do céu perdem o brilho e descem
  alternative: todos os luminares do céu minguam e se põem
  rationale: A redação conserva a imagem concreta e a ambiguidade do original, embora no contexto provavelmente descreva o declínio e o ocaso dos astros.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém tom digno e imagético, sem tecnicismo desnecessário; “Hegulā” conserva a transliteração do nome próprio.
