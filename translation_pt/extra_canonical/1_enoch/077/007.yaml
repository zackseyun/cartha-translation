base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/007.yaml
  text: And the four remaining ones go out by the north side to their own sea—two of them to the Eritrean Sea[d][c][b][a], and two to the Great Sea.
translation:
  language: pt
  text: 'E os quatro restantes saem pelo lado norte até o seu próprio mar[a]: dois deles até o Mar Eritreu[b][d] e dois junto ao Grande Mar[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até o mar deles». A preposição ge''ez pode indicar tanto extensão quanto destino.'
    reason: lexical_alternative
  - marker: b
    text: «Mar Eritreu» reproduz um antigo nome geográfico presente no testemunho etíope; não deve ser identificado automaticamente apenas com o atual mar Vermelho.
    reason: cultural_note
  - marker: c
    text: «Grande Mar» é uma designação geográfica tradicional da Antiguidade, geralmente referente ao Mediterrâneo.
    reason: cultural_note
  - marker: d
    text: O testemunho repete, entre parênteses, parte da construção em torno de «dois [...] e dois», o que pode refletir uma perturbação de cópia ou uma divisão enfática. A tradução apresenta o sentido aparente.
    reason: textual_variant
lexical_decisions:
- source_word: እለ ተርፉ
  choice: os outros
  rationale: A expressão identifica o grupo que resta após a divisão numérica anterior. “Os outros” é natural em português e mantém a relação com o contexto precedente.
- source_word: አርባዕቱ
  choice: quatro
  rationale: O numeral explícito é preservado porque a descrição cosmológica depende de grupos contados.
- source_word: ይወፅኡ
  choice: saem
  rationale: Verbo de movimento direto e corrente, adequado ao contexto das saídas dos astros sem elevar desnecessariamente o registro.
- source_word: በገቦ መስዕ
  choice: pelo lado norte
  rationale: Mantém a orientação espacial da expressão e evita impor um termo astronômico técnico que o testemunho não exige.
- source_word: እስከ ባሕረ ዚአሆሙ
  choice: até o seu próprio mar
  rationale: “Até” conserva o valor de extensão ou limite de እስከ, enquanto “seu próprio” retém a estranha associação possessiva do texto.
- source_word: ባሕረ ኤርትራ
  choice: o mar Eritreu
  rationale: Preserva o antigo nome geográfico transliterado no testemunho etíope, sem reduzi-lo automaticamente ao sentido moderno mais estreito de “mar Vermelho”.
- source_word: ባሕር ዓቢይ
  choice: o Grande Mar
  rationale: Mantém a designação geográfica antiga em vez de substituí-la, no texto principal, por “Mediterrâneo”.
theological_decisions:
- issue: Linguagem cosmogeográfica do Livro Astronômico
  choice: Manter os nomes esquemáticos dos mares e a orientação direcional do texto
  alternative: Substituir as expressões por equivalentes geográficos modernos ou generalizá-las como “oceano”
  rationale: A formulação pertence a uma descrição cosmológica estruturada. Preservar seus movimentos e nomes respeita a imagética apocalíptico-astronômica sem adaptá-la silenciosamente à geografia moderna.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A tradução mantém a estrutura enumerativa e a antiga nomenclatura geográfica. “Até” foi repetido na segunda metade para tornar explícito o paralelismo aparente, embora a preposição diante de “Grande Mar” não seja idêntica à construção precedente.
