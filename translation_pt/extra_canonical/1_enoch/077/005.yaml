base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/005.yaml
  text: And I saw seven rivers upon the earth[a], greater than all the rivers[b]; and one of them comes from the west and pours its waters into the Great Sea.
translation:
  language: pt
  text: E vi sete rios sobre a terra, maiores que todos os rios; um deles vem do oeste e despeja suas águas no Grande Mar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no grande mar”. A expressão pode ser entendida como uma designação geográfica (“o Grande Mar”) ou como uma descrição genérica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፯ አፍላገ
  choice: sete rios
  rationale: O numeral ፯ está explicitamente presente e introduz o conjunto de sete rios; አፍላገ é o plural de “rio” ou “curso de água”.
- source_word: ዲበ ምድር
  choice: sobre a terra
  rationale: Expressão locativa direta, clara em português e adequada ao registro visionário.
- source_word: ርኢኩ
  choice: vi
  rationale: Forma verbal de primeira pessoa que preserva de modo natural o relato da visão.
- source_word: ዓበይተ እምኵሎሙ አፍላገ
  choice: maiores que todos os rios
  rationale: A construção comparativa exprime superioridade de grandeza sem especificar se se trata de extensão, volume ou força.
- source_word: አሐዱ እምኔሆሙ
  choice: um deles
  rationale: Reproduz naturalmente a expressão partitiva que seleciona um rio do conjunto.
- source_word: ይመጽእ እምዓረብ
  choice: vem do oeste
  rationale: Indica origem ou procedência geográfica; “oeste” é a formulação corrente e clara.
- source_word: ውስተ ባሕር ዐቢይ
  choice: no Grande Mar
  rationale: A expressão pode funcionar como designação geográfica conhecida, provavelmente do Mediterrâneo; a maiúscula preserva essa leitura sem inseri-la no corpo do texto.
- source_word: ይከዑ ማዮ
  choice: despeja suas águas
  rationale: Mantém a imagem concreta das águas do rio fluindo para o mar e soa natural em português.
theological_decisions:
- issue: Se “Grande Mar” deve ser entendido como nome geográfico ou como descrição genérica
  choice: Grande Mar
  alternative: grande mar
  rationale: O uso geográfico judaico antigo favorece uma designação reconhecível, provavelmente o Mediterrâneo, mas a nota preserva a possibilidade de leitura descritiva.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. O numeral “sete”, explícito no ge’ez, foi preservado. A pontuação mantém unidas a visão geral dos rios e a descrição do primeiro deles.
