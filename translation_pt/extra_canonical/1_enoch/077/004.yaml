base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/004.yaml
  text: I saw seven high mountains[a], which are higher than all the mountains that are on the earth; and from them frost comes forth[d][c][b], and days and seasons and years pass.
translation:
  language: pt
  text: Vi sete montanhas elevadas, mais altas que todas as montanhas da terra; delas sai a geada[a], e passam os dias, as estações[b] e os anos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “névoa gelada”. O termo ge’ez designa aqui um fenômeno de frio, provavelmente geada.
    reason: lexical_alternative
  - marker: b
    text: Ou “tempos” ou “períodos determinados”. O termo ge’ez pode abranger tanto estações quanto períodos em sentido mais amplo.
    reason: lexical_alternative
  - marker: c
    text: A expressão significa que os ciclos do calendário decorrem; não indica destruição ou desaparecimento definitivo.
    reason: cultural_note
lexical_decisions:
- source_word: ሰብዓተ አድባረ ነዋኃነ
  choice: sete montanhas elevadas
  rationale: Mantém o número e a imagem topográfica; “elevadas” expressa naturalmente a ideia de altura do adjetivo, sem o possível sentido de extensão física sugerido por uma tradução literal como “longas”.
- source_word: እለ ይነውሑ እምኵሉ አድባር እለ ውስተ ምድር
  choice: mais altas que todas as montanhas da terra
  rationale: Explicita a comparação de altura presente no ge’ez e usa uma formulação portuguesa clara e idiomática.
- source_word: ወእምኔሆሙ ይወፅእ
  choice: delas sai
  rationale: Preserva a imagem concreta de algo que procede das montanhas, com concisão e naturalidade em português.
- source_word: አሰሐትያ
  choice: geada
  rationale: No contexto meteorológico, “geada” é o equivalente português mais corrente para a formação ou emanação gélida indicada pelo termo; “névoa gelada” continua possível.
- source_word: ወየኀልፍ
  choice: e passam
  rationale: Com os substantivos temporais seguintes, o verbo indica o decorrer do tempo. “Passam” evita a conotação moderna de desaparecimento ou morte que “passam desta vida” ou formulações semelhantes poderiam sugerir.
- source_word: መዋዕለ ወዘመን ወዓመት
  choice: os dias, as estações e os anos
  rationale: Conserva a tríade temporal e traduz ዘመን por “estações”, adequado ao contexto de ciclos cósmicos e calendáricos, sem excluir o sentido mais amplo de tempos ou períodos.
theological_decisions:
- issue: Função cosmológica das montanhas em relação ao clima e ao tempo
  choice: Manter lado a lado a saída da geada e o passar dos ciclos temporais, sem explicar como as montanhas se relacionam com esses fenômenos.
  alternative: Interpretar as montanhas exclusivamente como acidentes geográficos literais ou como símbolos de regiões celestes que governam o tempo.
  rationale: O texto visionário associa geografia, meteorologia e tempo, mas não define o mecanismo nem declara que a imagem seja puramente literal ou simbólica. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem visionária é direta, sem acrescentar uma conjunção inicial ausente no ge’ez. O ponto e vírgula preserva a passagem da visão das montanhas para aquilo que delas procede e para o decurso do tempo.
