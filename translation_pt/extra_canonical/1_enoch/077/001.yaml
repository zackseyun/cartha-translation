base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/001.yaml
  text: And they call the first wind the eastern one, because it is the first; and they call the second the south, because the Most High descends there, and there especially the Blessed One descends forever.
translation:
  language: pt
  text: E chamam o primeiro vento de oriental, porque é o primeiro; e chamam o segundo de sul, porque o Altíssimo desce ali e, ali especialmente, o Bendito desce para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A redação da segunda metade é difícil. O ge''ez parece dizer que o sul recebe esse nome porque “o Altíssimo desce ali”, seguido de uma expressão intensificadora e da afirmação: “o Bendito desce para sempre”. Outra tradução possível para o final é: “ele desce, bendito para sempre”.'
    reason: textual_variant
lexical_decisions:
- source_word: ይጼውዕዎ
  choice: chamam
  rationale: Mantém a forma ativa e o estilo descritivo impessoal da exposição.
- source_word: ለነፋስ
  choice: vento
  rationale: Conserva a imagem cosmológica básica do texto, embora os ventos também funcionem como direções.
- source_word: ቀዳማዊ
  choice: primeiro
  rationale: Reproduz o sentido ordinal e sua repetição na explicação.
- source_word: ለጽባሓዊ
  choice: oriental
  rationale: Expressa naturalmente em português a direção associada à manhã ou aurora, preservando a forma adjetiva.
- source_word: ለካልእ
  choice: o segundo
  rationale: O contexto enumerativo favorece o valor ordinal, e não apenas “o outro”.
- source_word: አዜብ
  choice: sul
  rationale: É o equivalente direcional mais claro; a menção anterior a “vento” mantém o quadro cosmológico.
- source_word: ልዑል
  choice: o Altíssimo
  rationale: Título divino tradicional e natural em português, sem acrescentar especificidade doutrinária.
- source_word: ህየ
  choice: ali
  rationale: Retoma a região sul e permite conservar a repetição locativa do original.
- source_word: ይወርድ
  choice: desce
  rationale: Preserva literalmente o movimento vertical e a imagem teofânica, sem racionalizá-los.
- source_word: ወፈድፋደ
  choice: especialmente
  rationale: Representa de modo cauteloso a provável força intensificadora de uma forma textualmente difícil.
- source_word: ቡሩክ፡ ለዓለም
  choice: o Bendito ... para sempre
  rationale: Trata “Bendito” como título substantivado, sujeito explícito do segundo verbo, e conserva a expressão temporal.
theological_decisions:
- issue: Se a descida do Altíssimo deve ser mantida como movimento teofânico literal ou suavizada como envio de bênção ou calor
  choice: “o Altíssimo desce ali”
  alternative: “o Altíssimo envia dali bênção/calor”
  rationale: O ge'ez emprega explicitamente o título divino e o verbo “descer”; a tensão da cosmologia apocalíptica deve ser preservada.
- issue: Função de ቡሩክ na oração final
  choice: “o Bendito” como título e sujeito de “desce”
  alternative: “ele desce, bendito para sempre”
  rationale: A leitura substantivada preserva melhor o paralelismo com “o Altíssimo”, embora a construção final continue difícil.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do original. “Oriental” mantém a relação lexical com a manhã ou aurora sem recorrer à formulação pouco natural “o da aurora”. A ambiguidade da segunda metade é preservada e explicitada em nota.
