base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/006.yaml
  text: And the two of them come from the west as far as the sea[d][c][b][a], and they pour out their waters into the Erythraean Sea in the east.
translation:
  language: pt
  text: E os dois vêm do oeste até o mar e despejam suas águas no Mar Eritreu, a leste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mar Eritreu” pode designar o mar Vermelho ou, de modo mais amplo, as águas meridionais conhecidas por esse nome na geografia antiga.
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤቱ፡ ክልኤ፡
  choice: os dois
  rationale: A forma duplicada salienta o par; “os dois” preserva o sentido dual de modo natural em português.
- source_word: ይመጽኡ፡
  choice: vêm
  rationale: Traduz diretamente o verbo de movimento e se ajusta à descrição do percurso dos rios.
- source_word: እመስዕ፡
  choice: do oeste
  rationale: No contexto cosmográfico desta passagem, o termo indica a direção oeste; a tradução segue a revisão lexical mais recente e evita a antiga confusão com “meio-dia”, “sul” ou “norte”.
- source_word: እስከ፡ ባሕር፡
  choice: até o mar
  rationale: Expressa com naturalidade tanto a extensão quanto o destino do percurso.
- source_word: ወይከዕዉ፡ ማዮሙ፡
  choice: despejam suas águas
  rationale: Mantém a imagem vívida de lançar ou verter as águas, apropriada à desembocadura dos rios.
- source_word: በባሕረ፡ ኤርትራ፡ እምሥራቅ።
  choice: no mar Eritreu, a leste
  rationale: Conserva no texto principal o nome geográfico explícito e também o qualificativo direcional, sem identificá-lo de forma excessivamente estreita com uma massa de água moderna.
