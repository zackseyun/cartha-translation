base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/003.yaml
  text: When I desired to deliver them into the hand of the angels on the day of tribulation and pain[a], I will cause my punishment and my wrath to abide upon them, says God[d][c][b], the Lord of spirits.
translation:
  language: pt
  text: Quando desejei entregá-los nas mãos dos anjos, no dia de tribulação e dor[a], farei com que o meu castigo e a minha ira permaneçam sobre eles — diz Deus, o Senhor dos espíritos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação em ge''ez é difícil na transição para “o meu castigo e a minha ira”. O sentido parece passar da entrega nas mãos dos anjos para o estabelecimento do juízo divino sobre eles. Também seria possível explicitar: “para entregá-los nas mãos dos anjos, no dia de tribulação e dor, então...”'
    reason: textual_variant
  - marker: b
    text: “Nas mãos dos anjos” traduz literalmente uma expressão judicial que indica ser entregue ao poder de alguém. No final, o ge'ez emprega termos distintos, correspondentes a “Deus” e “Senhor dos espíritos”.
    reason: cultural_note
lexical_decisions:
- source_word: ፈቀድኩ
  choice: desejei
  rationale: Expressa vontade ou intenção em primeira pessoa sem transformar a frase em decreto formal.
- source_word: አጽንዖሙ በእደ መላእክት
  choice: entregá-los nas mãos dos anjos
  rationale: Verte a transferência para o poder dos anjos e conserva, em português natural, a imagem judicial de estar nas mãos de alguém.
- source_word: በዕለተ ምንዳቤ ወሕማም
  choice: no dia de tribulação e dor
  rationale: Mantém o par de sofrimentos e o tom apocalíptico; 'dor' é corrente e suficientemente abrangente.
- source_word: መቅሠፍተየ
  choice: o meu castigo
  rationale: O termo pode designar golpe, flagelo ou aflição punitiva; 'castigo' preserva o sentido judicial sem especificá-lo em excesso.
- source_word: መዐትየ
  choice: a minha ira
  rationale: Equivalente tradicional e claro para a indignação divina em contexto de juízo.
- source_word: አኃድር ዲቤሆሙ
  choice: farei com que ... permaneçam sobre eles
  rationale: Preserva a construção causativa e a imagem de um juízo que se estabelece e continua sobre os julgados.
- source_word: እግዚአብሔር እግዚአ መናፈስት
  choice: Deus, o Senhor dos espíritos
  rationale: Distingue o termo etíope corrente para 'Deus' do título seguinte, 'Senhor dos espíritos', evitando uma repetição artificial.
theological_decisions:
- issue: Ação divina mediada pelos anjos
  choice: Deus entrega os julgados nas mãos dos anjos, enquanto seu próprio castigo e sua ira permanecem sobre eles.
  alternative: Entender os próprios anjos como o castigo, ou separar o dia de sofrimento da ira divina.
  rationale: A redação mantém lado a lado a mediação angélica e a ação judicial atribuída diretamente a Deus, sem fundi-las nem resolver além do que a sintaxe permite.
- issue: Transição sintática difícil antes de 'meu castigo e minha ira'
  choice: Manter a sequência como uma única declaração temporal e futura, assinalando a dificuldade em nota.
  alternative: Traduzir explicitamente 'então' antes da declaração do castigo.
  rationale: O ge'ez parece passar da entrega aos anjos para a permanência do juízo divino, mas a relação exata entre as orações não é inteiramente segura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção 'nas mãos' conserva o idioma bíblico sem soar excessivamente arcaica; 'permaneçam sobre eles' retém a imagem duradoura do original.
