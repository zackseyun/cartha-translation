base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/002.yaml
  text: And he swore by his great name that from this time onward he would not do thus to all who dwell upon the dry land[a]; and I will set a sign in the heavens, and it will be a pledge of faithfulness between me and them forever, for as long as the days of heaven are upon the earth[c][b]; and this is by my command.
translation:
  language: pt
  text: E ele jurou por seu grande nome que, daquele momento em diante, não faria assim a todos os que habitam na terra seca; e porei um sinal nos céus[a], e ele será um penhor de fidelidade[b] entre mim e eles para sempre, enquanto os dias do céu estiverem sobre a terra; e isto é por minha ordem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinal nos céus” provavelmente remete à tradição do sinal após o dilúvio, mas o versículo não identifica explicitamente esse sinal.
    reason: cross_reference
  - marker: b
    text: O termo traduzido como “penhor de fidelidade” também pode significar, de modo mais amplo, “fidelidade”, “fé” ou “confiança”; neste contexto, pode ter sentido pactual.
    reason: lexical_alternative
  - marker: c
    text: A frase final também pode ser traduzida como “isto é conforme a minha determinação” ou “este é o meu decreto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐለ
  choice: jurou
  rationale: Expressa diretamente o ato solene de prestar juramento, sem acrescentar conteúdo ao juramento.
- source_word: በስሙ ዐቢይ
  choice: por seu grande nome
  rationale: Preserva a fórmula reverencial e a referência pronominal do texto ge'ez.
- source_word: እምይእዜ
  choice: daquele momento em diante
  rationale: Comunica com clareza o início temporal e sua continuidade.
- source_word: ኢይገብር ከመዝ
  choice: não faria assim
  rationale: Mantém a formulação concisa e deixa que o contexto determine a ação anterior, sem explicitá-la indevidamente.
- source_word: ለኵሎሙ እለ ይነብሩ ዲበ የብስ
  choice: a todos os que habitam em terra seca
  rationale: Conserva o sentido mais específico de የብስ, em vez de generalizá-lo como 'terra' ou 'mundo'.
- source_word: ትእምርተ
  choice: um sinal
  rationale: É a equivalência portuguesa mais natural para um indicador visível, sem identificar sua forma.
- source_word: እወዲ በሰማያት
  choice: porei ... nos céus
  rationale: Preserva o valor prospectivo e a localização celeste, em linguagem atual e digna.
- source_word: ማእከሌየ ወማእከሌሆሙ
  choice: entre mim e eles
  rationale: É a expressão relacional idiomática em português e mantém a possível ressonância pactual.
- source_word: ሃይማኖተ
  choice: um penhor de fidelidade
  rationale: Retém os sentidos de fidelidade, fé e confiança, enquanto 'penhor' comunica a função confirmatória do sinal sem substituir o termo por 'aliança'.
- source_word: እስከ ለዓለም መጠነ መዋዕለ ሰማይ ዲበ ምድር
  choice: para sempre, enquanto os dias do céu estiverem sobre a terra
  rationale: Preserva a fórmula poética de duração e sua tensão entre eternidade e extensão cósmica.
- source_word: ዝ በትእዛዝየ ውእቱ
  choice: isto se dará por minha ordem
  rationale: Comunica a autorização divina da declaração final sem tornar a frase portuguesa excessivamente literal.
theological_decisions:
- issue: Se o sinal celestial deve ser descrito explicitamente como aliança
  choice: um penhor de fidelidade entre mim e eles
  alternative: uma aliança entre mim e eles
  rationale: O ge'ez emprega ሃይማኖተ, ligado a fé, fidelidade ou confiança, e não um termo inequívoco para aliança. A tradução mantém a ressonância pactual sem resolver a ambiguidade.
- issue: Se o sinal deve ser identificado como arco-íris
  choice: o sinal permanece sem identificação no texto principal
  alternative: o arco-íris nos céus
  rationale: Embora o contexto evoque a tradição do dilúvio, o versículo diz apenas 'um sinal nos céus'; identificá-lo excederia o testemunho textual fornecido.
- issue: Mudança da terceira para a primeira pessoa
  choice: 'preservada: ''não faria'' seguido de ''porei'''
  alternative: uniformizar tudo na primeira ou na terceira pessoa
  rationale: A fonte apresenta essa mudança de pessoa. Mantê-la conserva uma possível característica textual ou discursiva em vez de corrigi-la silenciosamente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom solene sem arcaísmo. A ordem e as transições do ge'ez foram preservadas quando carregam ambiguidade relevante, especialmente na mudança da terceira para a primeira pessoa e na fórmula poética de duração.
