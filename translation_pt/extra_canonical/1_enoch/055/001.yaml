base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/001.yaml
  text: And after this the Head of Days relented and said[a], “In vain I have destroyed all those who dwell on the dry land.”
translation:
  language: pt
  text: 'Depois disso, a Cabeça dos Dias arrependeu-se[a] e disse: “Foi em vão que destruí todos os que habitam sobre a terra seca.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltou atrás” ou “mudou de ideia”. O verbo ge''ez pode indicar arrependimento, reconsideração ou mudança de propósito; quando o sujeito é divino, o sentido não precisa envolver culpa moral.'
    reason: alternativa lexical e preservação da ambiguidade teológica
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Depois disso
  rationale: Mantém a fórmula de transição temporal e a sequência da narrativa apocalíptica em português natural.
- source_word: ነሥሐ
  choice: arrependeu-se
  rationale: Preserva de modo direto a forte tensão antropopática do verbo ge'ez, sem suavizá-la no texto principal; outras nuances possíveis são registradas em nota.
- source_word: ርእሰ መዋዕል
  choice: a Cabeça dos Dias
  rationale: Tradução transparente dos componentes do título, preservando sua forma apocalíptica peculiar sem harmonizá-lo com outros títulos bíblicos.
- source_word: ሕኵፖልክዎሙ
  choice: destruí
  rationale: Expressa de forma vigorosa, mas não excessivamente interpretativa, a ação destrutiva dirigida ao objeto plural.
- source_word: ለኵሎሙ ለእለ ይነብሩ
  choice: todos os que habitam
  rationale: Conserva tanto a totalidade explícita quanto o sentido durativo de habitar.
- source_word: ውስተ የብስ
  choice: sobre a terra seca
  rationale: Mantém o sentido concreto de 'terra seca', mais específico que 'terra', e permite a possível evocação do contraste com as águas do dilúvio.
theological_decisions:
- issue: Se o verbo ነሥሐ deve ser suavizado quando seu sujeito é a Cabeça dos Dias
  choice: arrependeu-se
  alternative: voltou atrás; mudou de ideia
  rationale: O original emprega uma expressão antropopática teologicamente marcante. A tradução mantém essa tensão no texto principal, enquanto a nota apresenta possibilidades menos carregadas moralmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O título incomum “Cabeça dos Dias” foi mantido deliberadamente, e a construção “Foi em vão que...” comunica com naturalidade a ênfase do original.
