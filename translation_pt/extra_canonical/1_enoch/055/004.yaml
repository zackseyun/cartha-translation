lexical_decisions:
- source_word: ነገሥት
  choice: reis
  rationale: Plural comum em ge'ez para reis ou governantes; sem artigo e com o verbo na segunda pessoa do plural, funciona aqui como vocativo direto.
- source_word: ኃያላን
  choice: poderosos
  rationale: Neste contexto apocalíptico, designa pessoas de poder e influência, não apenas pessoas fisicamente fortes.
- source_word: እለ
  choice: que
  rationale: Marcador relativo que introduz a oração verbal seguinte.
- source_word: ትኃድሩ
  choice: habitais
  rationale: Forma inequívoca da segunda pessoa do plural; o verbo pode significar habitar, permanecer, alojar-se ou acampar. «Habitais» preserva o sentido amplo e concorda com o vocativo.
theological_decisions:
- issue: Trecho incompleto ou elíptico no testemunho fornecido
  choice: Traduzir somente a oração preservada e indicar em nota a possível localização subentendida.
  alternative: «Ó reis e poderosos que acampais» ou «os reis e os poderosos que habitam [ali]»
  rationale: O texto ge'ez fornecido não forma uma frase completa e não explicita o lugar. A tradução evita reconstruir no corpo do texto uma continuação ausente. A segunda pessoa plural favorece fortemente a leitura como apóstrofe, embora se registre em nota a tradução anterior em terceira pessoa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. «Ó» explicita naturalmente o vocativo; «habitais» conserva a segunda pessoa plural exigida pelo ge'ez e o tom solene do discurso apocalíptico.
