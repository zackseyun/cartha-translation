  text: Ó reis e poderosos que habitais[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho etíope aqui fornecido parece incompleto ou elíptico. O verbo também pode ser traduzido por «acampais», «vos alojais» ou «permaneceis», e o contexto mais amplo talvez subentenda um lugar não expresso.
