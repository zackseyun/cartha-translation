base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/007.yaml
  text: And in those days the punishment from the Lord of Spirits will come[b][a], and all the storehouses of the waters that are above the heavens [and the fountains that are beneath the heavens] and those beneath the earth will be opened.
translation:
  language: pt
  text: E, naqueles dias, virá o castigo do Senhor dos Espíritos, e serão abertos todos os depósitos das águas[a] que ficam acima dos céus [e as fontes que ficam abaixo dos céus][b], bem como as fontes que ficam debaixo da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «depósitos das águas» reflete a antiga imagem cosmológica de reservatórios celestes mantidos para uso divino no juízo.
    reason: cultural_note
  - marker: b
    text: A oração entre colchetes, «e as fontes que ficam abaixo dos céus», pode refletir uma perturbação ou duplicação textual no testemunho, pois é seguida por uma expressão muito semelhante acerca das fontes debaixo da terra.
    reason: textual_variant
lexical_decisions:
- source_word: መዋዕል
  choice: dias
  rationale: Com በውእቱ, forma a expressão apocalíptica temporal «naqueles dias»; a formulação foi preservada de modo natural em português.
- source_word: መቅሠፍቱ
  choice: castigo
  rationale: Expressa uma aflição punitiva de caráter judicial sem especificar indevidamente se se trata de flagelo, praga ou outra modalidade.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Preserva o título característico das Parábolas de Enoque e sua força apocalíptica.
- source_word: ታርሑ
  choice: serão abertos
  rationale: Mantém a imagem concreta da abertura dos depósitos e das fontes cósmicas, sem substituí-la por uma explicação como «serão liberados».
- source_word: መዛግብተ
  choice: depósitos
  rationale: Comunica a ideia de lugares onde as águas celestes são guardadas, com clareza para leitores atuais.
- source_word: ማያት
  choice: águas
  rationale: Conserva o plural do ge’ez e o sentido coletivo das águas cósmicas.
- source_word: ዘመልዕልተ ሰማያት
  choice: que ficam acima dos céus
  rationale: Preserva a localização espacial e a cosmologia em camadas do texto.
- source_word: አንቅዕተ
  choice: fontes
  rationale: Designa nascentes ou fontes de água e mantém o paralelismo com os depósitos celestes.
- source_word: መትሕተ ምድር
  choice: debaixo da terra
  rationale: É uma expressão espacial direta, natural e fiel em português moderno.
theological_decisions:
- issue: Natureza do juízo vindouro
  choice: Um juízo cósmico em que são abertos depósitos de águas celestes e fontes inferiores.
  alternative: Um castigo genérico sem imagem concreta de inundação, ou uma abertura puramente metafórica.
  rationale: O versículo menciona explicitamente águas acima dos céus e fontes abaixo dos céus e da terra; por isso, a imagem apocalíptica concreta não deve ser generalizada nem alegorizada.
- issue: Referente do título «Senhor dos Espíritos»
  choice: Manter o título sem explicar quem são os «espíritos».
  alternative: Acrescentar uma identificação, como espíritos angélicos ou espíritos humanos.
  rationale: O ge’ez preserva a amplitude do título; especificar o referente eliminaria uma ambiguidade genuína e introduziria interpretação teológica não expressa no versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conservam-se a fórmula «naqueles dias», o título apocalíptico «Senhor dos Espíritos» e a cosmologia concreta do original. Os colchetes reproduzem a incerteza textual do testemunho, explicitada em nota.
