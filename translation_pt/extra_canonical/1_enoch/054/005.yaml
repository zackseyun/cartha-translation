base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/005.yaml
  text: And he said to me[a], “These are being prepared for the host of Azazʾel, so that they may take them and cast them into the lowest part of the place of judgment; and they will cover their jaws with rough stones[e][d][c][b], just as the Lord of Spirits commanded.”
translation:
  language: pt
  text: 'E ele me disse: “Estas estão sendo preparadas para a hoste de Azazel[a], para que os tomem e os lancem na parte mais baixa do lugar de julgamento[b]; e cobrirão suas mandíbulas com pedras ásperas[c], conforme ordenou o Senhor dos Espíritos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “hoste de Azazel” é textualmente difícil no ge'ez. Também pode ser entendida de modo mais abstrato como “a obra” ou “o feito de Azazel”, ou como “os que pertencem a Azazel”.
    reason: textual_variant
  - marker: b
    text: A expressão é obscura. Traduções mais literais possíveis incluem “debaixo de todo julgamento” ou “sob todo o juízo”, mas aqui ela é entendida como referência espacial ao ponto mais baixo do lugar de punição.
    reason: lexical_alternative
  - marker: c
    text: “Mandíbulas” segue uma correção da transcrição, lendo መላትሒሆሙ em vez de መላእክቲሆሙ (“seus anjos”). A forma corrigida também esclarece que eles cobrem as mandíbulas com pedras ásperas.
    reason: textual_variant
lexical_decisions:
- source_word: ይዴለዉ
  choice: estão sendo preparadas
  rationale: O verbo expressa preparação ou prontidão deliberada, adequada à cena de juízo.
- source_word: ለትዕይንተ አዛዜኤል
  choice: para a hoste de Azazel
  rationale: A expressão ge'ez é textualmente difícil, mas o contexto e os pronomes plurais favorecem um coletivo associado a Azazel. “Hoste” preserva o tom apocalíptico sem definir com precisão excessiva a natureza do grupo.
- source_word: ይትመጠውዎሙ
  choice: para que os tomem
  rationale: Mantém o sentido amplo de tomar ou agarrar e preserva a referência não inteiramente explícita do pronome.
- source_word: ወይደይዎሙ
  choice: e os lancem
  rationale: Expressa o movimento descendente e punitivo com linguagem digna e corrente.
- source_word: መትሕተ ኵሉ ደይን
  choice: na parte mais baixa do lugar de julgamento
  rationale: Segue a revisão que entende a expressão espacialmente, como a região inferior de um local de punição, sem introduzir o conceito teológico posterior de “inferno”.
- source_word: አእባኒ ጠያያነ
  choice: pedras ásperas
  rationale: Traduz de modo concreto o substantivo “pedras” e a ideia de aspereza ou irregularidade do adjetivo.
- source_word: ይክድኑ
  choice: cobrirão
  rationale: O verbo está na terceira pessoa do plural ativa e continua o sujeito das ações anteriores.
- source_word: መላትሒሆሙ (leitura corrigida em lugar do OCR መላእክቲሆሙ)
  choice: suas mandíbulas
  rationale: A leitura corrigida explica a imagem punitiva e o objeto anatômico; “seus anjos” resulta provavelmente de erro visual na transcrição OCR.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Conserva o título divino característico das Parábolas de Enoque sem acrescentar formulação doutrinária posterior.
theological_decisions:
- issue: Identidade do coletivo associado a Azazel
  choice: a hoste de Azazel
  alternative: a obra ou o feito de Azazel; os que pertencem a Azazel
  rationale: A forma textual é difícil. A leitura coletiva se ajusta melhor aos pronomes plurais e à cena de punição, mas a nota conserva as outras possibilidades.
- issue: Natureza do destino punitivo
  choice: a parte mais baixa do lugar de julgamento
  alternative: debaixo de todo julgamento; sob todo o juízo
  rationale: A leitura espacial corresponde à topografia punitiva enóquica e evita identificar automaticamente esse lugar com uma concepção posterior de inferno.
- issue: Leitura de mandíbulas em vez de anjos
  choice: suas mandíbulas
  alternative: seus anjos, conforme a transcrição OCR fornecida
  rationale: A correção paleográfica proposta produz uma construção gramatical coerente e uma imagem paralela à punição de Azazel em 1 Enoque 10:4.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve elevação apocalíptica. “Hoste” conserva o caráter coletivo e solene do contexto; as notas explicitam as principais incertezas textuais e lexicais sem resolvê-las de maneira dogmática.
