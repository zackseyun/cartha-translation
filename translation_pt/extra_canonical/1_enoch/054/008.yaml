  language: pt
  text: E eles serão unidos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cláusula ge'ez fornecida é muito breve e está isolada; o sujeito de “serão unidos” não aparece neste fragmento.
    reason: textual_variant
  - marker: b
