lexical_decisions:
- source_word: ወ
  choice: E
  rationale: A conjunção prefixada é traduzida naturalmente por “e”; o fragmento não exige valor sequencial mais forte.
- source_word: ይዴመሩ
  choice: serão unidos
  rationale: 'A forma verbal é entendida como imperfeito passivo/reflexivo plural do verbo “unir, juntar, acrescentar”, apontando para ação futura: “serão unidos”. Evita-se a tradução anterior “foram medidos”, baseada numa identificação lexical inadequada.'
theological_decisions:
- issue: Como traduzir com segurança uma cláusula ge'ez extremamente breve e isolada nas Parábolas
  choice: “E eles serão unidos.”
  alternative: “E eles se juntarão.” / “E eles serão reunidos.”
  rationale: A formulação preserva a voz passiva/reflexiva e o aspecto futuro sem identificar no próprio texto truncado quem ou o que será unido. Assim, não se resolve artificialmente a ambiguidade referencial.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Preferiu-se “serão unidos” a “serão unidos entre si” ou “serão unidos juntos”, pois essas expansões seriam menos naturais ou acrescentariam uma precisão não expressa com segurança no fragmento.
