base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/001.yaml
  text: And I looked and turned to another part of the earth[b][a], and I saw there a deep valley with burning fire.
translation:
  language: pt
  text: E olhei e me voltei para outra região da terra[a], e vi ali um vale profundo onde ardia fogo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “outra face da terra”, expressão que indica outra região ou outro lado da terra.
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: “com fogo ardente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: olhei
  rationale: Preserva o primeiro verbo de percepção e sua sequência narrativa, distinguindo-o do posterior ርኢኩ, traduzido por “vi”.
- source_word: ተመየጥኩ
  choice: me voltei
  rationale: Expressa de modo natural a mudança de direção ou de atenção do visionário sem especificar um deslocamento físico que o texto não exige.
- source_word: ካልአ ገጸ ምድር
  choice: outra região da terra
  rationale: A expressão significa literalmente “outra face da terra”; “outra região” comunica em português atual o sentido espacial do idioma, mantendo a forma literal em nota.
- source_word: ርኢኩ
  choice: vi
  rationale: É o equivalente direto e natural para o verbo principal da percepção visionária.
- source_word: ህየ
  choice: ali
  rationale: Retoma de forma clara a região para a qual Enoque acaba de se voltar.
- source_word: ቈላ ዕሙቀ
  choice: um vale profundo
  rationale: Reproduz a imagem topográfica sem restringi-la indevidamente a “ravina” ou “depressão”.
- source_word: እንዘ ትነድድ እሳት
  choice: onde ardia fogo
  rationale: Apresenta naturalmente em português a atividade contínua do fogo ligada ao vale; a construção ge'ez admite também uma formulação descritiva mais compacta.
