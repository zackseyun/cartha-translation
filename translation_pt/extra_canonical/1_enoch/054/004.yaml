base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/004.yaml
  text: And I asked the angel of peace who went with me[a], saying[b], “These chains of the instruments—for whom are they being prepared?”
translation:
  language: pt
  text: 'E perguntei ao anjo da paz que ia comigo: “Estas correntes[a] dos instrumentos[b] — para quem estão sendo preparadas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estes laços” ou “estes grilhões”.
    reason: lexical_alternative
  - marker: b
    text: A expressão ge’ez traduzida como “dos instrumentos” é incerta neste testemunho; talvez se refira mais especificamente a implementos ou dispositivos associados ao castigo.
    reason: textual_variant
lexical_decisions:
- source_word: ተስእእክዎ
  choice: perguntei
  rationale: Expressa de modo natural e direto a pergunta de Enoque ao anjo, sem acrescentar nuances ausentes do verbo.
- source_word: መልአከ ሰላም
  choice: anjo da paz
  rationale: Preserva a expressão de caráter titular usada para o guia angélico, em vez de reduzi-la a um simples adjetivo.
- source_word: ዘየሐውር ምስሌየ
  choice: que ia comigo
  rationale: Mantém tanto a função identificadora da oração relativa quanto a ideia de acompanhamento durante a visão.
- source_word: እሉ እስረተ
  choice: estas correntes
  rationale: Conserva o demonstrativo e a imagem concreta de objetos vistos na cena; 'laços' e 'grilhões' também são possíveis.
- source_word: መበልዕት
  choice: dos instrumentos
  rationale: A leitura do termo neste testemunho é incerta. 'Instrumentos' mantém uma designação ampla e evita especificar indevidamente a natureza dos objetos ligados ao castigo.
- source_word: ለመኑ ይዴለዉ
  choice: para quem estão sendo preparadas
  rationale: Preserva a pergunta sobre os destinatários e a força passiva e antecipatória da preparação para o juízo.
theological_decisions:
- issue: Natureza dos objetos punitivos na visão
  choice: Manter a formulação concreta 'correntes dos instrumentos'.
  alternative: Parafrasear como 'correntes de castigo' ou 'grilhões para o juízo'.
  rationale: O texto apresenta objetos visíveis e pergunta a quem se destinam. A tradução conserva a imagem apocalíptica e sua dificuldade textual, sem transformá-la numa afirmação abstrata sobre punição.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A construção incomum 'correntes dos instrumentos' foi mantida para não ocultar a incerteza do testemunho; os marcadores de nota foram posicionados junto aos termos a que efetivamente se referem.
