base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/006.yaml
  text: And Michael and Gabriel and Raphael and Phanuel—they will seize them on that great day and cast them into the burning furnace on that day[a], so that the Lord of Spirits may take vengeance on them for their lawlessness[c][b], because they became servants of Satan and led astray those who dwell upon the dry land.
translation:
  language: pt
  text: Miguel, Gabriel, Rafael e Fanuel os agarrarão[a] naquele grande dia e os lançarão na fornalha ardente naquele dia, para que o Senhor dos Espíritos se vingue deles por sua iniquidade, pois se tornaram servos de Satanás[b] e desencaminharam os que habitam sobre a terra seca[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se apoderarão deles”. O verbo ge’ez indica uma apreensão vigorosa, mas sua nuance exata é incerta nesta seção, preservada essencialmente apenas em ge’ez.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida como “escravos de Satanás” ou, com menor probabilidade, “mensageiros de Satanás”.
    reason: textual_variant
  - marker: c
    text: Literalmente, “sobre a terra seca”. A expressão pode referir-se simplesmente aos habitantes da terra, mas a formulação concreta do ge’ez foi mantida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ያፀንዕዎሙ
  choice: se apoderarão deles
  rationale: Expressa uma apreensão vigorosa sem especificar, além do texto, que eles serão amarrados. A locução mantém o tom judicial e solene em português corrente.
- source_word: ዕለት ዐባይ
  choice: naquele grande dia
  rationale: Preserva a fórmula apocalíptica sem acrescentar explicitamente “do juízo”, ideia presente no contexto, mas não nessa expressão.
- source_word: እቶን ዘይነድድ
  choice: fornalha ardente
  rationale: Mantém a imagem concreta e punitiva do original em formulação bíblica natural e compreensível.
- source_word: ይወድይዎሙ
  choice: os lançarão na
  rationale: Comunica o ato deliberado e punitivo de colocá-los na fornalha, com dignidade maior que a alternativa coloquial “jogarão”.
- source_word: ይትበቀል
  choice: se vingue deles
  rationale: Conserva a força explícita da retribuição divina; não a suaviza como mera punição genérica.
- source_word: በዓመፃሆሙ
  choice: por sua transgressão
  rationale: “Transgressão” retém o peso moral e judicial do termo e soa natural em registro bíblico moderno.
- source_word: ላእከ ሰሰይጣን
  choice: servos de Satanás
  rationale: Representa mais provavelmente uma relação de serviço ou sujeição a Satanás, sem impor a noção mais específica de escravidão nem a leitura menos provável de mensageiros.
- source_word: አስኀትዎሙ
  choice: desencaminharam
  rationale: Preserva a ideia de fazer outros errar, incluindo a dimensão moral e a imagem direcional do verbo.
- source_word: እለ የኀድሩ ዲበ የብስ
  choice: os que habitam sobre a terra seca
  rationale: Retém a concretude cosmológica de “terra seca”, em vez de reduzir a expressão simplesmente a “terra” ou “mundo”.
theological_decisions:
- issue: Possível suavização da linguagem de castigo
  choice: manter “fornalha ardente” e “se vingue”
  alternative: traduzir de modo genérico como punição ou juízo
  rationale: O texto emprega imagens explícitas de juízo apocalíptico. Preservá-las evita resolver ou atenuar a tensão teológica do original.
- issue: Relação dos condenados com Satanás
  choice: “se tornaram servos de Satanás”
  alternative: “se tornaram escravos de Satanás” ou “mensageiros de Satanás”
  rationale: “Servos” preserva a ideia provável de lealdade e serviço sem definir além da evidência a natureza dessa sujeição; “mensageiros” permanece uma possibilidade lexical menos provável.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Os nomes seguem as formas portuguesas correntes. A repetição de “naquele dia” foi preservada por corresponder à estrutura enfática do original.
