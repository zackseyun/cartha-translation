base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/002.yaml
  text: And they shall bring the kings and the mighty[a], and cast them into that deep valley.
translation:
  language: pt
  text: E trarão os reis e os poderosos[a] e os lançarão naquele vale profundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito não é nomeado neste versículo; as formas no plural provavelmente se referem a agentes mencionados antes na visão, possivelmente servidores angelicais.
    reason: alternative_reading
lexical_decisions:
- source_word: እምጽእዎሙ
  choice: trarão
  rationale: O verbo plural exprime a ação futura de trazer ou conduzir. Em português, «trarão» comunica naturalmente o movimento dos condenados até o lugar mencionado, sem acrescentar um sujeito que o texto não nomeia.
- source_word: ለነገሥት
  choice: os reis
  rationale: Equivalente corrente do termo ge’ez para reis ou governantes; o artigo definido corresponde aos participantes determinados na cena de julgamento.
- source_word: ወለኃያላን
  choice: e os poderosos
  rationale: Preserva tanto a ideia de poder quanto a possível posição político-social dessas figuras, em linguagem atual e digna.
- source_word: ይውድ ይዎሙ
  choice: os lançarão
  rationale: Expressa a ação enérgica de atirá-los ao lugar de julgamento e mantém o tom apocalíptico sem intensificação indevida.
- source_word: ውስተ
  choice: naquele ... vale
  rationale: Com o verbo «lançar», a contração «naquele» exprime em português o movimento para dentro do lugar indicado.
- source_word: ዝኩ
  choice: naquele
  rationale: Mantém a força demonstrativa e remete a um lugar já mostrado na visão.
- source_word: ዕሙቅ
  choice: profundo
  rationale: Transmite diretamente a grande profundidade do vale, com redação natural em português.
- source_word: ቈላ
  choice: vale
  rationale: É o equivalente mais amplo e natural para a depressão geográfica descrita, preservando a imagem visível do lugar de julgamento.
theological_decisions:
- issue: Identidade do sujeito não expresso que executa as ações
  choice: 'Manter o sujeito indeterminado na desinência verbal plural: «trarão» e «lançarão»'
  alternative: Explicitar «os anjos» ou «os servidores»
  rationale: O ge’ez apresenta formas verbais no plural, mas não nomeia o sujeito neste versículo. A tradução preserva essa ambiguidade, embora o contexto possa sugerir agentes angelicais.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o tom solene da visão apocalíptica sem empregar vocabulário arcaico. O paralelismo verbal torna explícito em português que o mesmo sujeito não nomeado realiza as duas ações.
