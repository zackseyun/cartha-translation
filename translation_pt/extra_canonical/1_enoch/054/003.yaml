base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/003.yaml
  text: And there my eyes saw their instruments[d][c][b][a], as they were making iron chains without measure.
translation:
  language: pt
  text: E ali meus olhos viram os instrumentos deles[a], enquanto os faziam — correntes[b] de ferro sem medida[c].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo ge’ez traduzido por “instrumentos” também pode ser entendido como “ferramentas” ou “utensílios” relacionados ao trabalho realizado.
    reason: lexical_alternative
  - marker: b
    text: Ou “grilhões de ferro”. O substantivo designa objetos usados para prender.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sem medida”. A expressão também pode indicar algo “sem limite” ou “imensurável”; há ainda a possibilidade de referência mais específica a peso imensurável.
    reason: lexical_alternative
  - marker: d
    text: 'A construção também pode ser entendida como: “os instrumentos deles, enquanto faziam correntes de ferro sem medida”.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ርእያ አዕይንትየ
  choice: meus olhos viram
  rationale: Preserva a fórmula visionária enfática, com menção explícita aos olhos, em vez de reduzi-la a simplesmente “eu vi”.
- source_word: ዘመባዕዕቲሆሙ
  choice: os instrumentos deles
  rationale: Conserva o sentido concreto de instrumentos ou utensílios e representa o sufixo possessivo da terceira pessoa do plural; a nota registra alternativas lexicais naturais.
- source_word: እንዘ ይገብርዎሙ
  choice: enquanto os faziam
  rationale: “Enquanto” expressa a ação em andamento, e “os” procura representar o sufixo de objeto da terceira pessoa do plural sem eliminar a ambiguidade sintática da frase.
- source_word: መአስርተ
  choice: correntes
  rationale: No contexto de aprisionamento e juízo, é o termo português moderno mais claro para os objetos de ferro destinados a prender.
- source_word: ሐጺን
  choice: de ferro
  rationale: Tradução direta do material, preservando a concretude e a severidade física da imagem.
- source_word: ዘአልቦ መደለውተ
  choice: sem medida
  rationale: Mantém a formulação literal e sua abertura sem decidir se a ênfase recai sobre dimensão, limite ou peso imensurável.
theological_decisions:
- issue: Natureza dos objetos preparados na visão
  choice: Correntes concretas de ferro associadas aos instrumentos vistos
  alternative: Instrumentos genéricos de castigo ou vínculos puramente metafóricos
  rationale: 'O vocabulário da passagem é material e concreto: instrumentos, fabricação, correntes e ferro. A tradução preserva a imagem de juízo sem explicar além do que o versículo afirma.'
- issue: Relação entre os instrumentos e as correntes
  choice: Manter a construção em aposição, com “os” e dois-pontos
  alternative: Omitir o objeto pronominal ou afirmar sem ressalvas que os instrumentos eram as correntes
  rationale: A forma verbal contém um objeto plural, mas a sintaxe compacta admite mais de uma compreensão. A redação representa esse elemento e a nota conserva a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem visionária enfática foi preservada; os dois-pontos tornam legível a construção compacta sem apagar sua ambiguidade, registrada também em nota.
