base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/008.yaml
  text: In those days the faces of the kings of the earth and the mighty who possess the dry land shall be humbled[a], because of the works of their hands; for on the day of their distress and affliction[d][c][b], they will not save themselves.
translation:
  language: pt
  text: Naqueles dias, os reis da terra e os poderosos que possuem a terra seca[c] ficarão com o rosto abatido[a], por causa das obras de suas mãos[b]; pois, no dia de sua angústia e aflição, não poderão salvar a si mesmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ficarão abatidos de rosto”. O texto ge’ez está comprimido, e a forma verbal transmitida parece defeituosa; outra análise antiga entendia a frase como “serão envergonhados os humildes de rosto”, mas o mais provável é que ela descreva a humilhação dos reis e poderosos.
    reason: textual_and_syntactic_alternative
  - marker: b
    text: “Obras de suas mãos” pode abranger seus atos e realizações e talvez evoque poder produzido por eles mesmos ou até ídolos; o texto não restringe o sentido.
    reason: cultural_note
  - marker: c
    text: “Terra seca” é uma tradução literal e pode referir-se simplesmente à terra habitada que está sob o domínio deles.
    reason: lexical_note
lexical_decisions:
- source_word: በዝንቱ፡ መዋዕል
  choice: Naqueles dias
  rationale: Mantém a fórmula temporal apocalíptica tradicional em português corrente.
- source_word: ክኑ፡ ትሑታነ፡ ገጽ
  choice: ficarão de rosto abatido
  rationale: Entende ክኑ como forma corrompida ou abreviada de ይከውኑ, “tornar-se/ficar”, e preserva a imagem facial de humilhação sem transformar “os humildes” em outro grupo.
- source_word: ነገሥተ፡ ምድር
  choice: os reis da terra
  rationale: Expressão apocalíptica natural que conserva o alcance amplo de ምድር.
- source_word: ወጽኑዓን
  choice: e os poderosos
  rationale: Designa pessoas de grande poder e forma um par social coerente com os reis.
- source_word: እለ፡ ይእኅዝዋ፡ ለየብስ
  choice: que possuem a terra seca
  rationale: Conserva tanto o sentido de possuir ou deter quanto a referência concreta e literal à terra seca.
- source_word: በእንተ፡ ምግባረ፡ እደዊሆሙ
  choice: por causa das obras de suas mãos
  rationale: Preserva o conhecido idioma bíblico para os atos humanos e permite, sem impor, possíveis ecos de poder fabricado ou idolatria.
- source_word: በዕለተ፡ ጻዕቆሙ፡ ወጻሕቦሙ
  choice: no dia de sua angústia e aflição
  rationale: Mantém o par intensificador de sofrimentos no contexto de juízo.
- source_word: ኢይድኅኑ፡ ርእሶሙ
  choice: não poderão salvar a si mesmos
  rationale: Expressa claramente o objeto reflexivo e, no contexto, comunica incapacidade efetiva, sem acrescentar um agente externo.
theological_decisions:
- issue: Relação de “de rosto abatido” com os reis e poderosos
  choice: A expressão descreve o estado ao qual os reis e poderosos chegarão.
  alternative: “Os humildes de rosto serão envergonhados”, como se houvesse outro grupo ou outro verbo.
  rationale: 'A leitura de ክኑ como forma defeituosa de ይከውኑ produz uma sintaxe coerente: os reis e poderosos são o sujeito e ficarão abatidos de rosto. A nota registra a compressão e a dificuldade textual.'
- issue: Possível nuance idolátrica de “obras de suas mãos”
  choice: Manter a expressão ampla, sem identificar explicitamente as obras como ídolos.
  alternative: Traduzir por “seus ídolos” ou restringir a expressão às estruturas de poder que produziram.
  rationale: O idioma pode evocar idolatria, mas o texto não exige essa delimitação; a formulação ampla preserva a tensão sem impor uma leitura doutrinária.
- issue: Natureza da incapacidade de salvar-se
  choice: 'Traduzir a negação como incapacidade contextual: “não poderão salvar a si mesmos”.'
  alternative: “Não salvarão a si mesmos”, como simples declaração futura.
  rationale: No cenário de angústia e juízo, a frase comunica que o poder terreno deles será ineficaz, sem definir além do texto a natureza teológica da salvação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e as imagens do ge’ez foram conservadas quando naturais; as notas esclarecem a dificuldade textual e os possíveis ecos sem resolver indevidamente as ambiguidades.
