base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/009.yaml
  text: And into the hands of my chosen ones I will deliver them[a], and like straw in the fire, so they will burn before the face of the holy ones; and like lead in water, they will sink before the face of the righteous[e][d][c][b], and no trace will be found for them.
translation:
  language: pt
  text: E eu os entregarei nas mãos dos meus escolhidos[a]; como palha no fogo, assim arderão diante dos santos, e, como chumbo na água, afundarão diante dos justos, e nenhum vestígio deles será encontrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão é literalmente «nas mãos dos meus escolhidos» e pode indicar que eles serão entregues ao poder dos escolhidos para o juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውስተ፡ እዴሆሙ፡ ለኅሩያን፡ ዚአየ
  choice: nas mãos dos meus escolhidos
  rationale: Preserva a imagem concreta das mãos, enquanto a construção com «entregarei» comunica naturalmente a sujeição ao poder dos escolhidos. ዚአየ é entendido como possessivo de primeira pessoa, «meus».
- source_word: እወድዮሙ
  choice: eu os entregarei
  rationale: A forma é tratada como verbo na primeira pessoa do singular, em aspecto imperfeito e com sentido futuro no contexto escatológico, não como verbo de visão.
- source_word: ኅሩያን
  choice: escolhidos
  rationale: Mantém a designação apocalíptica sem recorrer a terminologia doutrinária mais especializada, como «eleitos».
- source_word: ከመ፡ ሣዕር፡ ውስተ፡ እሳት፡ ከመዝ፡ ይውዕዩ
  choice: como palha no fogo, assim arderão
  rationale: Reproduz a correlação «como... assim» e conserva a imagem direta de combustão; o futuro corresponde ao imperfeito em seu contexto escatológico.
- source_word: እምቅድመ፡ ገጸ፡ ቅዱሳን
  choice: diante dos santos
  rationale: Traduz de modo idiomático a expressão literalmente facial «diante da face dos santos», sem decidir se os santos são seres celestes ou humanos.
- source_word: ዐረር፡ ውስተ፡ ማይ፡ ይሠጠሙ
  choice: como chumbo na água, afundarão
  rationale: Retém o metal específico e a imagem de seu rápido afundamento, usando futuro para o imperfeito contextual.
- source_word: ጻድቃን
  choice: justos
  rationale: Equivalente português natural para a comunidade vindicada, mantendo-o distinto de «santos» no paralelismo.
- source_word: አሰር
  choice: vestígio
  rationale: Expressa um sinal ou resto remanescente e comunica a ideia de desaparecimento completo sem acrescentar «remanescente» ao texto.
theological_decisions:
- issue: Sentido judicial da expressão «nas mãos»
  choice: Conservar a imagem concreta em «nas mãos dos meus escolhidos»
  alternative: «ao poder dos meus escolhidos» ou «às mãos dos meus escolhidos»
  rationale: O texto associa a imagem das mãos ao verbo «entregarei», mas não exige que ela seja substituída por uma abstração explícita sobre autoridade judicial.
- issue: Identidade dos «santos» e dos «justos»
  choice: Manter as duas designações distintas, sem identificar seus referentes
  alternative: Tratálas como sinônimos da mesma comunidade ou identificar os santos como anjos e os justos como humanos
  rationale: O paralelismo aproxima os grupos, mas o verso não define sua identidade nem autoriza eliminar a distinção lexical.
- issue: Temporalidade do juízo
  choice: 'Usar o futuro: «entregarei», «arderão», «afundarão» e «será encontrado»'
  alternative: Usar o passado como relato de uma visão já contemplada
  rationale: As formas imperfeitas e o contexto escatológico apresentam os atos como juízo futuro, e ዚአየ é possessivo («meus»), não «vi».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Diante dos santos» evita o decalque pouco natural «diante da face dos santos», enquanto «palha», «chumbo» e «vestígio» preservam as imagens do texto. O único marcador de nota, [a], aparece no texto principal.
