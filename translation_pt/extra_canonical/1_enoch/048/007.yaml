base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/007.yaml
  text: And the wisdom of the Lord of Spirits has revealed him to the holy and to the righteous[a]; for they have kept the portion of the righteous, because they hated and despised this world of unrighteousness, and they hated all its works and its ways in the name of the Lord of Spirits. For by his name they are saved[d][c][b], and by his good pleasure their life came to be.
translation:
  language: pt
  text: E a sabedoria do Senhor dos Espíritos o revelou aos santos e aos justos[a], pois eles guardaram a porção dos justos[b], porque odiaram e desprezaram este mundo de injustiça e odiaram todas as suas obras e os seus caminhos em nome do Senhor dos Espíritos. Pois pelo nome dele são salvos[c], e por sua vontade veio a existir a vida deles[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aos que são santos». O termo ge'ez pode designar coletivamente as pessoas consagradas.
    reason: lexical_alternative
  - marker: b
    text: «A porção dos justos» também pode significar seu quinhão, sua sorte ou sua herança.
    reason: lexical_alternative
  - marker: c
    text: Ou «serão salvos» ou «encontram livramento». A forma ge'ez pode exprimir uma verdade geral sem excluir um sentido futuro.
    reason: tense_ambiguity
  - marker: d
    text: Ou «por sua vontade a vida deles foi estabelecida». A frase atribui a vida dos justos à vontade do Senhor dos Espíritos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ከሠተ
  choice: revelou
  rationale: O verbo está na voz ativa e significa revelar ou descobrir; a sabedoria do Senhor dos Espíritos é o sujeito, e o objeto pronominal remete à figura mencionada no contexto anterior.
- source_word: ቅዱሳን
  choice: santos
  rationale: Designa coletivamente pessoas consagradas; «santos» é natural em português e não exige uma categoria eclesiástica posterior.
- source_word: ጻድቃን
  choice: justos
  rationale: Preserva a categoria ética e apocalíptica recorrente do texto enoquiano.
- source_word: ጥበቡ
  choice: a sabedoria
  rationale: É o sentido direto do substantivo e, com a terminação nominativa, funciona como sujeito da oração.
- source_word: ዐቀቡ
  choice: guardaram
  rationale: Expressa conservar ou manter fielmente, sem acrescentar ao contexto uma interpretação específica.
- source_word: ክፍሎሙ
  choice: a porção
  rationale: Mantém aberta a possibilidade de parte, quinhão, sorte ou herança, sem especificar além do que o termo permite.
- source_word: ዘዓመፃ
  choice: de injustiça
  rationale: Caracteriza o mundo pela perversidade moral e forma contraste natural com «justos».
- source_word: ምግባሮ
  choice: obras
  rationale: Traduz ações ou conduta e preserva o paralelismo com «caminhos».
- source_word: ፍናዊሁ
  choice: os seus caminhos
  rationale: Conserva tanto a imagem de percurso quanto a ideia de maneira de viver.
- source_word: በስሙ
  choice: em nome de / pelo nome de
  rationale: A primeira ocorrência expressa a esfera de lealdade ou autoridade; a segunda, a base da salvação. A variação preposicional natural em português preserva ambas as relações sem defini-las em excesso.
- source_word: ይድኅኑ
  choice: são salvos
  rationale: O presente pode exprimir uma realidade geral sem excluir seu cumprimento escatológico.
- source_word: በፈቃዱ
  choice: por sua vontade
  rationale: Comunica o propósito voluntário do Senhor em linguagem corrente e digna; «beneplácito» seria menos acessível e poderia acrescentar uma nuance técnica.
theological_decisions:
- issue: Tempo ou aspecto da salvação pelo nome do Senhor
  choice: pelo nome dele são salvos
  alternative: pelo nome dele serão salvos; pelo nome dele encontram livramento
  rationale: O presente preserva o valor geral possível da forma ge'ez sem negar uma dimensão futura ou escatológica.
- issue: Sentido da porção dos justos
  choice: guardaram a porção dos justos
  alternative: preservaram o quinhão dos justos; guardaram a herança dos justos
  rationale: «Porção» conserva a ambiguidade entre parte, quinhão, sorte e herança, evitando resolver uma imagem que o original deixa aberta.
- issue: Relação entre a vontade divina e a vida dos justos
  choice: por sua vontade veio a existir a vida deles
  alternative: por sua vontade a vida deles foi estabelecida
  rationale: A formulação principal acompanha de perto a ideia de a vida vir a ser, sem definir se a ênfase recai na origem, na concessão ou no estabelecimento dessa vida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantiveram-se «Senhor dos Espíritos», «justos», «porção» e «caminhos» para preservar o vocabulário apocalíptico e as ambiguidades genuínas do ge'ez.
