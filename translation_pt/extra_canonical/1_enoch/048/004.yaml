base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/004.yaml
  text: He will be a staff for the righteous[a], so that they may lean on him and not fall; and he will be the light of the nations[c][b], and he will be hope for those who are troubled in heart.
translation:
  language: pt
  text: Ele será um cajado para os justos, para que se apoiem nele e não caiam; será a luz das nações[a] e a esperança dos que sofrem no coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma luz para as nações». A construção em ge''ez admite essa formulação funcional, embora a tradução principal preserve mais diretamente a expressão nominal «luz das nações».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «os que sofrem» ou «estão enfermos no coração». A expressão pode indicar aflição interior, sem necessariamente excluir a imagem de enfermidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: በትረ
  choice: cajado
  rationale: O substantivo designa um bastão ou cajado; o contexto de apoiar-se e não cair favorece «cajado», preservando a imagem concreta sem introduzir a conotação régia de «cetro».
- source_word: ለጻድቃን
  choice: para os justos
  rationale: Forma natural em português para o termo coletivo que designa os que vivem em retidão.
- source_word: ይትመረጐዙ
  choice: se apoiem nele
  rationale: Preserva a imagem física e metafórica de receber sustentação do cajado e se liga naturalmente à frase seguinte.
- source_word: ወኢይደቁ
  choice: e não caiam
  rationale: «Caiam» mantém de modo direto o contraste criado pela imagem do apoio; «tropecem» seria possível, mas menos preciso neste contexto.
- source_word: ብርሃነ አሕዛብ
  choice: a luz das nações
  rationale: Reproduz diretamente a construção nominal do ge'ez. «Nações» evita a conotação posterior mais específica que «gentios» poderia introduzir.
- source_word: ተስፋ
  choice: a esperança
  rationale: «Esperança» comunica naturalmente a força escatológica e consoladora do termo.
- source_word: ለእለ የሐምሙ በልቦሙ
  choice: dos que sofrem no coração
  rationale: O verbo pode indicar doença ou sofrimento; com «no coração», a formulação preserva a expressão antropológica e sua possível amplitude sem reduzi-la a enfermidade física nem interpretá-la apenas como inquietação.
theological_decisions:
- issue: Referente do pronome repetido ውእቱ
  choice: Empregar o pronome pessoal masculino implícito nas formas «Ele será» e «será», remetendo à figura singular do contexto imediato.
  alternative: Repetir «esse» ou empregar uma formulação mais neutra.
  rationale: O ge'ez usa uma forma demonstrativa/pronominal repetida. O português permite omitir o sujeito após sua primeira menção, produzindo linguagem natural e mantendo a referência pessoal sem acrescentar títulos ou formulações doutrinárias posteriores.
- issue: Valor de ይከውን
  choice: «será»
  alternative: «se tornará»
  rationale: O futuro de «ser» expressa naturalmente as funções ou identidades escatológicas atribuídas à figura e evita sugerir uma mudança ontológica que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva a metáfora concreta do cajado, a repetição predicativa em forma fluente e a ambiguidade da aflição «no coração». Os marcadores aparecem imediatamente após as expressões a que se referem.
