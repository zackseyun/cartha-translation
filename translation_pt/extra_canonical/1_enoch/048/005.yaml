base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/005.yaml
  text: And all who dwell upon the dry land shall fall down and bow before him[a], and they shall praise and bless and sing to the Lord of Spirits.
translation:
  language: pt
  text: E todos os que habitam sobre a terra seca[a] cairão e se prostrarão diante dele; eles o louvarão, o bendirão e cantarão ao Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na terra”. A expressão em ge''ez diz mais literalmente “sobre a terra seca”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: cairão
  rationale: Preserva o gesto físico de cair em submissão ou reverência sem explicá-lo como um rito específico.
- source_word: ይሰግዱ
  choice: se prostrarão
  rationale: Expressa de modo natural o gesto corporal de reverência e distingue este verbo do anterior, que significa cair.
- source_word: ቅድሜሁ
  choice: diante dele
  rationale: Mantém a relação espacial e o pronome singular do texto.
- source_word: ኵሎሙ
  choice: todos
  rationale: Conserva o alcance universal da declaração.
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: os que habitam sobre a terra seca
  rationale: Retém a imagem concreta da terra seca, em vez de substituí-la silenciosamente pelo sentido mais amplo de terra ou mundo.
- source_word: ይሴብሕዎ
  choice: o louvarão
  rationale: O verbo é doxológico, e o pronome objeto no ge'ez é preservado explicitamente.
- source_word: ይባርክዎ
  choice: o bendirão
  rationale: Mantém tanto a linguagem de bênção quanto o pronome objeto presente no ge'ez; “bendizer” é corrente no registro bíblico em português.
- source_word: ይዜምሩ
  choice: cantarão
  rationale: Transmite com clareza a ideia de louvor cantado sem especificar canto ou melodia além do texto.
- source_word: ለእግዚአ መናፈስት
  choice: ao Senhor dos Espíritos
  rationale: Preserva o título divino recorrente de 1 Enoque e seu registro apocalíptico.
theological_decisions:
- issue: Referente de “dele” e dos pronomes objetos antes do título divino final
  choice: Manter os pronomes singulares ligados à figura exaltada do contexto imediato e apresentar “ao Senhor dos Espíritos” como o destinatário explicitamente nomeado do canto.
  alternative: Entender todos os pronomes e o título final como referências à mesma figura, ou considerar que todo o versículo já se refere exclusivamente a Deus.
  rationale: O ge'ez combina pronomes singulares com o título explícito “Senhor dos Espíritos”. A tradução conserva essa justaposição e sua tensão teológica, sem identificar nem separar definitivamente os referentes.
translation_notes:
  register: Português moderno, digno e acessível, com leve elevação própria de uma visão apocalíptica. A repetição dos pronomes em “o louvarão, o bendirão” foi mantida por corresponder aos sufixos do ge'ez e por preservar a possível tensão entre a figura exaltada e o Senhor dos Espíritos.
