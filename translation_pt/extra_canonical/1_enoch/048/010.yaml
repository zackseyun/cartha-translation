base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/010.yaml
  text: And on the day of their affliction[b][a], rest shall come upon the earth.
translation:
  language: pt
  text: E, no dia da aflição deles[a], haverá descanso sobre a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “angústia” ou “sofrimento”. O termo ge’ez indica dificuldade ou pressão; esta breve frase não determina com precisão a nuance.
    reason: lexical_alternative
  - marker: b
    text: Ou “o descanso estará sobre a terra” ou “o descanso virá a existir sobre a terra”. O verbo também pode ser traduzido mais literalmente por “ser” ou “vir a ser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለተ
  choice: no dia da
  rationale: Preserva de modo natural em português o marcador temporal apocalíptico expresso pela preposição e pelo substantivo ‘dia’.
- source_word: ጻሕበ
  choice: aflição
  rationale: Expressa pressão, sofrimento ou dificuldade sem transformar o termo em uma designação escatológica técnica; a nota registra alternativas plausíveis.
- source_word: ዚአሆሙ
  choice: deles
  rationale: Reproduz a forma pronominal genitiva que remete ao grupo mencionado anteriormente, sem explicitar um referente que o versículo não nomeia.
- source_word: ዕረፍት
  choice: descanso
  rationale: Mantém o sentido central de repouso ou cessação e preserva a ambiguidade quanto aos beneficiários e à natureza desse descanso.
- source_word: ትከውን
  choice: haverá
  rationale: Verte de maneira idiomática a linguagem existencial ou de vir a ser, mantendo a referência futura sem acrescentar uma ação não explicitada.
- source_word: ዲበ ምድር
  choice: sobre a terra
  rationale: Conserva o alcance amplo e o registro elevado da expressão, sem restringir ‘terra’ ao sentido local de território.
theological_decisions:
- issue: Alcance e sentido do descanso
  choice: Um descanso futuro sobre a terra, sem beneficiários especificados
  alternative: Alívio reservado aos justos, cessação posterior ao juízo ou paz limitada a uma região
  rationale: A cláusula é breve e não identifica quem desfruta o descanso nem define sua natureza; a tradução não resolve essa tensão por meio do contexto teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe concisa acompanha a estrutura do ge’ez, enquanto “haverá” evita rigidez desnecessária. As notas preservam alternativas lexicais genuínas sem impor terminologia denominacional.
