base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/001.yaml
  text: In that place I saw the spring of righteousness[a], which is inexhaustible, and around it were many springs of wisdom. And all the thirsty drank from them and were filled with wisdom[f][e][d][c][b], and their dwelling was with the righteous and the holy and the chosen.
translation:
  language: pt
  text: Naquele lugar, vi a nascente da justiça, que é inesgotável, e muitas nascentes de sabedoria a rodeavam.[a] Todos os sedentos beberam delas e ficaram cheios de sabedoria; e sua morada era com os justos, os santos e os escolhidos.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão etíope neste ponto é difícil e apresenta uma forma repetida no testemunho transcrito. O sentido provável é que muitas nascentes de sabedoria rodeavam a nascente da justiça.
    reason: textual_variant
  - marker: b
    text: “Nascente” também pode ser traduzido por “fonte”, tanto aqui como na expressão “nascentes de sabedoria”.
    reason: lexical_alternative
  - marker: c
    text: “Os santos” também pode ser entendido como “os que são santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: መካን
  choice: lugar
  rationale: Termo locativo comum; “lugar” preserva o cenário visionário sem especificar uma região geográfica.
- source_word: ነቅዐ / አንቅዕተ
  choice: nascente / nascentes
  rationale: Designa uma fonte natural de água da qual se pode beber. “Nascente” mantém a imagem concreta e permite conservar o paralelo entre o singular e o plural.
- source_word: ጽድቅ
  choice: justiça
  rationale: Em português, “justiça” expressa com naturalidade tanto a retidão moral quanto sua dimensão escatológica, sem reduzir o termo a uma abstração jurídica.
- source_word: ዘኢይትኄለቍ
  choice: que é inesgotável
  rationale: Comunica a abundância imensurável da nascente e corresponde melhor ao contexto do que a formulação mais vaga “que não falha”.
- source_word: አውዳ / የአውዳ
  choice: a rodeavam
  rationale: Preserva a relação espacial e a possível força verbal ativa da expressão etíope, em vez de convertê-la apenas numa descrição estática.
- source_word: ጥበብ
  choice: sabedoria
  rationale: Equivalente usual que conserva a fusão entre a imagem de água abundante e o tema sapiencial.
- source_word: ጽሙኣን
  choice: os sedentos
  rationale: Mantém a imagem concreta dos que têm sede sem explicá-la alegoricamente no texto principal.
- source_word: ይሰትዩ
  choice: beberam
  rationale: O pretérito perfeito acompanha com naturalidade o relato da visão e apresenta a ação como parte da cena contemplada.
- source_word: ይትመልኡ
  choice: ficaram cheios
  rationale: Conserva a metáfora de pessoas preenchidas pela sabedoria e expressa claramente o resultado de beber das nascentes.
- source_word: ማኅደሪሆሙ
  choice: sua morada
  rationale: Expressa residência ou lugar de permanência em registro digno e compreensível.
- source_word: ጻድቃን
  choice: os justos
  rationale: Equivalente tradicional e claro para o grupo caracterizado pela justiça ou retidão.
- source_word: ቅዱሳን
  choice: os santos
  rationale: Preserva o substantivo coletivo paralelo a “os justos” e “os escolhidos”; não pressupõe uma definição eclesiástica posterior.
- source_word: ኅሩያን
  choice: os escolhidos
  rationale: Forma transparente e menos tecnicamente carregada do que “os eleitos”, mantendo a ideia de pessoas escolhidas.
theological_decisions:
- issue: Caráter literal ou interpretado da imagem da água
  choice: Manter nascente, sedentos, beberam e ficaram cheios
  alternative: Explicitar no texto que se trata de acesso espiritual à justiça e à sabedoria
  rationale: A visão apresenta a realidade por imagens concretas; traduzi-las literalmente preserva sua força apocalíptica e evita impor uma interpretação.
- issue: Forma da tríade escatológica final
  choice: os justos, os santos e os escolhidos
  alternative: os que praticam a justiça, os santos e os eleitos
  rationale: A opção conserva os três grupos ou títulos em paralelo, sem transformar o primeiro em descrição explicativa nem dar ao último uma formulação teológica mais técnica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção conserva o caráter visionário, o paralelismo das nascentes e a tríade final, sem explicar a metáfora no corpo do texto.
