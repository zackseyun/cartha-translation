base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/002.yaml
  text: And at that hour that Son of Man was named in the presence of the Lord of Spirits[b][a], and his name was before the Head of Days.
translation:
  language: pt
  text: E naquela hora, aquele Filho do Homem foi chamado[a] na presença do Senhor dos Espíritos, e seu nome estava diante da Cabeça dos Dias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi nomeado”. O verbo passivo pode indicar designação ou atribuição de nome; “foi chamado” evita a acepção administrativa que “foi nomeado” frequentemente tem em português e preserva a abertura da expressão.
    reason: lexical_alternative
  - marker: b
    text: “Cabeça dos Dias” é uma tradução literal de um título divino nas Parábolas. A expressão foi mantida para preservar sua imagem característica, em vez de substituí-la por um equivalente tradicional mais interpretativo.
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ሰዓት
  choice: naquela hora
  rationale: Preserva o marcador temporal apocalíptico e a especificidade solene de “hora”, em português natural.
- source_word: ተጸውዐ
  choice: foi nomeado
  rationale: O passivo indica mais naturalmente designação ou atribuição de nome neste contexto; a escolha também mantém a ligação com a oração seguinte, que repete “nome”.
- source_word: ወልደ ሰብእ ዝኩ
  choice: aquele Filho do Homem
  rationale: O demonstrativo distal aponta para uma figura visionária específica já em vista. As maiúsculas refletem o uso semelhante a título nas Parábolas, sem impor uma harmonização posterior.
- source_word: በኀበ እግዚአ መናፈስት
  choice: na presença do Senhor dos Espíritos
  rationale: Expressa proximidade diante do soberano celestial e preserva o cenário cortesão e apocalíptico com formulação idiomática.
- source_word: ስሙ
  choice: seu nome
  rationale: Tradução pronominal direta; conserva a repetição temática de “nome”.
- source_word: መቅድመ
  choice: estava diante de
  rationale: Mantém a expressão espacial compacta e solene, sem decidir entre presença, precedência e possível preexistência.
- source_word: ርእሰ መዋዕል
  choice: a Cabeça dos Dias
  rationale: Preserva literalmente a imagem do título divino característico das Parábolas, em vez de substituí-lo por um equivalente tradicional mais interpretativo.
theological_decisions:
- issue: Se ወልደ ሰብእ deve ser traduzido como expressão humana genérica ou como título
  choice: aquele Filho do Homem
  alternative: aquele filho de homem; aquele ser humano
  rationale: Nas Parábolas, a expressão designa uma figura escatológica exaltada e específica. A tradução conserva essa força titular no contexto local sem importar formulações além do que o ge'ez sustenta.
- issue: Possível preexistência em “seu nome estava diante da Cabeça dos Dias”
  choice: seu nome estava diante da Cabeça dos Dias
  alternative: seu nome foi pronunciado diante da Cabeça dos Dias; seu nome já existia diante da Cabeça dos Dias
  rationale: A formulação ge'ez é compacta e pode sugerir presença celestial, precedência ou preexistência. A tradução mantém essa tensão, sem transformá-la em afirmação doutrinária mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das notas foi regularizada para acompanhar a sequência dos marcadores no texto. “Estava diante de” conserva a solenidade e a ambiguidade do original sem soar excessivamente arcaico.
