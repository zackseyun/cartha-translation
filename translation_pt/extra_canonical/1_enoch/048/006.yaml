base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/006.yaml
  text: For this reason[a], he was chosen and hidden before him before the world was created[c][b], and forever.
translation:
  language: pt
  text: Por essa razão, ele foi escolhido e mantido oculto diante dele[a], antes que o mundo fosse criado, e para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua presença”. O pronome provavelmente se refere a Deus, mas a tradução conserva a formulação relacional do ge'ez.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “até a eternidade” ou “até a era”.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእንተዝ
  choice: Por essa razão
  rationale: Conserva a função explicativa ou causal da expressão em português natural, sem a rigidez de uma formulação excessivamente literal.
- source_word: ኮነ
  choice: foi
  rationale: Com os predicados seguintes, o verbo atua como cópula ou expressão resultativa; “foi” é a forma mais natural em português.
- source_word: ኅሩየ
  choice: escolhido
  rationale: Expressa claramente a designação divina no contexto apocalíptico e evita a possível carga doutrinária posterior de “eleito”.
- source_word: ወኅቡአ
  choice: e mantido oculto
  rationale: Preserva a predicação coordenada e torna explícita, de modo natural, a ideia de ocultação ou reserva da figura.
- source_word: በቅድሜሁ
  choice: diante dele
  rationale: Mantém a linguagem espacial e relacional do ge'ez, sem identificar expressamente o referente do pronome; em português, também evita a repetição pouco elegante de “antes dele, antes que”.
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: antes que o mundo fosse criado
  rationale: Comunica a anterioridade à criação e verte ዓለም pelo sentido contextual mais direto, “mundo”.
- source_word: ወእስከ ለዓለም
  choice: e para sempre
  rationale: É uma formulação idiomática e digna que preserva a ideia de duração contínua, sem impedir a alternativa mais literal indicada em nota.
theological_decisions:
- issue: Possível formulação explícita de preexistência cristológica posterior
  choice: 'Conservar a linguagem apocalíptica local: “escolhido e mantido oculto diante dele, antes que o mundo fosse criado”'
  alternative: Traduzir interpretativamente como “preexistente com Deus” ou “predestinado desde a eternidade”
  rationale: O texto afirma escolha e ocultação anteriores à criação, mas não emprega essas fórmulas doutrinárias posteriores. A tradução preserva a forte afirmação temporal sem resolver além do que o ge'ez declara.
- issue: Referente de “dele” em በቅድሜሁ
  choice: Manter o pronome sem explicitar o referente no corpo do texto
  alternative: Traduzir “diante de Deus”
  rationale: Deus é o referente contextual mais provável, mas a forma pronominal da fonte deve ser preservada para não eliminar sua ambiguidade relacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Diante dele” preserva o teor relacional da fonte e evita uma repetição artificial; “mantido oculto” comunica naturalmente o motivo apocalíptico de uma figura reservada até o tempo determinado.
