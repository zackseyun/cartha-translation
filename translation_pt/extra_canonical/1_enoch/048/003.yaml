base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/003.yaml
  text: And before the sun and the signs were created[a], before the stars of heaven were made[c][b], his name was called before the Lord of Spirits.
translation:
  language: pt
  text: E, antes de serem criados o sol e os sinais[a], antes de serem feitas as estrelas do céu, seu nome foi chamado diante do Senhor dos Espíritos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “marcas” ou “portentos”. O termo pode indicar sinais distintivos ou celestes, sem especificar aqui sua função.
    reason: lexical_alternative
  - marker: b
    text: Ou “na presença do Senhor dos Espíritos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዘእንበለ / እንበለ
  choice: antes de
  rationale: A construção é temporal e introduz duas orações paralelas que situam a ação antes da criação dos corpos celestes.
- source_word: ትትፈጠር
  choice: serem criados
  rationale: Preserva a voz passiva e a linguagem cosmológica de criação; o plural em português concorda naturalmente com “o sol e os sinais”.
- source_word: ፀሐይ ወታእምር
  choice: o sol e os sinais
  rationale: Mantém os dois substantivos coordenados como sujeitos do primeiro verbo, sem ligar indevidamente “sinais” às estrelas da oração seguinte.
- source_word: ይትገበሩ
  choice: serem feitas
  rationale: Reproduz a forma passiva e o paralelismo com “serem criados”, evitando acrescentar a ideia mais específica de estabelecimento.
- source_word: ከዋክብተ ሰማይ
  choice: as estrelas do céu
  rationale: É a forma portuguesa natural e elevada para a construção genitiva do ge'ez.
- source_word: ስሙ ተጸውዐ
  choice: seu nome foi pronunciado
  rationale: Expressa em português corrente o ato de chamar ou proferir o nome, sem identificar explicitamente a figura nem introduzir um título ausente do versículo.
- source_word: በቅድመ
  choice: diante de
  rationale: Conserva o sentido espacial e cortesão de estar perante alguém; “na presença de” permanece uma alternativa legítima.
- source_word: እግዚአ መናፈስት
  choice: o Senhor dos Espíritos
  rationale: Mantém o título enóquico tradicional, em registro solene e sem restringir indevidamente o alcance de “Espíritos”.
theological_decisions:
- issue: Identidade do referente de “seu nome”
  choice: Manter apenas o pronome possessivo, sem inserir um título.
  alternative: Identificá-lo explicitamente como o Escolhido ou o Filho do Homem.
  rationale: O contexto aponta para a figura exaltada dos versículos próximos, mas este versículo não repete seu título; a tradução preserva essa referência implícita.
- issue: Natureza do ato expresso por ተጸውዐ
  choice: “foi pronunciado”
  alternative: “foi chamado”, “foi nomeado” ou “foi invocado”
  rationale: A escolha oferece português natural e mantém a ideia de o nome ser proferido, sem decidir que se trata necessariamente de designação formal ou invocação cultual.
translation_notes:
  register: Português moderno, claro e solene. As duas orações temporais foram mantidas em paralelo, respeitando os limites sintáticos do ge'ez. “Seu nome” conserva o referente masculino implícito do contexto.
