base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/004.yaml
  text: On that day I will cause my Chosen One to dwell among them[c][b][a], and I will transform heaven and make it a blessing and a light forever.
translation:
  language: pt
  text: Naquele dia, farei o meu Escolhido habitar entre eles[a][b]; transformarei o céu e farei dele uma bênção e uma luz para sempre.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no meio deles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o meu Eleito”.
    reason: lexical_alternative
  - marker: c
    text: 'Outra tradução possível: “uma bênção e luz eternas”.'
    reason: previous_rendering
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: Naquele dia
  rationale: Preserva a fórmula temporal apocalíptica em português natural e solene.
- source_word: አነብር
  choice: farei ... habitar
  rationale: Reproduz o valor causativo do verbo e sua relação com a expressão locativa seguinte.
- source_word: ማእከሎሙ
  choice: entre eles
  rationale: É uma formulação corrente em português para a ideia de estar no meio de um grupo, sem perder o sentido espacial.
- source_word: ለኅሩየ፡ ዚአየ
  choice: o meu Escolhido
  rationale: Traduz o título de modo transparente e evita harmonizá-lo com títulos messiânicos posteriores.
- source_word: ወእዌልጦ፡ ለሰማይ
  choice: transformarei o céu
  rationale: Mantém a força da renovação cósmica; neste contexto, 'céu' designa a esfera celeste, não apenas o firmamento visível.
- source_word: ወእገብራ
  choice: e farei dele
  rationale: O pronome retoma 'o céu' com clareza e preserva a construção em que ele é feito bênção e luz.
- source_word: በረከተ፡ ወብርሃነ
  choice: uma bênção e uma luz
  rationale: Mantém os dois substantivos concretos e a imagem benéfica e luminosa da renovação.
- source_word: ለዓለም
  choice: para sempre
  rationale: Preserva o valor adverbial de duração da expressão ge'ez, em vez de convertê-la em adjetivo.
theological_decisions:
- issue: Identidade e tradução de ኅሩየ ዚአየ nas Parábolas
  choice: o meu Escolhido
  alternative: o meu Eleito
  rationale: O título é traduzido segundo a dicção local da passagem, sem impor fórmulas cristológicas posteriores; 'Escolhido' é claro e atual.
- issue: Alcance da renovação cósmica
  choice: transformarei o céu e farei dele uma bênção e uma luz para sempre
  alternative: mudarei o céu e o tornarei bendito e luminoso para sempre
  rationale: A redação conserva o céu como objeto de transformação e mantém as imagens substantivas de bênção e luz, sem reduzir a cena a uma melhoria moral ou metáfora genérica.
