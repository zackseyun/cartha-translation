base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/005.yaml
  text: And I will transform the dry land and make it a blessing[a], and I will cause my chosen ones to dwell in it[c][b]; but those who commit sin and transgression shall not set foot in it.
translation:
  language: pt
  text: E transformarei a terra seca e farei dela uma bênção[a]; farei os meus escolhidos habitarem nela, mas os que praticam pecado e transgressão não caminharão nela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “farei dela uma terra abençoada”. A construção também pode indicar que a terra passa a ser caracterizada pela bênção.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não irão/caminharão nela”. A expressão indica que os pecadores serão excluídos da terra renovada.
    reason: lexical_alternative
lexical_decisions:
- source_word: እዌልጦ
  choice: transformarei
  rationale: O verbo indica mudança de estado; “transformarei” comunica com naturalidade a forte reversão escatológica.
- source_word: ለየብስ
  choice: a terra seca
  rationale: O substantivo designa terra firme ou seca e, no contexto da transformação do céu no versículo anterior, pode ter alcance cósmico. “Terra seca” preserva tanto a imagem concreta quanto essa possível amplitude.
- source_word: እገብራ በበረከት
  choice: farei dela uma bênção
  rationale: Mantém a construção resultativa e a passagem da esterilidade para um estado caracterizado pela bênção.
- source_word: ሕሩያነ ዚአየ
  choice: os meus escolhidos
  rationale: Reproduz a categoria apocalíptica local sem substituí-la por terminologia eclesiástica posterior.
- source_word: አነብሮሙ ውስቴታ
  choice: nela estabelecerei
  rationale: 'Preserva o valor causativo: o próprio falante faz com que os escolhidos habitem de modo estável na terra transformada.'
- source_word: ኃጢአተ ወጌጋየ
  choice: pecado e transgressão
  rationale: Conserva os dois termos coordenados, que intensificam a caracterização da rebeldia moral.
- source_word: ኢይከይዱ ውስቴታ
  choice: não entrarão nela
  rationale: O original emprega um verbo de ir ou caminhar. No contexto, a expressão nega acesso à terra renovada; “não entrarão nela” é idiomático em português e evita a estranheza de uma reprodução excessivamente literal.
theological_decisions:
- issue: Identidade dos “escolhidos” nas Parábolas
  choice: os meus escolhidos
  alternative: os meus eleitos; os meus santos
  rationale: “Escolhidos” mantém a categoria do texto sem harmonizá-la com terminologia cristã posterior ou acrescentar a ideia de santidade.
- issue: Natureza da promessa relativa à terra
  choice: Manter a imagem concreta da “terra seca” transformada em bênção
  alternative: entender como metáfora da terra inteira; traduzir como “deserto”
  rationale: A formulação conserva a renovação apocalíptica da terra e deixa em aberto se a expressão aponta para a terra habitável em sentido amplo ou destaca sua condição seca.
- issue: Força da cláusula final
  choice: Expressar exclusão da terra renovada sem especificar o mecanismo
  alternative: não caminharão sobre ela; não porão os pés nela
  rationale: O verbo básico é de ir/caminhar, e o contexto implica falta de acesso. A tradução preserva esse contraste sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o paralelismo solene do texto, enquanto “nela estabelecerei” e “não entrarão nela” evitam construções pouco naturais.
