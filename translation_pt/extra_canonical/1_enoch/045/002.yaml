base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/002.yaml
  text: And they will not ascend to heaven, nor will they arrive on earth; thus it shall be the portion of the sinners who denied the name of the Lord of Spirits, who are thus kept for the day of affliction and tribulation.
translation:
  language: pt
  text: Eles não subirão ao céu nem chegarão à terra; essa será a porção dos pecadores que negaram o nome do Senhor dos Espíritos e que assim são guardados para o dia de aflição e tribulação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou: “o dia de opressão e angústia”. O par de termos intensifica a descrição do juízo vindouro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርጉ
  choice: subirão
  rationale: O verbo expressa movimento ascendente, e sua forma plural tem como sujeito os pecadores; a tradução preserva diretamente essa relação gramatical.
- source_word: ይበጽሑ
  choice: chegarão
  rationale: O verbo significa chegar ou alcançar. Com ምድረ em sentido direcional, “chegarão à terra” reproduz a construção sem transformar a terra em sujeito.
- source_word: ክፍለ
  choice: porção
  rationale: Designa aquilo que cabe ou é destinado a alguém; “porção” mantém o tom judicial e apocalíptico.
- source_word: ኃጥኣን
  choice: pecadores
  rationale: Tradução direta e corrente da categoria moral mencionada no contexto de juízo.
- source_word: ክሕዱ
  choice: negaram
  rationale: Expressa repúdio ao nome divino sem acrescentar uma formulação confessional posterior.
- source_word: ስሞ
  choice: o nome
  rationale: Preserva o peso bíblico do nome divino e sua ligação com o título que vem em seguida.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém o título característico de 1 Enoque em forma digna e consagrada em português.
- source_word: ይትዐቀቡ
  choice: são guardados
  rationale: A forma passiva indica que os pecadores permanecem reservados para o juízo, deixando implícito o agente como no texto-fonte.
- source_word: ዕለተ ስራሕ ወምንዳቤ
  choice: dia de aflição e tribulação
  rationale: Conserva o paralelismo intensificador dos dois substantivos e o caráter escatológico da expressão.
theological_decisions:
- issue: Interpretação da cláusula sobre céu e terra
  choice: Os pecadores não subirão ao céu nem chegarão à terra.
  alternative: O céu não os receberá, nem a terra os alcançará.
  rationale: As formas verbais estão no plural e os substantivos têm valor direcional, favorecendo os pecadores como sujeito. A nota registra a dificuldade textual e sintática sem substituir a leitura gramaticalmente mais forte por uma paráfrase teológica.
- issue: Destino dos pecadores para o juízo
  choice: “são guardados” para o dia de aflição e tribulação
  alternative: “são reservados” para o dia de opressão e angústia
  rationale: A tradução conserva a voz passiva e não identifica explicitamente o agente, evitando desenvolver além do texto a doutrina da ação divina no juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o paralelismo apocalíptico e a ambiguidade relevante é explicitada em nota, não resolvida silenciosamente no corpo do texto.
