base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/003.yaml
  text: On that day my Chosen One will sit on the throne of glory[a], and he will choose their works and their resting places without number[d][c][b]; and their souls will grow strong within them when they see my Chosen Ones and those who have called on my glorious name.
translation:
  language: pt
  text: Naquele dia, o meu Escolhido se assentará no trono de glória e escolherá as obras deles e seus lugares de descanso, sem número[a]. Suas almas se fortalecerão dentro deles quando virem os meus escolhidos[b] e os que buscaram refúgio em meu nome glorioso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este trecho é difícil. O verbo traduzido por “escolherá” também pode ter o sentido de selecionar, ordenar ou determinar; “lugares de descanso” pode significar “moradas” ou “estações”. A expressão “sem número” pode referir-se aos lugares de descanso ou, mais amplamente, às obras e aos lugares de descanso.
    reason: lexical_alternative
  - marker: b
    text: O texto passa do singular “meu Escolhido” para o plural “meus escolhidos”. Isso pode distinguir a figura entronizada da comunidade ligada a ela, embora a redação seja difícil.
    reason: textual_variant
  - marker: c
    text: O verbo ge'ez pode significar “fugir” ou “buscar refúgio”. Algumas traduções entendem a expressão como “os que invocaram o meu nome glorioso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: Naquele dia
  rationale: Preserva a fórmula temporal apocalíptica em português natural e solene.
- source_word: ይነብር ዲበ መንበረ ስብሐት
  choice: se assentará no trono de glória
  rationale: No contexto de um trono, o verbo indica naturalmente o ato de sentar-se ou entronizar-se; a construção nominal mantém a imagem do original.
- source_word: ኅሩየየ
  choice: o meu Escolhido
  rationale: Conserva o título singular e o sufixo possessivo de primeira pessoa sem identificá-lo com outro título teológico.
- source_word: የኀሪ
  choice: escolherá
  rationale: Reproduz diretamente o verbo cognato de “escolhido”, embora sua função exata neste contexto difícil possa envolver selecionar, ordenar ou determinar.
- source_word: ምግባሪሆሙ
  choice: as obras deles
  rationale: Mantém o termo ligado a atos ou conduta sem acrescentar uma avaliação moral não expressa.
- source_word: ምዕራፎሙ
  choice: seus lugares de descanso
  rationale: Preserva o sentido espacial provável sem impor se se trata de moradas, estações ou repousos escatológicos.
- source_word: ኍልቈ አልቦ
  choice: que serão incontáveis
  rationale: Expressa de modo idiomático a ausência de número e, pela estrutura adotada, liga a expressão aos lugares de descanso, uma leitura sintaticamente possível.
- source_word: ነፍሶሙ በማእከሎሙ ትጸንዕ
  choice: A alma deles se fortalecerá dentro deles
  rationale: Preserva o singular coletivo do substantivo no texto ge'ez e a imagem de fortalecimento interior.
- source_word: ለኅሩያነ ዚአየ
  choice: os meus escolhidos
  rationale: Mantém a passagem do título singular para o grupo plural, sem harmonização.
- source_word: እለ ሰከዩ ስምየ ስቡሐ
  choice: os que se refugiaram no meu nome glorioso
  rationale: O verbo ሰከየ favorece “fugir” ou “buscar refúgio”; esta tradução preserva a imagem específica de tomar o nome divino como refúgio, em vez de substituí-la pelo idioma mais genérico “invocar”.
theological_decisions:
- issue: Identidade do título singular “meu Escolhido”
  choice: Manter “o meu Escolhido” como título no próprio versículo.
  alternative: Substituir por “Messias”, “Filho do Homem” ou outro título harmonizado.
  rationale: O versículo emprega o título “Escolhido”; identificar a figura mais precisamente resolveria uma questão teológica que o texto local não resolve.
- issue: Mudança do singular “meu Escolhido” para o plural “meus escolhidos”
  choice: Preservar a distinção entre singular e plural e assinalá-la em nota.
  alternative: Harmonizar ambos no singular ou ambos no plural.
  rationale: A forma ge'ez fornecida parece distinguir a figura entronizada da comunidade plural; a transparência é preferível à emenda silenciosa.
- issue: Relação sintática de “sem número”
  choice: 'Ligar a expressão aos lugares de descanso: “seus lugares de descanso, que serão incontáveis”.'
  alternative: Ligar “sem número” conjuntamente às obras e aos lugares de descanso, ou conservar uma sequência mais ambígua.
  rationale: A leitura adotada produz português inteligível, mas a sintaxe do trecho é difícil; por isso a incerteza e a alternativa são registradas em nota.
- issue: Sentido de ሰከዩ diante do nome glorioso
  choice: Traduzir por “se refugiaram no”.
  alternative: “invocaram” ou “chamaram pelo”.
  rationale: A evidência lexical favorece fugir ou tomar refúgio. Essa opção evita harmonizar o texto com uma fórmula bíblica mais comum e conserva sua imagem própria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Escolhido” recebe inicial maiúscula apenas no título singular; o plural permanece em minúscula para tornar visível a distinção gramatical sem impor uma identificação doutrinária. A pontuação divide o longo período para maior clareza, sem apagar a progressão do original.
