base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/001.yaml
  text: And this is the second parable concerning those who deny the name of the dwelling of the holy ones and of the Lord of Spirits[a][b][c].
translation:
  language: pt
  text: E esta é a segunda parábola[c] acerca dos que negam o nome[a] da morada dos santos[b] e do Senhor dos Espíritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão em ge'ez depois de «negam o nome» é difícil. Ela pode significar «o nome da morada dos santos e do Senhor dos Espíritos», mas outras construções são possíveis.
    reason: textual_variant
  - marker: b
    text: «Santos» pode referir-se a seres celestiais santos, aos justos ou a uma ideia que abranja deliberadamente ambos neste contexto apocalíptico.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «outra parábola». O contexto da sequência de três parábolas favorece «segunda».'
    reason: previous_rendering
lexical_decisions:
- source_word: ወዝ
  choice: E esta é
  rationale: O conectivo, seguido do demonstrativo com valor copulativo, introduz uma nova unidade e permite uma formulação natural em português.
- source_word: ካልእ ምሳሌ
  choice: a segunda parábola
  rationale: Embora ካልእ também possa significar «outra», o contexto das três parábolas favorece aqui o sentido ordinal «segunda»; «parábola» preserva a designação literária da seção.
- source_word: ዲበ
  choice: acerca de
  rationale: A preposição introduz o tema da parábola, não uma relação espacial.
- source_word: እለ ይክሕዱ
  choice: os que negam
  rationale: O relativo com o verbo no imperfeito tem sentido substantivado. «Negam» preserva a ideia de repúdio sem especificar se ele é verbal, prático ou cultual.
- source_word: ስሞ
  choice: o nome
  rationale: Mantém o substantivo concreto do ge'ez, sem interpretá-lo como autoridade, fama ou majestade.
- source_word: ለማኅደረ ቅዱሳን
  choice: da morada dos santos
  rationale: «Morada» conserva a imagem espacial de ማኅደር. A relação genitiva permanece deliberadamente próxima da construção difícil do ge'ez.
- source_word: ቅዱሳን
  choice: os santos
  rationale: Em português bíblico corrente, «os santos» é natural e pode abranger seres celestiais ou a comunidade dos justos; uma nota explicita essa ambiguidade.
- source_word: ወእግዚአ መናፍስት
  choice: e do Senhor dos Espíritos
  rationale: Traduz diretamente o título divino recorrente nas Parábolas, preservando sua forma solene.
theological_decisions:
- issue: Referente de «os santos»
  choice: Mantido sem identificação explícita como «os santos»
  alternative: «os seres santos» ou «a comunidade dos justos»
  rationale: O contexto não determina com segurança se são seres celestiais, os justos ou uma sobreposição deliberada dos dois grupos.
- issue: Sentido da construção após «negam o nome»
  choice: 'Tradução relativamente literal: «o nome da morada dos santos e do Senhor dos Espíritos»'
  alternative: «o nome pelo qual os santos habitam»; «a morada dos santos e o Senhor dos Espíritos»; «o nome do Senhor dos Espíritos na morada dos santos»
  rationale: A sintaxe ge'ez é difícil e não há aqui controle textual grego ou de Qumran; a tradução preserva a tensão em vez de impor uma paráfrase teológica.
- issue: Valor de ካልእ
  choice: «segunda»
  alternative: «outra»
  rationale: A estrutura declarada de três parábolas, com a primeira e a terceira identificadas em outros pontos, favorece o valor ordinal neste contexto, embora a alternativa lexical seja registrada.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da frase e a construção genitiva foram mantidas próximas do ge''ez para não encobrir sua dificuldade. Os marcadores foram posicionados junto aos pontos que explicam: [a] após a construção da morada, [b] após o título divino e [c] ao fim para a alternativa «outra parábola».'
