translation:
  language: pt
  text: E vi outros rostos ocultos naquele lugar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «semblantes»; a palavra ge’ez significa literalmente «rostos» e pode indicar pessoas vistas em forma visionária.
    reason: alternativa lexical
lexical_decisions:
- source_word: ካልአ
  choice: outros
  rationale: O termo indica entidades adicionais em relação às já vistas; o plural «outros» concorda naturalmente com «rostos».
- source_word: ገጻተ
  choice: rostos
  rationale: Preserva o sentido concreto básico e a imagem vívida da visão, sem interpretar antecipadamente o termo como «pessoas» ou «seres».
- source_word: ርኢኩ
  choice: vi
  rationale: Forma direta, natural e atual para o relato visionário em primeira pessoa.
- source_word: በውእቱ መካን
  choice: naquele lugar
  rationale: Retoma o cenário visionário já mencionado e mantém uma formulação clara e digna.
- source_word: ኅቡኣተ
  choice: ocultos
  rationale: Expressa aquilo que está escondido ou não manifesto, preservando o caráter misterioso da visão sem acrescentar interpretação.
theological_decisions:
- issue: Se ገጻተ deve ser traduzido concretamente como «rostos» ou interpretativamente como «pessoas/seres»
  choice: rostos
  alternative: pessoas; seres; semblantes
  rationale: O texto curto e visionário favorece a preservação da imagem concreta. Traduzir por «pessoas» ou «seres» eliminaria uma ambiguidade genuína e tornaria explícita uma identificação que o texto não faz.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção conserva a concisão e a estranheza própria da linguagem apocalíptica.
