base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/064/002.yaml
  text: And I heard the voice of the angel saying[a], 'These are the angels who came down upon the earth and revealed what was hidden to the children of men[b], and led the children of men astray so that they committed sin.'
translation:
  language: pt
  text: 'E ouvi a voz do anjo, que dizia: “Estes são os anjos que desceram sobre a terra, revelaram aos filhos dos homens[a] o que estava oculto[b] e desencaminharam os filhos dos homens, de modo que cometessem pecado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos dos homens”, expressão enoquiana que se refere à humanidade.
    reason: cultural_note
  - marker: b
    text: Ou “revelaram as coisas ocultas”. A expressão ge'ez indica a revelação daquilo que estava escondido, mas este versículo não especifica quais eram esses segredos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰማዕኩ
  choice: ouvi
  rationale: Verbo perfeito na primeira pessoa que introduz de modo direto a percepção auditiva de Enoque na narrativa visionária.
- source_word: ቃሎ ለመልአክ
  choice: a voz do anjo
  rationale: Embora ቃል também possa significar “palavra” ou “fala”, o verbo “ouvir” e a introdução do discurso direto favorecem “voz” neste contexto.
- source_word: እንዘ ይብል
  choice: que dizia
  rationale: Reproduz com naturalidade a construção narrativa que introduz a fala direta, sem tornar a frase artificialmente literal.
- source_word: እሉ ውእቶሙ
  choice: Estes são
  rationale: Mantém a força demonstrativa e identificadora da expressão ge'ez em português corrente.
- source_word: መላእክት እለ ወረዱ ዲበ ምድር
  choice: os anjos que desceram sobre a terra
  rationale: Preserva a imagem apocalíptica da descida e reflete de perto o valor espacial de ዲበ, sem acrescentar o título “Vigilantes”.
- source_word: ወዘበኅቡእ ከሠቱ
  choice: revelaram ... o que estava oculto
  rationale: Expressa o contraste entre ocultação e revelação sem especificar quais conhecimentos ou segredos estavam envolvidos.
- source_word: ለውሉደ ሰብእ
  choice: aos filhos dos homens
  rationale: Conserva a expressão antropológica tradicional de 1 Enoque e seu registro elevado; a nota esclarece que ela designa a humanidade.
- source_word: ወአስሐትዎሙ
  choice: desencaminharam
  rationale: Comunica a ideia de levar outros ao erro e ao desvio moral, adequada à consequência pecaminosa indicada na oração seguinte.
- source_word: ከመ ይግበሩ ኃጢአተ
  choice: para que cometessem pecado
  rationale: Mantém a abertura da construção ge'ez entre finalidade e resultado, usando uma formulação idiomática em português.
theological_decisions:
- issue: Identidade dos anjos transgressores
  choice: “os anjos que desceram sobre a terra”
  alternative: “os Vigilantes que desceram sobre a terra” ou “os anjos caídos”
  rationale: O texto ge'ez deste versículo diz apenas “anjos”. Embora o contexto enoquiano permita associá-los aos Vigilantes, inserir esse título ou a qualificação “caídos” ultrapassaria a formulação local.
- issue: Natureza do conteúdo revelado
  choice: “o que estava oculto”
  alternative: “conhecimentos secretos”, “mistérios” ou “artes proibidas”
  rationale: O objeto da revelação permanece geral no versículo. A tradução não define o conteúdo a partir de tradições ou do contexto mais amplo e, assim, preserva a ambiguidade do texto.
- issue: Relação entre o desencaminhamento e o pecado
  choice: “para que cometessem pecado”
  alternative: “de modo que cometeram pecado”
  rationale: A construção pode comportar matizes de finalidade ou resultado. “Para que” acompanha sua forma mais direta em português sem explicar além do texto a natureza da causalidade ou da responsabilidade moral.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação compatível com a narrativa apocalíptica. Conserva-se “filhos dos homens” por seu valor literário e cultural, com esclarecimento em nota. A repetição da expressão no segundo membro acompanha deliberadamente o paralelismo do original, em vez de substituí-la por um pronome.
