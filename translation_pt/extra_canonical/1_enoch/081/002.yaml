base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/002.yaml
  text: And I looked at the tablets of heaven[a], and I read all that was written, and I understood it all; and I read the book of all the deeds of humankind and of all the children of flesh upon the earth[d][c][b], to the generations of eternity.
translation:
  language: pt
  text: E olhei para as tábuas do céu[a], li tudo o que estava escrito e compreendi tudo; e li o livro de todos os atos da humanidade e de todos os filhos da carne sobre a terra[b], até as gerações da eternidade.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos registros celestes”. A expressão conserva, literalmente, a imagem de tábuas escritas no céu.
    reason: lexical_alternative
  - marker: b
    text: “Filhos da carne” é uma expressão de estilo semítico para os seres humanos em sua condição corpórea e terrena.
    reason: cultural_note
  - marker: c
    text: Ou “até as gerações eternas” / “pelas gerações, para sempre”. A expressão final é expansiva e não indica apenas um limite cronológico preciso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: olhei
  rationale: Verbo visionário direto e natural em português, sem intensificar indevidamente para “contemplei” ou “fitei”.
- source_word: በፀፍፀፈ ሰማይ
  choice: para as tábuas do céu
  rationale: Preserva a imagem concreta dos registros celestes; “para” combina naturalmente com “olhei”.
- source_word: አንበብኩ ኵሎ ዘጽሑፍ
  choice: li tudo o que estava escrito
  rationale: Mantém a força totalizante de ኵሎ e o sentido passivo daquilo que foi escrito.
- source_word: አእመርኩ ኵሎ
  choice: compreendi tudo
  rationale: Distingue o entendimento cognitivo do simples ato de ler.
- source_word: አንበብክዋ ለመጽሐፈ
  choice: li o livro
  rationale: Expressa de modo fluente a retomada pronominal seguida do objeto explícito, preservando a repetição de “li”.
- source_word: ኵሉ ምግባሮሙ ለሰብእ
  choice: de todos os atos da humanidade
  rationale: “Atos” abrange feitos e conduta; “humanidade” comunica o alcance universal sem impor restrição masculina.
- source_word: ውሉደ ሥጋ
  choice: filhos da carne
  rationale: Tradução literal e inteligível que conserva a textura antropológica e apocalíptica da expressão.
- source_word: ዘዲበ ምድር
  choice: sobre a terra
  rationale: Preserva a construção relativa sem verbo e evita introduzir uma distinção temporal ausente no ge'ez.
- source_word: እስከ ትውልደ ዓለም
  choice: até as gerações da eternidade
  rationale: Mantém a formulação elevada, expansiva e deliberadamente incomum da expressão apocalíptica.
theological_decisions:
- issue: Sentido antropológico de ውሉደ ሥጋ
  choice: filhos da carne
  alternative: mortais
  rationale: A formulação literal conserva a condição corpórea e terrena sugerida pelo texto, sem reduzir a expressão a uma paráfrase interpretativa.
- issue: Escopo temporal de ዘዲበ ምድር
  choice: sobre a terra
  alternative: que estarão sobre a terra
  rationale: A fonte não explicita tempo verbal; omiti-lo preserva a abertura temporal e deixa que a frase final determine o alcance.
- issue: Formulação escatológica de እስከ ትውልደ ዓለም
  choice: até as gerações da eternidade
  alternative: para sempre
  rationale: A tradução preserva a imagem de gerações sucessivas e a tensão idiomática do original, em vez de a achatar em um simples advérbio.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência apocalíptica preservada. Mantêm-se as imagens concretas “tábuas do céu”, “filhos da carne” e “gerações da eternidade”, esclarecidas por notas sem substituir a linguagem da fonte.
