base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/003.yaml
  text: And at that time I blessed the Great Lord, the King of Glory forever, because he has made all the works of the world; and I praised the Lord for his patience, and I blessed him on account of the children of Adam.
translation:
  language: pt
  text: E naquele tempo bendizei o grande Senhor, o Rei da Glória para sempre, porque ele fez todas as obras do mundo. Louvei o Senhor por sua paciência[a] e o bendizei a respeito dos filhos de Adão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por sua longanimidade» ou «por sua tolerância paciente»; o termo ge'ez pode indicar contenção perseverante, e não apenas paciência passiva.
    reason: lexical_alternative
  - marker: b
    text: A expressão literal «filhos de Adão» designa os seres humanos e conserva a ligação explícita do texto com Adão.
    reason: cultural_note
lexical_decisions:
- source_word: እምሶቤሃ
  choice: naquele tempo
  rationale: Conserva o conector temporal e o tom narrativo-apocalíptico, com formulação natural em português.
- source_word: ባረክዎ
  choice: bendisse
  rationale: Mantém explícito o verbo de bênção, distinguindo-o do verbo posterior traduzido por «louvei».
- source_word: እግዚአ ዐቢይ
  choice: o grande Senhor
  rationale: Reproduz diretamente o título formado pelo substantivo e seu adjetivo, sem ampliar «grande» para «poderoso».
- source_word: ንጉሠ ስብሐት
  choice: o Rei da Glória
  rationale: Preserva a construção titular elevada e doxológica.
- source_word: ለዓለም
  choice: para sempre
  rationale: Equivalente português idiomático para duração permanente em contexto de louvor.
- source_word: በከመ ገብረ ኵሎ ግብረ ዓለም
  choice: porque ele fez todas as obras do mundo
  rationale: Conserva a linguagem de «obras» e «mundo», sem reduzi-la a «tudo» nem introduzir «universo».
- source_word: ሰባሕኩ
  choice: louvei
  rationale: Distingue este verbo de ባረክዎ e preserva o paralelismo com verbos não idênticos.
- source_word: ትዕግሥቱ
  choice: sua paciência
  rationale: É corrente e inteligível em português; a nota registra os sentidos mais fortes de tolerância perseverante e longanimidade.
- source_word: ዲበ ውሉደ አዳም
  choice: a respeito dos filhos de Adão
  rationale: A formulação preserva a flexibilidade da preposição sem impor valor causal ou benefactivo, e mantém a referência explícita a Adão.
theological_decisions:
- issue: Tradução de ውሉደ አዳም
  choice: os filhos de Adão
  alternative: os seres humanos
  rationale: Mantém a ressonância adâmica e de linhagem humana do original, em vez de substituí-la por uma abstração.
- issue: Relação expressa por ዲበ antes de «filhos de Adão»
  choice: a respeito dos
  alternative: por causa dos
  rationale: A preposição admite mais de uma relação contextual; «a respeito dos» preserva a referência sem decidir que ela seja estritamente causal ou benefactiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do louvor foram preservados sem rigidez excessiva; os títulos divinos receberam maiúsculas por função titular.
