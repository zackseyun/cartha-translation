lexical_decisions:
- source_word: ዓመተ፡ አሐደ፡
  choice: por um ano
  rationale: Expressão temporal direta, vertida de modo natural em português.
- source_word: ነኅድገከ፡
  choice: deixaremos você
  rationale: A forma verbal é a primeira pessoa do plural no imperfeito; o futuro em português comunica adequadamente o valor contextual sem transformá-la em singular.
- source_word: በኀበ፡ ወልድከ፡
  choice: com seu filho
  rationale: A construção indica proximidade ou companhia, sem afirmar que o filho ficará responsável por Enoque.
- source_word: እስከ፡ ካዕበ፡ ትእዛዝ፡
  choice: até uma nova ordem
  rationale: A expressão aponta para uma ordem posterior ou renovada. Esta formulação é natural e mantém a autoridade de ትእዛዝ.
- source_word: ከመ፡
  choice: para que...
  rationale: A partícula introduz uma oração de finalidade ou resultado; como o texto fornecido termina nesse ponto, as reticências preservam a frase incompleta em vez de inventar sua continuação.
theological_decisions:
- issue: Natureza da instrução autorizada
  choice: ordem
  alternative: mandamento; instrução
  rationale: “Ordem” preserva a força vinculante da diretiva no contexto revelatório sem importar terminologia doutrinária posterior nem especificar uma fonte que o fragmento não identifica.
- issue: Número dos falantes
  choice: deixaremos
  alternative: deixarei
  rationale: A primeira pessoa do plural da forma ge'ez deve ser preservada, em consonância com os falantes plurais do contexto, sem harmonização com uma voz singular.
