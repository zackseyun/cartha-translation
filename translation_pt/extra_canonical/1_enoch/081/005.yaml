base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/005.yaml
  text: And those seven holy ones brought me near and set me on the earth before the door of my house[a], and they said to me, “Make everything known to Methuselah your son, and show all your children that no flesh is righteous before the Lord[b], for he is the one who created them.”
translation:
  language: pt
  text: 'E aqueles sete seres santos me trouxeram para perto e me colocaram na terra, diante da porta da minha casa[a]. Então me disseram: “Dê a conhecer tudo a Matusalém, seu filho, e mostre a todos os seus filhos que nenhuma carne é justa diante do Senhor[b], pois é ele quem os criou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante da entrada da minha casa”. O termo ge’ez pode designar uma porta ou a área de entrada.
    reason: lexical_alternative
  - marker: b
    text: “Nenhuma carne” preserva a expressão concreta do texto, que pode abranger os seres mortais ou a humanidade em sua condição corpórea.
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅረቡኒ
  choice: me trouxeram para perto
  rationale: Preserva o valor causativo e direcional de aproximação, em vez de reduzir o verbo a um simples ‘trouxeram’.
- source_word: ፯ ቅዱሳን
  choice: sete santos
  rationale: No contexto apocalíptico, designa seres celestiais santos. Em português, ‘santos’ é a forma substantivada mais natural; o contexto evita entendê-la como referência específica a santos eclesiásticos posteriores.
- source_word: አንበሩኒ
  choice: me colocaram
  rationale: Expressa a ação de fazer alguém assentar-se ou ficar em determinado lugar e se ajusta ao retorno de Enoque à terra sem especificar desnecessariamente sua postura.
- source_word: በቅድመ ኆኅተ ቤትየ
  choice: diante da porta da minha casa
  rationale: Mantém tanto a preposição espacial concreta quanto o sentido direto de porta, deixando a alternativa ‘entrada’ para a nota.
- source_word: አይድዕ ኵሎ
  choice: Dê a conhecer tudo
  rationale: 'Conserva a força causativa do imperativo: Enoque deve tornar conhecido, e não apenas saber.'
- source_word: አርኢ ለኵሎሙ ውሉድከ
  choice: mostre a todos os seus descendentes
  rationale: ‘Mostre’ reproduz o verbo de fazer ver; ‘descendentes’ comunica o alcance coletivo de ውሉድ sem restringi-lo necessariamente a filhos imediatos ou apenas homens.
- source_word: ከመ ኢ ይጸድቅ ኵሉ ዘሥጋ
  choice: que nenhuma carne é justa
  rationale: Preserva a negação universal e o idioma concreto do texto, sem convertê-lo numa formulação doutrinária posterior sobre justificação.
- source_word: ዘሥጋ
  choice: carne
  rationale: Mantém a imagem antropológica bíblico-apocalíptica e sua amplitude, em vez de interpretá-la simplesmente como ‘ninguém’ ou ‘humanidade’.
- source_word: በቅድመ እግዚአ
  choice: diante do Senhor
  rationale: É uma tradução direta e idiomática da expressão espacial, preservando a linguagem de comparecimento perante o Senhor.
- source_word: እስመ ውእቱ ፈጠሮሙ
  choice: pois é ele quem os criou
  rationale: A construção clivada preserva a ênfase do pronome, ausente numa forma mais simples como ‘pois ele os criou’.
theological_decisions:
- issue: Sentido da declaração sobre carne e justiça
  choice: Afirmação universal de que nenhuma carne é justa diante do Senhor
  alternative: Uma declaração restrita à impureza ritual, ou uma formulação forense moldada pela terminologia paulina posterior
  rationale: O ge’ez declara literalmente que nenhuma carne ‘é justa’ diante do Senhor e fundamenta isso no fato de ele ser o Criador. A tradução mantém essa tensão sem especificar um sistema doutrinário posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o tom narrativo solene; ‘nenhuma carne’ retém deliberadamente o idioma antigo e sua ambiguidade teológica.
