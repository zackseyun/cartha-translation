revisions:
- from: 'E aqueles sete santos me trouxeram para perto e me colocaram na terra, diante da porta da minha casa[a]. Então me disseram: “Dê a conhecer tudo a Matusalém, seu filho, e mostre a todos os seus descendentes que nenhuma carne é justa diante do Senhor[b], pois é ele quem os criou.”'
  to: 'E aqueles sete seres santos me trouxeram para perto e me colocaram na terra, diante da porta da minha casa[a]. Então me disseram: “Dê a conhecer tudo a Matusalém, seu filho, e mostre a todos os seus filhos que nenhuma carne é justa diante do Senhor[b], pois é ele quem os criou.”'
  rationale: A revisão limita-se a esclarecer que os «sete santos» são seres celestiais no contexto e a empregar «filhos», equivalente mais imediato e menos expansivo para o coletivo familiar. Mantêm-se a estrutura, a ambiguidade teológica de «nenhuma carne», a ênfase em Deus como Criador e os dois vínculos de nota.
