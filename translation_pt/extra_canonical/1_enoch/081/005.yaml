    issue: «sete santos» pode ser entendido como santos humanos ou eclesiásticos.
    rationale: O termo apocalíptico designa os seres santos celestiais. Em português, acrescentar «seres» evita uma associação anacrônica e preserva a função do grupo na narrativa.
  - severity: low
    issue: «descendentes» amplia levemente o referente de ውሉድ.
    rationale: Embora possa significar prole, «filhos» é mais direto e conserva a ligação imediata com «Matusalém, seu filho», sem excluir o sentido coletivo no contexto.
