base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/004.yaml
  text: 'And from it And from it I said: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.'
translation:
  language: pt
  text: 'Então eu disse: “Feliz o homem que morre justo e bom, sobre quem não foi escrito nenhum livro de transgressão e não se encontrará dia de julgamento.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, a partir disso, eu disse…”. A oração final pode também ser entendida como relacionada ao homem: “e para quem não se encontrará dia de julgamento”.'
    reason: Registra a formulação concreta da expressão inicial e preserva, sem decidir no texto principal, a relação sintática elíptica da oração final.
lexical_decisions:
- source_word: ወእምኔሁ (wa-ʾəmnehu)
  choice: Então
  rationale: A expressão liga a fala ao que a precede; “então” comunica com naturalidade o valor discursivo, enquanto o sentido mais literal é registrado em nota.
- source_word: ብፁዕ (bəṣūʿ)
  choice: Feliz
  rationale: Fórmula de bem-aventurança que declara a condição favorável da pessoa; “feliz” é claro e corrente em português, sem perder a solenidade.
- source_word: ጻድቅ ወኄር (ṣādəq wa-ḫēr)
  choice: justo e bom
  rationale: 'Mantém os dois qualificativos na posição predicativa ligada à morte: o homem morre sendo justo e bom.'
- source_word: መጽሐፈ ዐመፃ (maṣḥafa ʿamaṣā)
  choice: livro de transgressão
  rationale: Conserva a imagem forense de um registro escrito de atos perversos, sem substituir “livro” por uma explicação interpretativa como “registro”.
- source_word: ዕለተ ኵነኔ (ʿəlata kwənnānē)
  choice: dia de julgamento
  rationale: Tradução direta da expressão temporal e judicial, preservando a possível referência escatológica sem explicitá-la além do texto.
theological_decisions:
- issue: Relação do falecido com o dia de julgamento
  choice: para quem não haverá dia de julgamento
  alternative: contra quem não se encontrará sentença de condenação
  rationale: A tradução conserva “dia” e “julgamento” do texto etíope e evita identificar julgamento necessariamente com condenação, embora a construção original seja incomum.
- issue: Sentido de morrer justo e bom
  choice: que morre justo e bom
  alternative: que morre em justiça e bondade
  rationale: Mantém os adjetivos do texto aplicados ao homem e não os transforma em substantivos abstratos ou em afirmação sobre mérito salvífico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A duplicação e a corrupção evidentes da camada inglesa de consulta não foram reproduzidas; o texto foi reconstruído a partir do ge’ez fornecido.
