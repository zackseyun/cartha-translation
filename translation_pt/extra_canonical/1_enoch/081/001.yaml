base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/001.yaml
  text: And he said to me[a], “Look, Enoch, at the tablets of heaven, and read what is written on them, and understand everything[c][b], one by one.”
translation:
  language: pt
  text: 'E ele me disse: “Olhe, Enoque, para as tábuas do céu[a], leia o que está escrito nelas e compreenda todas as coisas, uma por uma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As “tábuas do céu” são apresentadas como registros celestes escritos, imagem recorrente na literatura apocalíptica.
    reason: cultural_note
lexical_decisions:
- source_word: ነጽር
  choice: Olhe
  rationale: O imperativo exprime o ato direto de olhar ou ver. “Olhe” é natural no português moderno e evita o tom arcaizante de “eis” ou “contempla”.
- source_word: ዘፀፍፀፈ ሰማይ
  choice: as tábuas do céu
  rationale: Preserva a imagem concreta de registros celestes escritos, sem reduzi-la interpretativamente a “livros” ou “registros”.
- source_word: አንብብ
  choice: leia
  rationale: Imperativo direto de ler; o contexto não exige a especificação “leia em voz alta”.
- source_word: ዘጽሑፍ ዲቤሆሙ
  choice: o que está escrito nelas
  rationale: A oração relativa remete às tábuas; “nelas” é a formulação mais natural em português.
- source_word: እእምር
  choice: compreenda
  rationale: No contexto, a ordem vai além da leitura e aponta para apreender o conteúdo; “compreenda” expressa adequadamente essa força cognitiva.
- source_word: ኵሎ አሐደ አሐደ
  choice: todas as coisas, uma por uma
  rationale: A repetição de “uma” tem força distributiva. A formulação conserva tanto a totalidade quanto o exame individual de cada coisa, em linguagem digna e clara.
theological_decisions:
- issue: Imagem apocalíptica de registros celestes
  choice: as tábuas do céu
  alternative: as tábuas celestes; os livros do céu
  rationale: “Tábuas do céu” mantém a concretude da imagem visionária e a ambiguidade própria da tradição apocalíptica, sem substituí-la por terminologia posterior ou mais genérica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O discurso direto usa imperativos respeitosos e naturais; a expressão distributiva final foi mantida explicitamente.
