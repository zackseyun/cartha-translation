lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: Depois disso
  rationale: Expressa de modo natural a sequência temporal do ge’ez, sem acrescentar uma relação causal.
- source_word: ሄኖክ
  choice: Hanok
  rationale: Preserva a forma semítica do nome adotada na camada de consulta, em vez da forma portuguesa tradicional “Enoque”.
- source_word: ወሀበኒ
  choice: tomou a palavra
  rationale: O verbo significa literalmente “deu”; neste contexto de início de discurso, a expressão portuguesa comunica naturalmente a ideia de dar voz ou proferir palavras, sem a formulação pouco idiomática “deu voz”.
- source_word: ወአኀዘኒ፡ ይትናገር
  choice: e começou a falar
  rationale: Reproduz a construção aspectual de início seguida do verbo “falar”.
- source_word: እመጻሕፍት
  choice: com base nos livros
  rationale: Mantém o sentido de procedência ou fundamento indicado por “de/dos livros”, evitando sugerir necessariamente leitura oral direta.
