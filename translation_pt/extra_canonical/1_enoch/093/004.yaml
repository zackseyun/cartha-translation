base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/004.yaml
  text: And after me[a], in the second week, great evil shall arise, and deceit shall spring up in it. And in it there shall be the first end, and in it a man shall be saved; and after it has been completed, unrighteousness shall grow[d][c][b], and a law shall be made for the sinners.
translation:
  language: pt
  text: E depois de mim, na segunda semana[a], surgirá um grande mal, e nela brotará o engano. Nela haverá o primeiro fim e, nela, um homem será salvo[b]. Depois que ela se completar, a injustiça crescerá, e uma lei será estabelecida para os pecadores[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “segunda semana” pertence à estrutura simbólica de semanas do apocalipse histórico de Enoque; não indica necessariamente um período literal de sete dias.
    reason: cultural_note
  - marker: b
    text: “Um homem será salvo” preserva o singular. Muitos entendem estas palavras como uma alusão a Noé, mas o versículo não o identifica pelo nome.
    reason: cross_reference
  - marker: c
    text: 'Ou: “uma norma será decretada para os pecadores”. O etíope pode indicar uma lei referente aos pecadores ou até mesmo dirigida contra eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይቀውም
  choice: surgirá
  rationale: Expressa o aparecimento de uma condição histórica, preservando o sentido de “levantar-se/surgir” no esquema temporal da passagem.
- source_word: በካልእት ሰንበት
  choice: na segunda semana
  rationale: Mantém a designação estrutural do Apocalipse das Semanas; a nota esclarece que se trata de um período simbólico.
- source_word: ዐቢይ እኩይ
  choice: um grande mal
  rationale: Conserva a linguagem moral forte e direta do texto etíope.
- source_word: ትሕሱት በቀለት
  choice: brotará o engano
  rationale: “Brotará” preserva a metáfora orgânica do verbo, enquanto “engano” mantém a amplitude moral do substantivo.
- source_word: ቀዳሚት ፍጻሜ
  choice: o primeiro fim
  rationale: Mantém a formulação apocalíptica esquemática sem substituir “fim” por uma interpretação mais específica.
- source_word: ይድኅን ብእሲ
  choice: um homem será salvo
  rationale: Preserva tanto o singular quanto a ideia de livramento, sem identificar explicitamente a pessoa.
- source_word: ተፈጸመ
  choice: ela se completar
  rationale: Retém a sequência temporal e toma a semana como antecedente natural.
- source_word: ትእህቱ ዓመፃ
  choice: a injustiça crescerá
  rationale: A leitura do trecho é textualmente difícil; esta formulação ampla comunica o aumento da desordem moral sem restringi-la a violência ou rebelião.
- source_word: ሥርዐት
  choice: uma lei
  rationale: Preserva o sentido básico de ordem, norma ou lei e a formulação marcante do original.
- source_word: ይትገበር ለኃጥኣን
  choice: será estabelecida para os pecadores
  rationale: Reproduz a construção passiva e mantém a ambiguidade da relação da lei com os pecadores.
theological_decisions:
- issue: Identidade do homem salvo
  choice: Manter “um homem será salvo” sem nomeá-lo.
  alternative: Identificá-lo como Noé ou entender o singular coletivamente como a humanidade.
  rationale: O contexto pode sugerir Noé, mas o versículo não o nomeia; o singular não deve ser apagado nem sua identidade resolvida no texto principal.
- issue: Sentido da lei estabelecida para os pecadores
  choice: Manter “uma lei será estabelecida para os pecadores”.
  alternative: “Uma norma será decretada contra os pecadores” ou “um juízo será determinado para os pecadores”.
  rationale: A preposição e o substantivo permitem mais de uma nuance. A tradução conserva a ambiguidade em vez de convertê-la diretamente em linguagem punitiva.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conservam-se a repetição de “nela”, o singular “um homem” e a expressão apocalíptica “o primeiro fim”. O futuro simples evita rigidez arcaizante, enquanto “será estabelecida” reproduz adequadamente a construção passiva.
