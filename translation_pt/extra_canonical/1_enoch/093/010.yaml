base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/010.yaml
  text: And at its completion the chosen righteous ones will be selected from the eternal plant of righteousness[c][b][a], and to them will be given the sevenfold instruction concerning all his creation.
translation:
  language: pt
  text: E, ao seu término, serão escolhidos os justos eleitos dentre a planta eterna de justiça[a], aos quais será dada a instrução sétupla[b] acerca de toda a criação dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a plantação eterna de justiça” ou “a planta de justiça eterna”. A expressão conserva uma imagem agrícola, e a relação exata entre “eterna”, “planta” e “justiça” admite mais de uma leitura.
    reason: lexical_alternative
  - marker: b
    text: Ou “as sete instruções” ou “as sete modalidades de instrução”. A expressão ge'ez é difícil, e o numeral pode caracterizar o ensino como um corpo sétuplo e completo.
    reason: lexical_alternative
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: ao seu término
  rationale: Expressa o ponto final do período ou da “semana” precedente sem tornar explícito um antecedente que o texto deixa implícito.
- source_word: ይትኃረዩ
  choice: serão escolhidos
  rationale: Conserva o valor passivo do verbo e o motivo da eleição, embora produza uma repetição semântica intencional com “eleitos”.
- source_word: ኅሩያን ጻድቃን
  choice: os justos eleitos
  rationale: Mantém os dois qualificativos, sem reduzir a expressão apenas à condição moral ou apenas à eleição. A ordem soa natural em português e preserva “justos” como substantivo qualificado.
- source_word: እምተክለ ጽድቅ ዘለዓለም
  choice: dentre a planta eterna de justiça
  rationale: “Planta” preserva a imagem agrícola apocalíptica; “dentre” comunica que os escolhidos procedem desse conjunto figurado. A posição de “eterna” acompanha a leitura de que qualifica a planta.
- source_word: እለ ይትወሀብ ሎሙ
  choice: aos quais será dada
  rationale: Reproduz a ligação relativa introduzida por እለ e conserva a construção passiva de ይትወሀብ ሎሙ em português natural.
- source_word: ሰብዓቱ መክዕቢተ ትምህርት
  choice: a instrução sétupla
  rationale: Representa o difícil grupo nominal como um corpo completo de instrução caracterizado pelo número sete, sem ocultar em nota as alternativas lexicais possíveis.
- source_word: በኵሉ ፍጥረት ዚአሁ
  choice: acerca de toda a criação dele
  rationale: Interpreta a preposição como indicação do assunto da instrução; “criação” conserva o sentido coletivo, e “dele” mantém a referência pronominal sem explicitar indevidamente seu antecedente.
theological_decisions:
- issue: Linguagem de eleição em contexto de juízo e restauração
  choice: os justos eleitos
  alternative: os eleitos justos
  rationale: Mantém eleição e justiça como descrições simultâneas, sem importar conclusões de debates teológicos posteriores.
- issue: Imagem agrícola da origem dos justos
  choice: a planta eterna de justiça
  alternative: a plantação eterna de justiça
  rationale: Preserva a metáfora concreta do crescimento e evita substituí-la por termos abstratos como “comunidade” ou “fundamento”.
- issue: Referente do pronome possessivo final
  choice: toda a criação dele
  alternative: toda a sua criação
  rationale: “Dele” conserva a referência masculina do texto sem identificar expressamente o referente; a formulação evita que “sua”, em português, pareça retomar os justos mais próximos.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A sintaxe relativa “aos quais será dada” preserva a ligação estreita do original. A repetição conceitual em “serão escolhidos os justos eleitos” foi mantida por refletir dois elementos distintos do ge'ez.
