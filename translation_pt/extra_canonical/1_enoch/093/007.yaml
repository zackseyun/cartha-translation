base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/007.yaml
  text: And after this[a], in the fifth week, at its completion[b], the house of glory and kingship shall be built forever.
translation:
  language: pt
  text: E, depois disso, na quinta semana[b], ao seu término, a casa de glória e realeza[a] será construída para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a casa gloriosa e o reino serão construídos para sempre”, caso መንግሥት seja entendido como um segundo elemento coordenado, e não como parte da descrição da casa.'
    reason: alternative_reading
  - marker: b
    text: No Apocalipse das Semanas, “semana” indica um período simbólico da visão histórica de Enoque, não necessariamente um intervalo literal de sete dias.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: depois disso
  rationale: Mantém a fórmula temporal que introduz a etapa seguinte da visão, com clareza e sem explicitação indevida.
- source_word: ኃምስ ሰንበት
  choice: quinta semana
  rationale: No Apocalipse das Semanas, o termo designa uma semana ou período heptádico dentro do esquema visionário, e não um sábado literal.
- source_word: በተፍጻሜታ
  choice: ao seu término
  rationale: O sufixo retoma a semana; a expressão conserva tanto a ideia de fim quanto a de consumação do período.
- source_word: ቤተ ስብሐት
  choice: casa de glória
  rationale: Preserva a imagem concreta de uma casa ou santuário e o sentido de glória de ስብሐት, sem tornar explícita a identificação com o templo.
- source_word: መንግሥት
  choice: realeza
  rationale: O substantivo pode indicar reino, reinado ou soberania. “Realeza” combina naturalmente com “glória” como caracterização da casa e evita impor a ideia de um território.
- source_word: ይትሐነጽ
  choice: será construída
  rationale: Mantém o sentido passivo e concreto de edificação exigido pela imagem da casa.
- source_word: እስከ ለዓለም
  choice: para sempre
  rationale: É a forma corrente e natural de expressar a duração perpétua do idioma ge'ez.
theological_decisions:
- issue: Se o versículo descreve uma única casa associada à glória e à realeza ou dois elementos coordenados, a casa gloriosa e o reino
  choice: uma única “casa de glória e realeza”
  alternative: “a casa gloriosa e o reino serão construídos para sempre”
  rationale: A ligação sintática favorece a leitura dos dois substantivos como associados à casa, preservando ao mesmo tempo na nota a possibilidade de coordenação. A tradução não identifica de modo explícito a casa como templo nem reduz a imagem a um reino político.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem foi levemente ajustada para soar natural em português, sem perder a sequência do ge'ez. Os marcadores foram colocados junto às expressões que efetivamente explicam.
