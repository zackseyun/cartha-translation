base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/012.yaml
  text: And who is there that can behold heaven? And who is there that can understand the works of heaven? Or see a soul—or[a], if not[e][d][c][b], a spirit—and tell of it? Or else ascend and see all their ends?
translation:
  language: pt
  text: E quem é capaz de contemplar o céu? E quem é capaz de compreender as obras do céu? E como poderá alguém ver uma alma — ou, se não, um espírito — e falar a seu respeito?[a] Ou então subir e ver todas as suas extremidades?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase “ver uma alma — ou, se não, um espírito” é textual e semanticamente difícil. “Espírito” também pode significar “sopro” ou “respiração”. A tradução conserva a distinção e a aspereza da formulação em ge'ez.
    reason: textual_variant
  - marker: b
    text: A expressão final é incerta. Pode significar “todas as suas extremidades”, “todos os seus confins” ou, mais literalmente, “todas as suas asas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምነት ውእቱ ዘይክል
  choice: quem é capaz de
  rationale: Reproduz a pergunta retórica sobre a capacidade humana em português natural e mantém a ideia explícita de poder ou capacidade.
- source_word: ነጽሮተ ሰማይ
  choice: contemplar o céu
  rationale: Analisa ነጽሮተ como forma verbal de ነጸረ, “olhar, contemplar”, sem introduzir a ideia ausente de depósitos ou tesouros celestes.
- source_word: አእምሮ ግብረ ሰማይ
  choice: compreender as obras do céu
  rationale: Mantém tanto o sentido cognitivo de conhecer/compreender quanto a expressão cósmica “obras do céu”.
- source_word: ከመ ይርአይ ነፍሰ
  choice: como poderá alguém ver uma alma
  rationale: Conserva a formulação marcante e difícil do ge'ez, sem substituir “alma” por uma explicação antropológica.
- source_word: መንፈሰ
  choice: um espírito
  rationale: “Espírito” é o equivalente contextual mais natural, embora “sopro” ou “respiração” permaneçam possibilidades lexicais.
- source_word: ይክል ነጊረ
  choice: falar a seu respeito
  rationale: Expressa a capacidade de relatar ou declarar aquilo que foi percebido, com linguagem corrente e digna.
- source_word: ወእመ አኮ ዐሪገ
  choice: ou então subir
  rationale: Entende እመ አኮ como a expressão idiomática “ou então”, sem inverter a lógica mediante uma condição negativa.
- source_word: ኵሎ አክናፊሆሙ
  choice: todas as suas extremidades
  rationale: “Extremidades” preserva a noção possível de limites ou confins e evita decidir em favor do sentido mais literal, porém obscuro, “asas”.
theological_decisions:
- issue: Relação entre ነፍሰ e መንፈሰ
  choice: Manter “alma” e “espírito” como termos distintos.
  alternative: Traduzir como “vida” e “sopro”, ou fundir ambos em um único conceito.
  rationale: O texto justapõe dois termos relacionados sem explicar sua relação. A tradução conserva essa tensão e não impõe uma antropologia denominacional.
- issue: Alcance das realidades celestes
  choice: Preservar “obras do céu” e a imagem espacial de subir e ver suas extremidades.
  alternative: Parafrasear como conhecimento genérico das coisas celestes.
  rationale: A linguagem cósmica e apocalíptica faz parte do argumento retórico e não deve ser reduzida a uma abstração.
translation_notes:
  register: Português moderno, internacional e legível no Brasil, com tom elevado sem arcaísmos. As perguntas retóricas foram mantidas, assim como as ambiguidades antropológica e cosmológica do texto-fonte.
