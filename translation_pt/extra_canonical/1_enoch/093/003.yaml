base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/003.yaml
  text: And now Enoch began to speak from the books[a], and he said, “I was born the seventh in the first week[d][c][b], while righteousness and justice still endured.”
translation:
  language: pt
  text: 'E então Enoque começou a falar com base nos livros[a] e disse: “Eu nasci como o sétimo, na primeira semana[b], enquanto o juízo e a justiça ainda perduravam[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Com base nos livros” apresenta Enoque como alguém que fala a partir de registros escritos, possivelmente lendo-os ou recitando-os.
    reason: cultural_note
  - marker: b
    text: A “primeira semana” é o primeiro período da divisão simbólica da história conhecida como Apocalipse das Semanas, não necessariamente uma semana literal de sete dias.
    reason: cross_reference
  - marker: c
    text: A forma transcrita antes de “justiça” é textualmente difícil e parece refletir um erro de OCR. A leitura crítica “juízo” também já foi traduzida por termos como “julgamento”; versões baseadas na forma corrompida podem apresentar “retidão”, “integridade” ou “verdade”.
    reason: textual_variant
lexical_decisions:
- source_word: አኀዘ፡ እንከ፡ ይትናገር
  choice: E então ... começou a falar
  rationale: Reproduz a transição narrativa e o início da ação com uma construção natural em português.
- source_word: እመጻሕፍት
  choice: com base nos livros
  rationale: Expressa os livros como fonte da fala de Enoque sem definir indevidamente esses documentos como Escrituras ou arquivos.
- source_word: ሳብዕ
  choice: como o sétimo
  rationale: Mantém o ordinal e indica a posição de Enoque numa sequência, provavelmente geracional, sem acrescentar essa explicação ao corpo do texto.
- source_word: በቀዳሚት፡ ሰንበት
  choice: na primeira semana
  rationale: No contexto do Apocalipse das Semanas, o termo designa um período heptádico simbólico, não um sábado isolado.
- source_word: እስከ፡ አመ
  choice: enquanto ... ainda
  rationale: No retrospecto histórico, a expressão introduz uma situação contínua vigente naquele período, e não necessariamente um limite futuro.
- source_word: ኵነኔ (leitura crítica subjacente ao OCR ጽጌነ)
  choice: juízo
  rationale: A forma transcrita parece resultar de erro de OCR; a leitura crítica indicada é o substantivo 'juízo', preservado sem convertê-lo silenciosamente em outra qualidade ética.
- source_word: ጽድቅ
  choice: justiça
  rationale: Neste par com 'juízo', 'justiça' oferece uma correspondência portuguesa clara e idiomática para a qualidade moral expressa pelo termo.
- source_word: ትዓገሠ
  choice: ainda perduravam
  rationale: O imperfeito, dentro de uma retrospectiva da primeira semana, é entendido como estado contínuo no passado.
theological_decisions:
- issue: Sentido de “primeira semana”
  choice: Período histórico simbólico expresso como “primeira semana”
  alternative: Um sábado literal ou apenas sete dias
  rationale: A unidade pertence ao esquema heptádico do Apocalipse das Semanas; a tradução conserva a metáfora temporal sem transformá-la em interpretação doutrinária.
- issue: Par ético no fim do versículo
  choice: “o juízo e a justiça”
  alternative: “a retidão e a justiça” ou “a justiça e a retidão”
  rationale: A transcrição fornecida contém uma forma difícil, mas a revisão crítica identifica provável erro de OCR e sustenta a leitura 'juízo'. A nota torna transparente a incerteza textual.
- issue: Valor temporal do verbo final
  choice: 'Estado contínuo no passado: “ainda perduravam”'
  alternative: 'Projeção futura: “perdurarão”'
  rationale: Enoque está recapitulando a época em que nasceu; o contexto favorece o passado contínuo, embora a forma isolada tenha permitido traduções futuras.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe fluente para leitores brasileiros e internacionais. “Com base nos livros” evita o possível sentido físico pouco natural de “dos livros”; “perduravam” conserva o tom solene sem soar arcaico.
