base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/009.yaml
  text: And after this[a], in the seventh week, an apostate generation will arise, and many will be its deeds[b], and all its deeds will be apostasy.
translation:
  language: pt
  text: Depois disso, na sétima semana[a], surgirá uma geração apóstata. Suas obras serão muitas, e todas elas serão apostasia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sétimo sábado” ou “sétima semana”. Nesta seção, a expressão se refere ao período simbólico de uma semana na visão da história, não a um único dia.
    reason: cultural_note
  - marker: b
    text: O termo também pode ser traduzido como “erro”, “perversão” ou “rebelião”. “Apostasia” conserva aqui a força religiosa da descrição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕት ሰንበት
  choice: sétima semana
  rationale: No Apocalipse das Semanas, a expressão designa o sétimo período simbólico da história, não um sábado literal. “Semana” preserva a estrutura heptádica e é clara em português.
- source_word: ትትነሣእ
  choice: surgirá
  rationale: O verbo indica levantar-se, aparecer ou vir à existência. “Surgirá” expressa naturalmente a entrada dessa geração na sequência histórica visionária.
- source_word: ትውልድ
  choice: geração
  rationale: O termo pode indicar geração, descendência ou linhagem; aqui caracteriza um grupo histórico dentro da visão das semanas.
- source_word: ዕሉት
  choice: apóstata
  rationale: O vocábulo comunica desvio ou afastamento do que é correto. “Apóstata” conserva sua força religiosa e mantém a ligação com o substantivo abstrato ዕልወት.
- source_word: ብዙኅ
  choice: serão muitas
  rationale: O termo indica multiplicidade ou abundância. A construção predicativa “suas obras serão muitas” preserva a ênfase do texto e soa natural em português.
- source_word: ምግባራቲሃ
  choice: suas obras
  rationale: O substantivo refere-se a ações, feitos ou práticas. “Obras” conserva o peso moral do contexto de avaliação e juízo.
- source_word: ዕልወት
  choice: apostasia
  rationale: O substantivo pode denotar desvio, erro, perversão ou rebelião. “Apostasia” preserva a dimensão religiosa e a correspondência lexical com “apóstata”.
theological_decisions:
- issue: Se o caráter da geração deve ser expresso em termos morais genéricos ou em termos de afastamento religioso
  choice: geração apóstata ... todas elas serão apostasia
  alternative: geração perversa ... todas elas serão perversidade
  rationale: O paralelismo entre ዕሉት e ዕልወት aponta para desvio ou abandono, e não apenas para maldade genérica. A formulação escolhida conserva essa tensão religiosa sem especificar de qual compromisso ocorreu o afastamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente pesada, sem alterar a progressão do texto. Os marcadores aparecem junto às expressões que explicam.
