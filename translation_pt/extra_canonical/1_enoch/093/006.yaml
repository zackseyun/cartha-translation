base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/006.yaml
  text: And after this[a], in the fourth week, at its completion, visions of the holy and righteous shall be seen[c][b], and a law for generation after generation and an enclosure shall be made for them.
translation:
  language: pt
  text: E, depois disso, na quarta semana, ao seu término, serão vistas visões dos santos e dos justos, e uma lei[c] para geração após geração e um recinto[b] serão feitos para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O último substantivo é difícil. Pode indicar algo cercado, plantado ou preparado para eles; entre as possibilidades estão “jardim” e “plantação”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “uma ordem para geração após geração e um recinto serão feitos para eles”.'
    reason: previous_rendering
lexical_decisions:
- source_word: እምድኅረዝ
  choice: depois disso
  rationale: Expressa com naturalidade a transição temporal que introduz a etapa seguinte da visão.
- source_word: ራብዕት ሰንበት
  choice: quarta semana
  rationale: No Apocalipse das Semanas, o termo designa o quarto período simbólico, não um sábado literal.
- source_word: በተፍጻሜታ
  choice: ao seu término
  rationale: O pronome retoma a quarta semana e marca a conclusão desse período.
- source_word: ራእያተ
  choice: visões
  rationale: Mantém o sentido visionário e o gênero apocalíptico do texto.
- source_word: ቅዱሳን ወጻድቃን
  choice: dos santos e dos justos
  rationale: Reproduz os dois plurais substantivados sem identificar de modo dogmático seus referentes.
- source_word: ይትረአይ
  choice: serão vistas
  rationale: Conserva a forma passiva e deixa em aberto se as visões são concedidas, manifestadas ou simplesmente percebidas.
- source_word: ሥርዐት
  choice: uma lei
  rationale: Neste contexto histórico-apocalíptico, o termo provavelmente aponta para uma norma revelada; “lei” também preserva o paralelo literário com 1 Enoque 93:4, embora “ordem” permaneça possível.
- source_word: ለትውልደ ትውልድ
  choice: para geração após geração
  rationale: Preserva a repetição semítica e sua ideia de continuidade entre gerações sucessivas.
- source_word: ዐጸድ
  choice: um recinto
  rationale: O substantivo é difícil e pode evocar algo cercado, plantado ou preparado; “recinto” mantém uma imagem concreta sem especificá-la excessivamente.
- source_word: ይትገበር ሎሙ
  choice: serão feitos para eles
  rationale: O único verbo plural é apresentado como regendo conjuntamente “lei” e “recinto”, sem duplicação ausente no texto-fonte.
theological_decisions:
- issue: Identidade dos “santos e dos justos”
  choice: Manter a expressão ampla, sem explicitar no texto principal se são seres humanos ou celestiais.
  alternative: Identificá-los especificamente como fiéis humanos, seres celestiais ou um grupo misto.
  rationale: O contexto histórico favorece pessoas fiéis, mas a linguagem apocalíptica não exclui totalmente outra referência.
- issue: Sentido de ሥርዐት
  choice: lei
  alternative: ordem, ordenança ou organização estabelecida
  rationale: O paralelo no esquema das semanas e a provável alusão ao Sinai favorecem “lei”, mas a nota preserva a amplitude lexical do termo.
- issue: Sentido de ዐጸድ
  choice: recinto
  alternative: jardim, plantação ou algo plantado
  rationale: A palavra é textualmente difícil; não se deve transformar uma possibilidade lexical em identificação teológica certa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. A coordenação “uma lei... e um recinto serão feitos” conserva o único verbo do ge’ez e sua regência sobre os dois substantivos, ainda que produza leve solenidade sintática.
