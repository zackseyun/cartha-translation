base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/005.yaml
  text: And after this[a], in the third week, at its completion, a man shall be chosen as the plant of righteous judgment[c][b], and after him there shall come forth the plant of righteousness forever and ever.
translation:
  language: pt
  text: E depois disso, na terceira semana[a], ao seu término, um homem será escolhido como planta de juízo justo[b][c]; e depois dele brotará a planta da justiça para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “terceira semana” faz parte da sequência simbólica do Apocalipse das Semanas; não se trata de uma semana literal de sete dias.
    reason: cultural_note
  - marker: b
    text: O texto não identifica o homem escolhido. Intérpretes o têm associado a diferentes antepassados ou líderes justos, mas o próprio versículo não lhe dá nome.
    reason: alternative_reading
  - marker: c
    text: A construção “planta de juízo justo” é incomum, e a imagem vegetal pode sugerir uma pessoa, uma linhagem ou uma comunidade. A tradução conserva a metáfora e sua ambiguidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት ሰንበት
  choice: terceira semana
  rationale: No contexto do Apocalipse das Semanas, a expressão designa um período simbólico de sete partes, não um sábado literal.
- source_word: በተፍጻሜታ
  choice: ao seu término
  rationale: O sufixo retoma a terceira semana e assinala o encerramento desse período simbólico.
- source_word: ይትኃረይ
  choice: será escolhido
  rationale: Preserva o sentido passivo de seleção sem acrescentar a ideia específica de nomeação para um cargo.
- source_word: ብእሲ
  choice: um homem
  rationale: Mantém a figura humana singular e masculina do texto sem tentar identificá-la.
- source_word: ለተክለ
  choice: como planta de
  rationale: A construção é difícil, mas contém claramente uma imagem vegetal; esta formulação conserva a metáfora e a relação sintática proposta pelo texto.
- source_word: ኵነኔ ጽድቅ
  choice: juízo justo
  rationale: Expressa tanto o elemento judicial quanto a qualidade moral da expressão em linguagem portuguesa natural e dignificada.
- source_word: ይወፅእ
  choice: brotará
  rationale: O verbo significa sair ou vir à existência; no contexto imediato da planta, 'brotará' torna natural em português a continuidade da imagem sem alterar sua força básica.
- source_word: ለተክለ ጽድቅ
  choice: a planta da justiça
  rationale: Conserva a metáfora agrícola concreta e a relação genitiva, sem decidir se ela representa pessoa, linhagem ou comunidade.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Equivalente português corrente e solene da expressão enfática de duração perpétua.
theological_decisions:
- issue: Identidade do homem singular escolhido no fim da terceira semana
  choice: Traduzir de modo indefinido como 'um homem'.
  alternative: Identificá-lo como Enoque, Noé, Abraão ou um líder justo representativo.
  rationale: O versículo não dá nome à figura; identificá-la no texto principal resolveria uma ambiguidade que a fonte preserva.
- issue: Sentido da imagem da planta
  choice: Manter 'planta' nas duas ocorrências.
  alternative: Interpretar como linhagem, descendência, raiz ou comunidade.
  rationale: O texto emprega explicitamente linguagem vegetal, cuja referência simbólica permanece aberta.
translation_notes:
  register: Português moderno, amplamente internacional e legível no Brasil, com tom solene adequado à literatura apocalíptica. Emprega 'juízo' no sentido judicial, não como mera opinião. 'Brotará' dá fluidez à segunda imagem vegetal, enquanto 'planta' é mantida nas duas expressões nominais.
