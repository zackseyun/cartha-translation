base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/002.yaml
  text: And Enoch said[a], “Concerning the children of righteousness, and concerning the chosen of the world, and concerning the plant of uprightness, I will speak to you and make known to you, my children—I, Enoch—what was shown to me from a vision of heaven, and what I learned from the words of the holy angels[e][d][c][b], and understood from the tablets of heaven.”
translation:
  language: pt
  text: 'E Enoque disse: “A respeito dos filhos da justiça, dos escolhidos do mundo[a] e da planta da retidão, essas coisas lhes falarei e lhes darei a conhecer, meus filhos — eu, Enoque —, conforme o que me foi mostrado de uma visão do céu, o que vim a saber da palavra dos santos anjos[b] e o que compreendi das tábuas do céu[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escolhidos da era”, se ዓለም for entendido como era ou ordem do mundo, e não como o mundo criado.
    reason: lexical_alternative
  - marker: b
    text: 'O termo etíope está no singular e também pode ser traduzido como “voz” ou “declaração”: “da voz dos santos anjos”.'
    reason: lexical_alternative
  - marker: c
    text: “Tábuas do céu” designa os registros celestes no imaginário enoquiano; a expressão também pode ser entendida de modo mais geral como os escritos ou livros do céu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ፡ ጽድቅ
  choice: filhos da justiça
  rationale: Conserva a metáfora filial e a construção genitiva, sem reduzir a expressão simplesmente a “justos”.
- source_word: ኅሩያነ፡ ዓለም
  choice: escolhidos do mundo
  rationale: Traduz os dois elementos de modo transparente e evita a carga doutrinária que “eleitos” pode adquirir; a possível acepção temporal de ዓለም é registrada em nota.
- source_word: ተክለ፡ ርትዕ
  choice: planta da retidão
  rationale: Preserva a imagem vegetal apocalíptica e distingue ርትዕ da expressão anterior com ጽድቅ.
- source_word: እሎንተ፡ እብለክሙ፡ ወአየድዐክሙ
  choice: falarei a vocês e lhes darei a conhecer essas coisas
  rationale: Representa os dois verbos, de falar e tornar conhecido, e conserva o demonstrativo plural sem forçar que as três designações sejam grupos inteiramente distintos.
- source_word: በዘ፡ አስተርአየኒ፡ እምራእየ፡ ሰማይ
  choice: conforme o que me foi mostrado a partir de uma visão do céu
  rationale: Mantém በዘ como indicação da base do discurso e traduz እም como origem, “a partir de”, em vez de localização “em”.
- source_word: እምቃለ፡ ቅዱሳን፡ መላእክት፡ አእመርኩ
  choice: o que vim a saber pela palavra dos santos anjos
  rationale: Conserva o singular de ቃለ e comunica a mediação angelical; “palavra” permanece aberta ao sentido próximo de voz ou declaração.
- source_word: እምነ፡ ጸፍጸፈ፡ ሰማይ፡ ለበውኩ
  choice: o que compreendi nas tábuas do céu
  rationale: Preserva a imagem concreta dos registros celestes, comum na literatura enoquiana, sem generalizá-la como meros “livros”.
theological_decisions:
- issue: Relação entre as três designações dos justos
  choice: Manter “filhos da justiça”, “escolhidos do mundo” e “planta da retidão” como designações sobrepostas, sem identificá-las ou separá-las explicitamente.
  alternative: Tratálas como três grupos distintos ou como simples sinônimos plenamente intercambiáveis.
  rationale: O texto acumula as expressões sem explicar a relação precisa entre elas; a tradução conserva essa tensão.
- issue: Sentido de ኅሩያነ፡ ዓለም
  choice: escolhidos do mundo
  alternative: escolhidos da era
  rationale: “Mundo” é a correspondência direta, mas ዓለም também pode designar uma era ou ordem do mundo; a alternativa é preservada em nota.
- issue: Natureza das tábuas celestes
  choice: Manter a imagem de “tábuas do céu”.
  alternative: Interpretar como livros, escritos ou registros celestes em sentido geral.
  rationale: A formulação concreta pertence ao imaginário apocalíptico do texto e não deve ser dissolvida em uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para clareza internacional e boa legibilidade brasileira. A repetição solene das designações e a metáfora vegetal foram preservadas. Os travessões destacam a autoidentificação enfática de Enoque sem tornar a frase excessivamente arcaica.
