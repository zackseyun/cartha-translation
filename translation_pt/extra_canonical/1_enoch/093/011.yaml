base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/011.yaml
  text: For who among all the children of men is able to hear the voice of the Holy One and not be shaken? And who is able to comprehend his thoughts? And who is able to look upon all the works of heaven?[a][b][c]
translation:
  language: pt
  text: Pois quem, entre todos os filhos dos homens, é capaz de ouvir a voz do Santo[a] sem ficar abalado? E quem é capaz de compreender os pensamentos dele?[b] E quem é capaz de contemplar todas as obras do céu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra” ou “a fala do Santo”; o termo ge'ez pode ter esses sentidos, além de “voz”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “pensar o pensamento dele”. O pronome provavelmente retoma o Santo; a frase também já foi entendida como “fazer sua mente compreender”.
    reason: textual_ambiguity
  - marker: c
    text: “As obras do céu” pode abranger as operações, estruturas ou fenômenos ordenados dos céus, e não apenas objetos visíveis.
    reason: cultural_note
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Introduz a afirmação como explicação ou fundamento e conserva a força retórica do original.
- source_word: ውሉደ ሰብእ
  choice: os filhos dos homens
  rationale: Preserva a expressão semítica coletiva para a humanidade e o registro elevado do texto apocalíptico, sem transformá-la em título posterior.
- source_word: ዘይክል
  choice: é capaz de
  rationale: Mantém o padrão reiterado de capacidade humana limitada nas três perguntas retóricas.
- source_word: ሰሚዐ ቃሉ ለቅዱስ
  choice: ouvir a voz do Santo
  rationale: ቃል pode indicar voz, palavra ou fala; após o verbo 'ouvir', 'voz' é natural e conserva a imediatez da manifestação divina. ቅዱስ é tratado como título substantivado.
- source_word: ወኢይትሀወክ
  choice: sem ficar abalado
  rationale: Expressa a perturbação profunda causada pela voz divina sem restringi-la a medo, confusão ou emoção específica.
- source_word: ከመ የሐሊ ኅሊናሁ
  choice: compreender os pensamentos dele
  rationale: Representa o ato de alcançar mentalmente o pensamento daquele mencionado antes, o Santo. O plural idiomático em português comunica o sentido sem a formulação pouco natural 'pensar o pensamento dele'; a nota registra a forma mais literal e a alternativa sintática atestada.
- source_word: ነጽሮተ
  choice: contemplar
  rationale: Verbo atual, porém elevado, adequado ao contexto visionário e mais intenso que o simples 'ver'.
- source_word: ምግባረ ሰማይ
  choice: as obras do céu
  rationale: Conserva a amplitude de ምግባር, que pode abranger obras, operações e fenômenos ordenados do céu, sem reduzi-lo a objetos visíveis.
theological_decisions:
- issue: Tratamento de ለቅዱስ como título divino
  choice: do Santo
  alternative: do santo
  rationale: O contexto apresenta um orador transcendente cuja voz abala os seres humanos. A inicial maiúscula sinaliza um título divino sem importar uma identificação cristológica posterior.
- issue: Referente do sufixo em ኅሊናሁ
  choice: os pensamentos dele, isto é, do Santo
  alternative: sua própria mente compreender
  rationale: 'A sequência retórica favorece a referência ao Santo: ouvir sua voz e compreender seus pensamentos. A formulação portuguesa mantém o pronome no texto e registra em nota a análise alternativa, sem construir doutrina sobre a identificação do referente.'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de “E quem é capaz de” preserva a cadência das perguntas retóricas. “Filhos dos homens” mantém o caráter apocalíptico e semítico sem soar excessivamente arcaico.
