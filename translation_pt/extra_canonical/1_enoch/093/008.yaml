base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/008.yaml
  text: And after this[a], in the sixth week, all who are in it will be blind, and the hearts of all of them will forget wisdom. And in it a man will ascend, and at its completion the house of the kingdom will be burned with fire[d][c][b], and in it the whole stock of the chosen root will be scattered.
translation:
  language: pt
  text: E depois disso, na sexta semana, todos os que nela estiverem ficarão cegos[a], e o coração de todos eles se esquecerá da sabedoria. Nela, um homem subirá[b]; e, ao seu término, a casa do reino[c] será queimada pelo fogo, e nela será dispersa toda a linhagem da raiz escolhida[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficarão obscurecidos”. A expressão provavelmente retrata os participantes da sexta semana como cegos em sentido espiritual.
    reason: lexical_alternative
  - marker: b
    text: Ou “se levantará”. O verbo pode indicar subir ou erguer-se; “subirá” preserva essa ambiguidade.
    reason: lexical_alternative
  - marker: c
    text: “Casa do reino” também pode designar a casa real ou a dinastia, e não apenas uma construção física.
    reason: lexical_alternative
  - marker: d
    text: “Raiz escolhida” combina a imagem de uma linhagem com a de uma planta; pode indicar uma descendência ou um remanescente eleito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳድስት ሰንበት
  choice: sexta semana
  rationale: No contexto do Apocalipse das Semanas, designa um período simbólico de sete partes, não um sábado literal; “semana” preserva a estrutura apocalíptica com clareza.
- source_word: ውስቴታ ጽሉላነ ኵሎሙ
  choice: todos os que nela estiverem ficarão cegos
  rationale: Mantém o estado de cegueira atribuído aos participantes da sexta semana, sem explicitar no corpo do texto se a cegueira é física ou espiritual.
- source_word: ይትረሣዕ ልቦሙ ለኵሎሙ እምጥበብ
  choice: o coração de todos eles se esquecerá da sabedoria
  rationale: Conserva tanto o coração coletivo no singular quanto a linguagem direta de esquecer a sabedoria, sem substituir a imagem por uma explicação.
- source_word: ባቲ የዓርግ ብእሲ
  choice: nela, um homem subirá
  rationale: “Subirá” retém o sentido básico de movimento ascendente e a possível nuance de exaltação, sem decidir entre ascensão, aparecimento ou elevação política.
- source_word: ቤተ መንግሥት
  choice: a casa do reino
  rationale: Tradução próxima da expressão ge'ez, preservando a possibilidade de referência a uma edificação, à casa real ou à ordem dinástica.
- source_word: ይውዒ ... በእሳት
  choice: será queimada pelo fogo
  rationale: Expressa claramente a imagem de destruição e juízo, mantendo a referência explícita ao fogo.
- source_word: ኵሉ ዘመደ ሥርወ ኀሩይ
  choice: toda a linhagem da raiz escolhida
  rationale: “Linhagem” comunica o elemento genealógico de ዘመደ, enquanto “raiz escolhida” preserva a metáfora vegetal e a linguagem de eleição.
theological_decisions:
- issue: Identidade do homem que subirá
  choice: Mantido genericamente como “um homem”, sem identificação.
  alternative: Um governante histórico, uma figura sacerdotal ou uma figura messiânica/exaltada.
  rationale: O ge'ez não nomeia a figura, e o versículo não permite resolver com segurança sua identidade.
- issue: Sentido de “casa do reino”
  choice: A expressão foi conservada literalmente.
  alternative: Casa real ou dinastia, palácio, ou templo ligado ao reino.
  rationale: Uma formulação mais específica eliminaria uma ambiguidade genuína da expressão de origem.
- issue: Referente da “raiz escolhida”
  choice: Preservada como metáfora coletiva de linhagem e eleição.
  alternative: Remanescente eleito, ramo escolhido ou raiz messiânica.
  rationale: O versículo evoca descendência e eleição, mas não identifica explicitamente a raiz com uma única pessoa ou com um referente canônico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo apocalíptico e as ambiguidades centrais do ge'ez sem acrescentar identificações históricas ou confessionais.
