base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/014.yaml
  text: As for the moon alone[c][b][a], its days come to one thousand and sixty-two days for three years and for five years.
translation:
  language: pt
  text: Quanto à lua por si só[c], seus dias totalizam mil e sessenta e dois dias em três anos e em cinco anos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão final, “e em cinco anos”, parece incompleta no testemunho geês fornecido; talvez falte nesta linha um número ou outra formulação.
    reason: textual_variant
  - marker: b
    text: Este versículo faz parte de um cálculo calendárico no Livro Astronômico; “seus dias totalizam” refere-se à soma do número de dias.
    reason: cultural_note
  - marker: c
    text: 'Ou: “Quanto ao mês isoladamente”. A palavra geês pode significar “lua” ou “mês”, mas o total de 1.062 dias corresponde a três anos lunares de 354 dias.'
    reason: translation_alternative
lexical_decisions:
- source_word: ለወርኅ
  choice: quanto à lua
  rationale: Embora ወርኅ possa significar “mês” ou “lua”, o total de 1.062 dias em três anos corresponde a três anos lunares de 354 dias; por isso, “lua” é a leitura contextual mais adequada.
- source_word: ለባሕቲቱ
  choice: por si só
  rationale: Conserva o sentido de “sozinha”, “isoladamente”, indicando que o cálculo considera apenas a lua.
- source_word: ይበጽሕ
  choice: totalizam
  rationale: Em uma declaração numérica, o verbo significa “alcançar” ou “somar”; “totalizam” é natural e preciso em português.
- source_word: መዋዕሊሁ
  choice: seus dias
  rationale: Traduz diretamente o plural “dias” com o sufixo possessivo referente à lua.
- source_word: ለ፫ዓም
  choice: em três anos
  rationale: “Em três anos” expressa de modo natural em português o período dentro do qual se obtém o total.
- source_word: ፲፻ ወ፷ወ፪ መዋዕለ
  choice: mil e sessenta e dois dias
  rationale: A sequência numérica é 1.000 + 60 + 2, seguida explicitamente por “dias”.
- source_word: ወለ፭ ዓም
  choice: e em cinco anos
  rationale: Reproduz sem complementação conjectural a segunda expressão temporal preservada no testemunho, embora a oração pareça incompleta.
theological_decisions:
- issue: Declaração astronômica/calendárica com oração final aparentemente incompleta ou corrompida
  choice: Traduzir de maneira conservadora as palavras preservadas e sinalizar em nota que a expressão sobre cinco anos parece incompleta.
  alternative: Suprir por emenda um total numérico para cinco anos ou reformular a frase como afirmação calendárica geral.
  rationale: A transparência textual é preferível a completar conjecturalmente um testemunho truncado ou corrompido.
translation_notes:
  register: Português moderno, claro e digno, com terminologia matemática acessível. A formulação preserva a estranheza da oração final em vez de ocultar a provável lacuna textual.
