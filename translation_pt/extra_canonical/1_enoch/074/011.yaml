base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/011.yaml
  text: And their excess for the sun and the stars comes to six days[a]; in five years, at six each, it amounts for them to thirty days[c][b], and the moon falls behind the sun and the stars by thirty days.
translation:
  language: pt
  text: E o excedente do sol e das estrelas chega a seis dias[a]; em cinco anos, à razão de seis por ano, chega a trinta dias, e a lua fica trinta dias atrás do sol e das estrelas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O cálculo do versículo é condensado: o sentido parece ser um excedente de seis dias em cada ano, totalizando trinta dias em cinco anos.'
    reason: cultural_note
  - marker: b
    text: A palavra traduzida por “lua” também pode significar “mês” em contextos calendáricos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምብጻሒሆሙ
  choice: o excedente
  rationale: Embora o substantivo derive da ideia de chegar ou completar, neste cálculo astronômico ele designa o total excedente acumulado pelo sol e pelas estrelas.
- source_word: ስሱ መዋዕለ
  choice: seis dias
  rationale: Tradução direta do numeral e da unidade calendárica.
- source_word: በበስሱ
  choice: à razão de seis por ano
  rationale: A forma distributiva indica seis em cada um dos cinco anos; explicitar “por ano” torna inteligível o cálculo sem alterar seu conteúdo.
- source_word: ይበጽሖሙ
  choice: chega a
  rationale: Preserva o sentido do verbo “alcançar, atingir”, usado aqui para o total de trinta dias.
- source_word: የሐፀፁ
  choice: fica ... atrás
  rationale: O verbo expressa ficar aquém, ser menor ou faltar, não uma retirada passiva; esta formulação é natural em contexto de ciclos calendáricos.
- source_word: ወርኅ
  choice: a lua
  rationale: O termo pode significar “lua” ou “mês”, mas o paralelo explícito com o sol e as estrelas favorece o astro.
theological_decisions:
- issue: Formulação astronômico-calendárica comprimida
  choice: Manter a sequência de seis dias por ano, trinta em cinco anos e a defasagem da lua
  alternative: Parafrasear tudo como discrepância entre anos solar e lunar
  rationale: A tradução torna o cálculo compreensível, mas conserva a estrutura e a terminologia dos luminares em vez de impor uma explicação calendárica moderna.
- issue: Sentido de ወርኅ
  choice: lua
  alternative: mês
  rationale: A menção conjunta ao sol e às estrelas favorece “lua”, embora a polissemia calendárica genuína seja registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A expressão “à razão de seis por ano” esclarece a força distributiva do ge'ez sem transformar o versículo numa paráfrase técnica.
