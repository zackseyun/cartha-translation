base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/002.yaml
  text: And all that Uriel[a], the holy angel who is their leader, showed me—I wrote down their positions as he showed them to me, and I wrote down their paths as they are[e][d][c][b], and I saw their lights until fifteen days were completed.
translation:
  language: pt
  text: Uriel, o santo anjo que é o guia de todos eles, mostrou-me tudo isso; escrevi suas posições conforme ele mas mostrou, e também seus meses[a], tal como são, e a aparência de suas luzes, até se completarem quinze dias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os períodos mensais correspondentes a eles. O ge’ez diz literalmente “seus meses”; algumas versões anteriores entenderam a palavra como “seus percursos” ou “seus caminhos”.
    reason: lexical_alternative
  - marker: b
    text: 'A construção final é condensada: os quinze dias podem delimitar a aparência das luzes descrita ou o período durante o qual ela foi registrada.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ኵሎዘ
  choice: tudo isso
  rationale: Representa a totalidade introduzida pela construção relativa e soa natural em português no contexto de uma enumeração já conhecida.
- source_word: አርአየኒ
  choice: me mostrou
  rationale: Mantém o sentido visual e demonstrativo do verbo sem acrescentar a carga teológica de “revelou”.
- source_word: መልአክ ቅዱስ
  choice: o santo anjo
  rationale: É a correspondência direta e tradicional do título etíope, em registro digno e corrente.
- source_word: መራሒሆሙ ለኵሎሙ
  choice: o guia de todos eles
  rationale: O substantivo designa quem conduz ou dirige; “guia” preserva essa função sem definir em excesso a natureza da autoridade exercida.
- source_word: ምንባሪሆሙ
  choice: suas posições
  rationale: No contexto astronômico, refere-se aos lugares ou estações ordenadas dos corpos celestes; “posições” é claro ao leitor moderno e evita o sentido doméstico de “moradas”.
- source_word: አውራኂሆሙ
  choice: seus meses
  rationale: A forma é o plural de “mês” com sufixo possessivo, e não um termo para caminhos ou percursos. A tradução segue aqui a morfologia do ge’ez, apesar da camada inglesa fornecida.
- source_word: በከመ ሀለዉ
  choice: tal como são
  rationale: Exprime correspondência com o estado ou a disposição efetiva dos referentes, sem explicar além do original.
- source_word: ርእየ ብርሃኖሙ
  choice: a aparência de suas luzes
  rationale: ርእየ é entendido como forma construta do substantivo “aparência/visão”, não como verbo na primeira pessoa “eu vi”; a expressão permanece ligada ao que foi anotado.
- source_word: እስከ ተፈጸመ ዐሡር ወኀሙስ መዋዕለ
  choice: até se completarem quinze dias
  rationale: Conserva tanto o limite temporal quanto a noção de cumprimento de um período completo.
theological_decisions:
- issue: Referente dos pronomes plurais
  choice: Manter “eles/suas” sem substituir os pronomes por “luminares” ou “corpos celestes”.
  alternative: Explicitar “os luminares” ou entender a referência como os seres angelicais associados a eles.
  rationale: O contexto do Livro Astronômico favorece os luminares, mas o versículo emprega pronomes. Mantê-los preserva a forma do texto e evita excluir à força outras nuances cosmológicas.
- issue: Função de Uriel
  choice: “guia de todos eles”
  alternative: “líder de todos eles”
  rationale: “Guia” expressa condução e supervisão sem importar uma estrutura hierárquica mais definida do que o termo exige.
- issue: Natureza de ርእየ
  choice: 'Substantivo: “a aparência”'
  alternative: 'Verbo: “eu vi”'
  rationale: A forma ge’ez é mais bem analisada como estado construto do substantivo ርእይ. A primeira pessoa verbal esperada teria outra forma; por isso, a oração descreve mais um elemento anotado, não um novo ato de visão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “posições” reflete a repetição do ge’ez, enquanto a pontuação organiza a sintaxe longa. “Anotei também” explicita apenas a continuidade sintática do segundo verbo “escrevi”, sem acrescentar conteúdo interpretativo.
