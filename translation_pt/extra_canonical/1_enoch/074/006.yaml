base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/006.yaml
  text: For seven days it goes out and turns about[a], and it returns again through the gate from which the sun goes out; and it completes all its light, and it withdraws from the sun[d][c][b], and it enters for eight days through the sixth gate from which the sun goes out.
translation:
  language: pt
  text: Durante sete dias, sai e dá a volta, e retorna pela porta da qual o sol sai; completa toda a sua luz[c] e se afasta do sol[b], e, durante oito dias, entra pela sexta porta da qual o sol sai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O sujeito não é expresso neste versículo. Pelo contexto, provavelmente se trata da lua, mas o texto principal mantém o sujeito implícito, sem acrescentar um substantivo ou pronome.
    reason: alternative_reading
  - marker: c
    text: A expressão “completa toda a sua luz” é um tanto técnica e pode indicar que o astro alcança a medida plena de sua luminosidade antes de mudar seu percurso.
    reason: cultural_note
lexical_decisions:
- source_word: ይወፅእ
  choice: sai
  rationale: Verbo básico de movimento para fora; mantém a fórmula astronômica repetida sem explicitar além da fonte o sujeito implícito.
- source_word: ሰብዓተ መዋዕለ
  choice: durante sete dias
  rationale: Expressa de maneira natural em português a duração indicada pela construção temporal.
- source_word: የአውድ
  choice: dá a volta
  rationale: Comunica o movimento de girar ou cumprir um circuito em linguagem atual, sem impor uma descrição técnica mais específica.
- source_word: ይገብእ ካዕበ
  choice: retorna
  rationale: No encadeamento de saída, circuito e reentrada, o verbo com o sentido de repetição indica movimento de volta; 'retorna' já incorpora naturalmente essa ideia em português.
- source_word: በኆኅት
  choice: pela porta
  rationale: ኆኅት designa porta ou portal na arquitetura cosmológica do texto. 'Porta' é clara e mantém consistência com a sexta porta mencionada depois.
- source_word: ወይፌጽም ኵሎ ብርሃኖ
  choice: completa toda a sua luz
  rationale: Preserva a formulação processual e algo técnica, que pode indicar que o astro alcança a medida plena de sua luminosidade.
- source_word: ወይፀንን እምፀሐይ
  choice: se afasta do sol
  rationale: Expressa separação em relação ao sol sem acrescentar uma explicação cosmológica não declarada.
- source_word: ስሙነ መዋዕለ
  choice: durante oito dias
  rationale: Trata a expressão como indicação de duração, paralela à referência anterior aos sete dias.
- source_word: በሳድስት ኆኅት
  choice: pela sexta porta
  rationale: Reproduz o ordinal e o termo cosmológico com consistência interna.
theological_decisions:
- issue: Identidade do sujeito em movimento
  choice: Empregar o pronome masculino 'ele', sem inserir o substantivo 'lua'.
  alternative: Explicitar 'a lua' ao longo do versículo.
  rationale: O contexto provavelmente se refere à lua, mas o versículo apresenta verbos na terceira pessoa sem repetir um substantivo. O pronome preserva o caráter implícito do antecedente; o masculino decorre da gramática portuguesa para um possível 'astro' ou 'luminar' e não identifica por si só o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o encadeamento astronômico do ge'ez e sua ambiguidade quanto ao sujeito. Foram omitidas notas inglesas superadas ou redundantes sobre 'janela' e uma versão anterior; por isso, os marcadores mantidos são [b] e [c], ambos presentes no texto principal.
