base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/012.yaml
  text: And the sun and the stars bring in all the years exactly[a]; according to their stations forever, they do not advance or fall behind by a single day, but they complete the year in righteousness, exactly[d][c][b], in three hundred and sixty-four days.
translation:
  language: pt
  text: O sol e as estrelas fazem chegar todos os anos com exatidão[a]; segundo suas posições, para sempre[b], não se adiantam nem se atrasam um só dia, mas fazem passar o ano em justiça[d] e com exatidão, em trezentos e sessenta e quatro dias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com precisão”. O termo ge''ez ressalta o cuidado exato na contagem dos anos.'
    reason: lexical_alternative
  - marker: b
    text: “Posições” também pode ser entendido como “moradas”. A expressão “para sempre” pode qualificar essas posições ou a afirmação seguinte de que os luminares não se adiantam nem se atrasam.
    reason: ambiguity
  - marker: c
    text: 'Ou, conforme o sentido contextual do ciclo anual: “completam o ano”. O verbo ge''ez pode referir-se à mudança ou à passagem do ano.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “corretamente” ou “de modo devido”. O texto emprega, porém, o termo forte para “justiça”.'
    reason: theological_tension
lexical_decisions:
- source_word: ያመጽእሙ፡ ለዓመታት
  choice: fazem chegar todos os anos
  rationale: Preserva a imagem causativa e concreta de trazer ou fazer chegar os anos, sem reduzi-la ao sentido abstrato de apenas marcá-los.
- source_word: ጥንቁቃት / ጥንቁቀ
  choice: com exatidão / e exatidão
  rationale: O termo comunica cuidado e precisão; no contexto calendárico, “exatidão” expressa isso com clareza e naturalidade.
- source_word: ከመ፡ ምንባሪሆሙ፡ ለዓለም
  choice: segundo suas posições, para sempre
  rationale: Mantém o substantivo “posições” anteriormente omitido e traduz ከመ como “segundo”. A pontuação conserva alguma abertura quanto à ligação de “para sempre” com as posições ou com a ausência de desvio.
- source_word: ኢይበድሩ፡ ወኢይጐንዱ
  choice: não se adiantam nem se atrasam
  rationale: Forma um par temporal natural em português e comunica que os luminares não se desviam do calendário estabelecido.
- source_word: አሐተ፡ ዕለተ
  choice: um só dia
  rationale: Expressa enfaticamente a menor medida de desvio mencionada no texto.
- source_word: ይዌልጡ፡ ዓመተ
  choice: fazem mudar o ano
  rationale: Conserva o sentido lexical de ወለጠ, “mudar, alterar, fazer passar”, em vez de substituí-lo silenciosamente por “completar”; a nota registra a leitura contextual mais fluente.
- source_word: በጽድቅ
  choice: com justiça
  rationale: Preserva o peso moral e teológico do termo, embora o contexto também permita entendê-lo adverbialmente como “corretamente”.
- source_word: ፫፻ወ፷ወረቡዕ፡ መዋዕለ
  choice: trezentos e sessenta e quatro dias
  rationale: Reproduz por extenso e com clareza o número central para o calendário desta seção.
theological_decisions:
- issue: Se በጽድቅ deve ser reduzido a uma expressão técnica de correção calendárica
  choice: com justiça
  alternative: corretamente / de modo devido
  rationale: A escolha mantém a ligação entre ordem cósmica e justiça, sem negar na nota o possível valor adverbial e técnico no contexto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe legível tanto no Brasil quanto em outros contextos lusófonos. “Fazem mudar o ano” é deliberadamente menos idiomático que “completam o ano” para conservar a escolha lexical específica do ge'ez; a nota oferece a leitura contextual.
