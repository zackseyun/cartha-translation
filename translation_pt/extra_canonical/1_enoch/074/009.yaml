base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/009.yaml
  text: 'Thus I saw their workings: how the moon rises and the sun sets in those days[a][b].'
translation:
  language: pt
  text: 'Assim vi suas operações: como as luas[a] nascem e o sol se põe naqueles dias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo ge’ez está no plural e também pode significar “meses”. “As luas” preserva a forma do texto; no contexto, pode referir-se à lua em seus ciclos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ከመዝ
  choice: Assim
  rationale: Mantém a força resumitiva ou inferencial da expressão que introduz a observação visionária.
- source_word: ርኢኩ
  choice: vi
  rationale: Tradução direta do verbo de visão na primeira pessoa, em linguagem simples e digna.
- source_word: ምግባሮሙ
  choice: seu funcionamento
  rationale: No contexto astronômico, refere-se à operação ou ao movimento dos luminares, não a atos morais; o singular coletivo é natural em português.
- source_word: በከመ
  choice: como
  rationale: Introduz naturalmente o conteúdo daquilo que foi visto.
- source_word: ይሠርቅ
  choice: nasce
  rationale: A raiz com ś é o verbo usado para o nascer de um astro, não o verbo semelhante que significa furtar ou retirar-se.
- source_word: አውራኅ
  choice: a lua
  rationale: A forma é morfologicamente plural e pode designar luas ou meses, mas neste paralelismo com o sol descreve a lua em seus ciclos; o singular genérico é natural em português, com a forma plural registrada em nota.
- source_word: የዓርብ
  choice: se põe
  rationale: Expressão portuguesa corrente e exata para o movimento vespertino do sol.
- source_word: ፀሐይ
  choice: o sol
  rationale: Equivalente direto do luminar mencionado no texto.
- source_word: በእማንቱ መዋዕል
  choice: naqueles dias
  rationale: Preserva a referência temporal ao período do esquema celeste em discussão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia astronômica comum. A construção preserva o paralelismo entre o nascer da lua e o pôr do sol, sem reproduzir a leitura lexical anterior de “caminhos que se retiram”.
