base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/005.yaml
  text: For two months it sets with the sun in these two middle portals[c][b][a], in the third and in the fourth portal.
translation:
  language: pt
  text: 'Por dois meses[a], ele se põe com o sol[b] nestes dois portais centrais: no terceiro e no quarto portal[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Durante dois meses”.'
    reason: alternative_reading
  - marker: b
    text: A expressão do original é literalmente “com o sol” e pode indicar que os dois luminares se põem em associação temporal.
    reason: ambiguity
  - marker: c
    text: O termo também pode ser traduzido como “porta” ou “portão”; aqui descreve os acessos celestes do esquema astronômico.
    reason: lexical_alternative
lexical_decisions:
- source_word: በክልኤ፡ ወርኅ
  choice: Por dois meses
  rationale: ክልኤ é o cardinal “dois”, não o ordinal “segundo”; com በ, a expressão indica duração temporal.
- source_word: የዓርብ
  choice: ele se põe
  rationale: Forma verbal masculina singular, no imperfeito, do verbo “pôr-se/declinar”, adequada ao movimento de um luminar.
- source_word: ምስለ፡ ፀሐይ
  choice: com o sol
  rationale: Reproduz de modo direto a preposição ምስለ (“com”) e mantém a relação astronômica compacta do original.
- source_word: በእሉ፡ ክልኤ፡ ኆዋኅው፡ እለ፡ ማእከል
  choice: nestes dois portais centrais
  rationale: ኆኅት, com o plural ኆዋኅው, designa porta, portão ou portal; “portais” preserva a imagem arquitetônica celeste, e ማእከል indica a posição central.
- source_word: በሣልስት፡ ወበራብዕት፡ ኆኅት
  choice: no terceiro e no quarto portal
  rationale: Os ordinais identificam os dois portais centrais. A formulação portuguesa conserva a repetição de “portal” e a numeração espacial.
theological_decisions:
- issue: Natureza das aberturas celestes
  choice: portais concretos no esquema astronômico-apocalíptico
  alternative: portas, portões ou aberturas celestes
  rationale: “Portais” mantém a representação arquitetônica do cosmos sem convertê-la em terminologia astronômica moderna nem exigir uma interpretação estritamente material.
- issue: Referente do sujeito verbal implícito
  choice: pronome “ele”, sem identificar o luminar no próprio versículo
  alternative: explicitar “a lua” com base no contexto precedente
  rationale: A forma verbal traz sujeito masculino singular, mas o nome não aparece nesta linha. O pronome preserva a dependência contextual e evita inserir no texto uma identificação não expressa no versículo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa. O dois-pontos explicita que o terceiro e o quarto são os dois portais centrais, sem alterar a estrutura conceitual. Evitou-se “janelas”, pois o substantivo ge'ez empregado significa porta, portão ou portal.
