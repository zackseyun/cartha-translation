base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/001.yaml
  text: 'And I saw for it another course and regulation: by that regulation it makes its course of the months[a][b][c].'
translation:
  language: pt
  text: 'E vi para ele outro curso e uma ordenação: segundo essa ordenação, ele cumpre o seu curso dos meses.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “decreto” ou “ordem”; o termo ge’ez designa uma disposição dotada de autoridade.
    reason: lexical_alternative
  - marker: b
    text: A expressão final também pode ser entendida como “seu curso mensal”. O termo traduzido por “meses” pode, em contexto lunar, evocar as luas ou os ciclos da lua.
    reason: textual_variant
lexical_decisions:
- source_word: ካልአ
  choice: outro
  rationale: Introduz um percurso adicional na sequência das disposições cósmicas reveladas.
- source_word: ምሕዋረ / ምሕዋሮ
  choice: percurso / seu percurso
  rationale: Expressa o movimento ordenado ou circuito do astro sem impor terminologia astronômica moderna.
- source_word: ትእዛዘ / ትእዛዝ
  choice: ordenação
  rationale: No contexto cosmológico, indica uma disposição normativa e fixa; evita o sentido predominantemente administrativo de “regulamento” e o sentido moral mais imediato de “mandamento”.
- source_word: ርኢኩ
  choice: vi
  rationale: Reproduz de modo direto a fórmula de relato visionário.
- source_word: ሎቱ
  choice: para ele
  rationale: Mantém a referência pronominal ao corpo celeste mencionado no contexto, sem especificá-lo além do texto deste versículo.
- source_word: በውእቱ ትእዛዝ
  choice: por essa ordenação
  rationale: 'Preserva o valor instrumental da expressão: o percurso é realizado sob a ação ou segundo a norma dessa ordenação.'
- source_word: ይገብር
  choice: realiza
  rationale: Conserva a força ativa do verbo, que descreve o cumprimento ou a execução do percurso.
- source_word: ዘአውራኅ
  choice: dos meses
  rationale: አውራኅ é o plural de “mês” e, neste contexto do calendário lunar, designa os meses; não significa “ventos”.
theological_decisions:
- issue: Natureza da linguagem de ordem cósmica
  choice: Uma ordenação fixa governa o movimento do corpo celeste.
  alternative: Um mandamento direto dirigido pessoalmente ao astro.
  rationale: O contexto descreve os movimentos regulares da criação. “Ordenação” conserva a ideia de autoridade sem transformar necessariamente a expressão em uma ordem moral ou fala direta.
- issue: Agência do referente pronominal
  choice: Manter “ele realiza” sem explicar se a agência é pessoal, poética ou meramente cosmológica.
  alternative: Substituir por uma formulação impessoal, como “seu percurso ocorre”.
  rationale: O verbo fonte é ativo; a tradução preserva essa forma e não resolve a possível personificação do astro.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “ordenação” e “percurso” foi mantida para refletir o estilo técnico e reiterativo do texto astronômico. A construção incomum “percurso dos meses” conserva a relação genitiva do ge’ez, enquanto a nota oferece a leitura portuguesa mais idiomática.
