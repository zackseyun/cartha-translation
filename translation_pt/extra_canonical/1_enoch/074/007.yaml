base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/007.yaml
  text: And when the sun goes out from the fourth gate[a], it goes out for seven days, until it goes out from the fifth; and again it returns for seven days through the fourth gate, and completes all its light[c][b], and it withdraws and enters through the first gate for eight days.
translation:
  language: pt
  text: E, quando o sol sai pela quarta porta, sai durante sete dias, até sair pela quinta[a]. Novamente, retorna pela quarta porta durante sete dias[c], completa toda a sua luz[b], recolhe-se e entra pela primeira porta durante oito dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope não repete aqui explicitamente a palavra “porta”; pelo padrão do contexto, trata-se quase certamente da quinta porta.
    reason: lexical_alternative
  - marker: b
    text: “Completa toda a sua luz” traduz de perto a expressão etíope. Provavelmente indica que, nessa fase do ciclo, o sol alcança a medida plena de sua luminosidade.
    reason: cultural_note
  - marker: c
    text: 'Ou: “até a quarta porta”. A preposição também pode indicar destino, embora “pela quarta porta” represente melhor o trânsito descrito neste contexto.'
    reason: previous_rendering
lexical_decisions:
- source_word: ፀሐይ
  choice: o sol
  rationale: É o referente astronômico direto; o artigo definido é natural em português.
- source_word: ይወፅእ
  choice: sai
  rationale: Conserva a fórmula reiterada de movimento e a imagem do astro que sai por uma porta.
- source_word: እምራብዕት ኆኅት
  choice: pela quarta porta
  rationale: A preposição indica procedência ou percurso, e “porta” preserva a arquitetura cósmica concreta do texto.
- source_word: ሰቡዐ መዋዕለ
  choice: por sete dias
  rationale: Expressa naturalmente a duração temporal na sequência dos movimentos solares.
- source_word: እስከ ይወፅእ እምነ ኃምስት
  choice: até sair pela quinta
  rationale: Preserva a elipse do substantivo “porta” no texto etíope, embora o referente seja claro pelo contexto.
- source_word: ካዕበ
  choice: depois
  rationale: Marca com naturalidade a etapa seguinte e a reversão do percurso; o sentido também admite “novamente”.
- source_word: ይገብእ
  choice: retorna
  rationale: Indica a volta do sol no percurso cíclico para uma porta anterior.
- source_word: በኆኅት ራብዕ
  choice: pela quarta porta
  rationale: A preposição በ favorece aqui a ideia de trânsito por ou através da porta, não simplesmente de movimento até ela.
- source_word: ይፌጽም ኵሎ ብርሃኖ
  choice: completa toda a sua luz
  rationale: Mantém de perto a expressão esquemática do original sem explicá-la como “atinge seu brilho máximo”.
- source_word: ይደንን
  choice: recolhe-se
  rationale: Expressa o recuo do sol antes de sua entrada, preservando a imagem de movimento sem impor a ideia mais específica de ocultação completa.
- source_word: ይበውእ በቀዳሚት ኆኅት
  choice: entra pela primeira porta
  rationale: Equilibra o movimento de saída anterior e mantém a preposição como percurso através da porta.
- source_word: ስሙነ መዋዕለ
  choice: durante oito dias
  rationale: Indica a duração da etapa final do ciclo em português corrente.
theological_decisions:
- issue: Imagem astronômico-cósmica das portas
  choice: Manter literalmente as “portas” pelas quais o sol sai e entra.
  alternative: Substituir por “portais”, “pontos do horizonte” ou “estações”.
  rationale: A seção descreve um cosmos estruturado em que os luminares transitam por portas. Preservar essa imagem respeita a cosmologia apocalíptica do texto sem adaptá-la à astronomia moderna.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição de “sair” e a linguagem concreta das portas foram mantidas por serem estruturais ao relato astronômico; “continua saindo” torna idiomática a duração sem apagar a repetição do original.
