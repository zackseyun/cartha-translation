base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/004.yaml
  text: And in certain months it changes its settings[a], and in certain months it travels its course[d][c][b], one by one.
translation:
  language: pt
  text: E em certos meses ele muda os seus lugares de ocaso[a], e em certos meses percorre o seu curso[b], um a um[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seus pontos de ocaso». A expressão está no plural e se refere aos diferentes lugares onde o astro se põe.'
    reason: lexical_alternative
  - marker: b
    text: Neste contexto astronômico, «curso» é o trajeto regular do luminar.
    reason: cultural_note
  - marker: c
    text: 'Literalmente, há repetição de «um»: «um, um», com provável sentido distributivo, isto é, «um a um» ou «cada um separadamente».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አውራኅ
  choice: meses
  rationale: Forma plural relacionada a «mês»; a expressão በአውራኅ እመራት indica «em certos meses», conforme a correção lexical sustentada pelo léxico de Dillmann.
- source_word: እመራት
  choice: certos
  rationale: Qualifica «meses» com o sentido de determinados ou designados, não de «orientais».
- source_word: ይዌልጥ
  choice: muda
  rationale: O verbo deriva de ወለጠ, «mudar, alterar», e rege aqui o objeto «lugares de ocaso».
- source_word: ምዕራባተ
  choice: lugares de ocaso
  rationale: O plural designa os pontos ou lugares onde o astro se põe. «Lugares de ocaso» preserva a pluralidade e evita confundi-lo com o advérbio «para o oeste».
- source_word: የሐውር
  choice: percorre
  rationale: Expressa movimento ordenado; em português, «percorre» combina naturalmente com «curso».
- source_word: ምሕዋሪሁ
  choice: o seu curso
  rationale: No contexto astronômico, refere-se ao trajeto regular do luminar, e não apenas a movimento genérico.
- source_word: አሐዱ፡ አሐዱ
  choice: um a um
  rationale: A repetição tem força distributiva. «Um a um» é natural em português e conserva a ideia de sucessão sem especificar além do que o texto permite.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A tradução segue a reavaliação lexical do ge'ez e não reproduz as antigas análises equivocadas de አውራኅ como «caminhos» nem de እመራት como «do leste». O referente implícito masculino foi mantido como «ele» para conservar a continuidade do discurso astronômico.
