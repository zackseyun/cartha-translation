  text: And again[a], it returns for seven days to the fourth gate[c][b], from which the sun comes out.
translation:
  language: pt
  text: E novamente, durante sete dias ele retorna à quarta porta[a], da qual sai o sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “pela quarta porta” ou “através da quarta porta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: novamente
  rationale: Marca a continuação repetitiva da sequência dos movimentos do astro.
- source_word: ይገብእ
  choice: ele retorna
  rationale: O verbo, aqui entendido no sentido de voltar ou retornar, retrata o movimento cíclico; o pronome retoma implicitamente o sol em seu percurso.
- source_word: ሰቡዐ መዋዕለ
  choice: durante sete dias
  rationale: Expressa com naturalidade a duração exata indicada pelo texto.
- source_word: በራብዕት ኆኅት
  choice: à quarta porta
  rationale: Representa o movimento dirigido à porta sem impor a ideia mais específica de passagem através dela; a preposição ge'ez admite alguma amplitude contextual.
- source_word: እንተ እምኔሃ
  choice: da qual
  rationale: Retoma claramente a quarta porta como o ponto de onde ocorre a saída.
- source_word: ይወፅእ ፀሐይ
  choice: o sol sai
  rationale: Preserva de modo direto e concreto a imagem do sol saindo da porta celeste.
