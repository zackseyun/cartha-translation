base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/013.yaml
  text: For three years there are one thousand ninety-two days[a], and for five years, one thousand eight hundred twenty days and eight; thus for eight years there are two thousand nine hundred twelve days, and ten and two days.
translation:
  language: pt
  text: Por três anos, há mil e noventa e dois dias[a]; e, por cinco anos, mil oitocentos e vinte dias e oito. Assim, por oito anos, há dois mil novecentos e doze dias, e dez e dois dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha etíope deste testemunho obtido por OCR é numericamente difícil. O versículo parece somar os dias correspondentes a períodos de três, cinco e oito anos, mas a redação final talvez preserve um numeral dividido ou disposto em ordem incomum. Uma tradução regularizada seria: “Por três anos, 1.092 dias; por cinco anos, 1.828 dias; assim, por oito anos, 2.912 dias.”'
    reason: textual_variant
lexical_decisions:
- source_word: ለ፫ዓም
  choice: por três anos
  rationale: A preposição ለ com a expressão temporal introduz aqui o total correspondente a um período, no contexto de cálculo astronômico.
- source_word: መዋዕለ
  choice: dias
  rationale: É o termo comum para “dias” e funciona neste capítulo como unidade de contagem calendárica.
- source_word: ፲፻ወ፺ወክልኤ
  choice: mil e noventa e dois
  rationale: 'A sequência numeral é lida aditivamente: 1000 + 90 + 2.'
- source_word: ወለ፭ዓመት
  choice: e, por cinco anos
  rationale: Mantém o mesmo padrão de cálculo temporal da oração anterior.
- source_word: ፲ወ፰፻፳መዋዕለ፡ ወ፰
  choice: mil oitocentos e vinte dias e oito
  rationale: O testemunho apresentado põe “dias” antes do oito final. A tradução conserva essa estrutura aditiva e incomum, em vez de normalizá-la silenciosamente como 1.828 dias.
- source_word: ከመ፡ ይኩን
  choice: assim ... há
  rationale: No contexto, assinala o total resultante dos cálculos anteriores.
- source_word: ለ፰ዓመት
  choice: por oito anos
  rationale: Prossegue a apresentação dos totais relativos a períodos determinados.
- source_word: ፪ወ፱፻፲፪
  choice: dois mil novecentos e doze
  rationale: A sequência numeral é entendida aditivamente como 2000 + 900 + 12.
- source_word: ወዓሡር፡ ወስኑይ፡ መዋዕለ
  choice: e dez e dois dias
  rationale: A formulação explicita dez e dois separadamente. Embora numericamente difícil, ela é preservada para tornar transparente o teor do testemunho.
theological_decisions:
- issue: Aritmética calendárica em uma linha etíope de transmissão difícil
  choice: Preservar a sequência de totais para três, cinco e oito anos, incluindo a formulação aditiva incomum no fim.
  alternative: Regularizar o texto como “1.092 dias; 1.828 dias; portanto, 2.912 dias”, eliminando a expressão final.
  rationale: Não se trata de uma questão doutrinária, mas de transparência textual. Como a passagem depende de números precisos e o testemunho fornecido é difícil, a tradução não deve ocultar o problema por harmonização silenciosa.
