base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/003.yaml
  text: In fifteen parts it completes all its light in the east[b][a], and in fifteen parts it completes all its darkness in the west.
translation:
  language: pt
  text: Em quinze partes[a], ela completa toda a sua luz no leste e, em quinze partes, completa toda a sua escuridão no oeste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A leitura do numeral na transcrição é incerta por causa de provável erro de OCR. O contexto astronômico favorece «quinze partes»; literalmente, «quinze mãos» ou «porções».
    reason: textual_variant
  - marker: b
    text: Uma leitura anterior entendia a expressão como «em cinquenta e sete dias», mas isso provavelmente resulta de leitura equivocada tanto do numeral quanto de እደ, «partes».
    reason: previous_rendering
lexical_decisions:
- source_word: በ፭*፷፯ እደ
  choice: em quinze partes
  rationale: A transcrição numérica parece corrompida por OCR. O contexto do cálculo lunar em 1 Enoque favorece ፲፭, «quinze», e እደ designa partes ou porções (literalmente, «mãos»), não dias.
- source_word: ይፌጽም
  choice: completa
  rationale: A forma é mantida em sentido ativo e completivo, de acordo com a repetição técnica da descrição astronômica.
- source_word: ኵሎ ብርሃኖ
  choice: toda a sua luz
  rationale: Preserva tanto a ideia de totalidade quanto o sufixo possessivo do texto ge'ez.
- source_word: በሠርቅ
  choice: no leste
  rationale: Expressa naturalmente o valor locativo no contexto do aparecimento do astro.
- source_word: ኵሎ ጽልመተ
  choice: toda a sua escuridão
  rationale: Mantém o paralelismo concreto entre luz e escuridão, sem reinterpretá-lo como grau de brilho.
- source_word: በምዕራብ
  choice: no oeste
  rationale: Preserva o sentido locativo e a simetria entre leste e oeste.
theological_decisions:
- issue: Se a fórmula de conclusão deve ser explicada em linguagem astronômica mais interpretativa
  choice: Manter «completa» nas duas orações
  alternative: «atinge o brilho pleno ... fica totalmente escura» ou «completa seu curso de luz ... de escuridão»
  rationale: A redação literal conserva o caráter esquemático do Livro Astronômico e evita identificar com excessiva precisão o fenômeno descrito.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima do ge'ez. O pronome feminino «ela» pressupõe o astro feminino no contexto imediato, sem explicitar «lua» dentro deste versículo.
