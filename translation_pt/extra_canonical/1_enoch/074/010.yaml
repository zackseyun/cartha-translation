base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/010.yaml
  text: And five days are added[a], and for the sun it reaches thirty days; and all the days that accrue to it for one of those five years, when completed[c][b], amount to three hundred and sixty-four days.
translation:
  language: pt
  text: E acrescentam-se cinco dias[a], e, quanto ao sol, o total chega a trinta dias; todos os dias que lhe correspondem em cada um daqueles cinco anos, quando cada um deles se completa[c], totalizam trezentos e sessenta e quatro dias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto etíope é difícil neste ponto e traz uma forma que normalmente significa “anos”. Pelo contexto do cálculo e pelo total de 364 dias, entende-se aqui “cinco dias” suplementares; outra leitura possível é: “E acrescentam-se cinco anos”.'
    reason: textual_variant
  - marker: b
    text: Compare o esquema mais amplo do Livro Astronômico, no qual o ano é organizado em 364 dias, e não segundo um cômputo lunar.
    reason: cross_reference
  - marker: c
    text: 'A construção etíope e os numerais transmitidos neste trecho são pouco claros. Mais literalmente: “todos os dias que chegam para o ano, quando se completa um daqueles cinco anos, são 364 dias”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ይትዌሰክ
  choice: acrescentam-se
  rationale: Preserva o sentido passivo de adição no contexto do cálculo do calendário.
- source_word: ኃምስቱ ዓመት
  choice: cinco dias
  rationale: Embora a forma transmitida ዓመት normalmente signifique “ano”, o contexto do cálculo e o total final favorecem a referência a dias suplementares; a dificuldade textual é explicitada em nota.
- source_word: ለፀሐይ
  choice: para o sol
  rationale: Mantém a formulação astronômica e a relação expressa pela preposição geʽez sem explicá-la em excesso.
- source_word: ሠላሳ መዋዕለ
  choice: trinta dias
  rationale: É a expressão calendárica direta e natural em português.
- source_word: ኵሎሙ መዋዕለ ይበጽሕዎ ለዓመት
  choice: todos os dias que lhe cabem ... totalizam
  rationale: O verbo comunica a ideia de chegar a uma soma; “totalizam” conserva com clareza sua força numérica.
- source_word: ፭እምእሉኩ ፭ዓመት ተመሊኦሙ
  choice: em um daqueles cinco anos, quando se completam
  rationale: Segue a leitura contextual indicada pela revisão textual, que entende o primeiro numeral como “um”, e conserva a construção difícil em vez de lhe impor uma explicação não expressa.
- source_word: ፻፷ወ፰ወረቡዐ መዋዕለ
  choice: trezentos e sessenta e quatro dias
  rationale: O total numérico é explícito e central para o esquema calendárico do Livro Astronômico.
theological_decisions:
- issue: Natureza dos cinco elementos acrescentados
  choice: Cinco dias suplementares entram no cálculo relacionado ao ciclo de cinco anos e ao ano de 364 dias.
  alternative: Ler literalmente “cinco anos são acrescentados”.
  rationale: A forma “anos” está presente no texto fornecido, mas a sequência calendárica e o total anual tornam “cinco dias” a leitura contextual mais plausível. Como a transmissão é difícil, a alternativa é registrada em nota, sem transformar uma decisão textual em afirmação doutrinária.
- issue: Relação com o calendário de 364 dias
  choice: Apresentar o total como parte do esquema calendárico do texto.
  alternative: Harmonizar o cálculo com um calendário lunar ou com o calendário civil moderno.
  rationale: A tradução deve conservar a cosmologia calendárica própria da obra, sem harmonização externa.
translation_notes:
  register: Português atual, digno e acessível, com terminologia calendárica comum. “A conta chega” torna natural a expressão numérica, enquanto as notas preservam a dificuldade real da transmissão etíope e evitam uma falsa certeza.
