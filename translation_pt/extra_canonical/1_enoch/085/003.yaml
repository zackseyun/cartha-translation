base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/003.yaml
  text: Before I took your mother Edna[a], I saw in a vision on my bed, and behold, a bull came up from the earth; and that bull was white. And after it there came out one heifer, and with her came out two bulls[c][b], and one of them was black and one red.
translation:
  language: pt
  text: Antes de tomar Edna — sua mãe —, vi uma visão enquanto dormia.[a] Eis que um touro saiu da terra, e esse touro era branco. Depois dele saiu uma novilha, e com ela saíram dois touros;[b] um deles era preto, e o outro, vermelho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “vi numa visão do meu leito”.
    reason: lexical_alternative
  - marker: b
    text: As figuras animais são simbólicas no conjunto das Visões dos Sonhos; a tradução conserva os termos da própria visão sem identificar aqui quem elas representam.
    reason: cultural_note
lexical_decisions:
- source_word: እንበለ፡ እንሥአ፡ ለአምክ፡ ኤድና
  choice: Antes de tomar Edna, sua mãe
  rationale: Mantém a cláusula temporal e o verbo amplo “tomar”, sem explicitar no texto principal uma relação matrimonial além do que a expressão afirma diretamente.
- source_word: ርኢኩ፡ በራእየ፡ ምስካብየ
  choice: vi uma visão enquanto dormia
  rationale: Preserva tanto o ato de ver quanto o caráter visionário e o contexto de sono, em português natural.
- source_word: ላህም
  choice: touro
  rationale: Conserva a figura bovina masculina e o contraste com a fêmea mencionada em seguida.
- source_word: ወፅአ፡ እምድር
  choice: saiu da terra
  rationale: Expressa diretamente o movimento de emergência a partir da terra sem acrescentar interpretação.
- source_word: ጸዓዳ
  choice: branco
  rationale: Tradução simples e direta do termo cromático, importante para o simbolismo da visão.
- source_word: ጣዕዋ፡ እንስቲያት፡ አሐቲ
  choice: uma novilha
  rationale: Representa de modo conciso um único bovino feminino jovem e mantém a distinção sexual da imagem.
- source_word: ወምስሌሃ፡ ወፅኡ፡ ክልኤቱ፡ ጣዕዋ
  choice: e com ela saíram dois touros
  rationale: Mantém a associação sintática dos dois animais com a novilha e a sequência do aparecimento.
- source_word: ጸሊመ
  choice: preto
  rationale: Preserva de maneira transparente o contraste cromático da narrativa.
- source_word: ቀይሐ
  choice: vermelho
  rationale: Mantém a cor de forma direta, sem atenuar seu valor simbólico.
theological_decisions:
- issue: Simbolismo animal nas Visões dos Sonhos
  choice: Manter os animais como animais no texto da visão
  alternative: Substituir os animais por identificações humanas interpretativas
  rationale: A passagem comunica por meio de uma sequência simbólica sustentada. Identificar as figuras no texto principal eliminaria a retórica própria da visão e imporia uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa fluente. “Eis que” preserva o sinal visionário enfático; “novilha” e “touro” mantêm a imagética bovina e as distinções de sexo presentes no relato.
