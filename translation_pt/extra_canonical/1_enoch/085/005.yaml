lexical_decisions:
- source_word: ወዝኩ
  choice: E aquela
  rationale: A expressão é demonstrativa, «e aquela», e não uma fórmula de percepção como «e eu vi».
- source_word: ጸሊም
  choice: preta
  rationale: Preserva de modo direto a cor do animal e sua função na imagem simbólica da visão.
- source_word: ጣዕዋ
  choice: novilha
  rationale: Designa um bovino jovem; «novilha» concorda com a forma verbal feminina posterior e mantém a imagem específica.
- source_word: ላህቀ
  choice: cresceu
  rationale: É uma forma verbal com o sentido de crescer ou tornar-se grande, não um demonstrativo.
- source_word: ወመጽአት
  choice: e veio
  rationale: A forma verbal está na terceira pessoa do singular feminino; em português, a concordância já é indicada por «novilha», sem necessidade de acrescentar o pronome «ela».
theological_decisions:
- issue: Imagem animal simbólica no Apocalipse dos Animais
  choice: Manter a imagem concreta da «novilha preta» sem identificar seu referente histórico no texto traduzido.
  alternative: Substituir o animal por uma nação, personagem ou outro referente interpretativo.
  rationale: A tradução deve conservar a linguagem da visão e deixar sua identificação histórica ou teológica para o comentário.
translation_notes:
  register: Português moderno, claro e digno, com estrutura breve para reproduzir a sequência concisa do ge'ez. Preferiu-se «preta» a «negra» por ser a designação mais direta da cor do animal neste contexto.
