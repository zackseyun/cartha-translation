base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/002.yaml
  text: 'And Enoch lifted up his voice and said to his son Methuselah[a], “To you I speak, my son: hear my words, and incline your ear to the vision of your father’s dream.”'
translation:
  language: pt
  text: 'E Enoque ergueu a voz e disse a seu filho Matusalém: “É a você que falo, meu filho: ouça minhas palavras e incline o ouvido à visão do sonho de teu pai[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à visão de um sonho”. A expressão em ge'ez reúne linguagem de visão e de sonho.
    reason: Registra a ambiguidade lexical e sintática da expressão original, sem reduzir sua dimensão visionária a um sonho comum.
lexical_decisions:
- source_word: አንሥአ
  choice: ergueu a voz
  rationale: O verbo significa literalmente levantar ou erguer. No contexto introdutório de fala, a expressão preserva o tom solene e é natural em português.
- source_word: ወይቤ
  choice: disse
  rationale: Equivalente transparente do verbo narrativo convencional que introduz discurso direto.
- source_word: ለወልዱ ማቱሳላ
  choice: a seu filho Matusalém
  rationale: Conserva tanto a relação filial quanto a forma tradicional e reconhecível do nome em português.
- source_word: ለከ እብለከ
  choice: É a você que falo
  rationale: A construção clivada mantém a ênfase pronominal do original sem soar arcaica.
- source_word: ወልድየ
  choice: meu filho
  rationale: Preserva o vocativo familiar e instrutivo sem acrescentar uma interjeição ausente.
- source_word: ስማዕ ነገርየ
  choice: ouça minhas palavras
  rationale: O imperativo e o substantivo são vertidos em registro digno, claro e corrente.
- source_word: አጽንን እዝነከ
  choice: incline o ouvido
  rationale: Mantém a imagem corporal concreta de prestar atenção, em vez de reduzi-la a uma abstração.
- source_word: ለርእየ ሕልመ
  choice: à visão do sonho
  rationale: Preserva juntos os componentes de visão e sonho e acompanha de perto a relação formal da expressão ge'ez, sem a reduzir simplesmente a 'sonho'.
- source_word: አቡከ
  choice: de seu pai
  rationale: Conserva a relação genitiva e a autorreferência de Enoque na terceira pessoa.
theological_decisions:
- issue: Caráter visionário da expressão ርእየ ሕልመ
  choice: visão do sonho
  alternative: visão onírica; sonho-visão; sonho
  rationale: A formulação mantém a tensão entre sonho e experiência visual/revelatória própria do contexto apocalíptico, sem determinar com excessiva precisão a relação semântica entre os dois termos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura solene e as imagens concretas do original foram preservadas, evitando tanto arcaísmos desnecessários quanto uma paráfrase excessivamente coloquial.
