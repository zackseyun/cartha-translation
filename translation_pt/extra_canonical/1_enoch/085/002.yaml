  naturalness: O registro é digno e claro. «Ergueu a voz», «ouça minhas palavras» e «incline o ouvido» funcionam bem em português bíblico moderno. A formulação «visão do sonho» mantém deliberadamente a construção densa e um tanto incomum do original; a nota oferece uma alternativa compreensível.
  terminology: «Enoque» e «Matusalém» seguem as formas portuguesas usuais. «Visão» e «sonho» conservam o campo semântico apocalíptico sem impor uma interpretação técnica como «visão onírica» ou «sonho-visão».
