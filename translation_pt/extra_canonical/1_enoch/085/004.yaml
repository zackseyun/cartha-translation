base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/004.yaml
  text: And that black calf struck the red calf and pursued it onto the earth[c][b][a], and after that I could no longer see that red calf.
translation:
  language: pt
  text: E aquele bezerro preto golpeou o bezerro vermelho e o perseguiu pela terra[a][b]; depois disso, já não pude ver o bezerro vermelho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “feriu” ou “chifrou”. O termo indica um golpe ou ataque; “chifrou” é possível no contexto bovino, mas especifica o modo do ataque.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “sobre a terra”, “para a terra” ou “para dentro da terra”, conforme se interprete o movimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጐድአ
  choice: feriu
  rationale: O verbo indica golpear ou causar ferimento. “Feriu” preserva a violência sem determinar que o ataque tenha ocorrido especificamente com os chifres.
- source_word: ጸሊም
  choice: preto
  rationale: É o termo básico de cor e a forma mais natural no contexto da visão animal.
- source_word: ጣዕዋ
  choice: bezerro
  rationale: O substantivo não traz aqui marca feminina explícita. “Bezerro” preserva a referência a um bovino jovem e evita impor o feminino “novilha”.
- source_word: ለቀይሕ
  choice: o bezerro vermelho
  rationale: A cor identifica o objeto; a repetição de “bezerro” torna o referente claro em português e corresponde ao substantivo presente no contexto imediato.
- source_word: ተለዎ
  choice: o perseguiu
  rationale: Após a agressão, o sentido hostil de seguir é melhor expresso por “perseguir” do que pelo neutro “seguir”.
- source_word: ውስተ ምድር
  choice: até o chão
  rationale: A expressão denota movimento em direção à terra ou ao solo. “Até o chão” é natural em português e conserva a ambiguidade sobre o destino, explicitada em nota.
- source_word: አክሀልኩ እምሶቤሃ ርእዮቶ
  choice: depois disso, já não pude ver
  rationale: Expressa de modo natural tanto a referência temporal quanto o fim da visão daquele animal.
theological_decisions:
- issue: Manutenção do simbolismo animal no texto principal
  choice: Conservar “bezerro preto” e “bezerro vermelho” como figuras da visão
  alternative: Identificar diretamente os animais com personagens humanos
  rationale: O texto comunica por imagens apocalípticas; decodificá-las na tradução substituiria a visão por uma interpretação.
- issue: Sexo dos bovinos jovens
  choice: Usar o substantivo não explicitamente feminino “bezerro”
  alternative: Traduzir por “novilha”
  rationale: Neste versículo, o ge'ez não acrescenta a marca feminina que aparece quando o sexo precisa ser explicitado. Assim, “bezerro” evita introduzir uma especificação indevida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem narrativa e a repetição dos animais foram preservadas. As notas mantêm abertas as ambiguidades lexicais genuínas sem inserir a identificação interpretativa das figuras.
