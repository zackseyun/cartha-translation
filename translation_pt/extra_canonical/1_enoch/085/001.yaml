  text: Depois disso, vi outro sonho e mostrarei a você o sonho inteiro, meu filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Depois disso
  rationale: Preserva a fórmula de transição temporal e soa natural em português atual.
- source_word: ካልአ ሕለመ
  choice: outro sonho
  rationale: Indica um sonho distinto e posterior, sem exigir a nuance ordinal de “um segundo sonho”.
- source_word: ርኢኩ
  choice: tive
  rationale: Embora o ge'ez diga literalmente “vi”, em português “tive um sonho” é a forma idiomática usual e mantém o sentido do relato visionário.
- source_word: ኵሎ ሕልመ
  choice: o sonho inteiro
  rationale: O modificador de totalidade qualifica o substantivo singular e retoma naturalmente o sonho recém-mencionado; a tradução preserva seu alcance coletivo.
- source_word: አርእየከ
  choice: mostrarei a você
  rationale: Conserva o valor futuro e causativo de “mostrar, fazer ver”, bem como a vivacidade da revelação comunicada.
- source_word: ወልድየ
  choice: meu filho
  rationale: Mantém a interpelação filial direta e íntima.
theological_decisions:
- issue: Alcance de ኵሎ ሕልመ
  choice: o sonho inteiro
  alternative: cada sonho / todo sonho
  rationale: A construção singular retoma imediatamente “outro sonho” e promete comunicar a totalidade desse sonho específico. A leitura distributiva é gramaticalmente possível em outros contextos, mas é menos provável aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preferiu-se a expressão idiomática “tive outro sonho” ao calque “vi outro sonho”; manteve-se “mostrarei” para refletir o causativo do original.
