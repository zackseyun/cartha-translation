  text: Before these things[b][a], Enoch was hidden.
translation:
  language: pt
  text: 'Antes de tudo isso, Enoque foi ocultado, e nenhum dos filhos dos homens sabia onde ele estava escondido, onde se encontrava ou o que lhe havia acontecido. Durante os seus dias, todos os seus feitos eram entre os santos e os Vigilantes.[a]


    Eu, Enoque, bendizia o grande Senhor e o Rei da eternidade. Então os Vigilantes me chamaram — a mim, Enoque, o escriba — e me disseram:


    “Enoque, escriba da justiça, vá e anuncie aos Vigilantes do céu que abandonaram o alto céu e o lugar santo e eterno, que se contaminaram com mulheres, agiram como agem os filhos dos homens, tomaram mulheres para si e praticaram grande corrupção sobre a terra. Eles não terão paz sobre a terra nem perdão do pecado. Pois alegrar-se-ão com seus filhos, mas verão a matança daqueles a quem amam; lamentarão a destruição de seus filhos e suplicarão para sempre, porém não alcançarão misericórdia nem paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vigilantes” traduz um título de seres celestes; literalmente, “os que estão despertos”.
    reason: lexical_clarity
lexical_decisions:
- source_word: ተከብተ
  choice: foi ocultado / estava escondido
  rationale: No contexto, a forma descreve Enoque fora do conhecimento e do alcance dos seres humanos. A tradução preserva tanto a ação inicial quanto a referência subsequente ao lugar onde permanecia oculto.
- source_word: ትጉሃን
  choice: Vigilantes
  rationale: O termo significa literalmente os que estão despertos ou vigilantes e funciona aqui como designação de seres celestes. “Vigilantes” preserva esse valor titular e é reconhecível na tradição enoquita em português.
- source_word: ጸሓፌ፡ ጽድቅ
  choice: escriba da justiça
  rationale: Tradução formal da construção genitiva, sem decidir se a justiça caracteriza o escriba, sua mensagem ou sua função.
- source_word: ማሰኑ / ሙስና
  choice: se contaminaram / corrupção
  rationale: A raiz expressa deterioração, corrupção ou contaminação. A variação portuguesa acompanha o uso reflexivo no primeiro caso e o resultado amplo sobre a terra no segundo.
- source_word: ኅድገተ፡ ኀጢአት
  choice: perdão do pecado
  rationale: A expressão combina abandono ou remissão com pecado. “Perdão do pecado” é natural em português e não acrescenta uma teoria específica de expiação.
- source_word: ቀትለ፡ ፍቁራኒሆሙ
  choice: a matança daqueles a quem amam
  rationale: A construção denota a morte violenta ou matança de seus amados. A formulação conserva a referência afetiva sem restringi-la silenciosamente apenas aos filhos.
theological_decisions:
- issue: Identidade dos Vigilantes
  choice: Manter “Vigilantes” como designação dos seres celestes do relato
  alternative: Traduzir apenas como “anjos” ou “sentinelas”
  rationale: O texto os chama literalmente de vigilantes e depois os situa no céu. O título preserva a terminologia própria da obra sem impor uma classificação angelológica mais específica.
- issue: Relação de Enoque com os santos e os Vigilantes
  choice: Traduzir que sua atividade se dava entre ambos os grupos
  alternative: Reorganizar a frase segundo versões que distinguem suas atividades com os Vigilantes e seus dias com os santos
  rationale: A testemunha fornecida liga explicitamente sua atividade aos santos e aos Vigilantes durante seus dias. A redação conserva a estrutura atestada, embora ela seja incomum.
- issue: Destino dos Vigilantes
  choice: Conservar as negações de paz, perdão e misericórdia sem explicação doutrinária adicional
  alternative: Interpretar a sentença como condenação eterna irreversível em termos sistemáticos
  rationale: O oráculo afirma essas privações, mas a tradução não deve ampliar suas implicações além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se o título tradicional “Vigilantes”, a voz profética em discurso direto e as repetições enfáticas do oráculo, com ajustes sintáticos moderados para fluência.
