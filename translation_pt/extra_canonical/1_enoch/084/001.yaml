base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/001.yaml
  text: And I lifted up my hands in righteousness[a], and I blessed the Holy and Great One; and I spoke with the spirit of my mouth and with the tongue of flesh, which God has made for the children of the flesh of men, so that they might speak with it; and he gave them spirit and tongue and mouth[b], so that they might speak by them.
translation:
  language: pt
  text: E ergui as mãos em retidão e bendisse o Santo e Grande; falei com o sopro da minha boca[a] e com a língua de carne, que Deus fez para os filhos da carne dos homens[b], para que falassem com ela; e ele lhes deu sopro, língua e boca, para que falassem por meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falei com o espírito da minha boca”. O termo ge''ez pode significar sopro, espírito ou vento; neste contexto, “sopro” se ajusta melhor à enumeração das faculdades da fala.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os filhos da carne dos homens”. A formulação deliberadamente corporal ressalta a condição humana como criatura, em vez de usar uma expressão genérica mais fluente.
    reason: cultural_note
lexical_decisions:
- source_word: አልዐልኩ እደዋየ
  choice: ergui as mãos
  rationale: Expressa o gesto físico de levantar ambas as mãos em oração, sem sugerir exaltação verbal.
- source_word: በጽድቅ
  choice: em justiça
  rationale: Mantém a construção preposicional solene e a qualidade moral ligada ao ato de oração.
- source_word: ባረክዎ ለቅዱስ ወለዓቢይ
  choice: bendisse o Santo e Grande
  rationale: Trata os adjetivos coordenados como epítetos divinos e evita introduzir uma fórmula doutrinária posterior.
- source_word: ነገርኩ በመንፈስ አፉየ
  choice: falei com o sopro da minha boca
  rationale: No contexto da enumeração das faculdades da fala, 'sopro' comunica melhor o sentido antropológico, embora o termo também possa significar 'espírito'.
- source_word: በልስነ ሥጋ
  choice: com a língua de carne
  rationale: Preserva a imagem corporal concreta e a formulação marcada do ge'ez.
- source_word: ውሉደ ሥጋ ሰብእ
  choice: os filhos da carne dos homens
  rationale: Conserva a corporeidade e a redundância enfática do original, em vez de reduzi-las a um termo genérico como 'seres humanos'.
- source_word: ከመ ይትናገሩ ባቲ
  choice: para que falassem com ela
  rationale: O pronome feminino singular remete mais naturalmente a 'língua'; 'com ela' exprime instrumento de modo idiomático.
- source_word: ወወሀቦሙ መንፈሰ ወልሳነ ወአፈ
  choice: e ele lhes deu sopro, língua e boca
  rationale: Mantém a tríade de capacidades e órgãos da fala e traduz መንፈስ de modo coerente com o contexto criacional.
- source_word: ከመ ይትናገሩ ቦቱ
  choice: para que falassem por meio deles
  rationale: O plural retoma coletivamente o sopro, a língua e a boca, preservando sua função instrumental.
theological_decisions:
- issue: Se መንፈስ deve ser traduzido como 'espírito' ou 'sopro'
  choice: sopro
  alternative: espírito
  rationale: A proximidade de boca e língua e a enumeração das faculdades humanas da fala favorecem 'sopro'. A nota preserva a polissemia legítima sem impor uma leitura pneumatológica.
- issue: Grau de explicitação da antropologia corporal do versículo
  choice: manter 'língua de carne' e 'filhos da carne dos homens'
  alternative: alisar para 'língua humana' e 'seres humanos'
  rationale: A linguagem do ge'ez enfatiza deliberadamente a condição corporal e criada dos seres humanos; suavizá-la apagaria parte de sua retórica.
- issue: Referente do pronome singular em 'para que falassem com ela'
  choice: a língua
  alternative: a carne
  rationale: O gênero feminino do pronome e a função de instrumento da fala tornam 'língua' o antecedente mais natural, embora a sintaxe densa do período recomende não ampliar além do necessário.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com legibilidade brasileira. Preservaram-se o encadeamento semítico, os epítetos divinos e as imagens corporais marcadas, mas com pontuação natural em português.
