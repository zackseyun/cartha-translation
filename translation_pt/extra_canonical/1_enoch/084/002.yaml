base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/002.yaml
  text: Blessed are you[a], O Lord, great King and mighty in your greatness, Lord of all the creation of heaven, King of kings and God of all the world. And your kingship and your kingdom and your greatness endure forever and ever, and your authority is for all generations of generations. And all the heavens are your throne forever[d][c][b], and the whole earth is the footstool of your feet forever and ever.
translation:
  language: pt
  text: Bendito és tu, ó Senhor, grande Rei e poderoso em tua grandeza, Senhor de toda a criação do céu[b], Rei dos reis e Deus de todo o mundo. E tua realeza[a], teu reino e tua grandeza permanecem para todo o sempre, e tua autoridade permanece por todas as gerações de gerações. E todos os céus são teu trono para sempre[c], e toda a terra é o apoio para os teus pés para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo no testemunho transcrito é textualmente difícil; também pode ser entendido como “soberania”, “domínio” ou “glória”.
    reason: textual_variant
  - marker: b
    text: Literalmente, “toda a criação do céu”; a expressão também pode significar “toda a criação celestial”.
    reason: lexical_alternative
  - marker: c
    text: Compare a imagem do céu como trono e da terra como apoio para os pés em Isaías 66:1.
    reason: cross_reference
lexical_decisions:
- source_word: ቡሩክ፡ አንተ
  choice: Bendito és tu
  rationale: Mantém a fórmula predicativa de bênção dirigida diretamente a Deus, com tom de oração natural e digno em português.
- source_word: ንጉሥ፡ ዐቢይ፡ ወኃያል
  choice: Rei grande e poderoso
  rationale: Conserva tanto o título real quanto os dois atributos, sem tornar a ordem portuguesa artificial.
- source_word: በዕበየ፡ ዚአከ
  choice: em tua grandeza
  rationale: Segue de perto a construção ge'ez e preserva a repetição temática de grandeza.
- source_word: ኵሉ፡ ፍጥረት፡ ሰማይ
  choice: toda a criação do céu
  rationale: Reproduz a sequência do ge'ez e mantém aberta a possibilidade de se referir a toda a criação celestial.
- source_word: ንጉሠ፡ ነገሥት
  choice: Rei dos reis
  rationale: É o equivalente português consagrado e direto do superlativo real.
- source_word: አምላከ፡ ኵሉ፡ ዓለም
  choice: Deus de todo o mundo
  rationale: No contexto de soberania cósmica, ዓለም designa mais naturalmente o mundo ou a ordem criada.
- source_word: መላኵትከ
  choice: tua realeza
  rationale: Expressa a dignidade ou soberania régia e evita confundi-la inteiramente com መንግሥትከ, 'teu reino'; a forma do testemunho transcrito, porém, é textualmente difícil.
- source_word: መንግሥትከ
  choice: teu reino
  rationale: Preserva o termo real distinto e sua possível amplitude entre reino e governo.
- source_word: ይነብር
  choice: permanecem
  rationale: Comunica duração contínua de realeza, reino e grandeza de modo idiomático.
- source_word: ስልጣንከ
  choice: tua autoridade
  rationale: Traduz explicitamente o substantivo que forma uma cláusula própria no ge'ez, sem absorvê-lo na oração anterior.
- source_word: ለኵሉ፡ ትውልደ፡ ትውልድ
  choice: por todas as gerações de gerações
  rationale: Conserva a expressão enfática e repetitiva do original, em vez de reduzi-la simplesmente a 'por todas as gerações'.
- source_word: መካይደ፡ እገሪከ
  choice: o apoio para os teus pés
  rationale: Transmite a imagem concreta do estrado ou escabelo com vocabulário compreensível ao leitor moderno.
- source_word: ለዓለም፡ ወለዓለመ፡ ዓለም
  choice: para todo o sempre
  rationale: Equivalente português natural da fórmula intensificada de duração eterna.
theological_decisions:
- issue: Soberania cósmica e imagem do trono e do apoio para os pés
  choice: 'Manter a linguagem régia concreta: os céus como trono e a terra como apoio para os pés de Deus.'
  alternative: Generalizar a passagem como simples afirmação abstrata da soberania divina.
  rationale: O ge'ez apresenta deliberadamente uma imagem cósmica de realeza; torná-la abstrata eliminaria uma parte importante da linguagem apocalíptica.
- issue: Relação entre realeza, reino, grandeza e autoridade
  choice: Traduzir cada substantivo separadamente.
  alternative: Fundir os termos em uma única afirmação geral sobre o governo de Deus.
  rationale: A acumulação de termos é retórica e teologicamente significativa, e o texto distingue explicitamente መላኵትከ, መንግሥትከ, ዕበይከ e ስልጣንከ.
translation_notes:
  register: Português moderno, digno e próprio de oração, com leitura natural no Brasil e compreensão internacional. Mantiveram-se as repetições solenes, os títulos régios e a imagem cósmica do original; evitou-se vocabulário excessivamente arcaico como “escabelo”, preferindo-se “apoio para os teus pés”.
