base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/004.yaml
  text: And now the angels of your heavens have transgressed[c][b][a], and your wrath is upon the flesh of men until the great day of judgment.
translation:
  language: pt
  text: E agora os anjos dos teus céus transgrediram[c], e a tua ira está sobre a carne dos homens[b] até o grande dia do juízo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A transcrição etíope disponível é difícil no fim do versículo. A leitura etiópica corrigida traz “juízo”, em lugar da forma defeituosa produzida pelo OCR.
    reason: textual_variant
  - marker: b
    text: Lit. “a carne do homem”. A expressão provavelmente se refere de modo coletivo à humanidade em sua condição mortal.
    reason: lexical_alternative
  - marker: c
    text: A transcrição fornecida traz uma forma que poderia ser entendida como “façam súplica”, mas ela parece resultar de erro de OCR. A leitura corrigida significa “pecaram” ou “transgrediram”.
    reason: textual_variant
lexical_decisions:
- source_word: መላእክተ ሰማያቲከ
  choice: os anjos dos teus céus
  rationale: “Anjos” identifica adequadamente os seres celestiais neste contexto apocalíptico; o plural “céus” e o sufixo possessivo dirigido a Deus são preservados.
- source_word: ይጌግዩ (leitura corrigida; o texto transcrito traz ይጼብቡ)
  choice: transgrediram
  rationale: A leitura corrigida significa que os anjos pecaram ou cometeram transgressão. O perfeito português apresenta a ação como consumada e evita a inversão de sentido produzida pelo OCR defeituoso.
- source_word: ዲበ ሥጋ ሰብእ
  choice: sobre a carne dos homens
  rationale: Preserva a imagem antropológica concreta de “carne” e comunica o valor coletivo de “homem” neste contexto, sem reduzi-lo simplesmente a “humanidade”.
- source_word: ትከውን መዐትከ
  choice: a tua ira está
  rationale: A construção é entendida como declaração indicativa, não como pedido jussivo. “Ira” mantém o peso judicial do contexto.
- source_word: እስከ ዕለት ዐባይ
  choice: até o grande dia
  rationale: Mantém de forma concisa a expressão temporal apocalíptica.
- source_word: ኵነኔ (leitura corrigida; o texto transcrito traz ጽጌ)
  choice: do juízo
  rationale: A leitura corrigida aponta diretamente para “juízo”, qualificando o grande dia; a nota registra a dificuldade da transcrição disponível.
theological_decisions:
- issue: Alcance de “a carne dos homens”
  choice: Referência coletiva à humanidade em sua condição mortal, preservando a imagem de “carne”.
  alternative: Referência a um indivíduo ou, mais amplamente, a toda carne mortal.
  rationale: O substantivo correspondente a “homem” é singular na expressão de origem, mas funciona naturalmente de modo coletivo na oração apocalíptica. O português plural evita uma leitura individual sem apagar a imagem concreta.
- issue: Relação entre a transgressão dos anjos e a ira sobre os seres humanos
  choice: Manter as duas afirmações coordenadas sem explicar causalidade ou responsabilidade.
  alternative: Explicitar que a transgressão angélica causou diretamente a ira divina contra a humanidade.
  rationale: O versículo justapõe os fatos, mas não define aqui toda a relação teológica entre eles; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. A construção conserva o tom apocalíptico e a imagem concreta de “carne”, mas usa “dos homens” para tornar claro o sentido coletivo. As notas distinguem explicitamente o texto transcrito por OCR das leituras etíopes corrigidas indicadas pela revisão textual.
