base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/003.yaml
  text: For you have made all things[a], and over all things you rule; and no deed is too hard for you, and not even a single wisdom passes beyond the throne of your dwelling, nor turns away from before your face. And you know all things, and see, and hear, and there is nothing hidden from you[d][c][b], for you see all things.
translation:
  language: pt
  text: Pois tu fizeste todas as coisas[a] e governas sobre tudo. Nenhuma obra é difícil demais para ti, e nem sequer uma só sabedoria passa para além do trono da tua morada, nem se afasta de diante da tua face.[b] Tu conheces tudo, vês e ouves, e nada se esconde de ti, pois tu vês tudo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto etíope diz literalmente “pois tu fizeste”, sem objeto expresso; “todas as coisas” é suprido pelo contexto. A palavra “tudo” aparece explicitamente na oração seguinte: “e governas sobre tudo”.'
    reason: supplied_object
  - marker: b
    text: A oração sobre “uma só sabedoria” é difícil no etíope. Pode referir-se a nenhum plano sábio, pensamento ou assunto que esteja além da morada régia de Deus.
    reason: lexical_alternative
  - marker: c
    text: A frase final repete o tema do conhecimento divino total. Alguns testemunhos parecem preservar explicitamente a linha conclusiva “pois tu vês tudo”.
    reason: textual_variant
lexical_decisions:
- source_word: ገበርከ
  choice: fizeste todas as coisas
  rationale: O verbo significa “fazer” ou “realizar” e não traz objeto explícito nesta oração. “Todas as coisas” é suprido pelo contexto e pela abrangência da oração seguinte, produzindo português natural sem transformar o verbo em uma fórmula técnica de criação; a nota torna a elipse transparente.
- source_word: ለኵሉ አንተ ትመልክ
  choice: governas sobre tudo
  rationale: Preserva tanto o alcance universal de ኵሉ quanto o sentido régio do verbo, em linguagem atual e digna.
- source_word: ኢይጸንዐከ ግብር
  choice: nenhuma obra é difícil demais para ti
  rationale: A construção com o sufixo pessoal expressa idiomaticamente que algo é difícil demais para alguém. A tradução conserva a afirmação de poder divino sem substituí-la pela ideia menos precisa de oposição.
- source_word: ወአሐቲ ጥበብ
  choice: nem sequer uma só sabedoria
  rationale: Mantém o substantivo “sabedoria” e a singularidade enfática da formulação etíope, embora a expressão seja incomum, evitando interpretá-la sem base suficiente como plano, pensamento ou assunto.
- source_word: ኢትሐልፍ እምንባራተ ምንባሪከ
  choice: passa para além do trono da tua morada
  rationale: Conserva o movimento espacial e a imagem dupla, régia e habitacional, do texto, sem reduzi-los simplesmente a “tua presença”.
- source_word: ኢትትመየጥ ኢእምገጽከ
  choice: nem se afasta de diante da tua face
  rationale: A redação preserva a linguagem espacial e pessoal do original. “Diante da tua face” é deliberadamente mais concreta que “da tua presença”.
- source_word: ታአምር ወትሬኢ ወትሰምዕ
  choice: conheces tudo, vês e ouves
  rationale: Reproduz a sequência de conhecimento, visão e audição e sua afirmação abrangente.
- source_word: ዘይትኀባእ እምኔከ
  choice: nada se esconde de ti
  rationale: Expressão direta e natural em português, mantendo a ênfase de que nada permanece oculto a Deus.
theological_decisions:
- issue: Soberania, poder e conhecimento divinos
  choice: Manter as afirmações universais de que Deus governa sobre tudo, nenhuma obra lhe é difícil demais e nada se esconde dele.
  alternative: Atenuar essas declarações como linguagem geral de louvor.
  rationale: Os termos totalizantes e a repetição final sustentam afirmações fortes de soberania, poder e conhecimento no contexto da oração.
- issue: Sentido da oração difícil sobre “uma só sabedoria”
  choice: Conservar a expressão incomum e a imagem do trono da morada, acompanhadas de nota.
  alternative: Interpretar “sabedoria” como plano, pensamento sábio ou assunto.
  rationale: O referente e a sintaxe são incertos. Uma tradução relativamente formal preserva a ambiguidade real e evita impor uma interpretação teológica ou semântica específica.
- issue: Linha conclusiva repetida
  choice: Incluir “pois tu vês tudo” no texto, com nota textual.
  alternative: Encerrar em “nada se esconde de ti”.
  rationale: A linha aparece no material fornecido, mas sua preservação parece variar entre testemunhos; incluí-la com nota mantém a evidência visível sem ocultar a incerteza textual.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom elevado de oração. Mantêm-se “tu” e as imagens concretas de “trono”, “morada” e “face”, sem arcaísmos desnecessários. A formulação deliberadamente incomum sobre “uma só sabedoria” conserva a dificuldade do texto-fonte e é esclarecida em nota.
