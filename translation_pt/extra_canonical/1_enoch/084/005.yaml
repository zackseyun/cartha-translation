base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/005.yaml
  text: And now, O God and Lord and great King, I beseech and ask that you establish my prayer for me.
translation:
  language: pt
  text: E agora, ó Deus, Senhor e grande Rei, eu te suplico e peço que confirmes em meu favor a minha oração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ
  choice: E agora
  rationale: Reproduz a transição enfática do texto etíope de modo natural em português.
- source_word: አምላክ፡ ወእግዚእ፡ ወንጉሥ፡ ዐቢይ
  choice: ó Deus, Senhor e grande Rei
  rationale: Mantém a sequência de títulos e o vocativo solene sem acrescentar distinções ausentes no texto.
- source_word: አስተበቍዕ፡ ወእስእል
  choice: eu te suplico e peço
  rationale: Preserva os dois verbos coordenados e sua intensidade, com formulação corrente e dignificada.
- source_word: ታቅም፡ ሊተ፡ ስእለተየ
  choice: firmes para mim a minha oração
  rationale: Conserva tanto a ideia de estabelecer ou firmar quanto a expressão explícita 'para mim', sem substituir o objeto por 'pedido'.
theological_decisions:
- issue: Sentido de 'firmar a oração'
  choice: firmes para mim a minha oração
  alternative: atendas à minha oração
  rationale: A alternativa poderia resolver o sentido como atendimento divino, mas o verbo-fonte e a consulta inglesa apontam mais literalmente para estabelecer ou tornar firme; a formulação escolhida preserva essa tensão.
translation_notes:
  register: Português moderno, solene e acessível, com ordem vocativa natural e sem arcaísmos desnecessários. A repetição 'para mim a minha' é mantida porque corresponde a elementos distintos do texto-fonte e conserva sua ênfase.
