base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/006.yaml
  text: And they began again to devour those cattle[a], and behold[c][b], all the children of the earth began [to tremble and flee].
translation:
  language: pt
  text: E tornaram a devorar aqueles bois[a]; e eis que todos os filhos da terra[b] começaram [a tremer e a fugir].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aqueles bovinos” ou “aquelas cabeças de gado”. O termo designa gado bovino, não elefantes.
    reason: lexical_alternative
  - marker: b
    text: A expressão apocalíptica “filhos da terra” foi mantida literalmente, em vez de ser reduzida a “habitantes da terra”.
    reason: cultural_note
  - marker: c
    text: A transcrição etíope fornecida se interrompe depois de “começaram”. As palavras entre colchetes restauram o complemento preservado na continuação textual da passagem.
    reason: textual_note
lexical_decisions:
- source_word: አሐዙ እንከ
  choice: tornaram a
  rationale: A combinação exprime o início ou a retomada da ação. “Tornaram a” comunica com naturalidade que a ação de devorar recomeçou.
- source_word: ይብልዕዎሙ
  choice: devorar
  rationale: O verbo pode significar comer, consumir ou devorar; no contexto violento da visão dos animais, “devorar” preserva melhor a força predatória.
- source_word: እልኩ አልህምት
  choice: aqueles bois
  rationale: አልህምት designa gado ou bovinos, não elefantes. “Bois” mantém concreta e inteligível a figura animal da visão.
- source_word: ነዋ
  choice: e eis que
  rationale: Aqui ነዋ funciona como partícula de apresentação, “eis que”, chamando atenção para a cena seguinte; não é o verbo “tremer”.
- source_word: ኵሎሙ ውሉደ ምድር
  choice: todos os filhos da terra
  rationale: A tradução relativamente literal conserva a expressão apocalíptica e não a reduz interpretativamente a “habitantes da terra”.
- source_word: '[ይርዐዱ ወይርወጹ]'
  choice: '[a tremer e a fugir]'
  rationale: O testemunho transcrito fornecido termina depois de “começaram”; o complemento, conhecido pela continuação textual da passagem e preservado na camada de consulta, é assinalado entre colchetes como restauração.
theological_decisions:
- issue: Interpretação do simbolismo animal
  choice: manter “bois” como imagem concreta
  alternative: substituir a figura por governantes, povos ou outra interpretação simbólica
  rationale: A tradução deve preservar a linguagem própria da visão apocalíptica sem impor no texto a identificação teológica de seus símbolos.
- issue: Expressão apocalíptica “filhos da terra”
  choice: preservar a formulação literal
  alternative: traduzir como “habitantes da terra”
  rationale: A expressão literal mantém a amplitude e a tensão simbólica do original, sem decidir antecipadamente quem são seus referentes.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa clara. “Tornaram a” expressa retomada sem excesso de literalismo; “e eis que” preserva o tom visionário. Os colchetes tornam transparente a restauração exigida pela forma truncada da fonte apresentada.
