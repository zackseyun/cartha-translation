base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/003.yaml
  text: And again I saw in the vision[a], and I looked up to heaven; and behold, I saw many stars. They came down and were cast from heaven to that first star, and among those calves they became bulls[d][c][b], and they pastured with them.
translation:
  language: pt
  text: E novamente tive uma visão e olhei para o céu. Eis que vi muitas estrelas[a]; elas desceram e foram lançadas do céu para junto daquela primeira estrela[b]. Entre aqueles bezerros, tornaram-se touros e pastavam com eles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As “estrelas” podem simbolizar seres celestiais, mas a tradução mantém a imagem da visão sem identificá-las explicitamente.
    reason: lexical_alternative
  - marker: b
    text: “Aquela primeira estrela” parece retomar uma estrela mencionada anteriormente na visão, em vez de introduzir uma nova figura.
    reason: cross_reference
  - marker: c
    text: 'A palavra final “entre eles” aparece entre colchetes na edição-fonte. A frase também pode ser traduzida: “e pastavam com eles, entre eles”.'
    reason: textual_variant
lexical_decisions:
- source_word: ወካዕበ፡ ርኢኩ፡ በራእይ
  choice: E novamente tive uma visão
  rationale: Reproduz a retomada narrativa e o enquadramento visionário em português natural, sem perder a cadência repetitiva do relato.
- source_word: ነጸርክዎ፡ ለሰማይ
  choice: olhei para o céu
  rationale: Expressa o olhar dirigido ao céu sem acrescentar uma direção vertical que não precisa ser explicitada.
- source_word: ነዋ
  choice: Eis que
  rationale: Preserva a força de apresentação vívida própria da linguagem apocalíptica.
- source_word: ከዋክብተ፡ ብዙኃነ
  choice: muitas estrelas
  rationale: Tradução direta e clara, mantendo intacta a imagem simbólica do texto.
- source_word: ወረዱ፡ ወተገደፉ፡ እምሰማይ
  choice: desceram e foram lançadas do céu
  rationale: Distingue a descida do passivo seguinte, cujo sentido indica que as estrelas sofreram a ação de ser lançadas.
- source_word: በኀበ፡ ዝኩ፡ ኮከብ፡ ቀዳማዊ
  choice: para junto daquela primeira estrela
  rationale: O demonstrativo e o ordinal remetem naturalmente a uma estrela já apresentada; “para junto de” conserva a relação espacial sem sugerir incorporação.
- source_word: ማእከለ፡ እልኩ፡ ጣዕዋ
  choice: Entre aqueles bezerros
  rationale: ጣዕዋ designa animais bovinos jovens; “bezerros” preserva a imagem zoomórfica concreta.
- source_word: አልህምት፡ ኮኑ
  choice: tornaram-se touros
  rationale: No contexto, o termo bovino contrasta com os bezerros e descreve a transformação das estrelas em bovinos machos; evita a antiga leitura incorreta “cavalos”.
- source_word: ወምስሌሆሙ፡ ይትረዓዩ
  choice: e pastavam com eles
  rationale: O verbo pertence à raiz ligada a pastar ou apascentar, não à raiz semelhante ligada a ver; a forma contínua “pastavam” é natural no contexto da cena.
theological_decisions:
- issue: Identidade simbólica das estrelas
  choice: Manter “estrelas” no texto principal
  alternative: anjos ou seres celestiais
  rationale: Embora as estrelas possam representar seres celestiais na visão, o texto apresenta a imagem, não sua interpretação explícita.
- issue: Natureza da queda do céu
  choice: “foram lançadas do céu”
  alternative: “caíram do céu”
  rationale: A forma passiva indica ação sofrida e deve ser preservada, sem especificar quem as lançou.
- issue: Transformação zoomórfica
  choice: “entre aqueles bezerros, tornaram-se touros”
  alternative: “entre aqueles touros, tornaram-se cavalos”
  rationale: A leitura bovina corresponde melhor ao léxico etíope e mantém a tensão simbólica sem explicar no texto quem essas figuras representam.
translation_notes:
  register: Português moderno, claro e digno, com cadência visionária preservada. Emprega “eis que” para manter a vividez apocalíptica e vocabulário bovino concreto, evitando interpretações teológicas no corpo do texto.
