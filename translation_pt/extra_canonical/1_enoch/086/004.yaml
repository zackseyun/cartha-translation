base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/004.yaml
  text: 'And I looked at them and saw: behold[a], they all let out their private parts like horses, and they began to mount the cows; and they all conceived and gave birth to elephants, camels[c][b], and donkeys.'
translation:
  language: pt
  text: 'E olhei para eles e vi: eis que todos puseram para fora as suas partes íntimas[a], como cavalos, e começaram a montar as vacas. Todas elas conceberam e deram à luz elefantes, camelos e jumentos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge'ez traduzida por «puseram para fora as suas partes íntimas» é sexualmente explícita e provavelmente descreve os machos expondo ou estendendo os órgãos genitais.
    reason: lexical_alternative
  - marker: b
    text: A lista final pode designar os descendentes produzidos pelo cruzamento simbólico da visão. A cena pertence ao esquema alegórico do Apocalipse dos Animais, não a uma descrição zoológica comum.
    reason: cultural_note
lexical_decisions:
- source_word: ወነጸርክዎሙ
  choice: E olhei para eles
  rationale: Mantém o verbo visionário em linguagem direta e natural, sem torná-lo excessivamente formal.
- source_word: ወርኢኩ ወነዋ
  choice: 'e vi: eis que'
  rationale: Preserva a fórmula visionária duplicada e sua força retórica apocalíptica.
- source_word: አውፁኡ ንፍረታቲሆሙ
  choice: puseram para fora suas partes íntimas
  rationale: Conserva tanto a ideia direcional do verbo causativo quanto a referência sexual explícita, usando linguagem modesta, mas clara.
- source_word: ከመ አፍራስ
  choice: como cavalos
  rationale: Reproduz literalmente a comparação, importante para o caráter chocante e simbólico da visão.
- source_word: ወአሐዙ ይዐረጉ
  choice: e começaram a montar
  rationale: No contexto sexual e zoológico, 'montar' expressa naturalmente a ideia literal de subir sobre, sem apagar a imagem animal.
- source_word: ዲበ አንስት አልህምት
  choice: as vacas
  rationale: አልህምት designa bovinos/vacas, não elefantes; a forma feminina é adequadamente expressa por 'vacas'.
- source_word: ወጸንሳ
  choice: Todas elas conceberam
  rationale: O pronome explícito em português esclarece que o sujeito passa a ser as vacas, evitando atribuir a concepção aos machos.
- source_word: ወወለዳ
  choice: e deram à luz
  rationale: Formulação corrente, digna e clara para o ato de parir.
- source_word: ነጌያተ ወአገማሰ ወአእዳገ
  choice: elefantes, camelos e jumentos
  rationale: Reproduz as três espécies de descendentes nomeadas no texto; 'jumentos' é claro e amplamente compreensível em português.
theological_decisions:
- issue: Grau de explicitude da imagem sexual na visão dos animais
  choice: Manter a exposição dos órgãos e o ato de montar em termos claros
  alternative: Suavizar a passagem como simples acasalamento
  rationale: A reprodução transgressora é parte da força simbólica da visão. Uma paráfrase vaga enfraqueceria deliberadamente a imagem do testemunho ge'ez.
- issue: Identidade das fêmeas montadas
  choice: vacas
  alternative: elefantes fêmeas
  rationale: O ge'ez አልህምት refere-se a bovinos, ao passo que os elefantes aparecem depois sob outro termo, ነጌያተ. A tradução preserva essa distinção sem impor ao corpo do texto uma interpretação completa da alegoria.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. A sintaxe conserva a sequência visionária e a explicitude controlada do original. 'Todas elas' torna inequívoca a mudança de sujeito para as vacas; a pontuação evita associar a nota lexical apenas aos cavalos.
