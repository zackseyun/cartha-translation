base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/001.yaml
  text: And again I looked with my eyes while I was sleeping[a], and I saw heaven above, and behold, one star fell from heaven[c][b], and it arose and ate and grazed in the midst of those cattle.
translation:
  language: pt
  text: E, outra vez, olhei com os meus próprios olhos enquanto dormia e vi o céu lá em cima. E eis que uma estrela[a] caiu do céu, levantou-se, comeu e pastou[b] no meio daquele gado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No Apocalipse dos Animais, as estrelas muitas vezes representam seres celestiais; aqui, porém, o texto diz literalmente «estrela».
    reason: cross_reference
  - marker: b
    text: 'O original emprega dois verbos: «comeu» e «pastou». A tradução mantém ambos para preservar a imagem animal da visão.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, um termo plural para bois, vacas ou bovinos em geral; não especifica que fossem bezerros.
    reason: lexical_clarification
lexical_decisions:
- source_word: ካዕበ
  choice: outra vez
  rationale: Marca uma nova etapa do relato visionário e mantém a repetição do original em português natural.
- source_word: ርኢኩ በአዕይንትየ
  choice: olhei com os meus próprios olhos
  rationale: Conserva a menção enfática aos olhos e distingue esta primeira ação do verbo seguinte, traduzido por «vi».
- source_word: እንዘ እነውም
  choice: enquanto dormia
  rationale: Explicita, como o texto de origem, que a visão ocorreu durante o sono.
- source_word: ሰማየ መልዕልተ
  choice: o céu lá em cima
  rationale: Reproduz a referência espacial ao céu acima sem impor uma cosmologia mais específica.
- source_word: ነዋ
  choice: e eis que
  rationale: Preserva a partícula que introduz um elemento surpreendente da visão e mantém o tom apocalíptico.
- source_word: ኮከብ አሐዱ
  choice: uma estrela
  rationale: Mantém literalmente a imagem da estrela e não a substitui por sua possível interpretação como ser celestial.
- source_word: ወድቀ እምሰማይ
  choice: caiu do céu
  rationale: Expressa diretamente o movimento descendente e sua força visual.
- source_word: ወይትሌዐል
  choice: levantou-se
  rationale: Mantém a sequência paradoxal de cair e depois se levantar, sem especificar causa ou agente.
- source_word: ወይበልዕ ወይትረዐይ
  choice: comeu e pastou
  rationale: Conserva os dois verbos distintos e a imagem animal da visão, em vez de fundi-los numa única ação.
- source_word: ማእከለ እልከቱ አልህምት
  choice: no meio daquele gado
  rationale: «Gado» traduz naturalmente o substantivo bovino plural አልህምት; evita «bezerros», que indicaria indevidamente uma idade não expressa pelo termo ge'ez.
theological_decisions:
- issue: Se a «estrela» deve ser identificada no texto principal como um anjo ou outro ser celestial
  choice: Manter «uma estrela» sem explicação interpretativa no texto principal.
  alternative: Traduzir como «um anjo» ou «uma estrela angelical».
  rationale: Embora estrelas possam representar seres celestiais no Apocalipse dos Animais, o versículo apresenta a figura como estrela. A tradução preserva o símbolo e sua tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com cadência visionária. «E eis que» conserva o tom apocalíptico; «lá em cima» comunica naturalmente a orientação espacial. O coletivo «gado» evita uma formulação técnica e mantém a referência bovina sem acrescentar sexo ou idade.
