  naturalness: '«Todo o gado ... começou» é português moderno, claro e gramaticalmente natural: «gado» é um coletivo singular. Evita-se o demonstrativo «estes», que soa algo livresco e exige um antecedente que o versículo não fornece.'
  terminology: «Gado», «morder», «devorar» e «chifrar com os chifres» preservam o registro concreto da alegoria animal. «Chifrar com os chifres» mantém deliberadamente o instrumento expresso no ge'ez.
