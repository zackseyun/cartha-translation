base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/005.yaml
  text: And all the cattle feared them and were terrified by them[b][a], and they began to bite with their teeth and to devour and to gore with their horns.
translation:
  language: pt
  text: Todo o gado teve medo deles e ficou aterrorizado diante deles[a]; então começou a morder com os dentes, a devorar e a chifrar com os chifres.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge'ez significa literalmente “diante deles”; no contexto, também pode indicar que eles são a causa do terror.
    reason: translation_alternative
  - marker: b
    text: 'O texto mantém explícita a imagem animal: o gado sente medo e a narrativa descreve mordidas, devoração e ataques com chifres. Os grupos simbolizados não são identificados neste versículo.'
    reason: cultural_note
lexical_decisions:
- source_word: ኵሎሙ፡ አልህምት
  choice: todo o gado
  rationale: Expressa a totalidade do grupo bovino em português natural, sem restringir o referente a machos nem abandonar a imagem animal.
- source_word: ፈርህዎሙ፡ ወደንገፁ
  choice: teve medo deles e ficou aterrorizado
  rationale: Mantém os dois verbos e a intensificação do medo para o terror.
- source_word: እምኔሆሙ
  choice: diante deles
  rationale: Preserva de perto o valor espacial/presencial da expressão ge'ez; a nota registra a possibilidade causal mais idiomática.
- source_word: ወአሐዙ
  choice: então estes começaram
  rationale: O verbo tem valor incoativo. O demonstrativo explicita a mudança contextual de sujeito para os seres temidos, evitando que o português atribua o ataque ao gado; a forma verbal ge'ez, isoladamente, apenas marca um sujeito plural.
- source_word: ይኔክሱ፡ በስኒሆሙ
  choice: a morder com os dentes
  rationale: Conserva a ação concreta e a indicação instrumental do original.
- source_word: ይውሕጡ
  choice: a devorar
  rationale: Transmite a ideia violenta de engolir ou consumir própria da cena.
- source_word: ይወግኡ፡ በአቅርንቲሆሙ
  choice: a chifrar com os chifres
  rationale: O instrumento mencionado determina o sentido específico de atacar com os chifres, e a repetição concreta corresponde à formulação da fonte.
theological_decisions:
- issue: Preservar a representação simbólica animal ou substituí-la pelos grupos humanos simbolizados
  choice: Manter no texto principal o gado, os dentes e os chifres
  alternative: Identificar diretamente os animais como grupos humanos
  rationale: A visão comunica por meio de uma alegoria animal contínua, e o próprio versículo não fornece a interpretação dos referentes.
- issue: Identidade do sujeito que começa a atacar
  choice: Usar “estes” para apontar contextualmente aos seres que o gado teme
  alternative: Usar apenas “eles” ou omitir o pronome, o que em português tende a fazer do gado o sujeito do ataque
  rationale: O ge'ez marca um sujeito plural sem nomeá-lo novamente; o contexto anterior indica uma mudança para os animais monstruosos recém-mencionados. A tradução esclarece a coesão narrativa sem identificar os referentes simbólicos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Todo o gado” é corrente e evita a tecnicidade de “bovinos”; a concordância no singular segue o substantivo coletivo. O paralelismo vívido e a repetição de “chifrar com os chifres” foram preservados por refletirem a concretude do original.
