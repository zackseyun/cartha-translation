base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/002.yaml
  text: And after that I saw large and black cattle[a], and behold, all of them changed their stalls and their pastures and their calves[c][b], and they began to live with one another.
translation:
  language: pt
  text: Depois disso, vi grandes bovinos negros. E eis que todos eles mudaram seus currais, suas pastagens e seus bezerros[a], e começaram a viver uns com os outros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A oração sobre mudar «seus currais, suas pastagens e seus bezerros» é textual e semanticamente difícil. O ge''ez parece reunir lugares e crias sob um só verbo de mudança ou alteração. Também seria possível entender: «seus lugares de habitação, seus lugares de pasto e suas crias».'
    reason: textual_variant
  - marker: b
    text: 'Também pode ser traduzido: «passaram a morar juntos» ou «viviam uns com os outros».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አልህምተ
  choice: animais bovinos
  rationale: Preserva a imagem coletiva de gado sem restringir o sexo dos animais, como fariam «bois» ou «touros», e evita a generalidade excessiva de «animais» isoladamente.
- source_word: ዐቢያነ
  choice: grandes
  rationale: Expressa concretamente o tamanho ou a imponência dos animais na visão.
- source_word: ጸሊማነ
  choice: negros
  rationale: O termo indica coloração preta; «negros» mantém o contraste cromático preciso da simbologia animal do contexto.
- source_word: ወለጡ
  choice: mudaram
  rationale: Mantém o sentido amplo de alteração ou troca sem definir de modo indevido como currais, pastagens e crias foram afetados.
- source_word: ምዕያኖሙ
  choice: seus currais
  rationale: Conserva a ambientação pastoril e bovina; o sentido mais amplo de lugares de habitação continua possível.
- source_word: ምርጓዮሙ
  choice: suas pastagens
  rationale: Designa naturalmente os lugares onde o gado pasta e preserva a imagem pecuária.
- source_word: አጥዐጥሆሙ
  choice: seus bezerros
  rationale: No contexto de animais bovinos, traduz de modo concreto a referência às crias, sem excluir em nota a possibilidade mais ampla de «filhotes» ou «descendência».
- source_word: አሐዙ ተየሐይዉ ፩ ለካልኡ
  choice: começaram a viver uns com os outros
  rationale: Reproduz tanto o aspecto incoativo da sequência verbal quanto a ideia de convivência mútua.
theological_decisions:
- issue: Se os referentes humanos simbolizados pelos animais devem ser identificados na tradução
  choice: Manter literalmente a imagem dos animais no texto principal
  alternative: Traduzir de modo interpretativo, tornando implícitos ou explícitos os referentes humanos
  rationale: A visão comunica por meio de simbolismo animal. Identificar os referentes na tradução eliminaria a forma apocalíptica do texto e resolveria uma questão que pertence à interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Animais bovinos» foi escolhido para evitar a marcação masculina de «bois» e a estranheza do coletivo singular «gado» diante dos pronomes plurais. A construção incomum com «mudaram» foi preservada, em vez de harmonizada, por refletir uma dificuldade real do texto ge'ez.
