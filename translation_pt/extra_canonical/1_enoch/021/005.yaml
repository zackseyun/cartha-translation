base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/005.yaml
  text: And Uriel[a], one of the holy angels who was with me and was guiding me, said to me, “Enoch, about whom are you asking[b], and about whom are you inquiring and searching?”
translation:
  language: pt
  text: 'E Uriel, um dos santos anjos que estava comigo e me guiava, disse-me: “Enoque, a respeito de quem você está perguntando, e a respeito de quem está indagando e procurando saber[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido exato do último verbo é incerto. Pode transmitir a ideia de procurar saber com empenho, estar ansioso ou mostrar-se inquieto; aqui foi traduzido como “procurando saber”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኡርኤል
  choice: Uriel
  rationale: Translitera o nome próprio segundo a forma tradicional e amplamente reconhecida em português.
- source_word: ፩እምቅዱሳን መላእክት
  choice: um dos santos anjos
  rationale: Preserva a identificação literal de Uriel como um dentre os anjos santos e mantém o peso angelológico da expressão.
- source_word: ዘምስሌየ
  choice: que estava comigo
  rationale: Expressa de modo natural a presença de Uriel ao lado de Enoque.
- source_word: ዘይመርሐኒ
  choice: me guiava
  rationale: O imperfeito comunica adequadamente a ação contínua de conduzir Enoque durante a visão.
- source_word: በእንተ መኑ ትስእል
  choice: a respeito de quem você está perguntando
  rationale: Reproduz o tópico introduzido por በእንተ e o sentido direto do verbo de perguntar.
- source_word: ወበእንተ መኑ ትጠይቅ
  choice: e a respeito de quem está indagando
  rationale: Mantém a repetição deliberada com um verbo português próximo, mas não idêntico.
- source_word: ወትጽህቅ
  choice: e procurando saber
  rationale: No contexto, comunica busca insistente ou curiosidade investigativa sem impor a ideia mais específica de aflição emocional; a incerteza de nuance é registrada em nota.
theological_decisions:
- issue: Tradução da categoria angelológica ቅዱሳን መላእክት
  choice: santos anjos
  alternative: anjos sagrados
  rationale: “Santos anjos” conserva a terminologia religiosa tradicional e a categoria celestial significativa no contexto enoquiano, sem reduzir o adjetivo a mero ornamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o paralelismo das perguntas e evita interpretar o último verbo como preocupação emocional inequívoca.
