base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/001.yaml
  text: And I went on until I came to a place where nothing is made[a].
translation:
  language: pt
  text: E continuei até chegar a um lugar onde nada é feito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase também pode ser entendida como “um lugar onde nada havia sido feito” ou “onde nada existia”. O ge’ez é conciso e ressalta a completa ausência de coisas formadas naquele lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: አድኩ
  choice: continuei
  rationale: Expressa a continuação do deslocamento de Enoque na visão, com fluidez narrativa em português.
- source_word: እስከነ
  choice: até chegar
  rationale: Marca o avanço até o destino; a formulação explicita naturalmente a chegada sem acrescentar conteúdo indevido.
- source_word: ኀበ
  choice: a um lugar
  rationale: Indica o destino do movimento. A explicitação de “lugar” torna a relação locativa clara e corresponde ao sentido contextual.
- source_word: አልቦቱ
  choice: onde nada é
  rationale: Preserva a construção existencial negativa e o caráter desolador do lugar, em ligação com o particípio verbal seguinte.
- source_word: ዘይትገበር
  choice: feito
  rationale: Mantém o sentido amplo de fazer ou formar. “Criado” introduziria uma precisão cosmológica que o ge’ez não exige.
theological_decisions:
- issue: Natureza do destino na visão de Enoque
  choice: um lugar onde nada é feito
  alternative: um lugar onde nada havia sido feito; um lugar onde nada existia
  rationale: A tradução mantém a ausência de coisas feitas ou formadas sem transformar explicitamente o lugar em uma afirmação metafísica de não existência absoluta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Continuei” evita rigidez, enquanto “nada é feito” conserva a estranheza e a ambiguidade temporal da expressão de origem.
