base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/003.yaml
  text: And there I saw seven stars of heaven[a], bound together in it, like great mountains[c][b], and burning with fire.
translation:
  language: pt
  text: E ali vi sete estrelas do céu[a], presas juntas naquele lugar[b], como grandes montanhas, e ardendo em fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A imagem das estrelas presas provavelmente tem valor simbólico e pode representar seres celestiais sob juízo; o texto, porém, diz literalmente “estrelas”.
    reason: cross_reference
  - marker: b
    text: 'A leitura ge''ez por trás de “juntas” é difícil, mas provavelmente funciona como advérbio de “presas”: isto é, “presas juntas”. “Naquele lugar” remete ao lugar descrito no contexto anterior.'
    reason: textual_variant
lexical_decisions:
- source_word: ርኢኩ
  choice: vi
  rationale: Forma direta e natural para o relato visionário em primeira pessoa.
- source_word: ሰብዐተ ከዋክብተ ሰማይ
  choice: sete estrelas do céu
  rationale: Mantém a imagem cósmica e a construção genitiva sem identificar interpretativamente as estrelas como anjos.
- source_word: እሱራነ
  choice: presas
  rationale: Expressa sujeição ou confinamento sem especificar correntes ou prisão não explicitadas no texto.
- source_word: በላዕሌሁ
  choice: naquele lugar
  rationale: No contexto, o pronome remete ao lugar anteriormente descrito; esta formulação transmite o sentido locativo de 'nele' sem sugerir que as estrelas pairavam acima dele.
- source_word: ኅቡረ
  choice: juntas
  rationale: Trata o termo difícil como advérbio que modifica 'presas', em acordo com o sentido provável de 'juntas', evitando introduzir um segundo ato de reunião.
- source_word: ከመ አድባር ዐበይት
  choice: como grandes montanhas
  rationale: Preserva integralmente a comparação apocalíptica surpreendente.
- source_word: ወበእሳት እንዘ ይነዱ
  choice: e ardendo em fogo
  rationale: Conserva a vividez participial e a repetição enfática da imagem ígnea.
theological_decisions:
- issue: Se as sete estrelas devem ser identificadas explicitamente como seres angelicais sob juízo
  choice: Manter “sete estrelas do céu” no texto principal
  alternative: “sete anjos do céu” ou “sete seres celestiais”
  rationale: Embora estrelas possam representar seres angelicais na literatura enoquiana, o texto diz literalmente “estrelas”; a tradução preserva a imagem e deixa sua força simbólica em aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a estranheza própria da visão apocalíptica e evita resolver sua simbologia no texto principal.
