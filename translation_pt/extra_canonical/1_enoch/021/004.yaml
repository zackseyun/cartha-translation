base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/004.yaml
  text: At that time I said[a], “For what sin have they been bound[c][b], and for what reason have they been cast here?”
translation:
  language: pt
  text: 'Naquele momento, eu disse[a]: “Por qual pecado eles foram amarrados, e por que razão foram lançados aqui[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perguntei”, pois a pergunta direta que se segue pode indicar indagação, embora o verbo seja “disse”.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ter o sentido de “deixados” ou “abandonados aqui”; neste contexto de juízo, “lançados aqui” preserva melhor a ideia de deposição punitiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: Naquele momento
  rationale: Expressa a locução temporal narrativa sem acrescentar a conjunção ausente no texto ge'ez; é natural em português e mantém a transição imediata da visão para a fala de Enoque.
- source_word: እቤ
  choice: eu disse
  rationale: Segue de perto o verbo ge'ez que introduz a fala. Embora a frase seguinte seja interrogativa e permita 'perguntei', 'disse' preserva melhor a forma explícita do testemunho textual.
- source_word: በእንተ፡ አይ፡ ኃጢአት
  choice: Por causa de que pecado
  rationale: Preserva tanto o valor causal da preposição quanto a referência singular ao pecado, sem transformar a pergunta em uma declaração de culpa mais específica.
- source_word: ተአስሩ
  choice: foram amarrados
  rationale: Mantém a imagem concreta e passiva de seres atados ou presos. Evita 'aprisionados', que interpretaria a ação de modo mais abstrato, e 'acorrentados', que acrescentaria correntes não mencionadas.
- source_word: ወበእንተ፡ ምንት
  choice: e por que razão
  rationale: Conserva a conjunção e o paralelismo interrogativo-causal com a primeira oração em português corrente.
- source_word: ዝየ
  choice: aqui
  rationale: Reproduz diretamente o advérbio dêitico, mantendo a imediatez espacial da cena visionária.
- source_word: ተገደፉ
  choice: foram lançados
  rationale: No contexto de juízo e confinamento, 'lançados' transmite a deposição punitiva sem excluir totalmente a possível nuance lexical de terem sido deixados ou abandonados no lugar.
theological_decisions:
- issue: Natureza do castigo descrito
  choice: Manter as imagens concretas de serem amarrados e lançados em um lugar
  alternative: Interpretar os verbos genericamente como 'aprisionados e abandonados'
  rationale: A cena apocalíptica descreve ações visíveis de confinamento e juízo. A tradução conserva essas imagens sem definir além do texto o instrumento da prisão nem a condição exata dos castigados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do ge'ez foram preservados sem acrescentar a conjunção inicial que não consta do texto-fonte.
