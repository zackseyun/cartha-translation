base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/007.yaml
  text: 'And from there I went to another place[a], more terrible than this, and I saw a fearful work: a great fire was there, burning and blazing, and the place had a cleft reaching to the abyss, full of great pillars of fire descending; neither its measure nor its size was I able to see[c][b], and I was not able to look at it.'
translation:
  language: pt
  text: 'E dali fui para outro lugar, mais terrível do que este, e vi uma obra aterradora: havia ali um grande fogo, que ardia e flamejava; o lugar tinha uma fenda que chegava até o abismo[a], cheia de grandes colunas de fogo que desciam[c]. Não consegui ver nem a sua medida nem a sua grandeza[b], e não pude olhar para aquilo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase em ge'ez que descreve o lugar aberto para baixo é difícil. “Uma fenda que chegava até o abismo” traduz cautelosamente a ideia de uma fissura ou abertura que se estende a uma profundidade extrema.
    reason: textual_variant
  - marker: b
    text: 'Ou: “Não consegui discernir nem a sua medida nem a sua magnitude”. A ideia central é a incapacidade de Enoque de compreender as dimensões do que via.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “com grandes colunas de fogo descendo”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወእምህየ፡ ሖርኩ፡ ካልአ፡ መካነ
  choice: E dali fui para outro lugar
  rationale: Mantém a progressão do itinerário visionário em linguagem portuguesa clara e direta.
- source_word: እምዝ፡ ዘይገርም
  choice: mais terrível do que este
  rationale: Conserva a comparação com a cena anterior e, no contexto de juízo, expressa temor sem reduzir o termo a mera admiração.
- source_word: ወርኢኩ፡ ግብረ፡ ግሩመ
  choice: e vi uma obra aterradora
  rationale: Preserva o substantivo concreto ግብር, ‘obra/feito’, e a força apocalíptica de ግሩም, embora a expressão seja incomum em português.
- source_word: እሳት፡ ዐቢይ
  choice: um grande fogo
  rationale: Tradução simples e digna, sem ampliar o sentido do adjetivo.
- source_word: ዘይነድድ፡ ወያንበለብል
  choice: que ardia e flamejava
  rationale: Reproduz a dupla descrição verbal do fogo ativo e mantém a vivacidade da imagem.
- source_word: ወመምተርተ፡ ቦቱ፡ መካኑ፡ እስከ፡ ቀላይ
  choice: o lugar tinha uma fenda que chegava até o abismo
  rationale: Representa cautelosamente a cláusula difícil como uma abertura que se estende a uma profundidade extrema.
- source_word: ፍጹም፡ አዕማደ፡ እሳት፡ ዐበይተ፡ ዘይወርዶሙ
  choice: cheia de grandes colunas de fogo que desciam
  rationale: Toma ፍጹም no sentido de ‘cheia’, apoiado pelo grego πλήρης, e conserva tanto a imagem vertical das colunas quanto seu movimento descendente.
- source_word: ወኢእምጣኖ፡ ወኢዕበዮ፡ አክሀልኩ፡ ነጽሮ
  choice: Não consegui ver nem a sua medida nem a sua grandeza
  rationale: Mantém os dois substantivos dimensionais e a incapacidade do visionário de apreender a extensão da cena.
- source_word: ወስእነኩ፡ [ነጽሮ፡] ዐይኖ
  choice: e não pude olhar para aquilo
  rationale: Expressa a incapacidade visual final de modo natural, sem depender da repetição textualmente instável entre colchetes.
theological_decisions:
- issue: Natureza do cenário
  choice: Descrever o lugar visionário aterrador mediante suas imagens de fogo, profundidade e dimensões incompreensíveis, sem lhe dar um nome doutrinário.
  alternative: Identificá-lo explicitamente como inferno, mundo dos mortos ou prisão cósmica.
  rationale: O versículo não nomeia o lugar. A tradução preserva a tensão e evita impor uma identificação derivada de sistemas teológicos ou do contexto posterior.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom elevado adequado à visão apocalíptica. “Obra aterradora” é deliberadamente mais formal para preservar o substantivo concreto do ge'ez; as demais construções evitam arcaísmos e identificações doutrinárias não expressas.
