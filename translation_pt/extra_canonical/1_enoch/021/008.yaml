  text: And at that time I said[a], “How terrible this place is[c][b], and grievous to behold.”
translation:
  language: pt
  text: 'Naquele tempo, eu disse: “Como é terrível este lugar e penoso de contemplar!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como este lugar é temível e doloroso de se ver!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ ጊዜ
  choice: Naquele tempo
  rationale: Mantém a fórmula temporal solene e a ligação com a sequência da visão, em português natural.
- source_word: እቤ
  choice: eu disse
  rationale: Introduz diretamente a fala; esta forma é clara e evita acrescentar uma fórmula redundante em português.
- source_word: አፎ
  choice: Como é
  rationale: Entendido como partícula exclamativa, e não como o substantivo “boca”; assim, introduz corretamente a exclamação sobre o lugar.
- source_word: ግሩም
  choice: terrível
  rationale: No contexto de juízo e temor, comunica assombro ameaçador, sem a possível conotação positiva de “admirável”.
- source_word: ዝንቱ መካን
  choice: este lugar
  rationale: Reproduz de modo direto a expressão dêitica e se ajusta à topografia da visão.
- source_word: ወሕሙም
  choice: e penoso
  rationale: Conserva a ideia de aflição e sofrimento sem fundi-la com o temor expresso pelo adjetivo anterior.
- source_word: ለነጽሮ
  choice: de contemplar
  rationale: Expressa o efeito do lugar sobre quem o vê e mantém o registro solene da narrativa visionária.
theological_decisions:
- issue: Sentido de ግሩም no cenário apocalíptico de juízo
  choice: terrível
  alternative: temível
  rationale: “Terrível” preserva a atmosfera de pavor da visão; “temível” também é possível, mas é um pouco menos intenso.
- issue: Análise de አፎ na fórmula exclamativa
  choice: Como é
  alternative: como
  rationale: A leitura exclamativa preserva a sintaxe e o sentido do etíope sem introduzir a imagem indevida de “minha boca”.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A exclamação conserva a intensidade da reação de Enoque sem recorrer a linguagem arcaizante.
