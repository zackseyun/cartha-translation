base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/009.yaml
  text: And at that time Uriel—one of the holy angels[a], who was with me—answered me and said to me, “Enoch,”
translation:
  language: pt
  text: 'Naquele tempo, Uriel, um dos santos anjos, que estava comigo, respondeu-me e disse-me: “Enoque,”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O versículo termina com Uriel dirigindo-se diretamente a Enoque; a fala continua no versículo seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: Naquele tempo
  rationale: Preserva a fórmula temporal narrativa e o tom elevado do relato apocalíptico, sem soar arcaico em português.
- source_word: አውሥአኒ
  choice: respondeu-me
  rationale: Mantém o sentido próprio de responder, mesmo que a pergunta ou situação motivadora esteja no contexto anterior.
- source_word: ኡርኤል
  choice: Uriel
  rationale: O nome próprio é transliterado, não traduzido.
- source_word: ፩እምቅዱሳን፡ መላእክት
  choice: um dos santos anjos
  rationale: Expressa naturalmente em português a pertença de Uriel ao grupo dos anjos santos, sem acrescentar elaboração doutrinária.
- source_word: እንዘ፡ ምስሌየ፡ ሀሎ
  choice: que estava comigo
  rationale: Reproduz com fluidez a construção descritiva que qualifica Uriel.
- source_word: ወይቤለኒ
  choice: e disse-me
  rationale: Conserva a fórmula de introdução da fala e a repetição narrativa presente no ge'ez.
- source_word: ሄኖክ
  choice: Enoque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português; a pontuação marca o valor vocativo.
theological_decisions:
- issue: Tradução de ቅዱሳን፡ መላእክት
  choice: santos anjos
  alternative: anjos de santidade
  rationale: “Santos anjos” é a expressão mais natural em português e preserva a identificação cosmológica do texto sem impor uma explicação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preservação deliberada da repetição “respondeu-me e disse-me”, característica da narração do texto-fonte. O marcador foi colocado após o vocativo, ao qual a nota efetivamente se refere.
