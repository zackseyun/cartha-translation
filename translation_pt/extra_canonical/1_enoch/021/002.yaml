  text: 'And there I saw a fearful work: I saw neither the heavens above nor the firmly founded earth, but a place unformed and terrible.'
translation:
  language: pt
  text: 'E ali vi uma obra terrível: não vi nem os céus acima, nem a terra firmemente estabelecida, mas um lugar informe e terrível.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ
  choice: obra
  rationale: Preserva o sentido básico de algo feito ou produzido, sem reduzi-lo a uma simples «coisa».
- source_word: ግሩመ / ግሩምም
  choice: terrível
  rationale: O termo exprime temor ou espanto; «terrível» mantém a repetição e a força da visão.
- source_word: ሱርርተ
  choice: firmemente estabelecida
  rationale: Comunica a ideia de estar fundada ou fixada com firmeza.
- source_word: ዘአኮ፡ ድልወ
  choice: informe
  rationale: A expressão nega que o lugar esteja preparado, ordenado ou devidamente constituído; «informe» preserva essa indeterminação sem acrescentar a noção mais específica de caos.
