base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/006.yaml
  text: These are among the stars that transgressed the command of the Lord[a], and they are bound here until ten thousand years are completed[e][d][c][b], the number of the days of their sins.
translation:
  language: pt
  text: Estes são dentre as estrelas que transgrediram o mandamento do Senhor[a] e estão presos aqui até se completarem dez mil anos[b], o número dos dias de seus pecados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “procedentes das estrelas”. A preposição ge''ez pode indicar tanto origem quanto pertencimento a um grupo.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “dez mil anos” também pode representar um imenso período determinado de punição; a tradução mantém literalmente o número do texto ge'ez.
    reason: cultural_note
  - marker: c
    text: Literalmente, “o número dos dias de seus pecados”. A expressão preserva a imagem de uma duração contada em relação às transgressões deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ ውእቶሙ
  choice: Estes são
  rationale: Reproduz de modo direto e natural a construção demonstrativa com cópula e mantém a força dêitica da explicação.
- source_word: እምነ ከዋክብት
  choice: dentre as estrelas
  rationale: Exprime naturalmente a relação partitiva, evitando que a frase seja entendida apenas como indicação de localização; a possibilidade de origem é preservada em nota.
- source_word: እለ ኃለፉ ትእዛዘ እግዚአብሔር
  choice: que transgrediram o mandamento do Senhor
  rationale: O verbo tem o sentido básico de passar além, mas neste contexto jurídico-moral significa transgredir; “mandamento” conserva o tom de autoridade divina.
- source_word: እግዚአብሔር
  choice: o Senhor
  rationale: Representa o título divino de acordo com o uso bíblico corrente e destaca a autoridade daquele cujo mandamento foi violado.
- source_word: ወተአስሩ በዝየ
  choice: e estão presos aqui
  rationale: Mantém o estado atual de confinamento e a imagem punitiva do verbo passivo, em português claro e digno.
- source_word: እስከ ሶበ ይትፌጸም
  choice: até se completarem
  rationale: Marca o termo final do confinamento e conserva a ideia de cumprimento ou conclusão do período.
- source_word: ትእልፊተ ዓም
  choice: dez mil anos
  rationale: Mantém literalmente a grande duração numerada do testemunho ge'ez sem acrescentar artigo definido ausente na expressão.
- source_word: ኈልቈ መዋዕለ ኃጢአቶሙ
  choice: o número dos dias de seus pecados
  rationale: Preserva “número”, “dias” e “pecados”, mantendo a imagem apocalíptica de uma duração contada em relação às transgressões.
theological_decisions:
- issue: Identidade das “estrelas”
  choice: Manter “estrelas” como a designação visionária de seres celestes submetidos a juízo.
  alternative: Traduzir interpretativamente como “anjos” ou entender como astros literais personificados.
  rationale: O contexto de 1 Enoque associa estrelas a seres celestes, mas o texto usa a imagem “estrelas”; conservá-la evita eliminar a ambiguidade simbólica.
- issue: Valor da expressão temporal
  choice: Traduzir literalmente “dez mil anos” como um período determinado de confinamento.
  alternative: Entender a expressão apenas como uma era imensamente longa e indefinida.
  rationale: O testemunho ge'ez apresenta uma duração numerada explícita. A tradução a conserva, enquanto a nota reconhece seu possível valor idiomático.
- issue: Relação da frase final com o período
  choice: Conservar a aposição “o número dos dias de seus pecados”.
  alternative: Explicitar que a punição foi medida de acordo com os pecados deles.
  rationale: A sintaxe concisa do original permite uma relação explicativa, mas não a desenvolve; a formulação literal preserva a tensão e a imagem sem impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Dentre” esclarece a relação partitiva sem substituir a imagem visionária das estrelas. A ordem e a concisão da frase final foram mantidas para não resolver uma relação sintática e teológica que o ge'ez deixa compacta.
