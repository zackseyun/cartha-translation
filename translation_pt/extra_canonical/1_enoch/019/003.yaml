base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/003.yaml
  text: And I[a], Enoch, alone saw the vision, the ends of all things[b]; and no human being will see as I have seen.
translation:
  language: pt
  text: E somente eu, Enoque,[a] vi a visão, os confins de todas as coisas[b]; e nenhum ser humano verá como eu vi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se encontra a forma “Henoc”.
    reason: previous_rendering
  - marker: b
    text: 'Ou: “as extremidades de tudo”. A expressão em ge’ez pode indicar os limites mais remotos e ter sentido tanto espacial quanto cósmico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አርአያ
  choice: visão
  rationale: No contexto apocalíptico, designa algo contemplado com caráter revelador; “visão” conserva melhor essa força do que “aparência” ou “espetáculo”.
- source_word: ባሕቲትየ
  choice: sozinho
  rationale: Destaca Enoque como o único receptor dessa experiência, em formulação natural e concisa em português.
- source_word: አጽናፈ ኵሉ
  choice: os confins de todas as coisas
  rationale: “Confins” preserva a ideia de extremidades ou limites mais remotos e permite tanto a dimensão espacial quanto a cósmica, sem reduzir a expressão ao fim temporal de tudo.
- source_word: አልቦ ዘይሬኢ እምሰብእ
  choice: nenhum ser humano verá
  rationale: Expressa a negação de uma visão humana comparável e evita restringir desnecessariamente a referência aos homens do sexo masculino.
- source_word: ከመ አነ ርኢኩ
  choice: como eu vi
  rationale: Mantém a comparação direta e o testemunho pessoal de Enoque, com o aspecto concluído do ato de ver.
- source_word: ሄኖክ
  choice: Enoque
  rationale: É a forma portuguesa tradicional e amplamente reconhecida do nome, adequada ao título e à personagem.
theological_decisions:
- issue: Alcance da revelação singular de Enoque
  choice: Enoque afirma ter contemplado, de modo exclusivo, uma visão cósmica que alcança “os confins de todas as coisas”.
  alternative: A expressão pode referir-se especificamente aos extremos físicos do mundo ou, menos provavelmente, ao desfecho de todas as coisas.
  rationale: O ge’ez conserva uma imagem ampla de limites ou extremidades. A tradução mantém essa tensão espacial e cósmica, sem convertê-la em uma afirmação exclusivamente geográfica ou temporal.
- issue: Relação entre “a visão” e “os confins”
  choice: 'Mantêm-se em aposição: “a visão, os confins de todas as coisas”.'
  alternative: Pode-se entender “a visão dos confins de todas as coisas”.
  rationale: A construção da fonte é compacta e admite que a segunda expressão explique o conteúdo da visão. A pontuação preserva essa relação sem inserir uma ligação gramatical mais explícita do que a existente.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe levemente solene apropriada à literatura apocalíptica. “Confins” conserva a imagem cósmica sem soar excessivamente técnica; “ser humano” oferece abrangência natural.
