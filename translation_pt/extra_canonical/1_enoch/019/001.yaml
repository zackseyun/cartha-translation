base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/001.yaml
  text: And Uriel said to me[a], “Here shall stand the angels who joined themselves with women; and their spirits, having taken on many forms, defile humankind and lead them astray so that they sacrifice to demons as to gods, until the day of the great judgment[d][c][b], on which they will be judged until they are finished.”
translation:
  language: pt
  text: 'E Uriel me disse: “Aqui permanecerão os anjos que se uniram a mulheres; e os espíritos deles[a], tendo assumido muitas formas[b], contaminaram a humanidade e a desencaminham, para que ofereça sacrifícios aos demônios como se fossem deuses, até o dia do grande julgamento, quando eles serão julgados até que cheguem ao fim[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “os espíritos deles” foi mantida literalmente. O texto não esclarece se ela se refere aos espíritos dos próprios anjos caídos, aos espíritos ligados à descendência deles ou às suas atuações espirituais.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “tendo se tornado muitas aparências”. A expressão em ge''ez é difícil e pode indicar manifestações variadas pelas quais esses espíritos corrompem a humanidade.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “até que sejam levados ao seu fim” ou “até que tudo se complete para eles”. A cláusula ressalta a plena execução do julgamento, mas sua nuance exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተደሚሮሙ
  choice: se uniram
  rationale: Preserva a ideia reflexiva de associação ou união com mulheres sem explicitar além do que o versículo afirma.
- source_word: ይቀውሙ
  choice: permanecerão
  rationale: Expressa o estado e a localização contínua dos anjos punidos no cenário visionário; em português, é mais natural que a tradução estritamente literal “ficarão de pé”.
- source_word: መናፍስቲሆሙ
  choice: os espíritos deles
  rationale: Mantém literalmente o possessivo e não decide se são os espíritos dos anjos, de sua descendência ou agentes espirituais associados a eles.
- source_word: ብዙኃ ራእየ ከዊኖሙ
  choice: tendo assumido muitas formas
  rationale: Comunica as variadas manifestações sugeridas pela difícil expressão ligada a aparência ou visão e a tornar-se.
- source_word: አርኰስዎሙ
  choice: contaminaram
  rationale: Conserva as conotações morais e cultuais de impureza, além de refletir o aspecto perfeito da forma verbal.
- source_word: ለሰብእ
  choice: a humanidade
  rationale: Representa o coletivo humano sem restringi-lo ao sexo masculino.
- source_word: ያስሕትዎሙ
  choice: a desencaminham
  rationale: Mantém o sentido causativo e a passagem do ato anterior de contaminação para a atividade contínua de induzir ao erro.
- source_word: ይሡዑ
  choice: ofereça sacrifícios
  rationale: Traduz com precisão o ato cultual e concorda naturalmente com o coletivo singular “humanidade”.
- source_word: አጋንንት
  choice: demônios
  rationale: É o equivalente português direto e estabelecido para esses seres no contexto apocalíptico.
- source_word: ከመ አማልክት
  choice: como a deuses
  rationale: 'Preserva a comparação cultual: os demônios recebem sacrifícios como os oferecidos a deuses.'
- source_word: ዕለተ ዐባይ ኵነኔ
  choice: o dia do grande julgamento
  rationale: Mantém a ordem e a solenidade da fórmula apocalíptica do ge'ez.
- source_word: ይትኴነኑ
  choice: serão julgados
  rationale: Preserva a voz passiva e não substitui julgamento por condenação, evitando antecipar interpretativamente o resultado.
- source_word: እስከ ይትፈጸሙ
  choice: até que seu fim se cumpra
  rationale: Expressa conclusão ou consumação sem definir dogmaticamente a modalidade da pena final.
theological_decisions:
- issue: Identidade dos agentes em “os espíritos deles”
  choice: Manter literalmente “os espíritos deles”, com nota explicativa.
  alternative: “os espíritos provenientes deles” ou “os espíritos de sua descendência”
  rationale: O referente do possessivo é ontologicamente ambíguo no texto e não deve ser identificado pela tradução com uma interpretação específica.
- issue: Sentido da cláusula final
  choice: “até que seu fim se cumpra”
  alternative: “até que sua condenação se complete” ou “até que sejam consumidos”
  rationale: A expressão indica conclusão, mas não determina com segurança aniquilação, duração infinita ou uma modalidade particular de punição.
- issue: Sequência temporal da corrupção e do engano
  choice: “contaminaram ... e a desencaminham”
  alternative: “contaminam ... e desencaminham” ou “contaminaram ... e desencaminharam”
  rationale: A combinação de passado e presente procura representar a mudança do perfeito ge'ez para o imperfeito, preservando a contaminação já ocorrida e a atividade enganadora contínua.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A formulação conserva o tom visionário e solene, evita arcaísmos desnecessários e mantém explícitas as ambiguidades relativas aos espíritos e à consumação do julgamento.
