review_pass:
  verdict: revise
  source_fidelity: 'A relação genitiva foi corretamente expressa: «dos anjos que se desviaram» modifica «mulheres». Contudo, o último termo, ሰላማዊያት, é tradicionalmente entendido neste contexto enóquico como «sereias» (isto é, seres míticos), e a construção resulta em «se tornarão sereias», não meramente «como seres pacíficos». A tradução literalizante «seres pacíficos» não comunica adequadamente esse sentido contextual e cria uma comparação que a leitura tradicional do versículo não exige.'
  naturalness: «E as mulheres dos anjos que se desviaram se tornarão sereias» é natural, claro e mantém um registro sóbrio e apocalíptico. Evita a expressão opaca «seres pacíficos».
  terminology: «Mulheres» preserva corretamente a amplitude de አንስት; «esposas» permanece uma alternativa legítima em nota. «Anjos que se desviaram» é adequado. «Sereias» deve ser tratado como a leitura contextual do termo final, sem importar características posteriores ou específicas das sereias para o texto.
  issues:
  - severity: high
    issue: O termo final foi traduzido como «seres pacíficos» e subordinado a «como».
    rationale: No contexto de 1 Enoque 19:2 e da tradição de tradução da expressão ge’ez ሰላማዊያት, o referente é «sereias». A versão atual obscurece o referente mítico e altera a predicação em uma comparação vaga.
  - severity: medium
    issue: A nota c apresenta apenas a explicação «pacíficos/estado de paz».
    rationale: Essa nota reforça uma análise lexical que não dá conta da leitura contextual tradicional «sereias»; deve ser substituída por uma nota que identifique o sentido sem acrescentar detalhes mitológicos não expressos.
  revised_text: E as mulheres[a] dos anjos que se desviaram se tornarão sereias.[b]
  revised_footnotes:
  - marker: a
    text: Ou “esposas”. O termo ge’ez pode designar mulheres em geral ou esposas especificamente.
    reason: lexical_alternative
  - marker: b
    text: O termo ge’ez é tradicionalmente entendido neste contexto como “sereias”. O texto não especifica as características desses seres.
    reason: alternative_reading
  revision_rationale: A revisão conserva a sintaxe genitiva corretamente reconhecida no rascunho («mulheres dos anjos que se desviaram») e restaura o sentido contextual tradicional do termo final. Não explora nem define a figura das sereias além do que o versículo permite.
