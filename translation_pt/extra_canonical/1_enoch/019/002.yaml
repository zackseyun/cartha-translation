base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/002.yaml
  text: And their wives[a], the angels who went astray[c][b], will become like peaceful ones.
translation:
  language: pt
  text: E as mulheres[a] dos anjos que se desviaram[b] se tornarão como seres pacíficos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esposas”. O termo ge’ez pode designar mulheres em geral ou esposas especificamente.
    reason: lexical_alternative
  - marker: b
    text: A construção também pode ser entendida de modo mais literal como “as mulheres deles — os anjos que se desviaram”.
    reason: alternative_reading
  - marker: c
    text: A expressão “como seres pacíficos” é difícil. “Pacíficos” pode designar seres caracterizados pela paz ou indicar o estado de paz que essas mulheres passarão a ter.
    reason: alternative_reading
lexical_decisions:
- source_word: አንስትያሆሙኒ
  choice: E as mulheres
  rationale: O substantivo pode significar “mulheres” ou, conforme a relação indicada pelo contexto, “esposas”. “Mulheres” preserva a amplitude lexical, enquanto a nota registra a leitura conjugal; a partícula enclítica é representada por “E” no fluxo da oração.
- source_word: ለስሑታን፡ መላእክት
  choice: dos anjos que se desviaram
  rationale: Toma-se a sequência como uma construção genitiva que identifica a quem as mulheres estão ligadas. “Que se desviaram” conserva o sentido moral e direcional de ስሑታን sem reduzi-lo simplesmente a “pecadores”.
- source_word: ተከመ
  choice: como
  rationale: A partícula marca comparação, não identidade essencial.
- source_word: ሰላማዊያት
  choice: seres pacíficos
  rationale: A forma adjetival plural derivada de “paz” é mantida substantivada. “Seres” torna a expressão inteligível em português sem especificar quem são esses pacíficos.
- source_word: ይከውና
  choice: se tornarão
  rationale: Expressa vir a ser ou tornar-se, preservando a ideia de mudança futura.
theological_decisions:
- issue: Natureza da transformação das mulheres
  choice: Elas se tornarão como seres pacíficos, em uma transformação comparativa.
  alternative: Elas se tornarão anjos; ou entrarão em paz junto aos anjos.
  rationale: A partícula comparativa sustenta semelhança, não identificação ontológica. O referente de “seres pacíficos” permanece indeterminado.
- issue: Relação sintática entre mulheres e anjos desviados
  choice: “dos anjos que se desviaram” modifica “mulheres”.
  alternative: “Seus esposos, isto é, os anjos que se desviaram”; ou “como os anjos pacíficos”.
  rationale: A leitura genitiva oferece a construção portuguesa mais coerente para ለስሑታን፡ መላእክት e evita transformar መላእክት no termo da comparação, embora a formulação etíope transmitida seja difícil.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém a linguagem apocalíptica e a ambiguidade do termo para “mulheres/esposas”, sem afirmar que elas se transformam literalmente em anjos.
