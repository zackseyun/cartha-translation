base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/006.yaml
  text: But you, formerly, were spiritual beings, living an eternal life that does not die throughout all the generations of the world.
translation:
  language: pt
  text: Mas vocês anteriormente eram seres espirituais[a], vivendo uma vida eterna que não morre ao longo de todas as gerações do mundo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espíritos”.'
    reason: lexical_alternative
  - marker: b
    text: “Mundo” também pode ser entendido como “era”; nesse caso, a frase pode ter o sentido de “por todas as gerações, para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ቀዳሚ
  choice: anteriormente
  rationale: Marca o contraste temporal entre a condição original dos Vigilantes e sua corrupção posterior, sem impor uma sequência cosmológica mais específica.
- source_word: ኮንክሙ
  choice: eram
  rationale: O sentido copulativo apresenta a condição anterior dos destinatários; «eram» é natural e fiel em português.
- source_word: መንፈሳውያነ
  choice: seres espirituais
  rationale: Preserva o valor descritivo do termo e a força predicativa da frase sem reduzi-lo indevidamente a um termo técnico; «espíritos» continua possível.
- source_word: ሕያዋነ ሕይወት ዘለዓለም
  choice: vivendo uma vida eterna
  rationale: Mantém a construção cognata do ge'ez, literalmente relacionada a «viver uma vida», e conserva o substantivo explícito «vida».
- source_word: ዘኢይመውት
  choice: que não morre
  rationale: Reproduz a oração relativa e sua formulação enfática, sem suavizá-la para uma abstração como «imortal».
- source_word: ለኵሉ ትውልደ ዓለም
  choice: por todas as gerações do mundo
  rationale: Expressa duração ao longo de todas as gerações e mantém «mundo» como sentido direto possível de ዓለም, sem eliminar a alternativa «era».
theological_decisions:
- issue: Se a condição original dos Vigilantes deve ser traduzida como «espíritos» ou por uma descrição mais ampla
  choice: seres espirituais
  alternative: espíritos; seres de natureza espiritual
  rationale: A leitura conserva o contraste ontológico do contexto, mas evita acrescentar uma precisão doutrinária posterior que o termo ge'ez não exige.
- issue: Sentido de ዓለም na expressão final
  choice: mundo
  alternative: era; eternidade
  rationale: «Mundo» preserva o referente concreto da sequência de gerações, enquanto a nota registra a amplitude semântica que pode dar à frase o sentido de duração perpétua.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção incomum «vivendo uma vida eterna que não morre» foi mantida deliberadamente para refletir a repetição enfática e a relação gramatical do original, sem substituir «vida» por «imortalidade».
