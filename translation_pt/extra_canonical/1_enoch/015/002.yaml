base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/002.yaml
  text: 'And go[a], say to the watchers of heaven who have sent you to petition on their behalf: ''You ought to petition on behalf of men[b], and not men on your behalf.'''
translation:
  language: pt
  text: 'Vá e diga aos Vigilantes do céu, que enviaram você para pedir em favor deles: “Vocês deveriam pedir em favor da humanidade, e não a humanidade deveria pedir em favor de vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሑር
  choice: vá
  rationale: Imperativo de movimento dirigido a Enoque; “vá” é direto, natural e preserva a força da ordem.
- source_word: በሎሙ
  choice: diga aos
  rationale: Reproduz a introdução do discurso e o objeto indireto plural de modo idiomático em português.
- source_word: ለትጉሃነ ሰማይ
  choice: aos Vigilantes do céu
  rationale: “Vigilantes” preserva o título técnico dessas figuras angélicas na narrativa, em vez de substituí-lo pelo termo genérico “anjos”.
- source_word: እለ ፈነዉከ
  choice: que enviaram você
  rationale: Identifica os Vigilantes como aqueles que incumbiram Enoque; o pretérito perfeito é natural em português e mantém a ação concluída.
- source_word: ትስአል በእንቲአሆሙ
  choice: para pedir em favor deles
  rationale: O verbo designa pedir ou solicitar. “Pedir em favor” mantém a ideia de súplica representativa sem impor o sentido técnico de “interceder”.
- source_word: አንትሙ መፍትው ትስአሉ
  choice: Vocês é que deveriam pedir
  rationale: “Deveriam” expressa a conveniência ou obrigação censurada no contexto, e a construção “é que” realça a inversão indevida dos papéis.
- source_word: በእንተ ሰብእ
  choice: em favor da humanidade
  rationale: ሰብእ tem sentido coletivo neste contexto. “Humanidade” comunica inclusão de todos os seres humanos e permite repetir com clareza o termo na cláusula seguinte.
- source_word: ወአኮ ሰብእ በእንቲአክሙ
  choice: e não a humanidade em favor de vocês
  rationale: 'Preserva a repetição e o contraste central: os seres celestes deveriam pedir pelos humanos, não buscar que os humanos pedissem por eles.'
theological_decisions:
- issue: Tradução do título das figuras angélicas
  choice: Vigilantes do céu
  alternative: anjos do céu; vigilantes celestes
  rationale: O título é programático no Livro dos Vigilantes. Mantê-lo visível preserva a categoria literária e apocalíptica sem reduzi-la a “anjos”.
- issue: Força da repreensão quanto à petição
  choice: Vocês é que deveriam pedir em favor da humanidade, e não a humanidade em favor de vocês
  alternative: É próprio que vocês intercedam pelos seres humanos, não que eles intercedam por vocês
  rationale: A formulação conserva a censura e a inversão entre seres celestes e humanos, mas não transforma o verso em uma doutrina sistemática sobre intercessão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você/vocês” por naturalidade; conserva “Vigilantes” como título técnico. “Pedir em favor” foi preferido a “interceder” para refletir a amplitude lexical do verbo ge'ez e evitar especificidade teológica indevida.
