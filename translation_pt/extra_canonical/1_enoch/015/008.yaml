base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/008.yaml
  text: And now[a], the giants who were born from spirits and flesh will be called evil spirits upon the earth[b], and on the earth will be their dwelling.
translation:
  language: pt
  text: E agora, os gigantes[a] que nasceram de espíritos e carne serão chamados espíritos maus sobre a terra[b], e na terra será a morada deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O substantivo inicial é entendido pelo contexto como referência aos gigantes, descendentes dos Vigilantes e das mulheres humanas; no nível lexical, uma tradução mais genérica, como “descendentes”, também é possível.
    reason: lexical_alternative
  - marker: b
    text: A repetição de “terra” foi mantida para refletir a formulação em ge’ez e enfatizar que esses espíritos pertencem ao âmbito terreno, não ao celestial.
    reason: cultural_note
lexical_decisions:
- source_word: ረዓይት
  choice: os gigantes
  rationale: No contexto imediato, o termo designa a descendência híbrida dos Vigilantes e das mulheres. “Gigantes” comunica esse referente apocalíptico; a possibilidade lexical mais genérica é registrada em nota.
- source_word: ተወልዱ
  choice: nasceram
  rationale: Reproduz de modo direto e natural a expressão passiva de nascimento, sem acrescentar uma teoria específica sobre a geração desses seres.
- source_word: እመናፍስት ወሥጋ
  choice: de espíritos e carne
  rationale: Mantém a justaposição explícita entre espírito e carne e, assim, a origem mista descrita pelo texto.
- source_word: መንፈሳት እኩያን
  choice: espíritos maus
  rationale: Traduz diretamente o substantivo e o adjetivo, evitando “espíritos impuros”, expressão posterior que o versículo não exige.
- source_word: ይሰመዩ
  choice: serão chamados
  rationale: Conserva a fórmula passiva de nomeação e classificação presente no texto.
- source_word: በዲበ ምድር
  choice: sobre a terra
  rationale: Indica a esfera ou localização terrena e permite distinguir levemente esta ocorrência da repetição seguinte.
- source_word: ወውስተ ምድር ይከውን መሓድሪሆሙ
  choice: e na terra será a morada deles
  rationale: Preserva a segunda menção à terra e a ênfase do original, com linguagem clara e digna.
theological_decisions:
- issue: Identidade dos seres que serão chamados espíritos maus
  choice: O versículo se refere aos gigantes, descendência mista dos Vigilantes e das mulheres, que são designados “espíritos maus” na terra.
  alternative: Entender o substantivo inicial de maneira mais genérica como “descendentes” ou “prole”.
  rationale: O contexto imediato de 1 Enoque 15 identifica esses seres como a descendência híbrida já descrita. “Gigantes” explicita o referente contextual sem desenvolver uma demonologia além do que o próprio trecho afirma.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno sem ser arcaizante. A repetição de “terra” e o contraste “espíritos e carne” foram preservados por sua função literária e teológica.
