  terminology: «Santos», «seres espirituais», «vida eterna», «contaminaram», «sangue», «carne» e «perecem» são escolhas adequadas, sóbrias e consistentes. «Seres humanos» traduz bem o coletivo ge'ez para leitores atuais.
