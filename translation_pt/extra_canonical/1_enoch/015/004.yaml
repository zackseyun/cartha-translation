base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/004.yaml
  text: But you were holy[a], spiritual beings, living eternal life. But you defiled yourselves with women, and by the blood of flesh you fathered children, and you desired the blood of men, and you did as they do[c][b], producing flesh and blood—those who die and perish.
translation:
  language: pt
  text: Mas vocês eram santos, seres espirituais, que viviam a vida eterna. Contudo, vocês se contaminaram com mulheres[a], geraram filhos pelo sangue da carne, desejaram o sangue dos seres humanos e produziram, como eles produzem, seres de carne e sangue, que morrem e perecem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A palavra ge''ez antes de “mulheres” está corrompida ou incerta. Alguns a corrigem para “sangue”, produzindo a leitura: “vocês se contaminaram com o sangue das mulheres”.'
    reason: textual_variant
  - marker: b
    text: O último verbo também pode ser traduzido por “são destruídos”. Em qualquer caso, a expressão ressalta a mortalidade e a ruína dos seres de carne e sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: ቅዱሳን፡ መንፈሳውያን
  choice: santos, seres espirituais
  rationale: Conserva os dois predicados que descrevem a condição original dos Vigilantes; “seres” explicita naturalmente que se trata de pessoas, sem transformar o adjetivo em uma abstração.
- source_word: ሕያዋነ፡ ሕይወት፡ ዘለዓለም
  choice: que viviam a vida eterna
  rationale: Preserva a repetição retórica entre “viver” e “vida” e prepara o contraste com os seres humanos que morrem.
- source_word: †በደቡ፡† አንስት፡ ረኩስክሙ
  choice: vocês se contaminaram com mulheres
  rationale: O verbo exprime contaminação ou impureza moral e ritual. A forma anterior a “mulheres” é textualmente problemática; a tradução principal segue a leitura contextual mais sóbria e registra em nota a possível referência ao sangue.
- source_word: በደመ፡ ሥጋ፡ አውለድክሙ
  choice: geraram filhos pelo sangue da carne
  rationale: Mantém a imagem incomum e deliberada de sangue e corporeidade. “Filhos” fornece em português o objeto naturalmente implícito no verbo de geração.
- source_word: በደመ፡ ሰብእ፡ ፈተውክሙ
  choice: desejaram o sangue dos seres humanos
  rationale: Traduz explicitamente ሰብእ e preserva a acusação de desejo sem intensificá-la indevidamente como “cobiçaram” ou “tiveram sede”.
- source_word: ወገበርክሙ፡ ከመ፡ እሙንቱ፡ ይገብሩ፡ ሥጋ፡ ወደመ
  choice: e produziram, como eles produzem, carne e sangue
  rationale: Toma “carne e sangue” como objeto do verbo fazer/produzir, preservando a sintaxe e a comparação com a geração humana, em vez de reduzir a frase a uma referência genérica ao comportamento.
- source_word: እለ፡ እሙንቱ፡ ይመውቱ፡ ወይትሐጐሉ
  choice: seres que morrem e perecem
  rationale: Expressa a mortalidade e a ruína dos seres corpóreos sem suavizar o segundo verbo para simples desaparecimento.
theological_decisions:
- issue: Contraste entre a existência espiritual dos Vigilantes e a geração humana corpórea
  choice: Manter as imagens concretas de vida eterna, sangue, carne, geração, morte e perecimento.
  alternative: Resumir o contraste mediante termos interpretativos como “imortais” e “mortais”.
  rationale: O texto fundamenta a transgressão na passagem indevida da condição espiritual para a geração ligada à carne e ao sangue. A formulação escolhida deixa esse contraste visível sem definir além do texto a natureza da vida angélica.
- issue: Relação sintática de “carne e sangue”
  choice: Entender “carne e sangue” como aquilo que os Vigilantes produziram à maneira dos seres humanos.
  alternative: Entender a oração apenas como “vocês agiram como eles agem” e deslocar “carne e sangue” para uma explicação separada.
  rationale: A leitura escolhida preserva mais diretamente a sequência verbal e o objeto expresso no ge'ez, além de manter o foco na geração corpórea.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “vocês” para o plural. A ordem e a repetição de “sangue” e “carne” foram mantidas sempre que a clareza permitiu; evitou-se vocabulário confessional ou uma explicação doutrinária da natureza dos Vigilantes.
