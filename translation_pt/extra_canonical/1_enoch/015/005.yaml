base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/005.yaml
  text: Therefore I gave them women[a], so that they might beget children by them and offspring might be born to them[b], so that thus no work on the earth might be lacking to them.
translation:
  language: pt
  text: Por isso, dei-lhes mulheres, para que nelas semeassem[a] e, por meio delas, lhes nascessem filhos, para que, desse modo, nenhuma obra na terra lhes faltasse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “semeassem sobre elas”. O geʽez conserva uma metáfora procriadora tomada do ato de semear.
    reason: lexical_alternative
  - marker: b
    text: A cláusula final é difícil. Pode indicar que, por meio da procriação, a vida e a atividade na terra continuariam segundo a ordem estabelecida.
    reason: textual_variant
lexical_decisions:
- source_word: በእንተዝ
  choice: Por isso
  rationale: Introduz de modo natural a explicação decorrente do contraste anterior entre os espíritos e os seres terrenos.
- source_word: ወሀብክዎሙ አንስቲያ
  choice: dei-lhes mulheres
  rationale: Preserva a fala divina na primeira pessoa e traduz አንስቲያ sem especificar indevidamente o estado matrimonial como faria “esposas”.
- source_word: ከመ ይዝርኡ ላዕሌሆን
  choice: para que nelas semeassem
  rationale: Mantém no texto a metáfora agrícola e procriadora do geʽez. “Nelas” comunica em português a relação contextual, enquanto a nota registra a construção literalmente espacial.
- source_word: ወይትወለዱ ውሉደ በላዕሌሆን
  choice: e, por meio delas, lhes nascessem filhos
  rationale: “Filhos” exprime o sentido amplo de descendência, e “por meio delas” conserva a participação materna sem impor uma formulação biologicamente mais específica.
- source_word: ከመ ከማሁ
  choice: para que, desse modo
  rationale: Reproduz a ideia de propósito ou resultado e o destaque dado ao modo pelo qual isso ocorreria.
- source_word: ኢይትኀጐ ግብር
  choice: nenhuma obra ... lhes faltasse
  rationale: “Obra” conserva a amplitude de ግብር, que pode designar obra, atividade, feito ou assunto, sem reduzir o sentido apenas à reprodução.
- source_word: በዲበ ምድር
  choice: na terra
  rationale: É a formulação cosmológica corrente e idiomática em português.
theological_decisions:
- issue: Finalidade de dar mulheres aos seres terrenos
  choice: A procriação é apresentada como parte da ordem estabelecida para os seres terrenos.
  alternative: Entender a declaração apenas como referência ao matrimônio ou como concessão punitiva posterior à transgressão dos Vigilantes.
  rationale: O versículo relaciona mulheres, semente, nascimento e continuidade da atividade terrena. A tradução mantém esse contraste contextual sem atribuir ao texto uma doutrina matrimonial ou punitiva mais específica.
- issue: Sentido da cláusula final
  choice: Manter a formulação ampla “nenhuma obra na terra lhes faltasse”.
  alternative: Explicitar que a vida ou a atividade humana continuaria por meio da procriação.
  rationale: O geʽez é difícil e ግብር possui sentido amplo. Explicitar “continuidade da vida” resolveria uma ambiguidade que o texto preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi tornada natural sem eliminar a metáfora procriadora nem a dificuldade da cláusula final.
