base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/007.yaml
  text: And because of this I have not appointed wives for you[b][a], for the dwelling of the spiritual ones of heaven is in heaven.
translation:
  language: pt
  text: E por isso não destinei esposas a vocês, pois a morada dos seres espirituais do céu[a] é no céu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os espíritos do céu” ou “os seres espirituais celestiais”. A expressão em ge'ez admite essas interpretações estreitamente relacionadas.
    reason: lexical_alternative
  - marker: b
    text: 'A repetição de “céu” é intencional: esses seres pertencem ao céu, e sua morada fica no céu.'
    reason: cultural_note
lexical_decisions:
- source_word: ወበእንተዝ
  choice: E por isso
  rationale: Preserva de modo natural o nexo causal com a explicação precedente.
- source_word: ኢረሰይኩ
  choice: não destinei
  rationale: Expressa estabelecer ou atribuir algo a alguém, sem sugerir mera criação física.
- source_word: ለክሙ
  choice: a vocês
  rationale: Reproduz o sentido dativo em português moderno e amplamente compreensível.
- source_word: አንስቲያ
  choice: esposas
  rationale: O contexto trata de parceiras conjugais não atribuídas a esses seres; é mais específico que “mulheres”.
- source_word: እስመ
  choice: pois
  rationale: Introduz com clareza e concisão o fundamento explicativo da afirmação.
- source_word: መንፈሳውያነ ሰማይ
  choice: os seres espirituais do céu
  rationale: Mantém o caráter substantivado da expressão e evita reduzi-la sem necessidade a uma formulação angelológica posterior.
- source_word: ውስተ ሰማይ
  choice: no céu
  rationale: Locativo direto que preserva a repetição intencional de “céu”.
- source_word: መሓድሪሆሙ
  choice: a morada ... é
  rationale: “Morada” comunica habitação de forma digna, clara e não arcaica.
theological_decisions:
- issue: Como entender መንፈሳውያነ ሰማይ
  choice: os seres espirituais do céu
  alternative: os espíritos do céu; os seres espirituais celestiais
  rationale: A escolha conserva a categoria ampla expressa pela forma adjetival substantivada e a ligação genitiva com o céu, sem resolver além do que o ge'ez permite.
- issue: Se አንስቲያ deve ser vertido como “mulheres” ou “esposas”
  choice: esposas
  alternative: mulheres
  rationale: A passagem explica a ausência de parceiras conjugais destinadas a esses seres; “esposas” comunica melhor essa relação específica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com preferência por “a vocês” para ampla legibilidade brasileira e internacional. A repetição de “céu” foi mantida, e a ambiguidade da expressão referente aos seres espirituais foi registrada em nota.
