base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/009.yaml
  text: And evil spirits came out from their flesh[a], because they were created from above; and from the holy Watchers was their beginning and first foundation[d][c][b]. They shall be evil spirits.
translation:
  language: pt
  text: E espíritos maus saíram da carne deles[a], porque foram criados do alto; e sua origem e seu primeiro fundamento vieram dos santos Vigilantes[b]. Serão espíritos maus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “saíram dos corpos deles”. O ge''ez diz literalmente “da carne deles”, preservando a imagem corporal.'
    reason: lexical_alternative
  - marker: b
    text: “Santos Vigilantes” também pode ser vertido mais literalmente como “santos, vigilantes”. Neste contexto, a expressão se refere aos Vigilantes angélicos.
    reason: lexical_alternative
  - marker: c
    text: 'A frase final também pode ser entendida como uma fórmula de nomeação: “serão chamados espíritos maus”. O verbo “chamar”, porém, não está expresso no texto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ነፍሳት እኩያን
  choice: espíritos maus
  rationale: O substantivo absoluto seguido do adjetivo significa “espíritos maus” ou “almas más”, e não “almas dos perversos”. “Espíritos” também mantém a ligação com a designação conclusiva do versículo e com o contexto dos descendentes desencarnados dos Vigilantes.
- source_word: ወጽኡ እምሥጋሆሙ
  choice: saíram da carne deles
  rationale: Preserva o movimento de saída e a imagem corporal concreta de “carne”, sem generalizá-la como “corpos”.
- source_word: እመልዕልት ተፈጥሩ
  choice: foram criados do alto
  rationale: Mantém a passiva e a imagem cosmológica de uma origem superior, sem afirmar que essa origem lhes confere aprovação moral ou plena condição angélica.
- source_word: እምቅዱሳን ትጉሃን
  choice: dos santos Vigilantes
  rationale: No contexto enoquiano, a expressão identifica os seres angélicos conhecidos como Vigilantes; a inicial maiúscula sinaliza o uso como designação de grupo.
- source_word: ቀዳሚቶሙ ወቀዳሚ መሰረት
  choice: o seu princípio e o seu primeiro fundamento
  rationale: Conserva a repetição enfática da linguagem de origem e fundamento, mesmo que ela soe deliberadamente solene.
- source_word: መንፈሰ እኩየ
  choice: espíritos maus
  rationale: Expressa a designação culminante no plural exigido pelo referente coletivo, sem suavizar seu juízo moral.
theological_decisions:
- issue: Identidade dos espíritos após a morte
  choice: O versículo trata dos espíritos dos descendentes dos Vigilantes e das mulheres.
  alternative: Entender a frase como referência geral às almas de seres humanos perversos.
  rationale: O contexto imediato de 1 Enoque 15 explica a origem e o destino dos gigantes. Além disso, a construção em ge'ez descreve as próprias almas ou espíritos como maus, em vez de dizer “almas dos perversos”.
- issue: Sentido de “do alto”
  choice: Indica um componente celestial ou superno de sua origem.
  alternative: Tomá-lo como afirmação de plena condição angélica ou de aprovação moral.
  rationale: A tradução preserva a tensão da origem mista apresentada no contexto, sem transformar os seres em anjos propriamente ditos nem atribuir bondade à sua origem.
- issue: Força da frase final
  choice: Manter “Serão espíritos maus” como declaração de estado ou identidade.
  alternative: 'Explicitar uma fórmula de nomeação: “serão chamados espíritos maus”.'
  rationale: O verbo “chamar” não está expresso no texto transmitido; a formulação direta conserva a ambiguidade entre descrição e designação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a imagem concreta de “carne”, o título enoquiano “Vigilantes”, a repetição solene sobre origem e fundamento e a ambiguidade da frase final.
