base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/001.yaml
  text: 'And he answered me and said to me[a], and I heard: “Do not fear, Enoch, righteous man and scribe of righteousness. Come near here and hear my word.”'
translation:
  language: pt
  text: 'E ele me respondeu e me disse, e eu ouvi[a]: “Não tenha medo, Enoque, homem justo e escriba da justiça. Venha mais perto e ouça a minha palavra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope parece repetir o verbo “ouvir” (“e eu ouvi, ouvi”). A tradução comprime a repetição para maior naturalidade, sem acrescentar “voz”, termo que não aparece explicitamente no original.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: ele me respondeu
  rationale: Preserva o sentido dialogal de responder, sem reduzir o verbo a uma referência genérica à fala.
- source_word: ወይቤለኒ
  choice: e me disse
  rationale: Mantém a fórmula narrativa repetitiva do ge'ez, distinguindo-a do verbo anterior.
- source_word: ወሰምኩ፡ ሰማዕኩ
  choice: e eu ouvi
  rationale: Evita acrescentar “sua voz”, que não está explícito no texto, e comprime em português a aparente repetição do verbo, registrada em nota.
- source_word: አትፍራህ
  choice: Não tenha medo
  rationale: Imperativo negativo natural no português moderno, com a solenidade apropriada à fala revelatória.
- source_word: ብእሲ፡ ጻድቅ
  choice: homem justo
  rationale: Expressa diretamente a caracterização moral de Enoque em linguagem bíblica corrente.
- source_word: ጻሓፊ፡ ጽድቅ
  choice: escriba da justiça
  rationale: “Escriba” conserva a função formal de escritor e registrador; “da justiça” mantém a construção genitiva e a ligação lexical com “justo”.
- source_word: ቅረብ፡ ዝየ
  choice: Venha aqui para perto
  rationale: Conserva tanto a ideia de aproximação quanto o elemento dêitico “aqui”, em formulação compreensível no português atual.
- source_word: ወስማዕ፡ ቃልየ
  choice: e ouça a minha palavra
  rationale: Mantém “palavra” no singular e o tom profético da ordem.
theological_decisions:
- issue: Os títulos moral e literário atribuídos a Enoque
  choice: homem justo e escriba da justiça
  alternative: homem íntegro e escritor da retidão
  rationale: 'A tradução preserva os dois aspectos do texto: a qualificação moral de Enoque e sua função de registrar a revelação, sem reduzir um ao outro.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Evitam-se formas arcaicas como “não temas” e “aproxima-te”, preservando-se, porém, a cadência solene e a repetição narrativa de “respondeu” e “disse”.
