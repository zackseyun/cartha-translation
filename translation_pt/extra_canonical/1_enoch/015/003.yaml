base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/003.yaml
  text: Why did you abandon the high[a], holy, eternal heaven, and lie with women, and defile yourselves with the daughters of men, and take wives for yourselves, and do as the children of the earth do[b], and beget giant sons?
translation:
  language: pt
  text: Por que abandonaram o céu elevado, santo e eterno, deitaram-se com mulheres, contaminaram-se com as filhas dos homens, tomaram mulheres para si, agiram como agem os filhos da terra[a] e geraram filhos gigantes[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos da terra” contrasta os Vigilantes celestes com os seres humanos mortais; a expressão não significa apenas “pessoas”.
    reason: cultural_note
  - marker: b
    text: A expressão final designa a descendência anormal produzida por essa união. “Filhos que eram gigantes” também é uma tradução possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃደግሙ
  choice: abandonaram
  rationale: Preserva a força acusatória de deixar para trás ou desamparar, mais intensa que o simples «deixaram».
- source_word: ሰማየ ልዑለ ወቅዱሰ ዘለዓለም
  choice: o céu elevado, santo e eterno
  rationale: Mantém a sequência de qualificativos aplicada ao céu em linguagem apocalíptica elevada, com coordenação natural em português.
- source_word: ሰከብክሙ
  choice: deitaram-se com
  rationale: Expressa diretamente a união sexual sem vulgaridade nem explicitação clínica indevida.
- source_word: እዋለደ ሰብእ
  choice: as filhas dos homens
  rationale: Conserva a expressão antropológica tradicional e o contraste contextual entre mulheres humanas e seres celestes.
- source_word: ረኩስክሙ
  choice: contaminaram-se
  rationale: Retém a noção moral e ritual de impureza expressa pelo verbo, sem reduzir a ação a uma união neutra.
- source_word: አንስተ
  choice: mulheres
  rationale: O substantivo designa mulheres; na construção «tomaram mulheres para si», o contexto comunica a tomada como esposas sem inserir no substantivo uma especificação além da forma lexical.
- source_word: ከመ ውሉደ ምድር ገበርክሙ
  choice: agiram como agem os filhos da terra
  rationale: Preserva tanto o contraste entre seres celestes e humanos nascidos da terra quanto a repetição verbal da comparação.
- source_word: ውሉደ ረዓይተ
  choice: filhos gigantes
  rationale: Oferece a leitura concreta do descendente anormal, mantendo possível a compreensão atributiva «filhos que eram gigantes».
theological_decisions:
- issue: Caráter moral da união dos Vigilantes com mulheres
  choice: Traduzir a ação como autocontaminação
  alternative: Descrever de modo neutro que se uniram ou se misturaram com mulheres
  rationale: O ge’ez emprega explicitamente um verbo de impureza; a tradução deve conservar o juízo moral e de pureza do texto, sem o suavizar.
- issue: Identidade e caráter da descendência
  choice: Manter a expressão concreta «filhos gigantes»
  alternative: Interpretar como «descendentes violentos»
  rationale: A formulação concreta preserva a imagem e evita resolver lexical e teologicamente a expressão por meio de uma abstração interpretativa.
translation_notes:
  register: Português atual, digno e acessível, com formas verbais na terceira pessoa do plural para evitar regionalizar o tratamento entre «vós» e «vocês». A sequência acusatória e o paralelismo foram preservados, enquanto a pontuação e a coordenação seguem o uso natural do português.
