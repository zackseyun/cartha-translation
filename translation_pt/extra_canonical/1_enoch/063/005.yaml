base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/005.yaml
  text: And they said[a], “Who has given us rest[c][b], that we should praise and thank and believe before your glory?”
translation:
  language: pt
  text: 'E disseram: “Quem nos deu descanso[a], para que o louvemos, lhe demos graças e creiamos diante da tua glória?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alívio” ou “trégua”. O substantivo pode indicar repouso ou uma pausa no sofrimento; aqui, o contexto é a ausência de alívio sob o juízo.
    reason: lexical_alternative
  - marker: b
    text: A última expressão também pode ser entendida como “e confessemos” ou “e reconheçamos diante da tua glória”; contudo, a forma verbal favorece “creiamos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤሉ
  choice: E disseram
  rationale: Mantém a forma narrativa e o perfeito do verbo ‘dizer’.
- source_word: መኑ
  choice: Quem
  rationale: Equivalente natural do pronome interrogativo que introduz a pergunta retórica.
- source_word: ወሀበነ
  choice: nos deu
  rationale: Traduz diretamente o verbo perfeito ‘dar’ com o objeto de primeira pessoa plural.
- source_word: ዕረፍተ
  choice: descanso
  rationale: Preserva o sentido básico de repouso ou trégua e o contraste com a ausência de alívio sob o juízo.
- source_word: ከመ
  choice: para que
  rationale: Expressa de modo natural a relação de propósito ou resultado.
- source_word: ንሰብሖ
  choice: o louvemos
  rationale: O verbo significa louvar ou glorificar; a forma contém sufixo de objeto masculino singular, representado por ‘o’.
- source_word: ወናአኵቶ
  choice: lhe demos graças
  rationale: Comunica o sentido de agradecer e representa o sufixo de objeto masculino singular de modo idiomático em português.
- source_word: ወንእመን
  choice: e creiamos
  rationale: A forma simples do verbo favorece ‘crer’; preserva também a repetição temática de crer neste capítulo, sem acrescentar objeto não expresso.
- source_word: ቅድመ
  choice: diante de
  rationale: Preserva o sentido espacial e solene de estar perante a presença divina.
- source_word: ስብሐቲከ
  choice: tua glória
  rationale: ‘Glória’ corresponde ao campo semântico de esplendor, majestade e louvor e mantém a imagem apocalíptica.
theological_decisions:
- issue: Força da pergunta dos condenados sob o juízo
  choice: 'Pergunta retórica de lamento: ninguém lhes concedeu descanso ou trégua para responderem com louvor, gratidão e fé diante da glória divina.'
  alternative: Pergunta meramente informativa sobre quem lhes teria concedido tempo para adorar.
  rationale: O contexto dos reis e poderosos sob condenação torna a fala desesperada, mas a tradução conserva a forma interrogativa e não explicita no corpo do texto aquilo que permanece implícito.
- issue: Sentido de ወንእመን
  choice: creiamos
  alternative: confessemos ou reconheçamos
  rationale: A forma verbal simples favorece ‘crer’, em contraste com formas derivadas que podem exprimir confessar; como a seção ge’ez é textualmente delicada, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, solene e acessível, com ordem verbal natural. Os pronomes em ‘o louvemos’ e ‘lhe demos graças’ refletem os sufixos masculinos singulares presentes nas duas formas ge’ez; ‘creiamos’ permanece sem objeto explícito. A pergunta conserva sua tensão retórica sem acrescentar uma negação ausente do texto.
