base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/011.yaml
  text: And after this[a], their faces will be filled with darkness and shame before that Son of Man, and they will be driven away from before his face[c][b], and a sword will abide before his face in their midst.
translation:
  language: pt
  text: E, depois disso, os rostos deles se encherão de trevas e vergonha diante daquele Filho do Homem[a]; serão expulsos de diante de sua face, e uma espada permanecerá no meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filho do Homem” é mantido como designação da figura apocalíptica nas Parábolas de Enoque; a expressão não é aqui reformulada com base no uso posterior do Novo Testamento.
    reason: cross_reference
lexical_decisions:
- source_word: ይመልእ
  choice: se encherão
  rationale: O sentido passivo/resultativo concorda com o sujeito plural “os rostos deles” e conserva a imagem de trevas e vergonha tomando-lhes o rosto.
- source_word: ገጾሙ
  choice: os rostos deles
  rationale: Mantém a imagem concreta do ge'ez em português atual, sem recorrer ao menos corrente “semblantes”.
- source_word: ጽልመተ ወኃፍረተ
  choice: trevas e vergonha
  rationale: Traduz diretamente o par e preserva sua possível dimensão visual, emocional e simbólica sem defini-la.
- source_word: በቅድመ
  choice: diante de
  rationale: Expressa presença e exposição perante o juiz, preservando a relação espacial do original.
- source_word: ዝኩ ወልደ እጓለ እመሕያው
  choice: daquele Filho do Homem
  rationale: No contexto das Parábolas de Enoque, a expressão identifica uma figura apocalíptica já apresentada; “daquele” traduz o demonstrativo sem acrescentar uma identificação posterior.
- source_word: ይሰደዱ
  choice: serão expulsos
  rationale: Conserva a voz passiva e o caráter judicial do afastamento.
- source_word: ወእምቅድመ ገጹ
  choice: de diante de sua face
  rationale: Mantém a formulação espacial enfática e a repetição de “face/rosto” presente no texto fornecido.
- source_word: ሰይፍ
  choice: uma espada
  rationale: A forma não exige uma espada previamente identificada; o artigo indefinido preserva essa abertura.
- source_word: የኃድር
  choice: permanecerá
  rationale: Indica presença contínua, e não necessariamente um golpe imediato; é natural e solene em português.
- source_word: ቅድመ ገጹ ማእከሎሙ
  choice: diante de sua face, no meio deles
  rationale: Segue de perto a transcrição fornecida e conserva a relação sintática e espacial difícil entre a espada, a figura e o grupo condenado.
theological_decisions:
- issue: Se “Filho do Homem” deve ser tratado como designação da figura apocalíptica ou como expressão humana genérica
  choice: “daquele Filho do Homem”, com iniciais maiúsculas
  alternative: “daquele filho do homem” ou “daquele ser humano”
  rationale: Nas Parábolas, a expressão funciona localmente como designação reconhecível de uma figura escatológica. A tradução preserva esse uso do próprio livro sem identificar explicitamente a figura por meio de doutrina posterior.
- issue: Se a espada age de imediato ou permanece como instrumento de juízo
  choice: “uma espada permanecerá”
  alternative: “uma espada os ferirá” ou “uma espada repousará”
  rationale: O verbo descreve permanência ou habitação; não se deve transformar a imagem em uma ação violenta específica que o verso não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conservam-se a repetição enfática de “rosto/face”, o título enóquico e a ambiguidade espacial da cláusula final; “face” foi mantido nas ocorrências referentes à figura para refletir a repetição do ge'ez sem tornar a frase excessivamente coloquial.
