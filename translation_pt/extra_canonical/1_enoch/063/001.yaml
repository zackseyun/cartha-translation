base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/001.yaml
  text: In those days the mighty ones and the kings who possess the dry land shall beg the angels of punishment[a], into whose hands they have been delivered, that they might give them a little respite, so that they may fall down and worship before the Lord of Spirits[c][b], and confess their sins before him.
translation:
  language: pt
  text: Naqueles dias, os poderosos e os reis que possuem a terra seca[a] suplicarão aos anjos do castigo, em cujas mãos foram entregues[b], que lhes concedam um breve alívio[c], para que se prostrem e adorem diante do Senhor dos Espíritos e confessem seus pecados diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que dominam a terra”. A expressão ge'ez é concreta (“a terra seca”) e provavelmente se refere ao domínio terreno.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida por “em cujas mãos foram entregues” é textualmente difícil no testemunho etíope. O sentido parece ser que esses anjos mantêm sob custódia os governantes condenados.
    reason: textual_variant
  - marker: c
    text: “Um breve alívio” indica um descanso pequeno e limitado, não a libertação do juízo.
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: Naqueles dias
  rationale: Preserva a fórmula temporal apocalíptica e o plural do texto ge'ez em português natural.
- source_word: ዓዚዛን
  choice: os poderosos
  rationale: Expressa a posição sociopolítica dos personagens sem lhes atribuir um título específico além do que o texto declara.
- source_word: ነገሥት
  choice: os reis
  rationale: Tradução direta do título régio, mantendo sua distinção em relação aos poderosos.
- source_word: እለ ይእኅዝዋ ለየብስ
  choice: que possuem a terra seca
  rationale: Conserva a imagem concreta da terra seca e o sentido de posse ou domínio, sem substituí-la pelo conceito mais abstrato de mundo.
- source_word: እመላእክት መቅሠፍት
  choice: aos anjos do castigo
  rationale: Reproduz com clareza a construção genitiva e se ajusta ao contexto judicial do juízo.
- source_word: በኀበ ሀለዉ ምጥዋነ
  choice: em cujas mãos foram entregues
  rationale: Comunica a provável relação de custódia exercida pelos anjos, ao mesmo tempo que uma nota registra a dificuldade textual da expressão.
- source_word: ከመ የሀቦሙ ዕረፍተ ንስቲተ
  choice: que lhes concedam um breve alívio
  rationale: Reúne os sentidos de descanso ou alívio e de pequena duração ou extensão, sem sugerir libertação definitiva.
- source_word: ከመ ይደቁ ወይስግዱ
  choice: para que se prostrem e adorem
  rationale: Preserva tanto a submissão corporal quanto o ato de adoração expresso pelo par verbal.
- source_word: እግዚአ መናፍስት
  choice: Senhor dos Espíritos
  rationale: Mantém o título divino característico de 1 Enoque sem acrescentar uma interpretação doutrinária posterior.
- source_word: ወይትአመኑ ኃጢአቶሙ
  choice: e confessem seus pecados
  rationale: No contexto judicial e penitencial, confessar comunica adequadamente o reconhecimento público das faltas.
theological_decisions:
- issue: Se o pedido dos governantes representa arrependimento genuíno ou apenas submissão desesperada sob o juízo
  choice: O versículo relata o pedido de um breve alívio para que eles se prostrem, adorem e confessem seus pecados, sem afirmar que sua confissão será aceita.
  alternative: Entender a confissão como arrependimento sincero ou, no extremo oposto, como mero reconhecimento coagido.
  rationale: O texto descreve as ações pretendidas, mas não revela a disposição interior dos governantes nem a resposta divina; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém o movimento solene da visão apocalíptica, enquanto “suplicarão”, “se prostrem” e “Senhor dos Espíritos” preservam seu registro formal sem arcaísmo excessivo.
