base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/004.yaml
  text: Now we know that we ought to praise and bless the Lord of the kings[b][a], and the one who reigns over all the kings.
translation:
  language: pt
  text: Agora sabemos que devemos louvar e bendizer o Senhor dos reis[b][a] e aquele que reina sobre todos os reis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “louvemos e bendigamos”. As formas verbais em ge’ez podem ter sentido exortativo ou subjuntivo.'
    reason: lexical_alternative
  - marker: b
    text: O título traduz diretamente o ge’ez como “Senhor dos reis”, em vez de condensá-lo na expressão tradicional “Rei dos reis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜ
  choice: Agora
  rationale: Marca a percepção presente alcançada pelos falantes e preserva de modo conciso a virada retórica.
- source_word: አእመርነ
  choice: sabemos
  rationale: A forma na primeira pessoa do plural exprime compreensão ou reconhecimento já alcançado; “sabemos” é natural e mantém o resultado presente.
- source_word: ከመ
  choice: que
  rationale: Introduz o conteúdo daquilo que os falantes agora reconhecem.
- source_word: ንሰብሖ ወንባርኮ
  choice: devemos louvar e bendizer
  rationale: As formas verbais na primeira pessoa do plural podem ter valor volitivo ou subjuntivo. No contexto, “devemos” comunica o reconhecimento de uma obrigação, sem reduzi-las a simples futuro.
- source_word: ለእግዚኦሙ ለነገሥት
  choice: o Senhor dos reis
  rationale: Preserva diretamente o título de soberania expresso no ge’ez, sem condensá-lo na fórmula tradicional “Rei dos reis”.
- source_word: ወለዘ ይነግሥ ዲበ ኵሎሙ ነገሥት
  choice: e aquele que reina sobre todos os reis
  rationale: A construção relativa com verbo no presente destaca o exercício contínuo de domínio sobre a totalidade dos reis.
theological_decisions:
- issue: Forma do título régio e possível assimilação a uma fórmula tradicional
  choice: o Senhor dos reis e aquele que reina sobre todos os reis
  alternative: o Rei dos reis
  rationale: O testemunho ge’ez fala primeiro do “Senhor dos reis” e depois acrescenta uma oração sobre aquele que reina sobre todos eles. A tradução mantém a aclamação em duas partes e evita importar uma fórmula condensada.
- issue: Valor das formas verbais na primeira pessoa do plural
  choice: devemos louvar e bendizer
  alternative: louvemos e bendigamos
  rationale: No contexto de reconhecimento diante do juízo, “devemos” preserva a noção de obrigação percebida. Como o valor exortativo ou subjuntivo continua possível, ele é registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bendizer” conserva o registro religioso elevado sem soar arcaico demais. Os artigos e a repetição de “reis” foram mantidos para representar a classe definida dos reis no contexto e preservar a estrutura bipartida do original.
