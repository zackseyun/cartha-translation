base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/006.yaml
  text: Now we desire a little rest[a], but we do not find it; we are driven away, and we cannot seize it, and the light has passed away from before us[c][b], and darkness will be our dwelling forever and ever.
translation:
  language: pt
  text: Agora desejamos um pouco de descanso, mas não o encontramos; somos expulsos e não conseguimos agarrá-lo[a]. A luz se afastou de diante de nós, e as trevas serão nossa morada[b] para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão é concisa e também pode ser traduzida por “não conseguimos alcançá-lo” ou “apoderar-nos dele”; provavelmente ainda se refere ao descanso desejado.
    reason: lexical_alternative
  - marker: b
    text: A palavra traduzida por “morada” é difícil neste trecho; “habitação” é outra possibilidade. O sentido é que as trevas se tornam sua condição permanente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜኒ
  choice: Agora
  rationale: Marca temporal que introduz a constatação presente dos falantes.
- source_word: ንስቲተ፡ ዕረፍተ፡ ንትሜነይ
  choice: desejamos um pouco de descanso
  rationale: 'Segue a análise corrigida: ንስቲተ qualifica ዕረፍተ como «um pouco de descanso», e ንትሜነይ é o verbo «desejamos».'
- source_word: ወኢንረክብ
  choice: mas não o encontramos
  rationale: Preserva o sentido comum de encontrar ou obter e explicita naturalmente em português o referente «descanso».
- source_word: ንሰደድ
  choice: somos expulsos
  rationale: Mantém o valor passivo e judicial de serem repelidos ou banidos.
- source_word: ወኢንእኅዝ
  choice: e não conseguimos agarrá-lo
  rationale: Conserva a imagem vívida de tentar agarrar ou alcançar aquilo que permanece fora do alcance, sem eliminar a concisão do original.
- source_word: ወብርሃን፡ እምቅድሜነ፡ ኀለፈ
  choice: A luz se afastou de diante de nós
  rationale: Reproduz a imagem espacial do afastamento da luz com formulação natural e solene em português.
- source_word: ወጽልመት፡ ምኅባሪነ
  choice: e as trevas serão nossa morada
  rationale: Expressa a leitura contextual mais provável do termo difícil ምኅባሪነ como lugar de habitação ou condição duradoura.
- source_word: ለዓለመ፡ ዓለም
  choice: para todo o sempre
  rationale: Equivalente idiomático e solene da fórmula de duração perpétua.
theological_decisions:
- issue: Natureza da luz perdida e das trevas subsequentes
  choice: Manter a linguagem apocalíptica de luz e trevas sem reduzi-la a uma única explicação.
  alternative: Interpretá-la exclusivamente como desespero interior ou exclusivamente como escuridão física.
  rationale: No contexto do lamento de julgamento, a imagem pode ter força moral, cósmica e escatológica; a tradução deve preservar essa amplitude.
- issue: Referente de «agarrá-lo»
  choice: Manter como referente provável o descanso desejado, sinalizando a concisão da construção em nota.
  alternative: Entender um objeto não expresso, como segurança ou libertação.
  rationale: O descanso é o antecedente disponível mais próximo, mas o original é terso e não convém eliminar por completo sua ambiguidade.
translation_notes:
  register: Português moderno, amplamente compreensível e de leitura natural no Brasil, com tom digno e solene. A tradução corrige a análise anterior de ንስቲተ e ንትሜነይ, evita arcaísmos desnecessários e preserva a imagética apocalíptica.
