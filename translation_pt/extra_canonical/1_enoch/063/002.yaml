base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/002.yaml
  text: And they will bless and praise the Lord of spirits, and they will say, “Blessed is the Lord of spirits, and the Lord of the kings, and the Lord of the mighty, and the Lord of the rich, and the Lord of glory, and the Lord of wisdom.”
translation:
  language: pt
  text: 'E eles bendirão e louvarão o Senhor dos espíritos e dirão: “Bendito é o Senhor dos espíritos, e o Senhor dos reis, e o Senhor dos poderosos, e o Senhor dos ricos,[a] e o Senhor da glória, e o Senhor da sabedoria.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos que possuem riquezas” ou “dos que têm posses”.
    reason: lexical_alternative
  - marker: b
    text: O ge'ez repete “e o Senhor de...” ao longo da enumeração, conferindo à aclamação uma cadência solene.
    reason: cultural_note
lexical_decisions:
- source_word: ይባርክዎ
  choice: bendirão
  rationale: O imperfeito na sequência visionária é naturalmente expresso pelo futuro; “bendizer” distingue o ato de aclamação do louvor que vem em paralelo.
- source_word: ይሴብሕዎ
  choice: louvarão
  rationale: Equivalente português claro e corrente para o verbo de louvor, preservando o paralelismo com “bendirão”.
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: Senhor dos espíritos
  rationale: Mantém o título divino característico de 1 Enoque, com formulação natural em português.
- source_word: ቡሩክ ውእቱ
  choice: Bendito é
  rationale: Traduz a expressão como declaração de aclamação, não como desejo ou pedido.
- source_word: እግዚኦሙ ለነገሥት
  choice: o Senhor dos reis
  rationale: Preserva a fórmula de senhorio aplicada à classe mencionada e a repetição retórica do original.
- source_word: ዐዚዛን
  choice: os poderosos
  rationale: No contexto, designa pessoas dotadas de poder; “poderosos” é claro e mantém a força sociopolítica.
- source_word: ብዑላን
  choice: os ricos
  rationale: No contexto das elites julgadas, a palavra aponta para pessoas de posses; a nota registra a amplitude lexical possível.
- source_word: እግዚአ ስብሐት
  choice: o Senhor da glória
  rationale: “Glória” preserva o registro apocalíptico e a estrutura do título abstrato, embora o substantivo também possa envolver louvor ou esplendor.
- source_word: እግዚአ ጥበብ
  choice: o Senhor da sabedoria
  rationale: “Sabedoria” expressa o sentido amplo do termo sem restringi-lo a mero intelecto.
theological_decisions:
- issue: Tradução do título divino recorrente እግዚአ መንፈሳት
  choice: Senhor dos espíritos
  alternative: Senhor dos Espíritos; Soberano dos espíritos
  rationale: A opção conserva a designação enóquica distintiva e evita interpretar quais espíritos estão abrangidos.
- issue: Valor de ቡሩክ ውእቱ
  choice: Bendito é
  alternative: Bendito seja; Ele é bendito
  rationale: A cena apresenta uma declaração solene de reconhecimento; o indicativo preserva esse valor sem convertê-la em fórmula optativa.
- issue: Repetição das fórmulas de senhorio
  choice: manter “e o Senhor...” em cada membro
  alternative: comprimir a enumeração em uma lista sem conjunções repetidas
  rationale: O ge'ez repete a conjunção e o título, produzindo uma cadência solene que deve ser preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição polissindética do ge'ez foi mantida deliberadamente; “bendizer” e “louvar” preservam o paralelismo sem soar excessivamente arcaicos.
