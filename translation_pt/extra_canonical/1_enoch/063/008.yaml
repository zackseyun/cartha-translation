base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/008.yaml
  text: And on the day of our distress and our affliction[a], he will not save us, and we shall find no rest to believe that our Lord is faithful in all his works and in his judgments and his righteousness[c][b], and his judgments show no partiality.
translation:
  language: pt
  text: E, no dia da nossa angústia e da nossa aflição, ele não nos salvará, e não encontraremos descanso para crer[a], pois nosso Senhor é fiel em todas as suas obras, em seus juízos e em sua justiça[b]; e seus juízos não mostram parcialidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge'ez é textual e sintaticamente difícil. Também pode significar «não encontraremos descanso em que confiar» ou «não encontraremos alívio para ter esperança».
    reason: alternative_reading
  - marker: b
    text: Outra possível divisão sintática entende «sua justiça» como o início da cláusula seguinte, em vez de como o terceiro elemento da enumeração.
    reason: textual_syntax
  - marker: c
    text: Literalmente, a cláusula final diz que os juízos não «levantam o rosto», expressão idiomática para não favorecer ninguém nem agir com parcialidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለተ
  choice: no dia de
  rationale: Preserva a expressão temporal e o tom apocalíptico de um momento decisivo, sem diluí-la em «quando».
- source_word: ስራሕነ ወምንዳቤነ
  choice: nossa angústia e nossa aflição
  rationale: Mantém os dois termos coordenados de sofrimento; «angústia» e «aflição» são naturais, distintos e adequados ao lamento judicial.
- source_word: ኢያድኅነነ
  choice: ele não nos salvará
  rationale: Traduz diretamente o verbo de livramento/salvação e conserva a perspectiva futura do contexto.
- source_word: ኢንረክብ ዕረፍተ ንእመን
  choice: não encontraremos descanso para crer
  rationale: Conserva a difícil ligação entre «encontrar descanso» e «crer», em vez de resolver por conjectura uma sintaxe incerta.
- source_word: መሃይምን
  choice: fiel
  rationale: Expressa a confiabilidade do Senhor de modo corrente e teologicamente não restritivo.
- source_word: ምግባሩ
  choice: suas obras
  rationale: Abrange os atos divinos em geral e corresponde ao registro bíblico digno e acessível.
- source_word: ኵነኔሁ
  choice: seus juízos
  rationale: O plural português acompanha o sentido distributivo da enumeração e o verbo plural da cláusula final.
- source_word: ጽድቁ
  choice: sua justiça
  rationale: Mantém explicitamente o terceiro elemento da enumeração, distinto das obras e dos juízos.
- source_word: ወገጹ ... ኢይነሥኡ
  choice: não mostram parcialidade
  rationale: Comunica em português natural o idiomatismo judicial de não «levantar o rosto», isto é, não favorecer pessoas.
theological_decisions:
- issue: Sentido da cláusula difícil ኢንረክብ ዕረፍተ ንእመን
  choice: não encontraremos descanso para crer
  alternative: não encontraremos descanso em que confiar; não encontraremos alívio para ter esperança; não encontraremos descanso, pois havíamos confiado
  rationale: A sintaxe ge'ez é difícil e não oferece base segura para escolher uma paráfrase fluente. O texto principal preserva a tensão, e a nota registra possibilidades sem impor uma solução.
- issue: Relação de «sua justiça» com a enumeração
  choice: em todas as suas obras, em seus juízos e em sua justiça
  alternative: em todas as suas obras e em seus juízos; e sua justiça...
  rationale: A leitura principal mantém ጽድቁ como o terceiro membro coordenado da lista, sem omiti-lo nem fundi-lo com a fórmula final.
- issue: Força da fórmula judicial final
  choice: seus juízos não mostram parcialidade
  alternative: seus juízos não levantam o rosto; seus juízos não favorecem ninguém
  rationale: A tradução expressa o sentido provável do idiomatismo e conserva o plural indicado pela forma verbal, sem introduzir uma formulação confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação deliberadamente incomum «descanso para crer» preserva a incerteza do ge'ez e é esclarecida em nota; o restante emprega sintaxe corrente e vocabulário judicial não denominacional.
