base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/009.yaml
  text: And we pass away from before his face because of our deeds[c][b][a], and all our sins are counted in righteousness.
translation:
  language: pt
  text: E nós nos afastamos de diante de sua face por causa de nossas obras,[a] e todos os nossos pecados são contados segundo a justiça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nós passamos de diante de sua face por causa de nossas obras”. A expressão “de diante de sua face” também pode ser traduzida por “de sua presença”.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como “todos os nossos pecados são contados justamente” ou “são levados em conta com justiça”. O ge'ez tem tom judicial, mas não explicita por completo a nuance.
    reason: alternative_reading
lexical_decisions:
- source_word: ወነኀልፍ
  choice: E nós nos afastamos
  rationale: O verbo comunica passar ou retirar-se. “Nós nos afastamos” combina naturalmente com o complemento espacial e evita fazer da morte o sentido explícito.
- source_word: እምገጹ
  choice: de diante de sua face
  rationale: Preserva a imagem concreta do ge'ez, literalmente ligada à face, e seu tom solene de exclusão perante o juiz divino.
- source_word: በእንተ ምግባሪነ
  choice: por causa de nossas obras
  rationale: Expressa a relação causal e traduz as ações praticadas sem acrescentar uma avaliação ausente do sintagma.
- source_word: ወኵሉ ኃጢአትነ
  choice: e todos os nossos pecados
  rationale: Mantém de modo direto a força totalizante do original.
- source_word: በጽድቅ
  choice: segundo a justiça
  rationale: Conserva o substantivo “justiça” e deixa aberta a nuance entre o padrão justo pelo qual se faz a conta e a maneira justa de fazê-la.
- source_word: ትኈለቍ
  choice: são contados
  rationale: Reproduz com clareza a metáfora judicial de contar, computar ou levar em conta, sem transformá-la explicitamente em julgamento ou punição.
theological_decisions:
- issue: Se a expressão antropomórfica da presença divina deve ser suavizada
  choice: de diante de sua face
  alternative: de sua presença
  rationale: A formulação escolhida preserva a imagem apocalíptica concreta e compreensível, sem reduzir “face” a uma abstração.
- issue: Sentido da relação entre os pecados, a contagem e a justiça
  choice: todos os nossos pecados são contados segundo a justiça
  alternative: todos os nossos pecados são contados justamente
  rationale: “Segundo a justiça” mantém a linguagem substantiva e a tensão do ge'ez, que pode indicar tanto o padrão quanto o modo justo da contabilização.
translation_notes:
  register: Português moderno, solene e acessível, com a imagem semítica de “face” preservada. “Obras” mantém a linguagem confessional e judicial; “segundo a justiça” é natural em português e conserva a ambiguidade da frase final.
