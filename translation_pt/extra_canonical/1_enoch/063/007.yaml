base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/007.yaml
  text: For before him we did not believe[a], and we did not praise the name of the Lord of Spirits[a][b], [and we did not praise our Lord,] and our hope was in the scepter of our kingdom and in our glory.
translation:
  language: pt
  text: Pois, diante dele, não cremos nem louvamos o nome do Senhor dos Espíritos, [nem louvamos nosso Senhor], e nossa esperança estava no cetro[c] do nosso reino e na nossa glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: O termo traduzido por “cetro” também pode significar “bastão” ou “vara”; neste contexto, “cetro” ressalta seu sentido régio.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Introduz a explicação da confissão dos reis e preserva a força causal sem torná-la excessivamente explícita.
- source_word: በቅድሜሁ
  choice: diante dele
  rationale: Expressa presença e posição perante alguém, adequando-se naturalmente ao cenário de juízo.
- source_word: ኢአመነ
  choice: não cremos
  rationale: A leitura crítica contém o prefixo negativo ኢ; a forma afirmativa da transcrição fornecida resulta provavelmente de erro de OCR.
- source_word: ወኢሰባሕነ ለስሙ
  choice: nem louvamos o nome
  rationale: Mantém o objeto explícito, “o nome”, e traduz diretamente o verbo repetido, com a negação exigida pela leitura crítica.
- source_word: እግዚአ መናፈስት
  choice: Senhor dos Espíritos
  rationale: Preserva o título apocalíptico recorrente em 1 Enoque e soa natural em português.
- source_word: ወኢሰባሕናሁ ለእግዚእነ
  choice: nem louvamos o nosso Senhor
  rationale: Traduz naturalmente a cláusula, mantendo-a entre colchetes por sua incerteza textual.
- source_word: ወተስፋነ ኮነ ዲበ
  choice: Nossa esperança estava no
  rationale: Conserva o sentido estativo e identifica de modo idiomático aquilo em que os reis depositavam a esperança.
- source_word: በትረ መንግሥትነ
  choice: cetro do nosso reino
  rationale: “Cetro” retém a imagem concreta de autoridade régia sugerida pelo contexto, sem ocultar que o termo também pode significar bastão ou vara.
- source_word: ስብሐቲነ
  choice: nossa glória
  rationale: Mantém o sentido de glória, esplendor ou honra própria em que os governantes confiavam.
theological_decisions:
- issue: Se a fala dos reis afirma ou nega que tenham crido e louvado
  choice: não cremos nem louvamos
  alternative: cremos e louvamos
  rationale: Embora a transcrição fornecida apresente formas afirmativas, a revisão crítica identifica a perda do prefixo negativo ኢ por erro de OCR. A leitura negativa também corresponde à confissão dos reis no contexto, sem acrescentar uma interpretação doutrinária.
- issue: Como representar o objeto da esperança dos reis no cenário de juízo
  choice: Nossa esperança estava no cetro do nosso reino e na nossa glória
  alternative: Nossa esperança estava no bastão do nosso domínio e no nosso esplendor
  rationale: A opção conserva a imagem régia concreta e o contraste entre a confiança no poder e na honra terrenos e o juízo divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe fluente para leitores brasileiros e internacionais. O título “Senhor dos Espíritos” e a imagem do “cetro” foram preservados por sua importância no vocabulário apocalíptico do livro.
