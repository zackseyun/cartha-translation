base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/012.yaml
  text: 'Thus said the Lord of Spirits: "This is the ordinance and the judgment for the mighty."[a][b][c]'
translation:
  language: pt
  text: 'Assim disse o Senhor dos Espíritos: “Este é o decreto e o julgamento para os poderosos.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo ይቤ normalmente significa “disse”. A linha é sintaticamente compacta, mas a fórmula inicial pode ser traduzida de modo direto como “Assim disse o Senhor dos Espíritos”.
    reason: textual_variant
  - marker: b
    text: A expressão final também pode ser entendida como “contra os poderosos”, dependendo do valor contextual atribuído à preposição.
    reason: lexical_alternative
  - marker: c
    text: 'Uma tradução anterior entendia a construção de modo diferente: “Pois este é o decreto e o julgamento do Senhor dos Espíritos para os poderosos”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ከመዝ ይቤ
  choice: Assim disse
  rationale: Preserva a fórmula introdutória e o valor verbal normal de ይቤ, conforme a evidência textual e a revisão mais recente.
- source_word: እግዚአ መናፈስት
  choice: o Senhor dos Espíritos
  rationale: Mantém de modo consistente o título divino característico de 1 Enoque, sem assimilá-lo a uma fórmula teológica posterior.
- source_word: ዝውእቱ
  choice: Este é
  rationale: Expressa naturalmente em português o demonstrativo com valor copular.
- source_word: ሥርዓቱ
  choice: o decreto
  rationale: No contexto judicial e apocalíptico, comunica uma determinação oficial; também pode significar ordem, norma ou ordenança.
- source_word: ወኵነኔሁ
  choice: e o julgamento
  rationale: Conserva o segundo termo jurídico sem estreitá-lo para sentença ou ampliá-lo para condenação; os sufixos podem funcionar como determinantes definidos neste contexto.
- source_word: ለዐዚዛን
  choice: para os poderosos
  rationale: Representa a relação indicada pela preposição ለ e identifica os detentores de poder no contexto; a possibilidade contextual de sentido adversativo é registrada em nota.
theological_decisions:
- issue: Tradução do título divino no cenário apocalíptico enoquiano
  choice: o Senhor dos Espíritos
  alternative: o Senhor dos espíritos
  rationale: A capitalização de “Espíritos” ajuda a conservar o título fixo e reconhecível de 1 Enoque, sem definir quem são esses espíritos nem importar doutrina externa.
- issue: Direção do julgamento em relação aos poderosos
  choice: para os poderosos
  alternative: contra os poderosos
  rationale: A tradução principal mantém o valor relacional mais direto da preposição, enquanto a nota preserva a leitura adversativa sugerida pelo contexto judicial.
translation_notes:
  register: Português moderno, digno e acessível, com cadência declarativa apropriada ao contexto apocalíptico. “Poderosos” é mais natural e abrangente que “fortes” para governantes ou pessoas de grande poder; “decreto” evita o tom excessivamente técnico ou arcaico de “ordenança”.
