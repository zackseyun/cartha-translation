base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/003.yaml
  text: And your power is blessed in every hidden thing throughout all generations[a], and your glory forever and ever. Deep are all your hidden things, and they are without number[c][b]; and your righteousness is beyond reckoning.
translation:
  language: pt
  text: E o teu poder resplandece em tudo o que está oculto, de geração em geração, e a tua glória permanece para todo o sempre. Profundas são todas as tuas coisas ocultas[a], e elas não têm número; e a tua justiça[b] está além de todo cálculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os teus segredos” ou “todos os teus mistérios”. O ge'ez diz mais literalmente “todas as tuas coisas ocultas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a tua retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይበርህ
  choice: resplandece
  rationale: O verbo é entendido como forma de በርሀ, “brilhar, resplandecer”, conforme a revisão filológica mais recente; evita confundi-lo com uma fórmula de bênção.
- source_word: በኵሉ ኅቡእ ኃይልክ
  choice: o teu poder resplandece em tudo o que está oculto
  rationale: Mantém ኃይልክ como sujeito e lê a expressão preposicional como o âmbito em que o poder resplandece, sem transformar “oculto” em atributo de “poder”.
- source_word: ለትውልደ ትውልድ
  choice: de geração em geração
  rationale: Expressão portuguesa corrente e digna para a fórmula durativa, preservando sua continuidade temporal.
- source_word: ስብሐቲከ
  choice: a tua glória
  rationale: No contexto doxológico, designa adequadamente a glória ou o esplendor divino.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Fórmula portuguesa natural que comunica a perpetuidade enfática do ge'ez.
- source_word: ዕሙቅ ውእቱ
  choice: Profundas são
  rationale: Conserva a ênfase e a ordem poética da afirmação de profundidade insondável.
- source_word: ኵሉ ኅቡኣት ዚአከ
  choice: todas as tuas coisas ocultas
  rationale: Tradução deliberadamente concreta e pouco interpretativa; não substitui a ambiguidade por “mistérios” ou “segredos” no texto principal.
- source_word: ኍልቈ አልቦሙ
  choice: elas não têm número
  rationale: Reproduz com clareza o idioma de incontabilidade e concorda com “coisas ocultas”.
- source_word: ጽድቅ ዚአከ
  choice: a tua justiça
  rationale: “Justiça” abrange aqui a retidão do caráter divino e soa natural em português; “retidão” continua possível.
- source_word: ኃሳበ አልቦ
  choice: está além de todo cálculo
  rationale: Preserva a imagem de algo que não admite cálculo ou cômputo, sem convertê-la em uma afirmação mais interpretativa como “insondável”.
theological_decisions:
- issue: Se a linguagem do oculto deve ser interpretada como “segredos” ou “mistérios”
  choice: todas as tuas coisas ocultas
  alternative: todos os teus segredos / todos os teus mistérios
  rationale: A formulação concreta preserva a indeterminação do ge'ez e evita introduzir terminologia mística mais específica.
- issue: Sentido de ጽድቅ no contexto doxológico
  choice: a tua justiça
  alternative: a tua retidão
  rationale: Ambas as opções são possíveis. “Justiça” conserva um termo bíblico amplo em português sem restringi-lo a um ato judicial específico; a alternativa é registrada em nota.
- issue: Análise do verbo inicial e da sintaxe associada
  choice: o teu poder resplandece em tudo o que está oculto
  alternative: seja bendito o teu poder oculto / o teu poder é bendito em toda coisa oculta
  rationale: A identificação filológica de ይበርህ com “resplandecer” e a leitura de ኃይልክ como sujeito oferecem a análise mais coerente do texto apresentado, apesar da tradição de tradução divergente refletida na camada inglesa.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A inversão “Profundas são” preserva o relevo poético sem tornar o restante do verso arcaico. Emprega-se “tu” por coerência com o discurso doxológico direto.
