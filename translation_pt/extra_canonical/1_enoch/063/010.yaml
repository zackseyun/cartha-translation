base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/010.yaml
  text: Now they will say to them[a], ‘Our soul has had its fill of unjust gain[d][c][b], but it does not keep us from going down from the midst of it into the burden of Sheol.’
translation:
  language: pt
  text: 'Agora eles lhes dirão: “Nossa alma se fartou de ganho injusto[a], mas isso não impede que desçamos do meio disso[b] para o peso do Sheol[c][d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão em ge'ez é textual e lexicalmente difícil; também pode indicar, de modo mais amplo, riqueza adquirida por meio da injustiça.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida por “do meio disso” é obscura e também pode ser entendida como “de dentro” ou “do meio”. Seu referente exato não é claro.
    reason: textual_ambiguity
  - marker: c
    text: Ou “para o fardo” ou “para a gravidade do Sheol”. A imagem sugere uma descida opressiva ao mundo dos mortos.
    reason: lexical_alternative
  - marker: d
    text: Mantém-se “Sheol” para preservar a concepção judaica antiga do mundo dos mortos, sem reduzi-la à sepultura nem identificá-la automaticamente com o “inferno” em sentidos posteriores.
    reason: cultural_note
lexical_decisions:
- source_word: ይእዜ
  choice: Agora
  rationale: Marca a virada temporal e dramática da fala no cenário de juízo.
- source_word: ይብልዎሙ
  choice: eles lhes dirão
  rationale: O futuro preserva o horizonte profético, e “lhes” representa o sufixo de objeto plural presente no ge'ez.
- source_word: ትጸግብ ነፍስነ
  choice: Nossa alma se fartou
  rationale: Expressa o estado de saciedade ou saturação indicado pelo verbo, mantendo a imagem concreta e o singular coletivo “alma”.
- source_word: እምጥየየ ዐመፃ
  choice: de ganho injusto
  rationale: Conserva tanto o aspecto material quanto a condenação moral da expressão difícil, sem especificar indevidamente a forma da injustiça.
- source_word: ወኢትከልእ
  choice: mas isso não impede
  rationale: Traduz o sentido de não impedir ou não deter; “isso” retoma de modo amplo a riqueza ou condição anteriormente descrita sem fixar um antecedente mais preciso do que o texto permite.
- source_word: ወረደተነ
  choice: que desçamos
  rationale: Mantém verbal e vívida a ideia de descida rumo ao mundo dos mortos.
- source_word: እምልባ
  choice: do meio de tudo isso
  rationale: Representa a noção obscura de procedência “do meio/de dentro”, preservando a indefinição do referente em português compreensível.
- source_word: ለክበደ ሲኦል
  choice: para o peso do Sheol
  rationale: Mantém a imagem incomum e opressiva de peso ou gravidade ligada ao destino no Sheol, em vez de a reduzir simplesmente à sepultura.
- source_word: ሲኦል
  choice: Sheol
  rationale: A transliteração preserva o conceito judaico antigo do mundo dos mortos e evita identificá-lo automaticamente com formulações posteriores sobre o inferno.
theological_decisions:
- issue: Designação do mundo dos mortos
  choice: Sheol
  alternative: sepultura, mundo dos mortos ou inferno
  rationale: “Sheol” conserva a textura cosmológica da apocalíptica judaica e não importa para o verso uma identificação doutrinária posterior.
- issue: Imagem da descida
  choice: para o peso do Sheol
  alternative: para o Sheol opressivo ou para a sepultura
  rationale: A formulação retém a metáfora difícil do peso sem explicar além da evidência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção direta. As dificuldades lexicais e a referência imprecisa da frase de procedência foram mantidas e explicitadas em notas, sem suavizar a imagem incomum do “peso do Sheol”.
