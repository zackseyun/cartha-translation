base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/002.yaml
  text: And I saw the balances of righteousness[a], how they are weighed according to their lights, the width of their places, and the day of their appearing; and their revolution brings forth lightning, and their revolution is according to the number of the angels[e][d][c][b], and they keep faith with one another.
translation:
  language: pt
  text: 'E vi as balanças da justiça[a]: como são pesadas segundo suas luzes, a largura de seus lugares e o dia de seu aparecimento; sua revolução produz relâmpagos, e sua revolução se dá segundo o número dos anjos[b], e mantêm fidelidade entre si[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase inicial é difícil. “Balanças da justiça” segue a leitura lexical revisada do ge'ez; a construção e a relação entre as balanças, as luzes e os lugares permanecem incertas.
    reason: textual_variant
  - marker: b
    text: Também pode significar que a revolução segue a contagem feita pelos anjos; o ge'ez diz literalmente “segundo o número dos anjos”, sem verbo explícito para “contar”.
    reason: lexical_alternative
  - marker: c
    text: O sujeito da frase final é incerto. Ela pode se referir às entidades celestes, às suas revoluções ou aos anjos, afirmando que preservam entre si uma ordem fiel.
    reason: alternative_reading
lexical_decisions:
- source_word: መዳልወ፡ ጽድቅ
  choice: as balanças da justiça
  rationale: A revisão lexical mais recente identifica መዳልወ como “balanças”, não como “luminares”. Mantém-se a construção genitiva elevada “da justiça”.
- source_word: ይደለው
  choice: são pesadas
  rationale: O verbo descreve pesagem e concorda naturalmente, em português, com “balanças”, embora a imagem permaneça difícil.
- source_word: በብርሃናቲሆሙ
  choice: segundo suas luzes
  rationale: Preserva a expressão concreta e a relação indicada pela preposição, sem explicar quais entidades possuem as luzes.
- source_word: ሰረኃበ፡ መካናቲሆሙ
  choice: a largura de seus lugares
  rationale: Segue a correção textual indicada pela revisão, que reconhece sob a forma transmitida um termo referente a “largura”, e mantém “lugares” sem expansão interpretativa.
- source_word: ዕለተ፡ ክነቶሙ
  choice: o dia de seu aparecimento
  rationale: Distingue ክነቶሙ do termo posterior para revolução e conserva o singular “dia” do texto apresentado.
- source_word: ሚጠቶሙ
  choice: sua revolução
  rationale: Expressa o movimento recorrente ou giro astronômico, evitando a tradução anterior e imprecisa por “estações”.
- source_word: መብረቅ፡ ይወልድ
  choice: produz relâmpagos
  rationale: Transmite de modo natural a imagem de gerar ou fazer surgir relâmpagos; o plural idiomático em português não altera a imagem básica.
- source_word: በኍልቈ፡ መላእክት
  choice: segundo o número dos anjos
  rationale: Mantém a ideia de conformidade com uma contagem e verte መላእክት por “anjos” no contexto celestial de 1 Enoque.
- source_word: ሃይማኖቶሙ፡ የዓቅቡ
  choice: mantêm fidelidade umas para com as outras
  rationale: Preserva a noção de constância ou fidelidade mútua no ordenamento celeste sem introduzir linguagem doutrinária posterior.
theological_decisions:
- issue: Referente das balanças e dos pronomes
  choice: Conservar os referentes implícitos e a imagem cósmica sem identificar explicitamente balanças, luzes ou revoluções com estrelas, anjos ou justos.
  alternative: Explicitar que se trata dos luminares celestes ou dos justos.
  rationale: O texto é sintaticamente e imageticamente difícil; uma identificação explícita eliminaria uma ambiguidade genuína.
- issue: Sentido da cláusula final de fidelidade
  choice: Aplicar gramaticalmente a fidelidade às entidades femininas evocadas por “balanças”, mantendo o vínculo mútuo.
  alternative: Entender que os anjos mantêm fidelidade entre si ou que os corpos celestes permanecem em harmonia.
  rationale: A proximidade de “anjos” permite mais de uma leitura do sujeito. O texto principal acompanha a continuidade gramatical, enquanto a nota registra a alternativa.
- issue: Relação entre revolução e número dos anjos
  choice: Traduzir literalmente como conformidade ao número dos anjos.
  alternative: Interpretar como uma contagem realizada pelos anjos.
  rationale: A preposição exprime relação ou conformidade, mas o texto não contém verbo explícito de contar.
translation_notes:
  register: Português moderno, digno e legível, com vocabulário cósmico-apocalíptico preservado. A sintaxe foi levemente regularizada para clareza, mas as incertezas do ge'ez foram mantidas no texto e nas notas.
