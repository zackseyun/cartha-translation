base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/001.yaml
  text: And I saw other lightnings and the stars of heaven[a], and I saw how he calls them all by their respective names[d][c][b], and they hear him.
translation:
  language: pt
  text: E vi outros relâmpagos e as estrelas do céu; e vi como ele chama a todos, cada um pelo seu nome[a], e eles o ouvem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelos respectivos nomes”. A expressão em ge''ez tem sentido distributivo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o ouvem”; neste contexto, a expressão também pode sugerir que lhe atendem ou obedecem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: E vi
  rationale: Preserva a fórmula visionária repetida e sua cadência sem recorrer a linguagem arcaica.
- source_word: ካልአ መባርቅተ
  choice: outros relâmpagos
  rationale: Toma ካልአ como adjetivo de መባርቅተ, conforme a concordância possível do plural não regular em ge'ez, evitando a ruptura sintática de “outra coisa”.
- source_word: ወከዋክብተ ሰማይ
  choice: e as estrelas do céu
  rationale: Expressão celestial natural em português, com registro bíblico-apocalíptico digno.
- source_word: ከመ ይጼውዖሙ
  choice: como ele chama
  rationale: Depois de “vi”, “como” expressa naturalmente aquilo que foi observado; o presente mantém a forma do texto e a vivacidade da visão.
- source_word: ለኵሎሙ
  choice: a todos
  rationale: Reproduz de modo conciso a totalidade dos objetos chamados.
- source_word: በበአስማቲሆሙ
  choice: cada um pelo seu nome
  rationale: A preposição reduplicada tem força distributiva; esta formulação a torna explícita em português corrente.
- source_word: ወይሰምዕዎ
  choice: e eles o ouvem
  rationale: Mantém o sentido lexical básico de “ouvir”, sem transformar em certeza a obediência que o contexto talvez implique.
theological_decisions:
- issue: Se as estrelas são apenas objetos celestes personificados ou seres celestes responsivos sob autoridade divina
  choice: 'Manter a linguagem pessoal: “ele chama... e eles o ouvem”'
  alternative: “ele os convoca... e eles lhe obedecem”
  rationale: O texto apresenta os elementos celestes em termos pessoais. A tradução conserva essa tensão apocalíptica sem reduzi-la a mera figura de linguagem nem impor uma angelologia específica.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblico-apocalíptica. “Relâmpagos” preserva o plural concreto do ge'ez; “cada um pelo seu nome” explicita com naturalidade a distribuição. Todos os marcadores de nota aparecem no texto principal.
