base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/004.yaml
  text: 'And he said to me[d][c][b][a], “The Lord of Spirits has shown you their names: these are the names of the holy ones who dwell upon the dry ground and believe in the name of the Lord of Spirits forever and ever.”'
translation:
  language: pt
  text: 'E ele me disse: “O Senhor dos Espíritos mostrou a você a representação deles[a]: estes são os nomes dos santos que habitam na terra seca[b] e creem[c] no nome do Senhor dos Espíritos para todo o sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “a semelhança deles” ou “a parábola deles”. A forma etíope também pode ser entendida como a preposição “com”, mas essa leitura torna a construção sintaticamente difícil.
    reason: alternative_reading
  - marker: b
    text: “Terra seca” traduz de modo concreto o termo etíope; também se pode dizer “solo seco” ou, de modo mais geral, “terra”. A expressão pode realçar o contraste com a esfera celeste da visão.
    reason: lexical_alternative
  - marker: c
    text: Ou “confiam”. O verbo etíope pode expressar tanto crer como depositar confiança.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስለ ዘዚአሆሙ
  choice: o que eles representam
  rationale: Neste contexto, ምስለ é melhor entendido como forma construta de ምስል, “imagem, semelhança, representação, parábola”, seguida de “deles”. A formulação portuguesa comunica que os astros vistos representam os santos, sem impor o sentido moderno mais restrito de “parábola”. A leitura preposicional “com estes” é possível na forma isolada, mas produz aqui uma sintaxe muito difícil.
- source_word: እግዚአ መንፈሳት
  choice: Senhor dos Espíritos
  rationale: Título divino recorrente em 1 Enoque; a forma consagrada preserva seu caráter apocalíptico e solene.
- source_word: አርአየከ
  choice: mostrou a você
  rationale: Expressa diretamente a ação reveladora dirigida ao visionário, em português moderno e amplamente compreensível.
- source_word: እሉ እሙንቱ አስማቲሆሙ ለቅዱሳን
  choice: estes são os nomes dos santos
  rationale: 'O sufixo pronominal antecipatório em “nomes deles”, seguido da expressão com ለ, identifica os possuidores: “os nomes dos santos”. O demonstrativo e o pronome conferem ênfase identificadora, vertida naturalmente por “estes são”.'
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: que habitam sobre a terra seca
  rationale: Mantém a imagem concreta de የብስ, “terra seca, solo seco”, em vez de generalizá-la simplesmente como “terra”; “habitam” conserva o registro elevado sem soar arcaico.
- source_word: ወየአምኑ በስሙ
  choice: e creem no nome
  rationale: O verbo abrange crer e confiar. “Creem no nome” conserva o idioma religioso do texto e deixa a nuance de confiança registrada em nota.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Equivalente português idiomático e solene da fórmula enfática de duração eterna.
theological_decisions:
- issue: Identidade dos “santos” que habitam sobre a terra seca
  choice: referência mais natural aos fiéis humanos que vivem na terra
  alternative: seres santos celestes, ou uma correspondência deliberada entre santos celestes e terrestres
  rationale: A oração relativa diz que eles habitam sobre a terra seca e creem no nome do Senhor dos Espíritos, o que favorece pessoas fiéis na terra. A tradução, contudo, não acrescenta “humanos” nem exclui explicitamente a ressonância entre a realidade celeste vista e aqueles que ela representa.
- issue: Relação entre os astros da visão e os nomes dos santos
  choice: os elementos vistos representam os santos
  alternative: “com estes” ou “acerca destes”, tomando ምስለ como preposição
  rationale: 'A análise de ምስለ como forma construta de ምስል dá sentido coerente à explicação visionária: o Senhor revelou a representação ou semelhança deles. A dificuldade formal é reconhecida em nota, sem transformar a interpretação em explicação doutrinária.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturalmente compreensíveis no Brasil. Mantém-se o título enóquico “Senhor dos Espíritos”, a imagem concreta “terra seca” e a repetição de “nome”. A construção obscura no início é apresentada de modo inteligível no texto principal, enquanto sua literalidade e a leitura alternativa são preservadas em nota.
