base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/003.yaml
  text: And I asked the angel who went with me[a], who showed me what was hidden, “What are these?”
translation:
  language: pt
  text: 'Então perguntei ao anjo que ia comigo, que me mostrou o que estava oculto[a]: “O que são estas coisas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as coisas ocultas” ou “os segredos”. O termo ge’ez se refere a realidades encobertas até serem mostradas na visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: perguntei
  rationale: O verbo derivado de ሰአለ expressa perguntar ou indagar; “perguntei” é natural em português e introduz adequadamente a pergunta direta.
- source_word: መልአክ
  choice: anjo
  rationale: No contexto apocalíptico, trata-se do intérprete celestial que acompanha Enoque; “anjo” comunica melhor essa função do que o termo genérico “mensageiro”.
- source_word: ዘየሐውር ምስሌየ
  choice: que ia comigo
  rationale: Preserva a ideia de movimento e acompanhamento durante a jornada visionária, em linguagem corrente e digna.
- source_word: ዘአርአየኒ
  choice: que me mostrou
  rationale: O verbo significa mostrar ou fazer ver; a formulação mantém o caráter visual da revelação sem acrescentar interpretação.
- source_word: ኅቡእ
  choice: o que estava oculto
  rationale: Conserva a referência algo aberta a uma realidade ou a um conjunto de realidades antes escondidas e agora mostradas na visão.
- source_word: ምንት እሙንቱ እሉ
  choice: O que são estas coisas?
  rationale: O demonstrativo parece apontar para objetos ou fenômenos vistos. A explicitação por “coisas” soa mais natural em português e não exige um referente pessoal.
theological_decisions:
- issue: Representação da realidade oculta revelada no contexto apocalíptico
  choice: o que estava oculto
  alternative: as coisas ocultas; os segredos
  rationale: A opção preserva o motivo apocalíptico da revelação de realidades antes encobertas, sem transformar a expressão em terminologia técnica de segredo nem definir indevidamente número ou conteúdo.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe mantém a sequência relativa do ge’ez, com leve ajuste idiomático; o tom permanece simples, digno e visionário.
