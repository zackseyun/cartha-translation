base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/008.yaml
  text: And now[a], I show you that light and darkness, day and night[b], see all your sins.
translation:
  language: pt
  text: E agora, eu lhes mostro que a luz e as trevas, o dia e a noite[a], veem todos os pecados de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A luz e as trevas, o dia e a noite são retratados como testemunhas que veem cada pecado. A imagem também pode sugerir “às claras e em segredo, em todo o tempo”.
    reason: cultural_note
  - marker: b
    text: 'Ou: “E agora, eu lhes mostro: pois a luz e as trevas, o dia e a noite veem todos os pecados de vocês”.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ወይ እዜኒ
  choice: E agora
  rationale: Marca naturalmente a transição temporal e discursiva, sem acrescentar ênfase ausente do texto.
- source_word: አነ አርእየክሙ
  choice: eu lhes mostro
  rationale: Preserva a forma causativa ligada a ver, mantendo a força visual da linguagem apocalíptica.
- source_word: እስመ
  choice: que
  rationale: Depois de um verbo de mostrar, funciona naturalmente como complementizador que introduz aquilo que é mostrado; a nota registra a leitura causal possível.
- source_word: ብርሃን፡ ወጽልመት
  choice: a luz e as trevas
  rationale: Reproduz diretamente o par antitético e sua imagem de testemunho cósmico.
- source_word: ዕለት፡ ወሌሊት
  choice: o dia e a noite
  rationale: Mantém o segundo merismo, que comunica totalidade e testemunho contínuo.
- source_word: ይሬእዩ
  choice: veem
  rationale: O presente simples conserva a afirmação geral e trata os elementos cósmicos como sujeitos do verbo.
- source_word: ኵሎ፡ ኃጢአትክሙ
  choice: todos os pecados de vocês
  rationale: Conserva a pluralidade concreta das transgressões e a força totalizante de ኵሎ, em português amplamente compreensível.
theological_decisions:
- issue: Se os elementos cósmicos são apenas indicações de circunstância ou testemunhas ativas do pecado humano
  choice: A luz, as trevas, o dia e a noite veem os pecados dos ouvintes.
  alternative: A expressão significa apenas que os pecados são cometidos às claras e em segredo, de dia e de noite.
  rationale: A sintaxe toma mais naturalmente os substantivos emparelhados como sujeito de “veem”. A personificação também se ajusta à retórica apocalíptica, por isso não deve ser reduzida silenciosamente a uma expressão temporal.
- issue: Função de እስመ após “eu lhes mostro”
  choice: 'Complementizador: “que”.'
  alternative: 'Conjunção causal ou explicativa: “pois”.'
  rationale: Após um verbo de percepção ou demonstração, እስመ pode introduzir a oração que constitui o conteúdo mostrado. Essa leitura produz a ligação sintática mais direta, embora a alternativa seja registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Eu lhes mostro” mantém o pronome explícito do ge'ez e evita uma formulação excessivamente abstrata; “de vocês” expressa com clareza o possessivo plural. A personificação cósmica foi preservada.
