base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/005.yaml
  text: What will you have to do? You will not have to hide on the day of the great judgment[a], and you will not be found as sinners[c][b]; and everlasting judgment will be upon you for all the generations of the world.
translation:
  language: pt
  text: Que terão vocês de fazer? Não precisarão esconder-se no dia do grande juízo e não serão achados como pecadores[a]; o juízo eterno ficará longe de vocês[b] por todas as gerações do mundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração “não serão achados como pecadores” é textual e sintaticamente difícil neste contexto. Alguns entendem o sentido de modo adversativo, como “serão achados pecadores” ou “não serão achados senão como pecadores”; aqui, porém, conserva-se a negação do testemunho etíope.
    reason: textual_variant
  - marker: b
    text: Literalmente, a expressão pode ser traduzida por “será de vocês” ou “será a partir de vocês”. Entende-se aqui que o juízo estará afastado dos destinatários; também se propõe “estará sobre vocês”, mas essa leitura é menos direta para a preposição etíope.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንተ፡ ሀለወክሙ፡ ትግበሩ
  choice: Que terão vocês de fazer?
  rationale: Reproduz a pergunta retórica formada pelo interrogativo, a construção existencial com sufixo pronominal e o verbo “fazer”, sem ampliar sua ameaça ou seu consolo.
- source_word: አኮ፡ ትትኀብኡ
  choice: Não precisarão esconder-se
  rationale: A forma verbal admite valor reflexivo/passivo. Neste contexto, a formulação expressa que os destinatários não terão necessidade de se ocultar, em português natural.
- source_word: በዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: no dia do grande juízo
  rationale: Mantém a fórmula temporal e escatológica de modo solene e corrente.
- source_word: ወኢትትረከቡ፡ ከመ፡ ኃጥኣን
  choice: e não serão achados como pecadores
  rationale: Segue conservadoramente o testemunho etíope, inclusive sua negação sintaticamente difícil, sem emendá-lo para “serão achados pecadores”.
- source_word: ኵነኔ፡ እንተ፡ ለዓለም
  choice: o juízo eterno
  rationale: Traduz literalmente a ideia de um juízo que é para sempre, sem substituir “juízo” por um termo doutrinariamente mais específico.
- source_word: ትከዉን፡ እምኔክሙ
  choice: ficará longe de vocês
  rationale: O sentido básico de እምኔክሙ é “de vocês/a partir de vocês”; no contexto de destinatários que não serão achados como pecadores, a separação ou distância oferece a leitura contextual mais coerente. A nota preserva a expressão literal e a dificuldade.
- source_word: ለእሉ፡ ትዉልደ፡ ዓለም
  choice: por todas as gerações do mundo
  rationale: Conserva tanto a duração prolongada quanto a imagem das gerações do mundo.
theological_decisions:
- issue: Sentido de “não serão achados como pecadores”
  choice: Manter a negação do texto transmitido
  alternative: “serão achados pecadores” ou “não serão achados senão como pecadores”
  rationale: Embora a frase seja difícil, retirar ou reinterpretar a negação resolveria silenciosamente uma tensão textual real.
- issue: Relação do juízo eterno com os destinatários
  choice: “ficará longe de vocês”
  alternative: “estará sobre vocês” ou, literalmente, “será de vocês”
  rationale: A preposição aponta primariamente para origem ou afastamento, não para a ideia inequívoca de algo “sobre” os destinatários. O contexto imediato da frase favorece distância, mas a nota registra a ambiguidade para evitar certeza excessiva.
- issue: Valor de ትትኀብኡ
  choice: 'necessidade reflexiva: “não precisarão esconder-se”'
  alternative: 'passivo: “não estarão escondidos”'
  rationale: O valor reflexivo produz português natural e se harmoniza com a segurança oferecida aos destinatários, sem negar que a forma também possa ser entendida passivamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A redação mantém a concisão e o paralelismo do original, enquanto as duas dificuldades principais são explicitadas em notas.
