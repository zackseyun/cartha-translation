base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/010.yaml
  text: 'And now I know this mystery: that many sinners will alter the word of righteousness and pervert it[a], and speak evil words and lie, and they will devise great fabrications[d][c][b], and they will write books concerning their own words.'
translation:
  language: pt
  text: 'E agora conheço este mistério: muitos pecadores alterarão a palavra da justiça e se desviarão[a]; falarão palavras más e mentirão; conceberão grandes invenções[b] e escreverão livros a respeito de suas próprias palavras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A leitura deste verbo é difícil. Também pode ser entendido: “e a perverterão”; outras possibilidades são “e andarão errantes”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “grandes fabricações” ou “grandes composições”. A expressão pode designar coisas formadas ou produzidas; neste contexto de mentira, provavelmente tem sentido negativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አአምር
  choice: conheço
  rationale: O presente simples corresponde à declaração introduzida por “agora” e preserva o sentido de saber ou compreender.
- source_word: ምሥጢር
  choice: mistério
  rationale: No contexto apocalíptico, designa conhecimento antes oculto e agora revelado.
- source_word: ነገረ ርትዕ
  choice: a palavra da justiça
  rationale: Mantém de forma transparente a construção compacta do ge'ez, que pode indicar palavra, mensagem ou ensino justo.
- source_word: ይመይጡ
  choice: alterarão
  rationale: A forma é entendida como verbo ativo no plural, tendo “muitos pecadores” como sujeito e “a palavra da justiça” como objeto.
- source_word: የዐልዉ
  choice: a perverterão
  rationale: A leitura contextual relaciona o verbo ao objeto anterior, expressando a corrupção da palavra; como a forma é difícil, a incerteza é registrada em nota.
- source_word: ነገራተ እኩያተ
  choice: palavras más
  rationale: O contexto de fala, mentira e livros favorece conteúdo verbal, embora a expressão também possa significar coisas ou assuntos maus.
- source_word: ይሐስዉ
  choice: mentirão
  rationale: Tradução direta, clara e vigorosa da acusação.
- source_word: ይፈጥሩ ፍጥረተ ዐቢየተ
  choice: conceberão grandes invenções
  rationale: A repetição da raiz de formar ou produzir sugere criações concebidas; “invenções” preserva alguma amplitude lexical, enquanto o contexto lhes confere sentido negativo.
- source_word: መጻሕፍተ ይጽሐፉ ዲበ ነገራቲሆሙ
  choice: escreverão livros a respeito de suas próprias palavras
  rationale: Conserva a ligação dos livros com aquilo que os próprios pecadores dizem, sem condenar a escrita de livros em si.
theological_decisions:
- issue: Se o texto descreve o abandono da palavra justa ou sua alteração por pecadores
  choice: Os pecadores alteram ativamente a palavra da justiça.
  alternative: A palavra da justiça será negligenciada.
  rationale: A sintaxe mais convincente lê o verbo como terceira pessoa do plural ativa, com “muitos pecadores” por sujeito. Isso também se ajusta à advertência contra a corrupção do ensino.
- issue: Relação do segundo verbo com “a palavra da justiça”
  choice: “a perverterão”, retomando a palavra como objeto
  alternative: “se desviarão” ou “andarão errantes”
  rationale: A sequência pode descrever uma segunda ação contra a palavra, mas a leitura do verbo é difícil; a nota preserva a alternativa sem interromper o texto.
- issue: Alcance da crítica aos livros
  choice: A censura recai sobre livros que promovem as palavras falsas dos pecadores.
  alternative: Condenação geral da produção de livros.
  rationale: A cláusula final liga os livros às “suas próprias palavras” e ao contexto imediato de mentira e corrupção, não à escrita como atividade em si.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. A coordenação foi pontuada com ponto e vírgula para tornar a longa sequência profética mais clara. As notas se limitam às incertezas reais do texto e do léxico.
