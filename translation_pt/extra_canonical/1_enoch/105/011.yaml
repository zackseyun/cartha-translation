base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/011.yaml
  text: And when they write all the words truthfully in their languages[a], and neither alter nor omit anything from my words[d][c][b], but write down everything truthfully—all the former things—
translation:
  language: pt
  text: E quando eles escreverem fielmente todas as palavras em suas línguas[a], sem alterar nem omitir nada das minhas palavras, mas escreverem tudo fielmente — todas as coisas anteriores[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sobre/em suas línguas”; neste contexto de escrita, a expressão significa “em suas línguas” ou “em seus idiomas”.
    reason: lexical_alternative
  - marker: b
    text: A expressão etíope é concisa e também pode ser entendida, pelo contexto, como “tudo o que foi escrito antes”.
    reason: alternative_reading
lexical_decisions:
- source_word: ወሶበሰ፡
  choice: E quando
  rationale: Preserva tanto a conexão com o contexto anterior quanto a introdução da oração temporal.
- source_word: ኵሎ፡ ነገራተ፡
  choice: todas as palavras
  rationale: O substantivo está no acusativo e funciona como objeto direto; não traz aqui o sufixo de primeira pessoa. No contexto da transmissão escrita, “palavras” é mais adequado que “coisas” ou “assuntos”.
- source_word: ይጽሐፉ፡
  choice: eles escreverem
  rationale: Mantém a construção ativa e o mesmo sujeito dos verbos seguintes, evitando uma mudança injustificada para a voz passiva.
- source_word: በርትዕ፡
  choice: fielmente
  rationale: Expressa correção, retidão e fidelidade textual de modo natural em português; o contexto enfatiza que o conteúdo não deve ser alterado nem reduzido.
- source_word: ዲበ፡ ልሳናቲሆሙ፡
  choice: em suas línguas
  rationale: A expressão literal “sobre/em suas línguas” designa aqui os idiomas nos quais as palavras são escritas.
- source_word: ወኢይዌልጡ፡
  choice: sem alterar
  rationale: Comunica de modo conciso a proibição de mudar ou deturpar o texto e coordena-se naturalmente com “nem omitir”.
- source_word: ወኢየሐጽጹ፡
  choice: nem omitir nada
  rationale: O verbo indica retirar ou subtrair; em contexto de cópia textual, “omitir” exprime com clareza o efeito pretendido.
- source_word: እምነገራቲየ፡
  choice: das minhas palavras
  rationale: Preserva o sufixo explícito de primeira pessoa e a repetição lexical do texto-fonte.
- source_word: አላ፡
  choice: mas
  rationale: Marca o contraste entre alterar ou omitir e registrar integralmente com fidelidade.
- source_word: ኵሎ፡ በርትዕ፡ ይጽሐፉ፡
  choice: escreverem tudo fielmente
  rationale: Conserva a repetição enfática do ato de escrever e da exigência de fidelidade.
- source_word: ኵሎ፡ ዘቀዳሚ፡
  choice: todas as coisas anteriores
  rationale: Reproduz a formulação comprimida “tudo o que é anterior/as coisas anteriores” sem acrescentar ao original o verbo “escrever”.
theological_decisions:
- issue: Natureza da fidelidade exigida na transmissão das palavras de Enoque
  choice: A passagem trata da transmissão escrita fiel das palavras em diferentes línguas, sem alteração nem omissão.
  alternative: Uma exortação genérica à veracidade moral ou uma referência à proclamação oral.
  rationale: A repetição do verbo “escrever”, acompanhada das proibições de alterar e omitir, favorece claramente o sentido de fidelidade textual, embora “línguas” retenha a imagem idiomática do original.
- issue: Sentido da expressão final comprimida
  choice: todas as coisas anteriores
  alternative: tudo o que foi escrito antes
  rationale: O contexto permite relacionar a expressão à escrita precedente, mas o texto-fonte não repete explicitamente o verbo nessa frase final. A tradução preserva essa concisão e evita resolver a ambiguidade por acréscimo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção fluente para leitores brasileiros. “Fielmente” reúne as ideias de correção e integridade textual. O travessão conserva o caráter suspenso e comprimido do encerramento do versículo, que parece prosseguir no contexto.
