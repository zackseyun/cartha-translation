base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/009.yaml
  text: Do not be wicked in your hearts[a], and do not lie, and do not alter the word of uprightness, and do not declare false the word of the Great Holy One, and do not account your idols as anything; for all your falsehood and all your uncleanness are not for righteousness[f][e][d][c][b], but for great sin.
translation:
  language: pt
  text: Não se desviem em seus corações[a], nem mintam. Não alterem a palavra da retidão[b], nem declarem falsa a palavra do Grande Santo[c], e não considerem seus ídolos como coisa alguma[d]; pois toda a falsidade e toda a impureza de vocês não servem à justiça, mas a um grande pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não errem em seus corações” ou “Não se desencaminhem em seus corações”.'
    reason: lexical_alternative
  - marker: b
    text: “Alterem” também pode ser traduzido por “deturpem” ou “pervertam”; “palavra da retidão” também pode significar “questão de justiça”.
    reason: lexical_alternative
  - marker: c
    text: A expressão também pode ser entendida como “a grande palavra santa” ou “a santa e grande palavra”.
    reason: textual_ambiguity
  - marker: d
    text: 'A cláusula é difícil. O verbo significa “considerar”, “calcular” ou “ter em conta”; por isso, também seria possível traduzir: “não deem valor aos seus ídolos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትርሥዑ በልብክሙ
  choice: Não se desviem em seus corações
  rationale: O verbo admite os sentidos de errar ou desviar-se. “Desviar-se” comunica de modo natural o afastamento moral interior sem antecipar o termo explícito para “pecado” no fim do versículo; “em seus corações” conserva a imagem antropológica do geʿez.
- source_word: ተሐስዉ
  choice: mintam
  rationale: Tradução direta e corrente do verbo simples que denota mentir, distinguindo-o da forma factitiva empregada mais adiante.
- source_word: አትሚጥዋ ለነገረ ርትዕ
  choice: Não alterem a palavra da retidão
  rationale: “Alterar” preserva a ideia de mudar, deturpar ou perverter; “palavra” se ajusta ao contexto de fala e mantém a repetição de ነገረ, enquanto “retidão” distingue ርትዕ do posterior ጽድቅ, “justiça”.
- source_word: ታሐስውዋ ለነገረ ቅዱስ ዐቢይ
  choice: nem declarem falsa a palavra do Grande Santo
  rationale: A forma verbal factitiva significa declarar falso ou desmentir, e não apenas falar falsamente. A construção adjetival é entendida como título pessoal, “Grande Santo”, embora a segmentação permita outra leitura, registrada em nota.
- source_word: ትሕስብዋ ለጣዖትክሙ
  choice: não considerem seus ídolos como coisa alguma
  rationale: O verbo pertence ao campo de calcular, considerar ou ter em conta. A formulação conserva essa força cognitiva e explicita a falta de valor ou realidade atribuível aos ídolos sem introduzir a ideia mais específica de confiar neles.
- source_word: ኵሉ ሐሰትክሙ ወኵሉ ርኩስነክሙ
  choice: toda a falsidade e toda a impureza de vocês
  rationale: Os substantivos coletivos são mantidos, assim como a repetição enfática de “toda”; “de vocês” proporciona clareza e ampla legibilidade contemporânea.
- source_word: አኮነት ... ለጽድቅ አላ ለኃጢአት ዐቢይ
  choice: não servem à justiça, mas a um grande pecado
  rationale: A construção contrasta aquilo que é ou atua em favor da justiça com aquilo que é para o pecado. “Servem à” oferece português natural sem tornar o contraste explicitamente causal, como faria “conduzem a”.
theological_decisions:
- issue: Natureza da primeira proibição interior
  choice: Não se desviem em seus corações
  alternative: Não pequem em seus corações
  rationale: A tradução evita identificar de antemão o desvio com o substantivo específico “pecado”, que só aparece no encerramento, preservando a progressão e a amplitude semântica.
- issue: Referente de ቅዱስ ዐቢይ
  choice: a palavra do Grande Santo
  alternative: a grande palavra santa
  rationale: A leitura titular está de acordo com o contexto enóquico e com a construção adotada pela camada auditada, mas a sequência geʿez admite que os adjetivos qualifiquem “palavra”; essa ambiguidade é mantida em nota.
- issue: Sentido da advertência acerca dos ídolos
  choice: não considerem seus ídolos como coisa alguma
  alternative: não confiem em seus ídolos
  rationale: A tradução retém o sentido de considerar ou computar e não acrescenta uma teologia de confiança ou culto que o verbo, por si só, não especifica.
- issue: Relação entre falsidade, impureza, justiça e pecado
  choice: não servem à justiça, mas a um grande pecado
  alternative: não conduzem à justiça, mas a um grande pecado
  rationale: “Servem à” conserva o contraste relacional da construção com ለ sem transformar implicitamente a frase numa afirmação de resultado ou trajetória moral.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos na terceira pessoa do plural e pronomes de ampla legibilidade brasileira. Mantêm-se os paralelismos e as repetições do original, mas a pontuação divide a longa cadeia de proibições para facilitar a leitura. As ambiguidades relevantes do geʿez são preservadas em notas.
