base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/006.yaml
  text: And now[a], righteous ones, do not fear when you see sinners growing strong and prospering in their ways. Do not become their companions, but keep far from their violence[b]; for you shall be companions of the good ones of heaven.
translation:
  language: pt
  text: E agora, justos, não tenham medo quando virem os pecadores se fortalecerem e prosperarem em seus caminhos. Não se tornem companheiros deles; pelo contrário, mantenham-se longe da violência[a] deles, pois vocês serão companheiros dos bons do céu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “opressão”.
    reason: O termo ge'ez pode designar tanto violência quanto injustiça opressiva.
  - marker: b
    text: Isto é, os seres bons pertencentes ao céu; o texto não os identifica mais precisamente.
    reason: A expressão é coletiva e não especifica se o referente são apenas anjos.
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: não tenham medo
  rationale: Preserva a proibição direta dirigida aos justos, em português atual e digno.
- source_word: ጻድቃን
  choice: justos
  rationale: Mantém o substantivo coletivo que designa o grupo ético contraposto aos pecadores.
- source_word: ይጸንዑ
  choice: se fortalecerem
  rationale: Expressa a ideia de adquirir força ou firmeza sem acrescentar uma vitória definitiva.
- source_word: ይደልዉ
  choice: prosperarem
  rationale: Comunica o êxito aparente dos pecadores e forma um par natural com “se fortalecerem”.
- source_word: ፍኖቶሙ
  choice: em seus caminhos
  rationale: Conserva a metáfora do caminho como conduta ou modo de vida.
- source_word: ሱቱፋነ
  choice: companheiros
  rationale: O mesmo termo é empregado nas duas ocorrências para preservar o contraste entre a companhia dos pecadores e a dos bons do céu.
- source_word: ግፍዐ
  choice: violência
  rationale: Representa a injustiça violenta ou opressiva indicada pelo termo; a alternativa é registrada em nota.
- source_word: ኄራነ ሰማይ
  choice: os bons do céu
  rationale: ኄራነ é o plural construto de “bom”, não “hoste”; a tradução preserva o contraste ético entre os pecadores e os bons.
theological_decisions:
- issue: Identidade dos “bons do céu”
  choice: Manter a designação coletiva “os bons do céu” sem identificar explicitamente o grupo.
  alternative: os anjos do céu
  rationale: O texto caracteriza o grupo como bom e celestial, mas não o restringe expressamente aos anjos; a formulação preserva essa abertura.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais de ampla legibilidade brasileira. A repetição de “companheiros” foi mantida deliberadamente para reproduzir o paralelismo ético do original.
