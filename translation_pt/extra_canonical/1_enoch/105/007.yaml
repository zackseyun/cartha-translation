base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/007.yaml
  text: And because you sinners say[a], ‘We are not sought out[d][c][b], and all our sins are not written down’—all your sins are being written down every day.
translation:
  language: pt
  text: 'Pois vocês, pecadores, dizem: “Vocês não investigam[a], e eles não registram todos os nossos pecados”. No entanto, eles estão registrando todos os pecados de vocês, todos os dias.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode ser traduzido por “procuram” ou “examinam”; neste contexto, pode ter sentido judicial.
    reason: lexical_alternative
  - marker: b
    text: O ge’ez passa da segunda pessoa plural (“vocês não investigam”) para a terceira pessoa plural (“eles não registram”; “eles estão registrando”), sem identificar expressamente esses sujeitos.
    reason: source_ambiguity
lexical_decisions:
- source_word: ወእስመ (wa-ʾəsma)
  choice: Pois
  rationale: Introduz a razão ou fundamento da declaração seguinte; “pois” mantém a ligação argumentativa de modo natural em português.
- source_word: ትብሉ፡ አንትሙ፡ ኃጥኣን (təblu ʾantəmu ḫaṭʾan)
  choice: vocês, pecadores, dizem
  rationale: O pronome de segunda pessoa plural e “pecadores” estão em aposição ao sujeito de “dizem”, conforme a gramática explícita do ge’ez.
- source_word: ኢትኅሥሡ (ʾi-təḫśəśu)
  choice: vocês não investigam
  rationale: A forma é de segunda pessoa plural e o verbo pode expressar procurar, examinar ou investigar; “investigam” comunica melhor a nuance judicial do contexto.
- source_word: ኢይጽሐፉ፡ ኵሎ፡ ኃጢአትነ (ʾi-yəṣḥafu kwəllo ḫaṭiʾatəna)
  choice: eles não registram todos os nossos pecados
  rationale: A forma verbal é de terceira pessoa plural, enquanto “nossos” conserva a primeira pessoa plural do sufixo em ge’ez. “Registrar” mantém a imagem de um assentamento escrito sem soar artificial.
- source_word: ይጽሐፉ፡ ሀለዉ (yəṣḥafu hallawu)
  choice: eles estão registrando
  rationale: O imperfeito acompanhado do auxiliar ሀለዉ forma uma expressão progressiva; não se trata de uma interjeição equivalente a “eis”.
- source_word: በኵሉ፡ ዕለት (ba-kwəllu ʿəlat)
  choice: todos os dias
  rationale: Expressa naturalmente em português a ação distributiva e contínua indicada pela locução ge’ez.
theological_decisions:
- issue: Natureza do registro dos pecados
  choice: Conservar a imagem apocalíptica de agentes que registram continuamente os pecados antes do juízo.
  alternative: Parafrasear como mera afirmação de que Deus conhece os pecados.
  rationale: A repetição do verbo “escrever/registrar” favorece um registro escrito no cenário judicial e apocalíptico, sem identificar além do texto quem são os agentes.
- issue: Identidade dos sujeitos plurais
  choice: Manter os sujeitos indefinidos como “vocês” e “eles”, respeitando a mudança gramatical de segunda para terceira pessoa.
  alternative: Identificar os agentes como Deus, anjos ou escribas celestes.
  rationale: O versículo não nomeia os destinatários da acusação nem os responsáveis pelo registro; especificá-los resolveria indevidamente uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “vocês” para representar claramente a segunda pessoa plural e por “registrar” para conservar a imagem judicial da escrita. A oposição entre a alegação dos pecadores e a realidade do registro foi marcada por “No entanto”, sem acrescentar uma identificação teológica dos agentes.
