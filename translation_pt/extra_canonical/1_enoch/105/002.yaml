base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/002.yaml
  text: Hope[a], for formerly you were put to shame by evil and by affliction; but now you will shine like the light of heaven, you will shine and be seen[c][b], and the portals of heaven will be opened for you.
translation:
  language: pt
  text: Tenham esperança, pois antes vocês foram envergonhados pelo mal e pela aflição[a]; mas agora brilharão como a luz do céu; brilharão e serão vistos, e os portais do céu[b] serão abertos para vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela maldade e pelo sofrimento”. O ge''ez associa de forma compacta a vergonha tanto ao mal quanto à angústia, sem especificar se o mal é pessoal, social ou circunstancial.'
    reason: lexical_alternative
  - marker: b
    text: A imagem dos “portais do céu” indica o céu aberto em favor dos justos, mas o texto não especifica o que passa por esses portais nem se os justos entram por eles.
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: Tenham esperança
  rationale: O imperativo plural é vertido como exortação direta e natural, sem acrescentar uma explicação ausente no texto.
- source_word: ኃሠርክሙ
  choice: vocês foram envergonhados
  rationale: A forma passiva preserva a ideia de desonra sofrida pelos destinatários e prepara o contraste com sua futura manifestação pública.
- source_word: በእኩይ ወበምራኅ
  choice: pelo mal e pela aflição
  rationale: Mantém a construção compacta e não determina se o mal é pessoal, social ou circunstancial; “aflição” conserva o registro elevado sem perder clareza.
- source_word: ትበርሁ
  choice: brilharão
  rationale: A repetição do verbo no original é mantida, preservando o ritmo e a força da imagem apocalíptica.
- source_word: ብርሃነ ሰማይ
  choice: a luz do céu
  rationale: Reproduz diretamente a relação genitiva e mantém concreta a imagem cósmica.
- source_word: ትትረአዩ
  choice: serão vistos
  rationale: 'Preserva o provável sentido passivo: o brilho dos justos se tornará publicamente visível.'
- source_word: ኆኅተ ሰማይ
  choice: os portais do céu
  rationale: “Portais” corresponde ao sentido de porta ou entrada e se harmoniza com a cosmologia enóquica, evitando importar indevidamente a imagem distinta de janelas.
- source_word: ይትረኀዉ ለክሙ
  choice: serão abertos para vocês
  rationale: A construção passiva mantém o foco no acesso concedido aos destinatários sem explicitar um agente não nomeado.
theological_decisions:
- issue: Sentido da abertura dos portais celestes
  choice: Preservar a promessa por meio da imagem de que os portais do céu serão abertos para os justos.
  alternative: Explicitar que bênçãos descerão sobre eles ou que eles próprios entrarão no céu.
  rationale: O texto não declara o que passa pelos portais nem afirma diretamente a ascensão dos destinatários; por isso, a tradução conserva a tensão e a abertura da imagem.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”, amplamente compreensível no Brasil e internacionalmente. A repetição de “brilharão” e a imagética cósmica foram preservadas deliberadamente.
