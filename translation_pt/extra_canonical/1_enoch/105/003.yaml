base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/003.yaml
  text: And as for your cry[a], cry out, and he will make it appear to you[e][d][c][b]; for all your affliction will be sought out from the angels and from all those who helped those who plundered you.
translation:
  language: pt
  text: Quanto ao clamor de vocês[a], clamem, e ele o mostrará a vocês[b]; pois toda a aflição de vocês será investigada pelos anjos[c] e por todos os que ajudaram aqueles que os saquearam[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção inicial também pode ser entendida como: “E clamem em favor de vocês”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e ele o fará aparecer a vocês” ou “e ele o revelará a vocês”. O referente de “ele” e o objeto de “mostrará” não estão expressos com clareza neste trecho.'
    reason: textual_ambiguity
  - marker: c
    text: 'Ou: “mensageiros”. Embora o termo normalmente designe anjos em 1 Enoque, também pode ter sentido mais amplo conforme o contexto.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “os arrebataram” ou “os roubaram”. A frase distingue os saqueadores daqueles que lhes prestaram ajuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወጽራኅ፡ ዚአክሙ፡ ኵነኒ፡ ጽርኁ
  choice: Quanto ao clamor de vocês, clamem
  rationale: Mantém a repetição enfática da raiz ligada a clamar e entende ዚአክሙ como referência aos destinatários. A construção ge’ez é difícil, por isso uma alternativa é registrada em nota.
- source_word: ወያስተርኢ፡ ለክሙ
  choice: e ele o fará aparecer diante de vocês
  rationale: O verbo causativo expressa fazer ver, mostrar ou manifestar. A tradução conserva o sujeito masculino implícito e não identifica seu referente, que não está explícito neste trecho.
- source_word: ይትኃሠሥ፡ ኵሉ፡ ምንዳቤክሙ
  choice: toda a aflição de vocês será investigada
  rationale: O verbo sugere busca ou averiguação, enquanto ምንዳቤ abrange sofrimento, aflição e opressão. “Investigada” comunica com naturalidade o tom judicial sem limitar a aflição a uma única forma de sofrimento.
- source_word: መላእክት
  choice: anjos
  rationale: É o sentido predominante do termo no ambiente apocalíptico de 1 Enoque. “Mensageiros” continua lexicalmente possível e é indicado em nota.
- source_word: እለ፡ አርደእዎሙ
  choice: os que ajudaram aqueles
  rationale: O verbo deriva da ideia de ajudar ou prestar auxílio, e não de oprimir. O objeto plural é mantido na relação com a oração seguinte.
- source_word: ለእለ፡ የሀይዱክሙ
  choice: aqueles que os saquearam
  rationale: O verbo denota roubar, saquear ou arrebatar. “Saquearam” preserva a violência material da ação e corrige a leitura inadequada de “desviar”.
theological_decisions:
- issue: Identidade do sujeito implícito em “ele o fará aparecer”
  choice: manter o pronome “ele” sem identificar o referente
  alternative: 'explicitar Deus como sujeito ou traduzir impessoalmente: “isso aparecerá”'
  rationale: A forma verbal aponta para um agente masculino, mas o versículo isolado não o nomeia. Acrescentar “Deus” resolveria uma ambiguidade que o texto preserva.
- issue: Sentido de መላእክት no contexto da investigação da aflição
  choice: anjos
  alternative: mensageiros; governantes
  rationale: “Anjos” é o valor normal no quadro cosmológico de 1 Enoque. O contexto terreno permite discussão, mas não justifica substituir silenciosamente o sentido apocalíptico predominante.
- issue: Relação entre os auxiliares e os saqueadores na cláusula final
  choice: os que ajudaram aqueles que saquearam os destinatários
  alternative: os que os ajudaram e saquearam
  rationale: A sequência gramatical favorece uma relação em que um grupo auxilia os saqueadores. A tradução mantém essa distinção em vez de fundir os dois grupos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais (“vocês”, “clamem”). A repetição “clamor/clamem” preserva a força retórica do ge’ez. As ambiguidades de sujeito e de formulação são mantidas no texto ou explicitadas em notas, sem acréscimos confessionais.
