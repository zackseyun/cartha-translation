base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/004.yaml
  text: Hope[a], and do not abandon your hope, for great joy will be yours[b], like the angels of heaven.
translation:
  language: pt
  text: Tenham esperança e não abandonem a esperança de vocês, pois vocês terão grande alegria, como os anjos do céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A comparação é explícita, mas o texto não esclarece se ela se refere especificamente à alegria, à condição bem-aventurada ou à recompensa celestial dos anjos.
    reason: ambiguity
lexical_decisions:
- source_word: ተስፈዉ
  choice: Tenham esperança
  rationale: Imperativo plural do verbo ligado a esperar e confiar. A formulação preserva a exortação direta sem acrescentar um objeto ausente no texto.
- source_word: ወኢትኅድጉ ተስፋክሙ
  choice: e não abandonem a esperança de vocês
  rationale: O imperativo negativo expressa deixar ou abandonar. A repetição de “esperança” reproduz a ênfase retórica do ge'ez, enquanto “de vocês” deixa claro o destinatário plural em português corrente.
- source_word: እስመ
  choice: pois
  rationale: Introduz a razão da exortação com uma conjunção natural e digna em português.
- source_word: ትከዉኑ ለክሙ
  choice: vocês terão
  rationale: Representa de modo idiomático a construção verbal com dativo, cujo sentido é que a alegria será destinada aos ouvintes, sem sobrecarregar o português com uma construção literal pouco natural.
- source_word: ፍሥሓ ዐቢይ
  choice: grande alegria
  rationale: Tradução direta do substantivo e do adjetivo, preservando o tom de promessa e bênção.
- source_word: ከመ መላእክተ ሰማይ
  choice: como os anjos do céu
  rationale: Mantém explicitamente a comparação do ge'ez e a imagem apocalíptica, sem afirmar que os destinatários se transformarão em anjos.
theological_decisions:
- issue: Alcance da comparação com os anjos
  choice: A grande alegria prometida aos destinatários é comparada, de maneira não especificada, à condição ou alegria dos anjos do céu.
  alternative: Os justos se tornarão anjos ou serão ontologicamente iguais a eles.
  rationale: O ge'ez apresenta uma comparação simples com os anjos do céu, mas não declara transformação em anjos. A tradução mantém a comparação e a nota reconhece que seu ponto exato não é explicitado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural é explicitado por “vocês”, e a repetição de “esperança” preserva a retórica do original.
