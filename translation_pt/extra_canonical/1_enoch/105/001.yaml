  text: The glory of the Great One[b][a], and your names shall be written before the glory of the Great One.
translation:
  language: pt
  text: A glória do Grande[a][b], e os nomes de vocês serão escritos diante da glória do Grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez repete “a glória do Grande ... diante da glória do Grande”. A repetição foi mantida por parecer deliberada e por intensificar a solenidade da promessa.
    reason: lexical_alternative
  - marker: b
    text: 'Uma tradução anterior dizia: “Sua glória é grande, e os nomes de vocês serão escritos diante da glória do Grande”. Contudo, a construção do ge''ez é mais bem entendida como genitiva: “a glória do Grande”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ስብሐቲሁ
  choice: a glória
  rationale: O substantivo pode indicar glória, louvor ou esplendor. Aqui, a expressão repetida designa a majestade ou presença diante da qual os nomes são escritos; “glória” preserva melhor a imagem apocalíptica.
- source_word: ለዐቢይ
  choice: do Grande
  rationale: A construção etíope funciona como genitivo e apresenta “Grande” como título divino substantivado. “Do Grande” mantém a concisão e a reverência do original.
- source_word: ወእስማቲከሙ
  choice: e os nomes de vocês
  rationale: A forma traz tanto o substantivo quanto o sufixo de segunda pessoa no plural. “De vocês” é claro e amplamente compreensível em português moderno.
- source_word: ይጸሐፍ
  choice: serão escritos
  rationale: O verbo significa “escrever”. O futuro comunica a força promissória do contexto sem acrescentar a ideia mais específica de gravar ou inscrever.
- source_word: በቅድመ
  choice: diante de
  rationale: A preposição denota posição perante alguém ou em sua presença. “Diante de” preserva o tom solene e soa natural em português.
theological_decisions:
- issue: Sentido de ስብሐቲሁ na expressão repetida
  choice: glória
  alternative: louvor; esplendor
  rationale: O ato de os nomes serem escritos diante dessa realidade favorece a ideia de majestade ou presença celestial, sem excluir totalmente as nuances de louvor e esplendor.
- issue: Análise de ስብሐቲሁ ለዐቢይ
  choice: a glória do Grande
  alternative: sua glória é grande
  rationale: 'A construção com pronome antecipatório e ለ־ é genitiva: literalmente, “sua glória, a do Grande”. A leitura predicativa foi registrada como alternativa histórica, mas não é a análise gramatical preferível.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa do plural. Conserva-se a abertura nominal abrupta do texto-fonte, em vez de completar ou harmonizar silenciosamente a frase.
