base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/008.yaml
  text: '(28) The scribes, the Pharisees, and the elders gathered together after hearing all the people grumbling, beating their chests, and saying, “If these greatest signs happened at his death, see how just he was!”


    (29) The elders were afraid and went to Pilate, begging him and saying, (30) “Give us soldiers so that we may guard his grave for three days. Otherwise, his disciples may come and steal him, and the people may think that he rose from the dead and do us wrong.”


    (31) Pilate gave them Petronius the centurion, along with soldiers to guard the tomb. Elders and scribes went with them to the grave. (32) After rolling a great stone to the centurion and the soldiers, everyone who was there placed it at the entrance of the grave. (33) They put seven seals on it, pitched a tent there, and kept watch.'
translation:
  language: pt
  text: '(28) Os escribas, os fariseus e os anciãos reuniram-se depois de ouvirem todo o povo murmurar, bater no peito e dizer: “Se esses sinais tão grandiosos aconteceram na morte dele, vejam como ele era justo!”


    (29) Os anciãos ficaram com medo e foram a Pilatos, suplicando-lhe: (30) “Dê-nos soldados para guardarmos o túmulo dele por três dias, para que os discípulos não venham roubá-lo, o povo pense que ele ressuscitou dentre os mortos e nos faça mal.”


    (31) Pilatos lhes deu o centurião Petrônio, com soldados para guardar o túmulo. Anciãos e escribas foram com eles até o túmulo. (32) Depois de rolarem uma grande pedra até o centurião e os soldados,[a] todos os que estavam ali a colocaram na entrada do túmulo. (33) Puseram nela sete selos, armaram ali uma tenda e ficaram de vigia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação “rolarem uma grande pedra até o centurião e os soldados” é incomum, mas foi preservada conforme a testemunha disponível. O sentido exato deverá ser revisto diretamente no grego.
    reason: Assinala uma construção obscura e evita corrigi-la silenciosamente antes da revisão da língua-fonte.
lexical_decisions:
- source_word: grumbling
  choice: murmurar
  rationale: Mantém a ideia de manifestação coletiva de descontentamento ou lamento, em linguagem bíblica natural e atual.
- source_word: beating their chests
  choice: bater no peito
  rationale: Preserva o gesto corporal de luto, remorso ou aflição sem explicitar uma única interpretação.
- source_word: just
  choice: justo
  rationale: Conserva a amplitude moral e teológica do termo, sem reduzi-lo a 'inocente'.
- source_word: grave / tomb
  choice: túmulo
  rationale: Uniformiza em português a referência ao lugar do sepultamento, evitando alternância estilística sem apoio seguro no texto antigo.
- source_word: centurion
  choice: centurião
  rationale: Emprega o termo histórico corrente e amplamente compreensível.
- source_word: kept watch
  choice: ficaram de vigia
  rationale: Expressão natural em português que comunica vigilância contínua no local.
theological_decisions:
- issue: A avaliação popular de Jesus após os sinais
  choice: “vejam como ele era justo”
  alternative: “vejam como ele era inocente”
  rationale: ‘Justo’ preserva maior amplitude semântica e a tensão teológica do testemunho, ao passo que ‘inocente’ restringiria a declaração ao veredito jurídico.
- issue: A alegação de ressurreição
  choice: “pense que ele ressuscitou dentre os mortos”
  alternative: “acredite que ele foi ressuscitado dentre os mortos”
  rationale: A testemunha inglesa fornecida apresenta forma ativa; a tradução a conserva sem decidir questões de agência divina que dependem da revisão do grego.
- issue: O dano temido pelos líderes
  choice: “nos faça mal”
  alternative: “nos prejudique”
  rationale: Mantém deliberadamente genérica a natureza do dano, como na testemunha disponível, sem especificar violência, punição ou perda política.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A redação é provisória porque o material fornecido declara que a revisão direta do grego do Códice de Akhmim ainda está pendente; por isso, a construção incomum do v. 32 foi mantida e anotada.
