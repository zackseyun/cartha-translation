translation:
  language: pt
  text: (58) Era o último dia dos Pães sem Fermento, e muita gente estava partindo e voltando para casa, pois a festa havia terminado. (59) Nós, porém, os doze discípulos do Senhor, chorávamos e nos entristecíamos; e cada um de nós voltou para casa, entristecido por causa do que havia acontecido. (60) Eu, porém, Simão Pedro, junto com meu irmão André, pegamos nossas redes e fomos para o mar. Conosco estava Levi, filho de Alfeu, a quem o Senhor…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito termina neste ponto, deixando a frase incompleta.
    reason: Esclarecer que as reticências representam uma lacuna material no final do manuscrito, não uma omissão editorial.
lexical_decisions:
- source_word: Unleavened Bread
  choice: Pães sem Fermento
  rationale: Expressa em português corrente o nome da festa judaica, preservando a referência ao pão não fermentado sem recorrer ao termo menos transparente “Ázimos”.
- source_word: houses / home
  choice: casa
  rationale: “Voltar para casa” é a formulação natural em português e mantém o sentido concreto do testemunho consultado.
- source_word: weeping and grieving
  choice: chorávamos e nos entristecíamos
  rationale: 'Mantém os dois aspectos da expressão: o choro manifesto e a dor interior.'
- source_word: sea
  choice: mar
  rationale: Preserva a designação simples do testemunho, sem identificar geograficamente o local além do que o fragmento declara.
- source_word: nets
  choice: redes
  rationale: Equivalente direto e natural no contexto da atividade pesqueira de Pedro e André.
theological_decisions:
- issue: Identidade do grupo como “os doze discípulos do Senhor”
  choice: os doze discípulos do Senhor
  alternative: nós, os Doze do Senhor
  rationale: Conserva a caracterização explícita como discípulos e não transforma “doze” em título técnico além da evidência fornecida.
- issue: Sequência narrativa entre o último dia e o término da festa
  choice: Era o último dia... pois a festa havia terminado
  alternative: Terminada a festa, era o último dia...
  rationale: Mantém a tensão temporal presente no testemunho em vez de tentar harmonizá-la ou explicá-la.
- issue: Oração final incompleta sobre Levi
  choice: a quem o Senhor…
  alternative: omitir a oração interrompida
  rationale: Preserva a interrupção real do manuscrito e evita completar conjecturalmente o que o Senhor teria feito ou dito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação é provisória, pois se baseia no testemunho inglês de domínio público fornecido; a revisão direta do grego do Códice de Akhmim ainda está pendente. A repetição e os contrastes narrativos foram preservados quando relevantes, com leve reordenação sintática para fluência em português.
