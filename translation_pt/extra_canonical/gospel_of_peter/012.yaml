review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido e preserva adequadamente a designação «Dia do Senhor», a referência textual a «os judeus» e a indefinição das práticas funerárias. Contudo, em (54), «Se não conseguirmos entrar» acrescenta e especifica «entrar», enquanto o texto diz apenas «se não formos capazes», sem declarar de quê; essa ambiguidade deve ser mantida.
  naturalness: O português é claro, moderno e de registro narrativo adequado. «Se não formos capazes» é natural no contexto e evita a restrição indevida introduzida pelo rascunho. «Cumprir os deveres que nos cabem» comunica naturalmente o sentido de «perform our duties» sem nomear ritos específicos.
  terminology: «Dia do Senhor», «túmulo», «Maria Madalena» e «os judeus» são escolhas consistentes com o testemunho e com o registro solicitado. «Amigas» é contextualmente plausível para o grupo de mulheres, embora a revisão direta do grego ainda seja necessária.
  issues:
  - severity: medium
    issue: 'Especificação indevida em (54): «Se não conseguirmos entrar».'
    rationale: O testemunho inglês diz somente «And if we aren't able», sem complemento expresso. Acrescentar «entrar» resolve uma elipse que o texto deixa aberta e altera levemente o alcance da fala; pode referir-se, por exemplo, à impossibilidade de remover a pedra ou de realizar o que pretendem.
  - severity: low
    issue: Adição discursiva de «então» antes de «choraremos e lamentaremos» em (54).
    rationale: O original coordena simplesmente a ação futura («and we will weep and mourn»). A retirada de «então» reproduz melhor a coordenação sem sugerir uma sequência temporal adicional.
  revised_text: '(50) Ao amanhecer do Dia do Senhor, Maria Madalena, discípula do Senhor, ainda não tinha feito junto ao túmulo do Senhor o que as mulheres costumam fazer por aqueles que amam e que morreram, pois temia os judeus, que estavam inflamados de ira.


    (51) Então, levando consigo suas amigas, foi ao túmulo onde ele havia sido colocado. (52) Elas temiam que os judeus as vissem e diziam: “Se, no dia em que ele foi crucificado, não pudemos chorar e lamentar, talvez agora possamos fazer isso junto ao túmulo dele. (53) Mas quem removerá para nós a pedra colocada à entrada do túmulo, para que possamos entrar, sentar-nos ao lado dele e cumprir os deveres que nos cabem? (54) A pedra é grande, e tememos que alguém nos veja. Se não formos capazes, ao menos depositemos à entrada o que trazemos em memória dele; choraremos e lamentaremos até voltarmos para casa.”'
  revised_footnotes: []
  revision_rationale: A revisão limita-se a restaurar a ambiguidade sintática de (54), eliminando o complemento não expresso «entrar», e a retirar a inferência temporal adicional de «então». Ajusta-se também «cumprir o que nos cabe» para «cumprir os deveres que nos cabem», que é mais transparente e conserva a generalidade do dever funerário. Não são necessárias notas de rodapé para essas correções.
