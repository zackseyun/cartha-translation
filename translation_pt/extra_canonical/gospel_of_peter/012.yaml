base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/012.yaml
  text: '(50) At dawn on the Lord’s day, Mary Magdalene, a disciple of the Lord, had not done at the Lord’s grave what women customarily do for their loved ones who have died, because she was afraid of the Jews, since they were inflamed with anger.


    (51) Taking her friends with her, she went to the grave where he had been laid. (52) They were afraid that the Jews might see them, and they said, “If we were not able to weep and mourn on the day he was crucified, perhaps even now we might do this at his grave. (53) But who will roll away for us the stone placed at the entrance to the grave, so that we may go in, sit beside him, and perform our duties? (54) For the stone is large, and we are afraid that someone may see us. And if we are not able, let us at least place at the entrance what we are bringing in memory of him, and we will weep and mourn until we return to our house.”'
translation:
  language: pt
  text: '(50) Ao amanhecer do Dia do Senhor, Maria Madalena, discípula do Senhor, ainda não tinha feito junto ao túmulo do Senhor o que as mulheres costumam fazer por aqueles que amam e que morreram, pois temia os judeus, que estavam inflamados de ira.


    (51) Então, levando consigo suas amigas, foi ao túmulo onde ele havia sido colocado. (52) Elas temiam que os judeus as vissem e diziam: “Se no dia em que ele foi crucificado não pudemos chorar e lamentar, talvez agora possamos fazer isso junto ao túmulo dele. (53) Mas quem removerá para nós a pedra colocada à entrada do túmulo, para que possamos entrar, sentar-nos ao lado dele e cumprir o que nos cabe? (54) A pedra é grande, e tememos que alguém nos veja. Se não conseguirmos entrar, ao menos depositemos à entrada o que trazemos em memória dele; então choraremos e lamentaremos até voltarmos para casa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the Lord’s day
  choice: Dia do Senhor
  rationale: Mantém a expressão tradicional e a relação lexical com “Senhor”, sem explicá-la no corpo do texto como “domingo”.
- source_word: grave
  choice: túmulo
  rationale: Termo natural e digno em português, apropriado a uma sepultura fechada por uma grande pedra e na qual se podia entrar.
- source_word: friends
  choice: amigas
  rationale: O contexto e os pronomes subsequentes indicam um grupo feminino que acompanha Maria.
- source_word: perform our duties
  choice: cumprir o que nos cabe
  rationale: Expressa as práticas funerárias esperadas sem especificar ritos que o testemunho não enumera.
- source_word: at the door / entrance
  choice: à entrada
  rationale: Em português atual, descreve com naturalidade a abertura do túmulo sem sugerir necessariamente uma porta de madeira.
theological_decisions:
- issue: Referência coletiva aos judeus
  choice: os judeus
  alternative: as autoridades judaicas
  rationale: Preserva a formulação abrangente e problemática do testemunho disponível, sem restringi-la interpretativamente a um grupo que o texto não identifica.
- issue: Identificação do Dia do Senhor
  choice: Dia do Senhor
  alternative: domingo
  rationale: Conserva a expressão do texto e sua ressonância religiosa, sem resolver na tradução sua designação calendárica.
- issue: Natureza das obrigações funerárias
  choice: cumprir o que nos cabe
  alternative: realizar os ritos fúnebres
  rationale: Evita introduzir uma definição ritual ou confessional mais específica do que a evidência fornecida permite.
translation_notes:
  register: 'Português moderno, amplamente internacional, com legibilidade brasileira e tom narrativo digno. A redação evita arcaísmos e preserva as repetições de “Senhor”, “túmulo”, “chorar” e “lamentar”. Esta versão é necessariamente provisória: foi preparada a partir do testemunho inglês de domínio público e da camada inglesa auditada fornecidos; a revisão direta do grego do Códice de Akhmim ainda está pendente.'
