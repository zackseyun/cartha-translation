review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido e preserva adequadamente a formulação coletiva «os judeus», sem uma restrição interpretativa indevida. Contudo, em (54), «Se não conseguirmos entrar» especifica a incapacidade como impossibilidade de entrar, enquanto o texto-base diz apenas «se não formos capazes», no contexto da remoção da pedra, sem explicitar o complemento. «Então» antes de «choraremos» também acrescenta uma relação temporal que não está expressa.
  naturalness: O português é claro, fluente e de registro narrativo apropriado. «Cumprir o que nos cabe» é natural, embora um tanto idiomático; preserva de modo aceitável a generalidade de «perform our duties».
  terminology: «Dia do Senhor», «Maria Madalena», «Senhor» e «túmulo» são escolhas consistentes e adequadas. «Amigas» corresponde naturalmente a «friends» no grupo feminino indicado pelo contexto.
  issues:
  - severity: medium
    issue: 'Complemento acrescentado em (54): «Se não conseguirmos entrar».'
    rationale: O testemunho diz somente «And if we aren’t able». Embora a remoção da pedra seja o antecedente provável, «entrar» não é o complemento expresso e desloca levemente o foco. «Se não pudermos» preserva a elipse e a ambiguidade do texto.
  - severity: low
    issue: 'Conector acrescentado em (54): «então choraremos».'
    rationale: O futuro coordenado do texto-base não exige uma relação temporal explícita. A remoção de «então» reproduz melhor a coordenação simples.
  revised_text: '(50) Ao amanhecer do Dia do Senhor, Maria Madalena, discípula do Senhor, ainda não tinha feito junto ao túmulo do Senhor o que as mulheres costumam fazer por aqueles que amam e que morreram, pois temia os judeus, que estavam inflamados de ira.


    (51) Levando consigo suas amigas, foi ao túmulo onde ele havia sido colocado. (52) Elas temiam que os judeus as vissem e diziam: “Se no dia em que ele foi crucificado não pudemos chorar e lamentar, talvez agora possamos fazer isso junto ao túmulo dele. (53) Mas quem removerá para nós a pedra colocada à entrada do túmulo, para que possamos entrar, sentar-nos ao lado dele e cumprir o que nos cabe? (54) A pedra é grande, e tememos que alguém nos veja. Se não pudermos, ao menos depositemos à entrada o que trazemos em memória dele; choraremos e lamentaremos até voltarmos para casa.”'
  revised_footnotes: []
