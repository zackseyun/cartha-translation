  yaml_path: translation/extra_canonical/gospel_of_peter/007.yaml
  text: 'Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, “Woe to our sins. The judgment and the end of Jerusalem is near!”


    But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
translation:
  language: pt
  text: 'Então os judeus, os anciãos e os sacerdotes, sabendo quanto mal haviam causado a si mesmos, começaram a lamentar e a dizer: “Ai dos nossos pecados! O julgamento e o fim de Jerusalém estão próximos!”


    Eu, porém, juntamente com meus companheiros, estava aflito e, feridos no íntimo, permanecíamos escondidos, pois éramos procurados por eles como malfeitores e como pessoas que pretendiam incendiar o templo. Além de tudo isso, jejuávamos, permanecíamos sentados, lamentando e chorando noite e dia, até o sábado.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: how much wrong they had done to themselves
  choice: quanto mal haviam causado a si mesmos
  rationale: Mantém a ideia reflexiva do testemunho inglês sem especificar se o dano era moral, judicial ou histórico.
- source_word: Woe to our sins
  choice: Ai dos nossos pecados!
  rationale: Conserva a formulação incomum e possivelmente ambígua do testemunho, em vez de normalizá-la como uma exclamação dirigida aos pecadores.
- source_word: being wounded in mind
  choice: feridos no íntimo
  rationale: Expressa sofrimento interior profundo em português natural, sem reduzir a expressão a mera tristeza.
- source_word: wrongdoers
  choice: malfeitores
  rationale: Termo claro e digno que preserva a acusação genérica de prática criminosa ou má.
- source_word: wanting to burn the temple
  choice: gente que pretendia incendiar o templo
  rationale: Traduz a acusação de intenção sem afirmar que o grupo efetivamente tentou executar o ato.
- source_word: the Sabbath
  choice: o sábado
  rationale: Forma corrente em português para o sábado religioso judaico, compreensível no contexto.
theological_decisions:
- issue: Responsabilidade e dano dos líderes mencionados
  choice: haviam causado a si mesmos
  alternative: haviam cometido
  rationale: A reflexividade presente no testemunho foi preservada; não se acrescentou uma identificação explícita da culpa nem de sua consequência.
- issue: Natureza do julgamento e do fim de Jerusalém
  choice: O julgamento e o fim de Jerusalém estão próximos
  alternative: A condenação e a destruição de Jerusalém estão próximas
  rationale: Mantém a amplitude de “judgment” e “end”, evitando interpretar o fim necessariamente como destruição física ou o julgamento exclusivamente como condenação.
- issue: Identidade narrativa do “eu”
  choice: Eu, porém, e os meus companheiros
  alternative: Pedro e seus companheiros
  rationale: Preserva a voz em primeira pessoa do texto e não identifica explicitamente o narrador além do que o trecho declara.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com boa legibilidade brasileira. O texto é necessariamente provisório, pois foi elaborado a partir do testemunho inglês público fornecido e aguarda revisão direta do grego do Códice de Akhmim. Foram omitidos os números dos versículos, em conformidade com a camada inglesa da POB.
