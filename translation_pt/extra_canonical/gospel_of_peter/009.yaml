review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o testemunho inglês fornecido e preserva elementos narrativos relevantes: a multidão, a vigília em duplas, a voz no céu, os dois homens luminosos e a posterior designação como jovens. “Dia do Senhor” mantém adequadamente a expressão sem impor a identificação com domingo. Em v. 37, porém, “se afastou parcialmente” é menos explícito do que o movimento para o lado indicado por “moved partly aside”.'
  naturalness: O português é claro, moderno e de leitura natural. “Região ao redor” é mais idiomático e abrangente do que “campos ao redor” para “surrounding countryside”, sem restringir indevidamente o referente a áreas agrícolas.
  terminology: “Sábado”, “Dia do Senhor”, “túmulo”, “voz forte”, “dois homens” e “os dois jovens” são escolhas adequadas. A alternância entre “homens” e “jovens” deve ser preservada, pois reproduz a descrição narrativa sem identificá-los como anjos.
  issues:
  - severity: low
    issue: “campos ao redor” restringe “surrounding countryside”.
    rationale: O inglês inclui a zona rural/região circundante em sentido amplo, não apenas campos. “Região ao redor” conserva melhor essa amplitude.
  - severity: low
    issue: “se afastou parcialmente” não explicita o deslocamento lateral da pedra.
    rationale: A formulação do testemunho (“moved partly aside”) indica que a pedra se moveu para o lado, e apenas em parte. “Deslocou-se parcialmente para o lado” preserva ambos os aspectos.
