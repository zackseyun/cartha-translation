base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/009.yaml
  text: (34) When the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went to see the grave that had been sealed. (35) But during the night, before the Lord’s Day dawned, while the soldiers kept watch two by two as guards, there was a great voice in heaven. (36) They saw the heavens open, and two men descended from there, shining with great radiance, and approached the tomb. (37) The stone that had been placed at the entrance rolled away by itself and moved partly aside. The tomb was opened, and both young men went in.
translation:
  language: pt
  text: (34) Ao amanhecer do sábado, uma multidão de Jerusalém e da região ao redor foi ver o túmulo que havia sido selado. (35) Durante a noite, porém, antes de raiar o Dia do Senhor, enquanto os soldados montavam guarda de dois em dois, ouviu-se uma voz forte no céu. (36) Eles viram os céus se abrirem, e de lá desceram dois homens, resplandecentes de intenso brilho, que se aproximaram do túmulo. (37) A pedra que havia sido colocada à entrada rolou sozinha e se deslocou parcialmente para o lado. O túmulo se abriu, e os dois jovens entraram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sabbath
  choice: sábado
  rationale: Mantém a designação temporal tradicional e natural em português.
- source_word: Lord's day
  choice: Dia do Senhor
  rationale: Preserva a expressão antiga e sua possível significação cristã sem a reduzir explicitamente a “domingo”.
- source_word: grave / tomb
  choice: túmulo
  rationale: Usa um termo uniforme, claro e digno para o lugar de sepultamento.
- source_word: great voice
  choice: voz forte
  rationale: Expressa magnitude ou potência de modo natural, sem acrescentar uma identificação sobrenatural não declarada.
- source_word: much radiance
  choice: intenso brilho
  rationale: Conserva a imagem luminosa em linguagem corrente e evita especificar a fonte do resplendor.
- source_word: made way in part
  choice: se afastou parcialmente
  rationale: Retém o detalhe incomum de que a pedra abriu passagem apenas em parte.
- source_word: young men
  choice: jovens
  rationale: Preserva a mudança descritiva de “dois homens” para “os dois jovens”, sem identificá-los expressamente como anjos.
theological_decisions:
- issue: Identidade dos dois homens
  choice: “dois homens” e depois “os dois jovens”
  alternative: “dois anjos”
  rationale: O texto fornecido não os chama de anjos; a tradução mantém sua descrição e a tensão narrativa.
- issue: Sentido de “Dia do Senhor”
  choice: manter “Dia do Senhor”
  alternative: traduzir como “domingo”
  rationale: A expressão pode funcionar como designação cristã do primeiro dia da semana, mas a forma literal preserva sua tonalidade teológica e histórica.
- issue: Origem da voz
  choice: “no céu”
  alternative: “vinda do céu”
  rationale: O testemunho diz que a voz estava ou ocorreu no céu; não se explicita que ela se dirigiu à terra.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom narrativo digno. Trata-se de uma versão provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do grego do Códice de Akhmim ainda está pendente.
