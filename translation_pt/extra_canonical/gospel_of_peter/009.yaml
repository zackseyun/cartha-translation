revisions:
- from: (34) Ao amanhecer do sábado, uma multidão de Jerusalém e dos campos ao redor foi ver o túmulo que havia sido selado. (35) Durante a noite, porém, antes de raiar o Dia do Senhor, enquanto os soldados montavam guarda de dois em dois, ouviu-se uma voz forte no céu. (36) Eles viram os céus se abrirem, e de lá desceram dois homens, resplandecentes de intenso brilho, que se aproximaram do túmulo. (37) A pedra que havia sido colocada à entrada rolou sozinha e se afastou parcialmente. O túmulo se abriu, e os dois jovens entraram.
  to: (34) Ao amanhecer do sábado, uma multidão de Jerusalém e da região ao redor foi ver o túmulo que havia sido selado. (35) Durante a noite, porém, antes de raiar o Dia do Senhor, enquanto os soldados montavam guarda de dois em dois, ouviu-se uma voz forte no céu. (36) Eles viram os céus se abrirem, e de lá desceram dois homens, resplandecentes de intenso brilho, que se aproximaram do túmulo. (37) A pedra que havia sido colocada à entrada rolou sozinha e se deslocou parcialmente para o lado. O túmulo se abriu, e os dois jovens entraram.
  rationale: 'Foram feitas apenas duas correções de precisão semântica: a referência geográfica foi ampliada de “campos” para “região”, e o movimento da pedra passou a indicar explicitamente seu deslocamento parcial para o lado. Não há necessidade de nota, pois as escolhas permanecem transparentes no texto.'
