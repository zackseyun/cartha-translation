review_pass:
  verdict: revise
  source_fidelity: A versão acompanha a sequência narrativa e os elementos principais do testemunho. Contudo, «voltou a brilhar» introduz a ideia de que o sol havia deixado de brilhar, enquanto o texto diz apenas que ele brilhou. «Um grande temor se apoderou de todos» acrescenta explicitamente «de todos», ausente do texto. A redação revista conserva a construção impessoal para o surgimento do temor e não acrescenta esse referente. O versículo 23 mantém a ambiguidade pronominal do testemunho disponível, com nota explicativa.
  naturalness: O português é claro e de registro adequadamente solene. «Colocaram-no sobre a terra», «a terra inteira foi abalada» e «houve grande temor» são formulações naturais e mais próximas da construção do texto. «Verificou-se que era a hora nona» preserva a impessoalidade de «it was found».
  terminology: «Senhor», «hora nona», «linho», «túmulo» e «Jardim de José» são escolhas adequadas. «Judeus» reproduz a designação do testemunho sem expandi-la interpretativamente. A nota sobre os pronomes é necessária, pois a cadeia pronominal da base inglesa — e a referência pretendida na oração final — não deve ser resolvida silenciosamente nesta etapa provisória.
  issues:
  - severity: medium
    issue: Acréscimo em «o sol voltou a brilhar»
    rationale: «Voltou» pressupõe uma interrupção anterior do brilho solar que não é afirmada pelo testemunho apresentado; deve-se traduzir apenas que o sol brilhou.
  - severity: medium
    issue: Acréscimo de referente coletivo em «um grande temor se apoderou de todos»
    rationale: O texto diz que surgiu/grande temor houve, sem explicitar «todos» como objeto ou grupo atingido. A tradução deve manter essa concisão.
  - severity: low
    issue: «A terra inteira tremeu» suaviza a forma passiva do testemunho
    rationale: A formulação é possível em português, mas «foi abalada» representa mais diretamente «was shaken» e mantém o foco no acontecimento sofrido pela terra.
  revised_text: '(21) Então tiraram os pregos das mãos do Senhor e colocaram-no sobre a terra. A terra inteira foi abalada, e houve grande temor.


    (22) Então o sol brilhou, e verificou-se que era a hora nona. (23) Os judeus se alegraram e entregaram a José o corpo dele para que o sepultasse, pois ele tinha visto todas as boas coisas que ele havia feito.[a] (24) José tomou o Senhor, lavou-o, envolveu-o em linho e o levou para o seu próprio túmulo, conhecido como “Jardim de José”.'
  revised_footnotes:
  - marker: a
    text: 'A sequência de pronomes no testemunho disponível é ambígua: pela gramática, não fica totalmente claro a quem se referem «ele» e «ele havia feito».'
    reason: Preserva e torna visível a ambiguidade do testemunho-base, sem fixar silenciosamente os referentes.
  revision_rationale: Foram eliminados dois acréscimos interpretativos («voltou» e «de todos») e ajustada a descrição do abalo para maior proximidade ao testemunho. Conservam-se a ambiguidade pronominal de 23, a terminologia narrativa e o tom solene, sem introduzir uma identificação doutrinária ou interpretativa dos referentes.
