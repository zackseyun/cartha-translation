base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/006.yaml
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear came.


    (22) Then the sun shone, and it was found to be the ninth hour. (23) The Jews rejoiced and gave Joseph his body to bury, since he had seen all the good he had done. (24) After taking the Lord, Joseph washed him, wrapped him in linen, and brought him into his own tomb, which was known as “Joseph’s Garden.”'
translation:
  language: pt
  text: '(21) Então tiraram os pregos das mãos do Senhor e o puseram no chão. A terra inteira tremeu, e um grande temor se apoderou de todos.


    (22) Então o sol voltou a brilhar, e constatou-se que era a hora nona. (23) Os judeus se alegraram e entregaram a José o corpo dele para que o sepultasse, pois ele tinha visto todo o bem que ele havia feito.[a] (24) José tomou o Senhor, lavou-o, envolveu-o em linho e o levou para o seu próprio túmulo, conhecido como “Jardim de José”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A sequência de pronomes no testemunho disponível é ambígua: não fica totalmente claro, pela gramática, a quem se referem “ele” e “ele havia feito”.'
    reason: Preservar e tornar visível a ambiguidade do testemunho-base, em vez de fixar silenciosamente os referentes.
lexical_decisions:
- source_word: placed him on the earth
  choice: o puseram no chão
  rationale: Distingue o lugar onde o corpo foi posto da expressão seguinte, “a terra inteira”, e soa natural em português.
- source_word: the whole earth
  choice: a terra inteira
  rationale: Preserva a possível amplitude do testemunho inglês, que pode indicar tanto a terra como mundo quanto toda a região, sem restringi-la silenciosamente.
- source_word: great fear came
  choice: um grande temor se apoderou de todos
  rationale: Expressa em português corrente o surgimento coletivo de intenso temor; “temor” mantém o registro solene.
- source_word: the ninth hour
  choice: a hora nona
  rationale: Conserva o modo antigo de contar as horas, relevante ao contexto narrativo, sem convertê-lo interpretativamente para um horário moderno.
- source_word: linen
  choice: linho
  rationale: Mantém o material indicado pelo testemunho, sem acrescentar que se tratava de faixas ou de um sudário.
- source_word: Joseph's Garden
  choice: Jardim de José
  rationale: Traduz literalmente a denominação do local e conserva seu caráter de nome conhecido.
theological_decisions:
- issue: Referentes dos pronomes no versículo 23
  choice: “o corpo dele... ele tinha visto... ele havia feito”, com nota de ambiguidade
  alternative: Identificar explicitamente cada pronome como referente a Jesus ou a José
  rationale: O testemunho inglês fornecido apresenta uma sequência pronominal ambígua. A tradução não atribui de modo definitivo a José ou ao Senhor as ações de ver e fazer o bem.
- issue: Extensão do abalo da terra
  choice: “A terra inteira tremeu”
  alternative: “Toda a região tremeu” ou “o mundo inteiro tremeu”
  rationale: A formulação escolhida conserva a tensão semântica de “whole earth” sem limitar o fenômeno a uma região nem afirmar de modo inequívoco alcance mundial.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. “Hora nona” e “temor” preservam o tom antigo sem tornar a sintaxe arcaica. Esta versão é necessariamente provisória, pois foi elaborada a partir do testemunho inglês de domínio público e ainda requer revisão direta do grego do Códice de Akhmim.
