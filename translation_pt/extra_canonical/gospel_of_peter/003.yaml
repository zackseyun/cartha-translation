  yaml_path: translation/extra_canonical/gospel_of_peter/003.yaml
  text: 'And he handed him over to the people before the first day of their festival of the Unleavened Bread. (6) And those having taken the Lord were running, pushing him, and saying, “Let’s drag the Son of God, having authority over him!”


    (7) And they were clothing him with purple, and sat him on the seat of judgment, saying, “Judge justly, king of Israel!” (8) And one of them brought a thorn crown and placed it on the Lord’s head.


    (9) And other bystanders were spitting in his face, and others slapped his cheeks. Others were piercing him with a reed, and some were scourging him, saying, “With this honor, let’s honor the Son of God!”'
translation:
  language: pt
  text: 'E ele o entregou ao povo antes do primeiro dia da festa deles dos Pães sem Fermento. (6) Então, os que haviam agarrado o Senhor saíram correndo, empurrando-o e dizendo: “Arrastemos o Filho de Deus, pois temos autoridade sobre ele!”


    (7) Vestiram-no de púrpura e o fizeram sentar-se no tribunal, dizendo: “Julga com justiça, rei de Israel!” (8) Um deles trouxe uma coroa de espinhos e a colocou na cabeça do Senhor.


    (9) Alguns dos que estavam por perto cuspiam no rosto dele, e outros lhe davam bofetadas. Outros o espetavam com uma vara, e alguns o açoitavam, dizendo: “Honremos o Filho de Deus com esta honra!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Unleavened Bread
  choice: Pães sem Fermento
  rationale: Expressão clara e corrente para o nome da festa, preservando a referência judaica e o plural do testemunho fornecido.
- source_word: were running, pushing him
  choice: saíram correndo, empurrando-o
  rationale: Reproduz a ação impetuosa e simultânea em português natural, sem suavizar a violência da cena.
- source_word: purple
  choice: púrpura
  rationale: Mantém a referência à cor ou veste régia sem acrescentar no texto um substantivo que o testemunho não explicita.
- source_word: seat of judgment
  choice: tribunal
  rationale: Termo moderno e inteligível que comunica o lugar de julgamento e funciona com o escárnio da ordem para julgar.
- source_word: piercing him with a reed
  choice: o espetavam com uma vara
  rationale: Preserva o sentido de ferir com um objeto delgado; “vara” é mais natural que “cana” neste contexto, embora a identificação exata dependa da revisão grega.
- source_word: scourging
  choice: açoitavam
  rationale: Verbo corrente e digno que conserva a violência específica da flagelação.
theological_decisions:
- issue: Quem possui autoridade na frase “having authority over him”
  choice: “pois temos autoridade sobre ele”
  alternative: “já que temos poder sobre ele” ou ligar a expressão ao Filho de Deus
  rationale: O testemunho inglês permite tensão sintática. A formulação escolhida a atribui naturalmente aos agressores, mas não amplia a alegação nem a transforma em afirmação doutrinária do narrador.
- issue: Ironia nos títulos “Filho de Deus” e “rei de Israel”
  choice: Preservar os títulos literalmente dentro das falas de escárnio
  alternative: Explicitar que falavam de modo sarcástico
  rationale: O contexto já comunica a ironia; explicá-la resolveria desnecessariamente a tensão narrativa.
- issue: Ordem “Judge justly” dirigida a Jesus
  choice: “Julga com justiça”
  alternative: “Faze um julgamento justo”
  rationale: Mantém o imperativo direto e o contraste irônico com a violência sofrida, sem introduzir interpretação adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os números dos versículos do testemunho foram preservados. Esta redação é necessariamente provisória, pois foi preparada a partir do testemunho inglês público fornecido; a revisão direta do grego do Códice de Akhmim ainda está pendente. Por isso, não foram criadas notas textuais que aparentassem certeza sobre formas gregas ainda não verificadas.
