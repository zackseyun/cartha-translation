    (19) And the Lord cried out, saying, "My Power, the Power, you''ve left me!" And when he said this, it was taken up. (20) And that very hour, the veil of the temple in Jerusalem was torn in two.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/005.yaml
  text: '(15) It was midday, and darkness covered all Judea. They were troubled and distressed that the sun might set while he was still alive. It is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” They mixed it and gave it to him to drink. (17) They fulfilled all things and piled up sins upon their own heads. (18) Many people went around with lanterns, thinking it was night, and some fell down.


    (19) The Lord cried out, saying, “My Power, the Power, you have left me!” When he said this, it was taken up. (20) At that very hour, the veil of the temple in Jerusalem was torn in two.'
translation:
  language: pt
  text: '(15) Era meio-dia, e a escuridão dominava toda a Judeia. Eles estavam perturbados e angustiados, temendo que o sol se pusesse enquanto ele ainda estava vivo. Pois está escrito para eles: “O sol não deve se pôr sobre alguém que foi morto.” (16) Um deles disse: “Deem-lhe fel com vinho azedo para beber.” Depois de misturá-los, deram-lhe de beber. (17) Assim, cumpriram todas as coisas e acumularam pecados sobre a própria cabeça. (18) Muitos andavam de um lado para outro com lamparinas, pensando que era noite, e alguns caíam.


    (19) Então o Senhor gritou: “Meu Poder, ó Poder, tu me abandonaste!” E, quando disse isso, foi elevado.[a] (20) Naquela mesma hora, o véu do templo de Jerusalém se rasgou em dois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto não identifica claramente o que “foi elevado”; a expressão também pode ser entendida como “foi tomado para o alto”.
    reason: Assinalar uma ambiguidade sintática e teológica importante sem resolvê-la no corpo do texto.
lexical_decisions:
- source_word: darkness held fast
  choice: a escuridão dominava
  rationale: Reproduz a força da imagem de uma escuridão que se apodera de toda a região, sem soar artificial em português.
- source_word: bile with sour wine
  choice: fel com vinho azedo
  rationale: Mantém os dois elementos distintos do testemunho fornecido e usa vocabulário bíblico compreensível.
- source_word: My Power, the Power
  choice: Meu Poder, ó Poder
  rationale: Preserva a formulação incomum e a repetição do testemunho, entendendo a segunda ocorrência como invocação sem normalizá-la segundo os evangelhos canônicos.
- source_word: veil
  choice: véu
  rationale: É a designação tradicional e clara da cortina do templo nesse contexto.
- source_word: it was taken up
  choice: foi elevado
  rationale: Mantém o sujeito não expresso e evita decidir se a referência é ao Senhor, ao poder, à voz ou a outra realidade.
theological_decisions:
- issue: Sujeito de “foi elevado” em 19
  choice: 'Manter o sujeito indeterminado: “foi elevado”'
  alternative: “Ele foi elevado”, “seu poder foi elevado” ou “seu espírito foi recebido”
  rationale: O testemunho fornecido apresenta ambiguidade real; explicitar o referente importaria uma interpretação teológica não exigida pelo texto.
- issue: Relação da fala de 19 com os evangelhos canônicos
  choice: Traduzir literalmente a formulação própria deste escrito
  alternative: Harmonizar como “Deus meu, Deus meu, por que me abandonaste?”
  rationale: A leitura “Meu Poder, ó Poder” é distintiva do testemunho e não deve ser substituída por uma forma canônica mais conhecida.
- issue: “Cumpriram todas as coisas” em 17
  choice: Preservar a expressão ampla
  alternative: Explicitar “cumpriram todas as profecias” ou “completaram tudo o que pretendiam”
  rationale: O objeto ou âmbito do cumprimento não está especificado no testemunho, e a tradução não deve resolver essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Tradução provisória baseada no testemunho inglês público fornecido, pois a revisão direta do grego ainda está pendente. A sintaxe foi naturalizada com cautela, preservando repetições, formulações incomuns e ambiguidades relevantes.
