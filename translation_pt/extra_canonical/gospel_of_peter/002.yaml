base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/002.yaml
  text: '(3) Joseph was standing there, a friend of Pilate and of the Lord. When he saw that they were about to crucify him, he went to Pilate and asked for the Lord’s body for burial. (4) Pilate sent word to Herod and asked him for the body.


    (5) Herod said, “Brother Pilate, even if no one had asked for him, we would have buried him, since the Sabbath is also beginning. For it is written in the Law, ‘The sun must not set on one who has been killed.’”'
translation:
  language: pt
  text: '(3) José estava ali, amigo de Pilatos e do Senhor. Ao ver que estavam prestes a crucificá-lo, foi a Pilatos e pediu o corpo do Senhor para sepultá-lo. (4) Pilatos mandou uma mensagem a Herodes e lhe pediu o corpo.


    (5) Herodes disse: “Irmão Pilatos, mesmo que ninguém o tivesse pedido, nós o teríamos sepultado, pois o sábado também está começando. Porque está escrito na Lei: ‘O sol não deve se pôr sobre aquele que foi morto.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alusão a Deuteronômio 21:22–23, que determina que o corpo de um executado não permaneça durante a noite, mas seja sepultado no mesmo dia.
    reason: Identifica a passagem legal evocada sem substituir a formulação própria da citação no texto.
lexical_decisions:
- source_word: friend of Pilate and the Lord
  choice: amigo de Pilatos e do Senhor
  rationale: Mantém a coordenação e a possível tensão da testemunha fornecida, sem explicar nem reformular a relação de José com Pilatos e com o Senhor.
- source_word: asked for the body ... for burial
  choice: pediu o corpo do Senhor para sepultá-lo
  rationale: Expressa com naturalidade a finalidade do pedido e conserva a referência explícita ao corpo do Senhor.
- source_word: Brother Pilate
  choice: Irmão Pilatos
  rationale: Preserva a forma direta de tratamento da testemunha, sem convertê-la em título político ou em parentesco explicitado.
- source_word: Sabbath is beginning
  choice: o sábado também está começando
  rationale: Conserva o aspecto incoativo e o advérbio inclusivo “também”, em vez de harmonizar a frase com outra narrativa.
- source_word: one who’s been killed
  choice: aquele que foi morto
  rationale: Mantém a formulação passiva e genérica da citação apresentada, sem substituí-la silenciosamente pelo texto de uma versão canônica específica.
theological_decisions:
- issue: Relação entre José, Pilatos e o Senhor
  choice: “amigo de Pilatos e do Senhor”
  alternative: “amigo de Pilatos, que também seguia o Senhor”
  rationale: A alternativa resolveria interpretativamente a coordenação. A redação escolhida preserva o sentido direto e sua possível ambiguidade.
- issue: Motivo legal para o sepultamento
  choice: Manter separadas a chegada do sábado e a citação da Lei
  alternative: Fundir ambos numa explicação harmonizada sobre impureza ou observância sabática
  rationale: A testemunha apresenta os dois elementos em sequência, sem desenvolver sua relação jurídica ou teológica.
- issue: Formulação da citação legal
  choice: “O sol não deve se pôr sobre aquele que foi morto”
  alternative: Adotar literalmente uma tradução corrente de Deuteronômio 21:23
  rationale: A escolha traduz a forma citada nesta obra e evita impor-lhe a redação de outra tradição textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A redação evita arcaísmos desnecessários e preserva repetições significativas como “o corpo”. Este rascunho é necessariamente provisório, pois foi elaborado a partir da testemunha inglesa de domínio público fornecida; a revisão direta do grego do Códice de Akhmim ainda está pendente.
