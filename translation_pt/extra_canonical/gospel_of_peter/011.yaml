base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/011.yaml
  text: '(43) Then those men decided together to go and report these things to Pilate. (44) While they were still considering this, the heavens were again seen opening, and a certain man descended and entered the tomb. (45) When those with the centurion saw these things, they left the tomb they had been guarding and hurried by night to Pilate. They described everything they had seen, greatly distressed and saying, “Truly he was the Son of God!”


    (46) Pilate replied, “I am innocent of the blood of the Son of God, and this is clear to us.”


    (47) Then all who had come begged him and urged him to command the centurion and the soldiers to say nothing about what they had seen. (48) “It is better for us,” they said, “to be guilty of a great sin before God than to fall into the hands of the Jewish people and be stoned.” (49) So Pilate commanded the centurion and the soldiers to say nothing.'
translation:
  language: pt
  text: '(43) Então aqueles homens decidiram juntos ir relatar essas coisas a Pilatos. (44) Enquanto ainda refletiam sobre isso, viram novamente os céus se abrirem, e certo homem desceu e entrou no túmulo. (45) Ao verem essas coisas, os que estavam com o centurião deixaram o túmulo que vigiavam e foram depressa, durante a noite, até Pilatos. Relataram tudo o que tinham visto, muito angustiados, e disseram: “Verdadeiramente ele era o Filho de Deus!”


    (46) Pilatos respondeu: “Sou inocente do sangue do Filho de Deus, e isso está claro para nós.”


    (47) Então todos os que tinham ido até lá suplicaram a Pilatos e insistiram que ele ordenasse ao centurião e aos soldados que não dissessem nada sobre o que tinham visto. (48) “É melhor para nós”, disseram eles, “ser culpados de um grande pecado diante de Deus do que cair nas mãos do povo judeu e ser apedrejados.” (49) Assim, Pilatos ordenou ao centurião e aos soldados que não dissessem nada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: report
  choice: relatar
  rationale: Mantém o sentido de apresentar formalmente os acontecimentos a Pilatos e soa natural em português atual.
- source_word: grave / tomb
  choice: túmulo
  rationale: É a designação corrente e digna para o local do sepultamento; preserva a continuidade entre os versículos 44 e 45.
- source_word: a certain man
  choice: certo homem
  rationale: Conserva a indefinição da testemunha sem identificar ou interpretar a figura.
- source_word: clean of the blood
  choice: inocente do sangue
  rationale: Reproduz a expressão jurídica e moral tradicional sem reduzir seu sentido a mera limpeza ritual.
- source_word: the Jewish people
  choice: o povo judeu
  rationale: Reflete o referente coletivo do testemunho fornecido sem ampliar a acusação nem substituir o grupo por autoridades específicas.
theological_decisions:
- issue: Confissão dos guardas sobre Jesus
  choice: “Verdadeiramente ele era o Filho de Deus!”
  alternative: “Verdadeiramente ele é o Filho de Deus!”
  rationale: O testemunho inglês fornecido usa o passado “was”; a tradução o preserva, sem harmonizar a frase com relatos canônicos ou impor uma leitura cristológica adicional.
- issue: Declaração de inocência de Pilatos
  choice: “Sou inocente do sangue do Filho de Deus”
  alternative: “Estou limpo do sangue do Filho de Deus”
  rationale: “Inocente do sangue” comunica em português a alegação de ausência de culpa pela morte, mantendo o peso teológico e jurídico da formulação.
- issue: Identidade do homem que desce do céu
  choice: “certo homem”
  alternative: “um homem” ou uma identificação angelológica
  rationale: Preserva deliberadamente a falta de identificação presente no testemunho, sem concluir que seja anjo, Cristo ou outra figura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantiveram-se a numeração e os parágrafos. Como a revisão direta do grego do Códice de Akhmim ainda está pendente, esta versão é provisória e se baseia no testemunho inglês público fornecido; por isso, ambiguidades não resolvidas foram preservadas e não foram acrescentadas notas textuais conjecturais.
