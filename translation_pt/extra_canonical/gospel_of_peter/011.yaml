review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o testemunho inglês fornecido e preserva os elementos narrativos e as indefinições relevantes: o «certo homem» não é identificado, a confissão permanece no passado, e a fala sobre «o povo judeu» não é ampliada. Como não foi fornecido texto grego para cotejo direto, esta avaliação do original permanece necessariamente provisória e dependente da ponte inglesa.'
  naturalness: O português é claro, moderno e de registro adequado. A única melhoria necessária é evitar «tinham ido até lá» em v. 47, pois introduz um destino que o texto-base não especifica; «tinham vindo» é mais fiel e igualmente natural.
  terminology: «Pilatos», «centurião», «túmulo», «Filho de Deus», «inocente do sangue» e «povo judeu» são escolhas consistentes, compreensíveis e apropriadas ao registro. «Certo homem» preserva corretamente a indeterminação.
  issues:
  - severity: low
    issue: 'v. 47: «todos os que tinham ido até lá»'
    rationale: A expressão acrescenta a noção espacial «até lá», ausente do testemunho («all who had come»). «Todos os que tinham vindo» mantém o referente e a ambiguidade de destino do texto.
  revised_text: '(43) Então aqueles homens decidiram juntos ir relatar essas coisas a Pilatos. (44) Enquanto ainda refletiam sobre isso, viram novamente os céus se abrirem, e certo homem desceu e entrou no túmulo. (45) Ao verem essas coisas, os que estavam com o centurião deixaram o túmulo que vigiavam e foram depressa, durante a noite, até Pilatos. Relataram tudo o que tinham visto, muito angustiados, e disseram: “Verdadeiramente ele era o Filho de Deus!”


    (46) Pilatos respondeu: “Sou inocente do sangue do Filho de Deus, e isso está claro para nós.”


    (47) Então todos os que tinham vindo suplicaram a Pilatos e insistiram que ele ordenasse ao centurião e aos soldados que não dissessem nada sobre o que tinham visto. (48) “É melhor para nós”, disseram eles, “ser culpados de um grande pecado diante de Deus do que cair nas mãos do povo judeu e ser apedrejados.” (49) Assim, Pilatos ordenou ao centurião e aos soldados que não dissessem nada.'
  revised_footnotes: []
