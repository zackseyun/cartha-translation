review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha com precisão o testemunho inglês fornecido e conserva as indefinições relevantes: «certo homem», a confissão no passado e «o povo judeu». A revisão direta do grego do Códice de Akhmim continua pendente, de modo que esta avaliação é necessariamente provisória quanto a pormenores do texto-fonte antigo.'
  naturalness: O português é moderno, claro e de registro apropriado. A construção «todos os que tinham ido até lá» em (47), porém, introduz um destino («até lá») que o texto de referência não especifica e soa menos direta que a formulação correspondente.
  terminology: «Pilatos», «centurião», «túmulo», «Filho de Deus», «inocente do sangue» e «apedrejados» são escolhas naturais e semanticamente adequadas. «Povo judeu» reproduz o referente coletivo do testemunho sem o expandir interpretativamente.
  issues:
  - severity: low
    issue: (47) «todos os que tinham ido até lá»
    rationale: O inglês diz «all who had come», sem especificar «até lá». «Todos os que tinham vindo» preserva a elipse e evita acrescentar uma indicação de lugar.
  revised_text: '(43) Então aqueles homens decidiram juntos ir relatar essas coisas a Pilatos. (44) Enquanto ainda refletiam sobre isso, viram novamente os céus se abrirem, e certo homem desceu e entrou no túmulo. (45) Ao verem essas coisas, os que estavam com o centurião deixaram o túmulo que vigiavam e foram depressa, durante a noite, até Pilatos. Relataram tudo o que tinham visto, muito angustiados, e disseram: “Verdadeiramente ele era o Filho de Deus!”


    (46) Pilatos respondeu: “Sou inocente do sangue do Filho de Deus, e isso está claro para nós.”


    (47) Então todos os que tinham vindo suplicaram a Pilatos e insistiram que ele ordenasse ao centurião e aos soldados que não dissessem nada sobre o que tinham visto. (48) “É melhor para nós”, disseram eles, “ser culpados de um grande pecado diante de Deus do que cair nas mãos do povo judeu e ser apedrejados.” (49) Assim, Pilatos ordenou ao centurião e aos soldados que não dissessem nada.'
