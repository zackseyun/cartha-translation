revisions:
- from: '(38) Quando os soldados viram isso, acordaram o centurião e os anciãos, pois eles também estavam ali, mantendo guarda. (39) Enquanto lhes contavam o que tinham visto, tornaram a ver três homens saindo do túmulo: dois amparavam o terceiro, e uma cruz os seguia. (40) A cabeça dos dois chegava até o céu, mas a daquele que eles conduziam ultrapassava os céus.


