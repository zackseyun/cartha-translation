base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/010.yaml
  text: '(38) When the soldiers saw this, they woke the centurion and the elders, because they too were there keeping watch. (39) While the soldiers were explaining to them what they had seen, they again saw three men coming out of the tomb. Two of them were supporting the third, and a cross was following them. (40) The heads of the two reached as high as heaven, but the head of the one they were leading reached beyond the heavens.


    (41) They heard a voice from the heavens saying, “Have you proclaimed to those who sleep?”


    (42) A reply was heard from the cross: “Yes!”'
translation:
  language: pt
  text: '(38) Quando os soldados viram isso, acordaram o centurião e os anciãos, pois também eles estavam ali de guarda. (39) Enquanto os soldados lhes contavam o que tinham visto, tornaram a ver três homens saindo do túmulo: dois conduziam o terceiro, e uma cruz os seguia. (40) As cabeças dos dois chegavam até o céu, mas a daquele que eles conduziam ultrapassava os céus.


    (41) Ouviram uma voz dos céus, que dizia: “Você proclamou aos que dormem?”


    (42) E da cruz ouviu-se a resposta: “Sim!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: keeping guard
  choice: mantendo guarda
  rationale: Expressão clara e corrente que conserva a ideia de vigilância contínua.
- source_word: supporting
  choice: amparavam
  rationale: Mantém a imagem de duas figuras sustentando ou auxiliando a terceira, sem especificar indevidamente a forma do apoio.
- source_word: those who sleep
  choice: os que dormem
  rationale: Preserva a metáfora do texto e sua possível referência aos mortos, sem interpretá-la explicitamente.
- source_word: proclaimed
  choice: proclamou
  rationale: Conserva o sentido amplo de anunciar ou proclamar, evitando acrescentar um objeto que o testemunho fornecido não explicita.
- source_word: heaven / the heavens
  choice: o céu / os céus
  rationale: Preserva a distinção formal presente no testemunho inglês entre singular e plural.
theological_decisions:
- issue: Identidade daquele que é conduzido e fala com os que dormem
  choice: Não explicitar a identidade no corpo do texto
  alternative: Identificá-lo diretamente como Jesus ou Cristo
  rationale: O trecho usa descrições pronominais; explicitar uma identidade resolveria algo deixado implícito nesta unidade.
- issue: Sentido de “os que dormem”
  choice: Manter a metáfora literalmente
  alternative: Traduzir como “os mortos”
  rationale: A formulação pode aludir aos mortos, mas a imagem do sono é teologicamente significativa e deve ser preservada.
- issue: Origem da resposta final
  choice: “da cruz ouviu-se a resposta”
  alternative: “a cruz respondeu”
  rationale: A construção conserva a formulação do testemunho, segundo a qual uma resposta é ouvida a partir da cruz, sem impor uma explicação sobre como ela fala.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Rascunho provisório baseado no testemunho inglês de domínio público fornecido; a revisão direta do grego do Códice de Akhmim ainda está pendente.
