source:
  text: '(38) Then those soldiers seeing it woke up the centurion and the elders, because they were there too, keeping guard. (39) And while they were explaining to them what they saw, again they saw three men coming out of the tomb, with the two supporting the one, and a cross following them. (40) And the heads of the two reached as far as heaven, but that of the one being led by them reached beyond the heavens.


    (41) And they heard a voice from the heavens, saying, "Have you proclaimed to those who sleep?"


    (42) And a response was heard from the cross: "Yes!"'
