base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/013.yaml
  text: '(55) They went and found that the tomb had been opened. When they came near, they bent down and saw a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) “Why did you come? Whom are you looking for? Not that one who was crucified? He arose and went away. But if you do not believe, bend down and see where he was lying, that he is not there, because he arose and went to where he came from.”


    (57) Then the women were afraid and fled.'
translation:
  language: pt
  text: '(55) Elas foram e encontraram o túmulo aberto. Ao se aproximarem, inclinaram-se e viram ali certo jovem sentado no meio do túmulo. Ele era belo e estava vestido com uma longa veste resplandecente. Ele lhes disse: (56) “Por que vocês vieram? A quem procuram? Àquele que foi crucificado? Ele ressuscitou e foi embora. Mas, se vocês não acreditam, inclinem-se e vejam o lugar onde ele estava deitado: ele não está aqui, pois ressuscitou e foi para o lugar de onde veio.”


    (57) Então as mulheres ficaram com medo e fugiram.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tomb
  choice: túmulo
  rationale: Termo corrente e digno, adequado ao contexto funerário e consistente ao longo do trecho.
- source_word: a certain young man
  choice: certo jovem
  rationale: Preserva a apresentação indefinida da personagem sem acrescentar uma identificação angelical ausente no testemunho fornecido.
- source_word: beautiful
  choice: belo
  rationale: Mantém diretamente a descrição incomum do jovem, sem substituí-la por termos interpretativos como 'majestoso'.
- source_word: long, shining robe
  choice: longa veste resplandecente
  rationale: Reproduz os dois elementos descritivos em linguagem natural e solene.
- source_word: arose
  choice: ressuscitou
  rationale: No contexto daquele que foi crucificado e já não está no túmulo, 'ressuscitou' comunica em português o sentido pretendido melhor que o meramente físico 'levantou-se'.
- source_word: went away / went to where he came from
  choice: foi embora / foi para o lugar de onde veio
  rationale: Preserva a repetição e a enigmática indicação de destino, sem explicar teologicamente qual seria esse lugar.
theological_decisions:
- issue: Identidade do jovem no túmulo
  choice: certo jovem
  alternative: um anjo
  rationale: O testemunho fornecido o chama de jovem; identificá-lo como anjo resolveria uma ambiguidade que o texto mantém.
- issue: Sentido da declaração sobre o crucificado
  choice: Ele ressuscitou e foi embora
  alternative: Ele se levantou e partiu
  rationale: A escolha explicita o sentido de ressurreição exigido pelo contexto funerário, preservando ao mesmo tempo a afirmação subsequente de que ele partiu.
- issue: Destino após a ressurreição
  choice: o lugar de onde veio
  alternative: o Pai / o céu
  rationale: Mantém a formulação aberta do testemunho e evita importar uma identificação teológica não expressa no trecho.
- issue: Forma da pergunta 'Not that one who was crucified?'
  choice: Àquele que foi crucificado?
  alternative: Não procuram aquele que foi crucificado?
  rationale: Produz uma pergunta elíptica natural em português e a liga à pergunta anterior, sem acrescentar uma negação sintaticamente incerta.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira e tom narrativo digno. Como a revisão direta do grego permanece pendente e o material fornecido é uma testemunha inglesa de domínio público, a redação deve ser considerada provisória. Não foram usadas notas de rodapé, portanto não há marcadores no texto.
