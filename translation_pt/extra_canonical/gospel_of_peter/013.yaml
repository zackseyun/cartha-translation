review_pass:
  verdict: revise
  source_fidelity: A redação acompanha de perto a testemunha inglesa fornecida. Contudo, a sequência «A quem procuram? Àquele que foi crucificado?» fica sintaticamente truncada em português e não representa de modo claro a pergunta elíptica/negativa da testemunha («Not that one who was crucified?»). «Não é aquele que foi crucificado?» preserva a força interrogativa sem identificar além do que o texto diz. Também «não está lá» reproduz mais exatamente o deíctico da testemunha («he's not there») do que «não está aqui». A revisão direta do grego continua pendente.
  naturalness: O texto tem registro narrativo digno, moderno e claro. A pequena reformulação da pergunta torna a fala do jovem idiomática e inteligível em português internacional de boa legibilidade brasileira.
  terminology: «Túmulo», «certo jovem», «belo», «longa veste resplandecente» e «ressuscitou» são escolhas adequadas. A revisão mantém a indefinição quanto à identidade do jovem e quanto ao destino daquele que ressuscitou.
  issues:
  - severity: medium
    issue: Pergunta elíptica vertida de forma sintaticamente incompleta
    rationale: «A quem procuram? Àquele que foi crucificado?» soa como fragmento deslocado e deixa indefinida a relação da segunda pergunta com a primeira. «Não é aquele que foi crucificado?» expressa naturalmente a pergunta curta transmitida pela testemunha, sem acrescentar uma identificação.
  - severity: low
    issue: Deíctico em «ele não está aqui»
    rationale: A testemunha diz «he's not there». «Ele não está lá» preserva essa referência locativa de forma mais próxima.
