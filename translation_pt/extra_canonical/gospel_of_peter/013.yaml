review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto a testemunha inglesa fornecida e preserva adequadamente a apresentação indefinida do jovem, a sua beleza, a veste longa e brilhante, a ressurreição e o destino não especificado. Há, porém, uma pequena alteração de dêixis em «ele não está aqui», enquanto a fonte diz «ele não está lá», em referência ao lugar onde jazia.
  naturalness: O português é claro, moderno e de registro narrativo apropriado. «Vejam onde ele estava deitado; ele não está lá» é mais natural que repetir «o lugar onde» e conserva com maior precisão o contraste espacial da fonte.
  terminology: «Túmulo», «certo jovem», «belo», «veste resplandecente» e «ressuscitou» são escolhas adequadas. «Para onde veio» preserva melhor a formulação aberta da fonte do que «para o lugar de onde veio», que introduz explicitamente «lugar».
  issues:
  - severity: low
    issue: Mudança de dêixis em «ele não está aqui».
    rationale: A testemunha diz que, ao olharem o local onde ele jazia, constatariam que ele «não está lá». «Aqui» desloca o ponto de referência para os interlocutores.
  - severity: low
    issue: Explicitação de «lugar» no destino final.
    rationale: A fonte mantém a expressão mais aberta «foi para onde veio». Retirar «o lugar» reproduz melhor essa concisão sem afetar a inteligibilidade.
  revised_text: '(55) Elas foram e encontraram o túmulo aberto. Ao se aproximarem, inclinaram-se e viram ali certo jovem sentado no meio do túmulo. Ele era belo e estava vestido com uma longa veste resplandecente. Ele lhes disse: (56) “Por que vocês vieram? A quem procuram? Àquele que foi crucificado? Ele ressuscitou e foi embora. Mas, se vocês não acreditam, inclinem-se e vejam onde ele estava deitado; ele não está lá, pois ressuscitou e foi para onde veio.”


    (57) Então as mulheres ficaram com medo e fugiram.'
  revised_footnotes: []
  revision_rationale: A revisão limita-se a conservar a referência espacial da fonte («não está lá») e a evitar a explicitação desnecessária de «lugar» no destino de Jesus. Não são necessárias notas de rodapé, pois não há marcadores nem ambiguidades adicionais que exijam esclarecimento nesta redação provisória baseada na testemunha inglesa.
