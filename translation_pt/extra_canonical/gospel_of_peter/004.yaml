base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/004.yaml
  text: '(10) They brought two wrongdoers and crucified the Lord between them, but he remained silent, as though he felt no pain. (11) When they raised the cross, they wrote, "This is the king of Israel." (12) They laid his clothes in front of him, divided them, and cast lots for them.


    (13) But one of those wrongdoers rebuked them, saying, "We are suffering like this because of the wrong we did, but this one, who became the Savior of humanity—what wrong has he done to you?"


    (14) They became angry with him. They commanded that the legs not be broken, so that he might die under torture.'
translation:
  language: pt
  text: '(10) Trouxeram dois malfeitores e crucificaram o Senhor entre eles; ele, porém, permanecia em silêncio, como se não sentisse dor. (11) Quando levantaram a cruz, escreveram: “Este é o rei de Israel”. (12) Puseram as roupas dele diante dele, repartiram-nas e lançaram sortes sobre elas.


    (13) Mas um daqueles malfeitores os repreendeu, dizendo: “Nós sofremos assim por causa do mal que praticamos; mas este, que se tornou o Salvador da humanidade, que mal fez a vocês?”


    (14) Eles ficaram irados com ele e ordenaram que não lhe quebrassem as pernas, para que não morresse sob tortura.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wrongdoers
  choice: malfeitores
  rationale: Termo corrente e digno que descreve quem praticou o mal sem especificar um crime não indicado pelo testemunho.
- source_word: Lord
  choice: Senhor
  rationale: Mantém o título cristológico do testemunho e o uso tradicional inteligível em português.
- source_word: king of Israel
  choice: rei de Israel
  rationale: Reprodução direta da inscrição, sem harmonizá-la com fórmulas de outros relatos.
- source_word: Savior of humanity
  choice: Salvador da humanidade
  rationale: Preserva a abrangência humana da expressão e seu caráter cristológico, evitando restringi-la a um grupo.
- source_word: cast lots
  choice: lançaram sortes
  rationale: Expressão bíblica consagrada e ainda compreensível para a distribuição por sorteio.
- source_word: die tortured
  choice: morresse sob tortura
  rationale: Comunica que a morte ocorreria em condição de sofrimento deliberadamente prolongado.
theological_decisions:
- issue: Aparente ausência de dor do Senhor
  choice: “como se não sentisse dor”
  alternative: “como quem não tinha dor”
  rationale: Mantém a comparação e não afirma categoricamente que ele fosse incapaz de sentir dor.
- issue: “Tendo-se tornado Salvador da humanidade”
  choice: “que se tornou o Salvador da humanidade”
  alternative: “sendo o Salvador da humanidade”
  rationale: Preserva o aspecto de mudança ou chegada a uma condição presente no testemunho fornecido, sem explicá-lo doutrinariamente.
- issue: Referente das pernas que não deveriam ser quebradas
  choice: “não lhe quebrassem as pernas” com nota de ambiguidade
  alternative: Explicitar que eram as pernas do malfeitor que o defendeu
  rationale: O contexto favorece o malfeitor repreensor, mas o testemunho fornecido não explicita o referente; a nota evita uma certeza indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva a numeração e a tensão narrativa do testemunho. Como a revisão direta do grego está pendente, decisões mais finas permanecem provisórias e foram limitadas ao testemunho público fornecido.
