base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/001.yaml
  text: (1) But none of the Jews washed their hands, neither Herod nor any of his judges. When they did not want to wash, Pilate stood up. (2) Then Herod the king ordered the Lord to be brought before him and said to them, “Do whatever I commanded you to do to him.”
translation:
  language: pt
  text: '(1) Mas nenhum dos judeus lavou as mãos, nem Herodes nem qualquer um dos seus juízes. Como não quiseram lavá-las, Pilatos se levantou. (2) Então o rei Herodes mandou trazer o Senhor e lhes disse: “Façam com ele tudo o que ordenei.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego do Códice de Akhmim ainda está pendente.
    reason: A base disponibilizada não inclui o texto grego, portanto o grau de segurança e eventuais ambiguidades da língua-fonte precisam ser declarados.
lexical_decisions:
- source_word: washed the hands
  choice: lavou as mãos
  rationale: Mantém a expressão concreta do testemunho fornecido e sua possível conotação de recusa em assumir responsabilidade.
- source_word: judges
  choice: juízes
  rationale: Reprodução formal do termo do testemunho, sem especificar funções ou cargos não atestados.
- source_word: stood up
  choice: se levantou
  rationale: Preserva a ação simples e a sequência narrativa sem inferir partida, protesto ou encerramento da sessão.
- source_word: the Lord
  choice: o Senhor
  rationale: Conserva o título cristológico presente no testemunho e o registro reverente do relato.
theological_decisions:
- issue: Responsabilidade pela condenação
  choice: Preservar a afirmação coletiva do testemunho tal como transmitida, sem ampliá-la para além das personagens e do grupo referido na cena.
  alternative: Reformular ou explicar no corpo do texto a referência aos judeus.
  rationale: A tradução deve conservar a formulação antiga, embora ela exija leitura histórica cuidadosa e não deva ser usada como generalização sobre o povo judeu.
- issue: Objeto implícito em “não quiseram lavar”
  choice: Explicitar apenas o pronome “lavá-las”, retomando “as mãos”.
  alternative: Manter “não quiseram lavar”, com objeto elíptico.
  rationale: A explicitação é natural em português e não acrescenta conteúdo interpretativo relevante.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção foi mantida próxima do testemunho fornecido, evitando harmonização com os evangelhos canônicos. A nota assinala explicitamente o caráter provisório da tradução.
