review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a sequência narrativa, o gesto de lavar as mãos, a recusa, a ação de Pilatos e a ordem de Herodes. «Lavá-las» é uma explicitação legítima de «as mãos». A ordem final conserva adequadamente o sentido de fazer a Jesus o que Herodes havia ordenado.
  naturalness: O texto é claro e de registro apropriado. Contudo, «nem Herodes nem qualquer um dos seus juízes» soa menos idiomático e ligeiramente pesado em português; «nem Herodes nem nenhum de seus juízes» reproduz melhor a coordenação negativa. «Disse-lhes» é também a forma mais natural para o destinatário plural.
  terminology: «Judeus», «juízes», «Senhor», «Herodes» e «Pilatos» são adequados. A expressão «Façam com ele tudo o que ordenei» é compreensível e fiel; «Façam-lhe tudo o que lhes ordenei» mantém de modo mais explícito, porém natural, os dois referentes pronominais presentes na cena.
  issues:
  - severity: low
    issue: Construção negativa pouco natural em «nem Herodes nem qualquer um dos seus juízes».
    rationale: Após «nenhum», «nem nenhum de seus juízes» é a formulação idiomática que conserva o sentido inclusivo da negação no testemunho.
  - severity: low
    issue: Regência e destinatário plural em «lhes disse».
    rationale: Embora compreensível, «disse-lhes» é a colocação mais fluida e convencional neste contexto narrativo.
  revised_text: '(1) Mas nenhum dos judeus lavou as mãos, nem Herodes nem nenhum de seus juízes. Como não quiseram lavá-las, Pilatos se levantou. (2) Então o rei Herodes mandou trazer o Senhor e disse-lhes: “Façam-lhe tudo o que lhes ordenei.”[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego do Códice de Akhmim ainda está pendente.
    reason: A base disponibilizada não inclui o texto grego; por isso, o grau de segurança e eventuais ambiguidades da língua-fonte precisam ser declarados.
  revision_rationale: 'A revisão limita-se a melhorias seguras de idiomaticidade e de referência pronominal: substitui «qualquer um» por «nenhum» na estrutura negativa e emprega «disse-lhes». A formulação final «Façam-lhe tudo o que lhes ordenei» torna explícitos, sem acrescentar interpretação, o referente de «lhe» (o Senhor) e o destinatário plural da ordem. Mantém-se a nota de provisoriedade, pois a revisão direta do grego continua pendente.'
