  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/002.yaml
  text: 2. These, then, the double‑minded, come to him as to a magician and ask him what will happen to them; and that false prophet, having in himself no power of a divine spirit, speaks with them according to their questions [and according to the desires of their wickedness], and fills their souls as they desire.
translation:
  language: pt
  text: 2. Assim, essas pessoas de ânimo dividido vêm a ele como a um adivinho e lhe perguntam o que lhes acontecerá. E aquele falso profeta, sem ter em si nenhum poder de um espírito divino, fala com elas de acordo com as perguntas que fazem [a] e enche as almas delas conforme elas mesmas desejam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos acrescentam: “e de acordo com os desejos da maldade deles”.'
    reason: A frase καὶ κατὰ τὰς ἐπιθυμίας τῆς πονηρίας αὐτῶν aparece entre colchetes na edição-fonte, indicando incerteza textual.
lexical_decisions:
- source_word: δίψυχοι
  choice: indecisos
  rationale: O termo descreve pessoas divididas interiormente ou vacilantes. “Indecisos” é natural em português e preserva, no contexto, a falta de firmeza que as leva a consultar o falso profeta.
- source_word: μάγον
  choice: adivinho
  rationale: Neste contexto, a pessoa é procurada para revelar o futuro. “Adivinho” comunica essa função mais diretamente ao leitor moderno do que “mago”, sem legitimá-la.
- source_word: τί ἄρα ἔσται αὐτοῖς
  choice: o que lhes acontecerá
  rationale: Expressa naturalmente a pergunta acerca do futuro preservada pelo grego.
- source_word: δύναμιν πνεύματος θείου
  choice: poder de um espírito divino
  rationale: Mantém o genitivo e o artigo indefinido implícito, sem identificar ou sistematizar além do que a formulação grega exige.
- source_word: πληροῖ τὰς ψυχὰς αὐτῶν
  choice: enche a alma deles
  rationale: Preserva a imagem concreta de encher; o singular coletivo em português evita uma formulação pesada sem mudar o referente plural.
- source_word: καθὼς αὐτοὶ βούλονται
  choice: conforme os seus próprios desejos
  rationale: 'Torna explícita a ênfase de αὐτοί: o falso profeta satisfaz aquilo que eles mesmos querem ouvir.'
theological_decisions:
- issue: Identidade do “espírito divino”
  choice: um espírito divino
  alternative: o Espírito divino
  rationale: A construção grega πνεύματος θείου não traz artigo e, neste ponto, descreve a ausência de poder espiritual divino no falso profeta. A tradução evita impor uma identificação técnica que o enunciado não explicita.
- issue: Leitura variante entre colchetes
  choice: registrá-la em nota, sem incorporá-la ao corpo principal
  alternative: “e de acordo com os desejos da maldade deles” no texto principal
  rationale: A expressão está assinalada como textualmente incerta na fonte fornecida. A nota preserva a evidência sem tratá-la como indiscutivelmente original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A pontuação divide o longo período grego em duas frases. Evitou-se linguagem denominacional e preservou-se a incerteza textual por meio de nota.
