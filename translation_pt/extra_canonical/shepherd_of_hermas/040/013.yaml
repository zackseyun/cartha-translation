  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/013.yaml
  text: 13. Then, he does not come near a gathering of righteous men at all, but avoids them. He clings to the double‑minded and the empty, and he prophesies to them in a corner, and deceives them by speaking everything according to their desires, emptily; for he also answers the empty. For an empty vessel, placed together with empty ones, is not broken, but they agree with one another.
translation:
  language: pt
  text: 13. Além disso, ele de modo algum se aproxima de uma reunião de homens justos, mas foge deles. Apega-se aos de ânimo dividido e aos vazios, profetiza para eles num canto e os engana, falando-lhes tudo de maneira vazia, segundo os desejos deles; pois também responde a pessoas vazias. De fato, um recipiente vazio, colocado junto de outros recipientes vazios, não se quebra; antes, ficam em harmonia uns com os outros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψύχοις
  choice: indecisos
  rationale: Expressa aqui pessoas de ânimo dividido e fé vacilante, em português natural, sem reduzir o termo a mera dúvida intelectual.
- source_word: κενοῖς
  choice: vazios
  rationale: Mantém a repetição retórica do grego e sua caracterização espiritual e moral.
- source_word: κατὰ γωνίαν
  choice: num canto
  rationale: Preserva a imagem concreta de uma atuação privada ou apartada, sem explicitar além do que o texto diz.
- source_word: κολλᾶται
  choice: apega-se
  rationale: Comunica associação estreita e persistente, em contraste com a fuga da reunião dos justos.
- source_word: συμφωνοῦσιν ἀλλήλοις
  choice: ficam em harmonia uns com os outros
  rationale: Reproduz a ideia de concordância mútua, preservando a ironia da comparação.
theological_decisions:
- issue: Sentido moral e espiritual de δίψυχος
  choice: indecisos
  alternative: de ânimo dividido
  rationale: A opção escolhida é clara ao leitor comum e mantém a noção de instabilidade; a formulação alternativa seria mais formal e literal, mas menos natural.
- issue: Referente de 'ele' no início do parágrafo
  choice: manter o pronome em continuidade com o contexto
  alternative: explicitar 'o falso profeta'
  rationale: O grego depende do referente apresentado no parágrafo anterior; conservar o pronome respeita a coesão do discurso sem inserir repetição ausente no original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência proverbial na imagem final. A repetição de 'vazio' foi mantida por ser estrutural ao argumento do texto.
