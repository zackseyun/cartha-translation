base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/004.yaml
  text: 4. Therefore, as many as are strong in the faith of the Lord, having put on the truth, do not cling to such spirits, but keep away from them. But those who are double‑minded and often repent practice divination like the nations and bring a greater sin upon themselves by practicing idolatry; for the one who consults a false prophet about any matter is an idolater, empty of the truth and foolish.
translation:
  language: pt
  text: 4. Portanto, todos os que são fortes na fé do Senhor e estão revestidos da verdade não se apegam a espíritos como esses, mas se mantêm longe deles. Os que têm o coração dividido, porém, e se arrependem repetidas vezes recorrem à adivinhação, como as nações, e atraem sobre si um pecado ainda maior ao praticarem idolatria. Pois quem consulta um falso profeta a respeito de qualquer ação é idólatra, vazio da verdade e insensato.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίψυχοι
  choice: os que têm o coração dividido
  rationale: Expressa de modo natural a ideia de hesitação ou lealdade interior dividida, sem reduzi-la simplesmente a dúvida intelectual.
- source_word: πυκνῶς μετανοοῦσι
  choice: se arrependem repetidas vezes
  rationale: Preserva o sentido frequente de πυκνῶς e o vocabulário moral de μετανοέω, mantendo a tensão do texto sem explicar a causa dessa repetição.
- source_word: μαντεύονται
  choice: recorrem à adivinhação
  rationale: Indica a prática de buscar conhecimento por meios divinatórios, de acordo com o contexto da consulta ao falso profeta.
- source_word: περὶ πράξεώς τινος
  choice: a respeito de qualquer ação
  rationale: Mantém a referência ampla a algum ato, empreendimento ou curso de ação, sem restringi-la a uma questão genérica.
- source_word: ἄφρων
  choice: insensato
  rationale: Termo corrente e digno que comunica falta de discernimento moral, não mera deficiência intelectual.
theological_decisions:
- issue: Relação entre consulta ao falso profeta e idolatria
  choice: Traduzir diretamente que quem consulta um falso profeta é idólatra
  alternative: Suavizar para dizer que a pessoa age como idólatra
  rationale: O grego usa uma afirmação nominal direta, εἰδωλολάτρης ἐστίν; a tradução preserva a força teológica do autor sem atenuá-la.
- issue: Sentido dos que se arrependem frequentemente
  choice: Manter literalmente a repetição do arrependimento
  alternative: Interpretar como pessoas que mudam frequentemente de ideia ou recaem repetidamente
  rationale: O texto não explicita se o problema é inconstância, recaída ou arrependimento superficial; a formulação conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe acompanha o encadeamento argumentativo do grego sem soar excessivamente literal.
