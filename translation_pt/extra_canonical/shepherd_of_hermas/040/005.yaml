base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/005.yaml
  text: 5. For no spirit given from God is consulted, but, having the power of the Deity, it speaks everything from itself, because it is from above, from the power of the divine Spirit.
translation:
  language: pt
  text: 5. Pois nenhum espírito dado por Deus é consultado; ao contrário, tendo o poder da divindade, fala por si mesmo todas as coisas, porque vem do alto, do poder do Espírito divino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπερωτᾶται
  choice: é consultado
  rationale: Preserva o contraste com o falso espírito, que só fala quando interrogado, e soa natural no contexto de consulta profética.
- source_word: τὴν δύναμιν τῆς θεότητος
  choice: o poder da divindade
  rationale: Tradução formal que mantém a formulação abstrata do grego sem identificar indevidamente θεότης com uma pessoa específica.
- source_word: ἀφ' ἑαυτοῦ λαλεῖ
  choice: fala por si mesmo
  rationale: Reproduz o sentido de iniciativa própria no contraste literário, sem sugerir independência de Deus, pois a oração seguinte explicita sua origem no alto.
- source_word: ἄνωθέν
  choice: vem do alto
  rationale: Exprime origem celestial de maneira clara e corrente.
- source_word: τοῦ θείου πνεύματος
  choice: do Espírito divino
  rationale: Mantém a possibilidade de referência ao Espírito de Deus, com maiúscula coerente com o contexto, sem ampliar a expressão.
theological_decisions:
- issue: A afirmação de que o espírito fala ἀφ’ ἑαυτοῦ pode parecer indicar autonomia em relação a Deus.
  choice: fala por si mesmo
  alternative: fala espontaneamente
  rationale: A tradução conserva a tensão do original; a continuação esclarece que o espírito vem do alto e recebe seu poder do Espírito divino.
- issue: Capitalização de πνεῦμα na primeira ocorrência.
  choice: espírito
  alternative: Espírito
  rationale: O referente imediato é todo espírito profético dado por Deus, não necessariamente uma designação direta e inequívoca do Espírito Santo.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A estrutura adversativa foi explicitada com “ao contrário” para tornar natural o contraste οὐκ... ἀλλά, sem alterar o conteúdo.
