    issue: Capitalização interpretativa de «Espírito»
    rationale: O original emprega πνεῦμα sem sinal gráfico de nome próprio. A maiúscula pode identificar de modo mais definido o referente do que a redação desta sentença exige.
  - severity: low
    issue: «Portanto, esse é o poder»
    rationale: A construção torna o enunciado mais inferencial e menos preciso do que a frase elíptica e recapitulativa do grego; «Quanto a..., tal é o seu poder» conserva melhor a relação sintática.
