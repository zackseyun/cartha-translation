  text: 10. Thus the spirit of the Deity will be made manifest. As for the spirit of the Deity of the Lord, this is its power.
translation:
  language: pt
  text: 10. Assim se tornará evidente o espírito da divindade. Quanto ao espírito da divindade do Senhor, tal é o seu poder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φανερὸν ἔσται
  choice: se manifestará
  rationale: Expressa de modo natural o sentido de tornar-se evidente ou reconhecível no contexto do discernimento profético.
- source_word: τὸ πνεῦμα τῆς θεότητος
  choice: o Espírito da divindade
  rationale: Mantém a formulação incomum e solene do grego, sem reduzi-la simplesmente a “Espírito divino”.
- source_word: ἡ δύναμις
  choice: o poder
  rationale: Conserva o sentido de capacidade ou eficácia atuante, em continuidade com a descrição anterior da ação profética.
theological_decisions:
- issue: Referência e capitalização de πνεῦμα
  choice: Espírito
  alternative: espírito
  rationale: O contexto imediato identifica esse espírito como vindo de Deus e o chama de Espírito Santo; a maiúscula torna essa referência clara sem acrescentar uma definição doutrinária ausente do texto.
- issue: Construção elíptica da segunda frase grega
  choice: Portanto, esse é o poder do Espírito da divindade do Senhor.
  alternative: Quanto ao Espírito da divindade do Senhor, tal é o seu poder.
  rationale: A redação escolhida preserva a afirmação resumitiva do original em português claro, sem tentar resolver além do necessário a sintaxe grega difícil.
translation_notes:
  register: Português atual, digno e acessível, com repetição deliberada de “Espírito da divindade” para conservar a terminologia e a ênfase do grego.
