base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/003.yaml
  text: 3. For he, being empty, answers empty men with empty things; for whatever he is asked, he answers according to the emptiness of the person. But he also speaks some true words; for the devil fills him with his own spirit, if perhaps he may be able to tear away some of the righteous.
translation:
  language: pt
  text: 3. Pois ele, sendo vazio, responde com coisas vazias a pessoas vazias; porque, seja qual for a pergunta que lhe façam, ele responde de acordo com o vazio da pessoa. Contudo, também diz algumas palavras verdadeiras, pois o diabo o enche com seu próprio espírito, para ver se consegue afastar alguns dos justos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κενὸς / κενὰ / κενοῖς / κένωμα
  choice: vazio / coisas vazias / pessoas vazias / vazio
  rationale: Preserva a repetição retórica deliberada da raiz grega e a ligação entre a condição do falso profeta, suas respostas e seus consulentes.
- source_word: ῥήματα ἀληθῆ
  choice: palavras verdadeiras
  rationale: Tradução direta e natural, sem sugerir que toda a mensagem do falso profeta seja verdadeira.
- source_word: ῥῆξαι
  choice: desviar
  rationale: No contexto, o verbo expressa arrancar ou romper alguém de sua firmeza entre os justos; “desviar” comunica esse efeito em português corrente sem acrescentar uma definição denominacional de apostasia.
theological_decisions:
- issue: A agência do diabo e o espírito que enche o falso profeta
  choice: “o diabo o enche com seu próprio espírito”
  alternative: “o diabo o enche de seu espírito”
  rationale: Mantém a afirmação explícita e forte do grego τῷ αὐτοῦ πνεύματι, sem explicar metafisicamente a natureza desse espírito.
- issue: Finalidade ou tentativa em εἴ τινα δυνήσεται
  choice: “para ver se consegue desviar alguns dos justos”
  alternative: “caso consiga arrancar algum dos justos”
  rationale: Conserva o caráter tentativo da construção e evita afirmar antecipadamente que os justos serão efetivamente desviados.
translation_notes:
  register: Português moderno, digno e acessível, com a repetição enfática de “vazio” preservada. A sintaxe foi levemente naturalizada, sem eliminar a tensão entre as palavras ocasionalmente verdadeiras e a origem diabólica do falso profeta.
