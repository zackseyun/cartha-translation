  terminology: «Reunião», «súplica», «anjo do espírito profético», «Espírito Santo» e «multidão» são escolhas adequadas. A distinção gráfica entre «Espírito divino» e «espírito profético» pode ser mantida, pois não identifica indevidamente o anjo com o Espírito Santo.
