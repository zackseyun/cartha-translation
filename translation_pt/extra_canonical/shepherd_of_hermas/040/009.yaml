base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/009.yaml
  text: 9. Therefore, when the man who has the divine spirit comes into a gathering of righteous men who have faith in the divine Spirit, and an intercession is made to God by the gathering of those men, then the angel of the prophetic spirit who is assigned to him fills the man; and being filled with the holy Spirit he speaks to the multitude as the Lord wills.
translation:
  language: pt
  text: 9. Portanto, quando o homem que tem o Espírito divino entra numa reunião de homens justos que têm fé no Espírito divino, e se faz uma súplica a Deus naquela reunião de homens, então o anjo do espírito profético que está junto dele enche esse homem; e, cheio do Espírito Santo, ele fala à multidão conforme o Senhor quer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγή
  choice: reunião
  rationale: No contexto, designa uma assembleia de pessoas, sem exigir a instituição posterior normalmente evocada por “sinagoga”.
- source_word: ἔντευξις
  choice: súplica
  rationale: Expressa uma petição dirigida a Deus; “súplica” é natural e preserva o caráter devocional do termo.
- source_word: ὁ κείμενος πρὸς αὐτόν
  choice: que está junto dele
  rationale: Mantém a formulação espacial e relacional do grego sem acrescentar a ideia mais específica de uma designação oficial.
- source_word: πληροῖ / πληρωθείς
  choice: enche / cheio
  rationale: Preserva a repetição retórica e a imagem de ser preenchido pelo Espírito.
- source_word: τὸ πλῆθος
  choice: a multidão
  rationale: Equivalente direto que indica o conjunto dos reunidos.
- source_word: καθὼς ὁ Κύριος βούλεται
  choice: conforme o Senhor quer
  rationale: Formulação corrente e fiel, que atribui ao Senhor a determinação da fala.
theological_decisions:
- issue: Capitalização de πνεῦμα em suas diferentes ocorrências
  choice: “Espírito divino” e “Espírito Santo” com maiúscula; “espírito profético” com minúscula
  alternative: Grafar todas as ocorrências como “espírito” ou todas como “Espírito”
  rationale: “Espírito divino” e “Espírito Santo” referem-se claramente ao Espírito procedente de Deus. Em “anjo do espírito profético”, a relação exata entre anjo, dom e Espírito permanece menos definida; a minúscula evita resolver além do texto.
- issue: Identidade do anjo do espírito profético
  choice: Conservar literalmente “o anjo do espírito profético”
  alternative: Parafrasear como “o anjo responsável pela profecia” ou identificar o anjo com o Espírito Santo
  rationale: O grego mantém uma distinção verbal entre o anjo do espírito profético e o Espírito Santo; a tradução preserva essa tensão sem impor uma sistematização teológica.
- issue: Agente da súplica
  choice: “a reunião daqueles homens dirige uma súplica”
  alternative: “faz-se uma súplica a Deus na reunião”
  rationale: O genitivo no grego liga a súplica à assembleia; a redação escolhida torna essa relação clara sem atribuí-la necessariamente a um único oficiante.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e proximidade estrutural ao grego. A repetição de “homens” foi preservada por corresponder à formulação enfática do original, e não foram introduzidos termos eclesiásticos mais técnicos.
