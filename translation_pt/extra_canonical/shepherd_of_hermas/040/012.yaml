base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/012.yaml
  text: 12. First, that man who seems to have a spirit exalts himself and wants to have the first seat; and immediately he is presumptuous and shameless and talkative, and lives among many luxuries and many other deceits, and he receives payment for his prophecy; and if he does not receive it, he does not prophesy. Can a divine spirit receive payment and prophesy? A prophet of God cannot do this; rather, the spirit of such prophets is earthly.
translation:
  language: pt
  text: 12. Em primeiro lugar, aquele homem que parece ter um espírito exalta a si mesmo e quer ocupar o primeiro lugar. Logo se mostra arrogante, sem pudor e tagarela; vive cercado de muitos luxos e de muitos outros enganos, e recebe pagamento por sua profecia. Se não recebe, não profetiza. Acaso um espírito divino pode receber pagamento e profetizar? Um profeta de Deus não pode fazer isso; pelo contrário, o espírito de profetas desse tipo é terreno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δοκῶν πνεῦμα ἔχειν
  choice: que parece ter um espírito
  rationale: Preserva a ressalva crítica de δοκῶν e a indefinição de πνεῦμα, sem validar a alegação do homem.
- source_word: πρωτοκαθεδρίαν
  choice: o primeiro lugar
  rationale: Expressa de modo natural a busca pela posição principal ou assento de honra, sem limitar a referência a um móvel literal.
- source_word: ἰταμός
  choice: arrogante
  rationale: Comunica a presunção atrevida indicada pelo termo no contexto.
- source_word: ἀναιδής
  choice: sem pudor
  rationale: Mantém o sentido de descaramento ou ausência de vergonha em registro digno e corrente.
- source_word: πολύλαλος
  choice: tagarela
  rationale: Traduz diretamente a fala excessiva como traço negativo, em linguagem acessível.
- source_word: ἐν τρυφαῖς πολλαῖς ἀναστρεφόμενος
  choice: vive cercado de muitos luxos
  rationale: Reproduz o sentido de conduzir a vida em meio a indulgências e luxo, com construção natural em português.
- source_word: μισθὸν
  choice: pagamento
  rationale: Indica remuneração recebida pela atividade profética; é mais claro ao leitor atual do que 'salário' neste contexto.
- source_word: ἐπίγειον
  choice: terreno
  rationale: Preserva o contraste explícito entre o espírito divino, vindo do alto, e o espírito ligado à terra.
theological_decisions:
- issue: Referência de πνεῦμα na frase inicial
  choice: um espírito
  alternative: o Espírito
  rationale: O grego não traz aqui uma identificação inequívoca com o Espírito Santo; o contexto descreve uma pretensão que depois é julgada falsa. A forma indefinida conserva essa tensão.
- issue: Possibilidade de remuneração profética
  choice: Manter a pergunta retórica e a negação categórica do texto
  alternative: Explicar como condenação apenas da profecia motivada por dinheiro
  rationale: O segmento formula a questão em termos absolutos. A tradução não acrescenta uma qualificação interpretativa ausente do grego.
- issue: Natureza do espírito dos falsos profetas
  choice: o espírito ... é terreno
  alternative: eles têm uma atitude mundana
  rationale: Mantém a linguagem ontológica e espiritual do autor, sem reduzi-la a uma descrição psicológica.
