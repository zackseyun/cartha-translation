  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/007.yaml
  text: 7. “How then,” I say, “sir, will a person know which of them is a prophet and which is a false prophet?” “Listen,” he says, “about both prophets; and in the way I am about to tell you, so you shall test the prophet and the false prophet. Test the man who has the divine spirit by his life.
translation:
  language: pt
  text: '7. Então perguntei: “Senhor, como alguém saberá qual deles é profeta e qual é falso profeta?” Ele respondeu: “Escute a respeito de ambos os profetas. Conforme eu lhe disser, assim você examinará o profeta e o falso profeta. Examine, pela vida dele, o homem que tem o Espírito divino.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Senhor
  rationale: Forma respeitosa e natural de tratamento no diálogo, preservando o tom do grego.
- source_word: δοκιμάσεις / δοκίμαζε
  choice: examinará / examine
  rationale: Expressa a ideia de pôr à prova e avaliar, sem sugerir apenas reconhecimento intuitivo.
- source_word: ἀπὸ τῆς ζωῆς
  choice: pela sua vida
  rationale: Mantém o critério do modo de viver ou conduta da pessoa em formulação portuguesa natural.
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: o Espírito divino
  rationale: Preserva a referência ao espírito procedente de Deus e acompanha o uso reverente do contexto.
- source_word: ἀμφοτέρων τῶν προφητῶν
  choice: dos dois tipos de profeta
  rationale: O referente são o profeta e o falso profeta; 'tipos' torna clara em português a classificação pretendida sem confundi-los como dois profetas verdadeiros.
theological_decisions:
- issue: Critério para discernir profecia verdadeira e falsa
  choice: “Examine pela sua vida”
  alternative: “Julgue o homem por sua conduta”
  rationale: A tradução conserva a ênfase do texto na vida observável do portador do espírito, sem acrescentar critérios confessionais.
- issue: Capitalização de πνεῦμα θεῖον
  choice: “Espírito divino”
  alternative: “espírito divino”
  rationale: O contexto posterior o associa ao Espírito Santo e à ação de Deus; a capitalização torna essa referência natural em português, embora a expressão grega, isoladamente, permita grafia minúscula.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O diálogo foi vertido com pontuação natural; preservou-se a repetição enfática de profeta e falso profeta, com leve explicitação em “dois tipos de profeta” para evitar ambiguidade sintática.
