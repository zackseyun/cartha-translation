revisions:
- from: '7. Então perguntei: “Senhor, como alguém saberá qual deles é profeta e qual é falso profeta?” Ele respondeu: “Ouça o que vou dizer a respeito dos dois tipos de profeta. Da maneira que estou para lhe explicar, você examinará tanto o profeta como o falso profeta. Examine pela sua vida o homem que tem o Espírito divino.”'
  to: '7. Então perguntei: “Senhor, como alguém saberá qual deles é profeta e qual é falso profeta?” Ele respondeu: “Escute a respeito de ambos os profetas. Conforme eu lhe disser, assim você examinará o profeta e o falso profeta. Examine, pela vida dele, o homem que tem o Espírito divino.”'
  rationale: A revisão conserva o diálogo, o contraste entre profeta e falso profeta e o imperativo de testar. Remove a classificação adicional introduzida por «tipos», substitui uma construção pouco idiomática e esclarece que a vida avaliada é a do homem portador do Espírito divino.
