base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/008.yaml
  text: 8. First of all, the one who has the [divine] spirit from above is gentle and quiet and humble‑minded, and refrains from every evil and from the vain desire of this age, and makes himself lower than all people; and when consulted he answers nothing to anyone, nor does he speak privately—nor does the holy Spirit speak whenever a person wishes it to speak—but it speaks when God wishes him to speak.
translation:
  language: pt
  text: 8. Antes de tudo, aquele que tem o Espírito [divino] que vem do alto é manso, tranquilo e humilde; afasta-se de toda maldade e de todo desejo vão deste mundo, considera-se inferior a todas as pessoas e, quando consultado, não responde coisa alguma a ninguém, nem fala em particular. O Espírito Santo tampouco fala quando uma pessoa quer que ele fale; pelo contrário, fala quando Deus quer que essa pessoa fale.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πραΰς
  choice: manso
  rationale: Equivalente corrente e digno para a disposição branda e não agressiva indicada pelo grego.
- source_word: ἡσύχιος
  choice: tranquilo
  rationale: Expressa serenidade e quietude de modo natural em português moderno.
- source_word: ταπεινόφρων
  choice: humilde
  rationale: Comunica com clareza a ideia de humildade de mente, sem a forma menos natural «humilde de pensamento».
- source_word: τοῦ αἰῶνος τούτου
  choice: deste mundo
  rationale: Neste contexto, αἰών designa a ordem ou era presente; «deste mundo» é natural e preserva o contraste implícito com o que vem do alto.
- source_word: ἐνδεέστερον
  choice: inferior
  rationale: Conserva a comparação segundo a qual a pessoa se coloca abaixo de todas as demais, sem sugerir necessariamente carência material.
- source_word: κατὰ μόνας
  choice: em particular
  rationale: Indica fala privada ou isolada, em contraste com a manifestação na assembleia descrita no contexto seguinte.
theological_decisions:
- issue: Inclusão de θεῖον entre colchetes na expressão «Espírito [divino]»
  choice: Espírito [divino]
  alternative: Espírito
  rationale: O adjetivo aparece entre colchetes na edição grega, sinalizando incerteza textual; a tradução mantém essa transparência sem decidir silenciosamente a variante.
- issue: Referente de αὐτόν em «ὅταν θελήσῃ αὐτὸν ὁ Θεὸς λαλῆσαι»
  choice: quando Deus quer que essa pessoa fale
  alternative: quando Deus quer que o Espírito fale
  rationale: O acusativo masculino αὐτόν aponta mais naturalmente para o homem portador do Espírito, embora a oração anterior tenha o Espírito Santo como sujeito. A formulação preserva a distinção entre a iniciativa divina e o instrumento humano.
- issue: Relação entre a vontade humana e a fala do Espírito
  choice: O Espírito Santo tampouco fala quando uma pessoa quer que ele fale
  alternative: O Espírito Santo não fala sempre que uma pessoa deseja falar
  rationale: A opção mantém o sentido de que a manifestação profética não está sob controle humano, sem negar genericamente a fala humana.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe levemente solene adequada a um texto cristão antigo. A repetição de «fala» foi preservada para refletir a ênfase do original. Os colchetes no texto principal reproduzem a incerteza textual da edição-fonte, não uma nota de rodapé.
