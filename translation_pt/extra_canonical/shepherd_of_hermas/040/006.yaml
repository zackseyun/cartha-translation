base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/006.yaml
  text: 6. But the spirit that is consulted and speaks according to the desires of men is earthly and light, having no power; and it does not speak at all unless it is consulted.
translation:
  language: pt
  text: 6. Mas o espírito que é consultado e fala de acordo com os desejos das pessoas é terreno e leviano, sem poder algum; e não fala de modo nenhum se não for consultado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπερωτώμενον
  choice: que é consultado
  rationale: Preserva a ideia de um espírito ao qual as pessoas dirigem perguntas, em contraste com o espírito dado por Deus, que fala por iniciativa divina.
- source_word: κατὰ τὰς ἐπιθυμίας τῶν ἀνθρώπων
  choice: de acordo com os desejos das pessoas
  rationale: Traduz diretamente a conformidade da fala do espírito com os desejos humanos; “pessoas” oferece leitura abrangente e natural.
- source_word: ἐπίγειον
  choice: terreno
  rationale: Mantém o contraste vertical e teológico do contexto entre o que vem do alto e o que pertence à terra.
- source_word: ἐλαφρόν
  choice: leviano
  rationale: No contexto, descreve falta de seriedade, substância ou peso moral, não simplesmente baixo peso físico.
- source_word: δύναμιν μὴ ἔχον
  choice: sem poder algum
  rationale: Expressa com naturalidade a ausência de poder afirmada pelo grego.
- source_word: ὅλως οὐ λαλεῖ
  choice: não fala de modo nenhum
  rationale: Conserva a ênfase enfática de ὅλως com linguagem portuguesa corrente.
theological_decisions:
- issue: Natureza do “espírito” mencionado
  choice: Manter “o espírito” sem identificá-lo mais precisamente
  alternative: Traduzir ou explicar como “espírito falso”, “espírito demoníaco” ou “poder do falso profeta”
  rationale: O versículo o caracteriza como terreno, leviano e impotente, mas não acrescenta aqui uma identificação técnica; a tradução preserva essa formulação.
- issue: Sentido de ἐλαφρόν
  choice: “leviano”
  alternative: “leve”, “frívolo” ou “inconstante”
  rationale: “Leviano” preserva a avaliação negativa e a falta de peso moral sem transformar a metáfora em uma definição doutrinária.
translation_notes:
  register: Português moderno, digno e claro, com sintaxe próxima do grego sem rigidez. A repetição de “consultado” foi mantida por refletir a estrutura e o contraste argumentativo do original.
source_grounding:
  english_pob_role: consult_only
