base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/017.yaml
  text: 21. You see, then, that things from above, though very small when they fall upon the earth, have great power; so also the divine spirit that comes from above is powerful. Trust in this spirit, but keep away from the other.”
translation:
  language: pt
  text: 21. Você vê, portanto, que as coisas do alto, embora sejam muito pequenas, ao caírem sobre a terra têm grande poder. Assim também o espírito divino que vem do alto é poderoso. Portanto, confie nesse espírito e mantenha-se afastado do outro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἄνωθεν
  choice: as coisas do alto
  rationale: Preserva a expressão espacial e sua relação com a procedência divina, sem explicitar além do grego.
- source_word: ἐλάχιστα
  choice: muito pequenas
  rationale: Expressa o superlativo em português natural e retoma os pequenos exemplos do contexto anterior.
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: o espírito divino
  rationale: Tradução direta que mantém a referência do texto sem impor aqui uma identificação terminológica mais específica.
- source_word: δυνατόν
  choice: poderoso
  rationale: Mantém o contraste com a impotência dos espíritos terrenos e corresponde à ideia de δύναμις na frase anterior.
- source_word: πίστευε
  choice: confie
  rationale: Neste contexto, o imperativo indica depositar confiança nesse espírito; 'confie' é claro e idiomático.
- source_word: ἀπέχου
  choice: mantenha-se afastado
  rationale: Reproduz o imperativo de evitar e conservar distância do outro espírito.
theological_decisions:
- issue: Identidade de 'espírito divino'
  choice: Manter 'espírito divino' em minúsculas
  alternative: Espírito Divino / Espírito Santo
  rationale: A unidade contrapõe tipos de espírito e usa aqui τὸ πνεῦμα τὸ θεῖον; a tradução preserva essa formulação sem resolver tipograficamente a possível referência ao Espírito Santo.
- issue: Sentido de πίστευε
  choice: confie nesse espírito
  alternative: creia nesse espírito
  rationale: O contexto recomenda reconhecer e seguir o espírito vindo do alto; 'confie' comunica a força relacional do imperativo sem sugerir meramente acreditar em sua existência.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima ao grego. A repetição de 'do alto' e 'espírito' foi preservada por sua função argumentativa.
