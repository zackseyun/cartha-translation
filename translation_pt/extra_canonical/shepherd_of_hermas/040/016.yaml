base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/016.yaml
  text: 20. Take now the power that comes from above. Hail is a very small pellet, and when it falls on a man’s head, how much pain it causes! Or again, take a drop that falls from the roof tile to the ground, and it bores through the stone.
translation:
  language: pt
  text: 20. Considere agora o poder que vem do alto. A pedra de granizo é um grão minúsculo, mas, quando cai sobre a cabeça de uma pessoa, quanta dor provoca! Considere também uma gota que cai da telha ao chão e perfura a pedra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβε
  choice: Considere
  rationale: No contexto argumentativo, o imperativo convida o ouvinte a tomar o exemplo em consideração, não literalmente a pegar algo.
- source_word: τὴν δύναμιν τὴν ἄνωθεν ἐρχομένην
  choice: o poder que vem do alto
  rationale: Preserva a expressão espacial e sua possível conotação divina sem explicá-la além do grego.
- source_word: ἡ χάλαζα ... κοκκάριον
  choice: A pedra de granizo é um grão minúsculo
  rationale: Torna natural em português a imagem de uma pequena unidade de granizo, conservando o diminutivo ἐλάχιστόν.
- source_word: τοῦ κεράμου
  choice: da telha
  rationale: Κέραμος designa aqui a telha do teto, origem da gota, sem necessidade de acrescentar 'telhado'.
- source_word: τρυπᾷ
  choice: perfura
  rationale: Expressa diretamente a ação repetida ou eficaz da gota sobre a pedra.
theological_decisions:
- issue: Sentido de 'do alto'
  choice: Manter 'do alto'
  alternative: Explicitar 'de Deus' ou 'do céu'
  rationale: O texto apresenta a origem superior do poder e desenvolve sua associação com o Espírito divino no contexto, mas este versículo não explicita o referente.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo entre os dois exemplos. 'Pessoa' evita o masculino genérico desnecessário; 'pedra de granizo' e 'telha' mantêm a concretude das imagens.
