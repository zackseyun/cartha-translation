  text: 11. “Hear now,” he says, “about the spirit that is earthly and empty and has no power, but is foolish.
translation:
  language: pt
  text: 11. “Ouça agora”, diz ele, “a respeito do espírito terreno e vazio, que não tem poder, mas é insensato.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίγειος
  choice: terreno
  rationale: Preserva o contraste do texto entre o espírito que vem do alto e o espírito ligado à terra.
- source_word: κενός
  choice: vazio
  rationale: Mantém a imagem recorrente de falta de conteúdo ou realidade espiritual.
- source_word: δύναμιν μὴ ἔχοντος
  choice: que não tem poder
  rationale: Reproduz de modo natural a ausência de δύναμις, sem ampliar seu sentido.
- source_word: μωρός
  choice: insensato
  rationale: Expressa falta de discernimento com dignidade e clareza, evitando o tom excessivamente coloquial de “tolo” neste contexto.
theological_decisions:
- issue: Natureza do espírito terreno
  choice: Manter “espírito” em minúscula e qualificá-lo como terreno, vazio e impotente.
  alternative: Interpretá-lo explicitamente como espírito demoníaco ou como disposição humana.
  rationale: O grego não resolve aqui de forma explícita sua natureza ontológica; a tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com a fala introdutória ajustada à ordem natural do idioma. Não há necessidade de nota textual nesta unidade.
