base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/001.yaml
  text: 1. He showed me men sitting on a bench, and another man sitting on a chair. And he says to me, “Do you see the ones sitting on the bench?” “I see, sir,” I say. “These,” he says, “are faithful; and the one sitting on the chair is a false prophet who destroys the understanding of the slaves of God—of the double‑minded, not of the faithful.
translation:
  language: pt
  text: '1. Ele me mostrou alguns homens sentados num banco e outro homem sentado numa cadeira. Então me disse: “Você vê os que estão sentados no banco?”

    “Vejo, senhor”, respondi.

    “Estes”, disse ele, “são fiéis; mas o que está sentado na cadeira é um falso profeta, que destrói o entendimento dos servos de Deus — o dos indecisos, não o dos fiéis.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλλιον
  choice: banco
  rationale: Designa um assento coletivo, em contraste com a cadeira individual e proeminente do falso profeta.
- source_word: καθέδρα
  choice: cadeira
  rationale: Mantém o contraste concreto entre o banco coletivo e o assento individual, sem acrescentar uma conotação técnica ou eclesiástica ausente do contexto imediato.
- source_word: πιστοί
  choice: fiéis
  rationale: Preserva tanto a ideia de pessoas que têm fé quanto a de sua fidelidade.
- source_word: ψευδοπροφήτης
  choice: falso profeta
  rationale: Equivalente direto e consagrado, transparente ao leitor moderno.
- source_word: διάνοια
  choice: entendimento
  rationale: Expressa a faculdade de pensar e discernir; evita restringir o termo a mera opinião ou a um estado emocional.
- source_word: δοῦλοι τοῦ Θεοῦ
  choice: servos de Deus
  rationale: Reproduz a relação de pertença e serviço indicada pelo grego, em linguagem digna e corrente.
- source_word: δίψυχοι
  choice: indecisos
  rationale: No contexto, descreve pessoas interiormente divididas e vacilantes. 'Indecisos' é natural em português, embora parte da imagem literal de 'duas almas' seja inevitavelmente atenuada.
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento dirigida ao interlocutor; a minúscula evita identificar além do que o trecho explicita.
theological_decisions:
- issue: Alcance da ação do falso profeta
  choice: “destrói o entendimento dos servos de Deus — o dos indecisos, não o dos fiéis”
  alternative: “destrói o entendimento dos servos de Deus, isto é, dos indecisos, mas não dos fiéis”
  rationale: 'Mantém a tensão sintática do grego: os indecisos continuam sendo apresentados como servos de Deus, ao mesmo tempo que são distinguidos dos fiéis quanto à vulnerabilidade ao falso profeta.'
- issue: Sentido de δίψυχοι
  choice: indecisos
  alternative: divididos interiormente / de ânimo dobre
  rationale: Escolha legível e contextual, sem transformar a vacilação descrita em uma categoria doutrinária mais precisa do que o texto oferece.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O diálogo foi pontuado para clareza, preservando a repetição narrativa do grego e o contraste entre o assento coletivo dos fiéis e a cadeira individual do falso profeta.
