  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/015.yaml
  text: 19. “How,” I say, “sir, can these things be? For you have said both these things are impossible.” “As these, then, are impossible, so also the spirits that are earthly are impossible and inert.
translation:
  language: pt
  text: '19. Eu disse: “Como podem essas coisas acontecer, senhor? Pois disseste que ambas são impossíveis.” Ele respondeu: “Assim como essas coisas são impossíveis, também os espíritos terrenos são impossíveis e inertes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento adequada ao diálogo, sem identificar necessariamente o interlocutor como o Senhor divino.
- source_word: ἀδύνατα / ἀδύνατά
  choice: impossíveis / impotentes
  rationale: No primeiro uso, o termo descreve coisas que não podem acontecer; no segundo, qualifica os espíritos como destituídos de poder. A variação em português preserva o sentido contextual, e a nota registra a repetição retórica do grego.
- source_word: ἐπίγεια
  choice: terrenos
  rationale: Mantém o contraste do contexto entre os espíritos provenientes do alto e os de caráter ou origem terrena.
- source_word: ἀδρανῆ
  choice: inativos
  rationale: Expressa a falta de ação ou eficácia indicada pelo adjetivo grego, sem acrescentar uma interpretação teológica.
theological_decisions:
- issue: Natureza dos “espíritos terrenos”
  choice: Manter a designação literal “espíritos terrenos”
  alternative: Explicitar como espíritos malignos, falsos ou demoníacos
  rationale: O trecho os caracteriza como impotentes e inativos, mas não os identifica aqui por uma categoria teológica mais específica; a tradução preserva essa formulação.
translation_notes:
  register: Português moderno, claro e digno, com construção dialogal natural. Conservou-se “disseste” para refletir a segunda pessoa singular do grego e o tom literário antigo sem tornar a frase obscura.
