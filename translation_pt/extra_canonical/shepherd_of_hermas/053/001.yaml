lexical_decisions:
- source_word: Ηὐφράνθην
  choice: Eu me alegrei
  rationale: Expressa de modo natural o aoristo passivo de sentido intransitivo, preservando a reação de alegria do narrador.
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento ao interlocutor; a inicial minúscula evita identificá-lo indevidamente com o Senhor divino.
- source_word: ἐπίλυσιν
  choice: explicação
  rationale: No contexto, designa o esclarecimento ou interpretação anteriormente apresentado; “explicação” é claro e idiomático em português.
- source_word: ἀκούσας
  choice: ao ouvir
  rationale: Reproduz naturalmente a relação temporal do particípio aoristo com o verbo principal.
