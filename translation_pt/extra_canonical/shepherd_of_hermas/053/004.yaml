base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/004.yaml
  text: “As to former ignorances,” he says, “God alone is able to give healing concerning them; for all authority is his. But now guard yourself, and the Lord, the Almighty—being full of compassion—will give healing for former ignorances, if from now on you do not defile your flesh or the spirit; for both are shared and cannot be defiled apart from one another. Therefore keep both pure, and you will live to God.”
translation:
  language: pt
  text: “Quanto aos erros anteriores cometidos por ignorância”, disse ele, “somente Deus pode conceder cura para eles, pois toda autoridade pertence a ele. Mas agora cuide de si mesmo, e o Senhor Todo-Poderoso, por ser cheio de compaixão, concederá cura para os erros anteriores cometidos por ignorância[a], se daqui em diante você não contaminar nem a sua carne nem o espírito. Pois ambos estão unidos e não podem ser contaminados separadamente. Portanto, mantenha ambos puros, e você viverá para Deus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras desde “Mas agora cuide de si mesmo” até “erros anteriores cometidos por ignorância” aparecem entre colchetes na edição grega utilizada, indicando incerteza textual.
    reason: Sinalizar ao leitor a delimitação editorial de uma passagem com atestação textual incerta.
lexical_decisions:
- source_word: ἀγνοημάτων
  choice: erros ... cometidos por ignorância
  rationale: Expressa atos ou faltas decorrentes de desconhecimento, evitando o pouco natural “ignorâncias” e sem reduzi-los simplesmente a pecados deliberados.
- source_word: ἴασιν δοῦναι
  choice: conceder cura
  rationale: Preserva a metáfora terapêutica explícita de cura, em vez de substituí-la por “perdoar”.
- source_word: πολύσπλαγχνος
  choice: cheio de compaixão
  rationale: Transmite em linguagem corrente a ideia de profunda misericórdia ou compaixão.
- source_word: κοινά
  choice: estão unidos
  rationale: No contexto, indica que carne e espírito estão intimamente vinculados ou compartilham a mesma condição; “são comuns” seria obscuro em português.
- source_word: ζήσῃ τῷ Θεῷ
  choice: viverá para Deus
  rationale: Mantém a orientação dativa da vida para Deus e soa natural em português bíblico moderno.
theological_decisions:
- issue: Relação entre carne e espírito na contaminação
  choice: “ambos estão unidos e não podem ser contaminados separadamente”
  alternative: “ambos são compartilhados” ou “ambos pertencem um ao outro”
  rationale: Comunica a inseparabilidade afirmada pelo texto sem definir metafisicamente como carne e espírito se relacionam.
- issue: Cura dos erros anteriores
  choice: Manter “cura” como metáfora
  alternative: Traduzir como “perdão” ou “remissão”
  rationale: O grego fala de cura e atribui sua concessão somente a Deus; trocar por linguagem estritamente jurídica resolveria indevidamente a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Carne” e “espírito” foram mantidos por serem termos centrais do argumento; “cuide de si mesmo” traduz de modo natural a exortação a guardar-se. A fala foi apresentada como uma única citação contínua, seguindo o segmento de leitura fornecido.
