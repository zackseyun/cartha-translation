base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/003.yaml
  text: “But if, Sir,” I say, “there has been some former ignorance before these words were heard, how will the man who has defiled his flesh be saved?”
translation:
  language: pt
  text: “Mas, senhor”, eu disse, “se antes houve alguma ignorância, antes que estas palavras fossem ouvidas, como será salvo o homem que contaminou a sua carne?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγονεν ἄγνοια προτέρα
  choice: antes... alguém pecou por ignorância
  rationale: A expressão indica uma falta anterior cometida em ignorância, e não mera ausência abstrata de conhecimento; a formulação explicita isso em português natural sem definir a natureza específica do pecado.
- source_word: πρὶν ἀκουσθῶσι τὰ ῥήματα ταῦτα
  choice: quando estas palavras ainda não tinham sido ouvidas
  rationale: Preserva a forma passiva e a referência temporal do grego, sem especificar indevidamente quem as ouviu.
- source_word: πῶς σωθῇ
  choice: como será salvo
  rationale: Mantém o vocabulário soteriológico direto e a força interrogativa do aoristo subjuntivo em uma construção idiomática portuguesa.
- source_word: ὁ μιάνας τὴν σάρκα αὐτοῦ
  choice: aquele que contaminou a própria carne
  rationale: “Contaminou” comunica a ideia de impureza expressa por μιαίνω e mantém “carne”, termo central na argumentação da seção.
- source_word: κύριε
  choice: senhor
  rationale: Aqui funciona como tratamento respeitoso dirigido ao interlocutor; a inicial minúscula evita identificá-lo automaticamente com o Senhor divino.
- source_word: φημί
  choice: perguntei
  rationale: Embora literalmente seja “disse”, o conteúdo é uma pergunta; “perguntei” produz diálogo natural e preserva a função discursiva.
theological_decisions:
- issue: Natureza de ἄγνοια
  choice: “pecou por ignorância”
  alternative: “houve ignorância anteriormente”
  rationale: O contexto imediato fala de “faltas cometidas em ignorância” (ἀγνοήματα), mas a tradução não identifica qual pecado ocorreu nem presume inocência moral completa.
- issue: Sentido de “carne”
  choice: Manter “carne” sem paráfrase
  alternative: “corpo”
  rationale: A seção articula a relação entre σάρξ e πνεῦμα; substituir por “corpo” poderia suavizar ou reconfigurar essa tensão antropológica.
- issue: Salvação após contaminação
  choice: Preservar como pergunta aberta
  alternative: Acrescentar linguagem de perdão ou arrependimento
  rationale: O versículo pergunta como tal pessoa será salva; a resposta pertence ao contexto seguinte e não deve ser antecipada.
translation_notes:
  register: Português moderno, digno e acessível, com pontuação de diálogo natural. Conserva os termos teologicamente carregados “salvo” e “carne”, enquanto torna idiomática a expressão grega sobre ignorância anterior.
