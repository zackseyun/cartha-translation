base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/002.yaml
  text: '“Listen now,” he says: “Keep this flesh of yours pure and undefiled, so that the spirit that dwells in it may bear witness to it, and your flesh may be justified. Watch lest it ever rise up in your heart that this flesh of yours is perishable, and you misuse it in some defilement. For if you defile your flesh, you will also defile the Holy Spirit; and if you defile the flesh, you will not live.”'
translation:
  language: pt
  text: “Escute agora”, diz ele. “Conserve esta sua carne pura e sem mancha, para que o espírito que habita nela dê testemunho a favor dela e sua carne seja justificada. Tenha cuidado para que não lhe venha ao coração que esta sua carne é perecível e para que você não faça mau uso dela em alguma impureza. Pois, se você contaminar sua carne, também contaminará o Espírito Santo; e, se contaminar a carne[a], não viverá.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz «a carne» neste ponto, mas a expressão é textualmente incerta; alguns entendem que a leitura pretendida seria «o Espírito».
    reason: τὴν σάρκα está assinalado como texto problemático na edição. A repetição após a afirmação de que contaminar a carne também contamina o Espírito Santo pode indicar uma dificuldade textual, sem que a tradução escolha uma emenda.
lexical_decisions:
- source_word: σάρξ
  choice: carne
  rationale: Mantém a concretude antropológica do grego e a ligação entre o corpo humano e o espírito que nele habita, sem reduzir o termo a uma ideia abstrata de natureza pecaminosa.
- source_word: ἀμίαντος / μιασμός / μιαίνω
  choice: sem mancha / impureza / contaminar
  rationale: Reproduz em português a rede semântica de pureza e profanação presente no original, com variação natural exigida pelo contexto.
- source_word: μαρτυρέω
  choice: dar testemunho em favor de
  rationale: Explicita o valor favorável do dativo αὐτῇ sem transformar o testemunho em aprovação automática.
- source_word: δικαιόω
  choice: ser considerada justa
  rationale: Preserva o sentido declarativo ou vindicatório do verbo e evita sugerir apenas uma transformação moral interior.
- source_word: παραχράομαι
  choice: tratar de modo impróprio
  rationale: Comunica o uso indevido ou abusivo da carne; a frase seguinte conserva a dimensão de contaminação.
- source_word: ἀναβαίνω ἐπὶ τὴν καρδίαν
  choice: vir ao coração o pensamento
  rationale: Expressa de modo natural o idiomatismo grego pelo qual uma ideia surge no íntimo da pessoa.
- source_word: οὐ ζήσῃ
  choice: não viverá
  rationale: Mantém a formulação concisa e a abertura do original quanto ao alcance físico, espiritual ou escatológico de ‘viver’.
theological_decisions:
- issue: Relação entre carne e espírito
  choice: Traduzir σάρξ como ‘carne’ e πνεῦμα como ‘espírito/Espírito Santo’, preservando sua distinção e solidariedade.
  alternative: Interpretar ‘carne’ como mera natureza pecaminosa ou substituir por ‘corpo’.
  rationale: O contexto trata a carne como aquilo em que o espírito habita e que deve ser guardado puro; a tradução não deve impor uma antropologia posterior.
- issue: Justificação da carne
  choice: ‘sua carne seja considerada justa’
  alternative: ‘seja purificada’, ‘seja salva’ ou ‘seja justificada’.
  rationale: A expressão escolhida torna δικαιωθῇ compreensível sem resolver indevidamente o mecanismo ou o sentido teológico preciso da justificação.
- issue: Identidade do espírito residente
  choice: Usar minúscula na primeira menção (‘o espírito que habita nela’) e maiúscula onde o texto diz explicitamente ‘o Espírito Santo’.
  alternative: Identificar desde a primeira menção o espírito residente como o Espírito Santo.
  rationale: O próprio trecho passa de πνεῦμα a πνεῦμα τὸ ἅγιον, mas a primeira expressão conserva alguma ambiguidade que não deve ser apagada.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por ‘você’ para conservar a interpelação direta e ampla legibilidade brasileira. A sintaxe foi moderadamente reorganizada para fluência, sem eliminar as repetições conceituais do original.
