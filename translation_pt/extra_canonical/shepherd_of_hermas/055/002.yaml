base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/002.yaml
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been corrupted from the truth; in them there is hope of repentance, by which they can live. Corruption, then, has hope of a certain renewal, but death has eternal destruction.”
translation:
  language: pt
  text: “Aquelas ovelhas que você viu sem saltar, mas pastando num só lugar, são as que se entregaram aos prazeres e aos enganos, mas não blasfemaram de modo algum contra o Senhor. Portanto, estão corrompidas, afastadas da verdade. Nelas há esperança de arrependimento, no qual podem viver.[a] A corrupção, pois, tem esperança de alguma renovação, mas a morte tem ruína eterna.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nessa esperança, podem viver”. O grego permite relacionar a expressão tanto à esperança quanto ao arrependimento.'
    reason: Preserva a ambiguidade sintática genuína de ἐν ᾗ.
lexical_decisions:
- source_word: τρυφαῖς
  choice: prazeres
  rationale: Expressa uma vida de satisfação indulgente e luxuosa em linguagem atual, sem restringir o termo apenas à riqueza material.
- source_word: ἀπάταις
  choice: enganos
  rationale: Preserva o sentido amplo de ilusões, fraudes ou seduções que desviam.
- source_word: κατεφθαρμένοι ... ἀπὸ τῆς ἀληθείας
  choice: se afastaram da verdade e se corromperam
  rationale: Torna natural em português a construção grega, conservando tanto o afastamento da verdade quanto o estado de corrupção.
- source_word: μετανοίας
  choice: arrependimento
  rationale: Mantém o sentido de mudança moral e retorno, sem acrescentar formulação denominacional.
- source_word: ἀνανεώσεώς τινος
  choice: alguma renovação
  rationale: Preserva a indefinição de τινος e a imagem de restauração possível.
- source_word: ἀπώλειαν ... αἰώνιον
  choice: ruína eterna
  rationale: Comunica perda e destruição definitiva sem impor uma descrição metafísica mais específica do que o grego oferece.
theological_decisions:
- issue: Referente de ἐν ᾗ em relação à esperança e ao arrependimento
  choice: no qual podem encontrar vida
  alternative: na qual podem viver
  rationale: A forma feminina pode ser relacionada gramaticalmente a “esperança” ou a “arrependimento”; o texto principal segue a ligação provável com o arrependimento, e a nota registra a ambiguidade.
- issue: Contraste entre corrupção e morte
  choice: a corrupção ainda tem esperança de alguma renovação, mas a morte traz ruína eterna
  alternative: a corrupção tem esperança de certa renovação, mas a morte tem destruição eterna
  rationale: Preserva o contraste teológico e retórico sem identificar explicitamente “morte” com uma doutrina posterior específica.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” coerente com a fala direta. A redação conserva o paralelismo entre corrupção, renovação, morte e ruína eterna.
