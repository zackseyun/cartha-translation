revisions:
- from: “Aquelas ovelhas que você viu sem saltar, mas pastando num só lugar, são as que se entregaram aos prazeres e aos enganos, mas não blasfemaram de modo algum contra o Senhor. Portanto, elas se afastaram da verdade e se corromperam. Para elas há esperança de arrependimento, no qual podem encontrar vida.[a] Assim, a corrupção ainda tem esperança de alguma renovação, mas a morte traz ruína eterna.”
  to: “Aquelas ovelhas que você viu sem saltar, mas pastando num só lugar, são as que se entregaram aos prazeres e aos enganos, mas não blasfemaram de modo algum contra o Senhor. Portanto, estão corrompidas, afastadas da verdade. Nelas há esperança de arrependimento, no qual podem viver.[a] A corrupção, pois, tem esperança de alguma renovação, mas a morte tem ruína eterna.”
