- from: 6. Esse pastor, então, recebia do jovem pastor as ovelhas que viviam de modo devasso e entregues aos prazeres, mas não saltitavam, e as lançava num lugar íngreme, cheio de espinhos e abrolhos. Por causa dos espinhos e abrolhos, as ovelhas não conseguiam se desembaraçar, mas [ficavam presas nos espinhos e abrolhos; assim,] presas, pastavam entre os espinhos e abrolhos. Sofriam terrivelmente, espancadas por ele; ele as impelia de um lado para outro e não lhes dava descanso algum. Aquelas ovelhas não conseguiam firmar-se de modo nenhum.[a]
  to: 6. Esse pastor, então, recebia do jovem pastor as ovelhas que viviam de modo devasso e entregues aos prazeres, mas não saltitavam, e as lançava num lugar íngreme, cheio de espinhos e abrolhos. Por causa dos espinhos e abrolhos, as ovelhas não conseguiam se desembaraçar, mas [ficavam presas nos espinhos e abrolhos; assim,] presas, pastavam entre os espinhos e abrolhos. Sofriam muito, açoitadas por ele; ele as impelia de um lado para outro e não lhes dava descanso algum. Aquelas ovelhas não estavam firmes de modo algum.[a]
  rationale: 'Revisão limitada a duas formulações: «açoitadas» explicita de modo mais próximo a ação de δέρω no cenário que menciona um chicote, e «não estavam firmes de modo algum» reproduz a predicação de οὐκ εὐσταθοῦσαν sem acrescentar uma noção de incapacidade. Mantêm-se a repetição, a imagem concreta, os colchetes e a nota de variante sem impor interpretação alegórica.'
