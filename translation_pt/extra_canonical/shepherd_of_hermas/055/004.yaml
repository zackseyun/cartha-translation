    issue: «não conseguiam firmar-se» para οὐκ εὐσταθοῦσαν
    rationale: A forma verbal descreve o estado das ovelhas («não estavam firmes/estáveis»), e não expressa explicitamente capacidade ou tentativa de se firmar. A alteração preserva melhor o aspecto e a ambiguidade da imagem.
  - severity: low
    issue: «espancadas» para δαιρόμενα
    rationale: É possível, mas «açoitadas» se ajusta mais especificamente ao chicote (μάστιγα) recém-descrito e ao sentido de δέρω, sem atribuir o ferimento aos espinhos.
