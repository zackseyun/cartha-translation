base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/004.yaml
  text: 6. This shepherd, then, took over the sheep from the shepherd who was a young man—those that were living wastefully and self-indulgently, but not skipping—and he cast them into a certain steep, thorny place full of thistles, so that, because of the thorns and thistles, the sheep were unable to disentangle themselves, but [were entangled in the thorns and thistles; these, then,] being entangled, grazed among the thorns and thistles. They suffered greatly, being torn by him; he drove them here and there and gave them no rest, and those sheep were not at all steady.
translation:
  language: pt
  text: 6. Esse pastor, então, recebia do jovem pastor as ovelhas que viviam de modo devasso e entregues aos prazeres, mas não saltitavam, e as lançava num lugar íngreme, cheio de espinhos e abrolhos. Por causa dos espinhos e abrolhos, as ovelhas não conseguiam se desembaraçar, mas [ficavam presas nos espinhos e abrolhos; assim,] presas, pastavam entre os espinhos e abrolhos. Sofriam muito, açoitadas por ele; ele as impelia de um lado para outro e não lhes dava descanso algum. Aquelas ovelhas não estavam firmes de modo algum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tinham estabilidade alguma”.'
    reason: A expressão grega pode descrever a falta de firmeza ou estabilidade das ovelhas; a alternativa conserva a formulação mais ampla.
lexical_decisions:
- source_word: σπαταλῶντα καὶ τρυφῶντα
  choice: viviam de modo devasso e entregues aos prazeres
  rationale: Reproduz a combinação entre vida dissipada/extravagante e indulgência luxuosa, sem reduzir os dois particípios a uma única ideia.
- source_word: σκιρτῶντα
  choice: saltitavam
  rationale: Mantém a imagem concreta do comportamento das ovelhas e a ligação com a classificação anterior no contexto.
- source_word: κρημνώδη
  choice: íngreme
  rationale: Expressa o terreno escarpado e perigoso de modo natural em português.
- source_word: ἀκανθώδη καὶ τριβολώδη
  choice: cheio de espinhos e abrolhos
  rationale: Preserva os dois tipos de vegetação nociva; 'abrolhos' é termo português tradicional e inteligível para plantas espinhosas.
- source_word: ἐταλαιπώρουν
  choice: sofriam terrivelmente
  rationale: Comunica a aflição intensa indicada pelo verbo e reforçada por λίαν.
- source_word: δαιρόμενα ὑπ' αὐτοῦ
  choice: espancadas por ele
  rationale: O verbo δέρω denota bater ou açoitar; 'espancadas' evita a leitura menos provável de que os espinhos simplesmente as rasgavam, pois o agente explícito é o pastor.
- source_word: οὐκ εὐσταθοῦσαν
  choice: não conseguiam firmar-se
  rationale: Conserva a imagem de falta de estabilidade física no terreno difícil, sem impor uma interpretação moral abstrata.
theological_decisions:
- issue: Natureza do castigo disciplinar imposto pelo pastor
  choice: Linguagem concreta de sofrimento e espancamento, sem explicar sua identidade ou finalidade nesta unidade
  alternative: Interpretar explicitamente o pastor como anjo do castigo e o sofrimento como disciplina para arrependimento
  rationale: O trecho descreve a ação alegórica, mas esta unidade não identifica diretamente o pastor nem explicita toda a interpretação. A tradução preserva a tensão narrativa sem acrescentar doutrina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “espinhos e abrolhos” foi mantida por refletir a insistência imagética do grego. Os colchetes reproduzem uma passagem textualmente assinalada na fonte fornecida.
