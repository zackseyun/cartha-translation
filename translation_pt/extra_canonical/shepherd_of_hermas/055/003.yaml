  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/003.yaml
  text: 5. Again we went on a little, and he shows me a great shepherd, savage in appearance, wearing a white goatskin, and he had a bag on his shoulders, and a very hard staff with knots, and a great whip. He had a very harsh look, so that I was afraid of him—such was his look.
translation:
  language: pt
  text: 5. Avançamos novamente um pouco, e ele me mostrou um grande pastor, como que selvagem na aparência, vestido com uma pele branca de cabra. Trazia uma bolsa sobre os ombros, um cajado muito duro e cheio de nós, e um grande chicote. Seu olhar era extremamente severo, de modo que tive medo dele — tal era o seu olhar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσεὶ ἄγριον τῇ ἰδέᾳ
  choice: de aparência quase selvagem
  rationale: Preserva o valor aproximativo de ὡσεὶ e traduz ἰδέα como aparência, sem afirmar que o pastor fosse literalmente selvagem.
- source_word: δέρμα αἴγειον λευκόν
  choice: uma pele branca de cabra
  rationale: Representa diretamente o material e a cor da veste.
- source_word: πήραν
  choice: uma bolsa
  rationale: Termo corrente e suficientemente amplo para a bolsa ou alforje levado ao ombro.
- source_word: ῥάβδον σκληρὰν λίαν καὶ ὄζους ἔχουσαν
  choice: um cajado muito duro e cheio de nós
  rationale: Mantém a intensidade de λίαν e a característica física dos nós da madeira.
- source_word: τὸ βλέμμα ... περίπικρον
  choice: Seu olhar era extremamente severo
  rationale: Expressa a intensidade incomum do olhar ameaçador em português natural, evitando a tradução pouco idiomática por 'amargo'.
- source_word: ὥστε φοβηθῆναί με αὐτόν
  choice: a ponto de me causar medo
  rationale: Reproduz a relação de resultado e o temor que o pastor inspirou no narrador.
