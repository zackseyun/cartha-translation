  text: And he says to me, “Do you see this shepherd?” “I do,” I say, “sir.”
translation:
  language: pt
  text: 'E ele me diz: “Você está vendo este pastor?” “Estou, senhor”, respondo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα
  choice: pastor
  rationale: No contexto da visão, designa literalmente quem cuida das ovelhas; “pastor” preserva também a ressonância figurada natural em português.
- source_word: Βλέπεις
  choice: Você está vendo
  rationale: O presente grego pergunta pela percepção imediata na cena; a forma progressiva soa natural em português e mantém esse valor.
- source_word: κύριε
  choice: senhor
  rationale: Aqui funciona como tratamento respeitoso dirigido ao interlocutor, sem exigir identificação divina; por isso foi mantido em minúscula.
- source_word: φημί
  choice: respondo
  rationale: Embora o verbo signifique literalmente “digo”, no diálogo ele introduz a resposta de Hermas; “respondo” é natural e não altera o conteúdo.
