base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/001.yaml
  text: '"Did I speak? Did I not always regard you as a goddess? Did I not always respect you as a sister? Why do you falsely accuse me, woman, of these wicked and unclean things?"'
translation:
  language: pt
  text: Eu falei? Não a considerei sempre como a uma deusa? Não a respeitei sempre como a uma irmã? Por que você, mulher, me acusa falsamente dessas coisas perversas e impuras?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησα
  choice: Eu disse isso?
  rationale: O aoristo interrogativo retoma a acusação anterior; “isso” torna natural em português a referência contextual implícita.
- source_word: ὡς θεὰν ἡγησάμην
  choice: como a uma deusa que a considerei
  rationale: Preserva a comparação explícita e o sentido de ter em alta estima, sem afirmar literalmente que ela fosse divina.
- source_word: ἐνετράπην
  choice: respeitei
  rationale: No contexto, o verbo expressa consideração respeitosa ou reverência; “respeitei” é claro e idiomático.
- source_word: καταψεύδῃ
  choice: me acusa falsamente
  rationale: O verbo significa alegar falsamente contra alguém, não apenas mentir de modo genérico.
- source_word: πονηρὰ ... καὶ ἀκάθαρτα
  choice: perversas e impuras
  rationale: Mantém os dois qualificativos, incluindo a dimensão moral de πονηρά e a impureza de ἀκάθαρτα.
theological_decisions:
- issue: Comparação da mulher a uma deusa
  choice: “como a uma deusa”
  alternative: “como se fosse uma deusa”
  rationale: A formulação conserva ὡς e evita transformar a estima comparativa em declaração de divindade.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” adequado à legibilidade brasileira ampla. As perguntas retóricas e o vocativo “mulher” foram preservados.
