base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/003.yaml
  text: '"Their souls will repent—those who have no hope, but have despaired of themselves and of their life. But you—pray to God, and he will heal your sins, and those of your whole household, and of all the holy ones."'
translation:
  language: pt
  text: “As almas deles se arrependerão — as quais não têm esperança, mas desesperaram de si mesmas e da própria vida. Mas você, ore a Deus, e ele curará os seus pecados, os de toda a sua casa e os de todos os santos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσουσιν
  choice: se arrependerão
  rationale: Mantém o futuro e o sentido normal de mudança interior e arrependimento, sem suavizar a afirmação incomum do texto.
- source_word: ἀπηγνώκασι
  choice: perderam a esperança
  rationale: Expressa em português corrente a ideia de chegar ao desespero ou deixar de esperar, preservando os complementos referentes a si mesmos e à própria vida.
- source_word: ἰάσεται
  choice: curará
  rationale: Preserva a metáfora explícita de cura aplicada aos pecados, em vez de substituí-la interpretativamente por ‘perdoará’.
- source_word: οἴκου
  choice: casa
  rationale: Pode abranger a família e o conjunto doméstico; ‘casa’ conserva essa amplitude no contexto antigo.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: É a forma portuguesa natural para os membros consagrados do povo de Deus, sem acrescentar uma definição denominacional.
theological_decisions:
- issue: A cura dos pecados
  choice: ele curará os seus pecados
  alternative: ele perdoará os seus pecados
  rationale: O grego emprega linguagem de cura, e não o verbo comum para perdão; a imagem teológica deve ser preservada.
- issue: Referente de ‘todos os santos’
  choice: todos os santos
  alternative: todos os cristãos
  rationale: A tradução mantém a designação do texto sem identificar de modo mais estreito quem está incluído.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O travessão conserva a retomada explicativa do grupo cujas almas se arrependerão; ‘Quanto a você’ reproduz a mudança enfática para o destinatário.
