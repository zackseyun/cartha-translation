review_pass:
  verdict: revise
  source_fidelity: A tradução preserva o futuro de μετανοήσουσιν e a metáfora de cura em ἰάσεται. Contudo, «deles que» não reproduz adequadamente o relativo plural οἵτινες, cujo antecedente é «as almas», e a formulação sobre ἀπηγνώκασι pode refletir mais precisamente o desespero de si mesmas e da própria vida.
  naturalness: O registro é claro e moderno, mas «— deles que» é pouco natural e cria uma retomada masculina discordante de «almas». «Desesperaram de si mesmas» é uma formulação portuguesa mais idiomática e mais próxima do valor do verbo grego do que «perderam a esperança em si mesmos».
  terminology: «Arrependerão», «curará», «casa» e «santos» são escolhas adequadas. «Casa» mantém apropriadamente a amplitude de οἶκος, e «santos» não impõe identificação denominacional.
  issues:
  - severity: medium
    issue: Retomada relativa com gênero e referente inadequados
    rationale: 'Em «As almas deles se arrependerão — deles que não têm esperança», «deles» não pode retomar naturalmente «almas» e introduz um masculino não presente no relativo οἵτινες. O grego caracteriza as almas: «as quais não têm esperança». '
  - severity: low
    issue: Formulação de ἀπηγνώκασι
    rationale: «Perderam a esperança em si mesmos» é possível, mas «desesperaram de si mesmas e da própria vida» exprime mais diretamente o sentido de ter desesperado de alguém/algo e preserva o paralelismo do grego.
  revised_text: “As almas deles se arrependerão — as quais não têm esperança, mas desesperaram de si mesmas e da própria vida. Mas você, ore a Deus, e ele curará os seus pecados, os de toda a sua casa e os de todos os santos.”
