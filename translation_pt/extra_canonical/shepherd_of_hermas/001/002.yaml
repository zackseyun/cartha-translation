  to: 'Ela riu e me disse: “O desejo do mal subiu ao seu coração. Ou será que você não considera mau que um desejo perverso suba ao coração de um homem justo? Isso é, sim, pecado — e pecado grave”, disse ela. “Pois o homem justo planeja o que é justo. Assim, ao planejar o que é justo, sua glória se firma nos céus, e, em tudo o que faz, ele tem o Senhor favorável.[a] Mas os que planejam o mal em seu coração atraem sobre si mesmos morte e cativeiro, sobretudo os que procuram garantir para si este mundo presente, orgulham-se de sua riqueza e não se apegam aos bens que estão por vir.”'
