base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/002.yaml
  text: She laughed and says to me, "Evil desire has risen up into your heart. Or does it not seem to you to be a wicked thing for a righteous man if evil desire rises into his heart? It is indeed a sin—and a great one, she says. For a righteous man plans what is righteous. Therefore, in planning what is righteous, his glory is established in the heavens, and he has the Lord readily reconciled in every matter of his. But those who plan evil in their hearts bring upon themselves death and captivity—especially those who secure this present age for themselves, who exult in their wealth, and who do not hold fast to the good things that are coming.
translation:
  language: pt
  text: 'Ela riu e me disse: “O desejo do mal subiu ao seu coração. Ou será que você não considera mau que um desejo perverso suba ao coração de um homem justo? Isso é, sim, pecado — e pecado grave”, disse ela. “Pois o homem justo planeja o que é justo. Assim, ao planejar o que é justo, sua glória se firma nos céus, e, em tudo o que faz, ele tem o Senhor favorável.[a] Mas os que planejam o mal em seu coração atraem sobre si mesmos morte e cativeiro, sobretudo os que procuram garantir para si este mundo presente, orgulham-se de sua riqueza e não se apegam aos bens que estão por vir.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tem o Senhor disposto a reconciliar-se com ele”; também: “propício”.'
    reason: εὐκατάλλακτον pode indicar alguém facilmente reconciliável, favorável ou propício. A nota preserva a amplitude do termo, enquanto o texto principal emprega uma formulação idiomática em português.
lexical_decisions:
- source_word: ἐπιθυμία τῆς πονηρίας / ἡ πονηρὰ ἐπιθυμία
  choice: o desejo do mal / um desejo perverso
  rationale: Mantém o sentido de desejo orientado para o mal, com variação natural em português sem restringi-lo necessariamente ao desejo sexual.
- source_word: βουλεύεται / βουλευόμενοι
  choice: pensa no / planejam
  rationale: O verbo abrange reflexão, intenção e deliberação; as escolhas preservam essa dimensão interior conforme o contexto.
- source_word: κατορθοῦται
  choice: se firma
  rationale: Expressa que a glória é estabelecida ou confirmada, sem a formulação menos natural de uma realização passiva literal.
- source_word: εὐκατάλλακτον
  choice: disposto a se reconciliar
  rationale: Preserva a linguagem relacional de reconciliação ou propiciação e evita reduzir o termo a mera benevolência.
- source_word: περιποιούμενοι
  choice: procuram garantir para si
  rationale: Reproduz a ideia de adquirir, assegurar ou preservar algo para si; no contexto, trata-se de fazer deste século presente a própria porção.
- source_word: τῶν ἀγαθῶν τῶν μελλόντων
  choice: os bens que estão por vir
  rationale: Mantém o contraste escatológico com o mundo presente e a amplitude de ἀγαθά como coisas boas ou bens futuros.
theological_decisions:
- issue: Pecado como desejo interior
  choice: “que um desejo perverso suba ao coração... Isso é... pecado”
  alternative: Traduzir como consentimento deliberado ou ato exterior
  rationale: O grego localiza explicitamente o desejo mau no coração e o chama de pecado; a tradução não acrescenta uma distinção ausente no texto.
- issue: Relação do justo com o Senhor
  choice: “encontra o Senhor disposto a se reconciliar com ele”
  alternative: “tem o Senhor favorável” ou “propício”
  rationale: Conserva a força de εὐκατάλλακτον, mas uma nota registra a amplitude possível do termo sem impor uma teoria específica de reconciliação.
- issue: “Este mundo presente” como objeto de aquisição
  choice: “procuram garantir para si este mundo presente”
  alternative: “amam este mundo” ou “acumulam bens neste mundo”
  rationale: Mantém a metáfora incomum do original, que fala de assegurar/adquirir o presente século, sem substituí-la por uma interpretação mais específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O discurso direto foi pontuado para leitura fluente. “Homem justo” foi mantido porque o grego usa ἀνήρ e se dirige especificamente a Hermas. A estrutura argumentativa e a tensão entre pensamento interior, pecado e favor divino foram preservadas.
