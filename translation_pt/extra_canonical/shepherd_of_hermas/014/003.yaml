base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/003.yaml
  text: 3. “And those that have cracks—who are they? These are the ones who harbor things against one another in their hearts and are not at peace among themselves, but have a face of peace; yet when they depart from one another, their evils remain in their hearts. These, then, are the cracks that the stones have.
translation:
  language: pt
  text: 3. “E quem são os que têm rachaduras? São os que guardam no coração coisas uns contra os outros e não vivem em paz entre si. Embora aparentem estar em paz, quando se afastam uns dos outros, suas maldades permanecem em seus corações. Essas, portanto, são as rachaduras que as pedras têm.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχισμάς
  choice: rachaduras
  rationale: No contexto da imagem das pedras, designa fissuras ou fendas; “rachaduras” preserva de modo natural a metáfora da construção.
- source_word: κατ᾿ ἀλλήλων ἐν ταῖς καρδίαις ἔχοντες
  choice: guardam no coração coisas uns contra os outros
  rationale: A expressão grega deixa implícito o objeto do ressentimento. A formulação portuguesa conserva essa abertura sem especificar “rancor”, “queixas” ou outra disposição particular.
- source_word: μὴ εἰρηνεύοντες ἐν ἑαυτοῖς
  choice: não vivem em paz entre si
  rationale: No contexto relacional, a expressão indica ausência de paz mútua, não apenas perturbação interior individual.
- source_word: πρόσωπον εἰρήνης ἔχοντες
  choice: aparentem estar em paz
  rationale: Expressa idiomaticamente a ideia de apresentar uma face ou aparência externa de paz.
- source_word: πονηρίαι
  choice: maldades
  rationale: Preserva o sentido moral amplo do plural grego sem reduzi-lo especificamente a ressentimentos ou pensamentos.
theological_decisions:
- issue: Natureza do conflito oculto
  choice: manter a formulação ampla “coisas uns contra os outros”
  alternative: “guardam rancor uns contra os outros”
  rationale: O grego não nomeia explicitamente rancor; a tradução evita resolver a indeterminação psicológica e moral do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A metáfora arquitetônica das pedras foi preservada, e a repetição de “coração” mantém a ênfase do original.
