base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/001.yaml
  text: “Do you want to know about those who are being cut down and thrown far from the tower? These are the sons of lawlessness; they believed in hypocrisy, and no wickedness departed from them. For this reason they have no salvation, because they are not fit for the building on account of their wicked deeds. Therefore they were cut down and thrown far away because of the anger of the Lord, because they provoked him.
translation:
  language: pt
  text: “Você quer saber quem são os que estão sendo despedaçados e lançados para longe da torre? São os filhos da iniquidade. Creram hipocritamente, e nenhuma maldade se afastou deles. Por isso, não têm salvação, pois não são úteis para a construção por causa de suas maldades. Portanto, foram despedaçados e lançados para longe por causa da ira do Senhor, pois o provocaram.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακοπτομένους / συνεκόπησαν
  choice: sendo despedaçados / foram despedaçados
  rationale: O verbo sugere cortar ou quebrar em pedaços; no contexto da imagem das pedras da torre, “despedaçar” preserva melhor a metáfora do que uma expressão aplicada a árvores.
- source_word: υἱοὶ τῆς ἀνομίας
  choice: filhos da injustiça
  rationale: Mantém o idiomatismo semítico de pertencimento ou caracterização. “Injustiça” comunica aqui oposição à retidão e à ordem de Deus, embora ἀνομία também possa ser traduzida por “transgressão da lei” ou “iniquidade”.
- source_word: ἐν ὑποκρίσει
  choice: com hipocrisia
  rationale: Expressa de modo natural o caráter insincero da fé declarada, sem acrescentar uma explicação ausente do grego.
- source_word: εὔχρηστοι εἰς οἰκοδομήν
  choice: próprios para a construção
  rationale: Preserva a imagem arquitetônica da torre e o sentido de adequação ou utilidade para a obra.
- source_word: πονηρία / πονηρίας
  choice: maldade / maldades
  rationale: 'A alternância entre singular e plural reflete o texto grego: primeiro, a maldade como realidade persistente; depois, suas manifestações concretas.'
- source_word: παρώργισαν
  choice: provocaram
  rationale: No contexto da ira do Senhor, significa provocar à ira; a formulação evita repetir desnecessariamente “ira” e conserva a relação causal.
theological_decisions:
- issue: Sentido de “não têm salvação”
  choice: não têm salvação
  alternative: não podem ser salvos
  rationale: A tradução conserva a afirmação nominal e direta do grego, sem transformá-la numa declaração mais ampla sobre possibilidade absoluta ou irreversibilidade.
- issue: Identificação dos “filhos da injustiça”
  choice: manter a designação metafórica sem explicação adicional
  alternative: pessoas entregues à injustiça
  rationale: A metáfora de filiação é significativa e não deve ser reduzida a uma paráfrase interpretativa.
- issue: Tempo verbal na descrição das pedras
  choice: presente na pergunta e passado na conclusão
  alternative: uniformizar tudo no presente ou no passado
  rationale: 'Segue a variação do grego: a visão é inicialmente descrita como ação em curso, e depois sua execução é recapitulada no passado.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe preserva o encadeamento argumentativo e a metáfora das pedras usadas na construção da torre.
