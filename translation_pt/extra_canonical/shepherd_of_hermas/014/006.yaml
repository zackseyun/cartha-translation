  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/006.yaml
  text: 6. And I answered her, “Lady, when then will they become fit for the building?” She said, “When their wealth that ensnares them has been cut away, then they will be useful to God. For just as a round stone, unless it is cut and casts off something from itself, cannot become square, so also those who are rich in this age, unless their wealth is cut away, cannot become useful to the Lord.
translation:
  language: pt
  text: '6. Então lhe perguntei: “Senhora, quando, pois, eles se tornarão adequados para a construção?” Ela respondeu: “Quando a riqueza que os seduz for cortada, então eles serão úteis a Deus. Pois, assim como uma pedra redonda não pode tornar-se quadrada se não for cortada e não desprender de si alguma coisa, também os ricos desta era não podem tornar-se úteis ao Senhor se a riqueza deles não for cortada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὔχρηστοι
  choice: apropriados / úteis
  rationale: No primeiro uso, a construção pede naturalmente “apropriados”; nos usos relativos a Deus e ao Senhor, “úteis” preserva o sentido funcional do termo grego.
- source_word: οἰκοδομήν
  choice: construção
  rationale: Mantém a imagem concreta da edificação da torre no contexto da visão.
- source_word: ὁ πλοῦτος ὁ ψυχαγωγῶν αὐτούς
  choice: a riqueza que os seduz
  rationale: ψυχαγωγέω pode indicar atrair, cativar ou desviar; “seduz” expressa aqui o poder moralmente enganador da riqueza sem acrescentar a imagem específica de uma armadilha.
- source_word: περικοπῇ
  choice: for cortada
  rationale: Preserva a metáfora de aparar a pedra, aplicada em paralelo à riqueza.
- source_word: ἐν τούτῳ τῷ αἰῶνι
  choice: deste mundo
  rationale: Forma portuguesa natural para a esfera da era presente, sem eliminar o contraste escatológico implícito.
theological_decisions:
- issue: Relação entre riqueza e utilidade para Deus
  choice: Manter a afirmação categórica e metafórica de que a riqueza precisa ser cortada
  alternative: Interpretar como mero desapego interior ou como obrigação explícita de renunciar a todos os bens
  rationale: O grego não explica o modo dessa perda nem restringe a declaração a uma atitude interior; a tradução preserva a tensão sem impor uma doutrina econômica específica.
translation_notes:
  register: Português moderno, claro e digno, com diálogo natural. A repetição de “cortada” foi mantida para conservar a correspondência retórica entre a pedra aparada e a riqueza removida.
