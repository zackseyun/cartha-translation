base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/004.yaml
  text: 4. “And the mutilated ones—these are those who have believed and have the greater part in righteousness, but have certain parts of lawlessness. For this reason they are mutilated and not whole.
translation:
  language: pt
  text: 4. Os mutilados são os que creram e estão, em sua maior parte, na justiça, mas têm certos aspectos de iniquidade. Por isso são mutilados e não são completos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεκολοβωμένοι / κολοβοί
  choice: estão incompletos
  rationale: O particípio descreve pedras truncadas, cortadas ou privadas de alguma parte. “Incompletos” preserva a metáfora e se aplica naturalmente às pessoas simbolizadas, sem sugerir necessariamente mutilação corporal.
- source_word: τὸ πλεῖον μέρος ἔχοντες ἐν τῇ δικαιοσύνῃ
  choice: têm a maior parte de sua vida na justiça
  rationale: 'A expressão grega é elíptica: literalmente, “têm a maior parte na justiça”. A inclusão de “de sua vida” explicita com leveza o sentido moral no contexto, evitando a formulação pouco natural de que pessoas possuem partes físicas na justiça.'
- source_word: τινὰ δὲ μέρη ἔχουσιν τῆς ἀνομίας
  choice: ainda conservam algumas partes de injustiça
  rationale: “Conservam” comunica que aspectos de conduta contrários à justiça permanecem neles; “injustiça” expressa ἀνομία em português corrente sem restringi-la à infração de uma lei codificada.
- source_word: ὁλοτελεῖς
  choice: íntegros
  rationale: O termo significa completos em todas as partes. “Íntegros” mantém tanto o contraste com as pedras incompletas quanto a dimensão moral do retrato.
theological_decisions:
- issue: Relação entre fé, justiça e injustiça remanescente
  choice: Manter que essas pessoas creram e vivem majoritariamente na justiça, embora conservem aspectos de injustiça.
  alternative: Interpretar a passagem como uma classificação definitiva de salvos e não salvos.
  rationale: O texto descreve simbolicamente sua condição e inadequação parcial, mas neste versículo não formula uma conclusão explícita sobre seu destino final. A tradução preserva essa tensão.
- issue: Sentido de ἀνομία
  choice: injustiça
  alternative: iniquidade; transgressão da lei
  rationale: “Injustiça” produz o contraste lexical claro com δικαιοσύνη e permanece acessível, enquanto “transgressão da lei” poderia impor uma especificidade jurídica não exigida pelo contexto.
translation_notes:
  register: Português moderno, digno e acessível, com a imagem das pedras preservada por “incompletos” e “íntegros”. A repetição de “partes” reflete deliberadamente μέρος/μέρη no grego e sustenta a lógica da metáfora.
