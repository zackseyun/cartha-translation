base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/005.yaml
  text: 5. “And the white and round ones that do not fit into the building—who are they, Lady?” She answered me, saying, “How long will you be foolish and without understanding, asking about everything and understanding nothing? These are those who have faith, but also have the wealth of this age. When affliction comes, because of their wealth and their business dealings they deny their Lord.”
translation:
  language: pt
  text: '5. “E as pedras brancas e redondas, que não se ajustam à construção — quem são elas, Senhora?” Ela me respondeu: “Até quando você é insensato e sem entendimento, perguntando sobre tudo e não compreendendo nada? São os que têm fé, mas também possuem a riqueza desta era. Quando vem a aflição, negam seu Senhor por causa de sua riqueza e de seus negócios.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λευκοὶ καὶ στρογγύλοι
  choice: brancas e redondas
  rationale: Preserva diretamente as características das pedras na visão alegórica.
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: que não se ajustam à construção
  rationale: Expressa a ideia concreta de não se encaixarem ou servirem na estrutura em construção.
- source_word: μωρὸς ... καὶ ἀσύνετος
  choice: insensato e sem entendimento
  rationale: Mantém os dois qualificativos distintos sem recorrer a linguagem excessivamente coloquial ou ofensiva.
- source_word: πλοῦτον τοῦ αἰῶνος τούτου
  choice: a riqueza desta era
  rationale: Preserva αἰών como 'era', evitando reduzir a expressão apenas ao mundo material, embora este esteja implicado.
- source_word: θλῖψις
  choice: aflição
  rationale: Termo amplo que conserva a possibilidade de pressão, sofrimento ou tribulação.
- source_word: πραγματείας
  choice: negócios
  rationale: No contexto da riqueza, refere-se naturalmente a atividades ou empreendimentos comerciais.
- source_word: ἀπαρνοῦνται
  choice: negam
  rationale: Reproduz de modo claro a rejeição ou negação do Senhor sob pressão.
theological_decisions:
- issue: Relação entre fé e riqueza
  choice: “têm fé, mas também possuem a riqueza desta era”
  alternative: “creem, porém são ricos neste mundo”
  rationale: 'Mantém a tensão do texto: a fé é afirmada, mas a riqueza constitui um vínculo que leva à negação na aflição, sem decidir antecipadamente a autenticidade ou o caráter salvífico dessa fé.'
- issue: Identidade de κύριος em “seu Senhor”
  choice: Senhor, com inicial maiúscula
  alternative: senhor
  rationale: O contexto cristão e o ato de negá-lo indicam referência ao Senhor confessado pelos fiéis, sem acrescentar ao texto um nome não expresso.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. A metáfora arquitetônica e a severidade da repreensão foram preservadas sem arcaísmo desnecessário.
