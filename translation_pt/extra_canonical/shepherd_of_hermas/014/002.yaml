base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/002.yaml
  text: '2. “And the others you saw—many lying there, not going into the building—these are the scabby ones: they came to know the truth, but did not remain in it, nor did they join themselves to the saints; therefore they are useless.'
translation:
  language: pt
  text: '2. “E os outros que você viu — muitos deles jazendo ali, sem entrar na construção — são os cobertos de crostas: chegaram a conhecer a verdade, mas não permaneceram nela nem se uniram aos santos; por isso, são inúteis.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: os que têm crostas
  rationale: Preserva a imagem concreta de pedras com uma superfície afetada por crostas ou aspereza, em vez de substituí-la diretamente por sua interpretação moral.
- source_word: κειμένους
  choice: caídos ali
  rationale: No contexto das pedras rejeitadas junto à torre, expressa de modo natural que estavam largadas no chão.
- source_word: μὴ ὑπάγοντας εἰς τὴν οἰκοδομήν
  choice: sem entrar na construção
  rationale: Reproduz a imagem arquitetônica e o sentido de não serem incorporados ao edifício.
- source_word: ἐγνωκότες τὴν ἀλήθειαν
  choice: chegaram a conhecer a verdade
  rationale: O perfeito grego indica conhecimento adquirido com relevância para a condição descrita.
- source_word: κολλώμενοι τοῖς ἁγίοις
  choice: se uniram aos santos
  rationale: Traduz o sentido forte de aderir ou vincular-se, mantendo 'santos' como designação comunitária dos fiéis.
- source_word: ἄχρηστοί
  choice: inúteis
  rationale: Mantém a avaliação funcional das pedras para a construção, sem acrescentar uma conclusão além da metáfora.
theological_decisions:
- issue: Identidade dos “santos”
  choice: manter “os santos” sem explicação interpretativa no corpo do texto
  alternative: explicitar como “os membros do povo santo” ou “os demais cristãos”
  rationale: O grego usa τοῖς ἁγίοις como designação dos integrantes da comunidade santa; conservar o termo evita restringir indevidamente sua referência.
- issue: Natureza da inutilidade
  choice: manter a afirmação metafórica “são inúteis”
  alternative: explicitar “não servem para a construção”
  rationale: O contexto torna a referência arquitetônica clara, e o texto grego preserva uma formulação absoluta que também carrega força moral.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e preservação da metáfora das pedras. O singular genérico inglês foi evitado porque o grego apresenta um grupo plural. “Crostas” é deliberadamente concreto, embora incomum, para manter a textura da imagem original.
