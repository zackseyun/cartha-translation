revisions:
- from: '2. “E os outros que você viu — muitos deles caídos ali, sem entrar na construção — são os que têm crostas: chegaram a conhecer a verdade, mas não permaneceram nela nem se uniram aos santos; por isso, são inúteis.”'
  to: '2. “E os outros que você viu — muitos deles jazendo ali, sem entrar na construção — são os cobertos de crostas: chegaram a conhecer a verdade, mas não permaneceram nela nem se uniram aos santos; por isso, são inúteis.”'
  rationale: A revisão elimina a implicação indevida de queda em «caídos» e torna mais fiel a imagem de pedras afetadas por crostas/sarna. Mantêm-se a metáfora arquitetônica, a referência não especificada aos «santos» e o registro moderno e legível.
