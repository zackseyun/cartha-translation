review_pass:
  verdict: revise
  source_fidelity: 'A estrutura e o sentido principal estão bem preservados: os que conheceram a verdade não permaneceram nela nem se apegaram aos santos, tornando-se inúteis. Contudo, «caídos» acrescenta a ideia de queda, ausente de κειμένους («jazendo/estando deitados»), e «os que têm crostas» enfraquece a caracterização de ἐψωριακότες, isto é, os afetados por sarna/crostas.'
  naturalness: O texto é claro e adequadamente moderno. «Muitos deles jazendo ali» reproduz κειμένους sem sugerir que tenham caído; «os cobertos de crostas» conserva a imagem física em português natural.
  terminology: «Verdade», «santos» e «inúteis» correspondem bem a ἀλήθεια, ἅγιοι e ἄχρηστοι. «Construção» mantém a imagem de οἰκοδομή. A formulação revista traduz mais precisamente a condição indicada por ἐψωριακότες sem alegorizá-la.
  issues:
  - severity: medium
    issue: «caídos ali» para κειμένους
    rationale: κειμένους significa «jazendo», «estando deitados» ou «postos ali»; não afirma que os objetos tenham caído. «Caídos» introduz um evento ou estado adicional.
  - severity: medium
    issue: «os que têm crostas» para ἐψωριακότες
    rationale: O particípio descreve os afetados por sarna/crostas, não meramente objetos que possuem crostas. «Os cobertos de crostas» preserva melhor a imagem e a força descritiva do grego.
  revised_text: '2. “E os outros que você viu — muitos deles jazendo ali, sem entrar na construção — são os cobertos de crostas: chegaram a conhecer a verdade, mas não permaneceram nela nem se uniram aos santos; por isso, são inúteis.”'
