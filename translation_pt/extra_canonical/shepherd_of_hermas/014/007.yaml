base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/007.yaml
  text: '7. “Learn first from yourself: when you were rich, you were useless; but now you are useful and beneficial for life. Become useful to God; for you yourself also are used from the same stones.”'
translation:
  language: pt
  text: '7. “Aprenda primeiro com o seu próprio caso: quando você era rico, era inútil; agora, porém, é útil e proveitoso para a vida. Tornem-se úteis para Deus! Pois você também provém dessas mesmas pedras.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego da frase final é difícil e pode estar textualmente corrompido. A forma preservada de χρᾶσαι não se encaixa com segurança na construção; a tradução segue o sentido sugerido pelo contexto e por «dessas mesmas pedras».
    reason: Assinala a dificuldade real da cláusula sem apresentar como certa uma emenda ou uma interpretação contextual específica.
lexical_decisions:
- source_word: ἀπὸ [δὲ] σεαυτοῦ πρῶτον γνῶθι
  choice: Aprenda primeiro com o seu próprio caso
  rationale: Expressa de modo natural o sentido de reconhecer ou aprender a partir da própria experiência; a partícula δέ é textualmente incerta e não exige representação explícita.
- source_word: ἄχρηστος / εὔχρηστος
  choice: inútil / útil
  rationale: Mantém o contraste lexical e a metáfora das pedras aptas ou não aptas para a construção.
- source_word: ὠφέλιμος τῇ ζωῇ
  choice: proveitoso para a vida
  rationale: Preserva a referência aberta de ζωή, sem especificar indevidamente se se trata da vida presente, da comunidade ou da vida eterna.
- source_word: εὔχρηστοι γίνεσθε τῷ Θεῷ
  choice: Tornem-se úteis para Deus
  rationale: Mantém o imperativo plural do grego e a ligação temática com εὔχρηστος.
- source_word: ἐκ τῶν αὐτῶν λίθων
  choice: uma dessas pedras
  rationale: Reproduz o sentido contextual de pertencimento ao grupo de pedras recém-descrito, em português idiomático.
theological_decisions:
- issue: Sentido de ζωή em ὠφέλιμος τῇ ζωῇ
  choice: para a vida
  alternative: para a vida eterna
  rationale: O grego não traz αἰώνιος; conservar a expressão sem qualificação evita resolver uma possível dimensão escatológica que permanece implícita.
- issue: Cláusula final textualmente difícil
  choice: Pois você mesmo também é uma dessas pedras
  alternative: Pois você mesmo também faz uso dessas mesmas pedras
  rationale: A forma transmitida χρᾶσαι normalmente seria um imperativo, mas essa leitura produz uma afirmação pouco coerente no contexto. A tradução principal segue o sentido contextual provável, enquanto a nota registra a dificuldade do texto grego.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” no discurso singular e plural verbal preservado em “Tornem-se”. A metáfora da utilidade das pedras é mantida. A nota explicita, sem sobrecarregar o texto principal, a anomalia da cláusula final.
