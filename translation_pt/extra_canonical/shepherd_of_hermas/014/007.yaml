review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz bem o contraste entre ἄχρηστος e εὔχρηστος, o plural de γίνεσθε e a abertura de τῇ ζωῇ. Contudo, a cláusula final não diz de modo direto que Hermas «é uma dessas pedras»: ἐκ τῶν αὐτῶν λίθων expressa proveniência («dessas mesmas pedras»), e o verbo χρᾶσαι é textualmente e sintaticamente difícil. Convém conservar a proveniência no texto e registrar a dificuldade sem converter a leitura contextual em afirmação textual segura.'
  naturalness: O português é claro, moderno e apropriado ao registro. «Aprenda primeiro com o seu próprio caso» é idiomático, e «Tornem-se úteis para Deus» mantém bem o imperativo plural. «Você também provém dessas mesmas pedras» é natural e preserva melhor a imagem e a preposição do grego.
  terminology: «Inútil/útil» preserva o contraste vocabular do original. «Proveitoso para a vida» é uma boa solução aberta para ὠφέλιμος τῇ ζωῇ e não introduz uma especificação escatológica ausente. A nota deve descrever χρᾶσαι como forma difícil, sem afirmar que uma reconstrução contextual é o sentido certo.
  issues:
  - severity: medium
    issue: A oração final foi vertida como «você mesmo também é uma dessas pedras».
    rationale: Essa redação elimina a preposição ἐκ («de, a partir de») e apresenta como explícita uma identificação que o texto grego transmitido não formula de modo inequívoco. A forma χρᾶσαι é problemática; uma tradução que indique proveniência, acompanhada de nota, preserva melhor tanto o contexto quanto a incerteza textual.
  - severity: low
    issue: A nota propõe «faça uso dessas mesmas pedras» como única alternativa literal relevante.
    rationale: Embora χρᾶσαι possa sugerir uma forma ligada a «usar», a construção inteira permanece anômala e provavelmente corrompida. É preferível explicar a dificuldade globalmente e indicar que a tradução principal acompanha o sentido contextual de proveniência, sem reduzir a questão a uma alternativa gramatical determinada.
  revised_text: '7. “Aprenda primeiro com o seu próprio caso: quando você era rico, era inútil; agora, porém, é útil e proveitoso para a vida. Tornem-se úteis para Deus! Pois você também provém dessas mesmas pedras.”[a]'
  revised_footnotes:
  - marker: a
    text: O grego da frase final é difícil e pode estar textualmente corrompido. A forma preservada de χρᾶσαι não se encaixa com segurança na construção; a tradução segue o sentido sugerido pelo contexto e por «dessas mesmas pedras».
    reason: Assinala a dificuldade real da cláusula sem apresentar como certa uma emenda ou uma interpretação contextual específica.
  revision_rationale: A revisão limita-se à frase final e à nota. «Provém dessas mesmas pedras» mantém a relação expressa por ἐκ e evita transformar uma inferência contextual em identificação explícita. O restante do texto preserva com fidelidade o grego e tem boa fluência em português.
