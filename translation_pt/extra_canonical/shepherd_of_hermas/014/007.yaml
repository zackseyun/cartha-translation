review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem o contraste entre «inútil» e «útil» e conserva adequadamente «proveitoso para a vida». Contudo, a cláusula final do texto principal («você mesmo também é uma dessas pedras») não traduz a forma grega preservada χρᾶσαι nem o sintagma ἐκ τῶν αὐτῶν λίθων; ela adota uma solução contextual sem a sinalizar no próprio enunciado. Como a forma final é difícil e possivelmente problemática na transmissão, é mais seguro traduzir o imperativo preservado e explicar a dificuldade em nota.
  naturalness: O português é claro, moderno e de registro adequado. «Aprenda primeiro com o seu próprio caso» é natural, embora «Aprenda primeiro com sua própria experiência» soe um pouco mais fluente. A alternância deliberada entre o singular «você» e o plural «Tornem-se» corresponde à mudança de número no grego.
  terminology: «Inútil/útil» preserva de modo eficaz ἄχρηστος/εὔχρηστος. «Proveitoso para a vida» mantém a abertura de ὠφέλιμος τῇ ζωῇ e não introduz a qualificação «eterna». «Úteis para Deus» é aceitável para εὔχρηστοι τῷ Θεῷ.
  issues:
  - severity: medium
    issue: A cláusula final foi convertida em uma identificação («é uma dessas pedras») que não está expressa no texto grego transmitido.
    rationale: χρᾶσαι é formalmente um imperativo, e ἐκ τῶν αὐτῶν λίθων significa literalmente algo como «dessas mesmas pedras»/«a partir dessas mesmas pedras». Embora a leitura contextual adotada pelo rascunho seja compreensível, ela não deve substituir silenciosamente a redação difícil do original.
  - severity: low
    issue: A nota apresenta a tradução contextual como principal e a leitura gramaticalmente mais direta apenas como alternativa.
    rationale: Diante de um texto difícil ou possivelmente corrompido, a tradução deve conservar a incerteza, sem afirmar como certo no texto principal um sentido reconstruído.
  revised_text: '7. “Aprenda primeiro com sua própria experiência: quando você era rico, era inútil; agora, porém, é útil e proveitoso para a vida. Tornem-se úteis para Deus! Pois você mesmo também faça uso dessas mesmas pedras.”[a]'
  revised_footnotes:
  - marker: a
    text: 'A frase final é difícil no grego transmitido. A forma χρᾶσαι é, em princípio, um imperativo: «faça uso» ou «utilize». No contexto, alguns entendem que o texto talvez pretenda dizer que Hermas também é utilizado ou tomado dentre as mesmas pedras; essa interpretação, porém, requer uma explicação ou correção da forma preservada.'
    reason: Registra a dificuldade textual e a possível leitura contextual sem substituir a redação transmitida por uma reconstrução não assinalada.
  revision_rationale: A revisão conserva as escolhas adequadas do rascunho, mas traduz a cláusula final conforme a forma preservada no grego e desloca para a nota a interpretação contextual incerta. Também ajusta levemente a abertura para maior fluência em português.
