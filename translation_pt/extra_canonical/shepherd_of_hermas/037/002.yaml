base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/002.yaml
  text: “How, lord,” I say, “is it a sister of these? For quick temper seems to me one thing, double‑mindedness another, and sorrow another.”
translation:
  language: pt
  text: “Como, senhor”, perguntei, “ela é irmã dessas duas? Pois me parece que a irritação é uma coisa, a mente dividida é outra, e a tristeza, outra.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: irritação
  rationale: Expressa a disposição de se irar prontamente, em linguagem natural e atual, sem restringir o sentido a um único acesso de raiva.
- source_word: διψυχία
  choice: indecisão
  rationale: Neste contexto, comunica a divisão interior e a hesitação associadas ao termo, evitando a formulação pouco natural “ânimo duplo”.
- source_word: λύπη
  choice: tristeza
  rationale: Equivalente direto e corrente para o estado de pesar aqui personificado como irmã das outras disposições.
- source_word: κύριε
  choice: senhor
  rationale: Mantém a forma respeitosa de tratamento do diálogo, sem exigir capitalização interpretativa.
theological_decisions:
- issue: Sentido de διψυχία
  choice: indecisão
  alternative: ânimo dividido / duplicidade
  rationale: A passagem distingue estados interiores; “indecisão” preserva o componente de hesitação sem introduzir a conotação moral mais específica de hipocrisia ou duplicidade.
translation_notes:
  register: Português moderno, claro e digno, com diálogo natural. A repetição contrastiva do grego foi preservada por “uma coisa... outra... outra”.
