  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/001.yaml
  text: “Remove sorrow from yourself,” he says, “for it is a sister of double‑mindedness and quick temper.”
translation:
  language: pt
  text: “Afaste de si a tristeza”, diz ele, “pois ela é irmã do ânimo dividido e da irascibilidade.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύπην
  choice: tristeza
  rationale: Expressa de modo direto e corrente a tristeza ou aflição interior indicada pelo termo grego, sem acrescentar uma causa específica.
- source_word: διψυχίας
  choice: ânimo dividido
  rationale: Preserva a imagem de uma pessoa interiormente dividida entre disposições ou lealdades, em vez de reduzi-la apenas a dúvida ou indecisão.
- source_word: ὀξυχολίας
  choice: ira repentina
  rationale: Comunica o sentido de irascibilidade pronta e explosiva presente no termo, em linguagem clara e digna.
theological_decisions:
- issue: Relação figurada entre a tristeza e os outros vícios
  choice: irmã do ânimo dividido e da ira repentina
  alternative: associada ao ânimo dividido e à irritabilidade
  rationale: Mantém literalmente a personificação e o parentesco figurado do original, sem explicar ou suavizar sua afirmação moral.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. A fala direta e o presente narrativo foram preservados.
