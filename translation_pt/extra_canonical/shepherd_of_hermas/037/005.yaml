base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/005.yaml
  text: “Listen,” he says. “Those who have never inquired about the truth nor sought concerning the divine, but have only believed, and are mixed up with business affairs and wealth and pagan friendships and many other affairs of this age—so all who devote themselves to these do not understand the parables of the divine; for they are darkened by these pursuits and are corrupted and become barren. Just as good vineyards, when they are neglected, become barren from thorns and various weeds, so also the people who have believed and fall into these many pursuits just mentioned are led astray from their understanding, and they understand nothing at all about righteousness. And even when they hear about the divine and the truth, their mind is occupied with their business, and they understand nothing at all.
translation:
  language: pt
  text: “Escute”, diz ele. “Os que nunca investigaram a verdade nem procuraram conhecer as coisas de Deus, mas apenas creram e se deixaram envolver por negócios, riquezas, amizades com pagãos e muitas outras ocupações desta era — todos os que se prendem a essas coisas não compreendem as parábolas a respeito de Deus. Essas atividades os obscurecem, os corrompem e os tornam improdutivos. Assim como boas vinhas, quando ficam abandonadas, tornam-se improdutivas por causa dos espinhos e das diversas ervas daninhas, assim também aqueles que creram, mas se envolvem nas muitas ocupações já mencionadas, são levados ao erro em seu entendimento e não compreendem absolutamente nada a respeito da justiça. Mesmo quando ouvem falar das coisas de Deus e da verdade, sua mente fica ocupada com seus negócios, e eles não compreendem absolutamente nada.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεότης / θεότητος
  choice: as coisas de Deus / referentes a Deus
  rationale: Neste contexto, o termo indica o âmbito das realidades divinas ou o conhecimento acerca de Deus, não uma formulação técnica sobre a natureza divina. A variação em português produz sentido natural sem impor terminologia dogmática posterior.
- source_word: πραγματεῖαι / πράξεις / πρᾶξις
  choice: negócios, ocupações, atividades
  rationale: O campo lexical abrange afazeres e interesses que absorvem a pessoa, incluindo negócios comerciais. A tradução varia conforme o contexto para manter clareza e evitar repetição artificial.
- source_word: φιλίαις ἐθνικαῖς
  choice: amizades com pagãos
  rationale: Expressa diretamente relações de amizade com gentios ou não cristãos, sem transformar o termo em referência moderna à etnia ou nacionalidade.
- source_word: κεχερσωμένοι / χερσοῦνται
  choice: como terra improdutiva / tornam-se improdutivas
  rationale: A imagem é a de terreno não cultivado e tomado por vegetação; a formulação mantém a metáfora agrícola e a aplica naturalmente às pessoas e às vinhas.
- source_word: ἀποπλανῶνται ἀπὸ τῆς διανοίας αὐτῶν
  choice: perdem o rumo em seu entendimento
  rationale: Preserva a ideia de desvio ou extravio mental sem sugerir simplesmente perda de inteligência.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Equivalente amplo e tradicional que conserva tanto a dimensão moral quanto a religiosa do termo.
theological_decisions:
- issue: Sentido de θεότης no discurso sobre busca, parábolas e ensino
  choice: coisas de Deus / referentes a Deus
  alternative: divindade
  rationale: “Divindade” em português pode soar como designação abstrata da essência divina ou como um ser divino. O contexto trata de compreender ensinamentos e realidades concernentes a Deus, por isso uma expressão relacional é mais precisa e acessível.
- issue: Descrição dos que “apenas creram”
  choice: manter a afirmação sem qualificar a fé como falsa ou salvadora
  alternative: interpretar como fé meramente nominal
  rationale: O grego contrasta crença inicial com falta de investigação e envolvimento excessivo nos assuntos desta era, mas não define sistematicamente a condição espiritual dessas pessoas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantém a fala direta, a repetição enfática de “não compreendem absolutamente nada” e a imagem agrícola central. O travessão organiza a longa construção grega sem alterar sua progressão argumentativa.
