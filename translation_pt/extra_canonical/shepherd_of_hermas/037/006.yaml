base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/006.yaml
  text: “But those who have the fear of God and inquire about the divine and the truth and have their heart toward the Lord quickly understand and comprehend everything spoken to them, because they have the fear of the Lord within themselves; for where the Lord dwells, there also is abundant understanding. Therefore cling to the Lord, and you will understand and comprehend all things.”
translation:
  language: pt
  text: Mas os que temem a Deus, investigam as coisas divinas e a verdade e mantêm o coração voltado para o Senhor entendem e compreendem mais depressa tudo o que lhes é dito, porque têm em si o temor do Senhor. Pois onde o Senhor habita, ali também há grande entendimento. Portanto, una-se ao Senhor, e você compreenderá e entenderá todas as coisas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβον ... θεοῦ / φόβον τοῦ κυρίου
  choice: temem a Deus / temor do Senhor
  rationale: Preserva o campo semântico de reverência e temor do grego, usando formulação bíblica natural em português.
- source_word: ἐρευνῶντες
  choice: investigam
  rationale: Expressa uma busca diligente, mais forte que mera curiosidade.
- source_word: περὶ θεότητος
  choice: as coisas divinas
  rationale: Neste contexto, θεότης aponta para aquilo que diz respeito a Deus; a formulação evita o sentido moderno mais abstrato de 'divindade'.
- source_word: τὴν καρδίαν ἔχοντες πρὸς τὸν κύριον
  choice: mantêm o coração voltado para o Senhor
  rationale: Reproduz de modo natural a orientação contínua do coração indicada pela construção grega.
- source_word: τάχιον
  choice: mais depressa
  rationale: Mantém o valor comparativo do advérbio no texto grego, sem transformá-lo em afirmação absoluta.
- source_word: νοοῦσι καὶ συνίουσιν
  choice: entendem e compreendem
  rationale: Conserva os dois verbos próximos do original, ainda que haja sobreposição semântica.
- source_word: σύνεσις πολλή
  choice: grande entendimento
  rationale: Comunica a abundância ou elevada medida de compreensão sem linguagem artificial.
- source_word: κολλήθητι
  choice: una-se
  rationale: Transmite o imperativo de apegar-se estreitamente ao Senhor em português corrente e digno.
theological_decisions:
- issue: Sentido de θεότης
  choice: as coisas divinas
  alternative: a divindade
  rationale: A opção escolhida preserva a referência ao âmbito de Deus sem sugerir uma investigação metafísica da essência divina que o contexto não exige.
- issue: Relação entre temor do Senhor, habitação do Senhor e entendimento
  choice: manter as afirmações em sequência causal, sem explicação adicional
  alternative: explicitar que o entendimento é concedido pelo Espírito ou resulta da piedade
  rationale: O grego associa essas ideias, mas não formula aqui uma doutrina detalhada do meio pelo qual o entendimento é dado; a tradução não deve resolver além do texto.
- issue: Força de κολλήθητι
  choice: una-se ao Senhor
  alternative: apegue-se ao Senhor
  rationale: '''Una-se'' conserva a ideia de vínculo estreito e evita que ''apegue-se'' soe apenas emocional, embora ambas sejam possíveis.'
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento por 'você' torna explícito o singular do imperativo e dos verbos finais, mantendo clareza para leitores comuns. A cadência permanece digna e próxima do paralelismo do original.
