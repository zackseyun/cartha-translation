base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/004.yaml
  text: “I, lord,” I say, “am senseless, and I do not understand these parables. For how can it wear away and then save? I do not understand.”
translation:
  language: pt
  text: “Eu, Senhor”, eu disse, “sou insensato e não entendo estas parábolas. Pois como ela pode desgastar e depois salvar? Não entendo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσύνετος
  choice: insensato
  rationale: Expressa a falta de compreensão reconhecida pelo narrador e mantém a ligação com οὐ συνίω, sem reduzir o termo a mera ignorância factual.
- source_word: παραβολὰς
  choice: parábolas
  rationale: É o equivalente corrente e formalmente próximo, adequado às comparações ou ensinamentos figurados mencionados no contexto.
- source_word: ἐκτρίβειν
  choice: expulsar
  rationale: No contexto imediato, o verbo se refere a fazer sair o Espírito Santo; “expulsar” conserva esse sentido mais claramente do que “desgastar”.
- source_word: πάλιν σῴζειν
  choice: por sua vez, salvar
  rationale: Mantém a formulação difícil e a tensão do grego, sem corrigir ou explicar silenciosamente a aparente contradição.
theological_decisions:
- issue: A aparente afirmação de que a tristeza tanto expulsa como salva
  choice: 'Preservar literalmente a tensão: “ela pode expulsar e, por sua vez, salvar”'
  alternative: Emendar ou interpretar o texto para dizer que a tristeza expulsa o Espírito Santo e depois o Espírito salva a pessoa
  rationale: O texto grego transmitido apresenta o mesmo sujeito implícito para os dois infinitivos e é textualmente ou conceitualmente difícil; a tradução não deve resolver a dificuldade por conjectura.
translation_notes:
  register: Português moderno, claro e digno, com diálogo pontuado de modo natural. O pronome “ela” retoma “a tristeza” do contexto anterior; a repetição de “não entendo/não compreendo” reproduz a insistência do grego sem soar mecânica.
