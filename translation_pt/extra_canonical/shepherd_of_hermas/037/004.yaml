revisions:
- from: Eu sou insensato, Senhor — respondi — e não entendo essas parábolas. Pois não compreendo como ela pode expulsar e, por sua vez, salvar.
  to: “Eu, Senhor”, eu disse, “sou insensato e não entendo estas parábolas. Pois como ela pode desgastar e depois salvar? Não entendo.”
  rationale: A revisão substitui a interpretação específica «expulsar» por «desgastar», mais próxima de ἐκτρίβειν e do audit trail inglês, e traduz πάλιν por «depois», preservando a sucessão paradoxal apresentada pelo texto sem resolvê-la. Também retém a repetição final explícita de «Não entendo», presente no grego.
