revisions:
- from: “Você é insensato, homem”, diz ele, “e não percebe que a tristeza é mais maligna do que todos os espíritos e a mais terrível para os servos de Deus? Mais do que todos os espíritos, ela destrói o ser humano, desgasta o Espírito Santo — e depois volta a salvar?”[a]
  to: “Você é insensato, homem”, diz ele, “e não percebe que a tristeza é mais perversa do que todos os espíritos e a mais terrível para os servos de Deus, e que, mais do que todos os espíritos, destrói o ser humano, desgasta o Espírito Santo e novamente salva?”[a]
  rationale: A revisão restabelece o escopo contínuo da pergunta no grego e conserva a ambiguidade paradoxal de «desgasta o Espírito Santo e novamente salva». Também ajusta «mais maligna» para «mais perversa», escolha mais corrente e semanticamente direta neste contexto.
