base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/003.yaml
  text: “You are senseless, man,” he says, “and do you not perceive that sorrow is more evil than all the spirits and most dreadful for the slaves of God, and that beyond all the spirits it destroys a person and wears away the Holy Spirit—and then saves again?”
translation:
  language: pt
  text: “Você é insensato, homem”, diz ele, “e não percebe que a tristeza é mais perversa do que todos os espíritos e a mais terrível para os servos de Deus, e que, mais do que todos os espíritos, destrói o ser humano, desgasta o Espírito Santo e novamente salva?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão «e novamente salva» reproduz a leitura grega e seu paradoxo. O interlocutor o retoma imediatamente: «Como pode desgastar e novamente salvar?»'
    reason: Sinaliza uma formulação deliberadamente difícil do texto sem resolver a tensão no corpo da tradução.
lexical_decisions:
- source_word: ἀσύνετος
  choice: insensato
  rationale: Expressa falta de entendimento ou discernimento e mantém a relação com οὐ νοεῖς sem recorrer a um insulto coloquial.
- source_word: λύπη
  choice: tristeza
  rationale: É o equivalente natural e abrangente no contexto; evita restringir o termo a depressão, luto ou mero abatimento.
- source_word: πνευμάτων
  choice: espíritos
  rationale: Preserva a linguagem espiritual explícita do texto e sua comparação entre a tristeza e os demais espíritos.
- source_word: δούλοις τοῦ θεοῦ
  choice: servos de Deus
  rationale: Fórmula portuguesa corrente para pessoas inteiramente sujeitas a Deus; comunica o sentido de δοῦλοι com dignidade e legibilidade.
- source_word: καταφθείρει
  choice: destrói
  rationale: Mantém a força do verbo, que indica arruinar ou corromper completamente.
- source_word: ἐκτρίβει
  choice: desgasta
  rationale: Reproduz a imagem forte de consumir pelo atrito e corresponde à formulação retomada na pergunta seguinte, sem substituir o verbo por uma interpretação teológica como “expulsa”.
- source_word: πάλιν σώζει
  choice: depois volta a salvar
  rationale: Conserva a leitura transmitida e seu paradoxo deliberadamente destacado pelo diálogo subsequente.
theological_decisions:
- issue: A afirmação de que a tristeza “desgasta o Espírito Santo”
  choice: Manter a formulação forte e concreta do grego
  alternative: Interpretar como “afasta” ou “expulsa o Espírito Santo”
  rationale: O texto emprega ἐκτρίβει e logo repete o verbo ao perguntar como a tristeza pode fazer isso e também salvar. A tradução não deve resolver antecipadamente a tensão pneumatológica.
- issue: O aparente paradoxo “e novamente salva”
  choice: Preservá-lo como pergunta retórica, conforme esclarecido pela resposta imediata do interlocutor
  alternative: Emendar, omitir ou parafrasear a expressão para eliminar a contradição
  rationale: A frase seguinte declara explicitamente a dificuldade de compreender como ela pode “desgastar e novamente salvar”; portanto, o paradoxo pertence ao texto e ao desenvolvimento argumentativo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantêm-se o discurso direto, a repetição enfática de “espíritos” e o contraste desconcertante do original. “Servos de Deus” segue o uso religioso amplamente reconhecível, enquanto “Você é insensato, homem” conserva a interpelação direta sem soar excessivamente arcaica.
