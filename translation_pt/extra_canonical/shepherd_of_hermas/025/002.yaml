base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/002.yaml
  text: 2. And immediately he sat beside me and says to me, “I have been sent by the most venerable angel, that I may dwell with you for the rest of the days of your life.”
translation:
  language: pt
  text: '2. Imediatamente, ele se sentou ao meu lado e me disse: “Fui enviado pelo anjo mais venerável para morar com você durante os dias que lhe restam de vida.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Imediatamente
  rationale: Reproduz de modo natural o valor temporal enfático do advérbio.
- source_word: παρεκάθισέν μοι
  choice: se sentou ao meu lado
  rationale: Expressa com clareza a ideia de sentar-se junto ao narrador.
- source_word: τοῦ σεμνοτάτου ἀγγέλου
  choice: do anjo mais venerável
  rationale: Preserva o superlativo e o sentido de dignidade e reverência de σεμνοτάτου, sem acrescentar uma identificação teológica.
- source_word: μετὰ σοῦ οἰκήσω
  choice: morar com você
  rationale: Mantém o sentido concreto e durativo de habitar na companhia de alguém, em português corrente.
- source_word: τὰς λοιπὰς ἡμέρας τῆς ζωῆς σου
  choice: durante os dias que lhe restam de vida
  rationale: Formulação idiomática que conserva a referência ao restante da vida do interlocutor.
theological_decisions:
- issue: Identidade e hierarquia do ‘anjo mais venerável’
  choice: Manter apenas ‘o anjo mais venerável’
  alternative: Explicitar sua identidade ou posição celestial
  rationale: O texto não identifica aqui esse anjo nem define precisamente sua relação com o mensageiro; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. O presente histórico λέγει foi vertido pelo passado narrativo ‘disse’, mais natural neste contexto em português.
