lexical_decisions:
- source_word: ἔγραψα οὖν
  choice: Assim, escrevi
  rationale: Οὖν liga a ação às instruções anteriores; “assim” expressa naturalmente essa consequência em português.
- source_word: τὰς ἐντολὰς
  choice: os mandamentos
  rationale: Mantém o sentido de instruções autoritativas e a terminologia estrutural da obra.
- source_word: τὰς παραβολάς
  choice: as parábolas
  rationale: Equivalente tradicional e claro para παραβολαί, preservando o título da seção literária.
- source_word: καθὼς ἐνετείλατό μοι
  choice: conforme ele me havia ordenado
  rationale: O mais-que-perfeito composto deixa claro que a ordem precedeu o ato de escrever, sem tornar a frase artificial.
