base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/001.yaml
  text: After I had prayed in the house and sat down on the couch, a certain man entered, glorious in appearance, in shepherd’s attire, wearing a white skin, and having a bag on his shoulders and a staff in his hand. And he greeted me, and I returned his greeting.
translation:
  language: pt
  text: Depois que orei em casa e me sentei no leito, entrou um homem de aparência gloriosa, vestido como pastor, envolto numa pele branca, com uma bolsa sobre os ombros e um cajado na mão. Ele me saudou, e eu retribuí a saudação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ οἴκῳ
  choice: em casa
  rationale: Expressão natural em português, preservando o sentido locativo sem exigir que se trate de uma casa específica.
- source_word: κλίνην
  choice: leito
  rationale: O termo pode indicar cama ou lugar para reclinar-se; “leito” mantém essa amplitude melhor que “sofá”.
- source_word: ἔνδοξος τῇ ὄψει
  choice: de aparência gloriosa
  rationale: Reproduz o caráter extraordinário e honroso da figura sem reduzir ἔνδοξος a mera beleza.
- source_word: σχήματι ποιμενικῷ
  choice: vestido como pastor
  rationale: Formulação corrente que comunica o aspecto ou traje pastoril, sem afirmar identidade além do que a cena inicialmente revela.
- source_word: δέρμα λευκόν
  choice: pele branca
  rationale: Mantém o sentido concreto de uma pele animal usada como veste; evita especificar uma espécie não indicada no grego.
- source_word: πήραν
  choice: bolsa
  rationale: Designa de modo compreensível a sacola de viagem ou alforje levado aos ombros.
- source_word: ῥάβδον
  choice: cajado
  rationale: No contexto pastoril, “cajado” é mais específico e natural que o genérico “vara”.
- source_word: ἠσπάσατο / ἀντησπασάμην
  choice: saudou / retribuí a saudação
  rationale: Expressa a reciprocidade marcada pelo prefixo ἀντι- de forma idiomática em português.
