  to: 7. Portanto, se, ao ouvi-las, vocês as guardarem, andarem nelas e as praticarem com coração puro, receberão do Senhor tudo o que ele lhes prometeu. Mas, se, ao ouvi-las, não se arrependerem, mas ainda acrescentarem aos seus pecados, receberão do Senhor o contrário. O Pastor, o anjo do arrependimento, ordenou que eu escrevesse todas essas coisas assim.
