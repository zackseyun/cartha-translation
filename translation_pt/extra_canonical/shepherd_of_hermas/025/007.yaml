base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/007.yaml
  text: 7. If then, having heard them, you keep them and walk in them and do them with a pure heart, you will receive from the Lord what he promised you; but if, having heard, you do not repent, but still add to your sins, you will receive from the Lord the opposite things. The Shepherd, the angel of repentance, commanded me to write all these things in this way.
translation:
  language: pt
  text: 7. Portanto, se, ao ouvi-las, vocês as guardarem, andarem nelas e as praticarem com coração puro, receberão do Senhor tudo o que ele lhes prometeu. Mas, se, ao ouvi-las, não se arrependerem, mas ainda acrescentarem aos seus pecados, receberão do Senhor o contrário. O Pastor, o anjo do arrependimento, ordenou que eu escrevesse todas essas coisas assim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξητε
  choice: as guardarem
  rationale: Preserva o sentido de observar e cumprir as instruções, com formulação bíblica natural em português.
- source_word: ἐν αὐταῖς πορευθῆτε
  choice: andarem nelas
  rationale: Mantém a metáfora ética do grego, compreensível no registro bíblico moderno.
- source_word: ἐργάσησθε αὐτάς
  choice: as praticarem
  rationale: Expressa a realização concreta dos mandamentos sem a rigidez de 'fazê-las'.
- source_word: ἐν καθαρᾷ καρδίᾳ
  choice: com o coração puro
  rationale: Reproduz de modo natural a expressão antropológica e moral do original.
- source_word: τὰ ἐναντία
  choice: o contrário
  rationale: Preserva a formulação deliberadamente geral do grego, sem especificar castigos não explicitados.
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: o anjo do arrependimento
  rationale: Tradução direta que mantém a identificação titular do Pastor.
theological_decisions:
- issue: Relação condicional entre obediência e promessa
  choice: manter explicitamente as duas condições e seus resultados
  alternative: atenuar a condição como mera evidência de fé
  rationale: O grego apresenta uma construção condicional direta; a tradução não deve resolver a tensão teológica por meio de explicação denominacional.
- issue: Conteúdo de 'o contrário'
  choice: deixar a consequência sem especificação
  alternative: traduzir como 'castigo' ou 'condenação'
  rationale: τὰ ἐναντία significa literalmente as coisas contrárias; explicitar uma modalidade de juízo iria além do texto.
- issue: μετανοήσητε
  choice: se arrependerem
  alternative: mudarem de atitude
  rationale: Arrependimento é equivalente corrente e adequado, preservando a dimensão moral e religiosa do termo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e formas amplamente internacionais. O plural de segunda pessoa foi vertido por 'vocês', evitando construções excessivamente arcaicas; conservaram-se as metáforas 'guardar' e 'andar nelas' por sua importância no discurso ético do texto.
