  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/005.yaml
  text: 5. But he answered me and says, “Do not be confounded, but be strengthened in my commandments, which I am about to command you. For I have been sent,” he says, “that I may show you again all the things you saw before, especially the main points that are beneficial for you. First of all, write my commandments and the parables; but the other things, as I show you, so you will write.” For this reason, he says, “I command you first to write the commandments and parables, so that you may read them readily at hand and be able to keep them.”
translation:
  language: pt
  text: '5. Ele, porém, me respondeu: “Não fique perturbado, mas fortaleça-se nos meus mandamentos, os quais estou prestes a lhe ordenar. Pois fui enviado”, disse ele, “para lhe mostrar novamente tudo o que você viu antes, sobretudo os pontos principais que são proveitosos para vocês. Antes de tudo, escreva os meus mandamentos e as parábolas; quanto às outras coisas, você as escreverá conforme eu as mostrar a você. Por isso”, disse ele, “ordeno que escreva primeiro os mandamentos e as parábolas, para que possa lê-los tendo-os à mão e possa guardá-los.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ συγχύννου
  choice: Não fique perturbado
  rationale: O verbo pode indicar confusão, desconcerto ou perturbação. A formulação escolhida expressa naturalmente o abalo emocional de Hermas no contexto sem reduzir o sentido à mera confusão intelectual.
- source_word: ἰσχυροποιοῦ
  choice: fortaleça-se
  rationale: Preserva a forma passiva/reflexiva do imperativo e a ideia de adquirir firmeza mediante os mandamentos.
- source_word: ἐν ταῖς ἐντολαῖς μου
  choice: nos meus mandamentos
  rationale: Mantém a preposição e a esfera na qual Hermas deve fortalecer-se, sem explicitação interpretativa adicional.
- source_word: τὰ κεφάλαια
  choice: os pontos principais
  rationale: Neste contexto, κεφάλαια designa os elementos centrais ou tópicos principais, não capítulos em sentido editorial moderno.
- source_word: σύμφορα
  choice: proveitosos
  rationale: Comunica o sentido de benéfico ou vantajoso em registro digno e corrente.
- source_word: τὰς παραβολάς
  choice: as parábolas
  rationale: Mantém o termo tradicional e formalmente correspondente, adequado às divisões posteriores da obra.
- source_word: ὑπὸ χεῖρα
  choice: à mão
  rationale: Reproduz de modo idiomático a expressão que indica disponibilidade imediata para consulta.
- source_word: φυλάξαι
  choice: guardá-los
  rationale: Conserva a amplitude do verbo, que pode envolver reter, observar e cumprir; evita restringi-lo explicitamente a apenas memorizar ou obedecer.
theological_decisions:
- issue: Relação entre os mandamentos do pastor e o fortalecimento de Hermas
  choice: “fortaleça-se nos meus mandamentos”
  alternative: “seja fortalecido por meus mandamentos”
  rationale: A escolha preserva de perto a construção grega sem definir se os mandamentos são instrumento, esfera ou fundamento do fortalecimento.
- issue: Identificação dos κεφάλαια com tudo o que foi visto antes
  choice: “isto é, os pontos principais”
  alternative: “especialmente os pontos principais”
  rationale: 'Aposição em grego favorece uma reformulação explicativa: ele tornará a mostrar o conteúdo anterior em seus pontos essenciais. Ainda assim, evita especificar doutrina ou interpretação não expressa no texto.'
- issue: Sentido de guardar os mandamentos e parábolas
  choice: “possa guardá-los”
  alternative: “possa cumpri-los”
  rationale: “Guardar” mantém a tensão semântica entre conservar o texto, observá-lo e colocá-lo em prática, enquanto “cumprir” estreitaria o sentido.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Empregou-se “você” para o singular e “vocês” para o plural, tornando visível a mudança do destinatário individual em σοι para o benefício comunitário expresso por ὑμῖν. A alternância narrativa entre passado e presente histórico foi suavizada para um fluxo natural, sem alterar o conteúdo.
