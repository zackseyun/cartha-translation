base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/004.yaml
  text: 4. While he was still speaking, his appearance was changed, and I recognized him, that he was the one to whom I had been entrusted, and immediately I was confounded, and fear seized me, and I was completely crushed with grief, because I had answered him so wickedly and foolishly.
translation:
  language: pt
  text: '4. Enquanto ele ainda falava, sua aparência mudou, e eu o reconheci: era aquele a quem eu havia sido confiado. Imediatamente, fiquei perturbado; o medo tomou conta de mim, e fiquei totalmente arrasado de tristeza, porque lhe havia respondido de maneira tão má e insensata.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠλλοιώθη ἡ ἰδέα αὐτοῦ
  choice: sua aparência mudou
  rationale: Expressa naturalmente a mudança perceptível de aspecto, sem especificar em que ela consistiu.
- source_word: ἐπέγνων
  choice: eu o reconheci
  rationale: O verbo indica reconhecimento ou identificação, não mero conhecimento.
- source_word: ᾧ παρεδόθην
  choice: aquele a quem eu havia sido confiado
  rationale: Preserva a voz passiva e a ideia de Hermas ter sido entregue aos cuidados dessa figura.
- source_word: συνεχύθην
  choice: fiquei perturbado
  rationale: No contexto, comunica forte desorientação e consternação sem sugerir apenas confusão intelectual.
- source_word: φόβος με ἔλαβεν
  choice: o medo tomou conta de mim
  rationale: Reproduz em português corrente a imagem idiomática de ser tomado pelo medo.
- source_word: ὅλος συνεκόπην ἀπὸ τῆς λύπης
  choice: fiquei totalmente arrasado de tristeza
  rationale: Mantém a intensidade corporal e emocional da expressão grega em linguagem natural.
- source_word: πονηρῶς καὶ ἀφρόνως
  choice: de maneira tão má e insensata
  rationale: Conserva tanto a avaliação moral de πονηρῶς quanto a falta de juízo indicada por ἀφρόνως.
theological_decisions:
- issue: Identidade daquele a quem Hermas foi confiado
  choice: 'manter a referência indireta: “aquele a quem eu havia sido confiado”'
  alternative: identificá-lo explicitamente como o Pastor ou anjo do arrependimento
  rationale: O versículo emprega referência anafórica e não explicita o título; a tradução não deve antecipar nem impor a identificação dada pelo contexto mais amplo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção fluente para leitores brasileiros. A intensidade emocional do grego foi preservada sem arcaísmos nem explicações acrescentadas.
