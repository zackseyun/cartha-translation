  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/003.yaml
  text: 3. I thought that he had come to test me, and I say to him, “Who then are you? For I,” I say, “know the one to whom I was entrusted.” He says to me, “Do you not recognize me?” “No,” I say. “I,” he says, “am the Shepherd to whom you were entrusted.”
translation:
  language: pt
  text: '3. Pensei que ele estivesse ali para me pôr à prova e lhe disse: “Então, quem é você? Pois eu sei a quem fui confiado.” Ele me perguntou: “Você não me reconhece?” “Não”, respondi. Ele disse: “Eu sou o Pastor a quem fui confiado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξα
  choice: Pensei
  rationale: Expressa naturalmente a percepção ou suposição do narrador, sem torná-la certeza.
- source_word: πάρεστιν
  choice: estivesse ali
  rationale: Conserva a ideia de presença contida no verbo, em português corrente.
- source_word: ἐκπειράζων
  choice: para me pôr à prova
  rationale: Reproduz o sentido de testar ou provar, sem a conotação necessariamente moral de tentar ao pecado.
- source_word: παρεδόθην
  choice: fui confiado
  rationale: No contexto, indica que Hermas foi entregue aos cuidados ou à autoridade do Pastor; a formulação preserva a voz passiva e evita especificar o agente não expresso.
- source_word: ἐπιγινώσκεις
  choice: reconhece
  rationale: A cena trata da identificação de alguém já conhecido, portanto 'reconhecer' é mais preciso que apenas 'conhecer'.
- source_word: ποιμήν
  choice: Pastor
  rationale: Mantém o título e a imagem central da obra; a inicial maiúscula sinaliza seu uso identificador nesta fala.
theological_decisions:
- issue: Identidade e função do Pastor
  choice: Manter apenas o título “Pastor”, sem explicação interpretativa.
  alternative: Identificá-lo explicitamente como anjo ou figura cristológica.
  rationale: O versículo não resolve sozinho sua identidade teológica; explicá-la aqui importaria uma conclusão externa e eliminaria a tensão narrativa.
- issue: Agente implícito de παρεδόθην
  choice: Usar a passiva “fui confiado”, sem nomear quem o confiou.
  alternative: Traduzir “Deus me confiou” ou “o anjo me confiou”.
  rationale: O grego omite o agente, e a tradução deve preservar essa indeterminação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. O diálogo conserva as repetições narrativas do grego quando relevantes, mas evita rigidez excessiva; usa-se “você” por legibilidade contemporânea e “Pastor” como título literário.
