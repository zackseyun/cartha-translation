    rationale: 'O grego diz ὁ ποιμὴν ᾧ παρεδόθης, dirigido a Hermas: “o Pastor a quem foste/confiado”. Como a tradução usa primeira pessoa no diálogo (“eu sei a quem fui confiado”), a resposta deve ser “a quem fui confiado”, não “a quem você foi confiado”. A forma atual introduz uma troca de referente e quebra a coerência da cena.'
