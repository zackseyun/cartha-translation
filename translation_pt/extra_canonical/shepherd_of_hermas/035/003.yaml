base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/003.yaml
  text: '“What kinds, Lord,” I say, “are the wickednesses from which we must exercise self‑control?” “Listen,” he says: “From adultery and fornication, from lawless drunkenness, from wicked luxury, from many foods and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying and slander and hypocrisy, resentment, and every blasphemy.'
translation:
  language: pt
  text: '“Que tipos de maldades são essas, Senhor”, perguntei, “das quais devemos nos abster?” Ele respondeu: “Escute: do adultério e da imoralidade sexual; da embriaguez desenfreada; do luxo perverso; da abundância de alimentos e do luxo da riqueza; da vanglória, da altivez e da arrogância; da mentira, da difamação e da hipocrisia; do ressentimento e de toda blasfêmia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποταπαί ... αἱ πονηρίαι
  choice: que tipos de maldade
  rationale: Reproduz naturalmente a pergunta pela natureza ou espécie dos males, mantendo o substantivo coletivo no singular idiomático em português.
- source_word: ἐγκρατεύεσθαι
  choice: nos abster
  rationale: No contexto, o domínio próprio se concretiza em evitar práticas más; “abster-se” comunica isso com clareza sem reduzir o sentido à mera moderação.
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: Termo abrangente e atual para conduta sexual ilícita, preservando a distinção em relação a μοιχεία, “adultério”.
- source_word: μεθύσματος ἀνομίας
  choice: embriaguez desenfreada
  rationale: Expressa uma embriaguez marcada por desregramento; evita a tradução excessivamente literal e pouco natural “embriaguez da ilegalidade”.
- source_word: τρυφῆς πονηρᾶς
  choice: luxo perverso
  rationale: Mantém a avaliação moral explícita de πονηρά e o sentido de vida luxuosa ou indulgente de τρυφή.
- source_word: ἐδεσμάτων πολλῶν
  choice: excesso de comida
  rationale: Traduz o sentido contextual de abundância excessiva de alimentos em português natural.
- source_word: πολυτελείας πλούτου
  choice: ostentação da riqueza
  rationale: Comunica o dispêndio luxuoso associado à riqueza; “ostentação” se ajusta à sequência de vícios sem confundi-la com a vanglória seguinte.
- source_word: καταλαλιᾶς
  choice: difamação
  rationale: Representa fala prejudicial contra outra pessoa; é mais clara ao leitor moderno do que “maledicência”.
- source_word: μνησικακίας
  choice: ressentimento
  rationale: Expressa a disposição de guardar ofensa ou rancor, sem acrescentar necessariamente uma ação de vingança.
- source_word: βλασφημίας
  choice: blasfêmia
  rationale: Preserva o termo religioso e moral amplo do grego, que pode envolver fala injuriosa contra Deus ou contra aquilo que é sagrado.
theological_decisions:
- issue: Alcance de πορνεία
  choice: imoralidade sexual
  alternative: fornicação
  rationale: A opção escolhida preserva a amplitude lexical do termo grego e evita limitá-lo silenciosamente a uma única forma de relação sexual ilícita.
- issue: Relação de ἐγκράτεια com os vícios enumerados
  choice: abster-se dessas práticas
  alternative: exercer autocontrole diante delas
  rationale: O contexto imediato define o autocontrole como não praticar o mal; “abster-se” torna a instrução inteligível sem introduzir uma teoria ascética específica.
- issue: Sentido de βλασφημία
  choice: blasfêmia
  alternative: calúnia
  rationale: Como καταλαλιά já designa fala contra outras pessoas, conservar “blasfêmia” mantém a possível dimensão religiosa e a amplitude do termo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência de lista preservada por ponto e vírgula. O tratamento “Senhor” conserva κύριε, e “Escute” mantém o imperativo singular do diálogo. A enumeração foi pontuada para clareza sem alterar seus itens.
