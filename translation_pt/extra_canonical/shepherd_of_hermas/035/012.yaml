base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/012.yaml
  text: “Therefore keep this commandment. If you do the good and do not exercise self‑control from it, you will live to God—and all who act in this way will live to God. And again, if you do not do the evil and exercise self‑control from it, you will live to God; and all will live to God—whoever keeps these commandments and walks in them.”
translation:
  language: pt
  text: 'Portanto, guarde este mandamento: se você fizer o bem e não se abstiver dele, viverá para Deus; e todos os que agirem assim viverão para Deus. Da mesma forma, se você não praticar o mal e se abstiver dele, viverá para Deus; e viverão para Deus todos os que guardarem estes mandamentos e andarem neles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: guarde
  rationale: Expressa observância contínua e fiel de um mandamento, em português natural.
- source_word: ἐγκρατεύσῃ ἀπ᾿ αὐτοῦ
  choice: se abstiver dele
  rationale: Neste contexto, ἐγκρατεύομαι com ἀπό significa refrear-se ou abster-se de algo; a formulação preserva o contraste deliberadamente paradoxal entre não se abster do bem e abster-se do mal.
- source_word: ζήσῃ τῷ θεῷ
  choice: viverá para Deus
  rationale: Mantém de perto o dativo grego e a formulação teológica do texto, sem decidir se o sentido é viver dedicado a Deus, diante dele ou em relação com ele.
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: andarem neles
  rationale: Conserva a metáfora ética bíblica de andar nos mandamentos, com concordância natural em português.
theological_decisions:
- issue: Sentido de ζῆν τῷ θεῷ
  choice: viver para Deus
  alternative: viver diante de Deus / ter vida em Deus
  rationale: A construção grega admite nuanças relacionais e teológicas. A tradução escolhida conserva a expressão tradicional e sua abertura sem impor uma interpretação soteriológica específica.
- issue: Relação entre guardar os mandamentos e viver para Deus
  choice: manter a condição tal como formulada
  alternative: explicitar como evidência, mérito ou resultado da salvação
  rationale: O original vincula diretamente a prática do bem e a abstinência do mal a viver para Deus, mas não explica aqui a mecânica teológica dessa relação; a tradução não a redefine.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” e preservação da repetição retórica do grego. “Da mesma forma” traduz καὶ πάλιν de modo fluente, marcando o segundo lado do paralelo.
