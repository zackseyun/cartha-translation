  - severity: medium
    issue: «Fraude» para ἀποστέρησις
    rationale: O termo grego se refere a privar ou defraudar injustamente outra pessoa. «Fraude» pode abranger engano em geral, já expresso separadamente por ἀπάτη; «privação injusta» conserva melhor a distinção.
