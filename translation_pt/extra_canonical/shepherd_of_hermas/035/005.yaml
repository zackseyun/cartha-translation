base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/005.yaml
  text: '“Are there still,” I say, “Lord, evil works?” “Indeed, there are many,” he says, “from which the slave of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil desire, deceit, vainglory, boastfulness, and whatever things are like these.”'
translation:
  language: pt
  text: '“Ainda há, Senhor, obras más?”, perguntei. “Sim, há muitas”, respondeu ele, “das quais o servo de Deus deve se abster: furto, mentira, privação injusta, falso testemunho, ganância, desejo mau, engano, vanglória, arrogância e tudo o que se assemelha a essas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι
  choice: se abster
  rationale: No contexto, o verbo designa exercer domínio próprio afastando-se de práticas más; ‘se abster’ expressa isso com clareza e naturalidade.
- source_word: κλέμμα
  choice: furto
  rationale: Refere-se ao ato ou produto de roubar; ‘furto’ conserva o sentido conciso da lista.
- source_word: ἀποστέρησις
  choice: fraude
  rationale: Indica privação injusta ou defraudação; ‘fraude’ é uma formulação abrangente e corrente, sem restringir indevidamente o modo da injustiça.
- source_word: πλεονεξία
  choice: ganância
  rationale: Expressa o impulso de obter ou possuir mais, frequentemente à custa de outros.
- source_word: κενοδοξία
  choice: vanglória
  rationale: Preserva a ideia de glória vã ou busca vazia de reconhecimento.
- source_word: ἀλαζονεία
  choice: arrogância
  rationale: Abrange pretensão, ostentação e presunção; ‘arrogância’ é natural e distingue o termo de ‘vanglória’.
- source_word: δοῦλον τοῦ θεοῦ
  choice: servo de Deus
  rationale: Embora δοῦλος possa significar ‘escravo’, ‘servo de Deus’ é uma expressão portuguesa digna e corrente para a relação religiosa aqui descrita, sem perder a ideia de sujeição.
theological_decisions:
- issue: Natureza da disciplina exigida por ἐγκρατεύεσθαι
  choice: deve se abster
  alternative: deve exercer domínio próprio
  rationale: A construção com ἀφ᾿ ὧν explicita afastamento dessas obras; a tradução evita sugerir mera moderação de males que devem ser inteiramente evitados.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O diálogo e a enumeração do grego foram preservados, sem acrescentar explicações doutrinárias.
