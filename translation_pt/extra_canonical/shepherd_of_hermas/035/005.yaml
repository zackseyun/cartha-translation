  source_fidelity: O conteúdo da lista corresponde de perto ao grego. Contudo, ἀποστέρησις designa mais especificamente a privação ou defraudação injusta de alguém do que «fraude» em sentido genérico.
  naturalness: A redação é clara e de registro adequado, mas a colocação dos vocativos e da fala introdutória pode seguir mais naturalmente a pontuação portuguesa do diálogo.
  terminology: «Servo de Deus», «furto», «ganância», «vanglória» e «arrogância» são escolhas adequadas. «Privação injusta» torna explícito o núcleo semântico de ἀποστέρησις sem recorrer a um jargão jurídico.
