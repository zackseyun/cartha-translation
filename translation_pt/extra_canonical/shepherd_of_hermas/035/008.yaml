  text: “And of the good things, Lord,” I say, “declare to me their power, so that I may walk in them and serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works of the good, which you must do and not exercise self‑control from.
translation:
  language: pt
  text: '“E, quanto às coisas boas, senhor”, perguntei, “mostre-me o poder delas, para que eu ande nelas e as sirva, a fim de que, praticando-as, eu possa ser salvo”. Ele respondeu: “Ouça também as obras boas, que você deve praticar e das quais não deve se abster”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύναμις
  choice: força
  rationale: Preserva o sentido amplo de capacidade, eficácia ou poder próprio das coisas boas, sem reduzi-lo a uma interpretação específica.
- source_word: πορευθῶ ἐν αὐτοῖς
  choice: ande nelas
  rationale: Mantém a metáfora ética semítica e cristã de conduzir a vida segundo determinadas virtudes.
- source_word: δουλεύσω αὐτοῖς
  choice: as sirva
  rationale: Reproduz a formulação incomum e enfática do grego, em vez de suavizá-la como mera dedicação.
- source_word: ἐργασάμενος αὐτά
  choice: praticando-as
  rationale: Expressa naturalmente a realização concreta das coisas boas.
- source_word: μὴ ἐγκρατεύεσθαι
  choice: sem se refrear
  rationale: No contexto, o verbo significa não exercer contenção diante do bem; esta formulação conserva o contraste com refrear-se do mal.
theological_decisions:
- issue: Relação entre prática do bem e salvação
  choice: “praticando-as, possa ser salvo”
  alternative: “por praticá-las, alcance a salvação”
  rationale: Segue a construção grega de possibilidade sem transformar a frase numa definição sistemática da causa ou do mecanismo da salvação.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” na fala direta. A metáfora “ande nelas” e a expressão incomum “as sirva” foram preservadas por serem significativas no texto-fonte; a última oração foi formulada com naturalidade para manter o contraste temático entre praticar o bem e refrear-se do mal.
