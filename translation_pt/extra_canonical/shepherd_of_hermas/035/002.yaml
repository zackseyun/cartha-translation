base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/002.yaml
  text: '“Make it known to me, Lord,” I say, “with respect to what things one must exercise self‑control, and with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard to what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather, do it. For if you exercise self‑control so as not to do the good, you commit a great sin; but if you exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore exercise self‑control from every wickedness, doing the good.”'
translation:
  language: pt
  text: '“Mostra-me, senhor”, digo eu, “a respeito de quais coisas é preciso abster-se e de quais não é preciso”. Ele diz: “Escute: abstenha-se do que é mau e não o pratique; mas não se abstenha do que é bom; antes, pratique-o. Pois, se você se abstiver de fazer o bem, cometerá um grande pecado; mas, se você se abstiver de praticar o mal, praticará grande justiça. Portanto, abstenha-se de toda maldade, praticando o bem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκρατεύου / ἐγκρατεύσῃ
  choice: exercer domínio próprio / conter-se / abster-se
  rationale: O campo semântico é o do autocontrole e da abstinência. A variação portuguesa conserva o paradoxo do original — conter-se diante do mal, mas não diante do bem — sem produzir uma formulação artificial.
- source_word: τὸ πονηρόν / πονηρίας πάσης
  choice: o mal / toda maldade
  rationale: Distingue a referência geral ao que é mau da formulação final que abrange toda forma de perversidade ou conduta má.
- source_word: ἐργάζῃ / ποίει
  choice: praticar / cometer
  rationale: “Praticar” expressa naturalmente a realização do bem e da justiça; com “pecado”, o português idiomático pede “cometer”, sem alterar a relação verbal do grego.
- source_word: δικαιοσύνην μεγάλην
  choice: grande justiça
  rationale: Mantém a formulação forte e concreta do grego, sem reinterpretá-la como mérito, virtude ou justificação.
- source_word: κύριε
  choice: senhor
  rationale: O vocativo respeitoso é mantido em minúscula para não identificar indevidamente o interlocutor com Deus ou Cristo.
theological_decisions:
- issue: Relação entre domínio próprio, pecado e justiça
  choice: Preservar a afirmação de que evitar o mal “praticará grande justiça” e deixar de fazer o bem “cometerá um grande pecado”.
  alternative: Atenuar para “faz algo muito justo” ou explicar em termos de mérito e salvação.
  rationale: O texto apresenta deliberadamente uma tensão moral forte. A tradução não deve enfraquecê-la nem impor uma estrutura doutrinária externa.
translation_notes:
  register: Português moderno, claro e digno, com discurso direto natural. A alternância entre “exercer domínio próprio”, “conter-se” e “abster-se” evita repetição mecânica, mas preserva o jogo retórico central do grego.
