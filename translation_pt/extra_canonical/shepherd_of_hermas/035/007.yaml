base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/007.yaml
  text: '“But the things from which you must not exercise self‑control,” he says, “but rather do them—listen: Do not exercise self‑control with regard to the good, but do it.”'
translation:
  language: pt
  text: '“Mas escute o que você não deve deixar de praticar: não se abstenha do bem; pratique-o”, ele diz.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι
  choice: abster-se
  rationale: No contexto, o verbo significa conter-se ou privar-se de determinada conduta. Em português, “abster-se” preserva com naturalidade o contraste entre evitar o mal e não deixar de fazer o bem.
- source_word: ποιεῖν / ποίει
  choice: praticar / pratique
  rationale: “Praticar” expressa a realização habitual do bem e mantém a repetição do verbo grego.
- source_word: τὸ ἀγαθόν
  choice: o bem
  rationale: Mantém a expressão substantivada e geral do grego, sem restringi-la a uma ação específica.
- source_word: ἄκουε
  choice: escute
  rationale: Imperativo direto, natural no português moderno e apropriado ao diálogo instrutivo.
theological_decisions:
- issue: A relação entre domínio próprio e prática do bem
  choice: Traduzir ἐγκρατεύεσθαι de modo uniforme como “abster-se” nesta unidade
  alternative: “exercer domínio próprio” ou “conter-se”
  rationale: O paradoxo do texto não condena o domínio próprio como virtude; ensina que ele deve ser dirigido contra o mal, não usado como pretexto para deixar de fazer o bem. “Abster-se” torna essa relação clara sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A estrutura dialogal e a repetição enfática do original foram preservadas.
