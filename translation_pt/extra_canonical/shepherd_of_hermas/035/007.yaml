  source_fidelity: 'O sentido central está preservado: o interlocutor não deve abster-se do bem, mas praticá-lo. Contudo, a abertura portuguesa atual torna a relação sintática entre «as coisas», «abster-se» e «praticar» desnecessariamente difícil e soa como construção calcada.'
  naturalness: «Quanto às coisas das quais você não deve se abster», disse ele, «mas deve praticar, escute» é pouco fluente em português moderno, sobretudo pela posição de «escute» e pela coordenação incompleta de «mas deve praticar».
  terminology: «Abster-se» é uma escolha adequada e consistente para ἐγκρατεύεσθαι neste contexto; «o bem» e «pratique-o» traduzem adequadamente τὸ ἀγαθόν e ποίει αὐτό.
