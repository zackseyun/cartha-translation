base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/004.yaml
  text: “These deeds are the most evil of all in the life of human beings. From these works, then, the slave of God must exercise self‑control; for the one who does not exercise self‑control from these is not able to live to God. Listen, then, also to the things that follow these.”
translation:
  language: pt
  text: Essas obras são as mais perversas de todas na vida humana. Portanto, o servo de Deus deve se abster dessas obras, pois quem não se abstém delas não pode viver para Deus. Ouça, então, também o que vem a seguir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔργα
  choice: obras
  rationale: Mantém o sentido concreto de atos ou práticas e a repetição lexical do grego.
- source_word: πονηρότατα
  choice: as mais perversas
  rationale: Reproduz o superlativo forte sem recorrer a uma formulação pouco natural em português.
- source_word: ἐγκρατεύεσθαι ἀπό
  choice: abster-se de
  rationale: Neste contexto, a construção indica refrear-se e manter-se afastado de práticas más; 'abster-se' é claro e idiomático.
- source_word: δοῦλον τοῦ θεοῦ
  choice: servo de Deus
  rationale: Expressão portuguesa digna e tradicional que preserva a relação de serviço e pertença indicada por δοῦλος.
- source_word: ζῆσαι τῷ θεῷ
  choice: viver para Deus
  rationale: Preserva o dativo de orientação ou dedicação sem especificar além do que o grego afirma.
- source_word: τὰ ἀκόλουθα τούτων
  choice: o que vem a seguir
  rationale: No fluxo discursivo, refere-se aos males subsequentes que serão enumerados; a formulação natural mantém essa referência aberta.
theological_decisions:
- issue: Sentido de ζῆσαι τῷ θεῷ
  choice: viver para Deus
  alternative: viver diante de Deus / viver em Deus
  rationale: O dativo permite nuance relacional ou de orientação. 'Para Deus' acompanha o uso recorrente da obra e evita introduzir uma união mística ou um cenário judicial não explicitados.
- issue: Força de δοῦλος
  choice: servo
  alternative: escravo
  rationale: '''Servo'' conserva a linguagem de submissão e serviço a Deus com naturalidade no registro religioso português; ''escravo'' salientaria sobretudo a condição jurídica antiga, que não é o foco imediato.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição de 'obras' foi mantida por corresponder ao encadeamento retórico do grego; 'abster-se' comunica a disciplina moral exigida sem linguagem excessivamente técnica.
