base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/006.yaml
  text: “Do these not seem to you to be evil?” “Very evil,” I say, “for the slaves of God.” “From all these the one who serves God must exercise self‑control. Exercise self‑control, then, from all these, that you may live to God and be enrolled with those who exercise self‑control from them. These, then, are the things from which you must exercise self‑control.
translation:
  language: pt
  text: “Você não acha que essas coisas são más?” “Sim, senhor”, respondi, “são muito más para os servos de Deus.” “Quem serve a Deus deve abster-se de todas elas. Portanto, abstenha-se de todas essas coisas, para que você viva para Deus e seja inscrito entre os que delas se abstêm. São essas, pois, as coisas das quais você deve abster-se.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκράτευσαι
  choice: abster-se / abstenha-se
  rationale: Neste contexto, o verbo indica domínio próprio manifestado em evitar males específicos. “Abster-se” produz português natural e preserva a regência com ἀπό (“de”).
- source_word: τοῖς δούλοις τοῦ θεοῦ
  choice: para os servos de Deus
  rationale: Mantém o sentido de δοῦλος em registro digno e corrente; aqui o plural designa os que pertencem e servem a Deus.
- source_word: τὸν δουλεύοντα τῷ θεῷ
  choice: quem serve a Deus
  rationale: Distingue o particípio verbal da expressão nominal anterior e soa natural em português.
- source_word: ζήσῃ τῷ θεῷ
  choice: viva para Deus
  rationale: Preserva o dativo θεῷ e sua formulação teológica aberta, sem o reduzir a “viver com Deus” ou “receber vida de Deus”.
- source_word: ἐγγραφήσῃ
  choice: seja inscrito
  rationale: Conserva a imagem de registro ou inclusão em uma lista, sem explicitar qual seria esse registro.
theological_decisions:
- issue: Sentido de ζῆν τῷ θεῷ
  choice: viver para Deus
  alternative: viver diante de Deus
  rationale: A formulação escolhida acompanha mais diretamente o dativo grego e mantém a tensão entre orientação da vida e condição espiritual.
- issue: Imagem de inscrição entre os abstinentes
  choice: seja inscrito entre os que delas se abstêm
  alternative: seja contado entre os que delas se abstêm
  rationale: “Inscrito” preserva a metáfora concreta de ἐγγράφω e evita transformar silenciosamente a frase em mera classificação.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade brasileira ampla. A repetição de “abster-se” foi mantida porque estrutura a exortação e reflete a repetição enfática do grego.
