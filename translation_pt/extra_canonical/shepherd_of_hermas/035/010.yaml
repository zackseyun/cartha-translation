base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/010.yaml
  text: '“Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the slaves of God from distresses; to be hospitable (for in hospitality one sometimes finds an opportunity for doing good); to oppose no one; to be quiet; to become lower than all people; to honor the elderly; to practice righteousness; to preserve the brotherhood; to endure insult; to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not to cast off those who have stumbled away from the faith, but to turn them back and make them cheerful; to admonish those who sin; not to oppress debtors and the needy; and if there is anything like these.'
translation:
  language: pt
  text: '“Depois, ouça o que se segue a estas coisas: servir às viúvas; cuidar dos órfãos e dos necessitados; libertar das aflições os servos de Deus; ser hospitaleiro (pois, na hospitalidade, às vezes se encontra uma oportunidade de fazer o bem); não se opor a ninguém; ser tranquilo; tornar-se mais necessitado do que todos; respeitar os idosos; praticar a justiça; preservar a fraternidade; suportar ofensas; ser paciente; não guardar ressentimento; encorajar os abatidos de alma; não rejeitar os que se afastaram da fé por terem tropeçado, mas fazê-los voltar e recobrar o ânimo; advertir os que pecam; não oprimir os devedores e os necessitados; e qualquer coisa semelhante a estas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπηρετεῖν
  choice: servir
  rationale: Expressa de modo direto o serviço prestado às viúvas, preservando o sentido prático do infinitivo grego.
- source_word: ἐπισκέπτεσθαι
  choice: cuidar de
  rationale: No contexto de órfãos e necessitados, indica visita atenta e assistência, não mera visita social.
- source_word: ἐξ ἀναγκῶν λυτροῦσθαι
  choice: libertar das aflições
  rationale: Preserva a ideia de resgatar ou livrar de situações de necessidade extrema sem especificar um mecanismo não indicado pelo texto.
- source_word: φιλόξενον
  choice: hospitaleiro
  rationale: Equivalente corrente e digno para a disposição de acolher estrangeiros ou hóspedes.
- source_word: ἐνδεέστερον γίνεσθαι
  choice: fazer-se menor
  rationale: Mantém a linguagem comparativa e ética de assumir posição humilde, sem reduzir o termo apenas a pobreza material.
- source_word: ἀδελφότητα
  choice: fraternidade
  rationale: Preserva a referência coletiva aos irmãos e aos vínculos entre eles em linguagem natural.
- source_word: μακρόθυμον
  choice: paciente
  rationale: Comunica a perseverança paciente diante de provocações; evita uma tradução excessivamente técnica.
- source_word: κάμνοντας τῇ ψυχῇ
  choice: abatidos de alma
  rationale: Retém a imagem da exaustão ou fraqueza interior e o registro espiritual do grego.
- source_word: ἐσκανδαλισμένους ἀπὸ τῆς πίστεως
  choice: os que se afastaram da fé por terem tropeçado
  rationale: Conserva tanto a noção de tropeço quanto o afastamento resultante, sem definir sua extensão teológica.
- source_word: εὐθύμους ποιεῖν
  choice: fazê-los ... recobrar o ânimo
  rationale: Expressa a restauração da coragem e da disposição interior em português idiomático.
- source_word: θλίβειν
  choice: oprimir
  rationale: Abrange pressão, aflição e tratamento severo, especialmente apropriado quanto a devedores e necessitados.
theological_decisions:
- issue: Identidade dos “servos de Deus” em ἐξ ἀναγκῶν λυτροῦσθαι τοὺς δούλους τοῦ θεοῦ
  choice: manter “servos de Deus” sem restringir o grupo
  alternative: interpretar especificamente como cristãos escravizados ou prisioneiros
  rationale: O texto não identifica a natureza precisa das aflições nem limita o resgate a escravidão jurídica ou prisão.
- issue: Condição dos que tropeçaram para longe da fé
  choice: descrever afastamento e retorno sem definir apostasia definitiva
  alternative: traduzir como pessoas que abandonaram completamente a fé
  rationale: A formulação grega admite tropeço que resulta em afastamento, mas o apelo à restauração aconselha preservar a tensão sem impor uma categoria dogmática.
- issue: ἀδελφότητα como grupo ou vínculo comunitário
  choice: “preservar a fraternidade”
  alternative: “preservar a irmandade” ou “manter unidos os irmãos”
  rationale: A opção mantém a ambiguidade entre a comunidade fraterna e o vínculo de fraternidade.
translation_notes:
  register: Português moderno, amplamente internacional, com legibilidade brasileira. A enumeração e os infinitivos foram preservados para refletir o caráter exortativo do original. O registro é digno e acessível, evitando arcaísmos e explicações confessionais.
