  to: '“Depois, ouça o que se segue a estas coisas: servir às viúvas; cuidar dos órfãos e dos necessitados; libertar das aflições os servos de Deus; ser hospitaleiro (pois, na hospitalidade, às vezes se encontra uma oportunidade de fazer o bem); não se opor a ninguém; ser tranquilo; tornar-se mais necessitado do que todos; respeitar os idosos; praticar a justiça; preservar a fraternidade; suportar ofensas; ser paciente; não guardar ressentimento; encorajar os abatidos de alma; não rejeitar os que se afastaram da fé por terem tropeçado, mas fazê-los voltar e recobrar o ânimo; advertir os que pecam; não oprimir os devedores e os necessitados; e qualquer coisa semelhante a estas.”'
