base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/001.yaml
  text: “I said to you,” he says, “that the things created by God are twofold; for self‑control is twofold as well. For with regard to some things one must exercise self‑control, and with regard to others one must not.
translation:
  language: pt
  text: “Eu lhe disse”, diz ele, “que as coisas criadas por Deus são de dois tipos; pois o domínio próprio também é de dois tipos. Em relação a algumas coisas, é preciso exercer domínio próprio; em relação a outras, não.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ κτίσματα τοῦ θεοῦ
  choice: as coisas criadas por Deus
  rationale: Expressa de modo natural o sentido amplo de κτίσματα sem restringi-lo a seres vivos ou a uma categoria específica de criaturas.
- source_word: διπλᾶ
  choice: de dois tipos
  rationale: No contexto, indica uma distinção em duas categorias, não algo literalmente duplicado.
- source_word: ἐγκράτεια / ἐγκρατεύεσθαι
  choice: domínio próprio / exercer domínio próprio
  rationale: Preserva a repetição e o vínculo lexical do grego, ao mesmo tempo que comunica a ideia de refrear-se em relação a certas condutas.
- source_word: δεῖ
  choice: é preciso
  rationale: Mantém o sentido impessoal de necessidade ou obrigação.
theological_decisions:
- issue: Alcance de τὰ κτίσματα τοῦ θεοῦ
  choice: as coisas criadas por Deus
  alternative: as criaturas de Deus
  rationale: A formulação escolhida conserva a abrangência e a leve estranheza da afirmação, evitando definir antecipadamente se o autor se refere a criaturas, ações ou realidades em geral.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A estrutura dialogal e a repetição retórica do original foram preservadas.
