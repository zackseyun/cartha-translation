revisions:
- from: “Você acha que essas coisas são boas?”, perguntou ele. “O que, Senhor, poderia ser melhor do que elas?”, respondi. “Então, siga esse caminho”, disse ele, “pratique essas coisas sem se refrear, e você viverá para Deus.”
  to: “Você acha que essas coisas são boas?”, perguntou ele. “Senhor, o que poderia ser melhor do que elas?”, respondi. “Então, siga-as e não se abstenha delas, e você viverá para Deus.”
  rationale: A revisão conserva o diálogo conciso e o registro acessível, ao mesmo tempo que restaura a referência plural às boas obras e exprime de modo mais fiel a ordem de não se abster delas.
