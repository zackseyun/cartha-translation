  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/011.yaml
  text: “Do these seem to you to be good?” “What, Lord, is better than these?” I say. “Go, then,” he says, “walk in them and do not exercise self‑control from them, and you will live to God.
translation:
  language: pt
  text: “Você acha que essas coisas são boas?”, perguntou ele. “Senhor, o que poderia ser melhor do que elas?”, respondi. “Então, siga-as e não se abstenha delas, e você viverá para Deus.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖ σοι
  choice: Você acha
  rationale: Expressa de modo natural a pergunta sobre a avaliação do interlocutor.
- source_word: Πορεύου ... ἐν αὐτοῖς
  choice: siga esse caminho
  rationale: Preserva a metáfora de conduta e caminhada sem produzir a formulação pouco natural 'ande nelas'.
- source_word: μὴ ἐγκρατεύου ἀπ᾿ αὐτῶν
  choice: pratique essas coisas sem se refrear
  rationale: Mantém o contraste central do mandato entre refrear-se do mal e não se refrear do bem, explicitando que as boas ações devem ser praticadas.
- source_word: ζήσῃ τῷ θεῷ
  choice: você viverá para Deus
  rationale: Reproduz a construção dativa e sua orientação teológica sem ampliar o sentido.
theological_decisions:
- issue: Sentido de viver para Deus
  choice: viverá para Deus
  alternative: viverá diante de Deus
  rationale: O dativo τῷ θεῷ é preservado de forma direta, sem resolver sua possível nuance relacional ou finalidade como simples vida na presença divina.
translation_notes:
  register: Português moderno, digno e acessível, com diálogo fluente. A repetição demonstrativa remete à lista de boas obras do contexto anterior.
