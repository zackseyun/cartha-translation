base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/009.yaml
  text: '“First of all: faith, fear of the Lord, love, concord, words of righteousness, truth, endurance—there is nothing better than these in the life of human beings. If someone keeps these and does not exercise self‑control from them, he becomes blessed in his life.'
translation:
  language: pt
  text: '“Antes de tudo: fé, temor do Senhor, amor, concórdia, palavras de justiça, verdade e perseverança. Nada é melhor do que essas coisas na vida dos seres humanos. Se alguém as guardar e não se abstiver delas, torna-se bem-aventurado em sua vida.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: fé
  rationale: Equivalente direto e natural, preservando o sentido religioso e ético do termo.
- source_word: φόβος κυρίου
  choice: temor do Senhor
  rationale: Mantém a expressão religiosa tradicional e a referência reverente do grego.
- source_word: ὁμόνοια
  choice: concórdia
  rationale: Expressa acordo e harmonia entre pessoas sem restringir o termo a mera opinião comum.
- source_word: ῥήματα δικαιοσύνης
  choice: palavras de justiça
  rationale: Reproduz a construção concreta do grego e preserva sua possível amplitude ética.
- source_word: ὑπομονή
  choice: perseverança
  rationale: Neste catálogo de virtudes, comunica constância paciente e firmeza de modo corrente em português.
- source_word: φυλάσσῃ
  choice: guardar
  rationale: Preserva a ideia de observar e manter essas virtudes, com linguagem bíblica ainda compreensível.
- source_word: μὴ ἐγκρατεύηται ἀπ᾿ αὐτῶν
  choice: não se refrear de praticá-las
  rationale: 'A formulação explicita em português o paradoxo contextual: não exercer contenção diante das coisas boas, sem alterar seu sentido.'
- source_word: μακάριος
  choice: feliz
  rationale: Equivalente claro para a condição favorecida ou bem-aventurada descrita no contexto da vida presente.
theological_decisions:
- issue: Sentido de φόβος κυρίου
  choice: temor do Senhor
  alternative: reverência ao Senhor
  rationale: A tradução formal preserva tanto a reverência quanto a força moral potencial de φόβος, sem decidir a tensão em favor de uma paráfrase.
- issue: Relação entre guardar virtudes e tornar-se μακάριος
  choice: será feliz em sua vida
  alternative: será bem-aventurado em sua vida
  rationale: O texto apresenta uma consequência ética na vida da pessoa; a tradução mantém essa relação sem introduzir uma afirmação técnica sobre justificação ou salvação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A enumeração foi pontuada para clareza, e a expressão incomum sobre não se refrear foi levemente explicitada à luz do contraste desenvolvido em todo o Mandamento 8.
