revisions:
- from: '“Antes de tudo: fé, temor do Senhor, amor, concórdia, palavras de justiça, verdade e perseverança. Nada há de melhor do que essas coisas na vida humana. Se alguém as guardar e não se refrear de praticá-las, será feliz em sua vida.”'
  to: '“Antes de tudo: fé, temor do Senhor, amor, concórdia, palavras de justiça, verdade e perseverança. Nada é melhor do que essas coisas na vida dos seres humanos. Se alguém as guardar e não se abstiver delas, torna-se bem-aventurado em sua vida.”'
  rationale: A revisão corrige o presente de γίνεται, preserva melhor μακάριος e torna a expressão sobre a não contenção mais próxima do grego e do contraste imediato entre abster-se do mal e não se abster do bem. Não são necessárias notas para este segmento.
