review_pass:
  verdict: revise
  source_fidelity: 'O texto verte com fidelidade o argumento grego: a extensão de μοιχεία à contaminação do corpo e à produção de imagens/representações, a ordem de afastamento em caso de persistência sem arrependimento, a participação no pecado e a possibilidade de arrependimento. A expressão τὰ ὁμοιώματα ποιῇ τοῖς ἔθνεσιν permanece semanticamente difícil; a revisão conserva essa abertura sem transformar a expressão em uma identificação categórica com idolatria.'
  naturalness: A revisão melhora a ordem da primeira frase e substitui a construção pouco natural “seja homem, seja mulher”, ligada a um destinatário plural, por “tanto homens como mulheres”. Também evita que a nota explique o trecho com mais certeza do que a formulação grega permite.
  terminology: “Adultério”, “contamina”, “participante do pecado” e “arrependimento” são escolhas adequadas e mantêm o registro moral-religioso do original. “Imagens à maneira dos gentios” dá melhor conta da relação comparativa sem eliminar a ambiguidade de ὁμοιώματα.
  issues:
  - severity: low
    issue: A construção “foi ordenado a vocês que permaneçam sós, seja homem, seja mulher” é gramaticalmente e estilisticamente irregular em português.
    rationale: O grego usa uma formulação distributiva para homem e mulher; em português, “tanto homens como mulheres” preserva o alcance sem conflito entre plural e singular.
  - severity: low
    issue: A nota a apresenta uma alternativa excessivamente ampla (“faz coisas semelhantes às dos gentios”) para uma expressão cujo núcleo é “imagens/representações”.
    rationale: τὰ ὁμοιώματα remete mais diretamente a imagens, semelhanças ou representações. Convém registrar a dificuldade interpretativa e a possível alusão cultual sem diluir esse núcleo lexical.
  - severity: low
    issue: A nota b acrescenta “reconciliação” como se fosse o sentido explicitamente expresso nesta frase.
    rationale: O contexto mais amplo associa a separação à possibilidade de arrependimento, mas o texto deste versículo diz diretamente apenas que pode haver arrependimento. A nota deve distinguir contexto de explicitação textual.
