base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/005.yaml
  text: “Not only,” he says, “is it adultery if someone defiles his flesh, but whoever makes images as the nations do is committing adultery. Therefore, even in such works, if someone persists and does not repent, keep away from him and do not live together with him; otherwise you too are a sharer in his sin. For this reason it was commanded you to remain by yourselves, whether man or woman, for in cases like these there can be repentance.
translation:
  language: pt
  text: “Não é adultério apenas quando alguém contamina a própria carne; quem faz imagens à maneira dos gentios também comete adultério.[a] Portanto, se alguém persistir em tais práticas e não se arrepender, afaste-se dele e não viva com ele; caso contrário, você também será participante do pecado dele. Por essa razão, foi ordenado a vocês que permaneçam sós, tanto homens como mulheres,[b] pois, em casos assim, pode haver arrependimento.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “faz imagens/representações à maneira dos gentios”. O sentido exato da expressão é debatido; no contexto, ela pode aludir a imagens cultuais.
    reason: Preserva o núcleo lexical de τὰ ὁμοιώματα e assinala a incerteza interpretativa sem identificá-lo de modo categórico com idolatria.
  - marker: b
    text: A expressão grega pode significar permanecer sem outra união. O contexto da seção relaciona essa orientação à possibilidade de arrependimento.
    reason: Esclarece ἐφ᾽ ἑαυτοῖς μένειν de forma contextual e cautelosa, sem apresentar a reconciliação como termo expresso nesta frase.
lexical_decisions:
- source_word: μοιχεία / μοιχᾶται
  choice: adultério / comete adultério
  rationale: Mantém a metáfora moral e religiosa explícita do grego, sem reduzi-la apenas à infidelidade conjugal física.
- source_word: μιάνῃ
  choice: contamina
  rationale: Expressa a ideia de profanação ou impureza moral de μιαίνω em linguagem natural e digna.
- source_word: τὰ ὁμοιώματα ποιῇ τοῖς ἔθνεσιν
  choice: faz imagens como os gentios
  rationale: Segue de perto a construção grega e preserva sua dificuldade interpretativa, em vez de substituir diretamente ‘imagens’ por ‘ídolos’ ou generalizar como ‘práticas’.
- source_word: ἀπέχου ἀπ᾽ αὐτοῦ
  choice: afaste-se dele
  rationale: Reproduz de modo idiomático a ordem de manter distância da pessoa que persiste sem arrependimento.
- source_word: μὴ συνζῆθι αὐτῷ
  choice: não viva com ele
  rationale: Mantém o sentido concreto de não continuar a convivência, coerente com o contexto conjugal do trecho.
- source_word: μέτοχος
  choice: participante
  rationale: Conserva a noção de partilha ou cumplicidade no pecado.
- source_word: ἐφ᾽ ἑαυτοῖς μένειν
  choice: permaneçam sós
  rationale: No contexto de separação conjugal, comunica permanecer sem outro cônjuge, evitando inserir no texto principal uma explicação mais específica do que a formulação grega.
theological_decisions:
- issue: Adultério em sentido ampliado
  choice: Conservar a linguagem de adultério para a fabricação de imagens
  alternative: Traduzir como ‘infidelidade a Deus’ ou ‘idolatria’
  rationale: O autor aplica deliberadamente o vocabulário de adultério além do ato sexual; explicitar uma interpretação apagaria a força e a tensão da formulação.
- issue: Separação e possibilidade de arrependimento
  choice: Traduzir a ordem como ‘permaneçam sós’
  alternative: ‘Não voltem a se casar’
  rationale: O contexto aponta para não contrair nova união enquanto permanece possível a reconciliação, mas a redação grega desta unidade é menos explícita; a nota esclarece sem sobretraduzir.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O discurso direto e as repetições argumentativas do original foram preservados, com leve ajuste sintático para fluidez.
