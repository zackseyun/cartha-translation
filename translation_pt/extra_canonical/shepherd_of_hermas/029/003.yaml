base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/003.yaml
  text: I say to him, “Sir, allow me to ask you a few things.” “Speak,” he says. “Sir,” I say, “if someone has a wife who is faithful in the Lord, and he finds her in some adultery, does the husband sin by living together with her?”
translation:
  language: pt
  text: 'Eu lhe digo: “Senhor, permita-me fazer-lhe algumas perguntas.” “Fale”, diz ele. Eu digo: “Senhor, se alguém tem uma esposa fiel no Senhor e a encontra em ato de adultério, o marido peca se vive com ela?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Forma respeitosa de tratamento dirigida ao interlocutor; conserva a dignidade do grego e a correspondência lexical, embora aqui não seja necessariamente um título divino.
- source_word: γυναῖκα ... πιστὴν ἐν Κυρίῳ
  choice: uma esposa fiel no Senhor
  rationale: Mantém a formulação cristã do original e a possível nuance de que ela seja crente, sem substituir 'fiel' por uma interpretação mais específica.
- source_word: εὕρῃ ἐν μοιχείᾳ τινί
  choice: a surpreende em algum adultério
  rationale: '''Surpreende'' expressa naturalmente o sentido de encontrar ou descobrir a esposa envolvida em adultério; ''algum'' preserva o indefinido τινί.'
- source_word: συνζῶν μετ᾿ αὐτῆς
  choice: se continuar vivendo com ela
  rationale: O particípio indica coabitação ou vida conjugal continuada; a redação portuguesa torna explícita a continuidade pressuposta pela pergunta.
theological_decisions:
- issue: Sentido de πιστή em relação à esposa
  choice: fiel no Senhor
  alternative: crente no Senhor
  rationale: A tradução literal preserva a tensão contextual entre sua condição declarada 'no Senhor' e o adultério descoberto, sem decidir se πιστή enfatiza fé cristã ou fidelidade pessoal.
- issue: Natureza de συνζῶν
  choice: continuar vivendo com ela
  alternative: manter relações conjugais com ela
  rationale: O grego fala amplamente de viver junto, não especificamente de relações sexuais; a tradução evita estreitar indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com diálogo natural. A repetição de “Senhor” e dos verbos de fala foi preservada por fazer parte da estrutura narrativa do original.
