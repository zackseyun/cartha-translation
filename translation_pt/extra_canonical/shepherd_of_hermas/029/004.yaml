base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/004.yaml
  text: “As long as he is ignorant,” he says, “he does not sin; but if the husband comes to know her sin, and the wife does not repent but persists in her fornication, and the husband lives together with her, he becomes guilty of her sin and a sharer in her adultery. "What then, sir," I say, "should the husband do, if the wife persists in this passion?" "Let him divorce her," he says, "and let the husband remain by himself; but if, after divorcing his wife, he marries another, he himself also commits adultery." "If then, sir," I say, "after the wife is divorced, she repents and wishes to return to her own husband, will she not be received?" "Indeed," he says, "if the husband does not receive her, he sins and brings a great sin upon himself; rather, the one who has sinned and is repenting must be received—but not repeatedly—for to the slaves of God repentance is one. Because of repentance, then, the man ought not to marry. This rule is laid upon both woman and man.
translation:
  language: pt
  text: '“Enquanto não sabe”, diz ele, “não peca. Mas, se o marido vier a saber do pecado dela, e a mulher não se arrepender, mas persistir em sua imoralidade sexual, e o marido continuar vivendo com ela, ele se torna culpado do pecado dela e participante de seu adultério.”


    “Então, senhor”, pergunto, “o que o marido deve fazer se a mulher persistir nessa conduta?”


    “Que ele se separe dela”, responde, “e permaneça sozinho. Mas, se, depois de se separar da mulher, ele se casar com outra, também comete adultério.”


    “Então, senhor”, pergunto, “se, depois de ele se separar dela, a mulher se arrepender e quiser voltar para o próprio marido, não deverá ser recebida?”


    “Certamente”, responde. “Se o marido não a receber, peca e traz sobre si um grande pecado. É necessário receber quem pecou e está arrependido — mas não repetidamente, pois, para os servos de Deus, há um só arrependimento. Portanto, por causa do arrependimento, o marido não deve se casar. Essa norma se aplica tanto à mulher como ao homem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Expressa a amplitude do termo grego no contexto, sem restringi-lo indevidamente a prostituição nem confundi-lo com o adultério mencionado em seguida.
- source_word: μοιχεία
  choice: adultério
  rationale: Mantém a distinção lexical e conceitual em relação a πορνεία.
- source_word: συνζάω
  choice: continuar vivendo com
  rationale: Reproduz a ideia de convivência conjugal contínua de modo natural em português.
- source_word: ἀπολύω
  choice: se separar de / deixar
  rationale: No contexto conjugal, comunica a ruptura da convivência sem impor terminologia jurídica moderna mais específica do que o texto exige.
- source_word: μετάνοια
  choice: arrependimento
  rationale: É a equivalência corrente e preserva tanto a mudança moral quanto a tensão da afirmação de que há um só arrependimento.
- source_word: πρᾶξις
  choice: norma
  rationale: Neste contexto, refere-se à disposição ou procedimento que vale igualmente para homem e mulher; 'norma' é claro e natural.
theological_decisions:
- issue: A afirmação de que há 'um só arrependimento'
  choice: 'Preservar literalmente a limitação: ''há um só arrependimento'''
  alternative: Explicar como uma única oportunidade de arrependimento pós-batismal ou suavizar para arrependimento sincero
  rationale: O texto mantém deliberadamente uma tensão disciplinar e teológica; a tradução não deve importar uma interpretação denominacional ou histórica específica.
- issue: Novo casamento após a separação
  choice: Manter a declaração direta de que o novo casamento constitui adultério
  alternative: Qualificar a declaração segundo exceções ou sistemas posteriores de direito matrimonial
  rationale: Nenhuma qualificação desse tipo aparece na unidade traduzida.
- issue: Razão para não contrair novo casamento
  choice: Traduzir como 'por causa da possibilidade de arrependimento'
  alternative: Traduzir apenas 'por causa do arrependimento'
  rationale: O contexto mostra que a permanência sem novo casamento deixa aberta a reconciliação caso o cônjuge culpado venha a se arrepender; a formulação explicita apenas essa relação contextual, sem alterar a norma.
translation_notes:
  register: Português moderno, digno e acessível, com diálogo fluente. Empregou-se 'senhor' em minúscula como forma respeitosa de tratamento ao interlocutor. Evitou-se linguagem jurídica excessivamente técnica e preservaram-se as afirmações rigorosas e as tensões teológicas do texto.
