    rationale: O grego tem διὰ τὴν μετάνοιαν, «por causa do arrependimento». A noção de possibilidade decorre do contexto, mas não deve ser acrescentada à tradução principal.
  - severity: low
    issue: Referente pouco definido em «depois de ser deixada»
    rationale: A formulação passiva não identifica claramente que a separação é realizada pelo marido mencionado no diálogo. Uma redação explícita melhora a clareza sem acrescentar sentido.
  - severity: low
    issue: «Não muitas vezes» é menos preciso
    rationale: No contexto da máxima sobre «um só arrependimento», «não repetidamente» reproduz melhor a restrição expressa no audit trail inglês e evita a sugestão de um número indefinido de ocasiões.
