  naturalness: O diálogo é fluente e de registro apropriado. Convém tornar explícito o referente de «depois de ser deixada», pois a passiva pode soar imprecisa; «depois de ele se separar dela» conserva a relação expressa no contexto.
  terminology: «Imoralidade sexual» para πορνεία e «adultério» para μοιχεία são escolhas defensáveis e mantêm a distinção lexical. «Não repetidamente» representa melhor a limitação de μὴ ἐπὶ πολύ no sentido transmitido pela tradição textual e pelo audit trail do que «não muitas vezes».
