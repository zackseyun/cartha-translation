base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/002.yaml
  text: '“For if this thought rises up upon your heart, you will transgress—and if other such evil things [do], you commit sin. For this thought is a great sin for a slave of God; and if anyone carries out this evil deed, he brings death upon himself. Look to yourself, then: keep away from this thought; for where modesty dwells, there lawlessness ought not to rise up upon the heart of a righteous man.”'
translation:
  language: pt
  text: '“Pois, se esse pensamento subir ao seu coração, você pecará; e, se outras coisas igualmente más também subirem ao seu coração, você cometerá pecado. Pois esse pensamento é um grande pecado para um servo de Deus; e, se alguém praticar esse ato mau, trará morte sobre si mesmo. Portanto, fique atento: mantenha-se afastado desse pensamento, pois, onde habita a dignidade moral, a transgressão da lei não deve subir ao coração de um homem justo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνθύμησις
  choice: pensamento
  rationale: Designa aqui um pensamento ou intenção interior que sobe ao coração; “pensamento” é natural e preserva o caráter mental do termo.
- source_word: διαμαρτήσεις
  choice: você transgredirá
  rationale: O verbo indica cometer uma falta ou transgressão; “transgredirá” mantém a força moral sem especificar além do grego.
- source_word: ἐργάζῃ / κατεργάζεται
  choice: cometerá / causará
  rationale: 'A tradução varia conforme o complemento: cometer pecado e produzir para si a morte. Essa diferenciação resulta em português natural.'
- source_word: Θεοῦ δούλῳ
  choice: para um servo de Deus
  rationale: “Servo” comunica adequadamente a condição de pertença e serviço expressa por δοῦλος, sem o ruído moderno de “escravo” neste registro exortativo.
- source_word: σεμνότης
  choice: dignidade moral
  rationale: O termo abrange respeitabilidade, pureza e seriedade moral. “Dignidade moral” preserva essa amplitude melhor que uma opção exclusivamente sexual como “modéstia”.
- source_word: ἀνομία
  choice: transgressão da lei
  rationale: Expressa o sentido de ausência ou violação da lei, mantendo a relação lexical com a norma moral sem reduzir o termo a maldade genérica.
- source_word: βλέπε οὖν σύ
  choice: Portanto, tenha cuidado
  rationale: A expressão é uma advertência enfática dirigida ao interlocutor; esta formulação é idiomática e conserva a força exortativa.
theological_decisions:
- issue: Relação entre pensamento, pecado e ato
  choice: Distinguir o pensamento que constitui grande pecado da obra má que traz a morte
  alternative: Tratar pensamento e ato como equivalentes em suas consequências
  rationale: O texto chama o pensamento de grande pecado, mas usa uma construção condicional distinta para a prática da obra má e sua consequência mortal; a tradução preserva essa tensão.
- issue: Sentido de θάνατον ἑαυτῷ κατεργάζεται
  choice: “causará a própria morte”
  alternative: “condena a si mesmo à morte”
  rationale: O grego afirma que a pessoa produz ou ocasiona morte para si, sem explicitar se a referência é física, espiritual ou escatológica; a formulação mantém essa ambiguidade.
translation_notes:
  register: Português moderno, corrente e digno, com tratamento por “você” para leitura ampla no Brasil. A sintaxe exortativa foi tornada natural sem suavizar a severidade moral do original. Não há notas, portanto não há marcadores no texto.
