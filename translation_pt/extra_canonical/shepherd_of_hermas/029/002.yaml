revisions:
- from: '“Pois, se esse pensamento subir ao seu coração, você transgredirá; e, se outros pensamentos igualmente maus subirem, você cometerá pecado. Porque esse pensamento é um grande pecado para um servo de Deus; e, se alguém praticar essa obra má, causará a própria morte. Portanto, tenha cuidado: mantenha-se longe desse pensamento, pois, onde habita a dignidade moral, a transgressão da lei não deve subir ao coração de um homem justo.”'
  to: '“Pois, se esse pensamento subir ao seu coração, você pecará; e, se outras coisas igualmente más também subirem ao seu coração, você cometerá pecado. Pois esse pensamento é um grande pecado para um servo de Deus; e, se alguém praticar esse ato mau, trará morte sobre si mesmo. Portanto, fique atento: mantenha-se afastado desse pensamento, pois, onde habita a dignidade moral, a transgressão da lei não deve subir ao coração de um homem justo.”'
  rationale: A revisão elimina a especificação não expressa pelo grego na segunda condição e reforça a correspondência entre os termos gregos para pecar/pecado. Mantém-se «dignidade moral» para σεμνότης e a formulação não confessional «trará morte sobre si mesmo», que não define o tipo de morte referido.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:59:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'A revisão preserva a sequência e as relações condicionais do grego. Corrige a explicitação indevida de «pensamentos» na segunda condição: ἕτερα οὕτως πονηρά diz literalmente «outras coisas igualmente más», com o verbo «subir ao coração» elíptico, sem repetir ἐνθύμησις. Também aproxima διαμαρτήσεις de «pecará», correspondente direto de ἁμαρτάνω.'
  naturalness: O texto revisto permanece em português moderno e claro, com «você», e torna mais fluida a advertência final. «Dignidade moral» é uma solução compreensível para σεμνότης, cujo campo abrange decoro, respeitabilidade e pureza moral, sem restringi-lo a vestuário ou sexualidade.
  terminology: «Servo de Deus», «pecado», «ato mau» e «morte» conservam o registro e não resolvem além do texto a natureza dessa morte. «Transgressão da lei» mantém adequadamente o componente normativo de ἀνομία, sem identificar uma lei específica que o grego não nomeia.
  issues:
  - severity: medium
    issue: A segunda oração condicional acrescenta «pensamentos».
    rationale: O grego lê «e, se outras coisas igualmente más [subirem ao coração]», sem repetir o substantivo ἐνθύμησις. Embora o contexto permita entender pensamentos, a tradução não deve converter essa elipse em uma especificação explícita.
  - severity: low
    issue: «Você transgredirá» é menos direto que «você pecará».
    rationale: διαμαρτήσεις pertence à mesma família semântica de ἁμαρτία/ἁμαρτίαν ἐργάζῃ no período. «Pecará» reproduz essa coesão lexical e é natural em português.
