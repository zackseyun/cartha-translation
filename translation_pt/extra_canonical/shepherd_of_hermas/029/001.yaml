  to: “Eu lhe ordeno”, diz ele, “que guarde a castidade e não deixe que suba ao seu coração nenhum pensamento acerca da mulher de outro homem, de alguma imoralidade sexual ou de quaisquer representações perversas semelhantes. Pois, ao fazer isso, você comete um grande pecado. Mas, se sempre se lembrar de sua própria esposa, jamais pecará.”
