review_pass:
  verdict: revise
  source_fidelity: A tradução capta a exortação à castidade e a progressão entre pensamento interior e pecado. Contudo, «outra mulher» enfraquece γυναικὸς ἀλλοτρίας, que aqui designa a mulher de outro homem, e «outras coisas más semelhantes» não conserva adequadamente ὁμοιωμάτων («representações», «imagens» ou «figuras semelhantes»).
  naturalness: O texto é claro, moderno e de registro apropriado. A revisão proposta mantém essa fluência, mas especifica o referente possessivo exigido pelo grego.
  terminology: «Castidade» e «imoralidade sexual» são escolhas defensáveis. «Mulher de outro homem» é mais fiel que «outra mulher»; «representações perversas semelhantes» preserva a expressão deliberadamente ampla ὁμοιωμάτων πονηρῶν sem definir indevidamente de que representações se trata.
  issues:
  - severity: medium
    issue: γυναικὸς ἀλλοτρίας foi traduzido por «outra mulher».
    rationale: ἀλλοτρίας significa «de outro», e, neste contexto matrimonial, a expressão aponta para a mulher de outro homem; «outra mulher» pode significar apenas uma mulher diferente da própria esposa.
  - severity: medium
    issue: ὁμοιωμάτων πονηρῶν foi reduzido a «outras coisas más semelhantes».
    rationale: A formulação omite o componente de «representações/figuras/imagens» (ὁμοιωμάτων) e altera a relação qualificativa do original. A referência deve permanecer ampla, mas esse elemento lexical deve ser preservado.
  revised_text: “Eu lhe ordeno”, diz ele, “que guarde a castidade e não deixe que suba ao seu coração nenhum pensamento acerca da mulher de outro homem, de alguma imoralidade sexual ou de quaisquer representações perversas semelhantes. Pois, ao fazer isso, você comete um grande pecado. Mas, se sempre se lembrar de sua própria esposa, jamais pecará.”
  revised_footnotes: []
  revision_rationale: A revisão corrige os dois pontos de fidelidade lexical sem alterar o sentido nem introduzir interpretações doutrinárias. «Representações perversas semelhantes» mantém a indeterminação do termo grego, que não especifica se tais representações são mentais, visuais ou de outra natureza.
