base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/001.yaml
  text: “I am commanding you,” he says, “to guard chastity, and do not let a thought about another man’s wife, or about any fornication, or about any such evil likenesses, rise up upon your heart. For in doing this you commit a great sin. But if you remember your own wife always, you will never transgress.
translation:
  language: pt
  text: “Eu lhe ordeno”, diz ele, “que guarde a castidade e não deixe que suba ao seu coração nenhum pensamento acerca da mulher de outro homem, de alguma imoralidade sexual ou de quaisquer representações perversas semelhantes. Pois, ao fazer isso, você comete um grande pecado. Mas, se sempre se lembrar de sua própria esposa, jamais pecará.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁγνείαν
  choice: a castidade
  rationale: Expressa a pureza sexual exigida pelo contexto, em linguagem atual e digna.
- source_word: γυναικὸς ἀλλοτρίας
  choice: outra mulher
  rationale: O grego designa uma mulher que não é a própria esposa; a formulação evita acrescentar que ela necessariamente seja esposa de outro homem.
- source_word: πορνείας τινὸς
  choice: qualquer imoralidade sexual
  rationale: Abrange a conduta sexual ilícita indicada por πορνεία sem restringi-la indevidamente a um único ato.
- source_word: τοιούτων τινῶν ὁμοιωμάτων πονηρῶν
  choice: outras coisas más semelhantes
  rationale: Reproduz a referência ampla e um tanto indeterminada do original sem transformar ὁμοιώματα, neste contexto, em imagens visuais específicas.
- source_word: μνημονεύων πάντοτε
  choice: mantiver sempre em mente
  rationale: Comunica naturalmente a ideia contínua de lembrar-se ou ter presente a própria esposa.
- source_word: διαμαρτήσεις
  choice: pecará
  rationale: No contexto da advertência moral, traduz de modo claro a ideia de transgredir ou agir erradamente, em paralelo com ἁμαρτίαν.
theological_decisions:
- issue: Natureza do pecado descrito
  choice: Manter a advertência tanto no plano do pensamento desejoso quanto no da imoralidade sexual
  alternative: Limitar a proibição apenas ao adultério consumado
  rationale: A expressão sobre algo subir ao coração mostra que o texto inclui a disposição interior, enquanto πορνεία mantém a referência mais ampla à imoralidade sexual.
translation_notes:
  register: Português moderno, claro e respeitoso, com leitura natural no Brasil e compreensão internacional. Conservou-se a metáfora bíblica de algo ‘subir ao coração’, sem reproduzir de forma rígida a sintaxe grega.
