revisions:
- from: “Portanto”, diz ele, “não dou ocasião para que essa prática aconteça dessa maneira, mas para que quem pecou não peque mais. Quanto ao pecado cometido anteriormente, há quem possa conceder cura, pois é ele quem tem autoridade sobre todas as coisas.”
  to: “Portanto”, diz ele, “não dou ocasião para que essa prática se realize dessa forma, mas para que quem pecou não peque mais. Quanto ao seu pecado anterior, há aquele que pode dar cura, pois ele é quem tem autoridade sobre todas as coisas.”
  rationale: A revisão conserva a estrutura e o sentido da versão proposta, mas torna mais explícita a referência definida do texto grego e ajusta duas formulações para maior precisão e naturalidade. Não se introduz identificação confessional do agente que pode dar cura, nem capitalização interpretativa.
