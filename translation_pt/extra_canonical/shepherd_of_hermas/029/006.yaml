base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/006.yaml
  text: “I therefore,” he says, “do not give an occasion for this practice to be carried through in this way, but so that the one who has sinned may no longer sin. But with regard to his former sin, there is One who is able to give healing—for he is the One who has authority over all.”
translation:
  language: pt
  text: “Portanto”, diz ele, “não dou ocasião para que essa prática se realize dessa forma, mas para que quem pecou não peque mais. Quanto ao seu pecado anterior, há aquele que pode dar cura, pois ele é quem tem autoridade sobre todas as coisas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφορμήν
  choice: ocasião
  rationale: Preserva o sentido de oportunidade, pretexto ou abertura, sem definir além do contexto a natureza exata dessa ocasião.
- source_word: ἡ πρᾶξις
  choice: essa prática
  rationale: Retoma naturalmente, em português, a conduta discutida no contexto anterior.
- source_word: συντελῆται
  choice: aconteça
  rationale: Expressa de modo claro a ideia de realizar-se ou levar-se a efeito, sem a rigidez pouco natural de uma tradução excessivamente literal.
- source_word: ἴασιν δοῦναι
  choice: conceder cura
  rationale: Mantém a metáfora terapêutica explícita do grego, em vez de substituí-la por perdão ou restauração.
- source_word: πάντων τὴν ἐξουσίαν
  choice: autoridade sobre todas as coisas
  rationale: Representa o alcance abrangente de πάντων e o sentido de autoridade ou poder legítimo de ἐξουσία.
theological_decisions:
- issue: Identidade daquele que pode conceder cura
  choice: há quem possa conceder cura, pois é ele
  alternative: há Um que pode conceder cura, pois Ele
  rationale: O grego não emprega maiúsculas teológicas e não nomeia explicitamente o referente nesta frase; a tradução preserva essa referência implícita sem impor capitalização interpretativa.
- issue: Finalidade da orientação sobre separação e permanência sem novo casamento
  choice: mas para que quem pecou não peque mais
  alternative: e sim visando impedir que o pecador continue pecando
  rationale: Mantém a formulação final do grego e sua tensão com a prática pastoral discutida, sem convertê-la em explicação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente para leitores brasileiros e compreensão internacional. Conserva-se a metáfora de cura e a referência teológica implícita do original.
