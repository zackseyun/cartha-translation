base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/004.yaml
  text: 3. I say to him, “Sir, if they did such things as to embitter the glorious angel, what did I do?” “Otherwise,” he says, “they cannot be afflicted unless you, the head of the whole household, are afflicted; for when you are afflicted, of necessity they also will be afflicted, but if you stand firm, they cannot have any affliction.”
translation:
  language: pt
  text: '3. Eu lhe disse: “Senhor, se eles fizeram tais coisas de modo a provocar o anjo glorioso, o que foi que eu fiz?” Ele respondeu: “De outro modo, eles não podem ser afligidos, a menos que você, o chefe de toda a casa[a], também seja afligido. Pois, quando você é afligido, eles necessariamente também serão afligidos; mas, se você permanecer firme, eles não podem ter aflição alguma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos não trazem “toda”.
    reason: O adjetivo ὅλου aparece entre colchetes na edição-fonte, indicando incerteza textual.
lexical_decisions:
- source_word: παραπικρανθῇ
  choice: provocar
  rationale: No contexto, o passivo descreve o anjo sendo profundamente contrariado ou indignado pelas ações da família. “Provocar o anjo” comunica isso naturalmente sem definir com precisão excessiva a emoção.
- source_word: θλιβῆναι / θλιβομένου / θλιβήσονται / θλῖψιν
  choice: passar por aflição / ser afligido
  rationale: Mantém a repetição da mesma família lexical grega e o vínculo entre a aflição do chefe da casa e a dos demais, com formulação natural em português.
- source_word: ἡ κεφαλὴ τοῦ οἴκου
  choice: o chefe de toda a casa
  rationale: “Chefe” expressa a metáfora funcional de κεφαλή neste contexto; “casa” preserva a possível referência tanto à família quanto à unidade doméstica.
- source_word: εὐσταθοῦντος
  choice: enquanto você estiver bem
  rationale: O verbo indica estar em boa condição, firme ou próspero. No contraste com θλῖψις, “estar bem” preserva a amplitude do sentido melhor que uma especificação apenas emocional ou econômica.
theological_decisions:
- issue: Responsabilidade do chefe da casa pela aflição dos demais
  choice: Preservar a relação declarada entre a aflição do chefe e a da casa, sem explicá-la como culpa transferida, representação espiritual ou mero efeito psicológico.
  alternative: Interpretar explicitamente a passagem segundo uma teoria de responsabilidade familiar ou de punição vicária.
  rationale: O grego afirma a relação e sua necessidade, mas não oferece aqui uma explicação doutrinária precisa.
translation_notes:
  register: Português atual, digno e de leitura ampla. O diálogo permanece direto; a repetição de “aflição/afligido” reflete a insistência lexical do grego. O tratamento por “você” favorece legibilidade brasileira sem tornar o registro coloquial.
