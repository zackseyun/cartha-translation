    issue: «Não há outro modo» para Ἄλλως
    rationale: 'A expressão pode sugerir uma afirmação absoluta independente. No grego, ela introduz a condição/alternativa: «De outro modo, eles não podem ser afligidos...».'
  - severity: medium
    issue: «enquanto você estiver bem» para εὐσταθοῦντος
    rationale: «Estar bem» é amplo e pode enfraquecer o contraste. O particípio indica estar firme ou estável; «se você permanecer firme» preserva melhor esse valor, em concordância com o contraste do texto.
  - severity: low
    issue: Alternância entre «passar por aflição» e «ser afligido»
    rationale: O grego repete a mesma família lexical. Usar «ser afligido/aflição» de modo consistente evidencia a conexão argumentativa sem sacrificar naturalidade.
