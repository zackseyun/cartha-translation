  to: '3. Eu lhe disse: “Senhor, se eles fizeram tais coisas de modo a provocar o anjo glorioso, o que foi que eu fiz?” Ele respondeu: “De outro modo, eles não podem ser afligidos, a menos que você, o chefe de toda a casa[a], também seja afligido. Pois, quando você é afligido, eles necessariamente também serão afligidos; mas, se você permanecer firme, eles não podem ter aflição alguma.”'
  rationale: A revisão conserva o sentido e a ambiguidade textual do original, ajustando ἄλλως e εὐσταθοῦντος de forma mais precisa. Também uniformiza a família lexical de «afligir/aflição» para refletir θλιβῆναι, θλιβῇς, θλιβομένου, θλιβήσονται e θλῖψιν.
