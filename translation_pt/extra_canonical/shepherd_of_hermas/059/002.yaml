  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/002.yaml
  text: 1. After a few days I saw him in the same field where I had also seen the shepherds, and he says to me, “What are you seeking?” “I am here, sir,” I say, “that you may command the shepherd, the punisher, to go out from my house, because he afflicts me greatly.” He says, “It is necessary for you to be afflicted; for thus the glorious angel has commanded concerning you, for he wants you to be tested.” “For what, sir,” I say, “have I done that was so evil, that I should be handed over to this angel?”
translation:
  language: pt
  text: '1. Alguns dias depois, eu o vi no mesmo campo onde também tinha visto os pastores. Ele me perguntou: “O que você procura?” Respondi: “Estou aqui, senhor, para que ordene ao pastor que castiga que saia da minha casa, pois ele me aflige muito.” Ele disse: “É necessário que você seja afligido, pois foi isso que o anjo glorioso ordenou a seu respeito; ele quer que você seja provado.” Perguntei: “Que coisa tão má eu fiz, senhor, para ser entregue a esse anjo?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιζητεῖς
  choice: procura
  rationale: Expressa de modo natural a ideia de buscar ou desejar algo, sem acrescentar uma finalidade não explícita.
- source_word: ποιμένα τὸν τιμωρητήν
  choice: pastor encarregado do castigo
  rationale: Mantém a figura do pastor e explicita a função indicada por τιμωρητής, evitando o pouco natural “pastor castigador”.
- source_word: θλίβει / θλιβῆναι
  choice: aflige / ser afligido
  rationale: Preserva a repetição lexical e a noção de sofrimento ou pressão imposta.
- source_word: πειρασθῆναι
  choice: ser provado
  rationale: Conserva a ambiguidade contextual entre teste e provação, sem sugerir necessariamente tentação para o mal.
- source_word: παραδοθῶ
  choice: ser entregue
  rationale: Reproduz a linguagem de transferência à autoridade do anjo, sem interpretar além do texto.
theological_decisions:
- issue: Natureza da provação determinada pelo anjo glorioso
  choice: “ele quer que você seja provado”
  alternative: “ele quer pôr você à prova”
  rationale: A forma passiva acompanha o grego e não resolve se a prova é disciplinar, judicial ou purificadora.
- issue: Necessidade da aflição
  choice: “É necessário que você seja afligido”
  alternative: “Você precisa sofrer”
  rationale: Mantém a força impessoal de δεῖ e a ligação lexical com a aflição mencionada anteriormente, sem apresentar uma explicação teológica adicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com diálogo natural. “Senhor” é usado como forma respeitosa de tratamento, em minúscula, pois o interlocutor imediato é uma figura angélica/pastoral, não uma identificação explícita com Deus. A numeração “1.” foi mantida conforme o segmento fornecido e a camada inglesa auditada.
