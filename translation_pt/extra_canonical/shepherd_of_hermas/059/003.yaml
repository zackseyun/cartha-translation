base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/003.yaml
  text: '2. He says, “Listen: your sins are many, but not so many that you should be handed over to this angel. Rather, your household has committed great lawless deeds and sins, and the glorious angel was embittered at their works; and for this reason he ordered that you be afflicted for a certain time, so that they too might repent and cleanse themselves from every desire of this age. When therefore they repent and are cleansed, then the angel of punishment will depart.”'
translation:
  language: pt
  text: '2. Ele disse: “Escute: seus pecados são muitos, mas não tantos que você devesse ser entregue a esse anjo. Mas os de sua casa cometeram grandes transgressões e pecados, e o anjo glorioso ficou amargurado com as obras deles. Por isso, ordenou que você fosse afligido por algum tempo, para que eles também se arrependessem e se purificassem de todo desejo desta era. Portanto, quando se arrependerem e forem purificados, então o anjo do castigo se afastará.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: os de sua casa
  rationale: Aqui οἶκος designa coletivamente as pessoas da casa, como confirma a retomada por pronomes plurais; a formulação evita atribuir ações ao edifício.
- source_word: ἀνομίας
  choice: transgressões
  rationale: Expressa violações graves da ordem moral sem restringir o termo à ilegalidade civil.
- source_word: παρεπικράνθη
  choice: ficou profundamente indignado
  rationale: Comunica a forte reação provocada pelas obras da casa; uma tradução literal ligada a ‘amargura’ seria menos natural neste contexto.
- source_word: θλιβῆναι
  choice: fosse afligido
  rationale: Preserva a passividade e a ideia ampla de sofrimento ou tribulação imposta, sem especificar indevidamente sua forma.
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: desejo desta era
  rationale: Mantém o singular do grego e a linguagem temporal de αἰών, sem interpretar o desejo como necessariamente material ou sexual.
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: o anjo do castigo
  rationale: Reproduz a função disciplinadora/punitiva expressa pelo genitivo sem acrescentar uma identidade não indicada no texto.
theological_decisions:
- issue: Relação entre a aflição do chefe da casa e o arrependimento dos familiares
  choice: 'Manter a finalidade explícita: ‘para que eles também se arrependam’'
  alternative: Reformular como mera consequência provável ou influência moral
  rationale: A construção ἵνα com subjuntivo apresenta a aflição como ordenada visando ao arrependimento e à purificação deles; a tradução não deve suavizar essa tensão.
- issue: Natureza do ‘anjo glorioso’ e do ‘anjo do castigo’
  choice: Conservar os dois títulos sem identificá-los entre si ou com outra figura
  alternative: Explicar que se trata do mesmo anjo ou associá-los a personagens teológicos específicos
  rationale: A passagem distingue as expressões funcionalmente, mas não fornece base suficiente para uma identificação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por ‘você’ para refletir o singular grego com naturalidade brasileira. A sintaxe permanece próxima do desenvolvimento argumentativo do original, mas evita construções artificiais. Não foram necessárias notas de rodapé neste segmento.
