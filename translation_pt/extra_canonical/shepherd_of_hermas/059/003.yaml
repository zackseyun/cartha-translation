  to: '2. Ele disse: “Escute: seus pecados são muitos, mas não tantos que você devesse ser entregue a esse anjo. Mas os de sua casa cometeram grandes transgressões e pecados, e o anjo glorioso ficou amargurado com as obras deles. Por isso, ordenou que você fosse afligido por algum tempo, para que eles também se arrependessem e se purificassem de todo desejo desta era. Portanto, quando se arrependerem e forem purificados, então o anjo do castigo se afastará.”'
