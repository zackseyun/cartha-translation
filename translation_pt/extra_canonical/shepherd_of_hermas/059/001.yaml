translation:
  language: pt
  text: '**Símile 7**


    **1** Poucos dias depois, eu o vi no mesmo campo onde também tinha visto os pastores. Ele me perguntou:


    — O que você está procurando?


    — Vim pedir, senhor — respondi —, que o senhor ordene ao pastor encarregado do castigo[a] que saia da minha casa, pois ele está me afligindo demais.


    — É necessário que você seja afligido — disse ele —, pois foi isso que o anjo glorioso ordenou a seu respeito: ele quer que você seja provado.


    — Que mal tão grande eu fiz, senhor — perguntei —, para ser entregue a esse anjo?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o pastor disciplinador”. O termo grego pode designar alguém que pune ou aplica correção.'
    reason: Registra a amplitude semântica de τιμωρητής, relevante para a natureza da aflição descrita.
lexical_decisions:
- source_word: ἐπιζητεῖς
  choice: está procurando
  rationale: Expressa de modo natural a ideia de buscar ou pretender algo, sem restringi-la indevidamente a um pedido formal.
- source_word: ποιμένα τὸν τιμωρητήν
  choice: pastor encarregado do castigo
  rationale: Mantém o título pastoral e comunica a função punitiva ou disciplinadora de τιμωρητής sem sugerir que “Castigador” seja um nome próprio.
- source_word: θλίβει / θλιβῆναι
  choice: está me afligindo / seja afligido
  rationale: Preserva a repetição e o campo semântico de pressão, sofrimento e tribulação presentes no grego.
- source_word: πειρασθῆναι
  choice: seja provado
  rationale: Conserva a ambiguidade entre ser testado e passar por uma experiência difícil, sem implicar necessariamente sedução ao pecado.
- source_word: παραδοθῶ
  choice: ser entregue
  rationale: Reproduz a linguagem forte de ser posto sob a autoridade do anjo, sem acrescentar explicações ausentes do texto.
theological_decisions:
- issue: Finalidade da aflição ordenada pelo anjo glorioso
  choice: “ele quer que você seja provado”
  alternative: “ele quer que você seja tentado”
  rationale: O passivo de πειράζω pode indicar prova ou tentação. “Provado” se ajusta melhor ao contexto disciplinar, mas mantém a tensão de uma experiência que põe a pessoa à prova.
- issue: Natureza da atuação do pastor τιμωρητής
  choice: “encarregado do castigo”
  alternative: “disciplinador”
  rationale: “Castigo” preserva a severidade do termo grego, enquanto a nota reconhece que a ação pode ter caráter corretivo; evita-se impor uma leitura exclusivamente penal ou exclusivamente terapêutica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com diálogo direto e fluente. Emprega “você” por legibilidade brasileira e mantém “senhor” como forma respeitosa de tratamento. A repetição de “afligir” foi preservada por sua importância literária e temática.
