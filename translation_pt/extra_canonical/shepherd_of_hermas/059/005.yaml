  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/005.yaml
  text: 4. “But look, sir,” I say, “they have repented with all their heart.” He says, “I also know that they have repented with—”
translation:
  language: pt
  text: '4. “Mas veja, senhor”, digo eu, “eles se arrependeram de todo o coração.” Ele diz: “Eu também sei que eles se arrependeram de—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: veja
  rationale: Introduz enfaticamente a alegação de Hermas; em português atual, “veja” preserva o apelo direto sem soar excessivamente arcaico.
- source_word: κύριε
  choice: senhor
  rationale: Mantém a forma respeitosa de tratamento no diálogo, sem pressupor que seja uma referência divina.
- source_word: μετανενοήκασιν
  choice: se arrependeram
  rationale: Expressa naturalmente o perfeito grego, apresentando o arrependimento como já ocorrido e relevante no presente.
- source_word: ἐξ ὅλης καρδίας αὐτῶν
  choice: de todo o coração
  rationale: Equivalente idiomático fiel, que conserva a ideia de sinceridade e inteireza.
- source_word: Οἶδα ... κἀγώ
  choice: Eu também sei
  rationale: Preserva a ênfase explícita de κἀγώ e a afirmação de conhecimento.
theological_decisions:
- issue: Natureza e alcance do arrependimento
  choice: “se arrependeram de todo o coração”
  alternative: “mudaram de atitude com todo o coração”
  rationale: “Arrepender-se” é claro e corrente, mantém a dimensão moral de μετανοέω e não acrescenta uma definição doutrinária específica.
- issue: Identidade do interlocutor tratado por κύριε
  choice: “senhor” em minúscula
  alternative: “Senhor” em maiúscula
  rationale: O contexto apresenta uma forma respeitosa de tratamento dirigida ao interlocutor angelical/pastor; a minúscula evita identificá-lo indevidamente com Deus ou Cristo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O travessão final preserva a interrupção do fragmento fornecido, que termina no meio da fala.
