base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/001.yaml
  text: Therefore, seeing them being scourged and afflicted like this, I was grieved for them, because they were being tormented in this way and had no respite at all. I said to the shepherd who was speaking with me, “Sir, who is this shepherd, so pitiless and harsh, showing no compassion at all for these sheep?” He said, “This is the angel of punishment; he is one of the righteous angels, appointed over punishment. Therefore he takes charge of those who have wandered away from God and have gone after the desires and deceits of this age, and he punishes them, as they deserve, with dreadful and various punishments.”
translation:
  language: pt
  text: 'Portanto, ao vê-las sendo assim açoitadas e maltratadas, fiquei entristecido por elas, porque eram atormentadas desse modo e não tinham alívio algum. Eu disse ao pastor que falava comigo: “Senhor, quem é esse pastor, tão impiedoso e severo, que não demonstra compaixão alguma por estas ovelhas?” Ele respondeu: “Este é o anjo do castigo. Ele é um dos anjos justos, encarregado do castigo. Por isso, recebe aqueles que se desviaram de Deus e seguiram os desejos e os enganos desta era, e os castiga, conforme merecem, com castigos terríveis e variados.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαστιγούμενα
  choice: sendo açoитadas
  rationale: Preserva a imagem concreta de punição física expressa pelo verbo grego, em linguagem clara e digna.
- source_word: ταλαιπωρούμενα
  choice: maltratadas
  rationale: Comunica sofrimento e aflição de modo natural, sem duplicar de forma artificial o sentido de ‘atormentadas’ na oração seguinte.
- source_word: ἀνοχήν
  choice: alívio
  rationale: No contexto, indica uma pausa ou trégua no sofrimento; ‘alívio’ é corrente e compreensível.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém a forma respeitosa de tratamento dirigida ao pastor, sem decidir se o termo possui aqui sentido propriamente divino.
- source_word: ἄσπλαγχνος καὶ πικρός
  choice: impiedoso e severo
  rationale: Expressa a ausência de compaixão e a dureza do pastor em português natural; evita o pouco idiomático ‘amargo’ para πικρός neste contexto.
- source_word: τιμωρίας
  choice: castigo
  rationale: Adequado ao contexto judicial e disciplinar da passagem, mantendo a repetição deliberada do termo grego.
- source_word: παραλαμβάνει
  choice: recebe
  rationale: Indica que o anjo toma essas pessoas sob sua responsabilidade, sem acrescentar uma ideia de captura não explícita.
- source_word: τοῦ αἰῶνος τούτου
  choice: desta era
  rationale: Preserva a dimensão temporal e teológica de αἰών sem reduzi-la necessariamente ao mundo físico.
- source_word: δειναῖς καὶ ποικίλαις τιμωρίαις
  choice: com castigos terríveis e variados
  rationale: Reproduz a força e a variedade dos castigos com equivalentes diretos e naturais.
theological_decisions:
- issue: A condição do anjo do castigo entre os anjos justos
  choice: “Ele é um dos anjos justos, encarregado do castigo”
  alternative: “Ele pertence aos anjos justos e foi posto sobre a punição”
  rationale: Mantém explicitamente a afirmação de que o agente punitivo é justo e exerce uma função designada, sem explicar além do texto a origem ou a finalidade dessa designação.
- issue: Sentido de Κύριε como forma de tratamento
  choice: “Senhor”
  alternative: “Meu senhor” ou “senhor” em minúscula
  rationale: Conserva a ambiguidade respeitosa do grego e acompanha o registro elevado do diálogo, sem identificar o pastor com Deus.
- issue: Relação entre desvio, desejos da era e castigo merecido
  choice: Preservar a sequência causal e a expressão “conforme merecem”
  alternative: Suavizar para “para corrigi-los”
  rationale: O trecho afirma diretamente punição proporcional à conduta; uma finalidade corretiva aparece no contexto posterior, mas não deve ser importada para esta unidade.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluida e repetição controlada dos termos-chave ‘pastor’ e ‘castigo’. O referente plural neutro grego foi vertido no feminino (‘elas’) por retomar naturalmente ‘ovelhas’ no contexto imediato. A leitura entre colchetes οὕτως foi refletida por ‘tão’, sem nota, pois não altera substancialmente o sentido da frase.
