base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/003.yaml
  text: “When, then, they are afflicted with every affliction, then they are handed over to me for good discipline, and they are strengthened in the faith of the Lord; and the rest of the days of their life they serve the Lord with a pure heart. And if they repent, then the evil works that they did rise up into their heart; and then they glorify God, saying that he is a righteous judge and that each one suffered justly according to his deeds. Thereafter they serve the Lord with a pure heart, and they prosper in every work of theirs, receiving from the Lord whatever they ask for; and then they glorify the Lord because they were handed over to me, and they no longer suffer any of the evils.”
translation:
  language: pt
  text: Quando, pois, são afligidos por toda sorte de aflição, são entregues a mim para uma disciplina benéfica e fortalecidos na fé do Senhor. Durante os dias que lhes restam de vida, servem ao Senhor com o coração puro. E, se se arrependem, então lhes vêm ao coração as obras más que praticaram, e eles glorificam a Deus, dizendo que ele é juiz justo e que cada um sofreu com justiça, de acordo com seus atos. Daí em diante, servem ao Senhor com o coração puro e prosperam em tudo o que fazem, recebendo do Senhor tudo o que pedem. Então glorificam o Senhor por terem sido entregues a mim e já não sofrem mal algum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὴν παιδείαν
  choice: disciplina benéfica
  rationale: Preserva o sentido de disciplina formativa ou corretiva, evitando reduzir παιδεία a mero castigo; ἀγαθή indica seu propósito benéfico.
- source_word: ἰσχυροποιοῦνται
  choice: fortalecidos
  rationale: Expressa diretamente a ideia de serem tornados fortes na fé.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτῶν
  choice: lhes vêm ao coração
  rationale: Mantém a imagem semítica e grega do coração como sede da consciência e da lembrança, sem explicá-la excessivamente.
- source_word: εὐοδοῦνται
  choice: prosperam
  rationale: No contexto de suas ações, indica que passam a ter bom êxito, em contraste com οὐδὲν... προχωρεῖ no contexto anterior.
- source_word: τῶν πονηρῶν
  choice: desses males
  rationale: Conserva a amplitude do substantivo adjetival, que pode abranger sofrimentos, adversidades ou coisas ruins, sem especificar além do grego.
theological_decisions:
- issue: Relação entre aflição, disciplina e arrependimento
  choice: 'Manter a sequência e a condicionalidade do texto: aflição, entrega para disciplina, fortalecimento e, se houver arrependimento, reconhecimento das obras más.'
  alternative: Reorganizar a sequência para fazer do arrependimento uma condição prévia ao fortalecimento e ao serviço puro.
  rationale: O grego apresenta certa tensão lógica entre as afirmações, e a tradução não deve harmonizá-las nem impor uma ordem teológica ausente do texto.
- issue: Prosperidade e resposta às orações
  choice: Traduzir literalmente a afirmação de que prosperam e recebem tudo o que pedem, sem qualificações adicionais.
  alternative: Acrescentar condições como 'segundo a vontade de Deus' ou interpretar a prosperidade apenas espiritualmente.
  rationale: Essas qualificações não aparecem nesta unidade e importariam uma resolução doutrinária externa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de 'coração puro', 'Senhor' e 'glorificam' foi preservada por sua função retórica. 'Se se arrependem' mantém a relação condicional do grego, apesar da repetição sonora legítima em registro formal.
