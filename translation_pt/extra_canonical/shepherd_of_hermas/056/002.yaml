base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/002.yaml
  text: '“I wished, Sir,” I said, “to know what these various punishments are.” He said, “Listen. The various punishments and torments are torments of this present life: for some are punished with losses, some with deprivations, some with various sicknesses, some with every kind of disorder; some are insulted by the unworthy, and suffer in many other ways. For many, being unsettled in their plans, undertake many things, and nothing at all advances for them. They say of themselves that they do not prosper in their undertakings, and it does not rise up into their heart that they have done evil, but they blame the Lord.'
translation:
  language: pt
  text: '“Eu queria saber, senhor”, disse eu, “quais são esses diversos castigos.”


    Ele disse: “Escute. Os diversos castigos e tormentos são sofrimentos desta vida. Uns são castigados com perdas; outros, com privações; outros, com diversas doenças; outros, com todo tipo de instabilidade[a]; outros são insultados por pessoas indignas e sofrem muitas outras coisas. Pois muitos, instáveis em seus planos, empreendem muitas coisas, mas nada do que fazem avança. Dizem que não prosperam em seus empreendimentos, e nem lhes vem ao coração que praticaram o mal; em vez disso, culpam o Senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega correspondente a “todo tipo de” é textualmente incerta; sem ela, a frase diz apenas “com instabilidade”.
    reason: O texto-fonte põe πάσῃ entre colchetes, indicando incerteza editorial, que deve permanecer visível ao leitor.
lexical_decisions:
- source_word: τιμωρίαι
  choice: castigos
  rationale: Mantém o sentido de punições disciplinares ou retributivas no contexto, sem antecipar uma interpretação denominacional.
- source_word: βάσανοι / βιωτικαί ... βάσανοι
  choice: tormentos / sofrimentos desta vida
  rationale: Preserva a força inicial de βάσανοι e expressa naturalmente que se trata de aflições ligadas à vida presente.
- source_word: ὑστερήσεσιν
  choice: privações
  rationale: Abrange carências e falta de recursos sem restringir o termo a uma espécie específica de necessidade.
- source_word: ἀκαταστασίᾳ
  choice: instabilidade
  rationale: Conserva a ideia ampla de desordem, perturbação ou condição instável e se conecta naturalmente à instabilidade dos planos mencionada em seguida.
- source_word: ἀκαταστατοῦντες ταῖς βουλαῖς αὐτῶν
  choice: instáveis em seus planos
  rationale: Reproduz a falta de firmeza ou constância nas decisões, evitando a formulação menos natural 'desordenados em seus conselhos'.
- source_word: οὐδὲν αὐτοῖς ὅλως προχωρεῖ
  choice: nada do que fazem avança
  rationale: Expressa o fracasso total de seus esforços sem transformar a frase em promessa genérica de prosperidade material.
- source_word: οὐκ ἀναβαίνει αὐτῶν ἐπὶ τὴν καρδίαν
  choice: nem lhes vem ao coração
  rationale: Preserva a imagem semítica do texto grego e continua compreensível em português moderno.
theological_decisions:
- issue: Natureza dos castigos
  choice: Apresentá-los como sofrimentos desta vida
  alternative: Interpretá-los explicitamente como juízos sobrenaturais particulares
  rationale: O próprio texto os chama de βιωτικαί βάσανοι e enumera perdas, privações, doenças, instabilidade e insultos; a tradução não acrescenta uma causalidade além da afirmada pelo autor.
- issue: Sentido de prosperidade
  choice: “não prosperam em seus empreendimentos”
  alternative: “não são abençoados”
  rationale: εὐοδοῦσθαι aqui se refere ao bom andamento das ações; 'prosperam' mantém esse sentido sem equiparar prosperidade e favor divino em termos doutrinários.
translation_notes:
  register: Português moderno, claro e digno, com períodos curtos para conservar a estrutura enumerativa do grego. “Senhor” em minúscula no vocativo traduz κύριε como forma respeitosa dirigida ao pastor; “o Senhor” em maiúscula refere-se ao Senhor divino no contexto.
