    rationale: γελῶν designa alguém que ri; “sempre rindo” preserva o sentido lexical e o contraste com o abatimento atual.
  - severity: low
    issue: “muito bondosa” para ἀγαθωτάτης
    rationale: A opção estreita “boa/excelente” a bondade moral. “Uma mulher excelente” conserva melhor o elogio amplo do superlativo.
  - severity: low
    issue: “sombrio” para στυγνός
    rationale: Embora possível, “triste” é mais idiomático em português contemporâneo para o estado pessoal descrito, sem perder o tom de tristeza carregada.
