base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/003.yaml
  text: And she said to me, “Why are you gloomy, Hermas—you who are patient and not given to contention, always laughing? Why are you so downcast in appearance and not cheerful?” And I said to her, “Because of a most excellent woman, who said that I sinned against her.”
translation:
  language: pt
  text: 'E ela me disse: “Por que está tão triste, Hermas — você que é paciente, avesso a discussões e sempre rindo? Por que está com o semblante tão abatido e sem alegria?” Eu lhe respondi: “Por causa de uma mulher excelente, que disse que pequei contra ela.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνός
  choice: sombrio
  rationale: Expressa o estado triste e fechado de Hermas, preservando a relação com sua aparência abatida.
- source_word: μακρόθυμος
  choice: paciente
  rationale: Equivalente natural para a disposição de suportar com constância, sem precipitação irada.
- source_word: ἀστομάχητος
  choice: não dado a contendas
  rationale: Comunica a ideia de alguém que não costuma brigar ou entrar em disputas, sem sugerir incapacidade física.
- source_word: γελῶν
  choice: sorrindo
  rationale: Neste contexto, descreve a habitual expressão alegre de Hermas; 'sorrindo' soa mais natural que 'rindo' em português.
- source_word: κατηφὴς τῇ ἰδέᾳ
  choice: com o semblante tão abatido
  rationale: Traduz idiomaticamente a referência à aparência visível e entristecida.
- source_word: ἀγαθωτάτης
  choice: muito bondosa
  rationale: Preserva o superlativo elogioso sem o tom potencialmente ambíguo de 'excelente'.
- source_word: ἥμαρτον εἰς αὐτήν
  choice: pequei contra ela
  rationale: Mantém a formulação moral e relacional do grego.
theological_decisions:
- issue: Natureza do pecado alegado
  choice: pequei contra ela
  alternative: cometi pecado a respeito dela
  rationale: O segmento relata a acusação tal como Hermas a entendeu; a formulação não antecipa nem resolve a explicação posterior sobre desejo interior.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O discurso direto conserva o contraste entre o caráter habitualmente alegre e pacífico de Hermas e seu abatimento presente.
