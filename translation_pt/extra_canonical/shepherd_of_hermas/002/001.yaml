base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/001.yaml
  text: After she had spoken these words, the heavens were shut, and I was wholly trembling and grieving. And I said within myself, “If this sin is charged against me, how will I be able to be saved? Or how shall I make atonement to God for my completed sins? Or with what words shall I ask the Lord, that he may be propitious to me?”
translation:
  language: pt
  text: 'Depois que ela disse essas palavras, os céus se fecharam, e eu fiquei inteiramente trêmulo e triste. Dizia comigo mesmo: “Se este pecado é registrado contra mim, como poderei ser salvo? Como aplacarei a Deus por causa de meus pecados consumados[a]? Com que palavras pedirei ao Senhor que me seja favorável?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pecados levados a cabo”. O grego descreve os pecados como “completos” ou “consumados”; a expressão exata é incomum.'
    reason: Preserva e esclarece a dificuldade lexical de τῶν ἁμαρτιῶν μου τῶν τελείων sem eliminá-la do texto principal.
lexical_decisions:
- source_word: ἐκλείσθησαν
  choice: se fecharam
  rationale: Reproduz naturalmente o passivo grego no contexto da visão, sem acrescentar um agente.
- source_word: πεφρικὼς
  choice: tremendo
  rationale: O particípio perfeito descreve Hermas tomado de tremor ou pavor; a formulação portuguesa comunica o estado resultante sem exagerá-lo.
- source_word: ἀναγράφεται
  choice: é registrado contra mim
  rationale: Preserva a imagem de uma culpa lançada por escrito na conta de alguém, bem como sua força acusatória.
- source_word: ἐξιλάσομαι
  choice: farei propiciação diante de Deus
  rationale: Mantém a linguagem cultual e relacional do verbo sem substituir o ato por uma interpretação específica sobre seu mecanismo.
- source_word: τῶν τελείων
  choice: consumados
  rationale: Expressa o sentido de pecados levados à sua realização ou completude, preservando uma formulação difícil do grego.
- source_word: ἱλατευθῇ μοι
  choice: me seja favorável
  rationale: Comunica que o Senhor se mostre propício ou misericordioso para com Hermas, preservando a ligação lexical com ἐξιλάσομαι.
theological_decisions:
- issue: Linguagem de expiação e favor divino
  choice: “farei propiciação diante de Deus” e “me seja favorável”
  alternative: “obterei de Deus o perdão” e “tenha misericórdia de mim”
  rationale: A opção escolhida mantém a tensão e a repetição da família semântica ligada à propiciação no grego, sem resolver o texto em uma formulação doutrinária posterior.
- issue: Natureza dos “pecados consumados”
  choice: Preservar a expressão com nota explicativa
  alternative: Interpretar como “pecados anteriores”, “pecados graves” ou “todos os meus pecados”
  rationale: O adjetivo τελείων é incomum neste contexto; a tradução evita determinar uma leitura que o texto não torna inequívoca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A voz introspectiva e angustiada de Hermas foi mantida. Empregou-se terminologia cultual apenas onde o grego a exige, acompanhada de sintaxe natural em português.
