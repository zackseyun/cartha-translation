base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/004.yaml
  text: But she said, “By no means does this matter apply to the slave of God. Yet surely a thought concerning her rose up in your heart. For such an intention brings sin upon the slaves of God. For it is an evil and startling intention for a most reverent spirit, and one already proven, if it should desire an evil deed—especially Hermas, the self-controlled one, who abstains from every evil desire and is full of all simplicity and great innocence.”
translation:
  language: pt
  text: 'Ela, porém, disse: “De modo algum isso se aplica ao servo de Deus. Mas certamente surgiu em seu coração um pensamento a respeito dela. Para os servos de Deus, tal intenção acarreta pecado. Pois é uma intenção má e espantosa que um espírito sumamente venerável e já provado deseje um ato mau — sobretudo Hermas, o que domina a si mesmo, que se abstém de todo desejo mau e está cheio de toda sinceridade e de grande inocência.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλον τοῦ Θεοῦ
  choice: servo de Deus
  rationale: Preserva a formulação religiosa corrente e digna em português sem introduzir uma conotação social desnecessariamente dominante no contexto.
- source_word: βουλή
  choice: intenção
  rationale: 'No contexto, designa mais que um pensamento passageiro: uma inclinação ou propósito interior capaz de acarretar pecado.'
- source_word: ἔκπληκτος
  choice: chocante
  rationale: Conserva a força de algo alarmante e impróprio, evitando resolver o termo como mera surpresa.
- source_word: πάνσεμνον πνεῦμα
  choice: um espírito tão reverente
  rationale: Mantém πνεῦμα e expressa a elevada qualidade moral indicada pelo intensificador πάν-.
- source_word: ἐγκρατής
  choice: homem que domina a si mesmo
  rationale: Comunica claramente a ideia de autocontrole no português atual e concorda com a explicação subsequente sobre abster-se de desejos maus.
- source_word: ἁπλότης
  choice: sinceridade
  rationale: Neste retrato moral, indica inteireza e ausência de duplicidade; 'sinceridade' é mais natural que o potencialmente ambíguo 'simplicidade'.
- source_word: ἀκακία
  choice: inocência
  rationale: Expressa ausência de malícia ou maldade e mantém a distinção em relação a ἁπλότης.
theological_decisions:
- issue: Relação entre pensamento, intenção e pecado
  choice: “tal intenção acarreta pecado”
  alternative: “tal pensamento é pecado”
  rationale: O grego afirma que essa βουλή traz ou acarreta pecado; a tradução não identifica de forma absoluta todo pensamento involuntário com pecado nem elimina a gravidade da inclinação interior.
- issue: Sentido de πνεῦμα
  choice: Manter “espírito” sem especificar se é o espírito humano ou uma disposição moral
  alternative: “uma pessoa tão reverente”
  rationale: A referência exata permanece aberta no grego; explicá-la como pessoa ou caráter resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi suavizada sem apagar a tensão entre o pensamento que surge no coração, a intenção moral e o pecado.
