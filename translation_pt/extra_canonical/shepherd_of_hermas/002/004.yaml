  to: 'Ela, porém, disse: “De modo algum isso se aplica ao servo de Deus. Mas certamente surgiu em seu coração um pensamento a respeito dela. Para os servos de Deus, tal intenção acarreta pecado. Pois é uma intenção má e espantosa que um espírito sumamente venerável e já provado deseje um ato mau — sobretudo Hermas, o que domina a si mesmo, que se abstém de todo desejo mau e está cheio de toda sinceridade e de grande inocência.”'
