base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/002.yaml
  text: While I was considering these things and pondering them in my heart, I see before me a great white chair made of snowy wool. And an elderly woman came in most radiant clothing, holding a book in her hands, and sat down alone and greeted me, “Hermas, greetings.” And I, grieving and weeping, said, “Lady, greetings.”
translation:
  language: pt
  text: 'Enquanto eu refletia sobre essas coisas e as ponderava no coração, vi diante de mim uma grande cadeira branca, feita de lã branca como a neve. Então veio uma mulher idosa, vestida com roupas resplandecentes, trazendo um livro nas mãos. Ela se sentou sozinha e me saudou:


    — Salve, Hermas!


    E eu, triste e chorando, respondi:


    — Salve, senhora!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλευομένου καὶ διακρίνοντος ἐν τῇ καρδίᾳ μου
  choice: refletia sobre essas coisas e as ponderava no coração
  rationale: Reproduz os dois verbos de deliberação e discernimento interior sem tornar a frase artificial em português.
- source_word: βλέπω
  choice: vi
  rationale: Embora o grego use o presente histórico, o pretérito integra naturalmente a visão à narrativa portuguesa.
- source_word: καθέδραν
  choice: cadeira
  rationale: Designa aqui um assento, sem exigir a conotação régia ou eclesiástica de “trono” ou “cátedra”.
- source_word: ἐξ ἐρίων χιονίνων γεγονυῖαν
  choice: feita de lã branca como a neve
  rationale: Explicita em português natural a qualidade nívea atribuída à lã.
- source_word: γυνὴ πρεσβῦτις
  choice: mulher idosa
  rationale: Expressão atual e respeitosa para a idade avançada da personagem.
- source_word: ἐν ἱματισμῷ λαμπροτάτῳ
  choice: vestida com roupas resplandecentes
  rationale: Preserva o superlativo de brilho de maneira idiomática e dignificada.
- source_word: βιβλίον
  choice: livro
  rationale: Equivalente amplo e natural; evita especificar “rolo”, algo que o termo grego não exige neste contexto.
- source_word: χαῖρε
  choice: Salve
  rationale: Mantém a fórmula direta de saudação e permite preservar sua repetição no diálogo.
- source_word: Κυρία
  choice: senhora
  rationale: Conserva o tratamento respeitoso dirigido à mulher, sem acrescentar título teológico.
