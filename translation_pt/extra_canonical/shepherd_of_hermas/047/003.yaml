base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/003.yaml
  text: Listen to me, then, and fear the One who is able to do all things, to save and to destroy; and keep these commandments, and you will live to God.
translation:
  language: pt
  text: 'Ouçam-me, portanto, e temam aquele que tudo pode: salvar e destruir. Guardem estes mandamentos, e vocês viverão para Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατε οὖν μου
  choice: Ouçam-me, portanto
  rationale: Preserva o imperativo plural, o pronome regido pelo verbo e a conexão conclusiva de οὖν, em português atual e natural.
- source_word: τὸν πάντα δυνάμενον
  choice: aquele que tudo pode
  rationale: Reproduz de modo direto a abrangência de πάντα e a capacidade expressa por δυνάμενον, sem restringi-la antecipadamente aos infinitivos seguintes.
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: salvar e destruir
  rationale: Mantém o contraste forte entre os dois infinitivos aoristos; “destruir” comunica ἀπολέσαι sem acrescentar uma especificação não presente no texto.
- source_word: τηρεῖτε
  choice: Guardem
  rationale: Expressa a observância contínua dos mandamentos em linguagem corrente; aqui “guardar” significa obedecer e cumprir.
- source_word: ζήσεσθε τῷ Θεῷ
  choice: vocês viverão para Deus
  rationale: Conserva o futuro e a orientação dativa τῷ Θεῷ; “para Deus” mantém a formulação característica sem convertê-la em mera promessa de receber vida.
theological_decisions:
- issue: Relação entre πάντα δυνάμενον e σῶσαι καὶ ἀπολέσαι
  choice: '“aquele que tudo pode: salvar e destruir”'
  alternative: “aquele que pode salvar e destruir”
  rationale: A tradução escolhida preserva tanto a afirmação abrangente “tudo pode” quanto os infinitivos que a explicam ou exemplificam, sem reduzir πάντα a apenas duas ações.
- issue: Sentido de ζήσεσθε τῷ Θεῷ
  choice: “vocês viverão para Deus”
  alternative: “vocês viverão em Deus” ou “Deus lhes dará vida”
  rationale: O dativo permite uma orientação ou relação com Deus. “Para Deus” preserva essa tensão e evita introduzir uma ideia locativa ou causativa que o grego não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com formas plurais de ampla compreensão no Brasil e no espaço lusófono. A pontuação com dois-pontos torna clara a relação entre a capacidade universal e os infinitivos seguintes, sem eliminar a possível leitura explicativa.
