  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/006.yaml
  text: Foolish, double‑minded, and wretched man, do you not understand that all these things are alien, and are under the authority of another? For the lord of this city will say, ‘I do not want you to dwell in my city; rather, go out from this city, because you do not make use of my laws.’ So then, you—having fields and dwellings and many other possessions—when you are cast out by him, what will you do with your field and your house, and the rest of the things you have prepared for yourself? For the lord of this land says to you, rightly, ‘Either make use of my laws, or withdraw from my land.’ So then, what are you about to do, having…
translation:
  language: pt
  text: 'Homem insensato, de coração dividido e miserável! Você não entende que todas essas coisas são alheias e estão sob a autoridade de outro? Pois o senhor desta cidade dirá: “Não quero que você more na minha cidade. Saia dela, porque não vive segundo as minhas leis.” Portanto, você, que tem campos, casas e muitos outros bens, quando for expulso por ele, o que fará com seu campo, sua casa e tudo o mais que preparou para si? Pois o senhor desta terra lhe diz com toda a razão: “Ou viva segundo as minhas leis, ou saia da minha terra.” Portanto, o que você pretende fazer, tendo…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίψυχε
  choice: de coração dividido
  rationale: Expressa de modo natural a ideia de lealdade ou disposição interior dividida, preservando a força do grego sem recorrer ao pouco idiomático “de alma dupla”.
- source_word: ἀλλότριά
  choice: alheias
  rationale: Mantém a ideia de coisas que não pertencem ao destinatário, essencial à imagem de residência em território governado por outro.
- source_word: ὑπ᾽ ἐξουσίαν ἑτέρου
  choice: sob a autoridade de outro
  rationale: Reproduz diretamente a relação de domínio expressa no grego.
- source_word: τοῖς νόμοις μου οὐ χρᾶσαι / τοῖς νόμοις μου χρῶ
  choice: não vive segundo as minhas leis / viva segundo as minhas leis
  rationale: O uso literal de χράομαι, “fazer uso”, soa artificial com “leis” em português; “viver segundo” comunica naturalmente a submissão prática exigida no contexto.
- source_word: ὑπάρξεις
  choice: bens
  rationale: No contexto patrimonial, designa posses ou propriedades; “bens” é claro e inclui os diversos tipos mencionados.
theological_decisions:
- issue: Sentido moral da cidadania e das posses
  choice: Manter a fala como analogia sem identificar explicitamente a cidade, a terra ou seu senhor
  alternative: Explicitar a cidade terrena como este mundo e a cidade própria como a pátria celestial
  rationale: O trecho grego apresentado deixa essas correspondências implícitas; explicitá-las no corpo da tradução resolveria a imagem interpretativamente.
translation_notes:
  register: Português atual, digno e acessível, com tratamento por “você” para clareza ampla. A repetição de “senhor”, “cidade”, “terra” e “leis” foi preservada por estruturar a analogia. As reticências finais refletem que o segmento termina no início da oração seguinte, após ἔχων.
