  text: “You will keep them,” he says, “if you bend toward your own city.
translation:
  language: pt
  text: “Você os guardará”, diz ele, “se se inclinar para a sua própria cidade.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξεις
  choice: Você os guardará
  rationale: O verbo φυλάσσω retoma as ‘ordens/mandamentos’ do contexto anterior e pode significar guardar, observar ou cumprir. ‘Guardará’ preserva a imagem e a continuidade lexical; o pronome masculino concorda com ‘mandamentos’ em português.
- source_word: κάμψαι
  choice: se inclinar
  rationale: Embora a forma transmitida pareça textualmente ou tipograficamente problemática, o sentido atestado pela camada de consulta é o de inclinar-se ou voltar-se em direção a algo. ‘Inclinar-se’ conserva a metáfora sem explicá-la em excesso.
- source_word: τὴν ἰδίαν πόλιν
  choice: a sua própria cidade
  rationale: Traduz literalmente a expressão e mantém o contraste alegórico, desenvolvido no contexto, entre a cidade presente e a cidade à qual o fiel pertence.
theological_decisions:
- issue: Identidade da ‘própria cidade’
  choice: Manter a expressão sem identificar explicitamente a cidade
  alternative: Explicitar ‘cidade celestial’ ou ‘pátria celestial’
  rationale: O trecho usa linguagem alegórica e não faz essa identificação dentro da frase. A tradução preserva a tensão e deixa a interpretação emergir do contexto.
- issue: Objeto implícito de Φυλάξεις
  choice: Retomar os mandamentos por meio de ‘os’
  alternative: 'Traduzir sem objeto: ‘Você guardará’'
  rationale: O contexto imediatamente anterior menciona ‘estes mandamentos’. Em português, o pronome torna a retomada natural sem acrescentar conteúdo novo.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por ‘você’ para singularizar o interlocutor. A construção figurada ‘inclinar-se para’ foi mantida, apesar de menos idiomática que ‘voltar-se para’, por refletir mais de perto a imagem do texto grego transmitido.
