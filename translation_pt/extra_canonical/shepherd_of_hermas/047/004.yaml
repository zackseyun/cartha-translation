revisions:
- from: 'Eu lhe digo: “Senhor, agora fui fortalecido para cumprir todos os preceitos justos do Senhor, porque estás comigo. Sei que destruirás todo o poder do diabo, e nós o dominaremos e prevaleceremos contra todas as suas obras. E espero, senhor, que agora eu seja capaz de guardar estes mandamentos que ordenaste, pois o Senhor me fortalece.”'
  to: 'Eu lhe digo: “Senhor, agora fui fortalecido em todos os justos preceitos do Senhor, porque estás comigo; e sei que quebrarás todo o poder do diabo, e nós o dominaremos e prevaleceremos contra todas as suas obras. E espero, Senhor, que agora eu seja capaz de guardar estes mandamentos que ordenaste, com o Senhor me fortalecendo.”'
  rationale: A revisão remove explicitações desnecessárias de finalidade e causalidade, regulariza a capitalização do vocativo e emprega «quebrarás» para conservar mais de perto a imagem de esmagar ou quebrar em συγκόψεις. Não são necessárias notas, pois a possível distinção de identidade entre o interlocutor e «o Senhor» é preservada sem ser resolvida ou explicada no texto.
