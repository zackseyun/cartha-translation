base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/004.yaml
  text: I say to him, “Lord, now I have been strengthened in all the righteous requirements of the Lord, because you are with me; and I know that you will cut off all the devil’s power, and we shall gain mastery over him and prevail against all his works. And I hope, Lord, that now I can keep these commandments that you have commanded, with the Lord strengthening me.”
translation:
  language: pt
  text: 'Eu lhe digo: “Senhor, agora fui fortalecido em todos os justos preceitos do Senhor, porque estás comigo; e sei que quebrarás todo o poder do diabo, e nós o dominaremos e prevaleceremos contra todas as suas obras. E espero, Senhor, que agora eu seja capaz de guardar estes mandamentos que ordenaste, com o Senhor me fortalecendo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεδυναμώθην ἐν πᾶσι τοῖς δικαιώμασι
  choice: fui fortalecido para cumprir todos os preceitos justos
  rationale: A forma passiva de ἐνδυναμόω indica fortalecimento recebido; a construção com ἐν e δικαιώματα é expressa naturalmente em português com a finalidade implícita de cumprir os preceitos, sem reduzir δικαιώματα a uma justiça abstrata.
- source_word: συγκόψεις
  choice: destruirás
  rationale: O verbo traz a imagem de golpear, quebrar ou esmagar. “Destruirás” comunica de modo claro a derrota do poder do diabo sem exigir uma imagem corporal pouco natural em português.
- source_word: κατακυριεύσομεν
  choice: o dominaremos
  rationale: Preserva a ideia forte de obter domínio ou senhorio sobre o diabo, cujo pronome αὐτοῦ é retomado explicitamente.
- source_word: κατισχύσομεν
  choice: prevaleceremos contra
  rationale: Expressa superioridade vitoriosa diante das obras do diabo e mantém a coordenação com “dominaremos”.
- source_word: φυλάξαι
  choice: guardar
  rationale: “Guardar os mandamentos” é uma formulação portuguesa natural e conserva o sentido de observar fielmente, não apenas proteger.
- source_word: τοῦ Κυρίου ἐνδυναμοῦντος
  choice: pois o Senhor me fortalece
  rationale: O genitivo absoluto apresenta a capacitação do Senhor como circunstância ou fundamento da capacidade declarada. A oração explícita é mais clara em português.
theological_decisions:
- issue: Identidade do interlocutor chamado κύριε e referência subsequente a τοῦ Κυρίου
  choice: Manter “Senhor/senhor” no discurso direto e “o Senhor” na cláusula final, sem identificar explicitamente as figuras
  alternative: Interpretar todas as ocorrências como referência direta a Deus ou a Cristo
  rationale: O trecho distingue gramaticalmente o interlocutor presente e “o Senhor” que fortalece, mas não resolve aqui a identidade exata do interlocutor. A tradução preserva essa tensão sem impor uma cristologia ou angelologia específica.
- issue: Agência humana e fortalecimento divino na guarda dos mandamentos
  choice: Conservar tanto “eu seja capaz de guardar” quanto “o Senhor me fortalece”
  alternative: Reformular como obediência exclusivamente humana ou exclusivamente divina
  rationale: O grego reúne esperança e capacidade humanas com a ação capacitadora do Senhor; ambas devem permanecer em tensão.
- issue: Domínio sobre o diabo
  choice: Traduzir literalmente a afirmação coletiva “nós o dominaremos”
  alternative: Atenuar para “resistiremos a ele”
  rationale: κατακυριεύω é mais forte que mera resistência. A tradução não deve reduzir a linguagem de vitória do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. “Preceitos justos” evita o tecnicismo pouco transparente “justificações”. A distinção gráfica entre “Senhor” na invocação e “senhor” na segunda ocorrência sinaliza com discrição a possível diferença entre o interlocutor e o Senhor divino, sem acrescentar explicação ao texto.
