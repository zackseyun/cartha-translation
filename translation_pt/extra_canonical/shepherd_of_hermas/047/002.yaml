base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/002.yaml
  text: Therefore, believe God—you who, on account of your sins, have despaired of your life, and are adding sins and weighing down your life—that if you turn back to the Lord with your whole heart and work righteousness for the remaining days of your life, and serve him rightly according to his will, he will bring healing to your former sins, and you will have power to gain mastery over the works of the devil. And do not at all fear the devil’s threat; for he is powerless, like the sinews of a dead man.
translation:
  language: pt
  text: Portanto, creiam em Deus, vocês que, por causa dos seus pecados, perderam a esperança quanto à própria vida e continuam acrescentando pecados e sobrecarregando a própria vida. Pois, se vocês voltarem para o Senhor de todo o coração, praticarem a justiça nos dias que lhes restam e o servirem corretamente, segundo a vontade dele, ele trará cura para os pecados que vocês cometeram no passado[a], e vocês terão poder para dominar as obras do diabo. Não tenham medo algum da ameaça do diabo, pois ele é fraco, como os tendões de um morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «trará cura aos seus pecados anteriores».
    reason: Registra a construção incomum do grego e mostra que a metáfora de cura pertence ao texto-fonte.
lexical_decisions:
- source_word: ἀπεγνωκότες τὴν ζωὴν ὑμῶν
  choice: perderam a esperança quanto à própria vida
  rationale: Expressa o desespero indicado pelo particípio sem definir se «vida» se refere apenas à existência presente ou à vida diante de Deus.
- source_word: προστιθέντες ἁμαρτίαις
  choice: continuam acrescentando pecados
  rationale: Mantém a imagem cumulativa do grego e explicita o aspecto continuado do particípio.
- source_word: ἐργάσησθε τὴν δικαιοσύνην
  choice: praticarem a justiça
  rationale: Formulação natural que conserva o sentido ativo de fazer ou realizar aquilo que é justo.
- source_word: ποιήσει ἴασιν τοῖς προτέροις ὑμῶν ἁμαρτήμασι
  choice: trará cura para os pecados que vocês cometeram no passado
  rationale: Preserva a incomum metáfora de cura aplicada aos pecados, sem substituí-la por um termo teológico mais específico como «perdão».
- source_word: κατακυριεῦσαι
  choice: dominar
  rationale: Comunica aquisição de domínio ou senhorio sobre as obras do diabo, sem sugerir meramente resistência passiva.
- source_word: ἄτονος
  choice: não tem força
  rationale: Reproduz o sentido de falta de vigor ou tensão e se harmoniza com a comparação aos tendões de um morto.
theological_decisions:
- issue: Natureza da «cura» dos pecados passados
  choice: Manter a metáfora de cura
  alternative: Traduzir como «perdoará os pecados passados»
  rationale: O texto grego fala de ἴασις, «cura», e não usa diretamente o vocabulário habitual de perdão; a tradução evita resolver a relação teológica entre arrependimento, cura e perdão.
- issue: Sentido de «vida» no desespero dos pecadores
  choice: Conservar «vida» sem qualificação
  alternative: Interpretar como «salvação» ou «vida eterna»
  rationale: ζωή permite uma referência mais ampla, e o contexto não exige que a tradução escolha uma interpretação escatológica específica.
- issue: Capacidade de dominar as obras do diabo
  choice: Atribuir o poder aos ouvintes conforme a construção do texto
  alternative: Acrescentar explicitamente «pelo poder de Deus»
  rationale: Embora o contexto pressuponha a ação divina, o versículo afirma diretamente que os ouvintes terão poder; não se acrescenta uma explicação ausente nesta unidade.
translation_notes:
  register: Português atual, digno e acessível, com «vocês» e construções de boa legibilidade brasileira. A repetição de «própria vida» conserva a insistência retórica do original; a sintaxe foi dividida em períodos naturais sem eliminar a progressão condicional e exortativa.
