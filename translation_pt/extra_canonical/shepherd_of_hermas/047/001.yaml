translation:
  language: pt
  text: …para firmá-los na fé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιῆσαι
  choice: firmar
  rationale: Neste contexto, o infinitivo não indica simplesmente “fazer”, mas levar pessoas a uma condição de firmeza ou consolidação.
- source_word: αὐτοὺς
  choice: -los
  rationale: Preserva o referente masculino plural do pronome grego, cujo antecedente se encontra no contexto anterior.
- source_word: ἐν τῇ πίστει
  choice: na fé
  rationale: Reproduz de modo natural a esfera indicada pela preposição ἐν, sem explicitar indevidamente se “fé” significa confiança, fidelidade ou o conteúdo crido.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade
  rationale: “Fé” mantém a amplitude semântica do grego e preserva a possível referência tanto à confiança quanto à vida de fé; o fragmento isolado não justifica restringir o sentido.
translation_notes:
  register: Formulação breve, digna e corrente em português. As reticências preservam o fato de que o segmento começa no fim de uma frase anterior.
