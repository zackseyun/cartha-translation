revisions:
- from: Mas não é por isso que Deus está irado com você, e sim para que você faça voltar a sua família, que pecou contra o Senhor e contra nós, os pais deles. Contudo, por amar demais os seus filhos, você não corrigia a sua família, mas deixou que ela se corrompesse terrivelmente. É por isso que o Senhor está irado com você. Mas ele curará todos os males que anteriormente ocorreram em sua família, pois, por causa dos pecados e das transgressões deles, você mesmo foi arruinado em seus negócios desta vida.
  to: Mas não é por isso que Deus está irado com você, mas para que faça sua casa, que pecou, voltar-se para o Senhor e para nós, os pais deles.[a] Contudo, por ser demasiado apegado aos seus filhos, você não admoestou sua casa, mas a deixou corromper-se terrivelmente. Por isso o Senhor está irado com você. Mas ele sanará todos os males passados em sua casa; pois, por causa dos pecados e das transgressões deles, você mesmo foi arruinado pelas ocupações desta vida.
  rationale: A revisão restitui os dois complementos de «voltar-se», usa «casa» para o coletivo doméstico e amplia «ocupações desta vida» para o alcance de βιωτικῶν πράξεων. Mantém-se a formulação difícil «nós, os pais deles», agora assinalada em nota, sem impor uma solução interpretativa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:34:47Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha bem o sentido geral e preserva a construção final da ira corretiva. Contudo, «faça voltar a sua família» é pouco natural e não explicita os complementos «para o Senhor e para nós» presentes no grego. «Em seus negócios desta vida» restringe βιωτικῶν πράξεων indevidamente a negócios, enquanto a expressão abrange ocupações e assuntos da vida comum.
  naturalness: 'O registro é claro e contemporâneo. Convém substituir «faça voltar» por uma construção idiomática («faça sua casa voltar-se») e ajustar os tempos verbais para refletir melhor a repreensão direta: «não admoestou ... deixou».'
  terminology: «Casa» preserva melhor οἶκος como coletivo doméstico, sem reduzi-lo à família nuclear. «Admoestou» mantém o caráter de exortação corretiva de ἐνουθέτεις; «transgressões» é adequado para ἀνομήματα. A expressão textual difícil «nós, os pais deles» deve ser mantida, com nota breve.
  issues:
  - severity: medium
    issue: Omissão dos destinos de ἐπιστρέψῃς
    rationale: O grego diz que a casa deve voltar-se «para o Senhor e para nós, os pais deles». O rascunho traz apenas «faça voltar a sua família», sem esses complementos essenciais.
  - severity: medium
    issue: Restrição de βιωτικῶν πράξεων a «negócios»
    rationale: A expressão se refere mais amplamente a atividades, ocupações ou assuntos da vida cotidiana/secular; «negócios» pode sugerir exclusivamente comércio.
  - severity: low
    issue: Formulação e tempos verbais na admoestação
    rationale: «Fazer voltar» soa pouco idiomático em português, e «não corrigia» sugere uma ação contínua no passado, embora a repreensão direta seja mais bem expressa por «não admoestou».
