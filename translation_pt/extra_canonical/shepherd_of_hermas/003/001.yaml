base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/001.yaml
  text: But it is not for this that God is angry with you, but so that you may turn back your household, which has sinned against the Lord and against us, their parents. Yet, being fond of your children, you did not admonish your household, but you let it be grievously ruined; for this the Lord is angry with you. But he will heal all the past evils in your household; for because of their sins and lawless deeds you yourself were ruined by worldly affairs.
translation:
  language: pt
  text: Mas não é por isso que Deus está irado com você, mas para que faça sua casa, que pecou, voltar-se para o Senhor e para nós, os pais deles.[a] Contudo, por ser demasiado apegado aos seus filhos, você não admoestou sua casa, mas a deixou corromper-se terrivelmente. Por isso o Senhor está irado com você. Mas ele sanará todos os males passados em sua casa; pois, por causa dos pecados e das transgressões deles, você mesmo foi arruinado pelas ocupações desta vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz literalmente «para nós, os pais deles». O referente da primeira pessoa do plural é difícil e foi preservado sem harmonização.
    reason: Esclarece uma construção textual incomum sem alterar sua ambiguidade.
lexical_decisions:
- source_word: οἶκος
  choice: família
  rationale: Neste contexto, refere-se às pessoas da casa, especialmente aos filhos, e não ao edifício; “família” comunica isso naturalmente em português.
- source_word: ἐπιστρέψῃς
  choice: faça voltar
  rationale: Preserva o sentido causativo de levar a família a retornar, sem explicitar além do grego o objeto ou a forma desse retorno.
- source_word: φιλότεκνος
  choice: por amar demais os seus filhos
  rationale: O contexto apresenta o afeto parental como motivo de indulgência; “demais” comunica essa nuance crítica sem transformar o amor em algo intrinsecamente mau.
- source_word: ἐνουθέτεις
  choice: corrigia
  rationale: Expressa a admoestação formativa e disciplinadora em linguagem comum e digna.
- source_word: καταφθαρῆναι
  choice: se corrompesse terrivelmente
  rationale: Mantém a forte ideia de deterioração moral indicada pelo verbo e pelo advérbio δεινῶς.
- source_word: ἀνομήματα
  choice: transgressões
  rationale: Representa atos contrários à lei sem introduzir terminologia denominacional.
- source_word: βιωτικῶν πράξεων
  choice: negócios desta vida
  rationale: Abrange ocupações e assuntos seculares ou cotidianos, preservando o contraste implícito com a vida espiritual.
theological_decisions:
- issue: Finalidade da ira divina em ἵνα
  choice: “e sim para que você faça voltar”
  alternative: “mas [ele está irado] porque você deve fazer voltar”
  rationale: Mantém a construção final do grego, segundo a qual a ira tem caráter corretivo, embora a formulação permaneça sintaticamente tensa.
- issue: Referente de “nós, os pais deles”
  choice: Preservar literalmente a primeira pessoa do plural
  alternative: Normalizar para “vocês, os pais deles” ou “você, pai deles”
  rationale: O grego diz εἰς ἡμᾶς τοὺς γονεῖς αὐτῶν, uma leitura difícil; a tradução conserva essa tensão textual em vez de corrigir silenciosamente o referente.
- issue: Agência no sofrimento de Hermas
  choice: “você mesmo foi arruinado em seus negócios desta vida”
  alternative: “você foi prejudicado por seus afazeres mundanos”
  rationale: Preserva a voz passiva e a intensidade de κατεφθάρης, sem afirmar um agente que o texto não identifica.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” conforme a consulta inglesa e boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mas as repetições de “família”, “irado” e a difícil expressão “nós, os pais deles” foram mantidas por sua relevância textual.
