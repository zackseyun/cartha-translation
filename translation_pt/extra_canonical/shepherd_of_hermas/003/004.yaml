base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/004.yaml
  text: “Behold, the God of hosts, who by his invisible and mighty power and by his great understanding created the world, and by his glorious counsel adorned his creation with beauty, and by his mighty word fixed the heaven and founded the earth upon the waters, and by his own wisdom and providence created his holy church, which also he blessed—behold, he is moving the heavens and the mountains and the hills and the seas, and all things become level for his elect, in order that he may give to them the promise which he promised with much glory and joy, if they keep the statutes of God which they received with great faith.”
translation:
  language: pt
  text: “Eis o Deus dos exércitos, que, por seu poder invisível e forte e por seu grande entendimento, criou o mundo; que, por seu glorioso desígnio, revestiu sua criação de beleza; que, por sua palavra poderosa, firmou o céu e fundou a terra sobre as águas; e que, por sua própria sabedoria e providência, criou sua santa Igreja, a qual também abençoou — eis que ele desloca os céus, as montanhas, as colinas e os mares, e tudo se torna plano para seus eleitos, a fim de lhes conceder a promessa que lhes prometeu com muita glória e alegria, se guardarem os preceitos de Deus que receberam com grande fé.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν δυνάμεων
  choice: o Deus dos exércitos
  rationale: Preserva a expressão tradicional de matriz bíblica e o sentido de Deus como Senhor das hostes, sem reduzir δυνάμεις simplesmente a uma qualidade abstrata.
- source_word: συνέσει
  choice: inteligência
  rationale: Expressa a capacidade de compreender e ordenar, distinguindo-a de σοφία, traduzida depois como “sabedoria”.
- source_word: βουλῇ
  choice: desígnio
  rationale: Comunica deliberação e propósito, mantendo o tom elevado sem sugerir apenas conselho recebido de terceiros.
- source_word: περιθεὶς τὴν εὐπρέπειαν
  choice: revestiu de beleza
  rationale: Reproduz a imagem de colocar beleza ao redor ou sobre a criação em português natural e digno.
- source_word: πήξας
  choice: firmou
  rationale: Mantém a ideia cosmológica de fixar ou estabelecer solidamente o céu.
- source_word: προνοίᾳ
  choice: providência
  rationale: Conserva o sentido de cuidado e ordenação previdente, bem estabelecido em linguagem teológica ampla.
- source_word: μεθίστησιν
  choice: desloca
  rationale: Mantém a força concreta de mover ou remover sem decidir além do texto se se trata de transformação escatológica literal ou figurada.
- source_word: ὁμαλὰ γίνεται
  choice: tudo se torna plano
  rationale: Preserva a imagem de nivelamento do caminho ou dos obstáculos em benefício dos eleitos.
- source_word: νόμιμα
  choice: preceitos
  rationale: Transmite normas ou determinações divinas; é mais natural neste contexto que “estatutos”, sem diluir a obrigação de observá-las.
theological_decisions:
- issue: Identidade e número de ἡ ἁγία ἐκκλησία
  choice: a sua santa Igreja
  alternative: sua santa assembleia
  rationale: “Igreja” corresponde ao uso cristão antigo de ἐκκλησία e preserva a referência institucional e comunitária sem acrescentar uma definição denominacional.
- issue: Condição introduzida por ἐὰν
  choice: se guardarem os preceitos de Deus
  alternative: desde que guardem os preceitos de Deus
  rationale: Mantém explicitamente a condição formulada pelo texto, sem explicar sua relação com graça, mérito ou perseverança.
- issue: Referente da promessa
  choice: a promessa que fez
  alternative: aquilo que lhes prometeu
  rationale: Preserva a repetição enfática de ἐπαγγελίαν/ἐπηγγείλατο sem especificar o conteúdo que o trecho não define.
- issue: Sentido escatológico de μεθίστησιν
  choice: ele desloca os céus, as montanhas, as colinas e os mares
  alternative: ele remove os céus, as montanhas, as colinas e os mares
  rationale: “Desloca” conserva a ação extraordinária e a possível imagem de remoção de obstáculos, sem impor uma leitura exclusivamente cósmica ou metafórica.
translation_notes:
  register: Português moderno, amplo e solene, com boa legibilidade brasileira. A longa estrutura periódica do grego foi preservada, mas organizada com ponto e vírgula e travessões para facilitar a leitura. O imperativo plural “Vejam” torna ἰδού natural para leitores atuais, mantendo sua função de chamada enfática.
