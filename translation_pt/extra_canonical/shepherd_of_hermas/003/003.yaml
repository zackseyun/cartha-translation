base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/003.yaml
  text: 'After she had stopped these words, she says to me, “Do you wish to hear me reading?” And I say, “I do, Lady.” She says to me, “Become a hearer, and hear the glories of God.” I heard great and wondrous things which I was not able to remember; for all the words were terrifying—things a human being is not able to bear. So I remembered the last words, for they were beneficial and gentle for us:'
translation:
  language: pt
  text: 'Depois que ela terminou de dizer estas palavras, disse-me: “Você quer me ouvir ler?” Respondi: “Quero, senhora.” Ela me disse: “Torne-se ouvinte e escute as glórias de Deus.” Ouvi coisas grandiosas e maravilhosas, das quais não fui capaz de me lembrar, pois todas as palavras eram terríveis, coisas que um ser humano não é capaz de suportar. Lembrei-me, então, das últimas palavras, pois eram proveitosas e suaves para nós:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τὸ παῦσαι αὐτῆς τὰ ῥήματα ταῦτα
  choice: Depois que ela terminou de dizer essas palavras
  rationale: Expressa de modo natural a construção temporal grega e entende o genitivo αὐτῆς como sujeito de παῦσαι, sem reproduzir a aspereza literal.
- source_word: ἀναγινωσκούσης
  choice: ler
  rationale: No contexto, o particípio refere-se à leitura em voz alta; “me ouvir ler” comunica isso naturalmente em português.
- source_word: Γενοῦ ἀκροατής
  choice: Faça-se ouvinte
  rationale: Preserva a formulação enfática e incomum do grego, em vez de reduzi-la simplesmente a “ouça”.
- source_word: τὰς δόξας τοῦ Θεοῦ
  choice: as glórias de Deus
  rationale: Mantém o plural concreto e a abertura semântica de δόξαι.
- source_word: μεγάλως καὶ θαυμαστῶς
  choice: coisas grandiosas e maravilhosas
  rationale: A versão substantivada é mais idiomática em português e corresponde ao sentido adverbial daquilo que foi ouvido.
- source_word: ἔκφρικτα
  choice: assombrosas
  rationale: Comunica o caráter que provoca temor e estremecimento sem impor a ideia mais estreita de terror maligno.
- source_word: βαστάσαι
  choice: suportar
  rationale: Conserva a imagem de carregar ou aguentar palavras que excedem a capacidade humana.
- source_word: σύμφορα καὶ ἥμερα
  choice: proveitosas e suaves
  rationale: “Proveitosas” expressa benefício; “suaves” preserva o contraste de ἥμερα com as palavras assombrosas anteriores.
theological_decisions:
- issue: Sentido de “as glórias de Deus”
  choice: Manter o plural “as glórias de Deus”
  alternative: “a glória de Deus” ou “os feitos gloriosos de Deus”
  rationale: O grego traz o plural e não esclarece se se trata de atributos, manifestações ou feitos; a tradução preserva essa ambiguidade.
- issue: Intensidade de ἔκφρικτα
  choice: “assombrosas”
  alternative: “aterrorizantes”
  rationale: A escolha conserva reverência e temor diante da revelação sem sugerir necessariamente pavor condenatório.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” no diálogo e “senhora” como forma respeitosa. A sintaxe foi tornada natural sem eliminar as repetições e o tom visionário do original.
