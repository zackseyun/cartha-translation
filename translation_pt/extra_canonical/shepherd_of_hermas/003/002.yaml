base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/002.yaml
  text: But the Lord’s abundant compassion has had mercy on you and your household, and he will strengthen you and establish you in his glory. Only do not be slothful, but take heart and strengthen your household. For, as the blacksmith hammering his work masters the thing he intends, so also the righteous word spoken daily prevails over every wickedness. Do not, therefore, cease admonishing your children; for I know that if they repent with their whole heart, they will be written in the books of life with the holy ones.
translation:
  language: pt
  text: Mas a imensa compaixão do Senhor teve misericórdia de você e de sua casa; ele o fortalecerá e o firmará em sua glória. Apenas não seja negligente; tenha coragem e fortaleça sua casa. Pois, assim como o ferreiro, ao martelar sua obra, domina aquilo que deseja, também a palavra justa, proferida diariamente, vence toda maldade. Portanto, não deixe de admoestar seus filhos, pois sei que, se eles se arrependerem de todo o coração, serão inscritos nos livros da vida junto com os santos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολυσπλαγχνία
  choice: imensa compaixão
  rationale: Expressa a grande profundidade da misericórdia indicada pelo composto grego, em linguagem natural e digna.
- source_word: οἶκόν
  choice: casa
  rationale: Preserva a amplitude de οἶκος, que neste contexto abrange a família ou o lar, sem reduzi-lo apenas à construção física.
- source_word: ῥαθυμήσῃς
  choice: seja negligente
  rationale: Comunica a ideia de indolência, descuido ou falta de empenho no dever de corrigir e fortalecer a família.
- source_word: εὐψύχει
  choice: tenha coragem
  rationale: Equivalente corrente para a exortação a recobrar o ânimo e agir com firmeza.
- source_word: περιγίνεται
  choice: domina / vence
  rationale: O verbo denota prevalecer, levar vantagem ou obter domínio; a variação em português se ajusta aos objetos da comparação sem alterar o paralelo.
- source_word: νουθετῶν
  choice: admoestar
  rationale: Mantém o sentido de instruir mediante advertência ou correção, em registro digno e compreensível.
- source_word: ἐγγραφήσονται
  choice: serão inscritos
  rationale: Reproduz a imagem formal de registrar nomes em livros.
theological_decisions:
- issue: Referente de αὐτοῦ em 'sua glória'
  choice: sua glória, referindo-se ao Senhor
  alternative: glória de Deus em sentido mais genericamente explícito
  rationale: O antecedente imediato é 'o Senhor'; a tradução preserva a referência pronominal do grego.
- issue: Plural 'livros da vida'
  choice: livros da vida
  alternative: livro da vida
  rationale: Mantém o plural explícito βίβλους e evita harmonização silenciosa com fórmulas canônicas no singular.
- issue: Condição ligada ao arrependimento
  choice: se eles se arrependerem de todo o coração, serão inscritos
  alternative: quando se arrependerem...
  rationale: Preserva a construção condicional ἐὰν com subjuntivo e sua tensão exortativa.
- issue: Identidade dos 'santos'
  choice: os santos
  alternative: o povo santo / os consagrados
  rationale: Mantém o termo tradicional e a ambiguidade quanto ao grupo exato referido.
translation_notes:
  register: Português moderno, internacional e de fácil leitura no Brasil, com tom pastoral e digno. Conservou-se a metáfora do ferreiro e o plural textual 'livros da vida'. Não foram necessários marcadores de nota no texto.
