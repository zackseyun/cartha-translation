  text: So when she had finished reading and had risen from the chair, four young men came, lifted the chair, and went away toward the east.
translation:
  language: pt
  text: Assim, quando ela terminou de ler e se levantou da cadeira, vieram quatro jovens, ergueram a cadeira e foram embora em direção ao leste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίαι
  choice: jovens
  rationale: Traduz naturalmente o substantivo grego para homens jovens sem acrescentar uma caracterização ausente no texto.
- source_word: ἦραν
  choice: pegaram
  rationale: Neste contexto, exprime o ato de erguer e levar a cadeira em português corrente; evita a possível leitura cultual de «elevaram».
- source_word: πρὸς τὴν ἀνατολήν
  choice: em direção ao leste
  rationale: Preserva o sentido direcional da preposição πρὸς e traduz ἀνατολήν pelo ponto cardeal indicado no contexto.
