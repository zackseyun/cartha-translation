base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/002.yaml
  text: Then she called me over, touched my chest, and said to me, "Did my reading please you?" And I said to her, "Lady, these last things please me, but the earlier things are hard and harsh." But she said to me, "These last things are for the righteous, but the earlier are for the nations and for the apostates."
translation:
  language: pt
  text: 'Então ela me chamou para perto, tocou no meu peito e me perguntou: “Você gostou da minha leitura?” Eu lhe respondi: “Senhora, estas últimas coisas me agradam, mas as anteriores são difíceis e duras.” Ela, porém, me disse: “Estas últimas coisas são para os justos; as anteriores, para as nações e para os apóstatas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεῖται
  choice: chamou para perto
  rationale: Expressa de modo natural o sentido de convocar alguém para junto de si.
- source_word: ἥψατο τοῦ στήθους μου
  choice: tocou no meu peito
  rationale: Tradução direta e idiomática do gesto físico, sem acrescentar interpretação simbólica.
- source_word: ἡ ἀνάγνωσίς μου
  choice: minha leitura
  rationale: Preserva a referência ao ato ou conteúdo lido pela mulher, mantendo a formulação concisa do grego.
- source_word: χαλεπὰ καὶ σκληρά
  choice: difíceis e duras
  rationale: 'Mantém os dois qualificativos e sua intensidade: algo difícil de receber e severo em teor.'
- source_word: τοῖς ἔθνεσιν
  choice: para as nações
  rationale: Preserva a amplitude e a possível ambiguidade de ἔθνη, em vez de restringi-lo necessariamente a “gentios”.
- source_word: τοῖς ἀποστάταις
  choice: para os apóstatas
  rationale: Reproduz o sentido de pessoas que se afastaram ou apostataram, sem especificar além do texto.
theological_decisions:
- issue: Referente de “estas últimas coisas” e “as anteriores”
  choice: Manter as expressões demonstrativas sem explicitação
  alternative: Explicitar como “a última parte da leitura” e “a parte anterior”
  rationale: O grego aponta para porções do que foi lido, mas não formula essa explicação; a tradução preserva a forma e a tensão do texto.
- issue: Sentido de ἔθνη
  choice: “nações”
  alternative: “gentios”
  rationale: “Nações” mantém a extensão lexical do termo e evita decidir se a passagem usa uma categoria estritamente religiosa ou étnica.
translation_notes:
  register: Português moderno, claro e digno, com tratamento direto por “você” e vocabulário acessível. A ordem argumentativa e os contrastes do grego foram preservados sem rigidez artificial.
