- from: 'Enquanto ela falava comigo, apareceram dois homens, que a tomaram pelos cotovelos e foram para onde também estava a cadeira, em direção ao leste. Ela partiu alegre e, enquanto ia, disse-me: “Tenha coragem, Hermas.”'
  to: 'Enquanto ela falava comigo, apareceram dois homens, levantaram-na pelos cotovelos e foram para onde também estava a cadeira, em direção ao leste. Ela partiu alegre e, enquanto ia, disse-me: “Tenha coragem, Hermas.”'
  rationale: A revisão substitui «a tomaram» por «levantaram-na», restaurando a ação expressa por ἦραν e preservando a ambiguidade narrativa quanto à maneira exata como os homens a conduziram. O restante do texto permanece inalterado por ser fiel e natural.
