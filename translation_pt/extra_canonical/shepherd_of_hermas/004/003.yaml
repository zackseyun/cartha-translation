base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/003.yaml
  text: While she was speaking with me, two men appeared, lifted her by the elbows, and went away to where the chair also was, toward the east. She went away cheerful, and as she was going she said to me, "Take courage, Hermas."
translation:
  language: pt
  text: 'Enquanto ela falava comigo, apareceram dois homens, levantaram-na pelos cotovelos e foram para onde também estava a cadeira, em direção ao leste. Ela partiu alegre e, enquanto ia, disse-me: “Tenha coragem, Hermas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλούσης αὐτῆς μετʼ ἐμοῦ
  choice: Enquanto ela falava comigo
  rationale: Reproduz com naturalidade a construção temporal do genitivo absoluto e preserva o sentido de diálogo.
- source_word: ἦραν αὐτὴν τῶν ἀγκώνων
  choice: a tomaram pelos cotovelos
  rationale: Mantém a referência corporal específica de ἀγκώνων sem acrescentar que a carregaram ou ergueram, ação que o contexto não define de modo inequívoco.
- source_word: πρὸς τὴν ἀνατολήν
  choice: em direção ao leste
  rationale: Expressa o movimento direcional de πρός e usa uma indicação geográfica corrente.
- source_word: ἱλαρά
  choice: alegre
  rationale: Comunica o estado bem-disposto e jubiloso indicado pelo adjetivo, em linguagem simples e digna.
- source_word: Ἀνδρίζου
  choice: Tenha coragem
  rationale: Transmite a exortação a mostrar coragem ou firmeza sem recorrer ao sentido literalmente masculino, pouco natural no português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe narrativa foi suavemente ajustada à ordem natural do português, sem eliminar a repetição deliberada do movimento para o leste nem explicitar a identidade simbólica da mulher.
