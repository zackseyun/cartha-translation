  naturalness: O texto é claro e de registro apropriado. «Levantararam-na pelos cotovelos» é uma formulação um pouco incomum, mas é natural o bastante e conserva a imagem corporal específica do grego sem explicar além do texto.
  terminology: «Leste», «alegre» e «Tenha coragem» são escolhas adequadas. «Tenha coragem» transmite bem a exortação Ἀνδρίζου sem importar uma conotação de gênero que não funciona como equivalente idiomático em português atual.
