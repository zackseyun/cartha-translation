  text: 2. Seeing me girded and ready to serve him, he says, “Call the men whose rods have been planted, by rank, just as each gave the rods.” And I went out to the field and called them all; and they all stood in their ranks.
translation:
  language: pt
  text: '2. Ao me ver com o avental amarrado e pronto para servi-lo, ele disse: “Chame os homens cujas varas foram plantadas, na mesma ordem em que cada um entregou as varas”. Fui ao campo e chamei todos; e todos se colocaram em seus grupos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em suas respectivas posições” ou “segundo suas categorias”.'
    reason: O plural τάγματα pode designar grupos, fileiras, posições ou categorias organizadas; o contexto não determina uma única nuance.
lexical_decisions:
- source_word: περιεζωσμένον
  choice: com o avental amarrado
  rationale: 'Retoma o ὠμόλινον do contexto imediato: uma peça de tecido grosseiro atada ao corpo para o serviço. A formulação natural evita o arcaísmo pouco claro “cingido”.'
- source_word: διακονεῖν
  choice: servi-lo
  rationale: Expressa o serviço ou auxílio prestado ao pastor sem acrescentar uma conotação eclesiástica específica.
- source_word: ῥάβδοι
  choice: varas
  rationale: Mantém a imagem concreta de ramos ou bastões plantados, em continuidade com a parábola.
- source_word: κατὰ τὸ τάγμα / κατὰ τὰ τάγματα
  choice: na mesma ordem / em seus grupos
  rationale: τάγμα pode indicar ordem, posição ou agrupamento. A tradução varia naturalmente conforme a construção, preservando a ideia de organização correspondente à entrega anterior.
- source_word: πεδίον
  choice: campo
  rationale: Equivalente corrente e direto para a área aberta onde os homens estavam reunidos.
