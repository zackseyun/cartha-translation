  text: 5. Then those who had the dry but not cut [rods] handed them in. And some of them handed in their rods green, but others dry and cut, as if worm-eaten. So those who had handed in green [rods] he ordered to stand apart, but those with dry—
translation:
  language: pt
  text: 5. Depois entregaram as varas aqueles que as tinham secas, mas não cortadas. Alguns deles entregaram suas varas verdes; outros, porém, secas e cortadas, como se tivessem sido roídas por traças. Então ele mandou os que haviam entregue varas verdes ficar à parte; mas os que haviam entregue varas secas—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδοι
  choice: varas
  rationale: No contexto da parábola, designa os ramos ou bastões plantados e depois retirados; “varas” é claro, concreto e coerente com a imagem.
- source_word: χλωράς
  choice: verdes
  rationale: Preserva o contraste direto com “secas” e sugere varas ainda vivas ou viçosas sem acrescentar uma interpretação.
- source_word: κεκομμένας
  choice: cortadas
  rationale: Reproduz o sentido do particípio perfeito e mantém a distinção recorrente entre varas secas cortadas e não cortadas.
- source_word: ὡς ὑπὸ σητός
  choice: como se estivessem roídas por vermes
  rationale: Expressa de modo natural a aparência de dano causado por organismo roedor; “como se” preserva a comparação, sem afirmar a causa como fato.
theological_decisions:
- issue: Possível significado simbólico dos diferentes estados das varas
  choice: 'Manter apenas a descrição concreta: verdes, secas, cortadas e roídas'
  alternative: Antecipar na tradução categorias morais ou espirituais representadas pelas varas
  rationale: A interpretação alegórica pertence à explicação posterior do texto; inseri-la aqui eliminaria a tensão narrativa e importaria uma leitura não explicitada neste versículo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. A frase termina com travessão porque o segmento-fonte fornecido se interrompe após “os [que entregaram] secas”, deixando a construção incompleta.
