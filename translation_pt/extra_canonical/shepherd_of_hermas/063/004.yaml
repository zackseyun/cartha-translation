  text: 4. First those who had the dry and cut [rods] handed them in, and they were found likewise to be dry and cut; and he ordered them to stand apart.
translation:
  language: pt
  text: 4. Primeiro, os que tinham varas secas e cortadas as entregaram; e verificou-se que estavam igualmente secas e cortadas. Ele lhes ordenou que ficassem à parte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδοι
  choice: varas
  rationale: No contexto da comparação, designa ramos ou varas plantados; “varas” preserva a imagem concreta e mantém a coerência com a ação de entregá-las.
- source_word: κεκομμένας
  choice: cortadas
  rationale: Traduz diretamente o particípio perfeito passivo, preservando tanto o estado resultante quanto a ação anterior.
- source_word: ἐπέδωκαν
  choice: entregaram
  rationale: Expressa com naturalidade a devolução das varas ao pastor no contexto imediato.
- source_word: εὑρέθησαν
  choice: verificou-se que continuavam
  rationale: O passivo indica o estado constatado após a inspeção; “continuavam” torna natural a correspondência marcada por ὡσαύτως sem mudar o sentido.
- source_word: χωρὶς σταθῆναι
  choice: ficassem separados
  rationale: Reproduz a ordem de permanecer à parte como grupo distinto, em português corrente e digno.
