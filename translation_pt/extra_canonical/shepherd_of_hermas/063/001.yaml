  yaml_path: translation/extra_canonical/shepherd_of_hermas/063/001.yaml
  text: And after a few days we came to the place, and the Shepherd sat down in the place of the angel, and I stood beside him. And he says to me, “Gird yourself with a raw-linen garment, and serve me.” So I girded myself with a clean raw-linen garment made from sackcloth.
translation:
  language: pt
  text: 'Depois de poucos dias, fomos ao lugar. O Pastor sentou-se no lugar do anjo, e eu fiquei de pé ao lado dele. Então ele me disse: “Vista-se com uma peça de linho cru e sirva-me.” Assim, vesti uma peça limpa de linho cru, feita de tecido de saco.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμήν
  choice: Pastor
  rationale: Mantém o título tradicional da personagem e corresponde diretamente ao sentido grego de alguém que apascenta.
- source_word: περίζωσαι / περιεζωσάμην
  choice: vista-se / vesti
  rationale: O verbo descreve prender uma peça de roupa ao redor do corpo. Em português corrente, “vestir-se com” comunica a ação com naturalidade sem especificar um formato de veste que o texto não define.
- source_word: ὠμόλινον
  choice: peça de linho cru
  rationale: O termo designa algo feito de linho não trabalhado ou cru. “Peça” preserva a indefinição quanto ao formato exato da veste.
- source_word: ἐκ σάκκου γεγονός
  choice: feita de tecido de saco
  rationale: Reproduz a indicação material do grego sem confundir a veste com um saco propriamente dito.
- source_word: διακόνει μοι
  choice: sirva-me
  rationale: Expressa de modo direto o serviço pessoal solicitado pelo Pastor, sem acrescentar conotação eclesiástica técnica.
