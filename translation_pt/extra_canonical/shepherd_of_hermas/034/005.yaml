  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/005.yaml
  text: 5. “Why,” I said, “sir, did you say about those who keep his commandments, ‘They will live to God’?” “Because,” he said, “all creation fears the Lord, but it does not keep his commandments. Therefore the life of those who fear him and keep his commandments is with God; but for those who do not keep his commandments, there is not even life in them.”
translation:
  language: pt
  text: '5. Eu perguntei: “Por que, senhor, você disse a respeito dos que guardam os mandamentos dele: ‘Viverão para Deus’?” Ele respondeu: “Porque toda a criação teme o Senhor, mas não guarda os mandamentos dele. Portanto, os que o temem e guardam os seus mandamentos têm a vida junto de Deus; mas os que não guardam os seus mandamentos nem sequer têm vida nele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρούντων / φυλασσόντων
  choice: guardam
  rationale: Mantém a repetição e o sentido de observar fielmente os mandamentos, em português bíblico atual e claro.
- source_word: πᾶσα ἡ κτίσις
  choice: toda a criação
  rationale: Equivalência direta e natural, preservando a abrangência da expressão grega.
- source_word: ζήσονται τῷ Θεῷ
  choice: Viverão para Deus
  rationale: Preserva o dativo grego e sua possível tensão sem reduzi-lo a uma formulação interpretativa como “viverão com Deus”.
- source_word: ἡ ζωή ἐστι παρὰ τῷ Θεῷ
  choice: têm a vida junto de Deus
  rationale: Expressa de modo natural que a vida dessas pessoas se encontra na presença ou esfera de Deus, sem identificar esta frase com o dativo anterior.
- source_word: οὐδὲ ζωὴ ἐν αὐτῷ
  choice: nem sequer têm vida nele
  rationale: Reproduz a força de οὐδέ e mantém o referente masculino singular de αὐτῷ, que no contexto imediato aponta para Deus.
theological_decisions:
- issue: Sentido de ζήσονται τῷ Θεῷ
  choice: “Viverão para Deus”
  alternative: “Viverão com Deus” ou “estarão vivos diante de Deus”
  rationale: O dativo permite nuances; a formulação escolhida conserva a ambiguidade e ecoa a expressão anterior do Mandato sem impor uma leitura escatológica específica.
- issue: Relação entre temor, obediência e vida
  choice: Manter a sequência causal do texto sem explicação doutrinária adicional
  alternative: Explicitar a obediência como condição meritória ou apenas como evidência
  rationale: O grego associa temor e guarda dos mandamentos à vida junto de Deus, mas não define aqui um sistema soteriológico; a tradução não deve resolver essa tensão.
- issue: Referente de ἐν αὐτῷ
  choice: “nele”, referindo-se a Deus
  alternative: “neles”, seguindo a leitura interpretativa do inglês de consulta
  rationale: O pronome grego está no masculino singular, e o antecedente contextual mais plausível é Deus; preserva-se a forma do texto-fonte.
translation_notes:
  register: Português moderno, digno e acessível, com cadência dialogal. Emprega “você” na fala dirigida ao senhor por legibilidade brasileira ampla, enquanto “senhor” conserva o tratamento respeitoso. Não há marcadores de nota, pois nenhuma nota foi necessária.
