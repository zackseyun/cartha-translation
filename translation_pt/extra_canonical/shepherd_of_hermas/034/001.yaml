  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/001.yaml
  text: 1. “Fear,” he says, “the Lord, and keep his commandments. By keeping the commandments of God you will be powerful in every deed, and your conduct will be incomparable. For in fearing the Lord you will do everything well. This is the fear that you must have—and you will be saved.
translation:
  language: pt
  text: 1. “Tema o Senhor”, diz ele, “e guarde os seus mandamentos. Pois, guardando os mandamentos de Deus, você será forte em toda ação, e sua ação será incomparável. Porque, temendo o Senhor, você fará todas as coisas bem. Esse é o temor que você deve ter, e será salvo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβήθητι / φοβούμενος / φόβος
  choice: Tema / temendo / temor
  rationale: Mantém a repetição e o campo semântico do grego, que envolve reverência diante da autoridade divina sem eliminar a noção real de temor.
- source_word: φύλασσε / φυλάσσων
  choice: guarde / guardando
  rationale: Reproduz o sentido de observar e cumprir os mandamentos, preservando também a repetição lexical.
- source_word: δυνατός
  choice: forte
  rationale: Expressa capacidade e poder para agir; é natural em português e não acrescenta uma especificação ausente no texto.
- source_word: ἐν πάσῃ πράξει
  choice: em tudo o que fizer
  rationale: Formulação corrente que comunica a abrangência de toda ação ou realização.
- source_word: ἡ πρᾶξίς σου
  choice: sua conduta
  rationale: Neste contexto, πρᾶξις aponta para a prática ou modo de agir como um todo, e não apenas para um ato isolado.
- source_word: ἀσύγκριτος
  choice: incomparável
  rationale: Preserva diretamente a força do adjetivo grego, sem suavizá-lo para 'excelente' ou interpretá-lo além do necessário.
- source_word: πάντα καλῶς ἐργάσῃ
  choice: você fará bem todas as coisas
  rationale: Conserva tanto a totalidade de πάντα quanto o valor adverbial de καλῶς.
theological_decisions:
- issue: Relação entre temor, obediência e salvação
  choice: “Esse é o temor que você deve ter, e será salvo.”
  alternative: “Esse é o temor que você precisa aprender, para que seja salvo.”
  rationale: O grego coordena a obrigação de temer com o futuro 'será salvo', sem explicitar uma teoria causal ou sacramental. A tradução preserva essa tensão e evita acrescentar 'para que'.
- issue: Natureza do temor do Senhor
  choice: Manter “temor” sem qualificá-lo como apenas “reverência”
  alternative: “reverencie o Senhor”
  rationale: O contexto contrasta formas de temor e atribui força ao temor do Senhor; reduzir o termo a mera reverência eliminaria parte de sua amplitude.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para a fala dirigida a Hermas. A tradução preserva as repetições retóricas de “temer”, “guardar” e “mandamentos”, sem importar terminologia confessional.
