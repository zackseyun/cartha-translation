base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/003.yaml
  text: 3. But fear the works of the devil, for they are evil. So, by fearing the Lord, you will fear the works of the devil, and you will not do them, but will keep away from them.
translation:
  language: pt
  text: 3. Mas tema as obras do diabo, pois são más. Portanto, temendo o Senhor, você temerá as obras do diabo e não as praticará, mas se manterá longe delas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητι / φοβούμενος / φοβηθήσῃ
  choice: tema / temendo / temerá
  rationale: Preserva a repetição retórica do verbo grego e distingue o temor devido ao Senhor do temor dirigido às obras más do diabo.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: as obras do diabo
  rationale: Tradução direta e natural, mantendo a referência às ações e aos efeitos malignos associados ao diabo.
- source_word: πονηρά
  choice: más
  rationale: Expressa de modo claro e corrente o caráter moralmente perverso das obras.
- source_word: οὐκ ἐργάσῃ αὐτά
  choice: não as praticará
  rationale: Em português, “praticar obras más” comunica com naturalidade a ideia de realizá-las, preservando o vínculo lexical com ἔργα sem uma formulação artificial.
- source_word: ἀφέξῃ ἀπ᾽ αὐτῶν
  choice: se manterá longe delas
  rationale: Reproduz a ideia de abstenção e afastamento contínuo em linguagem moderna e clara.
theological_decisions:
- issue: Sentido de temer as obras do diabo
  choice: Manter literalmente que se deve temer as obras, no sentido contextual de reconhecê-las como perigosas e evitá-las.
  alternative: Traduzir como “tenha aversão às obras” ou “tenha cuidado com as obras”.
  rationale: O texto repete deliberadamente φοβέομαι e desenvolve dois objetos distintos do temor; substituir o verbo eliminaria a tensão retórica e interpretaria além do necessário.
- issue: Relação entre temer o Senhor e evitar o mal
  choice: 'Preservar a construção consequencial: temendo o Senhor, a pessoa temerá as obras do diabo e não as praticará.'
  alternative: Explicitar que o temor do Senhor “capacita” ou “leva” a evitar o mal.
  rationale: A formulação grega apresenta a relação sem definir seu mecanismo teológico; a tradução não deve acrescentá-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para o singular implícito. A repetição de “temer” foi mantida por ser estrutural ao argumento. Não há notas de rodapé nesta unidade.
