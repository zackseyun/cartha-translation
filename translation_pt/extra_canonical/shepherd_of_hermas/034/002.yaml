base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/002.yaml
  text: 2. But do not fear the devil; for by fearing the Lord you will gain mastery over the devil, because there is no power in him. In one in whom there is no power, there is no fear; but in one in whom there is glorious power, there is also fear. For everyone who has power has fear, but the one who has no power is despised by all.
translation:
  language: pt
  text: 2. Mas não tenha medo do diabo, pois, temendo o Senhor, você dominará o diabo, porque nele não há poder. Naquele em quem não há poder, também não há temor; mas naquele em quem há poder glorioso, também há temor. Pois todo aquele que tem poder inspira temor, mas quem não tem poder é desprezado por todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβηθῇς / φοβούμενος / φόβος
  choice: tenha medo / temendo / temor
  rationale: Mantém a repetição deliberada da família lexical de φόβος, usando formas naturais em português conforme a sintaxe.
- source_word: κατακυριεύσεις
  choice: você dominará
  rationale: Expressa o sentido de exercer domínio ou prevalecer sobre alguém, sem tornar a formulação excessivamente técnica.
- source_word: δύναμις
  choice: poder
  rationale: Preserva o termo recorrente e sua amplitude sem restringi-lo a força física ou autoridade institucional.
- source_word: ἔνδοξος
  choice: glorioso
  rationale: Equivalente direto que conserva a caracterização elevada do poder.
- source_word: καταφρονεῖται
  choice: é desprezado
  rationale: Comunica com precisão a ideia de ser tratado com desdém ou pouca consideração.
theological_decisions:
- issue: A afirmação de que não há poder no diabo
  choice: porque nele não há poder
  alternative: porque ele não tem poder
  rationale: Preserva a formulação enfática do grego sem acrescentar qualificações teológicas ausentes, como “sobre os fiéis” ou “em si mesmo”.
- issue: Sentido de φόβος na máxima sobre quem possui poder
  choice: inspira temor
  alternative: tem temor
  rationale: Embora o grego diga literalmente que quem possui poder “tem temor”, o contexto indica o temor associado a essa pessoa como objeto temido. “Inspira temor” torna a relação inteligível em português sem resolver além do necessário a tensão retórica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você”. A repetição de “poder” e “temor” foi preservada por ser estrutural ao argumento. A primeira ocorrência foi vertida por “medo” por naturalidade na proibição dirigida ao leitor; nas formulações gerais, “temor” mantém o registro sapiencial.
