  naturalness: O português é claro e de registro apropriado. “Naquele em quem” é natural neste contexto sentencioso e torna explícita a referência pessoal exigida pelo original, sem perder fluidez.
  terminology: “Senhor”, “diabo”, “poder”, “temor” e “desprezado” são escolhas adequadas. Mantém-se “temor” nas máximas gerais e “medo” na proibição direta, uma alternância idiomática aceitável dentro da mesma família semântica.
