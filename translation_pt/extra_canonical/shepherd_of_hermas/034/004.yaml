base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/004.yaml
  text: '4. Therefore there are two fears: if you wish to do what is evil, fear the Lord and you will not do it; and if, on the other hand, you wish to do what is good, fear the Lord and you will do it. Thus the fear of the Lord is strong and great and glorious. So fear the Lord, and you will live to him; and all who fear him, among those who keep his commandments, will live to God.'
translation:
  language: pt
  text: '4. Portanto, há dois tipos de temor: se você quiser praticar o mal, tema o Senhor, e não o praticará; se, por outro lado, quiser praticar o bem, tema o Senhor, e o praticará. Assim, o temor do Senhor é forte, grande e glorioso. Portanto, tema o Senhor, e você viverá para ele; e todos os que o temerem, dentre os que guardam os seus mandamentos, viverão para Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δισσοὶ ... οἱ φόβοι
  choice: há dois tipos de temor
  rationale: Expressa naturalmente a distinção entre as duas atuações do temor descritas a seguir, sem sugerir necessariamente dois objetos distintos de temor.
- source_word: ἐργάσασθαι
  choice: praticar
  rationale: Mantém a ideia de realizar uma ação moral, tanto má quanto boa, em português corrente e digno.
- source_word: ὁ φόβος τοῦ Κυρίου
  choice: o temor do Senhor
  rationale: Preserva a formulação religiosa tradicional e a amplitude semântica de φόβος, que inclui medo reverente sem reduzi-lo apenas a reverência.
- source_word: ζήσῃ αὐτῷ
  choice: viverá para ele
  rationale: Reproduz o dativo αὐτῷ e conserva a diferença textual em relação a τῷ Θεῷ na oração seguinte.
- source_word: τῶν φυλασσόντων τὰς ἐντολὰς αὐτοῦ
  choice: dentre os que guardam os seus mandamentos
  rationale: Preserva a construção partitiva e a relação explícita entre temer o Senhor e guardar seus mandamentos.
theological_decisions:
- issue: Sentido de temer o Senhor
  choice: temor do Senhor
  alternative: reverência pelo Senhor
  rationale: A tradução mantém a tensão entre medo e reverência presente em φόβος e no contexto, sem resolver o termo em favor de uma única leitura teológica.
- issue: Relação entre temor, obediência e vida
  choice: Preservar as afirmações condicionais e futuras do texto
  alternative: Explicitar causalidade salvífica ou mérito
  rationale: O grego associa temor, prática moral, guarda dos mandamentos e vida para Deus, mas não formula aqui uma teoria completa de salvação; a tradução não acrescenta uma.
- issue: Distinção entre viver para o Senhor e viver para Deus
  choice: Manter ambas as expressões distintas
  alternative: Uniformizar as duas como “viver para Deus”
  rationale: A diferença entre αὐτῷ, cujo antecedente é o Senhor, e τῷ Θεῷ deve permanecer visível, ainda que o referente possa ser entendido de modo próximo.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tratamento por “você” torna as exortações diretas e naturais; “tema” preserva a solenidade sem arcaísmo. A repetição deliberada de “praticar”, “temor” e “viver” acompanha a estrutura retórica do grego.
