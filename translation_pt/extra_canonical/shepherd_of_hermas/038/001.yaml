  yaml_path: translation/extra_canonical/shepherd_of_hermas/038/001.yaml
  text: '“Listen, then,” he says, “foolish one, how sorrow wears down the Holy Spirit and then again saves. Whenever the double‑minded person undertakes some action and fails in it because of his double‑mindedness, this sorrow enters into the person and grieves the Holy Spirit and wears it down. Then again, when quick temper clings to a person concerning some matter, and he becomes exceedingly embittered, again sorrow enters into the heart of the person who became quick‑tempered, and he is grieved over the deed that he did and repents, because he did what is evil. This sorrow, then, seems to bring salvation, because after doing what is evil he repented. Therefore both things grieve the Spirit: double‑mindedness, because it did not attain its purpose; and quick temper grieves the Spirit, because it did what is evil. Both, then, are grievous to the Holy Spirit—double‑mindedness and quick temper. Remove, therefore, sorrow from yourself, and do not afflict the Holy Spirit that dwells in you,
    lest it appeal to God and depart from you. For the Spirit of God that was given to this flesh does not endure sorrow or distress.”'
translation:
  language: pt
  text: '“Escute, pois”, diz ele, “insensato, como a tristeza desgasta o Espírito Santo e também salva. Quando uma pessoa dividida se propõe a fazer alguma coisa e fracassa por causa de sua divisão interior, essa tristeza entra nessa pessoa, entristece o Espírito Santo e o desgasta. Depois, quando a irritação se apega a alguém por causa de algum assunto e essa pessoa fica profundamente amargurada, a tristeza torna a entrar no coração de quem se irritou; essa pessoa se entristece pelo que fez e se arrepende, porque praticou o mal. Essa tristeza, portanto, parece trazer salvação, pois, depois de praticar o mal, ela se arrependeu.


    Assim, ambas as coisas entristecem o Espírito: a divisão interior, porque não alcançou o que pretendia; e a irritação, porque praticou o mal. Ambas, portanto, são motivo de tristeza para o Espírito Santo: a divisão interior e a irritação. Afaste, pois, de você a tristeza e não aflija o Espírito Santo que habita em você, para que ele não recorra a Deus e se afaste de você. Pois o Espírito de Deus, dado a esta carne, não suporta tristeza nem angústia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύπη
  choice: tristeza
  rationale: Mantém o sentido recorrente de pesar ou tristeza e permite conservar o contraste do texto entre a tristeza nociva e a tristeza que conduz ao arrependimento.
- source_word: ἐκτρίβει
  choice: desgasta
  rationale: Reproduz a imagem forte de consumir ou exaurir sem antecipar a ideia de afastamento, expressa depois por ἀποστῇ.
- source_word: δίψυχος / διψυχία
  choice: pessoa dividida / divisão interior
  rationale: Comunica em português corrente a ideia de ânimo dividido, hesitação e instabilidade, preservando a relação lexical entre a pessoa e sua condição.
- source_word: ὀξυχολία
  choice: irritação
  rationale: Expressa a disposição irascível ou o acesso de ira em linguagem clara, sem reduzi-la a simples mau humor.
- source_word: μετανοεῖ
  choice: se arrepende
  rationale: Verte naturalmente a mudança de atitude diante do mal praticado, sem acrescentar uma formulação doutrinária externa.
- source_word: ἐντεύξηται
  choice: recorra a Deus
  rationale: Preserva a ideia de dirigir-se ou apelar a Deus, sem explicitar contra quem ou com qual pedido, aspectos que o grego deixa implícitos.
- source_word: στενοχωρίαν
  choice: angústia
  rationale: Transmite a noção de aperto ou aflição interior em contraste complementar com tristeza.
theological_decisions:
- issue: A afirmação de que a tristeza também salva
  choice: “por outro lado, salva” e “parece trazer salvação”
  alternative: Explicar que somente o arrependimento salva
  rationale: O texto atribui à tristeza uma função salvífica por conduzir ao arrependimento; a tradução conserva essa tensão e também a cautela de δοκεῖ, sem harmonização doutrinária.
- issue: Possível afastamento do Espírito Santo
  choice: “para que ele não recorra a Deus e se afaste de você”
  alternative: Interpretar a frase como mera perda de influência espiritual
  rationale: A formulação concreta do grego é mantida, sem suavizar nem sistematizar sua antropologia ou pneumatologia.
- issue: O Espírito dado à carne
  choice: “o Espírito de Deus, dado a esta carne”
  alternative: “dado ao corpo humano”
  rationale: Mantém a linguagem antropológica explícita de σάρξ e seu demonstrativo, evitando substituir a imagem por uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição deliberada de “tristeza”, “Espírito” e dos dois vícios foi preservada por estruturar o argumento. Empregou-se “você” nas exortações pessoais e construções inclusivas com “pessoa/alguém” onde o grego usa ἄνθρωπος.
