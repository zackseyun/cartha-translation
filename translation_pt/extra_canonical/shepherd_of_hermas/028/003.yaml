base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/003.yaml
  text: So when I heard these things, I wept greatly. But seeing me weeping, he says, ‘Why are you weeping?’ ‘Because, sir,’ I say, ‘I do not know whether I can be saved.’ ‘Why?’ he says. ‘For,’ I say, ‘sir, never yet in my life have I spoken a true word, but I have always lived deceitfully with everyone, and I made my lie appear true before all people; and no one ever contradicted me, but my word was believed. How then,’ I say, ‘sir, can I live, having done these things?’
translation:
  language: pt
  text: 'Ao ouvir essas coisas, chorei muito. Vendo-me chorar, ele perguntou: “Por que você está chorando?” Respondi: “Porque, senhor, não sei se posso ser salvo.” Ele perguntou: “Por quê?” Eu disse: “Porque, senhor, até hoje nunca falei uma palavra verdadeira em toda a minha vida. Pelo contrário, sempre vivi de modo enganoso com todos e fiz com que minha mentira parecesse verdade diante de todas as pessoas. Ninguém jamais me contradisse; ao contrário, acreditavam no que eu dizia. Então, senhor, como posso viver, depois de ter feito essas coisas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσα λίαν
  choice: chorei muito
  rationale: Reproduz de modo natural e direto a intensidade do verbo e do advérbio.
- source_word: κύριε
  choice: senhor
  rationale: Aqui funciona como tratamento respeitoso dirigido ao interlocutor, não necessariamente como título divino; a minúscula preserva essa distinção contextual.
- source_word: σωθῆναι
  choice: ser salvo
  rationale: Mantém o sentido soteriológico amplo e a forma passiva do grego, sem especificar de que modo ocorre a salvação.
- source_word: πανοῦργος ἔζησα
  choice: vivi de modo enganoso
  rationale: Expressa a conduta astuta, fraudulenta ou ardilosa indicada por πανοῦργος, sem sugerir apenas inteligência ou esperteza neutra.
- source_word: τὸ ψεῦδός μου ἀληθὲς ἐπέδειξα
  choice: fiz com que minha mentira parecesse verdade
  rationale: Comunica idiomaticamente que Hermas apresentava sua falsidade como verdadeira, sem afirmar que ela de fato se tornava verdade.
- source_word: ἐπιστεύθη τῷ λόγῳ μου
  choice: acreditavam no que eu dizia
  rationale: Forma portuguesa natural para a construção passiva impessoal; conserva a ideia de que suas declarações recebiam crédito.
- source_word: δύναμαι ζῆσαι
  choice: posso viver
  rationale: Preserva literalmente a linguagem de vida do texto e sua possível dimensão escatológica, sem substituí-la por uma interpretação explícita como 'obter a vida eterna'.
theological_decisions:
- issue: Relação entre 'ser salvo' e 'viver'
  choice: 'Manter as duas expressões distintas: “ser salvo” e “posso viver”.'
  alternative: Harmonizar ambas como referências explícitas à salvação eterna.
  rationale: O grego emprega σωθῆναι e ζῆσαι; preservar a variação mantém a tensão e a amplitude teológica do discurso.
- issue: Alcance da confissão de nunca ter falado verdade
  choice: Traduzir a declaração de maneira absoluta, conforme formulada pelo narrador.
  alternative: Atenuar para “muitas vezes menti” ou “raramente falei a verdade”.
  rationale: O original usa οὐδέπω... ἀληθὲς e πάντοτε, linguagem enfática que não deve ser mitigada por pressupostos sobre intenção ou hipérbole.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e compreensão internacional. O diálogo foi pontuado de modo fluente; as repetições de “ele diz/eu digo” foram preservadas em sentido, mas vertidas com verbos de fala naturais. Não há marcadores de nota, pois nenhuma nota foi necessária.
