base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/002.yaml
  text: Therefore those who lie reject the Lord and become defrauders of the Lord, not handing back to him the deposit that they received. For they received from him a spirit without falsehood. If they return it false, they have defiled the command of the Lord and have become defrauders.
translation:
  language: pt
  text: Portanto, os que mentem rejeitam o Senhor e se tornam defraudadores do Senhor, não lhe devolvendo o depósito[a] que receberam. Pois receberam dele um espírito sem falsidade. Se o devolverem falso, terão manchado o mandamento do Senhor e se tornado defraudadores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, aquilo que lhes foi confiado para guardar e devolver.
    reason: Esclarece o sentido fiduciário de παρακαταθήκη sem identificar de maneira mais estreita o depósito do que o próprio contexto permite.
lexical_decisions:
- source_word: ἀθετοῦσι
  choice: rejeitam
  rationale: O verbo pode indicar rejeitar, repudiar ou invalidar. “Rejeitam” expressa com clareza a afronta pessoal ao Senhor sem acrescentar uma interpretação específica.
- source_word: ἀποστερηταί
  choice: defraudadores
  rationale: Preserva a imagem forte de privar alguém do que lhe é devido ou de apropriar-se indevidamente disso, imagem desenvolvida pela falta de devolução do depósito.
- source_word: παρακαταθήκην
  choice: depósito
  rationale: Termo corrente para algo confiado a alguém e que deve ser guardado e devolvido; mantém a metáfora fiduciária do grego.
- source_word: πνεῦμα ἄψευστον
  choice: um espírito sem falsidade
  rationale: Mantém “espírito” em minúscula e preserva a possível referência tanto ao espírito dado por Deus quanto ao Espírito, sem resolver explicitamente a ambiguidade.
- source_word: ψευδὲς ἀποδώσωσιν
  choice: o devolverem falsificado
  rationale: “Falsificado” comunica que aquilo que foi recebido sem falsidade é devolvido corrompido pela mentira, conservando o jogo entre receber e restituir.
- source_word: ἐμίαναν
  choice: terão profanado
  rationale: O verbo significa manchar ou contaminar. “Profanado” transmite a violação moral do mandamento em português natural e solene.
theological_decisions:
- issue: Identidade de πνεῦμα
  choice: “um espírito”, em minúscula
  alternative: “o Espírito”, como referência explícita ao Espírito Santo
  rationale: O texto associa o espírito ao dom de Deus e à habitação divina no contexto, mas não o identifica aqui de modo inequívoco como o Espírito Santo; a tradução conserva essa tensão.
- issue: Sentido da devolução do espírito
  choice: manter literalmente a metáfora de receber e devolver
  alternative: explicitar como prestação de contas da vida humana a Deus
  rationale: A formulação grega apresenta o espírito como depósito recebido e depois restituído; explicitar uma doutrina sobre o momento ou modo dessa restituição iria além do texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do argumento grego. A repetição de “Senhor”, “devolver” e “defraudadores” foi mantida por ser retoricamente importante para a metáfora do depósito.
