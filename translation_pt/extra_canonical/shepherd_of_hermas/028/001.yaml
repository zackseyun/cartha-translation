  source_fidelity: 'O texto português transmite com precisão o conteúdo de 28:1: o imperativo de amar a verdade, a exortação para que a verdade saia da boca, o espírito feito habitar «nesta carne», sua confirmação pública como verdadeiro e a glorificação do Senhor. Também preserva a afirmação final de que o Senhor é verdadeiro em toda palavra e não tem falsidade.'
  naturalness: A redação é clara, moderna e de registro adequadamente solene. «Que toda verdade proceda da sua boca» é um pouco elevado, mas natural e condizente com o gênero parenético. O emprego de «você» é coerente com a variante solicitada.
  terminology: «Verdade», «espírito», «carne», «Senhor» e «glorificado» correspondem bem ao vocabulário grego e preservam as ambiguidades teológicas do original. «Seja reconhecido como verdadeiro» comunica de modo idiomático ἀληθὲς εὑρεθῇ sem identificar indevidamente o espírito.
