base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/001.yaml
  text: 'Again he says to me: “Love truth, and let all truth go forth from your mouth, so that the spirit which God has caused to dwell in this flesh may be found true before all people, and thus the Lord who dwells in you will be glorified; for the Lord is true in every word, and there is no falsehood with him.'
translation:
  language: pt
  text: 'Ele me diz novamente: “Ame a verdade, e que toda verdade proceda da sua boca, para que o espírito que Deus fez habitar nesta carne seja reconhecido como verdadeiro diante de todas as pessoas. Assim será glorificado o Senhor que habita em você, pois o Senhor é verdadeiro em toda palavra, e nele não há falsidade.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλήθειαν ἀγάπα
  choice: Ame a verdade
  rationale: Reproduz diretamente o imperativo e preserva a verdade como objeto do amor.
- source_word: πᾶσα ἀλήθεια ... ἐκπορευέσθω
  choice: que toda verdade proceda
  rationale: Mantém a abrangência de πᾶσα e a imagem de algo que sai da boca, em português digno e natural.
- source_word: τὸ πνεῦμα
  choice: o espírito
  rationale: O grego não explicita aqui se se trata do espírito humano dado por Deus ou do Espírito divino; a tradução conserva essa ambiguidade.
- source_word: κατῴκισεν
  choice: fez habitar
  rationale: Expressa o valor causativo do verbo neste contexto sem acrescentar uma identificação teológica ausente no texto.
- source_word: ἐν τῇ σαρκὶ ταύτῃ
  choice: nesta carne
  rationale: Preserva a concretude e a formulação antropológica do original, sem suavizá-la para “corpo”.
- source_word: ἀληθὲς εὑρεθῇ
  choice: seja reconhecido como verdadeiro
  rationale: Comunica o sentido de ser constatado ou considerado verdadeiro perante outros, evitando a tradução portuguesa pouco natural “seja encontrado verdadeiro”.
- source_word: παρὰ πᾶσιν ἀνθρώποις
  choice: diante de todas as pessoas
  rationale: Transmite a dimensão pública da expressão e usa linguagem inclusiva natural para ἀνθρώποις.
- source_word: δοξασθήσεται
  choice: será glorificado
  rationale: Mantém a voz passiva e o vocabulário teológico tradicional, amplamente compreensível.
- source_word: οὐδὲν παρ’ αὐτῷ ψεῦδος
  choice: nele não há falsidade
  rationale: Verte idiomaticamente a afirmação de que nenhuma mentira ou falsidade se encontra junto de Deus.
theological_decisions:
- issue: Identidade do espírito que Deus fez habitar na carne
  choice: Manter “o espírito” sem qualificá-lo
  alternative: Traduzir “o Espírito Santo” ou “o espírito humano”
  rationale: O original diz apenas τὸ πνεῦμα. Identificá-lo de modo explícito resolveria uma ambiguidade genuína que o texto conserva.
- issue: Referente de “o Senhor que habita em você”
  choice: Conservar o título “o Senhor” sem identificação adicional
  alternative: Especificar Deus, Cristo ou o Espírito
  rationale: O grego não acrescenta um nome ao título e relaciona a habitação do Senhor com a do espírito sem explicar plenamente essa relação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Emprega tratamento por “você” conforme a fala direta contemporânea, sem coloquialismo. A tradução limita-se ao segmento 28:1 fornecido pela camada inglesa, embora a fonte grega inclua a seção posterior.
