revisions:
- from: “Agora, portanto”, diz ele, “você está ouvindo. Guarde estas palavras, para que até as mentiras que antes disse em seus negócios, quando estas forem reconhecidas como verdadeiras, também aquelas se tornem dignas de crédito; pois até aquelas podem tornar-se dignas de crédito.[a] Se você guardar estas palavras e, de agora em diante, falar toda a verdade, poderá alcançar vida para si mesmo. E todo aquele que ouvir este mandamento e se abstiver da mentira, que é o pior dos males, viverá para Deus.”
  to: “Agora, então”, diz ele, “você está ouvindo estas coisas. Guarde-as, para que até as mentiras que antes disse em seus negócios, quando estas forem consideradas verdadeiras, também aquelas se tornem dignas de crédito; pois também aquelas podem tornar-se dignas de crédito.[a] Se você guardar estas coisas e, de agora em diante, falar toda a verdade, poderá alcançar vida para si mesmo. E todo aquele que ouvir este mandamento e se abstiver da mentira mais perversa viverá para Deus.”
  rationale: A revisão corrige a qualificação de «mentira» na frase final e aprimora levemente a fluência. Mantém-se a nota, pois o vínculo entre «estas coisas» encontradas verdadeiras e as mentiras anteriores que podem tornar-se «dignas de crédito» permanece sintaticamente e interpretativamente difícil no grego.
