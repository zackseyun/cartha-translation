base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/005.yaml
  text: ‘Now then,’ he says, ‘you are hearing; keep them, so that even the former lies that you spoke in your dealings, if these are found true, those also may become credible; for those too can become credible. If you keep these and from now on speak all truth, you will be able to gain life for yourself. And whoever hears this command and abstains from the most evil lie will live to God.’
translation:
  language: pt
  text: “Agora, então”, diz ele, “você está ouvindo estas coisas. Guarde-as, para que até as mentiras que antes disse em seus negócios, quando estas forem consideradas verdadeiras, também aquelas se tornem dignas de crédito; pois também aquelas podem tornar-se dignas de crédito.[a] Se você guardar estas coisas e, de agora em diante, falar toda a verdade, poderá alcançar vida para si mesmo. E todo aquele que ouvir este mandamento e se abstiver da mentira mais perversa viverá para Deus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase grega é difícil. Pode indicar que uma conduta verdadeira a partir de agora fará com que as declarações anteriores da pessoa voltem a ser consideradas dignas de crédito; não necessariamente que aquilo que era falso passe literalmente a ser verdadeiro.
    reason: Preservar e esclarecer a ambiguidade de τούτων εὑρεθέντων ἀληθινῶν ... κἀκεῖνα πιστὰ γένηται sem resolver o aparente paradoxo no corpo do texto.
lexical_decisions:
- source_word: φύλασσε αὐτά
  choice: Guarde estas palavras
  rationale: O pronome neutro plural retoma aquilo que Hermas acaba de ouvir; explicitar “palavras” produz português natural sem alterar o referente.
- source_word: ἐν ταῖς πραγματείαις σου
  choice: em seus negócios
  rationale: πραγματεία pode indicar negócios, transações ou atividades práticas. “Negócios” preserva o provável contexto de relações comerciais sem restringi-lo a uma transação específica.
- source_word: πιστὰ γένηται
  choice: se tornem dignas de crédito
  rationale: πιστός aqui se relaciona à credibilidade das declarações anteriores, não diretamente à fidelidade religiosa.
- source_word: ζωὴν περιποιήσασθαι
  choice: alcançar vida para si mesmo
  rationale: A expressão indica obter ou assegurar vida; “alcançar” mantém a força do resultado sem introduzir terminologia confessional específica.
- source_word: ζήσεται τῷ Θεῷ
  choice: viverá para Deus
  rationale: Reproduz de modo direto o dativo τῷ Θεῷ e conserva sua possível nuance relacional ou escatológica.
theological_decisions:
- issue: A afirmação de que mentiras anteriores podem tornar-se dignas de crédito
  choice: Manter a formulação paradoxal no texto e explicá-la em nota
  alternative: Interpretar que a veracidade futura apagará ou transformará retroativamente as mentiras passadas em verdade
  rationale: O grego é genuinamente difícil e não declara explicitamente que o conteúdo falso se tornará verdadeiro. A tradução preserva a tensão entre verdade presente e credibilidade passada, sem resolver silenciosamente o sentido.
- issue: A obtenção da vida mediante guardar o mandamento
  choice: Traduzir diretamente “poderá alcançar vida para si mesmo”
  alternative: Parafrasear em termos de mérito, salvação sacramental ou mera evidência ética
  rationale: O texto vincula a observância e a verdade à vida, mas não explica aqui o mecanismo teológico; a tradução evita importar uma doutrina posterior.
translation_notes:
  register: Português moderno, claro e digno, com “você” para o singular em consonância com a legibilidade brasileira e ampla compreensão internacional. A estrutura exortativa e o encadeamento lógico do grego foram preservados; a frase central, deliberadamente paradoxal, recebeu apenas esclarecimento em nota.
