base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/004.yaml
  text: He says, ‘You are thinking rightly and truly; for it was necessary for you, as a slave of God, to walk in truth, and not to let an evil conscience dwell with the spirit of truth, nor to bring grief upon the holy and true Spirit.’ ‘Never,’ I say, ‘sir, have I heard such words clearly.’
translation:
  language: pt
  text: 'Ele diz: “Você pensa de modo correto e verdadeiro, pois era necessário que você, como servo de Deus, andasse na verdade, sem permitir que uma consciência má habitasse com o espírito da verdade, nem entristecer o Espírito venerável e verdadeiro.” Eu digo: “Senhor, nunca ouvi com clareza palavras como estas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλον
  choice: servo
  rationale: Embora o sentido básico seja ‘escravo’, ‘servo de Deus’ preserva a fórmula religiosa natural em português e a relação de submissão, sem introduzir uma aspereza desnecessária neste contexto.
- source_word: ἐν ἀληθείᾳ πορεύεσθαι
  choice: andasse na verdade
  rationale: Mantém a metáfora ética de πορεύεσθαι e a formulação solene e inteligível do grego.
- source_word: πονηρὰν συνείδησιν
  choice: uma consciência má
  rationale: Tradução direta que preserva a dimensão moral de πονηρά sem restringi-la a culpa ou remorso.
- source_word: τῷ πνεύματι τῷ σεμνῷ καὶ ἀληθεῖ
  choice: o Espírito venerável e verdadeiro
  rationale: ‘Venerável’ expressa σεμνός como digno de reverência; a inicial maiúscula é adequada à referência ao Espírito dado por Deus no contexto.
- source_word: ἀκριβῶς
  choice: com tanta clareza
  rationale: No contexto de ouvir ensinamentos, indica compreensão clara ou exata, e não meramente atenção auditiva.
theological_decisions:
- issue: Identidade e capitalização de πνεῦμα
  choice: ‘espírito da verdade’ na primeira ocorrência e ‘Espírito venerável e verdadeiro’ na segunda
  alternative: Usar minúscula em ambas as ocorrências ou maiúscula em ambas
  rationale: O contexto identifica o espírito como procedente de Deus e passível de ser entristecido, favorecendo referência divina na segunda expressão. A primeira conserva a forma mais descritiva do grego e evita eliminar a possível relação entre o espírito humano recebido e o Espírito divino.
- issue: Força de ἔδει
  choice: ‘era necessário’
  alternative: ‘você devia’
  rationale: Preserva a força de necessidade ou obrigação do imperfeito grego sem decidir se a necessidade é estritamente moral, providencial ou ambas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por ‘você’ coerente com a fala direta. A estrutura foi mantida próxima ao grego, mas com sintaxe natural em português.
