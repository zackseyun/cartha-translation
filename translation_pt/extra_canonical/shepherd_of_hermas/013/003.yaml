base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/003.yaml
  text: “I want to know who the other stones are that are being carried from the dry land, lady.” She said, “Those that go into the building without being hewn—the Lord approved these, because they walked in the uprightness of the Lord and kept his commandments.”
translation:
  language: pt
  text: '“Quero saber, senhora, quem são as outras pedras trazidas da terra seca.” Ela respondeu: “As que entram na construção sem serem talhadas são aquelas que o Senhor aprovou, porque andaram na retidão do Senhor e cumpriram os seus mandamentos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξηρᾶς
  choice: terra seca
  rationale: Preserva a imagem concreta do grego e a distingue do abismo mencionado no contexto anterior.
- source_word: κυρία
  choice: senhora
  rationale: Forma natural e respeitosa de tratamento, adequada à figura feminina interpelada no diálogo.
- source_word: λατομουμένους
  choice: serem talhadas
  rationale: No contexto de pedras destinadas à construção, expressa com naturalidade o trabalho de corte ou aparelhamento da pedra.
- source_word: ἐδοκίμασεν
  choice: aprovou
  rationale: Comunica a ideia de terem sido provadas e consideradas aceitáveis pelo Senhor.
- source_word: εὐθύτητι
  choice: retidão
  rationale: Mantém o sentido moral de conduta íntegra e direta.
- source_word: κατωρθώσαντο τὰς ἐντολὰς
  choice: cumpriram os seus mandamentos
  rationale: Traduz idiomaticamente a ideia de executar corretamente ou observar os mandamentos.
theological_decisions:
- issue: Relação entre aprovação divina e obediência
  choice: 'Manter a relação causal explícita: o Senhor os aprovou porque andaram em retidão e cumpriram seus mandamentos.'
  alternative: Atenuar a causalidade, tratando a conduta apenas como evidência da aprovação.
  rationale: O grego usa ὅτι e apresenta diretamente a conduta como razão da aprovação; a tradução não deve reformular essa tensão segundo um sistema teológico posterior.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e preservação da metáfora arquitetônica. O referente plural de ‘aqueles’ foi mantido para representar as pessoas simbolizadas pelas pedras.
