base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/001.yaml
  text: “Listen now about the stones that go into the building. The stones, then, that are square and white and that fit together at their joints—these are the apostles and bishops and teachers and deacons, who walked in the reverent dignity of God and who oversaw and taught and served God’s elect with purity and reverence—some have fallen asleep, and some are still alive. They were always in agreement with one another, had peace among themselves, and listened to each other; for this reason their joints fit in the building of the tower.
translation:
  language: pt
  text: “Ouça agora a respeito das pedras que entram na construção. Pois bem, as pedras quadradas, brancas e cujas junções se ajustam umas às outras são os apóstolos, bispos, mestres e diáconos que viveram segundo a reverente dignidade de Deus e, com pureza e reverência, supervisionaram, ensinaram e serviram aos eleitos de Deus — alguns já adormeceram, e outros ainda vivem. Eles sempre estiveram de acordo uns com os outros, mantiveram a paz entre si e deram ouvidos uns aos outros. Por isso, suas junções se ajustam na construção da torre.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπαγόντων εἰς τὴν οἰκοδομήν
  choice: entram na construção
  rationale: Expressa naturalmente o movimento das pedras para sua incorporação ao edifício, sem tornar explícito além do grego quem as conduz.
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν
  choice: cujas junções se ajustam umas às outras
  rationale: Preserva a imagem arquitetônica e o sentido de correspondência ou encaixe entre as pedras.
- source_word: σεμνότητα τοῦ Θεοῦ
  choice: dignidade reverente de Deus
  rationale: σεμνότης reúne dignidade, seriedade moral e reverência; a formulação conserva essa amplitude e a ligação genitiva com Deus.
- source_word: ἐπισκοπήσαντες
  choice: supervisionaram
  rationale: Mantém o sentido funcional do verbo, em paralelo com ensinaram e serviram, sem reduzi-lo necessariamente a um título eclesiástico.
- source_word: διακονήσαντες
  choice: serviram
  rationale: Traduz o exercício de serviço ou ministério de forma clara e mantém o paralelismo verbal.
- source_word: κεκοιμημένοι
  choice: já adormeceram
  rationale: Preserva o eufemismo antigo para a morte e sua ressonância cristã, sem substituir diretamente por “morreram”.
- source_word: ἀλλήλων ἤκουον
  choice: deram ouvidos uns aos outros
  rationale: Comunica não apenas percepção auditiva, mas atenção e disposição recíproca para ouvir.
theological_decisions:
- issue: Relação de τοῖς ἐκλεκτοῖς τοῦ Θεοῦ com os três particípios ministeriais
  choice: “supervisionaram, ensinaram e serviram aos eleitos de Deus”
  alternative: Repetir “os eleitos de Deus” ou restringir o complemento somente a “serviram”
  rationale: A sintaxe permite entender o dativo como relacionado à série de ações; a tradução portuguesa o deixa funcionar como complemento compartilhado sem criar distinções ministeriais ausentes do texto.
- issue: Sentido de κατὰ τὴν σεμνότητα τοῦ Θεοῦ
  choice: “segundo a dignidade reverente de Deus”
  alternative: “na reverência a Deus” ou “segundo a solenidade de Deus”
  rationale: A escolha preserva o genitivo potencialmente ambíguo e evita convertê-lo, sem necessidade, em uma expressão exclusivamente subjetiva de reverência humana a Deus.
- issue: Concordância dos ministros
  choice: “estiveram de acordo uns com os outros, mantiveram a paz entre si e deram ouvidos uns aos outros”
  alternative: Interpretar a concordância como uniformidade doutrinária formal
  rationale: O texto descreve concórdia, paz e escuta recíproca; a tradução não acrescenta uma definição confessional específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O discurso direto e a metáfora da construção foram preservados; a repetição de “junções” liga explicitamente a conduta harmoniosa dos ministros ao encaixe das pedras.
