  to: “E as pedras que são levadas e colocadas na construção, quem são?” “São novas na fé e fiéis. Mas são exortadas pelos anjos a fazer o bem, porque se achou maldade nelas.”
  rationale: A revisão explicita o referente metafórico da pergunta e ajusta a tradução de νουθετοῦνται à voz passiva e ao valor de exortação moral do grego. Mantém-se a tensão textual entre serem fiéis e ainda haver maldade nelas, sem interpretação adicional.
