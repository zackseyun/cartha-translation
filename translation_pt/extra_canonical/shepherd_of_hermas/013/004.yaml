base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/004.yaml
  text: “And the ones being brought and set into the building—who are they?” “They are new in the faith and faithful. But they are being admonished by the angels to do good, because evil was found in them.”
translation:
  language: pt
  text: “E as pedras que são levadas e colocadas na construção, quem são?” “São novas na fé e fiéis. Mas são exortadas pelos anjos a fazer o bem, porque se achou maldade nelas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... ἀγόμενοι καὶ τιθέμενοι
  choice: as que são trazidas e colocadas
  rationale: O referente implícito são as pedras, substantivo feminino em português; a voz passiva preserva a ação exercida sobre elas.
- source_word: εἰς τὴν οἰκοδομήν
  choice: na construção
  rationale: Expressa naturalmente o ingresso e a colocação das pedras na estrutura em construção.
- source_word: Νέοι ... ἐν τῇ πίστει
  choice: pessoas novas na fé
  rationale: Evita que “novos” seja entendido apenas como idade jovem e comunica que são recém-chegados à fé.
- source_word: πιστοί
  choice: fiéis
  rationale: Preserva o sentido adjetival de confiabilidade ou fidelidade, sem reduzi-lo à mera condição de crentes.
- source_word: νουθετοῦνται
  choice: advertem
  rationale: Comunica instrução corretiva e exortação moral em português corrente.
- source_word: εἰς τὸ ἀγαθοποιεῖν
  choice: a praticar o bem
  rationale: Tradução idiomática do infinitivo que indica a finalidade da admoestação.
- source_word: πονηρία
  choice: maldade
  rationale: Mantém a força moral do termo grego, que neste contexto aponta para um mal encontrado nelas.
theological_decisions:
- issue: Relação entre novidade na fé, fidelidade e maldade ainda presente
  choice: Manter lado a lado “novas na fé e fiéis” e “maldade nelas”
  alternative: Suavizar πονηρία como “falha” ou interpretar πιστοί apenas como “crentes”
  rationale: O grego conserva deliberadamente a tensão entre a fidelidade dessas pessoas e a necessidade de correção; a tradução não deve resolvê-la.
- issue: Agência dos anjos na correção
  choice: Preservar explicitamente “os anjos as advertem”
  alternative: Generalizar como “recebem advertência”
  rationale: O texto atribui diretamente aos anjos a função de admoestar, e essa afirmação deve permanecer explícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O diálogo foi preservado, e “pessoas” foi acrescentado para tornar natural o predicativo humano apesar da imagem anterior das pedras.
