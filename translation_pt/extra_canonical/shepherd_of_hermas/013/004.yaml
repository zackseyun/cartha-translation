review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência do diálogo, a condição de serem novas na fé e fiéis, a agência dos anjos e a razão dada para a admoestação. Contudo, explicitar «pedras» na pergunta torna claro o referente da imagem, e uma formulação passiva para νουθετοῦνται reproduz mais diretamente o grego.
  naturalness: «E as que são trazidas» fica elíptico e pouco natural como início de fala isolada. «Porque se encontrou maldade nelas» é compreensível, mas «porque se achou maldade nelas» soa mais idiomático e conserva a passiva impessoal do original.
  terminology: '«Exortadas» comunica melhor νουθετοῦνται neste contexto do que «advertem»: trata-se de instrução moral corretiva voltada a fazer o bem, não necessariamente de um aviso. «Fazer o bem» é uma equivalência natural e direta para ἀγαθοποιεῖν.'
