    rationale: O grego retoma «pedras» do contexto imediatamente anterior. Em português, «as que» sem o substantivo pode soar excessivamente elíptico; explicitar «as pedras» preserva a imagem e melhora a clareza.
  - severity: low
    issue: Formulação de νουθετοῦνται
    rationale: O verbo grego está na voz passiva e denota exortação/instrução corretiva. «São exortadas pelos anjos» preserva tanto a voz quanto o sentido com maior precisão.
