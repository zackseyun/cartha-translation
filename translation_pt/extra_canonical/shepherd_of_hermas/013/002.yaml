  terminology: «Profundezas», «construção» e «nome do Senhor» são escolhas adequadas. «Já assentadas» expressa naturalmente τῶν ἤδη ᾠκοδομημένων no պատկեր arquitetônico, sem sugerir que as pedras foram literalmente “construídas”.
