base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/002.yaml
  text: “And the ones drawn up from the deep and set into the building and fitting together at their joints with the other stones already built—who are they?” “These are the ones who suffered on account of the name of the Lord.”
translation:
  language: pt
  text: '— E as pedras tiradas das profundezas, colocadas na construção e que se ajustam, pelas suas junções, às outras pedras já assentadas — quem são elas?


    — São os que sofreram por causa do nome do Senhor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ βυθοῦ
  choice: das profundezas
  rationale: Preserva a imagem espacial de βυθός, o fundo ou abismo de onde as pedras são retiradas, em linguagem portuguesa natural.
- source_word: ἑλκόμενοι
  choice: tiradas
  rationale: Exprime o particípio passivo 'puxadas/retiradas' de modo idiomático para pedras, sem acrescentar um agente.
- source_word: ἐπιτιθέμενοι εἰς τὴν οἰκοδομήν
  choice: colocadas na construção
  rationale: Reproduz a ação passiva de pôr as pedras na edificação.
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν
  choice: cujas junções se encaixam
  rationale: No contexto da alvenaria, συμφωνέω indica correspondência ou ajuste, e ἁρμογαί são os pontos de junção.
- source_word: τῶν ἤδη ᾠκοδομημένων
  choice: já incorporadas
  rationale: Comunica que as outras pedras já haviam sido assentadas na estrutura, evitando a formulação pouco natural 'pedras já construídas'.
- source_word: οἱ παθόντες
  choice: os que sofreram
  rationale: Mantém o sentido amplo de πάσχω sem especificar martírio, tortura ou perseguição além do que o grego afirma.
- source_word: ἕνεκεν τοῦ ὀνόματος τοῦ Κυρίου
  choice: por causa do nome do Senhor
  rationale: Conserva literalmente a expressão teologicamente significativa e sua referência ao nome do Senhor.
theological_decisions:
- issue: Natureza do sofrimento dos retratados pelas pedras
  choice: os que sofreram
  alternative: os mártires / os que foram perseguidos
  rationale: O texto diz apenas οἱ παθόντες. A tradução preserva a abrangência e não decide se todos morreram ou qual forma tomou o sofrimento.
translation_notes:
  register: Português moderno, claro e digno, com diálogo marcado por travessões. A metáfora arquitetônica foi mantida, usando 'junções se encaixam' para clareza visual. Não foram necessárias notas de rodapé.
