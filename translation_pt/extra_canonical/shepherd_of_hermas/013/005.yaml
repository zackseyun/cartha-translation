  source_fidelity: A tradução acompanha de perto o grego e preserva a metáfora das pedras descartadas, a possibilidade de arrependimento e a limitação temporal ligada à construção da torre. Contudo, «se de fato se arrependerem» introduz uma ênfase asseverativa não presente em ἐὰν μετανοήσωσιν, e «desde que» reformula a última condição em vez de conservar a repetição deliberada do original.
  naturalness: O texto é claro, fluente e apropriado ao português moderno de ampla compreensão. A repetição de «se se arrependerem» é um pouco marcada, mas é justificadamente mantida, pois reproduz a insistência condicional do grego.
  terminology: «Arrepender-se», «fortes na fé» e «úteis à construção» são escolhas adequadas. «Serão excluídos» é possível para ἔκβολοι, mas «serão lançados fora» conserva melhor a imagem concreta e o contraste com as pedras que são lançadas para fora.
