base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/005.yaml
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to repent. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
translation:
  language: pt
  text: '“E aqueles que eles rejeitavam e lançavam de lado, quem são?” “São os que pecaram e querem se arrepender. Por isso não foram atirados para muito longe, para fora da torre, pois serão úteis à construção, se se arrependerem. Portanto, os que estão para se arrepender, se se arrependerem, serão fortes na fé, se agora se arrependerem, enquanto a torre está sendo construída. Mas, se a construção for concluída, já não terão lugar, mas serão lançados fora. Resta-lhes apenas isto: ficar junto à torre.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέβαλλον καὶ ἔριττον
  choice: rejeitavam e lançavam de lado
  rationale: Preserva os dois verbos coordenados e a imagem das pedras descartadas, sem tornar a formulação artificial em português.
- source_word: μετανοῆσαι / μετανοήσωσιν
  choice: se arrepender / se arrependam
  rationale: Expressa a mudança moral e religiosa indicada por μετανοέω em linguagem corrente e digna.
- source_word: εὔχρηστοι
  choice: úteis
  rationale: Equivalente direto no contexto da utilidade das pedras para a construção.
- source_word: ἰσχυροὶ ... ἐν τῇ πίστει
  choice: fortes na fé
  rationale: Mantém a metáfora de força e a referência explícita à fé.
- source_word: ἔκβολοι
  choice: excluídos
  rationale: Comunica a condição de quem fica de fora depois de concluída a construção, conservando a força do termo sem inserir uma interpretação escatológica mais específica.
- source_word: παρὰ τῷ πύργῳ κεῖσθαι
  choice: ficar junto à torre
  rationale: Reproduz a posição espacial da pedra sem o pouco natural 'jazer'; no contexto, 'ficar' mantém a imagem compreensível.
theological_decisions:
- issue: Condição e oportunidade do arrependimento
  choice: Manter a repetição condicional e a urgência de arrepender-se enquanto a torre está sendo construída
  alternative: Suavizar a repetição ou explicar a torre como um período histórico ou escatológico específico
  rationale: O grego enfatiza reiteradamente ἐὰν e νῦν, mas não identifica aqui de modo explícito todo o alcance simbólico do prazo.
- issue: Destino após a conclusão da construção
  choice: “serão excluídos”
  alternative: “serão condenados” ou “serão expulsos”
  rationale: ἔκβολοι indica rejeição ou exclusão; 'condenados' acrescentaria uma formulação judicial não expressa, enquanto 'expulsos' poderia sugerir que já estavam dentro.
- issue: Sentido de querer arrepender-se
  choice: “querem se arrepender”
  alternative: “estão dispostos a arrepender-se” ou “pretendem arrepender-se”
  rationale: Mantém o valor volitivo de θέλοντες e a tensão do texto entre o desejo presente e o arrependimento que ainda precisa ocorrer.
translation_notes:
  register: Português moderno, internacional e de leitura natural no Brasil. Mantém a fala dialogada, a metáfora arquitetônica e a insistência retórica do original. Não foram necessárias notas de rodapé.
