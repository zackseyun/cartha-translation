base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/004.yaml
  text: You see, then, that long-suffering is sweeter than honey and is serviceable to the Lord, and he dwells in it; but quick temper is bitter and useless. If, therefore, quick temper is mixed with long-suffering, long-suffering is defiled and is no longer useful to God. Long-suffering at all times has nothing bitter within itself, remaining always gentle and quiet. This long-suffering, then, dwells with those who have the faith complete.
translation:
  language: pt
  text: Você vê, portanto, que a paciência é mais doce que o mel e útil ao Senhor, e que o Senhor habita nela. O temperamento explosivo, porém, é amargo e inútil. Portanto, se o temperamento explosivo se mistura com a paciência, a paciência fica contaminada e já não é útil a Deus. Em todo tempo, a paciência nada tem de amargo em si, mas permanece sempre mansa e tranquila. É essa paciência, portanto, que habita com os que têm a fé íntegra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακροθυμία
  choice: paciência
  rationale: Expressa em português corrente a disposição constante e tolerante em contraste com a ira súbita; a repetição preserva a coesão da imagem do texto.
- source_word: ὀξυχολία
  choice: ira repentina
  rationale: Reproduz o sentido de irritação ou cólera que surge rapidamente, de modo mais claro para leitores comuns do que o termo técnico “irascibilidade”.
- source_word: εὔχρηστος / ἄχρηστος
  choice: útil / inútil
  rationale: Mantém o contraste direto de algo apropriado ou impróprio para o uso e serviço do Senhor.
- source_word: μιαίνεται
  choice: fica contaminada
  rationale: Preserva a ideia de profanação ou corrupção causada pela mistura, sem reduzir o verbo a mera perda de qualidade.
- source_word: πραεῖα καὶ ἡσύχιος
  choice: mansa e tranquila
  rationale: 'Conserva os dois aspectos complementares: brandura de atitude e quietude interior.'
- source_word: τὴν πίστιν ... ὁλόκληρον
  choice: a fé íntegra
  rationale: Mantém a ideia de fé completa, inteira ou não dividida, sem definir além do que a expressão grega permite.
theological_decisions:
- issue: O sujeito implícito de κατοικεῖ em “ἐν αὐτῇ κατοικεῖ”
  choice: “o Senhor habita nela”
  alternative: “ele habita nela”
  rationale: O antecedente imediato e natural é “o Senhor”; repetir o título elimina uma ambiguidade pronominal criada em português sem acrescentar uma interpretação estranha ao grego.
- issue: Sentido de “fé íntegra”
  choice: Preservar a formulação sem explicação doutrinária
  alternative: Interpretar como fé perfeita, ortodoxa ou plena
  rationale: O adjetivo ὁλόκληρον indica inteireza ou completude, mas o trecho não especifica um sistema doutrinário nem uma condição soteriológica particular.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A cadência sentenciosa e os contrastes do original foram preservados, evitando tanto arcaísmos como terminologia confessional especializada.
