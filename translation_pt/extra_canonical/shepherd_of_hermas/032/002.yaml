base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/002.yaml
  text: But if a quick temper comes on, at once the holy spirit—being tender—is cramped, not having a clean place, and it seeks to withdraw from that place; for it is choked by the evil spirit, not having room to minister to the Lord as it desires, being defiled by the quick temper. For in long-suffering the Lord dwells, but in quick temper the devil. Therefore, when both spirits dwell together in one, it is unprofitable and harmful to that person in whom they dwell.
translation:
  language: pt
  text: Mas, se sobrevier um acesso de ira, imediatamente o espírito santo, por ser delicado, fica constrangido, pois não dispõe de um lugar puro, e procura retirar-se dali. Pois ele é sufocado pelo espírito mau, não tendo espaço para servir ao Senhor como deseja, contaminado pelo acesso de ira. Pois o Senhor habita na paciência, mas o diabo, no acesso de ira. Portanto, quando os dois espíritos habitam juntos, isso é prejudicial e mau para a pessoa em quem habitam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: acesso de ira / ira
  rationale: Expressa a disposição irascível e sua manifestação súbita em português corrente, sem restringi-la a mera impaciência.
- source_word: τρυφερόν
  choice: delicado
  rationale: Preserva a imagem de algo sensível e vulnerável à opressão, com linguagem natural.
- source_word: στενοχωρεῖται
  choice: fica constrangido
  rationale: Mantém a ideia espacial de ser apertado ou privado de espaço, desenvolvida nas frases seguintes.
- source_word: λειτουργῆσαι
  choice: servir
  rationale: Comunica de modo claro o serviço prestado a Deus, sem impor conotação litúrgica mais específica do que o contexto exige.
- source_word: μακροθυμία
  choice: paciência
  rationale: É a forma moderna mais compreensível para a perseverança paciente e o domínio da ira denotados aqui; evita o tom técnico de “longanimidade”.
- source_word: ἀσύμφορον ... καὶ πονηρόν
  choice: prejudicial e nocivo
  rationale: Conserva a dupla qualificação negativa do grego, embora os termos sejam semanticamente próximos.
theological_decisions:
- issue: Identidade de τὸ πνεῦμα τὸ ἅγιον
  choice: espírito santo
  alternative: Espírito Santo
  rationale: A inicial minúscula preserva a ambiguidade do contexto entre uma referência ao Espírito Santo e ao espírito santo/justo que habita na pessoa, sem decidir silenciosamente a questão.
- issue: Coabitação dos dois espíritos
  choice: habitam juntos no mesmo lugar
  alternative: habitam juntos em uma só pessoa
  rationale: Mantém a formulação espacial de ἐπὶ τὸ αὐτό; a frase seguinte esclarece que esse lugar é a pessoa, sem apagar a tensão retórica da imagem.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A tradução conserva a metáfora espacial contínua — lugar, constrangimento, retirada, sufocamento e falta de espaço — e evita terminologia denominacional.
