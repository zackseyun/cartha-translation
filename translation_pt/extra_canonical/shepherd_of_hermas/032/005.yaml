base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/005.yaml
  text: Quick temper, for its part, is first foolish—flighty and senseless. Then from senselessness comes bitterness; from bitterness, anger; from anger, wrath; and from wrath, rage. Then rage—composed of so many evils—becomes a great and incurable sin.
translation:
  language: pt
  text: A irritação, por sua vez, é, antes de tudo, insensata, leviana e sem juízo. Depois, da insensatez nasce a amargura; da amargura, a ira; da ira, a cólera; e da cólera, o furor. Então o furor, resultante de tantos males, torna-se um grande pecado incurável.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: irritação
  rationale: Expressa a disposição de irritar-se ou exaltar-se rapidamente, sem limitar o termo a um episódio isolado de raiva.
- source_word: μωρά
  choice: insensata
  rationale: Conserva o sentido moral e intelectual de falta de sensatez em linguagem natural.
- source_word: ἐλαφρά
  choice: leviana
  rationale: Reproduz a ideia de instabilidade e falta de ponderação, mais adequada ao contexto do que o literal físico «leve».
- source_word: ἄφρων / ἀφροσύνη
  choice: sem juízo / insensatez
  rationale: Mantém a relação semântica entre o adjetivo e o substantivo, evitando uma repetição artificial em português.
- source_word: πικρία
  choice: amargura
  rationale: Equivalente direto que preserva a metáfora moral do grego.
- source_word: θυμός
  choice: ira
  rationale: Representa uma reação intensa de ira e permite manter a gradação retórica dos termos seguintes.
- source_word: ὀργή
  choice: cólera
  rationale: Distingue este estágio de θυμός e conserva a progressão do texto.
- source_word: μῆνις
  choice: furor
  rationale: 'Comunica o auge da gradação: uma ira extrema e persistente, composta dos males anteriores.'
- source_word: ἁμαρτία μεγάλη καὶ ἀνίατος
  choice: um pecado grave e incurável
  rationale: «Grave» transmite naturalmente a seriedade de μεγάλη no contexto, enquanto «incurável» preserva a imagem explícita de ἀνίατος.
theological_decisions:
- issue: A relação entre os vícios e o pecado final
  choice: Preservar a sequência causal e cumulativa apresentada pelo texto
  alternative: Tratar todos os termos como simples sinônimos de raiva
  rationale: O grego distingue estágios sucessivos e afirma que o furor, constituído de muitos males, se torna um pecado grave e incurável; a tradução não deve nivelar essa tensão moral.
translation_notes:
  register: Português moderno, claro e digno, com uma cadência proverbial. A sequência de vícios foi mantida por meio de vocábulos distintos, embora os campos semânticos gregos se sobreponham parcialmente.
