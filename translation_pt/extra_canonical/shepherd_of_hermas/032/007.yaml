base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/007.yaml
  text: Therefore keep away from quick temper—that most wicked spirit—but clothe yourself with long-suffering, and stand against quick temper and bitterness, and you will be found with the dignity that is beloved by the Lord. See to it, then, that you never neglect this command; for if you gain mastery over this command, you will also be able to keep the other commands that I am about to give you. Be strong in them and be empowered[—], and let all be empowered who wish to walk in them.”
translation:
  language: pt
  text: Portanto, afaste-se da irritação, esse espírito tão perverso; revista-se, porém, de paciência e resista à irritação e à amargura. Assim, você será encontrado com a dignidade amada pelo Senhor. Cuide, pois, para que jamais negligencie este mandamento; porque, se dominar este mandamento, também poderá guardar os demais mandamentos que estou prestes a lhe dar. Seja forte nelas e fortaleça-se; e fortaleçam-se todos os que quiserem andar nelas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: irritação
  rationale: O termo descreve a disposição de se irar ou irritar rapidamente. “Irritação” é natural em português e mantém o sentido de uma inclinação interior, sem restringi-lo a um único acesso de ira.
- source_word: μακροθυμία
  choice: paciência
  rationale: Neste contraste com ὀξυχολία, indica domínio paciente e longânimo diante da provocação. “Paciência” é clara ao leitor comum; “longanimidade” seria mais formal e menos corrente.
- source_word: σεμνότης
  choice: dignidade
  rationale: Expressa respeitabilidade, nobreza ou seriedade moral. “Dignidade” preserva a qualidade ética sem importar terminologia confessional.
- source_word: παρενθυμηθῇς
  choice: negligencie
  rationale: No contexto, transmite deixar de levar em conta ou pôr de lado o mandamento. “Negligenciar” comunica isso de forma idiomática e digna.
- source_word: κυριεύσῃς
  choice: dominar
  rationale: Mantém a imagem de obter domínio sobre o mandamento, isto é, assimilá-lo e praticá-lo com firmeza, em ligação com o vocabulário de domínio empregado na seção.
- source_word: πορεύεσθαι
  choice: andar
  rationale: Preserva a metáfora ética tradicional de conduzir a vida segundo os mandamentos.
theological_decisions:
- issue: A irritação descrita como espírito
  choice: Manter “esse espírito tão perverso”
  alternative: Entender “espírito” apenas como atitude ou disposição
  rationale: O grego chama explicitamente a ὀξυχολία de πνεῦμα. A tradução preserva a linguagem e sua possível tensão antropológica ou espiritual, sem decidir se é personificação, disposição interior ou entidade espiritual.
- issue: Relação entre domínio deste mandamento e observância dos demais
  choice: Preservar a afirmação condicional direta
  alternative: Atenuar para mera ajuda ou progresso gradual
  rationale: O texto afirma que dominar este mandamento capacita a guardar os outros. Não se acrescenta uma explicação doutrinária nem se reduz a força da declaração.
- issue: Dois imperativos correlatos, ἰσχυροῦ e ἐνδυναμοῦ
  choice: “Seja forte neles e fortaleça-se”
  alternative: Fundir ambos em “seja fortalecido”
  rationale: A redação conserva a duplicação e a tensão entre vigor próprio e fortalecimento, sem especificar uma fonte não expressa no grego.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom exortativo e digno. O tratamento por “você” favorece clareza contemporânea; os imperativos mantêm a sequência e a força retórica do grego. Não foram necessárias notas de rodapé.
