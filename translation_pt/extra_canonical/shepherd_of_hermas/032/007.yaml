  source_fidelity: 'O texto acompanha de perto o grego: preserva a caracterização da irritação como «espírito», a sequência de exortações, a condição ligada ao domínio deste mandamento e a metáfora de «andar» nos mandamentos. A duplicação final dos imperativos também foi mantida. Contudo, o pronome que retoma «mandamentos» deve estar no feminino em português.'
