base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/001.yaml
  text: “Be long-suffering,” he says, “and sensible, and you will gain mastery over all wicked deeds and do every work of righteousness. For if you are long-suffering, the holy spirit that dwells in you will be pure, not being darkened by another evil spirit; rather, dwelling in a wide space it will exult and rejoice with the vessel in which it dwells, and it will minister to God with much cheerfulness, having prosperity within itself.
translation:
  language: pt
  text: “Seja paciente”, diz ele, “e sensato; assim você dominará todas as obras más e praticará toda a justiça. Pois, se for paciente, o espírito santo que habita em você permanecerá puro, sem ser obscurecido por outro espírito mau. Pelo contrário, habitando em lugar espaçoso, exultará e se alegrará com o recipiente em que habita e servirá a Deus com grande alegria, tendo dentro de si pleno bem-estar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακρόθυμος
  choice: paciente
  rationale: Expressa a disposição perseverante e controlada diante de provocações em linguagem atual; evita o caráter pouco corrente de “longânimo” sem reduzir o termo a mera espera.
- source_word: συνετός
  choice: sensato
  rationale: Comunica discernimento e bom juízo de modo natural e direto.
- source_word: κατακυριεύσεις
  choice: dominará
  rationale: Preserva a ideia forte de obter domínio sobre as obras más, sem sugerir apenas resistência passiva.
- source_word: ἐργάσῃ πᾶσαν δικαιοσύνην
  choice: praticará toda a justiça
  rationale: Mantém a formulação abrangente do grego e apresenta a justiça como conduta efetiva.
- source_word: ἐν εὐρυχώρῳ
  choice: em lugar espaçoso
  rationale: Conserva a imagem espacial do original, importante para o contraste posterior com o espírito que fica apertado.
- source_word: σκεύους
  choice: recipiente
  rationale: Preserva a metáfora de algo que contém o espírito; “vaso” poderia ser entendido apenas como um objeto específico no português corrente.
- source_word: λειτουργήσει
  choice: servirá
  rationale: Neste contexto, indica serviço prestado a Deus; evita importar uma noção litúrgica mais técnica do que o texto exige.
- source_word: εὐθηνίαν
  choice: pleno bem-estar
  rationale: Representa a ideia de condição próspera, abundante e livre de constrangimento, em harmonia com a imagem do espaço amplo.
theological_decisions:
- issue: Capitalização de τὸ πνεῦμα τὸ ἅγιον
  choice: “o espírito santo”, em minúsculas
  alternative: “o Espírito Santo”
  rationale: O contexto compara esse espírito com outros espíritos e emprega linguagem metafórica sobre sua condição dentro da pessoa. A minúscula preserva a apresentação textual e evita decidir por capitalização uma questão de identificação e pessoalidade que o grego, por si só, não resolve.
- issue: Relação entre o espírito e o recipiente humano
  choice: Manter a metáfora de habitação e do “recipiente” sem explicá-la
  alternative: Identificar explicitamente o recipiente como corpo ou pessoa
  rationale: O original não especifica aqui se σκεῦος designa corpo, pessoa ou outra dimensão humana; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com construção direta e legível no Brasil e em âmbito lusófono mais amplo. As imagens concretas de habitação, espaço e recipiente foram preservadas, enquanto termos hoje pouco usuais, como “longânimo”, foram evitados.
