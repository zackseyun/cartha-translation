  to: Pois, quando todos esses espíritos habitam num só recipiente, no qual também habita o espírito santo, não há espaço nele; ele transborda. Assim, o espírito delicado, não estando acostumado a habitar com um espírito maligno nem com a dureza, afasta-se de tal pessoa e procura habitar com a mansidão e a tranquilidade. Então, quando se afasta da pessoa em quem habitava, essa pessoa fica vazia do espírito justo e, daí em diante, cheia dos espíritos malignos, torna-se instável em tudo o que faz, arrastada de um lado para outro pelos espíritos malignos, e fica inteiramente cega quanto à compreensão do bem. É isso, portanto, o que acontece com todos os que se irritam facilmente.
