base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/006.yaml
  text: For when all these spirits dwell in one vessel, the very vessel in which the holy spirit also dwells, that vessel cannot contain them; it overflows. The tender spirit, having no habit of dwelling with an evil spirit or with harshness, withdraws from such a person and seeks to dwell with gentleness and quiet. Then, when it has departed from that person in whom it dwells, that person becomes empty of the righteous spirit; and thereafter, being filled with evil spirits, he is unstable in all his deeds, dragged here and there by the evil spirits, and is altogether blinded from his good understanding. Thus it happens to all who are quick-tempered.
translation:
  language: pt
  text: Pois, quando todos esses espíritos habitam num só recipiente, no qual também habita o espírito santo, não há espaço nele; ele transborda. Assim, o espírito delicado, não estando acostumado a habitar com um espírito maligno nem com a dureza, afasta-se de tal pessoa e procura habitar com a mansidão e a tranquilidade. Então, quando se afasta da pessoa em quem habitava, essa pessoa fica vazia do espírito justo e, daí em diante, cheia dos espíritos malignos, torna-se instável em tudo o que faz, arrastada de um lado para outro pelos espíritos malignos, e fica inteiramente cega quanto à compreensão do bem. É isso, portanto, o que acontece com todos os que se irritam facilmente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγος
  choice: recipiente
  rationale: Conserva a metáfora de algo que contém espíritos sem impor a imagem mais específica e potencialmente ambígua de “vaso” em português.
- source_word: τρυφερὸν πνεῦμα
  choice: espírito delicado
  rationale: “Delicado” expressa a sensibilidade e incompatibilidade com a dureza indicadas por τρυφερός, sem sugerir fraqueza moral.
- source_word: σκληρότης
  choice: dureza
  rationale: Equivalente direto que mantém o contraste com mansidão e tranquilidade.
- source_word: πραΰτης καὶ ἡσυχία
  choice: mansidão e tranquilidade
  rationale: 'Preserva as duas qualidades distintas: brandura de caráter e estado quieto ou sereno.'
- source_word: ἀκαταστατεῖ
  choice: torna-se instável
  rationale: Comunica a desordem e inconstância da pessoa em suas ações.
- source_word: ὀξύχολοι
  choice: os que se irritam facilmente
  rationale: Expressa em linguagem corrente a disposição irascível e pronta para a cólera, em vez de um mero episódio de raiva.
theological_decisions:
- issue: Identidade e capitalização de πνεῦμα τὸ ἅγιον e πνεῦμα τοῦ δικαίου
  choice: “espírito santo” e “espírito justo”, em minúsculas
  alternative: “Espírito Santo” e “Espírito da justiça”
  rationale: O contexto de Hermas personifica e relaciona diversos “espíritos”, e a identificação precisa do espírito santo/justo com a pessoa trinitária não deve ser resolvida tipograficamente pela tradução. A formulação mantém a ambiguidade do texto grego.
- issue: Mudança entre “espírito santo” e “espírito justo”
  choice: manter as duas designações distintas
  alternative: uniformizar ambas como “Espírito Santo”
  rationale: O grego muda deliberadamente de τὸ πνεῦμα τὸ ἅγιον para τὸ πνεῦμα τοῦ δικαίου; a tradução não apaga essa variação, embora o contexto possa apontar para o mesmo referente.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente para leitores brasileiros e compreensão internacional. A metáfora do recipiente e do transbordamento foi preservada, assim como a sequência causal e a ambiguidade pneumatológica do original.
