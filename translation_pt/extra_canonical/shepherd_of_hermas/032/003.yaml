base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/003.yaml
  text: 'For if, after taking a little wormwood, you pour it into a jar of honey, does not all the honey perish? So much honey is ruined by the smallest amount of wormwood: it destroys the sweetness of the honey, and it no longer has the same usefulness with its master, because it has been embittered and has lost its use. But if the wormwood is not cast into the honey, the honey is found sweet and becomes serviceable to its master.'
translation:
  language: pt
  text: 'Pois, se você pegar um pouco de absinto e o derramar num pote de mel, não se estragará todo o mel? Uma quantidade tão grande de mel é arruinada por uma porção mínima de absinto: ele destrói a doçura do mel, e o mel já não agrada do mesmo modo ao seu dono, porque se tornou amargo e perdeu sua utilidade. Mas, se o absinto não for lançado no mel, o mel permanece doce e se torna útil ao seu dono.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀψίνθιον
  choice: absinto
  rationale: É o equivalente português tradicional e preciso para a planta proverbialmente amarga mencionada no texto.
- source_word: κεράμιον μέλιτος
  choice: pote de mel
  rationale: Expressa em linguagem corrente um recipiente de barro contendo mel, sem sobrecarregar a tradução com um detalhe material não essencial à comparação.
- source_word: ἀφανίζεται / ἀπόλλυται
  choice: se estragará / é arruinada
  rationale: No contexto alimentar, os verbos indicam que o mel fica inutilizado, não que deixe literalmente de existir.
- source_word: χάριν ἔχει παρὰ τῷ δεσπότῃ
  choice: agrada do mesmo modo ao seu dono
  rationale: Preserva a ideia de χάρις como aceitação ou apreço aos olhos do proprietário, evitando reduzi-la apenas à utilidade, que é mencionada separadamente na oração seguinte.
- source_word: τὴν χρῆσιν αὐτοῦ ἀπώλεσεν / εὔχρηστον
  choice: perdeu sua utilidade / útil
  rationale: Mantém a correspondência lexical entre a perda de uso e aquilo que é adequado ao uso pelo dono.
theological_decisions:
- issue: Valor moral da imagem do mel e do absinto
  choice: Manter a comparação concreta sem acrescentar sua interpretação moral neste segmento
  alternative: Explicitar que o mel representa a paciência e o absinto, a irritação
  rationale: A identificação é feita no contexto seguinte; inseri-la aqui anteciparia a explicação do autor e ampliaria o texto.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial natural. A segunda pessoa foi vertida por “você” para ampla legibilidade brasileira, enquanto “seu dono” conserva a relação concreta entre o produto e quem o possui. Não foram necessárias notas de rodapé.
