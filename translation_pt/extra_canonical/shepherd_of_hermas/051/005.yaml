base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/005.yaml
  text: I say to him, "Sir, since I have you with me, I must ask you and question you; for you show me everything and speak with me. But if apart from you I were seeing or hearing these things, I would ask the Lord that it might be made clear to me."
translation:
  language: pt
  text: 'Eu lhe digo: “Senhor, já que você está comigo, preciso pedir-lhe e fazer-lhe perguntas, pois você me mostra tudo e fala comigo. Mas, se eu visse ou ouvisse essas coisas sem você, pediria ao Senhor que fossem esclarecidas para mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém a forma respeitosa de tratamento e também a correspondência lexical com a segunda ocorrência, cujo referente é explicitamente o Senhor; o contexto permite ao leitor distinguir os referentes.
- source_word: ἀνάγκην ἔχω
  choice: preciso
  rationale: Expressa naturalmente a ideia idiomática de necessidade ou obrigação, sem o peso artificial de uma tradução literal como “tenho necessidade”.
- source_word: αἰτεῖσθαι καὶ ἐπερωτᾶν
  choice: fazer perguntas e interrogá-lo
  rationale: Preserva os dois verbos coordenados e sua leve intensificação, embora haja sobreposição semântica entre pedir/perguntar e indagar.
- source_word: ἄτερ σοῦ
  choice: sem você
  rationale: Equivalente corrente e claro para “à parte de ti” ou “sem ti”.
- source_word: δηλωθῇ
  choice: fossem esclarecidas para mim
  rationale: O passivo aoristo subjuntivo indica que as coisas fossem tornadas claras; o plural recupera naturalmente “essas coisas” em português.
theological_decisions:
- issue: Distinção entre o interlocutor chamado Κύριε e τὸν Κύριον
  choice: Traduzir ambos por “Senhor”, deixando a mudança de referente ao contexto.
  alternative: Usar “senhor” para o interlocutor e “Senhor” para Deus.
  rationale: O grego emprega a mesma forma lexical, e a capitalização é uma distinção editorial inexistente no original. A tradução preserva a tensão referencial sem impor uma diferenciação tipográfica.
- issue: Agente implícito de δηλωθῇ
  choice: 'Manter a construção passiva: “fossem esclarecidas para mim”.'
  alternative: Explicitar “que o Senhor as esclarecesse para mim”.
  rationale: O original não explicita o agente da passiva; mantê-lo implícito evita acrescentar uma determinação, ainda que o pedido seja dirigido ao Senhor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para fluência brasileira. A construção conserva a repetição deliberada de pedir/perguntar e a alternância contextual entre o guia e o Senhor.
