base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/002.yaml
  text: He says, "I will explain everything to you, and whatever I speak with you I will show you. The one who has received the commands of prudence will fill his own soul and will pray to the Lord on your behalf.
translation:
  language: pt
  text: 'Ele diz: “Eu explicarei tudo a você e mostrarei a você tudo o que eu falar com você. Aquele que recebeu os mandamentos da prudência encherá a própria alma e orará ao Senhor em seu favor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλύσω
  choice: explicarei
  rationale: No contexto, o verbo significa esclarecer ou interpretar as parábolas, não apenas ‘resolver’.
- source_word: δείξω
  choice: mostrarei
  rationale: Preserva a imagem direta do grego e distingue este verbo de ἐπιλύσω, ‘explicarei’.
- source_word: φροσύνης
  choice: prudência
  rationale: Mantém o sentido de discernimento ou sensatez prática sem restringi-lo a uma tradição doutrinária específica.
- source_word: ἐμπλήσῃ τὴν ἑαυτοῦ ψυχὴν
  choice: encherá a própria alma
  rationale: Reproduz a expressão metafórica do texto grego sem acrescentar um objeto ou conteúdo que a fonte não explicita.
- source_word: εὔξηται ὑπὲρ σοῦ πρὸς τὸν Κύριον
  choice: orará ao Senhor em seu favor
  rationale: Expressa naturalmente em português tanto o destinatário da oração quanto seu caráter intercessório.
theological_decisions:
- issue: Relação de φροσύνης com ‘mandamentos’
  choice: os mandamentos da prudência
  alternative: os mandamentos de sua prudência
  rationale: A sequência transmitida contém σου, mas o trecho fornecido parece textualmente desordenado ou corrompido, e a camada inglesa auditada entende a expressão sem o possessivo. A escolha evita atribuir sem clareza os mandamentos à prudência do interlocutor.
- issue: Conteúdo com que a alma é enchida
  choice: não explicitar o conteúdo
  alternative: encherá a própria alma com esses mandamentos
  rationale: O grego não fornece complemento expresso; preserva-se a abertura sem inserir uma interpretação teológica.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de tratamento brasileiras legíveis. Conserva o paralelismo entre ‘explicarei’ e ‘mostrarei’ e a metáfora de encher a alma.
