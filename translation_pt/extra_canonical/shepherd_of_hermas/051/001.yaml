  text: I say, "Sir, I do not know these parables, nor am I able to understand them unless you explain them to me."
translation:
  language: pt
  text: 'Eu digo: “Senhor, não compreendo estas parábolas, nem consigo entendê-las, a menos que o senhor as explique para mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Forma respeitosa de tratamento dirigida ao interlocutor; preserva a correspondência tradicional e o tom digno.
- source_word: παραβολὰς
  choice: parábolas
  rationale: Equivalente direto e natural, apropriado às comparações figuradas apresentadas no contexto.
- source_word: οὐ γινώσκω οὐδὲ δύναμαι νοῆσαι
  choice: não compreendo... nem consigo entendê-las
  rationale: Mantém os dois verbos gregos e sua progressão, embora em português haja sobreposição semântica entre compreender e entender.
- source_word: ἐπιλύσῃς
  choice: explique
  rationale: No contexto, indica esclarecer ou interpretar o sentido das parábolas.
theological_decisions:
- issue: Sentido de Κύριε como forma de tratamento
  choice: Senhor
  alternative: senhor
  rationale: A inicial maiúscula preserva a prática editorial tradicional sem identificar necessariamente o interlocutor como Deus; aqui funciona como tratamento respeitoso.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição semântica do grego foi preservada de modo natural. O tratamento por “o senhor” na oração subordinada evita a ambiguidade coloquial de “você” e mantém respeito.
