base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/004.yaml
  text: '"You shall keep these things thus—you, with your children and your whole household; and having kept them you will be blessed; and as many as, having heard them, keep them will be blessed, and they will receive understanding from the Lord."'
translation:
  language: pt
  text: “Você guardará essas coisas assim, com seus filhos e toda a sua casa. Depois de guardá-las, será feliz; e todos os que, depois de ouvi-las, as guardarem também serão felizes e receberão entendimento do Senhor.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρήσεις / τηρήσας / τηρήσωσι
  choice: guardará / guardar / guardarem
  rationale: Mantém a repetição enfática do verbo grego, aqui no sentido de observar e pôr em prática as instruções dadas.
- source_word: τέκνων
  choice: filhos
  rationale: Equivalente natural de τέκνα neste contexto familiar, sem excluir coletivamente os descendentes ou dependentes imediatos.
- source_word: οἴκου
  choice: casa
  rationale: “Casa” preserva o sentido antigo de unidade doméstica ou lar, mais amplo que o edifício físico.
- source_word: μακάριος / μακάριοι
  choice: feliz / felizes
  rationale: Expressa o estado favorecido e bem-aventurado indicado por μακάριος em linguagem corrente e digna.
- source_word: σύνεσιν
  choice: entendimento
  rationale: Reflete a ideia de compreensão ou discernimento concedido pelo Senhor.
theological_decisions:
- issue: Relação entre guardar as instruções e ser feliz
  choice: Preservar a sequência condicional do grego sem explicar sua natureza teológica
  alternative: Explicitar que a felicidade é recompensa meritória ou, ao contrário, mero resultado prático
  rationale: O texto associa observância e felicidade, mas não define aqui uma doutrina de mérito; a tradução conserva essa tensão sem acrescentar interpretação denominacional.
- issue: Origem do entendimento
  choice: “receberão entendimento do Senhor”
  alternative: “receberão do Senhor a capacidade de compreender”
  rationale: A formulação concisa conserva o Senhor como fonte do entendimento e evita ampliar o conteúdo do substantivo grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “guardar” foi mantida por ser estrutural no original; “toda a sua casa” conserva o alcance doméstico antigo sem recorrer ao mais técnico “casa inteira” ou “família inteira”.
