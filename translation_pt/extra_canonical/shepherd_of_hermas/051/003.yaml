base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/003.yaml
  text: '"If, then, you complete the fast in this way as I commanded you, your sacrifice will be acceptable before God, and this fast will be recorded; and the service performed in this way is good and cheerful and acceptable to the Lord.'
translation:
  language: pt
  text: Se, portanto, você cumprir o jejum dessa maneira, como lhe ordenei, seu sacrifício será aceitável diante de Deus, e esse jejum ficará registrado. O serviço realizado dessa maneira é bom, alegre e bem-aceito pelo Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελέσῃς
  choice: cumprir
  rationale: No contexto, indica levar o jejum a termo conforme as instruções recebidas; “cumprir” soa natural e conserva a ideia de completude e observância.
- source_word: θυσία
  choice: sacrifício
  rationale: Mantém o termo cultual direto do grego e a relação entre o jejum praticado e a oferta apresentada a Deus.
- source_word: ἔγγραφος
  choice: ficará registrado
  rationale: Reproduz a imagem de algo posto por escrito ou inscrito, sem especificar onde ou por quem, preservando a abertura do original.
- source_word: λειτουργία
  choice: serviço
  rationale: Aqui designa uma ação de serviço religioso ou ministerial; “serviço” é claro, digno e não restringe indevidamente o sentido a uma liturgia formal.
- source_word: ἱλαρά
  choice: alegre
  rationale: Conserva a caracterização positiva e jubilosa do serviço, sem transformá-la apenas em referência à disposição interior de quem o realiza.
- source_word: εὐπρόσδεκτος
  choice: bem-aceito
  rationale: Expressa que o serviço é acolhido favoravelmente pelo Senhor e distingue levemente o termo do anterior δεκτή.
theological_decisions:
- issue: O sentido do jejum “registrado”
  choice: Manter apenas “ficará registrado”
  alternative: Explicitar “será registrado diante de Deus” ou “no céu”
  rationale: O grego não identifica o registro nem seu lugar; a tradução evita acrescentar uma interpretação teológica não expressa.
- issue: Relação entre jejum, sacrifício e aceitação divina
  choice: Preservar as três afirmações tal como aparecem
  alternative: Parafrasear o jejum como sendo ele próprio o sacrifício meritório
  rationale: O texto associa o modo de cumprir o jejum ao caráter aceitável do sacrifício, mas não define explicitamente a relação técnica entre ambos.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A coordenação do grego foi dividida em duas frases para fluidez, sem alterar a progressão do argumento.
