base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/002.yaml
  text: Therefore, having cleansed the sins of the people, he showed them the paths of life, giving them the law that he received from his Father. “You see,” he says, “that he himself is Lord of the people, having received all authority from his Father. And as for the Lord’s taking his Son and the glorious angels as counselors concerning the inheritance of the slave—listen.
translation:
  language: pt
  text: Portanto, tendo purificado os pecados do povo, ele lhes mostrou os caminhos da vida, dando-lhes a lei que havia recebido de seu Pai. “Você vê”, diz ele, “que ele mesmo é Senhor do povo, pois recebeu de seu Pai toda a autoridade. E, quanto ao Senhor ter tomado seu Filho e os anjos gloriosos como conselheiros a respeito da herança do servo, ouça.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαθάρισε
  choice: purificar
  rationale: Mantém a imagem de remover a impureza dos pecados, sem reduzi-la apenas a perdão.
- source_word: τὰς τρίβους τῆς ζωῆς
  choice: os caminhos da vida
  rationale: Expressão natural em português que conserva a metáfora plural de vias que conduzem ou pertencem à vida.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o título e sua relação de autoridade sobre o povo; a inicial maiúscula acompanha a referência pessoal no contexto.
- source_word: ἐξουσίαν πᾶσαν
  choice: toda a autoridade
  rationale: Verte diretamente a ideia de autoridade plena recebida do Pai.
- source_word: σύμβουλον ἔλαβε
  choice: tomado ... como conselheiros
  rationale: Conserva a formulação incomum do grego, ao mesmo tempo que ajusta o número ao objeto composto em português.
- source_word: κληρονομίας τοῦ δούλου
  choice: herança do servo
  rationale: Mantém a ambiguidade do genitivo, que pode dizer respeito à herança destinada ao servo ou associada a ele, sem explicitá-la indevidamente.
theological_decisions:
- issue: Capitalização de Pai, Senhor e Filho
  choice: Pai, Senhor e Filho
  alternative: pai, senhor e filho
  rationale: A capitalização ajuda o leitor moderno a reconhecer as referências pessoais a Deus e ao Filho, sem acrescentar uma definição dogmática ausente do trecho.
- issue: Agente da purificação dos pecados
  choice: manter o pronome “ele”
  alternative: substituí-lo por um título ou nome interpretativo
  rationale: O grego usa αὐτός e depende do contexto anterior; conservar o pronome evita resolver aqui a identidade do agente além do que o segmento declara.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A fala direta e a progressão argumentativa foram preservadas; não se acrescentou explicação doutrinária à linguagem de Pai, Filho, autoridade, lei ou herança.
