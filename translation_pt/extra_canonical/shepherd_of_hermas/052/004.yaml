base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/004.yaml
  text: Therefore he took the Son and the glorious angels as counselors, in order that this flesh also, having served the Spirit blamelessly, might have some place of dwelling, and might not seem to have lost the reward of its service. For every flesh that is found undefiled and unstained, in which the Holy Spirit has dwelt, will receive a reward. You have the interpretation of this parable also.”
translation:
  language: pt
  text: Por isso, tomou como conselheiros o Filho e os anjos gloriosos, para que também essa carne, que serviu irrepreensivelmente ao Espírito, recebesse algum lugar de morada e não parecesse ter perdido a recompensa pelo seu serviço. Pois toda carne que for encontrada incontaminada e sem mancha, e na qual o Espírito Santo tiver habitado, receberá uma recompensa. Você tem também a explicação desta parábola.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμβουλον ἔλαβε
  choice: tomou como conselheiros
  rationale: Preserva a imagem deliberativa do grego, ajustando o número em português porque o complemento inclui o Filho e os anjos.
- source_word: ἡ σὰρξ αὕτη
  choice: essa carne
  rationale: Mantém o termo concreto e teologicamente carregado σάρξ, bem como sua referência anafórica à carne mencionada no contexto.
- source_word: τόπον τινὰ κατασκηνώσεως
  choice: algum lugar onde habitar
  rationale: Expressa com naturalidade a ideia de um lugar de morada ou estabelecimento, sem determinar além do que o texto declara.
- source_word: τὸν μισθὸν τῆς δουλείας αὐτῆς
  choice: a recompensa pelo seu serviço
  rationale: Μισθός é aqui recompensa ou paga, enquanto δουλεία designa serviço; a formulação evita a conotação moderna indevida de escravidão compulsória.
- source_word: ἀμίαντος καὶ ἄσπιλος
  choice: incontaminada e sem mancha
  rationale: Conserva os dois adjetivos coordenados e sua ênfase na pureza.
- source_word: ἐπίλυσιν
  choice: explicação
  rationale: No contexto das parábolas, indica sua interpretação ou elucidação; “explicação” é corrente e clara.
theological_decisions:
- issue: Distinção entre o Filho, o Espírito Santo e a carne
  choice: Preservar separadamente “o Filho”, “o Espírito” e “essa carne”
  alternative: Harmonizar explicitamente essas referências com uma formulação cristológica posterior
  rationale: A passagem emprega categorias próprias e apresenta tensão interpretativa genuína; a tradução não deve resolver nem reformular sua teologia.
- issue: Identidade do sujeito de “tomou”
  choice: Manter o sujeito implícito, como no grego imediato
  alternative: Inserir “Deus” ou “o Senhor” no texto
  rationale: O contexto permite recuperar o sujeito, mas explicitá-lo eliminaria uma característica sintática do original e poderia decidir uma ambiguidade contextual.
- issue: Natureza da recompensa e do lugar de habitação
  choice: Não especificar o que são a recompensa e o lugar
  alternative: Identificá-los como salvação, céu ou glorificação
  rationale: O texto não fornece essa identificação nesta unidade, portanto a tradução preserva sua abertura.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A sintaxe foi levemente reorganizada para clareza, sem suavizar a linguagem incomum da passagem sobre a carne, o Espírito e o Filho.
