revisions:
- from: O Espírito Santo, que preexistia e criou toda a criação, Deus fez habitar na carne que ele quis. Essa carne, portanto, na qual o Espírito Santo habitou, serviu bem ao Espírito, vivendo com dignidade e pureza, sem de modo algum contaminar o Espírito. Assim, visto que ela viveu de maneira boa e pura, trabalhou juntamente com o Espírito e cooperou em tudo, comportando-se com firmeza e coragem, ele a escolheu para ser participante com o Espírito Santo; pois a conduta dessa carne agradou [ao Senhor][a], porque ela não se contaminou na terra enquanto tinha o Espírito Santo.
  to: O Espírito Santo, que preexistia e criou toda a criação, Deus fez habitar numa carne que quis. Essa carne, portanto, na qual o Espírito Santo habitou, serviu bem ao Espírito, vivendo com dignidade e pureza, sem de modo algum contaminar o Espírito. Assim, visto que ela viveu de maneira boa e pura, trabalhou juntamente com o Espírito, cooperou em toda obra e se comportou com firmeza e coragem, ele a escolheu como companheira do Espírito Santo; pois a conduta dessa carne agradou [ao Senhor][a], porque ela não se contaminou na terra enquanto tinha o Espírito Santo.
  rationale: A revisão é estilística e lexicalmente pontual. Mantém as ambiguidades do texto, inclusive o sujeito implícito de «ele a escolheu», sem identificar doutrinariamente a carne. Também preserva a leitura editorialmente incerta «ao Senhor» com a respectiva nota.
