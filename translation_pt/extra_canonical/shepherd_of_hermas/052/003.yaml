  naturalness: O texto é geralmente claro e moderno. «Para ser participante com o Espírito Santo» é pouco idiomático em português e soa abstrato; «como companheira do Espírito Santo» é mais natural e mantém a associação expressa pelo grego. «Em toda obra» reproduz melhor ἐν παντὶ πράγματι do que «em tudo», sem perda de fluência.
  terminology: «Espírito Santo», «carne», «pureza» e «conduta» são escolhas adequadas. «Numa carne que quis» evita sugerir uma categoria genérica por meio de «na carne», conservando a referência a uma carne determinada, mas sem artigo no grego. A nota sobre «ao Senhor» continua necessária.
