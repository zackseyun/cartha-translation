base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/003.yaml
  text: The Holy Spirit, which preexisted, which created all creation, God caused to dwell in flesh that he willed. This flesh, then, in which the Holy Spirit dwelt, served the Spirit well, walking in modesty and purity, in no way at all defiling the Spirit. Therefore, since it had conducted itself well and purely, and had toiled together with the Spirit and cooperated in every matter, conducting itself strongly and courageously, he chose it as a partner with the Holy Spirit; for the conduct of this flesh pleased [the Lord], because it was not defiled upon the earth while having the Holy Spirit.
translation:
  language: pt
  text: O Espírito Santo, que preexistia e criou toda a criação, Deus fez habitar numa carne que quis. Essa carne, portanto, na qual o Espírito Santo habitou, serviu bem ao Espírito, vivendo com dignidade e pureza, sem de modo algum contaminar o Espírito. Assim, visto que ela viveu de maneira boa e pura, trabalhou juntamente com o Espírito, cooperou em toda obra e se comportou com firmeza e coragem, ele a escolheu como companheira do Espírito Santo; pois a conduta dessa carne agradou [ao Senhor][a], porque ela não se contaminou na terra enquanto tinha o Espírito Santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns testemunhos omitem “ao Senhor”.
    reason: A edição grega apresenta τῷ Κυρίῳ entre colchetes, indicando incerteza textual.
lexical_decisions:
- source_word: τὸ προόν
  choice: que preexistia
  rationale: Preserva a afirmação temporal explícita do particípio grego sem ampliá-la teologicamente.
- source_word: κατῴκισεν ... εἰς σάρκα
  choice: fez habitar na carne
  rationale: Expressa a construção causativa e mantém o termo concreto 'carne'.
- source_word: ἐν σεμνότητι καὶ ἁγνείᾳ πορευθεῖσα
  choice: vivendo com dignidade e pureza
  rationale: Traduz o idioma de 'andar' por uma formulação natural, retendo as qualidades éticas de σεμνότης e ἁγνεία.
- source_word: συγκοπιάσασαν ... καὶ συνεργήσασαν
  choice: trabalhou juntamente ... e cooperou
  rationale: Mantém distintos os dois verbos de esforço conjunto e cooperação.
- source_word: κοινωνόν
  choice: participante
  rationale: Conserva a ideia ampla de associação ou participação, sem impor uma definição metafísica mais específica.
- source_word: πορεία
  choice: conduta
  rationale: No contexto moral, designa o modo de viver da carne, e não deslocamento literal.
theological_decisions:
- issue: Identidade da 'carne' e relação com o Espírito Santo
  choice: Manter a linguagem do texto sobre a carne servindo ao Espírito e sendo escolhida como participante com ele.
  alternative: Explicitar que a carne é Jesus, ou reformular segundo terminologia cristológica posterior.
  rationale: O trecho emprega linguagem parabólica e potencialmente tensa; a tradução não deve resolver uma identificação ou harmonização que o segmento não explicita.
- issue: Sujeito de 'ele a escolheu'
  choice: Preservar o pronome com referente contextual implícito.
  alternative: Substituir por 'Deus a escolheu' ou 'o Senhor a escolheu'.
  rationale: O grego traz o verbo sem sujeito nominal expresso; explicitar um referente eliminaria uma pequena ambiguidade discursiva.
- issue: Leitura textual τῷ Κυρίῳ
  choice: Traduzir 'ao Senhor' com nota textual.
  alternative: Omitir a expressão conforme testemunhos em que ela não aparece.
  rationale: Os colchetes da edição indicam incerteza textual e devem ser transparentemente sinalizados ao leitor.
translation_notes:
  register: Português moderno, corrente e digno, com leitura natural no Brasil e compreensão internacional. Mantiveram-se 'Espírito Santo' e 'carne' por sua importância conceitual, evitando paráfrases doutrinárias. A personificação gramatical de 'carne' foi preservada por meio de pronomes femininos, como no grego.
