base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/001.yaml
  text: He says, “I told you just now that you are crafty and headstrong, asking for the interpretations of the parables. But since you are so persistent, I will interpret for you the parable of the field and the rest. He entrusted them to the angels to keep them; and he himself cleansed their sins, having labored much and endured many toils—for no one can dig without toil or labor.
translation:
  language: pt
  text: 'Ele diz: “Eu lhe disse há pouco que você é astuto e obstinado, pedindo interpretações das parábolas. Mas, já que você é tão persistente, explicarei a você a parábola do campo e as demais. Ele os confiou aos anjos para que os guardassem; e ele mesmo purificou os pecados deles, tendo trabalhado muito e suportado muitas fadigas — pois ninguém pode cavar sem esforço ou trabalho.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πανοῦργος
  choice: astuto
  rationale: Expressa inteligência hábil com conotação crítica, sem recorrer ao sentido mais forte de “malicioso”.
- source_word: αὐθάδης
  choice: obstinado
  rationale: No contexto, caracteriza a insistência firme e algo impertinente do interlocutor; “obstinado” mantém a censura sem soar excessivamente ofensivo.
- source_word: ἐπιλύσεις
  choice: explicações
  rationale: Em relação às parábolas, indica a exposição ou interpretação de seu sentido; “explicações” é natural e acessível.
- source_word: παράμονος
  choice: persistente
  rationale: Preserva a ideia de insistência continuada que motiva a concessão do orador.
- source_word: συντηρεῖν
  choice: guardar
  rationale: Abrange a noção de conservar, proteger e manter sob cuidado.
- source_word: ἐκαθάρισε
  choice: purificou
  rationale: Mantém o campo religioso e moral do verbo aplicado aos pecados.
- source_word: κόπους / κόπου / μόχθου
  choice: fadigas / esforço / trabalho
  rationale: Varia o português para refletir os termos gregos relacionados, preservando a ênfase acumulativa no labor penoso.
theological_decisions:
- issue: Referentes pronominais em “ele os confiou” e “os pecados deles”
  choice: Manter os pronomes sem explicitar os referentes
  alternative: Inserir “o povo” ou outra identificação interpretativa
  rationale: O segmento fornecido começa no meio de uma explicação e os referentes dependem do contexto anterior; explicitá-los resolveria uma ambiguidade que o trecho não resolve por si só.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” para clareza contemporânea. A repetição ligada a esforço e trabalho foi preservada por ser retoricamente significativa. A fonte grega normalizada apresenta uma lacuna ou corrupção de OCR entre “as demais coisas” e “ele os confiou”; a redação segue a evidência recuperável e a camada inglesa auditada, sem acrescentar conteúdo conjectural.
