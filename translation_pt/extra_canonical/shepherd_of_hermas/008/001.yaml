  source_fidelity: 'A tradução transmite com precisão o enunciado grego: a revelação durante o sono, o jovem de aparência belíssima, a identificação inicialmente equivocada da anciã como a Sibila, sua identificação como a Igreja e a explicação de sua anterioridade e da formação do mundo em relação a ela. “Por causa dela” preserva adequadamente a amplitude de διὰ ταύτην.'
