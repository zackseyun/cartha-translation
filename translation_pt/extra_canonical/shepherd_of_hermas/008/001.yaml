  terminology: “Sibila”, “Igreja”, “anciã” e “pequeno livro” são escolhas adequadas e consistentes com o grego e com o registro do texto. “Foi criada antes de todas as coisas” comunica a prioridade expressa por πάντων πρώτη ἐκτίσθη sem acrescentar explicação doutrinária.
