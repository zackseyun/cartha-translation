base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/008/001.yaml
  text: 'And it was revealed to me, brothers, while I was asleep, by a very handsome young man who said to me: “The old woman, from whom you received the little book—who do you think she is?” I said, “The Sibyl.” “You are mistaken,” he says; “she is not.” “Then who is she?” I say. “The Church,” he says. I said to him, “Why then is she old?” “Because,” he says, “she was created first of all; for this reason she is old, and for her sake the world was formed.”'
translation:
  language: pt
  text: 'E foi-me revelado, irmãos, enquanto eu dormia, por um jovem de belíssima aparência, que me perguntou: “Quem você pensa que é a anciã de quem recebeu o pequeno livro?” Eu respondi: “A Sibila.” “Você está enganado”, disse ele. “Não é ela.” “Quem é, então?”, perguntei. “A Igreja”, respondeu ele. Eu lhe perguntei: “Por que, então, ela é anciã?” “Porque”, respondeu ele, “foi criada antes de todas as coisas. Por isso é anciã, e por causa dela o mundo foi formado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Vocativo plural direto e tradicional; no contexto, dirige-se à comunidade sem necessidade de explicitação interpretativa adicional.
- source_word: νεανίσκου εὐειδεστάτου
  choice: um jovem de belíssima aparência
  rationale: Preserva tanto a juventude indicada por νεανίσκος quanto o superlativo de beleza/aparência de εὐειδέστατος, em português natural.
- source_word: πρεσβυτέραν
  choice: anciã
  rationale: Mantém a caracterização feminina e a ideia de idade/antiguidade, além de distingui-la dos πρεσβύτεροι eclesiásticos mencionados mais adiante na seção.
- source_word: βιβλίδιον
  choice: pequeno livro
  rationale: Reproduz o diminutivo grego de modo claro, sem recorrer a 'livrinho', que poderia soar excessivamente informal.
- source_word: Σίβυλλαν
  choice: Sibila
  rationale: Forma portuguesa consagrada para a figura profética do mundo greco-romano.
- source_word: Ἐκκλησία
  choice: Igreja
  rationale: Equivalente natural de ἐκκλησία neste contexto personificado; a inicial maiúscula sinaliza a identidade figurada apresentada pela visão.
- source_word: πάντων πρώτη ἐκτίσθη
  choice: foi criada antes de todas as coisas
  rationale: Expressa o sentido temporal de πρώτη πάντων sem sugerir simplesmente uma posição hierárquica; mantém a voz passiva de ἐκτίσθη.
- source_word: διὰ ταύτην
  choice: por causa dela
  rationale: Mantém a relação causal ou teleológica ampla da preposição διά com acusativo, sem especificar além do texto se significa benefício, finalidade ou motivo.
- source_word: ὁ κόσμος κατηρτίσθη
  choice: o mundo foi formado
  rationale: '''Foi formado'' comunica a ideia de ordenar, preparar ou constituir de καταρτίζω, preservando a passiva e evitando equipará-la automaticamente a criação ex nihilo.'
theological_decisions:
- issue: Preexistência ou prioridade da Igreja
  choice: “foi criada antes de todas as coisas”
  alternative: “foi a primeira de todas a ser criada”
  rationale: A formulação escolhida preserva a afirmação forte de prioridade temporal do texto, sem explicar sua metafísica nem harmonizá-la com uma doutrina eclesiológica posterior.
- issue: Relação entre a Igreja e a formação do mundo
  choice: “por causa dela o mundo foi formado”
  alternative: “para ela o mundo foi preparado”
  rationale: A tradução mantém a ambiguidade de διὰ ταύτην e o valor amplo de κατηρτίσθη, sem decidir se a Igreja é causa, finalidade ou beneficiária da formação do mundo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. O diálogo foi pontuado de maneira natural, e a alternância de verbos de elocução evita rigidez sem alterar os participantes ou o conteúdo. Não há notas de rodapé, portanto não se aplicam marcadores.
