  text: 2. Afterward I saw a vision in my house. The old woman came and asked me whether I had already given the book to the elders. I denied having given it. “You have done well,” she says; “for I have words to add. When, therefore, I complete all the words, through you they will be made known to all the elect.
translation:
  language: pt
  text: '2. Depois disso, tive uma visão em minha casa. A anciã veio e me perguntou se eu já havia entregado o livro aos presbíteros. Respondi que não o havia entregado. Ela disse: “Você fez bem, pois ainda tenho palavras a acrescentar. Portanto, quando eu tiver completado todas as palavras, por seu intermédio elas serão dadas a conhecer a todos os eleitos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ πρεσβυτέρα
  choice: a anciã
  rationale: Mantém a designação da mulher idosa apresentada no contexto, distinguindo-a de τοῖς πρεσβυτέροις, traduzido como “presbíteros” por indicar os dirigentes da igreja.
- source_word: τὸ βιβλίον
  choice: o livro
  rationale: Equivalente natural e direto; preserva a distinção contextual em relação ao diminutivo βιβλαρίδια do versículo seguinte.
- source_word: τοῖς πρεσβυτέροις
  choice: aos presbíteros
  rationale: No contexto, refere-se aos responsáveis que presidem a igreja; “presbíteros” preserva a terminologia eclesial antiga sem substituir por uma estrutura denominacional moderna.
- source_word: ἠρνησάμην δεδωκέναι
  choice: Respondi que não o havia entregado
  rationale: Expressa naturalmente em português a negação em resposta à pergunta, sem a possível conotação moderna de recusa deliberada que “neguei-me a entregá-lo” poderia sugerir.
- source_word: ῥήματα
  choice: palavras
  rationale: Preserva a formulação concreta e repetida do grego, sem interpretar antecipadamente como “mensagens” ou “revelações”.
- source_word: διὰ σοῦ
  choice: por seu intermédio
  rationale: Comunica com clareza a função mediadora de Hermas na divulgação, sem implicar que ele seja a fonte das palavras.
- source_word: τοῖς ἐκλεκτοῖς πᾶσιν
  choice: a todos os eleitos
  rationale: Mantém a linguagem teológica do texto e sua abrangência, sem especificar além do que o grego declara.
theological_decisions:
- issue: Identidade e função dos πρεσβύτεροι
  choice: presbíteros
  alternative: anciãos
  rationale: O contexto imediato os identifica como dirigentes da igreja. “Presbíteros” distingue o ofício coletivo da figura feminina chamada “a anciã”, sem impor uma equivalência denominacional contemporânea.
- issue: Sentido de “todos os eleitos”
  choice: manter a expressão sem explicação interpretativa
  alternative: todo o povo escolhido de Deus
  rationale: O grego não define aqui o alcance nem a natureza da eleição; a tradução preserva essa tensão teológica.
- issue: Agência na divulgação das palavras
  choice: “por seu intermédio elas serão dadas a conhecer”
  alternative: “você as dará a conhecer”
  rationale: A construção passiva γνωρισθήσεται deixa o agente último não expresso e destaca Hermas como meio; a tradução conserva essa nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavemente naturalizada, mas a repetição de “palavras” e a linguagem de “eleitos” foram preservadas por sua relevância literária e teológica.
