  text: 3. “So you will write two little booklets, and you will send one to Clement and one to Grapte. Then Clement will send it to the cities outside, for this has been entrusted to him; but Grapte will admonish the widows and the orphans. But you will read it aloud in this city with the elders who preside over the church.”
translation:
  language: pt
  text: 3. “Portanto, você escreverá dois livretos e enviará um a Clemente e outro a Grapte. Clemente o enviará às cidades de fora, pois essa tarefa lhe foi confiada; Grapte, por sua vez, aconselhará as viúvas e os órfãos. Você, porém, o lerá nesta cidade, juntamente com os presbíteros que dirigem a igreja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύο βιβλαρίδια
  choice: dois livretos
  rationale: O diminutivo de βιβλίον indica dois pequenos rolos ou livros; “livretos” preserva essa nuance em português natural.
- source_word: εἰς τὰς ἔξω πόλεις
  choice: às cidades de fora
  rationale: Mantém a expressão espacial deliberadamente não específica, sem identificar por conjectura quais seriam as cidades.
- source_word: νουθετήσει
  choice: aconselhará
  rationale: Expressa instrução e exortação pastoral em linguagem corrente, sem a conotação predominantemente punitiva que “admoestará” pode ter hoje.
- source_word: ἀναγνωσῇ
  choice: fará a leitura
  rationale: No contexto comunitário, o verbo se refere à leitura pública; a formulação comunica isso naturalmente sem acrescentar um objeto ausente no grego.
- source_word: πρεσβυτέρων
  choice: presbíteros
  rationale: Conserva o título comunitário antigo e evita reduzir o termo simplesmente à idade física.
- source_word: προϊσταμένων
  choice: que dirigem
  rationale: Traduz a função de estar à frente, liderar ou supervisionar, sem impor um cargo eclesiástico mais específico que o texto.
theological_decisions:
- issue: Natureza da liderança da igreja
  choice: “presbíteros que dirigem a igreja”
  alternative: “anciãos que presidem a igreja”
  rationale: A tradução preserva tanto o título πρεσβύτεροι quanto sua função expressa pelo particípio προϊστάμενοι, sem identificar essa liderança com uma estrutura denominacional posterior.
- issue: Destinatários do ministério de Grapte
  choice: “as viúvas e os órfãos”
  alternative: “as viúvas e os que não têm pais”
  rationale: “Órfãos” é a equivalência direta e tradicional de ὀρφανούς, sem especificar idade ou condição além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem contrastiva entre Clemente, Grapte e Hermas foi preservada. Não há notas de rodapé, portanto não se aplicam marcadores.
