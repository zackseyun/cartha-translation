  text: Listen to me, children. I reared you in great simplicity and innocence and dignity, through the mercy of the Lord, who caused righteousness to drip upon you, so that you might be justified and …
translation:
  language: pt
  text: Ouçam-me, filhos. Eu os criei com grande simplicidade, inocência e dignidade, por meio da misericórdia do Senhor, que gotejou sobre vocês a justiça, para que fossem justificados e…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: filhos
  rationale: Preserva a forma afetuosa de tratamento parental; em português, «filhos» é natural neste discurso.
- source_word: ἐξέθρεψα
  choice: criei
  rationale: Expressa criar e nutrir até o crescimento, sem restringir o sentido à alimentação.
- source_word: ἁπλότητι
  choice: simplicidade
  rationale: Mantém o sentido de singeleza e sinceridade moral, sem explicitar uma nuance além do grego.
- source_word: ἀκακίᾳ
  choice: inocência
  rationale: Comunica ausência de maldade em linguagem corrente e digna.
- source_word: σεμνότητι
  choice: dignidade
  rationale: Reflete respeitabilidade e seriedade moral, adequando-se ao conjunto de virtudes.
- source_word: διὰ τὸ ἔλεος
  choice: por causa da misericórdia
  rationale: Traduz a relação causal mais provável de διά com acusativo.
- source_word: στάξαντος τὴν δικαιοσύνην
  choice: que fez gotejar sobre vocês a justiça
  rationale: Conserva a metáfora concreta e incomum do original, bem como a ação divina ligada à misericórdia.
- source_word: δικαιωθῆτε
  choice: fossem justificados
  rationale: Preserva a voz passiva e a ligação lexical com «justiça», sem resolver o alcance teológico do verbo.
theological_decisions:
- issue: Relação entre a justiça derramada e a justificação
  choice: «a justiça, para que fossem justificados»
  alternative: «a retidão, para que se tornassem justos»
  rationale: A formulação escolhida mantém a repetição da raiz δικαι- e a voz passiva teológica, sem determinar se o texto enfatiza declaração, transformação moral ou ambas.
- issue: Agente implícito da justificação
  choice: 'voz passiva: «fossem justificados»'
  alternative: «Deus os justificasse»
  rationale: O grego não nomeia explicitamente o agente; a tradução conserva essa forma e sua tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O imperativo plural foi vertido por «Ouçam-me»; «vocês» evita regionalismo excessivo. As reticências indicam que a unidade-fonte termina no meio da oração.
