base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/003.yaml
  text: And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name of the Lord; then, when the purity of the truth comes to their remembrance, they repent and go back again after their evil desires.
translation:
  language: pt
  text: E os outros que caem junto às águas, mas não conseguem rolar para a água — quer saber quem são? São os que ouviram a palavra e querem ser batizados no nome do Senhor. Então, quando lhes vem à memória a pureza da verdade, arrependem-se e voltam a seguir seus maus desejos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυλισθῆναι εἰς τὸ ὕδωρ
  choice: rolar para dentro da água
  rationale: Preserva a imagem concreta das pedras e o movimento indicado pelo verbo, sem reduzir a expressão a simplesmente entrar na água.
- source_word: βαπτισθῆναι εἰς τὸ ὄνομα τοῦ Κυρίου
  choice: ser batizados no nome do Senhor
  rationale: Usa uma formulação portuguesa natural e reconhecível, mantendo a referência explícita ao nome do Senhor.
- source_word: ἡ ἁγνότης τῆς ἀληθείας
  choice: a pureza da verdade
  rationale: Mantém a relação genitiva e evita acrescentar uma explicação não expressa no grego, como 'a pureza exigida pela verdade'.
- source_word: μετανοοῦσιν
  choice: mudam de ideia
  rationale: Embora o verbo frequentemente signifique 'arrepender-se', neste contexto a mudança leva os ouvintes de volta aos maus desejos; 'mudam de ideia' comunica essa inversão sem atribuir-lhe uma conotação positiva incompatível com a sequência.
- source_word: πορεύονται πάλιν ὀπίσω τῶν ἐπιθυμιῶν αὐτῶν τῶν πονηρῶν
  choice: voltam a seguir seus maus desejos
  rationale: Reproduz naturalmente em português o movimento de retorno e a ideia de ir atrás dos desejos, evitando uma tradução espacial rígida.
theological_decisions:
- issue: Sentido de μετανοοῦσιν numa mudança que conduz de volta aos maus desejos
  choice: mudam de ideia
  alternative: arrependem-se
  rationale: A tradução escolhida preserva o sentido básico de mudança de mente sem sugerir arrependimento moral diante de Deus, pois o resultado imediato é o retorno aos desejos maus. A nota registra a tradução tradicional possível.
- issue: Relação batismal expressa por εἰς τὸ ὄνομα
  choice: no nome do Senhor
  alternative: para dentro do nome do Senhor
  rationale: A forma literal 'para dentro do nome' seria pouco natural em português e poderia impor uma leitura técnica. 'No nome' mantém a fórmula e não especifica uma teologia batismal denominacional.
translation_notes:
  register: Português moderno, claro e digno, com construção oral adequada à pergunta da personagem. A metáfora das pedras foi mantida de modo concreto; evitou-se terminologia confessional adicional.
