review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a imagem das pedras, a proximidade das águas, o desejo de batismo e o retorno aos maus desejos. Contudo, «mudam de ideia» restringe indevidamente μετανοοῦσιν e a nota orienta o leitor para uma resolução interpretativa que o grego não explicita. O verbo deve ser vertido por «arrependem-se», preservando inclusive a tensão contextual do texto.
  naturalness: O texto é claro e moderno. «Junto às águas» e «rolar para a água» soam um pouco mais naturais e diretos do que «perto das águas» e «rolar para dentro da água», sem perda da imagem.
  terminology: «Ser batizados no nome do Senhor», «a pureza da verdade» e «maus desejos» são escolhas adequadas. «Arrependem-se» é o correspondente português normal de μετανοοῦσιν e evita substituir o termo por uma explicação interpretativa.
  issues:
  - severity: medium
    issue: «mudam de ideia» para μετανοοῦσιν
    rationale: Embora o contexto produza uma sequência interpretativamente difícil, μετανοοῦσιν é o verbo usual para «arrepender-se». «Mudam de ideia» reduz o alcance moral-religioso normal do termo e a nota explica a sequência de modo que o original não torna explícito.
  - severity: low
    issue: Nota explicativa sobre μετανοοῦσιν
    rationale: A nota apresenta como leitura contextual estabelecida que a mudança de ideia é o que os conduz aos maus desejos. É mais seguro manter a ambiguidade e não acrescentar essa harmonização interpretativa.
  revised_text: E os outros que caem junto às águas, mas não conseguem rolar para a água — quer saber quem são? São os que ouviram a palavra e querem ser batizados no nome do Senhor. Então, quando lhes vem à memória a pureza da verdade, arrependem-se e voltam a seguir seus maus desejos.
