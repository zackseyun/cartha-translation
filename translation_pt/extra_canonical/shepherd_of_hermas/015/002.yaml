base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/002.yaml
  text: But those that fall into the fire and are burned—these are the ones who have finally turned away from the living God, and it no longer came up into their heart to repent because of the desires of their lewdness and the evils they have done.
translation:
  language: pt
  text: Mas os que caem no fogo e são queimados são os que se afastaram definitivamente do Deus vivo; já não lhes veio ao coração arrepender-se, por causa dos desejos de sua devassidão e das maldades que praticaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τέλος ἀποστάντες
  choice: se afastaram definitivamente
  rationale: A expressão indica afastamento levado até o fim; “definitivamente” preserva a força do grego sem impor um termo técnico posterior como “apostataram”.
- source_word: τοῦ Θεοῦ τοῦ ζῶντος
  choice: do Deus vivo
  rationale: Reprodução direta e natural do título grego.
- source_word: οὐκέτι αὐτοῖς ἀνέβη ἐπὶ τὴν καρδίαν
  choice: já não lhes veio ao coração
  rationale: Mantém a imagem semítica conservada no grego e evita reduzir a expressão a mera decisão intelectual.
- source_word: μετανοῆσαι
  choice: arrepender-se
  rationale: Expressa a mudança interior e moral indicada pelo infinitivo grego.
- source_word: τὰς ἐπιθυμίας τῆς ἀσελγείας αὐτῶν
  choice: os desejos de sua devassidão
  rationale: “Devassidão” comunica a conduta desenfreada e moralmente dissoluta de ἀσέλγεια, enquanto “desejos” preserva ἐπιθυμίας.
- source_word: τῶν πονηριῶν ὧν εἰργάσαντο
  choice: das maldades que praticaram
  rationale: Traduz o plural concreto e o verbo de ação de modo idiomático, sem suavizar a responsabilidade pessoal.
theological_decisions:
- issue: Caráter do afastamento de Deus
  choice: se afastaram definitivamente
  alternative: apostataram completamente
  rationale: A formulação escolhida preserva a intensidade de εἰς τέλος e ἀποστάντες sem importar uma definição dogmática posterior de apostasia.
- issue: Incapacidade ou ausência de arrependimento
  choice: já não lhes veio ao coração arrepender-se
  alternative: já não podiam arrepender-se
  rationale: O grego descreve que o arrependimento não lhes surgiu no coração; não afirma diretamente uma incapacidade metafísica ou uma impossibilidade decretada.
- issue: Relação causal da conduta com a falta de arrependimento
  choice: por causa dos desejos de sua devassidão e das maldades que praticaram
  alternative: devido à sua luxúria e às suas obras más
  rationale: Mantém a causalidade explícita de διά e distingue os desejos desordenados das ações más já realizadas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A frase preserva a imagem de algo ‘vir ao coração’ e a tensão do texto entre afastamento consumado, desejos desordenados, atos maus e ausência de arrependimento.
