base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/001.yaml
  text: 'As for the other stones that you saw thrown far from the tower and falling into the road and rolling from the road into the pathless places: these are those who have believed, but because of their double‑mindedness they abandon their true road. Thinking, then, that they are able to find a better road, they go astray and suffer misery as they walk in the pathless places.'
translation:
  language: pt
  text: 'Quanto às outras pedras que você viu serem lançadas para longe da torre, caírem na estrada e rolarem da estrada para lugares sem caminho: elas representam os que creram, mas, por terem o coração dividido, abandonam seu verdadeiro caminho. Pensando que podem encontrar um caminho melhor, perdem-se e passam por sofrimentos enquanto andam por lugares sem caminho.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: coração dividido
  rationale: Expressa em português corrente a instabilidade interior sugerida literalmente por ‘dupla alma’, sem reduzi-la a mera dúvida intelectual.
- source_word: ὁδός
  choice: estrada / caminho
  rationale: ‘Estrada’ descreve o elemento da visão, enquanto ‘caminho’ comunica naturalmente seu sentido figurado; a repetição deliberada é preservada.
- source_word: ἀνοδίαι
  choice: lugares sem caminho
  rationale: Reproduz a imagem de regiões sem via ou passagem definida e mantém o contraste com o caminho verdadeiro.
- source_word: πλανῶνται
  choice: perdem-se
  rationale: Abrange tanto o desvio do rumo quanto o estado de quem anda extraviado.
- source_word: ταλαιπωροῦσιν
  choice: passam por sofrimentos
  rationale: Comunica a aflição e a penúria experimentadas por eles, em linguagem clara e digna.
theological_decisions:
- issue: A condição dos que já creram
  choice: ‘os que creram’ e depois ‘abandonam seu verdadeiro caminho’
  alternative: Interpretar a fé como apenas aparente ou negar que tenham realmente seguido o caminho
  rationale: O grego afirma explicitamente que eles creram e atribui seu abandono ao coração dividido; a tradução preserva essa tensão sem impor uma solução doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preservou-se a metáfora espacial e a repetição de ‘caminho’, evitando terminologia denominacional.
