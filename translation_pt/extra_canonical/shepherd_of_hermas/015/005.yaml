revisions:
- from: Mas se ajustarão a outro lugar, muito menor; e isso acontecerá quando tiverem sido atormentados e tiverem cumprido os dias de seus pecados. Serão transferidos por terem participado da palavra do Justo.[a] Então lhes será concedido sair de seus tormentos, se as más obras que praticaram lhes vierem ao coração.[b] Mas, se não lhes vierem ao coração, não serão salvos, por causa da dureza de seu coração.”
  to: Mas se encaixarão em outro lugar, muito menor; e isso acontecerá quando tiverem sido atormentados e tiverem cumprido os dias de seus pecados. Por isso serão transferidos, porque participaram da palavra do justo.[a] Então serão transferidos para fora de seus tormentos, se as más obras que praticaram lhes vierem ao coração.[b] Mas, se não lhes vierem ao coração, não serão salvos, por causa da dureza de seu coração.”
  rationale: A revisão corrige a segunda ocorrência de «transferir», preservando o sentido de remoção para fora dos tormentos, elimina a noção adicional de concessão e evita a capitalização interpretativa de «justo». Também aperfeiçoa a fluência da metáfora arquitetônica, sem resolver além do necessário as ambiguidades do original.
