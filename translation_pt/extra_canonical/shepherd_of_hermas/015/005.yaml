  naturalness: «Se encaixarão em outro lugar, muito menor» é mais natural em português e mantém a imagem construtiva de ἁρμόσουσιν. «Serão transferidos para fora de seus tormentos» reproduz de modo claro o movimento indicado por ἐκ.
