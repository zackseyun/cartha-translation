base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/005.yaml
  text: Rather, they will fit in another place, much smaller; and this will be when they have been tormented and have completed the days of their sins. And for this reason they will be transferred, because they have shared in the word of the righteous one. And then it will happen that they are transferred from their torments, if the evil deeds they have done come up into their heart. But if they do not come up into their heart, they are not saved because of their hardness of heart.”
translation:
  language: pt
  text: Mas se encaixarão em outro lugar, muito menor; e isso acontecerá quando tiverem sido atormentados e tiverem cumprido os dias de seus pecados. Por isso serão transferidos, porque participaram da palavra do justo.[a] Então serão transferidos para fora de seus tormentos, se as más obras que praticaram lhes vierem ao coração.[b] Mas, se não lhes vierem ao coração, não serão salvos, por causa da dureza de seu coração.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «da palavra do justo». Não identifica de modo explícito quem é o «justo».
    reason: Preserva o referente pessoal indicado pela forma masculina, sem impor uma identificação doutrinária.
  - marker: b
    text: Literalmente, «subirem ao coração». A expressão indica que as obras más lhes vêm à mente.
    reason: Explica o idioma grego sem substituir sua imagem no texto principal.
lexical_decisions:
- source_word: ἁρμόσουσιν
  choice: se ajustarão
  rationale: Preserva a metáfora arquitetônica das pedras que se encaixam em determinado lugar da construção.
- source_word: βασανισθῶσιν
  choice: tiverem sido atormentados
  rationale: Reproduz o sentido forte e passivo do verbo, sem amenizá-lo para mera provação.
- source_word: ἐκπληρώσωσιν τὰς ἡμέρας τῶν ἁμαρτιῶν αὐτῶν
  choice: tiverem cumprido os dias de seus pecados
  rationale: Mantém a formulação temporal incomum e sua possível ambiguidade, em vez de explicá-la como pena ou período determinado.
- source_word: μετέλαβον
  choice: terem participado
  rationale: Expressa participação ou partilha sem especificar além do que o grego afirma.
- source_word: τοῦ ῥήματος τοῦ δικαίου
  choice: da palavra do Justo
  rationale: Conserva o genitivo grego, que pode indicar a palavra proveniente do Justo ou relacionada a ele.
- source_word: ἀναβῇ ἐπὶ τὴν καρδίαν
  choice: vierem ao coração
  rationale: Mantém o idioma semítico-grego com naturalidade em português, indicando que os atos chegam à consciência ou lembrança.
- source_word: σκληροκαρδίαν
  choice: dureza de seu coração
  rationale: Preserva a imagem moral e bíblica do composto grego.
theological_decisions:
- issue: Identidade de τοῦ δικαίου
  choice: do Justo
  alternative: da justiça / do que é justo
  rationale: A forma masculina singular favorece referência pessoal, mas a nota registra a ambiguidade possível sem impor uma identificação cristológica explícita.
- issue: Sentido de μετατεθήσονται e μετατεθῆναι ἐκ τῶν βασάνων
  choice: serão transferidos / sair de seus tormentos
  alternative: serão removidos / serão trasladados para fora de seus tormentos
  rationale: A primeira ocorrência preserva o movimento para outro lugar; na segunda, o complemento ἐκ indica retirada dos tormentos. A tradução evita definir a natureza escatológica exata desse processo.
- issue: Condição ligada à lembrança das más obras
  choice: se as más obras que praticaram lhes vierem ao coração
  alternative: se reconhecerem no coração as más obras que praticaram
  rationale: Mantém a condição expressa pelo texto sem converter implicitamente a lembrança em arrependimento pleno, embora o contexto possa sugeri-lo.
translation_notes:
  register: Português moderno, digno e acessível, com leve solenidade adequada ao texto cristão antigo. A metáfora das pedras e a linguagem de tormento, pecado, coração e salvação foram preservadas. As notas tratam apenas de ambiguidades relevantes no grego.
