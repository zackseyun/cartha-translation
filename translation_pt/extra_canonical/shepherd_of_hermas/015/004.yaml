    issue: Atenuação de ἀναιδευσάμενος
    rationale: «Tomando coragem» pode sugerir mero encorajamento interior, enquanto o termo descreve Hermas tornando-se novamente ousado ou importuno ao perguntar. «Voltando a ser ousado» é fiel sem impor a carga mais forte de «descarado».
  - severity: medium
    issue: Reformulação excessiva de μετάνοια
    rationale: «Podem se arrepender» é compreensível, mas converte o substantivo em possibilidade verbal e a resposta em capacidade. «Há arrependimento para elas» preserva melhor a formulação e sua amplitude semântica.
