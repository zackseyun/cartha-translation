  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/004.yaml
  text: So she finished the explanation of the tower. But, becoming bold again, I questioned her further whether all these stones that were cast away and did not fit into the building of the tower—whether there is repentance for them and whether they have a place in this tower. “They have repentance,” she says, “but they cannot fit into this tower.
translation:
  language: pt
  text: 'Assim, ela terminou a explicação da torre. Mas eu, voltando a ser ousado, perguntei-lhe ainda se todas essas pedras, rejeitadas e não ajustadas à construção da torre, tinham arrependimento e lugar nessa torre. Ela respondeu: “Há arrependimento para elas, mas não podem ajustar-se a esta torre.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέλεσεν
  choice: terminou
  rationale: Expressa de modo natural e direto a conclusão da explicação.
- source_word: ἀναιδευσάμενος
  choice: tomando coragem
  rationale: No contexto, indica que o narrador voltou a ousar ou a insistir em perguntar; evita a conotação excessivamente negativa de “tornando-me descarado”.
- source_word: ἀποβεβλημένοι
  choice: haviam sido rejeitados
  rationale: Preserva a ideia de pedras descartadas da construção.
- source_word: ἁρμόζοντες / ἁρμόσαι
  choice: se encaixavam / se encaixar
  rationale: Mantém a metáfora arquitetônica de pedras ajustadas à estrutura.
- source_word: μετάνοια
  choice: poderiam se arrepender / podem se arrepender
  rationale: Neste contexto, o substantivo designa a possibilidade de arrependimento; a formulação verbal é mais natural em português e conserva o sentido.
- source_word: τόπον
  choice: lugar
  rationale: Equivalente direto que preserva a pergunta sobre inclusão na torre.
theological_decisions:
- issue: Sentido de μετάνοια como possibilidade ou oportunidade de arrependimento
  choice: “poderiam se arrepender” e “podem se arrepender”
  alternative: “há arrependimento para eles” ou “têm oportunidade de arrependimento”
  rationale: A construção portuguesa escolhida é idiomática e não define se se trata apenas de possibilidade, concessão ou período específico para arrependimento.
- issue: Destino dos blocos rejeitados
  choice: “não podem se encaixar nesta torre”
  alternative: “não podem ser incorporados a esta torre”
  rationale: Preserva a afirmação restrita a “esta torre”, sem antecipar nem harmonizar com a explicação subsequente sobre outro lugar.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A metáfora da construção foi preservada por meio de “blocos de pedra” e “se encaixar”. Não foram acrescentadas explicações teológicas ausentes do segmento.
