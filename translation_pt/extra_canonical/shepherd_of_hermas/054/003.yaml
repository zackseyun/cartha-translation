base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/003.yaml
  text: “These commandments are beneficial for those who are about to repent; for if they do not walk in them, their repentance is in vain.
translation:
  language: pt
  text: Esses mandamentos são proveitosos para os que estão prestes a se arrepender; pois, se não andarem neles, o arrependimento deles é inútil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφοροι
  choice: proveitosos
  rationale: Expressa aquilo que traz benefício ou vantagem, preservando o tom exortativo do grego.
- source_word: τοῖς μέλλουσι μετανοεῖν
  choice: para os que estão prestes a se arrepender
  rationale: Mantém o valor prospectivo de μέλλουσι e traduz μετανοεῖν por uma formulação natural e reconhecível em português.
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: andarem neles
  rationale: Preserva a metáfora bíblica de conduzir a vida segundo os mandamentos; o masculino retoma naturalmente “mandamentos” em português.
- source_word: εἰς μάτην
  choice: será inútil
  rationale: Comunica que o arrependimento fica sem efeito ou proveito, em linguagem clara e digna.
theological_decisions:
- issue: Relação entre arrependimento e obediência aos mandamentos
  choice: Preservar a afirmação direta de que, sem andar nos mandamentos, o arrependimento é inútil.
  alternative: Atenuar para dizer apenas que o arrependimento seria “incompleto” ou “questionável”.
  rationale: O grego εἰς μάτην ἐστίν é enfático. Atenuá-lo introduziria uma harmonização teológica não presente no texto.
translation_notes:
  register: Português moderno, claro e digno, com preservação da metáfora tradicional “andar nos mandamentos”. A ordem e a relação causal do grego foram mantidas sem rigidez artificial.
