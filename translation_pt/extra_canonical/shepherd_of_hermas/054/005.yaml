base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/005.yaml
  text: And after he had spoken these things with me, he says to me, “Let us go into the country, and I will show you the shepherds of the sheep.” “Let us go, sir,” I say. And we came to a certain plain, and he shows me a shepherd, a young man, clothed in a composite garment, saffron in color.
translation:
  language: pt
  text: 'Depois de ele ter falado essas coisas comigo, disse-me: “Vamos para o campo, e eu lhe mostrarei os pastores das ovelhas.” “Vamos, senhor”, respondi. Então chegamos a certa planície, e ele me mostrou um jovem pastor, vestido com uma veste composta, de cor de açafrão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγρόν
  choice: campo
  rationale: No contexto, indica a região rural ou aberta para onde os personagens se dirigem; “campo” é natural e preserva a distinção em relação à planície mencionada depois.
- source_word: ποιμένας τῶν προβάτων
  choice: os pastores das ovelhas
  rationale: Mantém o plural antecipatório do grego, embora nesta cena seja mostrado inicialmente um só pastor.
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento dirigida ao interlocutor; a minúscula evita identificá-lo sem base explícita com o Senhor divino.
- source_word: πεδίον
  choice: planície
  rationale: Expressa uma área ampla e plana, distinguindo-se de ἀγρόν, traduzido por “campo”.
- source_word: νεανίσκον
  choice: jovem
  rationale: Transmite de modo direto a juventude do pastor sem impor uma faixa etária excessivamente precisa.
- source_word: σύνθεσιν ἱματίων
  choice: uma roupa feita de diferentes peças
  rationale: A expressão é incomum e literalmente sugere uma composição ou combinação de vestes; a formulação preserva essa ideia sem recorrer ao pouco natural “veste composta”.
- source_word: κροκώδη
  choice: de cor açafrão
  rationale: Designa tonalidade semelhante à do açafrão, geralmente amarelo intenso ou alaranjado; mantém a referência cromática antiga.
theological_decisions:
- issue: Identidade do personagem tratado por κύριε
  choice: “senhor”, com inicial minúscula
  alternative: “Senhor”, com inicial maiúscula
  rationale: O termo funciona aqui como tratamento respeitoso (“senhor”), e o trecho não exige uma identificação divina do interlocutor.
- issue: Plural “pastores” seguido da apresentação de um único pastor
  choice: preservar “os pastores” e depois “um pastor”
  alternative: harmonizar para “um pastor” na primeira fala
  rationale: A mudança de plural para singular está no texto grego e pode antecipar os diferentes pastores mostrados ao longo da visão; não deve ser eliminada.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira e vocabulário amplamente internacional. Conservou-se o presente histórico em “falou-me”/“mostrou” apenas parcialmente regularizado para uma narrativa natural; o diálogo permanece direto e respeitoso. Não foram necessárias notas de rodapé.
