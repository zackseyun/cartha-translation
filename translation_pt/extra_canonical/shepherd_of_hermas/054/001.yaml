base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/001.yaml
  text: 'While I was sitting in my house and glorifying the Lord for all the things I had seen, and pondering the commandments—that they are good and powerful and gladdening and glorious and able to save a person’s soul—I said within myself: “Blessed shall I be if I walk in these commandments, and whoever walks in them will be blessed.”'
translation:
  language: pt
  text: 'Enquanto eu estava sentado em minha casa, glorificando o Senhor por tudo o que tinha visto e refletindo sobre os mandamentos — que são bons, poderosos, alegres, gloriosos e capazes de salvar a alma humana —, disse comigo mesmo: “Serei feliz se andar segundo estes mandamentos, e quem andar segundo eles será feliz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συζητῶν
  choice: refletindo
  rationale: No contexto de uma deliberação interior, transmite ponderação cuidadosa em português natural.
- source_word: ἱλαραὶ
  choice: alegres
  rationale: Preserva o valor positivo de algo jubiloso ou que traz alegria, sem reduzir o termo apenas a ‘agradáveis’.
- source_word: πορευθῶ / πορευθῇ
  choice: andar segundo
  rationale: Mantém a metáfora bíblica de conduzir a vida conforme os mandamentos, com clareza para leitores modernos.
- source_word: μακάριος
  choice: feliz
  rationale: Expressa o estado de bem-aventurança ou felicidade favorecida indicado pelo grego, em linguagem corrente e digna.
- source_word: ψυχὴν ἀνθρώπου
  choice: a alma humana
  rationale: Representa de modo conciso a construção grega ‘alma de um ser humano’, sem restringi-la ao sexo masculino.
theological_decisions:
- issue: Os mandamentos como capazes de salvar a alma
  choice: capazes de salvar a alma humana
  alternative: que podem contribuir para a salvação da pessoa
  rationale: A tradução mantém a afirmação direta e sua tensão teológica, sem acrescentar uma explicação doutrinária ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, de ampla legibilidade brasileira. A repetição de ‘mandamentos’ e ‘feliz’ foi preservada por sua função retórica; a metáfora de ‘andar’ foi mantida com o complemento idiomático ‘segundo’.
