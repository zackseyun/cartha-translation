base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/002.yaml
  text: 'As I was saying these things within myself, I suddenly see him seated beside me and saying this: “Why are you double-minded about the commandments that I commanded you? They are good. Do not be double-minded at all, but clothe yourself with the faith of the Lord, and you will walk in them; for I will strengthen you in them.'
translation:
  language: pt
  text: 'Enquanto eu dizia essas coisas a mim mesmo, de repente o vejo sentado ao meu lado, dizendo: “Por que você está dividido quanto aos mandamentos que lhe ordenei? Eles são bons. Não fique de modo algum dividido; pelo contrário, revista-se da fé do Senhor, e você andará segundo esses mandamentos, pois eu lhe darei forças para cumpri-los.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχεῖς / διψυχήσῃς
  choice: está dividido / fique... dividido
  rationale: O verbo descreve hesitação ou divisão interior. A formulação preserva a imagem de ânimo dividido sem recorrer ao pouco natural “ter duas almas”.
- source_word: ἔνδυσαι
  choice: revista-se
  rationale: Mantém a metáfora explícita de vestir-se, natural e reconhecível em português.
- source_word: πορεύσῃ ... ἐν αὐταῖς
  choice: andará segundo esses mandamentos
  rationale: O grego emprega a metáfora de caminhar neles; “andar segundo” conserva a linguagem de conduta e torna claro o referente do pronome.
- source_word: ἐνδυναμώσω σε ἐν αὐταῖς
  choice: eu lhe darei forças para cumpri-los
  rationale: Expressa a capacitação prometida no âmbito dos mandamentos. “Cumpri-los” explicita a finalidade idiomática da construção, sem atribuir a força ao próprio esforço humano.
theological_decisions:
- issue: Sentido de πίστιν τοῦ Κυρίου
  choice: fé do Senhor
  alternative: fé no Senhor
  rationale: O genitivo grego é genuinamente ambíguo entre origem/qualidade e objeto. A tradução formal “do Senhor” preserva essa tensão em vez de decidir silenciosamente por “no Senhor”.
- issue: Relação entre fortalecimento e obediência
  choice: “eu lhe darei forças para cumpri-los”
  alternative: “eu o fortalecerei neles”
  rationale: A redação apresenta a obediência como possibilitada pelo fortalecimento do interlocutor, sem desenvolver uma conclusão doutrinária além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. O presente narrativo de βλέπω foi preservado em “o vejo”. A repetição de “dividido” reflete a insistência retórica do grego.
