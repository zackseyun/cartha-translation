base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/004.yaml
  text: “You, therefore, who are repenting, cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”
translation:
  language: pt
  text: Portanto, vocês que estão se arrependendo, livrem-se das maldades desta era, que os estão consumindo; e, revestindo-se de toda virtude da justiça, poderão guardar estes mandamentos e não mais acrescentar coisa alguma aos seus pecados. Pois, se não acrescentarem mais nada, vocês se afastarão de seus pecados anteriores. Portanto, sigam estes meus mandamentos, e viverão para Deus. Estas coisas todas[a] lhes foram ditas por mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos omitem «todas».
    reason: O termo πάντα («todas») aparece entre colchetes na edição-fonte, indicando incerteza textual.
lexical_decisions:
- source_word: ἀποβάλλετε
  choice: livrem-se de
  rationale: Expressa naturalmente a ordem de lançar fora ou abandonar as maldades, sem perder a força imperativa.
- source_word: τὰς πονηρίας
  choice: as maldades
  rationale: Mantém o plural concreto do grego e sua amplitude moral.
- source_word: τοῦ αἰῶνος τούτου
  choice: desta era
  rationale: Preserva a referência ao presente período ou ordem do mundo, sem reduzi-la simplesmente ao tempo cronológico.
- source_word: τὰς ἐκτριβούσας ὑμᾶς
  choice: que os estão consumindo
  rationale: ἐκτρίβω pode sugerir desgastar, arruinar ou consumir; a escolha comunica o efeito destrutivo com clareza moderna.
- source_word: ἐνδυσάμενοι
  choice: revestindo-se
  rationale: Preserva a metáfora de vestir-se, importante no contraste com livrar-se das maldades.
- source_word: πᾶσαν ἀρετὴν δικαιοσύνης
  choice: toda virtude da justiça
  rationale: Segue de perto a construção grega, preservando a possível relação qualificadora entre virtude e justiça.
- source_word: πορεύεσθε
  choice: sigam
  rationale: No contexto de mandamentos, comunica de modo idiomático a metáfora de andar ou conduzir a vida segundo eles.
- source_word: ζήσεσθε τῷ Θεῷ
  choice: viverão para Deus
  rationale: Mantém o dativo τῷ Θεῷ sem decidir entre todos os matizes possíveis, como viver para Deus, diante de Deus ou em relação a Deus.
theological_decisions:
- issue: Relação entre arrependimento, abandono do pecado e afastamento dos pecados anteriores
  choice: 'Preservar a sequência condicional do texto: não acrescentar novos pecados leva a afastar-se dos anteriores.'
  alternative: Interpretar explicitamente como perdão ou expiação dos pecados passados.
  rationale: O grego usa ἀποστήσεσθε, 'vocês se afastarão', e não um verbo inequívoco de perdão; a tradução evita impor uma teoria soteriológica.
- issue: Sentido de ζήσεσθε τῷ Θεῷ
  choice: viverão para Deus
  alternative: viverão diante de Deus / viverão em Deus
  rationale: A formulação escolhida é natural em português e conserva a orientação teológica do dativo sem expandir o texto.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento no plural por “vocês”. A metáfora de revestir-se foi preservada; a de caminhar foi vertida idiomaticamente por “sigam” para maior clareza. A única nota registra a variante textual assinalada na edição grega.
