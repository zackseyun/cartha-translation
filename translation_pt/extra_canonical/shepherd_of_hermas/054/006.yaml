base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/006.yaml
  text: He was pasturing very many sheep, and the sheep were as if luxuriating and being very extravagant, and they were cheerful, skipping here and there. And the shepherd himself was very cheerful over his flock; and the very appearance of the shepherd was exceedingly cheerful, and he ran around among the sheep.
translation:
  language: pt
  text: Ele apascentava muitíssimas ovelhas. Elas pareciam viver luxuosamente e com muita extravagância; alegres, saltitavam de um lado para outro. O próprio pastor estava muito alegre com seu rebanho; sua aparência era extremamente alegre, e ele corria entre as ovelhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβοσκε
  choice: apascentava
  rationale: Expressa naturalmente a atividade contínua do pastor e preserva a imagem pastoril do grego.
- source_word: πολλὰ λίαν
  choice: muitíssimas
  rationale: Mantém a forte intensificação da quantidade sem tornar a frase pesada.
- source_word: ὡσεὶ τρυφῶντα
  choice: pareciam viver no luxo
  rationale: Preserva o valor comparativo de ὡσεὶ e o sentido de vida luxuosa, confortável ou indulgente de τρυφάω.
- source_word: λίαν σπαταλῶντα
  choice: entregar-se aos prazeres
  rationale: Comunica a indulgência e a vida dissoluta sugeridas por σπαταλάω sem restringi-las apenas ao desperdício material.
- source_word: ἱλαρά
  choice: alegres
  rationale: Neste contexto, indica disposição jubilosa e vivaz.
- source_word: σκιρτῶντα ὧδε κἀκεῖ
  choice: saltitavam de um lado para outro
  rationale: Reproduz de modo claro o movimento brincalhão das ovelhas.
- source_word: ἐπὶ τῷ ποιμνίῳ αὐτοῦ
  choice: com seu rebanho
  rationale: Aqui ἐπί expressa a alegria do pastor em relação ao rebanho; a formulação portuguesa evita a leitura espacial de 'sobre'.
- source_word: ἡ ἰδέα τοῦ ποιμένος
  choice: sua aparência
  rationale: ἰδέα designa o aspecto ou aparência visível do pastor.
- source_word: περιέτρεχε
  choice: corria entre
  rationale: Transmite o movimento de correr ao redor ou por entre o rebanho em português natural.
theological_decisions:
- issue: Caracterização moral da conduta das ovelhas
  choice: viver no luxo e entregar-se aos prazeres
  alternative: desfrutar de conforto e viver extravagantemente
  rationale: A tradução conserva a conotação potencialmente censurável de τρυφάω e σπαταλάω, importante para o desenvolvimento alegórico, sem acrescentar uma condenação explícita que o versículo ainda não formula.
translation_notes:
  register: Português moderno, digno e acessível, com imagens concretas e ritmo narrativo. A repetição de 'alegre' foi mantida porque corresponde à repetição enfática de ἱλαρός no original.
