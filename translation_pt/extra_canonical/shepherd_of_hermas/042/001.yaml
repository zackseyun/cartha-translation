base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/001.yaml
  text: Foremost of all is desire for another’s wife or husband, and for the luxury of wealth, and for many vain foods and drunken drinks, and for many other foolish indulgences; for every indulgence is foolish and empty for the slaves of God.
translation:
  language: pt
  text: Antes de tudo, há o desejo pela mulher ou pelo marido de outra pessoa, pelo luxo da riqueza, por muitos alimentos fúteis, por bebidas que embriagam e por muitas outras indulgências insensatas; pois toda indulgência é insensata e vazia para os servos de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προέχουσα
  choice: Em primeiro lugar vem
  rationale: Expressa com naturalidade a primazia indicada pelo particípio grego, sem transformar a frase em uma classificação teológica mais rígida.
- source_word: γυναικὸς ἀλλοτρίας ἢ ἀνδρός
  choice: pela mulher ou pelo marido de outra pessoa
  rationale: Preserva a referência paralela ao desejo por um cônjuge alheio e torna explícita, em português corrente, a relação sugerida pelo contexto.
- source_word: πολυτελείας πλούτου
  choice: do luxo que a riqueza proporciona
  rationale: Reproduz a relação compacta entre luxo e riqueza de modo idiomático, evitando o pouco natural «luxo da riqueza».
- source_word: ἐδεσμάτων πολλῶν ματαίων
  choice: de muitas comidas supérfluas
  rationale: «Supérfluas» comunica a ideia de alimentos excessivos, fúteis ou sem proveito no contexto ascético, sem sugerir que a comida em si seja falsa.
- source_word: μεθυσμάτων
  choice: de bebidas que embriagam
  rationale: Mantém o vínculo lexical com embriaguez e evita restringir indevidamente a uma bebida específica.
- source_word: τρυφῶν
  choice: prazeres
  rationale: No contexto, designa prazeres indulgentes e luxuosos; «prazeres» é claro ao leitor, qualificado por «desse tipo» na generalização seguinte.
- source_word: δούλοις τοῦ Θεοῦ
  choice: servos de Deus
  rationale: «Servos» conserva a metáfora de pertença e serviço de δοῦλοι em registro religioso digno e corrente.
theological_decisions:
- issue: Alcance da condenação de πᾶσα τρυφή
  choice: todo prazer desse tipo
  alternative: todo prazer
  rationale: O demonstrativo explicativo remete aos prazeres indulgentes recém-enumerados. A formulação evita fazer o autor condenar indistintamente toda experiência prazerosa, sem enfraquecer sua censura ascética.
translation_notes:
  register: Português moderno, claro e digno, com construção fluente para leitores brasileiros e compreensão internacional. A enumeração e o tom exortativo do grego foram preservados sem arcaísmos.
