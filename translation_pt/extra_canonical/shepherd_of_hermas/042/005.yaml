base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/005.yaml
  text: 5. So then, having been crowned against it, come to the desire for righteousness, and, handing over to it the victory you received, serve it as it wills. If you serve the good desire and submit to it, you will be able to master the evil desire and to subject it as you wish.
translation:
  language: pt
  text: 5. Portanto, tendo sido coroado vitorioso sobre ele, aproxime-se do desejo de justiça e, entregando-lhe a vitória que você recebeu, sirva-o conforme ele quiser. Se você servir ao bom desejo e se submeter a ele, poderá dominar o desejo mau e sujeitá-lo como quiser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στεφανωθεὶς κατ᾽ αὐτῆς
  choice: depois de receber a coroa por tê-lo vencido
  rationale: Expressa a imagem antiga de ser coroado após a vitória e torna explícita a relação adversativa indicada por κατ᾽ αὐτῆς, sem perder a metáfora.
- source_word: ἐπιθυμίαν τῆς δικαιοσύνης
  choice: desejo de justiça
  rationale: Preserva a formulação e a personificação do desejo orientado para a justiça.
- source_word: παραδοὺς αὐτῇ τὸ νῖκος
  choice: entregue a ele a vitória
  rationale: Mantém a imagem incomum de confiar ao bom desejo a vitória obtida sobre o desejo mau.
- source_word: δούλευσον / δουλεύσῃς
  choice: sirva / servir
  rationale: Reproduz o sentido de prestar serviço ou sujeição, em linguagem natural e digna.
- source_word: κατακυριεῦσαι
  choice: dominar
  rationale: Comunica exercer senhorio ou controle sobre o desejo mau, em paralelo com sujeitá-lo.
theological_decisions:
- issue: Personificação dos desejos bom e mau
  choice: Manter ambos como agentes personificados aos quais alguém serve, se submete e domina
  alternative: Tratá-los apenas como impulsos psicológicos abstratos
  rationale: O grego sustenta uma personificação deliberada ao longo da seção, ligada ao contraste moral e espiritual entre os dois desejos.
- issue: Sentido da coroa
  choice: Coroa recebida pela vitória sobre o desejo mau
  alternative: Coroação concedida pelo próprio desejo mau ou simples ornamentação
  rationale: A construção κατ᾽ αὐτῆς é mais naturalmente adversativa no contexto da resistência e fuga do desejo mau no período anterior.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para o singular direto. A repetição de “desejo” e a linguagem de serviço, submissão, domínio e vitória foram preservadas por estruturarem a metáfora do texto.
