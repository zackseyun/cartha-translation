  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/003.yaml
  text: 3. But all who are overmastered by them and do not resist them will die utterly; for these desires are deadly.
translation:
  language: pt
  text: 3. Mas todos os que forem dominados por eles e não lhes resistirem morrerão por completo, pois esses desejos são mortais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακυριευθῶσιν
  choice: forem dominados
  rationale: Expressa o sentido passivo de ficar sob o domínio dos desejos, preservando a força do verbo sem recorrer a uma formulação pouco natural.
- source_word: μὴ ἀντισταθῶσιν
  choice: não lhes resistirem
  rationale: Mantém diretamente a ideia de oposição ativa e explicita pelo pronome que o referente são os desejos.
- source_word: ἀποθανοῦνται εἰς τέλος
  choice: morrerão por completo
  rationale: Preserva a intensificação de εἰς τέλος sem decidir se a morte é física, espiritual ou escatológica.
- source_word: θανατώδεις
  choice: mortais
  rationale: Reproduz de modo conciso a caracterização dos desejos como causadores de morte.
theological_decisions:
- issue: Natureza da morte mencionada
  choice: morrerão por completo
  alternative: sofrerão a morte eterna
  rationale: O grego intensifica o morrer, mas não especifica aqui a natureza da morte; a tradução conserva essa abertura e evita acrescentar uma interpretação escatológica explícita.
- issue: Referente pronominal dos desejos
  choice: dominados por eles
  alternative: dominados por elas
  rationale: Em português, “desejos” é masculino; a concordância natural exige “eles”, embora o substantivo grego ἐπιθυμίαι seja feminino.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. A repetição de “desejos” foi mantida para conservar a ênfase retórica do original.
