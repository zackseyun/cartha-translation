base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/004.yaml
  text: 4. But you—put on the desire for righteousness, and, having armed yourself with the fear of the Lord, resist them. For the fear of God dwells in the good desire. If the evil desire sees you armed with the fear of God and resisting it, it will flee far away from you, and it will no longer appear to you, being afraid of your weapons.
translation:
  language: pt
  text: 4. Mas você, revista-se do desejo de justiça e, tendo-se armado com o temor do Senhor, resista a esses desejos. Pois o temor de Deus habita no desejo bom. Se o desejo mau vir que você está armado com o temor de Deus e lhe oferece resistência, fugirá para longe de você e não mais lhe aparecerá, porque terá medo das suas armas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδυσαι
  choice: revista-se
  rationale: Preserva a metáfora de vestir-se, em linguagem portuguesa natural e digna.
- source_word: ἐπιθυμίαν τῆς δικαιοσύνης
  choice: desejo de justiça
  rationale: Mantém o campo lexical de ἐπιθυμία e a relação genitiva sem interpretar além do texto.
- source_word: καθοπλισάμενος
  choice: tendo-se armado
  rationale: Conserva a metáfora militar que prossegue em 'armas' no fim do período.
- source_word: φόβον τοῦ Κυρίου / φόβος τοῦ Θεοῦ
  choice: temor do Senhor / temor de Deus
  rationale: Reproduz a variação lexical do grego e usa 'temor' no sentido reverente, sem eliminar sua força.
- source_word: ἀντίστηθι αὐταῖς
  choice: resista a esses desejos
  rationale: Explicita o referente plural de αὐταῖς, as paixões ou desejos maus dos versículos anteriores, evitando um pronome português pouco claro.
- source_word: ἀνθεστηκότα αὐτῇ
  choice: lhe oferece resistência
  rationale: Expressa de modo natural o particípio perfeito e mantém como referente singular o desejo mau personificado.
- source_word: οὐκ ἔτι σοι ὀφθήσεται
  choice: não voltará a aparecer
  rationale: Transmite o sentido de não mais se mostrar à pessoa, sem sugerir necessariamente uma visão sobrenatural.
theological_decisions:
- issue: Sentido de 'temor de Deus'
  choice: Manter literalmente 'temor de Deus' e 'temor do Senhor'.
  alternative: Parafrasear como 'reverência a Deus'.
  rationale: O grego emprega φόβος e integra esse temor à metáfora das armas; a tradução preserva tanto a reverência quanto a força potencial da palavra.
- issue: Personificação do desejo mau
  choice: Manter o desejo mau como agente que vê, foge, aparece e teme.
  alternative: Despersonificar como impulsos psicológicos que enfraquecem.
  rationale: A personificação estrutura a exortação e a imagem de combate no original.
- issue: Referente plural de αὐταῖς
  choice: Traduzir como 'esses desejos'.
  alternative: Usar apenas 'a elas'.
  rationale: O antecedente está no contexto anterior; a explicitação mínima favorece clareza sem resolver qualquer tensão teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O tratamento por 'você' acompanha a interpelação singular do grego; as metáforas de vestimenta e combate foram preservadas. Não há marcadores de nota, pois nenhuma nota foi necessária.
