review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a estrutura argumentativa, a metáfora «filha do diabo» e «vivam para Deus». Contudo, «que levam à morte» suaviza o particípio θανατοῦσαι, que afirma mais diretamente que os desejos maus matam os servos de Deus. Há também uma mudança desnecessária de construção entre o impessoal «é preciso» e o explícito «vocês vivam».
  naturalness: O texto é geralmente claro e atual. A formulação «para que, abstendo-se deles, vocês vivam» é compreensível, mas mistura uma construção impessoal com um sujeito explícito e soa menos fluente do que uma exortação dirigida coerentemente ao plural.
  terminology: «Desejos maus», «servos de Deus», «filha do diabo» e «viver para Deus» são escolhas adequadas, naturais e fiéis. A repetição de «desejos maus» deve ser mantida.
  issues:
  - severity: medium
    issue: Atenuação de θανατοῦσαι
    rationale: O particípio presente significa «matando» ou «que matam», e não apenas conduzindo à morte. A formulação direta preserva melhor a força do original sem especificar o tipo de morte.
  - severity: low
    issue: Inconsistência sintática de pessoa na exortação final
    rationale: O grego visa os destinatários no plural («para que ... vivais»). «Vocês devem ... para que ... vivam» mantém esse direcionamento de modo mais claro e idiomático.
  revised_text: 2. Estes, portanto, são desejos maus, que matam os servos de Deus. Pois esse desejo mau é filha do diabo. Portanto, vocês devem abster-se dos desejos maus, para que, abstendo-se deles, vivam para Deus.
  revised_footnotes: []
  revision_rationale: A revisão restitui a força causativa e mortal de θανατοῦσαι por «que matam» e torna coerente, em português atual, a exortação dirigida aos destinatários plurais. Não acrescenta interpretação sobre a natureza da morte nem altera as metáforas do texto.
