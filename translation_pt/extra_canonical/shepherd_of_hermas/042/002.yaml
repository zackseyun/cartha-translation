revisions:
- from: 2. Esses, portanto, são desejos maus, que levam à morte os servos de Deus. Pois esse desejo mau é filha do diabo. Portanto, é preciso abster-se dos desejos maus, para que, abstendo-se deles, vocês vivam para Deus.
  to: 2. Estes, portanto, são desejos maus, que matam os servos de Deus. Pois esse desejo mau é filha do diabo. Portanto, vocês devem abster-se dos desejos maus, para que, abstendo-se deles, vivam para Deus.
  rationale: A revisão restitui a força causativa e mortal de θανατοῦσαι por «que matam» e torna coerente, em português atual, a exortação dirigida aos destinatários plurais. Não acrescenta interpretação sobre a natureza da morte nem altera as metáforas do texto.
