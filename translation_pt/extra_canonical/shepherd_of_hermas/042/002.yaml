base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/002.yaml
  text: 2. These, then, are evil desires, putting the slaves of God to death. For this evil desire is the devil’s daughter. Therefore one must abstain from evil desires, so that, by abstaining, you may live to God.
translation:
  language: pt
  text: 2. Estes, portanto, são desejos maus, que matam os servos de Deus. Pois esse desejo mau é filha do diabo. Portanto, vocês devem abster-se dos desejos maus, para que, abstendo-se deles, vivam para Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμίαι πονηραί
  choice: desejos maus
  rationale: Traduz de modo direto e natural tanto o substantivo quanto sua qualificação moral, preservando a repetição do grego.
- source_word: θανατοῦσαι
  choice: que levam à morte
  rationale: Expressa o sentido causativo do particípio sem sugerir necessariamente uma morte física imediata.
- source_word: τοὺς δούλους τοῦ Θεοῦ
  choice: os servos de Deus
  rationale: Neste contexto exortativo, 'servos' comunica adequadamente a relação de sujeição a Deus sem a estranheza moderna de 'escravos'.
- source_word: τοῦ διαβόλου θυγάτηρ
  choice: filha do diabo
  rationale: Mantém literalmente a personificação e a metáfora de origem presentes no grego.
- source_word: ζήσητε τῷ Θεῷ
  choice: vocês vivam para Deus
  rationale: Preserva o dativo relacional/final e a formulação teológica concisa, sem explicitar além do texto.
theological_decisions:
- issue: Natureza da morte causada pelos desejos maus
  choice: que levam à morte
  alternative: que matam
  rationale: A formulação conserva a força mortal de θανατοῦσαι, mas não decide se a morte é física, espiritual ou escatológica.
- issue: Sentido de viver para Deus
  choice: vivam para Deus
  alternative: vivam em Deus
  rationale: O dativo τῷ Θεῷ favorece a orientação da vida para Deus; a tradução evita transformar a expressão em uma afirmação específica de união mística.
translation_notes:
  register: Português atual, digno e acessível, com plural explícito em 'vocês' para refletir ζήσητε. A repetição de 'desejo(s) mau(s)' foi mantida por ser retoricamente significativa no original.
