base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/009.yaml
  text: I came near it, and that huge sea monster stretched itself out on the ground and did nothing except thrust out its tongue; it did not move at all until I had passed by it.
translation:
  language: pt
  text: Aproximei-me dele, e aquele monstro marinho gigantesco estendeu-se no chão e não fez nada, a não ser pôr a língua para fora. Não se moveu de modo algum até que eu passasse por ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κῆτος
  choice: monstro marinho
  rationale: O termo designa uma criatura marinha enorme; «monstro marinho» preserva a dimensão ameaçadora sem identificar indevidamente uma espécie.
- source_word: χαμαί
  choice: no chão
  rationale: Expressa de modo natural a ideia de se estender rente ao solo.
- source_word: προέβαλλεν
  choice: pôr ... para fora
  rationale: Equivalente idiomático e claro para o gesto de projetar a língua.
- source_word: παρῆλθον αὐτό
  choice: eu passasse por ele
  rationale: Preserva o sentido de passar além da criatura, com formulação natural em português.
