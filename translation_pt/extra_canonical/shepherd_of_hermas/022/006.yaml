    reason: Explica a dificuldade lexical sem acrescentar tamanho ou definir de modo indevido a forma da cabeça.
  revision_rationale: Foram corrigidos o sentido de μικρόν («um pouco», e não «por um instante») e o acréscimo injustificado de «grande» na comparação com κέραμος. A revisão mantém as escolhas centrais do rascunho e conserva a incerteza da imagem visionária.
