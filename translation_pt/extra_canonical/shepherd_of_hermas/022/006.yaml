base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/006.yaml
  text: As the dust grew greater and greater, I supposed it was something divine. The sun shone out a little, and behold, I see a very great beast, like some sea monster, and from its mouth fiery locusts were coming out. The beast was about a hundred feet in length, and its head was like a jar.
translation:
  language: pt
  text: À medida que a poeira ficava cada vez maior, suspeitei que fosse algo divino. O sol brilhou um pouco, e eis que vi uma fera imensa, como uma espécie de monstro marinho, e de sua boca saíam gafanhotos de fogo. A fera tinha cerca de trinta metros[a] de comprimento, e sua cabeça era como uma telha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «cerca de cem pés», isto é, aproximadamente trinta metros.
    reason: Preserva a medida do texto grego e oferece uma equivalência moderna aproximada.
  - marker: b
    text: 'Grego: «como uma telha»; κέραμος também pode designar, mais amplamente, um objeto de cerâmica. A imagem exata da comparação não é clara.'
    reason: Explica a dificuldade lexical sem acrescentar tamanho ou definir de modo indevido a forma da cabeça.
lexical_decisions:
- source_word: κονιορτοῦ
  choice: nuvem de poeira
  rationale: Embora o substantivo denote literalmente 'poeira', o contexto descreve uma massa visível que aumenta e sobe; 'nuvem de poeira' é natural e preciso em português.
- source_word: ὑπενόησα
  choice: pensei
  rationale: Expressa uma inferência ou suposição diante do fenômeno, sem atribuir certeza ao narrador.
- source_word: θηρίον μέγιστον
  choice: fera enorme
  rationale: '''Fera'' preserva o caráter ameaçador de θηρίον, enquanto ''enorme'' comunica o superlativo sem rigidez artificial.'
- source_word: κῆτός τι
  choice: um monstro marinho
  rationale: κῆτος designa uma criatura marinha muito grande, não necessariamente uma baleia; a opção preserva a indeterminação de τι e o caráter monstruoso da visão.
- source_word: ἀκρίδες πύριναι
  choice: gafanhotos de fogo
  rationale: Mantém a imagem concreta e extraordinária do grego, sem reduzi-la a gafanhotos apenas 'cor de fogo'.
- source_word: ποδῶν ἑκατόν
  choice: trinta metros
  rationale: Converte aproximadamente a medida antiga para torná-la imediatamente compreensível ao leitor moderno; a nota registra o dado literal.
- source_word: κεράμου
  choice: grande telha
  rationale: O grego κέραμος significa normalmente telha ou peça de barro cozido. A forma genitiva após ὡς é elíptica; 'grande' comunica que a comparação diz respeito à cabeça da fera e evita o improvável 'jarro' da camada inglesa.
theological_decisions:
- issue: Natureza divina do fenômeno
  choice: pensei que fosse algo divino
  alternative: percebi que era algo divino
  rationale: ὑπενόησα indica conjectura ou suspeita, não reconhecimento certo; a tradução preserva a hesitação narrativa.
- issue: Caráter dos gafanhotos
  choice: gafanhotos de fogo
  alternative: gafanhotos flamejantes
  rationale: O genitivo português preserva melhor a ambiguidade de πύριναι entre constituição ígnea e aparência de fogo, sem impor uma explicação.
translation_notes:
  register: Português moderno, digno e narrativo, com legibilidade brasileira e vocabulário amplamente internacional. A construção “e então vi” torna natural a fórmula visionária ἰδού sem perder seu efeito de súbita revelação. As notas preservam a unidade antiga e a dificuldade lexical de κέραμος.
