base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/007.yaml
  text: 'I began to weep and to ask the Lord that he would deliver me from it. And I remembered the word that I had heard: “Do not be double-minded, Hermas.”'
translation:
  language: pt
  text: 'Comecei a chorar e a pedir ao Senhor que me livrasse daquela fera. Então me lembrei da palavra que tinha ouvido: “Não fique dividido, Hermas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίειν
  choice: chorar
  rationale: Equivalente direto e natural do infinitivo grego, preservando a reação emocional de Hermas.
- source_word: ἐρωτᾶν
  choice: pedir
  rationale: Neste contexto de súplica dirigida ao Senhor, 'pedir' expressa melhor o sentido do que o literal 'perguntar'.
- source_word: λυτρώσηται
  choice: me livrasse
  rationale: Comunica resgate ou libertação de um perigo concreto sem introduzir uma formulação doutrinária mais específica.
- source_word: ἐξ αὐτοῦ
  choice: daquela fera
  rationale: O pronome retoma o grande animal ameaçador dos versículos anteriores; explicitar 'fera' evita ambiguidade pouco natural em português.
- source_word: ῥήματος
  choice: palavra
  rationale: Mantém o termo genérico para a mensagem ou declaração ouvida.
- source_word: διψυχήσεις
  choice: fique dividido
  rationale: Preserva a imagem de hesitação interior ou lealdade dividida, em linguagem portuguesa corrente, sem reduzi-la apenas a 'duvidar'.
theological_decisions:
- issue: Sentido de διψυχέω
  choice: Não fique dividido
  alternative: Não duvide / Não seja indeciso
  rationale: O termo sugere literalmente uma disposição interior dividida e pode abranger dúvida, hesitação e instabilidade. A tradução escolhida preserva essa amplitude e a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. O referente pronominal foi explicitado como 'fera' a partir do contexto imediato. A fala divina mantém uma formulação breve e incisiva.
