base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/004.yaml
  text: 'And while I was glorifying and giving thanks to him, something like the sound of a voice answered me: “Do not be double-minded, Hermas.” I began to reason within myself and say, “What do I have to be double-minded about, being so firmly established by the Lord and having seen glorious things?”'
translation:
  language: pt
  text: 'Enquanto eu o glorificava e lhe dava graças, algo como o som de uma voz me respondeu: “Não fique dividido, Hermas.” Comecei então a refletir comigo mesmo e a dizer: “Que motivo tenho eu para ficar dividido, estando tão firmemente fundamentado pelo Senhor e tendo visto coisas gloriosas?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζοντός μου
  choice: enquanto eu o glorificava
  rationale: Preserva o sentido verbal de atribuir glória a Deus e a construção temporal do genitivo absoluto.
- source_word: ὡς ἦχος φωνῆς
  choice: algo como o som de uma voz
  rationale: Mantém a comparação e a cautela perceptiva expressas por ὡς, sem identificar além do que o grego afirma.
- source_word: Μὴ διψυχήσεις
  choice: Não fique dividido
  rationale: Expressa a ideia de ânimo ou lealdade interior divididos, preservando a amplitude do termo sem reduzi-lo apenas a dúvida intelectual.
- source_word: διαλογίζεσθαι
  choice: refletir
  rationale: Transmite o raciocínio interior indicado pelo verbo no contexto.
- source_word: τεθεμελιωμένος
  choice: firmemente fundamentado
  rationale: Conserva a metáfora de fundamento e a força do particípio perfeito.
- source_word: ἔνδοξα πράγματα
  choice: coisas gloriosas
  rationale: Tradução direta e natural que evita especificar indevidamente a natureza das coisas vistas.
theological_decisions:
- issue: Sentido de διψυχέω
  choice: ficar dividido
  alternative: duvidar
  rationale: O vocábulo pode envolver dúvida, hesitação ou duplicidade interior. “Ficar dividido” preserva essa tensão sem restringir o sentido à incerteza intelectual.
- issue: Agente da voz
  choice: algo como o som de uma voz me respondeu
  alternative: uma voz me respondeu
  rationale: A formulação conserva a comparação ὡς e não identifica explicitamente o locutor, respeitando a ambiguidade do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “dividido” foi mantida para reproduzir o elo lexical entre a advertência e a reflexão de Hermas.
