base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/008.yaml
  text: So then, brothers, having put on the faith of the Lord and having remembered the mighty deeds that he had taught me, I took courage and gave myself over to the beast. Now the beast was coming with such a roar that it could destroy a city.
translation:
  language: pt
  text: Então, irmãos, revesti-me da fé do Senhor e, lembrando-me das grandes coisas que ele me ensinou, criei coragem e entreguei-me à fera. A fera vinha com tamanho estrondo que seria capaz de devastar uma cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδυσάμενος
  choice: revesti-me
  rationale: Preserva a metáfora explícita de vestir-se da fé, em linguagem bíblica natural em português.
- source_word: τὴν πίστιν τοῦ Κυρίου
  choice: da fé do Senhor
  rationale: Mantém o genitivo grego sem decidir se indica fé dirigida ao Senhor, proveniente dele ou caracterizada por ele.
- source_word: μεγαλείων
  choice: grandezas
  rationale: Expressa feitos ou realidades grandiosas sem restringir o termo a milagres, preservando sua amplitude.
- source_word: ἐμαυτὸν ἔδωκα
  choice: entreguei-me
  rationale: Reproduz de modo idiomático o gesto deliberado de se expor ou avançar diante da fera.
- source_word: ῥοίζῳ
  choice: estrondo
  rationale: Comunica o ruído impetuoso da aproximação; evita limitar o som especificamente a um rugido animal.
- source_word: λυμᾶναι
  choice: devastar
  rationale: Representa a ideia forte de arruinar ou destruir, adequada ao efeito potencial sobre uma cidade.
theological_decisions:
- issue: Sentido do genitivo em πίστιν τοῦ Κυρίου
  choice: fé do Senhor
  alternative: fé no Senhor
  rationale: A formulação conserva a ambiguidade gramatical do original, em vez de interpretá-la exclusivamente como fé dirigida ao Senhor.
- issue: Referente de ὧν em ὧν ἐδίδαξέν με μεγαλείων
  choice: as grandezas que ele me havia ensinado
  alternative: os grandes feitos que ele me havia mostrado
  rationale: Mantém o verbo 'ensinar' do texto grego e não o substitui por 'mostrar', embora a construção seja incomum em português.
translation_notes:
  register: Português moderno, digno e acessível, com cadência narrativa. A metáfora 'revesti-me' e a expressão 'fé do Senhor' foram preservadas por sua relevância literária e ambiguidade. 'Estrondo' traduz o caráter impetuoso do som sem acrescentar a ideia específica de rugido.
