  to: Então, irmãos, revesti-me da fé do Senhor e, lembrando-me das grandes coisas que ele me ensinou, criei coragem e entreguei-me à fera. A fera vinha com tamanho estrondo que seria capaz de devastar uma cidade.
  rationale: A revisão limita-se a tornar idiomática a expressão que traduz ὧν ἐδίδαξέν με μεγαλείων, sem alterar seu sentido amplo nem substituir «ensinar» por «mostrar». O restante do texto permanece fiel ao grego e ao registro narrativo.
