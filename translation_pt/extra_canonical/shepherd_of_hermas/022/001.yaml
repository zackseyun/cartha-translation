base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/001.yaml
  text: The vision that I saw, brothers, came twenty days after the former vision; it was as a pattern of the tribulation that is coming.
translation:
  language: pt
  text: A visão que tive, irmãos, vinte dias depois da visão anterior, foi uma figura[a] da tribulação que está por vir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: representação; modelo.'
    reason: O grego τύπος pode designar uma figura, forma representativa ou modelo.
lexical_decisions:
- source_word: τύπον
  choice: figura
  rationale: Mantém a ideia de uma forma ou representação que antecipa outra realidade, sem definir de modo excessivo a relação entre a visão e a tribulação futura.
- source_word: θλίψεως
  choice: tribulação
  rationale: Expressa a aflição intensa e coletiva indicada pelo contexto, em linguagem bíblica corrente e compreensível.
- source_word: ἐπερχομένης
  choice: que está por vir
  rationale: Reproduz o sentido prospectivo do particípio, apresentando a tribulação como futura e iminente sem precisar seu momento.
theological_decisions:
- issue: Relação entre a visão e a tribulação futura
  choice: foi uma figura da tribulação
  alternative: foi um prenúncio da tribulação
  rationale: '“Figura” preserva a amplitude semântica de τύπος: a visão pode funcionar como representação, modelo ou antecipação, sem se restringir apenas à ideia de previsão.'
translation_notes:
  register: Português moderno, claro e digno, com vocativo natural (“irmãos”) e sintaxe fluente. O verbo “foi” explicita em português a relação elíptica no grego, sem acrescentar conteúdo interpretativo relevante.
