revisions:
- from: 'Avancei um pouco, irmãos, e eis que vejo uma nuvem de poeira que parecia chegar ao céu. Então comecei a dizer comigo mesmo: “Será que vem vindo gado, levantando poeira?” Pois estava a cerca de um estádio[a] de distância de mim.'
  to: 'Segui um pouco adiante, irmãos, e eis que vejo uma nuvem de poeira elevando-se como que até o céu. Então comecei a dizer comigo mesmo: “Talvez estejam vindo animais e levantando poeira?” Pois ela estava a cerca de um estádio[a] de mim.'
  rationale: 'A única alteração necessária é de clareza e leve ajuste idiomático: a nuvem de poeira é identificada explicitamente como o elemento situado a cerca de um estádio do narrador. A formulação conserva a comparação hesitante de ὡς, o presente vívido de βλέπω e a indeterminação de κτήνη.'
