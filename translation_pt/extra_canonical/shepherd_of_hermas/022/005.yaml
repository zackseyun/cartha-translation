base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/005.yaml
  text: I went on a little, brothers, and behold, I see dust rising as if to the sky, and I began to say within myself, “Perhaps cattle are coming and stirring up dust?” For it was about a stadion away from me.
translation:
  language: pt
  text: 'Segui um pouco adiante, irmãos, e eis que vejo uma nuvem de poeira elevando-se como que até o céu. Então comecei a dizer comigo mesmo: “Talvez estejam vindo animais e levantando poeira?” Pois ela estava a cerca de um estádio[a] de mim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um estádio correspondia aproximadamente a 185 metros.
    reason: A unidade antiga provavelmente não é familiar ao leitor moderno; a nota esclarece sem substituir a medida no texto.
lexical_decisions:
- source_word: προσέβην μικρόν
  choice: Avancei um pouco
  rationale: Expressa naturalmente o breve prosseguimento de Hermas pelo caminho.
- source_word: κονιορτὸν
  choice: uma nuvem de poeira
  rationale: Embora o substantivo denote poeira, o contexto descreve uma massa visível que se eleva; a formulação é idiomática e preserva a imagem.
- source_word: κτήνη
  choice: gado
  rationale: No contexto de animais em deslocamento levantando poeira, “gado” é uma equivalência natural sem especificar indevidamente a espécie.
- source_word: ὡς ἀπὸ σταδίου
  choice: a cerca de um estádio de distância
  rationale: Preserva a antiga unidade de medida e o valor aproximativo de ὡς.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com narração vívida no presente conforme o grego (“vejo”) e discurso interior natural. “E eis que” conserva o efeito enfático de καὶ ἰδού.
