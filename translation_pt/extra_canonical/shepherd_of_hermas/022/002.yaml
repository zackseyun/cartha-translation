base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/002.yaml
  text: I was going into the countryside by the Campanian road. It is about ten stadia from the public road, and the place is easy to travel.
translation:
  language: pt
  text: Eu ia para o campo pela estrada da Campânia. Esse lugar fica a cerca de dez estádios[a] da estrada pública, e o caminho até lá é fácil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dez estádios correspondiam aproximadamente a 1,8 quilômetro.
    reason: A antiga unidade de distância pode ser desconhecida para leitores modernos; a nota esclarece sem substituir a medida do texto.
lexical_decisions:
- source_word: ἀγρός
  choice: campo
  rationale: No contexto, indica uma área rural ou propriedade no campo; a escolha mantém a formulação simples sem especificar indevidamente 'fazenda'.
- source_word: ὁδὸς ἡ Καμπανή
  choice: estrada da Campânia
  rationale: Reproduz o nome geográfico da via em português claro.
- source_word: ὁδὸς δημοσία
  choice: estrada pública
  rationale: Equivalência direta para a via principal ou pública, sem substituir por uma designação histórica mais específica não expressa no texto.
- source_word: ῥᾳδίως ... ὁδεύεται ὁ τόπος
  choice: o caminho até lá é fácil
  rationale: Expressa naturalmente que o local é de acesso ou percurso fácil, preservando o sentido impessoal do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. O demonstrativo em 'Esse lugar' explicita o referente implícito de ἀπὸ τῆς ὁδοῦ, evitando a leitura equivocada de que a estrada da Campânia inteira ficava a dez estádios da estrada pública.
