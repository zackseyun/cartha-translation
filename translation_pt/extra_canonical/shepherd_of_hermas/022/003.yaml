base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/003.yaml
  text: So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions that he had shown me through his holy Church, so that he would strengthen me and give repentance to his servants who have stumbled, in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders.
translation:
  language: pt
  text: Assim, enquanto caminhava sozinho, eu suplicava ao Senhor que levasse a termo as revelações e as visões que ele me havia mostrado por meio de sua santa Igreja, para que me fortalecesse e concedesse arrependimento aos seus servos que tropeçaram, a fim de que seu grande e glorioso nome fosse glorificado, pois ele me considerou digno de me mostrar suas maravilhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιῶ
  choice: eu suplicava
  rationale: No contexto de oração dirigida ao Senhor, exprime um pedido insistente e respeitoso; o aspecto imperfeito é preservado pela forma verbal portuguesa.
- source_word: τελειώσῃ
  choice: levasse a termo
  rationale: Comunica a ideia de completar ou consumar as revelações e visões sem sugerir apenas que fossem encerradas.
- source_word: διὰ τῆς ἁγίας Ἐκκλησίας αὐτοῦ
  choice: por meio de sua santa Igreja
  rationale: Preserva o valor instrumental de διά e a personificação da Igreja presente no contexto da obra.
- source_word: ἰσχυροποιήσῃ
  choice: me fortalecesse
  rationale: Equivalente natural e direto para tornar forte ou confirmar.
- source_word: μετάνοιαν
  choice: arrependimento
  rationale: Mantém o sentido religioso e ético de mudança de mente e conduta, sem expandi-lo interpretativamente.
- source_word: ἐσκανδαλισμένοις
  choice: que tropeçaram
  rationale: Preserva a metáfora de escândalo como tropeço e evita restringir o termo a mera ofensa emocional.
- source_word: ἄξιον ἡγήσατο
  choice: me considerou digno
  rationale: Reproduz de modo formal e natural o juízo de dignidade expresso no grego.
- source_word: θαυμάσια
  choice: maravilhas
  rationale: Expressa feitos ou realidades extraordinárias de Deus em registro bíblico corrente.
theological_decisions:
- issue: Quem concede o arrependimento
  choice: concedesse arrependimento aos seus servos
  alternative: desse aos seus servos a oportunidade de se arrepender
  rationale: O grego declara diretamente que o Senhor dá μετάνοια; a tradução conserva essa formulação e sua tensão teológica, sem reinterpretá-la como mera oportunidade.
- issue: Mediação da Igreja nas revelações
  choice: mostrado por meio de sua santa Igreja
  alternative: mostrado na figura de sua santa Igreja
  rationale: A preposição διά com genitivo favorece agência ou mediação. A tradução não explicita além disso a forma específica dessa mediação.
- issue: Finalidade da glorificação do nome
  choice: a fim de que seu grande e glorioso nome fosse glorificado
  alternative: para glorificar seu grande e glorioso nome
  rationale: Mantém a construção passiva do grego e evita identificar silenciosamente um agente específico para a glorificação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Conserva a oração longa e encadeada do original, mas emprega sintaxe natural. A repetição entre “glorioso” e “fosse glorificado” foi mantida por corresponder à repetição deliberada do grego.
