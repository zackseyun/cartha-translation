translation:
  language: pt
  text: 'A fera tinha quatro cores na cabeça: preto, depois cor de fogo e de sangue, em seguida dourado e, por fim, branco.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: fera
  rationale: No contexto visionário, “fera” comunica melhor que “animal” a natureza ameaçadora da criatura.
- source_word: πυροειδὲς καὶ αἱματῶδες
  choice: cor de fogo e de sangue
  rationale: Preserva as duas imagens coordenadas e evita interpretar a expressão apenas como um tom específico de vermelho.
- source_word: χρυσοῦν
  choice: dourado
  rationale: Equivalente natural em português para a designação da cor do ouro.
