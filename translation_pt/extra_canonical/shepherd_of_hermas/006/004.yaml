  naturalness: O texto é em geral claro e moderno, mas “que o Senhor ordenou que me fossem reveladas para você” é sintaticamente pesado e pode sugerir uma relação menos direta entre a ordem e a revelação. A repetição explícita de “pecados” na segunda abrangência torna a frase mais natural.
  terminology: “Mestre” para δεσπότης preserva a distinção em relação a κύριος (“Senhor”) presente na seção. “Hesitações do coração” exprime de modo acessível o plural de διψυχία, isto é, a disposição interior dividida, sem a restringir a mera dúvida intelectual ou a hipocrisia.
