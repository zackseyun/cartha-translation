base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/004.yaml
  text: After you have made known to them these words which the Master commanded me to be revealed to you, then all their sins that they formerly committed are forgiven them, and also to all the holy ones who have sinned up to this day, if they repent with all their heart and remove from their heart their double‑mindedness.
translation:
  language: pt
  text: Depois que você lhes der a conhecer estas palavras que o Mestre me ordenou que lhe fossem reveladas, então todos os pecados que eles cometeram anteriormente lhes serão perdoados, bem como todos os pecados de todos os santos que pecaram até este dia, se se arrependerem de todo o coração e removerem de seu coração as hesitações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης
  choice: Senhor
  rationale: Neste contexto, designa aquele que exerce autoridade soberana. “Senhor” é natural e digno em português, embora “Soberano” ou “Mestre” também sejam possíveis.
- source_word: ἀφίενται
  choice: serão perdoados
  rationale: O verbo, aplicado a pecados, tem o sentido estabelecido de remissão ou perdão; o presente grego é vertido com valor futuro por causa da sequência introduzida por τότε, “então”.
- source_word: τοῖς ἁγίοις
  choice: aos santos
  rationale: Preserva a designação comunitária do grego sem acrescentar uma definição denominacional.
- source_word: μετανοήσωσιν
  choice: se arrependerem
  rationale: Expressa mudança interior e moral, não mero pesar.
- source_word: τὰς διψυχίας
  choice: a indecisão
  rationale: O termo indica coração ou lealdade divididos, hesitação interior. “Indecisão” comunica o sentido principal em português corrente, preservando a tensão ética do contexto.
theological_decisions:
- issue: Condição do perdão
  choice: Manter explicitamente a condição “se eles se arrependerem... e removerem...”
  alternative: Reformular como simples promessa incondicional de perdão
  rationale: A construção grega ἐὰν com subjuntivo apresenta uma condição real e deve ser preservada sem harmonização teológica.
- issue: Abrangência do pronome em “lhes serão perdoados”
  choice: Conservar a referência inicial aos destinatários familiares e estender em seguida a promessa a “todos os santos”
  alternative: Fundir todos os grupos numa única referência genérica
  rationale: A sintaxe distingue αὐτοῖς do grupo adicional introduzido por καὶ πᾶσιν τοῖς ἁγίοις.
- issue: Natureza de διψυχία
  choice: Traduzir como “indecisão”
  alternative: “duplicidade”, “ânimo dividido” ou “dúvida”
  rationale: O termo pode envolver hesitação, dúvida ou lealdade dividida. “Indecisão” evita reduzir o sentido a hipocrisia deliberada, embora não esgote toda a imagem lexical.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. O tratamento por “você” acompanha a legibilidade brasileira e distingue naturalmente o destinatário singular dos grupos mencionados. Não foram necessárias notas de rodapé.
