    issue: δεσπότης foi traduzido como “Senhor”.
    rationale: A seção também usa κύριος, normalmente “Senhor”. Traduzir ambos do mesmo modo apaga uma distinção lexical relevante; “Mestre” é uma opção natural para δεσπότης e acompanha o audit trail inglês.
  - severity: medium
