    rationale: O grego diz que o Mestre deu uma ordem a Hermas para que estas palavras fossem reveladas ao destinatário. “Me ordenou que lhe fossem reveladas” expressa essa relação com clareza.
  - severity: low
    issue: “a indecisão” reduz e singulariza τὰς διψυχίας.
    rationale: O termo está no plural e descreve divisões ou hesitações interiores. “As hesitações do coração” conserva o plural e a localização explicitada pelo grego.
