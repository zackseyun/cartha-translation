review_pass:
  verdict: revise
  source_fidelity: O texto principal reproduz com fidelidade as exortações de ἐμμείνατε, ἐργαζόμενοι τὴν δικαιοσύνην, μὴ διψυχήσητε, ὑπομένετε e a formulação incomum μὴ ἀρνήσονται τὴν ζωὴν αὐτῶν. «A própria vida» é uma boa representação portuguesa do pronome possessivo no grego, sem resolver indevidamente a expressão.
  naturalness: O registro é moderno, solene e claro. Contudo, «para que a passagem de vocês aconteça» soa pouco idiomático em português; «para que a passagem de vocês se dê» conserva a abertura de πάροδος e flui melhor.
  terminology: «Praticam a justiça», «coração dividido», «grande tribulação» e «santos anjos» são escolhas adequadas. A nota propõe, sem apoio no texto desta frase, uma leitura personificada de ζωή e deve ser removida.
  issues:
  - severity: medium
    issue: A nota [a] introduz uma leitura personificada ou cristológica de «vida» que não é indicada pela expressão grega τὴν ζωὴν αὐτῶν.
    rationale: O texto diz «a vida deles/sua própria vida». Embora o versículo seguinte mencione «o Senhor deles», ele não transforma ζωή nesta frase em título ou referência personificada. A nota cria uma alternativa interpretativa desnecessária e potencialmente doutrinária.
  - severity: low
    issue: «A passagem de vocês aconteça» é uma construção pouco natural.
    rationale: πάροδος pode continuar como «passagem», mas em português é mais idiomático dizer que essa passagem «se dê» na companhia dos anjos.
  revised_text: Portanto, permaneçam firmes, vocês que praticam a justiça, e não tenham o coração dividido, para que a passagem de vocês se dê na companhia dos santos anjos. Felizes são vocês que suportam a grande tribulação que está por vir e que não negarão a própria vida.
