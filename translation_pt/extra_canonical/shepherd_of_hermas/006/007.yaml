base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/007.yaml
  text: Persevere, then, you who work righteousness, and do not be double‑minded, so that your passing may be with the holy angels. Blessed are you who endure the great tribulation that is coming, and who will not deny their life.
translation:
  language: pt
  text: Portanto, permaneçam firmes, vocês que praticam a justiça, e não tenham o coração dividido, para que a passagem de vocês se dê na companhia dos santos anjos. Felizes são vocês que suportam a grande tribulação que está por vir e que não negarão a própria vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμμείνατε
  choice: permaneçam firmes
  rationale: Expressa a ideia de persistir e continuar fielmente, em português natural e exortativo.
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: vocês que praticam a justiça
  rationale: Mantém a imagem ativa de realizar ou produzir justiça, evitando a expressão menos idiomática “trabalham a justiça”.
- source_word: μὴ διψυχήσητε
  choice: não tenham o coração dividido
  rationale: Comunica a hesitação ou lealdade dividida de διψυχέω sem recorrer ao pouco natural “não sejam de ânimo duplo”.
- source_word: ἡ πάροδος
  choice: a passagem
  rationale: Preserva a abertura semântica do termo, que pode aludir à passagem desta vida ou ao trânsito escatológico.
- source_word: ὑπομένετε
  choice: suportam
  rationale: Traduz a perseverança sob sofrimento implicada pelo verbo no contexto da tribulação.
- source_word: τὴν θλῖψιν τὴν ἐρχομένην τὴν μεγάλην
  choice: a grande tribulação que está por vir
  rationale: Conserva a força escatológica e a ordem conceitual da expressão grega em português idiomático.
- source_word: τὴν ζωὴν αὐτῶν
  choice: a própria vida
  rationale: Reproduz o referente literal “vida” e sua relação reflexiva com os que não a negarão, sem identificar explicitamente a vida com Cristo.
theological_decisions:
- issue: Sentido de “não negarão a vida deles”
  choice: não negarão a própria vida
  alternative: não renegarão sua Vida / não negarão o Senhor de sua vida
  rationale: O grego diz literalmente τὴν ζωὴν αὐτῶν. Embora o contexto seguinte relacione a negação ao Senhor, explicitar aqui esse referente resolveria uma ambiguidade presente no texto.
- issue: Sentido escatológico de πάροδος
  choice: passagem
  alternative: partida desta vida / entrada
  rationale: “Passagem” mantém a ambiguidade genuína quanto a morte, trânsito ou destino escatológico, ao mesmo tempo que preserva a associação com os santos anjos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais brasileiras (“vocês”). A exortação mantém solenidade sem arcaísmos. “Coração dividido” é uma equivalência idiomática para a duplicidade interior, e “passagem” preserva a tensão escatológica do original.
