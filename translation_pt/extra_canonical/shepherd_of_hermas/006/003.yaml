base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/003.yaml
  text: But make these words known to all your children and to your wife, who is to be your sister; for she too does not refrain from her tongue, by which she acts wickedly. But when she hears these words, she will refrain, and she will obtain mercy.
translation:
  language: pt
  text: Mas dê a conhecer estas palavras a todos os seus filhos e à sua esposa, que se tornará sua irmã; pois ela também não refreia a língua, com a qual pratica o mal. Quando, porém, ouvir estas palavras, ela se refreará e alcançará misericórdia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώρισον
  choice: dê a conhecer
  rationale: Expressa de modo natural o imperativo de tornar algo conhecido ou comunicá-lo claramente.
- source_word: συμβίῳ
  choice: esposa
  rationale: No contexto familiar, o termo designa a mulher com quem Hermas vive, isto é, sua esposa.
- source_word: ἀδελφῇ
  choice: irmã
  rationale: Preserva a linguagem cristã relacional do original e a tensão entre vínculo conjugal e fraternidade espiritual.
- source_word: οὐκ ἀπέχεται τῆς γλώσσης
  choice: não refreia a língua
  rationale: Reproduz a imagem idiomática grega de não se conter no uso da fala.
- source_word: πονηρεύεται
  choice: pratica o mal
  rationale: Comunica a ação moralmente perversa atribuída ao uso da língua sem restringi-la a um vício verbal específico não explicitado.
- source_word: ἕξει ἔλεος
  choice: alcançará misericórdia
  rationale: Português corrente e digno para a ideia de vir a receber misericórdia.
theological_decisions:
- issue: A esposa deverá ser 'irmã'
  choice: que deverá ser sua irmã
  alternative: que será sua irmã
  rationale: O particípio μέλλουσα indica perspectiva futura, enquanto 'irmã' é mantido sem explicar se a referência é à fraternidade espiritual, à continência conjugal ou a ambas.
- issue: Relação entre ouvir, refrear-se e receber misericórdia
  choice: Quando, porém, ouvir estas palavras, ela se refreará e alcançará misericórdia.
  alternative: Ao ouvir estas palavras, ela se conterá e receberá misericórdia.
  rationale: Mantém a sequência afirmada pelo texto sem desenvolver uma doutrina específica sobre mérito, arrependimento ou perdão.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento em terceira pessoa para ampla legibilidade brasileira. A repetição de 'estas palavras' e 'ela se refreará' preserva a coesão e a imagem do grego.
