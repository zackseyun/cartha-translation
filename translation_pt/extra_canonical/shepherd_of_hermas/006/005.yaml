base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/005.yaml
  text: 'For the Master swore by his glory concerning his chosen ones: if, after this appointed day, sin should still occur, they have no salvation; for repentance has an end for the righteous. The days of repentance have been fulfilled for all the holy ones, but for the nations there is repentance until the last day.'
translation:
  language: pt
  text: 'Pois o Soberano jurou por sua glória a respeito de seus escolhidos: se, depois deste dia determinado, ainda houver pecado, eles não terão salvação; porque, para os justos, o arrependimento tem um limite. Os dias de arrependimento se completaram para todos os santos; para as nações, porém, há arrependimento até o último dia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεσπότης
  choice: o Soberano
  rationale: Expressa autoridade e domínio, distinguindo δεσπότης do vocábulo usual κύριος sem recorrer ao termo socialmente marcado “senhor de escravos”.
- source_word: κατὰ τῆς δόξης αὐτοῦ
  choice: por sua glória
  rationale: No contexto de juramento, κατὰ com genitivo indica aquilo pelo qual se jura; esta formulação é natural em português e preserva a referência à glória divina.
- source_word: τοὺς ἐκλεκτοὺς αὐτοῦ
  choice: seus escolhidos
  rationale: Tradução direta e acessível, sem especificar além do grego a identidade ou o estatuto teológico do grupo.
- source_word: ἐὰν ὡρισμένης τῆς ἡμέρας ταύτης
  choice: se, depois deste dia determinado
  rationale: A construção do texto é sintaticamente difícil, mas o contexto e a versão antiga pressuposta pela leitura inglesa apontam para um prazo assinalado que, uma vez passado, restringe a possibilidade de arrependimento.
- source_word: ἔτι ἁμάρτησις γένηται
  choice: ainda houver pecado
  rationale: Mantém a formulação impessoal do substantivo ἁμάρτησις com γένηται, sem convertê-la desnecessariamente em acusação direta contra indivíduos.
- source_word: μὴ ἔχειν αὐτοὺς σωτηρίαν
  choice: eles não terão salvação
  rationale: Reproduz claramente a declaração de ausência de salvação, mantendo o futuro contextual da construção infinitiva após o juramento.
- source_word: τέλος
  choice: um limite
  rationale: Aqui indica término ou fronteira temporal para o arrependimento; “limite” comunica melhor essa força do que “fim”, que poderia sugerir finalidade.
- source_word: οἱ ἅγιοι
  choice: os santos
  rationale: Equivalente tradicional, claro e formal para os integrantes consagrados da comunidade, sem implicar canonização posterior.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Preserva a amplitude e a ambiguidade do grego, que pode designar as nações ou os gentios, sem resolver indevidamente a referência.
theological_decisions:
- issue: Prazo de arrependimento para justos e santos
  choice: Preservar a afirmação forte de que o arrependimento tem limite e de que seus dias se completaram para os santos.
  alternative: Abrandar o texto como mera advertência pastoral ou como referência somente a uma ocasião específica.
  rationale: O grego formula uma limitação temporal real e enfática. A tradução não deve harmonizá-la silenciosamente com sistemas teológicos posteriores.
- issue: Contraste entre santos e nações
  choice: 'Manter o contraste explícito: para os santos, os dias se completaram; para as nações, o arrependimento permanece até o último dia.'
  alternative: Interpretar “nações” como todo não cristão ou substituir por “gentios”.
  rationale: A identidade precisa de τὰ ἔθνη não é explicitada no trecho; “nações” conserva a tensão e evita impor uma delimitação confessional.
- issue: Natureza do juramento divino
  choice: Traduzir literalmente que o Soberano jurou por sua glória.
  alternative: Parafrasear como uma simples declaração solene.
  rationale: A linguagem de juramento faz parte da força retórica e teológica do original e não deve ser omitida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva a solenidade profética do trecho, evita arcaísmos como “porquanto” e mantém as afirmações teologicamente tensas sem explicá-las dentro do texto.
