base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/002.yaml
  text: “Your offspring, Hermas, have rejected God and blasphemed the Lord, and they have betrayed their parents in great wickedness, and they were heard as betrayers of parents; and though they betrayed them, they gained no advantage, but they added still to their sins licentious acts and mixtures of wickedness, and thus their lawless deeds were filled up.
translation:
  language: pt
  text: “Seus descendentes, Hermas, rejeitaram a Deus e blasfemaram contra o Senhor; traíram seus próprios pais com grande perversidade e foram chamados traidores de seus pais. Tendo-os traído, não obtiveram proveito algum; antes, acrescentaram ainda aos seus pecados atos de devassidão e misturas de maldade. Assim, suas iniquidades chegaram à plenitude.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ σπέρμα σου
  choice: Seus descendentes
  rationale: O sentido literal é “sua semente”, mas no contexto designa os filhos ou a descendência de Hermas; “descendentes” conserva a referência coletiva em português natural.
- source_word: ἠθέτησαν εἰς τὸν Θεόν
  choice: rejeitaram a Deus
  rationale: ἀθετέω expressa rejeição, desprezo ou deslealdade; “rejeitaram” transmite de modo claro a ruptura em relação a Deus.
- source_word: προέδωκαν
  choice: Traíram
  rationale: O verbo pode significar entregar, denunciar ou trair. Como o texto os caracteriza logo depois como προδότας, “traíram” mantém a ligação lexical e não especifica um modo de entrega que o grego não explicita.
- source_word: ἤκουσαν προδότας γονέων
  choice: ficaram conhecidos como traidores dos pais
  rationale: A construção é incomum; aqui ἀκούω provavelmente tem o sentido de ser chamado, reputado ou conhecido como algo. A tradução evita o pouco natural “foram ouvidos como” sem eliminar a ideia de reputação pública.
- source_word: ἀσελγείας
  choice: atos de devassidão
  rationale: O plural se refere a condutas marcadas por sensualidade desenfreada ou indecência; “atos de devassidão” conserva a força moral sem limitar indevidamente o termo a um ato específico.
- source_word: συμφυρμοὺς πονηρίας
  choice: misturas de maldade
  rationale: συμφυρμός denota mistura, confusão ou amálgama. A expressão deliberadamente ampla e pouco usual foi preservada, em vez de ser reinterpretada como uma categoria precisa de pecado.
- source_word: ἐπλήσθησαν αἱ ἀνομίαι αὐτῶν
  choice: suas transgressões chegaram à plenitude
  rationale: A formulação mantém a imagem de pecados ou transgressões que atingem sua medida completa, em vez de reduzi-la simplesmente a “aumentaram”.
theological_decisions:
- issue: Identidade de τὸ σπέρμα σου
  choice: Traduzir coletivamente como “seus descendentes”
  alternative: “seus filhos” ou o literal “sua semente”
  rationale: O contexto imediato aplica a censura aos filhos de Hermas, mas o substantivo grego é coletivo. “Descendentes” preserva essa forma sem impor uma leitura teológica ou genealógica mais estreita.
- issue: Plenitude das transgressões
  choice: Manter a metáfora de as transgressões chegarem à plenitude
  alternative: “assim completaram suas transgressões”
  rationale: A voz passiva e a imagem de plenitude podem sugerir que a medida da iniquidade se encheu. A versão conserva essa tensão sem explicar sua consequência teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A repetição de “pais” foi mantida porque corresponde à ênfase retórica do grego. A estrutura foi dividida em frases para legibilidade, preservando a progressão acusatória do original.
