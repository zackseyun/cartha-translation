base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/008.yaml
  text: For the Lord swore by his Son that those who denied their Lord are cut off from their life—those who are now about to deny him in the coming days; but to those who denied before, because of his great compassion, he became merciful.”
translation:
  language: pt
  text: Pois o Senhor jurou por seu Filho que os que negaram o seu Senhor foram excluídos da vida — os que agora estão prestes a negá-lo nos dias que virão. Mas, por causa de sua grande compaixão, ele se mostrou misericordioso para com os que o negaram anteriormente.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤμοσεν
  choice: jurou
  rationale: Reproduz diretamente a linguagem solene de juramento.
- source_word: κατὰ τοῦ υἱοῦ αὐτοῦ
  choice: por seu Filho
  rationale: Em contexto de juramento, κατὰ com genitivo indica aquilo por que se jura; a formulação portuguesa é natural e mantém a expressão incomum do original.
- source_word: ἀπεγνωσθαι ἀπὸ τῆς ζωῆς αὐτῶν
  choice: estão excluídos da vida
  rationale: Expressa a ideia de serem rejeitados ou privados da vida, sem especificar além do grego a natureza dessa vida.
- source_word: τοὺς νῦν μέλλοντας ἀρνεῖσθαι
  choice: os que estão prestes a negá-lo
  rationale: Preserva a orientação futura de μέλλοντας e explicita como objeto o Senhor, subentendido no grego.
- source_word: πολυσπλαγχνίαν
  choice: grande compaixão
  rationale: Comunica em linguagem atual a intensa misericórdia entranhável indicada pelo termo.
- source_word: ἵλεως ἐγένετο αὐτοῖς
  choice: ele se mostrou misericordioso para com eles
  rationale: Mantém o sentido relacional da expressão e evita transformá-la numa declaração técnica de absolvição.
theological_decisions:
- issue: Alcance da exclusão da vida
  choice: estão excluídos da vida
  alternative: foram condenados a perder a vida
  rationale: A tradução conserva a severidade de ἀπεγνωσθαι ἀπὸ sem definir dogmaticamente se a exclusão é irrevogável, eterna ou sacramental.
- issue: Contraste entre negações futuras e anteriores
  choice: distinguir explicitamente os que negarão nos dias vindouros daqueles que negaram anteriormente
  alternative: harmonizar ambos os grupos sob uma única condição de arrependimento
  rationale: O texto estabelece uma tensão deliberada entre os dois grupos; ela deve permanecer sem explicação teológica acrescentada.
- issue: Referente de αὐτῶν em τῆς ζωῆς αὐτῶν
  choice: da vida
  alternative: da sua própria vida
  rationale: A forma sem possessivo soa mais natural em português e preserva a possível dimensão teológica de 'a vida', sem reduzir a expressão à vida física.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe ajustada para tornar clara a aposição grega. Mantém-se a linguagem solene e a tensão entre juízo futuro e misericórdia passada.
