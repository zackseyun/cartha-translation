revisions:
- from: Pois o Senhor jurou por seu Filho que os que negaram seu Senhor estão excluídos da vida — isto é, os que estão prestes a negá-lo nos dias que virão. Mas, para com os que o negaram anteriormente, ele se mostrou misericordioso por causa de sua grande compaixão.”
  to: Pois o Senhor jurou por seu Filho que os que negaram o seu Senhor foram excluídos da vida — os que agora estão prestes a negá-lo nos dias que virão. Mas, por causa de sua grande compaixão, ele se mostrou misericordioso para com os que o negaram anteriormente.”
  rationale: Retirou-se a glosa «isto é» para manter a aposição do original sem reforçar sua relação lógica. Também se ajustou «estão excluídos» para «foram excluídos», refletindo mais de perto a ação apresentada como consumada. Não foram acrescentadas notas, pois a tradução pode conservar a ambiguidade sem sobrecarregar o leitor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:39:34Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha o sentido geral e preserva o contraste entre os que negarão e os que negaram antes. Contudo, «isto é» transforma a aposição grega em explicação identificadora mais forte do que o texto exige, e «estão excluídos» enfraquece a forma perfectiva de ἀπεγνωσθαι. A revisão conserva a formulação severa sem definir a natureza da «vida».
  naturalness: O português do rascunho é claro e de registro apropriado. A revisão torna a aposição mais direta e a conclusão mais fluente, sem perder a solenidade.
  terminology: «Senhor», «jurou», «negar» e «grande compaixão» são adequados. «Foram excluídos da vida» reproduz de modo mais próximo a imagem adotada pela trilha inglesa («are cut off from their life»), evitando especificações doutrinárias.
  issues:
  - severity: medium
    issue: «isto é» introduz uma explicação não expressa
    rationale: O segundo grupo está em aposição ao primeiro no grego, mas «isto é» em português tende a apresentar uma equivalência explicativa inequívoca. Um travessão seguido diretamente da aposição preserva melhor a construção e sua concisão.
  - severity: low
    issue: «estão excluídos» não reflete bem o aspecto da construção infinitiva
    rationale: ἀπεγνωσθαι apresenta o resultado como já consumado. «Foram excluídos» mantém melhor esse valor, sem ir além do sentido de exclusão/privação adotado pela tradução inglesa.
  revised_text: Pois o Senhor jurou por seu Filho que os que negaram o seu Senhor foram excluídos da vida — os que agora estão prestes a negá-lo nos dias que virão. Mas, por causa de sua grande compaixão, ele se mostrou misericordioso para com os que o negaram anteriormente.”
  revised_footnotes: []
