base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/001.yaml
  text: 'After fifteen days, when I had been fasting and had asked the Lord many things, the understanding of the writing was revealed to me. And this was written:'
translation:
  language: pt
  text: 'Passados quinze dias, depois de eu jejuar e fazer muitas perguntas ao Senhor, foi-me revelado o sentido do escrito. Estava escrito o seguinte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ δέκα καὶ πέντε ἡμέρας
  choice: Passados quinze dias
  rationale: Expressa com naturalidade em português o intervalo temporal indicado pelo grego.
- source_word: νηστεύσαντός μου
  choice: depois de eu jejuar
  rationale: Preserva a ação anterior expressa pelo particípio aoristo, evitando uma construção excessivamente rígida.
- source_word: πολλὰ ἐρωτήσαντος τὸν Κύριον
  choice: fazer muitas perguntas ao Senhor
  rationale: Mantém o sentido direto de ἐρωτάω e a amplitude de πολλά, sem especificar o conteúdo das perguntas.
- source_word: ἡ γνῶσις τῆς γραφῆς
  choice: o sentido do escrito
  rationale: Neste contexto, γνῶσις é a compreensão revelada do conteúdo, e γραφή designa o escrito mencionado, não necessariamente as Escrituras em sentido canônico.
- source_word: ἦν δὲ γεγραμμένα ταῦτα
  choice: Estava escrito o seguinte
  rationale: Formulação portuguesa idiomática que introduz fielmente o conteúdo escrito anunciado pelo grego.
theological_decisions:
- issue: Natureza da revelação recebida
  choice: foi-me revelado o sentido do escrito
  alternative: foi-me revelado o conhecimento da Escritura
  rationale: A opção adotada preserva a ideia de compreensão concedida por revelação sem transformar γραφή, neste contexto imediato, em referência técnica ao cânon bíblico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A voz passiva de ἀπεκαλύφθη foi preservada para não explicitar um agente que o texto grego deixa implícito.
