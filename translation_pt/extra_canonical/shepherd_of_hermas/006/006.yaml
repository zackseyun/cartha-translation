  rationale: A revisão corrige o valor futuro de ἐρεῖς e torna τοῖς προηγουμένοις τῆς ἐκκλησίας mais próximo do sentido funcional de pessoas que estão à frente da comunidade, sem lhes atribuir um cargo técnico. Os demais elementos mantêm a metáfora moral e a amplitude sintática do original.
