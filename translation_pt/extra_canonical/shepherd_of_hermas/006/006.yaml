base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/006.yaml
  text: Therefore you shall say to those who lead the church that they should set their ways straight in righteousness, so that they may receive the promises in full, with much glory.
translation:
  language: pt
  text: Portanto, você dirá aos que estão à frente da igreja que corrijam os seus caminhos em justiça, para que recebam as promessas em toda a sua plenitude, com muita glória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: aos que lideram a igreja
  rationale: Expressa naturalmente os responsáveis que estão à frente da comunidade, sem impor um título eclesiástico específico não presente no grego.
- source_word: κατορθώσωνται τὰς ὁδοὺς αὐτῶν
  choice: endireitem os seus caminhos
  rationale: Preserva a metáfora moral do original e comunica a ideia de corrigir a conduta.
- source_word: ἐν δικαιοσύνῃ
  choice: em justiça
  rationale: Mantém o substantivo teologicamente significativo e a formulação metafórica do grego.
- source_word: ἀπολάβωσιν ἐκ πλήρους
  choice: recebam plenamente
  rationale: Reproduz de modo idiomático a ideia de receber em medida completa.
- source_word: μετὰ πολλῆς δόξης
  choice: com grande glória
  rationale: Tradução direta que conserva a possível associação da glória tanto ao recebimento quanto ao cumprimento das promessas.
theological_decisions:
- issue: Identidade dos dirigentes da igreja
  choice: os que lideram a igreja
  alternative: os líderes da igreja
  rationale: A construção verbal é natural e evita transformar a expressão funcional grega em um ofício técnico específico.
- issue: Relação sintática de «com grande glória»
  choice: Manter a expressão no fim da frase
  alternative: «recebam, com grande glória, a plena realização das promessas»
  rationale: A posição final preserva a abertura do grego quanto à ligação precisa da expressão, sem explicitar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O imperativo singular «diga» corresponde ao destinatário Hermas; a exortação subordinada aos dirigentes foi vertida no presente do subjuntivo.
