review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente os destinatários, a imagem de corrigir os próprios caminhos, a justiça e o recebimento pleno das promessas. Contudo, o grego ἐρεῖς é futuro do indicativo (“você dirá”), não imperativo (“diga”).
  naturalness: O texto é claro e natural em português moderno. “Os que estão à frente da igreja” reproduz com maior proximidade a expressão grega sem criar um título eclesiástico técnico.
  terminology: “Justiça”, “promessas” e “glória” são escolhas adequadas. “Em toda a sua plenitude” transmite ἐκ πλήρους de modo idiomático e completo.
  issues:
  - severity: medium
    issue: Modo verbal de ἐρεῖς
    rationale: O futuro indicativo deve ser vertido como “você dirá” (ou equivalente), e não como o imperativo “diga”. A frase é uma instrução profética dirigida a Hermas, não um imperativo formal nesta forma verbal.
  revised_text: Portanto, você dirá aos que estão à frente da igreja que corrijam os seus caminhos em justiça, para que recebam as promessas em toda a sua plenitude, com muita glória.
