lexical_decisions:
- source_word: Ἤθελον
  choice: Eu queria
  rationale: O imperfeito expressa um desejo ou intenção apresentada com cortesia; “queria” é natural em português e mantém esse valor.
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento, aqui vertida em minúscula por não exigir identificação teológica específica.
- source_word: ποίοις τρόποις
  choice: de que maneiras
  rationale: Preserva o plural e a pergunta pelo modo ou pelos meios.
- source_word: με δεῖ
  choice: devo
  rationale: Comunica a ideia de necessidade ou obrigação pessoal de forma direta e corrente.
- source_word: δουλεῦσαι
  choice: servir
  rationale: Mantém a imagem forte de prestar serviço ou sujeitar-se, sem suavizá-la para “lidar com” ou “controlar”.
- source_word: τῇ ἐπιθυμίᾳ
  choice: ao desejo
  rationale: Traduz literalmente o dativo regido por δουλεῦσαι e preserva a amplitude de ἐπιθυμία, que pode ser desejo ou cobiça conforme o contexto.
theological_decisions:
- issue: Sentido moral de ἐπιθυμία
  choice: desejo
  alternative: cobiça / mau desejo
  rationale: O fragmento grego fornecido não explicita sozinho se o termo é necessariamente negativo; “desejo” conserva a ambiguidade sem impor uma avaliação moral.
