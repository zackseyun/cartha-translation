base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/005.yaml
  text: Seeing these things set there and no one in the place, I was astonished, and a tremor, as it were, seized me, and my hair stood on end; and a shudder, as it were, came upon me, since I was alone. Then, coming to myself and remembering the glory of God, and taking courage, I knelt and again confessed my sins to the Lord, as before.
translation:
  language: pt
  text: Ao ver aquelas coisas ali dispostas e que não havia ninguém no lugar, fiquei assombrado; um tremor como que se apoderou de mim, meus cabelos se arrepiaram e um calafrio como que me sobreveio, pois eu estava sozinho. Então, voltando a mim, lembrei-me da glória de Deus e recobrei a coragem. Pus-me de joelhos e, como antes, confessei novamente meus pecados ao Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκθαμβος ἐγενόμην
  choice: fiquei assombrado
  rationale: Expressa o forte espanto do grego sem sugerir necessariamente mera surpresa ou terror absoluto.
- source_word: ὡσεί τρόμος με ἔλαβεν
  choice: foi como se um tremor se apoderasse de mim
  rationale: Preserva o comparativo ὡσεί e a imagem idiomática de algo que toma a pessoa.
- source_word: αἱ τρίχες μου ὀρθαί
  choice: meus cabelos se arrepiaram
  rationale: Equivalente idiomático natural em português para a descrição literal dos pelos que ficam em pé.
- source_word: ὡσεί φρίκη μοι προσῆλθεν
  choice: fui tomado por um calafrio
  rationale: Comunica a reação física de medo ou estremecimento, preservando-a sem ampliar indevidamente seu sentido.
- source_word: ἐν ἐμαυτῷ οὖν γενόμενος
  choice: Então, voltando a mim
  rationale: Reproduz com naturalidade o sentido de recuperar o domínio de si após o assombro.
- source_word: λαβὼν θάρσος
  choice: recobrei a coragem
  rationale: Formulação corrente que transmite a passagem do medo à confiança.
- source_word: θεὶς τὰ γόνατα
  choice: Pus-me de joelhos
  rationale: Equivalência idiomática clara para o gesto grego de pôr os joelhos no chão.
- source_word: ἐξωμολογούμην ... τὰς ἁμαρτίας μου
  choice: confessei ... meus pecados
  rationale: No contexto, o objeto explícito determina o sentido de confissão de pecados.
theological_decisions:
- issue: Referente de τῆς δόξης τοῦ Θεοῦ
  choice: a glória de Deus
  alternative: a majestade de Deus
  rationale: A tradução formal preserva a linguagem teológica ampla do original sem interpretar em que aspecto essa glória é lembrada.
- issue: Aspecto de ἐξωμολογούμην
  choice: confessei novamente
  alternative: comecei novamente a confessar
  rationale: O imperfeito pode descrever ação em curso, mas o português narrativo admite o pretérito perfeito; “novamente” e “como antes” preservam a repetição explicitada pelo grego.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. A sequência das reações físicas e espirituais foi mantida, bem como os dois comparativos ὡσεί, o primeiro de modo explícito e o segundo por uma formulação não categórica no fluxo da frase.
