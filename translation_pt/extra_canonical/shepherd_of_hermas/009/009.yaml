base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/009.yaml
  text: So when I wanted to sit on the right side, she did not permit me, but motioned to me with her hand that I should sit on the left side. So as I reasoned and was grieved that she had not allowed me to sit on the right side, she says to me, “Are you grieved, Hermas? The place on the right side belongs to others—those who have already pleased God and suffered for the sake of the Name; but you lack many things to sit with them. But as you remain in your simplicity, remain, and you will sit with them, as will all who do their works and endure what they also endured.”
translation:
  language: pt
  text: 'Quando eu quis sentar-me do lado direito, ela não permitiu; antes, fez-me sinal com a mão para que me sentasse do lado esquerdo. Enquanto eu refletia e me entristecia porque ela não me havia permitido sentar-me do lado direito, disse-me: “Você está triste, Hermas? O lugar do lado direito pertence a outros: aos que já agradaram a Deus e sofreram por causa do Nome.[a] Ainda lhe falta muito para sentar-se com eles. Mas, se você permanecer na sua simplicidade, permaneça nela, e se sentará com eles, assim como todos os que praticarem as obras deles e suportarem o que eles também suportaram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa do nome”. O texto não explicita de quem é o nome; no contexto cristão, trata-se de uma referência reverente ao Nome confessado pelos que sofrem.'
    reason: Preserva a forma elíptica do grego e informa o leitor sobre a ambiguidade real sem resolvê-la no texto principal.
lexical_decisions:
- source_word: διαλογιζομένου
  choice: enquanto eu refletia
  rationale: O particípio indica ponderação interior; “refletia” transmite isso naturalmente sem acrescentar dúvida ou discussão.
- source_word: τὰ δεξιὰ μέρη / τὰ ἀριστερὰ μέρη
  choice: do lado direito / do lado esquerdo
  rationale: Mantém o contraste espacial e simbólico do grego em português corrente.
- source_word: τοῦ ὀνόματος
  choice: do Nome
  rationale: Preserva a referência reverente e não explicitada do original; a inicial maiúscula sinaliza seu uso titular sem resolver indevidamente o referente.
- source_word: ἁπλότητί
  choice: simplicidade
  rationale: Conserva a amplitude de ἁπλότης, que pode envolver singeleza, sinceridade e integridade, sem reduzi-la a ingenuidade.
- source_word: ἐμμένεις ... μενὸν
  choice: permanece ... continue nela
  rationale: Reproduz a exortação à perseverança, evitando em português a repetição rígida de “permanecer” e tornando explícito apenas o referente já presente, a simplicidade.
- source_word: ὑπενέγκωσιν
  choice: suportarem
  rationale: Expressa a ideia de aguentar provações ou sofrimentos, em paralelo com o que os outros suportaram.
theological_decisions:
- issue: Identidade do “Nome”
  choice: manter “o Nome” sem especificar
  alternative: “o nome de Cristo” ou “o nome do Senhor”
  rationale: O grego diz apenas τοῦ ὀνόματος. A tradução conserva essa formulação reverente e sua ambiguidade contextual.
- issue: Condição futura de Hermas e dos demais
  choice: “continue nela, e se sentará com eles”
  alternative: formular como garantia incondicional ou como mera possibilidade
  rationale: O texto vincula a participação futura à perseverança na simplicidade e, para os demais, às mesmas obras e ao mesmo sofrimento; a tradução mantém essa tensão exortativa.
- issue: Sentido moral de ἁπλότης
  choice: “simplicidade”
  alternative: “inocência”, “sinceridade” ou “ingenuidade”
  rationale: “Simplicidade” preserva melhor o campo semântico e evita impor uma interpretação moral excessivamente estreita.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” coerente com a fala direta corrente no Brasil. A sintaxe acompanha de perto a progressão do grego, mas evita construções artificiais. “Ainda lhe falta muito” conserva a censura pessoal sem soar arcaico; “praticarem as obras deles” mantém o paralelismo ético do original.
