lexical_decisions:
- source_word: ἣν εἶδον
  choice: que tive
  rationale: Em português, “a visão que tive” expressa de modo natural a experiência indicada literalmente por “que vi”, sem alterar o sentido.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Vocativo plural direto e inclusivo no uso comunitário antigo; “irmãos” é a forma tradicional e natural em português.
- source_word: τοιαύτη
  choice: foi assim
  rationale: Introduz naturalmente, em português, o relato que descreve como foi a visão.
