base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/008.yaml
  text: And after the young men withdrew and we were alone, she says to me, “Sit here.” I say to her, “Lady, let the elders sit first.” “What I tell you,” she says, “sit.”
translation:
  language: pt
  text: 'Depois que os jovens se retiraram e ficamos a sós, ela me disse: “Sente-se aqui”. Eu lhe disse: “Senhora, deixe os anciãos se sentarem primeiro”. Ela respondeu: “Faça o que lhe digo: sente-se”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκους
  choice: jovens
  rationale: Traduz naturalmente o substantivo grego e mantém a referência aos seis jovens mencionados no contexto anterior.
- source_word: πρεσβυτέρους
  choice: anciãos
  rationale: Preserva a distinção lexical em relação a νεανίσκους e a ideia de pessoas mais velhas ou de precedência, sem impor aqui um cargo eclesiástico.
- source_word: Κάθισον ὧδε
  choice: Sente-se aqui
  rationale: Imperativo direto e idiomático em português, correspondente ao grego.
- source_word: Ὅ σοι λέγω
  choice: Faça o que lhe digo
  rationale: Expressa em português corrente a força elíptica da construção grega, que repete em seguida a ordem para sentar-se.
theological_decisions:
- issue: Sentido de πρεσβυτέρους
  choice: anciãos
  alternative: os mais velhos
  rationale: “Anciãos” conserva a terminologia tradicional e a possível nuance de dignidade, mas o contexto não permite concluir que se trate necessariamente de um ofício eclesiástico.
translation_notes:
  register: Português moderno, claro e digno, com diálogo natural. Empregou-se o pretérito na narração em vez do presente histórico grego, sem alterar a sequência dos acontecimentos.
