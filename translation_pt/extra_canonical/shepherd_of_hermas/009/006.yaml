  to: 'Ela veio com seis jovens, que eu também já tinha visto antes, e pôs-se ao meu lado, ouvindo enquanto eu orava e confessava meus pecados ao Senhor. Então, tocando-me, disse: “Hermas, pare de fazer tantas perguntas sobre seus pecados. Pergunte também a respeito da justiça, para que você receba alguma parte dela para a sua casa.”'
