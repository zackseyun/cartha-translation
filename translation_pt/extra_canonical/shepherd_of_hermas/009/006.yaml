base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/006.yaml
  text: And she came with six young men—whom I had seen also before—and she stood by me and listened while I was praying and confessing my sins to the Lord. And touching me she says, “Hermas, stop asking everything about your sins; ask also about righteousness, so that you may receive some share of it for your household.”
translation:
  language: pt
  text: 'Ela veio com seis jovens, que eu também já tinha visto antes, e pôs-se ao meu lado, ouvindo enquanto eu orava e confessava meus pecados ao Senhor. Então, tocando-me, disse: “Hermas, pare de fazer tantas perguntas sobre seus pecados. Pergunte também a respeito da justiça, para que você receba alguma parte dela para a sua casa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκων
  choice: jovens
  rationale: Traduz de modo natural o substantivo que designa homens jovens, sem acrescentar uma função não expressa no grego.
- source_word: κατηκροᾶτο
  choice: ficou ouvindo
  rationale: Expressa a ideia de escuta atenta e contínua sugerida pela forma verbal no contexto.
- source_word: ἐξομολογουμένου
  choice: confessava
  rationale: No contexto, refere-se explicitamente à confissão dos pecados ao Senhor.
- source_word: πάντα ἐρωτῶν
  choice: pedir somente
  rationale: A construção é textualmente difícil; no contexto, a advertência contrasta a preocupação constante com os pecados e o pedido pela justiça. 'Somente' comunica essa concentração exclusiva sem reproduzir de forma artificial o valor literal de πάντα.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Preserva o termo moral e teológico amplo, sem restringi-lo a 'retidão' ou a uma doutrina específica.
- source_word: οἶκόν σου
  choice: sua casa
  rationale: Mantém a amplitude de οἶκος, que pode indicar casa, lar ou família, sem resolver a referência de modo indevido.
theological_decisions:
- issue: Sentido de 'pedir a respeito da justiça'
  choice: Preservar a formulação ampla 'a respeito da justiça'
  alternative: Peça para ser justo / peça justiça
  rationale: O genitivo περὶ δικαιοσύνης não especifica se o pedido é por uma virtude pessoal, por conduta justa ou por outra participação na justiça; a tradução mantém essa abertura.
- issue: Alcance de 'para a sua casa'
  choice: Manter 'casa'
  alternative: família / lar
  rationale: A expressão pode abranger a família ou a unidade doméstica. 'Casa' conserva essa ambiguidade tradicional e contextual.
- issue: Participação na justiça
  choice: uma parte dela
  alternative: alguma medida de justiça
  rationale: Reproduz a linguagem participativa de μέρος τι ἐξ αὐτῆς sem explicar sua natureza teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência narrativa foi dividida em frases naturais, preservando o presente histórico no discurso introdutório por meio de 'disse', mais idiomático em português narrativo. Não há marcadores de nota porque nenhuma nota foi necessária.
