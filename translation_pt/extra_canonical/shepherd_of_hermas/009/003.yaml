base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/003.yaml
  text: I asked her, saying, “Lady, to what place in the field?” “Wherever you wish,” she says. I chose a good, secluded spot. But before I spoke to her and named the place, she says to me, “I will come there where you wish.”
translation:
  language: pt
  text: 'Perguntei-lhe: “Senhora, em que lugar do campo?” Ela respondeu: “Onde você quiser”. Escolhi um lugar agradável e retirado. Mas, antes que eu lhe falasse e dissesse qual era o lugar, ela me disse: “Irei aonde você quiser”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: Senhora
  rationale: Preserva a forma respeitosa de tratamento dirigida à anciã, com linguagem natural e digna.
- source_word: ἀγροῦ
  choice: campo
  rationale: Corresponde diretamente ao cenário rural indicado por ἀγρός.
- source_word: τόπον καλὸν ἀνακεχωρηκότα
  choice: um lugar agradável e retirado
  rationale: καλός descreve o lugar positivamente, enquanto ἀνακεχωρηκότα indica afastamento ou isolamento; a formulação mantém ambos os aspectos sem exagerá-los.
- source_word: Ἥξω ἐκεῖ
  choice: Irei aonde
  rationale: Expressa a promessa de chegada ao lugar escolhido, preservando a relação espacial com ὅπου θέλεις.
