revisions:
- from: 'Depois de jejuar muitas vezes e suplicar ao Senhor que me revelasse a revelação que ele havia prometido mostrar por meio daquela anciã, naquela mesma noite a anciã me apareceu e disse: “Como você é tão necessitado e tão empenhado em saber tudo, venha ao campo onde costuma passar algum tempo. Por volta da quinta hora[a], aparecerei a você e lhe mostrarei o que você precisa ver.”'
  to: 'Depois de jejuar muitas vezes e suplicar ao Senhor que me desse a conhecer a revelação que ele havia prometido mostrar por meio daquela anciã, naquela mesma noite a anciã me apareceu e disse: “Como você tem tanta necessidade e tanto empenho de saber tudo, venha ao campo onde costuma ficar. Por volta da quinta hora[a], aparecerei a você e lhe mostrarei o que você precisa ver.”'
  rationale: 'A revisão melhora a idiomaticidade sem reduzir a precisão: substitui a repetição pouco natural por «me desse a conhecer a revelação», explicita ἐνδεής por meio da construção portuguesa «ter necessidade» e simplifica a tradução de χρονίζεις. Conservam-se a mediação da anciã, a linguagem respeitosa e a expressão temporal antiga com nota explicativa.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:34:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'O sentido central é bem preservado: Hermas jejua e pede ao Senhor que lhe dê a conhecer a revelação prometida, a anciã aparece naquela noite e o convoca para o campo por volta da quinta hora. Mantém-se corretamente o Senhor como sujeito mais natural de «havia prometido mostrar», e a anciã como mediadora («por meio daquela anciã»).'
  naturalness: 'Há duas formulações pouco naturais em português moderno: «me revelasse a revelação» produz repetição desajeitada que não é necessária para reproduzir o grego; e «você é tão necessitado» normalmente sugere privação material ou social. «Tem tanta necessidade e tanto empenho de saber tudo» preserva a carência/urgência expressa por ἐνδεής e soa mais idiomático.'
  terminology: «Senhor», «anciã», «jejuar», «suplicar» e «quinta hora» são adequados. «Onde costuma ficar» traduz χρονίζεις com maior concisão e naturalidade do que «onde costuma passar algum tempo», sem implicar residência permanente. A nota da quinta hora é apropriada.
  issues:
  - severity: medium
    issue: «me revelasse a revelação»
    rationale: φανερώσῃ τὴν ἀποκάλυψιν significa literalmente tornar conhecida a revelação. Em português, «dar a conhecer a revelação» preserva o conteúdo sem uma repetição verbal-nominal artificial.
  - severity: medium
    issue: «Como você é tão necessitado»
    rationale: Embora ἐνδεής denote necessidade ou carência, «necessitado» aplicado a uma pessoa, isoladamente, tende a remeter a pobreza ou vulnerabilidade social. Uma construção com «ter necessidade» mantém a força lexical e evita essa leitura indevida.
  - severity: low
    issue: «onde costuma passar algum tempo»
    rationale: A formulação é perifrástica. «Onde costuma ficar» comunica naturalmente a ideia de demorar-se ou permanecer expressa por χρονίζεις.
  revised_text: 'Depois de jejuar muitas vezes e suplicar ao Senhor que me desse a conhecer a revelação que ele havia prometido mostrar por meio daquela anciã, naquela mesma noite a anciã me apareceu e disse: “Como você tem tanta necessidade e tanto empenho de saber tudo, venha ao campo onde costuma ficar. Por volta da quinta hora[a], aparecerei a você e lhe mostrarei o que você precisa ver.”'
  revised_footnotes:
  - marker: a
    text: Isto é, aproximadamente às onze horas da manhã, contando-se as horas a partir do nascer do sol.
    reason: Esclarece o antigo sistema de contagem das horas sem substituir a expressão do texto-fonte.
  revision_rationale: 'A revisão melhora a idiomaticidade sem reduzir a precisão: substitui a repetição pouco natural por «me desse a conhecer a revelação», explicita ἐνδεής por meio da construção portuguesa «ter necessidade» e simplifica a tradução de χρονίζεις. Conservam-se a mediação da anciã, a linguagem respeitosa e a expressão temporal antiga com nota explicativa.'
