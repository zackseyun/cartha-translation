base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/002.yaml
  text: 'After fasting many times and pleading with the Lord to make known to me the revelation he had promised to show me through that aged woman, on that very night the aged woman appeared to me and said: “Since you are so needy and so eager to know everything, come to the field where you stay, and about the fifth hour I will appear to you and show you what you must see.”'
translation:
  language: pt
  text: 'Depois de jejuar muitas vezes e suplicar ao Senhor que me desse a conhecer a revelação que ele havia prometido mostrar por meio daquela anciã, naquela mesma noite a anciã me apareceu e disse: “Como você tem tanta necessidade e tanto empenho de saber tudo, venha ao campo onde costuma ficar. Por volta da quinta hora[a], aparecerei a você e lhe mostrarei o que você precisa ver.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, aproximadamente às onze horas da manhã, contando-se as horas a partir do nascer do sol.
    reason: Esclarece o antigo sistema de contagem das horas sem substituir a expressão do texto-fonte.
lexical_decisions:
- source_word: δεηθείς
  choice: suplicar
  rationale: Expressa um pedido intenso dirigido ao Senhor, com naturalidade e dignidade em português.
- source_word: πρεσβυτέρας / πρεσβυτέρα
  choice: anciã
  rationale: Preserva a referência a uma mulher idosa e respeitável sem acrescentar um cargo eclesiástico.
- source_word: ἐνδεὴς
  choice: necessitado
  rationale: Mantém a ideia incomum de carência ou necessidade presente no grego, sem a reinterpretar como mera curiosidade.
- source_word: σπουδαῖος
  choice: empenhado
  rationale: Comunica zelo, seriedade e intensidade no desejo de saber.
- source_word: χρονίζεις
  choice: costuma passar algum tempo
  rationale: Representa o sentido de permanecer ou demorar-se habitualmente naquele campo, evitando a impressão de residência permanente.
- source_word: ὥραν πέμπτην
  choice: quinta hora
  rationale: Conserva a forma antiga de contar as horas, enquanto a nota fornece ao leitor moderno uma aproximação.
theological_decisions:
- issue: Agente e mediação da revelação
  choice: “a revelação que ele havia prometido mostrar por meio daquela anciã”
  alternative: “a revelação que aquela anciã havia prometido mostrar”
  rationale: O sujeito implícito de ἐπηγγείλατο é mais naturalmente o Senhor, retomado da oração principal; a anciã é apresentada como o meio pelo qual a revelação seria mostrada.
- issue: Força de ἐνδεὴς
  choice: “tão necessitado”
  alternative: “tão desejoso”
  rationale: A opção escolhida preserva a tensão lexical do termo grego, que denota falta ou necessidade; “desejoso” o fundiria indevidamente com o adjetivo seguinte, σπουδαῖος.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “revelasse a revelação” foi mantida para refletir a repetição etimológica do grego, embora soe marcada em português.
