  text: And she raised me by the hand and leads me to the couch, and she says to the young men, “Go and build.”
translation:
  language: pt
  text: 'E ela me levantou pela mão, levou-me até o banco e disse aos jovens: “Vão e construam.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήγειρέ με τῆς χειρός
  choice: me levantou pela mão
  rationale: Reproduz naturalmente em português o gesto físico expresso pelo aoristo e pela expressão grega.
- source_word: ἄγει με
  choice: levou-me
  rationale: O presente histórico grego é vertido no passado para manter uma narrativa portuguesa fluente, sem alterar a sequência da ação.
- source_word: συμπέλιον
  choice: banco
  rationale: O termo raro designa aqui um assento ou banco, descrito anteriormente como sendo de marfim; “banco” evita a associação moderna de “divã” ou “sofá”.
- source_word: νεανίσκοις
  choice: jovens
  rationale: Equivalente direto e corrente para os seis jovens mencionados no contexto.
- source_word: Ὑπάγετε καὶ οἰκοδομεῖτε
  choice: Vão e construam
  rationale: Preserva os dois imperativos e a ordem direta, mantendo em aberto o objeto da construção como no grego.
