base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/004.yaml
  text: So I went, brothers, into the field, and I counted the hours, and I came to the place where I had directed her to come; and I see an ivory couch set there, and upon the couch there lay a linen pillow, and on top a spread-out towel of fine linen.
translation:
  language: pt
  text: Assim, irmãos, fui ao campo, calculei as horas e cheguei ao lugar aonde eu lhe havia indicado que viesse. Então vi ali um divã de marfim; sobre o divã havia uma almofada de linho e, por cima, estava estendido um pano de linho fino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεψήφισα τὰς ὥρας
  choice: calculei as horas
  rationale: A expressão indica contar ou calcular o tempo até a hora marcada; esta formulação preserva o sentido sem sugerir um relógio moderno.
- source_word: διεταξάμην αὐτὴν ἐλθεῖν
  choice: eu lhe havia pedido que viesse
  rationale: Embora διατάσσω possa denotar ordenar ou determinar, no contexto Hermas indica à senhora o lugar escolhido; 'pedido' evita a ideia pouco natural de que ele lhe deu uma ordem, sem apagar a determinação do encontro.
- source_word: βλέπω
  choice: Então vi
  rationale: O presente histórico grego torna a cena vívida. Em português narrativo, o pretérito com 'então' mantém a progressão natural e parte dessa vivacidade.
- source_word: συμπέλιον ... ἐλεφάντινον
  choice: um divã de marfim
  rationale: O objeto é um assento ou leito alongado; 'divã' é claro, digno e compatível com a cena.
- source_word: κεβριδάριον λινόῦν
  choice: uma almofada de linho
  rationale: O termo raro designa provavelmente uma pequena almofada ou coxim; 'almofada' é a equivalência mais compreensível.
- source_word: λεντίον ... λινόῦν καρπάσιον
  choice: um pano de linho fino
  rationale: λεντίον é um pano ou toalha, enquanto καρπάσιον qualifica um linho fino. 'Pano' evita especificar uma função doméstica que o contexto não estabelece.
