base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/057/001.yaml
  text: I say to him, "Lord, explain this to me further." He says, "What are you seeking?" I say, "Then, Lord, are those who indulge themselves and are deceived tormented for the same length of time as the time of the deception? For the time of deception is one hour, but the hour of torment has the force of thirty days. Therefore, if someone indulges himself for one day and is deceived, and is tormented for one day, the day of torment amounts to a whole year. So then, for as many days as a person indulges himself, for that many years he is tormented." "You see then," he says, "that the time of indulgence and deception is very short, but the time of punishment and torment is long."
translation:
  language: pt
  text: 'Eu lhe digo: “Senhor, explica-me ainda isto.” Ele diz: “O que você quer saber?” Eu digo: “Então, Senhor, os que vivem em prazeres e são enganados sofrem tormento pelo mesmo tempo que durou o engano? Pois o tempo do engano é uma hora, mas uma hora de tormento tem o peso de trinta dias. Portanto, se alguém viver em prazeres e for enganado por um dia, e sofrer tormento por um dia, esse dia de tormento equivale a um ano inteiro. Assim, por tantos dias quantos alguém viver em prazeres, por tantos anos sofrerá tormento.” Ele diz: “Você vê, então, que o tempo dos prazeres e do engano é muito curto, mas o do castigo e do tormento é longo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶντες / τρυφήσῃ
  choice: os que vivem em prazeres / viver em prazeres
  rationale: Expressa a ideia de entrega ao luxo, aos deleites ou à vida indulgente sem restringi-la à mera satisfação pessoal; a formulação é natural e mantém o tom moral do grego.
- source_word: ἀπατώμενοι / ἀπατηθῇ
  choice: são enganados / for enganado
  rationale: 'Mantém a voz passiva e a possível tensão do texto: essas pessoas entregam-se aos prazeres e, ao mesmo tempo, são enganadas.'
- source_word: βασανίζονται / βασάνου / βασανισθῇ
  choice: sofrem tormento / tormento / sofrer tormento
  rationale: Preserva a força de βάσανος, mais intensa do que simples sofrimento, e sua repetição retórica.
- source_word: δύναμιν ἔχει / ἰσχύει
  choice: tem o peso de / equivale a
  rationale: Comunica a correspondência temporal ou valor computado no argumento, evitando a expressão pouco natural 'tem a força de'.
- source_word: τιμωρίας
  choice: castigo
  rationale: Termo corrente e digno para punição retributiva, distinto de βάσανος, traduzido como 'tormento'.
theological_decisions:
- issue: Relação entre prazer, engano e tormento
  choice: Preservar o enunciado como explicação direta da personagem, sem qualificá-lo doutrinariamente.
  alternative: Acrescentar linguagem que apresente a proporção como símbolo, purificação ou condenação definitiva.
  rationale: O grego afirma uma correspondência temporal dentro da comparação, mas não define aqui a natureza última, a finalidade ou a duração total do castigo.
- issue: Sentido passivo de ἀπατάω
  choice: Traduzir como 'ser enganado'.
  alternative: Traduzir reflexivamente como 'enganar-se' ou moralmente como 'viver no erro'.
  rationale: A forma grega é passiva; conservar isso evita decidir silenciosamente quem engana ou em que consiste o engano.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O diálogo foi mantido em discurso direto. Usou-se 'você' por naturalidade ampla no português brasileiro, sem coloquialismos excessivos. A repetição de 'tormento', 'engano' e 'prazeres' foi preservada por sua função argumentativa.
