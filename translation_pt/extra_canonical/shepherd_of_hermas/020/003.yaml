  to: Pois ele teve compaixão de vocês e renovou os espíritos de vocês; vocês deixaram de lado as suas fraquezas, o vigor chegou até vocês e vocês foram fortalecidos na fé. Quando o Senhor viu o fortalecimento de vocês, alegrou-se. Por isso, revelou a vocês a construção da torre; e revelará ainda outras coisas, se, de todo o coração, vocês viverem em paz uns com os outros.
