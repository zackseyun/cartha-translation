base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/003.yaml
  text: “For he had compassion on you and renewed your spirits, and you put away your softness; strength came to you and you were strengthened in faith; and when the Lord saw your strengthening, he rejoiced. For this reason he made known to you the building of the tower, and he will make other things known, if, with a whole heart, you are at peace among yourselves.”
translation:
  language: pt
  text: Pois ele teve compaixão de vocês e renovou os espíritos de vocês; vocês deixaram de lado as suas fraquezas, o vigor chegou até vocês e vocês foram fortalecidos na fé. Quando o Senhor viu o fortalecimento de vocês, alegrou-se. Por isso, revelou a vocês a construção da torre; e revelará ainda outras coisas, se, de todo o coração, vocês viverem em paz uns com os outros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσπλαγχνίσθη ἐφ’ ὑμᾶς
  choice: teve compaixão de vocês
  rationale: Expressa de modo natural e fiel a compaixão profunda indicada pelo verbo grego.
- source_word: ἀνενεώσατο τὰ πνεύματα ὑμῶν
  choice: renovou o espírito de vocês
  rationale: Mantém o sentido de renovação interior; o singular coletivo em português evita a formulação menos natural «os espíritos de vocês» sem definir metafisicamente o referente.
- source_word: ἀπέθεσθε τὰς μαλακίας ὑμῶν
  choice: deixaram de lado a fraqueza
  rationale: ἀποτίθημι sugere remover ou abandonar; μαλακία, no contexto, designa debilidade ou falta de firmeza, não enfermidade física.
- source_word: προσῆλθεν ὑμῖν ἰσχυρότης
  choice: receberam vigor
  rationale: Reproduz naturalmente a chegada de força ou robustez descrita no grego e evita a repetição excessiva de «força».
- source_word: ἐδυναμώθητε ἐν τῇ πίστει
  choice: foram fortalecidos na fé
  rationale: Conserva a voz passiva e a esfera em que ocorre o fortalecimento.
- source_word: τὴν οἰκοδομὴν τοῦ πύργου
  choice: a construção da torre
  rationale: Mantém a imagem concreta e a continuidade temática da visão.
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  choice: viverem em paz uns com os outros
  rationale: Traduz idiomaticamente a paz mantida no interior da comunidade, preservando o sentido recíproco de ἐν ἑαυτοῖς.
theological_decisions:
- issue: Referente de «espírito» em τὰ πνεύματα ὑμῶν
  choice: o espírito de vocês
  alternative: os espíritos de vocês
  rationale: A tradução indica renovação interior sem identificar o referente com o Espírito Santo nem impor uma antropologia técnica; o coletivo é idiomático em português.
- issue: Condição ligada a revelações futuras
  choice: se, de todo o coração, vocês viverem em paz uns com os outros
  alternative: se vocês promoverem a paz entre si de todo o coração
  rationale: Preserva explicitamente a condição expressa por ἐάν e o chamado comunitário à paz, sem transformar a declaração em promessa incondicional.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para o plural de segunda pessoa. A redação acompanha de perto a progressão do grego, mas evita calques pouco naturais. A repetição semântica de força e fortalecimento foi parcialmente preservada por «vigor» e «fortalecidos».
