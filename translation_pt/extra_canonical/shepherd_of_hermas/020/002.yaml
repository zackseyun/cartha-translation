base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/002.yaml
  text: “When an old man, having already given up hope for himself because of his weakness and his poverty, expects nothing else but the last day of his life; then, all at once, an inheritance is left to him. On hearing of it he is stirred up, and, becoming overjoyed, he puts on strength; he no longer lies down, but stands; his spirit—already corrupted by his former deeds—is renewed; and he no longer sits, but takes courage. So also you, when you heard the revelation that the Lord revealed to you.
translation:
  language: pt
  text: “Quando um homem idoso, já sem esperança quanto a si mesmo por causa de sua fraqueza e pobreza, não espera outra coisa senão o último dia de sua vida, de repente lhe é deixada uma herança. Ao saber disso, ele se reanima e, cheio de alegria, reveste-se de força. Já não fica deitado, mas põe-se de pé; seu espírito, já corrompido por seus atos anteriores, é renovado; e ele já não fica sentado, mas cobra coragem. Assim também vocês, ao ouvirem a revelação que o Senhor lhes revelou...”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφηλπικὼς ἑαυτόν
  choice: já sem esperança quanto a si mesmo
  rationale: Preserva o sentido reflexivo de ter perdido a esperança a respeito da própria condição, sem recorrer a uma formulação artificial.
- source_word: προσδέχεται
  choice: espera
  rationale: No contexto, indica aquilo que o homem aguarda ou prevê como única coisa restante.
- source_word: κατελείφθη αὐτῷ κληρονομία
  choice: lhe é deixada uma herança
  rationale: Mantém a construção passiva e a ideia de uma herança inesperadamente destinada a ele.
- source_word: ἐξηγέρθη
  choice: se reanima
  rationale: Expressa o despertar ou revigoramento provocado pela notícia; o movimento físico de levantar-se é explicitado logo depois.
- source_word: ἐνεδύσατο τὴν ἰσχύν
  choice: reveste-se de força
  rationale: Conserva a metáfora concreta de vestir ou revestir-se de força.
- source_word: ἀνανεοῦται
  choice: é renovado
  rationale: Reproduz diretamente a renovação do espírito, tema central da comparação.
- source_word: ἀνδρίζεται
  choice: cobra coragem
  rationale: Transmite o sentido idiomático de agir com coragem ou mostrar-se valente sem preservar uma marca masculina desnecessária em português.
theological_decisions:
- issue: Repetição entre ἀποκάλυψιν e ἀπεκάλυψεν
  choice: a revelação que o Senhor lhes revelou
  alternative: a revelação que o Senhor lhes concedeu
  rationale: Mantém a repetição enfática do grego e não acrescenta uma interpretação sobre o modo de concessão da revelação.
- issue: Estado do espírito antes da renovação
  choice: seu espírito, já corrompido por seus atos anteriores
  alternative: seu ânimo, já abatido por suas ações passadas
  rationale: Traduz πνεῦμα como “espírito” e ἐφθαρμένον como “corrompido”, preservando a possível dimensão moral e espiritual do enunciado em vez de reduzi-lo a um estado psicológico.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural de segunda pessoa. A sintaxe foi levemente segmentada para clareza, mantendo a progressão retórica da comparação e suas imagens de deitar-se, pôr-se de pé, renovar-se e cobrar coragem.
