translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” e sintaxe natural. O contraste entre a aparência mais jovem e a carne e os cabelos mais envelhecidos foi mantido sem tentar harmonizá-lo ou explicá-lo.
