  text: But in the second vision you saw her standing, with a countenance younger and more cheerful than before, though her flesh and her hair were older. “Listen,” she says, “to this parable also.
translation:
  language: pt
  text: 'Mas, na segunda visão, você a viu de pé, com a aparência mais jovem e mais alegre do que antes, embora a carne e os cabelos estivessem mais envelhecidos. Ela diz: “Ouça também esta parábola.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψιν
  choice: aparência
  rationale: Expressa o aspecto visível da mulher sem limitar o termo apenas ao rosto, embora o semblante esteja incluído.
- source_word: ἱλαρωτέραν
  choice: mais alegre
  rationale: Transmite o aspecto contente e animado indicado pelo comparativo grego, em linguagem natural.
- source_word: σάρκα
  choice: carne
  rationale: Mantém a referência corporal concreta e o contraste com a aparência mais jovem.
- source_word: παραβολήν
  choice: parábola
  rationale: Preserva o termo tradicional para uma comparação narrativa que comunica um ensinamento.
