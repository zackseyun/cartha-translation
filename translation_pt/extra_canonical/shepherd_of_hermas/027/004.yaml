base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/004.yaml
  text: But clothe yourself with dignity, in which there is no evil stumbling block, but all things are smooth and cheerful. Do what is good, and from your labors, which God gives you, give simply to all who are in need, not hesitating as to whom you should give or to whom you should not give. Give to all, for God wants all to be given from his own gifts.
translation:
  language: pt
  text: Mas revista-se de dignidade, na qual não há obstáculo maligno, mas tudo é suave e alegre. Pratique o bem e, do fruto de seu trabalho, que Deus lhe dá, dê com simplicidade a todos os necessitados, sem hesitar sobre a quem dar ou a quem não dar. Dê a todos, pois Deus quer que, de seus próprios dons, se dê a todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδυσαι
  choice: revista-se
  rationale: Preserva a metáfora explícita de vestir-se de uma qualidade.
- source_word: σεμνότητα
  choice: dignidade
  rationale: Expressa a conduta respeitável, séria e honrada indicada pelo termo, sem sugerir apenas solenidade externa.
- source_word: πρόσκομμα
  choice: tropeço
  rationale: Mantém a imagem de um obstáculo que leva alguém a cair moralmente.
- source_word: ὁμαλὰ καὶ ἱλαρά
  choice: sereno e alegre
  rationale: Comunica uma condição sem asperezas nem perturbação e marcada por disposição jubilosa, em português natural.
- source_word: ἐργάζου τὸ ἀγαθόν
  choice: Pratique o bem
  rationale: Reproduz o imperativo contínuo de realizar aquilo que é bom.
- source_word: ἐκ τῶν κόπων σου
  choice: do fruto do seu trabalho
  rationale: Torna explícito em português natural que a oferta procede do que é obtido pelo trabalho, sem mudar o sentido contextual.
- source_word: ἁπλῶς
  choice: com simplicidade
  rationale: Preserva a ideia recorrente no Mandamento 2 de generosidade franca, sem cálculo ou duplicidade.
- source_word: ὑστερουμένοις
  choice: necessitados
  rationale: Designa os que carecem do necessário de maneira clara e corrente.
- source_word: μὴ διστάζων
  choice: sem ficar em dúvida
  rationale: Mantém o sentido de hesitar ou ficar dividido ao decidir quem deve receber.
- source_word: ἐκ τῶν ἰδίων δωρημάτων
  choice: dos dons que pertencem a ele
  rationale: Conserva a ênfase de que os recursos distribuídos são, em última análise, dons do próprio Deus.
theological_decisions:
- issue: Alcance de πᾶσιν em relação aos necessitados
  choice: Dê a todos
  alternative: Dê a todos os necessitados
  rationale: A frase preserva a formulação universal do grego, enquanto o contexto imediato já identifica como destinatários os que estão em necessidade.
- issue: Agência divina na capacidade de trabalhar e dar
  choice: do fruto do seu trabalho, que Deus lhe dá
  alternative: dos trabalhos que Deus lhe dá
  rationale: Mantém a afirmação de que Deus é a fonte do que o trabalhador possui, sem resolver além do texto se o relativo se refere ao trabalho, ao fruto ou à oportunidade de trabalhar.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A metáfora do revestimento e a repetição enfática de dar a todos foram preservadas.
