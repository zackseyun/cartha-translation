base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/005.yaml
  text: Therefore those who receive will render an account to God why they received and for what; for those who receive while afflicted will not be judged, but those who receive in hypocrisy will pay the penalty.
translation:
  language: pt
  text: Portanto, os que recebem prestarão contas a Deus do motivo por que receberam e da finalidade para a qual receberam. Pois os que recebem em aflição não serão julgados, mas os que recebem com hipocrisia sofrerão a pena.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποδώσουσιν λόγον
  choice: prestarão contas
  rationale: Expressa naturalmente em português a ideia de responder diante de Deus por seus atos.
- source_word: θλιβόμενοι
  choice: por passarem necessidade
  rationale: No contexto de dar aos necessitados, indica pessoas em aflição ou privação real, sem restringir a expressão a uma forma específica de sofrimento.
- source_word: ἐν ὑποκρίσει
  choice: com hipocrisia
  rationale: Preserva o termo e sua ambiguidade entre fingimento, falsa alegação de necessidade e motivação insincera.
- source_word: τίσουσιν δίκην
  choice: sofrerão a pena
  rationale: Reproduz a noção de pagar ou sofrer a penalidade devida em linguagem portuguesa clara e digna.
theological_decisions:
- issue: Natureza do julgamento dos necessitados que recebem
  choice: não serão julgados
  alternative: não serão condenados
  rationale: Mantém a formulação ampla de οὐ δικασθήσονται, sem resolver se o sentido é comparecer a julgamento ou receber condenação.
- issue: Sentido da recepção hipócrita
  choice: recebem com hipocrisia
  alternative: recebem sob falso pretexto
  rationale: Evita especificar que a hipocrisia consiste necessariamente em fingir necessidade, preservando a amplitude do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “receberam” foi mantida para conservar a ênfase e o paralelismo do grego.
