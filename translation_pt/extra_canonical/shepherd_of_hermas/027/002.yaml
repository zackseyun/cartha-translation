base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/002.yaml
  text: First of all, slander no one, and do not listen with pleasure to someone who slanders; otherwise you too, the hearer, will be guilty of the slanderer’s sin if you believe the slander you hear. For by believing it, you yourself also will have something against your brother. Thus you will be guilty of the slanderer’s sin.
translation:
  language: pt
  text: Antes de tudo, não fale mal de ninguém, nem ouça com prazer quem fala mal dos outros. Caso contrário, você, que ouve, também será culpado do pecado de quem fala mal, se acreditar no que ouvir. Pois, ao acreditar, você mesmo passará a ter algo contra seu irmão. Assim, será culpado do pecado de quem fala mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλάλει / καταλαλοῦντος / καταλαλίᾳ
  choice: fale mal / quem fala mal / no que ouvir
  rationale: O verbo e o substantivo referem-se à fala prejudicial contra outra pessoa, podendo abranger difamação, calúnia e maledicência. A expressão corrente «falar mal» preserva essa amplitude sem limitar o sentido a uma acusação necessariamente falsa.
- source_word: ἡδέως ἄκουε
  choice: ouça com prazer
  rationale: Mantém explicitamente a ideia de acolher ou escutar com gosto, e não apenas a de ouvir passivamente.
- source_word: ἔνοχος ἔσῃ
  choice: será culpado
  rationale: Expressa de modo natural a responsabilidade compartilhada atribuída ao ouvinte que dá crédito à fala maldosa.
- source_word: ἕξεις κατὰ τοῦ ἀδελφοῦ σου
  choice: passará a ter algo contra seu irmão
  rationale: 'Preserva a formulação elíptica do grego: o objeto de «ter» não é especificado, podendo ser uma acusação, suspeita ou disposição adversa.'
theological_decisions:
- issue: Responsabilidade do ouvinte pela fala maldosa
  choice: A culpa é condicionada a acreditar no que se ouve.
  alternative: Tratar toda audição involuntária como participação automática no pecado.
  rationale: A oração grega ἐὰν πιστεύσῃς condiciona explicitamente a culpa à aceitação crédula da fala ouvida, enquanto a proibição anterior recai sobre ouvi-la com prazer.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível tanto no Brasil como em outros contextos lusófonos. A repetição de «culpado do pecado de quem fala mal» foi preservada por seu valor enfático no original.
