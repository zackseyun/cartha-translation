base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/001.yaml
  text: 'He says to me: Have simplicity, and become guileless, and you will be like the little ones who do not know the wickedness that destroys the life of human beings.'
translation:
  language: pt
  text: 'Ele me diz: “Tenha simplicidade e torne-se sem malícia; assim você será como as criancinhas que não conhecem a maldade que destrói a vida dos seres humanos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητα
  choice: simplicidade
  rationale: Preserva o substantivo grego e seu sentido ético de sinceridade, singeleza e ausência de duplicidade.
- source_word: ἄκακος
  choice: sem malícia
  rationale: Expressa naturalmente a ideia de alguém que não abriga maldade nem dolo, sem sugerir ingenuidade intelectual.
- source_word: τὰ νήπια
  choice: as criancinhas
  rationale: Comunica o sentido de crianças pequenas e mantém a comparação com sua inocência.
- source_word: πονηρίαν
  choice: maldade
  rationale: Termo amplo que corresponde ao caráter destrutivo do mal no contexto, sem restringi-lo a uma forma específica de vício.
- source_word: τὴν ζωὴν τῶν ἀνθρώπων
  choice: a vida dos seres humanos
  rationale: Reproduz a referência genérica e inclusiva do grego a toda a humanidade.
theological_decisions:
- issue: Relação entre simplicidade, ausência de malícia e semelhança com as crianças
  choice: 'Manter a sequência de exortação e resultado: “Tenha... torne-se... assim você será...”'
  alternative: Transformar tudo em uma única ordem, como “Seja simples e inocente como as crianças”
  rationale: A formulação escolhida preserva o desenvolvimento do grego e não reduz a semelhança às crianças a uma mera reformulação dos dois imperativos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta foi marcada com aspas; “sem malícia” evita o tom excessivamente técnico de “inócuo” e a possível ambiguidade de “inocente”.
