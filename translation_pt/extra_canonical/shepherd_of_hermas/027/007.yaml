base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/007.yaml
  text: So keep this commandment, as I have spoken to you, so that your repentance and that of your household may be found in simplicity, and your heart clean and unstained.
translation:
  language: pt
  text: Portanto, guarde este mandamento, conforme lhe falei, para que o seu arrependimento e o de sua casa sejam achados em simplicidade, e para que o seu coração seja puro e sem mancha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: guarde
  rationale: Preserva a ideia de observar e cumprir continuamente o mandamento, em linguagem bíblica natural.
- source_word: μετάνοιά
  choice: arrependimento
  rationale: Expressa a mudança moral e espiritual indicada pelo termo, sem reduzir seu sentido a mero remorso.
- source_word: οἴκου
  choice: casa
  rationale: Mantém a amplitude de οἶκος, que pode abranger a família e os membros do lar.
- source_word: ἐν ἁπλότητι
  choice: em simplicidade
  rationale: 'Retoma o tema central do mandato: sinceridade, singeleza e ausência de duplicidade, preservando a formulação concisa do grego.'
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: puro e sem mancha
  rationale: Reproduz os dois qualificativos coordenados, distinguindo pureza de ausência de contaminação.
theological_decisions:
- issue: Relação entre o arrependimento do destinatário e o de sua casa
  choice: o seu arrependimento e o de sua casa
  alternative: o arrependimento de você e de sua família
  rationale: Mantém a coordenação e não sugere que o arrependimento individual seja automaticamente transferido aos demais membros da casa.
- issue: Sentido ético de ἁπλότης
  choice: simplicidade
  alternative: sinceridade
  rationale: Preserva a palavra-chave repetida ao longo do Mandato 2 e sua tensão semântica entre singeleza, generosidade e ausência de duplicidade.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “lhe/seu”. A ordem foi levemente ajustada para fluidez, sem eliminar a conexão conclusiva de οὖν nem a linguagem tradicional de “mandamento”, “arrependimento” e “sem mancha”.
