base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/006.yaml
  text: Therefore the one who gives is innocent; for just as he received from the Lord the ministry to carry out, he carried it out simply, making no distinction as to whom he should give or not give. Thus this ministry, having been carried out simply, became glorious before God. Therefore the one who thus ministers simply to God will live.
translation:
  language: pt
  text: Portanto, quem dá é inocente, pois, tal como recebeu do Senhor a incumbência de realizar esse serviço, ele a realizou com simplicidade, sem fazer distinção quanto a quem dar ou não dar. Assim, esse serviço, realizado com simplicidade, tornou-se glorioso diante de Deus. Portanto, quem serve a Deus com essa simplicidade viverá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ διδοὺς
  choice: quem dá
  rationale: Reproduz de modo natural o particípio substantivado e mantém o foco geral em qualquer pessoa que oferece ajuda.
- source_word: ἀθῷος
  choice: inocente
  rationale: Expressa que o doador não incorre em culpa pelo eventual uso indevido da dádiva por quem a recebe.
- source_word: διακονία
  choice: serviço
  rationale: Neste contexto, designa a incumbência de ajudar materialmente os necessitados; “serviço” preserva o sentido amplo sem impor um ofício eclesiástico.
- source_word: ἁπλῶς
  choice: com simplicidade
  rationale: Mantém a repetição temática de ἁπλότης no mandato e comunica uma ação franca, sem duplicidade nem cálculos discriminatórios.
- source_word: μηθὲν διακρίνων
  choice: sem fazer distinção
  rationale: Preserva a ideia de não separar ou discriminar os possíveis beneficiários, em vez de decidir quem seria digno de receber.
- source_word: ζήσεται
  choice: viverá
  rationale: Mantém o futuro simples e sua força escatológica potencial sem explicitar se se trata da vida presente ou da vida final.
theological_decisions:
- issue: Responsabilidade moral do doador
  choice: “quem dá é inocente”
  alternative: “quem dá fica isento de culpa”
  rationale: A formulação direta acompanha ἀθῷος e conserva o contraste do contexto entre a responsabilidade de quem dá e a prestação de contas de quem recebe.
- issue: Natureza do serviço recebido do Senhor
  choice: “o serviço que recebeu do Senhor”
  alternative: “o ministério que recebeu do Senhor”
  rationale: “Serviço” evita sugerir necessariamente um cargo formal e corresponde melhor à distribuição de bens tratada no contexto.
- issue: Sentido de “viverá”
  choice: manter sem qualificação
  alternative: “terá a vida eterna”
  rationale: O grego não especifica aqui a natureza da vida prometida; a tradução preserva essa abertura teológica.
translation_notes:
  register: Português moderno, digno e de leitura fluida, com repetição deliberada de “serviço” e “simplicidade” para refletir a coesão lexical do grego. A sintaxe foi levemente reorganizada para evitar a construção pesada de “recebeu o serviço para cumprir”, sem alterar a relação entre incumbência, execução e aprovação divina.
