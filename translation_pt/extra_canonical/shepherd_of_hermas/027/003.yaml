base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/003.yaml
  text: Slander is evil; it is an unsettled demon, never at peace, but always dwelling amid divisions. So keep away from it, and you will always have prosperity with all.
translation:
  language: pt
  text: A difamação é má; é um demônio inquieto, que nunca está em paz, mas vive sempre em meio a divisões. Portanto, mantenha-se longe dela, e você sempre terá bem-estar com todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλία
  choice: difamação
  rationale: Expressa a fala maliciosa contra outra pessoa e se ajusta ao contexto imediato, no qual se ouvem e se creem acusações contra um irmão.
- source_word: ἀκατάστατον
  choice: inquieto
  rationale: Conserva a ideia de instabilidade e desassossego sem sugerir apenas desorganização externa.
- source_word: δαιμόνιον
  choice: demônio
  rationale: Mantém a personificação forte e explícita do texto grego, sem reduzi-la a mera metáfora abstrata.
- source_word: ἐν διχοστασίαις
  choice: em meio a divisões
  rationale: Traduz o sentido de dissensões, discórdias e rupturas entre pessoas em linguagem natural.
- source_word: εὐθηνίαν
  choice: bem-estar
  rationale: O termo pode indicar prosperidade ou boa condição; 'bem-estar' preserva a amplitude e se encaixa naturalmente na relação 'com todos'.
theological_decisions:
- issue: A caracterização da difamação como δαιμόνιον
  choice: Traduzir literalmente como 'demônio'
  alternative: Entender como figura para uma influência ou disposição demoníaca
  rationale: O grego emprega diretamente o substantivo 'demônio'; a tradução conserva essa afirmação sem explicar se é ontológica ou personificadora.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. O pronome em 'dela' retoma 'difamação', enquanto 'demônio' preserva a imagem masculina do predicativo sem comprometer a fluidez.
