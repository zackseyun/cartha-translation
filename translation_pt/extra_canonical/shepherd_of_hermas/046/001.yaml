  text: 'But I, the angel of repentance, say to you: do not fear the devil. For I was sent," he says, "to be with you who are repenting with all your heart and to streng—'
translation:
  language: pt
  text: 'Mas eu, o anjo do arrependimento, digo a vocês: não tenham medo do diabo. Pois fui enviado, diz ele, para estar com vocês, os que se arrependem de todo o coração, e para fortale—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A fonte grega fornecida se interrompe no meio da palavra ἰσχυρο-, aqui representada por “fortale—”.
    reason: Sinalizar com transparência que o segmento e a própria palavra estão incompletos, sem reconstruir o restante a partir de uma fonte não apresentada.
lexical_decisions:
- source_word: μετάνοια / μετανοούντων
  choice: arrependimento / os que se arrependem
  rationale: Expressa, em português corrente, a mudança interior e o abandono do erro implicados pelo termo grego, preservando também a repetição lexical do original.
- source_word: μὴ φοβήθητε
  choice: não tenham medo
  rationale: Forma natural e direta para a proibição no aoristo subjuntivo, dirigida a um grupo.
- source_word: ἐξ ὅλης καρδίας αὐτῶν
  choice: de todo o coração
  rationale: Mantém o idiomatismo bíblico de entrega ou sinceridade integral; a passagem à segunda pessoa acompanha o discurso direto e evita o pouco natural 'coração deles' após 'vocês'.
- source_word: ἰσχυρο-
  choice: fortale—
  rationale: A fonte fornecida termina no início de uma palavra; esta restituição apenas indica a direção lexical provável sem completar material ausente.
theological_decisions:
- issue: Identidade e fala do anjo do arrependimento
  choice: Manter 'eu, o anjo do arrependimento' e o inciso 'diz ele'
  alternative: Harmonizar a voz narrativa ou omitir o inciso como redundante
  rationale: O grego preserva uma alternância de enquadramento entre discurso direto e inciso narrativo; a tradução não a resolve silenciosamente.
- issue: Natureza do arrependimento
  choice: Traduzir μετανοούντων por 'os que se arrependem'
  alternative: '''os penitentes'' ou ''os que fazem penitência'''
  rationale: Evita importar uma prática penitencial denominacional específica e conserva o sentido verbal amplo do grego.
translation_notes:
  register: Português moderno, digno e acessível, com 'vocês' para legibilidade ampla no Brasil. Conservou-se a interrupção material do texto-fonte e a mudança de enquadramento em 'diz ele'.
