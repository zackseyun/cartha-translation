  terminology: «Arrependimento» / «os que se arrependem» traduzem μετάνοια / μετανοούντων de modo amplo e não confessional. «Diabo» é a equivalência corrente de διάβολος. «Anjo do arrependimento» conserva a designação textual sem interpretação adicional.
