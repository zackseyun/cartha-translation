review_pass:
  verdict: approve
  source_fidelity: A tradução preserva com precisão o imperativo singular καθάρισον (“purifique-se”), a qualificação explícita da tristeza como πονηρά (“maligna”), a promessa ζήσῃ/ζήσονται τῷ θεῷ (“viverá/viverão para Deus”) e a dupla imagem de descartar a tristeza e revestir-se de alegria. A formulação coletiva final comunica adequadamente o valor de πάντες ... ὅσοι ἄν.
  naturalness: O português é claro, moderno e de registro adequadamente solene. “Lançarem para longe de si” é um pouco mais formal, mas é natural o bastante e conserva a força imagética de ἀποβάλωσιν ἀφ᾿ ἑαυτῶν. A repetição de “viverão para Deus” é justificadamente mantida, como no grego.
  terminology: “Tristeza maligna” reproduz a avaliação moral de λύπης τῆς πονηρᾶς sem ampliar indevidamente o enunciado a toda tristeza. “Revestirem de toda alegria” mantém a metáfora de ἐνδύσωνται e é terminologicamente apropriado para ἱλαρότης neste contexto.
