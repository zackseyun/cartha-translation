base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/004.yaml
  text: Cleanse yourself, then, from this evil sorrow, and you will live to God; and all will live to God, as many as cast off sorrow from themselves and clothe themselves with all cheerfulness.
translation:
  language: pt
  text: Portanto, purifique-se dessa tristeza maligna, e você viverá para Deus. E todos os que lançarem para longe de si a tristeza e se revestirem de toda alegria viverão para Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάρισον
  choice: purifique-se
  rationale: Preserva o imperativo de limpeza moral e espiritual, em linguagem natural e digna.
- source_word: λύπης τῆς πονηρᾶς
  choice: tristeza maligna
  rationale: Mantém tanto o sentido de tristeza/aflição quanto sua qualificação moral explícita no grego.
- source_word: ζήσῃ τῷ θεῷ
  choice: viverá para Deus
  rationale: Reproduz a construção dativa sem decidir de modo excessivo entre viver para Deus, diante de Deus ou em relação a Deus.
- source_word: ἀποβάλωσιν ἀφ᾿ ἑαυτῶν
  choice: lançarem para longe de si
  rationale: Expressa com força a imagem de remover ou descartar algo de si mesmo.
- source_word: ἐνδύσωνται πᾶσαν ἱλαρότητα
  choice: se revestirem de toda alegria
  rationale: Preserva a metáfora de vestir-se e traduz ἱλαρότης como uma disposição alegre, em continuidade com a seção.
theological_decisions:
- issue: Sentido de ζῆν τῷ θεῷ
  choice: viver para Deus
  alternative: viver diante de Deus / viver em Deus
  rationale: A formulação conserva a orientação relacional do dativo e acompanha o uso cristão antigo sem impor uma explicação doutrinária específica.
- issue: Caracterização moral da tristeza
  choice: tristeza maligna
  alternative: tristeza má / tristeza perniciosa
  rationale: O texto qualifica esta tristeza específica como πονηρά; a tradução não generaliza toda tristeza como moralmente má.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “viverão para Deus” e a metáfora de revestir-se foram preservadas. “Dessa tristeza maligna” remete à tristeza específica condenada no contexto, evitando uma afirmação indiscriminada sobre toda experiência de tristeza.
