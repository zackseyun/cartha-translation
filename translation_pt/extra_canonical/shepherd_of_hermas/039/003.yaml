base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/003.yaml
  text: “Why,” I ask, “does the prayer of the one who is sorrowing not ascend to the altar?” “Because,” he says, “sorrow has settled in his heart. Therefore sorrow, mixed with the prayer, does not allow the prayer to ascend pure to the altar. For just as vinegar and wine, mixed together, do not have the same pleasantness, so also sorrow, mixed with the Holy Spirit, does not have the same prayer.”
translation:
  language: pt
  text: '“Por que”, perguntei, “a oração de quem está triste não sobe ao altar?” Ele respondeu: “Porque a tristeza se instalou no coração dessa pessoa. Assim, misturada à oração, a tristeza não permite que a oração suba pura ao altar. Pois, assim como o vinagre e o vinho, quando misturados, não têm o mesmo sabor agradável, também a tristeza, misturada com o Espírito Santo, não tem a mesma oração.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “também a tristeza, misturada ao Espírito Santo, não tem a mesma oração”. A construção grega é deliberadamente compacta e incomum; o texto mantém essa formulação sem explicar de que modo a tristeza se relaciona com a oração.'
    reason: Preserva a dificuldade sintática e semântica da frase final, sem introduzir uma explicação doutrinária ou causal não explicitada no original.
lexical_decisions:
- source_word: ἔντευξις
  choice: oração
  rationale: No contexto, designa a oração ou súplica dirigida ao Senhor; “oração” é natural e preserva a conexão repetida do termo ao longo do parágrafo.
- source_word: λύπη / λυπουμένου
  choice: tristeza / quem está triste
  rationale: Mantém o campo semântico afetivo do grego e evita termos mais interpretativos, como “desânimo” ou “melancolia”.
- source_word: ἐγκάθηται
  choice: se instalou
  rationale: Expressa a ideia de a tristeza estar assentada e alojada no coração, em português corrente e vívido.
- source_word: ἡδονή
  choice: sabor agradável
  rationale: Na comparação entre vinho e vinagre, o sentido é o prazer proporcionado ao paladar; a formulação torna a imagem clara sem perder seu valor sensorial.
theological_decisions:
- issue: Relação entre tristeza, Espírito Santo e oração na frase final
  choice: “já não produz a mesma oração”
  alternative: “não tem a mesma oração”
  rationale: O grego é sintaticamente incomum e afirma literalmente que a tristeza misturada ao Espírito Santo “não tem a mesma oração”. A redação principal comunica o efeito descrito sem sugerir que o Espírito Santo em si seja corrompido; a nota registra a forma mais literal e preserva a tensão do texto.
- issue: Pureza da oração que sobe ao altar
  choice: “não permite que a oração suba pura até o altar”
  alternative: “impede a oração pura de subir até o altar”
  rationale: A escolha segue a estrutura grega, na qual a tristeza impede que a oração ascenda em estado de pureza, sem acrescentar uma explicação doutrinária sobre o mecanismo da oração.
translation_notes:
  register: Português moderno, digno e acessível, com diálogo natural. A repetição de “oração” e “tristeza” foi mantida por ser estrutural no argumento. Evitou-se linguagem denominacional e conservou-se a imagem cultual do altar.
