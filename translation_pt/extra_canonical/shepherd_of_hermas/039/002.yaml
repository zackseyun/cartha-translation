revisions:
- from: Mas o homem triste sempre age perversamente. Em primeiro lugar, age perversamente porque entristece o Espírito Santo, que foi dado ao ser humano cheio de alegria. Em segundo lugar, ao entristecer o Espírito Santo, pratica a iniquidade, pois não ora nem se confessa ao Senhor.[a] De fato, a súplica de um homem triste jamais tem força para subir até o altar de Deus.
  to: Mas o homem triste sempre faz o mal. Em primeiro lugar, faz o mal porque entristece o Espírito Santo, dado alegre ao ser humano. Em segundo lugar, ao entristecer o Espírito Santo, pratica a iniquidade, pois não faz súplicas nem confessa ao Senhor.[a] De fato, a súplica de um homem triste jamais tem força para subir até o altar de Deus.
  rationale: A revisão substitui a expressão mais ampla “ora” por “faz súplicas”, em correspondência com ἐντυγχάνω e ἔντευξις, e ajusta discretamente a construção referente ao Espírito alegre. Mantém-se a nota para não eliminar a ambiguidade semântica de ἐξομολογούμενος.
