  naturalness: A redação revista mantém português moderno e digno. “Fazer súplicas” torna explícito o valor cultual de ἐντυγχάνω sem introduzir uma interpretação doutrinária.
  terminology: “Faz o mal” é uma forma natural e repetível para πονηρεύεται. “Iniquidade” para ἀνομία e “súplica” para ἔντευξις são adequados ao registro do texto. A nota conserva a amplitude de ἐξομολογέομαι.
