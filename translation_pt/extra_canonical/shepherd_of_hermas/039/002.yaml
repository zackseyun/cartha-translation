base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/002.yaml
  text: 'But the sorrowful man always acts wickedly: first, he acts wickedly because he grieves the Holy Spirit that was given to the human being as cheerful; second, by grieving the Holy Spirit he works lawlessness, neither praying nor confessing to the Lord. For the prayer of a sorrowful man never has power to ascend to the altar of God.'
translation:
  language: pt
  text: Mas o homem triste sempre faz o mal. Em primeiro lugar, faz o mal porque entristece o Espírito Santo, dado alegre ao ser humano. Em segundo lugar, ao entristecer o Espírito Santo, pratica a iniquidade, pois não faz súplicas nem confessa ao Senhor.[a] De fato, a súplica de um homem triste jamais tem força para subir até o altar de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego também pode significar “louva o Senhor” ou “dá graças ao Senhor”.
    reason: ἐξομολογέομαι possui amplitude semântica cultual e pode indicar confissão, louvor ou ação de graças.
lexical_decisions:
- source_word: λυπηρὸς ἀνήρ
  choice: o homem triste
  rationale: Mantém a imagem e a repetição do texto grego; aqui a tristeza é apresentada como uma disposição interior que interfere na conduta e na oração.
- source_word: πονηρεύεται
  choice: age perversamente
  rationale: Expressa uma conduta moralmente má e preserva a repetição enfática da forma verbal no grego.
- source_word: ἀνομίαν ἐργάζεται
  choice: pratica a iniquidade
  rationale: Reproduz de modo natural a ideia de agir contra a lei ou vontade divina, sem reduzir o termo a uma infração civil.
- source_word: ἐντυγχάνων / ἔντευξις
  choice: ora / súplica
  rationale: O contexto trata da oração que sobe ao altar de Deus; “súplica” conserva o sentido de petição ou intercessão de ἔντευξις.
- source_word: ἱλαρόν
  choice: cheio de alegria
  rationale: O adjetivo está gramaticalmente ligado ao Espírito dado ao ser humano; esta formulação comunica a qualidade positiva do Espírito sem sugerir mera comicidade.
theological_decisions:
- issue: O referente de ἱλαρόν em τὸ πνεῦμα τὸ ἅγιον τὸ δοθὲν τῷ ἀνθρώπῳ ἱλαρόν
  choice: “o Espírito Santo, que foi dado ao ser humano cheio de alegria”
  alternative: “o Espírito Santo, que foi dado alegre ao ser humano”
  rationale: Mantém ἱλαρόν ligado ao Espírito, como indica a concordância neutra, mas usa uma construção portuguesa mais digna e natural.
- issue: Sentido religioso de ἐξομολογούμενος τῷ κυρίῳ
  choice: “se confessa ao Senhor”, com nota
  alternative: “louva o Senhor” ou “dá graças ao Senhor”
  rationale: O verbo pode designar confissão, reconhecimento, louvor ou ação de graças. A tradução principal retém o sentido mais direto, e a nota preserva a amplitude sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição retórica do original foi preservada, assim como a linguagem cultual da súplica que sobe ao altar de Deus.
