base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/001.yaml
  text: Clothe yourself, then, with cheerfulness, which always has favor with God and is acceptable to him, and delight in it. For every cheerful man does good, thinks good things, and despises sorrow.
translation:
  language: pt
  text: Revista-se, portanto, de alegria, que sempre encontra favor diante de Deus e lhe é agradável, e deleite-se nela. Pois toda pessoa alegre pratica o bem, pensa no que é bom e despreza a tristeza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱλαρότητα / ἱλαρός
  choice: alegria / alegre
  rationale: Expressa de modo natural a disposição jubilosa e bem-humorada indicada pelo grego, mantendo a repetição lexical.
- source_word: ἔνδυσαι
  choice: Revista-se
  rationale: Preserva a metáfora concreta de vestir-se de uma disposição.
- source_word: χάριν παρὰ τῷ θεῷ
  choice: favor diante de Deus
  rationale: Conserva a ideia relacional de obter favor na presença de Deus sem restringir χάρις a um sentido doutrinário posterior.
- source_word: ἐντρύφα ἐν αὐτῇ
  choice: deleite-se nela
  rationale: Mantém o sentido forte de desfrutar e ter prazer nessa alegria.
- source_word: ἀγαθὰ φρονεῖ
  choice: pensa no que é bom
  rationale: Reproduz o conteúdo moral do plural substantivado sem tornar a frase artificial em português.
- source_word: καταφρονεῖ τῆς λύπης
  choice: despreza a tristeza
  rationale: Mantém a força e a tensão do verbo grego, em vez de suavizá-lo para 'vence' ou 'não se deixa dominar'.
theological_decisions:
- issue: Sentido de χάρις na aceitação divina
  choice: favor diante de Deus
  alternative: graça de Deus
  rationale: O contexto fala da aprovação e acolhida por Deus; 'favor' evita importar uma formulação soteriológica mais específica.
- issue: Referência genérica de πᾶς ἱλαρὸς ἀνήρ
  choice: toda pessoa alegre
  alternative: todo homem alegre
  rationale: Aqui ἀνήρ funciona genericamente; 'pessoa' comunica essa abrangência em português atual sem alterar o alcance do enunciado.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Conserva a metáfora de vestir-se, a repetição ligada à alegria e a formulação incisiva sobre desprezar a tristeza.
