base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/006.yaml
  text: 6. The stones hauled up from the deep they set, every one, into the building just as they were; for they were fitted and matched the joining with the other stones, and so were joined to one another, so that their joint was not visible. The construction of the tower appeared as if it had been built from a single stone.
translation:
  language: pt
  text: 6. Todas as pedras puxadas das profundezas eram assentadas na construção tal como estavam, pois já estavam ajustadas e se encaixavam com as outras pedras. Assim, uniam-se umas às outras de tal modo que a junção entre elas não ficava visível. A construção da torre parecia ter sido feita de uma só pedra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ βυθοῦ
  choice: das profundezas
  rationale: Preserva a ideia de uma região aquática profunda, coerente com a torre construída sobre as águas, sem restringir indevidamente o termo a uma forma específica como 'fundo do mar'.
- source_word: ἑλκομένους
  choice: retiradas
  rationale: Expressa de modo natural em português o movimento de pedras puxadas ou içadas das profundezas.
- source_word: ἡρμοσμένοι
  choice: já se encaixavam
  rationale: Comunica que as pedras se encontravam previamente ajustadas para a construção.
- source_word: συνεφώνουν τῇ ἁρμογῇ
  choice: suas junções coincidiam
  rationale: Mantém a imagem concreta de correspondência e ajuste entre as juntas das pedras.
- source_word: ἐκολλῶντο ἀλλήλοις
  choice: ligavam-se umas às outras
  rationale: Reproduz a união estreita sem sugerir necessariamente o uso literal de cola ou argamassa.
- source_word: ἡ ἁρμογὴ
  choice: a emenda
  rationale: Em português corrente, 'emenda' descreve com clareza a linha de união que deixa de ser visível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia concreta de construção. A tradução conserva a força simbólica da perfeita unidade das pedras sem explicitar sua interpretação alegórica.
