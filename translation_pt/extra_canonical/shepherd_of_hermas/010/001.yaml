base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/001.yaml
  text: '1. “What,” I said, “did they endure?” She says, “Listen: scourges, imprisonments, great afflictions, crosses, wild beasts—for the sake of the Name. For this reason the right-hand parts of the sanctuary belong to them, and to whoever suffers because of the Name; but the left-hand parts belong to the rest. Yet for both, those sitting on the right and those on the left, the gifts are the same and the promises the same—only those on the right sit there and have some glory.”'
translation:
  language: pt
  text: '1. “O que foi que eles suportaram?”, perguntei. Ela respondeu: “Escute: açoites, prisões, grandes aflições, cruzes e feras selvagens — por causa do Nome.[a] Por isso, os lugares à direita do santuário pertencem a eles e a todo aquele que sofrer por causa do Nome; os lugares à esquerda, porém, pertencem aos demais. Mas tanto os que estão sentados à direita como os que estão à esquerda recebem os mesmos dons e as mesmas promessas; somente eles se sentam à direita e têm certa glória.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Nome” é uma forma reverente que pode referir-se a Cristo ou à confissão de seu nome; o grego não explicita o referente.
    reason: Preserva a formulação absoluta e a ambiguidade genuína do original, ao mesmo tempo que orienta o leitor moderno.
lexical_decisions:
- source_word: ὑπήνεγκαν
  choice: suportaram
  rationale: Expressa naturalmente a ideia de aguentar ou padecer provações, sem restringir o termo a um tipo específico de sofrimento.
- source_word: μάστιγας
  choice: açoites
  rationale: Mantém o sentido concreto de castigos por flagelação e o registro histórico do texto.
- source_word: φυλακάς
  choice: prisões
  rationale: No contexto de perseguição, o plural indica encarceramentos ou experiências de prisão, não guardas ou vigilâncias.
- source_word: σταυρούς
  choice: cruzes
  rationale: Preserva o plural concreto e a possível referência a execuções ou sofrimentos por crucificação.
- source_word: θηρία
  choice: feras selvagens
  rationale: Torna explícito o sentido de animais ferozes, provavelmente no contexto de suplícios públicos.
- source_word: τὸ ὄνομα
  choice: o Nome
  rationale: A forma definida e absoluta funciona como designação reverente de Cristo ou da confissão cristã; a inicial maiúscula sinaliza esse uso sem inserir um referente ausente do grego.
- source_word: τὰ δεξιὰ μέρη τοῦ ἁγιάσματος
  choice: os lugares à direita do santuário
  rationale: ‘Lugares’ soa mais natural que ‘partes’ para posições destinadas a pessoas, enquanto ‘santuário’ preserva a referência espacial sagrada de ἁγίασμα.
- source_word: δόξαν τινά
  choice: certa glória
  rationale: Conserva a indefinição de τινά e evita ampliar a distinção de honra afirmada pelo texto.
theological_decisions:
- issue: Identidade do ‘Nome’
  choice: Manter ‘o Nome’, com inicial maiúscula e nota explicativa
  alternative: Traduzir ‘o nome de Cristo’ ou ‘o nome do Senhor’
  rationale: O grego não explicita o portador do nome. A tradução preserva a expressão cristã primitiva e sua concisão teológica sem completar silenciosamente o referente.
- issue: Relação entre mártires e os demais
  choice: Preservar simultaneamente a igualdade de dons e promessas e a glória particular dos que sofreram
  alternative: Harmonizar a passagem eliminando ou acentuando uma das distinções
  rationale: 'O texto mantém uma tensão deliberada: a promessa é comum, mas os sofredores pelo Nome recebem posição de honra à direita.'
- issue: Alcance de ὃς ἐὰν πάθῃ
  choice: ‘a todo aquele que sofrer’
  alternative: ‘a todo mártir’
  rationale: A formulação aberta do grego inclui qualquer pessoa que venha a sofrer por causa do Nome e não deve ser reduzida tecnicamente ao martírio fatal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O diálogo foi pontuado de modo corrente; termos concretos de perseguição foram preservados, e a repetição estrutural entre direita e esquerda foi mantida para conservar o contraste do original.
