base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/002.yaml
  text: 2. “But you are eager to sit on the right with them; yet your shortcomings are many. Still, you will be cleansed from your shortcomings, and all who are not double-minded will be cleansed from all their sins up to this day.”
translation:
  language: pt
  text: 2. “Você deseja muito sentar-se à direita com eles, mas suas deficiências são muitas. Contudo, você será purificado de suas deficiências; e todos os que não têm o coração dividido também serão purificados de todos os pecados que cometeram até este dia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεπίθυμος
  choice: deseja muito
  rationale: Expressa de modo natural a intensidade enfática do desejo indicada pelo composto grego.
- source_word: τὰ ὑστερήματά σου
  choice: suas deficiências
  rationale: Preserva o sentido amplo de faltas, insuficiências ou aspectos em que a pessoa fica aquém, sem reduzi-lo automaticamente a 'pecados'.
- source_word: διψυχοῦντες
  choice: os que não têm o coração dividido
  rationale: Comunica a ideia de lealdade ou disposição interior dividida, mais claramente que o pouco usual 'ânimo dobre'.
- source_word: τῶν ἁμαρτημάτων
  choice: dos pecados que cometeram
  rationale: O substantivo denota atos pecaminosos ou transgressões; a formulação evita a leitura temporal equivocada de que a purificação só alcançaria pecados existentes até certa data.
theological_decisions:
- issue: Relação entre purificação e ausência de coração dividido
  choice: 'Manter a declaração futura e a condição descritiva do texto: todos os que não têm o coração dividido serão purificados.'
  alternative: Explicitar uma doutrina posterior de arrependimento, graça ou mérito.
  rationale: O grego faz uma afirmação direta, sem explicar aqui o mecanismo teológico da purificação; a tradução não deve preencher essa lacuna.
- issue: Alcance temporal de εἰς ταύτην τὴν ἡμέραν
  choice: Ligar a expressão aos pecados cometidos até este dia.
  alternative: Traduzir como purificação realizada ou válida 'neste dia'.
  rationale: A posição final permite alguma tensão sintática, mas o contexto e a formulação favorecem o alcance retrospectivo dos pecados. A redação portuguesa torna essa leitura inteligível sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e sem coloquialismo excessivo. A distinção lexical entre 'deficiências' (ὑστερήματα) e 'pecados' (ἁμαρτήματα) foi preservada.
