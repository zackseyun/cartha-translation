base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/003.yaml
  text: 3. After she had said these things, she wanted to depart; but I fell at her feet and asked her by the Lord to show me the vision that she had promised me.
translation:
  language: pt
  text: 3. Depois de dizer essas coisas, ela quis ir embora; mas caí aos pés dela e lhe pedi, pelo Senhor, que me mostrasse a visão que havia prometido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπελθεῖν
  choice: ir embora
  rationale: Expressa de modo natural em português a intenção de partir, sem acrescentar destino ou motivo.
- source_word: πεσὼν ... πρὸς τοὺς πόδας
  choice: me prostrei aos pés dela
  rationale: Reproduz o gesto de cair diante dos pés em linguagem portuguesa digna e corrente.
- source_word: ἠρώτησα
  choice: lhe pedi
  rationale: Neste contexto, o verbo significa fazer um pedido ou súplica, e não simplesmente formular uma pergunta.
- source_word: κατὰ τοῦ Κυρίου
  choice: pelo Senhor
  rationale: Preserva a fórmula de apelo solene ao Senhor sem especificar além do que o grego permite.
- source_word: ἐπιδείξῃ
  choice: me mostrasse
  rationale: Equivalente direto e natural para o pedido de que a visão fosse apresentada ao narrador.
theological_decisions:
- issue: Sentido da fórmula κατὰ τοῦ Κυρίου
  choice: pelo Senhor
  alternative: em nome do Senhor
  rationale: A expressão funciona como apelo solene ou adjuração. “Pelo Senhor” conserva essa força e evita transformar explicitamente a fórmula em uma ação feita “em nome” dele.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. Mantém o contraste marcado por δέ e o tom reverente do apelo.
source_grounding:
  english_pob_role: consult_only
