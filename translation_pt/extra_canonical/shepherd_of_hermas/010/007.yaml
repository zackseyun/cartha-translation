  text: 7. But of the other stones being brought from the dry land, some they were rejecting, and some they were putting into the building; others they were cutting and throwing far from the tower.
translation:
  language: pt
  text: 7. Quanto às outras pedras trazidas da terra firme, algumas eles rejeitavam, outras colocavam na construção; e ainda outras cortavam em pedaços e lançavam para longe da torre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξηρά
  choice: terra seca
  rationale: Reproduz o contraste do contexto com as pedras retiradas das profundezas das águas, sem restringir o termo a um sentido técnico.
- source_word: ἀπέβαλλον
  choice: rejeitavam
  rationale: Expressa a recusa das pedras para uso na construção.
- source_word: κατέκοπτον
  choice: quebravam em pedaços
  rationale: Comunica o sentido intensivo de cortar ou despedaçar, de modo natural em português para pedras.
- source_word: οἰκοδομή
  choice: construção
  rationale: Refere-se à estrutura do torreão em processo de edificação, com formulação corrente e clara.
