base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/009.yaml
  text: 9. And I saw other stones being thrown far from the tower and coming into the road, and not remaining in the road but rolling into the wasteland; others falling into fire and being burned; others falling near waters and not being able to roll into the water, though they wanted to roll and come into the water.
translation:
  language: pt
  text: 9. Vi também outras pedras sendo lançadas para longe da torre e chegando ao caminho; mas não permaneciam no caminho e rolavam para uma região sem caminhos. Outras caíam no fogo e eram queimadas. Outras caíam perto das águas e não conseguiam rolar para dentro da água, embora quisessem rolar e entrar nela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοδίαν
  choice: um lugar sem caminho
  rationale: O termo contrasta diretamente com ὁδός, “caminho”, e designa terreno sem via ou rumo. A formulação preserva o contraste lexical e evita especificar, sem necessidade, “deserto” ou “ermo”.
- source_word: ὕδωρ / ὑδάτων
  choice: água / águas
  rationale: Mantém a imagem aquática do grego; a primeira ocorrência permanece no plural, enquanto as referências seguintes seguem o singular do texto-fonte.
- source_word: καιομένους
  choice: eram queimadas
  rationale: Reproduz o particípio passivo e não acrescenta a ideia de destruição completa.
theological_decisions:
- issue: Sentido simbólico das pedras e de seus destinos
  choice: Manter apenas a descrição visionária, sem explicá-la neste segmento
  alternative: Inserir termos interpretativos como pessoas desviadas, condenação ou batismo
  rationale: O trecho apresenta imagens cujo significado é desenvolvido no contexto posterior; antecipar uma interpretação eliminaria a abertura simbólica do relato.
- issue: Possível simbolismo da água
  choice: Traduzir literalmente como “água”, sem qualificá-la
  alternative: Traduzir ou glosar como “água do batismo” ou “salvação”
  rationale: O grego não explicita aqui a identificação teológica da água.
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa. Conservou-se a repetição de “rolar”, importante para a progressão visual do grego, e o contraste entre “caminho” e “lugar sem caminho”.
