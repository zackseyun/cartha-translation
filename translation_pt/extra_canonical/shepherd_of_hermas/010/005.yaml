base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/005.yaml
  text: 5. The tower was being built in a square by the six young men who had come with her; and myriads of other men were bringing stones, some from the deep and others from the land, and were handing them to the six young men. They would take them and build.
translation:
  language: pt
  text: 5. A torre estava sendo construída em formato quadrado pelos seis jovens que tinham vindo com ela; e miríades de outros homens traziam pedras, alguns das profundezas e outros da terra, e as entregavam aos seis jovens. Eles as recebiam e construíam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τετραγώνῳ
  choice: em forma quadrada
  rationale: Expressa naturalmente a forma ou planta quadrangular da torre, sem sugerir que ela estivesse dentro de um quadrado.
- source_word: μυριάδες ἀνδρῶν
  choice: muitos milhares de outros homens
  rationale: Preserva a ideia de uma multidão numerosa; neste contexto, μυριάδες é melhor entendido como quantidade vastíssima, não necessariamente uma contagem exata de dezenas de milhares.
- source_word: ἐκ τοῦ βυθοῦ
  choice: das profundezas
  rationale: Mantém a imagem espacial do grego e sua possível referência às profundezas das águas, sem explicitar além do que este versículo afirma.
- source_word: ἐκ τῆς γῆς
  choice: da terra
  rationale: Tradução direta que preserva o contraste com as profundezas.
- source_word: ᾠκοδόμουν
  choice: prosseguiam com a construção
  rationale: Evita o objeto pronominal potencialmente ambíguo de 'as construíam' e comunica a ação contínua de edificar a torre com as pedras.
