base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/008.yaml
  text: 8. Many other stones lay around the tower, and they were not using them for the building—for some of them were scabby, others had cracks, others were mutilated, others were white and round, not fitting for the building.
translation:
  language: pt
  text: 8. Muitas outras pedras estavam ao redor da torre, e não as usavam na construção; algumas delas estavam cobertas de crostas, outras tinham rachaduras, outras estavam mutiladas, e outras eram brancas e redondas, não se ajustando à construção.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: cobertas de crostas
  rationale: Expressa a imagem de uma superfície afetada por crostas ou aspereza, evitando o termo clínico e potencialmente enganoso “sarnentas”.
- source_word: σχισμὰς ἔχοντες
  choice: tinham rachaduras
  rationale: Reproduz de modo natural e concreto a ideia de pedras fendidas.
- source_word: κεκολοβωμένοι
  choice: estavam mutiladas
  rationale: Preserva a força do particípio, que indica pedras truncadas, incompletas ou com partes removidas.
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: sem se ajustarem à construção
  rationale: Mantém tanto a inadequação de forma quanto a impossibilidade de encaixe no edifício.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imagens concretas preservadas. A repetição de “outras” acompanha a enumeração grega sem tornar a frase artificial.
