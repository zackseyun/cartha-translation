base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/004.yaml
  text: 4. And again she took hold of my hand, raised me up, and seated me on the bench on the left; and she herself sat on the right. And, lifting up a certain bright rod, she says to me, “Do you see a great thing?” I say to her, “Lady, I see nothing.” She says to me, “[You,] look—do you not see opposite you a great tower being built upon the waters with square, shining stones?”
translation:
  language: pt
  text: '4. Então ela tornou a me tomar pela mão, levantou-me e fez-me sentar no banco, à esquerda; ela mesma sentou-se à direita. Depois, erguendo uma vara brilhante, disse-me: “Você vê uma grande coisa?” Respondi: “Senhora, não vejo nada.” Ela me disse: “Olhe! Você não vê diante de você uma grande torre sendo construída sobre as águas, com pedras quadradas e brilhantes?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμπλέσιον
  choice: banco
  rationale: No contexto da visão, designa o assento em que Hermas e a Senhora se sentam; “banco” é natural e concreto em português.
- source_word: ἐξ εὐωνύμων
  choice: à esquerda
  rationale: Expressa claramente a posição de Hermas no lado esquerdo, em contraste com a Senhora à direita.
- source_word: ῥάβδον τινα λαμπράν
  choice: uma vara brilhante
  rationale: Preserva o objeto indefinido e seu aspecto luminoso sem acrescentar função ou simbolismo ausente no grego.
- source_word: μέγα πρᾶγμα
  choice: algo grandioso
  rationale: Reproduz a pergunta de modo natural, mantendo a amplitude semântica de πρᾶγμα e a qualidade de μέγα.
- source_word: κατέναντί σου
  choice: diante de si
  rationale: Indica que a torre está diretamente à frente de Hermas, em registro corrente e digno.
- source_word: ἐπὶ ὑδάτων
  choice: sobre as águas
  rationale: Mantém a imagem espacial do grego e o plural de ὕδατα.
- source_word: λίθοις τετραγώνοις λαμπροῖς
  choice: com pedras quadradas e brilhantes
  rationale: Conserva tanto a forma quanto o brilho das pedras e entende o dativo como material empregado na construção.
theological_decisions:
- issue: Possível simbolismo da direita, da esquerda, da vara, da torre e das águas
  choice: Manter apenas as imagens e posições explícitas no texto
  alternative: Explicar ou interpretar seus significados dentro da tradução
  rationale: Esta unidade narra a visão, mas ainda não oferece sua interpretação; antecipá-la resolveria indevidamente a tensão simbólica.
- issue: Leitura textual [Σὺ] antes de ἰδού
  choice: Não representar “você” como vocativo independente; traduzir a exortação simplesmente por “Olhe!”
  alternative: “Você, olhe!” ou nota textual
  rationale: O pronome está entre colchetes na edição, indicando incerteza editorial, e é dispensável para o sentido; a exortação ἰδού é transmitida naturalmente por “Olhe!”.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A narração preserva a alternância verbal do original sem rigidez artificial; o diálogo usa “você” por clareza contemporânea e mantém “Senhora” como tratamento respeitoso. Não foram necessárias notas de rodapé.
