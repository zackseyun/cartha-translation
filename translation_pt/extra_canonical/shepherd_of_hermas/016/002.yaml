  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/002.yaml
  text: Looking at me, she smiled and says to me, “Do you see seven women around the tower?” “I do, lady,” I said. “This tower is supported by these women at the Lord’s command.
translation:
  language: pt
  text: 'Ela olhou para mim, sorriu levemente e me disse: “Você vê sete mulheres ao redor da torre?” “Vejo, senhora”, respondi. “Esta torre é sustentada por elas, por ordem do Senhor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασά μοι
  choice: Ela olhou para mim
  rationale: Expressa de modo natural o olhar direto e atento indicado pelo particípio grego.
- source_word: ὑπεμειδίασεν
  choice: sorriu levemente
  rationale: O verbo sugere um sorriso discreto; o advérbio preserva essa nuance.
- source_word: κυρία
  choice: senhora
  rationale: Mantém a forma respeitosa de tratamento sem lhe atribuir um título teológico.
- source_word: κύκλῳ τοῦ πύργου
  choice: ao redor da torre
  rationale: Equivalente idiomático e claro para a relação espacial do grego.
- source_word: ὑπὸ τούτων βαστάζεται
  choice: é sustentada por elas
  rationale: Preserva a voz passiva e a imagem de as mulheres sustentarem a torre.
- source_word: κατ’ ἐπιταγὴν τοῦ Κυρίου
  choice: por ordem do Senhor
  rationale: Traduz diretamente a ideia de mandato ou ordem, mantendo Κυρίου como título.
theological_decisions:
- issue: Natureza do sustento da torre pelas sete mulheres
  choice: é sustentada por elas
  alternative: é carregada por elas
  rationale: “Sustentada” conserva a imagem simbólica sem definir se o apoio é físico, estrutural ou espiritual.
translation_notes:
  register: Português moderno, claro e digno, com diálogo natural e preservação da imagética simbólica. O presente narrativo de λέγει foi vertido no passado para fluidez narrativa em português, sem alterar o conteúdo.
