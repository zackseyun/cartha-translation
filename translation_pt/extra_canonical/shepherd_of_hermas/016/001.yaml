base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/001.yaml
  text: When, then, I had stopped questioning her about all these things, she says to me, “Do you want to see something else?” And because I was eager to behold it, I became very glad to see.
translation:
  language: pt
  text: 'Quando terminei de lhe perguntar sobre todas essas coisas, ela me disse: “Você quer ver mais alguma coisa?” Como eu desejava muito contemplá-la, fiquei muito alegre de vê-la.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαυσάμην ἐρωτῶν
  choice: terminei de lhe perguntar
  rationale: Expressa naturalmente a ideia de cessar a sequência de perguntas, sem sugerir uma interrupção involuntária.
- source_word: Θέλεις ἄλλο ἰδεῖν;
  choice: Você quer ver mais alguma coisa?
  rationale: ἄλλο tem aqui o sentido de algo adicional; a formulação é corrente e clara em português.
- source_word: κατεπίθυμος ὢν τοῦ θεάσασθαι
  choice: Como eu estava ansioso por contemplá-la
  rationale: Preserva a intensidade de κατεπίθυμος e distingue θεάομαι, contemplar, do simples ἰδεῖν, ver. O pronome retoma de modo natural a coisa adicional proposta pela interlocutora.
- source_word: περιχαρὴς ἐγενόμην τοῦ ἰδεῖν
  choice: fiquei muito alegre com a perspectiva de vê-la
  rationale: Reproduz a alegria intensa de περιχαρής e evita a construção pouco idiomática 'alegre por ver' antes de a visão efetivamente ocorrer.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com diálogo natural. A tradução conserva o contraste lexical entre contemplar e ver, sem ampliar o conteúdo teológico ou antecipar o objeto da visão.
