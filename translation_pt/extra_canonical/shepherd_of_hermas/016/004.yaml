base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/004.yaml
  text: “But the others, lady, who are they?” “They are daughters of one another. And they are called Simplicity, Knowledge, Innocence, Dignity, and Love. Whenever, then, you do all the works of their mother, you are able to live.”
translation:
  language: pt
  text: “E as outras, senhora, quem são?” “São filhas umas das outras. Chamam-se Simplicidade, Conhecimento, Inocência, Dignidade e Amor. Portanto, quando você praticar todas as obras da mãe delas, poderá viver.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁπλότης
  choice: Simplicidade
  rationale: Preserva o sentido de singeleza e integridade sem acrescentar uma interpretação técnica.
- source_word: Ἐπιστήμη
  choice: Conhecimento
  rationale: Equivalente natural para conhecimento ou entendimento adquirido; o contexto personifica a virtude.
- source_word: Ἀκακία
  choice: Inocência
  rationale: Expressa a ausência de maldade indicada pelo termo grego, em linguagem clara e digna.
- source_word: Σεμνότης
  choice: Dignidade
  rationale: Comunica a qualidade de ser venerável, respeitável e moralmente sério.
- source_word: Ἀγάπη
  choice: Amor
  rationale: Tradução direta e amplamente compreensível do substantivo grego.
- source_word: τὰ ἔργα ... ποιήσῃς
  choice: praticar ... as obras
  rationale: Em português, 'praticar as obras' transmite naturalmente a ideia de realizar as ações próprias dessa virtude.
- source_word: δύνασαι ζῆσαι
  choice: poderá viver
  rationale: Mantém a formulação aberta do grego, sem definir de modo indevido se a vida é presente, moral ou escatológica.
theological_decisions:
- issue: Identidade da “mãe delas”
  choice: Manter a expressão “a mãe delas” sem explicação no corpo do texto
  alternative: Explicitar como referência à virtude anterior na cadeia, especialmente a Temperança
  rationale: O referente depende da alegoria e do contexto anterior; explicitá-lo resolveria uma relação que o texto desta unidade deixa implícita.
- issue: Sentido de “viver”
  choice: Manter simplesmente “viver”
  alternative: Traduzir como “ter a vida” ou “alcançar a vida eterna”
  rationale: Embora o contexto mais amplo tenha dimensão salvífica, ζῆσαι aqui não contém explicitamente “eterna”; a tradução preserva essa concisão e tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Os nomes das virtudes recebem inicial maiúscula por serem personificados. O diálogo conserva a forma direta e a relação respeitosa expressa por κυρία.
