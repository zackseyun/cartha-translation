review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente o sentido geral de 16:10–11, incluindo a finalidade de comunicar a revelação a todos e a purificação associada a ouvir e praticar as palavras. Contudo, a construção «ordeno a você, Hermas, que as palavras ... transmita» fica sintaticamente truncada e obscurece o imperativo final λαλῆσαι (“fale”). A nota também deve indicar que o próprio verbo é marcado como textualmente incerto na edição-fonte, além de πάντα estar entre colchetes.
  naturalness: O registro é moderno e adequado, mas a oração parentética atual produz uma regência incompleta. A revisão reorganiza a pontuação e emprega discurso direto para tornar a ordem inteligível sem eliminar a interrupção parentética do grego.
  terminology: «santos», «maldades» e «aos ouvidos dos santos» são escolhas defensáveis e fiéis. «Falar ... aos ouvidos» preserva a imagem idiomática da fonte de modo compreensível em português.
  issues:
  - severity: medium
    issue: A ordem dirigida a Hermas está gramaticalmente mal articulada.
    rationale: «Ordeno ... que as palavras ... transmita» deixa «as palavras» sem função sintática clara e não apresenta naturalmente o imperativo grego λαλῆσαι. Uma formulação com dois-pontos explicita a ordem sem alterar o conteúdo.
  - severity: low
    issue: A nota textual menciona apenas «todas».
    rationale: Na edição fornecida, λαλῆσαι recebe sinal de crux (†...†), e πάντα aparece entre colchetes. A nota deve informar ambas as incertezas.
  revised_text: 'Mas essas coisas não foram reveladas somente a você, mas para que você as torne conhecidas de todos. Depois de três dias — pois primeiro você precisa compreender; e, antes de tudo, eu lhe ordeno, Hermas —: fale[a] todas as palavras que estou prestes a lhe dizer aos ouvidos dos santos, para que, ouvindo-as e praticando-as, sejam purificados de suas maldades, e você também junto com eles.”'
  revised_footnotes:
  - marker: a
    text: O verbo traduzido por «fale» é textualmente incerto na edição-fonte; além disso, «todas» aparece entre colchetes e pode não pertencer ao texto em todos os testemunhos ou edições.
    reason: A edição-fonte assinala λαλῆσαι com crux e apresenta πάντα entre colchetes.
  revision_rationale: 'A revisão corrige a sintaxe portuguesa da ordem final e conserva os elementos do texto grego: a revelação não exclusiva, o intervalo de três dias, a necessidade de compreensão prévia, a ordem a Hermas, a comunicação aos santos e a purificação deles e de Hermas. A nota foi ampliada para refletir integralmente a incerteza textual indicada pela edição, sem decidir a questão crítica.'
