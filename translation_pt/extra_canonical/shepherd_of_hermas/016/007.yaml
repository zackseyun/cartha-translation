base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/007.yaml
  text: But it was not revealed to you alone, but so that you may make them known to all. After three days—for first you must understand, and I first command you, Hermas, the words I am about to say to you—speak them all into the ears of the holy ones, so that, after hearing them and doing them, they may be cleansed from their evils, and you also with them.”
translation:
  language: pt
  text: 'Mas essas coisas não foram reveladas somente a você, mas para que você as torne conhecidas de todos. Depois de três dias — pois primeiro você precisa compreender; e, antes de tudo, eu lhe ordeno, Hermas —: fale[a] todas as palavras que estou prestes a lhe dizer aos ouvidos dos santos, para que, ouvindo-as e praticando-as, sejam purificados de suas maldades, e você também junto com eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo traduzido por «fale» é textualmente incerto na edição-fonte; além disso, «todas» aparece entre colchetes e pode não pertencer ao texto em todos os testemunhos ou edições.
    reason: A edição-fonte assinala λαλῆσαι com crux e apresenta πάντα entre colchetes.
lexical_decisions:
- source_word: δηλώσῃς
  choice: torne conhecido
  rationale: Expressa a ideia de revelar ou comunicar claramente algo a todos, com naturalidade em português.
- source_word: εἰς τὰ ὦτα τῶν ἁγίων
  choice: aos ouvidos dos santos
  rationale: Preserva a imagem concreta e enfática do grego, também mantida na camada inglesa de consulta.
- source_word: ποιήσαντες
  choice: praticando-as
  rationale: No contexto de palavras ou instruções, indica colocá-las em prática, não apenas executar uma ação genérica.
- source_word: πονηριῶν
  choice: maldades
  rationale: Mantém o sentido moral do termo no plural sem restringi-lo a pecados específicos.
theological_decisions:
- issue: Identidade dos ‘santos’
  choice: santos
  alternative: consagrados
  rationale: Mantém o termo tradicional e a ambiguidade do referente, sem impor uma definição eclesiológica posterior.
- issue: Purificação ligada a ouvir e praticar
  choice: para que, ouvindo-as e praticando-as, sejam purificados
  alternative: para que sejam purificados ao ouvi-las e obedecer-lhes
  rationale: Conserva a sequência e a relação expressas pelos particípios gregos, sem formular uma doutrina mais específica sobre o meio da purificação.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade ampla. A construção parentética deliberadamente interrompida reflete a sintaxe difícil do texto grego, enquanto a pontuação ajuda o leitor a acompanhar a ordem dada a Hermas.
