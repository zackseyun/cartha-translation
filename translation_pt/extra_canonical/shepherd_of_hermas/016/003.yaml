base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/003.yaml
  text: Hear their functions. The first of them, the one clasping her hands, is called Faith; through her the chosen of God are saved. And the second, the one girded about and acting bravely, is called Self-control; she is the daughter of Faith. Whoever, then, follows her becomes blessed in his life, because he will refrain from all evil works, believing that if he refrains from every evil desire he will inherit eternal life.”
translation:
  language: pt
  text: 3 “Ouça agora o que elas fazem. A primeira delas, a que mantém as mãos unidas, chama-se Fé; por meio dela, os eleitos de Deus são salvos. 4 A segunda, a que está cingida e age com coragem, chama-se Domínio Próprio; ela é filha da Fé. Portanto, quem a seguir será feliz em sua vida, pois se manterá longe de todas as obras más, crendo que, se renunciar a todo desejo mau, herdará a vida eterna.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργείας
  choice: o que elas fazem
  rationale: Expressa de modo natural as atuações ou operações das figuras personificadas, sem reduzir o termo a cargos formais.
- source_word: κρατοῦσα τὰς χεῖρας
  choice: a que mantém as mãos unidas
  rationale: Preserva a descrição visual sem especificar além do grego se as mãos estão entrelaçadas ou apenas juntas.
- source_word: Ἐγκράτεια
  choice: Domínio Próprio
  rationale: Transmite autocontenção e governo dos desejos, em registro corrente e com a personificação indicada pelas iniciais maiúsculas.
- source_word: ἀνδριζομένη
  choice: se mostra corajosa
  rationale: Comunica o sentido idiomático de agir com valentia, evitando a formulação hoje marcada por gênero ‘agir como homem’.
- source_word: ἀφέξεται / ἀφέξηται
  choice: se manterá longe / renunciar
  rationale: Reproduz a ideia de abstenção tanto das obras más como de todo desejo mau, com formulações naturais no contexto.
theological_decisions:
- issue: Relação entre Fé, salvação e conduta
  choice: 'Manter as afirmações e sua sequência tal como aparecem: os eleitos são salvos por meio da Fé, e quem segue o Domínio Próprio se abstém do mal na esperança da vida eterna.'
  alternative: Reformular para harmonizar explicitamente fé, obras e herança da vida eterna segundo um sistema teológico posterior.
  rationale: O texto apresenta sua própria tensão parenética e soteriológica; a tradução não deve resolvê-la por acréscimos interpretativos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantiveram-se os nomes das virtudes personificadas com iniciais maiúsculas. O imperativo singular ‘Ouça’ acompanha a fala dirigida a Hermas, e ‘agora’ traduz o νῦν explícito do grego.
