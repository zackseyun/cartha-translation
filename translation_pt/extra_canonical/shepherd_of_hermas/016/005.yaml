  source_fidelity: A sequência das virtudes e a maior parte do sentido estão bem preservadas. Contudo, κρατοῦνται ... ὑπ᾽ ἀλλήλων descreve os «poderes/forças» como sendo mantidos ou sustentados uns pelos outros; «Seus poderes sustentam-se mutuamente» pode sugerir que os próprios poderes exercem a ação de sustentar. Além disso, κρατῆσαι τῶν ἔργων αὐτῶν é mais precisamente «manter-se firme nas obras delas»/«dominar as obras delas», não «apegar-se às obras delas», que em português soa afetivo e menos definido.
  naturalness: O português é fluente e de registro adequado. A revisão torna mais clara a referência de «umas às outras» e evita a construção algo opaca «Seus poderes sustentam-se».
  terminology: As escolhas Fé, Domínio Próprio, Simplicidade, Inocência, Dignidade, Conhecimento e Amor são defensáveis e coerentes na cadeia. «Santos de Deus» preserva o grego sem interpretação adicional.
