base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/005.yaml
  text: '“I wanted,” I said, “to know, lady, what power each of them has.” “Hear,” she says, “the powers they have. Their powers are held together by one another, and they follow one another, just as they were born: from Faith is born Self-control, from Self-control Simplicity, from Simplicity Innocence, from Innocence Dignity, from Dignity Knowledge, and from Knowledge Love. So, then, the works of these are pure and dignified and divine. Whoever, then, serves these and proves able to hold fast to their works will have his dwelling in the tower with the holy ones of God.”'
translation:
  language: pt
  text: '“Eu queria saber”, eu disse, “senhora, que poder cada uma delas tem.”


    “Escute”, disse ela, “os poderes que elas têm. Seus poderes são sustentados uns pelos outros, e elas seguem umas às outras, conforme a ordem em que nasceram: da Fé nasce o Domínio Próprio; do Domínio Próprio, a Simplicidade; da Simplicidade, a Inocência; da Inocência, a Dignidade; da Dignidade, o Conhecimento; e do Conhecimento, o Amor. Portanto, as obras delas são puras, dignas e divinas. Quem servir a essas virtudes e conseguir manter-se firme nas obras delas terá sua morada na torre com os santos de Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύναμις / δυνάμεις
  choice: poder / poderes
  rationale: Preserva o sentido amplo de capacidade ou poder próprio de cada virtude, sem reduzi-lo a uma função específica.
- source_word: κρατοῦνται ... ὑπ᾽ ἀλλήλων
  choice: sustentam-se mutuamente
  rationale: Expressa a relação recíproca indicada pelo passivo e pelo pronome, em português natural, preservando a ideia de que os poderes se mantêm ligados e apoiados uns pelos outros.
- source_word: Ἐγκράτεια
  choice: Domínio Próprio
  rationale: Comunica o governo sobre os próprios desejos e atos, sentido central do termo, com linguagem atual e sem restringi-lo apenas à abstinência.
- source_word: Ἁπλότης
  choice: Simplicidade
  rationale: Mantém a amplitude do grego, que pode envolver singeleza, sinceridade e ausência de duplicidade.
- source_word: Ἀκακία
  choice: Inocência
  rationale: Representa a ausência de maldade ou dolo, adequada à personificação da virtude nesta sequência.
- source_word: Σεμνότης
  choice: Dignidade
  rationale: Traduz a qualidade de ser venerável, respeitável e moralmente sério, em consonância com o adjetivo σεμνά usado logo depois.
- source_word: Ἐπιστήμη
  choice: Conhecimento
  rationale: Equivalente claro e abrangente para o saber ou entendimento indicado pelo termo.
- source_word: Ἀγάπη
  choice: Amor
  rationale: Preserva o termo cristão amplo sem acrescentar qualificação ausente no texto.
- source_word: κρατῆσαι τῶν ἔργων αὐτῶν
  choice: apegar-se às obras delas
  rationale: Conserva a ideia de tomar posse firme, manter ou observar essas obras, sem transformar a expressão em mera compreensão intelectual.
- source_word: κατοίκησις
  choice: morada
  rationale: Transmite a ideia de lugar de habitação permanente na torre.
theological_decisions:
- issue: Relação entre as virtudes e a morada na torre
  choice: 'Manter a formulação condicional e ética do texto: servir às virtudes e apegar-se às suas obras conduz à morada na torre.'
  alternative: Reformular em categorias sistemáticas posteriores, como mérito, justificação ou evidência da fé.
  rationale: O grego apresenta diretamente a sequência sem explicar sua relação com doutrinas soteriológicas posteriores; a tradução preserva essa tensão.
- issue: Identidade dos habitantes da torre
  choice: “os santos de Deus”
  alternative: “o povo santo de Deus” ou “os fiéis de Deus”
  rationale: Mantém de perto τοῖς ἁγίοις τοῦ Θεοῦ e evita definir mais precisamente a identidade do grupo do que o texto permite.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. As virtudes personificadas recebem iniciais maiúsculas. A estrutura genealógica e encadeada do grego foi preservada, enquanto a sintaxe foi ajustada para fluência oral e literária.
