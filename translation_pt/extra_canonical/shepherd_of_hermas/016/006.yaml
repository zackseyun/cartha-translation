base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/006.yaml
  text: And I kept asking her about the times—whether it is already the end. But she cried out with a loud voice, saying, “Senseless man, do you not see that the tower is still being built? Whenever, then, the tower is completed in its building, it comes to an end. But it will be built up quickly. Do not question me any further; this reminder and the renewal of your spirits are enough for you and for the holy ones.
translation:
  language: pt
  text: 'E eu lhe perguntava sobre os tempos, se o fim já havia chegado. Mas ela gritou em alta voz: “Homem sem entendimento! Você não vê que a torre ainda está sendo construída? Quando, pois, a torre estiver concluída em sua construção, ela chegará ao fim. Mas sua construção será concluída em breve. Não me pergunte mais nada. Esta lembrança e a renovação dos espíritos de vocês são suficientes para você e para os santos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν καιρῶν
  choice: sobre os tempos
  rationale: Mantém a expressão temporal ampla do grego, cujo contexto aponta para a consumação sem reduzir o termo a uma cronologia específica.
- source_word: συντέλεια
  choice: o fim
  rationale: No contexto, designa a consumação ligada à conclusão da torre; “o fim” é natural e preserva o sentido escatológico.
- source_word: Ἀσύνετε ἄνθρωπε
  choice: Homem sem entendimento!
  rationale: Reproduz a repreensão forte sem recorrer a uma formulação excessivamente coloquial ou insultuosa.
- source_word: ἐποικοδομηθήσεται
  choice: será concluída
  rationale: No contexto da torre ainda em construção, comunica que sua edificação será levada a termo; evita o pouco natural “será sobre-edificada”.
- source_word: ὑπόμνησις
  choice: lembrança
  rationale: Preserva a ideia de recordação ou advertência trazida novamente à mente.
- source_word: τῶν πνευμάτων ὑμῶν
  choice: do espírito de vocês
  rationale: 'Traduz o plural grego em construção distributiva natural em português: o espírito pertencente a cada membro do grupo.'
theological_decisions:
- issue: Relação entre a conclusão da torre e o fim
  choice: “Quando a construção da torre estiver concluída, então virá o fim”
  alternative: “Assim que a torre em construção for concluída, ela terá seu fim”
  rationale: O contexto da pergunta escatológica favorece entender τέλος como o fim esperado, mas a redação evita definir além do que a imagem explicita.
- issue: Sentido de “renovação dos espíritos”
  choice: “a renovação do espírito de vocês”
  alternative: “a renovação dos espíritos de vocês”
  rationale: A forma distributiva soa mais natural e não decide se “espírito” tem aqui sentido antropológico técnico ou simplesmente interior/moral.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” coerente com a fala direta e “vocês” para o grupo. A imagem arquitetônica e a tensão escatológica foram mantidas sem ampliação doutrinária.
