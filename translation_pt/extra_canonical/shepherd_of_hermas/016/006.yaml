revisions:
- from: 'E eu lhe perguntava sobre os tempos, se o fim já havia chegado. Mas ela gritou em alta voz: “Homem sem entendimento! Você não vê que a torre ainda está sendo construída? Quando a construção da torre estiver concluída, então virá o fim. Mas ela será concluída em breve. Não me pergunte mais nada. Para você e para os santos, basta esta lembrança e a renovação do espírito de vocês.”'
  to: 'E eu lhe perguntava sobre os tempos, se o fim já havia chegado. Mas ela gritou em alta voz: “Homem sem entendimento! Você não vê que a torre ainda está sendo construída? Quando, pois, a torre estiver concluída em sua construção, ela chegará ao fim. Mas sua construção será concluída em breve. Não me pergunte mais nada. Esta lembrança e a renovação dos espíritos de vocês são suficientes para você e para os santos.”'
  rationale: A revisão conserva o aspecto progressivo de ἐπηρώτων, a linguagem figurada da torre e a repreensão. Em especial, mantém a torre como sujeito de «chegará ao fim», preservando a formulação e a ambiguidade do grego em vez de converter a imagem numa declaração escatológica mais explícita. O plural «espíritos» corresponde ao texto-fonte.
