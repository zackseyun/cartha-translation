base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/007.yaml
  text: “But there are also indulgences that save people; for many, by doing good things, indulge themselves, being carried along by their own pleasure. This indulgence, therefore, is beneficial for the slaves of God, and it secures life for such a person; but the harmful indulgences previously mentioned procure torments and punishments for them; and if they persist and do not repent, they procure death for themselves.”
translation:
  language: pt
  text: Mas há também prazeres que salvam as pessoas, pois muitos, ao praticarem o bem, encontram prazer nisso, movidos pela satisfação que sentem. Esse prazer, portanto, é benéfico para os servos de Deus e proporciona vida a quem age assim. Já os prazeres prejudiciais mencionados anteriormente lhes trazem tormentos e castigos; e, se persistirem neles e não se arrependerem, trazem a morte sobre si mesmos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί / τρυφή
  choice: prazeres / prazer
  rationale: No contexto, o termo abrange a satisfação ou deleite encontrado tanto em atos maus quanto em boas obras. “Prazer” preserva essa amplitude e permite o contraste paradoxal entre prazeres prejudiciais e prazeres que salvam.
- source_word: σώζουσαι
  choice: que salvam
  rationale: Reproduz diretamente a força soteriológica do particípio grego sem enfraquecê-la para “benéficos” ou “saudáveis”.
- source_word: ἀγαθὰ ἐργαζόμενοι
  choice: ao praticarem o bem
  rationale: Formulação natural em português que mantém o sentido ativo de realizar boas ações.
- source_word: τῇ ἑαυτῶν ἡδονῇ φερόμενοι
  choice: movidos pela satisfação que sentem
  rationale: Expressa de modo idiomático a ideia de serem levados pelo próprio deleite, sem sugerir coerção externa.
- source_word: σύμφορός
  choice: benéfico
  rationale: Comunica a ideia de algo proveitoso ou vantajoso para os servos de Deus.
- source_word: τοῖς δούλοις τοῦ Θεοῦ
  choice: para os servos de Deus
  rationale: “Servos” é digno e corrente, preservando a relação de pertença e serviço expressa por δοῦλοι.
- source_word: ζωὴν περιποιεῖται
  choice: proporciona vida
  rationale: Mantém a ideia de obter ou assegurar vida sem especificar além do que o texto declara.
- source_word: βασάνους καὶ τιμωρίας
  choice: tormentos e castigos
  rationale: 'Preserva os dois substantivos e sua distinção aproximada: sofrimento aflitivo e punição.'
- source_word: ἐπιμένωσι
  choice: persistirem neles
  rationale: O complemento “neles” explicita naturalmente que a persistência se refere aos prazeres prejudiciais, conforme o contexto imediato.
- source_word: θάνατον ἑαυτοῖς περιποιοῦνται
  choice: trazem a morte sobre si mesmos
  rationale: Reproduz a responsabilidade reflexiva expressa por ἑαυτοῖς e evita definir a natureza da morte além do texto.
theological_decisions:
- issue: Relação entre boas obras, prazer e salvação
  choice: Manter a afirmação de que existem “prazeres que salvam” e que esse prazer “proporciona vida”.
  alternative: Interpretar de forma explicativa como prazeres que apenas favorecem ou acompanham a salvação.
  rationale: O grego atribui explicitamente a esses prazeres a ação de salvar e proporcionar vida. A tradução preserva essa tensão sem impor uma sistematização doutrinária.
- issue: Natureza da vida e da morte
  choice: Traduzir simplesmente “vida” e “morte”.
  alternative: Especificar “vida eterna” e “morte eterna” ou entendê-las apenas em sentido físico.
  rationale: O trecho não acrescenta qualificadores; manter os termos sem expansão preserva a abertura semântica do original.
- issue: Responsabilidade na persistência sem arrependimento
  choice: Preservar a formulação de que os próprios persistentes trazem morte sobre si.
  alternative: Atribuir diretamente a morte a uma sentença divina explicitada pelo tradutor.
  rationale: Embora o contexto envolva punição, a construção grega enfatiza aqui a consequência que eles obtêm para si mesmos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição de “prazer(es)” é intencional para preservar o jogo conceitual do grego entre deleite nocivo e deleite ligado à prática do bem.
