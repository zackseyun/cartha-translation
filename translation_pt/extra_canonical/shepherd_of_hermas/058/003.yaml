base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/003.yaml
  text: “The one who indulges himself and is deceived for a single day and does what he wants has clothed himself with much foolishness and does not perceive the deed he is doing; for on the next day he forgets what he did the day before. For indulgence and deception have no memory because of the foolishness with which he has clothed himself. But when punishment and torment cling to a person for one day, he is punished and tormented for up to a year; for punishment and torment have great memory.
translation:
  language: pt
  text: Quem se entrega ao prazer e se deixa enganar por um só dia, fazendo o que quer, vestiu-se de muita insensatez e não percebe o que está fazendo. Pois, no dia seguinte, esquece o que fez no dia anterior; porque o prazer e o engano não têm memória, por causa da insensatez de que se vestiu. Mas, quando o castigo e o tormento se apegam a uma pessoa por um só dia, ela é castigada e atormentada por até um ano; pois o castigo e o tormento têm memória duradoura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶν / τρυφή
  choice: se entrega aos prazeres / prazer
  rationale: Expressa a busca indulgente de satisfação, mantendo a ligação lexical interna sem restringir o termo a luxo material.
- source_word: ἀπατώμενος / ἀπάτη
  choice: se deixa enganar / engano
  rationale: Preserva a forma médio-passiva e a repetição conceitual do grego, sem decidir se o engano vem de si mesmo ou de fora.
- source_word: ἀφροσύνη
  choice: insensatez
  rationale: Termo corrente e digno para falta de discernimento moral, mais preciso aqui que mera ignorância.
- source_word: ἐνδέδυται
  choice: reveste-se / se revestiu
  rationale: Mantém a metáfora explícita de vestir-se de insensatez.
- source_word: τιμωρία καὶ βάσανος
  choice: castigo e tormento
  rationale: 'Conserva os dois termos distintos: sanção punitiva e sofrimento aflitivo.'
- source_word: μνήμας μεγάλας ἔχει
  choice: deixam lembranças profundas
  rationale: Reproduz de modo natural a personificação da memória duradoura do sofrimento, em contraste com o prazer e o engano que não guardam lembrança.
theological_decisions:
- issue: Relação temporal entre um dia de prazer e o período de sofrimento
  choice: por até um ano
  alternative: durante um ano
  rationale: O grego μέχρις ἐνιαυτοῦ indica extensão que chega a um ano; a tradução evita transformar o limite temporal em duração invariavelmente exata.
- issue: Agência no engano
  choice: se deixa enganar
  alternative: engana a si mesmo
  rationale: A forma ἀπατώμενος não identifica explicitamente o agente; a redação mantém essa abertura em vez de impor autoengano.
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. A estrutura contrastiva, as repetições e a metáfora de revestir-se foram preservadas, com ajustes idiomáticos mínimos.
