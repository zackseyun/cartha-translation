  to: Quem se entrega ao prazer e se deixa enganar por um só dia, fazendo o que quer, vestiu-se de muita insensatez e não percebe o que está fazendo. Pois, no dia seguinte, esquece o que fez no dia anterior; porque o prazer e o engano não têm memória, por causa da insensatez de que se vestiu. Mas, quando o castigo e o tormento se apegam a uma pessoa por um só dia, ela é castigada e atormentada por até um ano; pois o castigo e o tormento têm memória duradoura.
  rationale: A revisão é limitada à recuperação do singular e da repetição de τρυφή e à preservação da personificação contrastiva de μνήμας. «Por até um ano» mantém a força de limite de μέχρις sem impor uma duração invariavelmente exata.
