base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/004.yaml
  text: “So, being tormented and punished the whole year, he remembers the indulgence and the deception, and he knows that because of them he suffers evil things. Every person who indulges himself and is deceived is tormented in this way, because, though having life, they have handed themselves over to death.”
translation:
  language: pt
  text: Assim, atormentado e castigado durante o ano inteiro, ele se lembra do prazer e do engano e reconhece que é por causa deles que sofre esses males. Portanto, todos os que se entregam ao prazer e se deixam enganar são atormentados dessa maneira, porque, embora tenham vida, entregaram-se à morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφή
  choice: prazer
  rationale: No contexto, designa a satisfação indulgente dos desejos; “prazer” preserva a ligação com o uso mais amplo explicado nos versículos seguintes sem restringi-la a luxo material.
- source_word: ἀπάτη
  choice: engano
  rationale: Mantém o sentido de ilusão ou engano associado ao prazer pecaminoso, sem decidir se a pessoa engana a si mesma ou é enganada.
- source_word: βασανιζόμενος
  choice: atormentado
  rationale: Expressa sofrimento intenso e corresponde naturalmente ao campo semântico de βάσανος.
- source_word: τιμωρούμενος
  choice: castigado
  rationale: Distingue a punição do tormento e preserva o paralelismo grego.
- source_word: μνημονεύει
  choice: se lembra
  rationale: Equivalente corrente e claro para o ato contínuo de recordar.
- source_word: πάσχει τὰ πονηρά
  choice: sofre esses males
  rationale: Reproduz a formulação ampla do grego sem especificar indevidamente a natureza dos sofrimentos.
- source_word: παραδεδώκασι
  choice: entregaram a si mesmas
  rationale: Preserva a força reflexiva de ἑαυτούς e a ideia de uma entrega voluntária ou culpável.
theological_decisions:
- issue: Relação entre vida e morte
  choice: “embora tenham vida, entregaram a si mesmas à morte”
  alternative: “tendo a vida, entregaram-se à morte”
  rationale: Preserva o contraste teológico e retórico do original sem definir se “vida” se refere à vida física, espiritual ou à vida oferecida por Deus.
- issue: Mudança do singular para o plural
  choice: Manter “toda pessoa” no singular e “tenham/entregaram” no plural
  alternative: Regularizar tudo no singular
  rationale: Reflete a mudança presente no grego, de πᾶς ... ἄνθρωπος para os verbos e o pronome no plural, conservando a tensão gramatical do texto-fonte.
- issue: Agência no engano
  choice: “se deixa enganar”
  alternative: “engana a si mesma”
  rationale: O particípio médio/passivo ἀπατώμενος não exige que o engano seja estritamente autorreflexivo; a tradução evita impor essa interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição de “atormentado” e “castigado” conserva a ênfase do original. Não há notas de rodapé nesta unidade, portanto não são usados marcadores.
