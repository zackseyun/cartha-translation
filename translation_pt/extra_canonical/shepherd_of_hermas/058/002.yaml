    rationale: «Purificar o coração» pode ser entendido corretamente em português, mas «purificar seu coração» reproduz de modo mais completo a referência pessoal explícita no grego.
  - severity: low
    issue: O segundo φησί, ainda que entre colchetes editoriais, foi inteiramente absorvido.
    rationale: A inclusão discreta de «disse ele» preserva o encadeamento do discurso direto registrado tanto na edição fornecida quanto na trilha inglesa, sem alterar o sentido.
