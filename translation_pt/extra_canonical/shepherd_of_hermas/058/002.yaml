base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/002.yaml
  text: He answered me and says, “Your foolishness is persistent, and you are unwilling to cleanse your heart and to serve God. Watch out lest the time be fulfilled, and you be found foolish. Listen then,” he says, “as you desire, so that you may understand these things.
translation:
  language: pt
  text: 'Ele me respondeu: “A sua insensatez é persistente, e você não quer purificar seu coração nem servir a Deus. Tenha cuidado para que o tempo não se complete e você seja achado insensato. Ouça, então”, disse ele, “como deseja, para que entenda estas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφροσύνη
  choice: insensatez
  rationale: Expressa falta de discernimento moral e espiritual, preservando o tom de repreensão sem recorrer a uma formulação excessivamente coloquial.
- source_word: παράμονος
  choice: persistente
  rationale: Indica algo que permanece ou continua; “persistente” reproduz naturalmente a censura dirigida à insensatez contínua.
- source_word: καθαρίσαι
  choice: purificar
  rationale: Mantém a imagem moral e religiosa de tornar puro o coração.
- source_word: δουλεύειν
  choice: servir
  rationale: No contexto da relação com Deus, “servir” é natural em português e conserva a ideia de estar a serviço dele.
- source_word: βλέπε
  choice: Tenha cuidado
  rationale: Aqui o imperativo tem força de advertência, não de mera percepção visual.
- source_word: ὁ χρόνος πληρωθῇ
  choice: o tempo não se complete
  rationale: Preserva a metáfora temporal do grego e sua abertura quanto ao momento ou prazo em vista.
- source_word: εὑρεθῇς
  choice: seja achado
  rationale: Conserva a formulação passiva e o tom de avaliação ou constatação presente no original.
- source_word: νοήσῃς
  choice: entender
  rationale: Transmite de modo corrente o ato de compreender intelectualmente o ensinamento.
theological_decisions:
- issue: Referência ao cumprimento do tempo
  choice: “para que o tempo não se complete”
  alternative: “antes que se esgote o prazo”
  rationale: A tradução escolhida não especifica se se trata de prazo para arrependimento, juízo ou outro período, preservando a ambiguidade do texto grego.
- issue: Serviço a Deus
  choice: “servir a Deus”
  alternative: “ser escravo de Deus”
  rationale: Embora δουλεύειν possa carregar a ideia de escravidão, neste contexto “servir” comunica adequadamente a lealdade religiosa sem impor uma dureza lexical desnecessária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” para reproduzir com clareza o discurso direto no singular. O marcador parentético φησί foi integrado naturalmente ao diálogo, evitando repetições artificiais de “ele diz”.
