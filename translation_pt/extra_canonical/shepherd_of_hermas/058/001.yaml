base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/001.yaml
  text: “Since,” I say, “sir, I have not understood at all about the time of deception and indulgence and torment, make it more clear to me.”
translation:
  language: pt
  text: 'Eu disse: “Senhor, não entendi absolutamente nada quanto ao tempo do engano, do prazer e do tormento. Explica-me isso com mais clareza.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπάτη
  choice: engano
  rationale: Preserva o sentido de ilusão ou extravio moral sem acrescentar uma interpretação específica.
- source_word: τρυφή
  choice: prazer
  rationale: O contexto posterior aplica o termo tanto a prazeres nocivos quanto ao prazer em fazer o bem; “prazer” mantém essa amplitude melhor que “luxo” ou “indulgência”.
- source_word: βάσανος
  choice: tormento
  rationale: Expressa sofrimento intenso e corresponde ao contraste estabelecido no contexto entre prazer passageiro e sofrimento prolongado.
- source_word: χρόνος
  choice: tempo
  rationale: Mantém a formulação abrangente do grego, que o contexto explicará em termos de duração e proporção.
- source_word: τηλαυγέστερον ... δήλωσον
  choice: Explica-me isso com mais clareza
  rationale: Verte naturalmente o pedido para tornar o assunto mais claro e inteligível.
