revisions:
- from: 'Ele disse: “Toda ação é uma satisfação para a pessoa, quando ela a pratica com prazer. Pois até o homem irascível, ao dar plena satisfação à sua paixão, entrega-se ao prazer. O adúltero, o bêbado, o difamador, o mentiroso, o ganancioso, aquele que defrauda e quem pratica coisas semelhantes dão plena satisfação à sua própria doença; assim, entregam-se ao prazer naquilo que fazem. Todas essas satisfações são prejudiciais aos escravos de Deus. É, portanto, por causa desses enganos que sofrem os que são castigados e atormentados.”'
  to: 'Ele diz: “Toda ação é uma indulgência para a pessoa quando ela a pratica com prazer. Pois até o irascível, ao satisfazer plenamente a sua paixão, entrega-se à indulgência. O adúltero, o bêbado, o difamador, o mentiroso, o ganancioso, o defraudador e quem pratica coisas semelhantes satisfazem plenamente a sua própria doença; portanto, entregam-se à indulgência em sua ação. Todas essas indulgências são prejudiciais aos escravos de Deus. Por causa, pois, desses enganos sofrem os que são punidos e atormentados.”'
  rationale: A revisão preserva a construção abrangente do enunciado — qualquer ação praticada com prazer pode tornar-se indulgência — e emprega «indulgência» de modo consistente para o substantivo e sua ocorrência verbal correlata. Mantêm-se os termos moralmente descritivos do original sem acrescentar interpretação doutrinária.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:00:35Z'
