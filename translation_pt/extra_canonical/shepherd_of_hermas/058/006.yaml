base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/006.yaml
  text: He says, “Every deed is an indulgence to a person, whatever he does with pleasure. For even the hot‑tempered man, by giving his own passion its fill, indulges himself; and the adulterer and the drunkard and the slanderer and the liar and the greedy person and the defrauder and the one doing things like these gives his own disease its fill; he therefore indulges himself in his act. All these indulgences are harmful to the slaves of God. Therefore, because of these deceptions, those who are punished and tormented suffer.
translation:
  language: pt
  text: 'Ele diz: “Toda ação é uma indulgência para a pessoa quando ela a pratica com prazer. Pois até o irascível, ao satisfazer plenamente a sua paixão, entrega-se à indulgência. O adúltero, o bêbado, o difamador, o mentiroso, o ganancioso, o defraudador e quem pratica coisas semelhantes satisfazem plenamente a sua própria doença; portanto, entregam-se à indulgência em sua ação. Todas essas indulgências são prejudiciais aos escravos de Deus. Por causa, pois, desses enganos sofrem os que são punidos e atormentados.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφή / τρυφᾷ
  choice: satisfação / entrega-se ao prazer
  rationale: O termo designa prazer indulgente ou satisfação dos próprios desejos. A variação em português mantém naturalidade sem perder a relação entre o substantivo e o verbo.
- source_word: ὀξύχολος
  choice: homem irascível
  rationale: Expressa alguém propenso a acessos rápidos de ira, em registro atual e digno.
- source_word: κατάλαλος
  choice: difamador
  rationale: Designa quem fala mal de outros de modo prejudicial; “difamador” é claro para leitores modernos.
- source_word: πλεονέκτης
  choice: ganancioso
  rationale: Comunica o desejo ávido de possuir mais, sem restringir indevidamente o sentido à avareza monetária.
- source_word: ἀποστερητής
  choice: aquele que defrauda
  rationale: Preserva a ideia de privar alguém do que lhe pertence por fraude ou retenção injusta.
- source_word: δούλοις τοῦ Θεοῦ
  choice: escravos de Deus
  rationale: Mantém a força social e metafórica de δοῦλος, em vez de suavizá-la para “servos”.
- source_word: ἀπάτας
  choice: enganos
  rationale: Conserva a mudança lexical do autor, que passa de prazeres indulgentes a “enganos”, sugerindo seu caráter ilusório.
- source_word: τιμωρούμενοι καὶ βασανιζόμενοι
  choice: castigados e atormentados
  rationale: Mantém distintos os dois termos coordenados, um ligado à punição e o outro ao sofrimento intenso.
theological_decisions:
- issue: Força da metáfora de pertencimento a Deus
  choice: escravos de Deus
  alternative: servos de Deus
  rationale: A tradução direta preserva a linguagem forte do texto sem introduzir uma suavização teológica.
- issue: Relação entre prazer e pecado
  choice: manter a afirmação ampla e exemplificá-la como satisfação das paixões
  alternative: traduzir τρυφή uniformemente como “luxúria” ou “indulgência”
  rationale: O contexto inclui ira, mentira, ganância e fraude, portanto o sentido não se limita à luxúria nem ao luxo; trata-se do prazer obtido ao satisfazer uma paixão desordenada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso direto e a enumeração foram preservados; pequenas variações lexicais evitam construções artificiais, mantendo a repetição conceitual do grego.
