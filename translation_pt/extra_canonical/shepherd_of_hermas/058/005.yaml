translation:
  language: pt
  text: “Que prazeres, senhor, são prejudiciais?”, perguntei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί
  choice: prazeres
  rationale: No contexto, o termo designa satisfações ou deleites aos quais a pessoa se entrega. “Prazeres” é natural em português e mantém a amplitude necessária, pois a resposta seguinte inclui tanto prazeres nocivos quanto benéficos.
- source_word: βλαβεραί
  choice: prejudiciais
  rationale: Expressa com clareza aquilo que causa dano, sem acrescentar uma qualificação especificamente moral que não está explícita no adjetivo.
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento dirigida ao interlocutor, sem implicar aqui, por si só, um título divino.
- source_word: φημί
  choice: perguntei
  rationale: Embora literalmente seja “digo”, o enunciado é interrogativo e integra uma narrativa passada; “perguntei” produz diálogo natural em português sem alterar a função da fala.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com pontuação de diálogo natural. Preservou-se a abrangência de τρυφαί mediante “prazeres”, evitando restringi-lo a luxo, sensualidade ou excessos específicos.
