  text: 4. “But the Gentiles and the sinners—like the dry trees you saw—will be found such, dry and fruitless in that age, and as …”
translation:
  language: pt
  text: 4. Mas os gentios e os pecadores — assim como as árvores secas que você viu — serão encontrados secos e sem fruto naquela era, e como...
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: No contraste religioso com “os justos” e “os pecadores”, designa os povos não pertencentes ao povo de Deus; “gentios” preserva esse sentido contextual.
- source_word: ἄκαρποι
  choice: sem fruto
  rationale: Mantém de modo natural em português a imagem das árvores e o sentido literal de ausência de fruto.
- source_word: ἐν ἐκείνῳ τῷ αἰῶνι
  choice: naquela era
  rationale: Preserva a referência escatológica a um período futuro sem especificar uma interpretação teológica além do grego.
theological_decisions:
- issue: Relação entre “os gentios” e “os pecadores”
  choice: 'Manter os dois grupos coordenados: “os gentios e os pecadores”'
  alternative: Fundir as expressões ou interpretar todos os gentios como pecadores
  rationale: O grego apresenta dois substantivos coordenados, e a tradução evita resolver sua relação teológica além do que o texto declara.
- issue: Estado futuro descrito pela metáfora das árvores
  choice: “serão encontrados secos e sem fruto”
  alternative: “serão julgados mortos e improdutivos”
  rationale: A formulação conserva a metáfora e não introduz uma explicação doutrinária ausente do trecho.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil. A reticência final foi preservada porque a fonte fornecida e o segmento inglês terminam de forma truncada em “e como...”.
