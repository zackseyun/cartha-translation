base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/002.yaml
  text: 9. Thus both become partners in the work of the righteous one. Therefore the one who does these things will not be abandoned by God, but will be inscribed in the books of the living.
translation:
  language: pt
  text: 9. Assim, ambos se tornam participantes da obra do justo.[a] Portanto, quem faz essas coisas não será abandonado por Deus, mas terá seu nome inscrito nos livros dos vivos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “participantes da obra da justiça” ou “da obra justa”. O grego permite mais de uma compreensão desta expressão.'
    reason: Preservar a ambiguidade de τοῦ ἔργου τοῦ δικαίου sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: κοινωνοὶ
  choice: participantes
  rationale: Expressa participação conjunta na mesma obra com naturalidade, sem limitar o sentido a uma parceria comercial.
- source_word: τοῦ ἔργου τοῦ δικαίου
  choice: da obra do justo
  rationale: Mantém a construção genitiva do grego e a possível referência a uma pessoa justa, sem ocultar a leitura alternativa indicada em nota.
- source_word: ἐγκαταλειφθήσεται
  choice: será abandonado
  rationale: Reproduz diretamente a ideia de ser deixado ou desamparado por Deus.
- source_word: ἔσται ἐπιγεγραμμένος εἰς τὰς βίβλους τῶν ζώντων
  choice: terá seu nome inscrito nos livros dos vivos
  rationale: Torna explícito o elemento naturalmente pressuposto pelo idioma — o nome — e preserva tanto o plural 'livros' quanto 'dos vivos'.
theological_decisions:
- issue: Identidade de 'o justo' em τοῦ δικαίου
  choice: Não identificar explicitamente 'o justo' com Cristo, Deus ou qualquer outra figura.
  alternative: Traduzir como 'obra da justiça' ou 'obra justa'.
  rationale: A forma grega pode ser entendida como genitivo substantivado ('do justo') ou como referência à justiça/ao que é justo; a tradução principal conserva a forma mais próxima, e a nota registra a ambiguidade.
- issue: Inscrição nos livros dos vivos
  choice: Preservar a promessa no futuro sem explicar seu mecanismo ou formular uma doutrina de salvação.
  alternative: Parafrasear como garantia de salvação eterna.
  rationale: O texto afirma abandono negado e inscrição prometida, mas não desenvolve aqui uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva a numeração do parágrafo e o paralelismo argumentativo do original.
