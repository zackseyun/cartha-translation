base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/005.yaml
  text: 1. He showed me many trees that had no leaves, but they seemed to me to be dry; for they were all alike. And he says to me, “Do you see these trees?” “I see,” I say, “sir, that they are alike and dry.” Answering, he says to me, “These trees that you see are those who dwell in this age.”
translation:
  language: pt
  text: '1. Ele me mostrou muitas árvores que não tinham folhas, mas me pareciam secas, pois todas eram iguais. Então me disse: “Você está vendo estas árvores?” “Estou, senhor”, respondi. “Elas são todas iguais e estão secas.” Ele me respondeu: “Estas árvores que você vê são os que habitam nesta era.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρα
  choice: árvores
  rationale: Equivalente direto e natural, preservando a imagem central da parábola.
- source_word: ὡσεὶ ξηρά
  choice: me pareciam secas
  rationale: Expressa o valor de aparência de ὡσεὶ em ligação com ἐδόκει μοι, sem afirmar prematuramente que as árvores estavam de fato mortas.
- source_word: ὅμοια
  choice: todas iguais
  rationale: Comunica que as árvores tinham a mesma aparência, ponto essencial para a explicação posterior.
- source_word: οἱ κατοικοῦντες
  choice: os que habitam
  rationale: Mantém a metáfora espacial do grego, em vez de reduzi-la simplesmente a 'as pessoas'.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: nesta era
  rationale: Preserva o sentido temporal e escatológico de αἰών e sua contraposição posterior à era vindoura.
- source_word: κύριε
  choice: senhor
  rationale: Vocativo respeitoso em minúscula; evita identificar indevidamente o interlocutor como o Senhor Deus.
theological_decisions:
- issue: Identidade do interlocutor no vocativo κύριε
  choice: senhor, em minúscula
  alternative: Senhor
  rationale: O trecho apresenta um interlocutor que explica a visão, mas este versículo não o identifica como Deus ou Cristo; a minúscula preserva essa distinção.
- issue: Sentido escatológico de αἰών
  choice: era
  alternative: mundo
  rationale: “Era” conserva a tensão entre a ordem presente e a era vindoura desenvolvida no contexto, enquanto “mundo” poderia tornar a referência apenas espacial.
translation_notes:
  register: Português moderno, claro e digno, com diálogo natural e legível no Brasil. Conservou-se a repetição demonstrativa do grego e a imagem das árvores, evitando explicações não presentes no texto.
