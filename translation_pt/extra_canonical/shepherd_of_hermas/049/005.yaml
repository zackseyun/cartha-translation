  terminology: “Árvores”, “secas”, “senhor” e “era” são escolhas apropriadas. A minúscula em “senhor” evita uma identificação teológica indevida do interlocutor. Não há nomes próprios, termos técnicos ou âncoras de nota que exijam tratamento adicional.
