    issue: “[até os mais humildes]” traduz interpretativamente a expressão variante οἱ ἐλάχιστοι ὄντες.
    rationale: ἐλάχιστοι designa “os menores” ou “os mais pequenos”; “humildes” introduz uma qualidade moral não especificada. “Até” também não possui correspondente explícito no texto grego.
