base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/011.yaml
  text: 3. “For just as in summer the fruits of each tree become visible and are recognized for what they are, so also the fruits of the righteous will be visible, and all will be known, [those who are least] being flourishing in that age.”
translation:
  language: pt
  text: 3. Pois, assim como no verão os frutos de cada árvore se tornam visíveis e se reconhece que espécie são, assim também os frutos dos justos ficarão visíveis, e todos serão reconhecidos como viçosos naquela era, [os que são menores].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “os que são menores” aparece entre colchetes na edição de base, indicando incerteza textual.
    reason: Informa que a frase é textualmente incerta e preserva o sentido não interpretativo de ἐλάχιστοι.
lexical_decisions:
- source_word: τῷ θέρει
  choice: no verão
  rationale: Preserva a imagem sazonal e o contraste imediato com o inverno.
- source_word: οἱ καρποὶ φανεροῦνται
  choice: os frutos ... se tornam visíveis
  rationale: Expressa naturalmente a manifestação dos frutos sem enfraquecer o sentido passivo.
- source_word: ἐπιγινώσκονται ποταποί εἰσιν
  choice: se reconhece que tipo de frutos são
  rationale: Torna explícito em português o referente implícito do grego e preserva a ideia de discernir a qualidade de cada fruto.
- source_word: εὐθαλεῖς
  choice: viçosos
  rationale: Comunica florescimento, vigor e prosperidade vegetal, em harmonia com a metáfora das árvores.
- source_word: ἐν τῷ αἰῶνι ἐκείνῳ
  choice: naquela era
  rationale: Mantém o sentido escatológico de αἰών sem o reduzir necessariamente a 'mundo'.
theological_decisions:
- issue: Identidade e condição futura dos justos
  choice: os frutos dos justos ficarão visíveis, e todos serão reconhecidos ... como viçosos
  alternative: todos os justos serão conhecidos como prósperos
  rationale: Preserva a progressão do texto entre frutos manifestos e pessoas reconhecidas, sem acrescentar uma definição doutrinária da recompensa futura.
- issue: Leitura textual οἱ ἐλάχιστοι ὄντες
  choice: '[até os mais humildes]'
  alternative: omitir a expressão como possível interpolação
  rationale: Mantém a leitura marcada por colchetes na fonte e traduz ἐλάχιστοι de modo não hierárquico; 'até' dá uma ligação portuguesa inteligível, mas permanece dentro dos colchetes para sinalizar a incerteza.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. A estrutura comparativa e a metáfora agrícola foram preservadas; a incerteza textual foi mantida no corpo e explicada em nota.
