  source_fidelity: A comparação sazonal, a manifestação dos frutos e a qualificação εὐθαλεῖς foram transmitidas com fidelidade. Contudo, ἐλάχιστοι significa primariamente “os menores/os mais pequenos”, não necessariamente “os mais humildes”; além disso, o acréscimo de “até” introduz uma relação enfática não expressa no grego. Como a expressão está textualmente incerta, sua tradução deve permanecer próxima e não interpretativa.
  naturalness: O texto é claro e tem registro apropriado. A revisão torna a oração final mais direta, sem perder a construção algo condensada do original nem disfarçar a incerteza textual.
  terminology: “Verão”, “justos”, “frutos”, “viçosos” e “era” são escolhas adequadas. “Os que são menores” preserva o valor comparativo de ἐλάχιστοι sem lhe atribuir o sentido moral de “humildes”.
  issues:
