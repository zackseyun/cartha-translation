base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/003.yaml
  text: 10. Blessed are those who have and understand that they are made rich by the Lord; for those who think this way will be able to do some good.
translation:
  language: pt
  text: 10. Felizes os que têm bens e entendem que é o Senhor quem os torna ricos, pois os que pensam assim poderão fazer algum bem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Expressa de modo natural a declaração de bem-aventurança sem perder seu caráter solene.
- source_word: οἱ ἔχοντες
  choice: os que têm bens
  rationale: O uso absoluto de 'os que têm', no contexto da riqueza e da assistência aos pobres, refere-se aos que possuem recursos; 'bens' explicita naturalmente esse sentido em português.
- source_word: παρὰ τοῦ Κυρίου πλουτίζονται
  choice: é o Senhor quem os torna ricos
  rationale: Preserva a origem divina da riqueza e o valor passivo de πλουτίζονται, com uma construção idiomática em português.
- source_word: ταῦτα φρονοῦντες
  choice: os que pensam assim
  rationale: Reproduz de modo corrente a referência à compreensão ou disposição mental recém-expressa.
- source_word: ἀγαθόν τι ἐργάζεσθαι
  choice: fazer algum bem
  rationale: Tradução direta e natural, mantendo a indefinição de τι.
theological_decisions:
- issue: Origem da riqueza
  choice: é o Senhor quem os torna ricos
  alternative: enriquecem da parte do Senhor
  rationale: A formulação escolhida preserva a agência do Senhor indicada por παρά com o passivo, sem afirmar que toda forma de riqueza seja necessariamente sinal de favor divino; a frase permanece vinculada ao reconhecimento responsável dos bens recebidos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A expressão 'têm bens' é usada para evitar a estranheza de 'os que têm' isoladamente e para manter o vínculo contextual com riqueza e generosidade.
