base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/007.yaml
  text: 3. “For just as in winter the trees, having cast off their leaves, are alike, and it is not apparent which are dry or which are living, so in this age neither the righteous nor the sinners are apparent, but all are alike.”
translation:
  language: pt
  text: 3. “Pois, assim como no inverno as árvores, tendo perdido as folhas, são iguais, e não se vê quais estão secas e quais estão vivas, assim também, nesta era, nem os justos nem os pecadores são visíveis, mas todos são iguais.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποβεβληκότα τὰ φύλλα
  choice: depois de perderem as folhas
  rationale: Expressa de modo natural o particípio perfeito, mantendo a ideia do estado resultante da queda das folhas.
- source_word: οὐ φαίνονται
  choice: não se percebe / não se distinguem
  rationale: O verbo indica que a diferença não é visível ou reconhecível; a variação em português evita rigidez e deixa claro o sentido em cada ocorrência.
- source_word: αἰῶνι τούτῳ
  choice: nesta era
  rationale: Preserva o sentido temporal e escatológico de αἰών sem reduzi-lo simplesmente a ‘mundo’.
- source_word: ὅμοιοί εἰσιν
  choice: parecem iguais
  rationale: No contexto, a igualdade diz respeito à aparência externa, não à identidade moral ou espiritual.
theological_decisions:
- issue: Indistinção entre justos e pecadores na era presente
  choice: não se distinguem os justos dos pecadores
  alternative: nem os justos nem os pecadores são manifestos
  rationale: A formulação preserva a afirmação de que sua condição não é atualmente visível, sem sugerir que não exista diferença real entre eles.
translation_notes:
  register: Português moderno, claro e digno, com imagem agrícola natural e preservação do contraste escatológico entre a era presente e a futura.
