base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/010.yaml
  text: 2. “These trees that are sprouting,” he says, “are the righteous, who are about to dwell in the age to come; for the age to come is summer for the righteous, but winter for sinners. Therefore when the mercy of the Lord shines forth, then those serving God will be made manifest, and all will be made manifest.”
translation:
  language: pt
  text: '2. Ele disse: “Estas árvores que estão brotando são os justos, que estão para habitar na era vindoura; pois a era vindoura é verão para os justos, mas inverno para os pecadores. Portanto, quando a misericórdia do Senhor resplandecer, os que servem a Deus serão revelados, e todos serão revelados.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: que estão brotando
  rationale: Reproduz a imagem concreta de árvores que começam a produzir novos brotos, em contraste com as árvores secas.
- source_word: αἰὼν ὁ ἐρχόμενος
  choice: mundo vindouro
  rationale: Expressão portuguesa natural para a era ou ordem futura; preserva o sentido escatológico de αἰών sem sugerir apenas uma duração cronológica.
- source_word: θέρος
  choice: verão
  rationale: Mantém o contraste sazonal explícito com χειμών e a imagem de vitalidade e frutificação desenvolvida no contexto.
- source_word: ἐπιλάμψῃ
  choice: resplandecer
  rationale: Conserva a metáfora de luz associada à manifestação da misericórdia do Senhor.
- source_word: φανερωθήσονται
  choice: serão revelados
  rationale: Expressa que a verdadeira condição ou identidade das pessoas se tornará manifesta, preservando a voz passiva do grego.
theological_decisions:
- issue: Sentido escatológico de αἰών
  choice: mundo vindouro
  alternative: era vindoura
  rationale: “Mundo vindouro” é claro e corrente em português bíblico contemporâneo, sem definir indevidamente a natureza ou a cronologia desse estado futuro.
- issue: Alcance de πάντες em “todos serão revelados”
  choice: manter “todos” sem complemento explicativo
  alternative: todos os seres humanos serão revelados
  rationale: O referente exato não é explicitado nesta oração; a tradução conserva essa amplitude e evita resolver a ambiguidade.
- issue: Agente implícito da revelação
  choice: 'voz passiva: “serão revelados”'
  alternative: o Senhor revelará quem eles são
  rationale: Mantém a formulação do texto e não explicita o agente além do que o grego afirma.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura narrativa natural. O discurso direto e a repetição final foram preservados por sua função enfática.
