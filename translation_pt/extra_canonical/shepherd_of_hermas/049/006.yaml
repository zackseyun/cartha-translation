base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/006.yaml
  text: 2. “Why then, sir, are they as if dry and alike?” I say. “Because,” he says, “neither the righteous nor the sinners are visible in this age, but they are alike; for this age is winter for the righteous, and they are not visible while dwelling among sinners.”
translation:
  language: pt
  text: '2. Então perguntei: “Por que, senhor, elas parecem secas e são iguais?” Ele respondeu: “Porque, nesta era, nem os justos nem os pecadores se manifestam, mas são iguais; pois esta era é inverno para os justos, e eles não se manifestam enquanto habitam entre os pecadores.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσεὶ ξηρά
  choice: parecem secas
  rationale: Reproduz a comparação e a perspectiva visual de ὡσεὶ sem afirmar de modo absoluto que as árvores estejam mortas.
- source_word: ὅμοια
  choice: todas iguais / todos parecem iguais
  rationale: Expressa a indistinguibilidade das árvores e, na explicação, dos justos e pecadores, com concordância natural em português.
- source_word: φαίνονται
  choice: podem ser reconhecidos
  rationale: No contexto da imagem das árvores, o verbo indica que a identidade ou condição não se torna perceptível; esta formulação comunica melhor o sentido do que a tradução rígida 'aparecem'.
- source_word: αἰών
  choice: era
  rationale: Preserva o contraste escatológico entre a era presente e a era vindoura, evitando reduzir o termo a 'mundo'.
- source_word: χειμών
  choice: inverno
  rationale: Mantém literalmente a metáfora sazonal central da parábola.
- source_word: κατοικοῦντες
  choice: enquanto vivem
  rationale: Transmite de modo natural a permanência dos justos no convívio com os pecadores; 'habitam' seria possível, mas menos corrente neste contexto.
theological_decisions:
- issue: Invisibilidade dos justos e pecadores na era presente
  choice: não podem ser reconhecidos
  alternative: não aparecem / não são visíveis
  rationale: O contexto não ensina invisibilidade física, mas a impossibilidade de distinguir exteriormente a condição moral ou escatológica de cada grupo. A tradução conserva essa tensão sem sugerir que Deus desconheça quem são.
- issue: Relação dos justos com os pecadores
  choice: enquanto vivem entre os pecadores
  alternative: quando habitam com os pecadores
  rationale: Mantém o sentido de coexistência na era presente sem acrescentar separação social ou eclesiológica.
translation_notes:
  register: Português moderno, claro e digno, com fala narrativa natural. A repetição de 'podem ser reconhecidos' preserva a ênfase do grego e esclarece a metáfora sem explicação denominacional.
