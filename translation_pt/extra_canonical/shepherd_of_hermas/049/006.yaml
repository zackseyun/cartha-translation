  to: '2. Então perguntei: “Por que, senhor, elas parecem secas e são iguais?” Ele respondeu: “Porque, nesta era, nem os justos nem os pecadores se manifestam, mas são iguais; pois esta era é inverno para os justos, e eles não se manifestam enquanto habitam entre os pecadores.”'
