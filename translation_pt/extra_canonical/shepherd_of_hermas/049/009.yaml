  text: 1. He showed me again many trees, some sprouting and others dry, and he says to me, “Do you see these trees?” “I see,” I say, “sir, some sprouting and others dry.”
translation:
  language: pt
  text: '1. Ele me mostrou novamente muitas árvores, algumas brotando e outras secas, e me disse: “Você está vendo estas árvores?” “Estou vendo, senhor”, respondi, “algumas brotando e outras secas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: brotando
  rationale: Expressa naturalmente o particípio presente e preserva a imagem de árvores que começam a produzir novos brotos.
- source_word: ξηρά
  choice: secas
  rationale: Correspondência direta e clara para árvores ressequidas, mantendo o contraste visual com as que brotam.
- source_word: κύριε
  choice: senhor
  rationale: Neste diálogo, é uma forma respeitosa de tratamento dirigida ao intérprete da visão, sem exigir identificação divina.
