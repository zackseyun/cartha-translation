    rationale: O original traz “as almas deles”, no plural. A opção pelo singular distributivo é compreensível, mas a manutenção do plural preserva melhor o paralelismo com “a riqueza deles” e a forma do texto-fonte.
  revised_text: …levam à plenitude a riqueza deles; e, por sua vez, os ricos, suprindo os pobres com o que necessitam, levam à plenitude as próprias almas.
