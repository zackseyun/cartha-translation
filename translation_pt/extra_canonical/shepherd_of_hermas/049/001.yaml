- from: …levam à plenitude a riqueza deles; e, por sua vez, os ricos, fornecendo aos pobres o que lhes é necessário, levam à plenitude a própria alma.
  to: …levam à plenitude a riqueza deles; e, por sua vez, os ricos, suprindo os pobres com o que necessitam, levam à plenitude as próprias almas.
  rationale: A revisão conserva a repetição intencional de “levam à plenitude” para πληροφοροῦσι e ajusta “alma” ao plural τὰς ψυχὰς, sem alterar o sentido nem acrescentar uma interpretação doutrinária.
