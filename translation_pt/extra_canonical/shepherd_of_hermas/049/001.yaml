base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/001.yaml
  text: …they make their wealth complete, and in turn the rich, by supplying the poor with the things they need, make their souls complete.
translation:
  language: pt
  text: …levam à plenitude a riqueza deles; e, por sua vez, os ricos, suprindo os pobres com o que necessitam, levam à plenitude as próprias almas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληροφοροῦσι
  choice: levam à plenitude
  rationale: Preserva a repetição do verbo grego e sua ideia, neste contexto, de completar ou fazer chegar à plena medida, sem reduzi-lo ao sentido posterior de ‘convencer plenamente’.
- source_word: τὸν πλοῦτον αὐτῶν
  choice: a riqueza deles
  rationale: Mantém o referente pronominal do grego sem especificá-lo além do que o recorte permite.
- source_word: χορηγοῦντες
  choice: fornecendo
  rationale: Expressa naturalmente a ação de suprir ou prover recursos.
- source_word: τοῖς πένησι τὰ δέοντα
  choice: aos pobres o que lhes é necessário
  rationale: Traduz de modo claro tanto os destinatários quanto as coisas de que necessitam.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: a própria alma
  rationale: Em português, o singular distributivo é natural com sujeito plural e comunica que cada rico leva sua alma à plenitude.
theological_decisions:
- issue: Relação entre generosidade e plenitude da alma
  choice: levam à plenitude a própria alma
  alternative: salvam a própria alma
  rationale: O texto afirma πληροφοροῦσι, não emprega diretamente o vocabulário de salvação; a tradução evita introduzir uma conclusão soteriológica mais específica que a formulação grega.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela para refletir a repetição retórica do grego. As reticências iniciais indicam que o segmento começa no meio de uma frase do contexto anterior.
