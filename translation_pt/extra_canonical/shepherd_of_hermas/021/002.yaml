  naturalness: O texto é claro e de registro apropriado. A revisão reduz a pontuação pesada na abertura e torna mais fluida a formulação de contraste sem perder a estrutura comparativa.
  terminology: «Boa notícia», «o bem», «espírito/espíritos» e «coisas boas» são escolhas adequadas. Mantém-se «espírito» em minúscula e não se explicita qualquer agente do fortalecimento ou da renovação.
