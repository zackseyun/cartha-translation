base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/002.yaml
  text: For just as when some good message comes to someone who is grieving, he immediately forgets his former sorrows and welcomes nothing else except the message that he heard, and from then on he is strengthened for what is good, and his spirit is renewed because of the joy that he received, so also you have received a renewal of your spirits by seeing these good things.
translation:
  language: pt
  text: Pois, assim como alguém que está triste, ao receber uma boa notícia, imediatamente se esquece das tristezas anteriores e não aceita nada mais, a não ser a notícia que ouviu, e daí em diante é fortalecido para o bem, e seu espírito é renovado por causa da alegria que recebeu, assim também vocês receberam uma renovação de seus espíritos ao verem estas coisas boas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία ἀγαθή
  choice: boa notícia
  rationale: Expressa naturalmente a ideia de uma mensagem favorável, sem introduzir a conotação técnica de «evangelho».
- source_word: προσδέχεται
  choice: acolhe
  rationale: Preserva a ideia de receber ou dar atenção favorável à notícia, em vez de apenas ouvi-la.
- source_word: ἰσχυροποιεῖται ... εἰς τὸ ἀγαθόν
  choice: é fortalecido para o bem
  rationale: Mantém a voz passiva e a orientação ética da expressão grega sem especificar além do texto qual é o bem em vista.
- source_word: ἀνανέωσιν ... τῶν πνευμάτων ὑμῶν
  choice: a renovação de seus espíritos
  rationale: Reproduz o plural enfático do grego, dirigido à comunidade, sem reduzi-lo a um estado emocional coletivo.
- source_word: ταῦτα τὰ ἀγαθά
  choice: essas coisas boas
  rationale: Conserva a referência ampla e concreta do demonstrativo, ligada ao que foi visto na visão.
theological_decisions:
- issue: Sentido de πνεῦμα/πνεύματα
  choice: espírito/espíritos em minúscula
  alternative: Espírito/Espíritos como referência ao Espírito Santo
  rationale: O contexto fala da renovação interior da pessoa e dos membros da comunidade; não há indicação suficiente para identificar diretamente o termo com o Espírito Santo.
- issue: Agente implícito em «é fortalecido»
  choice: manter a construção passiva sem nomear o agente
  alternative: explicitar Deus como aquele que fortalece
  rationale: O grego não identifica o agente; explicitá-lo resolveria indevidamente uma ambiguidade do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A estrutura comparativa longa do grego foi preservada, mas pontuada de modo natural. Não há notas de rodapé neste segmento.
