base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/003.yaml
  text: And because you saw her sitting on a bench, the position is firm; because the bench has four feet and stands firmly. For indeed the world is held together by four elements.
translation:
  language: pt
  text: E, porque você a viu sentada sobre um banco, a posição é firme, pois o banco tem quatro pés e está firmemente de pé. Pois o mundo é sustentado por quatro elementos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλιον
  choice: banco
  rationale: Designa um assento com vários lugares; “banco” é natural em português e preserva a imagem dos quatro pés.
- source_word: ἰσχυρὰ ἡ θέσις
  choice: a posição é firme
  rationale: Mantém a formulação concisa e a relação simbólica entre a mulher sentada e a estabilidade do assento.
- source_word: ἰσχυρῶς ἕστηκεν
  choice: está firmemente assentado
  rationale: Expressa estabilidade física em português natural, sem repetir de modo rígido o verbo “estar”.
- source_word: κρατεῖται
  choice: é sustentado
  rationale: No passivo, o verbo comunica que o mundo se mantém ou é mantido por meio dos quatro elementos; “é sustentado” preserva essa ideia sem especificar um agente.
- source_word: στοιχείων
  choice: elementos
  rationale: Equivalente histórico e lexical direto, referente aos quatro elementos concebidos como componentes do mundo.
theological_decisions:
- issue: Relação entre os quatro pés do banco e os quatro elementos do mundo
  choice: Preservar a analogia cosmológica tal como aparece no texto
  alternative: Atualizar ou explicar a cosmologia antiga no corpo do texto
  rationale: A tradução deve representar a concepção do autor sem corrigi-la nem harmonizá-la com a ciência moderna.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” em continuidade com a interlocução direta. A repetição de “firme” foi parcialmente preservada por ser central à argumentação, mas suavizada com “firmemente assentado” para maior naturalidade.
