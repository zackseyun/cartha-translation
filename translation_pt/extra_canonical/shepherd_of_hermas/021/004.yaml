base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/004.yaml
  text: Therefore those who have repented completely will be new and firmly founded, those who have repented from their whole heart. You have the revelation complete. No longer ask anything about revelation; but if anything is needed, it will be revealed to you.
translation:
  language: pt
  text: Portanto, os que se arrependeram por completo serão novos e estarão firmemente alicerçados — os que se arrependeram de todo o coração. Você tem a revelação completa. Não peça mais nada a respeito de revelação; mas, se algo for necessário, será revelado a você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσαντες
  choice: os que se arrependeram
  rationale: Expressa de modo natural a mudança de mente e conduta indicada por μετανοέω, sem acrescentar linguagem denominacional.
- source_word: νέοι
  choice: renovados
  rationale: Embora o sentido básico seja “novos”, no contexto da renovação espiritual mencionada imediatamente antes, “renovados” comunica melhor a transformação das mesmas pessoas.
- source_word: τεθεμελιωμένοι
  choice: firmemente alicerçados
  rationale: Preserva a metáfora de fundamento do particípio perfeito e sua ideia de estabilidade resultante.
- source_word: ἀπέχεις
  choice: Você recebeu
  rationale: No contexto, o verbo indica que Hermas já possui plenamente a revelação; esta formulação é idiomática em português e mantém o estado resultante.
- source_word: ὁλοτελῆ τὴν ἀποκάλυψιν
  choice: a revelação completa
  rationale: Mantém a ideia de totalidade e conclusão da revelação dada.
- source_word: ἐάν τι δὲ δέῃ
  choice: mas, se alguma coisa for necessária
  rationale: Conserva a construção impessoal e a abertura quanto ao que eventualmente venha a ser necessário.
theological_decisions:
- issue: Relação entre arrependimento integral, renovação e firmeza
  choice: Manter a sequência causal sugerida pelo texto sem definir um esquema doutrinário de salvação.
  alternative: Explicitar que o arrependimento produz regeneração ou restauração eclesial.
  rationale: O grego afirma que os arrependidos serão novos e fundamentados, mas não especifica aqui uma formulação dogmática técnica.
- issue: Sentido de νέοι
  choice: Traduzir como “renovados”.
  alternative: Traduzir literalmente como “novos”.
  rationale: O contexto precedente fala da renovação dos espíritos; “renovados” preserva essa ligação, embora “novos” continue sendo uma alternativa lexical possível.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para o singular dirigido a Hermas. A repetição de “os que se arrependeram” foi preservada por sua função enfática no grego.
