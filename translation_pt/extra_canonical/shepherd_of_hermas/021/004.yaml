    rationale: O adjetivo grego significa “novos”. Ainda que o contexto precedente mencione renovação, a tradução deve preservar aqui a formulação distinta do original, sem harmonizá-la interpretativamente.
  - severity: low
    issue: ἀπέχεις foi vertido como “Você recebeu”.
    rationale: A formulação pode ser aceitável contextualmente, mas “Você tem a revelação completa” representa mais precisamente a ideia de posse/obtenção completa e acompanha melhor a concisão do grego.
