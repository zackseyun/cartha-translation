  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/004.yaml
  text: '"You will live," he says, "if you keep my commandments and walk in them; and whoever, having heard these commandments, keeps them, will live to God."'
translation:
  language: pt
  text: “Você viverá”, disse ele, “se guardar os meus mandamentos e andar neles; e todo aquele que, depois de ouvir estes mandamentos, os guardar viverá para Deus.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζήσῃ / ζήσεται
  choice: viverá
  rationale: Mantém o sentido futuro e a repetição enfática do verbo grego.
- source_word: φυλάξῃ
  choice: guardar
  rationale: Expressa observância fiel e preserva a formulação tradicional e natural em contexto de mandamentos.
- source_word: πορευθῇς ἐν αὐταῖς
  choice: andar neles
  rationale: Conserva a metáfora bíblica de conduzir a vida segundo os mandamentos, sem reduzi-la a uma explicação abstrata.
- source_word: τῷ Θεῷ
  choice: para Deus
  rationale: Reproduz o dativo grego de modo conciso, preservando sua possível nuance relacional ou orientada a Deus.
theological_decisions:
- issue: Sentido de ζήσεται τῷ Θεῷ
  choice: viverá para Deus
  alternative: viverá diante de Deus / viverá por Deus
  rationale: A expressão grega permite alguma tensão quanto à função do dativo. “Para Deus” preserva a concisão e a ambiguidade melhor do que alternativas mais interpretativas.
- issue: Relação entre guardar os mandamentos e viver
  choice: Manter a condição expressa diretamente
  alternative: Explicitar como evidência, mérito ou resultado da salvação
  rationale: O texto afirma a relação condicional sem desenvolver um sistema soteriológico; a tradução não deve importar uma explicação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com a metáfora tradicional “andar neles”. O discurso direto e a repetição do original foram preservados.
