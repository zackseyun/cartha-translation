  source_fidelity: A tradução transmite corretamente a razão da indagação, a condição de pecador, a incerteza acerca das obras e a multiplicidade/diversidade dos pecados. Contudo, “procuro saber ... com exatidão” pode deslocar a ideia de investigação cuidadosa para a exatidão da informação obtida; ἐξακριβάζομαι refere-se mais diretamente ao perguntar/inquirir minuciosamente. “Devo praticar” também explicita uma nuance de obrigação que não está expressa no grego.
  naturalness: O texto é claro e de registro apropriado. A revisão torna a posição de “senhor” mais próxima da construção grega e deixa o diálogo mais fluente em português moderno.
  terminology: “Pecador”, “obras”, “viver” e “muitos e variados” preservam bem os termos e a abertura semântica do original. “Senhor” permanece em minúscula como tratamento respeitoso ao interlocutor, sem identificação teológica indevida.
