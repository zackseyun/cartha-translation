base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/003.yaml
  text: '"For this reason then," I say, "sir, I inquire of you carefully about everything: first, because I am a sinner; then, because I do not know by doing what works I shall live, for my sins are many and manifold."'
translation:
  language: pt
  text: '“Por essa razão, então”, digo eu, “senhor, pergunto-lhe cuidadosamente sobre tudo: primeiro, porque sou pecador; depois, porque não sei que obras praticar para viver, pois meus pecados são muitos e variados.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξακριβάζομαι
  choice: procuro saber... com exatidão
  rationale: Expressa a investigação cuidadosa e minuciosa indicada pelo verbo, de modo natural em português.
- source_word: ποῖα ἔργα ἐργαζόμενος
  choice: que obras devo praticar
  rationale: Preserva a linguagem de 'obras' e a ideia de realizá-las, evitando a repetição pouco natural de 'obras operar'.
- source_word: ζήσομαι
  choice: para viver
  rationale: Mantém aberta a abrangência de 'viver', sem explicitar indevidamente se a referência é à vida presente, espiritual ou escatológica.
- source_word: ποικίλαι
  choice: variados
  rationale: Comunica que os pecados são de diferentes tipos, além de numerosos.
theological_decisions:
- issue: Relação entre obras e vida
  choice: “que obras devo praticar para viver”
  alternative: “o que devo fazer para ser salvo”
  rationale: A tradução conserva a formulação grega sobre obras e vida, sem substituir 'viver' por uma interpretação soteriológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Senhor” funciona aqui como forma respeitosa de tratamento ao interlocutor, em minúscula para não identificá-lo automaticamente com o Senhor divino.
