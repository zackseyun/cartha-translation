base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/002.yaml
  text: Answering me, he says, "I," he says, "am appointed over repentance, and I give understanding to all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding? To repent," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did rises up in his heart, and he repents and no longer does evil, but does good abundantly, and he humbles his own soul and afflicts it, because he sinned. You see then that repentance is great understanding."
translation:
  language: pt
  text: 'Ele me respondeu: “Eu”, disse ele, “estou encarregado do arrependimento e dou entendimento a todos os que se arrependem. Ou não lhe parece”, disse ele, “que o próprio ato de se arrepender é entendimento? Arrepender-se”, disse ele, “é grande entendimento. Pois quem pecou compreende que praticou o mal diante do Senhor; o ato que praticou lhe sobe ao coração, e ele se arrepende e não mais pratica o mal, mas pratica o bem abundantemente, humilha a própria alma e a castiga, porque pecou. Você vê, portanto, que o arrependimento é grande entendimento.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῆς μετανοίας εἰμί
  choice: fui encarregado do arrependimento
  rationale: A expressão indica responsabilidade ou superintendência sobre o arrependimento; esta formulação conserva esse sentido funcional em português natural.
- source_word: σύνεσις
  choice: entendimento
  rationale: Mantém a repetição argumentativa do grego e expressa discernimento ou compreensão moral sem restringir o termo a mero conhecimento intelectual.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: volta-lhe ao coração
  rationale: Reproduz a imagem de o ato chegar novamente à consciência interior, em linguagem idiomática e dignificada.
- source_word: πολυτελῶς
  choice: com grande empenho
  rationale: No contexto, o advérbio caracteriza a prática abundante, generosa ou zelosa do bem; a escolha evita o sentido moderno inadequado de luxo.
- source_word: βασανίζει
  choice: a aflige
  rationale: Preserva a linguagem forte de sofrimento ou disciplina interior sem sugerir necessariamente tortura física.
theological_decisions:
- issue: Relação entre arrependimento e entendimento
  choice: “o próprio ato de se arrepender é entendimento”
  alternative: “o arrependimento demonstra entendimento”
  rationale: O grego identifica diretamente o arrepender-se com σύνεσις; a tradução mantém essa afirmação enfática em vez de reduzi-la a mero sinal de entendimento.
- issue: Sentido de ἐπὶ τῆς μετανοίας
  choice: “fui encarregado do arrependimento”
  alternative: “estou sobre o arrependimento”
  rationale: Expressa a função atribuída ao interlocutor sem acrescentar título, hierarquia ou doutrina não explicitados no texto.
- issue: Humilhar e afligir a alma
  choice: manter ambas as ações distintas
  alternative: fundir como “mostra profunda contrição”
  rationale: A formulação concreta do original preserva a tensão ascética e penitencial sem interpretá-la ou atenuá-la.
translation_notes:
  register: Português contemporâneo, claro e dignificado, com legibilidade brasileira. Preservaram-se as repetições de “disse”, “entendimento” e “arrependimento”, pois estruturam o argumento do original. O tratamento por “você” torna a interpelação natural para leitores modernos, sem alterar o conteúdo.
