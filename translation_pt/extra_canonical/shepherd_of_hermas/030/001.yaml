base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/001.yaml
  text: I asked him again, saying, "Since the Lord has counted me worthy that you should dwell with me always, bear with a few more words from me, since I understand nothing, and my heart has been hardened by my former deeds. Give me understanding, for I am very foolish and altogether perceive nothing."
translation:
  language: pt
  text: 'Perguntei-lhe novamente: “Já que o Senhor me considerou digno de que você habite sempre comigo, tenha paciência com mais algumas palavras minhas, pois não entendo nada, e meu coração ficou endurecido por causa das minhas ações anteriores. Dê-me entendimento, porque sou muito insensato e não compreendo absolutamente nada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄξιόν με ἡγήσατο
  choice: me considerou digno
  rationale: Reproduz de modo natural o juízo expresso pelo verbo ἡγέομαι com o predicativo ἄξιον.
- source_word: κατοικῇς
  choice: habite
  rationale: Mantém o sentido concreto e duradouro de residir com alguém, sem enfraquecê-lo para apenas acompanhar.
- source_word: ἀνάσχου
  choice: tenha paciência com
  rationale: No contexto, o imperativo pede que o interlocutor suporte ou tolere as perguntas adicionais; esta formulação é corrente e digna.
- source_word: πεπώρωται
  choice: ficou endurecido
  rationale: Preserva a imagem do coração tornado insensível ou obtuso, bem como o estado resultante indicado pelo perfeito.
- source_word: πράξεων
  choice: ações
  rationale: Termo amplo e natural para os atos anteriores do narrador, sem acrescentar uma qualificação moral não explicitada nesta frase.
- source_word: συνέτισόν με
  choice: Dê-me entendimento
  rationale: 'Expressa o causativo do verbo: fazer compreender, instruir ou tornar sensato.'
- source_word: ἄφρων
  choice: insensato
  rationale: Conserva a autodepreciação intelectual e moral do grego com registro digno.
- source_word: νοῶ
  choice: compreendo
  rationale: Distingue de forma natural a percepção/compreensão final, embora o texto use vocabulário semanticamente próximo antes.
theological_decisions:
- issue: A dignidade do narrador diante do Senhor
  choice: “o Senhor me considerou digno”
  alternative: “o Senhor me tornou digno”
  rationale: O grego ἄξιόν με ἡγήσατο fala explicitamente de considerar ou julgar digno, não determina que o Senhor tenha produzido essa dignidade.
- issue: Causa do endurecimento do coração
  choice: “por causa das minhas ações anteriores”
  alternative: “desde as minhas ações anteriores”
  rationale: A preposição ἀπό pode marcar origem ou causa; o contexto favorece que os atos passados tenham provocado o endurecimento, sem especificar doutrina sobre o processo.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tratamento por “você” evita formas excessivamente arcaicas, enquanto a sintaxe e escolhas como “habite”, “entendimento” e “insensato” mantêm dignidade literária. A tradução abrange somente o segmento 30:1 fornecido no campo inglês, embora a fonte grega inclua o restante da seção como contexto.
