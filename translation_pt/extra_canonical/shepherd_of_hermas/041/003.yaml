base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/003.yaml
  text: 3. “What deeds of evil desire,” I say, “hand people over to death, sir? Make them known to me, so that I may keep away from them.” “Listen,” [he says,] “by what deeds evil desire puts the slaves of God to death.”
translation:
  language: pt
  text: '3. Eu perguntei: “Senhor, quais obras do desejo mau são as que entregam as pessoas à morte? Mostra-as a mim, para que eu me mantenha longe delas.” Ele respondeu: “Ouça: por quais obras o desejo mau leva à morte os servos de Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: o desejo mau
  rationale: Mantém o sentido amplo de desejo ou impulso moralmente nocivo, sem restringi-lo a uma forma específica de cobiça.
- source_word: παραδιδόντα ... εἰς θάνατον
  choice: entregam ... à morte
  rationale: Preserva a imagem forte e a construção do grego, sem decidir se a morte é física, espiritual ou escatológica.
- source_word: ἀφέξομαι ἀπ’ αὐτῶν
  choice: eu me mantenha longe delas
  rationale: Expressa em português natural a ideia de abster-se e evitar tais obras.
- source_word: θανατοῖ
  choice: leva à morte
  rationale: Reproduz o valor causativo do verbo sem recorrer ao menos natural 'mata' no contexto abstrato das obras.
- source_word: δούλους τοῦ Θεοῦ
  choice: os servos de Deus
  rationale: '''Servos'' é idiomático em linguagem bíblica portuguesa e conserva a relação de submissão a Deus.'
theological_decisions:
- issue: Natureza da morte
  choice: Manter apenas “morte”, sem qualificação
  alternative: “morte espiritual” ou “condenação”
  rationale: O texto grego não especifica a natureza da morte; qualificá-la resolveria indevidamente uma ambiguidade teológica real.
- issue: Agência do desejo mau
  choice: “o desejo mau leva à morte”
  alternative: “as obras matam”
  rationale: A frase final apresenta o desejo mau como agente que causa a morte mediante certas obras; a tradução conserva essa personificação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Senhor” funciona como tratamento respeitoso dirigido ao interlocutor, sem acrescentar identificação cristológica. A alternância entre pergunta e resposta foi explicitada de modo discreto para fluidez narrativa.
