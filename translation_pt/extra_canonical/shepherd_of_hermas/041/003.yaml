  - severity: low
    issue: Pergunta inicial pode refletir mais precisamente a delimitação das obras
    rationale: A construção τὰ παραδιδόντα pergunta quais obras são precisamente aquelas que entregam as pessoas à morte. A revisão explicita essa função sem alterar o sentido.
