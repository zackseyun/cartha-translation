  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente os elementos centrais: as obras pertencem ao desejo mau, elas entregam pessoas à morte, o pedido é para conhecê-las a fim de evitá-las, e o desejo mau é apresentado como agente que leva os servos de Deus à morte por meio dessas obras. Contudo, a formulação final "Escute por meio de quais obras" é pouco idiomática e pode obscurecer a relação instrumental expressa por ἐν ποίοις ἔργοις.'
  naturalness: O registro é em geral claro e digno. "Quais são as obras ... que entregam" é compreensível, mas "quais obras ... são as que entregam" reproduz melhor a pergunta delimitadora do grego. A abertura "Eu perguntei" é aceitável como explicitação narrativa de φημί.
  terminology: '"Desejo mau", "morte" e "servos de Deus" são escolhas adequadas e coerentes com o grego. Mantém-se "morte" sem especificação teológica. "Leva à morte" é uma boa tradução natural de θανατοῖ neste contexto personificado.'
