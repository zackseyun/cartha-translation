base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/001.yaml
  text: 'He says to me: “Remove from yourself every evil desire, but clothe yourself with the desire that is good and dignified; for when you are clothed with this desire, you will hate the evil desire and you will bridle it as you wish.'
translation:
  language: pt
  text: 'Ele me diz: “Afaste de você todo desejo mau e revista-se do desejo bom e digno, pois, revestido desse desejo, você odiará o desejo mau e o refreará como quiser.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἆρον ἀπὸ σεαυτοῦ
  choice: Afaste de você
  rationale: Expressa de modo natural a ordem de remover de si algo moralmente nocivo, preservando a força do imperativo.
- source_word: ἐπιθυμίαν πονηράν
  choice: desejo mau
  rationale: Mantém o sentido amplo de ἐπιθυμία como desejo ou anseio, sem restringi-lo indevidamente à cobiça ou ao desejo sexual.
- source_word: ἔνδυσαι / ἐνδεδυμένος
  choice: revista-se / revestido
  rationale: Preserva a metáfora explícita de vestir-se, central ao contraste do texto.
- source_word: ἀγαθὴν καὶ σεμνήν
  choice: bom e digno
  rationale: ἀγαθός é vertido diretamente por 'bom'; 'digno' comunica a respeitabilidade e nobreza moral de σεμνός em português corrente.
- source_word: χαλιναγωγήσεις
  choice: refreará
  rationale: Conserva a imagem de controlar com rédeas ou freio, mas em formulação idiomática e inteligível.
- source_word: καθὼς βούλει
  choice: como quiser
  rationale: Reproduz a afirmação de controle conforme a vontade do sujeito, sem acrescentar qualificações ausentes do grego.
theological_decisions:
- issue: Natureza de ἐπιθυμία
  choice: desejo
  alternative: cobiça
  rationale: O termo pode ser positivo ou negativo no próprio período; 'desejo' preserva essa amplitude e permite que os qualificativos 'mau' e 'bom e digno' estabeleçam o contraste.
- issue: Metáfora moral do vestuário
  choice: Preservar 'revista-se' e 'revestido'
  alternative: Adotar / tendo adotado
  rationale: A imagem de despir-se implicitamente do desejo mau e vestir-se do bom é deliberada e não deve ser dissolvida em linguagem puramente abstrata.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura direta e a repetição de 'desejo' preservam o contraste retórico do grego. Não há marcadores de nota porque nenhuma nota foi necessária para este segmento.
