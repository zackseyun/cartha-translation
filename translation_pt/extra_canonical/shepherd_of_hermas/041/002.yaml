review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a imagem do desejo mau como força selvagem e destrutiva, a metáfora da domesticação, a personificação e a entrega à morte. Contudo, «sobretudo quando» altera a condição introduzida por ἐὰν («sobretudo, se») para uma referência temporal, e «vestem a boa aspiração» não traduz com precisão a expressão «não têm a veste do desejo bom», além de romper a terminologia recorrente de ἐπιθυμία.
  naturalness: O texto é claro e de registro apropriado. A revisão torna a construção condicional mais exata e suaviza a articulação da última frase sem perder a repetição enfática de «consumir».
  terminology: «Desejo mau» é uma boa opção para ἐπιθυμία πονηρά. Convém empregar «desejo bom» na imagem da veste, para conservar a repetição lexical deliberada entre desejo mau e desejo bom, em vez de introduzir «aspiração». «Servo de Deus», «era» e «morte» permanecem adequados e não interpretativos.
  issues:
  - severity: medium
    issue: A condição ἐὰν foi traduzida como «quando».
    rationale: 'ἐὰν com subjuntivo introduz aqui uma condição eventual: «sobretudo, se um servo de Deus cair nele». «Quando» pode sugerir que a queda é esperada ou temporalmente determinada.'
  - severity: medium
    issue: «não vestem a boa aspiração» não corresponde exatamente à metáfora e à terminologia do grego.
    rationale: O texto diz que essas pessoas «não têm a veste do desejo bom» (μὴ ἔχοντας ἔνδυμα τῆς ἐπιθυμίας τῆς ἀγαθῆς). A formulação proposta muda «ter uma veste» para «vestir» e troca ἐπιθυμία por «aspiração», apesar de o mesmo termo ocorrer reiteradamente no trecho.
  revised_text: '2. Pois o desejo mau é selvagem e difícil de domar. Pois é temível e, por sua ferocidade, consome grandemente as pessoas; sobretudo, se um servo de Deus cair nele e não for prudente, será por ele severamente consumido. Ele consome tais pessoas: as que não têm a veste do desejo bom, mas estão enredadas nesta era. Portanto, entrega-as à morte.'
