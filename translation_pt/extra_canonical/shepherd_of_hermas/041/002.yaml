revisions:
- from: '2. Pois o desejo mau é selvagem e difícil de domar. É temível e, com sua ferocidade, consome terrivelmente as pessoas, sobretudo quando um servo de Deus cai nele e não age com discernimento: esse é cruelmente consumido por ele. O desejo mau consome pessoas assim — as que não vestem a boa aspiração, mas estão enredadas com esta era — e, por isso, as entrega à morte.'
  to: '2. Pois o desejo mau é selvagem e difícil de domar. Pois é temível e, por sua ferocidade, consome grandemente as pessoas; sobretudo, se um servo de Deus cair nele e não for prudente, será por ele severamente consumido. Ele consome tais pessoas: as que não têm a veste do desejo bom, mas estão enredadas nesta era. Portanto, entrega-as à morte.'
  rationale: A revisão restaura a condição eventual do grego, preserva a voz passiva em «será por ele... consumido» e conserva integralmente a metáfora da veste e a recorrência de ἐπιθυμία mediante «desejo bom». Não especifica a natureza do desejo, da era ou da morte.
  reviewer_model: gpt-5.6-terra
