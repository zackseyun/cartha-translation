base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/002.yaml
  text: '2. “For evil desire is wild and is hard to tame; for it is fearsome, and by its savagery it greatly consumes people—especially if a slave of God falls into it and is not sensible, he is grievously consumed by it. It consumes such people: those who do not have the garment of good desire, but are entangled with this age. These, therefore, it hands over to death.”'
translation:
  language: pt
  text: '2. Pois o desejo mau é selvagem e difícil de domar. Pois é temível e, por sua ferocidade, consome grandemente as pessoas; sobretudo, se um servo de Deus cair nele e não for prudente, será por ele severamente consumido. Ele consome tais pessoas: as que não têm a veste do desejo bom, mas estão enredadas nesta era. Portanto, entrega-as à morte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: o desejo mau
  rationale: Mantém a ideia recorrente de desejo ou impulso moralmente nocivo, sem restringi-la indevidamente a uma espécie específica de cobiça.
- source_word: ἀγρία ... δυσκόλως ἡμεροῦται
  choice: selvagem e difícil de domar
  rationale: Preserva a imagem de um animal feroz que resiste a ser amansado.
- source_word: δαπανᾷ / δαπανᾶται
  choice: consome / é consumido
  rationale: Reproduz a repetição e a voz ativa/passiva do grego, comunicando desgaste destrutivo.
- source_word: δοῦλος Θεοῦ
  choice: servo de Deus
  rationale: Expressão portuguesa natural que conserva a relação de sujeição e serviço indicada por δοῦλος.
- source_word: συνετός
  choice: age com discernimento
  rationale: Neste contexto, descreve prudência e percepção prática; a formulação verbal soa natural em português sem reduzir o termo a mera inteligência.
- source_word: ἔνδυμα τῆς ἐπιθυμίας τῆς ἀγαθῆς
  choice: vestem a boa aspiração
  rationale: Conserva a metáfora da vestimenta, retomando o imperativo precedente de revestir-se, e usa 'aspiração' para o desejo orientado ao bem.
- source_word: ἐμπεφυρμένους τῷ αἰῶνι τούτῳ
  choice: estão enredadas com esta era
  rationale: Expressa envolvimento comprometedor com a era presente; 'era' preserva o sentido temporal e moral de αἰών.
- source_word: παραδίδωσιν εἰς θάνατον
  choice: as entrega à morte
  rationale: Tradução direta que mantém a personificação do desejo mau como agente.
theological_decisions:
- issue: Alcance de 'desejo mau' e da morte resultante
  choice: Manter os termos amplos, sem definir a espécie de desejo nem a natureza da morte
  alternative: Interpretar como concupiscência sexual e morte espiritual ou condenação eterna
  rationale: O grego desta unidade não especifica essas restrições; a tradução preserva a amplitude e a tensão moral do texto.
- issue: Relação com 'esta era'
  choice: Traduzir αἰών por 'era'
  alternative: Traduzir por 'mundo'
  rationale: '''Era'' mantém a dimensão temporal do termo e evita identificar de modo simples a criação material com o mal.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a personificação do desejo mau, a imagem de domesticação e a metáfora de vestir-se; a repetição retórica do verbo 'consumir' foi preservada deliberadamente.
