revisions:
- from: Enquanto eu ia para Cumas, na mesma época do ano anterior, caminhava e me lembrei da visão daquele ano. Então, novamente, o Espírito me ergueu e me levou ao mesmo lugar do ano anterior.
  to: Enquanto eu ia para Cumas, na mesma época do ano que no ano anterior, lembrei-me, enquanto caminhava, da visão do ano anterior; e, de novo, um espírito me elevou e me levou ao mesmo lugar que no ano anterior.
  rationale: A revisão explicita as duas referências ao ano anterior, conserva a sequência narrativa e verte πνεῦμα de modo não confessionalmente determinado. «Me elevou e me levou» mantém os dois verbos gregos, «erguer» e «transportar/levar».
