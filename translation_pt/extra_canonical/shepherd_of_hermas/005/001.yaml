base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/001.yaml
  text: As I was going to Cumae at the same season as the year before, while walking I recalled last year’s vision, and again the Spirit lifts me up and carries me away to the same place as the year before.
translation:
  language: pt
  text: Enquanto eu ia para Cumas, na mesma época do ano que no ano anterior, lembrei-me, enquanto caminhava, da visão do ano anterior; e, de novo, um espírito me elevou e me levou ao mesmo lugar que no ano anterior.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κούμας
  choice: Cumas
  rationale: Forma portuguesa tradicional do topônimo antigo Cumae.
- source_word: κατὰ τὸν καιρὸν ὃν καὶ πέρυσι
  choice: na mesma época do ano anterior
  rationale: Expressa naturalmente a referência temporal sem restringir καιρός a uma estação específica.
- source_word: ἀνεμνήσθην
  choice: me lembrei
  rationale: Equivalente corrente e direto do aoristo de ἀναμιμνῄσκω.
- source_word: πνεῦμα
  choice: o Espírito
  rationale: O contexto visionário favorece uma atuação pessoal ou divina; a inicial maiúscula acompanha essa leitura sem acrescentar um qualificativo ausente no grego.
- source_word: αἴρει ... καὶ ἀποφέρει
  choice: me ergueu e me levou
  rationale: Preserva os dois movimentos verbais em português natural. O passado harmoniza o presente histórico grego com a narração.
theological_decisions:
- issue: Identidade de πνεῦμα
  choice: o Espírito
  alternative: um espírito / o espírito
  rationale: O artigo em português torna a frase idiomática e o contexto apresenta o agente da experiência visionária; não se acrescenta explicitamente «Santo», pois o grego não o faz.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A tradução mantém a repetição de «ano anterior» e o caráter visionário da ação, vertendo o presente histórico grego pelo passado narrativo natural em português.
