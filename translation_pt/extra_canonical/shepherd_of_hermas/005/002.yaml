base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/002.yaml
  text: So, having come to the place, I knelt and began to pray to the Lord and to glorify his name, because he had deemed me worthy and had made known to me my former sins.
translation:
  language: pt
  text: Assim, ao chegar ao lugar, ajoelhei-me e comecei a orar ao Senhor e a glorificar o seu nome, porque ele me considerou digno e me deu a conhecer os meus pecados anteriores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιθῶ τὰ γόνατα
  choice: ajoelhei-me
  rationale: Expressa de modo natural em português o gesto idiomático grego de pôr os joelhos no chão.
- source_word: ἄξιον ἡγήσατο
  choice: me considerou digno
  rationale: Preserva a ideia de um juízo favorável de dignidade, sem acrescentar a noção de mérito.
- source_word: ἐγνώρισέν μοι
  choice: me deu a conhecer
  rationale: Mantém o sentido causativo de tornar algo conhecido ao narrador.
- source_word: τὰς ἁμαρτίας μου τὰς πρότερον
  choice: os meus pecados anteriores
  rationale: Reproduz a referência temporal aberta de πρότερον, sem especificar além do texto quais pecados ou período estão em vista.
theological_decisions:
- issue: A dignidade atribuída ao narrador
  choice: me considerou digno
  alternative: me julgou merecedor
  rationale: A formulação escolhida evita transformar a avaliação divina em uma afirmação explícita de mérito humano.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A ordem narrativa e a relação causal do grego foram preservadas.
