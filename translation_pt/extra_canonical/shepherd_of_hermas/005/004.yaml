base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/004.yaml
  text: So I took it, and withdrawing to a certain place in the field, I copied it all letter by letter, for I could not make out the syllables. And when I had finished the letters of the book, suddenly the little book was snatched from my hand; but by whom I did not see.
translation:
  language: pt
  text: Então peguei o livrinho e, retirando-me para certo lugar do campo, copiei tudo letra por letra, pois não conseguia distinguir as sílabas. Quando terminei de copiar as letras do livro, de repente o livrinho foi arrancado da minha mão; mas não vi por quem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: livrinho
  rationale: Preserva o diminutivo grego e mantém a continuidade com a referência ao pequeno escrito entregue ao narrador.
- source_word: πρὸς γράμμα
  choice: letra por letra
  rationale: Expressa de modo natural a cópia estritamente literal ou caractere por caractere indicada pela locução grega.
- source_word: οὐχ ηὕρισκον γὰρ τὰς συλλαβάς
  choice: pois não conseguia distinguir as sílabas
  rationale: O verbo pode significar encontrar ou reconhecer; no contexto da leitura e cópia, 'distinguir' comunica a dificuldade de identificar a divisão silábica sem explicar além do texto.
- source_word: ἡρπάγη
  choice: foi arrancado
  rationale: Retém a força súbita e involuntária do passivo, sem identificar o agente oculto.
theological_decisions:
- issue: Identidade do agente que toma o livrinho
  choice: 'manter o agente indeterminado: ''mas não vi por quem'''
  alternative: atribuir a ação ao Espírito ou a um ser celestial
  rationale: O grego declara expressamente que o narrador não viu por quem o objeto foi tomado; identificar o agente resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e boa legibilidade brasileira. A repetição entre 'livrinho' e 'livro' acompanha a alternância do grego entre βιβλαρίδιον e βιβλίον.
