  to: 'Depois que me levantei da oração, vejo diante de mim a anciã que eu também tinha visto no ano anterior, caminhando e lendo um pequeno livro. Então ela me diz: “Você consegue anunciar estas coisas aos eleitos de Deus?” Eu lhe respondo: “Senhora, não consigo guardar na memória tantas coisas. Dê-me, porém, o pequeno livro, para que eu faça uma cópia.” Ela diz: “Pegue-o e o devolverá a mim.”'
