base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/003.yaml
  text: And after I rose from prayer, I see before me the elderly woman whom I had also seen last year, walking and reading a little book. And she says to me, “Are you able to report these things to the elect of God?” I say to her, “Lady, I am not able to remember so many things; but give me the little book, so that I may copy it.” “Take it,” she says, “and you will give it back to me.”
translation:
  language: pt
  text: 'Depois que me levantei da oração, vejo diante de mim a anciã que eu também tinha visto no ano anterior, caminhando e lendo um pequeno livro. Então ela me diz: “Você consegue anunciar estas coisas aos eleitos de Deus?” Eu lhe respondo: “Senhora, não consigo guardar na memória tantas coisas. Dê-me, porém, o pequeno livro, para que eu faça uma cópia.” Ela diz: “Pegue-o e o devolverá a mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέραν
  choice: a anciã
  rationale: O substantivo feminino indica uma mulher idosa já conhecida no relato; “anciã” preserva a dignidade e a continuidade da personagem.
- source_word: βιβλαρίδιον / βιβλίδιον
  choice: um pequeno livro / o pequeno livro
  rationale: O diminutivo grego descreve um livreto ou pequeno rolo; “pequeno livro” é claro e mantém o valor diminutivo.
- source_word: ἀναγγεῖλαι
  choice: anunciar
  rationale: O verbo significa comunicar ou transmitir uma mensagem; “anunciar” conserva seu caráter público sem especificar um meio não indicado.
- source_word: τοῖς ἐκλεκτοῖς τοῦ Θεοῦ
  choice: aos eleitos de Deus
  rationale: Tradução direta que preserva a linguagem religiosa do original sem explicar ou restringir a identidade do grupo.
- source_word: μνημονεῦσαι
  choice: guardar na memória
  rationale: Expressa naturalmente a incapacidade de reter e recordar todo o conteúdo, em vez de sugerir mera menção verbal.
- source_word: μεταγράψωμαι
  choice: faça uma cópia
  rationale: O verbo se refere a transcrever para si ou copiar por escrito; esta formulação é natural e adequada ao contexto.
- source_word: ἀποδώσεις
  choice: depois o devolverá
  rationale: O verbo indica entregar de volta; “devolver” comunica isso diretamente, e “depois” torna explícita apenas a sequência inerente à fala.
theological_decisions:
- issue: Identidade dos “eleitos de Deus”
  choice: Manter literalmente “os eleitos de Deus”
  alternative: Interpretar como “o povo escolhido de Deus” ou “os cristãos”
  rationale: O grego não define aqui a extensão nem a identidade precisa do grupo; a tradução preserva essa abertura teológica.
- issue: Natureza da experiência visionária
  choice: Manter o presente narrativo “vejo”
  alternative: Normalizar para o passado “vi”
  rationale: O original muda para o presente histórico βλέπω, recurso vívido que não deve ser apagado nem usado para determinar a natureza objetiva ou subjetiva da visão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém-se o presente histórico em “vejo” e “diz”, acompanhando a vivacidade do grego, enquanto os antecedentes permanecem no passado. A pontuação divide a longa frase grega para maior naturalidade sem alterar sua progressão.
