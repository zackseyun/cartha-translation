base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/004.yaml
  text: I say to her, "Lady, since once for all you considered me worthy for everything to be revealed to me, reveal it." She says to me, "Whatever can be revealed to you will be revealed. Only let your heart be toward God, and do not be double-minded in whatever you see."
translation:
  language: pt
  text: 'Eu lhe digo: “Senhora, já que, de uma vez por todas, me julgaste digno de que tudo me fosse revelado, revela-me.” Ela me diz: “Tudo o que te puder ser revelado será revelado. Apenas mantém o coração voltado para Deus e não duvides quanto ao que vieres a ver.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεὶ ἅπαξ ἠξίών με ἠγήσω
  choice: já que me julgaste digno
  rationale: Expressa naturalmente a avaliação de dignidade indicada por ἀξιόω e preserva o tom respeitoso dirigido à Senhora; ἅπαξ é representado pelo valor contextual de decisão já tomada, sem o idiomatismo português potencialmente enganoso “de uma vez por todas”.
- source_word: Ὃ ἐὰν ἐνδέχηταί σοι ἀποκαλυφθῆναι
  choice: Tudo o que te puder ser revelado
  rationale: Preserva o limite ou a possibilidade expressa por ἐνδέχηται, sem especificar se a restrição decorre da capacidade de Hermas, da permissão divina ou de outro fator.
- source_word: ἡ καρδία σου πρὸς τὸν Θεὸν ἤτω
  choice: mantém o coração voltado para Deus
  rationale: Verte a construção literalmente espacial como uma orientação interior contínua, em português corrente e digno.
- source_word: μὴ διψυχήσῃς
  choice: não duvides
  rationale: No contexto, o verbo indica hesitação ou dúvida interior. “Não sejas dividido em teu íntimo” seria mais formal, mas menos natural para o leitor comum.
- source_word: ὃ ἂν ἴδῃς
  choice: diante do que vieres a ver
  rationale: A formulação mantém a referência aberta a qualquer visão futura e liga a proibição de duvidar àquilo que Hermas verá.
theological_decisions:
- issue: Natureza do limite da revelação
  choice: “Tudo o que te puder ser revelado”
  alternative: “Tudo o que for permitido revelar-te”
  rationale: O grego expressa possibilidade ou admissibilidade, mas não identifica explicitamente quem ou o que impõe o limite. A tradução evita resolver essa ambiguidade em termos de permissão divina.
- issue: Sentido de διψυχέω
  choice: “não duvides”
  alternative: “não tenhas o coração dividido”
  rationale: A escolha comunica o sentido contextual sem introduzir uma antropologia técnica de “dupla alma”; a tensão entre confiança e hesitação permanece.
translation_notes:
  register: Português moderno, claro e digno, com tratamento na segunda pessoa do singular para conservar a interlocução direta. A sintaxe foi suavizada sem ampliar o conteúdo nem importar linguagem denominacional.
