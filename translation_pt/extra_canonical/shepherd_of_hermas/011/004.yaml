review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a petição de Hermas, o limite não especificado do que pode ser revelado e a exortação à firmeza interior. Contudo, omite ἅπαξ, elemento explicitamente preservado também no texto inglês de auditoria (“since once for all”).
  naturalness: O português é claro, moderno e mantém um registro respeitoso apropriado. “Não duvides diante do que vieres a ver” é inteligível, mas “quanto ao que vieres a ver” liga mais diretamente a proibição ao objeto expresso no grego.
  terminology: “Senhora” corresponde bem a Κυρία neste diálogo. “Coração voltado para Deus” traduz naturalmente a orientação de καρδία πρὸς τὸν Θεόν. “Não duvides” é uma opção contextual aceitável para μὴ διψυχήσῃς, sem impor uma leitura doutrinária.
  issues:
  - severity: medium
    issue: Omissão de ἅπαξ.
    rationale: “Já que me julgaste digno” não representa o advérbio ἅπαξ (“uma vez”, aqui com força de ato já concedido de modo definitivo). A omissão reduz a base da súplica de Hermas e diverge do audit trail inglês.
  - severity: low
    issue: Relação de “não duvides” com o que é visto.
    rationale: “Diante do que vieres a ver” é possível, mas o grego liga diretamente μὴ διψυχήσῃς a ὃ ἂν ἴδῃς. “Quanto ao que vieres a ver” torna essa relação mais explícita e idiomática.
  revised_text: 'Eu lhe digo: “Senhora, já que, de uma vez por todas, me julgaste digno de que tudo me fosse revelado, revela-me.” Ela me diz: “Tudo o que te puder ser revelado será revelado. Apenas mantém o coração voltado para Deus e não duvides quanto ao que vieres a ver.”'
