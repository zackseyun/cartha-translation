base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/001.yaml
  text: After showing me these things, she wanted to go away. I say to her, "Lady, what profit is it to me to have seen these things and not know what the matters are?" Answering me, she says, "You are a cunning man, wanting to know the things concerning the tower." "Yes, lady," I say, "so that I may report them to the brothers, and that, becoming more cheerful and hearing these things, they may know the Lord in much glory."
translation:
  language: pt
  text: 'Depois de me mostrar essas coisas, ela queria ir embora depressa. Eu lhe disse: “Senhora, de que me serve ter visto essas coisas sem saber o que elas são?” Ela me respondeu: “Você é um homem astuto, pois quer saber o que diz respeito à torre.” Eu disse: “Sim, senhora, para que eu as anuncie aos irmãos e para que eles se tornem mais alegres[a] e, ao ouvirem essas coisas, conheçam o Senhor em muita glória.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “e para que eles se tornem mais alegres” correspondem a um trecho colocado entre colchetes na edição grega usada aqui, sinalizando incerteza textual.
    reason: Preserva no texto a leitura apresentada pela edição e torna explícita, por meio de âncora, a sua delimitação editorial.
lexical_decisions:
- source_word: ἀποτρέχειν
  choice: ir embora
  rationale: Expressa naturalmente o movimento de afastar-se, sem a rigidez de uma tradução literal como “sair correndo”.
- source_word: ὄφελος
  choice: de que me adianta
  rationale: Equivalente corrente e claro para a ideia de proveito ou benefício no contexto.
- source_word: τὰ πράγματα
  choice: o que significam
  rationale: No contexto da visão, a pergunta trata da natureza ou do sentido das coisas vistas; a formulação evita o pouco natural “quais são os assuntos”.
- source_word: Πανοῦργος
  choice: astuto
  rationale: Preserva a ideia de esperteza ou sagacidade, possivelmente em tom levemente provocador, sem necessariamente atribuir maldade.
- source_word: τὰ περὶ τὸν πύργον
  choice: o que diz respeito à torre
  rationale: Reproduz de modo idiomático a abrangência da expressão grega.
- source_word: ἀναγγείλω
  choice: contar
  rationale: Comunica de forma natural o ato de relatar ou anunciar aos irmãos o conteúdo revelado.
- source_word: ἱλαρώτεροι γένωνται
  choice: ficando mais animados
  rationale: Transmite a ideia de se tornarem mais alegres ou esperançosos em português atual.
- source_word: ἐν πολλῇ δόξῃ
  choice: em grande glória
  rationale: Mantém a formulação e a possível tensão sem explicitar se a glória pertence ao Senhor, ao modo de conhecê-lo ou à esfera desse conhecimento.
theological_decisions:
- issue: Relação sintática de “em grande glória”
  choice: manter “conheçam o Senhor em grande glória”
  alternative: “conheçam o Senhor, que está em grande glória” ou “conheçam a grande glória do Senhor”
  rationale: O grego permite alguma incerteza quanto à ligação exata da expressão; a tradução preserva essa abertura em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com diálogo natural. O presente narrativo do grego foi vertido predominantemente no passado para fluidez narrativa, sem alterar a sequência dos acontecimentos. O trecho entre colchetes na edição foi incorporado ao texto porque integra o segmento solicitado, mas sua formulação foi mantida sem nota por não haver marcador editorial solicitado no texto-base.
