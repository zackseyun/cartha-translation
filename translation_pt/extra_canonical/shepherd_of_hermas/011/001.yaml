  to: 'Depois de me mostrar essas coisas, ela queria ir embora depressa. Eu lhe disse: “Senhora, de que me serve ter visto essas coisas sem saber o que elas são?” Ela me respondeu: “Você é um homem astuto, pois quer saber o que diz respeito à torre.” Eu disse: “Sim, senhora, para que eu as anuncie aos irmãos e para que eles se tornem mais alegres[a] e, ao ouvirem essas coisas, conheçam o Senhor em muita glória.”'
