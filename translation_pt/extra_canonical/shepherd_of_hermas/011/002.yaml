base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/002.yaml
  text: She said, "Many indeed will hear; and, having heard, some of them will rejoice, but some will weep. But even these, if they hear and repent, they too will rejoice. Therefore listen to the parables of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations, for these revelations have an end, for they have been completed. But you will not stop asking for revelations, for you are shameless."
translation:
  language: pt
  text: 'Ela disse: “Muitos, de fato, ouvirão. Depois de ouvirem, alguns deles se alegrarão, mas outros chorarão. Contudo, até estes, se ouvirem e se arrependerem, também se alegrarão. Ouve, portanto, as parábolas da torre, pois eu te revelarei tudo. E não me causes mais incômodo a respeito de revelações, porque estas revelações têm um fim: já estão completas. Mas tu não deixarás de pedir revelações, pois és atrevido.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσονται / ἀκούσαντες / ἀκούσωσιν
  choice: ouvirão / depois de ouvirem / se ouvirem
  rationale: Mantém a repetição deliberada do verbo grego e a progressão entre ouvir, reagir e arrepender-se.
- source_word: παραβολὰς
  choice: parábolas
  rationale: Equivalente tradicional e compreensível para as explicações figuradas relativas à torre.
- source_word: μετανοήσωσιν
  choice: se arrependerem
  rationale: Expressa a mudança moral e interior indicada pelo verbo, sem acrescentar formulação denominacional.
- source_word: κόπους πάρεχε
  choice: causes mais incômodo
  rationale: Reproduz de modo natural a ideia idiomática de dar trabalho ou causar transtorno.
- source_word: ἀναιδὴς
  choice: atrevido
  rationale: Comunica a insistência ousada e inconveniente de Hermas sem recorrer a uma expressão coloquial excessivamente forte.
theological_decisions:
- issue: Relação entre ouvir, arrependimento e alegria
  choice: “se ouvirem e se arrependerem, também se alegrarão”
  alternative: “se derem ouvidos e se arrependerem, também se alegrarão”
  rationale: Conserva a condição explícita do grego e a repetição lexical de “ouvir”, sem transformar a frase em uma formulação soteriológica mais específica.
- issue: Término das revelações
  choice: '“estas revelações têm um fim: já estão completas”'
  alternative: “estas revelações chegaram ao fim, pois foram completadas”
  rationale: Preserva a tensão entre a afirmação de que as revelações possuem um limite ou término e a de que já foram completadas, sem harmonizar as duas orações.
translation_notes:
  register: Português moderno, claro e digno, com tratamento em segunda pessoa singular para conservar o diálogo direto. A sintaxe foi levemente naturalizada, mas as repetições e a tensão do original foram mantidas.
