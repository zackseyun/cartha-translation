  source_fidelity: 'A tradução acompanha com precisão o grego do parágrafo: preserva a sequência ouvir—alegrar-se/chorar—ouvir e arrepender-se—alegrar-se, o imperativo para ouvir as parábolas, a promessa de revelar tudo, a recusa em continuar a tratar de revelações e a censura final. “Já estão completas” traduz adequadamente o perfeito passivo πεπληρωμέναι εἰσιν sem resolver de modo indevido a formulação algo tensa sobre o término das revelações.'
  naturalness: O português é moderno, claro e fluente, mantendo um registro narrativo digno. O tratamento por “tu” é coerente em todo o excerto e apropriado ao diálogo direto. “Causar incômodo” e “atrevido” soam naturais no registro escolhido.
  terminology: “Parábolas”, “arrependerem” e “revelações” são escolhas estabelecidas, compreensíveis e semanticamente adequadas. “Atrevido” transmite de modo equilibrado a censura de ἀναιδής, evitando tanto suavização excessiva quanto coloquialismo desnecessário.
