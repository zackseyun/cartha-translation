base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/005.yaml
  text: 'I asked her, "Why has the tower been built upon the waters, lady?" She says, "I told you before also, and you inquire diligently; therefore, by inquiring, you find the truth. Why, then, the tower has been built upon the waters—listen: because your life was saved through water and will be saved. And the tower has been founded by the word of the almighty and glorious Name, and is held fast by the unseen power of the Master."'
translation:
  language: pt
  text: 'Perguntei-lhe: “Senhora, por que a torre foi construída sobre as águas?” Ela respondeu: “Eu já lhe disse isso antes, e você investiga com cuidado; assim, investigando, encontra a verdade. Escute, então, por que a torre foi construída sobre as águas: porque a vida de vocês foi salva por meio da água e será salva. A torre foi alicerçada pela palavra do Nome todo-poderoso e glorioso e é sustentada pelo poder invisível do Soberano.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκζητεῖς ἐπιμελῶς
  choice: você investiga com cuidado
  rationale: Reproduz a ideia de busca diligente e persistente em linguagem portuguesa natural.
- source_word: διὰ ὕδατος
  choice: por meio da água
  rationale: Mantém o valor instrumental da preposição e preserva a referência simbólica ou batismal sem explicá-la dentro do texto.
- source_word: τεθεμελίωται
  choice: foi alicerçada
  rationale: Expressa com clareza a imagem arquitetônica do fundamento da torre.
- source_word: τῷ ῥήματι
  choice: pela palavra
  rationale: Conserva a formulação do grego e seu sentido instrumental, sem identificar além do que a fonte declara.
- source_word: τοῦ παντοκράτορος καὶ ἐνδόξου ὀνόματος
  choice: do Nome todo-poderoso e glorioso
  rationale: Preserva a personificação e a dignidade titular de “Nome”, bem como os dois qualificativos do original.
- source_word: κρατεῖται
  choice: é sustentada
  rationale: Comunica que a torre é mantida firme pelo poder divino, de modo natural no contexto da construção.
- source_word: τοῦ δεσπότου
  choice: do Senhor
  rationale: “Senhor” é uma equivalência digna e amplamente compreensível; evita a conotação moderna negativa de “déspota”.
theological_decisions:
- issue: O papel salvífico da água
  choice: “a vida de vocês foi salva por meio da água e será salva”
  alternative: Explicitar “água do batismo” ou reformular como mero símbolo
  rationale: O texto associa diretamente água e salvação, mas não traz neste ponto a palavra “batismo”; a tradução mantém a afirmação e sua tensão sem impor uma explicação doutrinária.
- issue: A identidade do “Nome”
  choice: Manter “Nome” com inicial maiúscula, sem identificação adicional
  alternative: Substituir por “nome de Deus”, “Cristo” ou outra identificação explícita
  rationale: A construção grega trata o Nome de modo elevado e quase titular, mas não explicita aqui sua identidade; a tradução preserva essa abertura.
- issue: Tempo futuro de σωθήσεται
  choice: “será salva”
  alternative: “continuará sendo salva” ou “alcançará a salvação”
  rationale: Mantém o futuro simples e a relação temporal entre a salvação passada e futura, sem resolver a natureza dessa progressão.
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento naturais para ampla legibilidade brasileira. O plural “vocês” reflete ὑμῶν, enquanto o diálogo individual usa “você”. A repetição sobre a torre e as águas foi mantida por sua função retórica no original.
