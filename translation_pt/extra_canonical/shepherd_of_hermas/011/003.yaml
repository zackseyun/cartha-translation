base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/003.yaml
  text: '"The tower that you see being built, I am the Church, the one shown to you both now and before. Whatever, therefore, you wish to ask about the tower, I will reveal to you, so that you may rejoice with the saints."'
translation:
  language: pt
  text: “A torre que você vê sendo construída sou eu, a Igreja, aquela que lhe foi mostrada agora e anteriormente. Portanto, o que quer que você deseje perguntar a respeito da torre, eu lhe revelarei, para que você se alegre com os santos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύργος
  choice: torre
  rationale: Equivalente direto e natural, preservando a imagem arquitetônica central da visão.
- source_word: ἡ Ἐκκλησία
  choice: a Igreja
  rationale: Mantém a identificação explícita da figura feminina com a comunidade personificada; a inicial maiúscula assinala seu uso como designação nessa declaração.
- source_word: ἡ ὀφθεῖσά σοι
  choice: que apareci a você
  rationale: Expressa naturalmente o particípio passivo de ὁράω no contexto de uma aparição visionária e conserva a primeira pessoa implícita na identificação com a Igreja.
- source_word: τῶν ἁγίων
  choice: os santos
  rationale: Tradução tradicional e semanticamente adequada para os membros santos do povo de Deus, sem especificar além do texto.
theological_decisions:
- issue: Identidade entre a torre, a mulher que fala e a Igreja
  choice: “A torre ... sou eu, a Igreja”
  alternative: “A torre ... representa a Igreja”
  rationale: O grego emprega uma identificação direta, ἐγώ εἰμι ἡ Ἐκκλησία, e não mera linguagem de representação; a tradução conserva essa força sem explicar a alegoria.
- issue: Referência de “os santos”
  choice: Manter a expressão sem explicação adicional
  alternative: Explicitar como “os membros do povo de Deus”
  rationale: O texto não define aqui o grupo com maior precisão; manter “os santos” preserva sua abertura referencial e sua linguagem religiosa própria.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para o singular e formulação natural. A inversão enfática do grego foi suavizada sem perder a identificação direta entre a torre e a Igreja.
