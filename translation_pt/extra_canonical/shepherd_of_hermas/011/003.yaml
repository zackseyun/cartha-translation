  naturalness: A redação revisada permanece clara e moderna em português internacional de boa legibilidade brasileira. 'Aquela que lhe foi mostrada' evita a ambiguidade e mantém o caráter visionário sem explicação adicional.
  terminology: '''Torre'', ''Igreja'' e ''santos'' são adequados e preservam a terminologia e a abertura semântica do grego. A maiúscula em ''Igreja'' é justificável como designação personificada no discurso.'
