    rationale: '''Pergunte o que quiser'' é compreensível, mas transforma a referência ao que ele desejar perguntar em um imperativo. ''O que quer que você deseje perguntar'' conserva melhor a estrutura e o alcance do original.'
  revised_text: “A torre que você vê sendo construída sou eu, a Igreja, aquela que lhe foi mostrada agora e anteriormente. Portanto, o que quer que você deseje perguntar a respeito da torre, eu lhe revelarei, para que você se alegre com os santos.”
