  to: 'Antes de tudo, creia que Deus é um só: aquele que criou e ordenou todas as coisas, que fez todas as coisas passarem do não ser à existência, que contém tudo e é o único que não pode ser contido. Portanto, confie nele e tema-o; e, tendo-o temido, exerça domínio próprio. Guarde estas coisas, e você afastará de si toda maldade, se revestirá de toda virtude de justiça e viverá para Deus, se guardar este mandamento.'
