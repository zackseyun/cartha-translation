base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/026/001.yaml
  text: First of all, believe that God is one—the one who created and ordered all things, and made all things out of nonexistence into being, and who contains all things, while he alone is uncontainable. Therefore believe him and fear him; and having feared, exercise self-control. Keep these things, and you will cast off all wickedness from yourself and put on every virtue of righteousness, and you will live to God, if you keep this command.
translation:
  language: pt
  text: 'Antes de tudo, creia que Deus é um só: aquele que criou e ordenou todas as coisas, que fez todas as coisas passarem do não ser à existência, que contém tudo e é o único que não pode ser contido. Portanto, confie nele e tema-o; e, tendo-o temido, exerça domínio próprio. Guarde estas coisas, e você afastará de si toda maldade, se revestirá de toda virtude de justiça e viverá para Deus, se guardar este mandamento.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς ἐστὶν ὁ Θεός
  choice: Deus é um só
  rationale: Expressa naturalmente em português a afirmação grega da unicidade de Deus, sem acrescentar uma formulação teológica posterior.
- source_word: κτίσας καὶ καταρτίσας
  choice: criou e ordenou
  rationale: Mantém distintos os atos de criar e de dispor ou pôr em ordem todas as coisas.
- source_word: ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι
  choice: do não ser à existência
  rationale: Reproduz o contraste ontológico do grego de modo compreensível, sem suavizá-lo para uma simples ideia de fabricação.
- source_word: πάντα χωρῶν, μόνος δὲ ἀχώρητος ὤν
  choice: contém tudo e é o único que não pode ser contido
  rationale: Preserva o jogo antitético entre χωρῶν e ἀχώρητος e sua afirmação da transcendência divina.
- source_word: ἐγκράτευσαι
  choice: exerça domínio próprio
  rationale: O verbo pede autocontrole ativo; esta formulação é clara e digna em português contemporâneo.
- source_word: ἐνδύσῃ
  choice: se revestirá
  rationale: Conserva a metáfora de vestir uma qualidade moral, em paralelo ao abandono da maldade.
- source_word: ζήσῃ τῷ θεῷ
  choice: viverá para Deus
  rationale: Mantém o dativo grego e sua orientação da vida a Deus, sem expandir a expressão.
theological_decisions:
- issue: Criação a partir do não ser
  choice: fez todas as coisas passarem do não ser à existência
  alternative: fez todas as coisas do nada
  rationale: A opção escolhida segue mais de perto a formulação explícita ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι e evita reduzir sua tensão conceitual a uma fórmula já cristalizada.
- issue: Relação entre temor e domínio próprio
  choice: tendo-o temido, exerça domínio próprio
  alternative: por temê-lo, controle-se
  rationale: Preserva a sequência participial do texto e não transforma explicitamente o temor em causa, embora essa relação possa estar implícita.
- issue: ἀρετὴν δικαιοσύνης
  choice: toda virtude da justiça
  alternative: toda virtude justa
  rationale: Mantém a relação genitiva e a possível densidade moral e teológica de δικαιοσύνη, em vez de reduzi-la a um adjetivo genérico.
translation_notes:
  register: Português contemporâneo, digno e amplamente inteligível, com tratamento por “você” nos imperativos. A tradução preserva as antíteses do grego, especialmente não ser/existência e conter/não poder ser contido, sem introduzir terminologia confessional específica.
