  yaml_path: translation/extra_canonical/shepherd_of_hermas/061/001.yaml
  text: 'Then the angel of the Lord commanded that crowns be brought. And crowns were brought, as if made from palms, and he crowned the men who had handed in the rods that had shoots and some fruit, and he dismissed them into the tower. 2. And the others also he sent into the tower—those who had handed in their rods green and having shoots, but whose shoots did not have fruit—giving them seals. 3. And all who were going into the tower had the same clothing, white as snow. 4. And those who had handed in their rods green, just as they had received them, he dismissed, giving them clothing and seals. 5. After the angel had finished these things, he says to the shepherd: “I am going; but you are to dismiss these to the walls, as each one is worthy to dwell. Pay close attention to their rods, and so dismiss them—pay close attention. See that no one slips past you,” he says; “but if anyone does slip past you, I will test them upon the altar.” Having said these things to the shepherd, he went away.
    6. The shepherd says to me, “Let us take the rods of all and plant them, to see if any of them will be able to live.” I say to him, “Sir, how can these dry things live?” 7. Answering me he says, “This tree is a willow, and its kind loves life. If, then, the rods are planted and receive a little moisture, many of them will live; then let us also try pouring water on them. If any of them is able to live, I will rejoice over it; but if it does not live, I shall not be found negligent.” 8. Then the shepherd commanded me to call them just as each of them had been stationed. Rank by rank they came and were handing their rods to the shepherd. The shepherd took the rods and planted them according to the ranks; and after planting he provided much water for them, so that because of the water the rods could not be seen. 9. And after he had watered the rods, he says to me, “Let us go, and after a few days let us return and inspect all the rods; for the one who created this tree desires all who have
    taken branches from this tree to live. And I too hope that, these rods having received moisture and having been watered with water, the greater part of them will live.”'
translation:
  language: pt
  text: 'Então o anjo do Senhor mandou que trouxessem coroas. E trouxeram coroas como se fossem feitas de palmas, e ele coroou os homens que haviam entregado as varas que tinham brotos e algum fruto, e os enviou para a torre. 2 Também enviou os outros para a torre — os que haviam entregado as varas verdes, com brotos, mas cujos brotos não tinham fruto —, dando-lhes selos. 3 Todos os que iam para a torre tinham a mesma veste, branca como a neve. 4 E enviou os que haviam entregado as varas verdes tal como as tinham recebido, dando-lhes veste e selos. 5 Depois de terminar essas coisas, o anjo disse ao pastor: “Eu vou; quanto a você, envie estes para as muralhas, conforme cada um for digno de morar. Examine cuidadosamente as varas deles e então os envie. Examine cuidadosamente. Veja que ninguém escape de você”, disse ele. “Mas, se alguém escapar de você, eu os porei à prova sobre o altar.” Depois de dizer essas coisas ao pastor, ele foi embora.


    6 O pastor me disse: “Tomemos as varas de todos e plantemo-las, para ver se algumas delas poderão voltar a viver.” Eu lhe disse: “Senhor, como estas varas secas podem voltar a viver?” 7 Ele me respondeu: “Esta árvore é um salgueiro, e sua espécie é vivaz. Portanto, se as varas forem plantadas e receberem um pouco de umidade, muitas delas viverão. Depois, tentemos também derramar água sobre elas. Se alguma delas puder viver, eu me alegrarei com ela; mas, se não viver, não será por negligência minha.” 8 Então o pastor mandou que eu os chamasse conforme cada um havia sido colocado. Eles vieram grupo por grupo e entregavam as varas ao pastor. O pastor recebia as varas e as plantava de acordo com os grupos. Depois de plantá-las, derramou muita água sobre elas, de modo que as varas não podiam ser vistas por causa da água. 9 Depois de regar as varas, ele me disse: “Vamos e, daqui a alguns dias, voltemos para examinar todas as varas. Pois aquele que criou esta árvore quer que vivam todos os
    que receberam ramos desta árvore. E eu também espero que a maior parte destas varinhas viva, depois de receber umidade e de ser regada com água.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στέφανοι ... ἐκ φοινίκων
  choice: coroas ... feitas de folhas de palmeira
  rationale: “Coroas” preserva o sentido honorífico de στέφανοι; “folhas de palmeira” torna explícito o material vegetal sugerido por φοινίκων sem confundi-lo com a própria árvore inteira.
- source_word: ῥάβδους / ῥαβδία
  choice: varas / varinhas
  rationale: “Varas” representa naturalmente ramos cortados usados como sinais; no fim, o diminutivo grego ῥαβδία é conservado como “varinhas”.
- source_word: παραφυάδας
  choice: brotos
  rationale: Refere-se a rebentos laterais que surgem nas varas; “brotos” é corrente e claro.
- source_word: σφραγῖδας
  choice: selos
  rationale: Mantém o substantivo concreto e sua carga simbólica sem explicar antecipadamente o significado teológico.
- source_word: ἀπέλυσεν / ἀπολύσεις
  choice: enviou / encaminhe
  rationale: No contexto, o verbo indica liberar e despachar cada grupo ao destino designado; as escolhas evitam o sentido moderno de absolvição ou demissão.
- source_word: εἰς τὰ τείχη
  choice: para junto das muralhas
  rationale: Mantém a distinção entre τείχη, “muralhas”, e πύργος, “torre”, evitando transformar as muralhas no interior da torre.
- source_word: φιλόζωον τὸ γένος
  choice: sua espécie tem grande vitalidade
  rationale: Expressa idiomaticamente que a espécie é tenaz e propensa a sobreviver, sem a estranheza literal de “ama a vida”.
- source_word: ζῆσαι
  choice: reviver
  rationale: Como as varas secas podem voltar à vida após o plantio, “reviver” comunica melhor o sentido contextual que o simples “viver”.
- source_word: τάγματα τάγματα
  choice: grupo por grupo
  rationale: Reproduz a distribuição ordenada sem impor uma conotação estritamente militar a τάγματα.
- source_word: ὁ κτίσας
  choice: aquele que criou
  rationale: Preserva o referente não explicitado no grego e evita identificá-lo interpretativamente no corpo do texto.
theological_decisions:
- issue: Identidade de “aquele que criou esta árvore”
  choice: Manter a expressão indefinida
  alternative: Explicitar “Deus” ou outra figura
  rationale: O grego usa apenas ὁ κτίσας; explicitar a identidade eliminaria uma abertura presente no texto.
- issue: Sentido simbólico dos selos
  choice: Traduzir simplesmente como “selos”
  alternative: Interpretar como batismo, salvação ou marca de pertença
  rationale: A passagem apresenta o símbolo sem explicá-lo aqui; a tradução não deve importar uma interpretação sacramental ou denominacional.
- issue: Prova sobre o altar
  choice: Manter “provarei sobre o altar”
  alternative: Parafrasear como julgamento, sacrifício ou purificação
  rationale: A formulação é imagética e teologicamente tensa; preservá-la evita decidir a natureza exata da prova.
- issue: Lugar junto às muralhas conforme a dignidade
  choice: “conforme o lugar em que cada um for digno de morar”
  alternative: “conforme cada um for digno de habitar”
  rationale: A formulação portuguesa esclarece a relação entre dignidade e lugar de moradia sem definir uma hierarquia teológica além do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Preservaram-se a repetição enfática de “examine cuidadosamente”, a imagética da torre, das muralhas, dos selos e do altar, e a alternância narrativa no presente em formas naturais do português.
