base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/003.yaml
  text: Believe in the Lord, you double-minded, because he is able to do all things and turns his anger away from you, but sends plagues upon you who are double-minded. Woe to those who have heard these words and disobeyed; it would have been better for them not to have been born.
translation:
  language: pt
  text: Creiam no Senhor, vocês que têm o coração dividido, pois ele tudo pode, afasta de vocês a sua ira e envia flagelos a vocês, os que têm o coração dividido. Ai dos que ouviram estas palavras e desobedeceram! Melhor seria para eles não terem nascido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίψυχοι / διψύχοις
  choice: os que têm o coração dividido
  rationale: Expressa de modo natural a ideia de lealdade interior dividida ou vacilante, preservando a repetição enfática do grego.
- source_word: μάστιγας
  choice: castigos
  rationale: No contexto, o termo figurado indica golpes punitivos ou flagelos; “castigos” é claro e digno, sem sugerir necessariamente uma epidemia.
- source_word: παρακούσασιν
  choice: não lhes obedecerem
  rationale: 'O verbo vai além de simplesmente não escutar: indica ouvir e, ainda assim, desatender ou desobedecer às palavras.'
- source_word: αἱρετώτερον
  choice: Melhor seria
  rationale: Reproduz naturalmente a construção comparativa de preferência do original.
theological_decisions:
- issue: Relação entre afastar a ira e enviar castigos
  choice: 'Manter as duas ações coordenadas: “afasta... e envia...”'
  alternative: “afasta... mas envia...”
  rationale: O grego usa καὶ nas duas orações e não explicita oposição. A tradução preserva a tensão de que o Senhor tanto afasta sua ira quanto envia castigos aos de coração dividido, sem harmonização interpretativa.
- issue: Alcance de πάντα δύναται
  choice: “ele tudo pode”
  alternative: “ele pode fazer todas as coisas”
  rationale: Mantém a afirmação abrangente do poder do Senhor, sem acrescentar limitações ou aplicações doutrinárias ausentes do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O imperativo plural “Creiam” e a explicitação vocativa “vocês que têm o coração dividido” tornam a exortação natural sem perder sua força. Não foram necessárias notas de rodapé.
