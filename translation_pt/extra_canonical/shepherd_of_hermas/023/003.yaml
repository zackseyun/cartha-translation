revisions:
- from: 'Creiam no Senhor, vocês que têm o coração dividido, pois ele tudo pode: afasta de vocês a sua ira e envia castigos sobre vocês, os que têm o coração dividido. Ai daqueles que ouvirem estas palavras e não lhes obedecerem! Melhor seria para eles não terem nascido.'
  to: Creiam no Senhor, vocês que têm o coração dividido, pois ele tudo pode, afasta de vocês a sua ira e envia flagelos a vocês, os que têm o coração dividido. Ai dos que ouviram estas palavras e desobedeceram! Melhor seria para eles não terem nascido.
  rationale: A revisão substitui o termo excessivamente genérico “castigos” por “flagelos”, mais próximo de μάστιγας, e restaura no português o caráter retrospectivo dos particípios aoristos finais. Mantêm-se a coordenação sem adversativa entre afastar a ira e enviar flagelos, a repetição enfática de “coração dividido” e a formulação não doutrinariamente especificada do original.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:59:13Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a exortação aos δίψυχοι, o poder abrangente do Senhor, o afastamento de sua ira e o ai final. Contudo, μάστιγας designa mais especificamente “flagelos” (golpes aflitivos/punitivos; por extensão, pragas), e os particípios aoristos ἀκούσασιν e παρακούσασιν se referem aos que já ouviram e desobedeceram, não a uma hipótese futura.
  naturalness: O português é claro, moderno e adequadamente solene. “Flagelos” conserva o registro e a imagem do original; “os que ouviram estas palavras e desobedeceram” é idiomático e reflete melhor a referência temporal grega.
  terminology: “Coração dividido” é uma solução natural e fiel para δίψυχοι, preservando a repetição. “Flagelos” é preferível a “castigos” para μάστιγας, pois mantém a concretude do termo sem restringi-lo a uma única modalidade de punição.
  issues:
  - severity: medium
    issue: “castigos” generaliza μάστιγας.
    rationale: μάστιγας significa literalmente flagelos/chicotes e, neste uso, aflições ou pragas punitivas. “Flagelos” preserva a imagem e a amplitude sem interpretação excessiva.
  - severity: medium
    issue: “daqueles que ouvirem ... e não lhes obedecerem” desloca para o futuro uma referência a ações consumadas.
    rationale: Os particípios aoristos ἀκούσασιν e παρακούσασιν caracterizam pessoas que ouviram estas palavras e as desatenderam. A formulação no pretérito conserva esse valor.
  revised_text: Creiam no Senhor, vocês que têm o coração dividido, pois ele tudo pode, afasta de vocês a sua ira e envia flagelos a vocês, os que têm o coração dividido. Ai dos que ouviram estas palavras e desobedeceram! Melhor seria para eles não terem nascido.
  revised_footnotes: []
