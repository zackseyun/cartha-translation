base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/001.yaml
  text: After the beast had passed by me and I had gone forward about thirty feet, behold, a virgin meets me, adorned as if coming out of a bridal chamber, all in white and with white sandals, veiled up to her forehead; her covering was with a turban, and her hair was white.
translation:
  language: pt
  text: Depois de eu ter passado pela fera e avançado cerca de trinta pés, eis que uma virgem veio ao meu encontro, adornada como quem saía de uma câmara nupcial. Estava toda de branco, com sandálias brancas, velada até a testa; seu véu era preso por um turbante, e seus cabelos eram brancos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: fera
  rationale: Transmite um animal ameaçador ou selvagem com naturalidade em português, sem acrescentar uma identificação simbólica.
- source_word: ὡσεὶ πόδας τριάκοντα
  choice: cerca de trinta pés
  rationale: Mantém a medida corporal antiga e o caráter aproximativo de ὡσεὶ; evita uma conversão métrica imprecisa no texto.
- source_word: παρθένος
  choice: virgem
  rationale: Equivalente direto que preserva a caracterização da figura no grego.
- source_word: κεκοσμημένη
  choice: adornada
  rationale: Preserva a ideia de estar ornamentada ou preparada, em harmonia com a imagem nupcial.
- source_word: ἐκ νυμφῶνος
  choice: de uma câmara nupcial
  rationale: Mantém o cenário associado às núpcias sem restringi-lo à noção moderna de quarto particular.
- source_word: κατακεκαλυμμένη ἕως τοῦ μετώπου
  choice: tinha o rosto coberto até a testa
  rationale: Expressa de modo inteligível a extensão do véu ou cobertura, sem especificar além do que o grego permite.
- source_word: μίτρᾳ
  choice: turbante
  rationale: Representa uma cobertura de cabeça enrolada; é mais concreta e compreensível do que uma transliteração técnica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativo, com boa legibilidade brasileira. A interjeição bíblica «eis que» foi mantida por corresponder a ἰδού e marcar a aparição súbita. O segmento traduzido limita-se ao §1 solicitado, embora a fonte fornecida inclua partes posteriores da seção.
