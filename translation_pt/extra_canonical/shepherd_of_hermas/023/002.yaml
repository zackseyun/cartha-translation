base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/002.yaml
  text: I knew that I would escape it, if your heart becomes pure and without blemish, and if for the remaining days of your life you serve the Lord blamelessly. Cast your cares upon the Lord, and he himself will direct them.
translation:
  language: pt
  text: Eu sabia que escaparia dela[a], se o coração de vocês se tornasse puro e sem mancha e se, nos dias restantes da vida de vocês, servissem ao Senhor de modo irrepreensível. Lancem suas preocupações sobre o Senhor, e ele mesmo as porá em ordem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome grego está no feminino («dela»), mas seu referente não está claro neste trecho; a criatura mencionada imediatamente antes é de gênero neutro em grego.
    reason: Preservar a forma do texto-fonte e informar ao leitor a ambiguidade real do antecedente.
lexical_decisions:
- source_word: ἄμωμος
  choice: sem mancha
  rationale: Preserva a imagem de ausência de defeito ou mácula e evita confundi-la com ἀμέμπτως, traduzido adiante por «de modo irrepreensível».
- source_word: ἀμέμπτως
  choice: de modo irrepreensível
  rationale: Expressa uma conduta que não dá motivo legítimo de censura, mantendo a distinção lexical em relação a ἄμωμος.
- source_word: μερίμνας
  choice: preocupações
  rationale: Equivalente corrente para cuidados inquietantes ou ansiedades, adequado à exortação para confiá-los ao Senhor.
- source_word: κατορθώσει
  choice: porá em ordem
  rationale: O verbo comunica endireitar, conduzir corretamente ou levar a bom termo; a formulação portuguesa é natural sem prometer de modo indevido um resultado específico.
theological_decisions:
- issue: Relação entre pureza, serviço e livramento
  choice: Manter a construção condicional explícita
  alternative: Reformular as condições como simples evidências de uma salvação já garantida
  rationale: O grego apresenta diretamente as condições com ἐάν e subjuntivo; a tradução preserva essa tensão exortativa sem impor uma explicação doutrinária.
- issue: Ação do Senhor sobre as preocupações
  choice: «ele mesmo as porá em ordem»
  alternative: «ele resolverá todos os seus problemas»
  rationale: A alternativa ampliaria a afirmação e sugeriria uma promessa de eliminação de toda dificuldade que o verbo não exige.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para o plural ὑμῶν. A repetição de «se» torna transparentes as duas condições coordenadas. «Senhor» conserva o título Κυρίῳ sem explicitação denominacional.
