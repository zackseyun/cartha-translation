translation:
  language: pt
  text: 'Eu lhe disse: “Senhor, por que ele mandou alguns para a torre, mas deixou outros com o senhor?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω αὐτῷ
  choice: Eu lhe perguntei
  rationale: Embora a forma grega diga literalmente “digo-lhe”, o enunciado é uma pergunta; o pretérito mantém a narrativa natural em português.
- source_word: Κύριε
  choice: Senhor
  rationale: Forma respeitosa de tratamento, adequada ao contexto e sem identificar o interlocutor com Deus.
- source_word: ἀπέλυσεν εἰς τὸν πύργον
  choice: mandou alguns para a torre
  rationale: Expressa o envio ou encaminhamento indicado pelo verbo no contexto; “para a torre” reproduz o destino.
- source_word: σοὶ κατέλειψεν
  choice: deixou outros com o senhor
  rationale: Preserva o contraste entre os que foram enviados à torre e os que ficaram sob os cuidados ou autoridade do interlocutor.
