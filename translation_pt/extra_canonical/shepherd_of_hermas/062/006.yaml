review_pass:
  verdict: revise
  source_fidelity: A redação fornecida traduz fielmente o trecho grego de 62:5 (κατέλιπεν... εἰς μετάνοιαν), mas não o segmento solicitado, 62:6. O texto-fonte de 62:6 pergunta pelos que estão coroados e entram na torre, identifica-os como os que lutaram contra o diabo e o venceram (em uma frase marcada entre colchetes na edição) e os caracteriza como pessoas que sofreram por causa da lei.
  naturalness: A proposta revisada mantém um registro moderno e claro. “Lutaram contra o diabo” comunica naturalmente o particípio συμπαλαίσαντες sem introduzir tecnicismo desnecessário.
  terminology: “Torre”, “diabo”, “lei” e “coroados” reproduzem os termos e imagens do texto. “Sofreram por causa da lei” traduz ὑπὲρ τοῦ νόμου sem especificar indevidamente a natureza do sofrimento.
  issues:
  - severity: high
    issue: 'Desalinhamento de segmento: o rascunho e a trilha inglesa correspondem a 62:5, não a 62:6.'
    rationale: O grego de 62:6 começa Τίνες οὖν... e trata dos coroados; o rascunho começa com Ὅσοι... παρέβησαν, material de 62:5. É necessária uma substituição integral para traduzir o segmento identificado.
  - severity: medium
    issue: A identificação dos vencedores do diabo está entre colchetes na edição-fonte.
    rationale: Os colchetes assinalam uma questão textual/editorial. A tradução deve conservar o conteúdo transmitido, com nota que informe de modo neutro que a frase é marcada como textualmente incerta na edição usada.
  revised_text: 'Então perguntei: “Quem são, Senhor, os que estão coroados e vão para a torre?”


    “São os que lutaram contra o diabo e o venceram; esses estão coroados.”¹ Estes são os que sofreram por causa da lei.'
  revised_footnotes:
  - marker: '1'
    text: A frase “São os que lutaram contra o diabo e o venceram; esses estão coroados” aparece entre colchetes na edição grega usada, indicando uma questão textual ou editorial.
    reason: Preserva a informação de incerteza sinalizada pela própria edição, sem suprimir nem reinterpretar a frase.
  revision_rationale: 'A revisão corrige o erro material de escopo: embora o identificador e o segmento do leitor sejam 62:6, o rascunho traduzia 62:5, assim como o excerto inglês de auditoria fornecido. O novo texto segue 62:6, preserva a alternância entre pergunta e resposta e assinala em nota a frase que a edição coloca entre colchetes.'
