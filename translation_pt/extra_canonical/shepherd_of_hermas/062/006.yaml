base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/006.yaml
  text: “All who transgressed the law which they received from him,” he says, “he left under my authority for repentance; but those who have already been pleasing to the law and have kept it, he has under his own authority.”
translation:
  language: pt
  text: “Todos os que transgrediram a lei que receberam dele”, diz ele, “foram deixados por ele sob a minha autoridade, para que se arrependam; mas os que já agradaram à lei e a guardaram, ele os mantém sob a sua própria autoridade.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέβησαν
  choice: transgrediram
  rationale: Expressa com precisão a ideia de ultrapassar ou violar a lei, em registro digno e corrente.
- source_word: εἰς τὴν ἐμὴν ἐξουσίαν κατέλιπεν αὐτούς
  choice: foram deixados por ele sob a minha autoridade
  rationale: Preserva a relação de autoridade e o agente indicado pelo texto grego, com ordem natural em português.
- source_word: εἰς μετάνοιαν
  choice: para que se arrependam
  rationale: Torna explícita em português a finalidade da entrega à autoridade, sem acrescentar conteúdo doutrinário.
- source_word: εὐηρέστησαν τῷ νόμῳ
  choice: agradaram à lei
  rationale: Mantém a formulação incomum e a personificação presentes no grego, em vez de reinterpretá-las silenciosamente como simples obediência.
- source_word: τετηρήκασιν αὐτόν
  choice: a guardaram
  rationale: ‘Guardar a lei’ é expressão portuguesa clara e tradicional que abrange observar e conservar fielmente.
theological_decisions:
- issue: Relação entre arrependimento e autoridade
  choice: “sob a minha autoridade, para que se arrependam”
  alternative: “entregues ao meu poder para a penitência”
  rationale: A tradução escolhida comunica finalidade e possibilidade de arrependimento sem importar uma concepção sacramental específica de penitência.
- issue: Sentido da expressão εὐηρέστησαν τῷ νόμῳ
  choice: “agradaram à lei”
  alternative: “viveram de modo agradável segundo a lei”
  rationale: O grego atribui à lei o papel de referente do agrado; a opção preserva essa tensão e evita resolver uma construção possivelmente semítica ou retórica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “autoridade” acompanha o contraste deliberado do original; a expressão incomum “agradaram à lei” foi preservada por fidelidade à ambiguidade textual.
