base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/004.yaml
  text: “You see the rods of each person; for the rods are the law. You see, then, many rods made worthless; and you will recognize all those who have not kept the law, and you will see the dwelling of each one.”
translation:
  language: pt
  text: Você vê as varas de cada um, pois as varas são a lei. Você vê, então, muitas varas deterioradas; reconhecerá todos os que não guardaram a lei e verá a morada de cada um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: varas
  rationale: Mantém a imagem concreta dos ramos ou bastões entregues a cada pessoa e corresponde ao uso recorrente no contexto imediato.
- source_word: ἠχρειωμένας
  choice: que se tornaram inúteis
  rationale: Reproduz o valor resultativo do particípio perfeito, indicando que as varas chegaram a uma condição de inutilidade ou deterioração.
- source_word: τηρήσαντας
  choice: guardaram
  rationale: Expressa a ideia de observar e cumprir a lei, em linguagem bíblica natural e sem reduzir o termo à mera conservação.
- source_word: κατοικίαν
  choice: morada
  rationale: Traduz literalmente a ideia de habitação ou lugar de residência, preservando a formulação escatológica sem explicá-la além do texto.
theological_decisions:
- issue: Identificação simbólica das varas com a lei
  choice: “as varas são a lei”
  alternative: “as varas representam a lei”
  rationale: A tradução conserva a identificação direta feita pelo grego, sem convertê-la numa explicação interpretativa.
- issue: Sentido de “morada”
  choice: Manter “morada” sem especificar destino, recompensa ou condenação
  alternative: “destino” ou “lugar designado”
  rationale: O contexto pode sugerir uma condição ou destino final, mas κατοικίαν designa literalmente morada; preservar o termo evita resolver uma possível tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “varas” e “cada um” foi mantida por sua função estrutural e simbólica no original.
