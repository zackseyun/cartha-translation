base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/009.yaml
  text: “But the others, who themselves also handed in their rods green and having side-shoots, yet without fruit—these are those who were hard-pressed for the law, but did not suffer, nor did they deny their law.
translation:
  language: pt
  text: Os outros também entregaram suas varas verdes, com brotos laterais, mas sem fruto. São os que foram oprimidos por causa da lei, mas não padeceram nem negaram a sua lei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: varas
  rationale: Mantém o objeto concreto da visão e a terminologia recorrente do contexto.
- source_word: παραφυάδας
  choice: brotos laterais
  rationale: Expressa com clareza os rebentos que nascem ao lado da haste principal.
- source_word: θλιβέντες
  choice: foram oprimidos
  rationale: Comunica pressão ou aflição sofrida por causa da lei e preserva sua distinção em relação a παθόντες.
- source_word: παθόντες
  choice: padeceram
  rationale: Preserva o contraste verbal com θλιβέντες sem especificar indevidamente morte ou martírio.
- source_word: νόμον
  choice: lei
  rationale: Corresponde ao símbolo explicitamente interpretado como a lei de Deus no contexto imediato.
theological_decisions:
- issue: Natureza do sofrimento indicado por παθόντες
  choice: não padeceram
  alternative: não foram martirizados
  rationale: O grego não explicita morte ou martírio; a formulação mantém a possível dimensão persecutória sem transformar uma inferência contextual em afirmação.
- issue: Referente de αὐτῶν em “sua lei”
  choice: a sua lei
  alternative: a lei
  rationale: Mantém o pronome do texto grego e sua relação identitária com a comunidade, sem resolver ou apagar a formulação original.
translation_notes:
  register: Português atual, claro e digno, com estrutura dividida em duas frases para facilitar a leitura. O contraste entre opressão e padecimento foi preservado, embora permaneça deliberadamente não especificado.
