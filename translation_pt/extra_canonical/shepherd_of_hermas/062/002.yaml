base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/002.yaml
  text: “Listen,” he says. “This great tree that covers plains and mountains and the whole earth is the law of God given to the whole world. And this law is the Son of God, proclaimed to the ends of the earth; and the peoples under the shade are those who heard the proclamation and believed in him.
translation:
  language: pt
  text: “Escute”, diz ele. “Esta grande árvore, que cobre planícies, montanhas e toda a terra, é a lei de Deus dada ao mundo inteiro. E essa lei é o Filho de Deus, proclamado até os confins da terra. Os povos que estão debaixo da sua sombra são os que ouviram a proclamação e creram nele.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄκουε
  choice: Escute
  rationale: Imperativo natural e direto em português moderno, preservando o singular do grego.
- source_word: τὸ δένδρον τοῦτο τὸ μέγα
  choice: Esta grande árvore
  rationale: Mantém a identificação demonstrativa e a ênfase descritiva sem rigidez sintática.
- source_word: τὸ σκεπάζον
  choice: que cobre
  rationale: Reproduz de modo claro a imagem da árvore que se estende sobre toda a paisagem.
- source_word: νόμος Θεοῦ
  choice: lei de Deus
  rationale: Equivalente direto de νόμος Θεοῦ, preservando a formulação teológica do texto.
- source_word: κηρυχθεὶς
  choice: proclamado
  rationale: Preserva a ideia de anúncio público, além de se ligar naturalmente ao substantivo κήρυγμα na frase seguinte.
- source_word: εἰς τὰ πέρατα τῆς γῆς
  choice: até os confins da terra
  rationale: Expressão portuguesa digna e corrente que mantém o alcance universal do original.
- source_word: ὑπὸ τὴν σκέπην
  choice: debaixo da sua sombra
  rationale: No contexto de uma árvore, 'sombra' comunica naturalmente a cobertura protetora expressa por σκέπη.
- source_word: τοῦ κηρύγματος
  choice: a proclamação
  rationale: Mantém a relação lexical com 'proclamado' e evita especificar como 'evangelho' algo que o grego deixa como proclamação.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: creram nele
  rationale: Tradução idiomática de πιστεύω εἰς com referente pessoal masculino.
theological_decisions:
- issue: Identificação entre a lei e o Filho de Deus
  choice: “essa lei é o Filho de Deus”
  alternative: “essa lei representa o Filho de Deus”
  rationale: O grego usa explicitamente ἐστίν, 'é'; inserir 'representa' resolveria ou suavizaria indevidamente a afirmação teológica do autor.
- issue: Referente de αὐτόν em “creram nele”
  choice: Referir o pronome ao Filho de Deus
  alternative: “creram na proclamação”
  rationale: A forma masculina αὐτόν concorda naturalmente com υἱός, 'Filho', enquanto κήρυγμα é neutro; a tradução preserva essa referência gramatical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “lei” foi mantida porque estrutura a interpretação alegórica do texto. Não foram necessárias notas de rodapé para esta unidade.
