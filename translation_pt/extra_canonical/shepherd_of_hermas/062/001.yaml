base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/001.yaml
  text: I say to him, “Sir, make known to me what this tree is; for I am perplexed about it, because, though so many branches have been cut off, the tree is sound, and nothing appears to have been cut away from it. About this, therefore, I am at a loss.”
translation:
  language: pt
  text: 'Eu lhe digo: “Senhor, explica-me o que é esta árvore, pois estou perplexo a respeito dela: embora tantos ramos tenham sido cortados, a árvore continua saudável, e não se vê sinal algum de que algo tenha sido cortado dela. É isso que me deixa perplexo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Forma respeitosa de tratamento, natural no registro religioso e coerente com a relação entre o narrador e seu interlocutor.
- source_word: γνώρισόν μοι
  choice: explica-me
  rationale: No contexto, o pedido não é apenas para identificar a árvore, mas para tornar conhecido seu significado; “explica-me” expressa isso com naturalidade.
- source_word: ἀποροῦμαι
  choice: estou perplexo / me deixa perplexo
  rationale: Preserva a ideia de não saber como compreender o fenômeno, sem recorrer ao menos corrente “estou sem saber o que pensar”.
- source_word: κλάδων
  choice: ramos
  rationale: Equivalente botânico comum e preciso.
- source_word: ὑγιές
  choice: saudável
  rationale: Mantém a metáfora orgânica do grego, indicando que a árvore permanece íntegra e vigorosa.
- source_word: οὐδὲν φαίνεται κεκομμένον ἀπ' αὐτοῦ
  choice: não se vê sinal algum de que algo tenha sido cortado dela
  rationale: Torna explícito o valor aparente de φαίνεται e comunica idiomaticamente que a árvore não exibe vestígios dos cortes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente para leitura pública. A repetição de ἀποροῦμαι foi preservada por meio de duas formulações próximas, evitando monotonia excessiva sem apagar a ênfase do original.
