  text: “Who then, Sir,” I say, “are the ones who are crowned and go into the tower?”
translation:
  language: pt
  text: — Senhor, quem são, então, os que estão coroados e vão para a torre? — perguntei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστεφανωμένοι
  choice: estão coroados
  rationale: 'Preserva o sentido do particípio perfeito: eles receberam coroas e continuam nessa condição.'
- source_word: πύργον
  choice: torre
  rationale: Equivalente direto e coerente com a imagem arquitetônica recorrente na obra.
- source_word: ὑπάγοντες
  choice: vão
  rationale: Expressa em português natural o movimento em direção à torre, sem acrescentar a ideia mais específica de entrada.
- source_word: κύριε
  choice: senhor
  rationale: Mantém o tratamento respeitoso dirigido ao interlocutor, com inicial minúscula porque aqui não funciona como nome ou título divino.
