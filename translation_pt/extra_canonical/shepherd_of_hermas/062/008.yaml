base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/008.yaml
  text: “[Those who grappled with the devil and overcame him,” he says, “are crowned.] These are the ones who suffered for the law.
translation:
  language: pt
  text: “[Os que lutaram contra o diabo e o venceram”, diz ele, “estão coroados.]”[a] Estes são os que sofreram pela lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase entre colchetes tem transmissão textual incerta.
    reason: Os colchetes na edição grega sinalizam dúvida textual; a nota informa o leitor sem retirar a passagem do texto.
lexical_decisions:
- source_word: συμπαλαίσαντες
  choice: lutaram contra
  rationale: Expressa em português corrente a imagem de entrar em combate corpo a corpo com um adversário, sem tornar a frase artificial.
- source_word: ἐνίκησαν
  choice: venceram
  rationale: Preserva diretamente o sentido de alcançar vitória sobre o diabo.
- source_word: ἐστεφανωμένοι εἰσίν
  choice: estão coroados
  rationale: Mantém tanto a imagem da coroa concedida aos vencedores quanto o estado resultante expresso pelo perfeito grego.
- source_word: ὑπὲρ τοῦ νόμου παθόντες
  choice: sofreram por causa da lei
  rationale: Traduz ὑπέρ de modo natural e conserva a lei como motivo do sofrimento, sem especificar uma forma de perseguição não declarada no texto.
theological_decisions:
- issue: Identidade e função da “lei”
  choice: lei
  alternative: Lei / ensinamento divino
  rationale: O grego traz νόμος e o contexto imediato o identifica com o Filho de Deus; a tradução mantém a formulação e a tensão próprias da obra, sem substituí-la por uma interpretação teológica.
- issue: Condição dos vencedores
  choice: estão coroados
  alternative: recebem a coroa
  rationale: A forma escolhida preserva o valor resultativo do particípio perfeito e evita decidir se a coroação é um ato presente, passado ou escatológico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção entre colchetes foi mantida por refletir a incerteza textual indicada na fonte.
