base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/010.yaml
  text: “And those who handed in green rods just as they received them are dignified and righteous and have walked with a very pure heart, and have guarded the commandments of the Lord. The rest you will learn when I examine these rods that have been planted and watered.”
translation:
  language: pt
  text: E os que entregaram as varas verdes tal como as receberam são pessoas dignas e justas, que viveram com o coração inteiramente puro e guardaram os mandamentos do Senhor. O restante você saberá quando eu examinar essas varas que foram plantadas e regadas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: varas
  rationale: Mantém a imagem concreta recorrente da comparação e corresponde naturalmente ao objeto entregue, plantado e regado.
- source_word: σεμνοὶ
  choice: pessoas dignas
  rationale: Expressa respeitabilidade moral e seriedade sem restringir o termo a uma qualidade meramente cerimonial.
- source_word: πορευθέντες
  choice: viveram
  rationale: O sentido idiomático é conduzir a vida; 'viveram' soa natural em português e preserva a dimensão ética da caminhada.
- source_word: λίαν ... ἐν καθαρᾷ καρδίᾳ
  choice: com o coração inteiramente puro
  rationale: Liga o intensificador à pureza do coração de maneira idiomática, sem exagerar para uma afirmação técnica de perfeição.
- source_word: πεφυλακότες
  choice: guardaram
  rationale: Preserva a ideia de observar e conservar fielmente os mandamentos.
- source_word: κατανοήσω
  choice: examinar
  rationale: No contexto da inspeção das varas, indica observação atenta e avaliação.
theological_decisions:
- issue: Força moral de σεμνοὶ καὶ δίκαιοι
  choice: pessoas dignas e justas
  alternative: honrados e justos
  rationale: A formulação escolhida mantém as duas qualificações distintas e evita atribuir ao primeiro termo um sentido confessional específico.
- issue: Intensificação de λίαν
  choice: coração inteiramente puro
  alternative: viveram de modo muito puro de coração
  rationale: A sintaxe grega permite alguma flexibilidade na ligação do advérbio; a opção adotada comunica a intensidade com clareza sem resolver a expressão como doutrina de impecabilidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O discurso direto usa 'você' por legibilidade contemporânea, e a metáfora das varas é mantida de forma consistente.
