base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/003.yaml
  text: “And the great and glorious angel is Michael, who has authority over this people and governs them. For he is the one who gives the law to them, into the hearts of those who believe; therefore he himself visits those to whom he gave it, to see whether they have kept it.
translation:
  language: pt
  text: E o grande e glorioso anjo é Miguel, que tem autoridade sobre este povo e o governa. Pois é ele quem lhes dá a lei, colocando-a no coração dos que creem. Por isso, ele mesmo visita aqueles a quem a deu, para ver se a guardaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος ὁ μέγας καὶ ἔνδοξος
  choice: o grande e glorioso anjo
  rationale: Reproduz diretamente os adjetivos gregos, preservando o tom elevado e a identificação angélica.
- source_word: τὴν ἐξουσίαν
  choice: autoridade
  rationale: Expressa o poder ou jurisdição que Miguel exerce sobre o povo sem acrescentar uma noção denominacional.
- source_word: διακυβερνῶν
  choice: o governa
  rationale: Traduz o sentido de dirigir ou administrar de modo contínuo, com linguagem natural em português.
- source_word: ὁ διδοὺς αὐτοῖς τὸν νόμον εἰς τὰς καρδίας
  choice: quem lhes dá a lei, colocando-a no coração
  rationale: A explicitação sintática mantém a imagem grega da lei dada para dentro do coração e evita a formulação pouco natural 'dá a lei nos corações'.
- source_word: ἐπισκέπτεται
  choice: visita
  rationale: Preserva o verbo concreto do grego, que no contexto também implica inspeção ou averiguação.
- source_word: τετηρήκασιν
  choice: a guardaram
  rationale: Mantém o sentido de observar e conservar fielmente a lei, em formulação bíblica ainda corrente e compreensível.
theological_decisions:
- issue: Função de Miguel em relação à lei e ao povo
  choice: Traduzir literalmente que Miguel tem autoridade, governa, dá a lei ao coração dos crentes e os visita.
  alternative: Reformular Miguel apenas como mensageiro ou protetor, ou identificar a lei com uma doutrina teológica posterior.
  rationale: O texto atribui explicitamente essas ações a Miguel. A tradução conserva essa tensão teológica própria da obra sem harmonizá-la com sistemas posteriores.
- issue: Sentido de ἐπισκέπτεται
  choice: visita, com a finalidade expressa de verificar se guardaram a lei
  alternative: julga ou inspeciona
  rationale: ‘Visita’ mantém a amplitude semântica do verbo; a oração final já deixa claro o aspecto de averiguação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva a cadência explicativa do grego e evita arcaísmos desnecessários.
