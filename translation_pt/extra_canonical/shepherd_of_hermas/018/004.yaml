base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/004.yaml
  text: And as she was going, I asked her to reveal to me about the three forms in which she had appeared to me. She answered me and said, “About these, you must ask another, so that it may be revealed to you.”
translation:
  language: pt
  text: 'Enquanto ela se ia embora, pedi-lhe que me revelasse a respeito das três formas nas quais havia aparecido. Ela me respondeu: “Sobre isso, você deve perguntar a outro, para que lhe seja revelado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγουσαν
  choice: Enquanto ela se afastava
  rationale: O particípio indica que ela estava indo embora; esta formulação preserva a simultaneidade e soa natural em português.
- source_word: ἀποκαλύψῃ
  choice: explicasse
  rationale: Neste contexto, o pedido visa tornar conhecido o significado das formas. “Explicasse” é natural no primeiro uso, enquanto a oração final conserva “revelado”, refletindo a linguagem de revelação do texto.
- source_word: μορφῶν
  choice: formas
  rationale: Equivalente direto que mantém aberta a natureza exata das diferentes aparências.
- source_word: ἐνεφανίσθη
  choice: havia aparecido
  rationale: Expressa uma manifestação visível anterior ao momento narrado.
- source_word: ἕτερον
  choice: outro
  rationale: Preserva a referência indefinida do grego, sem identificar quem deveria ser consultado.
theological_decisions:
- issue: Identidade daquele a quem Hermas deve perguntar
  choice: outro
  alternative: outra pessoa
  rationale: O grego usa apenas ἕτερον e não identifica o referente; a tradução preserva essa ambiguidade.
- issue: Natureza das três manifestações
  choice: três formas sob as quais havia aparecido
  alternative: três aparências em que se manifestara
  rationale: A redação evita definir se houve transformação ontológica, visão simbólica ou mera mudança de aparência.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” no discurso direto. A sintaxe foi levemente naturalizada sem eliminar as repetições conceituais de revelação e aparecimento.
