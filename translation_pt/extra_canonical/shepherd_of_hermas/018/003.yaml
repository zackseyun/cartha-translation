base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/003.yaml
  text: X. When she had ceased speaking with me, the six young men who were building came and carried her to the tower, and four others lifted the cushioned seat and carried it also to the tower. I did not see their faces, because they were turned away.
translation:
  language: pt
  text: X. Quando ela terminou de falar comigo, chegaram os seis jovens que estavam construindo e a levaram para a torre. Outros quatro ergueram o assento acolchoado e também o levaram para a torre. Não vi o rosto deles, porque estavam de costas para mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλιον
  choice: assento acolchoado
  rationale: O termo raro designa o móvel sobre o qual a mulher estava sentada; “assento acolchoado” comunica de modo natural a ideia provável de um banco ou divã provido de almofada, sem especificar excessivamente sua forma.
- source_word: ἀπήνεγκαν
  choice: levaram
  rationale: Expressa com naturalidade o movimento de transportar a mulher e depois o assento até a torre.
- source_word: ἀπεστραμμένοι ἦσαν
  choice: estavam de costas para mim
  rationale: Torna explícito, em português corrente, que os rostos não podiam ser vistos porque eles estavam voltados para o lado oposto ao narrador.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. Preserva a numeração da seção e a imagem concreta da torre, sem acrescentar interpretação simbólica.
