  source_fidelity: A tradução reproduz adequadamente o pedido por uma revelação completa acerca das três formas da anciã e a repreensão subsequente. Contudo, «hesitações» enfraquece διψυχίαι, termo que evoca divisão interior ou ânimo dividido, e a última coordenação fica sintaticamente incompleta e menos direta que o grego.
  naturalness: O texto é claro e de registro apropriado, mas «e o fato de o coração de vocês não estar voltado» soa truncado após «São ... que os tornam». Uma formulação verbal coordenada é mais natural em português.
  terminology: «Anciã», «Senhor», «insensatos» e «formas» são escolhas adequadas. «Divisão interior» comunica melhor a imagem e o alcance moral-espiritual de διψυχίαι sem impor uma leitura denominacional como «hipocrisia».
