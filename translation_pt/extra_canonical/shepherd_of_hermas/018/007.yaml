base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/007.yaml
  text: 'And answering him I said, “Lord, this only I ask—that concerning the three forms of the aged woman the revelation may become complete.” He answered me and said: “How long will you be senseless? Rather, your double-mindednesses make you senseless, and your heart is not toward the Lord.”'
translation:
  language: pt
  text: 'E, respondendo-lhe, eu disse: “Senhor, peço apenas isto: que a revelação acerca das três formas da anciã seja completa.” Ele me respondeu: “Até quando vocês serão insensatos? Em vez disso, a divisão interior de vocês os torna insensatos, e vocês não têm o coração voltado para o Senhor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσύνετοι
  choice: insensatos
  rationale: Expressa falta de entendimento ou discernimento sem sugerir mera ignorância intelectual.
- source_word: διψυχίαι
  choice: hesitações
  rationale: O plural indica disposições divididas ou vacilantes; “hesitações” oferece uma formulação natural em português e preserva a ideia de inconstância interior.
- source_word: μορφῶν
  choice: formas
  rationale: Mantém o sentido amplo das diferentes aparências assumidas pela anciã nas visões.
- source_word: ὁλοτελής
  choice: se complete
  rationale: No contexto, descreve uma revelação que chega à sua inteireza ou plena explicação.
- source_word: πρὸς τὸν Κύριον
  choice: voltado para o Senhor
  rationale: Reproduz naturalmente a orientação relacional e espiritual expressa pela preposição grega.
theological_decisions:
- issue: Sentido de διψυχίαι
  choice: hesitações
  alternative: ânimo dividido / duplicidade
  rationale: O termo pode designar dúvida, vacilação ou divisão interior. “Hesitações” evita transformar o texto numa acusação moral de hipocrisia, embora torne menos explícita a imagem de uma alma dividida.
- issue: Causalidade da oração final
  choice: “e o fato de o coração de vocês não estar voltado para o Senhor” coordenado com as hesitações
  alternative: “porque o coração de vocês não está voltado para o Senhor”
  rationale: 'O grego coordena dois elementos que os tornam insensatos: suas διψυχίαι e o não terem o coração dirigido ao Senhor. A tradução preserva essa estrutura.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural em “vocês” para refletir a mudança do interlocutor individual para a censura coletiva. Mantém “Senhor” e “anciã” em registro compatível com literatura cristã antiga.
