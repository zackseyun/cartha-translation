  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/008.yaml
  text: Answering him again, I said, “But from you, Lord, we shall learn these things more precisely.”
translation:
  language: pt
  text: 'Respondendo-lhe de novo, eu disse: “Mas é de ti, senhor, que saberemos isso com mais precisão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... πάλιν εἶπον
  choice: Respondendo-lhe novamente, eu disse
  rationale: Preserva o particípio seguido do verbo principal e expressa naturalmente a repetição indicada por πάλιν.
- source_word: ἀπὸ σοῦ
  choice: por meio de ti
  rationale: Neste contexto, ἀπό indica a pessoa de quem procede a informação; a formulação evita a ambiguidade pouco natural de 'de ti' em português.
- source_word: κύριε
  choice: senhor
  rationale: Mantém a forma respeitosa de tratamento, sem decidir além do contexto que o interlocutor seja o Senhor divino; por isso, usa-se inicial minúscula.
- source_word: ἀκριβέστερον
  choice: com maior exatidão
  rationale: 'Reproduz o comparativo adverbial: o interlocutor permitirá um conhecimento mais exato ou preciso.'
- source_word: αὐτὰ γνωσόμεθα
  choice: conheceremos essas coisas
  rationale: Mantém o futuro médio de γινώσκω e explicita naturalmente o referente neutro plural em português.
theological_decisions:
- issue: Identidade indicada pelo vocativo κύριε
  choice: senhor, com inicial minúscula
  alternative: Senhor, com inicial maiúscula
  rationale: O interlocutor imediato é o jovem da visão. A tradução preserva o tratamento respeitoso sem identificá-lo automaticamente com Deus ou Cristo.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. O futuro 'conheceremos' preserva a forma verbal grega, e 'com maior exatidão' mantém a força comparativa de ἀκριβέστερον.
