review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o sentido geral do grego. Contudo, «vive pedindo» torna ὑπὸ χεῖρα mais coloquial e mais enfático do que o necessário, e «revelações mais intensas» é menos preciso que «revelações mais poderosas/fortes» para ἰσχυροτέρας.
  naturalness: O texto é claro e fluente em português moderno. Pequenos ajustes preservam um registro narrativo digno e evitam uma formulação coloquial no discurso do jovem.
  terminology: «Anciã», «humildade», «jejuar», «corpo» e «revelação» são escolhas adequadas. «Mais poderosas» reproduz melhor a comparação de força presente no original, sem atribuir maior autoridade às revelações.
  issues:
  - severity: low
    issue: «vive pedindo revelações» para ὑπὸ χεῖρα αἰτεῖς
    rationale: A expressão grega é difícil, mas no contexto comunica pedir repetidamente ou insistentemente. «Vive pedindo» é coloquial e pode soar recriminatório; «tem pedido repetidamente» é mais neutro e natural no registro da obra.
  - severity: low
    issue: «revelações mais intensas» para ἰσχυροτέρας ἀποκαλύψεις
    rationale: ἰσχυροτέρας designa primariamente maior força ou poder. «Mais poderosas» preserva essa imagem comparativa de modo mais direto.
  - severity: low
    issue: «por pedir demais» deixa pouco explícito o plural πολλά
    rationale: O grego adverte contra pedir muitas coisas. «Por pedir tantas coisas» mantém a pluralidade sem decidir que se trata exclusivamente de muitas revelações.
