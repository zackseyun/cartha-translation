base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/006.yaml
  text: 'About these things I was very much distressed, wanting to know this revelation. And I see the aged woman in a vision of the night, saying to me: “Every inquiry has need of humility; therefore fast, and you will receive what you ask from the Lord.” So I fasted one day, and on that very night a young man appeared to me and said to me: “Since you are asking for revelations in prayer, watch lest by asking for many things you harm your flesh. These revelations are sufficient for you. Are you able to see revelations more powerful than those you have seen?”'
translation:
  language: pt
  text: 'Eu estava muito angustiado com essas coisas, pois queria compreender essa revelação. Então vi a anciã numa visão noturna, e ela me disse: “Toda indagação requer humildade. Portanto, jejue, e você receberá do Senhor aquilo que pede.” Jejuei, então, por um dia, e naquela mesma noite um jovem apareceu-me e me disse: “Visto que você tem pedido repetidamente revelações em oração, tome cuidado para não prejudicar o seu corpo por pedir tantas coisas. Estas revelações são suficientes para você. Você é capaz de ver revelações mais poderosas do que as que viu?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: muito angustiado
  rationale: Expressa tristeza ou aflição profunda de modo natural e digno em português.
- source_word: πρεσβυτέραν
  choice: anciã
  rationale: Mantém a referência à mulher idosa já presente na visão, sem o tom potencialmente depreciativo de “velha”.
- source_word: Πᾶσα ἐρώτησις ταπεινοφροσύνης χρήζει
  choice: Toda indagação requer humildade
  rationale: Preserva a formulação geral e o sentido de necessidade expresso por χρήζει.
- source_word: ὑπὸ χεῖρα αἰτεῖς
  choice: vive pedindo
  rationale: A expressão textual é incomum; no contexto, indica a ação insistente ou reiterada de pedir, não apenas um pedido pontual.
- source_word: ἐν δεήσει
  choice: em oração
  rationale: δέησις designa súplica ou pedido dirigido a Deus; “em oração” é claro e natural no contexto.
- source_word: τὴν σάρκα
  choice: o seu corpo
  rationale: Neste contexto de jejum e possível dano físico, “corpo” comunica melhor o referente concreto de σάρξ ao leitor moderno.
- source_word: ἰσχυροτέρας ἀποκαλύψεις
  choice: revelações mais intensas
  rationale: Mantém a comparação de força de ἰσχυρός sem sugerir que as revelações sejam mais autoritativas ou verdadeiras.
- source_word: ἰδεῖν
  choice: contemplar
  rationale: No contexto visionário, traduz o ato de ver ou experimentar uma visão com linguagem digna e natural.
theological_decisions:
- issue: Relação entre jejum e recebimento da resposta divina
  choice: “jejue, e você receberá do Senhor”
  alternative: “jejue para receber do Senhor”
  rationale: Preserva a sequência imperativa e futura do grego sem explicitar uma causalidade ou mecanismo meritório que o texto não formula.
- issue: Pedido de revelações e risco corporal
  choice: O dano é apresentado como possível consequência de pedir demais, no contexto do jejum.
  alternative: Interpretar o pedido de revelações em si como espiritualmente ilícito.
  rationale: O texto menciona expressamente prejuízo à σάρξ e acaba de narrar um jejum; a tradução evita acrescentar uma condenação teológica não expressa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A narração alterna naturalmente entre passado e o presente visionário (“vi”), regularizado aqui como sequência narrativa em português. O tratamento por “você” oferece clareza internacional com boa naturalidade no Brasil; os imperativos foram adequados a esse tratamento.
