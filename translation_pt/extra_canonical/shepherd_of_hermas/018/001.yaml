base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/001.yaml
  text: Be made holy from all wickedness and from all crookedness. But you do not want to depart from your wickedness. Now then, listen to me and be at peace among yourselves, and look after one another and support one another; and do not alone partake of God’s creatures in an overflow of abundance, but share also with those who are in want. For some, from their many foods, bring weakness upon the flesh and ruin their flesh; but the flesh of those who do not have food is ruined because they do not have enough nourishment, and their body is destroyed. This lack of moderation then is harmful to you who have and do not share with those who lack. Look to the judgment that is coming. Therefore, you who are well-off, seek out the hungry while the tower is not yet finished; for after the tower has been finished you will want to do good, and you will not have a place. So watch, you who pride yourselves in your wealth, lest those in need should groan, and their groaning go up to the Lord, and you
    be shut out together with your useless goods outside the door of the tower.
translation:
  language: pt
  text: 'Santifiquem-se, afastando-se de toda maldade e de toda perversidade. Mas vocês não querem abandonar a sua maldade. Agora, portanto, escutem-me: vivam em paz uns com os outros, cuidem uns dos outros e ajudem uns aos outros. Não desfrutem sozinhos, em meio à abundância transbordante, das coisas criadas por Deus; compartilhem também com os necessitados. Pois alguns, por causa da grande quantidade de alimentos, trazem fraqueza sobre a própria carne e a arruínam; mas a carne dos que não têm alimento se arruína por não receber nutrição suficiente, e o corpo deles é destruído. Portanto, essa falta de equilíbrio é prejudicial a vocês que têm e não compartilham com os necessitados. Atentem para o juízo que está chegando. Assim, vocês que possuem mais, procurem os famintos enquanto a torre ainda não foi concluída, pois, depois que a torre estiver concluída, vocês desejarão fazer o bem, mas não terão oportunidade. Portanto, tenham cuidado, vocês que se orgulham de sua riqueza, para que os
    necessitados não venham a gemer, e o gemido deles suba ao Senhor, e vocês sejam deixados do lado de fora da porta da torre, junto com os seus bens inúteis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁγιασθῆτε ἀπό
  choice: Santifiquem-se, afastando-se de
  rationale: O imperativo passivo pode ser entendido como exortação à purificação; a formulação mantém a ideia de santificação e torna explícita a separação indicada por ἀπό, sem atribuir silenciosamente uma doutrina específica ao passivo.
- source_word: σκολιότητος
  choice: perversidade
  rationale: No contexto moral, designa o que é tortuoso ou desonesto; “perversidade” é natural e preserva a força ética.
- source_word: ἐπισκέπτεσθε
  choice: cuidem
  rationale: O verbo envolve visitar com atenção e prestar assistência; “cuidem” comunica sua função prática no contexto comunitário.
- source_word: ἀντιλαμβάνεσθε
  choice: ajudem
  rationale: Expressa tomar o lado de alguém, amparar ou prestar auxílio; “ajudem” é claro e idiomático.
- source_word: τὰ κτίσματα τοῦ Θεοῦ
  choice: as coisas criadas por Deus
  rationale: Mantém a referência ampla aos bens da criação, especialmente os alimentos mencionados em seguida, sem restringi-la antecipadamente.
- source_word: ἐκ καταχύματος
  choice: em meio à abundância transbordante
  rationale: A expressão rara sugere profusão ou excesso; a tradução preserva a imagem de abundância desmedida.
- source_word: ἀσυνκρασία
  choice: falta de equilíbrio
  rationale: O termo aponta para desproporção ou falta de harmonia entre excesso e carência; a escolha reproduz a crítica social do contraste.
- source_word: οἱ ὑπερέχοντες
  choice: vocês que possuem mais
  rationale: Aqui indica os que estão em condição superior ou têm abundância; a formulação evita tanto um sentido meramente hierárquico quanto a paráfrase excessiva “ricos”.
- source_word: οὐχ ἕξετε τόπον
  choice: não terão oportunidade
  rationale: Literalmente, “não terão lugar”; no contexto escatológico, significa que já não haverá ocasião ou possibilidade para fazer o bem. A tradução natural conserva esse sentido.
- source_word: '[ἀσχέτων] ἀγαθῶν'
  choice: bens inúteis
  rationale: A leitura está editorialmente marcada como incerta; se aceita, qualifica os bens como sem proveito. A tradução segue o texto fornecido sem sobrecarregar o corpo do trecho com crítica textual.
theological_decisions:
- issue: Natureza do juízo e da torre
  choice: Manter “juízo” e “torre” sem explicação interpretativa no texto
  alternative: Identificar explicitamente a torre com a Igreja ou com uma realidade escatológica específica
  rationale: O trecho pressupõe o simbolismo desenvolvido na visão, mas esta unidade não o explica; preservar os termos evita impor uma interpretação denominacional ou resolver além da evidência imediata.
- issue: Sentido de ἁγιασθῆτε
  choice: “Santifiquem-se, afastando-se de”
  alternative: “Sejam purificados de” ou “tornem-se santos, livres de”
  rationale: A escolha conserva a linguagem de santificação e a responsabilidade exortativa, sem definir se a ação é exclusivamente divina, humana ou cooperativa.
- issue: Consequência de ser deixado fora da torre
  choice: Traduzir diretamente, sem equiparar explicitamente a condenação eterna
  alternative: Explicitar como exclusão da salvação
  rationale: A imagem é solene e judicial, mas o texto não formula aqui uma equivalência doutrinária completa; a ambiguidade simbólica deve permanecer.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas brasileiras naturais como “vocês”. O paralelismo exortativo e o contraste entre excesso e privação foram preservados. Não há marcadores de nota no texto porque nenhuma nota de publicação foi necessária.
