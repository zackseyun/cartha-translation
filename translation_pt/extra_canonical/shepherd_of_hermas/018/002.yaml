  terminology: «Os que presidem à igreja» e «os que ocupam os primeiros assentos» evitam anacronismo institucional. «Envenenadores», «drogas» e «veneno» mantêm a imagem deliberadamente incisiva do texto. «Instruir/instrução» preserva a repetição lexical sem restringir παιδεία a punição.
