base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/002.yaml
  text: 'I say to you who lead the church and to the first-seaters: do not become like poisoners. Poisoners carry their drugs in boxes; but you carry your drug and your poison in your heart. You are encrusted and do not wish to cleanse your hearts and to bring your understanding together as one in a pure heart, so that you may receive mercy from the great King. Watch then, children, lest these dissensions of yours deprive you of life. How can you wish to train the Lord’s chosen ones when you yourselves do not have training? Train one another and be at peace among yourselves, so that I also, standing joyfully before the Father, may give an account on behalf of you all to your Lord.'
translation:
  language: pt
  text: 'Agora, portanto, digo a vocês que presidem à igreja e ocupam os primeiros assentos: não se tornem semelhantes a envenenadores. Os envenenadores carregam suas drogas em caixas; vocês, porém, carregam sua droga e seu veneno no coração. Vocês estão endurecidos e não querem purificar os corações nem harmonizar o entendimento de vocês em unidade, com um coração puro, para receberem misericórdia do grande Rei. Portanto, tenham cuidado, filhos, para que essas divisões entre vocês não os privem da vida. Como vocês podem querer instruir os escolhidos do Senhor, se vocês mesmos não têm instrução? Instruam uns aos outros e vivam em paz entre eles,[a] para que também eu, de pé e alegre diante do Pai, possa prestar contas por todos vocês ao Senhor de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme uma leitura contextual: «vivam em paz entre vocês». O texto grego diz literalmente «entre eles», provavelmente referindo-se aos escolhidos do Senhor.'
    reason: Preserva a diferença entre a forma grega αὐτοῖς e a interpretação contextual adotada por algumas traduções.
lexical_decisions:
- source_word: οἱ προηγούμενοι τῆς ἐκκλησίας
  choice: os que presidem à igreja
  rationale: Expressa liderança ou precedência sem importar um título eclesiástico posterior específico.
- source_word: οἱ πρωτοκαθεδρῖται
  choice: os que ocupam os primeiros assentos
  rationale: Mantém a imagem concreta e a possível crítica ao status dos líderes, em vez de substituí-la por um cargo denominacional.
- source_word: φαρμακοί / φάρμακα
  choice: envenenadores / drogas
  rationale: O contexto explicita ἰός, “veneno”, favorecendo pessoas que lidam com substâncias nocivas; “drogas” preserva a correspondência lexical e a imagem das caixas.
- source_word: ἐνεσκιρωμένοι
  choice: endurecidos
  rationale: O termo raro sugere um estado endurecido ou incrustado; “endurecidos” comunica naturalmente a resistência interior indicada pela recusa em purificar o coração.
- source_word: συγκεράσαι ... τὴν φρόνησιν ἐπὶ τὸ αὐτό
  choice: unir seu modo de pensar em um só
  rationale: Preserva a metáfora de combinar ou fundir a disposição mental em unidade, sem tornar a frase excessivamente literal.
- source_word: παιδεύειν / παιδείαν
  choice: instruir / instrução
  rationale: Mantém a repetição deliberada e abrange formação e disciplina, sem restringir o sentido a punição.
theological_decisions:
- issue: Identidade e estrutura dos líderes da igreja
  choice: 'linguagem funcional e imagética: “presidem” e “ocupam os primeiros assentos”'
  alternative: “dirigentes” e “dignitários” ou títulos eclesiásticos posteriores
  rationale: O grego descreve posição e precedência, mas não exige equivalência com um ofício denominacional moderno.
- issue: Referentes de “Pai” e “Senhor de vocês”
  choice: preservar separadamente “o Pai” e “o Senhor de vocês”
  alternative: harmonizar ambos como referência explícita à mesma pessoa divina
  rationale: A formulação do texto mantém essa distinção retórica; a tradução não deve resolvê-la teologicamente.
- issue: Referente de αὐτοῖς em “vivam em paz entre eles”
  choice: manter a terceira pessoa e explicar a ambiguidade em nota
  alternative: “vivam em paz entre vocês”
  rationale: O manuscrito impresso traz αὐτοῖς, que aponta mais naturalmente para “eles”, provavelmente os escolhidos, embora a forma possa refletir uma variação textual ou uma referência menos direta.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Mantiveram-se a repreensão incisiva, as repetições e as imagens concretas do original; evitou-se terminologia denominacional específica.
