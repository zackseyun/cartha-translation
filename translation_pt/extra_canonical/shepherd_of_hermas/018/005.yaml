base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/005.yaml
  text: She appeared to me, brothers, in the first vision—the one last year—very aged and sitting on a chair. And in the second vision her appearance was younger, but her flesh and her hair were older, and as she stood she spoke to me; and she was more cheerful than before. And in the third vision she was wholly younger and most distinguished in beauty, only her hair was older; and she was cheerful to the end and was seated on a cushioned seat.
translation:
  language: pt
  text: Irmãos, na primeira visão, a do ano passado, ela me apareceu muito idosa e sentada numa cadeira. Na segunda visão, sua aparência era mais jovem, mas seu corpo e seus cabelos eram mais envelhecidos; ela falava comigo de pé e estava mais alegre do que antes. Na terceira visão, estava inteiramente rejuvenescida e de beleza extraordinária; somente seus cabelos eram mais envelhecidos. Estava alegre até o fim[a] e sentada num assento acolchoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava inteiramente alegre”.'
    reason: A expressão εἰς τέλος pode ter sentido temporal, “até o fim”, ou intensivo, “completamente”; a nota preserva essa ambiguidade.
lexical_decisions:
- source_word: πρεσβυτέρα / πρεσβυτέρας
  choice: muito idosa / de uma mulher idosa
  rationale: Mantém o contraste recorrente entre a aparência rejuvenescida e os traços próprios da velhice, sem reduzir πρεσβύτερος simplesmente à cor grisalha.
- source_word: ὄψιν
  choice: aparência
  rationale: Expressa o aspecto visível da figura, em contraste com o corpo e os cabelos.
- source_word: κάλλει ἐκπρεπεστάτη
  choice: de beleza extraordinária
  rationale: Reproduz de modo natural o superlativo enfático que descreve sua beleza como excepcional ou destacada.
- source_word: ἱλαρά
  choice: alegre
  rationale: Termo corrente e digno que comunica a disposição luminosa e contente indicada pelo adjetivo.
- source_word: συμψελίου
  choice: assento acolchoado
  rationale: O substantivo raro parece designar um banco ou assento provido de almofada; a formulação evita especificar além da evidência disponível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição das três visões e o contraste entre juventude e velhice foram preservados. A divisão em frases foi levemente ajustada para evitar períodos excessivamente longos.
