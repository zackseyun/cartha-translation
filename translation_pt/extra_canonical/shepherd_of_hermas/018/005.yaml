revisions:
- from: Irmãos, na primeira visão, a do ano passado, ela me apareceu muito idosa e sentada numa cadeira. Na segunda visão, tinha a aparência mais jovem, mas o corpo e os cabelos eram de uma mulher idosa; ela falava comigo de pé e estava mais alegre do que antes. Na terceira visão, era inteiramente mais jovem e de beleza extraordinária; apenas os cabelos eram de uma mulher idosa. Estava alegre até o fim[a] e sentada num assento acolchoado.
  to: Irmãos, na primeira visão, a do ano passado, ela me apareceu muito idosa e sentada numa cadeira. Na segunda visão, sua aparência era mais jovem, mas seu corpo e seus cabelos eram mais envelhecidos; ela falava comigo de pé e estava mais alegre do que antes. Na terceira visão, estava inteiramente rejuvenescida e de beleza extraordinária; somente seus cabelos eram mais envelhecidos. Estava alegre até o fim[a] e sentada num assento acolchoado.
  rationale: A revisão conserva a estrutura, o tom e o vocabulário central do rascunho, mas restaura o valor comparativo de πρεσβυτέρα/πρεσβυτέρας nas segunda e terceira visões. Também substitui uma construção pouco idiomática por uma formulação natural em português que mantém o contraste de rejuvenescimento progressivo. A nota de rodapé está corretamente ancorada e continua útil para a ambiguidade de εἰς τέλος.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:59:18Z'
review_pass:
  verdict: revise
  source_fidelity: O sentido geral e a sequência das três visões são preservados. Contudo, πρεσβυτέρα/πρεσβυτέρας é comparativo nas duas últimas descrições; «de uma mulher idosa» transforma essa comparação em caracterização absoluta e introduz uma formulação não expressa pelo grego.
  naturalness: O texto é claro e de registro apropriado. «Inteiramente mais jovem» é menos idiomático em português do que «inteiramente rejuvenescida», e a reformulação dos traços físicos torna o contraste mais fluente sem perder a proximidade ao original.
  terminology: «Aparência», «alegre» e «assento acolchoado» são escolhas adequadas. «Rejuvenescida» comunica naturalmente ὅλη νεωτέρα no contexto das aparições sucessivas, sem especificar a natureza da transformação.
  issues:
  - severity: medium
    issue: «o corpo e os cabelos eram de uma mulher idosa» / «os cabelos eram de uma mulher idosa»
    rationale: O grego diz que a carne e os cabelos eram «mais velhos» (πρεσβυτέρας), não que pertencessem ou correspondessem aos de «uma mulher idosa». A redação proposta elimina a comparação e acrescenta uma construção possessiva/caracterizadora ausente do texto.
  - severity: low
    issue: «era inteiramente mais jovem»
    rationale: Embora compreensível, a expressão é pouco natural em português moderno neste contexto. «Estava inteiramente rejuvenescida» transmite de modo mais idiomático o contraste narrativo de ὅλη νεωτέρα.
  revised_text: Irmãos, na primeira visão, a do ano passado, ela me apareceu muito idosa e sentada numa cadeira. Na segunda visão, sua aparência era mais jovem, mas seu corpo e seus cabelos eram mais envelhecidos; ela falava comigo de pé e estava mais alegre do que antes. Na terceira visão, estava inteiramente rejuvenescida e de beleza extraordinária; somente seus cabelos eram mais envelhecidos. Estava alegre até o fim[a] e sentada num assento acolchoado.
  revised_footnotes:
  - marker: a
    text: 'Ou: “estava inteiramente alegre”.'
    reason: A expressão εἰς τέλος pode ter sentido temporal, “até o fim”, ou intensivo, “completamente”; a nota preserva essa ambiguidade.
  revision_rationale: A revisão conserva a estrutura, o tom e o vocabulário central do rascunho, mas restaura o valor comparativo de πρεσβυτέρα/πρεσβυτέρας nas segunda e terceira visões. Também substitui uma construção pouco idiomática por uma formulação natural em português que mantém o contraste de rejuvenescimento progressivo. A nota de rodapé está corretamente ancorada e continua útil para a ambiguidade de εἰς τέλος.
