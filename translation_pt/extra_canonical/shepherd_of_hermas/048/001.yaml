  source_fidelity: A tradução acompanha bem o grego e preserva a oposição retórica entre a πολυτέλεια benéfica e a das nações. A leitura textual incerta καὶ κτήματα deve, porém, aparecer integralmente entre colchetes no texto, como na fonte. Para χαλεπή, “duro” representa melhor o sentido de algo áspero/penoso do que “cruel”, que introduz uma ideia de intenção malévola não expressa pelo grego.
  naturalness: O português é claro, moderno e adequado ao registro. A formulação revista torna a indicação editorial mais legível e mantém a repetição deliberada de “luxo”.
  terminology: “Senhor”, “serviços”, “luxo”, “nações” e “servos de Deus” são escolhas adequadas. “Parábola ... é apresentada” reproduz mais de perto o caráter de κεῖται do que “se aplica”, sem perder naturalidade.
  issues:
  - severity: medium
    issue: O elemento textual incerto está grafado como “[a]propriedades”, em vez de a expressão incerta aparecer entre colchetes.
    rationale: A fonte apresenta [καὶ κτήματα], isto é, “e propriedades”, como leitura editorialmente incerta. O texto português deve refletir os colchetes sobre o segmento traduzido, e o marcador de nota deve ficar junto a ele.
  - severity: low
    issue: “Cruel” para χαλεπή é excessivamente específico.
    rationale: χαλεπή denota algo duro, áspero ou penoso; não exige a noção de crueldade.
  - severity: low
    issue: “Esta parábola se aplica” torna κεῖται mais interpretativo do que necessário.
    rationale: O verbo descreve a parábola como posta/apresentada para os servos de Deus, em referência ao pobre e ao rico.
