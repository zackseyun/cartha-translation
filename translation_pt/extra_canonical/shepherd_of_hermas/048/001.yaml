base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/048/001.yaml
  text: For to this end the Master has made you rich, that you might carry out these ministries for him; it is far better to buy such fields [and estates] and houses, which you will find in your city when you arrive in it. This luxury is good and cheerful, having no grief nor fear, but having joy. So do not practice the luxury of the nations; for it is unprofitable for you, the slaves of God. Rather practice your own luxury, in which you are able to rejoice. For all luxury of this kind is profitable. But the luxury of the nations is bitter and harsh. This parable, then, is set before the slaves of God, for the poor and the rich.
translation:
  language: pt
  text: 'Pois foi para isso que o Senhor os enriqueceu: para que realizem para ele esses serviços. É muito melhor comprar campos como esses [e propriedades][a] e casas que vocês encontrarão em sua cidade quando chegarem a ela. Esse luxo é bom e alegre: não traz tristeza nem medo, mas alegria. Portanto, não adotem o luxo das nações, pois ele não convém a vocês, servos de Deus. Em vez disso, adotem o luxo que lhes é próprio, no qual vocês podem se alegrar. Todo luxo desse tipo é proveitoso; o luxo das nações, porém, é amargo e duro. Assim, esta parábola é apresentada aos servos de Deus, tanto ao pobre como ao rico.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “E propriedades” aparece entre colchetes em parte da tradição editorial do texto grego, indicando incerteza textual.
    reason: Sinalizar que καὶ κτήματα é apresentado como leitura textualmente incerta na fonte fornecida.
lexical_decisions:
- source_word: δεσπότης
  choice: Senhor
  rationale: Expressa autoridade e senhorio em português corrente, sem a conotação moderna predominantemente negativa de “déspota”.
- source_word: διακονίας
  choice: serviços
  rationale: Mantém o sentido amplo de tarefas prestadas a Deus; “ministérios” poderia sugerir cargos eclesiásticos formais não exigidos pelo contexto.
- source_word: πολυτέλεια
  choice: luxo
  rationale: Preserva a imagem deliberadamente paradoxal do texto, que contrapõe um luxo bom e generoso ao luxo das nações, sem resolver a tensão por paráfrase.
- source_word: ἔθνη
  choice: nações
  rationale: Conserva o termo amplo do grego e evita restringi-lo interpretativamente a “pagãos” ou “gentios”.
- source_word: δοῦλοι
  choice: servos
  rationale: É a forma digna e corrente no registro religioso para pessoas pertencentes ao serviço de Deus, embora o termo grego também possa significar “escravos”.
- source_word: κεῖται
  choice: se aplica
  rationale: Comunica naturalmente que a parábola é apresentada com referência ao pobre e ao rico.
theological_decisions:
- issue: Sentido da “cidade” futura
  choice: sua cidade quando chegarem a ela
  alternative: cidade celestial
  rationale: Mantém a formulação figurada e sua possível dimensão escatológica sem identificar explicitamente a cidade além do que o grego afirma.
- issue: Riqueza como meio de serviço
  choice: o Senhor os enriqueceu para que realizem esses serviços
  alternative: o Senhor lhes deu riqueza para exercer caridade
  rationale: Preserva a finalidade declarada no texto sem limitar as διακονίαι a uma formulação doutrinária específica.
- issue: Pobre e rico como destinatários da parábola
  choice: tanto ao pobre como ao rico
  alternative: aos pobres e aos ricos
  rationale: Reflete os singulares gregos como tipos representativos dentro da parábola.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “luxo” foi mantida por ser central ao contraste retórico. O marcador [a] foi colocado imediatamente antes do elemento textualmente incerto.
