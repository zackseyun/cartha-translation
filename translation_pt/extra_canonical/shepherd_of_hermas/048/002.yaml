lexical_decisions:
- source_word: κύριε
  choice: senhor
  rationale: Mantém a forma respeitosa de tratamento ao interlocutor, sem pressupor aqui uma identificação explícita com o Senhor divino.
- source_word: ἐξομολόγησιν
  choice: confissão
  rationale: Preserva a amplitude do termo grego, que pode envolver confissão, reconhecimento ou louvor dirigido ao Senhor.
- source_word: ἔντευξιν / ἐντυγχάνει
  choice: súplica / suplica em favor
  rationale: No contexto, indica petição ou intercessão diante de Deus; 'súplica' é natural e conserva a dimensão de oração em favor de outro.
- source_word: πένητα / πένης
  choice: necessitado
  rationale: Expressa alguém materialmente carente sem reduzir o referente necessariamente à indigência absoluta.
- source_word: ἐπιχορηγεῖ / χορηγήσῃ
  choice: fornece / ajuda
  rationale: Comunica o sustento material provido generosamente; a variação evita rigidez sem perder o sentido.
- source_word: ἐξομολογήσει
  choice: confissão
  rationale: Mantido na nota de variante para refletir literalmente a leitura adicional atestada.
- source_word: διακονίαν
  choice: serviço
  rationale: Termo amplo e não institucional, apropriado ao ato de administrar os dons do Senhor em benefício do necessitado.
- source_word: πτελέα
  choice: olmo
  rationale: Equivalente botânico tradicional e direto para a árvore da parábola.
- source_word: ἄμπελον
  choice: videira
  rationale: Equivalente corrente e preciso para a planta frutífera contrastada com o olmo.
theological_decisions:
- issue: Poder e valor da intercessão do necessitado
  choice: A súplica tem grande poder e valor diante de Deus
  alternative: A oração do pobre garante mérito salvífico ao rico
  rationale: O texto descreve recompensa e aceitação diante de Deus, mas não define um mecanismo de mérito salvífico; a tradução preserva a afirmação sem ampliar sua teologia.
- issue: Origem e finalidade da riqueza
  choice: A riqueza foi recebida do Senhor e deve servir ao necessitado
  alternative: A posse de riqueza é intrinsecamente condenada
  rationale: A passagem critica a distração causada pela riqueza, mas apresenta seu uso generoso como correto cumprimento do serviço do Senhor.
- issue: Reciprocidade entre rico e necessitado
  choice: Ambos realizam a obra por meio de dons distintos
  alternative: Um grupo é espiritualmente superior em sentido absoluto
  rationale: 'A parábola apresenta uma interdependência: o rico provê bens materiais e o necessitado oferece súplica, sem formular uma hierarquia espiritual total.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi moderadamente desdobrada para clareza, preservando a imagem do olmo e da videira, a reciprocidade entre rico e necessitado e as variantes textuais relevantes. O trecho termina em reticências porque a unidade-fonte fornecida é interrompida nesse ponto.
