base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/004.yaml
  text: The angel who had given the rods to the people again demanded them back from them; and as they had received them, so too they were called to him, and each one returned the rods. The angel of the Lord took them and examined them.
translation:
  language: pt
  text: O anjo que havia dado as varas ao povo tornou a pedi-las de volta. E, conforme as haviam recebido, também eram chamados a ele, e cada um devolvia a sua vara. O anjo do Senhor recebia as varas e as examinava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: varas
  rationale: No contexto da visão, designa os pequenos ramos cortados da árvore e distribuídos ao povo; “varas” é natural em português e permite acompanhar suas diferentes condições.
- source_word: πάλιν ἀπῄτει ἀπ᾽ αὐτῶν
  choice: tornou a pedi-las de volta
  rationale: Expressa tanto πάλιν, indicando uma nova ação do anjo, quanto o sentido de reclamar de volta aquilo que havia sido entregue.
- source_word: καθὼς ἔλαβον
  choice: na mesma ordem em que as haviam recebido
  rationale: O contexto exige uma relação entre o recebimento anterior e a sequência em que as pessoas são chamadas; explicita de modo natural a força contextual de καθὼς.
- source_word: κατενόει
  choice: as examinava
  rationale: O imperfeito descreve uma ação repetida e cuidadosa à medida que cada vara era devolvida.
theological_decisions:
- issue: Identidade e título do personagem celestial
  choice: “O anjo” e depois “O anjo do Senhor”
  alternative: Uniformizar ambas as ocorrências como “o anjo do Senhor”
  rationale: Preserva a variação do texto grego entre ὁ ἄγγελος e ὁ ἄγγελος τοῦ Κυρίου sem acrescentar uma identificação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O plural grego de “varas” na devolução foi ajustado distributivamente para “cada um devolvia a sua vara”, sem alterar o sentido.
