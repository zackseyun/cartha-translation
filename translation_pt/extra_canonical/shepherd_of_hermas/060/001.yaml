base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/001.yaml
  text: …with their whole heart. So then, do you suppose that the sins of those who are repenting are immediately forgiven? Not entirely. Rather, the one who repents must afflict his own soul and be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations; and if he bears the tribulations that come upon him, the One who created all things and strengthened them will surely be moved with compassion and will grant some healing. And this, when [God] sees the heart of the one repenting clean from everything.
translation:
  language: pt
  text: …de todo o coração. Então, você pensa que os pecados dos que estão se arrependendo são perdoados imediatamente? Não inteiramente. Antes, quem se arrepende deve afligir a própria alma, humilhar-se profundamente, com firmeza, em toda a sua conduta e angustiar-se em toda espécie de tribulações. E, se suportar as tribulações que lhe sobrevierem, aquele que criou todas as coisas e lhes deu força certamente se compadecerá e lhe concederá alguma cura. Isso acontecerá quando [Deus][a] vir que o coração de quem se arrepende está limpo de tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Deus” aparece entre colchetes na edição grega consultada, indicando uma palavra cuja presença no texto é editorial ou textualmente incerta.
    reason: Sinalizar de modo transparente a incerteza textual associada a ὁ Θεός.
lexical_decisions:
- source_word: μετανοούντων / μετανοοῦντα
  choice: dos que estão se arrependendo / quem se arrepende
  rationale: Mantém o aspecto de processo presente no particípio grego, com formulação natural em português.
- source_word: βασανίσαι τὴν ἑαυτοῦ ψυχήν
  choice: afligir a própria alma
  rationale: Preserva a força penitencial de βασανίζω sem tornar a expressão artificialmente literal como “torturar”.
- source_word: ταπεινοφρονῆσαι ... ἰσχυρῶς
  choice: humilhar-se profundamente
  rationale: Expressa a humildade intensa exigida pelo advérbio, em linguagem corrente e digna.
- source_word: θλίψεσι ποικίλαις
  choice: toda espécie de tribulações
  rationale: Comunica a variedade de aflições indicada por ποικίλαις e mantém o registro religioso tradicional compreensível.
- source_word: σπλαγχνισθήσεται
  choice: se compadecerá
  rationale: Transmite a compaixão visceral sugerida pelo verbo grego em português natural.
- source_word: ἴασίν τινα
  choice: alguma cura
  rationale: Mantém a indefinição de τινα, sem especificar se a cura é espiritual, moral ou de outra natureza.
theological_decisions:
- issue: Relação entre arrependimento, tribulação e perdão
  choice: Manter “Não inteiramente” e a sequência condicional do texto
  alternative: Explicar que o perdão depende de obras penitenciais ou, ao contrário, suavizar a passagem para evitar essa conclusão
  rationale: O grego apresenta uma tensão teológica real entre arrependimento, aflição, perseverança e compaixão divina; a tradução não a resolve por meio de interpretação denominacional.
- issue: Agente identificado como Deus
  choice: Conservar “Deus” entre colchetes e explicá-lo em nota
  alternative: Inserir “Deus” sem indicação ou omiti-lo
  rationale: A identificação é contextualmente plausível, mas os colchetes da evidência textual devem permanecer visíveis para não ocultar a condição textual da palavra.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A pergunta retórica e a linguagem de arrependimento foram preservadas sem explicação doutrinária adicional.
