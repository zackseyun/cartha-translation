  to: …de todo o coração. Então, você pensa que os pecados dos que estão se arrependendo são perdoados imediatamente? Não inteiramente. Antes, quem se arrepende deve afligir a própria alma, humilhar-se profundamente, com firmeza, em toda a sua conduta e angustiar-se em toda espécie de tribulações. E, se suportar as tribulações que lhe sobrevierem, aquele que criou todas as coisas e lhes deu força certamente se compadecerá e lhe concederá alguma cura. Isso acontecerá quando [Deus][a] vir que o coração de quem se arrepende está limpo de tudo.
