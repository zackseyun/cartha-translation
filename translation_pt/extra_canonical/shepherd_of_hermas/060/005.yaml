base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/005.yaml
  text: From some he received the rods dry and eaten as if by a moth; the angel ordered those who had handed in such rods to stand apart. Others handed in dry rods, but they had not been eaten by a moth; these too he ordered to stand apart. Others handed in rods half-dry; and these stood apart. Others handed in their rods half-dry and having splits; and these stood apart. Others handed in their rods green and having splits; and these stood apart. Others handed in their rods half dry and half green; and these stood apart. Others presented their rods with two parts of the rod green and the third part dry; and these stood apart. Others handed in two parts dry and the third part green; and these stood apart. Others handed in their rods almost entirely green, but a very little of their rods was dry—at the very tip; and they had splits in them; and these stood apart.
translation:
  language: pt
  text: De alguns, ele recebeu as varas secas e carcomidas, como que por traças; o anjo ordenou aos que haviam entregado varas assim que ficassem à parte. Outros entregavam varas secas, mas não carcomidas por traças; e também ordenou que estes ficassem à parte. Outros entregavam varas meio secas; e estes ficavam à parte. Outros entregavam suas varas meio secas e com rachaduras; e estes ficavam à parte. Outros entregavam suas varas verdes e com rachaduras; e estes ficavam à parte. Outros entregavam suas varas metade secas e metade verdes; e estes ficavam à parte. Outros apresentavam suas varas com dois terços verdes e um terço seco; e estes ficavam à parte. Outros entregavam dois terços secos e um terço verde; e estes ficavam à parte. Outros entregavam suas varas quase inteiramente verdes; apenas uma pequena parte delas estava seca — a própria ponta —, e tinham rachaduras; e estes ficavam à parte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: varas
  rationale: No contexto da visão, designa os pequenos ramos cortados da árvore e distribuídos ao povo; “varas” é natural, concreto e mantém a terminologia uniforme.
- source_word: βεβρωμένας ὡς ὑπὸ σητός
  choice: carcomidas, como que por traças
  rationale: Preserva a comparação introduzida por ὡς e comunica em português corrente a ideia de material roído por inseto.
- source_word: ξηράς / χλωράς
  choice: secas / verdes
  rationale: Mantém o contraste visual e simbólico do grego sem antecipar sua interpretação posterior.
- source_word: σχισμάς
  choice: rachaduras
  rationale: Expressa fissuras nas varas de modo natural e evita o sentido mais amplo e potencialmente abstrato de “divisões”.
- source_word: χωρὶς ἵστασθαι
  choice: ficassem à parte
  rationale: Reproduz a separação física dos grupos com uma formulação idiomática e digna.
theological_decisions:
- issue: Possível significado simbólico dos estados das varas
  choice: Traduzir apenas as condições físicas descritas, sem explicá-las
  alternative: Inserir termos interpretativos relativos à condição espiritual de cada grupo
  rationale: A interpretação da visão pertence à continuação do texto; acrescentá-la aqui eliminaria a progressão narrativa e importaria conclusões não expressas nesta unidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição deliberada de “Outros” e “ficavam à parte” foi preservada por estruturar a enumeração visionária. As frações foram vertidas idiomaticamente como “dois terços” e “um terço”.
