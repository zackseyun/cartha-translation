base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/002.yaml
  text: And an angel of the Lord—exceedingly glorious and very tall—was standing beside the willow, holding a great sickle, and he was cutting off branches from the willow and handing them to the people who were being sheltered by the willow; and he kept giving them little rods, about a cubit long.
translation:
  language: pt
  text: E junto ao salgueiro estava um anjo do Senhor, extremamente glorioso e muito alto. Ele segurava uma grande foice, cortava ramos do salgueiro e os entregava ao povo abrigado sob a árvore. Dava-lhes pequenas varas, de cerca de um côvado de comprimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰτέα
  choice: salgueiro
  rationale: Equivalente direto e corrente para a árvore mencionada na visão.
- source_word: δρέπανον
  choice: foice
  rationale: Designa uma lâmina curva usada para cortar; “foice” é natural e preserva a imagem do texto.
- source_word: κλάδους
  choice: ramos
  rationale: Termo natural para partes cortadas de uma árvore, sem sugerir necessariamente galhos muito grossos.
- source_word: ῥαβδία
  choice: pequenas varas
  rationale: O diminutivo indica varas ou bastões pequenos; a escolha mantém distinção em relação aos ramos ainda presos à árvore.
- source_word: πηχυαῖα
  choice: de cerca de um côvado de comprimento
  rationale: Preserva a medida antiga do original e explicita que ela se refere ao comprimento.
- source_word: σκεπαζομένῳ ὑπὸ τῆς ἰτέας
  choice: abrigado sob a árvore
  rationale: Expressa de modo natural a ideia de o povo estar coberto ou protegido sob o salgueiro, evitando a repetição pesada do nome da árvore.
theological_decisions:
- issue: Identidade do anjo
  choice: um anjo do Senhor
  alternative: o anjo do Senhor
  rationale: O segmento o apresenta na cena sem exigir que seja identificado como uma figura única ou específica; o indefinido evita importar uma identificação teológica.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. Os imperfeitos gregos foram vertidos por formas que preservam a ação em andamento, sem tornar o período excessivamente longo.
