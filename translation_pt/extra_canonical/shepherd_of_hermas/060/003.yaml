base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/003.yaml
  text: After all had received the rods, the angel laid aside the sickle, and that tree was sound, just as I had seen it before. I marveled within myself, saying, How is the tree sound, with so many branches cut off? The shepherd says to me, Do not marvel that the tree remained sound though so many branches were cut off. But wait until you see everything, and it will be shown to you what it is.
translation:
  language: pt
  text: 'Depois que todos receberam as varas, o anjo deixou a foice de lado, e a árvore estava saudável, tal como eu a tinha visto. Eu me admirava comigo mesmo, dizendo: “Como a árvore está saudável, depois de tantos ramos terem sido cortados?” O pastor me disse: “Não se admire de a árvore ter permanecido saudável, embora tantos ramos tenham sido cortados. Mas espere até ver tudo, e lhe será revelado o que isso significa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαβδία / ῥαβδία
  choice: varas
  rationale: No contexto, são pequenos ramos cortados e entregues ao povo; “varas” é natural em português e mantém a ligação com as ῥάβδους mencionadas em seguida.
- source_word: ὑγιές
  choice: intacta
  rationale: Embora o termo possa significar “sadia”, aqui o contraste é com os muitos ramos cortados; “intacta” comunica que a árvore continuava inteira e em bom estado, sem sugerir apenas ausência de doença.
- source_word: ἐθαύμαζον
  choice: eu me admirava
  rationale: Preserva o aspecto durativo do imperfeito e a reação de espanto interior de Hermas.
- source_word: ἄφες δὲ ἕως πάντα ἴδῃς
  choice: Espere até ver tudo
  rationale: O imperativo idiomático ἄφες, seguido de ἕως, pede que Hermas suspenda sua conclusão até contemplar o restante da visão.
- source_word: δηλωθήσεταί σοι τὸ τί ἐστιν
  choice: lhe será revelado o que isso significa
  rationale: Em contexto visionário, δηλόω indica tornar claro ou revelar; a expressão pergunta pelo significado daquilo que foi visto, não meramente por sua identidade física.
theological_decisions:
- issue: Agente implícito da revelação futura
  choice: 'Construção passiva: “lhe será revelado”'
  alternative: “Deus lhe revelará” ou “eu lhe mostrarei”
  rationale: O grego usa o passivo sem nomear o agente. A tradução preserva essa indeterminação e evita introduzir uma identificação teológica ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com diálogo direto e fluente. A repetição de “intacta” e “ramos terem sido cortados” foi mantida para refletir a insistência retórica do grego.
