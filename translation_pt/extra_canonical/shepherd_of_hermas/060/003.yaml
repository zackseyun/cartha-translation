revisions:
- from: 'Depois que todos receberam as varas, o anjo deixou a foice de lado, e a árvore estava intacta, tal como eu a havia visto antes. Eu me admirava comigo mesmo, dizendo: “Como a árvore pode estar intacta, depois de tantos ramos terem sido cortados?” O pastor me disse: “Não se admire de que a árvore tenha permanecido intacta, apesar de tantos ramos terem sido cortados. Espere até ver tudo, e lhe será revelado o que isso significa.”'
  to: 'Depois que todos receberam as varas, o anjo deixou a foice de lado, e a árvore estava saudável, tal como eu a tinha visto. Eu me admirava comigo mesmo, dizendo: “Como a árvore está saudável, depois de tantos ramos terem sido cortados?” O pastor me disse: “Não se admire de a árvore ter permanecido saudável, embora tantos ramos tenham sido cortados. Mas espere até ver tudo, e lhe será revelado o que isso significa.”'
  rationale: A revisão substitui «intacta» por «saudável» nas três ocorrências correspondentes a ὑγιές, preservando o paradoxo narrativo sem negar o corte dos ramos. Também ajusta a regência de «admirar-se» para uma formulação idiomática. Não são necessárias notas de rodapé.
