  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/002.yaml
  text: “Why then was she seated in a chair? I wanted to know, sir.” “Because every weak person sits in a chair because of his weakness, in order that the weakness of his body may be supported. You have the pattern of the first vision.”
translation:
  language: pt
  text: '“Então, por que ela estava sentada numa cadeira? Eu queria saber, senhor.”


    “Porque toda pessoa fraca se senta numa cadeira por causa de sua fraqueza, para que a fraqueza de seu corpo seja sustentada. Aí está a figura da primeira visão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθέδρα
  choice: cadeira
  rationale: Designa um assento que dá apoio ao corpo; “cadeira” é natural em português e mantém a imagem concreta.
- source_word: ἀσθενής / ἀσθένεια
  choice: fraca / fraqueza / corpo debilitado
  rationale: O campo semântico é o da debilidade física. A pequena variação em português evita uma repetição pesada sem alterar o sentido.
- source_word: συνκρατηθῇ
  choice: tenha apoio
  rationale: No contexto, indica que a debilidade do corpo é amparada ou sustentada pela cadeira; a formulação é clara e idiomática.
- source_word: τύπος
  choice: simbolismo
  rationale: Aqui se refere ao valor representativo da aparência e da postura na primeira visão, não a um simples modelo para imitação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com diálogo natural. “Senhor” conserva a forma respeitosa de tratamento κύριε, e “Aí está” comunica de modo direto a conclusão explicativa do grego.
