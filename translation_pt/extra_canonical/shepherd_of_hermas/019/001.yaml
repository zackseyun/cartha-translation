base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/001.yaml
  text: “Listen,” he says, “about the three forms you are inquiring about. In the first vision, why did she appear to you as an old woman and seated on a chair? Because your spirit is old and already withered and has no strength because of your weaknesses and your double‑mindedness. For just as the aged, no longer having hope of being renewed, expect nothing else but their sleep, so also you, having been weakened by the affairs of life, have handed yourselves over to negligence, and you did not cast your anxieties upon the Lord; instead your mind has been shattered, and you have grown old in your sorrows.”
translation:
  language: pt
  text: “Ouça”, diz ele, “a respeito das três formas sobre as quais você está perguntando. Na primeira visão, por que ela lhe apareceu como uma mulher idosa e sentada numa cadeira? Porque o espírito de vocês envelheceu, já definhou e não tem força por causa das fraquezas e das vacilações de vocês. Pois, assim como os idosos, já sem esperança de se renovarem, não esperam nada além do seu sono, assim também vocês, enfraquecidos pelos assuntos da vida, entregaram-se à negligência e não lançaram as suas inquietações sobre o Senhor. Pelo contrário, a mente de vocês foi quebrantada, e vocês envelheceram em suas tristezas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  choice: formas
  rationale: Mantém o termo abrangente para as três aparências da mulher nas visões, sem restringi-lo a idade, figura ou aspecto.
- source_word: τὸ πνεῦμα ὑμῶν
  choice: o espírito de vocês
  rationale: Reproduz o singular coletivo do grego e preserva a linguagem antropológica do texto.
- source_word: μαλακιῶν
  choice: fraqueza
  rationale: Neste contexto, indica debilidade ou falta de vigor; evita associações modernas inadequadas de traduções mais literais.
- source_word: διψυχιῶν
  choice: indecisão
  rationale: Expressa a ideia de ânimo dividido ou vacilante em português corrente, sem impor uma formulação doutrinária.
- source_word: κοίμησιν
  choice: repouso
  rationale: Preserva o eufemismo para a morte e a metáfora do sono, com naturalidade em português.
- source_word: βιωτικῶν πραγμάτων
  choice: preocupações desta vida
  rationale: Comunica os assuntos e encargos da vida cotidiana que produzem enfraquecimento no contexto.
- source_word: ἀκηδίας
  choice: desânimo
  rationale: Abrange apatia, desalento e negligência espiritual; aqui o contexto destaca a perda de ânimo, sem excluir a passividade resultante.
- source_word: ἐθραύσθη ... ἡ διάνοια
  choice: a mente ... ficou abatida
  rationale: Reflete a imagem de quebrantamento ou colapso interior sem a estranheza de 'foi despedaçada' em português.
theological_decisions:
- issue: Sentido de διψυχία
  choice: indecisão
  alternative: ânimo dividido / duplicidade
  rationale: O termo pode envolver vacilação e divisão interior. 'Indecisão' preserva o foco contextual na falta de firmeza sem convertê-lo necessariamente em acusação de hipocrisia.
- issue: κοίμησις como metáfora da morte
  choice: repouso
  alternative: sono / morte
  rationale: O original emprega um eufemismo literalmente ligado ao sono. 'Repouso' mantém a metáfora e sua ambiguidade, sem explicitá-la como doutrina sobre o estado dos mortos.
- issue: Número de τὸ πνεῦμα ὑμῶν
  choice: o espírito de vocês
  alternative: os espíritos de vocês
  rationale: Mantém o singular grego com referência coletiva à comunidade e não resolve se 'espírito' é disposição interior coletiva ou princípio espiritual individual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você/vocês”. O discurso direto foi mantido. Esta unidade corresponde ao segmento solicitado, isto é, aos §§1–3; a pergunta e resposta do §4, embora presentes no escopo-fonte da seção, ficam fora deste segmento.
