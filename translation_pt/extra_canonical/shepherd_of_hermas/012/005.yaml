  text: 3. I asked her, saying, "Lady, I wished to know the outcome of the stones and their power—what sort it is."
translation:
  language: pt
  text: '3. Perguntei-lhe: “Senhora, eu gostaria de saber qual será o destino das pedras e de que espécie é o poder delas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησα αὐτὴν λέγων
  choice: Perguntei-lhe
  rationale: Expressa de modo natural em português a fórmula grega de introdução da fala, sem reproduzir desnecessariamente o semitismo ‘perguntei-lhe, dizendo’.
- source_word: ἤθελον γνῶναι
  choice: eu gostaria de saber
  rationale: O imperfeito de θέλω funciona aqui como pedido cortês; esta formulação conserva o tom respeitoso e soa corrente.
- source_word: τῶν λίθων τὴν ἔξοδον
  choice: qual será o destino das pedras
  rationale: ἔξοδος pode indicar saída, desfecho ou destino. No contexto da seleção e colocação das pedras na torre, ‘destino’ comunica de forma clara o resultado que caberá a elas, sem especificá-lo além do texto.
- source_word: τὴν δύναμιν αὐτῶν, ποταπή ἐστιν
  choice: que poder elas têm
  rationale: Reproduz o sentido de δύναμις e integra naturalmente a pergunta elíptica ποταπή ἐστιν (‘de que espécie é’), evitando uma construção pesada.
theological_decisions:
- issue: Sentido simbólico das pedras
  choice: Manter simplesmente ‘pedras’, sem identificar aqui seu referente simbólico.
  alternative: Explicitar que as pedras representam pessoas ou membros da Igreja.
  rationale: A unidade pergunta pelo destino e poder das pedras dentro da visão; explicitar a interpretação no texto traduzido resolveria antecipadamente o simbolismo.
- issue: Nuance de δύναμις
  choice: Traduzir por ‘poder’.
  alternative: ‘significado’, ‘virtude’ ou ‘função’.
  rationale: ‘Poder’ preserva a amplitude e a tensão do termo grego, sem reduzir sua possível referência à qualidade, capacidade ou significado simbólico das pedras.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. A fala respeitosa é preservada por ‘Senhora’ e pelo pedido cortês ‘eu gostaria de saber’.
