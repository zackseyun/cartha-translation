base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/002.yaml
  text: '"These are the holy angels of God, the first-created, to whom the Lord entrusted all his creation, to increase and to build and to rule over all creation. By these, therefore, the building of the tower will be brought to completion."'
translation:
  language: pt
  text: “Estes são os santos anjos de Deus, os primeiros a serem criados, aos quais o Senhor confiou toda a sua criação, para fazê-la crescer, edificá-la e governar toda a criação. Portanto, por meio deles, a construção da torre será levada a termo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πρῶτοι κτισθέντες
  choice: os primeiros a serem criados
  rationale: Reproduz com naturalidade a prioridade expressa pelo particípio aoristo passivo, sem introduzir uma categoria teológica além do texto.
- source_word: παρέδωκεν
  choice: confiou
  rationale: Expressa a entrega de responsabilidade e autoridade pelo Senhor, de modo idiomático em português.
- source_word: αὔξειν
  choice: fazê-la crescer
  rationale: Mantém o sentido causativo ou transitivo do infinitivo no contexto da criação confiada aos anjos.
- source_word: οἰκοδομεῖν
  choice: edificá-la
  rationale: Preserva a metáfora construtiva que se liga diretamente à edificação da torre.
- source_word: δεσπόζειν
  choice: governá-la
  rationale: Comunica exercício de domínio ou autoridade sem a conotação moderna negativa de “dominar”.
- source_word: τελεσθήσεται
  choice: será levada a termo
  rationale: Preserva a voz passiva e a ideia de conclusão plena da construção.
theological_decisions:
- issue: Relação entre os anjos e a criação
  choice: “aos quais o Senhor confiou toda a sua criação”
  alternative: “aos quais o Senhor entregou toda a sua criação”
  rationale: “Confiou” deixa claro que se trata de uma responsabilidade delegada, sem sugerir transferência de propriedade.
- issue: Agência na conclusão da torre
  choice: “por meio deles”
  alternative: “por eles”
  rationale: Expressa agência intermediária e mantém o Senhor como autoridade última no contexto, sem acrescentar explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. A repetição de “criação” foi preservada por corresponder à ênfase do grego; os pronomes em “fazê-la”, “edificá-la” e “governá-la” retomam toda a criação.
