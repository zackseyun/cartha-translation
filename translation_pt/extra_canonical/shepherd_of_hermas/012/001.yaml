base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/001.yaml
  text: Answering, I say to her, "Lady, this matter is great and marvelous. And the six young men who are building—who are they, Lady?"
translation:
  language: pt
  text: 'Eu lhe respondi: “Senhora, este assunto é grande e maravilhoso. E aqueles seis jovens que estão construindo, quem são eles, Senhora?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς λέγω αὐτῇ
  choice: Eu lhe respondi
  rationale: Expressa de modo natural em português o particípio aoristo seguido do presente histórico, sem produzir a rigidez de uma tradução como “respondendo, digo a ela”.
- source_word: μεγάλως καὶ θαυμαστῶς ἔχει τὸ πρᾶγμα τοῦτο
  choice: isso é grandioso e maravilhoso
  rationale: Reproduz os dois qualificativos gregos e comunica com clareza o caráter extraordinário daquilo que foi mostrado.
- source_word: οἱ νεανίσκοι οἱ ἓξ
  choice: aqueles seis jovens
  rationale: “Jovens” é a forma corrente e digna para νεανίσκοι; “aqueles” retoma as figuras vistas na visão.
- source_word: οἱ οἰκοδομοῦντες
  choice: que estão construindo
  rationale: Mantém o aspecto contínuo do particípio presente e deixa o objeto implícito, como no segmento grego.
- source_word: κυρία
  choice: Senhora
  rationale: Conserva o tratamento respeitoso dirigido à figura feminina, sem acrescentar um título teológico não explícito.
