base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/006.yaml
  text: Answering me, she says, "It is not because you are more worthy than all that it is revealed to you; for there are others before you and better than you, to whom it was fitting that these visions should be revealed. But in order that the name of God might be glorified, it has been revealed to you and will be revealed, for the sake of the double-minded—those who reason within their hearts whether these things are so or not. Tell them that all these things are true, and nothing is outside the truth; rather, all are strong and sure and well-founded."
translation:
  language: pt
  text: 'Ela me respondeu: “Não é por você ser mais digno do que todos os outros que isso lhe foi revelado, pois há outros que vieram antes de você e são melhores do que você, aos quais estas visões deveriam ter sido reveladas. Mas, para que o nome de Deus seja glorificado, isso lhe foi revelado e ainda lhe será revelado por causa dos que têm o coração dividido[a] — os que ponderam em seu íntimo se essas coisas são assim ou não. Diga-lhes que todas essas coisas são verdadeiras e que nada está fora da verdade; pelo contrário, tudo é sólido, seguro e bem fundamentado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os de ânimo dividido”, isto é, pessoas vacilantes entre duas convicções.'
    reason: O termo grego διψύχους significa literalmente algo como “de duas almas” e pode indicar duplicidade interior, hesitação ou instabilidade.
lexical_decisions:
- source_word: διψύχους
  choice: os que têm o coração dividido
  rationale: Expressa de modo natural a ideia de pessoas interiormente divididas, vacilantes ou de ânimo dúplice, sem reduzi-la à simples indecisão intelectual.
- source_word: διαλογιζομένους ἐν ταῖς καρδίαις αὐτῶν
  choice: os que ponderam em seu íntimo
  rationale: Mantém a reflexão interior indicada pelo grego e evita a repetição pouco natural de “coração” logo após “coração dividido”.
- source_word: ἰσχυρὰ καὶ βέβαια καὶ τεθεμελιωμένα
  choice: sólido, seguro e bem fundamentado
  rationale: 'Preserva a tríade enfática: força ou consistência, certeza e fundamento estabelecido.'
theological_decisions:
- issue: Finalidade da revelação concedida a Hermas
  choice: para que o nome de Deus seja glorificado
  alternative: para que Deus seja glorificado
  rationale: Mantém explicitamente τὸ ὄνομα τοῦ Θεοῦ, sem simplificar a formulação teológica do texto.
- issue: Afirmação de que nada está fora da verdade
  choice: nada está fora da verdade
  alternative: não há nelas nada contrário à verdade
  rationale: Conserva a expressão incomum e abrangente do original, sem restringir ou interpretar silenciosamente sua referência.
translation_notes:
  register: Português atual, digno e acessível, com tratamento por “você” para naturalidade e legibilidade brasileira. A sintaxe foi suavizada sem apagar as repetições enfáticas nem as tensões do grego.
