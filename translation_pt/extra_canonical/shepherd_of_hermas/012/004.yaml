base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/004.yaml
  text: '"They too are holy angels of God; but these six are superior to them. The building of the tower, then, will be brought to completion, and all together will rejoice around the tower and will glorify God, because the building of the tower has been completed."'
translation:
  language: pt
  text: “Eles também são santos anjos de Deus; mas esses seis são superiores a eles. Portanto, a construção da torre será concluída, e todos juntos se alegrarão ao redor da torre e glorificarão a Deus, porque a construção da torre foi concluída.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχοντες
  choice: são superiores
  rationale: Expressa de modo natural a posição ou preeminência dos seis anjos em relação aos demais, sem especificar em que consiste essa superioridade.
- source_word: συντελεσθήσεται
  choice: será concluída
  rationale: Mantém o sentido futuro passivo de levar a construção plenamente ao fim.
- source_word: εὐφρανθήσονται
  choice: se alegrarão
  rationale: Reproduz o sentido de alegria celebrativa em linguagem portuguesa corrente e digna.
- source_word: δοξάσουσιν
  choice: glorificarão
  rationale: Conserva o termo teológico tradicional e semanticamente direto para atribuir glória a Deus.
theological_decisions:
- issue: Natureza da superioridade dos seis anjos
  choice: “esses seis são superiores a eles”
  alternative: “esses seis têm autoridade sobre eles”
  rationale: O grego ὑπερέχοντες indica superioridade ou preeminência, mas não define explicitamente autoridade administrativa; a tradução preserva essa abertura.
- issue: Conclusão da torre como evento futuro e depois consumado
  choice: Mantidos o futuro “será concluída” e a causa posterior “foi concluída”
  alternative: Uniformizar ambos como futuro ou como presente perfeito
  rationale: 'Preserva a progressão do grego: primeiro a conclusão é anunciada; depois, a alegria é explicada a partir da obra já terminada.'
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “construção da torre” foi preservada por corresponder à ênfase e à estrutura do original.
