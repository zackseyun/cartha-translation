base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/003.yaml
  text: '"But the white portion is the age that is coming, in which the elect of God will dwell; because those chosen by God for eternal life will be spotless and pure.'
translation:
  language: pt
  text: Mas a parte branca é a era que está por vir, na qual habitarão os eleitos de Deus, pois os escolhidos por Deus para a vida eterna serão sem mancha e puros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ λευκὸν μέρος
  choice: a parte branca
  rationale: Reproduz diretamente a expressão grega e mantém a ligação com as quatro cores da visão.
- source_word: ὁ αἰὼν ὁ ἐπερχόμενος
  choice: a era que está por vir
  rationale: Distingue αἰών de κόσμος e expressa com naturalidade a era futura de caráter escatológico.
- source_word: οἱ ἐκλεκτοὶ τοῦ θεοῦ
  choice: os eleitos de Deus
  rationale: Preserva a formulação nominal e teológica do grego sem explicá-la além do texto.
- source_word: κατοικήσουσιν
  choice: habitarão
  rationale: Equivalente formal e natural que conserva a ideia de residência permanente.
- source_word: ἄσπιλοι καὶ καθαροί
  choice: sem mancha e puros
  rationale: 'Mantém os dois qualificativos distintos: ausência de mácula e pureza.'
theological_decisions:
- issue: Relação entre eleição divina e vida eterna
  choice: os escolhidos por Deus para a vida eterna
  alternative: os que Deus escolheu para a vida eterna
  rationale: Conserva a voz passiva e a associação sintática de ὑπὸ τοῦ Θεοῦ εἰς ζωὴν αἰώνιον, sem definir o modo ou o momento dessa escolha.
- issue: Sentido escatológico de αἰών
  choice: era
  alternative: mundo
  rationale: O contexto contrasta o mundo presente com a realidade vindoura; 'era' preserva essa distinção e evita identificar automaticamente αἰών com um lugar.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A tradução preserva o paralelismo e a tensão teológica do original sem acréscimos interpretativos.
