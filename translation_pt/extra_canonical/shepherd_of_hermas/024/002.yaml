  to: 'Ela disse: “Escute: a parte negra é este mundo, no qual vocês vivem. A parte ardente e vermelho-sangue significa que este mundo deve ser destruído por sangue e fogo. A parte dourada, porém, representa vocês, os que escaparam deste mundo. Pois, assim como o ouro é provado pelo fogo e se torna útil, vocês também estão sendo provados em meio a essas coisas.[a] Portanto, os que permanecerem e forem abrasados pelo fogo serão purificados. Assim como o ouro se livra de sua escória, vocês também se livrarão de toda tristeza e angústia, serão purificados e se tornarão úteis para a construção da torre.”'
