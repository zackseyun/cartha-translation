base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/002.yaml
  text: 'She says, "Listen: the black is this world, in which you dwell. And the fiery and blood-red is because this world must be destroyed by blood and fire. But the golden portion is you who have escaped this world. For just as gold is tested by fire and becomes useful, so also you are being tested in them. Therefore, those who remain and are burned by it will be purified. Just as gold casts off its dross, so also you will cast off every grief and distress, and you will be purified and will be useful for the building of the tower.'
translation:
  language: pt
  text: 'Ela disse: “Escute: a parte negra é este mundo, no qual vocês vivem. A parte ardente e vermelho-sangue significa que este mundo deve ser destruído por sangue e fogo. A parte dourada, porém, representa vocês, os que escaparam deste mundo. Pois, assim como o ouro é provado pelo fogo e se torna útil, vocês também estão sendo provados em meio a essas coisas.[a] Portanto, os que permanecerem e forem abrasados pelo fogo serão purificados. Assim como o ouro se livra de sua escória, vocês também se livrarão de toda tristeza e angústia, serão purificados e se tornarão úteis para a construção da torre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos acrescentam: “os que vivem em meio a elas”. O pronome grego traduzido por “essas coisas” tem referência incerta.'
    reason: A expressão οἱ κατοικοῦντες aparece entre colchetes na edição-fonte, indicando dúvida textual, e o antecedente plural de ἐν αὐτοῖς não é explícito.
lexical_decisions:
- source_word: τὸ ... μέλαν / τὸ ... πυροειδὲς καὶ αἱματῶδες / τὸ ... χρυσοῦν μέρος
  choice: a parte preta / a parte cor de fogo e de sangue / a parte dourada
  rationale: Mantém a referência visual às partes coloridas da cabeça do animal, expressa no contexto anterior; “cor de fogo e de sangue” comunica naturalmente os dois adjetivos gregos.
- source_word: ἀπόλλυσθαι
  choice: ser destruído
  rationale: Preserva o sentido passivo forte de perecimento ou destruição sem especificar um agente não expresso.
- source_word: ἐκφυγόντες
  choice: os que escaparam
  rationale: Reproduz a ideia de fuga bem-sucedida, sem transformar a frase em uma afirmação técnica sobre salvação.
- source_word: δοκιμάζεται / δοκιμάζεσθε
  choice: é provado / estão sendo provados
  rationale: Conserva a metáfora metalúrgica de testar e refinar o ouro e sua aplicação aos destinatários.
- source_word: μείναντες
  choice: permanecerem firmes
  rationale: No contexto de provação pelo fogo, explicita de modo natural a perseverança implícita em “permanecer”, sem acrescentar uma doutrina específica.
- source_word: πυρωθέντες
  choice: forem abrasados
  rationale: Mantém a imagem intensa de exposição ao fogo, ligada ao refino do ouro.
- source_word: σκωρίαν
  choice: escória
  rationale: É o equivalente metalúrgico direto e preserva a imagem do processo de purificação.
- source_word: οἰκοδομὴν τοῦ πύργου
  choice: construção da torre
  rationale: Traduz literalmente a imagem central da obra e evita interpretar antecipadamente seu simbolismo.
theological_decisions:
- issue: Relação entre escapar do mundo e ainda ser provado nele
  choice: Conservar ambas as afirmações lado a lado
  alternative: Harmonizar “escaparam” como se significasse já terem sido retirados fisicamente do mundo
  rationale: O grego mantém a tensão entre ter escapado deste mundo e continuar sob provação; a tradução não resolve essa tensão.
- issue: Valor purificador da provação
  choice: “serão purificados”
  alternative: “serão salvos” ou “serão santificados”
  rationale: O texto emprega linguagem explícita de purificação metalúrgica, não um termo técnico de salvação ou santificação.
- issue: Sentido de χρήσιμοι na imagem da torre
  choice: “úteis para a construção da torre”
  alternative: “dignos de integrar a Igreja”
  rationale: Preserva a metáfora e evita identificar a torre por interpretação doutrinária dentro do texto traduzido.
translation_notes:
  register: Português moderno, claro e digno, com formas brasileiras amplamente compreensíveis. O discurso direto e a metáfora do refino foram preservados. Empregou-se “vocês” para o plural, em consonância com a legibilidade brasileira, sem coloquialismo excessivo.
