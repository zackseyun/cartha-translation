  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/005.yaml
  text: Having said these things, she went away, and I did not see to what place she went; for a noise occurred. And I turned around in fear, thinking that the beast was coming.
translation:
  language: pt
  text: Depois de dizer essas coisas, ela partiu, e eu não vi para que lugar foi, pois houve um ruído. Então me virei para trás, assustado, pensando que a besta estava chegando.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: foi embora
  rationale: Expressa de modo natural o afastamento da mulher, sem acrescentar um destino não indicado pelo texto.
- source_word: ψόφος
  choice: ruído
  rationale: Mantém a referência ampla a um som ou barulho, sem especificar sua origem.
- source_word: τὸ θηρίον
  choice: a fera
  rationale: Preserva a imagem de um animal ameaçador já identificado no contexto, em linguagem clara e digna.
