base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/001.yaml
  text: I asked her about the four colors that the beast had on its head. But she answered me and says, "Again you are curious about such matters." "Yes, my Lady," I say; "make known to me what these things are."
translation:
  language: pt
  text: 'Perguntei-lhe sobre as quatro cores que o animal tinha na cabeça. Ela, porém, respondeu-me: “Mais uma vez você é curioso sobre essas coisas.”


    “Sim, senhora”, eu disse. “Diga-me o que são estas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: animal
  rationale: No contexto visionário, designa a criatura ameaçadora vista por Hermas. “Animal” preserva o sentido básico sem acrescentar as conotações apocalípticas mais específicas que “besta” pode ter no português atual.
- source_word: περίεργος
  choice: curioso
  rationale: Expressa o interesse insistente de Hermas em saber mais; aqui não precisa assumir necessariamente o sentido negativo forte de “intrometido”.
- source_word: κυρία
  choice: senhora
  rationale: Mantém a forma respeitosa de tratamento dirigida à figura feminina, em português natural e digno.
- source_word: γνώρισόν μοι
  choice: Explique-me
  rationale: No contexto, o pedido não é apenas receber uma informação, mas compreender o significado das cores; “explique-me” comunica isso naturalmente.
- source_word: τί ἐστιν ταῦτα
  choice: o que elas significam
  rationale: O referente imediato são as quatro cores e sua interpretação simbólica. A formulação portuguesa torna explícito o valor contextual sem resolver além do que a continuação confirma.
