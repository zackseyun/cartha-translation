revisions:
- from: “Portanto, não deixe de falar aos ouvidos dos santos. Vocês também têm[a] a figura da grande tribulação que está por vir. Mas, se quiserem, ela não será nada. Lembrem-se do que foi escrito anteriormente.”
  to: “Portanto, não deixe de falar aos ouvidos dos santos. Vocês também têm[a] a figura da grande tribulação que está por vir. Mas, se quiserem, não será nada. Lembrem-se das coisas escritas anteriormente.”
  rationale: A revisão preserva a elipse de «não será nada», sem especificar que a afirmação se refere diretamente à tribulação, e restitui o plural de «as coisas escritas anteriormente». O restante do texto e a nota de mudança de número são fiéis ao grego e adequados ao português-alvo.
