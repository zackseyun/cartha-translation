review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a exortação, a mudança do singular para o plural, a referência à grande tribulação e a ordem final. Contudo, «ela não será nada» atribui explicitamente o sujeito à «tribulação», enquanto o grego diz de modo elíptico οὐδὲν ἔσται («não será nada»), sem identificar o referente. A elipse deve ser preservada.
  naturalness: O português é moderno, claro e de registro apropriado. «Falar aos ouvidos dos santos» mantém deliberadamente a imagem concreta do grego e permanece compreensível. A formulação elíptica «se quiserem, não será nada» é natural no contexto e preserva melhor a indeterminação do original.
  terminology: «Santos», «grande tribulação» e «figura» são escolhas defensáveis. «Figura» comunica adequadamente τύπον como representação simbólica mostrada na visão. «As coisas escritas anteriormente» reflete mais de perto o plural substantivado τὰ προγεγραμμένα do que «o que foi escrito anteriormente».
  issues:
  - severity: medium
    issue: O pronome «ela» resolve uma referência que o grego deixa elíptica.
    rationale: Em ἐὰν δὲ ὑμεῖς θελήσητε, οὐδὲν ἔσται, não há pronome nem substantivo expresso que determine que «a tribulação» seja o sujeito. Embora essa possa ser a leitura contextual, a tradução não deve estreitar essa ambiguidade.
  - severity: low
    issue: «O que foi escrito anteriormente» torna singular/coletiva a expressão plural τὰ προγεγραμμένα.
    rationale: A expressão significa literalmente «as coisas escritas antes/anteriormente». Manter o plural preserva melhor a forma e o alcance aberto do texto.
  revised_text: “Portanto, não deixe de falar aos ouvidos dos santos. Vocês também têm[a] a figura da grande tribulação que está por vir. Mas, se quiserem, não será nada. Lembrem-se das coisas escritas anteriormente.”
  revised_footnotes:
  - marker: a
    text: O grego passa aqui do singular, dirigido a Hermas («não deixe»), para o plural («vocês têm», «quiserem», «lembrem-se»).
    reason: Registra a mudança de número gramatical, relevante para distinguir a comissão pessoal de Hermas da exortação dirigida à comunidade.
  revision_rationale: A revisão preserva a elipse de «não será nada», sem especificar que a afirmação se refere diretamente à tribulação, e restitui o plural de «as coisas escritas anteriormente». O restante do texto e a nota de mudança de número são fiéis ao grego e adequados ao português-alvo.
