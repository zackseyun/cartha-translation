base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/004.yaml
  text: '"You, therefore, do not cease speaking in the ears of the holy ones. You also have the pattern of the great tribulation that is coming; but if you are willing, it will be nothing. Remember the things written beforehand."'
translation:
  language: pt
  text: “Portanto, não deixe de falar aos ouvidos dos santos. Vocês também têm[a] a figura da grande tribulação que está por vir. Mas, se quiserem, não será nada. Lembrem-se das coisas escritas anteriormente.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego passa aqui do singular, dirigido a Hermas («não deixe»), para o plural («vocês têm», «quiserem», «lembrem-se»).
    reason: Registra a mudança de número gramatical, relevante para distinguir a comissão pessoal de Hermas da exortação dirigida à comunidade.
lexical_decisions:
- source_word: διαλίπῃς
  choice: deixe de
  rationale: A construção negativa μὴ διαλίπῃς exprime não interromper ou não cessar uma atividade; “não deixe de” é natural e preserva a exortação contínua.
- source_word: λαλῶν εἰς τὰ ὦτα
  choice: falar aos ouvidos
  rationale: Mantém a imagem concreta do grego, em vez de reduzi-la simplesmente a “dizer” ou “anunciar”.
- source_word: τῶν ἁγίων
  choice: dos santos
  rationale: Equivalente tradicional e direto para os membros consagrados do povo de Deus, sem acrescentar uma identificação denominacional.
- source_word: τύπον
  choice: figura
  rationale: No contexto, refere-se à representação simbólica da tribulação oferecida pela visão; “figura” preserva esse caráter representativo sem impor a ideia mais restrita de exemplo ou modelo moral.
- source_word: θλίψεως
  choice: tribulação
  rationale: Preserva o peso escatológico e aflitivo do termo no contexto da “grande tribulação” vindoura.
- source_word: τὰ προγεγραμμένα
  choice: o que foi escrito anteriormente
  rationale: Reproduz o sentido passivo e retrospectivo da expressão sem especificar indevidamente quais escritos estão em vista.
theological_decisions:
- issue: Sentido de “se quiserem, ela não será nada”
  choice: Preservar a formulação condicional e a referência aberta da afirmação
  alternative: Explicitar que a tribulação não os prejudicará ou não terá poder sobre eles
  rationale: O grego diz literalmente que, se eles quiserem, “nada será”, sem explicar de que modo. A tradução evita resolver uma tensão possivelmente ligada à resposta obediente dos ouvintes.
- issue: Identidade dos “santos”
  choice: Traduzir literalmente como “santos”
  alternative: “cristãos”, “fiéis” ou “membros da igreja”
  rationale: As alternativas interpretam o referente; o texto apenas emprega a designação religiosa geral “os santos”.
translation_notes:
  register: Português moderno, claro e digno, com “você/vocês” para ampla legibilidade brasileira. A imagem “falar aos ouvidos” e a expressão enigmática “ela não será nada” foram mantidas para preservar a textura e a ambiguidade do original.
