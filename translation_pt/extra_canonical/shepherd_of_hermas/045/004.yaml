base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/004.yaml
  text: '"When a man fills very many clay jars with good wine, and among those jars a few are empty, he comes to the jars and does not inspect the full ones—for he knows they are full—but he inspects the empty ones, fearing lest they have turned sour; for empty jars quickly turn sour, and the pleasure of the wine is lost.'
translation:
  language: pt
  text: “Quando alguém enche muitíssimas vasilhas de barro com vinho bom, e entre aquelas vasilhas há algumas poucas vazias, chega às vasilhas e não examina as cheias, pois sabe que estão cheias; examina, porém, as vazias, com receio de que tenham azedado. Pois as vasilhas vazias azedam depressa, e o prazer do vinho se perde.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεράμια
  choice: vasilhas de barro
  rationale: Expressa o sentido de recipientes cerâmicos sem restringir a forma ou o tamanho.
- source_word: κατανοεῖ
  choice: examina
  rationale: No contexto, indica observar ou inspecionar atentamente as vasilhas.
- source_word: ὤξισαν / ὀξίζουσι
  choice: tenham azedado / azedam
  rationale: Preserva a imagem concreta do processo de acidificação associado às vasilhas vazias.
- source_word: ἡ ἡδονὴ τοῦ οἴνου
  choice: o sabor agradável do vinho
  rationale: Formulação natural em português que comunica o prazer ou qualidade aprazível do vinho, sem reduzir a expressão apenas ao gosto físico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez proverbial. A repetição de “vasilhas” e “cheias/vazias” foi mantida por ser estrutural à comparação.
