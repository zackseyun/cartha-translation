review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha corretamente a comparação e preserva a sequência argumentativa. Contudo, ὀλίγα especifica que são poucas as vasilhas vazias, nuance ausente em «algumas», e ἱκανώτατα é mais bem representado por «muitíssimas»/«muitas e muitas».
  naturalness: O português é claro, moderno e apropriado ao registro proverbial. «Prazer do vinho» comunica mais diretamente ἡ ἡδονὴ τοῦ οἴνου do que «sabor agradável do vinho», que restringe a expressão ao paladar.
  terminology: «Vasilhas de barro» é uma solução adequada e não excessivamente específica para κεράμια; «examinar» representa bem κατανοεῖ; «azedar» preserva a imagem do grego.
  issues:
  - severity: low
    issue: Quantidade das vasilhas vazias não está explicitada.
    rationale: ὀλίγα significa «poucas»; «algumas» pode indicar um número indeterminado sem a ênfase contrastiva pretendida.
  - severity: low
    issue: A formulação final restringe «prazer» a «sabor».
    rationale: ἡδονή denota prazer, deleite ou fruição; «o prazer do vinho» preserva melhor a amplitude da expressão, em consonância com o inglês auditado.
  revised_text: “Quando alguém enche muitíssimas vasilhas de barro com vinho bom, e entre aquelas vasilhas há algumas poucas vazias, chega às vasilhas e não examina as cheias, pois sabe que estão cheias; examina, porém, as vazias, com receio de que tenham azedado. Pois as vasilhas vazias azedam depressa, e o prazer do vinho se perde.”
