revisions:
- from: “Quando alguém enche muitas vasilhas de barro com vinho bom, e entre elas há algumas vazias, ao chegar às vasilhas não examina as cheias, pois sabe que estão cheias; examina, porém, as vazias, com receio de que tenham azedado. De fato, as vasilhas vazias azedam depressa, e o sabor agradável do vinho se perde.”
  to: “Quando alguém enche muitíssimas vasilhas de barro com vinho bom, e entre aquelas vasilhas há algumas poucas vazias, chega às vasilhas e não examina as cheias, pois sabe que estão cheias; examina, porém, as vazias, com receio de que tenham azedado. Pois as vasilhas vazias azedam depressa, e o prazer do vinho se perde.”
  rationale: A revisão explicita o contraste quantitativo de «poucas» vasilhas vazias, reforça moderadamente a quantidade expressa pelo superlativo grego e restitui «prazer» como o sentido mais amplo de ἡδονή, sem alterar a imagem ou introduzir interpretação teológica.
