base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/002.yaml
  text: '"A person," I say, "Lord, is eager to keep the commandments of God, and there is no one who does not ask from the Lord to be strengthened in his commandments and to be subject to them; but the devil is harsh and tyrannizes them."'
translation:
  language: pt
  text: — O ser humano — digo eu —, senhor, está disposto a guardar os mandamentos de Deus, e não há ninguém que não peça ao Senhor que seja fortalecido nos seus mandamentos e se submeta a eles; mas o diabo é severo e os tiraniza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ μὲν ἄνθρωπος
  choice: O ser humano
  rationale: Expressa o sentido genérico de ἄνθρωπος de modo inclusivo e natural, sem restringi-lo ao sexo masculino.
- source_word: πρόθυμός ἐστι
  choice: está disposto
  rationale: Comunica prontidão e boa vontade, preservando o contraste com a oposição do diabo.
- source_word: φυλάσσειν
  choice: guardar
  rationale: Mantém a formulação bíblica corrente para observar e cumprir mandamentos.
- source_word: ἐνδυναμωθῇ ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: o fortaleça nos seus mandamentos
  rationale: Preserva a construção incomum do grego e sua possível ideia de fortalecimento na esfera da obediência, sem reduzi-la a uma interpretação única.
- source_word: ὑποταγῇ αὐταῖς
  choice: o faça sujeitar-se a eles
  rationale: Representa a voz passiva e a ideia forte de submissão aos mandamentos; o pronome masculino concorda em português com “mandamentos”.
- source_word: σκληρός
  choice: cruel
  rationale: No contexto da opressão diabólica, transmite melhor que “duro” a severidade hostil indicada pelo termo.
- source_word: καταδυναστεύει
  choice: domina tiranicamente
  rationale: Retém a força de opressão e exercício abusivo de poder presente no verbo, além de preparar a resposta do parágrafo seguinte.
theological_decisions:
- issue: Agência divina na submissão aos mandamentos
  choice: “o fortaleça [...] e o faça sujeitar-se”
  alternative: “seja fortalecido [...] e se submeta”
  rationale: A forma escolhida conserva o pedido dirigido ao Senhor e representa os dois passivos gregos sem afirmar uma teoria específica sobre graça e vontade humana.
- issue: Referente de αὐτῶν em “καταδυναστεύει αὐτῶν”
  choice: “os domina tiranicamente”
  alternative: “domina tiranicamente as pessoas”
  rationale: O pronome retoma genericamente os seres humanos que desejam obedecer e pedem auxílio; a tradução preserva essa retomada sem acrescentar uma categoria teológica.
translation_notes:
  register: Português moderno, digno e acessível, com forma de diálogo preservada. “Senhor” foi grafado em minúscula porque κύριε é o tratamento dado por Hermas ao interlocutor, enquanto “Senhor” em “peça ao Senhor” se refere a Deus.
