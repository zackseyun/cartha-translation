revisions:
- from: — O ser humano — digo eu —, senhor, está disposto a guardar os mandamentos de Deus, e não há ninguém que não peça ao Senhor que o fortaleça nos seus mandamentos e o faça sujeitar-se a eles; mas o diabo é cruel e os domina tiranicamente.
  to: — O ser humano — digo eu —, senhor, está disposto a guardar os mandamentos de Deus, e não há ninguém que não peça ao Senhor que seja fortalecido nos seus mandamentos e se submeta a eles; mas o diabo é severo e os tiraniza.
  rationale: A revisão elimina a causatividade introduzida na tradução dos verbos passivos gregos, mantendo sem explicação doutrinária adicional o pedido de fortalecimento e a submissão aos mandamentos. Também ajusta a tradução de σκληρός a um equivalente mais próximo, sem reduzir a força opressiva de καταδυναστεύει.
