base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/005.yaml
  text: '"So also the devil comes upon all the slaves of God, testing them. Therefore, as many as are full in faith have strongly resisted him, and he withdraws from them, having no place where he may enter. He comes then to the empty ones; and having a place, he enters into them, and he does in them what he wishes, and they become enslaved to him."'
translation:
  language: pt
  text: Assim também o diabo vem a todos os servos de Deus para pô-los à prova. Portanto, todos os que estão cheios de fé resistem-lhe firmemente, e ele se afasta deles, pois não encontra por onde entrar. Então vai até os que estão vazios; como encontra espaço, entra neles, faz neles o que quer, e eles se tornam seus escravos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλους τοῦ Θεοῦ
  choice: servos de Deus
  rationale: “Servos” preserva a relação de sujeição expressa por δοῦλοι e soa natural e digna em português; o contraste final com a escravização ao diabo permanece perceptível.
- source_word: ἐκπειράζων
  choice: para pô-los à prova
  rationale: Expressa a ação de testar ou tentar no contexto sem decidir de forma excessiva entre prova e tentação.
- source_word: πλήρεις ... ἐν τῇ πίστει
  choice: cheios de fé
  rationale: Reproduz a metáfora dos recipientes cheios desenvolvida no contexto anterior e mantém a fé como conteúdo ou esfera dessa plenitude.
- source_word: ἀποκένους
  choice: os que estão vazios
  rationale: Mantém a imagem explícita dos vasos vazios do contexto, em vez de substituí-la por uma interpretação como “fracos na fé”.
- source_word: ὑπόδουλοι
  choice: seus escravos
  rationale: Comunica a sujeição intensiva do termo e sustenta o contraste retórico com os “servos de Deus”.
theological_decisions:
- issue: Natureza da ação do diabo em ἐκπειράζων
  choice: pôr à prova
  alternative: tentar
  rationale: “Pôr à prova” conserva a amplitude semântica e evita afirmar que o texto trata exclusivamente de sedução moral, embora essa nuance permaneça possível.
- issue: Condição dos “vazios”
  choice: preservar a metáfora sem explicá-la
  alternative: traduzir como “vazios de fé” ou “fracos na fé”
  rationale: O grego diz apenas “os vazios”, remetendo à comparação anterior; acrescentar “de fé” resolveria uma associação que o autor deixa implícita.
- issue: Entrada do diabo
  choice: 'linguagem direta: “entra neles”'
  alternative: paráfrase psicológica ou moral
  rationale: Preserva a formulação e a tensão teológica do texto sem definir a natureza exata dessa entrada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição e a metáfora de cheio/vazio foram preservadas; “resistem-lhe” mantém tom literário moderado sem arcaísmo excessivo.
