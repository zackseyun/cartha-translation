base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/003.yaml
  text: '"He is not able," he says, "to tyrannize the slaves of God—those who hope in him with their whole heart. The devil can wrestle against them, but he cannot overcome them. If, therefore, you resist him, defeated he will flee from you, disgraced. But those who are empty," he says, "are afraid of the devil as though he had power.'
translation:
  language: pt
  text: “Ele não pode”, diz ele, “dominar os servos de Deus que esperam nele de todo o coração. O diabo pode lutar contra eles, mas não pode vencê-los. Portanto, se vocês lhe resistirem, ele fugirá de vocês, derrotado e envergonhado. Mas os que estão vazios”, diz ele, “têm medo do diabo, como se ele tivesse poder.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταδυναστεύειν
  choice: dominar
  rationale: Expressa opressão e exercício tirânico de poder sem tornar a frase artificial em português.
- source_word: τῶν δούλων τοῦ Θεοῦ
  choice: os servos de Deus
  rationale: Mantém a linguagem religiosa corrente e digna; aqui o genitivo depende de ‘dominar’.
- source_word: τῶν ἐξ ὅλης καρδίας ἐλπιζόντων ἐπ' αὐτόν
  choice: que esperam nele de todo o coração
  rationale: Preserva a confiança dirigida a Deus e a integralidade indicada por ἐξ ὅλης καρδίας.
- source_word: ἀντιπαλαῖσαι ... καταπαλαῖσαι
  choice: lutar contra ... vencer
  rationale: Conserva o contraste entre entrar em combate e alcançar vitória, embora o jogo de palavras do vocabulário da luta não possa ser reproduzido integralmente com naturalidade.
- source_word: ἀπόκενοί
  choice: vazios
  rationale: Mantém a imagem concreta que será desenvolvida imediatamente na comparação com recipientes de vinho.
- source_word: κατῃσχυμμένος
  choice: envergonhado
  rationale: Representa o sentido de derrota acompanhada de vergonha pública ou humilhação.
theological_decisions:
- issue: A capacidade do diabo diante dos servos de Deus
  choice: pode lutar contra eles, mas não pode vencê-los
  alternative: pode atacá-los, mas não pode dominá-los
  rationale: 'Preserva a tensão do texto: o diabo tem capacidade real de oposição, porém não de vitória sobre os que confiam plenamente em Deus.'
- issue: A expressão ὡς δύναμιν ἔχοντα
  choice: como se ele tivesse poder
  alternative: como alguém que tem poder
  rationale: O valor comparativo de ὡς sugere a percepção equivocada dos ‘vazios’, sem negar de modo absoluto toda capacidade de ação do diabo, já reconhecida na frase anterior.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por ‘vocês’. A repetição ‘diz ele’ foi mantida para refletir o diálogo narrado. A metáfora dos ‘vazios’ foi preservada sem explicação intrusiva, pois o contexto subsequente a desenvolve.
