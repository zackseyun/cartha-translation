base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/005.yaml
  text: He says to me, "I tell you, this is not fasting, the kind you suppose you are fasting to the Lord. Listen to a parable. A vineyard, not having weeds, will give more fruit, not being choked by the weeds. So the slave took up [his tool], dug the vineyard, and pulled up all the weeds that were in the vineyard. And that vineyard became very comely and thriving, having no weeds to choke it.
translation:
  language: pt
  text: 'Ele me disse: “Eu lhe digo que isso não é jejum, embora vocês pensem que estão jejuando para o Senhor. Ouça uma parábola. Uma vinha sem ervas daninhas dará mais fruto, pois elas não a sufocam. Então o escravo pôs mãos à obra, cavou a vinha e arrancou todas as ervas daninhas que havia nela. Assim, aquela vinha ficou muito bonita e viçosa, sem ervas daninhas que a sufocassem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεία / νηστεύειν
  choice: jejum / jejuar
  rationale: Mantém o termo religioso comum e a repetição enfática do grego.
- source_word: δοκεῖτε
  choice: pensem
  rationale: Expressa a percepção equivocada indicada pelo verbo, sem acrescentar julgamento além do texto.
- source_word: βοτάνας
  choice: ervas daninhas
  rationale: No contexto agrícola, refere-se à vegetação indesejada que sufoca a vinha; “ervas” isoladamente seria ambíguo em português moderno.
- source_word: λαβών
  choice: pôs mãos à obra
  rationale: O particípio aparece sem objeto explícito no texto fornecido. A formulação portuguesa transmite o início da ação sem inventar uma ferramenta específica.
- source_word: εὐπρεπέστατος καὶ εὐθαλής
  choice: muito bonita e viçosa
  rationale: Reproduz tanto a boa aparência quanto o vigor florescente da vinha em linguagem natural e clara.
theological_decisions:
- issue: Natureza do jejum dirigido ao Senhor
  choice: “isso não é jejum, embora vocês pensem que estão jejuando para o Senhor”
  alternative: “esse jejum que vocês observam para ele é inútil”
  rationale: Preserva a tensão do grego entre a prática considerada jejum pelos ouvintes e sua rejeição como verdadeiro jejum, sem antecipar uma interpretação doutrinária da parábola.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário agrícola comum. O discurso direto e a mudança para a parábola foram preservados. Evitou-se suprir “ferramenta” como objeto de λαβών, pois o objeto não está expresso no trecho grego fornecido.
