  text: '"Have you come?" I say, "Because, sir, I am keeping a station."'
translation:
  language: pt
  text: “Vieste?” “Porque, senhor”, respondo, “estou observando uma estação[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Estação” era um termo técnico para uma observância religiosa que incluía jejum; a fala seguinte explica o seu sentido.
    reason: O empréstimo grego στατίων é técnico e pouco transparente para leitores modernos, mas deve ser mantido, pois o diálogo seguinte pergunta o que ele significa.
lexical_decisions:
- source_word: ἐλήλυθας
  choice: Vieste?
  rationale: Mantém a forma interrogativa do perfeito grego, que aqui pergunta pela vinda do interlocutor; o trecho fornecido começa no meio do diálogo.
- source_word: φημί
  choice: respondi
  rationale: No diálogo, o verbo de dizer introduz a resposta do narrador; ‘respondi’ soa natural em português sem alterar o conteúdo.
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento, sem exigir aqui uma identificação teológica específica.
- source_word: στατίωνα ἔχω
  choice: estou cumprindo uma estação
  rationale: Preserva o termo técnico raro ‘estação’, cujo sentido é esclarecido imediatamente no diálogo subsequente como uma prática de jejum, em vez de antecipar essa explicação na tradução.
theological_decisions:
- issue: Sentido religioso de στατίων
  choice: Manter o termo técnico ‘estação’ com nota explicativa
  alternative: Traduzir diretamente por ‘estou jejuando’ ou ‘estou observando um dia de jejum’
  rationale: A sequência distingue inicialmente ‘estação’ de sua explicação como jejum. Traduzir de imediato por ‘jejum’ apagaria a progressão pedagógica do diálogo.
translation_notes:
  register: Português atual, digno e acessível. A abertura abrupta foi preservada porque o texto-fonte fornecido começa no meio de uma pergunta; ‘É porque’ torna a resposta causal inteligível sem reconstruir palavras ausentes.
