  text: 'Eu pergunto: “Por que o senhor diz isso?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατί
  choice: Por que
  rationale: Introduz uma pergunta direta sobre a razão da afirmação anterior.
- source_word: φημί
  choice: Eu pergunto
  rationale: Embora o verbo signifique literalmente “digo”, no contexto introduz uma pergunta; “pergunto” é natural em português e mantém o diálogo claro.
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento dirigida ao interlocutor; a inicial minúscula evita identificar indevidamente o personagem como o Senhor divino.
- source_word: τοῦτο λέγεις
  choice: diz isso
  rationale: Reproduz de modo direto e idiomático a referência à declaração anterior.
theological_decisions:
- issue: Identidade implícita no vocativo κύριε
  choice: senhor, com inicial minúscula
  alternative: Senhor, com inicial maiúscula
  rationale: O trecho apresenta um tratamento respeitoso dentro do diálogo, sem exigir neste ponto uma identificação divina; a tradução preserva essa abertura contextual.
translation_notes:
  register: Português moderno, claro e digno, com pontuação de diálogo natural. A primeira pessoa explícita representa φημί e facilita a leitura do segmento isolado.
