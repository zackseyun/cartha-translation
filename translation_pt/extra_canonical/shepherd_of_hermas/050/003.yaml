translation:
  language: pt
  text: 'Ele diz: “Vocês não sabem jejuar para o Senhor, nem esse jejum inútil que vocês praticam para ele é jejum.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεύειν τῷ Κυρίῳ
  choice: jejuar para o Senhor
  rationale: Preserva o dativo de referência ou benefício e expressa naturalmente que o jejum é dirigido ao Senhor.
- source_word: ἀνωφελής
  choice: inútil
  rationale: Reproduz de modo direto a avaliação de que esse jejum não traz proveito.
- source_word: ἣν νηστεύετε αὐτῷ
  choice: que vocês fazem para ele
  rationale: Evita a repetição pouco natural de “jejum que vocês jejuam”, sem eliminar a ideia de prática dirigida ao Senhor.
theological_decisions:
- issue: Natureza da censura ao jejum
  choice: “esse jejum inútil [...] não é jejum”
  alternative: “esse jejum [...] não tem valor”
  rationale: Mantém a formulação paradoxal e enfática do grego, sem reinterpretá-la como mera falta de mérito ou eficácia religiosa.
translation_notes:
  register: Português atual, claro e digno, com tratamento no plural (“vocês”) e discurso direto natural. A repetição retórica entre “jejuar” e “jejum” foi preservada onde soa idiomática.
