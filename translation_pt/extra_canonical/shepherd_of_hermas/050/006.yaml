base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/006.yaml
  text: '"After a time the master of the slave [and of the field] came and went into the vineyard. And seeing the vineyard well fenced, and even dug, and [all] the weeds pulled out, he rejoiced greatly over his slave on account of his deed. Summoning again his friends and his son, the master announced to them the deed the slave had done with his portions which he had received; and they approved all the more that the slave should become co-heir with his son."'
translation:
  language: pt
  text: Depois de algum tempo, o senhor do escravo [e do campo][a] veio e entrou na vinha. Ao ver que a vinha estava bem cercada, que também havia sido cavada e que [todas][b] as ervas daninhas tinham sido arrancadas, alegrou-se muito com seu escravo por causa do que ele havia feito. Então o senhor tornou a reunir seus amigos e seu filho e lhes contou o que o escravo havia feito com as porções de alimento que recebera. Eles aprovaram ainda mais que o escravo se tornasse coerdeiro com seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos não trazem “e do campo”.
    reason: A expressão aparece entre colchetes na edição-fonte, indicando incerteza textual.
  - marker: b
    text: Alguns manuscritos não trazem “todas”.
    reason: A palavra aparece entre colchetes na edição-fonte, indicando incerteza textual.
lexical_decisions:
- source_word: δεσπότης
  choice: senhor
  rationale: Expressa de modo natural a autoridade do proprietário sobre o escravo, sem a conotação política moderna de “déspota”.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a condição social explícita no grego, em vez de suavizá-la como “servo”.
- source_word: κεχαρακωμένον
  choice: bem cercada
  rationale: No contexto da vinha, indica que ela havia sido protegida ou delimitada por uma cerca.
- source_word: βοτάνας
  choice: ervas daninhas
  rationale: O contexto mostra plantas indesejadas que sufocavam a vinha; esta expressão comunica claramente esse sentido.
- source_word: ἐδέσμασιν
  choice: porções de alimento
  rationale: Refere-se ao alimento ou às provisões recebidas pelo escravo; “porções de alimento” preserva a referência concreta e se ajusta ao contexto narrativo.
- source_word: συγκληρονόμον
  choice: coerdeiro
  rationale: Equivalente direto que mantém a ideia de compartilhar a herança com o filho.
theological_decisions:
- issue: Relação do escravo com o filho na herança
  choice: “coerdeiro com o filho dele”
  alternative: “herdeiro junto com seu filho”
  rationale: Mantém a formulação forte e potencialmente tensa do grego, sem explicar alegoricamente nem reduzir a igualdade indicada pelo prefixo συν-.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A tradução mantém a terminologia social e agrícola concreta do original e sinaliza no texto as duas variantes indicadas pela edição.
