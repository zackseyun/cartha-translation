  naturalness: A redação é clara e contemporânea. Pequenos ajustes tornam mais direta a correspondência verbal com o grego e eliminam a possível ambiguidade de “o filho dele”, que em português poderia remeter ao escravo, embora no grego se refira ao senhor.
  terminology: “Senhor”, “escravo”, “vinha”, “ervas daninhas”, “porções de alimento” e “coerdeiro” são escolhas adequadas. “Coerdeiro com seu filho” preserva a força relacional de συγκληρονόμον e explicita corretamente que o filho é o do senhor, sem interpretação alegórica.
