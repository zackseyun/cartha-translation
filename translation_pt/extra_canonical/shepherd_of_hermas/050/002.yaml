base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/002.yaml
  text: '"What," he says, "is a station?" I say, "I am fasting, sir." He says, "And what is this fasting that you are fasting?" I say, "As I have been accustomed, sir, so I fast."'
translation:
  language: pt
  text: '“O que é uma estação[a]?”, perguntou ele. “Estou jejuando, senhor”, respondi. Ele perguntou: “E o que é esse jejum que vocês praticam?” Respondi: “Jejuo como de costume, senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “estação” é um termo técnico para um período ou dia de observância religiosa, especialmente marcado pelo jejum.
    reason: O empréstimo grego στατίων pode não ser imediatamente compreensível em português e não deve ser reduzido silenciosamente a uma única modalidade de observância.
lexical_decisions:
- source_word: στατίων
  choice: estação
  rationale: Mantém o termo técnico emprestado, ligado a um período ou dia de observância e jejum, sem substituí-lo por uma interpretação específica; a nota esclarece o sentido.
- source_word: νηστεύω / νηστεία
  choice: jejuar / jejum
  rationale: Equivalentes portugueses diretos e naturais, preservando a repetição deliberada do diálogo.
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento adequada ao diálogo, sem pressupor que aqui seja um título divino.
- source_word: ὡς εἰώθειν
  choice: como de costume
  rationale: Expressa de modo corrente a prática habitual indicada pelo verbo grego.
theological_decisions:
- issue: Sentido técnico de στατίων
  choice: Manter “estação” com nota explicativa
  alternative: Traduzir diretamente como “dia de jejum”, “vigília” ou “observância”
  rationale: O termo técnico pode abranger uma observância religiosa associada ao jejum; uma tradução interpretativa eliminaria essa abertura sem necessidade.
- issue: Número de νηστεύετε
  choice: “vocês praticam”
  alternative: “você pratica”
  rationale: O grego traz a segunda pessoa do plural, provavelmente referindo-se à prática coletiva, e essa distinção deve ser preservada.
translation_notes:
  register: Português moderno, claro e digno. O presente histórico repetitivo do grego foi vertido como diálogo narrado em passado para maior naturalidade, mantendo as perguntas e respostas e a repetição central de “jejum/jejuar”.
