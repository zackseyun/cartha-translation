  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/007.yaml
  text: “If a woman,” I say, “sir, or again some man, should fall asleep, and one of them marries, does the one who marries sin?”
translation:
  language: pt
  text: “Senhor”, eu disse, “se uma mulher ou também algum homem morrer, e um deles se casar, quem se casa peca?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοιμηθῇ
  choice: morrer
  rationale: O verbo significa literalmente “adormecer”, mas aqui funciona como eufemismo comum para a morte; “morrer” comunica de modo claro o sentido contextual em português atual.
- source_word: γαμήσῃ / ὁ γαμῶν
  choice: se casar / quem se casa
  rationale: Mantém a referência geral ao novo casamento sem acrescentar qualificações que o grego não explicita.
- source_word: τις ἐξ αὐτῶν
  choice: um deles
  rationale: Reproduz a formulação abrangente do grego, aplicável tanto ao homem quanto à mulher, sem explicitar indevidamente “o cônjuge sobrevivente”.
- source_word: μήτι ἁμαρτάνει
  choice: comete pecado?
  rationale: A partícula introduz uma pergunta que tende a esperar resposta negativa; a tradução preserva a forma interrogativa sem tornar essa expectativa excessivamente explícita.
theological_decisions:
- issue: Novo casamento após a morte do cônjuge
  choice: Traduzir a pergunta sem antecipar sua resposta nem formular uma regra doutrinária adicional.
  alternative: Explicitar “o cônjuge sobrevivente pode casar-se novamente sem pecar?”
  rationale: O segmento apresenta apenas a pergunta; a tradução preserva sua tensão e deixa a resposta para o texto subsequente.
translation_notes:
  register: Português moderno, claro e digno, com “senhor” como tratamento respeitoso. O discurso foi pontuado naturalmente, preservando a estrutura dialogal e a generalidade de gênero do original.
