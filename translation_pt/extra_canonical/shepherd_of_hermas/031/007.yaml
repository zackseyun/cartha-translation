  source_fidelity: A formulação «um deles» preserva adequadamente a referência não especificada de τις ἐξ αὐτῶν, e «morrer» comunica com clareza o eufemismo κοιμηθῇ neste contexto. Contudo, φημί é presente («eu disse»), não pretérito («perguntei»), e a ordem do vocativo e da oração condicional pode refletir mais diretamente o grego sem perder naturalidade.
  naturalness: A pontuação de fala encaixada do rascunho («Se uma mulher», perguntei, «senhor...») é pouco natural em português. A revisão usa uma construção dialogal fluente e mantém o tratamento respeitoso «Senhor».
  terminology: «Peca?» é uma correspondência direta, natural e de registro apropriado para ἁμαρτάνει, evitando a perífrase um pouco mais pesada «comete pecado». «Se casar» mantém a generalidade do grego quanto ao novo casamento.
