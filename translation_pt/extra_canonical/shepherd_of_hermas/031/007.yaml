    rationale: O rascunho traduz φημί por «perguntei», no pretérito, embora o grego diga literalmente «digo». A fala continua sendo uma pergunta, mas a alteração reduz a correspondência formal do diálogo.
  - severity: low
    issue: Pontuação e disposição do vocativo
    rationale: Separar «Se uma mulher» de «senhor» por uma inserção narrativa produz uma abertura de discurso pouco idiomática. O vocativo pode vir no início sem alterar o sentido.
