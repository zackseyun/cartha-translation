base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/008.yaml
  text: “He does not sin,” he says; “but if someone remains by himself, he obtains for himself greater honor and great glory with the Lord; but if he also marries, he does not sin. Therefore keep purity and dignity, and you will live to God. These things that I speak to you and am about to speak, keep from now on, from the day you were entrusted to me, and I will dwell in your house. And for your former trespasses there will be forgiveness, if you keep my commandments; and there will also be forgiveness for all, if they keep these commandments of mine and walk in this purity.”
translation:
  language: pt
  text: “Não peca”, diz ele. “Mas, se alguém permanecer só, alcançará para si maior honra e grande glória junto do Senhor; porém, se também se casar, não peca. Portanto, guarde a pureza e a dignidade, e você viverá para Deus. Guarde, desde agora, estas coisas que lhe digo e que ainda vou dizer, desde o dia em que você foi entregue a mim, e habitarei em sua casa. Haverá perdão para as suas transgressões anteriores, se você guardar os meus mandamentos; e também haverá perdão para todos, se guardarem estes meus mandamentos e andarem nesta pureza.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφ' ἑαυτῷ μείνῃ
  choice: permanecer só
  rationale: Expressa naturalmente a ideia de não voltar a se casar, sem acrescentar um voto de celibato que o grego não explicita.
- source_word: τιμὴν καὶ μεγάλην δόξαν
  choice: maior honra e grande glória
  rationale: Mantém os dois substantivos e o contraste comparativo presente no texto.
- source_word: ἁγνείαν καὶ σεμνότητα
  choice: pureza e dignidade
  rationale: Preserva a distinção entre pureza, aqui com forte dimensão sexual, e conduta digna ou respeitável.
- source_word: ζήσῃ τῷ Θεῷ
  choice: viverá para Deus
  rationale: Conserva a formulação teológica concisa e a orientação da vida para Deus.
- source_word: μοι παρεδόθης
  choice: você foi entregue aos meus cuidados
  rationale: Torna claro o sentido relacional do passivo e evita a impressão moderna de entrega física, sem identificar além do texto quem fez a entrega.
- source_word: παραπτώμασιν
  choice: transgressões
  rationale: Traduz faltas ou violações morais de modo claro e digno, distinguindo-as sem rigidez excessiva de ἁμαρτία.
- source_word: πορευθῶσιν
  choice: andarem
  rationale: Mantém a metáfora bíblica de conduzir a vida segundo determinado caminho ou padrão.
theological_decisions:
- issue: Novo casamento após a morte do cônjuge
  choice: “se também se casar, não peca”
  alternative: “se voltar a se casar, não peca”
  rationale: A formulação escolhida segue de perto καὶ γαμήσῃ e preserva a afirmação explícita de que o casamento não constitui pecado, sem acrescentar uma qualificação doutrinária.
- issue: Maior honra de quem permanece sem se casar
  choice: “alcançará para si maior honra e grande glória junto do Senhor”
  alternative: “terá mais mérito diante do Senhor”
  rationale: Evita introduzir a categoria teológica de mérito, ausente do grego, e conserva tanto honra quanto glória.
- issue: Perdão condicionado à guarda dos mandamentos
  choice: manter explicitamente a construção “se”
  alternative: reformular como simples promessa incondicional
  rationale: O texto grego apresenta a condição com ἐάν; a tradução preserva essa tensão sem harmonização doutrinária.
- issue: Identidade do sujeito que promete habitar na casa
  choice: manter a primeira pessoa sem identificar o locutor
  alternative: explicitar “o anjo” ou “o Senhor”
  rationale: O trecho diz apenas “habitarei”; inserir uma identificação resolveria algo que deve permanecer dependente do contexto narrativo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O tratamento por “você” evita arcaísmo, enquanto “junto do Senhor”, “transgressões” e “andarem nesta pureza” preservam o tom religioso e a textura do original. Não foram necessárias notas de rodapé.
