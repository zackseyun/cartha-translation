  verdict: revise
  source_fidelity: 'O texto acompanha de perto o trecho grego correspondente e preserva adequadamente a afirmação de que o novo casamento não é pecado, a honra maior de quem permanece sem casar e as condições relativas ao perdão. Contudo, «você foi entregue aos meus cuidados» explicita uma relação de cuidado que o passivo μοι παρεδόθης não exprime; a formulação deve permanecer mais literal e aberta: «você foi entregue a mim».'
  naturalness: O português é moderno, fluente e adequado a leitores brasileiros e internacionais. «Guarde» corresponde mais diretamente ao imperativo grego τήρει do que «preserve» neste contexto de observância de instruções.
  terminology: «Pureza», «dignidade», «transgressões», «mandamentos» e «andarem nesta pureza» são escolhas defensáveis e mantêm o registro exortativo-religioso sem impor interpretação confessional. «Permanecer só» preserva com prudência a expressão que, no contexto, contrasta com casar-se novamente.
