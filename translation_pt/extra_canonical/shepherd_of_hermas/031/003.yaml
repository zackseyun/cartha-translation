  text: “I heard,” I say, “sir, from certain teachers, that there is no other repentance except that one when we went down into the water and received forgiveness of our former sins.”
translation:
  language: pt
  text: '“Farei ainda uma pergunta, senhor”, digo eu.

    “Fale”, diz ele.

    “Ouvi, senhor”, digo eu, “de certos mestres que não há outro arrependimento, a não ser aquele que houve quando descemos à água e recebemos o perdão de nossos pecados anteriores.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάνοια
  choice: arrependimento
  rationale: Expressa a mudança moral e espiritual indicada pelo termo grego, mantendo a formulação tradicional e compreensível em português.
- source_word: εἰς ὕδωρ κατέβημεν
  choice: descemos à água
  rationale: Preserva a imagem concreta e a primeira pessoa do plural do grego, sem substituir a expressão por uma explicação interpretativa como “fomos batizados”.
- source_word: ἄφεσιν
  choice: perdão
  rationale: É a forma natural em português para a remissão de pecados neste contexto.
- source_word: τῶν προτέρων
  choice: anteriores
  rationale: Mantém a referência aos pecados cometidos antes daquele acontecimento, sem especificar além do texto.
theological_decisions:
- issue: Relação entre a descida à água, arrependimento e perdão
  choice: Manter literalmente “descemos à água” e a afirmação de que então receberam perdão
  alternative: Explicitar “quando fomos batizados” ou reformular segundo uma teologia batismal específica
  rationale: O contexto provavelmente alude ao batismo, mas o texto desta unidade usa a imagem da descida à água. A tradução preserva essa formulação e não acrescenta uma interpretação denominacional.
- issue: Exclusividade do arrependimento mencionado
  choice: “não há outro arrependimento senão aquele”
  alternative: Suavizar como “não haveria outra oportunidade de arrependimento”
  rationale: A formulação categórica e sua tensão teológica pertencem ao texto e não devem ser resolvidas ou atenuadas na tradução.
translation_notes:
  register: Português moderno, digno e acessível, com pontuação de diálogo natural. “Senhor” conserva o tratamento respeitoso κύριε sem pressupor que o interlocutor seja Deus ou Cristo.
