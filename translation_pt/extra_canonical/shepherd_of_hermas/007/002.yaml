base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/002.yaml
  text: But what saves you is that you did not depart from the living God, and your simplicity and great self-control. These have saved you, if you continue in them, and they save all who do such things and who walk in innocence and simplicity. These prevail over all wickedness and remain unto eternal life.
translation:
  language: pt
  text: Mas o que salva você é o fato de não ter se afastado do Deus vivo, junto com sua sinceridade e seu grande domínio próprio. Essas coisas salvaram você, se permanecer nelas, e salvam todos os que praticam tais coisas e andam com inocência e sinceridade. Essas pessoas prevalecem contra toda maldade e perseveram para a vida eterna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότης
  choice: sinceridade
  rationale: Neste contexto moral, comunica integridade e ausência de duplicidade em português corrente, sem sugerir falta de inteligência.
- source_word: ἐγκράτεια
  choice: domínio próprio
  rationale: Expressa de modo natural a disciplina e contenção moral indicadas pelo termo grego.
- source_word: ἀκακία
  choice: inocência
  rationale: Preserva a ideia de ausência de malícia ou maldade, em paralelo com sinceridade.
- source_word: κατισχύουσιν
  choice: vencem
  rationale: Reproduz a ideia de prevalecer ou mostrar-se mais forte do que toda maldade.
- source_word: παραμένουσιν εἰς ζωὴν αἰώνιον
  choice: permanecem para a vida eterna
  rationale: Mantém a construção incomum e sua possível nuance de perseverança com vistas à vida eterna, sem explicá-la em excesso.
theological_decisions:
- issue: Relação entre a fidelidade humana e a salvação
  choice: Manter a linguagem direta de que não se afastar de Deus, a sinceridade e o domínio próprio salvam
  alternative: Reformular como meras evidências de uma salvação já recebida
  rationale: O grego atribui explicitamente força salvífica a essas realidades e condiciona sua continuidade à perseverança; a tradução não deve resolver essa tensão por meio de um sistema teológico posterior.
- issue: Valor condicional de ἐὰν ἐμμένῃς
  choice: se permanecer nelas
  alternative: contanto que você continue assim
  rationale: Preserva claramente a condição expressa no original e liga o pronome às qualidades mencionadas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “você” para o singular, conforme o tom direto do discurso, e evita “simplicidade” em ἁπλότης porque, no português atual, pode ser entendida como ingenuidade ou pouca capacidade; “sinceridade” preserva melhor a integridade sem duplicidade.
