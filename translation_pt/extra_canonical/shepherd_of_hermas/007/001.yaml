review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o grego: preserva a repetição de μνησικακία, a condicional ligada à disciplina, a amplitude de «casa» para οἶκος e a afirmação não especificada de que o ressentimento produz «morte». «Continue assim» é uma explicitação moderada da construção elíptica após «não deixe sua irmã», sem determinar a conduta omitida.'
  naturalness: O português é moderno, claro e adequado ao registro exortativo do texto. «Receberão uma correção justa» é natural e comunica o sentido formativo-corretivo de παιδεία.
  terminology: «Ressentimento», «correção justa», «aflições pessoais», «transgressões» e «negócios perversos» são escolhas defensáveis. A nota, porém, introduz como possibilidade uma identificação da irmã com a esposa que não é explicitada pelo trecho e cuja explicação («tratada como irmã na fé») não decorre do grego apresentado.
  issues:
  - severity: low
    issue: A nota de rodapé associa «irmã» à possível esposa de Hermas e menciona tratamento como irmã na fé.
    rationale: O texto grego apenas diz ἀδελφήν («irmã») e este segmento não identifica a pessoa. A nota deve limitar-se à ambiguidade histórica de identidade, sem fornecer uma justificativa não presente na passagem.
  - severity: low
    issue: «Se deixou envolver» pode atenuar a ação expressa por συνανεφύρης.
    rationale: O verbo descreve Hermas como alguém que se misturou ou se envolveu com suas atividades perversas. A forma ativa reflexiva «se envolveu» mantém melhor essa implicação sem alterar o sentido.
