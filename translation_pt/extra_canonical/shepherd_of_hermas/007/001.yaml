base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/001.yaml
  text: But you, Hermas, no longer bear a grudge against your children, nor allow your sister to continue, so that they may be cleansed from their former sins. For they will be disciplined with righteous discipline, if you do not bear a grudge against them. Bearing a grudge produces death. But you, Hermas, have had great personal tribulations because of the transgressions of your household, because you did not care for them, but neglected them and became entangled in your wicked business dealings.
translation:
  language: pt
  text: Mas você, Hermas, não guarde mais ressentimento contra seus filhos, nem deixe sua irmã[a] continuar assim, para que eles sejam purificados de seus pecados anteriores. Pois receberão uma correção justa, se você não guardar ressentimento contra eles. O ressentimento produz morte. Você, porém, Hermas, sofreu grandes aflições pessoais por causa das transgressões de sua casa, porque não cuidou dos seus, mas os negligenciou e se envolveu em seus negócios perversos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «irmã». A identidade dessa mulher não é especificada neste trecho.
    reason: Preserva a designação literal e não resolve uma identificação que o texto não fornece.
lexical_decisions:
- source_word: μνησικακήσῃς / μνησικακία
  choice: guarde ressentimento / O ressentimento
  rationale: Expressa de modo natural a ideia de conservar na memória uma ofensa e agir a partir dela; mantém a repetição enfática do grego.
- source_word: παιδευθήσονται ... παιδείᾳ δικαίᾳ
  choice: receberão uma correção justa
  rationale: Abrange disciplina formativa e corretiva sem sugerir apenas ensino ou punição; reproduz o qualificativo moral δικαίᾳ.
- source_word: ἰδιωτικὰς
  choice: pessoais
  rationale: No contexto, qualifica as aflições como próprias ou particulares de Hermas, em contraste com provações coletivas.
- source_word: τοῦ οἴκου σου
  choice: de sua casa
  rationale: Conserva a amplitude de οἶκος, que pode abranger família e unidade doméstica.
- source_word: ταῖς πραγματείαις σου ... ταῖς πονηραῖς
  choice: em seus negócios perversos
  rationale: πραγματεία pode indicar ocupações, atividades ou negócios; o contexto censura os afazeres que desviaram Hermas do cuidado de sua casa.
theological_decisions:
- issue: Relação entre o ressentimento de Hermas e a purificação ou disciplina de sua família
  choice: Manter as orações condicionais e causais conforme o grego
  alternative: Explicar que o perdão de Hermas causa diretamente o perdão divino dos pecados deles
  rationale: O texto associa a ausência de ressentimento à purificação e à correção justa, mas não define o mecanismo teológico; a tradução evita resolver essa tensão.
- issue: Sentido de “produz morte”
  choice: Preservar a afirmação absoluta sem qualificá-la
  alternative: Interpretar explicitamente como morte espiritual ou física
  rationale: O grego θάνατον não especifica que tipo de morte está em vista.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” adequado à legibilidade brasileira e amplamente compreensível. A repetição de “ressentimento” foi mantida por sua função retórica. A expressão elíptica “nem deixe sua irmã” foi completada com “continuar assim”, sem especificar qual conduta, para conservar a indeterminação do original.
