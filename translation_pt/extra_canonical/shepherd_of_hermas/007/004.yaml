base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/004.yaml
  text: 'And you shall say to Maximus: Behold, tribulation is coming, if it seems good to you to deny again. The Lord is near to those who turn to him, as it is written in Eldad and Modat, who prophesied to the people in the wilderness.'
translation:
  language: pt
  text: 'E você dirá a Máximo: “Eis que vem a tribulação, se lhe parecer bem negar outra vez. O Senhor está perto dos que se voltam para ele, como está escrito em Eldad e Modat, que profetizaram ao povo no deserto.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψις
  choice: tribulação
  rationale: Preserva o sentido de aflição ou provação intensa e o tom solene do anúncio.
- source_word: ἐάν σοι δοκῇ
  choice: se lhe parecer bem
  rationale: Mantém a formulação deliberativa e levemente irônica do grego, sem reduzi-la simplesmente a uma condição neutra.
- source_word: ἀρνεῖσθαι
  choice: negar
  rationale: Conserva a ambiguidade do objeto não expresso no grego; o contexto pode sugerir negar o Senhor ou a fé, mas a tradução não o acrescenta.
- source_word: τοῖς ἐπιστρεφομένοις
  choice: dos que se voltam para ele
  rationale: Expressa retorno ou conversão em linguagem natural e preserva a orientação implícita para o Senhor.
- source_word: ἐν τῷ Ἐλδὰδ καὶ Μωδὰτ
  choice: em Eldad e Modat
  rationale: Trata a expressão como referência a um escrito ou tradição identificada pelos nomes, sem inserir uma explicação ausente do texto.
theological_decisions:
- issue: Objeto do verbo “negar”
  choice: Não explicitar o objeto
  alternative: “negar o Senhor” ou “renegar a fé”
  rationale: O original usa ἀρνεῖσθαι de modo absoluto. Explicitar o objeto resolveria uma ambiguidade genuína e poderia importar uma interpretação específica.
- issue: Sentido de ἐπιστρέφομαι
  choice: “voltar-se para ele”
  alternative: “arrepender-se” ou “converter-se”
  rationale: A escolha conserva a imagem verbal de retorno e deixa aberta sua amplitude moral e religiosa.
- issue: Identidade da citação atribuída a Eldad e Modat
  choice: Manter a atribuição como apresentada
  alternative: Identificá-la com um livro perdido, tradição apócrifa ou passagem bíblica específica
  rationale: O texto apenas afirma que está escrito “em Eldad e Modat”; não convém definir além da evidência disponível.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A ordem e a tensão da advertência foram preservadas, sem esclarecer indevidamente o objeto de “negar” nem a natureza da obra citada.
