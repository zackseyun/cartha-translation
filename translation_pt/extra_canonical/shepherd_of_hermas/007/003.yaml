  text: Blessed are all who practice righteousness; they will never be destroyed.
translation:
  language: pt
  text: Felizes todos os que praticam a justiça; jamais serão destruídos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Expressa de modo natural a condição favorável ou bem-aventurada declarada pelo texto, sem restringi-la a mera emoção.
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: os que praticam a justiça
  rationale: Mantém a ideia ativa de realizar ou pôr em prática aquilo que é justo.
- source_word: οὐ διαφθαρήσονται
  choice: jamais serão destruídos
  rationale: A forma passiva futura pode significar ser destruído ou perecer; esta escolha conserva a voz passiva e o sentido forte no contexto.
- source_word: ἕως αἰῶνος
  choice: jamais
  rationale: Equivalente idiomático conciso para a negação duradoura da expressão grega, literalmente 'até a era/para sempre'.
theological_decisions:
- issue: Relação entre prática da justiça e destino final
  choice: Preservar a afirmação direta do texto sem explicação doutrinária adicional
  alternative: Acrescentar linguagem que explique a prática da justiça como evidência, mérito ou condição de salvação
  rationale: O grego declara a bem-aventurança e a não destruição dos que praticam a justiça, mas não explicita aqui como essa relação deve ser sistematizada.
translation_notes:
  register: Português atual, claro e solene, com leitura natural no Brasil e compreensão ampla no espaço lusófono.
