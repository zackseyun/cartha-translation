base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/002.yaml
  text: For the crooked path has no tracks, but pathless places and many stumbling blocks; and it is rough and thorny. Therefore it is harmful. But hear also the works of the other way. First of all, if there should come upon you a quick temper or bitterness, know that he is in you. Then come desire for many activities, and extravagance in many foods and drinks, and many drunken sprees, and various luxuries, and things that are not fitting; and desire for women, and greed, and arrogance, and boastfulness, and whatever things are akin and similar to these. Therefore, whenever these things rise up in your heart, know that the angel of wickedness is with you.
translation:
  language: pt
  text: Pois o caminho tortuoso não tem trilhas, mas trechos sem caminho e muitos obstáculos; é áspero e cheio de espinhos. Por isso, é perigoso. Ouça também quais são as obras do outro caminho. Antes de tudo, se um acesso de ira ou a amargura tomar conta de você, saiba que o anjo da maldade está em você. Depois vêm o desejo de se envolver em muitas atividades, o luxo no consumo de muitas comidas e bebidas, as muitas bebedeiras, as diversas formas de luxo e as coisas impróprias; vêm também o desejo por mulheres, a ganância, a soberba, a arrogância e tudo o que se assemelha a essas coisas. Portanto, quando essas coisas surgirem em seu coração, saiba que o anjo da maldade está com você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρεβλὴ ὁδός
  choice: caminho tortuoso
  rationale: Conserva a imagem moral e espacial de uma via torcida, em contraste com o caminho reto do contexto.
- source_word: ἀνοδίας
  choice: trechos sem caminho
  rationale: Expressa lugares intransitáveis ou sem via definida, preservando a imagem concreta sem recorrer a vocabulário raro.
- source_word: προσκόμματα
  choice: obstáculos
  rationale: Comunica de modo natural aquilo que faz tropeçar no caminho.
- source_word: ἐπιθυμία πράξεων πολλῶν
  choice: desejo de se envolver em muitas atividades
  rationale: Mantém a amplitude de πράξεις, que pode designar ocupações, empreendimentos ou atividades, sem especificar indevidamente sua natureza.
- source_word: πολυτέλεια
  choice: luxo
  rationale: Reproduz a ideia de extravagância dispendiosa no consumo, distinguindo-a da embriaguez mencionada em seguida.
- source_word: κραιπαλῶν
  choice: bebedeiras
  rationale: Termo corrente que expressa excessos ligados à embriaguez e à dissipação.
- source_word: ποικίλων τρυφῶν
  choice: vários prazeres
  rationale: Traduz a variedade de indulgências luxuosas ou sensuais em linguagem clara, sem restringir o referente.
- source_word: ὁ ἄγγελος τῆς πονηρίας
  choice: o anjo da maldade
  rationale: Preserva a personificação e a oposição contextual ao anjo da justiça.
theological_decisions:
- issue: Identidade do agente presente no coração
  choice: Explicitar “o anjo da maldade” na primeira ocorrência
  alternative: Traduzir apenas “ele está em você”
  rationale: O pronome grego remete ao anjo da maldade no contexto maior; a explicitação torna o segmento independente inteligível sem alterar a identificação textual.
- issue: Descrição da influência maligna
  choice: “está em você” e “está com você”
  alternative: Uniformizar ambas as expressões
  rationale: Mantém a variação do texto, que primeiro usa uma formulação interior e depois uma formulação de companhia, sem harmonizá-las teologicamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A enumeração e as imagens do caminho foram preservadas, enquanto construções excessivamente literais foram ajustadas para fluência.
