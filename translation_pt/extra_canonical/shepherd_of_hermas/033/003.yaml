revisions:
- from: 'Portanto, depois de reconhecer as obras dele, afaste-se dele e não confie em nada que venha dele, pois suas obras são más e prejudiciais aos servos de Deus. Agora você conhece a atuação dos dois anjos; procure entendê-la e confie no anjo da justiça. Afaste-se, porém, do anjo da maldade, pois seu ensinamento é mau em tudo o que produz. Porque, se alguém for um homem fiel e o pensamento inspirado por esse anjo subir ao seu coração, esse homem ou essa mulher inevitavelmente cometerá algum pecado. Por outro lado, se alguém, homem ou mulher, for extremamente mau, mas as obras do anjo da justiça lhe subirem ao coração, essa pessoa inevitavelmente fará algo bom.


    “Você vê, portanto”, disse ele, “que é bom seguir o anjo da justiça e renunciar ao anjo da maldade. Quanto à fé, este mandamento ensina que você deve confiar nas obras do anjo da justiça e, praticando-as, viver para Deus. Reconheça, porém, que as obras do anjo da maldade são nocivas; assim, deixando de praticá-las, você viverá para Deus.”'
  to: 'Portanto, quando reconhecer as obras dele, afaste-se dele e não confie em nada nele, pois suas obras são más e prejudiciais aos servos de Deus. Você tem as atuações dos dois anjos; compreenda-as e confie no anjo da justiça. Mas afaste-se do anjo da maldade, pois seu ensinamento é mau em toda obra. Porque, se alguém for um homem fiel e o pensamento desse anjo lhe vier ao coração, aquele homem ou mulher terá de cometer algum pecado. Mas, se algum homem ou mulher for extremamente mau e as obras do anjo da justiça lhe vierem ao coração, essa pessoa necessariamente terá de fazer algo bom.


    “Você vê, portanto”, disse ele, “que é bom seguir o anjo da justiça e renunciar ao anjo da maldade. Este mandamento esclarece o que diz respeito à fé: que você deve confiar nas obras do anjo da justiça e, praticando-as, viver para Deus. Creia, porém, que as obras do anjo da maldade são penosas; portanto, não as praticando, você viverá para Deus.”'
  rationale: A revisão conserva o sentido e a ambiguidade do grego, corrige expansões interpretativas e alinha termos importantes à sintaxe do original. ‘Terá de’ e ‘necessariamente terá de’ mantêm δεῖ e ἐξ ἀνάγκης δεῖ sem suavização. Não são necessárias notas de rodapé para este segmento.
