base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/003.yaml
  text: 'So when you recognize his works, withdraw from him and put no trust in him, because his works are wicked and harmful to God’s slaves. You therefore have the activities of both angels; understand them, and trust the angel of righteousness. But withdraw from the angel of wickedness, because his teaching is wicked in every deed. For if someone is a faithful man, and the thought of this angel rises up in his heart, that man or woman must commit some sin. But if again some man or woman is very wicked, and the works of the angel of righteousness rise up in his or her heart, that person must of necessity do something good. You see then,” he says, “that it is good to follow the angel of righteousness, and to renounce the angel of wickedness. As to faith, this commandment makes it clear: that you should trust the works of the angel of righteousness, and, having done them, live to God. But believe that the works of the angel of wickedness are grievous; so by not doing them, you will live
    to God.”'
translation:
  language: pt
  text: 'Portanto, quando reconhecer as obras dele, afaste-se dele e não confie em nada nele, pois suas obras são más e prejudiciais aos servos de Deus. Você tem as atuações dos dois anjos; compreenda-as e confie no anjo da justiça. Mas afaste-se do anjo da maldade, pois seu ensinamento é mau em toda obra. Porque, se alguém for um homem fiel e o pensamento desse anjo lhe vier ao coração, aquele homem ou mulher terá de cometer algum pecado. Mas, se algum homem ou mulher for extremamente mau e as obras do anjo da justiça lhe vierem ao coração, essa pessoa necessariamente terá de fazer algo bom.


    “Você vê, portanto”, disse ele, “que é bom seguir o anjo da justiça e renunciar ao anjo da maldade. Este mandamento esclarece o que diz respeito à fé: que você deve confiar nas obras do anjo da justiça e, praticando-as, viver para Deus. Creia, porém, que as obras do anjo da maldade são penosas; portanto, não as praticando, você viverá para Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργείας
  choice: atuação
  rationale: No contexto, refere-se às manifestações e aos efeitos operantes de cada anjo; “atuação” é natural em português e abrange tanto atividade quanto influência.
- source_word: δούλοις τοῦ Θεοῦ
  choice: servos de Deus
  rationale: “Servos” comunica a relação de pertencimento e serviço expressa por δοῦλοι sem a conotação social moderna predominante de “escravos”.
- source_word: ἐνθύμησις
  choice: pensamento inspirado por esse anjo
  rationale: O termo designa um pensamento ou impulso interior; o complemento explicita a relação genitiva sem identificar o pensamento com o próprio anjo.
- source_word: ἀποτάξασθαι
  choice: renunciar
  rationale: Expressa rejeição decidida e rompimento de vínculo, em contraste direto com seguir o anjo da justiça.
- source_word: χαλεπά
  choice: nocivas
  rationale: Neste contexto moral, o adjetivo caracteriza as obras como danosas ou perniciosas, coerentemente com ἀσύμφορα no início do trecho.
- source_word: ζήσῃ τῷ Θεῷ
  choice: viver para Deus
  rationale: Mantém a formulação teológica concisa do dativo grego, sem transformá-la em mera promessa de sobrevivência.
theological_decisions:
- issue: Linguagem de necessidade moral em δεῖ e ἐξ ἀνάγκης δεῖ
  choice: inevitavelmente cometerá/fará
  alternative: terá de cometer/fazer
  rationale: Preserva a forte afirmação de necessidade do texto, inclusive sua tensão teológica, sem enfraquecê-la como mera probabilidade nem explicá-la por uma doutrina externa.
- issue: Relação entre fé e obras no encerramento
  choice: confiar nas obras... praticando-as, viver para Deus
  alternative: crer no anjo... e assim obter vida de Deus
  rationale: Segue de perto a sintaxe e a progressão do grego, mantendo juntas confiança, prática e vida para Deus sem impor uma sistematização soteriológica posterior.
- issue: Identidade e função dos dois anjos
  choice: anjo da justiça / anjo da maldade
  alternative: espírito bom / espírito mau
  rationale: Conserva explicitamente ἄγγελος e as designações morais do original, sem reinterpretá-los como faculdades psicológicas ou categorias demonológicas específicas.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” em continuidade com o discurso direto. A tradução conserva as fortes construções de necessidade do grego e evita suavizar a tensão entre influência angélica e ação humana. A divisão em dois parágrafos favorece a leitura sem alterar a sequência argumentativa.
