base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/001.yaml
  text: He says, “I commanded you in the first commandment to keep faith and fear and self-control.” “Yes, lord,” I say. “But now,” he says, “I also want to make known to you their powers, so that you may understand what power and activity each of them has. For their activities are twofold; so they are set over the righteous and the unrighteous. So you—trust the righteous, but do not trust the unrighteous; for righteousness has a straight path, but unrighteousness a crooked one. But you, walk on the straight [and level] path, and leave the crooked.
translation:
  language: pt
  text: 'Ele diz: “No primeiro mandamento, ordenei a você que guardasse a fé, o temor e o domínio próprio.”


    “Sim, senhor”, respondo.


    “Mas agora”, diz ele, “também quero mostrar a você o poder delas, para que entenda que poder e que atuação cada uma tem. Pois as atuações delas são duplas: incidem tanto sobre o que é justo como sobre o que é injusto. Portanto, confie no que é justo, mas não confie no que é injusto, pois o que é justo tem um caminho reto, enquanto o que é injusto tem um caminho tortuoso. Quanto a você, ande pelo caminho reto [e plano][a] e deixe o tortuoso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “e plano” têm apoio textual incerto e aparecem entre colchetes na edição grega consultada.
    reason: Sinalizar de forma transparente a incerteza textual de καὶ ὁμαλῇ, que está entre colchetes no texto-fonte.
lexical_decisions:
- source_word: φυλάξῃς
  choice: guardasse
  rationale: Preserva o sentido de conservar e observar fielmente as virtudes ordenadas, sem reduzi-lo a mera posse.
- source_word: πίστιν
  choice: fé
  rationale: Mantém a amplitude de πίστις, que pode abranger fé, confiança e fidelidade; o contexto posterior explora especialmente o ato de confiar.
- source_word: φόβον
  choice: temor
  rationale: Expressa reverência e temor sem especificar além do que o grego declara neste trecho.
- source_word: ἐγκράτειαν
  choice: domínio próprio
  rationale: Formulação moderna e clara para autocontrole ou continência, preservando o alcance ético amplo do termo.
- source_word: δυνάμεις / δύναμιν
  choice: forças / força
  rationale: Mantém a linguagem de capacidade ou poder inerente dessas disposições e sua repetição no original.
- source_word: ἐνέργειαν / ἐνέργειαι
  choice: atuação / atuações
  rationale: Indica operação ou efeito em atividade, distinguindo o termo de δύναμις.
- source_word: δικαίῳ / ἄδικῳ
  choice: ao que é justo / ao que é injusto
  rationale: Os adjetivos gregos estão no neutro substantivado; esta opção evita convertê-los sem necessidade em pessoas justas e injustas.
- source_word: πίστευε
  choice: confie
  rationale: No contraste entre o justo e o injusto, o imperativo tem sentido natural de depositar confiança, embora retome πίστις.
- source_word: στρεβλήν
  choice: tortuoso
  rationale: Comunica um caminho desviado ou retorcido em contraste claro com o caminho reto.
theological_decisions:
- issue: Relação entre fé, temor e domínio próprio
  choice: Manter os três como objetos paralelos do verbo “guardar”
  alternative: Explicar o temor como “temor de Deus” ou a fé como “fidelidade”
  rationale: O trecho não fornece esses complementos de modo explícito; a tradução preserva sua concisão e abertura sem impor interpretação confessional.
- issue: Referente de “justo” e “injusto”
  choice: 'Usar formas neutras: “o que é justo” e “o que é injusto”'
  alternative: Traduzir como “o justo” e “o injusto”, entendidos como pessoas
  rationale: O gênero neutro no grego e a imagem subsequente dos dois caminhos favorecem qualidades, esferas ou princípios, embora a construção permaneça conceitualmente tensa.
- issue: Sentido das atuações serem “duplas”
  choice: Traduzir literalmente e deixar a explicação subsequente definir o contraste
  alternative: Explicitar como “há dois tipos de atuação”
  rationale: Preserva a formulação do autor e evita resolver antecipadamente como fé, temor e domínio próprio se relacionam às duas esferas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “você” para a interlocução singular. A repetição de “diz ele” e a alternância do diálogo foram preservadas para refletir a narrativa grega. A divisão em parágrafos facilita a leitura sem alterar a sequência argumentativa.
