- source_word: φυλαχθῆναι
  choice: ser guardados
  rationale: Preserva o sentido de observar e cumprir mandamentos, além de manter a voz passiva do grego.
- source_word: ὑπὸ ἀνθρώπου
  choice: por um ser humano
  rationale: Expressa o valor genérico de ἄνθρωπος sem restringi-lo ao sexo masculino.
- source_word: σκληραί
  choice: difíceis
  rationale: No contexto de mandamentos, descreve exigências consideradas penosas ou difíceis de cumprir; evita o pouco natural 'duros'.
- source_word: λίαν
  choice: muito
  rationale: Reproduz de modo direto e natural a intensificação do adjetivo.
