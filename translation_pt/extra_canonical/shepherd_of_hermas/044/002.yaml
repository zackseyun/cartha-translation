base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/002.yaml
  text: Answering, he says to me, “If you set before yourself that they can be kept, you will keep them easily, and they will not be hard. But if it has already arisen in your heart that they cannot be kept by a human being, you will not keep them.
translation:
  language: pt
  text: 'Ele me respondeu: “Se você decidir que elas podem ser guardadas, você as guardará facilmente, e elas não serão difíceis. Mas, se já tiver surgido em seu coração o pensamento de que elas não podem ser guardadas por um ser humano, você não as guardará.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προθῇς
  choice: decidir
  rationale: No contexto, indica estabelecer algo para si mesmo ou assumir interiormente uma disposição; “decidir” comunica isso com naturalidade, sem reduzir a frase a mera opinião.
- source_word: φυλαχθῆναι / φυλάξεις
  choice: ser guardadas / guardará
  rationale: Preserva a repetição e o sentido de observar ou cumprir as instruções chamadas de mandamentos no contexto.
- source_word: σκληραί
  choice: difíceis
  rationale: Aqui descreve os mandamentos como penosos ou difíceis de cumprir; “difíceis” é claro e idiomático em português.
- source_word: ἐπὶ τὴν καρδίαν σου ... ἀναβῇ
  choice: tiver surgido em seu coração o pensamento
  rationale: Mantém a imagem bíblica do coração e explicita de modo natural que aquilo que surge é um pensamento ou convicção.
- source_word: ὑπὸ ἀνθρώπου
  choice: por um ser humano
  rationale: Expressa o valor genérico de ἄνθρωπος sem restringi-lo ao sexo masculino.
theological_decisions:
- issue: Relação entre disposição interior e capacidade de obedecer
  choice: Manter a afirmação condicional direta do texto, sem acrescentar qualificações sobre graça, mérito ou capacidade humana absoluta.
  alternative: Explicar a possibilidade da obediência segundo uma doutrina específica da graça ou da perfeição.
  rationale: O trecho enfatiza a disposição interior diante dos mandamentos, mas não desenvolve aqui uma teoria completa sobre a capacidade humana; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A repetição de “guardar” foi mantida por sua função retórica e por sua familiaridade no registro bíblico.
