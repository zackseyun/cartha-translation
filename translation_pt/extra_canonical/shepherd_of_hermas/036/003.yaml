base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/003.yaml
  text: For God is not like human beings who remember wrongs; rather, he does not remember wrongs, and he has compassion on what he has made.
translation:
  language: pt
  text: Pois Deus não é como os seres humanos, que guardam rancor; pelo contrário, ele não guarda rancor e tem compaixão pelo que criou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησικακοῦντες
  choice: que guardam rancor
  rationale: O particípio descreve quem conserva na memória o mal sofrido e mantém ressentimento; «guardar rancor» expressa isso de modo natural e preciso em português.
- source_word: ἀμνησίκακός
  choice: não guarda rancor
  rationale: Mantém o contraste lexical explícito com μνησικακοῦντες sem sugerir que Deus literalmente se esqueça de fatos.
- source_word: σπλαγχνίζεται
  choice: tem compaixão
  rationale: Transmite a compaixão profunda e misericordiosa indicada pelo verbo, em registro claro e digno.
- source_word: ποίησιν αὐτοῦ
  choice: pelo que criou
  rationale: A expressão designa aquilo que Deus fez, provavelmente sua criação; a formulação preserva a amplitude do grego sem restringi-la apenas à humanidade.
theological_decisions:
- issue: O sentido de ἀμνησίκακός aplicado a Deus
  choice: não guarda rancor
  alternative: não se lembra dos males
  rationale: A escolha evita transformar uma afirmação sobre a ausência de ressentimento em uma afirmação metafísica sobre esquecimento divino, preservando o contraste ético do grego.
- issue: O alcance de ποίησιν αὐτοῦ
  choice: pelo que criou
  alternative: por sua criação
  rationale: «Pelo que criou» conserva a possível referência coletiva ou concreta à obra criada por Deus, sem definir além do que o contexto exige.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição de «guardar rancor» reproduz o contraste retórico do original com clareza, mantendo um tom digno e acessível.
