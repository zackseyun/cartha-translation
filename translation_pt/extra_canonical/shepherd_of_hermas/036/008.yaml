review_pass:
  verdict: revise
  source_fidelity: O rascunho comunica adequadamente a exortação à perseverança e preserva a referência indireta ao doador. Contudo, «apresentar o pedido da sua alma» enfraquece a repetição explícita de «pedir» (αἰτούμενος) e soa menos natural; τὸ αἴτημα τῆς ψυχῆς σου designa aquilo que a pessoa profundamente deseja/pede.
  naturalness: «Pedido da sua alma» é compreensível, mas pouco idiomático em português contemporâneo. «O que sua alma deseja» preserva a imagem sem criar uma construção artificial. «Vacilar» expressa com naturalidade a hesitação interior de διψυχήσῃς neste contexto.
  terminology: A formulação «quem lhe dá» mantém, como o grego, a alusão não explicitada a Deus. Não é necessário introduzir um termo teológico adicional.
  issues:
