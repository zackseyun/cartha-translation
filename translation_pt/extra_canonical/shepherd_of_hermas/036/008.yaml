base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/008.yaml
  text: So do not cease asking for the request of your soul, and you will receive it. But if you grow weary and become double-minded while asking, blame yourself and not the one who gives to you.
translation:
  language: pt
  text: Portanto, não deixe de pedir o que sua alma deseja, e você o receberá. Mas, se você desanimar e vacilar enquanto pede, culpe a si mesmo, e não quem lhe dá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλίπῃς αἰτούμενος
  choice: não deixe de apresentar o pedido
  rationale: Expressa a ordem de persistir em pedir, com formulação natural em português.
- source_word: τὸ αἴτημα τῆς ψυχῆς σου
  choice: o pedido da sua alma
  rationale: Mantém a imagem e a força pessoal do grego sem interpretar além do texto.
- source_word: ἐκκακήσῃς
  choice: desanimar
  rationale: O verbo indica perder o ânimo ou cansar-se de perseverar.
- source_word: διψυχήσῃς
  choice: ficar dividido
  rationale: Preserva a ideia de hesitação interior ou ânimo dividido, central ao contexto, em linguagem compreensível.
- source_word: τὸν διδόντα σοι
  choice: aquele que lhe dá
  rationale: Mantém a referência indireta do grego, sem explicitar 'Deus' onde o texto não o faz.
theological_decisions:
- issue: Identidade de 'aquele que lhe dá'
  choice: Manter a referência indireta
  alternative: Traduzir como 'Deus, que lhe dá'
  rationale: Embora o contexto identifique Deus como doador, a redação grega desta unidade usa uma expressão participial; preservá-la evita explicitação interpretativa desnecessária.
- issue: Sentido de διψυχήσῃς
  choice: ficar dividido
  alternative: duvidar
  rationale: A opção escolhida conserva a metáfora antropológica de duplicidade interior presente em δίψυχος, em vez de reduzi-la apenas à dúvida intelectual.
translation_notes:
  register: Português moderno, digno e acessível, com construção de leitura natural no Brasil e inteligível internacionalmente. A repetição ligada ao ato de pedir foi suavemente ajustada sem perder o chamado à perseverança.
