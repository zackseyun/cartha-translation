base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/011.yaml
  text: “You see then,” he says, “that faith is from above, from the Lord, and it has great power; but double-mindedness is an earthly spirit from the devil, having no power.
translation:
  language: pt
  text: “Você vê, então”, diz ele, “que a fé vem do alto, da parte do Senhor, e tem grande poder; mas a indecisão é um espírito terreno, vindo do diabo, e não tem poder.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ πίστις
  choice: a fé
  rationale: Equivalente direto e natural, preservando o contraste personificado com a indecisão.
- source_word: ἄνωθέν ἐστι παρὰ τοῦ κυρίου
  choice: vem do alto, da parte do Senhor
  rationale: Mantém tanto a dimensão espacial/originária de ἄνωθεν quanto a indicação explícita da procedência expressa por παρὰ τοῦ κυρίου.
- source_word: ἡ διψυχία
  choice: a indecisão
  rationale: No contexto, designa hesitação interior e falta de confiança ao pedir a Deus. 'Indecisão' é clara em português, embora o grego evoque literalmente uma mente ou alma dividida.
- source_word: ἐπίγειον πνεῦμά
  choice: um espírito terreno
  rationale: Tradução formal e inteligível que conserva o contraste entre 'do alto' e 'terreno'.
- source_word: παρὰ τοῦ διαβόλου
  choice: vindo do diabo
  rationale: Explicita em português corrente a relação de origem indicada pela preposição grega.
- source_word: δύναμιν μὴ ἔχουσα
  choice: não tem poder
  rationale: Reproduz de modo direto a negação do poder, em contraste com a grande δύναμις da fé.
theological_decisions:
- issue: Origem contrastante da fé e da indecisão
  choice: Preservar a afirmação de que a fé vem do Senhor e a indecisão vem do diabo
  alternative: Atenuar como mera influência divina ou diabólica
  rationale: O texto grego formula explicitamente uma procedência contrastante mediante παρὰ τοῦ κυρίου e παρὰ τοῦ διαβόλου; a tradução não deve suavizar essa tensão.
- issue: Natureza de πνεῦμα em 'espírito terreno'
  choice: Manter 'espírito' sem definir se é um ser pessoal, uma disposição ou uma influência
  alternative: Traduzir por 'atitude terrena' ou identificar um espírito demoníaco pessoal
  rationale: O original permite uma personificação forte, mas não resolve aqui com precisão a ontologia do 'espírito'; manter o termo preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo retórico entre fé e indecisão, bem como o contraste vertical entre 'do alto' e 'terreno'.
