base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/002.yaml
  text: Do not reason about these things, but turn to the Lord with your whole heart, and ask from him without doubting; and you will come to know his great compassion, because he will certainly not abandon you, but will fulfill the request of your soul.
translation:
  language: pt
  text: Não fique pensando nessas coisas; pelo contrário, volte-se para o Senhor de todo o coração e peça-lhe sem hesitar. Então você conhecerá sua grande compaixão, pois ele jamais o abandonará, mas atenderá ao pedido de sua alma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλογίζου ταῦτα
  choice: Não fique pensando nessas coisas
  rationale: Expressa naturalmente a proibição de ficar ponderando os pensamentos de indignidade descritos no contexto anterior, sem tornar o verbo uma condenação genérica do raciocínio.
- source_word: ἐξ ὅλης τῆς καρδίας σου ἐπίστρεψον ἐπὶ τὸν κύριον
  choice: volte-se para o Senhor de todo o coração
  rationale: Preserva tanto o movimento de retorno/conversão de ἐπίστρεψον quanto a integralidade indicada por ἐξ ὅλης τῆς καρδίας.
- source_word: ἀδιστάκτως
  choice: sem hesitar
  rationale: Comunica ausência de vacilação ou dúvida no pedido e mantém o vínculo lexical com o tema da διψυχία no mandato.
- source_word: γνώσῃ
  choice: você conhecerá
  rationale: Mantém o valor futuro do verbo e sugere conhecimento experimentado da compaixão divina, sem explicitar além do grego.
- source_word: πολλὴν εὐσπλαγχνίαν
  choice: grande compaixão
  rationale: Equivalente claro e digno para a intensa misericórdia compassiva expressa pelo termo grego.
- source_word: οὐ μή σὲ ἐγκαταλίπῃ
  choice: ele jamais o abandonará
  rationale: Reproduz a forte negação οὐ μή de maneira idiomática em português.
- source_word: τὸ αἴτημα τῆς ψυχῆς σου πληροφορήσει
  choice: atenderá ao pedido de sua alma
  rationale: No contexto de oração, πληροφορήσει indica levar o pedido à plena realização ou satisfação; 'atenderá' soa natural e evita a ideia inadequada de apenas fornecer informação.
theological_decisions:
- issue: Relação entre pedir sem hesitar e o atendimento divino
  choice: Conservar a afirmação direta de que Deus atenderá ao pedido
  alternative: Qualificar a promessa com condições teológicas não expressas neste versículo
  rationale: O texto faz uma promessa enfática no contexto imediato. Inserir ressalvas externas resolveria uma tensão teológica que o original deixa para o contexto mais amplo.
- issue: Sentido do retorno ao Senhor
  choice: Usar 'volte-se para o Senhor'
  alternative: Traduzir explicitamente por 'arrependa-se e volte para o Senhor'
  rationale: Embora ἐπιστρέφω possa ter conotação de conversão ou arrependimento, o versículo não emprega o substantivo ou verbo técnico para arrependimento; a formulação escolhida preserva essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por 'você' para legibilidade brasileira ampla. A frase conserva o contraste exortativo do grego e a força da promessa, evitando linguagem confessional acrescentada.
