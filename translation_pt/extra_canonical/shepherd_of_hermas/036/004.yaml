  to: Portanto, purifique o seu coração de todas as vaidades desta era e das palavras que lhe foram ditas anteriormente, e peça ao Senhor. Você receberá tudo e não ficará sem resposta em nenhum dos seus pedidos, se pedir ao Senhor sem duvidar.
