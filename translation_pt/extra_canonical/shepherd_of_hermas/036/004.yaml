base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/004.yaml
  text: Therefore cleanse your heart from all the vanities of this age and from the words previously spoken to you, and ask from the Lord; and you will receive everything, and you will lack nothing in any of your petitions, if you ask from the Lord without doubting.
translation:
  language: pt
  text: Portanto, purifique o seu coração de todas as vaidades desta era e das palavras que lhe foram ditas anteriormente, e peça ao Senhor. Você receberá tudo e não ficará sem resposta em nenhum dos seus pedidos, se pedir ao Senhor sem duvidar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ματαιωμάτων
  choice: vaidades
  rationale: Preserva a ideia de coisas vãs, vazias e sem valor, com linguagem digna e reconhecível em português.
- source_word: τοῦ αἰῶνος τούτου
  choice: desta era
  rationale: Mantém o sentido temporal e moral de αἰών sem reduzir a expressão apenas ao mundo físico.
- source_word: ἀνυστέρητος
  choice: não ficará privado
  rationale: Expressa a ideia de não ser deixado sem aquilo que se pede, evitando a leitura mais ampla e potencialmente enganosa de que nada faltará em qualquer esfera.
- source_word: ἀδιστάκτως
  choice: sem hesitar
  rationale: Reproduz a ausência de vacilação ou dúvida no ato de pedir e se harmoniza com o contraste desenvolvido no contexto.
theological_decisions:
- issue: Abrangência da promessa de receber
  choice: receberá tudo; não ficará privado de nenhuma de suas petições
  alternative: receberá qualquer coisa que pedir
  rationale: Mantém a formulação abrangente e tensa do grego sem acrescentar condições teológicas não expressas neste versículo nem transformar a promessa em uma paráfrase doutrinária.
- issue: Referência às palavras anteriores
  choice: das palavras que lhe foram ditas anteriormente
  alternative: dos ensinamentos mencionados anteriormente
  rationale: Conserva o referente relativamente aberto de ῥημάτων, sem decidir se são meras palavras, advertências ou ensinamentos específicos.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade brasileira ampla. A sintaxe foi levemente dividida para fluidez, preservando a sequência exortação–pedido–promessa–condição do grego.
