base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/012.yaml
  text: Therefore serve faith, which has power, and keep away from double-mindedness, which has no power, and you will live to God—and all who think these things will live to God.”
translation:
  language: pt
  text: Portanto, sirva à fé que tem poder e mantenha-se longe da indecisão que não tem poder; você viverá para Deus, e todos os que pensam assim viverão para Deus.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλευε
  choice: sirva
  rationale: Expressa serviço ou sujeição contínua à fé de modo natural em português, sem a estranheza excessiva de «seja escravo».
- source_word: πίστει
  choice: à fé
  rationale: Mantém a personificação da fé como senhora dotada de poder, em contraste direto com a indecisão.
- source_word: διψυχίας
  choice: indecisão
  rationale: No contexto, descreve a hesitação interior que não confia plenamente em Deus. «Ânimo dividido» seria mais literal, mas menos natural neste enunciado conclusivo.
- source_word: ζήσῃ τῷ θεῷ
  choice: viverá para Deus
  rationale: Preserva o dativo τῷ θεῷ e a formulação teológica aberta do grego, sem o reduzir a «Deus lhe dará vida».
- source_word: φρονοῦντες
  choice: pensam dessa maneira
  rationale: Comunica a disposição mental e a atitude assumida diante do ensino precedente, retomado por ταῦτα.
theological_decisions:
- issue: Relação entre fé, vida e Deus
  choice: «Assim você viverá para Deus»
  alternative: «e Deus lhe dará vida»
  rationale: O grego ζήσῃ τῷ θεῷ afirma literalmente viver para Deus; a tradução evita converter o dativo em agente e preserva a tensão da expressão.
- issue: Personificação da fé e da indecisão
  choice: manter ambas como realidades personificadas, uma com poder e outra sem poder
  alternative: parafrasear como qualidades psicológicas do indivíduo
  rationale: O imperativo δούλευε e os particípios atributivos tratam a fé e a indecisão como poderes contrastantes; essa estrutura é significativa no contexto do Mandamento 9.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por «você» para concordar com o discurso direto singular. A pontuação torna explícita a consequência sem alterar a relação sintática. Nenhuma nota de rodapé foi necessária.
