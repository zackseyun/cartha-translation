revisions:
- from: Portanto, purifique o seu coração da indecisão e revista-se da fé, pois ela é forte. Creia em Deus, certo de que receberá tudo o que lhe pedir. E, se alguma vez você fizer um pedido ao Senhor e demorar mais para recebê-lo, não fique indeciso por não ter recebido logo o pedido da sua alma; pois certamente é por causa de alguma provação ou de alguma transgressão que você desconhece que demora mais para receber o seu pedido.
  to: 'Portanto, purifique o seu coração da divisão interior, revista-se da fé, pois ela é forte, e creia em Deus: receberá todos os pedidos que lhe fizer. E, se alguma vez você pedir algo ao Senhor e demorar mais para recebê-lo, não tenha o coração dividido por não ter recebido depressa o pedido da sua alma; pois certamente é por causa de alguma provação ou de alguma transgressão que você desconhece que demora mais para receber o seu pedido.'
  rationale: A revisão substitui «indecisão» por formulações que conservam a imagem e o alcance de διψυχία sem impor uma leitura doutrinária. Também remove a paráfrase «certo de que», mantendo mais de perto a relação entre o imperativo de crer e a promessa de receber. O restante foi mantido por refletir adequadamente o original e o tom do texto.
