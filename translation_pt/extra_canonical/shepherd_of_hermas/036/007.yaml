  source_fidelity: A tradução acompanha bem a estrutura e o sentido geral do grego. Contudo, «indecisão» enfraquece e estreita διψυχία, que aqui designa divisão interior/vacilação da confiança; e «certo de que» introduz uma explicitação que não corresponde diretamente ao particípio πιστεύων.
  naturalness: O português é claro e fluente. «Coração dividido» é natural, preserva melhor a imagem conceitual do texto e funciona bem no registro exortativo. Pequenos ajustes de pontuação tornam o período final menos pesado.
  terminology: «Revista-se da fé», «provação», «transgressão» e «pedido da sua alma» são escolhas adequadas. Para διψυχία, «coração dividido» comunica melhor a noção recorrente no Mandamento do que «indecisão».
  issues:
