base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/007.yaml
  text: Cleanse, then, your heart from double-mindedness, and put on faith, because it is strong, and believe God, that all your requests which you ask you will receive. And if ever, after asking some request from the Lord, you receive it more slowly, do not be double-minded because you did not quickly receive the request of your soul; for surely it is because of some testing or some transgression, which you do not know, that you receive your request more slowly.
translation:
  language: pt
  text: 'Portanto, purifique o seu coração da divisão interior, revista-se da fé, pois ela é forte, e creia em Deus: receberá todos os pedidos que lhe fizer. E, se alguma vez você pedir algo ao Senhor e demorar mais para recebê-lo, não tenha o coração dividido por não ter recebido depressa o pedido da sua alma; pois certamente é por causa de alguma provação ou de alguma transgressão que você desconhece que demora mais para receber o seu pedido.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία / διψυχήσῃς
  choice: indecisão / não fique indeciso
  rationale: O termo descreve um coração dividido que vacila quanto à confiança em Deus. “Indecisão” preserva a ideia no português corrente sem sugerir apenas dúvida intelectual.
- source_word: ἔνδυσαι τὴν πίστιν
  choice: revista-se da fé
  rationale: Mantém a metáfora explícita de vestir-se presente no grego, em linguagem bíblica natural.
- source_word: αἴτημα τῆς ψυχῆς σου
  choice: o pedido da sua alma
  rationale: Conserva a expressão concreta e enfática do original, sem reduzi-la simplesmente a “desejo”.
- source_word: πειρασμόν
  choice: provação
  rationale: No contexto de demora e perseverança, indica uma situação que põe a fé à prova; “tentação” poderia sugerir indevidamente sedução ao pecado.
- source_word: παράπτωμά
  choice: transgressão
  rationale: Expressa uma falta ou deslize moral sem especificar uma gravidade que o texto não define.
theological_decisions:
- issue: Certeza de receber tudo o que se pede
  choice: “certo de que receberá tudo o que lhe pedir”
  alternative: “acreditando que Deus lhe concederá todos os seus pedidos”
  rationale: Preserva a afirmação forte do texto sem acrescentar condições teológicas ausentes neste segmento.
- issue: Razão para a demora da resposta
  choice: “certamente é por causa de alguma provação ou de alguma transgressão que você desconhece”
  alternative: Atenuar com “pode ser por causa”
  rationale: O advérbio πάντως apresenta a explicação de modo categórico; a tradução mantém essa tensão em vez de suavizá-la.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para legibilidade brasileira ampla. A estrutura exortativa e as repetições do pedido foram preservadas, com ajustes sintáticos mínimos para fluidez.
