    issue: «indecisão / indeciso» para διψυχία / διψυχήσῃς
    rationale: O termo grego aponta para uma condição de ânimo ou coração dividido, especialmente vacilação na fé, não meramente dificuldade de decidir. «Coração dividido» preserva a metáfora e evita reduzir o conceito.
