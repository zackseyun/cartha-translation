revisions:
- from: Mas, se você hesitar no coração, de modo nenhum receberá coisa alguma do que pediu. Pois os que hesitam em relação a Deus são os de coração dividido e não conseguem absolutamente nada do que pedem.
  to: Mas, se você hesitar no coração, de modo nenhum receberá nada dos seus pedidos. Pois os que hesitam quanto a Deus são os de coração dividido e não obtêm absolutamente nada dos seus pedidos.
  rationale: A revisão corrige a alteração temporal em «do que pediu», mantém a força das duas negações enfáticas e ajusta a construção preposicional para maior naturalidade, sem restringir o sentido da hesitação nem apagar a imagem de «coração dividido».
