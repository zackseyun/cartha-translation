base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/005.yaml
  text: But if you waver in your heart, you will by no means receive anything of your petitions. For those who doubt with respect to God—these are the double-minded—and they do not at all obtain their petitions.
translation:
  language: pt
  text: Mas, se você hesitar no coração, de modo nenhum receberá nada dos seus pedidos. Pois os que hesitam quanto a Deus são os de coração dividido e não obtêm absolutamente nada dos seus pedidos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διστάσῃς / διστάζοντες
  choice: hesitar / os que hesitam
  rationale: Expressa a vacilação interior no contexto da oração sem restringir o sentido a uma dúvida meramente intelectual.
- source_word: δίψυχοι
  choice: de coração dividido
  rationale: Reproduz de modo natural e inteligível a imagem grega de pessoas interiormente divididas, preservando sua relação com a hesitação.
- source_word: αἰτημάτων
  choice: do que pediu / do que pedem
  rationale: No contexto, refere-se aos pedidos dirigidos a Deus; a formulação evita o termo mais técnico e menos corrente 'petições'.
- source_word: ἐπιτυγχάνουσι
  choice: conseguem
  rationale: Comunica o sentido de alcançar ou obter aquilo que se pediu, em português corrente.
theological_decisions:
- issue: Natureza da hesitação diante de Deus
  choice: em relação a Deus
  alternative: na fé em Deus
  rationale: Mantém a construção ampla εἰς τὸν θεόν e evita acrescentar uma especificação teológica que o texto não explicita.
- issue: Força da negação enfática
  choice: de modo nenhum / absolutamente nada
  alternative: não receberá nada / não obtêm nada
  rationale: Preserva a forte ênfase das construções οὐδὲν οὐ μὴ e οὐδὲν ὅλως.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A repetição de 'hesitar' preserva a coesão lexical do grego, enquanto 'de coração dividido' torna a metáfora de δίψυχοι clara sem apagá-la.
