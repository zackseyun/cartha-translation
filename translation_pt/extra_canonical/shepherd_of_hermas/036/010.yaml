base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/010.yaml
  text: Therefore despise double-mindedness and master it in every matter, having put on the strong and mighty faith. For faith promises all things and accomplishes all things, but double-mindedness, because it does not trust, fails in all the works that it does.
translation:
  language: pt
  text: Portanto, despreze a indecisão e domine-a em tudo, revestindo-se da fé forte e poderosa. Pois a fé promete tudo e tudo realiza; mas a indecisão, por não confiar em si mesma, fracassa em todas as suas obras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: indecisão
  rationale: O termo descreve a divisão interior que hesita entre confiar e não confiar. “Indecisão” comunica isso com naturalidade em português, enquanto “ânimo dobre” seria pouco corrente e “dúvida” reduziria o campo semântico.
- source_word: κατακυρίευσον
  choice: domine-a
  rationale: Preserva a força do imperativo, que ordena exercer domínio sobre a indecisão.
- source_word: ἐν παντὶ πράγματι
  choice: em todas as situações
  rationale: Expressão natural que mantém a abrangência de toda questão ou circunstância.
- source_word: ἐνδυσάμενος
  choice: revestindo-se
  rationale: Mantém a metáfora explícita de vestir a fé.
- source_word: ἐπαγγέλλεται
  choice: promete
  rationale: Equivalente direto que preserva a afirmação enfática e sua tensão com “realiza”.
- source_word: τελειοῖ
  choice: realiza
  rationale: No contexto, indica levar a efeito ou completar; “realiza” oferece clareza sem acrescentar objeto não expresso.
- source_word: μὴ καταπιστεύουσα ἑαυτῇ
  choice: por não confiar em si mesma
  rationale: Segue a construção reflexiva difícil do grego sem corrigi-la para uma referência teológica mais esperada, preservando a ambiguidade do texto.
- source_word: ἀποτυγχάνει
  choice: fracassa
  rationale: Expressa o insucesso da indecisão em contraste com a eficácia da fé.
theological_decisions:
- issue: Afirmações universais sobre o poder da fé
  choice: “a fé promete tudo e tudo realiza”
  alternative: “a fé promete e realiza todas as coisas [pedidas]”
  rationale: Mantém a formulação absoluta e retórica do grego, sem restringi-la silenciosamente a pedidos ou a resultados específicos.
- issue: Objeto da falta de confiança da indecisão
  choice: “por não confiar em si mesma”
  alternative: “por não confiar em Deus”
  rationale: O pronome grego é reflexivo e aponta formalmente para a própria indecisão; embora o contexto trate da confiança no Senhor, a tradução não substitui a leitura textual por uma harmonização interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com imperativos diretos e preservação das metáforas e do paralelismo do grego. “Indecisão” é usada em sentido moral e espiritual, como divisão interior diante da fé.
