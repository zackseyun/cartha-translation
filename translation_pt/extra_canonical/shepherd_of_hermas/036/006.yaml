base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/006.yaml
  text: But those who are complete in faith ask for all things, having put their trust in the Lord, and they receive, because they ask without doubting, not being at all double-minded. For every double-minded man, unless he repents, will be saved with difficulty.
translation:
  language: pt
  text: Mas os que são íntegros na fé pedem todas as coisas confiando no Senhor, e as recebem, porque pedem sem hesitar, sem ter o coração dividido.[a] Pois todo aquele que tem o coração dividido, se não se arrepender, dificilmente será salvo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega significa literalmente “de alma dupla” e descreve alguém interiormente dividido ou vacilante.
    reason: Esclarece a imagem incomum de δίψυχος sem apagá-la no texto principal.
lexical_decisions:
- source_word: ὁλοτελεῖς
  choice: íntegros
  rationale: Expressa inteireza ou plenitude na fé sem sugerir perfeição moral absoluta.
- source_word: πεποιθότες ἐπὶ τὸν κύριον
  choice: confiando no Senhor
  rationale: Reproduz de modo natural o particípio perfeito, que indica confiança depositada no Senhor.
- source_word: ἀδιστάκτως
  choice: sem hesitar
  rationale: Comunica a ausência de dúvida ou vacilação no ato de pedir.
- source_word: δίψυχος / διψυχοῦντες
  choice: ter o coração dividido
  rationale: Preserva a imagem de uma pessoa interiormente dividida, em linguagem portuguesa compreensível, em vez de reduzi-la apenas a dúvida intelectual.
- source_word: δυσκόλως σωθήσεται
  choice: dificilmente será salvo
  rationale: Mantém a formulação forte e a modalidade futura/passiva do grego, sem atenuar nem ampliar a afirmação.
theological_decisions:
- issue: Abrangência de πάντα
  choice: pedem todas as coisas
  alternative: pedem qualquer coisa
  rationale: Mantém a amplitude formal do texto e evita inserir condições não explicitadas neste versículo.
- issue: Relação entre arrependimento e salvação
  choice: se não se arrepender, dificilmente será salvo
  alternative: se não mudar de atitude, terá dificuldade para ser salvo
  rationale: Conserva o vocabulário teológico de μετανοέω e a tensão da declaração, sem explicar o mecanismo da salvação.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente para leitores brasileiros e compreensão internacional. A repetição da ideia de divisão interior foi preservada por ser central à exortação.
