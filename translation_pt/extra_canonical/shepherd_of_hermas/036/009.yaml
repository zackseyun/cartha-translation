base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/009.yaml
  text: 'Look at this double-mindedness: for it is evil and senseless, and it uproots many from the faith, even those who are very faithful and strong. For this double-mindedness is a daughter of the devil, and it acts very wickedly toward the slaves of God.'
translation:
  language: pt
  text: 'Veja esta mente dividida: ela é má e insensata e desenraíza muitos da fé, até mesmo pessoas muito fiéis e firmes. Pois essa mente dividida é filha do diabo e age com muita maldade contra os servos de Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: indecisão
  rationale: No contexto, designa a hesitação interior que impede a confiança firme ao pedir a Deus. “Indecisão” comunica isso de modo natural, embora o grego evoque literalmente uma mente ou alma dividida.
- source_word: ἐκριζοῖ
  choice: arranca ... da fé
  rationale: Preserva a imagem forte de desenraizar, com formulação idiomática em português.
- source_word: λίαν πιστοὺς καὶ ἰσχυρούς
  choice: pessoas muito fiéis e firmes
  rationale: “Firmes” expressa força e estabilidade na fé sem sugerir força física.
- source_word: δούλους τοῦ θεοῦ
  choice: servos de Deus
  rationale: Equivalente tradicional e digno para a relação de serviço e pertença indicada por δοῦλοι.
- source_word: λίαν πονηρεύεται
  choice: age com extrema maldade
  rationale: Reproduz a intensidade de λίαν e o caráter deliberadamente maléfico do verbo.
theological_decisions:
- issue: Personificação da indecisão como filha do diabo
  choice: Preservada literalmente
  alternative: Explicar como simples influência demoníaca
  rationale: O texto apresenta uma personificação explícita e teologicamente carregada; a tradução não deve suavizá-la nem reinterpretá-la.
- issue: Alcance de καί γε λίαν πιστοὺς καὶ ἰσχυρούς
  choice: “até mesmo pessoas muito fiéis e firmes”
  alternative: “inclusive os muito crentes e fortes”
  rationale: Mantém a afirmação tensa de que a indecisão pode atingir até pessoas caracterizadas por grande fidelidade e firmeza, sem tentar harmonizá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “indecisão” preserva a ênfase retórica do grego; não foram necessárias notas de rodapé.
