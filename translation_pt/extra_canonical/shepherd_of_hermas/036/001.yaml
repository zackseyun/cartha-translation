base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/001.yaml
  text: 'He says to me: Remove double-mindedness from yourself, and do not at all be double-minded when asking anything from God, saying within yourself, “How am I able to ask from the Lord and receive, I who have sinned so much against him?”'
translation:
  language: pt
  text: 'Ele me diz: “Livre-se do coração dividido[a] e não fique de modo algum dividido ao pedir alguma coisa a Deus, dizendo consigo mesmo: ‘Como posso pedir ao Senhor e receber, eu que pequei tanto contra ele?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mente dividida”; o termo grego descreve alguém interiormente dividido e, neste contexto, hesitante em confiar que Deus atenderá ao seu pedido.'
    reason: Esclarece uma imagem grega difícil de reproduzir literalmente em português sem restringir seu sentido à mera dúvida intelectual.
lexical_decisions:
- source_word: διψυχία / διψυχήσῃς
  choice: coração dividido / fique dividido
  rationale: Preserva a imagem grega de uma pessoa interiormente dividida, em vez de reduzi-la apenas a ‘dúvida’ ou ‘indecisão’, e mantém em português a ligação entre o substantivo e o verbo.
- source_word: αἰτήσασθαί τι παρὰ τοῦ θεοῦ
  choice: pedir alguma coisa a Deus
  rationale: Expressa de modo natural a ideia de dirigir um pedido a Deus, sem acrescentar a noção específica de oração, que permanece implícita.
- source_word: λέγων ἐν σεαυτῷ
  choice: dizendo consigo mesmo
  rationale: Reproduz o caráter interior do questionamento em português corrente e digno.
- source_word: ἡμαρτηκὼς τοσαῦτα εἰς αὐτόν
  choice: eu que pequei tanto contra ele
  rationale: Mantém tanto a intensidade de τοσαῦτα quanto a direção pessoal do pecado indicada por εἰς αὐτόν.
theological_decisions:
- issue: Natureza da διψυχία ao pedir a Deus
  choice: Manter a imagem de um ‘coração dividido’
  alternative: Traduzir simplesmente como ‘dúvida’ ou ‘falta de fé’
  rationale: O grego descreve divisão interior e hesitação, sem identificá-las de maneira exaustiva com uma formulação doutrinária específica. A tradução preserva essa amplitude e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. A repetição de ‘dividido’ é intencional para refletir a repetição lexical do grego e manter a coesão do ensino.
