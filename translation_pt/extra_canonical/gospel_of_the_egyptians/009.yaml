base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/009.yaml
  text: 'Then the great Seth, son of the indestructible Man, Adamas, offered praise to:


    the great unseen, unnamable, unutterable, virginal Spirit,

    even the <male virgin>,

    <and the triple-male child>,

    <and the male> virgin Youel,

    and Esephech, keeper of splendor,

    and the crown of his glory, the child of the child,

    [] and the great Doxomedon aeons,

    and the Fullness, as I mentioned previously,


    and he petitioned on behalf of his seed.


    Then the great power of great light, Plesithea, came forth from that place:


    the mother of the angels,

    the mother of lights,

    the glorious mother,

    the four-breasted virgin,

    bearing the fruit from Gomorrah as a spring, and from Sodom,

    being the fruit of the spring of Gomorrah dwelling inside her.


    She came forth through the great Seth.


    Then the great Seth rejoiced because of the gift bestowed on him by the indestructible child. He drew his seed from the four-breasted virgin and deposited it with him inside the fourth aeon, inside the third great light, Davithe.'
translation:
  language: pt
  text: 'Então o grande Sete, filho do Homem indestrutível, Adamas, ofereceu louvor a:



    o grande Espírito invisível, inominável, indizível e virginal,


    isto é, a <virgem masculina>[a],


    e <a criança três vezes masculina>,


    e a virgem <masculina> Youel,


    e Esephech, guardião do esplendor,


    e a coroa de sua glória, o filho do filho,


    e […] [b] os grandes éons de Doxomedon,


    e a Plenitude, como mencionei anteriormente,



    e fez uma petição em favor de sua semente.[c]



    Então, daquele lugar, procedeu Plesithea, o grande poder da grande luz:



    a mãe dos anjos,


    a mãe das luzes,


    a mãe gloriosa,


    a virgem de quatro seios,


    que trazia o fruto de Gomorra como uma fonte, e de Sodoma,


    sendo o fruto da fonte de Gomorra que habitava dentro dela.



    Ela procedeu por meio do grande Sete.



    Então o grande Sete alegrou-se por causa da dádiva que lhe fora concedida pela criança indestrutível. Ele extraiu sua semente da virgem de quatro seios e a depositou consigo no quarto éon, na terceira grande luz, Davithe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os sinais < > indicam palavras apresentadas como restauração editorial no testemunho usado para esta versão.
    reason: Distinguir material editorialmente restaurado sem apagá-lo do texto.
  - marker: b
