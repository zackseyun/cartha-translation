    reason: Registrar uma ambiguidade lexical e teológica genuína.
lexical_decisions:
- source_word: Seth
  choice: Sete
  rationale: Emprega a forma portuguesa tradicional do nome bíblico, sem alterar a identidade da figura no tratado.
- source_word: aeon(s)
  choice: éon(s)
  rationale: Mantém o termo técnico da cosmologia do texto, em vez de reduzi-lo simplesmente a “era” ou “eternidade”.
- source_word: Fullness
  choice: Plenitude
  rationale: Preserva como título cosmológico o sentido técnico associado à totalidade divina.
- source_word: seed
  choice: semente
  rationale: Mantém a mesma imagem nos dois contextos — a petição em favor dela e sua posterior extração e depósito — sem decidir entre descendência coletiva, princípio espiritual ou substância geradora.
- source_word: came/proceeded forth
  choice: procedeu
  rationale: Expressa movimento de emanação sem impor uma explicação metafísica adicional.
- source_word: four-breasted virgin
  choice: virgem de quatro seios
  rationale: Tradução direta e inteligível da imagem corporal incomum do testemunho.
- source_word: male virgin / triple-male child
  choice: virgem masculina / criança três vezes masculina
  rationale: Conserva as formulações paradoxais e técnicas, evitando harmonizá-las ou reinterpretá-las.
theological_decisions:
- issue: Identidade e gênero das figuras celestes
  choice: Preservar literalmente expressões como “virgem masculina” e “criança três vezes masculina”
  alternative: Reformular como títulos abstratos ou neutralizar o gênero
  rationale: As tensões de gênero parecem intencionais no vocabulário teológico do tratado e não devem ser resolvidas pela tradução.
- issue: Sentido de “semente”
  choice: Usar “semente” em todas as ocorrências
  alternative: Traduzir a primeira ocorrência por “descendência” e a segunda por “semente”
  rationale: A repetição lexical pode ser teologicamente significativa; variar os termos ocultaria a possível ligação entre as passagens.
- issue: Linguagem de emanação
  choice: Traduzir o movimento de Plesithea como “procedeu”
  alternative: “nasceu”, “foi criada” ou “emanou”
  rationale: “Procedeu” conserva a indeterminação do testemunho quanto à natureza exata de sua origem.
- issue: Passagem sobre Gomorra e Sodoma
  choice: Manter a construção obscura sem explicá-la
  alternative: Reordenar a frase para atribuir um sentido simbólico específico
  rationale: O texto-base é sintaticamente e conceitualmente difícil; uma paráfrase poderia importar uma interpretação não demonstrada.
translation_notes:
  register: Português moderno, digno e legível, com manutenção dos nomes próprios e dos termos cosmológicos técnicos. A disposição em linhas preserva o caráter litânico da passagem. Esta é uma versão provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do copta dos códices de Nag Hammadi III,2 e IV,2 ainda está pendente. A sintaxe particularmente obscura da frase sobre Gomorra e Sodoma foi conservada com mínima regularização.
