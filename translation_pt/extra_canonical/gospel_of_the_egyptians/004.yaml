translation:
  language: pt
  text: 'Eles pediram [um] poder. Um silêncio do Silêncio vivente procedeu, a saber: [glórias] e indestrutibilidades nos éons, [... éons], miríades acrescentadas [ao ...], três machos, [os três] descendentes masculinos. As raças [masculinas] encheram o grande éon Doxomedon [com] o poder da palavra de [toda a Plenitude].


    Então, o [filho] triplamente masculino do [grande] Cristo, a quem o [grande] Espírito invisível havia ungido, aquele cujo poder [era chamado] Ainon, apresentou [louvor ao] grande Espírito invisível, [à sua] virgem masculina, Yoel, [ao] Silêncio do Silêncio silencioso e à grandeza [...].


    (As páginas 45–48 do Códice III estão ausentes; elas correspondem às páginas 55–60 do Códice IV.)[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As páginas 45–48 do Códice III não foram preservadas. A indicação editorial remete ao trecho paralelo nas páginas 55–60 do Códice IV. Esta versão é provisória, baseada no testemunho inglês de domínio público; a revisão direta do copta ainda está pendente.
    reason: Informa a lacuna material, identifica o testemunho paralelo e torna transparente a base textual provisória.
lexical_decisions:
- source_word: power
  choice: poder
  rationale: Mantém o sentido amplo do testemunho e não especifica se se trata de autoridade, força ou entidade hipostasiada.
- source_word: living Silence
  choice: Silêncio vivente
  rationale: Preserva a linguagem personificada e solene; «vivente» distingue a expressão do simples estado de estar calado.
- source_word: aeons
  choice: éons
  rationale: Usa a transliteração corrente em estudos de textos gnósticos, evitando reduzir o termo a «eras» quando ele pode designar realidades ou domínios celestes.
- source_word: Fullness
  choice: Plenitude
  rationale: Conserva o possível valor técnico e cosmológico do termo, com inicial maiúscula para indicar sua personificação ou estatuto próprio no contexto.
- source_word: triple-male
  choice: triplamente masculino
  rationale: Reproduz a formulação incomum sem tentar normalizar ou explicar uma categoria cosmológica obscura.
- source_word: male virgin
  choice: virgem masculina
  rationale: Mantém deliberadamente a tensão paradoxal da expressão, sem substituí-la por uma interpretação harmonizadora.
- source_word: speech
  choice: palavra
  rationale: Expressa de modo natural o poder da fala ou enunciação, preservando a possibilidade de sentido quase técnico.
theological_decisions:
- issue: Personificação de Silêncio, Espírito e Plenitude
  choice: Empregar iniciais maiúsculas nos nomes ou títulos personificados
  alternative: Usar minúsculas como substantivos comuns
  rationale: O contexto apresenta essas realidades como figuras ou princípios cosmológicos, mas a tradução não acrescenta definições doutrinárias.
- issue: Sentido de «triple-male» e «male virgin»
  choice: Preservar literalmente as expressões paradoxais
  alternative: Explicá-las como títulos de seres andróginos ou como categorias específicas
  rationale: O testemunho disponível não autoriza resolver a obscuridade nem importar uma interpretação teológica particular.
- issue: Natureza do «poder» chamado Ainon
  choice: Manter «poder» sem identificar Ainon com uma pessoa, atributo ou emanação
  alternative: Traduzir como «potência» e tratá-la explicitamente como entidade
  rationale: A sintaxe e o caráter técnico da cosmologia deixam aberta a natureza exata desse poder.
translation_notes:
  register: Português moderno, digno e legível, com preservação dos termos cosmológicos e das construções deliberadamente estranhas do testemunho. Os colchetes reproduzem restaurações ou lacunas editoriais; as reticências entre colchetes indicam texto perdido ou ilegível. Nomes próprios como Doxomedon, Ainon e Yoel foram transliterados sem interpretação adicional.
