lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Mantém o termo técnico e sua amplitude sem reduzi-lo a «Palavra», «Verbo» ou «Razão».
- source_word: self-generated
  choice: autogerado / Autogerado
  rationale: Reproduz a ideia de origem a partir de si mesmo; a inicial maiúscula na segunda ocorrência indica o uso titular.
- source_word: aeon(s)
  choice: éon(s)
  rationale: Conserva o termo cosmológico técnico, sem o interpretar apenas como período temporal.
- source_word: unseen Father
  choice: Pai invisível
  rationale: Expressão natural em português e semanticamente próxima do testemunho disponível.
- source_word: unmoving indestructible race
  choice: raça imóvel e indestrutível
  rationale: Preserva a estranheza cosmológica de «unmoving» e evita explicá-la como «imutável» sem revisão do copta.
- source_word: Manifestation
  choice: Manifestação
  rationale: Mantém a personificação feminina indicada pelo pronome subsequente.
- source_word: Hebdomad
  choice: Héptade
  rationale: Emprega o termo técnico português para um conjunto de sete, preservando sua função cosmológica.
- source_word: Ogdoads
  choice: Ogdóades
  rationale: Emprega a forma técnica portuguesa para grupos de oito, sem expansão interpretativa.
- source_word: Fullness
  choice: Plenitude
  rationale: Preserva o sentido técnico provável e a capitalização conceitual do testemunho.
- source_word: Seth
  choice: Sete
  rationale: Usa a forma bíblica portuguesa amplamente reconhecível para o nome, distinguível pelo contexto.
theological_decisions:
- issue: Relação gramatical entre Logos, Deus autogerado e Adamas
  choice: Manter três designações coordenadas com verbo no plural
  alternative: Ler as expressões como títulos de uma única entidade
  rationale: O testemunho inglês apresenta uma coordenação plural; sem revisão direta do copta, não se deve resolver a possível identidade ou distinção das figuras.
- issue: Referente de «por meio dela»
  choice: Preservar o pronome feminino com provável referência à raça
  alternative: Substituir explicitamente por «por meio desse filho»
  rationale: Mantém a cadeia referencial e sua possível ambiguidade teológica.
- issue: Natureza do «éon morto» e de sua dissolução
  choice: Traduzir literalmente sem explicação doutrinária
  alternative: Interpretar como mundo material, morte ou domínio inferior
  rationale: O trecho não autoriza identificar de forma inequívoca o éon com uma construção teológica específica.
- issue: Identidade feminina da Manifestação
  choice: Usar «ela» e «deu à luz»
  alternative: Neutralizar a figura como uma força impessoal
  rationale: O testemunho associa explicitamente a Manifestação a um pronome feminino e ao ato de dar à luz.
- issue: Cálculo cosmológico da Héptade e das onze Ogdóades
  choice: Conservar os termos e números tal como transmitidos
  alternative: Harmonizar ou explicar o cálculo
  rationale: A passagem é textualmente lacunosa e conceitualmente tensa; harmonizá-la apagaria dados do testemunho.
translation_notes:
  register: Português contemporâneo, solene e legível, com terminologia cosmológica transliterada quando a tradução comum reduziria a ambiguidade. O rascunho é necessariamente provisório porque a revisão direta do copta ainda está pendente; os sinais de dano e de restauração foram preservados por notas marcadas no corpo do texto.
