translation:
  language: pt
  text: 'O grande Logos, o Deus autogerado, e o Homem indestrutível, Adamas, ofereceram louvor. Pediram um poder e uma força eterna para o Autogerado, a fim de completar os quatro éons, para que, por meio deles, aparecesse [a] […] a glória e o poder do Pai invisível dos homens sagrados da grande Luz, os quais entrarão no mundo, a imagem da noite.


    O Homem indestrutível, Adamas, pediu-lhes que dele viesse um filho, para que se tornasse pai da raça imóvel e indestrutível; para que, por meio dela, o Silêncio e a Voz aparecessem; e para que, por meio dela, o éon morto se erguesse, a fim de se dissolver. E assim procedeu do alto o poder da grande Luz, a Manifestação. Ela deu à luz as quatro grandes luzes:


    Harmozel,


    Oroiael,


    Davithe,


    Eleleth,


    e o grande e indestrutível Sete, filho do Homem indestrutível, Adamas. Assim se completou a Héptade perfeita, que existe em mistérios ocultos. [b] Quando ela [alcança] a [glória], torna-se onze Ogdóades, e o Pai assentiu com a cabeça. Toda a Plenitude das luzes se alegrou.'
