    text: Há uma lacuna no manuscrito neste ponto; a extensão e o conteúdo do texto perdido são incertos.
    reason: Sinalizar no texto principal o dano indicado pelos colchetes vazios e pelas reticências do testemunho, sem introduzir uma restauração não fornecida.
  - marker: b
