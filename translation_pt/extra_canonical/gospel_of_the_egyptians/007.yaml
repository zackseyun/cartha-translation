lexical_decisions:
- source_word: Ogdoad
  choice: Ogdóade
  rationale: Emprega o termo técnico corrente em português para um conjunto de oito, preservando a estrutura cosmológica do texto.
- source_word: self-generated
  choice: autogerado
  rationale: Mantém a ideia de origem a partir de si mesmo sem acrescentar uma interpretação metafísica mais específica.
- source_word: Fullness
  choice: Plenitude
  rationale: Preserva o sentido técnico cosmológico sem substituir o termo por uma explicação interpretativa; a inicial maiúscula sinaliza seu uso como realidade personificada ou técnica.
- source_word: Logos
  choice: Logos
  rationale: Mantém o termo técnico, sobretudo porque ele aparece ao lado de “Speech”; traduzi-lo também por “Palavra” apagaria a distinção presente no testemunho.
- source_word: Speech
  choice: Palavra
  rationale: Oferece expressão portuguesa natural e mantém sua distinção em relação a “Logos”.
- source_word: aeon
  choice: éon
  rationale: Usa a transliteração técnica já estabelecida em português para a entidade ou domínio cosmológico, sem reduzir o termo a mera duração temporal.
- source_word: virginal Spirit / male virgin
  choice: Espírito virginal / virgem masculina
  rationale: Preserva a linguagem paradoxal e a tensão de gênero do testemunho, sem harmonizá-la.
- source_word: indestructible race
  choice: raça indestrutível
  rationale: Tradução direta do vocabulário identitário e cosmológico do testemunho, sem reinterpretá-lo como grupo étnico moderno ou comunidade denominacional.
theological_decisions:
- issue: Relação entre “Logos” e “Speech”
  choice: “Logos” e “Palavra” foram mantidos como designações distintas.
  alternative: Traduzir ambos por “Palavra” ou explicar um como equivalente do outro.
  rationale: O testemunho os coordena; fundi-los eliminaria uma distinção potencialmente significativa.
- issue: Expressão “the Father, the fourth”
  choice: “o Pai, o quarto”
  alternative: “o quarto Pai” ou uma reformulação que identifique explicitamente a série à qual ele pertence.
  rationale: A aposição é ambígua no testemunho e foi preservada, sem decidir se “quarto” funciona como título, posição ou descrição.
- issue: “male virgin” e “triple-male child”
  choice: “virgem masculina” e “criança tríplice-masculina”
  alternative: Suavizar para expressões não paradoxais ou reinterpretá-las segundo um sistema teológico posterior.
  rationale: A formulação incomum faz parte da teologia e da retórica do texto e não deve ser normalizada.
- issue: “the child of the child”
  choice: “[a criança] da criança”
  alternative: Resolver a relação como filiação, emanação ou título próprio.
  rationale: A restauração e a relação sintática permanecem incertas; a tradução conserva tanto os colchetes quanto a formulação do testemunho.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se termos cosmológicos técnicos como “Ogdóade”, “Plenitude”, “Logos” e “éon”. Os números isolados [11] e [12], que no testemunho funcionam como paginação manuscrita e interrompem a sintaxe, foram omitidos. Lacunas, restaurações e sinais editoriais foram preservados ou explicitados em colchetes. A tradução é provisória, pois foi elaborada a partir do testemunho inglês público fornecido; ainda requer conferência direta do copta nos códices de Nag Hammadi III,2 e IV,2.
