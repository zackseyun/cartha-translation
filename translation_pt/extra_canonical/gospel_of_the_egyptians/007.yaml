translation:
  language: pt
  text: 'Seus companheiros avançaram para completar a Ogdóade do Deus autogerado:


    Graça, da primeira luz, Harmozel;

    Percepção, da segunda luz, Oroiael;

    Entendimento, da terceira luz, Davithe;

    Discernimento, da quarta luz, Eleleth.


    Esta é a primeira Ogdóade do Deus autogerado, e o Pai assentiu com a cabeça. Toda a Plenitude das Luzes se alegrou.


    Os ministros avançaram:


    o primeiro, o grande Gamaliel, da primeira grande luz, Harmozel;

    e o grande Gabriel, da segunda grande luz, Oroiael;

    e o grande Samlo, da grande luz, Davithe;

    e o grande Abrasax, de [uma lacuna no manuscrito] [da grande luz], Eleleth.


    E os companheiros avançaram segundo a vontade e o beneplácito do Pai:


    Memória, do grande Gamaliel, o primeiro;

    Amor, do grande Gabriel, o segundo;

    Paz, do grande Samblo[a], o terceiro;

    Vida Eterna, do grande Abrasax, o quarto.


    Assim se completaram as cinco Ogdóades, totalizando quarenta, como um poder que está além de toda interpretação.


    Então o grande Logos autogerado e a Palavra da Plenitude das quatro luzes ofereceram louvor:


    ao grande Espírito virginal, invisível e inominável,

    isto é, à virgem masculina,

    e ao grande éon Doxomedon,

    e aos tronos que estão dentro deles,

    e aos poderes que os cercam,

    às glórias, autoridades e poderes,

    <e> à criança tríplice-masculina,

    e à virgem masculina Youel,

    e a Esephech, [uma lacuna no manuscrito], guardião do esplendor, [a criança] da criança,

    e à coroa de [sua] glória,

    a toda a Plenitude,

    e a todas as glórias que ali habitam,

    às Plenitudes infinitas

    e aos éons inomináveis,


    para que nomeassem o Pai, o quarto, juntamente com a raça indestrutível, e chamassem a semente do Pai de semente do grande Seth.


    [a] O testemunho fornecido traz “Samlo” na primeira lista e “Samblo” nesta ocorrência; a diferença foi preservada.'
