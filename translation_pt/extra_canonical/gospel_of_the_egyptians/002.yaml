translation:
  language: pt
  text: 'Três poderes procederam dele — o Pai, a Mãe e o Filho —, provenientes do Silêncio vivente, que procedeu do Pai indestrutível. Eles procederam [do] Silêncio do Pai desconhecido, [e] daquele lugar [pro]cedeu Domedon Doxomedon, [o éon dos] éons, e a [Luz] dos poderes próprios [deles]. E, dessa maneira, o Filho [pro]cedeu em quarto lugar; a Mãe, [em quinto; e o Pai,] em sexto.


    Ele estava [sem ser percebido], embora ainda não tivesse sido anunciado. [Ele é aquele] que não é designado entre todos [os poderes], as glórias e as [indestrutibilidades].


    Daquele lugar [pro]cederam os três poderes, [...] as três Ogdôades, que [o Pai pro]duz no Silêncio, juntamente com a Providência, de seu seio, a saber: o Pai, a Mãe e o Filho.


    A <primeira> Ogdôade, por causa da qual procedeu a criança tríplice-masculina, é:


    Pensamento,


    e Logos,


    e Indestrutibilidade,


    e Vida [Eterna],


    Vontade,


    Mente,


    Presciência,


    o Pai andrógino.


    O segundo poder-Ogdôade:


    a Mãe,


    a virgem Barbelon,


    Epititioch[... ]ai,


    Memeneaimen, [que] supervisiona o céu,


    Karb[...],


    o poder que está além de toda interpretação,


    a Mãe indizível.


    [Ela é] auto[originada...]. Ela procedeu. [Ela] concordou com o Pai [do] Silêncio silencioso.


    O terceiro poder-Ogdôade:


    o Filho do [Silêncio silencioso],


    e a coroa do Silêncio silencioso,


    [e] a glória do Pai,


    e a virtude [da] [...] [Mãe].


    [Ele] produz, do seio, os sete poderes da grande Luz, que são as sete vozes, e a consumação delas é a fala.


    Esses são os três [poderes], as três Ogdôades que o Pai [pro]duziu de seu seio [por meio de] sua Providência. Ele os produziu naquele lugar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Silence
  choice: Silêncio
  rationale: Mantém o termo técnico personificado e sua repetição deliberada, usando inicial maiúscula.
- source_word: aeon
  choice: éon
  rationale: Transliteração já estabelecida em português para o conceito cosmológico, sem reduzi-lo simplesmente a “era”.
- source_word: Ogdoad
  choice: Ogdôade
  rationale: Emprega a forma técnica portuguesa que designa um conjunto de oito entidades.
- source_word: Logos
  choice: Logos
  rationale: Preserva o termo técnico grego e sua amplitude semântica, evitando escolher entre “Palavra”, “Razão” e “Discurso”.
- source_word: lap
  choice: seio
  rationale: Expressa a imagem de origem íntima ou geradora de modo natural e digno, sem torná-la anatomicamente específica.
- source_word: Providence
  choice: Providência
  rationale: Mantém a personificação cosmológica indicada pelo uso como entidade associada ao Pai.
- source_word: triple-male child
  choice: criança tríplice-masculina
  rationale: Conserva a formulação técnica e incomum do testemunho, sem normalizá-la para uma doutrina específica.
- source_word: completion
  choice: consumação
  rationale: Retém a ideia de plenitude ou realização final, em vez de sugerir apenas término cronológico.
theological_decisions:
- issue: Relações entre Pai, Mãe e Filho
  choice: Preservar a linguagem de procedência e a ordem enigmática do texto
  alternative: Reformular como criação, geração ou uma estrutura trinitária convencional
  rationale: O testemunho apresenta uma cosmologia própria e não autoriza harmonização com formulações confessionais posteriores.
- issue: Silêncio como entidade personificada
  choice: Usar “Silêncio” com inicial maiúscula
  alternative: Tratar “silêncio” apenas como estado ou circunstância
  rationale: A sintaxe e as relações de procedência indicam função hipostática ou personificada.
- issue: Identidade do referente masculino em “Ele”
  choice: Manter o pronome sem identificar explicitamente o referente
  alternative: Substituir por “o Pai”, “Domedon Doxomedon” ou outra figura
  rationale: O trecho é genuinamente ambíguo e o contexto preservado não permite resolução segura.
- issue: Androginia do Pai
  choice: Traduzir diretamente como “o Pai andrógino”
  alternative: Atenuar ou explicar a expressão no corpo do texto
  rationale: A qualificação pertence à teologia do documento e deve permanecer sem correção denominacional.
- issue: Virtude da Mãe
  choice: Manter “virtude”
  alternative: Traduzir como “poder”
  rationale: A redação do testemunho distingue neste ponto “virtue” de ocorrências explícitas de “power”; a distinção foi preservada provisoriamente.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Por se tratar de uma versão provisória baseada no testemunho público em inglês, foram preservados colchetes, lacunas, elipses e sinais editoriais; os números isolados de páginas do manuscrito foram omitidos. Nomes próprios obscuros foram transliterados conforme o testemunho. Uma revisão direta do copta ainda é necessária.
