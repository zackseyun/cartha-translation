translation:
  language: pt
  text: 'Cinco mil anos depois, a grande luz Eleleth disse: “Que haja um governante sobre o Caos e o Hades”. Então apareceu uma nuvem [] [chamada] Sofia hílica[a] [...].


    [Ela] contemplou as regiões [do Caos]. Seu rosto se assemelhava a [...] em sua forma [...] sangue. Então [o grande] anjo Gamaliel disse [ao grande Gabriel], ministro da [grande luz] Oroiael. Ele [disse: “Que um] anjo venha à existência [para] governar o Caos [e o Hades]”.


    Então a nuvem [obedeceu e produziu] duas mônadas[b], cada uma [possuindo] luz. [... o trono] que ela havia erguido na nuvem [acima].


    Então Sakla, o grande [anjo, viu] o grande demônio [que o acompanhava, Nebr]uel; e [juntos] eles se tornaram um espírito gerador da terra. [Eles geraram] anjos servidores.


    Sakla [disse] ao grande [demônio] Nebruel: “Que [os] doze éons[c] venham à existência no [­...] éon, mundos [...]”.


    [...] o grande anjo [Sakla] disse, segundo a vontade daquele que gerou a si mesmo[d], []: “Haverá [...] a contagem de sete [...]”. E disse aos [grandes anjos]: “Vão, e [que cada] um de vocês governe seu [próprio mundo]”.


    Cada um [destes] doze [anjos] veio [à existência]:


    [O primeiro] anjo é Ath[oth]. [É ele] a quem [as grandes] gerações humanas chamam [...].


    [O] segundo é Harmas, [que] é [olho de fogo].


    O terceiro [é Galila].


    [O] quarto é Yobel.


    [O quinto é] Adonaios, que é [chamado] Sabaoth.


    O sexto [é Caim, a quem] as [grandes gerações] humanas chamam de sol.


    O [sétimo é Abel].


    O oitavo é Akiressina.


    O [nono é Yubel].


    O décimo é Harm[oupiael].


    [O] décimo primeiro é Arch[ir-Adonin].


    O décimo segundo [é Belias].


    [Estes são] os que foram postos sobre o Hades [e o Caos]. Depois da fundação [do mundo], Sakla disse aos seus [anjos]: “Eu, sim, eu sou um Deus [ciumento], e fora de mim nada [veio à existência”, porque ele] [] confiava em sua própria substância.


    Então veio do alto uma voz que dizia: “O Homem existe, e o Filho do Homem”.[e]


    O primeiro molde foi formado por causa da descida da imagem do alto, que faz sua voz ressoar no alto — a imagem que apareceu ao olhar para fora, por meio do olhar para fora da imagem do alto. Por causa disso, o Arrependimento veio à existência.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hílica” significa “relativa à matéria” e aqui funciona como termo cosmológico. A expressão também poderia ser vertida por “Sofia material”.
    reason: Esclarecer um termo técnico pouco comum sem substituí-lo por uma interpretação no texto principal.
  - marker: b
    text: “Mônadas” significa literalmente “unidades”; neste contexto, o termo parece designar realidades cosmológicas individuais.
    reason: Tornar compreensível o vocabulário técnico preservando sua possível carga metafísica.
  - marker: c
    text: “Éons” pode designar eras, mundos ou entidades celestes. O texto fragmentário não permite decidir com segurança.
    reason: Preservar uma ambiguidade cosmológica genuína.
  - marker: d
    text: 'Ou: “o Autogerado”.'
    reason: Registrar a alternativa de tradução do provável título técnico.
  - marker: e
    text: “O Homem” e “o Filho do Homem” podem ser títulos de figuras celestes ou arquetípicas; também é possível traduzir sem maiúsculas.
    reason: Não impor uma identificação cristológica ou antropológica que a passagem, isoladamente, não estabelece.
  - marker: f
    text: O trecho sobre a imagem e seu “olhar para fora” é obscuro e sobrevive de forma fragmentária; a tradução conserva sua repetição e incerteza.
    reason: Alertar para a baixa segurança textual e evitar que a fluência aparente esconda a dificuldade do testemunho.
lexical_decisions:
- source_word: hylic Sophia
  choice: Sofia hílica
  rationale: Mantém o nome técnico e verte o adjetivo relativo à matéria por uma forma já existente em português, sem interpretar a figura simplesmente como “Sabedoria material”.
- source_word: monads
  choice: mônadas
  rationale: Preserva o termo cosmológico técnico; uma paráfrase como “unidades” eliminaria possíveis associações metafísicas.
- source_word: aeons
  choice: éons
  rationale: Usa a transliteração técnica corrente para entidades ou esferas cosmológicas, preservando a ambiguidade entre seres, eras e mundos.
- source_word: self-generated one
  choice: aquele que gerou a si mesmo
  rationale: Expressa de modo inteligível o título de autogênese sem identificá-lo com uma figura teológica específica.
- source_word: mold
  choice: molde
  rationale: Preserva a metáfora de um modelo ou forma moldadora; “corpo” ou “ser humano” seriam interpretações excessivas.
- source_word: Repentance
  choice: Arrependimento
  rationale: A inicial maiúscula sinaliza que o termo pode funcionar como realidade personificada, sem eliminar seu sentido abstrato.
theological_decisions:
- issue: A afirmação de exclusividade divina feita por Sakla
  choice: Preservada como fala de Sakla, inclusive “Deus ciumento” e “fora de mim nada veio à existência”
  alternative: Harmonizar a declaração com formulações bíblicas ou explicá-la como falsa no corpo do texto
  rationale: O contexto literário atribui a fala a Sakla e cria tensão deliberada; a tradução não deve resolver essa tensão doutrinariamente.
- issue: “The Man” e “the Son of the Man”
  choice: “O Homem” e “o Filho do Homem”, com maiúsculas
  alternative: “o ser humano” e “o filho do ser humano”
  rationale: As maiúsculas preservam o provável caráter titular ou arquetípico, enquanto a nota reconhece a ambiguidade.
- issue: Natureza dos doze éons
  choice: Manter “éons” sem defini-los como anjos, eras ou mundos
  alternative: Traduzir por “eras”, “seres celestes” ou “mundos”
  rationale: A passagem danificada aproxima éons e mundos, mas não permite estabelecer com segurança uma equivalência exata.
- issue: Agência na formação do primeiro molde
  choice: Manter a sequência repetitiva e obscura de imagem, voz e olhar
  alternative: Reformular em uma cadeia causal clara
  rationale: O texto testemunhal é difícil e possivelmente corrompido; uma formulação mais clara resolveria incertezas não resolvidas pela evidência fornecida.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais no Brasil e inteligíveis internacionalmente. Colchetes e reticências preservam, respectivamente, restaurações editoriais/lacunas e perdas do manuscrito. Os nomes próprios foram transliterados de modo conservador. A redação é provisória porque se baseia no testemunho inglês público fornecido; a revisão direta do copta dos códices de Nag Hammadi III,2 e IV,2 continua pendente.
