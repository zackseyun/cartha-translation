review_pass:
  verdict: revise
  source_fidelity: A minuta acompanha de perto o testemunho inglês fornecido e preserva adequadamente lacunas, restaurações e a maior parte da terminologia técnica. Contudo, algumas formas de nomes próprios divergem sem justificativa do testemunho, e duas formulações precisam de ajuste para representar mais precisamente «gates to the waters» e «world with world». A dependência do testemunho inglês permanece necessária, pois não foi fornecido texto copta para controle direto.
  naturalness: O português é geralmente claro, solene e legível. A segmentação do período extenso é útil. «Portas para as águas» é mais natural e exato que «entradas das águas»; as enumerações e a construção final deliberadamente difíceis devem conservar a estranheza do testemunho.
  terminology: '«Éons», «arcontes», «Plenitude», «Logos», «Providência» e «repouso» são escolhas adequadas. «Parousias» é mantido em nota como alternativa. Os nomes obscuros devem ser transliterados de maneira consistente com o testemunho de base: Selmechel, Theopemptos, Micheus e Michar.'
  issues:
  - severity: medium
    issue: Formas divergentes de nomes técnicos
    rationale: «Selmequel», «Teopemptos», «Miqueus» e «Micar» afastam-se de Selmechel, Theopemptos, Micheus e Michar no testemunho inglês, embora a política declarada seja preservar nomes técnicos sem harmonização. A uniformidade também é importante porque Micheus e Michar ocorrem duas vezes.
  - severity: medium
    issue: «Entradas das águas» para «gates to the waters»
    rationale: O texto-base especifica portões/portas que dão acesso às águas; «entradas das águas» pode sugerir entradas pertencentes às próprias águas e perde essa relação direcional.
  - severity: low
    issue: Omissão do artigo em «reconciliação de mundo com mundo»
    rationale: «Reconciliação do mundo com o mundo» reproduz a repetição enfática de «world with world» e é a forma portuguesa mais completa.
  - severity: low
    issue: Grafia inconsistente de Seth no nome ritual
    rationale: Se o nome é vertido como «Sete» no restante da passagem, «Heli Heli Machar Machar Sete» mantém a mesma decisão transliterativa.
