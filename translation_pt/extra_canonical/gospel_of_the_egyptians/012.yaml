review_pass:
  verdict: revise
  source_fidelity: A minuta acompanha de perto o testemunho inglês fornecido e preserva adequadamente lacunas, restaurações e muitas ambiguidades cosmológicas. Contudo, há alterações não justificadas de nomes técnicos (Selmechel, Micheus, Michar) e uma inversão potencial do referente em «por meio dela», além de alguns pontos em que a tradução torna o texto mais interpretativo ou menos precisa que o testemunho. A revisão direta do copta continua pendente.
  naturalness: O português é em geral claro e de registro apropriado. A longa enumeração exige construção algo fragmentária, como no original. Foram ajustadas formulações como «as portas para as águas», «batismo para os vivos» e «receptores», sem resolver as obscuridades rituais do texto.
  terminology: Mantêm-se éons, arcontes, Plenitude, Logos, parúsias, Autogerado e os títulos cosmológicos. «Parúsias» é preferível a «manifestações», pois evita restringir o termo técnico; a nota oferece equivalentes possíveis. Os nomes não bíblicos ou técnicos são conservados conforme o testemunho inglês; Jacó permanece a forma portuguesa usual de Jacob.
  issues:
  - severity: medium
    issue: Nomes Selmechel, Micheus e Michar foram alterados para Selmequel, Miqueus e Micar.
    rationale: Nomes técnicos desta lista cosmológica devem ser transliterados de modo consistente com o testemunho de base, salvo evidência direta do copta para outra forma. As adaptações introduzem harmonização não apoiada pelo material fornecido.
  - severity: medium
    issue: «manifestações» traduz parousias.
    rationale: O termo pode significar vindas, adventos ou aparições; «manifestações» seleciona uma leitura específica. A manutenção de «parúsias», com nota, preserva melhor a ambiguidade técnica.
  - severity: medium
    issue: «por meio dela» foi ligado de modo pouco claro à «luz».
    rationale: No testemunho, a luz preexiste com a Providência e o batismo é instituído «through her»; a referência feminina é sintaticamente incerta, mas a redação deve evitar afirmar que a luz, e não a Providência, é o meio da instituição. A formulação revista mantém a ambiguidade.
  - severity: low
    issue: «entradas das águas» e «batismo destinado aos vivos» afastam-se do sentido direto.
    rationale: O testemunho fala de «gates to the waters» e «baptism for the living». «Portas para as águas» e «batismo para os vivos» são mais fiéis e naturais.
  - severity: low
    issue: «recebedores» é pouco idiomático em português contemporâneo.
    rationale: «Receptores» mantém a proximidade formal com receivers e continua sem especificar indevidamente a função dessas entidades.
  revised_text: 'Então, dos grandes éons saíram quatrocentos anjos etéreos. Com eles estavam o grande Aerosiel e o grande Selmechel, para vigiar a grande raça indestrutível, seu fruto e os grandes homens do grande Sete, desde o tempo e o momento da Verdade e da Justiça até a consumação do éon e de seus arcontes, os quais os grandes juízes condenaram à morte.


    Então o grande Sete foi enviado pelas quatro luzes, segundo a vontade do Autogerado[a] e de toda a Plenitude, por meio <do dom> e do beneplácito do grande Espírito invisível, dos cinco selos e de toda a Plenitude.


    Ele atravessou as três parúsias[b] que mencionei anteriormente: o dilúvio, a conflagração e a condenação dos arcontes, dos poderes e das autoridades, para que aquela que havia se desviado fosse salva por meio da reconciliação do mundo e do batismo por meio de um corpo gerado pelo Logos. O grande Sete preparou secretamente esse corpo para si por meio da virgem, a fim de que os santos fossem gerados pelo Espírito Santo por meio de símbolos secretos e invisíveis; por meio da reconciliação de mundo com mundo; por meio da renúncia ao mundo e ao deus dos treze éons; e por meio das sessões dos santos indizíveis e indestrutíveis, no seio e na grande luz do Pai. Essa luz preexistia com sua Providência e instituiu, por meio dela, o batismo sagrado que está acima do céu, mediante o Indestrutível[c] gerado pelo Logos — o Vivente, Jesus, aquele de quem o grande Sete se revestiu. Por meio dele, Sete pregou na cruz os poderes dos treze éons e confirmou os que são gerados e removidos.


    Ele os equipou com a armadura do conhecimento dessa verdade, no poder invencível da indestrutibilidade. Apareceram-lhes:


    o grande assistente Yesseus Mazareus Yessedekeus, a água viva;


    e os grandes chefes: Jacó, o Grande;


    e Teopemptos e Isavel;


    e os que supervisionam a fonte da verdade: Micheus, Michar e Mnesinous;


    e aquele que supervisiona o batismo para os vivos;


    e os que purificam;


    e Sesengenpharanges;


    e os que supervisionam as portas para as águas: Micheus e Michar;


    e os que supervisionam a alta montanha: Seldao e Elainos;


    e os receptores da grande raça;


    os poderosos indestrutíveis <do> grande Sete;


    os ministros das quatro luzes: o grande Gamaliel, o grande Gabriel, o grande Samblo e o grande[d] Abrasax;


    e os que supervisionam o nascer do sol: Olses, Hupneus e Heurumaious;


    e os que foram colocados sobre a entrada para o repouso da vida eterna: os governantes Mixanther e Michanor;


    e os guardiões das almas eleitas: Akramas e Strempouchos;


    e o grande poder Heli Heli Machar Machar Seth;


    e o grande Espírito virgem, invisível, inominável e inexprimível, e o Silêncio;


