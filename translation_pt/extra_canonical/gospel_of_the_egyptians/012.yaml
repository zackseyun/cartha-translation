translation:
  language: pt
  text: 'Então, dos grandes éons saíram quatrocentos anjos etéreos. Com eles estavam o grande Aerosiel e o grande Selmequel, para vigiar a grande raça indestrutível, seu fruto e os grandes homens do grande Sete, desde o tempo e o momento da Verdade e da Justiça até a consumação do éon e de seus arcontes, os quais os grandes juízes condenaram à morte.


    Então o grande Sete foi enviado pelas quatro luzes, segundo a vontade do Autogerado, [a] e de toda a Plenitude, por meio <do dom> e do beneplácito do grande Espírito invisível, dos cinco selos e de toda a Plenitude.


    Ele atravessou as três manifestações[b] que mencionei anteriormente: o dilúvio, a conflagração e a condenação dos arcontes, dos poderes e das autoridades, para que aquela que havia se desviado fosse salva por meio da reconciliação do mundo e do batismo mediante um corpo gerado pelo Logos. O grande Sete preparou secretamente esse corpo para si por meio da virgem, a fim de que os santos fossem gerados pelo Espírito Santo por meio de símbolos secretos e invisíveis; por meio da reconciliação de mundo com mundo; por meio da renúncia ao mundo e ao deus dos treze éons; e por meio das sessões dos santos indizíveis e indestrutíveis, no seio e na grande luz do Pai. Essa luz preexistia com a Providência dele e, por meio dela, instituiu o batismo sagrado que está acima do céu, mediante o Indestrutível [c] gerado pelo Logos — o Vivente, Jesus, aquele de quem o grande Sete se revestiu. Por meio dele, Sete pregou na cruz os poderes dos treze éons e confirmou os que são produzidos e removidos.


    Ele os equipou com a armadura do conhecimento dessa verdade, no poder invencível da indestrutibilidade. Apareceram-lhes:


    o grande assistente Yesseus Mazareus Yessedekeus, a água viva;


    e os grandes chefes: Jacó, o Grande,


    e Teopemptos e Isavel;


    e os que supervisionam a fonte da verdade: Miqueus, Micar e Mnesinous;


    e aquele que supervisiona o batismo destinado aos vivos;


    e os que purificam;


    e Sesengenpharanges;


    e os que supervisionam as entradas das águas: Miqueus e Micar;


    e os que supervisionam a alta montanha: Seldao e Elainos;


    e os recebedores da grande raça;


    os poderosos indestrutíveis <do> grande Sete;


    os ministros das quatro luzes: o grande Gamaliel, o grande Gabriel, o grande Samblo e o grande [d] Abrasax;


    e os que supervisionam o nascer do sol: Olses, Hupneus e Heurumaious;


    e os que foram colocados sobre a entrada para o repouso da vida eterna: os governantes Mixanther e Michanor;


    e os guardiões das almas eleitas: Akramas e Strempouchos;


    e o grande poder Heli Heli Machar Machar Seth;


    e o grande Espírito virgem, invisível, inominável e inexprimível, e o Silêncio;


    e a grande luz Harmozel;


    o lugar do Autogerado vivente, o Deus da verdade, e <aquele> que o acompanha:


    o Homem indestrutível, Adamas;


    o segundo, Oroiael, o lugar do grande Sete;


    e Jesus, que possui a vida, que veio e crucificou aquilo que está na Lei;


    o terceiro, Davithe, o lugar dos filhos do grande Sete;


    o quarto, Eleleth, o lugar das almas dos filhos que repousam;


    o quinto, Yoel, colocado sobre o nome daquele que será designado para batizar com o batismo sagrado que está acima do céu indestrutível.


    De agora em diante, porém, [e] por meio do Homem indestrutível Poimael e daqueles dignos de súplica, das renúncias dos cinco selos junto à fonte batismal, eles conhecerão seus recebedores quando forem instruídos a respeito deles; serão conhecidos por eles e de modo algum provarão a morte.


    [a] Há uma lacuna no manuscrito depois de “Autogerado”.

    [b] Ou: “vindas” (parousias).

    [c] Há uma lacuna no manuscrito depois de “Indestrutível”.

    [d] Há uma lacuna no manuscrito antes de “Abrasax”.

    [e] Há uma lacuna no manuscrito neste ponto.'
  philosophy: optimal-equivalence
  footnotes:
