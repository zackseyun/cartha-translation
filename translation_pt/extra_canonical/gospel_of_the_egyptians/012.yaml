    reason: Sinalizar dano ou perda textual indicado por colchetes vazios no testemunho.
  - marker: e
    text: Há uma lacuna no manuscrito neste ponto.
    reason: Sinalizar dano ou perda textual indicado por colchetes vazios no testemunho.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Mantém o termo técnico cosmológico do escrito, já corrente em português acadêmico e religioso, sem reduzi-lo a simples “eras”.
- source_word: archons
  choice: arcontes
  rationale: Preserva a designação técnica das potências governantes na cosmologia do texto.
- source_word: self-generated one
  choice: Autogerado
  rationale: Reproduz o título técnico e sua função nominal; a inicial maiúscula sinaliza que se trata de uma entidade nomeada.
- source_word: Fullness
  choice: Plenitude
  rationale: Conserva o sentido técnico de totalidade divina, sem importar explicações doutrinárias.
- source_word: parousias
  choice: manifestações
  rationale: Expressa de modo compreensível o sentido de aparecimentos ou adventos, preservando “vindas” como alternativa em nota.
- source_word: Logos
  choice: Logos
  rationale: Mantém o termo técnico e sua ambiguidade conceitual, evitando decidir entre “Palavra”, “Verbo” e “Razão”.
- source_word: receivers
  choice: recebedores
  rationale: Tradução formalmente próxima, pois a função ritual ou cosmológica exata dessas figuras permanece incerta.
- source_word: repose
  choice: repouso
  rationale: Preserva a linguagem técnica de descanso escatológico sem interpretá-la como morte ou salvação.
theological_decisions:
- issue: Relação entre Sete e Jesus
  choice: “Jesus, aquele de quem o grande Sete se revestiu”
  alternative: “Jesus, aquele que o grande Sete vestiu”
  rationale: A formulação escolhida preserva a imagem de revestimento e evita explicar ontologicamente a relação entre as figuras.
- issue: Objeto da crucificação
  choice: “crucificou aquilo que está na Lei”
  alternative: “crucificou o que pertence à Lei”
  rationale: Mantém a construção enigmática do testemunho e não identifica indevidamente o objeto com a própria Lei, a carne ou uma potência.
- issue: Referente feminino de “aquela que havia se desviado”
  choice: Pronome feminino sem identificação adicional
  alternative: Identificá-la como Sabedoria ou alma
  rationale: O trecho fornecido não explicita o referente; nomeá-lo resolveria uma ambiguidade teológica genuína.
- issue: Espírito Santo / Espírito virgem
  choice: Preservação das duas formulações distintas
  alternative: Harmonizá-las como uma única designação uniforme
  rationale: O texto usa títulos diferentes; a tradução não deve apagar possível distinção ou tensão interna.
- issue: “deus dos treze éons”
  choice: “deus” em minúscula
  alternative: “Deus” em maiúscula
  rationale: Distingue esta figura cosmológica do “Deus da verdade” posteriormente nomeado, conforme o contraste interno do trecho, sem acrescentar identificação denominacional.
translation_notes:
  register: Português moderno, digno e legível, com sintaxe parcialmente segmentada para tornar compreensíveis os longos períodos do testemunho. Termos cosmológicos técnicos e nomes próprios foram conservados, sem harmonização com tradições posteriores. As restaurações entre sinais angulares foram mantidas. Como a revisão direta do copta ainda está pendente, esta minuta permanece explicitamente baseada no testemunho inglês público fornecido.
