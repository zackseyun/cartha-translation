review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o testemunho inglês provisório e preserva adequadamente a linguagem cosmológica, os nomes, as lacunas e as formulações paradoxais. Contudo, há alterações que reduzem a precisão: “santos” interpreta “sacred” como pessoas santas; Mirothoe foi grafado de forma diferente do testemunho; “Logos de Homem” não conserva o título “Man”; e a inversão em “à [virgem] masculina” desloca indevidamente os colchetes de restauração presentes em “male [virgin]”.'
  naturalness: O registro é geralmente claro e digno em português contemporâneo. Mantêm-se, de modo apropriado, certas expressões estranhas ou técnicas do texto, como “virgem masculina”, “terra do ar” e “criança três vezes masculina”. Foram feitos apenas ajustes pontuais para maior correção e para refletir melhor o vínculo sintático do original.
  terminology: “Logos”, “éon”, “Plenitude”, “deficiência” e “autogerado” são escolhas adequadas e prudentemente não doutrinárias. “Seres sagrados e indestrutíveis” evita transformar uma qualidade das entidades em uma designação de santos. “Receptora de Deus” conserva melhor o substantivo “receiver” que a paráfrase verbal anterior.
  issues:
  - severity: medium
    issue: “santos indestrutíveis” para “sacred, indestructible ones”
    rationale: “Santos” tende a substantivar e especificar as figuras como santos, enquanto o testemunho lhes atribui as qualidades “sagrados” e “indestrutíveis”. “Seres sagrados e indestrutíveis” preserva ambas sem interpretação adicional.
  - severity: medium
    issue: Grafia “Mirotoe”
    rationale: O testemunho fornecido traz “Mirothoe”. Sem evidência copta apresentada que justifique uma normalização portuguesa, o nome deve ser mantido como no audit trail.
  - severity: medium
    issue: “Um Logos de Homem”
    rationale: O testemunho diz “A Logos of Man”, e “Man” é usado como título, tal como nas ocorrências anteriores. “Um Logos do Homem” preserva essa referência.
  - severity: high
    issue: Deslocamento dos colchetes em “à [virgem] masculina, Youel”
    rationale: 'O testemunho marca a restauração em “male [virgin]”, não em “[male] virgin”. A tradução deve manter a restauração sobre o equivalente de “virgem”: “ao masculino [virgem], Youel”, apesar da estranheza resultante.'
  - severity: low
    issue: “a que recebe Deus” para “the receiver of God”
    rationale: A redação anterior transforma o substantivo em oração relativa e torna a imagem menos precisa. “A receptora de Deus” mantém a designação, sem explicar a relação ambígua.
  revised_text: '[] [...apareceu daquele] [lugar] a nuvem [da] grande Luz, o poder vivente, a mãe dos seres sagrados e indestrutíveis, o grande poder, Mirothoe, e ela deu à luz aquele cujo nome pronuncio três vezes:



    IEN



    IEN



    EA



    EA



    EA,



    pois este é Adamas, a luz resplandecente, que se origina do Homem, o Homem Primordial, por meio de quem e para quem tudo veio a existir, e sem quem nada veio a existir. O Pai incognoscível, inapreensível, emanou e desceu do alto para anular a deficiência.



    Então o grande Logos[a], o Deus autogerado, e o Homem indestrutível, Adamas, fundiram-se um com o outro. Um Logos do Homem veio a existir, mas o Homem veio a existir por um ato de fala. Ele ofereceu louvor:



    ao grande Espírito virginal, invisível e inapreensível,



    à virgem masculina,



    e à criança três vezes masculina,



    [] e ao masculino [virgem], Youel,



    e a Esephech, guardião do esplendor,



    à criança da criança,



    e à coroa de sua glória,



    ao grande éon Doxomedon[b],



    e aos tronos dentro dele,



    e aos poderes ao redor dele,



    às glórias,



    e às indestrutibilidades,



    e a toda a sua Plenitude[c], que mencionei anteriormente,



    e à terra do ar, a receptora de Deus,



    de onde os homens sagrados da grande Luz recebem uma imagem,



    os homens do Pai do Silêncio vivente e silencioso,



    o Pai e toda a Plenitude deles, como mencionei anteriormente.'
  revised_footnotes:
  - marker: a
    text: 'Logos: termo grego que pode significar “palavra”, “discurso” ou “razão”; aqui funciona como título de uma realidade divina.'
    reason: O termo técnico possui amplitude semântica que uma única tradução portuguesa reduziria.
  - marker: b
    text: 'Éon: neste texto, uma realidade ou domínio celestial; Doxomedon é um nome próprio.'
    reason: Ajuda leitores comuns sem identificar o conceito com uma doutrina denominacional.
  - marker: c
