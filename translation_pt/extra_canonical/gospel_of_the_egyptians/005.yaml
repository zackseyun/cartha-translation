  revision_rationale: A revisão conserva a equivalência provisória baseada no testemunho inglês, sem alegar uma decisão direta do copta. Ela corrige a grafia de nome próprio, preserva com exatidão a posição de uma restauração entre colchetes, mantém “Homem” como título e reduz paráfrases interpretativas. “Fundiram-se um com o outro” representa mais diretamente “merged with one another” do que a união genérica, sem determinar uma teoria sobre a natureza dessa fusão. A mudança de “onde” para “de onde” corresponde à relação locativa expressa por “where” no antecedente “terra do ar”.
