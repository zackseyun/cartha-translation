translation:
  language: pt
  text: '[] [...apareceu daquele] [lugar] a nuvem [da] grande Luz, o poder vivente, a mãe dos santos indestrutíveis, o grande poder, Mirotoe, e ela deu à luz aquele cujo nome pronuncio três vezes:


    IEN


    IEN


    EA


    EA


    EA,


    pois este é Adamas, a luz resplandecente, que se origina do Homem, o Homem Primordial, por meio de quem e para quem tudo veio a existir, e sem quem nada veio a existir. O Pai incognoscível, inapreensível, emanou e desceu do alto para anular a deficiência.


    Então o grande Logos[a], o Deus autogerado, e o Homem indestrutível, Adamas, uniram-se um ao outro. Um Logos de Homem veio a existir, mas o Homem veio a existir por um ato de fala. Ele ofereceu louvor:


    ao grande Espírito virginal, invisível e inapreensível,


    à virgem masculina,


    e à criança três vezes masculina,


    [] e à [virgem] masculina, Youel,


    e a Esephech, guardião do esplendor,


    à criança da criança,


    e à coroa de sua glória,


    ao grande éon Doxomedon[b],


    e aos tronos dentro dele,


    e aos poderes ao redor dele,


    às glórias,


    e às indestrutibilidades,


    e a toda a sua Plenitude[c], que mencionei anteriormente,


    e à terra do ar, a que recebe Deus,


    onde os homens santos da grande Luz recebem uma imagem,


    os homens do Pai do Silêncio vivente e silencioso,


    o Pai e toda a Plenitude deles, como mencionei anteriormente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Logos: termo grego que pode significar “palavra”, “discurso” ou “razão”; aqui funciona como título de uma realidade divina.'
    reason: O termo técnico possui amplitude semântica que uma única tradução portuguesa reduziria.
  - marker: b
    text: 'Éon: neste texto, uma realidade ou domínio celestial; Doxomedon é um nome próprio.'
    reason: Ajuda leitores comuns sem identificar o conceito com uma doutrina denominacional.
  - marker: c
    text: 'Plenitude: termo técnico para a totalidade ou esfera das realidades divinas mencionadas no texto.'
    reason: Esclarece o uso especializado sem resolver além da evidência disponível.
lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Mantém o termo técnico e sua amplitude sem reduzi-lo apenas a “Palavra” ou “Razão”; recebe nota explicativa.
- source_word: aeon
  choice: éon
  rationale: Transliteração já inteligível em português acadêmico-religioso, preservando o sentido cosmológico técnico.
- source_word: Fullness
  choice: Plenitude
  rationale: Preserva o provável termo técnico referente à totalidade divina, sem explicá-lo doutrinariamente.
- source_word: indestructible
  choice: indestrutível
  rationale: Reproduz de modo consistente a qualidade ontológica atribuída às figuras e entidades do texto.
- source_word: deficiency
  choice: deficiência
  rationale: Mantém a abstração e a possível carga cosmológica do original testemunhado, sem substituí-la por “pecado”, “mal” ou “imperfeição”.
- source_word: proceeded
  choice: emanou
  rationale: No contexto de emanações divinas, “emanou” expressa melhor o movimento ontológico sugerido, embora a revisão copta permaneça pendente.
- source_word: merged with one another
  choice: uniram-se um ao outro
  rationale: Português natural que preserva a união recíproca sem especificar fusão física ou perda de identidade.
- source_word: through an act of speech
  choice: por um ato de fala
  rationale: Mantém a distinção e a tensão entre Logos e fala criadora presentes no testemunho.
- source_word: male virgin
  choice: virgem masculina
  rationale: Preserva deliberadamente a formulação paradoxal, sem harmonizá-la.
- source_word: triple-male child
  choice: criança três vezes masculina
  rationale: Retém a estranheza e a estrutura tríplice da expressão, evitando uma interpretação não atestada.
- source_word: keeper of splendor
  choice: guardião do esplendor
  rationale: Correspondência direta, digna e natural.
- source_word: earth of the air
  choice: terra do ar
  rationale: Mantém a imagem cosmológica ambígua em vez de normalizá-la.
theological_decisions:
- issue: Relação de Adamas com o Homem Primordial
  choice: “que se origina do Homem, o Homem Primordial”
  alternative: “nascido do Homem primordial”
  rationale: Preserva a linguagem de origem/emanação sem impor geração biológica.
- issue: Mediação e finalidade da criação
  choice: “por meio de quem e para quem tudo veio a existir”
  alternative: “por quem tudo foi criado”
  rationale: Mantém tanto a agência quanto a finalidade expressas no testemunho, sem assimilar automaticamente a uma fórmula canônica.
- issue: Descida do Pai
  choice: “emanou e desceu do alto para anular a deficiência”
  alternative: “veio e desceu para eliminar a imperfeição”
  rationale: Conserva a linguagem cosmológica técnica e evita moralizar “deficiência”.
- issue: Autogeração divina
  choice: “o Deus autogerado”
  alternative: “o Deus que gerou a si mesmo”
  rationale: A forma compacta preserva o título técnico e não tenta resolver sua metafísica.
- issue: Gênero paradoxal das figuras celestes
  choice: “virgem masculina” e “criança três vezes masculina”
  alternative: expressões harmonizadas segundo gênero comum
  rationale: O paradoxo parece intencional e teologicamente significativo, por isso não deve ser suavizado.
- issue: Silêncio personificado
  choice: “o Silêncio vivente e silencioso”
  alternative: “a quietude viva e calada”
  rationale: A inicial maiúscula indica provável entidade ou princípio personificado, mantendo a tensão da repetição.
- issue: Referente final de “the Father”
  choice: 'mantido como sintagma separado: “o Pai e toda a Plenitude deles”'
  alternative: integrá-lo a “homens do Pai”
  rationale: A sintaxe do testemunho é difícil; a disposição preserva a ambiguidade em vez de resolvê-la conjecturalmente.
translation_notes:
  register: Tradução provisória em português moderno, digno e amplamente compreensível, baseada no testemunho inglês público fornecido; a revisão direta do copta continua pendente. Preservaram-se colchetes e reticências que indicam lacunas ou restaurações, bem como nomes e fórmulas vocálicas. O número de página manuscrita [10] foi omitido por interromper a frase. Maiúsculas foram usadas de modo seletivo em títulos e princípios personificados.
