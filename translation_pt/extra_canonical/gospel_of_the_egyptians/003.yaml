lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Mantém o termo técnico cosmológico sem reduzi-lo a “era” ou “eternidade”, sentidos que poderiam apagar sua função como entidade ou domínio neste texto.
- source_word: powers
  choice: potências
  rationale: “Potências” preserva o caráter de poderes personificados na cosmologia do escrito e é mais preciso aqui do que o genérico “poderes”.
- source_word: indestructibilities
  choice: incorruptibilidades
  rationale: Reproduz o substantivo abstrato plural e sua qualidade técnica; “seres indestrutíveis” acrescentaria uma identificação não explícita.
- source_word: Silence
  choice: Silêncio
  rationale: A inicial maiúscula sinaliza que o termo parece funcionar como realidade hipostasiada ou nome cosmológico.
- source_word: triple-male child
  choice: criança tríplice-masculina
  rationale: Preserva a expressão incomum e sua ambiguidade, sem a normalizar para uma formulação doutrinária mais familiar.
- source_word: undisclosable name
  choice: nome impossível de revelar
  rationale: Expressa de maneira natural a ideia de um nome que não pode ser divulgado, sem confundi-lo simplesmente com “desconhecido”.
- source_word: the All
  choice: o Todo
  rationale: Mantém o termo cosmológico abrangente e evita interpretá-lo como “todas as coisas” quando o testemunho usa uma designação substantivada.
- source_word: male virgin
  choice: virgem masculina
  rationale: Conserva o paradoxo deliberado do texto e não o resolve como referência a uma figura específica.
theological_decisions:
- issue: Relação entre Domedon Doxomedon, o éon e o Pai da grande Luz
  choice: Preservar a sintaxe de identificação parcialmente ambígua
  alternative: Reformular de modo inequívoco como três entidades distintas ou como uma única entidade
  rationale: O testemunho disponível permite mais de uma leitura das aposições; a tradução não deve impor uma ontologia mais definida que a fonte.
- issue: Gênero do referente de Doxomedon
  choice: Usar “dele” para acompanhar o nome e “éon”, mas conservar “dentro dele” onde o referente permanece ambíguo
  alternative: Uniformizar todas as referências como “nele” ou “nela” conforme uma interpretação cosmológica
  rationale: O português exige escolhas de gênero, porém a formulação procura não decidir se cada pronome retoma a pessoa nomeada ou o éon.
- issue: Vogais repetidas do mistério
  choice: Reproduzir exatamente as sequências e os sinais de restauração do testemunho
  alternative: Transliterar, vocalizar ou explicar as letras como nomes divinos
  rationale: Sua função ritual ou mística não é explicitada, e qualquer interpretação adicional seria especulativa.
- issue: Espírito e virgem masculina
  choice: Traduzir a coordenação literalmente, incluindo os marcadores de restauração
  alternative: Identificar a “virgem masculina” com o Espírito ou com outra figura específica
  rationale: A relação entre as figuras permanece teologicamente tensa e não deve ser resolvida silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia cosmológica técnica mantida onde necessária. Foram removidos os números nus de página do manuscrito, mas preservados os colchetes e as reticências que sinalizam restauração ou perda textual. A construção foi levemente pontuada para legibilidade, sem eliminar a fragmentação do testemunho.
