translation:
  language: pt
  text: 'Domedon Doxomedon veio em procissão, o éon dos éons, com o trono dentro dele, as potências [ao redor] dele, as glórias e as [incorruptibilidades. O] Pai da grande Luz, [que pro]cedeu do Silêncio, é [o grande] éon Doxomedon, no qual repousa a criança [tríplice-]masculina. O trono de sua [glória] foi erguido [dentro dele, aquele] em que seu nome impossível de revelar [está inscrito], sobre a tabuinha, [...] sendo um deles a fala, o [Pai da Luz] do Todo, aquele [que pro]cedeu do Silêncio enquanto repousa dentro do Silêncio, cujo nome [está] em um símbolo [invisível].[a]


    [Um] mistério oculto, [invisível], veio em procissão:


    I I I I I I I I I I I I I I I I I I I [I I I]


    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]


    [O] O O O O O O O O O O O O O O O O O O O O O


    U U [U U U] U U U U U U U U U U U U U U U U U


    E E E E E E E E E E E E E E E E E E E E E E


    A A A A A A A [A A A A] A A A A A A A A A A A.


    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō,


    E [assim] as três potências ofereceram louvor ao Espírito [grande], invisível, inominável, virginal e indizível, e à [sua] virgem masculina.[b]'
