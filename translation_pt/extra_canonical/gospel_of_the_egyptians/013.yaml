translation:
  language: pt
  text: 'IĒ IEUS ĒŌ OU ĒŌ ŌUA,


    ALĒTHŌS ALĒTHŌS,


    Ó Yesseus Mazareus Yessedekeus,


    ó água viva,


    ó filho do filho,


    ó nome glorioso,


    ALĒTHŌS ALĒTHŌS,


    o Ser eterno,


    I I I I


    ĒĒĒĒ


    EEEE


    OOOO


    UUUU


    ŌŌŌŌ


    AAAA{A},


    ALĒTHES ALĒTHŌS


    ĒI AAAA ŌŌŌŌ,


    ó Ser que contempla os éons,[a]


    ALĒTHES ALĒTHŌS,


    AEE


    ĒĒĒ


    I I I I


    UUUUUU


    ŌŌŌŌŌŌŌŌ,


    que é eternamente eterno,


    ALĒTHES ALĒTHŌS,


    IĒA AIŌ dentro do coração, aquele que existe,


    UAEI EISAEI EIOEI EIOSEI!


    Este teu grande nome habita dentro de mim,


    ó Perfeito autogerado.


    Tu, que não estás fora de mim,


    eu te contemplo,


    ó tu, que és invisível para todos,


    pois quem pode compreender-te em outra língua?


    [...][b] Porque te conheci,


    agora me uni ao imutável.


    Armei-me com a armadura de luz.


    Tornei-me Luz,


    porque a Mãe estava no Lugar para a excelente beleza da graça.


    Por isso, estendi as mãos que estavam cruzadas.


    Fui formado dentro do círculo da riqueza da luz,


    em meu regaço,


    que produz a forma dos muitos gerados pela luz,


    onde nenhuma acusação alcança.


    ALĒTHŌS,


    proclamarei a tua glória,


    porque te compreendi,


    SOU IĒS IDE AEIŌ AEIE OIS,


    ó Éon, Éon, ó Deus do Silêncio!


    Eu te honro plenamente.


    Tu és o meu lugar de repouso, ó Filho,


    ĒS ĒS O E,


    ó ser sem forma entre os seres sem forma,


    que ergues o Homem, dentro do qual me purificarás,


    para que eu entre em tua vida,


    segundo o teu nome indestrutível.


    Por isso, o incenso da vida habita dentro de mim.


    Misturei-o com água segundo o molde de todos os arcontes,[c]


    para que eu viva contigo no bem-estar dos santos,


    tu, que existes para sempre. [...][d]


    ALĒTHŌS ALĒTHŌS.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éons” pode designar eras, mundos ou entidades e domínios eternos na linguagem cosmológica deste texto.
    reason: Esclarece um termo técnico sem resolver sua ambiguidade.
  - marker: b
    text: Há uma lacuna ou sinal de perda textual neste ponto do testemunho fornecido.
    reason: Registra o estado incompleto da fonte sem conjectura.
  - marker: c
    text: “Arcontes” significa literalmente “governantes” e aqui provavelmente se refere a poderes cósmicos.
    reason: Auxilia o leitor moderno preservando o termo técnico.
  - marker: d
    text: Há outra lacuna ou sinal de perda textual neste ponto do testemunho fornecido.
    reason: Registra o estado incompleto da fonte sem reconstrução.
lexical_decisions:
- source_word: ALĒTHŌS / ALĒTHES
  choice: ALĒTHŌS / ALĒTHES
  rationale: As formas gregas distintas foram preservadas por funcionarem como fórmulas vocálicas ou litúrgicas; traduzi-las como “verdadeiramente” apagaria a diferença formal do testemunho.
- source_word: aeons
  choice: éons
  rationale: Mantém o termo cosmológico técnico e sua ambiguidade entre eras e entidades ou domínios transcendentais.
- source_word: self-generated
  choice: autogerado
  rationale: Reproduz de modo conciso o título técnico, sem substituí-lo por linguagem doutrinária posterior.
- source_word: archons
  choice: arcontes
  rationale: Conserva o termo técnico para poderes ou governantes cósmicos, evitando especificar sua natureza além do testemunho.
- source_word: grasp
  choice: compreender
  rationale: No contexto de língua e conhecimento, “compreender” é natural em português, embora o verbo também possa sugerir apreensão ou posse.
- source_word: light-begotten ones
  choice: gerados pela luz
  rationale: Preserva a relação de origem sem impor gênero nem cunhar uma forma excessivamente artificial.
theological_decisions:
- issue: Identidade do “Ser eterno” e do “Perfeito autogerado”
  choice: Manter os títulos sem identificação explicativa
  alternative: Identificá-los explicitamente com Deus, Cristo ou outra figura
  rationale: O hino acumula títulos e invocações sem esclarecer plenamente suas relações; a tradução preserva essa tensão.
- issue: “the Man”
  choice: o Homem, com maiúscula
  alternative: o ser humano / o homem
  rationale: A maiúscula sinaliza provável uso titular ou primordial sem definir uma antropologia específica.
- issue: “inside whom you will cleanse me”
  choice: dentro do qual me purificarás
  alternative: em quem me purificarás / e nele me purificarás
  rationale: Mantém a construção espacial e o antecedente masculino do testemunho, apesar de sua dificuldade sintática.
- issue: “Mother ... Place”
  choice: a Mãe ... o Lugar
  alternative: a mãe ... o lugar
  rationale: As maiúsculas preservam a provável função titular e cosmológica, sem acrescentar interpretação.
- issue: Lacunas manuscritas
  choice: Marcar como “[...]” com notas
  alternative: Omitir ou reconstruir o conteúdo
  rationale: Não há evidência suficiente no material fornecido para preencher as lacunas.
translation_notes:
  register: Português moderno, solene e litúrgico, com vocativos repetidos e disposição em versos. Sequências vocálicas, nomes sagrados, diacríticos, chaves e a distinção entre ALĒTHES e ALĒTHŌS foram mantidos. O número de página intrusivo “[15]” foi removido. Como a revisão direta do copta está pendente e o testemunho fornecido é uma versão inglesa de domínio público, esta redação deve ser considerada provisória; construções obscuras foram mantidas tanto quanto possível, sem harmonização doutrinária.
