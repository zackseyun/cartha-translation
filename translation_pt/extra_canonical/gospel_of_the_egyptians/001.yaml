  source_fidelity: 'A tradução preserva de modo muito próximo a estrutura litânica, os sinais de lacuna e restauração, os epítetos distintos e a ambiguidade cosmológica do testemunho inglês fornecido. A única correção segura é gráfica: o epíteto “the alien” está em minúsculas no testemunho e deve permanecer em minúsculas em português.'
  naturalness: O português é solene, legível e adequadamente literal para um texto fragmentário e formular. “Indestrutibilidades” é incomum, mas conserva prudentemente o abstrato plural do testemunho sem introduzir “seres”.
  terminology: “Plenitude”, “éon”, “Providência”, “Palavra”, “Verdade” e “ALĒTHŌS” mantêm bem os termos técnicos e as ambiguidades. A manutenção de “éon” com nota é especialmente apropriada.
  issues:
  - severity: low
    issue: Capitalização de “Estrangeiro”
    rationale: O testemunho apresenta “the alien” em minúsculas, diferentemente de “TRUTH”. “o estrangeiro” preserva essa diferenciação formal sem alterar o possível estatuto de epíteto.
  revised_text: "[] O livro [sagrado] do [. . .] grande [Espírito] invisível,\n\n\no Pai cujo nome não pode ser pronunciado,\n\nque se originou] das alturas da [Plenitude,\n\n a] Luz da Luz proveniente dos éons de Luz,\n\n a Luz do [Silêncio da] Providência\n\ne o Pai do Silêncio,\n\n a [Luz] da Palavra e da Verdade,\n\n a Luz das [] [indestrutibilidades,\n\n a] Luz infinita,\n\n[o] resplendor proveniente dos éons da Luz\n\ndo Pai que não pode ser revelado nem designado,\n\nque não envelhece nem pode ser declarado,\n\no éon dos éons,[a]\n\no autogerado, o autogerador, o autoprodutor,\n\no estrangeiro,\n\no éon,\n\nVERDADE, ALĒTHŌS.[b]"
