translation:
  language: pt
  text: '[] O livro [sagrado] do [. . .] grande [Espírito] invisível,


    o Pai cujo nome não pode ser pronunciado,

    que se originou] das alturas da [Plenitude,

    a] Luz da Luz proveniente dos éons de Luz,

    a Luz do [Silêncio da] Providência

    e o Pai do Silêncio,

    a [Luz] da Palavra e da Verdade,

    a Luz das [] [indestrutibilidades,

    a] Luz infinita,

    [o] resplendor proveniente dos éons da Luz

    do Pai que não pode ser revelado nem designado,

    que não envelhece nem pode ser declarado,

    o éon dos éons,[a]

    o autogerado, o autogerador, o autoprodutor,

    o Estrangeiro,

    o éon,

    VERDADE, ALĒTHŌS.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éon” translitera um termo que pode indicar uma era, uma realidade eterna ou uma entidade/domínio celeste neste tipo de literatura.
    reason: O termo tem amplitude semântica e função cosmológica que uma equivalência portuguesa única não preservaria.
  - marker: b
    text: ALĒTHŌS é uma forma grega transliterada, geralmente entendida como “verdadeiramente” ou “de fato”; foi preservada como aparece no testemunho.
    reason: A justaposição “VERDADE, ALĒTHŌS” pode envolver jogo verbal ou fórmula cuja função exata não deve ser normalizada sem exame direto do copta.
lexical_decisions:
- source_word: unseen Spirit
  choice: Espírito invisível
  rationale: “Invisível” é natural em português e preserva a afirmação de que o Espírito não é visto, sem ampliar o sentido para “desconhecido”.
- source_word: Fullness
  choice: Plenitude
  rationale: Mantém o valor técnico provável do termo no contexto cosmológico, com inicial maiúscula, sem inserir uma explicação doutrinária no texto.
- source_word: aeon(s)
  choice: éon(s)
  rationale: Emprega a transliteração já corrente em português para preservar a possível dimensão cosmológica e pessoal do termo, que “era” ou “eternidade” resolveria indevidamente.
- source_word: Speech
  choice: Palavra
  rationale: “Palavra” oferece leitura portuguesa natural e digna, abrangendo fala ou expressão, embora o testemunho inglês não permita determinar com segurança o termo copta subjacente.
- source_word: indestructibilities
  choice: indestrutibilidades
  rationale: Conserva o substantivo abstrato no plural, mesmo sendo incomum, porque “seres indestrutíveis” acrescentaria uma identificação não expressa no testemunho.
- source_word: the alien
  choice: o Estrangeiro
  rationale: Preserva o epíteto substantivado e sua alteridade, sem reduzi-lo a “estranho” no sentido meramente incomum.
- source_word: self-generated, self-generating, self-producing
  choice: o autogerado, o autogerador, o autoprodutor
  rationale: Mantém os três epítetos distintos e seu paralelismo, sem fundi-los numa única ideia.
- source_word: ALĒTHŌS
  choice: ALĒTHŌS
  rationale: Conserva a forma grega transliterada transmitida pelo testemunho, em vez de apagar sua função no encerramento.
theological_decisions:
- issue: Natureza dos éons
  choice: Manter “éon/éons” sem definir se designam períodos, domínios ou entidades.
  alternative: Traduzir como “era(s)”, “eternidade(s)” ou identificar como seres celestes.
  rationale: O trecho permite forte carga cosmológica, mas o testemunho inglês e a revisão ainda pendente do copta não justificam escolher uma única interpretação.
- issue: Personificação de Luz, Silêncio, Providência, Palavra, Verdade e Plenitude
  choice: Preservar as iniciais maiúsculas do testemunho sem acrescentar títulos ou explicações.
  alternative: Tratá-los explicitamente como pessoas divinas, emanações ou simples qualidades abstratas.
  rationale: A forma literária sugere termos técnicos ou personificados, mas não convém resolver sua condição ontológica no corpo da tradução.
- issue: Epíteto “o Estrangeiro”
  choice: Mantê-lo como epíteto definido e substantivado.
  alternative: Interpretá-lo como referência ao Deus transcendente, a uma figura salvífica específica ou apenas a alguém desconhecido.
  rationale: A tradução conserva a tensão de alteridade sem importar uma identificação doutrinária.
translation_notes:
  register: 'Português moderno, solene e legível, com paralelismo litânico preservado. Colchetes, espaços vazios e reticências reproduzem os sinais de dano e restauração do testemunho fornecido, inclusive colchetes aparentemente incompletos. Esta versão é necessariamente provisória: foi preparada a partir do testemunho inglês de domínio público, pois a revisão direta do copta dos códices de Nag Hammadi III,2 e IV,2 ainda está pendente.'
