  text: 'She received her completion and her power by the will and pleasure of the Father. Through this pleasure, he was pleased with the great, indestructible, unmoving race of the great and mighty men of the great Seth, so that he could sow it within the aeons that had been produced and, through her, fulfill the deficiency. For she descended from above into the world, being the image of the night. When she had come forth, she petitioned on behalf of the seed of the archon of this aeon and <the> authorities who originated from him—the polluted (seed) of the demon-begetting god who will be destroyed—and (she petitioned on behalf of) the seed [] of Adam and the great Seth, which resembles the sun.


    Then the great angel Hormos arrived to prepare the seed of the great Seth, by means of the virgins of the polluted sowing (with seed) of this aeon, within a sacred vessel begotten by the Logos through the holy Spirit.


    Then the great Seth arrived with his seed, and it was sown within the aeons that had been produced, their number agreeing with the numerical value of “Sodom.” Some say that Sodom is the place where the great Seth pastures, being Gomorrah. Others, however, say that the great Seth removed his planting from Gomorrah and transplanted it to a second place, which he named Sodom.


    This is the race that came forth through Edokla, because by speaking she gave birth to Truth and Justice, being the beginning of the seed of eternal life, which is for those who will persevere because of the knowledge of their emanation. This is the great, indestructible race that has come forth through three [] worlds into the world. The deluge occurred as a type of the consummation of the aeon, but it will be sent into the world because of this race.


    A conflagration will overtake the earth, and grace will be for those of the race (that came into being) through the prophets and the watchers who watch over the life of the race. Because of this race, famines and plagues will come, but these things will happen on account of the great, indestructible race. On account of this race, temptations will arrive, even a deceit of false prophets.


    Then the great Seth witnessed the work of the devil: his many disguises, his plots against the indestructible, unmoving race, the persecutions by his powers and his angels, and their error (by which) they acted against themselves.


    Then the great Seth offered praise to:


    the great, unnamable, virginal Spirit,

    and the male [] virgin Barbelon,

    and the triple-male child Telmael Telmael Heli Heli Machar Machar Seth,

    the living power, ALĒTHES ALĒTHŌS,

    and the male virgin Youel,

    and Esephech, keeper of splendor, the crown of his glory,

    and the great Doxomedon aeon,

    and the thrones within him,

    and the powers surrounding them,

    and the entire Fullness, as I mentioned previously,

    and he petitioned for watchers over his seed.'
translation:
  language: pt
  text: 'Ela recebeu sua plenitude e seu poder pela vontade e pelo beneplácito do Pai. Por esse beneplácito, ele se agradou da grande raça indestrutível e imóvel dos grandes e poderosos homens do grande Sete, para que pudesse semeá-la nos éons que haviam sido produzidos e, por meio dela, completar o que faltava. Pois ela desceu do alto até o mundo, sendo a imagem da noite. Quando veio à existência, intercedeu em favor da semente do arconte deste éon e <das> autoridades que dele se originaram — a (semente) impura do deus gerador de demônios, que será destruído — e (intercedeu em favor da) semente [...] de Adão e do grande Sete, que se assemelha ao sol.[a]


    Então o grande anjo Hormos chegou para preparar a semente do grande Sete, por meio das virgens da semeadura impura (com semente) deste éon, dentro de um vaso sagrado gerado pelo Logos por meio do Espírito Santo.[b]


    Então o grande Sete chegou com sua semente, e ela foi semeada nos éons que haviam sido produzidos, cujo número correspondia ao valor numérico de “Sodoma”. Alguns dizem que Sodoma é o lugar onde o grande Sete apascenta, isto é, Gomorra. Outros, porém, dizem que o grande Sete retirou de Gomorra o que havia plantado e o transplantou para um segundo lugar, ao qual deu o nome de Sodoma.[c]


    Esta é a raça que veio à existência por meio de Edokla, pois, ao falar, ela deu à luz a Verdade e a Justiça, sendo o princípio da semente da vida eterna, destinada aos que perseverarão por causa do conhecimento de sua emanação. Esta é a grande raça indestrutível que, através de três [...] mundos, veio ao mundo. O dilúvio ocorreu como figura da consumação do éon, mas será enviado ao mundo por causa dessa raça.[d]


    Um incêndio devastador alcançará a terra, e haverá graça para os membros da raça (que veio à existência) por meio dos profetas e dos vigilantes que velam pela vida da raça. Por causa dessa raça virão fomes e epidemias; essas coisas, porém, acontecerão por causa da grande raça indestrutível. Por causa dessa raça virão provações, inclusive o engano de falsos profetas.


    Então o grande Sete viu a obra do diabo: seus muitos disfarces, suas tramas contra a raça indestrutível e imóvel, as perseguições promovidas pelos poderes e anjos dele e o erro pelo qual agiram contra si mesmos.


    Então o grande Sete ofereceu louvor:


    Ao grande Espírito virginal e inominável;


    à virgem masculina [...] Barbelon;


    à criança três vezes masculina, Telmael Telmael Heli Heli Machar Machar Sete;


    ao poder vivente, ALĒTHES ALĒTHŌS;


    à virgem masculina Youel;


    a Esephech, guardião do esplendor, coroa da glória dele;


    ao grande éon Doxomedon;


    aos tronos que estão dentro dele;


    aos poderes que os cercam;


    e a toda a Plenitude, como mencionei anteriormente.


    E ele intercedeu para que houvesse vigilantes sobre sua semente.


    [a] Os colchetes assinalam uma lacuna no manuscrito; os sinais angulares indicam uma restauração editorial, e os parênteses preservam esclarecimentos ou incertezas do testemunho utilizado.


    [b] “Logos” pode significar “Palavra” ou “Razão”; o termo foi transliterado para preservar sua função técnica neste escrito.


    [c] A correspondência entre “Sodoma” e um número pressupõe o valor numérico das letras do nome.


    [d] O referente de “será enviado” não é claro no testemunho disponível; a ambiguidade foi preservada.'
