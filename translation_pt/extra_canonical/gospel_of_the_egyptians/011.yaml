  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido e preserva adequadamente a terminologia técnica (éon, arconte, Logos, emanação), as construções paradoxais de gênero e as ambiguidades assinaladas. Contudo, os dois lugares em que o testemunho traz lacunas vazias, "[]", foram convertidos em "[...]"; essa alteração introduz uma convenção gráfica não presente no texto-base e deve ser revertida. Além disso, "veio à existência" para "had proceeded forth" é mais interpretativo do que necessário; "saiu" preserva melhor o movimento de emergência do testemunho.
  naturalness: O português é moderno, legível e mantém um registro apropriado para um escrito religioso antigo. A sintaxe difícil foi em geral conservada sem se tornar ininteligível. "Sair" no contexto de "Quando ela saiu" é uma solução mais direta para a expressão de manifestação/processão do original de trabalho.
  terminology: As escolhas "plenitude", "éon", "raça", "arconte", "vigilantes", "Logos", "Plenitude" e "virgem masculina" são consistentes e não impõem uma interpretação doutrinária. "Incêndio devastador" comunica adequadamente "conflagration". Os nomes próprios e as fórmulas transliteradas foram mantidos.
  issues:
  - severity: low
    issue: As lacunas vazias "[]" foram representadas como "[...]" em dois pontos.
    rationale: O testemunho inglês marca "seed []" e "three [] worlds". Reticências entre colchetes podem sugerir uma extensão ou uma reconstrução editorial que o testemunho não especifica. Deve-se manter "[]".
  - severity: low
    issue: '"Quando veio à existência" intensifica "had proceeded forth".'
    rationale: A expressão do testemunho descreve saída ou procedência. "Quando ela saiu" conserva melhor essa formulação sem definir a natureza ontológica do evento.
