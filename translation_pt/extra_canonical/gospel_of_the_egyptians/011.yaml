lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Mantém o termo cosmológico técnico do escrito, sem reduzi-lo simplesmente a “era” ou “mundo”.
- source_word: race
  choice: raça
  rationale: Reproduz a designação coletiva e genealógico-cosmológica do testemunho; alternativas como “linhagem” poderiam suavizar indevidamente a terminologia recorrente.
- source_word: completion / Fullness
  choice: plenitude / Plenitude
  rationale: Distingue a condição recebida pela figura feminina do uso aparentemente técnico e personificado de “toda a Plenitude” no catálogo final.
- source_word: deficiency
  choice: o que faltava
  rationale: Forma natural em português que conserva a ideia de uma deficiência a ser completada, sem impor terminologia técnica não confirmada pelo copta.
- source_word: archon
  choice: arconte
  rationale: Preserva o título cosmológico técnico, comum na literatura gnóstica, em vez de generalizá-lo como “governante”.
- source_word: watchers
  choice: vigilantes
  rationale: Conserva a função de seres que vigiam e permite manter o jogo verbal com “velam”.
- source_word: Logos
  choice: Logos
  rationale: A transliteração preserva a polissemia entre Palavra e Razão e seu provável caráter técnico.
- source_word: conflagration
  choice: incêndio devastador
  rationale: Expressa em português corrente um fogo de grande alcance, sem acrescentar explicitamente uma doutrina de destruição universal.
- source_word: emanation
  choice: emanação
  rationale: Mantém o vocabulário cosmológico técnico e a possível referência à origem transcendente da raça.
theological_decisions:
- issue: Identidade do antecedente feminino no início
  choice: Manter apenas os pronomes femininos, sem nomear a personagem
  alternative: Identificá-la como Edokla, Barbelon ou outra entidade
  rationale: O trecho fornecido não explicita o antecedente; identificá-lo resolveria uma ambiguidade textual por interpretação.
- issue: Objeto da intercessão e sementes distintas
  choice: Preservar parênteses, lacuna e coordenação difícil
  alternative: Reestruturar o período para ensinar uma relação clara entre as sementes
  rationale: A sintaxe e o estado do testemunho são incertos, e uma harmonização poderia alterar a cosmologia do texto.
- issue: Espírito Santo
  choice: Usar “Espírito Santo”
  alternative: Usar “espírito santo”
  rationale: A expressão aparece como agente gerador em contexto hipostático; a capitalização é editorial e não pretende equiparar automaticamente seu sentido ao de uma formulação trinitária posterior.
- issue: Consumação do éon e referente de “será enviado”
  choice: Preservar “será enviado” sem fornecer sujeito explícito
  alternative: Identificar o sujeito como o dilúvio, a consumação ou outro evento
  rationale: O testemunho disponível deixa o referente obscuro; a nota informa a dificuldade sem encerrá-la.
- issue: “Virgem masculina” e “criança três vezes masculina”
  choice: Traduzir literalmente as combinações paradoxais
  alternative: Normalizar o gênero ou explicar essas figuras como andróginas
  rationale: O paradoxo de gênero integra a linguagem teológica do escrito e não deve ser silenciosamente resolvido.
- issue: Causa das calamidades
  choice: Repetir “por causa dessa raça”
  alternative: Reformular como perseguições dirigidas à raça ou castigos provocados por ela
  rationale: A relação causal é teologicamente tensa e potencialmente ambígua; a repetição preserva o testemunho sem explicação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. Termos cosmológicos especializados foram preservados quando a simplificação apagaria distinções do escrito. Esta versão é provisória, pois se baseia no testemunho público em inglês fornecido; a revisão direta do copta dos códices de Nag Hammadi III,2 e IV,2 ainda está pendente.
