translation:
  language: pt
  text: 'Então tudo estremeceu, e o tremor apoderou-se dos indestrutíveis.[a] Então os três filhos masculinos desceram do alto até os não gerados e autogerados, e até os que foram gerados naquilo que é gerado. A Grandeza manifestou-se, toda a Grandeza do grande Cristo.


    Ela ergueu incontáveis miríades de tronos gloriosos dentro dos quatro éons que os cercavam, incontáveis miríades de poderes, glórias, […] [b] e indestrutibilidades. E eles avançaram dessa maneira, e a igreja espiritual e indestrutível cresceu dentro das quatro luzes do grande Autogerado vivente, o Deus da verdade, que louvava, cantava e exaltava, a uma só voz e em perfeita união, com boca incessante:


    Ao Pai,


    à Mãe,


    e ao Filho,


    bem como a toda a Plenitude deles, conforme mencionei anteriormente.[c]


    Aos cinco selos que possuem as miríades,


    aos governantes dos éons


    e aos portadores da glória dos líderes


    foi ordenado que se manifestassem aos dignos.


    Amém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta do copta dos códices de Nag Hammadi III,2 e IV,2 ainda está pendente.
    reason: Informa com transparência a base textual limitada desta etapa editorial.
  - marker: b
    text: Há neste ponto uma lacuna ou trecho danificado no manuscrito, assinalado por […].
    reason: Preserva visivelmente a indicação de perda textual presente no testemunho.
  - marker: c
    text: “Anteriormente” é uma complementação editorial indicada no testemunho por sinais angulares.
    reason: Distingue do texto preservado a palavra fornecida editorialmente para completar o sentido.
lexical_decisions:
- source_word: indestructible ones / indestructibilities
  choice: indestrutíveis / indestrutibilidades
  rationale: Mantém a terminologia técnica e a repetição deliberada do testemunho, sem substituir por conceitos interpretativos como imortais ou incorruptíveis.
- source_word: unborn and self-begotten ones
  choice: não gerados e autogerados
  rationale: Preserva a distinção entre os que não foram gerados e os que geraram a si mesmos, usando linguagem compreensível e relativamente formal.
- source_word: Greatness
  choice: Grandeza
  rationale: Conserva o título personificado e sua repetição, com inicial maiúscula para indicar seu emprego como designação própria.
- source_word: aeons
  choice: éons
  rationale: Retém o termo cosmológico técnico do texto em vez de reduzi-lo a eras, mundos ou eternidades.
- source_word: self-generated one
  choice: Autogerado
  rationale: Trata a expressão como título da figura vivente mencionada, sem harmonizá-la com autogerados no plural.
- source_word: Fullness
  choice: Plenitude
  rationale: Preserva o sentido técnico provável do termo e sua personificação, evitando uma paráfrase doutrinária.
- source_word: archons
  choice: governantes
  rationale: Comunica a função da palavra em português corrente; a referência é mantida como governantes dos éons, sem especificar sua natureza moral.
- source_word: myriads
  choice: miríades
  rationale: Mantém a imagem de multidões incontáveis e o vocabulário solene do testemunho.
theological_decisions:
- issue: Relação entre Pai, Mãe, Filho e Plenitude
  choice: Manter os quatro elementos tal como enumerados no testemunho
  alternative: Reformular a enumeração segundo terminologia trinitária posterior
  rationale: A tradução não deve harmonizar a cosmologia própria da obra com formulações confessionais externas.
- issue: Identidade do sujeito que louva, canta e exalta
  choice: Conservar a construção relativa “que louvava, cantava e exaltava”
  alternative: Declarar explicitamente que a igreja ou Deus realiza essas ações
  rationale: O testemunho inglês permite incerteza sintática quanto ao antecedente; a redação portuguesa evita impor uma resolução além da evidência disponível.
- issue: Valor moral dos governantes dos éons
  choice: Traduzir de modo neutro como “governantes dos éons”
  alternative: Qualificá-los como poderes malignos ou celestiais
  rationale: O trecho não fornece base suficiente para acrescentar uma avaliação moral.
- issue: Destinatários dignos
  choice: “aos dignos”
  alternative: “aos merecedores” ou “aos eleitos”
  rationale: “Dignos” preserva o critério expresso sem introduzir uma doutrina de mérito ou eleição.
translation_notes:
  register: Português moderno, solene e legível, com terminologia cosmológica técnica preservada quando ela é significativa. Evitaram-se arcaísmos como “varões” e paráfrases confessionais. A estrutura hínica e as quebras da enumeração final foram mantidas.
