  yaml_path: translation/extra_canonical/didache/006/003.yaml
  text: And concerning food, bear what you are able; but be very careful about food sacrificed to idols, for it is the worship of dead gods.
translation:
  language: pt
  text: Quanto à alimentação, suporte o que puder; mas tenha muito cuidado com o alimento sacrificado aos ídolos, pois isso é culto a deuses mortos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώσεως
  choice: alimentação
  rationale: Expressa naturalmente o tema geral da comida ou do comer neste contexto, sem restringi-lo a um alimento específico.
- source_word: ὃ δύνασαι βάστασον
  choice: assuma o que puder
  rationale: Preserva a imagem de suportar ou tomar sobre si uma obrigação, mantendo aberta a relação com as orientações alimentares anteriores.
- source_word: εἰδωλοθύτου
  choice: alimento sacrificado aos ídolos
  rationale: Torna explícito em português o sentido do termo composto grego, que designa comida oferecida em sacrifício a ídolos.
- source_word: λίαν πρόσεχε
  choice: tenha muito cuidado
  rationale: Reproduz a intensidade de λίαν e a advertência de πρόσεχε em linguagem corrente e digna.
- source_word: λατρεία
  choice: culto
  rationale: Comunica serviço ou adoração religiosa de modo conciso e adequado ao contexto.
- source_word: θεῶν νεκρῶν
  choice: deuses mortos
  rationale: Mantém literalmente a caracterização polêmica e teologicamente carregada do original.
theological_decisions:
- issue: Natureza da advertência sobre o alimento sacrificado aos ídolos
  choice: tenha muito cuidado com
  alternative: abstenha-se de
  rationale: O grego ordena vigilância intensa, mas não formula explicitamente uma proibição absoluta; a tradução preserva essa tensão sem ampliá-la.
- issue: Referente de λατρεία
  choice: isso é culto a deuses mortos
  alternative: comê-lo é adorar deuses mortos
  rationale: Mantém o referente relativamente aberto, como no grego, sem declarar de forma mais explícita que o próprio ato de comer equivale necessariamente à adoração.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a concisão exortativa do grego e evita linguagem confessional específica.
