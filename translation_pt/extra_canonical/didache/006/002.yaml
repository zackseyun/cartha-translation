source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ μὲν γὰρ δύνασαι βαστάσαι ὅλον τὸν ζυγὸν τοῦ Κυρίου, τέλειος ἔσῃ· εἰ δʼ οὐ δύνασαι, ὃ δύνῃ τοῦτο ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/002.yaml
  text: For if you are able to bear the whole yoke of the Lord, you will be perfect; but if you are not able, do what you can.
translation:
  language: pt
  text: Pois, se você é capaz de carregar todo o jugo do Senhor, será perfeito; mas, se não é capaz, faça o que puder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάσαι
  choice: carregar
  rationale: Expressa de modo natural a ideia de suportar ou levar um jugo, preservando a metáfora do texto grego.
- source_word: ὅλον τὸν ζυγὸν τοῦ Κυρίου
  choice: todo o jugo do Senhor
  rationale: Mantém integralmente a metáfora e a relação genitiva do original, sem explicar além do que o texto diz.
- source_word: τέλειος
  choice: perfeito
  rationale: É o equivalente formal mais direto e preserva a possível amplitude de sentido entre perfeição, maturidade e completude.
- source_word: ὃ δύνῃ τοῦτο ποίει
  choice: faça o que puder
  rationale: Formulação idiomática em português que reproduz com clareza a ordem de fazer aquilo que está ao alcance da pessoa.
theological_decisions:
- issue: Sentido de «perfeito» e alcance do «jugo do Senhor»
  choice: Preservar os termos sem especificar em que consiste a perfeição nem identificar o jugo com um conjunto doutrinário particular.
  alternative: Traduzir τέλειος por «maduro» ou explicar o jugo como cumprimento integral de mandamentos específicos.
  rationale: O grego deixa essas expressões abertas no próprio versículo; uma explicitação resolveria indevidamente sua tensão teológica e ética.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por «você» para ampla legibilidade brasileira. A construção paralela «se você é capaz... se não é capaz» acompanha a estrutura grega, enquanto «faça o que puder» evita uma tradução rígida e pouco natural da expressão final.
