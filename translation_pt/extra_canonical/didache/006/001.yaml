id: DID.6.1
reference: Didache 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὅρα μή τις σε πλανήσῃ ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς, ἐπεὶ παρεκτὸς Θεοῦ σε διδάσκει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/001.yaml
  text: See that no one leads you astray from this way of the teaching, since he teaches you apart from God.
translation:
  language: pt
  text: Cuidado para que ninguém desvie você deste caminho do ensino, pois quem faz isso ensina você à parte de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅρα μή
  choice: Cuidado para que... não
  rationale: Reproduz a advertência enfática em português natural, sem enfraquecer a força do imperativo grego.
- source_word: πλανήσῃ
  choice: desvie
  rationale: No contexto de afastamento de um caminho, “desviar” preserva tanto a imagem da rota quanto a ideia de induzir ao erro.
- source_word: ταύτης τῆς ὁδοῦ τῆς διδαχῆς
  choice: deste caminho do ensino
  rationale: Mantém a construção e a metáfora centrais do grego, em formulação clara e digna.
- source_word: παρεκτὸς Θεοῦ
  choice: à parte de Deus
  rationale: Preserva a expressão relacional e sua tensão, sem especificar indevidamente se significa “sem Deus”, “fora da vontade de Deus” ou “longe de Deus”.
theological_decisions:
- issue: Sujeito implícito de διδάσκει
  choice: quem faz isso ensina você
  alternative: ele ensina você
  rationale: O grego passa de “ninguém” para um verbo singular cujo sujeito é a pessoa hipotética. A explicitação evita em português a referência pouco natural de “ele” após “ninguém”, sem identificar uma pessoa ou grupo específico.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. A formulação conserva a imagem do “caminho”, o caráter de advertência e a ambiguidade teológica de “à parte de Deus”.
