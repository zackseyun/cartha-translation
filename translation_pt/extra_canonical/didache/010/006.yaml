source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλθέτω χάρις καὶ παρελθέτω ὁ κόσμος οὗτος. Ὡσαννὰ τῷ υἱῷ Δαβίδ. Εἴ τις ἅγιός ἐστιν, ἐρχέσθω· εἴ τις οὐκ ἔστι, μετανοείτω· μαρανᾰθά. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/006.yaml
  text: 'Let grace come,

    and let this world pass away.

    Hosanna to the son of David.

    If anyone is holy, let him come;

    if anyone is not, let him repent.

    Maranatha. Amen.'
translation:
  language: pt
  text: 'Venha a graça,

    e passe este mundo.


    Hosana ao filho de Davi.


    Se alguém é santo, venha;

    se alguém não é, arrependa-se.


    Maranata.[a] Amém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão aramaica geralmente entendida como «Nosso Senhor, vem!». Também pode ser dividida e entendida como «Nosso Senhor veio».
    reason: Explica a expressão aramaica transliterada e preserva a ambiguidade histórica de sua divisão e interpretação.
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: Equivalente direto e natural, preservando a amplitude do termo grego sem especificar indevidamente se a referência é à graça divina ou a Cristo.
- source_word: παρελθέτω
  choice: passe
  rationale: Reproduz o imperativo aoristo e a ideia de este mundo passar ou desaparecer, em formulação portuguesa concisa.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: Mantém a aclamação litúrgica tradicional, amplamente reconhecida em português.
- source_word: ἅγιος
  choice: santo
  rationale: Preserva a linguagem cultual e moral do grego, sem reduzi-la a 'digno' ou 'puro'.
- source_word: μετανοείτω
  choice: arrependa-se
  rationale: Expressa naturalmente a convocação a uma mudança de mente e vida no contexto religioso.
- source_word: μαρανᾰθά
  choice: Maranata
  rationale: Mantém em transliteração a expressão aramaica preservada pelo texto grego e pela tradição cristã antiga.
theological_decisions:
- issue: Referente de 'graça' em 'Venha a graça'
  choice: Manter 'graça' sem explicitar um referente pessoal
  alternative: Traduzir ou interpretar como 'venha Cristo' ou 'venha o reino da graça'
  rationale: O substantivo χάρις aparece sem explicação no texto e pode carregar ressonâncias litúrgicas ou cristológicas; a tradução não deve resolver essa ambiguidade.
- issue: Sentido de 'santo' como condição para vir
  choice: Preservar literalmente 'Se alguém é santo, venha'
  alternative: Parafrasear como 'Se alguém está preparado/digno, aproxime-se'
  rationale: O contexto pode ser eucarístico, mas o texto não nomeia explicitamente a mesa ou a comunhão; conservar a formulação evita importar uma interpretação ritual específica.
- issue: Interpretação de 'Maranata'
  choice: Transliterar no corpo e explicar em nota
  alternative: Traduzir diretamente como 'Vem, Senhor!' ou 'Nosso Senhor veio'
  rationale: A divisão e a vocalização da expressão aramaica admitem mais de uma análise histórica; a transliteração preserva a forma recebida e a nota informa a leitura mais comum sem eliminar a alternativa.
translation_notes:
  register: Português moderno, digno e litúrgico, com frases breves que acompanham o paralelismo do grego. Emprega-se 'Filho de Davi' com inicial maiúscula por funcionar como título messiânico neste contexto, sem acrescentar identificação ausente do texto.
