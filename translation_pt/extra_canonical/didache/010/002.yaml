source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εὐχαριστοῦμέν σοι, Πάτερ ἅγιε, ὑπὲρ τοῦ ἁγίου ὀνόματός σου, οὗ κατεσκήνωσας ἐν ταῖς καρδίαις ἡμῶν, καὶ ὑπὲρ τῆς γνώσεως καὶ πίστεως καὶ ἀθανασίας, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/002.yaml
  text: 'We give thanks to you, Holy Father,

    for your holy name,

    which you caused to dwell in our hearts,

    and for the knowledge and faith and immortality

    which you made known to us through Jesus your servant;

    to you be the glory forever.'
translation:
  language: pt
  text: 'Nós te damos graças, Pai santo,


    por teu santo nome,


    que fizeste habitar em nossos corações,


    e pelo conhecimento, pela fé e pela imortalidade


    que nos deste a conhecer por meio de Jesus, teu servo;


    a ti seja a glória para sempre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστοῦμέν
  choice: damos graças
  rationale: Expressa de modo natural e fiel o sentido de agradecer, preservando o tom litúrgico da oração.
- source_word: κατεσκήνωσας
  choice: fizeste habitar
  rationale: Mantém a imagem de estabelecer morada sem recorrer ao menos corrente «tabernacular».
- source_word: γνώσεως
  choice: conhecimento
  rationale: Equivalente direto que preserva a amplitude do termo grego.
- source_word: ἀθανασίας
  choice: imortalidade
  rationale: Tradução formal e clara do substantivo grego.
- source_word: παιδός
  choice: servo
  rationale: No contexto cristão primitivo, παῖς pode significar «servo» ou «filho»; «servo» preserva a provável alusão à linguagem bíblica do servo de Deus e evita resolver o termo como filiação.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Formulação idiomática portuguesa para a expressão de duração indefinida ou eterna.
theological_decisions:
- issue: Sentido de παῖς aplicado a Jesus
  choice: servo
  alternative: filho
  rationale: O grego é lexicalmente ambíguo, mas «servo» é adequado ao uso judaico-cristão primitivo e coincide com a linguagem de oração da Didaquê. A alternativa «filho» poderia introduzir uma explicitação teológica que o termo não exige aqui.
- issue: Número de καρδίαις
  choice: nosso coração
  alternative: nossos corações
  rationale: Embora o grego use o plural, o singular coletivo é natural em português e apresenta a comunidade como uma unidade; «nossos corações» permanece uma tradução formal possível.
translation_notes:
  register: Português moderno, digno e litúrgico, com boa legibilidade brasileira e compreensão internacional. A disposição em linhas acompanha o caráter oracional e poético do trecho.
