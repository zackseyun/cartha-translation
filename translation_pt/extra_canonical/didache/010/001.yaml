  text: 'Mas, depois de ficarem satisfeitos, deem graças desta maneira:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Mas, depois de
  rationale: Mantém a transição marcada por δέ e a relação temporal introduzida por μετά, com formulação natural em português.
- source_word: τὸ ἐμπλησθῆναι
  choice: ficarem satisfeitos
  rationale: No contexto de uma refeição, o infinitivo aoristo passivo indica chegar à saciedade. A expressão evita a ambiguidade moderna de «serem cheios» e comunica naturalmente que os participantes terminaram de comer satisfeitos.
- source_word: οὕτως εὐχαριστήσατε
  choice: deem graças desta maneira
  rationale: Reproduz o imperativo plural e o valor de οὕτως como introdução à ação de graças que vem a seguir.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos na terceira pessoa do plural, de ampla legibilidade brasileira. Não se acrescentou nota, pois «ficarem satisfeitos» expressa diretamente o sentido contextual do grego sem perda relevante.
