source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Σὺ, δέσποτα παντοκράτορ, ἔκτισας τὰ πάντα ἕνεκεν τοῦ ὀνόματός σου, τροφήν τε καὶ ποτὸν ἔδωκας τοῖς ἀνθρώποις εἰς ἀπόλαυσιν ἵνα σοι εὐχαριστήσωσιν, ἡμῖν δὲ ἐχαρίσω πνευματικὴν τροφὴν καὶ ποτὸν καὶ ζωὴν αἰώνιον διὰ τοῦ παιδός σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/003.yaml
  text: 'You, almighty Master,

    created all things for the sake of your name,

    and gave food and drink to people for enjoyment,

    so that they might give thanks to you;

    but to us you graciously gave spiritual food and drink

    and eternal life through your servant.'
translation:
  language: pt
  text: 'Tu, Soberano Todo-Poderoso,


    criastes todas as coisas por causa do teu nome


    e deste aos seres humanos alimento e bebida para seu prazer,


    a fim de que te dessem graças;


    mas a nós nos concedeste graciosamente alimento e bebida espirituais


    e vida eterna por meio do teu servo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio do teu filho». O termo grego pode significar «servo» ou «filho»; neste contexto, «servo» provavelmente evoca o Servo de Deus.'
    reason: Registra a ambiguidade contextual relevante de παῖς sem impor uma resolução cristológica além do que o termo grego permite.
lexical_decisions:
- source_word: δέσποτα παντοκράτορ
  choice: Soberano Todo-Poderoso
  rationale: “Soberano” comunica a autoridade de δέσποτα com dignidade, sem a conotação moderna negativa de “déspota”; “Todo-Poderoso” traduz παντοκράτορ em forma consagrada e natural.
- source_word: ἕνεκεν τοῦ ὀνόματός σου
  choice: por causa do teu nome
  rationale: Mantém de perto a expressão grega e sua densidade teológica, sem especificar além do texto em que sentido a criação existe por causa do nome divino.
- source_word: τοῖς ἀνθρώποις
  choice: aos seres humanos
  rationale: Expressa o sentido genérico e inclusivo de ἀνθρώποις em português atual.
- source_word: εἰς ἀπόλαυσιν
  choice: para seu prazer
  rationale: Traduz a finalidade ligada ao desfrute agradável dos dons, com formulação clara e natural.
- source_word: ἐχαρίσω
  choice: concedeste, por tua graça
  rationale: Torna perceptível a nuance de dádiva graciosa do verbo χαρίζομαι, evitando reduzir a expressão a um simples “deste”.
- source_word: παιδός σου
  choice: teu servo
  rationale: παῖς pode significar “servo”, “filho” ou “criança”; neste contexto cristológico da Didaquê, “servo” preserva a linguagem bíblica do Servo de Deus e evita resolver o termo como “Filho”.
theological_decisions:
- issue: Sentido cristológico de παῖς
  choice: servo
  alternative: Filho
  rationale: O grego não emprega υἱός (“Filho”), mas παῖς. “Servo” preserva a provável ressonância do Servo de Deus e a ambiguidade lexical é registrada em nota.
- issue: Contraste entre dons comuns e dons concedidos “a nós”
  choice: manter explicitamente “mas a nós”
  alternative: suavizar como “e a nós”
  rationale: O δέ marca contraste entre alimento e bebida dados à humanidade em geral e os dons espirituais concedidos à comunidade; a tradução conserva essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “tu” de modo coerente com a oração direta e mantém a estrutura poética e o paralelismo do grego.
