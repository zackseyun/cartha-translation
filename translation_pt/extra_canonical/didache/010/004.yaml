lexical_decisions:
- source_word: Πρὸ πάντων
  choice: Antes de tudo
  rationale: Mantém de modo natural a ideia de prioridade expressa pelo grego, sem restringi-la necessariamente a uma sequência temporal.
- source_word: εὐχαριστοῦμέν σοι
  choice: nós te damos graças
  rationale: Reproduz diretamente a ação de agradecer a Deus e conserva a ênfase verbal da primeira pessoa do plural.
- source_word: δυνατός
  choice: poderoso
  rationale: Equivalente corrente e digno para a capacidade ou poder atribuído a Deus.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Expressa em português atual o valor idiomático da fórmula grega, literalmente relacionada aos séculos ou eras.
theological_decisions:
- issue: Sentido de Πρὸ πάντων
  choice: Antes de tudo
  alternative: Acima de tudo
  rationale: A escolha preserva mais de perto a forma do grego e sua possível noção de prioridade, sem impor exclusivamente o sentido de supremacia.
