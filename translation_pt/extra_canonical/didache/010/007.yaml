source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τοῖς δὲ προφήταις ἐπιτρέπετε εὐχαριστεῖν ὅσα θέλουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/007.yaml
  text: But permit the prophets to give thanks as they desire.
translation:
  language: pt
  text: Mas permitam que os profetas deem graças como quiserem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιτρέπετε
  choice: permitam
  rationale: Imperativo presente plural, expresso de modo direto e natural em português.
- source_word: εὐχαριστεῖν
  choice: deem graças
  rationale: No contexto da oração eucarística precedente, conserva o sentido de agradecer ou proferir ação de graças sem impor terminologia denominacional.
- source_word: ὅσα θέλουσιν
  choice: como quiserem
  rationale: Expressa idiomaticamente a liberdade concedida aos profetas quanto à extensão ou forma da ação de graças, preservando a abertura sem restringi-la apenas à quantidade.
theological_decisions:
- issue: Alcance da liberdade dada aos profetas
  choice: como quiserem
  alternative: quanto quiserem
  rationale: O grego ὅσα θέλουσιν pode sugerir tudo quanto desejarem e, no contexto, liberdade para se estenderem além da fórmula. A tradução escolhida preserva uma abrangência maior, sem decidir se a liberdade diz respeito somente à duração, ao conteúdo ou à forma.
translation_notes:
  register: Português moderno, claro e digno, com imperativo no plural de ampla legibilidade brasileira. A construção evita tanto linguagem excessivamente litúrgica quanto coloquialidade.
