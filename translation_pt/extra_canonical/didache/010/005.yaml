revisions:
- from: 'Lembra-te, Senhor, da tua igreja: livra-a de todo mal e aperfeiçoa-a no teu amor. Reúne-a dos quatro ventos — ela, que foi santificada[a] — no teu Reino, que preparaste para ela. Pois teu é o poder e a glória para sempre.'
  to: Lembra-te, Senhor, da tua igreja, para livrá-la de todo mal e aperfeiçoá-la no teu amor; e reúne-a dos quatro ventos, a que foi santificada[a] para o teu Reino, que preparaste para ela. Pois teu é o poder e a glória para sempre.
  rationale: A revisão restabelece a construção de finalidade dos dois infinitivos gregos e traduz εἰς de modo direcional. Conserva-se a ambiguidade sintática de «para o teu Reino» por meio de nota, sem introduzir interpretação doutrinária. «Que preparaste para ela» continua a leitura natural em que o Reino é preparado para a igreja.
