  timestamp: '2026-07-14T00:34:22Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução comunica bem a súplica pela igreja, a libertação de todo mal, seu aperfeiçoamento no amor divino, a reunião desde os quatro ventos e a doxologia. Contudo, os infinitivos gregos dependentes de «Lembra-te» (τοῦ ῥύσασθαι ... καὶ τελειῶσαι) exprimem finalidade e são mais precisamente vertidos por «para livrá-la ... e aperfeiçoá-la», não por novos imperativos. Além disso, εἰς pede normalmente «para», e não «no», embora sua ligação sintática com «santificada» ou «reúne-a» permaneça debatida.
  naturalness: A formulação revista mantém um registro orante, claro e natural em português contemporâneo. «A que foi santificada» retoma inequivocamente «igreja» sem a impressão pessoalizante de «a santificada», e evita a pausa explicativa que separava indevidamente o particípio de sua complementação possível.
  terminology: «Igreja», «mal», «amor», «quatro ventos», «Reino», «poder» e «glória» são adequados e consistentes com o registro bíblico-litúrgico. «Aperfeiçoá-la» preserva bem τελειῶσαι.
  issues:
  - severity: medium
    issue: Os pedidos de libertar e aperfeiçoar foram convertidos em imperativos coordenados.
    rationale: τῆς ἐκκλησίας σου τοῦ ῥύσασθαι ... καὶ τελειῶσαι depende de Μνήσθητι e expressa o propósito da lembrança/súplica. «Para livrá-la ... e aperfeiçoá-la» reproduz essa relação melhor do que «livra-a ... e aperfeiçoa-a».
  - severity: medium
    issue: «No teu Reino» enfraquece e altera a direção de εἰς τὴν σὴν Βασιλείαν.
    rationale: εἰς é direcional e deve ser traduzido por «para o teu Reino». A nota pode preservar a ambiguidade quanto a essa expressão qualificar «foi santificada» ou indicar o destino de «reúne-a».
  revised_text: Lembra-te, Senhor, da tua igreja, para livrá-la de todo mal e aperfeiçoá-la no teu amor; e reúne-a dos quatro ventos, a que foi santificada[a] para o teu Reino, que preparaste para ela. Pois teu é o poder e a glória para sempre.
