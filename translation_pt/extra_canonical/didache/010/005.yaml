id: DID.10.5
reference: Didache 10:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μνήσθητι, Κύριε, τῆς ἐκκλησίας σου τοῦ ῥύσασθαι αὐτὴν ἀπὸ παντὸς πονηροῦ καὶ τελειῶσαι αὐτὴν ἐν τῇ ἀγάπῃ σου, καὶ σύναξον αὐτὴν ἀπὸ τῶν τεσσάρων ἀνέμων, τὴν ἁγιασθεῖσαν εἰς τὴν σὴν Βασιλείαν, ἣν ἡτοίμασας αὐτῇ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/005.yaml
  text: Remember[a], Lord, your church, to deliver it from every evil and to perfect it in your love; and gather it from the four winds, the one sanctified for your kingdom, which you prepared for it. For yours is the power and the glory forever.
translation:
  language: pt
  text: Lembra-te, Senhor, da tua igreja, para livrá-la de todo mal e aperfeiçoá-la no teu amor; e reúne-a dos quatro ventos, a que foi santificada[a] para o teu Reino, que preparaste para ela. Pois teu é o poder e a glória para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra possibilidade: «e reúne-a dos quatro ventos para o teu Reino»; o grego permite ligar «para o teu Reino» ao particípio «foi santificada» ou ao verbo «reúne-a».'
    reason: A posição de εἰς τὴν σὴν Βασιλείαν admite as duas relações sintáticas. O texto principal conserva sua ligação mais próxima com «foi santificada», sem excluir em nota a leitura em que o Reino é o destino da reunião.
lexical_decisions:
- source_word: Μνήσθητι
  choice: Lembra-te
  rationale: Mantém a forma de súplica dirigida ao Senhor, natural em registro orante e digno.
- source_word: ῥύσασθαι
  choice: livra-a
  rationale: Expressa resgate ou libertação, não mera proteção passiva.
- source_word: τελειῶσαι
  choice: aperfeiçoa-a
  rationale: Preserva a ideia forte de levar à plenitude ou perfeição, sem reduzi-la a simples fortalecimento.
- source_word: ἀπὸ τῶν τεσσάρων ἀνέμων
  choice: dos quatro ventos
  rationale: Conserva a imagem tradicional dos quatro pontos do mundo.
- source_word: τὴν ἁγιασθεῖσαν
  choice: ela, que foi santificada
  rationale: O particípio feminino retoma a igreja e está na voz passiva; a explicitação pronominal evita que a expressão pareça referir-se a uma pessoa individual.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático português da fórmula de duração perpétua.
theological_decisions:
- issue: Relação de εἰς τὴν σὴν Βασιλείαν com o particípio e o verbo de reunião
  choice: “Reúne-a ... — ela, que foi santificada — no teu Reino”
  alternative: “Reúne-a ... a santificada para o teu Reino”
  rationale: A ordem e a pontuação adotadas entendem “no teu Reino” como destino da reunião, leitura sintaticamente natural, enquanto preservam em destaque a condição santificada da igreja. A nota registra a possível ligação da expressão com “santificada”.
- issue: Antecedente de ἣν em ἣν ἡτοίμασας αὐτῇ
  choice: “Reino, que preparaste para ela”
  alternative: “igreja ... que preparaste para o teu Reino”
  rationale: O relativo feminino pode concordar formalmente com “igreja” ou “Reino”, mas a proximidade de “Reino” e a construção “preparaste para ela” favorecem entender o Reino como aquilo que Deus preparou para a igreja.
translation_notes:
  register: Português moderno, amplo e litúrgico sem arcaísmo excessivo. Mantiveram-se “igreja”, “quatro ventos”, “Reino”, “poder” e “glória” por sua clareza e ressonância bíblica. Os dois-pontos após a invocação tornam naturais em português os infinitivos gregos dependentes de “lembra-te”, vertendo-os como pedidos no imperativo.
