id: DID.5.1
reference: Didache 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ δὲ τοῦ θανάτου ὁδός ἐστιν αὕτη· πρῶτον πάντων πονηρά ἐστι καὶ κατάρας μεστή· φόνοι, μοιχεῖαι, ἐπιθυμίαι, πορνεῖαι, κλοπαί, εἰδωλολατρεῖαι, μαγεῖαι, φαρμακεῖαι, ἁρπαγαί, ψευδομαρτυρίαι, ὑποκρίσεις, διπλοκαρδία, δόλος, ὑπερηφανία, κακία, αὐθάδεια, πλεονεξία, αἰσχρολογία, ζηλοτυπία, θρασύτης, ὕψος, ἀλαζονεία·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/001.yaml
  text: 'But the way of death is this: first of all, it is evil and full of a curse: murders, adulteries, lusts, sexual immoralities, thefts, idolatries, sorceries, magic arts, robberies, false testimonies, hypocrisies, double-heartedness, deceit, arrogance, malice, self-will, greed, foul speech, jealousy, audacity, haughtiness, boastfulness;'
translation:
  language: pt
  text: 'Mas o caminho da morte é este: antes de tudo, é mau e cheio de maldição[a]: assassinatos, adultérios, desejos, imoralidades sexuais, furtos, atos de idolatria, práticas mágicas, feitiçarias, roubos, falsos testemunhos, hipocrisias, duplicidade de coração, engano, orgulho, maldade, obstinação, ganância, linguagem obscena, ciúme, atrevimento, altivez e vanglória;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cheio de uma maldição”.'
    reason: Registra a possibilidade de explicitar em português o substantivo grego singular com artigo indefinido.
lexical_decisions:
- source_word: κατάρας
  choice: maldição
  rationale: Conserva o substantivo singular e permite uma formulação natural em português; a ausência do artigo não elimina o valor singular do grego.
- source_word: ἐπιθυμίαι
  choice: desejos
  rationale: Mantém a amplitude do termo grego no contexto de uma lista de vícios, sem acrescentar um qualificativo sexual ou moral que não está expresso no substantivo.
- source_word: πορνεῖαι
  choice: imoralidades sexuais
  rationale: Expressa de modo atual e abrangente as condutas sexuais ilícitas indicadas pelo termo, preservando seu plural.
- source_word: μαγεῖαι, φαρμακεῖαι
  choice: práticas mágicas, feitiçarias
  rationale: 'Mantém distintos os dois termos gregos correlatos: o primeiro designa práticas mágicas em geral; o segundo, feitiçarias ou artes ocultas, sem restringi-lo anacronicamente a medicamentos.'
- source_word: διπλοκαρδία
  choice: duplicidade de coração
  rationale: Reproduz a imagem antropológica do composto grego e comunica divisão interior ou falta de sinceridade.
- source_word: αὐθάδεια
  choice: obstinação
  rationale: Representa a atitude de quem insiste na própria vontade, distinguindo-a dos termos próximos para orgulho e altivez presentes na lista.
- source_word: αἰσχρολογία
  choice: linguagem obscena
  rationale: Comunica fala vergonhosa ou indecente em linguagem moderna e clara.
- source_word: θρασύτης
  choice: atrevimento
  rationale: Transmite a ousadia imprudente ou insolente do termo sem confundi-la com coragem virtuosa.
- source_word: ὕψος, ἀλαζονεία
  choice: altivez e vanglória
  rationale: 'Preserva dois vícios distintos no encerramento da lista: elevação arrogante e ostentação pretensiosa.'
theological_decisions:
- issue: Sentido de κατάρας μεστή
  choice: cheio de maldição
  alternative: cheio de uma maldição
  rationale: A tradução principal soa idiomática em português e conserva o singular; a alternativa explicita o artigo indefinido possível, sem decidir se a expressão descreve uma maldição específica.
- issue: Possível associação de φαρμακεῖαι a drogas ou venenos
  choice: feitiçarias
  alternative: uso de poções ou venenos
  rationale: No contexto da lista, o campo ocultista é o sentido mais provável, mas não se introduz no texto uma acusação específica relativa a medicamentos, drogas ou envenenamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração conserva o ritmo incisivo do original e distingue, sempre que possível, os termos gregos semanticamente próximos.
