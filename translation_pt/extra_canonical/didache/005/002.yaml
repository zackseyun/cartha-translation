review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto a enumeração grega e preserva adequadamente o sentido compassivo de οὐ πονοῦντες ἐπὶ καταπονουμένῳ em «não se condoem do oprimido». Contudo, «pecam em tudo» transforma o adjetivo substantivado πανθαμάρτητοι em uma afirmação verbal um pouco diferente e menos categórica. Além disso, «defendem os ricos, julgam os pobres sem respeitar a lei» explicita a função judicial de modo assimétrico e enfraquece a oposição nominal concisa de πλουσίων παράκλητοι, πενήτων ἄνομοι κριταί.
  naturalness: O português é claro, atual e de registro apropriado. «Perseguem os bons» é mais direto e natural do que «perseguidores dos que são bons», sem sacrificar o provável referente pessoal. A sequência nominal «advogados dos ricos, juízes injustos dos pobres» reproduz de modo legível o paralelismo do original.
  terminology: «Mansidão», «paciência», «recompensa da justiça», «retribuição», «misericórdia», «oprimido» e «necessitado» são escolhas adequadas. «Juízo justo» mantém o campo semântico de κρίσις e soa mais conciso que «um julgamento justo». «Inteiramente pecadores» conserva o caráter abrangente de πανθαμάρτητοι sem impor uma interpretação adicional.
  issues:
  - severity: medium
    issue: «pecam em tudo» para πανθαμάρτητοι
    rationale: πανθαμάρτητοι caracteriza as pessoas como completamente/inteiramente pecadoras; não é simplesmente um verbo que afirma que elas cometem pecado em cada ato ou circunstância.
  - severity: low
    issue: «defendem os ricos, julgam os pobres sem respeitar a lei» para πλουσίων παράκλητοι, πενήτων ἄνομοι κριταί
    rationale: A redação é compreensível, mas troca dois predicados nominais paralelos por verbos e torna «sem respeitar a lei» uma explicação mais longa de ἄνομοι. «Advogados dos ricos, juízes injustos dos pobres» preserva melhor a concisão e o contraste.
  - severity: low
    issue: «perseguidores dos que são bons»
    rationale: A formulação é possível, mas «perseguem os bons» é mais idiomática em português atual e mantém a referência pessoal que o contexto torna provável.
