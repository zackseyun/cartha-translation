language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: διῶκται ἀγαθῶν, μισοῦντες ἀλήθειαν, ἀγαπῶντες ψεῦδος, οὐ γινώσκοντες μισθὸν δικαιοσύνης, οὐ κολλώμενοι ἀγαθῷ οὐδὲ κρίσει δικαίᾳ, ἀγρυπνοῦντες οὐκ εἰς τὸ ἀγαθὸν, ἀλλ’ εἰς τὸ πονηρόν· ὧν μακρὰν πραΰτης καὶ ὑπομονή, μάταια ἀγαπῶντες, διώκοντες ἀνταπόδομα, οὐκ ἐλεοῦντες πτωχόν, οὐ πονοῦντες ἐπὶ καταπονουμένῳ, οὐ γινώσκοντες τὸν ποιήσαντα αὐτούς, φονεῖς τέκνων, φθορεῖς πλάσματος Θεοῦ, ἀποστρεφόμενοι τὸν δεόμενον, καταπονοῦντες τὸν θλιβόμενον, πλουσίων παράκλητοι, πενήτων ἄνομοι κριταί, πανθαμάρτητοι· ῥυσθείητε, τέκνα, ἀπὸ τούτων ἁπάντων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/002.yaml
  text: persecutors of the good[a], hating truth, loving falsehood, not knowing the reward of righteousness, not clinging to what is good nor to righteous judgment, keeping watch not for what is good but for what is evil; from whom gentleness and patience are far, loving vain things, pursuing repayment, not showing mercy to the poor, not feeling distress for one who is oppressed, not knowing the one who made them, murderers of children, destroyers of God's handiwork, turning away from the one in need, oppressing the one under affliction, advocates of the rich, lawless judges of the poor, altogether sinful. Be delivered, children, from all these things.
translation:
  language: pt
  text: perseguem os bons, odeiam a verdade, amam a falsidade, não conhecem a recompensa da justiça, não se apegam ao bem nem ao juízo justo, mantêm-se vigilantes não para o bem, mas para o mal; deles estão longe a mansidão e a paciência; amam coisas vãs, correm atrás de retribuição, não têm misericórdia do pobre, não se condoem do oprimido[a], não conhecem aquele que os fez, são assassinos de crianças, destruidores do que Deus formou, dão as costas ao necessitado, oprimem o aflito, advogados dos ricos, juízes injustos dos pobres, inteiramente pecadores. Que vocês sejam livrados, filhos, de todas essas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não trabalham em favor do oprimido».'
    reason: Embora o contexto e a construção com ἐπί favoreçam o sentido de sentir pesar ou compaixão, πονέω também pode significar trabalhar ou empenhar-se; a alternativa registra essa possibilidade lexical.
lexical_decisions:
- source_word: διῶκται ἀγαθῶν
  choice: perseguidores dos que são bons
  rationale: O genitivo plural ἀγαθῶν pode ser formalmente masculino ou neutro; neste contexto, com διῶκται, a referência a pessoas boas é natural, e a formulação evita o pouco idiomático «perseguidores dos bons».
- source_word: ἀγρυπνοῦντες
  choice: mantendo-se vigilantes
  rationale: Expressa a ideia de permanecer desperto e atento, sem exigir a imagem literal de passar a noite acordado.
- source_word: ἀνταπόδομα
  choice: retribuição
  rationale: Preserva a amplitude de uma paga ou contrapartida buscada, sem especificar indevidamente se se trata de recompensa ou retaliação.
- source_word: οὐ πονοῦντες ἐπὶ καταπονουμένῳ
  choice: não se condoem do oprimido
  rationale: Com ἐπί e dativo neste contexto, πονέω indica sentir pesar ou aflição pela situação de alguém, em paralelo com a falta de misericórdia mencionada antes.
- source_word: φθορεῖς πλάσματος Θεοῦ
  choice: destruidores do que Deus formou
  rationale: πλάσμα designa aquilo que foi moldado ou formado; a tradução mantém a imagem de Deus como formador sem restringir indevidamente o referente.
- source_word: πλουσίων παράκλητοι
  choice: defendem os ricos
  rationale: παράκλητοι indica os que tomam o partido dos ricos ou atuam como seus defensores; o verbo torna a expressão clara em português atual.
- source_word: πανθαμάρτητοι
  choice: pecam em tudo
  rationale: O termo raro caracteriza essas pessoas como inteiramente pecadoras ou culpadas em todos os aspectos; a forma verbal é natural e conserva a abrangência.
theological_decisions:
- issue: «assassinos de crianças» e «destruidores do que Deus formou»
  choice: manter as duas acusações em linguagem direta, sem identificar uma prática histórica específica
  alternative: explicitar uma referência a aborto, infanticídio ou outra prática determinada
  rationale: O texto grego é severo, mas não nomeia aqui uma prática específica; explicitá-la importaria uma interpretação além da formulação da fonte.
- issue: μισθὸν δικαιοσύνης
  choice: recompensa da justiça
  alternative: recompensa pela retidão
  rationale: O genitivo permite mais de uma relação semântica; a formulação escolhida preserva a tensão entre justiça como qualidade, conduta e fundamento da recompensa.
- issue: ῥυσθείητε
  choice: Que vocês sejam livrados
  alternative: Livrem-se
  rationale: A forma passiva optativa expressa desejo ou exortação em tom de oração; manter o passivo evita transformar a libertação em ação exclusivamente própria dos destinatários.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A longa série acusatória do grego foi preservada, mas recebeu verbos finitos em pontos estratégicos para evitar uma enumeração artificial ou obscura. O vocativo «filhos» foi mantido sem acrescentar «meus», ausente do texto grego.
