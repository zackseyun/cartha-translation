  to: perseguem os bons, odeiam a verdade, amam a falsidade, não conhecem a recompensa da justiça, não se apegam ao bem nem ao juízo justo, mantêm-se vigilantes não para o bem, mas para o mal; deles estão longe a mansidão e a paciência; amam coisas vãs, correm atrás de retribuição, não têm misericórdia do pobre, não se condoem do oprimido[a], não conhecem aquele que os fez, são assassinos de crianças, destruidores do que Deus formou, dão as costas ao necessitado, oprimem o aflito, advogados dos ricos, juízes injustos dos pobres, inteiramente pecadores. Que vocês sejam livrados, filhos, de todas essas coisas.
