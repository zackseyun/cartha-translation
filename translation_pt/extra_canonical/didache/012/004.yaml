revisions:
- from: Mas, se ele não tiver ofício, providenciem, conforme o discernimento de vocês, um modo de esse cristão viver entre vocês sem ficar ocioso.[a]
  to: Mas, se ele não tiver ofício, providenciem, conforme o discernimento de vocês, uma maneira de um cristão viver entre vocês sem ficar ocioso.[a]
  rationale: A revisão elimina o demonstrativo que estreitava uma ambiguidade sintática real do grego e melhora a fluência da construção portuguesa, sem alterar a instrução prática nem os termos fundamentais do versículo. A nota conserva explicitamente a leitura individual/predicativa favorecida pelo contexto.
