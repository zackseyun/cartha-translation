review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a condição («se ele não tiver ofício»), a orientação para que a comunidade tome providências segundo seu discernimento e a finalidade de evitar uma vida ociosa. «Ofício», «discernimento», «providenciem» e «ocioso» são escolhas fiéis e adequadas. Contudo, «esse cristão» explicita com demonstrativo uma referência individual que o grego deixa sintaticamente menos definida; convém preservar melhor a ambiguidade de χριστιανός no texto principal.
  naturalness: «Providenciem ... um modo de esse cristão viver» é compreensível, mas a sequência «de esse» é algo pesada no português moderno. «Uma maneira de um cristão viver» é mais fluente e mantém a construção necessária após «providenciem».
  terminology: 'A terminologia principal é apropriada: τέχνη é bem vertido por «ofício» neste contexto, σύνεσις por «discernimento», e ἀργός por «ocioso». «Cristão» mantém o termo do original sem interpretação confessional adicional.'
  issues:
  - severity: low
    issue: O demonstrativo «esse» restringe no texto principal a ambiguidade de χριστιανός.
    rationale: No grego, χριστιανός pode ser lido como sujeito genérico ou em relação predicativa ao indivíduo previamente mencionado. Embora o contexto favoreça o viajante específico, o demonstrativo torna essa leitura mais explícita do que o original.
  - severity: low
    issue: A construção «um modo de esse cristão viver» é levemente pouco idiomática.
    rationale: Após «modo de», a sequência com demonstrativo soa mais pesada. A reformulação proposta é natural em português internacional e preserva o sentido.
  revised_text: Mas, se ele não tiver ofício, providenciem, conforme o discernimento de vocês, uma maneira de um cristão viver entre vocês sem ficar ocioso.[a]
