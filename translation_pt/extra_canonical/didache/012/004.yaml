source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: εἰ δὲ οὐκ ἔχει τέχνην, κατὰ τὴν σύνεσιν ὑμῶν προνοήσατε, πῶς μὴ ἀργὸς μεθ᾽ ὑμῶν ζήσεται χριστιανός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/004.yaml
  text: But if he has no trade[a], according to your understanding make provision for how a Christian may live among you without being idle.
translation:
  language: pt
  text: Mas, se ele não tiver ofício, providenciem, conforme o discernimento de vocês, uma maneira de um cristão viver entre vocês sem ficar ocioso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma maneira de ele viver entre vocês como cristão, sem ficar ocioso”. O grego também pode ser entendido de modo mais geral, como no texto principal.'
    reason: Preserva a ambiguidade sintática de χριστιανός, que pode referir-se à pessoa mencionada anteriormente e funcionar em sentido predicativo, ou ser lido como sujeito genérico.
lexical_decisions:
- source_word: τέχνην
  choice: ofício
  rationale: No contexto, refere-se a uma ocupação ou habilidade prática pela qual a pessoa pode trabalhar e se sustentar; “ofício” é natural e mantém essa amplitude.
- source_word: σύνεσιν
  choice: discernimento
  rationale: Expressa compreensão e juízo prático da comunidade, sem limitar o sentido a mero conhecimento intelectual.
- source_word: προνοήσατε
  choice: providenciem
  rationale: O imperativo pede que a comunidade tome medidas concretas e cuidadosas, não apenas que reflita sobre a situação.
- source_word: ἀργός
  choice: ocioso
  rationale: Indica alguém sem trabalhar ou inativo; “ocioso” preserva a relação direta com a exigência contextual de não viver às custas da comunidade.
theological_decisions:
- issue: Função sintática de χριστιανός
  choice: “esse cristão”, retomando a pessoa acolhida no contexto
  alternative: “viver entre vocês como cristão” ou, de modo genérico, “um cristão viver entre vocês”
  rationale: A ordem grega permite entender χριστιανός como sujeito ou como predicativo. O contexto imediato favorece a referência ao indivíduo já mencionado, mas a nota preserva a ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. “Providenciem” comunica ação comunitária concreta; a construção “um modo de” torna natural em português a sequência grega προνοήσατε πῶς.
