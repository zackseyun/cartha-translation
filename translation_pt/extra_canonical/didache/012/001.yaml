source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου δεχξήσθω, ἔπειτα δὲ δοκιμάσαντες αὐτὸν γνώσεσθε· σύνεσιν γὰρ ἕξετε δεξιὰν καὶ ἀριστεράν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/001.yaml
  text: But let everyone who comes in the name of the Lord be received; then, after testing him, you will know, for you will have understanding of right and left.
translation:
  language: pt
  text: Mas todo aquele que vier em nome do Senhor seja recebido. Depois de o porem à prova, vocês saberão[a], pois terão discernimento quanto à direita e à esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês o conhecerão”.'
    reason: Registra a possibilidade contextual de suprir um objeto para γνώσεσθε, embora o verbo grego esteja sem objeto expresso.
lexical_decisions:
- source_word: δεχξήσθω (isto é, δεχθήσθω)
  choice: seja acolhido
  rationale: O imperativo passivo pede que o visitante seja recebido; “acolhido” comunica hospitalidade com naturalidade, sem acrescentar aprovação irrestrita.
- source_word: δοκιμάσαντες
  choice: tendo-o posto à prova
  rationale: Expressa exame ou verificação após a acolhida, preservando a ideia de avaliar a autenticidade ou o caráter do visitante.
- source_word: γνώσεσθε
  choice: vocês saberão
  rationale: O verbo está sem objeto expresso; a formulação mantém essa construção absoluta e evita transformar αὐτόν, objeto de δοκιμάσαντες, em objeto de γνώσεσθε.
- source_word: σύνεσιν ... δεξιὰν καὶ ἀριστεράν
  choice: discernimento entre a direita e a esquerda
  rationale: Mantém a imagem compacta do grego e seu sentido de capacidade para distinguir, sem explicar de modo excessivo o que “direita” e “esquerda” representam.
theological_decisions:
- issue: Acolhimento em nome do Senhor e exame posterior
  choice: 'Preservar a sequência: acolher primeiro e depois pôr à prova'
  alternative: Fazer o exame antes de acolher ou entender a acolhida como aprovação definitiva
  rationale: A ordem sintática do texto distingue hospitalidade inicial de discernimento posterior, mantendo a tensão entre abertura e prudência.
- issue: Objeto implícito de γνώσεσθε
  choice: “vocês saberão”, sem objeto expresso
  alternative: “vocês o conhecerão”
  rationale: O grego deixa γνώσεσθε absoluto; não se deve resolver silenciosamente se o resultado é conhecer a pessoa, seu caráter ou a verdade da situação.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “vocês” para o plural. A expressão figurada “entre a direita e a esquerda” foi preservada em vez de ser substituída por uma interpretação moral ou doutrinária específica.
