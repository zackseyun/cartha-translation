source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰμὲν παρόδιος ἐστιν ὁ ἐρχόμενος, βοηθεῖτε αὐτῷ ὅσον δύνασθε· οὐ μενεῖ δὲ πρὸς ὑμᾶς εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/002.yaml
  text: If the one who comes is a traveler[a], help him as much as you can; but he shall not remain with you except for two or three days, if there is a need.
translation:
  language: pt
  text: Se aquele que chega está de passagem, ajudem-no tanto quanto puderem; mas ele não ficará com vocês, a não ser por dois ou três dias, se houver necessidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρόδιος
  choice: está de passagem
  rationale: Expressa naturalmente a ideia de alguém em trânsito, sem sugerir que seja um hóspede permanente ou um membro estabelecido da comunidade.
- source_word: βοηθεῖτε
  choice: ajudem-no
  rationale: Mantém o imperativo plural dirigido à comunidade em linguagem portuguesa corrente.
- source_word: ὅσον δύνασθε
  choice: tanto quanto puderem
  rationale: Preserva a extensão da ajuda segundo a capacidade dos destinatários.
- source_word: οὐ μενεῖ ... εἰ μὴ
  choice: não ficará ... a não ser por
  rationale: Representa a construção exceptiva e evita sugerir que a necessidade permita ultrapassar o limite indicado.
- source_word: ἐὰν ᾖ ἀνάγκη
  choice: se houver necessidade
  rationale: Mantém a condição ligada à permanência de dois ou três dias, sem especificar de quem é a necessidade.
theological_decisions:
- issue: Limite da hospitalidade ao viajante
  choice: A necessidade permite a permanência por dois ou três dias, não além desse período.
  alternative: A necessidade poderia permitir ficar mais de dois ou três dias.
  rationale: A sequência grega οὐ μενεῖ ... εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη apresenta os dois ou três dias como a exceção permitida, condicionada pela necessidade.
translation_notes:
  register: 'Português moderno, digno e acessível, com plural brasileiro «vocês». A ordem e o contraste do grego são preservados: «Se...» na primeira oração e «mas...» na segunda.'
