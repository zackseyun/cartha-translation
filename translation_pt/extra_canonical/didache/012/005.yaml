source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ δ᾽ οὐ θέλει οὕτω ποιεῖν, χριστέμπορός ἐστι· προσέχετε ἀπὸ τῶν τοιούτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/005.yaml
  text: But if he is not willing to do so, he is a Messiah-trader; beware of such people.
translation:
  language: pt
  text: Mas, se ele não quiser agir assim, é um mercador do Messias; tenham cuidado com pessoas desse tipo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χριστέμπορος
  choice: mercador do Messias
  rationale: O raro composto pejorativo combina χριστός, entendido como “Messias”, com ἔμπορος, “mercador/comerciante”, e denuncia quem transforma sua ligação com o Messias em meio de proveito. “Mercador do Messias” preserva a imagem contundente e segue a política lexical indicada para χριστός.
- source_word: προσέχετε ἀπό
  choice: tenham cuidado com
  rationale: A construção exprime vigilância e cautela diante de certas pessoas. A formulação é natural em português atual, mantém o tom de advertência e evita sugerir necessariamente uma separação absoluta.
- source_word: τῶν τοιούτων
  choice: pessoas desse tipo
  rationale: O adjetivo substantivado plural refere-se a indivíduos caracterizados pela conduta mencionada; explicitar “pessoas” produz português claro sem acrescentar conteúdo.
theological_decisions:
- issue: Sentido da acusação χριστέμπορος
  choice: Preservar a metáfora como “mercador do Messias”
  alternative: “explorador da fé” ou “alguém que negocia com o nome de Cristo”
  rationale: 'As alternativas explicariam ou interpretariam demais o neologismo grego. A tradução escolhida conserva sua força retórica e deixa aberta a extensão precisa da acusação: comerciar, lucrar ou tirar proveito de sua associação com o Messias.'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. O plural “tenham” representa a exortação comunitária do grego προσέχετε. Não são necessárias notas de rodapé.
