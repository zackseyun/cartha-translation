source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ δὲ τοῦ βαπτίσματος προνηστευσάτω ὁ βαπτίζων καὶ ὁ βαπτιζόμενος καὶ εἴ τινες ἄλλοι δύνανται· κελεύσεις δὲ νηστεῦσαι τὸν βαπτιζόμενον πρὸ μιᾶς ἢ δύο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/004.yaml
  text: But before the baptism, let the one baptizing and the one being baptized fast beforehand, and any others who are able; and you shall command the one being baptized to fast one or two days beforehand.
translation:
  language: pt
  text: Mas, antes do batismo, jejuem de antemão tanto quem batiza quanto quem é batizado, bem como quaisquer outros que puderem; e ordene a quem é batizado que jejue um ou dois dias antes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προνηστευσάτω
  choice: jejuem previamente
  rationale: Expressa o jejum preparatório anterior ao batismo; a construção no plural acomoda naturalmente os sujeitos coordenados em português.
- source_word: ὁ βαπτίζων καὶ ὁ βαπτιζόμενος
  choice: tanto quem batiza como quem é batizado
  rationale: Preserva a distinção entre o ministro do batismo e seu recebedor sem recorrer a substantivos eclesiásticos não presentes no grego.
- source_word: εἴ τινες ἄλλοι δύνανται
  choice: quaisquer outros que puderem
  rationale: Mantém o caráter facultativo condicionado à capacidade de outros participantes.
- source_word: κελεύσεις
  choice: instruirá
  rationale: Comunica uma determinação dada diretamente ao destinatário, em registro digno e natural, sem a dureza potencial de «ordenará».
- source_word: πρὸ μιᾶς ἢ δύο
  choice: um ou dois dias antes
  rationale: O substantivo «dias» está elíptico no grego e é recuperado pelo contexto usual da expressão; «antes» preserva a relação temporal.
theological_decisions:
- issue: Identidade de quem batiza e de quem é batizado
  choice: 'Traduzir por funções descritivas: «quem batiza» e «quem é batizado».'
  alternative: Empregar termos como «ministro» e «catecúmeno».
  rationale: Os termos gregos são particípios funcionais e não especificam ofício eclesiástico nem condição catequética formal.
- issue: Força de κελεύσεις
  choice: «instruirá»
  alternative: «ordenará» ou «mandará»
  rationale: A forma futura pode funcionar como prescrição direta; «instruirá» conserva a autoridade da orientação sem acrescentar uma tonalidade institucional específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A primeira frase foi ajustada ao plural por coordenação natural dos participantes; a segunda mantém a interpelação no singular («Você»), refletindo a segunda pessoa singular do grego em forma corrente no português brasileiro.
