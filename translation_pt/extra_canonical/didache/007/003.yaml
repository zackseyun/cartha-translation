source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ ἀμφότερα μὴ ἔχῃς, ἔκχεον εἰς τὴν κεφαλὴν τρὶς ὕδωρ εἰς ὄνομα Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/003.yaml
  text: But if you do not have either[a], pour water on the head three times in the name of the Father and of the Son and of the Holy Spirit.
translation:
  language: pt
  text: Mas, se você não tiver nenhum dos dois, derrame água três vezes sobre a cabeça, em nome do Pai, do Filho e do Espírito Santo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφότερα
  choice: nenhum dos dois
  rationale: No contexto da condição negativa μὴ ἔχῃς, refere-se às duas opções de água mencionadas anteriormente; esta formulação é natural em português e mantém a referência dupla.
- source_word: ἔκχεον
  choice: derrame
  rationale: Imperativo de ἐκχέω, indicando verter água; “derrame” é claro e corrente.
- source_word: εἰς τὴν κεφαλήν
  choice: sobre a cabeça
  rationale: Embora εἰς possa ter sentido direcional, em português a ação de verter água sobre a cabeça é expressa naturalmente com “sobre”.
- source_word: τρὶς
  choice: três vezes
  rationale: Correspondência direta e inequívoca do advérbio grego.
- source_word: εἰς ὄνομα
  choice: em nome
  rationale: Expressão formular natural em português, adequada ao contexto batismal; evita o literalismo pouco idiomático “para dentro do nome”.
theological_decisions:
- issue: Definitude de Pai, Filho e Espírito Santo apesar da ausência de artigos nos genitivos gregos
  choice: do Pai, do Filho e do Espírito Santo
  alternative: de Pai, Filho e Espírito Santo
  rationale: Os substantivos anartros na cadeia genitiva permanecem definidos no contexto formular. Os artigos em português comunicam essa definitude de modo natural, sem acrescentar distinção teológica.
- issue: Sentido de εἰς ὄνομα na fórmula batismal
  choice: em nome
  alternative: para o nome
  rationale: “Em nome” preserva a fórmula reconhecível e o sentido contextual sem forçar uma interpretação técnica específica da preposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega-se “você” para o singular implícito do verbo grego e mantém-se a concisão instrucional do original.
