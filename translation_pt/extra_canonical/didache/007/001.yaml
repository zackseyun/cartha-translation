base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/001.yaml
  text: 'Concerning baptism, baptize in this way: Having first said all these things, baptize into the name of the Father and of the Son and of the Holy Spirit in living water.'
translation:
  language: pt
  text: 'Quanto ao batismo, batizem deste modo: depois de terem dito todas essas coisas, batizem em nome do Pai, do Filho e do Espírito Santo, em água viva.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, água corrente; literalmente, “água viva”.
    reason: Esclarece o uso antigo da expressão sem eliminar sua imagem literal do texto principal.
lexical_decisions:
- source_word: βαπτίσατε
  choice: batizem
  rationale: Mantém o verbo específico do texto e o imperativo dirigido à comunidade, em português natural.
- source_word: προειπόντες
  choice: depois de dizerem previamente
  rationale: Reproduz o sentido básico de προλέγω, “dizer antes/previamente”, sem elevá-lo indevidamente ao sentido de pregação pública.
- source_word: εἰς τὸ ὄνομα
  choice: em nome
  rationale: Emprega a fórmula portuguesa consagrada e natural para a expressão grega, evitando o pouco idiomático “para dentro do nome”.
- source_word: ὕδατι ζῶντι
  choice: água viva
  rationale: Preserva a imagem literal grega e sua formulação antiga; uma nota esclarece o provável sentido contextual de água corrente.
theological_decisions:
- issue: Fórmula batismal trinitária
  choice: em nome do Pai, do Filho e do Espírito Santo
  alternative: para dentro do nome do Pai, do Filho e do Espírito Santo
  rationale: Mantém integralmente a fórmula triádica do grego, usando a expressão idiomática portuguesa sem acrescentar uma interpretação teológica de εἰς.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. “Deste modo” introduz naturalmente as instruções, enquanto “todas essas coisas” remete ao ensino precedente. A repetição de “batizem” acompanha a estrutura enfática do grego.
