source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ μὴ ἔχῃς ὕδωρ ζῶν, εἰς ἄλλο ὕδωρ βάπτισον· εἰ δʼ οὐ δύνασαι ἐν ψυχρῷ, ἐν θερμῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/002.yaml
  text: But if you do not have living water, baptize in other water; and if you cannot in cold, then in warm.
translation:
  language: pt
  text: Mas, se você não tiver água viva[a], batize em outra água; e, se não puder batizar em água fria, batize em água quente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, água corrente, como a de uma fonte ou de um rio.
    reason: Esclarece o uso antigo e contextual de «água viva» sem substituir a expressão no texto.
lexical_decisions:
- source_word: ὕδωρ ζῶν
  choice: água viva
  rationale: Mantém a expressão grega tradicional, que neste contexto designa naturalmente água corrente, sem apagar sua forma concreta e possível ressonância simbólica.
- source_word: εἰς ἄλλο ὕδωρ βάπτισον
  choice: batize em outra água
  rationale: Em português, «batizar em água» expressa de modo natural o meio ou ambiente do batismo; traduzir mecanicamente εἰς por «para dentro de» seria pouco idiomático aqui.
- source_word: ἐν ψυχρῷ, ἐν θερμῷ
  choice: em água fria, use água morna
  rationale: O substantivo «água» está elíptico no grego e é explicitado para clareza. «Morna» representa aqui água aquecida, em contraste com a fria, com formulação natural em português.
theological_decisions:
- issue: Sentido de «água viva»
  choice: Preservar «água viva» no texto e esclarecer em nota que normalmente se refere a água corrente.
  alternative: Traduzir diretamente como «água corrente».
  rationale: A formulação literal preserva a linguagem histórica e sua possível ressonância teológica, enquanto a nota comunica o sentido contextual provável sem o impor no corpo do texto.
- issue: Força de εἰς na instrução batismal
  choice: «batize em outra água»
  alternative: «batize para dentro de outra água» ou «batize com outra água».
  rationale: «Em» é idiomático e não decide além do texto questões posteriores sobre o modo de administração; «com» poderia sugerir mais especificamente aplicação da água, e «para dentro de» seria artificial.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por «você» para legibilidade ampla. A construção concisa conserva a sequência condicional do grego. Todas as notas estão marcadas no texto.
