source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδὲ προσεύχεσθε ὡς οἱ ὑποκριταί, ἀλλʼ ὡς ἐκέλευσεν ὁ Κύριος ἐν τῷ εὐαγγελίῳ αὐτοῦ, οὕτω προσεύχεσθε· Πάτερ ἡμῶν ὁ ἐν τῷ οὐρανῷ, ἁγιασθήτω τὸ ὄνομά σου, ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς· τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον καὶ ἄφες ἡμῖν τὴν ὀφειλὴν ἡμῶν ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν, καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/002.yaml
  text: 'Do not pray like the hypocrites[a], but as the Lord commanded in his gospel, pray in this way:


    Our Father in heaven,

    may your name be made holy,

    may your kingdom come,

    may your will be done,

    as in heaven, so also on earth.

    Give us today our bread for the day,

    and forgive us our debt,

    as we also forgive our debtors,

    and do not bring us into testing,

    but rescue us from the evil one;

    for yours is the power and the glory unto the ages.'
translation:
  language: pt
  text: 'Não orem como os hipócritas, mas orem assim, como o Senhor ordenou em seu evangelho:


    Pai nosso que estás no céu,

    seja santificado o teu nome;

    venha o teu reino;

    seja feita a tua vontade,

    assim no céu como também na terra.

    Dá-nos hoje o pão de que precisamos[a];

    e perdoa-nos a nossa dívida,

    assim como nós também perdoamos aos nossos devedores;

    e não nos conduzas à provação[b],

    mas livra-nos do mal[c];

    pois teus são o poder e a glória por todos os séculos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego é raro e de sentido incerto. Também pode ser traduzido como “o pão de cada dia” ou “o pão para o dia seguinte”.
    reason: Preservar a incerteza lexical genuína de ἐπιούσιον.
  - marker: b
    text: Ou “tentação”. A palavra grega pode indicar tanto uma prova como uma tentação.
    reason: Registrar a amplitude semântica de πειρασμόν.
  - marker: c
    text: Ou “do Maligno”. A expressão grega pode referir-se ao mal em geral ou ao maligno como ser pessoal.
    reason: Preservar a ambiguidade gramatical e teológica de τοῦ πονηροῦ.
lexical_decisions:
- source_word: ὑποκριταί
  choice: hipócritas
  rationale: Equivalente português corrente e historicamente adequado para os que assumem uma aparência religiosa que não corresponde à realidade.
- source_word: ἐπιούσιον
  choice: de que precisamos
  rationale: Expressa a ideia provável de pão necessário para o dia sem fingir certeza sobre um termo grego raro e de sentido discutido; a nota registra alternativas importantes.
- source_word: ὀφειλήν / ὀφειλέταις
  choice: dívida / devedores
  rationale: Mantém a metáfora financeira explícita do texto grego e a correspondência entre a dívida perdoada por Deus e os devedores perdoados por nós.
- source_word: πειρασμόν
  choice: provação
  rationale: Preserva o campo semântico de teste ou prova neste contexto; a nota informa que o termo também pode significar tentação.
- source_word: τοῦ πονηροῦ
  choice: do mal
  rationale: A forma grega pode ser entendida de modo neutro, 'o mal', ou masculino, 'o Maligno'; o texto adota a leitura neutra e registra a outra em nota.
- source_word: εἰς τοὺς αἰῶνας
  choice: por todos os séculos
  rationale: Formulação digna e compreensível que conserva a imagem temporal plural do grego, em vez de reduzi-la simplesmente a 'para sempre'.
theological_decisions:
- issue: Pedido para não entrar em πειρασμόν
  choice: não nos conduzas à provação
  alternative: não nos deixes cair em tentação
  rationale: A tradução mantém o verbo causativo εἰσενέγκῃς, 'levar/conduzir para dentro', sem suavizar a tensão teológica presente na formulação original.
- issue: Identidade de τοῦ πονηροῦ
  choice: do mal
  alternative: do Maligno
  rationale: O genitivo com artigo permite leitura neutra ou masculina. Como a gramática não decide por si só, a alternativa pessoal é preservada em nota.
- issue: Valor de ἐπιούσιον
  choice: pão de que precisamos
  alternative: pão de cada dia; pão para o dia seguinte
  rationale: O adjetivo é raro e sua etimologia e referência temporal são discutidas. A redação principal comunica a necessidade cotidiana sem excluir em nota as principais leituras.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais brasileiras de uso amplo (“orem”, “dá-nos”, “perdoa-nos”). A oração foi disposta poeticamente para tornar visível seu paralelismo. Evitaram-se tanto arcaísmos desnecessários quanto paráfrases que eliminariam ambiguidades do grego.
