  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Αἱ δὲ νηστεῖαι ὑμῶν μὴ ἔστωσαν μετὰ τῶν ὑποκριτῶν· νηστεύουσι γὰρ δευτέρα σαββάτων καὶ πέμπτῃ· ὑμεῖς δὲ νηστεύσατε τετράδα καὶ παρασκευήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/001.yaml
  text: But let your fasts not be with the hypocrites, for they fast on the second day of the week and on the fifth; but you, fast on the fourth day and on Preparation.
translation:
  language: pt
  text: Mas os jejuns de vocês não coincidam com os dos hipócritas, pois eles jejuam no segundo e no quinto dia da semana; vocês, porém, jejuem no quarto dia e no dia da Preparação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O quarto dia corresponde à quarta-feira; o dia da Preparação, à sexta-feira, quando se faziam os preparativos para o sábado.
    reason: Esclarece ao leitor moderno a nomenclatura antiga sem substituir no corpo do texto o termo culturalmente significativo «Preparação».
lexical_decisions:
- source_word: Αἱ δὲ νηστεῖαι ὑμῶν
  choice: Mas os jejuns de vocês
  rationale: Mantém o substantivo plural e verte δέ como contraste, em português atual e amplamente compreensível.
- source_word: μὴ ἔστωσαν μετὰ τῶν ὑποκριτῶν
  choice: não sejam junto com os dos hipócritas
  rationale: Preserva a ideia de que os jejuns da comunidade não devem coincidir ou ser praticados em conjunto com os jejuns do grupo chamado de hipócritas, sem ampliar o texto para uma proibição geral de imitação.
- source_word: δευτέρα σαββάτων
  choice: segundo dia da semana
  rationale: Expressa o idiomatismo grego de contagem dos dias da semana de modo inteligível, correspondente à segunda-feira.
- source_word: πέμπτῃ
  choice: quinto dia da semana
  rationale: Supre 'dia da semana' por clareza, seguindo a contagem presente na expressão anterior; corresponde à quinta-feira.
- source_word: τετράδα
  choice: quarto dia
  rationale: Preserva a contagem antiga dos dias; corresponde à quarta-feira.
- source_word: παρασκευήν
  choice: dia da Preparação
  rationale: Mantém o sentido histórico e religioso do termo, tradicionalmente aplicado ao dia de preparação para o sábado, isto é, sexta-feira.
theological_decisions:
- issue: Identidade dos 'hipócritas'
  choice: hipócritas
  alternative: judeus ou certos grupos judaicos
  rationale: O texto não identifica explicitamente o grupo; a tradução conserva a designação do original e evita importar uma identificação histórica ou polêmica não declarada.
- issue: Força de μετὰ na prática do jejum
  choice: junto com os dos hipócritas
  alternative: como os hipócritas
  rationale: A opção preserva a formulação relacional e a possível referência à coincidência dos dias, sem reduzir necessariamente a advertência apenas ao modo ou à motivação do jejum.
translation_notes:
  register: Português moderno, digno e direto, com 'vocês' para o plural. A estrutura contrastiva e a nomenclatura antiga dos dias foram preservadas, com esclarecimento em nota.
