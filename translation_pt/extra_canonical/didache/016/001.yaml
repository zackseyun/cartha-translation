source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν· οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν, καὶ αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν, ἀλλὰ γίνεσθε ἕτοιμοι· οὐ γὰρ οἴδατε τὴν ὥραν, ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/001.yaml
  text: Keep watch over your life.a Do not let your lamps be quenched, and do not let your loins be loosened,b but be ready, for you do not know the hour in which our Lord is coming.
translation:
  language: pt
  text: Vigiem pela vida de vocês.[a] Que as suas lâmpadas não se apaguem, nem as suas cinturas se afrouxem;[b] pelo contrário, estejam preparados, pois vocês não sabem a hora em que o nosso Senhor vem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mantenham-se vigilantes quanto à vida de vocês.”'
    reason: Registra a amplitude de ὑπὲρ τῆς ζωῆς ὑμῶν, que pode enfatizar cuidado ou vigilância em relação à própria vida.
  - marker: b
    text: 'Literalmente: “nem os seus lombos se soltem”. A imagem é a de manter a roupa presa pelo cinto, em prontidão para agir.'
    reason: Explica a expressão idiomática antiga sem substituir, no texto principal, «cinturas» por «cintos».
lexical_decisions:
- source_word: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν
  choice: Vigiem pela vida de vocês
  rationale: Preserva a imagem de vigilância e a construção com ὑπέρ, entendida como cuidado atento pela própria vida, sem reduzir a expressão apenas a 'fiquem acordados'.
- source_word: λύχνοι
  choice: lâmpadas
  rationale: Equivalente natural para pequenas lâmpadas a óleo; mantém a imagem do texto-fonte.
- source_word: αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν
  choice: nem os seus cintos se afrouxem
  rationale: Expressa de modo compreensível a figura antiga dos lombos cingidos e conserva o contraste entre prontidão e relaxamento.
- source_word: γίνεσθε ἕτοιμοι
  choice: estejam preparados
  rationale: Tradução corrente e digna da exortação contínua à prontidão.
- source_word: ἔρχεται
  choice: vem
  rationale: Mantém o presente grego e sua vivacidade, sem impor 'virá' ou explicitar uma interpretação escatológica além do texto.
theological_decisions:
- issue: Sentido de 'vida' em τῆς ζωῆς ὑμῶν
  choice: Manter 'vida' sem qualificá-la
  alternative: Traduzir como 'salvação', 'vida espiritual' ou 'modo de viver'
  rationale: O substantivo grego é amplo; especificá-lo resolveria uma ambiguidade genuína e acrescentaria interpretação teológica não expressa no texto.
- issue: Tempo verbal da vinda do Senhor
  choice: Traduzir ἔρχεται por 'vem'
  alternative: Traduzir por 'virá' ou 'há de vir'
  rationale: O presente pode comunicar expectativa iminente ou uma ação futura vividamente concebida; a forma portuguesa 'vem' preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”, de ampla legibilidade brasileira. As imagens de vigilância, lâmpadas acesas e vestes cingidas foram preservadas, com a expressão menos transparente explicada em nota.
