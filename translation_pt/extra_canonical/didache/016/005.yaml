id: DID.16.5
reference: Didache 16:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τότε ἥξει ἡ κτίσις τῶν ἀνθρώπων εἰς τὴν πύρωσιν τῆς δοκιμασίας καὶ σκανδαλισθήσονται πολλοὶ καὶ ἀπολοῦνται, οἱ δὲ ὑπομείναντες ἐν τῇ πίστει αὐτῶν σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/005.yaml
  text: Then the human creation will come into the fire of testing[a], and many will be caused to stumble and will perish, but those who endure in their faith will be saved by the curse itself.
translation:
  language: pt
  text: Então a criação humana chegará ao fogo da provação, e muitos tropeçarão e perecerão; mas os que perseverarem em sua fé serão salvos pela própria maldição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expressão grega difícil. Também pode ser entendida como “serão salvos de sob a própria maldição”; alguns a interpretam pessoalmente: “pelo próprio maldito”.'
    reason: A construção ὑπ᾽ αὐτοῦ τοῦ καταθέματος é incomum e admite discussão quanto ao valor de ὑπό e a uma possível interpretação pessoal de κατάθεμα.
lexical_decisions:
- source_word: ἡ κτίσις τῶν ἀνθρώπων
  choice: a criação humana
  rationale: Reproduz de modo natural o sentido coletivo da expressão grega, sem reduzi-la apenas a “os seres humanos”.
- source_word: τὴν πύρωσιν τῆς δοκιμασίας
  choice: ao fogo da provação
  rationale: Comunica tanto a imagem de ardor ou queima em πύρωσις quanto o caráter de teste em δοκιμασία, em português claro e digno.
- source_word: σκανδαλισθήσονται
  choice: tropeçarão
  rationale: Preserva a metáfora de cair ou ser levado à queda, sem especificar indevidamente se se trata de apostasia, engano ou ofensa.
- source_word: ὑπομείναντες
  choice: os que perseverarem
  rationale: Expressa a resistência fiel e contínua indicada pelo verbo ὑπομένω.
- source_word: καταθέματος
  choice: maldição
  rationale: O substantivo neutro κατάθεμα significa literalmente “maldição”; a escolha evita transformá-lo sem indicação textual inequívoca em uma pessoa “maldita”.
theological_decisions:
- issue: Agente ou origem da salvação na frase ὑπ᾽ αὐτοῦ τοῦ καταθέματος
  choice: serão salvos pela própria maldição
  alternative: 'serão salvos de sob a própria maldição; ou: pelo próprio maldito'
  rationale: A tradução principal mantém a construção mais direta de ὑπό com genitivo e o substantivo neutro “maldição”, preservando a tensão incomum do texto. A nota registra as principais possibilidades sem decidir silenciosamente a natureza ou identidade do referente.
- issue: Natureza do tropeço de muitos
  choice: tropeçarão
  alternative: abandonarão a fé
  rationale: O grego usa linguagem metafórica e não explicita aqui que todo tropeço seja formalmente apostasia; por isso, a tradução não acrescenta essa conclusão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o tom solene e apocalíptico do original, com vocabulário acessível e sem explicitar além do grego a identidade da “maldição”.
