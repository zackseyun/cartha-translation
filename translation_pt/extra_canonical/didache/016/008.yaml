lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Expressa naturalmente a sequência temporal e escatológica do grego.
- source_word: ὁ κόσμος
  choice: o mundo
  rationale: Mantém o sentido abrangente de κόσμος sem restringi-lo a um grupo específico.
- source_word: ὄψεται
  choice: verá
  rationale: Reproduz diretamente o futuro médio de ὁράω em português corrente.
- source_word: τὸν Κύριον
  choice: o Senhor
  rationale: Preserva o título definido e sua força cristológica no contexto.
- source_word: ἐρχόμενον
  choice: vindo
  rationale: O particípio presente concorda com «o Senhor» e descreve sua vinda tal como será vista.
- source_word: ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: sobre as nuvens do céu
  rationale: Tradução formal e idiomática que preserva a imagem apocalíptica do texto grego.
theological_decisions:
- issue: Alcance de «o mundo»
  choice: Preservar «o mundo» sem explicitação adicional
  alternative: todas as pessoas
  rationale: O grego usa κόσμος; expandir para «todas as pessoas» resolveria uma possível abrangência interpretativa que o texto não explicita.
- issue: Relação espacial expressa por ἐπάνω
  choice: sobre as nuvens
  alternative: nas nuvens
  rationale: «Sobre» corresponde mais diretamente a ἐπάνω e conserva a formulação específica da fonte, sem harmonizá-la silenciosamente com outras expressões bíblicas.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples e conservação da imagem apocalíptica. Não há marcadores de nota porque nenhuma nota textual ou tradutória é necessária.
