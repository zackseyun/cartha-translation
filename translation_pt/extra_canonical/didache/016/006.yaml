source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ τότε φανήσεται τὰ σημεῖα τῆς ἀληθείας· πρῶτον, σημεῖον ἐκπετάσεως ἐν οὐρανῷ, εἶτα σημεῖον φωνῆς σάλπιγγος καὶ τὸ τρίτον ἀνάστασις νεκρῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/006.yaml
  text: 'And then the signs of the truth will appear: first[a], a sign of an opening in heaven; then a sign of the sound of a trumpet; and the third[b], the resurrection of the dead—'
translation:
  language: pt
  text: 'E então aparecerão os sinais da verdade: primeiro, um sinal de algo que se estende no céu[a]; depois, um sinal do som de uma trombeta[b]; e o terceiro, a ressurreição dos mortos—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um sinal de uma extensão no céu». O termo grego descreve algo que se estende ou se desdobra, sem identificar claramente o que é.'
    reason: lexical_ambiguity
  - marker: b
    text: Literalmente, «da voz de uma trombeta».
    reason: literal_rendering
lexical_decisions:
- source_word: ἐκπετάσεως
  choice: de algo que se estende
  rationale: O substantivo indica extensão, desdobramento ou ato de estender. A formulação preserva a imagem e sua ambiguidade sem transformá-la indevidamente numa abertura ou fenda no céu.
- source_word: φωνῆς σάλπιγγος
  choice: do som de uma trombeta
  rationale: Embora φωνή possa significar literalmente «voz», com um instrumento designa naturalmente seu som ou toque; «som de uma trombeta» é claro e fiel em português.
- source_word: ἀνάστασις νεκρῶν
  choice: a ressurreição dos mortos
  rationale: Expressão portuguesa tradicional e semanticamente direta para a volta dos mortos à vida.
theological_decisions:
- issue: Identidade do primeiro sinal
  choice: 'Manter a descrição indefinida: «algo que se estende no céu»'
  alternative: Identificá-lo como a cruz ou traduzi-lo como uma abertura no céu
  rationale: O grego não identifica explicitamente o objeto nem usa o termo normal para «abertura». A tradução evita inserir uma interpretação patrística ou denominacional.
- issue: Alcance da ressurreição
  choice: «a ressurreição dos mortos» sem qualificação
  alternative: Especificar todos os mortos ou somente determinados mortos
  rationale: Este versículo, isoladamente, não explicita o alcance; a tradução mantém a tensão que o contexto subsequente desenvolve.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez. O travessão final foi preservado porque a frase continua no versículo seguinte.
