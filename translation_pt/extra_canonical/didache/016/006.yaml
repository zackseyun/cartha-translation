  source_fidelity: A tradução preserva corretamente a sequência dos três sinais e traduz bem φωνῆς σάλπιγγος como «som de uma trombeta» e ἀνάστασις νεκρῶν como «ressurreição dos mortos». Para ἐκπετάσεως, «algo que se estende» mantém prudentemente a indeterminação do referente e evita a interpretação de uma abertura no céu.
  naturalness: O texto é claro e tem registro apropriado. Contudo, «o sinal» nos dois primeiros itens pode soar como se o sinal já fosse determinado ou conhecido; os δύο usos anartros de σημεῖον são mais bem representados por «um sinal».
  terminology: «Ressurreição dos mortos» é a formulação estabelecida e fiel. «Som de uma trombeta» é natural em português e corresponde ao uso instrumental de φωνή. A nota sobre ἐκπετάσεως conserva a ambiguidade lexical sem identificar o sinal com a cruz.
