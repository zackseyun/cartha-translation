base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/002.yaml
  text: And gather together often, seeking the things that are fitting for your souls; for the whole time of your faith will not profit you unless you are perfected in the last time.
translation:
  language: pt
  text: Reúnam-se com frequência, buscando as coisas que dizem respeito às suas almas; pois todo o tempo da fé de vocês não lhes será de proveito, se não forem aperfeiçoados no tempo final.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πυκνῶς
  choice: com frequência
  rationale: Expressa de modo natural a ideia de repetição frequente, sem sugerir uma periodicidade específica.
- source_word: συναχθήσεσθε
  choice: Reúnam-se
  rationale: Embora a forma grega seja futuro passivo, no contexto exortativo ela funciona naturalmente como uma convocação; o imperativo reflexivo comunica isso com clareza em português.
- source_word: τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν
  choice: as coisas que dizem respeito às suas almas
  rationale: Mantém a amplitude de τὰ ἀνήκοντα e a referência plural a ψυχαῖς, sem restringir o sentido a necessidades, benefícios ou deveres específicos.
- source_word: ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν
  choice: todo o tempo da fé de vocês
  rationale: Preserva a construção abrangente do grego e sua relação explícita com a fé dos destinatários.
- source_word: ὠφελήσει
  choice: será de proveito
  rationale: Equivale ao sentido de beneficiar ou aproveitar, em registro digno e corrente.
- source_word: τελειωθῆτε
  choice: forem aperfeiçoados
  rationale: Reproduz a voz passiva e a ideia de chegar à perfeição, maturidade ou consumação, sem definir de que modo isso ocorre.
- source_word: ἐν τῷ ἐσχάτῳ καιρῷ
  choice: no tempo final
  rationale: Traduz de forma direta a expressão escatológica, preservando sua concisão e sem especificar um período não explicitado no texto.
theological_decisions:
- issue: Sentido de τελειωθῆτε
  choice: forem aperfeiçoados
  alternative: forem levados à plenitude
  rationale: A opção escolhida conserva a linguagem forte de perfeição do verbo e sua forma passiva, deixando aberta a tensão entre maturidade, fidelidade consumada e conclusão escatológica.
- issue: Valor de ἐσχάτῳ καιρῷ
  choice: tempo final
  alternative: último tempo
  rationale: “Tempo final” é mais natural em português e mantém a referência escatológica sem impor uma cronologia ou esquema doutrinário específico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o tom exortativo, a advertência escatológica e a ambiguidade semântica do aperfeiçoamento final.
