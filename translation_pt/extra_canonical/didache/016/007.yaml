lexical_decisions:
- source_word: οὐ πάντων δέ, ἀλλ᾽
  choice: Mas não de todos, e sim
  rationale: Preserva o contraste enfático do grego e a ligação com o contexto anterior, em português natural.
- source_word: ὡς ἐρρέθη
  choice: como foi dito
  rationale: Reproduz a fórmula passiva sem especificar quem falou, mantendo a concisão do original.
- source_word: οἱ ἅγιοι
  choice: os santos
  rationale: É a forma substantivada corrente em português para designar os que são santos, sem decidir além do texto se se trata de seres humanos, anjos ou ambos.
theological_decisions:
- issue: Identidade de πάντες οἱ ἅγιοι
  choice: todos os santos
  alternative: todos os seres santos
  rationale: “Os santos” é fiel e idiomático, ao mesmo tempo que conserva a possível amplitude referencial do grego.
