  yaml_path: translation/extra_canonical/didache/016/003.yaml
  text: For in the last days false prophets and corrupters will be multiplied, and the sheep will be turned into wolves, and love will be turned into hatred.
translation:
  language: pt
  text: Pois, nos últimos dias, os falsos profetas e os corruptores se multiplicarão; as ovelhas serão transformadas em lobos, e o amor será transformado em ódio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ... ταῖς ἐσχάταις ἡμέραις
  choice: nos últimos dias
  rationale: Expressão portuguesa natural que conserva o sentido temporal e escatológico do grego.
- source_word: πληθυνθήσονται
  choice: se multiplicarão
  rationale: Preserva a forma passiva/reflexiva idiomática e a ideia de aumento numérico.
- source_word: οἱ ψευδοπροφῆται
  choice: os falsos profetas
  rationale: Equivalente direto e consagrado, sem acrescentar interpretação.
- source_word: οἱ φθορεῖς
  choice: os corruptores
  rationale: Mantém o sentido ativo de pessoas que corrompem ou arruínam, em vez de traduzir como pessoas já corrompidas.
- source_word: στραφήσονται ... εἰς
  choice: se transformarão em
  rationale: No contexto, exprime com clareza uma mudança de caráter ou condição, preservando a imagem forte do original.
- source_word: ἡ ἀγάπη
  choice: o amor
  rationale: Equivalente amplo e natural, sem restringir o referente a uma categoria teológica específica.
- source_word: μῖσος
  choice: ódio
  rationale: Correspondência direta ao contraste antitético com amor.
theological_decisions:
- issue: Sentido da transformação das ovelhas em lobos
  choice: as ovelhas se transformarão em lobos
  alternative: as ovelhas serão transformadas em lobos
  rationale: A forma média/passiva grega admite alguma nuance, mas o português reflexivo conserva a ambiguidade quanto à agência e comunica naturalmente a mudança moral representada pela metáfora.
- issue: Referência de “o amor”
  choice: manter a expressão sem especificar seu possuidor ou objeto
  alternative: o amor de muitos / o amor entre eles
  rationale: O grego traz apenas ἡ ἀγάπη; explicitar “de muitos” ou “entre eles” importaria conteúdo não expresso no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A pontuação organiza as três afirmações coordenadas sem alterar sua progressão retórica.
