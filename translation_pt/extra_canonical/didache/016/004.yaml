  source_fidelity: A tradução acompanha adequadamente a sequência e os principais termos do grego. Contudo, «desde o princípio da era» introduz «princípio», que não está expresso em ἐξ αἰῶνος; no contexto negativo, a locução significa idiomaticamente «desde sempre»/«jamais».
  naturalness: O português é claro e de registro adequado. A divisão em períodos preserva a progressão do original. «Desde sempre» é mais natural e mais fiel do que a formulação anterior.
  terminology: «Transgressão da lei», «enganador do mundo», «sinais e prodígios», «filho de Deus» e «atos ilícitos» são opções defensáveis. A ausência de artigo em «filho de Deus» preserva corretamente a formulação não definida do grego.
  issues:
