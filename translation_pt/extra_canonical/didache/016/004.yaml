  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὐξανούσης γὰρ τῆς ἀνομίας, μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι, καὶ τότε φανήσεται ὁ κοσμοπλάνος ὡς υἱὸς Θεοῦ καὶ ποιήσει σημεῖα καὶ τέρατα, καὶ ἡ γῆ παραδοθήσεται εἰς χεῖρας αὐτοῦ, καὶ ποιήσει ἀθέμιτα, ἃ οὐδέποτε γέγονεν ἐξ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/004.yaml
  text: For as lawlessness increases, they will hate one another and persecute and betray one another, and then the world-deceiver will appear as a son of God and will do signs and wonders, and the earth will be delivered into his hands, and he will do unlawful things such as have never happened from the beginning of the age.
translation:
  language: pt
  text: Pois, à medida que a transgressão da lei aumentar, eles odiarão uns aos outros, perseguirão e entregarão uns aos outros. Então o enganador do mundo aparecerá como filho de Deus e fará sinais e prodígios. A terra será entregue nas mãos dele, e ele cometerá atos ilícitos como nunca ocorreram desde sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομία
  choice: transgressão da lei
  rationale: Expressa o sentido de violação ou desprezo da lei com linguagem corrente e preserva a dimensão jurídica do termo, em vez de reduzi-lo genericamente a “maldade”.
- source_word: κοσμοπλάνος
  choice: enganador do mundo
  rationale: 'Reproduz o composto grego: alguém que engana o mundo. É mais natural em português do que um neologismo como “mundo-enganador”.'
- source_word: σημεῖα καὶ τέρατα
  choice: sinais e prodígios
  rationale: Mantém a fórmula tradicional e reconhecível, correspondente aos dois substantivos gregos.
- source_word: ἀθέμιτα
  choice: atos ilícitos
  rationale: Preserva a noção de coisas proibidas ou contrárias ao que é lícito, sem especificar uma espécie de perversidade que o grego não explicita.
- source_word: ἐξ αἰῶνος
  choice: desde o princípio da era
  rationale: Mantém no texto a referência singular a αἰών e sua possível dimensão escatológica, deixando em nota a formulação idiomática alternativa.
theological_decisions:
- issue: Sentido de ὡς υἱὸς Θεοῦ
  choice: como filho de Deus
  alternative: como o Filho de Deus
  rationale: A construção grega não traz artigo diante de υἱὸς Θεοῦ. A forma escolhida preserva a possibilidade de pretensão ou imitação, sem identificar silenciosamente o enganador com aquele que recebe o título definido “o Filho de Deus”.
- issue: Referência temporal de ἐξ αἰῶνος
  choice: desde o princípio da era
  alternative: desde o princípio dos tempos
  rationale: O singular grego pode apontar para “a era”, mas a expressão também pode funcionar idiomaticamente como “desde tempos remotos” ou “desde o princípio dos tempos”. A tradução principal preserva a forma mais literal, e a nota registra a alternativa natural.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A longa frase grega foi dividida em três períodos para facilitar a leitura sem alterar sua progressão lógica. O objeto recíproco “uns aos outros” foi explicitado com “perseguirão” e “entregarão”, conforme o encadeamento iniciado por ἀλλήλους.
