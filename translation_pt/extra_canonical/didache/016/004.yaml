    issue: A expressão «desde o princípio da era» acrescenta «princípio» ao texto.
    rationale: 'O grego ἐξ αἰῶνος não contém termo equivalente a «princípio». Na construção «nunca ... ἐξ αἰῶνος», seu valor é temporal e idiomático: «desde sempre» ou «jamais».'
  - severity: low
    issue: A nota vinculada a ἐξ αἰῶνος mantém e reforça a expansão «princípio».
    rationale: A alternativa «desde o princípio dos tempos» também explicita um «princípio» não presente no grego. Não é necessária uma nota para a solução idiomática fiel «desde sempre».
