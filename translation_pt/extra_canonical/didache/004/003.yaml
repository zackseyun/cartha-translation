source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ ποιήσεις σχίσμα, εἰρηνεύσεις δὲ μαχομένους· κρινεῖς δικαίως, οὐ λήψῃ πρόσωπον ἐλέγξαι ἐπὶ παραπτώμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/003.yaml
  text: You shall not cause division[a], but you shall reconcile those who are fighting. You shall judge justly; you shall not show partiality in reproving transgressions.
translation:
  language: pt
  text: Não causarás divisão[a], mas reconciliarás os que estão em conflito. Julgarás com justiça e não mostrarás parcialidade ao repreender alguém por transgressões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «cisma».'
    reason: Registra a tradução formal possível de σχίσμα, embora «divisão» comunique melhor o sentido antigo sem conotações institucionais posteriores.
lexical_decisions:
- source_word: σχίσμα
  choice: divisão
  rationale: No grego cristão antigo, designa uma ruptura ou divisão dentro da comunidade; «divisão» evita a conotação institucional posterior que «cisma» pode ter.
- source_word: εἰρηνεύσεις ... μαχομένους
  choice: reconciliarás os que estão em conflito
  rationale: Expressa naturalmente o sentido de promover a paz entre pessoas que contendem, sem exigir que μάχομαι denote necessariamente combate físico.
- source_word: κρινεῖς δικαίως
  choice: julgarás com justiça
  rationale: Reproduz com clareza o verbo e o advérbio gregos em português corrente e digno.
- source_word: οὐ λήψῃ πρόσωπον
  choice: não mostrarás parcialidade
  rationale: Traduz o idiomatismo semítico helenizado «receber o rosto», cujo sentido é favorecer alguém ou agir com acepção de pessoas.
- source_word: ἐλέγξαι ἐπὶ παραπτώμασιν
  choice: ao repreender transgressões
  rationale: Mantém a relação entre a proibição de parcialidade e o ato de censurar faltas, sem acrescentar um possuidor ou agente não expresso no grego.
theological_decisions:
- issue: Sentido comunitário de σχίσμα
  choice: divisão
  alternative: cisma
  rationale: A escolha conserva a advertência contra rupturas comunitárias sem projetar sobre o texto a noção técnica posterior de cisma eclesiástico.
- issue: Alcance de μαχομένους
  choice: os que estão em conflito
  alternative: os que estão lutando
  rationale: O grego pode abranger contenda verbal ou hostilidade, além de luta física; a formulação escolhida preserva essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com formas de futuro que preservam o caráter injuntivo do grego. Evitou-se linguagem excessivamente técnica ou denominacional.
