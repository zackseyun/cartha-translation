    issue: Objeto e complemento de «repreender»
    rationale: Em ἐλέγξαι ἐπὶ παραπτώμασιν, as transgressões são o motivo/assunto da repreensão, não seu objeto direto. Em português, «repreender transgressões» pode sugerir que se repreendem as próprias faltas. Acrescentar «alguém» torna explícito apenas o participante já pressuposto pelo verbo e mantém «por transgressões» como o complemento adequado.
