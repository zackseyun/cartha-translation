  text: You shall not be double-minded whether it will be or not[a].
translation:
  language: pt
  text: Não fique em dúvida sobre se será ou não.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não hesite sobre se será ou não»; literalmente, «Não tenha ânimo dividido sobre se será ou não».'
    reason: Registra tanto uma alternativa idiomática para διψυχέω quanto sua imagem literal, preservando o referente não expresso de ἔσται («será»).
lexical_decisions:
- source_word: διψυχήσεις
  choice: fique dividido
  rationale: Preserva a imagem de hesitação interior ou ânimo dividido de διψυχέω, evitando a formulação pouco natural «ter duas almas» e sem reduzi-la simplesmente a uma dúvida intelectual.
- source_word: πότερον ἔσται ἢ οὔ
  choice: perguntando-se se acontecerá ou não
  rationale: Expressa naturalmente em português a pergunta indireta introduzida por πότερον...ἢ οὔ; «acontecerá» mantém a referência indefinida de ἔσται.
theological_decisions:
- issue: Referente não expresso de ἔσται
  choice: acontecerá
  alternative: será
  rationale: O grego não identifica explicitamente o que «será»; «acontecerá» conserva essa abertura e soa mais natural, sem acrescentar um referente teológico.
translation_notes:
  register: Imperativo direto, atual e digno, com leitura natural no português internacional e boa inteligibilidade brasileira. A construção evita tanto o arcaísmo quanto a explicitação indevida do objeto da expectativa.
