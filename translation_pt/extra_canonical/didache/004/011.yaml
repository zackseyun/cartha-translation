  source_fidelity: A tradução de δοῦλοι, ὑποτάγησεθε, κυρίοις e do sentido pessoal de τύπῳ Θεοῦ está bem fundamentada. Contudo, «reverência» atenua αἰσχύνῃ, cujo sentido básico é «vergonha» (ou senso de vergonha/modéstia), distinto de φόβῳ («temor»).
  naturalness: «Vocês, porém, escravos» e «sujeitem-se a seus senhores» são claros e naturais em português moderno. «Com vergonha e temor» é igualmente idiomático e preserva a formulação incisiva do original.
  terminology: «Escravos» mantém com precisão a realidade histórica expressa por δοῦλοι. «A quem representa Deus» comunica de modo natural o valor contextual de τύπος como figura ou representante, sem identificar os senhores com Deus. A nota deve registrar de forma completa a alternativa «modelo/padrão», em vez de apenas mencioná-la em sua justificativa.
