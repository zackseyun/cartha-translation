source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὑμεῖς δὲ οἱ δοῦλοι ὑποτάγησεθε τοῖς κυρίοις ὑμῶν ὡς τύπῳ Θεοῦ ἐν αἰσχύνῃ καὶ φόβῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/011.yaml
  text: But you slaves shall be subject to your masters as to a representative of God[a], in reverence and fear.
translation:
  language: pt
  text: Vocês, porém, escravos, sujeitem-se a seus senhores como a quem representa Deus[a], com vergonha e temor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como a uma figura de Deus”; também pode ser entendido como “como a um modelo/padrão de Deus”.'
    reason: τύπος pode designar uma figura ou representante e, em outro sentido, um modelo ou padrão. A tradução principal adota o sentido pessoal mais adequado ao contexto de autoridade, sem eliminar a alternativa lexical.
lexical_decisions:
- source_word: δοῦλοι
  choice: escravos
  rationale: Traduz diretamente o termo grego, que designa pessoas em condição de escravidão; opções como “servos” poderiam atenuar indevidamente essa realidade.
- source_word: ὑποτάγησεθε
  choice: sujeitem-se
  rationale: Expressa a submissão ordenada pelo verbo grego, em formulação natural e digna no português atual.
- source_word: τύπῳ Θεοῦ
  choice: a quem representa Deus
  rationale: Neste contexto pessoal e de autoridade, τύπος indica uma figura ou representante visível. A formulação evita o pouco natural “padrão de Deus”, sem apagar a alternativa lexical registrada em nota.
- source_word: ἐν αἰσχύνῃ καὶ φόβῳ
  choice: com reverência e temor
  rationale: Aqui αἰσχύνη comunica recato ou respeito reverente, mais do que vergonha moral; φόβος conserva a noção de temor.
theological_decisions:
- issue: A relação entre os senhores e a representação de Deus
  choice: como a quem representa Deus
  alternative: como a uma figura de Deus
  rationale: A tradução preserva a comparação feita pelo texto sem identificar os senhores com Deus nem acrescentar uma legitimação teológica da escravidão que o grego não explicita.
translation_notes:
  register: Português moderno, direto e amplamente compreensível, com tratamento no plural por “vocês”. Mantém-se “escravos” por precisão histórica e lexical. A construção “a quem representa Deus” comunica com naturalidade o valor pessoal de τύπος.
