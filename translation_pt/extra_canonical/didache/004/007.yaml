base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/007.yaml
  text: You shall not hesitate to give, nor grumble while giving; for you will know who is the good giver of the reward.
translation:
  language: pt
  text: Não hesite em dar, nem murmure ao dar, pois você saberá quem é o bom recompensador.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ διστάσεις
  choice: Não hesite
  rationale: Expressa de modo natural em português a proibição de vacilar ou relutar em dar.
- source_word: γογγύσεις
  choice: murmure
  rationale: Preserva a ideia de queixa ou resmungo, com registro digno e inteligível.
- source_word: ὁ τοῦ μισθοῦ καλὸς ἀνταποδότης
  choice: o bom Recompensador
  rationale: ἀνταποδότης designa aquele que retribui ou recompensa; a formulação evita a redundância pouco natural de 'doador da recompensa' e mantém a referência pessoal do grego.
theological_decisions:
- issue: Identidade não explicitada daquele que recompensa
  choice: Manter a formulação indireta “quem é o bom Recompensador”
  alternative: Explicitar “Deus”
  rationale: Embora a referência provavelmente seja a Deus, o texto grego não o nomeia; a tradução preserva essa forma alusiva.
- issue: Sentido de μισθός
  choice: recompensa
  alternative: salário
  rationale: Neste contexto de generosidade e retribuição divina, “recompensa” comunica melhor o alcance de μισθός sem sugerir uma relação trabalhista literal.
translation_notes:
  register: Português moderno, claro e digno, com imperativo natural. A maiúscula em “Recompensador” sinaliza a provável referência divina sem inserir explicitamente o nome “Deus” no texto.
