  text: Ἐκζητήσεις δὲ καθ’ ἡμέραν τὰ πρόσωπα τῶν ἁγίων, ἵνα ἐπαναπαῇ τοῖς λόγοις αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/002.yaml
  text: And you shall seek out day by day the presence of the saints, so that you may find rest in their words.
translation:
  language: pt
  text: E procure, dia após dia, a presença dos santos, para encontrar descanso nas palavras deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐκζητήσεις
  choice: procure
  rationale: Expressa a busca intencional indicada pelo verbo, com naturalidade no português atual.
- source_word: καθ’ ἡμέραν
  choice: dia após dia
  rationale: Preserva a ideia de prática cotidiana e contínua.
- source_word: τὰ πρόσωπα τῶν ἁγίων
  choice: estar na presença dos santos
  rationale: Embora πρόσωπα signifique literalmente “rostos”, aqui a expressão aponta para procurar pessoalmente a companhia ou presença dos santos; a formulação evita o literalismo pouco natural sem reduzir “santos” a uma categoria denominacional posterior.
- source_word: ἐπαναπαῇ
  choice: encontrar descanso
  rationale: Comunica o sentido de repousar, ser confortado ou achar refrigério nas palavras deles, preservando a imagem do original.
- source_word: τοῖς λόγοις αὐτῶν
  choice: nas palavras deles
  rationale: Tradução direta e clara, mantendo a referência ao ensino ou fala dos santos sem especificá-la além do grego.
theological_decisions:
- issue: Identidade de τῶν ἁγίων
  choice: dos santos
  alternative: dos que pertencem a Deus / dos fiéis
  rationale: Mantém a designação tradicional e a abertura semântica do termo para os membros santos do povo de Deus, sem importar a noção posterior de pessoas canonizadas.
translation_notes:
  register: Português moderno, digno e acessível, com construção exhortativa natural. “Estar na presença” explicita idiomaticamente o sentido relacional de procurar os “rostos”, enquanto “dia após dia” conserva a regularidade enfatizada pelo grego.
