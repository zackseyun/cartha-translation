  source_fidelity: A expressão τὰ πρόσωπα τῶν ἁγίων é idiomática e aponta para buscar pessoalmente os santos, isto é, sua presença ou companhia. «Presença dos santos» transmite bem esse sentido. Contudo, «procure estar na presença» desloca levemente o foco do ato de buscar pessoas para o estado de estar presente. «Procure ... a presença» corresponde mais diretamente ao imperativo Ἐκζητήσεις. «Encontrar descanso nas palavras deles» reproduz adequadamente o propósito expresso por ἵνα ἐπαναπαῇ τοῖς λόγοις αὐτῶν, sem sobredefinir a imagem de repousar/ser reconfortado por suas palavras.
