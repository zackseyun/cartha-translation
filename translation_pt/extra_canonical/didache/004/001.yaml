source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ μνησθήσῃ νυκτὸς καὶ ἡμέρας, τιμήσεις δὲ αὐτὸν ὡς Κύριον· ὅθεν γὰρ ἡ κυριότης λαλεῖται, ἐκεῖ Κύριός ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/001.yaml
  text: My child, you shall remember night and day the one who speaks to you the word of God, and you shall honor him as the Lord; for where lordship is spoken, there the Lord is.
translation:
  language: pt
  text: Meu filho, você se lembrará, noite e dia, daquele que fala a você a palavra de Deus e o honrará como ao Senhor, pois onde se fala do senhorio[a], ali está o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «domínio»; ou «autoridade».'
    reason: κυριότης é um termo abstrato que pode designar senhorio, domínio ou autoridade. As alternativas preservam a ambiguidade sem acrescentar um genitivo ausente no grego.
lexical_decisions:
- source_word: Τέκνον μου
  choice: Meu filho
  rationale: Reproduz a forma afetuosa de instrução catequética; o neutro grego τέκνον designa aqui o discípulo sem especificar necessariamente seu sexo.
- source_word: τοῦ λαλούντός σοι
  choice: daquele que lhe anuncia
  rationale: Expressa naturalmente a referência ao mestre que comunica ao discípulo a palavra de Deus; «anuncia» preserva a ideia de fala dirigida sem exigir um discurso formal.
- source_word: μνησθήσῃ ... τιμήσεις
  choice: você se lembrará ... e o honrará
  rationale: Mantém em paralelo os dois futuros indicativos gregos empregados com força imperativa, refletindo o estilo catequético de mandamento.
- source_word: ὡς Κύριον
  choice: como ao Senhor
  rationale: Forma idiomática em português para a comparação do modo de honrar, sem transformar explicitamente o mestre no próprio Senhor.
- source_word: κυριότης
  choice: senhorio
  rationale: Preserva o substantivo abstrato e sua ligação verbal com Κύριος («Senhor»), sem reduzir a expressão apenas a «autoridade».
theological_decisions:
- issue: Relação entre o mestre e o Senhor em ὡς Κύριον
  choice: como ao Senhor
  alternative: como o Senhor
  rationale: A tradução conserva a elevada honra ordenada ao mestre por ele transmitir a palavra de Deus, mas evita resolver a comparação como uma identificação ontológica inequívoca.
- issue: Sentido de κυριότης na máxima final
  choice: senhorio, com nota de alternativa
  alternative: autoridade do Senhor
  rationale: O termo abstrato pode apontar tanto para senhorio quanto para autoridade vinculada ao Senhor; o texto principal mantém a correspondência lexical com Κύριος e a nota registra a leitura explicativa.
translation_notes:
  register: Português moderno, digno e catequético, com construção acessível ao leitor brasileiro. O paralelismo dos futuros foi preservado para refletir a forma imperatival do grego e a cadência normativa do contexto.
