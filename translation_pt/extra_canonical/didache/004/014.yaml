  text: Ἐν ἐκκλησίᾳ ἐξομολογήσῃ τὰ παραπτώματά σου, καὶ οὐ προσελεύσῃ ἐπὶ προσευχήν σου ἐν συνειδήσει πονηρᾷ. Αὕτη ἐστὶν ἡ ὁδὸς τῆς ζωῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/014.yaml
  text: In the assembly you shall confess your transgressions, and you shall not come to prayer with an evil conscience. This is the way of life.
translation:
  language: pt
  text: Na assembleia, você confessará suas transgressões e não se aproximará da oração com má consciência. Este é o caminho da vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: assembleia
  rationale: Aqui designa a reunião da comunidade; “assembleia” preserva o sentido concreto sem pressupor uma instituição ou edifício.
- source_word: ἐξομολογήσῃ
  choice: confessará
  rationale: Expressa o reconhecimento aberto das transgressões no contexto comunitário.
- source_word: παραπτώματά
  choice: transgressões
  rationale: Mantém a ideia de faltas ou desvios morais, em registro digno e compreensível.
- source_word: προσελεύσῃ ἐπὶ προσευχήν
  choice: se aproximará da oração
  rationale: Conserva a imagem grega de aproximar-se ou vir para a oração, sem acrescentar o possessivo ausente no texto.
- source_word: συνειδήσει πονηρᾷ
  choice: com a consciência má
  rationale: Reproduz de modo direto a qualificação moral da consciência no grego.
theological_decisions:
- issue: Sentido de ἐκκλησία
  choice: assembleia
  alternative: igreja
  rationale: “Assembleia” mantém em primeiro plano a comunidade reunida e evita resolver indevidamente se o termo já possui aqui um sentido institucional.
- issue: Relação entre confissão, oração e consciência
  choice: Manter as duas ordens lado a lado, sem explicar sua relação
  alternative: Acrescentar que a confissão purifica a consciência antes da oração
  rationale: O texto ordena a confissão e proíbe aproximar-se da oração com consciência má, mas não explicita uma sequência sacramental nem um mecanismo teológico.
translation_notes:
  register: Português moderno, digno e acessível, com construção direta. Emprega “você” para boa legibilidade brasileira, sem coloquialismo, e conserva o tom instrutivo do futuro com valor imperativo.
