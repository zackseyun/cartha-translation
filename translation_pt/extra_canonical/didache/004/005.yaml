  text: Μὴ γίνου πρὸς μὲν τὸ λαβεῖν ἐκτείνων τὰς χεῖρας, πρὸς δὲ τὸ δοῦναι συσπῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/005.yaml
  text: Do not be one who stretches out his hands to receive[a], but draws them in to avoid giving.
translation:
  language: pt
  text: Não seja alguém que estende as mãos para receber, mas as recolhe para não dar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνου
  choice: Não seja
  rationale: Reproduz naturalmente a proibição de assumir ou cultivar esse tipo de conduta.
- source_word: ἐκτείνων τὰς χεῖρας
  choice: estende as mãos
  rationale: Mantém a imagem corporal concreta e o paralelismo da exortação.
- source_word: λαβεῖν
  choice: receber
  rationale: Equivalente direto e adequado ao contraste com dar.
- source_word: συσπῶν
  choice: as recolhe
  rationale: Expressa o ato de puxar ou contrair as mãos, preservando a metáfora de retenção.
- source_word: δοῦναι
  choice: dar
  rationale: Equivalente direto que conserva a oposição lexical receber/dar.
theological_decisions:
- issue: Relação de συσπῶν com πρὸς δὲ τὸ δοῦναι
  choice: para não dar
  alternative: quando se trata de dar
  rationale: O grego diz literalmente que a pessoa recolhe as mãos em relação ao dar; em português, “para não dar” torna explícita a força pragmática da imagem sem introduzir conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e dignificado, com cadência proverbial. A construção conserva o contraste visual entre mãos estendidas para receber e recolhidas para evitar dar.
