source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπὸ τοῦ υἱοῦ σου ἢ ἀπὸ τῆς θυγατρός σου, ἀλλὰ ἀπὸ νεότητος διδάξεις τὸν φόβον τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/009.yaml
  text: You shall not take your hand away from your son or from your daughter, but from youth you shall teach them the fear of God.
translation:
  language: pt
  text: Não retire a mão de seu filho nem de sua filha; pelo contrário, desde a juventude ensine-lhes o temor de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπό
  choice: Não retire a mão de
  rationale: Preserva a imagem concreta do grego sem especificar se ela indica disciplina, cuidado ou autoridade, mantendo a ambiguidade do texto.
- source_word: ἀπὸ νεότητος
  choice: desde a infância
  rationale: Expressa de modo natural o ensino iniciado nos primeiros anos de vida; νεότης pode abranger juventude, mas neste contexto parental aponta para a formação desde cedo.
- source_word: διδάξεις
  choice: ensine-lhes
  rationale: O imperativo em português comunica adequadamente a força normativa do futuro grego usado como mandamento; o pronome plural retoma filho e filha.
- source_word: τὸν φόβον τοῦ Θεοῦ
  choice: o temor de Deus
  rationale: Mantém a formulação bíblica tradicional e sua amplitude sem reduzi-la apenas a medo ou respeito.
theological_decisions:
- issue: Sentido da imagem de não retirar a mão
  choice: Manter a metáfora sem explicação no texto principal
  alternative: Traduzir interpretativamente como “não deixe de disciplinar/cuidar de”
  rationale: O grego não explicita se a mão representa disciplina, cuidado, sustento ou autoridade; uma paráfrase resolveria indevidamente essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Seu filho” e “sua filha” preservam a referência singular e inclusiva do original; o ponto e vírgula destaca o contraste introduzido por ἀλλά.
