  language: en
  yaml_path: translation/extra_canonical/didache/004/006.yaml
  text: If you have anything, you shall give through your hands a ransom for your sins.
translation:
  language: pt
  text: Se você tiver algo, dará, por meio de suas mãos, um resgate por seus pecados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν ἔχῃς
  choice: Se você tiver algo
  rationale: A condição é preservada de modo natural; o objeto indefinido está implícito no grego e é expresso como “algo” em português.
- source_word: διὰ τῶν χειρῶν σου
  choice: por meio de suas mãos
  rationale: Mantém a imagem concreta e a construção instrumental do grego, indicando uma dádiva efetivamente entregue pelas próprias mãos.
- source_word: δώσεις
  choice: dará
  rationale: Reproduz o futuro do indicativo, que no contexto tem força de orientação ou preceito.
- source_word: λύτρωσιν
  choice: um resgate
  rationale: Preserva o sentido forte de libertação mediante pagamento ou preço, sem diluí-lo em termos interpretativos como “esmola” ou “expiação”.
- source_word: ἁμαρτιῶν σου
  choice: por seus pecados
  rationale: “Por” conserva a relação ampla expressa pelo genitivo, sem definir em excesso como o resgate se relaciona com os pecados.
theological_decisions:
- issue: Relação entre a dádiva e o perdão ou a remissão dos pecados
  choice: um resgate por seus pecados
  alternative: uma expiação pelos seus pecados / algo para a remissão dos seus pecados
  rationale: A tradução mantém a linguagem soteriológica incisiva do texto, mas não acrescenta uma explicação doutrinária sobre mérito, expiação ou obtenção do perdão.
translation_notes:
  register: Português moderno, claro e digno, com forma de tratamento amplamente compreensível no Brasil. A ordem foi levemente ajustada para fluidez, preservando todos os elementos e a tensão teológica do grego.
