- from: Não rejeite quem passa necessidade; pelo contrário, compartilhe tudo com seu irmão e não diga que essas coisas são suas. Pois, se vocês são participantes daquilo que é imortal, quanto mais das coisas mortais?
  to: Não rejeite quem passa necessidade; pelo contrário, compartilhe tudo com seu irmão e não diga que são suas. Pois, se vocês são participantes daquilo que é imortal, quanto mais nas coisas mortais?
