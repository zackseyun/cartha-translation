  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀποστραφήσῃ τὸν ἐνδεόμενον, συγκοινωνήσεις δὲ πάντα τῷ ἀδελφῷ σου καὶ οὐκ ἐρεῖς ἴδια εἶναι· εἰ γὰρ ἐν τῷ ἀθανάτῳ κοινωνοί ἐστε, πόσῳ μᾶλλον ἐν τοῖς θνητοῖς;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/008.yaml
  text: You shall not turn away the one in need, but you shall share all things with your brother, and you shall not say they are your own; for if you are sharers in what is immortal, how much more in mortal things?
translation:
  language: pt
  text: Não rejeite quem passa necessidade; pelo contrário, compartilhe tudo com seu irmão e não diga que são suas. Pois, se vocês são participantes daquilo que é imortal, quanto mais nas coisas mortais?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστραφήσῃ
  choice: rejeite
  rationale: No contexto, o verbo com objeto direto exprime afastar ou recusar a pessoa necessitada; “rejeite” preserva essa força e soa natural em português.
- source_word: τὸν ἐνδεόμενον
  choice: quem passa necessidade
  rationale: Expressa de modo claro e inclusivo a pessoa que carece do necessário, sem limitar a necessidade a uma forma específica.
- source_word: συγκοινωνήσεις
  choice: compartilhe
  rationale: Comunica a participação conjunta e o pôr em comum, mantendo a exortação em linguagem portuguesa atual.
- source_word: ἴδια
  choice: suas
  rationale: Preserva a ideia de bens considerados propriedade particular sem acrescentar uma condenação mais ampla da propriedade.
- source_word: κοινωνοί
  choice: participantes
  rationale: Mantém o sentido relacional de ter parte em algo e permite conservar o paralelismo entre o imortal e as coisas mortais.
- source_word: τὸ ἀθάνατον / τοῖς θνητοῖς
  choice: aquilo que é imortal / das coisas mortais
  rationale: Conserva a assimetria do grego entre o singular neutro, deliberadamente amplo, e o plural referente às realidades mortais.
theological_decisions:
- issue: Referente de “aquilo que é imortal”
  choice: Manter a expressão aberta, sem identificar explicitamente seu referente.
  alternative: Explicitar como vida eterna, bens espirituais ou salvação.
  rationale: O texto grego não determina qual realidade imortal está em vista; explicá-la resolveria indevidamente uma ambiguidade teológica genuína.
- issue: Alcance do compartilhamento de “tudo”
  choice: Traduzir literalmente a abrangência da exortação, sem formular uma teoria de propriedade.
  alternative: Parafrasear como compartilhar apenas quando houver necessidade ou declarar que nada pode ser propriedade privada.
  rationale: O dito exige generosidade radical e rejeita a reivindicação egoísta, mas não desenvolve aqui uma doutrina econômica completa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Os imperativos em “não rejeite”, “compartilhe” e “não diga” reproduzem naturalmente o valor prescritivo das formas gregas. “Irmão” conserva o termo relacional masculino do original, que neste contexto comunitário pode ter alcance coletivo.
