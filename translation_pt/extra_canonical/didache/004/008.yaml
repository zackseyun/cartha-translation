review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a exortação a não recusar a pessoa necessitada, a compartilhar tudo e a não tratar os bens como propriedade exclusiva. Contudo, «das coisas mortais» não reflete adequadamente a preposição ἐν em ἐν τοῖς θνητοῖς; o paralelismo é «naquilo que é imortal ... nas coisas mortais».
  naturalness: O registro é moderno, claro e apropriado. «Não diga que são suas» é mais fluente e evita o demonstrativo «essas», que não está expresso no grego, sem perder o antecedente dado por «tudo».
  terminology: «Quem passa necessidade», «compartilhe», «irmão» e «participantes» são escolhas adequadas. «Aquilo que é imortal» preserva corretamente a abertura intencional do neutro singular τὸ ἀθάνατον.
  issues:
  - severity: medium
    issue: «quanto mais das coisas mortais?»
    rationale: O grego traz ἐν τοῖς θνητοῖς, literalmente «nas coisas mortais», em paralelo com ἐν τῷ ἀθανάτῳ. «Das» altera essa relação e pode sugerir um complemento de posse ou partitivo.
  - severity: low
    issue: «essas coisas»
    rationale: O demonstrativo não consta do texto-fonte. Embora esclareça o referente, é desnecessário, pois «tudo» já o fornece; sua remoção deixa a formulação mais próxima do grego e mais enxuta.
  revised_text: Não rejeite quem passa necessidade; pelo contrário, compartilhe tudo com seu irmão e não diga que são suas. Pois, se vocês são participantes daquilo que é imortal, quanto mais nas coisas mortais?
