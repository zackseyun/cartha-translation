source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιτάξεις δούλῳ σου ἢ παιδίσκῃ, τοῖς ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν, ἐν πικρίᾳ σου, μήποτε οὐ μὴ φοβηθήσονται τὸν ἐπ᾽ ἀμφοτέροις Θεόν· οὐ γὰρ ἔρχεται κατὰ πρόσωπον καλέσαι, ἀλλ᾽ ἐφ᾽ οὓς τὸ πνεῦμα ἡτοίμασεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/010.yaml
  text: You shall not[a], in your bitterness, command your slave or female slave who hope in the same God, lest they should fail to fear the God who is over both; for he does not come to call according to outward standing, but upon those whom the Spirit has prepared.
translation:
  language: pt
  text: Não darás, com amargura, ordens[a] ao teu escravo ou à tua escrava, que esperam no mesmo Deus, para que não deixem de temer o Deus que está sobre ambos; pois ele não vem chamar segundo a condição exterior, mas vem chamar aqueles que o Espírito preparou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não darás ordens, com amargura, ao teu escravo ou à tua escrava — que esperam no mesmo Deus —”.'
    reason: A posição de ἐν πικρίᾳ σου permite alguma variação na ligação sintática e na ordem natural da frase.
lexical_decisions:
- source_word: ἐν πικρίᾳ σου
  choice: com amargura
  rationale: Preserva a imagem moral e afetiva de πικρία, ligando-a naturalmente ao modo de dar ordens.
- source_word: δούλῳ σου ἢ παιδίσκῃ
  choice: ao teu escravo ou à tua escrava
  rationale: Mantém a referência explícita a pessoas escravizadas de ambos os sexos, sem suavizar a realidade social do texto.
- source_word: ἐλπίζουσιν
  choice: esperam
  rationale: Verte diretamente a ideia de depositar esperança ou confiança em Deus; o complemento 'no mesmo Deus' torna o sentido claro em português.
- source_word: κατὰ πρόσωπον
  choice: segundo a condição exterior
  rationale: No contexto de escravidão e igualdade diante de Deus, a expressão aponta para distinções visíveis ou sociais; esta formulação evita restringi-la apenas à aparência física.
- source_word: ἐφ᾽ οὓς
  choice: vem àqueles que
  rationale: Conserva a preposição e o movimento de ἔρχεται, explicitando em português a elipse do verbo na segunda oração.
theological_decisions:
- issue: Identidade daquele que vem chamar
  choice: Mantido o pronome 'ele', com Deus como referente contextual
  alternative: Explicitar 'Deus' ou identificar o referente como Cristo
  rationale: O grego não nomeia o sujeito de ἔρχεται; explicitar uma identificação cristológica iria além do que o versículo afirma.
- issue: Relação entre Deus e o Espírito na preparação dos chamados
  choice: 'Preservada a distinção verbal: Deus vem chamar aqueles que o Espírito preparou'
  alternative: Harmonizar os agentes ou interpretar 'espírito' como disposição humana
  rationale: O texto usa Θεός e τὸ πνεῦμα de forma distinta; a tradução mantém essa tensão sem impor uma formulação doutrinária posterior.
- issue: Força da expressão negativa μήποτε οὐ μὴ φοβηθήσονται
  choice: para que não deixem de temer
  alternative: para que de modo algum temam
  rationale: A combinação negativa é incomum; no contexto de advertência, expressa o risco de que o tratamento amargo destrua o temor de Deus. A formulação escolhida comunica esse sentido sem reproduzir uma dupla negação confusa em português.
translation_notes:
  register: Português atual, digno e acessível, com tratamento na segunda pessoa do singular para acompanhar o estilo de instrução direta. A formulação preserva a linguagem social dura do original e evita tanto arcaísmos desnecessários quanto suavizações interpretativas.
