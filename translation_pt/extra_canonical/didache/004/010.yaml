review_pass:
  verdict: revise
  source_fidelity: A tradução transmite bem a injunção contra dar ordens com amargura a pessoas escravizadas que esperam no mesmo Deus, bem como a advertência sobre o temor de Deus. «Escravo» e «escrava» preservam de modo apropriado a realidade social explícita do grego. Contudo, «mas vem àqueles» não expressa adequadamente o infinitivo καλέσαι («chamar») que continua elíptico na cláusula contrastante; em português, também pode sugerir apenas aproximação, e não chamado.
  naturalness: O português é atual, claro e de registro instrutivo adequado. A revisão torna mais natural e explícita a construção final, repetindo «vem chamar», sem impor interpretação adicional.
  terminology: «Amargura», «escravo/escrava», «mesmo Deus» e «o Espírito» são escolhas adequadas. «Condição exterior» é uma forma aceitável de preservar a referência a distinções ou estatuto externos em κατὰ πρόσωπον, sem a reduzir à aparência física.
  issues:
  - severity: medium
    issue: A oração final verte «ἀλλ᾽ ἐφ᾽ οὓς ... ἡτοίμασεν» como «mas vem àqueles que o Espírito preparou».
    rationale: 'No grego, καλέσαι («chamar») é entendido também no membro contrastante: Deus não vem chamar com base em condição exterior, mas vem chamar aqueles que o Espírito preparou. A formulação do rascunho omite esse sentido na expressão portuguesa e pode significar simplesmente «vem até eles».'
  revised_text: Não darás, com amargura, ordens[a] ao teu escravo ou à tua escrava, que esperam no mesmo Deus, para que não deixem de temer o Deus que está sobre ambos; pois ele não vem chamar segundo a condição exterior, mas vem chamar aqueles que o Espírito preparou.
