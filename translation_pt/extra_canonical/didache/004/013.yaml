source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μὴ ἐγκαταλίπῃς ἐντολὰς Κυρίου, φυλάξεις δὲ ἃ παρέλαβες, μήτε προστιθεὶς μήτε ἀφαιρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/013.yaml
  text: You shall never forsake the commandments of the Lord, but you shall keep what you received, neither adding nor taking away.
translation:
  language: pt
  text: Jamais abandone os mandamentos do Senhor, mas guarde o que você recebeu, sem acrescentar nem retirar coisa alguma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ ἐγκαταλίπῃς
  choice: Jamais abandone
  rationale: A dupla negação com o subjuntivo exprime proibição enfática; “jamais” preserva essa força, e “abandone” traduz naturalmente ἐγκαταλείπω.
- source_word: ἐντολὰς Κυρίου
  choice: os mandamentos do Senhor
  rationale: Correspondência direta, clara e tradicional para o sintagma grego.
- source_word: φυλάξεις
  choice: guarde
  rationale: No contexto exortativo, o futuro grego tem força imperativa. “Guardar” comunica observar e conservar fielmente o que foi transmitido.
- source_word: ἃ παρέλαβες
  choice: o que você recebeu
  rationale: Preserva a amplitude do relativo e o sentido de receber uma instrução ou tradição transmitida, sem explicitar além do grego.
- source_word: μήτε προστιθεὶς μήτε ἀφαιρῶν
  choice: sem acrescentar nem retirar coisa alguma
  rationale: Reproduz a proibição dupla e torna explícito em português o objeto implícito dos particípios, sem alterar o sentido.
theological_decisions:
- issue: Relação entre os mandamentos do Senhor e aquilo que foi recebido
  choice: Manter as duas expressões sem identificá-las ou distingui-las explicitamente
  alternative: Traduzir de modo a dizer que “o que você recebeu” são precisamente “os mandamentos do Senhor”
  rationale: O grego sugere continuidade, mas não formula uma identificação explícita; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. O ponto e vírgula e “pelo contrário” deixam clara a contraposição marcada por δέ sem produzir uma frase excessivamente literal.
