revisions:
- from: Dê a todo aquele que lhe pedir e não exija de volta; pois o Pai quer que seus próprios dons sejam dados a todos.[a] Feliz aquele que dá segundo o mandamento, pois está isento de culpa. Mas ai daquele que recebe! Pois, se alguém recebe por estar necessitado, ficará isento de culpa; mas quem recebe sem ter necessidade responderá por que recebeu e com que finalidade.[b] Depois de ser posto em detenção,[c] será interrogado a respeito do que fez e não sairá dali até pagar o último quadrante.[d]
  to: Dê a todo aquele que lhe pedir e não exija de volta; pois o Pai quer que seus próprios dons sejam dados a todos.[a] Feliz aquele que dá segundo o mandamento, pois está isento de culpa. Mas ai daquele que recebe! Pois, se alguém recebe por estar necessitado, ficará isento de culpa; mas quem recebe sem ter necessidade pagará a pena pela razão por que recebeu e pela finalidade para a qual o recebeu.[b] Estando em confinamento,[c] será interrogado a respeito do que fez e não sairá dali até pagar o último quadrante.[d]
