  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Παντὶ τῷ αἰτοῦντί σε δίδου καὶ μὴ ἀπαίτει· πᾶσι γὰρ θέλει δίδοσθαι ὁ πατὴρ ἐκ τῶν ἰδίων χαρισμάτων. Μακάριος ὁ διδοὺς κατὰ τὴν ἐντολήν· ἀθῷος γάρ ἐστιν· οὐαὶ τῷ λαμβάνοντι· εἰ μὲν γὰρ χρείαν ἔχων λαμβάνει τις, ἀθῷος ἔσται· ὁ δὲ μὴ χρείαν ἔχων δώσει δίκην, ἱνατί ἔλαβε καὶ εἰς τί, ἐν συνοχῇ δὲ γενόμενος ἐξετασθήσεται περὶ ὧν ἔπραξε, καὶ οὐκ ἐξελεύσεται ἐκεῖθεν μέχρις οὗ ἀποδῷ τὸν ἔσχατον κοδράντην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/005.yaml
  text: Give to everyone who asks you[a], and do not demand it back; for the Father wants his own gifts to be given to all. Blessed is the one who gives according to the commandment, for he is innocent. But woe to the one who receives; for if someone receives while having need, he will be innocent, but the one not having need will pay the penalty for why he received and for what purpose. And having come under confinement, he will be examined concerning the things he did[b], and he will not come out from there until he repays the last quadrans.
translation:
  language: pt
  text: Dê a todo aquele que lhe pedir e não exija de volta; pois o Pai quer que seus próprios dons sejam dados a todos.[a] Feliz aquele que dá segundo o mandamento, pois está isento de culpa. Mas ai daquele que recebe! Pois, se alguém recebe por estar necessitado, ficará isento de culpa; mas quem recebe sem ter necessidade pagará a pena pela razão por que recebeu e pela finalidade para a qual o recebeu.[b] Estando em confinamento,[c] será interrogado a respeito do que fez e não sairá dali até pagar o último quadrante.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois o Pai quer que se dê a todos a partir de seus próprios dons”.'
    reason: A construção grega é passiva e permite pequena variação na relação entre aquilo que é dado e os dons pertencentes ao Pai.
  - marker: b
    text: 'Ou: “pagará a pena por ter recebido e pelo propósito para o qual o fez”.'
    reason: A expressão grega δώσει δίκην indica pagar ou sofrer uma pena; ἱνατί e εἰς τί perguntam, respectivamente, pela razão e pela finalidade do recebimento.
  - marker: c
    text: 'Ou: “ao se encontrar em aflição”.'
    reason: συνοχή pode indicar confinamento ou aperto, mas também aflição e angústia.
  - marker: d
    text: O quadrante era uma moeda romana de cobre de valor muito baixo.
    reason: A nota esclarece ao leitor moderno a referência monetária antiga sem substituir a unidade no texto.
lexical_decisions:
- source_word: ἀπαίτει
  choice: exija de volta
  rationale: O verbo significa exigir ou reclamar de volta; a formulação explicita naturalmente em português a restituição implícita no contexto.
- source_word: χαρισμάτων
  choice: dons
  rationale: Preserva a ideia de dádivas concedidas gratuitamente, sem restringi-la a uma categoria técnica de dons espirituais.
- source_word: ἀθῷος
  choice: isento de culpa
  rationale: Expressa o sentido jurídico e moral de não estar sujeito a culpa ou condenação.
- source_word: δώσει δίκην
  choice: responderá
  rationale: A expressão pode indicar prestar contas ou sofrer pena. No contexto de interrogatório e detenção, 'responderá' mantém a dimensão judicial sem decidir antecipadamente entre prestação de contas e punição; a alternativa é registrada em nota.
- source_word: συνοχῇ
  choice: detenção
  rationale: O contexto de não sair dali até pagar favorece uma situação de confinamento, embora o substantivo também possa indicar aflição ou angústia; essa amplitude é preservada em nota.
- source_word: κοδράντην
  choice: quadrante
  rationale: É a forma portuguesa tradicional para quadrans, moeda romana de cobre de valor muito baixo, e preserva a referência monetária antiga.
theological_decisions:
- issue: Agência e procedência dos dons em πᾶσι... δίδοσθαι... ἐκ τῶν ἰδίων χαρισμάτων
  choice: o Pai quer que seus próprios dons sejam dados a todos
  alternative: o Pai quer que se dê a todos a partir de seus próprios dons
  rationale: A formulação principal conserva o Pai como possuidor e fonte dos dons e mantém a construção passiva do grego, sem definir quem realiza a distribuição.
- issue: Caráter do juízo sobre quem recebe sem necessidade
  choice: responderá por que recebeu e com que finalidade
  alternative: pagará a pena por ter recebido e pelo uso que fez do que recebeu
  rationale: A escolha preserva a tensão entre prestação de contas e punição inerente a δώσει δίκην e evita ampliar εἰς τί para uma descrição específica do uso posterior.
- issue: Imagem final de confinamento e pagamento
  choice: detenção... não sairá dali até pagar
  alternative: angústia... não escapará até restituir
  rationale: A redação principal segue a coerência da metáfora judicial e carcerária, mas a nota reconhece que συνοχή pode denotar aflição em vez de custódia literal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “lhe” para evitar regionalismo excessivo. A cadência exortativa e judicial do grego foi mantida, empregando “Feliz” em vez de uma forma mais arcaica e marcando em notas as ambiguidades lexicais relevantes.
