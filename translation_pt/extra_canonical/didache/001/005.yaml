  terminology: «Dons», «isento de culpa», «confinamento» e «quadrante» são escolhas adequadas. «Confinamento» preserva melhor do que «detenção» a elasticidade de συνοχή, que pode evocar aperto/aflição, embora o contexto favoreça custódia.
