  source_fidelity: 'A tradução acompanha de perto o grego: conserva a dupla qualificação dos desejos, a sequência de injunções e a distinção entre “manto” (ἱμάτιον) e “túnica” (χιτών). A oração final mantém corretamente a elipse de οὐδὲ γὰρ δύνασαι, assinalada em nota. Contudo, “vá com ele duas” omite em português o substantivo exigido pela construção e soa incompleto; o grego elide “milhas”, mas o português deve explicitá-lo para reproduzir o sentido de modo inteligível.'
  naturalness: O registro é claro e moderno. A revisão de “vá com ele duas” para “vá com ele por duas milhas” torna a frase idiomática sem acrescentar interpretação indevida.
  terminology: “Desejos carnais e mundanos”, “bofetada”, “perfeito”, “milha”, “manto” e “túnica” são escolhas adequadas. “Perfeito” preserva a força de τέλειος sem impor uma leitura teológica específica.
  issues:
