source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀπέχου τῶν σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν. Ἐάν τις σοὶ δῷ ῥάπισμα εἰς τὴν δεξιὰν σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην, καὶ ἔσῃ τέλειος· ἐὰν ἀγγαρεύσῃ σε τις μίλιον ἕν, ὕπαγε μετʼ αὐτοῦ δύο· ἐὰν ἄρῃ τις τὸ ἱμάτιόν σου, δὸς αὐτῷ καὶ τὸν χιτῶνα· ἐὰν λάβῃ τις ἀπὸ σοῦ τὸ σόν, μὴ ἀπαίτει· οὐδὲ γὰρ δύνασαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/004.yaml
  text: Abstain from fleshly and worldly desires. If anyone gives you a blow on the right cheek[a], turn to him the other also, and you will be perfect. If anyone compels you to go one mile, go with him two. If anyone takes away your cloak, give him your tunic also. If anyone takes from you what is yours, do not demand it back, for you are not able.
translation:
  language: pt
  text: Abstenha-se dos desejos carnais e mundanos. Se alguém lhe der uma bofetada na face direita, ofereça-lhe também a outra, e você será perfeito. Se alguém o obrigar a percorrer uma milha, vá com ele por duas milhas. Se alguém tomar o seu manto, dê-lhe também a túnica. Se alguém tirar de você o que é seu, não o exija de volta, pois nem sequer pode.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz apenas “pois nem sequer pode”, sem explicitar o que não se pode fazer.
    reason: Preserva e assinala a concisão ambígua da oração final.
lexical_decisions:
- source_word: Ἀπέχου
  choice: Abstenha-se
  rationale: Expressa com naturalidade a ordem, dirigida a uma só pessoa, de manter distância dos desejos mencionados.
- source_word: σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν
  choice: dos desejos carnais e mundanos
  rationale: Preserva os dois qualificativos gregos e sua distinção, sem explicar além do texto.
- source_word: ῥάπισμα
  choice: uma bofetada
  rationale: Designa naturalmente um golpe dado no rosto e corresponde ao contexto da face direita.
- source_word: τέλειος
  choice: perfeito
  rationale: Mantém a formulação forte e teologicamente carregada do grego, em vez de reduzi-la a 'maduro' ou 'completo'.
- source_word: ἀγγαρεύσῃ
  choice: o obrigar a percorrer
  rationale: O verbo indica compelir ou requisitar serviço; 'percorrer' torna explícito em português o movimento implícito pela distância de uma milha.
- source_word: ἱμάτιον / χιτών
  choice: manto / túnica
  rationale: Mantém a distinção entre a veste exterior e a peça usada por baixo.
- source_word: μὴ ἀπαίτει
  choice: não o exija de volta
  rationale: O verbo pode significar reclamar ou exigir a restituição; a formulação portuguesa deixa claro o sentido contextual.
theological_decisions:
- issue: Sentido de τέλειος
  choice: perfeito
  alternative: completo; maduro
  rationale: Embora o termo possa ter a ideia de plenitude ou maturidade, 'perfeito' preserva a força e a tensão da afirmação sem a suavizar.
- issue: Complemento implícito em οὐδὲ γὰρ δύνασαι
  choice: pois nem sequer pode
  alternative: pois você não pode recuperá-lo; pois você não tem esse poder
  rationale: O grego não declara expressamente o que a pessoa não pode fazer. A tradução preserva essa concisão e ambiguidade, com nota explicativa.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento naturais para leitores brasileiros. Os imperativos seguem a concordância de “você”. Mantêm-se os termos culturais “milha”, “manto” e “túnica”, compreensíveis no contexto antigo.
