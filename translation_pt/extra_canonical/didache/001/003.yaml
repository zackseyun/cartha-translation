  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τούτων δὲ τῶν λόγων ἡ διδαχὴ ἐστὶν αὕτη· Εὐλογεῖτε τοὺς καταρωμένους ὑμῖν καὶ προσεύχεσθε ὑπὲρ τῶν ἐχθρῶν ὑμῶν, νηστεύετε δὲ ὑπὲρ τῶν διωκόντων ὑμᾶς· ποία γὰρ χάρις, ἐὰν ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς· οὐχὶ καὶ τὰ ἔθνη τὸ αὐτὸ ποιοῦσιν ; ὑμεῖς δὲ ἀγαπᾶτε τοὺς μισοῦντας ὑμᾶς καὶ οὐχ ἕξετε ἐχθρόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/003.yaml
  text: 'And the teaching of these words is this: bless those who curse you, and pray for your enemies, and fast for those who persecute you. For what credit is it if you love those who love you? Do not even the Gentiles do the same? But you, love those who hate you, and you will not have an enemy.'
translation:
  language: pt
  text: 'E o ensino dessas palavras é este: abençoem os que amaldiçoam vocês, orem por seus inimigos e jejuem pelos que perseguem vocês. Pois que mérito há em amar os que amam vocês? Até os gentios fazem o mesmo, não fazem? Vocês, porém, amem os que odeiam vocês, e não terão inimigo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διδαχή
  choice: ensino
  rationale: Expressa de modo natural a ideia de instrução transmitida, sem restringi-la a doutrina formal.
- source_word: χάρις
  choice: mérito
  rationale: No contexto da pergunta retórica, indica o valor ou crédito especial de amar apenas quem retribui o amor; evita aqui o sentido teológico técnico de “graça”.
- source_word: τὰ ἔθνη
  choice: os gentios
  rationale: Preserva a designação judaico-cristã tradicional para as nações não judaicas e mantém a referência histórico-religiosa do texto.
- source_word: ἐχθρόν
  choice: inimigo
  rationale: Mantém a formulação singular e forte do grego, cuja consequência ética permanece deliberadamente abrangente.
theological_decisions:
- issue: Sentido da promessa “não terão inimigo”
  choice: Preservar literalmente a afirmação sem explicá-la como ausência de inimizade da parte do discípulo ou como reconciliação garantida.
  alternative: “vocês não tratarão ninguém como inimigo”
  rationale: O grego οὐχ ἕξετε ἐχθρόν afirma literalmente que não se terá inimigo; uma paráfrase resolveria uma tensão que o texto deixa aberta.
- issue: Jejum pelos perseguidores
  choice: Manter “jejuem pelos que perseguem vocês”.
  alternative: Omitir a oração como possível expansão textual ou harmonização.
  rationale: A expressão está presente na fonte grega fornecida e constitui uma exigência própria desta forma textual da Didaquê.
translation_notes:
  register: Português atual, digno e acessível, com formas verbais no plural dirigidas diretamente aos leitores. Emprega “vocês” para ampla legibilidade brasileira, sem coloquialismo excessivo. A coordenação e as perguntas retóricas seguem de perto o movimento do grego.
