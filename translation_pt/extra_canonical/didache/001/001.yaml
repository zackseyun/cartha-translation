  text: Ὁδοὶ δύο εἰσί, μία τῆς ζωῆς καὶ μία τοῦ θανάτου, διαφορὰ δὲ πολλὴ μεταξὺ τῶν δύο ὁδῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/001.yaml
  text: There are two ways, one of life and one of death, and there is a great difference between the two ways.
translation:
  language: pt
  text: 'Há dois caminhos: um, o da vida; outro, o da morte. E há uma grande diferença entre os dois caminhos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ
  choice: caminhos
  rationale: Equivalente direto e natural, preservando a imagem ética dos dois modos de viver.
- source_word: μία τῆς ζωῆς καὶ μία τοῦ θανάτου
  choice: um, o da vida; outro, o da morte
  rationale: Explicita em português a oposição distributiva expressa pelo grego μία... μία, sem acrescentar conteúdo.
- source_word: διαφορὰ δὲ πολλὴ
  choice: E há uma grande diferença
  rationale: Reproduz a construção existencial e mantém a intensidade de πολλή; δέ funciona aqui como conexão discursiva.
- source_word: μεταξὺ τῶν δύο ὁδῶν
  choice: entre os dois caminhos
  rationale: Tradução formal e idiomática que conserva a repetição enfática de 'caminhos'.
theological_decisions:
- issue: A imagem dos dois caminhos
  choice: Manter 'caminhos' sem paráfrase interpretativa
  alternative: Traduzir como 'modos de viver' ou explicar como escolhas morais
  rationale: O texto apresenta uma metáfora tradicional e teologicamente aberta; mantê-la evita restringir indevidamente seu alcance.
translation_notes:
  register: Português moderno, claro e digno, com pontuação que torna natural a estrutura antitética do grego. A repetição de 'caminhos' foi preservada por seu valor retórico.
