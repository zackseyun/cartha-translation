source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ μὲν οὖν ὁδὸς τῆς ζωῆς ἐστιν αὕτη· πρῶτον, ἀγαπήσεις τὸν Θεὸν τὸν ποιήσαντά σε· δεύτερον, τὸν πλησίον σου ὡς σεαυτόν· πάντα δὲ ὅσα ἐὰν θελήσῃς μὴ γίνεσθαί σοι, καὶ σὺ ἄλλῳ μὴ ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/002.yaml
  text: 'This is the way of life: first[a], you shall love God who made you; second, your neighbor as yourself. And whatever you would not want to happen to you, do not do to another either.'
translation:
  language: pt
  text: 'O caminho da vida é, portanto, este: primeiro, amarás a Deus, que te fez; segundo, amarás o teu próximo como a ti mesmo. E tudo o que não quiseres que te aconteça, tu também não faças isso a outro.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ μὲν οὖν ὁδὸς τῆς ζωῆς
  choice: O caminho da vida é, portanto
  rationale: Preserva a expressão central «caminho da vida» e representa οὖν como conexão conclusiva, sem introduzir uma referência temporal inexistente.
- source_word: ἀγαπήσεις
  choice: amarás
  rationale: Mantém a forma futura grega empregada com força de mandamento, de modo natural no registro bíblico português.
- source_word: τὸν Θεὸν τὸν ποιήσαντά σε
  choice: a Deus, que te fez
  rationale: Traduz diretamente a identificação de Deus como criador do destinatário.
- source_word: τὸν πλησίον σου ὡς σεαυτόν
  choice: o teu próximo como a ti mesmo
  rationale: Conserva a formulação tradicional e semanticamente direta, deixando implícito o verbo repetido, como no grego.
- source_word: πάντα δὲ ὅσα ἐὰν θελήσῃς μὴ γίνεσθαί σοι
  choice: E tudo o que não quiseres que te aconteça
  rationale: Expressa a construção indefinida e eventual do grego em português corrente, sem restringir o alcance de πάντα ὅσα.
- source_word: καὶ σὺ ἄλλῳ μὴ ποίει
  choice: tu também não faças a outra pessoa
  rationale: A presença explícita de «tu» e de «também» preserva a ênfase de καὶ σύ e mantém a proibição dirigida pessoalmente ao leitor.
theological_decisions:
- issue: Forma do mandamento de amar
  choice: amarás
  alternative: ama
  rationale: O futuro português reflete a forma ἀγαπήσεις e sua força imperativa sem enfraquecer o caráter normativo.
- issue: Formulação negativa da regra de ouro
  choice: não faças a outra pessoa
  alternative: não causes a outra pessoa
  rationale: «Faças» conserva o verbo amplo ποιεῖν e evita limitar o preceito apenas àquilo que alguém causa diretamente.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa do singular coerentes («te», «teu», «ti», «quiseres», «faças»). A sintaxe mantém o paralelismo catequético e a concisão do grego.
