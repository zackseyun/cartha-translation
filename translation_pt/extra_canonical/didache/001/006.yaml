base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/006.yaml
  text: 'But about this also it has been said: Let your alms sweat in your hands until you know to whom you should give.'
translation:
  language: pt
  text: 'Mas também a esse respeito foi dito: “Que a sua esmola sue em suas mãos, até que você saiba a quem dar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: esmola
  rationale: Traduz diretamente a ajuda material dada por misericórdia aos necessitados e preserva a imagem concreta da frase.
- source_word: Ἱδρωσάτω
  choice: Que ... sue
  rationale: Mantém a metáfora deliberadamente marcante do grego, que recomenda cautela antes de entregar a ajuda.
- source_word: εἰς τὰς χεῖράς σου
  choice: em suas mãos
  rationale: Reproduz a expressão espacial da fonte de modo natural em português.
- source_word: μέχρις ἂν γνῷς τίνι δῷς
  choice: até que você saiba a quem dar
  rationale: Preserva a construção aberta do original, sem acrescentar critérios ou explicações sobre quem deve receber.
theological_decisions:
- issue: Relação entre generosidade e discernimento
  choice: Preservar literalmente a exortação a deixar a esmola ‘suar’ até saber a quem dar.
  alternative: Explicitar que se deve investigar se o destinatário é merecedor ou necessitado.
  rationale: O texto exige discernimento, mas não define aqui os critérios; explicitá-los resolveria uma tensão que o grego deixa em aberto.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “você” para ampla legibilidade brasileira. A metáfora incomum “sue em suas mãos” foi mantida por ser central à força retórica do original.
