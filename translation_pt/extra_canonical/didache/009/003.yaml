  text: Περὶ δὲ τοῦ κλάσματος· Εὐχαριστοῦμέν σοι, Πάτερ ἡμῶν, ὑπὲρ τῆς ζωῆς καὶ γνώσεως, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/003.yaml
  text: 'And concerning the broken bread:


    We give thanks to you, our Father,

    for the life and knowledge

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: pt
  text: 'E quanto ao pão partido:


    Nós te damos graças, nosso Pai,


    pela vida e pelo conhecimento


    que nos deste a conhecer por meio de Jesus, teu servo[a].


    A ti seja a glória para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «teu filho»; o grego pais também pode significar «menino».'
    reason: παῖς pode designar «servo» ou «filho/menino»; «servo» é apropriado no contexto, mas a nota preserva a ambiguidade lexical.
lexical_decisions:
- source_word: κλάσματος
  choice: pão partido
  rationale: O substantivo significa literalmente “fragmento” ou “aquilo que foi partido”; neste contexto eucarístico, “pão partido” explicita naturalmente o referente sem acrescentar interpretação denominacional.
- source_word: Εὐχαριστοῦμέν
  choice: damos graças
  rationale: Reproduz o sentido verbal corrente de agradecer, preservando a forma de oração.
- source_word: ζωῆς καὶ γνώσεως
  choice: vida e conhecimento
  rationale: Mantém os dois substantivos e sua amplitude sem explicar a natureza da vida ou do conhecimento.
- source_word: ἐγνώρισας
  choice: deste a conhecer
  rationale: Expressa o valor causativo de “tornar conhecido” e conserva a relação lexical com “conhecimento”.
- source_word: παιδός
  choice: servo
  rationale: παῖς pode significar “filho”, “menino” ou “servo”; no uso religioso grego e no contexto da Didaquê, “servo” é uma tradução sólida, embora a ambiguidade lexical seja reconhecida em nota.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático português da fórmula de duração indefinida, adequado ao registro doxológico.
theological_decisions:
- issue: Referente de κλάσμα na oração eucarística
  choice: pão partido
  alternative: fragmento / aquilo que foi partido
  rationale: O contexto imediato identifica uma oração sobre o alimento partido; “pão partido” é claro e natural, sem definir uma doutrina sacramental.
- issue: Sentido cristológico de παῖς
  choice: servo
  alternative: filho
  rationale: A tradução “servo” preserva a ressonância bíblica do servo de Deus e evita confundir παῖς com o termo grego mais específico para “filho”, υἱός. Como παῖς admite mais de um sentido, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e reverente, com cadência de oração comunitária. A formulação evita vocabulário sacramental denominacional e mantém o paralelismo conciso do grego.
