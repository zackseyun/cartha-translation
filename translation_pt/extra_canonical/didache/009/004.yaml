revisions:
- from: Assim como este pedaço de pão[a] estava espalhado sobre os montes e, depois de reunido, tornou-se um só, assim também seja reunida a tua igreja, desde os confins da terra, no teu reino. Pois teus são a glória e o poder, por meio de Jesus Cristo, para sempre.
  to: Assim como este fragmento estava espalhado sobre os montes e, depois de reunido, tornou-se um só, assim seja reunida a tua igreja, dos confins da terra para o teu reino. Pois a glória e o poder são teus, por meio de Jesus Cristo, para sempre.
  rationale: A revisão substitui a explicitação contextual “pedaço de pão” por “fragmento” e traduz εἰς pelo direcional “para”. Também simplifica levemente a formulação portuguesa, preservando a petição passiva e o registro solene do original. Não é necessária nota, pois a tradução escolhida não acrescenta nem oculta uma variante ou ambiguidade relevante.
