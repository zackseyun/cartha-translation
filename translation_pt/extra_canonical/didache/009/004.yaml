  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὥσπερ ἦν τοῦτο κλάσμα διεσκορπισμένον ἐπάνω τῶν ὀρέων καὶ συναχθὲν ἐγένετο ἕν, οὕτω συναχθήτω σου ἡ ἐκκλησία ἀπὸ τῶν περάτων τῆς γῆς εἰς τὴν σὴν βασιλείαν· ὅτι σοῦ ἐστιν ἡ δόξα καὶ ἡ δύναμις διὰ Ἰησοῦ Χριστοῦ εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/004.yaml
  text: Just as this fragment was scattered upon the mountains and[a], when gathered together, became one, so let your assembly be gathered together from the ends of the earth into your kingdom. For yours is the glory and the power through Jesus Messiah forever.
translation:
  language: pt
  text: Assim como este fragmento estava espalhado sobre os montes e, depois de reunido, tornou-se um só, assim seja reunida a tua igreja, dos confins da terra para o teu reino. Pois a glória e o poder são teus, por meio de Jesus Cristo, para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλάσμα
  choice: pedaço de pão
  rationale: O termo designa algo partido ou um fragmento; no contexto eucarístico imediato, refere-se ao pão. A formulação explicita o referente de modo natural, enquanto a nota preserva o sentido lexical mais amplo.
- source_word: ἐκκλησία
  choice: igreja
  rationale: Neste texto cristão antigo, refere-se à comunidade reunida de Deus. “Igreja” é a expressão corrente e inteligível em português, sem exigir aqui o sentido institucional posterior.
- source_word: ἀπὸ τῶν περάτων τῆς γῆς
  choice: desde os confins da terra
  rationale: Mantém a imagem espacial e a preposição de origem da expressão grega em linguagem portuguesa digna e corrente.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: por meio de Jesus Cristo
  rationale: Expressa o valor instrumental de διά e trata Χριστός como o título/nome fixo usual nesta fórmula cristã antiga.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático moderno da fórmula temporal grega, sem alterar seu sentido duradouro.
theological_decisions:
- issue: Destino da reunião da igreja
  choice: no teu reino
  alternative: para o teu reino
  rationale: εἰς pode indicar movimento para dentro ou destino. “No teu reino” conserva a ideia de incorporação ao reino sem definir em excesso a relação escatológica.
- issue: Χριστός como título ou nome fixo
  choice: Jesus Cristo
  alternative: Jesus, o Messias
  rationale: Na fórmula διὰ Ἰησοῦ Χριστοῦ e no provável contexto gentílico da Didaquê, “Cristo” funciona naturalmente como título/nome cristão consolidado; “o Messias” tornaria explícita uma ênfase que o grego não necessariamente destaca aqui.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A oração mantém tom comunitário e solene sem arcaísmos. A construção passiva optativa “seja reunida” reproduz o caráter de petição do grego.
