  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδεὶς δὲ φαγέτω μηδὲ πιέτω ἀπὸ τῆς εὐχαριστίας ὑμῶν, ἀλλ' οἱ βαπτισθέντες εἰς ὄνομα Κυρίου· καὶ γὰρ περὶ τούτου εἴρηκεν ὁ Κύριος· Μὴ δῶτε τὸ ἅγιον τοῖς κυσί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/005.yaml
  text: 'But let no one eat or drink from your thanksgiving except those who have been baptized into the name of the Lord. For also concerning this, the Lord has said: “Do not give what is holy to the dogs.”'
translation:
  language: pt
  text: 'Mas ninguém coma nem beba da ação de graças de vocês, a não ser os que foram batizados em nome do Senhor. Pois, a respeito disso também, o Senhor disse: “Não deem aos cães o que é santo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστίας
  choice: ação de graças
  rationale: Preserva o sentido lexical primário de agradecimento e evita impor retroativamente um sentido técnico-sacramental mais específico, embora o contexto seja uma refeição comunitária.
- source_word: ἀπὸ τῆς εὐχαριστίας ὑμῶν
  choice: da ação de graças de vocês
  rationale: Mantém a construção partitiva e o vínculo explícito com a prática da comunidade.
- source_word: οἱ βαπτισθέντες εἰς ὄνομα Κυρίου
  choice: os que foram batizados em nome do Senhor
  rationale: Formulação natural em português que conserva a referência ao batismo e ao nome do Senhor, sem acrescentar identificação não expressa no texto.
- source_word: τὸ ἅγιον
  choice: o que é santo
  rationale: Reproduz a expressão substantivada de modo idiomático e preserva sua abrangência.
- source_word: τοῖς κυσί
  choice: aos cães
  rationale: Equivalência direta, mantendo a força proverbial da citação.
theological_decisions:
- issue: Sentido de εὐχαριστία no contexto
  choice: ação de graças
  alternative: Eucaristia
  rationale: O termo pode estar adquirindo uso técnico neste contexto, mas seu valor lexical de agradecimento continua perceptível. A tradução preserva essa tensão sem definir uma teologia sacramental posterior.
- issue: Condição para participar da refeição
  choice: a não ser os que foram batizados em nome do Senhor
  alternative: exceto os batizados no nome do Senhor
  rationale: Mantém a restrição explícita do texto sem ampliar quem administra o batismo, sua fórmula ou seus efeitos.
- issue: Aplicação da palavra do Senhor
  choice: Pois, a respeito disso também
  alternative: Porque também sobre isso
  rationale: Conserva a afirmação do autor de que a citação se aplica à prática mencionada, sem explicar além do que o grego declara.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A segunda pessoa plural foi vertida por “vocês”, natural no Brasil e amplamente inteligível; o imperativo “não deem” concorda com essa escolha.
