source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πρῶτον περὶ τοῦ ποτηρίου· Εὐχαριστοῦμέν σοι, Πάτερ ἡμῶν, ὑπὲρ τῆς ἁγίας ἀμπέλου Δαβὶδ τοῦ παιδός σου, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/002.yaml
  text: 'First, concerning the cup:


    We give thanks to you, our Father,

    for the holy vine of David your servant,

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: pt
  text: 'Primeiro, a respeito do cálice:


    Damos-te graças, nosso Pai,

    pela santa videira de Davi, teu servo,

    que nos deste a conhecer por meio de Jesus, teu servo.

    A ti seja a glória para sempre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποτηρίου
  choice: cálice
  rationale: No contexto de uma ação de graças comunitária, «cálice» preserva o sentido concreto e o registro litúrgico de ποτήριον.
- source_word: Εὐχαριστοῦμέν
  choice: Damos-te graças
  rationale: Expressa naturalmente o sentido verbal de agradecer, sem antecipar o uso técnico posterior de «Eucaristia».
- source_word: ἁγίας ἀμπέλου
  choice: santa videira
  rationale: Mantém a metáfora explícita do grego e sua possível ressonância messiânica e comunitária.
- source_word: παιδός
  choice: servo
  rationale: παῖς pode significar «servo» ou «filho». «Servo» corresponde ao uso bíblico aplicado a Davi e permite conservar o paralelismo deliberado entre Davi e Jesus.
- source_word: ἐγνώρισας
  choice: deste a conhecer
  rationale: Traduz o valor causativo de γνωρίζω de modo corrente e digno em português.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático e natural da fórmula doxológica grega.
theological_decisions:
- issue: Sentido de παῖς aplicado a Jesus
  choice: servo
  alternative: filho
  rationale: O mesmo termo designa Davi e Jesus na frase. Traduzir ambos por «servo» preserva o paralelismo lexical e a linguagem bíblica do servo de Deus, sem negar que «filho» seja semanticamente possível em outros contextos.
- issue: Referente da santa videira de Davi
  choice: preservar a metáfora sem explicá-la
  alternative: identificá-la explicitamente com Jesus, Israel, a linhagem davídica ou o vinho
  rationale: O texto não define de maneira inequívoca o referente; explicitá-lo resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém-se a estrutura poética e responsiva da oração, com tratamento reverente na segunda pessoa do singular e sem arcaísmos desnecessários.
