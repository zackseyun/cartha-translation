  source_fidelity: 'A tradução preserva com precisão a sequência e as relações sintáticas do grego: «cálice» para ποτήριον, ação de graças dirigida ao Pai, «santa videira de Davi, teu servo», o relativo referente à videira, a mediação «por meio de Jesus, teu servo» e a doxologia final. «Deste a conhecer» reproduz adequadamente o causativo ἐγνώρισας.'
