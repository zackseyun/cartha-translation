  text: 'Concerning the thanksgiving, give thanks in this way:'
translation:
  language: pt
  text: 'Quanto à ação de graças[a], deem graças assim:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eucaristia”.
    reason: O grego εὐχαριστία pode significar “ação de graças” e, neste contexto, também pode referir-se à refeição eucarística.
lexical_decisions:
- source_word: εὐχαριστίας
  choice: ação de graças
  rationale: Preserva o sentido lexical básico de agradecimento e a relação verbal com εὐχαριστήσατε; no contexto, o termo também pode designar a refeição eucarística, possibilidade registrada em nota.
- source_word: εὐχαριστήσατε
  choice: deem graças
  rationale: Traduz diretamente o imperativo aoristo plural e mantém a repetição etimológica presente no grego.
- source_word: οὕτως
  choice: assim
  rationale: Introduz de modo natural as fórmulas de agradecimento que vêm a seguir.
- source_word: δὲ
  choice: Quanto a
  rationale: Representa a transição para um novo tópico sem acrescentar um advérbio temporal inexistente no grego.
theological_decisions:
- issue: Sentido de εὐχαριστία
  choice: ação de graças no texto, com “Eucaristia” em nota
  alternative: Eucaristia
  rationale: O vocábulo conserva seu sentido comum de agradecimento, reforçado pelo verbo cognato, mas o contexto litúrgico permite o sentido técnico; a nota preserva essa tensão sem impor uma leitura.
translation_notes:
  register: Português atual, claro e digno. A construção “Quanto a” marca a mudança de assunto; o plural “deem” dirige a instrução à comunidade. Os dois-pontos preservam a função introdutória da pontuação grega.
