  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/003.yaml
  text: And reprove one another[a], not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents.
translation:
  language: pt
  text: Corrijam uns aos outros, não com ira, mas em paz, como vocês têm no evangelho. E, se alguém pecar contra outra pessoa,[a] ninguém fale com ele, nem ele ouça nada de vocês, até que se arrependa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cometer uma falta contra outra pessoa” ou “ofender outra pessoa”. A expressão grega também pode ter o sentido de errar ou desviar-se em relação ao outro.'
    reason: Preservar a amplitude de ἀστοχέω no contexto de uma transgressão interpessoal.
lexical_decisions:
- source_word: Ἐλέγχετε
  choice: Corrijam
  rationale: Expressa a ideia de confrontar ou repreender uma falta, em português natural, sem sugerir mera censura hostil.
- source_word: ἐν ὀργῇ / ἐν εἰρήνῃ
  choice: com ira / em paz
  rationale: Mantém o contraste explícito entre uma correção irada e uma correção realizada em paz.
- source_word: ἀστοχοῦντι κατὰ τοῦ ἑτέρου
  choice: se alguém pecar contra outra pessoa
  rationale: No contexto interpessoal, ἀστοχέω indica errar ou cometer uma falta; a construção com κατά sustenta 'contra'. 'Pecar' preserva o peso moral do enunciado.
- source_word: μηδὲ παρ' ὑμῶν ἀκουέτω
  choice: nem lhe deem ouvidos
  rationale: A formulação grega é compacta e admite discussão sintática; esta tradução comunica naturalmente que a comunidade não deve acolher a fala do transgressor.
- source_word: μετανοήσῃ
  choice: se arrependa
  rationale: Equivalente corrente para mudança de mente e atitude diante da falta.
theological_decisions:
- issue: Natureza da disciplina comunitária
  choice: ninguém fale com ele, nem lhe deem ouvidos
  alternative: ninguém lhe dirija a palavra, nem ele ouça nada de vocês
  rationale: A escolha entende ἀκουέτω como 'ser ouvido/receber audiência', em consonância com a consulta inglesa e com o contexto de disciplina. A nota registra a ambiguidade real da expressão.
- issue: Caracterização da falta interpessoal
  choice: pecar contra outra pessoa
  alternative: ofender outra pessoa / agir mal contra outra pessoa
  rationale: '''Pecar'' conserva a dimensão moral e religiosa possível, enquanto a nota reconhece a amplitude lexical de ἀστοχέω.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. O plural 'vocês' torna explícito o destinatário comunitário. Evitou-se linguagem excessivamente técnica ou denominacional.
