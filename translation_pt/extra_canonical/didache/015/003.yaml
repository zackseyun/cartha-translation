revisions:
- from: Corrijam uns aos outros, não com ira, mas em paz, conforme vocês têm no evangelho. E, se alguém pecar contra outra pessoa,[a] ninguém fale com ele, nem lhe deem ouvidos, até que se arrependa.
  to: Corrijam uns aos outros, não com ira, mas em paz, como vocês têm no evangelho. E, se alguém pecar contra outra pessoa,[a] ninguém fale com ele, nem ele ouça nada de vocês, até que se arrependa.
  rationale: A revisão limita-se à cláusula final de disciplina comunitária. Ela traduz o verbo ativo ἀκουέτω e a expressão παρ’ ὑμῶν (“de vocês”) sem decidir além do texto qual seria a forma prática desse afastamento. A nota existente permanece apropriada e corretamente ancorada.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:34:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'A primeira exortação e o contraste entre ira e paz estão bem representados. Contudo, μηδὲ παρ’ ὑμῶν ἀκουέτω tem ἀκουέτω na voz ativa, com o transgressor como sujeito subentendido: ele não deve ouvir nada vindo da comunidade até arrepender-se. A redação proposta, “nem lhe deem ouvidos”, inverte essa relação e introduz a ideia de a comunidade não o escutar.'
  naturalness: O texto é geralmente claro e moderno, mas “ninguém fale com ele, nem lhe deem ouvidos” mistura o sujeito singular “ninguém” com o plural “deem” e, além disso, expressa outro sentido. “Nem ele ouça nada de vocês” é natural e conserva a construção grega.
  terminology: “Corrijam”, “ira”, “em paz”, “pecar contra outra pessoa” e “arrepender-se” são escolhas adequadas. A nota para ἀστοχέω preserva utilmente a amplitude de “errar/desviar-se”, sem eliminar o sentido contextual de falta contra outra pessoa.
  issues:
  - severity: high
    issue: Inversão do sentido de μηδὲ παρ’ ὑμῶν ἀκουέτω
    rationale: A expressão significa literalmente que o infrator não ouça nada “de vocês”; não que vocês não deem ouvidos a ele. A revisão restaura o sujeito e a direção indicados pelo grego.
  - severity: medium
    issue: Inconsistência de pessoa em “ninguém fale ... nem lhe deem ouvidos”
    rationale: “Ninguém” pede verbo no singular, enquanto “deem” está no plural. A reformulação também resolve esse problema semântico e sintático.
  revised_text: Corrijam uns aos outros, não com ira, mas em paz, como vocês têm no evangelho. E, se alguém pecar contra outra pessoa,[a] ninguém fale com ele, nem ele ouça nada de vocês, até que se arrependa.
  revised_footnotes:
