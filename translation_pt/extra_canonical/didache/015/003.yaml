    text: 'Ou: “cometer uma falta contra outra pessoa” ou “ofender outra pessoa”. A expressão grega também pode ter o sentido de errar ou desviar-se em relação ao outro.'
    reason: Preservar a amplitude de ἀστοχέω no contexto de uma transgressão interpessoal.
  revision_rationale: A revisão limita-se à cláusula final de disciplina comunitária. Ela traduz o verbo ativo ἀκουέτω e a expressão παρ’ ὑμῶν (“de vocês”) sem decidir além do texto qual seria a forma prática desse afastamento. A nota existente permanece apropriada e corretamente ancorada.
