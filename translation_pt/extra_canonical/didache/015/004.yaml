  text: But as for your prayers and your alms and all your deeds[a], do them in this way, as you have it in the gospel of our Lord.
translation:
  language: pt
  text: Mas, quanto às suas orações, esmolas e a todas as suas ações, façam-nas assim, como têm no evangelho de nosso Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεημοσύνας
  choice: esmolas
  rationale: O termo designa concretamente donativos destinados aos necessitados; “esmolas” preserva essa referência específica, em vez de ampliá-la para atos de misericórdia em geral.
- source_word: πράξεις
  choice: ações
  rationale: “Ações” é uma tradução ampla e atual para os atos ou feitos abrangidos pelo termo grego.
- source_word: οὕτω ποιήσατε
  choice: façam tudo assim
  rationale: A formulação retoma naturalmente em português a série de objetos antepostos e conserva a ênfase do grego no modo de proceder.
- source_word: ὡς ἔχετε
  choice: conforme vocês têm
  rationale: Mantém a construção do texto grego e evita explicitar indevidamente se a referência é ao conteúdo escrito, recebido ou conhecido pela comunidade.
theological_decisions:
- issue: Sentido de “evangelho de nosso Senhor”
  choice: evangelho de nosso Senhor
  alternative: Evangelho de nosso Senhor
  rationale: A minúscula preserva a ambiguidade entre a mensagem evangélica e uma tradição ou texto evangélico específico, sem impor uma identificação canônica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A topicalização inicial do grego foi preservada por “Quanto a...”, e o pronome de tratamento “vocês” explicita o plural comunitário sem recorrer a formas regionais ou arcaizantes.
