source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ οὖν ὑπερίδητε αὐτούς· αὐτοὶ γάρ εἰσιν οἱ τετιμημένοι ὑμῶν μετὰ τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/002.yaml
  text: Therefore do not disregard them, for they are the ones honored by you, together with the prophets and teachers.
translation:
  language: pt
  text: Portanto, não os desprezem, pois são eles os que vocês honram, juntamente com os profetas e mestres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερίδητε
  choice: desprezem
  rationale: O verbo significa olhar com desdém, menosprezar ou desconsiderar. “Desprezem” comunica de modo natural e vigoroso a proibição no português atual.
- source_word: οἱ τετιμημένοι ὑμῶν
  choice: os que recebem honra entre vocês
  rationale: Preserva o valor passivo do particípio perfeito τετιμημένοι e evita a formulação pouco natural “os honrados de vocês”. “Entre vocês” entende o genitivo ὑμῶν como referência à comunidade na qual eles são reconhecidos e honrados.
- source_word: μετὰ τῶν προφητῶν καὶ διδασκάλων
  choice: juntamente com os profetas e mestres
  rationale: Reproduz de forma direta a associação dos referidos líderes com profetas e mestres, sem identificar ou fundir os grupos.
theological_decisions:
- issue: Status dos líderes mencionados em relação a profetas e mestres
  choice: “juntamente com” conserva a associação e a honra compartilhada
  alternative: Traduzir de modo a sugerir que todos pertencem ao mesmo ofício
  rationale: O grego afirma que eles são honrados com os profetas e mestres, mas não define que os ofícios sejam idênticos; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com imperativo dirigido à comunidade no plural. A expressão “recebem honra entre vocês” soa natural e mantém a voz passiva e o aspecto de reconhecimento estabelecido presentes no grego.
