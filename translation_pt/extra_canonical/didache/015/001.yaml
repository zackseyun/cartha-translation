source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Χειροτονήσατε οὖν ἑαυτοῖς ἐπισκόπους καὶ διακόνους ἀξίους τοῦ Κυρίου, ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους· ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/001.yaml
  text: Appoint, then, for yourselves overseers and deacons worthy of the Lord—men who are gentle, not lovers of money, truthful, and proven; for they too perform for you the ministry of the prophets and teachers.
translation:
  language: pt
  text: 'Portanto, escolham para vocês bispos e diáconos dignos do Senhor: homens mansos, não apegados ao dinheiro, verdadeiros e aprovados; pois eles também desempenham para vocês o ministério dos profetas e mestres.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χειροτονήσατε
  choice: escolham
  rationale: No contexto comunitário, o verbo indica escolher ou designar pessoas para uma função. “Escolham” preserva a participação da comunidade sem especificar um rito posterior de ordenação.
- source_word: ἐπισκόπους
  choice: bispos
  rationale: “Bispos” é o equivalente histórico e amplamente reconhecido de ἐπίσκοποι; aqui mantém o título antigo sem pressupor toda a estrutura episcopal desenvolvida posteriormente.
- source_word: διακόνους
  choice: diáconos
  rationale: Transliteração tradicional e corrente em português para o ofício comunitário indicado pelo grego.
- source_word: πραεῖς
  choice: mansos
  rationale: Expressa brandura, gentileza e ausência de agressividade, preservando o tom moral do termo.
- source_word: ἀφιλαργύρους
  choice: não apegados ao dinheiro
  rationale: Formulação natural que comunica ausência de amor ao dinheiro, sem limitar o sentido apenas à avareza ativa.
- source_word: ἀληθεῖς
  choice: verdadeiros
  rationale: Preserva a amplitude do adjetivo, que pode envolver veracidade e autenticidade pessoal.
- source_word: δεδοκιμασμένους
  choice: aprovados
  rationale: O particípio perfeito indica pessoas provadas e reconhecidas como idôneas.
- source_word: λειτουργοῦσι ... τὴν λειτουργίαν
  choice: exercem ... o ministério
  rationale: Reproduz de modo natural o cognato grego, comunicando o desempenho de um serviço religioso ou comunitário.
- source_word: ὑμῖν
  choice: entre vocês
  rationale: O dativo pode indicar serviço prestado à comunidade; “entre vocês” soa natural e destaca o âmbito comunitário, embora “para vocês” também seja possível.
theological_decisions:
- issue: Forma de designação dos líderes
  choice: escolham
  alternative: nomeiem / ordenem
  rationale: O texto não define sozinho o procedimento ritual nem uma estrutura denominacional específica; “escolham” preserva o sentido básico de seleção comunitária.
- issue: Relação do ministério dos bispos e diáconos com o dos profetas e mestres
  choice: exercem entre vocês o ministério dos profetas e mestres
  alternative: prestam a vocês o mesmo serviço dos profetas e mestres
  rationale: A redação mantém a afirmação de correspondência funcional sem declarar identidade absoluta entre os ofícios nem estabelecer uma teoria de sucessão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. Mantêm-se os títulos históricos “bispos” e “diáconos”; a sintaxe procura conservar a sequência exortação–qualificações–fundamento do grego.
