source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὡσαύτως κεράμιον οἴνου ἢ ἐλαίου ἀνοίξας, τὴν ἀπαρχὴν λαβὼν δὸς τοῖς προφήταις·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/006.yaml
  text: Likewise, when you open a jar of wine or oil, take the firstfruits and give them to the prophets.
translation:
  language: pt
  text: Do mesmo modo, quando você abrir um recipiente de vinho ou de azeite, separe as primícias e dê aos profetas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: Do mesmo modo
  rationale: Equivalente natural e digno que preserva a ligação com as instruções anteriores.
- source_word: κεράμιον
  choice: recipiente
  rationale: O termo designa um vaso ou jarro, normalmente de barro; “recipiente” comunica a função sem impor uma forma específica não exigida pelo contexto.
- source_word: ἐλαίου
  choice: azeite
  rationale: Neste contexto alimentar e agrícola, refere-se naturalmente ao azeite de oliva, para o qual “azeite” é a forma corrente em português.
- source_word: τὴν ἀπαρχὴν
  choice: as primícias
  rationale: Mantém o termo tradicional e reconhecível para a primeira porção separada como oferta; o plural idiomático em português expressa adequadamente o substantivo coletivo singular grego.
- source_word: λαβὼν δὸς
  choice: separe ... e dê
  rationale: O particípio seguido do imperativo indica tomar a primeira porção e entregá-la; “separe” torna clara essa ação em português natural.
theological_decisions:
- issue: Destinatários das primícias
  choice: aos profetas
  alternative: para os profetas
  rationale: Preserva diretamente o dativo τοῖς προφήταις e não acrescenta explicações sobre a função ou autoridade desses profetas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva “primícias” por sua precisão histórico-religiosa, enquanto usa “recipiente” para evitar uma especificação excessiva do tipo de vaso.
