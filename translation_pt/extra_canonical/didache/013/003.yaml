id: DID.13.3
reference: Didache 13:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶσαν οὖν ἀπαρχὴν γεννημάτων ληνοῦ καὶ ἅλωνος, βοῶν τε καὶ προβάτων λαβὼν δώσεις τοῖς προφήταις· αὐτοὶ γάρ εἰσιν οἱ ἀρχιερεῖς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/003.yaml
  text: Therefore, taking every firstfruit of the produce of the winepress and threshing floor, and of cattle and sheep, you shall give it to the prophets, for they are your high priests.
translation:
  language: pt
  text: Portanto, tomando todas as primícias dos produtos do lagar e da eira, e do gado bovino e das ovelhas, dê-as aos profetas, pois eles são os sumos sacerdotes de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴν
  choice: primícias
  rationale: Termo tradicional e ainda compreensível para a primeira porção da produção oferecida; preserva a linguagem cultual do grego.
- source_word: γεννημάτων
  choice: produtos
  rationale: Expressa de modo natural aquilo que é produzido, sem restringir indevidamente a palavra a frutos ou cereais.
- source_word: ληνοῦ καὶ ἅλωνος
  choice: do lagar e da eira
  rationale: Mantém as duas instalações agrícolas concretas, associadas respectivamente à prensagem e à debulha.
- source_word: βοῶν τε καὶ προβάτων
  choice: dos bois e das ovelhas
  rationale: Representa diretamente as categorias de rebanhos mencionadas no texto.
- source_word: λαβὼν δώσεις
  choice: tomem uma parte e deem-na
  rationale: Reproduz a ideia de retirar a primícia e entregá-la, usando imperativo plural natural em português para o destinatário coletivo.
- source_word: ἀρχιερεῖς
  choice: sumos sacerdotes
  rationale: Equivalente corrente e preciso do título cultual grego.
theological_decisions:
- issue: Identificação dos profetas como ἀρχιερεῖς
  choice: eles são os sumos sacerdotes de vocês
  alternative: eles exercem para vocês a função de sumos sacerdotes
  rationale: A tradução conserva a identificação direta e teologicamente forte feita pelo texto, sem reduzi-la silenciosamente a uma mera analogia funcional.
- issue: Extensão de πᾶσαν ἀπαρχήν
  choice: de todas as primícias ... tomem uma parte
  alternative: tomem todas as primícias
  rationale: Em português, a formulação escolhida comunica cada oferta de primícias como categoria abrangente, evitando a possível impressão de que toda a produção deva ser entregue, embora o grego literalmente use o singular distributivo com πᾶσαν.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. Mantêm-se os termos históricos “primícias”, “lagar”, “eira” e “sumos sacerdotes” por sua precisão contextual. O plural de tratamento explicita o destinatário comunitário indicado por ὑμῶν.
