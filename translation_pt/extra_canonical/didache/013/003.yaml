revisions:
- from: Portanto, de todas as primícias dos produtos do lagar e da eira, e dos bois e das ovelhas, tomem uma parte e deem-na aos profetas, pois eles são os sumos sacerdotes de vocês.
  to: Portanto, tomando todas as primícias dos produtos do lagar e da eira, e do gado bovino e das ovelhas, dê-as aos profetas, pois eles são os sumos sacerdotes de vocês.
  rationale: A revisão elimina o acréscimo interpretativo “uma parte”, restaura o alcance de πᾶσαν ἀπαρχήν como “todas as primícias” e usa uma diretiva singular natural em português, preservando “de vocês” para o plural comunitário de ὑμῶν. Mantêm-se os termos históricos e cultuais centrais.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:34:18Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva os principais termos cultuais, mas altera de modo indevido a construção diretiva singular λαβὼν δώσεις para imperativos plurais e acrescenta “uma parte”, que não está expresso no grego. Πᾶσαν ἀπαρχήν requer a entrega de “todas as primícias”, não apenas de uma porção delas.
  naturalness: A redação é em geral clara, mas “tomem uma parte e deem-na” é menos fiel e cria uma mudança desnecessária de pessoa. A formulação singular com “você/vocês” mantém boa legibilidade brasileira e a distinção do grego entre o destinatário genérico singular e o possessivo comunitário plural.
  terminology: “Primícias”, “lagar”, “eira” e “sumos sacerdotes” são escolhas adequadas. “Gado bovino” comunica melhor βοῶν como categoria de animais do que “bois”, sem sugerir apenas animais de tração.
  issues:
  - severity: medium
    issue: Mudança do singular grego para imperativos plurais
    rationale: λαβὼν e δώσεις estão no singular. Embora ὑμῶν seja plural, ele se refere à comunidade (“de vocês”); a instrução é formulada ao destinatário singular genérico.
  - severity: high
    issue: Acréscimo de “uma parte”
    rationale: O texto grego diz πᾶσαν ἀπαρχήν, “todas as primícias”; “tomem uma parte” enfraquece e modifica o alcance da instrução.
  - severity: low
    issue: “Bois” é mais estreito que βοῶν
    rationale: No contexto de primícias de animais, “gado bovino” representa mais naturalmente a categoria bovina, em paralelo com “ovelhas”.
  revised_text: Portanto, tomando todas as primícias dos produtos do lagar e da eira, e do gado bovino e das ovelhas, dê-as aos profetas, pois eles são os sumos sacerdotes de vocês.
  revised_footnotes: []
