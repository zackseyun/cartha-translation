  text: Ὡσαύτως διδάσκαλος ἀληθινός ἐστιν ἄξιος καὶ αὐτός, ὥσπερ ὁ ἐργάτης, τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/002.yaml
  text: Likewise a true teacher is also himself worthy, like the worker, of his food.
translation:
  language: pt
  text: Do mesmo modo, o verdadeiro mestre também é digno, como o trabalhador, do seu sustento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  choice: Do mesmo modo
  rationale: Expressa naturalmente a ligação comparativa com a instrução anterior.
- source_word: διδάσκαλος ἀληθινός
  choice: o verdadeiro mestre
  rationale: Mantém a qualificação moral de ἀληθινός e usa uma designação clara e digna para quem ensina.
- source_word: ἄξιος
  choice: é digno
  rationale: Conserva a formulação de merecimento presente no grego.
- source_word: ὁ ἐργάτης
  choice: o trabalhador
  rationale: Equivalente amplo e direto, sem restringir o tipo de trabalho.
- source_word: τροφῆς
  choice: sustento
  rationale: No contexto, refere-se ao alimento ou provisão que mantém a pessoa; “sustento” comunica esse sentido de modo natural sem limitá-lo indevidamente a uma refeição.
theological_decisions:
- issue: Força enfática de καὶ αὐτός
  choice: também é digno
  alternative: ele próprio também é digno
  rationale: O valor inclusivo e enfático é preservado por “também”; explicitar “ele próprio” produziria uma construção pesada em português e poderia sugerir um contraste pessoal mais forte do que o necessário.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos.
