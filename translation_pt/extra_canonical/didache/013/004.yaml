lexical_decisions:
- source_word: Ἐὰν δὲ μὴ ἔχητε
  choice: Mas, se vocês não tiverem
  rationale: Reproduz a condição e o contraste do grego em português natural; o plural explícito evita a ambiguidade de número de “você”.
- source_word: προφήτην
  choice: um profeta
  rationale: Equivalente direto de προφήτην, sem acrescentar qualificação teológica.
- source_word: δότε τοῖς πτωχοῖς
  choice: deem aos pobres
  rationale: Mantém a ausência de objeto direto no grego e traduz o dativo τοῖς πτωχοῖς como destinatário da dádiva.
theological_decisions:
- issue: Objeto da ordem de dar
  choice: Não explicitar objeto direto
  alternative: “deem isso aos pobres”
  rationale: O texto grego não apresenta objeto direto; acrescentar “isso” resolveria uma referência que o versículo deixa implícita no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com forma verbal brasileira no plural (“vocês... deem”).
