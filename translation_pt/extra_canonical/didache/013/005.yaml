  text: Ἐὰν σιτιαυτοῖς, τὴν ἀπαρχὴν λαβὼν δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/005.yaml
  text: If you prepare food[a], take the firstfruits and give according to the commandment.
translation:
  language: pt
  text: Se você preparar comida, separe as primícias e dê conforme o mandamento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σιτιαυτοῖς
  choice: preparar comida
  rationale: A forma transmitida nesta edição parece textualmente ou tipograficamente problemática, mas o contexto e a tradição textual apontam para o preparo de alimento. A formulação ampla evita restringir sem necessidade o sentido a pão.
- source_word: ἀπαρχή
  choice: primícias
  rationale: Termo tradicional e preciso para a primeira porção separada como oferta; o plural é mais natural em português neste contexto.
- source_word: λαβών
  choice: separe
  rationale: Embora literalmente indique 'tomar', no contexto de uma oferta das primícias o sentido prático é retirar ou separar a primeira porção.
- source_word: ἐντολή
  choice: mandamento
  rationale: Preserva a referência normativa do termo grego sem especificar além do que o texto declara.
theological_decisions:
- issue: Identidade do mandamento mencionado
  choice: 'manter a referência genérica: ''o mandamento'''
  alternative: identificar explicitamente uma prescrição da Lei ou uma regra comunitária específica
  rationale: O texto não identifica qual mandamento está em vista; explicitar sua origem resolveria indevidamente uma referência aberta.
- issue: Natureza das primícias
  choice: manter 'primícias' sem definir destinatário ou modalidade da oferta
  alternative: explicitar que se trata de dízimo, oferta sacerdotal ou sustento dos profetas
  rationale: O versículo ordena dar as primícias, mas não detalha aqui sua classificação teológica nem repete o destinatário.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para leitura ampla. “Separe as primícias” comunica naturalmente a ação ritual sem perder a concisão do grego.
