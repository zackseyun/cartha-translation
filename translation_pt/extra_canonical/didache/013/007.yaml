id: DID.13.7
reference: Didache 13:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἀργυρίου δὲ καὶ ἱματισμοῦ καὶ παντὸς κτήματος λαβὼν τὴν ἀπαρχὴν ὡς ἂν σοὶ δοξῇ, δὸς κατὰ τὴν ἐντολήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/007.yaml
  text: And of money and clothing and every possession[a], having taken the firstfruit, as it seems good to you, give according to the commandment.
translation:
  language: pt
  text: E, do dinheiro, das roupas e de todos os bens, separe as primícias conforme lhe parecer melhor e dê de acordo com o mandamento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργυρίου
  choice: dinheiro
  rationale: Embora possa significar literalmente “prata”, no grego koiné o termo é usado com frequência para dinheiro; esse sentido se ajusta à enumeração de bens destinados à oferta.
- source_word: ἱματισμοῦ
  choice: roupas
  rationale: Forma corrente e abrangente para vestuário, adequada ao contexto de bens materiais.
- source_word: παντὸς κτήματος
  choice: todos os bens
  rationale: κτῆμα designa aquilo que se possui, uma propriedade ou bem; no plural conceitual da frase, “todos os bens” soa natural e preserva a abrangência.
- source_word: τὴν ἀπαρχήν
  choice: as primícias
  rationale: Mantém o termo cultual e econômico tradicional para a primeira porção separada como oferta; o plural é idiomático em português.
- source_word: ὡς ἂν σοὶ δοξῇ
  choice: conforme lhe parecer melhor
  rationale: Expressa a discricionariedade deixada ao destinatário sem tornar a construção excessivamente literal.
- source_word: δὸς κατὰ τὴν ἐντολήν
  choice: dê de acordo com o mandamento
  rationale: Reproduz diretamente a ordem e preserva a referência não especificada ao mandamento.
theological_decisions:
- issue: Natureza e proporção das primícias sobre bens não agrícolas
  choice: Preservar a liberdade de avaliação em “conforme lhe parecer melhor”
  alternative: Fixar ou sugerir uma porcentagem determinada
  rationale: O texto não estabelece quantidade; deixa ao destinatário decidir como separar as primícias.
- issue: Identidade do mandamento
  choice: Manter “o mandamento” sem explicação no corpo do texto
  alternative: Identificá-lo explicitamente com uma lei bíblica ou norma eclesiástica específica
  rationale: A referência é definida no grego, mas seu conteúdo exato não é explicitado neste versículo; especificá-lo resolveria indevidamente a alusão.
translation_notes:
  register: 'Português moderno, digno e acessível, com legibilidade brasileira. A construção foi reorganizada para fluência: o particípio λαβών foi vertido pelo imperativo contextual “separe”, coordenado com “dê”. “Primícias” preserva a linguagem histórica e religiosa sem recorrer a formulações arcaicas.'
