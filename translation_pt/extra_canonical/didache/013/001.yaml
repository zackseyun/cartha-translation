  text: Πᾶς δὲ προφήτης ἀληθινός, θέλων καθῆσαι πρὸς ὑμᾶς, ἄξιός ἐστι τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/001.yaml
  text: But every true prophet who wishes to settle among you is worthy of his food.
translation:
  language: pt
  text: Mas todo verdadeiro profeta que quiser estabelecer-se entre vocês é digno do seu alimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προφήτης ἀληθινός
  choice: verdadeiro profeta
  rationale: Reproduz diretamente o sentido e a ordem conceitual do grego, sem acrescentar critérios para definir a autenticidade do profeta.
- source_word: καθῆσαι πρὸς ὑμᾶς
  choice: estabelecer-se entre vocês
  rationale: Neste contexto, καθῆσαι indica permanecer ou fixar residência junto à comunidade, não apenas sentar-se fisicamente.
- source_word: τροφῆς
  choice: sustento
  rationale: O termo pode designar alimento, mas aqui se refere de modo natural à provisão material devida ao profeta residente; “sustento” preserva esse alcance contextual.
theological_decisions:
- issue: Direito do verdadeiro profeta à provisão comunitária
  choice: é digno do seu sustento
  alternative: tem direito ao seu alimento
  rationale: A formulação mantém a linguagem de dignidade ou merecimento de ἄξιός ἐστι, sem transformar a afirmação em terminologia jurídica nem restringir τροφή a comida.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para legibilidade brasileira e ampla compreensão. A construção é concisa e preserva a relação adversativa introduzida por δέ.
