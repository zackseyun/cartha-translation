source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐξερχόμενος δὲ ὁ ἀπόστολος μηδὲ λαμβανέτω εἰμὴ ἄρτον ἕως οὗ αὐλισθῇ· ἐὰν δὲ ἀργύριον αἰτῇ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/006.yaml
  text: And when the apostle departs, let him take nothing except bread until he finds lodging; but if he asks for money, he is a false prophet.
translation:
  language: pt
  text: E, ao partir, o apóstolo não leve nada, exceto pão, até se hospedar; mas, se pedir dinheiro, é falso profeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: apóstolo
  rationale: Mantém o termo do texto grego no sentido contextual de um enviado itinerante, sem substituí-lo por uma interpretação mais restrita.
- source_word: μηδὲ λαμβανέτω
  choice: não leve nada
  rationale: Expressa naturalmente a proibição de receber ou levar provisões ao partir.
- source_word: ἄρτον
  choice: pão
  rationale: Correspondência direta e concreta ao grego, preservando a provisão mínima permitida.
- source_word: ἕως οὗ αὐλισθῇ
  choice: até encontrar pouso
  rationale: Traduz de modo idiomático a ideia de chegar ao lugar onde passará a noite, sem especificar hospedaria ou anfitrião.
- source_word: ἀργύριον
  choice: dinheiro
  rationale: No contexto, o termo designa prata como meio monetário; 'dinheiro' comunica claramente o sentido pretendido.
- source_word: ψευδοπροφήτης
  choice: falso profeta
  rationale: Equivalência tradicional, transparente e semanticamente exata.
theological_decisions:
- issue: Sentido de ἀπόστολος
  choice: Preservar 'apóstolo' como designação do enviado itinerante mencionado no texto.
  alternative: Traduzir como 'missionário' ou 'mensageiro'.
  rationale: O grego usa o substantivo ἀπόστολος; manter o termo evita impor uma definição posterior ou reduzir sua possível abrangência histórica.
- issue: Relação entre pedir dinheiro e ser falso profeta
  choice: Manter a afirmação categórica do texto.
  alternative: Atenuá-la como mero indício ou suspeita.
  rationale: A construção grega afirma diretamente 'é falso profeta', sem modalização.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe normativa e leitura natural no Brasil e em outros contextos lusófonos. 'Pouso' conserva de forma concisa a referência à hospedagem noturna.
