id: DID.11.8
reference: Didache 11:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ πᾶς δὲ ὁ λαλῶν ἐν πνεύματι προφήτης ἐστίν, ἀλλ' ἐὰν ἔχῃ τοὺς τρόπους Κυρίου. Ἀπὸ οὖν τῶν τρόπων γνωσθήσεται ὁ ψευδοπροφήτης καὶ ὁ προφήτης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/008.yaml
  text: Yet not everyone speaking in the Spirit is a prophet[a], but only if he has the ways of the Lord. Therefore, from their ways the false prophet and the prophet will be known.
translation:
  language: pt
  text: Contudo, nem todo aquele que fala em espírito é profeta, mas somente se tiver a conduta do Senhor. Portanto, pela conduta deles serão reconhecidos tanto o falso profeta como o profeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλῶν ἐν πνεύματι
  choice: fala em espírito
  rationale: Mantém a formulação do grego e sua possível amplitude, sem explicitar indevidamente «pelo Espírito» nem reduzir a expressão a um estado psicológico.
- source_word: τοὺς τρόπους Κυρίου
  choice: a conduta do Senhor
  rationale: τρόπος, neste contexto, indica modo de viver, comportamento ou conduta. «Conduta» é natural em português e evita confusão com ὁδός, termo usado na Didaquê para o tema dos Dois Caminhos.
- source_word: Ἀπὸ ... τῶν τρόπων
  choice: pela conduta deles
  rationale: A preposição ἀπό indica aqui a base pela qual se reconhece alguém. O pronome «deles» torna natural em português a referência à conduta de cada pretenso profeta.
- source_word: γνωσθήσεται
  choice: serão reconhecidos
  rationale: Expressa o sentido passivo de «ser conhecido/reconhecido». O plural segue a concordância natural em português com os dois sujeitos coordenados.
theological_decisions:
- issue: Identidade de πνεῦμα em «ἐν πνεύματι»
  choice: espírito, em minúscula
  alternative: Espírito, com referência explícita ao Espírito Santo
  rationale: O substantivo grego não traz artigo, e o texto pode funcionar como uma expressão reconhecida de fala inspirada. A minúscula preserva essa ambiguidade sem negar a possível referência ao Espírito Santo.
- issue: Critério para reconhecer o profeta
  choice: somente se tiver a conduta do Senhor
  alternative: somente se seguir os caminhos do Senhor
  rationale: O critério apresentado é ético e observável, mas o grego usa τρόπος, não ὁδός. A tradução evita importar a terminologia específica dos «caminhos» e não define além do texto em que consiste essa conduta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Contudo» e «Portanto» preservam as relações discursivas; «tanto... como...» explicita naturalmente os dois referentes sem alterar o contraste.
