  source_fidelity: A tradução reproduz com fidelidade a construção condicional elíptica de ἀλλ᾽ ἐὰν ἔχῃ («mas somente se tiver») e conserva a cautela de ἐν πνεύματι mediante «em espírito». «Conduta» expressa adequadamente τρόποι, isto é, modo de viver/comportamento, sem o confundir com ὁδός. «Pela conduta deles» traduz naturalmente o valor criterial de ἀπό e aplica-se aos dois referentes finais.
  naturalness: O português é claro, moderno e de registro apropriado. «Contudo» e «Portanto» articulam bem o argumento, e «tanto ... como ...» torna a coordenação final fluente. A concordância plural em «serão reconhecidos» é natural com os dois substantivos coordenados.
  terminology: «Profeta» e «falso profeta» são termos estáveis e adequados. A grafia «espírito», em minúscula, preserva sem sobredefinir a referência de πνεῦμα. «Conduta do Senhor» mantém a distinção lexical relevante entre τρόπος e o vocabulário da «via/caminho» (ὁδός) característico de outras partes da Didaquê.
