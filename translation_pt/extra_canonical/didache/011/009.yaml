id: DID.11.9
reference: Didache 11:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πᾶς προφήτης ὁρίζων τράπεζαν ἐν πνεύματι, οὐ φάγεται ἀπ᾽ αὐτῆς, εἰδὲ μήγε ψευδοπροφήτης ἐστί·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/009.yaml
  text: And every prophet who sets a table in the Spirit shall not eat from it[a]; otherwise he is a false prophet.
translation:
  language: pt
  text: E todo profeta que, no Espírito, mandar preparar uma mesa não comerá dela[a]; caso contrário, é falso profeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que, no Espírito, determinar uma refeição não comerá dela”.'
    reason: 'Registra a amplitude de ὁρίζων τράπεζαν: a expressão pode ser entendida mais literalmente em relação a uma mesa posta ou metonimicamente como a determinação de uma refeição.'
lexical_decisions:
- source_word: ὁρίζων τράπεζαν
  choice: mandar preparar uma mesa
  rationale: ὁρίζων indica determinar, ordenar ou prescrever, enquanto τράπεζαν pode designar a mesa posta e, por metonímia, a refeição. A formulação comunica que o profeta ordena que a mesa seja preparada, sem reduzir o termo grego simplesmente a “refeição”.
- source_word: ἐν πνεύματι
  choice: no Espírito
  rationale: Mantém a formulação religiosa do grego e sua possível referência à atuação inspirada do Espírito, sem explicitar além do texto.
- source_word: οὐ φάγεται ἀπ᾽ αὐτῆς
  choice: não comerá dela
  rationale: Reproduz de modo natural a proibição futura e conserva a referência pronominal à mesa ou à comida nela servida.
- source_word: ψευδοπροφήτης
  choice: falso profeta
  rationale: Equivalente português corrente e tradicional, semanticamente direto.
theological_decisions:
- issue: Sentido de “no Espírito”
  choice: Preservar a expressão sem explicação interpretativa no corpo do texto.
  alternative: Traduzir como “sob inspiração do Espírito”.
  rationale: O grego não define aqui a natureza exata da experiência profética; a tradução mantém essa abertura.
- issue: Critério para reconhecer o falso profeta
  choice: 'Manter a afirmação categórica: se comer da mesa que mandou preparar no Espírito, é falso profeta.'
  alternative: Atenuar para “pode ser um falso profeta”.
  rationale: A construção εἰ δὲ μήγε ... ἐστί apresenta a consequência de forma categórica, não apenas provável.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Mandar preparar uma mesa” evita a estranheza de “determinar uma mesa” no texto principal, ao mesmo tempo que preserva a imagem concreta do grego.
