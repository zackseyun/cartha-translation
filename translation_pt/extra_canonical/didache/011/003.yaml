  text: Περὶ δὲ τῶν ἀποστόλων καὶ προφητῶν κατὰ τὸ δόγμα τοῦ εὐαγγελίου, οὕτω ποιήσατε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/003.yaml
  text: Concerning the apostles and prophets, according to the rule of the gospel, do thus.
translation:
  language: pt
  text: Quanto aos apóstolos e profetas, procedam assim, segundo a norma do evangelho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Quanto a
  rationale: Introduz naturalmente a mudança de assunto em português; δέ funciona aqui como partícula de transição, sem exigir um «mas» adversativo nem um «agora» explícito.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: aos apóstolos e profetas
  rationale: Mantém diretamente os dois grupos mencionados no texto grego, com a contração exigida pela expressão portuguesa «quanto a».
- source_word: κατὰ τὸ δόγμα τοῦ εὐαγγελίου
  choice: segundo a norma do evangelho
  rationale: Neste contexto, δόγμα designa uma regra, diretriz ou norma de conduta; «norma» é natural e evita o sentido moderno mais estreito de «dogma».
- source_word: οὕτω ποιήσατε
  choice: procedam assim
  rationale: 'Expressa de modo conciso e idiomático o imperativo plural: a comunidade deve agir da maneira indicada nas instruções seguintes.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativo no plural. A ordem da frase foi ajustada para maior naturalidade, sem resolver além do texto o conteúdo da «norma do evangelho».
