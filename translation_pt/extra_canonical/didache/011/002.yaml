id: DID.11.2
reference: Didache 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἐὰν δὲ αὐτὸς ὁ διδάσκων στραφεὶς διδάσκῃ ἄλλην διδαχὴν εἰς τὸ καταλῦσαι, μὴ αὐτοῦ ἀκούσητε· εἰς δὲ τὸ προσθεῖναι δικαιοσύνην καὶ γνῶσιν Κυρίου, δέξασθε αὐτὸν ὡς Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/002.yaml
  text: But if the teacher himself turns and teaches another teaching so as to overthrow[a], do not listen to him; but if it is to add righteousness and knowledge of the Lord, receive him as the Lord.
translation:
  language: pt
  text: Mas, se o próprio mestre mudar de rumo e ensinar outra doutrina com o propósito de destruir[a], não o escutem; mas, se for para acrescentar justiça e conhecimento do Senhor, recebam-no como o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não explicita o que seria destruído.
    reason: Preservar a ausência de objeto expresso em καταλῦσαι e evitar inserir “estas coisas”, “a doutrina” ou outra referência interpretativa.
lexical_decisions:
- source_word: στραφεὶς
  choice: mudar de rumo
  rationale: Expressa a ideia de voltar-se ou mudar de direção, aqui ligada à passagem do mestre para um ensino diferente, sem acrescentar um objeto ausente no grego.
- source_word: ἄλλην διδαχὴν
  choice: outra doutrina
  rationale: “Doutrina” é uma forma natural e digna de designar um corpo de ensino, preservando a repetição conceitual entre quem ensina e aquilo que é ensinado.
- source_word: καταλῦσαι
  choice: destruir
  rationale: O verbo pode significar desfazer, demolir ou abolir. “Destruir” preserva sua força e permite manter implícito o objeto, como no texto grego.
- source_word: προσθεῖναι
  choice: acrescentar
  rationale: O infinitivo rege diretamente “justiça” e “conhecimento”; por isso, a tradução evita “acrescentar à justiça”, que alteraria a relação gramatical.
- source_word: δέξασθε
  choice: recebam-no
  rationale: Traduz naturalmente o imperativo de acolher ou receber uma pessoa.
theological_decisions:
- issue: Objeto implícito de καταλῦσαι
  choice: 'Manter o verbo sem objeto expresso: “com o propósito de destruir”.'
  alternative: “Com o propósito de destruir estas coisas” ou “de destruir a doutrina”.
  rationale: O grego não declara o objeto. Acrescentá-lo resolveria uma ambiguidade genuína do texto.
- issue: Receber o mestre “como o Senhor”
  choice: Preservar literalmente “como o Senhor”.
  alternative: “Como receberiam o Senhor” ou “como representante do Senhor”.
  rationale: A formulação grega é breve e teologicamente intensa; as alternativas explicitariam uma relação que o texto não define.
- issue: Justiça e conhecimento como objetos de προσθεῖναι
  choice: “Acrescentar justiça e conhecimento do Senhor”.
  alternative: “Aumentar a justiça e o conhecimento do Senhor” ou “acrescentar à justiça”.
  rationale: A opção mantém os dois substantivos como objetos diretos e conserva o verbo básico “acrescentar”, sem impor se a ideia é introduzir ou aumentar essas realidades.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Mestre” evita restringir o referente a um cargo formal; “doutrina” mantém o tom de instrução religiosa. A pontuação conserva o contraste estreito entre as duas condições.
