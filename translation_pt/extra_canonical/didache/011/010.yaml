source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πᾶς δὲ προφήτης διδάσκων τὴν ἀλήθειαν, εἰ ἃ διδάσκει οὐ ποιεῖ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/010.yaml
  text: And every prophet teaching the truth, if he does not do what he teaches, is a false prophet.
translation:
  language: pt
  text: Mas todo profeta que ensina a verdade, se não pratica o que ensina, é falso profeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς δὲ προφήτης
  choice: Mas todo profeta
  rationale: “Todo profeta” reproduz a abrangência de πᾶς; “mas” expressa naturalmente o valor contrastivo de δέ no contexto.
- source_word: διδάσκων τὴν ἀλήθειαν
  choice: que ensina a verdade
  rationale: A oração relativa é natural em português e preserva o sentido do particípio presente, caracterizando o profeta por seu ensino.
- source_word: εἰ ἃ διδάσκει οὐ ποιεῖ
  choice: se não pratica o que ensina
  rationale: “Pratica” comunica aqui o sentido ético de ποιεῖ — fazer ou cumprir na própria conduta — com maior naturalidade do que a formulação literal “não faz”.
- source_word: ψευδοπροφήτης ἐστί
  choice: é falso profeta
  rationale: Equivalência direta e idiomática, preservando a declaração categórica do grego.
theological_decisions:
- issue: Critério para reconhecer o falso profeta
  choice: Preservar a afirmação de que a incoerência entre ensino verdadeiro e prática caracteriza o falso profeta.
  alternative: Atenuar para “age como falso profeta” ou ampliar para outros critérios de falsidade.
  rationale: O texto grego emprega a identificação direta ψευδοπροφήτης ἐστί; a tradução não deve suavizar nem acrescentar critérios ausentes.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura condicional e a força categórica do original foram preservadas.
