id: DID.11.7
reference: Didache 11:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πάντα προφήτην λαλοῦντα ἐν πνεύματι οὐ πειράσετε οὐδὲ διακρινεῖτε· πᾶσα γὰρ ἁμαρτία ἀφεθήσεται, αὕτη δὲ ἡ ἁμαρτία οὐκ ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/007.yaml
  text: And you shall not test or judge any prophet speaking in the Spirit; for every sin will be forgiven[a], but this sin will not be forgiven.
translation:
  language: pt
  text: E não ponham à prova nem julguem[a] nenhum profeta que fale no Espírito, pois todo pecado será perdoado, mas esse pecado não será perdoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: avaliem; também pode ser entendido como “discernam”.'
    reason: O verbo grego διακρίνω possui amplitude semântica entre distinguir, avaliar e julgar; a nota preserva essa ambiguidade legítima.
lexical_decisions:
- source_word: πειράσετε
  choice: ponham à prova
  rationale: O verbo πειράζω aqui indica submeter alguém a teste ou prova; a forma futura, neste contexto, tem força de proibição.
- source_word: διακρινεῖτε
  choice: julguem
  rationale: διακρίνω pode significar distinguir, avaliar ou julgar. “Julguem” preserva a advertência contra emitir um veredito sobre quem fala no Espírito, enquanto a nota registra a amplitude lexical.
- source_word: πάντα προφήτην ... οὐ
  choice: nenhum profeta
  rationale: 'A combinação de πᾶς com verbo negado tem sentido abrangente: a proibição se aplica a qualquer profeta que esteja falando no Espírito, e não apenas a não testar todos eles indiscriminadamente.'
- source_word: ἐν πνεύματι
  choice: no Espírito
  rationale: A expressão indica fala sob atuação ou inspiração espiritual; a inicial maiúscula comunica a provável referência ao Espírito de Deus sem acrescentar uma explicação ausente do texto.
- source_word: ἀφεθήσεται
  choice: será perdoado
  rationale: O futuro passivo de ἀφίημι, em relação ao pecado, é naturalmente expresso por “será perdoado”.
theological_decisions:
- issue: Alcance da proibição quanto ao profeta
  choice: “nenhum profeta que fale no Espírito”
  alternative: “todo profeta que fale no Espírito, não o ponham à prova”
  rationale: A redação adotada evita a falsa leitura de negação parcial criada por uma reprodução literal da ordem grega e expressa a força absoluta da construção semítica.
- issue: Identificação do pecado imperdoável
  choice: Manter “esse pecado” sem explicá-lo além do contexto imediato
  alternative: Identificá-lo explicitamente com blasfêmia contra o Espírito Santo
  rationale: Embora a formulação evoque tradição sinótica semelhante, o versículo não dá aqui um nome técnico ao pecado. A tradução preserva essa tensão sem importar uma harmonização.
- issue: Sentido de falar “no Espírito”
  choice: Preservar a expressão sem definir um teste doutrinário ou institucional
  alternative: Parafrasear como “inspirado pelo Espírito Santo”
  rationale: A formulação grega é concisa e pode envolver inspiração, êxtase ou atuação espiritual; explicitar um mecanismo reduziria a abertura do original.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural dirigidas à comunidade. Os futuros gregos com valor proibitivo foram vertidos pelo imperativo negativo natural em português. “No Espírito” mantém a concisão e o tom teológico do original.
