id: DID.11.1
reference: Didache 11:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς ἂν οὖν ἐλθὼν διδάξῃ ὑμᾶς ταῦτα πάντα, τὰ προειρημένα, δέξασθε αὐτόν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/001.yaml
  text: Therefore, whoever comes and teaches you all these things that have been said before, receive him.
translation:
  language: pt
  text: Portanto, quem vier e ensinar a vocês todas essas coisas ditas anteriormente, recebam-no.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν
  choice: quem
  rationale: Expressa de modo natural a referência geral e indefinida do grego.
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a conexão inferencial explícita com o ensino anterior.
- source_word: ἐλθὼν διδάξῃ
  choice: vier e ensinar
  rationale: Reproduz em português corrente a sequência verbal do particípio seguido do subjuntivo eventual.
- source_word: ὑμᾶς
  choice: a vocês
  rationale: Forma amplamente compreensível no português moderno e deixa claro que o objeto de ensinar é plural.
- source_word: ταῦτα πάντα, τὰ προειρημένα
  choice: todas essas coisas ditas anteriormente
  rationale: Mantém tanto a totalidade quanto a referência retrospectiva, sem a redundância pouco natural de uma tradução rigidamente literal.
- source_word: δέξασθε αὐτόν
  choice: recebam-no
  rationale: Conserva o imperativo plural e o sentido de acolher ou aceitar a pessoa que ensina.
theological_decisions:
- issue: Alcance do acolhimento ordenado
  choice: recebam-no
  alternative: aceitem-no
  rationale: “Recebam-no” preserva a possível dimensão concreta de hospitalidade e acolhida, sem reduzir a expressão apenas à aprovação do ensino.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e compreensão internacional. A construção mantém a ligação com as instruções precedentes e o destinatário coletivo.
