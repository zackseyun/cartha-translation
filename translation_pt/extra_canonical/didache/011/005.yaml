  yaml_path: translation/extra_canonical/didache/011/005.yaml
  text: But he shall not remain one day; but if there is need, also the next. But if he remains three days, he is a false prophet.
translation:
  language: pt
  text: Mas não deverá permanecer um dia; se, porém, houver necessidade, também no dia seguinte. Mas, se permanecer três dias, é falso profeta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μενεῖ
  choice: não deverá permanecer
  rationale: Expressa a proibição ou norma futura no contexto, sem acrescentar a ideia de “somente”, ausente do grego.
- source_word: τὴν ἄλλην
  choice: o seguinte
  rationale: Retoma elipticamente “dia” e significa o dia seguinte, em português natural.
- source_word: ψευδοπροφήτης
  choice: falso profeta
  rationale: Equivalente direto e tradicional, preservando o juízo categórico do texto.
theological_decisions:
- issue: Força normativa de οὐ μενεῖ
  choice: não deverá permanecer
  alternative: não permanecerá
  rationale: O contexto fornece uma regra para a permanência do apóstolo; “deverá” torna a força normativa inteligível sem introduzir uma proibição mais forte do que o texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com estrutura concisa próxima do grego. O referente masculino é recuperável do contexto anterior e não foi explicitado para evitar acréscimo desnecessário.
