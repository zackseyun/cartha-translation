  terminology: “Provado, verdadeiro”, “mistério terreno da igreja”, “julgado por vocês” e “julgamento ... com Deus” são escolhas defensáveis e não impõem uma leitura doutrinária ou histórica determinada. A nota deve descrever a incerteza sem sugerir uma identificação específica do ato.
