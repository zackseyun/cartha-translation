source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης δεδοκιμασμένος, ἀληθινός, ποιῶν εἰς μυστήριον κοσμικὸν ἐκκλησίας, μὴ διδάσκων δὲ ποιεῖν ὅσα αὐτὸς ποιεῖ, οὐ κριθήσεται ἐφ᾽ ὑμῶν· μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν· ὡσαύτως γὰρ ἐποίησαν καὶ οἱ ἀρχαῖοι προφῆται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/011.yaml
  text: But every prophet who has been tested, genuine, doing for an earthly mystery of the church, yet not teaching others to do what he himself does, will not be judged by you; for he has his judgment with God. For in the same way the ancient prophets also did.
translation:
  language: pt
  text: Mas todo profeta provado, verdadeiro, que age em vista do mistério terreno da igreja[a], mas não ensina a fazer o que ele mesmo faz, não será julgado por vocês, pois o seu julgamento está com Deus. Pois os antigos profetas também fizeram assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “em vista do mistério terreno da igreja” é incomum e de sentido incerto. A tradução preserva a formulação sem especificar que ação está em vista.
    reason: Preservar a obscuridade lexical e histórica da frase sem impor uma interpretação particular.
lexical_decisions:
- source_word: δεδοκιμασμένος, ἀληθινός
  choice: provado e verdadeiro
  rationale: Mantém a distinção entre alguém que passou por prova e alguém reconhecido como genuíno, sem ampliar o sentido.
- source_word: ποιῶν
  choice: que realiza algo
  rationale: O verbo é deliberadamente amplo; “realiza algo” preserva essa abertura e permite que o complemento difícil governe o sentido.
- source_word: εἰς μυστήριον κοσμικὸν ἐκκλησίας
  choice: com vistas ao mistério terreno da igreja
  rationale: Reproduz a direção expressa por εἰς e conserva a expressão incomum e ambígua, sem decidir se se trata de um ato simbólico, de casamento ou de alguma representação profética específica.
- source_word: οὐ κριθήσεται ἐφ᾽ ὑμῶν
  choice: não será julgado por vocês
  rationale: Expressa naturalmente em português a proibição ou exclusão do julgamento pela comunidade.
- source_word: μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν
  choice: pois seu julgamento está com Deus
  rationale: Preserva a formulação relacional do grego e evita explicitar indevidamente se o julgamento pertence a Deus ou ocorre diante dele.
- source_word: ὡσαύτως ... ἐποίησαν
  choice: também fizeram assim
  rationale: Mantém a referência ampla ao modo de agir dos antigos profetas, sem especificar atos não mencionados no texto.
theological_decisions:
- issue: Natureza do “mistério terreno da igreja”
  choice: Conservar a expressão e sua ambiguidade em uma nota
  alternative: Interpretar diretamente como casamento, união conjugal ou encenação profética
  rationale: A construção grega é obscura, e o próprio versículo não identifica o ato; uma tradução interpretativa eliminaria uma tensão genuína do texto.
- issue: Julgamento do profeta pela comunidade
  choice: “não será julgado por vocês”
  alternative: “vocês não deverão condená-lo”
  rationale: O grego fala de julgamento, não necessariamente de condenação, e fundamenta a ressalva no julgamento que o profeta tem com Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe foi suavizada sem desfazer a sequência lógica do grego; a formulação mais estranha do original foi mantida no texto e esclarecida apenas quanto à sua incerteza em nota.
