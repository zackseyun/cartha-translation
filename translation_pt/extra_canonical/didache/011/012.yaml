source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς δ᾽ ἂν εἴπῃ ἐν πνεύματι· Δός μοι ἀργύρια ἢ ἕτερά τινα, οὐκ ἀκούσεσθε αὐτοῦ· ἐὰν δὲ περὶ ἄλλων ὑστερούντων εἴπῃ δοῦναι, μηδεὶς αὐτὸν κρινέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/012.yaml
  text: But whoever says in the Spirit[a], “Give me money or something else,” you shall not listen to him. But if he tells you to give for others who are in need, let no one judge him.
translation:
  language: pt
  text: 'Mas quem disser em espírito[a]: “Dê-me dinheiro ou alguma outra coisa”, vocês não devem dar ouvidos a ele. Mas, se disser para que vocês deem em favor de outros que passam necessidade, ninguém o julgue.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Espírito” ou “pelo Espírito”. A expressão também pode ser entendida como “em espírito”.'
    reason: O grego ἐν πνεύματι permite mais de uma relação semântica e não identifica explicitamente, por si só, a referência de πνεῦμα.
lexical_decisions:
- source_word: ἀργύρια
  choice: dinheiro
  rationale: Embora o termo possa designar literalmente moedas ou peças de prata, neste contexto indica dinheiro de modo geral.
- source_word: ἕτερά τινα
  choice: alguma outra coisa
  rationale: Mantém a expressão como parte do pedido dirigido ao próprio falante e reproduz naturalmente o sentido indefinido de τινα.
- source_word: οὐκ ἀκούσεσθε αὐτοῦ
  choice: vocês não devem dar ouvidos a ele
  rationale: A expressão significa não atender nem obedecer ao pedido, e não apenas deixar de escutar suas palavras.
- source_word: ὑστερούντων
  choice: que passam necessidade
  rationale: Expressa de modo corrente a ideia de pessoas que carecem do necessário.
theological_decisions:
- issue: Sentido de ἐν πνεύματι
  choice: no Espírito
  alternative: pelo Espírito / em espírito
  rationale: A formulação preserva a linguagem carismática do contexto sem decidir se a expressão indica esfera, estado profético ou agência; a nota registra alternativas legítimas.
- issue: Objeto do pedido egoísta
  choice: “Dê-me dinheiro ou alguma outra coisa”
  alternative: “Dê-me dinheiro”, ou disser alguma outra coisa
  rationale: A sintaxe grega liga ἢ ἕτερά τινα ao verbo Δός dentro do pedido; assim, a proibição abrange pedir para si dinheiro ou outros bens, sem contradizer a permissão da oração seguinte para solicitar ajuda em favor de necessitados.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O plural “vocês” torna explícito o destinatário comunitário de ἀκούσεσθε; “ninguém o julgue” conserva a forma concisa e solene do imperativo grego.
