  text: Let every apostle who comes to you be received as the Lord.
translation:
  language: pt
  text: Todo apóstolo que vier até vocês seja recebido como o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς δὲ ἀπόστολος
  choice: Todo apóstolo
  rationale: Mantém o sentido abrangente de πᾶς e conserva o termo comunitário e ministerial ἀπόστολος sem acrescentar uma definição ausente no texto.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: que vier até vocês
  rationale: Expressa de modo natural em português o particípio presente e a direção indicada por πρός; o presente grego tem valor geral nesta instrução.
- source_word: δεχθήτω
  choice: seja recebido
  rationale: Reproduz o imperativo passivo de terceira pessoa, preservando o tom normativo da instrução.
- source_word: ὡς Κύριος
  choice: como o Senhor
  rationale: Traduz diretamente a comparação e mantém o título Κύριος com artigo, sem explicar ou restringir a natureza dessa recepção.
theological_decisions:
- issue: Sentido da recepção do apóstolo 'como o Senhor'
  choice: 'Preservar literalmente a comparação: “como o Senhor”.'
  alternative: Explicitar como “como se recebessem o Senhor” ou enfraquecer para “em nome do Senhor”.
  rationale: O grego formula uma comparação direta e teologicamente forte. A tradução não deve decidir se ela indica representação, identificação simbólica, hospitalidade ou autoridade delegada.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com “vocês” para o plural ὑμᾶς. A formulação conserva a concisão e a força normativa do original.
