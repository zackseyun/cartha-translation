source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου γόγγυσος· ἐπειδὴ ὁδηγεῖ εἰς τὴν βλασφημίαν· μηδὲ αὐθάδης μηδὲ πονηρόφρων· ἐκ γὰρ τούτων ἁπάντων βλασφημίαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/006.yaml
  text: My child, do not become a grumbler, since it leads to blasphemy; nor self-willed, nor evil-minded, for from all these blasphemies are born.
translation:
  language: pt
  text: Meu filho, não se torne alguém que vive reclamando, pois isso leva à blasfêmia; nem arrogante, nem mal-intencionado, pois de todas essas coisas nascem blasfêmias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γόγγυσος
  choice: alguém que vive reclamando
  rationale: Expressa de modo natural a ideia de uma pessoa murmuradora ou queixosa habitual, preservando o valor caracterológico do termo grego.
- source_word: βλασφημίαν / βλασφημίαι
  choice: blasfêmia / blasfêmias
  rationale: Mantém o termo religioso e moral abrangente do grego, sem restringi-lo indevidamente a uma forma específica de fala ofensiva.
- source_word: αὐθάδης
  choice: arrogante
  rationale: Neste catálogo de vícios, comunica com clareza a atitude presunçosa, obstinada e autocentrada denotada pelo termo.
- source_word: πονηρόφρων
  choice: mal-intencionado
  rationale: Traduz o composto como uma disposição interior voltada para o mal, em linguagem corrente e digna.
- source_word: γεννῶνται
  choice: nascem
  rationale: Preserva a metáfora explícita de geração presente no verbo grego.
theological_decisions:
- issue: Relação entre os vícios enumerados e a blasfêmia
  choice: 'Preservar a progressão causal: reclamar leva à blasfêmia, e de todos os vícios mencionados nascem blasfêmias.'
  alternative: Uniformizar as duas orações como simples afirmações de que todos os vícios levam à blasfêmia.
  rationale: O grego emprega primeiro ὁδηγεῖ, “leva”, e depois γεννῶνται, “nascem”; manter ambos preserva a variação retórica e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com forma de tratamento amplamente compreensível no Brasil. A construção “não se torne” reproduz a advertência contra adquirir ou desenvolver esses traços; “vive reclamando” evita o pouco corrente “murmurador” sem banalizar o tom.
