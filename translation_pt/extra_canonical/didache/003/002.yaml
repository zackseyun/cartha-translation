source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ γίνου ὀργίλος· ὁδηγεῖ γὰρ ἡ ὀργὴ πρὸς τὸν φόνον· μηδὲ ζηλωτὴς μηδὲ ἐριστικὸς μηδὲ θυμικός· ἐκ γὰρ τούτων ἀπάντων φόνοι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/002.yaml
  text: Do not become quick-tempered, for anger leads to murder; nor be jealous, nor quarrelsome, nor hot-headed, for from all these murders are born.
translation:
  language: pt
  text: Não se torne irascível, pois a ira leva ao homicídio; nem seja ciumento, nem briguento, nem de temperamento explosivo, pois de todas essas coisas nascem homicídios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργίλος
  choice: irascível
  rationale: Expressa a disposição habitual de se irar facilmente e preserva a distinção em relação a θυμικός.
- source_word: ζηλωτής
  choice: ciumento
  rationale: No contexto de uma lista de vícios, o termo indica zelo possessivo ou ciúme; “ciumento” comunica isso com naturalidade sem introduzir uma conotação positiva.
- source_word: ἐριστικός
  choice: briguento
  rationale: Descreve alguém inclinado a contendas ou brigas, em linguagem corrente e clara.
- source_word: θυμικός
  choice: de temperamento explosivo
  rationale: Transmite a propensão a acessos intensos de ira e evita simplesmente repetir “irascível”.
- source_word: φόνος / φόνοι
  choice: homicídio / homicídios
  rationale: Mantém o sentido de matar uma pessoa, preservando também a mudança do singular para o plural no grego.
theological_decisions:
- issue: Relação entre disposições interiores e homicídios
  choice: “leva ao” e “nascem”
  alternative: “causa” e “são gerados”
  rationale: Preserva as duas imagens do texto grego — condução e nascimento — sem transformar a advertência moral em uma afirmação de causalidade automática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A repetição de “homicídio/homicídios” acompanha deliberadamente o grego.
