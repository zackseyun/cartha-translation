source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, φεῦγε ἀπὸ παντὸς πονηροῦ καὶ ἀπὸ παντὸς ὁμοίου αὐτοῦ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/001.yaml
  text: My child, flee from every evil thing, and from everything like it.
translation:
  language: pt
  text: Meu filho, fuja de todo mal[a] e de tudo o que lhe seja semelhante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de toda coisa má”.'
    reason: Registra a possibilidade de entender o adjetivo grego substantivado de maneira concreta, sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: Τέκνον μου
  choice: Meu filho
  rationale: Forma natural e digna de tratamento afetuoso entre mestre e discípulo; preserva o sentido relacional do grego sem recorrer à expressão pouco idiomática “minha criança”.
- source_word: φεῦγε
  choice: fuja
  rationale: O imperativo presente comunica afastamento ativo e contínuo; “fuja” mantém a força direta da exortação.
- source_word: παντὸς πονηροῦ
  choice: de todo mal
  rationale: O adjetivo substantivado pode indicar todo mal ou toda coisa má. “Todo mal” é conciso, natural e semanticamente abrangente em português.
- source_word: παντὸς ὁμοίου αὐτοῦ
  choice: de tudo o que se pareça com ele
  rationale: Expressa com clareza a ideia de evitar não apenas o mal, mas também aquilo que tenha semelhança com ele, sem especificar em que consiste essa semelhança.
theological_decisions:
- issue: Alcance de “todo mal” e do que se assemelha a ele
  choice: Manter a formulação ampla e não definir quais atos ou aparências estão incluídos
  alternative: Interpretar como uma proibição específica de toda aparência externa do mal
  rationale: O grego apresenta uma exortação geral e deixa indeterminada a natureza da semelhança; especificá-la acrescentaria uma interpretação não expressa no texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A frase conserva o tom direto de instrução moral e a amplitude deliberada do original.
