id: DID.3.8
reference: Didache 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γίνου μακρόθυμος καὶ ἐλεήμων καὶ ἄκακος καὶ ἡσύχιος καὶ ἀγαθὸς καὶ τρέμων τοὺς λόγους διὰ παντός, οὓς ἤκουσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/008.yaml
  text: Be patient and merciful and guileless and quiet and good[a], and always trembling at the words that you heard.
translation:
  language: pt
  text: Seja[a] paciente, misericordioso, sem malícia, tranquilo e bom, e trema sempre diante das palavras que você ouviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Torne-se”.'
    reason: Γίνου pode ser entendido como simples exortação a ser assim ou, com nuance mais literal, a tornar-se assim.
lexical_decisions:
- source_word: Γίνου
  choice: Seja
  rationale: Neste contexto de exortação moral, o imperativo de γίνομαι pode funcionar naturalmente como “seja”; “torne-se” é possível, mas produziria uma construção menos fluente com o particípio τρέμων.
- source_word: μακρόθυμος
  choice: paciente
  rationale: Expressa constância e domínio diante de provocações ou dificuldades, em linguagem corrente.
- source_word: ἐλεήμων
  choice: misericordioso
  rationale: Mantém o sentido de quem demonstra compaixão e misericórdia.
- source_word: ἄκακος
  choice: sem malícia
  rationale: Comunica a ausência de maldade ou dolo de modo natural, sem restringir o termo apenas à ingenuidade.
- source_word: ἡσύχιος
  choice: tranquilo
  rationale: Preserva a ideia de disposição sossegada, pacífica e não turbulenta.
- source_word: τρέμων τοὺς λόγους
  choice: trema ... diante das palavras
  rationale: Em português, “tremer diante de” expressa com naturalidade temor reverente perante palavras recebidas, evitando o pouco idiomático “tremer as palavras”.
- source_word: διὰ παντός
  choice: sempre
  rationale: O sintagma adverbial indica continuidade ou constância.
- source_word: οὓς ἤκουσας
  choice: que você ouviu
  rationale: O aoristo apresenta a audição como ação realizada, provavelmente a instrução já recebida; o pretérito perfeito simples preserva isso naturalmente.
theological_decisions:
- issue: Natureza do temor perante “as palavras”
  choice: “trema sempre diante das palavras”
  alternative: “reverencie sempre as palavras”
  rationale: A tradução mantém a imagem forte de τρέμων sem explicá-la apenas como reverência, preservando sua tensão e força exortativa.
- issue: Valor de Γίνου na exortação
  choice: “Seja” no texto, com “Torne-se” em nota
  alternative: “Torne-se” no texto principal
  rationale: “Seja” é idiomático e pode representar o uso exortativo do verbo, enquanto a nota preserva sua possível nuance ingressiva ou transformativa.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível e boa legibilidade brasileira. A coordenação acumulativa do grego foi preservada, mas a oração participial foi vertida por um segundo imperativo para soar natural.
