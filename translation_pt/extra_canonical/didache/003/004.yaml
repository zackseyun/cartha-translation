id: DID.3.4
reference: Didache 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου οἰωνοσκόπος· ἐπειδὴ ὁδηγεῖ εἰς τὴν εἰδωλολατρείαν· μηδὲ ἐπαοιδὸς μηδὲ μαθηματικὸς μηδὲ περικαθαίρων, μηδὲ θέλε αὐτὰ βλέπειν· ἐκ γὰρ τούτων ἁπάντων εἰδωλολατρεία γεννᾶται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/004.yaml
  text: My child[a], do not become an observer of omens, because it leads to idolatry; nor an enchanter, nor an astrologer, nor one who performs purifications, nor even be willing to look at these things; for from all these idolatry is born.
translation:
  language: pt
  text: Meu filho[a], não se torne observador de presságios, pois isso conduz à idolatria; nem alguém que profira encantamentos, nem astrólogo, nem alguém que realize purificações. Nem sequer queira olhar para essas coisas, pois de todas elas nasce a idolatria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por «filho» pode se referir tanto a um filho quanto a uma filha.
    reason: Esclarece que τέκνον não marca o sexo da pessoa interpelada, embora o português exija aqui uma forma gramaticalmente marcada para uma expressão natural.
lexical_decisions:
- source_word: Τέκνον μου
  choice: Meu filho[a]
  rationale: Forma de tratamento filial natural e digna em português. O substantivo grego τέκνον não especifica o sexo da pessoa a quem se dirige, informação preservada em nota.
- source_word: οἰωνοσκόπος
  choice: observador de presságios
  rationale: Preserva a imagem etimológica e o sentido antigo de alguém que examina sinais ou augúrios para adivinhar o futuro, sem ampliar o termo para toda forma de adivinhação.
- source_word: ἐπαοιδός
  choice: alguém que profira encantamentos
  rationale: Expressa a prática de recitar fórmulas mágicas com mais clareza no português atual do que o substantivo potencialmente ambíguo «encantador».
- source_word: μαθηματικός
  choice: astrólogo
  rationale: Neste contexto antigo, o termo designa o praticante de astrologia, não um matemático no sentido moderno.
- source_word: περικαθαίρων
  choice: alguém que realize purificações mágicas
  rationale: O particípio se refere a purificações de caráter ritual ou ocultista; «mágicas» explicita o sentido contextual e evita confusão com higiene ou purificação religiosa em geral.
- source_word: θέλε αὐτὰ βλέπειν
  choice: queira olhar para essas coisas
  rationale: Mantém tanto a volição expressa por θέλε quanto a referência neutra plural de αὐτά às práticas ou coisas ocultistas, e não às pessoas anteriormente enumeradas.
- source_word: ἐκ ... τούτων ἁπάντων ... γεννᾶται
  choice: de todas elas nasce
  rationale: Conserva a metáfora de origem ou geração presente no grego, em vez de reduzi-la a uma relação causal abstrata.
theological_decisions:
- issue: Relação entre práticas ocultistas e idolatria
  choice: «isso conduz à idolatria» e «de todas elas nasce a idolatria»
  alternative: «isso é idolatria»
  rationale: O texto descreve direção e origem, não identifica simplesmente cada prática com idolatria; a tradução preserva essa distinção e a tensão retórica entre as duas afirmações.
- issue: Natureza das purificações mencionadas
  choice: «purificações mágicas»
  alternative: «purificações» ou «ritos de purificação»
  rationale: O contexto associa a ação a presságios, encantamentos e astrologia. A qualificação evita que a proibição seja indevidamente aplicada a toda purificação ritual ou religiosa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe exortativa natural. A enumeração nominal do grego foi parcialmente expandida com «alguém que» para evitar sentidos enganosos no uso corrente. A repetição de «idolatria» e a metáfora «nasce» foram mantidas por sua força retórica.
