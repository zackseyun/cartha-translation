source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐχ ὑψώσεις σεαυτὸν οὐδὲ δώσεις τῇ ψυχῇ σου θράσος. Οὐ κολληθήσεται ἡ ψυχή σου μετὰ ὑψηλῶν, ἀλλὰ μετὰ δικαίων καὶ ταπεινῶν ἀναστραφήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/009.yaml
  text: You shall not exalt yourself, nor give your soul boldness. Your soul shall not be joined with the lofty, but you shall associate with the righteous and humble.
translation:
  language: pt
  text: Não se exalte, nem dê à sua alma atrevimento. Sua alma não se ligará aos altivos, mas você conviverá com os justos e humildes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑψώσεις σεαυτόν
  choice: exalte a si mesmo
  rationale: Expressa de modo claro e natural a ideia reflexiva de elevar a própria importância, mantendo a forma de exortação negativa.
- source_word: δώσεις τῇ ψυχῇ σου θράσος
  choice: dê espaço ao atrevimento em sua alma
  rationale: Evita o pouco natural “dar atrevimento à sua alma”, conserva a referência explícita à alma e comunica o sentido desfavorável de θράσος sem acrescentar “arrogância” ao texto.
- source_word: κολληθήσεται
  choice: se ligará
  rationale: Mantém a imagem de vínculo ou adesão do verbo grego, em português corrente.
- source_word: ὑψηλῶν
  choice: altivos
  rationale: Preserva a metáfora de elevação e seu sentido contextual de orgulho, sem restringi-la a uma classe social ou posição formal.
- source_word: ἀναστραφήσῃ
  choice: conviverá
  rationale: Representa naturalmente a ideia de conduzir a vida e manter convivência habitual com determinadas pessoas.
theological_decisions:
- issue: Sentido moral de θράσος
  choice: atrevimento
  alternative: ousadia
  rationale: “Ousadia” pode soar virtuosa no português atual; “atrevimento” preserva melhor a advertência moral do contexto, sem intensificá-la para “arrogância”.
- issue: Identidade dos ὑψηλοί
  choice: altivos
  alternative: poderosos ou pessoas de posição elevada
  rationale: O contexto contrasta os ὑψηλοί com os humildes, favorecendo o sentido moral de altivez, mas “altivos” conserva a imagem lexical sem inserir uma interpretação socioeconômica específica.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para ampla legibilidade brasileira. A alternância entre “sua alma” e “você” acompanha a mudança de sujeito no grego. As formas verbais negativas foram vertidas como exortações naturais em português, enquanto a segunda frase mantém o valor prospectivo do texto.
