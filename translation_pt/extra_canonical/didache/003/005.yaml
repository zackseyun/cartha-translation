source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ψεύστης· ἐπειδὴ ὁδηγεῖ τὸ ψεῦσμα εἰς τὴν κλοπήν· μηδὲ φιλάργυρος μηδὲ κενόδοξος· ἐκ γὰρ τούτων ἁπάντων κλοπαὶ γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/005.yaml
  text: My child, do not become a liar, since lying leads to theft; nor be money-loving, nor vainglorious, for from all these thefts are born.
translation:
  language: pt
  text: Meu filho, não se torne mentiroso, pois a mentira conduz ao roubo. Não seja amante do dinheiro nem vanglorioso, porque de todas essas coisas nascem roubos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  choice: Meu filho
  rationale: Reproduz a forma afetiva de instrução; «filho» é natural em português e não exige que o destinatário seja uma criança.
- source_word: μὴ γίνου ψεύστης
  choice: não se torne mentiroso
  rationale: Preserva o valor de γίνου, «tornar-se», em vez de reduzi-lo a simples «não minta».
- source_word: τὸ ψεῦσμα
  choice: a mentira
  rationale: Expressa em português corrente o ato ou conteúdo falso que conduz ao roubo.
- source_word: φιλάργυρος
  choice: amante do dinheiro
  rationale: Tradução transparente do composto grego, sem restringi-lo apenas à avareza como comportamento econômico.
- source_word: κενόδοξος
  choice: ávido por glória
  rationale: Comunica a busca de glória ou prestígio vazio em linguagem compreensível, evitando o pouco corrente «vanglorioso».
- source_word: κλοπαὶ γεννῶνται
  choice: nascem roubos
  rationale: Conserva a metáfora explícita de geração presente no grego e o plural «roubos».
theological_decisions: []
