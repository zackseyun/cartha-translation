review_pass:
  verdict: revise
  source_fidelity: A redação principal substitui πορείαν (“caminho”, “jornada”) por “imoralidade sexual”, que corresponde à leitura diferente πορνείαν e ao texto inglês, mas não ao texto grego fornecido. Uma nota que conjectura erro de OCR não torna segura essa substituição no corpo do texto. Além disso, “dominado pelo desejo” acrescenta uma ideia de sujeição que não está explicitamente em ἐπιθυμητής.
  naturalness: O português do rascunho é claro, mas “não se torne cobiçoso” conserva melhor a construção e a repetição lexical. “Não fale obscenidades” e “não tenha olhar altivo” são formulações naturais e mantêm o paralelismo exortativo.
  terminology: “Cobiçoso/desejo” preserva ἐπιθυμητής/ἐπιθυμία sem antecipar necessariamente uma acepção exclusivamente sexual. “Adultérios” mantém o plural de μοιχεῖαι. Para ὑψηλοόφθαλμος, “olhar altivo” reflete o sentido literal e tradicional; a nota registra, sem decidir dogmaticamente, a possível nuance sexual contextual.
  issues:
  - severity: high
    issue: “Imoralidade sexual” não traduz πορείαν no texto grego fornecido.
    rationale: πορείαν significa “caminho, percurso, jornada”; “imoralidade sexual” exigiria πορνείαν. O contexto e a tradição podem favorecer a suspeita de variante ou erro, mas a tradução deve seguir a forma-fonte apresentada e sinalizar a dificuldade em nota.
  - severity: medium
    issue: “Dominado pelo desejo” intensifica ἐπιθυμητής.
    rationale: O adjetivo designa alguém dado ao desejo/cobiça; não afirma explicitamente que a pessoa esteja dominada por ele.
  - severity: medium
    issue: “Olhar cobiçoso” escolhe no texto principal uma interpretação contextual contestável de ὑψηλοόφθαλμος.
    rationale: O composto significa literalmente “de olhos elevados” e normalmente comunica altivez/arrogância. Uma possível conotação sexual no contexto deve permanecer em nota, não substituir sem ressalva o sentido lexical primário.
  revised_text: Meu filho, não se torne cobiçoso, pois o desejo conduz ao caminho[a]. Não fale obscenidades nem tenha olhar altivo[b], pois de todas essas coisas nascem adultérios.
  revised_footnotes:
  - marker: a
    text: O grego fornecido diz literalmente “ao caminho” ou “à jornada” (πορείαν). Uma leitura conhecida em outras edições é “à imoralidade sexual” (πορνείαν), que se ajusta mais diretamente ao contexto; o texto principal segue a forma grega aqui apresentada.
    reason: Sinaliza a dificuldade textual sem substituir no corpo do texto a leitura fornecida por uma leitura alternativa.
  - marker: b
    text: Literalmente, “de olhos elevados”. Pode significar “de olhos altivos” ou “arrogante”; neste contexto, alguns entendem também uma alusão a olhar sexualmente cobiçoso.
    reason: Preserva a ambiguidade lexical e a possível interpretação contextual de ὑψηλοόφθαλμος.
  revision_rationale: A revisão prioriza a forma do texto grego fornecido, especialmente onde ela diverge da leitura pressuposta pela trilha inglesa. Mantém em nota, de modo transparente, a leitura alternativa amplamente conhecida, sem tratá-la como se constasse da fonte apresentada. Também evita intensificar ἐπιθυμητής e conserva para ὑψηλοόφθαλμος uma tradução lexicalmente fundamentada, com a nuance contextual registrada em nota.
