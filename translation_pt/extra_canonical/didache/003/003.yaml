source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ἐπιθυμητής· ὁδηγεῖ γὰρ ἡ ἐπιθυμία πρὸς τὴν πορείαν· μηδὲ αἰσχρολόγος μηδὲ ὑψηλοόφθαλμος· ἐκ γὰρ τούτων ἀπάντων μοιχεῖαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/003.yaml
  text: My child[a], do not become lustful, for lust leads to sexual immorality; nor foul-mouthed, nor haughty, for from all these adulteries are born.
translation:
  language: pt
  text: Meu filho, não se torne dominado pelo desejo, pois o desejo conduz à imoralidade sexual[a]. Não use linguagem obscena nem tenha um olhar cobiçoso[b], pois de todas essas coisas nascem adultérios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego fornecido traz literalmente “ao caminho” ou “à jornada”; provavelmente houve perda de uma letra na transmissão ou no OCR, pois a leitura conhecida é “à imoralidade sexual”.
    reason: Sinalizar de modo transparente a discrepância entre πορείαν no texto fornecido e πορνείαν, pressuposto pelo contexto e pela tradição textual.
  - marker: b
    text: Literalmente, “de olhos elevados”; também pode ser entendido como “de olhos altivos” ou “arrogante”. No contexto, a expressão pode indicar quem olha para outros com cobiça sexual.
    reason: Preservar a ambiguidade lexical e contextual de ὑψηλοόφθαλμος.
lexical_decisions:
- source_word: ἐπιθυμητής / ἐπιθυμία
  choice: dominado pelo desejo / desejo
  rationale: O campo semântico é amplo, mas o contexto de imoralidade sexual e adultérios indica desejo sexual desordenado. A formulação evita restringir o primeiro termo a um ato específico e preserva a repetição grega.
- source_word: πορείαν
  choice: imoralidade sexual
  rationale: Embora o texto OCR fornecido traga πορείαν, 'caminho/jornada', a leitura esperada neste conhecido paralelo da Didaquê é πορνείαν, 'imoralidade sexual', também pressuposta pela camada inglesa e pelo encadeamento com adultérios. A discrepância é indicada em nota.
- source_word: αἰσχρολόγος
  choice: use linguagem obscena
  rationale: Expressa fala vergonhosa, indecente ou obscena em português corrente, sem sugerir apenas palavrões genéricos.
- source_word: ὑψηλοόφθαλμος
  choice: tenha um olhar cobiçoso
  rationale: Literalmente 'de olhos elevados/altos'. Neste agrupamento de condutas que dão origem a adultérios, pode denotar um olhar sexualmente cobiçoso; a possível leitura de arrogância é preservada em nota.
- source_word: μοιχεῖαι
  choice: adultérios
  rationale: Mantém o plural concreto e enfático do grego, em vez de o generalizar como simples infidelidade.
theological_decisions:
- issue: Relação entre desejo e pecado sexual
  choice: O desejo conduz à imoralidade sexual
  alternative: Todo desejo já é imoralidade sexual
  rationale: A construção ὁδηγεῖ ... πρὸς apresenta progressão ou condução, não identidade absoluta entre desejo e ato.
- issue: Sentido moral de ὑψηλοόφθαλμος
  choice: Leitura sexual contextual no texto principal, com a leitura de arrogância em nota
  alternative: Traduzir apenas como 'arrogante' ou 'de olhos altivos'
  rationale: O contexto de desejo, obscenidade e adultérios favorece a referência a um olhar cobiçoso, mas a formação literal da palavra permite associação com altivez; a nota conserva a tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Meu filho” conserva o tom pedagógico e afetivo. Optou-se por verbos naturais em vez de adjetivos pouco idiomáticos, mantendo o paralelismo das proibições e o plural final enfático.
