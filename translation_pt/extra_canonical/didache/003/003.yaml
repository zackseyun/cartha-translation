review_pass:
  verdict: revise
  source_fidelity: A tradução principal emenda silenciosamente πορείαν (“caminho”, “jornada”, “curso”) para “imoralidade sexual”, que corresponderia a πορνείαν. Embora essa última seja a leitura contextual e a pressuposta pela trilha inglesa, o texto grego fornecido deve ser representado no texto principal, com a dificuldade assinalada em nota. “Olhar cobiçoso” também escolhe uma interpretação sexual possível de ὑψηλοόφθαλμος; “olhar altivo” preserva melhor o sentido lexical básico e a ambiguidade.
  naturalness: A redação é clara e de registro apropriado, mas “não se torne dominado pelo desejo” explicita uma ideia de dominação que não está no adjetivo grego. “Não seja inclinado ao desejo” mantém o tom exortativo e é natural em português moderno.
  terminology: “Linguagem obscena” traduz adequadamente αἰσχρολόγος, e “adultérios” conserva o plural de μοιχεῖαι. “Olhar altivo”, com nota sobre a possível conotação sexual contextual, é mais equilibrado do que fixar “olhar cobiçoso” no corpo do texto.
  issues:
  - severity: high
    issue: Emenda não marcada no texto principal de πορείαν para “imoralidade sexual”.
    rationale: O texto-fonte fornecido traz πορείαν, não πορνείαν. Uma nota que informe a discrepância não torna segura uma substituição no corpo da tradução; a leitura recebida e contextualmente esperada deve ser apresentada como possível leitura alternativa.
  - severity: medium
    issue: “Olhar cobiçoso” resolve no texto principal uma ambiguidade de ὑψηλοόφθαλμος.
    rationale: O composto significa literalmente “de olhos elevados” e pode indicar altivez; no contexto, também pode aludir a olhar lascivo. A tradução deve preservar ambas as possibilidades.
  - severity: low
    issue: “Dominado pelo desejo” acrescenta intensidade interpretativa.
    rationale: ἐπιθυμητής descreve alguém dado ao desejo/cobiçoso, sem afirmar necessariamente dominação.
  revised_text: Meu filho, não sejas inclinado ao desejo, pois o desejo conduz ao caminho[a]. Não uses linguagem obscena nem tenhas um olhar altivo[b], pois de todas essas coisas nascem adultérios.
  revised_footnotes:
  - marker: a
    text: O grego fornecido lê “ao caminho” ou “à jornada” (πορείαν). A frase é incomum neste contexto; uma leitura conhecida, “à imoralidade sexual” (πορνείαν), difere por uma letra e explica a tradução da tradição inglesa.
    reason: Representar no texto principal a leitura grega fornecida, ao mesmo tempo que se sinaliza de modo transparente a provável dificuldade textual ou de OCR e a leitura alternativa contextual.
  - marker: b
    text: Literalmente, “de olhos elevados”. Pode significar “de olhar altivo” ou “arrogante”; neste contexto, também pode sugerir um olhar sexualmente cobiçoso.
    reason: Preservar a ambiguidade lexical e contextual de ὑψηλοόφθαλμος sem impor uma única interpretação.
  revision_rationale: A revisão restaura no texto principal o sentido da forma grega efetivamente fornecida e desloca para a nota a leitura alternativa que produz o encadeamento sexual mais esperado. Também reduz a intensificação de ἐπιθυμητής e traduz ὑψηλοόφθαλμος de forma semanticamente aberta, conservando em nota sua possível nuance sexual contextual.
