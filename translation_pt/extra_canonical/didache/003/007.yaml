  text: Ἴσθι δὲ πραῢς, ἐπεὶ οἱ πραεῖς κληρονομήσουσι τὴν γῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/007.yaml
  text: But be meek, because the meek will inherit the earth.
translation:
  language: pt
  text: Mas seja manso, porque os mansos herdarão a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πραῢς / πραεῖς
  choice: manso / mansos
  rationale: Preserva o sentido de brandura, humildade e ausência de agressividade, além de manter a ligação verbal entre a exortação e a promessa.
- source_word: ἐπεὶ
  choice: porque
  rationale: Expressa de modo natural em português a relação causal entre a ordem e a promessa.
- source_word: κληρονομήσουσι
  choice: herdarão
  rationale: Equivalente direto que conserva a linguagem de herança e o tempo futuro.
- source_word: τὴν γῆν
  choice: a terra
  rationale: Mantém a ambiguidade legítima de γῆ, que pode indicar a terra como território ou, em sentido mais amplo, o mundo habitado.
theological_decisions:
- issue: Alcance de τὴν γῆν
  choice: a terra
  alternative: o mundo
  rationale: A formulação tradicional e mais formal preserva a amplitude semântica do grego e a evidente ressonância de Salmo 37:11 e Mateus 5:5, sem definir de maneira indevida o alcance da promessa.
translation_notes:
  register: Português moderno, claro e digno, com imperativo natural no singular e paralelismo lexical preservado entre “manso” e “mansos”.
