  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰ συμβαίνοντά σοι ἐνεργήματα ὡς ἀγαθὰ προσδέξῃ, εἰδὼς ὅτι ἄτερ Θεοῦ οὐδὲν γίνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/010.yaml
  text: You shall accept the things that happen to you as good, knowing that apart from God nothing happens.
translation:
  language: pt
  text: Aceite como boas as coisas que lhe acontecem, sabendo que nada acontece sem Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ συμβαίνοντά σοι ἐνεργήματα
  choice: as coisas que lhe acontecem
  rationale: Expressa em português natural aquilo que sobrevém à pessoa. Embora ἐνεργήματα possa sugerir acontecimentos ou efeitos em ação, a construção inteira pede uma formulação ampla, sem especificar indevidamente sua causa ou natureza.
- source_word: ὡς ἀγαθὰ
  choice: como boas
  rationale: Preserva a força predicativa de ὡς e a orientação ética da exortação, sem reformular como se todos os acontecimentos fossem intrinsecamente agradáveis.
- source_word: προσδέξῃ
  choice: Aceite
  rationale: Traduz a ideia de acolher ou receber favoravelmente em linguagem corrente e digna.
- source_word: ἄτερ Θεοῦ
  choice: sem Deus
  rationale: Equivalente direto e natural, mantendo aberta a relação precisa entre Deus e o que acontece.
- source_word: οὐδὲν γίνεται
  choice: nada acontece
  rationale: Reproduz de modo idiomático a afirmação abrangente do grego.
theological_decisions:
- issue: Relação entre Deus e os acontecimentos
  choice: nada acontece sem Deus
  alternative: nada acontece à parte de Deus
  rationale: A formulação conserva a afirmação forte e deliberadamente não especificada de ἄτερ Θεοῦ, sem acrescentar categorias como vontade, permissão ou causação divina.
- issue: Sentido de receber os acontecimentos como bons
  choice: Aceite como boas as coisas que lhe acontecem
  alternative: Aceite de bom grado as coisas que lhe acontecem
  rationale: A alternativa poderia deslocar 'boas' dos acontecimentos para a disposição de quem os recebe. A opção escolhida preserva a tensão teológica e semântica do texto.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por 'você' realizado pela forma verbal e pelo pronome oblíquo 'lhe'. A frase mantém a concisão proverbial do original e evita explicações doutrinárias ausentes do grego.
