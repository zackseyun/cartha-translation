id: DID.14.2
reference: Didache 14:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ἔχων τὴν ἀμφιβολίαν μετὰ τοῦ ἑταίρου αὐτοῦ μὴ συνελθέτω ὑμῖν, ἕως οὗ διαλλαγῶσιν, ἵνα μὴ κοινωθῇ ἡ θυσία ὑμῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/002.yaml
  text: But let no one who has a dispute with his companion come together with you until they are reconciled, so that your sacrifice may not be defiled.
translation:
  language: pt
  text: Mas ninguém que tenha uma desavença com seu companheiro se reúna com vocês até que se reconciliem, para que o sacrifício de vocês não seja profanado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμφιβολίαν
  choice: desavença
  rationale: No contexto de reconciliação interpessoal, indica discórdia ou disputa; “desavença” é natural em português e preserva o caráter relacional do conflito.
- source_word: ἑταίρου
  choice: companheiro
  rationale: Equivale diretamente a alguém associado ou próximo, sem restringir o vínculo a amizade íntima.
- source_word: συνελθέτω ὑμῖν
  choice: se reúna com vocês
  rationale: Reproduz o sentido comunitário de vir ou juntar-se à assembleia, sem explicitar além do grego a participação eucarística.
- source_word: διαλλαγῶσιν
  choice: se reconciliem
  rationale: Expressa a restauração mútua da relação; a forma plural do grego inclui as partes em conflito.
- source_word: κοινωθῇ
  choice: seja profanado
  rationale: No contexto cultual, o verbo comunica tornar impuro ou impróprio o sacrifício; “profanado” transmite esse sentido de modo claro e digno.
- source_word: θυσία
  choice: sacrifício
  rationale: Mantém a terminologia cultual explícita do original, sem substituí-la por uma interpretação denominacional da refeição comunitária.
theological_decisions:
- issue: Relação entre reconciliação e participação na reunião comunitária
  choice: Manter a proibição de reunir-se com a comunidade até a reconciliação
  alternative: Explicitar que a pessoa não deve participar da Eucaristia
  rationale: O texto diz literalmente que não se reúna com a comunidade; embora o contexto possa ser eucarístico, explicitá-lo eliminaria uma amplitude presente no grego.
- issue: Natureza do “sacrifício”
  choice: Traduzir literalmente como “sacrifício”
  alternative: Interpretar como “Eucaristia”, “oferta” ou “culto”
  rationale: A identificação precisa do referente é teologicamente relevante e não deve ser resolvida silenciosamente na tradução.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O plural “vocês” oferece legibilidade ampla; não foram necessárias notas de rodapé.
