source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Κατὰ κυριακὴν δὲ Κυρίου συναχθέντες κλάσατε ἄρτον καὶ εὐχαριστήσατε προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν, ὅπως καθαρὰ ἡ θυσία ὑμῶν ᾖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/001.yaml
  text: But on the Lord’s own day, when you have gathered together, break bread and give thanks, having first confessed your transgressions, so that your sacrifice may be pure.
translation:
  language: pt
  text: Mas, no dia do Senhor, quando estiverem reunidos, partam o pão e deem graças,[a] tendo primeiro confessado suas transgressões, para que o sacrifício de vocês seja puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «depois de se reunirem, partam o pão e deem graças, tendo primeiro confessado suas transgressões».'
    reason: Os particípios aoristos podem ser expressos em português como orações temporais e uma construção de anterioridade, destacando a sequência das ações e preservando o objeto expresso no grego.
lexical_decisions:
- source_word: Κατὰ κυριακὴν ... Κυρίου
  choice: no dia do Senhor
  rationale: A expressão designa o dia pertencente ao Senhor. Em português, «no dia do Senhor» é natural e digna, sem acrescentar uma identificação calendárica que o texto não explicita.
- source_word: κλάσατε ἄρτον
  choice: partam o pão
  rationale: Preserva a expressão concreta e tradicional do grego, que pode indicar tanto o ato de partir pão quanto a refeição comunitária associada.
- source_word: εὐχαριστήσατε
  choice: deem graças
  rationale: Verte o sentido verbal de agradecer sem substituir o verbo pelo nome técnico posterior «Eucaristia».
- source_word: παραπτώματα
  choice: transgressões
  rationale: Comunica faltas e violações morais com clareza, mantendo o peso ético do termo.
- source_word: θυσία
  choice: sacrifício
  rationale: Mantém diretamente a linguagem sacrificial do original, sem decidir se ela se refere especificamente ao pão, à ação de graças ou ao culto comunitário como um todo.
theological_decisions:
- issue: Natureza do «sacrifício»
  choice: sacrifício
  alternative: oferta
  rationale: O grego θυσία possui sentido sacrificial explícito. A tradução conserva essa tensão teológica e não restringe o referente a uma interpretação eucarística, metafórica ou litúrgica específica.
- issue: Identificação do «dia do Senhor»
  choice: dia do Senhor
  alternative: domingo
  rationale: Embora a expressão tenha sido historicamente entendida como referência ao domingo, o original não usa o nome moderno do dia; por isso, a formulação mais próxima evita explicitar além da fonte.
translation_notes:
  register: Português moderno, claro e reverente, com formas verbais no plural dirigidas à comunidade. «De vocês» favorece ampla compreensão e naturalidade brasileira sem tornar o texto coloquial.
