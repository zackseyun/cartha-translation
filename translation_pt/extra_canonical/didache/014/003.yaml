source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὕτη γάρ ἐστιν ἡ ῥηθεῖσα ὑπὸ Κυρίου· Ἐν παντὶ τόπῳ καὶ χρόνῳ προσφέρειν μοι θυσίαν καθαράν· ὅτι βασιλεὺς μέγας εἰμί, λέγει Κύριος, καὶ τὸ ὄνομά μου θαυμαστὸν ἐν τοῖς ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/003.yaml
  text: 'For this is what was spoken by the Lord: “In every place and time offer me a pure sacrifice[a], because I am a great King,” says the Lord, “and my name is marvelous among the nations.”'
translation:
  language: pt
  text: 'Pois este é o sacrifício anunciado pelo Senhor: “Em todo lugar e em todo tempo, ofereçam-me um sacrifício puro, porque eu sou um grande Rei”, diz o Senhor, “e o meu nome é admirável entre as nações.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη ... ἡ ῥηθεῖσα
  choice: este é o sacrifício do qual ... falou
  rationale: Os dois termos estão no feminino singular e retomam naturalmente θυσία, “sacrifício”, no contexto anterior; o substantivo é explicitado em português para tornar clara a elipse grega.
- source_word: ἐν παντὶ τόπῳ καὶ χρόνῳ
  choice: em todo lugar e em todo tempo
  rationale: Mantém os dois elementos universais do texto grego, inclusive χρόνῳ, sem assimilá-lo silenciosamente à forma conhecida de Malaquias 1:11.
- source_word: προσφέρειν μοι
  choice: ofereçam-me
  rationale: O infinitivo grego tem força injuntiva no discurso citado; o imperativo plural é a forma natural correspondente em português.
- source_word: θυσίαν καθαράν
  choice: um sacrifício puro
  rationale: Reproduz diretamente a linguagem sacrificial sem especificar além do que o texto declara.
- source_word: θαυμαστόν
  choice: admirável
  rationale: Expressa aquilo que inspira admiração ou assombro, em registro digno e atual.
- source_word: ἐν τοῖς ἔθνεσι
  choice: entre as nações
  rationale: Preserva o sentido coletivo e internacional de ἔθνη sem restringi-lo ao sentido religioso de “gentios”.
theological_decisions:
- issue: Antecedente feminino de αὕτη e ἡ ῥηθεῖσα
  choice: Explicitar “o sacrifício” como antecedente contextual
  alternative: “Pois isto é o que foi dito pelo Senhor”
  rationale: A concordância feminina e o contexto dos versículos anteriores favorecem a referência ao sacrifício; a tradução alternativa neutraliza essa ligação gramatical. A nota registra a elipse para não apresentar a explicitação como se o substantivo estivesse repetido no grego.
- issue: Natureza do “sacrifício puro”
  choice: Não identificar ou definir o sacrifício além das palavras do texto
  alternative: Explicá-lo explicitamente como Eucaristia ou como sacrifício de louvor
  rationale: Embora o contexto imediato informe a interpretação, o versículo citado usa apenas linguagem sacrificial; ampliar a identificação no corpo do texto importaria uma resolução teológica não expressa nesta frase.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A citação conserva a cadência profética e a repetição de “Senhor” do grego.
