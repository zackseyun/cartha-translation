revisions:
- from: 'Pois este é o sacrifício do qual o Senhor falou[a]: “Em todo lugar e em todo tempo, ofereçam-me um sacrifício puro, porque eu sou um grande Rei”, diz o Senhor, “e o meu nome é admirável entre as nações.”'
  to: 'Pois este é o sacrifício anunciado pelo Senhor: “Em todo lugar e em todo tempo, ofereçam-me um sacrifício puro, porque eu sou um grande Rei”, diz o Senhor, “e o meu nome é admirável entre as nações.”'
  rationale: A revisão troca “do qual o Senhor falou” por “anunciado pelo Senhor”, preservando tanto a retomada contextual de “sacrifício” quanto a voz passiva e a agência expressas no grego. A nota foi removida porque sua formulação de literalidade é imprecisa e a tradução revista já comunica o sentido sem exigir explicação adicional.
