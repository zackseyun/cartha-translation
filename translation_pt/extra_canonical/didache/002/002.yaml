  source_fidelity: O texto mantém a sequência, as repetições e as distinções lexicais do grego. «Não mate» reproduz deliberadamente φονεύσεις nas duas ocorrências, sem fixar indevidamente a nuance como apenas «assassinar». «Não abuse sexualmente de meninos» comunica de forma clara o sentido sexual de παιδοφθορήσεις, enquanto a nota registra a formulação literal e a raridade do verbo. A formulação sobre a criança «por aborto» corresponde à interpretação contextual tradicional de τέκνον ἐν φθορᾷ, e a nota preserva a literalidade incomum de «em destruição».
  naturalness: O português é moderno, direto e amplamente compreensível. A sucessão de imperativos negativos é natural e conserva o caráter conciso e parenético da lista. «Magia» e «feitiçaria» distinguem adequadamente os dois termos gregos sem soar artificial.
  terminology: A terminologia sexual é clara sem recorrer a jargão histórico. «Imoralidade sexual» é uma solução ampla adequada para πορνεύσεις. «Magia» para μαγεύσεις e «feitiçaria» para φαρμακεύσεις preservam a distinção do original; a nota lexical e as decisões registradas evitam reduzir φαρμακεύσεις exclusivamente a venenos ou drogas.
