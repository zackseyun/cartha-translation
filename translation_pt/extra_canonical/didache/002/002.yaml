source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ φονεύσεις, οὐ μοιχεύσεις, οὐ παιδοφθορήσεις, οὐ πορνεύσεις, οὐ κλέψεις, οὐ μαγεύσεις, οὐ φαρμακεύσεις, οὐ φονεύσεις τέκνον ἐν φθορᾷ οὐδὲ γεννηθὲν ἀποκτενεῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/002.yaml
  text: You shall not murder; you shall not commit adultery; you shall not sexually abuse boys;a you shall not commit sexual immorality; you shall not steal; you shall not practice magic; you shall not use sorcery; you shall not kill a child by abortion, nor kill one that has been born.b
translation:
  language: pt
  text: Não mate; não cometa adultério; não abuse sexualmente de meninos;[a] não pratique imoralidade sexual; não roube; não pratique magia; não pratique feitiçaria; não mate uma criança por aborto, nem mate a que já nasceu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego é raro e significa literalmente algo como «corromper meninos»; neste contexto, refere-se à exploração ou ao abuso sexual de meninos.
    reason: Preserva a forma e a relativa raridade do termo-fonte, esclarecendo por que a tradução explicita o caráter sexual.
  - marker: b
    text: A expressão traduzida por «por aborto» é literalmente «em destruição». O contraste é entre matar a criança antes do nascimento e matar a que já nasceu.
    reason: Registra a formulação incomum do grego e a base contextual para a tradução.
lexical_decisions:
- source_word: φονεύσεις
  choice: mate
  rationale: Expressa diretamente a proibição de tirar a vida humana; no primeiro mandamento, o contexto tradicional também permite entender «assassinar», mas «matar» preserva a correspondência verbal com a cláusula posterior.
- source_word: παιδοφθορήσεις
  choice: abuse sexualmente de meninos
  rationale: O verbo raro designa, neste catálogo sexual, a corrupção ou exploração sexual de um menino; a formulação moderna comunica claramente o abuso sem recorrer a expressão obscura.
- source_word: πορνεύσεις
  choice: pratique imoralidade sexual
  rationale: Abrange conduta sexual ilícita de modo mais amplo do que «prostituir-se» ou uma forma específica de relação sexual.
- source_word: μαγεύσεις
  choice: pratique magia
  rationale: Mantém a distinção lexical em relação ao verbo seguinte e evita especificar uma modalidade não indicada no texto.
- source_word: φαρμακεύσεις
  choice: pratique feitiçaria
  rationale: No contexto de uma lista de proibições, o termo se refere ao uso de drogas, poções ou venenos associado à feitiçaria; «feitiçaria» é natural e preserva sua distinção de «magia».
- source_word: τέκνον ἐν φθορᾷ
  choice: uma criança por aborto
  rationale: A expressão significa literalmente uma criança «em/por destruição» e foi tradicionalmente entendida como referência à eliminação da criança mediante aborto.
- source_word: γεννηθὲν
  choice: a que já nasceu
  rationale: Traduz o particípio passivo com clareza e mantém o contraste entre a criança abortada e a já nascida.
theological_decisions:
- issue: Alcance de φονεύω
  choice: «mate» no texto, com nota sobre a possível nuance de assassinato na primeira ocorrência
  alternative: «assassine»
  rationale: A tradução conserva a repetição lexical do grego e não decide de modo rígido entre matar em sentido amplo e matar ilicitamente.
- issue: Sentido de παιδοφθορέω
  choice: abuso sexual de meninos
  alternative: «corromper meninos» ou referência mais específica à pederastia
  rationale: O contexto sexual favorece uma referência a exploração sexual, mas a tradução não importa uma descrição histórica mais estreita do que o verbo exige.
- issue: Sentido de φαρμακεύω
  choice: feitiçaria
  alternative: «usar venenos»
  rationale: O termo pode envolver poções, drogas ou venenos, porém sua colocação após «praticar magia» favorece a esfera da feitiçaria; a nota preserva a amplitude lexical.
translation_notes:
  register: Português moderno, digno e direto, com imperativos negativos naturais. Preferiu-se «não mate» a «não matarás» para ampla inteligibilidade contemporânea. A repetição de «não pratique» e «não mate» acompanha a estrutura enfática da lista grega.
