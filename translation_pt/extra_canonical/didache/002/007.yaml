source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μισήσεις πάντα ἄνθρωπον, ἀλλὰ οὓς μὲν ἐλέγξεις, περὶ δὲ ὧν προσεύξῃ, οὓς δὲ ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/007.yaml
  text: You shall not hate any person, but some you shall reprove, for some you shall pray, and some you shall love more than your own life.
translation:
  language: pt
  text: Não odeie pessoa alguma; mas repreenda alguns, ore por outros e ame outros mais do que a própria vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mais do que a sua própria alma”. A palavra grega também pode significar “alma” ou “vida”.'
    reason: Preservar a amplitude semântica de ψυχή e tornar visível a alternativa formal.
lexical_decisions:
- source_word: ἄνθρωπον
  choice: pessoa
  rationale: O termo é genérico neste contexto e não se limita ao sexo masculino; “pessoa alguma” preserva a abrangência da proibição.
- source_word: ἐλέγξεις
  choice: repreenda
  rationale: Expressa a ideia de confrontar alguém com seu erro ou censurá-lo, sem reduzir o verbo a uma correção meramente instrutiva.
- source_word: προσεύξῃ
  choice: ore
  rationale: Verbo comum e direto para dirigir oração a Deus; a preposição περὶ é naturalmente expressa por “por” em português.
- source_word: ἀγαπήσεις
  choice: ame
  rationale: Mantém o sentido amplo e forte de amar, em paralelo com as demais exortações.
- source_word: ψυχήν
  choice: vida
  rationale: Embora ψυχή também possa significar “alma”, a comparação idiomática indica aqui a própria vida, isto é, amar alguém a ponto de colocá-lo acima da autopreservação.
theological_decisions:
- issue: Sentido de ψυχή na expressão ὑπὲρ τὴν ψυχήν σου
  choice: a própria vida
  alternative: a própria alma
  rationale: O contexto comparativo favorece “vida”, mas a nota conserva a amplitude lexical do grego sem impor uma antropologia específica.
translation_notes:
  register: Português moderno, claro e digno, com imperativos que reproduzem a força normativa dos futuros gregos sem o tom arcaizante de “não odiarás”. A alternância “alguns / outros / outros” mantém os três grupos do original.
