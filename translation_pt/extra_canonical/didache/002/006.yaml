  text: Οὐκ ἔσῃ πλεονέκτης οὐδὲ ἅρπαξ οὐδὲ ὑποκριτὴς οὐδὲ κακοήθης οὐδὲ ὑπερήφανος. Οὐ λήψῃ βουλὴν πονηρὰν κατὰ τοῦ πλησίον σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/006.yaml
  text: You shall not be greedy[a], nor grasping, nor a hypocrite, nor malicious, nor arrogant. You shall not take evil counsel against your neighbor.
translation:
  language: pt
  text: Não seja ganancioso, nem rapace, nem hipócrita, nem maldoso, nem arrogante. Não adote um plano perverso contra o seu próximo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não aceite um conselho perverso contra o seu próximo.”'
    reason: A expressão grega pode referir-se tanto a adotar um plano ou desígnio quanto a aceitar um conselho.
lexical_decisions:
- source_word: πλεονέκτης
  choice: ganancioso
  rationale: Expressa o desejo egoísta de obter cada vez mais, em linguagem corrente e adequada a uma lista de vícios.
- source_word: ἅρπαξ
  choice: explorador
  rationale: Comunica a ideia de alguém que se apodera voraz ou injustamente do que pertence a outros, evitando o pouco usual “rapace” e sem restringir o termo apenas ao furto.
- source_word: κακοήθης
  choice: maldoso
  rationale: Reflete o caráter ativamente mau, malicioso ou perverso indicado pelo grego, com clareza no português moderno.
- source_word: ὑπερήφανος
  choice: arrogante
  rationale: Mantém a censura à soberba manifestada como altivez diante dos outros.
- source_word: λήψῃ βουλὴν πονηράν
  choice: adote um plano perverso
  rationale: “Adote” conserva o sentido básico de receber ou tomar, enquanto “plano” representa βουλή em seu sentido de propósito ou desígnio; a nota registra a possibilidade de entender a expressão como aceitar conselho.
- source_word: πλησίον
  choice: próximo
  rationale: É a correspondência tradicional, ampla e teologicamente não restritiva para a pessoa com quem se mantém relação de proximidade.
theological_decisions:
- issue: Força normativa dos futuros gregos em uma série de proibições
  choice: Imperativos negativos com “não seja” e “não adote”
  alternative: 'Futuros solenes: “não serás” e “não adotarás”'
  rationale: Em português atual, o imperativo transmite de modo natural a força proibitiva do futuro grego sem diminuir sua autoridade moral.
- issue: Ambiguidade de λήψῃ βουλήν
  choice: Plano perverso no texto, com alternativa em nota
  alternative: Conselho perverso
  rationale: O contexto favorece uma intenção ou trama dirigida contra o próximo, mas a construção também pode significar aceitar ou seguir um conselho; a nota preserva essa abertura sem forçar uma solução única.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A repetição de “nem” preserva o ritmo catequético da lista grega.
