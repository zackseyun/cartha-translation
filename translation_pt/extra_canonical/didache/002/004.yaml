base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/004.yaml
  text: You shall not be double-minded nor double-tongued, for double-tongued speech is a snare of death.
translation:
  language: pt
  text: Não seja de mente dividida nem de língua dupla[a], pois a duplicidade no falar é uma armadilha de morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, falso ou contraditório no falar. O grego emprega termos relacionados para “língua dupla” e “duplicidade no falar”.
    reason: Esclarece uma metáfora pouco usual em português e registra o jogo lexical presente no original.
lexical_decisions:
- source_word: διγνώμων
  choice: de mente dividida
  rationale: Expressa a ideia de alguém dividido em seu juízo ou propósito, em português atual, sem reduzir o termo apenas a indecisão ocasional.
- source_word: δίγλωσσος
  choice: de língua dupla
  rationale: Preserva a metáfora grega da língua e sua ligação verbal com διγλωσσία, indicando fala contraditória ou enganosa.
- source_word: διγλωσσία
  choice: duplicidade no falar
  rationale: Torna natural em português o substantivo grego e mantém o sentido de fala dúplice, além de conservar a ligação semântica com “língua dupla”.
- source_word: παγὶς θανάτου
  choice: uma armadilha de morte
  rationale: Reproduz diretamente a imagem forte do grego, sem decidir se a morte é consequência, finalidade ou esfera da armadilha.
theological_decisions:
- issue: Alcance de “morte” em παγὶς θανάτου
  choice: morte
  alternative: morte espiritual ou perdição
  rationale: O texto não especifica a natureza da morte; a tradução mantém a formulação ampla e evita impor uma interpretação teológica particular.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura proverbial e a metáfora da armadilha foram preservadas.
