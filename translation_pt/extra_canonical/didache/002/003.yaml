  text: Οὐκ ἐπιθυμήσεις τὰ τοῦ πλησίον, οὐκ ἐπιορκήσεις, οὐ ψευδομαρτυρήσεις, οὐ κακολογήσεις, οὐ μνησικακήσεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/003.yaml
  text: You shall not covet the things of your neighbor[a]; you shall not swear falsely; you shall not bear false witness; you shall not speak evil; you shall not hold a grudge.
translation:
  language: pt
  text: Não cobice as coisas do seu próximo[a]; não jure falsamente; não dê falso testemunho; não fale mal de ninguém; não guarde rancor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não deseje as coisas do seu próximo».'
    reason: Preserva a possibilidade de uma tradução lexicalmente mais ampla de ἐπιθυμέω, embora «cobice» seja preferível neste contexto.
lexical_decisions:
- source_word: ἐπιθυμήσεις
  choice: cobice
  rationale: No contexto de τὰ τοῦ πλησίον e do eco do Decálogo, o verbo expressa desejo ilícito pelo que pertence ao próximo; «cobice» preserva essa força melhor que o neutro «deseje».
- source_word: πλησίον
  choice: próximo
  rationale: Termo bíblico natural e amplamente compreensível para a pessoa com quem se mantém uma relação ética.
- source_word: ἐπιορκήσεις
  choice: jure falsamente
  rationale: Expressa de modo direto o ato de prestar juramento falso ou violar a verdade sob juramento.
- source_word: ψευδομαρτυρήσεις
  choice: dê falso testemunho
  rationale: Mantém o eco jurídico e bíblico da proibição de testemunhar falsamente.
- source_word: κακολογήσεις
  choice: fale mal de ninguém
  rationale: Verte naturalmente a proibição de difamar, insultar ou falar de modo nocivo, sem restringi-la a uma única forma de agressão verbal.
- source_word: μνησικακήσεις
  choice: guarde rancor
  rationale: O verbo denota conservar na memória uma ofensa e alimentar ressentimento; «guardar rancor» é a expressão portuguesa corrente e precisa.
theological_decisions:
- issue: Força de ἐπιθυμέω no eco do Decálogo
  choice: cobice
  alternative: deseje
  rationale: A formulação não condena todo desejo, mas o desejo indevido pelo que pertence ao próximo. A nota conserva a alternativa lexical mais literal.
translation_notes:
  register: Português moderno, digno e de leitura natural, com imperativos negativos na forma brasileira corrente. A repetição de «não» preserva a cadência parenética do grego; «de ninguém» torna idiomático o uso absoluto de κακολογέω sem alterar o alcance geral da proibição.
