lexical_decisions:
- source_word: porter / gatekeeper
  choice: porteiro
  rationale: Reproduz de modo natural a função doméstica indicada pelo testemunho, sem especificar indevidamente que se tratava de um guarda.
- source_word: strange man
  choice: estrangeiro
  rationale: Preserva a ideia de alguém desconhecido ou vindo de fora; no contexto, refere-se a Paulo.
- source_word: judgement seat
  choice: tribunal
  rationale: Expressa em português corrente tanto o lugar quanto a instância de julgamento, evitando o pouco natural ‘assento de julgamento’.
- source_word: lay wallowing on the ground
  choice: permanecia prostrada no chão
  rationale: Comunica a postura intensa de Tecla sem sugerir, pelo verbo ‘revolver-se’, um movimento físico que o testemunho pode exagerar ou deixar incerto.
- source_word: magician
  choice: feiticeiro
  rationale: Mantém o caráter acusatório de prática mágica ilícita; ‘mago’ poderia soar neutro ou prestigioso em português moderno.
- source_word: the law of the Iconians
  choice: a lei dos habitantes de Icônio
  rationale: Torna claro o gentílico raro sem decidir se a expressão designa lei formal ou costume cívico.
- source_word: whipt out of the city
  choice: açoitado e expulso da cidade
  rationale: 'Preserva os dois componentes da pena: castigo corporal e expulsão.'
- source_word: in the likeness of Paul
  choice: com a aparência de Paulo
  rationale: Mantém a identificação visual sem afirmar identidade corporal ou explicar teologicamente a visão.
- source_word: stake / pile
  choice: fogueira / pilha
  rationale: O contexto descreve madeira preparada para a execução; ‘fogueira’ é natural, enquanto ‘pilha’ no versículo seguinte retém o aspecto material.
- source_word: preserved
  choice: preservada
  rationale: Mantém a formulação sóbria do testemunho, sem ampliar para uma terminologia técnica de salvação.
theological_decisions:
- issue: A aparição do Senhor Jesus com a aparência de Paulo
  choice: Traduzida literalmente como uma visão do Senhor Jesus ‘com a aparência de Paulo’.
  alternative: Interpretar que Paulo representava Cristo ou que Cristo tomou corporalmente a forma de Paulo.
  rationale: O texto narra a percepção de Tecla, mas não explica a natureza da manifestação; a tradução preserva essa tensão.
- issue: As ‘obras santas de Cristo’
  choice: Mantida a expressão ‘obras santas de Cristo’.
  alternative: Explicitar como obras realizadas por Cristo ou obras cristãs realizadas pelos fiéis.
  rationale: A relação do genitivo é ambígua no testemunho fornecido e não deve ser resolvida sem revisão direta do grego.
- issue: O sinal da cruz
  choice: Mantida a referência explícita a ‘fazer o sinal da cruz’.
  alternative: Generalizar como ‘fez o sinal’ ou harmonizar com prática denominacional posterior.
  rationale: A ação pertence à forma textual recebida e deve permanecer sem comentário confessional.
- issue: Intervenção divina e fenômenos naturais
  choice: 'Mantida a causalidade narrativa: Deus teve compaixão e provocou a ruptura da terra, a chuva e o granizo.'
  alternative: Naturalizar os acontecimentos como coincidências meteorológicas e sísmicas.
  rationale: A causalidade teológica é uma afirmação explícita da narrativa, não uma inferência do tradutor.
- issue: Mortes causadas pela ruptura da terra
  choice: Mantida a afirmação de que alguns morreram.
  alternative: Atenuar para ferimentos ou risco de morte.
  rationale: Preserva a dificuldade moral e narrativa do episódio em vez de suavizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação evita arcaísmos como ‘eis que’, ‘varão’ e construções excessivamente literais. Como a revisão direta do grego e das versões antigas está pendente, o texto é um rascunho cauteloso baseado no testemunho inglês público fornecido e na camada de consulta auditada; ambiguidades relevantes foram preservadas em vez de resolvidas por conjectura.
