base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/005.yaml
  text: '5:1 At last Thecla was missed, and her family and Thamyris searched for her in every street, as though she had been lost. But one of the gatekeeper’s fellow servants told them that she had gone out during the night.


    5:2 Then they questioned the gatekeeper, and he told them that she had gone to the prison to see the stranger.


    5:3 So they followed his directions and found her there. When they came out, they gathered a mob and went and told the governor everything that had happened.


    5:4 At this, he ordered Paul to be brought before his judgment seat.


    5:5 Meanwhile, Thecla lay wallowing on the prison floor, in the very place where Paul had sat while teaching her. So the governor also ordered her to be brought before his judgment seat. She received the summons with joy and went.


    5:6 When Paul was brought there, the mob cried out even more fiercely, “He is a magician! Let him die!”


    5:7 Nevertheless, the governor listened with pleasure to Paul’s discourses about the holy works of Christ. After convening a council, he summoned Thecla and said to her, “Why do you not marry Thamyris, according to the law of the Iconians?”


    5:8 She stood silent, with her eyes fixed on Paul. When she gave no answer, her mother, Theoclia, cried out, “Let the unjust creature be burned! Let her be burned in the middle of the theater for refusing Thamyris, so that all women may learn from her to avoid such practices!”


    5:9 Then the governor became exceedingly distressed and ordered Paul to be whipped out of the city and Thecla to be burned.


    5:10 So the governor arose and went immediately into the theater, and all the people went out to see the dreadful sight.


    5:11 But just as a lamb in the wilderness looks all around for its shepherd, Thecla looked around for Paul.


    5:12 As she looked at the multitude, she saw the Lord Jesus in the likeness of Paul and said to herself, “Paul has come to see me in my distress.” She fixed her eyes on him, but as she watched, he immediately ascended into heaven.


    5:13 Then the young men and women brought wood and straw for Thecla’s burning. When she was brought naked to the stake, the governor gazed in amazement at the greatness of her beauty and was moved to tears.


    5:14 When they had arranged the wood, the people commanded her to step onto it. She did so, first making the sign of the cross.


    5:15 Then the people set fire to the pile. Although the flame was exceedingly large, it did not touch her, for God had compassion on her and caused a great eruption from the earth beneath, while a cloud above poured down great quantities of rain and hail.


    5:16 Because of the rupture of the earth, very many were in great danger, and some were killed. The fire was extinguished, and Thecla was preserved.'
translation:
  language: pt
  text: '**Atos de Paulo e Tecla — Capítulo 5**


    **5:1** Por fim, deram pela falta de Tecla, e sua família e Tamíris a procuraram por todas as ruas, como se ela estivesse perdida. Mas um dos companheiros de serviço do porteiro lhes contou que ela havia saído durante a noite.


    **5:2** Então interrogaram o porteiro, e ele lhes disse que ela tinha ido à prisão para ver o estrangeiro.


    **5:3** Eles, portanto, seguiram suas indicações e a encontraram ali. Ao saírem, reuniram uma multidão e foram contar ao governador tudo o que havia acontecido.


    **5:4** Diante disso, ele ordenou que Paulo fosse levado ao seu tribunal.


    **5:5** Enquanto isso, Tecla permanecia prostrada no chão da prisão, exatamente no lugar onde Paulo estivera sentado enquanto a ensinava. Então o governador ordenou que ela também fosse levada ao tribunal. Ela recebeu a convocação com alegria e foi.


    **5:6** Quando Paulo foi levado até lá, a multidão gritou com ainda mais violência: “Ele é um feiticeiro! Que morra!”


    **5:7** Contudo, o governador ouvia com prazer os discursos de Paulo sobre as obras santas de Cristo. Depois de reunir um conselho, mandou chamar Tecla e lhe perguntou: “Por que você não se casa com Tamíris, conforme a lei dos habitantes de Icônio?”


    **5:8** Ela permaneceu em silêncio, com os olhos fixos em Paulo. Como não respondesse, Teóclia, sua mãe, gritou: “Que essa criatura injusta seja queimada! Que seja queimada no meio do teatro por ter rejeitado Tamíris, para que todas as mulheres aprendam com ela a evitar semelhante conduta!”


    **5:9** Então o governador ficou profundamente angustiado e ordenou que Paulo fosse açoitado e expulso da cidade, e que Tecla fosse queimada.


    **5:10** O governador se levantou e foi imediatamente ao teatro, e todo o povo saiu para ver o terrível espetáculo.


    **5:11** Mas, assim como um cordeiro no deserto olha para todos os lados à procura de seu pastor, Tecla olhava ao redor à procura de Paulo.


    **5:12** Enquanto contemplava a multidão, ela viu o Senhor Jesus com a aparência de Paulo e disse consigo mesma: “Paulo veio me ver nesta aflição”. Ela manteve os olhos fixos nele, mas, enquanto o observava, ele imediatamente subiu ao céu.


    **5:13** Então os rapazes e as moças trouxeram madeira e palha para queimar Tecla. Quando ela foi conduzida nua até a fogueira, o governador contemplou, admirado, sua grande beleza e foi levado às lágrimas.


    **5:14** Depois de arrumarem a madeira, o povo ordenou que ela subisse na fogueira. Ela subiu, fazendo primeiro o sinal da cruz.


    **5:15** Então o povo ateou fogo à pilha. Embora as chamas fossem imensas, não a tocaram, pois Deus teve compaixão dela e fez irromper a terra por baixo, enquanto uma nuvem, do alto, derramava grande quantidade de chuva e granizo.


    **5:16** Por causa da ruptura da terra, muitos ficaram em grave perigo, e alguns morreram. O fogo se apagou, e Tecla foi preservada.'
