review_pass:
  verdict: revise
  source_fidelity: 'O rascunho acompanha de perto o testemunho inglês fornecido. Duas imagens materiais requerem ajuste: em 5:5, “wallowing” é mais intenso do que simplesmente estar prostrada; em 5:13, “stake” deve ser distinguido da madeira/pilha da fogueira preparada no versículo seguinte. A revisão direta do grego e das tradições versionais continua pendente.'
  naturalness: O português é moderno, claro e de registro apropriado. Os ajustes tornam mais concreta a ação em 5:5 e preservam com clareza a sequência da execução em 5:13–14.
  terminology: 'Nomes, títulos e termos teológicos estão adequados: Tecla, Tamíris, Teóclia, Icônio, Senhor Jesus, Cristo e sinal da cruz. “Tribunal”, “feiticeiro” e “estrangeiro” reproduzem satisfatoriamente o testemunho de base.'
  issues:
  - severity: medium
    issue: 5:5 — “permanecia prostrada” atenua “lay wallowing on the ground”.
    rationale: O testemunho descreve Tecla no chão em movimento/agonia corporal; “jazia revolvendo-se” preserva melhor essa imagem sem acrescentar explicação.
  - severity: medium
    issue: 5:13 — “fogueira” antecipa e confunde o “stake” com a madeira organizada e incendiada em 5:14–15.
    rationale: O testemunho primeiro situa Tecla junto a um poste/estaca e depois menciona a madeira sobre a qual ela é mandada subir. A distinção deve permanecer na tradução.
  - severity: low
    issue: 5:15 — “fez irromper a terra por baixo” é pouco idiomático e torna menos explícita a grande ruptura/erupção do solo.
    rationale: “Fez que a terra se rompesse violentamente sob ela” comunica de modo natural a ação narrativa sem alterar sua causalidade.
