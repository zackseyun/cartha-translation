lexical_decisions:
- source_word: charity (Greek review pending)
  choice: amor
  rationale: Em português moderno, “amor” comunica com mais naturalidade a virtude religiosa pretendida; “caridade” poderia sugerir sobretudo assistência material.
- source_word: virgin
  choice: virgem
  rationale: Preserva a designação recorrente e sua relevância para o tema da castidade no relato.
- source_word: chastity
  choice: castidade / castos
  rationale: Mantém o conteúdo ascético e sexual do testemunho sem o restringir antecipadamente a celibato formal ou virgindade.
- source_word: subdued
  choice: conquistada
  rationale: Expressa que Tecla foi vencida ou dominada persuasivamente pelos ensinamentos, sem sugerir coerção física.
- source_word: spouse
  choice: noiva
  rationale: Como Tecla ainda está prometida em casamento, “noiva” evita a impressão anacrônica de que o casamento já ocorreu.
- source_word: chief person
  choice: pessoa importante
  rationale: Preserva prudentemente a ideia de proeminência social, pois a revisão do termo grego ainda está pendente.
- source_word: defile your flesh
  choice: contaminem sua carne
  rationale: Conserva a linguagem corporal e moral forte do testemunho, sem parafrasear a expressão segundo uma teologia posterior.
theological_decisions:
- issue: Relação entre castidade e ressurreição em 2:16
  choice: Preservar a formulação condicional forte dentro da fala de Demas e Hermógenes
  alternative: Atenuar para uma recomendação geral de castidade ou apresentar a frase como doutrina inequívoca de Paulo
  rationale: O testemunho atribui a caracterização aos interlocutores, e a tensão teológica não deve ser resolvida silenciosamente.
- issue: Um só Deus e adoração em 2:7
  choice: “há um só Deus, o único que deve ser adorado”
  alternative: “há apenas um Deus, a quem exclusivamente se deve prestar culto”
  rationale: A redação escolhida é clara e digna, mantendo tanto a unicidade divina quanto a exclusividade da adoração.
- issue: “Palavra de Cristo” em 2:4
  choice: Manter “a palavra de Cristo”
  alternative: Interpretar como “a mensagem sobre Cristo” ou “a palavra pronunciada por Cristo”
  rationale: A expressão admite mais de uma relação genitiva; a tradução literal preserva essa ambiguidade.
translation_notes:
  register: 'Português moderno, corrente e digno, com legibilidade brasileira e vocabulário amplamente internacional. Os diálogos usam travessões, e a sintaxe arcaica do testemunho inglês foi naturalizada sem eliminar repetições narrativamente relevantes. Este rascunho é necessariamente provisório: foi elaborado a partir do testemunho inglês de domínio público fornecido, pois a revisão direta do grego e das versões antigas está pendente.'
