translation:
  language: pt
  text: '**Atos de Paulo e Tecla — Capítulo 2**


    **2:1** Enquanto Paulo pregava esse sermão na igreja que se reunia na casa de Onesíforo, uma jovem virgem chamada Tecla — cuja mãe se chamava Teóclia e que estava prometida em casamento a um homem chamado Tamíris — estava sentada junto a uma janela de sua casa.


    **2:2** Dali, graças a uma janela da casa onde Paulo estava, ela ouvia dia e noite as pregações de Paulo a respeito de Deus, do amor, da fé em Cristo e da oração.


    **2:3** Ela não se afastava da janela e, com imensa alegria, acabou conquistada pelos ensinamentos da fé.


    **2:4** Quando viu muitas mulheres e virgens entrando para ouvir Paulo, desejou ardentemente ser considerada digna de comparecer diante dele e ouvir a palavra de Cristo. Pois ainda não tinha visto Paulo em pessoa; apenas ouvira suas pregações.


    **2:5** Como ninguém conseguia convencê-la a sair da janela, sua mãe mandou chamar Tamíris. Ele veio muito contente, esperando que agora se casaria com ela. Então perguntou a Teóclia:


    — Onde está a minha Tecla?


    **2:6** Teóclia respondeu:


    — Tamíris, tenho algo muito estranho para lhe contar. Há três dias Tecla não sai da janela, nem mesmo para comer ou beber. Está tão absorta, ouvindo os discursos habilidosos e enganadores de certo estrangeiro, que fico completamente espantada, Tamíris, ao ver uma jovem de reconhecida modéstia deixar-se dominar dessa maneira.


    **2:7** Esse homem perturbou toda a cidade de Icônio e, entre outras pessoas, até mesmo a sua Tecla. Todas as mulheres e os jovens correm para ele a fim de receber seu ensinamento. Além de tudo isso, ele lhes diz que há um só Deus, o único que deve ser adorado, e que devemos viver em castidade.


    **2:8** Apesar disso, minha filha Tecla está presa à janela como uma teia de aranha, cativada pelos discursos de Paulo. Ela os acompanha com extraordinária avidez e enorme prazer; assim, de tanto prestar atenção ao que ele diz, a jovem está sendo seduzida. Vá agora falar com ela, pois está prometida em casamento a você.


    **2:9** Tamíris foi até ela e a saudou, tomando cuidado para não a assustar. Então disse:


    — Tecla, minha noiva, por que você está sentada aí com esse ar tão triste? Que estranhas impressões tomaram conta de você? Volte-se para Tamíris e fique envergonhada.[a]


    **2:10** Sua mãe também lhe falou do mesmo modo:


    — Filha, por que você está sentada tão triste e, como alguém atônito, não responde nada?


    **2:11** Então todos choraram muito: Tamíris, porque havia perdido a noiva; Teóclia, porque havia perdido a filha; e as servas, porque haviam perdido sua senhora. Toda a família ficou de luto.


    **2:12** Nada disso, porém, impressionou Tecla a ponto de fazê-la sequer se voltar para eles e lhes dar atenção, pois ela continuava concentrada nos discursos de Paulo.


    **2:13** Então Tamíris correu para a rua a fim de observar quem entrava para ouvir Paulo e quem saía de lá. Viu dois homens envolvidos numa discussão muito acalorada e lhes perguntou:


    **2:14** — Senhores, o que fazem aqui? Quem é aquele homem lá dentro, companheiro de vocês, que engana a mente das pessoas — tanto dos jovens como das virgens — persuadindo-as a não se casar, mas a permanecer como estão?


    **2:15** Prometo dar-lhes uma soma considerável se me derem informações verdadeiras sobre ele, pois sou uma pessoa importante nesta cidade.[b]


    **2:16** Demas e Hermógenes responderam:


    — Não sabemos dizer com exatidão quem ele é. Mas sabemos que priva os jovens de suas futuras esposas e as virgens de seus futuros maridos ao ensinar: “Não poderá haver ressurreição futura para vocês, a menos que permaneçam castos e não contaminem sua carne.”[c]


    **Notas**


    [a] **2:9** “Fique envergonhada” reproduz uma expressão difícil do testemunho disponível, possivelmente um apelo para que Tecla recupere o recato esperado de uma noiva e reconheça Tamíris.


    [b] **2:15** Ou: “pois sou o principal homem desta cidade”. O testemunho inglês disponível pode indicar posição social ou autoridade cívica.


    [c] **2:16** Esta declaração é a caracterização que Demas e Hermógenes fazem do ensino de Paulo; a narrativa não necessariamente a apresenta como formulação direta ou imparcial do próprio Paulo. A relação exata entre castidade e ressurreição deverá ser conferida na tradição manuscrita grega e nas versões antigas.'
