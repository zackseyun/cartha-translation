  source_fidelity: O texto português acompanha de perto o testemunho inglês fornecido, inclusive as formulações textualmente difíceis em 4:3, 4:6 e 4:7. A revisão direta do grego permanece pendente, como indicado no contexto; portanto, não há base segura para resolver de modo diferente as ambiguidades do testemunho.
  naturalness: Português moderno, claro e de registro narrativo adequado. Os diálogos e as construções judiciais soam naturais para leitores brasileiros sem se restringirem ao uso brasileiro.
  terminology: «Tamíris», «Demas», «Hermógenes», «Paulo» e «Tecla» estão consistentes. «Tribunal», «casamento ilícito», «Deus de vingança», «temor de Deus» e «correntes» preservam adequadamente o teor do testemunho. «Grandezas de Deus» é uma solução idiomática aceitável para a expressão ampla do inglês.
  issues:
