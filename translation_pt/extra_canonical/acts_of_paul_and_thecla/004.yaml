base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/004.yaml
  text: '4:1 Then Thamyris stood before the governor’s judgment seat and spoke loudly as follows:


    4:2 “Governor, I do not know where this man comes from, but he teaches that marriage is unlawful. Therefore, command him to explain before you why he proclaims such doctrines.”


    4:3 While he was speaking, Demas and Hermogenes (whispered to Thamyris, and) said, “Say that he is a Christian, and he will immediately be put to death.”


    4:4 But the governor was more deliberate. He called Paul and said, “Who are you? What do you teach? They seem to accuse you of serious crimes.”


    4:5 Then Paul spoke loudly, saying, “Since I am now called to give an account of my teachings, Governor, I ask you to hear me.


    4:6 “God, who is a God of vengeance and needs nothing except the salvation of his creatures, has sent me to turn them away from their wickedness and corruption, from all (sinful) pleasures, and from death, and to persuade them to sin no more.


    4:7 “For this reason, God sent his Son Jesus Christ, whom I proclaim and in whom I teach people to place their hope. He alone had such compassion on the deluded world that it might not be condemned, Governor, but might have faith, the fear of God, the knowledge of religion, and the love of truth.


    4:8 “So if I teach only those things that I received by revelation from God, what is my crime?”


    4:9 When the governor heard this, he ordered Paul to be bound and put in prison until he had more time to hear him fully.


    4:10 But during the night, Thecla took off her earrings and gave them to the prison guard, who opened the doors for her and let her in.


    4:11 After she gave a silver mirror to the jailer, she was allowed to enter the room where Paul was. Then she sat at his feet and heard from him the great things of God.


    4:12 When she saw that Paul was not afraid to suffer but, with divine assistance, conducted himself courageously, her faith increased so greatly that she kissed his chains.'
translation:
  language: pt
  text: '4:1 Então Tamíris se apresentou diante do tribunal do governador e falou em alta voz:


    4:2 — Governador, não sei de onde vem este homem, mas ele ensina que o casamento é ilícito. Portanto, ordene-lhe que explique diante do senhor por que proclama tais ensinamentos.


    4:3 Enquanto ele dizia isso, Demas e Hermógenes (sussurraram a Tamíris e) disseram:


    — Diga que ele é cristão, e imediatamente será condenado à morte.[a]


    4:4 O governador, porém, agiu com mais cautela. Chamou Paulo e lhe perguntou:


    — Quem é você? O que ensina? Eles parecem acusá-lo de crimes graves.


    4:5 Então Paulo falou em alta voz:


    — Governador, visto que agora sou chamado a prestar contas dos meus ensinamentos, peço que me ouça.


    4:6 O Deus que é Deus de vingança e que de nada necessita, senão da salvação de suas criaturas,[b] enviou-me para afastá-las de sua maldade e corrupção, de todos os prazeres pecaminosos[c] e da morte, e para persuadi-las a não pecar mais.


    4:7 Por essa razão, Deus enviou seu Filho, Jesus Cristo, a quem proclamo e em quem ensino as pessoas a depositarem a esperança. Somente ele teve tamanha compaixão do mundo enganado, para que este não fosse condenado, governador, mas tivesse fé, temor de Deus, conhecimento da religião e amor à verdade.


    4:8 Portanto, se ensino apenas as coisas que recebi por revelação de Deus, qual é o meu crime?


    4:9 Ao ouvir isso, o governador mandou amarrar Paulo e colocá-lo na prisão, até que tivesse mais tempo para ouvi-lo plenamente.


    4:10 Durante a noite, porém, Tecla tirou seus brincos e os deu ao guarda da prisão, que abriu as portas e a deixou entrar.


    4:11 Depois de presentear o carcereiro com um espelho de prata, ela recebeu permissão para entrar no aposento onde Paulo estava. Então se sentou aos pés dele e o ouviu falar das grandezas de Deus.


    4:12 Ao perceber que Paulo não tinha medo de sofrer, mas que, com a ajuda divina, se portava com coragem, sua fé cresceu tanto que ela beijou as correntes dele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão entre parênteses — «sussurraram a Tamíris e» — foi preservada conforme o testemunho inglês fornecido; a tradição manuscrita deve ser verificada diretamente.
    reason: Sinaliza uma construção textual incomum sem apagá-la.
  - marker: b
    text: 'Também seria possível entender: «que de nada necessita, mas deseja a salvação de suas criaturas». A redação aqui mantém o paradoxo do testemunho fornecido.'
    reason: Preserva a ambiguidade teológica e sintática até a revisão do grego.
  - marker: c
    text: A palavra «pecaminosos» aparece entre parênteses no testemunho inglês e pode ser explicativa; requer confirmação no texto grego.
    reason: Distingue possível explicitação do tradutor de conteúdo seguramente atestado.
lexical_decisions:
- source_word: judgment-seat
  choice: tribunal
  rationale: Expressa de modo natural o lugar e a função judicial sem recorrer ao arcaísmo «assento de julgamento».
- source_word: matrimony is unlawful
  choice: o casamento é ilícito
  rationale: Preserva a força jurídica e moral da acusação, sem reformulá-la como simples preferência pelo celibato.
- source_word: God of vengeance
  choice: Deus de vingança
  rationale: Mantém a linguagem teologicamente tensa do testemunho fornecido, sem suavizá-la para «justiça».
- source_word: fear of God
  choice: temor de Deus
  rationale: Emprega a expressão religiosa tradicional e ainda inteligível, que pode abranger reverência e medo.
- source_word: great things of God
  choice: grandezas de Deus
  rationale: Forma portuguesa natural que conserva o sentido amplo das coisas grandiosas referentes a Deus.
- source_word: chains
  choice: correntes
  rationale: Termo concreto e corrente para os grilhões de Paulo.
theological_decisions:
- issue: A afirmação de que Deus «de nada necessita, senão da salvação de suas criaturas» pode sugerir uma necessidade divina.
  choice: Conservar a formulação paradoxal no texto.
  alternative: Traduzir como «não deseja nada além da salvação de suas criaturas».
  rationale: O testemunho apresenta uma tensão genuína; substituir «necessita» por «deseja» resolveria interpretativamente o enunciado.
- issue: A função exclusiva de Jesus na compaixão pelo mundo.
  choice: «Somente ele teve tamanha compaixão do mundo enganado».
  alternative: «Ele teve tamanha compaixão...» sem exclusividade.
  rationale: Retém o «only» do testemunho e evita diluir sua ênfase cristológica.
- issue: A lista «fé, temor de Deus, conhecimento da religião e amor à verdade».
  choice: Manter todos os elementos sem harmonização doutrinária.
  alternative: Reformular «conhecimento da religião» como «conhecimento de Deus».
  rationale: A expressão transmitida é preservada, embora seja menos habitual no vocabulário cristão moderno.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com diálogos naturais e tratamento respeitoso ao governador. Esta é uma versão provisória baseada no testemunho inglês de domínio público, pois a revisão direta da tradição grega e das versões antigas ainda está pendente. Evitaram-se arcaísmos como «falou da seguinte maneira» e explicações confessionais não presentes no testemunho.
