    issue: A expressão parentética de 4:3 permanece sintaticamente incomum.
    rationale: Ela reproduz conscientemente uma particularidade do testemunho inglês, e a nota a identifica como ponto a confirmar na tradição manuscrita. Não deve ser normalizada antes da consulta direta do grego.
  - severity: low
    issue: A construção «de nada necessita, senão da salvação de suas criaturas» em 4:6 é teologicamente e sintaticamente tensa.
    rationale: A redação conserva a tensão do testemunho em vez de introduzir uma interpretação que substitua «necessita» por «deseja»; a nota é apropriada.
