  text: '11:1 The devil then put evil counsel into their minds. One day, when they had gathered to consult together, they reasoned among themselves: “The virgin is a priestess of the great goddess Diana, and whatever she asks of her is granted, because she is a virgin and is therefore loved by all the gods.


    11:2 Now, then, let us hire some immoral young men. After we have made them sufficiently drunk and given them a large sum of money, let us order them to go and violate this virgin, promising them an even greater reward if they do it.”


    11:3 (For they had concluded among themselves that if they could violate her, the gods would no longer regard her, nor would Diana heal the sick for her.)


    11:4 They carried out this plan. The young men went to the mountain and came to the cave as fierce as lions, knocking at the door.


    11:5 The holy martyr Thecla, trusting in the God in whom she believed, opened the door, although she had already been warned of their plan. She said to them, “Young men, what is your business?”


    11:6 They replied, “Is anyone here whose name is Thecla?” She answered, “What do you want with her?” They said, “We intend to lie with her.”


    11:7 The blessed Thecla answered, “Although I am a lowly old woman, I am the servant of my Lord Jesus Christ. And although you have a vile design against me, you will not be able to accomplish it.” They replied, “It is impossible that we should not be able to do with you whatever we want.”


    11:8 While they were saying this, they seized her by force and intended to rape her. Then she said to them with the (greatest) gentleness, “Young men, be patient and see the glory of the Lord.”


    11:9 While they held her, she looked up to heaven and said, “O most reverend God, to whom no one can be compared, who glorifies yourself over your enemies; who delivered me from the fire and did not give me up to Thamyris or to Alexander; who delivered me from the wild beasts; who preserved me in the deep waters; who have everywhere been my helper and have glorified your name in me:


    11:10 Now also deliver me from the hands of these wicked and unreasonable men. Do not allow them to violate the chastity that I have preserved until now for your honor. For I love you, long for you, and worship you, O Father, Son, and Holy Spirit, forever. Amen.”


    11:11 Then a voice came from heaven, saying, “Do not be afraid, Thecla, my faithful servant, for I am with you. Look and see the place that has been opened for you. There your eternal dwelling shall be; there you shall receive the beatific vision.”


    11:12 The blessed Thecla looked and saw that the rock had opened wide enough for a person to enter. She did as she had been commanded, bravely escaped from the vile group, and entered the rock. It immediately closed so completely that no crack was visible where it had opened.


    11:13 The men stood utterly astonished at such a remarkable miracle and had no power to detain the servant of God. But as they caught hold of her veil, or hood, they tore off a piece of it.


    11:14 Even this happened by God’s permission, to confirm the faith of those who would come to see this venerable place and to convey blessings to people in succeeding ages who would believe in our Lord Jesus Christ with a pure heart.


    11:15 Thus suffered Thecla, that first martyr and apostle of God, and virgin. She came from Iconium at eighteen years of age. Afterward, partly through journeys and travels and partly through a monastic life in the cave, she lived for seventy-two years, so that she was ninety years old when the Lord translated her.


    11:16 Thus ends her life.


    11:17 The day kept sacred to her memory is the twenty-fourth of September, to the glory of the Father, the Son, and the Holy Spirit, now and forever. Amen.'
translation:
  language: pt
  text: 'ATOS DE PAULO E TECLA — CAPÍTULO 11


    11:1 Então o diabo pôs maus conselhos na mente deles. Certo dia, reuniram-se para deliberar e disseram entre si: “A virgem é sacerdotisa da grande deusa Diana, e tudo o que lhe pede é concedido, porque é virgem e, por isso, amada por todos os deuses.


    11:2 Portanto, arranjemos alguns jovens dissolutos. Depois de embriagá-los bastante e lhes dar uma boa soma de dinheiro, mandemos que violem esta virgem, prometendo-lhes recompensa ainda maior se o fizerem.”


    11:3 Pois haviam concluído entre si que, se conseguissem violá-la, os deuses deixariam de favorecê-la, e Diana já não curaria os enfermos por meio dela.


    11:4 Eles executaram esse plano. Os jovens foram ao monte e chegaram à caverna ferozes como leões, batendo à porta.


    11:5 A santa mártir Tecla, confiando no Deus em quem cria, abriu a porta, embora já tivesse sido avisada do plano deles, e perguntou: “Jovens, o que vocês querem?”


    11:6 Eles responderam: “Há aqui alguém chamada Tecla?” Ela perguntou: “O que vocês querem com ela?” Disseram: “Queremos deitar-nos com ela.”


    11:7 A bem-aventurada Tecla respondeu: “Embora eu seja uma velha humilde, sou serva do meu Senhor Jesus Cristo. Ainda que tenham contra mim um propósito perverso, vocês não conseguirão realizá-lo.” Eles replicaram: “É impossível que não consigamos fazer com você tudo o que queremos.”


    11:8 Enquanto diziam isso, agarraram-na à força e pretendiam violentá-la. Então ela lhes disse com a maior mansidão: “Jovens, esperem e vejam a glória do Senhor.”


    11:9 Enquanto a seguravam, ela ergueu os olhos ao céu e disse: “Ó Deus digno de toda reverência, a quem ninguém se pode comparar, que manifestas tua glória sobre os teus inimigos; tu me livraste do fogo e não me entregaste a Tamíris nem a Alexandre; livraste-me das feras; preservaste-me nas águas profundas; em toda parte tens sido meu auxílio e tens glorificado o teu nome em mim.


    11:10 Livra-me também agora das mãos destes homens perversos e insensatos. Não permitas que violem a castidade que até hoje preservei para tua honra, pois eu te amo, anseio por ti e te adoro, ó Pai, Filho e Espírito Santo, para sempre. Amém.”


    11:11 Então veio do céu uma voz que dizia: “Não tenha medo, Tecla, minha serva fiel, pois estou com você. Olhe e veja o lugar que se abriu para você. Ali será sua morada eterna; ali você receberá a visão bem-aventurada.”[a]


    11:12 A bem-aventurada Tecla olhou e viu que a rocha se abrira o bastante para uma pessoa entrar. Ela fez conforme lhe fora ordenado, escapou corajosamente daquele grupo perverso e entrou na rocha. Esta se fechou de imediato e de modo tão completo que não se via fissura alguma no lugar onde se abrira.


    11:13 Os homens ficaram completamente atônitos diante de tão extraordinário milagre e não puderam deter a serva de Deus. Conseguiram apenas agarrar seu véu, ou capuz, e arrancar-lhe um pedaço.[b]


    11:14 Até isso aconteceu com a permissão de Deus, para confirmar a fé dos que viriam ver esse lugar venerável e levar bênçãos às pessoas das gerações futuras que cressem em nosso Senhor Jesus Cristo com o coração puro.


    11:15 Assim padeceu Tecla, aquela primeira mártir, apóstola de Deus e virgem.[c] Ela viera de Icônio aos dezoito anos. Depois, vivendo parte do tempo em jornadas e viagens e parte em vida monástica na caverna, completou setenta e dois anos, de modo que tinha noventa anos quando o Senhor a trasladou.[d]


    11:16 Assim termina sua vida.


    11:17 O dia consagrado à sua memória é vinte e quatro de setembro, para a glória do Pai, do Filho e do Espírito Santo, agora e para sempre. Amém.


    [a] “Visão bem-aventurada” traduz a expressão do testemunho inglês “beatific vision”; a formulação grega e sua possível história textual ainda precisam de verificação direta.


    [b] O testemunho inglês apresenta “véu, ou capuz”, refletindo incerteza quanto à peça de vestuário.


    [c] “Apóstola” conserva o título atribuído a Tecla no testemunho, sem determinar aqui seu sentido técnico ou não técnico.


    [d] “Trasladou” preserva a maneira indireta pela qual o texto descreve o fim de Tecla, sem explicitar se se trata de morte, assunção ou outra forma de partida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Visão bem-aventurada” traduz a expressão do testemunho inglês “beatific vision”; a formulação grega e sua possível história textual ainda precisam de verificação direta.
    reason: Sinaliza que uma expressão teologicamente carregada depende, por ora, do testemunho inglês.
  - marker: b
    text: O testemunho inglês apresenta “véu, ou capuz”, refletindo incerteza quanto à peça de vestuário.
    reason: Preserva uma alternativa lexical explícita no testemunho.
  - marker: c
    text: “Apóstola” conserva o título atribuído a Tecla no testemunho, sem determinar aqui seu sentido técnico ou não técnico.
    reason: Evita resolver uma questão histórica e eclesiológica que o texto deixa aberta.
  - marker: d
    text: “Trasladou” preserva a maneira indireta pela qual o texto descreve o fim de Tecla, sem explicitar se se trata de morte, assunção ou outra forma de partida.
    reason: Mantém a ambiguidade teológica e narrativa.
lexical_decisions:
- source_word: Diana
  choice: Diana
  rationale: Mantém o nome romano presente no testemunho inglês fornecido; uma revisão direta do grego poderá indicar se convém usar Ártemis.
- source_word: debauch / violate
  choice: violar
  rationale: Expressa claramente a violência sexual pretendida sem recorrer a eufemismo arcaico; em 11:6, “deitar-nos com ela” preserva a fala direta do testemunho.
- source_word: unreasonable
  choice: insensatos
  rationale: Reproduz o juízo moral e racional do termo do testemunho em português natural, sem exagerá-lo como “irracionais”.
- source_word: beatific vision
  choice: visão bem-aventurada
  rationale: Mantém a linguagem teológica do testemunho, com nota que assinala a necessidade de revisão da fonte grega.
- source_word: veil, or hood
  choice: véu, ou capuz
  rationale: Preserva explicitamente a alternativa lexical e a incerteza do testemunho.
- source_word: apostle
  choice: apóstola
  rationale: Conserva o título feminino atribuído a Tecla, sem substituir por uma interpretação restritiva.
- source_word: translated her
  choice: a trasladou
  rationale: Mantém a ambiguidade solene da descrição da partida de Tecla, em vez de decidir silenciosamente por “morreu” ou “foi elevada”.
theological_decisions:
- issue: Invocação trinitária em 11:10 e doxologia em 11:17
  choice: Preservar “Pai, Filho e Espírito Santo” conforme o testemunho
  alternative: Regularizar a sintaxe ou tratar a fórmula como acréscimo litúrgico
  rationale: A tradução deve representar o testemunho recebido sem emitir juízo sobre sua camada redacional; a revisão manuscrita continua pendente.
- issue: Título de Tecla como “primeira mártir e apóstola de Deus”
  choice: Manter os títulos no corpo e explicar apenas a abertura semântica de “apóstola” em nota
  alternative: Traduzir “mensageira” ou omitir o título
  rationale: Evita importar uma definição denominacional posterior e preserva a afirmação teologicamente tensa do texto.
- issue: Destino final de Tecla
  choice: Usar “trasladou”
  alternative: “fez morrer”, “levou para si” ou “elevou”
  rationale: O testemunho é indireto e potencialmente ambíguo; a tradução não deve decidir entre morte e assunção.
- issue: Bênçãos associadas ao lugar e ao fragmento do véu
  choice: Traduzir a alegação narrativa sem endossá-la nem reinterpretá-la
  alternative: Atenuar como mera lembrança simbólica
  rationale: Preserva a teologia devocional própria do texto sem acrescentar defesa ou crítica confessional.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com legibilidade brasileira. O tratamento alterna formas naturais de segunda pessoa: “vocês” no diálogo humano e “tu” na oração solene, mantendo fluidez contemporânea. Como a revisão direta do grego e das versões ainda está pendente, esta é uma minuta provisória fundamentada no testemunho inglês de domínio público e auditada pela camada POB inglesa. Elementos editoriais e declarações modernas de direitos autorais do material fornecido não integram o texto antigo e foram excluídos.'
