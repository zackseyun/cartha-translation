review_pass:
  verdict: revise
  source_fidelity: A minuta acompanha de perto o testemunho inglês e a ponte POB. Mantém adequadamente os títulos, a invocação trinitária, a alternativa “véu, ou capuz” e a formulação indireta para o fim de Tecla. São necessárias pequenas correções para tornar explícita a relação entre Tecla e Diana em 11:1, conservar os parênteses de 11:3 e traduzir com maior precisão o apelo de 11:8.
  naturalness: O português é moderno, claro e de registro apropriado. As revisões tornam 11:1 menos ambíguo e 11:8 mais idiomático (“tenham paciência”, não “esperem”).
  terminology: “Diana”, “Tecla”, “Tamíris”, “Icônio”, “apóstola”, “visão bem-aventurada” e “trasladou” foram mantidos de modo consistente com o testemunho disponível e com as notas de cautela textual.
  issues:
  - severity: medium
    issue: '11:1: “tudo o que lhe pede” permite leitura gramatical ambígua.'
    rationale: O referente é que Tecla pede algo a Diana e isso lhe é concedido. “Tudo o que ela pede à deusa lhe é concedido” torna a relação explícita sem alterar o sentido.
  - severity: low
    issue: 11:3 não preserva os parênteses do testemunho.
    rationale: A observação é parentética no testemunho e deve permanecer assim para refletir sua apresentação discursiva.
  - severity: medium
    issue: '11:8: “esperem” não traduz precisamente “have patience”.'
    rationale: O original da ponte inglesa é uma exortação a ter paciência; “tenham paciência” preserva o sentido, enquanto “esperem” pode significar apenas aguardar.
  - severity: low
    issue: '11:14: “levar bênçãos” é menos exato para “to convey blessings”.'
    rationale: “Transmitir bênçãos” comunica melhor a ideia de mediação ou concessão de bênçãos atribuída narrativamente ao lugar.
  revised_text: 'ATOS DE PAULO E TECLA — CAPÍTULO 11


    11:1 Então o diabo pôs maus conselhos na mente deles. Certo dia, reuniram-se para deliberar e disseram entre si: “A virgem é sacerdotisa da grande deusa Diana, e tudo o que ela pede à deusa lhe é concedido, porque é virgem e, por isso, amada por todos os deuses.


    11:2 Portanto, arranjemos alguns jovens dissolutos. Depois de embriagá-los bastante e lhes dar uma boa soma de dinheiro, mandemos que violem esta virgem, prometendo-lhes recompensa ainda maior se o fizerem.”


    11:3 (Pois haviam concluído entre si que, se conseguissem violá-la, os deuses deixariam de favorecê-la, e Diana já não curaria os enfermos por meio dela.)


    11:4 Eles executaram esse plano. Os jovens foram ao monte e chegaram à caverna ferozes como leões, batendo à porta.


    11:5 A santa mártir Tecla, confiando no Deus em quem cria, abriu a porta, embora já tivesse sido avisada do plano deles, e perguntou: “Jovens, o que vocês querem?”


    11:6 Eles responderam: “Há aqui alguém chamada Tecla?” Ela perguntou: “O que vocês querem com ela?” Disseram: “Queremos deitar-nos com ela.”


    11:7 A bem-aventurada Tecla respondeu: “Embora eu seja uma velha humilde, sou serva do meu Senhor Jesus Cristo. Ainda que tenham contra mim um propósito perverso, vocês não conseguirão realizá-lo.” Eles replicaram: “É impossível que não consigamos fazer com você tudo o que queremos.”


    11:8 Enquanto diziam isso, agarraram-na à força e pretendiam violentá-la. Então ela lhes disse com a maior mansidão: “Jovens, tenham paciência e vejam a glória do Senhor.”


    11:9 Enquanto a seguravam, ela ergueu os olhos ao céu e disse: “Ó Deus digno de toda reverência, a quem ninguém se pode comparar, que manifestas tua glória sobre os teus inimigos; tu me livraste do fogo e não me entregaste a Tamíris nem a Alexandre; livraste-me das feras; preservaste-me nas águas profundas; em toda parte tens sido meu auxílio e tens glorificado o teu nome em mim.


    11:10 Livra-me também agora das mãos destes homens perversos e insensatos. Não permitas que violem a castidade que até hoje preservei para tua honra, pois eu te amo, anseio por ti e te adoro, ó Pai, Filho e Espírito Santo, para sempre. Amém.”


    11:11 Então veio do céu uma voz que dizia: “Não tenha medo, Tecla, minha serva fiel, pois estou com você. Olhe e veja o lugar que se abriu para você. Ali será sua morada eterna; ali você receberá a visão bem-aventurada.”[a]


    11:12 A bem-aventurada Tecla olhou e viu que a rocha se abrira o bastante para uma pessoa entrar. Ela fez conforme lhe fora ordenado, escapou corajosamente daquele grupo perverso e entrou na rocha. Esta se fechou de imediato e de modo tão completo que não se via fissura alguma no lugar onde se abrira.


    11:13 Os homens ficaram completamente atônitos diante de tão extraordinário milagre e não puderam deter a serva de Deus. Conseguiram apenas agarrar seu véu, ou capuz, e arrancar-lhe um pedaço.[b]


    11:14 Até isso aconteceu com a permissão de Deus, para confirmar a fé dos que viriam ver esse lugar venerável e transmitir bênçãos às pessoas das gerações futuras que cressem em nosso Senhor Jesus Cristo com o coração puro.


    11:15 Assim padeceu Tecla, aquela primeira mártir, apóstola de Deus e virgem.[c] Ela viera de Icônio aos dezoito anos. Depois, vivendo parte do tempo em jornadas e viagens e parte em vida monástica na caverna, viveu setenta e dois anos, de modo que tinha noventa anos quando o Senhor a trasladou.[d]


    11:16 Assim termina sua vida.


    11:17 O dia consagrado à sua memória é vinte e quatro de setembro, para a glória do Pai, do Filho e do Espírito Santo, agora e para sempre. Amém.


