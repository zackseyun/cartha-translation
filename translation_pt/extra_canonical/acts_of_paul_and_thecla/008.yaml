  footnotes:
  - marker: a
    text: A expressão “estado de felicidade” traduz provisoriamente a formulação do testemunho inglês. A confirmação do termo exato depende de revisão direta da tradição grega e das versões antigas.
    reason: Sinalizar incerteza lexical relevante na descrição do destino pós-morte.
  - marker: b
    text: O relato apresenta o pedido de oração por uma pessoa falecida sem explicar seu fundamento ou formular uma doutrina a respeito.
    reason: Preservar a tensão teológica do texto sem importar interpretação confessional.
  - marker: c
    text: “Novamente” segue o testemunho inglês fornecido; sua presença e seu sentido devem ser conferidos nos manuscritos gregos e nas versões antigas.
    reason: Registrar uma palavra textualmente incerta já assinalada como parentética no testemunho de consulta.
lexical_decisions:
- source_word: chastity
  choice: castidade
  rationale: Preserva o conceito central do testemunho, que envolve integridade sexual e proteção contra violação, sem reduzi-lo apenas a virgindade.
- source_word: entertain / take her in
  choice: acolheria
  rationale: Expressa naturalmente a ideia de receber Tecla em casa e assumir sua custódia.
- source_word: den
  choice: jaula
  rationale: No contexto do anfiteatro, designa com clareza o recinto onde a leoa era mantida, evitando a imagem inadequada de uma toca natural.
- source_word: title / written notice
  choice: inscrição
  rationale: Refere-se de modo conciso ao letreiro público que declarava a acusação contra Tecla.
- source_word: Sacrilege
  choice: Sacrilégio
  rationale: Equivalente direto e historicamente apropriado da acusação religiosa.
- source_word: criminal
  choice: condenada
  rationale: Evita afirmar como fato moral que Tecla fosse criminosa e comunica sua condição jurídica aos olhos das autoridades.
- source_word: royal family
  choice: família real
  rationale: Mantém a afirmação social e política do testemunho sem especificar uma relação dinástica não explicitada.
- source_word: creature / person
  choice: uma pessoa como esta
  rationale: Produz português digno e natural sem o tom potencialmente desumanizador de “criatura” no uso moderno.
theological_decisions:
- issue: Oração em favor da falecida Falconila
  choice: Traduzir diretamente o pedido e a oração, preservando a linguagem narrativa
  alternative: Reformular, omitir ou explicar a passagem segundo uma doutrina posterior sobre os mortos
  rationale: O texto apresenta a crença e a ação das personagens; a tradução não deve harmonizá-las com posições confessionais posteriores.
- issue: Destino desejado para Falconila
  choice: “conduzida a um estado de felicidade” e “à vida eterna”
  alternative: Empregar “salva”, “levada ao céu” ou uma formulação doutrinariamente mais definida
  rationale: Mantém a relativa indefinição do testemunho inglês disponível e evita determinar o mecanismo ou estado escatológico além do que ele expressa.
- issue: Invocação cristológica em 8:7
  choice: “Ó Senhor Deus do céu e da terra, Jesus Cristo, Filho do Altíssimo”
  alternative: Pontuar ou reformular de modo a separar necessariamente Deus de Jesus Cristo
  rationale: Preserva a tensão sintática e teológica da invocação, sem resolver de forma artificial a relação entre os títulos.
- issue: Castidade de Tecla
  choice: Manter “castidade” como bem preservado por Trifena
  alternative: Substituir por “virgindade” ou apenas “segurança”
  rationale: “Castidade” reproduz melhor a amplitude do testemunho e não impõe uma definição física ou eclesial mais estreita.
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. Mantiveram-se fórmulas solenes nas orações e exclamações, mas evitou-se linguagem arcaica. Esta é uma tradução provisória baseada no testemunho inglês público fornecido; a revisão direta do grego e da tradição versional continua necessária.
