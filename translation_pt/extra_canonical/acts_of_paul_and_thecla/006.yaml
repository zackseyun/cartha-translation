lexical_decisions:
- source_word: coat
  choice: manto
  rationale: No testemunho inglês, a peça de roupa é entregue para custear o pão; “manto” é natural e historicamente mais plausível que o moderno “casaco”, embora a identificação exata dependa da revisão do grego.
- source_word: fornication
  choice: imoralidade sexual
  rationale: Expressa de modo atual e abrangente a conduta sexual censurada pelo texto, sem restringi-la indevidamente a um único ato.
- source_word: seal of Christ
  choice: selo de Cristo
  rationale: Mantém a expressão simbólica sem identificá-la explicitamente com batismo, unção ou outro rito.
- source_word: gift of Christ
  choice: dom de Cristo
  rationale: Preserva a amplitude semântica e a possível tensão entre dom espiritual e rito de iniciação.
- source_word: solaced each other
  choice: encorajavam uns aos outros
  rationale: Comunica em português corrente a ideia de consolo e fortalecimento mútuos.
theological_decisions:
- issue: A expressão “selo de Cristo”
  choice: Retida literalmente
  alternative: Interpretar como “batismo”
  rationale: O testemunho fornecido não explicita o referente; a tradução preserva a ambiguidade teológica e ritual.
- issue: O “dom de Cristo” prometido a Tecla
  choice: Traduzido de forma não especificada
  alternative: Identificá-lo com o selo, o batismo ou o Espírito
  rationale: A relação exata entre o selo pedido e o dom prometido não deve ser resolvida sem apoio textual direto.
- issue: Forma de tratamento dirigida a Paulo em 6:2
  choice: “Pai”
  alternative: “Mestre” ou omissão
  rationale: Preserva a linguagem relacional do testemunho sem acrescentar um sentido eclesiástico técnico.
- issue: Destinatário da oração em 6:7
  choice: Mantida a sequência “santo Pai” e “Senhor Jesus Cristo”
  alternative: Reformular para eliminar a possível alternância de invocação
  rationale: A construção apresenta tensão referencial e cristológica que deve permanecer visível até a revisão do texto grego.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. As falas usam “você” por naturalidade contemporânea, enquanto as orações mantêm “tu” para distinguir o registro solene e conservar as formas verbais do louvor. O texto é necessariamente provisório, pois foi elaborado a partir do testemunho inglês de domínio público fornecido; a revisão direta da tradição grega e das versões antigas ainda está pendente.
