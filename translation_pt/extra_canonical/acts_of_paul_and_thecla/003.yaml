  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/003.yaml
  text: '3:1 Then Thamyris said, “Come with me to my house and refresh yourselves.” So they went to a very splendid banquet, where there was abundant wine and very rich food.


    3:2 They were brought to a richly spread table, and Thamyris gave them plenty to drink because of his love for Thecla and his desire to marry her.


    3:3 Then Thamyris said, “I want you to tell me what this Paul’s teachings are so that I may understand them. I am deeply concerned about Thecla, since she takes such delight in that stranger’s words that I am in danger of losing the woman I intend to marry.”


    3:4 Then Demas and Hermogenes answered together, “Have him brought before the governor Castillius as someone who is trying to persuade the people to adopt the new religion of the Christians. Then the governor, in accordance with Caesar’s decree, will put him to death, and in this way you will obtain your wife.


    3:5 “At the same time, we will teach her that the resurrection he speaks about has already come and consists in our having children, and that we rose again when we came to the knowledge of God.”


    3:6 When Thamyris heard this account from them, he was filled with burning resentment.


    3:7 Early the next morning, he got up and went to the house of Onesiphorus, accompanied by the magistrates, the jailer, and a great crowd of people carrying clubs. He said to Paul,


    3:8 “You have led the city of Iconium astray, including Thecla, who is betrothed to me, so that now she will not marry me. Therefore, you must come with us to the governor Castillius.”


    3:9 Then the whole crowd cried out, “Away with this impostor (magician)! He has led the minds of our wives astray, and all the people listen to him.”'
translation:
  language: pt
  text: 'ATOS DE PAULO E TECLA — CAPÍTULO 3


    3:1 Então Tamíris disse: “Venham comigo à minha casa e recuperem as forças.” Eles foram, pois, a um banquete muito luxuoso, onde havia vinho em abundância e alimentos finos.


    3:2 Foram conduzidos a uma mesa ricamente servida, e Tamíris lhes deu muito de beber por causa de seu amor por Tecla e de seu desejo de se casar com ela.


    3:3 Então Tamíris disse: “Quero que me expliquem quais são os ensinamentos desse Paulo, para que eu os compreenda. Estou muito preocupado com Tecla, pois ela se agrada tanto das palavras daquele estrangeiro que corro o risco de perder aquela com quem pretendo me casar.”


    3:4 Demas e Hermógenes responderam juntos: “Faça com que ele seja levado perante o governador Castílio, sob a acusação de tentar persuadir o povo a adotar a nova religião dos cristãos. Então o governador, de acordo com o decreto de César, o condenará à morte, e assim você ficará com sua esposa.


    3:5 “Ao mesmo tempo, nós ensinaremos a ela que a ressurreição da qual ele fala já aconteceu e consiste em termos filhos, e que ressuscitamos quando chegamos ao conhecimento de Deus.”


    3:6 Ao ouvir deles essa explicação, Tamíris ficou tomado de ardente indignação.


    3:7 De manhã bem cedo, ele se levantou e foi à casa de Onesíforo, acompanhado pelos magistrados, pelo carcereiro e por uma grande multidão armada de porretes. Ele disse a Paulo:


    3:8 “Você desviou a cidade de Icônio e, entre seus habitantes, Tecla, que está prometida em casamento a mim, de modo que agora ela não quer se casar comigo. Portanto, você virá conosco até o governador Castílio.”


    3:9 Toda a multidão gritou: “Fora com este impostor — este feiticeiro![a] Ele desviou a mente de nossas mulheres, e todo o povo lhe dá ouvidos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A testemunha inglesa apresenta “impostor” e, entre parênteses, “mágico”. A tradução conserva ambas as possibilidades, vertendo a segunda como “feiticeiro”. A redação deverá ser confirmada mediante revisão direta da tradição manuscrita grega e das versões antigas.
    reason: Registrar a alternativa preservada na testemunha e a condição provisória da base textual.
lexical_decisions:
- source_word: refresh yourselves
  choice: recuperem as forças
  rationale: Expressa em português natural a ideia de receber alimento e descanso, sem restringi-la apenas a comer ou beber.
- source_word: very rich provision
  choice: alimentos finos
  rationale: Preserva a ideia de provisões abundantes e requintadas sem reproduzir literalmente uma construção inglesa arcaica.
- source_word: doctrines
  choice: ensinamentos
  rationale: Termo corrente e acessível que não impõe uma conotação sistemático-dogmática ausente do contexto.
- source_word: perverted / led astray
  choice: desviou
  rationale: Mantém a acusação de induzir ao erro e funciona naturalmente tanto para a cidade quanto para Tecla e para a mente das mulheres.
- source_word: staves
  choice: porretes
  rationale: Indica bastões usados como armas pela multidão, em linguagem moderna e clara.
- source_word: imposter (magician)
  choice: impostor — este feiticeiro
  rationale: Conserva as duas caracterizações transmitidas pela testemunha inglesa, evitando ocultar a alternativa textual ou interpretativa.
theological_decisions:
- issue: Natureza da ressurreição alegada por Demas e Hermógenes
  choice: “já aconteceu e consiste em termos filhos”
  alternative: Explicitar que se trata de uma refutação ou de uma doutrina falsa
  rationale: A tradução preserva a afirmação das personagens sem acrescentar julgamento teológico editorial.
- issue: Relação entre ressurreição e conhecimento de Deus
  choice: “ressuscitamos quando chegamos ao conhecimento de Deus”
  alternative: Interpretar como renascimento espiritual
  rationale: Mantém a tensão e a formulação da testemunha sem resolver se a linguagem é metafórica, sacramental ou polêmica.
- issue: “Nova religião dos cristãos”
  choice: Preservar a formulação acusatória
  alternative: Substituir por “o Caminho” ou outra designação cristã
  rationale: A expressão pertence à acusação apresentada no relato e não deve ser harmonizada com terminologia canônica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregam-se nomes tradicionais em português: Tamíris, Tecla, Hermógenes, Castílio, Onesíforo e Icônio. O texto é necessariamente provisório porque o material fornecido declara pendente a revisão direta do grego e se baseia numa testemunha inglesa de domínio público.'
