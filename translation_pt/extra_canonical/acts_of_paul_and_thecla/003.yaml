review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha bem a testemunha inglesa fornecida e preserva adequadamente, sem juízo editorial, as afirmações atribuídas a Demas e Hermógenes sobre a ressurreição. Contudo, em 3:4, «o condenará à morte» atenua/transforma «will put him to death»; a formulação deve dizer explicitamente que o governador o matará. «Decreto» também é menos próximo de «order». Em 3:8, «entre seus habitantes, Tecla» não reproduz com precisão «and among the rest, Thecla», que enumera Tecla entre os demais que teriam sido desviados.
  naturalness: 'O português é claro, moderno e adequado ao registro narrativo. Pequenos ajustes tornam a redação mais idiomática e precisa: «bastões» é mais neutro que «porretes» para «staves», e «as mentes de nossas mulheres» preserva o plural expresso pela testemunha.'
  terminology: 'Os nomes portugueses tradicionais estão consistentes: Tamíris, Tecla, Demas, Hermógenes, Castílio, Onesíforo e Icônio. «Ensinamentos», «ressurreição» e «conhecimento de Deus» são escolhas apropriadas. A alternativa parentética para «magician» deve continuar assinalada por nota, pois a revisão direta do grego e das versões antigas permanece pendente.'
  issues:
  - severity: medium
    issue: 3:4 — «o condenará à morte»
    rationale: A testemunha diz que o governador «will put him to death». «Condenará» descreve a sentença, não necessariamente a execução; «o matará» preserva a ação afirmada.
  - severity: low
    issue: 3:4 — «decreto de César»
    rationale: A testemunha traz «order of Caesar»; «ordem de César» é a correspondência mais direta e não especifica indevidamente a forma jurídica.
  - severity: medium
    issue: 3:8 — «e, entre seus habitantes, Tecla»
    rationale: A expressão pode sugerir apenas a localização de Tecla entre os habitantes da cidade. «E, entre outros, Tecla» mantém a acusação de que ela é uma das pessoas desencaminhadas.
  - severity: low
    issue: 3:7 e 3:9 — «porretes» e «a mente de nossas mulheres»
    rationale: «Bastões» é um equivalente mais amplo para «staves», e o plural «mentes» reproduz o plural da testemunha.
  revised_text: 'ATOS DE PAULO E TECLA — CAPÍTULO 3


    3:1 Então Tamíris disse: “Venham comigo à minha casa e recuperem as forças.” Eles foram, pois, a um banquete muito luxuoso, onde havia vinho em abundância e alimentos finos.


    3:2 Foram conduzidos a uma mesa ricamente servida, e Tamíris lhes deu muito de beber por causa de seu amor por Tecla e de seu desejo de se casar com ela.


    3:3 Então Tamíris disse: “Quero que me expliquem quais são os ensinamentos desse Paulo, para que eu os compreenda. Estou muito preocupado com Tecla, pois ela se agrada tanto das palavras daquele estrangeiro que corro o risco de perder aquela com quem pretendo me casar.”


    3:4 Demas e Hermógenes responderam juntos: “Que ele seja levado perante o governador Castílio, como alguém que procura persuadir o povo a adotar a nova religião dos cristãos. Então o governador, de acordo com a ordem de César, o matará, e assim você conseguirá Tecla como esposa.


    3:5 “Ao mesmo tempo, nós ensinaremos a ela que a ressurreição da qual ele fala já aconteceu e consiste em termos filhos, e que ressuscitamos quando chegamos ao conhecimento de Deus.”


    3:6 Ao ouvir deles essa explicação, Tamíris ficou tomado de ardente indignação.


    3:7 De manhã bem cedo, ele se levantou e foi à casa de Onesíforo, acompanhado pelos magistrados, pelo carcereiro e por uma grande multidão de pessoas com bastões. Ele disse a Paulo:


    3:8 “Você desviou a cidade de Icônio e, entre outros, Tecla, que está prometida em casamento a mim, de modo que agora ela não quer se casar comigo. Portanto, você virá conosco até o governador Castílio.”


    3:9 Toda a multidão gritou: “Fora com este impostor (feiticeiro)![a] Ele desviou as mentes de nossas mulheres, e todo o povo lhe dá ouvidos.”'
  revised_footnotes:
  - marker: a
    text: A testemunha inglesa traz “impostor” e, entre parênteses, “magician”. A tradução conserva ambas as designações; a alternativa “feiticeiro” deverá ser confirmada mediante revisão direta da tradição manuscrita grega e das versões antigas.
    reason: Preserva a alternativa textual/interpretativa registrada na testemunha inglesa, sem decidir prematuramente a redação subjacente.
  revision_rationale: A revisão corrige diferenças pontuais de sentido em relação à testemunha inglesa, sobretudo a afirmação explícita de que Paulo seria morto em 3:4 e a inclusão de Tecla entre os que teriam sido desencaminhados em 3:8. Também adota equivalentes mais neutros e precisos para «order», «staves» e o plural «minds», mantendo o registro moderno e a ambiguidade da designação parentética em 3:9.
