base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/001.yaml
  text: '1:1 When Paul went up to Iconium after fleeing from Antioch, Demas and Hermogenes became his companions, though at that time they were full of hypocrisy.


    1:2 But Paul, looking only to the goodness of God, did them no harm and loved them greatly.


    1:3 So he tried to make all the oracles and teachings of Christ, and the purpose of the gospel of God’s dearly loved Son, pleasing to them, instructing them in the knowledge of Christ as it had been revealed to him.


    1:4 A certain man named Onesiphorus heard that Paul had come to Iconium and quickly went out to meet him, together with his wife Lectra and his sons Simmia and Xeno, to invite him into their house.


    1:5 For Titus had given them a description of Paul’s appearance. They did not yet know him in person, but knew only his character.


    1:6 They went along the king’s highway toward Lystra and stood there waiting for him, comparing everyone who passed by with the description Titus had given them.


    1:7 At last they saw a man coming—namely, Paul—who was short, bald (or shaved) on the head, with crooked thighs, handsome legs, hollow eyes, and a crooked nose. He was full of grace, for sometimes he appeared as a man, and sometimes he had the face of an angel. Paul saw Onesiphorus and was glad.


    1:8 Onesiphorus said, “Greetings, servant of the blessed God.” Paul replied, “May the grace of God be with you and your family.”


    1:9 But Demas and Hermogenes were moved with envy, and, making a show of great religion, Demas said, “Are we not also servants of the blessed God? Why did you not greet us?”


    1:10 Onesiphorus replied, “Because I have not seen the fruits of righteousness in you. Nevertheless, if you are of that kind, you will also be welcome in my house.”


    1:11 Then Paul entered the house of Onesiphorus, and there was great joy among the family because of this. They devoted themselves to prayer, the breaking of bread, and listening to Paul preach the word of God concerning self-control and the resurrection, as follows:


    1:12 “Blessed are the pure in heart, for they shall see God.


    1:13 “Blessed are those who keep their flesh undefiled (or pure), for they shall be the temple of God.


    1:14 “Blessed are the self-controlled (or chaste), for God will reveal himself to them.


    1:15 “Blessed are those who abandon their worldly pleasures, for they shall be accepted by God.


    1:16 “Blessed are those who have wives as though they did not have them, for they shall be made angels of God.


    1:17 “Blessed are those who tremble at the word of God, for they shall be comforted.


    1:18 “Blessed are those who keep their baptism pure, for they shall find peace with the Father, Son, and Holy Spirit.


    1:19 “Blessed are those who pursue the wisdom (or teaching) of Jesus Christ, for they shall be called sons of the Most High.


    1:20 “Blessed are those who observe the instructions of Jesus Christ, for they shall dwell in eternal light.


    1:21 “Blessed are those who, for the love of Christ, abandon the glories of the world, for they shall judge angels, be placed at the right hand of Christ, and not suffer the bitterness of the last judgment.


    1:22 “Blessed are the bodies and souls of virgins, for they are acceptable to God and shall not lose the reward of their virginity. For the word of their (heavenly) Father shall prove effective for their salvation on the day of his Son, and they shall enjoy rest forevermore.”'
translation:
  language: pt
  text: 'ATOS DE PAULO E TECLA — CAPÍTULO I


    1:1 Quando Paulo subiu a Icônio, depois de fugir de Antioquia, Demas e Hermógenes tornaram-se seus companheiros, embora naquele tempo estivessem cheios de hipocrisia.


    1:2 Paulo, porém, tendo os olhos postos somente na bondade de Deus, não lhes fez mal algum, mas os amou muito.


    1:3 Assim, procurava tornar agradáveis a eles todos os oráculos e ensinamentos de Cristo, bem como o propósito do evangelho do Filho amado de Deus, instruindo-os no conhecimento de Cristo conforme lhe havia sido revelado.


    1:4 Certo homem chamado Onesíforo, ao ouvir que Paulo havia chegado a Icônio, saiu depressa ao encontro dele, acompanhado de sua esposa, Lectra, e de seus filhos, Símia e Xeno, a fim de convidá-lo para sua casa.


    1:5 Pois Tito lhes havia descrito a aparência de Paulo. Eles ainda não o conheciam pessoalmente, mas conheciam apenas seu caráter.


    1:6 Foram pela estrada real em direção a Listra e ficaram ali à espera dele, comparando cada pessoa que passava com a descrição que Tito lhes havia dado.


    1:7 Por fim, viram um homem se aproximando — era Paulo —, de baixa estatura, calvo ou com a cabeça raspada,[a] coxas arqueadas, pernas bem-formadas, olhos fundos e nariz curvo. Era cheio de graça, pois às vezes parecia um homem e às vezes tinha o semblante de um anjo. Paulo viu Onesíforo e alegrou-se.


    1:8 Onesíforo disse: “Saudações, servo do Deus bendito!” Paulo respondeu: “A graça de Deus esteja com você e sua família.”


    1:9 Demas e Hermógenes, porém, ficaram cheios de inveja e, fazendo grande demonstração de religiosidade, Demas disse: “Nós também não somos servos do Deus bendito? Por que você não nos saudou?”


    1:10 Onesíforo respondeu: “Porque não percebi em vocês os frutos da justiça. Contudo, se forem dessa espécie, também serão bem-vindos à minha casa.”


    1:11 Então Paulo entrou na casa de Onesíforo, e por causa disso houve grande alegria entre os da casa. Eles se dedicavam à oração, ao partir do pão e a ouvir Paulo anunciar a palavra de Deus a respeito do domínio próprio[b] e da ressurreição, da seguinte maneira:


    1:12 “Felizes os puros de coração, porque verão a Deus.


    1:13 “Felizes os que mantêm sua carne sem mancha, isto é, pura,[c] porque serão o templo de Deus.


    1:14 “Felizes os que exercem domínio próprio, isto é, os castos,[d] porque Deus se revelará a eles.


    1:15 “Felizes os que abandonam os prazeres deste mundo, porque serão acolhidos por Deus.


    1:16 “Felizes os que têm esposa como se não a tivessem, porque serão feitos anjos de Deus.


    1:17 “Felizes os que tremem diante da palavra de Deus, porque serão consolados.


    1:18 “Felizes os que conservam puro o seu batismo, porque encontrarão paz com o Pai, o Filho e o Espírito Santo.


    1:19 “Felizes os que buscam a sabedoria, isto é, o ensinamento,[e] de Jesus Cristo, porque serão chamados filhos do Altíssimo.


    1:20 “Felizes os que observam as instruções de Jesus Cristo, porque habitarão na luz eterna.


    1:21 “Felizes os que, por amor a Cristo, abandonam as glórias do mundo, porque julgarão anjos, serão colocados à direita de Cristo e não sofrerão a amargura do juízo final.


    1:22 “Felizes os corpos e as almas das pessoas virgens, porque são agradáveis a Deus e não perderão a recompensa de sua virgindade. Pois a palavra de seu Pai celestial[f] se mostrará eficaz para a salvação delas no dia de seu Filho, e elas desfrutarão descanso para sempre.”


    Notas


    [a] 1:7 A testemunha inglesa preserva as alternativas “calvo” e “com a cabeça raspada”; a distinção depende de revisão direta da tradição grega e das versões antigas.

    [b] 1:11 “Domínio próprio” também pode ter aqui o sentido mais específico de continência ou castidade, especialmente à luz das bem-aventuranças que se seguem.

    [c] 1:13 A testemunha traz “sem mancha” com “pura” como alternativa explicativa.

    [d] 1:14 A expressão pode designar domínio próprio em sentido amplo ou castidade em sentido específico.

    [e] 1:19 A testemunha permite “sabedoria” ou “ensinamento”.

    [f] 1:22 “Celestial” aparece como esclarecimento parentético na testemunha inglesa fornecida.'
