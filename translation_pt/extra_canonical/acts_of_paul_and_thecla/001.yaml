lexical_decisions:
- source_word: oracles
  choice: oráculos
  rationale: Preserva a linguagem solene da testemunha e a possível ideia de pronunciamentos divinos, sem reduzi-la simplesmente a palavras ou mandamentos.
- source_word: temperance
  choice: domínio próprio
  rationale: É natural em português moderno e mantém o sentido amplo; uma nota registra que o contexto pode apontar mais especificamente para continência ou castidade.
- source_word: Blessed
  choice: Felizes
  rationale: Expressa de modo claro e corrente a fórmula de bem-aventurança, sem tornar a frase uma declaração sacramental ou denominacional.
- source_word: king’s highway
  choice: estrada real
  rationale: Mantém a designação histórica da via pública principal sob autoridade régia.
- source_word: countenance
  choice: semblante
  rationale: Conserva o foco na aparência facial sem sugerir uma transformação ontológica.
- source_word: breaking of bread
  choice: partir do pão
  rationale: Preserva a expressão tradicional e sua possível amplitude, sem decidir se se trata apenas de refeição comum ou de rito eucarístico.
- source_word: undefiled
  choice: sem mancha
  rationale: Reproduz a imagem de não contaminação; “pura” é preservado como alternativa explicativa em nota.
- source_word: accepted
  choice: acolhidos
  rationale: Português natural que comunica recepção favorável por Deus sem impor uma teoria técnica de aceitação.
- source_word: virgins
  choice: pessoas virgens
  rationale: Evita restringir indevidamente a afirmação a um só gênero, pois o texto menciona corpos e almas em formulação geral.
theological_decisions:
- issue: Ascetismo e continência
  choice: Preservar literalmente as afirmações sobre castidade, casamento, prazeres mundanos e virgindade
  alternative: Suavizar essas afirmações para harmonizá-las com tradições cristãs posteriores
  rationale: O capítulo apresenta tensão ascética genuína; a tradução não deve corrigi-la nem importá-la como doutrina normativa.
- issue: Ter esposa como se não a tivesse
  choice: Manter a formulação paradoxal
  alternative: Interpretar como desapego emocional ou abstinência sexual
  rationale: A frase admite mais de uma leitura e ecoa linguagem paulina; explicá-la no corpo do texto eliminaria sua ambiguidade.
- issue: Serão feitos anjos de Deus
  choice: Traduzir a afirmação sem paráfrase
  alternative: Verter como “serão semelhantes aos anjos”
  rationale: A testemunha afirma transformação ou designação como anjos; substituir por mera semelhança resolveria uma tensão teológica sem base suficiente.
- issue: Conservar puro o batismo
  choice: Manter a metáfora do batismo puro
  alternative: Explicar como fidelidade aos votos batismais ou vida sem pecado após o batismo
  rationale: O sentido preciso não é explicitado pela testemunha e não deve ser definido denominacionalmente.
- issue: Pai, Filho e Espírito Santo
  choice: Preservar a fórmula triádica tal como transmitida
  alternative: Padronizar para uma fórmula litúrgica posterior com artigos repetidos
  rationale: A redação mantém a testemunha sem deduzir uma formulação dogmática além dela.
- issue: Julgar anjos e ocupar a direita de Cristo
  choice: Conservar ambas as promessas literalmente
  alternative: Interpretá-las simbolicamente como honra celestial
  rationale: O texto deixa a natureza dessas promessas sem explicação.
- issue: A palavra do Pai eficaz para a salvação
  choice: Manter a relação instrumental ampla entre palavra e salvação
  alternative: Identificar “palavra” com Cristo, Escritura, promessa ou decreto
  rationale: A referência é teologicamente ambígua e a testemunha não autoriza uma identificação exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento direto usa “você/vocês”, enquanto a narração conserva cadência literária. Esta é uma tradução provisória baseada na testemunha inglesa de domínio público fornecida; a revisão direta do grego e das tradições versionais ainda está pendente. As alternativas parentéticas da testemunha foram transferidas para notas marcadas no texto.
