  footnotes:
  - marker: a
    text: O testemunho inglês traz “peixes (bezerros-marinhos)”; a identificação exata dos animais aquáticos permanece incerta sem revisão direta da tradição grega e das versões antigas.
    reason: Preservar uma identificação zoológica obscura e registrar a limitação da base documental.
  - marker: b
    text: O testemunho inglês impresso traz “lighting and fire”, expressão que pode refletir “clarão/relâmpago e fogo” ou uma leitura/transmissão problemática. A tradução mantém o sentido provável sem eliminar a incerteza textual.
    reason: Sinalizar possível erro, ambiguidade ou corrupção no testemunho inglês utilizado.
  - marker: c
    text: Amomo é o nome antigo de uma planta aromática. O testemunho inglês acrescenta explicações alternativas, como uma espécie de nardo, “erva de Jerusalém” ou “rosa-das-damas”; a identificação botânica exata é incerta.
    reason: Explicar um termo botânico raro sem incorporar como certa a glosa instável do testemunho.
  - marker: d
    text: O relato afirma antes que Trifena “morreu” (9:14) e aqui que “tornou a levantar-se”. A sequência foi preservada sem harmonização.
    reason: Tornar transparente a tensão narrativa e teológica entre morte, desmaio e possível revivificação.
lexical_decisions:
- source_word: Thecla / Trifina
  choice: Tecla / Trifena
  rationale: Formas portuguesas tradicionais e imediatamente reconhecíveis; “Trifena” se harmoniza com o uso bíblico lusófono de Tryphena.
- source_word: she-lion / he-lion
  choice: leoa / leão
  rationale: Distinção natural e precisa em português, necessária para acompanhar a ação narrativa.
- source_word: place appointed for fighting with the beasts / stage
  choice: lugar destinado ao combate com as feras / arena
  rationale: “Arena” comunica naturalmente o espaço público do espetáculo, enquanto a formulação mais extensa em 9:1 preserva a explicação do testemunho.
- source_word: fish (sea-calves)
  choice: animais marinhos[a]
  rationale: Evita apresentar como certa uma identificação zoológica obscura; a nota conserva os termos do testemunho inglês.
- source_word: spikenard, cassia, amomus, ointment
  choice: nardo, cássia, amomo, unguento
  rationale: Mantém a série de substâncias aromáticas com equivalentes portugueses formais e compreensíveis.
- source_word: privy-parts / members
  choice: órgãos genitais / membros
  rationale: Em 9:12 usa-se clareza anatômica sem eufemismo enganoso; em 9:13 preserva-se a expressão menos específica do testemunho.
- source_word: robe of salvation
  choice: veste da salvação
  rationale: Mantém a metáfora religiosa e o registro solene sem linguagem arcaica.
- source_word: rose again
  choice: tornou a levantar-se[d]
  rationale: Preserva a formulação ambígua e sua possível ressonância de ressurreição, sem decidir se descreve revivificação ou recuperação de um desmaio.
- source_word: habit of a man
  choice: roupas de homem
  rationale: Expressão atual e clara para vestimenta masculina, sem acrescentar juízo sobre identidade ou função.
theological_decisions:
- issue: Batismo de Tecla por iniciativa própria
  choice: 'Preservar literalmente a ação e a fórmula narrativa: “sou batizada” e “lançou-se na água”'
  alternative: Reformular como batismo administrado por outra pessoa ou explicar sua validade
  rationale: O texto apresenta uma tensão eclesiológica real; a tradução não deve impor uma prática denominacional nem corrigir o relato.
- issue: Morte e retorno de Trifena
  choice: Traduzir 9:14 como morte e 9:23 como tornar a levantar-se, com nota
  alternative: Interpretar 9:14 apenas como desmaio profundo ou 9:23 explicitamente como ressurreição milagrosa
  rationale: A sequência do testemunho deve permanecer sem harmonização; o próprio discurso de Trifena associa o acontecimento à ressurreição, mas sua natureza narrativa não deve ser definida além do texto.
- issue: Exclusividade salvífica de Cristo em 9:19
  choice: “Só ele é o caminho para a salvação eterna” e preservar a advertência de morte eterna
  alternative: Suavizar para linguagem apenas devocional ou expandir em sistema doutrinário
  rationale: Mantém a afirmação enfática do texto sem introduzir uma formulação confessional posterior.
- issue: “Jesus Cristo, seu Filho, em quem Deus se agrada”
  choice: Conservar a relação filial e a declaração de agrado divino
  alternative: Reformular em terminologia trinitária técnica
  rationale: A tradução mantém a cristologia expressa pelo testemunho sem importar terminologia conciliar posterior.
- issue: Proteção da nudez de Tecla
  choice: Manter a nuvem de fogo como proteção para que o povo não visse sua nudez
  alternative: Espiritualizar ou omitir a nudez
  rationale: O motivo de proteção corporal e honra faz parte explícita da narrativa.
