  text: '9:1 Then Thecla was taken from Trifina, stripped naked, fitted with a belt, and thrown into the place appointed for fighting wild beasts. The lions and bears were released against her.


    9:2 But the fiercest of them all, a lioness, ran to Thecla and lay down at her feet. At this, the crowd of women shouted loudly.


    9:3 Then a female bear charged fiercely toward her, but the lioness met the bear and tore it to pieces.


    9:4 Again, a male lion that was accustomed to devouring people, and that belonged to Alexander, ran toward her. But the lioness confronted the male lion, and they killed each other.


    9:5 Then the women became even more distressed because the lioness that had helped Thecla was dead.


    9:6 Afterward, they brought out many other wild beasts. But Thecla stood with her hands stretched toward heaven and prayed. When she had finished praying, she turned around, saw a pool of water, and said, “Now is the right time for me to be baptized.”


    9:7 So she threw herself into the water and said, “In your name, O my Lord Jesus Christ, I am baptized on this last day.” When the women and the people saw this, they cried out, “Do not throw yourself into the water!” The governor himself also cried out at the thought that the fish (sea-calves) were likely to devour so much beauty.


    9:8 Despite all this, Thecla threw herself into the water in the name of our Lord Jesus Christ.


    9:9 But when the fish (sea-calves) saw the lighting and fire, they were killed and floated dead on the surface of the water. A cloud of fire surrounded Thecla, so that just as the beasts could not come near her, the people could not see her nakedness.


    9:10 Yet they released other wild beasts against her. At this, the women raised a deeply mournful cry. Some of them scattered spikenard, others cassia, others amomus [a kind of spikenard, or the herb of Jerusalem, or ladies’ rose], and others ointment. The amount of ointment was great, in proportion to the number of people. Then all the beasts lay down as though they were fast asleep and did not touch Thecla.


    9:11 Then Alexander said to the governor, “I have some very terrifying bulls. Let us bind her to them.” The governor replied with concern, “You may do what you think is appropriate.”


    9:12 Then they put a cord around Thecla’s waist that also bound her feet, and with it they tied her to the bulls. They applied red-hot irons to the bulls’ genitals so that, being tormented even more, they might drag Thecla around more violently until they had killed her.


    9:13 The bulls tore around, making a horrifying noise. But the flame surrounding Thecla burned through the cords fastened to the bulls’ members, and she stood in the middle of the arena as calmly as if she had not been bound.


    9:14 Meanwhile, Trifina, who was sitting on one of the benches, fainted and died. At this, the whole city became greatly distressed.


    9:15 Alexander himself was afraid and pleaded with the governor, saying, “I beg you, have compassion on me and on the city, and release this woman who has fought with the beasts, lest you, I, and the whole city be destroyed.


    9:16 For if Caesar receives any report of what has just happened, he will certainly destroy the city at once, because Trifina, a woman of royal descent and his relative, has died in her seat.”


    9:17 Then the governor called Thecla to him from among the beasts and said to her, “Who are you, and what is your condition, that not one of the beasts will touch you?”


    9:18 Thecla answered him, “I am a servant of the living God. As for my condition, I am a believer in Jesus Christ, his Son, in whom God is well pleased. For that reason, none of the beasts could touch me.


    9:19 He alone is the way to eternal salvation and the foundation of eternal life. He is a refuge for those in distress, a support for the afflicted, and hope and defense for the hopeless. In short, all who do not believe in him will not live but will suffer eternal death.”


    9:20 When the governor heard these things, he ordered her clothes to be brought and said to her, “Put on your clothes.”


    9:21 Thecla replied, “May the God who clothed me when I was naked among the beasts clothe your soul with the robe of salvation on the day of judgment.” Then she took her clothes and put them on. The governor immediately issued an order in these words: “I release to you Thecla, the servant of God.”


    9:22 At this, the women cried out together in a loud voice and, with one accord, praised God, saying, “There is only one God, who is the God of Thecla—the one God who has delivered Thecla.”


    9:23 Their voices were so loud that the whole city seemed to be shaken. Trifina herself heard the good news, rose again, and ran with the crowd to meet Thecla. Embracing her, she said, “Now I believe that there will be a resurrection of the dead. Now I am convinced that my daughter is alive. Therefore, come home with me, my daughter Thecla, and I will transfer to you everything I have.”


    9:24 So Thecla went with Trifina and stayed there for a few days, teaching her the word of the Lord. Through this, many young women were converted, and there was great joy in Trifina’s household.


    9:25 But Thecla longed to see Paul. She made inquiries and sent people everywhere to find him. At last, when she was told that he was at Myra in Lycia, she took many young men and women with her. She put on a belt, dressed herself in men’s clothing, and went to him at Myra in Lycia. There she found Paul preaching the word of God, and she stood beside him among the crowd.'
translation:
  language: pt
  text: 'ATOS DE PAULO E TECLA — CAPÍTULO 9


    9:1 Então Tecla foi tirada das mãos de Trifena, despida, cingida com um cinturão e lançada no lugar destinado ao combate com as feras. E soltaram contra ela os leões e os ursos.


    9:2 Mas uma leoa, a mais feroz de todas, correu até Tecla e deitou-se aos pés dela. Diante disso, a multidão de mulheres gritou bem alto.


    9:3 Então uma ursa avançou ferozmente contra ela, mas a leoa enfrentou a ursa e a despedaçou.


    9:4 Depois, um leão que costumava devorar pessoas e pertencia a Alexandre correu contra ela. Mas a leoa enfrentou o leão, e os dois mataram um ao outro.


    9:5 Então as mulheres ficaram ainda mais aflitas, porque a leoa que havia ajudado Tecla estava morta.


    9:6 Depois disso, trouxeram muitas outras feras. Tecla, porém, permaneceu em pé, com as mãos estendidas para o céu, e orou. Quando terminou de orar, virou-se, viu um tanque de água e disse: “Agora é o momento certo para eu ser batizada”.


    9:7 Então se lançou na água e disse: “Em teu nome, ó meu Senhor Jesus Cristo, neste último dia sou batizada”. Quando as mulheres e o povo viram isso, gritaram: “Não se lance na água!” O próprio governador também gritou, ao pensar que os animais marinhos[a] estavam prestes a devorar tamanha beleza.


    9:8 Apesar de tudo isso, Tecla lançou-se na água em nome de nosso Senhor Jesus Cristo.


    9:9 Mas, quando os animais marinhos viram o clarão e o fogo,[b] morreram e ficaram boiando na superfície da água. Uma nuvem de fogo cercou Tecla, de modo que, assim como as feras não podiam aproximar-se dela, o povo também não podia ver sua nudez.


    9:10 Ainda assim, soltaram outras feras contra ela. Diante disso, as mulheres soltaram um grito profundamente doloroso. Algumas espalharam nardo, outras, cássia, outras, amomo,[c] e outras, unguento. A quantidade de unguento era grande, proporcional ao número de pessoas. Então todas as feras se deitaram como se estivessem em sono profundo e não tocaram em Tecla.


    9:11 Alexandre disse então ao governador: “Tenho alguns touros terríveis. Vamos amarrá-la a eles”. O governador respondeu, aflito: “Faça o que julgar apropriado”.


    9:12 Então puseram uma corda em torno da cintura de Tecla, prendendo também os pés dela, e com essa corda a amarraram aos touros. Aplicaram ferros em brasa aos órgãos genitais dos animais para que, ainda mais atormentados, arrastassem Tecla com maior violência até matá-la.


    9:13 Os touros se lançaram de um lado para outro, fazendo um barulho horrendo. Mas a chama que cercava Tecla queimou as cordas presas aos membros dos touros, e ela permaneceu no meio da arena tão tranquila como se não tivesse sido amarrada.


    9:14 Enquanto isso, Trifena, que estava sentada em uma das arquibancadas, desmaiou e morreu. Diante disso, toda a cidade ficou profundamente aflita.


    9:15 O próprio Alexandre ficou com medo e suplicou ao governador: “Peço-lhe que tenha compaixão de mim e da cidade e solte esta mulher que combateu com as feras, para que você, eu e toda a cidade não sejamos destruídos.


    9:16 Pois, se César receber notícia do que acaba de acontecer, certamente destruirá a cidade de imediato, porque Trifena, mulher de origem real e parente dele, morreu em seu assento”.


    9:17 Então o governador chamou Tecla para junto de si, dentre as feras, e lhe perguntou: “Quem é você? Qual é a sua condição, para que nenhuma das feras toque em você?”


    9:18 Tecla lhe respondeu: “Sou serva do Deus vivo. Quanto à minha condição, creio em Jesus Cristo, seu Filho, em quem Deus se agrada. Por essa razão, nenhuma das feras pôde tocar em mim.


    9:19 Só ele é o caminho para a salvação eterna e o fundamento da vida eterna. Ele é refúgio para os que estão em aflição, amparo para os atribulados, esperança e proteção para os que não têm esperança. Em suma, todos os que não creem nele não viverão, mas sofrerão a morte eterna”.


    9:20 Ao ouvir essas coisas, o governador mandou trazer as roupas dela e lhe disse: “Vista suas roupas”.


    9:21 Tecla respondeu: “Que o Deus que me vestiu quando eu estava nua entre as feras vista a sua alma com a veste da salvação no dia do juízo”. Então pegou suas roupas e as vestiu. Imediatamente, o governador proclamou esta ordem: “Eu lhes entrego em liberdade Tecla, a serva de Deus”.


    9:22 Diante disso, as mulheres gritaram juntas em alta voz e, em comum acordo, louvaram a Deus, dizendo: “Há um só Deus, o Deus de Tecla! O único Deus que libertou Tecla!”


    9:23 As vozes delas eram tão fortes que toda a cidade parecia estremecer. A própria Trifena ouviu a boa notícia, tornou a levantar-se[d] e correu com a multidão ao encontro de Tecla. Abraçando-a, disse: “Agora creio que haverá ressurreição dos mortos. Agora estou convencida de que minha filha está viva. Portanto, venha para minha casa, minha filha Tecla, e passarei para você tudo o que possuo”.


    9:24 Tecla foi com Trifena e ficou hospedada ali por alguns dias, ensinando-lhe a palavra do Senhor. Por meio disso, muitas jovens se converteram, e houve grande alegria na casa de Trifena.


    9:25 Tecla, porém, ansiava por ver Paulo. Procurou obter notícias e enviou pessoas por toda parte para encontrá-lo. Por fim, quando lhe disseram que ele estava em Mira, na Lícia, levou consigo muitos rapazes e moças. Cingiu-se com um cinturão, vestiu-se com roupas de homem e foi até ele em Mira, na Lícia. Ali encontrou Paulo pregando a palavra de Deus e ficou ao lado dele no meio da multidão.


    [a] O testemunho inglês traz “peixes (bezerros-marinhos)”; a identificação exata dos animais aquáticos permanece incerta sem revisão direta da tradição grega e das versões antigas.


    [b] O testemunho inglês impresso traz “lighting and fire”, expressão que pode refletir “clarão/relâmpago e fogo” ou uma leitura/transmissão problemática. A tradução mantém o sentido provável sem eliminar a incerteza textual.


    [c] Amomo é o nome antigo de uma planta aromática. O testemunho inglês acrescenta explicações alternativas, como uma espécie de nardo, “erva de Jerusalém” ou “rosa-das-damas”; a identificação botânica exata é incerta.


    [d] O relato afirma antes que Trifena “morreu” (9:14) e aqui que “tornou a levantar-se”. A sequência foi preservada sem harmonização.'
