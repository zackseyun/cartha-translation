base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/007.yaml
  text: '7:1 Then Paul sent Onesiphorus and his family back to their own home. Taking Thecla with him, he went to Antioch.


    7:2 As soon as they entered the city, a Syrian named Alexander, a city magistrate who had performed many significant services for the city during his term, saw Thecla and fell in love with her. He tried to win Paul over with many costly gifts.


    7:3 But Paul told him, “I do not know the woman you are speaking about, nor does she belong to me.”


    7:4 But Alexander, being a person of great power in Antioch, seized her in the street and kissed her. Thecla would not tolerate this. Looking around for Paul, she cried out loudly in distress, “Do not force me, a stranger! Do not force me, a servant of God! I am one of the prominent people of Iconium, and I was forced to leave that city because I refused to marry Thamyris.”


    7:5 Then she seized Alexander, tore his coat, took the crown from his head, and made him look ridiculous in front of all the people.


    7:6 But Alexander, partly because he loved her and partly because he was ashamed of what had happened, brought her before the governor. When she admitted what she had done, the governor condemned her to be thrown to the beasts.'
translation:
  language: pt
  text: '7:1 Então Paulo mandou Onesíforo e sua família de volta para casa. Levando Tecla consigo, partiu para Antioquia.


    7:2 Assim que entraram na cidade, um sírio chamado Alexandre, magistrado da cidade que havia prestado muitos serviços importantes durante seu mandato, viu Tecla e se apaixonou por ela. Com muitos presentes valiosos, tentou conquistar o apoio de Paulo.


    7:3 Paulo, porém, lhe disse: “Não conheço a mulher de quem você fala, e ela não me pertence.”


    7:4 Mas Alexandre, que exercia grande poder em Antioquia, agarrou-a na rua e a beijou. Tecla não tolerou aquilo. Procurando Paulo com os olhos, gritou angustiada: “Não me violente! Sou estrangeira! Não me violente! Sou serva de Deus! Sou uma das pessoas de destaque de Icônio e fui obrigada a deixar aquela cidade porque me recusei a casar com Tâmiris.”[a]


    7:5 Então ela agarrou Alexandre, rasgou-lhe o manto, tirou-lhe a coroa da cabeça[b] e o expôs ao ridículo diante de todo o povo.


    7:6 Alexandre, porém, em parte porque a amava e em parte porque se sentia humilhado pelo que havia acontecido, levou-a perante o governador. Quando ela reconheceu o que havia feito, o governador a condenou a ser lançada às feras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradução de “Não me violente” é provisória. A testemunha inglesa diz literalmente “Não me forces”; a forma grega precisa ser verificada na revisão da fonte original.
    reason: A fonte fornecida informa que a revisão direta do grego ainda está pendente, e a extensão exata da coerção deve permanecer aberta.
  - marker: b
    text: “Coroa” traduz a testemunha disponível sem especificar se se tratava de coroa, grinalda ou insígnia ligada ao cargo.
    reason: Preserva uma ambiguidade material e institucional que só poderá ser esclarecida, se possível, pela tradição grega e versional.
lexical_decisions:
- source_word: Force me not
  choice: Não me violente
  rationale: No contexto de agarrá-la e beijá-la contra a vontade, a expressão comunica coerção e agressão sexual sem limitar o sentido necessariamente à consumação de estupro.
- source_word: magistrate
  choice: magistrado da cidade
  rationale: Preserva a função cívica sem impor um cargo antigo mais específico do que permite a testemunha fornecida.
- source_word: engage Paul in his interest
  choice: conquistar o apoio de Paulo
  rationale: Expressa em português corrente a tentativa de obter a cooperação ou anuência de Paulo mediante presentes.
- source_word: coat
  choice: manto
  rationale: Termo digno e plausível para uma veste exterior, embora a identificação exata dependa da revisão do grego.
- source_word: crown
  choice: coroa
  rationale: Mantém a designação não especificada da testemunha, sem decidir se era coroa cívica, grinalda ou outro adorno.
- source_word: beasts
  choice: feras
  rationale: Forma tradicional e natural para animais usados em execução ou espetáculo público.
theological_decisions:
- issue: Declaração de Paulo de que Tecla não lhe pertence
  choice: “ela não me pertence”
  alternative: “ela não tem relação comigo”
  rationale: Preserva a tensão do texto entre desconhecimento, vínculo pessoal e possível autoridade sobre ela, sem explicar ou justificar a resposta de Paulo.
- issue: Autodesignação de Tecla
  choice: “Sou serva de Deus”
  alternative: “Sou escrava de Deus”
  rationale: “Serva” mantém a linguagem religiosa tradicional e é compreensível, sem eliminar o sentido de submissão expresso pela formulação antiga.
- issue: Confissão diante do governador
  choice: “reconheceu o que havia feito”
  alternative: “confessou o que havia feito”
  rationale: Evita sugerir necessariamente confissão religiosa ou culpa moral; indica que ela admitiu os atos narrados.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa legibilidade brasileira. A redação evita arcaísmos desnecessários e mantém a violência da cena explícita sem ornamentação. Trata-se de versão provisória baseada na testemunha inglesa de domínio público fornecida, pois a revisão direta da tradição grega e das versões antigas está pendente.
