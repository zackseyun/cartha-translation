    reason: Evita que a tradução determine uma forma particular de violência que a testemunha fornecida não explicita.
  - marker: b
    text: “Coroa” traduz a testemunha disponível sem especificar se se tratava de coroa, grinalda ou insígnia ligada ao cargo.
    reason: Preserva uma ambiguidade material e institucional que só poderá ser esclarecida, se possível, pela tradição grega e versional.
