    7:3 Paulo, porém, lhe disse: “Não conheço a mulher de quem você fala, e ela não me pertence.”


    7:4 Mas Alexandre, que exercia grande poder em Antioquia, agarrou-a na rua e a beijou. Tecla não tolerou aquilo. Procurando Paulo com os olhos, gritou angustiada: “Não use força contra mim! Sou estrangeira! Não use força contra mim! Sou serva de Deus! Sou uma das pessoas de destaque de Icônio e fui obrigada a deixar aquela cidade porque me recusei a casar com Tâmiris.”[a]


    7:5 Então ela agarrou Alexandre, rasgou-lhe a veste, tirou-lhe a coroa da cabeça[b] e o expôs ao ridículo diante de todo o povo.


