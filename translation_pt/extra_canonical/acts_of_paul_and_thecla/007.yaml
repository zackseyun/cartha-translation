  revision_rationale: A revisão remove uma interpretação excessivamente específica da fala de Tecla e aproxima a reação de Alexandre do sentido explícito da testemunha. A nota provisória sobre “Não me violente” torna-se desnecessária após a adoção de uma formulação ampla e diretamente fiel. A nota sobre “coroa” é mantida, pois assinala uma ambiguidade real sem alterar o texto.
