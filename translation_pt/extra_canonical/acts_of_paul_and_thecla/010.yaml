  text: '10:1 But Paul was greatly surprised when he saw her and the people with her, for he thought that some new trial was coming upon them.


    10:2 When Thecla realized this, she said to him, “I have been baptized, O Paul, for he who assists you in preaching has assisted me to baptize.”


    10:3 Then Paul took her and led her to the house of Hermes. Thecla told Paul everything that had happened to her in Antioch, so that Paul was exceedingly amazed, and all who heard were strengthened in the faith and prayed for Trifina’s happiness.


    10:4 Then Thecla arose and said to Paul, “I am going to Iconium.” Paul replied to her, “Go and teach the word of the Lord.”


    10:5 But Trifina had sent large sums of money to Paul, as well as clothing by the hands of Thecla, for the relief of the poor.


    10:6 So Thecla went to Iconium. When she came to the house of Onesiphorus, she fell to the floor where Paul had sat and preached. Mingling her tears with her prayers, she praised and glorified God with these words:


    10:7 “O Lord, the God of this house, in which I was first enlightened by you; O Jesus, Son of the living God, who were my helper before the governor, my helper in the fire, and my helper among the beasts—you alone are God forever and ever. Amen.”


    10:8 On her return, Thecla found Thamyris dead, but her mother still living. So she called her mother and said to her, “Theoclia, my mother, is it possible for you to be brought to believe that there is only one Lord God, who dwells in the heavens? If you desire great riches, God will give them to you through me. If you want your daughter again, here I am.”


    10:9 She presented these and many other things to her mother, [endeavouring] to persuade her [to her opinion]. But her mother, Theoclia, gave no credence to the things spoken by the martyr Thecla.


    10:10 When Thecla realized that she was speaking to no purpose, she marked her whole body with the sign [of the cross], left the house, and went to Daphine. When she arrived there, she went to the cave where she had found Paul with Onesiphorus, fell to the ground, and wept before God.


    10:11 After leaving there, she went to Seleucia and enlightened many in the knowledge of Christ.


    10:12 And a bright cloud guided her on her journey.


    10:13 After she arrived at Seleucia, she went to a place outside the city, about a furlong away, because she was afraid of the inhabitants, since they were worshipers of idols.


    10:14 And she was led [by the cloud] to a mountain called Calamon, or Rodeon. She remained there for many years and endured a great many grievous temptations from the devil. Through the assistance she received from Christ, she bore them in a fitting manner.


    10:15 At last, certain gentlewomen heard about the virgin Thecla and went to her. They were instructed by her in the oracles of God, and many of them abandoned this world and led a monastic life with her.


    10:16 In this way, a good report about Thecla spread everywhere, and she performed several [miraculous] cures. As a result, people from the whole city and the surrounding regions brought their sick to that mountain. Before they came as far as the door of the cave, they were instantly cured of whatever illness they had.


    10:17 The unclean spirits were cast out, making a noise. All received their sick restored to health and glorified God, who had bestowed such power on the virgin Thecla.


    10:18 Consequently, the physicians of Seleucia were no longer held in any regard and lost all the profit from their trade, because no one paid attention to them. At this they were filled with envy and began to devise what measures they might take against this servant of Christ.'
translation:
  language: pt
  text: '10:1 Paulo ficou muito surpreso quando a viu com as pessoas que a acompanhavam, pois pensou que uma nova provação lhes sobrevinha.


    10:2 Quando Tecla percebeu isso, disse-lhe: “Ó Paulo, fui batizada, pois aquele que te auxilia na pregação também me auxiliou a batizar-me.”[a]


    10:3 Então Paulo a recebeu e a conduziu à casa de Hermes. Tecla contou a Paulo tudo o que lhe havia acontecido em Antioquia. Paulo ficou extremamente admirado, todos os que ouviram foram fortalecidos na fé e oraram pelo bem-estar de Trifena.


    10:4 Então Tecla se levantou e disse a Paulo: “Vou para Icônio.” Paulo lhe respondeu: “Vai e ensina a palavra do Senhor.”


    10:5 Trifena havia enviado a Paulo grandes somas de dinheiro e também, pelas mãos de Tecla, roupas para socorrer os pobres.


    10:6 Assim, Tecla foi para Icônio. Ao chegar à casa de Onesíforo, lançou-se ao chão no lugar onde Paulo havia se sentado e pregado. Misturando lágrimas às suas orações, louvou e glorificou a Deus com estas palavras:


    10:7 “Ó Senhor, Deus desta casa, na qual primeiro me iluminaste; ó Jesus, Filho do Deus vivo, que foste meu auxílio diante do governador, meu auxílio no fogo e meu auxílio entre as feras: somente tu és Deus para todo o sempre. Amém.”


    10:8 Ao retornar, Tecla encontrou Tamíris morto, mas sua mãe ainda viva. Chamou-a e lhe disse: “Teóclia, minha mãe, será possível levar-te a crer que há um só Senhor Deus, que habita nos céus? Se desejas grandes riquezas, Deus as dará a ti por meu intermédio. Se queres tua filha de volta, aqui estou.”


    10:9 Tecla apresentou à mãe essas e muitas outras razões, procurando persuadi-la. Sua mãe, Teóclia, porém, não acreditou nas coisas ditas pela mártir Tecla.


    10:10 Percebendo que falava em vão, Tecla traçou sobre todo o corpo o sinal [da cruz],[b] deixou a casa e foi para Dafne. Ao chegar ali, dirigiu-se à caverna onde havia encontrado Paulo com Onesíforo, lançou-se ao chão e chorou diante de Deus.


    10:11 Partindo dali, foi para Selêucia e iluminou muitos no conhecimento de Cristo.


    10:12 Uma nuvem luminosa a guiou durante a viagem.


    10:13 Depois de chegar a Selêucia, foi para um lugar fora da cidade, a cerca de um estádio de distância,[c] pois temia os habitantes, que adoravam ídolos.


    10:14 E foi conduzida [pela nuvem][d] a um monte chamado Calamon, ou Rodeon.[e] Ali permaneceu muitos anos e suportou numerosas e penosas tentações do diabo. Com o auxílio que recebia de Cristo, enfrentou-as de maneira digna.


    10:15 Por fim, algumas mulheres de posição ouviram falar da virgem Tecla e foram até ela. Tecla as instruiu nos oráculos de Deus, e muitas delas abandonaram este mundo e passaram a viver com ela em renúncia.[f]


    10:16 Assim, a boa fama de Tecla espalhou-se por toda parte, e ela realizou várias curas [milagrosas].[g] Por isso, pessoas de toda a cidade e das regiões vizinhas levavam seus enfermos àquele monte. Antes mesmo que chegassem à entrada da caverna, eram imediatamente curados de qualquer enfermidade que tivessem.


    10:17 Os espíritos impuros eram expulsos aos gritos; todos recebiam de volta seus enfermos já restabelecidos e glorificavam a Deus, que havia concedido tamanho poder à virgem Tecla.


    10:18 Em consequência disso, os médicos de Selêucia perderam toda a consideração e todo o lucro de seu ofício, pois ninguém mais recorria a eles. Então, encheram-se de inveja e começaram a tramar o que fariam contra essa serva de Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação do testemunho é incomum e pode significar que o mesmo auxílio divino dado à pregação de Paulo ajudou Tecla a batizar a si própria; a identificação precisa do agente permanece aberta.
    reason: Preservar a ambiguidade sintática e teológica de 10:2.
  - marker: b
    text: As palavras “da cruz” aparecem entre colchetes no testemunho utilizado, indicando uma complementação ou restauração editorial.
    reason: Explicar os colchetes preservados no texto.
  - marker: c
    text: Um estádio correspondia aproximadamente a 185 metros, embora a medida variasse no mundo antigo.
    reason: Tornar compreensível a antiga indicação de distância.
  - marker: d
    text: A expressão “pela nuvem” aparece entre colchetes no testemunho utilizado.
    reason: Identificar a natureza editorial da explicitação.
  - marker: e
    text: O testemunho conserva os nomes alternativos “Calamon” e “Rodeon”; a variante não foi harmonizada.
    reason: Preservar a alternativa textual ou toponímica.
  - marker: f
    text: O testemunho inglês diz literalmente que elas passaram a levar uma “vida monástica”; a tradução evita pressupor a forma institucional desenvolvida do monaquismo posterior.
    reason: Evitar anacronismo, mantendo o sentido ascético.
  - marker: g
    text: A palavra “milagrosas” aparece entre colchetes no testemunho utilizado.
    reason: Sinalizar uma explicitação editorial preservada.
lexical_decisions:
- source_word: trial
  choice: provação
  rationale: Preserva o sentido de adversidade ou teste sem restringi-lo a um processo judicial.
- source_word: happiness
  choice: bem-estar
  rationale: Em português atual, expressa de modo amplo o bem ou a prosperidade desejados para Trifena, evitando o tom psicológico estreito de “felicidade”.
- source_word: enlightened
  choice: iluminou / iluminaste
  rationale: Mantém a imagem religiosa recorrente do testemunho em 10:7 e 10:11, sem convertê-la em uma explicação doutrinária.
- source_word: oracles of God
  choice: oráculos de Deus
  rationale: Preserva a formulação religiosa solene e sua possível abrangência, em vez de reduzi-la simplesmente a “ensinamentos”.
- source_word: gentlewomen
  choice: mulheres de posição
  rationale: Comunica status social elevado em linguagem moderna e evita o arcaísmo “damas nobres”.
- source_word: furlong
  choice: estádio
  rationale: Usa a unidade antiga equivalente, esclarecida em nota com medida aproximada.
- source_word: monastic life
  choice: viver com ela em renúncia
  rationale: Evita projetar instituições monásticas plenamente desenvolvidas sobre a narrativa e conserva a ideia de abandono da vida mundana.
- source_word: physicians
  choice: médicos
  rationale: Equivalente direto e natural em português contemporâneo.
theological_decisions:
- issue: Agente e forma do batismo de Tecla em 10:2
  choice: “aquele que te auxilia na pregação também me auxiliou a batizar-me”
  alternative: “aquele que trabalha contigo na pregação também me batizou”
  rationale: Mantém a sintaxe reflexiva e a ambiguidade do testemunho fornecido, sem identificar explicitamente o agente nem normalizar o episódio segundo uma prática eclesial posterior.
- issue: Confissão sobre Jesus em 10:7
  choice: “somente tu és Deus para todo o sempre”
  alternative: “tu somente és Deus eternamente”
  rationale: Preserva a aplicação direta da declaração a Jesus e a força teológica do texto, sem paráfrase harmonizadora.
- issue: Sinal corporal em 10:10
  choice: “o sinal [da cruz]”
  alternative: “o sinal da cruz”
  rationale: Conserva os colchetes do testemunho, sinalizando que “da cruz” é elemento editorial ou restaurado e não deve ser apresentado sem qualificação.
- issue: Ascetismo em 10:15
  choice: “abandonaram este mundo e passaram a viver com ela em renúncia”
  alternative: “levaram com ela uma vida monástica”
  rationale: Retém o teor ascético sem importar uma estrutura institucional ou denominação posterior que o testemunho possa não exigir.
- issue: Poder de cura de Tecla em 10:16–17
  choice: “Deus... havia concedido tamanho poder à virgem Tecla”
  alternative: “Deus curava por meio de Tecla”
  rationale: Segue a formulação narrativa, mantendo simultaneamente a agência concedida a Tecla e a origem divina do poder.
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. Empregou-se “tu” apenas nas falas solenes e familiares em que a flexão tradicional favorece o tom literário; a narração permanece corrente. Nomes próprios foram aportuguesados de modo reconhecível. Como a revisão direta do grego está pendente e o material fornecido é um testemunho inglês de domínio público, as ambiguidades, alternativas e inserções entre colchetes foram mantidas e explicitadas, sem alegar certeza filológica além da evidência disponível.
