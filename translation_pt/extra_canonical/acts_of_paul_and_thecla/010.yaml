review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de modo muito próximo o testemunho inglês fornecido e preserva adequadamente as alternativas e explicitações entre colchetes em 10:10, 10:14 e 10:16. Há, contudo, duas perdas pontuais: em 10:3, “Paul took her” foi interpretado como “Paulo a recebeu”, e em 10:9 as expressões editoriais entre colchetes foram absorvidas sem sinalização, ao mesmo tempo que “things” foi especificado como “razões”. Em 10:15, “viver com ela em renúncia” atenua a referência explícita a uma forma de vida ascética compartilhada.'
  naturalness: O português é fluente, moderno e adequado a leitura ampla. A revisão só ajusta algumas construções para conservar melhor as indefinições e os sinais editoriais do testemunho sem sacrificar a clareza.
  terminology: Os nomes, “provação”, “oráculos de Deus”, “estádio”, “espíritos impuros” e os termos cristológicos estão adequados. “Vida ascética” em 10:15 comunica o conteúdo de “monastic life” sem pressupor uma institucionalização monástica posterior; a nota esclarece essa opção. Mantêm-se “mártir” e “virgem” como designações narrativas do testemunho.
  issues:
  - severity: medium
    issue: '10:3: “Then Paul took her” foi vertido por “Então Paulo a recebeu”.'
    rationale: “Recebeu” introduz a noção de acolhimento, ausente do testemunho. “Tomou-a e conduziu-a” conserva a formulação narrativa sem acrescentar uma interpretação.
  - severity: medium
    issue: '10:9: os colchetes de “[endeavouring]” e “[to her opinion]” não foram preservados; “things” tornou-se “razões”.'
    rationale: Os colchetes são sinais editoriais que a própria tradução declara preservar. “Razões” também restringe “coisas” a argumentos. A revisão mantém ambos os sinais e a formulação abrangente.
  - severity: low
    issue: '10:15: “passaram a viver com ela em renúncia” não explicita suficientemente a vida ascética compartilhada indicada pelo testemunho.'
    rationale: “Levar uma vida ascética com ela” retém tanto o abandono do mundo quanto o modo de vida comum, sem impor um modelo monástico institucional posterior.
  revised_text: '10:1 Paulo ficou muito surpreso quando a viu com as pessoas que a acompanhavam, pois pensou que uma nova provação lhes sobrevinha.


    10:2 Quando Tecla percebeu isso, disse-lhe: “Ó Paulo, fui batizada, pois aquele que te auxilia na pregação também me auxiliou a batizar-me.”[a]


    10:3 Então Paulo a tomou e a conduziu à casa de Hermes. Tecla contou a Paulo tudo o que lhe havia acontecido em Antioquia. Paulo ficou extremamente admirado; todos os que ouviram foram fortalecidos na fé e oraram pelo bem-estar de Trifena.


    10:4 Então Tecla se levantou e disse a Paulo: “Vou para Icônio.” Paulo lhe respondeu: “Vai e ensina a palavra do Senhor.”


    10:5 Trifena havia enviado a Paulo grandes somas de dinheiro e também, pelas mãos de Tecla, roupas para socorrer os pobres.


    10:6 Assim, Tecla foi para Icônio. Ao chegar à casa de Onesíforo, lançou-se ao chão no lugar onde Paulo havia se sentado e pregado. Misturando lágrimas às suas orações, louvou e glorificou a Deus com estas palavras:


    10:7 “Ó Senhor, Deus desta casa, na qual primeiro me iluminaste; ó Jesus, Filho do Deus vivo, que foste meu auxílio diante do governador, meu auxílio no fogo e meu auxílio entre as feras: somente tu és Deus para todo o sempre. Amém.”


    10:8 Ao retornar, Tecla encontrou Tamíris morto, mas sua mãe ainda viva. Chamou-a e lhe disse: “Teóclia, minha mãe, será possível levar-te a crer que há um só Senhor Deus, que habita nos céus? Se desejas grandes riquezas, Deus as dará a ti por meu intermédio. Se queres tua filha de volta, aqui estou.”


    10:9 Tecla expôs à mãe estas e muitas outras coisas, [procurando] persuadi-la [a adotar sua opinião].[h] Sua mãe, Teóclia, porém, não acreditou nas coisas ditas pela mártir Tecla.


    10:10 Percebendo que falava em vão, Tecla traçou sobre todo o corpo o sinal [da cruz],[b] deixou a casa e foi para Dafne. Ao chegar ali, dirigiu-se à caverna onde havia encontrado Paulo com Onesíforo, lançou-se ao chão e chorou diante de Deus.


    10:11 Partindo dali, foi para Selêucia e iluminou muitos no conhecimento de Cristo.


    10:12 Uma nuvem luminosa a guiou durante a viagem.


    10:13 Depois de chegar a Selêucia, foi para um lugar fora da cidade, a cerca de um estádio de distância,[c] pois temia os habitantes, que adoravam ídolos.


