base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/002.yaml
  text: And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.
translation:
  language: pt
  text: E seus filhos o sepultaram. Depois disso, levaram seus ossos para o lugar onde estavam Abraão, Isaque e Jacó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθαψαν
  choice: sepultaram
  rationale: Expressa com naturalidade e dignidade o ato de enterrar, preservando o sentido funerário do verbo grego.
- source_word: ἀπήνεγκαν
  choice: levaram
  rationale: O verbo indica transportar para outro lugar; o contexto fornecido não exige explicitar direção ascendente em português.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: seus ossos
  rationale: Tradução direta e idiomática da expressão grega.
- source_word: ἔνθα ἦν
  choice: onde estavam
  rationale: O singular grego ocorre antes de uma enumeração de três patriarcas; em português, a concordância plural torna a frase natural sem alterar o referente coletivo.
theological_decisions:
- issue: Natureza do lugar para onde os ossos foram levados
  choice: o lugar onde estavam Abraão, Isaque e Jacó
  alternative: o túmulo onde estavam sepultados Abraão, Isaque e Jacó
  rationale: Mantém a formulação e a possível ambiguidade do grego, sem acrescentar que se tratava explicitamente de um túmulo nem definir em que sentido os patriarcas 'estavam' ali.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A segunda oração foi iniciada por 'Depois disso' para evitar a repetição pouco natural de 'E', sem perda da sequência narrativa.
