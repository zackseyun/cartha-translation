  text: And having said these things, he kissed them affectionately and fell asleep a good sleep.
translation:
  language: pt
  text: E, depois de dizer essas coisas, beijou-os com carinho e adormeceu num sono tranquilo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταφιλήσας αὐτούς
  choice: beijou-os com carinho
  rationale: O verbo καταφιλέω indica um beijo afetuoso ou insistente; a formulação comunica o afeto de modo natural em português sem exagerar a intensidade.
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: adormeceu num sono tranquilo
  rationale: A construção cognata grega é pouco natural se reproduzida literalmente. “Sono tranquilo” expressa καλός neste contexto como um sono sereno e bom, preservando o provável eufemismo narrativo sem explicitar “morreu”.
theological_decisions:
- issue: Possível eufemismo para a morte
  choice: adormeceu num sono tranquilo
  alternative: morreu serenamente
  rationale: O grego conserva a imagem do sono e não declara diretamente a morte; a tradução mantém essa ambiguidade e evita resolver a metáfora teologicamente.
translation_notes:
  register: Português moderno, digno e acessível, com encadeamento narrativo natural. A imagem do sono foi preservada, enquanto a construção cognata grega foi vertida idiomaticamente.
