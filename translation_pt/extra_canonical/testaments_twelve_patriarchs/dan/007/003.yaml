  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/003.yaml
  text: Nevertheless Dan prophesied to them that they would forget [their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring].
translation:
  language: pt
  text: Contudo, Dan lhes profetizou que se esqueceriam de seu Deus e seriam alienados da terra de sua herança, da linhagem de Israel e da família de sua descendência.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πλὴν οὖν
  choice: Contudo
  rationale: Expressa a transição adversativa do grego de modo natural e digno, sem tornar a oposição mais forte do que o texto permite.
- source_word: προεφήτευσεν αὐτοῖς
  choice: lhes profetizou
  rationale: Mantém tanto o sentido verbal de anunciar profeticamente quanto o objeto indireto plural.
- source_word: ἀνήνεγκαν τὰ ὀστᾶ αὐτοῦ
  choice: eles transportaram os ossos dele
  rationale: Verte o ato de levar ou transportar os ossos sem acrescentar um destino não especificado; o pronome explícito torna legível o sujeito plural implícito no verbo grego.
- source_word: κατέθηκαν σύνεγγυς
  choice: os depositaram ali perto
  rationale: ‘Depositaram’ comunica colocação deliberada, enquanto ‘ali perto’ preserva a referência espacial relativa e não especificada de σύνεγγυς.
theological_decisions:
- issue: Referente de αὐτοῦ em ‘os ossos dele’
  choice: Manter o pronome sem identificar nominalmente seu referente
  alternative: Substituir o pronome pelo nome de uma personagem inferida do contexto
  rationale: O fragmento fornecido não explicita o antecedente; identificá-lo resolveria indevidamente uma ambiguidade textual.
- issue: Natureza da profecia de Dan
  choice: Apresentar o transporte dos ossos como conteúdo da profecia
  alternative: Reformular como narrativa direta posterior
  rationale: A construção com ὅτι subordina a ação a προεφήτευσεν; a tradução conserva essa relação sintática sem acrescentar interpretação teológica.
translation_notes:
  register: Português contemporâneo, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A redação preserva os referentes não especificados e evita importar detalhes ausentes do grego.
