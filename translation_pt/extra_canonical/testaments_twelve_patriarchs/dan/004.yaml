lexical_decisions:
- source_word: ματαία
  choice: inútil
  rationale: Expressa a ideia de algo vão, improdutivo ou sem proveito, sem substituir o texto grego fornecido pela leitura alternativa sobre cegueira.
- source_word: δύναμιν τοῦ θυμοῦ
  choice: a força da ira
  rationale: Preserva a linguagem de poder ou força e mantém a tensão da afirmação de que essa força é inútil.
- source_word: παροξύνεται
  choice: é provocada
  rationale: Mantém o sentido passivo de a ira ser incitada inicialmente por uma palavra.
- source_word: δυναμοῖ
  choice: fortalece
  rationale: Preserva a imagem de que os atos dão força a quem está entrando em estado de ira.
- source_word: ζημίαις πικραῖς
  choice: com perdas amargas
  rationale: Mantém tanto o sentido de perda ou dano quanto sua qualidade dolorosa.
- source_word: διαβούλιον
  choice: propósito
  rationale: Representa a intenção ou deliberação interior que a ira põe em desordem.
- source_word: κινεῖσθε εἰς ὀργήν
  choice: não se deixem levar à ira
  rationale: Conserva de modo natural em português a metáfora grega de movimento em direção à ira.
- source_word: ἐπαίρεσθε
  choice: não se elevem
  rationale: Mantém a imagem de exaltação pessoal causada pelo elogio.
- source_word: τέρψιν ... ἀηδίαν
  choice: deleite ... aversão
  rationale: Preserva o contraste entre atração prazerosa e repulsa, em registro digno e compreensível.
- source_word: ὀξύνει τὸν νοῦν
  choice: aguça a mente
  rationale: Conserva a metáfora de tornar a percepção mental mais afiada.
- source_word: ἐρεθισθέν
  choice: a provocação
  rationale: É uma leitura contextual possível do particípio difícil; a ambiguidade textual é registrada em nota.
- source_word: ἐκθροεῖσθε
  choice: não fiquem perturbados
  rationale: Comunica agitação ou abalo emocional sem restringir o sentido ao medo.
- source_word: διπρόσωπον κακόν
  choice: um mal de duas faces
  rationale: Reproduz a metáfora explícita do grego e sua associação entre ira e falsidade.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma grega apresentada, deixando a variante Belial para a nota cultural.
theological_decisions:
- issue: Agência moral e espiritual em αὐτὸ τὸ πνεῦμα e Βελίαρ
  choice: Manter “esse mesmo espírito” e “Beliar passa a dominá-la”
  alternative: Entender “espírito” apenas como impulso psicológico e Beliar apenas como metáfora abstrata do mal
  rationale: O texto combina análise moral e linguagem de conflito espiritual; manter ambas evita reduzir uma dimensão à outra.
- issue: κύριος no contexto da exortação judaica
  choice: o Senhor
  alternative: o SENHOR; o Mestre
  rationale: “O Senhor” preserva o caráter religioso do título sem identificar de modo mais específico aquilo que o grego deixa sem explicitação.
- issue: Afastamento do Senhor da alma perturbada
  choice: “o Senhor se afasta dela”
  alternative: Suavizar como perda da percepção da presença divina
  rationale: A tradução conserva a afirmação forte do texto e sua tensão teológica, sem introduzir uma explicação doutrinária ausente do grego.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais para leitores brasileiros sem regionalismos marcados. A exortação permanece no plural. A tradução segue prioritariamente o grego fornecido, especialmente no versículo 1, e registra em nota a forma divergente preservada na camada inglesa de consulta.
