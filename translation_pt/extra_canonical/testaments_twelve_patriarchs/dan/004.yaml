  text: '1[a]. For anger is blindness. It does not allow one to see the face of any man with truth.


    2. For first it is stirred up by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it provokes him. It throws his purpose into confusion, and so it rouses his soul in great fury.


    3[b]. Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.


    4. For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.


    5. But if you fall into any loss or ruin, children, do not be distressed. For this very spirit makes one desire to be angry over what is perishing, so that he may fall into anger through affliction.


    6. And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.


    7. And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it[c][d], and Beliar rules over it.'
translation:
  language: pt
  text: '**Testamento de Dã 4**


    **1.** Compreendam, portanto, a força da ira: ela é inútil.[a]


    **2.** Primeiro, ela é provocada por uma palavra; depois, por meio de atos, fortalece quem está se irando. Com perdas amargas, perturba o propósito dessa pessoa e, assim, incita sua alma a uma grande fúria.


    **3.** Portanto, quando alguém falar contra vocês, não se deixem levar à ira. E, se alguém os elogiar como santos, não se elevem; não passem nem ao deleite nem à aversão.


    **4.** Pois o elogio primeiro agrada aos ouvidos e, em seguida, aguça a mente para perceber a provocação.[b] Depois de se irar, a pessoa pensa que sua ira é justa.


    **5.** Mas, se sofrerem algum prejuízo ou alguma perda, filhos, não fiquem perturbados. Pois esse mesmo espírito faz a pessoa cobiçar o que está se perdendo, para que, por meio desse sofrimento, ela caia na ira.[c]


    **6.** E, se sofrerem prejuízo voluntária ou involuntariamente, não se entristeçam, pois da tristeza também surge a ira, acompanhada de falsidade.[d]


    **7.** A ira acompanhada de falsidade é um mal de duas faces; ambas se unem para perturbar o coração. Quando a alma permanece perturbada, o Senhor se afasta dela, e Beliar passa a dominá-la.[e]


    [a] O texto grego fornecido diz: “Compreendam, portanto, a força da ira: ela é inútil”. Há uma forma textual conhecida deste início que descreve a ira como cegueira e afirma que ela impede a pessoa de ver o rosto dos outros com verdade.


    [b] O texto grego é difícil. “Perceber a provocação” também pode ser entendido como “perceber aquilo que foi incitado” ou “perceber a irritação”.


    [c] A construção grega é difícil. Ela parece ligar o desejo ou a cobiça pelo que está se perdendo ao sofrimento pelo qual a pessoa cai na ira. Outra interpretação possível é: “faz a pessoa desejar o que se perde, para que ela caia na ira por meio desse sofrimento”.


    [d] “Acompanhada de falsidade” pode indicar que a ira surge junto com o engano ou que a tristeza produz uma ira que depois é reforçada por mentiras.


    [e] Beliar é um nome tradicional dado ao poder maligno ou adversário na literatura judaica. Em algumas tradições, o nome aparece como “Belial”.'
