  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001.yaml
  text: 'In the fifth year of his life[a], Dan called together his family and said:


    2. “Hear my words, sons of Dan, and pay attention to the words of your father.

    3. I have tested in my heart, and in all my life, that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.

    4. So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.

    5. And I rejoiced over his being sold, because his father loved him more than us.

    6. For the spirit of jealousy and of arrogance kept saying to me, ‘You yourself also are his son.’

    7. And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you when he is dead.’

    8. Now this was the spirit of anger persuading me, that just as a leopard devours a young goat, so I too should destroy Joseph.

    9. But the God of my fathers did not give him into my hands[b], so that I might find him alone and kill him and commit this lawless deed[c], lest two tribes be destroyed from Israel.”'
translation:
  language: pt
  text: '**Testamento de Dã, sétimo filho de Jacó e Bila**


    **1** Cópia das palavras de Dã, que ele disse a seus filhos no fim de seus dias, no centésimo vigésimo quinto ano de sua vida.


    **2** Depois de reunir sua família, ele disse:


    — Escutem minhas palavras, filhos de Dã, e prestem atenção às palavras de seu pai.


    **3** Comprovei em meu coração e ao longo de toda a minha vida que a verdade, acompanhada da prática da justiça, é boa e agradável a Deus, e que a falsidade e a ira são más e ensinam ao ser humano toda espécie de maldade.


    **4** Por isso, hoje confesso a vocês, meus filhos, que resolvi em meu coração matar meu irmão José, aquele homem bom e verdadeiro.


    **5** Eu me alegrei quando ele foi vendido, porque nosso pai o amava mais do que a nós.


    **6** Pois o espírito do ciúme e da arrogância me dizia:


    — Você também é filho dele.


    **7** E um dos espíritos de Beliar cooperava comigo, dizendo:


    — Pegue a espada e mate José com ela; quando ele estiver morto, seu pai amará você.


    **8** Era o espírito da ira que me persuadia: assim como um leopardo devora um cabrito, ele me impelia a devorar José.[a]


    **9** Mas o Deus de meus pais não o entregou em minhas mãos, de modo que eu pudesse encontrá-lo sozinho, matá-lo e fazer desaparecer de Israel um segundo cetro.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego deste versículo é corrompido ou de interpretação incerta. A imagem parece comparar o impulso de destruir José a um leopardo que suga ou devora um cabrito.
    reason: textual_variant
  - marker: b
    text: A expressão “um segundo cetro” é difícil e sua referência exata é incerta. A tradução preserva a metáfora do texto grego, sem substituí-la por uma interpretação específica.
    reason: ambiguity
lexical_decisions:
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν αὐτοῦ
  choice: no fim de seus dias
  rationale: Expressa naturalmente a fórmula testamentária e mantém seu sentido temporal.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: no centésimo vigésimo quinto ano de sua vida
  rationale: O grego preservado diz explicitamente “centésimo vigésimo quinto”; a tradução segue o testemunho original, e não a leitura divergente da camada inglesa.
- source_word: προσέχετε
  choice: prestem atenção
  rationale: Imperativo claro e corrente, adequado à exortação solene de um pai aos filhos.
- source_word: ἀλήθεια μετὰ δικαιοπραγίας
  choice: a verdade, acompanhada da prática da justiça
  rationale: Mantém a verdade como disposição moral ligada à conduta efetivamente justa.
- source_word: ψεῦδος
  choice: falsidade
  rationale: O substantivo abstrato corresponde ao contraste ético com “verdade”.
- source_word: θυμός
  choice: ira
  rationale: Comunica a intensidade do vício recorrente no testamento sem usar linguagem arcaica.
- source_word: ζῆλος
  choice: ciúme
  rationale: No contexto, Dã ressente o amor preferencial do pai por José; “ciúme” preserva essa dimensão relacional.
- source_word: ἀλαζονεία
  choice: arrogância
  rationale: Expressa com clareza contemporânea a presunção e a autoexaltação indicadas pelo termo.
- source_word: πνευμάτων τοῦ Βελίαρ
  choice: espíritos de Beliar
  rationale: Retém o nome próprio na forma do testemunho grego e não reduz a referência demonológica a mero impulso psicológico.
- source_word: ἀνελῶ / ἄνελε
  choice: mate / matasse
  rationale: Verbos diretos que preservam sem eufemismo a intenção homicida.
- source_word: πάρδαλις
  choice: leopardo
  rationale: Equivalente zoológico comum e apropriado para a imagem predatória.
- source_word: ἔριφον
  choice: cabrito
  rationale: Termo português claro e natural para o filhote de cabra.
- source_word: λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ
  choice: fizesse desaparecer de Israel um segundo cetro
  rationale: Preserva a metáfora política e tribal do grego, em vez de a substituir pela interpretação “duas tribos”.
theological_decisions:
- issue: Beliar como poder pessoal maligno
  choice: “um dos espíritos de Beliar”
  alternative: “um espírito maligno”
  rationale: O grego nomeia Beliar e apresenta uma estrutura demonológica explícita; a tradução conserva essa especificidade.
- issue: A ação divina que impede o crime de Dã
  choice: “não permitiu que ele caísse em minhas mãos”
  alternative: “não o entregou em minhas mãos”
  rationale: Segue de perto οὐκ εἴασεν ... ἐμπεσεῖν e mantém simultaneamente a contenção divina e a culpa da intenção de Dã.
- issue: Identidade do “segundo cetro”
  choice: Manter a metáfora no texto principal
  alternative: Interpretar diretamente como “uma segunda tribo” ou “duas tribos”
  rationale: A expressão grega é metafórica e teologicamente sugestiva; explicá-la apenas em nota evita resolver uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O discurso direto usa travessões. A tradução segue prioritariamente o grego fornecido, inclusive a idade de 125 anos e a imagem do “segundo cetro”, em divergência consciente da camada inglesa de consulta.
