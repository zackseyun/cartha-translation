  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/006.yaml
  text: And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.
translation:
  language: pt
  text: E, se vocês sofrerem prejuízo voluntariamente ou involuntariamente, não se entristeçam, pois da tristeza também surge a ira acompanhada de falsidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζημιωθῆτε
  choice: sofrerem prejuízo
  rationale: Expressa de modo natural o sentido passivo de sofrer perda ou dano, sem restringi-lo a bens materiais.
- source_word: ἑκουσίως ἢ ἀκουσίως
  choice: voluntária ou involuntariamente
  rationale: Preserva o contraste explícito entre aquilo que ocorre com consentimento e aquilo que ocorre sem intenção ou vontade.
- source_word: μὴ λυπεῖσθε
  choice: não se entristeçam
  rationale: Mantém o valor afetivo de λύπη e a forma de exortação dirigida ao plural.
- source_word: θυμός
  choice: ira
  rationale: Reproduz a ideia de cólera intensa que surge da tristeza.
- source_word: μετὰ ψεύδους
  choice: acompanhada de falsidade
  rationale: Torna natural em português a associação expressa por μετά, sem definir além do grego a relação exata entre ira e falsidade.
theological_decisions:
- issue: Relação entre tristeza, ira e falsidade
  choice: a ira acompanhada de falsidade
  alternative: a ira, juntamente com a falsidade
  rationale: A formulação mantém a falsidade associada à ira, como no texto grego, sem transformar a afirmação numa sequência causal adicional.
translation_notes:
  register: Português moderno, digno e acessível, com plural explícito em “vocês”. A estrutura causal do grego foi preservada, com leve ajuste de ordem para fluidez.
