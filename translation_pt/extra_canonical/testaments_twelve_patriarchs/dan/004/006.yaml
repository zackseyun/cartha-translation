  text: Καὶ⁴¹ ἐὰν ζημιωθῆτε ἑκουσίως *ἢ ἀκουσίως⁴² *μὴ λυπεῖσθε⁴³· ἀπὸ γὰρ λύπης⁴⁴ ἐγείρεται⁴⁵ καὶ⁴⁶ θυμός⁴⁷ ⌈μετὰ ψεύδους⁷⌉.
