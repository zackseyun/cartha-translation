  source_fidelity: A tradução identifica corretamente οὐκοῦν, o imperativo plural σύνετε e τὴν δύναμιν τοῦ θυμοῦ. Contudo, ματαία é feminino singular e concorda gramaticalmente com δύναμις («poder»), também feminino em grego, não com θυμός («ira»), que é masculino. A formulação proposta faz da ira o referente explícito da inutilidade e, assim, altera a referência sintática preservada pelo texto grego.
  naturalness: «Portanto, compreendam que o poder da ira é inútil» é claro, idiomático e adequadamente solene em português moderno internacional.
  terminology: «Ira» é uma boa equivalência para θυμός neste contexto, e «poder» preserva δύναμις. A revisão mantém ambos os termos e explicita em português a relação que o grego marca pela concordância.
  issues:
