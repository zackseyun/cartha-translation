  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/001.yaml
  text: Therefore understand the power of anger, that it is futile.
translation:
  language: pt
  text: Portanto, compreendam que o poder da ira é inútil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Portanto
  rationale: Expressa naturalmente a conclusão ou consequência indicada pela partícula grega.
- source_word: σύνετε
  choice: compreendam
  rationale: Imperativo plural de συνίημι; a forma inclusiva e corrente em português preserva a exortação dirigida a vários ouvintes.
- source_word: τὴν δύναμιν τοῦ θυμοῦ
  choice: o poder da ira
  rationale: Mantém a construção e a força do grego; “ira” comunica aqui uma emoção intensa e atuante.
- source_word: ματαία ἐστίν
  choice: ela é inútil
  rationale: ματαία pode indicar aquilo que é vão, fútil ou sem proveito. “Inútil” exprime com clareza que a ira não produz resultado proveitoso, sem acrescentar uma interpretação teológica.
theological_decisions:
- issue: Referente do sujeito implícito em “ματαία ἐστίν”
  choice: ela, isto é, a ira
  alternative: isso, isto é, o poder da ira
  rationale: Embora o grego permita relacionar a afirmação à expressão anterior como um todo, o feminino singular de ματαία concorda mais diretamente com θυμός entendido semanticamente como “ira” em português; a tradução explicita essa referência para soar natural.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Os dois membros da frase foram ligados por dois-pontos para tornar explícita a relação explicativa indicada por ὅτι.
