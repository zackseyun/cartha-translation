    issue: Referente de «ela é inútil»
    rationale: O pronome «ela» retoma «ira» em português, mas o adjetivo grego ματαία concorda com δύναμιν («poder»). A tradução deve atribuir a qualidade de «inútil/vão» ao poder da ira, sem resolver a construção em favor da ira isoladamente.
  revised_text: Portanto, compreendam que o poder da ira é inútil.
