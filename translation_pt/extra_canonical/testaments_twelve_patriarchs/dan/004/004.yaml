  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/004.yaml
  text: For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.
translation:
  language: pt
  text: Pois, primeiro, isso agrada ao ouvido e, assim, aguça a mente para perceber a provocação[a]; e, tomado de ira, ele pensa que está irado com justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego neste ponto é incerto; também pode ser entendido como “aquilo que o irritou”.
    reason: Os sinais críticos da edição indicam dificuldade textual em torno de τοῦ νοῆσαι τὸ ἐρεθισθέν, e a alternativa preserva uma leitura possível sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: τέρπει τὴν ἀκοήν
  choice: agrada aos ouvidos
  rationale: Reproduz a imagem auditiva do grego em português natural, indicando que aquilo de que se fala inicialmente soa agradável.
- source_word: ὀξύνει τὸν νοῦν
  choice: aguça a mente
  rationale: Mantém a metáfora de tornar a mente afiada ou intensamente atenta.
- source_word: τὸ ἐρεθισθέν
  choice: a provocação
  rationale: Segue o sentido contextual de algo percebido como motivo de irritação, sem definir se a ofensa foi real ou apenas interpretada dessa maneira.
- source_word: θυμωθείς
  choice: tomado de ira
  rationale: Expressa a entrada do sujeito num estado de forte indignação, com linguagem digna e corrente.
- source_word: νομίζει δικαίως ὀργίζεσθαι
  choice: pensa que está irado com justiça
  rationale: 'Preserva o juízo subjetivo do sujeito e a tensão do original: ele considera legítima a própria ira, sem que o narrador confirme essa avaliação.'
theological_decisions:
- issue: Suposta legitimidade da ira
  choice: pensa que está irado com justiça
  alternative: considera justa a sua ira
  rationale: 'A formulação escolhida conserva a estrutura e a tensão do grego: trata-se da opinião do homem irado, não de uma declaração objetiva de que sua ira seja justa.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “ela” retoma o referente feminino do contexto anterior, conforme pressuposto pela forma verbal grega; “então” torna natural a progressão do processo descrito sem alterar sua lógica.
