  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.
translation:
  language: pt
  text: Portanto, quando alguém falar contra vocês, não se deixem levar pela ira; e, se alguém os elogiar como santos, não se encham de orgulho. Não mudem, seja para o prazer, seja para o desgosto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κινεῖσθε εἰς ὀργήν
  choice: não se deixem levar à ira
  rationale: Expressa de modo natural o movimento interior em direção à ira, preservando a ideia de ser impelido a esse estado.
- source_word: ἐπαίρεσθε
  choice: não se encham de orgulho
  rationale: No contexto de receber elogios, o verbo descreve elevar-se interiormente ou tornar-se presunçoso; esta formulação é clara e corrente.
- source_word: μεταβάλλεσθε
  choice: não passem
  rationale: Mantém a noção de mudança ou transição para estados emocionais, sem acrescentar explicitamente 'de atitude', ausente do grego.
- source_word: τέρψιν … ἀηδίαν
  choice: prazer … desgosto
  rationale: Conserva o contraste grego entre satisfação prazerosa e aversão ou desagrado, em termos compreensíveis no português moderno.
theological_decisions:
- issue: Elogio dirigido aos destinatários 'como santos'
  choice: como santos
  alternative: por serem santos
  rationale: A construção ὡς ἁγίους pode indicar a caracterização feita por quem elogia, sem afirmar diretamente que o elogio seja verdadeiro; 'como santos' preserva essa nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por 'vocês'. A última frase conserva o paralelismo e a concisão do grego, evitando explicar excessivamente os estados emocionais em vista.
