revisions:
- from: Portanto, quando alguém falar contra vocês, não se deixem levar à ira; e, se alguém os elogiar como santos, não se encham de orgulho. Não passem nem ao prazer nem ao desgosto.
  to: Portanto, quando alguém falar contra vocês, não se deixem levar pela ira; e, se alguém os elogiar como santos, não se encham de orgulho. Não mudem, seja para o prazer, seja para o desgosto.
  rationale: 'A revisão melhora duas construções pouco idiomáticas, preservando a progressão do grego: não ceder à ira diante de fala hostil, não se ensoberbecer diante de louvor e não mudar para nenhum dos dois estados contrastantes. Não são necessárias notas, pois não há ambiguidade textual que exija explicação ao leitor.'
