review_pass:
  verdict: revise
  source_fidelity: A tradução transmite bem a exortação e preserva a caracterização não afirmativa em “como santos”. “Não se encham de orgulho” reproduz adequadamente o sentido de ἐπαίρεσθε no contexto de louvor. Contudo, “não se deixem levar à ira” não é a combinação mais idiomática em português para o movimento expresso por κινεῖσθε εἰς ὀργήν; “pela ira” conserva o sentido de ceder a ela. A cláusula final requer uma formulação mais natural que mantenha a dupla alternativa de μεταβάλλεσθε ... εἰς.
  naturalness: O registro é moderno e claro, e o uso de “vocês” é apropriado. A frase final, “Não passem nem ao prazer nem ao desgosto”, soa truncada em português contemporâneo, pois “passar a” pede uma construção diferente nesse contexto. “Não mudem, seja para o prazer, seja para o desgosto” é mais fluente sem explicar além do grego.
  terminology: “Ira”, “santos”, “orgulho”, “prazer” e “desgosto” são escolhas adequadas e de registro compatível. “Como santos” deve ser mantido, pois não transforma o elogio do interlocutor em afirmação autoral sobre os destinatários.
  issues:
  - severity: medium
    issue: Colocação pouco natural em “não se deixem levar à ira”.
    rationale: Em português, a construção idiomática é normalmente “deixar-se levar pela ira”. Ela expressa adequadamente a ideia de ser impelido ou incitado à ira.
  - severity: medium
    issue: 'Formulação final truncada: “Não passem nem ao prazer nem ao desgosto”.'
    rationale: Embora reflita literalmente a transição indicada por μεταβάλλεσθε εἰς, “passar ao prazer” não soa natural nesse uso. Uma redação com “mudem” preserva a mudança para um ou outro estado sem acrescentar interpretação.
  revised_text: Portanto, quando alguém falar contra vocês, não se deixem levar pela ira; e, se alguém os elogiar como santos, não se encham de orgulho. Não mudem, seja para o prazer, seja para o desgosto.
  revised_footnotes: []
  revision_rationale: 'A revisão melhora duas construções pouco idiomáticas, preservando a progressão do grego: não ceder à ira diante de fala hostil, não se ensoberbecer diante de louvor e não mudar para nenhum dos dois estados contrastantes. Não são necessárias notas, pois não há ambiguidade textual que exija explicação ao leitor.'
