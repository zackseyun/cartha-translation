  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/005.yaml
  text: But if you fall into any loss or destruction, children, do not be thrown into confusion. For that very spirit causes one to desire to be angry over what is perishing, so that he may fall into anger through passion.
translation:
  language: pt
  text: Mas, se sofrerem algum prejuízo ou alguma destruição, filhos, não se alarmem. Pois esse mesmo espírito faz desejar o que está perecendo, para que se caia na ira por meio da paixão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio do sofrimento” ou “por meio da aflição”. A palavra grega também pode indicar sofrimento ou aflição.'
    reason: πάθος pode denotar paixão/impulso ou sofrimento/aflição; a nota preserva essa ambiguidade, mantendo o sentido instrumental de διά.
lexical_decisions:
- source_word: ζημίᾳ
  choice: prejuízo
  rationale: Expressa dano ou perda sofrida, mantendo distinção em relação ao termo seguinte.
- source_word: ἀπωλείᾳ
  choice: destruição
  rationale: Reproduz o sentido forte de ruína ou destruição, sem reduzi-lo simplesmente a “perda”.
- source_word: ἐκθροεῖσθε
  choice: não fiquem perturbados
  rationale: Forma natural em português para a ideia de ficar alarmado, agitado ou lançado em confusão.
- source_word: ἐπιθυμῆσαι τοῦ ἀπολλυμένου
  choice: desejar aquilo que está se perdendo
  rationale: O genitivo funciona como objeto de ἐπιθυμέω; a tradução segue diretamente a construção grega, em vez de acrescentar a ideia de “desejar ficar irado”.
- source_word: θυμῷ πέσῃ
  choice: caia na ira
  rationale: Preserva a metáfora de cair e o sentido de ira intensa de θυμός.
- source_word: διὰ τοῦ πάθους
  choice: por meio dessa paixão
  rationale: Mantém o sentido de paixão ou impulso afetivo que domina a pessoa; a possível acepção de sofrimento é registrada em nota.
theological_decisions:
- issue: Agência do espírito e sujeito implícito dos verbos
  choice: “esse mesmo espírito leva a pessoa... para que... ela caia”
  alternative: “esse mesmo espírito faz vocês desejarem... para que caiam”
  rationale: O grego deixa implícito o sujeito humano de ἐπιθυμῆσαι e πέσῃ. A formulação genérica evita definir sem necessidade se a referência é diretamente aos “filhos” ou a qualquer pessoa influenciada pelo espírito.
- issue: Objeto do desejo provocado pelo espírito
  choice: Desejo daquilo que está se perdendo
  alternative: Desejo de ficar irado por causa do que perece
  rationale: A construção grega ἐπιθυμῆσαι τοῦ ἀπολλυμένου aponta mais diretamente para a coisa que se perde como objeto do desejo. Não se acrescenta “ficar irado” ao infinitivo; a ira aparece na oração final seguinte.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Filhos” conserva o vocativo sem acrescentar “meus”. A tradução prioriza a sintaxe grega quando ela diverge da camada inglesa de consulta.
