id: T12P.DAN.4.2
reference: Testament of Dan 4:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐν γὰρ λόγῳ παροξύνεται⁵ πρῶτον εἶτα⁶ *ἐν ἔργοις⁷ †δυναμοῖ⁸ τὸν ὀργιζόμενον⁹, καὶ¹⁰ ἐν *ζημίαις πικραῖς διαταράσσει τὸ διαβούλιον αὐτοῦ¹¹, καὶ οὕτως διεγείρει ἐν θυμῷ μεγάλῳ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/002.yaml
  text: For first he is provoked by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it throws his purpose into confusion, and so it stirs up his soul in great wrath.
translation:
  language: pt
  text: Pois, primeiro, ele é provocado por uma palavra; depois, por atos, isso[a] fortalece aquele que se encoleriza; e, por perdas amargas, põe seu propósito em confusão e, assim, desperta sua alma em grande ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não declara expressamente o sujeito de “fortalece”, “põe em confusão” e “desperta”.
    reason: Preserva a ambiguidade sintática do texto-fonte e evita atribuir esses atos a um agente específico.
lexical_decisions:
- source_word: παροξύνεται
  choice: é provocado
  rationale: Expressa o valor passivo ou médio do verbo no contexto, sem especificar além do grego o agente da provocação.
- source_word: δυναμοῖ τὸν ὀργιζόμενον
  choice: fortalece aquele que está ficando irado
  rationale: Mantém tanto o sentido ativo de δυναμοῖ quanto o aspecto progressivo do particípio ὀργιζόμενον.
- source_word: ζημίαις πικραῖς
  choice: perdas amargas
  rationale: Preserva a imagem concreta de prejuízos ou perdas dolorosas, em vez de generalizá-la como mero sofrimento.
- source_word: διαβούλιον
  choice: propósito
  rationale: Representa o plano ou desígnio interior da pessoa; a formulação conserva a amplitude do termo grego.
- source_word: ἐν θυμῷ μεγάλῳ
  choice: a uma grande ira
  rationale: Traduz θυμός como ira intensa, em registro digno, sem reduzir o termo a simples irritação.
theological_decisions:
- issue: Sujeito não expresso dos verbos ativos após a primeira oração
  choice: isso, com nota explicativa
  alternative: identificar explicitamente o sujeito como a ira, uma influência ou um espírito
  rationale: O grego muda de uma forma passiva ou média para verbos ativos cujo sujeito não está expresso. A tradução evita inserir uma identificação teológica que o versículo não declara.
translation_notes:
  register: Português moderno, claro e solene, com estrutura paralela próxima do grego. A repetição de “por meio de” torna explícita a função instrumental das expressões gregas com ἐν, enquanto “isso” sinaliza, sem resolver, a mudança para um sujeito não expresso.
