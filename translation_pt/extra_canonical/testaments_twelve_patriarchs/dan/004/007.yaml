source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἔστι δὲ διπρόσωπον κακὸν ὁ θυμὸς μετὰ ψεύδους⁴⁸, καὶ συναίρονται⁴⁹ ἀλλήλοις ἵνα ταράξωσι⁵⁰ *τὴν καρδίαν⁵¹· ταρασσομένης δὲ τῆς ψυχῆς συνεχῶς, ἀφίσταται ὁ⁵² Κύριος ἀπ᾽ αὐτῆς καὶ κυριεύει αὐτῆς ὁ Βελίαρ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/007.yaml
  text: And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it, and Beliar rules over it.
translation:
  language: pt
  text: A ira com a falsidade é um mal de duas faces, e ambas se unem uma à outra para perturbar o coração. E, quando a alma é continuamente perturbada, o Senhor se afasta dela, e Belial a domina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θυμὸς μετὰ ψεύδους
  choice: a ira unida à falsidade
  rationale: Expressa naturalmente a associação indicada por μετά e prepara a referência plural subsequente, sem transformar os dois elementos em uma única realidade.
- source_word: διπρόσωπον κακόν
  choice: um mal de duas faces
  rationale: Preserva a imagem concreta do grego e sua caracterização moral.
- source_word: συναίρονται ἀλλήλοις
  choice: ambas se aliam
  rationale: Comunica a ação recíproca da ira e da falsidade em português corrente e mantém o plural do original.
- source_word: ταράξωσι τὴν καρδίαν
  choice: perturbar o coração
  rationale: Mantém o simbolismo antropológico de καρδία e o sentido de agitação interior.
- source_word: ταρασσομένης ... τῆς ψυχῆς συνεχῶς
  choice: quando a alma vive continuamente perturbada
  rationale: Reproduz a condição duradoura sugerida pelo particípio presente e por συνεχῶς de maneira idiomática.
- source_word: ἀφίσταται
  choice: se afasta
  rationale: Conserva o sentido direto de afastamento sem ampliar a afirmação teológica.
- source_word: κυριεύει αὐτῆς
  choice: passa a dominá-la
  rationale: Traduz a ideia de exercer senhorio; 'passa a' explicita naturalmente o contraste temporal criado pela oração anterior.
- source_word: Βελίαρ
  choice: Belial
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome próprio.
theological_decisions:
- issue: Afastamento do Senhor da alma perturbada
  choice: o Senhor se afasta dela
  alternative: o Senhor a abandona
  rationale: A opção escolhida segue de perto ἀφίσταται e evita intensificar o texto para uma ideia irreversível de abandono.
- issue: Domínio de Belial
  choice: Belial passa a dominá-la
  alternative: Belial reina sobre ela
  rationale: '''Dominar'' preserva κυριεύει sem sugerir necessariamente um reino institucional ou uma formulação doutrinária específica.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura foi dividida em duas frases para fluidez, preservando o paralelismo entre coração perturbado, alma continuamente perturbada, afastamento do Senhor e domínio de Belial.
