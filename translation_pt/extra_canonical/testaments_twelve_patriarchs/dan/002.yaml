  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002.yaml
  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother. Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains
    mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing. This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath. Therefore, when anyone speaks against you, do
    not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry. If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.'
translation:
  language: pt
  text: '## Testamento de Dã 2


    E agora, meus filhos, eis que estou morrendo e lhes digo em verdade: a menos que vocês se guardem do espírito da falsidade[a] e da ira, e amem a verdade e a longanimidade[b], perecerão.


    Pois a ira é cegueira e não permite que se veja com verdade o rosto de ninguém. Mesmo que seja o pai ou a mãe, o irado os trata como inimigos; mesmo que seja um irmão, não o reconhece; mesmo que seja um profeta do Senhor, não lhe obedece; mesmo que seja um justo, não lhe dá atenção; mesmo que seja um amigo, não o reconhece como tal. Pois o espírito da ira o envolve nas redes do engano, cega seus olhos, obscurece sua mente por meio da falsidade e lhe impõe sua própria maneira de ver. E com que envolve seus olhos? Com o ódio do coração, para que sinta inveja de seu irmão.


    A ira é algo mau, meus filhos, porque perturba até a própria alma. Ela toma para si o corpo do irado, domina sua alma e dá poder ao corpo para que pratique toda espécie de ato contrário à lei. E, quando o corpo faz todas essas coisas, a alma justifica o que foi feito, porque não enxerga corretamente.


    Portanto, se o irado for um homem poderoso, terá em sua ira um poder tríplice: o primeiro vem da ajuda de seus servos; o segundo, de sua riqueza, com a qual persuade e vence injustamente; e o terceiro, de sua própria força natural, mediante a qual pratica o mal. E, se o irado for pobre, ainda assim terá o poder duplo da ira, pois ela sempre o auxilia a fazer o mal. Esse espírito anda sempre com a falsidade, à direita de Satanás, para que suas obras sejam realizadas com crueldade e falsidade.


    Compreendam, portanto, que o poder da ira é vazio. Primeiro, ela provoca por meio de palavras; depois, por meio de atos, fortalece aquele que está irado. Com perdas dolorosas, perturba-lhe a mente e, assim, agita-lhe a alma com grande furor. Portanto, quando alguém falar contra vocês, não se deixem levar pela ira. E, se alguém os elogiar como homens santos, não se exaltem, nem por prazer nem por aversão. Pois, primeiro, o que se diz agrada aos ouvidos; então a mente é instigada a perceber motivos para se sentir provocada; e depois, quando a pessoa se ira, pensa que sua ira é justa.


    Se sofrerem alguma perda ou ruína, meus filhos, não fiquem angustiados, pois esse mesmo espírito faz a pessoa desejar o que é perecível, a fim de que ela se ire por causa da aflição. E, se a perda ocorrer de modo voluntário ou involuntário, não se irritem, pois da irritação nasce a ira acompanhada de falsidade.


    Além disso, a ira unida à falsidade constitui um mal duplo, e ambas se ajudam mutuamente para destruir o coração. Quando a alma é perturbada continuamente, o Senhor se afasta dela, e Beliar[c] passa a dominá-la.


    [a] Ou “espírito do engano”. O termo grego pode indicar a falsidade no falar ou, de modo mais amplo, uma qualidade enganosa.


    [b] “Longanimidade” também pode ser traduzida como “paciência” ou “tolerância perseverante”; o termo ressalta a disposição de suportar provocações sem ceder à ira.


    [c] Beliar é uma forma tradicional de Belial encontrada na literatura judaica e cristã antiga.'
