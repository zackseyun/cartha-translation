lexical_decisions:
- source_word: πνεῦμα
  choice: espírito
  rationale: Mantém a apresentação da falsidade e da ira como forças morais e espirituais ativas, especialmente porque o capítulo as relaciona posteriormente com Satanás e Beliar.
- source_word: ψεύδους
  choice: falsidade
  rationale: Expressa um vício abstrato mais amplo que uma mentira isolada e permite coerência com as referências posteriores à distorção enganosa da percepção.
- source_word: θυμός
  choice: ira
  rationale: É um termo corrente e digno para a emoção dominante no capítulo, podendo abranger tanto a cólera interior quanto suas manifestações violentas.
- source_word: ἀλήθεια
  choice: verdade
  rationale: Preserva tanto o contraste abstrato com a falsidade quanto a ideia de integridade nas relações humanas.
- source_word: μακροθυμία
  choice: longanimidade
  rationale: Conserva o peso ético da perseverança paciente diante da provocação; uma nota esclarece alternativas mais correntes.
- source_word: δίκτυα
  choice: redes
  rationale: Mantém a imagem concreta de alguém envolvido e preso pelo engano.
- source_word: ἴδιον ὅρασιν
  choice: sua própria maneira de ver
  rationale: Preserva a metáfora visual e comunica com naturalidade que a ira impõe uma percepção particular e distorcida.
- source_word: φθονεῖν
  choice: sentir inveja
  rationale: Expressa naturalmente em português a disposição hostil resultante contra o irmão.
- source_word: ἀνομία
  choice: ato contrário à lei
  rationale: Retém a dimensão moral e legal do termo, em vez de reduzi-lo à ideia genérica de maldade.
- source_word: κρατεῖ
  choice: domina
  rationale: Comunica de modo direto o controle invasivo exercido sobre a alma.
- source_word: κενόν
  choice: vazio
  rationale: Preserva o juízo de que o poder aparente da ira é oco, enganoso e, em última análise, inútil.
- source_word: παροξυσμός / παροξύνειν
  choice: provocação / instigar
  rationale: Reproduz a progressão retórica entre o estímulo inicial e a intensificação da ira, com formulações naturais em português.
theological_decisions:
- issue: Agência moral e espiritual da ira e da falsidade
  choice: Manter a linguagem de “espírito” e a personificação ativa dos vícios.
  alternative: Reduzir “espírito” a “atitude”, “disposição” ou “temperamento”.
  rationale: O capítulo associa essas forças a Satanás e Beliar e descreve sua atuação dominadora; a tradução preserva essa cosmologia moral sem a sistematizar além do texto.
- issue: O afastamento do Senhor da alma
  choice: Traduzir diretamente que “o Senhor se afasta dela”.
  alternative: Parafrasear como perda da paz, da presença percebida ou da clareza moral.
  rationale: A advertência teológica é deliberadamente forte; uma paráfrase psicológica atenuaria a tensão do texto.
- issue: Satanás e Beliar no mesmo capítulo
  choice: Conservar os dois nomes distintamente.
  alternative: Identificar Beliar com Satanás ou substituir um nome pelo outro.
  rationale: A redação transmitida emprega ambas as figuras; preservar os nomes evita uma harmonização interpretativa.
- issue: Relação entre atos do corpo e justificação pela alma
  choice: Manter a afirmação de que a alma justifica os atos porque não vê corretamente.
  alternative: Reformular como simples racionalização psicológica inconsciente.
  rationale: A formulação conserva a antropologia moral do texto e sua tensão entre corpo, alma e força espiritual sem impor um esquema posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. Emprega “vocês” por legibilidade contemporânea, conserva o tom testamentário e exortativo e reserva termos menos cotidianos, como “longanimidade”, para conceitos éticos cuja densidade é esclarecida em nota.
