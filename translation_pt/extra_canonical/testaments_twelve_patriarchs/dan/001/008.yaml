base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/008.yaml
  text: This was the spirit of anger persuading me, that just as a leopard sucks out a young goat, so it put into me to suck out Joseph.
translation:
  language: pt
  text: 'Esse era o espírito da ira que me persuadia: assim como um leopardo suga um cabrito, assim ele incutiu em mim o desejo de sugar José.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta comparação é difícil e apresenta sinais de incerteza textual. O verbo repetido significa literalmente “sugar para fora” ou “extrair sugando”.
    reason: Informa ao leitor a dificuldade textual assinalada na edição e explica a imagem incomum sem substituí-la por uma interpretação.
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: o espírito da ira
  rationale: Mantém a construção genitiva e a personificação do impulso hostil, sem reduzir πνεῦμα a uma simples emoção psicológica.
- source_word: τὸ πεῖθόν με
  choice: que me persuadia
  rationale: Reproduz o particípio presente e sua ideia de influência contínua.
- source_word: πάρδαλις
  choice: leopardo
  rationale: Equivalente corrente e direto para o felino designado pelo termo grego.
- source_word: ἔριφον
  choice: cabrito
  rationale: Traduz especificamente o filhote de cabra, sem generalizá-lo como animal jovem.
- source_word: ἐκμύζουσα / ἐκμυζῆσαι
  choice: suga por completo / sugasse ... por completo
  rationale: Preserva a imagem forte e repetida de sugar ou extrair sugando; 'por completo' comunica a força do prefixo ἐκ- com naturalidade razoável em português.
- source_word: ἐμοὶ ἐνέβαλεν
  choice: incutiu em mim
  rationale: Expressa a ideia de introduzir ou lançar algo no interior da pessoa, evitando transformar a cláusula numa mera decisão autônoma de Dan.
theological_decisions:
- issue: Agência do 'espírito da ira'
  choice: Mantida como agência pessoal na formulação 'ele incutiu em mim'
  alternative: Interpretar 'espírito' apenas como disposição interior e traduzir 'a ira me levou'
  rationale: O grego apresenta o espírito como aquilo que persuade e incute; a tradução preserva essa tensão sem definir sua natureza ontológica.
- issue: Violência da metáfora contra José
  choice: Mantida a repetição literal da ação de sugar
  alternative: Parafrasear como 'destruir' ou 'matar José'
  rationale: A fonte repete o mesmo verbo raro nas duas partes da comparação; uma paráfrase eliminaria a imagem deliberadamente perturbadora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo da comparação e a estranheza intencional da imagem, enquanto 'incutiu em mim' soa mais natural do que uma reprodução mecânica de 'lançou em mim'.
