  naturalness: O português é moderno, claro e apropriado ao registro narrativo-exortativo do escrito. «Atuava comigo» é uma solução natural para a cooperação maléfica sugerida pelo contexto, sem introduzir uma conotação positiva de auxílio. A fala direta é fluente e incisiva.
