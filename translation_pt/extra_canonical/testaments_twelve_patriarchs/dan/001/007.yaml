id: T12P.DAN.1.7
reference: Testament of Dan 1:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἐκ τῶν πνευμάτων⁴³ τοῦ Βελίαρ †συνήργει⁴⁴ μοι, ὅτι⁴⁵· *Λαβὲ τὸ ξίφος καὶ ⌜ἐν τούτῳ⌝⁴⁶ ἄνελε τὸν Ἰωσήφ⁴⁷, καὶ ἀγαπήσει σε ὁ πατήρ⁴⁸, ἀποθανόντος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/007.yaml
  text: And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you after he dies.’
translation:
  language: pt
  text: 'E um dos espíritos de Beliar atuava comigo, dizendo: “Pegue a espada e, com ela, mate José; então seu pai amará você depois da morte dele.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “depois que ele morrer”, sem repetir o nome. Pelo contexto, a referência mais provável é José.
    reason: Esclarece uma ambiguidade pronominal real do texto grego sem resolvê-la silenciosamente no corpo da tradução.
lexical_decisions:
- source_word: ἐκ τῶν πνευμάτων τοῦ Βελίαρ
  choice: um dos espíritos de Beliar
  rationale: O grego emprega uma expressão partitiva, literalmente “dos espíritos de Beliar”; em português, “um dos” explicita naturalmente o elemento subentendido sem alterar o sentido.
- source_word: συνήργει μοι
  choice: atuava comigo
  rationale: Preserva a ideia de ação conjunta ou cooperação expressa por συνεργέω, evitando sugerir ajuda benéfica, o que seria inadequado neste contexto.
- source_word: Λαβὲ τὸ ξίφος καὶ ἐν τούτῳ ἄνελε
  choice: Pegue a espada e, com ela, mate
  rationale: “Com ela” retoma claramente “a espada” e reproduz o instrumental ἐν τούτῳ; “mate” comunica de modo direto o imperativo ἄνελε.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Mantém a forma do nome presente no texto grego, em vez de harmonizá-la silenciosamente com a forma bíblica mais conhecida “Belial”.
- source_word: ἀγαπήσει σε
  choice: amará você
  rationale: Expressa de maneira natural e direta o futuro do verbo “amar”, com leitura clara para o público brasileiro e compreensão ampla no português internacional.
theological_decisions:
- issue: Referente de ἀποθανόντος αὐτοῦ (“depois da morte dele”)
  choice: Manter o pronome sem nomear expressamente José
  alternative: “depois da morte de José”
  rationale: O contexto aponta fortemente para José, mas o grego usa apenas o pronome αὐτοῦ. A tradução conserva essa forma e a nota esclarece a referência contextual mais provável sem eliminar a ambiguidade gramatical.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. “Atuava comigo” evita tanto a rigidez de “cooperava” quanto uma conotação indevidamente positiva de ajuda. A fala mantém o caráter incisivo da ordem.
