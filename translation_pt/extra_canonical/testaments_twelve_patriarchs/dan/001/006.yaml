  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/006.yaml
  text: For the spirit of jealousy and arrogance kept saying to me, ‘You yourself also are his son.’
translation:
  language: pt
  text: 'Pois o espírito de ciúme e arrogância ficava me dizendo: “Você mesmo também é filho dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα
  choice: espírito
  rationale: Mantém o referente pessoal ou influente do grego sem reduzi-lo a mero sentimento.
- source_word: ζήλου
  choice: ciúme
  rationale: No contexto, expressa rivalidade ressentida; é mais natural e preciso aqui do que “zelo”.
- source_word: ἀλαζονείας
  choice: arrogância
  rationale: Reproduz a ideia de presunção ou orgulho pretensioso em linguagem corrente.
- source_word: ἔλεγέ μοι
  choice: ficava me dizendo
  rationale: O imperfeito indica fala repetida ou contínua.
- source_word: Καίγε σὺ αὐτὸς
  choice: Você também
  rationale: Transmite a inclusão enfática do interlocutor; em português, o pronome explícito já recebe destaque, e “também” preserva καίγε.
theological_decisions:
- issue: Natureza do “espírito”
  choice: Conservar “espírito” como no texto grego
  alternative: Parafrasear como “sentimento” ou “impulso”
  rationale: O grego permite entender uma entidade espiritual ou uma força personificada; a tradução não deve resolver essa ambiguidade.
- issue: Referente de “dele”
  choice: Manter o pronome sem explicitar o referente
  alternative: Substituir pelo nome do referente inferido do contexto
  rationale: O versículo grego usa αὐτοῦ, e a preservação do pronome evita acrescentar uma identificação ausente desta unidade textual.
translation_notes:
  register: Português moderno, natural e digno, com legibilidade brasileira. A colocação “ficava me dizendo” comunica com clareza o aspecto iterativo do imperfeito; a fala direta usa tratamento corrente sem perda do tom sério.
