base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/004.yaml
  text: So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.
translation:
  language: pt
  text: Por isso, hoje confesso a vocês, meus filhos, que, em meu coração, tomei uma decisão a respeito da morte de José, meu irmão, aquele homem bom e verdadeiro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: confesso
  rationale: Expressa de modo direto o reconhecimento aberto de uma culpa ou intenção passada, adequado ao contexto.
- source_word: ἐν καρδίᾳ μου ἐθέμην
  choice: em meu coração, tomei uma decisão
  rationale: Preserva a imagem semítica do coração como centro da intenção e traduz o aoristo médio de τίθημι de maneira natural, sem tornar explícito além do grego que Dan teria decidido pessoalmente matar José.
- source_word: περὶ τοῦ θανάτου Ἰωσήφ
  choice: a respeito da morte de José
  rationale: Mantém a formulação ampla de περί com genitivo e a ambiguidade quanto à forma exata de participação de Dan na morte pretendida.
- source_word: ἀγαθοῦ ... καὶ ἀληθινοῦ
  choice: bom e verdadeiro
  rationale: Reproduz os dois qualificativos de modo simples e digno; “verdadeiro” preserva o sentido mais direto de ἀληθινός sem reduzi-lo apenas a “honesto” ou “fiel”.
theological_decisions:
- issue: Grau de responsabilidade de Dan pela morte pretendida de José
  choice: tomei uma decisão a respeito da morte de José
  alternative: decidi matar José
  rationale: O texto associa a decisão interior de Dan à morte de José, mas não contém aqui um verbo explícito para “matar”. A tradução preserva essa tensão sem diminuir a gravidade da confissão nem especificar indevidamente o modo de sua participação.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A ordem foi ajustada apenas para fluência; a aposição final mantém o contraste moral entre a intenção de Dan e o caráter de José.
