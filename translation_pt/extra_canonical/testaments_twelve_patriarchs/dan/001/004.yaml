  source_fidelity: A tradução representa adequadamente Ὁμολογῶ οὖν como «Por isso, hoje confesso», preserva os destinatários («a vocês, meus filhos») e reproduz com sobriedade a decisão interior expressa por ἐν καρδίᾳ μου ἐθέμην. «Tomei uma decisão a respeito da morte de José» conserva a construção deliberadamente ampla de περὶ τοῦ θανάτου Ἰωσήφ, sem introduzir um verbo explícito como «matar». A aposição «José, meu irmão, aquele homem bom e verdadeiro» transmite todos os elementos qualificativos do grego.
