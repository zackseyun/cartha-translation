source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ¹⁸ ἐπείρασα ἐν καρδίᾳ μου¹⁹ καὶ²⁰ ἐν πάσῃ²¹ ζωῇ μου²², ὅτι καλὸν²³ *καὶ θεῷ εὐάρεστον ἡ ἀλήθεια²⁴ μετὰ δικαιοπραγίας²⁵ *καὶ ⸀ὅτι⸁ πονηρὸν τὸ ψεῦδος²⁶ καὶ ὁ θυμὸς²⁷ πᾶσαν κακίαν *ἐκδιδάσκοντα τὸν ἄνθρωπον²⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/003.yaml
  text: I have tested in my heart and in all my life that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.
translation:
  language: pt
  text: Aprendi, em meu coração e ao longo de toda a minha vida, que a verdade, acompanhada de uma conduta justa, é boa e agradável a Deus, e que a falsidade e a ira são más e ensinam ao ser humano toda maldade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείρασα
  choice: Comprovei
  rationale: Expressa uma conclusão adquirida por experiência e prova pessoal, sem sugerir apenas uma tentativa.
- source_word: ἐν πάσῃ ζωῇ μου
  choice: ao longo de toda a minha vida
  rationale: Forma natural em português para a extensão da experiência por toda a vida.
- source_word: ἡ ἀλήθεια μετὰ δικαιοπραγίας
  choice: a verdade, acompanhada de uma conduta justa
  rationale: Preserva a associação entre verdade e prática justa, deixando claro que δικαιοπραγία se refere ao agir correto.
- source_word: θεῷ εὐάρεστον
  choice: agradável a Deus
  rationale: Equivalente corrente e digno para aquilo que obtém a aprovação divina.
- source_word: τὸ ψεῦδος
  choice: a falsidade
  rationale: Mantém o substantivo abstrato e o contraste direto com ἀλήθεια, em vez de restringi-lo a uma mentira isolada.
- source_word: ὁ θυμός
  choice: a ira
  rationale: Representa a emoção intensa e irada indicada pelo termo no contexto.
- source_word: πᾶσαν κακίαν
  choice: toda espécie de maldade
  rationale: Português idiomático que preserva a abrangência de πᾶσαν sem implicar necessariamente cada ato mau individual.
- source_word: ἐκδιδάσκοντα τὸν ἄνθρωπον
  choice: ensinam ao ser humano
  rationale: Preserva a imagem de falsidade e ira como instrutoras do mal; o plural concorda naturalmente com os dois sujeitos coordenados.
theological_decisions:
- issue: Relação entre verdade e conduta justa
  choice: A verdade é apresentada acompanhada de conduta justa.
  alternative: Entender δικαιοπραγίας como qualidade da própria verdade ou traduzir a expressão como “verdade com justiça”.
  rationale: A formulação mantém a construção μετὰ e não reduz verdade nem justiça uma à outra.
- issue: Agência da falsidade e da ira
  choice: Ambas são más e ensinam toda espécie de maldade.
  alternative: Fazer apenas da ira o sujeito de “ensina”, seguindo uma concordância estritamente próxima.
  rationale: O particípio plural ἐκδιδάσκοντα retoma naturalmente os dois substantivos coordenados, embora a sintaxe grega apresente variação de gênero.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Evitou-se linguagem excessivamente literal em “em toda a minha vida”, vertida de modo temporal natural. Não são necessários marcadores de nota.
