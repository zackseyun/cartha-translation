    rationale: Em português, “comprovar” normalmente ressalta demonstrar ou provar a veracidade de algo; o aoristo de πειράζω aqui aponta para uma constatação ou aprendizagem pessoal mediante experiência.
  - severity: low
    issue: “Toda espécie de maldade” para πᾶσαν κακίαν
    rationale: A expressão é idiomática, mas “espécie” acrescenta a noção de categorias. “Toda maldade” mantém mais diretamente a abrangência do grego.
