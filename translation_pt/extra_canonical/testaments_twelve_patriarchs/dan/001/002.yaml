  text: Hear my words, sons of Dan, and pay attention to the words of your father.
translation:
  language: pt
  text: 'Pois, tendo convocado sua família, ele disse: “Escutem minhas palavras, filhos de Dã, e prestem atenção às palavras do pai de vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καλέσας
  choice: depois de reunir
  rationale: No contexto, o particípio indica que Dã convocou seus familiares para ouvi-lo; “reunir” expressa naturalmente em português o ato de chamá-los para junto de si.
- source_word: τὴν πατρίαν αὐτοῦ
  choice: sua família
  rationale: πατριά pode designar família, linhagem ou clã. “Sua família” é a opção mais natural e adequada ao grupo familiar imediato mencionado no discurso.
- source_word: Ἀκούσατε
  choice: Escutem
  rationale: Imperativo plural dirigido aos filhos de Dã; “escutem” conserva o chamado direto à audição atenta.
- source_word: λόγων μου
  choice: minhas palavras
  rationale: Tradução direta e corrente de λόγων μου.
- source_word: προσέχετε
  choice: prestem atenção
  rationale: Expressa com naturalidade o imperativo de atenção cuidadosa.
- source_word: ῥήμασι τοῦ πατρὸς ὑμῶν
  choice: às palavras do pai de vocês
  rationale: Mantém a referência coletiva ao pai dos ouvintes e evita a possível ambiguidade do possessivo português “seu”.
