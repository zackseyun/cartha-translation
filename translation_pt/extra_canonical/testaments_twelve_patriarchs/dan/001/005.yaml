  text: And I rejoiced over his being sold, because his father loved him more than us.
translation:
  language: pt
  text: E eu me alegrei por ele ter sido vendido, porque nosso pai o amava mais do que a nós.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχαιρον
  choice: me alegrei
  rationale: Expressa de modo natural e direto a alegria do narrador no passado.
- source_word: ἐπὶ τῇ πράσει αὐτοῦ
  choice: por ele ter sido vendido
  rationale: Neste contexto, πρᾶσις indica a venda de José; a construção verbal é mais natural em português do que o substantivo abstrato “venda”.
- source_word: ὑπὲρ ἡμᾶς
  choice: mais do que a nós
  rationale: Traduz o valor comparativo de ὑπέρ com clareza, preservando “nós” como objeto do amor paterno.
- source_word: ὁ πατὴρ αὐτὸν ἠγάπα
  choice: nosso pai o amava
  rationale: Embora o grego diga literalmente “o pai”, o referente é o pai comum do narrador e de seus irmãos; “nosso pai” evita em português a leitura equivocada de que se trata apenas do pai de José.
