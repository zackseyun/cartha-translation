  text: Testament of Dan, the seventh son of Jacob and Bilhah. A copy of the words of Dan, which he spoke to his sons in the last days of his life, in the 125th year of his life.
translation:
  language: pt
  text: 'Testamento de Dã, o sétimo filho de Jacó e Bila.


    1 Cópia das palavras de Dã, que ele disse a seus filhos nos últimos dias de sua vida, no centésimo vigésimo quinto ano de sua vida.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testamento
  rationale: No título da obra, designa as palavras finais e disposições atribuídas ao patriarca; “Testamento” preserva o gênero literário tradicional e é natural em português.
- source_word: Ἀντίγραφον
  choice: Cópia
  rationale: Equivalente direto para uma transcrição ou reprodução escrita, sem acrescentar a ideia de resumo.
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν αὐτοῦ
  choice: nos últimos dias de sua vida
  rationale: Expressa naturalmente em português que se trata do período final da vida de Dã, conforme o referente contextual de “seus dias”.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: no centésimo vigésimo quinto ano de sua vida
  rationale: Mantém a forma ordinal e a construção temporal explícitas do grego.
- source_word: Βάλλας
  choice: Bila
  rationale: Emprega a forma portuguesa bíblica amplamente reconhecida para o nome da mãe de Dã.
