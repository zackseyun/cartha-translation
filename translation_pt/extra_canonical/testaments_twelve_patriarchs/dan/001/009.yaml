revisions:
- from: Mas o Deus de meus pais não permitiu que ele caísse em minhas mãos, para que eu não o encontrasse sozinho, o matasse e fizesse com que um segundo cetro fosse desligado de Israel.[a]
  to: Mas o Deus de meus pais não permitiu que ele caísse em minhas mãos, para que eu, encontrando-o sozinho, o matasse e fizesse com que um segundo cetro fosse desfeito em Israel.[a]
  rationale: A revisão remove a negação acrescentada à oração de finalidade/resultado, preservando a formulação difícil do grego, e evita traduzir o dativo τῷ Ἰσραήλ como uma separação explicitamente “de Israel”. A nota continua a alertar o leitor para a dificuldade textual e semântica sem adotar variantes ou interpretações confessionais.
