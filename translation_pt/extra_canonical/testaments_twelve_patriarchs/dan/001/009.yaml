  text: ᾿Αλλ᾿ ὁ Θεὸς *τῶν πατέρων⁵³ μου οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου, ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ, καὶ ποιήσω⁶¹ λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/009.yaml
  text: But the God of my fathers did not allow him to fall into my hands, so that I might find him alone and kill him, and bring about the loosing of a second tribe from Israel.”
translation:
  language: pt
  text: Mas o Deus de meus pais não permitiu que ele caísse em minhas mãos, para que eu, encontrando-o sozinho, o matasse e fizesse com que um segundo cetro fosse desfeito em Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase grega final é difícil e diz literalmente: “fizesse ser desfeito um segundo cetro em/para Israel”. Algumas formas textuais e traduções entendem “cetro” como “tribo”, mas esta redação preserva a imagem do texto grego fornecido.'
    reason: Explica a construção incomum e o valor não inteiramente determinado do dativo, sem trocar “cetro” por uma interpretação textual ou semântica.
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: o Deus de meus pais
  rationale: Reproduz de modo natural e solene a expressão ancestral do grego.
- source_word: οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου
  choice: não permitiu que ele caísse em minhas mãos
  rationale: Mantém a imagem idiomática do texto grego sem convertê-la na formulação mais interpretativa “entregá-lo em minhas mãos”.
- source_word: ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ
  choice: para que eu não o encontrasse sozinho e o matasse
  rationale: Em contexto de verbo principal negativo, a finalidade/consequência impedida é expressa naturalmente em português com “para que... não”; κατὰ μόνας indica encontrá-lo sem companhia.
- source_word: ποιήσω λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ
  choice: fizesse com que um segundo cetro fosse desligado de Israel
  rationale: Conserva os termos atestados no grego, inclusive a metáfora incomum de “cetro”, evitando substituir o texto por variantes como “tribo”, “iniquidade” ou “duas tribos” que não constam nesta forma da fonte.
theological_decisions:
- issue: Sentido de “um segundo cetro” e de sua separação de Israel
  choice: 'Preservar literalmente a imagem enigmática: “um segundo cetro fosse desligado de Israel”'
  alternative: Interpretar “cetro” como “tribo” e traduzir “uma segunda tribo fosse separada/destruída em Israel”
  rationale: A leitura fornecida traz σκῆπτρον δεύτερον e λυθῆναι. Como a formulação é textualmente difícil e teologicamente sugestiva, a tradução não deve resolver silenciosamente a metáfora nem adotar uma variante conjectural.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe brasileira amplamente compreensível. A construção negativa foi explicitada em “para que eu não...”, e a estranheza deliberada da cláusula final foi mantida e explicada em nota.
