    rationale: 'A coordenação por “nem” após “não se guardarem” pode ser entendida como uma condição em que ambas as falhas precisam ocorrer. “A menos que se guardem ... e amem ...” exprime de forma mais precisa a advertência: a preservação requer os dois elementos coordenados no grego.'
  revised_text: 'E agora, meus filhos, eis que estou morrendo. Em verdade lhes digo: a menos que se guardem do espírito da falsidade e da ira, e amem a verdade e a paciência, perecerão.'
