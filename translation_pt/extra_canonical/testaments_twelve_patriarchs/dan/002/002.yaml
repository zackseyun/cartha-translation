source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/002.yaml
  text: 'Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing.'
translation:
  language: pt
  text: 'E agora, meus filhos, eis que estou morrendo. Em verdade lhes digo: a menos que se guardem do espírito da falsidade e da ira, e amem a verdade e a paciência, perecerão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Reproduz de modo natural e digno o tratamento familiar do texto grego.
- source_word: φυλάξητε ἑαυτούς
  choice: se guardarem
  rationale: Preserva a ideia reflexiva de vigiar e proteger a si mesmos contra uma influência nociva.
- source_word: τοῦ πνεύματος τοῦ ψεύδους
  choice: do espírito da falsidade
  rationale: Mantém a formulação do grego e sua possível amplitude, sem reduzir πνεῦμα a mera atitude ou disposição.
- source_word: τοῦ θυμοῦ
  choice: da ira
  rationale: Expressa a cólera intensa sugerida por θυμός, em registro claro e compatível com o contexto moral.
- source_word: τὴν μακροθυμίαν
  choice: a paciência
  rationale: Neste contraste com a ira, designa a disposição paciente e tardia em irar-se; 'paciência' é clara e natural em português.
- source_word: ἀπολεῖσθε
  choice: perecerão
  rationale: Conserva a força grave do futuro verbal sem especificar uma modalidade de perdição que o texto não explicita.
theological_decisions:
- issue: Estrutura da condição negativa
  choice: “se vocês não se guardarem... nem amarem...”
  alternative: “se vocês não se guardarem... e amarem...”
  rationale: O grego coordena os dois verbos dentro da condição introduzida por ἐὰν μή. Em português, 'nem' deixa claro que a advertência exige tanto evitar a falsidade e a ira quanto amar a verdade e a paciência.
- issue: Natureza do “espírito da falsidade”
  choice: Preservar literalmente “espírito”
  alternative: Traduzir como “atitude”, “inclinação” ou “influência” da falsidade
  rationale: O texto pode admitir dimensão pessoal, espiritual ou disposicional; a tradução mantém essa ambiguidade em vez de resolvê-la doutrinariamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” foi mantido para refletir ἰδού e o tom testamentário solene, enquanto “vocês” evita construções excessivamente arcaicas.
