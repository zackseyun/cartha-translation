revisions:
- from: 'E agora, meus filhos, vejam: estou morrendo. Em verdade lhes digo que, se vocês não se guardarem do espírito da falsidade e da ira, e não amarem a verdade e a paciência, perecerão.'
  to: E agora, meus filhos, eis que estou morrendo. Em verdade lhes digo que, se vocês não se guardarem do espírito da falsidade e da ira, e amarem a verdade e a paciência, perecerão.
  rationale: A revisão remove a negação sem apoio no grego antes de «amarem» e substitui «vejam» por «eis que». Mantém-se a estrutura potencialmente difícil do condicional, pois o fragmento grego fornecido a apresenta assim; não se deve regularizá-la por conjectura.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:17:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'A redação proposta altera a sintaxe condicional grega ao acrescentar uma negação antes de «amarem». O texto fornecido traz ἐὰν μὴ φυλάξητε ... καὶ ἀγαπήσητε: «se não se guardarem ... e amarem», sem δεύτερο μὴ. Embora a construção resulte em uma condição que pode parecer incomum, a tradução deve conservar o texto-fonte disponível.'
  naturalness: A formulação é clara e de registro apropriado. «Eis que» comunica melhor o valor de ἰδού no anúncio solene da morte do que o imperativo coloquial «vejam».
  terminology: «Espírito da falsidade e da ira», «verdade», «paciência» e «perecerão» são escolhas adequadas. «Paciência» é uma equivalência moderna aceitável para μακροθυμία, sem impor uma leitura doutrinária.
  issues:
  - severity: high
    issue: Negação indevidamente acrescentada em «e não amarem a verdade e a paciência».
    rationale: O grego tem uma única negação (μὴ), ligada a φυλάξητε («se guardarem»), seguida de καὶ ἀγαπήσητε («e amarem»). A segunda negação não consta do fragmento-fonte e muda a relação condicional.
  - severity: low
    issue: «Vejam» é menos próximo do marcador discursivo ἰδού.
    rationale: Ἰδού introduz uma chamada de atenção, não exige um imperativo visual dirigido aos filhos. «Eis que» preserva melhor essa função em registro solene.
  revised_text: E agora, meus filhos, eis que estou morrendo. Em verdade lhes digo que, se vocês não se guardarem do espírito da falsidade e da ira, e amarem a verdade e a paciência, perecerão.
  revised_footnotes: []
  revision_rationale: A revisão remove a negação sem apoio no grego antes de «amarem» e substitui «vejam» por «eis que». Mantém-se a estrutura potencialmente difícil do condicional, pois o fragmento grego fornecido a apresenta assim; não se deve regularizá-la por conjectura.
