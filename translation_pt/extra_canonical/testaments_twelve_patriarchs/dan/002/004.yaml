base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/004.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry.
translation:
  language: pt
  text: E agora, meus filhos, eis que estou morrendo. Em verdade lhes digo que, se vocês não se guardarem do espírito da falsidade e da ira, e amarem a verdade e a paciência, perecerão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: vejam
  rationale: Preserva a força de chamada de atenção da expressão grega em linguagem portuguesa atual.
- source_word: φυλάξητε ἑαυτούς
  choice: se guardarem
  rationale: Reproduz o sentido reflexivo de manter-se protegido ou vigilante contra uma influência.
- source_word: τοῦ πνεύματος τοῦ ψεύδους
  choice: do espírito da falsidade
  rationale: Mantém a formulação concreta e teologicamente aberta do grego, sem reduzi-la apenas a um comportamento mentiroso.
- source_word: τοῦ θυμοῦ
  choice: da ira
  rationale: Traduz o estado intenso de cólera indicado por θυμός e preserva sua coordenação com a expressão anterior.
- source_word: μακροθυμίαν
  choice: paciência
  rationale: Expressa em linguagem comum a perseverança paciente e a demora em irar-se associadas ao termo.
- source_word: ἀπολεῖσθε
  choice: perecerão
  rationale: Conserva a gravidade do futuro verbal sem especificar indevidamente a natureza da perdição.
theological_decisions:
- issue: Relação entre o espírito da falsidade e a ira
  choice: “do espírito da falsidade e da ira”
  alternative: “do espírito de falsidade e de ira”
  rationale: A repetição dos artigos gregos distingue “o espírito da falsidade” de “a ira”; a redação escolhida mantém essa estrutura sem transformar necessariamente a ira em um segundo espírito.
- issue: Natureza do perecimento
  choice: “perecerão” sem explicação adicional
  alternative: “serão destruídos” ou “se perderão eternamente”
  rationale: O verbo grego é forte, mas o contexto fornecido não define se a consequência é física, moral ou escatológica; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de boa legibilidade brasileira. A tradução segue o fragmento grego fornecido, que não corresponde ao texto inglês de consulta; por isso, prioriza integralmente a evidência original.
