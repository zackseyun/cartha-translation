review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o vocativo, a declaração de morte, a afirmação solene, o alerta contra o espírito da mentira e da ira, e o desfecho "perecerão". Contudo, "se ... não ... nem amarem" faz a negação incidir explicitamente também sobre "amarem", enquanto o grego coordena φυλάξητε e ἀγαπήσητε sob ἐὰν μή. Em português, "a menos que ... e ..." reproduz de modo mais seguro a construção condicional e o sentido de exigência conjunta.
  naturalness: O texto é claro, solene e natural para português moderno. "Digam-lhes a verdade" é mais idiomático e diretamente correspondente a ἐν ἀληθείᾳ λέγω ὑμῖν do que "Em verdade lhes digo". A formulação com "a menos que" mantém a fluência sem perder o registro.
  terminology: '"Espírito da mentira", "ira", "verdade", "paciência" e "perecerão" são escolhas adequadas. "Paciência" transmite de forma acessível μακροθυμία, sem impor uma leitura teológica adicional.'
  issues:
  - severity: medium
    issue: Escopo da negação em "nem amarem"
    rationale: O texto grego traz ἐὰν μὴ φυλάξητε ... καὶ ἀγαπήσητε. Embora a construção seja sintaticamente condensada, a tradução deve preservar a exigência de guardar-se dos vícios e amar as virtudes; "nem amarem" reformula a coordenação como dupla ausência. "A menos que se guardem ... e amem" é mais fiel e inequívoco em português.
  - severity: low
    issue: Formulação de ἐν ἀληθείᾳ λέγω ὑμῖν
    rationale: '"Digo-lhes a verdade" expressa mais diretamente a locução grega e é uma formulação corrente, mantendo a solenidade.'
  revised_text: 'E agora, meus filhos, eis que estou morrendo, e digo-lhes a verdade: a menos que se guardem do espírito da mentira e da ira, e amem a verdade e a paciência, perecerão.'
