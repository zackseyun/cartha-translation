source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/005.yaml
  text: If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.
translation:
  language: pt
  text: 'E agora, meus filhos, eis que estou morrendo, e digo-lhes a verdade: a menos que se guardem do espírito da mentira e da ira, e amem a verdade e a paciência, perecerão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: eis que
  rationale: Preserva a chamada enfática à atenção em um registro digno e ainda corrente na linguagem bíblica portuguesa.
- source_word: φυλάξητε ἑαυτούς
  choice: se guardarem
  rationale: Reproduz a construção reflexiva e a ideia de manter-se vigilante e afastado de uma influência nociva.
- source_word: τοῦ πνεύματος τοῦ ψεύδους
  choice: do espírito da mentira
  rationale: Mantém literalmente tanto πνεῦμα como o genitivo, sem decidir se se trata de um ser pessoal, uma disposição ou uma influência.
- source_word: θυμοῦ
  choice: ira
  rationale: Expressa a cólera intensa sugerida por θυμός e combina naturalmente com a formulação solene da advertência.
- source_word: μακροθυμίαν
  choice: paciência
  rationale: É uma equivalência natural e amplamente compreensível para a disposição perseverante e tardia em irar-se; evita a forma menos corrente “longanimidade”.
- source_word: ἀπολεῖσθε
  choice: perecerão
  rationale: Conserva a força grave e potencialmente ampla do verbo, sem restringir a referência à morte física ou à ruína espiritual.
theological_decisions:
- issue: Natureza do “espírito da mentira”
  choice: Mantida a expressão “espírito da mentira” sem explicação interpretativa.
  alternative: “inclinação para a mentira” ou “espírito mentiroso”
  rationale: O grego permite tensão entre uma realidade pessoal e uma influência ou disposição; a tradução não resolve essa ambiguidade.
- issue: Alcance de ἀπολεῖσθε
  choice: “perecerão”
  alternative: “serão destruídos” ou “se perderão”
  rationale: “Perecerão” preserva a advertência escatológica ou existencial possível sem determinar a modalidade da perdição.
- issue: Escopo da negação μή
  choice: “se não se guardarem... nem amarem...”
  alternative: “se não se guardarem... e amarem...”
  rationale: A estrutura condicional apresenta conjuntamente guardar-se dos vícios e amar as virtudes como condições cuja ausência leva ao resultado anunciado; “nem” explicita em português o escopo natural da negação sem alterar o contraste.
translation_notes:
  register: Português moderno, solene e acessível, com “vocês” e formas verbais de terceira pessoa para ampla legibilidade brasileira. A abertura “eis que” conserva a força retórica do original. A frase foi dividida após “estou morrendo” para maior clareza, sem mudar sua progressão lógica.
