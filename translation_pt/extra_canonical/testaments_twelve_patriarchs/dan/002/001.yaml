revisions:
- from: 'E agora[a], meus filhos, eis que estou morrendo; e lhes digo com toda a verdade: se vocês não se guardarem do espírito da falsidade e da ira, e não amarem a verdade e a paciência, perecerão. Pois a ira é cegueira e não permite que a pessoa veja com verdade o rosto de ninguém. Ainda que seja o pai ou a mãe, ela os trata como inimigos; ainda que seja um irmão, não o reconhece; ainda que seja um profeta do Senhor, desobedece a ele; ainda que seja um justo, não lhe dá atenção; ainda que seja um amigo, não o admite como tal. Pois o espírito da ira o envolve nas redes do engano, cega seus olhos e, por meio da falsidade, obscurece sua mente e lhe dá uma maneira própria de ver. E com que ele envolve seus olhos? Com o ódio do coração, para que tenha inveja de seu irmão.'
  to: 'E agora[a], meus filhos, eis que estou morrendo; e lhes digo em verdade: a menos que se guardem do espírito da falsidade e da ira e amem a verdade e a paciência, vocês perecerão. Pois a ira é cegueira e não permite que a pessoa veja com verdade o rosto de ninguém. Ainda que seja o pai ou a mãe, ela os trata como inimigos; ainda que seja um irmão, não o reconhece; ainda que seja um profeta do Senhor, desobedece a ele; ainda que seja um justo, não lhe dá atenção; ainda que seja um amigo, não o admite como tal. Pois o espírito da ira o envolve nas redes do engano, cega seus olhos e, por meio da falsidade, obscurece sua mente e lhe dá sua própria visão. E com que ele envolve seus olhos? Com o ódio do coração, para que tenha inveja de seu irmão.'
  rationale: A revisão corrige a lógica da condição negativa no grego, substituindo-a por “a menos que ... se guardem ... e amem”. Também ajusta a nota da âncora a e torna mais direta a expressão final sobre a visão dada pelo espírito da ira. Não foram alterados os termos teológicos nem especificado o sentido de “perecerão”.
