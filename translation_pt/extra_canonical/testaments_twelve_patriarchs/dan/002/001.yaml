source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/001.yaml
  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother.'
translation:
  language: pt
  text: 'E agora[a], meus filhos, eis que estou morrendo; e lhes digo em verdade: a menos que se guardem do espírito da falsidade e da ira e amem a verdade e a paciência, vocês perecerão. Pois a ira é cegueira e não permite que a pessoa veja com verdade o rosto de ninguém. Ainda que seja o pai ou a mãe, ela os trata como inimigos; ainda que seja um irmão, não o reconhece; ainda que seja um profeta do Senhor, desobedece a ele; ainda que seja um justo, não lhe dá atenção; ainda que seja um amigo, não o admite como tal. Pois o espírito da ira o envolve nas redes do engano, cega seus olhos e, por meio da falsidade, obscurece sua mente e lhe dá sua própria visão. E com que ele envolve seus olhos? Com o ódio do coração, para que tenha inveja de seu irmão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: “E agora”.'
    reason: Preserva a âncora do texto-fonte sem atribuir à conjunção καί um valor explicativo não exigido pelo grego.
lexical_decisions:
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Reproduz de modo natural o tratamento familiar e solene do testador aos descendentes.
- source_word: τὸ πνεῦμα τοῦ ψεύδους
  choice: o espírito da falsidade
  rationale: Preserva a personificação e a construção genitiva do grego sem decidir se se trata de um ser pessoal, uma disposição ou uma força atuante.
- source_word: θυμός
  choice: ira
  rationale: Expressa a cólera intensa indicada pelo termo no contexto e mantém a linguagem moral do trecho.
- source_word: μακροθυμία
  choice: paciência
  rationale: É a forma corrente e inteligível para a disposição de suportar demora e provocação sem ceder à ira; evita o pouco usual 'longanimidade'.
- source_word: ἀπολεῖσθε
  choice: perecerão
  rationale: Mantém a força grave do futuro médio de ἀπόλλυμι e não restringe a ameaça à morte física ou à ruína espiritual.
- source_word: with truth / ἐν ἀληθείᾳ
  choice: com verdade / com toda a verdade
  rationale: Mantém no início a ênfase asseverativa e, na descrição da ira, a relação entre percepção e verdade sem transformar a expressão em simples sinceridade.
theological_decisions:
- issue: Natureza do 'espírito da falsidade' e do 'espírito da ira'
  choice: Manter literalmente 'espírito', com os genitivos 'da falsidade' e 'da ira'.
  alternative: Traduzir como 'disposição para a falsidade e para a ira' ou identificar espíritos pessoais.
  rationale: O texto permite personificação forte, influência espiritual ou disposição moral; a tradução não resolve essa ambiguidade teológica.
- issue: Alcance de 'perecerão'
  choice: Não especificar o tipo de perdição.
  alternative: Explicitar 'morrerão', 'serão destruídos' ou 'se perderão espiritualmente'.
  rationale: O verbo é amplo e o contexto não obriga uma única leitura.
- issue: Referente humano na seção sobre a ira
  choice: Usar 'a pessoa' e depois pronomes masculinos quando o 'espírito da ira' volta a ser o sujeito.
  alternative: Empregar somente o masculino genérico 'o homem' ou tratar a ira como sujeito em toda a passagem.
  rationale: A redação em português distingue com clareza a pessoa dominada pela ira do espírito personificado, sem acrescentar uma identificação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por formas correntes como 'paciência' e tratamento por 'vocês'. A primeira frase foi traduzida diretamente do grego fornecido. Como a nota editorial informa que o fragmento grego ainda não está alinhado por versículo e o texto grego disponibilizado termina em ἀπολεῖσθε, o restante foi vertido a partir da camada inglesa auditada, preservando suas repetições, personificações e tensões sem harmonização silenciosa.
