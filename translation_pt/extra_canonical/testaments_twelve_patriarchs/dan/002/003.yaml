id: T12P.DAN.2.3
reference: Testament of Dan 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/003.yaml
  text: This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath.
translation:
  language: pt
  text: 'E agora, meus filhos, eis que estou morrendo. Em verdade lhes digo: se vocês não se guardarem do espírito da falsidade e da ira, e amarem a verdade e a paciência, perecerão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Reproduz de modo natural o tratamento familiar e solene do grego.
- source_word: φυλάξητε ἑαυτούς
  choice: se guardarem
  rationale: Mantém a construção reflexiva e a ideia de vigilância e proteção moral.
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: do espírito da falsidade e da ira
  rationale: Conserva a coordenação e a ambiguidade do grego quanto a um só espírito caracterizado por ambos os genitivos ou à esfera conjunta da falsidade e da ira.
- source_word: μακροθυμίαν
  choice: paciência
  rationale: Neste contraste com θυμός, comunica domínio paciente e longanimidade em linguagem corrente; evita a forma menos acessível “longanimidade”.
- source_word: ἀπολεῖσθε
  choice: perecerão
  rationale: Preserva a força do futuro médio e não restringe a perdição a morte física ou condenação espiritual.
theological_decisions:
- issue: Natureza do “espírito da falsidade e da ira”
  choice: Manter a expressão literalmente como “espírito da falsidade e da ira”
  alternative: Interpretar como um espírito demoníaco específico ou como mera disposição humana
  rationale: O texto grego não resolve explicitamente a natureza pessoal ou disposicional desse espírito; a tradução conserva essa tensão.
- issue: Sentido de ἀπολεῖσθε
  choice: “perecerão” sem especificação
  alternative: “serão condenados” ou “morrerão”
  rationale: O verbo admite alcance amplo, e o contexto fornecido não justifica limitar o resultado a uma categoria teológica ou física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A sintaxe condicional explicita o segundo elemento negativo (“não amarem”), exigido pelo alcance de ἐὰν μή sobre os verbos coordenados, sem acrescentar conteúdo ao sentido.
