  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits. Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy. Because of this the enemy is eager to trip up all who call on the Lord. For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end. For the very angel of peace will strengthen Israel, so that he may not fall into the uttermost evil. But in the time of the lawlessness of Israel, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[b]. And his name will be in every place in Israel and among the nations. Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience. And what you have heard from your father, pass on also to your
    children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord.[c] Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever.
translation:
  language: pt
  text: '**Testamento de Dã 6**


    1 E agora, meus filhos, temam o Senhor e guardem-se de Satanás e de seus espíritos. 2 Aproximem-se de Deus e do anjo que intercede por vocês, pois ele é mediador entre Deus e os seres humanos.[a] Pela paz de Israel, ele se levantará diante do reino de Deus.[b] 3 Por isso, o inimigo se empenha em fazer tropeçar todos os que invocam o Senhor. 4 Pois ele sabe que, no dia em que Israel se voltar, o reino do inimigo chegará ao fim. 5 O próprio anjo da paz fortalecerá Israel, para que ele não caia no extremo dos males. 6 Mas, no tempo da transgressão da lei por Israel, o Senhor não se afastará deles e passará para uma nação que busca a sua vontade, pois nenhum dos anjos será igual a ele.[c] 7 E o nome dele estará em todos os lugares de Israel e entre as nações.


    8 Portanto, meus filhos, guardem-se de toda obra má. Lancem para longe de vocês a ira e a falsidade, e amem a verdade e a paciência. 9 E aquilo que ouviram de seu pai, transmitam também a seus filhos, [para que o Salvador das nações os receba; pois ele é verdadeiro e paciente, manso e humilde, e, por meio de suas obras, ensina a lei do Senhor].[d] 10 Afastem-se, portanto, de toda injustiça e apeguem-se à justiça de Deus; assim, a descendência de vocês será para salvação para sempre. 11 E sepultem-me perto de meus pais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “mediador entre Deus e os seres humanos” traduz diretamente o grego. Como a passagem continua chamando essa figura de “anjo”, sua identidade não é definida além do que o próprio texto afirma.
    reason: lexical_alternative
  - marker: b
    text: O grego fornecido diz “diante do reino de Deus”, embora “Deus” esteja marcado no texto crítico como problemático. Algumas reconstruções entendem “contra o reino do inimigo”, leitura favorecida pelo conflito descrito nas frases seguintes.
    reason: alternative_reading
  - marker: c
    text: 'A linha grega é difícil: conforme apresentada, afirma que o Senhor “não se afastará deles” e, ao mesmo tempo, que “passará para uma nação que busca a sua vontade”. A tradução conserva essa tensão em vez de harmonizá-la.'
    reason: alternative_reading
  - marker: d
    text: A oração entre colchetes é muitas vezes considerada uma expansão ou interpolação posterior. Ela foi traduzida porque consta do testemunho grego fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: φοβήθητε τὸν Κύριον
  choice: temam o Senhor
  rationale: Conserva a força exortativa e moral do imperativo; “reverenciem” seria possível, mas suavizaria a advertência.
- source_word: προσέχετε ἑαυτοῖς
  choice: guardem-se
  rationale: Expressa em português corrente a vigilância reflexiva exigida pelo contexto.
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: de seus espíritos
  rationale: Mantém a relação genitiva com Satanás sem acrescentar uma função não explicitada, como “espíritos auxiliares”.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: do anjo que intercede por vocês
  rationale: O sentido intercessório é favorecido pela explicação seguinte, que chama o anjo de mediador.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: mediador entre Deus e os seres humanos
  rationale: “Mediador” preserva o termo teológico do grego, enquanto “seres humanos” comunica o valor genérico de ἀνθρώπων.
- source_word: κατέναντι τῆς βασιλείας τοῦ θεοῦ στήσεται
  choice: se levantará diante do reino de Deus
  rationale: Traduz o texto grego apresentado sem substituir “Deus” por “inimigo”; κατέναντι pode indicar posição diante de algo, sem exigir sentido hostil.
- source_word: ὑποσκελίζειν
  choice: fazer tropeçar
  rationale: Preserva a imagem concreta de provocar uma queda e seu valor moral no contexto.
- source_word: ἐπιστρέψει
  choice: se voltar
  rationale: Mantém a ideia de retorno de Israel sem converter o verbo em um termo técnico como “arrepender-se”.
- source_word: συντελεσθήσεται
  choice: chegará ao fim
  rationale: No contexto do reino inimigo, o verbo aponta para sua terminação.
- source_word: εἰς τέλος κακῶν
  choice: no extremo dos males
  rationale: Preserva a expressão severa e algo aberta do grego, que pode sugerir a plena extensão ou o desfecho dos males.
- source_word: ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: que busca a sua vontade
  rationale: Reproduz ζητοῦντι com precisão, sem alterá-lo para “cumpre” ou “faz”.
- source_word: κολλήθητε τῇ δικαιοσύνῃ
  choice: apeguem-se à justiça
  rationale: Transmite a ideia forte de adesão expressa pelo verbo, em linguagem natural.
- source_word: θάψατέ με ἐγγὺς τῶν πατέρων μου
  choice: sepultem-me perto de meus pais
  rationale: Inclui a ordem final presente no grego; “pais” conserva o modo ancestral de referência, sem restringi-lo ao pai imediato.
theological_decisions:
- issue: Identidade do anjo intercessor chamado mediador entre Deus e os seres humanos
  choice: Mantê-lo como anjo intercessor e mediador, nos termos próprios da passagem.
  alternative: Identificá-lo como anjo patrono de Israel, figura messiânica ou referência cristológica posterior.
  rationale: O texto chama a figura explicitamente de anjo e mediador. A tradução não resolve essa combinação por meio de uma identificação doutrinária posterior.
- issue: Reino diante do qual o anjo se levantará no versículo 2
  choice: Traduzir o texto fornecido como “diante do reino de Deus”.
  alternative: Adotar a correção contextual “contra o reino do inimigo”.
  rationale: O grego apresentado traz θεοῦ, embora marcado como problemático. A opção no texto principal conserva essa leitura e registra a dificuldade em nota.
- issue: O Senhor permanece com Israel e passa para outra nação no versículo 6
  choice: 'Preservar as duas afirmações: ele não se afastará deles e passará para uma nação que busca sua vontade.'
  alternative: Suprimir a negação e dizer que o Senhor se afastará de Israel, ou atribuir o segundo verbo a outra figura implícita.
  rationale: A linha grega é difícil e tensa. A tradução evita harmonizá-la silenciosamente.
- issue: Trecho sobre o Salvador das nações no versículo 9
  choice: Incluí-lo entre colchetes.
  alternative: Omiti-lo como interpolação ou imprimi-lo sem qualquer sinalização.
  rationale: O trecho faz parte do testemunho grego fornecido, mas está delimitado como material textualmente suspeito; os colchetes tornam essa situação visível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros e internacionais. Mantiveram-se a cadência testamentária, as repetições teológicas e as ambiguidades reais. A numeração dos versículos foi acrescentada para referência. O versículo 11, ausente da camada inglesa de consulta, foi traduzido diretamente do grego.
