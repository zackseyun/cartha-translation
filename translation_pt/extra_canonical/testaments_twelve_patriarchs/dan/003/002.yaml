source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Τύφλωσις *γάρ ἐστιν ὁ θυμὸς καὶ οὐκ ἐᾷ ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/002.yaml
  text: For anger is blindness, and it does not allow one to see anyone’s face in truth.
translation:
  language: pt
  text: Pois a ira é cegueira e não permite ver verdadeiramente o rosto de ninguém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ver o rosto de alguém na verdade”.'
    reason: A expressão grega ἐν ἀληθείᾳ pode ser entendida adverbialmente (“verdadeiramente”) ou conservada de forma mais literal (“na verdade”).
lexical_decisions:
- source_word: θυμός
  choice: ira
  rationale: Neste contexto, designa a paixão da cólera; “ira” preserva a força moral e o registro sentencioso do grego.
- source_word: τύφλωσις
  choice: cegueira
  rationale: Equivalente direto e natural para a condição figurada causada pela ira.
- source_word: ἐν ἀληθείᾳ
  choice: verdadeiramente
  rationale: Expressa de modo idiomático o sentido adverbial de ver alguém conforme a verdade, sem decidir além do que o grego especifica.
theological_decisions:
- issue: Natureza da afirmação sobre a ira
  choice: Manter a metáfora absoluta “a ira é cegueira”
  alternative: “A ira causa cegueira”
  rationale: O grego emprega uma construção nominal direta; preservar a metáfora mantém sua força ética sem transformá-la numa explicação causal.
translation_notes:
  register: Português moderno, claro e digno. “Pois” representa γάρ; a coordenação com “e” preserva καί. A formulação mantém a imagem concreta do “rosto”, embora em português ela seja menos idiomática que simplesmente “ver alguém”.
