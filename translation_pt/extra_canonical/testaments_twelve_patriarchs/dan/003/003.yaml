base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/003.yaml
  text: Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him.
translation:
  language: pt
  text: Mesmo que seja pai ou mãe, trata-os como inimigos. Se for irmão, não o conhece. Se for profeta do Senhor, desobedece-lhe; se for justo, não o vê; se for amigo, não o reconhece.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς πολεμίοις προσέχει αὐτοῖς
  choice: considera-os inimigos
  rationale: Expressa em português natural a ideia de tratar ou encarar essas pessoas como inimigas, sem acrescentar uma explicação ausente no grego.
- source_word: παρακούει
  choice: desobedece-lhe
  rationale: O verbo indica não dar ouvidos e, por extensão, desobedecer; esta escolha corresponde ao sentido no contexto de um profeta do Senhor.
- source_word: οὐ βλέπει
  choice: não o vê
  rationale: Mantém a correspondência direta com βλέπει e preserva a força metafórica sem substituí-la por 'não o nota' ou 'não lhe dá atenção'.
- source_word: οὐ γνωρίζει
  choice: não o reconhece
  rationale: 'Distingue γνωρίζει de οἶδεν: aqui a ideia é não reconhecer o amigo, enquanto antes se diz que não conhece o irmão.'
theological_decisions:
- issue: Referente implícito do sujeito verbal
  choice: Manter o sujeito não expresso, como no grego e no contexto imediato
  alternative: Explicitar o vício ou impulso personificado referido no contexto mais amplo
  rationale: O versículo grego não repete o referente. O português permite conservá-lo implícito, evitando inserir uma identificação interpretativa no próprio texto.
- issue: Sentido de παρακούει diante de um profeta do Senhor
  choice: desobedece-lhe
  alternative: não lhe dá ouvidos
  rationale: Ambas as leituras são lexicalmente possíveis; 'desobedece-lhe' comunica de modo conciso a rejeição da palavra profética e acompanha a construção pessoal do texto.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. Empregou-se 'lhe' após 'desobedece' e pronomes masculinos genéricos nas orações condicionais, em concordância com os substantivos gregos correspondentes. Não foram necessárias notas de rodapé.
