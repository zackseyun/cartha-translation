source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: III. *Καὶ γὰρ πονηρὸς ὁ θυμός¹, τέκνα μου, *ὡς καὶ αὐτὴν τὴν ψυχὴν ἐκταράσσει².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/006.yaml
  text: For anger is evil, my children, because it throws even the soul itself into turmoil.
translation:
  language: pt
  text: Pois a ira é má, meus filhos, porque perturba até a própria alma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: ira
  rationale: No contexto, designa a emoção intensa e destrutiva da cólera; “ira” conserva o peso moral de πονηρός e o tom sapiencial.
- source_word: πονηρός
  choice: má
  rationale: Predicado moral direto e natural em português, sem ampliar o sentido para “maligna” ou “perversa”.
- source_word: ἐκταράσσει
  choice: perturba
  rationale: Expressa a agitação profunda causada à alma; é corrente, digna e suficientemente forte sem acrescentar uma imagem ausente do grego.
- source_word: αὐτὴν τὴν ψυχήν
  choice: a própria alma
  rationale: Reproduz a ênfase de αὐτήν e mantém ψυχή como “alma”, adequada ao caráter antropológico e sapiencial do texto.
theological_decisions:
- issue: Avaliação moral de θυμός
  choice: “a ira é má”
  alternative: “a cólera é perversa”
  rationale: Mantém a afirmação moral explícita do grego sem intensificá-la nem introduzir uma distinção doutrinária entre formas de ira.
translation_notes:
  register: Português moderno, claro e digno, com vocativo familiar (“meus filhos”) e estrutura causal próxima do grego. Não há necessidade de notas textuais ou explicativas.
