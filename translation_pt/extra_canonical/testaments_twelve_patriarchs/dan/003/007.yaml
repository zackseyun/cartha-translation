source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὸ μὲν σῶμα *ἴδιον ποιεῖται³ τοῦ θυμουμένου⁴, *τῆς δὲ ψυχῆς⁵ κατακυριεύει, καὶ παρέχει σώματι⁶· ⌈δύναμιν⌉⁷, ἵνα ποιήσῃ⁸ πᾶσαν⁹ ἀνομίαν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/007.yaml
  text: And it makes the body of the angry man its own, and gains mastery over the soul, and gives the body strength so that it may commit every lawless deed.
translation:
  language: pt
  text: E ele se apodera do corpo de quem está irado, domina a alma e dá força ao corpo, para que pratique toda transgressão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδιον ποιεῖται
  choice: se apodera
  rationale: Expressa de modo natural a ideia de tornar o corpo sua propriedade ou pô-lo sob seu controle, sem exigir uma formulação portuguesa rígida.
- source_word: τοῦ θυμουμένου
  choice: de quem está irado
  rationale: O particípio indica a pessoa tomada pela ira; a formulação mantém esse estado em linguagem corrente e digna.
- source_word: κατακυριεύει
  choice: domina
  rationale: Preserva a noção forte de exercer senhorio ou controle sobre a alma.
- source_word: δύναμιν
  choice: força
  rationale: Equivalente direto e natural para a capacidade concedida ao corpo.
- source_word: πᾶσαν ἀνομίαν
  choice: toda espécie de transgressão
  rationale: Comunica a abrangência de πᾶσαν e o sentido de ἀνομία como conduta contrária à lei, evitando sugerir apenas um único ato.
theological_decisions:
- issue: Referente do sujeito implícito em ποιεῖται, κατακυριεύει e παρέχει
  choice: Manter o pronome “ele”, conforme o referente masculino do contexto anterior
  alternative: Explicitar “o espírito da ira” ou outro referente contextual
  rationale: O versículo grego apresenta sujeito implícito; não se deve inserir no corpo do texto uma identificação que depende do contexto precedente.
- issue: Relação entre corpo, alma e ira
  choice: Preservar a linguagem de domínio sobre corpo e alma
  alternative: Parafrasear como efeitos psicológicos ou comportamentais da ira
  rationale: A formulação do texto é deliberadamente personificada e antropológica; uma explicação moderna resolveria indevidamente sua tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação conserva a personificação e a progressão do grego, com clareza sem explicitar além da fonte o referente de “ele”.
