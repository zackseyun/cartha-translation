source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Περιβάλλεται γὰρ ⌈αὐτὸν⌉⁷ τὸ πνεῦμα τοῦ θυμοῦ τὸ δίκτυον τῆς πλάνης²¹ καὶ τυφλοῖ τοὺς²² ὀφθαλμοὺς αὐτοῦ, καὶ¹ διὰ τοῦ ψεύδους σκοτοῖ²³ τὴν διάνοιαν ⌈αὐτοῦ⌉⁷²⁴, καὶ τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/004.yaml
  text: For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision.
translation:
  language: pt
  text: Pois o espírito da ira o envolve na rede do engano, cega os seus olhos e, por meio da falsidade, obscurece a sua mente e lhe dá a sua própria visão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: o espírito da ira
  rationale: Mantém a formulação concreta do grego e a possível personificação de uma força que domina a pessoa.
- source_word: τὸ δίκτυον τῆς πλάνης
  choice: a rede do engano
  rationale: Preserva a metáfora de uma rede que captura e o sentido de πλάνη como desvio ou engano.
- source_word: τὴν διάνοιαν
  choice: a sua mente
  rationale: Em português corrente, «mente» expressa com naturalidade a faculdade de compreensão e discernimento indicada pelo termo grego.
- source_word: τὴν ἰδίαν ὅρασιν
  choice: a sua própria visão
  rationale: Conserva a ambiguidade do possessivo grego, que pode remeter ao espírito da ira, sem explicitar uma interpretação não exigida pelo texto.
theological_decisions:
- issue: Natureza do «espírito da ira»
  choice: Manter «espírito» sem explicar se é um ser pessoal, uma disposição interior ou uma força personificada.
  alternative: Traduzir como «a ira» ou «o impulso da ira».
  rationale: O grego emprega explicitamente πνεῦμα e deixa aberta a natureza precisa dessa realidade.
- issue: Referente de «sua própria visão»
  choice: Preservar o possessivo ambíguo.
  alternative: Explicitar «a visão própria do espírito da ira» ou «uma visão distorcida».
  rationale: A formulação grega permite tensão referencial; esclarecê-la no corpo do texto resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A estrutura coordenada e as imagens centrais do grego foram preservadas sem rigidez excessiva.
