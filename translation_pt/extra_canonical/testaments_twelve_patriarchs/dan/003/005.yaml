    issue: «para a inveja»
    rationale: Embora formalmente direcional, a expressão soa pouco natural e em português tende a indicar propósito. O sintagma grego εἰς φθόνον pode indicar o ponto a que o ódio chega; «até a inveja» preserva essa concisão e evita atribuir intenção.
