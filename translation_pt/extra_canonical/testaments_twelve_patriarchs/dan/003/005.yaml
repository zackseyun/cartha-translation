  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/005.yaml
  text: And with what does it cover his eyes? With hatred of heart against his brother, unto envy.
translation:
  language: pt
  text: E com que ele cobre seus olhos? Com ódio no coração contra seu irmão, até a inveja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβάλλει
  choice: cobre
  rationale: Verte diretamente a ideia de envolver ou cobrir, preservando a imagem dos olhos encobertos sem recorrer ao mais interpretativo «venda».
- source_word: μίσει καρδίας
  choice: ódio no coração
  rationale: Expressão natural em português que mantém tanto o ódio quanto sua localização interior, indicada pelo genitivo grego.
- source_word: εἰς φθόνον
  choice: para a inveja
  rationale: Mantém a construção direcional e a concisão de εἰς, sem explicitar se a inveja é resultado, propósito ou desenvolvimento do ódio.
theological_decisions:
- issue: Relação entre o ódio no coração e a inveja
  choice: para a inveja
  alternative: levando à inveja
  rationale: A formulação escolhida conserva a ambiguidade e a tensão da preposição εἰς, evitando impor uma relação causal explícita ausente do texto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe simples. O pronome «ele» preserva o referente masculino do contexto, e «o seu irmão» mantém a relação fraterna expressa no grego.
