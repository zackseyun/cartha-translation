source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Καὶ ὅταν ταῦτα πάντα πράξῃ τὸ σῶμα, δικαιοῖ τὰ πραχθέντα καὶ ἡ ψυχή¹⁰, ἐπειδὴ οὐ βλέπει ὀρθῶς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/008.yaml
  text: And when the body has done all these things, the soul justifies what has been done, because it does not see rightly.
translation:
  language: pt
  text: E, quando o corpo faz todas essas coisas, a alma também justifica o que foi feito, porque não vê corretamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράξῃ / τὰ πραχθέντα
  choice: pratica / o que foi feito
  rationale: Mantém a repetição verbal do grego de modo natural em português e preserva a relação entre a ação do corpo e sua posterior justificação pela alma.
- source_word: δικαιοῖ
  choice: justifica
  rationale: Reproduz o sentido de declarar ou considerar correto, sem explicitar além do que o texto afirma.
- source_word: οὐ βλέπει ὀρθῶς
  choice: não vê corretamente
  rationale: Conserva a metáfora visual e o sentido moral ou perceptivo de ὀρθῶς, sem resolver sua amplitude.
- source_word: καὶ ἡ ψυχή
  choice: a alma também
  rationale: O καί associado a ἡ ψυχή é expresso naturalmente por “também”, destacando que, após a ação do corpo, a alma igualmente participa ao justificá-la.
theological_decisions:
- issue: Relação entre corpo e alma na responsabilidade moral
  choice: 'Preservar a distinção e a sequência do texto: o corpo age, e a alma também justifica o que ocorreu.'
  alternative: Reformular corpo e alma como simples aspectos psicológicos de uma única ação.
  rationale: A formulação grega personifica e distingue ambos; a tradução evita impor uma antropologia sistemática que elimine essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. “Pratica” soa natural para ações moralmente censuráveis, e “vê corretamente” conserva a imagem do original.
