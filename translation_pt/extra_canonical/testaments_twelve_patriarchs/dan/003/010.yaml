id: T12P.DAN.3.10
reference: Testament of Dan 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐὰν δὲ ἀσθενὴς ᾖ ὁ²⁴ θυμούμενος²⁵, *διπλοῦν τὸ τῆς ὀργῆς πάθος ἐν αὐτῷ ἀναφύει²⁶· βοηθεῖ *γὰρ αὐτῷ ὁ θυμὸς²⁷ πάντοτε ἐν παρανομίᾳ²⁸. 6. Τοῦτο τὸ πνεῦμα ἀεὶ μετὰ τοῦ ψεύδους *ἐκ δεξιῶν τοῦ Σατανᾶ πορεύεται, ἵνα ἐν ὠμότητι καὶ ψεύδει³⁰ γίνωνται³¹ αἱ πράξεις αὐτοῦ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/010.yaml
  text: But if the one who is angry is weak, the passion of wrath grows in him twofold, for anger always helps him in wrongdoing. This spirit always proceeds with falsehood at the right hand of Satan, so that his deeds may be done in cruelty and falsehood.
translation:
  language: pt
  text: Mas, se aquele que se ira for fraco, a paixão da ira cresce nele em dobro, pois a ira sempre o ajuda na transgressão. Esse espírito anda sempre com a mentira à direita de Satanás, para que os atos dele sejam praticados com crueldade e mentira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενὴς
  choice: fraco
  rationale: Mantém o sentido amplo de fraqueza sem especificar se é física, moral ou interior.
- source_word: θυμούμενος
  choice: aquele que se ira
  rationale: Expressa a pessoa tomada pela ira em linguagem clara e preserva a forma participial.
- source_word: διπλοῦν ... ἀναφύει
  choice: cresce nele em dobro
  rationale: Representa tanto a ideia de brotar ou crescer quanto a intensificação dupla indicada pelo grego.
- source_word: παρανομίᾳ
  choice: transgressão
  rationale: Conserva o teor moral e jurídico de agir contra a lei, sem restringir o termo a um delito civil.
- source_word: ἐκ δεξιῶν ... πορεύεται
  choice: anda ... à direita de
  rationale: Preserva a imagem espacial e relacional do original; 'anda' é natural em português para πορεύεται neste contexto.
- source_word: ὠμότητι
  choice: crueldade
  rationale: Traduz diretamente a qualidade de dureza cruel expressa pelo substantivo.
theological_decisions:
- issue: Referente de αὐτοῦ na oração final
  choice: os atos dele
  alternative: os atos de Satanás / os atos do espírito
  rationale: O pronome grego é formalmente ambíguo quanto ao referente. A tradução mantém essa ambiguidade com 'dele', sem impor uma identificação teológica.
- issue: Identidade de 'esse espírito'
  choice: Esse espírito
  alternative: O espírito da ira
  rationale: O texto usa demonstrativo e substantivo, remetendo ao contexto, mas não explicita aqui uma qualificação. Evitou-se acrescentar uma identificação ausente desta frase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação segue de perto a estrutura e as imagens gregas, mas evita rigidez artificial. 'Paixão da ira' foi mantido por seu valor conceitual no contexto ético, e a ambiguidade pronominal final foi preservada.
