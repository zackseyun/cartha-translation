base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/009.yaml
  text: 'Therefore the one who is angry, if he is strong in body, has acquired threefold power in his anger: one from the help of attendants; a second through wealth, persuading and prevailing unjustly; and a third, having natural strength, by it he does evil.'
translation:
  language: pt
  text: 'Por isso, quem está irado, se for forte de corpo, possui no seu furor um poder triplo: um vem da ajuda dos que o servem; o segundo, da riqueza, com a qual persuade e prevalece injustamente[a]; e um terceiro: tendo força natural, por meio dela pratica o mal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns testemunhos trazem aqui um pronome de objeto, permitindo a tradução: “persuade e vence a outra pessoa injustamente”.'
    reason: O αὐτόν aparece entre colchetes na edição, indicando incerteza textual; a nota preserva a variante sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: ὁ θυμούμενος
  choice: quem está irado
  rationale: Expressa de modo natural a pessoa tomada pela ira, sem transformar o particípio em uma característica permanente.
- source_word: δυνατὸς τῷ σώματι
  choice: forte de corpo
  rationale: Mantém a referência explícita à força corporal em linguagem corrente.
- source_word: τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται
  choice: possui no seu furor um poder triplo
  rationale: Reproduz a relação entre a ira e o poder triplicado sem acrescentar a referência à alma, ausente no texto grego fornecido.
- source_word: τῶν ὑπουργούντων
  choice: dos que o servem
  rationale: O particípio designa pessoas que prestam serviço ou assistência; a formulação conserva essa amplitude.
- source_word: πείθων καὶ νικῶν
  choice: persuade e prevalece
  rationale: Distingue a persuasão da ideia de vencer ou levar vantagem, preservando a sequência verbal grega.
- source_word: δι’ αὐτῆς δρᾷ τὸ κακόν
  choice: por meio da qual pratica o mal
  rationale: Traduz diretamente o uso instrumental da força natural e a ação de fazer o mal.
theological_decisions:
- issue: Natureza do poder triplo associado à ira
  choice: Mantê-lo como poder exercido no furor, proveniente de três fontes
  alternative: Interpretá-lo como poder da alma para a ira
  rationale: O texto grego fornecido não contém referência explícita à alma; acrescentá-la resolveria interpretativamente uma relação que o original deixa mais concisa.
- issue: Agente moral na segunda fonte de poder
  choice: Conservar o irado como sujeito de 'persuade e prevalece'
  alternative: Entender a riqueza como sujeito personificado
  rationale: A concordância dos particípios masculinos favorece sua ligação com ὁ θυμούμενος, embora a riqueza seja o meio pelo qual ele age.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição estrutural “um... o segundo... o terceiro” preserva o caráter enumerativo do original; “furor” evita repetição excessiva de “irado/ira” e comunica a intensidade de θυμός.
