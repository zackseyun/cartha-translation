base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007.yaml
  text: 'And when he had said these things, he kissed them affectionately and fell asleep in a good sleep.

    2 And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.

    3 Nevertheless, Dan prophesied to them that they would forget their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring.'
translation:
  language: pt
  text: '1 Depois de dizer essas coisas, ele os beijou com carinho e adormeceu num sono tranquilo.


    2 Seus filhos o sepultaram. Depois disso, levaram os ossos dele para o lugar onde estavam Abraão, Isaque e Jacó.


    3 Contudo, Dan lhes profetizou que eles se esqueceriam de seu Deus e se tornariam alheios à terra de sua herança, à linhagem de Israel e à família de seus descendentes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταφιλήσας αὐτούς
  choice: os beijou com carinho
  rationale: O verbo καταφιλέω indica um beijo afetuoso ou intenso; a formulação conserva esse matiz de modo natural em português.
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: adormeceu num sono tranquilo
  rationale: Preserva a imagem eufemística do sono para a morte, evitando o pouco natural «dormiu um bom sono» sem explicitar além do grego.
- source_word: ἀπήνεγκαν τὰ ὀστᾶ αὐτοῦ
  choice: levaram os ossos dele
  rationale: ἀπήνεγκαν expressa levar ou transportar para outro lugar; «levaram» é direto e não acrescenta uma direção ascendente que não está inequívoca na forma grega fornecida.
- source_word: Πλὴν οὖν
  choice: Contudo
  rationale: Reproduz a transição adversativa de maneira digna e corrente.
- source_word: ἐπιλά…
  choice: se esqueceriam
  rationale: A forma fragmentária aponta para ἐπιλανθάνομαι, «esquecer-se»; a continuação é corroborada pela camada inglesa auditada.
theological_decisions:
- issue: O sono como descrição da morte de Dan
  choice: adormeceu num sono tranquilo
  alternative: morreu em paz
  rationale: Mantém a metáfora da fonte, sem resolver o eufemismo por explicitação teológica.
- issue: Afastamento futuro de Israel
  choice: se tornariam alheios à terra de sua herança, à linhagem de Israel e à família de seus descendentes
  alternative: seriam separados da terra, do povo e da família
  rationale: Conserva as três relações distintas e a tensão profética, sem reduzir ou reinterpretar suas consequências.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A numeração dos versículos foi preservada. Evitaram-se arcaísmos e também expansões doutrinárias; a repetição conceitual do versículo 3 foi mantida por refletir a estrutura da tradição textual.
