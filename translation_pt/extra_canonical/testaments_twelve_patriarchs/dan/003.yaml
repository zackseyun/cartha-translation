base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003.yaml
  text: 'If you lose truth and patience[a], you will perish.


    2 Anger is blindness, for it does not allow one to see anyone’s face truly. 3 Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him. 4 For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision. 5 And with what does it veil his eyes? With hatred of heart against his brother, leading to envy.


    6 For anger is evil, my children, because it throws even the soul itself into turmoil. 7 And it gives strength to the body, so that it may commit every lawless deed. 8 And when the body has done all these things, the soul justifies what has been done, because it does not see rightly. 9 Therefore the one who is angry, if he is physically strong, has his soul’s power for anger threefold: one from the help of attendants, by which he justifies the deed; a second through wealth, persuading and overpowering unjustly[b]; and a third, because he has natural strength, by it he does evil. 10 But if the one who is angry is weak, he has the passion of wrath in him twofold[d][c], for anger always helps him toward wrongdoing.'
translation:
  language: pt
  text: '1 Se vocês perderem a verdade e a paciência[a], perecerão.


    2 A ira é cegueira, pois não permite que alguém veja verdadeiramente o rosto de outra pessoa[b]. 3 Ainda que seja seu pai ou sua mãe, ela os considera inimigos. Se for seu irmão, não o reconhece; se for um profeta do Senhor, não lhe obedece; se for um justo, não o vê; se for um amigo, não o reconhece. 4 Pois o espírito da ira o envolve com a rede do engano, cega seus olhos e, por meio da falsidade, obscurece sua mente e lhe dá sua própria maneira de ver[c]. 5 E com que ele encobre seus olhos? Com o ódio que há em seu coração contra seu irmão, levando-o à inveja.


    6 Pois a ira é má, meus filhos, porque lança em tumulto até a própria alma. 7 Ela se apossa do corpo de quem está irado, domina sua alma e dá força ao corpo para cometer toda espécie de transgressão. 8 E, depois que o corpo pratica todas essas coisas, a alma também justifica o que foi feito, porque não enxerga corretamente. 9 Por isso, se aquele que está irado é fisicamente forte, possui força tripla em sua ira: a primeira vem da ajuda dos que o servem; a segunda, da riqueza, pela qual persuade e vence injustamente[d]; e a terceira, de sua força natural, pela qual pratica o mal. 10 Mas, se aquele que está irado é fraco, a ira faz crescer nele, em dobro, a paixão da cólera[e], pois a ira sempre o auxilia na transgressão. 11 Esse espírito anda sempre com a falsidade à direita de Satanás, para que seus atos se deem em crueldade e falsidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “longanimidade” (μακροθυμία), isto é, a disposição de suportar com paciência e domínio próprio.
    reason: lexical_alternative
  - marker: b
    text: “Ver verdadeiramente o rosto” é a imagem literal do grego para perceber uma pessoa como ela realmente é.
    reason: lexical_alternative
  - marker: c
    text: A expressão sugere que o espírito da ira substitui a realidade por uma percepção própria e distorcida.
    reason: ambiguity
  - marker: d
    text: A sintaxe grega desta enumeração é irregular; não fica explícito quem ou o que é vencido injustamente.
    reason: textual_uncertainty
  - marker: e
    text: Aqui o grego usa ὀργή (“cólera”), depois de empregar repetidamente θυμός (“ira”). A variação foi preservada, embora o texto não defina uma distinção técnica entre os termos.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμία
  choice: paciência
  rationale: Em exortação ética, “paciência” é natural e inclui a ideia de suportar demoradamente sem ceder à ira; a alternativa “longanimidade” é registrada em nota.
- source_word: τύφλωσις
  choice: cegueira
  rationale: 'Preserva a formulação nominal e incisiva do grego: a ira não apenas cega, mas é caracterizada como cegueira.'
- source_word: θυμός
  choice: ira
  rationale: Termo corrente e digno para o vício personificado ao longo da passagem; “cólera” foi reservado para ὀργή, preservando a variação lexical grega.
- source_word: ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ
  choice: ver verdadeiramente o rosto de outra pessoa
  rationale: Mantém a imagem concreta do rosto e comunica que a ira impede a percepção correta do outro.
- source_word: προσέχει ὡς πολεμίοις
  choice: considera inimigos
  rationale: Expressa de modo natural a atitude hostil indicada pelo grego, cujo sujeito personificado é a ira.
- source_word: παρακούει
  choice: não lhe obedece
  rationale: Preserva o sentido de desobedecer ou recusar-se a dar ouvidos ao profeta do Senhor.
- source_word: δίκτυον τῆς πλάνης
  choice: rede do engano
  rationale: Conserva a metáfora de aprisionamento e se harmoniza com a falsidade mencionada em seguida.
- source_word: τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ
  choice: lhe dá sua própria maneira de ver
  rationale: Torna inteligível a imagem difícil sem eliminar a noção de que o espírito da ira substitui a realidade por sua própria visão distorcida.
- source_word: ἐκταράσσει
  choice: lança em tumulto
  rationale: Reproduz a força intensiva do verbo e a perturbação profunda causada à alma.
- source_word: ἴδιον ποιεῖται ... κατακυριεύει
  choice: se apossa ... domina
  rationale: Preserva a personificação da ira como força que toma posse do corpo e exerce domínio sobre a alma.
- source_word: ἀνομία / παρανομία
  choice: transgressão
  rationale: “Transgressão” comunica violação moral ou legal e permite uma formulação natural em português sem restringir o termo a um delito civil.
- source_word: ὀργή
  choice: cólera
  rationale: Distingue este termo de θυμός, traduzido por “ira”, sem sugerir uma diferença técnica que o texto não define.
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ
  choice: à direita de Satanás
  rationale: Mantém a localização simbólica e incomum do original, sem explicá-la ou reformulá-la teologicamente.
theological_decisions:
- issue: κύριος em προφήτης Κυρίου
  choice: profeta do Senhor
  alternative: profeta de Deus
  rationale: O grego traz explicitamente Κυρίου; “Senhor” preserva o título sem generalizá-lo.
- issue: Personificação do espírito da ira
  choice: Preservar “o espírito da ira” como agente que envolve, cega e anda com a falsidade
  alternative: Reduzir toda a linguagem a uma descrição psicológica não personificada ou defini-la como referência inequívoca a um demônio independente
  rationale: O texto apresenta o espírito da ira como força operante e o associa a Satanás, mas não oferece uma ontologia detalhada. A tradução mantém essa tensão sem desmitologizar nem ampliar a demonologia.
- issue: Relação entre corpo, alma e ira em III.2–3
  choice: Traduzir a ira como aquela que se apossa do corpo, domina a alma e fortalece o corpo; depois a alma justifica os atos
  alternative: Omitir as cláusulas sobre posse e domínio, ou harmonizá-las numa teoria sistemática da alma
  rationale: A construção grega é abrupta, mas apresenta uma sequência moral clara o bastante. Preservou-se sua linguagem forte sem impor uma antropologia denominacional.
- issue: O espírito à direita de Satanás
  choice: Manter literalmente a imagem espacial
  alternative: Interpretar “à direita” como simples aliança, autoridade ou posição honorífica
  rationale: A imagem é teologicamente incomum e potencialmente ambígua; a tradução não deve resolver silenciosamente seu significado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A personificação da ira foi mantida mediante pronomes e verbos de ação. Evitaram-se tanto arcaísmos desnecessários quanto paráfrases que apagassem as imagens concretas de cegueira, rede, rosto, corpo e alma. A numeração contínua segue a unidade fornecida e inclui a frase final presente no texto grego, embora ausente da camada inglesa de consulta.
