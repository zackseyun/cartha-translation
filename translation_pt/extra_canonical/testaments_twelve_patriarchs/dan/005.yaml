base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005.yaml
  text: '1 Therefore[v6], my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.


    2 Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace[v8], and war will certainly not prevail against you.


    3 Love the Lord throughout all your life, and one another with a true heart.


    4 I know that in the last days you will depart from the Lord, and you will provoke Levi, and you will set yourselves in battle array against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.


    5 And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and the spirits of wickedness working among you in every evil.


    6 For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and of pride will attend on the sons of Levi, to make them sin before the Lord.


    7 And my sons will draw near to Levi and will sin together with them in all things. But the sons of Judah will be greedy, snatching what belongs to others like lions.


    8 Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.


    9 And so, when you return to the Lord, you will receive mercy, and he will bring you into his sanctuary, and he will give you peace.


    10 And for you the salvation of the Lord will arise from the tribe of Judah and of Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.


    11 And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.


    12 And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.


    13 And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst[v13][v12][v11][v10], and the Holy One of Israel will reign over her.'
translation:
  language: pt
  text: '**Testamento de Dã 5**


    **1** Portanto, meus filhos, guardem o mandamento do Senhor e observem a sua lei. Afastem-se da ira e odeiem a falsidade, para que o Senhor habite em vocês e Beliar fuja de vocês.


    **2** Cada um fale a verdade ao seu próximo, e vocês de modo nenhum cairão em furor e tumultos; pelo contrário, viverão em paz, tendo consigo o Deus da paz, e a guerra de modo nenhum prevalecerá contra vocês.


    **3** Amem o Senhor durante toda a vida de vocês e amem uns aos outros com um coração verdadeiro.


    **4** Eu sei que, nos últimos dias, vocês se afastarão do Senhor, provocarão Levi e se colocarão em formação de batalha contra Judá; mas não prevalecerão contra eles. Pois um anjo do Senhor guia a ambos, porque por meio deles Israel permanecerá firme.


    **5** E, quando se afastarem do Senhor, vocês andarão em toda espécie de maldade e praticarão as abominações das nações, prostituindo-se com mulheres sem lei e envolvendo-se em toda espécie de perversidade, com os espíritos da maldade agindo em vocês.[i]


    **6** Pois li no livro de Enoque, o justo,[a] e fiquei sabendo que o governante de vocês é Satanás e que os espíritos da maldade e do orgulho estarão a serviço dos filhos de Levi,[b] para fazê-los pecar diante do Senhor.


    **7** Meus filhos se aproximarão de Levi e pecarão com eles em todas as coisas. Os filhos de Judá, porém, serão dominados pela ganância e tomarão o que pertence a outros, como leões.


    **8** Por isso, vocês serão levados com eles para o cativeiro,[c] e ali receberão todas as pragas do Egito e todos os males das nações.


    **9** Então, quando voltarem para o Senhor, alcançarão misericórdia. Ele os conduzirá ao seu santuário e lhes dará paz.


    **10** E, para vocês, a salvação do Senhor surgirá da tribo de Judá e de Levi.[d] Pois ele mesmo guerreará contra Beliar e concederá a seus pais a vingança da vitória.[e]


    **11** Ele tomará de Beliar aquilo que este mantém cativo — as almas dos santos —,[f] converterá ao Senhor os corações desobedientes e dará paz eterna aos que o invocam.


    **12** Os santos repousarão no Éden, e os justos se alegrarão por causa da nova Jerusalém,[g] que é a glória eterna de Deus.


    **13** Jerusalém já não sofrerá desolação, nem Israel será levado ao cativeiro, porque o Senhor estará no meio dela, e o Santo de Israel reinará sobre ela.[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A referência ao “livro de Enoque” é explícita no texto grego e provavelmente remete a tradições enoquianas conhecidas no judaísmo do período do Segundo Templo.
    reason: cross_reference
  - marker: b
    text: A redação grega desta oração é difícil e textualmente incerta; também pode ser entendida no sentido de que esses espíritos “obedecerão à ordem de permanecer junto” dos filhos de Levi.
    reason: textual_variant
  - marker: c
    text: A expressão “com eles” não aparece em todas as testemunhas. Quando presente, liga mais explicitamente o cativeiro ao destino de Levi e Judá.
    reason: textual_variant
  - marker: d
    text: A expressão “Judá e” é textualmente variável, embora a referência conjunta às tribos de Judá e Levi esteja bem representada na tradição manuscrita.
    reason: textual_variant
  - marker: e
    text: A palavra traduzida por “pais” traz sinal de incerteza textual na edição grega; a expressão “vingança da vitória” também conserva uma formulação incomum do original.
    reason: textual_variant
  - marker: f
    text: A expressão “as almas dos santos” é textualmente incerta, mas explicita que a libertação do poder de Beliar diz respeito a pessoas mantidas em cativeiro.
    reason: textual_variant
  - marker: g
    text: A “nova Jerusalém” é uma imagem escatológica de Sião restaurada e glorificada, não apenas da cidade histórica em sua condição presente.
    reason: cultural_note
  - marker: h
    text: Algumas testemunhas acrescentam que o Senhor conviverá com os seres humanos e que o Santo de Israel reinará “em humildade e pobreza”; acrescentam ainda que aquele que nele crê reinará entre os seres humanos em verdade. Essas frases são frequentemente consideradas expansões posteriores e não foram incluídas no texto principal.
    reason: textual_variant
  - marker: i
    text: A expressão “em vocês” aparece entre colchetes na edição grega e é textualmente incerta. Ela foi mantida no texto, pois se ajusta à construção preservada pela testemunha.
    reason: textual_variant
lexical_decisions:
- source_word: φυλάξατε / τηρήσατε
  choice: guardem / observem
  rationale: Mantém a distinção retórica entre guardar o mandamento e observar a lei, com linguagem natural em português.
- source_word: θυμός
  choice: ira
  rationale: Expressa com clareza a disposição destrutiva condenada na exortação, sem reduzir o termo a mero aborrecimento.
- source_word: ψεῦδος
  choice: falsidade
  rationale: Designa uma categoria ética ampla, em contraste com falar a verdade, e não apenas uma mentira isolada.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Preserva a forma grega do nome encontrada na testemunha textual, sem normalizá-la para Belial.
- source_word: μῆνις / ταραχαί
  choice: furor / tumultos
  rationale: Distingue μῆνις da ira do versículo anterior e conserva em ταραχαί a ideia de perturbações ou conflitos coletivos.
- source_word: παρατάξεσθε
  choice: se colocarão em formação de batalha
  rationale: Conserva a imagem militar explícita do verbo, em vez de reduzi-la a oposição genérica.
- source_word: τὸ σωτήριον Κυρίου
  choice: a salvação do Senhor
  rationale: Mantém o substantivo neutro e a abertura semântica da expressão, sem transformá-la diretamente em título pessoal como “o Salvador”.
- source_word: τὴν αἰχμαλωσίαν λήψεται ἀπὸ τοῦ Βελίαρ
  choice: tomará de Beliar aquilo que este mantém cativo
  rationale: Comunica em português inteligível a imagem de retirar de Beliar o cativeiro ou os cativos, preservando a ligação com “as almas dos santos”.
theological_decisions:
- issue: Satanás e os espíritos da maldade nos vv. 5–7
  choice: Traduzir diretamente a linguagem de agentes espirituais.
  alternative: Interpretá-los apenas como personificações de impulsos humanos.
  rationale: A agência sobrenatural é explícita na testemunha grega e está integrada à advertência ética; não cabe desmitologizá-la na tradução.
- issue: A salvação do Senhor proveniente de Judá e Levi no v. 10
  choice: Manter “a salvação do Senhor” e a referência tribal dupla no texto, com nota sobre a variação.
  alternative: Traduzir “o Salvador do Senhor” ou limitar a origem a Levi.
  rationale: O grego permite tensão entre a expressão neutra “salvação” e o pronome masculino subsequente. A tradução não força uma identificação cristológica mais estreita.
- issue: Material escatológico textualmente expandido nos vv. 10–13
  choice: Traduzir o texto-base e registrar em notas as expressões entre colchetes ou instáveis.
  alternative: Incorporar todas as expansões ao corpo principal ou eliminar toda a seção.
  rationale: Esse procedimento torna visível a complexidade da tradição manuscrita sem harmonização nem exclusão silenciosa.
translation_notes:
  register: Português moderno, digno e acessível, com construção compreensível no Brasil e em outras comunidades lusófonas. Empregaram-se “vocês” e formas verbais correspondentes para evitar arcaísmo, preservando-se ao mesmo tempo o tom testamentário e exortativo. O paralelismo, a imagética militar e a terminologia escatológica foram mantidos sempre que naturais em português.
