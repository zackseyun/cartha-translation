base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/008.yaml
  text: Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.
translation:
  language: pt
  text: Por isso, vocês serão levados com eles para o cativeiro; e ali receberão todas as pragas do Egito e todos os males das nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαχθήσεσθε
  choice: serão levados
  rationale: Preserva a voz passiva e o sentido de condução forçada, adequado ao contexto de deportação.
- source_word: εἰς αἰχμαλωσίαν
  choice: para o cativeiro
  rationale: Expressa de modo natural e fiel a condição de exílio e sujeição indicada pelo grego.
- source_word: ἀπολήψεσθε
  choice: receberão
  rationale: Mantém o sentido básico do verbo sem explicitar além do texto a ideia de punição ou retribuição.
- source_word: πληγὰς Αἰγύπτου
  choice: pragas do Egito
  rationale: Conserva a formulação tradicional e a alusão bíblica transparente.
- source_word: πονηρίας τῶν ἐθνῶν
  choice: males das nações
  rationale: Traduz o plural amplo πονηρίας sem restringi-lo indevidamente a maldade moral, calamidades ou práticas perversas.
theological_decisions:
- issue: Natureza dos “males das nações”
  choice: Manter a expressão abrangente “males das nações”.
  alternative: “maldades dos povos” ou “calamidades causadas pelas nações”
  rationale: O grego permite mais de uma nuance; a tradução preserva a ambiguidade entre mal moral e males sofridos, sem impor uma interpretação teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com plural de segunda pessoa expresso por “vocês” para ampla legibilidade brasileira. A construção mantém o paralelismo e a solenidade do texto grego.
