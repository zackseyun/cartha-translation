source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '[᾿Ανέγνων γὰρ⁵⁰ ἐν βίβλῳ Ἐνὼχ⁵¹ τοῦ δικαίου ⌈καὶ ἔγνων⌉¹⁵² ὅτι ὁ⁵³ ἄρχων ὑμῶν⁵⁴ ὁ Σατανᾶς ἐστιν⁵⁵ *καὶ ὅτι⁵⁶ τὰ πνεύματα τῆς πονηρίας⁵⁷ καὶ τῆς ὑπερηφανίας †ὑπακούσονται⁵⁸ *τοῦ παρεδρεύειν⁵⁹ τοῖς υἱοῖς Λευί, τοῦ ποιεῖν⁶⁰ αὐτοὺς ἐξαμαρτάνειν ἐνώπιον Κυρίου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/006.yaml
  text: For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and pride will obey in attending the sons of Levi, to make them sin before the Lord.
translation:
  language: pt
  text: Pois li no livro de Enoque, o justo, e soube que o governante de vocês é Satanás, e que os espíritos da maldade e do orgulho obedecerão ao servir junto dos filhos de Levi,[a] para fazê-los pecar diante do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta frase é difícil. Também pode ser entendido como “obedecerão ao servir junto dos filhos de Levi”. Não se declara aqui explicitamente a quem esses espíritos obedecerão.
    reason: Preserva a incerteza sintática de ὑπακούσονται τοῦ παρεδρεύειν e evita determinar um objeto implícito de obediência.
lexical_decisions:
- source_word: ἄρχων
  choice: governante
  rationale: Expressa autoridade ou domínio sem restringir o termo a um título político específico; mantém a afirmação de que Satanás exerce governo sobre os destinatários.
- source_word: τὰ πνεύματα τῆς πονηρίας καὶ τῆς ὑπερηφανίας
  choice: os espíritos da maldade e do orgulho
  rationale: Conserva os genitivos gregos e sua possível caracterização desses espíritos por maldade e orgulho.
- source_word: ὑπακούσονται
  choice: obedecerão
  rationale: Traduz diretamente a ideia de submissão ou obediência do verbo, embora o agente a quem se obedece não esteja expresso no trecho.
- source_word: παρεδρεύειν
  choice: pondo-se ao lado
  rationale: Representa a ideia de permanecer ou servir junto a alguém, em português natural, sem definir além do texto a função exercida junto aos filhos de Levi.
- source_word: ἐξαμαρτάνειν ἐνώπιον Κυρίου
  choice: pecar diante do Senhor
  rationale: Mantém a formulação religiosa e relacional do grego, indicando pecado cometido na presença e perante o juízo do Senhor.
theological_decisions:
- issue: Identidade e função de Satanás como ἄρχων dos destinatários
  choice: “o governante de vocês é Satanás”
  alternative: “o príncipe de vocês é Satanás”
  rationale: “Governante” comunica com clareza a autoridade indicada por ἄρχων sem importar a linguagem técnica de uma tradição específica.
- issue: Relação sintática entre “obedecerão” e “pôr-se ao lado dos filhos de Levi”
  choice: 'Manter ambos os elementos: “obedecerão, pondo-se ao lado...”'
  alternative: Suprimir “obedecerão” e traduzir apenas “assistirão aos filhos de Levi”
  rationale: O texto grego transmitido é difícil, mas contém explicitamente ὑπακούσονται; preservá-lo evita apagar a noção de obediência e a nota registra a incerteza da construção.
- issue: Finalidade da atuação dos espíritos
  choice: “para fazê-los pecar diante do Senhor”
  alternative: “de modo que eles pequem diante do Senhor”
  rationale: O infinitivo com artigo indica propósito ou resultado; a tradução conserva a atuação causativa expressa por ποιεῖν αὐτοὺς ἐξαμαρτάνειν.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes como “vocês” e “fazê-los”. A ordem da frase acompanha de perto o desenvolvimento do grego, mas usa “pondo-se ao lado” para tornar inteligível a construção difícil sem eliminar sua ambiguidade.
