  source_fidelity: 'A tradução reproduz com precisão a sequência do grego: o particípio aoristo ἐπιστρέψαντες é bem expresso por “tendo voltado”; o futuro passivo ἐλεηθήσεσθε por “receberão misericórdia”; e os futuros ἄξει e δώσει por “conduzirá” e “dará”. “Santuário” corresponde adequadamente a ἁγίασμα, e “paz” preserva a amplitude de εἰρήνην. A supressão da repetição de “ele” antes de “lhes dará” é natural e não altera a referência do sujeito.'
  naturalness: O português é atual, claro e de registro apropriado. “Vocês receberão misericórdia”, “ele os conduzirá” e “lhes dará paz” combinam bem numa formulação amplamente compreensível, inclusive para leitores brasileiros. A construção participial é um pouco mais formal, mas é idiomática e corresponde ao tom do texto.
