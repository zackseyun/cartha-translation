source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὕτως⁷⁷ ἐπιστρέψαντες⁷⁸ πρὸς Κύριον ἐλεηθήσεσθε⁷⁹ καὶ ἄξει ὑμᾶς⁸⁰ εἰς τὸ ἁγίασμα αὐτοῦ *καὶ δώσει⁸¹ ὑμῖν εἰρήνην⁸².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/009.yaml
  text: And so, having returned to the Lord, you will receive mercy, and he will bring you into his sanctuary and give you peace.
translation:
  language: pt
  text: E assim, tendo voltado para o Senhor, vocês receberão misericórdia, e ele os conduzirá ao seu santuário e lhes dará paz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: tendo voltado
  rationale: Reproduz o particípio aoristo e apresenta o retorno ao Senhor como anterior à misericórdia recebida, sem transformá-lo explicitamente numa oração condicional.
- source_word: ἐλεηθήσεσθε
  choice: vocês receberão misericórdia
  rationale: Expressa de modo natural em português a voz passiva futura de ἐλεέω, conservando a ideia de ser alvo de misericórdia.
- source_word: ἄξει
  choice: conduzirá
  rationale: Traduz o futuro de ἄγω com um verbo natural para levar pessoas a um destino.
- source_word: ἁγίασμα
  choice: santuário
  rationale: Mantém o sentido de lugar santo ou consagrado e corresponde ao referente cultual mais provável no contexto.
- source_word: εἰρήνην
  choice: paz
  rationale: Equivalente direto, preservando a amplitude do termo sem especificar se se trata de paz interior, comunitária ou segurança.
theological_decisions:
- issue: Relação entre o retorno ao Senhor e o recebimento de misericórdia
  choice: tendo voltado para o Senhor, vocês receberão misericórdia
  alternative: quando vocês voltarem para o Senhor, receberão misericórdia
  rationale: A formulação escolhida conserva mais de perto o particípio grego e sua anterioridade circunstancial, sem definir além do texto a natureza teológica dessa relação.
- issue: Agente de ἐλεηθήσεσθε
  choice: receberão misericórdia
  alternative: o Senhor terá misericórdia de vocês
  rationale: O grego usa uma forma passiva e não nomeia expressamente o agente nessa oração; a tradução preserva essa forma de expressão, embora o contexto aponte naturalmente para o Senhor.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com 'vocês' para o plural e retomadas pronominais naturais ('os', 'lhes'). A coordenação final evita repetição desnecessária de 'ele', sem alterar o sujeito.
