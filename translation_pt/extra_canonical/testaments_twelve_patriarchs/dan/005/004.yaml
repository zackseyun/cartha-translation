base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/004.yaml
  text: I know that in the last days you will depart from the Lord, and you will provoke Levi to anger, and you will array yourselves against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.
translation:
  language: pt
  text: Eu sei que, nos últimos dias, vocês se afastarão do Senhor, provocarão a ira de Levi e se colocarão em ordem de batalha contra Judá; mas não prevalecerão contra eles. Pois um anjo do Senhor guia a ambos, porque neles Israel se manterá de pé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστήσεσθε
  choice: vocês se afastarão
  rationale: Expressa de modo natural a ideia de abandonar ou apartar-se do Senhor, sem acrescentar uma formulação denominacional específica.
- source_word: προσοχθιεῖτε τῷ Λευί
  choice: provocarão Levi à ira
  rationale: Segue o sentido contextual de provocar hostilidade ou ira em Levi e preserva a relação verbal adotada pela tradição textual consultada.
- source_word: παρατάξεσθε
  choice: se colocarão em ordem de batalha
  rationale: Conserva a imagem militar do verbo grego, que indica tomar posição ou formar fileiras contra alguém.
- source_word: οὐ δυνήσεσθε πρὸς αὐτούς
  choice: não prevalecerão contra eles
  rationale: Traduz idiomaticamente a incapacidade de resistir ou obter êxito contra Levi e Judá.
- source_word: ὁδηγεῖ ἑκατέρους
  choice: guia a ambos
  rationale: Mantém a referência distributiva aos dois, Levi e Judá.
- source_word: ἐν αὐτοῖς στήσεται ὁ Ἰσραήλ
  choice: neles Israel se manterá de pé
  rationale: Preserva a preposição 'em/neles' e a metáfora de permanecer de pé, sem restringir a frase ao sentido exclusivamente instrumental.
theological_decisions:
- issue: Identidade do anjo do Senhor
  choice: um anjo do Senhor
  alternative: o anjo do Senhor
  rationale: O substantivo grego está sem artigo; a tradução indefinida evita identificar automaticamente esta figura com uma manifestação singular ou tecnicamente definida.
- issue: Relação de Israel com Levi e Judá
  choice: neles Israel se manterá de pé
  alternative: por meio deles Israel permanecerá
  rationale: A formulação conserva a possível amplitude de ἐν αὐτοῖς, que pode sugerir esfera, associação ou instrumentalidade, sem decidir além do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para a segunda pessoa plural. A linguagem militar foi mantida onde o grego a emprega, e a última oração conserva deliberadamente sua tensão e amplitude semântica.
