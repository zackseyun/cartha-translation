base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/001.yaml
  text: Therefore, my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.
translation:
  language: pt
  text: Portanto, meus filhos, guardem o mandamento do Senhor e observem a sua lei. Afastem-se da ira e odeiem a falsidade, para que o Senhor habite em vocês e Beliar fuja de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: guardem
  rationale: Expressa a ideia de guardar e cumprir fielmente o mandamento, em português natural.
- source_word: τηρήσατε
  choice: observem
  rationale: Distingue o segundo verbo do primeiro sem perder o sentido de obedecer e conservar a lei.
- source_word: ἀπόστητε
  choice: afastem-se
  rationale: Reproduz com naturalidade a ordem de se separar ou apartar da ira.
- source_word: θυμοῦ
  choice: ira
  rationale: Termo corrente e digno que comunica a cólera intensa indicada pelo grego.
- source_word: ψεῦδος
  choice: falsidade
  rationale: Abrange mentira e engano, preservando o substantivo abstrato do original.
- source_word: Βελίαρ
  choice: Belial
  rationale: Emprega a forma tradicional e reconhecível em português para o nome próprio.
theological_decisions:
- issue: Sentido de ἐν ὑμῖν
  choice: em vocês
  alternative: entre vocês
  rationale: Mantém a formulação ampla do grego, que pode ter alcance interior ou corporativo, sem explicitar uma interpretação na tradução.
- issue: Valor de ἵνα com futuros κατοικήσει e φεύξεται
  choice: para que ... habite ... e ... fuja
  alternative: de modo que ... habitará ... e ... fugirá
  rationale: A construção final em português comunica adequadamente a finalidade ou resultado pretendido, sem transformar a afirmação em garantia causal rígida.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na terceira pessoa do plural para ampla legibilidade brasileira. A repetição de “vocês” preserva a correspondência de ἐν ὑμῖν e ἀφ᾽ ὑμῶν.
