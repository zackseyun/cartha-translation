source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὴν αἰχμαλωσίαν λήψεται⁸⁹ ἀπὸ τοῦ Βελίαρ, [τὰς ψυχὰς τῶν ἁγίων]⁹⁰, *καὶ ἐπιστρέψει⁹¹ καρδίας⁹² ἀπειθεῖς⁹³ πρὸς Κύριον. καὶ δώσει *τοῖς ἐπικαλουμένοις αὐτὸν⁹⁴ εἰρήνην αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/011.yaml
  text: And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.
translation:
  language: pt
  text: E ele tirará de Belial o cativeiro — as almas dos santos[a] —, fará os corações desobedientes voltarem-se para o Senhor e dará paz eterna aos que o invocam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “as almas dos santos” aparece entre colchetes na edição grega utilizada, indicando incerteza textual ou editorial quanto à sua presença no texto.
    reason: Sinalizar ao leitor a condição editorial da frase sem omiti-la nem tratá-la como indiscutivelmente original.
lexical_decisions:
- source_word: Βελίαρ
  choice: Belial
  rationale: Mantém o nome próprio tradicional da figura maligna, sem substituí-lo por uma interpretação como “o Maligno”.
- source_word: τὴν αἰχμαλωσίαν λήψεται ἀπὸ
  choice: tirará ... o cativeiro
  rationale: Reproduz a imagem do grego, em que o cativeiro é retirado do domínio de Belial, sem explicitar além do texto se se trata dos cativos ou da condição de cativeiro.
- source_word: τὰς ψυχὰς τῶν ἁγίων
  choice: as almas dos santos
  rationale: Traduz literalmente a expressão explicativa, preservando tanto “almas” como a designação ampla “santos”.
- source_word: ἐπιστρέψει καρδίας ἀπειθεῖς πρὸς Κύριον
  choice: fará os corações desobedientes voltarem-se para o Senhor
  rationale: Expressa naturalmente o movimento de retorno ou conversão indicado por ἐπιστρέψει, mantendo “corações” e “desobedientes”.
- source_word: τοῖς ἐπικαλουμένοις αὐτόν
  choice: aos que o invocam
  rationale: Mantém o pronome masculino do grego e sua possível referência contextual, sem inserir explicitamente um referente.
- source_word: εἰρήνην αἰώνιον
  choice: paz eterna
  rationale: Equivalência direta e idiomática que preserva a duração ilimitada da paz prometida.
theological_decisions:
- issue: Referente de “ele/o” no versículo
  choice: Manter os pronomes sem identificar expressamente a personagem
  alternative: Substituir os pronomes por “o Senhor”, “o Messias” ou outro título
  rationale: O trecho fornecido emprega pronomes e não resolve por si só a identidade do agente nem o referente final; explicitá-los importaria uma interpretação teológica.
- issue: Relação entre “o cativeiro” e “as almas dos santos”
  choice: Conservar a segunda expressão como aposição marcada por travessões
  alternative: Interpretar como “libertará de Belial as almas dos santos”
  rationale: A construção grega e os colchetes editoriais aconselham preservar a formulação e a tensão textual, em vez de transformar silenciosamente “cativeiro” em “cativos”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para fluidez, mas foram preservadas a imagem do cativeiro, a linguagem do coração, a ambiguidade pronominal e a incerteza textual indicada pela edição.
