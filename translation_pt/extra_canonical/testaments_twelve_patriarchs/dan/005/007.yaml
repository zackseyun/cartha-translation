  text: Καὶ *οἱ ἐμοὶ υἱοὶ⁶¹ συνεγγίζοντές⁶² εἰσι τοῦ⁶³ Λευὶ καὶ συναμαρτάνοντες⁶⁴ αὐτοῖς⁶⁵ ἐν πᾶσιν. *οἱ δὲ υἱοὶ τοῦ⁶⁶ Ἰούδα ἔσονται ἐν πλεονεξίᾳ ἁρπάζοντες⁶⁷ ἀλλότρια ὡς⁶⁸ λέοντες.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/007.yaml
  text: And my sons are drawing near to Levi and sinning together with them in all things. But the sons of Judah will be in greed, snatching what belongs to others like lions.
translation:
  language: pt
  text: E os meus filhos estão se aproximando de Levi e pecando com eles em tudo. Mas os filhos de Judá viverão na ganância, arrebatando o que é dos outros como leões.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεγγίζοντές
  choice: estão se aproximando
  rationale: Preserva o valor aspectual do particípio presente e a ideia de aproximação ou associação com Levi.
- source_word: συναμαρτάνοντες αὐτοῖς
  choice: pecando com eles
  rationale: Expressa de modo natural a participação conjunta no pecado, mantendo o referente plural do pronome grego.
- source_word: ἐν πλεονεξίᾳ
  choice: viverão na ganância
  rationale: Mantém a construção com ἐν e comunica um estado ou modo de agir dominado pela cobiça, sem reduzir a expressão apenas a um adjetivo.
- source_word: ἁρπάζοντες ἀλλότρια
  choice: arrebatando o que é dos outros
  rationale: ἁρπάζω indica tomar ou arrancar com violência; ἀλλότρια refere-se às coisas pertencentes a terceiros.
- source_word: ὡς λέοντες
  choice: como leões
  rationale: Reproduz diretamente a comparação do texto grego.
theological_decisions:
- issue: Referente de αὐτοῖς em «pecando com eles»
  choice: Manter o pronome plural sem explicitar seu antecedente
  alternative: Explicitar «pecando com os filhos de Levi» ou ajustar para o singular «com ele»
  rationale: O texto transmitido apresenta Λευὶ no singular, seguido de αὐτοῖς no plural, criando uma tensão gramatical ou textual. A tradução preserva essa dificuldade sem corrigi-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva os particípios presentes da primeira frase e o futuro da segunda, bem como a tensão entre «Levi» e o pronome plural subsequente.
