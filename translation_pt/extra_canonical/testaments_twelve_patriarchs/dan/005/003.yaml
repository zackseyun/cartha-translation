  text: Love the Lord all your life, and one another with a true heart.
translation:
  language: pt
  text: Amem o Senhor durante toda a vida de vocês e amem uns aos outros com um coração sincero.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: Amem
  rationale: Imperativo aoristo plural de ἀγαπάω; em português atual, o imperativo com referência a «vocês» comunica de modo natural a exortação dirigida ao grupo.
- source_word: τὸν Κύριον
  choice: o Senhor
  rationale: Equivalência direta e tradicional para o título κύριος, preservando sua dignidade e possível alcance teológico.
- source_word: ἐν πάσῃ τῇ ζωῇ ὑμῶν
  choice: durante toda a vida de vocês
  rationale: Expressa claramente a extensão temporal de toda a vida, sem o possível sentido instrumental ou circunstancial que uma reprodução literal de ἐν poderia sugerir em português.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Equivalente recíproco natural e preciso em português.
- source_word: ἐν ἀληθινῇ καρδίᾳ
  choice: com um coração sincero
  rationale: ἀληθινός, aplicado ao coração, indica autenticidade e ausência de falsidade; «sincero» é mais idiomático que «verdadeiro» neste contexto.
theological_decisions:
- issue: Relação sintática do segundo objeto com o imperativo
  choice: Repetir «amem» antes de «uns aos outros»
  alternative: «Amem o Senhor durante toda a vida de vocês e uns aos outros...»
  rationale: O grego subentende o mesmo verbo diante de ἀλλήλους. A repetição em português elimina uma coordenação pesada sem acrescentar distinção teológica.
- issue: Sentido de «coração»
  choice: Preservar a imagem antropológica de «coração»
  alternative: «com sinceridade»
  rationale: A formulação mantém a imagem do texto grego e seu alcance interior e moral, sem reduzi-la a um simples advérbio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para marcar naturalmente o plural de ὑμῶν. A redação mantém o paralelismo das duas exortações e evita literalismo pouco idiomático.
