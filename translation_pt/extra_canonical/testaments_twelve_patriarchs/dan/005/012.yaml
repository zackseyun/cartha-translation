source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἀναπαύσονται ἐν Ἐδὲμ ἅγιοι⁹⁵, καὶ ἐπὶ *τῆς νέας⁹⁶ Ἱερουσαλὴμ εὐφρανθήσονται δίκαιοι, *ἥτις ἐστι δόξα θεοῦ αἰώνιος⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/012.yaml
  text: And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.
translation:
  language: pt
  text: E os santos descansarão no Éden, e os justos se alegrarão por causa da nova Jerusalém, que é a glória eterna de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπαύσονται
  choice: descansarão
  rationale: Expressa naturalmente o repouso futuro indicado pelo verbo grego, sem acrescentar uma interpretação específica.
- source_word: ἅγιοι
  choice: os santos
  rationale: Equivalente corrente e digno para os que são consagrados a Deus.
- source_word: ἐπὶ τῆς νέας Ἱερουσαλήμ
  choice: com a nova Jerusalém
  rationale: Neste contexto, ἐπί ligado a εὐφρανθήσονται indica o motivo ou objeto da alegria. “Com” preserva essa relação em português natural, sem sugerir necessariamente localização dentro da cidade.
- source_word: εὐφρανθήσονται
  choice: se alegrarão
  rationale: Reproduz o sentido futuro de regozijo em linguagem clara e atual.
- source_word: δόξα θεοῦ αἰώνιος
  choice: a glória eterna de Deus
  rationale: Mantém a construção nominal e a qualificação temporal do grego.
theological_decisions:
- issue: Referente e valor explicativo de ἥτις
  choice: “que é”, retomando “a nova Jerusalém”
  alternative: “pois ela é”
  rationale: O pronome relativo feminino concorda com Jerusalém e apresenta uma caracterização dela. A tradução relativa segue diretamente a sintaxe sem tornar a relação explicitamente causal.
- issue: Relação dos justos com a nova Jerusalém
  choice: alegria “com” a nova Jerusalém
  alternative: alegria “sobre” ou “na” nova Jerusalém
  rationale: O grego ἐπί admite mais de uma nuance. Aqui, “com” comunica de modo idiomático a nova Jerusalém como objeto ou motivo de alegria, preservando a diferença em relação a uma afirmação inequivocamente locativa.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A coordenação e o paralelismo do original foram preservados.
