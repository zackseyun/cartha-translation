source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ὡς ἂν ἀποστήσεσθε⁴⁰ ἀπὸ⁴¹ Κυρίου⁴², *ἐν πάσῃ κακίᾳ⁴³ *πορευόμενοι ποιήσετε τὰ βδελύγματα τῶν ἐθνῶν ἐκπορνεύοντες ἐν⁴⁴ γυναιξὶν ἀνόμων⁴⁵ καὶ ἐν πάσῃ πονηρίᾳ⁴⁶ ἐνεργούντων⁴⁷ ⌈ἐν ὑμῖν⌉¹ *τῶν πνευμάτων⁴⁸ τῆς πονηρίας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/005.yaml
  text: And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and every evil will be at work among you through the spirits of wickedness.
translation:
  language: pt
  text: E, sempre que vocês se afastarem do Senhor, andando em toda espécie de maldade, cometerão as abominações das nações, prostituindo-se com mulheres sem lei e, em toda espécie de maldade, enquanto os espíritos da maldade agem entre vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O final do versículo é textualmente e sintaticamente difícil. «Entre vocês» corresponde a palavras transmitidas de forma incerta na edição; o grego também pode ser entendido como uma oração circunstancial: «enquanto os espíritos da maldade agem entre vocês em toda espécie de maldade».'
    reason: Assinala tanto a incerteza em torno de ἐν ὑμῖν quanto a função circunstancial do particípio ἐνεργούντων, sem inverter a agência explícita dos espíritos.
lexical_decisions:
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: se afastarem do Senhor
  rationale: Expressa naturalmente o afastamento ou apostasia indicado pelo verbo, sem acrescentar uma formulação confessional mais específica.
- source_word: ἐν πάσῃ κακίᾳ
  choice: em toda espécie de maldade
  rationale: Preserva o alcance abrangente de πάσῃ e produz uma expressão corrente em português.
- source_word: τὰ βδελύγματα τῶν ἐθνῶν
  choice: as abominações das nações
  rationale: Mantém a terminologia forte e tradicional de βδελύγματα e verte ἔθνη sem introduzir o termo teologicamente mais marcado «gentios».
- source_word: ἐκπορνεύοντες
  choice: entregando-se à imoralidade
  rationale: Comunica a conduta sexual ilícita do verbo sem sugerir necessariamente prostituição comercial ou reflexiva, nuances não exigidas pelo grego.
- source_word: γυναιξὶν ἀνόμων
  choice: mulheres que vivem sem lei
  rationale: Entende ἀνόμων como modificador de «mulheres» e conserva a noção literal de ausência ou transgressão da lei.
- source_word: τῶν πνευμάτων τῆς πονηρίας
  choice: dos espíritos da maldade
  rationale: Preserva a referência explícita a agentes espirituais malignos e a construção genitiva do texto.
theological_decisions:
- issue: Agência de «toda espécie de mal» e dos espíritos malignos
  choice: toda espécie de mal atuará entre vocês por meio dos espíritos da maldade
  alternative: os espíritos da maldade realizarão entre vocês toda espécie de mal
  rationale: A redação principal acompanha a reconstrução e a leitura refletida na camada inglesa, mantendo «mal» como sujeito e os espíritos como meio, sem apagar a dificuldade sintática do trecho.
- issue: Sentido de ἐκπορνεύοντες
  choice: entregando-se à imoralidade
  alternative: prostituindo-se
  rationale: Evita resolver o verbo como prostituição literal ou cultual e mantém seu sentido moral-sexual amplo no contexto.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento amplamente compreensíveis no Brasil e em outros contextos lusófonos. A sintaxe acompanha a progressão futura do grego, enquanto o particípio inicial é apresentado de maneira natural.
