review_pass:
  verdict: revise
  source_fidelity: A primeira parte reproduz bem a sequência condicional e futura do grego. Contudo, a oração final grega apresenta τῶν πνευμάτων τῆς πονηρίας como o referente do particípio ἐνεργούντων, isto é, os espíritos são os agentes de «agir/operar». O texto principal transforma «toda espécie de mal» em sujeito e os espíritos em mero meio, inversão que a alternativa da nota reconhece, mas que não deve governar a tradução principal.
  naturalness: A redação é em geral clara e atual. «Sempre que» exprime com naturalidade ὡς ἂν. A oração final pode ser formulada com «enquanto» para refletir o particípio genitivo absoluto sem criar uma construção artificial em português.
  terminology: «Senhor», «abominações das nações» e «maldade» são adequados. «Prostituindo-se» é a correspondência mais direta para ἐκπορνεύοντες neste contexto; não exige que se entenda prostituição comercial. «Mulheres sem lei» preserva de modo conciso o qualificativo ἀνόμων, sem especificar indevidamente qual lei está em vista.
  issues:
  - severity: medium
    issue: Agência invertida na oração final
    rationale: No grego, ἐνεργούντων está no genitivo plural e concorda com τῶν πνευμάτων. Portanto, «os espíritos da maldade» agem/operam; «por meio dos espíritos» altera essa relação sintática.
  - severity: low
    issue: Nota apresenta como alternativa o sentido mais próximo da sintaxe grega
    rationale: A leitura que faz os espíritos agir deveria constar no texto principal. A nota deve limitar-se à incerteza da transmissão e à relação sintática precisa do segmento final.
  revised_text: E, sempre que vocês se afastarem do Senhor, andando em toda espécie de maldade, cometerão as abominações das nações, prostituindo-se com mulheres sem lei e, em toda espécie de maldade, enquanto os espíritos da maldade agem entre vocês.[a]
