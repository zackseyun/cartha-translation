id: T12P.DAN.5.2
reference: Testament of Dan 5:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἀλήθειαν φθέγγεσθε¹⁴ ἕκαστος πρὸς τὸν πλησίον αὐτοῦ καὶ οὐ μὴ ἐμπέσητε εἰς μῆνιν¹⁵ *καὶ ταραχάς¹⁶, ἀλλ᾽ ἔσεσθε¹⁷ ἐν εἰρήνῃ ἔχοντες τὸν θεὸν *τῆς εἰρήνης¹⁸ καὶ *οὐ μὴ κατισχύσει¹⁹ ὑμῶν²⁰ πόλεμος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/002.yaml
  text: Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace, and no war will prevail against you.
translation:
  language: pt
  text: Digam a verdade, cada um ao seu próximo, e de modo algum cairão em ira e tumultos; pelo contrário, estarão em paz, tendo o Deus da paz, e nenhuma guerra prevalecerá contra vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλήθειαν φθέγγεσθε
  choice: Digam a verdade
  rationale: Reproduz naturalmente a ordem para falar a verdade, preservando a força do imperativo grego.
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: ao seu próximo
  rationale: Mantém a formulação relacional e tradicional de πλησίον sem restringi-la a um vizinho residencial.
- source_word: οὐ μὴ ἐμπέσητε
  choice: de modo algum cairão
  rationale: Expressa a negação enfática οὐ μή com o subjuntivo aoristo, entendida aqui como consequência assegurada da exortação.
- source_word: μῆνιν
  choice: ira
  rationale: Conserva o sentido de cólera intensa ou ressentimento, em linguagem clara e digna.
- source_word: ταραχάς
  choice: tumultos
  rationale: Preserva o plural e a ideia de agitações, desordens ou conflitos.
- source_word: ἔσεσθε ἐν εἰρήνῃ
  choice: estarão em paz
  rationale: Tradução direta e idiomática da construção grega.
- source_word: κατισχύσει
  choice: prevalecerá
  rationale: Comunica a ideia de adquirir força contra alguém e vencê-lo.
- source_word: πόλεμος
  choice: guerra
  rationale: Mantém o termo concreto do texto, sem reduzi-lo interpretativamente a conflito em geral.
theological_decisions:
- issue: Relação entre conduta verdadeira, paz e proteção divina
  choice: Preservar a sequência do texto sem explicitar uma causalidade teológica além do que está escrito.
  alternative: 'Traduzir como promessa condicional explícita: “Se disserem a verdade..., então...”'
  rationale: O grego justapõe a exortação e seus resultados futuros, mas não contém uma partícula condicional explícita.
- issue: Expressão “o Deus da paz”
  choice: Manter literalmente “o Deus da paz”.
  alternative: Parafrasear como “Deus, que dá a paz”.
  rationale: A construção genitiva é teologicamente sugestiva e deve permanecer aberta, podendo indicar Deus como fonte, possuidor ou caracterizado pela paz.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Emprega-se “vocês” para o plural de segunda pessoa, coerente com o uso brasileiro corrente. A coordenação e os futuros preservam a cadência exortativa e promissória do grego.
