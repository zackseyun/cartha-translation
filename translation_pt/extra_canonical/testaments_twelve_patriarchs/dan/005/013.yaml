source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὐκέτι ὑπομενεῖ⁹⁸ Ἱερουσαλὴμ ἐρήμωσιν *οὐδὲ αἰχμαλωτισθήσεται Ἰσραήλ⁹⁹, ὅτι¹⁰⁰ Κύριος ἔσται¹⁰¹ *ἐν μέσῳ¹⁰² αὐτῆς¹⁰³ [τοῖς ἀνθρώποις συναναστρεφόμενος]¹⁰⁴ καὶ §¹⁰⁵ Ἅγιος Ἰσραὴλ βασιλεύων¹⁰⁶ ἐπ᾽ αὐτῆς¹⁰⁷ [ἐν *ταπεινώσει καὶ πτωχείᾳ¹⁰⁸, καὶ ὁ πιστεύων *ἐπ᾽ αὐτῷ¹⁰⁹ *βασιλεύσει ἐν τοῖς ἀνθρώποις ἐν ἀληθείᾳ¹¹⁰].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/013.yaml
  text: And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst [dwelling among men], and the Holy One of Israel reigning over her [in humility and poverty; and the one who believes in him will reign among men in truth].
translation:
  language: pt
  text: E Jerusalém já não sofrerá desolação, nem Israel será levado ao cativeiro, porque o Senhor estará no meio dela [convivendo com os seres humanos][a], e o Santo de Israel reinando sobre ela [em humildade e pobreza; e aquele que nele crê reinará entre os seres humanos em verdade][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «convivendo com os seres humanos» aparece entre colchetes na edição grega utilizada, indicando incerteza em sua transmissão textual.
    reason: Explicar a delimitação editorial visível no texto traduzido.
  - marker: b
    text: As palavras desde «em humildade e pobreza» até o fim do versículo aparecem entre colchetes na edição grega utilizada, indicando incerteza em sua transmissão textual.
    reason: Explicar a delimitação editorial visível da segunda passagem textualmente incerta.
lexical_decisions:
- source_word: οὐκέτι ὑπομενεῖ ... ἐρήμωσιν
  choice: já não sofrerá desolação
  rationale: Expressa οὐκέτι como cessação futura e conserva o sentido de Jerusalém passar por ou suportar a desolação, em português natural.
- source_word: αἰχμαλωτισθήσεται
  choice: será levado ao cativeiro
  rationale: Traduz o passivo futuro sem restringir o referente a uma forma específica de prisão.
- source_word: ἐν μέσῳ αὐτῆς
  choice: no meio dela
  rationale: Mantém a imagem espacial e o pronome feminino referente a Jerusalém.
- source_word: τοῖς ἀνθρώποις συναναστρεφόμενος
  choice: convivendo com os seres humanos
  rationale: Συναναστρέφομαι indica viver, associar-se ou manter convivência com outros; a formulação é corrente e inclusiva sem apagar o sentido humano coletivo de ἄνθρωποι.
- source_word: βασιλεύων ἐπ᾽ αὐτῆς
  choice: reinando sobre ela
  rationale: Preserva o particípio presente e a regência de autoridade sobre Jerusalém, sem convertê-lo silenciosamente em um verbo futuro independente.
- source_word: ἐν ταπεινώσει καὶ πτωχείᾳ
  choice: em humildade e pobreza
  rationale: Equivalência direta que conserva tanto a condição humilde quanto a pobreza material ou social, sem interpretar além do texto.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: Mantém a expressão ampla do grego, que pode indicar verdade, veracidade ou fidelidade, sem reduzir a uma única nuance.
theological_decisions:
- issue: Relação sintática entre o Senhor e o Santo de Israel
  choice: Manter «o Senhor estará ... e o Santo de Israel reinando»
  alternative: «o Senhor estará ... e o Santo de Israel reinará» ou identificar explicitamente ambos como a mesma figura
  rationale: O grego usa ἔσται para o Senhor e depois o particípio βασιλεύων para o Santo de Israel. A tradução conserva essa construção e não resolve explicitamente se «o Santo de Israel» é aposição ao Senhor ou um sujeito apresentado de modo coordenado.
- issue: Referente de «nele»
  choice: Conservar o pronome masculino sem explicitar o referente
  alternative: Substituir por «no Santo de Israel» ou «no Senhor»
  rationale: O antecedente imediato é masculino, mas a relação entre os títulos no período permanece sintaticamente tensa; explicitar um deles eliminaria uma ambiguidade genuína.
- issue: Sentido do reinado do crente
  choice: «reinará entre os seres humanos em verdade»
  alternative: Interpretar como domínio político, autoridade espiritual ou vida fiel
  rationale: A redação mantém a afirmação escatológica e sua amplitude sem importar uma doutrina específica sobre a natureza desse reinado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «seres humanos» para o plural genérico ἄνθρωποι. A construção participial «e o Santo de Israel reinando» é deliberadamente menos comum em português para conservar a tensão sintática do grego e evitar suprir «reinará».
