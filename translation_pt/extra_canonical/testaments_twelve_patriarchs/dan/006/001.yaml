source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: VI. Καὶ νῦν *φοβήθητε τὸν Κύριον¹, τέκνα μου, καὶ προσέχετε ἑαυτοῖς² ἀπὸ τοῦ Σατανᾶ καὶ *τῶν πνευμάτων³ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/001.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits.
translation:
  language: pt
  text: E agora, meus filhos, temam o Senhor e guardem-se de Satanás e dos espíritos dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητε
  choice: temam
  rationale: Preserva o sentido direto de reverência e temor diante do Senhor, sem reduzi-lo a mera admiração.
- source_word: προσέχετε ἑαυτοῖς ἀπό
  choice: guardem-se de
  rationale: Expressão natural em português que comunica atenção vigilante e proteção contra uma ameaça.
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: dos espíritos dele
  rationale: Mantém a referência possessiva a Satanás sem especificar além do que o grego afirma.
theological_decisions:
- issue: Natureza do temor do Senhor
  choice: temam o Senhor
  alternative: reverenciem o Senhor
  rationale: O verbo grego φοβέομαι exprime temor; conservar 'temam' evita suavizar uma tensão teológica genuína.
- issue: Relação dos espíritos com Satanás
  choice: dos espíritos dele
  alternative: de seus espíritos
  rationale: Ambas as formas indicam posse ou associação; 'dele' torna inequívoco que o referente é Satanás, e não o Senhor.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural segundo o uso brasileiro corrente. A repetição de 'e' acompanha a coordenação simples do grego sem produzir artificialidade.
