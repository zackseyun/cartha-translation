  text: Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy.
translation:
  language: pt
  text: Aproximem-se de Deus e do anjo que intercede por vocês, pois ele é mediador entre Deus e os seres humanos[a]; e, em favor da paz de Israel, ele se colocará diante do reino de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “mediador entre Deus e os seres humanos” traduz diretamente o grego. Como a passagem continua chamando essa figura de “anjo”, sua identidade não é definida aqui segundo uma formulação doutrinária posterior.
    reason: lexical_alternative
  - marker: b
    text: O texto grego fornecido diz literalmente “do reino de Deus”, embora a expressão seja textualmente difícil. “Do reino do inimigo” é uma reconstrução contextual, não a leitura impressa aqui.
    reason: textual_variant
lexical_decisions:
- source_word: Ἐγγίσατε
  choice: Aproximem-se
  rationale: Preserva o imperativo aoristo plural e exprime de modo natural o movimento de aproximação a Deus.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: do anjo que intercede por vocês
  rationale: No contexto, o particípio descreve o anjo como alguém que faz uma súplica em favor dos destinatários; “intercede” comunica essa função sem identificar o anjo com qualquer figura doutrinária posterior.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: mediador entre Deus e os seres humanos
  rationale: Reproduz diretamente a relação expressa pelo grego, usando linguagem inclusiva natural para o plural genérico ἀνθρώπων.
- source_word: ἐπὶ τῆς εἰρήνης τοῦ Ἰσραήλ
  choice: em favor da paz de Israel
  rationale: Expressa o sentido de atuação em benefício da paz de Israel, adequado ao contexto e à construção com ἐπί e genitivo.
- source_word: κατέναντι … στήσεται
  choice: se colocará diante de
  rationale: Mantém o valor espacial de ficar ou apresentar-se diante de algo, evitando impor o sentido hostil “contra”, que não é obrigatório.
theological_decisions:
- issue: Identidade do mediador chamado de anjo
  choice: Manter “anjo” e “mediador” sem identificação adicional
  alternative: Identificá-lo explicitamente com uma figura doutrinária posterior
  rationale: O próprio texto chama a personagem de anjo e de mediador; a tradução preserva essa tensão sem resolver além da evidência grega.
- issue: Leitura final τοῦ θεοῦ
  choice: Traduzir “do reino de Deus”
  alternative: “do reino do inimigo”
  rationale: O texto grego fornecido contém τοῦ θεοῦ. Embora a frase resultante seja difícil e a consulta inglesa adote “inimigo”, a tradução segue a evidência original apresentada e registra a dificuldade em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento compreensíveis tanto no Brasil quanto em âmbito internacional. A sintaxe conserva a progressão do grego, mas emprega “seres humanos” para o plural genérico e “se colocará diante de” para não introduzir oposição hostil ausente da forma lexical obrigatória.
