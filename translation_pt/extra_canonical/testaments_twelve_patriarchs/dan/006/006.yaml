base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/006.yaml
  text: But in the time of Israel’s lawlessness, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[a].
translation:
  language: pt
  text: Mas, no tempo da transgressão de Israel, o Senhor não se afastará deles, mas passará para uma nação que busca a vontade dele, pois nenhum dos anjos será igual a ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase grega é difícil: o texto apresentado diz que o Senhor “não se afastará deles” e, ainda assim, “passará para uma nação que busca a vontade dele”. A tradução preserva essa tensão, sem tentar harmonizá-la.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνομίας
  choice: transgressão
  rationale: Expressa a violação da ordem ou vontade divina sem restringir o termo a uma formulação jurídica específica; é natural e digna em português.
- source_word: ἀφιστάμενος ἀπ᾽ αὐτῶν
  choice: se afastará deles
  rationale: Reproduz diretamente a ideia de afastamento ou separação contida no grego.
- source_word: μετελεύσεται ἐπ᾽ ἔθνει
  choice: passará para uma nação
  rationale: Mantém o movimento enigmático indicado pelo verbo e pela preposição, sem explicar ou harmonizar a relação com a oração anterior.
- source_word: ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: que busca a vontade dele
  rationale: Traduz de modo claro o particípio e preserva a referência pronominal tal como aparece no texto.
- source_word: οὐδεὶς τῶν ἀγγέλων ἔσται ἴσος αὐτῷ
  choice: nenhum dos anjos será igual a ele
  rationale: Tradução formal e semanticamente aberta quanto ao referente de αὐτῷ, como no original.
theological_decisions:
- issue: Tensão entre o Senhor não se afastar de Israel e passar para outra nação
  choice: Preservar ambas as afirmações sem harmonização
  alternative: Explicar que o Senhor não abandonará definitivamente Israel, embora volte sua atenção a outra nação
  rationale: O texto grego transmitido contém a tensão; resolvê-la na tradução importaria uma interpretação não explicitada.
- issue: Referente de αὐτῷ em 'igual a ele'
  choice: Manter o pronome masculino sem identificar explicitamente o referente
  alternative: Substituir por 'igual ao Senhor'
  rationale: A forma grega permite que o leitor relacione o pronome ao referente contextual, e a tradução não deve tornar explícito o que permanece pronominal no original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego onde isso é necessário para preservar sua tensão. Optou-se por “transgressão” em vez de “ilegalidade” ou “iniquidade”, buscando legibilidade ampla sem perder a dimensão moral e religiosa de ἀνομία.
