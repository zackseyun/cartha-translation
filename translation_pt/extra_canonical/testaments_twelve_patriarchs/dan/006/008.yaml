  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/008.yaml
  text: Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience.
translation:
  language: pt
  text: Portanto, guardem-se, meus filhos, de toda obra má; afastem de vocês a ira e a falsidade, e amem a verdade e a paciência.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατηρήσατε ἑαυτούς
  choice: guardem-se
  rationale: Preserva a ideia de manter a si mesmos protegidos ou livres de algo, em forma imperativa natural no português moderno.
- source_word: παντὸς ἔργου πονηροῦ
  choice: toda obra má
  rationale: Mantém de perto a construção grega e o sentido moral de πονηρός, sem ampliar para uma noção abstrata de maldade.
- source_word: ἀπορρίψατε ἀφ᾽ ὑμῶν
  choice: afastem de vocês
  rationale: Expressa com naturalidade a imagem de remover ou lançar para longe de si.
- source_word: θυμὸν
  choice: ira
  rationale: Neste contexto de vícios morais, indica cólera ou ira, mais precisamente que o sentido amplo de impulso ou paixão.
- source_word: ψεῦδος
  choice: falsidade
  rationale: Abrange tanto a mentira quanto o caráter enganoso, preservando o substantivo abstrato do grego.
- source_word: μακροθυμίαν
  choice: paciência
  rationale: Comunica de modo claro a disposição de suportar com longanimidade; é corrente e acessível ao leitor moderno.
