base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/009.yaml
  text: And what you have heard from your father, pass on also to your children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord[a].
translation:
  language: pt
  text: E aquilo que vocês ouviram de seu pai, transmitam também a seus filhos, [para que o Salvador das nações os receba; pois ele é verdadeiro e paciente, manso e humilde e, por meio de suas obras, ensina a lei do Senhor].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase entre colchetes é muitas vezes considerada uma expansão ou interpolação posterior; ela foi traduzida aqui porque consta do testemunho grego fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: μετάδοτε
  choice: transmitam
  rationale: Expressa naturalmente a ordem de comunicar à geração seguinte aquilo que foi recebido, preservando o sentido de compartilhar ou passar adiante.
- source_word: ὁ Σωτὴρ τῶν ἐθνῶν
  choice: o Salvador das nações
  rationale: Mantém a construção genitiva e o alcance coletivo de ἐθνῶν sem restringi-lo a um só povo.
- source_word: μακρόθυμος
  choice: paciente
  rationale: Comunica em português corrente a ideia de longanimidade e tolerância perseverante.
- source_word: ἐκδιδάσκων διὰ τῶν ἔργων
  choice: por meio de suas obras, ensina
  rationale: Preserva tanto o meio do ensino — as obras — quanto a força verbal de ensinar ou instruir.
theological_decisions:
- issue: Referente de «ele» na descrição «verdadeiro e paciente, manso e humilde»
  choice: Manter o pronome ligado gramaticalmente ao «Salvador das nações»
  alternative: Explicitar uma identificação cristológica ou referir a descrição a Deus
  rationale: O grego mantém como sujeito o Salvador mencionado, mas não exige que a tradução acrescente uma identificação teológica ausente do texto.
- issue: Status textual da oração iniciada por ἵνα
  choice: Traduzir a passagem no corpo do texto e assinalar sua condição em nota
  alternative: Omiti-la do texto principal ou colocá-la entre colchetes
  rationale: A oração está presente no testemunho grego fornecido; a nota preserva a transparência sobre sua frequente avaliação como expansão posterior.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para o plural e sem arcaísmos. A sintaxe mantém a oração de finalidade ligada à ordem anterior, conforme a estrutura grega.
