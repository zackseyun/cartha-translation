base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/005.yaml
  text: For he himself, the angel of peace, will strengthen Israel so that it will not fall into uttermost evils.
translation:
  language: pt
  text: Pois ele mesmo, o anjo da paz, fortalecerá Israel, para que Israel não caia em males extremos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o fim dos males”. A expressão grega é difícil; literalmente, “para um fim de males”.'
    reason: Registra a dificuldade de εἰς τέλος κακῶν e uma alternativa interpretativa relevante, enquanto o texto principal usa uma formulação portuguesa clara.
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ ἄγγελος τῆς εἰρήνης
  choice: Pois ele mesmo, o anjo da paz
  rationale: Preserva a força enfática de αὐτός e a relação explicativa de γάρ, mantendo o título genitivo de modo natural em português.
- source_word: ἐνισχύσει
  choice: fortalecerá
  rationale: Equivalente direto e corrente para o futuro do verbo que significa fortalecer ou dar vigor.
- source_word: τὸν Ἰσραήλ ... αὐτόν
  choice: Israel ... Israel
  rationale: A repetição do nome evita que o pronome masculino português pareça retomar o anjo; o referente de αὐτόν é Israel.
- source_word: μὴ ἐμπεσεῖν
  choice: para que ... não caia
  rationale: Expressa naturalmente o resultado ou propósito negativo do infinitivo grego dependente de 'fortalecerá', sem introduzir incerteza indevida.
- source_word: εἰς τέλος κακῶν
  choice: por fim em males
  rationale: Mantém a construção difícil e sua possível ideia temporal ou extrema, sem reduzir o plural κακῶν a um mal singular.
theological_decisions:
- issue: Identidade do 'anjo da paz'
  choice: Mantido como título sem identificação adicional
  alternative: Identificá-lo com uma figura angelical ou messiânica específica
  rationale: O versículo não explicita a identidade, e a tradução não deve impor uma interpretação doutrinária.
- issue: Sentido de εἰς τέλος κακῶν
  choice: Texto principal conserva a formulação ambígua 'por fim em males', com nota explicativa
  alternative: Traduzir decisivamente como 'nos males extremos' ou 'até o fim dos males'
  rationale: A expressão grega admite mais de uma relação semântica; a nota preserva essa tensão textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. A repetição de “Israel” é deliberada para eliminar ambiguidade referencial. O texto evita linguagem denominacional e conserva, em nota, a dificuldade da expressão final.
