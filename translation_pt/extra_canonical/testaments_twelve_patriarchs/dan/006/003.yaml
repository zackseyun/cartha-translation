  text: Because of this the enemy is eager to trip up all who call on the Lord.
translation:
  language: pt
  text: Por isso, o inimigo se empenha em fazer tropeçar todos os que invocam o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a relação causal ou inferencial do grego, mantendo a ligação com o contexto anterior.
- source_word: σπουδάζει
  choice: se empenha
  rationale: Comunica esforço zeloso e intencional sem recorrer ao sentido moderno mais estreito de “estudar”.
- source_word: ὁ ἐχθρός
  choice: o inimigo
  rationale: Tradução direta, preservando a referência definida e sem identificar além do que o texto declara.
- source_word: ὑποσκελίζειν
  choice: fazer tropeçar
  rationale: Reproduz a imagem de derrubar alguém por meio de um tropeço e permite também sua força figurada.
- source_word: τοὺς ἐπικαλουμένους τὸν Κύριον
  choice: os que invocam o Senhor
  rationale: Mantém a construção religiosa tradicional e semanticamente precisa de apelar ou clamar ao Senhor.
theological_decisions:
- issue: Identidade de “o inimigo”
  choice: Manter “o inimigo” sem explicitação
  alternative: Identificar o inimigo como Satanás ou o diabo
  rationale: Embora o contexto possa sugerir uma figura espiritual específica, o grego deste versículo não a nomeia; explicitá-la eliminaria uma abertura presente no texto.
- issue: Sentido de ἐπικαλουμένους
  choice: “invocam o Senhor”
  alternative: “chamam pelo nome do Senhor” ou “recorrem ao Senhor”
  rationale: “Invocam” preserva tanto o ato de clamar ao Senhor quanto sua possível dimensão confessional, sem restringir o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação é concisa e conserva a metáfora do tropeço e a indefinição contextual da identidade do inimigo.
