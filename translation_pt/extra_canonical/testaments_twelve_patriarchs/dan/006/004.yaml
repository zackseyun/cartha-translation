id: T12P.DAN.6.4
reference: Testament of Dan 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Οἶδε γὰρ ὅτι *ἐν ᾗ ἡμέρᾳ¹³ ἐπιστρέψει¹⁴ Ἰσραήλ, συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/004.yaml
  text: For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end.
translation:
  language: pt
  text: Pois ele sabe que, no dia em que Israel voltar, o reino do inimigo chegará ao fim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: voltar
  rationale: O verbo pode indicar voltar ou converter-se. “Voltar” preserva a imagem de retorno e evita explicitar um complemento que o grego não apresenta.
- source_word: συντελεσθήσεται
  choice: chegará ao fim
  rationale: Expressa naturalmente a ideia passiva de ser consumado ou terminado, sem sugerir necessariamente destruição.
- source_word: ἡ βασιλεία τοῦ ἐχθροῦ
  choice: o reino do inimigo
  rationale: Tradução direta que mantém tanto o sentido de domínio/reinado quanto a referência não especificada ao inimigo.
theological_decisions:
- issue: Sentido do retorno de Israel
  choice: Israel voltar
  alternative: Israel se converter
  rationale: O grego ἐπιστρέψει admite retorno e conversão. A formulação escolhida conserva essa abertura sem resolver a natureza do retorno.
- issue: Fim do reino do inimigo
  choice: chegará ao fim
  alternative: será destruído
  rationale: A expressão mantém a afirmação escatológica do término do reino sem acrescentar o modo pelo qual isso ocorrerá.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leitura ampla no contexto brasileiro. A ambiguidade de ἐπιστρέψει foi preservada por meio de “voltar”.
