  naturalness: «Afastem-se», «apeguem-se» e «perto de meus antepassados» são naturais, claros e adequados ao registro solene moderno. «Será para salvação para sempre» é uma formulação deliberadamente próxima da construção fonte, necessária para não converter o sentido em posse de salvação.
  terminology: «Justiça de Deus» preserva adequadamente a expressão teológica sem a interpretar. «Descendência» corresponde bem a γένος neste contexto. «Antepassados» comunica corretamente o sentido ancestral de πατέρων no pedido de sepultamento.
