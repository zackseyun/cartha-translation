source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἀπόστητε οὖν ἀπὸ πάσης ἀδικίας καὶ κολλήθητε⁴⁹ τῇ δικαιοσύνῃ τοῦ⁵⁰ Θεοῦ⁵¹, καὶ ἔσται τὸ γένος ὑμῶν⁵² εἰς σωτηρίαν *ἕως τοῦ αἰῶνος⁵³. 11. *Καὶ θάψατέ με⁵⁴ ἐγγὺς τῶν πατέρων μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/010.yaml
  text: Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever. And bury me near my fathers.
translation:
  language: pt
  text: Portanto, afastem-se de toda injustiça e apeguem-se à justiça de Deus; assim, a descendência de vocês será para salvação para sempre. E sepultem-me perto de meus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόστητε
  choice: afastem-se
  rationale: Expressa uma ruptura deliberada com a injustiça em português natural, preservando o imperativo plural.
- source_word: κολλήθητε
  choice: apeguem-se
  rationale: Conserva a imagem de aderir firmemente ou manter-se unido à justiça, sem reduzir o sentido a mera obediência.
- source_word: τῇ δικαιοσύνῃ τοῦ Θεοῦ
  choice: à justiça de Deus
  rationale: Tradução direta que preserva a possível amplitude entre a justiça pertencente a Deus e a justiça por ele requerida.
- source_word: τὸ γένος ὑμῶν
  choice: a descendência de vocês
  rationale: No contexto genealógico, γένος designa os descendentes; 'de vocês' comunica naturalmente o plural em português internacional com boa legibilidade brasileira.
- source_word: εἰς σωτηρίαν
  choice: terá salvação
  rationale: Formulação portuguesa clara para a construção grega de finalidade ou resultado, sem especificar o mecanismo dessa salvação.
- source_word: τῶν πατέρων μου
  choice: meus antepassados
  rationale: No contexto de sepultamento ancestral, evita que 'meus pais' seja entendido apenas como pai e mãe imediatos.
theological_decisions:
- issue: Relação entre a descendência e a salvação em εἰς σωτηρίαν
  choice: a descendência de vocês terá salvação para sempre
  alternative: a descendência de vocês será para salvação para sempre
  rationale: A construção grega pode indicar finalidade ou resultado. A redação escolhida evita o português pouco idiomático da alternativa, mas não acrescenta explicação sobre causa, meio ou natureza da salvação.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural em 'vocês'. A coordenação foi mantida simples e solene. 'Antepassados' esclarece o contexto funerário sem introduzir terminologia confessional.
