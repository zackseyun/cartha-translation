  text: And his name will be in every place in Israel and among the nations.
translation:
  language: pt
  text: E o nome dele estará em todo lugar em Israel e entre as nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ δὲ ὄνομα αὐτοῦ
  choice: E o nome dele
  rationale: Mantém a construção simples do grego; «nome» pode abranger reputação, reconhecimento ou autoridade sem explicitar uma interpretação.
- source_word: ἐν παντὶ τόπῳ Ἰσραήλ
  choice: em todo lugar em Israel
  rationale: Reproduz de modo natural a abrangência distributiva de παντὶ τόπῳ e entende Ἰσραήλ como âmbito geográfico ou comunitário.
- source_word: καὶ ἐν τοῖς ἔθνεσιν
  choice: e entre as nações
  rationale: «Entre as nações» expressa idiomaticamente o plural ἔθνεσιν sem restringi-lo a um sentido pejorativo ou estritamente étnico.
theological_decisions:
- issue: Sentido de «nome»
  choice: Preservar literalmente «nome»
  alternative: Explicitar como «fama», «renome» ou «autoridade»
  rationale: O grego não determina qual aspecto do nome está em vista; a tradução conserva essa abertura sem impor uma leitura teológica.
- issue: Valor futuro de ἔσται subentendido pela frase e pelo contexto da versão consultada
  choice: «estará»
  alternative: «será conhecido»
  rationale: A formulação mantém a predicação existencial/locativa e evita acrescentar a ideia interpretativa de conhecimento ou proclamação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente naturalizada sem eliminar o paralelismo «em Israel / entre as nações».
