base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/006.yaml
  text: But if it is at rest in joy, it recognizes the angel of peace, and he brings it into eternal life.
translation:
  language: pt
  text: Mas, se ela estiver em repouso na alegria, reconhecerá o anjo da paz, e ele a conduzirá à vida eterna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego deste versículo é difícil e apresenta incerteza quanto à leitura e à referência dos pronomes. A oração final traz literalmente “e conduz o a vida eterna”, com objeto masculino; isso não concorda claramente com o antecedente feminino pressuposto nesta tradução.
    reason: Explicita de modo idiomático e preciso a dificuldade do αὐτόν masculino, ao mesmo tempo que preserva no texto a resolução contextual adotada.
lexical_decisions:
- source_word: ἥσυχος
  choice: em repouso
  rationale: Expressa o estado de quietude ou tranquilidade indicado pelo adjetivo grego, evitando sugerir apenas silêncio exterior.
- source_word: ἐν χαρᾷ
  choice: na alegria
  rationale: Mantém a construção preposicional e associa a quietude ao âmbito ou estado de alegria, como na ordem do texto grego.
- source_word: γνωρίζει
  choice: reconhecerá
  rationale: Neste contexto, ‘reconhecer’ comunica melhor a identificação do anjo da paz do que o genérico ‘conhecer’.
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: o anjo da paz
  rationale: Tradução formal e natural que conserva a expressão e sua possível função escatológica sem explicá-la doutrinariamente.
- source_word: εἰς ζωὴν αἰώνιον
  choice: à vida eterna
  rationale: Equivalente português corrente e fiel para a meta do movimento expresso por εἰς.
theological_decisions:
- issue: Sujeito de εἰσφέρει e referente de αὐτόν
  choice: ‘ele a conduzirá’, entendendo o anjo da paz como sujeito e a entidade feminina implícita no contexto como objeto
  alternative: ‘ela o conduzirá’ ou ‘e o conduzirá’, seguindo mecanicamente o masculino αὐτόν no texto transmitido
  rationale: A sequência narrativa e a versão inglesa auditada entendem que o anjo conduz a alma ou disposição à vida eterna. O grego transmitido apresenta dificuldade de gênero e referência, por isso a incerteza é assinalada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A expressão ‘em repouso na alegria’ conserva a formulação incomum do grego sem a tornar artificialmente técnica; o futuro em português dá forma natural à construção condicional.
