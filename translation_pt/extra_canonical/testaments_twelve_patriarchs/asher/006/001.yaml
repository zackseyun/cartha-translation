  text: Therefore take heed, you also, my children, following the commandments of the Lord with singleness of purpose, in truth.
translation:
  language: pt
  text: 6 Portanto, vocês também, meus filhos, estejam atentos aos mandamentos do Senhor, seguindo a verdade com propósito indiviso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por «com propósito indiviso» significa literalmente «com um só rosto» e pode indicar sinceridade, constância ou ausência de duplicidade.
    reason: Esclarece uma expressão grega rara e metafórica cuja força não pode ser reproduzida literalmente em português corrente.
lexical_decisions:
- source_word: Προσέχετε
  choice: estejam atentos
  rationale: O imperativo presente pede atenção contínua ou vigilância; a expressão também admite como complemento direto «os mandamentos do Senhor».
- source_word: τὰς ἐντολὰς Κυρίου
  choice: aos mandamentos do Senhor
  rationale: Mantém o sentido direto de ἐντολάς e a construção sem artigo antes de Κυρίου, que naturalmente se verte «do Senhor».
- source_word: μονοπροσώπως
  choice: com propósito indiviso
  rationale: O advérbio raro significa literalmente algo como «com um só rosto» e, no contexto ético, indica sinceridade, constância ou ausência de duplicidade. «Propósito indiviso» comunica essa unidade interior sem introduzir «coração», palavra ausente do grego.
- source_word: ἀκολουθοῦντες τῇ ἀληθείᾳ
  choice: seguindo a verdade
  rationale: O particípio ἀκολουθοῦντες rege o dativo τῇ ἀληθείᾳ; por isso, a ligação sintática mais direta é «seguindo a verdade», e não apenas «em verdade».
theological_decisions:
- issue: Relação sintática entre «seguir» e «a verdade»
  choice: «seguindo a verdade»
  alternative: «seguindo os mandamentos do Senhor [...] em verdade»
  rationale: A morfologia grega favorece que τῇ ἀληθείᾳ seja o complemento dativo de ἀκολουθοῦντες. A tradução conserva essa relação sem eliminar a possível associação conceitual entre a obediência aos mandamentos e a verdade.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para ampla legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a exortação, o vocativo familiar e a ligação explícita entre seguir e a verdade.
