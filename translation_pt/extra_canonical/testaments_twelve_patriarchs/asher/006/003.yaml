source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: ⌈Ὑμεῖς οὖν, τέκνα μου⁷ᵃ, τὸν νόμον Κυρίου⁹ φυλάξατε· καὶ¹⁰ μὴ προσέχετε *τῷ κακῷ ὡς καλῷ¹¹, ἀλλὰ κατὰ¹² τὸ ὄντως⁹ καλὸν¹³ ἀποβλέπετε, καὶ διατηρεῖτε αὐτὸ ἐν πάσαις ταῖς¹⁴ ἐντολαῖς Κυρίου, εἰς αὐτὸ¹⁵ ἀναστρεφόμενοι, καὶ ἐν αὐτῷ καταπαύοντες¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/003.yaml
  text: You therefore, my children, keep the law of the Lord, and do not look upon evil as good; but look instead to what is truly good, and keep it in all the commandments of the Lord, turning toward it and resting in it.
translation:
  language: pt
  text: Portanto, meus filhos, guardem a lei do Senhor e não considerem o mal como bem; ao contrário, voltem os olhos para o que é verdadeiramente bom e preservem-no em todos os mandamentos do Senhor, voltando-se para ele e nele descansando.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: guardem
  rationale: Expressa a ideia de observar e conservar fielmente a lei, em linguagem bíblica natural e compreensível.
- source_word: μὴ προσέχετε τῷ κακῷ ὡς καλῷ
  choice: não considerem o mal como bem
  rationale: Preserva a advertência contra tratar ou encarar o mal como se fosse bom, sem impor um sentido visual excessivamente literal a προσέχετε.
- source_word: τὸ ὄντως καλὸν ἀποβλέπετε
  choice: voltem os olhos para o que é verdadeiramente bom
  rationale: Mantém a imagem direcional de ἀποβλέπετε e traduz ὄντως de modo explícito.
- source_word: διατηρεῖτε αὐτό
  choice: preservem isso
  rationale: Reflete a força de conservar ou manter cuidadosamente; “isso” retoma aquilo que é verdadeiramente bom.
- source_word: εἰς αὐτὸ ἀναστρεφόμενοι
  choice: voltando-se para o bem
  rationale: Reproduz a orientação indicada por εἰς e evita a estranheza de um pronome ambíguo em português; o referente contextual é o bem verdadeiro.
- source_word: ἐν αὐτῷ καταπαύοντες
  choice: nele encontrando descanso
  rationale: Comunica naturalmente a ideia de repousar no bem, preservando a metáfora do texto.
theological_decisions:
- issue: Referente dos pronomes αὐτό / αὐτῷ
  choice: Aquilo que é verdadeiramente bom / o bem
  alternative: A lei ou o conjunto dos mandamentos do Senhor
  rationale: A concordância e a sequência imediata favorecem τὸ ὄντως καλόν como antecedente. A formulação não identifica além disso o bem com uma doutrina específica.
- issue: Relação entre o bem e os mandamentos
  choice: “preservem isso em todos os mandamentos do Senhor”
  alternative: “cumpram-no mediante todos os mandamentos do Senhor”
  rationale: 'A tradução mantém a construção do grego e sua possível tensão: o bem é conservado no âmbito de todos os mandamentos, sem explicar de forma denominacional a relação entre lei e bondade.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O plural imperativo foi expresso pela forma corrente com “vocês” subentendido. A repetição final de “bem” esclarece o referente sem alterar o conteúdo.
