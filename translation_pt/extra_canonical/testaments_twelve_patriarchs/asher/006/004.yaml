id: T12P.ASH.6.4
reference: Testament of Asher 6:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτι τὰ τέλη τῶν ἀνθρώπων δεικνύουσι¹⁷ τὴν δικαιοσύνην αὐτῶν¹⁸, *καὶ †γνωρίζονται¹⁹ *τοῖς ἀγγέλοις²⁰ Κυρίου, καὶ τοῦ Βελίαρ²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/004.yaml
  text: For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and to Beliar.
translation:
  language: pt
  text: Pois os desfechos das pessoas revelam a justiça delas, e tornam-se conhecidos[a] aos anjos do Senhor e aos de Belial.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação grega desta expressão apresenta incerteza textual na edição utilizada.
    reason: Os sinais críticos da edição marcam γνωρίζονται como textualmente problemático, mas o material fornecido não inclui variantes suficientes para reconstruir uma leitura alternativa.
lexical_decisions:
- source_word: τὰ τέλη
  choice: os desfechos
  rationale: Expressa os resultados finais ou o fim da trajetória das pessoas sem limitar o sentido apenas ao momento da morte.
- source_word: τῶν ἀνθρώπων
  choice: das pessoas
  rationale: Representa de modo inclusivo e natural o sentido genérico de ἀνθρώπων.
- source_word: τὴν δικαιοσύνην αὐτῶν
  choice: a justiça delas
  rationale: Mantém o substantivo teologicamente significativo δικαιοσύνη e sua relação com as pessoas mencionadas.
- source_word: γνωρίζονται
  choice: tornam-se conhecidos
  rationale: Conserva a forma passiva e não explicita além do grego qual antecedente plural deve ser entendido.
- source_word: τοῖς ἀγγέλοις Κυρίου, καὶ τοῦ Βελίαρ
  choice: aos anjos do Senhor e aos de Belial
  rationale: 'Entende o segundo genitivo como elipse de ''anjos'': os anjos pertencentes ao Senhor e os pertencentes a Belial, conforme a construção grega.'
theological_decisions:
- issue: Identidade dos seres associados a Belial
  choice: aos anjos do Senhor e aos de Belial
  alternative: aos anjos do Senhor e a Belial
  rationale: Τοῦ Βελίαρ é genitivo paralelo a Κυρίου e depende naturalmente de ἀγγέλοις; portanto, o texto distingue dois grupos de anjos, sem transformar Belial no segundo destinatário.
- issue: Antecedente implícito de γνωρίζονται
  choice: não explicitar o sujeito na segunda oração
  alternative: e esses desfechos tornam-se conhecidos
  rationale: A ausência do sujeito expresso no grego permite tensão referencial; a redação portuguesa mantém essa abertura em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Desfechos' comunica resultado final sem a estranheza de 'fins dos homens'; a elipse em 'aos de Belial' é natural e reflete a estrutura do grego.
