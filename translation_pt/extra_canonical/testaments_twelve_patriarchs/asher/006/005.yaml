review_pass:
  verdict: revise
  source_fidelity: A tradução principal, «ao qual também servia», reproduz o valor normal de ἐδούλευεν («servia/era escrava de») e preserva a sujeição da alma ao espírito mau. A alternativa da nota, porém, verte esse verbo como causativo («a escravizava»), sentido que não é o valor lexical normal de δουλεύω; além disso, não deve ser tratada como alternativa equivalente sem ressalva crítica.
  naturalness: O português é claro, moderno e adequado. «Alma má», «espírito mau» e «obras más» mantêm deliberadamente a repetição moral do grego. «Pois, quando» é natural, embora a vírgula após «Pois» seja dispensável.
  terminology: «Espírito mau» traduz de maneira direta τὸ πονηρὸν πνεῦμα, sem identificar indevidamente a expressão com uma figura doutrinária específica. «Desejos» conserva a amplitude de ἐπιθυμίαις.
  issues:
  - severity: medium
    issue: A nota apresenta «que também a escravizava» como tradução possível de ἐδούλευεν.
    rationale: δουλεύω significa normalmente «servir», «estar sujeito como escravo», e não «escravizar» (para o qual se esperaria, em regra, δουλόω). O texto transmitido é sintaticamente irregular — ὃ ocorre onde seria esperado um dativo para «ao qual servia» —, mas essa irregularidade deve ser indicada como problema textual/sintático, não resolvida por uma paráfrase causativa lexicalmente imprecisa.
  revised_text: Pois quando a alma má parte, ela é atormentada pelo espírito mau, ao qual também servia em desejos e obras más.[a]
  revised_footnotes:
  - marker: a
    text: 'O texto grego é sintaticamente irregular: o relativo ὃ aparece onde se esperaria uma forma dativa para «ao qual [a alma] servia». A tradução segue o sentido usual de ἐδούλευεν, «servia» ou «era escrava de».'
    reason: Registra a dificuldade do texto sem atribuir a ἐδούλευεν o sentido causativo de «escravizava» nem impor uma reconstrução conjectural.
  revision_rationale: Apenas a nota requer correção substancial. O texto principal é mantido, com pontuação levemente simplificada, porque comunica de modo natural o sentido mais provável do grego e deixa a morte implícita, como no original. A nota revista descreve precisamente a anomalia sintática e evita uma alternativa que excede o valor lexical normal do verbo.
