review_pass:
  verdict: revise
  source_fidelity: 'A oração principal é fiel: βασανίζεται ὑπὸ τοῦ πονηροῦ πνεύματος é bem representado por “é atormentada pelo espírito mau”. A tradução principal de ἐδούλευεν como serviço/sujeição da alma ao espírito corresponde ao sentido provável do contexto e ao uso normal de δουλεύω. Contudo, o texto grego assinalado como corrupto (†) contém uma dificuldade sintática real: o relativo ὃ não dá de modo regular a construção esperada para “ao qual servia”. A alternativa da nota, “que também a escravizava”, não decorre naturalmente do verbo ativo ἐδούλευεν e deve ser removida.'
  naturalness: “Pois, quando uma alma má parte, ela é atormentada pelo espírito mau, ao qual também servia em desejos e obras más” é claro, digno e natural em português contemporâneo. O pronome “ela” torna explícito que a alma é quem servia, sem introduzir uma alegação interpretativa adicional.
  terminology: “Alma má”, “espírito mau”, “desejos” e “obras más” preservam adequadamente a repetição moral de πονηρός e o alcance não necessariamente sexual de ἐπιθυμίαι. “Servia” é preferível a “escravizava”, pois não converte indevidamente δουλεύω em verbo causativo.
  issues:
  - severity: medium
    issue: A nota propõe “que também a escravizava” como alternativa para ἐδούλευεν.
    rationale: δουλεύω significa normalmente servir, estar sujeito como escravo, e não “escravizar” alguém. A nota deve registrar a irregularidade/corrupção sintática da lição grega sem apresentar uma retroversão causativa como se fosse alternativa lexical direta.
  - severity: low
    issue: O sujeito de “servia” pode beneficiar-se de explicitação.
    rationale: Embora “ao qual também servia” seja compreensível, “ela” torna inequívoco em português que a alma, e não o espírito, é o sujeito sem alterar o sentido provável.
  revised_text: Pois, quando uma alma má parte, ela é atormentada pelo espírito mau, ao qual ela também servia em desejos e obras más.[a]
  revised_footnotes:
  - marker: a
    text: 'O texto grego neste ponto é sintaticamente difícil e é assinalado como problemático na edição. A tradução segue o sentido provável: a alma servia ao espírito mau por meio de desejos e obras más.'
    reason: Registra a dificuldade textual sem atribuir a ἐδούλευεν o sentido causativo de “escravizava” e preserva a incerteza da lição.
  revision_rationale: A tradução corrente é mantida em seu sentido principal, mas a nota é corrigida para não transformar o verbo grego em causativo. Acrescenta-se “ela” para explicitar o sujeito em português e a nota passa a descrever precisamente a dificuldade da lição transmitida.
