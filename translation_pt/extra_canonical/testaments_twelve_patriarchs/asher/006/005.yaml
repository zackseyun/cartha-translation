  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/005.yaml
  text: For when a wicked soul departs, it is tormented by the evil spirit, which also enslaved it in lusts and wicked deeds.
translation:
  language: pt
  text: Pois, quando a alma má parte, ela é atormentada pelo espírito mau, ao qual também servia em desejos e obras más.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção grega é difícil. Outra tradução possível é: “que também a escravizava por meio de desejos e obras más”.'
    reason: Preserva a ambiguidade sintática e lexical em torno de ὃ καὶ ἐδούλευεν, sem impor uma única relação entre a alma e o espírito mau.
lexical_decisions:
- source_word: πονηρὰ ἡ ψυχή
  choice: a alma má
  rationale: Reproduz de modo direto o adjetivo πονηρά, que caracteriza moralmente a alma.
- source_word: ἀπέρχεται
  choice: parte
  rationale: Mantém o sentido simples de afastar-se ou partir; no contexto, a referência à morte permanece implícita, como no grego.
- source_word: βασανίζεται
  choice: é atormentada
  rationale: Expressa o valor passivo de βασανίζω e a ideia de sofrimento ou tormento.
- source_word: τοῦ πονηροῦ πνεύματος
  choice: pelo espírito mau
  rationale: Traduz a construção de agente com ὑπό e preserva a repetição de πονηρός.
- source_word: ἐδούλευεν
  choice: servia
  rationale: δουλεύω normalmente significa ser escravo ou prestar serviço. Aqui, 'servia' combina naturalmente com 'ao qual' e conserva a imagem de sujeição sem transformar o verbo, de modo inequívoco, em causativo.
- source_word: ἐν ἐπιθυμίαις καὶ ἔργοις πονηροῖς
  choice: em desejos e obras más
  rationale: Mantém a preposição e a coordenação do original. 'Desejos' evita restringir ἐπιθυμίαις apenas ao campo sexual, e 'obras más' conserva a linguagem moral concreta.
theological_decisions:
- issue: Relação entre a alma e o espírito mau em ὃ καὶ ἐδούλευεν
  choice: ao qual também servia
  alternative: que também a escravizava
  rationale: O verbo δουλεύω favorece o sentido de servir ou viver como escravo, e a alma é o sujeito naturalmente retomado pelo verbo. Contudo, a forma relativa neutra ὃ e a sintaxe difícil permitem que a tradição de tradução entenda o espírito mau como sujeito de uma ação exercida sobre a alma. A tradução principal segue o valor lexical mais comum e registra a alternativa em nota, sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. A repetição de “mau/más” foi mantida para refletir a recorrência de πονηρός no original. A vírgula após “Pois” organiza naturalmente a oração temporal longa.
