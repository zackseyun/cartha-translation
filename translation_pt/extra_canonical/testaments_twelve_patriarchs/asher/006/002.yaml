base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/002.yaml
  text: For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against men.
translation:
  language: pt
  text: Os de duas caras são castigados em dobro, pois não só praticam o mal, mas também aprovam os que o praticam, imitando os espíritos do engano e lutando juntamente contra os seres humanos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ διπρόσωποι
  choice: os de duas caras
  rationale: Expressa de modo natural e compreensível a ideia de pessoas dúplices ou de conduta ambígua, preservando a imagem do grego.
- source_word: δισσῶς κολάζονται
  choice: são castigados em dobro
  rationale: Mantém a correspondência retórica entre a duplicidade das pessoas e a duplicidade do castigo.
- source_word: συνευδοκοῦσι
  choice: aprovam
  rationale: Traduz o consentimento ou a aprovação ativa das ações praticadas por outros, sem acrescentar a ideia mais específica de participação direta.
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: os espíritos do engano
  rationale: Preserva a formulação espiritual do texto e traduz πλάνη como engano, abrangendo desvio e falsidade.
- source_word: κατὰ τῶν ἀνθρώπων συναγωνιζόμενοι
  choice: lutando contra os seres humanos
  rationale: Comunica a ação conjunta e hostil indicada pelo particípio, enquanto 'seres humanos' representa ἀνθρώπων de forma inclusiva e natural.
theological_decisions:
- issue: Natureza dos 'espíritos do engano'
  choice: Preservar a referência como seres ou poderes espirituais sem explicá-la.
  alternative: Interpretar a expressão como impulsos, vícios ou influências abstratas.
  rationale: O grego emprega linguagem pessoal de imitação e ação conjunta; explicitar uma ontologia ou reduzir a expressão a uma metáfora resolveria indevidamente a ambiguidade.
- issue: Relação entre aprovação e culpa
  choice: Manter a aprovação do mal alheio como ação distinta da prática pessoal do mal.
  alternative: Fundir ambas como cumplicidade ou participação no mesmo ato.
  rationale: A construção καὶ... καὶ distingue claramente praticar o mal de aprovar aqueles que o praticam.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão idiomática 'de duas caras' preserva a imagem do original sem recorrer ao termo menos corrente 'dúplice'. A coordenação 'não só... mas também' torna natural em português a dupla acusação do grego.
