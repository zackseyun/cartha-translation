review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: os indivíduos de conduta dupla recebem punição dupla por praticarem o mal e por aprovarem quem o pratica. «Espíritos do engano» traduz adequadamente τὰ πνεύματα τῆς πλάνης e conserva sua referência sem interpretação doutrinária. Contudo, συναγωνιζόμενοι inclui a noção de ação ou luta conjunta, que «lutando contra» não explicita.'
  naturalness: «De duas caras» é idiomático e compreensível, mas o encadeamento «Pois ... porque» é redundante em português. A revisão emprega uma única ligação causal e torna explícita, sem excesso, a ideia de ação conjunta no particípio final.
  terminology: «Castigados em dobro», «mal», «aprovam» e «espíritos do engano» são escolhas adequadas e consistentes com o registro. «Seres humanos» é inclusivo e natural para ἀνθρώπων.
  issues:
  - severity: low
    issue: 'Dupla introdução causal: «Pois ... porque».'
    rationale: Embora reflita superficialmente os δύο ὅτι do texto transmitido, a construção é pouco fluida em português. Uma única conjunção causal comunica a relação sem perda de sentido.
  - severity: medium
    issue: «Lutando contra os seres humanos» não manifesta o elemento συν- de συναγωνιζόμενοι.
    rationale: O particípio sugere luta ou atuação em conjunto; «lutando juntamente contra» preserva essa nuance sem determinar indevidamente com quem se dá a associação.
  revised_text: Os de duas caras são castigados em dobro, pois não só praticam o mal, mas também aprovam os que o praticam, imitando os espíritos do engano e lutando juntamente contra os seres humanos.
