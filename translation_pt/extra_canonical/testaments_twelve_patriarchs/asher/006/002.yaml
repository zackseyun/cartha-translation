- from: Pois os de duas caras são castigados em dobro, porque não só praticam o mal, mas também aprovam os que o praticam, imitando os espíritos do engano e lutando contra os seres humanos.
  to: Os de duas caras são castigados em dobro, pois não só praticam o mal, mas também aprovam os que o praticam, imitando os espíritos do engano e lutando juntamente contra os seres humanos.
  rationale: A revisão elimina a redundância causal e restitui a nuance de ação conjunta presente em συναγωνιζόμενοι. Mantém as escolhas adequadas do rascunho para a duplicidade, a punição, a aprovação do mal e os espíritos do engano, sem resolver ambiguidades teológicas.
