base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006.yaml
  text: 'Therefore take heed, you also, my children, following the commandments of the Lord with a single face, in truth. For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against mankind. You therefore, my children, keep the law of the Lord, and do not attend to evil as though it were good; but look instead to what is truly good, and preserve it in all the commandments of the Lord, conducting yourselves in it and resting in it. For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and of Beliar. For when a wicked soul departs, it is tormented by the evil spirit, which it also served in lusts and wicked deeds. But if it is peaceful in joy, it knows the angel of peace, and rejoices in him; and at its death he leads it into eternal life. And it does not come into the destruction of Beliar, as do the souls of sinners. You see, therefore, that in the last
    times the sons of truth will escape the spirits of deceit and Beliar, but the sons of lawlessness will be destroyed. For the latter will hand over their souls to Beliar in confusion, but the former will be found in joy. For every one of those who are double-faced, though he says, ''I am for the Lord,'' serves Beliar, and his works go to the evil one. Be persuaded, therefore, my children, that there are two ways of all things, one of good and one of evil; and in these are the two dispositions in our breasts that discern them. Therefore if the soul takes pleasure in the good, all its deeds are in righteousness; and if it sins, it immediately repents. For, having its mind set on righteousness and hating wickedness, it casts away the evil and roots out the sin. But if it inclines to evil, all its deeds are in wickedness, and it drives away the good and clings to the evil, and is ruled by Beliar. For even if it does what is good, it twists it toward evil. For when it begins to do good, it
    brings the end of the action over to evil, since the treasure of its inclination is filled with an evil spirit. Another may steal, deal unjustly, plunder, defraud, and yet show compassion to the poor: this too has a double face, but the whole is evil. He who defrauds his neighbor provokes God, and swears falsely by the Most High, and yet has pity on the poor. The Lord who gave the law he sets at naught and provokes, yet he refreshes the poor. He defiles the soul and makes the body glad; he kills many and has mercy on a few: this too has a double face. Another does not commit adultery, nor fornication, and abstains from foods, but when he fasts he does evil, and by his power and his wealth he overthrows many; and despite his excessive goodness, he practices lawlessness: this too has a double face. Such men are hares, clean like those that divide the hoof, but in fact they are unclean. For God said in the tablets of the commandments. But do not become, my children, like Sodom, which did
    not recognize the angels of the Lord and perished forever. For I know that you will sin, and be handed over into the hands of your enemies; and your land will be made desolate, and your holy places destroyed, and you will be scattered to the four corners of the earth. And you will be counted in the dispersion as water that vanishes, until the Most High visits the earth, himself coming as a man, with men eating and drinking, and breaking the head of the dragon in the water. He will save Israel and all the nations, God speaking in the person of man. Therefore tell these things to your children also, that they may disobey him. For I know that they will surely be lawless and will not heed the law of God, but the commandments of men; and they will be scattered as leaves are scattered by the wind, and as water is dispersed. But you, my children, if you walk in holiness according to the commandments of the Lord, you will dwell again in safety, and all Israel will be gathered to the Lord.'
translation:
  language: pt
  text: '**Testamento de Aser 6**


    1 Portanto, vocês também, meus filhos, estejam atentos aos mandamentos do Senhor, seguindo a verdade sem duplicidade. 2 Pois os que têm duas faces recebem castigo duplo, porque não somente praticam o mal, mas também aprovam os que o praticam, imitando os espíritos do engano e unindo-se a eles na luta contra a humanidade.


    3 Portanto, meus filhos, guardem a lei do Senhor. Não deem atenção ao mal como se fosse bom; pelo contrário, mantenham os olhos fixos no que é verdadeiramente bom. Preservem-no em todos os mandamentos do Senhor, vivam nele e nele encontrem descanso. 4 Pois o fim de cada pessoa revela sua justiça, e elas se tornam conhecidas aos anjos do Senhor e aos de Beliar.


    5 Quando uma alma má parte, ela é atormentada pelo espírito maligno ao qual serviu em desejos e obras más. 6 Mas, se estiver serena em alegria, reconhecerá o anjo da paz, e ele a conduzirá à vida eterna.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego deste versículo apresenta dificuldades e variantes. A tradução segue a leitura breve preservada na fonte fornecida: a alma serena reconhece o anjo da paz, e ele a conduz à vida eterna. Algumas formas do texto trazem material adicional.'
    reason: Sinalizar honestamente a instabilidade textual e a mudança implícita de sujeito, sem incorporar as expansões presentes apenas na camada inglesa.
lexical_decisions:
- source_word: μονοπροσώπως
  choice: sem duplicidade
  rationale: O advérbio significa literalmente agir «com uma só face». Em português corrente, «sem duplicidade» preserva o contraste com διπρόσωποι no versículo seguinte sem produzir uma expressão opaca.
- source_word: διπρόσωποι
  choice: os que têm duas faces
  rationale: Mantém a imagem ética do original e sua ligação deliberada com μονοπροσώπως, evitando reduzi-la apenas a «hipócritas».
- source_word: συνευδοκοῦσιν
  choice: aprovam
  rationale: Expressa concordância ou anuência ativa com os que praticam o mal.
- source_word: συναγωνιζόμενοι
  choice: unindo-se a eles na luta
  rationale: Reproduz a ideia de combater ao lado de alguém; o referente aos espíritos é explicitado de modo mínimo para a clareza sintática.
- source_word: ἀναστρεφόμενοι
  choice: vivam
  rationale: Neste contexto, o particípio se refere à conduta ou modo de vida, não apenas a movimento físico.
- source_word: τὰ τέλη τῶν ἀνθρώπων
  choice: o fim de cada pessoa
  rationale: O plural grego aponta para os desfechos das vidas humanas. A formulação distributiva é natural em português e preserva o sentido moral e escatológico.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Transliteração tradicional do nome próprio presente no texto grego, sem identificá-lo interpretativamente com outro nome.
- source_word: ἐπιθυμίαις
  choice: desejos
  rationale: Termo amplo que pode designar desejos ou apetites; evita acrescentar uma conotação exclusivamente sexual.
- source_word: εἰσφέρει
  choice: conduzirá
  rationale: No contexto, comunica a entrada da alma na vida eterna. O sujeito masculino mais próximo é «o anjo da paz».
theological_decisions:
- issue: Relação entre obras, fim da vida e justiça no v. 4
  choice: «o fim de cada pessoa revela sua justiça»
  alternative: «a morte das pessoas demonstra que elas são justas»
  rationale: A tradução mantém a formulação do texto sem transformá-la numa definição sistemática de justificação nem restringir τέλη exclusivamente ao instante da morte.
- issue: Agentes espirituais no v. 4
  choice: «os anjos do Senhor e os de Beliar»
  alternative: «os anjos do Senhor e Beliar»
  rationale: A construção grega coordena os anjos pertencentes ao Senhor e a Beliar. A elipse portuguesa «os de» preserva essa relação sem sugerir que Beliar seja pessoalmente o segundo observador.
- issue: Destino da alma no v. 6
  choice: O anjo da paz conduz a alma à vida eterna
  alternative: A alma conduz o anjo da paz à vida eterna
  rationale: Embora haja mudança não marcada de sujeito, a concordância e o sentido favorecem o anjo como sujeito de εἰσφέρει e a alma como objeto. A incerteza textual e sintática é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Empregou-se «vocês» e imperativos correspondentes para uma exortação natural. A metáfora das «duas faces» foi preservada onde é central; no primeiro versículo, «sem duplicidade» evita artificialidade, mantendo a ligação conceitual. A tradução limita-se rigorosamente ao texto grego fornecido para o capítulo 6 e não incorpora a continuação extensa da camada inglesa, que não está presente na fonte original apresentada.
