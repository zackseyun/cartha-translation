  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008.yaml
  text: And after saying these things to them[a], he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep. And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: pt
  text: '**Testamento de Aser 8**


    ¹ Depois de lhes dizer essas coisas, ordenou-lhes: “Sepultem-me em Hebrom”. E morreu, tendo adormecido em um bom sono[a]. ² Seus filhos fizeram tudo o que ele lhes havia ordenado; levaram-no para Hebrom e o sepultaram com seus pais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “morreu, tendo adormecido em um bom sono”, combinando a declaração direta da morte com a imagem tradicional do sono.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: ordenou-lhes / havia ordenado
  rationale: O verbo expressa uma instrução final com força de ordem. A repetição em português acompanha as duas ocorrências gregas e mantém a ligação narrativa.
- source_word: Θάψατέ
  choice: Sepultem-me
  rationale: Traduz diretamente o imperativo funerário. “Sepultar” é claro, digno e natural neste contexto.
- source_word: Χεβρών
  choice: Hebrom
  rationale: Emprega a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Mantém a declaração explícita de morte, sem substituí-la pela imagem de sono que vem em seguida.
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: tendo adormecido em um bom sono
  rationale: Preserva tanto a metáfora do sono quanto a repetição lexical do grego, ainda que a expressão seja incomum em português; a nota esclarece sua literalidade.
- source_word: ἀπήγαγον
  choice: levaram-no
  rationale: Indica o transporte do corpo até Hebrom de maneira natural, sem acrescentar um meio de transporte não expresso no texto.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: com seus pais
  rationale: Conserva a fórmula tradicional de parentesco e sepultamento, em vez de explicá-la como “antepassados”.
theological_decisions:
- issue: A morte descrita mediante a imagem do sono
  choice: Manter conjuntamente “morreu” e “tendo adormecido em um bom sono”
  alternative: Resumir como “morreu em paz” ou empregar apenas “adormeceu”
  rationale: O grego combina uma declaração direta da morte com uma expressão figurada baseada no sono. Preservar ambas evita eliminar a tensão e a textura literária do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A formulação incomum “adormecido em um bom sono” foi mantida por fidelidade à repetição deliberada do grego e esclarecida em nota.
