id: T12P.ASH.3.2
reference: Testament of Asher 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Τὴν ⌜δὲ⌝ κακίαν ἀποδράσατε¹⁰, ἀναιροῦντες *τὸ διαβούλιον¹¹ ἐν ταῖς ἀγαθαῖς ὑμῶν πράξεσι, ὅτι οἱ διπρόσωποι *οὐκ εἰσὶ τοῦ Θεοῦ¹², ἀλλὰ ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν, ἵνα τῷ Βελίαρ ἀρέσωσιν, καὶ τοῖς ὁμοίοις¹³ αὐτῶν ἀνθρώποις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/002.yaml
  text: But flee wickedness, destroying its plan by your good deeds; for the double-faced are not of God, but are enslaved to their own desires, so that they may please Beliar[b].
translation:
  language: pt
  text: Mas fujam da maldade, destruindo o plano dela por meio das boas ações de vocês; pois os que têm duas caras não pertencem a Deus, mas são escravos dos próprios desejos, a fim de agradarem a Beliar[a] e às pessoas semelhantes a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar é a forma grega do nome muitas vezes vertido como Belial.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακίαν
  choice: maldade
  rationale: Expressa de modo natural o mal moral aqui personificado como algo do qual se deve fugir.
- source_word: ἀποδράσατε
  choice: fujam
  rationale: Imperativo plural que transmite diretamente a ideia de escapar ou fugir.
- source_word: τὸ διαβούλιον
  choice: o plano dela
  rationale: O substantivo indica plano ou desígnio; “dela” explicita a referência contextual à maldade sem alterar o sentido.
- source_word: διπρόσωποι
  choice: os que têm duas caras
  rationale: Preserva a imagem concreta de pessoas divididas ou dissimuladas, em linguagem portuguesa compreensível.
- source_word: δουλεύουσιν
  choice: são escravos
  rationale: Retém a força de δουλεύω, que descreve escravidão ou sujeição, e não mero serviço voluntário.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma grega do nome, com esclarecimento em nota.
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: às pessoas semelhantes a eles
  rationale: Inclui a oração final presente no texto grego, embora ausente da camada inglesa fornecida.
theological_decisions:
- issue: Sentido de οὐκ εἰσὶ τοῦ Θεοῦ
  choice: não pertencem a Deus
  alternative: não são de Deus
  rationale: “Pertencem a Deus” comunica naturalmente a relação expressa pelo genitivo, sem definir de modo mais estreito sua natureza teológica.
- issue: Finalidade expressa por ἵνα
  choice: a fim de agradarem
  alternative: de modo que agradem
  rationale: Mantém a força final mais provável da construção, sem explicar por que os desejos conduzem a esse resultado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora “duas caras” e a linguagem forte de escravidão foram preservadas; a cláusula final do grego também foi mantida.
