id: T12P.ASH.3.1
reference: Testament of Asher 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: III. Ὑμεῖς¹ δὲ², *τέκνα μου³, μὴ γίνεσθε *κατ᾽ αὐτοὺς⁴ διπρόσωποι, ἀγαθότητος καὶ κακίας, ἀλλὰ τῇ ἀγαθότητι μόνῃ⁵ κολλήθητε, ὅτι ⌜Κύριος⌝⁶ ὁ Θεὸς *ἀναπαύεται ἐν⁷ αὐτῇ⁸, καὶ οἱ ἄνθρωποι *αὐτὴν ποθοῦσιν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/001.yaml
  text: But you, my children, do not become double-faced[a] like them, in goodness and wickedness, but cling to goodness alone, because the Lord God rests in it, and people long for it.
translation:
  language: pt
  text: Mas vocês, meus filhos, não se tornem, como eles, pessoas de duas faces[a], divididas entre a bondade e a maldade. Apeguem-se somente à bondade, porque nela repousa o Senhor Deus, e as pessoas anseiam por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de duas caras”. O termo grego retrata um caráter moral dividido, e não apenas falsidade ou insinceridade social.
    reason: lexical_alternative
lexical_decisions:
- source_word: διπρόσωποι
  choice: pessoas de duas faces
  rationale: Preserva a imagem concreta do grego e, com a nota, comunica um caráter moral dividido, não apenas falsidade social.
- source_word: κολλήθητε
  choice: Apeguem-se
  rationale: Expressa naturalmente a ideia de aderir firmemente ou unir-se à bondade.
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: nela repousa
  rationale: Mantém a metáfora e a referência pronominal à bondade sem explicação interpretativa adicional.
- source_word: ποθοῦσιν
  choice: anseiam por
  rationale: Reproduz a força de desejo intenso do verbo grego em português corrente e digno.
theological_decisions:
- issue: Sentido de διπρόσωποι em relação à bondade e à maldade
  choice: Manter a imagem de pessoas de duas faces e explicitar no texto a divisão entre bondade e maldade
  alternative: Traduzir apenas como “hipócritas” ou “falsos”
  rationale: O contexto descreve duplicidade moral entre dois caminhos, e não simplesmente insinceridade nas relações sociais.
- issue: Referente dos pronomes femininos αὐτῇ e αὐτήν
  choice: bondade
  alternative: uma realidade mais ampla, como o caminho do bem
  rationale: O antecedente gramatical feminino singular mais direto é ἀγαθότητι, “bondade”.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A segunda pessoa plural grega foi vertida por “vocês”, e a estrutura foi levemente desdobrada em duas frases para evitar a leitura de que “bondade e maldade” qualificariam ambas igualmente as “duas faces” de maneira pouco natural.
