source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: ⌈Τὴν⁴³ ψυχὴν σπιλοῖ, καὶ⌉ τὸ σῶμα λαμπρύνει⁴⁴, πολλοὺς ἀναιρεῖ καὶ ὀλίγους ἐλεεῖ, καὶ τοῦτο⁴⁵ διπρόσωπόν⁴⁶ ἐστι, *τὸ δὲ ὅλον πονηρόν ἐστιν⁴⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/007.yaml
  text: It stains the soul and makes the body bright; it kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.
translation:
  language: pt
  text: Isso mancha a alma e faz o corpo brilhar; mata muitos e tem misericórdia de poucos. Isso também tem duas faces, mas, em seu conjunto, é mau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπιλοῖ
  choice: mancha
  rationale: Reproduz diretamente a imagem de contaminar ou macular a alma, em linguagem corrente e digna.
- source_word: λαμπρύνει
  choice: faz ... brilhar
  rationale: Mantém o contraste deliberado entre a alma manchada e o corpo exteriormente resplandecente, sem explicar além do grego.
- source_word: ἀναιρεῖ
  choice: mata
  rationale: Expressa o sentido forte de tirar a vida, conforme o contexto e a tradução inglesa auditada.
- source_word: ἐλεεῖ
  choice: tem misericórdia de
  rationale: Conserva o vocabulário ético do original e soa natural em português.
- source_word: διπρόσωπον
  choice: tem duas faces
  rationale: Preserva a metáfora de duplicidade de modo claro, evitando o menos corrente «duas-caras» como predicativo abstrato.
- source_word: τὸ ὅλον πονηρόν
  choice: em seu todo, é má
  rationale: Mantém a avaliação abrangente do original e a concordância com o referente feminino implícito no contexto português.
theological_decisions:
- issue: Referente do sujeito neutro implícito
  choice: Pronome feminino «ela», retomando o referente contextual presumido
  alternative: Pronome neutro conceitual «isso»
  rationale: O grego permite que o sujeito seja recuperado do contexto; em português, o feminino oferece uma retomada natural sem transformar o referente em pessoa masculina. A formulação não especifica uma doutrina nem resolve a identidade além do necessário.
- issue: Alcance de τὸ ὅλον
  choice: «em seu todo»
  alternative: «tudo isso» ou «o conjunto»
  rationale: Preserva a tensão de que algo pode exibir efeitos contrastantes e, ainda assim, ser avaliado como inteiramente mau.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A frase conserva o paralelismo antitético e o tom sapiencial do grego. Não foram necessárias notas de rodapé.
