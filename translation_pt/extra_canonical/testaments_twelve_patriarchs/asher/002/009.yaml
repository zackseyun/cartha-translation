source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Οἱ τοιοῦτοί εἰσι⁶¹ δασύποδες, ὅτι⁶² ἐξ ἡμισείας εἰσὶ καθαροί, τὸ δ᾽ ἀληθὲς⁶³ ἀκάθαρτοί εἰσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/009.yaml
  text: Such people are like hares, because they are half clean, but in truth they are unclean.
translation:
  language: pt
  text: Essas pessoas são como lebres, pois são puras pela metade, mas, na verdade, são impuras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δασύποδες
  choice: como lebres
  rationale: O termo grego significa literalmente “pés peludos”, mas é usado para designar lebres. A comparação explícita em português transmite com naturalidade a aplicação metafórica às pessoas mencionadas.
- source_word: ἐξ ἡμισείας ... καθαροί
  choice: limpas pela metade
  rationale: 'Preserva a imagem deliberadamente paradoxal do texto: a lebre aparenta cumprir apenas parte dos critérios de pureza alimentar.'
- source_word: τὸ δ᾽ ἀληθὲς ἀκάθαρτοί
  choice: mas, na verdade, são impuras
  rationale: Reproduz o contraste entre pureza parcial ou aparente e a classificação efetiva como impuras.
theological_decisions:
- issue: A pureza parcial atribuída à lebre
  choice: Manter “limpas pela metade” sem explicar no corpo do texto
  alternative: Explicitar que a lebre aparenta ruminar, mas não tem o casco fendido
  rationale: O original pressupõe as leis alimentares e usa sua tensão como metáfora. Explicá-las no versículo acrescentaria conteúdo não expresso e enfraqueceria a concisão retórica.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. “Lebres” evita o literalismo obscuro de “pés peludos”; “como” torna natural a identificação metafórica já refletida na camada inglesa auditada.
