  - severity: medium
    issue: «até» traduz inadequadamente καὶ
    rationale: Neste contexto, καὶ tem valor aditivo («também»), não necessariamente intensivo ou terminal («até»).
  - severity: low
    issue: Referente pessoal apresentado como definido
    rationale: A sequência em torno de τὸ ὅλον e διπρόσωπον é marcada como problemática na edição. «É uma pessoa de duas faces», acompanhado da nota, comunica a leitura pessoal sem a fazer parecer inequívoca.
