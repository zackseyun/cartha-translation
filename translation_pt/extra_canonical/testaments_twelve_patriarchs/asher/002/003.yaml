  source_fidelity: 'A tradução acompanha adequadamente a estrutura geral e assinala as duas passagens textualmente problemáticas. Contudo, «por causa dela» não tem apoio no texto grego apresentado: a relação causal/pessoal explicitada pela trilha inglesa não está expressa aqui. Além disso, καὶ é melhor representado por «também» do que por «até».'
  naturalness: O português é claro e de registro apropriado. «Tem duas faces» é compreensível, mas «é uma pessoa de duas faces» flui melhor neste contexto e evita sugerir uma identificação excessivamente definida do antecedente.
  terminology: «Pratica o mal», «morrer no mal» e «ação má» são escolhas adequadas e semanticamente sóbrias. A formulação da primeira nota deve indicar que a incerteza decorre da edição e que a oração é abrupta, sem apresentar a glosa como se fosse uma explicação segura.
