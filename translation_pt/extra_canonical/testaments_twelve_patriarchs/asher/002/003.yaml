revisions:
- from: E há quem ame uma pessoa que pratica o mal — o que é maldade[a] —, pois escolhe até morrer no mal por causa dela. Quanto a isso, é evidente que ele tem duas faces[b]; mas tudo isso é uma ação má.
  to: E há quem ame uma pessoa que pratica o mal — isto é maldade[a] —, pois também escolhe morrer no mal. Quanto a isso, é evidente que é uma pessoa de duas faces[b]; mas tudo isso é uma ação má.
  rationale: A revisão elimina uma relação causal não expressa no grego e traduz καὶ por «também». Conserva as incertezas textuais em notas e mantém uma leitura pessoal de διπρόσωπον, que é idiomática em português e compatível com a trilha inglesa, sem ocultar a alternativa textual.
