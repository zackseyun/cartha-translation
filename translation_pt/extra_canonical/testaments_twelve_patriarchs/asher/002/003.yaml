source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἔστιν ἄνθρωπος ἀγαπῶν πονηρευόμενον †ὃ ἐστι πονηρία†¹³, ὅτι καὶ ἀποθανεῖν αἱρεῖται ἐν κακῷ· καὶ περὶ τούτου φανερόν ἐστι †τὸ ὅλον†¹⁴ διπρόσωπόν ἐστι τὸ δὲ πᾶν κακὴ πρᾶξις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/003.yaml
  text: And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man's account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.
translation:
  language: pt
  text: E há quem ame uma pessoa que pratica o mal — isto é maldade[a] —, pois também escolhe morrer no mal. Quanto a isso, é evidente que é uma pessoa de duas faces[b]; mas tudo isso é uma ação má.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por «isto é maldade» está textualmente incerta.
    reason: O trecho ὃ ἐστι πονηρία é assinalado como problemático na edição-fonte e tem construção abrupta.
  - marker: b
    text: O texto grego é incerto neste ponto; literalmente, a leitura preservada pode ser entendida como «o todo é de duas faces».
    reason: A expressão τὸ ὅλον é assinalada como problemática, e a sintaxe deixa incerto se a afirmação se refere à pessoa ou ao ato ou situação como um todo.
lexical_decisions:
- source_word: πονηρευόμενον
  choice: uma pessoa que pratica o mal
  rationale: Expressa naturalmente o particípio presente, preservando a ideia de conduta má contínua ou característica sem transformar o termo em um rótulo fixo.
- source_word: ἀποθανεῖν αἱρεῖται ἐν κακῷ
  choice: escolhe até morrer no mal
  rationale: Mantém o sentido forte de escolha deliberada e a formulação moralmente ambígua de ἐν κακῷ, sem especificar além do texto se se trata de morrer praticando o mal ou em condição de mal.
- source_word: διπρόσωπον
  choice: tem duas faces
  rationale: Conserva a imagem concreta do grego e o tema da duplicidade desenvolvido no contexto, em linguagem compreensível ao leitor moderno.
- source_word: κακὴ πρᾶξις
  choice: uma ação má
  rationale: Tradução direta e natural que preserva a avaliação ética do ato.
theological_decisions:
- issue: Referente e relação causal em ὅτι καὶ ἀποθανεῖν αἱρεῖται ἐν κακῷ
  choice: “pois escolhe até morrer no mal por causa dela”
  alternative: “pois também escolhe morrer no mal; e, quanto a isso...”
  rationale: A redação escolhida segue a relação pessoal refletida na camada inglesa auditada, mas mantém “no mal” sem explicar dogmaticamente a natureza dessa morte. O grego é sintaticamente difícil, e a pontuação não elimina toda ambiguidade.
- issue: Sujeito de διπρόσωπον
  choice: “ele tem duas faces”
  alternative: “o conjunto é de duas faces”
  rationale: A leitura pessoal produz português inteligível e corresponde ao sentido contextual de duplicidade; a expressão grega τὸ ὅλον está textualmente assinalada como incerta, por isso a alternativa literal é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções claras. A metáfora “duas faces” foi mantida por ser transparente em português e por conservar a imagem do original. As incertezas do texto grego foram sinalizadas sem sobrecarregar o corpo do versículo.
