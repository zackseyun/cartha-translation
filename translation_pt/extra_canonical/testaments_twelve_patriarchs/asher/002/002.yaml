base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/002.yaml
  text: There is a man who does not pity his servants; and though this is double-faced, the whole of it is evil.
translation:
  language: pt
  text: Há um homem que não se compadece de seus servos. E, contudo, isso é de duas faces, mas, em seu conjunto, é mau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔστιν ἄνθρωπος ὃς
  choice: Há quem
  rationale: Expressa com naturalidade a construção existencial grega, sem tornar ἄνθρωπος desnecessariamente específico quanto ao gênero.
- source_word: οὐκ οἰκτείρει
  choice: não tenha compaixão
  rationale: Transmite a ideia de não se compadecer ou não mostrar misericórdia, em linguagem corrente e digna.
- source_word: λειτουργοὺς αὐτοῦ
  choice: seus servos
  rationale: No contexto, λειτουργούς designa pessoas que lhe prestam serviço; o possessivo traduz αὐτοῦ sem acrescentar a ênfase de 'próprios'.
- source_word: διπρόσωπον
  choice: tenha duas faces
  rationale: Preserva a metáfora de algo 'de duas faces', importante no contraste ético do contexto, sem reduzi-la interpretativamente a mera hipocrisia.
- source_word: τὸ ὅλον πονηρόν ἐστιν
  choice: é inteiramente mau
  rationale: Reproduz o juízo sobre o todo da conduta em português natural, mantendo a força moral de πονηρόν.
theological_decisions:
- issue: Sentido moral de διπρόσωπον
  choice: duas faces
  alternative: ambíguo; hipócrita; misto
  rationale: A tradução mantém a imagem e a tensão do original, evitando decidir se a expressão indica duplicidade, mistura de bem e mal ou aparência contraditória.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom sapiencial digno. A formulação concisa preserva a estrutura de exemplo moral e evita explicações não presentes no grego.
