id: T12P.ASH.2.8
reference: Testament of Asher 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος⁴⁸ μοιχεύει *καὶ πορνεύει⁴⁹ καὶ ἀπέχεται ἐδεσμάτων⁵⁰. καὶ⁵¹ νηστεύων κακοποιεῖ, καὶ τῇ³⁵ δυναστείᾳ *τοῦ πλούτου⁵² πολλοὺς κατασύρει⁵³, καὶ ἐκ⁵⁴ τῆς ὑπερόγκου⁵⁵ κακίας ποιεῖ⁵⁶ ⌈τὰς⌉⁵⁷ ἐντολάς⁵⁸. τοῦτο διπρόσωπόν ἐστιν⁵⁹, *τὸ δὲ ὅλον⁶⁰ κακόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/008.yaml
  text: Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the power of wealth he drags many down, and out of excessive wickedness keeps the commandments. This is double-faced, but it is altogether evil.
translation:
  language: pt
  text: Outro comete adultério e pratica imoralidade sexual, e se abstém de alimentos. Enquanto jejua, faz o mal; pelo poder da riqueza, arrasta muitos para baixo e, movido por uma maldade excessiva, cumpre os mandamentos. Isso tem duas faces, mas é inteiramente mau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεύει καὶ πορνεύει
  choice: comete adultério e pratica imoralidade sexual
  rationale: Mantém a distinção entre adultério e a categoria mais ampla de conduta sexual ilícita, em linguagem atual e clara.
- source_word: ἀπέχεται ἐδεσμάτων
  choice: se abstém de alimentos
  rationale: Reproduz de modo direto a abstinência alimentar, sem especificar alimentos que o grego não identifica.
- source_word: τῇ δυναστείᾳ τοῦ πλούτου
  choice: pelo poder da riqueza
  rationale: Conserva a ideia de que a riqueza exerce poder ou domínio, sem acrescentar um possessivo ausente do texto.
- source_word: πολλοὺς κατασύρει
  choice: arrasta muitos para baixo
  rationale: Preserva a imagem vigorosa de κατασύρει, que indica arrastar para baixo ou levar à ruína.
- source_word: ποιεῖ τὰς ἐντολάς
  choice: cumpre os mandamentos
  rationale: Expressa idiomaticamente a ação de pôr os mandamentos em prática, mantendo o paradoxo da frase.
- source_word: διπρόσωπόν
  choice: tem duas faces
  rationale: Conserva a metáfora literal da duplicidade, com formulação natural em português.
- source_word: τὸ δὲ ὅλον κακόν ἐστιν
  choice: mas é inteiramente mau
  rationale: Transmite a avaliação global e enfática do grego em português corrente.
theological_decisions:
- issue: A prática dos mandamentos aparece ligada a uma motivação perversa.
  choice: movido por uma maldade excessiva, cumpre os mandamentos
  alternative: apesar de sua maldade excessiva, cumpre os mandamentos
  rationale: O grego ἐκ τῆς ὑπερόγκου κακίας apresenta a maldade como origem ou impulso, não como simples contraste. A tradução preserva a tensão moral deliberada sem explicá-la ou suavizá-la.
- issue: Avaliação da conduta religiosa misturada ao mal.
  choice: Isso tem duas faces, mas é inteiramente mau.
  alternative: Isso é hipócrita, mas no todo é mau.
  rationale: A metáfora de duas faces é mantida, evitando reduzir διπρόσωπον ao conceito interpretativo mais específico de hipocrisia; a conclusão condenatória permanece inequívoca.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A repetição coordenada e os contrastes paradoxais do original foram preservados sem importar terminologia confessional.
