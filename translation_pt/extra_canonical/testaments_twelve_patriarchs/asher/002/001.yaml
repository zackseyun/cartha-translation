base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/001.yaml
  text: There is, then, a soul that in words turns away from the good for the sake of evil, and leads the outcome of the matter into wickedness.
translation:
  language: pt
  text: Há, portanto, uma alma que, em palavras, se afasta do bem em favor do mal e conduz o desfecho do assunto à maldade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχὴ
  choice: alma
  rationale: Mantém o equivalente direto e natural do grego, sem restringir o termo a “pessoa” ou “mente”.
- source_word: ἐν λόγοις
  choice: em palavras
  rationale: Reproduz a expressão grega de modo conciso, preservando o possível contraste entre palavras e conduta.
- source_word: ἀφιστῶσα τὸ καλὸν
  choice: se afasta do bem
  rationale: Entende o particípio em sentido intransitivo com afastamento de algo, leitura gramaticalmente natural e refletida na revisão inglesa.
- source_word: ὑπὲρ τοῦ κακοῦ
  choice: por causa do mal
  rationale: Preserva o valor causal ou motivacional de ὑπέρ no contexto, sem explicitar além do texto se o mal é finalidade ou benefício.
- source_word: τὸ τέλος τοῦ πράγματος
  choice: o resultado da questão
  rationale: Traduz τέλος como desfecho ou resultado e πρᾶγμα como questão, mantendo a formulação relativamente ampla.
- source_word: εἰς κακίαν ἄγων
  choice: conduz ... à maldade
  rationale: Conserva a imagem verbal de levar ou conduzir a um estado moral mau.
theological_decisions:
- issue: Natureza da “alma” descrita
  choice: uma alma
  alternative: a alma
  rationale: O texto grego permite uma formulação existencial; o indefinido evita transformar a declaração em afirmação universal sobre toda alma.
- issue: Relação entre o bem e o mal
  choice: se afasta do bem por causa do mal
  alternative: abandona o bem em favor do mal
  rationale: A escolha mantém a tensão e a relativa ambiguidade de ὑπέρ, sem tornar explícita uma troca deliberada mais forte do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição conceitual de “mal” e “maldade” foi mantida para refletir κακόν e κακία.
