  - severity: low
    issue: “resultado da questão” para τὸ τέλος τοῦ πράγματος
    rationale: A formulação é defensável, mas “desfecho do assunto” comunica com maior naturalidade o sentido amplo de πρᾶγμα e o valor de resultado final de τέλος.
  revised_text: Há, portanto, uma alma que, em palavras, se afasta do bem em favor do mal e conduz o desfecho do assunto à maldade.
