  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/005.yaml
  text: Another steals, acts unjustly, plunders, is greedy, and shows mercy to the poor. This too is double-faced, but the whole of it is evil.
translation:
  language: pt
  text: Outro rouba, comete injustiça, saqueia, age com ganância e mostra misericórdia aos pobres. Isso também tem duas faces, mas, no seu conjunto, é mau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδικεῖ
  choice: comete injustiça
  rationale: Expressa de modo natural e abrangente a ação injusta indicada pelo verbo, sem restringi-la a uma forma específica de dano.
- source_word: ἁρπάζει
  choice: saqueia
  rationale: Preserva a força de tomar bens de modo violento ou predatório e o distingue de κλέπτει, “rouba”.
- source_word: πλεονεκτεῖ
  choice: age com ganância
  rationale: Reproduz a ideia de buscar vantagem ou ganho indevido, mantendo aqui a sequência verbal do grego.
- source_word: ἐλεεῖ πτωχούς
  choice: mostra misericórdia aos pobres
  rationale: Mantém o sentido direto de exercer compaixão ou misericórdia para com pessoas pobres.
- source_word: διπρόσωπον
  choice: tem duas faces
  rationale: Conserva a imagem metafórica do grego em português claro, em vez de reduzir o termo apenas a “hipócrita”.
- source_word: τὸ δὲ ὅλον πονηρόν ἐστιν
  choice: mas, no seu conjunto, é mau
  rationale: Entende τὸ ὅλον como a conduta considerada como um todo e preserva o juízo moral sem intensificá-lo.
theological_decisions:
- issue: Relação entre a misericórdia aos pobres e as demais ações
  choice: Manter a simples coordenação com “e”
  alternative: Inserir “mas”, “contudo” ou “ainda assim”
  rationale: O grego usa καί e não explicita uma relação adversativa; a tensão moral deve permanecer sem acréscimo interpretativo.
- issue: Referente e avaliação de “o todo”
  choice: Traduzir como “no seu conjunto”
  alternative: “a pessoa inteira é má” ou “tudo isso é maligno”
  rationale: A formulação preserva alguma abertura referencial, mas comunica naturalmente que a combinação global dessa conduta recebe avaliação negativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A enumeração compacta do original foi preservada, e a metáfora “duas faces” foi mantida sem impor linguagem denominacional ou uma interpretação psicológica específica.
