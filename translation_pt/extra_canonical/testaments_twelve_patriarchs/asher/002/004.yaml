  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/004.yaml
  text: Even if they are in love, they are in wickedness, hiding evil under a good name; but the end of the deed comes to evil.
translation:
  language: pt
  text: Mesmo havendo amor, quem esconde o mal sob um bom nome está na maldade; mas o fim da ação termina em mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego da primeira frase é incerto e sua sintaxe é difícil. Também pode ser entendido como: “Até o amor está na maldade quando encobre o mal sob um bom nome”.'
    reason: A edição delimita o trecho com sinais críticos. A nota explicita a incerteza e registra uma leitura alternativa plausível, sem impor uma interpretação ao texto principal.
lexical_decisions:
- source_word: ἀγάπη οὖσα
  choice: mesmo que haja amor
  rationale: Expressa de modo natural a construção concessiva entendida pelo contexto, sem identificar explicitamente quem ama nem especificar o tipo de amor.
- source_word: ἐν πονηρίᾳ ἐστὶν
  choice: está na maldade
  rationale: Preserva a formulação moral e o paralelismo do grego, sem reduzir πονηρία apenas a uma ação isolada.
- source_word: ὁ συγκρύπτων
  choice: quem oculta
  rationale: Reproduz o particípio substantivado singular sem introduzir gênero desnecessário em português.
- source_word: ὑπὲρ τὸ ὄνομα τὸ καλόν
  choice: sob um bom nome
  rationale: Comunica a ideia de encobrir o mal mediante uma designação respeitável; a preposição grega é incomum neste contexto e o trecho é textualmente incerto.
- source_word: τὸ τέλος τῆς πράξεως ἔρχεται εἰς κακόν
  choice: o fim da ação acaba em mal
  rationale: Mantém a ênfase no resultado final da ação e a repetição conceitual de fim/resultado presente no original.
theological_decisions:
- issue: Relação entre amor e maldade
  choice: Mesmo que haja amor, está na maldade quem oculta o mal
  alternative: Até o amor está na maldade quando encobre o mal
  rationale: A sintaxe grega transmitida é difícil e possivelmente corrompida. A tradução preserva a tensão entre amor alegado ou presente e conduta má, sem afirmar que o amor em si seja moralmente perverso.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A formulação mantém o tom sapiencial e moral do original, com uma nota breve para tornar transparente a incerteza textual.
