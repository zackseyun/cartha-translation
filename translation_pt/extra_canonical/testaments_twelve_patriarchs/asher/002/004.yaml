  verdict: revise
  source_fidelity: A versão capta adequadamente a denúncia de ocultar o mal sob uma designação boa e o desfecho mau da ação. Contudo, «Mesmo que haja amor» é uma concessiva mais explícita do que a construção grega transmitida permite afirmar com segurança. O texto assinalado como incerto deve conservar uma ligação menos interpretativa entre «amor» e «quem oculta».
  naturalness: «Está na maldade quem oculta» é compreensível, mas a ordem mais direta melhora a leitura. «O fim da ação acaba em mal» soa tautológico em português, pois «fim» e «acaba» repetem a mesma noção.
  terminology: «Maldade», «mal», «oculta/esconde» e «bom nome» mantêm o registro moral sapiencial e refletem de modo aceitável πονηρία, κακόν, συγκρύπτων e ὄνομα καλόν. «Sob um bom nome» preserva a imagem de encobrimento sem resolver em excesso a preposição incomum do grego.
