base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/006.yaml
  text: The one who defrauds his neighbor provokes God, swears falsely by the Most High, sets aside and provokes the Lord, the giver of the law, and gives rest to the poor.
translation:
  language: pt
  text: Quem defrauda o próximo provoca Deus, jura falsamente pelo Altíssimo e se compadece do pobre. Rejeita e provoca o Senhor, que deu a Lei, e dá alívio ao necessitado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεονεκτῶν
  choice: defrauda
  rationale: No contexto de uma ação contra o próximo, o particípio indica tirar vantagem injusta ou lesar; “defrauda” comunica essa exploração de modo claro.
- source_word: ἐπιορκεῖ
  choice: jura falsamente
  rationale: O verbo designa perjúrio ou juramento falso, não apenas uma declaração mentirosa.
- source_word: ἐλεεῖ
  choice: se compadece
  rationale: Expressa misericórdia ou compaixão para com o pobre, preservando o contraste moral interno da frase.
- source_word: ἐντολέα τοῦ νόμου
  choice: que deu a Lei
  rationale: Traduz naturalmente a ideia do Senhor como aquele que ordenou ou promulgou a Lei, sem recorrer ao termo mais técnico “legislador”.
- source_word: ἀθετεῖ
  choice: rejeita
  rationale: O verbo pode significar pôr de lado, invalidar ou rejeitar; aqui, “rejeita” descreve com clareza a atitude da pessoa para com o Senhor.
- source_word: ἀναπαύει
  choice: dá alívio
  rationale: O sentido literal é fazer descansar; aplicado ao necessitado, “dá alívio” é natural em português e conserva a imagem de amparo.
theological_decisions:
- issue: Contraste entre atos maus e atos de misericórdia
  choice: Manter todas as orações, inclusive “se compadece do pobre” e “dá alívio ao necessitado”.
  alternative: Omitir a primeira referência à compaixão, seguindo o texto inglês de consulta.
  rationale: A fonte grega fornecida contém καὶ τὸν πτωχὸν ἐλεεῖ e depois καὶ τὸν πένητα ἀναπαύει. A tensão entre transgressão e beneficência parece deliberada e não deve ser harmonizada nem reduzida.
- issue: Valor discursivo de καί antes dos atos benéficos
  choice: Traduzir por “e”, preservando a coordenação formal.
  alternative: Traduzir por “mas” ou “contudo” para explicitar o contraste.
  rationale: Embora o contexto produza contraste, καί é formalmente aditivo; “e” mantém a tensão sem impor uma interpretação adversativa mais explícita que o grego.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática direta. “Lei” recebe inicial maiúscula por se referir à Lei divina. A alternância entre “pobre” (πτωχός) e “necessitado” (πένης) conserva, na medida do possível, a variação lexical grega.
