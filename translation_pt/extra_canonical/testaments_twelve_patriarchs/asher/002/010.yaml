  text: For God also, in the tablets of the commandments, has declared it so.
translation:
  language: pt
  text: Pois também Deus disse isso nas tábuas dos mandamentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Pois também
  rationale: Conserva tanto a função explicativa de γάρ quanto a ideia aditiva de καί, em português natural.
- source_word: ἐν ταῖς πλαξὶ τῶν ἐντολῶν
  choice: nas tábuas dos mandamentos
  rationale: Reproduz diretamente a expressão grega e mantém sua provável referência às tábuas que continham os mandamentos.
- source_word: οὕτως εἶπεν
  choice: disse isso
  rationale: Οὕτως remete ao conteúdo precedente; em português, “disse isso” expressa essa retomada com clareza, sem intensificar εἶπεν para “declarou”.
theological_decisions:
- issue: Natureza da afirmação divina registrada nas tábuas
  choice: disse
  alternative: declarou
  rationale: O grego usa o verbo comum εἶπεν (“disse”); a tradução evita acrescentar solenidade ou força jurídica não explicitada pelo verbo.
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa e próxima do grego. A formulação é amplamente compreensível no português internacional e natural para leitores brasileiros.
