    issue: Relação de ἐν ἤθει ἀγρίων pouco clara em «pelo modo de ser dos animais selvagens».
    rationale: A expressão portuguesa pode atribuir o “modo de ser” aos animais, sem deixar claro que são as pessoas que parecem impuras em razão de um comportamento semelhante ao de animais selvagens. Uma leve explicitação torna a imagem compreensível e conserva o sentido do grego.
