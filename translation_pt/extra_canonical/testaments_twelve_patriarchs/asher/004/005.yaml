base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/005.yaml
  text: 'For such men are like gazelles and deer: though in the manner of wild animals they seem to be unclean, yet in every way they are clean, because they walk in zeal for the Lord, abstaining from what God also hates and forbids through the commandments, keeping evil away from good.'
translation:
  language: pt
  text: 'Pois tais pessoas são semelhantes a gazelas e cervos: embora pareçam impuras por seu comportamento semelhante ao de animais selvagens, são inteiramente puras, porque andam no zelo do Senhor, abstendo-se daquilo que Deus também odeia e proíbe por meio dos mandamentos, mantendo o mal afastado do bem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ γὰρ τοιοῦτοι
  choice: Pois tais pessoas
  rationale: Expressa a referência geral do grego sem restringi-la desnecessariamente a homens do sexo masculino.
- source_word: δορκάσι καὶ ἐλάφοις
  choice: a gazelas e cervos
  rationale: Equivalentes zoológicos naturais e reconhecíveis em português.
- source_word: ἐν ἤθει ἀγρίων
  choice: pelo modo de ser dos animais selvagens
  rationale: ἦθος indica modo, caráter ou comportamento; a explicitação de 'animais' decorre da comparação imediatamente anterior.
- source_word: τὸ δὲ πᾶν καθαροί εἰσιν
  choice: são inteiramente puras
  rationale: Reproduz o contraste e entende τὸ πᾶν adverbialmente, no sentido de totalidade ou plena condição.
- source_word: ἐν ζήλῳ Κυρίου πορεύονται
  choice: andam no zelo do Senhor
  rationale: Mantém a metáfora bíblica de πορεύονται e preserva a possível nuance de zelo dedicado ao Senhor ou associado a ele.
- source_word: ἀπεχόμενοι
  choice: abstendo-se
  rationale: Verbo corrente que traduz diretamente a ideia de manter-se longe ou privar-se de algo.
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: mantendo o mal afastado do bem
  rationale: Conserva a imagem de separar ou impedir que o mal alcance o bem, sem reformular a cláusula como uma conclusão explícita.
theological_decisions:
- issue: Sentido de ζήλῳ Κυρίου
  choice: no zelo do Senhor
  alternative: com zelo pelo Senhor
  rationale: O genitivo grego admite mais de uma relação. A formulação escolhida mantém a ambiguidade entre zelo dirigido ao Senhor e zelo caracterizado ou suscitado por ele.
- issue: Relação entre pureza aparente e real
  choice: embora... pareçam impuras, são inteiramente puras
  alternative: parecem impuras... mas em todos os aspectos são puras
  rationale: Preserva a tensão do texto entre aparência de impureza e afirmação de pureza plena, sem explicar teologicamente sua base além do que o versículo declara.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Mantiveram-se as imagens de andar, zelo, pureza e separação entre mal e bem; evitou-se linguagem denominacional ou excessivamente técnica.
