revisions:
- from: Outro não quer desfrutar dias bons com os devassos, para não desonrar o corpo nem contaminar a alma. Embora isso tenha duas faces, é inteiramente bom.
  to: Outro não quer ver dias bons com os dissolutos, para não desonrar o corpo nem contaminar a alma. Embora isso tenha duas faces, é inteiramente bom.
  rationale: Substituí «devassos» por «dissolutos» para refletir o alcance moral mais amplo de ἀσώτων e «desfrutar» por «ver» para preservar a formulação imagética do grego. O restante está fiel, natural e mantém sem resolver a tensão entre «duas faces» e «inteiramente bom».
