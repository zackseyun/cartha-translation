  text: Ἄλλος²⁶ οὐ θέλει *ἰδεῖν ⌈ἡμέρας⌉ ἀγαθὰς²⁷ μετὰ ἀσώτων, ἵνα μὴ αἰσχράνει²⁸ τὸ σῶμα²⁹ καὶ τὴν ψυχὴν μολυνεῖ³⁰. *καίγε τοῦτο διπρόσωπον³¹, ὅλον³² δὲ καλόν³³ ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/004.yaml
  text: Another does not wish to see good days with the wasteful, lest he disgrace the body and defile the soul. Even though this is double-faced, yet it is wholly good.
translation:
  language: pt
  text: Outro não quer ver dias bons com os dissolutos, para não desonrar o corpo nem contaminar a alma. Embora isso tenha duas faces, é inteiramente bom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: desfrutar dias bons
  rationale: A expressão idiomática significa experimentar ou gozar dias bons; esta formulação é natural em português e preserva seu sentido.
- source_word: ἀσώτων
  choice: devassos
  rationale: O termo designa pessoas de vida dissoluta ou desenfreada, não apenas pessoas economicamente esbanjadoras; “devassos” comunica melhor a dimensão moral no contexto.
- source_word: αἰσχράνει
  choice: desonrar
  rationale: Mantém a ideia de causar vergonha ou desonra ao corpo e distingue o verbo de μολυνεῖ.
- source_word: μολυνεῖ
  choice: contaminar
  rationale: Expressa tornar impura ou macular a alma, sem repetir o campo semântico de “desonrar”.
- source_word: διπρόσωπον
  choice: tenha duas faces
  rationale: Reproduz a imagem literal de algo “de duas faces” e preserva a tensão conceitual da passagem, sem a resolver como mera hipocrisia.
- source_word: ὅλον δὲ καλόν
  choice: é inteiramente bom
  rationale: Conserva a afirmação enfática de que, apesar de seu caráter de duas faces, o caso é totalmente bom.
theological_decisions:
- issue: Avaliação moral de algo descrito como διπρόσωπον
  choice: Embora isso tenha duas faces, é inteiramente bom.
  alternative: Embora isso seja dúplice, é totalmente bom.
  rationale: A tradução mantém a aparente tensão do grego entre “duas faces” e “inteiramente bom”, sem harmonizá-la nem atribuir necessariamente hipocrisia à pessoa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “para não... nem...” apresenta naturalmente os dois resultados temidos. Não foram necessárias notas de rodapé.
