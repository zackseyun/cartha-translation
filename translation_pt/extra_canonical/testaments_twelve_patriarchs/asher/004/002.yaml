base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/002.yaml
  text: And many, in doing away with the wicked, do two things, good and evil; yet the whole is good, because he has uprooted and destroyed the evil.
translation:
  language: pt
  text: E muitos, ao eliminarem os perversos, fazem duas coisas, uma boa e outra má; contudo, o conjunto é bom, porque aquele que arrancou o mal pela raiz o destruiu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιροῦντες
  choice: ao eliminarem
  rationale: Preserva o sentido de retirar ou dar fim aos perversos sem restringir desnecessariamente o verbo à execução física, embora esta possa estar incluída no contexto.
- source_word: δύο ποιοῦσιν ἔργα καλοῦ τε καὶ κακοῦ
  choice: fazem duas coisas, uma boa e outra má
  rationale: Expressa em português natural o contraste entre duas ações ou aspectos, mantendo a correspondência com δύο, ἔργα, καλοῦ e κακοῦ.
- source_word: τὸ δὲ ὅλον καλόν
  choice: contudo, o conjunto é bom
  rationale: Mantém a afirmação abrangente e sua tensão moral, sem explicar ou suavizar o raciocínio do autor.
- source_word: ἐκριζώσας ἀπώλεσεν
  choice: aquele que arrancou o mal pela raiz o destruiu
  rationale: Reproduz a imagem enfática de erradicação e conserva a mudança do plural anterior para a construção grega no singular.
theological_decisions:
- issue: Avaliação conjunta de uma ação descrita como boa e má
  choice: manter que “o conjunto é bom”
  alternative: explicar que o fim bom justifica ou supera o aspecto mau
  rationale: O texto apresenta uma tensão moral sem desenvolver uma teoria ética; a tradução não deve importar uma solução teológica ou filosófica.
- issue: Mudança gramatical do plural para o singular
  choice: “muitos” ... “aquele que”
  alternative: 'harmonizar tudo no plural: “porque arrancaram... e destruíram”'
  rationale: A formulação escolhida preserva a mudança presente no grego e permite entender o singular como referência genérica a cada pessoa entre os muitos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva o contraste moral abrupto e a imagem de arrancar o mal pela raiz.
