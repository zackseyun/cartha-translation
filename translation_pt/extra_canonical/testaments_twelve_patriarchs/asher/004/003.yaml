id: T12P.ASH.4.3
reference: Testament of Asher 4:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἔστι τις μισῶν¹³ τὸν ἐλεήμονα καὶ ἄδικον¹⁴, ⌜καὶ⌝¹⁵ τὸν μοιχὸν καὶ¹⁶ νηστεύοντα¹⁷, *καὶ αὐτό ἐστι διπρόσωπον¹⁸, ἀλλὰ ⌈τὸ πᾶν⌉ ἔργον ἀγαθόν¹⁹, ὅτι μιμεῖται²⁰ Κύριον, μὴ²¹ †προσδοκώμενος²² τὸ δοκοῦν καλὸν †μετὰ²³ *τοῦ ἀληθινοῦ²⁴ καλοῦ²⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/003.yaml
  text: There is one who hates the merciful and the unjust, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what seems good along with what is truly good.
translation:
  language: pt
  text: Há quem odeie tanto o misericordioso como o injusto, tanto o adúltero como aquele que jejua. Isso também é ter duas faces; contudo, a obra toda é boa, porque ele imita o Senhor, sem esperar o que parece bom junto com o que é verdadeiramente bom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego da oração final apresenta sinais de corrupção ou transmissão incerta; a tradução segue a leitura mais direta do texto preservado.
    reason: Os termos προσδοκώμενος e μετά são assinalados como textualmente problemáticos na edição, e a relação exata entre «o que parece bom» e «o que é verdadeiramente bom» permanece incerta.
lexical_decisions:
- source_word: ἐλεήμονα
  choice: o misericordioso
  rationale: Mantém o sentido de alguém compassivo ou que pratica misericórdia, em contraste deliberado com o injusto.
- source_word: διπρόσωπον
  choice: ter duas faces
  rationale: Expressa de modo natural a imagem literal de duplicidade, sem restringi-la antecipadamente a uma formulação interpretativa como «hipocrisia».
- source_word: τὸ πᾶν ἔργον
  choice: a obra toda
  rationale: Reproduz a afirmação abrangente do grego e preserva a tensão com a caracterização anterior como algo de duas faces.
- source_word: μιμεῖται
  choice: imita
  rationale: Equivalente direto e claro, preservando a alegação teológica do texto sem explicá-la além do original.
- source_word: τὸ δοκοῦν καλόν
  choice: o que parece bom
  rationale: Preserva o contraste entre a aparência de bondade e o bem verdadeiro.
- source_word: τοῦ ἀληθινοῦ καλοῦ
  choice: o que é verdadeiramente bom
  rationale: Formulação idiomática em português que mantém a oposição com «o que parece bom».
theological_decisions:
- issue: A declaração de que a obra toda é boa apesar de ser «ter duas faces»
  choice: 'Preservar literalmente a tensão: «contudo, a obra toda é boa»'
  alternative: Harmonizar a passagem explicando que apenas parte da conduta é boa
  rationale: O grego transmitido contém essa tensão e não oferece base segura para resolvê-la teologicamente na tradução.
- issue: Imitação do Senhor
  choice: «porque ele imita o Senhor»
  alternative: Explicitar em que sentido o Senhor seria imitado
  rationale: O original não fornece a explicação; acrescentá-la importaria uma interpretação não atestada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição «tanto... como» torna claros os dois pares contrastantes do grego, enquanto «ter duas faces» conserva a metáfora e a ambiguidade moral do trecho.
