base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/001.yaml
  text: For good men, being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God.
translation:
  language: pt
  text: Pois os homens bons e íntegros, ainda que os de duas caras pensem que eles pecam, são justos diante de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοὶ ἄνθρωποι
  choice: os homens bons
  rationale: Reproduz diretamente a expressão grega em linguagem natural e digna.
- source_word: μονοπρόσωποι
  choice: sendo íntegros
  rationale: O sentido literal é “de uma só face”; aqui designa pessoas sem duplicidade. “Íntegros” comunica esse valor ético com clareza em português.
- source_word: διπροσώπων
  choice: os de duas caras
  rationale: Preserva a imagem contrastante do grego e sua força moral, em expressão corrente e amplamente compreensível.
- source_word: ἁμαρτάνειν
  choice: estão pecando
  rationale: Mantém o sentido religioso e moral explícito do verbo grego, sem atenuá-lo para mero “errar”.
- source_word: δίκαιοί εἰσι παρὰ τῷ Θεῷ
  choice: são justos diante de Deus
  rationale: Formulação portuguesa natural que preserva a avaliação ou posição dessas pessoas perante Deus.
theological_decisions:
- issue: Aparente pecado aos olhos dos hipócritas versus justiça perante Deus
  choice: ainda que os de duas caras pensem que eles estão pecando, são justos diante de Deus
  alternative: mesmo que sejam considerados pecadores pelos de duas caras, Deus os considera justos
  rationale: A escolha preserva tanto o infinitivo verbal “pecar” quanto a construção “diante de Deus”, evitando transformar explicitamente a frase numa declaração técnica sobre justificação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A expressão idiomática “de duas caras” conserva o jogo conceitual entre μονοπρόσωποι e διπρόσωποι; “íntegros” evita a forma pouco natural “de uma só cara” sem eliminar o contraste moral.
