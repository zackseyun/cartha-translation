    rationale: O grego traz o infinitivo presente ἁμαρτάνειν dependente de «ser considerados», sem exigir uma ação em curso. «Pecam» preserva melhor o valor geral da acusação.
  - severity: low
    issue: Relação entre «bons» e «íntegros»
    rationale: ἀγαθοὶ ἄνθρωποι καὶ μονοπρόσωποι apresenta as duas qualificações coordenadas. «Homens bons e íntegros» torna essa estrutura explícita.
  revised_text: Pois os homens bons e íntegros, ainda que os de duas caras pensem que eles pecam, são justos diante de Deus.
