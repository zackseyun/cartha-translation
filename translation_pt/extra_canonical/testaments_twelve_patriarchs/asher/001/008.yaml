    rationale: A formulação é possível, mas introduz uma noção instrumental/modal de prática. «Se dão na maldade» mantém melhor a ideia de ações que pertencem à esfera da maldade.
  - severity: low
    issue: «fica sob o domínio de Beliar» para κυριευθεὶς ὑπὸ τοῦ Βελίαρ
    rationale: A perífrase é inteligível, mas «é dominada por Beliar» preserva de modo mais imediato a voz passiva do particípio grego.
