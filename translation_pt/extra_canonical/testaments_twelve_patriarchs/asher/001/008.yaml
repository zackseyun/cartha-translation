source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν δὲ *ἐν †πονηρᾷ³⁶ κλίνῃ³⁷ †τὸ διαβούλιον†³⁸, *πᾶσα πρᾶξις αὐτῆς ἐστιν³⁹ ἐν πονηρίᾳ, καὶ⁴⁰ ἀπωθουμένη⁴¹ τὸ ἀγαθόν, *καὶ προσκολλώμενος⁴² τὸ κακόν, καὶ κυριευθεὶς⁴³ ὑπὸ⁴⁴ τοῦ Βελίαρ· κἂν⁴⁵ ἀγαθὸν⁴⁶ πράξει⁴⁷, Γἐν πονηρίᾳ⁴⁸ αὐτὸ⁴⁹ μεταστρέφει⁵⁰˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/008.yaml
  text: But if the intent inclines to evil, all its actions are in wickedness, driving away the good and clinging to the evil, and ruled by Beliar; and even if it does something good, it turns it into evil.
translation:
  language: pt
  text: 'Mas, se a intenção se inclina para o mal, todas as suas ações se dão na maldade: ela rejeita o bem, apega-se ao mal e é dominada por Beliar; e, ainda que faça algo bom, transforma isso em mal.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ διαβούλιον
  choice: a intenção
  rationale: Expressa o propósito ou desígnio interior de modo natural em português, sem tornar o termo mais técnico do que o grego exige.
- source_word: κλίνῃ
  choice: se inclina
  rationale: Preserva a imagem verbal de voltar-se ou pender para uma direção moral.
- source_word: ἐν πονηρίᾳ
  choice: com maldade
  rationale: Em conexão com πρᾶξις, indica o caráter ou a esfera moral das ações em português corrente.
- source_word: ἀπωθουμένη τὸ ἀγαθόν
  choice: rejeita o bem
  rationale: Traduz o sentido de repelir ou afastar o bem com formulação clara e idiomática.
- source_word: προσκολλώμενος τὸ κακόν
  choice: apega-se ao mal
  rationale: Mantém a ideia forte de aderir ao mal, apesar da oscilação de gênero e construção no texto transmitido.
- source_word: κυριευθεὶς ὑπὸ τοῦ Βελίαρ
  choice: fica sob o domínio de Beliar
  rationale: Comunica a passiva de ser dominado ou governado por Beliar sem acrescentar explicação teológica.
- source_word: μεταστρέφει
  choice: transforma
  rationale: Representa a ideia de alterar ou converter o que é bom em mal.
theological_decisions:
- issue: Agência de Beliar e da intenção má
  choice: Preservar tanto o apego ativo ao mal quanto o domínio exercido por Beliar.
  alternative: Apresentar Beliar apenas como símbolo do mal ou atribuir-lhe controle absoluto.
  rationale: O texto combina responsabilidade moral e sujeição a Beliar; a tradução não resolve essa tensão em favor de uma leitura doutrinária.
- issue: Conversão de uma ação boa em mal
  choice: Dizer que a intenção má transforma o ato bom em mal.
  alternative: Explicar que apenas os motivos, resultados ou méritos do ato se tornam maus.
  rationale: O grego não especifica em que sentido ocorre a transformação; convém preservar a afirmação abrangente e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura ligeiramente explicativa após os dois-pontos para manter claro que o referente é «a intenção». O nome «Beliar» foi preservado como no texto grego.
