revisions:
- from: 'Mas, se a intenção se inclina para o mal, todas as suas ações são praticadas com maldade: ela rejeita o bem, apega-se ao mal e fica sob o domínio de Beliar; e, ainda que faça algo bom, transforma isso em mal.'
  to: 'Mas, se a intenção se inclina para o mal, todas as suas ações se dão na maldade: ela rejeita o bem, apega-se ao mal e é dominada por Beliar; e, ainda que faça algo bom, transforma isso em mal.'
  rationale: 'A revisão é limitada a duas formulações: «se dão na maldade» reproduz melhor ἐν πονηρίᾳ, e «é dominada por Beliar» representa mais diretamente a passiva grega. Mantém-se «ela» como referência à intenção, leitura favorecida pela coerência sintática pretendida, sem tentar harmonizar além do necessário as oscilações de gênero nos particípios da tradição textual.'
  reviewer_model: gpt-5.6-terra
