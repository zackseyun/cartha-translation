  source_fidelity: 'A tradução preserva adequadamente a estrutura e o sentido do grego: a condição referente à alma, a conduta em justiça, a concessão de eventual pecado e o arrependimento imediato. Contudo, «Portanto» desloca a partícula inferencial οὖν para antes da oração condicional; «Se, então» reflete melhor a disposição do original e evita apresentar toda a frase como uma conclusão mais enfática do que o grego exige. «Em justiça» é também a correspondência mais direta de ἐν δικαιοσύνῃ.'
  naturalness: A redação é clara e natural em português moderno. «Se, então, a alma quer andar bem» é igualmente idiomático e conserva mais de perto a articulação do período grego. «Pratica todas as suas ações» é compreensível, embora «realiza todas as suas ações» seja menos tautológico e mantém o sentido de ποιεῖ.
  terminology: «Alma», «andar bem», «pecar» e «arrepende-se imediatamente» são escolhas fiéis e apropriadas. «Justiça» preserva δικαιοσύνη sem impor leitura doutrinária específica.
