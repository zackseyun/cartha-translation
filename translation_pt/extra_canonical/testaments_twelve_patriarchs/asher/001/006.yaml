  text: Ἐὰν οὖν²⁶ ἡ ψυχὴ θέλει²⁷ *†καλῶς πορευθῆναι†, πάσας τὰς πράξεις αὐτῆς ποιεῖ²⁸ ἐν δικαιοσύνῃ, *κἂν ἁμάρτῃ²⁹ εὐθὺς³⁰ μετανοεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/006.yaml
  text: If, then, the soul wants to walk well, it does all its actions in righteousness; and even if it sins, it immediately repents.
translation:
  language: pt
  text: Se, então, a alma quer andar bem, realiza todas as suas ações em justiça; e, mesmo que peque, arrepende-se imediatamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ψυχὴ
  choice: a alma
  rationale: Correspondência direta e natural, preservando a linguagem antropológica do texto.
- source_word: θέλει
  choice: quer
  rationale: Expressa de modo simples e direto a vontade indicada pelo verbo grego.
- source_word: καλῶς πορευθῆναι
  choice: andar bem
  rationale: Mantém a metáfora de conduta presente em πορεύομαι e a formulação concisa do grego, cuja redação é textualmente assinalada como incerta.
- source_word: πάσας τὰς πράξεις αὐτῆς ποιεῖ
  choice: pratica todas as suas ações
  rationale: Evita a construção pouco idiomática 'faz todas as suas ações' sem perder a abrangência de πάσας nem o sentido de πράξεις.
- source_word: ἐν δικαιοσύνῃ
  choice: com justiça
  rationale: Formulação natural em português que conserva a esfera ou maneira justa da conduta.
- source_word: κἂν ἁμάρτῃ
  choice: mesmo que peque
  rationale: Preserva o valor concessivo e eventual da expressão grega.
- source_word: εὐθὺς μετανοεῖ
  choice: arrepende-se imediatamente
  rationale: Traduz diretamente a prontidão de εὐθύς e o sentido de mudança penitente de μετανοέω.
theological_decisions:
- issue: Relação entre conduta justa, pecado e arrependimento
  choice: Preservar a afirmação de que a alma que quer andar bem pratica com justiça e, mesmo se pecar, arrepende-se prontamente.
  alternative: Reformular como se a pessoa justa nunca pecasse ou como se o arrependimento tornasse irrelevante a justiça prática.
  rationale: O texto mantém em tensão a orientação habitual para a justiça e a possibilidade real de pecado; a tradução não deve eliminar nenhuma das duas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem lógica e a metáfora de 'andar' foram preservadas; 'pratica todas as suas ações' dá naturalidade à frase sem ampliar seu conteúdo.
