  text: Therefore all things are twofold, one over against the other.
translation:
  language: pt
  text: 'Por isso, todas as coisas são duplas: uma em oposição à outra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα δύο εἰσίν
  choice: todas as coisas são duas
  rationale: Reproduz diretamente a formulação grega e preserva sua afirmação abrangente, sem acrescentar uma explicação como “têm dois aspectos”.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: uma em oposição à outra
  rationale: Expressa a relação de contraposição indicada por κατέναντι. Embora τοῦ ἑνός seja literalmente “do um”, o sentido idiomático no par é que cada uma se contrapõe à outra.
theological_decisions:
- issue: Possível leitura dualista da afirmação
  choice: Manter a formulação abrangente e a oposição entre os dois elementos
  alternative: Explicitar que todas as coisas possuem dois aspectos morais
  rationale: O grego não especifica aqui a natureza dos dois elementos; explicá-los como aspectos morais resolveria antecipadamente uma ambiguidade desenvolvida pelo contexto.
translation_notes:
  register: Português atual, claro e digno, com estrutura concisa próxima do grego. A revisão anterior foi desconsiderada por corresponder a outro texto e não à fonte grega fornecida.
