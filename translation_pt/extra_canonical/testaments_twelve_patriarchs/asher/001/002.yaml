  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/002.yaml
  text: While still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything that is upright before God.”
translation:
  language: pt
  text: 'Enquanto estava com saúde, ele lhes disse: “Ouçam, filhos de Aser, o seu pai, e eu lhes mostrarei tudo o que é reto diante de Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: Enquanto ainda estava com saúde
  rationale: O particípio presente indica a condição em que Aser se encontrava ao falar; a formulação temporal é natural em português e preserva a ideia de que ele ainda gozava de saúde.
- source_word: Ἀκούσατε
  choice: Ouçam
  rationale: Imperativo plural direto e corrente, adequado à fala de um pai dirigida aos filhos.
- source_word: πᾶν τὸ εὐθὲς
  choice: tudo o que é reto
  rationale: Mantém o alcance de πᾶν e traduz εὐθύς em seu sentido moral, sem restringi-lo a uma doutrina específica.
- source_word: ἐνώπιον τοῦ Θεοῦ
  choice: diante de Deus
  rationale: Equivalente formal e idiomático da expressão grega, preservando a perspectiva da avaliação divina.
- source_word: ὑποδείξω
  choice: mostrarei
  rationale: Expressa de modo claro o sentido de indicar, demonstrar ou dar a conhecer.
theological_decisions:
- issue: Sentido moral de εὐθές diante de Deus
  choice: o que é reto diante de Deus
  alternative: o que é correto aos olhos de Deus
  rationale: A escolha preserva a metáfora moral de retidão presente no grego e evita tornar explícita uma interpretação além do texto.
translation_notes:
  register: Português moderno, digno e acessível, com imperativo plural de uso brasileiro. A ordem vocativa foi ajustada para soar natural sem alterar as relações sintáticas essenciais.
