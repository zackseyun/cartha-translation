base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/005.yaml
  text: For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.
translation:
  language: pt
  text: Pois há dois caminhos, o do bem e o do mal; e neles estão os dois propósitos em nosso íntimo, distinguindo-os.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ
  choice: caminhos
  rationale: Equivalente direto e natural, preservando a imagem ética dos dois modos de vida.
- source_word: καλοῦ καὶ κακοῦ
  choice: do bem e do mal
  rationale: Expressa os genitivos gregos de maneira idiomática e mantém o contraste moral.
- source_word: διαβούλια
  choice: propósitos
  rationale: O termo pode indicar desígnios, intenções ou disposições deliberadas; “propósitos” preserva a dimensão volitiva sem especificá-la em excesso.
- source_word: ἐν στέρνοις ἡμῶν
  choice: em nosso íntimo
  rationale: Embora στέρνοις designe literalmente o peito, aqui funciona como sede interior dos pensamentos e propósitos; a formulação evita o literalismo pouco natural.
- source_word: διακρίνοντα αὐτά
  choice: distinguindo-os
  rationale: Mantém o particípio e sua referência mais provável aos caminhos, sem explicar além do que o grego afirma.
theological_decisions:
- issue: Relação entre os dois propósitos interiores e os dois caminhos
  choice: 'Mantida a formulação compacta e ambígua do grego: os propósitos estão nos caminhos e os distinguem.'
  alternative: Explicitar que os propósitos interiores discernem entre o bem e o mal, ou que cada propósito corresponde a um caminho.
  rationale: O texto grego não define com precisão a mecânica dessa relação; explicitá-la importaria uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com construção relativamente formal para conservar o paralelismo sapiencial do original. “Em nosso íntimo” oferece legibilidade brasileira e ampla compreensão internacional.
