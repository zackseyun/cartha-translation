  text: The testament of Asher, the tenth son of Jacob and Zilpah. The copy of the testament of Asher, which he spoke to his sons in the one hundred and twenty-fifth year of his life.
translation:
  language: pt
  text: 'Testamento de Aser, o décimo filho de Jacó e Zilpa.


    1 Cópia do testamento de Aser, que ele proferiu a seus filhos no centésimo vigésimo quinto ano de sua vida.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testamento
  rationale: No título, designa as palavras finais e disposições atribuídas ao patriarca; “Testamento” também preserva o título tradicional da obra.
- source_word: Ἀντίγραφον
  choice: Cópia
  rationale: Equivalente direto e natural para um escrito apresentado como reprodução do testamento.
- source_word: ἐλάλησε τοῖς υἱοῖς αὐτοῦ
  choice: pronunciou diante de seus filhos
  rationale: Expressa um discurso solene dirigido aos filhos sem sugerir mera conversa informal.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: no centésimo vigésimo quinto ano de sua vida
  rationale: Mantém de perto a formulação ordinal do grego e soa digna e inteligível em português.
