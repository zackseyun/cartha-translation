  source_fidelity: 'A primeira oração preserva corretamente a leitura grega δύσκολη τὸ ἀγαθὸν ποιεῖν: «começa a fazer o bem», sem harmonizá-la com uma conjectura. A sequência «o fim da ação o impele para o mal» representa adequadamente τὸ τέλος τῆς πράξεως εἰς πονηρὸν ... ἐλαύνει. Contudo, «seu propósito» deixa sem expressão o qualificativo πονηροῦ ligado a διαβουλίου na leitura adotada pelo texto e introduz um possessivo não expresso.'
  naturalness: O português é moderno, claro e de registro apropriado. «Fim da ação» e «impele para o mal» são naturais, embora conservem de modo útil a concisão e a força do original.
  terminology: «Fazer o bem», «mal» e «espírito maligno» são escolhas estáveis e apropriadas. «Propósito maligno» torna explícito o elemento πονηροῦ sem alterar a ambiguidade contextual sobre quem é o sujeito ou o espírito.
