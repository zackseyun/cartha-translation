  - severity: low
    issue: O possessivo «seu» não é expresso no grego.
    rationale: Embora o contexto possa suprir um referente, «do propósito maligno» reproduz a construção genitiva sem antecipar uma identificação do possuidor.
  revised_text: Pois, quando ele começa a fazer o bem, o fim da ação o impele para o mal, porque o tesouro do propósito maligno está cheio de um espírito maligno.
