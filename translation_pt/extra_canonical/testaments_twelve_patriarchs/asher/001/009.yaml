source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ὅτε γὰρ⁵¹ ἄρξεται⁵² *τὸ ἀγαθὸν ποιεῖν⁵³, τὸ τέλος τῆς πράξεως *εἰς πονηρὸν αὐτῷ ἐλαύνει⁵⁴. ἐπειδὴ ὁ⁵⁵ θησαυρὸς⁵⁶ τοῦ διαβουλίου⁵⁷ πονηροῦ⁵⁸ πνεύματος πεπλήρωται⁵⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/009.yaml
  text: For whenever it begins to do good, the end of the action drives him into evil, because the treasure of its purpose is filled with an evil spirit.
translation:
  language: pt
  text: Pois, quando ele começa a fazer o bem, o fim da ação o impele para o mal, porque o tesouro do propósito maligno está cheio de um espírito maligno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἀγαθὸν ποιεῖν
  choice: fazer o bem
  rationale: A construção apresenta τὸ ἀγαθόν como objeto de ποιεῖν; a tradução conserva o sentido direto do grego, sem adotar a revisão inglesa que o transforma em “fazer o mal contra o bem”.
- source_word: τὸ τέλος τῆς πράξεως
  choice: o fim da ação
  rationale: Reprodução próxima da expressão grega, preservando a possibilidade de τέλος indicar tanto o desfecho quanto o resultado final.
- source_word: εἰς πονηρὸν ... ἐλαύνει
  choice: o impele para o mal
  rationale: “Impele” expressa a força direcional de ἐλαύνει, enquanto “para o mal” conserva εἰς πονηρόν sem especificar uma ação má concreta.
- source_word: ὁ θησαυρὸς τοῦ διαβουλίου
  choice: o tesouro de seu propósito
  rationale: “Tesouro” mantém a metáfora de θησαυρός; “propósito” comunica o plano ou desígnio interior indicado pelo raro διαβούλιον, sem introduzir uma interpretação denominacional.
- source_word: πονηροῦ πνεύματος πεπλήρωται
  choice: está cheio de um espírito maligno
  rationale: A formulação representa naturalmente o genitivo de conteúdo com πεπλήρωται e mantém a referência pessoal ou espiritual aberta como no grego.
theological_decisions:
- issue: A tensão entre começar a fazer o bem e terminar no mal
  choice: Preservar literalmente a progressão paradoxal do texto grego
  alternative: 'Seguir a revisão inglesa: “começa a fazer o mal contra o bem”'
  rationale: O texto fornecido lê τὸ ἀγαθὸν ποιεῖν, “fazer o bem”. Corrigir essa tensão por conjectura resolveria silenciosamente uma dificuldade genuína do texto.
- issue: Identidade do sujeito e dos pronomes
  choice: Usar “ele”, “o” e “seu” sem identificar explicitamente o referente
  alternative: Nomear o sujeito como pessoa, inclinação ou espírito maligno
  rationale: O versículo depende do contexto anterior para seus referentes. A tradução mantém essa dependência e evita acrescentar uma identificação ausente desta unidade textual.
translation_notes:
  register: Português moderno, digno e de leitura natural, com sintaxe relativamente próxima do grego. Conserva-se a ambiguidade referencial e a tensão entre o início bom e o desfecho mau.
