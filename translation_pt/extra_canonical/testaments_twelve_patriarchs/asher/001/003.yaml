base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/003.yaml
  text: God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two ends.
translation:
  language: pt
  text: Deus deu dois caminhos aos filhos dos homens, dois propósitos, duas ações, dois modos de proceder e dois fins.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδοὺς
  choice: caminhos
  rationale: Preserva a metáfora ética direta do grego e sua formulação tradicional.
- source_word: διαβούλια
  choice: propósitos
  rationale: Expressa deliberações ou desígnios interiores em português natural, sem restringir o sentido a simples opiniões.
- source_word: πράξεις
  choice: ações
  rationale: Equivalente direto para atos ou condutas realizadas.
- source_word: τρόπους
  choice: modos de proceder
  rationale: Torna claro o sentido de maneiras ou padrões de conduta, evitando o pouco natural 'modos' isolado.
- source_word: τέλεα
  choice: fins
  rationale: Mantém a ideia de resultados, desfechos ou destinos finais, sem decidir além do que o texto afirma.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: aos filhos dos homens
  rationale: Conserva o antropônimo coletivo semítico refletido literalmente no grego; significa a humanidade.
theological_decisions:
- issue: Natureza das duas séries éticas
  choice: Manter a formulação paralela e não identificar explicitamente cada série como boa ou má
  alternative: Explicitar 'uma boa e outra má' em cada categoria
  rationale: O versículo apenas enumera pares; a interpretação moral é desenvolvida pelo contexto e não deve ser inserida aqui.
- issue: Agência divina em ἔδωκεν
  choice: Deus deu
  alternative: Deus colocou diante de
  rationale: A tradução direta preserva a tensão teológica da afirmação grega, sem suavizar ou explicar a relação entre a dádiva divina e a escolha humana.
translation_notes:
  register: Português moderno, digno e legível, com paralelismo retórico preservado. A revisão mais recente fornecida foi desconsiderada por não corresponder ao texto grego citado e aparentar pertencer a outro versículo.
