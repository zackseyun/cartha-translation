  text: For by considering what is righteous and casting away wickedness, it at once overturns evil and uproots sin.
translation:
  language: pt
  text: Pois, ao considerar o que é justo e rejeitar a maldade, ela imediatamente derruba o mal e arranca o pecado pela raiz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δίκαια ... λογιζομένη
  choice: ao considerar o que é justo
  rationale: Reproduz naturalmente o particípio e preserva o sentido de avaliar ou ter em mente coisas justas, sem restringi-lo a meros pensamentos.
- source_word: ἀπορρίπτουσα τὴν πονηρίαν
  choice: rejeitar a maldade
  rationale: Expressa o afastamento deliberado indicado por ἀπορρίπτουσα, em português corrente e digno.
- source_word: ἀνατρέπει ... τὸ κακόν
  choice: derrota o mal
  rationale: Comunica a ideia forte de derrubar ou subverter o mal com maior naturalidade no contexto abstrato.
- source_word: ἐκριζοῖ τὴν ἁμαρτίαν
  choice: arranca o pecado pela raiz
  rationale: Mantém a imagem concreta de erradicação presente no verbo grego.
theological_decisions:
- issue: Referente do sujeito feminino implícito em λογιζομένη, ἀπορρίπτουσα, ἀνατρέπει e ἐκριζοῖ
  choice: ela
  alternative: explicitar o referente a partir do contexto anterior
  rationale: O versículo isolado pressupõe um antecedente feminino; manter o pronome preserva essa relação textual sem acrescentar uma identificação não fornecida no trecho.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção participial grega foi vertida por oração com “ao”, e a metáfora final foi preservada.
