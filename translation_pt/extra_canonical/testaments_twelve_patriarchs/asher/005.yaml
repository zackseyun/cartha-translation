  terminology: '''Ganância'', ''embriaguez'', ''devassidão'', ''Altíssimo'', ''vida eterna'' e ''sob'' são escolhas adequadas. ''Coisas justas/injustas'' preserva bem os plurais neutros. ''Busquei diligentemente'' explicita de forma natural a força de ἐξεζήτησα.'
