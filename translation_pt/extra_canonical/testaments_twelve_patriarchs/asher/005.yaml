base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005.yaml
  text: '1[a]. See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in wealth, greed; in merriment, drunkenness; in laughter, grief[b]; in marriage, debauchery. 2. Death follows life, dishonor glory, night day, darkness light; but all things are under the day: righteous things under life, and unrighteous things under death. Therefore eternal life also awaits death. 3. And one cannot say that truth is falsehood, nor that what is righteous is unrighteous, because all truth is under the light, just as all things are under God. 4. Therefore I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought out the commandments of the Most High[c], walking according to all my strength.'
translation:
  language: pt
  text: '1. Vejam, meus filhos, como há duas coisas em tudo, uma oposta à outra, e uma fica escondida sob a outra: na criação[a], a ganância; na alegria, a embriaguez; no riso, a tristeza; no casamento, a devassidão. 2. À vida sucede a morte; à glória, a desonra; ao dia, a noite; à luz, as trevas. Mas todas as coisas estão sob o dia: as coisas justas, sob a vida; e as injustas, sob a morte[c]. Por isso, a vida eterna também aguarda a morte[b]. 3. Não se pode chamar a verdade de mentira, nem o que é justo de injusto, porque toda verdade está sob a luz, assim como todas as coisas estão sob Deus. 4. Portanto, pus à prova todas essas coisas em minha vida, não me desviei da verdade do Senhor e busquei diligentemente os mandamentos do Altíssimo, caminhando com todas as minhas forças.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “criação” (κτίσις). A relação da expressão “na criação, a ganância” é difícil no contexto; a tradução conserva o termo do texto grego sem explicá-lo interpretativamente.
    reason: lexical_alternative
  - marker: b
    text: A frase “a vida eterna também aguarda a morte” é textual e conceitualmente difícil. A tradução preserva a construção grega em vez de explicar ou reformular seu sentido.
    reason: textual_variant
  - marker: c
    text: A repetição de “sob” — “sob o dia”, “sob a vida”, “sob a morte”, “sob a luz” e “sob Deus” — parece indicar uma esfera moral ou cósmica, mas o texto não define com precisão a relação.
    reason: cultural_note
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Vejam
  rationale: Imperativo direto e natural em português atual, adequado à exortação paterna.
- source_word: τέκνα
  choice: meus filhos
  rationale: Preserva o tratamento íntimo próprio do gênero testamentário; o possessivo é natural no discurso direto.
- source_word: δύο ... ἓν κατέναντι τοῦ ἑνός
  choice: há duas coisas em tudo, uma oposta à outra
  rationale: Explicita apenas o substantivo implícito necessário em português e mantém o contraste binário do grego.
- source_word: κέκρυπται
  choice: fica escondida sob
  rationale: Conserva a relação de ocultamento e antecipa sem apagar o padrão recorrente de linguagem com 'sob'.
- source_word: κτίσει
  choice: aquisição
  rationale: No catálogo de vícios, a ideia de adquirir ou possuir oferece a ligação mais coerente com a ganância; a possibilidade formal de 'criação' é registrada em nota.
- source_word: πλεονεξία
  choice: ganância
  rationale: Equivalente moderno e amplamente compreensível para desejo ávido de ter mais.
- source_word: εὐφροσύνη
  choice: alegria
  rationale: Termo corrente que abrange contentamento e ambiente festivo sem impor um cenário específico.
- source_word: μέθη
  choice: embriaguez
  rationale: Nome direto do estado ou vício contrastado com a alegria.
- source_word: πένθος
  choice: tristeza
  rationale: Mantém o contraste com o riso em linguagem clara; 'luto' estreitaria o sentido a uma situação ritual ou de morte.
- source_word: ἀσωτία
  choice: devassidão
  rationale: Expressa excesso moral e vida dissoluta no contraste com o casamento, sem limitar o termo a uma única conduta.
- source_word: διαδέχεται
  choice: sucede
  rationale: Reproduz com concisão a sucessão das realidades contrastantes e permite conservar o paralelismo elíptico.
- source_word: τὰ δίκαια
  choice: as coisas justas
  rationale: Preserva o neutro plural como categoria de coisas, atos ou realidades, em vez de restringi-lo a pessoas.
- source_word: ἐδοκίμασα
  choice: pus à prova
  rationale: Comunica exame pela experiência, em vez de mera vivência passiva.
- source_word: ἐξεζήτησα
  choice: busquei com empenho
  rationale: Reflete a força intensiva do verbo composto em português natural.
theological_decisions:
- issue: O paradoxo διὸ καὶ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει
  choice: Por isso, a vida eterna também aguarda a morte.
  alternative: Por isso, além da morte há vida eterna.
  rationale: A sintaxe grega apresenta 'a vida eterna' como sujeito e 'a morte' como objeto. A tradução conserva a formulação difícil e sua tensão teológica, sem convertê-la em explicação interpretativa.
- issue: A sequência de expressões com ὑπό
  choice: Manter 'sob' no texto principal.
  alternative: Traduzir como 'pertence a', 'está do lado de' ou 'está sob o domínio de'.
  rationale: A repetição forma um padrão moral e cosmológico deliberado. 'Sob' preserva a imagem e não decide se a relação é de domínio, esfera, classificação ou dependência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por paralelismo conciso. Mantiveram-se as formulações incomuns quando elas refletem ambiguidade ou tensão real do grego; recursos mais idiomáticos foram usados apenas onde não eliminam essa abertura.
