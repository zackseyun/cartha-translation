  rationale: 'A revisão corrige duas expansões interpretativas: recupera em 4.3 a relação de “juntamente com” preservada pelo grego difícil, com nota que reconhece a incerteza textual, e traduz ἰδεῖν ἡμέρας ἀγαθάς em 4.4 por “ver bons dias”. Também uniformiza a nota b com a tradução principal. O plural “o destruíram” em 4.2 concorda com “muitos” e representa o particípio aoristo de modo natural em português.'
