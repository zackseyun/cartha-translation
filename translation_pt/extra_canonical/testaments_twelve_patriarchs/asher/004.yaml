base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004.yaml
  text: '1 For good men[a], being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God. 2 And many, in doing away with the wicked, perform two works, one good and one evil; yet the whole is good, because he has uprooted and destroyed the evil. 3 There is one who hates the merciful man and the unjust man, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what only seems good together with what is truly good[b]. 4 Another does not wish to see good days with the wasteful, lest he defile his body and pollute his soul. Even though this is double-faced, yet it is wholly good. 5 For such men are like gazelles and deer: in the bearing of wild animals they seem to be unclean, but in every respect they are clean, because they walk in zeal for the Lord, keeping away from those things which God also hates and forbids through the commandments[d][c], thus holding back
    evil from good.'
translation:
  language: pt
  text: '**Testamento de Aser 4**


    1 Pois os homens bons, sendo de uma só face[a], ainda que os de duas faces pensem que eles pecam, são justos diante de Deus. 2 Muitos, ao eliminarem os maus, realizam duas obras, uma boa e outra má; contudo, o conjunto é bom, porque, tendo extirpado o mal, o destruíram. 3 Há quem odeie tanto o misericordioso como o injusto, tanto o adúltero como aquele que jejua; isso também tem duas faces. Contudo, a obra inteira é boa, porque imita o Senhor, não esperando o que parece bom juntamente com o que é verdadeiramente bom[b]. 4 Outro não quer ver bons dias com os devassos, para não desonrar o corpo nem contaminar a alma. Ainda que isso tenha duas faces, é inteiramente bom. 5 Pois tais pessoas são semelhantes a gazelas e cervos: em seu jeito de animais selvagens, parecem impuras, mas são inteiramente puras[c], porque andam com zelo pelo Senhor, abstendo-se das coisas que Deus odeia e proíbe por meio dos mandamentos, mantendo assim o mal afastado do bem[d].


    [a] Ou: “sendo sinceros”. A expressão grega significa literalmente “de uma só face” e contrasta com “de duas faces” ao longo do capítulo.


    [b] A construção grega desta oração é difícil e o texto apresenta problemas de transmissão. A tradução preserva o contraste entre o bem apenas aparente e o bem verdadeiro, bem como a ideia de não esperar ou acolher o primeiro juntamente com o segundo.


    [c] A comparação provavelmente se refere a criaturas que, por sua aparência ou seu comportamento selvagem, podem parecer impuras, embora sejam de fato puras. O ponto é o contraste entre a aparência moral e a verdadeira pureza.


    [d] A oração final é concisa no grego e também pode ser traduzida como “separando o mal do bem”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sendo sinceros”. A expressão grega significa literalmente “de uma só face” e contrasta com “de duas faces” ao longo do capítulo.'
    reason: Alternativa lexical e explicação da metáfora dominante.
  - marker: b
    text: A construção grega desta oração é difícil e o texto apresenta problemas de transmissão. A tradução preserva o contraste entre o bem apenas aparente e o bem verdadeiro, bem como a ideia de não esperar ou acolher o primeiro juntamente com o segundo.
    reason: Dificuldade textual e sintática; preservação da relação expressa por “juntamente com”.
  - marker: c
    text: A comparação provavelmente se refere a criaturas que, por sua aparência ou seu comportamento selvagem, podem parecer impuras, embora sejam de fato puras. O ponto é o contraste entre a aparência moral e a verdadeira pureza.
    reason: Nota cultural e explicação da comparação animal.
  - marker: d
    text: A oração final é concisa no grego e também pode ser traduzida como “separando o mal do bem”.
    reason: Sintaxe comprimida e leitura alternativa.
lexical_decisions:
- source_word: μονοπρόσωποι / διπρόσωποι
  choice: de uma só face / de duas faces
  rationale: Preserva a metáfora facial que estrutura o capítulo e evita reduzir o contraste a mera sinceridade versus hipocrisia.
- source_word: ἀναιροῦντες τοὺς πονηρούς
  choice: ao eliminarem os maus
  rationale: ἀναιρέω pode indicar matar, destruir ou remover. “Eliminar” conserva a força e a ambiguidade sem especificar indevidamente o meio.
- source_word: τὸ δὲ ὅλον καλόν
  choice: contudo, o resultado inteiro é bom
  rationale: No versículo 2, “resultado inteiro” torna natural a avaliação do conjunto da ação; nos versículos seguintes, a fórmula é mantida como “a obra inteira” ou “inteiramente bom”.
- source_word: μισῶν
  choice: odeie
  rationale: Traduz diretamente o verbo, preservando a formulação moralmente tensa do texto sem suavizá-la para “rejeitar” ou “desaprovar”.
- source_word: τὸ δοκοῦν καλὸν ... τοῦ ἀληθινοῦ καλοῦ
  choice: o que parece bom ... o que é verdadeiramente bom
  rationale: Mantém o contraste central entre bondade aparente e bondade genuína.
- source_word: ἀσώτων
  choice: devassos
  rationale: O termo descreve pessoas dissolutas ou de vida moralmente desregrada; “devassos” comunica esse sentido mais claramente do que o literal “desperdiçadores”.
- source_word: αἰσχράνει ... μολυνεῖ
  choice: desonrar ... contaminar
  rationale: Distingue a vergonha ou desonra corporal da contaminação da alma e preserva o paralelismo.
- source_word: δορκάσι καὶ ἐλάφοις
  choice: gazelas e cervos
  rationale: Mantém distintos os dois animais e oferece equivalentes naturais e reconhecíveis em português.
- source_word: ἐν ἤθει ἀγρίων
  choice: pelo modo de ser dos animais selvagens
  rationale: ἦθος pode referir-se a modo, comportamento ou disposição; a formulação preserva a referência à impressão exterior sem restringi-la apenas à aparência física.
- source_word: ἐν ζήλῳ Κυρίου
  choice: com zelo pelo Senhor
  rationale: Interpreta o genitivo como o objeto do zelo humano, de modo natural em português, sem excluir por nota uma leitura alternativa.
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: mantendo assim o mal afastado do bem
  rationale: A expressão grega é comprimida; esta tradução conserva a imagem de impedir que o mal se associe ao bem sem resolver excessivamente a sintaxe.
theological_decisions:
- issue: Avaliação moral de atos que parecem ter “duas faces”
  choice: Preservar a afirmação de que certas ações exteriormente mistas ou severas podem ser inteiramente boas em seu conjunto.
  alternative: Entender toda duplicidade como condenada ou tomar o texto como aprovação irrestrita de meios moralmente maus.
  rationale: A repetição de que algo “tem duas faces”, mas é inteiramente bom, exige manter a tensão argumentativa. A tradução não harmoniza nem transforma essa afirmação em regra ética geral.
- issue: Sentido de μιμεῖται Κύριον
  choice: “imita o Senhor”
  alternative: “segue Deus” ou uma identificação cristológica explícita do Senhor.
  rationale: A tradução reproduz o verbo de imitação e o título Κύριον, sem importar uma identificação denominacional ou cristológica que o contexto não explicita.
- issue: Interpretação da oração corrompida no versículo 3
  choice: “não tomando o que parece bom pelo que é verdadeiramente bom”
  alternative: “não esperando/acolhendo o bem aparente juntamente com o bem verdadeiro”.
  rationale: Os sinais críticos e a construção grega indicam dificuldade textual. A redação principal comunica o contraste moral, enquanto a nota registra uma leitura mais formal e evita ocultar a incerteza.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantiveram-se as metáforas incomuns “de uma só face” e “de duas faces” por serem estruturais ao argumento. Empregaram-se formas correntes como “diante de Deus”, “por meio dos mandamentos” e “com zelo pelo Senhor”, evitando arcaísmos desnecessários. As dificuldades textuais do versículo 3 e da oração final foram explicitadas em notas.
