    1 Pois os homens bons, sendo de uma só face[a], ainda que os de duas faces pensem que eles pecam, são justos diante de Deus. 2 Muitos, ao eliminarem os maus, realizam duas obras, uma boa e outra má; contudo, o conjunto é bom, porque, tendo extirpado o mal, o destruíram. 3 Há quem odeie tanto o misericordioso como o injusto, tanto o adúltero como aquele que jejua; isso também tem duas faces. Contudo, a obra inteira é boa, porque imita o Senhor, não esperando o que parece bom juntamente com o que é verdadeiramente bom[b]. 4 Outro não quer ver bons dias com os devassos, para não desonrar o corpo nem contaminar a alma. Ainda que isso tenha duas faces, é inteiramente bom. 5 Pois tais pessoas são semelhantes a gazelas e cervos: em seu jeito de animais selvagens, parecem impuras, mas são inteiramente puras[c], porque andam com zelo pelo Senhor, abstendo-se das coisas que Deus odeia e proíbe por meio dos mandamentos, mantendo assim o mal afastado do bem[d].


