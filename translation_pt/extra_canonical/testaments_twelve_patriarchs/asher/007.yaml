base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007.yaml
  text: '...crushing the head of the dragon upon the water[a]. He will save Israel and all the nations [God appearing as a man].


    4 Therefore, my children, you also tell these things to your children, so that they may not disobey him. 5 For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men. 6 And because of this you will be scattered, like Gad and Dan my brothers, and you will not know their land, tribe, and language. 7 But the Lord will gather you in faith through his compassion[c][b], and through Abraham and Isaac and Jacob.'
translation:
  language: pt
  text: '**Testamento de Aser 7**


    **1** Não sejam como Sodoma, que não reconheceu os anjos do Senhor e foi destruída para sempre. **2** Pois eu sei que vocês pecarão e serão entregues nas mãos de seus inimigos. Sua terra ficará desolada, seus lugares santos serão completamente destruídos, e vocês serão dispersos pelos quatro cantos da terra. Vocês se tornarão uma dispersão, desprezados como água imprestável, **3** até que o Altíssimo visite a terra. Ele mesmo virá como homem entre os seres humanos, comendo, bebendo e esmagando a cabeça do dragão sobre a água. Ele salvará Israel e todas as nações — [Deus assumindo a aparência de homem].[a]


    **4** Portanto, meus filhos, contem também estas coisas aos seus filhos, para que não lhe desobedeçam. **5** Pois eu sei que vocês certamente desobedecerão e agirão de modo ímpio, não dando atenção à lei de Deus, mas deixando-se corromper pela maldade por meio de mandamentos humanos. **6** Por isso, vocês serão dispersos como meus irmãos Gade e Dã, e não conhecerão sua terra, tribo e língua. **7** Mas ele reunirá vocês na fé[b], por sua compaixão[c] e por meio de Abraão, Isaque e Jacó.


    [a] As palavras entre colchetes, “Deus assumindo a aparência de homem”, provavelmente representam uma leitura textualmente incerta ou uma ampliação na tradição grega. Elas são traduzidas aqui porque constam do testemunho fornecido. O verbo grego também pode significar “representando o papel de” ou, em certos contextos, “fingindo ser”; a tradução adotada evita impor a ideia de engano, sem eliminar a dificuldade da expressão.


    [b] “Na fé” também pode ser entendido como “na fidelidade”.


    [c] A dispersão e a reunião posterior evocam os temas de juízo e restauração da aliança encontrados ao longo das Escrituras de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras entre colchetes, “Deus assumindo a aparência de homem”, provavelmente representam uma leitura textualmente incerta ou uma ampliação na tradição grega. Elas são traduzidas aqui porque constam do testemunho fornecido. O verbo grego também pode significar “representando o papel de” ou, em certos contextos, “fingindo ser”; a tradução adotada evita impor a ideia de engano, sem eliminar a dificuldade da expressão.
