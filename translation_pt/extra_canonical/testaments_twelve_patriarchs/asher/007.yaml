    reason: cross_reference
lexical_decisions:
- source_word: ἠγνόησε
  choice: não reconheceu
  rationale: No contexto de Sodoma e dos anjos, pode indicar que a cidade não os reconheceu ou não lhes deu o devido reconhecimento; a formulação preserva essa amplitude melhor que uma explicação moralizante.
- source_word: καταφθαρήσονται
  choice: serão completamente destruídos
  rationale: O verbo intensificado comunica destruição profunda ou completa, aqui aplicada aos lugares santos.
- source_word: εἰς διασπορὰν
  choice: na dispersão
  rationale: Conserva o vocabulário bíblico de exílio e dispersão sem transformar o substantivo em designação técnica posterior.
- source_word: ὕδωρ ἄχρηστον
  choice: água imprestável
  rationale: Reproduz a comparação incomum e depreciativa do grego sem tentar explicá-la no corpo do texto.
- source_word: ἐπισκέψηται
  choice: visite
  rationale: Preserva o verbo tradicional de visitação, que pode envolver intervenção favorável ou judicial, sem resolver antecipadamente sua força.
- source_word: συντρίβων
  choice: esmagará
  rationale: Transmite a ação vigorosa contra a cabeça do dragão. O futuro em português integra naturalmente o particípio à sequência profética.
- source_word: κάραν
  choice: cabeça
  rationale: Equivalente natural para o termo anatômico e apropriado à imagem da derrota do dragão.
- source_word: δράκοντος
  choice: dragão
  rationale: Mantém a designação específica e a textura apocalíptica do grego, em vez de suavizá-la para 'serpente'.
- source_word: ὑποκρινόμενος
  choice: assumindo a aparência
  rationale: O verbo pode indicar representar um papel ou fingir. A escolha evita afirmar engano como interpretação certa, mas conserva a estranheza da frase e é esclarecida em nota.
- source_word: ἀπειθοῦντες ἀπειθήσετε
  choice: certamente desobedecerão
  rationale: A construção cognata intensifica a certeza ou persistência da desobediência. Uma repetição literal seria pouco natural em português.
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: agirão de modo ímpio
  rationale: Expressa a impiedade religiosa e moral da raiz grega, condensando a repetição cognata em português corrente e digno.
- source_word: νόμῳ θεοῦ
  choice: lei de Deus
  rationale: É a equivalência transparente no contexto testamentário judaico e mantém o contraste com mandamentos humanos.
- source_word: κακίᾳ διαφθειρόμενοι
  choice: deixando-se corromper pela maldade
  rationale: Conserva tanto o processo de corrupção moral quanto a amplitude de κακία, sem restringi-la a malícia pessoal.
- source_word: ἐπισυνάξει
  choice: reunirá
  rationale: Mantém a linguagem concisa de restauração após a dispersão.
- source_word: ἐν πίστει
  choice: na fé
  rationale: Preserva a formulação breve e sua abertura semântica entre fé e fidelidade; a alternativa é registrada em nota.
theological_decisions:
- issue: Frase entre colchetes θεὸς εἰς ἄνδρα ὑποκρινόμενος
  choice: Mantida entre colchetes como “Deus assumindo a aparência de homem”
  alternative: Omitir como expansão secundária; ou traduzir “Deus fingindo ser homem”
  rationale: O testemunho grego fornecido inclui a frase, mas a sinaliza como textualmente problemática. A tradução a conserva de modo transparente, sem harmonizá-la com formulações doutrinárias posteriores nem impor a noção de engano.
- issue: Identidade daquele que salvará Israel e as nações
  choice: Mantida apenas pelo pronome “Ele”
  alternative: Explicitar “o Altíssimo”, “Deus” ou “o salvador que virá”
  rationale: Embora o contexto permita inferências, o grego não repete explicitamente o referente nessa oração. A tradução evita resolver a referência além do que o texto afirma.
- issue: Vinda “como homem entre os seres humanos”
  choice: Traduzida diretamente, sem vocabulário cristológico técnico
  alternative: Interpretar como encarnação ou mera semelhança humana
  rationale: A expressão é teologicamente carregada e textualmente associada a uma passagem difícil. A tradução conserva sua afirmação própria sem a encaixar em um sistema posterior.
- issue: Sentido de ἐν πίστει
  choice: “na fé”, com alternativa em nota
  alternative: “na fidelidade” ou “pela fé”
  rationale: A preposição e o substantivo permitem mais de uma nuance. A escolha mantém a ambiguidade relevante.
- issue: Agente da reunião no versículo 7
  choice: “ele reunirá”
  alternative: “o Senhor reunirá”
  rationale: O grego usa apenas a forma verbal com sujeito implícito. Não se acrescenta um título divino ausente neste ponto, embora o contexto o sugira.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural exortativo, mantém imagens incomuns do original e evita terminologia confessional acrescentada. As repetições cognatas semíticas/helenísticas dos versículos 5 foram transmitidas por intensificação natural, sem perder sua força retórica.
