  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003.yaml
  text: But you, my children, do not become double-faced like them, with both goodness and wickedness; rather cling to goodness alone, because the Lord God rests in it, and people long for it. But flee wickedness, destroying its scheme by your good deeds; for the double-faced are not of God, but serve their own desires, so that they may please Beliar.
translation:
  language: pt
  text: '3


    1 Mas vocês, meus filhos, não sejam como eles, de duas caras, voltados tanto para a bondade como para a maldade. Apeguem-se somente à bondade, pois o Senhor Deus repousa nela, e as pessoas a desejam. 2 Fujam da maldade, destruindo o plano dela por meio das boas ações de vocês. Pois os que têm duas caras não pertencem a Deus, mas servem aos próprios desejos, a fim de agradarem a Beliar[a] e a homens semelhantes a eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beliar: forma do nome no texto grego; também aparece como Belial em outras tradições textuais.'
    reason: Informa ao leitor a variante nominal sem harmonizar silenciosamente o texto.
lexical_decisions:
- source_word: διπρόσωποι
  choice: de duas caras / os que têm duas caras
  rationale: Preserva a metáfora concreta de ter 'duas faces', em vez de reduzi-la a uma categoria abstrata como hipocrisia ou duplicidade.
- source_word: κολλήθητε
  choice: apeguem-se
  rationale: Expressa a ideia de aderir firmemente ou manter-se unido à bondade em português natural.
- source_word: ἀναπαύεται ἐν
  choice: repousa nela
  rationale: Mantém a formulação marcante e teologicamente aberta do grego, sem substituí-la por 'agrada-se dela' ou interpretação semelhante.
- source_word: τὸ διαβούλιον
  choice: o plano dela
  rationale: Traduz o plano ou desígnio associado à maldade, preservando o singular e evitando especificar além do texto.
- source_word: ἀναιροῦντες
  choice: destruindo
  rationale: Conserva a força do verbo, que pode indicar eliminar, abolir ou destruir.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera diretamente a forma grega desta obra, em vez de harmonizá-la silenciosamente com a forma bíblica mais conhecida 'Belial'.
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: a homens semelhantes a eles
  rationale: Inclui a expressão presente no texto grego, embora ausente da camada inglesa fornecida, e conserva a referência pronominal sem a resolver indevidamente.
theological_decisions:
- issue: Sentido de 'o Senhor Deus repousa nela'
  choice: Manter a imagem do repouso divino na bondade
  alternative: Interpretar como 'o Senhor Deus se agrada dela' ou 'habita nela'
  rationale: O grego usa ἀναπαύεται, e a imagem deve permanecer sem ser convertida em uma explicação doutrinária.
- issue: Relação dos 'de duas caras' com Deus
  choice: não pertencem a Deus
  alternative: não são de Deus
  rationale: A escolha comunica naturalmente o genitivo τοῦ Θεοῦ em português atual, sem afirmar uma definição denominacional mais específica.
- issue: Identidade de Beliar
  choice: Usar apenas o nome próprio, com nota sobre a forma
  alternative: Identificá-lo no texto como Satanás, o diabo ou um demônio
  rationale: O texto não explicita essa identificação; acrescentá-la resolveria uma questão interpretativa além da evidência imediata.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais como 'vocês' e 'apeguem-se'. A repetição de 'duas caras' foi mantida para reproduzir o elo verbal do original. A segunda pessoa plural foi vertida de modo consistente com 'vocês'. A expressão final presente no grego, mas omitida na consulta inglesa, foi restaurada.
