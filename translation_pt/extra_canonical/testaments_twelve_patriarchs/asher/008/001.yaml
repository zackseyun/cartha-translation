source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: VIII. Καὶ¹ εἰπὼν αὐτοῖς ταῦτα ἐνετείλατο λέγων²· Θάψατέ με ἐν³ Χεβρών⁴. Καὶ ἀπέθανεν⁵ †ὕπνῳ⁶ καλῷ κοιμηθείς⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008/001.yaml
  text: And after saying these things to them, he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep.
translation:
  language: pt
  text: 'E, depois de lhes dizer essas coisas, ordenou-lhes: “Sepultem-me em Hebrom.” Então morreu, adormecendo num bom sono.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “adormecendo num bom sono” é incomum, e o texto desta edição apresenta incerteza nesse ponto.
    reason: O sinal crítico † na edição indica possível corrupção ou dificuldade textual em torno de ὕπνῳ καλῷ κοιμηθείς; a nota informa a incerteza sem substituir o texto recebido por conjectura.
lexical_decisions:
- source_word: Θάψατέ με
  choice: Sepultem-me
  rationale: O imperativo plural aoristo é vertido por uma ordem direta e natural em português; “sepultar” preserva o registro digno do contexto funerário.
- source_word: Χεβρών
  choice: Hebrom
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Tradução direta do verbo, sem atenuar a declaração explícita da morte.
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: adormecendo num bom sono
  rationale: Mantém a repetição etimológica e a imagem do sono presentes no grego, embora a expressão seja incomum em português.
theological_decisions:
- issue: Relação entre morte e sono
  choice: Preservar lado a lado “morreu” e “adormecendo”
  alternative: Parafrasear apenas como “teve uma morte tranquila”
  rationale: O texto afirma a morte e simultaneamente emprega a metáfora do sono; a tradução não deve reduzir essa tensão a uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de uso brasileiro (“sepultem”) e preservação deliberada da imagem incomum do original.
source_grounding:
  english_pob_role: consult_only
