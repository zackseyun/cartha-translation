  text: And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: pt
  text: E seus filhos fizeram tudo o que ele lhes havia ordenado, levaram-no para Hebrom e o sepultaram com seus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν ... ὅσα ἐνετείλατο αὐτοῖς
  choice: fizeram tudo o que ele lhes havia ordenado
  rationale: Expressa naturalmente em português o sentido de cumprimento integral daquilo que fora ordenado, preservando a relação temporal anterior do mais-que-perfeito composto.
- source_word: ἀπήγαγον αὐτὸν
  choice: levaram-no
  rationale: Reproduz o sentido de conduzir ou transportar alguém para outro lugar sem acrescentar detalhes não presentes no grego.
- source_word: ἐν Χεβρών
  choice: para Hebrom
  rationale: Embora ἐν normalmente signifique “em”, aqui a tradição textual e o verbo de movimento favorecem o destino; “para Hebrom” produz o sentido contextual natural.
- source_word: ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  choice: o sepultaram com seus pais
  rationale: Mantém a formulação genealógica tradicional, na qual “pais” pode abranger os antepassados, sem explicitação interpretativa no corpo do texto.
