  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002.yaml
  text: '1 There is, then, a soul that in its words turns away the good for the sake of evil, and leads the outcome of the matter into wickedness.


    2 There is a man who does not pity his own servants; and though this is double-faced, the whole of it is evil.


    3 And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man''s account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.


    4 Even if they are in love, they are in wickedness when they hide evil under a good name; but the end of the deed comes to evil.


    5 Another steals, acts unjustly, plunders, is greedy, and yet shows mercy to the poor. This too is double-faced, but the whole of it is evil.


    6 The one who defrauds his neighbor provokes God, swears falsely by the Most High, and has no regard for the Lord, the giver of the law, yet gives rest to the poor.


    7 He stains the soul and makes the body bright; he kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.


    8 Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the force of his wealth he drags many down, and out of his excessive wickedness performs the commandments. This is double-faced, but the whole of it is evil.


    9 Such people are like hares, because they are half clean, but in truth they are unclean.


    10 For God also, in the tablets of the commandments, has declared it so.'
translation:
  language: pt
  text: '**Testamento de Aser 2**


    1 Há, portanto, uma pessoa que, em suas palavras, desvia o bem em favor do mal e conduz o desfecho da questão à maldade.


    2 Há quem não tenha compaixão de seus próprios servos. Embora isso tenha duas faces, o conjunto é mau.


    3 Há também quem ame uma pessoa que pratica o mal, porque ele próprio escolhe até morrer no mal por causa dela. Quanto a esse homem, fica claro que ele tem duas faces, mas o conjunto é uma prática má.


    4 Mesmo que haja amor, há maldade quando se encobre o mal com um nome bom[a]; o fim dessa conduta, porém, resulta em mal.


    5 Outro rouba, comete injustiça, saqueia, age com ganância e ainda assim mostra misericórdia aos pobres. Isso também tem duas faces, mas o conjunto é mau.


    6 Quem explora o próximo provoca Deus, jura falsamente pelo Altíssimo e não faz caso do Senhor, que deu a Lei, embora dê alívio ao pobre[b].


    7 Mancha a alma e embeleza o corpo; mata muitos e mostra misericórdia a poucos. Isso também tem duas faces, mas o conjunto é mau.


    8 Outro comete adultério e imoralidade sexual, mas se abstém de certos alimentos. Enquanto jejua, pratica o mal; pelo poder de sua riqueza, arrasta muitos para a ruína e, em meio à sua enorme maldade, cumpre os mandamentos. Isso tem duas faces, mas o conjunto é mau.


    9 Essas pessoas são como lebres[c], pois são limpas pela metade, mas, na verdade, são impuras.


    10 Pois Deus também declarou isso nas tábuas dos mandamentos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego deste versículo está corrompido e admite outras reconstruções. O sentido geral parece ser que o mal é ocultado sob uma designação respeitável, como a de amor.
    reason: Sinaliza incerteza textual genuína sem sobrecarregar o texto principal.
  - marker: b
    text: 'Alguns elementos do texto grego deste versículo estão desordenados. A tradução segue a sequência de contrastes: ofender a Deus e desconsiderar o Legislador, mas socorrer o pobre.'
    reason: Explica a sintaxe difícil e preserva o contraste moral central.
  - marker: c
    text: O grego diz literalmente “pés peludos”, antiga designação das lebres. A comparação reflete a ideia de que elas pareciam limpas apenas em parte, embora fossem classificadas como impuras.
    reason: Esclarece uma expressão zoológica antiga e a lógica da comparação.
lexical_decisions:
- source_word: ψυχή
  choice: pessoa
  rationale: Embora o sentido básico seja “alma”, aqui o termo designa a pessoa em sua atuação moral; “pessoa” produz português natural sem transformar o enunciado em uma afirmação técnica sobre a composição humana.
- source_word: διπρόσωπον
  choice: tem duas faces
  rationale: Conserva a imagem grega de duplicidade e o contraste entre uma aparência parcialmente boa e o caráter mau do conjunto, sem reduzir o termo apenas a “hipócrita”.
- source_word: πλεονεκτῶν
  choice: explora
  rationale: No contexto do próximo prejudicado, expressa a ganância que obtém vantagem à custa de outra pessoa; evita limitar o sentido a fraude financeira formal.
- source_word: ἀθετεῖ
  choice: não faz caso de
  rationale: O verbo pode significar rejeitar, desprezar ou pôr de lado. A expressão preserva essa amplitude e acompanha a leitura adjudicada da camada inglesa.
- source_word: ἀναπαύει
  choice: dê alívio
  rationale: Reproduz o contraste entre prejudicar gravemente e, ao mesmo tempo, proporcionar algum descanso ou socorro ao pobre.
- source_word: δασύποδες
  choice: lebres
  rationale: Literalmente “pés peludos”, designação antiga da lebre; o referente concreto é necessário para entender a comparação ritual do versículo.
- source_word: πλάξ
  choice: tábuas
  rationale: Termo tradicional e direto para as tábuas em que foram inscritos os mandamentos.
theological_decisions:
- issue: Avaliação moral de atos mistos
  choice: Manter o refrão segundo o qual a conduta “tem duas faces”, mas “o conjunto é mau”
  alternative: Descrever as obras de misericórdia como boas obras que compensam parcialmente os pecados
  rationale: O texto não apresenta uma contabilidade de méritos; insiste que atos exteriormente bons não tornam boa uma conduta dominada pela injustiça.
- issue: Cumprimento dos mandamentos em meio à maldade
  choice: “em meio à sua enorme maldade, cumpre os mandamentos”
  alternative: “por causa de sua enorme maldade, cumpre os mandamentos”
  rationale: A construção grega é difícil. A tradução conserva a tensão intencional entre observância externa e maldade abrangente, sem alegar que a maldade seja a causa da obediência.
- issue: Referência às tábuas dos mandamentos
  choice: Manter a alusão geral, sem inserir uma citação bíblica específica
  alternative: Identificar explicitamente Levítico ou Deuteronômio
  rationale: O capítulo termina anunciando que Deus declarou isso nas tábuas, mas o trecho fornecido não contém a formulação seguinte nem autoriza uma identificação mais estreita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Preferiram-se frases diretas e “Lei” com inicial maiúscula quando designa a Lei dada pelo Senhor. O refrão repetitivo foi preservado por sua função retórica. As construções mais obscuras dos versículos 4 e 6 foram traduzidas com cautela e assinaladas em notas.
