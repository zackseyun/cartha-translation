    1 Há, portanto, uma alma que, em suas palavras, troca o bem pelo mal e conduz o desfecho da questão à maldade.


    2 Há quem não tenha compaixão de seus próprios servos. Embora isso tenha duas faces, o conjunto é mau.


    3 Há também quem ame uma pessoa que pratica o mal — o que é maldade —, pois também escolhe morrer no mal. Quanto a isso, é claro que tem duas faces, mas o conjunto é uma prática má.


    4 Mesmo havendo amor, quem encobre o mal sob o bom nome do amor[a] está na maldade; o fim dessa conduta, porém, resulta em mal.


    5 Outro rouba, comete injustiça, saqueia, age com ganância e ainda assim mostra misericórdia aos pobres. Isso também tem duas faces, mas o conjunto é mau.


