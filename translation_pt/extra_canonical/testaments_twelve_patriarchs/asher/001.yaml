  text: '1[1]. The copy of the testament of Asher.


    2. In the one hundred and twenty-fifth year of his life, while still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything upright before God.


    3. God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two outcomes.


    4. Therefore all things are twofold[2], set one over against the other.


    5. For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.


    6. If, then, the soul desires to walk well, it does all its deeds in righteousness; and even if it sins, it immediately repents.


    7. For by thinking righteous thoughts and casting away wickedness, it at once overturns evil and uproots sin.


    8. But if its purpose inclines to evil, all its deeds are in wickedness, driving away the good and clinging to the evil, and it is ruled by Beliar; and even if it does something good, it turns it into evil.


    9. For whenever it begins to do good in an evil way, it drives the end of the action for him into evil, because the treasure of its purpose is filled with an evil spirit.


    10. My children, obey your father, and bury me near my fathers.”


    11. And after he had drawn up his feet, he fell asleep in peace.


    12. And after five years they carried him up to Hebron[3], and placed him with his fathers.'
translation:
  language: pt
  text: '**Testamento de Aser, décimo filho de Jacó e de Zelfa**


    **1.** Cópia do testamento de Aser, que ele disse a seus filhos no centésimo vigésimo quinto ano de sua vida.


    **2.** Estando ainda com saúde, disse-lhes: “Escutem seu pai, filhos de Aser, e eu lhes mostrarei tudo o que é reto diante de Deus.


    **3.** Deus deu aos filhos dos homens dois caminhos, dois propósitos, duas ações, duas maneiras e dois desfechos.


    **4.** Por isso, todas as coisas são duplas, uma em oposição à outra.[a]


    **5.** Pois há dois caminhos: o do bem e o do mal. Neles estão os dois propósitos em nosso peito,[b] os quais os distinguem.


    **6.** Portanto, se a alma deseja andar bem,[c] pratica todas as suas ações com justiça; e, ainda que peque, arrepende-se imediatamente.


    **7.** Pois, pensando no que é justo e rejeitando a maldade, ela logo derrota o mal e arranca o pecado pela raiz.


    **8.** Mas, se o seu propósito se inclina para a maldade, toda ação dela se realiza na maldade: ela repele o bem, apega-se ao mal e fica dominada por Beliar. Mesmo que faça algo bom, transforma-o em mal.[d]


    **9.** Pois, quando começa a fazer o bem, o desfecho da ação o conduz ao mal, porque o tesouro do seu propósito está cheio de um espírito maligno.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todas as coisas são duas, uma diante da outra”. A expressão ressalta a oposição em pares.
    reason: lexical_alternative
  - marker: b
    text: O grego emprega o termo concreto para o peito como sede da deliberação interior; “coração” seria uma tradução mais interpretativa.
    reason: lexical_alternative
  - marker: c
    text: A expressão grega traduzida por “andar bem” apresenta incerteza textual, mas esse é o sentido mais provável no contexto dos dois caminhos.
    reason: textual_variant
  - marker: d
    text: O texto grego deste versículo apresenta irregularidades gramaticais na sequência dos particípios; a tradução conserva o sentido provável da oposição entre rejeitar o bem e apegar-se ao mal.
    reason: textual_variant
lexical_decisions:
- source_word: ὑγιαίνων
  choice: estando ainda com saúde
  rationale: Expressa naturalmente a condição física de Aser no momento do discurso e conserva o valor circunstancial do particípio.
- source_word: εὐθές
  choice: reto
  rationale: Comunica retidão moral diante de Deus em linguagem bíblica clara e atual.
- source_word: διαβούλια
  choice: propósitos
  rationale: O termo aponta para deliberações ou orientações interiores; “propósitos” preserva essa dimensão intencional sem reduzi-la a planos externos.
- source_word: τρόπους
  choice: maneiras
  rationale: Distingue o termo de ὁδοί, traduzido por “caminhos”, e mantém a acumulação retórica da lista.
- source_word: τέλεα
  choice: desfechos
  rationale: Indica os resultados ou fins a que chegam os cursos morais; “desfechos” é claro sem determinar além do texto se se trata de finalidade ou resultado.
- source_word: στέρνοις
  choice: peito
  rationale: Mantém a imagem corporal concreta do grego para o lugar da deliberação interior, em vez de substituí-la interpretativamente por “coração”.
- source_word: πορευθῆναι
  choice: andar
  rationale: Preserva a conhecida metáfora ética do caminhar, adequada ao contraste entre os dois caminhos.
- source_word: ἐν δικαιοσύνῃ
  choice: com justiça
  rationale: Expressa o modo justo de agir em português natural, mantendo o conteúdo moral de δικαιοσύνη.
- source_word: μετανοεῖ
  choice: arrepende-se
  rationale: O contexto trata de pecado concreto e reversão moral imediata, para os quais “arrepender-se” é a tradução apropriada.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Conserva como nome próprio a forma presente no testemunho grego, sem substituí-la pela forma hebraizante “Belial” nem reduzi-la a uma abstração.
theological_decisions:
- issue: Dualidade moral dos dois caminhos
  choice: Manter a repetição enfática de “dois” e a oposição entre bem e mal
  alternative: Interpretar a passagem como dualismo metafísico absoluto ou suavizá-la como simples diversidade de escolhas
  rationale: O texto descreve uma antítese aguda nos caminhos e propósitos da vida humana, mas não desenvolve aqui uma ontologia de dois princípios eternos.
- issue: A ação de Beliar
  choice: Apresentar Beliar como poder pessoal que domina a alma inclinada ao mal
  alternative: Traduzir o nome como “indignidade” ou como mera personificação impessoal do mal
  rationale: Βελίαρ funciona sintaticamente como agente dominador e aparece como nome próprio no testemunho grego.
- issue: Agência e referência pronominal nos versículos 8–9
  choice: Manter a alma como referente contextual e traduzir o propósito como sua orientação interior
  alternative: Reformular toda a passagem para atribuir cada ação exclusivamente ao propósito
  rationale: A sintaxe grega oscila e apresenta irregularidades, mas o desenvolvimento do argumento parte da alma e de seu propósito; a tradução preserva essa tensão sem criar uma psicologia mais sistemática que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” de modo implícito nas formas verbais e pronominais, evitando tanto arcaísmos como coloquialismos. A metáfora do caminhar e a imagem concreta do peito foram preservadas. O título presente no testemunho grego foi traduzido, e o capítulo foi limitado ao material efetivamente fornecido na fonte grega (1–9), sem incorporar os versículos adicionais da camada inglesa.
