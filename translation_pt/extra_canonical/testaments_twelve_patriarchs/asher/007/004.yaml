lexical_decisions:
- source_word: Εἴπατε
  choice: devem dizer
  rationale: O imperativo aoristo é expresso como uma exortação direta e natural em português, preservando sua força normativa.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Mantém o vocativo afetivo e o vínculo familiar do texto grego.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Conserva a referência abrangente ao ensino anterior sem explicitar conteúdo que o grego deixa implícito.
- source_word: μὴ ἀπειθήσωσιν
  choice: para que eles não ... desobedeçam
  rationale: Reproduz a oração de finalidade com μή e o sentido de recusa em obedecer.
- source_word: αὐτῷ
  choice: lhe
  rationale: Preserva o referente masculino singular pronominal do grego sem identificá-lo além do que o contexto imediato fornece.
theological_decisions:
- issue: Referente de αὐτῷ
  choice: lhe
  alternative: a ele
  rationale: A forma enclítica é natural em português e mantém a ambiguidade do referente masculino singular, sem introduzir uma identificação teológica não expressa no versículo.
