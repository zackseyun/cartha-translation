  text: Do not be like Sodom, which did not recognize the angels of the Lord, and perished forever.
translation:
  language: pt
  text: 7 Não sejam como Sodoma, que não reconheceu os anjos do Senhor e pereceu para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Não sejam
  rationale: Expressa naturalmente a proibição de tornar-se ou mostrar-se semelhante a Sodoma; a comparação seguinte completa o sentido.
- source_word: ἠγνόησε
  choice: não reconheceu
  rationale: Preserva o sentido de não reconhecer ou não discernir quem eram os visitantes, sem reduzir o verbo simplesmente a falta de informação.
- source_word: τοὺς ἀγγέλους Κυρίου
  choice: os anjos do Senhor
  rationale: Tradução direta da expressão grega, mantendo a identificação teológica do texto.
- source_word: ἀπώλετο ἕως αἰῶνος
  choice: pereceu para sempre
  rationale: Verte de modo claro a destruição de Sodoma e a duração enfática indicada por ἕως αἰῶνος.
theological_decisions:
- issue: Natureza da falha de Sodoma em relação aos visitantes
  choice: não reconheceu os anjos do Senhor
  alternative: ignorou os anjos do Senhor
  rationale: “Não reconheceu” conserva a possibilidade de falta de percepção da identidade dos visitantes, sem impor que a falha tenha sido mera negligência deliberada.
- issue: Força temporal de ἕως αἰῶνος
  choice: para sempre
  alternative: até a eternidade
  rationale: “Para sempre” é idiomático e mantém a força duradoura da fórmula sem introduzir uma construção artificial em português.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta e legibilidade brasileira. Mantém-se “Sodoma” e “Senhor” na forma bíblica corrente.
