base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/003.yaml
  text: Until the Most High visits the earth, himself coming as a man, eating and drinking with men, and crushing the head of the dragon upon the water; this one will save Israel and all the nations [God appearing as a man].
translation:
  language: pt
  text: Até que o Altíssimo visite a terra, vindo ele mesmo como um homem, comendo e bebendo com os homens e esmagando a cabeça do dragão sobre a água; ele salvará Israel e todas as nações [Deus assumindo a aparência de homem].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “Deus assumindo a aparência de homem” aparece entre colchetes na edição grega usada, indicando que sua condição textual ou editorial é distinta do restante da frase.
    reason: Preserva de modo transparente os colchetes da fonte e alerta o leitor para a incerteza textual, sem omitir a expressão.
lexical_decisions:
- source_word: ἐπισκέψηται
  choice: visite
  rationale: Preserva o sentido básico de visitar ou intervir em favor de alguém, sem explicitar além do grego a natureza dessa visitação.
- source_word: ὡς ἄνθρωπος μετὰ ἀνθρώπων
  choice: como homem entre os homens
  rationale: Expressão natural em português que mantém tanto a comparação introduzida por ὡς quanto a convivência indicada por μετά.
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος
  choice: esmague a cabeça do dragão
  rationale: ‘Esmagar’ comunica a ação forte de συντρίβω, e ‘cabeça’ é o equivalente corrente de κάρα neste contexto.
- source_word: ἐπὶ τοῦ ὕδατος
  choice: sobre a água
  rationale: Mantém a relação espacial relativamente aberta de ἐπί com genitivo; evita especificar indevidamente se a ação ocorre em cima, por cima ou junto à água.
- source_word: οὗτος σώσει
  choice: Ele é quem salvará
  rationale: Reproduz a força demonstrativa e enfática de οὗτος, em vez de reduzi-la a um pronome neutro.
- source_word: ὑποκρινόμενος
  choice: sob a aparência de
  rationale: O particípio pode indicar assumir um papel, apresentar-se ou disfarçar-se. A formulação escolhida conserva essa amplitude sem atribuir necessariamente intenção enganosa.
theological_decisions:
- issue: Identidade do sujeito que vem como homem
  choice: Manter ‘ele mesmo’ e a cláusula final entre colchetes
  alternative: Explicitar diretamente que o Altíssimo se torna homem
  rationale: O texto associa estreitamente o Altíssimo ao que vem como homem, mas sua sintaxe e a forma editorialmente marcada da cláusula final recomendam preservar a formulação e a tensão do original, sem impor uma definição cristológica posterior.
- issue: Sentido de ὑποκρινόμενος
  choice: ‘sob a aparência de homem’
  alternative: ‘disfarçado de homem’ ou ‘fazendo-se passar por homem’
  rationale: As alternativas podem sugerir fraude ou mera simulação. A escolha retém a ideia de apresentação sob forma ou papel humano sem resolver se o texto fala de aparência, representação ou disfarce.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A cadência solene foi preservada sem recorrer a construções arcaicas.
