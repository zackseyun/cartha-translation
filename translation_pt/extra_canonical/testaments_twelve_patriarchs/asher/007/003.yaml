revisions:
- from: Até que o Altíssimo visite a terra, vindo ele mesmo como homem entre os homens, comendo e bebendo, e esmague a cabeça do dragão sobre a água. Ele é quem salvará Israel e todas as nações — [Deus sob a aparência de homem].[a]
  to: Até que o Altíssimo visite a terra, vindo ele mesmo como um homem, comendo e bebendo com os homens e esmagando a cabeça do dragão sobre a água; ele salvará Israel e todas as nações [Deus assumindo a aparência de homem].[a]
  rationale: A revisão restabelece explicitamente «com os homens» como complemento de «comendo e bebendo» e reproduz a sequência descritiva dos particípios gregos com «vindo», «comendo», «bebendo» e «esmagando». Mantém-se «sobre a água», pois ἐπὶ τοῦ ὕδατος admite uma relação espacial que não deve ser especificada além do necessário. A nota entre colchetes é preservada, com uma formulação portuguesa que mantém a ambiguidade de ὑποκρινόμενος.
