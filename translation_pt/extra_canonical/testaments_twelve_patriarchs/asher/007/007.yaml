id: T12P.ASH.7.7
reference: Testament of Asher 7:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἀλλ᾽ ἐπισυνάξει ὑμᾶς⁴⁵ ἐν πίστει διὰ τῆς⁴⁶ εὐσπλαγχνίας αὐτοῦ, καὶ⁴⁷ δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/007.yaml
  text: But the Lord will gather you in faith through his compassion, and through Abraham and Isaac and Jacob.
translation:
  language: pt
  text: Mas ele[a] reunirá vocês na fé[b], por meio da sua compaixão e por meio de Abraão, Isaque e Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz o sujeito de forma implícita: literalmente, “reunirá vocês”. Conforme o contexto, “ele” pode referir-se ao Senhor.'
    reason: Evitar introduzir no texto principal um sujeito nominal ausente da oração grega, sem ocultar sua provável identificação contextual.
  - marker: b
    text: 'Ou: “em fidelidade” ou “com fidelidade”.'
    reason: Registrar a amplitude semântica de πίστις e a possível força da preposição ἐν.
lexical_decisions:
- source_word: ἐπισυνάξει
  choice: reunirá
  rationale: Expressa de modo natural o sentido de ajuntar ou congregar pessoas dispersas, preservando o valor futuro do verbo.
- source_word: ἐν πίστει
  choice: na fé
  rationale: Mantém a formulação concisa e a ambiguidade possível de πίστις entre fé, confiança e fidelidade; a alternativa é registrada em nota.
- source_word: διὰ τῆς εὐσπλαγχνίας αὐτοῦ
  choice: por meio da sua compaixão
  rationale: Representa o valor instrumental de διά com genitivo e traduz εὐσπλαγχνία por um termo atual e digno que comunica profunda misericórdia compassiva.
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: por meio de Abraão, Isaque e Jacó
  rationale: Preserva a repetição conceitual do valor instrumental de διά e não explica além do que o grego afirma.
theological_decisions:
- issue: Sujeito implícito de ἐπισυνάξει
  choice: ele
  alternative: o Senhor
  rationale: O texto grego fornecido não traz um substantivo explícito para o sujeito; a forma verbal indica apenas a terceira pessoa do singular, e αὐτοῦ pressupõe um referente masculino. Evita-se inserir explicitamente “o Senhor” sem apoio direto nesta oração, embora essa identificação possa decorrer do contexto.
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade
  rationale: “Fé” é a correspondência mais direta e mantém aberta a relação entre confiança humana e fidelidade; a nota reconhece a alternativa sem resolver indevidamente a tensão semântica.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa e nomes bíblicos em formas correntes no Brasil. A construção paralela “por meio de... e por meio de...” conserva a estrutura e a possível tensão instrumental do grego.
