source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ οἶδα⁵ ὅτι ἁμαρτήσετε⁶ καὶ παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν, ⌜καὶ¹⁸ ἡ γῆ ὑμῶν⁹ ἐρημωθήσεται¹⁰, καὶ τὰ ἅγια ὑμῶν καταφθαρήσονται¹¹, καὶ ὑμεῖς¹² διασκορπισθήσεσθε¹³ εἰς τὰς τέσσαρας¹⁴ γωνίας *τῆς γῆς¹⁵, καὶ ἔσεσθε *εἰς διασπορὰν¹⁶ ἐξουδενωμένοι ὡς¹⁷ ὕδωρ¹⁸ ἄχρηστον¹⁹.⌝'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/002.yaml
  text: For I know that you will sin and be handed over into the hands of your enemies, and your land will be made desolate, and your holy things destroyed, and you will be scattered to the four corners of the earth, and you will be in the dispersion, despised like useless water.
translation:
  language: pt
  text: Pois eu sei que vocês pecarão e serão entregues nas mãos de seus inimigos. A terra de vocês ficará desolada, suas coisas sagradas serão destruídas, e vocês serão espalhados pelos quatro cantos da terra. Na dispersão, serão desprezados como água sem serventia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἅγια ὑμῶν
  choice: suas coisas sagradas
  rationale: Mantém a amplitude da expressão grega, que pode abranger objetos, lugares ou instituições sagradas, sem restringi-la indevidamente a “santuários”.
- source_word: διασκορπισθήσεσθε
  choice: serão espalhados
  rationale: Expressa de modo natural o sentido passivo de dispersão forçada.
- source_word: εἰς διασπορὰν
  choice: na dispersão
  rationale: Preserva o substantivo e sua possível ressonância histórica e comunitária, em vez de fundi-lo completamente com o verbo anterior.
- source_word: ἐξουδενωμένοι
  choice: desprezados
  rationale: Comunica a ideia de serem tratados como insignificantes ou sem valor.
- source_word: ὕδωρ ἄχρηστον
  choice: água sem serventia
  rationale: Conserva a imagem incomum do original com uma formulação portuguesa clara e natural.
theological_decisions:
- issue: Referente de τὰ ἅγια
  choice: coisas sagradas
  alternative: santuários / lugares santos
  rationale: O grego substantivado é semanticamente amplo; a tradução evita decidir se a referência é especificamente ao templo, a lugares santos ou a objetos consagrados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para favorecer a legibilidade brasileira. A estrutura profética e as imagens fortes do grego foram preservadas sem acrescentar a cláusula sobre a visita do Altíssimo mencionada no histórico de revisão, pois ela não pertence ao texto-fonte fornecido para este versículo.
