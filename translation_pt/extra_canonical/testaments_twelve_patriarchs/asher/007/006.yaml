source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Καὶ διὰ τοῦτο³⁹ διασκορπισθήσεσθε⁴⁰ ὡς Γὰδ καὶ⁴¹ Δάν, οἱ ἀδελφοί μου⁴², *καὶ ἀγνοήσετε χώρας αὐτῶν⁴³ καὶ φυλὴν καὶ γλῶσσαν⁴⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/006.yaml
  text: And because of this you will be scattered, like Gad and Dan, my brothers, and you will not know their land, tribe, and language.
translation:
  language: pt
  text: E por causa disso vocês serão dispersos, como Gade e Dã, meus irmãos, e não conhecerão a terra, a tribo nem a língua deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασκορπισθήσεσθε
  choice: serão dispersos
  rationale: Mantém a voz passiva e o sentido de espalhamento do verbo grego, em linguagem natural e digna.
- source_word: ἀγνοήσετε
  choice: não conhecerão
  rationale: Reproduz diretamente a ideia de desconhecer, sem especificar indevidamente se se trata de reconhecimento, familiaridade ou informação.
- source_word: χώρας
  choice: terra
  rationale: Expressa de modo amplo o território ou país associado a Gade e Dã, preservando a formulação concisa do original.
- source_word: φυλὴν
  choice: tribo
  rationale: É o equivalente corrente e contextual de φυλή.
- source_word: γλῶσσαν
  choice: língua
  rationale: Preserva o sentido linguístico natural de γλῶσσα no contexto.
theological_decisions:
- issue: Referente de αὐτῶν
  choice: deles
  alternative: suas próprias terras, tribos e línguas
  rationale: O pronome grego está na terceira pessoa do plural e, em sua leitura sintática mais direta, remete a Gade e Dã. A tradução mantém essa referência sem reinterpretá-la.
- issue: Agente da dispersão
  choice: voz passiva sem agente expresso
  alternative: Deus dispersará vocês
  rationale: O grego não identifica explicitamente o agente; a tradução preserva essa abertura e evita acrescentar uma determinação teológica.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A forma «vocês» comunica naturalmente a segunda pessoa do plural ao público amplo. As vírgulas isolam «meus irmãos» como vocativo, e «nem» coordena com naturalidade os itens sob a negação.
