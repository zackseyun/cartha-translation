base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/005.yaml
  text: For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men.
translation:
  language: pt
  text: Pois eu sei que, desobedecendo, vocês desobedecerão e, agindo impiamente, agirão impiamente, não dando atenção à lei de Deus, mas aos mandamentos humanos, sendo corrompidos pela maldade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθοῦντες ... ἀπειθήσετε
  choice: desobedecendo, vocês desobedecerão
  rationale: Preserva a repetição enfática e a relação entre particípio e verbo finito do grego.
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: agindo de modo ímpio, procederão com impiedade
  rationale: Mantém a repetição sem produzir uma formulação excessivamente áspera em português; ἀσεβέω indica conduta irreverente ou ímpia.
- source_word: μὴ προσέχοντες
  choice: sem dar atenção
  rationale: Expressa naturalmente a ideia de não prestar atenção nem se orientar pela lei.
- source_word: τῷ νόμῳ θεοῦ
  choice: à lei de Deus
  rationale: Correspondência direta, clara e tradicional ao sintagma grego.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: mandamentos humanos
  rationale: Transmite o contraste entre a lei divina e prescrições de origem humana sem restringir ἄνθρωποι a homens do sexo masculino.
- source_word: κακίᾳ διαφθειρόμενοι
  choice: sendo corrompidos pela maldade
  rationale: Preserva a voz passiva e traduz κακία em seu sentido moral amplo.
theological_decisions:
- issue: Relação sintática entre 'mandamentos humanos' e 'maldade'
  choice: pela maldade por meio dos mandamentos humanos
  alternative: por mandamentos humanos corrompidos pela maldade
  rationale: A forma διαφθειρόμενοι concorda com os destinatários, não com ἐντολαῖς; assim, são eles que estão sendo corrompidos. A tradução mantém κακίᾳ como agente ou causa e ἐντολαῖς como meio, conforme a leitura refletida no texto de consulta, embora a sequência grega seja compacta.
- issue: Força retórica das repetições cognatas
  choice: preservar ambas as repetições
  alternative: simplificar para 'vocês desobedecerão e agirão com impiedade'
  rationale: A duplicação parece deliberadamente enfática e deve permanecer visível, apesar de sua estranheza moderada em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de 'vocês' para o plural. A estrutura repetitiva do grego foi mantida por seu valor retórico, com leve variação lexical na segunda dupla para conservar naturalidade.
