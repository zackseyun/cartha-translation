  verdict: revise
  source_fidelity: 'A última sequência grega é mais bem entendida como «não dando atenção à lei de Deus, mas [aos] mandamentos humanos, sendo corrompidos pela maldade»: o dativo ἐντολαῖς ἀνθρώπων completa por contraste προσέχοντες, enquanto κακίᾳ expressa o meio/causa de διαφθειρόμενοι. A redação proposta, seguindo a trilha inglesa, inverte essas relações ao fazer dos mandamentos humanos o meio da corrupção.'
  naturalness: A revisão conserva a cadência enfática e é natural em português moderno. A repetição em «agindo impiamente, agirão impiamente» é deliberadamente marcada, pois reproduz a repetição cognata do grego.
  terminology: «Lei de Deus», «mandamentos humanos», «maldade» e «impiamente» representam adequadamente os termos gregos sem introduzir interpretação confessional.
  issues:
  - severity: high
    issue: Relação sintática entre «mandamentos humanos» e «maldade»
    rationale: Em «mas sendo corrompidos pela maldade por meio dos mandamentos humanos», os mandamentos se tornam o instrumento da corrupção. No grego, ἐντολαῖς ἀνθρώπων é o complemento contrastivo elíptico de μὴ προσέχοντες («não dando atenção ... mas [a]...»), e κακίᾳ acompanha διαφθειρόμενοι.
  - severity: medium
    issue: Repetição cognata de ἀσεβοῦντες ἀσεβήσετε
    rationale: «Agindo de modo ímpio, procederão com impiedade» reduz a repetição lexical deliberada. «Agindo impiamente, agirão impiamente» a conserva de modo compreensível.
  revised_text: Pois eu sei que, desobedecendo, vocês desobedecerão e, agindo impiamente, agirão impiamente, não dando atenção à lei de Deus, mas aos mandamentos humanos, sendo corrompidos pela maldade.
