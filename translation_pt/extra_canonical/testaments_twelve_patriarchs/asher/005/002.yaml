id: T12P.ASH.5.2
reference: Testament of Asher 5:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Τὴν⁷ ζωὴν ὁ θάνατος διαδέχεται, τὴν δόξαν ἡ ἀτιμία, τὴν ἡμέραν ἡ νύξ⁸, τὸ φῶς τὸ σκότος· τὰ δὲ πάντα⁹ ὑπὸ ἡμέραν εἰσίν¹⁰, ὑπὸ ζωὴν¹¹ τὰ δίκαια, ⌜ὑπὸ θανάτου τὰ ἄδικα⌝¹². διὸ καὶ¹³ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/002.yaml
  text: 'Death follows life, dishonor follows glory, night follows day, darkness follows light. But all things are under day: the righteous under life, and the unrighteous under death. Therefore eternal life also awaits death.'
translation:
  language: pt
  text: 'À vida sucede a morte; à glória, a desonra; ao dia, a noite; à luz, as trevas. Mas todas as coisas estão sob o dia: o que é justo, sob a vida; o que é injusto, sob a morte. Por isso, também a vida eterna aguarda a morte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαδέχεται
  choice: sucede a
  rationale: Expressa a ideia de vir depois ou tomar o lugar de algo, preservando a sequência enfática dos pares no grego.
- source_word: ἀτιμία
  choice: desonra
  rationale: Equivalente corrente e digno para a perda ou ausência de honra, em contraste direto com “glória”.
- source_word: τὰ δίκαια / τὰ ἄδικα
  choice: o que é justo / o que é injusto
  rationale: Os adjetivos neutros plurais substantivados podem abranger coisas, ações ou realidades justas e injustas. Esta formulação natural em português evita restringi-los indevidamente a pessoas.
- source_word: ἀναμένει
  choice: aguarda
  rationale: Mantém o sentido de esperar por alguém ou algo e preserva a personificação surpreendente da vida eterna.
theological_decisions:
- issue: Relação simbólica entre dia, vida, justiça, morte e vida eterna
  choice: Preservar literalmente “sob o dia”, “sob a vida” e “sob a morte”
  alternative: Explicitar a metáfora como domínio, destino ou categoria moral
  rationale: O texto grego deixa a relação conceitual condensada e não explica precisamente esses vínculos; a tradução conserva essa tensão em vez de impor uma interpretação.
- issue: Sentido de “a vida eterna aguarda a morte”
  choice: Manter a afirmação paradoxal sem explicação no corpo do texto
  alternative: Parafrasear como vitória da vida eterna sobre a morte ou como vida eterna depois da morte
  rationale: A formulação grega personifica a vida eterna e diz que ela aguarda a morte. Explicitar vitória, sucessão temporal ou destino humano resolveria uma ambiguidade que o original mantém.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo marcado por ponto e vírgula. A elipse verbal nos três últimos pares reproduz a concisão retórica do grego sem soar artificial. “Sob o dia” é incomum em português, mas foi mantido por ser uma imagem deliberada do texto-fonte.
