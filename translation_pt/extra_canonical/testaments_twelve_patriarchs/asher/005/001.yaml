source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: V. Ὁρᾶτε¹, τέκνα², πῶς δύο³ εἰσὶν ⌜ἐν πᾶσιν⌝, ἓν⁴ κατέναντι τοῦ ἑνός, *καὶ ἓν ὑπὸ τοῦ ἑνὸς⁵ κέκρυπται· ⌜ἐν τῇ κτίσει ἡ πλεονεξία, ἐν τῇ εὐφροσύνῃ ἡ μέθη, ἐν τῷ γέλωτι τὸ πένθος, ἐν τῷ γάμῳ ἡ ἀσωτία⌝⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/001.yaml
  text: 'See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in creation, greed; in merriment, drunkenness; in laughter, grief; in marriage, debauchery.'
translation:
  language: pt
  text: 'Vejam, filhos, como em tudo há duas coisas, uma oposta à outra, e uma está escondida sob a outra: na criação[a], a ganância; na alegria, a embriaguez; no riso, a tristeza; no casamento, a devassidão[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «criação»; a associação com a ganância é abrupta e seu sentido exato não é explicado.
    reason: Sinaliza ao leitor a dificuldade real da expressão sem corrigir silenciosamente o texto.
  - marker: b
    text: 'Ou: «vida desregrada»; o termo grego pode abranger libertinagem, dissipação e comportamento dissoluto.'
    reason: Preserva a amplitude semântica de ἀσωτία.
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Vejam
  rationale: Imperativo corrente e direto, que conserva o apelo para observar ou perceber.
- source_word: τέκνα
  choice: filhos
  rationale: Reproduz o vocativo sem acrescentar o possessivo «meus», ausente do grego.
- source_word: δύο ... ἓν κατέναντι τοῦ ἑνός
  choice: duas coisas ... uma oposta à outra
  rationale: Torna natural em português a construção substantivada e deliberadamente ampla do grego, sem definir quais são essas duas realidades.
- source_word: κτίσει
  choice: criação
  rationale: Mantém o sentido primário de κτίσις e a associação surpreendente presente no texto recebido, em vez de substituí-la por uma interpretação contextual.
- source_word: εὐφροσύνῃ
  choice: alegria
  rationale: Termo simples e atual para contentamento ou celebração festiva; o contexto contrasta essa alegria com a embriaguez nela escondida.
- source_word: μέθη
  choice: embriaguez
  rationale: Equivalente preciso para o estado de estar bêbado, mais natural aqui do que «bebedeira».
- source_word: πένθος
  choice: tristeza
  rationale: No contraste com o riso, exprime de modo natural o pesar ou luto que pode estar oculto.
- source_word: ἀσωτία
  choice: devassidão
  rationale: Conserva a ideia de conduta dissoluta, embora o vocábulo também possa sugerir libertinagem ou vida desregrada.
theological_decisions:
- issue: Natureza das «duas» em todas as coisas
  choice: duas coisas
  alternative: dois aspectos / dois caminhos
  rationale: O grego não fornece um substantivo que identifique as duas realidades. A tradução mantém a generalidade e evita impor uma estrutura moral ou metafísica específica.
- issue: Relação entre os pares
  choice: uma se esconde sob a outra
  alternative: uma está oculta pela outra
  rationale: Preserva a imagem espacial e a tensão do perfeito passivo κέκρυπται sem explicar de que modo um elemento encobre o outro.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativo direto e paralelismo conciso. A formulação mantém as associações abruptas e a ambiguidade do original, recorrendo a notas apenas onde a estranheza lexical pode ser tomada por erro de tradução.
