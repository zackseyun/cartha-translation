  text: Ταῦτα οὖν²⁰ πάντα ⌜ἐγὼ⌝²¹ ἐδοκίμασα ἐν τῇ ζωῇ μου, καὶ οὐκ ἐπλανήθην ἀπὸ τῆς ἀληθείας Κυρίου, καὶ²² τὰς ἐντολὰς τοῦ ὑψίστου²³ ἐξεζήτησα²⁴ κατὰ πᾶσαν ἰσχύν μου πορευόμενος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/004.yaml
  text: So then I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought the commandments of the Most High with all my strength as I walked.
translation:
  language: pt
  text: Portanto, pus à prova todas essas coisas em minha vida, não me desviei da verdade do Senhor e busquei os mandamentos do Altíssimo com todas as minhas forças enquanto caminhava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοκίμασα
  choice: pus à prova
  rationale: Expressa o sentido de testar e verificar por experiência, sem reduzir o verbo a mera reflexão intelectual.
- source_word: ἐπλανήθην ἀπό
  choice: me desviei de
  rationale: Reproduz naturalmente a ideia de afastar-se ou perder o rumo em relação à verdade.
- source_word: ἐξεζήτησα
  choice: busquei
  rationale: Traduz a busca diligente indicada pelo verbo; o contexto e a expressão “com todas as minhas forças” já comunicam sua intensidade.
- source_word: πορευόμενος
  choice: enquanto caminhava
  rationale: Mantém a imagem concreta e a função circunstancial do particípio, sem transformá-lo de modo interpretativo em “vivi” ou “procedi”.
theological_decisions:
- issue: Relação do autor com “a verdade do Senhor”
  choice: não me desviei da verdade do Senhor
  alternative: não errei quanto à verdade do Senhor
  rationale: A formulação escolhida preserva a metáfora de afastamento presente em πλανάω e evita definir de maneira mais estreita a natureza desse possível erro.
- issue: Título divino ὁ ὕψιστος
  choice: o Altíssimo
  alternative: o Deus Altíssimo
  rationale: Mantém o título substantivado do grego sem acrescentar “Deus”, embora essa identificação esteja implícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação do grego foi preservada sem introduzir contraste inexistente; omitiu-se apenas a repetição inicial de “e” onde a sintaxe portuguesa não a exige. A frase final conserva a possível tensão entre o esforço na busca e a imagem do caminhar.
