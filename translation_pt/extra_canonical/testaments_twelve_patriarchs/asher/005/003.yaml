source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Καὶ οὐκ¹⁵ ἔστιν εἰπεῖν τὴν ἀλήθειαν ψεῦδος, οὐδὲ *τὸ δίκαιον ἄδικον¹⁶, ὅτι πᾶσα ἀλήθεια ὑπὸ *τοῦ φωτός¹⁷ ἐστιν, ⌜καθὼς τὰ πάντα¹⁸ ὑπὸ *τοῦ Θεοῦ¹⁹⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/003.yaml
  text: And one cannot call truth falsehood, nor what is righteous unrighteous, because all truth is under the light, just as all things are under God.
translation:
  language: pt
  text: E não se pode chamar a verdade de mentira, nem o que é justo de injusto, porque toda verdade está sob a luz, assim como todas as coisas estão sob Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπεῖν
  choice: chamar ... de
  rationale: Neste contexto, expressa de modo natural em português o ato de atribuir à verdade a designação de mentira.
- source_word: τὴν ἀλήθειαν ψεῦδος
  choice: a verdade de mentira
  rationale: Preserva o contraste direto entre verdade e mentira sem acrescentar uma oração explicativa.
- source_word: τὸ δίκαιον ἄδικον
  choice: o que é justo de injusto
  rationale: Mantém a substantivação e o paralelismo moral do grego em linguagem corrente.
- source_word: ὑπὸ τοῦ φωτός
  choice: sob a luz
  rationale: Reproduz a metáfora espacial do original sem interpretá-la além do que o texto declara.
- source_word: ὑπὸ τοῦ Θεοῦ
  choice: sob Deus
  rationale: Conserva o paralelo sintático e teológico entre a luz e Deus.
theological_decisions:
- issue: Relação entre a verdade, a luz e Deus
  choice: 'Preservar as duas afirmações paralelas: toda verdade está sob a luz e todas as coisas estão sob Deus.'
  alternative: Identificar explicitamente a luz com Deus ou traduzir 'sob' como 'proveniente de'.
  rationale: O grego estabelece uma analogia, mas não explicita identidade nem origem; a tradução mantém essa tensão sem impor interpretação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. O paralelismo e a concisão do grego foram preservados.
