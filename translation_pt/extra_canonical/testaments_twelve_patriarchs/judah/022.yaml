base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022.yaml
  text: The Lord will bring divisions among them against one another[a], and there will be continual wars in Israel. And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes[c][b],
translation:
  language: pt
  text: '**Testamento de Judá 22**


    **1** O Senhor provocará divisões entre eles, fazendo com que se voltem uns contra os outros; e haverá guerras contínuas em Israel.[a] **2** Meu reino chegará ao fim entre estrangeiros,[b] até que venha a salvação de Israel,[c] até a vinda do Deus da justiça, para fazer Jacó e todas as nações repousarem em paz. **3** Ele preservará para sempre o poder do meu reino, pois o Senhor me jurou solenemente que jamais eliminaria o reino da minha descendência.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego desta oração é irregular. Também pode ser entendido como: “e as divisões serão contínuas em Israel”.'
    reason: textual_or_syntactic_ambiguity
  - marker: b
    text: 'Ou: “meu reino será completado entre estrangeiros”. O verbo grego pode indicar tanto conclusão quanto término.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “o livramento de Israel”. A expressão também pode ter ressonância messiânica, sem designar explicitamente uma pessoa.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπάξει ... διαιρέσεις κατ᾽ ἀλλήλων
  choice: provocará divisões entre eles, fazendo com que se voltem uns contra os outros
  rationale: Expressa a ação causativa de ἐπάξει, o caráter interno das διαιρέσεις e a hostilidade recíproca de κατ᾽ ἀλλήλων em português natural.
- source_word: συνεχεῖς ... ἐν Ἰσραήλ
  choice: haverá guerras contínuas em Israel
  rationale: Segue o sentido contextual preservado pela tradição textual consultada, embora a redação grega fornecida seja irregular; a incerteza é explicitada em nota.
- source_word: ἀλλοφύλοις
  choice: estrangeiros
  rationale: Mantém o sentido amplo de povos alheios a Israel, sem restringir indevidamente o termo aos filisteus.
- source_word: συντελεσθήσεται ἡ βασιλεία μου
  choice: meu reino chegará ao fim
  rationale: No contexto de divisões e conflitos, o verbo provavelmente indica término. A alternativa semântica de conclusão ou consumação é preservada em nota.
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  choice: a salvação de Israel
  rationale: O neutro σωτήριον designa mais naturalmente salvação ou livramento, sem excluir uma possível ressonância messiânica.
- source_word: τῆς παρουσίας Θεοῦ τῆς δικαιοσύνης
  choice: a vinda do Deus da justiça
  rationale: παρουσία é vertido como 'vinda' no contexto profético, e o genitivo é mantido como uma caracterização de Deus, sem reformulação doutrinária.
- source_word: φυλάξει κράτος τῆς βασιλείας μου
  choice: preservará para sempre o poder do meu reino
  rationale: φυλάσσω indica guardar ou preservar, enquanto κράτος comunica poder, força ou domínio.
- source_word: ἐκ τοῦ σπέρματός μου
  choice: da minha descendência
  rationale: No contexto dinástico, σπέρμα refere-se naturalmente à linhagem ou descendência de Judá.
theological_decisions:
- issue: Referência de τὸ σωτήριον τοῦ Ἰσραήλ
  choice: a salvação de Israel
  alternative: o livramento de Israel; o Salvador de Israel
  rationale: A forma neutra favorece um sentido abstrato ou eventivo. A tradução não transforma implicitamente a expressão em título pessoal, mas a nota reconhece sua possível ressonância messiânica.
- issue: Sentido de συντελεσθήσεται aplicado ao reino de Judá
  choice: chegará ao fim
  alternative: será completado; será consumado
  rationale: O contexto negativo de divisões e guerras favorece a ideia de término, sem apagar a amplitude lexical do verbo.
- issue: Identidade do sujeito de φυλάξει no versículo 3
  choice: Ele preservará
  alternative: Deus preservará; a salvação preservará
  rationale: O pronome grego αὐτός é mantido como pronome, permitindo que o leitor acompanhe o antecedente no discurso sem inserir um nome não expresso nessa oração.
- issue: Relação entre Deus e justiça em Θεοῦ τῆς δικαιοσύνης
  choice: Deus da justiça
  alternative: Deus de justiça; justiça de Deus
  rationale: A construção é preservada como um título caracterizador, sem converter o genitivo em uma afirmação teológica mais definida do que a redação grega permite.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A sintaxe foi suavizada onde a reprodução literal seria artificial, mas as ambiguidades lexicais, textuais e teológicas relevantes foram preservadas no texto ou nas notas.
