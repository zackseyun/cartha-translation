  to: 1 Eu sabia que a linhagem dos cananeus era má[a], mas o ímpeto da juventude cegou meu entendimento. 2 Ao vê-la servir vinho, fui enganado e a tomei[b][d], sem que meu pai tivesse dado seu conselho[c]. 3 Enquanto eu estava ausente, porém, ela foi e tomou para Selá uma esposa de Canaã. 4 Quando soube o que ela havia feito, amaldiçoei-a na angústia da minha alma. 5 E, de fato, ela morreu em sua maldade, junto com seus filhos.
  rationale: Substituiu-se «uma mulher» por «uma esposa» para refletir a força contextual de γυναῖκα em «tomou para Selá uma esposa». A nota textual foi deslocada para «a tomei», que é o local imediatamente anterior ao material corrompido omitido da sequência traduzida. Não se alterou o sentido das demais unidades nem se resolveu além do necessário a ambiguidade de «a tomei» e do conselho paterno.
