  source_fidelity: A tradução acompanha bem as unidades legíveis do grego e preserva a omissão editorial do trecho textualmente corrompido, tal como o audit trail inglês. Contudo, γυνή em «ἔλαβε τῷ Σηλὼμ γυναῖκα» é especificamente uma esposa nesse contexto, não apenas «uma mulher». Além disso, a nota textual sobre a corrupção deve estar ancorada no ponto em que a lacuna ocorre, ao fim de v. 2, e não em «de Canaã» no v. 3.
  naturalness: O português é claro, moderno e adequadamente solene. «Enquanto eu estava ausente, porém» e «na angústia da minha alma» são naturais. «Uma esposa de Canaã» torna a frase mais precisa sem prejudicar a fluência.
  terminology: «Linhagem», «ímpeto», «entendimento», «servir vinho», «amaldiçoei-a» e «maldade» representam bem o grego e o registro da obra. «A tomei» conserva corretamente a concisão ambígua de ἔλαβον αὐτήν; a nota explica sua provável força matrimonial.
