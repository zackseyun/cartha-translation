  - severity: medium
    issue: A nota textual [d] está ancorada em «Canaã», embora descreva material corrompido situado antes de «Enquanto eu estava ausente».
    rationale: A âncora atual sugere indevidamente que a dificuldade textual pertence à expressão «de Canaã». Ela deve seguir «a tomei», no limite imediatamente anterior à lacuna/omissão editorial.
