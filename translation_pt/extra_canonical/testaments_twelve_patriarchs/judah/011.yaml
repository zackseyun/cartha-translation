  text: 1 And I knew that the race of the Canaanites was evil[a], but the impulse of youth blinded my understanding. 2 And when I saw her pouring wine, I was deceived, and I took her, though my father had not given counsel. 3 But while I was away, she went and took for Shelah a wife from Canaan. 4 And when I learned what she had done, I cursed her in the anguish of my soul. 5 And indeed she died in her wickedness[c][b], with her children.
translation:
  language: pt
  text: 1 Eu sabia que a linhagem dos cananeus era má[a], mas o ímpeto da juventude cegou meu entendimento. 2 Ao vê-la servir vinho, fui enganado e a tomei[b][d], sem que meu pai tivesse dado seu conselho[c]. 3 Enquanto eu estava ausente, porém, ela foi e tomou para Selá uma esposa de Canaã. 4 Quando soube o que ela havia feito, amaldiçoei-a na angústia da minha alma. 5 E, de fato, ela morreu em sua maldade, junto com seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o povo dos cananeus era perverso”. O grego γένος pode designar linhagem, descendência ou grupo étnico.'
    reason: lexical_alternative
  - marker: b
    text: “Eu a tomei” provavelmente significa “eu a tomei por mulher”, mas a expressão grega é mais abrupta.
    reason: lexical_alternative
  - marker: c
    text: A frase também pode ser entendida no sentido de que Judá agiu sem o conselho ou a aprovação de seu pai, Jacó.
    reason: alternative_reading
  - marker: d
    text: O texto grego transmitido entre “a tomei” e “enquanto eu estava ausente” contém fragmentos gravemente corrompidos, entre eles referências a “meu filho Er”; não é possível traduzi-los com segurança como uma sequência coerente.
    reason: textual_issue
lexical_decisions:
- source_word: πονηρὸν γένος τῶν Χαναναίων
  choice: a linhagem dos cananeus era má
  rationale: γένος pode indicar linhagem, descendência ou povo. “Linhagem” preserva a dimensão ancestral do termo sem sugerir as categorias biológicas modernas associadas a “raça”; “má” mantém o juízo moral de πονηρόν.
- source_word: τὸ διαβούλιον τῆς νεότητος
  choice: o ímpeto da juventude
  rationale: Embora διαβούλιον possa significar conselho ou plano, o contexto descreve o impulso juvenil que venceu o discernimento de Judá. “Ímpeto” comunica essa força sem ampliar excessivamente o texto.
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  choice: cegou meu entendimento
  rationale: Preserva a metáfora de cegueira e traduz διάνοια como a faculdade de compreender e julgar.
- source_word: οἰνοχοοῦσαν
  choice: servir vinho
  rationale: O particípio descreve o ato de verter ou servir vinho. “Servir vinho” é corrente em português e não impõe o cargo formal de copeira.
- source_word: ἠπατήθην
  choice: fui enganado
  rationale: Mantém a voz passiva e a confissão de Judá de ter sido induzido ao erro, sem eliminar sua responsabilidade no relato.
- source_word: ἔλαβον αὐτήν
  choice: a tomei
  rationale: A expressão pode ter sentido matrimonial, mas o grego é abrupto. A tradução conserva essa concisão, e a nota registra a provável nuance conjugal.
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: sem que meu pai tivesse dado seu conselho
  rationale: Mantém o pai como sujeito do particípio e expressa a ausência de orientação paterna, sem reduzir necessariamente a frase à falta de consentimento jurídico.
- source_word: ἀπόντος ἐμοῦ
  choice: enquanto eu estava ausente
  rationale: Tradução natural da construção absoluta, preservando a relação temporal.
- source_word: ἔλαβε τῷ Σηλὼμ γυναῖκα
  choice: tomou para Selá uma mulher
  rationale: Conserva de perto o idioma grego de obter ou providenciar uma mulher para alguém, sem explicitar além do texto o modo do arranjo matrimonial.
- source_word: ἐκ τῆς Χαναάν
  choice: de Canaã
  rationale: Preserva a sobreposição geográfica e étnica possível na expressão grega.
- source_word: κατηρασάμην αὐτὴν
  choice: amaldiçoei-a
  rationale: Reproduz de modo direto a força do verbo grego.
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: na angústia da minha alma
  rationale: Mantém tanto a intensidade de ὀδύνη quanto o registro solene de ψυχή.
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  choice: em sua maldade
  rationale: Conserva a formulação moral do grego e sua possível ideia de morrer ainda envolvida em sua conduta má.
theological_decisions:
- issue: Juízo étnico-moral sobre os cananeus
  choice: Traduzir diretamente a afirmação coletiva antiga como “a linhagem dos cananeus era má”.
  alternative: “o povo cananeu era perverso” ou “a raça dos cananeus era má”.
  rationale: O texto formula um juízo abrangente sobre um grupo ancestral. “Linhagem” mantém essa dimensão histórica e retórica sem importar teorias raciais modernas nem suavizar o juízo moral da fonte.
- issue: Força matrimonial de ἔλαβον αὐτήν
  choice: Manter no texto “a tomei”, com nota sobre o provável sentido matrimonial.
  alternative: “casei-me com ela” ou “tomei-a por mulher”.
  rationale: O contexto favorece a referência ao casamento, mas a expressão grega permanece tersa. A tradução conserva essa tensão em vez de explicitá-la silenciosamente.
- issue: Autoridade ou conselho paterno
  choice: Traduzir como ausência do conselho do pai.
  alternative: “sem o consentimento de meu pai”.
  rationale: O particípio pode envolver conselho, deliberação ou aprovação. “Conselho” mantém a formulação menos juridicamente definida e evita resolver a ambiguidade como simples falta de permissão.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. Empregam-se “linhagem”, “entendimento”, “angústia da minha alma” e “amaldiçoei-a” para manter o tom testamentário sem arcaísmo excessivo. A numeração segue as cinco unidades coerentes do texto de consulta; a nota [d] torna explícita a lacuna causada pela corrupção do grego transmitido.
