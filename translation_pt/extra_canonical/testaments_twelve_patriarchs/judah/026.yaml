  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026.yaml
  text: 'Therefore keep[a], my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness. And bury me near my fathers.


    And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.


    And if you walk in holiness according to all the commandments of the Lord, you will again dwell securely with me[b], and all Israel will be gathered to the Lord forever.'
translation:
  language: pt
  text: '**Testamento de Judá 26**


    ¹ Portanto, meus filhos, guardem toda a Lei do Senhor, pois ela é esperança para os que dirigem retamente os seus caminhos.[a] ² E ele lhes disse: “Eis que hoje morro, com cento e dezoito anos. ³ Que ninguém me sepulte com vestes luxuosas; levem-me, porém, para Hebrom, onde também estão os meus pais.” ⁴ Depois de dizer isso, adormeceu.[b] Seus filhos fizeram tudo o que ele lhes havia ordenado e o sepultaram em Hebrom, com seus antepassados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente algo como “os que dirigem ou endireitam os seus caminhos”. A referência de “seus” pode ser entendida como os caminhos do Senhor; a formulação preserva a construção incomum do texto.
    reason: lexical_alternative
  - marker: b
    text: “Adormeceu” é um antigo eufemismo para “morreu”, preservado aqui por fazer parte do registro testamentário.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φυλάξατε
  choice: guardem
  rationale: O imperativo pede observância cuidadosa e combina naturalmente com “Lei” no registro bíblico, sem reduzir a ideia a mera conservação.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Preserva a forma de tratamento familiar e pode abranger tanto os filhos imediatos quanto os descendentes.
- source_word: πάντα τὸν νόμον Κυρίου
  choice: toda a Lei do Senhor
  rationale: Expressa a totalidade da Lei, mantendo a linguagem pactual e testamentária.
- source_word: ἐλπίς
  choice: esperança
  rationale: Mantém o valor teológico e exortativo do substantivo grego.
- source_word: τοῖς κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: para os que tornam retos os caminhos dele
  rationale: Reproduz a construção ativa e incomum do grego, sem substituí-la pela leitura interpretativa “seguem os seus caminhos em justiça” presente na camada inglesa.
- source_word: ἑκατὸν δέκα καὶ ὀκτώ ἐτῶν
  choice: com cento e dezoito anos
  rationale: Traduz diretamente a idade indicada pelo texto grego.
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: com vestes luxuosas
  rationale: Expressa roupa dispendiosa ou suntuosa em português natural.
- source_word: ἀναγάγετε με
  choice: levem-me ... para Hebrom
  rationale: O verbo indica conduzir ou levar para cima; em português, “levem-me para Hebrom” conserva o movimento sem impor uma topografia pouco natural.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Preserva o eufemismo antigo e bíblico para a morte.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: com seus pais
  rationale: Mantém a fórmula patriarcal de sepultamento junto aos antepassados; “pais” preserva a imagem do original.
theological_decisions:
- issue: Relação entre a Lei do Senhor e a esperança
  choice: A Lei é apresentada como esperança para os que tornam retos os caminhos do Senhor.
  alternative: Generalizar a frase como promessa de esperança para quem vive corretamente.
  rationale: O antecedente gramatical mais natural de “ela” é a Lei, e a formulação mantém a ligação explícita entre a Lei do Senhor, a esperança e a conduta, sem transformá-la em moralidade genérica.
- issue: Formulação incomum sobre os caminhos do Senhor
  choice: Manter “tornam retos os caminhos dele”.
  alternative: “Seguem os seus caminhos em justiça” ou “andam retamente nos seus caminhos”.
  rationale: O grego usa um verbo ativo transitivo, “tornar reto/dirigir”, tendo “os caminhos dele” como objeto. A tradução conserva essa tensão sem resolver silenciosamente a expressão.
- issue: Fórmula de morte
  choice: Preservar “adormeceu”.
  alternative: “Morreu”.
  rationale: O eufemismo pertence ao registro testamentário e à textura religiosa do relato, embora no versículo 2 o verbo explícito “morro” seja traduzido diretamente.
- issue: Conteúdo ausente da fonte grega fornecida
  choice: Não incluir as linhas inglesas sobre “boa velhice”, caminhada em santidade, habitação segura e reunião eterna de Israel.
  alternative: Incorporar essas frases da camada inglesa.
  rationale: Essas linhas não constam no texto grego primário fornecido para esta unidade; a tradução deve seguir primeiro a evidência da fonte original.
translation_notes:
  register: Português moderno, digno e acessível, com cadência bíblica moderada. A numeração dos quatro versículos segue a fonte grega. Evitou-se importar material presente na consulta inglesa, mas ausente da coluna grega primária.
