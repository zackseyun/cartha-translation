base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/004.yaml
  text: For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, he showed me an immense amount of gold in the name of his daughter, for he was a king.
translation:
  language: pt
  text: 'Pois eu dizia ao meu sogro: “Consultarei meu pai e então receberei sua filha.” Mas ele não quis; em vez disso, mostrou-me uma quantidade incalculável de ouro para a entrega dela[a], pois ele era rei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que ela fosse dada”. A expressão grega pode referir-se a uma quantia ligada à entrega da filha em casamento, possivelmente um dote, mas não especifica com precisão sua função.'
    reason: Preserva a ambiguidade de εἰς δόσιν αὐτῆς e informa a leitura matrimonial contextual sem impor uma classificação econômica única.
lexical_decisions:
- source_word: συμβουλεύσομαι τῷ πατρί μου
  choice: Consultarei meu pai
  rationale: Expressa de modo natural a ideia de buscar o conselho do pai, sem acrescentar que seria necessário obter sua permissão.
- source_word: λήψομαι τὴν θυγατέρα σου
  choice: receberei a sua filha
  rationale: Preserva o verbo amplo “receber/tomar” no contexto matrimonial, sem explicitar além do texto grego “por esposa”.
- source_word: χρυσίου πλῆθος ἄπειρον
  choice: uma quantidade incalculável de ouro
  rationale: Reproduz a ideia de uma abundância sem medida em português corrente e digno.
- source_word: εἰς δόσιν αὐτῆς
  choice: como dote dela
  rationale: Apresenta no texto a leitura contextual mais provável da quantia associada à entrega da filha, registrando em nota a formulação mais literal e sua ambiguidade.
