revisions:
- from: 'Pois eu dizia ao meu sogro: “Consultarei meu pai e então receberei a sua filha.” Mas ele não quis; em vez disso, mostrou-me uma quantidade incalculável de ouro como dote dela[a], pois era rei.'
  to: 'Pois eu dizia ao meu sogro: “Consultarei meu pai e então receberei sua filha.” Mas ele não quis; em vez disso, mostrou-me uma quantidade incalculável de ouro para a entrega dela[a], pois ele era rei.'
  rationale: A revisão substitui a classificação interpretativa «como dote dela» por uma formulação próxima do grego, mantendo em nota a possibilidade contextual de dote. Também explicita «ele» na oração final para evitar ambiguidade referencial em português.
