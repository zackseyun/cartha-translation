lexical_decisions:
- source_word: ἐγκαυχησάμενος
  choice: me vangloriei
  rationale: Expressa de modo natural o particípio aoristo médio, preservando a ideia de orgulho pessoal.
- source_word: ἐν πολέμοις
  choice: nas guerras
  rationale: Mantém a referência plural e concreta do grego, sem transformá-la genericamente em experiência militar.
- source_word: πρόσωπον γυναικὸς εὐμόρφου
  choice: o rosto de uma bela mulher
  rationale: Reproduz a imagem concreta do original; “bela” comunica εὐμόρφου em português corrente e digno.
- source_word: ἠπάτησέ με
  choice: não me havia enganado
  rationale: Segue a leitura contextual refletida na camada inglesa auditada, mas sinaliza em nota que a negação não aparece no texto grego fornecido.
