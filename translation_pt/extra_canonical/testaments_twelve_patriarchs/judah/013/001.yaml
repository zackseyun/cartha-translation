source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, ἀκούσατε *Ἰούδα¹ τοῦ πατρὸς ὑμῶν⁷² καὶ φυλάξασθε⁹ τοὺς λόγους μου¹⁰ τοῦ ποιεῖν⁷ πάντα¹¹ τὰ δικαιώματα Κυρίου¹³ καὶ ὑπακούειν¹⁴ ἐντολαῖς⁵ Θεοῦ¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/001.yaml
  text: 'And now I command you, my children: listen to Judah, your father, and keep my words in your hearts, to do all the righteous commands of the Lord and to obey the commands of God.'
translation:
  language: pt
  text: 'E agora eu lhes ordeno, meus filhos: escutem Judá, seu pai, e guardem as minhas palavras, para cumprirem todos os preceitos justos do Senhor e obedecerem aos mandamentos de Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: ordeno
  rationale: Expressa diretamente a ideia de dar uma ordem ou instrução autorizada.
- source_word: ἀκούσατε
  choice: escutem
  rationale: Mantém o imperativo e, com o objeto pessoal, comunica prestar atenção e dar ouvidos.
- source_word: φυλάξασθε τοὺς λόγους μου
  choice: guardem as minhas palavras
  rationale: Preserva a imagem de conservar e observar as palavras, sem acrescentar a expressão «no coração», ausente do texto grego fornecido.
- source_word: τὰ δικαιώματα Κυρίου
  choice: os preceitos justos do Senhor
  rationale: δικαιώματα pode indicar estatutos, determinações ou exigências justas; «preceitos justos» conserva tanto o caráter normativo quanto a relação lexical com a justiça.
- source_word: ὑπακούειν ἐντολαῖς Θεοῦ
  choice: obedecerem aos mandamentos de Deus
  rationale: Tradução natural e precisa da construção que expressa obediência aos mandamentos divinos.
theological_decisions:
- issue: Judá fala de si mesmo na terceira pessoa
  choice: «escutem Judá, seu pai»
  alternative: «escutem-me, seu pai»
  rationale: A forma incomum do original foi preservada, em vez de ser normalizada silenciosamente para a primeira pessoa.
- issue: Relação entre δικαιώματα e justiça
  choice: «preceitos justos»
  alternative: «estatutos»
  rationale: A escolha preserva a dimensão normativa e a conotação de justiça sem identificar o termo com uma categoria confessional específica.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução segue de perto o grego fornecido e não incorpora «em seus corações», expressão presente na camada inglesa, mas ausente nesta forma do texto-fonte.
