  text: And he adorned her with gold and pearls, and made her pour wine for us at the banquet.
translation:
  language: pt
  text: E ele a adornou com ouro e pérolas e a fez servir-nos vinho no banquete, com beleza feminina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: adornou
  rationale: Expressa diretamente o ato de ornamentar ou enfeitar, em registro digno e natural.
- source_word: χρυσίῳ καὶ μαργαρίταις
  choice: com ouro e pérolas
  rationale: Mantém os materiais ornamentais e a coordenação simples do grego.
- source_word: οἰνοχοεῖν ἡμῖν
  choice: servir-nos vinho
  rationale: O verbo designa derramar ou servir vinho; esta formulação comunica naturalmente a função exercida para o grupo sem restringi-la ao mero ato físico de verter.
- source_word: ἐν τῷ δείπνῳ
  choice: no banquete
  rationale: No contexto, δείπνον indica a refeição festiva ou banquete, não apenas um jantar comum.
- source_word: ἐν κάλλει γυναικῶν
  choice: com beleza feminina
  rationale: Reproduz de modo idiomático a expressão literalmente próxima de 'em/com beleza de mulheres', preservando a referência à beleza própria das mulheres sem introduzir elementos ausentes do texto.
