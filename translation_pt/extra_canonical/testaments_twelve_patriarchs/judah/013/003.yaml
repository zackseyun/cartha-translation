  terminology: «Rúben», «Bila», «Tamar», «mulher de meu pai», «ciúme», «imoralidade sexual» e «minha nora» são escolhas adequadas. «A cananeia» mantém corretamente a designação feminina substantivada e a ambiguidade textual.
