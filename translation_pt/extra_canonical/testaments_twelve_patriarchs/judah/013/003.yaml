source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ ὠνείδιζον²³ Ῥουβὶμ τὸν ἀδελφόν μου²⁴ περὶ Βάλλας γυναικὸς τοῦ πατρός μου²⁵, καὶ τὸ πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας²⁶ παρετάξατο²⁷ ἐπ᾽ ἐμέ²⁸, ἕως οὗ συνετέλεσα εἰς †τὴν Χανανανίτην³² καὶ εἰς Θαμὰρ ³³τὴν νύμφην³⁴ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/003.yaml
  text: and I reproached Reuben my brother concerning Bilhah, my father’s wife, and the spirit of jealousy and sexual immorality arrayed themselves against me, until I completed it with Anan the Canaanite woman and with Tamar my daughter-in-law.
translation:
  language: pt
  text: Eu repreendia meu irmão Rúben por causa de Bila, mulher de meu pai; e o espírito do ciúme e da imoralidade sexual se pôs em batalha contra mim, até que levei isso a termo com a cananeia[a] e com Tamar, minha nora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta expressão é incerto e traz apenas «a cananeia»; algumas reconstruções ou traduções identificam aqui uma mulher pelo nome.
    reason: O sinal crítico no texto-fonte indica corrupção ou dúvida textual. A nota evita inserir no corpo um nome que não aparece com segurança no grego fornecido.
lexical_decisions:
- source_word: ὠνείδιζον
  choice: Eu repreendia
  rationale: O imperfeito indica uma ação passada apresentada como contínua ou reiterada; «repreendia» preserva tanto o aspecto verbal quanto o sentido de censura.
- source_word: Βάλλας
  choice: Bila
  rationale: Forma portuguesa corrente do nome bíblico Bilhah, com boa legibilidade para o público lusófono.
- source_word: τὸ πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: o espírito do ciúme e da imoralidade sexual
  rationale: Mantém «espírito» no singular e liga a ele os dois genitivos. «Imoralidade sexual» expressa πορνεία em linguagem atual sem restringi-la indevidamente a um único ato.
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: se pôs em batalha contra mim
  rationale: Conserva a imagem militar do verbo, isto é, colocar-se em formação ou tomar posição contra alguém, em português natural.
- source_word: συνετέλεσα εἰς
  choice: levei isso a termo com
  rationale: Procura preservar a ideia de completar ou levar a uma consumação, sem substituir o verbo pelo interpretativo «pequei». O pronome «isso» torna inteligível a construção elíptica, cuja forma grega é difícil.
- source_word: νύμφην μου
  choice: minha nora
  rationale: No contexto familiar, νύμφη designa a mulher ligada por casamento à geração seguinte; «nora» é a expressão portuguesa direta e natural.
theological_decisions:
- issue: Agência do espírito associado ao ciúme e à imoralidade sexual
  choice: Manter um único «espírito» que se põe contra Judá
  alternative: Traduzir no plural, «os espíritos ... se puseram contra mim»
  rationale: O texto grego fornecido tem artigo, substantivo e verbo no singular. A tradução não transforma essa figura em duas entidades distintas.
- issue: Natureza da transgressão expressa por συνετέλεσα
  choice: Traduzir como «levei isso a termo», preservando a formulação indireta
  alternative: Explicitar «pequei» ou «tive relações sexuais»
  rationale: O verbo indica conclusão ou consumação, mas não contém por si só o substantivo «pecado» nem descreve explicitamente o ato. A opção conserva a tensão moral do contexto sem acrescentar uma especificação ausente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação explicita a progressão entre a repreensão dirigida a Rúben e a oposição experimentada por Judá, sem apagar a relação causal ou irônica sugerida pelo contexto. A formulação deliberadamente incomum no final reflete a dificuldade real do grego, esclarecida em nota.
