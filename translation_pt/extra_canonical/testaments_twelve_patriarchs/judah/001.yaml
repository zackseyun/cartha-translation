  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001.yaml
  text: 'The Testament of Judah[a], the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.


    2 So they gathered and came to him, and he said to them:


    3 “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’ 4 I was keen in my youth, and I obeyed my father in every matter. 5 And I honored my mother and my mother''s sister. 6 And when I had grown up, my father blessed me, saying, ‘You shall be a king[b], prospering in all things.’”'
translation:
  language: pt
  text: 'O Testamento de Judá, quarto filho de Jacó e Lia


    1 Cópia das palavras de Judá, que ele falou a seus filhos antes de morrer.


    2 Eles, então, reuniram-se e foram até ele, e ele lhes disse:


    3 “Escutem, meus filhos, Judá, seu pai. Eu nasci como o quarto filho de meu pai Jacó, e Lia, minha mãe, deu-me o nome de Judá, dizendo: ‘Dou graças ao Senhor, porque ele me deu também um quarto filho.’ 4 Eu era ágil na juventude e obedecia a meu pai em tudo o que ele dizia. 5 Honrava minha mãe e a irmã de minha mãe[a]. 6 Quando cresci, meu pai orou por mim, dizendo: ‘Você será rei e prosperará em tudo[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “a irmã de minha mãe”, explicitando o parentesco em vez de usar apenas “minha tia”.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ter o sentido de “sendo bem-sucedido em tudo” ou “tendo seu caminho conduzido ao êxito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαθήκη
  choice: Testamento
  rationale: No título desta obra, designa a despedida e as disposições finais de um patriarca, não uma aliança; “Testamento” também preserva o título tradicional do gênero.
- source_word: Ἀντίγραφον λόγων
  choice: Cópia das palavras
  rationale: Mantém a moldura documental do texto e traduz diretamente tanto o registro escrito quanto o conteúdo falado.
- source_word: Ἀκούσατε
  choice: Escutem
  rationale: Imperativo português atual e solene, claro para leitores comuns, sem o possível sentido meramente auditivo de “ouçam”.
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην
  choice: Eu nasci como o quarto filho
  rationale: Expressa naturalmente a ordem de nascimento indicada pela construção grega, sem o português pouco idiomático “tornei-me o quarto filho”.
- source_word: Ἀνθομολογοῦμαι
  choice: Dou graças
  rationale: No contexto da explicação do nome Judá, transmite o reconhecimento agradecido e laudatório dirigido a Deus.
- source_word: ὀξὺς
  choice: ágil
  rationale: Preserva a ideia ampla de vivacidade, rapidez ou vigor juvenil sem restringi-la à inteligência ou ao entusiasmo.
- source_word: κατὰ πάντα λόγον
  choice: em tudo o que ele dizia
  rationale: Conserva a referência às palavras do pai e comunica idiomaticamente obediência a cada ordem ou instrução.
- source_word: ηὔξατό μοι
  choice: orou por mim
  rationale: Traduz diretamente o verbo εὔχομαι e evita substituí-lo por “abençoou”, embora a oração paterna tenha forma de pronunciamento favorável.
- source_word: κατευοδούμενος
  choice: prosperará
  rationale: Expressa de modo natural o êxito ou bom encaminhamento indicado pelo particípio, que acompanha a promessa de realeza.
theological_decisions:
- issue: Tradução de Κυρίῳ na declaração de Lia
  choice: ao Senhor
  alternative: ao Senhor Deus
  rationale: O grego traz o título divino κύριος, sem acrescentar θεός; “Senhor” identifica reverentemente o Deus de Israel sem explicitação ausente da fonte.
- issue: Natureza da fala paterna em ηὔξατό μοι
  choice: meu pai orou por mim
  alternative: meu pai me abençoou
  rationale: A tradução mantém o verbo grego “orar/desejar” e deixa que o conteúdo seguinte revele sua função de bênção, sem trocar a ação lexical por sua função teológica.
- issue: Amplitude de ὀξύς
  choice: ágil
  alternative: vigoroso
  rationale: O adjetivo pode envolver rapidez, vivacidade ou agudeza. “Ágil” mantém parte dessa abertura sem definir uma virtude espiritual ou intelectual específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas naturais ao leitor brasileiro. Preservou-se a solenidade do discurso de despedida, evitando arcaísmos. A numeração explicita o primeiro parágrafo como versículo 1. Os marcadores de nota foram colocados junto às expressões que efetivamente explicam.
