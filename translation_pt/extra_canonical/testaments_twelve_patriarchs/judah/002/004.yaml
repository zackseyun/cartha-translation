- from: Matei o leão e arranquei um cabrito da sua boca. Peguei a ursa pela pata, lancei-a do precipício, e ela ficou despedaçada.
  to: Matei o leão e arranquei um cabrito da sua boca. Agarrei a ursa pela pata e a lancei penhasco abaixo, e ela ficou despedaçada.
  rationale: Revisa-se somente a formulação da ação contra a ursa para eliminar uma ambiguidade direcional em português. A tradução segue o grego fornecido, não a trilha inglesa divergente.
