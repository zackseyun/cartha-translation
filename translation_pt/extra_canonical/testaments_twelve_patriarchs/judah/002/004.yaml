  text: I caught a wild mare and, after seizing it, I subdued it.
translation:
  language: pt
  text: Matei o leão e arranquei um cabrito da sua boca. Agarrei a ursa pela pata e a lancei penhasco abaixo, e ela ficou despedaçada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκτεινα
  choice: Matei
  rationale: Verte diretamente o aoristo ativo na primeira pessoa do singular.
- source_word: ἀφειλόμην
  choice: arranquei
  rationale: Expressa a retirada enérgica do cabrito da boca do leão, com naturalidade em português.
- source_word: ἔριφον
  choice: um cabrito
  rationale: Equivalente comum e preciso para o filhote de cabra.
- source_word: ἄρκον
  choice: a ursa
  rationale: Preserva o gênero feminino indicado pela forma acusativa grega.
- source_word: ἀπέλυσα τὸν κρημνόν
  choice: lancei-a do precipício
  rationale: A construção transmitida é incomum; a tradução comunica o movimento para fora ou para baixo desde o precipício sem introduzir detalhes adicionais.
- source_word: συνετρίβη
  choice: ficou despedaçada
  rationale: Preserva o resultado violento do passivo aoristo e concorda com a ursa.
