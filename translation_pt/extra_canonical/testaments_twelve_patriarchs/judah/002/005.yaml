lexical_decisions:
- source_word: Τῷ ἀγρίῳ χοίρῳ
  choice: do javali
  rationale: A expressão grega designa literalmente o porco selvagem; «javali» é a forma natural e precisa em português.
- source_word: κατέδραμον
  choice: Corri atrás
  rationale: O verbo transmite a ideia de perseguir correndo, não apenas correr em direção ao animal.
- source_word: προέλαβον
  choice: alcancei-o
  rationale: No contexto da perseguição, indica que o narrador conseguiu alcançar o animal.
- source_word: κατεσπάραξα
  choice: o despedacei
  rationale: Preserva a força do verbo, que descreve dilacerar ou despedaçar violentamente.
