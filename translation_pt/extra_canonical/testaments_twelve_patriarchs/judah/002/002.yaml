  text: Οἶδα³ ὅτι συνέδραμον⁴ ἐλάφῳ⁵ καὶ *ἐπίασα αὐτὴν καὶ ἐποίησα αὐτὴν βρῶμα τῷ πατρί μου καὶ ἔφαγεν⁶.
