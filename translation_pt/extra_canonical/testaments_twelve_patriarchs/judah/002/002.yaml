base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/002.yaml
  text: I know that I ran with a hind and caught it, and I made it food for my father, and he ate.
translation:
  language: pt
  text: Sei que corri com uma corça, capturei-a, fiz dela comida para meu pai, e ele comeu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: Sei
  rationale: Equivalência direta do presente grego, preservando a afirmação enfática de conhecimento ou lembrança.
- source_word: συνέδραμον ἐλάφῳ
  choice: corri ao lado de uma corça
  rationale: O verbo composto indica correr junto ou acompanhar correndo; ἔλαφος, aqui no dativo e vertido tradicionalmente como animal fêmea, é expresso naturalmente por “corça”.
- source_word: ἐπίασα αὐτήν
  choice: alcancei-a
  rationale: No contexto de perseguição e caça, “alcançar” comunica a captura após correr sem recorrer ao menos natural “peguei-a”.
- source_word: ἐποίησα αὐτὴν βρῶμα
  choice: fiz dela alimento
  rationale: Preserva de perto a construção grega e seu sentido de preparar o animal como comida.
- source_word: ἔφαγεν
  choice: ele comeu
  rationale: Mantém o sujeito masculino singular implícito, cujo referente contextual é o pai.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e proximidade semântica ao grego. A repetição excessiva de “e” foi moderada por pontuação, sem alterar a sequência narrativa.
