base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/003.yaml
  text: And I would seize the gazelle along the road, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and threw it down the cliff, and it was crushed.
translation:
  language: pt
  text: Eu agarrava a gazela em plena corrida e alcançava tudo o que havia nos campos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δορκάδα
  choice: gazela
  rationale: Equivalente direto e corrente para o animal mencionado, sem especificar uma espécie além do que o grego permite.
- source_word: διὰ τοῦ δρόμου
  choice: em plena corrida
  rationale: No contexto de uma demonstração de velocidade e força, δρόμος designa mais naturalmente a corrida ou o percurso corrido do que uma estrada; a expressão portuguesa comunica que a gazela era agarrada enquanto corria.
- source_word: ἐκράτουν
  choice: agarrava
  rationale: O imperfeito sugere ação habitual ou repetida; “agarrava” preserva esse aspecto e a ideia de dominar fisicamente o animal.
- source_word: κατελάμβανον
  choice: alcançava
  rationale: Expressa aqui alcançar ou apanhar em perseguição, em paralelo com a captura da gazela.
- source_word: πᾶν ὃ ἦν ἐν τοῖς πεδίοις
  choice: tudo o que havia nos campos
  rationale: Mantém a formulação abrangente e hiperbólica do grego sem restringir o referente a animais, embora o contexto possa sugeri-los.
