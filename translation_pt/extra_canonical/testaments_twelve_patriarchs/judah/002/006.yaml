  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/006.yaml
  text: A leopard in Hebron sprang upon the dog, and I caught it by the tail and hurled it against the rock, and it was split in two.
translation:
  language: pt
  text: Um leopardo, em Hebrom, saltou sobre o cão; eu o agarrei pela cauda, arremessei-o contra a rocha, e ele se partiu em dois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάρδαλις
  choice: leopardo
  rationale: Equivalente direto e natural para o felino designado pelo grego.
- source_word: προσεπήδησεν ἐπὶ τὸν κύνα
  choice: saltou sobre o cão
  rationale: Reproduz de modo claro o movimento agressivo expresso pelo verbo e pela preposição.
- source_word: πιάσας αὐτὴν ἀπὸ τῆς κέρκου
  choice: o agarrei pela cauda
  rationale: Mantém a ação física e traduz κέρκος diretamente como “cauda”; o pronome masculino segue o gênero de “leopardo” em português.
- source_word: ἀπηκόντισα αὐτὴν ἐπὶ τὴν πέτραν
  choice: arremessei-o contra a rocha
  rationale: “Arremessei” comunica o lançamento violento sugerido pelo verbo, e “contra” expressa naturalmente o impacto sobre a rocha.
- source_word: ἐρράγη εἰς δύο
  choice: ele se partiu em dois
  rationale: Preserva a formulação concreta e enfática do grego sem explicações adicionais.
