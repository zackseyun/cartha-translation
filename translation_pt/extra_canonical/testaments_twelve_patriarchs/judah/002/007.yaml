  text: I found a wild ox grazing in the land, and, taking hold of its horns, I shook it all around and blinded it.
translation:
  language: pt
  text: Encontrei um touro selvagem pastando pela região. Segurei-o pelos chifres, sacudi-o de um lado para outro, ceguei-o, arremessei-o e o matei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A edição grega assinala dificuldades de leitura nesta sequência. Mais literalmente, a frase central pode ser entendida como: “sacudi-o em círculos e o deixei sem visão; arremessei-o e o matei”.'
    reason: Registra a dificuldade editorial e a alternativa mais literal para κύκλῳ συσσείσας e σκοτίσας, sem substituir no texto principal a noção de cegueira nem acrescentar uma direção para ῥίψας.
lexical_decisions:
- source_word: Βοῦν ἄγριον
  choice: um boi selvagem
  rationale: Equivalente direto e natural para o animal designado pelo grego, sem especificar uma espécie além do que o texto permite.
- source_word: τὴν χώραν νεμόμενον
  choice: pastando pela região
  rationale: νεμόμενον indica o animal alimentando-se ou pastando; χώραν tem sentido amplo de região ou território.
- source_word: κρατήσας τῶν κεράτων
  choice: Segurei-o pelos chifres
  rationale: κρατέω exprime agarrar ou dominar; a formulação portuguesa mantém a ação concreta sem acrescentar detalhes.
- source_word: κύκλῳ συσσείσας
  choice: sacudi-o de um lado para o outro
  rationale: A expressão indica forte agitação ao redor; esta redação é natural em português e evita sugerir com certeza que o animal foi girado em círculos.
- source_word: σκοτίσας
  choice: deixei-o atordoado
  rationale: Embora o verbo signifique literalmente escurecer e possa sugerir cegar, no contexto de violência física pode descrever a perda dos sentidos ou da visão; 'atordoado' conserva melhor essa abertura contextual.
- source_word: ῥίψας
  choice: lancei-o ao chão
  rationale: O particípio significa lançar ou arremessar; 'ao chão' explicita a direção naturalmente pressuposta pela cena, sem alterar sua sequência.
- source_word: ἀνεῖλον αὐτόν
  choice: e o matei
  rationale: ἀναιρέω, neste contexto, significa matar ou eliminar.
