id: T12P.JUD.17.3
reference: Testament of Judah 17:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὅτι καὶ¹⁶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν¹⁷ Ἰούδα σμικρυνθῆναι ποιήσουσιν¹⁸, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/003.yaml
  text: For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which he gave me because of my obedience to my father Jacob.
translation:
  language: pt
  text: Pois eles corromperão até homens sábios dentre meus filhos e farão diminuir o reino de Judá, que o Senhor me deu por eu ter obedecido a meu pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοιώσουσι
  choice: corromperão
  rationale: Embora o verbo possa significar literalmente “alterar” ou “mudar”, neste contexto indica uma mudança prejudicial nos homens sábios; “corromperão” comunica naturalmente essa força moral negativa.
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: farão diminuir
  rationale: Reproduz a construção causativa grega e preserva a ideia de redução do reino sem especificar se ela é territorial, política ou numérica.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: por eu ter obedecido a meu pai
  rationale: Expressa em português corrente a relação entre a dádiva e a obediência de Judá, sem acrescentar o nome “Jacó”, ausente no texto grego fornecido.
theological_decisions:
- issue: Sujeito da dádiva do reino
  choice: “o Senhor me deu”
  alternative: “ele me deu”
  rationale: O texto grego fornecido contém explicitamente Κύριος; por isso, “o Senhor” deve ser mantido, apesar da revisão inglesa mais recente afirmar o contrário.
- issue: Natureza da diminuição do reino
  choice: Mantida sem explicação adicional
  alternative: Especificar perda territorial, política ou dinástica
  rationale: O grego apenas declara que o reino seria reduzido; especificar o modo resolveria indevidamente uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e leitura amplamente acessível no Brasil. A coordenação foi simplificada sem perder a ênfase de καὶ καίγε (“até”).
