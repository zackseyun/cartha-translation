  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, μὴ ἀγαπᾶτε⁵ ἀργύριον⁶ μηδὲ ἐπιβλέπει⁷ *εἰς κάλλος⁸ γυναικῶν, ὅτι κἀγὼ διὰ χρυσίον καὶ εὐμορφίαν¹⁰ ἐπλανήθην εἰς Βησουὲ¹¹ τὴν Χαναναίαν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/001.yaml
  text: 'And now I command you, my children: do not love silver, nor set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.'
translation:
  language: pt
  text: 'E agora lhes ordeno, meus filhos: não amem a prata, nem fixem os olhos na beleza das mulheres, pois eu também, por causa do ouro e da beleza, fui desencaminhado até Besué, a cananeia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: ordeno
  rationale: Expressa de modo direto e digno a autoridade da exortação paterna.
- source_word: ἀργύριον
  choice: prata
  rationale: Mantém o referente literal do grego, em paralelo com χρυσίον, sem generalizá-lo como dinheiro.
- source_word: ἐπιβλέπει εἰς κάλλος
  choice: fixem os olhos na beleza
  rationale: Reproduz naturalmente em português a ideia de dirigir e manter o olhar sobre a beleza.
- source_word: ἐπλανήθην
  choice: fui desencaminhado
  rationale: Preserva a forma passiva e a ideia de ser levado para fora do caminho correto.
- source_word: Βησουὲ
  choice: Besué
  rationale: Transliteração portuguesa próxima da forma grega, com acento para orientar a pronúncia.
- source_word: τὴν Χαναναίαν
  choice: a cananeia
  rationale: Conserva o substantivo/adjetivo feminino substantivado, identificando Besué por sua origem.
theological_decisions:
- issue: Agência na queda de Judá
  choice: fui desencaminhado
  alternative: desviei-me
  rationale: A forma escolhida conserva a voz passiva do grego e não resolve quem ou o que exerceu a ação, enquanto o contexto explicita ouro e beleza como causas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega-se tratamento plural corrente («lhes», «amem», «fixem») e mantém-se o paralelismo entre prata/ouro e beleza.
