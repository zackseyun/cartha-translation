source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα¹² ὅτι διὰ τὰ δύο ταῦτα ἔσται¹³ τὸ γένος μου¹⁴ *εἰς ἀπώλειαν πορνείας¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/002.yaml
  text: And I know that because of these two things my offspring will be for destruction because of sexual immorality.
translation:
  language: pt
  text: E sei que, por causa dessas duas coisas, minha descendência estará destinada à destruição por imoralidade sexual.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à destruição ligada à imoralidade sexual”. A relação exata entre “destruição” e “imoralidade sexual” é compacta e ambígua no grego.'
    reason: Preservar a possível amplitude do genitivo πορνείας sem tornar o texto principal obscuro.
lexical_decisions:
- source_word: γένος μου
  choice: minha descendência
  rationale: No contexto patriarcal, γένος designa os descendentes de Judá; “descendência” comunica isso com naturalidade e sem restringir o sentido a uma única geração.
- source_word: εἰς ἀπώλειαν
  choice: destinada à destruição
  rationale: A construção ἔσται ... εἰς ἀπώλειαν indica um resultado ou destino. A formulação preserva a força prospectiva sem recorrer ao pouco natural “será para destruição”.
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: O termo πορνεία tem alcance mais amplo que “prostituição” ou “fornicação” no português atual; “imoralidade sexual” é claro e não restringe indevidamente sua referência.
theological_decisions:
- issue: Relação do genitivo πορνείας com ἀπώλειαν
  choice: “destruição por imoralidade sexual”, entendendo o genitivo como causal
  alternative: “destruição da imoralidade sexual”, que poderia sugerir que a própria imoralidade é destruída, ou “destruição caracterizada pela imoralidade sexual”
  rationale: A leitura causal se ajusta ao contexto de advertência e à relação entre conduta e ruína, mas a forma grega é compacta e permite mais de uma análise; por isso, a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição pesada de “por causa de” foi evitada, mantendo-se clara a relação causal do primeiro sintagma e a provável relação causal do último.
