  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024.yaml
  text: '1. He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.

    2. And you will be for him sons in truth, and you will walk in his commands, first and last.

    3. [This is the shoot of the Most High God, a spring for the life of all flesh.]

    4. Then the scepter of my kingdom will shine forth, and from your root a stem will arise.

    5. And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.'
translation:
  language: pt
  text: '**Testamento de Judá 24**


    **1.** Depois disso, uma estrela surgirá para vocês, procedente de Jacó, em paz; e um homem se levantará da minha descendência, como um sol de justiça, caminhando com os seres humanos em mansidão e justiça. Nele não se achará pecado algum.


    **2.** Sobre ele se abrirão os céus para derramar o espírito da bênção do Pai santo[a], e ele mesmo derramará sobre vocês um espírito de graça.


    **3.** E vocês serão para ele filhos, em verdade, e andarão nos seus mandamentos, tanto nos primeiros como nos últimos.[b]


    **4.** [Este é o renovo do Deus Altíssimo e esta é a fonte que dá vida a todos.][c]


    **5.** Então resplandecerá o cetro do meu reino, e da raiz de vocês surgirá um tronco.


    **6.** Dela brotará uma vara de justiça para as nações, a fim de julgar e salvar todos os que invocam o Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção grega também pode ser entendida como “o espírito, a bênção do Pai santo”; sua sintaxe é incomum.
    reason: Registrar a ambiguidade sintática genuína em πνεῦμα εὐλογίαν πατρὸς ἁγίου, sem impor uma identificação doutrinária pela capitalização.
  - marker: b
    text: Literalmente, “em seus mandamentos, primeiros e últimos”. A expressão pode se referir a todos os mandamentos, do primeiro ao último, ou distinguir mandamentos anteriores e posteriores.
    reason: Preservar a formulação temporal ou ordenativa incomum de πρώτοις καὶ ἐσχάτοις.
  - marker: c
    text: Este versículo aparece entre colchetes na edição grega usada, indicando incerteza quanto à sua transmissão textual.
    reason: Explicar os colchetes editoriais reproduzidos no texto principal sem tratar a passagem como indiscutivelmente original.
lexical_decisions:
- source_word: ἄστρον
  choice: estrela
  rationale: Equivalente direto que preserva a imagem astral e régia do texto.
- source_word: σπέρματός μου
  choice: minha descendência
  rationale: Em contexto genealógico, comunica naturalmente o sentido coletivo de σπέρμα sem perder sua relação com Judá.
- source_word: ἥλιος δικαιοσύνης
  choice: sol de justiça
  rationale: Mantém literalmente a metáfora e sua possível ressonância escriturística, sem identificá-la além do que o texto afirma.
- source_word: συμπορευόμενος
  choice: caminhando com
  rationale: 'Preserva o valor associativo de συμπορεύομαι: seguir caminho juntamente com outras pessoas.'
- source_word: πνεῦμα χάριτος
  choice: espírito de graça
  rationale: Mantém a ambiguidade entre atuação espiritual, disposição e dom, sem impor maiúscula não explicitada pelo grego.
- source_word: προστάγμασιν
  choice: mandamentos
  rationale: Expressa ordens ou determinações vinculantes em português corrente e digno.
- source_word: βλαστός
  choice: renovo
  rationale: Preserva a metáfora vegetal e o tom tradicional-profético, com boa inteligibilidade em português bíblico moderno.
- source_word: πυθμήν
  choice: tronco
  rationale: Representa a base ou cepo de uma planta e mantém a sequência metafórica de raiz, tronco e vara.
- source_word: ῥάβδος δικαιοσύνης
  choice: vara de justiça
  rationale: Tradução formal que conserva a possível dupla imagem de ramo e instrumento de autoridade.
- source_word: ἐπικαλουμένους τὸν Κύριον
  choice: os que invocam o Senhor
  rationale: Formulação natural que preserva o sentido cultual e apelativo de ἐπικαλέω.
theological_decisions:
- issue: Identidade do homem oriundo da descendência de Judá
  choice: Manter a descrição profética sem acrescentar um título messiânico ou uma identificação nominal
  alternative: Traduzir ou explicar explicitamente como referência ao Messias
  rationale: O texto reúne imagens potencialmente messiânicas, mas não emprega aqui o substantivo 'Messias'; a tradução deve preservar a inferência sem transformá-la em afirmação explícita.
- issue: Relação entre πνεῦμα e εὐλογίαν πατρὸς ἁγίου no versículo 2
  choice: “o Espírito — a bênção do Pai santo —”
  alternative: “o espírito da bênção do Pai santo” ou “Espírito e bênção do Pai santo”
  rationale: A construção grega é sintaticamente irregular. A aposição conserva os dois acusativos e permite que 'bênção' explique 'Espírito', sem criar uma conjunção ausente.
- issue: Capitalização de πνεῦμα no versículo 2
  choice: “Espírito” na primeira ocorrência e “espírito de graça” na segunda
  alternative: Capitalizar ambas ou deixar ambas em minúscula
  rationale: A primeira ocorrência procede dos céus e é descrita como bênção do Pai santo, favorecendo referência ao Espírito divino; a segunda mantém maior ambiguidade lexical, que a minúscula preserva.
- issue: Filiação no versículo 3
  choice: “filhos para ele”
  alternative: “filhos dele”
  rationale: O dativo αὐτῷ indica relação orientada a ele, não necessariamente origem ou posse; a formulação escolhida evita resolver além do texto quem gera ou adota os filhos.
- issue: Alcance de πάντας no versículo 6
  choice: Restringir “todos” pela oração “os que invocam o Senhor”
  alternative: Entender salvação universal sem qualificação
  rationale: O particípio com artigo define gramaticalmente o grupo abrangido por πάντας.
translation_notes:
  register: Português moderno, solene e acessível, com sintaxe de leitura pública. Empregou-se “vocês” para o plural de segunda pessoa, conforme a legibilidade brasileira e a abrangência internacional moderna. As metáforas proféticas — estrela, sol, renovo, fonte, cetro, raiz, tronco e vara — foram mantidas, e nenhuma identificação confessional foi inserida.
