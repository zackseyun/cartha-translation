  text: '1. And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.


    2. So Dan and I, pretending to be Amorites as though allies, entered their city.


    3. And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering everything that belonged to them, we tore down their three walls.


    4. And we drew near to Thamna, where all their baggage was.


    5. Then, being insulted by them, I became angry, and I rushed up against them to the summit. And they kept hurling stones and shooting arrows at me.


    6. And if Dan my brother had not fought alongside me,'
translation:
  language: pt
  text: '1. No dia seguinte, fomos informados de que o rei da cidade de Gaás vinha contra nós com uma grande multidão.


    2. Então eu e Dã fomos até os amorreus e, fingindo ser seus aliados, entramos na cidade deles.


    3. No mais profundo da noite, meus irmãos vieram até nós. Abrimos-lhes os portões, exterminamos todos eles e saqueamos.


    4. Depois nos aproximamos de Tamna, onde estava toda a bagagem dos reis inimigos.


    5. Então, insultado por eles, fiquei furioso e avancei contra eles, rumo ao cume. Eles atiravam pedras com fundas contra mim e disparavam flechas.


    6. E, se meu irmão Dã não tivesse lutado ao meu lado,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: No dia seguinte
  rationale: A expressão elíptica indica o dia subsequente; a forma portuguesa explicita naturalmente o substantivo implícito.
- source_word: ἐν λαῷ πολλῷ
  choice: com uma grande multidão
  rationale: Embora λαός possa significar “povo”, neste contexto militar designa uma numerosa força ou comitiva; “multidão” preserva a amplitude sem especificar “exército”.
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: fingindo ser seus aliados
  rationale: A construção indica que Judá e Dã se apresentaram falsamente aos amorreus como aliados deles; não diz que fingiram ser amorreus.
- source_word: Νυκτὸς βαθείας
  choice: No mais profundo da noite
  rationale: Reproduz a intensidade temporal da expressão grega em linguagem portuguesa natural e solene.
- source_word: πάντας αὐτοὺς ἐξωλοθρεύσαμεν
  choice: exterminamos todos os habitantes
  rationale: O verbo é forte e denota destruição total. “Habitantes” torna explícito o referente humano de αὐτούς no contexto da cidade, sem suavizar a violência narrada.
- source_word: ἐπρονομεύσαμεν
  choice: saqueamos a cidade
  rationale: O verbo significa pilhar ou saquear. “A cidade” retoma o local atacado; o texto grego disponível não contém a menção posterior a três muralhas presente na camada inglesa.
- source_word: ἀποσκευή
  choice: bagagem
  rationale: Termo usual para os pertences, equipamentos ou trem de bagagem de uma força; “bagagem” mantém a abrangência do grego.
- source_word: ὑβριζόμενος
  choice: insultado
  rationale: Expressa o ultraje dirigido a Judá sem determinar uma forma mais específica de abuso que o contexto não fornece.
- source_word: ὥρμησα ἐπ᾽ αὐτοὺς ἐπὶ τὴν κορυφήν
  choice: avancei contra eles, rumo ao cume
  rationale: Mantém tanto o movimento hostil contra os adversários quanto a direção ascendente, sem forçar uma relação sintática mais precisa do que o grego permite.
- source_word: συνεμάχησεν
  choice: tivesse lutado ao meu lado
  rationale: O verbo indica combater em conjunto ou prestar auxílio na luta; a formulação se ajusta à condição contrafactual incompleta.
theological_decisions:
- issue: Relato de extermínio e saque
  choice: Traduzir diretamente a violência narrada, sem justificá-la nem atenuá-la
  alternative: Empregar termos mais brandos, como “derrotamos” e “tomamos seus bens”
  rationale: O texto apresenta ações militares violentas como parte da narrativa; a tradução não deve acrescentar aprovação moral, condenação ou harmonização teológica.
- issue: Frase condicional interrompida no versículo 6
  choice: Conservar a oração inacabada com vírgula final
  alternative: Completar a consequência a partir de versões ou conjecturas
  rationale: A fonte grega fornecida termina após a prótase; preservar a lacuna evita introduzir conteúdo sem apoio textual.
translation_notes:
  register: 'Português moderno, digno e narrativamente claro, com ampla legibilidade brasileira. Os nomes foram grafados como “Gaás”, “Dã” e “Tamna”. A tradução segue a fonte grega fornecida: não incorpora a referência inglesa a destruir “três muralhas”, ausente neste trecho grego, e inclui “dos reis inimigos” no versículo 4, que está presente na fonte.'
