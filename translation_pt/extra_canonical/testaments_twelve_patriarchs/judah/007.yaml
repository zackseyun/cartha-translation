    issue: Restrição de πάντας αὐτούς em 7.3
    rationale: «Todos os habitantes» identifica os referentes como moradores da cidade, mas o grego diz simplesmente «todos eles». Embora o contexto permita inferir combatentes ou pessoas da cidade, a tradução não deve fixar esse referente de modo mais estreito.
  - severity: low
    issue: Objeto explicitado em ἐπρονομεύσαμεν em 7.3
    rationale: «Saqueamos a cidade» é compreensível, mas o grego emprega o verbo sem objeto expresso. «Saqueamos» mantém a elipse e evita deslocar o foco para a cidade como objeto.
