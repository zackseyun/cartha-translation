    issue: «entre uns e outros» para κατ᾽ ἀλλήλων
    rationale: 'A expressão portuguesa pode indicar apenas separação ou distribuição entre grupos, ao passo que κατ᾽ ἀλλήλων comunica conflito recíproco: uns contra os outros.'
  - severity: low
    issue: «fará vir»
    rationale: É uma reprodução inteligível da construção grega, mas «trará» é a formulação moderna mais natural, sem perda de sentido.
  revised_text: Então o Senhor trará sobre eles divisões, uns contra os outros, e haverá guerras contínuas em Israel.
