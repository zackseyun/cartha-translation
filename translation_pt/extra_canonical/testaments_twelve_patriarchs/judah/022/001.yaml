base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/001.yaml
  text: The Lord will bring divisions among them against one another, and continual wars will be in Israel.
translation:
  language: pt
  text: Então o Senhor trará sobre eles divisões, uns contra os outros, e haverá guerras contínuas em Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπάξει
  choice: fará vir sobre
  rationale: Expressa de modo natural o valor causativo do futuro de ἐπάγω, preservando a ideia de que o Senhor trará esse juízo sobre eles.
- source_word: διαιρέσεις κατ᾽ ἀλλήλων
  choice: divisões entre uns e outros
  rationale: Mantém tanto a noção de dissensão interna quanto a reciprocidade de κατ᾽ ἀλλήλων, sem sugerir apenas uma divisão abstrata.
- source_word: συνεχεῖς
  choice: contínuas
  rationale: Reproduz diretamente a ideia de persistência ou continuidade.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Preserva a referência coletiva e geográfica do grego sem explicitação interpretativa adicional.
theological_decisions:
- issue: Agência divina nas divisões
  choice: O Senhor ... fará vir sobre eles
  alternative: O Senhor permitirá que surjam entre eles
  rationale: O verbo ἐπάξει atribui ação ao Senhor de maneira mais direta; traduzir por mera permissão atenuaria uma tensão teológica presente no texto.
- issue: Substantivo implícito ou textualmente instável na segunda oração
  choice: haverá guerras contínuas
  alternative: elas serão contínuas em Israel
  rationale: O texto grego transmitido, conforme apresentado, é sintaticamente difícil e repete ἔσονται, enquanto a tradição consultada entende o referente como guerras. A formulação explicita esse sentido necessário em português e segue a leitura auditada, sem acrescentar qualificação teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem foi ajustada para fluência natural, e «porém» representa δὲ sem tornar o contraste excessivamente forte.
