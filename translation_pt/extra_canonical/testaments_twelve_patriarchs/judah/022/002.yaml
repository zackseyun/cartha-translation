  source_fidelity: 'O texto traduz com precisão a estrutura e o sentido do grego: καὶ introduz a continuação; ἡ βασιλεία μου é corretamente «o meu reino»; ἐν ἀλλοφύλοις é adequadamente representado por «entre estrangeiros»; e o futuro passivo συντελεσθήσεται é bem expresso por «chegará ao fim». «Até que venha a salvação de Israel» reflete ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραήλ sem transformar σωτήριον em um título pessoal.'
