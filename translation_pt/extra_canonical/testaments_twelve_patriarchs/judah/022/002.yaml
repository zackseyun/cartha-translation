  text: Καὶ ἐν ἀλλοφύλοις⁵ συντελεσθήσεται ἡ βασιλεία μου⁶, ἕως⁷ τοῦ ἐλθεῖν⁸ τὸ⁹ σωτήριον τοῦ¹⁰ Ἰσραήλ¹⁰,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/002.yaml
  text: And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes,
translation:
  language: pt
  text: E o meu reino chegará ao fim entre estrangeiros, até que venha a salvação de Israel,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοφύλοις
  choice: estrangeiros
  rationale: Traduz literalmente a ideia de pessoas de outro povo, sem restringi-la necessariamente aos filisteus ou a uma categoria religiosa.
- source_word: συντελεσθήσεται
  choice: chegará ao fim
  rationale: Expressa de modo natural o sentido passivo de ser consumado ou levado ao término no contexto do reino.
- source_word: σωτήριον
  choice: salvação
  rationale: O substantivo neutro designa salvação ou meio de salvação; a forma abstrata preserva a leitura mais direta e a possível amplitude teológica.
theological_decisions:
- issue: Referente de σωτήριον
  choice: salvação
  alternative: Salvador
  rationale: Mantém a forma neutra e não personifica explicitamente o termo, preservando a ambiguidade do grego quanto à natureza da salvação vindoura.
- issue: Relação temporal introduzida por ἕως τοῦ
  choice: até que venha
  alternative: até a vinda de
  rationale: Reproduz claramente o limite temporal sem decidir se a chegada da salvação restaura o reino de Judá ou apenas encerra a situação descrita.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima à do grego. A vírgula final foi mantida porque o trecho fornecido termina como parte de uma frase contínua.
