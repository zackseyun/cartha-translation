  text: 1[a]. After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal adornment and sat in Enaim, at the city gate of the inn. 2. For it was a law of the Amorites that a widow should sit there openly for prostitution. 3. So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment. 4[b]. And turning aside to her I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived. 5. But I, not knowing what I had done, wanted to kill her. Yet she sent the pledges secretly and put me to shame. 6. And when I called her, I heard also the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord. 7. For I said, “Perhaps she did this deceitfully,
    having received the pledge from another.” 8. But I did not approach her again for the rest of my life, because I had done this abomination in all Israel. 9. Yet those in the city said that there had been no harlot sitting at the gate, because she had come from another place and sat for a short time at the gate. 10. And I supposed that no one knew that I had gone in to her. 11. And after this we came into Egypt to Joseph because of the famine. 12. Now I was forty-six years old[d][c], and I spent seventy-three years in Egypt.
translation:
  language: pt
  text: '**Testamento de Judá 12**


    **1.** Depois disso, dois anos depois de Tamar ter ficado viúva, ela soube que eu estava subindo para tosquiar as ovelhas. Então se enfeitou com adornos de noiva e sentou-se na cidade de Enã, junto ao portão. **2.** Pois era lei entre os amorreus que a viúva se sentasse diante do portão durante sete dias. **3.** Eu, porém, estava embriagado de vinho e não a reconheci; sua beleza me enganou por causa da aparência de seus adornos.


    **4.** Voltei-me para ela e disse:


    — Vou me deitar com você.


    Ela perguntou:


    — O que você me dará?


    Dei-lhe meu cajado e meu diadema como garantia.[a] Quando me uni a ela, ela ficou grávida. **5.** Sem saber o que eu havia feito, quis matá-la. Ela, porém, enviou-me secretamente as garantias e me envergonhou. **6.** Quando a chamei, ouvi também as palavras secretas que eu havia pronunciado enquanto estava deitado com ela, em minha embriaguez. Então não pude matá-la, porque aquilo vinha do Senhor.[b]


    **7.** Pois eu dizia: “Talvez ela tenha agido com engano, recebendo de outra mulher as garantias e valendo-se comigo das primeiras palavras”.[c] **8.** Contudo, nunca mais me aproximei dela enquanto vivi.


    **9.** De fato, os moradores da cidade diziam que não havia no portão ninguém que se prostituísse,[d] pois ela viera de outro lugar e permanecera sentada no portão por pouco tempo. **10.** Eu pensava que ninguém soubesse que eu havia me deitado com ela.


    **11.** Depois disso, fomos ao Egito, para junto de José, por causa da fome. **12.** Eu tinha então quarenta e seis anos e passei setenta e três anos no Egito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A fonte grega fornecida menciona dois objetos: “meu cajado e meu diadema”. Outras formas do relato apresentam uma lista diferente de garantias.'
    reason: textual_variant
  - marker: b
    text: A expressão “vinha do Senhor” atribui o desfecho à atuação ou providência divina, mas não afirma necessariamente que o Senhor aprovasse o ato.
    reason: theological_tension
  - marker: c
    text: A expressão grega traduzida como “as primeiras palavras” é obscura. Também pode ser entendida como “as palavras de antes”; o texto não esclarece a quais palavras Judá se refere.
    reason: lexical_alternative
  - marker: d
    text: O termo grego deste trecho é raro e textualmente difícil. Pelo contexto, parece designar alguém que oferecia serviços sexuais no portão; por isso, foi traduzido como “ninguém que se prostituísse”.
    reason: textual_difficulty
lexical_decisions:
- source_word: χηρευούσης τῆς Θαμάρ μετὰ ἔτη δύο
  choice: dois anos após Tamar ficar viúva
  rationale: Expressa naturalmente em português o estado de viuvez transcorrido por dois anos, sem alterar a relação temporal do grego.
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: se enfeitou com adornos de noiva
  rationale: Preserva a repetição conceitual entre o verbo e o substantivo e comunica com clareza o caráter nupcial dos adornos.
- source_word: ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  choice: na cidade de Enã, junto ao portão
  rationale: Segue a coluna grega fornecida, que identifica Enã como cidade e menciona o portão, sem acrescentar a hospedaria presente em outra forma textual.
- source_word: προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην
  choice: se sentasse diante do portão durante sete dias
  rationale: Mantém tanto a posição pública indicada pelo verbo quanto a duração explícita de sete dias.
- source_word: οὐκ ἐπέγνων αὐτήν
  choice: não a reconheci
  rationale: Neste contexto, o verbo indica falta de reconhecimento da identidade de Tamar, e não desconhecimento em sentido geral ou sexual.
- source_word: ἠπάτησέ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: sua beleza me enganou por causa da aparência de seus adornos
  rationale: Conserva a beleza como sujeito da ação e mantém a relação entre o engano e a aparência produzida pelos adornos.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Quero me deitar com você
  rationale: Reproduz em português atual e digno o eufemismo sexual grego, evitando uma tradução literal incompreensível como 'entrar até você'.
- source_word: τὴν ῥάβδον μου καὶ τὸ διάδημά μου
  choice: meu cajado e meu diadema
  rationale: Traduz exatamente os dois objetos da fonte grega fornecida, sem importar o anel ou uma expansão régia de outra forma textual.
- source_word: εἰς ἀρραβῶνα / τοὺς ἀρραβῶνας
  choice: como garantia / as garantias
  rationale: ἀρραβών designa algo entregue como penhor ou garantia. 'Garantia' é clara no português moderno e permite a alternância entre singular coletivo e plural no texto.
- source_word: συνήλθον αὐτῇ
  choice: me uni a ela
  rationale: Mantém o eufemismo sexual da expressão grega em registro narrativo digno.
- source_word: ἐποίησα ... ἔτη εἰς Αἴγυπτον
  choice: passei ... anos no Egito
  rationale: O verbo 'fazer' com uma duração tem aqui o sentido idiomático de passar ou permanecer determinado número de anos.
theological_decisions:
- issue: παρὰ Κυρίου ἦν no versículo 6
  choice: porque aquilo vinha do Senhor
  alternative: porque aquilo era da parte do Senhor / porque era vontade do Senhor
  rationale: A formulação atribui o acontecimento ao Senhor, mas não define se Judá fala de providência, juízo, propósito ou aprovação. A tradução preserva essa tensão e a nota impede que se leia automaticamente como aprovação moral.
- issue: Linguagem régia de διάδημα no versículo 4
  choice: manter 'diadema' conforme a fonte
  alternative: harmonizar com Gênesis mediante 'cordão' ou acrescentar 'do meu reino'
  rationale: A coluna grega fornecida contém simplesmente 'meu diadema'. A tradução preserva esse elemento régio sem importar expansões de outras formas textuais nem harmonizar silenciosamente com Gênesis.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A narração mantém dignidade testamentária sem arcaísmos desnecessários. Os diálogos usam 'você' por naturalidade internacional com leitura brasileira. Foram seguidas as leituras da coluna grega fornecida, inclusive quando divergem da camada inglesa de consulta e do relato de Gênesis.
