id: T12P.JUD.8.17
reference: Testament of Judah 8:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τὸ γὰρ πνεῦμα τῆς πορνείας τὸν οἶνον ὡς διάκονον ἔχει πρὸς τὴν ἡδονὴν τοῦ νοός. ὅτι καίγε τὰ δύο ταῦτα ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου.
  language: Greek
  note: Greek from Charles XIV.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/017.yaml
  text: For the spirit of sexual immorality has wine as a servant to give pleasure to the mind; for these two also take away a person's understanding.
translation:
  language: pt
  text: Pois o espírito da imoralidade sexual tem o vinho como servo para o prazer da mente; de fato, essas duas coisas privam o ser humano de entendimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα τῆς πορνείας
  choice: espírito da imoralidade sexual
  rationale: Preserva a personificação de πνεῦμα e traduz πορνεία em linguagem moderna e abrangente, sem restringi-la a uma prática sexual específica.
- source_word: διάκονον
  choice: servo
  rationale: Expressa a função instrumental e subordinada atribuída ao vinho; aqui o termo não designa necessariamente um ofício religioso.
- source_word: ἡδονὴν τοῦ νοός
  choice: prazer à mente
  rationale: Mantém a relação explícita entre prazer e νοῦς, evitando acrescentar uma finalidade ou um juízo não declarado no grego.
- source_word: ἀφιστῶσι τὴν διάνοιαν
  choice: afastam o entendimento
  rationale: Reproduz a imagem verbal de afastar ou desviar e conserva διάνοια como a capacidade de compreensão ou discernimento.
- source_word: τοῦ ἀνθρώπου
  choice: do ser humano
  rationale: Representa o sentido genérico de ἄνθρωπος em português inclusivo e corrente.
theological_decisions:
- issue: Personificação do espírito da imoralidade sexual
  choice: Manter «espírito» como agente que se serve do vinho
  alternative: Parafrasear como uma inclinação ou influência para a imoralidade sexual
  rationale: O texto grego personifica claramente o πνεῦμα e apresenta o vinho como seu διάκονος; a tradução não deve decidir se essa linguagem é ontológica, demonológica ou figurada.
- issue: Relação entre vinho e imoralidade sexual
  choice: Apresentar ambos como coisas que afastam o entendimento
  alternative: Declarar que o vinho necessariamente causa imoralidade sexual
  rationale: O grego associa os dois e lhes atribui conjuntamente efeito sobre a διάνοια, mas não formula uma relação causal absoluta entre consumo de vinho e imoralidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura próxima do grego sem rigidez artificial. «Imoralidade sexual» favorece clareza contemporânea; «servo» preserva a metáfora sem sugerir o cargo eclesiástico de diácono.
