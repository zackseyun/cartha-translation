- from: Pois o espírito da imoralidade sexual tem o vinho como servo para dar prazer à mente, porque essas duas coisas também afastam o entendimento do ser humano.
  to: Pois o espírito da imoralidade sexual tem o vinho como servo para o prazer da mente; de fato, essas duas coisas privam o ser humano de entendimento.
  rationale: A revisão conserva a metáfora do vinho como servo do espírito da imoralidade sexual e a associação dos dois elementos no efeito sobre a mente. Ela substitui a leitura aditiva de καίγε por uma formulação confirmatória e torna a sintaxe portuguesa mais natural, sem alterar o sentido.
