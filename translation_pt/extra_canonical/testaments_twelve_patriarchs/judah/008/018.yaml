  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν γὰρ πίῃ τις οἶνον εἰς μέθην, ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει τὸν νοῦν σου, καὶ εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν, καὶ πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται.
  language: Greek
  note: Greek from Charles XIV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/018.yaml
  text: For if one drinks wine to drunkenness, it disturbs the mind with filthy thoughts and leads the body on to sexual union; and if the occasion of desire is present, he commits the sin and is not ashamed.
translation:
  language: pt
  text: Pois, se alguém bebe vinho até se embriagar, o vinho perturba a tua mente com pensamentos impuros e inflama o corpo para a imoralidade sexual em busca de prazer; essa pessoa comete o pecado e não se envergonha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς μέθην
  choice: até se embriagar
  rationale: Expressa naturalmente a ideia de beber até chegar à embriaguez, sem condenar o vinho em si.
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς
  choice: com pensamentos impuros
  rationale: Traduz o sentido moral de ῥυπαρός e mantém a linguagem clara e digna.
- source_word: συνταράσσει τὸν νοῦν σου
  choice: perturba sua mente
  rationale: Conserva a ideia de agitação ou transtorno interior; o possessivo de segunda pessoa é vertido de modo inclusivo e natural no contexto da oração condicional impessoal.
- source_word: εἰς πορνείαν
  choice: para a imoralidade sexual
  rationale: Abrange o campo semântico amplo de πορνεία sem restringi-lo indevidamente a um único ato sexual.
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: inflama seu corpo ... em busca de prazer
  rationale: Preserva a imagem de aquecer ou excitar o corpo e a orientação para o prazer.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: comete o pecado
  rationale: Equivalência direta e idiomática, mantendo o artigo definido do grego.
- source_word: οὐκ αἰσχύνεται
  choice: sem se envergonhar
  rationale: Forma portuguesa fluente que preserva a ausência de vergonha após o ato.
theological_decisions:
- issue: Relação entre embriaguez, desejo e pecado
  choice: Manter a sequência causal apresentada no grego, sem acrescentar uma condição externa para a prática do pecado.
  alternative: Seguir a camada inglesa e inserir “se surgir a ocasião do desejo”.
  rationale: A cláusula condicional adicional da versão inglesa não aparece no texto grego fornecido; por isso, a tradução segue diretamente a evidência original.
- issue: Referente implícito dos verbos no singular
  choice: Explicitar “o vinho” como sujeito de “perturba” e “inflama”.
  alternative: Manter uma construção sem sujeito explícito ou fazer de “alguém” o sujeito de todos os verbos.
  rationale: No grego, os verbos no singular podem retomar semanticamente o vinho ou seu consumo. A explicitação evita uma construção obscura em português e conserva a lógica de que a embriaguez provoca esses efeitos, sem atribuir agência moral autônoma ao vinho.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Evitou-se linguagem clínica ou excessivamente coloquial. A redação segue prioritariamente o grego fornecido e não reproduz a condição adicional presente na consulta inglesa.
