revisions:
- from: E sei que, por causa destas duas coisas[a], minha descendência será levada à perdição pela imoralidade sexual. Elas corromperão até mesmo homens sábios entre os meus filhos e farão diminuir o reino de Judá, que o Senhor me deu por eu ter obedecido a meu pai.
  to: E sei que, por causa destas duas coisas[a], minha descendência será destruída por causa da imoralidade sexual. Elas corromperão até mesmo homens sábios entre os meus filhos e farão diminuir o reino de Judá, que o Senhor me deu por eu ter obedecido a meu pai.
  rationale: Revisão mínima da expressão relativa à destruição da descendência, para maior naturalidade e aderência ao nexo causal expresso no grego. O restante conserva adequadamente as ambiguidades e a estrutura do texto-fonte, inclusive a referência contextual das duas coisas e a retomada delas como agentes das ações subsequentes.
