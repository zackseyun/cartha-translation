id: T12P.JUD.8.33
reference: Testament of Judah 8:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα ὅτι διὰ τὰ δύο ταῦτα ἔσται τὸ γένος μου *εἰς ἀπώλειαν πορνείας, καὶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου.'
  language: Greek
  note: 'Greek from Charles XVII.2 (α): the warning that the two vices (gold and beauty of women) will ruin Judah''s race. Project''s English at v33 is a parenetic exhortation that paraphrases this material together with the broader Canaanite-marriage warnings of Charles ch.XIV-XVII; closest α-anchor is XVII.2. Project ch.8 is a thematic consolidation; sourced from Charles ch.XVII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/033.yaml
  text: Therefore, if you do not walk in sobriety in truth and in the fear of God, you will perish through every evil deed and every plague, if you take wives from the daughters of Canaan and are joined to their wealth, being led astray by gifts.
translation:
  language: pt
  text: E sei que, por causa destas duas coisas[a], minha descendência será destruída por causa da imoralidade sexual. Elas corromperão até mesmo homens sábios entre os meus filhos e farão diminuir o reino de Judá, que o Senhor me deu por eu ter obedecido a meu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o ouro e a beleza das mulheres, mencionados no contexto.
    reason: O antecedente de «estas duas coisas» não aparece no versículo isolado, mas é necessário para a compreensão do leitor.
lexical_decisions:
- source_word: τὰ δύο ταῦτα
  choice: estas duas coisas
  rationale: Mantém a referência anafórica e genérica do grego; o contexto identifica as duas como o ouro e a beleza das mulheres.
- source_word: τὸ γένος μου
  choice: minha descendência
  rationale: No contexto, γένος se refere à linhagem ou posteridade de Judá, não apenas a uma geração específica.
- source_word: εἰς ἀπώλειαν πορνείας
  choice: será levada à perdição pela imoralidade sexual
  rationale: Expressa em português natural a relação entre πορνεία e ἀπώλεια sem reduzir πορνεία apenas à prostituição comercial.
- source_word: ἀλλοιώσουσι
  choice: corromperão
  rationale: O sentido básico é alterar ou mudar; neste contexto moral negativo, 'corromperão' comunica adequadamente a deterioração prevista.
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: farão diminuir
  rationale: Reproduz a construção causativa grega de modo claro e conserva a ideia de redução do reino.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: por eu ter obedecido a meu pai
  rationale: Torna explícita a relação instrumental ou causal da obediência de Judá ao pai, evitando a expressão portuguesa ambígua 'na obediência de meu pai'.
theological_decisions:
- issue: Agente da corrupção e da diminuição do reino
  choice: Elas, isto é, as duas coisas mencionadas
  alternative: 'Sujeito indeterminado: ''corromperão'' e ''farão diminuir'''
  rationale: A concordância e a sequência do grego favorecem a retomada das duas influências como agentes personificados, embora o sujeito não seja repetido.
- issue: Fundamento da concessão do reino
  choice: O reino foi dado a Judá em conexão com sua obediência ao pai
  alternative: A dádiva ocorreu no âmbito da obediência do próprio pai de Judá
  rationale: A leitura mais natural de πατρός μου com ὑπακοῇ entende o pai como objeto da obediência de Judá; a formulação não acrescenta uma doutrina sobre mérito além do que o texto afirma.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com preferência por 'descendência' em vez de 'raça' e por 'imoralidade sexual' em vez do termo mais estreito ou arcaizante 'fornicação'. A tradução segue o grego fornecido, não a consolidação parenética mais ampla da camada inglesa.
