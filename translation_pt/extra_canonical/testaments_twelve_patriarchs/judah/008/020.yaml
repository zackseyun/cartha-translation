id: T12P.JUD.8.20
reference: Testament of Judah 8:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Πιὼν τὸν οἶνον οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ, καὶ ἔλαβον γυναῖκα Χαναναίαν. 7. Πολλὴ γὰρ τῷ πίνοντι οἶνον, τέκνα μου,
  language: Greek
  note: Greek from Charles XIV.6-7a (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/020.yaml
  text: After I had drunk wine, I did not respect the commandment of God, and I took a woman of Canaan as wife. For much discretion is needed by the man who drinks wine, my children.
translation:
  language: pt
  text: Depois de beber vinho, não respeitei o mandamento de Deus e tomei por esposa uma mulher cananeia. Pois quem bebe vinho precisa de muita prudência, meus filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego desta última frase é elíptico: literalmente, “Pois muita [—] para quem bebe vinho, meus filhos”. “Prudência” é suprido conforme o sentido provável do contexto.'
    reason: Assinalar ao leitor que um substantivo ou conceito necessário ao sentido não está expresso no texto grego preservado.
lexical_decisions:
- source_word: Πιὼν τὸν οἶνον
  choice: Depois de beber vinho
  rationale: O particípio aoristo expressa uma ação anterior à principal; a formulação é natural e mantém a relação temporal.
- source_word: οὐκ ᾐσχύνθην
  choice: não respeitei
  rationale: Embora o verbo costume significar “envergonhar-se”, com “o mandamento” o sentido contextual é não demonstrar consideração ou reverência. “Não respeitei” preserva o sentido sem produzir uma construção artificial.
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: tomei por esposa uma mulher cananeia
  rationale: Mantém de perto a expressão semítica refletida no grego e esclarece que se trata de casamento.
- source_word: Πολλὴ γὰρ τῷ πίνοντι οἶνον
  choice: Pois quem bebe vinho precisa de muita prudência
  rationale: O texto grego transmitido parece elíptico, literalmente “pois muita [algo] para quem bebe vinho”. A consulta inglesa supre “discrição”; “prudência” comunica naturalmente a cautela exigida pelo contexto, sem afirmar que a palavra esteja explicitamente preservada no grego.
theological_decisions:
- issue: Natureza do pecado ao tomar uma mulher cananeia
  choice: Conservar a afirmação como transgressão do mandamento de Deus, sem explicar qual mandamento está em vista
  alternative: Identificar explicitamente uma proibição mosaica ou patriarcal de casamento misto
  rationale: O texto atribui o ato a uma violação do mandamento divino, mas não identifica sua formulação ou contexto legal; uma explicação denominacional ou harmonizadora seria importada.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Mulher cananeia” preserva a identificação étnica do original; “tomei por esposa” evita a ambiguidade moderna de simplesmente “tomei uma mulher”. O vocativo “meus filhos” mantém o tom exortativo testamentário.
