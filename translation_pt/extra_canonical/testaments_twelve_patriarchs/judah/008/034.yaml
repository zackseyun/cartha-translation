source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:34 ('after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him') has no direct α-counterpart in Charles VIII-XXVI. The 'contend against Levi' / 'angel guides Levi' theme is the project's homiletic bridge between the wine-warning section and the Levi/Judah priesthood-vs-kingship discourse of Charles XXI; the α-text moves directly from Judah's Canaanite-marriage shame (XIX-XX) to the 'love Levi' command at XXI.1 without the lawlessness-prediction the project English supplies. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/034.yaml
  text: For I know that after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him and me the spirit of deceit has misled.
translation:
  language: pt
  text: Pois sei que, depois da minha morte, vocês agirão contra a lei e entrarão em conflito com Levi, mas não conseguirão prevalecer contra ele, porque o anjo do Senhor o guia, enquanto a mim o espírito do engano desviou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não possui correspondente direto no texto grego α de Charles indicado para esta passagem. Seu conteúdo é uma ponte homilética do projeto entre a advertência sobre o vinho e o discurso posterior acerca de Levi e Judá; portanto, a redação aqui traduz a camada inglesa do projeto, não um original grego preservado neste testemunho.
    reason: Informar com clareza que não há base grega direta para a redação do versículo e evitar atribuir ao testemunho α palavras que ele não contém.
lexical_decisions:
- source_word: act lawlessly (formulação preservada apenas na camada inglesa do projeto)
  choice: agirão contra a lei
  rationale: Expressa de modo claro e atual a ideia de conduta contrária à lei, sem especificar uma lei ou transgressão que a tradição textual disponível não identifica.
- source_word: contend against Levi (formulação preservada apenas na camada inglesa do projeto)
  choice: entrarão em conflito com Levi
  rationale: Mantém a amplitude de “contend”, que pode envolver oposição ou luta, sem necessariamente sugerir combate físico.
- source_word: prevail against him (formulação preservada apenas na camada inglesa do projeto)
  choice: prevalecer contra ele
  rationale: Conserva o tom solene e a ideia de não conseguir superar ou derrotar Levi.
- source_word: spirit of deceit (formulação preservada apenas na camada inglesa do projeto)
  choice: espírito do engano
  rationale: Tradução formal que preserva a possível ambiguidade entre uma força espiritual personificada e uma disposição enganadora.
theological_decisions:
- issue: Contraste entre a orientação de Levi e o desvio de Judá
  choice: “o anjo do Senhor o guia, enquanto a mim o espírito do engano desviou”
  alternative: “o anjo do Senhor guia a ele, e a mim o espírito do engano desencaminhou”
  rationale: “Enquanto” torna inteligível o contraste já presente na formulação inglesa, sem explicar a identidade ou natureza do anjo e do espírito.
- issue: Ausência de correspondente direto no testemunho grego α fornecido
  choice: Manter o conteúdo da camada inglesa do projeto e assinalar sua situação textual em nota
  alternative: Omitir o versículo por falta de texto grego direto
  rationale: O registro do projeto requer este versículo, mas a transparência editorial exige não apresentá-lo como tradução direta do trecho grego fornecido.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês” para ampla legibilidade brasileira. A construção mantém o tom testamentário e não resolve a ambiguidade de “espírito do engano”. A nota registra explicitamente a natureza secundária e homilética da formulação.
