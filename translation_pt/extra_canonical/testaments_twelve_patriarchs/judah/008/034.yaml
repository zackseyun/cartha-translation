  source_fidelity: 'Não há correspondente grego α direto para este versículo no testemunho indicado; portanto, a fidelidade verificável é à camada ინგლისa do projeto, como a nota reconhece expressamente. A tradução preserva todos os elementos da redação inglesa: a previsão após a morte, a conduta contrária à lei, o conflito com Levi, a incapacidade de prevalecer, a orientação angélica de Levi e o desvio de Judá pelo espírito do engano.'
  naturalness: O português é moderno, claro e adequadamente solene. “Vocês”, “entrarão em conflito” e “não conseguirão prevalecer” são naturais e preservam o registro testamentário. A construção contrastiva “enquanto a mim o espírito do engano desviou” é compreensível e condiz com o tom do texto.
  terminology: “Anjo do Senhor”, “Levi” e “espírito do engano” são escolhas consistentes e não impõem interpretação doutrinária. “Agirão contra a lei” transmite de modo claro a ideia inglesa de “act lawlessly”, sem acrescentar uma identificação da lei. A âncora [a] está corretamente posicionada ao fim da afirmação cuja condição textual ela explica.
