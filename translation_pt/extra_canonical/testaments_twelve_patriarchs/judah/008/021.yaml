  text: καὶ αὕτη ἐστὶν ἡ σύνεσις τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ, πίνει.
  language: Greek
  note: Greek from Charles XIV.7b (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/021.yaml
  text: 'And this is the discretion in drinking wine: if a man drinks wine and keeps modesty, and if he does not go astray into shamelessness, he may drink wine.'
translation:
  language: pt
  text: 'E este é o discernimento ao beber vinho: enquanto conservar o pudor, pode beber.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto tiver senso de vergonha, bebe”. O texto grego é muito conciso; o presente “bebe” pode ser entendido aqui em sentido permissivo.'
    reason: Registra a concisão do grego e a possibilidade de traduzir πίνει de maneira mais estritamente declarativa, sem converter o verbo em imperativo.
lexical_decisions:
- source_word: σύνεσις
  choice: discernimento
  rationale: Expressa compreensão prática e bom senso no modo de beber, com naturalidade em português.
- source_word: οἰνοποσίας
  choice: consumo de vinho
  rationale: Traduz o ato ou prática de beber vinho sem introduzir a ideia específica de embriaguez.
- source_word: αἰδῶ
  choice: pudor
  rationale: Preserva o campo semântico de recato, vergonha moral e domínio diante do comportamento desonroso.
- source_word: πίνει
  choice: beba
  rationale: O presente grego pode funcionar como permissão ou orientação no contexto; o imperativo português conciso preserva essa força sem acrescentar condições ausentes.
theological_decisions:
- issue: Permissão condicionada para beber vinho
  choice: 'Manter a formulação breve: “enquanto mantiver o pudor, beba”'
  alternative: 'Expandir como no inglês: “se beber e conservar a modéstia... poderá beber vinho”'
  rationale: O grego fornecido é conciso e condiciona o beber à permanência do pudor. A tradução não acrescenta a cláusula explícita sobre desviar-se para a falta de vergonha, presente na camada inglesa mas não nesta forma do texto grego.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. “Quanto ao consumo de vinho” evita uma construção excessivamente literal, e “pudor” conserva o contraste moral implícito no grego.
