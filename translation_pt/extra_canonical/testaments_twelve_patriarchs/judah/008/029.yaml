source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος, καὶ συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις, *τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ, καὶ καταδαπανᾷ τὰς σάρκας αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/029.yaml
  text: They deprive his soul of every goodness and oppress him with toils and troubles, and drive sleep away from him and devour his flesh.
translation:
  language: pt
  text: Isso priva a alma dele de todo bem, oprime-o com dores e fadigas, afasta dele o sono e consome sua carne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: priva
  rationale: Reproduz diretamente a ideia de tirar ou despojar alguém de algo; o singular grego foi preservado por meio do sujeito neutro contextual «Isso».
- source_word: πάσης ἀγαθότητος
  choice: de todo bem
  rationale: Expressão natural e abrangente em português, sem restringir ἀγαθότης apenas à virtude moral ou à prosperidade.
- source_word: συνέχει
  choice: mantém-no preso
  rationale: Comunica a ideia de conter, apertar ou oprimir, conservando a imagem de alguém dominado por trabalhos penosos.
- source_word: πόνοις καὶ μόχθοις
  choice: a trabalhos e fadigas
  rationale: 'Mantém os dois termos coordenados: πόνοις aponta para labores ou sofrimentos, e μόχθοις para esforço extenuante.'
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: afugenta dele o sono
  rationale: Verte idiomaticamente uma construção grega incomum cujo sentido contextual é afastar ou expulsar o sono.
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: consome sua carne
  rationale: Preserva a força de καταδαπανάω, «consumir por completo», usando o singular coletivo natural em português para σάρκας.
theological_decisions:
- issue: Número do agente que causa a privação e o sofrimento
  choice: Isso, no singular
  alternative: Eles, no plural
  rationale: O texto grego fornecido emprega verbos no singular (Στερίσκει, συνέχει, ἐκδιδάσκει, καταδαπανᾷ). Como o antecedente não aparece neste excerto, «Isso» preserva o número sem identificar ou personificar indevidamente o agente; o plural da camada inglesa não foi seguido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo e a intensidade do grego, evitando arcaísmos e sem acrescentar uma identificação teológica não expressa no excerto.
