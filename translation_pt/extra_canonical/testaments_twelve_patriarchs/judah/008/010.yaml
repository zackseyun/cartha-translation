source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ὡς συνήλθον αὐτῇ συνελήφθη. 5. Ἀγνοῶν δὲ ἐγὼ ὃ ἐποίησα,'
  language: Greek
  note: 'Greek from Charles XII.4c-5a (α): the union and Judah''s unawareness. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/010.yaml
  text: So I gave them to her and went in to her, and she conceived by me. And because of the wine I did not perceive what I had done; neither did I recognize her when I went away.
translation:
  language: pt
  text: E, quando me uni a ela, ela ficou grávida. Eu, porém, não sabia o que tinha feito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήλθον αὐτῇ
  choice: me uni a ela
  rationale: Expressa de modo natural e digno o eufemismo grego para relação sexual, sem acrescentar detalhes ausentes do texto-fonte.
- source_word: συνελήφθη
  choice: ela ficou grávida
  rationale: No contexto, o verbo passivo indica concepção; esta formulação é clara em português corrente.
- source_word: Ἀγνοῶν
  choice: não sabia
  rationale: Preserva a afirmação de desconhecimento de Judá sem especificar uma causa que este trecho grego não apresenta.
- source_word: ὃ ἐποίησα
  choice: o que tinha feito
  rationale: Mantém a referência deliberadamente geral do original e a relação temporal anterior ao desconhecimento.
theological_decisions:
- issue: Causa do desconhecimento de Judá
  choice: Não explicitar que foi por causa do vinho
  alternative: “Por causa do vinho, não percebi o que tinha feito”
  rationale: O fragmento grego fornecido afirma apenas que Judá não sabia o que havia feito; atribuir isso ao vinho dependeria de contexto ou tradição textual não incluídos neste segmento.
- issue: Reconhecimento da mulher ao partir
  choice: Não incluir essa afirmação
  alternative: “nem a reconheci quando fui embora”
  rationale: Essa informação consta da camada inglesa, mas não aparece no texto grego fornecido; a tradução prioriza a evidência original deste recorte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O paralelismo foi preservado em duas orações, e o eufemismo sexual do grego foi traduzido sem vulgaridade nem obscurecimento excessivo.
