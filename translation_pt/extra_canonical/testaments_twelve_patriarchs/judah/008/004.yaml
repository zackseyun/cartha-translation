base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/004.yaml
  text: And after these things, while Tamar was a widow, and after two years had passed, there was reported to me that she was going up to shear sheep at Timnah. And I also went to shear my sheep.
translation:
  language: pt
  text: Depois dessas coisas, passados dois anos enquanto Tamar vivia como viúva, ela ouviu que eu estava subindo para tosquiar as ovelhas,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης
  choice: enquanto Tamar vivia como viúva
  rationale: Expressa o estado continuado indicado pelo particípio grego, sem acrescentar a ideia de novo casamento ou de luto formal.
- source_word: μετὰ ἔτη δύο
  choice: passados dois anos
  rationale: Forma natural em português para indicar o intervalo de dois anos.
- source_word: ἀκούσασα
  choice: ela ouviu
  rationale: O particípio feminino singular retoma Tamar como quem recebeu a notícia.
- source_word: ἀνέρχομαι
  choice: eu estava subindo
  rationale: Preserva a primeira pessoa do singular e o aspecto de ação em curso no discurso comunicado.
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: para tosquiar as ovelhas
  rationale: Reproduz de modo claro a finalidade da subida.
