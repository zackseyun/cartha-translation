base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/001.yaml
  text: And while I was there, Barshaba, the king of Adullam, entertained us and made a drinking feast for us; and when he urged me, he gave me his daughter, whose name was Shua, as a wife.
translation:
  language: pt
  text: Enquanto eu estava ali, Barsabá, rei de Adulão, veio e preparou para nós um banquete regado a bebida. Depois de insistir comigo[a], deu-me por mulher sua filha, chamada Sabá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta expressão apresenta incerteza; também pode ter o sentido de “depois de me encorajar” ou “depois de me persuadir”.
    reason: O sinal crítico na edição indica dificuldade textual em παρακαλέσας, cujo campo semântico permite mais de uma nuance neste contexto.
lexical_decisions:
- source_word: Πρὸς ὃν ἐλθὼν ἤμην
  choice: Enquanto eu estava ali
  rationale: A construção grega é pouco natural e parece textualmente difícil; a formulação expressa de modo claro a circunstância de Judá ter chegado e permanecido naquele lugar, sem introduzir uma ação adicional não assegurada pelo texto.
- source_word: Βαρσαβὰ
  choice: Barsabá
  rationale: Transliteração portuguesa direta do nome grego, distinguindo-o do nome da filha.
- source_word: βασιλεὺς Ὀδολλὰμ
  choice: rei de Adulão
  rationale: Mantém o título e emprega a forma portuguesa tradicional e reconhecível do topônimo bíblico.
- source_word: ἐποίησεν ἡμῖν πότον
  choice: preparou para nós um banquete com bebida
  rationale: πότος designa uma ocasião de beber ou um festim regado a bebida; esta formulação evita o sentido estreito de simplesmente oferecer uma bebida e representa explicitamente ἡμῖν.
- source_word: παρακαλέσας
  choice: depois de insistir comigo
  rationale: No contexto da oferta da filha em casamento, o particípio indica apelo ou insistência; o complemento 'comigo' torna natural em português a relação já implícita na sequência.
- source_word: Σαβά
  choice: Sabá
  rationale: Segue a forma nominal atestada no texto grego fornecido, em vez de substituí-la silenciosamente pela forma 'Sua' conhecida de Gênesis.
- source_word: εἰς γυναῖκα
  choice: por mulher
  rationale: Expressão portuguesa digna e corrente no registro bíblico para indicar que ela lhe foi dada em casamento.
