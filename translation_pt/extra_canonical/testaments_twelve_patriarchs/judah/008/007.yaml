  text: And I turned aside to her and said, "Let me go in to you." And she said, "What will you give me, that you may come in to me?"
translation:
  language: pt
  text: 'Então me voltei para ela e disse: “Entrarei até você.” E ela perguntou: “O que você me dará?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: me desviei para junto dela
  rationale: Preserva o sentido concreto de mudar de direção e aproximar-se dela, sem explicitar além do grego o propósito sexual.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Entrarei até você
  rationale: Mantém o eufemismo sexual e a forma verbal direta do grego, em linguagem compreensível e digna.
- source_word: Τί μοι δώσεις;
  choice: O que você me dará?
  rationale: Traduz literalmente a pergunta breve do texto grego, sem acrescentar a oração explicativa presente na camada inglesa.
