id: T12P.JUD.8.23
reference: Testament of Judah 8:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται. 2. Κἂν γάρ τις *βασιλεὺς ἐστι καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας, δουλεύσας τῇ πορνείᾳ ὡς κἀγὼ ἔπαθον.
  language: Greek
  note: Greek from Charles XV.1-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/023.yaml
  text: One who commits sexual immorality does not know when he suffers loss, and he is not ashamed when dishonored. For even if a man is a king and commits sexual immorality, he is stripped of his kingship by becoming a slave to sexual immorality, as I myself also suffered.
translation:
  language: pt
  text: Quem pratica imoralidade sexual não percebe que está sendo despojado e não se envergonha quando é desonrado. Pois, ainda que alguém seja rei, se pratica imoralidade sexual, é despojado da realeza, tornando-se escravo da imoralidade sexual, como eu mesmo sofri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας / πορνεύῃ
  choice: Quem pratica imoralidade sexual / se pratica imoralidade sexual
  rationale: Expressa πορνεύω em linguagem atual e abrangente, sem restringi-lo indevidamente a um ato sexual específico.
- source_word: γυμνούμενος / γυμνοῦται
  choice: está sendo despojado / é despojado
  rationale: Preserva a imagem de ser despido ou privado de algo; no segundo caso, o complemento explícito «da realeza» esclarece a perda.
- source_word: ἀδοξῶν
  choice: quando é desonrado
  rationale: Reproduz a ideia de perda de honra ou reputação e mantém o paralelismo com «não se envergonha».
- source_word: τῆς βασιλείας
  choice: da realeza
  rationale: Refere-se à condição e dignidade régias, não necessariamente ao território governado.
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: tornando-se escravo da imoralidade sexual
  rationale: Conserva a metáfora forte de escravidão e a relação causal ou modal do particípio.
- source_word: ὡς κἀγὼ ἔπαθον
  choice: como eu mesmo sofri
  rationale: Mantém o testemunho pessoal e o sentido amplo de padecer ou experimentar esse dano.
theological_decisions:
- issue: Relação entre imoralidade sexual, perda da realeza e escravidão
  choice: Manter a sequência metafórica do grego sem convertê-la em formulação doutrinária
  alternative: Explicitar que o pecado necessariamente remove um cargo político ou implica uma condição espiritual específica
  rationale: O texto apresenta uma advertência moral por meio das imagens de despojamento e escravidão; não define de modo técnico todas as implicações teológicas ou políticas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «imoralidade sexual» foi preservada para refletir a insistência lexical do original. «Realeza» evita confundir a dignidade ou condição régia com um reino territorial.
