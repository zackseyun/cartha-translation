source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν, τέκνα μου, παραγγέλλω ὑμῖν, ἀγαπᾶτε τὸν Λευὶ, ἵνα διαμείνητε, καὶ μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν, ἵνα μὴ ἐξολοθρευθῆτε.
  language: Greek
  note: Greek from Charles XXI.1 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/035.yaml
  text: And now I command you to love Levi, that you may live, and do not exalt yourselves against him, lest you be utterly destroyed.
translation:
  language: pt
  text: 'E agora, meus filhos, ordeno a vocês: amem Levi, para que permaneçam; e não se enalteçam contra ele, para que não sejam completamente destruídos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: ordeno
  rationale: Expressa uma ordem solene e direta, adequada à exortação paterna do contexto.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: Traduz diretamente o imperativo presente, em linguagem natural e atual.
- source_word: διαμείνητε
  choice: continuem vivos
  rationale: O verbo significa permanecer ou continuar; neste contexto, o complemento implícito é a preservação da vida, como reconhece a tradição de tradução, sem reduzir a ideia ao simples verbo 'viver'.
- source_word: ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: se ergam contra ele
  rationale: Preserva tanto a noção de exaltação arrogante quanto a postura de oposição dirigida contra Levi.
- source_word: ἐξολοθρευθῆτε
  choice: sejam completamente destruídos
  rationale: Reproduz a força intensiva do verbo, que indica destruição total ou extermínio.
theological_decisions:
- issue: Relação entre a honra devida a Levi e a sobrevivência dos descendentes de Judá
  choice: Manter a ligação condicional explícita sem explicá-la teologicamente
  alternative: Interpretar a ordem como submissão permanente ao sacerdócio levítico
  rationale: O grego associa amar Levi e não se erguer contra ele à preservação, mas não define aqui o alcance institucional ou teológico dessa relação.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos claros. A construção 'para que continuem vivos' comunica o valor contextual de διαμείνητε, enquanto 'se ergam contra ele' conserva a imagem e a ambiguidade entre orgulho e oposição.
