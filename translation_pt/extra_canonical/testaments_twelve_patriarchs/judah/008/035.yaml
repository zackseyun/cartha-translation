review_pass:
  verdict: revise
  source_fidelity: O texto reproduz corretamente a exortação, a referência a Levi e a advertência final. Contudo, «continuem vivos» explicita indevidamente uma ideia de sobrevivência que não está expressa em διαμείνητε, cujo sentido básico é «permanecer/continuar»; convém conservar essa abertura semântica. «Se ergam contra ele» comunica oposição, mas atenua a ideia reflexiva de enaltecer-se/exaltar-se contra Levi.
  naturalness: A redação é clara e atual. «Permaneçam» e «não se enalteçam contra ele» soam naturais em registro solene moderno e refletem mais de perto a construção grega.
  terminology: «Ordeno», «amem», «Levi» e «sejam completamente destruídos» são adequados. «Completamente destruídos» preserva de modo satisfatório a força intensiva de ἐξολοθρευθῆτε.
  issues:
  - severity: medium
    issue: «continuem vivos» para διαμείνητε
    rationale: A expressão introduz «vivos», que o grego não diz. Embora o contexto possa sugerir preservação, διαμείνητε permite «permaneçam» ou «continuem», sem especificar o âmbito.
  - severity: low
    issue: «não se ergam contra ele» para μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
    rationale: A formulação transmite oposição, mas não preserva tão claramente o matiz de autoexaltação/orgulho do verbo. «Não se enalteçam contra ele» mantém ambos os aspectos.
