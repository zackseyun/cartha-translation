review_pass:
  verdict: revise
  source_fidelity: O texto português preserva as cláusulas presentes no grego α, inclusive a aproximação cultual, a participação à mesa, a oferta das primícias e a realeza de Jacó. Corretamente não importa o acréscimo inglês «como um leão», ausente desta fonte. Ajusta-se apenas a expressão comparativa ὑπὲρ σέ para uma formulação portuguesa mais idiomática que mantém a preferência na escolha.
  naturalness: A construção «escolheu a ele, acima de você» é compreensível, mas marcada e pouco natural em português moderno. «Escolheu-o em vez de você» expressa claramente a preferência comparativa sem sugerir uma precedência meramente cronológica. O deslocamento da chamada de nota para depois da palavra também melhora a apresentação tipográfica.
  terminology: «Senhor», «primícias», «mesa», «rei de Jacó» e a explicitação em nota de Levi são adequados. «Iguarias» é uma solução aceitável para ἐντρυφημάτων e preserva o campo de alimentos aprazíveis/valiosos sem estreitar o termo a uma categoria técnica.
  issues:
  - severity: low
    issue: Formulação pouco idiomática de ὑπὲρ σέ
    rationale: «Acima de você» pode conservar a imagem de superioridade, mas, nessa construção com «escolheu», soa calcado e é menos claro do que uma expressão de preferência eletiva.
  - severity: low
    issue: Posicionamento da chamada de nota
    rationale: «ele[a]» prejudica a legibilidade; a chamada deve seguir a palavra ou a expressão anotada.
