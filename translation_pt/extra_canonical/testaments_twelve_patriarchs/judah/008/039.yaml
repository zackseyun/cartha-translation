id: T12P.JUD.8.39
reference: Testament of Judah 8:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ γὰρ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ.
  language: Greek
  note: Greek from Charles XXI.5 (α). The project English's closing simile 'as a lion' (ὡς λέων) does not appear in α here; α has only 'βασιλεὺς Ἰακὼβ' ('king of Jacob'). The lion image draws on the broader testamentary tradition (cf. apocalyptic 'lion' imagery in ch.XXIV-XXV). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/039.yaml
  text: For the angel of the Lord said to me, "The Lord chose Levi before you, to be near him, and for you to be king with him, as a lion."
translation:
  language: pt
  text: 'Pois o anjo do Senhor me disse: “O Senhor escolheu-o[a] em vez de você, para se aproximar dele, comer à sua mesa e lhe oferecer as primícias das iguarias dos filhos de Israel. Você, porém, será rei de Jacó.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Levi, conforme o contexto.
    reason: Esclarece o referente do pronome sem substituir a formulação grega no texto principal.
  - marker: b
    text: A versão grega α termina com “rei de Jacó”; não traz aqui a expressão “como um leão”.
    reason: Registra uma diferença relevante entre a fonte grega indicada e a formulação inglesa temática do projeto.
lexical_decisions:
- source_word: Αὐτόν
  choice: a ele
  rationale: Mantém o pronome do texto grego; o contexto mais amplo o associa a Levi, sem inserir explicitamente o nome no corpo do versículo.
- source_word: ὑπὲρ σέ
  choice: acima de você
  rationale: Expressa a ideia comparativa de preferência ou precedência hierárquica, evitando o sentido meramente temporal que “antes de você” poderia sugerir.
- source_word: προσεγγίζειν αὐτῷ
  choice: para se aproximar dele
  rationale: Reproduz de modo natural a linguagem de aproximação à presença do Senhor, preservando sua possível dimensão cultual.
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: comer à sua mesa
  rationale: Traduz a expressão idiomaticamente em português sem perder a imagem de participação à mesa do Senhor.
- source_word: ἀπαρχὰς ... ἐντρυφημάτων
  choice: as primícias das iguarias
  rationale: “Primícias” preserva o termo cultual, enquanto “iguarias” comunica alimentos valiosos ou deleitáveis sem restringir indevidamente seu sentido.
- source_word: βασιλεὺς Ἰακώβ
  choice: rei de Jacó
  rationale: Segue de perto a construção grega e conserva “Jacó” como designação corporativa do povo.
theological_decisions:
- issue: Identidade daquele que foi escolhido
  choice: Manter “a ele” no texto e esclarecer Levi em nota
  alternative: Inserir “Levi” diretamente no texto
  rationale: O grego desta forma textual usa pronome, embora o contexto identifique Levi. A solução preserva a forma da fonte sem deixar o leitor desamparado.
- issue: Relação entre a eleição sacerdotal e a realeza de Judá
  choice: Conservar as duas afirmações em contraste, sem harmonizá-las
  alternative: Resumir como governo conjunto de Levi e Judá
  rationale: O texto distingue a aproximação cultual concedida ao outro personagem da realeza prometida a Judá; não afirma explicitamente que ambos reinariam juntos.
- issue: Imagem do leão no encerramento
  choice: Não incluir “como um leão” no texto
  alternative: Acrescentar “como um leão”, seguindo a adaptação inglesa do projeto
  rationale: A expressão ὡς λέων não aparece aqui na versão grega α fornecida; incluí-la confundiria tradição temática mais ampla com o texto desta testemunha.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe mantém o contraste solene entre a função cultual de Levi e a realeza de Judá, sem arcaísmos desnecessários.
