id: T12P.JUD.8.32
reference: Testament of Judah 8:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τέκνα μου, ἡ φιλαργυρία πρὸς εἰδωλολατρίαν ὁδηγεῖ, ὅτι ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
  note: 'Greek from Charles XIX.1 (α): love of money leads to idolatry. The project English compresses this with a ''wine to immorality'' summary that recapitulates ch.XIV; the wine half is implicit, the φιλαργυρία/εἰδωλολατρία half is α XIX.1. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIX.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/032.yaml
  text: My children, I have shown you that wine leads to sexual immorality, and the love of money to idolatry; and these things turn the mind away from the law of God.
translation:
  language: pt
  text: Meus filhos, o amor ao dinheiro leva à idolatria, pois, iludidos pelo dinheiro, chamam deuses aos que não são deuses; e esse amor faz quem o abriga perder o juízo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cair num estado de desvario”. O termo grego descreve alguém que sai de seu estado mental normal; aqui não tem necessariamente o sentido positivo que “êxtase” costuma ter hoje.'
    reason: Preserva a amplitude semântica de ἔκστασις e informa uma alternativa mais formal sem tornar o texto principal obscuro.
lexical_decisions:
- source_word: φιλαργυρία
  choice: amor ao dinheiro
  rationale: Expressa de modo claro e corrente o apego ou amor desordenado ao dinheiro, sem restringir o sentido à prata.
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: leva à idolatria
  rationale: Reproduz diretamente a relação de condução indicada pelo grego.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: iludidos pelo dinheiro
  rationale: Entende πλάνη como engano ou ilusão produzida pelo dinheiro e oferece uma formulação natural em português.
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  choice: chamam deuses aos que não são deuses
  rationale: Mantém a afirmação enfática e a tensão teológica do original sem explicá-la além do texto.
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: perder o juízo
  rationale: Comunica em linguagem atual a saída de si, perturbação ou desvario sugeridos por ἔκστασις no contexto, sem empregar o moderno sentido positivo de 'êxtase'.
theological_decisions:
- issue: Conteúdo adicional da camada inglesa
  choice: Traduzir somente a advertência grega sobre o amor ao dinheiro e a idolatria
  alternative: Incluir que o vinho leva à imoralidade sexual e que essas coisas afastam a mente da lei de Deus
  rationale: Essas duas afirmações da redação inglesa não estão presentes neste texto grego; acrescentá-las apagaria a distinção entre a fonte primária e a consolidação temática inglesa.
- issue: Referente do sujeito em ποιεῖ
  choice: Explicitar como 'esse amor'
  alternative: Traduzir apenas por 'isso' ou fazê-lo referir-se genericamente às práticas anteriores
  rationale: O pronome αὐτήν retoma naturalmente φιλαργυρία, o amor ao dinheiro, e a explicitação evita ambiguidade artificial em português.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A tradução segue prioritariamente o texto grego fornecido e não incorpora as expansões temáticas da camada inglesa.
