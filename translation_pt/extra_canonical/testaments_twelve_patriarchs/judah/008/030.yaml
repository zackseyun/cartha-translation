id: T12P.JUD.8.30
reference: Testament of Judah 8:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Θυσίας Θεοῦ ἐμποδίζει, *καὶ εὐλογίαν Θεοῦ οὐ μνημονεύει. *Προφήτου λαλοῦντος οὐκ ἀκούει, καὶ λόγους εὐσεβείας προσοχθίζει.'
  language: Greek
  note: Greek from Charles XVIII.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/030.yaml
  text: And he is hindered from offering sacrifices to God; and he does not remember blessing God; and when he hears a prophet speaking, he is offended and angered.
translation:
  language: pt
  text: Impede que se ofereçam sacrifícios a Deus; não se lembra de bendizer a Deus; não escuta quando um profeta fala e se irrita com palavras de piedade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ ἐμποδίζει
  choice: Impede que se ofereçam sacrifícios a Deus
  rationale: O grego traz o verbo na voz ativa, «impede», e não a construção passiva da camada inglesa. A formulação explicita de modo natural que os sacrifícios são oferecidos a Deus, sem acrescentar quem os oferece.
- source_word: εὐλογίαν Θεοῦ οὐ μνημονεύει
  choice: não se lembra de bendizer a Deus
  rationale: No contexto da conduta do agente, entende-se εὐλογία como o ato de louvar ou bendizer a Deus. «Bendizer» mantém o tom religioso e é compreensível em português atual.
- source_word: Προφήτου λαλοῦντος οὐκ ἀκούει
  choice: não escuta quando um profeta fala
  rationale: Reproduz com clareza a construção de genitivo absoluto e preserva a ideia de recusa em dar ouvidos, sem ampliar para mera audição física.
- source_word: λόγους εὐσεβείας προσοχθίζει
  choice: se irrita com palavras de piedade
  rationale: προσοχθίζει expressa irritação ou indignação; «se irrita» é direto e não acrescenta a dupla reação «ofendido e irado» da camada inglesa. εὐσέβεια é vertida por «piedade», no sentido de devoção reverente.
theological_decisions:
- issue: Relação entre os sacrifícios e Deus no genitivo Θυσίας Θεοῦ
  choice: sacrifícios a Deus
  alternative: sacrifícios de Deus
  rationale: Embora o genitivo grego seja formalmente amplo, o sentido cultual mais natural é o de sacrifícios oferecidos a Deus. «De Deus» em português poderia sugerir que Deus é quem os oferece ou que são sua propriedade, obscurecendo a ação descrita.
- issue: Sentido de εὐλογίαν Θεοῦ
  choice: bendizer a Deus
  alternative: lembrar-se da bênção de Deus
  rationale: A expressão admite mais de uma relação genitiva, mas a sequência de atos religiosos — sacrifícios, bênção/louvor, escuta profética e palavras piedosas — favorece o ato humano de bendizer a Deus. A tradução evita linguagem denominacional específica.
translation_notes:
  register: Português moderno, claro e digno, com coordenação rítmica próxima do grego. O sujeito permanece implícito, como no trecho fornecido, para não inserir uma identificação ausente neste versículo.
