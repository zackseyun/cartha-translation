id: T12P.JUD.8.22
reference: Testament of Judah 8:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ τὸν ὅρον, ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι τῇ ἀτιμίᾳ καὶ νομίζειν εἶναι καλόν.
  language: Greek
  note: Greek from Charles XIV.8 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/022.yaml
  text: But if he goes beyond the limit, the spirit of deceit attacks his mind and makes the drunkard speak obscenities and transgress, and not be ashamed, but even boast in his disgrace and count it glory.
translation:
  language: pt
  text: Mas, se ele ultrapassar o limite, o espírito do engano irrompe em sua mente e faz o bêbado dizer obscenidades e transgredir, sem sentir vergonha; pelo contrário, ele se gloria em sua desonra e a considera algo bom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: ultrapassar o limite
  rationale: Preserva a imagem de cruzar um limite, com formulação natural em português.
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: lança-se sobre a mente dele
  rationale: Expressa a ação invasiva do espírito sobre a mente sem reduzir o verbo a uma noção meramente abstrata.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: o espírito do engano
  rationale: Mantém a construção genitiva e a possível referência a uma força espiritual pessoal, sem resolver sua natureza.
- source_word: αἰσχρορρημονεῖν
  choice: dizer obscenidades
  rationale: Comunica de modo claro a ideia de falar coisas vergonhosas ou indecentes.
- source_word: παρανομεῖν
  choice: transgredir
  rationale: Preserva a dimensão de agir contra a lei ou norma, sem especificar uma infração não indicada pelo texto.
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: gloria em sua desonra
  rationale: Reproduz o contraste moral entre vanglória e desonra.
- source_word: νομίζειν εἶναι καλόν
  choice: a considera algo bom
  rationale: Segue o grego, que diz literalmente que ele julga a desonra como boa; evita a leitura inglesa mais interpretativa, 'glória'.
theological_decisions:
- issue: Natureza do 'espírito do engano'
  choice: Manter a expressão pessoal e ambígua 'o espírito do engano'
  alternative: Traduzir como 'uma disposição enganosa' ou 'o espírito do erro'
  rationale: O grego permite uma leitura espiritual pessoal, mas o verso não define sua ontologia; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação explicita a progressão do estado de embriaguez para a falta de vergonha e a inversão moral final.
