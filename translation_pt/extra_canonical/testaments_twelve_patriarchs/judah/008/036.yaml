id: T12P.JUD.8.36
reference: Testament of Judah 8:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐμοὶ γὰρ ἔδωκεν ὁ Θεὸς τὴν βασιλείαν, κἀκείνῳ τὴν ἱερατείαν, καὶ ὑπέταξε τὴν βασιλείαν τῇ ἱερωσύνῃ.
  language: Greek
  note: Greek from Charles XXI.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/036.yaml
  text: For to me the Lord gave the kingship, and to him the priesthood; and he set the kingdom under the priesthood.
translation:
  language: pt
  text: Pois a mim Deus deu a realeza, e a ele, o sacerdócio; e submeteu a realeza ao sacerdócio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεός
  choice: Deus
  rationale: Traduz diretamente o substantivo grego; evita seguir a camada inglesa, que traz “the Lord” sem apoio nesta forma do texto grego.
- source_word: τὴν βασιλείαν
  choice: a realeza
  rationale: Neste paralelismo com “sacerdócio”, refere-se à dignidade ou autoridade régia concedida a Judá; “realeza” preserva melhor esse sentido do que “reino” na primeira ocorrência.
- source_word: τὴν ἱερατείαν / τῇ ἱερωσύνῃ
  choice: o sacerdócio / ao sacerdócio
  rationale: Os dois termos gregos designam aqui a função ou instituição sacerdotal; a repetição de “sacerdócio” produz clareza natural em português.
- source_word: ὑπέταξε
  choice: submeteu
  rationale: Reproduz a relação explícita de subordinação expressa pelo verbo grego sem atenuá-la nem explicá-la teologicamente.
theological_decisions:
- issue: Relação entre realeza e sacerdócio
  choice: “submeteu a realeza ao sacerdócio”
  alternative: “pôs o reino sob o sacerdócio”
  rationale: Mantém a afirmação forte e a tensão teológica do original, sem definir como essa subordinação deve ser entendida ou aplicada.
- issue: Designação divina
  choice: “Deus”
  alternative: “o Senhor”
  rationale: A leitura grega fornecida tem ὁ Θεός, portanto a tradução segue a evidência original, apesar da formulação da versão inglesa consultiva.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A elipse verbal em “e a ele, o sacerdócio” é natural em português e conserva a estrutura retórica do grego.
