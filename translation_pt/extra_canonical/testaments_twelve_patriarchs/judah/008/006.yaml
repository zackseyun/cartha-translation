source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Μεθυσθεὶς οὖν οἴνῳ οὐκ ἐπέγνων αὐτὴν, καὶ ἠπάτησέ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως.
  language: Greek
  note: Greek from Charles XII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/006.yaml
  text: Therefore, being drunk with wine, I did not recognize her; and her beauty led my mind astray through the fashion of her adornment.
translation:
  language: pt
  text: Portanto, embriagado de vinho, não a reconheci; e a beleza dela me enganou por meio do modo como se adornava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς οὖν οἴνῳ
  choice: Portanto, embriagado de vinho
  rationale: Mantém a relação conclusiva de οὖν e traduz naturalmente o particípio passivo, preservando a menção explícita ao vinho.
- source_word: οὐκ ἐπέγνων αὐτὴν
  choice: não a reconheci
  rationale: Reproduz diretamente a ideia de não identificar ou reconhecer a mulher.
- source_word: ἠπάτησέ με
  choice: me enganou
  rationale: Traduz o sentido básico de induzir ao erro ou enganar, sem acrescentar a referência à mente presente na camada inglesa.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: por causa da aparência de seus adornos
  rationale: σχῆμα indica aparência, forma ou apresentação, e κόσμησις designa ornamentação ou adornos; a formulação conserva a relação causal e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego. Evitou-se ampliar ἠπάτησέ με para «desviou minha mente», pois o substantivo «mente» não aparece no texto-fonte.
