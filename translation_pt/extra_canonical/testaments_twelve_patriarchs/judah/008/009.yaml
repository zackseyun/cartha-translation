  text: καὶ δέδωκα αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου *εἰς ἀρραβῶνα.
  language: Greek
  note: 'Greek from Charles XII.4b (α): the pledge handover. Project''s English distributes this single α-clause across project vv 9-10. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/009.yaml
  text: And I said, "What pledge shall I give you?" And she said, "Your staff, and your girdle, and the diadem of your kingdom."
translation:
  language: pt
  text: E eu lhe dei o meu cajado e o meu diadema como penhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta frase menciona apenas o cajado e o diadema. A tradição de Gênesis 38:18 também menciona o cordão ou selo, e algumas formas editoriais da narrativa apresentam uma lista ampliada.
    reason: Sinaliza de modo transparente que a redação grega fornecida difere da versão inglesa de consulta, sem importar para o texto principal elementos ausentes da fonte.
lexical_decisions:
- source_word: ῥάβδον
  choice: cajado
  rationale: Equivalente natural para o objeto pessoal entregue como garantia; preserva o sentido concreto do grego.
- source_word: διάδημα
  choice: diadema
  rationale: Mantém a imagem régia específica do grego, sem ampliá-la para a expressão interpretativa “de seu reino”.
- source_word: ἀρραβῶνα
  choice: penhor
  rationale: Neste contexto, designa um objeto entregue como garantia, não o sentido moderno mais comum de “noivado”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A ordem e o conteúdo seguem diretamente a cláusula grega; não se reproduz a pergunta e resposta da versão inglesa porque elas não aparecem no texto-fonte fornecido.
