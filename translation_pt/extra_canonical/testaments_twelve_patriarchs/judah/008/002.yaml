base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/002.yaml
  text: She bore me Er and Onan and Shelah. And the Lord killed the first two, for Er was wicked; and Onan, when he had married Tamar, spilled the seed upon the ground, according to the commandment of his mother, and he also died through wickedness.
translation:
  language: pt
  text: Ela me deu à luz Er, Onã e Selá.[a] O Senhor matou os dois primeiros, pois Selá viveu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, o nome aparece como «Selom».
    reason: Informa de modo transparente a forma onomástica da fonte, enquanto o texto principal emprega a forma bíblica portuguesa mais reconhecível, «Selá».
lexical_decisions:
- source_word: Αὕτη
  choice: Ela
  rationale: O pronome demonstrativo feminino retoma naturalmente a mulher mencionada no contexto; em português corrente, «ela» evita a rigidez de «esta» sem acrescentar identificação.
- source_word: ἔτεκέν μοι
  choice: me deu
  rationale: Expressão portuguesa natural para a mulher que deu filhos a alguém, preservando a relação indicada pelo dativo μοι.
- source_word: Σηλώμ
  choice: Selá
  rationale: Emprega a forma portuguesa reconhecível do nome bíblico correspondente, registrando em nota a grafia da fonte grega.
- source_word: τοὺς μὲν δύο
  choice: os dois primeiros
  rationale: No contexto de uma lista de três filhos, a expressão refere-se naturalmente aos dois em contraste com Selá; «primeiros» torna clara essa referência sem importar o material ampliado da camada inglesa.
- source_word: ἀνεῖλεν
  choice: matou
  rationale: Equivalente direto e claro do verbo grego no contexto.
- source_word: ὁ γὰρ Σηλὼμ ἔζησεν
  choice: Selá, porém, viveu
  rationale: O γάρ oferece a razão pela qual somente dois foram mortos; em português, «porém» comunica com naturalidade o contraste decisivo, sem a formulação pouco idiomática «pois Selá viveu».
theological_decisions:
- issue: Agência divina na morte dos dois filhos
  choice: O Senhor matou os dois primeiros
  alternative: Os dois primeiros morreram por ação do Senhor
  rationale: A construção grega apresenta explicitamente Κύριος como sujeito de ἀνεῖλεν; a tradução mantém essa afirmação direta e sua tensão teológica.
- issue: Material explicativo presente na versão inglesa de consulta
  choice: Não incluir a maldade de Er, o ato de Onã nem a ordem de sua mãe
  alternative: Incorporar a narrativa ampliada da versão inglesa
  rationale: Esses elementos não aparecem no texto grego fornecido. A tradução segue prioritariamente a evidência da fonte original apresentada e não harmoniza silenciosamente com uma forma textual mais longa.
translation_notes:
  register: Português moderno, digno e direto, com leitura natural no Brasil e compreensão internacional. A coordenação breve reproduz o caráter conciso do grego. Evitou-se acrescentar as explicações narrativas da camada inglesa porque elas não constam da fonte grega fornecida.
