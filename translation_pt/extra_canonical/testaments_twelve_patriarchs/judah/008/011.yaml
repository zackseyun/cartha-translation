source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας. Καὶ οὐχ εὗρον αὐτήν,
  language: Greek
  note: Greek from Charles XII α-replacement passage (the abbreviated LXX-Gen 38.20-30 form that α substitutes for XII.6-10; preserved in Charles 1908 raw apparatus, p156). Project's English 'asked the people of the place' has no α counterpart and is drawn from the Genesis tradition. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/011.yaml
  text: And after this I sent the kid, but I did not find her. And I asked the people of the place, saying, "Where is the woman who sat at Enaim by the road?"
translation:
  language: pt
  text: Mandei buscar os penhores, mas não a encontrei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego desta forma abreviada diz apenas: “Mandei buscar os penhores, mas não a encontrei”. A menção ao cabrito e a pergunta aos moradores do lugar aparecem na tradição de Gênesis 38, mas não neste texto grego.'
    reason: Assinala de modo transparente que a redação inglesa ampliada incorpora material da tradição de Gênesis ausente no testemunho grego indicado como fonte.
lexical_decisions:
- source_word: Ἔπεμψα
  choice: Mandei
  rationale: Traduz naturalmente o aoristo de πέμπω, cujo complemento infinitivo indica a missão ordenada.
- source_word: τοῦ λαβεῖν
  choice: buscar
  rationale: O infinitivo final expressa o propósito de ir receber ou recuperar as garantias; “buscar” é natural no contexto sem acrescentar o cabrito não mencionado no texto grego.
- source_word: τοὺς ἀρραβῶνας
  choice: as garantias
  rationale: ἀρραβών designa objetos entregues como penhor ou garantia. O plural definido é preservado sem especificar quais objetos eram.
- source_word: οὐχ εὗρον αὐτήν
  choice: não a encontrei
  rationale: Mantém o objeto feminino explícito e a formulação direta do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa. A tradução segue prioritariamente o texto grego fornecido e não incorpora os acréscimos narrativos da camada inglesa.
