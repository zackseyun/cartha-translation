  text: To me he gave the things on earth; to him the things in heaven.
translation:
  language: pt
  text: A mim ele deu as coisas da terra; a ele, as coisas nos céus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐμοὶ
  choice: A mim
  rationale: Mantém a ênfase contrastiva do pronome grego em posição inicial.
- source_word: τὰ ἐπὶ γῆς
  choice: as coisas da terra
  rationale: Expressão natural em português que preserva o contraste entre o âmbito terreno e o celestial.
- source_word: ἐκείνῳ
  choice: a ele
  rationale: Conserva a referência contrastiva a outra pessoa sem explicitar uma identidade que o texto grego não fornece.
- source_word: τὰ ἐν οὐρανοῖς
  choice: as coisas dos céus
  rationale: O plural «céus» reflete o plural grego οὐρανοῖς e mantém o paralelismo com «as coisas da terra».
theological_decisions:
- issue: Identidade dos referentes pronominais
  choice: Manter «ele» e «a ele» sem identificar as pessoas
  alternative: Substituir os pronomes por nomes ou títulos inferidos do contexto mais amplo
  rationale: O enunciado isolado não nomeia os referentes; explicitá-los resolveria uma ambiguidade que o grego preserva.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A elipse verbal na segunda oração («a ele, as coisas dos céus») reproduz a estrutura compacta do grego sem prejudicar a compreensão.
