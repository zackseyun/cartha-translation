  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:40 ('be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi') is a project paraphrase that consolidates the 'do not exalt yourselves' theme of Charles XXI.1 with the 'draw near' (προσεγγίζειν) language of XXI.5, plus an addition ('honor the Lord in both') with no direct α counterpart. The α-text proceeds at XXI.6 to 'Καὶ ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα...' rather than this exhortation. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/040.yaml
  text: Therefore be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi.
translation:
  language: pt
  text: Portanto, não se exaltem acima de Levi nem contra mim; antes, honrem plenamente o Senhor em ambos e, entre os homens, aproximem-se de Levi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Esta frase não aparece como tal no testemunho grego alfa indicado. Ela reúne o tema de “não se exaltar” de 21.1 com a linguagem de “aproximar-se” de 21.5; “honrem plenamente o Senhor em ambos” não tem correspondente direto nesse testemunho. Em 21.6, o texto alfa prossegue com: “E você será entre eles como o mar...”'
    reason: Documentar honestamente que o versículo do projeto é uma paráfrase composta e contém uma adição sem equivalente direto na fonte grega informada.
lexical_decisions:
- source_word: ὑψοῦσθε (tema atribuído a XXI.1)
  choice: se exaltem
  rationale: Expressa de modo natural a ideia reflexiva de elevar-se ou considerar-se superior, sem limitar o sentido ao orgulho interior.
- source_word: προσεγγίζειν (linguagem atribuída a XXI.5)
  choice: aproximem-se
  rationale: Conserva a imagem ampla de achegar-se, sem especificar indevidamente aliança, submissão ou apoio.
- source_word: Levi
  choice: Levi
  rationale: Mantém a forma portuguesa tradicional do nome.
- source_word: honor in full
  choice: honrem plenamente
  rationale: Traduz com clareza a formulação do texto de consulta, embora ela não tenha correspondente direto no testemunho grego alfa indicado.
theological_decisions:
- issue: Relação entre Judá e Levi
  choice: Manter a proibição de superioridade sobre Levi e o chamado a aproximar-se dele
  alternative: Explicitar submissão religiosa ou supremacia sacerdotal de Levi
  rationale: A redação fornecida sustenta uma relação estreita sem definir de maneira denominacional a natureza exata da autoridade de Levi.
- issue: Expressão “o Senhor em ambos”
  choice: Preservar a formulação ambígua “o Senhor em ambos”
  alternative: Interpretar como honrar o Senhor tanto em Judá quanto em Levi, ou por meio dos dois ofícios
  rationale: O texto de consulta não resolve o referente de “ambos”; a tradução não deve impor uma interpretação.
- issue: Ausência de correspondente direto no texto grego alfa
  choice: Sinalizar a natureza composta e parcialmente não atestada da frase em nota
  alternative: Apresentar a sentença sem ressalva como tradução contínua do grego
  rationale: A transparência textual exige distinguir tradução de paráfrase editorial consolidada.
translation_notes:
  register: Português atual, digno e acessível, com formas plurais inclusivas do discurso coletivo. A sintaxe preserva a tensão e a ambiguidade da redação do projeto, enquanto a nota distingue claramente essa redação do testemunho grego alfa.
