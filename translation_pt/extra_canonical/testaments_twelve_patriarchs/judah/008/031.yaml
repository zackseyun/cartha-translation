revisions:
- from: Pois ele é escravo de duas paixões contrárias e não consegue obedecer a Deus, porque elas cegaram a sua alma, e ele anda de dia como se fosse noite.
  to: Pois ele é escravo de duas paixões contrárias e não consegue obedecer a Deus, porque ele cegou a sua alma e caminha de dia como na noite.
  rationale: A revisão corrige a discordância entre o sujeito plural introduzido no rascunho e o verbo grego singular, mantendo a imagem ativa de alguém que cegou a própria alma. Também ajusta a comparação entre dia e noite para uma correspondência mais direta com o grego, sem mudança de sentido ou acréscimo doutrinário.
