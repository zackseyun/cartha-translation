source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει, *καὶ Θεῷ ὑπακοῦσαι οὐ δύναται, ὅτι ἐτύφλωσε τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
  note: Greek from Charles XVIII.6 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/031.yaml
  text: For he is enslaved to two contrary passions and cannot obey God, because they have blinded his soul and he walks in the day as in the night.
translation:
  language: pt
  text: Pois ele é escravo de duas paixões contrárias e não consegue obedecer a Deus, porque ele cegou a sua alma e caminha de dia como na noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθεσιν
  choice: paixões
  rationale: Expressa impulsos ou disposições dominantes, preservando aqui o sentido moral negativo do grego.
- source_word: δουλεύει
  choice: é escravo de
  rationale: Mantém a forte imagem de sujeição servil, em vez de suavizá-la para simples influência.
- source_word: ὑπακοῦσαι
  choice: obedecer
  rationale: Equivalente natural e direto para a ideia de dar ouvidos e submeter-se a Deus.
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  choice: elas cegaram a sua alma
  rationale: Preserva a metáfora espiritual e toma como sujeito semântico as duas paixões mencionadas, conforme o sentido contextual e a consulta inglesa.
- source_word: πορεύεται
  choice: anda
  rationale: Reproduz naturalmente a metáfora de conduzir a vida ou caminhar, sem explicitar além do grego.
theological_decisions:
- issue: Incapacidade de obedecer a Deus
  choice: não consegue obedecer a Deus
  alternative: não pode obedecer a Deus
  rationale: Comunica a incapacidade declarada no texto sem definir se ela é absoluta, metafísica ou apenas resultante da escravidão moral descrita.
- issue: Agente do cegamento da alma
  choice: elas cegaram a sua alma
  alternative: ele cegou a sua alma
  rationale: O verbo grego está no singular, o que cria tensão gramatical com o antecedente plural mais próximo; o contexto favorece as paixões como causa do cegamento, mas a formulação não deve sustentar uma doutrina específica sobre a origem da cegueira espiritual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A frase conserva as imagens de escravidão, cegueira da alma e caminhada diurna em trevas, sem acrescentar interpretação confessional.
