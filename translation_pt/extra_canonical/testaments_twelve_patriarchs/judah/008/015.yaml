    reason: Explicita a nuance passiva de δεδικαίωται e preserva a ambiguidade entre justiça moral e vindicação, sem retirar da tradução principal a comparação marcada por ἤ.
  revision_rationale: A revisão mantém a omissão das expansões presentes apenas na versão inglesa e conserva o eufemismo sexual. Ela torna explícita na tradução principal a comparação do grego e melhora a fluência da oração inicial, enquanto a nota registra a nuance do perfeito passivo de δικαιόω.
