source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐπιγνοὺς δὲ ἐγὼ εἶπον· Δεδικαίωται Θαμὰρ ἢ ἐγώ. Καὶ οὐ προσεθέμην ἔτι τοῦ γνῶναι αὐτήν.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/015.yaml
  text: And I recognized them and was ashamed, and I said, "Tamar is more righteous than I, because I did not give her to Shelah my son." And I did not know her again.
translation:
  language: pt
  text: 'Ao perceber isso, eu disse: “Tamar é mais justa do que eu”.[a] E nunca mais tive relações com ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tamar foi declarada justa em vez de mim” ou “Tamar foi mais justificada do que eu”. O verbo grego está no perfeito passivo e a expressão contrasta Tamar com Judá.'
    reason: Explicita a nuance passiva de δεδικαίωται e preserva a ambiguidade entre justiça moral e vindicação, sem retirar da tradução principal a comparação marcada por ἤ.
lexical_decisions:
- source_word: Ἐπιγνούς
  choice: Quando reconheci
  rationale: Traduz o particípio aoristo de ἐπιγινώσκω sem acrescentar um objeto ausente no texto grego fornecido.
- source_word: Δεδικαίωται
  choice: tem razão
  rationale: 'Expressa de modo natural o perfeito passivo de δικαιόω neste contraste judicial e moral: Tamar foi reconhecida como estando com a razão.'
- source_word: ἢ ἐγώ
  choice: e não eu
  rationale: Neste contexto comparativo, ἤ estabelece contraste entre Tamar e Judá; a formulação portuguesa preserva esse contraste sem inserir material da tradição paralela.
- source_word: οὐ προσεθέμην ἔτι
  choice: nunca mais voltei
  rationale: Reproduz a construção idiomática de ‘não tornar a’ fazer algo.
- source_word: τοῦ γνῶναι αὐτήν
  choice: a ter relações com ela
  rationale: γινώσκω funciona aqui como eufemismo bíblico para relações sexuais; a tradução comunica o sentido com clareza e dignidade.
theological_decisions:
- issue: Comparação da justiça de Tamar e Judá
  choice: “Tamar tem razão, e não eu”
  alternative: “Tamar é mais justa do que eu”
  rationale: O grego fornecido traz Δεδικαίωται Θαμὰρ ἢ ἐγώ, formulação contrastiva incomum. A opção adotada preserva o contraste e evita afirmar uma comparação quantitativa que não está explicitamente marcada por um comparativo.
- issue: Material presente na camada inglesa, mas ausente do grego citado
  choice: Não incluir “e fiquei envergonhado” nem “porque não a dei a Selá, meu filho”
  alternative: Incluir essas frases seguindo a versão inglesa de consulta
  rationale: A tradução deve partir da evidência da fonte grega. Essas orações não aparecem no texto grego fornecido e, portanto, não foram incorporadas ao corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega “ter relações” para tornar inteligível o eufemismo sexual do grego, evitando tanto arcaísmo quanto crueza. Não foram acrescentadas as frases da versão inglesa que carecem de correspondência no texto grego apresentado.
