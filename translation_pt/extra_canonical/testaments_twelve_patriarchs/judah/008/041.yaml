source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:41 ('because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel') has no direct α-counterpart. The 'kingship from Judah, priesthood from Levi, Lord for all nations' theme is the project's homiletic synthesis of Charles XXII.2-3 ('ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραὴλ') and XXIV.6 ('κρῖναι καὶ σῶσαι πάντας τοὺς ἐπικαλουμένους τὸν Κύριον'), but α has no single verse that says what the project English says here. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/041.yaml
  text: For because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel.
translation:
  language: pt
  text: Pois, por causa dele, o Senhor escolherá dentre vocês a realeza e, dentre Levi, o sacerdócio, para que o Senhor seja para todas as nações e para a linhagem de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo não possui contraparte direta no testemunho grego α da edição consultada. Sua formulação é uma síntese temática de Testamento de Judá 22.2–3 e 24.6, que mencionam a vinda da salvação de Israel e o julgamento e a salvação de todos os que invocam o Senhor.
    reason: Distingue com transparência a síntese editorial do texto diretamente atestado no manuscrito-fonte.
lexical_decisions:
- source_word: kingship
  choice: realeza
  rationale: Expressa a instituição e a dignidade régia, em vez de apenas um reino territorial.
- source_word: priesthood
  choice: sacerdócio
  rationale: Equivalente corrente e preciso para a função ou instituição sacerdotal.
- source_word: race of Israel
  choice: linhagem de Israel
  rationale: Evita as conotações modernas de “raça” e comunica descendência ou estirpe sem restringir indevidamente o sentido.
theological_decisions:
- issue: Relação entre Judá, Levi e o Senhor para as nações
  choice: Preservar a formulação coordenada do texto inglês do projeto, sem explicar como realeza e sacerdócio se relacionam.
  alternative: Harmonizar ou desenvolver a frase como uma profecia messiânica explícita.
  rationale: O testemunho grego α fornecido não contém esta frase como unidade textual; por isso, a tradução não deve acrescentar uma identificação cristológica ou denominacional que a síntese do projeto não explicita.
- issue: Referente de “dele”
  choice: Manter o pronome sem identificar seu referente.
  alternative: Substituir por um nome ou título interpretativo.
  rationale: A falta de contraparte grega direta e de contexto imediato seguro recomenda preservar a ambiguidade do texto de consulta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “dentre vocês” conserva o valor distributivo; “para que o Senhor seja para” é mantida deliberadamente próxima da formulação do projeto, apesar de incomum, para não resolver uma relação teológica que não está diretamente atestada no grego α.
