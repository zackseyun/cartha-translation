review_pass:
  verdict: revise
  source_fidelity: O testemunho grego α indicado não contém uma contraparte direta deste versículo; portanto, a fidelidade possível é à formulação inglesa editorial, preservando tanto o pronome ambíguo «dele» quanto a relação não explicada entre realeza, sacerdócio, nações e Israel. A nota informa corretamente essa condição textual.
  naturalness: A redação é clara e de registro adequado. A substituição de «dentre Levi» por «de Levi» é mais idiomática em português, sem alterar o paralelismo nem introduzir uma especificação interpretativa como «tribo de Levi».
  terminology: «Realeza», «sacerdócio» e «linhagem de Israel» são escolhas adequadas. «Linhagem» evita as conotações contemporâneas de «raça» e conserva a referência a Israel como descendência/povo.
  issues:
  - severity: low
    issue: «dentre Levi» soa menos natural em português atual.
    rationale: Com um nome próprio sem determinante coletivo, «de Levi» exprime de modo mais fluente o «from Levi» inglês, sem pressupor ou acrescentar «tribo».
  revised_text: Pois, por causa dele, o Senhor escolherá dentre vocês a realeza e, de Levi, o sacerdócio, para que o Senhor seja para todas as nações e para a linhagem de Israel.[a]
  revised_footnotes:
  - marker: a
    text: Este versículo não possui contraparte direta no testemunho grego α da edição consultada. Sua formulação é uma síntese temática de Testamento de Judá 22.2–3 e 24.6, que mencionam a vinda da salvação de Israel e o julgamento e a salvação de todos os que invocam o Senhor.
    reason: Distingue com transparência a síntese editorial do texto diretamente atestado no manuscrito-fonte.
  revision_rationale: 'Feita apenas uma correção idiomática segura: «de Levi» é mais natural do que «dentre Levi». Mantêm-se a sintaxe deliberadamente próxima do inglês, o pronome sem referente explicitado e a nota de transparência sobre a ausência de base direta no testemunho α.'
