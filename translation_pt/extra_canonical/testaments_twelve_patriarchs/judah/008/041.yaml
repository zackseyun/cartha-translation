review_pass:
  verdict: revise
  source_fidelity: O texto inglês do projeto é explicitamente uma síntese sem contraparte direta no testemunho grego α fornecido; a nota comunica isso com precisão adequada. A tradução preserva os referentes não identificados, a relação entre Judá/Levi e a abrangência para nações e Israel, sem impor interpretação confessional.
  naturalness: A redação é em geral clara, mas “para que o Senhor seja para todas as nações” é um decalque pouco natural em português. “Para que o Senhor seja o Senhor de” conserva a formulação teológica aberta e torna a frase idiomática.
  terminology: “Realeza”, “sacerdócio” e “linhagem de Israel” são escolhas adequadas. “Linhagem” evita a carga moderna de “raça” e mantém a referência à descendência israelita.
  issues:
  - severity: medium
    issue: Construção final pouco idiomática
    rationale: “O Senhor seja para todas as nações” não é construção natural no português contemporâneo e pode soar incompleta. A repetição funcional de “Senhor” em “seja o Senhor de” explicita apenas o valor predicativo já presente no inglês (“may be [Lord] for”), sem especificar uma leitura denominacional.
  revised_text: Pois é por causa dele que o Senhor escolherá, dentre vocês, a realeza e, de Levi, o sacerdócio, para que o Senhor seja o Senhor de todas as nações e da linhagem de Israel.[a]
  revised_footnotes:
  - marker: a
    text: Este versículo não possui contraparte direta no testemunho grego α da edição consultada. Sua formulação é uma síntese temática de Testamento de Judá 22.2–3 e 24.6, que mencionam a vinda da salvação de Israel e o julgamento e a salvação de todos os que invocam o Senhor.
    reason: Distingue com transparência a síntese editorial do texto diretamente atestado no manuscrito-fonte.
  revision_rationale: 'Foi feita somente uma revisão de idiomaticidade: a expressão final foi ajustada para uma construção portuguesa natural, sem alterar os elementos, a ambiguidade do referente de “dele” ou o caráter não diretamente atestado da síntese. A nota existente permanece necessária e correta.'
