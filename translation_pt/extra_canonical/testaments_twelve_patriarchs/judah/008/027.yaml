  text: Φυλάξασθε οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας, καὶ ἀκούσατε Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
  note: Greek from Charles XVIII.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/027.yaml
  text: Therefore keep yourselves, my children, from sexual immorality and from the love of money, and listen to Judah your father.
translation:
  language: pt
  text: Portanto, meus filhos, guardem-se da imoralidade sexual e do amor ao dinheiro, e escutem Judá, seu pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: guardem-se
  rationale: Preserva o sentido reflexivo de manter-se vigilante e afastado de algo, em linguagem natural e direta.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Forma familiar e digna que corresponde ao vocativo grego.
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: Expressa o sentido amplo de conduta sexual ilícita sem restringi-lo a uma prática específica.
- source_word: φιλαργυρίας
  choice: amor ao dinheiro
  rationale: Traduz de modo transparente o composto grego, evitando o possível sentido mais amplo e menos preciso de 'ganância'.
- source_word: ἀκούσατε
  choice: escutem
  rationale: Mantém o imperativo de ouvir com atenção, sem acrescentar explicitamente a ideia de obediência.
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: Judá, seu pai
  rationale: Reproduz a autoidentificação do orador com uma aposição natural em português.
