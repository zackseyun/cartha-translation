  source_fidelity: 'A tradução segue fielmente o grego fornecido: ἀπέστειλε πρός με λέγουσα é adequadamente expresso por “mandou-me dizer”; ἐγὼ ἐν γαστρὶ ἔχω por “Estou grávida”; e ἐπίγνωθι conserva a ordem de identificar os proprietários. A enumeração “o anel, o bastão e o diadema” reproduz tanto os objetos quanto a ordem da leitura α (δακτύλιος, ῥάβδος, διάδημα). Não importa o envio secreto dos objetos nem o cinto, elementos presentes no texto inglês de auditoria, mas ausentes desta fonte grega.'
