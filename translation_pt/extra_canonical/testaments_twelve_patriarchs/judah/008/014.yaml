id: T12P.JUD.8.14
reference: Testament of Judah 8:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἡ δὲ ἀπέστειλε πρός με λέγουσα· Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν, ἐγὼ ἐν γαστρὶ ἔχω· ἐπίγνωθι οὖν τίνος ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). The α-replacement gives the order 'ring, staff, diadem' (δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα), rather than the project English's 'staff, girdle, diadem'; the girdle (ζώνη) belongs to β (XII.4) and to Judah's later interpretation in XV.3. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/014.yaml
  text: But as she was being brought out, she sent secretly to me the staff and the girdle and the diadem, saying, "By the man to whom these belong I am with child."
translation:
  language: pt
  text: 'Ela, porém, mandou-me dizer: “Estou grávida do homem a quem pertencem estas coisas. Reconhece, pois, de quem são o anel, o bastão e o diadema.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλε πρός με λέγουσα
  choice: mandou-me dizer
  rationale: Expressa naturalmente em português o envio de uma mensagem, sem acrescentar que os objetos foram enviados nem que isso ocorreu em segredo.
- source_word: ἐγὼ ἐν γαστρὶ ἔχω
  choice: Estou grávida
  rationale: Equivalente idiomático claro da expressão grega literal 'tenho no ventre'.
- source_word: ἐπίγνωθι
  choice: Reconhece
  rationale: Preserva a ordem direta para identificar a quem pertenciam os objetos.
- source_word: ὁ δακτύλιος
  choice: o anel
  rationale: Segue o substantivo grego da versão α; não o substitui pelo 'cinto' encontrado em outra tradição textual.
- source_word: ἡ ῥάβδος
  choice: o bastão
  rationale: Tradução corrente e concreta de ῥάβδος neste contexto.
- source_word: τὸ διάδημα
  choice: o diadema
  rationale: Mantém o objeto distintivo nomeado no grego, em registro digno e inteligível.
theological_decisions:
- issue: Identidade e ordem dos objetos apresentados como prova
  choice: anel, bastão e diadema
  alternative: bastão, cinto e diadema
  rationale: A tradução segue diretamente a passagem grega α fornecida, cuja sequência é δακτύλιος, ῥάβδος, διάδημα; a alternativa pertence à consolidação inglesa e a outra tradição/passagem.
- issue: Modo de transmissão da mensagem
  choice: mandou-me dizer
  alternative: mandou-me secretamente o bastão, o cinto e o diadema
  rationale: O grego afirma que ela enviou uma mensagem a Judá, mas não contém 'secretamente' nem diz aqui que enviou os objetos; esses elementos não devem ser importados.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A fala conserva solenidade moderada. Emprega-se 'Reconhece' para manter a forma direta do imperativo sem recorrer ao regionalismo brasileiro 'reconheça' com pronome de tratamento não explicitado.
