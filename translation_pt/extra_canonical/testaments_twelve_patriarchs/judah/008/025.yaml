id: T12P.JUD.8.25
reference: Testament of Judah 8:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε *μετανοήσας ἐπὶ τούτοις, οἶνον καὶ κρέα οὐκ ἔφαγον ἕως γήρους μου, καὶ *πᾶσαν εὐφροσύνην οὐκ εἶδον.
  language: Greek
  note: Greek from Charles XV.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/025.yaml
  text: And indeed I repented of these things; and wine and meat I did not consume until old age, and I saw no joy.
translation:
  language: pt
  text: E, de fato, arrependi-me dessas coisas; não consumi vinho nem carne até a minha velhice e não experimentei alegria alguma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: E, de fato
  rationale: Expressa a força enfática da partícula composta sem tornar a frase artificial em português.
- source_word: μετανοήσας
  choice: arrependi-me
  rationale: Verte naturalmente a ideia de mudança interior e arrependimento no contexto de ações passadas.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: não comi carne nem bebi vinho
  rationale: Em grego, ἔφαγον rege de modo amplo os dois objetos; em português, empregam-se os verbos idiomáticos próprios para carne e vinho. A ordem foi ajustada para a construção corrente 'nem... nem'.
- source_word: ἕως γήρους μου
  choice: até a minha velhice
  rationale: Mantém o limite temporal do original sem inferir se a abstinência terminou ou não naquele momento.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: não experimentei alegria alguma
  rationale: O uso de 'ver' com 'alegria' é idiomático no grego; 'experimentar' comunica o sentido em português natural, preservando a amplitude da afirmação.
theological_decisions:
- issue: Natureza da abstinência de carne e vinho
  choice: Manter a declaração autobiográfica sem explicá-la como voto, penitência ritual ou regra universal
  alternative: Interpretar explicitamente a abstinência como prática ascética ou penitencial
  rationale: O texto liga a conduta ao arrependimento, mas não define sua categoria religiosa nem a impõe a outros.
- issue: Alcance de 'alegria alguma'
  choice: Preservar a formulação absoluta do grego
  alternative: Restringir a expressão a festas, prazeres ou celebrações
  rationale: Embora εὐφροσύνη possa envolver júbilo festivo, o texto não especifica esse âmbito; uma restrição resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe foi naturalizada sem enfraquecer o tom enfático e penitencial do testemunho.
