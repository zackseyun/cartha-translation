  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:8 (the 'I will send you a kid from the flock... will you give me a pledge until you send it?' exchange) has no direct counterpart in the Charles α-text of XII.4, which collapses Tamar's question 'Τί μοι δώσεις;' directly into Judah handing over the pledges. The kid-from-the-flock question is drawn from the broader Genesis 38 tradition that informs the project English; α witnesses no Greek for this specific exchange. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/008.yaml
  text: And I said, "I will send you a kid from the flock." And she said, "Will you give me a pledge until you send it?"
translation:
  language: pt
  text: 'E eu disse: “Enviarei para você um cabrito do rebanho.” E ela disse: “Você me dará um penhor até enviá-lo?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta fala não tem correspondente direto no texto grego α aqui usado; ela provém da tradição mais ampla de Gênesis 38:17–18, que fundamenta este trecho do projeto.
    reason: Documentar com transparência que o conteúdo não é traduzido diretamente do testemunho grego α fornecido.
lexical_decisions:
- source_word: 'Genesis 38 tradition: גְּדִי־עִזִּים / ἔριφον αἰγῶν'
  choice: um cabrito do rebanho
  rationale: Segue a formulação do texto inglês do projeto e a tradição subjacente de Gênesis 38, em linguagem portuguesa natural.
- source_word: 'Genesis 38 tradition: עֵרָבוֹן / ἀρραβών'
  choice: uma garantia
  rationale: Expressa algo entregue como segurança até o pagamento prometido, sem restringir antecipadamente quais objetos seriam dados.
- source_word: 'Genesis 38 tradition: עַד שָׁלְחֶךָ / ἕως τοῦ ἀποστεῖλαί σε'
  choice: até mandá-lo
  rationale: O pronome retoma naturalmente o cabrito prometido e evita a ambiguidade coloquial de “até você mandar”.
theological_decisions:
- issue: Ausência da fala no testemunho grego α de Charles
  choice: Manter o intercâmbio da tradição mais ampla de Gênesis 38, com nota textual explícita
  alternative: Omitir o versículo ou apresentar uma reconstrução como se estivesse diretamente atestada no texto grego α
  rationale: O texto inglês do projeto inclui a fala, mas a honestidade documental exige informar que ela não possui correspondente direto no testemunho grego α indicado.
translation_notes:
  register: Português moderno, claro e digno, com construção dialogal natural e legibilidade brasileira. “Garantia” foi preferido a termos mais técnicos como “penhor”, embora este último também seja possível no contexto jurídico antigo.
