id: T12P.JUD.8.16
reference: Testament of Judah 8:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν λέγω ὑμῖν, τέκνα μου, μὴ μεθύσκεσθε οἴνῳ, ὅτι ὁ οἶνος διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας καὶ ἐμβάλλει ὀργὴν ἐπιθυμίας, καὶ ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς.
  language: Greek
  note: 'Greek from Charles XIV.1 (α): the wine-warning exhortation. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/016.yaml
  text: 'And now, my children, I say to you: do not be drunk with wine. For wine turns the mind away from the truth and inspires the passion of desire, and it leads the eyes into error.'
translation:
  language: pt
  text: 'E agora eu lhes digo, meus filhos: não se embriaguem com vinho, pois o vinho desvia a mente da verdade, incita a ira do desejo e leva os olhos ao engano.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθύσκεσθε οἴνῳ
  choice: se embriaguem com vinho
  rationale: Expressa de modo natural e direto a proibição grega de ficar embriagado pelo vinho.
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: desvia a mente da verdade
  rationale: Preserva tanto a ação de afastar ou perverter quanto a relação explícita com a verdade, sem ampliar o sentido.
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: incita a paixão do desejo
  rationale: A construção grega é incomum; esta formulação mantém a intensidade de ὀργή e sua ligação genitiva com ἐπιθυμία sem resolver excessivamente a tensão lexical.
- source_word: ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς
  choice: leva os olhos ao engano
  rationale: Conserva a imagem concreta dos olhos sendo conduzidos à ilusão, ao erro ou ao extravio.
theological_decisions:
- issue: Alcance da advertência sobre o vinho
  choice: não se embriaguem com vinho
  alternative: não bebam vinho
  rationale: O verbo μεθύσκω se refere à embriaguez, não estabelece por si só uma proibição absoluta de consumir vinho.
- issue: Sentido da expressão ὀργὴν ἐπιθυμίας
  choice: a paixão do desejo
  alternative: a fúria da cobiça
  rationale: A expressão admite mais de uma nuance; a escolha preserva sua força e ambiguidade sem restringir o desejo à cobiça material ou introduzir uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento de ampla legibilidade brasileira. A repetição de “vinho” e a sequência mente–desejo–olhos foram preservadas por sua função retórica.
