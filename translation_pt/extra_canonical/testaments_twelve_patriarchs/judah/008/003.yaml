id: T12P.JUD.8.3
reference: Testament of Judah 8:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ οὐκ ἀφῆκεν. Ἐπονηρεύσατο γὰρ, ὅτι οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή.
  language: Greek
  note: 'Greek from Charles X.6 (α): Judah refuses to give Tamar to Shelah. Project ch.8 is a thematic consolidation; this verse re-flows narrative content from Charles ch.X.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/003.yaml
  text: And Shelah lived, and I did not give Tamar to him as wife. For I said, "Lest he also die like his brothers." For I did not know that the Lord was judging me because of the things I had done at Timnah to my father Jacob and to Joseph.
translation:
  language: pt
  text: Eu também queria dar Selá a Tamar como marido, mas a mãe dele não permitiu. Ela agiu assim por maldade, porque Tamar não era uma das filhas dos cananeus, como ela própria era.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤθελον
  choice: Eu também queria
  rationale: Expressa de modo natural o desejo ou intenção de Judá no imperfeito grego, sem afirmar que a ação chegou a ser realizada.
- source_word: τὸν Σηλὼμ δοῦναι αὐτῇ
  choice: dar Selá a Tamar como marido
  rationale: O grego diz literalmente “dar Selá a ela”; o contexto matrimonial permite explicitar “como marido”, e “Tamar” identifica com clareza o referente do pronome.
- source_word: οὐκ ἀφῆκεν
  choice: não permitiu
  rationale: Equivalente direto e corrente para a proibição exercida pela mãe de Selá.
- source_word: Ἐπονηρεύσατο
  choice: agiu assim por maldade
  rationale: Preserva a avaliação moral forte do verbo sem recorrer ao pouco natural “tornou-se perversa”.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: uma das filhas dos cananeus
  rationale: Mantém de perto a formulação e a identificação étnica do grego, em vez de generalizá-la como simples residência em Canaã.
theological_decisions:
- issue: Divergência entre o texto grego fornecido e a camada inglesa de consulta
  choice: 'Traduzir o conteúdo atestado no texto grego: a intenção de dar Selá a Tamar e a oposição da mãe dele'
  alternative: Seguir a redação inglesa sobre o temor de que Selá morresse e o juízo do Senhor pelos atos de Judá
  rationale: A redação inglesa contém material que não aparece no testemunho grego apresentado. A tradução deve partir primeiro da evidência na língua original e não incorporar frases sem apoio nessa fonte.
- issue: Identidade dos referentes femininos
  choice: Identificar a primeira mulher como Tamar e entender “ela própria” como a mãe de Selá
  alternative: Manter apenas os pronomes femininos, produzindo ambiguidade em português
  rationale: A sintaxe e o contraste indicam que Tamar não era cananeia, ao passo que a mãe de Selá era. A explicitação evita uma ambiguidade pronominal artificial sem alterar o sentido do texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa direta. A formulação acompanha prioritariamente o grego fornecido, apesar da diferença substancial em relação à camada inglesa de consulta.
