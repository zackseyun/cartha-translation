id: T12P.JUD.8.42
reference: Testament of Judah 8:42
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔγνωκα ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις].'
  language: Greek
  note: Greek from Charles XVIII.1 (α). The project English's 'I have read in the books of Enoch the righteous' reflects the β-recension reading 'καίγε ἀνέγνων ἐν βίβλοις Ἐνὼχ τοῦ δικαίου' (Charles 1908 raw apparatus, p164 n.1); the α-text here has only 'Καὶ ἔγνωκα' ('And I have come to know'). The 'sons turning away from the Lord and committing every wickedness' is captured in α by 'ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις]' (the bracketed clause is Charles' marked Christian interpolation, preserved per project policy). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/042.yaml
  text: And now I have commanded you these things, because I have read in the books of Enoch the righteous that your sons will turn away from the Lord, and will commit every wickedness and every affliction before the Lord.
translation:
  language: pt
  text: E fiquei sabendo de todo o mal que vocês farão nos últimos dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão “nos últimos dias” aparece entre colchetes na edição de Charles, que a considera uma interpolação cristã. Outra recensão acrescenta: “li nos livros de Enoque, o justo”.'
    reason: Registra tanto a condição editorial da cláusula preservada quanto a variante relevante da recensão β, sem misturá-las ao texto principal.
lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a ligação simples com o contexto anterior.
- source_word: ἔγνωκα
  choice: fiquei sabendo
  rationale: Expressa o perfeito grego como conhecimento adquirido com efeito presente, sem importar da recensão β a referência aos livros de Enoque.
- source_word: ὅσα κακὰ
  choice: todo o mal que
  rationale: Reproduz de modo natural a ideia abrangente de todas as coisas más, sem acrescentar tipos específicos de perversidade ou aflição.
- source_word: ποιήσετε
  choice: vocês farão
  rationale: Preserva a segunda pessoa do plural e o futuro do texto grego.
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: nos últimos dias
  rationale: Equivalente corrente e digno da expressão temporal escatológica.
theological_decisions:
- issue: Leitura entre as recensões α e β
  choice: Traduzir apenas Καὶ ἔγνωκα da recensão α
  alternative: Acrescentar que Judá leu nos livros de Enoque, o justo
  rationale: A fonte grega indicada para esta unidade é o texto α; a menção aos livros de Enoque pertence à recensão β e não deve ser harmonizada silenciosamente.
- issue: Conteúdo do mal futuro
  choice: Manter a formulação geral “todo o mal”
  alternative: Especificar afastamento do Senhor, toda perversidade e toda aflição diante do Senhor
  rationale: Essas especificações do inglês de consulta não aparecem nesta leitura α e, portanto, não são importadas.
- issue: Cláusula marcada por Charles como interpolação cristã
  choice: Preservar “nos últimos dias” com nota
  alternative: Omitir a cláusula entre colchetes
  rationale: Segue a política declarada do projeto de preservar a cláusula, ao mesmo tempo que informa sua condição textual.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa plural. A tradução permanece próxima da concisão do grego α e evita harmonização com a versão inglesa de consulta.
