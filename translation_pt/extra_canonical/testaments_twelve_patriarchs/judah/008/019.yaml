id: T12P.JUD.8.19
reference: Testament of Judah 8:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τοιοῦτός ἐστιν ὁ πάροινος, τέκνα μου, ὅτι ὁ μεθύων οὐκ αἰδεῖται οὐδένα. 5. *Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως ὅτι ἐν ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν μεγάλην, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου.
  language: Greek
  note: Greek from Charles XIV.4-5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/019.yaml
  text: Such is the drunkard, my children. For the one who is drunk does not reverence anyone. For behold, it made me also transgress the commandment of God, and I went in to Tamar, not being ashamed of the multitude in the city, and before the eyes of all I uncovered the shame of my sons, since I went in to Tamar.
translation:
  language: pt
  text: 'Assim é o beberrão, meus filhos: quem se embriaga não se envergonha diante de ninguém. Pois eis que a embriaguez também me enganou, para que eu não me envergonhasse da multidão da cidade; pois, diante dos olhos de todos, desviei-me para Tamar, cometi um grande pecado e descobri a cobertura da impureza dos meus filhos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por «descobri a cobertura da impureza dos meus filhos» é incomum. Mais literalmente, traz «descobri a cobertura da impureza de meus filhos»; a relação exata entre «cobertura», «impureza» e «filhos» permanece ambígua.
    reason: Preserva em português legível a formulação difícil do grego, sem fixar uma interpretação para os genitivos.
lexical_decisions:
- source_word: πάροινος
  choice: beberrão
  rationale: Designa alguém dado ao vinho ou à embriaguez; «beberrão» é corrente, claro e preserva a caracterização moral do substantivo.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: não se constrange diante de ninguém
  rationale: αἰδέομαι reúne as ideias de respeito, pudor e vergonha diante de alguém. A formulação escolhida mantém essa amplitude melhor do que simplesmente «não respeita ninguém».
- source_word: ἐπλάνησεν
  choice: me desencaminhou
  rationale: O verbo indica fazer alguém se desviar ou cair em erro. O sujeito implícito foi explicitado como «a embriaguez», retomando naturalmente a frase anterior sem introduzir a referência ao mandamento de Deus, ausente do grego fornecido.
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: desviei-me para Tamar
  rationale: Preserva a imagem de desvio expressa por ἐκκλίνω e a direção marcada por πρός, sem tornar explícita uma relação sexual que o grego desta cláusula apenas sugere pelo contexto.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: removi o véu que cobria a impureza dos meus filhos
  rationale: Reproduz a combinação intencionalmente difícil entre «descobrir/remover», «véu/cobertura» e «impureza», em português compreensível, sem substituir a frase por uma interpretação teológica específica.
theological_decisions:
- issue: Referência ao «mandamento de Deus» presente no texto inglês de consulta
  choice: Não incluída
  alternative: «também me fez transgredir o mandamento de Deus»
  rationale: Essa oração não aparece no texto grego fornecido; a tradução prioriza a evidência da fonte original.
- issue: Sentido da expressão final sobre a impureza dos filhos
  choice: Manter a metáfora do véu e a relação genitiva ambígua
  alternative: Interpretar como «expus a vergonha dos meus filhos»
  rationale: O grego é incomum e não identifica de modo inequívoco a natureza dessa impureza nem o exato efeito sobre os filhos; a tradução evita resolver silenciosamente a dificuldade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Pois vejam» comunica o valor discursivo de ἰδοὺ γάρ sem arcaísmo excessivo. A pontuação integra as cláusulas gregas em uma progressão natural, mantendo a repetição enfática de vergonha pública, desvio e pecado.
