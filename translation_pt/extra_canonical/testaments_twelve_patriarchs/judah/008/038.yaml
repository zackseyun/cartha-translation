id: T12P.JUD.8.38
reference: Testament of Judah 8:38
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Οὕτως γὰρ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου καὶ διὰ τοῦ τῆς ἐπιγείου βασιλείας *κυριευθῇ.
  language: Greek
  note: Greek from Charles XXI.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/038.yaml
  text: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom—unless it falls away through sin from the Lord and is dominated by the earthly kingdom.
translation:
  language: pt
  text: Pois assim o sacerdócio de Deus é superior ao reino terreno, a menos que, por causa dos pecados, se afaste do Senhor e seja dominado pelo reino terreno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχει
  choice: é superior a
  rationale: Expressa diretamente a ideia de preeminência ou superioridade, sem acrescentar a comparação entre céu e terra, ausente no texto grego fornecido.
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: o sacerdócio de Deus
  rationale: Mantém a construção genitiva e a referência institucional do substantivo grego.
- source_word: τῆς ἐπιγείου βασιλείας
  choice: ao reino terreno
  rationale: Traduz ἐπίγειος de modo natural e preserva o contraste entre sacerdócio divino e realeza terrena.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: se afaste do Senhor
  rationale: Comunica a ideia de cair para fora ou apartar-se do Senhor em português corrente, sem especificar além do grego a natureza dessa ruptura.
- source_word: κυριευθῇ
  choice: seja dominado
  rationale: Preserva a voz passiva e a noção de ficar sob o domínio do reino terreno.
theological_decisions:
- issue: Superioridade condicional do sacerdócio
  choice: a menos que... se afaste... e seja dominado
  alternative: se não cair... nem for dominado
  rationale: 'A formulação mantém a tensão do grego: a superioridade do sacerdócio é afirmada, mas sua condição histórica pode ser perdida por causa dos pecados e pela sujeição ao poder terreno.'
- issue: Referente implícito dos verbos no singular
  choice: o sacerdócio como referente
  alternative: seus representantes sacerdotais
  rationale: A concordância e o contexto apontam para ἡ ἱερατεία; não se explicita uma referência aos sacerdotes individuais que o texto não declara.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do grego. A ampliação comparativa do inglês (“Como o céu é mais alto que a terra”) não foi incorporada porque não consta no texto grego fornecido.
