  source_fidelity: 'A tradução preserva a afirmação de que o sacerdócio de Deus é superior ao reino terreno e mantém adequadamente a ressalva condicional: por pecados, o sacerdócio pode afastar-se/cair do Senhor e ficar sob o domínio do reino terreno. Não importa a comparação adicional entre céu e terra presente no texto inglês, pois ela não consta no grego fornecido.'
  naturalness: O texto é claro, gramatical e de registro adequado em português moderno. «Pois assim» reproduz o conectivo inicial οὕτως γάρ, embora seu referente discursivo dependa do contexto anterior da obra, como no original.
  terminology: «Sacerdócio de Deus», «reino terreno», «pecados», «Senhor» e «seja dominado» são escolhas fiéis, naturais e teologicamente não interpretativas. «Se afaste do Senhor» comunica de modo idiomático ἐκπέσῃ ἀπὸ Κυρίου sem impor uma formulação doutrinal mais específica.
