id: T12P.JUD.8.28
reference: Testament of Judah 8:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι ταῦτα ἀφιστᾷ τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν ἐκδιδάσκει, καὶ οὐκ ἀφίει ἄνδρα ἐλεῆσαι τὸν πλησίον αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/028.yaml
  text: For these things draw a person away from the law of God and blind the inclination of the soul, and teach arrogance, and do not allow one to have compassion on his neighbor.
translation:
  language: pt
  text: Pois essas coisas afastam a pessoa da lei de Deus, cegam o discernimento da alma, ensinam a arrogância e não lhe permitem ter compaixão do seu próximo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: Mantém a referência anafórica ampla do grego sem especificar indevidamente quais vícios estão em vista.
- source_word: ἀφιστᾷ
  choice: afastam
  rationale: Expressa de modo natural a ideia de desviar ou separar alguém da lei de Deus.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: o discernimento da alma
  rationale: διαβούλιον pode indicar faculdade de deliberação, conselho ou propósito; “discernimento” comunica aqui a capacidade interior de avaliar e decidir, sem reduzir a expressão a mera inclinação.
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: ensinam a arrogância
  rationale: Reproduz a formulação incomum do grego, segundo a qual essas coisas instruem ou habituam a pessoa à soberba.
- source_word: ἐλεῆσαι
  choice: ter compaixão
  rationale: Equivalente corrente e digno para exercer misericórdia ou compadecer-se.
- source_word: τὸν πλησίον αὐτοῦ
  choice: do seu próximo
  rationale: Preserva a linguagem ética tradicional e compreensível de “próximo”.
theological_decisions:
- issue: Natureza de τὸ διαβούλιον τῆς ψυχῆς
  choice: o discernimento da alma
  alternative: a inclinação da alma
  rationale: O substantivo aponta mais diretamente para deliberação, conselho ou faculdade decisória do que para uma inclinação moral já definida; a escolha conserva a antropologia ampla do texto.
- issue: Objeto humano implícito em ἀφιστᾷ e οὐκ ἀφίει ἄνδρα
  choice: a pessoa / lhe
  alternative: o homem / um homem
  rationale: O grego usa ἄνδρα de maneira genérica. A formulação inclusiva em português moderno comunica o sentido sem introduzir uma restrição ao sexo masculino.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A coordenação repetida do grego foi preservada, mas os pronomes foram ajustados para fluidez e coesão.
