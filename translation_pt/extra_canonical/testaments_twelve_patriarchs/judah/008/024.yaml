source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Δέδωκα γὰρ τὴν ῥάβδον μου, τουτέστι τὸ στήριγμα τῆς ἐμῆς φυλῆς, καὶ τὴν ζώνην μου, τουτέστιν τὴν δύναμιν, καὶ τὸ διάδημα, τουτέστιν τὴν δόξαν τῆς βασιλείας μου.
  language: Greek
  note: Greek from Charles XV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/024.yaml
  text: For I gave my staff, that is, the stay of my tribe; and my girdle, that is, my power; and my diadem, that is, the glory of my kingdom.
translation:
  language: pt
  text: Pois dei o meu bastão, isto é, o apoio da minha tribo; o meu cinto, isto é, o poder; e o meu diadema, isto é, a glória do meu reino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: bastão
  rationale: Preserva a imagem concreta de um objeto que serve de apoio e pode simbolizar autoridade, sem restringi-la a uma única função.
- source_word: στήριγμα
  choice: sustentáculo
  rationale: Expressa aquilo que dá apoio e firmeza, mantendo a explicação metafórica ligada à tribo de Judá.
- source_word: ζώνην
  choice: cinto
  rationale: Equivalente natural e direto para a faixa usada em torno da cintura; evita o caráter arcaizante de “cinturão” neste contexto.
- source_word: δύναμιν
  choice: poder
  rationale: Mantém o sentido amplo de força, capacidade ou poder, conforme a identificação explícita feita pelo texto.
- source_word: διάδημα
  choice: diadema
  rationale: Conserva o termo régio específico, distinguindo-o de uma coroa em sentido mais geral.
- source_word: δόξαν τῆς βασιλείας μου
  choice: a glória do meu reino
  rationale: Reproduz de modo formal e inteligível a relação genitiva e a imagem da dignidade régia.
theological_decisions:
- issue: Valor simbólico dos três objetos
  choice: Manter as equivalências interpretativas declaradas pelo próprio texto
  alternative: Substituir diretamente os objetos por seus significados simbólicos
  rationale: A repetição “isto é” faz parte da estrutura argumentativa e preserva a relação entre o sinal concreto e seu significado.
- issue: Sentido de βασιλεία
  choice: reino
  alternative: realeza
  rationale: “Reino” corresponde bem ao uso habitual e à camada inglesa auditada, embora “realeza” pudesse enfatizar a dignidade régia; a formulação foi mantida sem resolver além do que o grego exige.
translation_notes:
  register: Português moderno, digno e de ampla compreensão. A construção paralela do grego foi preservada, com pontuação que torna clara a sequência dos três objetos e suas explicações.
