  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε οἱ ἐν τῇ πόλει ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον, ὅτι ἐξ ἄλλου χωρίου ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ πύλῃ. 10. Καὶ ἐνόμιζον, ὅτι οὐδεὶς ἔγνω ὅτι εἰσῆλθον πρὸς αὐτήν.
  language: Greek
  note: Greek from Charles XII.9-10 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/012.yaml
  text: And they said, "There has been no prostitute here, nor any stranger sitting by the gate." And I understood that I had sinned, and I did not make the matter known publicly, because I was ashamed.
translation:
  language: pt
  text: 'E os moradores da cidade diziam: “Não havia nenhuma prostituta junto ao portão[a]; ela tinha vindo de outro lugar e ficado ali sentada por pouco tempo”. E eles pensavam que ninguém sabia que eu havia entrado para me encontrar com ela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “prostituta” é raro e de leitura difícil; o contexto favorece esse sentido.
    reason: Sinalizar com transparência uma dificuldade lexical genuína do texto-fonte.
lexical_decisions:
- source_word: οἱ ἐν τῇ πόλει
  choice: os moradores da cidade
  rationale: Expressa naturalmente as pessoas que estavam ou viviam na cidade, sem restringir a referência a autoridades.
- source_word: τελεσικόμενον
  choice: prostituta
  rationale: O termo grego é raro e textualmente difícil neste contexto, mas a narrativa e a tradição textual sustentam a referência a uma mulher que exercia prostituição.
- source_word: ἐν τῇ πύλῃ
  choice: junto ao portão
  rationale: No contexto urbano antigo, πύλη designa o portão ou a entrada da cidade; 'junto ao' é idiomático para alguém sentado nesse local.
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: eu havia entrado para me encontrar com ela
  rationale: Preserva o sentido literal de ter entrado para ir até ela, deixando a implicação sexual ao contexto em vez de explicitá-la além do grego.
theological_decisions:
- issue: Divergência entre o texto grego fornecido e a camada inglesa consultiva
  choice: Traduzir a afirmação de que os moradores pensavam que ninguém sabia que Judá havia entrado para se encontrar com a mulher
  alternative: Seguir o inglês e acrescentar que Judá reconheceu seu pecado, sentiu vergonha e não tornou o caso público
  rationale: Essas afirmações sobre pecado, vergonha e silêncio não aparecem no trecho grego fornecido. A tradução prioriza a evidência da língua original e não incorpora material ausente dela.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a sequência narrativa e evita importar para o versículo as declarações de culpa e vergonha presentes apenas na versão inglesa consultiva.
