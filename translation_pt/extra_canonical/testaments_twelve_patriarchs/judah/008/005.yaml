source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*κοσμηθεῖσα κόσμῳ νυμφικῷ ἐκάθισεν *ἐν Ἐνὰν *τῇ πόλει *πρὸς τὴν πύλην. 2. Νόμος γὰρ ἦν τῶν Ἀμορραίων τὴν *χηρεύουσαν προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην.'
  language: Greek
  note: Greek from Charles XII.1b-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/005.yaml
  text: And she, having learned that I was going up, adorned herself in bridal array and sat in the city Enaim by the gate. For it was a law of the Amorites that she who was about to marry should sit for seven days by the gate in fornication.
translation:
  language: pt
  text: E ela, enfeitada com trajes nupciais, sentou-se junto ao portão, na cidade de Enaim.[a] Pois era uma lei dos amorreus que a viúva se sentasse por sete dias junto ao portão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz Enan; Enaim é a forma do topônimo adotada aqui.
    reason: Torna transparente a diferença entre a grafia da edição grega e a forma usada na tradução.
  - marker: b
    text: O grego diz literalmente «a que estava viúva» e não contém as palavras «em fornicação». Algumas versões refletem uma leitura ou tradição textual diferente.
    reason: Registra uma divergência substantiva entre a fonte grega fornecida e a versão inglesa de consulta, sem alterar silenciosamente o texto-base.
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: enfeitada com adornos de noiva
  rationale: Reproduz a ideia de ornamentação nupcial de modo natural e digno, sem acrescentar que ela apenas se disfarçou.
- source_word: ἐν Ἐνὰν τῇ πόλει
  choice: na cidade de Enaim
  rationale: Trata Ἐνάν como topônimo; a forma portuguesa “Enaim” harmoniza-se com o nome bíblico conhecido, enquanto a nota registra a forma grega.
- source_word: νόμος
  choice: costume
  rationale: Neste contexto etnográfico, νόμος pode designar uma prática ou norma social, não necessariamente uma lei escrita.
- source_word: τὴν χηρεύουσαν
  choice: a mulher viúva
  rationale: O particípio de χηρεύω significa estar viúva ou viver como viúva. A tradução segue o grego fornecido, que não diz “a que estava para se casar”.
- source_word: προκαθεσθαι
  choice: se sentasse
  rationale: Expressa o ato prescrito de tomar assento ou permanecer sentada; o contexto locativo é completado por “junto ao portão”.
- source_word: παρὰ τὴν πύλην
  choice: junto ao portão
  rationale: Tradução direta da localização, sem introduzir a ideia de prostituição, ausente do texto grego apresentado.
theological_decisions:
- issue: A versão inglesa acrescenta “em fornicação” e entende a mulher como prestes a casar-se.
  choice: 'Seguir o grego: “a mulher viúva se sentasse ... junto ao portão”.'
  alternative: “a mulher que estava para se casar deveria sentar-se ... em fornicação”.
  rationale: O texto grego fornecido contém χηρεύουσαν, “viúva/que vive como viúva”, e não contém termo correspondente a “fornicação”. A tradução não deve importar material ausente da fonte original, embora a divergência textual ou editorial seja assinalada em nota.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário internacional. A formulação evita arcaísmos e explicações interpretativas no corpo do texto; divergências relevantes ficam nas notas.
