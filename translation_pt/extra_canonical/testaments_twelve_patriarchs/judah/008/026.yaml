id: T12P.JUD.8.26
reference: Testament of Judah 8:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν βασιλέως αἴρουσιν τὴν δόξαν τοῦ ἀνδρὸς τὴν δύναμιν, *τοῦ δὲ πτωχοῦ *τὴν πτωχείας ἐλάχιστον στήριγμα.
  language: Greek
  note: Greek from Charles XV.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/026.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike. From a king they take away his glory, and from a strong man his strength, and from a beggar even the little support of his poverty.
translation:
  language: pt
  text: E o anjo de Deus me mostrou que as mulheres dominam o rei e exercem domínio sobre o pobre. Do rei tiram a glória; do homem, a força; e do pobre, até o mínimo amparo que ele tem em sua pobreza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: dominam o rei
  rationale: O verbo κρατέω com genitivo expressa domínio ou controle sobre alguém; a formulação é direta e natural em português.
- source_word: κατακυριεύουσιν
  choice: exercem domínio sobre
  rationale: Preserva a força intensiva do verbo, evitando reduzir a expressão a uma influência meramente informal.
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: do homem, a força
  rationale: Traduz ἀνήρ de modo formal e não acrescenta o adjetivo “forte”, ausente no texto grego apresentado.
- source_word: τὴν πτωχείας ἐλάχιστον στήριγμα
  choice: até o mínimo amparo que ele tem em sua pobreza
  rationale: A construção grega é áspera, mas aponta para o escasso apoio ou sustento disponível ao pobre; esta redação comunica o sentido sem ocultar sua condição de pobreza.
theological_decisions:
- issue: Alcance da afirmação sobre as mulheres
  choice: Manter a generalização retórica do texto sem qualificá-la
  alternative: Abrandar para “algumas mulheres” ou limitar a afirmação ao contexto narrativo
  rationale: O grego emprega αἱ γυναῖκες de forma geral. Acrescentar uma restrição resolveria uma tensão ética e retórica que o texto-fonte não resolve.
- issue: Ideia de duração
  choice: Não incluir “para sempre”
  alternative: 'Seguir a camada inglesa: “dominam para sempre”'
  rationale: Não há no grego fornecido um termo correspondente a “para sempre”; a tradução prioriza a evidência da fonte original.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado na segunda frase. A repetição semântica entre “dominam” e “exercem domínio” reflete os dois verbos gregos distintos e mantém o tom enfático do original.
