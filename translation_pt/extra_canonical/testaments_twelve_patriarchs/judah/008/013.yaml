id: T12P.JUD.8.13
reference: Testament of Judah 8:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ μεθ’ ἡμέρας τινὰς ἠκούσθη ὅτι Θαμὰρ ἐκπεπόρνευκε καὶ ἐν γαστρὶ ἔχει. Ἀκούσας δὲ ἐγὼ εἶπον· Ἐξαγάγετε αὐτὴν καὶ καυθήτω.
  language: Greek
  note: 'Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156): α omits XII.6-10 of β and substitutes an abbreviated LXX form of Gen 38.20, 24-30. The ''three months'' detail is from the Genesis tradition; α has ''μεθ'' ἡμέρας τινὰς'' (''after some days''). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/013.yaml
  text: And after three months it was reported to me, "Tamar your daughter-in-law has played the prostitute, and behold, she is with child." And I, being without understanding in the arrogance of my anger, said, "Bring her out, and let her be burned."
translation:
  language: pt
  text: 'E, depois de alguns dias,[a] ouviu-se que Tamar havia se prostituído e estava grávida. Quando ouvi isso, eu disse: “Levem-na para fora, e que ela seja queimada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta forma diz “depois de alguns dias”; a tradição de Gênesis 38:24 traz “cerca de três meses depois”.
    reason: Sinalizar uma variante cronológica relevante sem substituir a leitura da fonte traduzida.
lexical_decisions:
- source_word: μεθ’ ἡμέρας τινὰς
  choice: depois de alguns dias
  rationale: Traduz diretamente a leitura grega desta passagem, sem importar os “três meses” da tradição de Gênesis nem da camada inglesa de consulta.
- source_word: ἠκούσθη
  choice: ouviu-se
  rationale: 'Preserva a construção impessoal do grego: a notícia se tornou conhecida, sem especificar quem a comunicou.'
- source_word: ἐκπεπόρνευκε
  choice: havia se prostituído
  rationale: Expressa o sentido sexual explícito e a perspectiva acusatória do relato, sem acrescentar a identificação “nora”, ausente no texto grego fornecido.
- source_word: ἐν γαστρὶ ἔχει
  choice: estava grávida
  rationale: Equivalente natural em português para a expressão idiomática grega “ter no ventre”.
- source_word: Ἐξαγάγετε αὐτὴν καὶ καυθήτω
  choice: Levem-na para fora, e que ela seja queimada
  rationale: Mantém a ordem e a força judicial da fala, inclusive a voz passiva do segundo verbo.
theological_decisions:
- issue: Acréscimos interpretativos da camada inglesa
  choice: Não incluir “sem entendimento, na arrogância da minha ira”
  alternative: Incluir a caracterização moral presente no English POB
  rationale: Essa caracterização não consta no original grego apresentado; acrescentá-la resolveria e ampliaria teologicamente a autodescrição de Judá sem apoio nesta fonte.
- issue: Harmonização com Gênesis 38
  choice: Manter “depois de alguns dias” e omitir “sua nora” e “eis que”
  alternative: Harmonizar com a tradição de Gênesis e com o English POB
  rationale: A edição identifica esta forma como uma substituição abreviada, mas o texto grego efetivamente fornecido traz “depois de alguns dias” e não contém esses outros elementos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala mantém tom severo e conciso. Evitou-se linguagem arcaica e também qualquer suavização da acusação ou da sentença.
