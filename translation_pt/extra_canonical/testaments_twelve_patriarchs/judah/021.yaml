  naturalness: O português é moderno, claro e de registro apropriado. A alternância entre “vocês” no discurso aos filhos e “você” na fala dirigida a Judá é natural. A redação proposta conserva essas qualidades.
  terminology: “Realeza”, “sacerdócio”, “primícias”, “rei de Jacó”, “monstros marinhos” e “falsos profetas” são escolhas adequadas. Mantém-se “delícias” com nota explicativa. A nota sobre a dificuldade do v. 8 é necessária, pois o texto grego fornecido é sintaticamente deficiente nesse ponto.
