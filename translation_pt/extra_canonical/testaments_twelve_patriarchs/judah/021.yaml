base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves over him, lest you be utterly destroyed. For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood. To me he gave the things on earth; to him, the things in the heavens. For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.


    For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer him the firstfruits of the delights of the sons of Israel[c]. But you shall be king of Jacob. And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.


    For the kings will be like sea-monsters, swallowing men like fish; they will enslave sons and daughters of free people, and they will seize houses, fields, flocks, and wealth. And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed. And there will be false prophets like storms[a],'
translation:
  language: pt
  text: '**Testamento de Judá 21**


    **1** E agora, meus filhos, ordeno a vocês: amem Levi, para que permaneçam, e não se exaltem acima dele, para que não sejam completamente destruídos. **2** Pois Deus deu a mim a realeza e a ele, o sacerdócio; e submeteu a realeza ao sacerdócio. **3** A mim deu as coisas da terra; a ele, as coisas dos céus. **4** Assim, de fato, o sacerdócio de Deus supera a realeza terrena, a menos que, por causa dos pecados, se afaste do Senhor e seja dominado pela realeza terrena.


    **5** Pois o anjo do Senhor me disse: “O Senhor escolheu Levi acima de você, para se aproximar dele, comer à sua mesa e oferecer-lhe as primícias das delícias dos filhos de Israel.[a] Você, porém, será rei de Jacó”. **6** E você será entre eles como o mar. Pois, assim como nele há justos e injustos — uns são levados cativos e outros enriquecem —, assim também haverá em você todo tipo de gente: uns correrão perigo[b] ao serem levados cativos, e outros enriquecerão, apoderando-se do que pertence aos outros.


    **7** Pois os que reinarem serão como monstros marinhos, engolindo seres humanos como peixes. Escravizarão filhos e filhas de pessoas livres e tomarão casas, campos, rebanhos e riquezas. **8** Injustamente, entregarão aos corvos a carne de muitos,[c] exaltando-se para o mal em sua ganância; avançarão em males e em tamanha arrogância, até se engrandecerem. **9** E haverá falsos profetas como tempestades, e eles perseguirão todos os justos.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “As primícias das delícias dos filhos de Israel” provavelmente são os primeiros e melhores produtos, apresentados como ofertas por Israel.
    reason: cultural_note
  - marker: b
    text: O verbo grego neste ponto apresenta forma textual irregular; “correrão perigo” traduz a leitura provável pelo contexto.
    reason: textual_variant
  - marker: c
    text: O texto grego desta frase é gramaticalmente difícil e parece corrompido. A tradução conserva a imagem claramente legível da carne de muitos e dos corvos, sem acrescentar outra ave que não consta do texto grego fornecido.
    reason: textual_variant
  - marker: d
    text: O testemunho grego fornecido termina depois de “perseguirão todos os justos”; esta tradução se limita ao texto preservado aqui.
    reason: textual_variant
lexical_decisions:
- source_word: παραγγέλλω
  choice: ordeno
  rationale: Mantém a força de uma instrução testamentária vinculante, sem reduzi-la a mero conselho.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: Reproduz diretamente o imperativo ético e usa linguagem portuguesa corrente.
- source_word: ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: não se exaltem acima dele
  rationale: Preserva a imagem vertical de elevar-se acima de Levi.
- source_word: ἐξολοθρευθῆτε
  choice: sejam completamente destruídos
  rationale: Expressa a intensidade do verbo composto e a gravidade da advertência.
- source_word: βασιλεία
  choice: realeza
  rationale: Neste contexto designa principalmente a dignidade e a função régia atribuídas a Judá, não apenas um território.
- source_word: ἱερατεία / ἱερωσύνη
  choice: sacerdócio
  rationale: Termo claro e tradicional para o ofício e a instituição sacerdotal; a repetição também preserva a unidade conceitual.
- source_word: ὑπέταξε
  choice: submeteu
  rationale: Conserva a hierarquia explícita do grego entre realeza e sacerdócio.
- source_word: τὰ ἐπὶ γῆς / τὰ ἐν οὐρανοῖς
  choice: as coisas da terra / as coisas dos céus
  rationale: Mantém o paralelismo espacial amplo do original.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: se afaste do Senhor
  rationale: Comunica queda ou afastamento religioso sem definir além do que a formulação permite.
- source_word: κυριευθῇ
  choice: seja dominado
  rationale: 'Preserva a inversão de autoridade: o sacerdócio pode cair sob o domínio da realeza terrena.'
- source_word: προσεγγίζειν
  choice: se aproximar
  rationale: É natural em português e mantém a conotação cultual do acesso sacerdotal a Deus.
- source_word: ἐντρυφημάτων
  choice: delícias
  rationale: Conserva a ideia de produtos escolhidos ou ricos, esclarecida em nota no contexto das primícias.
- source_word: κήτη
  choice: monstros marinhos
  rationale: Reflete grandes criaturas do mar e se ajusta à comparação subsequente com peixes.
- source_word: πᾶν γένος ἀνθρώπων
  choice: todo tipo de gente
  rationale: Expressa naturalmente a abrangência social da frase, sem exigir a noção biológica moderna de raça.
- source_word: καταιγίδες
  choice: tempestades
  rationale: Mantém a imagem de violência e perturbação aplicada aos falsos profetas.
theological_decisions:
- issue: Relação entre a realeza de Judá e o sacerdócio de Levi
  choice: Deus atribui a realeza a Judá e o sacerdócio a Levi, submetendo a primeira ao segundo.
  alternative: Apresentar os dois ofícios apenas como coordenados, sem hierarquia.
  rationale: O verbo ὑπέταξε declara subordinação real; a tradução não suaviza essa afirmação.
- issue: Condição ligada à superioridade do sacerdócio
  choice: O próprio sacerdócio pode, por causa dos pecados, afastar-se do Senhor e ficar sob domínio da realeza terrena.
  alternative: Entender que é a realeza terrena que se afasta do Senhor.
  rationale: O sujeito gramatical mais próximo é ἡ ἱερατεία; a versão preserva a tensão de uma superioridade sacerdotal que pode ser perdida pela corrupção.
- issue: Privilégio cultual de Levi
  choice: Levi é escolhido para aproximar-se do Senhor, comer à sua mesa e apresentar primícias.
  alternative: Interpretar a mesa apenas como metáfora geral de comunhão.
  rationale: A sequência e o contexto sacerdotal favorecem uma referência cultual, sem excluir ressonâncias de comunhão.
- issue: Alcance da imagem do mar
  choice: Judá e sua esfera régia abrigam tanto os que sofrem cativeiro como os que enriquecem por apropriação injusta.
  alternative: Aplicar a comparação somente às nações em geral, sem referência particular à esfera de Judá.
  rationale: A expressão ἐν σοὶ dirige a comparação a Judá, enquanto πᾶν γένος ἀνθρώπων amplia seu alcance.
- issue: Denúncia dos reis futuros
  choice: Os reis são descritos como predadores que escravizam pessoas livres, confiscam bens e causam mortes.
  alternative: Espiritualizar a passagem como denúncia apenas de poderes demoníacos.
  rationale: Os objetos concretos — filhos, filhas, casas, campos, rebanhos e riquezas — sustentam uma denúncia político-social direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se “vocês” para o plural e “você” para a fala dirigida singularmente a Judá. A sintaxe foi tornada natural sem eliminar a hierarquia entre realeza e sacerdócio, a condicional teologicamente tensa do v. 4 nem as dificuldades textuais dos vv. 6 e 8. A numeração dos versículos foi mantida para consulta.
