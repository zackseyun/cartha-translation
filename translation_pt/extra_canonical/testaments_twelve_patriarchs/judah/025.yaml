  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025.yaml
  text: '1. And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be chiefs of the tribes in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and so all the rest in order.


    2. And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.


    3. And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.


    4. And those who died in sorrow will rise in joy, and the poor for the Lord’s sake will be made rich, and those dying for the Lord’s sake will awake to life.


    5. And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.'
translation:
  language: pt
  text: '1. Depois disso, Abraão, Isaque e Jacó ressuscitarão para a vida; e eu e meus irmãos seremos líderes em Israel: primeiro Levi; em segundo lugar, eu; em terceiro, José; em quarto, Benjamim; em quinto, Simeão; em sexto, Issacar; e todos os demais, sucessivamente.


    2. O Senhor abençoou Levi; o anjo da presença abençoou a mim; os poderes da glória, Simeão; o céu, Rúben; a terra, Issacar; o mar, Zebulom; as montanhas, José; a tenda, Benjamim; as luzes, Dã; o deleite, Naftali; o sol, Gade; e a lua, Aser.[a]


    3. Vocês serão o povo do Senhor e terão uma só língua. Ali não haverá espírito de engano de Belial, pois ele será lançado fora para sempre.[b]


    4. Os que morreram em tristeza ressuscitarão; os pobres por causa do Senhor serão enriquecidos; e os que estiverem morrendo por causa do Senhor despertarão para a vida.


    5. Os cervos de Jacó correrão exultantes, e as águias de Israel voarão com alegria. [Os ímpios prantearão, e os pecadores chorarão.][c] E todos os povos glorificarão o Senhor para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A enumeração está truncada no texto grego primário apresentado depois de “a terra” e “o mar”. As correspondências que completam a sequência — Issacar, Zebulom, as montanhas e a tenda, além de Benjamim — foram supridas segundo a forma mais completa preservada na camada textual de consulta.
    reason: Sinalizar com transparência uma lacuna ou compressão da testemunha grega primária e distinguir o material suprido.
  - marker: b
    text: 'Literalmente: “será lançado para a eternidade” ou “para sempre”. O grego não especifica aqui “no fogo”.'
    reason: Preservar a construção incomum e impedir que um complemento ausente no original seja tomado como parte do texto.
  - marker: c
    text: A fonte grega apresenta entre colchetes a frase sobre os ímpios e os pecadores, indicando dúvida quanto à sua presença no texto.
    reason: Reproduzir a incerteza textual explicitamente marcada na edição de origem.
lexical_decisions:
- source_word: ἔξαρχοι
  choice: líderes
  rationale: O termo designa pessoas que ocupam posição de chefia. “Líderes em Israel” preserva o sentido sem acrescentar “tribos”, palavra ausente do texto grego apresentado.
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: o anjo da presença
  rationale: Tradução formal da expressão, preservando sua linguagem tradicional e sua possível referência à presença divina sem explicá-la no corpo do texto.
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: os poderes da glória
  rationale: Mantém a formulação incomum do grego e evita identificar indevidamente essas “potências/poderes” com uma classe específica de seres.
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  choice: espírito de engano de Belial
  rationale: “Engano” comunica πλάνη com naturalidade e deixa aberta a relação genitiva com Belial, sem transformar a expressão em uma doutrina mais específica.
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: os cervos de Jacó
  rationale: Segue diretamente o texto grego fornecido, que traz Jacó, e não José.
- source_word: ἐν ἀγαλλιάσει
  choice: exultantes
  rationale: Expressa a alegria intensa do substantivo grego em português corrente e digno.
theological_decisions:
- issue: Destino do espírito de engano de Belial
  choice: “será lançado fora para sempre”
  alternative: “será lançado no fogo para sempre”
  rationale: O texto grego fornecido diz εἰς τὸν αἰῶνα, mas não contém “fogo”. “Fora” torna a frase inteligível sem introduzir o destino específico acrescentado pela camada inglesa; a nota registra a forma literal.
- issue: Ressurreição dos que morreram em tristeza
  choice: “ressuscitarão”
  alternative: “ressuscitarão com alegria”
  rationale: A expressão “com alegria” não consta no grego do versículo 4. A tradução preserva a promessa sem ampliar a antítese.
- issue: Sujeito humano que sofre por causa do Senhor
  choice: “os que estiverem morrendo por causa do Senhor”
  alternative: “os que morrerem pelo Senhor”
  rationale: O particípio presente οἱ ἀποθνήσκοντες pode retratar os que estão morrendo; a formulação evita restringir antecipadamente a referência a uma categoria técnica de martírio.
- issue: Cláusula sobre ímpios e pecadores
  choice: incluída entre colchetes com nota textual
  alternative: omitida do texto principal
  rationale: A cláusula aparece entre colchetes na fonte grega fornecida. Mantê-la entre colchetes preserva seu conteúdo e, ao mesmo tempo, sinaliza sua condição textual distinta.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A enumeração do versículo 2 conserva seu caráter poético e elíptico, repetindo “abençoou” apenas onde necessário para compreensão. Não se importaram os acréscimos “tribos”, “fogo” e “com alegria” da camada inglesa quando não apoiados pelo grego fornecido.
