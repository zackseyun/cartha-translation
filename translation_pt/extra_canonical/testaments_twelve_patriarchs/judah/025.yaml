    2. O Senhor abençoou Levi; o anjo da presença abençoou-me; os poderes da glória, Simeão; o céu, Rúben; a terra —; o mar, José; as luzes, Dã; o deleite, Naftali; o sol, Gade; e a lua, Aser.[a]


    3. Vocês serão o povo do Senhor e terão uma só língua. Ali não haverá espírito de engano de Belial, pois ele será lançado para sempre.[b]


    4. Os que morreram em tristeza ressuscitarão; os pobres por causa do Senhor serão enriquecidos; e os que estiverem morrendo por causa do Senhor despertarão para a vida.


    5. Os cervos de Jacó correrão exultantes, e as águias de Israel voarão com alegria. [Os ímpios prantearão, e os pecadores chorarão.][c] E todos os povos glorificarão o Senhor para sempre.'
