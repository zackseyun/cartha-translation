review_pass:
  verdict: revise
  source_fidelity: O texto acompanha bem o grego em 1, 4 e 5, inclusive «os cervos de Jacó» e a cláusula entre colchetes. Contudo, o v. 2 introduz vários pares e imagens (Issacar, Zebulom, montanhas, tenda e Benjamim) que não constam no texto grego primário fornecido. Além disso, «lançado fora» em 3 acrescenta «fora», ausente de ἐμβληθήσεται εἰς τὸν αἰῶνα.
  naturalness: O português é claro e de registro apropriado. A enumeração elíptica do v. 2 pode permanecer natural se a descontinuidade efetivamente presente na fonte for indicada por nota, sem reconstruí-la no corpo do texto.
  terminology: «Senhor», «anjo da presença», «poderes da glória», «Belial» e os nomes próprios estão adequados. «Líderes» é uma solução aceitável para ἔξαρχοι. «Para sempre» traduz adequadamente εἰς τὸν αἰῶνα sem importar o «fogo» da trilha inglesa.
  issues:
  - severity: high
    issue: O versículo 2 é completado com material não presente no texto grego primário fornecido.
    rationale: O texto apresentado passa de «a terra» a «o mar, José» e não contém os pares suplementados na tradução. A nota reconhece a dificuldade, mas apela a uma «camada textual de consulta» não fornecida e o corpo da tradução transforma uma lacuna/descontinuidade da testemunha em texto afirmado.
  - severity: medium
    issue: «Será lançado fora para sempre» acrescenta «fora».
    rationale: O grego diz somente que o espírito será «lançado para sempre/para a eternidade» (ἐμβληθήσεται εἰς τὸν αἰῶνα). A direção ou o destino não é especificado.
  - severity: low
    issue: A redação final de 1 pode refletir mais diretamente a ordem da enumeração.
    rationale: «E depois todos os demais, por ordem» soa mais idiomático e preserva πάντες καθεξῆς sem sugerir uma categoria adicional.
  revised_text: '1. Depois disso, Abraão, Isaque e Jacó ressuscitarão para a vida; e eu e meus irmãos seremos líderes em Israel: Levi primeiro, eu em segundo lugar, José em terceiro, Benjamim em quarto, Simeão em quinto, Issacar em sexto, e depois todos os demais, por ordem.


    2. O Senhor abençoou Levi; o anjo da presença, a mim; os poderes da glória, Simeão; o céu, Rúben; a terra; o mar, José; as luzes, Dã; o deleite, Naftali; o sol, Gade; a lua, Aser.[a]


    3. Vocês serão o povo do Senhor e terão uma só língua. Ali não haverá espírito de engano de Belial, pois ele será lançado para sempre.[b]


    4. Os que morreram em tristeza ressuscitarão; os pobres por causa do Senhor serão enriquecidos; e os que estiverem morrendo por causa do Senhor despertarão para a vida.


    5. Os cervos de Jacó correrão exultantes, e as águias de Israel voarão com alegria. [Os ímpios prantearão, e os pecadores chorarão.][c] E todos os povos glorificarão o Senhor para sempre.'
  revised_footnotes:
  - marker: a
    text: 'A enumeração no texto grego primário fornecido é descontínua depois de «a terra»: não atribui um nome a «a terra» e passa a «o mar, José». A tradução reproduz essa forma sem completar a sequência a partir de outras testemunhas ou reconstruções.'
