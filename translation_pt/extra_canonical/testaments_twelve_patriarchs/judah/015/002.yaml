source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἂν γάρ τις *βασιλεὺς ἐστι² καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας*, δουλεύσας τῇ πορνείᾳ⁶ ὡς κἀγὼ ἔπαθον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/002.yaml
  text: For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered.
translation:
  language: pt
  text: Pois, mesmo que alguém seja rei e pratique imoralidade sexual, é privado da realeza, tendo servido à imoralidade sexual, como eu também sofri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύῃ / πορνείᾳ
  choice: pratique imoralidade sexual / imoralidade sexual
  rationale: Mantém a referência ampla à conduta sexual ilícita, sem restringi-la a uma forma específica, e preserva a repetição deliberada do grego.
- source_word: γυμνοῦται τῆς βασιλείας
  choice: fica privado da realeza
  rationale: Expressa naturalmente a ideia de ser despojado de sua condição ou dignidade régia, preservando a voz passiva e a perda implicada no verbo.
- source_word: δουλεύσας
  choice: por se ter tornado escravo
  rationale: Preserva a forte metáfora de escravidão e apresenta o particípio como explicação da perda da realeza.
- source_word: ὡς κἀγὼ ἔπαθον
  choice: como também aconteceu comigo
  rationale: Reproduz o testemunho pessoal de sofrimento ou experiência adversa sem acrescentar detalhes não presentes no grego.
theological_decisions:
- issue: Relação entre imoralidade sexual, escravidão e perda da realeza
  choice: A escravidão à imoralidade sexual é apresentada como ligada à privação da realeza.
  alternative: Explicitar que a perda é punição divina ou consequência política.
  rationale: O grego não identifica diretamente o agente nem define o mecanismo da perda; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com construção concessiva natural. A repetição de “imoralidade sexual” foi mantida para refletir a coesão retórica do original.
