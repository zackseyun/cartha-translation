review_pass:
  verdict: revise
  source_fidelity: A concessiva, a perda da realeza e a repetição de πορνεία estão bem representadas. Contudo, «como também aconteceu comigo» atenua ἔπαθον, que afirma que Judá sofreu/padeceu. Além disso, «por se ter tornado escravo» explicita uma mudança de estado que não é dita diretamente; δουλεύσας é mais literalmente «tendo servido» (ou «tendo sido escravizado», na leitura metafórica acolhida pelo inglês).
  naturalness: O texto é claro e de registro apropriado. «Mesmo que» e a construção participial «tendo servido» soam naturais em português moderno e acompanham mais de perto a relação sintática do grego.
  terminology: «Imoralidade sexual» preserva adequadamente a amplitude de πορνεία e sua repetição. «Realeza» é aceitável para βασιλεία neste contexto; «servir à imoralidade sexual» conserva a metáfora de sujeição sem especificar um mecanismo para a perda do reinado.
  issues:
  - severity: medium
    issue: A expressão final não traduz explicitamente o sofrimento de Judá.
    rationale: ὡς κἀγὼ ἔπαθον significa «como eu também sofri/padeci», enquanto «como também aconteceu comigo» deixa indeterminado se ele sofreu ou apenas vivenciou algo.
  - severity: low
    issue: «Por se ter tornado escravo» introduz uma nuance aspectual não expressa diretamente.
    rationale: δουλεύσας designa servir como escravo ou estar sujeito; «tendo servido à imoralidade sexual» reproduz a forma e a metáfora sem acrescentar a ideia de tornar-se.
  revised_text: Pois, mesmo que alguém seja rei e pratique imoralidade sexual, é privado da realeza, tendo servido à imoralidade sexual, como eu também sofri.
  revised_footnotes: []
  revision_rationale: A revisão mantém a formulação ampla para πορνεία, a voz passiva e a perda não atribuída a um agente explícito. Ela torna explícito o sofrimento indicado por ἔπαθον e traduz δουλεύσας de modo mais próximo, preservando a metáfora de servidão.
