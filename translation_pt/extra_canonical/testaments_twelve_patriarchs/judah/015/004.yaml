source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε *μετανοήσας ἐπὶ τούτοις¹⁴, οἶνον καὶ κρέα¹⁶ οὐκ¹⁷ ἔφαγον ἕως γήρους¹⁹ μου²⁰, καὶ *πᾶσαν εὐφροσύνην²¹ οὐκ εἶδον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/004.yaml
  text: And indeed, having repented concerning these things, I ate neither wine nor meat until my old age, and I saw no joy at all.
translation:
  language: pt
  text: E, de fato, tendo me arrependido dessas coisas, não comi carne nem bebi vinho até a minha velhice, e não experimentei alegria alguma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: E, de fato
  rationale: Expressa a força confirmativa da partícula sem tornar a frase pesada.
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: tendo me arrependido dessas coisas
  rationale: Preserva o sentido moral de mudança de mente e arrependimento indicado pelo contexto.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: não comi carne nem bebi vinho
  rationale: O grego usa ἔφαγον de modo abrangente com vinho e carne; em português natural, empregam-se os verbos próprios para cada elemento, sem alterar o sentido.
- source_word: ἕως γήρους μου
  choice: até a minha velhice
  rationale: Tradução direta e idiomática, preservando o limite temporal.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: não experimentei alegria alguma
  rationale: O uso de 'ver' com 'alegria' é idiomático no grego; 'experimentar' comunica naturalmente a experiência pessoal sem reduzir πᾶσαν.
theological_decisions:
- issue: Natureza de μετανοέω
  choice: arrependido
  alternative: mudado de ideia
  rationale: Neste contexto penitencial, 'arrependido' comunica melhor a dimensão moral do termo, sem acrescentar uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com ordem ajustada para evitar a construção pouco natural 'comer vinho'. Mantém o tom penitencial e a intensidade da negação final.
