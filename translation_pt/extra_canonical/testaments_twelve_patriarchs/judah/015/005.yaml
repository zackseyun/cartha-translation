  to: E o anjo de Deus me mostrou que as mulheres têm poder sobre o rei e o pobre; elas os dominam. Elas tiram do rei a glória, do homem a força e do pobre até o menor amparo em sua pobreza.[a]
  rationale: A revisão preserva os dois verbos de poder/domínio e deixa claro que rei e pobre são ambos abrangidos por eles. Mantém a leitura cautelosa da sequência final atestada pela nota, sem importar “para sempre” da tradução inglesa.
