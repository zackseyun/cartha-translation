  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ²⁴ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν²⁹ βασιλέως αἴρουσιν³⁰ τὴν δόξαν τοῦ ἀνδρὸς⁵¹ τὴν δύναμιν, *τοῦ δὲ πτωχοῦ³⁴ *τὴν⁵² πτωχείας⁵³ ἐλάχιστον στήριγμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/005.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's support.
translation:
  language: pt
  text: E o anjo de Deus me mostrou que as mulheres têm poder sobre o rei e o pobre; elas os dominam. Elas tiram do rei a glória, do homem a força e do pobre até o menor amparo em sua pobreza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego desta frase é sintaticamente irregular. A tradução entende a parte final como uma série de três perdas: a glória do rei, a força do homem e o menor amparo do pobre em sua pobreza.'
    reason: Sinalizar a dificuldade textual e preservar a incerteza sem tornar o corpo do texto artificialmente obscuro.
lexical_decisions:
- source_word: κρατοῦσι
  choice: exercem poder sobre
  rationale: Expressa o sentido de deter poder ou domínio sobre alguém, sem acrescentar a ideia de duração contida em “para sempre”, que não aparece no grego.
- source_word: κατακυριεύουσιν
  choice: dominam
  rationale: Reproduz a ideia enfática de exercer senhorio ou domínio sobre o pobre em linguagem portuguesa natural.
- source_word: αἴρουσιν
  choice: tiram
  rationale: No contexto, significa remover ou privar alguém de algo.
- source_word: ἐλάχιστον στήριγμα
  choice: o menor amparo
  rationale: Preserva tanto o superlativo ἐλάχιστον quanto a ideia de apoio ou sustento expressa por στήριγμα.
- source_word: πτωχείας
  choice: em sua pobreza
  rationale: Dá forma portuguesa natural ao genitivo grego sintaticamente difícil, relacionando o amparo à condição de pobreza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução segue de perto o grego e não conserva “para sempre” nem “igualmente” da camada inglesa, pois essas ideias não estão explicitamente presentes no texto grego fornecido.
