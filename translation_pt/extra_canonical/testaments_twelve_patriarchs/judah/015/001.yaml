source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας¹ γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/001.yaml
  text: The one who commits sexual immorality, while being ruined, does not perceive it; and while being dishonored, he is not ashamed.
translation:
  language: pt
  text: Quem comete imoralidade sexual não percebe que está sendo despido[a] e, ao ser desonrado, não se envergonha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «exposto»; literalmente, «despido». A imagem também pode implicar perda ou ruína.'
    reason: Esclarece a amplitude metafórica de γυμνούμενος sem apagar sua imagem literal.
lexical_decisions:
- source_word: Ὁ πορνεύσας
  choice: Quem comete imoralidade sexual
  rationale: Expressa naturalmente o particípio substantivado e preserva a referência ampla a conduta sexual ilícita, sem restringi-la a um ato específico.
- source_word: γυμνούμενος
  choice: está sendo despido
  rationale: Mantém a imagem concreta e a voz passiva do grego, em vez de substituí-la pela interpretação mais genérica «está sendo arruinado».
- source_word: οὐκ αἰσθάνεται
  choice: não percebe
  rationale: Reproduz o sentido de falta de percepção ou consciência.
- source_word: ἀδοξῶν
  choice: ao ser desonrado
  rationale: Comunica a perda de honra ou estima implícita no verbo e forma um paralelo claro com «está sendo despido».
- source_word: οὐκ αἰσχύνεται
  choice: não se envergonha
  rationale: Equivalente direto e idiomático, preservando o contraste entre desonra objetiva e ausência de vergonha.
theological_decisions:
- issue: Sentido metafórico de γυμνούμενος
  choice: Preservar a imagem de ser despido no texto
  alternative: «enquanto está sendo arruinado» ou «enquanto fica exposto»
  rationale: O grego traz literalmente a ideia de ser despido. A imagem pode sugerir exposição, perda ou ruína, mas o verso não explicita qual extensão metafórica deve prevalecer; por isso, a tradução evita resolver a ambiguidade silenciosamente.
translation_notes:
  register: Português atual, digno e de leitura ampla. A construção «Quem comete...» evita marcação desnecessária de gênero e soa natural no português brasileiro e internacional.
