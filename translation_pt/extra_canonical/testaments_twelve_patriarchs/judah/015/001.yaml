  source_fidelity: O texto traduz adequadamente a construção proverbial do grego. «Quem comete imoralidade sexual» representa de modo natural o particípio substantivado Ὁ πορνεύσας, sem restringir indevidamente o referente. «Não percebe que está sendo despido» preserva γυμνούμενος, inclusive sua voz passiva e imagem concreta, e «ao ser desonrado, não se envergonha» reproduz com clareza o segundo paralelismo (ἀδοξῶν ... οὐκ αἰσχύνεται).
  naturalness: A redação é fluente, atual e compreensível em português de ampla circulação. A ligação por «que» em «não percebe que está sendo despido» é idiomática e comunica naturalmente aquilo de que a pessoa não se dá conta.
