source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Δέδωκα⁸ γὰρ τὴν ῥάβδον μου, τουτέστι⁹ τὸ στήριγμα τῆς ἐμῆς φυλῆς¹⁰, καὶ τὴν ζώνην μου, τουτέστιν¹¹ τὴν δύναμιν, καὶ τὸ διάδημα¹², τουτέστιν¹³ τὴν δόξαν τῆς βασιλείας μου¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/003.yaml
  text: I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom.
translation:
  language: pt
  text: Pois entreguei meu cajado — isto é, o apoio da minha tribo —, meu cinto — isto é, a minha força — e o diadema — isto é, a glória do meu reino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέδωκα
  choice: entreguei
  rationale: O perfeito grego exprime a ação de dar/entregar com relevância presente; no contexto, “entreguei” comunica naturalmente a cessão dos objetos.
- source_word: ῥάβδον
  choice: cajado
  rationale: Designa uma vara ou bastão; “cajado” preserva tanto o objeto concreto quanto sua associação simbólica com apoio e autoridade.
- source_word: στήριγμα
  choice: apoio
  rationale: Reproduz de modo claro a ideia de sustentáculo ou suporte da tribo.
- source_word: ζώνην
  choice: cinto
  rationale: Equivalente corrente para a faixa usada à cintura, sem tornar o objeto excessivamente técnico.
- source_word: δύναμιν
  choice: força
  rationale: Mantém o sentido básico de poder, capacidade ou força, e corresponde diretamente à explicação simbólica do cinto.
- source_word: διάδημα
  choice: diadema
  rationale: Preserva o termo régio específico, distinto de uma coroa em sentido genérico.
- source_word: δόξαν τῆς βασιλείας μου
  choice: a glória do meu reino
  rationale: Tradução formal e natural que conserva a relação entre o esplendor régio e o reino de Judá.
theological_decisions:
- issue: Valor simbólico dos três objetos
  choice: Manter explicitamente as três interpretações introduzidas por “isto é”
  alternative: Suavizar como comparações ou paráfrases livres
  rationale: O grego usa repetidamente τουτέστι(ν), identificando o cajado, o cinto e o diadema com realidades ligadas à tribo, à força e ao reino; a tradução preserva essa estrutura sem ampliar sua interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pontuação por travessões para tornar claras as explicações parentéticas repetidas. Não há marcadores de nota, pois nenhuma nota textual é necessária neste versículo.
