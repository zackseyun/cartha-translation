  text: I was forty-six years old, and I spent seventy-three years in Egypt.
translation:
  language: pt
  text: Eu tinha quarenta e seis anos e passei setenta e três anos no Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤμην δὲ ἐγὼ ἐτῶν τεσσαράκοντα καὶ ἕξ
  choice: Eu tinha quarenta e seis anos
  rationale: A construção grega expressa idade; em português corrente, «tinha ... anos» é a forma natural. O δέ funciona como conexão discursiva e não exige um «ora» ou «mas» explícito.
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα
  choice: passei setenta e três anos
  rationale: Embora ἐποίησα signifique literalmente «fiz», com uma duração de tempo assume o sentido idiomático de passar ou completar esse período.
- source_word: εἰς Αἴγυπτον
  choice: no Egito
  rationale: Apesar da preposição εἰς, o contexto temporal e o uso da expressão indicam permanência no Egito, não apenas movimento para lá.
