  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/008.yaml
  text: But I did not approach her again for the rest of my life, because I had done this abomination in all Israel.
translation:
  language: pt
  text: Mas nunca mais me aproximei dela enquanto vivi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλ᾽ οὐδὲ
  choice: Mas nunca mais
  rationale: No contexto, a combinação adversativa e negativa introduz a afirmação enfática de que a aproximação não voltou a ocorrer.
- source_word: ἤγγισα αὐτῇ
  choice: me aproximei dela
  rationale: Reproduz diretamente o verbo de aproximação e mantém sem explicitação a possível nuance sexual determinada pelo contexto.
- source_word: ἔτι
  choice: mais
  rationale: Em construção negativa, indica que a ação não ocorreu novamente.
- source_word: ἕως τῆς ζωῆς μου
  choice: enquanto vivi
  rationale: Expressa de modo natural em português o limite temporal ‘até/durante a minha vida’, isto é, pelo restante da vida.
theological_decisions:
- issue: Frase causal presente no inglês de consulta, mas ausente no grego fornecido
  choice: Omitir “porque eu havia cometido essa abominação em todo o Israel”
  alternative: Incluir a frase conforme o English POB
  rationale: A tradução segue prioritariamente o texto grego da edição indicada. A oração causal não consta na fonte fornecida e não deve ser acrescentada sem apoio textual.
translation_notes:
  register: Português atual, claro e digno, com formulação concisa. A expressão “me aproximei dela” conserva a discrição e a ambiguidade contextual do grego.
