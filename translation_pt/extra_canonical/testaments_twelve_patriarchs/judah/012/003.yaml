    issue: O sujeito de “enganou” foi alterado de “sua beleza” para “ela”.
    rationale: A construção grega coordena “não reconheci ela” com “a beleza dela me enganou”; atribuir diretamente o engano à mulher altera a sintaxe e a agência explicitamente expressa no texto-fonte.
  - severity: low
    issue: “Adornos” está no plural, embora κοσμήσεως esteja no singular.
    rationale: O plural pode ser idiomático, mas o singular “adorno” ou “ornamentação” reproduz com maior precisão a formulação do original.
  revised_text: 3 Assim, tendo ficado embriagado de vinho, não a reconheci, e sua beleza me enganou por meio da aparência de seu adorno.
