  text: So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment.
translation:
  language: pt
  text: 3 Assim, tendo ficado embriagado de vinho, não a reconheci, e sua beleza me enganou por meio da aparência de seu adorno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς ... οἴνῳ
  choice: quando fiquei embriagado com vinho
  rationale: Expressa de modo natural o particípio aoristo passivo e preserva o vinho como causa ou meio da embriaguez.
- source_word: οὐκ ἐπέγνων αὐτὴν
  choice: não a reconheci
  rationale: Mantém o sentido direto de ἐπιγινώσκω no contexto, sem ampliar para conhecimento íntimo ou identificação moral.
- source_word: ἠπάτησέ με
  choice: ela me enganou
  rationale: Verte diretamente a ação de induzir ao engano, preservando a atribuição de agência feita pelo narrador.
- source_word: τὸ κάλλος αὐτῆς
  choice: com sua beleza
  rationale: Entende o acusativo como elemento instrumental ligado ao engano, conforme o sentido da frase e a tradição textual consultada.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: por meio da aparência de seus adornos
  rationale: Preserva a ideia de aparência ou apresentação exterior e o valor instrumental de διά com genitivo; o plural idiomático em português representa a ornamentação usada por ela.
