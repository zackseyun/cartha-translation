  source_fidelity: O rascunho preserva a sequência geral, mas desloca indevidamente o sujeito de ἠπάτησέ με. No grego, τὸ κάλλος αὐτῆς (“a beleza dela”) é o sujeito singular de “enganou”, enquanto αὐτήν (“ela”) é objeto de “não reconheci”.
  naturalness: A redação é clara e moderna. “Embriagado com vinho” é compreensível, mas “embriagado de vinho” soa mais idiomático e mantém o valor causal/instrumental.
  terminology: “Não a reconheci” traduz adequadamente ἐπέγνων neste contexto. “Aparência de seu adorno” representa de perto τοῦ σχήματος τῆς κοσμήσεως; o singular preserva melhor o singular grego.
