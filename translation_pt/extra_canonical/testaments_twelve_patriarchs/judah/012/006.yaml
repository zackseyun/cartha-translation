  text: Καλέσας δὲ αὐτὴν⁴⁵, ἤκουσα καὶ τοὺς ἐν μυστηρίῳ λόγους⁴⁶, *οὓς καθεύδων σὺν αὐτῇ ἐν τῇ μέθῃ μου⁴⁷ ἐλάλησα. *Καὶ οὐκ ἠδυνήθην ἀνελεῖν αὐτήν, ὅτι παρὰ Κυρίου ἦν⁴⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/006.yaml
  text: And when I called her, I also heard the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord.
translation:
  language: pt
  text: 6. Depois de chamá-la, ouvi também as palavras secretas que eu havia proferido enquanto dormia com ela, em minha embriaguez. E não pude matá-la, porque isso vinha do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν μυστηρίῳ λόγους
  choice: as palavras secretas
  rationale: Expressa naturalmente a ideia de palavras ditas em segredo, sem acrescentar conotação ritual ou técnica a μυστηρίῳ.
- source_word: καθεύδων σὺν αὐτῇ
  choice: enquanto dormia com ela
  rationale: Preserva a formulação e a possível implicação sexual do grego sem torná-la mais explícita do que o texto.
- source_word: ἐν τῇ μέθῃ μου
  choice: em minha embriaguez
  rationale: Mantém o substantivo e o registro solene do original, indicando o estado de intoxicação.
- source_word: ἀνελεῖν αὐτήν
  choice: matá-la
  rationale: Verte diretamente o sentido contextual de ἀναιρέω como tirar a vida.
- source_word: παρὰ Κυρίου ἦν
  choice: isso vinha do Senhor
  rationale: Preserva a noção de procedência expressa por παρά e a ambiguidade do referente neutro implícito.
theological_decisions:
- issue: Referente de παρὰ Κυρίου ἦν
  choice: porque isso vinha do Senhor
  alternative: porque ela vinha do Senhor
  rationale: O sujeito está implícito no grego. O demonstrativo neutro “isso” mantém aberta a referência ao acontecimento, à situação ou ao que fora revelado, sem identificar de modo indevido a mulher como o referente.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da ambiguidade do enunciado final.
