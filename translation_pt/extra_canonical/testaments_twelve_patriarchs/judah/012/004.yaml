  text: And turning aside to her, I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived.
translation:
  language: pt
  text: 'E, voltando-me para ela, eu disse: “Vou me deitar com você.” E ela disse: “O que você me dará?” E lhe dei meu bastão e meu diadema como penhor. E, quando me uni a ela, ela engravidou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: desviando-me para junto dela
  rationale: Preserva o movimento de se desviar ou voltar em direção a ela, com formulação natural em português.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Vou me deitar com você
  rationale: A expressão funciona como eufemismo sexual no contexto; uma reprodução literal com “entrar” seria pouco natural e poderia soar mais explícita ou estranha em português.
- source_word: ῥάβδον
  choice: bastão
  rationale: Equivalente amplo e corrente para uma vara ou cajado pessoal, sem impor a ideia régia de “cetro”.
- source_word: διάδημα
  choice: diadema
  rationale: Mantém o objeto nomeado no grego; o texto-fonte não contém “anel” nem a expressão “do meu reino”.
- source_word: εἰς ἀρραβῶνα
  choice: como penhor
  rationale: Expressa algo entregue como garantia de cumprimento posterior.
- source_word: συνήλθον αὐτῇ
  choice: me uni a ela
  rationale: Preserva o eufemismo grego para a relação sexual em registro digno e compreensível.
- source_word: συνελήφθη
  choice: ela engravidou
  rationale: No contexto, o passivo idiomático significa conceber ou ficar grávida; “engravidou” é natural em português.
