  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/001.yaml
  text: After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal attire and sat in Enaim, at the city gate of the inn.
translation:
  language: pt
  text: 1 Depois disso, quando Tamar já estava viúva havia dois anos, soube que eu ia subir para tosquiar as ovelhas. Então se enfeitou com trajes de noiva e sentou-se em Enã, junto ao portão da cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης
  choice: já estava viúva
  rationale: Expressa naturalmente em português o estado continuado de viuvez indicado pelo particípio presente, em conjunto com «havia dois anos».
- source_word: ἀνέρχομαι
  choice: eu ia subir
  rationale: Mantém a primeira pessoa de Judá e o sentido de deslocamento para cima, com valor prospectivo natural no discurso indireto.
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: para tosquiar as ovelhas
  rationale: Reproduz de modo direto a finalidade da subida e o sentido específico de tosquiar o rebanho.
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: se enfeitou com trajes de noiva
  rationale: Conserva a ideia de adornar-se com apresentação nupcial; «trajes de noiva» é corrente e mais amplo do que uma única joia ou peça de roupa.
- source_word: ἐν Ἐνὰν
  choice: em Enã
  rationale: Translitera o topônimo grego Ἐνὰν sem substituí-lo pela forma distinta «Enaim» presente na camada inglesa.
- source_word: πρὸς τὴν πύλην
  choice: junto ao portão
  rationale: Traduz a proximidade indicada por πρός e entende πύλη como o portão da cidade, conforme a aposição imediata.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A tradução segue diretamente o grego e não incorpora «da hospedaria», expressão presente na consulta inglesa, mas sem correspondência no texto-fonte fornecido. «Então» explicita apenas a progressão narrativa dos particípios, sem acrescentar conteúdo interpretativo relevante.
