  text: For I said, “Perhaps she acted deceitfully, having received the pledge from another.”
translation:
  language: pt
  text: '7. Pois eles diziam: “Talvez ela tenha agido com engano, depois de receber de outra os penhores, e tenha usado comigo as primeiras palavras.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “tenha usado comigo as primeiras palavras” é incomum, e sua referência exata não é clara.
