lexical_decisions:
- source_word: ἐν δολιότητι ἐποίησε
  choice: tenha agido com engano
  rationale: Expressa naturalmente a ideia de agir de maneira enganosa, sem acrescentar um objeto não explícito ao verbo.
- source_word: παρὰ ἑτέρας
  choice: de outra pessoa
  rationale: Mantém a origem indicada por παρά com genitivo e evita especificar “outra mulher”; embora ἑτέρας seja feminino, o referente não é nomeado no trecho.
- source_word: τοὺς ἀρραβῶνας
  choice: os objetos dados como garantia
  rationale: Preserva o plural grego e torna claro, em português corrente, que se trata dos itens entregues como penhor ou garantia.
- source_word: τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ
  choice: tenha usado comigo aquelas primeiras palavras
  rationale: Segue de perto a construção grega, cuja referência exata permanece obscura, sem eliminar a oração nem resolver sua ambiguidade por conjectura.
