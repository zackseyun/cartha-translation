  text: And after this we came into Egypt to Joseph because of the famine.
translation:
  language: pt
  text: E, depois disso, fomos ao Egito, para junto de José, por causa da fome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: depois disso
  rationale: Reproduz naturalmente a sequência temporal expressa pelo grego.
- source_word: ἤλθομεν
  choice: fomos
  rationale: No contexto de deslocamento ao Egito, o português idiomático prefere “fomos”; a forma verbal mantém a primeira pessoa do plural e o valor narrativo do aoristo.
- source_word: εἰς Αἴγυπτον
  choice: ao Egito
  rationale: Expressa o movimento em direção ao destino indicado por εἰς.
- source_word: πρὸς Ἰωσήφ
  choice: para junto de José
  rationale: Preserva o sentido direcional e pessoal de πρός, isto é, ir ao encontro ou à presença de José, sem reduzi-lo apenas à localização geográfica.
- source_word: διὰ τὸν λιμόν
  choice: por causa da fome
  rationale: Traduz a relação causal de διά com acusativo; “fome” é claro e natural para uma escassez generalizada de alimentos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural e ligeira explicitação idiomática de πρὸς como “para junto de”.
