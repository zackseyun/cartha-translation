  text: For it was a law of the Amorites that a widow should sit openly in prostitution.
translation:
  language: pt
  text: 2. Pois era lei dos amorreus que a viúva se sentasse durante sete dias junto ao portão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νόμος
  choice: lei
  rationale: Equivalente direto e natural para uma norma ou costume obrigatório.
- source_word: τῶν Ἀμορραίων
  choice: dos amorreus
  rationale: Mantém a referência étnica do texto grego em sua forma portuguesa corrente.
- source_word: τὴν χηρεύουσαν
  choice: a viúva
  rationale: O particípio substantivado designa a mulher que ficou viúva; a formulação nominal é mais natural em português.
- source_word: προκαθεσθαι
  choice: ficasse sentada
  rationale: Preserva a ideia de permanecer sentada; a localização pública é expressa pela frase seguinte, sem importar a referência à prostituição encontrada na camada inglesa, mas ausente deste texto grego.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: durante sete dias
  rationale: Expressa naturalmente a duração indicada por ἐπί com acusativo.
- source_word: παρὰ τὴν πύλην
  choice: junto ao portão
  rationale: παρά com acusativo indica posição ao lado ou nas proximidades; 'portão' comunica de modo acessível a entrada pública da cidade ou povoado.
theological_decisions:
- issue: Divergência entre o texto grego fornecido e a camada inglesa quanto à prostituição
  choice: Não incluir referência à prostituição
  alternative: 'Traduzir segundo a camada inglesa: ''se sentasse publicamente em prostituição'''
  rationale: O texto grego primário fornecido contém 'durante sete dias junto ao portão' e não contém expressão correspondente a 'em prostituição'. A tradução deve seguir primeiro a evidência da fonte original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e legível no Brasil. A formulação conserva o caráter de costume legal e a duração e localização explícitas no grego.
