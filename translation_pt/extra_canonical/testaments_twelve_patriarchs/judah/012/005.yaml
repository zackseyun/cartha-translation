lexical_decisions:
- source_word: Ἀγνοῶν
  choice: sem saber
  rationale: Expressa de modo natural o particípio circunstancial, preservando a falta de conhecimento de Judá.
- source_word: ἀνελεῖν
  choice: matá-la
  rationale: Neste contexto, o verbo tem o sentido direto de tirar a vida, e não apenas remover.
- source_word: ἀρραβῶνας
  choice: garantias
  rationale: Designa os objetos entregues como penhor ou garantia; «garantias» é claro no português atual e mantém o valor jurídico da palavra.
- source_word: κατῄσχυνέ
  choice: me envergonhou
  rationale: Preserva o sentido causativo de expor Judá à vergonha mediante a apresentação das garantias.
