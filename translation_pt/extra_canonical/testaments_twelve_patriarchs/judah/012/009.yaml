translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. Evitou-se ampliar a identidade dos habitantes ou atribuir caráter cultual à prostituição, pois isso não está inequívoco no texto apresentado.
