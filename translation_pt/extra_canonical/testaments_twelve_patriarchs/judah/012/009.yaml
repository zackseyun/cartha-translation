  text: Yet those in the city said that there had been no prostitute at the gate, because she had come from another place and sat at the gate for a short time.
translation:
  language: pt
  text: 9. Contudo, os da cidade diziam que não havia prostituta alguma à porta, pois ela viera de outro lugar e se sentara à porta por pouco tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐν τῇ πόλει
  choice: os que estavam na cidade
  rationale: Reproduz de modo natural a expressão grega sem especificar se eram moradores, autoridades ou outro grupo.
- source_word: τελεσικόμενον
  choice: prostituta
  rationale: O contexto exige uma referência à mulher procurada por prostituição; o termo moderno é claro e evita o tom arcaico ou pejorativo de alternativas tradicionais.
- source_word: ἐν τῇ πύλῃ
  choice: junto à porta da cidade
  rationale: Expressa a localização junto ao acesso da cidade em português corrente; a referência à cidade torna explícito o sentido contextual de πύλη.
- source_word: πρὸς βραχύ
  choice: por pouco tempo
  rationale: Mantém diretamente a curta duração indicada pelo grego.
