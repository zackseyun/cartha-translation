lexical_decisions:
- source_word: Καίγε
  choice: E, de fato
  rationale: Reproduz a força enfática da partícula composta, mantendo a ligação com o contexto anterior.
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  choice: em sua maldade
  rationale: Mantém a construção preposicional e o sentido moral de πονηρία sem explicitar uma relação causal que o grego não exige.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: junto com seus filhos
  rationale: Expressa naturalmente a associação indicada por μετά; 'filhos' traduz υἱοί de modo direto neste contexto familiar.
theological_decisions:
- issue: Relação entre a morte e a maldade
  choice: em sua maldade
  alternative: por causa de sua maldade
  rationale: O texto diz ἐν, não uma fórmula causal inequívoca; a tradução preserva a possível ideia de morrer permanecendo em um estado de maldade, sem excluir implicações judiciais sugeridas pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A formulação permanece próxima da sintaxe e da ambiguidade semântica do grego.
