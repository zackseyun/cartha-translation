  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/002.yaml
  text: And when I saw her pouring wine, I was deceived, and I took her, my father not having taken counsel.
translation:
  language: pt
  text: E, ao vê-la servindo vinho, fui enganado e a tomei, sem que meu pai tivesse deliberado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰνοχοοῦσαν
  choice: servindo vinho
  rationale: O particípio descreve a ação de servir ou verter vinho; «servindo vinho» é natural e preserva o sentido no contexto.
- source_word: ἠπατήθην
  choice: fui enganado
  rationale: Mantém a voz passiva e não especifica quem ou o que causou o engano, preservando a abertura do grego.
- source_word: ἔλαβον αὐτήν
  choice: a tomei
  rationale: Reproduz de modo formal a expressão grega, cuja referência exata pode envolver tomá-la por mulher; evita explicitar além do texto.
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: sem que meu pai tivesse sido consultado
  rationale: Entende o genitivo absoluto como circunstância concomitante e oferece português claro. Embora βουλεύομαι possa significar deliberar ou tomar conselho, a construção no contexto permite a ideia de agir sem consultar o pai.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A tradução conserva a passividade de «fui enganado» e a concisão potencialmente ambígua de «a tomei».
