  text: And I knew that the race of the Canaanites was evil, but the impulse of youth blinded my understanding.
translation:
  language: pt
  text: E eu sabia que a linhagem dos cananeus era má, mas o impulso da juventude cegou meu entendimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένος
  choice: linhagem
  rationale: No contexto dos cananeus, indica um grupo de descendência ou povo; “linhagem” preserva esse sentido sem recorrer ao termo moderno e potencialmente enganoso “raça”.
- source_word: πονηρόν
  choice: má
  rationale: Reproduz diretamente a avaliação moral do adjetivo grego, concordando com “linhagem”.
- source_word: διαβούλιον
  choice: impulso
  rationale: Neste contexto, designa a inclinação ou força deliberativa própria da juventude; “impulso” oferece uma formulação natural e mantém a ideia de uma motivação interior.
- source_word: διάνοιαν
  choice: entendimento
  rationale: Expressa a faculdade de percepção e discernimento mental que foi cegada.
