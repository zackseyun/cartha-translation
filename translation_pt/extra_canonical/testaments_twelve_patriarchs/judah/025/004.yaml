base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/004.yaml
  text: And those who died in sorrow will rise in joy, and the poor because of the Lord will be made rich, and those dying because of the Lord will awake to life.
translation:
  language: pt
  text: E os que morreram em tristeza ressuscitarão; os pobres, por causa do Senhor, serão enriquecidos; e os que morrem por causa do Senhor despertarão para a vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λύπῃ
  choice: em tristeza
  rationale: Reproduz de modo direto o estado ou circunstância expresso pela preposição ἐν, sem acrescentar um contraste ausente no texto grego fornecido.
- source_word: ἀναστήσονται
  choice: ressuscitarão
  rationale: No contexto de pessoas mortas, o futuro de ἀνίστημι indica que voltarão a levantar-se dentre os mortos; “ressuscitarão” é natural e preciso em português.
- source_word: διὰ Κύριον
  choice: por causa do Senhor
  rationale: Mantém em ambas as ocorrências o valor causal amplo de διά com acusativo, sem restringi-lo necessariamente a “por amor ao Senhor” ou “por causa da perseguição sofrida pelo Senhor”.
- source_word: πλουτισθήσονται
  choice: serão enriquecidos
  rationale: Preserva a forma passiva futura e o contraste explícito entre pobreza e enriquecimento.
- source_word: ἐξυπνισθήσονται εἰς ζωήν
  choice: despertarão para a vida
  rationale: Conserva a imagem de despertar e traduz εἰς como movimento ou entrada na vida.
theological_decisions:
- issue: A causa expressa por διὰ Κύριον
  choice: por causa do Senhor
  alternative: por amor ao Senhor / por causa de sua fidelidade ao Senhor
  rationale: A formulação escolhida preserva a ambiguidade causal do grego e evita inserir uma explicação martirológica ou devocional não explicitada.
- issue: Ausência de “em alegria” depois de ἀναστήσονται
  choice: Não acrescentar “em alegria”
  alternative: ressuscitarão em alegria
  rationale: A expressão correspondente não consta do texto grego fornecido. Embora apareça na camada inglesa de consulta, acrescentá-la resolveria o verso com material não sustentado pela fonte apresentada.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo claro entre as três afirmações. A repetição de “por causa do Senhor” foi mantida deliberadamente para refletir a repetição grega.
