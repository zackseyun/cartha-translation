base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/005.yaml
  text: And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.
translation:
  language: pt
  text: E os cervos de Jacó correrão exultantes, e as águias de Israel voarão com alegria; [mas os ímpios se lamentarão, e os pecadores chorarão][a]; e todos os povos glorificarão o Senhor para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na edição grega, esta oração aparece entre colchetes, indicando incerteza textual.
    reason: Explicar a preservação dos colchetes da fonte e o estatuto textual incerto da oração.
lexical_decisions:
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: os cervos de Jacó
  rationale: Traduz diretamente a leitura da fonte grega primária. Embora a camada inglesa traga “Joseph”, o texto grego fornecido tem Ἰακώβ, “Jacó”.
- source_word: δραμοῦνται ἐν ἀγαλλιάσει
  choice: correrão exultantes
  rationale: Expressa de modo natural tanto o movimento de δραμοῦνται quanto a alegria intensa de ἐν ἀγαλλιάσει.
- source_word: ἀετοὶ Ἰσραὴλ πετασθήσονται ἐν χαρᾷ
  choice: as águias de Israel voarão com alegria
  rationale: Mantém a imagem poética e verte a expressão grega em português corrente, sem tornar artificial a construção instrumental.
- source_word: δοξάσουσι Κύριον εἰς αἰῶνας
  choice: glorificarão o Senhor para sempre
  rationale: É a formulação portuguesa natural e digna para a ação contínua projetada por εἰς αἰῶνας.
theological_decisions:
- issue: Destino contrastante dos ímpios e pecadores
  choice: Manter a oração no texto, com nota sobre sua incerteza textual
  alternative: Omiti-la, como faz a camada inglesa consultiva
  rationale: A oração aparece na fonte grega fornecida, embora entre colchetes editoriais. Mantê-la com transparência preserva tanto o testemunho textual quanto sua incerteza, sem decidir silenciosamente a questão.
translation_notes:
  register: Português moderno, claro e solene, com imagens poéticas preservadas. Preferiu-se “Jacó” conforme o grego, em vez de “José” da versão inglesa consultiva. A pontuação divide o paralelismo em períodos legíveis sem enfraquecer o contraste.
