  text: And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.
translation:
  language: pt
  text: E o Senhor abençoou Levi; o anjo da presença, a mim; os poderes da glória, Simeão; o céu, Rúben; a terra; o mar, José; os luminares, Dã; o deleite, Naftali; o sol, Gade; e a lua, Aser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego desta edição parece incompleto ou desordenado neste ponto: «a terra» não tem pessoa correspondente, «o mar» aparece numa forma gramatical inesperada, e não são mencionados Issacar, Zebulom nem Benjamim. Outras reconstruções apresentam uma lista mais completa.'
    reason: Alertar o leitor para uma dificuldade textual real sem completar silenciosamente as lacunas a partir da versão inglesa.
lexical_decisions:
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: o anjo da Presença
  rationale: A expressão semítica subjacente indica o anjo associado à presença de Deus; a inicial maiúscula em “Presença” torna essa referência clara sem acrescentar uma identificação doutrinária.
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: os poderes da glória
  rationale: Mantém a formulação ampla e incomum do grego, sem decidir se “poderes” designa seres celestiais, forças ou manifestações.
- source_word: αἱ φωστῆρες
  choice: os luminares
  rationale: “Luminares” preserva o sentido de corpos ou fontes celestes de luz e combina naturalmente com o sol e a lua mencionados depois.
- source_word: ἡ τρυφή
  choice: o deleite
  rationale: Representa o sentido básico de prazer, delícia ou abundância agradável, sem reduzir o termo a luxo material.
theological_decisions:
- issue: Agentes elípticos da bênção
  choice: Conservar a sequência nominal e deixar implícito o verbo “abençoou” depois da primeira oração
  alternative: Repetir “abençoou” em cada membro
  rationale: O grego apresenta uma série elíptica. A pontuação em português permite entendê-la sem transformar as associações poéticas em afirmações mais explícitas do que o texto.
- issue: Lacunas e irregularidade na lista tribal
  choice: Traduzir somente os nomes e elementos presentes no texto grego fornecido e assinalar o problema em nota
  alternative: Completar a lista com Issacar, Zebulom, montanhas, Benjamim e tenda com base na camada inglesa ou em reconstrução textual
  rationale: A fonte grega apresentada omite esses itens e contém uma construção irregular em torno de “terra” e “mar”. Inserir silenciosamente a lista mais completa substituiria o testemunho-fonte por uma reconstrução.
translation_notes:
  register: 'Português moderno, digno e legível, com a cadência solene da enumeração preservada por ponto e vírgula. As formas dos nomes seguem o uso bíblico corrente em português: Levi, Simeão, Rúben, José, Dã, Naftali, Gade e Aser.'
