base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/003.yaml
  text: And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.
translation:
  language: pt
  text: E vocês se tornarão um povo do Senhor, e haverá uma só língua; ali não haverá espírito de engano de Belial, pois ele será lançado para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego fornecido diz literalmente que esse espírito “será lançado para sempre”, sem especificar explicitamente para onde. A expressão “no fogo”, presente em algumas formas do texto, não foi inserida na tradução.
    reason: Assinala a ausência de um destino expresso no texto grego-base e explica por que a tradução não acrescenta “no fogo”.
lexical_decisions:
- source_word: λαὸν Κυρίου
  choice: o povo do Senhor
  rationale: Reproduz de modo natural a relação genitiva e o sentido coletivo do grego.
- source_word: γλῶσσα μία
  choice: uma só língua
  rationale: γλῶσσα pode designar a língua como idioma; “uma só” comunica a unidade expressa pelo numeral μία.
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  choice: espírito de engano de Belial
  rationale: Mantém a cadeia genitiva e a ambiguidade entre um espírito caracterizado pelo engano e um espírito ligado ao engano proveniente de Belial.
- source_word: ἐμβληθήσεται εἰς τὸν αἰῶνα
  choice: esse espírito será lançado para sempre
  rationale: O texto grego fornecido expressa o ato passivo e a duração, mas não contém explicitamente “no fogo”. A repetição de “esse espírito” esclarece o referente neutro singular sem acrescentar um destino ausente.
theological_decisions:
- issue: Destino do espírito de engano
  choice: Não inserir “no fogo” no corpo do texto
  alternative: “será lançado no fogo para sempre”
  rationale: Embora a consulta inglesa inclua “into the fire”, o texto grego fornecido traz apenas εἰς τὸν αἰῶνα depois de um sinal editorial. Inserir “no fogo” resolveria silenciosamente uma possível lacuna ou variante.
- issue: Relação de Belial com o engano
  choice: “espírito de engano de Belial”
  alternative: “espírito enganador de Belial” ou “espírito do engano causado por Belial”
  rationale: A formulação escolhida conserva a abertura semântica dos genitivos gregos e evita definir de forma excessiva a natureza ou procedência do espírito.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural e sintaxe fluente. Conserva “Belial” como nome próprio tradicional e mantém a tensão textual no fim do versículo.
