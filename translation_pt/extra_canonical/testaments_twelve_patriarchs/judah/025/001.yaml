source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXV. Καὶ¹ μετὰ ταῦτα *ἀναστήσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ εἰς ζωήν², *καὶ ἐγὼ καὶ οἱ ἀδελφοί μου ἔξαρχοι³ *ἐν Ἰσραὴλ ἐσόμεθα⁵, πρῶτος Λευί⁶, δεύτερος ἐγώ⁷, τρίτος Ἰωσήφ⁸, τέταρτος Βενιαμίν⁹, *πέμπτος Συμεών, ἕκτος Ἰσαχάρ¹⁰, καὶ¹² *πάντες καθεξῆς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/001.yaml
  text: 'And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be rulers of scepters in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and thus all the rest in order.'
translation:
  language: pt
  text: '25 Depois dessas coisas, Abraão, Isaque e Jacó ressuscitarão para a vida. Eu e meus irmãos seremos líderes em Israel: primeiro Levi; segundo, eu; terceiro, José; quarto, Benjamim; quinto, Simeão; sexto, Issacar; e todos os demais, na devida ordem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεται ... εἰς ζωήν
  choice: ressuscitarão para a vida
  rationale: No contexto escatológico e com εἰς ζωήν, «ressuscitarão para a vida» comunica naturalmente o sentido de levantar-se dentre os mortos, sem reduzir a expressão a um simples «se levantarão».
- source_word: ἔξαρχοι ἐν Ἰσραήλ
  choice: líderes em Israel
  rationale: ἔξαρχοι designa pessoas de posição dirigente ou principal. O texto grego fornecido não contém «cetros» nem «tribos», por isso a tradução evita acrescentar qualquer desses elementos.
- source_word: πάντες καθεξῆς
  choice: todos os demais, na devida ordem
  rationale: καθεξῆς indica sequência ordenada; «os demais» explicita de modo natural que a enumeração continua com todos os irmãos não mencionados nominalmente.
theological_decisions:
- issue: A natureza do retorno de Abraão, Isaque e Jacó à vida
  choice: ressuscitarão para a vida
  alternative: se levantarão para a vida
  rationale: A formulação escolhida torna explícito o sentido normal da expressão neste cenário escatológico, sem definir detalhes sobre o modo ou o momento da ressurreição.
- issue: A autoridade futura de Judá e de seus irmãos
  choice: líderes em Israel
  alternative: governantes de cetros em Israel
  rationale: A tradução segue a leitura do texto grego apresentado, ἔξαρχοι ἐν Ἰσραήλ. «Cetros» não aparece nessa fonte e poderia introduzir uma imagem ou uma estrutura tribal ausente da leitura-base.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com nomes em formas correntes no Brasil. A enumeração usa pontuação clara e mantém Judá em primeira pessoa («eu»), como no grego.
