revisions:
- from: '**Testamento de Judá 8**


    **1.** Eu tinha muitos rebanhos e Hirã, o odolamita, era meu chefe dos pastores.


    **2.** Eu havia ido até ele quando Barsabá, rei de Odolão, chegou. Ele preparou para nós um banquete com bebidas e, depois de insistir comigo, deu-me por esposa sua filha, chamada Suá.


    **3.** Ela me deu Er, Onã e Selá. O Senhor matou os dois primeiros; Selá, porém, continuou vivo.'
  to: '**Testamento de Judá 8**


    **1.** Eu tinha muitos animais e tinha Hirã, o adulamita, como chefe dos meus pastores.


    **2.** Depois que fui até ele, eu estava com ele quando Barsabá, rei de Adulão, chegou. Ele preparou para nós uma festa com bebidas e, depois de insistir comigo, deu-me por esposa sua filha, chamada Sabá.


    **3.** Ela me deu à luz Er, Aunã e Selom. O Senhor matou os dois primeiros; Selom, porém, continuou vivo.'
  rationale: A revisão corrige a harmonização de nomes com Gênesis e com a camada inglesa, conserva as formas atestadas no grego fornecido e ajusta a sintaxe de 8:2. Não acrescenta os motivos das mortes nem qualquer material dos versículos ausentes do excerto grego.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:19:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha o conteúdo básico dos três versículos, inclusive a atribuição direta da morte dos dois filhos ao Senhor. Contudo, ela normaliza indevidamente nomes que, na testemunha grega fornecida, aparecem como Σαβά, Αὐνὰν e Σηλώμ: “Suá”, “Onã” e “Selá” refletem a tradição de Gênesis/a camada inglesa, não as formas deste excerto. A construção inicial de 8:2 também é mais bem representada como Judá estando com Hirã, depois de ter ido até ele.'
  naturalness: O português é claro e de registro narrativo apropriado. “Ela me deu Er” é compreensível, mas “deu-me à luz” exprime com mais naturalidade e precisão o verbo de nascimento. “Muitos animais” é um pouco mais abrangente e seguro para κτήνη do que “muitos rebanhos”.
  terminology: “Chefe dos pastores”, “festa com bebidas”, “insistir comigo” e “matou” são escolhas adequadas. Mantêm-se formas portuguesas usuais para Hirã e Adulão/adulamita, mas as formas pessoais distintivas Aunã e Selom, bem como Sabá, devem ser conservadas conforme o grego apresentado.
  issues:
  - severity: medium
    issue: Os nomes “Suá”, “Onã” e “Selá” não correspondem às formas da fonte grega fornecida.
    rationale: O texto lê Σαβά, Αὐνὰν e Σηλώμ. A tradução deve preservar essas formas distintivas da testemunha, em vez de harmonizá-las com a narrativa canônica ou com o texto inglês de consulta.
  - severity: low
    issue: A abertura de 8:2 não expressa plenamente que Judá estava com Hirã após ir até ele.
    rationale: Πρὸς ὃν ἐλθὼν ἤμην é melhor vertido por uma formulação como “Depois que fui até ele, eu estava com ele”, antes da chegada de Barsabá.
  - severity: low
    issue: “Rebanhos” pode estreitar κτήνη.
    rationale: κτήνη designa animais domésticos/gado em sentido amplo; “animais” preserva essa amplitude.
  revised_text: '**Testamento de Judá 8**


    **1.** Eu tinha muitos animais e tinha Hirã, o adulamita, como chefe dos meus pastores.


    **2.** Depois que fui até ele, eu estava com ele quando Barsabá, rei de Adulão, chegou. Ele preparou para nós uma festa com bebidas e, depois de insistir comigo, deu-me por esposa sua filha, chamada Sabá.


    **3.** Ela me deu à luz Er, Aunã e Selom. O Senhor matou os dois primeiros; Selom, porém, continuou vivo.'
