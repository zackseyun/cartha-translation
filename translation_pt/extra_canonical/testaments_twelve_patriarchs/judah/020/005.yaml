  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/005.yaml
  text: And the Spirit of truth accuses all, and the sinner is consumed from his own heart, and to lift up
translation:
  language: pt
  text: E o espírito da verdade acusa a todos,[a] e o pecador é abrasado pelo fogo do próprio coração e não consegue erguer o rosto diante do juiz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acusa todas as coisas”.'
    reason: πάντων pode ser entendido como masculino (“todos”) ou neutro (“todas as coisas”).
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: o espírito da verdade
  rationale: Mantém a expressão grega em linguagem natural e usa inicial minúscula para não identificar silenciosamente esse espírito com o Espírito Santo, algo que o grego, por si só, não determina.
- source_word: κατηγορεῖ
  choice: acusa
  rationale: Reproduz diretamente o sentido forense de apresentar acusação contra alguém.
- source_word: πάντων
  choice: a todos
  rationale: O genitivo plural pode ser masculino ou neutro; com o verbo 'acusar' e a referência subsequente ao pecador diante do juiz, a leitura pessoal é natural, sem eliminar a alternativa em nota.
- source_word: ἐμπεπύρισται
  choice: é consumido pelo fogo
  rationale: Expressa a imagem de ser incendiado ou abrasado presente no perfeito passivo, com português claro e digno.
- source_word: ἐκ τῆς ἰδίας καρδίας
  choice: que vem do próprio coração
  rationale: 'Preserva ἐκ como indicação de origem: o fogo ou ardor procede do coração do próprio pecador.'
- source_word: ἆραι πρόσωπον πρὸς τὸν κριτὴν οὐ δύναται
  choice: não consegue erguer o rosto diante do juiz
  rationale: Verte a locução idiomática sem omitir a oração final, que está completa no texto grego fornecido; 'diante do juiz' comunica naturalmente πρός nesse contexto forense.
theological_decisions:
- issue: Identidade do 'espírito da verdade'
  choice: espírito com inicial minúscula
  alternative: Espírito da verdade
  rationale: A capitalização como nome divino resolveria uma identificação teológica que o texto grego não explicita; a forma adotada preserva a ambiguidade no contexto dos espíritos contrastantes.
- issue: Origem da condenação do pecador
  choice: o fogo vem do próprio coração
  alternative: o pecador é consumido por seu próprio coração
  rationale: A escolha mantém a preposição de origem ἐκ e a metáfora ígnea do verbo, sem transformar diretamente o coração em agente pessoal da punição.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom digno. A sintaxe foi levemente reorganizada para clareza, preservando a imagem do fogo interior e o cenário judicial. A oração sobre erguer o rosto diante do juiz foi mantida porque consta integralmente no grego fornecido, apesar de estar truncada na camada inglesa mais recente.
