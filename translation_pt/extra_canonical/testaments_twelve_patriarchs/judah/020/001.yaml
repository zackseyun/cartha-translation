id: T12P.JUD.20.1
reference: Testament of Judah 20:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὁδηγεῖ³, ὅτι⁴ ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς⁵ ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα⁷ αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/001.yaml
  text: For it leads astray, because in the delusion of silver they call those who are not gods gods, and it causes the one who has it to fall into ecstasy.
translation:
  language: pt
  text: Pois ela desvia, porque, no engano da prata, chamam de deuses os que não são deuses; e faz aquele que a possui cair em êxtase.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “êxtase” traduz um termo grego que pode indicar um estado de estar fora de si, perturbação ou arrebatamento; o contexto não exige uma experiência religiosa positiva.
    reason: Evita que o leitor moderno atribua automaticamente ao termo um sentido místico favorável, sem substituir a ambiguidade lexical no texto principal.
lexical_decisions:
- source_word: ὁδηγεῖ
  choice: desvia
  rationale: No contexto, o verbo tem força causativa ligada ao engano; “desvia” expressa naturalmente a ideia de conduzir para o erro.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: no engano da prata
  rationale: Preserva a construção compacta e a ambiguidade do genitivo, que pode sugerir tanto o engano produzido pela prata quanto o engano relacionado a ela.
- source_word: τοὺς μὴ ὄντας θεοὺς
  choice: os que não são deuses
  rationale: Reproduz diretamente a negação ontológica do grego sem acrescentar uma identificação interpretativa com ídolos.
- source_word: τὸν ἔχοντα αὐτὴν
  choice: aquele que a possui
  rationale: Mantém o referente pronominal feminino, provavelmente ligado à prata, sem explicitá-lo além do texto.
- source_word: ἔκστασιν
  choice: êxtase
  rationale: É o equivalente lexical mais direto, conservando a ideia de estar fora de si e evitando restringi-la a “frenesi” ou a uma experiência religiosa positiva.
theological_decisions:
- issue: A designação de seres que não são deuses como deuses
  choice: “chamam de deuses os que não são deuses”
  alternative: “chamam deuses aos ídolos”
  rationale: A formulação escolhida conserva a afirmação teológica exata do texto e não identifica interpretativamente os referentes.
- issue: Natureza do estado indicado por ἔκστασις
  choice: “êxtase”
  alternative: “frenesi” ou “ficar fora de si”
  rationale: “Êxtase” preserva a amplitude do termo grego; uma nota esclarece que aqui ele não precisa ter sentido religioso positivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “deuses” foi mantida por fidelidade ao contraste retórico do grego; o ponto e vírgula organiza o período sem alterar sua relação lógica.
