base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/004.yaml
  text: 'For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast.'
translation:
  language: pt
  text: Pois o governante do engano me cegou, e, como homem e como carne corrompida por pecados, não compreendi; e reconheci minha própria fraqueza, julgando-me invencível.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: o governante do engano
  rationale: Mantém a ideia de uma autoridade pessoal ligada ao engano, sem especificar uma identificação que o grego não explicita.
- source_word: ἠγνόησα
  choice: não compreendi
  rationale: Expressa a falta de percepção ou entendimento no contexto de cegueira, em português natural.
- source_word: ὡς ἄνθρωπος καὶ ὡς σὰρξ
  choice: sendo humano e carne
  rationale: Preserva os dois aspectos do grego — humanidade e condição carnal — evitando reduzir ambos a uma só ideia.
- source_word: ἐν ἁμαρτίαις φθαρείς
  choice: corrompida em pecados
  rationale: Conserva a associação explícita entre corrupção e pecados; a concordância com 'carne' produz uma formulação portuguesa fluente.
- source_word: ἐπέγνων τὴν ἐμαυτοῦ ἀσθένειαν
  choice: reconheci minha própria fraqueza
  rationale: Reproduz a ênfase reflexiva de ἐμαυτοῦ e o sentido de reconhecer claramente.
- source_word: νομίζων ἀκαταμάχητος εἶναι
  choice: embora me julgasse invencível
  rationale: Mantém a tensão entre reconhecer a fraqueza e considerar-se invencível; 'embora' torna inteligível a relação concessiva implícita do particípio.
theological_decisions:
- issue: Identidade do 'governante do engano'
  choice: Não identificar nominalmente a figura
  alternative: Traduzir interpretativamente como 'o diabo' ou 'Satanás'
  rationale: O texto grego emprega um título, não um nome; preservar o título evita acrescentar uma identificação teológica não explícita.
- issue: Relação entre fraqueza e pretensa invencibilidade
  choice: Preservar a tensão com 'embora'
  alternative: Reformular como uma sequência causal ou temporal inequívoca
  rationale: A construção participial permite tensão entre autoconhecimento e presunção; o texto não deve ser harmonizado de modo a eliminar essa dificuldade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação segue apenas o versículo grego fornecido; não incorpora os versículos 5–8 presentes na camada inglesa de consulta, pois estão fora da referência solicitada.
