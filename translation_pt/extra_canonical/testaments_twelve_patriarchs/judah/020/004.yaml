  rationale: 'A revisão preserva a sequência e as ambiguidades do grego: a dupla expressão comparativa é mantida, a corrupção permanece associada aos pecados, e o particípio final é traduzido sem impor contraste concessivo nem sucessão temporal. Não são necessárias notas.'
