  text: But the God of my fathers had mercy on me, because I did this in ignorance.
translation:
  language: pt
  text: Mas o Deus dos meus antepassados teve misericórdia de mim, porque fiz isso por ignorância.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν πατέρων μου
  choice: dos meus antepassados
  rationale: Neste contexto, a expressão refere-se aos ancestrais de Judá; “antepassados” transmite esse sentido com clareza no português atual, sem perder a dimensão familiar e histórica.
- source_word: ἐλέησε με
  choice: teve misericórdia de mim
  rationale: Preserva a formulação teológica e relacional do verbo grego, em linguagem natural e dignificada.
- source_word: ἐν ἀγνωσίᾳ
  choice: por ignorância
  rationale: Expressa a circunstância ou causa indicada pela preposição ἐν, sem acrescentar que o ato tenha sido involuntário ou inculpável.
- source_word: τοῦτο ἐποίησα
  choice: fiz isso
  rationale: Tradução direta que mantém a referência demonstrativa sem explicitar aquilo que o texto deste versículo deixa implícito.
theological_decisions:
- issue: Relação entre a misericórdia divina e a ignorância de Judá
  choice: porque fiz isso por ignorância
  alternative: pois agi sem saber
  rationale: 'Mantém a ligação causal expressa por ὅτι e conserva a tensão do texto: a ignorância é apresentada como razão associada à misericórdia, sem declarar que ela elimina a culpa.'
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. “Antepassados” evita a possível leitura restrita de “pais” como progenitores imediatos.
