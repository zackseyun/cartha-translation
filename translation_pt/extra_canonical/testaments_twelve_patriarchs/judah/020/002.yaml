base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/002.yaml
  text: Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless.
translation:
  language: pt
  text: Por causa da prata, meus filhos, perdi meus filhos; e, se o meu arrependimento, a minha humilhação e as orações de meu pai não tivessem vindo em meu auxílio, eu teria morrido sem filhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργύριον
  choice: dinheiro
  rationale: Embora o termo possa significar literalmente “prata”, neste contexto designa dinheiro ou riqueza; “dinheiro” comunica naturalmente a causa da perda sem obscurecer o sentido.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: A primeira ocorrência funciona como vocativo dirigido aos descendentes de Judá; a segunda é objeto de “perdi”. A pontuação preserva essa repetição significativa.
- source_word: μετάνοιά μου
  choice: meu arrependimento
  rationale: Equivalente direto que conserva o sentido de mudança interior e pesar pela conduta.
- source_word: ταπείνωσίς μου
  choice: minha humilhação
  rationale: Preserva a ideia de rebaixamento ou humilhação pessoal, sem convertê-la interpretativamente em “humildade”.
- source_word: συνεδράμον
  choice: tivessem vindo em meu auxílio
  rationale: O verbo expressa convergir para ajudar ou prestar socorro; a formulação portuguesa é natural e mantém o valor contrafactual.
- source_word: ἄτεκνος
  choice: sem filhos
  rationale: Expressa de modo claro e idiomático a condição de morrer sem descendência.
theological_decisions:
- issue: Relação entre arrependimento, humilhação, oração paterna e livramento
  choice: Manter os três elementos coordenados como meios que vieram em auxílio de Judá
  alternative: Explicitar que Deus respondeu a essas ações e orações
  rationale: O grego menciona esses fatores, mas não nomeia explicitamente o agente divino; a tradução evita acrescentar uma explicação teológica ausente do verso.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição “meus filhos... meus filhos” foi mantida porque corresponde a funções sintáticas distintas no grego e produz um efeito retórico deliberado.
