base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/002.yaml
  text: And when we joined battle, we routed them; and we killed those from Shiloh, their allies, and gave them no way of escape.
translation:
  language: pt
  text: Quando entramos em combate, pusemos-nos em fuga; e matamos os homens de Siló, seus aliados, e não lhes demos passagem para entrarem até nós.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma saída”. O grego diz literalmente: “não lhes demos passagem para entrarem em direção a nós”.'
    reason: A construção é incomum, e διέξοδος pode designar tanto uma passagem ou via de acesso como uma saída; a nota preserva a ambiguidade lexical e a formulação direcional da oração final.
lexical_decisions:
- source_word: συνάψαντες
  choice: Quando travamos combate
  rationale: O particípio de συνάπτω, neste contexto militar, indica o momento em que os grupos entraram em combate; a explicitação de “combate” é idiomática e preserva o valor circunstancial.
- source_word: ἐτρέψαμεν
  choice: nós os pusemos em fuga
  rationale: Em contexto bélico, τρέπω significa fazer o inimigo recuar ou fugir; esta formulação é natural em português e mais precisa do que simplesmente “derrotamos”.
- source_word: τοὺς ἀπὸ Σιλὼμ
  choice: os homens de Siló
  rationale: A construção designa as pessoas procedentes da localidade. “Siló” é a forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: διέξοδον
  choice: passagem
  rationale: O substantivo pode indicar passagem, caminho de saída ou via de acesso. “Passagem” combina diretamente com o infinitivo seguinte, que fala em chegar até o grupo de Judá.
- source_word: τοῦ εἰσελθεῖν πρὸς ἡμᾶς
  choice: para chegarem até nós
  rationale: A expressão grega diz literalmente “para entrarem em direção a nós”. A tradução mantém essa direção, em vez de substituí-la sem indicação pela ideia de fuga adotada na camada inglesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ritmo narrativo direto. Conservou-se a primeira pessoa do plural e a sequência militar do original. A tradução segue prioritariamente o grego, registrando em nota a ambiguidade que provavelmente levou a camada inglesa a ver aqui uma rota de fuga.
