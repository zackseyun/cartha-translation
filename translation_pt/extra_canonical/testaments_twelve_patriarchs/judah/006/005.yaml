  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/005.yaml
  text: And having hidden Simeon and the others[a] behind them[b], we seized the height, and utterly destroyed this city also.
translation:
  language: pt
  text: Depois de esconder Simeão e os outros[a] por trás deles[b], tomamos a elevação e destruímos por completo também esta cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega significa literalmente algo como “Simeão e também [outro ou outros]” ou “aquele juntamente com Simeão”. A outra pessoa ou o grupo não é identificado explicitamente.
    reason: lexical_note
  - marker: b
    text: O raro advérbio grego pode significar “por trás” ou “a partir da retaguarda”. Aqui indica que Simeão e os que estavam com ele foram ocultados para agir pela retaguarda.
    reason: cultural_note
lexical_decisions:
- source_word: ὑποκρύψας
  choice: depois de esconder
  rationale: Expressa com naturalidade o particípio aoristo e a ação tática deliberada de ocultar alguém.
- source_word: τὸν τε καὶ Συμεών
  choice: Simeão e os outros
  rationale: A correlação τε ... καί associa Simeão a outra pessoa ou grupo não explicitamente identificado; a formulação mantém essa indeterminação no corpo do texto e a explica em nota.
- source_word: ἐξωπίσθεν
  choice: na retaguarda deles
  rationale: O advérbio raro indica posição por trás ou a partir da retaguarda; esta opção torna clara a manobra sem afirmar mais do que o contexto permite.
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  choice: tomamos a parte alta
  rationale: ἐπιλαμβάνομαι com genitivo denota apoderar-se ou tomar, e τὸ ὑψηλόν substantivado indica a elevação ou terreno alto; a expressão é corrente e clara em português.
- source_word: ἐξωλοθρεύσαμεν
  choice: destruímos por completo
  rationale: Preserva a força intensiva do verbo composto sem recorrer a uma formulação excessivamente técnica ou interpretativa.
- source_word: καὶ ταύτην τὴν πόλιν
  choice: também essa cidade
  rationale: Conserva a força aditiva de καί, apresentando a cidade como mais uma na sequência de conquistas narradas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Parte alta” evita o tom pouco natural de “a altura” e preserva a referência ao terreno elevado. Os marcadores [a] e [b] aparecem no texto principal.
