  source_fidelity: A tradução reproduz adequadamente a sequência tática, a tomada da elevação e a destruição intensiva da cidade. Contudo, «essa cidade» enfraquece o demonstrativo proximal ταύτην; «esta cidade» o preserva melhor. «Por trás deles» traduz mais diretamente ἐξωπίσθεν do que «na retaguarda deles», sem perder a possibilidade de manobra pela retaguarda.
  naturalness: O texto é claro e de registro apropriado. A substituição de «E, depois de» por «Depois de» torna a abertura mais fluida, e «a elevação» é uma formulação natural para o terreno alto substantivado.
  terminology: «Simeão», «tomamos», «destruímos por completo» e «cidade» são adequados. As notas mantêm corretamente a indeterminação do elemento coordenado com Simeão e explicam o advérbio raro sem impor identificação denominacional ou teológica.
