  text: And as we came to the city[a], their women were rolling stones down on us from the summit of the mountain on which the city stood.
translation:
  language: pt
  text: Quando chegamos à cidade[a], as mulheres deles faziam rolar pedras sobre nós, do cume do monte em que ficava a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto-fonte traz τῇ τῇ πόλει, com repetição do artigo no dativo, evidentemente um lapso de copista. A tradução lê apenas τῇ πόλει, “à cidade”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκύλιον
  choice: faziam rolar
  rationale: O imperfeito indica ação contínua ou repetida; a locução preserva a ideia de que as mulheres lançavam sucessivamente as pedras fazendo-as rolar.
- source_word: λίθους ἐφ’ ἡμᾶς
  choice: pedras sobre nós
  rationale: λίθους significa “pedras”, e ἐπί com acusativo expressa aqui direção hostil. “Sobre nós” comunica o movimento dirigido contra o grupo sem acrescentar detalhes ausentes do grego.
- source_word: κορυφῆς τοῦ ὄρους
  choice: cume do monte
  rationale: κορυφή designa o ponto mais alto, e ὄρος uma elevação como monte ou montanha. “Cume do monte” é preciso, natural e mantém a posição elevada das defensoras.
- source_word: ἐν ᾗ ἦν ἡ πόλις
  choice: em que ficava a cidade
  rationale: A oração relativa identifica o monte no qual a cidade estava situada. “Em que ficava a cidade” reproduz esse sentido em português corrente.
