  text: But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[a], we prevailed over them and killed them before they could scale the ascent[b].
translation:
  language: pt
  text: Mas os de Maquir voltaram a nos atacar no quinto dia; e, investindo contra eles com uma espada poderosa[a], nós os vencemos e os matamos antes que escalassem a encosta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo προσδίδωσι, na terceira pessoa do singular do presente, é sintaticamente anômalo neste contexto: ocorre uma mudança repentina para o singular presente dentro de uma narrativa na primeira pessoa do plural e no passado. Pode refletir uma compressão ou alteração de copista, talvez no lugar de uma expressão participial com o sentido de “lançando-se contra eles”. A tradução comunica o sentido aparente da ação sem emendar o texto grego.'
    reason: textual_variant
  - marker: b
    text: τὴν ἀνάβασιν é um acusativo cognato de ἀναβῆναι — literalmente, “subir a subida”. A expressão pode designar uma encosta, passagem ou acesso fortificado que o inimigo procurava alcançar ou escalar.
    reason: lexical_note
lexical_decisions:
- source_word: ἐπῆλθον ἡμῶν
  choice: nos atacar
  rationale: Neste contexto militar, ἐπέρχομαι com genitivo indica uma aproximação hostil. “Atacar” comunica essa força de modo direto e natural.
- source_word: πάλιν
  choice: voltaram a
  rationale: O advérbio assinala a repetição do ataque. A construção “voltaram a nos atacar” é idiomática em português e preserva a ideia de nova investida.
- source_word: προσδίδωσι πρὸς αὐτοὺς
  choice: investindo contra eles
  rationale: Embora a forma verbal seja sintaticamente anômala no contexto, a frase parece descrever uma ação ofensiva dirigida contra o inimigo. A tradução expressa esse sentido aparente sem propor uma emenda ao grego.
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: com uma espada poderosa
  rationale: κραταιός significa forte ou poderoso, e μάχαιρα designa uma espada. A preposição ἐν tem valor instrumental aqui; a formulação conserva o tom marcial elevado.
- source_word: περιγινόμεθα αὐτῶν
  choice: nós os vencemos
  rationale: περιγίγνομαι com genitivo significa obter vantagem ou prevalecer sobre alguém. “Vencemos” é claro, preciso e adequado à narrativa militar.
- source_word: ἀναβῆναι τὴν ἀνάβασιν
  choice: escalassem a encosta
  rationale: A construção cognata significa literalmente “subir a subida” e descreve a subida de uma encosta, passagem ou acesso elevado. “Escalassem a encosta” preserva o movimento ascendente e o sentido tático em português natural.
