lexical_decisions:
- source_word: ὡς ἤμην
  choice: enquanto eu estava
  rationale: Reproduz a circunstância temporal ou concomitante de ὡς com o imperfeito, sem convertê-la numa sequência pontual.
- source_word: ἐν τοῖς ὕδασι Χωζηβά
  choice: junto às águas de Cozeba
  rationale: Em contexto geográfico, ἐν pode indicar localização junto a um curso ou conjunto de águas; a formulação é natural em português sem sugerir que Judá estivesse dentro da água.
- source_word: οἱ ἀπὸ Ἰωβὴλ
  choice: os de Jobel
  rationale: Expressa de modo conciso a origem ou procedência do grupo, preservando Jobel como topônimo incerto.
- source_word: ἦλθον ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: vieram contra nós para guerrear
  rationale: Mantém tanto o movimento hostil de ἐπί quanto a finalidade bélica de εἰς πόλεμον em linguagem portuguesa corrente.
