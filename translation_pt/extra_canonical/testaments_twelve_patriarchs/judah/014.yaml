base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014.yaml
  text: 'These two things turn away a man''s mind[a]. For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.


    Such is the wine-drinker, my children, because the one who gets drunk has regard for no one. For see, it also led me astray, so that I was not ashamed before the multitude of the city. In the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.


    After drinking wine, I was not ashamed of the commandment of God, and I took a Canaanite woman. For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink. But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and feel no shame[c][b], but even boast in his dishonor and think it good.'
translation:
  language: pt
  text: '**Testamento de Judá 14**


    1 E agora lhes digo, meus filhos: não se embriaguem com vinho, pois o vinho desvia a mente da verdade, incita a ira do desejo e leva os olhos ao erro. 2 O espírito da imoralidade sexual tem o vinho como servidor do prazer da mente, porque essas duas coisas afastam o entendimento do ser humano.


    3 Pois, se alguém beber vinho até se embriagar, ele perturba sua mente com pensamentos impuros e aquece seu corpo, levando-o à imoralidade sexual em busca de prazer; comete o pecado e não sente vergonha. 4 Assim é quem se entrega ao vinho, meus filhos, porque aquele que se embriaga não tem consideração por ninguém.


    5 Vejam: o vinho também me desviou, a ponto de eu não sentir vergonha diante da multidão da cidade. À vista de todos, desviei-me para Tamar, cometi um grande pecado e descobri a cobertura da impureza de meus filhos.[a] 6 Depois de beber vinho, não respeitei o mandamento de Deus e tomei por mulher uma cananeia.


    7 Pois quem bebe vinho, meus filhos, precisa de muito discernimento. E este é o discernimento quanto ao beber vinho: enquanto ainda conservar o senso de vergonha, que beba.[b] 8 Mas, se ultrapassar o limite, o espírito do engano[c] entra em sua mente e faz o bêbado falar coisas vergonhosas, agir contra a lei e não sentir vergonha; pelo contrário, ele se gloria em sua desonra e pensa que isso é bom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “expus a vergonhosa cobertura de meus filhos”. A frase grega é difícil e talvez se refira ao fato de o pecado de Judá com Tamar ter trazido à luz a impureza de sua família.'
    reason: lexical_alternative
  - marker: b
    text: A formulação “enquanto ainda conservar o senso de vergonha, que beba” descreve a moderação em termos da permanência do autocontrole. A ideia é que, quando esse senso se perde, a embriaguez já ultrapassou o limite.
    reason: cultural_note
  - marker: c
    text: 'Ou: “o espírito do erro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: desvia a mente da verdade
  rationale: Mantém o movimento moral indicado por διαστρέφει sem reduzir νοῦς a mero intelecto abstrato.
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: incita a ira do desejo
  rationale: Conserva a construção incomum e sua possível tensão sem substituir o genitivo por uma explicação não expressa no grego.
- source_word: πνεῦμα τῆς πορνείας
  choice: espírito da imoralidade sexual
  rationale: Preserva πνεῦμα e traduz πορνεία por uma expressão moderna e abrangente, sem acrescentar uma identificação doutrinária.
- source_word: διάνοια
  choice: entendimento
  rationale: No contexto exortativo, refere-se à faculdade moral e intelectual afetada pelo vinho; 'entendimento' é claro e mantém distinção estilística de νοῦς.
- source_word: συνταράσσει
  choice: perturba
  rationale: Expressa a forte agitação interior do verbo composto em português natural.
- source_word: πάροινος
  choice: quem se entrega ao vinho
  rationale: Comunica uma relação habitual e desordenada com o vinho, sem usar prematuramente 'bêbado', reservado para μέθυσος no versículo 8.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: não tem consideração por ninguém
  rationale: Abrange a perda de contenção social e moral, mais ampla que a ideia estrita de sentir vergonha.
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: desviei-me para Tamar
  rationale: Retém a imagem de desvio moral e a direção expressa por πρός.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: descobri a cobertura da impureza de meus filhos
  rationale: Segue de perto a frase metafórica e difícil, deixando sua opacidade visível em vez de impor uma interpretação familiar ou sexual específica.
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: não respeitei o mandamento de Deus
  rationale: O objeto direto de um verbo de vergonha produz um idiomatismo difícil; 'não respeitei' comunica a falta de consideração reverente pelo mandamento.
- source_word: σύνεσις
  choice: discernimento
  rationale: Aqui designa prudência e autocontrole no beber; 'discernimento' soa natural e conserva a dimensão moral.
- source_word: αἰδώς
  choice: senso de vergonha
  rationale: Torna explícito que se trata da contenção moral e social que a embriaguez elimina, preservando a repetição temática da vergonha.
- source_word: αἰσχρορρημονεῖν
  choice: falar coisas vergonhosas
  rationale: Representa o conteúdo ou caráter vergonhoso da fala sem recorrer a formulação arcaica.
theological_decisions:
- issue: Grau de personificação de πνεῦμα τῆς πλάνης
  choice: o espírito do engano
  alternative: um espírito de erro; a ilusão
  rationale: O grego traz artigo definido e o substantivo πνεῦμα; a tradução conserva ambos, mas não identifica a entidade nem explica sua natureza além do texto.
- issue: Natureza do 'espírito da imoralidade sexual'
  choice: manter a expressão personificada sem identificá-la
  alternative: traduzir de modo impessoal como 'o impulso da imoralidade sexual'
  rationale: A formulação grega apresenta πνεῦμα como agente que emprega o vinho; despersonificá-la resolveria uma tensão do texto.
- issue: Confissão de Judá sobre Tamar e seus filhos
  choice: preservar literalmente a imagem da cobertura da impureza
  alternative: explicitar que o pecado expôs a vergonha ou impureza da família
  rationale: A cláusula grega é obscura e metafórica; uma explicação direta na tradução excederia a evidência textual.
- issue: A máxima sobre beber enquanto há vergonha
  choice: manter a permissão aparente, com nota explicativa
  alternative: parafrasear como uma proibição geral do vinho
  rationale: O texto associa o limite à conservação da vergonha ou autocontenção. Uma proibição absoluta eliminaria a tensão presente na formulação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A exortação paterna foi mantida por 'meus filhos'; termos morais foram vertidos sem arcaísmos. A numeração dos oito versículos foi incluída porque a fonte grega fornecida contém todo o capítulo, inclusive o início ausente da camada inglesa de consulta. As construções obscuras dos versículos 5 e 7 foram preservadas no texto e esclarecidas apenas em notas.
