review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha bem o texto grego em toda a unidade, incluindo a personificação de πνεῦμα, a advertência moral sobre o vinho, a linguagem confessional de Judá e a cláusula obscura sobre a “cobertura da impureza”. A única revisão segura é em 14.3: a formulação “aquece seu corpo para o prazer da imoralidade sexual” torna πρὸς ἡδονήν dependente de “imoralidade sexual” de modo excessivamente estreito. A revisão conserva os dois movimentos do grego — rumo à imoralidade sexual e em busca de prazer.'
  naturalness: O registro é moderno, digno e legível em português internacional com boa fluência brasileira. “Quem se entrega ao vinho”, “não tem consideração por ninguém” e “senso de vergonha” são escolhas naturais para o contexto. A imagem de 14.5 permanece deliberadamente opaca, como deve permanecer.
  terminology: “Imoralidade sexual” traduz πορνεία de modo atual; “espírito do engano” preserva πνεῦμα τῆς πλάνης sem impor uma identificação doutrinária; “discernimento” comunica bem σύνεσις. Tamar e “cananeia” estão corretamente grafados. As notas conservam adequadamente as alternativas e a dificuldade textual.
  issues:
  - severity: low
    issue: Relação entre prazer e imoralidade sexual em 14.3
    rationale: Em “aquece seu corpo para o prazer da imoralidade sexual”, o português pode sugerir que o prazer é qualificado pela imoralidade sexual. O grego distingue εἰς πορνείαν (“para/rumo à imoralidade sexual”) de πρὸς ἡδονήν (“para/em busca de prazer”). Uma pequena reorganização torna essa dupla relação mais clara sem interpretar além do texto.
