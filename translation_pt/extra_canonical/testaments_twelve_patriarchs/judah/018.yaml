base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018.yaml
  text: '1. The Lord gave me favor because I obeyed my father. 2. Therefore I never grieved Jacob my father, for I did everything he told me. 3. And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me in the same way. 4. And I know what evils you will do in the last days.


    5. Guard yourselves, therefore, my children, from sexual immorality and from the love of money, and listen to Judah your father. 6. For these turn one away from the law of God, and blind the purpose of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor. 7. They deprive his soul of every goodness, and hold him fast in pains and labors; they drive sleep away from him, and consume his flesh. 8. They hinder the sacrifices of God, and he does not remember the blessing of God. He does not listen when a prophet speaks, and he resents words of godliness. 9. For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.'
translation:
  language: pt
  text: '**Testamento de Judá 18**


    1. Eu sei quais males vocês praticarão nos últimos dias.[a]


    2. Portanto, meus filhos, guardem-se da imoralidade sexual e do amor ao dinheiro e escutem Judá, seu pai. 3. Pois isso afasta da lei de Deus, cega o discernimento da alma, ensina a arrogância e não permite que alguém tenha misericórdia do seu próximo. 4. Priva sua alma de toda bondade, mantém essa pessoa em dores e fadigas, afasta dela o sono e consome sua carne. 5. Impede os sacrifícios de Deus, e ela não se lembra da bênção de Deus. Não dá ouvidos quando um profeta fala e se irrita com palavras de piedade. 6. Pois é escrava de duas paixões opostas e não consegue obedecer a Deus, porque isso cegou sua alma; mesmo de dia, anda como se fosse noite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na edição grega utilizada, as palavras “nos últimos dias” aparecem entre colchetes, indicando incerteza textual editorial.
    reason: Preserva de forma visível a incerteza marcada no texto-fonte fornecido.
lexical_decisions:
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Expressa de modo claro e atual o sentido amplo de conduta sexual ilícita, sem restringi-lo a uma única prática.
- source_word: φιλαργυρία
  choice: amor ao dinheiro
  rationale: Reproduz diretamente a ideia de apego ou afeição pelo dinheiro, em linguagem comum e digna.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: o discernimento da alma
  rationale: O termo aponta para a faculdade interior de deliberar ou formar juízo; “discernimento” comunica essa função com naturalidade.
- source_word: ὑπερηφανία
  choice: arrogância
  rationale: Transmite a soberba ensinada pelas paixões mencionadas, em português corrente.
- source_word: πόνοις καὶ μόχθοις
  choice: dores e fadigas
  rationale: 'Mantém os dois aspectos da expressão: sofrimento e trabalho extenuante.'
- source_word: λόγους εὐσεβείας
  choice: palavras de piedade
  rationale: Preserva o sentido religioso de εὐσέβεια sem impor terminologia confessional específica.
- source_word: προσοχθίζει
  choice: se irrita com
  rationale: Verbo indica desagrado, irritação ou ressentimento diante dessas palavras; a formulação escolhida é natural e não enfraquece a reação negativa.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: mesmo de dia, anda como se fosse noite
  rationale: Conserva a imagem final do texto grego, ausente da camada inglesa fornecida.
theological_decisions:
- issue: Referência das ações atribuídas aos dois vícios
  choice: Manter “essas coisas” no início e depois empregar a pessoa genérica no singular
  alternative: Fazer de cada vício, ou apenas do amor ao dinheiro, o sujeito explícito de todas as ações
  rationale: O grego começa com ταῦτα, referente à imoralidade sexual e ao amor ao dinheiro, mas passa a pronomes que descrevem a pessoa dominada por eles. A tradução conserva esse movimento sem decidir que somente um dos vícios produz todos os efeitos.
- issue: Sujeito implícito de ἐτύφλωσε em 18.6
  choice: “porque isso cegou sua alma”
  alternative: “porque elas cegaram sua alma” ou “porque o amor ao dinheiro cegou sua alma”
  rationale: O verbo grego está no singular e não declara expressamente o sujeito. “Isso” conserva a referência aberta ao estado de escravidão ou à força antes descrita, sem harmonizá-la silenciosamente com o plural.
- issue: Sacrifícios de Deus
  choice: “sacrifícios a Deus”
  alternative: “sacrifícios de Deus”
  rationale: O genitivo grego pode indicar sacrifícios pertencentes ou destinados a Deus; em português, “a Deus” comunica com mais clareza os sacrifícios oferecidos a ele, sem acrescentar uma prática ritual específica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Empregou-se “vocês” para a exortação plural e “a pessoa” como referência humana genérica, evitando o masculino não marcado quando isso podia ser feito sem alterar o sentido. O tom permanece solene e admonitório, com sintaxe clara e sem vocabulário denominacional.
