    rationale: O grego diz que o vício priva a alma dele de todo bem, mas retém “a ele” em dores e fadigas e remove o sono “dele”. O rascunho usa “mantém-na presa” e “afastam dela”, fazendo da alma o objeto dessas duas ações.
  - severity: medium
    issue: “Serve a duas paixões opostas” enfraquece δουλεύει em 18.6
    rationale: O verbo significa estar escravizado ou submetido como escravo. “É escravo de” preserva a imagem e a intensidade do original.
  - severity: low
    issue: “Sacrifícios a Deus” resolve o genitivo Θεοῦ
    rationale: Embora a formulação seja idiomática, “sacrifícios de Deus” preserva a construção-fonte sem decidir entre nuanças possíveis do genitivo.
  - severity: low
    issue: A nota b é indevida
    rationale: A frase final grega já está devidamente traduzida no corpo do texto. A omissão na camada inglesa de consulta não é uma variante textual nem requer nota para o leitor português.
