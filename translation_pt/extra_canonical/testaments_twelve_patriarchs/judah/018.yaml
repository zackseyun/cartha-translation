  naturalness: O português é claro, moderno e adequado ao registro exortativo. As revisões propostas tornam mais nítida a alternância entre os vícios e a pessoa submetida a eles, sem sacrificar a fluência.
  terminology: “Imoralidade sexual”, “amor ao dinheiro”, “discernimento”, “arrogância” e “palavras de piedade” são escolhas adequadas. “Ser escravo de” traduz mais plenamente a força de δουλεύει do que apenas “servir”.
