  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023.yaml
  text: 'Until the coming of the God of righteousness[a], to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me with an oath not to blot out the kingdom.


    Great indeed is my grief, my children, because of the acts of sexual immorality and sorceries that you will practice in the kingdom, following ventriloquists and omens and demons of deception. You will make your daughters musicians and prostitutes, and you will mingle in the abominations of the nations. Because of these things the Lord will bring upon you famine and pestilence, death and a sword of vengeance, siege, and the insults of enemies and friends[d][c][b]. By foreigners my kingdom will be brought to its end.'
translation:
  language: pt
  text: '**Testamento de Judá 23**


    **1** Grande é a minha tristeza, meus filhos, por causa dos atos de imoralidade sexual e das feitiçarias que vocês praticarão no reino, seguindo os que falam pelo ventre[a], os presságios e os demônios do engano. **2** Vocês farão de suas filhas musicistas e mulheres públicas[b] e se envolverão nas abominações das nações.


    **3** Por causa dessas coisas, o Senhor trará sobre vocês fome e peste, morte e espada vingadora, cerco, cães para despedaçá-los, insultos dos inimigos, destruição às mãos dos inimigos[c], gangrena dos olhos, matança de crianças pequenas, saque dos bens, incêndio dos templos de Deus, devastação da terra e a escravidão de vocês mesmos entre as nações. **4** Eles castrarão seus filhos para que sejam eunucos para as mulheres deles.


    **5** Até que o Senhor de vocês os visite, vocês se arrependam de todo o coração, andem em todos os seus mandamentos, e ele os faça voltar do cativeiro entre as nações.


    [a] Literalmente, “os que falam pelo ventre”; no contexto antigo, eram médiuns que alegavam transmitir vozes de espíritos.


    [b] A expressão grega “musicistas e mulheres públicas” provavelmente se refere a filhas transformadas em artistas de entretenimento e prostitutas.


    [c] A expressão grega também pode ser entendida literalmente como “destruição dos inimigos”; o contexto da lista de calamidades favorece “destruição às mãos dos inimigos”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os que falam pelo ventre”; no contexto antigo, eram médiuns que alegavam transmitir vozes de espíritos.
    reason: cultural_note
  - marker: b
