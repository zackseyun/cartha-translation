review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto a α-coluna grega fornecida e, corretamente, inclui toda a longa enumeração de calamidades em 23.3, ausente da camada inglesa abreviada. Há, porém, duas pequenas explicitações interpretativas que devem ser corrigidas: ταῖς γυναιξὶν αὐτῶν não diz explicitamente “a serviço das mulheres”, e a construção comprimida de 23.5 é mais bem preservada sem introduzir “Isso durará” ou transformar a visitação em uma oração temporal explicativa.'
  naturalness: O português é claro, atual e adequado ao registro testamentário. A revisão melhora a precisão de 23.4 e dá a 23.5 uma cadência mais natural, mantendo a sintaxe difícil do original sem alegar uma sequência causal que o grego não resolve plenamente.
  terminology: “Atos de imoralidade sexual”, “feitiçarias”, “os que falam pelo ventre”, “presságios”, “demônios do engano”, “mulheres públicas”, “espada vingadora”, “gangrena dos olhos” e “cativeiro” são escolhas defensáveis. “Mulheres públicas” recebe esclarecimento apropriado em nota. A nota sobre ἀπώλειαν ἐχθρῶν preserva corretamente a ambiguidade do genitivo.
  issues:
  - severity: medium
    issue: '23.4: “a serviço das mulheres deles” acrescenta uma relação de serviço que não está expressa.'
    rationale: O grego diz εἰς εὐνούχους ταῖς γυναιξὶν αὐτῶν, literalmente algo como “como eunucos para as mulheres deles”. É melhor manter a formulação concisa e não especificar a natureza do vínculo.
  - severity: medium
    issue: '23.5: “Isso durará até que ... quando ...” introduz uma duração e uma relação temporal-explicativa ausentes do grego.'
    rationale: Ἕως ἂν ... seguido de formas sintaticamente irregulares é uma construção difícil. “Até que o Senhor de vocês os visite, vocês se arrependam...” preserva a ligação sem decidir se o arrependimento antecede, acompanha ou resulta da visitação.
