    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἀσελγείας
  choice: atos de imoralidade sexual
  rationale: Expressa a devassidão sensual e desavergonhada do termo de modo claro e atual.
- source_word: γοητείας
  choice: feitiçarias
  rationale: Designa práticas mágicas ilícitas no catálogo de vícios.
- source_word: ἐγγαστρομύθους
  choice: os que falam pelo ventre
  rationale: Preserva a imagem concreta do grego, enquanto a nota esclarece sua referência a médiuns ou praticantes necromânticos.
- source_word: κληδόσι
  choice: presságios
  rationale: Refere-se a sinais ou palavras fortuitas interpretados para fins divinatórios.
- source_word: δαίμοσιν πλάνης
  choice: demônios do engano
  rationale: Mantém o genitivo grego e sua possível ideia de qualidade ou efeito sem reduzi-lo a superstição genérica.
- source_word: μουσικὰς καὶ δημοσίας
  choice: musicistas e mulheres públicas
  rationale: Conserva a formulação do grego; a nota explicita a provável referência a entretenimento público e prostituição.
- source_word: ἐπιμιγήσεσθε
  choice: se envolverão
  rationale: Transmite associação e participação nas abominações sem restringir indevidamente o verbo à união sexual.
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: espada vingadora
  rationale: Preserva a personificação e o valor judicial ou retributivo da expressão.
- source_word: κύνας εἰς διασπασμόν
  choice: cães para despedaçá-los
  rationale: Reproduz a imagem violenta e concreta do juízo.
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: gangrena dos olhos
  rationale: σφακελισμός denota necrose, gangrena ou putrefação; a tradução mantém a especificidade corporal.
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: saque dos bens
  rationale: ὑπάρχοντα designa posses ou bens, e ἁρπαγή indica sua tomada violenta.
- source_word: ἐκτεμοῦσι
  choice: castrarão
  rationale: O verbo indica literalmente cortar ou mutilar, e o complemento “para fazê-los eunucos” determina o sentido.
- source_word: ἀναγάγῃ ... ἐκ τῆς αἰχμαλωσίας
  choice: os fizer voltar do cativeiro
  rationale: Expressa restauração e retorno para fora do cativeiro em português natural.
theological_decisions:
- issue: Relação entre visitação divina, arrependimento e retorno do cativeiro no versículo 5
  choice: A visitação ocorre quando o povo se arrepende de todo o coração e passa a andar nos mandamentos; o Senhor então o faz voltar do cativeiro.
  alternative: Até que o Senhor os visite; arrependam-se de todo o coração, andando em seus mandamentos, e ele os fará voltar.
  rationale: A sintaxe grega é comprimida e irregular. A redação escolhida torna a sequência inteligível sem definir um sistema doutrinário rígido sobre a prioridade entre visitação divina e arrependimento humano.
- issue: Sentido de “demônios do engano”
  choice: Manter a referência explícita a demônios vinculados ao engano.
  alternative: Espíritos enganadores ou espíritos da ilusão.
  rationale: A tradução conserva a linguagem religiosa específica do texto e não a reduz a uma metáfora psicológica.
- issue: Plural “templos de Deus”
  choice: Conservar o plural da fonte grega.
  alternative: O templo de Deus.
  rationale: Embora o singular pudesse parecer historicamente mais esperado em contexto judaico, a fonte diz ναῶν no plural; não se harmoniza silenciosamente o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros e internacionais. A enumeração severa e cumulativa do grego foi preservada. O trecho anterior presente na camada inglesa não foi incluído, pois não consta na fonte grega fornecida para este capítulo.
