source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε² οὖν, τέκνα μου, *τὸν ὅρον τοῦ οἴνου³, *ἔστι γὰρ ἐν αὐτῷ τέσσαρα⁵ πνεύματα πονηρά⁷, ἐπιθυμίας, πυρώσεως, ἀσωτίας, αἰσχροκερδίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/001.yaml
  text: 'Guard yourselves, therefore, my children, from the boundary of wine; for in it there are four evil spirits: desire, burning passion, debauchery, and shameful gain.'
translation:
  language: pt
  text: 'Portanto, meus filhos, tenham cuidado com o limite do vinho[a], pois nele há quatro espíritos maus: desejo, ardor, devassidão e lucro vergonhoso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é incomum; também pode ser entendida como “a medida do vinho” ou “o limite ao beber vinho”.
    reason: Registra uma ambiguidade lexical genuína em τὸν ὅρον τοῦ οἴνου sem resolvê-la silenciosamente no texto principal.
lexical_decisions:
- source_word: Φυλάξασθε
  choice: tenham cuidado
  rationale: Expressa a advertência do imperativo médio com naturalidade em português, sem acrescentar uma proibição absoluta.
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: com o limite do vinho
  rationale: Preserva a metáfora incomum e a ambiguidade do grego, que pode apontar para o limite ou a medida no consumo do vinho.
- source_word: ἐπιθυμίας
  choice: desejo
  rationale: Mantém o sentido amplo do termo, sem restringi-lo indevidamente a desejo sexual.
- source_word: πυρώσεως
  choice: ardor
  rationale: Comunica a ideia de queima ou inflamação figurada em linguagem portuguesa concisa e natural.
- source_word: ἀσωτίας
  choice: devassidão
  rationale: Reflete conduta dissoluta e desregrada, sentido mais adequado aqui do que mera prodigalidade ou desperdício.
- source_word: αἰσχροκερδίας
  choice: lucro vergonhoso
  rationale: Reproduz os componentes semânticos de ganho e vergonha presentes no composto grego, sem convertê-lo apenas em ganância.
theological_decisions:
- issue: Relação entre o vinho e os quatro espíritos maus
  choice: “nele há”
  alternative: “por meio dele atuam” ou “dele procedem”
  rationale: Segue a formulação locativa do grego ἐν αὐτῷ e conserva sua tensão, sem explicar se o vinho contém, ocasiona ou favorece esses espíritos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento exortativo familiar em “meus filhos”. A construção incomum “limite do vinho” foi mantida por fidelidade à expressão grega e esclarecida em nota.
