id: T12P.JUD.16.3
reference: Testament of Judah 16:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Εἰ δὲ θέλετε σωφρόνως ζῆσαι, μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε¹⁵, ἵνα μὴ ἁμαρτήσητε¹⁶ ἐν λόγοις ὕβρεως¹⁷ καὶ μάχαις²⁰ καὶ συκοφαντίαις²¹ καὶ παραβάσεσι²² ἐντολῶν²³ Θεοῦ²⁴, καὶ ἀπολεῖσθε²⁵ οὐκ²⁶ ἐν καιρῷ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/003.yaml
  text: But if you want to live with self-control, do not touch wine at all, lest you drink and sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.
translation:
  language: pt
  text: Mas, se vocês querem viver com domínio próprio, não toquem de modo algum no vinho, para que não pequem com palavras insolentes, brigas, calúnias e transgressões dos mandamentos de Deus, e não pereçam antes da hora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “não no tempo de vocês”.'
    reason: Registra a expressão grega incomum por trás da formulação idiomática “antes da hora”.
lexical_decisions:
- source_word: σωφρόνως
  choice: com domínio próprio
  rationale: Expressa a ideia de vida sóbria, sensata e disciplinada, preservando aqui a ênfase ética no autocontrole.
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: não toquem de modo algum no vinho
  rationale: Mantém a força enfática da proibição e a imagem concreta de não tocar no vinho.
- source_word: λόγοις ὕβρεως
  choice: palavras insolentes
  rationale: ὕβρις indica insolência, ultraje ou arrogância ofensiva; a escolha preserva tanto a atitude como seu caráter verbal.
- source_word: μάχαις
  choice: brigas
  rationale: Termo corrente e natural para conflitos ou contendas interpessoais.
- source_word: συκοφαντίαις
  choice: calúnias
  rationale: Representa acusações falsas ou difamatórias de modo claro e conciso.
- source_word: παραβάσεσι ἐντολῶν Θεοῦ
  choice: transgressões dos mandamentos de Deus
  rationale: Conserva a linguagem moral e jurídica do grego sem acrescentar interpretação denominacional.
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: antes da hora
  rationale: Forma idiomática em português para morrer ou perecer fora do tempo esperado; a formulação literal é registrada em nota.
theological_decisions:
- issue: Relação entre o vinho e os pecados enumerados
  choice: 'Preservar a construção de finalidade/prevenção: “para que não pequem”'
  alternative: Explicitar que beber vinho causa necessariamente cada pecado listado
  rationale: O texto apresenta a abstinência como proteção contra tais pecados, mas não formula uma doutrina geral sobre causalidade nem sobre todo uso de vinho.
- issue: Verbo “beber” presente na camada inglesa revisada, mas ausente no texto grego fornecido
  choice: Não inserir “beber” no texto principal
  alternative: “para que não bebam e pequem”
  rationale: A tradução segue prioritariamente a evidência grega apresentada, na qual após ἵνα μή aparece diretamente ἁμαρτήσητε, sem πίνητε.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento naturais para leitores brasileiros e amplamente compreensíveis no espaço lusófono. A enumeração e a advertência solene do original foram preservadas.
