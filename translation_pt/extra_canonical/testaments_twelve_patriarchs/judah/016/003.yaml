  source_fidelity: O texto português traduz fielmente o grego fornecido. Em especial, não acrescenta “beber”, pois o texto grego apresentado passa diretamente de ἵνα μή a ἁμαρτήσητε. A proibição enfática de qualquer contato com o vinho, a enumeração instrumental dos pecados e a advertência sobre perecer fora do tempo são preservadas.
