  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/002.yaml
  text: If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness slips in.
translation:
  language: pt
  text: Se beberem vinho com alegria, sejam comedidos[a], com temor de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego traz, após a forma verbal no plural («beberem»), uma construção no singular: literalmente, «é, sendo comedido/modesto». A construção é gramaticalmente irregular; a tradução regulariza a concordância e verte o sentido exortativo provável.'
    reason: Registrar com precisão a irregularidade do texto-fonte sem reproduzir em português uma construção obscura ou artificial.
lexical_decisions:
- source_word: ἐν εὐφροσύνῃ
  choice: com alegria
  rationale: Expressa de modo natural o sentido de alegria ou satisfação festiva, sem sugerir por si só embriaguez.
- source_word: αἰδούμενος
  choice: sejam comedidos
  rationale: O particípio pode comunicar modéstia, reserva ou respeito reverente; “comedidos” se ajusta ao contexto do consumo de vinho e preserva a dimensão moral do termo.
- source_word: μετὰ φόβου Θεοῦ
  choice: com temor de Deus
  rationale: Mantém a formulação religiosa tradicional e o sentido de reverência responsável diante de Deus.
theological_decisions:
- issue: Relação entre alegria, vinho e temor de Deus
  choice: A alegria e o consumo de vinho não são condenados; a frase exige comedimento acompanhado pelo temor de Deus.
  alternative: Entender o texto como uma proibição implícita do vinho ou da alegria festiva.
  rationale: A construção condicional pressupõe o ato de beber e qualifica a conduta; não formula uma proibição absoluta.
- issue: Material adicional presente na camada inglesa
  choice: Não incluir as frases sobre embriaguez e falta de vergonha.
  alternative: 'Traduzir também: “Pois, se na alegria o temor de Deus se afasta, segue-se a embriaguez, e a falta de vergonha se insinua.”'
  rationale: Essas frases aparecem na consulta inglesa, mas não constam do texto grego fornecido para este versículo; acrescentá-las não seria justificável com base na evidência original apresentada.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A segunda pessoa do plural foi vertida por uma construção impessoal de valor plural (“se beberem”), evitando regionalismos como “vós” e a marcação explícita de gênero.
