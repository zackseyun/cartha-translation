base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/004.yaml
  text: Wine also reveals the mysteries of God and of men, just as I too revealed to the Canaanite woman the commandments of God and the mysteries of Jacob my father—things that God told me not to reveal.
translation:
  language: pt
  text: O vinho também revela os mistérios de Deus e dos seres humanos, assim como eu revelei à mulher cananeia os mandamentos de Deus e os mistérios de Jacó, meu pai — coisas que Deus me disse que não revelasse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: também
  rationale: Expressa o valor aditivo e enfático da partícula de modo natural em português.
- source_word: μυστήρια
  choice: mistérios
  rationale: Mantém o sentido de assuntos ocultos ou confidenciais, sem reduzir a possível dimensão religiosa do termo.
- source_word: ἀνθρώπων
  choice: dos seres humanos
  rationale: Transmite o plural genérico inclusivo em português moderno.
- source_word: τῇ Χαναναίτιδι
  choice: à mulher cananeia
  rationale: Torna explícito o referente feminino do substantivo grego e mantém sua identificação étnica.
- source_word: ἐντολὰς
  choice: mandamentos
  rationale: Equivalente corrente para ordens divinas, preservando o registro religioso do texto.
theological_decisions:
- issue: Agente da proibição final
  choice: Deus me disse que não revelasse
  alternative: ele me disse que não revelasse
  rationale: Repete 'Deus', como faz o texto grego, e evita ambiguidade pronominal desnecessária.
- issue: Natureza dos 'mistérios'
  choice: Preservar o termo 'mistérios' sem explicação interpretativa
  alternative: segredos
  rationale: O grego pode abranger tanto segredos quanto realidades religiosas ocultas; 'mistérios' conserva essa amplitude e a tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e proximidade à ordem do grego. O travessão esclarece que a oração final retoma conjuntamente os mandamentos e os mistérios.
