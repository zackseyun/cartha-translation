base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017.yaml
  text: 'And now I command you, my children: do not love silver, and do not set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.


    And I know that because of these two things my seed will come to the ruin of sexual immorality. For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which the Lord gave me because of my obedience to my father Jacob.'
translation:
  language: pt
  text: '**Testamento de Judá 17**


    1 E agora lhes ordeno, meus filhos: não amem a prata nem fixem os olhos na beleza das mulheres, pois eu também, por causa do ouro e da beleza, caí em erro com Besué, a cananeia.


    2 Sei que, por causa dessas duas coisas, minha linhagem será levada à destruição pela imoralidade sexual[a]. Elas corromperão até mesmo homens sábios dentre os meus filhos e farão diminuir o reino de Judá, que o Senhor me deu por eu ter obedecido a meu pai.


    3 Eu nunca contradisse Jacó, meu pai, pois fazia tudo o que ele me dizia.


    4 Abraão, meu antepassado, abençoou-me para reinar em Israel, e Jacó também me abençoou desse modo.


    5 E sei que de mim se estabelecerá o reino[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega também pode ser entendida como: “minha linhagem chegará à destruição por causa da imoralidade sexual”.'
    reason: A relação sintática entre “destruição” e “imoralidade sexual” é compacta e admite mais de uma leitura.
  - marker: b
    text: 'Ou: “a realeza”.'
    reason: O termo grego pode designar tanto o reino como realidade dinástica quanto o exercício da realeza.
lexical_decisions:
- source_word: ἀργύριον
  choice: prata
  rationale: Mantém a imagem concreta do metal precioso no texto grego e seu paralelismo com χρυσίον, “ouro”, sem reduzir o termo ao sentido geral de dinheiro.
- source_word: ἐπιβλέπει εἰς κάλλος
  choice: fixem os olhos na beleza
  rationale: Reproduz de modo natural a ideia de dirigir deliberadamente o olhar para a beleza.
- source_word: γένος μου
  choice: minha linhagem
  rationale: No contexto dos descendentes de Judá, “linhagem” comunica melhor o valor coletivo e genealógico de γένος do que “semente” em português corrente.
- source_word: ἀλλοιώσουσι
  choice: corromperão
  rationale: O verbo indica mudança ou alteração; no contexto moral negativo, “corromperão” exprime adequadamente a transformação para pior.
- source_word: παρελάλησα
  choice: desobedeci
  rationale: O contexto imediato explica o verbo pela afirmação de que Judá fazia tudo quanto o pai dizia; por isso, o sentido contextual é não contrariar ou desobedecer.
- source_word: βασίλειον
  choice: reino
  rationale: Preserva a formulação política e dinástica do grego e sua ligação com o reino de Judá mencionado anteriormente.
theological_decisions:
- issue: Relação entre a obediência de Judá e a concessão do reino
  choice: “que o Senhor me deu por eu ter obedecido a meu pai”
  alternative: “que o Senhor me deu na obediência a meu pai”
  rationale: A construção grega ἐν ὑπακοῇ πατρός μου associa a dádiva à obediência de Judá. A tradução torna essa relação inteligível sem desenvolver uma doutrina de mérito além do que o texto afirma.
- issue: Estabelecimento futuro do reino a partir de Judá
  choice: “de mim se estabelecerá o reino”
  alternative: “de mim surgirá a realeza”
  rationale: Mantém a voz passiva e a expectativa dinástica do texto sem identificar explicitamente seu agente ou cumprimento, que permanecem não declarados.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês” implícito nas formas verbais e vocabulário acessível. A numeração dos versículos segue o texto grego fornecido. Foram traduzidos também os versículos 3–5, ausentes na camada inglesa de consulta, por constarem da fonte grega primária.
