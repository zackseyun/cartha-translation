  to: '**Testamento de Judá 17**


    1 E agora lhes ordeno, meus filhos: não amem a prata nem fixem os olhos na beleza das mulheres, pois eu também, por causa do ouro e da beleza, caí em erro com Besué, a cananeia.


    2 Sei que, por causa dessas duas coisas, minha linhagem será levada à destruição pela imoralidade sexual[a]. Elas corromperão até mesmo homens sábios dentre os meus filhos e farão diminuir o reino de Judá, que o Senhor me deu por eu ter obedecido a meu pai.


    3 Eu nunca contradisse Jacó, meu pai, pois fazia tudo o que ele me dizia.


