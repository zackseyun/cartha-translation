  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/004.yaml
  text: And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting around it, we besieged it.
translation:
  language: pt
  text: E perseguimos os filhos de Esaú. Eles também tinham uma cidade fortificada, e não conseguimos entrar nela. Mas, tomando posição ao redor dela, nós a sitiamos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδιώξαμεν
  choice: perseguimos
  rationale: Expressa diretamente a ideia de seguir em perseguição, sem acrescentar se os fugitivos foram alcançados.
- source_word: τοὺς υἱοὺς Ἡσαῦ
  choice: os filhos de Esaú
  rationale: Mantém a designação genealógica do grego, que pode abranger os descendentes de Esaú.
- source_word: πόλις ὀχυρά
  choice: cidade fortificada
  rationale: Equivalente natural e preciso para uma cidade dotada de defesas.
- source_word: περικαθίσαντες
  choice: acampamos ao redor dela
  rationale: No contexto militar, o particípio indica tomar posição em torno da cidade; 'acampamos' comunica de modo natural essa ação preparatória sem o literalismo pouco idiomático de 'sentamo-nos ao redor'.
- source_word: ἐπολιορκοῦμεν
  choice: a sitiamos
  rationale: Verbo português específico para cercar militarmente uma cidade a fim de tomá-la.
