  text: Then they asked us for terms of peace, and after counsel had been taken with our father, we accepted them.
translation:
  language: pt
  text: Então, eles nos pediram termos de paz e, depois de deliberarmos com nosso pai, nós os aceitamos como tributários.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρὸς εἰρήνην
  choice: condições de paz
  rationale: A expressão significa literalmente “as coisas relativas à paz” e, neste contexto, refere-se aos termos ou condições para estabelecer a paz.
- source_word: γενομένης βουλῆς μετὰ τοῦ πατρὸς ἡμῶν
  choice: depois de consultarmos nosso pai
  rationale: Expressa em português natural a deliberação realizada com o pai, preservando a participação dele no conselho.
- source_word: ὑποδεξάμενοι
  choice: aceitamos
  rationale: No contexto de um acordo de paz, o particípio indica acolher ou receber a outra parte sob a condição indicada a seguir.
- source_word: ὑποφόρους
  choice: como tributários
  rationale: O termo designa pessoas sujeitas ao pagamento de tributo. Essa informação explícita no grego deve ser preservada, embora tenha sido omitida na camada inglesa de consulta.
