  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/001.yaml
  text: For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.
translation:
  language: pt
  text: Durante dezoito anos, meu pai viveu em paz com seu irmão Esaú, e os filhos dele estiveram conosco depois que chegamos da Mesopotâmia, de junto de Labão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέκα καὶ ὀκτὼ ἔτη
  choice: Durante dezoito anos
  rationale: Expressa naturalmente em português a duração indicada pelo acusativo temporal grego.
- source_word: ἐποίησεν ... εἰρήνην
  choice: viveu em paz
  rationale: O grego diz literalmente “fez paz”; neste contexto, a formulação idiomática comunica uma relação pacífica mantida ao longo de dezoito anos.
- source_word: οἱ υἱοὶ αὐτοῦ μεθ᾽ ἡμῶν
  choice: os filhos dele estiveram conosco
  rationale: Preserva a referência de αὐτοῦ a Esaú e explicita em português o verbo elíptico exigido pela frase.
- source_word: μετὰ τὸ ἐλθεῖν ἡμᾶς
  choice: depois que voltamos
  rationale: Embora ἐλθεῖν signifique literalmente “vir”, o movimento narrativo é de retorno da família de Jacó da Mesopotâmia; “voltamos” é natural e contextual.
- source_word: ἀπὸ Μεσοποταμίας ἀπὸ Λαβάν
  choice: da Mesopotâmia, da casa de Labão
  rationale: A segunda expressão com ἀπό indica procedência ligada a Labão, não que Labão seja um lugar; “da casa de Labão” torna o sentido compreensível sem alterar a relação de origem.
