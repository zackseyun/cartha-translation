- source_word: ἐπανῆλθεν
  choice: voltou até nós
  rationale: Preserva o sentido básico de retorno indicado pelo verbo, sem introduzir a ideia não explícita de ataque.
- source_word: λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: um povo numeroso e forte
  rationale: Neste contexto, βαρεῖ caracteriza o grupo como grande ou considerável, enquanto ἰσχυρῷ indica força; a formulação é clara e natural em português.
