base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/005.yaml
  text: And because they did not open to us after twenty days, while they were watching, I brought a ladder; and placing my shield over my head and receiving the stones, I went up and killed four of their mighty men.
translation:
  language: pt
  text: E, como não abriram durante vinte dias, enquanto eles agiam[a], levei uma escada; e, colocando o escudo sobre a cabeça e recebendo pedras da muralha, subi e matei quatro homens poderosos da cidade deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: enquanto vigiavam.'
    reason: O particípio grego δρώντων significa literalmente «agindo» ou «fazendo». «Vigiavam» é uma interpretação contextual possível, mas não é exigida pelo termo.
lexical_decisions:
- source_word: οὐκ ἠνοίγον
  choice: não nos abriram as portas
  rationale: O verbo significa literalmente “não abriam”; no contexto de uma cidade sitiada, explicitar “as portas” comunica em português o complemento naturalmente subentendido.
- source_word: προσάγω κλίμακα
  choice: levei uma escada até a muralha
  rationale: προσάγω indica conduzir ou aproximar algo. “Até a muralha” torna claro o movimento implícito no contexto sem confundir com o ato posterior de subir.
- source_word: τὴν ἀσπίδα ἐπὶ τῆς κεφαλῆς μου
  choice: pus o escudo sobre a cabeça
  rationale: Reproduz com clareza a ação defensiva descrita, em linguagem portuguesa natural.
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: recebendo as pedras lançadas da muralha
  rationale: Mantém a ideia de suportar as pedras provenientes do muro; “lançadas” explicita a ação evidente no cenário de combate.
- source_word: τέσσαρας πόλει αὐτῶν δυνάστας
  choice: quatro dos homens poderosos da cidade deles
  rationale: δυνάστας pode designar governantes ou homens poderosos. O contexto militar favorece a formulação mais ampla, sem impor que os quatro fossem autoridades políticas.
