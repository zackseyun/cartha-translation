review_pass:
  verdict: revise
  source_fidelity: A primeira oração é essencialmente fiel. Porém, «foi recolhido» especifica uma ação de remoção/recuperação que ἤρθη (aoristo passivo de αἴρω) não exige; o texto diz mais diretamente que «o morto/cadáver foi levantado». A formulação revista preserva essa voz passiva e não harmoniza a segunda oração com a redação inglesa, que traz uma tradição diferente («he fell»).
  naturalness: «E Jacó feriu Esaú com um arco, e o cadáver foi levantado no monte Seir» é português moderno, claro e de registro narrativo digno. «Foi levantado» é natural neste contexto e conserva a concisão algo abrupta do grego.
  terminology: «Jacó», «Esaú» e «monte Seir» são formas estabelecidas. «Cadáver» traduz adequadamente ὁ νεκρός, sem tornar explícita além do texto a identidade do morto. «Feriu» reproduz melhor ἔπαισεν do que o mais neutro «atingiu».
  issues:
  - severity: medium
    issue: «foi recolhido» para ἤρθη
    rationale: «Recolhido» sugere que o corpo foi retirado ou levado embora. O passivo de αἴρω exprime primariamente «foi levantado/erguido»; a revisão evita essa especificação interpretativa.
  - severity: low
    issue: «atingiu» para ἔπαισεν
    rationale: Embora possível, «atingiu» pode apenas indicar acertar o alvo. «Feriu» conserva mais naturalmente o sentido de golpear/ferir do verbo grego sem acrescentar que o golpe foi fatal.
  revised_text: E Jacó feriu Esaú com um arco, e o cadáver foi levantado no monte Seir.
