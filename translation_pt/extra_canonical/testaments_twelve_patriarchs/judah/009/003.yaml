translation_notes:
  register: 'Português moderno, claro e digno. A redação segue prioritariamente o texto grego da coluna α: a segunda oração afirma que o cadáver foi levantado ou recolhido no monte Seir, em vez de repetir que Esaú caiu pelo arco de Jacó, como faz a camada inglesa de consulta.'
