  text: And Jacob struck Esau with a bow, and he fell by Jacob's bow, dead on Mount Seir.
translation:
  language: pt
  text: E Jacó feriu Esaú com um arco, e o cadáver foi levantado no monte Seir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαισεν ἐν τόξῳ
  choice: atingiu ... com um arco
  rationale: Expressa de modo natural o ato de ferir ou acertar alguém por meio de um arco, sem acrescentar que o golpe foi fatal.
- source_word: ἤρθη
  choice: foi recolhido
  rationale: O aoristo passivo de αἴρω indica que o morto foi levantado ou retirado; “foi recolhido” transmite adequadamente o tratamento dado ao cadáver no local.
- source_word: ὁ νεκρός
  choice: o cadáver
  rationale: O adjetivo substantivado refere-se ao morto ou ao corpo morto; “o cadáver” é claro e idiomático neste contexto.
- source_word: ἐν ὄρει Σεείρ
  choice: no monte Seir
  rationale: Mantém o sentido locativo da preposição ἐν e a forma tradicional e reconhecível do topônimo.
