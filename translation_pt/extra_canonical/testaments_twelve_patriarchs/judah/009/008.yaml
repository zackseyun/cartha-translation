source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἦσαν διδόντες⁴⁷ ἡμῖν πυροῦ⁴⁸ κόρους⁴⁹ πεντακοσίους⁵⁰, καὶ ἐλαίου †ὕφης⁵² πεντακοσίους⁵³, καὶ⁵⁴ οἴνου *μέτρα πεντακόσια ἕως τοῦ λιμοῦ⁵⁴ ὅτε⁵⁵ κατήλθομεν⁵⁶ εἰς Αἴγυπτον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/008.yaml
  text: And they were giving us five hundred cors of wheat, and five hundred baths of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.
translation:
  language: pt
  text: E eles nos davam quinhentos coros[a] de trigo, quinhentos batos[b] de azeite e quinhentas medidas de vinho, até a fome, quando descemos ao Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O coro era uma antiga unidade de capacidade para produtos secos; seu valor exato variava.
    reason: A unidade antiga é pouco conhecida por leitores modernos e não deve ser convertida com falsa precisão.
  - marker: b
    text: A palavra correspondente a esta unidade está incerta no texto grego; “batos” representa uma provável restauração. O bato era uma antiga unidade de capacidade para líquidos.
    reason: Torna transparente a corrupção textual e preserva a distinção provável entre a unidade do azeite e a medida genérica do vinho.
lexical_decisions:
- source_word: πυροῦ
  choice: trigo
  rationale: Equivalente direto e natural para o cereal mencionado.
- source_word: κόρους
  choice: coros
  rationale: Mantém a unidade antiga específica, em vez de substituí-la por uma estimativa moderna.
- source_word: ἐλαίου
  choice: azeite
  rationale: No contexto mediterrânico antigo, refere-se naturalmente ao azeite de oliva.
- source_word: †ὕφης
  choice: batos
  rationale: O texto grego neste ponto está corrompido ou incerto; a tradução segue a provável unidade de capacidade preservada pela tradição textual e pela camada inglesa auditada, sinalizando a incerteza em nota.
- source_word: μέτρα
  choice: medidas
  rationale: O termo é genérico, e a própria leitura apresenta incerteza; 'medidas' evita identificar uma unidade específica sem base suficiente.
- source_word: ἕως τοῦ λιμοῦ
  choice: até a época da fome
  rationale: Expressa com naturalidade o limite temporal indicado pelo grego, sem sugerir apenas o início pontual da fome.
- source_word: κατήλθομεν εἰς Αἴγυπτον
  choice: descemos ao Egito
  rationale: Conserva a expressão geográfica tradicional e inteligível de 'descer' ao Egito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “quinhentos” preserva o ritmo enumerativo do original. As unidades antigas foram transliteradas quando identificáveis, e a incerteza textual relativa ao azeite foi explicitada em nota.
