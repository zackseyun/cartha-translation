    issue: Referente indevido de «suas obras» em v. 3.
    rationale: Depois de «Cada um deles», o possessivo português tende a referir-se aos dois espíritos. O texto grego, porém, especifica «as obras das pessoas» (τὰ ἔργα τῶν ἀνθρώπων). A tradução deve explicitá-lo.
  - severity: low
    issue: «Íntimo» interpreta a imagem de στῆθος.
    rationale: O grego conserva uma imagem corporal de inscrição no peito, com uma construção difícil relacionada aos ossos. «No peito das pessoas» é mais próximo do texto e a nota já informa a dificuldade.
