  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020.yaml
  text: '1[a]. For it leads astray, because in the delusion of silver they call those who are not gods gods, and it makes the one who has it fall into frenzy. 2. Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless. 3. But the God of my fathers had mercy on me, because I did this in ignorance[b]. 4. For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast. 9. And the spirit of truth testifies against all things, and the sinner is burned up by his own heart[c], and cannot lift up his face to the judge.'
translation:
  language: pt
  text: '**Testamento de Judá 20**


    1. Entendam, portanto, meus filhos, que dois espíritos acompanham o ser humano: o espírito da verdade e o espírito do engano.[a] 2. Entre eles está a consciência, que pode inclinar-se para o lado que quiser. 3. Cada um deles se revela pelas obras das pessoas, pois as obras delas estão inscritas pelo Senhor no peito das pessoas. 4. Em nenhum momento as obras humanas podem escapar ao conhecimento do Senhor, pois estão inscritas diante dele no peito das pessoas. 5. O espírito da verdade testemunha contra todas as coisas; o pecador é abrasado pelo próprio coração e não consegue levantar o rosto diante do juiz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego dos vv. 1–4 apresenta dificuldades e sinais de corrupção, especialmente nas frases sobre a consciência e sobre aquilo que está escrito no peito. A tradução segue a coluna grega fornecida sempre que ela oferece sentido coerente e, nos trechos quebrados ou repetidos, exprime com cautela o sentido comum preservado pela tradição textual.
    reason: textual_variant
lexical_decisions:
- source_word: δύο πνεύματα
  choice: dois espíritos
  rationale: Mantém a linguagem moral e espiritual explícita do grego, sem reduzi-la a meras tendências psicológicas nem definir a natureza ontológica desses espíritos.
- source_word: σχολάζουσι τῷ ἀνθρώπῳ
  choice: acompanham o ser humano
  rationale: O verbo é difícil neste contexto. “Acompanham” comunica presença e atuação junto à pessoa sem especificar além do que o texto permite.
- source_word: τὸ τῆς ἀληθείας / τὸ τῆς πλάνης
  choice: o espírito da verdade / o espírito do engano
  rationale: Os artigos retomam πνεύματα. “Engano” preserva a dimensão moral de πλάνη, que aqui é mais forte que simples erro intelectual.
- source_word: συνείδησις
  choice: consciência
  rationale: A coluna grega primária traz συνείδησις. A tradução conserva a faculdade moral interior sem acrescentar a expressão variante “da mente” ao texto principal.
- source_word: κλῖναι
  choice: inclinar-se
  rationale: Preserva a imagem grega de uma consciência que pode pender para um ou outro dos dois lados.
- source_word: στῆθος
  choice: íntimo do peito
  rationale: Mantém a imagem corporal e inscricional de στῆθος, enquanto “íntimo” torna a expressão natural em português sem substituí-la interpretativamente por “coração”.
- source_word: κατηγορεῖ
  choice: testemunha contra
  rationale: Conserva a força forense do verbo e prepara a referência final ao juiz, sem tornar a formulação portuguesa excessivamente técnica.
- source_word: ἐμπεπύρισται
  choice: é abrasado
  rationale: Reproduz a imagem intensa de ser incendiado ou consumido interiormente, de modo digno e inteligível.
- source_word: ἆραι πρόσωπον
  choice: levantar o rosto
  rationale: Mantém o idioma corporal de comparecer sem vergonha ou temor diante de uma autoridade judicial.
theological_decisions:
- issue: Natureza dos “dois espíritos”
  choice: Preservar como duas realidades moral-espirituais, verdade e engano, que acompanham a pessoa.
  alternative: Interpretá-los apenas como disposições psicológicas ou defini-los estritamente como seres angélicos e demoníacos.
  rationale: O grego usa πνεύματα e situa a consciência entre eles, mas não oferece aqui uma definição ontológica completa. A tradução mantém essa tensão.
- issue: Liberdade da consciência para inclinar-se
  choice: Traduzir que a consciência pode inclinar-se para o lado que quiser.
  alternative: Explicitar uma doutrina sistemática de livre-arbítrio ou de determinação externa.
  rationale: A formulação preserva a agência expressa em ἐὰν θέλῃ sem extrair dela conclusões teológicas mais amplas.
- issue: Acusação interior e juízo
  choice: Manter juntas a atuação acusadora do espírito da verdade, a aflição proveniente do próprio coração e a incapacidade de encarar o juiz.
  alternative: Identificar explicitamente o juiz ou transformar o fogo interior em uma punição escatológica definida.
  rationale: O texto emprega imagens forenses e interiores, mas não identifica expressamente o juiz nem determina a natureza exata do abrasamento.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com preferência por “ser humano” e “pessoas” onde o grego usa ἄνθρωπος de modo genérico. A imagem concreta do peito foi preservada, mas suavizada por “íntimo” para naturalidade. A numeração segue as cinco unidades do texto grego fornecido, correspondentes aos vv. 5–9 da camada inglesa de consulta.
