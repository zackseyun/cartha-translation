  source_fidelity: 'A estrutura geral e os termos centrais seguem bem o grego: δύο πνεύματα, verdade/engano, consciência, acusação e a imagem final de vergonha perante o juiz. Contudo, em v. 3, «suas obras» atribui as obras aos dois espíritos, enquanto o grego diz explicitamente «as obras das pessoas» (τὰ ἔργα τῶν ἀνθρώπων). A redação deve manter esse referente humano. A formulação sobre a inscrição no peito permanece difícil no grego e é adequadamente sinalizada por nota.'
  naturalness: O português é moderno, claro e de registro digno. «Acompanham o ser humano», «inclinar-se para o lado que quiser» e «levantar o rosto diante do juiz» são naturais. «No íntimo do peito» é um pouco interpretativo; «no peito das pessoas» preserva melhor a imagem corporal sem perder fluência.
  terminology: «Espíritos», «verdade», «engano», «consciência», «testemunha contra», «abrasado» e «juiz» são escolhas adequadas e não impõem uma leitura doutrinária. «Engano» exprime bem πλάνη neste contexto.
  issues:
