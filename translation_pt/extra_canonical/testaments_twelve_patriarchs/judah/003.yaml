base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003.yaml
  text: '1[a]. And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I dragged him down and so killed him.


    2. And the other king, Taphou, while he was sitting on his horse, I killed; and so I scattered all his people[b].


    3. And I found Achor, a giant of a man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.


    4. And after fighting with Achor for two hours, I killed him; and when I had cut his shield into two pieces, I hacked through his feet.


    5. And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.


    6. But I wrapped my garment around my arm and slung stones at them; four of them I killed[c], and the others fled.'
translation:
  language: pt
  text: '**Testamento de Judá 3**


    1.[a] Quando os dois reis dos cananeus vieram, revestidos de armadura, contra os nossos rebanhos, acompanhados de muita gente, eu sozinho corri contra um dos reis e lhe despedacei os ossos.


    2. Matei o outro rei, Tafua, enquanto estava montado em seu cavalo; e assim dispersei todo o seu povo.


    3. Encontrei também Acor, um gigante, que, montado num cavalo, atirava flechas para a frente e para trás. Saltando, peguei uma pedra de sessenta litras[b], golpeei o cavalo e o matei.[c]


    4. Depois de lutar com Acor durante duas horas, matei-o; parti seu escudo em duas partes e cortei-lhe os pés.[d]


    5. Enquanto eu lhe tirava a couraça, eis que oito homens, companheiros dele, começaram a lutar contra mim.


    6. Enrolei minha túnica no braço e lancei pedras contra eles com uma funda. Matei quatro deles, e os restantes fugiram.


    7. Meu pai, Jacó, matou Belisate, rei de todos os reis, um homem gigantesco em força, de doze côvados de altura.[e]


    8. Então o terror caiu sobre eles, e deixaram de guerrear contra nós.


    9. Por isso, meu pai não se preocupava nas guerras quando eu estava com meus irmãos.


    10. Pois ele tinha visto numa visão a meu respeito que um anjo de poder me acompanhava em tudo, para que eu não fosse derrotado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradição grega deste capítulo apresenta dificuldades textuais. Alguns testemunhos trazem outros nomes para os adversários, como Chora ou Nacor, e há versões que duplicam ou reorganizam partes dos combates.
    reason: textual_variant
  - marker: b
    text: A litra era uma antiga unidade de peso. O texto ressalta o tamanho extraordinário da pedra; não se oferece aqui uma conversão moderna, pois o valor da unidade podia variar.
    reason: cultural_note
  - marker: c
    text: O grego diz literalmente que Judá golpeou o cavalo e “o matou”. O pronome pode retomar o cavalo ou o adversário, e a instabilidade textual do episódio impede uma resolução segura.
    reason: ambiguity
  - marker: d
    text: A nova menção a Acor pode refletir a duplicação ou reorganização do relato de combate na transmissão do texto. Ela foi mantida conforme a fonte grega fornecida.
    reason: textual_variant
  - marker: e
    text: O grego associa a força gigantesca de Belisate à medida de doze côvados, numa construção condensada. A expressão “de altura” está subentendida na tradução. Um côvado era uma medida baseada no comprimento do antebraço.
    reason: translation_clarity
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: revestidos de armadura
  rationale: Expressa claramente o estado de estarem equipados para o combate, sem limitar a referência apenas à couraça.
- source_word: ποίμνια
  choice: rebanhos
  rationale: Termo pastoral abrangente e natural em português, sem especificar indevidamente a espécie dos animais.
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: lhe despedacei os ossos
  rationale: O grego fornecido fala explicitamente dos ossos e emprega um verbo violento; não sustenta a menção a canelas nem a ação de arrastar presente na camada inglesa.
- source_word: ἀνεῖλον
  choice: matei
  rationale: Equivalente narrativo direto e atual, adequado às repetidas mortes no relato.
- source_word: διεσκόρπισα
  choice: dispersei
  rationale: Mantém a imagem literal de espalhar o grupo e seu resultado militar.
- source_word: γίγαντα
  choice: um gigante / um homem gigantesco
  rationale: Preserva a apresentação heroica de tamanho ou força extraordinários, com variação idiomática conforme a frase.
- source_word: βάλλοντα τόξα ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου
  choice: montado num cavalo, atirava flechas para a frente e para trás
  rationale: Conserva a descrição incomum das duas direções sem tentar normalizar a cena; 'flechas' expressa idiomaticamente o objeto disparado pelo arco.
- source_word: ἀνελάμενος λίθον
  choice: peguei uma pedra
  rationale: O particípio indica tomar ou erguer a pedra; o texto grego fornecido não contém inequivocamente a ideia de saltar.
- source_word: λίθον ἑξήκοντα λιτρῶν
  choice: uma pedra de sessenta litras
  rationale: Mantém a antiga unidade de peso em transliteração, evitando uma conversão moderna incerta.
- source_word: σφενδονήσας αὐτοὺς λίθοις
  choice: lancei pedras contra eles com uma funda
  rationale: Torna explícito de modo natural o uso da funda presente no verbo grego.
- source_word: ἄγγελος δυνάμεως
  choice: um anjo de poder
  rationale: Preserva a construção genitiva e sua possível nuance sobrenatural ou atributiva, em vez de reduzi-la sem nota a 'anjo poderoso'.
- source_word: ἀμέριμνος
  choice: não se preocupava
  rationale: Comunica que Jacó estava livre de inquietação ou ansiedade durante as guerras, sem sugerir irresponsabilidade.
theological_decisions:
- issue: Instabilidade textual nos nomes e na sequência dos adversários nos vv. 1–4
  choice: Seguir a coluna grega fornecida com Tafua e Acor, mantendo inclusive a repetição de Acor nos vv. 3–4
  alternative: Harmonizar os episódios, adotar nomes variantes como Chora/Nacor ou eliminar a aparente duplicação
  rationale: A transparência textual exige não reconstruir silenciosamente uma narrativa mais lisa do que a testemunhada pelo texto-base.
- issue: Referente de αὐτόν depois do golpe contra o cavalo no v. 3
  choice: Traduzir literalmente 'golpeei o cavalo e o matei', deixando o pronome português formalmente aberto no contexto
  alternative: Explicitar que Judá matou o cavalo ou que matou Acor
  rationale: Tanto 'cavalo' quanto o adversário são masculinos no grego, e a sintaxe não elimina por completo a ambiguidade; a nota informa o leitor.
- issue: Natureza do ἄγγελος δυνάμεως no v. 10
  choice: anjo de poder
  alternative: anjo poderoso; anjo da hoste
  rationale: A formulação conserva o genitivo ambíguo e evita identificar o ser com uma categoria doutrinária não expressa pelo texto.
- issue: Finalidade expressa por τοῦ μὴ ἡττᾶσθαί μοι no v. 10
  choice: para que eu não fosse derrotado
  alternative: de modo que eu não podia ser derrotado
  rationale: A construção expressa finalidade ou resultado pretendido; a tradução não transforma a visão em uma afirmação metafísica de invencibilidade absoluta.
translation_notes:
  register: Português moderno, digno e narrativo, com legibilidade brasileira e vocabulário amplamente internacional. O tom heroico e hiperbólico foi preservado sem arcaísmos desnecessários. Seguiu-se prioritariamente o grego fornecido, inclusive onde a camada inglesa apresenta ações ou detalhes não presentes nessa forma do texto.
