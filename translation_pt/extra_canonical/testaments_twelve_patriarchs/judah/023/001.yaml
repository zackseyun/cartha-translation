id: T12P.JUD.23.1
reference: Testament of Judah 23:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*ἕως τῆς¹¹ παρουσίας Θεοῦ¹² τῆς δικαιοσύνης¹³, *τοῦ ἡσυχάσαι τὸν¹⁴ Ἰακὼβ¹⁵ ἐν εἰρήνῃ καὶ πάντα τὰ ἔθνη¹⁴. 3. Καὶ αὐτὸς φυλάξει κράτος¹⁵ τῆς βασιλείας μου¹⁶ ἕως¹⁷ αἰῶνος¹⁸· ὅρκῳ γὰρ ὤμοσέ¹⁹ μοι Κύριος μὴ ἐξαλείψειν²⁰ τὸ βασίλειον ἐκ τοῦ σπέρματός μου ἕως αἰῶνος²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/001.yaml
  text: Until the coming of the God of righteousness, to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me by an oath not to blot out the kingdom. Much grief is mine, my children, because of the sexual immoralities and sorceries that you will do in the kingdom, following ventriloquists, omens, and deceiving demons.
translation:
  language: pt
  text: Até a vinda do Deus da justiça[a], para dar descanso em paz a Jacó e a todas as nações. E ele[b] preservará para sempre o poder do meu reino, pois o Senhor me jurou solenemente que jamais eliminaria o reino da minha descendência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do Deus justo” ou “do Deus de justiça”.'
    reason: O genitivo grego admite mais de uma relação semântica plausível.
  - marker: b
    text: O referente de “ele” não é repetido no grego; pelo contexto, provavelmente é Deus.
    reason: Preserva a ambiguidade pronominal da fonte sem deixar o leitor sem orientação.
lexical_decisions:
- source_word: παρουσία
  choice: vinda
  rationale: Expressa de modo natural a chegada ou presença futura indicada pelo contexto, sem acrescentar terminologia técnica.
- source_word: Θεοῦ τῆς δικαιοσύνης
  choice: Deus da justiça
  rationale: Preserva a construção genitiva grega e sua possível tensão sem convertê-la silenciosamente em simples adjetivo.
- source_word: τοῦ ἡσυχάσαι
  choice: para dar descanso
  rationale: Comunica o sentido causativo de fazer repousar ou aquietar, em português corrente e digno.
- source_word: φυλάξει κράτος
  choice: preservará ... o poder
  rationale: Mantém tanto a ideia de guardar ou conservar quanto a de força, domínio ou poder do reino.
- source_word: σπέρματός μου
  choice: minha descendência
  rationale: Equivalente natural para o sentido coletivo de ‘semente’ como linhagem ou posteridade.
- source_word: ἕως αἰῶνος
  choice: para sempre / jamais
  rationale: Traduz a duração indefinida e permanente da expressão, variando a formulação para maior naturalidade em português.
theological_decisions:
- issue: Sentido de ‘Deus da justiça’
  choice: Manter ‘Deus da justiça’ no texto
  alternative: ‘Deus justo’ ou ‘Deus de justiça’
  rationale: A forma escolhida segue mais de perto o genitivo grego e não decide se a justiça é qualidade, esfera ou designação divina.
- issue: Referente de αὐτός (‘ele’)
  choice: Conservar o pronome ‘ele’ e registrar a ambiguidade em nota
  alternative: Substituir por ‘Deus’ ou por outra identificação explícita
  rationale: O grego não repete o nome do sujeito; explicitar a referência resolveria uma ambiguidade real do texto.
- issue: Material presente na consulta inglesa, mas ausente do grego fornecido
  choice: Não incluir a frase sobre imoralidades sexuais, feitiçarias, ventríloquos, presságios e demônios
  alternative: Reproduzir toda a redação inglesa
  rationale: A tradução deve partir da evidência na fonte original apresentada; esse conteúdo não aparece no trecho grego fornecido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Jurou solenemente’ evita a redundância pouco natural de ‘jurou com um juramento’ sem perder a força enfática do original. A numeração interna do excerto grego e o identificador solicitado parecem não coincidir plenamente; traduziu-se somente o texto grego efetivamente fornecido.
