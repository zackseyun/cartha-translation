source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἀνθ᾽ ὧν ἐπάξει²⁵ Κύριος ἐφ᾽ ὑμᾶς²⁶ λιμὸν καὶ λοιμόν¹⁹, θάνατον καὶ ῥομφαίαν, ἐκδικοῦσαν²⁰, πολιορκίαν, καὶ κύνας εἰς διασπασμόν²⁰, καὶ ἐχθρῶν ὀνειδισμοὺς²², καὶ ἀπώλειαν²² ἐχθρῶν, καὶ²⁴ σφακελισμὸν *ὀφθαλμῶν²⁴, καὶ νηπίων ἀναιρέσεις²⁵, *ὑπαρχόντων ἁρπαγὴν²⁶, ναῶν θεοῦ ἐμπρησμόν²⁹, γῆς ἐρήμωσιν²⁹, ὑμῶν δὲ αὐτῶν³⁰ δουλείαν ἐν ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/003.yaml
  text: Because of these things the Lord will bring upon you famine and pestilence, death and the avenging sword, siege, and the reproaches of enemies and friends. By foreigners my kingdom will be brought to an end.
translation:
  language: pt
  text: Por causa dessas coisas, o Senhor trará sobre vocês fome e peste, morte e a espada vingadora, cerco, cães para despedaçá-los, insultos de inimigos, a destruição dos inimigos[c], necrose dos olhos[a], matança de crianças pequenas, saque dos bens[b], incêndio dos templos de Deus, devastação da terra e a escravidão de vocês mesmos entre as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A leitura grega traduzida por “dos olhos” está textualmente assinalada como incerta na edição; “necrose” também pode ser entendida como “gangrena” ou “mortificação”.
    reason: A edição marca ὀφθαλμῶν com asterisco, e σφακελισμός possui uma faixa semântica médica que merece esclarecimento.
  - marker: b
    text: A palavra grega traduzida por “bens” está textualmente assinalada como incerta na edição.
    reason: A edição marca ὑπαρχόντων com asterisco; a nota torna transparente a incerteza do texto-base.
  - marker: c
    text: A expressão grega pode significar “a destruição dos inimigos” ou, conforme a leitura do genitivo, destruição relacionada aos inimigos ou causada por eles.
    reason: ἀπώλειαν ἐχθρῶν contém um genitivo que não deve ser resolvido sem ressalva em favor de uma única relação semântica.
lexical_decisions:
- source_word: Ἀνθ᾽ ὧν
  choice: Por causa dessas coisas
  rationale: Expressa de modo natural a relação causal ou retributiva do grego sem acrescentar uma explicação específica.
- source_word: λοιμόν
  choice: peste
  rationale: Termo corrente para epidemia devastadora, em paralelo com “fome”.
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: a espada vingadora
  rationale: Preserva a personificação do particípio grego e o sentido de uma espada que executa vingança ou punição.
- source_word: κύνας εἰς διασπασμόν
  choice: cães para os despedaçar
  rationale: Mantém a imagem violenta e concreta do texto, com o objeto humano implícito tornado claro em português.
- source_word: ἀπώλειαν ἐχθρῶν
  choice: destruição causada por inimigos
  rationale: O genitivo pode, isoladamente, significar destruição dos inimigos, mas a sequência de calamidades sofridas pelos destinatários favorece entendê-lo como genitivo de agente ou origem; a formulação evita sugerir que a destruição dos inimigos seja uma calamidade imposta aos destinatários.
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: necrose dos olhos
  rationale: σφακελισμός denota gangrena, mortificação ou necrose; “necrose” comunica o sentido patológico em português atual sem suavizá-lo.
- source_word: νηπίων ἀναιρέσεις
  choice: matança de crianças pequenas
  rationale: νηπίων designa crianças muito novas, e ἀναίρεσις, neste contexto, é morte violenta ou execução.
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: saque dos bens
  rationale: τὰ ὑπάρχοντα é expressão comum para posses ou bens, e ἁρπαγή indica tomada violenta ou saque.
- source_word: γῆς ἐρήμωσιν
  choice: devastação da terra
  rationale: Preserva a amplitude de γῆ e o sentido de desolação de ἐρήμωσις.
- source_word: δουλείαν ἐν ἔθνεσι
  choice: escravidão ... entre as nações
  rationale: Traduz diretamente a condição de servidão e o ambiente estrangeiro indicado pelo grego.
theological_decisions:
- issue: Agência divina na série de calamidades
  choice: “o Senhor trará sobre vocês”
  alternative: “o Senhor permitirá que venham sobre vocês”
  rationale: O verbo ἐπάξει atribui diretamente ao Senhor o ato de trazer as calamidades; “permitirá” atenuaria uma tensão teológica presente no texto.
- issue: Plural de “templos de Deus”
  choice: “templos de Deus”
  alternative: “templo de Deus”
  rationale: O texto grego traz ναῶν no plural. O plural foi preservado, embora possa soar incomum em um contexto judaico, para não harmonizar ou corrigir silenciosamente a fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “vocês” para legibilidade brasileira sem regionalismos fortes. A tradução segue integralmente o grego fornecido, cuja lista de calamidades é muito mais extensa que a camada inglesa de consulta. Conservaram-se as imagens duras, a repetição ligada aos inimigos e o plural incomum “templos de Deus”, em vez de abreviar ou harmonizar o texto.
