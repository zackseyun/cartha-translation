  source_fidelity: A tradução preserva a extensa série de calamidades do grego, inclusive elementos ausentes da trilha inglesa. Contudo, “destruição causada por inimigos” resolve indevidamente o genitivo ἐχθρῶν como agente. A construção grega ἀπώλειαν ἐχθρῶν é ambígua fora de contexto e deve permanecer aberta, com nota explicativa.
  naturalness: O português é claro e de registro apropriado. “cães para despedaçá-los” torna explícito, de modo idiomático, o objeto humano que o grego deixa subentendido.
  terminology: “Peste”, “espada vingadora”, “saque dos bens”, “devastação da terra” e “escravidão ... entre as nações” são escolhas adequadas. “Necrose dos olhos” é defensável para σφακελισμός, desde que a nota registre a incerteza textual e as alternativas semânticas.
  issues:
  - severity: medium
    issue: O genitivo em ἀπώλειαν ἐχθρῶν foi interpretado como “destruição causada por inimigos”.
    rationale: O grego pode ser entendido como “destruição dos inimigos” ou, menos naturalmente, como destruição relacionada aos inimigos/por eles. A lista de juízos não autoriza eliminar essa ambiguidade textual; uma tradução mais literal acompanhada de nota a preserva.
