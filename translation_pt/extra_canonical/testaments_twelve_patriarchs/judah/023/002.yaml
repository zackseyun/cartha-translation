source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τὰς θυγατέρας ὑμῶν μουσικὰς καὶ δημοσίας¹² ποιήσετε¹³, *καὶ ἐπιμιγήσεσθε¹⁴ ἐν βδελύγμασι ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/002.yaml
  text: You will make your daughters musicians and public women, and you will mingle with the abominations of the nations.
translation:
  language: pt
  text: Vocês farão de suas filhas musicistas e mulheres públicas[a], e se misturarão com as abominações das nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente, prostitutas; literalmente, “públicas”.
    reason: Esclarece o provável sentido eufemístico de δημοσίας, preservando ao mesmo tempo a expressão do texto principal.
lexical_decisions:
- source_word: μουσικὰς
  choice: musicistas
  rationale: Reproduz diretamente o sentido de mulheres dedicadas à música, sem acrescentar uma função específica não expressa no grego.
- source_word: δημοσίας
  choice: mulheres públicas
  rationale: Mantém a expressão eufemística e socialmente carregada do grego; a provável referência à prostituição é esclarecida em nota, sem eliminar por completo a forma e a ambiguidade do texto.
- source_word: ἐπιμιγήσεσθε
  choice: se misturarão com
  rationale: Expressa a ideia de associação ou envolvimento transmitida pelo verbo, em português natural, sem restringi-la apenas a contato físico ou participação ritual.
- source_word: βδελύγμασι ἐθνῶν
  choice: as abominações das nações
  rationale: Preserva a linguagem moral e religiosa forte de βδέλυγμα e verte ἔθνη de modo amplo como “nações”.
theological_decisions:
- issue: Natureza das “abominações das nações”
  choice: Manter a formulação genérica
  alternative: Especificar idolatria, imoralidade sexual ou práticas pagãs
  rationale: O versículo não identifica quais práticas estão em vista; especificá-las resolveria indevidamente a abrangência do original.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês”. A expressão “mulheres públicas” conserva o caráter eufemístico do original e recebe explicação em nota.
