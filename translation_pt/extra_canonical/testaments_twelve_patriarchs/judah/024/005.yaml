base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/005.yaml
  text: And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.
translation:
  language: pt
  text: E dela brotará um cetro de justiça para as nações, para julgar e salvar todos os que invocam o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστήσει
  choice: brotará
  rationale: Preserva a imagem vegetal de surgir ou despontar a partir de uma origem.
- source_word: ῥάβδος δικαιοσύνης
  choice: cetro de justiça
  rationale: “Cetro” comunica de modo natural a imagem de autoridade régia associada a ῥάβδος, enquanto “de justiça” mantém a formulação abstrata do grego sem reduzi-la apenas a “justo”.
- source_word: τοῖς ἔθνεσι
  choice: para as nações
  rationale: Traduz o dativo de destinação e conserva o alcance coletivo de ἔθνη.
- source_word: ἐπικαλουμένους τὸν Κύριον
  choice: invocam o Senhor
  rationale: É a expressão portuguesa corrente para recorrer ao Senhor em oração, apelo ou confissão, sem limitar indevidamente o sentido.
theological_decisions:
- issue: Função do personagem simbolizado pelo cetro
  choice: “para julgar e salvar”
  alternative: “para fazer justiça e salvar”
  rationale: Mantém paralelas e distintas as ações expressas por κρῖναι e σῶσαι, preservando a tensão entre juízo e salvação.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do grego. “Dela” preserva a referência feminina de ἐξ αὐτῆς sem explicitar um antecedente que não aparece neste versículo.
