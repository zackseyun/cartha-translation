revisions:
- from: E os céus se abrirão sobre ele[a] para derramar[b] o Espírito, a bênção do Pai santo; e ele mesmo derramará sobre vocês um espírito de graça.
  to: E os céus se abrirão sobre ele[a], para derramar[b] espírito[c] — a bênção do Pai santo[d]; e ele mesmo derrama sobre vocês espírito de graça.
  rationale: A revisão mantém a construção em que os céus se abrem “para derramar”, conserva a aposição “espírito — a bênção do Pai santo”, corrige o presente de ἐκχέει e remove a definição doutrinal introduzida por “o Espírito”. Também fornece âncoras transparentes para todos os quatro sobrescritos críticos visíveis na fonte, sem especular sobre variantes cujo aparato não foi disponibilizado.
