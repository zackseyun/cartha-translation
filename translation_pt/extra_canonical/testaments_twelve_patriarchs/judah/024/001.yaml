  text: He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.
translation:
  language: pt
  text: E os céus se abrirão sobre ele[a], para derramar[b] espírito[c] — a bênção do Pai santo[d]; e ele mesmo derrama sobre vocês espírito de graça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sobrescrito 10 no texto-fonte assinala uma nota crítica ligada a “sobre ele”; o conteúdo do aparato não foi fornecido.
    reason: Preserva a âncora crítica sem alegar uma variante não disponível.
  - marker: b
    text: O sobrescrito 14 no texto-fonte assinala uma nota crítica ligada a “derramar”; o conteúdo do aparato não foi fornecido.
    reason: Preserva a âncora crítica sem reconstruir o aparato.
  - marker: c
    text: O sobrescrito 15 no texto-fonte assinala uma nota crítica ligada a “espírito”; o conteúdo do aparato não foi fornecido.
    reason: Preserva a âncora crítica e evita decidir a leitura variante.
  - marker: d
    text: O sobrescrito 16 no texto-fonte assinala uma nota crítica ligada a “Pai santo”; o conteúdo do aparato não foi fornecido.
    reason: Preserva a âncora crítica e evita inventar seu conteúdo.
lexical_decisions:
- source_word: ἀνοιγήσονται
  choice: se abrirão
  rationale: Reproduz naturalmente a forma passiva futura do grego.
- source_word: ἐπ᾽ αὐτῷ
  choice: sobre ele
  rationale: Preserva a referência pronominal e o sentido espacial/metafórico da preposição.
- source_word: πνεῦμα
  choice: o Espírito / um espírito
  rationale: Na primeira ocorrência, o vínculo com o Pai santo favorece a referência ao Espírito divino; na segunda, a ausência de artigo e a expressão de qualidade permitem 'um espírito de graça', preservando a possível distinção.
- source_word: εὐλογίαν πατρὸς ἁγίου
  choice: a bênção do Pai santo
  rationale: Mantém a sequência genitiva e a ligação de 'santo' com 'Pai', sem ampliar a formulação.
- source_word: πνεῦμα χάριτος
  choice: um espírito de graça
  rationale: Tradução direta que conserva a ambiguidade entre o Espírito como dom gracioso e uma disposição caracterizada pela graça.
theological_decisions:
- issue: Identidade de πνεῦμα nas duas ocorrências
  choice: Diferenciar tipograficamente como 'o Espírito' na primeira e 'um espírito' na segunda
  alternative: Traduzir ambas como 'Espírito' ou ambas como 'espírito'
  rationale: O contexto do Pai santo dá maior definição à primeira ocorrência, enquanto a segunda permanece mais ambígua. A tradução evita impor identidade absoluta ou separação absoluta entre elas.
- issue: Agente de ἐκχέαι
  choice: Manter o infinitivo final sem explicitar um agente além dos céus que se abrem
  alternative: Seguir a camada inglesa e introduzir 'Ele derramará ... sobre ele'
  rationale: O grego apresentado diz literalmente que os céus se abrirão sobre ele 'para derramar', ao passo que a formulação inglesa altera a estrutura e introduz um sujeito masculino. A redação portuguesa segue prioritariamente a evidência grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “vocês” para o plural de segunda pessoa. A construção foi mantida próxima do grego, apesar de sua leve estranheza, para preservar a imagem e a sintaxe teológica do texto.
