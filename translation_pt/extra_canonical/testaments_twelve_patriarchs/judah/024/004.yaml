  text: Then the scepter of my kingdom will shine forth, and from your root a shoot will arise.
translation:
  language: pt
  text: Então o cetro do meu reino resplandecerá, e da raiz de vocês surgirá um rebento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: resplandecerá
  rationale: Expressa o sentido de brilhar ou irromper em luz, preservando o tom elevado e a manifestação futura.
- source_word: σκῆπτρον βασιλείας μου
  choice: o cetro do meu reino
  rationale: Mantém a imagem régia e a relação genitiva do grego sem explicá-la além do texto.
- source_word: ἀπὸ τῆς ῥίζης ὑμῶν
  choice: da raiz de vocês
  rationale: Conserva a metáfora genealógica e traduz o plural ὑμῶν de modo natural e amplamente compreensível.
- source_word: πυθμήν
  choice: rebento
  rationale: Neste paralelismo vegetal, designa aquilo que nasce da raiz; “rebento” é idiomático em português e preserva a imagem de novo crescimento.
theological_decisions:
- issue: Possível sentido messiânico da combinação entre cetro, reino, raiz e rebento
  choice: Preservar as imagens sem identificar explicitamente a figura
  alternative: Explicitar que se trata do Messias ou de um rei futuro
  rationale: O verso usa linguagem régia e vegetal sugestiva, mas não nomeia diretamente a personagem; a tradução não deve resolver a alusão teológica.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural de segunda pessoa. A construção mantém o paralelismo poético e as metáforas do grego.
