  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/003.yaml
  text: '[This is the shoot of the Most High God, a spring providing life to all flesh.]'
translation:
  language: pt
  text: '[Este é o broto de Deus Altíssimo, e esta é a fonte que dá vida a todos[a].]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a todas as coisas”. O grego diz apenas “a todos” ou “a tudo”, sem o substantivo “carne”.'
    reason: Registra a amplitude e a ambiguidade de πᾶσι e explica por que a expansão da versão inglesa não foi adotada.
lexical_decisions:
- source_word: βλαστός
  choice: broto
  rationale: Expressa naturalmente a imagem vegetal de um rebento que surge, sem especificar além do que o grego afirma.
- source_word: πηγή
  choice: fonte
  rationale: Mantém a imagem de uma nascente ou fonte de água e soa natural no registro bíblico moderno.
- source_word: παρέχουσα ζωήν
  choice: que dá vida
  rationale: 'Reproduz de modo claro e corrente a ideia do particípio: a fonte fornece ou concede vida.'
- source_word: πᾶσι
  choice: a todos
  rationale: O grego traz o adjetivo substantivado no dativo plural, sem um substantivo expresso; por isso, não se acrescenta «carne» ao texto principal.
theological_decisions:
- issue: Alcance de πᾶσι
  choice: a todos
  alternative: a toda a carne
  rationale: «A todos» preserva a formulação abrangente e a indeterminação gramatical do grego fornecido. «A toda a carne», embora presente na camada inglesa, introduziria um substantivo que não aparece neste texto grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantiveram-se os colchetes do texto-fonte, provavelmente indicativos do estatuto editorial da passagem.
