  text: 1. And when I was at the waters of Chozeba[a], those from Jobel came against us for battle. 2. And joining battle, we put them to flight; and we killed those from Shilom, their allies, and gave them no way of escape. 3. But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[b], we prevailed over them and killed them before they could scale the ascent. 4. And as we came to the city, their women were rolling stones down on us from the summit of the mountain on which the city stood[c]. 5. And having hidden Simeon and the others behind them, we seized the height, and utterly destroyed this city also.
translation:
  language: pt
  text: '**Testamento de Judá 6**


    1 Quando eu estava junto às águas de Cozebá[a], os homens de Jobel vieram contra nós para a batalha. 2 Travamos combate e os pusemos em fuga; matamos também os homens de Silom, aliados deles, e não lhes demos passagem para chegarem até nós. 3 No quinto dia, porém, os homens de Maquir voltaram a nos atacar. Investindo contra eles com espada poderosa[b], nós os vencemos e os matamos antes que subissem a encosta. 4 Quando chegamos à cidade, as mulheres deles faziam rolar pedras sobre nós desde o alto do monte em que a cidade estava situada[c]. 5 Depois de esconder ... e Simeão atrás deles[d], tomamos a elevação e exterminamos também esta cidade.


    [a] Os nomes de lugar “Cozebá”, “Jobel” e “Silom” são transliterações das formas gregas deste testemunho; sua identificação é incerta.


    [b] O texto grego de 6.3 é sintaticamente irregular: o verbo *προσδίδωσι* está na terceira pessoa do singular e no presente, embora apareça numa narrativa em primeira pessoa do plural e no passado. Pode tratar-se de uma forma textual abreviada ou corrompida. A tradução expressa o aparente sentido tático da ação sem reconstruir o texto grego.


    [c] Em 6.4, o texto grego repete o artigo em *τῇ τῇ πόλει* (“à à cidade”), evidente repetição acidental de copista. A tradução considera apenas um dos artigos.


    [d] Em 6.5, a expressão grega que antecede “e Simeão” está gramaticalmente incompleta ou corrompida. As reticências assinalam o elemento ausente; não é possível identificar com segurança quem, além de Simeão, foi escondido nem precisar o referente de “atrás deles”.'
  philosophy: optimal-equivalence
