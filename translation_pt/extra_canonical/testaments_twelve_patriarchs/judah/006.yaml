    reason: textual_variant
lexical_decisions:
- source_word: ὕδασι Χωζηβά
  choice: às águas de Cozebá
  rationale: Mantém o plural grego e translitera o topônimo numa forma natural em português, sem tentar identificar o lugar incerto.
- source_word: ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: vieram contra nós para a batalha
  rationale: Preserva tanto o movimento hostil quanto a finalidade militar, em português corrente e digno.
- source_word: συνάψαντες ἐτρέψαμεν αὐτούς
  choice: Travamos combate e os pusemos em fuga
  rationale: No contexto militar, συνάπτω indica entrar em combate, e τρέπω significa fazer o adversário recuar ou fugir.
- source_word: διέξοδον τοῦ εἰσελθεῖν πρὸς ἡμᾶς
  choice: passagem para avançarem contra nós
  rationale: Conserva a referência explícita do grego a entrar ou vir em direção ao narrador; evita a tradução “via de escape”, que não representa a oração infinitiva preservada neste testemunho.
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: com espada poderosa
  rationale: Reproduz de modo direto o instrumento e o adjetivo do texto, sem suavizar a linguagem bélica.
- source_word: πρὸ τοῦ ἀναβῆναι τὴν ἀνάβασιν
  choice: antes que subissem a encosta
  rationale: Expressa naturalmente a construção grega, na qual o objeto implícito do ataque é também o sujeito contextual do infinitivo.
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  choice: tomamos o ponto elevado
  rationale: Comunica o sentido militar de ocupar ou apoderar-se da elevação, sem sugerir necessariamente o cume inteiro.
- source_word: ἐξωλοθρεύσαμεν
  choice: exterminamos
  rationale: Preserva a força intensiva do verbo, que indica destruição completa, sem recorrer a vocabulário arcaico.
theological_decisions:
- issue: Violência e destruição total na narrativa
  choice: 'Manter a linguagem direta: “matamos” e “exterminamos”'
  alternative: Suavizar como “derrotamos” ou “devastamos”
  rationale: O texto narra explicitamente mortes e destruição completa; a tradução não deve moralizar, justificar nem atenuar o relato.
- issue: Objeto da expressão de 6.2
  choice: “passagem para avançarem contra nós”
  alternative: “via de escape”
  rationale: A oração grega τοῦ εἰσελθεῖν πρὸς ἡμᾶς aponta para entrar ou avançar em direção ao grupo de Judá. A escolha mantém esse dado, embora a situação tática exata permaneça pouco clara.
- issue: Texto corrompido em 6.5 sobre Simeão
  choice: Traduzir o provável sentido contextual e assinalar a incerteza em nota
  alternative: Reconstruir silenciosamente uma leitura específica ou omitir a expressão
  rationale: A formulação transmitida é gramaticalmente defeituosa. A nota preserva transparência sem apresentar como certa uma reconstrução conjectural.
- issue: Extensão do capítulo no testemunho fornecido
  choice: Traduzir somente os cinco versículos gregos fornecidos
  alternative: Completar o capítulo a partir de outros testemunhos ou traduções modernas
  rationale: A primazia da fonte exige não acrescentar material ausente do testemunho apresentado.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A narração mantém dignidade e concisão, evita arcaísmos como “trucidamos” ou “passaram ao fio da espada” e conserva sem eufemismo a linguagem militar do original. Os topônimos seguem transliteração adaptada à ortografia e pronúncia usuais do português.
