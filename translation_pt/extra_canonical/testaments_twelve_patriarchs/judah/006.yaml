  source_fidelity: A tradução acompanha bem a sequência narrativa, os topônimos transliterados, o vocabulário militar e as anomalias textuais assinaladas em 6.3–4. Contudo, em 6.5, “Simeão e os outros” introduz “os outros”, que não está no texto grego transmitido. A construção grega preservada é defeituosa e parece conter uma lacuna antes de “e Simeão”; ela deve permanecer explicitamente incompleta no corpo do texto, com nota explicativa.
  naturalness: O português é moderno, claro e adequado ao registro narrativo. “Tomamos a elevação” é natural no contexto militar. A elipse em 6.5 é deliberadamente menos fluente, mas é necessária para não encobrir a lacuna do testemunho.
  terminology: “Águas”, “travamos combate”, “pusemos em fuga”, “espada poderosa”, “encosta” e “exterminamos” representam adequadamente o grego e preservam a linguagem direta do relato. “Para chegarem até nós” em 6.2 reproduz melhor a direção de εἰσελθεῖν πρὸς ἡμᾶς sem acrescentar a conotação de ataque.
  issues:
  - severity: medium
    issue: 6.5 acrescenta “os outros” na expressão “Simeão e os outros”.
    rationale: O texto transmitido contém τὸν τε καὶ Συμεών, uma construção gramaticalmente incompleta ou corrompida. Embora uma palavra ou sintagma esteja provavelmente ausente, “os outros” é uma reconstrução interpretativa que não é sustentada pela forma preservada. A lacuna deve ser sinalizada no texto e explicada em nota.
  - severity: low
    issue: 6.2 interpreta εἰσελθεῖν πρὸς ἡμᾶς como “avançarem contra nós”.
    rationale: O infinitivo indica entrar, chegar ou vir até o grupo do narrador; o sentido hostil vem do contexto, mas “contra nós” é mais interpretativo do que a direção expressa pela preposição πρὸς. “Chegarem até nós” mantém a formulação aberta.
