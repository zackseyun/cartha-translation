  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/006.yaml
  text: And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue.
translation:
  language: pt
  text: Quando estávamos partindo, homens de Babue[a] se apoderaram dos nossos cativos; ao vermos isso, travamos batalha com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome do lugar é incerto no texto grego. Algumas formas textuais o relacionam a Tafue.
    reason: O sinal crítico antes de Βαβουὲ indica corrupção ou incerteza textual; a nota preserva essa dificuldade sem emendar silenciosamente o texto.
lexical_decisions:
- source_word: Ἐν δὲ τῷ ἀπιέναι ἡμᾶς
  choice: Quando estávamos partindo
  rationale: Reproduz naturalmente a construção temporal grega sem acrescentar informação.
- source_word: ἄνδρες †Βαβουὲ
  choice: homens de Babue
  rationale: Mantém em transliteração o topônimo incerto preservado no texto grego, sem substituí-lo pela leitura ampliada da camada inglesa.
- source_word: ἐπελάβοντο τὴν αἰχμαλωσίαν ἡμῶν
  choice: se apoderaram dos nossos cativos
  rationale: O substantivo coletivo αἰχμαλωσία pode designar o grupo levado cativo; esta formulação é clara em português e conserva a ação hostil de ἐπελάβοντο.
- source_word: καὶ ἰδόντες
  choice: ao vermos isso
  rationale: Explicita apenas o objeto contextual implícito de 'ver', sem introduzir a entrega aos filhos ausente do grego fornecido.
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: travamos batalha com eles
  rationale: Expressa idiomaticamente a locução grega para iniciar ou entrar em combate.
theological_decisions: []
translation_notes:
  register: Português atual, digno e direto, com leitura natural no Brasil. A tradução segue o grego fornecido; não inclui as frases da versão inglesa sobre entregar os cativos aos filhos nem sobre combater até Tafue, pois elas não aparecem nesta forma do texto grego.
