  text: But all my brothers, having driven stakes into the wall from both sides, entered the city while they were unaware.
translation:
  language: pt
  text: E assim, às escondidas, meus irmãos entraram na cidade, partindo dos dois lados da muralha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego fornecido diz que os irmãos entraram às escondidas, partindo dos dois lados da muralha. Algumas formas textuais refletem uma redação mais longa, com estacas cravadas na muralha e os habitantes sem perceber o que acontecia.
    reason: Registra a diferença relevante entre a fonte grega especificada e a redação mais longa refletida na camada inglesa, sem incorporar ao texto principal palavras que não constam da fonte apresentada.
lexical_decisions:
- source_word: οὕτως
  choice: assim
  rationale: Expressa naturalmente o modo ou a sequência indicada pelo advérbio grego.
- source_word: λάθρα
  choice: às escondidas
  rationale: Preserva o sentido explícito de ação secreta ou não percebida, em linguagem corrente.
- source_word: οἱ ἀδελφοί μου
  choice: meus irmãos
  rationale: Tradução direta; o texto grego fornecido não contém palavra equivalente a “todos”.
- source_word: ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους
  choice: partindo dos dois lados da muralha
  rationale: Conserva a ideia de procedência a partir de cada um dos dois lados, sem acrescentar estacas ou um modo de escalar ausentes do texto grego fornecido.
- source_word: εἰσῆλθον εἰς τὴν πόλιν
  choice: entraram na cidade
  rationale: Equivalência direta e idiomática.
