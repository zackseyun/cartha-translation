source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ κατελάβομεν αὐτὴν¹⁸ ἐν στόματι μαχαίρας¹⁹, καὶ τοὺς ἐν τῷ πύργῳ²⁰ καταφυγόντας ἐν πυρὶ ἐνεπρήσαμεν, καὶ οὕτως πάντας ἐλάβομεν, καὶ πάντα τὰ αὐτῶν²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/005.yaml
  text: And we took it by the edge of the sword, and those who had fled for refuge in the tower we burned with fire; and so we captured them all.
translation:
  language: pt
  text: E nós a tomamos ao fio da espada; queimamos no fogo os que haviam buscado refúgio na torre. Assim, capturamos todos eles e tudo o que lhes pertencia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν στόματι μαχαίρας
  choice: ao fio da espada
  rationale: Expressão portuguesa natural e digna que comunica o idiomatismo grego, literalmente «pela boca da espada», isto é, mediante mortandade à espada.
- source_word: τοὺς ἐν τῷ πύργῳ καταφυγόντας
  choice: os que haviam buscado refúgio na torre
  rationale: Preserva o particípio aoristo e o singular definido de τῷ πύργῳ, sem seguir a antiga leitura inglesa no plural.
- source_word: ἐν πυρὶ ἐνεπρήσαμεν
  choice: queimamos no fogo
  rationale: Mantém explicitamente a ideia de fogo presente no grego e expressa de modo direto a ação violenta narrada.
- source_word: πάντα τὰ αὐτῶν
  choice: tudo o que lhes pertencia
  rationale: Traduz a frase substantivada neutra como referência abrangente aos bens ou pertences deles; evita omitir a cláusula final presente no texto grego.
theological_decisions: []
translation_notes:
  register: Português atual, claro e solene, com legibilidade brasileira ampla. A tradução segue o grego inclusive na cláusula final, ausente no texto inglês de consulta. A pontuação divide o longo período grego para maior clareza sem alterar sua progressão narrativa.
