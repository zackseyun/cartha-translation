source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ¹ τῇ ἑξῆς ἀπήλθομεν εἰς Ἀρετὰν², πόλιν κραταιάν³, *ἀπειλοῦσαν ἡμῖν θάνατον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/001.yaml
  text: And on the next day we went to Areta, a city still mighty and strong, threatening us with death.
translation:
  language: pt
  text: E no dia seguinte fomos a Aretá, uma cidade poderosa, que nos ameaçava de morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: no dia seguinte
  rationale: A expressão elíptica indica o dia seguinte; esta é a forma natural e clara em português.
- source_word: ἀπήλθομεν
  choice: fomos
  rationale: No contexto de deslocamento com destino expresso por εἰς, “fomos” transmite naturalmente o sentido, sem o peso desnecessário de “partimos” ou “fomos embora”.
- source_word: Ἀρετὰν
  choice: Aretá
  rationale: Transliteração portuguesa do topônimo grego, com acento para indicar a tonicidade final.
- source_word: πόλιν κραταιάν
  choice: uma cidade poderosa
  rationale: κραταιός denota força ou poder. “Poderosa” preserva o sentido sem acrescentar o duplo qualificativo “poderosa e forte”, que não está no texto grego apresentado.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: que nos ameaçava de morte
  rationale: Formulação idiomática em português para a ameaça de morte dirigida ao grupo; a construção relativa deixa claro que o particípio modifica “cidade”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A tradução segue de perto o grego e evita importar o acréscimo interpretativo “ainda poderosa e forte” da camada inglesa.
