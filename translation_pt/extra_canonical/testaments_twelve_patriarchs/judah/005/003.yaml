lexical_decisions:
- source_word: οἱ ἐπὶ τοῦ τείχους
  choice: os que estavam sobre a muralha
  rationale: Reproduz com naturalidade a localização indicada pela expressão grega, sem acrescentar uma identidade não expressa no texto.
- source_word: ὅτι ἡμεῖς μόνοι ἐσμέν
  choice: pensando que estávamos sozinhos
  rationale: No contexto, ὅτι introduz o conteúdo da percepção ou suposição deles; a formulação portuguesa explicita essa relação de modo natural.
- source_word: ἐφειλκύσθησαν πρὸς ἡμᾶς
  choice: foram atraídos para junto de nós
  rationale: Preserva a voz passiva e o sentido de movimento provocado por atração, enquanto πρὸς ἡμᾶς é vertido como aproximação, sem impor a ideia de hostilidade presente em 'contra nós'.
