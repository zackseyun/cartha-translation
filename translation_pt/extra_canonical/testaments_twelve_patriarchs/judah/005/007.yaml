  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/007.yaml
  text: And we killed them also, and burned the city, and everything in it.
translation:
  language: pt
  text: Matamos todos eles[a] e recuperamos os nossos cativos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Há variação textual neste ponto. Outra forma do relato diz: “E também os matamos, incendiamos a cidade e tudo o que nela havia”.'
    reason: O sinal de aparato após πάντας e a leitura preservada na camada inglesa indicam uma tradição textual diferente; a nota informa a divergência sem incorporá-la ao texto grego principal.
lexical_decisions:
- source_word: Ἀπεκτείναμεν
  choice: Matamos
  rationale: Traduz diretamente o aoristo de ἀποκτείνω, sem suavizar a violência do relato.
- source_word: πάντας
  choice: todos eles
  rationale: O adjetivo substantivado masculino plural significa “todos”; “eles” torna a referência natural em português sem especificar além do grego.
- source_word: πάλιν ἐλάβομεν
  choice: recuperamos
  rationale: No contexto de algo que pertencia ao grupo e havia sido tomado, πάλιν com λαμβάνω comunica a ideia de tomar de volta; a formulação evita o pouco natural “tomamos novamente”.
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: os nossos cativos
  rationale: αἰχμαλωσία pode designar coletivamente as pessoas levadas em cativeiro; o plural concreto é claro e natural, embora o grego permita alguma amplitude entre “cativos” e “cativeiro/despojo capturado”.
