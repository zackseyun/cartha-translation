  text: 'E ele lhes disse: “Eis que hoje morro, aos cento e dezoito anos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ εἶπεν αὐτοῖς
  choice: E ele lhes disse
  rationale: Reproduz diretamente a introdução narrativa e o destinatário plural do grego.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Conserva a partícula de chamada de atenção em registro digno e compreensível.
- source_word: ἐγώ
  choice: '[expresso pelo sujeito de “morro”]'
  rationale: O português normalmente não exige o pronome explícito; a primeira pessoa verbal preserva a referência sem produzir uma construção artificial.
- source_word: ἑκατὸν δέκα καὶ ὀκτὼ ἐτῶν
  choice: aos cento e dezoito anos
  rationale: Expressão idiomática portuguesa para indicar a idade com que alguém morre.
- source_word: ἀποθνῄσκω σήμερον
  choice: hoje morro
  rationale: Mantém o presente do grego e a ênfase temporal, sem convertê-lo desnecessariamente em futuro.
theological_decisions:
- issue: Divergência entre o texto grego fornecido e a camada inglesa de consulta
  choice: Traduzir o texto grego fornecido
  alternative: 'Seguir o inglês: “Portanto, meus filhos, guardem toda a lei do Senhor...”'
  rationale: A instrução editorial estabelece que a evidência na língua original tem prioridade. O inglês apresentado corresponde a outro conteúdo e não pode ser derivado deste trecho grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente naturalizada para evitar o pouco idiomático “eu, com cento e dezoito anos, morro hoje”, sem eliminar a força de “Eis que” nem o presente verbal do original.
