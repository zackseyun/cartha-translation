  text: Therefore keep, my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness.
translation:
  language: pt
  text: Portanto, meus filhos, guardem toda a lei do Senhor, pois ela é esperança para os que seguem corretamente os caminhos dele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “tornam retos os caminhos dele”.'
    reason: O verbo grego pode significar dirigir, tornar reto ou conduzir corretamente; a expressão literal é incomum em português e admite mais de uma compreensão.
lexical_decisions:
- source_word: Φυλάξατε
  choice: guardem
  rationale: Expressa a ideia de observar e conservar fielmente a lei; é natural no registro bíblico contemporâneo.
- source_word: πάντα τὸν νόμον Κυρίου
  choice: toda a lei do Senhor
  rationale: Reproduz o alcance integral de πάντα e mantém a construção direta do grego.
- source_word: ἐλπὶς
  choice: esperança
  rationale: Equivalente direto, preservando a afirmação de que a lei é esperança para determinado grupo.
- source_word: τοῖς κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: para os que seguem corretamente os caminhos dele
  rationale: Comunica em português natural a ideia de orientar retamente a conduta segundo os caminhos do Senhor, sem acrescentar explicitamente o conceito de justiça que não aparece como substantivo no grego.
theological_decisions:
- issue: Referente de ἐστὶν ('é')
  choice: ela é esperança
  alternative: há esperança
  rationale: O feminino singular explicita em português que o referente gramatical mais provável é 'a lei', preservando a construção do texto grego.
- issue: Sentido moral de κατευθύνουσι
  choice: seguem corretamente
  alternative: endireitam
  rationale: A alternativa literal poderia sugerir que os caminhos do próprio Senhor precisam ser corrigidos. A formulação escolhida conserva o sentido de conduta reta sem resolver a frase por meio de linguagem denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativo natural no plural. O pronome “dele” evita a ambiguidade referencial frequente de “seus” e aponta para o Senhor mencionado na mesma frase.
