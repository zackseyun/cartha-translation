translation:
  language: pt
  text: Ninguém me sepulte com roupas luxuosas; levem-me, porém, para Hebrom, onde também estão os meus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνταφιάσει
  choice: sepulte
  rationale: Expressa diretamente o ato de preparar e colocar o morto na sepultura, de modo natural em português.
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: com roupas luxuosas
  rationale: Preserva a referência concreta a vestimentas dispendiosas usadas no sepultamento, sem ampliar o sentido para um funeral luxuoso em geral.
- source_word: ἀναγάγετε
  choice: levem-me
  rationale: O verbo indica conduzir ou transportar para cima; em português, 'levem-me para Hebrom' transmite naturalmente o traslado pedido, sem forçar a direção topográfica.
- source_word: οἱ πατέρες μου
  choice: os meus antepassados
  rationale: No contexto patriarcal e funerário, refere-se aos ancestrais sepultados em Hebrom, não apenas aos pais imediatos.
theological_decisions:
- issue: Relação deste texto grego com a camada inglesa fornecida
  choice: Traduzir o texto grego apresentado
  alternative: 'Seguir o inglês: ''Guardem, então, meus filhos, toda a lei do Senhor...'''
  rationale: A camada inglesa não corresponde ao grego fornecido e parece pertencer a outro trecho. A tradução deve partir primeiro da evidência na língua original.
- issue: Estado dos antepassados em Hebrom
  choice: onde também estão os meus antepassados
  alternative: onde também foram sepultados os meus antepassados
  rationale: O grego deixa o verbo implícito. A formulação conserva essa concisão e não acrescenta explicitamente 'sepultados', embora o contexto funerário torne o sentido claro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pontuação que destaca o contraste entre rejeitar roupas luxuosas e pedir o traslado para Hebrom. Não foram reproduzidos os números sobrescritos 11–13, pois parecem remissões ao aparato da edição e seu conteúdo não foi fornecido.
