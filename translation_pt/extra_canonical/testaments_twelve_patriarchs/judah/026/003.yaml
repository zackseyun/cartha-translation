base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/003.yaml
  text: And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.
translation:
  language: pt
  text: E, depois de dizer essas coisas, adormeceu.[a] Seus filhos fizeram tudo o que ele lhes havia ordenado e o sepultaram com seus antepassados, em Hebrom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, morreu. A expressão «em boa velhice», presente em algumas formas do texto, não consta do grego fornecido aqui.
    reason: Esclarece a metáfora e assinala uma diferença textual relevante sem inserir no corpo uma leitura ausente da fonte.
  - marker: b
    text: O grego diz que foi sepultado «com seus antepassados, em Hebrom»; não declara explicitamente que seus filhos o levaram até lá.
    reason: Preserva transparência quanto à diferença entre o grego fornecido e a camada inglesa de consulta.
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Preserva a metáfora grega tradicional para a morte, sem explicitar além do texto.
- source_word: κατὰ πάντα ὅσα ἐνετείλατο αὐτοῖς
  choice: fizeram tudo o que ele lhes havia ordenado
  rationale: Reproduz de modo natural e completo a ideia de conformidade com todas as instruções dadas.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: com seus antepassados
  rationale: Em português atual, comunica o sentido funerário e ancestral de πατέρων sem sugerir apenas os pais imediatos.
- source_word: ἐν Χεβρών
  choice: em Hebrom
  rationale: Usa a forma portuguesa corrente do topônimo e mantém a localização expressa no grego.
theological_decisions:
- issue: Metáfora do sono para a morte
  choice: Manter «adormeceu»
  alternative: Traduzir explicitamente como «morreu»
  rationale: O grego emprega uma metáfora potencialmente significativa; preservá-la evita reduzir sua ressonância teológica e literária.
- issue: Informações presentes apenas na camada inglesa
  choice: Não incluir «em boa velhice» nem «levaram-no para Hebrom»
  alternative: Seguir a redação inglesa integral
  rationale: Esses elementos não aparecem no texto grego fornecido. A tradução prioriza a evidência da fonte original e registra a discrepância em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. «Antepassados» foi preferido a «pais» para evitar ambiguidade em português contemporâneo. A redação segue prioritariamente o grego fornecido, embora a observação editorial informe que o fragmento ainda não está alinhado em nível de versículo.
