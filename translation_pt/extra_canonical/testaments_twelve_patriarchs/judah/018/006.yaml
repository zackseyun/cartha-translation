base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/006.yaml
  text: For these turn one away from the law of God, and blind the judgment of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor.
translation:
  language: pt
  text: Pois essas coisas afastam alguém da lei de Deus, cegam o discernimento da alma, ensinam a arrogância e não permitem que alguém tenha misericórdia de seu próximo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφιστᾷ
  choice: afastam
  rationale: Expressa naturalmente a ideia de desviar ou separar alguém da lei de Deus, preservando a força do verbo grego no contexto.
- source_word: τυφλοῖ
  choice: cegam
  rationale: Mantém a metáfora direta do grego.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: o discernimento da alma
  rationale: διαβούλιον designa a capacidade de deliberar, ponderar ou julgar; “discernimento” comunica essa faculdade em português corrente sem reduzi-la a mero propósito.
- source_word: ὑπερηφανίαν
  choice: a arrogância
  rationale: Representa claramente a soberba ou altivez condenada pelo texto, em linguagem moderna.
- source_word: ἐλεῆσαι τὸν πλησίον αὐτοῦ
  choice: tenha misericórdia de seu próximo
  rationale: Preserva a linguagem ética e relacional do original; “próximo” é natural neste registro bíblico.
theological_decisions:
- issue: Referente plural de ταῦτα
  choice: “essas coisas”, sem explicitar o referente
  alternative: Nomear os vícios ou comportamentos mencionados no contexto anterior
  rationale: O versículo grego usa um demonstrativo plural e depende do contexto; explicitar os referentes aqui acrescentaria interpretação não presente no texto fornecido.
- issue: Sujeito humano de ἄνδρα
  choice: “alguém”
  alternative: “um homem”
  rationale: Neste contexto, ἄνδρα tem sentido humano genérico. “Alguém” transmite isso com naturalidade, sem introduzir uma restrição masculina desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A estrutura coordenada do grego foi preservada sem tornar a frase pesada.
