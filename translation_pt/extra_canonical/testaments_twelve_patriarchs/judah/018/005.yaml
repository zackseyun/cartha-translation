id: T12P.JUD.18.5
reference: Testament of Judah 18:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε⁵ οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας⁷, καὶ ἀκούσατε⁸ Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/005.yaml
  text: Guard yourselves, therefore, my children, from sexual immorality and the love of money, and listen to Judah your father.
translation:
  language: pt
  text: Portanto, meus filhos, guardem-se da imoralidade sexual e do amor ao dinheiro, e escutem Judá, seu pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: guardem-se
  rationale: O imperativo aoristo médio transmite a exortação direta a manter-se protegido ou em guarda contra os vícios mencionados.
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: Expressão atual e abrangente para conduta sexual ilícita, sem restringir indevidamente o alcance do termo grego.
- source_word: φιλαργυρίας
  choice: amor ao dinheiro
  rationale: Tradução transparente do sentido de apego ou amor à riqueza, mais clara ao leitor comum do que termos como “avareza” neste contexto.
- source_word: ἀκούσατε
  choice: escutem
  rationale: Preserva o imperativo e, no contexto de uma exortação paterna, pode incluir a ideia de dar ouvidos sem explicitá-la além do grego.
theological_decisions:
- issue: Alcance moral de πορνεία
  choice: imoralidade sexual
  alternative: prostituição
  rationale: O termo pode abranger mais do que prostituição; a escolha mantém seu alcance moral amplo sem enumerar práticas não expressas no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos naturais no uso brasileiro. A única preposição grega rege os dois substantivos; em português, a contração é repetida por exigência idiomática (“da... e do...”), sem alterar a relação sintática.
