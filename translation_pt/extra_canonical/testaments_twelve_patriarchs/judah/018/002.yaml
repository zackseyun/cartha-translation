lexical_decisions:
- source_word: παρελάλησα
  choice: contrariei
  rationale: O verbo indica falar ou agir em oposição a alguém. “Contrariei” preserva essa ideia e se harmoniza com a explicação seguinte, sem importar o sentido menos direto de “entristecer” da camada inglesa.
- source_word: πάντα ὅσα μοι ἔλεγεν ἐποίουν
  choice: fazia tudo o que ele me dizia
  rationale: Reproduz com naturalidade o aspecto habitual dos imperfeitos ἔλεγεν e ἐποίουν e mantém a abrangência de πάντα ὅσα.
