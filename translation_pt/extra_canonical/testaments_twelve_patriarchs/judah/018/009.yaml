source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει³⁵, *καὶ Θεῷ ὑπακοῦσαι³⁶ οὐ δύναται³⁷, ὅτι ἐτύφλωσε³⁸ τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/009.yaml
  text: For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.
translation:
  language: pt
  text: Pois ele serve a duas paixões contrárias e não consegue obedecer a Deus, porque isso cegou a sua alma, e ele anda em pleno dia como se fosse noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθεσιν
  choice: paixões
  rationale: Mantém o sentido de impulsos ou desejos dominantes e moralmente desordenados, sem restringi-lo a simples emoções.
- source_word: δουλεύει
  choice: serve
  rationale: Expressa sujeição a senhores dominantes de modo natural; o contexto deixa clara a condição de escravidão.
- source_word: ὑπακοῦσαι
  choice: obedecer
  rationale: Equivalente direto e corrente para a ideia de dar ouvidos e submeter-se a Deus.
- source_word: ἐτύφλωσε
  choice: cegou
  rationale: Preserva a metáfora espiritual do texto grego.
- source_word: πορεύεται
  choice: anda
  rationale: Reproduz naturalmente a imagem de conduzir a vida ou caminhar, preservando aqui seu contraste espacial entre dia e noite.
theological_decisions:
- issue: Sujeito singular de ἐτύφλωσε após duas paixões no plural
  choice: isso cegou a sua alma
  alternative: elas cegaram a sua alma
  rationale: O verbo grego está no singular, embora o antecedente mais próximo seja o plural 'duas paixões'. O pronome neutro 'isso' preserva a forma singular e entende a cegueira como resultado da servidão descrita, sem corrigir silenciosamente o texto para o plural.
- issue: Cláusula final ausente na camada inglesa
  choice: incluir 'e ele anda em pleno dia como se fosse noite'
  alternative: omitir conforme o inglês consultivo
  rationale: A cláusula consta explicitamente no texto grego fornecido e deve ser traduzida com base na evidência da língua original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção 'em pleno dia como se fosse noite' torna idiomático o contraste grego sem enfraquecer sua imagem.
