base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/008.yaml
  text: They hinder the sacrifices of God, and do not remember the blessing of God. They do not listen when a prophet speaks, and resent words of godliness.
translation:
  language: pt
  text: 8. Impede os sacrifícios de Deus e não se lembra da bênção de Deus. Não escuta quando um profeta fala e se irrita com palavras de piedade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμποδίζει
  choice: impede
  rationale: Expressa diretamente a ideia de pôr obstáculo ou impedir, preservando o singular do verbo grego.
- source_word: Θυσίας Θεοῦ
  choice: os sacrifícios oferecidos a Deus
  rationale: O genitivo pode indicar relação ou destinação; esta formulação natural em português evita sugerir, sem necessidade, que os sacrifícios sejam realizados pelo próprio Deus.
- source_word: εὐλογίαν Θεοῦ
  choice: a bênção de Deus
  rationale: Mantém a formulação genitiva e sua possível amplitude sem explicitação indevida.
- source_word: οὐ μνημονεύει
  choice: não se lembra
  rationale: Equivalente corrente para recordar ou ter em mente.
- source_word: Προφήτου λαλοῦντος οὐκ ἀκούει
  choice: Não escuta quando um profeta fala
  rationale: Verte naturalmente a construção de genitivo absoluto e mantém a referência indefinida a um profeta.
- source_word: λόγους εὐσεβείας
  choice: palavras de piedade
  rationale: Preserva o sentido de discurso caracterizado por reverência e devoção a Deus, em registro digno e compreensível.
- source_word: προσοχθίζει
  choice: se irrita com
  rationale: Comunica a reação de aborrecimento, indignação ou ressentimento indicada pelo verbo, sem intensificação excessiva.
theological_decisions:
- issue: Número do sujeito implícito nos verbos
  choice: singular
  alternative: plural, como na camada inglesa revisada
  rationale: Os verbos gregos ἐμποδίζει, μνημονεύει, ἀκούει e προσοχθίζει estão todos na terceira pessoa do singular. A tradução segue a evidência do texto grego, embora o referente do sujeito venha do contexto anterior.
- issue: Sentido do genitivo em Θυσίας Θεοῦ
  choice: sacrifícios oferecidos a Deus
  alternative: sacrifícios de Deus
  rationale: A explicitação mínima da destinação produz português mais claro, sem impor uma leitura teológica denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta. Mantém-se o sujeito implícito no singular conforme os quatro verbos gregos, em contraste consciente com a harmonização plural da versão inglesa de consulta.
