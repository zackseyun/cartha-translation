lexical_decisions:
- source_word: ἔγνωκα
  choice: sei
  rationale: 'O perfeito grego tem valor presente resultativo: Judá adquiriu esse conhecimento e agora o possui.'
- source_word: ὅσα κακά
  choice: que males
  rationale: Expressa de modo natural em português a ideia de «quais/coisas más que», sem atenuar a avaliação moral do original.
- source_word: ποιήσετε
  choice: vocês farão
  rationale: Mantém o futuro e o sujeito plural, dirigindo-se aos descendentes ou ouvintes de Judá.
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: nos últimos dias
  rationale: Preserva a expressão temporal e escatológica tradicional, em linguagem corrente.
theological_decisions:
- issue: Possível caráter escatológico de «os últimos dias»
  choice: Manter «nos últimos dias» sem explicação interpretativa no corpo do texto
  alternative: Explicitar uma época histórica ou o fim do mundo
  rationale: A frase grega não define com maior precisão o período; a tradução deve conservar essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para o plural de segunda pessoa. A ordem foi levemente naturalizada, preservando o sentido e a incerteza textual por meio de nota.
