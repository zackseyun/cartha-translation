  text: E sei que maldades vocês cometerão nos últimos dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “nos últimos dias” aparece entre colchetes na edição grega usada, indicando incerteza textual.
