  text: It deprives his soul of every goodness, and holds him fast in pains and labors; it drives sleep away from him, and consumes his flesh.
translation:
  language: pt
  text: 7. Priva sua alma de toda bondade e o mantém preso a sofrimentos e trabalhos; afasta dele o sono e consome sua carne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: Priva
  rationale: Expressa diretamente a ideia de retirar ou deixar alguém sem algo.
- source_word: πάσης ἀγαθότητος
  choice: de toda bondade
  rationale: Mantém a abrangência de πάσης e o sentido moral amplo de ἀγαθότης, sem restringi-lo a bens ou benefícios.
- source_word: συνέχει
  choice: mantém preso
  rationale: Reproduz a noção de sujeitar ou reter firmemente, em português natural.
- source_word: πόνοις καὶ μόχθοις
  choice: a sofrimentos e trabalhos
  rationale: Distingue πόνοι, aflições ou dores, de μόχθοι, trabalhos penosos ou fadigas.
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: afasta dele o sono
  rationale: Verte a expressão grega incomum pelo seu sentido contextual de expulsar ou afastar o sono, evitando uma tradução portuguesa opaca.
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: consome sua carne
  rationale: Preserva a imagem forte de desgaste físico; o singular coletivo é mais idiomático em português do que 'suas carnes'.
theological_decisions:
- issue: Referência do sujeito verbal singular
  choice: Sujeito omitido em português
  alternative: Ela priva sua alma...
  rationale: O grego pressupõe um referente singular do contexto anterior, mas este versículo isolado não o nomeia. A omissão do pronome preserva essa dependência contextual sem impor gênero ou identificação.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela e vocabulário acessível. O ponto e vírgula preserva as duas séries de efeitos descritas no grego.
