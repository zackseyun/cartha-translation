  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/003.yaml
  text: And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me likewise.
translation:
  language: pt
  text: E Abraão, meu antepassado, abençoou-me para reinar em Israel, e Jacó me abençoou do mesmo modo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόπατός
  choice: antepassado
  rationale: Expressa com naturalidade o sentido de ancestral ou antepassado, sem especificar um grau de parentesco que o grego não determina.
- source_word: εὐλόγησέ με βασιλεύειν
  choice: abençoou-me para reinar
  rationale: Preserva a construção grega, na qual a bênção se relaciona ao reinado de Judá, sem explicitar além do texto se se trata de autorização, promessa ou capacitação.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Mantém a formulação espacial e política do original sem substituí-la por uma interpretação como “sobre Israel”.
- source_word: οὕτως
  choice: assim
  rationale: Reproduz a referência ao modo ou conteúdo semelhante da bênção de Jacó; em combinação com “também”, resulta em português claro e fiel.
theological_decisions:
- issue: Natureza da bênção para o reinado
  choice: abençoou-me para reinar
  alternative: abençoou-me, dizendo que eu reinaria
  rationale: A alternativa transformaria a construção infinitiva em discurso profético explícito. A tradução escolhida conserva a concisão e a possível amplitude da relação entre bênção e reinado.
- issue: Âmbito do reinado
  choice: em Israel
  alternative: sobre Israel
  rationale: Embora “sobre Israel” seja idiomático para o governo, o grego traz ἐν, “em”, e a leitura “em Israel” preserva essa forma sem impedir a compreensão régia.
translation_notes:
  register: Português moderno, digno e acessível, com construção próxima do grego. O ponto e vírgula separa com clareza as duas bênçãos paralelas. Não há marcadores de nota, pois nenhuma nota textual ou explicativa é necessária.
