lexical_decisions:
- source_word: ἣν
  choice: a qual
  rationale: Preserva o pronome relativo feminino e a forma fragmentária do grego, remetendo ao antecedente no contexto anterior sem o explicitar.
- source_word: ἔδωκέ μοι
  choice: me deu
  rationale: Reproduz diretamente a ideia de dádiva expressa pelo verbo δίδωμι e pelo pronome dativo.
- source_word: Κύριος
  choice: o Senhor
  rationale: Equivalente tradicional, claro e digno para Κύριος.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: na obediência a meu pai
  rationale: Mantém a construção com ἐν e evita transformá-la explicitamente em relação causal, preservando a concisão e a possível tensão semântica do original.
theological_decisions:
- issue: Relação entre a dádiva do Senhor e a obediência filial
  choice: na obediência a meu pai
  alternative: porque obedeci a meu pai
  rationale: A alternativa torna causal o que o grego expressa de modo menos determinado com ἐν; a tradução escolhida conserva essa abertura.
translation_notes:
  register: Português atual, digno e de leitura ampla. Conservou-se a sintaxe fragmentária e a vírgula final porque o versículo continua uma frase iniciada no contexto anterior.
