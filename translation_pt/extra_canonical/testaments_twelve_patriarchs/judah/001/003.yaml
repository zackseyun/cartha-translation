base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/003.yaml
  text: “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’
translation:
  language: pt
  text: '“Ouçam, meus filhos, a Judá, seu pai. Eu fui o quarto filho de meu pai Jacó, e Lia, minha mãe, deu-me o nome de Judá, dizendo: ‘Dou graças ao Senhor, porque ele me deu também um quarto filho.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: Escutem
  rationale: Imperativo plural direto e natural em português moderno, preservando o apelo solene aos filhos.
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην
  choice: Eu fui o quarto filho
  rationale: Expressa com naturalidade a posição de Judá entre os filhos, sem impor ao verbo um sentido mais específico do que o necessário.
- source_word: ἐπωνόμασέν με Ἰούδαν
  choice: deu-me o nome de Judá
  rationale: Formulação idiomática que preserva o ato de nomear.
- source_word: Ἀνθομολογοῦμαι
  choice: Dou graças
  rationale: No contexto da nomeação de Judá, comunica reconhecimento agradecido e louvor dirigido ao Senhor.
- source_word: καὶ τέταρτον υἱόν
  choice: também um quarto filho
  rationale: Mantém a força aditiva de καί e a referência ordinal do grego.
theological_decisions:
- issue: Referente de Κυρίῳ
  choice: ao Senhor
  alternative: ao SENHOR
  rationale: O grego traz o título Κύριος, sem evidência textual suficiente neste verso para converter tipograficamente o termo no nome divino.
- issue: Sentido de Ἀνθομολογοῦμαι
  choice: Dou graças
  alternative: Louvo
  rationale: A escolha preserva o componente de gratidão explícito no contexto, sem excluir a dimensão de louvor.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção vocativa abrupta “Judá, seu pai” foi preservada para refletir a sintaxe do texto grego, em que o patriarca se identifica na terceira pessoa.
