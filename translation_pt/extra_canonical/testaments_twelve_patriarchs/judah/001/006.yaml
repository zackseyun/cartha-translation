base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/006.yaml
  text: And when I had grown up, my father prayed for me, saying, ‘You shall be a king, prospering in all things.’
translation:
  language: pt
  text: 'E aconteceu que, quando me tornei adulto, meu pai orou por mim, dizendo: “Você será rei e prosperará em tudo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: cresci
  rationale: No contexto da passagem, o verbo indica que Judá chegou à maturidade; “cresci” comunica isso de modo natural e claro.
- source_word: ηὔξατό μοι
  choice: orou por mim
  rationale: A construção expressa uma oração feita em favor de Judá, e não simplesmente uma bênção pronunciada sobre ele.
- source_word: Βασιλεὺς ἔσῃ
  choice: Você será rei
  rationale: Tradução direta da predicação futura, em português atual e sem acrescentar artigo indefinido desnecessário.
- source_word: κατευοδούμενος ἐν πᾶσιν
  choice: e prosperará em tudo
  rationale: O particípio descreve êxito ou prosperidade abrangente; a forma verbal coordenada soa natural em português e preserva seu valor associado à promessa.
theological_decisions:
- issue: Natureza das palavras do pai
  choice: orou por mim
  alternative: abençoou-me
  rationale: O verbo grego, conforme a leitura-fonte, favorece a ideia de oração em favor de alguém. A tradução evita transformar silenciosamente essa oração em uma bênção formal.
- issue: Relação entre realeza e prosperidade
  choice: Você será rei e prosperará em tudo
  alternative: Você será um rei próspero em todas as coisas
  rationale: A coordenação preserva tanto a promessa de realeza quanto a afirmação abrangente de prosperidade, sem limitar a segunda apenas à função régia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O início narrativo “E aconteceu que” conserva o encadeamento semítico perceptível no grego; o discurso direto usa “você” por naturalidade contemporânea.
