  text: Καὶ ἐγένετο ὡς ἡδρύνθην²⁹ καὶ³⁰ ὁ πατήρ μου³¹ *ηὔξατό μοι³², λέγων· Βασιλεὺς ἔσῃ³³ κατευοδούμενος³⁴ ἐν³⁵ πᾶσιν.
