  source_fidelity: O título reproduz adequadamente Διαθήκη Ἰούδα e identifica Judá como o quarto filho de Jacó e Lia. «Cópia das palavras» corresponde diretamente a Ἀντίγραφον λόγων, e «que ele dirigiu a seus filhos antes de morrer» transmite com fidelidade ἃ ἐλάλησε τοῖς υἱοῖς αὐτοῦ πρὸ τοῦ ἀποθανεῖν αὐτόν. A explicitação do sujeito por «ele» é inequívoca no contexto.
  naturalness: O português é moderno, claro e de registro condizente com um cabeçalho testamentário antigo. «Dirigiu a seus filhos» é uma formulação idiomática para palavras proferidas a eles.
  terminology: «Testamento» é o título tradicional e apropriado para Διαθήκη neste gênero. Os nomes «Jacó», «Lia» e «Judá» seguem o uso bíblico português amplamente reconhecido. Não há termos teológicos controversos neste trecho.
