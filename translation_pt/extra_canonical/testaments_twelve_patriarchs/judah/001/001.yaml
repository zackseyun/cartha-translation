base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/001.yaml
  text: 'The Testament of Judah, the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.'
translation:
  language: pt
  text: 'Testamento de Judá, o quarto filho de Jacó e Lia


    1 Cópia das palavras de Judá, que ele dirigiu a seus filhos antes de morrer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testamento
  rationale: No título da obra, designa as palavras finais e disposições de Judá; «Testamento» preserva o gênero literário tradicional e é natural em português.
- source_word: Ἀντίγραφον
  choice: Cópia
  rationale: Equivale diretamente a um escrito reproduzido ou transcrito, sem acrescentar a ideia interpretativa de «relato».
- source_word: λόγων
  choice: palavras
  rationale: Mantém o sentido amplo de λόγοι como declarações ou discurso, em correspondência formal com o grego.
- source_word: ἐλάλησε
  choice: dirigiu
  rationale: Em português, «palavras que dirigiu a seus filhos» expressa naturalmente o ato de falar-lhes, evitando a construção menos idiomática «falou palavras».
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτόν
  choice: antes de morrer
  rationale: Reproduz de modo claro e natural a oração temporal grega; o sujeito continua inequivocamente sendo Judá.
