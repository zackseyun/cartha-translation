  text: Καὶ ἔσονται ὡς καταιγίδες⁶¹ ψευδοπροφῆται⁶³, καὶ πάντας τοὺς δικαίους διώξουσιν⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/009.yaml
  text: And there will be false prophets like storms[a],
translation:
  language: pt
  text: E haverá falsos profetas como tempestades, e eles perseguirão todos os justos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταιγίδες
  choice: tempestades
  rationale: Preserva a imagem forte de fenômenos violentos e destrutivos, em português natural.
- source_word: ψευδοπροφῆται
  choice: falsos profetas
  rationale: Equivalente direto e corrente para os que alegam falar profeticamente, mas são falsos.
- source_word: διώξουσιν
  choice: perseguirão
  rationale: Expressa o sentido hostil de perseguir ou hostilizar, adequado ao objeto pessoal τοὺς δικαίους.
- source_word: τοὺς δικαίους
  choice: todos os justos
  rationale: Traduz πάντας e mantém a designação moral e religiosa sem explicitação denominacional.
theological_decisions:
- issue: Identidade dos «justos»
  choice: Manter «os justos» sem explicar quem integra o grupo
  alternative: Substituir por «os que fazem o que é justo» ou identificar um grupo religioso específico
  rationale: O grego usa uma designação substantivada ampla; explicá-la resolveria uma questão que o texto deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da comparação vívida do grego. A tradução segue integralmente o testemunho grego fornecido, que inclui a oração sobre a perseguição; por isso, não reproduz a nota da camada inglesa que afirmava haver interrupção após «tempestades».
