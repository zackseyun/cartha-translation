revisions:
- from: Pois os reis serão como monstros marinhos, engolindo pessoas como peixes; escravizarão filhos e filhas de pessoas livres e tomarão à força casas, campos, rebanhos e riquezas.
  to: Pois os que reinarão serão como monstros marinhos, engolindo pessoas como peixes; escravizarão filhos e filhas livres e arrebatarão casas, campos, rebanhos e riquezas.
  rationale: 'A revisão corrige duas relações sintáticas relevantes: identifica os agentes como aqueles que reinarão e faz de “livres” uma qualificação direta de “filhos e filhas”. Também substitui “tomarão à força” por “arrebatarão”, expressão concisa que preserva a força de ἁρπάσουσιν.'
  reviewer_model: gpt-5.6-terra
