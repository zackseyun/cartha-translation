base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/007.yaml
  text: For the kings will be like sea monsters, swallowing people like fish; they will make sons and daughters of free people slaves, and they will seize houses, fields, flocks, and wealth.
translation:
  language: pt
  text: Pois os que reinarão serão como monstros marinhos, engolindo pessoas como peixes; escravizarão filhos e filhas livres e arrebatarão casas, campos, rebanhos e riquezas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κήτη
  choice: monstros marinhos
  rationale: Expressa grandes criaturas do mar, inclusive de aspecto ameaçador, sem restringir indevidamente o termo a uma espécie moderna.
- source_word: ἀνθρώπους
  choice: pessoas
  rationale: Representa o sentido humano genérico do termo e evita uma leitura exclusivamente masculina.
- source_word: καταδουλώσουσιν
  choice: escravizarão
  rationale: Verbo português natural e forte que preserva a ideia explícita de reduzir alguém à escravidão.
- source_word: χρήματα
  choice: riquezas
  rationale: No contexto de bens tomados por governantes, designa recursos e posses de valor de modo amplo e natural.
- source_word: ἁρπάσουσιν
  choice: tomarão à força
  rationale: Preserva a força predatória do verbo, mais intensa que um simples 'tomarão'.
