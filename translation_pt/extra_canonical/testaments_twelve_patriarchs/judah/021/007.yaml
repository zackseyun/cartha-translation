review_pass:
  verdict: revise
  source_fidelity: A imagem de κήτη como “monstros marinhos”, o sentido inclusivo de ἀνθρώπους como “pessoas” e a força predatória de ἁρπάσουσιν estão bem representados. Contudo, οἱ βασιλεύσουσιν é literalmente “os que reinarão/os que governarão”, não o substantivo “reis”; e ἐλευθέρους qualifica diretamente “filhos e filhas”, não seus pais.
  naturalness: A redação é clara e natural. “Filhos e filhas livres” é igualmente idiomático e torna explícita a relação sintática do grego. “Arrebatarão” mantém um registro vigoroso e natural para a lista final.
  terminology: “Monstros marinhos”, “pessoas”, “escravizarão” e “riquezas” são escolhas adequadas. A revisão preserva o alcance não específico de κήτη e a referência direta aos filhos e filhas livres.
  issues:
  - severity: medium
    issue: “os reis” traduz οἱ βασιλεύσουσιν como um substantivo (“reis”).
    rationale: 'A construção grega é um artigo com particípio/futuro substantivado: “os que reinarão” (ou “os que governarão”). A formulação revisada preserva essa nuance sem alterar o sentido.'
  - severity: high
    issue: “filhos e filhas de pessoas livres” desloca ἐλευθέρους para os pais.
    rationale: No grego, ἐλευθέρους concorda com “filhos e filhas”; trata-se de filhos e filhas que são livres e serão reduzidos à escravidão.
  revised_text: Pois os que reinarão serão como monstros marinhos, engolindo pessoas como peixes; escravizarão filhos e filhas livres e arrebatarão casas, campos, rebanhos e riquezas.
  revised_footnotes: []
  revision_rationale: 'A revisão corrige duas relações sintáticas relevantes: identifica os agentes como aqueles que reinarão e faz de “livres” uma qualificação direta de “filhos e filhas”. Também substitui “tomarão à força” por “arrebatarão”, expressão concisa que preserva a força de ἁρπάσουσιν.'
