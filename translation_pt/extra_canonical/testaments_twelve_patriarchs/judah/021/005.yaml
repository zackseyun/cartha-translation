  text: Ὁ γὰρ⁵ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ²⁸, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν³¹ ἐντρυφημάτων³² υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/005.yaml
  text: For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer the firstfruits of the delights of the sons of Israel[c] to him. But you shall be king of Jacob.
translation:
  language: pt
  text: 'Pois o anjo do Senhor me disse: “O Senhor o escolheu acima de você para se aproximar dele, comer à sua mesa e lhe oferecer as primícias das delícias dos filhos de Israel.[a] Mas você será rei de Jacó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “as primícias das delícias dos filhos de Israel” provavelmente se refere a produtos escolhidos ou às primeiras ofertas especialmente ricas trazidas por Israel.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπὲρ σὲ
  choice: acima de você
  rationale: Preserva a comparação expressa pelo grego sem a transformar em simples substituição (‘em vez de você’).
- source_word: προσεγγίζειν αὐτῷ
  choice: se aproximar dele
  rationale: Mantém a linguagem de aproximação, possivelmente cultual, sem explicitar uma função sacerdotal que o versículo apenas sugere pelo contexto.
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: comer à sua mesa
  rationale: Verte naturalmente a expressão idiomática grega, cujo sentido é participar da mesa de alguém.
- source_word: ἀπαρχὰς ... ἐντρυφημάτων
  choice: as primícias das delícias
  rationale: Conserva tanto o sentido cultual de ‘primícias’ quanto a ideia de produtos agradáveis, seletos ou ricos em ἐντρυφήματα, deixando a nota esclarecer a expressão incomum.
- source_word: βασιλεὺς Ἰακώβ
  choice: rei de Jacó
  rationale: Reproduz a formulação concisa do grego, em que ‘Jacó’ funciona como designação do povo.
theological_decisions:
- issue: Contraste entre a escolha de ‘ele’ e o reinado de ‘você’
  choice: Manter os pronomes e o contraste sem identificar explicitamente as pessoas no próprio versículo
  alternative: Substituir os pronomes por ‘Levi’ e ‘Judá’
  rationale: O texto grego usa αὐτόν e σύ; preservar essa forma evita acrescentar ao versículo identificações dependentes do contexto e mantém a tensão entre prerrogativa cultual e realeza.
- issue: Possível caráter sacerdotal de ‘aproximar-se’ e ‘oferecer’
  choice: Preservar a terminologia de aproximação e oferta sem inserir ‘como sacerdote’
  alternative: Explicitar que ele foi escolhido para exercer o sacerdócio
  rationale: A linguagem tem forte ressonância cultual, mas o grego não contém um título sacerdotal nesta frase.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe foi suavizada para leitura natural, mas foram preservados os pronomes, a comparação ‘acima de você’ e a linguagem cultual potencialmente ambígua do original.
