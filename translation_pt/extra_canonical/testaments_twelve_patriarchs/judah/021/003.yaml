  text: A mim ele deu as coisas da terra; a ele, as coisas do céu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπὶ γῆς
  choice: as coisas da terra
  rationale: Expressa naturalmente em português aquilo que pertence ao âmbito terreno, sem acrescentar uma especificação ausente no grego.
- source_word: τὰ ἐν οὐρανοῖς
  choice: as coisas do céu
  rationale: Verte o plural grego οὐρανοῖς pelo singular coletivo e idiomático «céu», preservando o contraste entre os âmbitos terreno e celestial.
theological_decisions:
- issue: Referentes dos pronomes ἐμοί, ἐκείνῳ e do sujeito implícito de ἔδωκε
  choice: Manter «a mim», «a ele» e o sujeito «ele» sem identificar os personagens no próprio versículo
  alternative: Explicitar os referentes pelo contexto mais amplo
  rationale: O texto grego deste versículo emprega pronomes e um sujeito verbal implícito; identificá-los aqui resolveria uma dependência contextual que o original preserva.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A repetição de «coisas» preserva a estrutura contrastiva do grego; «do céu» é mais natural para leitores brasileiros e amplamente compreensível no português internacional.
