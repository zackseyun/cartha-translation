revisions:
- from: 'E você será entre eles como o mar. Pois, assim como nele há justos e injustos — uns são levados cativos, e outros enriquecem —, assim também haverá em você todo tipo de gente: uns correrão perigo[a] ao serem levados cativos, e outros enriquecerão, apoderando-se do que pertence a outros.'
  to: 'Entre eles, você será como o mar. Pois, assim como nele há justos e injustos — uns são levados cativos, e outros enriquecem —, assim também haverá em ti pessoas de toda espécie: uns correrão perigo[a] ao serem levados cativos, e outros enriquecerão, apoderando-se do que pertence a outros.'
  rationale: A revisão melhora a ordem e o registro do português e torna mais explícita a abrangência de πᾶν γένος ἀνθρώπων, sem alterar a ambiguidade quanto à relação entre justos/injustos e os destinos descritos. A nota conserva a incerteza do termo assinalado como corrompido. Embora o texto inglês de auditoria acrescente «storm-tossed», essa ideia não ocorre no grego fornecido e não foi introduzida na revisão portuguesa.
  reviewer_model: gpt-5.6-terra
