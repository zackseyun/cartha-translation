source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἔσῃ³⁶ ἐν αὐτοῖς³⁷ ὡς³⁸ ἡ³⁹ θάλασσα. Καθάπερ⁴⁰ γὰρ⁴¹ ἐν αὐτῇ δίκαιοι καὶ ἄδικοι, οἱ μὲν αἰχμαλωτίζονται οἱ δὲ πλουτοῦσιν⁴⁴, οὕτως καὶ ἐν σοὶ πᾶν γένος ἀνθρώπων· οἱ μὲν †κωδυνεύσουσιν αἰχμαλωτιζόμενοι, οἱ δὲ πλουτοῦντες ἁρπάζοντες τὰ ἀλλότρια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/006.yaml
  text: 'And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.'
translation:
  language: pt
  text: 'Entre eles, você será como o mar. Pois, assim como nele há justos e injustos — uns são levados cativos, e outros enriquecem —, assim também haverá em ti pessoas de toda espécie: uns correrão perigo[a] ao serem levados cativos, e outros enriquecerão, apoderando-se do que pertence a outros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “correrão perigo” está corrompido no manuscrito; o sentido adotado é uma reconstrução provável.
    reason: Sinalizar honestamente a incerteza textual indicada pela cruz crítica em †κωδυνεύσουσιν.
lexical_decisions:
- source_word: θάλασσα
  choice: mar
  rationale: Equivalente direto e natural, preservando a comparação central.
- source_word: αἰχμαλωτίζονται / αἰχμαλωτιζόμενοι
  choice: são levados cativos / ao serem levados cativos
  rationale: Expressa a ideia de captura e cativeiro sem restringi-la indevidamente a uma formulação militar específica.
- source_word: πᾶν γένος ἀνθρώπων
  choice: todo tipo de gente
  rationale: Formulação idiomática em português para a diversidade de pessoas; evita que “raça” introduza categorias modernas não exigidas pelo grego.
- source_word: ἁρπάζοντες τὰ ἀλλότρια
  choice: apoderando-se do que pertence a outros
  rationale: Preserva tanto a ação predatória de ἁρπάζω quanto o sentido possessivo de τὰ ἀλλότρια.
theological_decisions:
- issue: Relação entre justos e injustos e os dois destinos descritos
  choice: “há justos e injustos — uns... e outros...”
  alternative: Associar explicitamente os justos aos cativos e os injustos aos ricos
  rationale: A construção grega não identifica inequivocamente cada grupo moral com um dos destinos; a tradução conserva essa ambiguidade e evita impor uma correspondência teológica.
- issue: Sentido corporativo de ἐν σοὶ
  choice: “em você”
  alternative: “entre os seus descendentes”
  rationale: Mantém a imagem e a formulação do texto-fonte, sem explicitar uma referência aos descendentes que está apenas implícita no contexto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição estrutural “uns... e outros...” foi preservada, enquanto “haverá” foi suprido na segunda comparação para tornar natural uma oração elíptica no grego. A pontuação explicita a estrutura sem resolver a ambiguidade moral do original.
