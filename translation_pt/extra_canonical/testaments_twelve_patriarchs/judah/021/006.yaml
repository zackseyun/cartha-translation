review_pass:
  verdict: revise
  source_fidelity: A comparação com o mar e a estrutura distributiva são preservadas. Contudo, «πᾶν γένος ἀνθρώπων» é mais bem representado por «pessoas de toda espécie» do que por «todo tipo de gente», que pode soar excessivamente coloquial e atenua a abrangência da expressão. A nota textual sobre †κωδυνεύσουσιν é apropriada.
  naturalness: «Você será entre eles como o mar» soa pouco natural em português, sobretudo pela posição de «entre eles». A anteposição de «entre eles» e a substituição de «em você» por «em ti» tornam a formulação mais fluida e mantêm um registro apropriado para um testamento antigo, sem perder legibilidade.
  terminology: «mar», «levados cativos», «enriquecerão» e «apoderando-se do que pertence a outros» refletem adequadamente o grego. «Pessoas de toda espécie» comunica a generalidade de πᾶν γένος ἀνθρώπων sem importar categorias raciais modernas.
  issues:
  - severity: low
    issue: Ordem pouco idiomática na oração inicial
    rationale: Em «você será entre eles como o mar», o sintagma «entre eles» interrompe de modo pouco natural a predicação comparativa. «Entre eles, você será como o mar» preserva todos os elementos e melhora a leitura.
  - severity: low
    issue: Formulação algo coloquial e menos abrangente para πᾶν γένος ἀνθρώπων
    rationale: «Todo tipo de gente» é compreensível, mas «pessoas de toda espécie» preserva com mais clareza a abrangência da expressão grega e se adequa melhor ao registro.
