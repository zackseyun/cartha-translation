base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/004.yaml
  text: For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.
translation:
  language: pt
  text: Pois é assim que o sacerdócio de Deus supera o reino terreno, a menos que, por causa dos pecados, se afaste do Senhor e seja dominado pelo reino terreno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχει
  choice: supera
  rationale: Expressa de modo natural a superioridade indicada pelo verbo grego, sem acrescentar uma ideia não explícita de autoridade.
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: o sacerdócio de Deus
  rationale: Mantém a construção genitiva e sua possível amplitude, sem decidir se indica origem, pertença ou serviço a Deus.
- source_word: τῆς ἐπιγείου βασιλείας
  choice: o reino terreno
  rationale: Preserva o contraste entre o sacerdócio divino e a realeza ou domínio de âmbito terreno.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: se afaste do Senhor
  rationale: Comunica a ideia de cair para fora ou apartar-se, em português corrente e digno.
- source_word: κυριευθῇ
  choice: seja dominado
  rationale: Reproduz a voz passiva e o sentido de ficar sob o senhorio ou controle do reino terreno.
theological_decisions:
- issue: Condição que limita a superioridade do sacerdócio
  choice: a menos que, por causa dos pecados, se afaste do Senhor
  alternative: se não cair do Senhor por causa dos pecados
  rationale: 'Conserva a tensão do texto: o sacerdócio é superior, mas pode perder sua posição mediante o pecado, sem explicar além do que o grego declara.'
- issue: Agente do domínio final
  choice: seja dominado pelo reino terreno
  alternative: seja governado por aquele do reino terreno
  rationale: A leitura principal permite entender o reino terreno como agente. A formulação evita introduzir uma pessoa específica que o texto não identifica claramente.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do grego sem soar artificial. A repetição de “reino terreno” foi mantida para preservar a estrutura e o contraste do original.
