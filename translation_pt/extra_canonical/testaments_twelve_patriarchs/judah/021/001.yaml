source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXI. Καὶ νῦν, τέκνα μου¹, παραγγέλλω ὑμῖν, ἀγαπᾶτε² τὸν Λευὶ³, ἵνα διαμείνητε⁴, καὶ⁵ μὴ ἐπαίρεσθε⁷ ἐπ᾽ αὐτὸν⁸, ἵνα μὴ ἐξολοθρευθῆτε⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/001.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves against him, lest you be utterly destroyed.'
translation:
  language: pt
  text: 'E agora, meus filhos, ordeno a vocês: amem Levi, para que permaneçam, e não se exaltem contra ele, para que não sejam exterminados.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: ordeno
  rationale: Expressa a força direta de uma ordem ou incumbência solene.
- source_word: ἀγαπᾶτε
  choice: amem
  rationale: Imperativo presente dirigido aos filhos, vertido de modo natural e direto.
- source_word: διαμείνητε
  choice: permaneçam
  rationale: Preserva o sentido relativamente aberto de continuar, subsistir ou permanecer, sem especificar indevidamente o complemento.
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: não se levantem contra ele
  rationale: No contexto, comunica exaltação arrogante que se volta contra Levi; evita a possível leitura meramente espacial de 'acima dele'.
- source_word: ἐξολοθρευθῆτε
  choice: sejam exterminados
  rationale: Mantém a intensidade do verbo, que denota destruição ou eliminação completa.
theological_decisions:
- issue: Sentido da permanência prometida
  choice: para que permaneçam
  alternative: para que continuem a existir
  rationale: A formulação mantém a ambiguidade do grego διαμείνητε, sem definir se a referência é à sobrevivência, continuidade histórica ou firmeza.
- issue: Relação com Levi
  choice: não se levantem contra ele
  alternative: não se exaltem acima dele
  rationale: A escolha preserva a advertência contra oposição arrogante, sem introduzir uma doutrina específica sobre a supremacia levítica.
- issue: Relação entre as duas orações finais
  choice: para que não sejam exterminados
  alternative: caso contrário, serão exterminados
  rationale: Repete a construção final do grego com ἵνα μή e evita tornar a consequência mais categoricamente causal do que o texto exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais ('a vocês'). A estrutura imperativa e as duas orações de finalidade foram preservadas. Não há notas textuais necessárias neste versículo.
