review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva os elementos principais do grego, inclusive a construção elíptica com σάρκας e κόρακας e a repetição de «mal» e de «exaltar». Não se deve acrescentar «íbis», pois essa ave não figura no texto grego fornecido. Convém, porém, ajustar «para o mal em sua ganância»: ἐπὶ κακῷ se liga mais naturalmente à orientação para o mal, e τῇ πλεονεξίᾳ indica o meio ou a motivação («pela ganância»).'
  naturalness: O texto é compreensível e de registro apropriado. A coordenação após o ponto e vírgula fica mais fluida com «e avançarão», e «em arrogância semelhante» reproduz a formulação comparativa sem introduzir um referente específico não expresso com segurança.
  terminology: «Ganância», «arrogância», «corvos» e «exaltar-se» são escolhas adequadas. Os colchetes e a nota identificam corretamente o verbo suprido em uma passagem sintaticamente difícil.
  issues:
