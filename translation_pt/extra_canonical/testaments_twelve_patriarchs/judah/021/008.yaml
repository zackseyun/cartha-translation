  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ πολλῶν σάρκας ἀδίκως⁵⁵ κόρακας⁵⁵ ἐπὶ κακῷ⁶⁰ τῇ πλεονεξίᾳ ὑψούμενοι· καὶ προκόψουσιν ἐπὶ κακὰ καὶ ὑπερηφανίᾳ τοιούτου ἕως ὑψοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/008.yaml
  text: And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed.
translation:
  language: pt
  text: E, injustamente, [encherão] os corvos com a carne de muitos[a], exaltando-se para o mal pela ganância; e avançarão no mal e em arrogância semelhante, até se exaltarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego desta frase é conciso e sintaticamente difícil: menciona «a carne de muitos» e «os corvos», mas não expressa o verbo «encher». O verbo foi suprido entre colchetes para tornar explícita a imagem dos corvos alimentando-se dos mortos.'
    reason: textual_difficulty
lexical_decisions:
- source_word: σάρκας ... κόρακας
  choice: '[encherão] os corvos com a carne'
  rationale: O grego apresenta dois acusativos, “carne” e “corvos”, mas não traz um verbo expresso. “Encherão” torna compreensível a imagem de aves carniceiras alimentadas com os mortos, sem ocultar a reconstrução, por isso aparece entre colchetes.
- source_word: πλεονεξίᾳ
  choice: ganância
  rationale: Expressa de modo natural o desejo insaciável de possuir ou obter mais, preservando aqui o sentido moral negativo.
- source_word: ὑψούμενοι ... ὑψοῦνται
  choice: exaltando-se ... se exaltarem
  rationale: Mantém a repetição e a imagem vertical do grego, sem reduzir antecipadamente seu sentido a simples orgulho.
- source_word: ὑπερηφανίᾳ
  choice: arrogância
  rationale: Termo corrente e digno para a soberba altiva indicada pelo substantivo grego.
theological_decisions:
- issue: Sentido da exaltação final
  choice: se exaltarem
  alternative: serem exaltados
  rationale: Embora ὑψοῦνται possa ser formalmente médio ou passivo, o contexto de ganância e arrogância, junto do particípio reflexivo ὑψούμενοι, favorece a leitura de autoexaltação; a formulação não acrescenta um agente divino.
- issue: Referência a aves carniceiras
  choice: mencionar apenas os corvos
  alternative: “corvos e íbis”, como na camada inglesa de consulta
  rationale: O texto grego fornecido contém κόρακας (“corvos”), mas não contém o termo grego para “íbis”. Por isso, a tradução principal não acrescenta uma ave ausente da fonte apresentada.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A construção conserva a repetição de “mal” e “exaltar”, característica do grego, e sinaliza por colchetes o único verbo suprido.
