    issue: Relação de «ganância» com a oração
    rationale: «em sua ganância» pode sugerir apenas uma circunstância genérica. «pela ganância» representa de modo mais direto o dativo τῇ πλεονεξίᾳ e conserva a ligação com a autoexaltação.
  - severity: low
    issue: Formulação de τοιούτου ὑπερηφανίᾳ
    rationale: «em semelhante arrogância» é possível, mas «em arrogância semelhante» é mais natural em português e mantém a comparação sem especificar indevidamente quem seria «tal» pessoa ou grupo.
