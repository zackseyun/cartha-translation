  to: E, injustamente, [encherão] os corvos com a carne de muitos[a], exaltando-se para o mal pela ganância; e avançarão no mal e em arrogância semelhante, até se exaltarem.
  rationale: A revisão conserva a solução explicitamente assinalada para a elipse verbal e não importa a leitura inglesa de «íbis», ausente da fonte grega apresentada. Ela apenas torna mais clara a relação causal ou instrumental da ganância e melhora a fluência da segunda oração, preservando a ambiguidade da autoexaltação final.
