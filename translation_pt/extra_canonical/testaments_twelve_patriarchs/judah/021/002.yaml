source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ἐμοὶ γὰρ¹⁰ ἔδωκεν¹¹ ὁ Θεὸς¹² τὴν βασιλείαν, κἀκείνῳ¹² τὴν ἱερατείαν¹³, καὶ¹⁴ ὑπέταξε¹⁴ τὴν βασιλείαν τῇ ἱερωσύνῃ¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/002.yaml
  text: For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood.
translation:
  language: pt
  text: Pois Deus deu a mim o reino, e a ele, o sacerdócio; e sujeitou o reino ao sacerdócio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλείαν
  choice: reino
  rationale: O termo grego pode indicar realeza, domínio régio ou reino. Aqui, em paralelo institucional com o sacerdócio e como objeto de sujeição, “reino” preserva bem a amplitude do original.
- source_word: ἱερατείαν / ἱερωσύνῃ
  choice: sacerdócio
  rationale: As duas formas se referem à função ou instituição sacerdotal; usar “sacerdócio” em ambos os casos mantém a coesão lexical do versículo.
- source_word: ὑπέταξε
  choice: sujeitou
  rationale: Tradução direta que conserva a forte relação de subordinação expressa pelo verbo grego, sem reinterpretá-la como mera cooperação ou precedência honorífica.
theological_decisions:
- issue: Relação entre reino e sacerdócio
  choice: “sujeitou o reino ao sacerdócio”
  alternative: “colocou o reino sob a autoridade do sacerdócio”
  rationale: A formulação escolhida preserva de modo conciso a subordinação explícita no grego, sem explicar qual seria seu alcance político ou teológico.
- issue: Identidade do referente de κἀκείνῳ
  choice: “a ele”
  alternative: explicitar o nome ou a linhagem do referente
  rationale: O versículo usa um pronome demonstrativo e depende do contexto anterior. Manter “a ele” evita inserir no texto uma identificação não expressa nesta unidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem soar artificial. A elipse verbal em “e a ele, o sacerdócio” é natural em português e conserva o paralelismo.
