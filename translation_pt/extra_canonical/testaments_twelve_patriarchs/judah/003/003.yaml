base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/003.yaml
  text: And I found Achor, a giant man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.
translation:
  language: pt
  text: E encontrei o rei Acor, um gigante, que, montado a cavalo, disparava flechas para a frente e para trás. Então, dando um salto, peguei uma pedra de sessenta litras[a], lancei-a contra o cavalo e o matei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A litra era uma antiga unidade de peso. Sessenta litras correspondiam aproximadamente a vinte quilogramas.
    reason: Esclarece uma medida antiga sem substituí-la no texto por uma equivalência moderna apenas aproximada.
  - marker: b
    text: 'Ou: «lancei-a contra o cavalo e matei Acor». O pronome grego pode referir-se ao cavalo ou a Acor.'
    reason: Preserva a ambiguidade genuína do referente masculino no texto grego.
lexical_decisions:
- source_word: βασιλέα γίγαντα
  choice: o rei Acor, um gigante
  rationale: Conserva tanto o título βασιλέα quanto a descrição γίγαντα, sem omitir nenhum dos elementos presentes no grego.
- source_word: βάλλοντα τόξα ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου
  choice: montado a cavalo, disparava flechas para a frente e para trás
  rationale: Expressa de modo natural a ação de atirar com arco em ambas as direções enquanto estava a cavalo.
- source_word: λίθον ἑξήκοντα λιτρῶν
  choice: uma pedra de sessenta litras
  rationale: Mantém transliterada a antiga unidade de peso, pois uma conversão no corpo do texto daria falsa precisão.
- source_word: δέδωκα τῷ ἵππῳ
  choice: lancei-a contra o cavalo
  rationale: O grego é literalmente algo como 'dei-a ao cavalo'; no contexto, a formulação portuguesa comunica que a pedra foi arremessada contra ele.
theological_decisions:
- issue: Referente de αὐτόν em καὶ ἀπέκτεινα αὐτόν
  choice: o matei, com referência imediata ao cavalo
  alternative: e matei Acor
  rationale: Tanto ἵππος quanto Acor são masculinos, portanto a forma pronominal permite ambiguidade. A referência mais próxima é o cavalo, mas a alternativa é registrada em nota para não eliminar a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa fluente. Foram preservados o título de Acor, sua descrição como gigante, o disparo em duas direções e o fato de estar montado, elementos explícitos no grego mas reduzidos na camada inglesa de consulta.
