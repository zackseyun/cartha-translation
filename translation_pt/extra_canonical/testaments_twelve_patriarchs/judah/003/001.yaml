base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/001.yaml
  text: And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I brought him down and so killed him.
translation:
  language: pt
  text: Quando os dois reis dos cananeus vieram, revestidos de armadura, contra os nossos rebanhos, acompanhados de muita gente, eu, sozinho, corri contra um dos reis e lhe despedacei os ossos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: revestidos de armadura
  rationale: Expressa de modo natural o particípio que indica estarem equipados com couraça ou armadura, sem limitar indevidamente o termo a uma única peça defensiva.
- source_word: ἐπὶ τὰ ποίμνια ἡμῶν
  choice: contra os nossos rebanhos
  rationale: A preposição, no contexto de uma investida armada, tem sentido hostil; “rebanhos” traduz diretamente ποίμνια.
- source_word: λαὸς πολὺς μετ᾽ αὐτῶν
  choice: acompanhados de muita gente
  rationale: Formulação corrente em português que preserva a ideia de uma numerosa força humana junto aos reis.
- source_word: κἀγὼ μόνος
  choice: eu, sozinho
  rationale: Mantém a ênfase explícita do grego na ação solitária de Judá.
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: lhe despedacei os ossos
  rationale: Traduz diretamente a ação violenta expressa pelo verbo e seu objeto, “os ossos dele”. A redação inglesa consultiva apresenta uma sequência interpretativa diferente, mas o texto grego fornecido não menciona canelas, derrubada nem morte de forma explícita.
