  text: And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.
translation:
  language: pt
  text: Enquanto eu lhe tirava a couraça, eis que oito homens, seus companheiros, começaram a lutar contra mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δὲ τῷ ἐκδύειν με τὸν θώρακα αὐτοῦ
  choice: Enquanto eu lhe tirava a couraça
  rationale: A construção temporal com infinitivo é vertida naturalmente por “enquanto”; ἐκδύειν, neste contexto, indica retirar a armadura de alguém, e θώραξ corresponde a “couraça”.
- source_word: ἰδού
  choice: eis que
  rationale: Preserva o marcador grego de irrupção e chama a atenção para o aparecimento inesperado dos oito homens.
- source_word: ἑταῖροι αὐτοῦ
  choice: seus companheiros
  rationale: “Companheiros” reproduz o sentido relacional de ἑταῖροι sem especificar indevidamente amizade, tropa ou estatuto.
- source_word: ἤρξαντο πολεμεῖν με
  choice: começaram a lutar contra mim
  rationale: Mantém o aspecto incoativo de ἤρξαντο e explicita o valor adversativo do objeto de πολεμεῖν em português idiomático.
