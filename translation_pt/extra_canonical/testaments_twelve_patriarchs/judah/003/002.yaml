  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/002.yaml
  text: And the other king, Taphou, while he was sitting on the horse, I killed; and so I scattered all his people.
translation:
  language: pt
  text: Quanto ao outro rei, Tafou, matei-o enquanto estava montado no cavalo; e assim dispersei todo o seu povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν δὲ ἕτερον βασιλέα
  choice: Quanto ao outro rei
  rationale: A construção topicalizada preserva a ênfase do acusativo antecipado e produz uma frase natural em português.
- source_word: τὸν Ταφούα
  choice: Tafou
  rationale: Transliteração portuguesa simples do nome grego Ταφούα, em consonância com a forma Taphou da camada de consulta inglesa.
- source_word: καθήμενον ἐπὶ τοῦ ἵππου
  choice: enquanto estava montado no cavalo
  rationale: No contexto equestre, καθήμενον ἐπὶ indica estar sentado ou montado sobre o cavalo. A formulação natural evita acrescentar a posse 'seu', ausente do grego.
- source_word: ἀνεῖλον
  choice: matei-o
  rationale: O aoristo de ἀναιρέω significa aqui matar ou eliminar; 'matei-o' comunica diretamente a ação e explicita em português o objeto já topicalizado.
- source_word: διεσκόρπισα
  choice: dispersei
  rationale: Equivalente direto do aoristo de διασκορπίζω, preservando a ação militar de fazer o povo debandar.
