base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/006.yaml
  text: But I wrapped my garment around my arm and slung four stones at them; from behind and in front around the waist of one seated on a horse, I picked up a stone of sixty litras and hurled it, struck the horse, and killed it. And I fought King Nahor for about two hours, and after smashing the shield into pieces, I cut off his feet, and so I killed him.
translation:
  language: pt
  text: Mas eu enrolei minha veste no braço e, atirando pedras contra eles com uma funda, matei quatro deles; os restantes fugiram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνελύθην ... τὴν στολήν μου ἐπὶ τὴν χεῖρά μου
  choice: enrolei minha veste no braço
  rationale: Expressa em português natural o gesto de envolver a veste na mão ou no braço, provavelmente como proteção durante o combate.
- source_word: σφενδονήσας αὐτοὺς λίθοις
  choice: atirando pedras contra eles com uma funda
  rationale: O verbo indica lançar com funda; a formulação explicita o instrumento já contido no verbo grego sem acrescentar conteúdo narrativo.
- source_word: τέσσαρας ἐξ αὐτῶν ἀνεῖλον
  choice: matei quatro deles
  rationale: O acusativo masculino τέσσαρας refere-se a quatro dentre os adversários, não a quatro pedras, pois λίθοις está no dativo plural.
- source_word: οἱ δὲ λοιποὶ ἔφυγον
  choice: os restantes fugiram
  rationale: Tradução direta e natural, preservando o contraste entre os quatro mortos e os demais.
