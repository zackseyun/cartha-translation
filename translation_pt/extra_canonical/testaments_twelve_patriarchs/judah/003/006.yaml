  text: '*Ἐνελύθην³⁶ δὲ ἐγὼ³⁷ τὴν στολήν μου *ἐπὶ τὴν χεῖρά μου³⁸ καὶ³⁹ σφενδονήσας αὐτοὺς λίθοις⁴⁰ τέσσαρας ἐξ αὐτῶν *ἀνεῖλον⁴¹, *οἱ δὲ λοιποὶ⁴² ἔφυγον.'
