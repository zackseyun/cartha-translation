  text: And after fighting with Achor for two hours, I killed him; and splitting his shield into two pieces, I chopped off his feet.
translation:
  language: pt
  text: E, depois de lutar contra Acor por duas horas, eu o matei; então, partindo o escudo dele em dois, decepei-lhe os pés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀχὼρ
  choice: Acor
  rationale: Transliteração portuguesa natural do nome próprio grego, em consonância com a forma bíblica tradicional.
- source_word: ἐπὶ ὥρας δύο
  choice: por duas horas
  rationale: Expressa de modo direto e idiomático a duração do combate.
- source_word: εἰς δύο μέρη ποιήσας τὴν ἀσπίδα αὐτοῦ
  choice: partindo o escudo dele em dois
  rationale: Preserva a construção participial e o sentido concreto de dividir o escudo em duas partes, sem rigidez desnecessária.
- source_word: συνέκοψα τοὺς πόδας αὐτοῦ
  choice: decepei-lhe os pés
  rationale: Συγκόπτω indica cortar ou golpear violentamente; no contexto, 'decepei' comunica com concisão o corte completo indicado pelo objeto corporal, evitando a formulação menos natural 'cortei fora'.
