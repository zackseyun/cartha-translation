  text: Καὶ ὅτε³³ ἠπείλησα αὐτῷ³⁴, συνῆλθε μὲν³⁵ αὐτῇ, *διέφθειρε δὲ τὸ σπέρμα³⁶ ἐπὶ³⁷ τῆν γῆν³⁸, κατὰ τὴν ἐντολὴν τῆς μητρὸς αὐτοῦ³⁹. καίγε οὗτος⁴⁰ ἀπέθανεν⁴¹ ἐν πονηρίᾳ⁴². 6. Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ⁴³, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ⁴⁴ οὐκ ἀφῆκεν⁴⁵. Ἐπονηρεύσατο γὰρ⁴⁶, ὅτι⁴⁷ οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/005.yaml
  text: And when I threatened him, he went in to her, but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because she was not from the daughters of Canaan, as she herself was.
translation:
  language: pt
  text: E, quando o ameacei, ele se uniu a ela, mas desperdiçou o sêmen no chão, conforme a ordem de sua mãe. Assim, ele também morreu em sua perversidade. Eu queria dar-lhe também Selá, mas a mãe dele não permitiu, pois agiu perversamente porque ela não era uma das filhas de Canaã, como ela própria era.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆλθε ... αὐτῇ
  choice: se uniu a ela
  rationale: Expressa de modo digno e compreensível a relação sexual indicada pelo grego, sem acrescentar explicitação além do contexto.
- source_word: διέφθειρε ... τὸ σπέρμα ἐπὶ τῆν γῆν
  choice: derramou o sêmen no chão
  rationale: O verbo pode significar destruir, arruinar ou desperdiçar; no contexto, a formulação concreta comunica claramente a emissão deliberada no chão.
- source_word: ἐν πονηρίᾳ
  choice: em sua perversidade
  rationale: Preserva a avaliação moral do substantivo grego e soa natural em português.
- source_word: Σηλὼμ
  choice: Selá
  rationale: Emprega a forma bíblica portuguesa amplamente reconhecida para o nome.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: uma das filhas de Canaã
  rationale: Mantém o idiomatismo genealógico do texto, entendido como pertencimento às mulheres cananeias.
theological_decisions:
- issue: Causa atribuída à morte do filho
  choice: Assim, ele também morreu em sua perversidade
  alternative: Por isso, ele também morreu por causa de sua perversidade
  rationale: O grego afirma que morreu 'em perversidade', mas não explicita de forma inequívoca uma relação causal; a tradução evita acrescentá-la.
- issue: Referentes femininos na frase final
  choice: porque ela não era uma das filhas de Canaã, como ela própria era
  alternative: porque Tamar não era cananeia, ao contrário da mãe dele
  rationale: Mantém a ambiguidade formal dos pronomes femininos do grego em vez de identificar explicitamente os referentes, embora o contexto sugira Tamar e a mãe de Selá.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com redação próxima da estrutura grega. A frase final preserva deliberadamente a ambiguidade pronominal presente na fonte.
