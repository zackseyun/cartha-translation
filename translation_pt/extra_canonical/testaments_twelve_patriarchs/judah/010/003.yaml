  text: And he did not know her, by the scheming of his mother, for he did not want to have children by her.
translation:
  language: pt
  text: E ele não teve relações com ela, por artimanha da mãe dele, pois não queria ter filhos dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνω αὐτήν
  choice: não teve relações com ela
  rationale: O verbo «conhecer» funciona aqui como eufemismo sexual. A formulação explícita comunica esse sentido com naturalidade no português atual, sem alterar o conteúdo.
- source_word: κατὰ πανουργίαν
  choice: por causa da artimanha
  rationale: Expressa a ideia de astúcia ou manobra ardilosa e mantém a relação causal sugerida pelo contexto.
- source_word: τέκνα ἐξ αὐτῆς
  choice: filhos com ela
  rationale: É a maneira mais natural em português de dizer que ele não queria gerar descendência por meio dela.
