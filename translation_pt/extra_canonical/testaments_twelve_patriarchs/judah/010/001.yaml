  text: After these things, Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram.
translation:
  language: pt
  text: Depois dessas coisas, meu filho Er tomou Tamar para si como esposa, da Mesopotâmia, filha de Arã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγεται
  choice: tomou
  rationale: O presente histórico grego, em voz média, descreve Er tomando Tamar para si; o pretérito é a forma narrativa natural em português.
- source_word: ἑαυτῷ εἰς γυναῖκα
  choice: para si como esposa
  rationale: Preserva tanto a ideia reflexiva de benefício ou posse quanto a função matrimonial indicada pela expressão grega.
- source_word: ἐκ Μεσοποταμίας
  choice: da Mesopotâmia
  rationale: Reproduz de modo conciso a procedência expressa por ἐκ.
- source_word: θυγατέρα Ἀράμ
  choice: filha de Arã
  rationale: Traduz literalmente a relação filial, sem reinterpretar Arã como simples designação geográfica.
