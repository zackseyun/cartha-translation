base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/004.yaml
  text: During the days of the bridal chamber I gave her to Onan in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year.
translation:
  language: pt
  text: Durante os dias das núpcias, dei-lhe Onã em casamento de levirato; contudo, ele também, em sua maldade, não a conheceu, embora tivesse passado um ano com ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεγυμβρευσα αὐτῇ τὸν Αὐνάν
  choice: dei-lhe Onã em casamento de levirato
  rationale: Mantém a orientação sintática do grego, com αὐτῇ no dativo e Αὐνάν no acusativo, e explicita o sentido técnico do verbo ligado ao casamento de levirato.
- source_word: οὐκ ἔγνω αὐτήν
  choice: não a conheceu
  rationale: Conserva o eufemismo sexual do grego e sua formulação bíblica, sem substituir a expressão por uma interpretação mais explícita.
- source_word: ποιήσας σὺν αὐτῇ ἐνιαυτόν
  choice: embora tivesse passado um ano com ela
  rationale: Expressa naturalmente o sentido de passar um período com alguém e torna clara a força concessiva do particípio no contexto.
- source_word: ἐν πονηρίᾳ
  choice: por maldade
  rationale: Comunica a motivação moral indicada pela construção grega de modo natural em português.
theological_decisions:
- issue: A afirmação de que Onã «não a conheceu» pode parecer tensionar o relato de Gênesis 38.
  choice: não a conheceu
  alternative: não teve relações sexuais com ela
  rationale: A tradução preserva o eufemismo e a tensão presentes no texto grego, sem harmonizá-lo silenciosamente com outra passagem nem definir de modo mais estreito o sentido pretendido.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. «Câmara nupcial» conserva a imagem histórica do texto; «casamento de levirato» oferece precisão cultural e jurídica sem recorrer a uma formulação denominacional.
