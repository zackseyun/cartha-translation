  text: After these things[a], Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram. But Er was wicked, and an angel of the Lord killed him. And I gave her to Onan, my second son, and behold, the Lord struck him down also. For he did not know her, through the scheming of his mother, because he did not want to have children by her. During the days of the bridal chamber I gave Onan to her in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year. And when I threatened him, he went in to her[b], but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because Tamar was not from the daughters of Canaan[d][c], as she herself was.
translation:
  language: pt
  text: 10. Depois dessas coisas[a], meu filho Er tomou para si Tamar como esposa, da Mesopotâmia, filha de Arã. 2 Er, porém, era perverso, e um anjo do Senhor o matou. 3 Ele não a conheceu[b], por causa das maquinações de sua mãe, pois não queria ter filhos com ela. 4 Durante os dias da câmara nupcial, dei Onã a ela em casamento levirato[c]. Mas também este, em sua perversidade, não a conheceu, embora tenha passado um ano com ela. 5 Quando o ameacei, ele se uniu a ela, mas desperdiçou a semente no chão, conforme a ordem de sua mãe. Assim, também ele morreu em sua perversidade. 6 Eu queria dar-lhe também Selom, mas a mãe dele não permitiu. Pois ela agiu perversamente, porque Tamar não era das filhas de Canaã, como ela própria era.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns testemunhos gregos variam em pequenos detalhes de sequência e tempo. Há também uma forma textual que, antes da explicação sobre não conhecer Tamar, diz que Judá a deu a Onã, seu segundo filho, e que o Senhor também o feriu.
    reason: textual_variant
  - marker: b
    text: Neste contexto, «conhecer» é um eufemismo bíblico para ter relações sexuais.
    reason: lexical_alternative
  - marker: c
    text: O casamento levirato era o costume pelo qual o irmão de um homem falecido devia gerar descendência para ele por meio da viúva; compare Gênesis 38.
    reason: cultural_note
  - marker: d
    text: A repetição dos termos «perverso», «perversidade» e «perversamente» relaciona as ações de Er, Onã e da mãe deles em um mesmo padrão moral.
    reason: literary_note
lexical_decisions:
- source_word: πονηρός / ἐν πονηρίᾳ / ἐπονηρεύσατο
  choice: perverso / em sua perversidade / agiu perversamente
  rationale: Mantém uma raiz vocabular comum ao longo do capítulo e comunica com força natural o padrão moral que une Er, Onã e a mãe deles.
- source_word: ἄγγελος Κυρίου
  choice: um anjo do Senhor
  rationale: A construção grega sem artigo não exige a identificação com uma figura específica; o indefinido preserva a cautela textual.
- source_word: ἔγνω / οὐκ ἔγνω αὐτήν
  choice: conheceu / não a conheceu
  rationale: Preserva o eufemismo bíblico e o registro elevado; uma nota esclarece o sentido sexual.
- source_word: πανουργία
  choice: maquinações
  rationale: Expressa planejamento manipulador e deliberado sem recorrer a linguagem arcaica.
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: ter filhos com ela
  rationale: Formulação portuguesa natural que conserva o foco reprodutivo e genealógico.
- source_word: ἐπεγυμβρευσα αὐτῇ
  choice: dei-lhe ... em casamento levirato
  rationale: Torna explícito o sentido cultural específico do verbo, ligado ao dever do irmão do falecido.
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: durante os dias da câmara nupcial
  rationale: Conserva a imagem concreta do grego e indica claramente o contexto matrimonial.
- source_word: ποιήσας σὺν αὐτῇ ἐνιαυτόν
  choice: embora tenha passado um ano com ela
  rationale: Reflete a expressão grega sem especificar mais do que o texto sobre a natureza da convivência.
- source_word: συνῆλθε μὲν αὐτῇ
  choice: ele se uniu a ela
  rationale: Mantém um eufemismo digno e inteligível para a união sexual.
- source_word: διέφθειρε τὸ σπέρμα ἐπὶ τὴν γῆν
  choice: desperdiçou a semente no chão
  rationale: Preserva a imagem concreta e a alusão à tradição de Gênesis sem explicitação clínica.
- source_word: οὐκ ἀφῆκεν
  choice: não permitiu
  rationale: Expressa de modo direto a oposição da mãe à intenção de Judá.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: das filhas de Canaã
  rationale: Conserva a formulação étnico-familiar e sua ressonância bíblica.
- source_word: Σηλὼμ
  choice: Selom
  rationale: Translitera a forma grega apresentada neste testemunho, sem substituí-la silenciosamente pela forma do texto hebraico de Gênesis.
theological_decisions:
- issue: Agência na morte de Er e tradição variante sobre Onã
  choice: Afirmar, conforme a coluna grega primária, que um anjo do Senhor matou Er; não inserir no corpo do texto uma declaração ausente de que o Senhor feriu Onã.
  alternative: Harmonizar as mortes como atos diretos do Senhor ou acrescentar a leitura variante sobre Onã ao texto principal.
  rationale: A tradução segue primeiro o testemunho grego fornecido e não funde leituras distintas; a variante é registrada em nota.
- issue: Identidade do sujeito em 10.3
  choice: 'Entender αὐτός como retomada de Er: ele não conheceu Tamar por causa das maquinações de sua mãe.'
  alternative: Associar a frase a Onã ou reorganizar a sequência segundo outros testemunhos.
  rationale: Na coluna primária, o pronome segue imediatamente a morte de Er, antes da introdução de Onã no versículo 4; mantém-se essa sequência, embora a tradição textual apresente variações.
- issue: Terminologia do casamento levirato
  choice: Explicitar «casamento levirato» no texto e explicar o costume em nota.
  alternative: Usar apenas «casamento» e deixar implícito o dever familiar.
  rationale: O verbo grego possui sentido cultural específico essencial à narrativa de Tamar; a explicitação favorece a compreensão sem resolver questão doutrinária.
- issue: Causalidade moral das mortes
  choice: Preservar a repetição de «perverso/perversidade/perversamente» sem formular uma teoria adicional da retribuição.
  alternative: Variar os termos ou declarar explicitamente que cada morte foi castigo divino direto.
  rationale: A repetição grega estabelece uma associação moral forte, mas o texto primário não descreve da mesma forma a agência de cada morte.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Preservaram-se eufemismos bíblicos quando claros ou acompanhados de nota, bem como a imagem nupcial do grego. A sequência e o conteúdo seguem a coluna α fornecida, em vez de importar para o corpo do texto material presente apenas na camada inglesa ou em outros testemunhos.
