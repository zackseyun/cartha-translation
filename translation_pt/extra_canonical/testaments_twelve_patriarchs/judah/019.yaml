  text: My children[b][a], the love of money leads to idolatry.
translation:
  language: pt
  text: '19 ¹Meus filhos, o amor ao dinheiro leva à idolatria[a], pois, enganados pelo dinheiro, chamam deuses aos que não são deuses; e esse amor faz quem o abriga perder o juízo[b]. ²Por causa do dinheiro, meus filhos, eu perdi meus filhos. E, se o meu arrependimento, a minha humildade e as orações de meu pai não tivessem vindo em meu auxílio, eu teria morrido sem filhos. ³Mas o Deus de meus pais teve misericórdia de mim, porque fiz isso na ignorância. ⁴Pois o governante do engano me cegou, e, como homem e como carne corrompida pelos pecados, agi na ignorância; e reconheci a minha própria fraqueza, pensando ser invencível.


    [a] O grego apresenta uma construção elíptica, literalmente: “o amor ao dinheiro em direção à idolatria”. Também pode ser entendido como “tende à idolatria”.


    [b] Literalmente, “cair em êxtase”, aqui no sentido de ficar fora de si ou perder o juízo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego apresenta uma construção elíptica, literalmente: “o amor ao dinheiro em direção à idolatria”. Também pode ser entendido como “tende à idolatria”.'
    reason: textual_variant
  - marker: b
    text: Literalmente, “cair em êxtase”, aqui no sentido de ficar fora de si ou perder o juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνα μου
  choice: Meus filhos
  rationale: Conserva a forma direta e familiar de tratamento do patriarca sem restringir o referente a filhos do sexo masculino.
- source_word: φιλαργυρία
  choice: o amor ao dinheiro
  rationale: Expressa especificamente o amor à prata ou ao dinheiro, em vez da noção mais ampla de ganância.
- source_word: πρὸς εἰδωλολατρίαν
  choice: leva à idolatria
  rationale: A construção grega é elíptica; “leva à” comunica de modo natural a direção moral indicada por πρός, sem equiparar explicitamente o amor ao dinheiro à idolatria.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: enganados pelo dinheiro
  rationale: Transmite a ideia de engano ou extravio ligado ao dinheiro em português corrente, preservando a relação causal ou instrumental sem torná-la excessivamente técnica.
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: perder o juízo
  rationale: O sentido contextual é cair num estado de desorientação ou ficar fora de si, não uma experiência mística positiva; a nota preserva a forma literal.
- source_word: ἄτεκνος
  choice: sem filhos
  rationale: Reproduz diretamente a condição expressa pelo adjetivo grego e mantém o vínculo verbal com a perda dos filhos na frase anterior.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: o governante do engano
  rationale: Mantém o título e a personificação do agente sem identificar além do que o texto afirma.
- source_word: ἀκαταμάχητος
  choice: invencível
  rationale: Expressa de maneira natural a ideia de alguém que não pode ser vencido ou resistido.
theological_decisions:
- issue: Relação elíptica entre o amor ao dinheiro e a idolatria
  choice: “o amor ao dinheiro leva à idolatria”
  alternative: “o amor ao dinheiro tende à idolatria” ou “o amor ao dinheiro é idolatria”
  rationale: πρός indica normalmente direção. A tradução explicita a força moral subentendida, mas não adota a identificação mais forte, que excederia a formulação grega preservada.
- issue: Identidade do “governante do engano”
  choice: Manter o título sem identificar o personagem
  alternative: Traduzir ou explicar como “o Diabo” ou “Satanás”
  rationale: O texto personifica o agente, mas não o nomeia. A tradução evita introduzir uma identificação teológica que, embora possível, não está explícita.
- issue: Tensão entre ignorância, fragilidade humana e responsabilidade
  choice: Preservar as afirmações de que Judá agiu na ignorância, foi cegado e reconheceu a própria fraqueza
  alternative: Reformular para diminuir sua responsabilidade ou explicar a ignorância como inocência
  rationale: O trecho mantém juntas misericórdia, engano, corrupção pelo pecado e arrependimento. A tradução não resolve essa tensão nem transforma ignorância em ausência de culpa.
- issue: Mudança entre “não compreendi” e “reconheci”
  choice: Manter a sequência contrastante e usar “Então” para indicar a passagem ao reconhecimento
  alternative: Harmonizar os verbos como uma única condição contínua
  rationale: O grego contrapõe ἠγνόησα e ἐπέγνων. A tradução conserva o movimento da falta de entendimento para o reconhecimento da fraqueza.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A numeração dos versículos foi preservada. Evitaram-se arcaísmos como “avareza” quando poderiam ampliar ou deslocar o sentido específico de φιλαργυρία, bem como explicações confessionais não expressas pelo texto.
