source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Πολλὴ⁴⁰ γὰρ⁴¹ τῷ πίνοντι οἶνον⁴², τέκνα μου⁴³, καὶ αὕτη ἐστὶν ἡ σύνεσις⁴⁴ τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ⁴⁵, πίνει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/006.yaml
  text: 'For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink.'
translation:
  language: pt
  text: 'Pois quem bebe vinho, meus filhos, precisa de muito discernimento; e este é o discernimento no beber vinho: enquanto ainda conservar o pudor, beba.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνεσις
  choice: discernimento
  rationale: Expressa a capacidade prática de julgar e agir com sensatez, adequada ao contexto de moderação no consumo de vinho.
- source_word: οἰνοποσίας
  choice: beber vinho
  rationale: Forma natural em português para a prática ou ato de consumir vinho, sem acrescentar a ideia específica de embriaguez.
- source_word: αἰδῶ
  choice: pudor
  rationale: Preserva o sentido de vergonha moral, recato ou autocontenção social; evita reduzir o termo a mero constrangimento.
- source_word: ἕως ὅτε ἔχει
  choice: enquanto ainda conservar
  rationale: Reproduz a condição temporal de que a pessoa continue possuindo pudor, em português claro e idiomático.
- source_word: πίνει
  choice: beba
  rationale: O presente indicativo grego pode funcionar aqui com força permissiva ou imperativa no enunciado proverbial; o subjuntivo exortativo em português preserva essa orientação.
theological_decisions:
- issue: Permissão condicionada para beber vinho
  choice: “enquanto ainda conservar o pudor, beba”
  alternative: “enquanto ainda tiver vergonha, ele bebe”
  rationale: O contexto apresenta uma máxima normativa sobre o consumo de vinho. A tradução mantém a permissão condicionada sem transformar o texto em proibição absoluta nem em aprovação irrestrita.
translation_notes:
  register: Português moderno, digno e acessível, com formulação proverbial. “Pudor” mantém a tensão moral do grego αἰδώς, embora seja ligeiramente mais formal que “vergonha”.
