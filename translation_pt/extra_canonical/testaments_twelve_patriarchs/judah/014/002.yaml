base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/002.yaml
  text: For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.
translation:
  language: pt
  text: Pois, se alguém beber vinho até se embriagar, perturba a sua mente com pensamentos impuros, inflama o seu corpo para a imoralidade sexual em busca de prazer, pratica o pecado e não se envergonha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς μέθην
  choice: até se embriagar
  rationale: Expressa naturalmente em português o resultado visado ou alcançado pelo consumo de vinho, sem sugerir que todo uso de vinho seja condenado.
- source_word: διαλογισμοῖς ῥυπαροῖς
  choice: com pensamentos impuros
  rationale: “Pensamentos” comunica com clareza διαλογισμοί neste contexto moral; “impuros” preserva a força ética de ῥυπαροῖς sem recorrer a linguagem excessivamente coloquial.
- source_word: συνταράσσει
  choice: perturba
  rationale: Conserva a ideia de agitação e desordem interior de modo natural e digno.
- source_word: εἰς πορνείαν
  choice: para o prazer da imoralidade sexual
  rationale: πορνεία tem sentido amplo de conduta sexual ilícita; “imoralidade sexual” evita restringi-la indevidamente a prostituição ou adultério.
- source_word: ἐκθερμαίνει
  choice: inflama
  rationale: Mantém a metáfora de aquecer ou excitar intensamente o corpo.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: pratica o pecado
  rationale: Reproduz a passagem do impulso ao ato e mantém o singular genérico do grego.
theological_decisions:
- issue: Referente dos verbos no singular após a oração condicional
  choice: “ele” refere-se ao vinho, e o sujeito humano fica implícito em “pratica” e “não se envergonha”
  alternative: Entender todos os verbos como ações da pessoa que bebe
  rationale: O grego alterna de modo um tanto áspero entre τις, o possível agente inanimado sugerido pelo vinho, τὸ σῶμα e formas verbais sem sujeito expresso. A tradução preserva o vinho como agente retórico da perturbação e do estímulo, mas evita atribuir literalmente ao corpo a prática moral do pecado.
- issue: Natureza da condenação do vinho
  choice: A advertência recai sobre beber até a embriaguez
  alternative: Apresentar o vinho em si como pecaminoso
  rationale: εἰς μέθην delimita explicitamente a condição denunciada; não se deve importar uma posição abstencionista absoluta.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção mantém a progressão do texto: embriaguez, perturbação mental, excitação corporal, pecado e ausência de vergonha.'
