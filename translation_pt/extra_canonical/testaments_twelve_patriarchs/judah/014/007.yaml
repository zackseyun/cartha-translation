id: T12P.JUD.14.7
reference: Testament of Judah 14:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ⁴⁶ τὸν ὅρον, ἐμβάλλει⁴⁸ εἰς⁴⁹ τὸν νοῦν αὐτοῦ⁵⁰ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν⁵¹ καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι⁵³ τῇ ἀτιμίᾳ⁵⁴ καὶ νομίζειν εἶναι καλόν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/007.yaml
  text: But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and not feel shame, but rather boast in his dishonor and think it good.
translation:
  language: pt
  text: Mas, se ele ultrapassar o limite, o espírito do engano entra em sua mente e faz o bêbado falar coisas vergonhosas, agir contra a lei e não sentir vergonha; pelo contrário, faz com que se orgulhe de sua desonra e pense que isso é bom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: ultrapassar o limite
  rationale: Reproduz de modo natural a ideia de transgredir ou passar além de um limite estabelecido, sem acrescentar a noção de continuidade presente apenas na camada inglesa.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: o espírito do engano
  rationale: Mantém a construção genitiva e a possível personificação do agente espiritual; «engano» abrange desvio e ilusão sem resolver indevidamente a ambiguidade.
- source_word: αἰσχρορρημονεῖν
  choice: falar coisas vergonhosas
  rationale: Expressa em linguagem corrente o ato de proferir fala obscena, indecorosa ou desonrosa, preservando a amplitude do termo.
- source_word: παρανομεῖν
  choice: agir contra a lei
  rationale: Conserva o componente explícito de νόμος e pode abranger tanto transgressão legal quanto conduta ilícita.
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: orgulhe de sua desonra
  rationale: Transmite o contraste moral entre vanglória e desonra em português claro e digno.
- source_word: νομίζειν εἶναι καλόν
  choice: pense que isso é bom
  rationale: Mantém o juízo subjetivo indicado por νομίζειν e usa «isso» para retomar a conduta desonrosa.
theological_decisions:
- issue: Natureza de «espírito do engano»
  choice: Preservar «o espírito do engano» sem explicar se é um ser pessoal, uma influência ou uma disposição interior.
  alternative: Traduzir como «um espírito enganador» ou interpretar como mera inclinação mental.
  rationale: O grego permite uma leitura pessoal ou caracterizadora; a tradução não deve impor uma ontologia específica.
- issue: Entrada do espírito na mente
  choice: Traduzir literalmente a ação como «entra em sua mente».
  alternative: Parafrasear como «incute o engano em sua mente».
  rationale: A construção grega apresenta o espírito como sujeito da ação, e essa imagem deve ser preservada sem racionalização.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação segue diretamente o grego e evita importar a ampliação inglesa «goes on until». O ponto e vírgula torna clara a oposição introduzida por ἀλλά, sem alterar a sequência causal.
