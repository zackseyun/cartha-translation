  text: Such is the wine-drinker, my children, because the drunkard respects no one.
translation:
  language: pt
  text: Assim é o beberrão, meus filhos, pois quem está embriagado não respeita ninguém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάροινος
  choice: beberrão
  rationale: Designa alguém dado ao vinho ou inclinado à embriaguez; “beberrão” é natural, direto e preserva a caracterização habitual.
- source_word: ὁ μεθύων
  choice: quem está embriagado
  rationale: O particípio presente descreve a pessoa em estado de embriaguez; esta formulação também evita repetir “beberrão” e mantém a distinção lexical do grego.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: não respeita ninguém
  rationale: Expressa com clareza a ausência de consideração, respeito ou recato diante de qualquer pessoa.
