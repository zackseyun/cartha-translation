source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν²⁹ μὴ αἰσχυνθῆναι τὸ πλῆθος³⁰ πόλεως⁴⁹ ὅτι ἐν⁵¹ ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν³² μεγάλην³³, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/004.yaml
  text: For behold, it also led me astray, so that I was not ashamed before the multitude of the city. For in the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.
translation:
  language: pt
  text: Pois eis que isso também me desencaminhou, de modo que não me envergonhei diante da multidão da cidade. Pois, à vista de todos, inclinei-me para Tamar, cometi um grande pecado e descobri a cobertura da impureza dos meus filhos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega é incomum e literal: “descobri a cobertura da impureza dos meus filhos”. Aqui, “descobri” significa “desvelei” ou “expus”, não simplesmente “vim a saber”.'
    reason: Preserva a formulação paradoxal do original e esclarece o sentido de “descobri” em português sem interpretar a imagem.
lexical_decisions:
- source_word: Ἰδοὺ γὰρ
  choice: Pois vejam
  rationale: Conserva tanto a ligação explicativa de γάρ quanto a chamada enfática à atenção expressa por ἰδού, em português atual e digno.
- source_word: κἀμὲ ἐπλάνησεν
  choice: isso também me desencaminhou
  rationale: O verbo não traz sujeito expresso neste versículo; “isso” remete ao antecedente contextual sem introduzi-lo explicitamente, e “também” representa κἀμέ.
- source_word: μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως
  choice: de modo que não me envergonhei diante da multidão da cidade
  rationale: Expressa o resultado do desvio e entende o acusativo como a pessoa ou coletividade diante da qual Judá não sentiu vergonha, conforme a construção e a consulta inglesa.
- source_word: ἐν ὀφθαλμῶν πάντων
  choice: à vista de todos
  rationale: Equivalente idiomático natural para a expressão visual do grego, cujo sentido é ação pública.
- source_word: ἐξέκλινα πρὸς τὴν Θαμὰρ
  choice: desviei-me para Tamar
  rationale: Preserva a imagem moral e direcional de ἐκκλίνω com πρός, sem tornar explícita a natureza do ato além do que o texto afirma.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: removi a cobertura da impureza dos meus filhos
  rationale: Mantém a repetição etimológica entre o verbo de descobrir/remover e κάλυμμα, mas evita o falso sentido moderno de “descobri” como “vim a saber”.
theological_decisions:
- issue: Referente do sujeito implícito em ἐπλάνησεν
  choice: “isso”, sem identificar expressamente o agente
  alternative: “o vinho” ou outro antecedente nominal do contexto
  rationale: O versículo isolado não nomeia o sujeito; a tradução conserva essa dependência contextual em vez de inserir uma identificação interpretativa.
- issue: Sentido da frase sobre a cobertura e a impureza dos filhos
  choice: Manter a formulação metafórica e difícil no texto, com nota literal
  alternative: Explicá-la como exposição da vergonha, culpa ou nudez dos filhos
  rationale: A construção grega é incomum e teologicamente sugestiva, mas não define com precisão a relação entre cobertura, impureza e filhos; explicitá-la resolveria indevidamente a tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece solene sem arcaísmos. A abertura enfática, a sequência coordenada das ações e a estranheza deliberada da cláusula final foram preservadas.
