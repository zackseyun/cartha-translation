base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/005.yaml
  text: After drinking the wine, I was not ashamed of the command of God, and I took a Canaanite woman.
translation:
  language: pt
  text: Depois de beber o vinho, não me envergonhei do mandamento de Deus e tomei uma mulher cananeia por esposa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomei uma mulher cananeia”. No contexto, a expressão indica que ele a tomou como esposa.'
    reason: Registra a construção mais literal e a ambiguidade de γυνή, que pode significar ‘mulher’ ou ‘esposa’.
lexical_decisions:
- source_word: Πιὼν τὸν οἶνον
  choice: Depois de beber o vinho
  rationale: O particípio aoristo indica uma ação anterior à principal; o artigo de τὸν οἶνον é mantido naturalmente em português.
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: não me envergonhei do mandamento de Deus
  rationale: Mantém de perto a formulação incomum do grego, sem substituir a ideia por ‘desobedeci’ ou outra interpretação que eliminaria sua tensão.
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: tomei uma mulher cananeia por esposa
  rationale: No contexto matrimonial, λαμβάνω com γυνή pode significar tomar uma mulher como esposa; a formulação portuguesa torna esse sentido inteligível sem apagar o valor lexical de ‘mulher’.
theological_decisions:
- issue: Relação entre a embriaguez, o mandamento de Deus e o casamento com uma cananeia
  choice: Preservar literalmente ‘não me envergonhei do mandamento de Deus’
  alternative: Explicitar ‘não respeitei/desobedeci ao mandamento de Deus’
  rationale: O texto grego apresenta uma expressão semanticamente tensa. Explicá-la como desobediência poderia ser plausível no contexto, mas importaria uma interpretação não expressa diretamente.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. A expressão incomum sobre não se envergonhar do mandamento foi preservada para não resolver silenciosamente a tensão do original.
