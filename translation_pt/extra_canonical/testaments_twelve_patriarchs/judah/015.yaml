  naturalness: O português é claro, moderno e de registro apropriado. Pequenos ajustes tornam a relação participial em 15.2 mais direta e eliminam uma nota que sugere uma incerteza textual ou sintática maior do que a evidência fornecida sustenta.
  terminology: «Imoralidade sexual», «realeza», «cajado», «cinto», «diadema», «arrependido» e «sustento» são escolhas adequadas. «Tendo servido à imoralidade sexual» conserva de modo mais exato a metáfora de escravidão do particípio grego ativo.
