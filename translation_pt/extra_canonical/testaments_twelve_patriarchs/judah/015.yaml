  text: 1[a]. The man who commits sexual immorality, even while being ruined, does not perceive it; and while being dishonored, he is not ashamed. 2. For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered. 3[b]. I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom. 4. And although I repented concerning these things, I ate neither meat nor drank wine until my old age, and I saw no joy at all. 5. And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's very support.
translation:
  language: pt
  text: '**Testamento de Judá 15**


    1. Quem pratica imoralidade sexual não percebe que está sendo despojado[a] e não sente vergonha quando é desonrado. 2. Pois, ainda que alguém seja rei, se praticar imoralidade sexual, será despojado da realeza, tendo servido à imoralidade sexual como escravo, como também aconteceu comigo. 3. Entreguei meu cajado — isto é, o sustentáculo da minha tribo —, meu cinto — isto é, minha força — e meu diadema — isto é, a glória do meu reino. 4. E, tendo-me arrependido dessas coisas,[b] não consumi vinho nem carne até a minha velhice e não desfrutei alegria alguma. 5. O anjo de Deus me mostrou que as mulheres têm poder sobre o rei e dominam o pobre: do rei tiram a glória; do homem, a força; e do pobre, até o seu mínimo sustento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego pode significar literalmente «ser despido» ou, em sentido figurado, «ser despojado». A mesma imagem reaparece no versículo 2, aplicada à realeza.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «tendo mudado de ideia» ou «tendo mudado de atitude». Neste contexto, o termo grego também pode ter o sentido penitencial de «arrepender-se».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πορνεύσας / πορνεύῃ / πορνείᾳ
  choice: quem pratica imoralidade sexual / praticar imoralidade sexual / imoralidade sexual
  rationale: Mantém a força moral do campo lexical sem recorrer a termos arcaicos ou excessivamente estreitos como “fornicação”.
- source_word: γυμνούμενος / γυμνοῦται
  choice: sendo despojado / será despojado
  rationale: Preserva a imagem recorrente de ser despido ou privado de algo; no versículo 2, o complemento “da realeza” explicita a perda de condição régia.
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: depois de se tornar escravo da imoralidade sexual
  rationale: Conserva a metáfora forte de sujeição servil expressa pelo verbo grego.
- source_word: βασιλείας
  choice: realeza
  rationale: Neste contexto, indica a dignidade ou condição pessoal de rei, não primariamente o território governado.
- source_word: ῥάβδον
  choice: cajado
  rationale: A explicação imediata como “sustentáculo” favorece “cajado”, que preserva tanto o objeto literal quanto sua função simbólica.
- source_word: στήριγμα
  choice: sustentáculo / sustento
  rationale: “Sustentáculo” funciona na explicação simbólica da tribo; no versículo 5, “sustento” expressa com naturalidade aquilo de que o pobre depende.
- source_word: ζώνην
  choice: cinto
  rationale: Termo moderno e direto que permite à glosa simbólica “minha força” permanecer clara.
- source_word: διάδημα
  choice: diadema
  rationale: Preserva o termo especificamente régio e a distinção entre os três objetos entregues.
- source_word: μετανοήσας
  choice: tendo me arrependido
  rationale: 'O contexto é penitencial: Judá responde à sua falta com abstinência prolongada. A possível nuance mais geral de mudança de mente é registrada em nota.'
- source_word: εὐφροσύνην οὐκ εἶδον
  choice: não desfrutei alegria alguma
  rationale: Traduz idiomaticamente a expressão de não “ver” alegria, sem enfraquecer a renúncia descrita.
- source_word: κρατοῦσι / κατακυριεύουσιν
  choice: têm poder sobre / dominam
  rationale: Mantém os dois verbos de domínio e evita inserir “para sempre”, ideia ausente do texto grego fornecido.
- source_word: ἐλάχιστον στήριγμα
  choice: até o seu mínimo sustento
  rationale: Expressa a ideia de que se tira do pobre mesmo o escasso apoio que lhe resta.
theological_decisions:
- issue: Sentido de μετανοήσας na reação de Judá ao seu pecado
  choice: tendo me arrependido
  alternative: tendo mudado de ideia / tendo mudado de atitude
  rationale: A abstinência posterior e o tom confessional tornam o sentido penitencial mais provável, mas a amplitude lexical do particípio é preservada em nota.
- issue: Afirmação sobre o poder das mulheres no versículo 5
  choice: traduzir diretamente a generalização do antigo narrador
  alternative: atenuar a afirmação ou reformulá-la como referência exclusiva à imoralidade sexual
  rationale: O texto grego formula uma generalização sobre “as mulheres”. A tradução não a endossa nem a suaviza, mas a apresenta como fala do documento antigo.
- issue: Estrutura social do versículo 5
  choice: distinguir rei, homem e pobre na sequência final
  alternative: fundir “homem forte” como uma única expressão
  rationale: O grego fornecido traz τοῦ ἀνδρός e τὴν δύναμιν em aposição elíptica, favorecendo “do homem, a força”; não há adjetivo grego correspondente a “forte”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente regularizada onde o grego é elíptico, sem introduzir o “para sempre” da camada inglesa, ausente da fonte fornecida. Mantiveram-se a imagem de despojamento, a linguagem de escravidão e a generalização incômoda do narrador antigo, sem suavização doutrinária.
