base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/003.yaml
  text: And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering all that was theirs, we tore down their three walls.
translation:
  language: pt
  text: Já alta noite, porém, meus irmãos vieram até nós. Abrimos-lhes os portões, exterminamos todos eles e saqueamos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A fonte grega desta edição termina aqui, com “saqueamos”; ela não menciona neste versículo a derrubada de três muralhas.
    reason: Assinala de maneira transparente a diferença substancial entre o texto grego fornecido e a camada inglesa de consulta, sem incorporar material ausente da fonte primária.
lexical_decisions:
- source_word: Νυκτὸς δὲ βαθείας
  choice: No meio da noite, porém
  rationale: Expressa de modo natural a ideia de uma hora avançada e escura da noite, mantendo a função contrastiva de δέ.
- source_word: ἀνοίξαντες τὰς πύλας αὐτοῖς
  choice: Abrimos-lhes os portões
  rationale: Conserva o valor benefactivo de αὐτοῖς (‘para eles’) sem tornar a frase artificial em português.
- source_word: πάντας αὐτοὺς ἐξωλοθρεύσαμεν
  choice: exterminamos todos eles
  rationale: Reproduz a intensidade de ἐξολοθρεύω e mantém o pronome do grego, sem identificar explicitamente seu referente.
- source_word: ἐπρονομεύσαμεν
  choice: fizemos o saque
  rationale: O verbo indica saquear ou pilhar, mas não apresenta objeto expresso nesta forma do texto; a construção evita acrescentar ‘tudo o que era deles’ ou ‘a cidade’.
theological_decisions:
- issue: Referente de πάντας αὐτούς (‘todos eles’)
  choice: Manter o referente pronominal sem explicitação
  alternative: Identificar ‘eles’ como os habitantes ou inimigos
  rationale: A formulação grega usa apenas o pronome; explicitar o grupo resolveria uma referência que o versículo isolado não define formalmente.
- issue: Conteúdo adicional presente na camada inglesa
  choice: Não incluir a destruição de três muralhas nem objetos não expressos do saque
  alternative: Seguir a redação inglesa ampliada
  rationale: A fonte grega fornecida termina com ἐπρονομεύσαμεν e não contém menção a três muralhas nem uma expressão equivalente a ‘tudo o que era deles’.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação divide o longo período grego para facilitar a leitura. ‘Abrimos-lhes’ preserva concisão formal; ‘fizemos o saque’ evita fornecer ao último verbo um objeto que o grego não expressa.
