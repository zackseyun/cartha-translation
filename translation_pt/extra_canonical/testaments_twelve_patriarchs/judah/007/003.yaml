  source_fidelity: 'A tradução preserva corretamente a sequência e os referentes do grego: a chegada dos irmãos, a abertura dos portões para eles, o extermínio de todos eles e o saque. Também acerta ao não importar a menção inglesa de bens e de três muralhas, ausente do texto grego fornecido. Contudo, «No meio da noite» sugere especificamente o ponto médio da noite, enquanto νυκτὸς βαθείας denota noite avançada/profunda.'
  naturalness: A redação é clara e de registro apropriado. «Já alta noite» é uma expressão portuguesa mais idiomática e semanticamente mais precisa para a circunstância temporal. «Saqueamos» é natural sem objeto expresso e evita a perífrase algo menos direta «fizemos o saque».
