lexical_decisions:
- source_word: ἐπροσεγγίσαμεν
  choice: nos aproximamos
  rationale: Reproduz naturalmente o sentido aorístico de chegar perto ou aproximar-se.
- source_word: Θάμνῃ
  choice: Tamna
  rationale: Transliteração portuguesa clara do topônimo grego Θάμνα.
- source_word: πᾶσα ἡ ἀποσκευή
  choice: toda a bagagem
  rationale: ἀποσκευή designa bagagem, pertences ou equipamento transportado; “bagagem” preserva o sentido amplo e combina com o coletivo singular.
- source_word: τῶν πολεμίων βασιλέων
  choice: dos reis inimigos
  rationale: Mantém expressamente o genitivo do texto grego, ausente na camada inglesa abreviada, e entende πολεμίων como adjetivo de βασιλέων.
