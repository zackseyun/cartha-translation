  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/001.yaml
  text: And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.
translation:
  language: pt
  text: E no dia seguinte, fomos informados de que o rei da cidade de Gaás vinha contra nós com uma grande multidão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: no dia seguinte
  rationale: A expressão elíptica indica naturalmente o dia seguinte no contexto narrativo.
- source_word: ἐρρέθη πρὸς ἡμᾶς
  choice: fomos informados
  rationale: Traduz com naturalidade a construção passiva impessoal, preservando a ideia de que a notícia lhes foi comunicada.
- source_word: ἐν λαῷ πολλῷ
  choice: com uma grande multidão
  rationale: Neste contexto militar, λαός designa uma numerosa força ou massa de pessoas; “multidão” mantém a amplitude do grego sem especificar indevidamente “exército”.
- source_word: ἔρχεται πρὸς ἡμᾶς
  choice: vinha contra nós
  rationale: O presente histórico após a notícia é vertido pelo imperfeito em português, e πρός assume sentido hostil no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e leitura natural no Brasil. O topônimo Γαὰς foi transliterado como “Gaás”, com acento para indicar a separação vocálica e a tonicidade.
