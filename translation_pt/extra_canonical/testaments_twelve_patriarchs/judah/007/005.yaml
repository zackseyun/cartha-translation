  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/005.yaml
  text: Then, being insulted by them, I became angry, and I rushed against them up to the summit. And they kept pelting me with stones and shooting arrows at me.
translation:
  language: pt
  text: Então, insultado por eles, fiquei irado e avancei impetuosamente contra eles até o cume. Eles continuavam a atirar-me pedras com fundas e a disparar flechas contra mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβριζόμενος
  choice: insultado
  rationale: Expressa de modo natural o abuso ou ultraje sofrido por Judá, sem acrescentar detalhes ausentes do grego.
- source_word: ὠργίσθην
  choice: fiquei irado
  rationale: Reproduz diretamente a mudança de estado indicada pelo aoristo, em registro digno e corrente.
- source_word: ὥρμησα
  choice: avancei impetuosamente
  rationale: Preserva a ideia de movimento súbito e vigoroso contra os adversários, mais forte que um simples «avancei».
- source_word: ἐπὶ τὴν κορυφήν
  choice: até o cume
  rationale: Mantém o sentido espacial mais provável de movimento em direção ao ponto mais alto.
- source_word: ἐσφενδόνιζον με ἐν λίθοις
  choice: continuavam a me atacar com pedras de funda
  rationale: Torna explícito o uso da funda inerente ao verbo e preserva o aspecto durativo do imperfeito, evitando sugerir mero apedrejamento à mão.
- source_word: τοξεύοντες
  choice: a disparar flechas contra mim
  rationale: Traduz a ação de atirar com arco em português natural; «contra mim» explicita o alvo já indicado pelo contexto e pelo pronome da oração coordenada.
