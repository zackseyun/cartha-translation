base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016.yaml
  text: '1[a]. Guard yourselves, therefore, my children, against the limit of wine; for in it there are four evil spirits: desire, heated passion, dissipation, and shameful gain[b].


    2. If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness enters.


    3. But if you want to live with self-control, do not touch wine at all, lest you sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.


    4. Wine also reveals the mysteries of God and of men, just as I too revealed the commandments of God and the mysteries of Jacob my father to the Canaanite woman—things that God told me not to reveal.


    5[c]. And wine becomes the cause of war and turmoil.'
translation:
  language: pt
  text: '**Testamento de Judá 16**


    **1.** Portanto, meus filhos, guardem-se de ultrapassar o limite do vinho[a], pois nele há quatro espíritos malignos[b]: desejo, paixão ardente, dissipação e lucro vergonhoso.


    **2.** Se beberem vinho com alegria, façam-no com recato e temor de Deus.


    **3.** Mas, se quiserem viver com domínio próprio, não toquem em vinho de modo algum, para que não pequem com palavras insolentes, brigas, calúnias e transgressões dos mandamentos de Deus, e não pereçam antes da hora.


    **4.** O vinho também revela os mistérios de Deus e dos seres humanos. Assim também eu revelei à mulher cananeia os mandamentos de Deus e os mistérios de Jacó, meu pai[c] — coisas que Deus me havia dito para não revelar.


    [a] Ou: “guardem o limite do vinho”, “a medida do vinho” ou “a fronteira do vinho”. A expressão grega é incomum e adverte contra ultrapassar o limite próprio do vinho.


    [b] “Espíritos malignos” pode designar vícios personificados ou forças espirituais entendidas como mais do que simples metáforas; o grego não resolve essa ambiguidade.


    [c] Judá confessa ter revelado à mulher cananeia assuntos que, segundo ele, Deus lhe havia proibido revelar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “guardem o limite do vinho”, “a medida do vinho” ou “a fronteira do vinho”. A expressão grega é incomum e adverte contra ultrapassar o limite próprio do vinho.'
    reason: lexical_alternative
  - marker: b
