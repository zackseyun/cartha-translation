    reason: lexical_alternative
  - marker: c
    text: Judá confessa ter revelado à mulher cananeia assuntos que, segundo ele, Deus lhe havia proibido revelar.
    reason: cross_reference
lexical_decisions:
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: o limite do vinho
  rationale: ὅρος pode significar limite, fronteira ou marco. A formulação preserva a metáfora concreta, enquanto “ultrapassar” explicita no corpo do texto a advertência implicada pela expressão grega incomum; as alternativas mais formais são registradas em nota.
- source_word: πνεύματα πονηρά
  choice: espíritos malignos
  rationale: Mantém a linguagem espiritual explícita do grego sem reduzi-la a impulsos psicológicos; a enumeração mostra sua expressão moral.
- source_word: ἐπιθυμίας
  choice: desejo
  rationale: O termo é amplo; “desejo” evita restringi-lo indevidamente à luxúria sexual.
- source_word: πυρώσεως
  choice: paixão ardente
  rationale: Preserva a imagem de queima ou inflamação e se encaixa naturalmente no catálogo de vícios.
- source_word: ἀσωτίας
  choice: dissipação
  rationale: Comunica conduta desenfreada e perdulária sem limitar o sentido à devassidão sexual.
- source_word: αἰσχροκερδίας
  choice: lucro vergonhoso
  rationale: Reproduz os elementos do composto grego, que associa ganho ou lucro àquilo que é vil ou vergonhoso.
- source_word: αἰδούμενος μετὰ φόβου Θεοῦ
  choice: com recato e temor de Deus
  rationale: “Recato” expressa contenção marcada por vergonha moral ou modéstia; a construção portuguesa torna natural a formulação grega sintaticamente difícil.
- source_word: σωφρόνως
  choice: com domínio próprio
  rationale: Destaca a vida disciplinada e autocontrolada, em vez de reduzir o termo apenas à sobriedade alcoólica.
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: não toquem em vinho de modo algum
  rationale: Preserva a força absoluta e a imagem vívida do grego.
- source_word: λόγοις ὕβρεως
  choice: palavras insolentes
  rationale: Expressa fala arrogante, ultrajante ou abusiva em registro digno e corrente.
- source_word: συκοφαντίαις
  choice: calúnias
  rationale: É conciso e adequado ao catálogo, embora o termo também possa abranger acusações falsas ou maliciosas.
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: antes da hora
  rationale: Equivalente idiomático português para perecer fora do tempo devido, sem especificar a causa da morte.
- source_word: μυστήρια
  choice: mistérios
  rationale: Mantém o sentido de assuntos secretos ou ocultos e sua possível densidade religiosa.
theological_decisions:
- issue: Se πνεύματα πονηρά deve ser reinterpretado como simples impulsos psicológicos
  choice: Manter “espíritos malignos” e explicar a ambiguidade em nota.
  alternative: “impulsos malignos” ou “tendências perversas”
  rationale: O testemunho grego usa linguagem de espíritos de modo explícito. A tradução não deve eliminar a possível dimensão espiritual nem impor que ela seja necessariamente literal.
- issue: Força da proibição do vinho no versículo 3
  choice: 'Traduzir como abstinência total: “não toquem em vinho de modo algum”.'
  alternative: “não bebam vinho em excesso”
  rationale: μηδ᾽ ὅλως ... ἐφάπτεσθε é mais forte que uma mera advertência contra excesso, ainda que a exortação possa ter força retórica.
- issue: Material presente na camada inglesa, mas ausente do texto grego fornecido
  choice: Omitir a segunda metade do versículo 2 e todo o versículo 5 da tradução.
  alternative: Incluir “se o temor de Deus se afasta...” e “o vinho torna-se causa de guerra e tumulto” com base na camada inglesa.
  rationale: Essas frases não constam da evidência grega especificada para esta tarefa. A tradução segue primeiro a fonte original fornecida e não incorpora material sem apoio nela.
- issue: Sentido de μυστήρια Θεοῦ καὶ ἀνθρώπων
  choice: Preservar “mistérios de Deus e dos seres humanos”.
  alternative: “segredos divinos e humanos”
  rationale: “Mistérios” conserva a amplitude e a possível tensão teológica da expressão, sem decidir se se trata apenas de informações confidenciais ou de realidades sagradas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Empregou-se “vocês” nas formas verbais sem pronome explícito, evitando arcaísmos. A sintaxe foi moderadamente ajustada onde o grego é incomum, mas ambiguidades lexicais e teológicas relevantes foram mantidas no texto ou registradas em notas. O rascunho contém apenas os quatro versículos sustentados pela fonte grega fornecida.
