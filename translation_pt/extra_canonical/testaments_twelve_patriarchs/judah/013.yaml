revisions:
- from: '**Testamento de Judá 13**


    **1** E agora eu lhes ordeno, meus filhos: escutem Judá, seu pai,[a] guardem as minhas palavras, cumpram todas as justas determinações do Senhor e obedeçam aos mandamentos de Deus.


    **2** Não sigam os seus desejos nem andem na arrogância do coração. Não se vangloriem das obras nem da força da juventude de vocês, pois isso também é mau diante do Senhor.


    **3** Pois eu também, quando me vangloriava nas guerras, fui enganado pelo rosto de uma bela mulher;[b] além disso, eu censurava meu irmão Rúben por causa de Bila, mulher de meu pai. Então o espírito do ciúme e da imoralidade sexual se pôs em ordem de batalha contra mim, até que pequei com a mulher cananeia[c] e com Tamar, minha nora.


    **4** Eu disse ao meu sogro: “Consultarei meu pai e depois tomarei sua filha por esposa”. Ele, porém, não quis; em vez disso, exigiu de mim, para concedê-la, uma quantidade incalculável de ouro,[d] pois era rei.


    **5** Ele a enfeitou com ouro e pérolas e, no banquete, fez com que ela nos servisse vinho, exibindo toda a sua beleza de mulher.


    **6** O vinho transtornou meus olhos, e o prazer obscureceu meu coração.


    **7** Apaixonei-me por ela, tive relações com ela e transgredi o mandamento do Senhor e o mandamento de meu pai; então a tomei por esposa.


    **8** E o Senhor me retribuiu conforme a inclinação de minha alma, pois não tive alegria nos filhos que ela me deu.


    **Notas**


    [a] A construção grega da abertura é difícil; o sentido geral é uma exortação para que os filhos escutem Judá como pai e guardem suas palavras.


    [b] O texto grego desta oração parece estar corrompido ou incompleto. A tradução segue a leitura transmitida — segundo a qual Judá, apesar de sua vanglória guerreira, foi enganado pela beleza de uma mulher — sem inserir a negação encontrada em algumas reconstruções.


    [c] O grego diz apenas “a mulher cananeia”, sem apresentar aqui um nome próprio. A passagem parece aludir às tradições sobre o casamento de Judá com uma cananeia em Gênesis 38.


    [d] A expressão grega é difícil. Também pode significar que ele “mostrou” a Judá uma quantidade incalculável de ouro relacionada à entrega da filha; o contexto favorece a ideia de uma exigência feita para concedê-la em casamento.'
