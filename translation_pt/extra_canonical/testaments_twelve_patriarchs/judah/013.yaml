lexical_decisions:
- source_word: ἐντέλλομαι
  choice: eu lhes ordeno
  rationale: Preserva a força da ordem paterna e testamentária, em português atual.
- source_word: δικαιώματα
  choice: justas determinações
  rationale: Mantém tanto o caráter normativo quanto a conotação de justiça, distinguindo o termo de ἐντολαί.
- source_word: ἐντολαῖς
  choice: mandamentos
  rationale: Expressa com clareza a autoridade das ordens divinas e conserva a distinção lexical em relação a δικαιώματα.
- source_word: ἐπιθυμιῶν
  choice: desejos
  rationale: O termo pode abranger desejos ou cobiças; a opção mais ampla preserva essa extensão sem limitar o sentido ao campo sexual.
- source_word: παρετάξατο
  choice: se pôs em ordem de batalha contra mim
  rationale: Conserva a metáfora militar do verbo, especialmente apropriada ao discurso do guerreiro Judá.
- source_word: τὴν Χανανανίτην
  choice: a mulher cananeia
  rationale: Traduz diretamente o texto grego fornecido, que traz um gentílico substantivado e não o nome próprio “Anan”.
- source_word: συνετέλεσα εἰς
  choice: pequei com
  rationale: A expressão é incomum e eufemística; a formulação comunica o sentido sexual e penitencial sem alegar precisão que o grego não oferece.
- source_word: ἔδειξέ μοι εἰς δόσιν αὐτῆς
  choice: exigiu de mim, para concedê-la
  rationale: Interpreta a frase difícil no contexto de uma negociação matrimonial, registrando em nota a alternativa mais literal “mostrou-me”.
- source_word: διέστρεψέν μου τοὺς ὀφθαλμούς
  choice: transtornou meus olhos
  rationale: Retém a imagem de percepção distorcida pelo vinho, com expressão inteligível em português.
- source_word: τὸ διαβούλιον τῆς ψυχῆς μου
  choice: a inclinação de minha alma
  rationale: Comunica o desígnio ou disposição interior sem reduzir a frase a uma decisão pontual.
theological_decisions:
- issue: Linguagem do vício personificado
  choice: “o espírito do ciúme e da imoralidade sexual se pôs em ordem de batalha contra mim”
  alternative: “o ciúme e a cobiça sexual tomaram conta de mim”
  rationale: A tradução mantém tanto o “espírito” quanto a metáfora militar, sem decidir se a expressão designa um ser pessoal ou uma força moral personificada.
- issue: Relação entre retribuição divina e desejo humano
  choice: “o Senhor me retribuiu conforme a inclinação de minha alma”
  alternative: “o Senhor me castigou por causa do plano de minha alma”
  rationale: A formulação preserva a correspondência expressa por κατὰ sem transformar explicitamente a retribuição em punição, embora o contexto seja negativo.
- issue: Explícitação moral de συνετέλεσα
  choice: “pequei com”
  alternative: “consumei o ato com”
  rationale: O contexto é confessional e moral. A opção torna essa força clara, mas evita especificar detalhes além do que a construção difícil permite.
- issue: Negação ausente na oração do versículo 3
  choice: Traduzir o texto transmitido em sentido afirmativo, com nota sobre a dificuldade
  alternative: Inserir “não” e traduzir “nenhuma bela mulher me havia enganado”
  rationale: O grego fornecido não contém partícula negativa. Inserir uma negação resolveria a incoerência mediante conjectura; a tradução prefere sinalizar a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. Empregou-se “vocês” na exortação para evitar formas regionais ou arcaizantes, mantendo paralelismo e cadência solene. A tradução inclui os oito versículos presentes no texto grego, mesmo onde a camada inglesa de consulta estava truncada.
