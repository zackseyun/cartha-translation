  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013.yaml
  text: 'And now I command you[a], my children: hear Judah your father, and keep my words, with thoughts set on doing all the righteous requirements of the Lord and obeying the commands of God.


    Because I boasted that in wars the face of a beautiful woman had not deceived me, and I reproached Reuben my brother concerning Bilhah, my father’s wife, the spirit of jealousy and of sexual immorality arrayed themselves against me, until I sinned with Anan the Canaanite woman and with Tamar my daughter-in-law.


    For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, in the name of his daughter, he showed me an immeasurable abundance of gold, for he was a king. And he adorned her with gold and pearls[d][c][b], and made her pour wine for us at the banquet.'
translation:
  language: pt
  text: '**Testamento de Judá 13**


    **1** E agora eu lhes ordeno, meus filhos: escutem a Judá, seu pai,[a] e guardem as minhas palavras, praticando todas as justas determinações do Senhor e obedecendo aos mandamentos de Deus.


    **2** Não sigam os seus desejos nem andem na arrogância do coração. Não se vangloriem das obras nem da força da juventude de vocês, pois também isso é mau diante do Senhor.


    **3** Pois eu também, vangloriando-me de que, nas guerras, o rosto de uma bela mulher me enganara, censurava meu irmão Rúben por causa de Bila, mulher de meu pai. Então o espírito do ciúme e da imoralidade sexual se pôs em ordem de batalha contra mim, até que pequei com a mulher cananeia[c] e com Tamar, minha nora.


    **4** Pois eu disse ao meu sogro: “Consultarei meu pai e, assim, tomarei sua filha por esposa”. Ele, porém, não quis; em vez disso, mostrou-me uma quantidade incalculável de ouro para a entrega dela,[d] pois era rei.


    **5** Ele a enfeitou com ouro e pérolas e, no banquete, fez com que ela nos servisse vinho em toda a beleza feminina.


    **6** O vinho transtornou meus olhos, e o prazer obscureceu meu coração.


    **7** Apaixonei-me por ela, tive relações com ela e transgredi o mandamento do Senhor e o mandamento de meu pai; então a tomei por esposa.


    **8** E o Senhor me retribuiu conforme o desígnio de minha alma, pois não tive alegria nos filhos dela.


    **Notas**


    [a] A construção grega da abertura é difícil; o sentido geral é uma exortação para que os filhos escutem Judá como pai e guardem suas palavras.


    [c] O grego diz apenas “a mulher cananeia”, sem apresentar aqui um nome próprio. A passagem parece aludir às tradições sobre o casamento de Judá com uma cananeia em Gênesis 38.


    [d] A expressão grega é difícil. Literalmente, o sogro “mostrou” a Judá uma quantidade incalculável de ouro “para a entrega dela”; pode referir-se a riqueza exibida em relação ao casamento proposto, sem especificar com precisão a função desse ouro.'
