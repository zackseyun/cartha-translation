    rationale: '«Formei a linha de batalha» está no singular, mas παραταξάμενοι e ἐδιώξαμεν são plurais: Judá se dispõe para a batalha juntamente com os irmãos, e todos perseguem os inimigos.'
  - severity: low
    issue: «Cidade fortificada» é mais específico que πόλιν κραταιάν
    rationale: κραταιάν significa primariamente «forte/poderosa»; embora uma cidade fortificada seja possível no contexto, «cidade forte» conserva melhor a amplitude lexical.
