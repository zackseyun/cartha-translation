  text: '1. And after this there came to us a greater war toward the south than the one at Shechem; and when I had drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.

    2. And I went up upon the wall and killed their king.

    3. And so we set Hebron free and took all the captives.

    4. But the rest fled.

    5. Then my father Jacob killed Belisath, king of all the kings, a man giant in strength, twelve cubits high.

    6. And terror fell upon them, and they stopped making war against us.

    7. Therefore my father was without anxiety in the wars while I was with my brothers.

    8. For he saw in a vision concerning me that an angel of power went along with me in all things, so that no one might touch me.'
translation:
  language: pt
  text: '4


    1. Depois disso, houve para nós, ao sul, uma guerra em relação à que houve em Siquém.[a] Junto com meus irmãos, entramos em formação de batalha; perseguimos mil homens e matamos duzentos deles, além de quatro reis.


    2. Subi à muralha e matei o rei deles, e tomamos todos os cativos.[b]


    3. No dia seguinte, partimos para Aretá, uma cidade forte que nos ameaçava de morte. Eu e Gade chegamos primeiro pelo lado leste da cidade; Rúben e Levi, pelo lado oeste. Assim libertamos os cativos.


    [a] A construção grega é incomum e permite entender a guerra do sul em comparação ou em acréscimo à guerra de Siquém; o texto não contém explicitamente a palavra “maior”.


    [b] Ou: “tomamos tudo o que havia sido capturado”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção grega é incomum e permite entender a guerra do sul em comparação ou em acréscimo à guerra de Siquém; o texto não contém explicitamente a palavra “maior”.
    reason: Preserva a ambiguidade sintática da fonte e evita importar a expansão interpretativa da camada inglesa.
  - marker: b
    text: 'Ou: “tomamos tudo o que havia sido capturado”.'
    reason: Registra a amplitude semântica de αἰχμαλωσία, que pode indicar os cativos ou, mais amplamente, o que foi capturado.
lexical_decisions:
- source_word: κατὰ νότον … πόλεμος τοῦ ἐν Σικίμοις
  choice: ao sul uma guerra, além da que houve em Siquém
  rationale: Expressa de modo natural a relação genitiva incomum entre as duas guerras sem inserir o adjetivo “maior”, ausente do texto grego fornecido; a ambiguidade é registrada em nota.
- source_word: παραταξάμενοι
  choice: Formei a linha de batalha com meus irmãos
  rationale: O verbo denota dispor-se ou ordenar tropas para o combate; a formulação preserva a imagem militar e a participação dos irmãos.
- source_word: πᾶσαν τὴν αἰχμαλωσίαν
  choice: todos os cativos
  rationale: O substantivo pode designar coletivamente os capturados ou aquilo que foi tomado; escolhe-se o referente humano pelo contexto, mantendo a alternativa em nota.
- source_word: Ἀρετάν
  choice: Aretá
  rationale: Transliteração direta do topônimo grego, sem substituí-lo por Hebrom, que não aparece na fonte grega apresentada.
- source_word: πόλιν κραταιάν
  choice: uma cidade fortificada
  rationale: No contexto de ataque por lados opostos, comunica naturalmente a ideia de uma cidade forte ou poderosa.
- source_word: προσέφθημεν ἀπὸ ἀνατολῶν
  choice: chegamos primeiro pelo lado leste
  rationale: Preserva o valor de precedência de προσφθάνω e torna idiomática a indicação espacial.
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: libertamos os cativos
  rationale: O verbo exige aqui entender αἰχμαλωσία coletivamente como as pessoas mantidas em cativeiro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e narrativo, com legibilidade brasileira e vocabulário internacional. A tradução segue exclusivamente o trecho grego fornecido, que contém três unidades numeradas e termina com a libertação dos cativos em Aretá; não incorpora o material adicional da camada inglesa.
