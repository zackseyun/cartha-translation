  naturalness: A redação é clara e moderna. A revisão torna a primeira frase militar mais fluente e uniformiza a perspectiva narrativa coletiva sem perder que Judá fala em primeira pessoa.
  terminology: «Siquém», «Aretá», «Gade», «Rúben», «Levi», «muralha» e «cativos» são adequados. «Cidade forte» traduz κραταιάν de maneira mais direta e não restringe indevidamente o termo a fortificações físicas.
