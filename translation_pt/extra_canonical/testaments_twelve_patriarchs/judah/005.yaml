  text: 1[a]. And on the next day we went to Areta, a city still mighty and strong, threatening us with death. 2. But I and Gad attacked from the east of the city, and Reuben and Levi from the west. 3. And those on the wall, thinking that we were alone[b], were drawn out toward us. 4. So my brothers secretly, from both sides of the wall, climbed it with stakes and entered the city without their knowing it. 5. And we took it by the edge of the sword, and those who had fled for refuge in the towers we burned with fire; and so we captured them all. 6. And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue. 7. And we killed them also, and burned the city[c], and everything in it.
translation:
  language: pt
  text: '**Testamento de Judá 5**


    1. No dia seguinte, fomos a Aretá, cidade poderosa que nos ameaçava de morte. Eu e Gade avançamos contra a cidade pelo lado leste; Rúben e Levi, pelo oeste.


    2. Os que estavam sobre a muralha, ao perceberem que estávamos sozinhos, foram atraídos em nossa direção.


    3. Então a muralha se ergueu de súbito.[a]


    4. E assim, às escondidas, meus irmãos entraram na cidade pelos dois lados da muralha.


    5. Tomamos a cidade ao fio da espada; queimamos no fogo os que haviam buscado refúgio na torre. Desse modo, capturamos todos eles e tomamos tudo o que possuíam.


    6. Quando estávamos partindo, os homens de Babue[b] se apoderaram dos nossos cativos.[c] Ao vermos isso, travamos batalha com eles.[d]


    7. Matamos todos e recuperamos os nossos cativos.


    [a] O grego deste versículo é incomum e de sentido incerto; literalmente, “a muralha saltou para cima”. É possível que o texto se refira a um movimento súbito junto à muralha ou à ação de transpô-la.


    [b] O nome do lugar ou povo é incerto no texto grego: *Babue*.


    [c] A palavra grega pode indicar os cativos ou, de modo mais amplo, aquilo que havia sido tomado na guerra.


    [d] O grego transmitido traz “tendo nós visto”, seguido de um verbo na terceira pessoa plural (“eles travaram batalha”). A tradução segue o sentido narrativo provável e regulariza a pessoa para “travamos batalha”.'
  philosophy: optimal-equivalence
  footnotes:
