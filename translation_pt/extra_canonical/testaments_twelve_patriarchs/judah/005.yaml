    reason: uncertain_proper_name
  - marker: c
    text: A palavra grega pode indicar os cativos ou, de modo mais amplo, aquilo que havia sido tomado na guerra.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: κραταιάν
  choice: poderosa
  rationale: O adjetivo caracteriza Aretá como uma cidade forte ou formidável. A coluna grega fornecida traz um único adjetivo, por isso não se importou a duplicação presente em outra tradição textual.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: que nos ameaçava de morte
  rationale: Reproduz naturalmente em português a construção participial e mantém a ameaça explícita.
- source_word: προσέφθημεν
  choice: nos antecipamos
  rationale: Preserva a ideia de chegar ou agir antes, sem substituir a forma da fonte por uma variante que expresse inequivocamente um ataque.
- source_word: ἐφειλκύσθησαν πρὸς ἡμᾶς
  choice: foram atraídos em nossa direção
  rationale: Mantém tanto o movimento em direção ao grupo quanto a forma passiva, sem tornar explícita uma ação de sair da muralha que a fonte não declara.
- source_word: ἀνεπήδησεν τὸ τεῖχος
  choice: a muralha se ergueu de súbito
  rationale: A frase grega é gramaticalmente clara, mas semanticamente incomum. A tradução conserva a muralha como sujeito e sinaliza a dificuldade em nota.
- source_word: λάθρα
  choice: às escondidas
  rationale: Expressão portuguesa corrente que comunica a entrada secreta ou furtiva.
- source_word: ἐν στόματι μαχαίρας
  choice: ao fio da espada
  rationale: Equivalente idiomático tradicional e claro da expressão grega, literalmente relacionada à 'boca' da espada.
- source_word: τοὺς ἐν τῷ πύργῳ καταφυγόντας
  choice: os que haviam buscado refúgio na torre
  rationale: Conserva a ideia verbal de fugir para um lugar de proteção e mantém o singular 'torre' da fonte fornecida.
- source_word: ἐν πυρὶ ἐνεπρήσαμεν
  choice: queimamos no fogo
  rationale: Retém a repetição enfática da formulação grega, embora ela seja mais intensa que o português habitual.
- source_word: πάντα τὰ αὐτῶν
  choice: tudo o que possuíam
  rationale: Expressa de modo natural os bens pertencentes aos habitantes, detalhe presente na fonte grega.
- source_word: αἰχμαλωσίαν
  choice: cativos
  rationale: No contexto, o grupo é tomado e depois recuperado; contudo, a palavra também pode designar coletivamente o produto da captura, ambiguidade registrada em nota.
- source_word: συνῆψαν πόλεμον
  choice: travamos batalha
  rationale: Verte o idioma militar com dignidade e clareza, entendendo o sujeito pelo contexto narrativo.
theological_decisions:
- issue: Frase obscura sobre a muralha no versículo 3
  choice: Manter a muralha como sujeito e traduzir a ideia de um movimento súbito, com nota sobre a literalidade e a incerteza.
  alternative: Adotar a leitura expandida de outra tradição, segundo a qual os irmãos escalaram a muralha com estacas.
  rationale: A fonte grega indicada como primária diz literalmente que a muralha 'saltou para cima'. Substituí-la silenciosamente por uma leitura variante eliminaria uma dificuldade textual genuína.
- issue: Extensão da narrativa nos versículos 6–7
  choice: 'Traduzir somente a sequência da coluna grega fornecida: os homens de Babue tomam os cativos, Judá e seus companheiros combatem, matam os adversários e recuperam os cativos.'
  alternative: Acrescentar a entrega dos cativos aos filhos, a perseguição até outra cidade e o incêndio dessa cidade.
  rationale: Esses detalhes aparecem na camada inglesa baseada em outra forma textual, mas não estão presentes na fonte grega primária apresentada. A tradução não harmoniza nem expande o texto.
- issue: Objeto designado por αἰχμαλωσία
  choice: Usar 'cativos' no texto e registrar em nota a possível referência mais ampla ao que foi capturado na guerra.
  alternative: Traduzir por 'despojos' ou 'espólio'.
  rationale: A recuperação posterior favorece pessoas cativas, mas o substantivo coletivo permite maior amplitude semântica; a nota preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas correntes no Brasil e inteligíveis internacionalmente. A tradução segue prioritariamente a coluna grega fornecida, inclusive onde ela diverge da camada inglesa, e evita reconstruir no corpo do texto detalhes atestados apenas em outras formas textuais.
