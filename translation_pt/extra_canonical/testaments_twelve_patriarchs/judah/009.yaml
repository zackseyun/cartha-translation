  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009.yaml
  text: 'For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.


    2 And when the eighteen years were fulfilled, Esau, my father''s brother, came against us with a heavy and powerful people.


    3 And Jacob struck Esau with a bow, and he fell, slain by Jacob''s bow, dead on Mount Seir.


    4 And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting down around it, we besieged it.


    5 And because they did not open to us after twenty days, while they were watching, I brought up a ladder; and placing my shield over my head, and receiving the stones, I went up and killed four of their mighty men.


    6 And Reuben and Gad killed another six. Then they entered in succession.


    7 Then they asked from us terms of peace, and after counsel had been taken with our father, we accepted them.


    8 And they were giving us five hundred cors of wheat, and five hundred measures of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.'
translation:
  language: pt
  text: '**9** Durante dezoito anos, meu pai manteve a paz com seu irmão Esaú, e os filhos dele estiveram conosco depois que viemos da Mesopotâmia, de junto de Labão.


    **2** Quando se completaram os dezoito anos, Esaú, irmão de meu pai, veio contra nós com um povo imponente e poderoso.


    **3** Jacó atingiu Esaú com o arco, e o cadáver foi erguido no monte Seir.


    **4** Nós perseguimos os filhos de Esaú. Eles também tinham uma cidade fortificada, e não conseguimos entrar nela. Então nos instalamos ao redor da cidade e a sitiamos.


    **5** Como não abriram os portões durante vinte dias, enquanto vigiavam, aproximei uma escada e subi com o escudo sobre a cabeça, aparando as pedras lançadas da muralha. Matei quatro dos homens poderosos da cidade.


    **6** Rúben e Gade mataram outros seis.


    **7** Então eles nos pediram condições de paz. Depois de consultarmos nosso pai, nós os recebemos como tributários.


    **8** Eles nos entregavam quinhentos coros[a] de trigo, quinhentas medidas de azeite[b] e quinhentas medidas de vinho, até a época da fome, quando descemos ao Egito.


    [a] O *coro* era uma antiga unidade de capacidade, cujo valor exato variava.


    [b] O termo que designa a unidade de medida do azeite está corrompido no texto grego; “medidas” traduz o sentido provável sem determinar uma unidade específica.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O *coro* era uma antiga unidade de capacidade, cujo valor exato variava.
    reason: A transliteração preserva a unidade antiga, mas leitores modernos precisam saber que não há conversão exata segura.
  - marker: b
    text: O termo que designa a unidade de medida do azeite está corrompido no texto grego; “medidas” traduz o sentido provável sem determinar uma unidade específica.
    reason: Sinaliza de modo transparente a corrupção textual indicada na fonte e a natureza conjectural da tradução genérica.
lexical_decisions:
- source_word: ἐποίησεν ... εἰρήνην
  choice: manteve a paz
  rationale: Expressa naturalmente em português a duração contínua indicada por “durante dezoito anos”, sem sugerir apenas um acordo pontual.
- source_word: λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: com um povo imponente e poderoso
  rationale: Preserva a força de βαρεῖ, literalmente “pesado” e aqui formidável ou ameaçador, sem a estranheza de “povo pesado” em português.
- source_word: ἤρθη ὁ νεκρὸς ἐν ὄρει Σεείρ
  choice: o cadáver foi levado para o monte Seir
  rationale: Mantém a construção passiva e o sentido normal de ἤρθη como “foi levantado/levado”, evitando acrescentar a afirmação de que Esaú caiu ali.
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: aparando as pedras lançadas da muralha
  rationale: Comunica a ação defensiva no contexto da subida com o escudo, sem sugerir que Judá simplesmente recolhia as pedras.
- source_word: ὑποφόρους
  choice: como tributários
  rationale: O termo descreve pessoas sujeitas ao pagamento de tributo; essa informação explícita do grego não deve ser reduzida a uma simples aceitação.
- source_word: κόρους
  choice: coros
  rationale: Translitera a unidade antiga em vez de convertê-la para um volume moderno incerto.
- source_word: †ὕφης
  choice: medidas
  rationale: A leitura transmitida está corrompida; a tradução genérica preserva a estrutura quantitativa sem fingir certeza lexical.
theological_decisions:
- issue: Relato da morte e remoção de Esaú
  choice: Traduzir apenas que Jacó o atingiu e que o cadáver foi levado ao monte Seir.
  alternative: Dizer que Esaú caiu morto no monte Seir, abatido pela flecha de Jacó.
  rationale: O grego identifica Esaú como atingido e depois menciona o cadáver em construção passiva, mas não repete o instrumento nem declara inequivocamente que ele morreu ou caiu no próprio monte. A tradução evita ampliar a narrativa.
translation_notes:
  register: 'Português moderno, digno e narrativamente fluente, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A sintaxe foi atualizada sem suavizar a violência do relato nem acrescentar elementos presentes apenas na camada inglesa. Os nomes seguem as formas portuguesas correntes: Esaú, Jacó, Labão, Rúben, Gade e Seir.'
