  text: And the Lord gave me favor in all my works[a], in the field and in the house. I know that I ran with a hind and caught it, and I made it food for my father, and he ate. And I would seize the gazelle in its course, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and cast it down the cliff, and it was crushed. I ran down the wild boar, and I overtook it as I ran and tore it apart. I caught a wild mare and, after seizing it, subdued it. A leopard in Hebron sprang upon the dog, and I caught it by the tail and flung it against the rock, and it was split in two. I found a wild ox grazing in the land, and taking hold of its horns[c][b], I shook it round and round and struck it blind.
translation:
  language: pt
  text: 2 O Senhor me concedeu favor[b] em tudo o que eu fazia[a], tanto no campo como em casa. Sei que corri ao lado de uma corça, alcancei-a e a transformei em alimento para meu pai, e ele comeu. Eu agarrava a gazela em plena corrida e alcançava tudo o que havia nos campos. Matei o leão e arranquei um cabrito de sua boca. Peguei o urso pela pata, lancei-o precipício abaixo, e ele ficou despedaçado. Persegui o javali, alcancei-o enquanto corria e o dilacerei. Em Hebrom, um leopardo saltou sobre o cão; agarrei-o pela cauda e o arremessei contra a rocha, e ele se partiu em dois. Encontrei um boi selvagem[c] pastando na região; agarrei-o pelos chifres, sacudi-o em círculos, ceguei-o, derrubei-o e o matei. Também domei um leão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego deste capítulo é áspero em alguns pontos, sobretudo na sequência dos feitos com animais. A tradução acompanha o testemunho grego preservado sem eliminar todas as suas transições abruptas.
    reason: textual_variant
  - marker: b
    text: Ou “graça”. Neste contexto, “favor” ressalta o êxito concedido pela benevolência divina nas atividades de Judá.
    reason: lexical_alternative
  - marker: c
    text: Ou “touro selvagem”. O grego admite as duas formas; a imagem é a de um bovino forte e indomado.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν
  choice: favor
  rationale: No contexto dos feitos e do êxito de Judá, indica benevolência e capacitação concedidas pelo Senhor; “favor” evita restringir o termo a um uso teológico posterior.
- source_word: ἔλαφος
  choice: corça
  rationale: O referente é retomado por pronome feminino; “corça” expressa com naturalidade uma fêmea de cervídeo.
- source_word: δορκάς
  choice: gazela
  rationale: É o equivalente moderno mais claro para o animal designado pelo grego.
- source_word: ἀφειλόμην
  choice: arranquei
  rationale: Comunica a retirada enérgica do cabrito da boca do leão.
- source_word: κρημνός
  choice: precipício
  rationale: Expressa uma queda íngreme e preserva a violência da cena.
- source_word: κατεσπάραξα
  choice: dilacerei
  rationale: Preserva a força do verbo, que descreve rasgar violentamente.
- source_word: σκοτίσας
  choice: deixei-o atordoado
  rationale: No encadeamento físico de girar, derrubar e matar o animal, traduz o efeito de obscurecimento ou desorientação sem impor a ideia mais específica de cegueira permanente.
- source_word: βοῦν ἄγριον
  choice: boi selvagem
  rationale: Designa um bovino poderoso e não domesticado; “touro selvagem” também é possível.
- source_word: ἡμέρωσα
  choice: domei
  rationale: Traduz diretamente a ideia de tornar manso ou subjugar um animal selvagem.
theological_decisions:
- issue: Ação divina nos feitos de Judá
  choice: O Senhor concede favor a Judá em tudo o que ele faz.
  alternative: Entender a frase apenas como uma fórmula geral de bênção, sem relação direta com seus êxitos.
  rationale: A abertura atribui explicitamente ao Senhor o favor presente nas atividades de Judá, sem negar que os feitos sejam narrados como ações do próprio Judá.
translation_notes:
  register: 'Português moderno, digno e narrativamente vigoroso, com leitura natural no Brasil e compreensão internacional. A tradução segue a coluna grega fornecida como fonte primária: não inclui o episódio da égua selvagem, ausente desse texto, e conserva a frase final sobre domar um leão. A sintaxe especialmente difícil de βοῦν ἄγριον foi vertida como uma sequência breve de ações, preservando seu caráter abrupto.'
