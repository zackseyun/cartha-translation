  source_fidelity: A tradução preserva corretamente a sequência narrativa, a comparação com Siquém, a ação conjunta com os irmãos e os números. Contudo, «veio contra nós» introduz uma orientação adversativa que γέγονεν ἡμῖν não expressa de modo explícito; a construção indica mais diretamente que uma guerra ocorreu/sobreveio ao grupo.
  naturalness: O português é claro e de registro narrativo apropriado. «Veio-nos uma guerra» é uma formulação natural e mais próxima do dativo grego do que «veio contra nós».
