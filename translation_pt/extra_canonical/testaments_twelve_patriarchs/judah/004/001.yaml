  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/001.yaml
  text: And after this there came to us a war toward the south, greater than the one at Shechem; and having drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.
translation:
  language: pt
  text: Depois disso, veio-nos uma guerra ao sul, maior do que a de Siquém. Tomando posição de combate com meus irmãos, perseguimos mil homens e matamos duzentos deles e quatro reis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγονεν ἡμῖν
  choice: veio contra nós
  rationale: Expressa de modo natural a ideia de uma guerra que sobreveio ao grupo; “contra nós” torna explícito o sentido hostil exigido pelo contexto.
- source_word: κατὰ νότον
  choice: ao sul
  rationale: Mantém a orientação geográfica do grego em português corrente, sem especificar indevidamente origem ou destino.
- source_word: τοῦ ἐν Σικίμοις
  choice: do que a de Siquém
  rationale: Segue a leitura comparativa refletida no texto consultivo inglês e verte o topônimo pela forma portuguesa consagrada.
- source_word: παραταξάμενοι
  choice: Tomando posição de combate
  rationale: Reproduz a ação de organizar-se ou alinhar-se para a batalha, com particípio ligado ao sujeito plural.
- source_word: ἐδιώξαμεν
  choice: perseguimos
  rationale: Equivalente direto e natural para a perseguição militar descrita.
- source_word: ἀπεκτείναμεν
  choice: matamos
  rationale: Verbo claro e corrente que preserva sem eufemismo o sentido do grego.
