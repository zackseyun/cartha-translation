translation:
  language: pt
  text: E eu subi à muralha, matei o rei deles e tomamos toda a população cativa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os cativos”. O grego emprega um substantivo coletivo para as pessoas capturadas.'
