lexical_decisions:
- source_word: ἀνῆλθον ... ἐπὶ τοῦ τείχους
  choice: subi à muralha
  rationale: Reproduz de modo natural o movimento de subida até a muralha. O texto grego fornecido traz τοῦ τείχους, no singular, sem o numeral δύο; por isso, não se acrescentou “dupla”.
- source_word: ἀνεῖλον
  choice: matei
  rationale: Expressa diretamente o sentido de eliminar ou matar no contexto de combate.
- source_word: πᾶσαν τὴν αἰχμαλωσίαν
  choice: todos os cativos
  rationale: O substantivo coletivo pode indicar o conjunto dos capturados. Esta formulação é clara em português e mantém a referência a pessoas levadas em cativeiro.
