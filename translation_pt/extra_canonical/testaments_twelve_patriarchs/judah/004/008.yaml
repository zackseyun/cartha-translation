source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Εἶδε⁵⁶ γὰρ⁵⁷ *ἐν ὁράματι⁵⁸ †περὶ ἐμοῦ⁵⁹ ὅτι ἄγγελος δυνάμεως⁶⁰ συνέπεταί μοι⁶¹ ἐν πᾶσι, τοῦ μὴ⁶² ἡττᾶσθαί⁶³ μοι.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/008.yaml
  text: For he saw in a vision concerning me that an angel of power accompanied me in all things, so that I might not be touched.
translation:
  language: pt
  text: Pois ele viu numa visão a meu respeito que um anjo de poder me acompanhava em tudo, para que eu não fosse vencido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος δυνάμεως
  choice: um anjo de poder
  rationale: Mantém a construção genitiva e sua possível amplitude sem especificar se o poder pertence ao anjo ou caracteriza sua função.
- source_word: συνέπεταί μοι
  choice: me acompanhava
  rationale: Expressa de modo natural a ideia de seguir junto ou acompanhar, adequada ao contexto narrativo passado.
- source_word: ἐν πᾶσι
  choice: em tudo
  rationale: Preserva a formulação abrangente e concisa do grego.
- source_word: ἡττᾶσθαί μοι
  choice: eu não fosse vencido
  rationale: ἡττάομαι significa ser vencido, derrotado ou levar desvantagem; esta tradução segue o sentido lexical do grego, em vez de adotar o menos provável 'ser tocado' da camada inglesa.
theological_decisions:
- issue: Natureza da proteção angelical
  choice: para que eu não fosse vencido
  alternative: para que eu não fosse derrotado
  rationale: A tradução não define o mecanismo nem o alcance teológico da proteção; conserva a finalidade expressa no texto e a passividade do sujeito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A ordem foi levemente naturalizada, preservando a relação causal introduzida por γάρ e a ambiguidade de 'anjo de poder'.
