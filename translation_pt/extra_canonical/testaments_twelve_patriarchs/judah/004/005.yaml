  source_fidelity: A tradução preserva corretamente ἀνεῖλε («matou»), Ἰακώβ («Jacó»), Βελισάθ («Belisate»), βασιλέα πάντων τῶν βασιλέων («rei de todos os reis») e πηχῶν δώδεκα («doze côvados»). O texto grego fornecido não contém «Então» nem «pai de reis», apesar da redação da trilha inglesa. A construção ἄνδρα γίγαντα τῇ ἰσχύι caracteriza o homem como gigante/em força; a redação proposta torna essa relação mais direta.
