  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/005.yaml
  text: Then my father Jacob killed Belisath, king of all, father of kings, a giant man in strength, twelve cubits tall.
translation:
  language: pt
  text: Meu pai Jacó matou Belisate, rei de todos os reis, um gigante em força, de doze côvados de altura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “de doze côvados”, sem incluir a palavra “altura”. Um côvado correspondia aproximadamente à distância do cotovelo à ponta dos dedos.
    reason: Registra que “de altura” é uma explicitação contextual e esclarece a antiga unidade de medida sem impor uma conversão moderna incerta.
lexical_decisions:
- source_word: ἀνεῖλε
  choice: matou
  rationale: Expressa de modo direto e natural o aoristo de ἀναιρέω neste contexto narrativo.
- source_word: Βελισάθ
  choice: Belisate
  rationale: Transliteração adaptada à ortografia e à pronúncia correntes do português.
- source_word: βασιλέα πάντων τῶν βασιλέων
  choice: rei de todos os reis
  rationale: Segue integralmente o grego preservado, sem introduzir a expressão adicional “pai de reis”, que não consta do texto-fonte apresentado.
- source_word: ἄνδρα γίγαντα τῇ ἰσχύι
  choice: um homem de força gigantesca
  rationale: Reproduz a caracterização da força como gigantesca em português natural, evitando a formulação pouco idiomática “um homem gigante em força”.
- source_word: πηχῶν δώδεκα
  choice: com doze côvados de altura
  rationale: Torna explícita a dimensão corporal naturalmente subentendida no contexto, mantendo a unidade antiga de medida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução parte do grego e não conserva o “Então” nem a expressão “pai de reis” da camada inglesa, pois ambos estão ausentes do texto-fonte fornecido.
