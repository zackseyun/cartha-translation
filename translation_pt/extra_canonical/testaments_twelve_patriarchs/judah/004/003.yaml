  text: And so we set Hebron free and took all the captives.
translation:
  language: pt
  text: No dia seguinte, fomos a Aretã, uma cidade fortificada que nos ameaçava de morte. Gade e eu atacamos a cidade pelo leste; Rúben e Levi, pelo oeste. Assim libertamos os cativos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “libertamos o cativeiro”.'
    reason: Registra a formulação metonímica do grego, enquanto o texto principal apresenta seu sentido natural em português.
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: No dia seguinte
  rationale: A expressão elíptica indica naturalmente o dia subsequente no contexto narrativo.
- source_word: Ἀρετάν
  choice: Aretã
  rationale: Transliteração portuguesa do topônimo grego, sem substituí-lo por Hebrom, que não aparece no texto-fonte deste versículo.
- source_word: πόλιν κραταιάν
  choice: uma cidade fortificada
  rationale: κραταιός significa forte ou poderosa; no contexto militar, “fortificada” comunica de modo natural a força defensiva da cidade.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: que nos ameaçava de morte
  rationale: Reproduz diretamente a personificação da cidade e a ameaça mortal expressa no grego.
- source_word: προσέφθημεν
  choice: chegamos primeiro
  rationale: O verbo pode indicar antecipar-se ou chegar antes; a escolha conserva a precedência de Judá e Gade sem acrescentar uma ação militar não expressa.
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως
  choice: pelo lado leste da cidade
  rationale: Formulação corrente em português para a aproximação vinda da direção oriental.
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: libertamos os cativos
  rationale: O grego diz literalmente “libertamos o cativeiro”, metonímia que em português se expressa com clareza como a libertação das pessoas mantidas em cativeiro.
