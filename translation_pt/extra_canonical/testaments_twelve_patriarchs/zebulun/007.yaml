  text: 1[a]. Therefore, my children, have compassion in mercy toward every person, so that the Lord also may have compassion in mercy toward you. 2. Because in the last days you also will send forth your compassion upon the earth, and wherever the Most High finds a heart of compassion, there he dwells. 3. For in the measure that a man has compassion on his neighbors, so also the Lord has compassion on him. 4. And when we came down into Egypt, Joseph my brother tested us, and he learned that I was compassionate. 5. For when I sat by him, I did not grieve him with envy, and I did not speak bitterly against him. 6. And after these things, my children, I urge you not to hold malice in your hearts against one another[b], and to love one another in deed and in word. 7. For in the presence of my father I spoke peaceably to Joseph; and when I had gone out, Dan told us that the prince of the eunuchs was seeking to destroy him, because he had become attached to him as a pure and good young man. 8.
    But I wept over Joseph, and I prayed for him, that the Lord would deliver him from every evil intention. 9. And afterward the Ishmaelites came and took him away, and they persuaded him to go with them, and they sold him to Potiphar in Egypt. 10. But because of the compassion that I had shown to my brother, the Lord did not let me fall into the same testing. 11. And when all my brothers were sick, and our father was grieving because of them, I had compassion on every poor man and every sick man, and I gave to all in simplicity of heart. 12. And if I had nothing to give to the needy, I walked with him for seven stadia, weeping with him in mercy. 13. Therefore, my children, have compassion in mercy toward every person with a good heart, so that God also may give you compassion and mercy. 14. For if a man does not have compassion on his neighbor, he provokes the Lord. 15. And if he hardens his heart, and does not have compassion on his neighbor, and does not help the poor, the Lord will
    judge him. 16. For throughout all my life I did not walk in crookedness, but in all simplicity. 17. I did not set my mind on silver or gold, or on any glory of men. 18. I did not wear a double face. 19. I did not devise evil against my neighbor. 20. I did not corrupt my speech with many-colored words. 21. I walked with all men in simplicity of heart. 22. Therefore, my children, do you also have these things, and every spirit of Beliar will flee from you, and no deed of wicked men will rule over you; and every wild beast you will master, since you have with you the God of heaven and earth and walk with men in simplicity of heart. 23. And after he had said these things, he commanded them to carry his body to Hebron and to bury it with his fathers. 24. And when he had fallen asleep at a good old age, his sons laid him in a coffin. 25[c][d]. And afterward they carried him up to Hebron and buried him with his fathers.
translation:
  language: pt
  text: '**Testamento de Zebulom 7**


    **1.** Estendi uma vela sobre outra peça de madeira, erguida no meio. **2.** Ali eu percorria o litoral, pescando peixes para a casa de meu pai, até que fomos para o Egito. **3.** Movido de compaixão, eu repartia o que pescava com todo estrangeiro. **4.** Se havia algum estrangeiro, doente ou idoso, eu cozinhava os peixes, preparava-os bem conforme a necessidade de cada um e os oferecia a todos, partilhando sua dor e seu sofrimento. **5.** Por isso, o Senhor também me cumulou de muitos peixes na pescaria, pois quem reparte com o próximo recebe do Senhor muitas vezes mais. **6.** Assim, pesquei durante cinco anos, repartindo com toda pessoa que eu via e provendo o necessário para toda a casa de meu pai. **7.** Quanto à metade, eu a preparava no inverno com meus irmãos.[a] **8.** Se vocês não tiverem o que dar ao necessitado, sofram com ele, com entranhas de misericórdia.[b] **9.** Sei que, quando minha mão nada encontrou para dar ao necessitado, caminhei com ele por sete estádios,[c]
    chorando ao seu lado; e minhas entranhas se comoviam de compaixão por ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O referente de “metade” não está expresso neste trecho; pelo contexto, pode ser metade dos peixes ou da pesca. A redação grega permanece abrupta.
    reason: ambiguity
  - marker: b
    text: “Entranhas de misericórdia” é uma imagem antiga para a compaixão sentida no íntimo da pessoa.
    reason: cultural_note
  - marker: c
    text: Sete estádios correspondem aproximadamente a 1,3 quilômetros.
    reason: cultural_note
lexical_decisions:
- source_word: ὀθόνη
  choice: vela
  rationale: No contexto de deslocamento costeiro e pesca, o tecido estendido sobre uma peça vertical designa naturalmente uma vela.
- source_word: ξύλον ὀρθόν
  choice: peça de madeira, erguida
  rationale: Evita especificar 'mastro' além do substantivo genérico grego, mas comunica a função e a posição vertical da peça.
- source_word: αἰγιαλούς
  choice: litoral
  rationale: Expressa de modo natural o plural grego referente às praias ou costas percorridas.
- source_word: σπλαγχνίζομαι / σπλάγχνα
  choice: movido de compaixão / entranhas
  rationale: A forma verbal recebe uma expressão portuguesa natural, enquanto a imagem corporal explícita dos versículos 8–9 é preservada para manter a intensidade e a repetição do grego.
- source_word: μεταδίδωμι
  choice: repartir
  rationale: Comunica participação concreta dos próprios recursos, e não apenas uma doação abstrata.
- source_word: συναλγέω / συμπάσχω
  choice: partilhar a dor / o sofrimento
  rationale: Mantém os dois verbos coordenados e sua ênfase na solidariedade com a aflição alheia.
- source_word: πλησίον
  choice: próximo
  rationale: É o termo ético bíblico corrente em português e preserva a relação moral expressa pelo grego.
- source_word: στάδιον
  choice: estádio
  rationale: Conserva a antiga unidade de distância; a equivalência aproximada é esclarecida em nota.
theological_decisions:
- issue: Relação entre generosidade humana e recompensa do Senhor
  choice: Manter a afirmação de que quem reparte recebe do Senhor muitas vezes mais.
  alternative: Generalizar como uma máxima sobre os benefícios da generosidade.
  rationale: O texto atribui explicitamente ao Senhor a retribuição abundante e não a apresenta como mero efeito impessoal.
- issue: Compaixão expressa por imagem corporal
  choice: Preservar 'entranhas de misericórdia' e o movimento das entranhas nos versículos 8–9.
  alternative: Uniformizar todas as ocorrências simplesmente como 'compaixão'.
  rationale: A formulação concreta do grego intensifica a solidariedade interior; a nota torna a imagem compreensível sem apagá-la.
- issue: Diferença entre o grego fornecido e a camada inglesa de consulta
  choice: Traduzir o texto grego fornecido, sem substituir seu conteúdo pelo capítulo divergente da consulta inglesa.
  alternative: Seguir a numeração e o conteúdo da versão inglesa apesar da ausência desse conteúdo no testemunho grego apresentado.
  rationale: A evidência na língua original tem prioridade. A divergência editorial não deve ser resolvida por harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente compreensíveis e tratamento por “vocês”. A tradução segue prioritariamente o grego fornecido, cujo conteúdo diverge substancialmente da camada inglesa de consulta. Foram preservadas a formulação abrupta do versículo 7, a imagem visceral dos versículos 8–9 e a reciprocidade teológica do versículo 5, sem harmonização conjectural.
