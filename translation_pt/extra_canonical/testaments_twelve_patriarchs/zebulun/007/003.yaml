  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/003.yaml
  text: And I was walking along the shore, fishing for fish for my father's house until we came to Egypt.
translation:
  language: pt
  text: E eu andava por ali, percorrendo as praias e pescando peixes para a casa de meu pai, até que chegamos ao Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαπορευόμενος τοὺς αἰγιαλούς
  choice: percorria as praias
  rationale: Expressa naturalmente o movimento contínuo ao longo das faixas litorâneas; o plural grego é preservado.
- source_word: ἁλιεύων ἰχθύας
  choice: pescando peixes
  rationale: Mantém o verbo e seu objeto explícito, acompanhando a formulação enfática do grego.
- source_word: τῷ οἴκῳ τοῦ πατρός μου
  choice: para a casa de meu pai
  rationale: Preserva o sentido de provisão destinada à família ou ao domicílio paterno, sem reduzi-lo apenas ao pai.
- source_word: ἕως ὅτου ἤλθομεν εἰς Αἴγυπτον
  choice: até que fomos para o Egito
  rationale: Mantém a mudança da primeira pessoa singular para a primeira pessoa plural e traduz o deslocamento de modo idiomático.
