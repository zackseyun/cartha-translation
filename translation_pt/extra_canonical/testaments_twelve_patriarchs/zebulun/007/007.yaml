  text: For five years, then, I fished, sharing with everyone I had seen, and providing for all my father’s house.
translation:
  language: pt
  text: Assim, durante cinco anos, pesquei[a], repartindo com todos os que eu tinha visto e provendo o necessário para toda a casa de meu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na edição grega usada, as duas orações finais — «repartindo...» e «provendo...» — aparecem entre colchetes, indicando dúvida editorial quanto à sua pertença ao texto.
    reason: Preservar transparência sobre a incerteza textual assinalada pela edição-fonte e situar a chamada no início exato do trecho entre colchetes.
lexical_decisions:
- source_word: ἡλίευσα
  choice: pesquei
  rationale: Verbo no aoristo, traduzido diretamente como a atividade exercida durante o período indicado.
- source_word: μεταδιδούς
  choice: repartindo
  rationale: Expressa compartilhar ou dar uma parte; o objeto — provavelmente aquilo que era pescado — permanece implícito, como no grego.
- source_word: παντὶ ἀνθρώπῳ ὃν ἑωράκειν
  choice: com todos os que eu via
  rationale: Reproduz em português natural a ideia distributiva do texto, sem restringir quem recebia a um grupo específico.
- source_word: ἐξαρκῶν
  choice: provendo o necessário
  rationale: O verbo indica bastar ou suprir suficientemente; esta formulação comunica que ele garantia o sustento necessário.
- source_word: παντὶ τῷ οἴκῳ τοῦ πατρός μου
  choice: para toda a casa de meu pai
  rationale: Conserva 'casa' no sentido amplo de família ou unidade doméstica, sem reduzi-la apenas ao edifício.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe corrente no Brasil e compreensão ampla no espaço lusófono. O objeto de “repartindo” não foi explicitado para preservar a concisão e a abertura do grego.
