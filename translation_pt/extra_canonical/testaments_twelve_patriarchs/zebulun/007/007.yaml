    issue: «os que eu via» traduz ἑωράκειν sem a anterioridade do mais-que-perfeito.
    rationale: A forma grega indica «os que eu tinha visto». Embora a construção seja algo incomum no contexto, a tradução deve conservar seu valor verbal em vez de o substituir por uma ação simultânea habitual.
