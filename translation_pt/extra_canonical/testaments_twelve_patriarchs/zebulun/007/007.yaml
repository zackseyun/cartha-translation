  source_fidelity: O texto verte corretamente Πέντε οὖν ἔτη, ἡλίευσα, μεταδιδούς e ἐξαρκῶν. Contudo, ἑωράκειν é formalmente um mais-que-perfeito («eu tinha visto»), não um imperfeito («eu via»). A revisão preserva essa anterioridade, sem resolver além do necessário a estranheza contextual da construção grega.
  naturalness: A redação é clara e de registro moderno. «Todos os que eu tinha visto» é natural em português e reproduz com maior precisão o aspecto verbal do grego. A nota é posicionada imediatamente após «pesquei», deixando inequívoco que seu alcance são as duas orações que seguem, delimitadas por colchetes na edição.
  terminology: «Pesquei», «repartindo» e «provendo o necessário» são escolhas adequadas. «Casa de meu pai» mantém o sentido de unidade doméstica/familiar sem interpretação confessional.
  issues:
