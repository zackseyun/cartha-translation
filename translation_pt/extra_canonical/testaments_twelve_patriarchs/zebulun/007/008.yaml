base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/008.yaml
  text: Half of it I would set aside in winter with my brothers. But if you do not have anything to give to the one in need, suffer with him in inward parts of mercy. I know that my own hand did not find anything to give to the one in need, and walking together with him for seven stadia I would weep; and my inward parts turned toward him in sympathy.
translation:
  language: pt
  text: Mas, se vocês não tiverem nada para dar ao necessitado, sofram com ele, movidos por profunda misericórdia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “em entranhas de misericórdia”, expressão que descreve compaixão profunda e íntima.'
    reason: Registra a imagem corporal do grego, que foi vertida idiomaticamente no texto principal.
lexical_decisions:
- source_word: τῷ χρήζοντι
  choice: ao necessitado
  rationale: Expressa de modo natural a pessoa que está em necessidade, sem restringir o tipo de carência.
- source_word: συμπάσχετε αὐτῷ
  choice: sofram com ele
  rationale: Preserva o sentido verbal forte de compartilhar o sofrimento, em vez de reduzi-lo apenas a um sentimento de compaixão.
- source_word: ἐν σπλάγχνοις ἐλέους
  choice: movidos por profunda misericórdia
  rationale: Comunica em português atual o idioma semítico-helenístico das 'entranhas' como sede da compaixão profunda, mantendo a força afetiva da expressão.
theological_decisions:
- issue: A exigência ética quando não há bens para oferecer
  choice: Manter o imperativo de compartilhar o sofrimento do necessitado
  alternative: Traduzir apenas como 'tenham compaixão dele'
  rationale: O verbo grego indica participação no sofrimento, não somente benevolência interior; a tradução evita enfraquecer essa tensão ética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A formulação conserva o paralelismo entre a impossibilidade de dar bens e a obrigação de compartilhar o sofrimento.
