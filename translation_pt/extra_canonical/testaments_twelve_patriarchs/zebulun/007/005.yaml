base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/005.yaml
  text: If anyone was a foreigner, or sick, or aged, after boiling the fish and preparing them well, I would offer them to each according to need, suffering with them and feeling their pain.
translation:
  language: pt
  text: Se alguém era estrangeiro, estava doente ou era idoso, depois de ferver os peixes e prepará-los bem, conforme a necessidade de cada um, eu os oferecia a todos,[a] condoendo-me com eles e compartilhando seu sofrimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma grega traduzida por “eu os oferecia” também pode, isoladamente, significar “eles os ofereciam”; os particípios no singular e o contexto autobiográfico favorecem a primeira pessoa.
    reason: Preservar uma ambiguidade morfológica real do verbo προσέφερον e explicar por que a leitura principal adota a primeira pessoa.
lexical_decisions:
- source_word: ξένος
  choice: estrangeiro
  rationale: Expressa de modo natural a pessoa vinda de fora; evita restringir o termo ao sentido mais subjetivo de “desconhecido”.
- source_word: ἐψήσας τοὺς ἰχθύας
  choice: eu cozinhava os peixes
  rationale: O verbo pode designar cozinhar ou ferver; “cozinhava” é claro e natural sem impor um método culinário mais específico do que o necessário.
- source_word: ποιήσας αὐτὰ ἀγαθῶς κατὰ τὴν ἑκάστου χρείαν
  choice: e os preparava bem, conforme a necessidade de cada um
  rationale: Reproduz tanto o cuidado no preparo quanto sua adaptação à necessidade individual.
- source_word: συναλγῶν καὶ συμπάσχων
  choice: condoendo-me com eles e compartilhando seu sofrimento
  rationale: 'Mantém os dois verbos coordenados: sentir a dor alheia e participar do sofrimento, sem reduzi-los a uma única ideia genérica de compaixão.'
theological_decisions:
- issue: Identidade do sujeito de προσέφερον
  choice: eu os oferecia
  alternative: eles os ofereciam
  rationale: A forma verbal isolada admite primeira pessoa do singular ou terceira do plural, mas os particípios masculinos no singular (ἐψήσας, ποιήσας, συναλγῶν, συμπάσχων) sustentam a leitura em primeira pessoa no fluxo da fala autobiográfica. A ambiguidade morfológica é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “eu” esclarece o sujeito após a oração condicional, enquanto “condoendo-me” conserva o tom compassivo e solene do original.
