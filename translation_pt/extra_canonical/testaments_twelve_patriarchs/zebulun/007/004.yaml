  text: And from my catch, showing compassion, I shared with every stranger.
translation:
  language: pt
  text: E, daquilo que eu caçava, repartia com todo estrangeiro, movido de compaixão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῆς θήρας μου
  choice: daquilo que eu caçava
  rationale: Expressa naturalmente a procedência da partilha e preserva o sentido de caça ou produto da caça, sem restringi-lo indevidamente a uma única captura.
- source_word: παντὶ ἀνθρώπῳ ξένῳ
  choice: com todo estrangeiro
  rationale: Mantém a abrangência distributiva de παντί e traduz ξένῳ pelo sentido direto de pessoa estrangeira ou forasteira.
- source_word: σπλαγχνιζόμενος
  choice: movido de compaixão
  rationale: Comunica de modo corrente e digno a compaixão profunda expressa pelo particípio grego.
- source_word: μετεδίδουν
  choice: repartia
  rationale: O imperfeito indica ação habitual ou continuada; “repartia” transmite o ato de dar a outros uma parte do que possuía.
