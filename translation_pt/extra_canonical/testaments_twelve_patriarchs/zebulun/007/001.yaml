lexical_decisions:
- source_word: ὀθόνην
  choice: um pano
  rationale: Designa uma peça de tecido ou lençol; “pano” é natural no contexto sem especificar além do grego.
- source_word: ἐξέτεινα
  choice: Estendi
  rationale: Reproduz diretamente a ideia de estender ou abrir o tecido.
- source_word: ἐν ἑτέρῳ ξύλῳ ὀρθῷ
  choice: sobre outra trave vertical
  rationale: ξύλον pode designar madeira, peça de madeira ou trave; com ὀρθῷ, “trave vertical” comunica uma peça erguida. A preposição ἐν admite aqui valor locativo de apoio ou fixação, expresso naturalmente por “sobre”.
- source_word: ἐν μέσῳ
  choice: no meio
  rationale: Mantém a expressão espacial concisa e sua possível imprecisão referencial.
