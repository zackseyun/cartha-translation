source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Διὰ τοῦτο καὶ ὁ Κύριος *πολλοὺς ἰχθύας ἐνέπλησέ με²⁵ ἐν τῇ ἄγρᾳ τῶν ἰχθύων²⁶. Ὁ γὰρ μεταδιδοὺς τῷ πλησίον²⁷, λαμβάνει πολλαπλασίονα²⁸ παρὰ Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/006.yaml
  text: For this reason the Lord also filled me with many fish in the catch of fish. For the one who shares with his neighbor receives many times more from the Lord.
translation:
  language: pt
  text: Por isso, o Senhor também me concedeu uma pesca repleta de peixes.[a] Pois quem reparte com o próximo recebe do Senhor muitas vezes mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “encheu-me de muitos peixes na captura de peixes”.'
    reason: Registra a construção incomum e a imagem verbal do grego, enquanto o texto principal emprega português natural.
lexical_decisions:
- source_word: ἐνέπλησέ με
  choice: me concedeu uma pesca repleta
  rationale: A expressão grega diz literalmente que o Senhor “me encheu” de muitos peixes, construção pouco natural em português. A formulação escolhida conserva a ideia de provisão abundante sem sugerir que o corpo do narrador foi cheio de peixes.
- source_word: ἄγρᾳ τῶν ἰχθύων
  choice: pesca repleta de peixes
  rationale: ἄγρα designa a captura ou pescaria, não especificamente uma rede. “Pesca” evita introduzir um instrumento ausente do texto grego.
- source_word: μεταδιδοὺς τῷ πλησίον
  choice: quem reparte com o próximo
  rationale: μεταδίδωμι exprime dar uma parte ou compartilhar; “reparte” transmite essa reciprocidade prática, e “próximo” corresponde ao sentido relacional de πλησίον.
- source_word: πολλαπλασίονα
  choice: muitas vezes mais
  rationale: O neutro substantivado indica uma quantidade multiplicada, isto é, muitas vezes aquilo que foi repartido, sem especificar a natureza da recompensa.
theological_decisions:
- issue: Natureza do que é recebido do Senhor
  choice: recebe do Senhor muitas vezes mais
  alternative: recebe do Senhor uma recompensa muitas vezes maior
  rationale: O grego não explicita que se trata de “recompensa” nem define se o retorno é material ou espiritual. A tradução preserva essa abertura.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém “Senhor” e “próximo”, termos amplamente reconhecidos, e evita interpretar a promessa como garantia especificamente material.
