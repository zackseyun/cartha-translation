  text: 7. Καὶ μετὰ ταῦτα μνησθέντες Κύριον †ἐπιστρέψετε³³ καὶ ἐλεήσει³⁴ ὑμᾶς, ὅτι ἐλεήμων ἐστὶ καὶ εὔσπλαγχνος, *καὶ οὐ λογίζεται³⁵ κακίαν τοῖς υἱοῖς τῶν ἀνθρώπων διότι σάρξ εἰσιν καὶ πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/007.yaml
  text: And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go astray in their evil deeds.
translation:
  language: pt
  text: E, depois dessas coisas, quando vocês se lembrarem do Senhor, voltarão, e ele terá misericórdia de vocês, pois é misericordioso e compassivo e não lhes leva em conta a maldade, porque são carne e se extraviam em suas más práticas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησθέντες Κύριον
  choice: quando vocês se lembrarem do Senhor
  rationale: Expressa naturalmente em português o particípio aoristo com valor temporal, mantendo o Senhor como objeto da lembrança.
- source_word: ἐπιστρέψετε
  choice: voltarão
  rationale: Preserva o futuro e a ideia ampla de voltar ou retornar, sem explicitar um destino ou uma conversão que o grego não formula aqui.
- source_word: ἐλεήσει ὑμᾶς
  choice: terá misericórdia de vocês
  rationale: Formulação corrente e dignificada para o verbo ἐλεέω, preservando a relação direta com os destinatários.
- source_word: οὐ λογίζεται κακίαν
  choice: não leva em conta a maldade
  rationale: Reproduz o sentido de considerar ou computar algo, sem acrescentar a ideia específica de punição ou imputação jurídica.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: dos filhos dos homens
  rationale: Mantém a expressão antropológica tradicional e sua textura semítica; em português, a construção com 'levar em conta' exige uma formulação relacional natural.
- source_word: σάρξ εἰσιν
  choice: são carne
  rationale: Conserva a linguagem antropológica concreta do original e sua possível conotação de fragilidade humana.
- source_word: πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν
  choice: se desviam em suas más ações
  rationale: Preserva tanto a ideia de extravio de πλανῶνται quanto a referência explícita às ações más.
theological_decisions:
- issue: Alcance de ἐπιστρέψετε
  choice: voltarão
  alternative: se converterão
  rationale: O verbo pode ter sentido religioso de conversão, mas o texto não explicita aqui esse valor; 'voltarão' conserva a amplitude semântica e evita impor uma leitura doutrinária.
- issue: Sentido de οὐ λογίζεται κακίαν
  choice: não leva em conta a maldade
  alternative: não imputa a maldade
  rationale: '''Não imputa'' poderia introduzir um registro jurídico-teológico mais específico que o contexto não exige; a opção escolhida preserva a afirmação forte sem resolver sua tensão com a responsabilidade pelas más ações.'
- issue: Sentido de σάρξ
  choice: carne
  alternative: fracos seres humanos
  rationale: A tradução formal mantém a tensão antropológica do original, sem converter 'carne' diretamente em uma interpretação sobre fraqueza ou pecaminosidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período foi dividido em duas frases para clareza, sem alterar a progressão lógica. O tratamento plural 'vocês' torna explícito o referente plural dos verbos e pronomes gregos.
