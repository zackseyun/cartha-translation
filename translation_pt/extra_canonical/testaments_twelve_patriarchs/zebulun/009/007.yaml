revisions:
- from: E, depois dessas coisas, quando vocês se lembrarem do Senhor, voltarão, e ele terá misericórdia de vocês, pois é misericordioso e compassivo. Ele não leva em conta a maldade dos filhos dos homens, porque são carne e se desviam em suas más ações.
  to: E, depois dessas coisas, quando vocês se lembrarem do Senhor, voltarão, e ele terá misericórdia de vocês, pois é misericordioso e compassivo e não lhes leva em conta a maldade, porque são carne e se extraviam em suas más práticas.
  rationale: A revisão explicita em português o destinatário do verbo «levar em conta», correspondente ao dativo grego, sem decidir além do texto se se trata de imputação jurídica, punição ou simples consideração. Também ajusta a formulação final para refletir com maior naturalidade o extravio nas práticas más. A frase única preserva a cadeia coordenada do original.
