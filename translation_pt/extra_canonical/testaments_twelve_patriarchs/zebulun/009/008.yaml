  text: 8. Καὶ μετὰ ταῦτα⁴⁵ ἀνατελεῖ⁴⁶ ⌜ὑμῖν⌝ *αὐτὸς ὁ⁴⁷ Κύριος, *φῶς δικαιοσύνης⁴⁸,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/008.yaml
  text: And after these things the Lord himself will rise for you, the light of righteousness.
translation:
  language: pt
  text: E, depois dessas coisas, o próprio Senhor surgirá para vocês, luz de justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: se levantará
  rationale: Preserva a imagem de surgir/erguer-se, compatível com o uso do verbo para o despontar de um astro ou de uma luz, sem explicitar além do grego se a imagem é de nascer, aparecer ou levantar-se.
- source_word: ὑμῖν
  choice: para vocês
  rationale: Expressa naturalmente o dativo de benefício em português moderno; a leitura está assinalada como editorialmente delimitada no texto grego, mas integra o texto apresentado.
- source_word: φῶς δικαιοσύνης
  choice: luz de justiça
  rationale: Mantém a construção genitiva e sua possível riqueza semântica, sem transformá-la em 'luz justa' nem resolver se justiça descreve origem, caráter ou efeito.
theological_decisions:
- issue: Relação entre 'o próprio Senhor' e 'luz de justiça'
  choice: Manter 'luz de justiça' em aposição a 'o próprio Senhor'
  alternative: Inserir 'como uma luz de justiça'
  rationale: O grego apresenta φῶς δικαιοσύνης sem partícula comparativa; a tradução conserva a identificação metafórica direta e evita enfraquecê-la.
- issue: Sentido escatológico ou messiânico de ἀνατελεῖ
  choice: Traduzir a imagem verbal sem identificar explicitamente o referente com uma doutrina específica
  alternative: Traduzir como 'aparecerá' ou acrescentar uma identificação messiânica
  rationale: O próprio texto nomeia 'o Senhor', mas não desenvolve aqui uma identificação confessional adicional; convém preservar a tensão e a imagem do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência brasileira em 'vocês'. A vírgula antes de 'luz de justiça' conserva a aposição concisa do grego.
