  text: And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses.
translation:
  language: pt
  text: E os seus inimigos levarão vocês cativos, e vocês serão maltratados entre as nações, em meio a muitas fraquezas e aflições.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμαλωτεύσουσιν
  choice: levarão vocês cativos
  rationale: Expressa naturalmente em português o sentido futuro de capturar e conduzir ao cativeiro.
- source_word: κακωθήσεσθε
  choice: vocês serão maltratados
  rationale: Preserva a voz passiva e o sentido amplo de sofrer dano ou maus-tratos, sem especificar indevidamente o agente.
- source_word: ἐν ἔθνεσιν
  choice: entre as nações
  rationale: Verte a expressão locativa de modo claro e mantém o plural do grego.
- source_word: ἀσθενείαις
  choice: fraquezas
  rationale: Mantém o sentido abrangente de debilidades ou enfermidades, sem restringi-lo apenas a doenças físicas.
- source_word: θλίψεσιν
  choice: aflições
  rationale: Comunica pressão, sofrimento e tribulação em registro digno e corrente.
