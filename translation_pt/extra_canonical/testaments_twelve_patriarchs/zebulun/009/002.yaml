base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/002.yaml
  text: But if they are divided into many parts, the earth destroys them, and they become easy to despise.
translation:
  language: pt
  text: Mas, se forem divididos em muitas partes, a terra os faz desaparecer, e eles se tornam fáceis de desprezar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς πολλὰ διαιρεθῶσιν
  choice: forem divididos em muitas partes
  rationale: Reproduz a construção condicional e preserva o sentido amplo de πολλά, sem especificar interpretativamente “correntes” ou outro referente não expresso.
- source_word: ἡ γῆ
  choice: a terra
  rationale: Equivalente direto e natural de γῆ neste contexto.
- source_word: ἀφανίζει
  choice: faz desaparecer
  rationale: Expressa o valor causativo de ἀφανίζω com naturalidade, sem introduzir a imagem não explícita de “engolir” nem restringir o verbo a destruição física.
- source_word: εὐκαταφρόνητα
  choice: desprezíveis
  rationale: Comunica de modo idiomático que passam a ser facilmente tratados com desprezo; evita a formulação menos natural “fáceis de desprezar”.
