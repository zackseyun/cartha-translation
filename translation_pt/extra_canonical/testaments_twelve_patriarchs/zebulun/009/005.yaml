base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/005.yaml
  text: For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow after two kingdoms, and you will commit every abomination.
translation:
  language: pt
  text: Pois aprendi, no escrito de meus antepassados, que vocês serão divididos em Israel, seguirão dois reinos e cometerão toda espécie de abominação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: soube
  rationale: Expressa o aoristo de γινώσκω como aquisição de conhecimento, de modo natural em português.
- source_word: ἐν γραφῇ τῶν πατέρων μου
  choice: pelos escritos de meus pais
  rationale: O singular coletivo γραφῇ pode referir-se ao registro escrito; o plural 'escritos' soa natural e coincide com o sentido contextual sem sugerir necessariamente a Escritura canônica.
- source_word: Διαιρεθήσεσθε
  choice: serão divididos
  rationale: Mantém a forma passiva e a ideia de divisão interna anunciada pelo texto.
- source_word: ἐξακολουθήσετε
  choice: seguirão
  rationale: Verbo natural que preserva a ideia de aderir ou acompanhar o curso dos dois reinos; 'seguir atrás de' seria artificial neste contexto.
- source_word: πᾶν βδέλυγμα ποιήσετε
  choice: cometerão toda espécie de abominação
  rationale: Em português, 'cometer abominação' é idiomático; 'toda espécie de' comunica o valor abrangente de πᾶν sem a rigidez de 'toda abominação'.
theological_decisions:
- issue: Identidade dos 'dois reinos'
  choice: Manter apenas 'dois reinos'
  alternative: Explicitar os reinos de Israel e Judá
  rationale: O grego não os identifica neste versículo; a tradução preserva a referência histórica implícita sem acrescentar interpretação.
- issue: Sentido de βδέλυγμα
  choice: abominação
  alternative: prática detestável
  rationale: '''Abominação'' conserva o peso religioso e moral do termo grego sem restringi-lo a uma categoria específica.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por 'vocês'. A redação conserva a sequência profética e o paralelismo das três orações.
