  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/001.yaml
  text: Therefore pay attention to the waters, and understand that when they flow together to the same place, they carry down stones, wood, earth, and various other things.
translation:
  language: pt
  text: Portanto, prestem atenção às águas e compreendam que, quando correm juntas para o mesmo lugar, arrastam pedras, madeira, terra e várias outras coisas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: observem
  rationale: Imperativo plural que transmite atenção cuidadosa, em linguagem natural e digna.
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: correm juntas para o mesmo lugar
  rationale: No contexto de águas, «correm» expressa naturalmente o movimento; «juntas para o mesmo lugar» conserva a ideia de convergência presente na expressão grega.
- source_word: κατασύρουσιν
  choice: arrastam
  rationale: Reproduz o sentido de levar para baixo ou consigo pela força da corrente, sem tornar a frase artificial.
- source_word: ξύλα
  choice: madeira
  rationale: O plural grego pode designar pedaços ou materiais de madeira; o coletivo português preserva a generalidade da enumeração.
- source_word: ἕτερά τινα
  choice: várias outras coisas
  rationale: Mantém a referência indefinida a outros elementos além dos enumerados.
