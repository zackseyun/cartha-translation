  text: 4. ΓΜὴ οὖν˥¹⁵ *χωρισθῆτε ἐν δυσὶ κεφαλαῖς¹⁶. ὅτι πᾶν ὃ ἐποίησεν ὁ¹⁷ Κύριος κεφαλὴν μίαν κέκτηται¹⁸, *καὶ ὤμους δύο, χεῖρας δύο, πόδας δύο καὶ τὰ λοιπὰ μέλη ἅπαντα¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/004.yaml
  text: Therefore do not be divided into two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members.
translation:
  language: pt
  text: Portanto, não se dividam em duas cabeças, pois tudo o que o Senhor fez tem uma só cabeça, dois ombros, duas mãos, dois pés e todos os demais membros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: se dividam em duas cabeças
  rationale: Reproduz de modo natural a imagem explícita do grego, sem introduzir a ideia interpretativa de estar «sob» duas lideranças.
- source_word: κεφαλὴν μίαν κέκτηται
  choice: tem uma só cabeça
  rationale: «Tem» comunica com clareza o sentido de posse de κέκτηται; «uma só» ressalta o contraste com «duas cabeças».
- source_word: τὰ λοιπὰ μέλη ἅπαντα
  choice: todos os demais membros
  rationale: Mantém tanto a totalidade expressa por ἅπαντα quanto o sentido corporal de μέλη.
theological_decisions:
- issue: Sentido metafórico de «duas cabeças»
  choice: Preservar a metáfora sem explicá-la no corpo do texto
  alternative: Traduzir interpretativamente como «não sigam duas lideranças» ou «não tenham a mente dividida»
  rationale: O grego apresenta a imagem anatômica e desenvolve-a com ombros, mãos, pés e demais membros; explicitar uma interpretação eliminaria a ambiguidade e a tensão da exortação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração foi mantida compacta e paralela ao original.
