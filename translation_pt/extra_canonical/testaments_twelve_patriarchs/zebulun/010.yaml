base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010.yaml
  text: 'And you will return to your land, and you will see him in Jerusalem because of his holy name; and healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deceit will be trampled down. And he will turn all the nations to zeal for him, and you will see God in the form of a man, whom the Lord will choose—Jerusalem is his name.


    9. And again, by the craftiness of your deeds you will provoke him to anger, and you will be cast away from him until the time of completion.


    10. And now, my children, do not be grieved because I am dying, nor fall down in sorrow because I am coming to my end. For I will rise again in your midst, as a ruler in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, all who keep the law of the Lord. But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations. But as for me, I now hasten to my rest, as also my fathers did. But you, fear the Lord all the days of your life with all your strength.


    And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.'
translation:
  language: pt
  text: 'E vocês voltarão para a sua terra e o verão em Jerusalém, por causa do santo nome dele;[a] e haverá cura e compaixão em suas asas. Ele mesmo resgatará do poder de Beliar todos os filhos dos homens mantidos em cativeiro, e todo espírito de engano será esmagado. Ele fará todas as nações se voltarem para o zelo por ele,[b] e vocês verão Deus em forma humana, aquele a quem o Senhor escolher — Jerusalém é o nome dele.[c]


    9. E novamente, com a astúcia de suas obras, vocês o provocarão à ira e serão rejeitados por ele até o tempo da consumação.


    10. E agora, meus filhos, não fiquem tristes porque estou morrendo, nem se deixem abater de tristeza porque estou chegando ao fim. Pois ressuscitarei no meio de vocês, como governante entre os filhos da justiça, e me alegrarei no meio da minha tribo: os que guardarem a lei do Senhor.[d] Mas sobre os ímpios o Senhor fará vir fogo eterno e os destruirá por gerações de gerações. Quanto a mim, agora me apresso para o meu descanso, como também fizeram meus pais. Vocês, porém, temam o Senhor.[e]


    Depois de dizer essas coisas, ele adormeceu, e seus filhos o colocaram num caixão de madeira.[f] Mais tarde, transportaram-no e o sepultaram em Hebrom, junto de seus pais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cláusula “por causa do santo nome dele” aparece entre colchetes na edição. As frases desde “e haverá cura” até “Jerusalém é o nome dele” aparecem como expansões na tradição textual representada pelos manuscritos b, d e g.
    reason: Distingue a cláusula textual entre colchetes das expansões que a edição identifica explicitamente como próprias de b, d e g.
  - marker: b
    text: 'Ou: “para a emulação dele” ou “para o ciúme por causa dele”. O termo grego pode expressar zelo, rivalidade ou ciúme.'
    reason: Preserva a amplitude semântica de παραζήλωσις sem fixar uma única interpretação.
  - marker: c
    text: A construção grega é difícil. Também pode ser pontuada ou relacionada de outras maneiras, sobretudo quanto a “Jerusalém” e a “nome”.
    reason: Evita apresentar como inequívoca uma sintaxe textual genuinamente obscura.
  - marker: d
    text: 'Alguns testemunhos acrescentam: “e os mandamentos de Zebulom, pai deles”.'
    reason: Registra a frase colocada entre colchetes na edição crítica.
  - marker: e
    text: 'Alguns testemunhos trazem a forma ampliada: “temam o Senhor, nosso Deus, com toda a sua força, todos os dias da sua vida”.'
    reason: Registra a expansão entre colchetes sem incorporá-la silenciosamente ao texto principal.
  - marker: f
    text: Alguns testemunhos dizem que ele “adormeceu um bom sono”.
    reason: Registra a leitura adicional indicada como textual e possivelmente corrompida na edição.
lexical_decisions:
- source_word: εὐσπλαγχνία
  choice: compaixão
  rationale: Expressa de modo corrente a misericórdia profunda ou ternura evocada pelo termo grego.
- source_word: λυτρώσεται
  choice: resgatará
  rationale: Mantém a ideia de libertação mediante resgate sem impor uma formulação soteriológica denominacional.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Preserva a forma do nome próprio encontrada no texto grego desta obra, em vez de harmonizá-la com outras tradições textuais.
- source_word: παραζήλωσιν
  choice: zelo por ele
  rationale: Segue o sentido adotado pelo texto de consulta, mas uma nota registra a amplitude semântica de zelo, emulação e ciúme.
- source_word: ἐν σχήματι ἀνθρώπου
  choice: em forma humana
  rationale: É português natural e conserva a afirmação direta do grego sem explicá-la teologicamente.
- source_word: καιροῦ συντελείας
  choice: tempo da consumação
  rationale: Preserva a linguagem escatológica e a abertura do grego quanto à natureza exata dessa conclusão.
- source_word: ἀναστήσομαι
  choice: ressuscitarei
  rationale: No contexto de sua morte iminente e futura presença entre os justos, traduz diretamente o valor de levantar-se dentre os mortos.
- source_word: ἡγούμενος
  choice: governante
  rationale: Comunica liderança com autoridade e acompanha a revisão adjudicada do texto de consulta.
- source_word: ἀποτρέχω
  choice: me apresso para
  rationale: Conserva a noção de partir prontamente, evitando a estranheza de uma tradução literal como 'corro para longe'.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Mantém o eufemismo antigo para a morte, coerente com o contexto funerário imediato.
- source_word: θήκην ξυλίνην
  choice: caixão de madeira
  rationale: Traduz naturalmente o recipiente funerário indicado pela expressão grega.
theological_decisions:
- issue: Deus em forma humana
  choice: vocês verão Deus em forma humana
  alternative: vocês verão um deus na forma de homem
  rationale: θεόν não tem artigo, mas em construções predicativas e contextos monoteístas isso não exige sentido indefinido; a tradução preserva a formulação forte sem identificar explicitamente a figura com personagem posterior.
- issue: Ressurreição de Zebulom
  choice: ressuscitarei no meio de vocês
  alternative: voltarei a me levantar no meio de vocês
  rationale: O contexto de morte e descanso favorece ressurreição, mas não se acrescenta explicação sobre seu modo ou momento.
- issue: Fogo eterno e duração da destruição
  choice: fogo eterno e os destruirá por gerações de gerações
  alternative: fogo perpétuo e os fará perecer até as gerações das gerações
  rationale: Mantém lado a lado as duas expressões temporais do grego, sem resolver sua relação nem convertê-las em uma formulação doutrinária sistemática.
- issue: Identidade e nome da figura escolhida
  choice: aquele a quem o Senhor escolher — Jerusalém é o nome dele
  alternative: aquele que o Senhor escolher em Jerusalém; esse será o seu nome
  rationale: A sintaxe transmitida é difícil e admite diferentes relações para 'Jerusalém'; o texto principal segue a leitura da camada auditada, e a nota explicita a incerteza textual.
translation_notes:
  register: Português contemporâneo, digno e de leitura ampla, com pronomes de terceira pessoa plural (“vocês”) para clareza brasileira e inteligibilidade internacional. Mantiveram-se expressões semíticas e apocalípticas importantes, como “filhos da justiça”, “fogo eterno” e “gerações de gerações”, enquanto construções narrativas foram naturalizadas. As expansões e dificuldades textuais foram sinalizadas em notas, sem harmonização confessional.
