source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: VIII. Καὶ ὑμεῖς οὖν, τέκνα μου, ἔχετε εὐσπλαγχνίαν *κατὰ παντὸς ἀνθρώπου¹ ἐν ἐλέει, ἵνα καὶ ὁ Κύριος *εἰς ὑμᾶς σπλαγχνισθεὶς² ἐλεήσῃ ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/001.yaml
  text: And so, my children, have compassion toward every person in mercy, so that the Lord also, having compassion on you, may show you mercy.
translation:
  language: pt
  text: Portanto, também vocês, meus filhos, tenham compaixão de todas as pessoas, com misericórdia, para que também o Senhor, compadecendo-se de vocês, tenha misericórdia de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνίαν
  choice: compaixão
  rationale: Expressa de modo natural e digno a profunda compaixão indicada pelo substantivo grego.
- source_word: κατὰ παντὸς ἀνθρώπου
  choice: de todas as pessoas
  rationale: Comunica a abrangência universal da expressão grega e evita que o singular português pareça limitar a referência a um indivíduo.
- source_word: ἐν ἐλέει
  choice: com misericórdia
  rationale: Em português corrente, a construção instrumental ou modal com “com” transmite naturalmente que a compaixão deve ser exercida de maneira misericordiosa.
- source_word: σπλαγχνισθεὶς
  choice: compadecendo-se
  rationale: Preserva a relação lexical e conceitual com “compaixão”, mantendo a ação participial sem sugerir anterioridade concluída.
- source_word: ἐλεήσῃ
  choice: tenha misericórdia
  rationale: Mantém a repetição intencional da linguagem de misericórdia e o valor final da oração introduzida por ἵνα.
theological_decisions:
- issue: Relação entre a misericórdia humana e a misericórdia do Senhor
  choice: Preservar a construção final “para que...”, sem explicar a natureza dessa relação
  alternative: Reformular como simples comparação, promessa automática ou condição meritória
  rationale: O grego estabelece uma relação explícita por meio de ἵνα, mas não define aqui se ela é causal, condicional, pedagógica ou retributiva; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “compaixão/compadecendo-se” e “misericórdia” foi mantida por refletir o paralelismo e a ênfase do grego.
