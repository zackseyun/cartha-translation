source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Εἰς¹⁴ ὃν *προσέχοντες καὶ ὑμεῖς, τέκνα μου ἀγαπᾶτε ἀλλήλους¹⁵, καὶ μὴ λογίζεσθε¹⁶ ἕκαστος *κακίαν πρὸς τὸν ἀδελφὸν¹⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/005.yaml
  text: Paying attention to him, you also, my children, love one another, and let each one not reckon evil against his brother.
translation:
  language: pt
  text: 5 Atentos a ele, vocês também, meus filhos, amem uns aos outros e não considerem maldade, cada um contra seu irmão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰς ὃν προσέχοντες
  choice: Tendo-o como exemplo
  rationale: Expressa de modo natural a ideia de voltar a atenção para ele e orientar a própria conduta por ele, sem acrescentar um conectivo ausente no grego.
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: amem uns aos outros
  rationale: Equivalência direta, clara e corrente do imperativo grego.
- source_word: μὴ λογίζεσθε ... κακίαν πρὸς
  choice: ninguém fique pensando no mal contra
  rationale: Preserva a dimensão mental de λογίζεσθε e a orientação hostil indicada por πρὸς, em português compreensível.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Mantém a formulação relacional e distributiva do original.
theological_decisions:
- issue: Referente do pronome ὃν
  choice: Mantido como «o», sem identificar explicitamente a pessoa
  alternative: Substituir o pronome pelo nome do referente no contexto anterior
  rationale: O versículo grego usa pronome; explicitar o nome aqui resolveria uma referência que o próprio texto deixa dependente do contexto.
- issue: Sentido de λογίζεσθε κακίαν
  choice: «fique pensando no mal contra»
  alternative: «planeje o mal contra» ou «atribua maldade a»
  rationale: A expressão admite matizes de considerar, alimentar ou tramar o mal. A tradução retém a atividade interior sem restringi-la apenas a um plano deliberado ou a uma imputação.
translation_notes:
  register: Português moderno, digno e acessível, com forma de tratamento plural natural ao público brasileiro. «Meus filhos» conserva o tom paterno; «ninguém» torna idiomática a construção distributiva grega.
