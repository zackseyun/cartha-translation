  rationale: A revisão limita-se a restaurar o presente de κατοικεῖ (“habita”), preservando o contraste formal com o futuro anterior (“enviará”). Mantém-se “ali” para refletir a construção locativa introduzida por ὅπου sem resolver de modo indevido o possível alcance pessoal de ἐν αὐτῷ. A nota é ajustada para descrever com precisão o que a tradução faz.
