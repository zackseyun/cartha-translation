  source_fidelity: 'A tradução comunica adequadamente a imagem central: Deus enviará a sua compaixão e habita onde encontra misericórdia. Contudo, κατοικεῖ está no presente no grego e deve ser mantido em português, como também faz a trilha inglesa. A mudança para o futuro elimina a mudança aspectual/temporal do original.'
  naturalness: O texto é claro e de registro apropriado. “Entranhas de misericórdia” é deliberadamente incomum, mas a nota explica bem a metáfora concreta; “ali habita” permanece natural em contexto solene.
  terminology: “Compaixão” traduz adequadamente τὰ σπλάγχνα na primeira ocorrência. A expressão literal “entranhas de misericórdia” na segunda ocorrência conserva a imagem de σπλάγχνα e a associação explícita com ἔλεος. A nota deve evitar afirmar que a repetição lexical foi preservada integralmente na tradução, pois a primeira ocorrência foi traduzida semanticamente.
  issues:
  - severity: medium
    issue: 'O verbo final foi vertido no futuro: “ali habitará”.'
    rationale: O grego tem κατοικεῖ, presente (“habita”). Embora possa ocorrer numa moldura escatológica, não é necessário nem preferível converter o presente em futuro; a manutenção do presente preserva a formulação da fonte e da tradução inglesa auditada.
  - severity: low
    issue: A justificativa da nota afirma que a repetição significativa de σπλάγχνα é preservada.
    rationale: A primeira ocorrência é traduzida por “compaixão”, não por “entranhas”; portanto, a repetição lexical não é preservada literalmente no texto português. A nota pode explicar a imagem sem essa afirmação.
  revised_text: Pois, de fato, nos últimos dias Deus enviará a sua compaixão sobre a terra e, onde encontrar entranhas de misericórdia,[a] ali habita.
