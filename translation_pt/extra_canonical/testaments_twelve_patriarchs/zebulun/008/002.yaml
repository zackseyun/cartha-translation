source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ὅτι καίγε³ ἐπʼ ἐσχάτων τῶν⁴ ἡμερῶν ὁ Θεὸς ἀποστελεῖ⁵ *τὰ σπλάγχνα⁶ αὐτοῦ ἐπὶ τῆς⁷ γῆς, καὶ ὅπου εὕρῃ σπλάγχνα ἐλέους, ἐν αὐτῷ κατοικεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/002.yaml
  text: For indeed in the last days God will send his compassion upon the earth, and wherever he finds compassion of mercy, there he dwells.
translation:
  language: pt
  text: Pois, de fato, nos últimos dias Deus enviará a sua compaixão sobre a terra e, onde encontrar entranhas de misericórdia,[a] ali habita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “entranhas de misericórdia”; expressão que indica misericórdia profunda e visceral.
    reason: A expressão é incomum no português moderno, mas conserva nesta ocorrência a imagem concreta de σπλάγχνα e sua associação com ἔλεος.
lexical_decisions:
- source_word: τὰ σπλάγχνα αὐτοῦ
  choice: a sua compaixão
  rationale: Embora σπλάγχνα designe literalmente as entranhas, aqui funciona como metáfora da compaixão profunda; a tradução natural comunica esse sentido sem obscurecer a imagem na ocorrência seguinte.
- source_word: σπλάγχνα ἐλέους
  choice: entranhas de misericórdia
  rationale: Preserva a expressão corporal e enfática do grego, bem como a distinção entre σπλάγχνα e ἔλεος, ainda que seja menos idiomática em português.
- source_word: κατοικεῖ
  choice: habitará
  rationale: O presente grego pode ter valor futuro no contexto escatológico iniciado por ἀποστελεῖ; o futuro em português mantém a sequência temporal natural.
theological_decisions:
- issue: Local da habitação divina em ἐν αὐτῷ
  choice: ali habitará
  alternative: nele habitará
  rationale: O antecedente pode ser entendido como o lugar onde Deus encontra misericórdia ou como a pessoa que a possui. “Ali” preserva melhor a formulação locativa de ὅπου sem restringir explicitamente a referência a uma pessoa masculina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A primeira ocorrência de σπλάγχνα é vertida pelo sentido idiomático “compaixão”; a segunda conserva a metáfora, esclarecida em nota, para manter a força e a repetição lexical do grego.
