source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 3. Ὅσον γὰρ⁸ ἄνθρωπος σπλαγχνίζεται εἰς *τὸν πλησίον αὐτοῦ⁹, τοσοῦτον *καὶ ὁ⁴ Κύριος εἰς αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/003.yaml
  text: For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.
translation:
  language: pt
  text: Pois, na mesma medida em que uma pessoa tem compaixão do seu próximo, também o Senhor tem compaixão dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅσον ... τοσοῦτον
  choice: na mesma medida em que ... também
  rationale: Reproduz de modo natural em português a correlação proporcional do grego.
- source_word: ἄνθρωπος
  choice: uma pessoa
  rationale: Neste contexto, o termo é genérico e se refere a qualquer ser humano, não especificamente a um homem do sexo masculino.
- source_word: σπλαγχνίζεται
  choice: tem compaixão
  rationale: Expressa o sentido de compaixão profunda e corresponde claramente à repetição do mesmo verbo nas duas orações.
- source_word: τὸν πλησίον αὐτοῦ
  choice: seu próximo
  rationale: Preserva a formulação ética tradicional e o sentido relacional do grego.
- source_word: Κύριος
  choice: Senhor
  rationale: Mantém o título divino convencional, sem acrescentar uma identificação não explicitada no versículo.
- source_word: εἰς αὐτόν
  choice: dela
  rationale: Retoma de maneira natural e inequívoca a pessoa mencionada no início da frase.
theological_decisions:
- issue: Relação proporcional entre a compaixão humana e a do Senhor
  choice: 'Preservar a formulação proporcional: “na mesma medida em que... também”.'
  alternative: Atenuar para uma simples correspondência, como “quando alguém... o Senhor também...”.
  rationale: O par ὅσον... τοσοῦτον apresenta explicitamente uma relação de medida; a tradução não deve eliminar essa tensão teológica nem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “tem compaixão” foi mantida para refletir o paralelismo do original.
