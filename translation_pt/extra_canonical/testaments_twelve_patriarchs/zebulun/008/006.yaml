base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/006.yaml
  text: For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.
translation:
  language: pt
  text: Pois isso rompe a unidade, dispersa todo laço de parentesco, perturba a alma e desfigura o rosto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρίζει ἑνότητα
  choice: rompe a unidade
  rationale: Expressa naturalmente a ideia de separar ou desfazer a unidade, sem tornar a frase artificial em português.
- source_word: πᾶσαν συγγένειαν διασκορπίζει
  choice: dispersa todo laço de parentesco
  rationale: συγγένεια pode indicar parentesco ou vínculo entre parentes; “laço de parentesco” comunica o sentido relacional, enquanto “dispersa” preserva a imagem verbal.
- source_word: τὴν ψυχὴν ταράσσει
  choice: perturba a alma
  rationale: Tradução direta e corrente, preservando ψυχή como “alma” e o sentido de agitação de ταράσσω.
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: desfigura o rosto
  rationale: No contexto, ἀφανίζω aplicado ao rosto sugere arruinar ou desfigurar sua aparência; esta formulação é clara e digna em português.
