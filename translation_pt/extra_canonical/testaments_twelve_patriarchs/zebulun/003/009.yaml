  text: For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner before King Pharaoh.
translation:
  language: pt
  text: Pois, quando chegaram ao Egito, os servos de José lhes tiraram as sandálias do lado de fora do portão. Então, os que haviam chegado se prostraram diante de José, conforme o costume diante do rei Faraó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: «segundo o modelo do rei Faraó»; a relação exata entre o «modelo» e o rei é concisa e pode indicar a maneira costumeira de se prostrar diante dele.'
    reason: Preserva a ambiguidade sintática de κατὰ τὸν τύπον βασιλέως Φαραώ sem produzir uma frase obscura no texto principal.
lexical_decisions:
- source_word: ὑπελύθησαν
  choice: lhes tiraram as sandálias
  rationale: O verbo, aqui na voz passiva e em contexto de entrada, indica descalçar ou retirar as sandálias; a construção portuguesa explicita naturalmente o objeto implícito.
- source_word: παίδων
  choice: servos
  rationale: Neste contexto, designa os servos ou assistentes de José, não necessariamente crianças ou filhos.
- source_word: προσεκύνησαν
  choice: se prostraram diante de
  rationale: Expressa um gesto corporal de reverência prestado a uma autoridade humana, sem acrescentar a ideia específica de culto religioso.
- source_word: πυλῶνος
  choice: portão
  rationale: Refere-se ao grande portão ou entrada de um edifício ou complexo; «portão» é claro e corrente.
- source_word: κατὰ τὸν τύπον
  choice: conforme o costume
  rationale: Comunica a ideia de agir segundo um padrão ou modo estabelecido, com português natural, sem eliminar a dificuldade sintática da expressão completa.
theological_decisions:
- issue: Sentido de προσκυνέω diante de José
  choice: se prostraram diante de José
  alternative: adoraram José
  rationale: O referente humano e o cenário cortesão indicam homenagem ou submissão corporal; «adoraram» imporia uma leitura cultual que o contexto não exige.
- issue: Relação de κατὰ τὸν τύπον com «rei Faraó»
  choice: conforme o costume diante do rei Faraó
  alternative: segundo o modelo do rei Faraó
  rationale: A formulação principal acompanha o sentido cortesão provável, enquanto a nota registra a forma mais literal e a concisão ambígua do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Rei Faraó» conserva a forma incomum do original, e a divisão em duas frases melhora a clareza sem alterar a sequência narrativa.
