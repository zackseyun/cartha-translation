  text: And when Joseph saw me weeping with him, and the brothers coming on to kill him, he took refuge behind me, begging me for help on his behalf.
translation:
  language: pt
  text: Quando José viu que eu chorava com ele e que os irmãos se aproximavam para matá-lo, refugiou-se atrás de mim, suplicando que eu o ajudasse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνκλαίοντά μοι
  choice: eu chorava com ele
  rationale: Expressa de modo natural a ideia de chorar juntamente com alguém, preservando a solidariedade de Zebulom com José.
- source_word: ἐπερχομένους
  choice: se aproximavam
  rationale: Comunica o avanço dos irmãos contra José sem acrescentar detalhes não presentes no grego.
- source_word: κατέφυγον ὄπισθεν μου
  choice: refugiou-se atrás de mim
  rationale: Mantém a imagem concreta de José buscando proteção atrás de Zebulom.
- source_word: δεόμενος τῆς πρὸς αὐτὸν βοηθείας
  choice: suplicando que eu o ajudasse
  rationale: Formulação portuguesa clara e idiomática que conserva o pedido urgente de auxílio em favor do próprio José.
