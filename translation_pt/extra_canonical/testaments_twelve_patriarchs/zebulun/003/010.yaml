base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/010.yaml
  text: And not only did they bow down to him, but they also immediately fell before him and spat, and they were put to shame by the Egyptians.
translation:
  language: pt
  text: E não apenas se prostraram diante dele, mas também foram imediatamente alvo de cusparadas, ao caírem diante dele, e foram envergonhados pelos egípcios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεκύνησαν
  choice: se prostraram diante dele
  rationale: O verbo pode expressar reverência física ou adoração; neste contexto narrativo, a formulação concreta preserva o gesto sem acrescentar uma interpretação cultual.
- source_word: ἐνεπτύσθησαν
  choice: foram alvo de cusparadas
  rationale: 'A forma grega é aoristo passivo, terceira pessoa do plural: eles receberam as cusparadas. Esta formulação é mais natural em português do que o literalismo ''foram cuspidos''.'
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Reproduz o valor temporal do advérbio.
- source_word: ἠσχύνθησαν
  choice: envergonhados
  rationale: Mantém o passivo e o sentido de serem expostos à vergonha ou humilhação.
- source_word: παρὰ τῶν Αἰγυπτίων
  choice: pelos egípcios
  rationale: Com verbo passivo, παρά com genitivo indica os agentes da ação.
theological_decisions:
- issue: Sentido de προσκυνέω
  choice: se prostraram diante dele
  alternative: o adoraram
  rationale: O grego admite reverência prestada a uma pessoa, e o contexto destaca a postura corporal; 'adoraram' poderia impor uma leitura teológica mais específica.
- issue: Voz de ἐνεπτύσθησαν
  choice: foram alvo de cusparadas
  alternative: cuspiram
  rationale: A desinência -θησαν marca aqui a voz passiva. A tradução segue diretamente a forma grega, embora a camada inglesa revisada a tenha entendido como ativa.
- issue: Agência dos egípcios
  choice: ligada explicitamente a 'envergonhados' e, pela coordenação, possivelmente também às cusparadas
  alternative: repetir 'pelos egípcios' após ambos os passivos
  rationale: A posição de παρὰ τῶν Αἰγυπτίων o liga de modo mais imediato a ἠσχύνθησαν; a redação portuguesa preserva a coordenação sem afirmar mais do que o texto.
translation_notes:
  register: Português atual, digno e de leitura ampla. 'À sua frente' evita a repetição pesada de 'diante dele', enquanto 'foram alvo de cusparadas' comunica com naturalidade a voz passiva do grego.
