base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/006.yaml
  text: saying, “We will not eat it, because it is the price of our brother’s blood; rather, let us trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”
translation:
  language: pt
  text: 'dizendo: “Não comeremos essa quantia, porque é o preço do sangue do nosso irmão. Em vez disso, vamos pisá-la, pois ele disse que reinaria sobre nós; então veremos o que são os sonhos dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ φαγόμεθα αὐτήν
  choice: Não gastaremos esse dinheiro em comida
  rationale: O pronome feminino retoma τιμή, o valor ou preço recebido. A formulação comunica em português natural a ideia literal de não ‘comer’ o preço, isto é, não empregá-lo em alimento, sem perder sua ligação com o dinheiro mencionado no contexto.
- source_word: τιμὴ ... αἵματος
  choice: preço do sangue
  rationale: Mantém a expressão concreta e moralmente carregada do grego, que caracteriza o pagamento como proveniente do sangue do irmão.
- source_word: καταπατήσωμεν αὐτήν
  choice: vamos pisá-lo
  rationale: 'Reproduz o subjuntivo exortativo e conserva o jogo concreto do contexto: o preço foi convertido em calçados e, assim, seria pisado.'
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: reinaria sobre nós
  rationale: Expressa diretamente a alegação atribuída ao irmão, preservando a ideia de domínio régio.
- source_word: ἴδωμεν τί ἐστι τὰ ἐνύπνια αὐτοῦ
  choice: então veremos no que darão os sonhos dele
  rationale: Formulação idiomática que conserva o tom desafiador e a incerteza quanto ao resultado ou à validade dos sonhos, sem reduzi-los apenas ao seu significado.
