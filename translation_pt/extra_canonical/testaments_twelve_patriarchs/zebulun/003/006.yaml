  naturalness: A redação revista permanece clara e idiomática em português moderno. «Não a comeremos» conserva deliberadamente a formulação concreta e hostil do discurso, sem explicar o sentido figurado no próprio texto.
  terminology: «Preço do sangue do nosso irmão», «reinaria sobre nós» e o exortativo «vamos pisá-la» refletem adequadamente os termos e o tom do grego. «Quantia» fornece um antecedente feminino natural para os pronomes, em concordância com τιμή.
