  text: And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits, which our fathers dug and found no water.”
translation:
  language: pt
  text: 'Enquanto isso, Rúben se levantou e disse: “Venham, meus irmãos! Não o matemos; em vez disso, vamos lançá-lo em uma destas cisternas secas, que nossos pais cavaram sem encontrar água.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ μεταξὺ
  choice: Enquanto isso
  rationale: Expressa de modo natural o valor temporal da locução grega, sem tornar excessivamente explícita a conexão marcada por δέ.
- source_word: ἀναστὰς
  choice: se levantou
  rationale: Preserva a ação do particípio aoristo que antecede o verbo de fala.
- source_word: Δεῦτε ἀδελφοί μου
  choice: Venham, meus irmãos!
  rationale: Δεῦτε é um chamado exortativo dirigido ao grupo; “venham” é corrente e mantém a interpelação direta.
- source_word: μὴ ἀποκτείνωμεν
  choice: Não o matemos
  rationale: Mantém a exortação negativa na primeira pessoa do plural.
- source_word: ἀλλὰ ῥίψωμεν
  choice: em vez disso, vamos lançá-lo
  rationale: Reproduz o contraste de ἀλλά e a força exortativa do subjuntivo; “lançar” conserva o sentido concreto de ῥίπτω.
- source_word: ξηρῶν λάκκων
  choice: cisternas secas
  rationale: No contexto de estruturas escavadas em busca ou para obtenção de água, “cisternas” comunica melhor que “poços” ou o genérico “covas”; “secas” preserva ξηρῶν.
- source_word: ὧν ὤρυξαν οἱ πατέρες ἡμῶν, καὶ οὐχ εὗρον ὕδωρ
  choice: que nossos pais cavaram sem encontrar água
  rationale: 'Formulação portuguesa natural que preserva a sequência lógica: eles cavaram as cisternas e não encontraram água.'
