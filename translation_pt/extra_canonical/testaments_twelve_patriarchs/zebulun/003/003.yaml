source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. Διὰ γὰρ τοῦτο ἐκώλυσε ὁ⁴⁴ Κύριος *τοῦ μὴ ἀναβλῦσαι ὕδωρ⁴⁵ ἐν αὐτοῖς ἵνα *γένηται περιποίησις τῷ⁴⁶ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/003.yaml
  text: For this reason the Lord prevented water from springing up in them, so that provision might be made for Joseph, his brother.
translation:
  language: pt
  text: Por isso, o Senhor impediu que a água brotasse neles, para que houvesse provisão para José.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλῦσαι
  choice: brotasse
  rationale: O verbo descreve água que jorra ou surge de baixo; “brotasse” é natural em português e preserva essa imagem.
- source_word: περιποίησις
  choice: provisão
  rationale: Neste contexto, o substantivo indica algo providenciado ou reservado em benefício de José. “Provisão” comunica esse sentido sem reduzi-lo apenas à preservação da vida.
theological_decisions:
- issue: A finalidade da intervenção do Senhor
  choice: “para que houvesse provisão para José”
  alternative: “para que José fosse preservado”
  rationale: A formulação mantém a finalidade expressa por ἵνα e traduz περιποίησις de modo mais direto, sem converter a provisão em uma afirmação teológica mais específica sobre preservação.
translation_notes:
  register: Português moderno, claro e digno. O pronome “neles” preserva a referência anafórica do grego ao elemento mencionado no contexto anterior. A expressão “seu irmão”, presente na camada inglesa, não foi incluída porque não aparece no texto grego fornecido.
