base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/008.yaml
  text: And the brothers of Joseph were not willing to preserve the life of their brother, and the Lord took from them the sandal that they wore against Joseph their brother.
translation:
  language: pt
  text: E os irmãos de José não quiseram preservar a vida de seu irmão[a], e o Senhor lhes tirou a sandália que haviam usado contra José, seu irmão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego desta frase é incerto; literalmente, traz algo como: «não quiseram a vida de seu irmão».'
    reason: Sinalizar a dificuldade textual marcada na edição e distinguir a tradução contextual da forma literal preservada.
  - marker: b
    text: A expressão grega sobre a sandália é incomum e pode também ser entendida como «a sandália que calçaram contra José».
    reason: Preservar a estranheza e a possível leitura mais literal da imagem sem tornar o texto principal artificial.
lexical_decisions:
- source_word: οὐκ ἠθέλησαν †ζωὴν ἀδελφοῦ αὐτῶν
  choice: não quiseram preservar a vida de seu irmão
  rationale: O texto grego transmitido é difícil e parece carecer de um verbo ligado a «vida». «Preservar» expressa com naturalidade o sentido contextual sem reproduzir uma construção portuguesa incompleta.
- source_word: ὑπέλυσεν αὐτοὺς τὸ ὑπόδημα
  choice: lhes tirou a sandália
  rationale: ὑπολύω pode indicar desatar ou retirar aquilo que se calça; nesta construção difícil, «tirou» produz português claro e mantém a ideia concreta de remoção.
- source_word: ὃ ἐφόρεσαν κατὰ Ἰωσὴφ
  choice: que haviam usado contra José
  rationale: Traduz κατὰ pelo sentido adversativo «contra» e conserva a imagem incomum de uma sandália empregada contra José, sem tentar explicá-la no corpo do texto.
theological_decisions:
- issue: Ação do Senhor ao retirar a sandália
  choice: o Senhor lhes tirou a sandália
  alternative: o Senhor desatou-lhes a sandália
  rationale: A formulação mantém a ação divina explícita, sem acrescentar uma interpretação sobre se ela representa juízo, perda, escravidão ou retribuição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a repetição de «irmão» e a imagem enigmática da sandália, enquanto usa «preservar a vida» para tornar inteligível a frase grega textualmente problemática.
