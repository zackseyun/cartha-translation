  text: 5. *Καὶ οἱ ἀδελφοὶ τοῦ Ἰωσὴφ²⁴ οὐκ ἠθέλησαν²⁵ †ζωὴν²⁶ ἀδελφοῦ αὐτῶν²⁷, καὶ ὁ²⁸ Κύριος ὑπέλυσεν²⁹ αὐτοὺς³⁰ τὸ ὑπόδημα³¹ *ὃ ἐφόρεσαν κατὰ Ἰωσὴφ τοῦ ἀδελφοῦ αὐτῶν³².
