  text: 4. Διὰ τοῦτο οὖν¹⁹ ἐν γραφῇ *νόμου Μωσέως γέγραπται²⁰· Τὸν μὴ θέλοντα *ἀναστῆσαι σπέρμα²¹ τῷ ἀδελφῷ αὐτοῦ ὑπολύεσθαι²² τὸ ὑπόδημα αὐτοῦ²³ καὶ ἐμπτύεσθαι εἰς τὸ πρόσωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/007.yaml
  text: 'Therefore it is written in the book of the law of Moses: “The one who does not want to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”'
translation:
  language: pt
  text: 'Por isso, está escrito no livro da Lei de Moisés: “Aquele que não quiser suscitar descendência[a] para seu irmão terá a sandália retirada, e lhe cuspirão no rosto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “suscitar semente”.
    reason: Registra a metáfora do original grego, enquanto o texto principal comunica seu sentido familiar e jurídico em português natural.
lexical_decisions:
- source_word: ἐν γραφῇ νόμου Μωσέως
  choice: no livro da Lei de Moisés
  rationale: Neste contexto, γραφή indica o registro escrito da Lei; “livro” comunica isso de modo natural e corresponde à alusão à legislação mosaica.
- source_word: ἀναστῆσαι σπέρμα
  choice: suscitar descendência
  rationale: Preserva a imagem e o sentido jurídico-familiar de gerar descendência reconhecida em favor do irmão, sem reduzir a expressão simplesmente a “ter filhos”.
- source_word: ὑπολύεσθαι τὸ ὑπόδημα αὐτοῦ
  choice: terá a sandália retirada
  rationale: Mantém a formulação passiva do grego e o ato simbólico prescrito, em português claro e digno.
- source_word: ἐμπτύεσθαι εἰς τὸ πρόσωπον
  choice: lhe cuspirão no rosto
  rationale: Expressa de forma idiomática o sentido da construção grega e conserva a humilhação pública do ato.
theological_decisions:
- issue: Sentido de “suscitar descendência para seu irmão”
  choice: Manter a formulação que atribui a descendência ao irmão
  alternative: “ter filhos com a viúva de seu irmão”
  rationale: O texto fala diretamente de suscitar “semente” para o irmão; explicitar a viúva acrescentaria informação contextual não presente neste versículo.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. O tom permanece digno e próximo da formulação legal citada, sem arcaísmos desnecessários.
