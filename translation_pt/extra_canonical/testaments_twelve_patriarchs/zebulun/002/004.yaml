  text: I do not remember that I committed lawlessness, except for the ignorance that I committed concerning Joseph, in that I assured my brothers not to tell my father what had happened.
translation:
  language: pt
  text: Não me lembro de ter cometido transgressão alguma, exceto o ato de ignorância que cometi no caso de José, pois assegurei aos meus irmãos que não diria a meu pai o que havia acontecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομίαν
  choice: transgressão
  rationale: Expressa a ideia de violação do que é correto ou da lei, sem restringir o termo a uma formulação jurídica ou denominacional.
- source_word: ἄγνοιαν
  choice: ato de ignorância
  rationale: Mantém o substantivo grego e sua caracterização moral, mas acrescenta “ato de” para produzir uma construção natural com “cometi” em português.
- source_word: ἐπὶ τοῦ Ἰωσήφ
  choice: no caso de José
  rationale: A preposição tem valor amplo neste contexto; “no caso de” preserva a referência à conduta relativa a José sem impor se ela foi diretamente contra ele.
- source_word: ἐβεβαίωσα
  choice: confirmei
  rationale: Reproduz o sentido de tornar firme, ratificar ou assegurar um compromisso; o infinitivo seguinte indica que Zebulom confirmou aos irmãos que ele não revelaria o ocorrido.
- source_word: τὸ γενόμενον
  choice: o que havia acontecido
  rationale: Tradução idiomática do particípio substantivado, com o mais-que-perfeito composto situando o acontecimento antes da possível revelação ao pai.
theological_decisions:
- issue: Alcance da afirmação de inocência
  choice: “Não me lembro de ter cometido transgressão alguma”
  alternative: “Não cometi transgressão alguma”
  rationale: A tradução conserva μνήσκομαι, apresentando a declaração como lembrança ou consciência pessoal, e não como afirmação absoluta de impecabilidade.
- issue: Natureza de ἄγνοια
  choice: “ato de ignorância”
  alternative: “pecado involuntário”
  rationale: Evita introduzir explicitamente a categoria teológica de pecado involuntário, que não está formulada no texto, e preserva a tensão entre ignorância e responsabilidade moral.
- issue: Sujeito implícito de μὴ εἰπεῖν
  choice: “que não contaria ao meu pai”
  alternative: “que eles não contariam ao meu pai”
  rationale: A construção com ἐβεβαίωσα e o testemunho contextual favorecem que o próprio falante confirmou aos irmãos seu silêncio, embora o infinitivo grego, isoladamente, não explicite o sujeito.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição de “cometi” foi mantida para refletir a repetição de ἐποίησα no grego, enquanto “ato de ignorância” evita uma formulação portuguesa artificial.
