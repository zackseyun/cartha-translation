lexical_decisions:
- source_word: Πλὴν
  choice: Contudo
  rationale: Expressa a transição adversativa do grego de modo natural e digno em português.
- source_word: ἀνελεῖν
  choice: matá-lo
  rationale: Transmite diretamente o sentido de tirar a vida, com o pronome retomando José.
- source_word: μετὰ δακρύων
  choice: em lágrimas
  rationale: Formulação idiomática que preserva a intensidade emocional do original.
- source_word: προσεκάλουν
  choice: supliquei
  rationale: No contexto, comunica um apelo insistente e comovido, sem tornar a frase artificialmente literal.
- source_word: μὴ ποιῆσαι τὴν ἁμαρτίαν ταύτην
  choice: que não cometessem esse pecado
  rationale: ‘Cometer um pecado’ é a correspondência natural em português para a expressão grega ‘fazer este pecado’.
