base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/009.yaml
  text: But even if I have sinned, discipline me with discipline, my brothers; but do not raise your hand in the murder of your brother, for the sake of Jacob your father.”
translation:
  language: pt
  text: Mas, ainda que eu tenha pecado, corrijam-me com disciplina, meus irmãos; porém não levantem a mão para matar seu irmão, por causa de Jacó, seu pai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παιδείᾳ παιδεύσατέ με
  choice: corrijam-me com disciplina
  rationale: Preserva a repetição de raiz entre παιδείᾳ e παιδεύσατε de modo parcialmente idiomático, comunicando correção formativa ou disciplinar sem recorrer ao pouco natural «disciplinem-me com disciplina».
- source_word: τὴν χεῖρα ὑμῶν μὴ ἐνέγκατε
  choice: não levantem a mão
  rationale: Expressão portuguesa natural para empregar violência contra alguém, correspondente ao gesto figurado descrito no grego.
- source_word: ἐν φόνῳ ἀδελφοῦ ὑμῶν
  choice: para matar seu irmão
  rationale: Verbaliza naturalmente em português a construção nominal grega, cujo sentido contextual é participar do homicídio do próprio irmão.
- source_word: διὰ Ἰακὼβ τὸν πατέρα ὑμῶν
  choice: por causa de Jacó, seu pai
  rationale: Mantém o valor motivador de διά com acusativo e a identificação explícita de Jacó como pai dos interlocutores.
theological_decisions:
- issue: Natureza da παιδεία solicitada
  choice: correção com disciplina
  alternative: castigo / punição
  rationale: O termo pode abranger educação, correção e disciplina; a tradução evita restringi-lo a punição retributiva e conserva sua amplitude formativa.
- issue: Relação entre pecado e fratricídio
  choice: manter o contraste entre corrigir o pecado e matar o irmão
  alternative: explicitar que a pena de morte seria ilegítima
  rationale: O texto contrasta disciplina e homicídio, mas não formula uma doutrina jurídica geral; a tradução não acrescenta essa conclusão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com imperativos no plural em forma brasileira legível. «Seu irmão» e «seu pai» têm referentes claros no contexto; a repetição é moderadamente preservada sem produzir formulação artificial.
