  source_fidelity: 'A tradução transmite adequadamente o contraste do grego: mesmo havendo pecado, pede-se disciplina/correção, não homicídio. «Corrijam-me com disciplina» representa de modo natural a expressão enfática ἐν παιδείᾳ παιδεύσατέ με, sem reduzir παιδεία a mera punição. «Não levantem a mão para matar seu irmão» reproduz idiomaticamente a proibição figurada de empregar a mão no homicídio do irmão. «Por causa de Jacó, seu pai» conserva o valor motivador de διά com acusativo.'
