lexical_decisions:
- source_word: ὀδυρόμενος
  choice: em pranto
  rationale: Expressa o lamento doloroso que acompanha a fala, de modo natural e digno em português.
- source_word: οἰμωγῶν
  choice: gemidos
  rationale: Designa manifestações audíveis de dor ou lamento; «gemidos» preserva a intensidade sem restringir o termo a gritos.
- source_word: ἤπατά
  choice: fígado
  rationale: Mantém a imagem antropológica visceral do grego, em vez de substituí-la por uma emoção interpretada.
- source_word: ὑπόστασις
  choice: substância
  rationale: Reproduz o sentido concreto de constituição ou consistência nesta descrição das entranhas, preservando a estranheza da imagem.
- source_word: σπλάγχνων
  choice: entranhas
  rationale: Equivalente corporal natural que conserva a associação antiga entre os órgãos internos e as emoções profundas.
- source_word: ἐχαυνοῦτο
  choice: desfaleceu
  rationale: Comunica perda de vigor e colapso interior; concorda em número com o sujeito singular «substância».
