  text: And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.
translation:
  language: pt
  text: E, enquanto ele dizia essas palavras em pranto, eu, não suportando seus gemidos, comecei a chorar; meu fígado se derramou, e toda a substância das minhas entranhas desfalecia.
