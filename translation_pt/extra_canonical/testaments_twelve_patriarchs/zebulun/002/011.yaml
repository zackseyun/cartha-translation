  text: And I wept together with Joseph, and my heart thundered, and the joints of my body trembled, and I had no strength.
translation:
  language: pt
  text: Eu chorava junto com José; meu coração retumbava, as articulações do meu corpo tremiam, e eu não conseguia ficar de pé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόμβει
  choice: retumbava
  rationale: Preserva a imagem física e sonora de um coração que estronda ou ressoa, sem reduzi-la apenas a medo ou palpitação.
- source_word: οἱ ἁρμοὶ τοῦ σώματός μου
  choice: as articulações do meu corpo
  rationale: Tradução direta e compreensível de ἁρμοί, mantendo a referência corporal concreta.
- source_word: οὐκ ἠδυνάμην στῆναι
  choice: eu não conseguia ficar de pé
  rationale: Expressa diretamente a incapacidade de permanecer em pé, em vez de generalizá-la como falta de forças.
