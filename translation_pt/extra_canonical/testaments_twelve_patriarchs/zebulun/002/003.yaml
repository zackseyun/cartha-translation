source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. Οὐκ ἔγνων ⌜δὲ²⁶⌝ ὅτι ἥμαρτον ἐν ταῖς ἡμέραις μου ⌜παρεκτὸς ἐννοίας⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/003.yaml
  text: And I did not know that I had sinned in my days, except in intention.
translation:
  language: pt
  text: Eu, porém, não tinha consciência de ter pecado em meus dias, a não ser em pensamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a não ser em intenção».'
    reason: Registra a amplitude semântica de ἔννοια, que pode designar pensamento ou intenção.
lexical_decisions:
- source_word: ἔγνων
  choice: tinha consciência
  rationale: No contexto, o aoristo de γινώσκω expressa percepção ou reconhecimento retrospectivo; «não tinha consciência» soa natural em português e preserva a ideia de não reconhecer pecado em si.
- source_word: ἐν ταῖς ἡμέραις μου
  choice: em meus dias
  rationale: Mantém de perto a expressão temporal grega sem acrescentar «todos», que não aparece no texto.
- source_word: παρεκτὸς ἐννοίας
  choice: a não ser em pensamento
  rationale: παρεκτός introduz uma exceção, e ἔννοια pode indicar pensamento, intenção ou disposição interior. «Em pensamento» preserva o contraste entre pecado efetivo e pecado interior sem restringi-lo indevidamente à intenção deliberada.
theological_decisions:
- issue: Natureza do pecado reconhecido pelo falante
  choice: a não ser em pensamento
  alternative: a não ser em intenção
  rationale: O grego ἔννοιας admite ambas as nuances. O texto principal usa a formulação mais ampla, enquanto a nota registra a leitura mais específica, evitando resolver silenciosamente a tensão entre pensamento e intenção.
translation_notes:
  register: Português moderno, digno e acessível, com leve tom testamentário. A construção «não tinha consciência de ter pecado» comunica com naturalidade a retrospectiva do grego, sem transformar a declaração em alegação absoluta de impecabilidade.
