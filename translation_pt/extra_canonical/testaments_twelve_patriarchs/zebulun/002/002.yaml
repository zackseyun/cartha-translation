base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/002.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased greatly, and so did the sheep and the cattle, when he had his portion among the variegated rods.
translation:
  language: pt
  text: Eu, Zebulom, tornei-me uma boa dádiva para meus pais, pois, quando nasci, meu pai cresceu muito, assim como as ovelhas e o gado, quando ele tinha sua porção entre as varas malhadas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão alude ao episódio das varas marcadas e ao quinhão de Jacó nos rebanhos de Labão; veja Gênesis 30:32–43. O grego é condensado e pode ser entendido literalmente como «quando ele tinha sua porção entre as varas variadas».
    reason: Esclarece a alusão narrativa e registra a construção condensada do grego, sem expandi-la interpretativamente no texto principal.
lexical_decisions:
- source_word: δόσις ἀγαθή
  choice: boa dádiva
  rationale: Conserva a imagem explícita de Zebulom como um bom dom, em linguagem digna e natural.
- source_word: ηὐξήνθη
  choice: cresceu muito
  rationale: Reproduz o sentido básico de aumento sem restringi-lo antecipadamente a prosperidade econômica; o contexto imediato esclarece o vínculo com os rebanhos.
- source_word: τὰ πρόβατα καὶ τὰ βουκόλια
  choice: as ovelhas e o gado
  rationale: Distingue os ovinos do gado bovino em português corrente, sem a formulação menos natural «manadas de bois».
- source_word: τὸν κλῆρον
  choice: sua porção
  rationale: Expressa aqui uma parte ou quinhão recebido, preservando a possível alusão narrativa sem impor o sentido técnico de herança.
- source_word: ποικίλαις ῥάβδοις
  choice: varas malhadas
  rationale: Traduz a ideia de varas marcadas ou multicolores e mantém a alusão a Gênesis 30; «malhadas» é idiomático nesse contexto.
theological_decisions:
- issue: Relação entre o nascimento de Zebulom e o aumento de Jacó e dos rebanhos
  choice: Manter a afirmação causal-temporal do texto sem explicá-la teologicamente
  alternative: Interpretar o aumento como bênção divina explícita ou como simples prosperidade material
  rationale: O grego associa o nascimento ao aumento, mas não nomeia diretamente o agente divino nem define a natureza exata desse aumento.
- issue: Sentido da porção entre as varas malhadas
  choice: Preservar a referência condensada e acrescentar nota de contexto
  alternative: Expandir no corpo do texto para explicar o acordo de Jacó sobre os animais malhados
  rationale: A formulação grega é alusiva e algo obscura; uma expansão interpretativa no texto eliminaria essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Zebulom» segue a forma bíblica portuguesa usual. A sintaxe mantém a progressão do grego, mas evita rigidez excessiva; a nota conserva a ambiguidade da frase final.
