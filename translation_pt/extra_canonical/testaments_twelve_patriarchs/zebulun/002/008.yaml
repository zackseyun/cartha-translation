  text: 2. Ἐλεήσατέ με ἀδελφοί μου⁷. οἰκτειρήσατε⁸ σπλάγχνα⁹ Ἰακὼβ τοῦ πατρὸς ἡμῶν¹⁰. Μὴ¹¹ ἐπαγάγετε¹² τὰς χεῖρας ὑμῶν Γτοῦ˥¹³ ἐκχέαι αἷμα ἀθῷον, ὅτι οὐχ ἥμαρτον¹⁴ καὶ πεσὼν εἰς ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/008.yaml
  text: “Have mercy on me, my brothers; have compassion, by the compassion of Jacob our father. Do not bring your hands upon me to shed innocent blood, for I have not sinned against you.”
translation:
  language: pt
  text: “Tenham misericórdia de mim, meus irmãos; tenham compaixão, pela compaixão de Jacó, nosso pai.[a] Não ponham as mãos sobre mim para derramar sangue inocente, pois não pequei, mesmo tendo caído entre vocês.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tenham compaixão das entranhas de Jacó, nosso pai”. No grego, “entranhas” representa a compaixão profunda; a construção também pode ser entendida como um apelo para que tenham consideração pela compaixão paterna de Jacó.
    reason: Explica a metáfora de σπλάγχνα e preserva a ambiguidade da relação sintática.
  - marker: b
    text: 'Ou: “e tendo caído entre vocês”. A expressão pode sugerir que ele havia caído em poder deles, mas o grego diz literalmente “caído entre vocês”.'
    reason: Registra a ambiguidade do particípio πεσών e do valor de καί, além de evitar apagar uma frase presente na fonte grega.
lexical_decisions:
- source_word: Ἐλεήσατέ με
  choice: Tenham misericórdia de mim
  rationale: Reproduz diretamente o pedido de misericórdia em português corrente e digno.
- source_word: οἰκτειρήσατε σπλάγχνα
  choice: tenham compaixão, pela compaixão
  rationale: οἰκτειρήσατε é um imperativo de compadecer-se; σπλάγχνα designa literalmente as entranhas, mas figuradamente a compaixão profunda. A formulação mantém a repetição sem introduzir a imagem pouco natural de 'entranhas' no texto principal.
- source_word: ἐπαγάγετε τὰς χεῖρας ὑμῶν
  choice: ponham as mãos sobre mim
  rationale: Expressa de modo natural o gesto hostil indicado pela locução grega; 'sobre mim' explicita o alvo implícito no contexto.
- source_word: ἐκχέαι αἷμα ἀθῷον
  choice: para derramar sangue inocente
  rationale: Equivalência formal e idiomática da expressão grega.
- source_word: πεσὼν εἰς ὑμᾶς
  choice: mesmo tendo caído entre vocês
  rationale: Conserva o particípio e a imagem espacial do grego, sem converter de forma definitiva a expressão em 'cair nas mãos' ou 'cair sob o poder' de alguém.
theological_decisions:
- issue: Relação sintática de σπλάγχνα Ἰακὼβ com o imperativo
  choice: pela compaixão de Jacó
  alternative: tenham consideração pela compaixão de Jacó / tenham pena das entranhas de Jacó
  rationale: A construção é incomum. A escolha entende a compaixão paterna de Jacó como fundamento do apelo, mas a nota registra a imagem literal e outras possibilidades sem resolver silenciosamente a ambiguidade.
- issue: Sentido concessivo de καὶ com πεσὼν
  choice: mesmo tendo caído
  alternative: e tendo caído / embora eu tenha caído
  rationale: O contexto favorece valor concessivo, mas a nota preserva a possibilidade de simples coordenação indicada por καί.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. O tratamento por “vocês” evita arcaísmo; o paralelismo dos imperativos e o tom solene do apelo foram mantidos.
