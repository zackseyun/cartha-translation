  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/005.yaml
  text: But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be killed.
translation:
  language: pt
  text: Mas chorei em segredo durante muitos dias por causa de José. Pois eu tinha medo dos meus irmãos, porque todos haviam combinado que quem revelasse o segredo seria morto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν κρυφῇ
  choice: em segredo
  rationale: Expressa de modo natural o ato de chorar ocultamente, sem tornar explícito um local que o grego não especifica.
- source_word: διὰ τὸν Ἰωσήφ
  choice: por causa de José
  rationale: Preserva a relação causal ampla do grego, sem restringi-la indevidamente a uma única emoção.
- source_word: συνέθεντο
  choice: haviam combinado
  rationale: Comunica o acordo conjunto anterior dos irmãos em português corrente e mantém a relação temporal com o medo narrado.
- source_word: ὅστις ἐξείπῃ τὸ μυστήριον
  choice: quem revelasse o segredo
  rationale: Traduz a construção indefinida e o sentido de divulgar aquilo que deveria permanecer oculto.
- source_word: ἀναιρεθῆναι
  choice: seria morto
  rationale: Verte diretamente o sentido passivo de ser eliminado ou morto, em registro digno e claro.
