  text: For Simeon and Dan and Gad came against Joseph to kill him, and he spoke to them with tears.
translation:
  language: pt
  text: Pois Simeão, Dã e Gade vieram contra José para matá-lo, e ele lhes falava em lágrimas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τὸν Ἰωσήφ
  choice: contra José
  rationale: A preposição ἐπί com acusativo, neste contexto hostil e seguida da finalidade de matar, indica movimento ou ação dirigida contra José.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: para matá-lo
  rationale: O infinitivo aoristo ἀνελεῖν expressa aqui a finalidade da ação; «matar» comunica diretamente o sentido contextual.
- source_word: ἔλεγεν αὐτοῖς
  choice: lhes falava
  rationale: O imperfeito preserva o aspecto durativo ou continuado da fala; «falava» é mais adequado que um pretérito pontual.
- source_word: μετὰ δακρύων
  choice: em lágrimas
  rationale: Expressão portuguesa natural e digna para indicar que José falava chorando, sem acrescentar conteúdo ausente do grego.
