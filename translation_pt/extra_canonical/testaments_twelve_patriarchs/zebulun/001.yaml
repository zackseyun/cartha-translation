base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001.yaml
  text: '1 A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.


    2 And he said to them: Listen to me, sons of Zebulun; pay attention to the words of your father.


    3 I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.


    4 I do not know that I sinned in my days, except in thought.


    5 I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.


    6 But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.


    7 Yet when they wanted to kill him, with tears I begged them not to commit this sin.'
translation:
  language: pt
  text: '**Testamento de Zebulom, o sexto filho de Jacó e Lia[a]**


    **1** Cópia das palavras que Zebulom deixou a seus filhos antes de morrer, no centésimo décimo quarto ano de sua vida[b], dois anos depois da morte de José.


    **2** Ele lhes disse: — Escutem-me, filhos de Zebulom; prestem atenção às palavras de seu pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns testemunhos divergem quanto ao nome do patriarca na inscrição; o próprio capítulo apresenta claramente Zebulom como aquele que fala.
    reason: textual_variant
  - marker: b
    text: O número exato da idade na inscrição varia na transmissão textual; esta tradução segue o testemunho grego aqui adotado.
    reason: textual_variant
lexical_decisions:
- source_word: Διαθήκη
  choice: Testamento
  rationale: No título, designa as últimas palavras e instruções solenes de um patriarca; “Testamento” preserva o gênero literário tradicional.
- source_word: Ἀντίγραφον λόγων
  choice: Cópia das palavras
  rationale: Tradução direta que conserva a apresentação do texto como registro escrito ou transcrição das palavras de Zebulom.
- source_word: διέθετο
  choice: deu suas últimas instruções
  rationale: O verbo pode envolver dispor, ordenar ou deixar instruções. A formulação portuguesa comunica o sentido testamentário sem reduzi-lo a simples fala.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: antes de morrer
  rationale: Forma natural e fiel para a oração temporal grega.
- source_word: Ἀκούσατέ μου
  choice: Escutem-me
  rationale: Imperativo claro e corrente, adequado à exortação direta de um pai a seus filhos.
theological_decisions:
- issue: Caráter testamentário das palavras de Zebulom
  choice: “deu suas últimas instruções”
  alternative: “ordenou” ou “dispôs”
  rationale: Mantém a força solene do verbo no contexto de despedida, sem introduzir uma categoria jurídica ou doutrinária mais específica do que o grego exige.
- issue: Identidade do patriarca na inscrição
  choice: Zebulom, conforme o texto grego fornecido
  alternative: Nomes divergentes encontrados em parte da transmissão manuscrita
  rationale: O testemunho-base identifica Zebulom, e o próprio capítulo o apresenta como aquele que fala; a nota registra a variação sem alterar o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O título preserva o nome tradicional do gênero. A fala direta usa “Escutem-me” e “prestem atenção”, evitando tanto arcaísmo quanto informalidade excessiva. A tradução limita-se ao trecho efetivamente presente no texto grego fornecido.
