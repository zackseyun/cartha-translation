base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009.yaml
  text: 1 Therefore pay attention to the waters[a], and understand that when they move to one place, they carry down stones, wood, earth, and various other things. 2 But if they are divided into many streams, the ground swallows them up, and they become easy to despise. 3 So also you, if you are divided, will become like this. 4 Therefore do not be split under two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members. 5 For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow two kingdoms, and you will do every abomination. 6 And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses. 7 And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go
    astray in their evil deeds. 8 And after these things the Lord himself will rise for you[c][b], the light of righteousness.
translation:
  language: pt
  text: 1 Portanto, observem as águas e compreendam que, quando seguem para o mesmo lugar, elas arrastam pedras, madeira, terra e várias outras coisas. 2 Mas, se forem divididas em muitos cursos, a terra as faz desaparecer, e elas podem ser facilmente desprezadas. 3 Assim também acontecerá com vocês, se forem divididos. 4 Portanto, não se separem sob duas cabeças, pois tudo o que o Senhor fez possui uma só cabeça, dois ombros, duas mãos, dois pés e todos os demais membros. 5 Pois aprendi nos escritos de meus antepassados que vocês serão divididos em Israel, seguirão dois reinos e cometerão toda espécie de abominação. 6 Seus inimigos os levarão cativos, e vocês serão maltratados entre as nações, em meio a muitas fraquezas e aflições. 7 Depois disso, quando se lembrarem do Senhor, vocês voltarão[a], e ele terá misericórdia de vocês, porque é misericordioso e compassivo. Ele não leva em conta a maldade dos filhos dos homens, porque são carne e se desviam em suas más ações[b]. 8 Depois disso,
    o próprio Senhor surgirá para vocês[c], a luz da justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Algumas testemunhas trazem: “vocês se lembrarão do Senhor e se arrependerão, e ele os fará voltar”, em vez de “quando se lembrarem do Senhor, vocês voltarão”.'
    reason: textual_variant
  - marker: b
    text: 'Algumas testemunhas ampliam a explicação: “porque são carne, e os espíritos do erro os desencaminham em todas as suas ações”.'
    reason: textual_variant
  - marker: c
    text: Ou “raiará para vocês”; a imagem é a do Senhor aparecendo como uma luz que nasce.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἐπὶ τὰ ὕδατα
  choice: observem as águas
  rationale: Expressa a exortação direta em português atual e mantém as águas como objeto de atenção.
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: seguem para o mesmo lugar
  rationale: Preserva o movimento rumo a um mesmo ponto sem acrescentar explicitamente a ideia de confluência.
- source_word: κατασύρουσιν
  choice: arrastam
  rationale: Comunica de modo natural a força descendente da corrente sobre os materiais mencionados.
- source_word: ἀφανίζει
  choice: faz desaparecer
  rationale: Mantém o sentido de eliminação ou desaparecimento causado pela terra, sem tornar a imagem mais específica do que o grego.
- source_word: εὐκαταφρόνητα
  choice: podem ser facilmente desprezadas
  rationale: Conserva tanto a noção de desprezo quanto a facilidade expressa pelo composto grego.
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: não se separem sob duas cabeças
  rationale: Distingue χωρίζω do verbo de divisão usado nos versículos anteriores e preserva a metáfora corporal e política das duas cabeças.
- source_word: γραφῇ τῶν πατέρων μου
  choice: nos escritos de meus pais
  rationale: Preserva a autoridade ancestral sem afirmar de modo indevido um estatuto canônico específico.
- source_word: βδέλυγμα
  choice: abominação
  rationale: Mantém a forte censura moral e cultual do termo grego.
- source_word: ἀνατελεῖ
  choice: surgirá
  rationale: Permite a imagem de aparecimento ou ascensão sem eliminar sua associação contextual com o raiar da luz.
theological_decisions:
- issue: Sequência de lembrança, retorno e misericórdia no versículo 7
  choice: quando se lembrarem do Senhor, vocês voltarão, e ele terá misericórdia de vocês
  alternative: vocês se lembrarão do Senhor e se arrependerão, e ele os fará voltar
  rationale: O texto principal segue a forma grega fornecida; a variante, que altera a agência e introduz o arrependimento explicitamente, é preservada em nota.
- issue: Causa do desvio humano no versículo 7
  choice: porque são carne e se desviam em suas más ações
  alternative: porque são carne, e os espíritos do erro os desencaminham em todas as suas ações
  rationale: A redação mais breve do texto fornecido permanece no corpo, enquanto a expansão presente em algumas testemunhas é documentada sem harmonização doutrinária.
- issue: A luz da justiça no versículo 8
  choice: o próprio Senhor surgirá para vocês, a luz da justiça
  alternative: Interpretar a expressão exclusivamente como título messiânico ou apenas como metáfora geral de restauração
  rationale: A formulação mantém a identificação do Senhor com a imagem salvadora da luz sem restringir sua possível ressonância teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento em “vocês” e sem arcaísmos. A repetição temática de “divididos” foi mantida onde corresponde a διαιρέω, enquanto “separem” representa χωρίζω. A metáfora das cabeças e a expressão “luz da justiça” foram preservadas sem explicação denominacional.
