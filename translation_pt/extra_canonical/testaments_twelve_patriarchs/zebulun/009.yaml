  naturalness: O português é moderno, claro e adequado ao registro exortativo. «Não se separem sob duas cabeças» é uma formulação deliberadamente literal e compreensível no contexto da metáfora corporal; não requer alteração. A revisão de «pais» para «antepassados» melhora a precisão sem tornar o texto menos natural.
  terminology: «Senhor», «abominação», «misericordioso e compassivo», «carne» e «luz da justiça» são escolhas apropriadas. «Antepassados» evita a ambiguidade moderna de «pais» e preserva a autoridade ancestral, sem atribuir estatuto canônico ao escrito.
