revisions:
- from: Portanto, tenham misericórdia no íntimo de vocês[a], porque, seja o que for que alguém fizer ao seu próximo, assim o Senhor fará a essa pessoa.
  to: Tenham, portanto, misericórdia em seu íntimo[a], porque tudo o que alguém fizer ao seu próximo, assim o Senhor agirá com essa pessoa.
  rationale: A revisão substitui a construção portuguesa incompleta “fará a essa pessoa” por “agirá com essa pessoa”, que conserva a amplitude de ποιήσει μετʼ αὐτοῦ e a correspondência retributiva indicada por οὕτω, sem impor uma interpretação do modo da ação divina. Também simplifica a oração generalizante para uma formulação portuguesa natural e fiel.
