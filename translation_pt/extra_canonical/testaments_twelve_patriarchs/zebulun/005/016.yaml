base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/016.yaml
  text: Have mercy, therefore, in your hearts[b], because whatever anyone does to his neighbor, so the Lord will do to him.
translation:
  language: pt
  text: Tenham, portanto, misericórdia em seu íntimo[a], porque tudo o que alguém fizer ao seu próximo, assim o Senhor agirá com essa pessoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega diz literalmente “misericórdia nas partes interiores de vocês”. No uso antigo, os órgãos internos eram considerados a sede da compaixão profunda.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεος
  choice: misericórdia
  rationale: Equivalente direto e natural que preserva a dimensão ativa de compaixão.
- source_word: ἐν σπλάγχνοις ὑμῶν
  choice: no íntimo de vocês
  rationale: Expressa em português corrente o idioma grego que situa a compaixão nas partes interiores, sem reduzir a imagem simplesmente a emoção superficial.
- source_word: τῷ πλησίον αὐτοῦ
  choice: ao seu próximo
  rationale: Mantém a formulação ética tradicional e abrangente de πλησίον.
- source_word: μετʼ αὐτοῦ
  choice: a essa pessoa
  rationale: O grego diz literalmente que o Senhor fará 'com ele'; esta formulação explicita o referente em português e preserva o sentido retributivo sem acrescentar 'também', ausente do texto estabelecido.
theological_decisions:
- issue: Reciprocidade da ação divina
  choice: assim o Senhor fará a essa pessoa
  alternative: assim o Senhor o tratará
  rationale: Mantém de perto a correspondência verbal entre o que alguém faz ao próximo e o que o Senhor fará com essa pessoa, sem definir além do texto o mecanismo ou o momento da retribuição.
- issue: Generalidade da oração condicional
  choice: seja o que for que alguém fizer
  alternative: se alguém fizer alguma coisa
  rationale: A construção com ἂν é generalizante; a opção escolhida conserva a amplitude de 'qualquer coisa que' sem restringi-la a um caso meramente hipotético.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento no plural por “vocês”. A ordem e a relação causal do grego foram preservadas, enquanto o idioma corporal foi vertido naturalmente e explicado em nota.
