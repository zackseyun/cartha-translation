    issue: Construção pouco natural e imprecisa em “assim o Senhor fará a essa pessoa”.
    rationale: Em português, “fazer a essa pessoa” pede normalmente um complemento que indique o que se faz. O grego usa ποιήσει μετʼ αὐτοῦ, cuja formulação é ampla; “agirá com essa pessoa” expressa naturalmente a correspondência sem acrescentar um modo específico de retribuição.
