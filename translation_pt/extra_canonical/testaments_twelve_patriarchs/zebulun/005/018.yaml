base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/018.yaml
  text: And when I was in the land of Canaan, by the seashore, I used to catch prey[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].
translation:
  language: pt
  text: E, quando eu estava na terra de Canaã, junto ao litoral, eu caçava presas[a] para Jacó, meu pai; e, enquanto muitos eram sufocados no mar, eu permanecia ileso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “eu caçava presas”. O cenário litorâneo pode indicar pesca ou captura de animais marinhos para seu pai.
    reason: lexical_alternative
  - marker: b
    text: A frase final parece prosseguir além do trecho preservado fornecido aqui; a tradução termina onde termina o grego disponível neste segmento da fonte.
    reason: textual_variant
lexical_decisions:
- source_word: εἰς τὴν παραλίαν
  choice: junto ao litoral
  rationale: Expressa naturalmente a localização costeira indicada pelo grego, sem restringi-la necessariamente à faixa de areia da praia.
- source_word: ἐθήρευον θήραν
  choice: eu caçava presas
  rationale: Preserva a figura etimológica e a amplitude do grego (‘caçava caça/presa’). O contexto marítimo pode sugerir pesca ou captura de animais marinhos, mas o texto não diz explicitamente ‘peixes’.
- source_word: ἀγχομένων
  choice: eram sufocados
  rationale: Mantém o sentido passivo de estar sendo estrangulado ou sufocado, sem substituí-lo interpretativamente por ‘afogavam-se’.
- source_word: ἀβλαβὴς διέμενον
  choice: eu permanecia ileso
  rationale: Reproduz o aspecto durativo de διέμενον e o sentido de não sofrer dano em ἀβλαβής.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi mantida próxima do grego, mas com pontuação natural em português; evitou-se transformar a ‘presa’ em ‘peixe’ e ‘sufocados’ em ‘afogados’, preservando a ambiguidade lexical do texto.
