  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/011.yaml
  text: And Simeon took the tunic and did not want to give it up. For he wanted to cut him down with the sword, being angry because he had not killed him.
translation:
  language: pt
  text: Simeão pegou a túnica e não quis entregá-la, pois queria matá-lo a golpes de espada, furioso porque não o havia matado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτῶνα
  choice: túnica
  rationale: Equivalente natural e tradicional para a peça de roupa indicada pelo grego.
- source_word: οὐκ ἤθελε δοῦναι αὐτόν
  choice: não quis entregá-la
  rationale: No contexto, δίδωμι expressa ceder ou entregar a túnica; o pronome feminino retoma naturalmente “túnica” em português.
- source_word: τῇ ῥομφαίᾳ κατακόψαι αὐτόν
  choice: matá-lo à espada
  rationale: κατακόπτω denota golpear ou abater de modo violento; neste contexto homicida, “matar à espada” comunica o resultado pretendido sem uma formulação artificial.
- source_word: ὀργιζόμενος
  choice: furioso
  rationale: Particípio circunstancial que descreve a ira de Simeão; “furioso” mantém a força e produz uma frase corrente.
- source_word: οὐκ ἀνεῖλεν αὐτόν
  choice: não o havia matado
  rationale: ἀναιρέω aqui significa matar; o mais-que-perfeito composto deixa clara a anterioridade em relação à ira narrada.
