  text: αὐτὸν τῷ Ἰακὼβ λέγοντες⁵⁵. Ἐπίγνωθι, ὁ⁵⁶ *χιτὼν τοῦ υἱοῦ σου ἐστίν⁵⁷; *καὶ ἐποίησαν οὕτως⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/001.yaml
  text: And they said to Jacob, “Recognize, then, whether this is your son’s tunic[a].” And they did so.
translation:
  language: pt
  text: 'E disseram a Jacó: “Veja se esta é a túnica[a] de seu filho.” E assim fizeram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “manto” ou “veste”; “túnica” foi escolhida por ser mais específica.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίγνωθι
  choice: Veja se
  rationale: No contexto, o imperativo pede que Jacó examine e reconheça a peça; “Veja se” exprime isso de modo natural e preserva a forma interrogativa indireta sugerida pelo contexto e pela pontuação editorial.
- source_word: χιτών
  choice: túnica
  rationale: “Túnica” é mais específico que “veste” ou “roupa” e corresponde bem à peça de vestuário designada pelo termo grego.
- source_word: καὶ ἐποίησαν οὕτως
  choice: E assim fizeram
  rationale: Tradução direta que mantém a concisão e a aparente tensão narrativa do grego, sem explicar a que ação a frase se refere.
