  source_fidelity: A tradução preserva o pronome masculino em αὐτόν e identifica corretamente Δάν como Dã. Contudo, δέδωκεν corresponde mais diretamente a “deu”, enquanto “entregou” acrescenta uma nuance de transferência/custódia não explicitada neste versículo. O mais-que-perfeito “havia dito” é possível no fluxo narrativo, mas o aoristo εἶπεν é mais fielmente reproduzido por “disse”.
