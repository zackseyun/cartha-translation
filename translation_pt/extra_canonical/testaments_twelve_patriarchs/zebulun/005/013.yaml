  text: E assim ele o deu a eles. E eles fizeram como Dã disse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδωκεν αὐτὸν αὐτοῖς
  choice: ele o entregou a eles
  rationale: O pronome masculino αὐτόν é representado por “o”, indicando uma pessoa; “entregou” exprime com naturalidade, neste contexto, o ato de pô-lo nas mãos deles.
- source_word: καθὼς εἶπεν ὁ Δάν
  choice: como Dã havia dito
  rationale: O mais-que-perfeito composto torna clara e natural em português a anterioridade da fala de Dã em relação ao que eles fizeram.
