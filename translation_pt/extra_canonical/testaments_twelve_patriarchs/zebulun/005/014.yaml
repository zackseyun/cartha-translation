source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: V. Καὶ νῦν¹, τέκνα μου, παραγγέλλω² ὑμῖν *τοῦ φυλάσσειν τὰς ἐντολὰς Κυρίου³, καὶ ποιεῖν⁴ ἔλεος ⌜πρὸς⌝⁵ τὸν⁶ πλησίον⁷, καὶ εὐσπλαγχνίαν *ἔχειν πρὸς πάντας⁸ οὐ μόνον *ἐν ἀνθρώποις⁹, ἀλλὰ *καὶ ἐν ἀλόγοις ζώοις¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/014.yaml
  text: And now, my children, I command you to keep the commandments of the Lord, and to show mercy to your neighbor, and to have compassion toward all, not only toward people but also toward unreasoning animals.
translation:
  language: pt
  text: E agora, meus filhos, ordeno que guardem os mandamentos do Senhor, que demonstrem misericórdia para com o próximo e que tenham compaixão de todos, não somente dos seres humanos, mas também dos animais sem razão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάσσειν
  choice: guardem
  rationale: No contexto de mandamentos, o verbo significa observá-los e cumpri-los fielmente; “guardar” preserva essa formulação bíblica e continua claro em português.
- source_word: ποιεῖν ἔλεος
  choice: demonstrem misericórdia
  rationale: A expressão grega significa literalmente “fazer misericórdia”; “demonstrar misericórdia” comunica seu sentido idiomático em português atual.
- source_word: τὸν πλησίον
  choice: o próximo
  rationale: É a equivalência bíblica natural para a pessoa com quem se mantém uma relação de proximidade e responsabilidade.
- source_word: εὐσπλαγχνίαν ἔχειν
  choice: tenham compaixão
  rationale: Reproduz o apelo a uma disposição profunda de ternura e piedade sem tornar a frase artificial.
- source_word: ἄλογοις ζώοις
  choice: animais sem razão
  rationale: Conserva a distinção explícita do grego entre seres humanos e animais não dotados de razão, evitando o possível sentido pejorativo de “animais irracionais”.
theological_decisions:
- issue: Alcance de πρὸς πάντας (“para com todos”)
  choice: “tenham compaixão de todos”, seguido da explicitação de seres humanos e animais
  alternative: Restringir “todos” apenas a todas as pessoas
  rationale: A própria continuação inclui expressamente tanto os seres humanos quanto os animais; a tradução mantém esse alcance amplo sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com cadência bíblica natural. A repetição de “que” deixa clara a série de três ordens subordinadas a “ordeno”, enquanto “não somente... mas também” preserva a estrutura enfática do grego.
