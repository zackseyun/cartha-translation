  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/012.yaml
  text: But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.”
translation:
  language: pt
  text: 'Mas todos nós nos levantamos e lhe dissemos: “Se você não entregar a túnica, diremos ao nosso pai que foi você, sozinho, quem cometeu este mal em Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάντες
  choice: nos levantamos
  rationale: Preserva o sentido concreto do particípio aoristo e introduz naturalmente a ação seguinte.
- source_word: τὸν χιτῶνα
  choice: a túnica
  rationale: Equivalente corrente para χιτών, uma peça de roupa usada junto ao corpo.
- source_word: τὸ πονηρὸν τοῦτο
  choice: este mal
  rationale: Mantém o caráter moralmente condenável de πονηρόν sem acrescentar uma interpretação específica.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Conserva a formulação coletiva e pactual do texto grego, que pode designar o povo ou a comunidade de Israel.
theological_decisions:
- issue: Sentido de ἐν Ἰσραήλ
  choice: em Israel
  alternative: contra Israel
  rationale: A preposição ἐν indica aqui o âmbito em que o mal foi cometido; a tradução evita transformar essa ideia em oposição direta a Israel.
translation_notes:
  register: 'Português moderno, claro e digno, com ordem levemente ajustada para dar naturalidade à ênfase de σὺ μόνος: “foi você, sozinho, quem”. O discurso direto e a acusação coletiva foram preservados.'
