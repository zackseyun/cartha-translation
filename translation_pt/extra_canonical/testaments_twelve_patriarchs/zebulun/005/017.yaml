source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. *Καὶ γὰρ²⁵ υἱοὶ²⁶ τῶν ἀδελφῶν μου ἠσθένουν καὶ²⁷ ἀπέθνησκον διὰ Ἰωσήφ²⁸, ⌈ὅτι οὐκ ἐποίησαν ἔλεος *ἐν σπλάγχνοις αὐτῶν²⁹⌉. οἱ δὲ *ἐμοὶ υἱοὶ³⁰ ἄνοσοι διεφυλάχθησαν³¹ καθὼς³² οἴδατε³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/017.yaml
  text: For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their inward parts; but my sons were kept free from sickness, as you know.
translation:
  language: pt
  text: Pois os filhos dos meus irmãos adoeciam e morriam por causa de José, porque não demonstraram misericórdia no íntimo; mas os meus filhos foram preservados livres de doença, como vocês sabem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠσθένουν καὶ ἀπέθνησκον
  choice: adoeciam e morriam
  rationale: Preserva o aspecto imperfeito dos dois verbos gregos, indicando um processo ou ocorrência continuada.
- source_word: διὰ Ἰωσήφ
  choice: por causa de José
  rationale: Reproduz de modo natural a relação causal expressa por διά com acusativo, sem explicitar além do texto se a causa era o que fizeram a José ou alguma ação do próprio José.
- source_word: ἔλεος
  choice: misericórdia
  rationale: Equivalente corrente e digno para a compaixão ativa indicada pelo substantivo grego.
- source_word: ἐν σπλάγχνοις αὐτῶν
  choice: no íntimo
  rationale: Comunica em português atual a sede interior da compaixão sugerida literalmente pelas 'entranhas', sem a estranheza anatômica de uma reprodução rígida.
- source_word: ἄνοσοι διεφυλάχθησαν
  choice: foram preservados de toda doença
  rationale: Expressa tanto o estado de isenção de doença (ἄνοσοι) quanto a preservação enfática indicada por διεφυλάχθησαν.
- source_word: καθὼς οἴδατε
  choice: como vocês sabem
  rationale: Formulação natural e amplamente inteligível, mantendo a segunda pessoa do plural.
theological_decisions:
- issue: Sentido causal de διὰ Ἰωσήφ
  choice: por causa de José
  alternative: por causa do que fizeram a José
  rationale: Mantém a concisão e a ambiguidade genuína do grego, evitando inserir uma explicação interpretativa na linha principal.
- issue: Relação entre falta de misericórdia, doença e morte
  choice: preservar a afirmação causal sem explicação doutrinária adicional
  alternative: explicitar a doença como castigo divino
  rationale: O verso associa os fatos, mas não nomeia explicitamente o agente nem formula uma doutrina geral de retribuição.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A construção mantém o contraste entre os filhos dos irmãos e os filhos de Zebulom, bem como a tensão causal do original.
