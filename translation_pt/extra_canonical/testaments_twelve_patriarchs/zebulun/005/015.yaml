  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/015.yaml
  text: For because of these things the Lord blessed me, and when all my brothers were ill, I passed through unharmed. For the Lord knows each person’s intention.
translation:
  language: pt
  text: Pois foi por causa dessas coisas que o Senhor me abençoou; e, quando todos os meus irmãos estavam enfermos, eu passei sem adoecer. Pois o Senhor conhece a intenção de cada um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενούντων
  choice: estavam enfermos
  rationale: Expressa de modo natural e digno a condição de debilidade ou doença indicada pelo particípio grego.
- source_word: ἄνοσος παρῆλθον
  choice: passei sem adoecer
  rationale: Preserva explicitamente o sentido de ἄνοσος, 'sem doença', e traduz παρῆλθον sem ampliar a ideia para ausência de qualquer dano.
- source_word: προαίρεσιν
  choice: intenção
  rationale: Mantém a referência à disposição ou escolha deliberada interior de cada pessoa, sem impor um sentido técnico filosófico ou teológico.
theological_decisions:
- issue: Relação entre a bênção do Senhor e a conduta mencionada anteriormente
  choice: foi por causa dessas coisas que o Senhor me abençoou
  alternative: por isso o Senhor me abençoou
  rationale: A formulação conserva a relação causal enfática de Διὰ γὰρ ταῦτα sem especificar além do que o contexto fornecido permite.
- issue: Conhecimento divino da προαίρεσις individual
  choice: o Senhor conhece a intenção de cada um
  alternative: o Senhor conhece a disposição de cada um
  rationale: '''Intenção'' preserva o foco no propósito deliberado, sem resolver a afirmação em favor de uma doutrina específica sobre vontade ou mérito.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de 'Pois' reflete as duas ocorrências de γάρ, enquanto o ponto e vírgula mantém unidas a bênção e a experiência de não adoecer.
