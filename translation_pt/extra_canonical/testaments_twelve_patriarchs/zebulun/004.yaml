lexical_decisions:
- source_word: σπλαγχνιζόμενος
  choice: movido de compaixão
  rationale: Preserva a força afetiva e visceral do termo e estabelece o tema recorrente da compaixão no capítulo.
- source_word: τηρεῖν
  choice: guardá-lo
  rationale: No contexto da ameaça contra José, comunica vigilância ativa e protetora, não mera observação.
- source_word: ἐπράθη
  choice: foi vendido
  rationale: Mantém o sentido comercial explícito da narrativa de José.
- source_word: ἄσιτος
  choice: sem ter comido
  rationale: Expressa com naturalidade a privação concreta de alimento, sem sugerir necessariamente um jejum religioso voluntário.
- source_word: περιεσχίσατο τὸν χιτῶνα αὐτοῦ
  choice: rasgou a própria túnica
  rationale: Segue o singular concreto do grego e conserva o gesto tradicional de luto.
- source_word: Τρωγλοδιτῶν
  choice: Trogloditas
  rationale: Mantém o etnônimo da testemunha grega; a nota esclarece sua associação literal e geográfica provável.
- source_word: μολύνωμεν
  choice: manchar
  rationale: É a expressão portuguesa mais concreta e idiomática para aplicar sangue à túnica.
- source_word: μετενόησαν
  choice: se arrependeram
  rationale: O contexto trata de uma culpa moral específica, tornando 'arrependeram-se' mais adequado que uma simples mudança de opinião.
- source_word: ἁπλότης / ἁπλοῦς
  choice: simplicidade / simples
  rationale: Preserva o fio temático da franqueza, ausência de malícia e generosidade sem cálculo.
- source_word: ἔλεος
  choice: misericórdia
  rationale: Mantém, quando possível, a distinção entre misericórdia e a linguagem de compaixão ligada a σπλάγχνα.
- source_word: λογιεῖται εἰς δικαιοσύνην
  choice: a contará como justiça
  rationale: Conserva a metáfora teológica de atribuição ou cômputo em português claro.
- source_word: ἀλλότριος
  choice: estrangeiro
  rationale: Adequa-se à tríade ética tradicional 'estrangeiro, órfão e viúva'.
theological_decisions:
- issue: A afirmação messiânica “de Levi [...] um sacerdote, e de Judá, um rei, Deus e homem”
  choice: Traduzida conforme consta da tradição grega, sem atenuar sua linguagem cristológica elevada.
  alternative: Tratá-la como interpolação e omiti-la, ou vertê-la de modo vago como referência a uma figura régia e sacerdotal.
  rationale: A transparência textual exige representar a leitura grega, enquanto a possível ampliação cristã posterior é informada em nota.
- issue: A expressão “todo aquele que nele crer”
  choice: Mantida como confiança pessoal dirigida à figura descrita no contexto imediato.
  alternative: Generalizar para “quem crer em Deus” ou omitir a frase como interpolação.
  rationale: A formulação deve conservar a tensão e o referente do testemunho, sem harmonização teológica silenciosa.
- issue: A linguagem do anjo mediador
  choice: O anjo que intercede é apresentado distintamente como mediador entre Deus e os seres humanos.
  alternative: Identificar diretamente o anjo com o Messias ou reduzi-lo a um auxílio celestial genérico.
  rationale: O discurso distingue as figuras; a tradução preserva essa distinção e não impõe uma identificação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com legibilidade brasileira. Preferiram-se construções diretas, vocabulário bíblico reconhecível sem arcaísmos e distinção consistente entre “compaixão” e “misericórdia”. O singular “túnica” e a inclusão de Dã seguem diretamente o texto grego fornecido. As expansões da tradição grega mais ampla foram preservadas com sinalização transparente em nota.
