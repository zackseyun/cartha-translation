  text: 'After he had been thrown into the pit[a], my brothers sat down to eat and drink. But I, having compassion for Joseph, did not eat; for I kept watch by the pit, because Judah feared that Simeon and Gad might leap up and kill him. And when they saw that I also was not eating, they set me to guard him until he was sold. He spent three days and three nights in the pit, and so he was sold while fasting.


    When Reuben came and heard that he had been sold while he was away, he tore his garments and mourned, saying, “How shall I look upon the face of my father Jacob?” And taking the silver, he ran after the merchants, but found no one; for they had left the main road and gone by a shorter route through the Troglodytes. Reuben was grieved, and on that day he ate no bread.


    Then Dan came up to him and said, “Do not weep or be distressed; for we have found what we shall say to our father. Let us slaughter a male goat with the sword, stain Joseph’s tunic, and send it to Jacob our father, saying, ‘Look whether this is the tunic of your son.’” And they did so. Therefore Jacob bewailed Joseph all his days.


    And my brothers were afraid, and they all repented because of what they had done to Joseph. But the Egyptians and the Ishmaelites did him no harm, because the Lord did not allow them to do evil to him.


    For he was a handsome man, good-looking and beautiful in appearance, and there was no spite in him, but he was gentle and had a simple soul. Therefore be compassionate, my children[b], because compassion is good for all. And mercy, even if a man is a sinner, if he has compassion, the Lord will count it as righteousness for him. And even if he prospers, if he has no compassion, the Lord will destroy him.


    For in the days of famine I remembered the compassion of the Lord, and I gave to all the stranger, the fatherless, and the widow. And when I was forty years old, I took a wife, for my life had been spent in toil and labor, and because of my simplicity I had no wealth. For my father had blessed me, saying, “Your sons shall be like a haven for sailors, and like a harbor for ships.”


    And now, my children, I command you: have compassion toward every man with mercy, so that the Lord also may have compassion on you. Because in the last days you will depart from the Lord, and you will provoke Levi to anger, and you will rise up against Judah; but you will not prevail against them, for an angel of the Lord will guide them both, because by them Israel will stand.


    And whenever you depart from the Lord, you will walk in every evil and commit the abominations of the nations, going astray after women and being enslaved by every wickedness while the spirits of deceit work in you. For I have read in the writing of Enoch that your sons also will be corrupted in the last days, and will commit lawlessness against the sons of Levi, and will sin against Judah. But they will not be able to stand against them; for from Levi the Lord will raise up a priest, and from Judah a king, God and man. He will save all the nations and the race of Israel.


    And now I command you, my children: obey Zebulun your father, and have mercy on your neighbors, and compassion on all, not only on men, but also on the cattle. For because of this the Lord blessed me, and when all my brothers were sick, I remained without sickness; for the Lord knows the intention of each man.


    Have compassion, therefore, in your inward parts, my children, because in whatever way a man does to his neighbor, so also the Lord will do to him. For I saw the sons of my brothers sickening and dying because they had no compassion; but my sons were kept unharmed, as you know. For in the days of Canaan I made no gain from a balance of weights, nor did I have in my house a double measure, but all my possessions were shared with all in singleness of heart. And I did not remember evil against anyone. Even to the age of old age I kept my integrity in all things.


    You also, therefore, my children, keep the law of the Lord, and show mercy to your neighbor, and deal compassionately with all, not only with men but also with irrational animals. Because of this also I found mercy with the Lord, and all men blessed me, and the Lord increased my goods a thousandfold. For the compassionate man does good to his own soul.


    Know, therefore, my children, that in the last times you will depart from the Lord, and you will be divided in Israel, and you will follow two evils, and you will not be found in the assembly of the righteous. But after these things the Lord himself will arise for you, the light of righteousness, and he will heal and save all. And he will bring back the captives from Beliar, and he will turn disobedient hearts to the Lord, and he will grant everlasting peace to those who call on him.


    And the saints shall rest in Eden, and in the New Jerusalem the righteous shall rejoice, and it shall be for the glory of God forever. And Jerusalem shall no longer endure desolation, nor shall Israel be led captive; for the Lord will be in her midst, dwelling among men, and the Holy One of Israel will reign over them in humility and poverty. And whoever believes in him shall reign in truth in the heavens.


    And now, my children, fear the Lord your God, and beware of Satan and his spirits. Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men for the peace of Israel. He will stand against the kingdom of the enemy; therefore the enemy is eager to destroy all who call on the Lord. For he knows that on the day when Israel repents, the kingdom of the enemy will be brought to an end.


    For the angel of peace himself will strengthen Israel, so that it may not fall into the extremity of evil. And in the time of Israel’s lawlessness the Lord will not abandon them, but will transform them into a nation that does his will; for no angel is equal to him. His name is in every place in Israel and among the nations.


    Keep yourselves, therefore, from every evil deed, and cast away hatred and every deceit, and love one another in truth and with patience. And the things that I have heard from my father, hand on to your children, so that the Savior of the nations may receive you; for he is gentle and humble, and by his own example he teaches the law of God.


    Flee, therefore, from all unrighteousness, and cling to the righteousness of the law of the Lord, and your seed will be forever, and you will be blessed in all your generations.


    And after he had commanded them these things, he stretched out his feet and died in a good old age. And his sons laid him in a coffin[g][f][e][d][c]. Later they carried him up to Hebron and buried him with his fathers.'
translation:
  language: pt
  text: 'TESTAMENTO DE ZEBULOM 4


    Depois de José ter sido lançado na cisterna[a], meus irmãos sentaram-se para comer e beber. Eu, porém, movido de compaixão por José, não comi, mas fiquei atento à cisterna, porque Judá temia que Simeão, Dã e Gade[b] se lançassem sobre ele e o matassem. Quando viram que eu não comia, encarregaram-me de guardá-lo até que fosse vendido. Ele passou três dias e três noites na cisterna e, assim, foi vendido sem ter comido.


    Quando Rúben chegou e soube que José havia sido vendido durante sua ausência, rasgou a própria túnica e, chorando, dizia: “Como poderei olhar para o rosto de meu pai Jacó?” Então pegou a prata e correu atrás dos mercadores; como não os encontrou, voltou angustiado. Os mercadores haviam deixado a estrada principal e seguido por um caminho mais curto através da região dos Trogloditas[c]. Rúben ficou profundamente triste e, naquele dia, não comeu pão.


    Então Dã se aproximou dele e disse: “Não chore nem fique aflito, pois já descobrimos o que diremos ao nosso pai. Vamos matar à espada um cabrito, manchar a túnica de José e enviá-la a Jacó, dizendo: ‘Veja se esta é a túnica de seu filho.’” E assim fizeram.[d] Por isso, Jacó chorou por José todos os seus dias.


    Meus irmãos ficaram com medo, e todos se arrependeram do que haviam feito a José. Os egípcios e os ismaelitas, porém, não lhe fizeram mal, porque o Senhor não permitiu que o maltratassem.


    José era um homem belo, de boa aparência e formoso de rosto. Não havia malícia nele; pelo contrário, era manso e tinha uma alma simples. Portanto, tenham compaixão, meus filhos, porque a compaixão faz bem a todos. Mesmo que alguém seja pecador, se tiver compaixão, o Senhor lhe atribuirá isso como justiça. E, ainda que prospere, se não tiver compaixão, o Senhor o destruirá.


    Nos dias de fome, lembrei-me da compaixão do Senhor e dei alimento a todo estrangeiro, órfão e viúva. Aos quarenta anos, tomei uma esposa, pois minha vida havia transcorrido em esforço e trabalho e, por causa de minha simplicidade, eu não possuía riquezas. Meu pai me havia abençoado, dizendo: “Seus filhos serão como um refúgio para os marinheiros e como um porto para os navios.”


    Agora, meus filhos, eu lhes ordeno: tratem todas as pessoas com misericórdia e compaixão, para que o Senhor também tenha compaixão de vocês. Nos últimos dias, vocês se afastarão do Senhor, provocarão Levi à ira e se levantarão contra Judá. Não prevalecerão contra eles, porém, pois um anjo do Senhor guiará a ambos, porque por meio deles Israel permanecerá firme.


    Sempre que se afastarem do Senhor, vocês andarão em toda espécie de mal e praticarão as abominações das nações. Seguirão mulheres e serão escravizados por toda perversidade, enquanto os espíritos do engano agirem em vocês. Li no escrito de Enoque que seus filhos também serão corrompidos nos últimos dias, cometerão injustiças contra os filhos de Levi e pecarão contra Judá. Mas não conseguirão resistir-lhes, pois de Levi o Senhor levantará um sacerdote, e de Judá, um rei, Deus e homem.[e] Ele salvará todas as nações e o povo de Israel.


    Agora lhes ordeno, meus filhos: obedeçam a Zebulom, seu pai; tenham misericórdia de seus próximos e compaixão de todos, não somente das pessoas, mas também dos animais. Por causa disso, o Senhor me abençoou. Quando todos os meus irmãos adoeceram, eu permaneci livre de enfermidade, pois o Senhor conhece a intenção de cada pessoa.


    Portanto, tenham compaixão no íntimo, meus filhos, porque, da mesma maneira que alguém trata seu próximo, assim também o Senhor o tratará. Vi os filhos de meus irmãos adoecerem e morrerem porque não tinham compaixão; meus filhos, porém, foram preservados de todo mal, como vocês sabem. Nos dias em que vivi em Canaã, não obtive ganho por meio de balança de pesos, nem mantive em minha casa duas medidas diferentes[f]. Antes, repartia tudo o que possuía com todos, com coração sincero. Não guardei ressentimento contra ninguém e, mesmo em idade avançada, mantive minha integridade em todas as coisas.


    Vocês também, portanto, meus filhos, guardem a lei do Senhor, tenham misericórdia de seu próximo e tratem a todos com compaixão, não somente às pessoas, mas também aos animais irracionais. Por causa disso, encontrei misericórdia diante do Senhor, todos me abençoaram, e o Senhor multiplicou mil vezes os meus bens. Pois quem tem compaixão faz bem à própria alma.


    Saibam, portanto, meus filhos, que nos últimos tempos vocês se afastarão do Senhor, ficarão divididos em Israel, seguirão dois males e não serão encontrados na assembleia dos justos. Depois dessas coisas, porém, o próprio Senhor se levantará para vocês como luz da justiça; ele curará e salvará a todos. Trará de volta os cativos de Beliar[g], converterá ao Senhor os corações desobedientes e concederá paz eterna aos que invocam seu nome.


    Os santos repousarão no Éden, e os justos se alegrarão na Nova Jerusalém, que existirá para a glória de Deus para sempre. Jerusalém já não sofrerá desolação, nem Israel será levado ao cativeiro, pois o Senhor estará no meio dela e habitará entre os seres humanos. O Santo de Israel reinará sobre eles com humildade e pobreza, e todo aquele que nele crer reinará em verdade nos céus.


    Agora, meus filhos, temam o Senhor, seu Deus, e guardem-se de Satanás e de seus espíritos. Aproximem-se de Deus e do anjo que intercede por vocês, pois ele é mediador entre Deus e os seres humanos para a paz de Israel. Ele se levantará contra o reino do inimigo; por isso, o inimigo procura destruir todos os que invocam o Senhor. Pois sabe que, no dia em que Israel se arrepender, o reino do inimigo chegará ao fim.


    O próprio anjo da paz fortalecerá Israel para que não caia no extremo do mal. No tempo da transgressão de Israel, o Senhor não abandonará seu povo, mas o transformará numa nação que faz a sua vontade, pois nenhum anjo é igual a ele. Seu nome está em todo lugar, tanto em Israel como entre as nações.


    Guardem-se, portanto, de toda obra má; rejeitem o ódio e todo engano e amem uns aos outros com sinceridade e paciência. Transmitam a seus filhos aquilo que ouvi de meu pai, para que o Salvador das nações os receba, pois ele é manso e humilde e, por seu próprio exemplo, ensina a lei de Deus.


    Fujam, portanto, de toda injustiça e apeguem-se à justiça da lei do Senhor. Assim, a descendência de vocês permanecerá para sempre, e vocês serão abençoados em todas as suas gerações.


    Depois de lhes ordenar essas coisas, Zebulom estendeu os pés e morreu em boa velhice. Seus filhos o puseram num caixão. Mais tarde, levaram-no para Hebrom e o sepultaram junto de seus antepassados.


    [a] Os testemunhos gregos variam entre “depois de ter sido vendido” e uma leitura referente a José ter sido lançado na cisterna. A segunda se ajusta à sequência da cena, na qual ele ainda não havia sido vendido. Além disso, o texto α omite a frase seguinte sobre os três dias e três noites na cisterna; essa frase é atestada no texto β.


    [b] O texto grego aqui apresentado inclui Dã entre os que Judá temia que matassem José; alguns testemunhos mencionam somente Simeão e Gade.


    [c] “Trogloditas” é o etnônimo grego, literalmente associado a moradores de cavernas. Provavelmente designa um povo ou uma região situada numa rota comercial mais curta.


    [d] A partir deste ponto, o capítulo aparece de forma mais extensa na tradição grega ampla do que no trecho abreviado reproduzido no início da sequência de páginas. A tradução acompanha o texto contínuo mais amplo representado na tradição dos testemunhos gregos da edição de Charles.


    [e] A frase “de Levi [...] um sacerdote, e de Judá, um rei, Deus e homem” é frequentemente considerada por estudiosos uma ampliação cristã posterior. Foi mantida porque consta da tradição manuscrita grega seguida aqui.


    [f] “Duas medidas diferentes” refere-se provavelmente à prática comercial desonesta de usar medidas desiguais conforme a conveniência do vendedor.


    [g] “Beliar” reproduz a forma grega do nome também conhecido como “Belial”.'
