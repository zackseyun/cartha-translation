    Agora, meus filhos, temam o Senhor, seu Deus, e guardem-se de Satanás e de seus espíritos. Aproximem-se de Deus e do anjo que intercede por vocês, pois ele é mediador entre Deus e os seres humanos para a paz de Israel. Ele se levantará contra o reino do inimigo; por isso, o inimigo procura destruir todos os que invocam o Senhor. Pois sabe que, no dia em que Israel se arrepender, o reino do inimigo chegará ao fim.


    O próprio anjo da paz fortalecerá Israel para que não caia no extremo do mal. No tempo da transgressão de Israel, o Senhor não abandonará seu povo, mas o transformará numa nação que faz a sua vontade, pois nenhum anjo é igual a ele. Seu nome está em todo lugar, tanto em Israel como entre as nações.


    Guardem-se, portanto, de toda obra má; rejeitem o ódio e todo engano e amem uns aos outros com sinceridade e paciência. Transmitam a seus filhos aquilo que ouvi de meu pai, para que o Salvador das nações os receba, pois ele é manso e humilde e, por seu próprio exemplo, ensina a lei de Deus.


    Fujam, portanto, de toda injustiça e apeguem-se à justiça da lei do Senhor. Assim, a descendência de vocês permanecerá para sempre, e vocês serão abençoados em todas as suas gerações.


