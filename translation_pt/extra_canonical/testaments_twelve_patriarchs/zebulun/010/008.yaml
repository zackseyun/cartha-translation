lexical_decisions:
- source_word: ἀνάπαυσίν
  choice: descanso
  rationale: Preserva a imagem do repouso associado à morte sem explicitar além do que o grego afirma.
- source_word: ἀποτρέχω
  choice: me apresso
  rationale: Expressa o movimento célere indicado pelo verbo no contexto, de forma natural em português.
- source_word: πατέρες
  choice: pais
  rationale: Mantém o sentido literal de antepassados paternos; no contexto, refere-se aos patriarcas que morreram antes dele.
theological_decisions:
- issue: Sentido de “descanso”
  choice: Manter a metáfora “meu descanso”
  alternative: Explicitar como “minha morte” ou “meu repouso após a morte”
  rationale: O texto grego emprega uma metáfora e não define aqui a natureza do estado após a morte; mantê-la preserva a ambiguidade e evita impor uma interpretação teológica.
