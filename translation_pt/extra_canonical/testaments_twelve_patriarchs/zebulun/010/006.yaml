  text: 2. Ἀναστήσομαι γὰρ⁴ πάλιν *ἐν μέσῳ⁵ ὑμῶν, ⌈ὡς ἡγούμενος *ἐν μέσῳ⁶ υἱῶν δικαιοσύνης⌉, καὶ⁷ εὐφρανθήσομαι⁸ *ἐν μέσῳ⁹ τῆς φυλῆς μου, *οἵτινες φυλάξουσιν¹⁰ νόμον Κυρίου [καὶ ἐντολὰς¹¹ Ζαβουλὼν πατρὸς αὐτῶν].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/006.yaml
  text: For I will rise again in your midst, as a leader in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, those who keep the law of the Lord and the commandments of Zebulun their father.
translation:
  language: pt
  text: Pois me levantarei novamente no meio de vocês, como líder entre os filhos da justiça, e me alegrarei no meio da minha tribo, os que guardarão a lei do Senhor [e os mandamentos de Zebulom, seu pai][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “e os mandamentos de Zebulom, seu pai” aparece entre colchetes na edição grega, indicando incerteza textual.
    reason: Torna visível ao leitor a condição textual da cláusula final sem suprimi-la.
lexical_decisions:
- source_word: Ἀναστήσομαι
  choice: me levantarei novamente
  rationale: Preserva o sentido básico de voltar a levantar-se, sem decidir explicitamente entre reaparecimento e ressurreição.
- source_word: ἡγούμενος
  choice: líder
  rationale: Expressa de modo natural a função de quem guia ou governa, sem acrescentar um título institucional.
- source_word: υἱῶν δικαιοσύνης
  choice: filhos da justiça
  rationale: Mantém a expressão semítica e sua força teológica, em vez de reduzi-la a simplesmente 'justos'.
- source_word: εὐφρανθήσομαι
  choice: me alegrarei
  rationale: Verbo corrente e digno que comunica alegria intensa sem exagero lexical.
- source_word: φυλάξουσιν
  choice: guardarem
  rationale: No contexto de lei e mandamentos, 'guardar' conserva a ideia de observar fielmente.
theological_decisions:
- issue: Possível referência à ressurreição em Ἀναστήσομαι πάλιν
  choice: me levantarei novamente
  alternative: ressuscitarei
  rationale: A tradução mantém a ambiguidade lexical do grego e evita impor que a frase seja necessariamente uma afirmação técnica de ressurreição.
- issue: Cláusula final textualmente marcada
  choice: incluída entre colchetes
  alternative: omitir a cláusula ou incorporá-la sem marcação
  rationale: A edição-fonte assinala a cláusula καὶ ἐντολὰς Ζαβουλὼν πατρὸς αὐτῶν com colchetes; sua inclusão preserva o texto apresentado, e a marcação informa a incerteza textual.
- issue: Identidade dos que guardam a lei
  choice: aqueles que guardarem
  alternative: todos os que guardarem
  rationale: O relativo οἵτινες caracteriza os membros da tribo mencionados, mas não contém por si só um quantificador explícito como 'todos'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se a repetição de “no meio”, a expressão “filhos da justiça” e a ambiguidade de “me levantarei novamente”. O futuro do subjuntivo em “guardarem” é idiomático em português após “aqueles que” numa caracterização prospectiva.
