base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/010.yaml
  text: And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.
translation:
  language: pt
  text: Depois de dizer essas coisas, ele adormeceu, e seus filhos o colocaram num caixão de madeira. Mais tarde, subiram levando-o consigo e o sepultaram em Hebrom, junto de seus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Preserva o eufemismo grego para a morte, sem explicitar além do texto.
- source_word: θήκην ξυλίνην
  choice: caixão de madeira
  rationale: Expressa de modo natural e preciso o recipiente funerário de madeira mencionado no contexto.
- source_word: ἀναγαγόντες
  choice: subiram levando-o consigo
  rationale: Conserva tanto o movimento ascendente indicado pelo verbo quanto o transporte do corpo, com formulação compreensível em português.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: junto de seus antepassados
  rationale: No contexto de sepultamento ancestral, «antepassados» comunica melhor o sentido coletivo de πατέρες do que o potencialmente ambíguo «pais».
theological_decisions:
- issue: O sono como linguagem para a morte
  choice: Manter «adormeceu»
  alternative: Traduzir como «morreu»
  rationale: A metáfora pertence ao texto grego e pode carregar ressonância teológica; traduzi-la diretamente como morte eliminaria essa nuance.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. A construção «subiram levando-o consigo» retém a orientação espacial do grego sem tornar a frase excessivamente literal.
