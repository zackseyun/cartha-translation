  text: But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations.
translation:
  language: pt
  text: Mas o Senhor fará vir fogo eterno sobre os ímpios e os destruirá até gerações de gerações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: ímpios
  rationale: Expressa de modo natural a falta de reverência e oposição a Deus, preservando o sentido religioso do termo grego.
- source_word: ἐπάξει
  choice: fará vir
  rationale: Reproduz o valor causativo/futuro do verbo sem tornar a frase artificial em português.
- source_word: πῦρ αἰώνιον
  choice: fogo eterno
  rationale: É a correspondência direta e tradicional, mantendo aberta a extensão semântica de αἰώνιον no contexto.
- source_word: ἀπολεῖ
  choice: destruirá
  rationale: Preserva o sentido forte de arruinar ou fazer perecer, sem especificar além do que o grego declara.
- source_word: ἕως γενεὰς γενεῶν
  choice: por gerações e gerações
  rationale: Comunica em português corrente a expressão intensiva de duração e acompanha a leitura adotada pelo texto-fonte e pela camada inglesa auditada.
theological_decisions:
- issue: Relação entre “fogo eterno” e “por gerações e gerações”
  choice: Manter ambas as expressões sem harmonizá-las interpretativamente
  alternative: Uniformizar a duração com fórmulas como “para todo o sempre”
  rationale: O grego contém uma possível tensão entre αἰώνιον e ἕως γενεὰς γενεῶν; a tradução deve preservá-la em vez de resolver sua implicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição “gerações e gerações” conserva o caráter semítico e enfático da formulação.
