  text: 3. Ἐπὶ δὲ τοὺς ἀσεβεῖς ἐπάξει¹² Κύριος πῦρ αἰώνιον, καὶ ἀπολεῖ¹³ αὐτοὺς *ἕως γενεὰς γενεῶν¹⁴.
