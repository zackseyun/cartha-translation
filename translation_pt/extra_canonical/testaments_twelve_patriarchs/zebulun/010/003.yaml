source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἐπιστρέψει *πάντα τὰ⁶⁰ ἔθνη εἰς παραζήλωσιν αὐτοῦ⁶¹, καὶ ὄψεσθε *θεὸν ἐν σχήματι ἀνθρώπου⁶² *ὃν ἂν ἐκλέξηται Κύριος Ἱερουσαλὴμ ὄνομα αὐτῷ⁶³.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/003.yaml
  text: And he will turn all the nations to his jealousy, and you will see God in human form, whom the Lord will choose for him—Jerusalem is his name.
translation:
  language: pt
  text: E ele levará todas as nações a sentir ciúme dele[a], e vocês verão Deus em forma humana, aquele que o Senhor escolher para ele[b] — Jerusalém é o seu nome.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «à emulação dele». A relação de «dele» com «ciúme» é sintaticamente ambígua no grego.'
    reason: παραζήλωσιν pode denotar ciúme, inveja ou emulação; αὐτοῦ não explicita de modo inequívoco como o referente se relaciona com esse ciúme.
  - marker: b
    text: A construção grega é difícil; também pode ser entendida como «a quem quer que o Senhor escolha para ele».
    reason: ὃν ἂν, ἐκλέξηται e αὐτῷ formam uma sequência relativa indefinida cuja ligação exata permanece incerta.
  - marker: c
    text: 'Literalmente: «Jerusalém, nome para ele»; não está claro a quem «ele» se refere.'
    reason: A oração nominal e αὐτῷ preservam uma ambiguidade de referente no texto grego.
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: fará ... voltarem-se
  rationale: Expressa o sentido causativo do futuro grego de modo natural em português.
- source_word: παραζήλωσιν
  choice: ciúme
  rationale: Preserva o campo semântico de ciúme ou emulação, sem reduzir o termo a mero zelo favorável.
- source_word: ἐν σχήματι ἀνθρώπου
  choice: em forma humana
  rationale: Tradução natural e fiel, sem sugerir necessariamente um indivíduo masculino específico.
- source_word: ἐκλέξηται
  choice: escolher
  rationale: Mantém o valor do subjuntivo aoristo médio na oração relativa indefinida.
- source_word: ὄνομα αὐτῷ
  choice: é o seu nome
  rationale: Reproduz a construção nominal grega em português corrente, mantendo ambíguo o referente do pronome.
theological_decisions:
- issue: Referência de αὐτοῦ em «para o ciúme dele»
  choice: Manter o pronome sem explicitar o referente
  alternative: Substituir por «ciúme de Deus» ou «ciúme daquele escolhido»
  rationale: O antecedente não é inequívoco no fragmento fornecido; explicitá-lo resolveria indevidamente uma ambiguidade textual.
- issue: Identidade de «Deus em forma humana» e do escolhido
  choice: Traduzir literalmente a sequência como uma construção apositiva
  alternative: Interpretar o escolhido como pessoa distinta ou reformular cristologicamente
  rationale: A sintaxe associa ὃν ao referente masculino/conceitual da expressão anterior, mas o texto é difícil e não deve receber harmonização doutrinária.
- issue: Referente de «seu» na frase sobre Jerusalém
  choice: Preservar a ambiguidade pronominal
  alternative: Explicitar «o nome dele» com um referente identificado
  rationale: O grego αὐτῷ não determina por si só, neste contexto fragmentário, qual personagem é nomeado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural. A formulação mantém as ambiguidades pronominais e a tensão da sintaxe grega, recorrendo a notas apenas onde uma tradução fluente poderia ocultá-las.
