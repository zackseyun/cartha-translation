  text: καὶ ἐπιστρέψετε⁵² *εἰς τὴν γῆν⁵³ ὑμῶν⁵⁴, καὶ ὄψεσθε αὐτὸν⁵⁵ ἐν Ἱερουσαλὴμ ⌈διὰ τὸ ὄνομα αὐτοῦ *τὸ ἅγιον⁵⁶⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/001.yaml
  text: And you will return to your land, and you will see him in Jerusalem because of his holy name.
translation:
  language: pt
  text: E vocês voltarão para a sua terra e o verão em Jerusalém, por causa do seu santo nome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψετε
  choice: voltarão
  rationale: Expressa de modo natural o sentido futuro de retornar ao lugar de origem.
- source_word: ὄψεσθε αὐτόν
  choice: o verão
  rationale: Preserva o pronome masculino e sua referência contextual sem explicitação interpretativa.
- source_word: διὰ τὸ ὄνομα αὐτοῦ τὸ ἅγιον
  choice: por causa do seu santo nome
  rationale: Mantém o valor causal mais direto de διά com acusativo e a linguagem reverente do original.
theological_decisions:
- issue: Referente de αὐτόν e αὐτοῦ
  choice: Manter os pronomes como “o” e “seu”
  alternative: Identificar explicitamente a pessoa referida
  rationale: O versículo isolado não nomeia o referente; explicitá-lo resolveria uma dependência contextual que o grego preserva.
- issue: Força de διὰ com acusativo
  choice: “por causa de”
  alternative: “em nome de” ou “por meio de”
  rationale: A construção indica normalmente causa ou motivo; a tradução evita introduzir uma ideia instrumental não exigida pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e preservação da referência pronominal ambígua do grego.
